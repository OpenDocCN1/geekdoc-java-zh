    \ increment is: \"+ x.value);\n    increment(x);\n    System.out.println(\"Value\
    \ of i after increment is: \"+ x.value);\n}}\n```\n\nOutput:\n\nValue of i before\
    \ increment is : 10\nValue of i after increment is : 11\n\n**Analysis:** Object\
    \ of class MyInt is passed to the method. Since the objects are passed by reference.\
    \ Value change in increment() function is reflected to the original object of\
    \ the caller function.\n\nPoints to remember:\n\n+   1. Call by reference is implemented\
    \ indirectly by passing the address of an instance class or array to the function."
