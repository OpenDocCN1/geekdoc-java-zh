  md: '# External Sort (External Merge-Sort)


    When data need to be sorted is huge. Moreover, it is not possible to load completely
    in memory (RAM) for such a dataset we use external sorting. Specific data is sorted
    using external Merge-Sort algorithm. First data are picked in chunks and it is
    sorted in memory. Then this sorted data is written back to disk. Whole data are
    sorted in chunks using Merge-Sort. Now we need to combine these sorted chunks
    into final sorted data.


    Then we create queues for the data, which will read from the sorted chunks. Each
    chunk will have its own queue. We will pop from this queue and these queues are
    responsible for reading from the sorted chunks. Let us suppose we have K different
    chunks of sorted data each of M


    The third step is using a Min-Heap, which will take input data from each of this
    queue. It will take one element from each queue. The minimum value is taken from
    the Heap and added to the final sorted element output. Then queue from which min
    element is inserted in the heap again popped and one more element from queue is
    added to the Heap. Finally, when the data is exhausted from some queue that queue
    is removed from the input list. Finally, we will get a sorted data came from the
    heap.


    We can optimize this process further by adding an output buffer, which will store
    data coming out of Heap and will do a limited number of the write operation in
    the Final space.


    ![](img/fe8f1cc519c7716e78f4de4934978705_183_0.png)


    **Note:** No one will be asking to implement external sorting in an interview,
    but it is good to know about it.'
