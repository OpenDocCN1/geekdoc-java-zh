  md: '# Abstract data type (ADT)


    An abstract data type (ADT) is a logical description of how we view the data and
    the operations that are allowed on it. ADT is defined as a user point of view
    of a data type. ADT concerns the possible values of the data and what are interface
    exposed by it.


    ADT does not concern about the actual implementation of the data structure.


    For example, a user wants to store some integers and find a mean of it. Does not
    talk about how exactly it will be implemented.


    ![](img/fe8f1cc519c7716e78f4de4934978705_92_0.png)'
