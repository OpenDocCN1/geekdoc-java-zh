    \ find the second element and exchange it with the second element. After N-1 passes,\
    \ the list will be fully sorted.\n\n```\n// Sorts given array by selection sort\n\
    // Input: An array A[0..n-1] of orderable elements\n// Output: Array A[0..n-1]\
