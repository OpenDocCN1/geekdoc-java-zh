  md: "# Nested Class\n\nA class within another class is called a nested class.\n\n\
    Compelling reasons for using nested classes include the following:\n\n+   1. It\
    \ is a way of logically grouping classes that are only used in one place: If a\
    \ class is useful to only one other class, then it is logical to embed it in that\
    \ class and keep the two together. Nesting such \"helper classes\" makes their\
    \ package more streamlined.\n2. It increases encapsulation: Consider two top-level\
    \ classes, A and B, where B needs access to members of A that would otherwise\
    \ be declared private. By hiding class within A, A's members can be declared private\
    \ and B can access them. In addition, B itself can be hidden from the outside\
    \ world.\n3. It can lead to more readable and maintainable code: Nesting small\
    \ classes within top-level classes places the code closer to where it is used.\n\
    \nA nested class has an independent set of modifiers from the outer class. Visibility\
    \ modifiers (public, private and protected) effect whether the nested class definition\
    \ is accessible beyond the outer class definition. For example, a private nested\
    \ class can be used by the outer class, but by no other classes.\n\nExample 1.11:\
    \ Demonstrating Nested Class\n\n```\npublic class OuterClass {\nclass NestedClass\
    \ {\n    // NestedClass fields and methods.\n}\n// OuterClass fields and methods.\n\
    }\n```\n\nLet us take example of LinkedList and Tree class. Both the linked list\
    \ and tree nodes to store new element. Both the linked list and tree have their\
    \ nodes different, so it is best to declare their corresponding nodes inside their\
    \ own class to prevent name conflict and increase encapsulation.\n\nExample 1.12:\n\
    \n```\npublic class LinkedList {\nprivate static class Node {\n    private int\
    \ value;\n    private Node next;\n    // Nested Class Node other fields and methods.\n\
    }\nprivate Node head;\n// Outer Class LinkedList other fields and methods.\n}\n\
    ```\n\n```\npublic class Tree {\nprivate static class Node {\n```"
