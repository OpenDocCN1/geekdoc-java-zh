  md: '# Design for Elevator of a building


    # Scenarios


    A typical lift has buttons (Elevator buttons) inside the cabin to let the user
    who got the lift to select/his desired floor. Similarly, each floor has buttons
    (Floor buttons) to call the lift to go floors above and a floor below respectively.
    The buttons illuminate indicating the request is accepted. In addition, the button
    stops illuminating when the lift reaches the requested floor.


    Use cases:

    User


    +   - Presses the floor button to call the lift

    - Presses the elevator button to move to the desired floor


    Floor Button & Elevator Button


    +   - Illuminates when pressed by user

    - Places an elevator request when pressed


    Elevator


    +   - Moves up/down as per instruction

    - Opens/closes the door


    # Design


    Each button press results in an elevator request which has to be served. Each
    of these requests is tracked at a centralized place. Elevator Requests, the class
    that stores, elevator requests can use different algo to schedule the elevator
    requests. The elevator is managed by a controller class, which we call Elevator
    Controller. Elevator controller class provide instructions to the elevator.

    ator controller reads the next elevator request to be processed and served.'
  merge: -1
  pgno: 531
- img_proc: true
  md: '![](img/fe8f1cc519c7716e78f4de4934978705_532_0.png)


    The button is an abstract class defining common behavior like illuminate, doNotIlluminate.
    FloorButton, Elevator Button extends Button type and define placeRequest () method
    which is invoked when a button is pressed. When a floor button or elevator button
    presses a requests is added to a common queue. ElevatorController reads the request
    and instruct next action to the elevator.


    How can we extend this multiple elevators?


    In the single elevator scenario, there is a single elevator and an elevator controller
    and a common server where the floor requests and the elevator button requests
    are stored. Which are processed as per the scheduling algorithm.


    To extend to multiple elevator scenarios there will still be single elevator controller.
    Floor based requests can be served by any elevator whereas elevator button requests
    will be served only by the elevator to whom it belongs.


    FloorButton''s placeRequest() adds a request to a common queue, which is accessed
    by the elevator controller thereby assigning the request to one of the elevators.
    ElevatorButton''s placeRequest adds a request to the elevator directly as it is
    supposed to serve it. Elevator controller will be running various algorithms like
    shortest seek etc. to decide which lift is supposed to handle which request.'
  merge: -1
