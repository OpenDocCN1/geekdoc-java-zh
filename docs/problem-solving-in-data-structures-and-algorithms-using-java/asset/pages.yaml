  md: '# Introduction


    We have already read about various linear data structures like an array, linked
    list, stack, queue etc.

    Both array and linked list have a drawback of linear time required for searching
    an element.


    A tree is a nonlinear data structure, which is used to represent hierarchical
    relationships (parent-child relationship). Each node is connected by another node
    by directed edges.


    Example 1: Tree in organization


    ![](img/fe8f1cc519c7716e78f4de4934978705_273_0.png)


    Example 2: Tree in a file system


