  md: '![](img/fe8f1cc519c7716e78f4de4934978705_116_0.png)


    # Ternary Search Trie/ Ternary Search Tree


    Tries having a very good search performance of O(M) where M is the maximum size
    of the search string. However, tries having very high space requirement. Every
    node Trie contain to references to multiple nodes, each reference corresponds
    to possible characters of the key. To avoid this high space requirement Ternary
    Search Trie (TST) is used.


    A TST avoid the heavy space requirement of the traditional Trie while still keeping
    many of its advantages. In a TST, each node contains a character, an end of key
    indicator, and three references. The three references are corresponding to current
    char hold by the node(equal), characters less than and character greater than.


    The Time Complexity of ternary search tree operation is proportional to the height
    of the ternary search tree. In the worst case, we need to traverse up to 3 times
    that many links. However, this is rare.


    Therefore, TST is a very good solution for implementing Symbol Table, Partial
    match and range query.'
