    # Min Heap Operations


    | Insert | O(logn) |

    | --- | --- |

    | DeleteMin | O(logn) |

    | Remove | O(logn) |

    | FindMin | O(1) |


    Throughout this chapter, the word "heap" will always refer to a max-heap. The
