- img_proc: true
  md: '# Introduction


    While solving problems using Divide-and-Conquer method, there may be a case when
    recursively sub-problems can result in the same computation being performed multiple
    times. This problem arises when there are identical sub-problems arise repeatedly
    in a recursion.


    Dynamic programming is used to avoid the requirement of repeated calculation of
    same sub-problem. In this method we usually store the result of sub - problems
    in some data structure (like a table) and refer it to find if we have already
    calculated the solution of sub - problems before calculating it again.


    Dynamic programming is applied to solve problems with the following properties:


    +   1. Optimal Substructure: An optimal solution constructed from the optimal
    solutions of its sub-problems.

    2. Overlapping Sub problems: While calculating the optimal solution of sub problems
    same computation is repeated again and again.


    Examples:


    +   - Fibonacci numbers computed by iteration.

    - Assembly-line Scheduling

    - Matrix-chain Multiplication

    - 0/1 Knapsack Problem

    - Longest Binary Tree

    - Marshall''s algorithm for transitive closure implemented by iterations

    - Floyd''s algorithms for all-pairs shortest paths

    - Optimal Polygon Triangulation

    - Floyd-Warshall''s Algorithm


    Steps for solving / recognizing it DP applications.


    +   1. Optimal Substructure: Try to find if there is a recursive relation between
    problem and sub-problem.

    2. Write recursive relation of the problem. (Observe Overlapping Sub problems
    at this step.)

    3. Compute the value of sub problems in a bottom up fashion and store this value
    in some table.

    4. Construct the optimal solution from the value stored in step 3.

    5. Repeat step 3 and 4 till you get your solution.'
