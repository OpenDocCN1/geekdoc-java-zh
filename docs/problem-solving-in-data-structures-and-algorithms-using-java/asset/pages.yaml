    \ or high Time Complexity in worst case.\n\n# Example 5.1\n\n```\nboolean linearSearchUnsorted(int[]\
    \ arr, int size, int value) {\n  int i = 0;\n  for(i = 0; i < size; i++) {\n \
    \   if(value == arr[i])\n      return true;\n  }\n  return false;\n}\n```\n\n\
    **Time Complexity: O(n).** As we need to traverse the complete array in worst\
    \ case. Worst case is when your desired element is at the last position of the\
    \ array. Here, 'n' is the size of the array.\n**Space Complexity: O(1).** No extra\
    \ memory is used to allocate the array."
