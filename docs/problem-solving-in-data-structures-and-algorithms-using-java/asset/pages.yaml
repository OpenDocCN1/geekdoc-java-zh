  md: "# Hashing with Open Addressing\n\nWhen using linear open addressing, the Hash-Table\
    \ is represented by a one-dimensional array with indices that range from 0 to\
    \ the desired table size-1.\n\nOne method of resolving collision is the look into\
    \ a Hash-Table and find another free slot the object that has caused the collision.\
    \ A simple way is to move from one slot to another in some sequential order until\
    \ we find a free space. This collision resolution process is called Open Addressing.\n\
    \n# Linear Probing\n\nIn Linear Probing, we try to resolve the collision of an\
    \ index of a Hash-Table by sequentially searching the Hash-Table free location.\
    \ Let us suppose, if k is the index retrieved from the hash function. if the kth\
    \ index is already filled then we will look for (k+1) %M, then (k+2) %M and so.\
    \ when we get a free slot, we will insert the object into that free slot.\n\n\
    Example 12.2: The resolver function of linear probing\n```c\nint resolverFun(int\
    \ i) {\n  return i;\n}\n```\n\n# Quadratic Probing\n\nIn Quadratic Probing, we\
    \ try to resolve the collision of the index of a Hash-Table by quadratic increasing\
    \ the search index free location. Let us suppose, if k is the index retrieved\
    \ from the hash function. if the kth index is already filled then we will look\
    \ for (k+1^2) %M, then (k+2^2) %M and so on. when we get a free slot, we will\
    \ insert the object into that free slot.\n\nExample 12.3: The resolver function\
    \ of quadratic probing\n```c\nint resolverFun(int i) {\n  return i * i;\n}\n```\n\
    \nTable size should be a prime number to prevent early looping should not be too\
    \ close to 2powN\n\n# Linear Probing implementation\n\nExample 12.4: Below is\
    \ a linear probing collision resolution Hash-Table implementation.\n```java\n\
    public class HashTable {\n  private static int EMPTY_NODE = -1;\n```"
