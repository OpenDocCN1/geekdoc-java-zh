  md: "# Dynamic Programming\n\nWhile solving problems using Divide-and-Conquer method,\
    \ there may be a case when recursively sub-problems can result in the same computation\
    \ being performed multiple times. This problem arises when there are identical\
    \ sub-problems arise repeatedly in a recursion.\n\nDynamic programming is used\
    \ to avoid the requirement of repeated calculation of same sub-problem. In this\
    \ method, we usually store the result of sub - problems in a table and refer that\
    \ table to find if we have already calculated the solution of sub - problems before\
    \ calculating it again.\n\nDynamic programming is a bottom up technique in which\
    \ the smaller sub-problems are solved first and the result of these are sued to\
    \ find the solution of the larger sub-problems.\n\nExamples:\n\n+   * Fibonacci\
    \ numbers computed by iteration.\n* Wallis's algorithm for transitive closure\
