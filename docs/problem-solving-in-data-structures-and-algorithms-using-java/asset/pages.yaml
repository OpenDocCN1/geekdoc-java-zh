  md: '# Conclusion


    Usually a given problem can be solved using a number of methods, however it is
    not wise to settle for the first method that comes to our mind. Some methods result
    in a much more efficient solutions than others.


    For example, the Fibonacci numbers calculated recursively (decrease-and-conquer
    approach), and computed by iterations (dynamic programming). In the first case
    the complexity is O(2ⁿ), and in the other case the complexity is O(n).


    Another example, consider sorting based on the Insertion-Sort and basic bubble
    sort. For almost sorted files Insertion-Sort will give almost linear complexity,
    while bubble sort sorting algorithms have quadratic complexity.


    The most important question is, how to choose the best method?

    First, you should understand the problem statement.

    Second by knowing various problems and there solutions.'
