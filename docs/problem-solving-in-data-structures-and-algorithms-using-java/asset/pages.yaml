    \ works as:\n\n+   - Start with element at last column and first row\n- If the\
    \ element is the value we are looking for, return true.\n- If the element is greater\
    \ than the value we are looking for, go to the element at previous\ncolumn but\
    \ same row.\n- If the element is less than the value we are looking for, go to\
    \ the element at next row but\nsame column.\n- Return false, if the element is\
    \ not found after reaching the element of the last row of the first\ncolumn. Condition\
    \ (row < r && column >= 0 ) is false.\n\nRunning time = O(N).\n\n# Example 5.37\n\
    \n```\nint FindElementIn2DArray(int arr[], int r, int c, int value)\n{\nint row\
    \ = 0;\nint column = c - 1;\nwhile (row < r && column >= 0) {\n    if (arr[row][column]\
    \ == value)\n        return 1;\n    else if (arr[row][column] > value)\n     \
    \   column--;\n    else\n        row++;\n}\nreturn 0;\n}\n```"
