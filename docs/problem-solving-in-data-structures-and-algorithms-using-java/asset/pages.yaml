  md: '# Problems in Heap


    # Kth Smallest in a Min Heap


    Just call DeleteMin() operation K-1 times and then call DeleteMin() this last
    operation give Kth smallest value. Time Complexity O(KlogN)


    # Kth Largest in a Max Heap


    Just call DeleteMax() operation K-1 times and then again DeleteMax() this last
    operation give Kth smallest value. Time Complexity O(KlogN)


    # 100 Largest in a Stream


    There are billions of integers coming out of a stream some get() function is providing
    integers one by one. How would you determine the largest 100 numbers?


    Solution: Large hundred (or smallest hundred etc.) such problems are solved very
    easily using a Heap. In our case, we will create a min heap.


    +   1. From 100 first integers builds a min heap.

    2. For each coming integer compare if it is greater than the top of the min heap.

    3. If not, then look for next integer. If yes, remove the top min value from the
    min heap, insert the new value at the top of the heap, use proolateDown, and move
    it to its proper position down the heap.

    4. Every time you have largest 100 values stored in your head


    # Merge two Heap


    How can we merge heaps?


    Solution: There is no single solution for this. Let us suppose the size of the
    bigger heap is N and the size of the smaller heap is M.


    +   1. If both are comparable size, then put both heap arrays in same bigger arrays.
    Or in one of the arrays if they are big enough. Apply CreateHeap() function which
    will take theta(N+M) time.

    2. If M is much smaller than N then add() each element of M array one by one to
    heap. This will take O(MlogN) the worst case or O(M) best case.


