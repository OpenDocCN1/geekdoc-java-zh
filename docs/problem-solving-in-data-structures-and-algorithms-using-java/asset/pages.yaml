  md: "# Object\n\nAn Object is an entity with state and behavior. A baby, a cat,\
    \ a dog, a bulb etc are all examples of objects. A baby has properties & states\
    \ (name, hungry, crying, sleeping etc.) and behaviors (feed, play, etc.). Another\
    \ example bulb has two states (on, off) and the two behaviors (turn on, off).\n\
    \nSoftware objects are just like real objects. They have state in the form of\
    \ member variables called fields (isOn) and expose behavior in the form of member\
    \ functions called methods (turn on, off).\n\nHiding internal details (state)\
    \ of the object and allowing all the actions to be performed over the objects\
    \ using methods is known as data-encapsulation.\n\nA Class is a prototype (blueprint)\
    \ of objects. An object is an instance of a class. Human is a class of living\
    \ being and a person named John is an instance of human class.\n\nExample 1.1:\n\
    \n```\nclass Bulb {\n    boolean isOn=false;\n\n    public void turnOn() {\n \
    \       isOn = true;\n    }\n\n    public void turnOff() {\n        isOn = false;\n\
    \    }\n}\n```\n\nIn this example, we have a class name Bulb. It has a member\
    \ variable isOn, which indicates its state that the bulb is on or off. It has\
    \ two methods turnOn() and turnoff() which will change the state of the object\
    \ from off to on and vice versa."
  merge: -1
  pgno: 21
