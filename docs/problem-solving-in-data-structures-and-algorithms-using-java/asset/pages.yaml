  md: "# Example 11.6: Give a data structure that will provide median of given values\
    \ in constant time. Solution: We will be using two heap one min heap and other\
    \ max heap. First, there will be a max heap which will contain the first half\
    \ of data and there will be an min heap which will contain the second half of\
    \ the data. Max heap will contain the smaller half of the data and its max value\
    \ that is at the top of the heap will be the median contender. Similarly, the\
    \ Min heap will contain the values of the data and its min value that is at its\
    \ will contain the median contender. We will keep track of the size of heaps.\
    \ Whenever we insert a value to heap, we will make sure that the size of two heaps\
    \ differs by max one, otherwise we will pop one element from one and insert into\
    \ another to keep them balanced.\n\n```\nimport java.util.Collections;\nimport\
    \ java.util.PriorityQueue;\n\npublic class MedianHeap {\n    PriorityQueue<Integer>\
    \ minHeap;\n    PriorityQueue<Integer> maxHeap;\n\n    public MedianHeap() {\n\
    \        minHeap = new PriorityQueue<Integer>();\n        maxHeap = new PriorityQueue<Integer>(Collections.reverseOrder());\n\
    \    }\n    //Other Methods.\n\n    public void insert(int value) {\n        if\
    \ (maxHeap.size() == 0 || maxHeap.peek() >= value ) \n            maxHeap.add(value);\n\
    \        else\n            minHeap.add(value);\n\n        //size balancing\n \
    \       if (maxHeap.size() > minHeap.size() + 1) {\n            value = maxHeap.remove();\n\
    \            minHeap.add(value);\n        }\n\n        if (minHeap.size() > maxHeap.size()\
    \ + 1) {\n            value = minHeap.remove();\n            maxHeap.add(value);\n\
    \        }\n    }\n\n    public int getMedian() {\n        if (maxHeap.size()\
    \ == 0 && minHeap.size() == 0) \n            return Integer.MAX_VALUE;\n\n   \
    \     if (maxHeap.size() == minHeap.size()) \n            return (maxHeap.peek()\
    \ + minHeap.peek())/2;\n        else if (maxHeap.size() > minHeap.size()) \n \
    \           return maxHeap.peek();\n        else\n            return minHeap.peek();\n\
    \    }\n}\n```"
