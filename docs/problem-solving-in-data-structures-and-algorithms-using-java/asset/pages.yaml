  md: '# Linked List


    ![](img/fe8f1cc519c7716e78f4de4934978705_97_0.png)


    Linked lists are dynamic data structure and memory is allocated at run time. The
    concept of linked list is not to store data contiguously. Use links that point
    to the next elements.


    Performance wise linked lists are slower than arrays because there is no direct
    access to linked elements. The linked list is a useful data structure when we
    do not know the number of elements to be stored ahead of time. There are many
    flavors of linked list that you will see: linear, circular, doubly, and doubly
    circular.


    # Linked List ADT Operations


    Below is the API of Linked list.


    **Insert(k):** adds k to the start of the list

    Insert an element at the start of the list. Just create a new element and move
    references. So that this element becomes the new element of the list. This operation
    will take **O(1)** constant time.


    **Delete():** delete element at the start of the list

    Delete an element at the start of the list. We just need to move one reference.
    This operation also take **O(1)** constant time.


    **LinkedList():** display all the elements of the list.

    Start with the first element and then follow the references. This operation will
    take **O(N)** time.


    **Find(k):** find the position of element with value k

    Start with the first element and follow the reference until we get the value we
    are looking for or reach the end of the list. This operation will take **O(N)**
    time.

    Note: binary search does not work on linked lists.


    **FindKth(k):** find element at position k

    Start from the first element and follow the links until you reach the kth element.
    This operation'
