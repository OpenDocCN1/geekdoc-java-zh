  md: '# Ternary Search Trie/ Ternary Search Tree


    Tries have a very good search performance of O(M) where every node Trie contains
    references to multiple nodes, but tries have a very high space requirement. Each
    reference corresponds to possible characters of the key. To avoid this high space
    requirement Ternary Search Tree (TST) is used.


    A TST avoids the heavy space requirement of the traditional Trie while still keeping
    many of its advantages. In a TST each node contains a character, an end of key
    indicator, and three references. The three references are corresponding to current
    char held by the node (equal), characters less than and character greater.


    The Time Complexity of ternary search tree operation is proportional to the height
    of the ternary search tree. In the worst case, we need to traverse up to 3 times
    that many links. However, the case is rare.


    Therefore, TST is a very good solution for implementing Symbol Table, Partial
    match and range query.


    ![](img/fe8f1cc519c7716e78f4de4934978705_404_0.png)'
