  md: '# Testing


    Once the code is written, you are not done. It is most important that you test
    your code with several small test cases. It shows that you understand the importance
    of testing. It also gives confidence to your interviewer that you are not going
    to write a buggy code. Once you are done with, your coding it is a good practice
    that you go through your code line by line with some small test case. This is
    just to make sure your code is working as it is supposed to work.


    You should test few test cases.

    Normal test cases: These are the positive test cases, which contain the most common
    scenario, and focus is on the working of the base logic of the code. For example,
    if we''re going to write some algorithm for linked list, then this may contain
    what will happen when a linked list with 3 or 4 nodes is given as input. These
    test cases you should always run in your head before saying the code is done.


    Edge cases: These are the test cases, which are going to test the boundaries of
    the code. For the same linked list algorithm, edge cases may be how the code behaves
    when an empty list is passed or just one node is passed. These test cases you
    should always run in your head before saying the code is done. Edge cases may
    help to make your code more robust. Just few checks need to be added to the code
    to take care of the condition.


    Load testing: In this kind of test, your code will be tested with a huge data.
    This will allow us to test if your code is slow or too much memory intensive.

    Always follow these five steps never jump to coding before doing constraint analysis,
    idea generation, and Complexity Analysis: At least never, miss the testing phase.'
