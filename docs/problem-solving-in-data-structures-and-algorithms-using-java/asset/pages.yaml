  md: "# Example 14.8:\n\n```\npublic class TST {\n  Node class Node {\n    private\
    \ class Node {\n      char data;\n      boolean isLastChar;\n      Node left,\
    \ equal, right;\n\n    private Node(char d) {\n      data = d;\n      isLastChar\
    \ = false;\n      left = equal = right = null;\n    }\n  };\n}\npublic void insert(String\
    \ word) {\n  root = insert(root, word, 0);\n}\nprivate Node insert(Node curr,\
    \ String word, int wordIndex) {\n  if (curr == null) {\n    curr = new Node(word,char.charAt(wordIndex));\n\
    \  }\n  if (curr.charAt(wordIndex) < curr.data) {\n    curr.left = insert(curr.left,\
    \ word, wordIndex);\n  } else if (word.charAt(wordIndex) > curr.data) {\n    curr.right\
    \ = insert(curr.right, word, wordIndex);\n  } else {\n    if (wordIndex < word.length()\
    \ - 1) {\n      curr.equal = insert(curr.equal, word, wordIndex + 1);\n    } else\
    \ {\n      curr.isLastChar = true;\n    }\n  }\n  return curr;\n}\nprivate boolean\
    \ find(Node curr, String word, int wordIndex) {\n  if (curr==null) {\n    return\
