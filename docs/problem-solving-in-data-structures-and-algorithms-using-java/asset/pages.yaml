  md: '# Example


    Let us suppose the interviewer ask you to give a best sorting algorithm.

    Some interviewee will directly jump to Quick-Sort O(nlogn). Oops, mistake you
    need to answer many questions before beginning to solve this problem.


    Questions 1: What kind of data are we talking about? Are they integer s?

    Answer: Yes, they are integer s.


    Questions 2: How much data are we going to sort?

    Answer: May be thousands.


    Questions 3: What exactly is this data about?

    Answer: They store a person''s age


    Questions 4: What kind of data-structure used to hold this data?

    Answer: Data are given in the form of some array


    Questions 5: Can we modify the given data-structure? In addition, many, many,
    more...?

    Answer: No, you cannot modify the data structure provided


    Ok from the first answer, we will deduce that the data is integer. The data is
    not so big it just contains a few thousand entries. The third answer is interesting
    from this we deduce that the range of data is 1-150. Data is provided in an array.
    From fifth answer we deduce that we have to create our own data structure and
    we cannot modify the array provided. So finally, we conclude, we can just use
    bucket sort to sort the data. The range is 1-150 so we need 151-capacity integral
    array. Data is under thousands so we do not have to worry about data overflow
    and we get the solution in linear time O(N).


    Note: We will read sorting in the coming chapters.'
