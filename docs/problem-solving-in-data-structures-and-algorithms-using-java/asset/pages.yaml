  md: "# Primitive/ Basic Data Types\n\nPrimitive data types are the basic data types,\
    \ which are defined in the JAVA language. There are 8 different primitive data\
    \ types - byte, short, int, long, float, double, boolean, char. All primitive\
    \ values can be stored in a fixed amount of memory (between one and eight bytes)\n\
    \nAssignment of primitive data type is done by value. The content in primitive\
    \ data type is copied to another variable.\n\nComparison (==) in primitive variables\
    \ is done by comparing the value stored in the variable.\n\nParameter passing\
    \ of primitive variable is done by copying the content of the variable. (i.e.\
    \ pass-by-value). Since value is copied changes done on the parameter value inside\
    \ a method is not reflected by the caller of the function. Returning primitive\
    \ variable from a method return value stored in variable.\n\nLocal variables are\
    \ destroyed when returned from a method.\n\n| Primitive Data Type | Explanation\
    \ |\n| --- | --- |\n| Boolean | The value represents one bit of information. The\
    \ allowed values are true or false. |\n| Int | 32-bit signed two's complement\
    \ integer value from -2,147,483,648 to 2,147,483,647 |\n| Char | Single 16-bit\
    \ Unicode character. The value ranges from '\\u0000' (or 0) to '\\ffff' (or 65,535)\
    \ |\n| Byte | 8-bit signed two's complement integer value. The value ranges from\
    \ -32,768 to 32,767 |\n| Short | 16-bit signed two's complement integer value.\
    \ The value ranges from -2^63 to (2^63 -1) |\n| Long | 32-bit single-precision\
    \ floating-point number. |\n| Float | 64-bit double-precision floating-point number.\
    \ |\n\nExample 1.3: Demonstrating range of Primitive data type\n\n```\npublic\
    \ class MinMaxValueTest {\n    public static void main(String[] args) {\n    \
    \    byte maxValue = Byte.MAX_VALUE;\n        byte minValue = Byte.MIN_VALUE;\n\
    \        short maxShort = Short.MAX_VALUE;\n        short minShort = Short.MIN_VALUE;\n\
    \        int maxInteger = Integer.MAX_VALUE;\n        int minInteger = Integer.MIN_VALUE;\n\
    \        long maxLong = Long.MAX_VALUE;\n        long minLong = Long.MIN_VALUE;\n\
    \        float maxFloat = Float.MAX_VALUE;\n        float minFloat = Float.MIN_VALUE;\n\
    \        double maxDouble = Double.MAX_VALUE;\n        double minDouble = Double.MIN_VALUE;\n\
    \        System.out.println(\"Range of byte :: \" + minValue + \" to \" + maxValue);\n\
    \        System.out.println(\"Range of short :: \" + minShort + \" to \" + maxShort);\n\
    ```"
