  md: "# Variable\n\n\"Variables\" are simply storage locations for data. For every\
    \ variable, some memory is allocated. The size of this memory depends on the type\
    \ of the variable.\n\n# Example 1.2:\n\n```\npublic class static void main(String[]\
    \ args) {\n    int var1\n```\n\n# Analysis:\n\n+   - Memory is allocated for variables\
    \ var1, var2 and var3. Whenever we declare a variable (premative type variable),\
    \ then memory is allocated for storing the value in the variable. In our example,\
    \ 4 bytes are allocated for each of the variable.\n- Value 100 is stored in variable\
    \ var1 and value 200 is stored in variable var2.\n- Value of var1 and var2 is\
    \ added and stored in var3.\n- Finally, the value of var1, var2 and var3 is printed\
    \ to screen using System.out.println(); built-in method."
