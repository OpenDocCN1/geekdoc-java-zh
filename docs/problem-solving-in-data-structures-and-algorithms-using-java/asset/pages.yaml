  md: "# First JAVA Program\n\n![](img/fe8f1cc519c7716e78f4de4934978705_19_0.png)\n\
    \nIt is tradition to discuss a HelloWorld program in the start which will print\
    \ the phrase \"Hello, World!\" to the output screen. So let us start discussing\
    \ it. This is a small program but it contains many common features of all the\
    \ JAVA programs.\n\n+   1. This program begins with “public class HelloWorld\"\
    :n    a. A class is the basic unit of encapsulation. Keyword class is used to\
    \ create a new class in our class HelloWorld is created. The class name is the\
    \ same as the name of the file, which will contain this. Therefore, in our case\
    \ the name of the file is HelloWorld.java. A class contains data and methods.\n\
    \    b. The keyword public is an access modifier, which sets the accessibility\
    \ of classes. A public class can be accessed from any class within the JAVA program.\n\
    2. Next are the comments, which are for readability of the program and are ignored\
    \ by the compiler.\n    a. A single line comment begins with two forward slash\
    \ /\n    b. A multiline comment begins with/* and ends with *//\n3. “public static\
    \ void main(String[] args)\":n    a. A method is a set of statements that are\
    \ executed to give desire result.\n    b. main() is a special method of a class\
    \ which is the entry point of the application.\n    c. The keyword public with\
    \ the method means that it can be accessed from any class of the application.\n\
    \    d. A keyword static in the method specifies that the method is a class method\
    \ and will be called directly from the class name. It does not require any object\
    \ to call this."
  merge: -1
  pgno: 19
- img_proc: true
  md: '+   e. The void keyword means that this method is not going to return anything.


    +   4. System.out.println("Hello, World!") is a system provided method which will
    print "Hello, World!" to the standard output.'
