  md: '![](img/fe8f1cc519c7716e78f4de4934978705_505_0.png)


    Raid (Redundant Array of Inexpensive Disk): Raid is a technology to create redundancy
    in the databases. Multiple hard drives are used to replicate data, thereby proving
    redundancy.


    # # Caching


    A cache is a simple key-value store and it should reside as a buffering layer
    between your application and your data storage. Whenever your application wants
    to read, it first tries to retrieve the data from your cache. Only if data is
    not present in the cache, then only it tries to get the data from the main database.


    Caching improves application performance by storing data in memory for low-latency
    access. We need databases and access to the database is slow, so we use multiple
    types of caching to make our system faster. Database servers itself does caching
    so do the other entities in between the user and the database.


    Memcached: It is a server software, and what it is kept whatever you access in
    memory. It can run on the same server as the webserver or it can run on a separate
    machine all together.


    Redis: It is a data structure server based on **NoSQL** which is a key-value data
    store. Data is stored as the value with respect to corresponding key. This data
    is later retrieved by the use of the key. Redis is used for caching it is best
    to store the whole object as one instance so that the data can be accessed in
    parallel and data expiration will flush out the object.


    There is a problem since ram is finite, the cache will get full. The expired object
    will be removed so everything that is accessed then its expiry will be reset and
    if the expired is an object that is not used for some time then it was deleted.
    Cache is more important when the website that we are designing is more read heavier
    than a write.'
