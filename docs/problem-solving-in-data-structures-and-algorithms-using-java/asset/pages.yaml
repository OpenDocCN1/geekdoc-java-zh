  md: '# Closest Pair


    Given N points in 2-dimensional plane, find two points whose mutual distance is
    smallest.


    ![](img/fe8f1cc519c7716e78f4de4934978705_460_0.png)


    A brute force algorithm takes each and every point and find its distance with
    all the other points in the plane. And keep track of the minimum distance points
    and minimum distance. The closest pair will be found in O(n^2) time.


    Let us suppose there is a vertical line which divide the graph into two separate
    parts (let''s call it left and right part). The brute force algorithm, we will
    notice that we are comparing all the points in the left half with the points in
    the right half. This is the point where we are doing some extra work.


    ![](img/fe8f1cc519c7716e78f4de4934978705_460_1.png)


    To find the minimum we need to consider only three cases:


    +   1) Closest pair in the right half

    2) Closest pair in the left half

    3) Closest pair in the boundary region of the two halves. (Gray)'
