  md: '# Master Theorem


    The master theorem solves recurrence relations of the form:

    T(n) = a T(n/b) + f(n)


    It is possible to determine an asymptotic tight bound in these three cases:

    Case 1: when f(n)=Θ(nlogᵇᵃ-ε) and constant ε > 1, then the final Time Complexity
    will be:

    T(n)=Θ(nlogᵇᵃ)


    Case 2: when f(n)=Θ(nlogᵇᵃ logᵏ n) and constant k ≥ 0, then the final Time Complexity
    will be:

    T(n)=Θ(nlogᵇᵃ logᵏ⁺¹ n)


    Case 3: when f(n)=Ω(nlogᵇᵃ+ε) and constant ε > 1, then the final Time Complexity
    will be:

    T(n)=Θ(f(n))


    ![](img/fe8f1cc519c7716e78f4de4934978705_453_0.png)


    Modified Master theorem: This is a shortcut to solving the same problem easily
    and fast. If the recurrence relation is in the form of T(n)=a T(n/b) + dx''ᵈ'
