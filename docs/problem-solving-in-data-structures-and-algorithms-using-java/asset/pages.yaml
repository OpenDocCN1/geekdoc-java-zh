  md: 'A Path is a sequence of edges between two vertices. The length of a path is
    defined as the sum of the weight of all the edges in the path.


    Two vertices u and v are adjacent if there is an edge whose endpoints are u and
    v.


    In the below graph:

    V = { V1, V2, V3, V4, V5, V6, V7, V8, V9 }


    E = {(V1,V0,1), (V2,V1,2), (V3,V2,3), (V3,V4,4), (V5,V4,5), (V1,V5,6), (V2,V5,7),
    (V3,V5,8), (V4,V5,9)}


    ![](img/fe8f1cc519c7716e78f4de4934978705_366_0.png)


    The in-degree of a vertex v, denoted by indeg(v) is the number of incoming edges
    to the vertex v. The out-degree of a vertex v, denoted by outdeg(v) is the number
    of outgoing edges of a vertex v. The degree of a vertex v, denoted by deg(v) is
    the total number of edges whose endpoint is v.


    deg(v) = Indeg(v) + outdeg(v)


    In the above graph

    deg(V4)=3, indeg(V4)=2 and outdeg(V4)=1


    A Cycle is a path that starts and ends at the same vertex and includes at least
    one vertex.


    An edge is a Self-Loop if its two endpoints coincide. This is a form of a cycle.


    A vertex v is Reachable from vertex u or "reaches v" if there is a path from u
    to v. In an undirected graph v is reachable from u then u is reachable from v.
    But in a directed graph it is possible that u reaches v but there is no path from
    v to u.


    A graph is Connected if for any two vertices there is a path between them.'
