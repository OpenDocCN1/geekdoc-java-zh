    | Ryan | 104 | 6 | Modulo Size | 4 | Samar meaning... |

    | Pranav | 177 | 2 | 5 | Ayansh meaning... |

    | Samar | 39 | | Ryan meaning... |


    Hash-Table has an excellent lookup of constant time.


    Let us suppose we want to implement autocomplete the box feature of Google search.
    When you type some string to search in google search, it proposes some complete
    string before you have done typing. BST cannot solve this problem as related strings
    can be in both right and left subtree.


    The Hash-Table is also not suited for this job. One cannot perform a partial match
    or range query on a Hash-Table. Hash function transforms string to a number. Moreover,
    a good hash function will give a distributed hash bode even for partial string
    and there is no way to relate two strings in a Hash-Table.


    Trie and Ternary Search tree are a special kind of tree, which solves partial
    match, and range query problem well.


    # Trie


    Trie is a tree, in which we store only one character at each node. This final
    key value pair is stored in the leaves. Each node has K children, one for each
    possible character. For simplicity purpose, let us consider that the character
    set is 26, corresponds to different characters of English alphabets.


    Trie is an efficient data structure. Using Trie, we can search the key in O(M)
    time. Where M is the maximum string length. Trie is also suitable for solving
    partial match and range query problems.'
