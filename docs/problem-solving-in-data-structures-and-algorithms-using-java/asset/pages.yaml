  md: '# Selection of Best Sorting Algorithm


    No sorting algorithm is perfect. Each of them has their own pros and cons. Let
    us read one by one:


    **Quick-Sort:** When you do not need a stable sort and average case performance
    matters more than worst-case performance. When data is random, we prefer the Quick-Sort.
    Average Complexity of Quick-Sort is **O(nlogn)** and worst-case Time Complexity
    is **O(n²)**. Space Complexity of Quick-Sort is **O(logn)** auxiliary storage,
    which is stack space used in recursion.


    **Merge-Sort:** When you need a stable sort and Time Complexity of **O(nlogn)**,
    Merge-Sort is used. In general, Merge-Sort is slower than Quick-Sort because of
    lot of copying in the merge phase. There are two uses of Merge-Sort when we want
    to merge two sorted linked lists and Merge-Sort is used in external sorting.


    **Heap-Sort:** When you do not need a stable sort and you care more about worst-case
    performance than average case performance. It is guaranteed to be **O(nlogn)**,
    and uses **O(1)** auxiliary space, meaning that you will not unexpectedly run
    out of memory for very large inputs.


    **Insertion-Sort:** When we need a stable sort, when N is guaranteed to be small,
    including as the base case of a Quick-Sort or Merge-Sort. Worst-case Time Complexity
    is **O(n²)**, it has a very small constant, so for smaller input size it performs
    better than Merge-Sort or Quick Sort. It is also useful when the data is already
    pre-sorted in this case its best running time is **O(N)**.


    **Bubble-Sort:** Where we know the data is very nearly sorted. Say only two elements
    are out of place. In one pass, Bubble Sort will make the data sorted and in the
    second pass, it will see everything is sorted and exit. It only takes 2 passes
    of the array.


    **Selection-Sort:** Best Worst Average running time all **O(n²)**. It is only
    useful when you want to do something quick. They can be used when you are just
    doing some prototyping.


    **Counting-Sort:** When you are sorting data within a limited range.


    **Radix-Sort:** When log(N) is significantly larger than K, where K is the number
    of radix digits.


    **Bucket-Sort:** When your input is more or less uniformly distributed.


    **Note:** A stable sort is one that has guaranteed not to reorder elements with
    identical keys'
