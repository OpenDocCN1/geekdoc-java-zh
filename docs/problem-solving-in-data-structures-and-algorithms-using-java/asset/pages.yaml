  md: "# System stack and Method Calls\n\nWhen the method is called, the current execution\
    \ is stopped and the control goes to the called method. After the called method\
    \ exits / returns, the execution resumes from the point at which the execution\
    \ was stopped.\n\nTo get the exact point at which execution should be resumed,\
    \ the address of the next instruction is stored in the stack. When the method\
    \ call completes, the address at the top of the stack is taken\n\nExample 1.25:\n\
    public static void function2()\n\n```\n{\n    System.out.println(\"fun2 line 1\"\
    );\n}\nublic static void function1()\n{\n    System.out.println(\"fun1 line 1\"\
    );\n    function2();\n    System.out.println(\"fun1 line 2\");\n}\nublic static\
    \ void main(String[] args)\n{\n    System.out.println(\"main line 1\");\n    function1();\n\
    \    System.out.println(\"main line 2\");\n}\n```\n\nOutput:\nmain line 1\nfun1\
    \ line 1\nfun2 line 1\nfun1 line 2\n\nAnalysis:\n\n+   - Every program starts\
    \ with main() method.\n- The first statement of main() will be executed. And we\
    \ will print \"main line 1\" as output.\nfunction1() is called. Before control\
    \ goes to function1() then next instruction that is address of next line is stored\
    \ in the system stack.\n- Control goes to function1() method.\n- The first statement\
    \ inside function1() is executed, this will print \"fun1 line 1\" to output.\n\
    function2() is called from function1(). Before control goes to function2() address\
    \ of the next instruction that is address of next line is added to the system\
    \ stack."
