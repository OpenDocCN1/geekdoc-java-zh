  md: '# Types of Heap


    There are two types of heap and the type depends on the ordering of the elements.
    The ordering can be done in two ways: Min-Heap and Max-Heap


    # Max Heap


    Max-Heap: the value of each node is less than or equal to the value of its parent,
    with the largest-value element at the root.


    ![](img/fe8f1cc519c7716e78f4de4934978705_321_0.png)


    # Max Heap Operations


    | Insert | O(logn) |

    | DeleteMax | O(logn) |

    | Remove | O(logn) |

    | FindMax | O(1) |


    # Min Heap


    Min-Heap: the value of each node is greater than or equal to the value of its
    parent, with the minimum-value element at the root.'
