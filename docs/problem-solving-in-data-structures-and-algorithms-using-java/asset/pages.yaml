  md: "# Kinds of Variables\n\nThe JAVA programming language defines three kinds of\
    \ variables:\n\n+   1. Instance Variables (Non-Static): They are instance variables\
    \ so they are unique to each instance/object of a class.\n\n+   2. Class Variables\
    \ (Static): A class variable is any field with the static modifier. These variables\
    \ are linked with the class and not the objects of the class. There is exactly\
    \ one copy of these variables regardless of how many instances of the class are\
    \ created.\n\n+   3. Local Variables: the temporary variables in a method are\
    \ called local variables. The local variables are only visible to the method in\
    \ which they are declared. The parameters to the methods are also local variables\
    \ of the called method.\n\nExample 1.6:\n\n```\nclass Bulb {\n  //Class Variables\n\
    \  private static int TotalBulbCount = 0;\n\n  //Instance Variables\n  private\
    \ boolean isOn=false;\n\n  //Constructor\n  public Bulb(){\n    TotalBulbCount++;\n\
    \  }\n\n  //Class Method\n  public static int getBulbCount(){\n    return TotalBulbCount;\n\
    \  }\n\n  //Instance Method\n  public void turnOn() {\n    isOn = true;\n  }\n\
    \n  //Instance Method\n  public void turnOff() {\n    isOn = false;\n  }\n\n \
    \ //Instance Method\n  public boolean isOnFun(){\n    return isOn;\n  }\n}\n```"
