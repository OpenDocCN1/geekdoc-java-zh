  md: '# Technical questions


    Solving a technical question is not just about the algorithms and designing a
    good software system. The interviewer wants to know you approach towards any given
    problem.


    Many people make mistakes like they don''t ask clarifying questions about a given
    problem? They assume a lot of things and begin working with that. Well the truth
    is the interviewer actually expect you to ask constraints questions. There are
    a lot of data that is missing that you need to collect from your interviewer before
    beginning to solve a problem.


    For example: Let us suppose the interviewer ask you to give a best sorting algorithm.
    Some interviewee will directly jump to Quick-Sort **O(nlogn)**. Oops, mistake
    you need to answer many questions before beginning to solve this problem.


    Questions:


    +   1. What kind of data are we talking about? Are they *integer* s?

    2. How much data are we going to sort?

    3. What exactly is this data about?

    4. What kind of data-structure used to hold this data?

    5. Can we modify the given data-structure? And many, many more...?


    Answer:


    +   1. Yes, they are *integer* s.

    2. May be thousands.

    3. They store a person''s age.

    4. Data are given in the form of some array.

    5. No you cant modify the data structure provided.


    Ok from the first answer we will deduce that the data is *integer*. The data is
    not so big it just contains a few thousand entries. The third answer is interesting
    from this we deduce that the range of data is 1-150. Data is provided in an array.
    From fifth answer we deduce that we have to create our data structure and cannot
    modify the array provided. So finally we conclude, we can just bucket sort to
    sort the data. The range is just 1-150 so we need just 151 capacity integral array.
    Data is under thousands so we don''t have to worry about data overflow and we
    get the solution in linear time **O(N)**.'
