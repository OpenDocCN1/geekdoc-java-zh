  md: '# Terminology in tree


    ![](img/fe8f1cc519c7716e78f4de4934978705_274_0.png)


    **Root**: The root of the tree is the only node in the tree that has no incoming
    edges. It is the top node of a tree.


    **Node**: It is a fundamental element of a tree. Each node has data and two references
    that may point to null or its child’s.


    **Edge**: It is also a fundamental part of a tree, which is used to connect two
    nodes.


    **Path**: A path is an ordered list of nodes that are connected by edges.


    **Leaf**: A leaf node is a node that has no children.


    **Height of the tree**: The height of a tree is the number of edges on the longest
    path between the root and a leaf.


    **The level of node**: The level of a node is the number of edges on the path
    from the root node to that node.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '![](img/fe8f1cc519c7716e78f4de4934978705_275_0.png)


    **Children:** Nodes that have incoming edges from the same node to be said to
    be the children of that node.


    **Parent:** Node is a parent of all the child nodes that are linked by outgoing
    edges.


    **Sibling:** Nodes in the tree that are children of the same parent are said to
    be siblings’


    **Ancestor:** A node reachable by repeated moving from child to parent.'
