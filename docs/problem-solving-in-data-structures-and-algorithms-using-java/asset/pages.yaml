  md: "# Divide-and-Conquer, Decrease-and-Conquer\n\nDivide-and-Conquer algorithms\
    \ involve basic three steps, first split the problem into several smaller sub-problems,\
    \ second solve each sub problem and then combine the sub problems results as to\
    \ produce the final result.\n\nIn divide-and-conquer the size of the problem is\
    \ reduced by a factor (half, one-third, etc.), While in decrease-and-conquer the\
    \ size of the problem is reduced by a constant.\n\nExamples of divide-and-conquer\
    \ algorithms:\n\n+   - Merge-Sort algorithm (using recursion)\n- Quicksort algorithm\
    \ (using recursion)\n- Computing the length of the longest path in a binary tree\
    \ (using recursion)\n- Computing Fibonacci numbers (using recursion)\n- Quick-hull\n\
    \nExamples of decrease-and-conquer algorithms:\n\n+   - Computing pow(a, n) by\
    \ calculating pow(a, n/2) using recursion.\n- Binary search in a sorted array\
    \ (using recursion)\n- Searching in BST\n- Insertion-Sort\n- Graph traversal algorithms\
    \ (DFS and BFS)\n- Topological sort\n- Wallis's algorithm (using recursion)\n\
    - Permutations (Minimal change approach, Johnson-Trotter algorithm)\n- Computing\
    \ a median, Topological sorting, Fake-coin problem (Ternary search)\n\nConsider\
    \ the problem of exponentiation Compute x^\n\n| | |\n|---|---|\n| Brute Force:\
    \ | n-1 multiplications |\n| Divide and conquer: | T(n) = 2*T(n/2) + 1 = n-1 |\n\
    | Decrease by one: | T (n) = T (n-1) + 1 = n-1 |\n| Decrease by constant factor:\
    \ | T (n) = T (n/a) + a-1\n =(a-1) n\n= n when a = 2 |"
