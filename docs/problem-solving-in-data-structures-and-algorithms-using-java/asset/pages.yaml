  md: '# Operation on Heap


    # Create Heap from an array


    +   1. Starts by putting the elements to an array.

    2. Starting from the middle of the array move downward towards the start of the
    array. At each step, compare parent value with its left child and right child.
    And restore the heap property by shifting the parent value with its greatest-value
    child. Such that the parent value will always be greater than or equal to left
    child.

    3. For all elements from middle of the array to the start of the array. We are
    doing comparisons and shift till we reach the leaf nodes of the heap. The Time
    Complexity of build heap is O(N).


    ![](img/fe8f1cc519c7716e78f4de4934978705_324_0.png)


    Given an array as input to create heap function. Value of index i is compared
    with value of its children nodes that is at index (i*2+1) and (i*2+2). Middle
    of N/2 array is index 3 comared with index 7. If the children node value is grater
    then parent node then the value will be swapped.


    | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |


    ![](img/fe8f1cc519c7716e78f4de4934978705_324_1.png)


    Similarly, value of index 2 is compared with index 5 and 6. The largest of the
    value is 7 which will be swapped with the value at index 2.


    | 1 | 2 | 3 | 8 | 5 | 6 | 7 | 4 |'
