  md: '# Introduction


    In real life when we are asked to do work, we try to correlate it with our experience
    and then try to solve it. Similarly, when we get a new problem to solve. We first
    try to find the similarity of the current problem with some problems for which
    we already know the solution. Then solve the current problem and get our desired
    result.


    This method provides following benefits:


    +   1) It provides a template for solving a wide range of problems.

    2) It provides us the idea of the suitable data structure for the problem.

    3) It helps us in analyzing, space and Time Complexity of algorithms.


