  md: '# # Why Searching?


    Imagine you are in a library with millions of books. You want to get a specific
    book with specific title. How will you find? You will just start searching by
    initial letter of the book title. Then you continue matching with a whole book
    title until you find your desired book. (By this small heuristic you have reduced
    the search space by a factor of 26, consider we have an equal number of books
    whose title begin with particular char.)


    Similarly, computer stores lots of information and to retrieve this information
    efficiently, we need very efficient searching algorithms. To make searching efficient,
    we keep the data in some proper order. There are certain ways of organizing the
    data. If you keep the data in proper order, it is easy to search required element.
    For example, Sorting is one of the process for making data organized.'
