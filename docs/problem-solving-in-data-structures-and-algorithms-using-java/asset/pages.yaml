  md: '# Priority Queue (Heap)


    ![](img/fe8f1cc519c7716e78f4de4934978705_108_0.png)


    Priority queue is implemented using a binary heap data structure. In a heap, the
    records are stored in an array so that each key is larger than its two children
    keys. Each node in the heap follows the same rule that the parent value is greater
    than its two children.


    There are two types of heap data structure:


    +   - Max heap: each node should be greater than or equal to each of its children.

    - Min heap: each node should be smaller than or equal to each of its children.


    A heap is a useful data structure when you want to get max/min one by one from
    data. Heap-Sort uses max to sort data in increasing/decreasing order.


    # Heap ADT Operations


    **Insert()** - Adding a new element to the heap. The *Time Complexity* of this
    operation is O(log(n))

    **remove()** - Extracting max for max heap case (or min min heap case). The *Time
    Complexity* of this operation is O(log(n))


    **Heapify()** – To convert a list of nodes in an array into a heap. This operation
    has a *Time Complexity O(n)***'
