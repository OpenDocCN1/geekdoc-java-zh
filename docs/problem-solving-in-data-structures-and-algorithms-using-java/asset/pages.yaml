  md: '# Class P problems


    The class P consists of a set of problems that can be solved in polynomial time.
    The complexity of a P problem is O(nk*) Where n is input size and k is some constant
    (it can’t depend on n).


    Class P Definition: the class P contains all decision problems for which there
    exists a Turing machine that leads to the “yes/no” answer in a definite number
    of steps bounded by a polynomial function.


    For example:

    Given a sequence a1, a2, a3.... an. Find if a number X is in this array.

    We can search, the number X in this array in linear time (polynomial time)


    Another example:

    Given a sequence a1, a2, a3.... an. If we are asked to sort the sequence.

    We can sort and array in polynomial time using Bubble-Sort, this is also linear
    time.


    Note: **O(logn)** is also polynomial. Any algorithm which has complexity less
    than some O(nk*) is also polynomial.


    +   Some problem of P class is:

    1. Shortest path

    2. Minimum spanning tree

    3. Maximum problem.

    4. Max flow graph problem.

    5. Convex hull'
