  md: '# Scalability Theory


    In this section, we will be designing a generic web server, which will be handling
    a large number of requests. You can imagine it as some sort of website like Facebook
    in which large number of users are accessing it.


    ![](img/fe8f1cc519c7716e78f4de4934978705_502_0.png)


    # Vertical scaling


    Vertical scaling means that you scale by adding more resources (Higher speed CPU,
    More RAM etc.) To your existing machine.


    Vertical scaling has its own limit it can help you to handle more load, but until
    its limit is reached, then we have to go for horizontal scaling.


    # Horizontal scaling


    Horizontal scaling means that you scale by adding more machines to your pool of
    resources.


    Distribute the request by distributing the request among more than one web server.
    In doing we need to have a load balancer, which will distribute the request among
    the servers.


    # Load Balancer (Application layer)


    Load balancer has to decide which server should serve the next request. So distributing
    the load can be made using different strategies:


    +   1) Round Robbin: Round robin is the way of distributing requests in a sequential
    fashion. The request is sent to the server 1 then the next request is sent to
    server 2 and so on until we reach the end of the server list. When we reach the
    end, it is sent again server 1. Round robin also has a problem with a server,
    which is already busy, may get another request. Round robin also has a problem
    with sticky sessions. We want that request to be sent to the same server next
    time.'
  merge: -1
  pgno: 502
- img_proc: true
  md: '2) Another approach is to select server corresponds to the hash value of the
    data. Find the value of the data, mod the hash value by the number of servers.
    Assign the job to a machine whose value we got after mod. Stick session problem
    is already solved in hash value approach. However, the problem of uneven load
    distribution is there, there is possible to have a more load sent to a server,
    which is already busy.


    3) May be the load balancer know, how much load each server has or how busy each
    server is. Moreover, will send the next request to the least busy server.


    4) The server can be a specialized one serving some serving video and some other
    data.


    ![](img/fe8f1cc519c7716e78f4de4934978705_503_0.png)


    # Problems of load Balancing


    Consider a customer who had selected some items in his buy cart on Amazon. When
    selects another item then should be added to the same cart so it should be sent
    to the same server. Also, the user profile which is saved to one server and if
    the user request reaches the other server his profile will be empty this is also
    not a good idea.


    This problem can be solved by making the load balancer decide that a particular
    user request would always go to the same server. The user profile and cart details
    should be saved in one database.


    Stick session: same sessions should lend to the same server. How to get this done.
    The first approach is that we store the IP address returned by load balancing
    into a cookie and then use this IP address in the subsequent requests. However,
    this reveals the IP address of the server to the world that we do not want. Therefore,
    another solution is that we use some session id that is a number that the load
    balancer knows belongs to which server. By this, we are preventing our servers
    being exposed to the outer world and prevent it from being attacked.


    # Load Balancer (Database layer)'
