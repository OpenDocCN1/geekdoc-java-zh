  md: '# Load Factor


    Load factor = Number of elements in Hash-Table / Hash-Table size


    Based on the above definition, Load factor tells whether the hash function is
    distributing the keys uniformly or not. So it helps in determining the efficiency
    of the hashing function. It also works as decision parameter when we want to expand
    or rehash the existing Hash-Table entries.


    # Collisions


    When a hash function generates the same index for the two or more different objects,
    the problem known as the collision. Ideally, hash function should return a unique
    address for each key, but practically it is not possible.


    # Collision Resolution Techniques


    Hash collisions are practically unavoidable when hashing large number of objects.
    Techniques that are used to find the alternate location in the Hash-Table is called
    collision resolution. There are a number of collision resolution techniques to
    handle the collision in hashing.


    Most common and widely resolved techniques are:


    +   - Open addressing

    - Separate chaining'
