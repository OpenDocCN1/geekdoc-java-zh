    +   1. The basic architecture from the scalability theory topic can be used here.

    2. There should be a huge number of servers which are serving the users.

    3. There should be multiple servers at multiple geo locations to provide geo-redundancy.
    The database should be replicated at these multiple geo locations. There may be
    multiple servers in one particular zone too.

    4. There is a huge number of read query, the user generally does a large number
    of query to find the seat he wants to book. There will be more reads then write
    so master-slave.

    5. Queries can be cached; little old data is ok.

    6. All the search will be served by slave servers.

    7. When we book a ticket then transaction goes directly to the master server.
    Locks on train number can be taken to prevent race conditions. Once a lock is
    acquired then you can only book a ticket. Some counts can be to avoid unnecessary
    locking and some counter can be used for this.

    8. Each station has a quota in train and seats are allocated from that quota.

    9. Each physical train will have two train ids one goes from source to destination
    station and when it comes back. So in the system, there will be two train ids.
    Keeping two separate ids will make the query easier to implement.

    10. When final charting then each seat is swapped for the empty slots and we try
    to find the request from source station whose destination is in that slot. The
    first fit is allotted that seat.

    11. A load balancer is used to distribute traffic.

    12. There may be multiple booking servers which ask for a booking token to the
    master server. Master server allocate a token for that and reserve it for some
    time. When all the user'
