  md: '# Introduction


    Divide-and-Conquer algorithms works by recursively breaking down a problem into
    two or more sub-problems (divide), until these sub problems become simple enough
    so that they can be solved directly (conquer). The solution of these sub problems
    is then combined to give a solution of the original problem.


    Divide-and-Conquer algorithms involve basic three steps


    +   1. Divide the problem into smaller problems.

    2. Conquer by solving these problems.

    3. Combine these results together.


    In divide-and-conquer the size of the problem is reduced by a factor (half, one-third
    etc.), While decrease-and-conquer the size of the problem is reduced by a constant.


    ![](img/fe8f1cc519c7716e78f4de4934978705_450_0.png)


    Examples of divide-and-conquer algorithms:


    +   - Merge-Sort algorithm (recursion)

    - Quicksort algorithm (recursion)

    - Computing the length of the longest path in a binary tree (recursion)

    - Computing the Fibonacci numbers (recursion)

    - Convex Hull


    Examples of decrease-and-conquer algorithms:


    +   - Computing POW (a, n) by calculating POW (a, n/2) using recursion

    - Binary search in a sorted array (recursion)

    - Searching in BST

    - Insertion-Sort'
