  md: '# Complexities


    Solving a problem is not just finding a correct solution. The solution should
    be fast and should have reasonable memory requirement. You have already read about
    Big-O notation in the previous chapters. You should be able to do Big-O analysis.
    In case you think the solution you have provided is not that optimal and there
    is some more efficient solution, then think again and try to figure out this information.


    Most interviewers expect that you should be able to find the time and Space Complexity
    of the algorithms. You should be able to compute the time and Space Complexity
    instantly. Whenever you are solving some problem, you should find the complexity
    associated with it from this you are able to choose the best solutions. In some
    problems there is trade-offs between space and Time Complexity, so you should
    know these trade-offs. Sometime taking some more space saves a lot of time and
    make your algorithm much faster.'
