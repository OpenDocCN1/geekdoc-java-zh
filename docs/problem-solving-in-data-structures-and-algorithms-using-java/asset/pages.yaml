  md: "# Introduction\n\nSorting is the process of placing elements from a collection\
    \ into ascending or descending order. For example, when we play cards, sort cards,\
    \ according to their value so that we can find the required card easily.\n\nWhen\
    \ we go to some library, the books are arranged according to streams (Algorithm,\
    \ Operating systems, Networking etc.). Sorting arranges data elements in order\
    \ so that searching become easier. When books are arranged in proper indexing\
    \ order, then it is easy to find a book we are looking for.\n\nThis chapter discusses\
    \ sorting for a set of N items. Understanding sorting algorithms are the first\
    \ step towards understanding algorithm analysis. Many sorting algorithms are developed\
    \ and analysed.\n\nA sorting algorithm like Bubble-Sort, Insertion-Sort and Selection-Sort\
    \ are easy to implement and are suitable for the small input set. However, for\
    \ large dataset they are slow.\n\nA sorting algorithm like Merge-Sort, Quick-Sort\
    \ and Heap-Sort are some of the algorithms that are suitable for sorting large\
    \ dataset. However, they are overkill if we want to sort the small dataset.\n\n\
    Some algorithm, which is suitable when we have some range information on input\
    \ data.\n\nSome other algorithm is there to sort a huge dataset that cannot be\
    \ stored in memory completely, for which external sorting technique is developed.\n\
    \nBefore we start a discussion of the various algorithms one by one. First, we\
    \ should look at comparison function that is used to compare two values.\n\nLess\
    \ function will return 1 if value1 is less than value2 otherwise, it will return\
    \ 0.\n\n```\nprivate boolean less(int value1, int value2) \n{\n  return value1\
    \ < value2;\n}\n```\n\nMore function will return 1 if value1 is more than value2\
    \ otherwise it it will return 0.\n\n```\nprivate boolean more(int value1, int\
    \ value2) \n{\n  return value1 > value2;\n}\n```\n\nThe value in various sorting\
    \ algorithms is compared using one of the above functions and it will will"
