  md: '# Stack


    ![](img/fe8f1cc519c7716e78f4de4934978705_99_0.png)


    Stack is a special kind of data structure that follows Last-In-First-Out (LIFO)
    strategy. This means that the element that is added to stack last will be the
    first to be removed.


    The various applications of stack:


    +   1. Recursion: recursive calls are preformed using system stack.

    2. Postfix evaluation of expression.

    3. Backtracking

    4. Depth-first search of trees and graphs.

    5. Converting a decimal number into a binary number etc.


    # Stack ADT Operations


    Push(k): Adds a new item to the top of the stack

    Pop(): Remove an element from the top of the stack and return its value.

    Top(): Returns the value of the element at the top of the stack

    Size(): Returns the number of elements in the stack

    IsEmpty(): determines whether the stack is empty. It returns 1 if the stack is
    empty or return 0.

    Note: All the Stack operations are implemented in O(1) Time Complexity.


    # Stack implementation in JAVA Collection


    Stack is implemented by calling push and pop methods of ArrayDeque<T> class.

    JDK also provides Stack<T>, but we should not use this class and prefer Deque
    which implement collection interface.


    +   1. First reason is that Stack<T> does not drive from Collection interface.

    2. Second Stack<T> drives from Vector<T> so random access is possible so it breaks
    abstraction of a stack.'
