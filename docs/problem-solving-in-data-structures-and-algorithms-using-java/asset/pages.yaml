  md: '# Adjacency Matrix


    One of the ways to represent a graph is to use two-dimensional matrix. Each combination
    of row and column represent a vertex in the graph. The value stored at the location
    row v and column w is the edge from vertex v vertex w. The nodes that are connected
    by an edge are called adjacent nodes. This matrix is used to store adjacent relation
    so it is called the Adjacency Matrix. In the below diagram, we have a graph and
    its Adjacency matrix.


    ![](img/fe8f1cc519c7716e78f4de4934978705_369_0.png)


    In the above graph, each node has weight 1 so the adjacency matrix has just 1s
    or 0s. If the edges are of different, weights that that weight will be filled
    in the matrix.


    Pros: Adjacency matrix implementation is simple. Adding/Removing an edge between
    vertices is just O(1). Query if there is an edge between two vertices is also
    O(1)


    Cons: It always consumes O(V^2) space, which is an inefficient way to store when
    a graph is sparse.

    Sparse Matrix: In a huge graph, each node is connected with fewer nodes. So most
    of the places in adjacency matrix are empty. Such matrix is called sparse matrix.
    In most of the real world problems adjacency matrix is not a good choice for sore
    graph data.'
