  md: "# Relationship\n\n| Class A | Class A | Class A | Class A |\n| --- | --- |\
    \ --- | --- |\n| | Uses | Owns | Has | Is a |\n| Class B | Class B | Class B |\
    \ Class B |\n\nThese are the various relationships that exist between two classes:\n\
    \n**Dependency:** Objects of one class use objects of another class temporarily.\
    \ When a class creates an instance of another class inside its member method and\
    \ use it and when the method exits, then the instance of the other class is deleted.\n\
    \n**Association:** Objects of one class work with objects of another class for\
    \ some amount of time. The association is of two kinds - Aggregation and Composition.\n\
    \n**Aggregation:** One class object share a reference to objects of another class.\
    \ When a class stores the reference of another class inside it. Just a reference\
    \ is kept inside the class.\n\n**Composition:** One class contains objects of\
    \ another class. In Composition, the containing object is responsible for the\
    \ creation and deletion of the contained object.\n\n**Inheritance:** One class\
    \ is a sub-type of another class. Inheritance is a straightforward relationship\
    \ to explain the parent-child relationship.\n\n**Example 1.8:**\n\n```\nclass\
    \ AdvanceBulb extends Bulb {\n\nint intensity;\n\n    public void setIntensity(int\
    \ i) {\n        intensity = i;\n    }\n}\n```\n\nIn our example, AdvanceBulb is\
    \ a sub-class of Bulb. When an object of AdvanceBulb is created, all public and\
    \ protected methods of Bulb class are also accessible."
