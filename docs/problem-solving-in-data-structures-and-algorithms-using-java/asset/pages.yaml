  md: '# Master Theorem


    The master theorem solves recurrence relations of the form:

    T(n) = a T(n/b) + f(n)


    Where a ≥ 1 and b > 1.

    "n" is the size of the sub problem in the recursion.

    "a" is a number of each sub-problem.

    "n/b" is the size of each sub-problem.

    "f(n)" is the cost of the division of the problem into sub problem or merge of
    results of problems to get the final result.


    It is possible to determine an asymptotic tight bound in these cases:

    Case 1: when f(n)=Ω(nlogᵇ⁻ε) and constant ε > 1, than the final Time Complexity
    will be:

    T(n)=Θ(nlogᵇε)


    Case 2: when f(n)=Θ(nlogᵇ logᵏn) and constant k ≥ 0, then the final Time Complexity
    will be:

    T(n)=Θ(nlogᵇ logᵏn)


    Case 3: when f(n)=Ω(nlogᵇ⁺ε) and constant ε > 1, Then the final Time Complexity
    will be:

    T(n)=Θ(f(n))


    ![](img/fe8f1cc519c7716e78f4de4934978705_75_0.png)


