  md: '1) The user of the system will provide query string and system will respond
    with the proper list of URLs corresponding to his request.


    2) Given that, the database operations are very heavy we need to minimize them
    by caching the queries at the web server.


    3) We need to keep the frequent queries in the cache and stale queries need to
    be removed from the cache.


    4) We need to have some proper refresh mechanism for each query.


    # Basic Design


    Let us forget about an N number of machines and assume that QuerySearch() operation
    happens on a single machine. Now we would like to cache queries. Each query will
    consist of some string, and the result of a query is a list of URLs.


    We need to have a quick cache lookup so that we can get the result of the Query
    from the cache if it is present. Also, we need to have some proper refresh mechanism
    for each query. The Hash-Table is most effective to keep the cache. By using a
    hash, a table lookup is fast. However, if the cache is filled how you would remove
    the least used data from the cache.


    A linked list can be used to remove the old data. You can use a double linked
    list to manage the old data removal. Whenever a data is accessed, it can be moved
    to the front of the linked list and the removal can happen from the end of the
    linked list.


    Taking advantage of both solutions, we can keep the cache in a linked list and
    add its reference to the Hash-Table.


    Now the last problem of how to remove the data upon the expiry of it. For example,
    most frequently accessed query result will always remain in the linked list even
    though that result is changed and if it is accessed again from the database it
    will give some update result. For this, we need to have some TTL (time to live)
    associated with each query depending on the result of URLs we get from each query.
    For example, some weather or current news queries should have a TTL of days, on
    the other hand, some historic data should have a long TTL. The TTL can be derived
    from how frequently the URLs are changing in the query result.


    # Bottleneck


    We are N different web servers. And any particular query can be served by any
    server. Data access should be fast.


    # Scalability'
  merge: -1
  pgno: 521
- img_proc: true
  md: 'The various solutions that we can think about are:


    # Approach 1:


    Servers can their own cache. If some query is sent to Machine1 it will catch it
    in its cache when the same query is sent to again it will return it from its cache.
    However, if some query is sent to Machine1 first, it will cache it and if the
    same query is sent to Machine2, it will do a database lookup and cache it to its
    own cache. This implementation is suboptimal as it is doing more number of database
    lookups than what is actually required.


    # Approach 2:


    Another approach is that each machine stores identical cache. Whenever some database
    access happened then the same cache is updated by all the web server. This approach
    has a drawback whenever a data is updated in cache same update is fired to all
    the N web servers. Another disadvantage is that all the cache stores the same
    data so we are wasting precious cache space.


    # Approach 3:


    In this approach, we will divide our cache such that each web server holds a different
    part of the cache. When a query reach to some web server it knows which webserver
    actually holds the cache for this query or at least knows that server is supposed
    to keep a cache of the particular query.


    To do this we need a hash-based approach. We find the server, which serves the
    query, by just finding the hash (query) percentage N.


    When a query request come to some web server, it will find the webserver corresponding
    to this query by applying the formula. It will ask the QuerySearch() function
    to that particular server. That server will in turn will query the database if
    required or provide the result from its own cache.


    Now, regarding the cache expiration and old cache removal. We are keeping the
    TTL corresponding to each query so there can be a thread running which looks for
    the expired data and remove it from the cache.


    In addition, combination of linked list and Hash-Table is used to keep the cache
    to get rid of less accessed data when the cache is almost full.


    As a further improvement, we can think of some sort of Geo location aware webserver
    selection and cache policy so that query related to India is more supposed to
    be done in India and query related to china is supposed to come more from china.'
  merge: -1
  pgno: 522
