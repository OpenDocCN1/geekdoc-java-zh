    \ search:\n\n+   1. Store the initial state in a stack\n2. While the stack is\
    \ not empty, repeat:\n3. Read a node from the stack.\n4. While there are available\
    \ operators, do:\n   a. Apply an operator to generate a child\n   b. If the child\
