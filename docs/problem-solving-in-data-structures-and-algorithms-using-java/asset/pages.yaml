  md: '# Coding


    At this point, you have already captured all the constraints of the problem, proposed
    few solutions, evaluated the complexities of the various solutions and picked
    the one solution to do final coding. Never ever, jump into coding before discussing
    constraints, Idea generation and complexity with the interviewer.


    We are accustomed to coding in an IDE like visual studio. So many people struggle
    when asked to write code on a whiteboard or some blank sheet. Therefore, we should
    have a little practice to the coding on a sheet of paper. You should think before
    coding because there is no back button in sheet of paper. Always try to write
    modular code. Small functions need to be created so that the code is clean and
    managed. If there is a swap function so just use this function and tell the interviewer
    that you will write it later. Everybody knows that you can write swap code.'
