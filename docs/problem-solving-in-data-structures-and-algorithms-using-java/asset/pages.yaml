  md: "# Parameter passing, Call value\n\nArguments can be passed from one method\
    \ to other using parameters. All the basic data types when passed as parameters\
    \ are the passed-by-value. That means a separate copy is created inside the called\
    \ method and the variable in the calling method remains unchanged.\n\n# Example\
    \ 1.4:\n\n```\npublic static void increment(int var) {\n    var++;\n}\npublic\
    \ static void main(String[] args) {\n    int i = 10;\n    System.out.println(\"\
    Value of i before increment is : \" + i);\n    increment();\n    System.out.println(\"\
    Value of i before increment is : \" + i);\n}\n```\n\n# Output:\n\nValue of i before\
    \ increment is : 10\nValue of i after increment is : 10\n\n# Analysis:\n\n+  \
    \ - Variable \"i\" is declared and the value 10 is initialized to it.\n- Value\
    \ of \"i\" is printed.\n- Increment method is called. When a method is called\
    \ the value of the parameter is copied into another variable of the called method.\
    \ Flow of control goes to increase() function.\n- Value of i is incremented by\
    \ 1. But remember, it is just a copy inside the increment method.\n- When the\
    \ method exits, the value of \"i\" is still 10.\n\n# Points to remember:\n\n+\
    \   1. Pass by value just creates a copy of variable.\n2. Pass by value, value\
    \ before and after the method call remain same."
