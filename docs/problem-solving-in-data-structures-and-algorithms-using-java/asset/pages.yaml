    \ For this, we need string-matching algorithms.\n\n# Brute Force Search\n\nWe\
    \ have a pattern that we want to search in the text. The pattern is of length\
    \ m and the text is of length n. Where m < n.\n\nThe brute force search algorithm\
    \ will check the pattern at all possible value of “i” in the text where the value\
    \ of “i” range from 0 to n-m. The pattern is compared with the text, character\
    \ by character from left to right. When a mismatch is detected, then pattern is\
    \ compared by shifting the window by one character.\n\n# Example 14.1:\n\n```\n\
    int BruteForceSearch(String text, String pattern) {\n  return BruteForceSearch(text.toCharArray(),\
    \ pattern.toCharArray());\n}\n\nint BruteForceSearch(char[] text, char[] pattern)\
    \ {\n  int i=0;\n  final int n = text.length;\n  final int m = pattern.length;\n\
    \  while (i<=n-m) {\n    int j=0;\n    while (j<m && pattern[j]== text[i+j]) j++;\n\
    \    if (j==m)\n      return i;\n    i++;\n  }\n  return -1;\n}\n```\n\nWorst\
    \ case Time Complexity of the algorithm is O(m*n), we got the pattern at the end\
    \ of the text or we didn't get the pattern at all.\nBest case Time Complexity\
