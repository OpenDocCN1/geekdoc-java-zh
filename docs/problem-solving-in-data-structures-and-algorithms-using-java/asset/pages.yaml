  md: "# Linear Search – Sorted\n\nIf elements of the array are sorted either in increasing\
    \ order or in decreasing order, searching for a desired element will be much more\
    \ efficient than unordered linear search. In many cases, we do not need to traverse\
    \ the complete array. Following example explains when you encounter a greater\
    \ element from the increasing sorted array, you stop searching further. This is\
    \ how this algorithm saves the time and improves the performance.\n\n```\nboolean\
    \ linearSearch(int[] arr, int size, int value)\n{\n    int i = 0;\n    for(i =\
    \ 0; i < size; i++)\n    {\n        if(value == arr[i])\n            return true;\n\
    \        else if(value < arr[i])\n            return false;\n    }\n    return\
    \ false;\n}\n```\n\n**Complexity: O(n).** As we need to traverse the complete\
    \ array in worst case. Worst case is when your desired element is at the last\
    \ position of the sorted array. However, in the average case this algorithm is\
    \ more efficient even though the growth rate is same as unsorted.\n\n**Space Complexity:\
    \ O(1).** No extra memory is used to allocate the array."
