  md: '# Introduction


    In this chapter, we will study about Graphs. Graphs can be used to represent many
    interesting things in the real world. Flights from cities to cities, rods connecting
    various town and cities. Even the sequence of steps that we take to become ready
    for jobs daily, or even a sequence of classes that we take to become a graduate
    in computer science. Once we have a good representation of the map, then we use
    a standard graph algorithms to solve many interesting problems of real life.


    The flight connection between major cities of India can also be represented by
    the below graph. Each node is a city and each edge is a straight flight path from
    one city to another. If you want to go from Delhi to Chennai, if given this data
    in good representation to a computer, through graph algorithms the computer may
    propose shortest, quickest or cheapest path from soured to destination.


    ![](img/fe8f1cc519c7716e78f4de4934978705_365_0.png)


    Google map that we use is also a big graph of lots of nodes and edges. And suggest
    shortest and quickest path to the user.


    Graph Definitions


    A Graph is represented by G where G = (V, E), where V is a finite set of points
    called Vertices and E is a finite set of Edges.


    Each edge is a tuple (u, v) where u, v ∈ V. There can be a third component weight
    to the tuple. Weight is cost to go from one vertex to another.


    Edge in a graph can be directed or undirected. If the edges of graph are one way,
    it is called Directed graph or Digraph. The graph whose edges are two ways are
    called Undirected graph or just graph.'
