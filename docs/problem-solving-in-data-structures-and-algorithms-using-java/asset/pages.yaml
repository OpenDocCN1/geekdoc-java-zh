  md: '# Time Complexity Order


    A list of commonly occurring algorithm Time Complexity in increasing order:


    | Name | Notation |

    |---|---|

    | Constant | O(1) |

    | Logarithmic | O(log n) |

    | Linear | O(n) |

    | N-LogN | O(n log n) |

    | Quadratic | O(n^2) |

    | Polynomial | O(n^c) c is a constant & c>1 |

    | Exponential | O(c^n) c is a constant & c>1 |

    | Factorial or N-power-N | O(n!) or O(n^n) |


    # Constant Time: O(1)


    An algorithm is said to run in constant time regardless of the input size.

    Examples:


    +   1. Accessing n^th element of an array

    2. Push and pop of a stack.

    3. Enqueue and remove of a queue.

    4. Accessing an element of Hash-Table.

    5. Bucket sort


    # Linear Time: O(n)


    An algorithm is said to run in linear time if the execution time of the algorithm
    is directly proportional to the input size.

    Examples:


    +   1. Array operations like search element, find min, find max etc.

    2. Linked list operations like traversal, find min, find max etc.


    Note: when we need to see/ traverse all the nodes of a data-structure for some
    task complexity is no less than **O(n)**


    # Logarithmic Time: O(log n)


    An algorithm is said to run in logarithmic time if the execution time of the algorithm
    is proportional to the logarithm of the input size. Each step of an algorithm,
    a significant portion of the input is pruned out without traversing it.

    Example:


    +   1. Binary search'
