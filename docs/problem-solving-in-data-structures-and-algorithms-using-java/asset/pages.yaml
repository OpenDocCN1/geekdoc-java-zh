  md: '# Introduction


    In the previous chapter, we have looked into various searching techniques. Consider
    a problem of searching a value in an array. If the array is not sorted then we
    have no other option to look into each and every element one by so the searching
    Time Complexity will be O(n). If the array is sorted then we can search the value
    we are looking for in O(logn) logarithmic time using binary search.


    What if we have a function that can tell us the location/index of the value we
    are looking for in the array? We can directly go into that location and tell whether
    our object we are searching for is present or not in just O(1) constant time.
    Such a function is called a Hash function.


    In real life when a letter is handed over to a postman, by looking at the address
    on the letter, postman precisely knows to which house this needs to be delivered.
    He is not going to ask for a person door to door.


    ![](img/fe8f1cc519c7716e78f4de4934978705_346_0.png)


    The process of storing objects using a hash function is as follows:


    +   1. Create an array of size M to store objects; this array is called Hash-Table.

    2. Find a hash code of the object by passing it through the hash function.

    3. Take module of hash code by the size of Hashtable to get the index of the table
    where objects will be stored.

    4. Finally store these objects in the designated index.

    5. Find a hash code of the object we are searching for by passing it through the
    hash function.

    6. Take module of hash code by the size of Hashtable to get the index of the table
    where objects are stored.


    The process of searching objects in Hash-Table using a hash function is as follows:'
