  md: '# Access Modifiers


    Access modifiers are used to set the visibility level to the class, variables
    and methods. JAVA provide four types access modifiers: default, public, protected,
    private.


    +   1. **Default** modifier (No modifier needed.) has visibility to the package.

    2. **Private** modifier has visibility only within its own class.

    3. **Public** modifier has visibility to all the classes in the package.

    4. **Protected** modifier has visibility within its own class and the subclasses
    its own class.'
