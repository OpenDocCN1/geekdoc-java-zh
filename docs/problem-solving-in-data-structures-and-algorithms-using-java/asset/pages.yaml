  md: '# Binary Search Tree (BST)


    A binary search tree (BST) is a binary tree on which nodes are ordered in the
    following way:

    * The key in the left subtree is less than the key in its parent node.

    * The key in the right subtree is greater than the key in its parent node.

    * No duplicate key allowed.


    Note: there can be two separate key and value fields in the tree node. But for
    simplicity, we are considering as the key. All problems in the binary search tree
    are solved using this supposition that the value in the node is key for the tree.


    Note: Since binary search tree is a binary tree to all the above algorithm of
    a binary tree are applicable to a binary search tree.


    ![](img/fe8f1cc519c7716e78f4de4934978705_300_0.png)'
