  md: '1. The most basic approach is Round Robin. Data is distributed in a circular
    fashion. First, data go to the first database, the second will go to the second
    database and so on. Each database server will have an equal load. However, it
    has a disadvantage that the data lookup is complex. And need a large lookup table.


    2. Another approach is to divide the data in such a way that all the data will
    go to the first machine until it reaches its maximum capacity. When maximum capacity
    is reached, then data goes to the second machine and so on. This approach has
    an advantage that only the required number of machines is used. However, it has
    a disadvantage that the data lookup is complex. And need a large lookup table.


    3. Another approach is to select database corresponds to the hash value of the
    data. Find the hash value of the data by the number of databases. The data are
    stored in the database value we get after modulus. For a value approach we do
    not require any lookup table. We can find the database, which is storing the data,
    by finding the hash value. However, the problem of uneven distribution of data
    is, there is possible to have a more data sent to a database, which has already
    reached its maximum capacity. In this case, we need to find a better load-balancing
    key or split the data from the database into a number of databases.


    4. In the hash value, based distribution of data there is no relation between
    the data that is stored in a particular database. Information about the data can
    be used to make the database accessible faster. For example, in social networking
    like Facebook, if someone who lives in India is more likely to have friends from
    India. And someone who lives in the USA is more likely to have friends in the
    USA.


    5. Perhaps location aware (approach 4) and the hash value based (approach 3) distribution
    of data may be the best approach to keep the data so that it can take advantage
    of both the approaches. Country code and user ID can be used to get the location
    of the database.


    # Redundancy


    There is one problem in our system, there is a redundancy in the servers but our
    load balancer is now our single point of failure. We add a secondary load balancer
    in case the primary load balancer dies, then secondary load balancer becomes primary
    and then all the requests will be handled by it.'
