  md: '# Reference Data Types


    Reference variables are used to store memory address of classes as well as arrays.
    Any variable other them 8 primitive data types are reference data type.


    Parameter passing of a reference variable is done by copying the address of the
    variable. This method is called pass-by-reference. Since the object is not copied,
    it is shared, the changes done in a called function are also reflected to the
    caller of the function.


    Comparison (==) in reference variable is done by comparing the address of the
    variable.


    The default value of any reference variable is null.


    Returning reference variable from a method return address of the variable. If
    the returned address is stored in some other variable the locally created object
    is not destroyed.'
