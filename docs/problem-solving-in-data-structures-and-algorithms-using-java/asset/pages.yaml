  md: '# Constraints


    Solving a technical question is not just about knowing the algorithms and designing
    a good software system. The interviewer wants to know you approach towards any
    given problem. May people make mistakes, as they do not ask clarifying questions
    about a given problem? They assume many things and begin working with that. There
    are a lot of data that is missing that you need to collect from your interviewer
    beginning to solve a problem.


    In this step, you will capture all the constraints about the problem. We should
    never try to solve a problem that is not completely defined. Interview questions
    are not like exam paper where all the details about a problem are well defined.
    In the interview, the interviewer expects you to ask questions and clarify the
    problem.


    For example: When the problem statement says that you write an algorithm to sort
    numbers.


    The first information you need to capture is what kind of data. Let us suppose
    interviewer respond with the answer Integer.

    The second information that you need to know what is the size of data. Your algorithm
    differs if the input data size is 100 integers or 1 billion integers.


    Basic guideline for the Constraints for an array of elements in the array:


    +   1. How many numbers of elements in the array?

    2. What is the range of value in each element? What is the min and max value?

    3. What is the kind of data in each element is it an integer or floating point?

    4. Does the array contain unique data or not?


    Basic guideline for the Constraints for an array of string:


    +   1. How many numbers of elements in the array?

    2. What is the length of each string? What is the min and max length?

    3. Does the array contain unique data or not?


    Basic guideline for the Constraints for a Graph


    +   1. How many nodes are there in the graph?

    2. How many edges are there in the graph?

    3. Is it a weighted graph? What is the range of weights?

    4. Is the graph directed or undirected?

    5. Is there a loop in the graph?

    6. Is there negative sum loop in the graph?

    7. Does the graph have self-loops?


    We have already seen this in graph chapter depending upon the constraints the
    algorithm'
