  md: "# Problems on Divide-and-Conquer Algorithm\n\n# Merge-Sort algorithm\n\n![](img/fe8f1cc519c7716e78f4de4934978705_455_0.png)\n\
    \n```\n// Sorts a given array by mergesort\n// Input: An array A of orderable\
    \ elements\n// Output: Array A[0..n-1] in ascending order\n\nAlgorithm Mergesort(A[0..n-1])\n\
    if n ≤ 1 then\n    return;\ncopy A[0..n/2-1] to B[0..n/2-1]\ncopy A[n/2..n-1]\
    \ to C[0..n/2-1]\nMergesort(B)\nMergesort(C)\nMerge(B, C, A);\n```\n\n```\n//\
    \ Merges two sorted arrays into one array\n// Input: Sorted arrays B and C\n//\
    \ Output: Sorted array A\nAlgorithm Merge(B[0..p-1], C[0..q-1], A[0..p+q-1])\n\
    i = 0\nnj = 0\nfor k = 0 to p+q-1 do\n    if i < p and (j = q or B[i] ≤ C[j])\
    \ then\n        A[k] = B[i]\n        i = i + 1\n    else\n        A[k] = C[j]\n\
    \        j = j + 1\n```\n\nTime Complexity: **O(nlogn)**\n\nSpace Complexity:\
    \ **O(n)**\nThe **Time Complexity** of Merge-Sort is **O(nlogn)** in all 3 cases\
    \ (worst, average and best)\nMerge-Sort always divides the array into two halves\
    \ and take linear time to merge two halves."
