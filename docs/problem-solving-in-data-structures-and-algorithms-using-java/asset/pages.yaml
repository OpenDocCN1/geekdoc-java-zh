    We consider the problem of calculating the least amount of time necessary to build
    a car using a manufacturing chain with two assembling lines, as shown in the figure

    The problem variables:


    +   - e[i]: entry time in assembly line i

    - x[i]: exit time from assembly line i

    - a[i,j]: Time required at station S[i,j] (assembly line i, stage j)

    - t[i,j]: Time required to transit from station S[i,j] to the other assembly line


    Your program must calculate:

    - The least amount of time needed to build a car

    - The list of stations to traverse in order to assemble a car as fast as possible.

    The manufacturing chain will have no more than 50 stations.


    If we want to solve this problem in the brute force approach, there will be in
    total 2ⁿ combinations with the Time Complexity is O(2ⁿ)


    Step 1: Characterizing the structure of the optimal solution

    To calculate the fastest assembly time, we only need to know the fastest time
    to S1;n and the fastest time to S2;n, including the assembly time for the nth
    path. Then we choose between the two exiting points by taking into consideration
    the extra time required, x1 and x2. To compute the fastest time to S1;n we only
    need to know the fastest time to S1;n and to S2;n. There are only two choices...


    Step 2: A recursive definition of the values to be computed


    ```

    $f1[j] = \begin{cases} e1 + a1,1 & if j=1 \ \min(f1[j-1] + a1,j) & if j \ge 2
    \end{cases}$

    f2[j] = \begin{cases} e2 + a2,1 & if j=1 \ \min(f2[j-1] + a2,j), f1[j-1] + t1,j-1
    + a2,j) & if j \ge 2 \end{cases}$

    ```'
