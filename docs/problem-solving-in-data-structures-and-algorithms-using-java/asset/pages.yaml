  md: '# Introduction


    Computer programmer learn by experience. We learn by seeing solved problem-solving
    techniques and by solving new problems by ourselves. Studying various different
    algorithms are designed helps us to solve the next problem that is given to us.
    By considering a number of different algorithms, we can begin to develop pattern
    so that the next time a similar problem arises, we are better able to solve it.


    When an interviewer asks to develop a program in an interviewer, what are the
    steps that an interviewee should follow? We will be taking a systematic approach
    to handle the problem and finally reaching to the solution.


    # Algorithm


    An algorithm is a set of steps to accomplish a task. An algorithm in a computer
    program is a set of steps applied over a set of input to produce a set of output.


    Knowledge of algorithm helps us to get our desired result faster by applying the
    right algorithm.


    The most important properties of an algorithm are:


    +   1. Correctness: The algorithm should be correct. It should be able to process
    all the given inputs and provide correct output.

    2. Efficiency: The algorithm should be efficient in solving problems.


    Algorithmic complexity is defined as how fast a particular algorithm performs.
    Complexity represented by function T (n) - time versus the input size n.'
