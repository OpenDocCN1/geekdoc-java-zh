    \ A condition in which recursive method is processing a simple case and will not\
    \ call itself.\n2. Body (including recursive expansion): The main logic of the\
    \ recursive method contained in the body of the method. It also contains the recursion\
    \ expansion statement that in turn calls the method itself.\n\nThree important\
    \ properties of recursive algorithm are:\n1) A recursive algorithm must have a\
    \ termination condition.\n2) A recursive algorithm must change its state, and\
    \ move towards the termination condition.\n3) A recursive algorithm must call\
    \ itself.\n\nNote: The speed of the recursive program is slower because of stack\
    \ overhead. If the same task can be done using an iterative solution (loops),\
    \ then we should prefer an iterative solution (loops) in place of recursion to\
    \ avoid stack overhead.\n\nNote: Without termination condition, the recursive\
