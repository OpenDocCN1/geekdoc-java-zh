    2. The maximum number of nodes in a binary tree of depth k is 2^{k+1}, where k
    >= 1

    3. There is exactly one path from the root to any nodes in a tree.

    4. A tree with N nodes have exactly N-1 edges connecting these nodes.

    5. The height of a complete binary tree of N nodes is log2 N.'
