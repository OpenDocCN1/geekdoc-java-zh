  md: "# Hash-Table\n\nA Hash-Table is a data structure that maps keys to values.\
    \ Each position of the Hash-Table is called a slot. The Hash-Table uses a hash\
    \ function to calculate an index of an array of slots. We use the Hash-Table when\
    \ the number of keys actually stored is small relatively to the number of keys.\n\
    \n# Hash-Table Abstract Data Type (ADT)\n\n+   ADT of Hash-Table contains the\
    \ following functions:\n1. Insert(x), add object x to the data set.\n2. Delete(x),\
    \ delete object x from the data set.\n3. Search(x), search object x in data set.\n\
    \n# Hash Function\n\nA hash function is a function that generates an index in\
    \ a table for a given object.\n ideal hash function should generate a unique index\
    \ for each and every object is called the perfect hash function.\n\n**Example\
    \ 12.1:** Most simple hash function\n\n```\nprivate int ComputeHash(int key)//division\
    \ method\n{\n  int hashValue = 0;\n  hashValue = key;\n  return hashValue % tableSize;\n\
    }\n```\n\nThere are many hash functions, but this is the minimum that a hash function\
    \ should do. Various hash generation logics will be added to this function to\
    \ generate a better hash.\n\n# Properties of good hash function:\n\n+   1. It\
    \ should provide a uniform distribution of hash values. A non-uniform distribution\
    \ increased the number of collisions and the cost of resolving them.\n2. Choose\
    \ a hash function which can be computed quickly and returns values within the\
    \ range of the Hash-Table.\n3. Choose a hash function with a good collision resolution\
    \ algorithm which can be used to compute alternative index if the collision occurs.\n\
    4. Choose a hash function which uses the necessary information provided in the\
    \ key.\n5. It should have high load factor for a given set of keys."
