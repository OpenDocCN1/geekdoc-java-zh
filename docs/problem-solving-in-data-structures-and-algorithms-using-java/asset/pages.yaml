  md: '# Class NP problems


    Set of problems for which there is a polynomial time checking algorithm. Given
    a solution we can check in a polynomial time if that solution is correct or not
    then, the problem is NP.


    Class NP Definition: The class NP contains all decision problems for which, given
    a solution, there exists a polynomial time “proof” or “certificate” that can verify
    if the solution is the right “yes/no” answer


    ![](img/fe8f1cc519c7716e78f4de4934978705_483_0.png)


    **Note:** There is no guarantee that you will be able to solve this problem in
    polynomial time. If a problem is an NP problem, then you can verify an answer
    in polynomial time.


    NP does not mean polynomial. Actually, it is Non-Deterministic polynomial type
    of problem. They are the kind of problems which can be solved in polynomial time
