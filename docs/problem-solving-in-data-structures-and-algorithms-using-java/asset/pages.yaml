    Know the theoretical knowledge of the algorithm is essential, but it is not sufficient.
    You need to have a systematic approach to solve a problem. Our approach is fundamentally
    different to solve any algorithm design question. We will follow a systematic
    five-step approach to reach to our solution. Master this approach and you will
    be better than most of the candidates in interviews.


    Five steps for solving algorithm design questions are:


    +   1. Constraints

    2. Ideas Generation

    3. Complexities

    4. Coding

    5. Testing'
