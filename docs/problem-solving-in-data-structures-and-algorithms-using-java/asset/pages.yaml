  md: "# Binary Search\n\nHow do we search a word in a dictionary? In general, we\
    \ go to some approximate page (mostly middle) and start searching from that point.\
    \ If we see the word that we are searching is same we are done with the search.\
    \ Else, if we see the page is before the selected pages, then apply the same procedure\
    \ for the first half otherwise to the second half. Binary Search also works in\
    \ the same way. We get the middle point from the sorted array and start comparing\
    \ with the desired value.\n\n**Note:** Binary search requires the array to be\
    \ sorted otherwise binary search cannot be.\n\n# **Example 5.3**\n\n```\n// Binary\
    \ Search Algorithm – Iterative Way\nboolean Binarysearch(int[] arr, int size,\
    \ int value)\n{\n    int low = 0;\n    int high = size-1;\n    int mid;\n    while\
    \ (low <= high) {\n        mid = low + (high-low)/2; // To avoid overflow\n  \
    \      if (arr[mid] == value)\n            return true;\n        else if (arr[mid]\
    \ < value)\n            low = mid + 1;\n        else\n            high = mid -\
    \ 1;\n    }\n    return false;\n}\n```\n\n**Time Complexity:** **O(logn)**. We\
    \ always take half input and throwing out the other half. So the recurrence relation\
    \ for binary search is T(n)=T(n/2) + c. Using master theorem (divide and conquer),\
    \ we get T(n)=**O(logn)**\n\n**Space Complexity:** O(1)\n\n# **Example 5.4**\n\
    \n```\n// Binary Search Algorithm – Recursive Way\nboolean BinarySearchRecursive(int[]\
    \ arr, int low, int high, int value)\n{\n    if(low > high)\n        return false;\n\
    \    int mid = low + (high-low)/2; // To avoid overflow\n\n    if (arr[mid] ==\
    \ value)\n        return true;\n    else if (arr[mid] < value)\n        return\
    \ BinarySearchRecursive(arr, mid + 1, high, value);\n    else\n        return\
    \ BinarySearchRecursive(arr, low, mid - 1, value);\n}\n```"
