  md: 'of the other vertices. Dijkstra’s algorithm is similar to prims algorithm.
    It maintains a set of nodes for which shortest path is known.


    ![](img/fe8f1cc519c7716e78f4de4934978705_386_0.png)


    The algorithm starts by keeping track of the distance of each node and its parents.
    All the distance is set to infinite in the beginning as we don''t know the actual
    path to the nodes and parents of all the vertices are set to null. All the vertices
    are added to a priority queue (min heap implementation)

    At each step algorithm takes one vertex from the priority queue (which will be
    the source vertex in the beginning). Then update the distance array corresponding
    to all the adjacent vertices. When the queue is empty, we will have the distance
    and parent array fully populated.


    Example 13.12:

    // Solves SSP by Dijkstra''s Algorithm

    // Input: A weighted connected graph G = (V, E)

    // with no negative weights, and source vertex v

    // Output: The length and path from s to every v


    ```

    Algorithm Dijkstra(G, s)

    for v in V do

    D[v] = infinite // Unknown distance

    P[v] = null //unknown previous node

    add to PQ //adding all nodes to priority queue

    ```


    D[source] = 0 // Distance from source


    ```

    while (PQ is not empty)

    u = vertex from PQ with smallest D[u]

    remove u from PQ

    for each v adjacent to u do

    alt = D[u] + length (u , v)

    if alt < D[v] then

    D[v] = alt

    P[v] = u

    ```


    # Time Complexity is O(|E|log|V|)


    Note: Dijkstra’s algorithm does not work for graphs with negative edges weight.

    Note: Dijkstra’s algorithm is applicable to both undirected and directed graphs.'
