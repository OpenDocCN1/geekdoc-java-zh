  md: '# Branch-and-bound


    Branch and bound method is used when we can evaluate cost of visiting each node
    by a utility functions. At each step we choose the node with lowest cost to proceed
    further. Branch-and bound algorithms are implemented using a priority queue. In
    branch and bound we traverse the nodes in breadth-first manner.'
