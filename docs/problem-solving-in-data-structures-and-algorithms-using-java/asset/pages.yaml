  md: "![](img/fe8f1cc519c7716e78f4de4934978705_285_0.png)\n\n# Solution:\n\nLevel\
    \ order traversal or Breadth First traversal of a tree is done using a queue.\
    \ At the start, the root node reference is added to queue. The traversal of tree\
    \ happens until its queue is empty. When we traverse the tree, we first remove\
    \ an element from the queue, print the value stored in that node and its left\
    \ child and right child will be added to the queue.\n\n# Example 10.5:\n\n```\n\
    public void PrintBreadthFirst(){\n    Deque<Node> que = new ArrayDeque<Node>();\n\
    \    Node temp;\n\n    if(root != null)\n        que.add(root);\n    while(que.isEmpty()\
    \ == false) {\n        temp=que.remove();\n        System.out.println(temp.value);\n\
    \        if(temp.leftChild != null)\n            que.add(temp.leftChild);\n  \
    \      if(temp.rightChild != null)\n            que.add(temp.rightChild);\n  \
    \  }\n}\n```\n\nComplexity Analysis: Time Complexity: **O(n)** Space Complexity:\
    \ **O(n)**\n\n# Print Depth First without using the recursion / system stack.\n\
    \n**Solution:** Depth first traversal of the tree is done using recursion using\
