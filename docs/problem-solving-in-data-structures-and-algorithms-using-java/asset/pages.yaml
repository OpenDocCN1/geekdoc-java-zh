  md: "# Modified (improved) Bubble-Sort\n\nWhen there is no more swap in one pass\
    \ of the outer loop. It indicates that all the elements are already in order so\
    \ we should stop sorting. This sorting improvement in Bubble-Sort is extremely\
    \ useful when we know that, except few elements rest of the array is already sorted.\n\
    \n# Example 6.2\n\n```\npublic void sort()\n{\n    int size = arr.length;\n  \
    \  int i, j, swapped=0;\n    for (i = 0; i < (size - 1) && swapped == 1; i++)\
    \ {\n        swapped = 0;\n        for (j = 0; j < size - i - 1; j++) {\n    \
    \        if (more(arr[j], arr[j + 1])) {\n                /* Spacing */\n    \
    \            temp = arr[j];\n                arr[j] = arr[j + 1];\n          \
    \      arr[j + 1] = temp;\n                swapped = 1;\n            }\n     \
    \   }\n    }\n}\n```\n\nBy applying this improvement, best case of this algorithm,\
    \ when an array is nearly sorted, improved.\nBest case is O(n)\n\n# Complexity\
    \ Analysis:\n\n| Worst case performance | O(n²) |\n| Average case performance\
    \ | O(n²) |\n| Space Complexity | O(1) |\n| Adaptive: When array is nearly sorted\
    \ | O(n) |\n| Stable Sorting | Yes |"
