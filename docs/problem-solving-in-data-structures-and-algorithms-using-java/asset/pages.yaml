  md: "# Minimum Spanning Trees (MST)\n\nA Spanning Tree of a graph G is a tree which\
    \ contains all the edges of the Graph G. A Minimum Spanning Tree is a tree whose\
    \ sum of length/weight of edges is minimum as possible. For example, if you want\
    \ to setup communication between a set of cities, then you may want to use the\
    \ least amount of wire where MST can be used to find the network path and wire\
    \ cost estimate.\n\n![](img/fe8f1cc519c7716e78f4de4934978705_381_0.png)\n\n# Prim’s\
    \ Algorithm for MST\n\nPrim’s algorithm grows a single tree T, one edge at a time,\
    \ until it becomes a spanning tree. We initialize T with zero edges. And U with\
    \ single node. Where T is spanning tree edges set and U is spanning tree vertex\
    \ set.\nAt each step, Prim’s algorithm adds the smallest value edge with one endpoint\
    \ in U and not in us. Since each edge adds one vertex to U, after n – 1 additions,\
    \ U contain all the vertices of the spanning tree and T becomes a spanning tree.\n\
    \nExample 13.8:\n// Returns the MST by Prim’s Algorithm\n// Input: A weighted\
    \ connected graph G=(V, E)\n// Output: Set of edges comprising a MST\n\n```\n\
    Algorithm Prim(G)\nT = {}\nLet r be any vertex in G\nU = {r}\nfor i = 1 to |V|\
    \ - 1 do\n  e = minimum-weight edge (u, v)\n  With u in U and v in V-U\n  U =\
    \ U + {v}\n  T = T + {e}\nreturn T\n```\n\nPrim’s Algorithm using a priority queue\
    \ (min heap) to get the closest fringe vertex"
