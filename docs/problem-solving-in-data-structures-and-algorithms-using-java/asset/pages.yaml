  md: "# Types of Linked list\n\nThere are different types of linked lists. The main\
    \ difference among them is how their nodes refer to each other.\n\n# Singly Linked\
    \ List\n\nEach node (Except the last node) has a reference to the next node in\
    \ the linked list. The link portion of the last node contains the address of the\
    \ next node. The link portion of the last node contains the value null.\n\n![](img/fe8f1cc519c7716e78f4de4934978705_191_0.png)\n\
    \n# Doubly Linked list\n\nThe node in this type of linked list has reference to\
    \ both previous and the next node in the list.\n\n![](img/fe8f1cc519c7716e78f4de4934978705_191_1.png)\n\
    \n# Circular Linked List\n\nThis type is similar to the singly linked list except\
    \ that the last element have reference to the first node of the list. The link\
    \ portion of the last node contains the address of the first node.\n\n![](img/fe8f1cc519c7716e78f4de4934978705_191_2.png)\n\
    \n# The various parts of linked list\n\n+   1. Head: Head is a reference that\
    \ holds the address of the first node in the linked list.\n2. Nodes: Items in\
    \ the linked list are called nodes.\n3. Value: The data that is stored in each\
    \ node of the linked list.\n4. Link: Link part of the node is used to store the\
    \ reference of other node.\n   a. We will use “next” and “prev” to store address\
    \ of next or previous node."
