    We so look into the following problem: Husbands and their wives are standing in
    random in a line. They have been numbered for husbands H1, H2, H3 and so on. And
    their corresponding wives have number W1, W2, W3 and so on. You need to arrange
    them so that H1 will stand first, followed by W1, then H2 followed by W2 and so
    on.

    At the first look, it looks difficult, but it is a simple problem. Try to find
    a relation of the final position.

    P(Hi) = i*2-1, P(Wi) = i*2

    The of the algorithm we are leaving you to do something Insertion-Sort and you
    are done.


    # Try a few examples


    In the above problem if you have tried it with some example for 3 husband and
    wife pair then you may have reached to the formula that we have shown in the previous
    section. Some time thinking more examples try to solve the problem at hand.


    # Think of a suitable data-structure


    For some problems, it is straight forward which data structure will be most suitable
    for. For example, if we have a problem finding min/max of some given value, then
    probably heap is the'
