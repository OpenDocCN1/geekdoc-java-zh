  md: '# Theta-Θ Notation


    Definition: "f(n) is theta of g(n).” or f(n) = Θ(g(n)) if there are three +ve
    constants c1, c2 and n0 such that c1 g(n) ≤ f(n) ≤ c2 g(n) for all n ≥ n0


    g(n) is an asymptotically tight bound on f(n). Function f(n) grows at the same
    rate as g(n).


    ![](img/fe8f1cc519c7716e78f4de4934978705_66_0.png)


    Example: n³ + n² + n = Θ(n²)


    Example: n² + n = Θ(n²)

    Find relationship of f(n) = 2n² + n and g(n) = n²

    f(n) = O(g(n))

    f(n) = Θ(g(n))

    f(n) = Ω(g(n))


    Note:- Asymptotic Analysis is not perfect, but that is the best way available
    for analyzing algorithms.


    For example, say there are two sorting algorithms first take f(n) = 10000n log
    and f(n) = n² time. The asymptotic analysis says that the first algorithm is better
    (as it ignores constants) but actually for a small set of data when n is small
    then 10000, the second algorithm will perform better. To consider this drawback
    of asymptotic analysis case analysis of the algorithm is introduced.'
