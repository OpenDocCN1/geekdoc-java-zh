  md: '# Types of Binary trees


    # Complete binary tree


    In a complete binary tree, every level except the last one is completely filled.
    All nodes in the left are filled first, then the right one.

    A binary heap is an example of a complete binary tree.


    ![](img/fe8f1cc519c7716e78f4de4934978705_278_0.png)


    # Full/ Strictly binary tree


    The full binary tree is a binary tree in which each node has exactly zero or two
    children.


    ![](img/fe8f1cc519c7716e78f4de4934978705_278_1.png)


    # Perfect binary tree


    The perfect binary tree is a type of full binary tree in which each non leaf node
    has exactly two child nodes.

    All leaf nodes have identical path length and all possible node slots are occupied'
