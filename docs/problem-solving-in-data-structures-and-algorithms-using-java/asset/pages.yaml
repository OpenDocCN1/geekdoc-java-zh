  md: '# Uses of Heap


    +   1. **Heapsort**: One of the best sorting methods being in-place and log(N)
    time complexity in all scenarios.


    +   2. **Selection algorithms**: Finding the min, max, both the min and max, median,
    or even the kth largest element can be done in linear time (often constant time)
    using heaps.


    +   3. **Priority Queues**: Heap Implemented priority queues are used in Graph
    algorithms like [Prim''s Algorithm](#) [Dijkstra''s algorithm](#). A heap is a
    useful data structure when you need to remove the object with the highest (or
    lowest) priority. Schedulers, timers


    +   4. **Graph algorithms**: By using heaps as internal traversal data structures,
    run time will be reduced by polynomial order. Examples of such problems are Prim’s
    minimal


    +   5. Because of the lack of references, the operations are faster than a binary
    tree. Also, some more complicated heaps (such as binomial) can be merged efficiently,
    which isn''t easy to do for a binary tree.'
