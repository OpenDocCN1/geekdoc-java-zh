  md: '# System Design Process


    Let''s look into a 5 Steps approach for solving system design problems:

    1. Use Cases Generation

    2. Constraints and Analysis

    3. Basic Design

    4. Bottlenecks

    5. Scalability


    # Use Cases


    Just like algorithm design problems, the system design questions are also most
    likely weakly defined. There is so much information that is missing and without
    them the design impossible. So first thing in the design process is that you should
    gather all the possible use cases. You should ask questions to the interviewer
    to find the use case of the system. The interviewer wants to see your requirement
    gathering capability. Same as algorithm questions never assume things, which are
    not stated.


    # Constraints and Analysis


    This is the step in which you will define various constraints of the system and
    then analyse them. Your system design will depend on the analysis that you do
    in this step. In this step, you need to find answers to questions like. How many
    users will be using the system? What kind of data that we are going to store?
    Etc.


    # Basic Design


    In this step, you will design the most basic design of the system. Draw your main
    components and make connections between them. In this step, you need to design
    a system with the supposition that there is no memory limitation and all data
    can fit in one single machine. You should be able to justify your idea. In this
    step, you need to handle all the use-cases.


    # Bottlenecks Analysis


    In this step, you will find the one or more bottlenecks on the basic design you
    had proposed. The “Scalability Theory” given below will help to identify the bottlenecks.
    You need to know the below which experts had developed over time. In this step,
    you will consider how much data your proposed system can handle, memory limitations
    etc.


    # Scalability'
