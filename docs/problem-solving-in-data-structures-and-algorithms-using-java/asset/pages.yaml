    Various Algorithm design techniques are:


    +   1) Brute Force

    2) Greedy Algorithms

    3) Divide-and-Conquer, Decrease-and-Conquer

    4) Dynamic Programming

    5) Reduction / Transform-and-Conquer

    6) Backtracking and Branch-and-Bound'
