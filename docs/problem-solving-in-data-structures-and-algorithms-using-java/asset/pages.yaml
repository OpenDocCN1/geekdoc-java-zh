  md: "# Depth First Traversal\n\nThe DFS algorithm we start from starting point and\
    \ go into depth of graph until we reach a dead end and move up to parent node\
    \ (Backtrack). In DFS we use stack to get the next vertex to start a search. Or\
    \ we can use recursion (system stack) to do the same.\n\n![](img/fe8f1cc519c7716e78f4de4934978705_373_0.png)\n\
    \nAlgorithm steps for DFS\n\n+   1. Push the node in the stack.\n2. Loop until\
    \ the stack is empty.\n3. Pop the node from the stack inside loop call this current\
    \ node.\n4. Process the current node. //Print, etc.\n5. Traverse all the child\
    \ nodes of the current node and push them into stack.\n6. Repeat steps 3 to 5\
    \ until the stack is empty.\n\n# Stack based implementation of DFS\n\nExample\
    \ 13.2:\n\n```\npublic void DFSStack(Graph gph, int start) {\n  int count = gph.count;\n\
    \  int[] visited = new int[count];\n  int curr;\n  Stack<Integer> stk = new Stack<Integer>();\n\
    \  for (int i = 0; i < count; i++) {\n    visited[i] = 0;\n  }\n  visited[start]\
    \ = 1;\n  stk.push(start);\n\n  while (stk.isEmpty() == false) {\n    curr = stk.pop();\n\
    \    AdjNode head = gph.array[curr].head;\n    while(head != null) {\n      if\
    \ (visited[head.destination] == 0) {\n        visited[head.destination] = 1;\n\
    \        stk.push(head.destination);\n      }\n    }\n  }\n```"
