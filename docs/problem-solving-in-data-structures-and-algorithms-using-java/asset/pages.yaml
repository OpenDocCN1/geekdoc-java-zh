  md: '# Reduction / Transform-and-Conquer


    These methods works as two-stage procedure. First, the problem is transformed
    into a known problem for which we know optimal solution. In the second stage,
    the problem is solved.


    The most common types of transformation are sort of an array.


    For example: Given an array of numbers finds the two closest number.


    The brute force solution for this problem will take distance between each element
    in the array and will try to keep the minimum distance pair; this approach will
    have a Time Complexity of $O(n^2)$


    Transform and conquer solution, will be first sort the array in $O(nlogn)$ time
    and then find the closest number by scanning the array in another $O(n)$. Which
    will give the total Time Complexity of $O(nlogn)$.


    Examples:


    +   - Gaussian elimination

    - Heaps and Heapsort'
