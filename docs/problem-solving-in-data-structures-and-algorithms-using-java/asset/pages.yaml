    f(n) = n = Θ(nlog₂² log⁰n)

    Case 2 applies and T(n) = Θ(nlog₂² log⁰¹ n)

    T(n)=Θ(n log(n))


    Example 15: Binary Search T(n) = T(n/2) +O(1)'
