  md: '# # The Stack Abstract Data Type


    Stack abstract data type is defined as a class, which follows LIFO or last-in-first-out
    for the elements, added to it.


    The stack should support the following operation:


    +   - Push(): which add a single element at the top of the stack

    - Pop(): which remove a single element from the top of the stack.

    - Top(): Reads the value of the top element of the stack (does not remove it)

    - isEmpty(): Returns 1 if stack is empty

    - Size(): returns the number of elements in a stack.


    ![](img/fe8f1cc519c7716e78f4de4934978705_237_0.png)


    Add n to the top of a stack

    void push(int value);


    Remove the top element of the stack and return it to the caller function.

    int pop();


    The stack can be implemented using an array or a linked list.

    In array case, there are two types of implementations


    +   - One in which array size is fixed, so it the capacity of the stack.

    - Another approach is variable size array in which memory of the array is allocated
    using malloc and when the array is filled the size doubled using realloc (when
    the stack size decreases below half the capacity is again reduced).'
