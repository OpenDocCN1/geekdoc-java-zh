  21. System.out.print(\"No. of Words=\" + cnt);\n22. }\n23. }\n```\nOutput: No. of\
  \ Words=5\n\n![STAR-LOGO-2013](img/00006.jpeg)\n\n# (异常处理)\n\n## 简介\n\n异常（Exception）是由程序运行时错误导致的条件，它会破坏程序的正常执行流。当\
  \ Java 解释器遇到如整数除以零之类的错误时，它会创建一个 `Exception` 对象并将其抛出（即：通知我们发生了错误）。\n\n每当运行时发生异常时，Java\
  \ 异常/错误都是 `Exception` 类或其子类的一个对象。异常对象包含了有关异常的详细信息，可以使用为此目的提供的公共方法来访问这些信息。\n\n在一些旧的语言中，我们必须使用\
  \ `if`、`goto` 和 `return` 状态码来进行错误处理。\n\n异常是代码序列在运行时出现的一种异常状态。换句话说，异常是一种运行时错误。在不支持异常处理的计算机语言中，必须手动检查并处理错误——通常通过使用错误代码等。这种方法既繁琐又麻烦。Java\
  \ 的异常处理避免了这些问题，并在过程中将运行时错误管理引入了面向对象的世界。\n\n## 异常处理基础\n\nJava 异常是一个描述在代码段中发生的异常状态（即错误状态）的对象。当出现异常状态时，会创建一个代表该异常的对象，并在导致该错误的方法中将其抛出。该方法可以选择由自己处理该异常，也可以将其传递下去。\n\
  \n无论何种方式，异常在某一点都会被捕获并处理。异常可以由 Java 运行时系统生成，也可以由你的代码手动生成。Java 抛出的异常与违反 Java 语言规则或\
  \ Java 执行环境限制的根本错误有关。手动生成的异常通常用于向方法的调用者报告某些错误状态。\n\nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws`\
  \ 和 `finally`。简而言之，它们的工作原理如下：你想要监控异常的程序语句包含在 `try` 块中。如果在 `try` 块内部发生异常，异常会被抛出。你的代码可以捕获此异常（使用\
  \ `catch`）并以某种合理的方式处理它。系统生成的异常由 Java 运行时系统自动抛出。要手动抛出异常，请使用关键字 `throw`。任何抛出方法的异常都必须通过\
  \ `throws` 子句进行说明。任何在 `try` 块执行完成后绝对必须执行的代码都放在 `finally` 块中。\n\n这是异常处理块的通用形式：\n\n\
  ```java\ntry {\n    // 用于监控错误的代码块\n} catch (Exception ex) {\n    // 针对 Exception\
  \ 的异常处理程序\n}\n.........\nfinally {\n    // 在 try 结束后必须执行的代码块\n}\n```\n\n## 异常类型\n\
  \n所有异常类型都是内置类 `Throwable` 的子类。因此，`Throwable` 处于异常层次结构的顶端。`Throwable` 之下有两个子类，它们将异常分为两个不同的分支。一个分支由\
  \ `Exception` 。该类用于用户程序应该捕获的异常状态。这也是你通过创建子类来定义自定义异常类型的类。`Exception` 有一个重要的子类，称为\
  \ `RuntimeException`。这种类型的异常为你编写的程序自动定义，包括如除以零和无效数组索引等内容。\n\n另一个分支由 `Error` 头部，它定义了在正常情况下你的程序预计不会捕获的异常。`Error`\
  \ 类型异常由 Java 运行时系统使用，表示与运行时环境本身相关的错误。`Stack overflow`（栈溢出）就是此类错误的示例。本章将不会处理 `Error`\
  \ 类型的异常，因为这些通常是由于灾难性故障产生的，通常你的程序无法处理它们。\n\n顶层异常层次结构所示：\n![](img/00028.jpeg)\n\n\
  ### 示例 11.1\n```java\nclass ErrorTest {\n    public static void main(String args[])\
  \ {\n        int a=5,b=2,c=2,d;\n        d=a/(b-c); // 发生了 ArithmeticException(Divide\
  \ by zero)\n        System.out.println(d);\n        System.out.println(\"This will\
  \ not be printed\");\n    }\n}\n```\n程序将在除法操作期间终止，不会执行剩余的语句。\n\n### 示例 11.2\n```java\n\
  class A {\n    void display() {\n    }\n}\nclass ErrorTest2 {\n    public static\
  \ void main(String args[]) {\n        A a1=null;\n        a1.display(); // 发生了 NullPointerException\n\
  \    }\n}\n```\n在上述程序中会发生 `NullPointerException`。引用变量没有用 `new` 初始化。在这种情况下，程序也会终止。\n\
  \n### 示例 11.3\n```java\nclass ErrorTest3 {\n    public static void main(String args[])\
  \ {\n        int a[] = {10,20,30};\n        System.out.println(a[3]); // 发生了 ArrayIndexOutOfBoundsException\n\
  \    }\n}\n```\n在上述情况下，数组的长度为 3，索引从 0 到 2，所以如果我们打印 `a[3]`，那么就是第 4 个元素，它不是有效的索引。这将产生异常错误。在\
  \ C/C++ 中这是允许的，但在 Java 中不允许。\n\n### 注意\n\nJDK 7 增加了 `try` 语句的新形式，支持自动资源管理。这种新的 `try`\
  \ 形式被称为 `try-with-resources`，它在管理文件的背景下对其进行了描述，因为文件是最常用的资源之一。\n\n如果异常对象没有被正确捕获和处理，解释器将显示错误信息并终止程序。如果我们想继续执行剩余代码，那么应该尝试捕获由错误条件抛出的异常对象。\n\
  \n\n\n\n\n# 异常处理\n\n此任务被称为异常处理。异常处理机制的目的是提供一种检测和报告“异常情况”的手段，以便采取适当的措施。该机制建议引入一套独立的错误处理代码，该代码执行以下任务：\n\
  \n1. 发现问题。（发生异常）\n2. 通知错误已发生。（抛出异常）\n3. 接收错误信息。（捕获异常）\n4. 纠正措施。（处理异常）\n\nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws`\
  \ 和 `finally`。\n\n我们想要监控异常的程序语句包含在 `try` 块中，并且每当发生错误时，它就会被抛出到 `catch` 块中。我们的代码可以捕获此异常（使用\
  \ `catch`）并以某种合理的方式进行处理。系统生成的异常由 Java 运行时系统自动抛出。\n\n若要手动抛出异常，请使用 `throw` 关键字。任何抛出方法的异常都必须通过\
  \ `throws` 子句进行指定。任何在方法返回之前必须执行的代码都放在 `finally` 块中。\n\n即使 `try` 块中只有一个语句，也必须括在大括号之间。可以有一个或多个\
  \ `catch` 语句，以及零或一个 `finally` 语句。`catch` 和 `finally` 块都是可选的，但必须至少包含一个 `catch` 块或一个\
  \ `finally` 块。\n\n`try` 块中的代码执行方式与任何其他 Java 代码一样。如果 `try` 块中的代码执行成功，则控制权将进入 `finally`\
  \ 块（如果存在），然后从 `finally` 块结束后的语句开始继续执行（即 `try` 语句结束之后）。如果不存在 `finally` 块，则执行从上一个\
  \ `catch` 块结束后的语句继续（即 `try` 语句结束之后）。\n\n如果在执行 `try` 块中的代码时发生某些运行时错误，JVM 就会抛出一个 `Exception\
  \ Error`。这意味着将根据运行时错误的类型创建一个 `Exception Error` 类型的对象或其子类之一。然后将其按照从上到下的顺序与 `catch`\
  \ 块中的 `Exception/Error` 类型进行比较。\n\n如果找到匹配的 `catch` 块，则处理异常/错误，即程序不会终止。执行将从 `catch`\
  \ 块中的第一个语句继续。在完成 `catch` 块后，执行从 `try` 和 `catch` 语句结束后的语句继续。\n\n无论有多少个 `catch` 块，最多只会执行一个\
  \ `catch` 块。如果异常/错误与任何 `catch` 块的异常/错误类型都不匹配，我们说它是未被处理的。\n\n执行将立即从 `try` 块返回。即使异常/错误未被处理，`finally`\
  \ 块中的代码也将被执行。\n\n如果有外层 `try` 块，则异常/错误将由其处理；否则它必须在调用当前的方法中被处理。\n\n异常/错误将沿层次结构向上移动，直到被处理，或者如果在\
  \ `main()` 方法（执行开始开始的第一个方法）中仍未被处理，则作为未处理的异常传递给 JVM。\n\nJVM 随后简单地终止程序并在显示器/控制台上显示异常/错误详情。\n\
  \n在这里我们表示了程序在执行时可能发生的某些异常。\n\n## 使用 try 和 catch\n\n尽管 Java 运行时系统提供的默认异常处理器对调试很有用，但你通常可能自己自己处理异常。这样做有两个好处。首先，它允许你处理错误。其次，它防止程序自动终止。如果你的程序每当发生错误时停止并打印堆栈跟踪，大多数用户会感到困惑（至少是这样说的）！幸运的是，防止这一点非常容易。为了防止和处理运行时错误，只需将你想要监控的代码封装在\
  \ `try` 块中。在紧随 `try` 块之后，包含一个 `catch` 子句，指定你想要捕获的异常类型。为了说明这可以多么容易完成，以下程序包含一个 `try`\
  \ 块和一个处理除以零错误的 `catch` 子句：\n\n```java\nclass Exc2 {\n    public static void main(String\
  \ args[]) {\n        int d, a;\n        try {\n            // 监控一个代码块。\n       \
  \     d = 0;\n            a = 42 / d;\n            System.out.println(\"This will\
  \ not be printed.\");\n        } catch (ArithmeticException e) {\n            //\
  \ 捕获除以零错误\n            System.out.println(\"Division by zero.\");\n        }\n \
  \       System.out.println(\"After catch statement.\");\n    }\n}\n```\n\n此程序产生以下输出：\n\
  ```\nDivision by zero.\nAfter catch statement.\n```\n\n注意，`try` 块内部的 `println()`\
  \ 调用从未被执行。一旦抛出异常，程序控制就会移出 `try` 块进入 `catch` 块。换句话说，`catch` 不是被“调用”的，所以执行永远不会从 `catch`\
  \ “返回”到 `try` 块。因此，“This will not be printed.”这一行没有显示。一旦 `catch` 语句执行完毕，程序将从整个 try/catch\
  \ 机制之后的行继续。`try` 及其 `catch` 语句形成一个单元。`catch` 子句的作用范围限于紧邻的 `try` 语句所指定的语句。`catch`\
  \ 语句不能捕获由另一个 `try` 语句抛出的异常。\n\n\n\n\n\n| Exception | 描述 |\n| :--- | :--- |\n| `ArrayIndexOutOfBoundsException`\
  \ | 数组索引越界 |\n| `ArrayStoreException` | 在数组中存储了错误类型的数据 |\n| `FileNotFoundException`\
  \ | 访问不存在的文件 |\n| `IOException` | 无法从文件读取 |\n| `NullPointerException` | 由空对象引起 |\n\
  | `NumberFormatException` | 字符串与数字之间的转换失败 |\n| `OutOfMemoryException` | 没有足够的内存分配新对象\
  \ |\n| `SecurityException` | Applet 尝试执行浏览器安全设置不允许的操作 |\n| `StackOverflowException`\
  \ | 系统栈空间耗尽 |\n| `StringIndexOutOfBoundsException` | 程序尝试访问字符串中不存在的字符位置 |\n\n# Java\
  \ 的内置异常\n\n在标准包 `java.lang` 内部，Java 定义了几个异常类。其中几个已在前面的示例中使用过。这些异常中最通用的是标准类型 `RuntimeException`\
  \ 的子类。\n\n正如之前解释的，这些异常不需要包含在任何方法的 `throws` 列表中。在 Java 语言中，这些异常被称为**未检查异常**（unchecked\
  \ exceptions），因为编译器不会检查方法是否处理或抛出了这些异常。`java.lang` 中定义的未检查异常列在表 -1 中。表 -2 列出了 `java.lang`\
  \ 定义的、如果该方法可能产生此类异常且未自行处理，则必须包含在方法 `throws` 列表中的异常。这些被称为**检查异常**（checked exceptions）。Java\
  \ 还定义了其他与其各种类库相关的异常类型。\n\n![ss](img/00029.jpeg)\n\n## 异常处理的一般形式\n\n![](img/00030.jpeg)\n\
  （异常处理机制）\n\n### 语法：\n\n```\ntry\n{\n    statement; // 产生异常\n}\ncatch (Exception-type\
  \ e)\n{\n    statement; // 处理异常\n}\n```\n\n## 多 catch 子句\n\n在某些情况下，一段代码可能会抛出多个异常。为了处理这种情况，你可以指定两个或多个\
  \ catch 子句，每个子句捕获不同类型的异常。\n\n当抛出异常时，会按顺序检查每个 catch 语句，并执行第一个与异常类型匹配的 catch 语句。在一个\
  \ catch 语句执行后，其他语句将被跳过，执行将从 `try / catch` 块之后继续。下面的示例捕获了两种不同的异常类型：\n\n```java\n\
  // 多个 catch 语句。\nclass MultipleCatches {\n    public static void main(String args[])\
  \ {\n        try {\n            int a = args.length;\n            System.out.println(\"\
  a = \" + a);\n            int b = 42 / a;\n            int c[ ] = { 1 };\n     \
  \       c[42] = 99;\n        } catch(ArithmeticException e) {\n            System.out.println(\"\
  Divide by 0: \" + e);\n        } catch(ArrayIndexOutOfBoundsException e) {\n   \
  \         System.out.println(\"Array index oob: \" + e);\n        }\n        System.out.println(\"\
  After try/catch blocks.\");\n    }\n}\n```\n\n如果启动此程序时没有命令行参数，则该程序会导致除以零异常，因为 `a`\
  \ 将等于 0。如果你提供了命令行参数并将 `a` 设置为大于 0 的值，则它将跳过除法操作。但它会导致 `ArrayIndexOutOfBoundsException`，因为\
  \ `int` 数组 `c` 的长度为 1，但程序尝试为 `c[42]` 赋值。\n\n以下是两种两种运行方式生成的输出：\n```\nC:\\java MultipleCatches\n\
  a = 0\nDivide by 0: java.lang.ArithmeticException: / zero\nAfter try/catch blocks.\n\
  C:\\java MultipleCatches Arg\na = 1\nArray index oob: java.lang.ArrayIndexOutOfBoundsException:42\n\
  After try/catch blocks.\n```\n\n当使用使用多个 catch 语句时，必须记住**异常的子类必须在它们的任何父类之前**。这是因为使用父类的\
  \ catch 语句会捕获该类型的异常及其任何子类异常。因此，如果子类排在父类之后，则永远无法到达它。此外，在 Java 中，不可达的代码是一个错误。例如，考虑以下程序：此程序包含一个错误。在系列\
  \ catch 语句中，子类必须在它的父类之前。否则，将创建不可达的代码并导致编译时错误。\n\n```java\nclass SuperCatch {\n \
  \   public static void main(String args[]) {\n        try {\n            int a =\
  \ 0;\n            int b = 2 / a;\n        } catch(Exception e) {\n            System.out.println(\"\
  Generic catch.\");\n        } catch(ArithmeticException e) { // 不可用 – ArithmeticException\
  \ 是 Exception 的子类\n            System.out.println(\"This is never reached.\");\n\
  \        }\n    }\n}\n```\n\n如果你尝试编译此程序，将收到一个错误，说明第二个 catch 语句是不可达的，因为异常已经被捕获。由于\
  \ `ArithmeticException` 是 `Exception` 的子类，第一个 catch 语句将处理所有基于 `Exception` 的错误，包括\
  \ `ArithmeticException`。这意味着第二个 catch 语句将永远不会执行。要解决这个问题，请反转 catch 语句的顺序。\n\n## 嵌套\
  \ try 语句\n\n`try` 语句可以嵌套。也就是说，`try` 语句可以位于另一个 `try` 内部。每当进入 `try` 语句时，该异常的上下文就会推入栈中。如果内部\
  \ `try` 语句没有针对特定异常的 catch 处理器，栈将展开并检查下一个 `try` 语句的 catch 处理器是否匹配。这会一直持续，直到某个 catch\
  \ 语句成功，或者耗尽所有的嵌套 `try` 语句。如果没有 catch 语句匹配，则运行时系统将处理该异常。这里有一个使用嵌套 try 语句的示例：当存在多个\
  \ catch 语句时，被称为被称为多 catch 语句。\n\n```\ntry {\n    statement; // 产生异常\n} catch(Exception-type-1\
  \ e) {\n    statement 1; // 处理异常 type1\n} catch(Exception-type-2 e) {\n    statement\
  \ 2; // 处理异常 type2\n}\n catch(Exception-type-n e) {\n    statement n; // 处理异常 n\n\
  }\n```\n\n### 多 catch 语句\n\n```java\nclass ErrorTest4 {\n    public static void\
  \ main(String args[]) {\n        try {\n            int a = 10, b = 2, c = 2;\n\
  \            System.out.println(\"Before Exception \");\n            d = a / (b\
  \ - c);\n            System.out.println(\"After Exception \");\n        }\n    }\n\
  }\n```\n\n输出：\n![](img/00031.jpeg)\n\n在这里我们没有捕获异常，因此程序将在显示消息“Before Exception”后终止。现在我们已经使用异常处理解决了这个问题。\n\
  \n### 示例 11.5\n\n```java\nclass ErrorTest5 {\n    public static void main(String\
  \ args[]) {\n\n    }\n}\n```\n\n\n\n\n\n```java\nint a=10,b=2,c=2,d;\ntry {\n  \
  \  System.out.println(\"Before Exception\");\n    d=a/(b-c);\n    System.out.println(\"\
  This Will Not Print\");\n} catch(ArithmeticException e) {\n    System.out.println(\"\
  After Exception\");\n    System.out.println(\"error : Division by zero\");\n   \
  \ System.out.println(e.getMessage());\n    System.out.println(e); //toString() is\
  \ called.\n    e.printStackTrace();\n}\n```\n\nOutput:\n![](img/0032.jpeg)\n\n###\
  \ 异常处理的优势\n\n- 我们可以很容易地指定异常/错误将在哪里处理。`Exception` / `Errors` 在运行时沿调用栈向上传播——首先向上到封装的\
  \ `try` 块，然后返回到调用方法——直到异常处理器捕获它们为止。\n- 异常/错误的位置是精确确定的，因为用户可以获取完整的堆栈轨迹。这对于调试非常有帮助。\n\
  - 程序员获得了从错误/异常状态中恢复的机会。\n- 错误处理代码与正常程序流分离，以提高可读性和可维护性。\n- 在 Java 中，不需要测试是否发生了异常/错误情况。添加更多的错误/异常处理器只需添加更多的\
  \ `catch` 子句，但不需要触动原始程序流。\n\n### 异常类的层级结构\n\n所有 `Exception` / `Error` 类的根类是 `throwable`\
  \ 类，它是 `object` 类的直接子类。`Exceptions`/`Errors` 在 Java 中也是对象。`Exception` 的子类带有 `Exception`\
  \ 后缀。`throwable` 类有两个直接子类。\n\n- **Error**：`Error` 类的子类基本上用于信号异常的系统状态，例如：\n    1.\
  \ `OutOfMemoryError` 表示 Java 虚拟机内存耗尽，且垃圾回收器无法回收任何空内存。\n    2. `StackOverflowError`\
  \ 表示解释器中发生栈溢出。\n    这些错误通常是不可恢复的，不应该被处理。\n- **Exception**：`Exception` 类的子类通常是可恢复的。例如，`EOFException`\
  \ 表示我们打开的文件没有更多数据可读取。`FileNotFoundException` 表示我们想要打开的文件在文件系统中不存在。\n\n层级结构示例：\n\
  ![](img/0033.jpeg)\n\n异常分为两种类型\n\n- **检查异常 (Checked Exception)**：如果必须捕获某个异常，则它被称为检查异常。如果在\
  \ `try` 块中可能发生检查异常且未被处理，则程序将无法编译。编译器确保如果一个方法可以直接或间接地抛出检查异常，那么该方法必须显式地处理它。该方法要么捕获异常并采取适当行动，要么将异常传递给其调用者。`Exception`\
  \ 及其所有子类（运行时异常除外）都是检查异常且必须被捕获。\n- **未检查异常 (Unchecked Exception)**：不必捕获异常，则称为未检查异常。即使未处理未检查异常，程序也可以编译。如果程序中发生了任何未处理的未检查异常，程序将在该点终止。但如果异常被处理了，程序就不会因为异常而终止。`Error`\
  \ 及其所有子类都是未检查异常，不需要被捕获。所有用户定义的 `Exception` 都是检查异常。\n\n`Exception` 类中的可用方法：\n- `getMessage()`：获取与异常相关的错误消息。\n\
  - `printStackTrace()`：打印显示异常/错误发生位置堆栈轨迹。\n- `toString()`：显示异常/错误名称以及由 `getMessage()`\
  \ 返回的消息。\n\n示例 16\n```java\nclass ErrorTest6 {\n    public static void main(String[]\
  \ arr) {\n        try {\n            int a=10,b=2,c=2,d;\n            System.out.println(\"\
  Before Exception\");\n            d=a/(b-c);\n            System.out.println(\"\
  This Will Not Print\");\n        } catch(ArithmeticException e) {\n            System.out.println(\"\
  After Exception\");\n            System.out.println(\"error : Division by zero\"\
  );\n            System.out.println(e.getMessage());\n            System.out.println(e);\
  \ //toString() is called.\n            e.printStackTrace();\n        }\n    }\n\
  }\n```\nOutput:\n```\nBefore Exception\nAfter Exception\nerror : Division by zero\n\
  / by Zero\njava.lang.ArithmeticException: / by zero\njava.lang.ArithmeticException:\
  \ / by zero\nat ErrorTest6.main(ErrorTest6.java:10)\n```\n\n示例 11.7 多重 catch\n```java\n\
  class ErrorTest7 {\n    public static void main(String args[ ]) {\n        try {\n\
  \            int a=args.length;\n            System.out.println(\"Before Exception\"\
  );\n            b=58/a;\n            int c[] = {};\n            c[47]=100;\n   \
  \         System.out.println(\"After Exception\");\n        } catch(ArithmeticException\
  \ e) {\n            System.out.println(\"error : Division by zero\");\n        }\
  \ catch(ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"Array\
  \ oob :\"+e);\n        }\n        System.out.println(\"After try/catch block\");\n\
  \    }\n}\n```\nOutput 1: 当我们运行上述程序 `java ErrorTest7` 时：\n```\nBefore Exception\n\
  Array oob :java.lang.ArrayIndexOutOfBoundsException: 47\nAfter try/catch block\n\
  ```\nOutput2: 当我们运行上述程序 `java ErrorTest7 45` 时\n```\nBefore Exception\nArray oob\
  \ :java.lang.ArrayIndexOutOfBoundsException: 47\nAfter try/catch block\n```\n\n\n\
  \n\n\n## 嵌套 try catch\n\n如果我们在另一个 `try` 块中使用 `try` 和 `catch` 语句，则被称为嵌套 try catch。\n\
  \n 语法\n\n```java\ntry //outer try\n{\n    try //inner try\n    {\n        statement\
  \ ;\n    }\n    catch1() //inner catch\n    {\n        statement ;\n    }\n    catch2()\
  \ //inner catch\n    {\n        statement ;\n    }\n}\ncatch() //outer catch\n{\n\
  \    statement ;\n}\n```\n\n### 示例 11.8 嵌套的 try 和 catch-Nested try and catch-\n\n\
  ```java\nclass Nested {\n    public static void main(String args[]) {\n        try\
  \ {\n            int a=args.length;\n            int b=58/a;\n            System.out.println(\"\
  a=\"+a);\n            try {\n                if(a==1) {\n                    a=a/(a-a);\n\
  \                }\n                if(a==2) {\n                    int c[]={1};\n\
  \                    c[42]=100;\n                }\n            } catch(ArrayIndexException\
  \ e) {\n                System.out.println(\"ArrayIndex oob \"+e);\n           \
  \ }\n        } catch(ArithmeticException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n\n**输出 I:**\n当我们以 `java ErrorTest8` 运行上述程序时 / 除以零\n\n\
  **输出 II:**\n当我们以 `java ErrorTest8 10` 运行上述程序时\n`a=1 / by zero`\n\n**输出 III:**\n\
  当我们以 `java ErrorTest8 10 20` 运行上述程序时 `a=2`\n`ArrayIndex oob java.lang.ArrayIndexOutOfBoundsException:\
  \ 42`\n\n# finally \n\nJava 支持另一种名为 `finally` 的语句，它可以用于处理未被任何之前的 `catch` 语句捕获的异常。`finally`\
  \ 块可以用于处理 `try` 块中生成的任何异常。无论是否发生错误，它都会执行。它可以紧跟在 `try` 块之后，也可以紧跟在最后一个 `catch` 块之后，如下所示：\n\
  \n### 语法：\n\n```java\ntry\n{\n    // ...\n}\ncatch(...)\n{\n    // ...\n}\ncatch(...)\n\
  {\n    // ...\n}\nfinally\n{\n    // always execute\n}\n```\n\n### 示例 1. finally\
  \ 语句\n\n```java\nclass ErrorTest9 {\n    public static void main(String args[])\
  \ {\n        int a[] = {5,10};\n        int b=5;\n        try {\n            int\
  \ x=a[2]/b-a[1];\n        } catch(ArithmeticException e) {\n            System.out.println(\"\
  Division Zero\");\n        } catch(ArrayIndexOutOfBoundsException e) {\n       \
  \     System.out.println(\"Array error\");\n        } catch(ArrayStoreException\
  \ e) {\n            System.out.println(\"Wrong Data Type\");\n        } finally\
  \ //always execute\n        {\n            System.out.println(\"Always Execute\"\
  );\n        }\n        int y=a[1]/a[0];\n        System.out.println(\"y = \"+y);\n\
  \    }\n}\n```\n\n**输出：**\n`Array error`\n`Always Execute`\n`y = 2`\n\n# throw\n\
  \n为止到目前，我们只捕获由运行时抛出的异常。然而，我们的程序可能会使用 `throw` 语句显式地抛出异常，`throw` 的通用形式所示：\n\n```java\n\
  throw instance;\n```\n\n在这里，`instance` 必须是 `Throwable` 类型的对象或其子类。简单类型如 `int` 或 `char`，以及非\
  \ `Throwable` 类（如 `String` 和 `Object`）不能作为异常。我们有两种方式可以获取 `Throwable` 对象：使用 `catch`\
  \ 子句中的参数，或者使用 `new` 运算符创建一个。执行流在 `throw` 语句后立即停止；任何后续语句都不会被执行。将检查最近的嵌套 `try` 块，查看其是否有与异常类型匹配的\
  \ `catch` 语句。如果匹配，控制权将转移到该语句。如果没有，则检查下一个嵌套的 `try` 语句，以此此类推。如果没有找到匹配的 `catch`，则默认异常处理器将停止程序并打印堆栈跟踪。\n\
  \n 我们选取了一个创建并抛出异常的程序。捕获异常的处理器将其重新抛出给外部处理器。\n\n## 示例 1.10\n\n```java\nclass ErrorTest10\
  \ {\n    int age;\n    void setAge(int a) {\n        if(a>0)\n            age =\
  \ a;\n        else\n            throw new NullPointerException(\"Invalid Age\");\n\
  \    }\n    public static void main(String args[]) {\n        ErrorTest10 a1 = new\
  \ Error10();\n        try {\n            a1.setAge(20);\n            a1.setAge(-10);\n\
  \        } catch(NullPointerException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n# throws\n\n如果一个方法可能会抛出一个它未处理的异常，则它必须指定这种行为，以便该方法的调用者能够针对该异常进行防护。我们通过在方法的声明中包含\
  \ `throws` 子句来实现这一点。`throws` 子句列出了方法可能抛出的异常类型。\n\n这对于所有检查异常（checked exceptions）都是必要的。方法可以抛出的所有异常都必须在\
  \ `throws` 子句中声明。如果没有声明，将会导致编译错误。以下是包含 `throws` 子句的方法声明通用形式：\n\n### 语法\n```java\n\
  type method-name(parameter list)throws exception-list\n{\n    //方法体\n}\n```\n\n\
  在这里，`exception list` 是方法可以抛出的异常的逗号分隔的列表。\n\n### 示例 11.11\n```java\nimport java.io.*;\n\
  \nclass ErrorTest11 {\n    int age;\n    void setAge(int a) throws IOException {\n\
  \        if(a>0)\n            age = a;\n        else {\n            IOException\
  \ e = new IOException(\"Invalid Age\");\n            throw e;\n        }\n    }\n\
  \    public static void main(String args[]) {\n        ErrorTest11 a1 = new ErrorTest11();\n\
  \        try {\n            a1.setAge(20);\n            a1.setAge(-10);\n      \
  \  } catch(IOException e) {\n            System.out.println(e.getMessage());\n \
  \       }\n    }\n}\n```\n**输出：**\n```\nInvalid Age\n```\n\n### 创建自定义异常子类\n这非常简单，只需定义\
  \ `Exception` 的子类即可。我们的子类不需要实现任何内容。`Exception` 类没有定义任何自己的方法。当然，它继承了由 `Throwable`\
  \ 提供的方法。\n\nJava 的内置异常处理了大多数错误，你可能希望创建自己的异常类型来处理特定于应用程序的情况。这非常简单：只需定义 `Exception`\
  \ 的子类（当然，它是 `Throwable` 的子类）。你在类型系统中的存在允许你将它们作为异常使用。\n\n`Exception` 类没有定义任何自己的方法。当然，它通过\
  \ `Throwable` 继承了这些方法。因此，所有异常（包括你创建的异常）都可以使用 `Throwable` 定义的方法。\n\n`Exception` 定义了四个构造函数。其中两个支持链式异常，将在下一节描述。另外两个显示在这里：\n\
  `Exception()`\n`Exception(String msg)`\n\n第一种形式创建一个没有描述的异常。第二种形式允许你指定异常的描述。\n\n\
  虽然在创建异常时指定描述通常很有用，但有时重写 `toString()` 可能会更好。原因如下：由 `Throwable` 定义（并 `Exception` 继承）的\
  \ `toString()` 版本显示异常名称，后跟一个冒号，然后是你的描述。通过重写 `toString()`，你可以防止异常名称和冒号的显示。这使得输出更加整洁，在某些情况下是理想的。\n\
  \n### 示例 11.12\n```java\nclass AgeException extends Exception {\n    AgeException(String\
  \ msg) {\n        super(msg);\n    }\n}\n\nclass ErrorTest12 {\n    int age;\n \
  \   void setAge(int a) throws AgeException {\n        if(a>0)\n            age =\
  \ a;\n        else {\n            AgeException e = new AgeException(\"Invalid Age\"\
  );\n            throw e;\n        }\n    }\n    public static void main(String args[])\
  \ {\n        ErrorTest12 a1 = new ErrorTest12();\n        try {\n            a1.setAge(20);\n\
  \            a1.setAge(-10);\n        } catch(AgeException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n**输出：**\n```\nInvalid Age\n```\n\n下面的示例声明了一个新的 `Exception`\
  \ 子类，然后使用该子类在方法中指示错误条件。它重写了 `toString()` 方法，允许显示经过精心定制的异常描述。\n\n![sss](img/0034.jpeg)\n\
  \n此示例定义了一个名为 `MyException` 的 `Exception` 子类。该子类非常简单：它只有一个构造函数加上重写的 `toString()`\
  \ 方法，用于显示异常的值。\n\n`ExceptionDemo` 类定义了一个名为 `compute()` 方法，该方法抛出一个 `MyException`\
  \ 对象。当 `compute()` 的整数参数大于 10 时，会抛出该异常。`main()` 方法为 `MyException` 设置了异常处理器，然后用合法值（小于\
  \ 10）和非法值调用 `compute()`，以展示代码的两种路径。\n\n以下是结果：\n```\nCalled compute(1)\nNormal exit\n\
  Called compute(20)\nCaught MyException[20]\n```\n\n### 链式异常\n链式异常功能允许我们将另一个异常与异常相关联。第二个异常描述了第一个异常产生。例如，想象一种情况，方法因为尝试除以零而抛出\
  \ `ArithmeticException`。然而，问题的实际原因是发生了 I/O 错误，导致除数被设置不当。\n\n虽然该方法必须抛出 `ArithmeticException`（因为这是发生的错误），但我们可能还想让调用代码知道底层原因是\
  \ I/O 错误。\n\n为了允许链式异常，Java 2 1.4 版本向 `Throwable` 类添加了两个构造函数和两个方法。\n\n\n\n\n\n# Throwable\
  \ 构造函数\n\n```java\nThrowable(Throwable causeExc)\nThrowable(String msg, Throwable\
  \ causeExc)\n```\n\n在第一种形式中，`causeExc` 是发生的异常。第二种形式允许我们在指定原因异常的同时指定一个描述。这两个构造函数也被添加到了\
  \ `Error`、`Exception` 和 `RuntimeException` 类中。\n\n添加到 `Throwable` 类中的链式异常方法是 `getCause()`\
  \ 和 `initCause()`。\n\n```java\nThrowable getCause()\nThrowable initCause(Throwable\
  \ causeExc)\n```\n\n`getCause()` 方法返回当前异常的底层异常。如果没有底层异常，则返回 `null`。`initCause()`\
  \ 方法将 `causeExc` 与调用的异常关联，并返回该异常的引用。因此，我们可以在异常创建后为其关联一个原因。然而，原因异常只能设置一次。\n\n因此，每个每个异常对象我们只能调用一次\
  \ `initCause()`。此外，如果原因异常是通过构造函数设置的，那么我们不能再使用 `initCause()` 方法再次设置它。通常情况下，`initCause()`\
  \ 用于为那些不支持上述两个额外构造函数的遗留异常类设置原因。Java 大多数内置异常都没有定义这些额外的构造函数。因此，如果我们需要为这些异常添加异常链，将使用\
  \ `initCause()`。\n\n链式异常并不是每个程序都需要的。然而，在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\n### 示例 11.13\n\
  \n1. 类 `ErrorTest13`\n2. \n```java\nclass ErrorTest13 {\n    int age;\n    void\
  \ setAge(int a) {\n        if(a>0)\n            age = a;\n        else {\n     \
  \       NullPointerException e = new NullPointerException(\"Admission Failed\");\n\
  \            e.initCause(new ArithmeticException(\"Age is invalid\"));\n       \
  \     throw e;\n        }\n    }\n    public static void main(String args[]) {\n\
  \        ErrorTest13 a1 = new ErrorTest13();\n        try {\n            a1.setAge(20);\n\
  \            a1.setAge(-10);\n        } catch(NullPointerException e) {\n      \
  \      System.out.println(e.getMessage());\n            System.out.println(e.getCause());\n\
  \        }\n    }\n}\n```\n**输出:**\n```\nAdmission Failed\nAge is Invalid\n```\n\
  ![images/0035.jpeg\n\n在这个示例中，顶层异常是 `NullPointerException`。它被添加了一个原因异常 `ArithmeticException`。当异常从\
  \ `setAge()` 抛出时，它被 `main()` 捕获。在那里，显示顶层异常，随后是通过调用 `getCause()` 获取的底层异常。链式异常可以延伸。因此，原因异常自身也可以有原因。请注意，过长的异常链可能表明设计不良。链式异常并不是每个程序都需要的。然而，在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\
  \n## 三个新的 JDK 7 异常特性（更新）\n\nJDK 7 为异常系统增加了三个有趣且实用的功能。第一个功能自动化了资源（如文件）在不再需要时的释放过程。它基于\
  \ `try` 语句的扩展形式，称为 `try-with-resources`，将在后续介绍文件的章节中进行描述。\n\n第二个新功能称为 `multi-catch`（多异常捕获），第三个有时被称为最终重抛或更精确的重抛。这两个特性将在这里描述。\n\
  \n`multi-catch` 特性允许两个或多个异常被同一个 catch 语句捕获。两个或多个异常处理程序使用相同的代码序列并不罕见，尽管它们响应的是不同的异常。与其逐个捕获每个异常类型，现在你可以使用单个\
  \ catch 语句来处理所有异常，而无需代码重复。\n\n要使用 `multi-catch`，请在 catch 语句中使用逻辑或运算符（|）分隔每个异常类型。每个多异常\
  \ catch 参数都是隐式 `final` 的（如果需要，你可以显式指定 `final`，但没有必要）。因为每个多异常 catch 参数都是隐式 `final`，所以它不能被赋新值。\n\
  \n以下是一个使用 `multi-catch` 特性同时捕获 `ArithmeticException` 和 `ArrayIndexOutOfBoundsException`\
  \ 的 catch 语句：\n```java\ncatch(ArithmeticException | ArrayIndexOutOfBoundsException\
  \ e) {\n```\n\n以下程序展示了 `multi-catch` 特性的用法：\n```java\n// 展示 JDK 7 的 multi-catch\
  \ 特性。\nclass MultiCatch {\n    public static void main(String args[]) {\n      \
  \  int a=10, b=0;\n        int vals[] = { 1, 2, 3 };\n        try {\n          \
  \  int result = a / b; // 生成一个 ArithmeticException\n            // vals[10] = 19;\
  \ // 生成一个 ArrayIndexOutOfBoundsException\n            // 这个 catch 语句捕获这两个异常。\n \
  \       } catch(ArithmeticException | ArrayIndexOutOfBoundsException e) {\n    \
  \        System.out.println(\"Exception caught: \" + e);\n        }\n        System.out.println(\"\
  After multi-catch.\");\n    }\n}\n```\n当尝试除以零时，程序将生成一个 `ArithmeticException`。如果你注释掉除法语句并移除下一行的注释符号，则会生成\
  \ `ArrayIndexOutOfBoundsException`。这两个异常都会被同一个 catch 语句捕获。\n\n更精确的重抛特性限制了可以重抛的异常类型，仅限于关联的\
  \ `try` 块抛出的受检异常、未被之前的 catch 语句处理的、且是参数子类或超类的异常。\n\n虽然这种能力并不经常需要，但现在已经可以使用了。为了使更精确的重抛特性生效，catch\
  \ 参数必须是有效的 final（effectively final，即它不能被赋新值）或显式的 final。\n\n## 使用异常\n\n异常处理为控制具有许多动态特性的复杂程序提供了一种强大的机制。将\
  \ `try`、`throw` 和 `catch` 视为处理程序逻辑中错误和异常边界条件的整洁方式是非常重要的。与其他语言使用错误返回码来指示失败不同，Java\
  \ 使用异常。因此，当一个方法可能失败时，让它抛出一个异常。\n\n最后一点：Java 的异常处理语句不应被视为非局部跳转的通用机制。如果你这样做，只会让你的代码变得混乱且难以维护。\n\
  \n 理论问题\n\n1. 什么是异常？\n2. 我们如何定义 `try` 块？\n3. 我们如何定义 `catch` 块？\n\n\n\n\n\n## 异常处理问题\n\
  \n4. 列出 Java 中可能发生的一些常见异常类型。给出示例。\n5. 捕获所有类型的异常是必要的吗？\n6. 一个 `try` 块可以使用多少个 `catch`\
  \ 块。\n7. 创建可能会产生三种异常的 `try` 块，并结合必要的 `catch` 块来适当捕获并处理这些异常。\n8. 什么是 `finally` 块？它在何时以及如何使用？给出一个合适的示例。\n\
  9. 解释如何利用异常处理机制来调试程序。\n\n![11](img/00005.jpeg)\n\n## 多线程编程\n\n## 简介\n线程是程序中的单个控制流。线程与进程非常相似。事实上，线程也被称为轻量级进程。\n\
  \n### 线程对比 进程\n通常，不同的进程占用不同的内存空间。当 CPU 从一个进程切换到另一个进程时，当前运行进程的状态会被保存，另一个进程的状态会被恢复。在状态切换期间，没有进行任何有用工作。状态切换时间应该尽可能短，以最大化\
  \ CPU 的利用率。\n\n线程也像独立的进程一样，但它们共享相同的内存和状态。各个线程也有其独立的状态，但与进程状态相比，线程状态非常小。状态可能只包含程序计数器和栈指针。因此，从一个线程切换到另一个线程所需的时间非常短。与进程相比，线程的上下文切换时间非常短。因此，在多线程的情况下，CPU\
  \ 的利用率高于多进程的情况下。\n\n### 多线程程序\n多线程程序包含两个或多个可以并发运行的部分。此类程序的每个部分被称为线程，每个线程定义了一个独立的执行路径。因此，多线程是多任务处理的一种特殊形式。\n\
  \n例如，一个程序可能有三个线程：\n* 一个负责打印。\n* 一个负责编辑。\n* 一个负责从互联网下载文件。\n\n所有这些线程都可能并发运行，从而最大化了\
  \ CPU 的利用率。\n\n### 基于进程的多任务\n大多数操作系统都允许我们同时运行两个或多个程序。这被称为基于进程的多任务。例如，我们可以运行一个 Java\
  \ 程序，同时编辑一个 Word 文档。基于进程的多任务确保了在大多数时间内会有程序在被执行，从而增加了 CPU 的利用率。\n\n在基于进程的多任务中，程序是调度器可以派发的最小代码单元。\n\
  \n### 基于线程的多任务\n在基于线程的多任务环境中，线程是执行的最小单元。一个进程可以被分为若干个并发执行的线程。这允许我们在单个程序中并发处理多个任务。\n\
  \n例如，我们可以编辑一个 Word 文档，同时打印另一个文档。基于线程的多任务像基于进程的多任务一样提高了 CPU 的利用率。但同时，它通过在单独线程中并发执行程序的不同部分，有效地加快了单个程序的执行速度。\n\
  \n因此，基于进程的多任务处理“大局”，而基于线程的多任务处理“细节”。\n\n### Java 线程模型\nJava 运行时系统依赖线程完成许多工作，所有的类库在设计时都考虑了多线程。事实上，Java\
  \ 使用线程使整个环境能够异步化。这有助于通过防止 CPU 周期的浪费来减少低效率。\n\n单线程系统使用一种称为“事件循环加轮询”的方法。在这种模型中，单个控制线程在无限循环中运行，轮询单个事件队列以决定下一步做什么。在单线程环境中，当线程因为等待某些资源而阻塞（即挂起执行）时，整个程序都会停止运行。\n\
  \nJava 多线程的优点是消除了主循环/轮询机制。当 Java 程序中的线程阻塞时，只有被阻塞的单个线程会暂停，所有其他线程继续运行。\n\n### 线程生命周期（线程状态）\n\
  线程存在多种状态。线程可以处于运行状态。一旦获得 CPU 时间，就可以进入就绪状态。运行中的线程可以被挂起，从而暂时停止其活动。挂起的线程随后可以恢复，使其能够从中断的地方继续执行。线程在等待资源时会处于阻塞状态。在任何时候，线程都可以被终止，从而立即停止其执行。一旦终止，线程将无法恢复。\n\
  \n### 1. 新生状态 (Newborn State)\n当我们创建一个线程对象时，线程就出生了，处于新生状态。该线程尚未被调度运行。在此状态下，我们只能对它执行以下操作之一：\n\
  1. 使用 `start()` 方法调度它运行。\n2. 使用 `stop()` 方法将其杀死。\n\n如果被成功调度，它将移动到可运行状态。如果我们尝试在此状态下使用任何其他方法，将会抛出异常。\n\
  \n#### 2. 可运行状态 (Runnable State)\n可运行状态意味着线程已准备好执行，并正在等待处理器的可用。也就是说，线程已经加入了等待执行的线程队列。如果所有线程的优先级相同，它们将以轮询的方式被分配执行的时间片。\n\
  \n放弃控制权的线程会加入队列末尾并再次等待自己的机会。然而，如果我们想让线程在轮到它之前将控制权让给另一个等优先级的线程，可以通过调用 `yield()` 方法来实现。\n\
  \n#### 3. 运行状态 (Running State)\n运行意味着处理器已经将时间分配给线程进行执行。运行中的线程可能在以下情况下放弃其控制权：\n*\
  \ 它的时间片结束。\n* 被高优先级线程抢占。\n* 它让出了控制权，即自愿放弃控制）。\n* 它完成了执行。\n* 被其他线程停止。\n* 它被 `suspend()`\
  \ 方法挂起。挂起的线程可以通过 `resume()` 方法恢复。当我们由于某些原因想要挂起线程一段时间但不想杀死它时，这种方法非常有用。\n* 它被要求等待某些事件发生。这是通过使用\
  \ `wait()` 方法完成的。线程可以使用 `notify()` 方法调度再次运行。\n* 它正在执行某些 I/O 操作。\n\n#### 4. 阻塞状态\
  \ (Blocked State)\n当线程被阻止进入就绪状态并随后进入运行状态时，该线程被称为阻塞。这发生在线程被挂起、睡眠或等待以满足某些要求时。阻塞线程被认为“不可运行”，但并未死亡，因此完全能够再次运行。\n\
  \n#### 5. 死亡状态 (Dead State)\n每个线程都有生命周期。运行中的线程在完成执行其 `run()` 方法后结束生命。它有自然死亡。然而，我们可以在任何状态向它发送停止消息来杀死它，导致其提前死亡。线程可以在一出生、运行期间甚至在处于“不可运行”（阻塞条件）时被杀死。\n\
  \n### 线程优先级\nJava 为每个线程分配一个优先级，该优先级决定了线程相对于其他线程如何被对待。线程优先级是指定一个线程相对于另一个线程相对优先级的整数。\n\
  \n\n\n\n作为一个绝对值，优先级是毫无意义的；如果只有一个线程在运行，那么高优先线程的运行速度绝不会比低优先级线程快。相反，线程的优先级被用于决定何时从一个运行中的线程切换到下一个线程。这被称为上下文切换（context\
  \ switch）。决定何时发生上下文切换的规则如下：\n\n*   线程可以自愿（自主）放弃控制权。这通过显式地让出（yield）、睡眠（sleep）、阻塞（blocking）或等待\
  \ I/O 来。在这种情况下，将检查所有其他线程，通常会将准备就绪的最高优先级线程分配给 CPU。\n*   线程可以被高优先级线程抢占。在这种情况下，不释放处理器的低优先级线程无论正在做什么，都会被高优先级线程简单地抢占。基本上，只要高优先级线程想要运行，它就会运行。这被称为抢占式多任务处理（preemptive\
  \ multitasking）。\n*   某些操作系统支持非抢占式优先级调度。在这种情况下，只有当低优先级线程完成时，高优先级线程才能获得机会。\n*   当两个优先级相同的线程竞争\
  \ CPU 周期时，情况会变得复杂一些。对于像 `windows98` 这样的操作系统，等优先级的线程必须自愿（自主）让出（放弃）控制权。如果它们不这样做，其他线程将不会运行。\n\
  \n**注意**：操作系统处理等优先级线程上下文切换的方式可能会产生问题。\n\n### 同步 (Synchronization)\n\n由于多线程为我们的程序引入了异步行为，我们必须有一种方法在需要时强制同步。例如，如果我们想让两个线程通信并共享一个复杂的数据结构（如链表），我们需要某种方法来确保它们不会相互冲突。\n\
  \n也就是说，我们必须防止一个线程在另一个线程正在读取数据时进行写入。Java 使用监视器（monitor）进行线程间同步。我们可以将监视器想象成只能容纳一个线程的小盒子。一旦线程进入监视器，监视器就可以用来保护共享资源不被多个线程同时操作。\n\
  \n大多数多线程系统将同步暴露为对象，我们的程序必须显式地获取并锁定它们。Java 提供了一个更整洁的解决方案。\n\n并没有 `monitor` 类，相反，每个对象都有自己的隐式监视器，当调用对象的\
  \ `synchronized` 方法时会自动进入该视器。一旦线程进入 `synchronized` 方法，任何其他线程都无法调用该对象上的任何其他 `synchronized`\
  \ 方法。这使我们能够编写非常清晰且简洁的多线程代码，因为同步支持是内置在语言中的。\n\n### 消息传递 (Messaging)\n\n使用大多数其他语言进行编程时，我们必须依赖操作系统建立线程之间的通信。\n\
  \n这无疑增加了开销。相比之下，Java 提供了一种整洁、低成本的方法让两个或多个线程相互通信，通过调用所有对象都拥有的定义方法。Java 的消息传递系统允许线程进入对象的\
  \ `synchronized` 方法，然后在那里等待，直到其他某些线程显式通知其退出。\n\n## Thread 类和 Runnable 接口 (The Thread\
  \ class and the Runnable interface)\n\nJava 的多线程系统构建在 `Thread` 类、其方法及其辅助接口 `Runnable`\
  \ 之上。该类属于 `java.lang` 包，因此不需要显式导入。\n\n`Thread` 封装了一个执行线程，由于我们无法直接引用运行中线程的内部状态，因此我们将通过它的代理（即产生它的\
  \ `Thread` 实例）来处理它。要创建一个新线程，我们的程序要么扩展 `Thread` 类，要么实现 `Runnable` 接口。`Thread` 类了几个帮助管理线程的方法：\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `String getName()` | 返回此线程名称 |\n| `int getPriority()`\
  \ | 返回此线程的优先级 |\n| `boolean isAlive()` | 测试此线程是否仍在运行 |\n| `void join()` | 等待此线程死亡（终止）\
  \ |\n| `void run()` | 如果此线程是用单独的 `Runnable` 对象构造的，则调用该 `Runnable` 对象的 `run` 方法；否则此方法什么都不做并返回；如果扩展了线程类并在子类中重写了\
  \ `run()` 方法，则调用被重写的 `run()` 方法。 |\n| `void setName(String name)` | 将此线程名称更改为参数名\
  \ |\n| `static void sleep(long millis) throws InterruptedException` | 使当前执行的线程睡眠指定的毫秒数（临时停止执行）。(1\
  \ sec = 1000ms) |\n| `static void sleep(long millis, int nanos) throws InterruptedException`\
  \ | 使当前执行的线程睡眠（停止执行）指定的毫秒数加上指定的纳秒数。 |\n| `void start()` | 导致此线程开始执行，Java 虚拟机调用此线程的\
  \ `run` 方法。 |\n| `static void yield()` | 使当前执行的线程对象临时暂停并允许其他线程执行。 |\n| `static Thread\
  \ currentThread()` | 返回当前执行的线程对象的引用。 |\n\n### 主线程 (The main thread)\n\n当 Java 程序启动时，一个线程会立即开始。这通常被称为我们程序的主线程（main\
  \ thread），因为它是程序启动时执行的线程。主线程是创建“子”线程的线程。虽然主线程在程序启动时自动创建，但它可以通过 `Thread` 对象进行控制。要这样做，我们必须通过调用\
  \ `currentThread()` 获取它的引用，它是 `Thread` 类的 `static` 成员。该方法返回调用它的线程的引用。一旦我们有了主方法的引用，就可以像控制任何其他线程一样控制它。\n\
  \n示例 1：以下示例演示了我们如何获取主线程的引用并使用 `Thread` 类的方法访问其属性。\n\n```java\nclass CurrentTest\
  \ {\n    public static void main(String args[]) {\n        Thread t = Thread.currentThread();\n\
  \        System.out.println(\"Current thread:\" + t);\n        System.out.println(\"\
  Name:\"+ t.getName());\n        System.out.println(\"Priority:\"+ t.getPriority());\n\
  \        t.setName(\"MyThread\");\n        t.setPriority(Thread.MAX_PRIORITY);\n\
  \        System.out.println(\"After name and priority change :\" + t);\n       \
  \ System.out.println(\"Name:\" + t.getName());\n        System.out.println(\"Priority:\"\
  \ + t.getPriority());\n        for (int n=1; n<=5; n++) {\n            System.out.println(n);\n\
  \            try {\n                Thread.sleep(1000);\n            } catch (InterruptedException\
  \ e) {\n                System.out.println(\"Main thread interrupted\");\n     \
  \       }\n        }\n    }\n}\n```\n\n\n\n\n\n# 注意 1：`Thread` 中的 `sleep()` 方法可能会抛出\
  \ `InterruptedException`，这是一个受检异常。当其他线程想要中断这个正在睡眠的线程时，就会发生这种情况。\n\n# 注意 2：注意当 `t`（线程引用）作为\
  \ `println()` 的参数时产生的输出。它将按顺序显示：线程名称、优先级以及其线程组名称。它的优先级是 5，这是默认值，而 `main` 也是该线程所属组的名称。线程组是一种用于控制线程集合整体状态的数据结构。\n\
  \n## 创建线程\n\n从最通用的意义上说，我们通过实例化 `Thread` 类型的对象来创建一个线程。Java 识别了两种实现这一目标的方法：\n\n1.\
  \ 我们可以实现 `Runnable` 接口。\n2. 我们可以扩展 `Thread` 类本身。\n\n## 实现 Runnable\n\n创建线程简单的方法是创建一个实现\
  \ `Runnable` 接口的类。要实现 `Runnable`，类只需要实现一个名为 `run()` 的方法。\n\n```java\npublic void\
  \ run() {}\n```\n\n在 `run()` 方法内部，我们将定义构成新线程的代码。`run()` 可以像主线程一样调用其他方法、使用其他类并声明变量。\n\
  \n唯一的区别是，`run()` 为程序中另一个并发执行的线程建立了入口点。该线程会在 `run()` 返回时结束。\n\n在我们创建了一个实现 `Runnable`\
  \ 的类后，我们将从该类内部使用以下构造函数之一实例化 `Thread` 类型的对象：\n\n* `Thread(Runnable threadObj)`\n\
  * `Thread(Runnable threadObj, String threadName)`\n\n这里，`threadObj` 是被调用 `run` 方法的对象，`threadName`\
  \ 是新线程的名称。在新线程创建后，在我们调用 `start()` 方法之前，它将不会开始运行。\n\n`start()` 方法将线程放入就绪队列（可运行状态）。每当线程被调度时，它的执行将从\
  \ `run()` 方法开始。\n\n### 示例 12.2\n\n```java\nclass A implements Runnable {\n    public\
  \ void run() {\n        for(int i=1;i<=5;i++) {\n            System.out.println(\"\
  Child Thread:\" + i);\n        }\n        System.out.println(\"Exiting child thread\"\
  );\n    }\n}\n\nclass RunnableTest {\n    public static void main(String args[])\
  \ {\n        A a1=new A();\n        Thread t1 = new Thread(a1, \"Demo Thread\");\n\
  \        t1.start();\n        System.out.println(\"Main thread exiting\");\n   \
  \ }\n}\n```\n\n**输出：**\nMain thread exiting\nChild Thread:1\nChild Thread:2\nChild\
  \ Thread:3\nChild Thread:4\nChild Thread:5\nExiting child thread\n\n### 示例 12.3\n\
  \n```java\nclass A implements Runnable {\n    Thread t;\n    A() {\n        t= new\
  \ Thread(this, \"Demo Thread\");\n        System.out.println(\"Child thread: \"\
  + t);\n        t.start();\n    }\n    public void run() {\n        for (int i=1;\
  \ i<=5; i++) {\n            System.out.println(\"Child Thread: \"+ i );\n      \
  \      try {\n                Thread.sleep(500);\n            } catch (InterruptedException\
  \ e) {\n                System.out.println(e);\n            }\n        }\n     \
  \   System.out.println(\"Exiting thread\");\n    }\n}\n\nclass RunnableTest2 {\n\
  \    public static void main (String args ) {\n        A a1=new A();\n        for\
  \ (int i=1; i<=5; i++) {\n            System.out.println (\"Main Thread:\"+ i);\n\
  \            try {\n                Thread.sleep (100);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(\"main thread interrupted\");\n     \
  \       }\n        }\n        System.out.println(\"End of Main thread\");\n    }\n\
  }\n```\n\n**输出：**\nChild thread: Thread[Demo Thread,5,main]\nMain Thread:1\nChild\
  \ Thread: 1\nChild Thread: 2\nMain Thread:2\nChild Thread: 3\nChild Thread: 4\n\
  Main Thread:3\nChild Thread: 5\nExiting Child thread\nMain Thread:4\nMain Thread:5\n\
  End of Main thread\n\n## 扩展 Thread 类\n\n创建线程的另一种方法是创建一个扩展 `Thread` 的新类，然后创建该类的实例。扩展类必须重写\
  \ `run()` 方法，这是新线程的入口点。它还必须调用 `start()` 来开始新线程的执行。\n\n### 示例 12.4\n\n```java\nclass\
  \ A extends Thread {\n    A() {\n        super (\"Test\");\n        System.out.println\
  \ (\"Child thread:\" + this);\n        start();\n    }\n    public void run () {\n\
  \        for (int i=1; i<=5; i++) {\n            System.out.println(\"Child Thread:\"\
  +i);\n            try {\n                Thread.sleep(500);\n            }\n   \
  \     }\n    }\n}\n```\n\n\n\n\n\n```java\nclass ThreadTest {\n    public static\
  \ void main(String args[]) {\n        new A();\n        for (int i=1; i<=5; i++)\
  \ {\n            System.out.println(\"Main Thread: \"+i);\n            try {\n \
  \               Thread.sleep(100);\n            } catch (InterruptedException e)\
  \ {\n                System.out.println(\"Main thread interrupted\");\n        \
  \    }\n        }\n        System.out.println(\"Main thread exiting\");\n    }\n\
  }\n```\n\n**输出：**\n```\nChild thread:Thread[Testing Thread,5,main]\nMain Thread:\
  \ 1\nChild Thread:1\nChild Thread:2\nMain Thread: 2\nChild Thread:3\nChild Thread:4\n\
  Main Thread: 3\nChild Thread:5\nExiting Child thread\nMain Thread: 4\nMain Thread:\
  \ 5\nMain thread exiting\n```\n\n注意：如果 `Thread` 没有被分配任何名称，它将是类似于：`Thread-1`、`Thread-2`、`Thread-3`\
  \ 等。\n\n### 选择方法\n\n`Thread` 类定义了几个可以被派生类重写的方法。在这些方法中，唯一必须重写的是 `run()`。也就是说，这与我们在实现\
  \ `Runnable` 接口时要求的方法是完全的。\n\n许多 Java 程序员认为，只有当类被某种程度地增强或修改时，才对其进行扩展。因此，如果我们不重写\
  \ `Thread` 的其他任何方法，最好的办法可能是简单地实现 `Runnable` 接口。\n\n### 创建多个线程\n\n示例 12.5\n\n```java\n\
  class A implements Runnable {\n    String name;\n    Thread t;\n    A(String threadName)\
