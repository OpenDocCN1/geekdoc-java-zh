  Note: 如果尝试在文件末尾之后读取，则会发生 `EOFException`。\n\n### `ByteArrayInputStream` `ByteArrayInputStream`\
  \ 包含一个内部缓冲区，其中包含可以从流中读取的字节。`ByteArrayInputStream` 是一个使用字节数组作为源的输入流实现。该类有两个构造函数，每个构造函数都需要一个字节数组来提供数据源。`ByteArrayInputStream`\
  \ 实现 `mark()` 和 `reset()` 方法。但是，如果没有调用 `mark()`，则 `reset()` 将流指针设置为流的起始位置。\n\n-\
  \ `public ByteArrayInputStream(byte[])`\n- `public ByteArrayInputStream(byte[],\
  \ int, int);`\n- `public synchronized int read();`\n- `public synchronized int read(byte[],\
  \ int, int);`\n- `public synchronized long skip(long);`\n- `public synchronized\
  \ int available();`\n- `public boolean markSupported();`\n- `public void mark(int);`\n\
  - `public synchronized void reset();`\n- `public void close() throws IOException;`\n\
  \n#### Example 15.7:\n```java\nimport java.io.*;\nclass ByteArrayInputStreamTest\
  \ {\n    public static void main(String args[]) throws IOException {\n        String\
  \ s1=\"abcdefghijk\";\n        byte b[]=s1.getBytes();\n        ByteArrayInputStream\
  \ b1 = new ByteArrayInputStream(b);\n        int a;\n        while((a=b1.read())=-1)\
  \ {\n            System.out.print((char)Character.toUpperCase(a));\n        }\n\
  \        b1.close();\n    }\n}\n```\nOutput: ABCDEFGHIJK\n\n### `ByteArrayOutputStream`\n\
  `ByteArrayOutputStream` 实现了一个输出流，数据被写入字节数组中。`ByteArrayOutputStream` 是一个使用字节数组作为目的地的输出流实现。缓冲区存储在\
  \ `ByteArrayOutputStream` 的受保护 `buf` 字段中。如果需要，缓冲区的大小会自动增加。缓冲区持有的字节数包含在 `ByteArrayOutputStream`\
  \ 的受保护 `count` 字段中。\n\n- `public java.io.ByteArrayOutputStream()` 创建一个新的字节数组输出流。缓冲区初始容量为\
  \ 32 字节，但如果需要其大小会增大。\n- `public java.io.ByteArrayOutputStream(int);` 创建一个新的字节数组输出流，缓冲区容量为指定的字节数。\n\
  - `public synchronized void write(int);`\n- `public synchronized void write(byte[],\
  \ int, int);`\n- `public synchronized void writeTo(java.io.OutputStream) throws\
  \ java.io.IOException;`\n- `public synchronized void reset();`\n- `public synchronized\
  \ byte[] toByteArray();`\n- `public synchronized int size();`\n- `public synchronized\
  \ java.lang.String toString();`\n- `public synchronized java.lang.String toString(java.lang.String)\
  \ throws java.io.UnsupportedEncodingException;`\n- `public synchronized java.lang.String\
  \ toString(int);`\n- `public void close() throws java.io.IOException;`\n\n#### Example\
  \ 15.8:\n```java\nimport java.io.*;\nclass ByteArrayOutputStreamTest {\n    public\
  \ static void main(String args[]) throws IOException {\n        ByteArrayOutputStream\
  \ b1 = new ByteArrayOutputStream();\n        b1.write('a');\n        String s1 =\
  \ \"abcdefghijk\";\n        byte arr1[]= s1.getBytes();\n        b1.write(arr1);\n\
  \        System.out.println(b1);  //toString()\n        // 使用 for 循环显示\n       \
  \ byte arr2 [] = b1.toByteArray();\n        for(int i=0;i<arr2.length;i++) {\n \
  \           System.out.print((char)arr2[i]);\n        }\n        System.out.println();\n\
  \        // 使用 for 循环显示\n        for(int i:arr2) {\n            System.out.print((char)i);\n\
  \        }\n        b1.close();\n    }\n}\n```\nOutput:\naabcdefghijk\naabcdefghijk\n\
  aabcdefghijk\n\n\n\n\n从指定的字符数组创建一个 `CharArrayReader`。生成的读取器将从指定的偏移量开始读取。从此读取器可以读取的字符值总数将是\
  \ `length` 或 `buf.length`。\n\n### 示例 15.9\n\n```java\nimport java.io.*;\n\nclass\
  \ CharArrayReaderTest {\n    public static void main (String args[]) throws IOException\
  \ {\n        String tmp = \"abcdefghijklmnopqrstuvwxyz\";\n        int length =\
  \ tmp.length();\n        char c[] = new char[length];\n        tmp.getChars(0,length,c,0);\n\
  \        CharArrayReader input1 = new CharArrayReader(c);\n        CharArrayReader\
  \ input2 = new CharArrayReader(c,0,5);\n        int i;\n        while((i=input1.read())\
  \ != -1) {\n            System.out.print((char)i);\n        }\n        System.out.println();\n\
  \        while((i=input2.read()) != -1) {\n            System.out.print((char)i);\n\
  \        }\n    }\n}\n```\n**输出:**\n```\nabcdefghijklmnopqrstuvwxyz\nde\n```\n\n\
  ### CharArrayWriter\n\n`CharArrayWriter` 是一个写入流的实现，它使用 `char` 数组作为目标。\n\n### 构造函数\n\
  - `CharArrayWriter()`\n- `CharArrayWriter(int initialSize)`：在第一种形式下，创建一个默认大小的缓冲区。在第二种形式下，创建一个大小由参数\
  \ `initialSize`指定的缓冲区。\n\n#### 字段\n- 缓冲区存储在 `CharArrayWriter` 的 `buf` 字段中。如果需要，缓冲区的大小将增大。\n\
  - 缓冲区中的字符数量包含在 `CharArrayWriter` 的 `count` 字段中。`buf` 和 `count` 都是 `protected` 字段。\n\
  \n#### 示例 15.10\n```java\nimport java.io.*;\n\nclass CharArrayTest {\n    public\
  \ static void main (String args[]) throws IOException {\n        CharArrayWriter\
  \ f = new CharArrayWriter();\n        String s = \"This should end up in the array\"\
  ;\n        char buf[] = new char[s.length()];\n        s.getChars(0,s.length(),buf,0);\n\
  \        f.write(buf);\n        System.out.println(f.toString());\n        char\
  \ c[] = f.toCharArray();\n        for(int i=0; i<c.length;i++) {\n            System.out.print(c[i]);\n\
  \        }\n        FileWriter f2 = new FileWriter(\"test.txt\");\n        f.writeTo(f2);\n\
  \        f2.close();\n        f.reset();\n        System.out.println();\n      \
  \  System.out.println(\"After reset:\"+f.toString());\n        for(int i=0;i<3;i++)\
  \ {\n            f.write('A');\n            System.out.println(f.toString());\n\
  \        }\n    }\n}\n```\n**输出:**\n```\nThis should end up in the array\nThis should\
  \ end up in the array\nAfter reset:AAA\n```\n\n### PushbackInputStream\n\n`PushbackInputStream`\
  \ 为另一个输入流增加了功能，即“推回”（pushback）或“重读”一个字节的能力。缓冲的用途之一就是实现推回。\n\n推回用于输入流，允许读取一个字节后将其返回流中。除了\
  \ `InputStream` 类熟悉的方法外，`PushbackInputStream` 提供了 `unread()` 方法，在此所示：\n\n| `public\
  \ java.io.PushbackInputStream(java.io.InputStream, int)` | 创建一个具有指定大小推回缓冲区的 `PushbackInputStream`，并保存其参数输入流以备后用。这允许多个字节返回到输入流。\
  \ |\n| `public java.io.PushbackInputStream(java.io.InputStream)` | 创建一个 `PushbackInputStream`\
  \ 并保存其参数输入流以备后用。这允许一个字节返回到输入流。 |\n| `public int read() throws java.io.IOException`\
  \ | |\n| `public int read(byte[], int) throws java.io.IOException` | |\n| `public\
  \ void unread(int) throws java.io.IOException` | 通过将字节复制到推回缓冲区的开头来推回一个字节 | |\n|\
  \ `public void unread(byte[], int) throws java.io.IOException` | 通过将字节数组的一部分复制到推回缓冲区的开头来推回部分字节。\
  \ |\n| `public void unread(byte[]) throws java.io.IOException` | 通过将字节数组复制到推回缓冲区的开头来推回整个字节数组。\
  \ | |\n| `public int available() throws java.io.IOException` | |\n| `public long\
  \ skip(long) throws java.io.IOException` | |\n| `public boolean markSupported()`\
  \ | `PushbackInputStream` 的副作用是使创建它的 `InputStream` 的 `mark()` 或 `reset()` 方法失效。使用\
  \ `markSupported()` 检查你任何要使用 `mark()`/`reset()` 的流。 | |\n| `public synchronized\
  \ void mark(int)` | |\n| `public synchronized void reset() throws java.io.IOException`\
  \ | |\n| `public synchronized void close() throws java.io.IOException` | |\n\n####\
  \ 示例 15.1\n```java\nimport java.io.*;\n\nclass PushbackTest {\n    public static\
  \ void main(String args[]) throws IOException {\n        FileInputStream fin = new\
  \ FileInputStream(\"A.txt\");\n        PushbackInputStream p1=new PushbackInputStream(fin);\n\
  \        int ch=p1.read();\n        System.out.println((char)ch);\n        ch=p1.read();\n\
  \        System.out.println((char)ch);\n        ch=p1.read();\n        System.out.println((char)ch);\n\
  \        p1.unread(ch); // or p1.unread('z');\n        ch=p1.read();\n        System.out.println((char)ch);\n\
  \    }\n}\n```\n**输出:**\n`A.txt` 包含 “Matrix Computers”\n```\nm\na\nt\nt\n```\n\n\
  \n\n\n\n| `public int read(char[], int, int) throws java.io.IOException;` |\n| `public\
  \ void unread(int) throws java.io.IOException;` 回退单个字符。 |\n| `public void unread(char[],\
  \ int, int) throws java.io.IOException;` 将字符数组的一部分复制到回退缓冲区的开头，从而回退该部分。 |\n| `public\
  \ void unread(char[]) throws java.io.IOException;` 将数组复制到回退缓冲区的开头，从而回退该数组。 |\n|\
  \ `public boolean ready() throws java.io.IOException;` |\n| `public void mark(int)\
  \ throws java.io.IOException;` |\n| `public void reset() throws java.io.IOException;`\
  \ |\n| `public boolean markSupported();` |\n| `public void close() throws java.io.IOException;`\
  \ |\n| `public long skip(long) throws java.io.IOException;` |\n\n**注意**：当回退缓冲区满时如果尝试返回字符，将抛出\
  \ `IOException`。\n\n### 示例 15.12\n\n```java\nimport java.io.*;\nclass PushbackReaderTest\
  \ {\n    public static void main(String args[]) throws IOException {\n        FileReader\
  \ fr = new FileReader(\"A.txt\");\n        PushbackReader pr=new PushbackReader(fr);\n\
  \        int ch=pr.read();\n        System.out.println((char)ch);\n        ch=pr.read();\n\
  \        System.out.println((char)ch);\n        ch=pr.read();\n        System.out.println((char)ch);\n\
  \        pr.unread(ch);\n        ch=pr.read();\n        System.out.println((char)ch);\n\
  \    }\n}\n```\n**输出：**\n```\nm\na\nt\nt\n```\n\n### SequenceInputStream\n\n`SequenceInputStream`\
  \ 类是一个字节流，允许你连接多个 `InputStream`。`SequenceInputStream` 的构造方式与其他任何 `InputStream` 都不同。`SequenceInputStream`\
  \ 构造函数使用一对 `InputStream` 类或 `InputStream` 类的 `Enumeration` 作为其参数：\n\n- `SequenceInputStream(InputStream\
  \ is1, InputStream is2)` 通过记住两个参数来初始化新创建的 `SequenceInputStream`，这两个参数将按顺序（`is1`\
  \ 然后是 `is2`）读取，以提供从该 `SequenceInputStream` 读取的字节。\n- `SequenceInputStream(Enumeration\
  \ e)` 通过记住参数初始化新创建的 `SequenceInputStream`，该参数必须是一个产生运行时类型为 `InputStream` 对象的 `Enumeration`。操作上，该类会从第一个\
  \ `InputStream` 读取读取请求直到其耗尽，然后切换到第二个。在 `Enumeration` 的情况下，它将继续遍历所有的 `InputStreams`\
  \ 直到最后一个流的结束。\n\n**示例 15.13**：在下面的代码中，文件名作为命令行参数给出：\n\n```java\nimport java.io.*;\n\
  class SequenceInputStreamTest {\n    public static void main(String args[]) throws\
  \ IOException {\n        FileInputStream f1 = new FileInputStream(args[0]);\n  \
  \      FileInputStream f2 = new FileInputStream(args[1]);\n        FileOutputStream\
  \ f3 = new FileOutputStream(args[2]);\n        SequenceInputStream sis = new SequenceInputStream(f1,f2);\n\
  \        int c;\n        while((c = sis.read()) != -1) {\n            f3.write(c);\n\
  \        }\n        f3.close();f1.close();f2.close();\n    }\n}\n```\n**输出：**\n\
  ```\nA.txt\nB.txt\nC.txt\n```\n\n### PrintStream\n\n`PrintStream` 是继承自 `FilterOutputStream`\
  \ 的字节流类。`PrintStream` 为另一个输出流增加了功能，即方便地打印各种数据的表示。可选地，可以创建一个 `PrintStream` 以实现自动刷新；这意味着在写入字节数组、调用其中一个\
  \ `println` 方法或写入换行符（`\\n`）后，会自动调用 `flush()` 方法。`PrintStream` 打印的所有字符都使用平台的默认编码转换为字节，然后写入构造函数中指定的\
  \ `OutputStream`。`PrintStream` 支持针对所有类型的 `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintStream`\
  \ 方法将调用对象的 `toString()` 方法然后打印结果。\n\n**构造函数：**\n\n- `PrintStream(File file)` 创建一个指定文件的新打印流，不自动刷新。\n\
  - `PrintStream(String fileName)` 创建一个指定文件名的新打印流，不自动行刷新。\n- `PrintStream(OutputStream\
  \ out)` 创建一个连接到指定 `OutputStream` 的新打印流。\n- `PrintStream(OutputStream out, boolean\
  \ autoFlush)` 创建一个连接到指定 `OutputStream` 的新打印流。\n\n![C:\\Users\\Made Man Harry\\Desktop\\\
  Stars\\Star_logo_yellow.jpg](img/00052.jpeg)\n\n**示例 15.14**\n```java\nimport java.io.*;\n\
  class PrintStreamTest {\n    public static void main (String args[]) throws IOException\
  \ {\n        PrintStream ps = new PrintStream(System.out, true);\n        ps.println(\"\
  This is a string\");\n        int i = -7;\n        ps.println(i);\n        double\
  \ d = 4.5e-7;\n        ps.println(d);\n    }\n}\n```\n**输出：**\n```\nThis is a string\n\
  -7\n4.5E-7\n```\n\n**示例 15.5**\n```java\nimport java.io.*;\nclass PrintStream2 {\n\
  \    public static void main (String argv[]) throws IOException {\n        FileOutputStream\
  \ fout = new FileOutputStream(\"test.dat\");\n        PrintStream ps = new PrintStream(fout,\
  \ true);\n        ps.println(\"This is a string\");\n        int i = -7;\n     \
  \   ps.println(i);\n    }\n}\n```\n\n\n\n\n\n# PrintWriter\n\n创建一个新的 `PrintWriter`，且不自动刷新行，用于写入指定的\
  \ `OutputStream`。\n\n`PrintWriter(OutputStream out, boolean autoFlush)`\n\n创建一个新的\
  \ `PrintWriter`，用于写入指定的 `OutputStream`。\n\n`PrintWriter(Writer out)`\n\n创建一个新的 `PrintWriter`，且不自动刷新行，用于写入指定的\
  \ `Writer`。\n\n`PrintWriter(Writer out, Boolean autoFlush)`\n\n创建一个新的 `PrintWriter`，用于写入指定的\
  \ `Writer`。\n\n最常用的构造函数是：\n\n`PrintWriter(OutputStream os, boolean flushOnNewLine)`\n\
  \n在这里，`os` 是 `OutputStream` 类型的对象，而 `flushOnNewLine` 控制 Java 是否在每次调用 `println()`\
  \ 方法时冲刷输出流。如果 `flushOnNewLine` 为 `true`，则会自动进行冲刷。如果为 `false`，则不会进行自动冲刷。\n\n`PrintWriter`\
  \ 支持针对所有类型（包括对象）的 `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintWriter` 方法将调用对象的 `toString()`\
  \ 方法然后打印结果。\n\n若要使用 `PrintWriter` 写向控制台写入内容，请指定 `System.out` 为输出流，并在每个新行后冲刷流。例如，此行代码创建了一个\
  \ `PrintWriter`：\n\n`PrintWriter pw = new PrintWriter(System.out, true)`\n\n###\
  \ 示例 15.16\n```java\nimport java.io.*;\n\nclass PrintWriterTest\n{\n    public static\
  \ void main (String argv[]) throws IOException\n    {\n        PrintWriter pw =\
  \ new PrintWriter(System.out, true);\n        pw.println(\"This is a string\");\n\
  \        int i = -7;\n        pw.println(i);\n        double d = 4.5e-7;\n     \
  \   pw.println(d);\n    }\n}\n```\n**输出：**\n```\nThis is a string\n-7\n4.5E-7\n\
  ```\n\n### 示例 15.17\n```java\nimport java.io.*;\n\nclass PrintWriterTest1\n{\n \
  \   public static void main (String argv[]) throws IOException\n    {\n        FileWriter\
  \ fout = new FileWriter(\"test.dat\");\n        PrintWriter pw = new PrintWriter(fout,\
  \ true);\n        pw.println(\"This is a string\");\n        int i = -7;\n     \
  \   pw.println(i);\n        double d = 4.5e-7;\n        pw.println(d);\n    }\n\
  }\n```\n\n### 示例 15.18\n```java\nimport java.io.*;\n\nclass PrintWriter2\n{\n  \
  \  public static void main (String argv[]) throws IOException\n    {\n        PrintWriter\
  \ pw = new PrintWriter(\"test.dat\");\n        pw.println(\"This is a string\");\n\
  \        int i = -7;\n        pw.println(i);\n        double d = 4.5e-7;\n     \
  \   pw.println(d);\n        pw.close();\n    }\n}\n```\n\n# PipedInputStream and\
  \ PipedOutputStream\n\n管道输出流（piped output）可以连接到管道输入流（piped input）以创建一个通信管道。管道输出是管道的发送端。管道输入流应该连接到管道输出流；通常，由一个线程从\
  \ `PipedInputStream` 读取数据，由另一个线程向相应的 `PipedOutputStream` 写入数据。不建议在单个线程中同时这两个对象，因为可能会导致线程死锁。管道输入包含一个缓冲区，在限制范围内将读取操作与写入操作解耦。\n\
  \n### 构造函数\n- `PipedInputStream()`: 创建一个 `PipedInputStream`，尚未连接。\n- `PipedInputStream(PipedOutputStream\
  \ src)`: 创建一个 `PipedInputStream`，使其连接到输出流 `src`。\n- `PipedOutputStream()`: 创建一个\
  \ `PipedOutputStream`，尚未连接。\n- `PipedOutputStream(PipedInputStream snc)`: 创建一个 `PipedOutputStream`，连接到指定的管道输入流。\n\
  \n### 示例 15.19\n```java\nimport java.io.*;\n\nclass TextGenerator extends Thread\n\
  {\n    OutputStream out;\n    TextGenerator(OutputStream out)\n    {\n        this.out\
  \ = out;\n    }\n    public void run()\n    {\n        try\n        {\n        \
  \    try\n            {\n                for(byte b = 65; b<=90; b++)\n        \
  \            out.write(b);\n            }\n            finally\n            {\n\
  \                out.close();\n            }\n        }\n        catch(IOException\
  \ e)\n        {\n            System.out.println(e);\n        }\n    }\n}\n\nclass\
  \ Pipe\n{\n    public static void main(String args[]) throws IOException\n    {\n\
  \        PipedOutputStream out = new PipedOutputStream();\n        PipedInputStream\
  \ in = new PipedInputStream(out);\n        TextGenerator data = new TextGenerator(out);\n\
  \        data.start();\n        int ch;\n        while((ch = in.read()) != -1)\n\
  \            System.out.print((char) ch);\n    }\n}\n```\n**输出：**\n```\nABCDEFGHIJKLMNOPQRSTUVWXYZ\n\
  ```\n\n# PipedReader and PipedWriter\n\n它们的功能与 `PipedInputStream` 和 `PipedOutputStream`\
  \ ，唯一的区别在于它们是字符流。\n\n### 构造函数\n- `PipedReader()`: 创建一个 `PipedReader`，尚未连接。\n- `PipedReader(PipedWriter\
  \ src)`: 创建一个 `PipedReader`，使其连接到管道写入器 `src`。\n- `PipedWriter()`: 创建一个 `PipedWriter`，尚未连接到管道读取器。\n\
  - `PipedWriter(PipedReader snk)`: 创建一个 `PipedWriter`，连接到指定的管道读取器。\n\n### 示例 15.20\n\
  ```java\nimport java.io.*;\n\nclass TextGenerator extends Thread\n{\n    Writer\
  \ out;\n}\n```\n\n\n\n\n\n```java\nTextGenerator(Writer out)\n  {\n    this.out\
  \ = out;\n  }\n  public void run()\n  {\n    try {\n      try {\n        for(char\
  \ c = 'a'; c<='z'; c++) {\n          out.write(c);\n        }\n      } finally {\n\
  \        try {\n          Thread.sleep(200);\n        } catch(Exception e) {}\n\
  \        System.out.println(\"aaaaaaaaa\");\n        if(true)\n          return;\
  \      // IOException: pipe Broken\n        out.close();   //IOException: Write\
  \ end dead\n      }  //OK if thread finishes closing the pipe\n    }\n    } catch(IOException\
  \ e) {\n      System.out.println(e);\n    }\n  }\n```\n\n```java\nclass Pipe2\n\
  {\n  public static void main (String argv[]) throws IOException {\n    PrintStream\
  \ ps = new PrintStream(System.out);\n    PipedWriter out = new PipedWriter();\n\
  \    PipedReader in = new PipedReader(out);\n    TextGenerator data = new TextGenerator(out);\n\
  \    data.start();\n    int ch;\n    while((ch = in.read()) != -1) {\n      System.out.print((char)\
  \ ch);\n    }\n  }\n}\n```\n\n输出：\nabcdefghijklmnopqrstuvwxyaaaaaaaaaaaa\nException\
  \ in thread \"main\" java.io.IOException: Pipe broken\n    at java.io.PipedReader.read(Unknown\
  \ Source)\n    at Pipe2.main(Pipe2.java:43)\n\n### 过滤字节流 (Filtered Byte Streams)\n\
  \n过滤流仅仅是对底层输入流或输出流的包装器，能够透明地提供某些扩展功能。典型的扩展包括缓冲、zip 压缩/解压等。过滤字节流是 `FilterInputStream`\
  \ 和 `FilterOutputStream`。它们的构造函数如下：\n\n`FilterInputStream(InputStream in)`\n通过将参数\
  \ `in` 赋值给字段 `this.in` 来创建一个 `FilterInputStream`，以便稍后备用。\n\n`FilterOutputStream(OutputStream\
  \ out)`\n创建一个构建在指定的底层输出流之上的输出流过滤器。质这些类中提供的方法与 `InputStream` 和 `OutputStream` 中的方法相同。\n\
  \n### 缓冲字节流 (Buffered Byte Streams)\n\n对于面向字节的流，缓冲流通过在 I/O 流上附加内存缓冲区来扩展过滤流类。该缓冲区允许\
  \ Java 一次对多个字节进行 I/O 操作，从而提高性能。\n\n由于缓冲区的可用，对流进行跳过（skipping）、标记（marking）和重置（resetting）变得可能。缓冲字节流类是\
  \ `BufferedInputStream` 和 `BufferedOutputStream``PushbackInputStream` 也实现了缓冲流。\n\
  \n### BufferedInputStream (The BufferedInputStream)\n\n缓冲 I/O 是一种非常常见的性能优化手段。Java\
  \ 的 `BufferedInputStream` 类允许你将任何 `InputStream` “包装”成缓冲流并实现这种性能提升。\n\n`BufferedInputStream`\
  \ 有两个构造函数：\n\n`BufferedInputStream(InputStream in)`\n创建一个 `BufferedInputStream`\
  \ 并保存其参数输入流 `in` 以备后使用。它会创建一个内部数组并存储在 `buf` 中。\n\n`BufferedInputStream(InputStream\
  \ in, int size)`\n创建一个具有指定缓冲区大小的 `InputStream`，并保存其参数输入流 `in` 以备后使用。缓冲输入流还提供了在可用缓冲区中向后移动的支持。除了任何\
  \ Input Stream 中实现的 `read()` 和 `skip()` 方法外，`BufferedInputStream` 还支持 `mark()` 和\
  \ `reset()` 方法。这种支持通过 `BufferedInputStream.markSupported()` 返回 `true` 体。\n\n示例 5.2：\n\
  \n```java\nimport java.io.*;\nclass BufferedInputStream\n{\n  public static void\
  \ main(String args[]) throws IOException {\n    fin=new FileInputStream(\"A.txt\"\
  );\n    BufferedInputStream b1 = new BufferedInputStream(fin);\n    for(int i=1;i<=10;i++)\
  \ {\n      System.out.print((char)b1.read());\n    }\n    System.out.println();\n\
  \    if(b1.markSupported()) {\n      b1.mark(500);\n      for(int i=1;i<=10;i++)\
  \ {\n        System.out.print((char)b1.read());\n      }\n      System.out.println();\n\
  \      b1.reset();\n      for(int i=1;i<=10;i++) {\n        System.out.print((char)b1.read());\n\
  \      }\n    }\n  }\n}\n```\n\n\n\n\n\n# BufferedOutputStream\n\n创建一个新的缓冲输出流，用于向指定的底层输出流写入数据。它使用大小为\
  \ 512 字节的缓冲区。\n\n`BufferedOutputStream(OutputStream out, int size)`\n\n创建一个新的缓冲输出流，使用指定的缓冲区大小向指定的底层输出流写入数据。\n\
  \n### 示例 15.22\n\n```java\nimport java.io.*;\n\nclass BufferedOutputStreamTest {\n\
  \    public static void main(String args[ ) throws IOException {\n        BufferedOutputStream\
  \ f = new BufferedOutputStream (System.out,100);\n        byte buf[] = \"This will\
  \ not be displayed without flush()\\n\".getBytes();\n        f.write(buf);\n   \
  \     f.write(buf);\n        System.out.println(\"testing...\");\n        f.write(buf);\n\
  \        //f.flush(); or\n        //f.close();\n    }\n}\n```\n\n**输出：**\n```\n\
  testing...\nThis will not be displayed without flush()\nThis will not be displayed\
  \ without flush()\nThis will not be displayed without flush()\n```\n\n# BufferedReader\n\
  \n`BufferedReader` 通过缓冲输入来提高性能。它有两个构造函数：\n\n- `BufferedReader(Reader in)`：创建一个使用默认大小输入缓冲区的字符输入流。\n\
  - `BufferedReader(Reader in, int sz)`：创建一个使用指定大小输入缓冲区的字符输入流。\n\n### 示例 15.23\n\n\
  ```java\nimport java.io.*;\n\nclass BufferedReaderTest {\n    public static void\
  \ main(String args[]) throws IOException {\n        FileReader fr=new FileReader(\"\
  A.txt\");\n        BufferedReader b1 = new BufferedReader(fr);\n        for(int\
  \ i=1;i<=10;i++) {\n            System.out.print((char)b1.read());\n        }\n\
  \        System.out.println();\n        if(b1.markSupported()) {\n            b1.mark(5);\n\
  \            for(int i=1;i<=10;i++) {\n                System.out.print((char)b1.read());\n\
  \            }\n            System.out.println();\n            b1.reset();\n   \
  \         for(int i=1;i<=10;i++) {\n                System.out.print((char)b1.read());\n\
  \            }\n        } else {\n            System.out.println(\"Mark option is\
  \ not available\");\n        }\n        b1.close();\n        fr.close();\n    }\n\
  }\n```\n\n# BufferedWriter\n\n使用 `BufferedWriter` 通过减少数据实际写入流的次数来提高性能。\n\n### 构造函数\n\
  \n- `BufferedWriter(Writer out)`：创建一个使用默认大小输出缓冲区的字符输出流。\n- `BufferedWriter(Writer\
  \ out, int sz)`：创建一个使用指定大小输出缓冲区的字符输出流。\n\n### 示例 15.24\n\n```java\nimport java.io.*;\n\
  \nclass Test {\n    public static void main(String args[]) throws IOException {\n\
  \        BufferedWriter f = new BufferedWriter(new PrintWriter(System.out));\n \
  \       String s = \"This will not be displayed without flush()\\n\";\n        char\
  \ buf[] = new char[s.length()];\n        s.getChars(0,s.length(),buf,0);\n     \
  \   f.write(buf);\n        f.write(buf);\n        System.out.println(\"testing...\"\
  );\n        f.write(buf);\n        //f.flush();\n        //f.close();\n    }\n}\n\
  ```\n**输出：**\n```\ntesting...\n```\n\n# 处理原始数据类型\n\n基础输入和输出流提供了 `read/write` 方法，这些方法只能用于读/写字节或字符。如果我们想读/写整数和双精度浮等原始数据类型，可以使用过滤器类作为现有输入输出流的包装器。\n\
  \n用于处理原始数据类型的两个过滤器类是 `DataInputStream` 和 `DataOutputStream`。这些类实现了父类中包含的所有方法。\n\n\
  可以如下所示创建从文件的输入数据流：\n```java\nFileInputStream fis = new FileInputStream(infile);\n\
  DataInputStream dis = new DataInputStream(fis);\n```\n同样，以下语句创建输出数据流并将其封装在输出文件上：\n\
  ```java\nFileOutputStream fos = new FileOutputStream(outfile);\nDataOutputStream\
  \ dos = new DataOutputStream(fos);\n```\n\n### 示例 15.25\n\n以下程序演示了原始数据的读取和写入。\n\n\
  ```java\nimport java.io.*;\n\nclass ReadWritePrimitive {\n    public static main\
  \ (String args[]) throws IOException {\n        File primitive = new File(\"prim.dat\"\
  );\n        FileOutputStream fos = new FileOutputStream(primitive);\n        DataOutputStream\
  \ dos = new DataOutputStream(fos);\n        dos.writeInt(1999);\n        dos.writeDouble(2.4);\n\
  \        dos.writeBoolean(false);\n        dos.writeChar('X');\n        dos.close();\n\
  \        fos.close();\n\n        FileInputStream fis = new FileInputStream(primitive);\n\
  \        DataInputStream dis = new DataInputStream(fis);\n        System.out.println(dis.readInt());\n\
  \        System.out.println(dis.readDouble());\n        System.out.println(dis.readBoolean());\n\
  \        System.out.println(dis.readChar());\n        dis.close();\n    }\n}\n```\n\
  \n\n\n\n\n```java\nfis.close();\n}\n}\n```\nOutput:\n```\n1999\n222.44\nfalse\n\
  X\n```\n\n## 预定义流\n\n`System` 类包含三个预定义的流变量 `in`、`out` 和 `err`。这些字段在 `System` 类中被为\
  \ `public` 且 `static`。这意味着它们可以在程序的任何其他部分使用，而无需引用特定的对象。\n\n`System.out` 指向标准输出流。默认情况下它是控制台。`System.out`\
  \ 是一个 `PrintStream` 类型的对象。\n\n`System.in` 指向标准输入，默认是键盘。`System.in` 是一个 `InputStream`\
  \ 类型的对象。\n\n`System.err` 指向标准错误流，默认情况下也是控制台。`System.err` 是一个 `PrintStream` 类型的对象。\n\
  \n这些都是字节流，尽管它们通常被用于从控制台读取和写入字符。如果需要，你可以将它们封装在基于字符的流中。\n\n## InputStreamReader\n\n\
  `InputStreamReader` 是字节流到字符流的桥梁；它读取字节并使用指定的 `charset` 将其解码为字符。它使用的字符集可以明确指定，也可以接受平台的默认字符集。\n\
  \n### 构造函数\n\n- `InputStreamReader(InputStream in)`\n创建一个使用默认字符集的的 `InputStreamReader`。\n\
  \n- `InputStreamReader(InputStream in, String charsetName)`\n创建一个使用指定名称字符集的 `InputStreamReader`。\n\
  \n### 示例 15.26\n\n```java\nimport java.io.*;\nclass InputStreamReaderTest {\n  \
  \  public static void main (String argv[]) throws IOException {\n        char c;\n\
  \        InputStreamReader is = new InputStreamReader(System.in);\n        System.out.println(\"\
  Enter characters, 'q' to quit\");\n        c = (char)is.read();\n        while(c!='q')\
  \ {\n            System.out.print(c);\n            c = (char)is.read();\n      \
  \  }\n    }\n}\n```\nOutput:\n```\nEnter characters, 'q' to quit\nabcd\nq\n```\n\
  \n## 示例 15.27\n\n对之前的示例进行了修改以使用缓冲区。\n\n```java\nimport java.io.*;\nclass BufferedReaderTest\
  \ {\n    public static void main (String args[]) throws IOException {\n        char\
  \ c;\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\
  \        System.out.println(\"Enter characters, 'q' to quit\");\n        c = (char)br.read();\n\
  \        while(c!='q') {\n            System.out.print(c);\n            c = (char)br.read();\n\
  \        }\n    }\n}\n```\nOutput:\n```\nEnter characters, 'q' to quit\nabcd\nq\n\
  ```\n\n## 示例 15.28\n\n`InputStreamReader` 没有提供 `readLine()` 方法，因此 `InputStreamReader`\
  \ 通常链接到 `BufferedReader`，而后者提供了 `readLine()` 方法。\n\n```java\nimport java.io.*;\n\
  class BufferedReaderTest {\n    public static void main (String argv[]) throws IOException\
  \ {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\
  \        System.out.println(\"Enter 'stop' to quit\");\n        String str = br.readLine();\n\
  \        while(!str.equals(\"stop\")) {\n            System.out.println(\"Your Name:\"\
  +str);\n            str = br.readLine();\n        }\n    }\n}\n```\nOutput:\n```\n\
  Enter 'stop' to quit\nHarry Feat\nYour Name:Harry Feat\nstop\n```\n\n## 示例 15.29\n\
  \n此示例演示了我们可以直接从 `System.in` 读取。\n\n```java\nimport java.io.*;\nclass ReadFromConsole\
  \ {\n    public static void main (String arg[]) throws IOException {\n        char\
  \ c;\n        System.out.println(\"Enter characters, 'q' to quit\");\n        c\
  \ = (char) System.in.read();\n        while(c!='q') {\n            System.out.print(c);\n\
  \            c = (char) System.in.read();\n        }\n    }\n}\n```\nOutput:\n```\n\
  Enter characters, 'q' to quit\nabcd\n```\n要获取连接到控制台的字符流，你需要将 `System.in` 封装在 `InputStreamReader`\
  \ 对象中，然后进一步封装在 `BufferedReader` 对象中以提高性能。在 Java 1.0 中，执行控制台输入的唯一方法是使用字节流，这种方法在旧代码中仍然存在。今天，使用字节流读取控制台仍然可行，但这样做可能需要使用已弃的方法，且不推荐这种方法。\n\
  \n## OutputStream\n\n`OutputStreamWriter` 是字符流到字节流的桥梁：写入它的字符将使用指定的 `charset` 编码为字节。它使用的字符集可以明确指定，也可以接受平台的默认字符集。\n\
  \n### 构造函数\n\n- `OutputStreamWriter(OutputStream out)`\n创建一个使用默认编码的 `OutputStreamWriter`。\n\
  \n- `OutputStreamWriter(OutputStream out, String charsetName)`\n创建一个使用指定名称字符集的 `OutputStreamWriter`。\n\
  \n### 示例 15.30\n\n```java\nimport java.io.*;\nclass WriteTest {\n}\n```\n\n\n\n\n\
  ```java\npublic static void main(String argv[]) throws IOException {\n    int b;\n\
  \    b = 'A';\n    System.out.write(b);\n    // System.out.flush();to flush\n  \
  \  System.out.write('\\n');//to flush\n}\n```\n\n### 输出\n```\nA\n```\n\n### 注意：\n\
  你通常不会使用 `write()` 来执行控制台输出，因为 `print()` 和 `println()` 使用起来简单得多。\n\n### 序列化\n序列化是将对象的状态写入字节流的过程。当你想要将对象的状态写入字节流时，这种方法非常有用。当你想要将程序的状态保存到持久化存储区域（如文件）时，这同样有用。在以后，，你可以通过反序列化过程来恢复这些对象。\n\
  \n实现 RMI 也需要序列化。RMI 允许一台机器上的 Java 对象调用另一台机器上 Java 对象的方法。对象可以作为参数传递给远程方法。发送端对对象进行序列化并转换。接收端对其进行反序列化。\n\
  \n如果你尝试序列化对象图顶部的对象，所有其他引用的对象都会被递归地找到并序列化。\n\n同样地，在反序列化过程中，所有这些对象及其引用都会被正确存储。声明为\
  \ `transient` 或 `static` 的变量不会被序列化机制保存。\n\n### Externalizable 接口\nJava 的序列化和反序列化机制的设计使得保存和恢复对象状态的大部分工作可以自动完成。\n\
  \n然而，在某些情况下，程序员可能需要对这些过程进行控制。例如，使用压缩或加密技术可能是必要的。`Externalizable` 接口就是为了这些情况设计的。实现\
  \ `Externalizable` 接口的类也可以被序列化和反序列化。\n\n但控制权在用户手中，即用户可以决定序列化和反序列化哪些部分。序列化代码写在 `readExternal()`\
  \ 方法中，反序列化代码写在 `writeExternal()` 方法中。\n\n#### Externalizable 接口的方法：\n```java\nvoid\
  \ readExternal(ObjectInput in)\n```\n对象实现 `readExternal` 方法，通过调用用于原始类型的 `DataInput`\
  \ 方法以及用于对象、字符串和数组的 `readObject` 方法来恢复其内容。\n\n```java\nvoid writeExternal(ObjectOutput\
  \ out)\n```\n对象实现 `writeExternal` 方法，通过调用用于其原始值的 `DataOutput` 方法或调用用于对象、字符串和数组的\
  \ `ObjectOutput.writeObject` 方法来保存其内容。\n\n### ObjectOutput 接口\n`ObjectOutput` 接口扩展\
  \ `DataOutput` 接口并支持对象序列化。除了 `DataOutput` 接口定义的方法外，`ObjectOutput` 接口只定义了一个方法。\n\n\
  ```java\nVoid writeObject(Object object)\n```\n该方法用于序列化对象。`ObjectOutput` 接口的所有方法在错误条件下都会抛出\
  \ `IOException`。\n\n### ObjectOutputStream\n`ObjectOutputStream` 类扩展 `OutputStream`\
  \ 类并实现 `ObjectOutput` 接口。它负责将对象写入流中。\n\n- **构造函数**：`ObjectOutputStream(OutputStream\
  \ out)` - 创建一个写入指定 `OutputStream` 的 `ObjectOutputStream`。参数 `out` 是将要写入对象的输出流。\n\
  - **写入对象的方法**：`void writeObject(Object obj)` - 将对象写入底层存储或流中。\n\n### ObjectInput\
  \ 接口\n`ObjectInput` 接口扩展 `DataInput` 接口。它支持对象序列化。除了 `DataInput` 接口定义的方法外，`ObjectInput`\
  \ 只定义了一个方法：\n\n```java\nObject readObject()\n```\n该方法用于反序列化对象。\n\n### ObjectInputStream\n\
  `ObjectInputStream` 类扩展 `InputStream` 类并实现 `ObjectInput` 接口。它负责从流中读取对象。\n\n- **构造函数**：`ObjectInputStream(InputStream\
  \ in)` - 创建一个从指定 `InputStream` 读取的 `ObjectInputStream`。参数 `in` 是从中读取对象的输入流。\n- **反序列化方法**：`Object\
  \ readObject()` - 从 `ObjectInputStream` 中读取对象。\n\n### 示例 5.3\n```java\nimport java.io.*;\n\
  \nclass SerializationTest {\n    public static void main(String args[]) throws IOException\
  \ {\n        try {\n            MyClass object1 = new MyClass(\"Hello\", 123, 1.3e3);\n\
  \            MyClass object2 = new MyClass(\"Hello1\", 1, 2);\n            System.out.println(object1);\n\
  \            System.out.println(object2);\n            FileOutputStream fos = new\
  \ FileOutputStream(\"serial.dat\");\n            ObjectOutputStream oos = new ObjectOutputStream(fos);\n\
  \            oos.writeObject(object1);\n            oos.writeObject(object2);\n\
  \            oos.flush();\n            oos.close();\n        } catch (Exception\
