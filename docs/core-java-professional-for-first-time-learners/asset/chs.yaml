  改为\n`f.setLayout(new FlowLayout(FlowLayout.RIGHT));`\n**输出：**\n![](img/00065.jpeg)\n\
  \n### 示例 17.5\n我们可以通过重载的构造函数更改行内组件之间的间距（水平间距）以及行间距（垂直间距）：\n`f.setLayout(new FlowLayout(FlowLayout.CENTER,\
  \ 20 ,20))`\n**输出：**\n![](img/00066.jpeg) ![](img/00067.jpeg)\n\n### 3. GridLayout\
  \ 网格布局\n`GridLayout` 的功能封装在 `java.awt.GridLayout` 类中。`GridLayout` 以表格格式按行和列排列组件。我们可以将容器视为由行和列组成的网格。在指定布局时，必须指定行数和列数。`GridLayout`\
  \ 会根据行的大小（即布局中指定的列数）将尽可能多的组件放入第一行，并将其他组件移动到第二行，依此类推。这类似于电子表格，被分为固定数量的行和列。\n\n`网格布局`\
  \ 中的每一行每一列的大小都相同，布局可用的总区域在行数和列数之间平均分配。网格布局使用“行优先”表示法，即组件按照它们添加的顺序从左到右、按行出现。当添加的组件很少（即远少于行数乘以列数）或很多（即多于行数乘以列数）时，`GridLayout`\
  \ 的行为会奇怪。如果将相同的组件放置在一个更高更窄的框架中，那么每个组件都会按比例地变得更高、更窄，反之亦然。\n\n**示例 17.6：**\n```java\n\
  import java.awt.*;\npublic class MyFrame6 extends Frame {\n    public static void\
  \ main(String args[]) {\n        Frame f = new MyFrame6( );\n        f.setLayout(new\
  \ GridLayout(5,3));\n        for(int row=0; row<5; row++) {\n            f.add(new\
  \ Label(\"Label\" + row ));\n            f.add(new Button(\"Button\" + row ));\n\
  \            f.add(new TextField(\"TextField\" + row ));\n        }\n        f.setSize(500,200);\n\
  \        f.setVisible(true);\n    }\n}\n```\n**输出：**\n![](img/00069.jpeg)\n\n###\
  \ 4. BorderLayout 边界布局\n`BorderLayout` 管理器的功能封装在 `java.awt.BorderLayout` 类中。`BorderLayout`\
  \ 管理器是框架的默认管理器，因此程序员迟早会熟悉它。\n\n它强制了一种非常有用的布局策略，但可能比流布局或网格布局管理器不那么直观。流布局管理器总是尊重组件的首选尺寸；而网格布局管理器从不尊重。边界布局管理器则介于两者之间。\n\
  \n`边界布局管理器` 将可用的容器空间分为五个部分：北（North）、南（South）、东（East）、西（West）和中心（Center）。我们可以向每个区域添加一个组件。\n\
  \n五个区域中的每一个区域可以是空的，也可以包含一个组件（即不是每个区域都需要包含组件，但区域只能包含一个组件）。\n\n边界布局管理器尊重北部和南部组件的首选高度，并强制它们的宽度与容器完全一致。北部和南部区域适用于工具栏、状态栏以及任何其他希望尽可能宽但高度不超过所需的控件。\n\
  \n东部和西部区域与北部和南部相反。在东部和西部，组件获得其首选宽度，但高度受到限制。\n\n在这里，组件在垂直方向上延伸到北部组件的底部（如果有）或容器的顶部（如果没有北部组件）。\n\
  \n同样，组件在垂直方向上向下延伸到南部组件（如果有）或容器的底部（如果没有南部组件）。\n\n\n\n\n- `BorderLayout.EAST`\n- `BorderLayout.WEST`\n\
  - `BorderLayout.CENTER`\n\n`BorderLayout` 布局管理器控制的第五个区域被称为 `Center`。`Center` 只是容器在分配了\
  \ `North`、`South`、`East` 和 `West` 之后剩余的部分。\n\n在将组件添加到中心区域时，向 `add()` 调用传递第二个参数是合法的但非常不明智的。在\
  \ Java 平台上，`BorderLayout` 布局管理器将假设我们的意思是 `center`。\n\n然而，在旧版本中，这种行为是不可预测的，通常会导致组件完全不可见。\n\
  \n### Example 17.7\n\n```java\nimport java.awt.*;\npublic class MyFrame7 {\n   \
