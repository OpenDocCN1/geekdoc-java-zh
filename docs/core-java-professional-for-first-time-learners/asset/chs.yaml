  \n## 简介\nApplet 是一种设计用于在互联网上传输并在兼容 Java 的网络浏览器（如 Internet Explorer 或 Netscape Navigator）上执行的应用程序。Applet\
  \ 也是 Java 程序，但它们存储（存储）在服务器上。\n\nApplet 不能像独立应用程序那样执行。Applet 只能通过嵌入 HTML 页面（类似于图像或音频文件）来执行。运行\
  \ applet 需要访问一个嵌入了 applet 的 HTML 页面。当网页浏览器下载此类 HTML 页面时，随后加载包含 applet 代码的可执行文件。\n\
  \nApplet 到达客户端后，其对资源的访问非常有限，这样它可以产生任意的多媒体用户界面并运行复杂的计算，而不会引入病毒风险或破坏数据完整性。\n\n## Applet\
  \ 架构\nApplet 与普通的 Java 程序不同。\n\n* Applet 是基于 GUI（窗口）的程序\n* Applet 是事件驱动的\n\n当一个普通的\
  \ Java 程序（非基于 GUI 的）需要输入时，它会提示用户然后调用某些输入方法，例如 `readLine()`，即交互是由程序发起的。这并不是基于 GUI\
  \ 的程序的运行方式。是由用户发起与程序的交互，而不是由程序发起动作。例如，在文字处理软件中，用户通过点击按钮发起动作，这会产生一个事件，并相应执行某些代码以采取行动。\n\
  \nApplet 使用 `awt` 包（抽象窗口工具包）来提供 GUI 和事件处理。之所以被称为 `awt`，是因为它完全依赖于底层操作系统的功能。applet\
  \ 类似于一组中断例程。applet 会等待直到事件发生。`awt` 通过调用由 applet 提供的事件处理器来通知 applet。一旦发生这种情况，applet\
  \ 必须采取适当的行动并迅速将控制权还给 `AWT`。这是一个关键点。在大多数情况下，applet 不应该进入一种长时间保持控制的运行“模式”。相反，它必须响应事件并执行特定操作，然后将控制权返回给\
  \ `AWT` 运行时。在 applet 需要独立执行重复任务的情况下（例如，在它的窗口跨窗口显示消息），我们会启动一个额外的执行线程。\n\n### 编写 Applet\n\
  所有的 applet 都是 `Applet` 类的子类。`Applet` 类位于 `java.applet` 包中。Applet 类的层级结构如下：\n\n```\n\
  java.lang.Object\n    |\njava.awt.Component\n    |\njava.awt.Container\n      |\n\
  java.awt.Panel\n      |\njava.applet.Applet\n```\n\n`Applet` 类为 applet 的执行提供了所有支持，例如启动和停止。它还提供了加载和显示图像的方法。它还提供了对所有窗口活动的支持。我们扩展\
  \ `Applet` 的子类必须始终声明为 `public`，因为它是由网络浏览器实例化（创建对象）并执行的。浏览器在实例化 applet 时使用无参构造函数，因此它必须提供一个具有\
  \ `public` 可见性的无参构造函数。建议我们不要在 `Applet` 类中提供构造函数，因为在这种情况下编译器将提供默认的无参构造函数。我们可以使用 `init()`\
  \ 方法进行初始化。在编写 applet 代码时，我们通常重写 `Applet` 类的一些方法，这些方法在 applet 执行期间被调用。重写 `paint()`\
  \ 方法是非常常见的。`paint()` 方法主要在 applet 窗口中显示输出。\n\n### 示例 1.1 (App1.java)\n以下程序演示了一个简单的\
  \ applet，它在窗口内显示“Hello World”。无论我们在 applet 的 `paint()` 方法中绘制了什么，它都会出现在 applet 的窗口中。在接下来的示例中，applet\
  \ 的背景颜色设置为红色，前景颜色设置为绿色，因此背景将显示为红色，文本“Hello World”将以绿色显示。\n\n```java\nimport java.awt.*;\n\
  import java.applet.Applet;\n/*<applet code=\"App1\" width=500 height=100></*/\n\
  class App1 extends Applet {\n    public void init() {\n        setBackground(Color.red);\n\
  \        setForeground(Color.green);\n    }\n    public void paint(Graphics g) {\n\
  \        g.drawString(\"Hello World\",20,20);\n    }\n}\n```\n\n\n\n\n\nApplet 并不由基于控制的\
  \ Java 运行时解释器执行。我们可以通过两种方式来运行 applet。\n\n1. 在兼容 Java 的 Web 浏览器中执行 applet。\n2. 使用\
  \ `appletviewer`，例如标准的 SDK 工具 `appletviewer`。`appletviewer` 会在一个窗口中运行我们的 applet。这是测试\
  \ applet 最快、最简单的方法。\n\n### 在 Web 浏览器中执行 Applet\n\n我们需要编写一个短的 HTML 文本文件，其中包含相应的 `APPLET`\
  \ 标签。applet 标签必须包含至少三个属性：\n\n- `Code`\n- `Width`\n- `Height`\n\n`code` 属性的值指定包含\
  \ applet 代码的类名。`width` 和 `height` 属性分别指定 applet 窗口的宽度和高度。\n\n这里是嵌入了 applet \"App1\"\
  \ 的 HTML 文件 `RunApp.Html`。\n\n```html\n<html>\n<head>\n<title>Simple Applet</title>\n\
  </head>\n<body>\n<h1>Simple “Hello World” Application </h1></h1>\n<applet code=\"\
  App1\" width=500 height=100>\n</applet>\n</body>\n</html>\n```\n\n可以通过在 Web 浏览器中打开文件\
  \ `RunApp.html` 来执行 applet。该文件可以位于本地文件系统中，也可以从 Web 服务器加载。\n\n### 使用 appletviewer\
  \ 执行 Applet\n\n然而，存在一种更方便的方法可以用来加速测试。只需在你的 Java 源代码文件中包含一个带有 `APPLET` 标签的注释即可。通过这样做，我们的代码就包含了必要的\
  \ HTML 语句的原型文档，我们只需通过启动 `appletviewer` 并加载我们的 Java 源代码文件即可测试编译后的输出。如果我们使用这种方法，那么在编译后我们可以按照如下方式执行\
  \ applet：\n\n```bash\nappletviewer SimpleApplet.Java\n```\n\n### Applet 生命周期方法\n\
  \nApplet 重写了一组方法，这些方法提供了一种浏览器或 `appletviewer` 与 applet 交互并控制其执行的基本机制。\n\n这些方法也被称为生命周期方法，因为浏览器或\
  \ applet 查看器会在 applet 生命周期的不同阶段自动调用它们。总共有五个生命周期方法：\n\n- `public void init()`\n-\
  \ `public void start()`\n- `public void stop()`\n- `public void destroy()`\n- `public\
  \ void paint(Graphics g)`\n\n这四个方法中的：`init()`、`start()`、`stop()` 和 `destroy()` 定义在\
  \ `applet` 类中。\n\n`paint()` 由 `Component` 类定义，并为所有这些方法提供了默认实现。Applet 不需要重写它们未使用的方法。然而，非常简单的\
  \ applet 不需要定义它们。\n\n### Applet 的初始化与终止\n\n当 applet 启动时，会按顺序调用以下方法：\n1. `init()`\n\
  2. `start()`\n3. `paint()`\n\n当 applet 终止时，会发生以下顺序的方法调用：\n4. `stop()`\n5. `destroy()`\n\
  \n### init() 方法\n这是第一个被调用的方法。在这里，我们应该初始化变量并为其他初始化活动编写代码。该方法在 applet 生命周期周期内仅在实例化后立即被调用一次。\n\
  \n### start() 方法\n`start()` 方法在 `init()` 之后被调用。它也用于在 applet 停止后重启它。`init()` 在 applet\
  \ 第一次加载时调用一次，而 `start()` 在每次 applet 的 HTML 文档显示在屏幕上时都会被调用。所以，如果用户离开一个网页并返回，applet\
  \ 将从 `start()` 处恢复执行。\n\n### paint() 方法\n`paint()` 在 applet 开始执行时于 `init()` 和 `start()`\
  \ 方法之后被调用。每当 applet 的输出需要重绘时，`paint()` 方法也会被调用。这种情况可能由于几个原因。例如，运行 applet 的窗口可能被另一个窗口覆盖然后重新显示，或者\
  \ applet 窗口可能被最小化然后恢复。\n\n### stop() 方法\n当 Web 浏览器离开包含 applet 的 HTML 文档（例如跳转另一个页面）时，`stop()`\
  \ 方法会被调用。当调用 `stop()` 时，applet 可能仍在运行。\n\n我们应该使用 `stop()` 来挂起在 applet 不可见时不需要运行的线程。如果用户返回页面，我们可以在\
  \ `start()` 被调用时重新启动它们。我们还可以释放任何昂贵的资源并在 `start()` 方法中重新获取。\n\n### destroy() 方法\n\
  当环境确定我们的 applet 需要完全从内存中移除时，`destroy()` 方法会被调用。此时，我们应该释放 applet 可能正在使用的任何资源。`stop()`\
  \ 方法在 `destroy()` 之前总是会被调用。\n\n示例 16.2 一个简单的 applet，将背景颜色设置为青色，前景颜色设置为红色，并显示一条消息，说明\
  \ applet 启动时 `init()`、`start()` 和 `paint()` 方法调用的顺序。\n\n```java\nimport java.awt.*;\n\
  import java.applet.*;\n/*applet code=\"App2\" width=500 height=100></applet*/\n\
  public class App2 extends Applet {\n    String msg=\"\";\n    public void init()\
  \ {\n        System.out.println(\"init\");\n        setBackground(Color.cyan);\n\
  \        setForeground(Color.red);\n    }\n    public void start() {\n        System.out.println(\"\
  start\");\n    }\n    public void stop() {\n        System.out.println(\"stop\"\
  );\n    }\n    public void paint(Graphics g) {\n        System.out.println(\"paint\"\
  );\n    }\n    public void destroy() {\n        System.out.\n(\"\n\");\n    \n\n\
  \n\n6. 一个简单的 applet，它将背景颜色设为青色，前景颜色设为红色，并显示一条消息，以说明 applet 启动时 `init()`、`start()`\
  \ 和 `paint()` 方法调用的顺序。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n/*applet\
  \ code=\"App2\" width=500 height=100></applet*/\npublic class App2 extends Applet\
  \ {\n    String msg=\"\";\n    public void init() {\n        System.out.println(\"\
  init\");\n        setBackground(Color.cyan);\n        setForeground(Color.red);\n\
  \        msg = \"init --\";\n    }\n    public void start() {\n        System.out.println(\"\
  start\");\n        msg += \"start --\";\n    }\n    public void stop() {\n     \
  \   System.out.println(\"stop\");\n        msg += \"stop --\";\n    }\n    public\
  \ void paint(Graphics g) {\n        System.out.println(\"paint\");\n        msg\
  \ += \"paint --\";\n        g.drawString(msg,10,30);\n    }\n    public void destroy()\
