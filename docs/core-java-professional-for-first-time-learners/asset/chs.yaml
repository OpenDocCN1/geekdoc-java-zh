  \ Values are 7,5\n\n### 注释-\n有 3 种注释：\n* 单行注释：`//`\n* 多行注释：`/* */`\n* 文档注释：`/**\
  \ */`\n\n* 每个 Java 程序都必须包含一个类。在 Java 中，方法在 `main()` 中定义。\n* 每个 Java 程序都必须包含一个类。\n\
  * 源文件可以有任意数量的接口。\n* 独立程序始终从 `main()` 方法开始执行。\n* `main()` 方法必须始终具有以下签名：`public static\
  \ void main(String args[])`\n\n**注意** - `public static void main(String args[])`\n\
  * `public` 关键字表示该方法可以在任何地方访问。\n* `static` 关键字表示可以在不创建对象的情况下调用该方法。\n* `void` 关键字表示该方法不返回任何值。\n\
  * `args[]` 参数是一个 `String` 数组。\n* `main()` 方法接收一个参数，该参数是一个字符串数组。\n* `System.out`\
  \ 是连接到控制台的流。\n\n### Java 程序的结构\n所有 Java 源文件必须以 `.java` 结尾。Java 是大小敏感的。类可以是 `public`\
  \ 的也可以是非公共的。如果类是 `public` 的，则名称必须与文件名匹配。\n\n### 垃圾回收\nJava 的内存分配是动态的，但不支持指针算术。当我们运行\
  \ Java 程序时，JVM 还会运行另一个名为垃圾回收器的线程。当一个 Java 对象不再被使用时，它会被垃圾回收器收集；即为对象分配的内存会被加入空闲池并重复使用。这简化了程序员的任务，并消除了由于不当使用指针算术和显式内存管理导致的许多错误。\n\
