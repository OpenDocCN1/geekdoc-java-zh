  \n---\n\n## 第 5 章：类与对象\n\n## 引言\n\n### 定义类\n类代表了一种 ADT（抽象数据类型）。它像一个模板，我们可以通过它创建多个对象（实例）。类的声明只创建一个模板，而不会创建实际的对象。类创建了一种新的数据类型，可以用于创建对象。也就是说，类创建了一个定义了其成员之间关系的逻辑框架。当我们声明一个类的对象时，我们正在创建该类的一个实例。因此，类是一个逻辑结构。对象具有物理现实（也就是说，对象占用内存空间）。\n\
  \n```java\nmodifiers class <classname> {\n    modifiers type variables;\n    modifiers\
  \ type methodName1(parameter-list) {\n        <body of the method>\n    }\n}\n```\n\
  \n### 声明对象\n`Student s1;` 在上面的示例中 `s1` 并不是一个对象。在 C++ 中 `s1` 被视为对象，但在 Java 中 `s1`\
  \ 只是一个变量，可以持有指向 `Student` 类型对象的引用。在分配类 `Student` 的对象的引用之前，该变量将持有 `null` 引用。如果该变量声明在任何块或方法内部，它是一个局部变量，不会初始化为\
  \ `null`；但如果它声明在类中，它将是一个实例变量并自动初始化为 `null`。\n\n### 分配内存\n在 Java 中，通过 `new` 运算符动态分配内存。`s1\
  \ = new Student();` 在上面的示例中，`new` 运算符将为 `Student` 类对象分配内存并返回其引用，然后赋值给引用变量 `s1`。它还会调用默认构造函数来初始化成员变量。上述两个语句可以合并：`s1\
  \ = new Student();`\n\n**注意 1：** `new` 在运行时为对象分配内存。如果 `new` 无法分配内存（因为内存有限），它会产生运行时异常/错误。\n\
  \n**注意 2：** 如果仅将一个引用变量赋值给另一个引用变量，只会传递地址。不会有任何对象的拷贝。例如，如果我们创建另一个变量 `s2` 然后执行 `s1\
  \ = s2`，这不会创建重复的对象，`s1` 和 `s2` 指向同一个对象。在 `s2` 中做的任何更改都会反映在 `s1` 中。这种赋值不进行内存分配。若干步后，如果我们为\
  \ `s1` 赋值 `null`，该对象不会被销毁，因为 `s2` 还引用。但如果 `s1` 和 `s2` 都被赋值为 `null`，该对象将被垃圾回收器销毁，其占用的内存将被释放。\n\
  \n### 示例 5.1 成员变量的类\n\n```java\nclass A {\n    int x;\n    int y;\n}\n\nclass ClassTest\
  \ {\n    public static void main(String args[]) {\n        A a1, a2; // 引用变量\n \
  \       a1 = new A(); // 对象创建\n        a2 = new A();\n        a1.x = 10;\n     \
  \   a1.y = 20;\n        a2.x = 5;\n        a2.y = 6;\n        System.out.println(a1.x\
  \ + \"\\t\" + a1.y);\n        System.out.println(a2.x + \"\\t\" + a2.y);\n    }\n\
  }\n```\nOutput:\n```\n10  20\n5   6\n```\n\n### 示例 5.2 成员变量与方法的类\n\n```java\nclass\
  \ A {\n    private int x;\n    private int y;\n    void setdata(int x1, int y1)\
  \ {\n    }\n}\n```\n\n\n\n\n\n```java\n7. x = x1;\n8. y = y1;\n9. }\n10. void display()\n\
  11. {\n12. System.out.println(x + \"\\t\" + y);\n13. }\n14. }\n15. class ClassTest2\n\
  16. {\n17. public static void main(String args[])\n18. {\n19. A a1 = new A();\n\
  20. A a2 = new A();\n21. //a1.x=10; 因为 x 是私有的，所以报错\n22. a1.setdata(10,20);\n23.\
  \ a2.setdata(5,7);\n24. a1.display();\n25. a2.display();\n26. }\n```\n输出:\n```\n\
  0\t20\n5\t7\n```\n注- 我们也可以在类外部声明类的对象，也可以在类内部。\n\n### 示例：在类内部定义类的对象\n\n```java\n\
  class A {\n    private int x;\n    private int y;\n    void setdata(int x1, int\
  \ y1) {\n        x = x1;\n        y = y1;\n    }\n    void display() {\n       \
  \ System.out.println(x + \"\\t\" + y);\n    }\n    public static void main(String\
  \ args[]) {\n        A a1 = new A();\n        A a2 = new A();\n        a1.setdata(10,20);\n\
  \        a2.setdata(5,7);\n        a1.display();\n        a2.display();\n    }\n\
  }\n```\n输出:\n```\n10\t20\n5\t7\n```\n\n### 类成员的修饰符 / 可见性标签\n\n可见性修饰符适用于类的成员而不适用于局部变量。\n\
  \n- `private`：如果在变量或方法上指定 `private` 修饰符，则该成员将无法在声明它的类之外访问。这将类的成员对其他类隐藏。\n- `public`：如果在变量或方法上指定\
  \ `public` 修饰符，则该成员对所有类可见。该成员可以在包外部被访问，因为 `main()` 方法是由 JVM 访问的，而 JVM 位于定义 `main()`\
  \ 的类之外。\n- `protected`：声明为 `protected` 的成员可以被属于同一个包的所有类访问。受保护成员也可以被其他包中的任何类访问。\n\
  - `default` / 无修饰符：如果在成员声明之前没有指定可见性修饰符，则该成员可以被同包内的所有类访问。该成员无法在包之外访问。\n\n### 类或接口的修饰符\n\
  \n- `public`：如果一个类需要忽略其包限制对所有类可见，则必须通过指定 `public` 修饰符将其为 `public`。\n- `default`\
  \ / 无修饰符：如果在类之前没有任何访问/可见性修饰符，则它的可见性仅限于定义它的包（类组）内。\n\n### this\n\n`this` 是一个引用变量，存储当前用于调用方法的对象的引用。在运行时，`this`\
  \ 的引用会被调用对象的引用所替换。有时，方法需要引用调用它的对象。这可以通过 `this` 的帮助来实现。`this` 可以用于任何方法内部以引用当前对象。注意：局部变量会隐藏实例变量，所以我们必须显式地使用\
  \ `this`。\n\n### 实例变量隐藏\n\n众所周知，在 Java 中在相同或嵌套的作用域内声明两个同名的变量是非合法的。但我们可以让局部变量（方法的参数）与类的实例变量具有相同的名称。当局部变量与实例变量同名时，局部变量会隐藏实例变量。但\
  \ `this` 允许即使在局部变量隐藏它的情况下我们也能引用实例变量。\n\n### 示例 5.4 this 的使用\n\n```java\nclass A\
  \ {\n    private int x;\n    private int y;\n    void setdata(int x, int y) {\n\
  \        this.x = x; //this.x 是类成员，而 x 是局部变量\n        this.y = y;   \n    }\n  \
  \  void display() {\n        System.out.println(x + \"\\t\" + y);\n    }\n}\nclass\
  \ Class4 {\n    public static void main(String args[]) {\n        A a1 = new A();\n\
  \        A a2 = new A();\n        a1.setdata(10,20);\n        a2.setdata(5,7);\n\
  \        a1.display();\n        a2.display();\n    }\n}\n```\n输出:\n```\n10\t20\n\
  5\t7\n```\n\n### 方法重载\n\n只要方法在参数数量、参数类型或参数顺序上有所不同，我们就可以拥有多个同名方法。这被称为方法重载。在调用重载方法时，传递的实际参数类型可能与任何重载方法的正式参数不完全匹配。在这种情况下，参数将提升到下一个更高的类型，直到找到匹配项。如果在提升参数后仍找到匹配，则会发生编译错误。\n\
  \n### 示例 5.5 在此示例中，有两个同名的 `setdata()` 方法但参数不同，因此这就是方法重载。\n\n```java\nclass A {\n\
  \    private int x,y;\n    void setdata(int x1) {\n        x = y = x1;\n    }\n\
  \    void setdata(int x1, int y1) {\n        x = x1;\n        y = y1;\n    }\n \
  \   void display() {\n        System.out.println(x + \"\\t\" + y);\n    }\n}\nclass\
  \ Test5 {\n    public static void main(String args[]) {\n        A a1 = new A();\n\
  \        a1.setdata(5);\n        a1.display();\n        A a2 = new A();\n      \
  \  a2.setdata(10,20);\n        a2.display();\n    }\n}\n```\n输出:\n```\n5\t5\n10\t\
  20\n```\n\n\n\n\n\n构造函数的语法与实例方法非常相似。它们的名称与类名相同，且没有返回类型。\n\n这是因为类构造函数的隐式返回类型是类本身。构造函数可以像方法一样进行重载。\n\
  \n当使用 `operator new` 创建类的实例/对象时，`JVM` 会为对象分配内存，然后将实例变量初始化为默认初始值，最后调用相应的构造函数来初始化实例变量。\n\
  \n### 注意\n`constructor`（构造函数）这个名字有点误导。看起来似乎构造函数的目的是创建对象/实例。但实际上在调用构造函数之前，对象已经创建，且实例变量和静态变量已经初始化为它们的默认初始值。\n\
  \n因此，构造函数的目的是用非默认值的值来初始化实例变量。\n\n### 构造函数的类型\n\n- **默认构造函数 (Default Constructor)**：每个类都有一个默认构造函数（如果没有定义显式构造函数），该函数不接受任何参数，且方法体不包含任何语句。编译器会自动生成默认构造函数。\n\
  \n一旦我们添加了自己的构造函数，编译器就会停止生成默认构造函数。当我们不在类中创建任何构造函数时，`JVM` 将创建默认构造函数，并将实例变量初始化为默认值\
  \ `null` 或 `zero`。\n\n#### 示例 5.6 默认构造构造的使用\n```java\nclass A {\n    private int\
  \ x;\n    private int y;\n    void display() {\n        System.out.println(x + \"\
  \\t\" + y);\n    }\n}\nclass ClassTest6 {\n    public static void main(String args[])\
  \ {\n        A a1 = new A();\n        a1.display();\n    }\n}\n```\n**输出:**\n```\n\
  0       0\n```\n注意:-在这里我们没有创建任何构造函数，`JVM` 在创建对象后会自动创建默认构造函数，并用 `0` 或 `null` 初始化实例变量。\n\
  \n- **默认零参数构造函数 (Default Zero argument constructors)**：我们可以用自己的零参数构造函数替换默认构造函数。这将允许我们将实例变量初始化为任何值。\n\
  \n- **参数化构造函数 (Parameterized Constructors)**：带有参数的构造称为参数化构造函数。\n\n注意-构造函数可以像方法一样重载。这被称为构造函数重载。\n\
  \n#### 示例 5.7 构造函数的使用\n```java\nclass A {\n    private int x;\n    private int y;\n\
  \    A() //零参数构造函数 {\n        x = y = 0;\n    }\n    A(int x1) //参数化单参数构造函数 {\n\
  \        x = x1;\n    }\n    A(int x1, int y1) //参数化双参数构造函数 {\n        x = x1;\n\
  \        y = y1;\n    }\n    void display() {\n        System.out.println(x + \"\
  \\t\" + y);\n    }\n}\nclass ClassTest7 {\n    public static void main(String args[])\
  \ {\n        A a1 = new A();\n        a1.display();\n        A a2 = new A(5);\n\
  \        a2.display();\n        A a3 = new A(4,7);\n        a3.display();\n    }\n\
  }\n```\n**输出:**\n```\n0       0\n5\n4       7\n```\n\n#### 示例 5.8\n```java\nimport\
  \ java.util.Scanner;\nclass Complex {\n    private int real,imag;\n    Complex()\
  \ //零参数构造函数 {\n        real=imag=0;\n    }\n    Complex(int real, int imag) {\n\
  \        this.real=real;\n        this.imag=imag;\n    }\n    void getdata() {\n\
  \        Scanner sc=new Scanner(System.in);\n        System.out.print(\"Enter real\"\
  );\n        real=sc.nextInt();\n        System.out.print(\"Enter imag\");\n    \
  \    imag=sc.nextInt();\n    }\n    void display() {\n        if(imag>=0)\n    \
  \        System.out.println(real+\"\"+imag+\"i\");\n        else\n            System.out.println(real+\"\
  \"+imag+\"i\");\n    }\n    Complex sum(Complex c) {\n        Complex t=new Complex();\n\
  \        t.real=real+c.real;\n        t.imag=imag+c.imag;\n        return t;\n \
  \       or return Complex(real+c.real,imag+c.imag);\n    }\n    Complex mult(Complex\
  \ c) {\n        Complex t=new Complex();\n        t.real=real*c.real-imag*c.imag;\n\
  \        t.imag=real*c.imag+imag*c.real;\n        return t;\n    }\n    public static\
  \ void main(String args[]) {\n        Complex c1=new Complex();\n        Complex\
  \ c2=new Complex();\n        Complex c3=null;\n        c1.display();\n        c2.display();\n\
  \        c3=c1.sum(c2);\n        System.out.print(\"Sum is \");\n        c3.display();\n\
  \        c4=c1.mult(c2);\n        System.out.print(\"Product is \");\n        c4.display();\n\
  \    }\n}\n```\n\n### finalize () 方法\n有时对象在被销毁时需要执行某些操作。例如，如果一个对象持有某些非 Java 资源（如文件句柄），我们可能希望在对象被销毁之前释放这些资源。\n\
  \n\n\n\n为了处理此类情况，Java 提供了一种名为“终化”（finalization）的机制。通过使用终化，我们可以定义在对象即将被垃圾回收器回收时执行的特定操作。`finalize()`\
  \ 仅在垃圾回收之前被调用。它不会在对象超出作用域时被调用。在 C++ 中，使用析构函数的概念来实现终化处理，但它与 Java 中的 `finalize()`\
  \ 并不完全相同。\n\n```java\nprotected void finalize() {\n    // 在此处编写终化代码。\n}\n```\n\n\
  **注意**：除了使用 `protected` 修饰符外，我们也可以使用 `public`。\n\n## 变量类型\n\nJava 有三种变量：\n\n###\
  \ 1. 实例变量 (Instance variables)\n在类中声明且位于所有成员方法之外的变量称为实例变量。该变量的副本数量与对象的数量相相等。\n\n\
  在 Java 中不需要对实例变量进行初始化，因为这些变量在对象创建并使用 `new` 操作符分配内存时就会被初始化。\n\n变量根据其类型进行初始化。所有的数值变量都自动初始化为\
  \ `0`，`Boolean` 变量初始化为 `false`，引用变量（对象）则初始化为 `null` 值。\n\n我们可以通过对象名和点（`.`）运算符（`对象引用变量.实例变量名`）来访问这些变量。我们不能像\
  \ C/C++ 那样使用 `->` 运算符来分隔对象引用变量和实例变量。\n\n### 2. 局部变量 (Local Variables)\n在方法内部声明的变量称为局部变量。它与实例变量不同。局部没有没有初始化。\n\
  \n### 3. 静态变量 (Static Variables)\n静态变量像实例变量一样在方法/块之外声明。但静态变量在数据类型之前使用了 `static`\
  \ 修饰符。静态变量对于类及其实例（对象）来说都是全局的。\n\n它们对于跟踪全局状态非常有用。例如，类中的静态变量 `count` 可以存储程序在任何时刻创建的该类实例/对象的数量。\n\
  \n对象之间可以使用静态变量进行通信，就像 C 函数通过全局变量进行通信一样。对于静态变量，无论程序中创建了多少实例/对象，该变量只有一份拷贝，并且被所有实例共享。\n\
  \n点（`.`）运算符也用于访问类变量，但我们也可以使用类名或对象名访问静态变量。如果我们为不同的对象声明，它们都将指向静态变量的同一个拷贝。\n\n静态变量在类加载/使用时会根据其默认值（零、false\
  \ 或 null）自动初始化。\n\n它们只能调用其他静态方法。它们必须只能访问静态数据。它们不能以任何方式引用 `this` 或 `super`。（`super`\
  \ 关键字与继承有关，稍后会描述。）\n\n### 示例 5.9\n```java\nclass A {\n    int x;           //实例变量\n\
  \    static int y;   //静态变量或类变量\n}\n\nclass ClassTest8 {\n    public static void\
  \ main(String args[]) {\n        A a1 = new A();\n        A a2 = new A();\n    \
  \    A a3 = new A();\n        a1.x = 10;\n        a1.y = 20;\n        a2.x = 11;\n\
  \        a2.y = 21;\n        a3.x = 12;\n        a3.y = 22;\n        System.out.println(a1.x\
  \ + \"\\t\" + a1.y);\n        System.out.println(a2.x + \"\\t\" + a2.y);\n     \
  \   System.out.println(a2.x + \"\\t\" + a3.y);\n    }\n}\n```\n**输出：**\n```\n10\
  \  22\n11  22\n12  22\n```\n\n## 方法类型\n\n1. 实例方法\n2. 静态方法\n\n### 实例方法\n这些方法类似于 C++\
  \ 函数。实例方法只能通过对象调用。如果在类的静态方法中调用实例方法，则必须使用对象名。\n\n### 静态方法\n静态方法可以使用对象名或类名调用。静态方法只能访问静态成员。在类的静态方法中，静态方法可以直接调用（无需对象或类名）。\n\
  \n### 示例 5.10\n```java\nclass A {\n    int x;\n    static int y;\n    static int\
  \ sum(int a, int b) {\n        y = 5; // 静态方法访问静态变量\n        // x = 0; 错误：静态方法无法访问实例变量\n\
  \        // this.x = 10; 错误：静态方法无法访问 this 或 super\n        return a + b;\n    }\n\
  \    float avg(int a, int b) {\n        return (float)(a+b)/2;\n    }\n}\n\nclass\
  \ ClassTest9 {\n    public static void main(String args[]) {\n        System.out.println(A.sum(5,6));\
  \ // 通过类名调用静态方法\n        System.out.println(A.avg(5,6));\n        A a1 = new A();\n\
  \        System.out.println(a1.sum(5,6)); // 通过对象调用静态方法\n    }\n}\n```\n**输出：**\n\
  ```\n1\n5\n```\n\n###块用于初始化类的实例变量，静态块用于初始化类的静态变量。但构造函数会在这些块之后调用。\n\n#### 示例 5.1\n\
  ```java\nclass A {\n    int x;\n    static int y;\n    {\n        // 初始化实例变量的块\n\
  \        x = 10;\n    }\n    static {\n        // 初始化静态变量的静态块\n        y = 5;\n\
  \    }\n}\n\nclass ClassTest10 {\n    public static void main(String args[]) {\n\
  \        A a1 = new A();\n        System.out.println(a1.x + \"\\t\" + a1.y);\n \
  \   }\n}\n```\n**输出：**\n```\n10  5\n```\n\n### Final 变量 (Final Variables)\n如果一个变量被声明为\
  \ `final`，则我们不能改变它的值（`final PI=3.14;`）。final 变量不单独占用内存。final 变量是常量变量，其值不能改变。final\
  \ 引用类型变量不能改变其引用。\n\n### 示例 5.12\n```java\nclass A {\n    void m1() {\n        System.out.println(\"\
  Inside m1()\");\n    }\n}\n\nclass ClassTest11 {\n}\n```\n\n\n\n\n\n```java\npublic\
  \ static void main(String args[])\n{\n    final int x=10; //can not change\n   \
  \ final int y;    // Variable y not initialized so we can initialize y later\n \
  \   y=20;           // Now y is initialize so after this we can’t change its value\n\
  \    // y=30;         Error\n    System.out.println(x);\n    System.out.println(y);\n\
  \    final A a1=new A();  // a1 is a constant reference so we can not\n    // assign\
  \ reference of any other object in f1.\n    a1.m1();\n    A a2 = new A();\n    //\
  \ a1 = a2;  error\n}\n```\nOutput: 10\n20\n\n`m1()`内部\n\n### 参数传递机制-\n\n1. 值传递（Call\
  \ by Value）。\n2. 引用传递（Call by reference）。\n\n当基本类型（`int`、`float`、`long` 等）传递给方法时，使用的是值传递方法。对于对象，实际传递的是对象引用。\n\
  \n对象引用也是通过值传递方式传递的。然而，由于传递的值引用一个对象，因此该值的拷贝仍然指向与其对应的参数相同的对象。\n\n例如，如果我们将一个存储对象引用的变量\
  \ `a1` 传递给函数，并在函数中将 `a2` 作为形式参数，那么 `a1` 和 `a2` 都指向同一个对象。\n\n通过 `a2` 对对象值进行的任何更改也将反映在\
  \ `a1` 中。但如果我们为 `a2` 赋值一个新的引用，那么该引用不会自动复制到 `a1` 中。\n\n### 示例 5.13\n\n```java\nclass\
  \ Box\n{\n    private int feet;\n    private int inches;\n    Box()\n    {\n   \
  \     feet = 0;\n    }\n    Box(int feet, int inches)\n    {\n        this.feet\
  \ = feet;\n        this.inches = inches;\n    }\n    void display()\n    {\n   \
  \     System.out.println(\"Feet is \" + feet +\"\\n\" + \"Inches is \" +inches);\n\
  \    }\n    void swap(Box obj)\n    {\n        int t;\n        t = feet;\n     \
  \   feet = obj.feet;\n        obj.feet = t;\n\n        t = inches;\n        inches\
  \ = obj.inches;\n        obj.inches = t;\n    }\n}\nclass ClassTest12\n{\n    public\
  \ static void main(String args[])\n    {\n        Box b1 = new Box(5,6);\n     \
  \   Box b2 = new Box(7,4);\n        b1.swap(b2); //对象通过引用传递对象。\n        b1.display();\n\
  \        b2.display();\n    }\n}\n```\nOutput:\nFeet is 7\nInches is 4\nFeet is\
  \ 5\nInches is 6\n\n# 嵌套类与内部类-\n\n可以在类内部定义另一个类；此类类被称为嵌套类。嵌套类的范围受其外部类范围的限制。\n\n嵌套类可以访问其所嵌套类中的成员，包括该类的私有成员。然而，外部类无法访问嵌套类的成员。\n\
  \n嵌套类有两种类型：静态（static）和非静态（non static）。静态嵌套类是应用了 `static` 修饰符的类。由于它是静态的，它必须通过对象来访问其外部类的成员。也就是说，它不能直接引用外部类的成员。由于这种限制，静态嵌套类很少被使用。\n\
  \n非静态嵌套类可以访问其外部类的所有变量和方法，并可以像外部类的其他非静态成员一样直接引用它们。\n\n### 示例 5.14\n\n```java\nclass\
  \ Outer\n{\n    class Inner\n    {\n        int member_inner=7;\n        Inner()\n\
  \        {\n            member_outer = 5;\n            System.out.println(member_outer);\n\
  \        }\n    }\n    private int member_outer;\n    Outer()\n    {\n        //\
  \ member_inner = 9;  error\n        Inner obj = new Inner();\n        System.out.println(obj.member_inner);\n\
  \    }\n}\nclass ClassTest13\n{\n    public static void main(String args[])\n  \
  \  {\n        Outer out_obj = new Outer();\n    }\n}\n```\nOutput:\n5\n7\n\n###\
  \ 示例 5.15:\n\n```java\nclass Outer\n{\n    static class Inner\n    {\n        int\
  \ member_inner=7;\n        Inner()\n        {\n            // member_outer = 5;\n\
  \            // System.out.println(member_outer); error\n            Outer obj =\
  \ new Outer();\n            obj.member_outer = 5;\n            System.out.println(obj.member_outer);\n\
  \        }\n    }\n    private int member_outer;\n    void prn()\n    {\n      \
  \  Inner obj = new Inner();\n        System.out.println(obj.member_inner);\n   \
  \ }\n}\nclass ClassTest14\n{\n    public static void main(String args[])\n    {\n\
  \        Outer out_obj = new Outer();\n        out_obj.prn();\n    }\n}\n```\nOutput:\n\
  5\n7\n\n### 示例 5.16:\n\n```java\nimport java.util.Random;\nclass RandomTest\n{\n\
  \    public static void main(String args[])\n    {\n        Random r1 = new Random();\n\
  \        for(int i=1;i<=10;i++)\n        {\n            System.out.println(Math.abs(r1.nextInt()));\n\
  \        }\n    }\n}\n```\n\n## 理论题\n\n1. 如果我们希望一个成员变量在当前类之外完全不可访问，在声明变量时变量名前应该加上什么关键字？\n\
  2. 在 Java 中，对象/值是如何传递的？\n3. 考虑以下代码：\n```java\npublic static void main(String args[])\n\
  {\n    int a = 5;\n    System.out.println( cube( a ) );\n}\n\nint cube( int theNum\
  \ )\n{\n    return theNum * theNum * theNum;\n}\n```\n解释 `static` 关键字的重要性\n\n当我们尝试编译并运行这段代码时会发生什么？\n\
  \n\n\n\n\na) 它无法编译，因为 `cube` 在 `java.lang.Math` 类中已经定义。\n\nb) 它无法编译，因为 `cube` 不是静态的（static）。\n\
  \nc) 它可以编译，但会抛出 `arithmetic exception`（算术异常）。\n\nd) 它将完美运行并在标准输出中打印 \"125\"。\n\n\
  4. `static` 内部类是什么意思？它与其他任何静态成员有什么区别？\n\n5. 我们如何在 `java` 中声明常量值？\n\n6. \"final\"\
  \ 关键字的含义是什么？\n\n7. 什么是类变量？\n\n答案：\n\n当我们创建一个同类的多个对象时，每个对象都将共享变量的公共副本。这意味着无论从该类创建了多少个对象，每个类都只有一个副本。类变量或\
  \ `static` 变量在类中使用 `static` 关键字声明。\n\n这些变量存储在静态内存中。类变量主要用于常量，即其初始值永远改变的变量。静态变量总是通过类名进行调用。\n\
  \n该变量在程序启动时创建，即它在通过 `new` 运算符创建类的实例之前就已经创建了，并在程序停止时被销毁。类变量的作用范围与实例变量相同。\n\n类变量可以在类级别的任何地方使用\
  \ `static` 关键字定义。它的初始值与实例变量相同。当类变量被定义为 `int` 时，其默认值为零；当声明为 `boolean` 时，其默认值为 `false`；对象引用为\
  \ `null`。类变量与类关联，而不是与任何对象关联。\n\n8. 解释垃圾回收。\n\n答案：垃圾回收是 Java 最重要的特性之一。垃圾回收称为自动内存管理，因为\
  \ `JVM` 会自动从内存中移除未使用的变量/对象（值为 `null`）。用户程序无法直接从内存中释放对象，相反，由垃圾回收器自动释放不再被程序引用的对象。\n\
  \n每个类都从 `java.lang.Object` 继承 `finalize()` 方法，当垃圾回收器确定不再有对对象的引用时，就会调用 `finalize()`\
  \ 方法。\n\n在 Java 中，当变量不再使用时，显式地将其赋值 `null` 是一个好习惯。在 Java 中，调用 `System.gc()` 和 `Runtime.gc()`\
  \ 时，`JVM` 会尝试回收未使用的对象，但无法保证所有对象何时会被垃圾回收。\n\n9. 如果一个类有多个构造函数，我们可以从一个构造函数调用另一个吗？\n\
  \n可以。使用 `this()` 从另一个构造函数调用构造函数。\n\n10. 构造函数和普通方法之间的区别是什么？\n\n构造函数的名称必须与类相同，且不能返回值。它们只被调用一次，而普通方法可以被调用多次，并且可以返回值或为\
  \ `void`。\n\n11. 我们如何强制执行垃圾回收？\n\n垃圾回收是自动过程，无法强制执行。我们可以通过调用 `System.gc()` 来请求它。`JVM`\
  \ 不保证 GC 会立即启动。\n\n12. 下列叙述是不正确的。\n\n(a) `Java` 中的局部变量总是由默认值初始化的。\n\n(b) `Java`\
  \ 中的局部变量在使用之前必须初始化。\n\n(c) 内部块中的局部变量不能与外部块中的局部变量同名。\n\n(d) 同一层级的两个块中的局部变量可以同名。\n\
  \n![11](img/00005.jpeg) ![11](img/00005.jpeg) ![11](img/00005.jpeg) ![11](img/00005.jpeg)\
  \ ![11](img/00005.jpeg)\n\n![STAR-LOGO-2013](img/00006.jpeg)\n\n# 第 6 章\n## (继承)\n\
  \n## 引言\n\n当一个类的属性转移到另一个类时，被称为继承。这样，被继承的类被称为超类、基类或父类，而继承类被称为子类、子类或派生类。\n\n继承允许我们通过添加额外功能来扩展现有类（基类）。它鼓励代码重用，有助于减少代码量，尽管在某些情况下可能会导致复杂性。\n\
  \n例如，如果我们完成了简单计算器的代码。之后我们需要开发科学计算器，我们有两种方案：\n(i) 创建一个新类。（重写类）\n(ii) 扩展该类。\n\n在大多数情况下，第二种方案是更好的选择。在这种，我们只需要编写小段代码。同时，我们不需要花费大量时间进行调试和测试，因为基类已经过过测试并且使用了很久。当我们需要将一个类继承到另一个类时，必须使用\
  \ `extends` 关键字。\n\n语法：`class sub_class extends base_class`\n\n类 A（超类或基类或父类）。类 B（子类或派生类或子类）。子类将拥有基类的所有特征，加上在扩展类中定义的新特征。Java\
  \ 不支持多继承，但支持多接口，所以子类只继承一个基类。\n\n#### 示例 6.1\n\n```\nclass A {\n    int x;\n    void\
  \ setX(int x1) {\n        x = x1;\n    }\n    void displayX() {\n        System.out.println(x);\n\
  \    }\n}\n\nclass B extends A {\n    int y;\n    void setY(int y1) {\n        y\
  \ = y1;\n    }\n    void displayY() {\n        System.out.println(y);\n    }\n}\n\
  \nclass InheritTest {\n    public static void main(String args[]) {\n        A a1\
  \ = new A(); // 4 字节\n        a1.setX(5);\n        a1.displayX();\n\n        B b1\
  \ = new B(); // 8 字节\n        b1.setX(10);\n        b1.setY(20);\n        b1.displayX();\n\
  \        b1.displayY();\n    }\n}\n```\n\n输出：\n```\n5\n10\n20\n```\n\n##### 成员隐藏\n\
  \n如果子类成员与超类成员具有相同的名称（对于方法来说还具有相同的签名/参数），那么它会隐藏超类成员。\n\n虽然两个成员在子类中可能都是可用的，但使用成员名时只能访问子类成员，因为它隐藏了超类中的同名成员。\n\
  \n##### 使用 super 关键字\n\n每当子类需要引用其直接父类时，可以通过 `super` 关键字来实现。`super` 有两种通用用途：\n\n\
  1. 调用超类的构造器\n\n子类可以通过以下 super 形式调用其超类定义的构造器方法：`super (parameter-list);`\n\n在这里，`parameter-list`\
  \ 指定了超类构造器所需的参数。实际上，`super()` 总是子类构造器内部执行的第一条语句。\n\n2. 访问被子类成员隐藏的超类成员。\n\n可以使用以下方式访问超类的被隐藏成员：\n\
  \n`super.member;`\n\n\n\n\n\n在这里，成员可以是方法也可以是数据成员。\n\n## 方法重载与方法重写\n\n### 方法重载\n\
  当两个或多个方法具有相同名称但参数不同时，被称为方法重载。当对象需要执行相似的任务但使用不同的输入参数时，就会使用方法重载。\n\n当我们调用一个方法时，Java\
  \ 会首先匹配方法名，然后匹配参数的数量和类型。决定调用哪一个方法定义被称为多态。\n\n### 方法重写\n我们已经看到，超类中的方法被其子类继承，并由子类创建的对象使用。方法继承允许我们在子类中重复定义和使用方法，而无需在子类中再次定义该方法。\n\
  \n在类层次结构中，当子类中的实例方法与其超类中的实例方法（非私有）具有相同的签名时，则子类中的方法被重写了超类中的方法。\n\n当从子类内部调用被重写的方法时，它将始终引用子类定义的该方法版本。超类定义的方法版本将被隐藏。\n\
