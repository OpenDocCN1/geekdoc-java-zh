  \n\n\n\n\n## AdjustmentListener 接口\n\n这是用于接收调整事件的监听接口。\n\n| 返回类型 | 方法 | 说明 |\n|\
  \ :--- | :--- | :--- |\n| `void` | `actionPerformed(ActionEvent e)` | 当发生动作时调用。\
  \ |\n| `void` | `adjustmentValueChanged(Adjustment e)` | 当滑块/滑动条的值改变时调用。 |\n\n##\
  \ ContainerListener 接口\n\n这是用于接收组件被添加到容器或从容器中移除时产生事件的监听接口。\n\n### 方法\n\n| 返回类型 |\
  \ 方法 | 说明 |\n| :--- | :--- | :--- |\n| `void` | `componentAdded(containerEvent e)`\
  \ | 当组件被添加到容器时调用。 |\n| `void` | `componentRemoved(containerEvent e)` | 当组件从容器中移除时调用。\
  \ |\n\n### FocusListener 接口\n\n这是用于接收组件获得或失去焦点时事件的监听接口。\n\n### 方法\n\n| 返回类型 | 方法\
  \ | 说明 |\n| :--- | :--- | :--- |\n| `void` | `focusGained(focusEvent e)` | 当组件获得键盘焦点时调用。\
  \ |\n| `void` | `focusLost(focusEvent e)` | 当组件失去键盘焦点时调用。 |\n\n### ItemListener\
  \ 接口\n\n这是用于接收项目状态事件的监听接口。\n\n### 方法\n\n| 返回类型 | 方法 | 说明 |\n| :--- | :--- | :---\
  \ |\n| `void` | `itemStateChanged(ItemEvent e)` | 当用户选中或取消选择某个项目时调用。 |\n\n## keyListener\
  \ 接口\n\n这是用于接收键盘事件（按键输入）的监听接口。\n\n| 返回类型 | 方法 | 说明 |\n| :--- | :--- | :--- |\n|\
  \ `void` | `keyPressed(KeyEvent e)` | 当按键被按下时调用。 |\n| `void` | `keyReleased(KeyEvent\
  \ e)` | 当按键被释放时调用。 |\n| `void` | `keyTyped(KeyEvent e)` | 当按键被输入（按下并释放）时调用。 |\n\n\
  ## MouseListener 接口\n\n这是用于接收组件上鼠标事件（按下、释放、点击、进入和退出）的监听接口。\n\n### 方法\n\n| 返回类型 |\
  \ 方法 | 说明 |\n| :--- | :--- | :--- |\n| `void` | `mouseClicked(MouseEvent e)` | 当组件上的鼠标按钮被点击（按下并释放）时调用。\
  \ |\n| `void` | `mouseEntered(MouseEvent e)` | 当鼠标进入组件时调用。 |\n| `void` | `mouseExited(MouseEvent\
  \ e)` | 当鼠标离开组件时调用。 |\n| `void` | `mousePressed(MouseEvent e)` | 当组件上的鼠标按钮被按下时调用。\
  \ |\n| `void` | `mouseReleased(MouseEvent e)` | 当组件上的鼠标按钮被释放时调用。 |\n\n## MouseMotionListener\
  \ 接口\n\n这是是用于接收组件上鼠标移动事件（移动和拖动）的监听接口。\n\n### 方法\n\n| 返回类型 | 方法 | 说明 |\n| :--- |\
  \ :--- | :--- |\n| `void` | `mouseDragged(MouseEvent e)` | 当组件上的鼠标按钮被按下并进行拖动时调用。\
  \ |\n| `void` | `mouseMoved(MouseEvent e)` | 当鼠标指针在组件上移动但未按下按钮时调用。 |\n\n## MouseWheelListener\
  \ 接口\n\n这是是用于接收组件上鼠标轮事件的监听接口。\n\n### 方法\n\n| 返回类型 | 方法 | 说明 |\n| :--- | :--- | :---\
  \ |\n| `void` | `mouseWheelMoved(MouseEvent e)` | 当鼠标轮滚动时调用。 |\n\n## WindowListener\
  \ 接口\n\n当窗口的状态由于打开、关闭、激活或去激活、最小化或恢复最小化而发生时，监听器对象中的相关方法会被调用，并将 `windowevent` 传递给它。\n\
  \n### 方法\n\n| 返回类型 | 方法 | 说明 |\n| :--- | :--- | :--- |\n| `void` | `windowActivated(WindowEvent\
  \ e)` | 当窗口被设置为活动窗口时调用。 |\n| `void` | `windowClosed(WindowEvent e)` | 当调用窗口的 `dispose`\
  \ 方法导致窗口关闭时调用。 |\n| `void` | `windowClosing(WindowEvent e)` | 当用户尝试从窗口菜单关闭窗口时调用。\
  \ |\n| `void` | `windowDeactivated(WindowEvent e)` | 当窗口不再是活动窗口时调用。 |\n| `void`\
  \ | `windowIconified(WindowEvent e)` | 当窗口变为最小化状态时调用。 |\n| `void` | `windowDeiconified(WindowEvent\
  \ e)` | 当窗口从最小化恢复到普通状态时调用。 |\n| `void` | `windowOpened(WindowEvent e)` | 当窗口第一次变为可见时调用。\
  \ |\n\n### 处理事件\n\n以下示例解释了如何处理点击按钮生成的 `ActionEvent`。\n\n```java\nimport java.awt.*;\n\
