  \ tc.c = d;\n        return tc;\n    }\n}\n\nclass CloneDemo {\n    public static\
  \ void main(String arg[]) throws CloneNotSupportedException {\n        TestDeepClone\
  \ tc1 = new TestDeepClone();\n        TestDeepClone tc2;\n    }\n}\n```\n\n\n\n\n\
