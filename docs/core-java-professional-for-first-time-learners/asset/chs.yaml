  \n### 示例 16.9 使用 Applet 计算两个数字之和\n```java\nimport java.applet.*;\n```\n\n\n\n\n\
  ```java\nimport java.awt.*;\nimport java.awt.event.*;\n/*<applet code = \"SumApplet\"\
  \ width=400 height=400></applet> */\npublic class SumApplet extends Applet implements\
  \ ActionListener {\n    TextField tf1,tf2,tf3;\n    Label l1,l2,l3;\n    Button\
  \ b1;\n\n    public void init() {\n        setLayout(new GridLayout(4,2));\n   \
  \     l1 = new Label(\"No. 1\");\n        l2 = new Label(\"No. 2\");\n        l3\
  \ = new Label(\"Result\");\n        tf1 = new TextField(8);\n        tf2 = new TextField(8);\n\
  \        tf3 = new TextField(8);\n        b1 = new Button(\"Sum\");\n        b1.addActionListener(this);\n\
  \        add(l1);add(tf1);\n        add(l2);add(tf2);\n        add(l3);add(tf3);\n\
  \        add(b1);\n    }\n\n    public void actionPerformed(ActionEvent ae) {\n\
  \        Button abc = (Button)ae.getSource();\n        if(abc == b1) {\n       \
  \     int a,b,c;\n            a = Integer.parseInt(tf1.getText());\n           \
  \ b = Integer.parseInt(tf2.getText());\n            c = a + b;\n            tf3.setText(String.valueOf(c));\n\
  \        }\n    }\n}\n```\n\n\n\n在 Java 中可以使用绝对定位，但并不建议这样做。`AWT` 的设计目标是使用相对定位。我们可以通过相对规格来指定组件布局，例如：组件将添加到上一个组件的右侧、组件将添加到其他组件的下方、组件将出现在顶部、组件的大小将是容器宽度的\
  \ 1/4 等。即使在不知道组件尺寸的情况下，这些规格也非常有用。\n\nJava 鼓励使用相对定位，因为它是平台无关的，同样的 GUI 可以在不修改的情况下运行在各种平台上。\n\
  \n名为布局管理器（layout managers）的内置 Java 类负责将相对位置映射到实际/物理位置的任务。Java 支持许多类型的布局管理器，我们将讨论以下布局管理器：\n\
  \n1. `FlowLayout`\n2. `GridLayout`\n3. `BorderLayout`\n4. `CardLayout`\n5. `GridBagLayout`\n\
  \n### 使用布局管理器时的两个观察：\n\n- 我们不必再承担指定每个组件精确位置和尺寸的负担。\n- 我们不再拥有指定每个组件精确位置和尺寸的权力。\n\n\
  ### 为什么 Java 使用布局管理器？\n\n原因有两点：\n\n1. 理论上在于，精确布局（即以像素指定每个组件的大小和位置）是一项重复且经常执行的任务；因此，根据\
  \ OOP 的布局原则，布局功能应当被封装在一个或多个类中以自动化该任务。显然，布局管理器消除了大量的开发繁琐工作。许多程序员起初不喜欢布局管理器的想法，但随着繁琐选择的消除，他们越来越欣赏它们。\n\
  \n2. 使用布局管理器的实际原因源于 Java 的平台无关性。在 Java 中，`AWT` 组件的行为借自运行 `JVM` 的底层硬件的窗口系统。因此，在 Macintosh\
  \ 上，`AWT` 按钮工具就像任何其他 Mac 按钮一样；在 Motif 平台上，Java 按钮看起来就像任何其他 Motif 按钮，以此此类推。这里的问题在于，按钮和其他组件在不同平台上实例化时具有不同的尺寸。如果\
  \ Java 鼓励精确的像素级尺寸和定位，那么会有大量的 Java GUI 在其源平台上看起来精美，但在其他平台上看起来非常糟糕甚至无法使用。如上文所述，布局管理器通过使用相对定位解决了这个问题。\n\
  \n### 布局策略：\n\n每个 Java 组件都有一个首选尺寸（preferred size）。首选尺寸表示组件在不与布局管理器冲突的情况下希望有多大。首选尺寸通常是为以视觉上有意义的方式渲染组件所必需最小尺寸，例如，一个按钮的首选尺寸是其标签文本的大小，加上文本周围的一小圈空隙边框，再加上标记按钮边界的阴影装饰，因此按钮的首选尺寸是“恰好足够”。首选尺寸是取决于平台的，因为组件边界装饰随系统不同而异。\n\
  \n当布局管理器对其容器的子组件进行布局时，它必须在两个考量之间取得平衡：\n(i) 布局策略和\n(ii) 每个组件的首选尺寸\n\n首要任务是执行布局策略。如果尊重组件的首选尺寸意味着违反布局策略，则布局管理器将否决组件的首选尺寸。理解布局管理器意味着理解它将组件放在什么位置，以及它将如何处理组件的首选尺寸。\n\
  \n### 1. FlowLayout:\n\n流式布局管理器的功能封装在 `java.awt.FlowLayout` 类中。流式布局管理器将组件按水平行排列。它是面板（panels）和应用组件（applets）的默认布局管理器类型。\n\
  \n流式布局管理器尽可能将许多组件放入第一行，并将其他组件移动到第二行。如果第二行没有留出空间，组件将移动到第三行，依此类推。这与在文档中输入文本非常相似。当我们到达当前行尾时，下一个单词将移动到下一行，依此类推。如果我们更改文档的宽度或高度，整个文档将重新进行格式化。\n\
  \n组件始终按照它们被添加到容器的顺序从左到右出现。默认情况下，流式布局管理器在组件之间的水平和垂直方向上都留有五像素的间隙。这种默认值可以通过调用重载的 `FlowLayout`\
  \ 构造函数并传入所需的水平和垂直间隙来更改。\n\n在每一行内，组件间距均匀的，且组件簇是居中的。组件簇的对齐方式（有时称为“对齐”）可以通过向流式布局构造函数传递参数来控制。可能的取值有：\n\
  \n- `FlowLayout.LEFT`\n- `FlowLayout.CENTER`\n- `FlowLayout.RIGHT`\n\n**示例 17.1:**\n\
  \n```java\nimport java.awt.*;\nclass MyFrame1 {\n    public static void main(String\
  \ args[ ]) {\n        Frame f=new Frame( );\n        FlowLayout flow=new FlowLayout();\n\
  \        f.setLayout(flow);\n        Label l1 = new Label(\"Name \");\n        f.add(l1);\n\
  \        TextField tf1=new TextField(\"Matrix\");\n        f.add(tf1);\n       \
  \ tf1.setBackground(Color.green);\n        tf1.setForeground(Color.red);\n     \
  \   Button b1 = new Button(\"ok\");\n        Font f1 = new Font(\"Arial\", Font.BOLD,\
  \ 24);\n        b1.setFont(f1);\n        f.add(b1);\n        f.setSize(500,100);\n\
  \        f.setVisible(true);\n    }\n}\n```\n注意：如果我们减小了上述窗口的大小且组件无法放入单行中，则组件将从最后一个组件开始移动下一行。输出：images/0062.jpeg\n\
  \n**示例 17.2:**\n\n```java\nimport java.awt.*;\nclass MyFrame2 extends Frame {\n\
  \    public static void main (String args [] ) {\n        MyFrame2 f=new MyFrame2();\n\
  \        f.setLayout(new FlowLayout(FlowLayout.CENTER));\n        System.out.println(f.paramString());\n\
  \        Label l1=new Label(\"Name :\");\n        f.add(l1);\n        TextField\
  \ tf1=new TextField(\"Sample Program\");\n        f.add(tf1);\n        tf1.setBackground(Color.GREEN);\n\
  \        tf1.setForeground(Color.RED);\n        Button b1=new Button(\"OK\");\n\
  \        b1.setFont(new Font(\"Serif\",Font.BOLD,24));\n        b1.setEnabled(false);\n\
  \        Dimension d = b1.getSize( );\n        System.out.println(\"Button Size\
  \ :\" + d.width + \" \" + d.height);\n        f.add(b1);\n    }\n}\n```\n\n\n\n\
