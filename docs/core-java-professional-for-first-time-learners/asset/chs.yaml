  \       } else if (s.equals(\"green\")) {\n            tf1.setBackground(Color.green);\n\
  \        } else if (s.equals(\"blue\")) {\n            tf1.setBackground(Color.blue);\n\
  \        }\n    }\n}\n```\n\n### own\n最简单的可见 AWT 组件是 `label`。标签通常不用于响应输入或发送事件。\n\
