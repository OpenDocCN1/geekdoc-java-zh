  \n`CardLayout` 可以存储许多卡片，但一次只显示一张卡片。一次只有一个卡片是可见，但你可以在不同卡片之间切换。这意味着一个想要同时显示两张卡片的 `Panel`\
  \ 对于用户输入是非常有用的。\n\n### 构造函数\n- `CardLayout()`\n- `CardLayout(int hgap, int vgap)`\n\
  \n### 方法\n- `first(Container parent)`: 跳转到第一张卡片。\n- `next(Container parent)`: 跳转到下一张卡片。如果当前卡片是最后一张，则切换到第一张。\n\
  - `previous(Container parent)`: 跳转到上一个卡片。如果当前卡片是第一张，则切换到最后一张。\n- `show(Container\
  \ parent, String name)`: 跳转到添加到布局时带有给定 `name` 的组件。如果不存在这样的组件，则什么都不会发生。\n\n### 使用步骤\n\
  1. 创建一个新的 `Panel` 和一个 `CardLayout` 对象。\n2. 使用创建的 `CardLayout` 实例设置该 `Panel` 的布局。\n\
  3. 对于每张卡片，创建一个单独 `Panel` 并添加你想添加的任何组件（按钮等）。\n4. 将步骤 3 中创建的每个 `Panel` 添加到步骤 1 创建的主\
  \ `Panel` 中，并为每张卡片提供一个唯一的卡片名称。\n5. 最后，将主面板添加到 applet 窗口。\n\n### Example 17.10\n\n\
  ```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.applet.*;\n/*<applet\
  \ code=\"CardLayoutTest\" width=500 height=100></applet>*/\npublic class CardLayoutTest\
  \ extends Applet implements ActionListener, MouseListener {\n    Panel mp;\n}\n\
  ```\n\n\n\n\n\n```java\nCardLayout c1;\n\npublic void init() {\n    Button b1=new\
  \ Button(\"First\");\n    Button b2=new Button(\"Second\");\n    b1.addActionListener(this);\n\
  \    b2.addActionListener(this);\n    add(b1);\n    add(b2);\n    Panel p1=new Panel();\n\
  \    Label l1=new Label(\"INDIA\");\n    p1.add(l1);\n    Panel p2=new Panel();\n\
  \    Label l2=new Label(\"USA\");\n    p2.add(l2);\n    mp=new Panel();\n    c1=new\
  \ CardLayout();\n    mp.setLayout(c1);\n    mp.add(p1,\"Country1\");\n    mp.add(p2,\"\
  Country2\");\n    add(mp);\n    addMouseListener(this);\n}\n\npublic void actionPerformed(ActionEvent\
  \ ae) {\n    Button b=(Button)ae.getSource();\n    if(b.getLabel().equals(\"First\"\
  ))\n        c1.show(mp,\"Country1\");\n    else\n        c1.show(mp,\"Country2\"\
  );\n}\n\npublic void mousePressed(MouseEvent me) {\n    c1.next(mp);\n}\n\npublic\
  \ void mouseReleased(MouseEvent me){}\npublic void mouseClicked(MouseEvent me){}\n\
  public void mouseEntered(MouseEvent me){}\npublic void mouseExited(MouseEvent me){}\n\
  ```\n\nOutput:\n![](img/00073.jpeg)\n\n### GridBagLayout\n\n`GridBagLayout` 是标准布局管理器中最复杂且最灵活的一个。尽管它听起来应该是\
  \ `GridLayout` 的子类，但它完全不同。在 `GridLayout` 中，元素是排列的。\n\n### 示例 17.1:\nAWT 组件可以分类为：\n\
  1. 视觉组件（Visual Components）。\n2. 容器组件（Container Components）。\n3. 菜单组件（Menu Components）。\n\
  \n视觉组件和容器组件都是从 `java.awt.Component` 开始的组件层次的一部分。\n\n##### `java.awt.Component` 方法\n\
  由于继承自 `java.awt.Component`，所有视觉和容器组件都实现了若干方法（菜单组件扩展了 `java.awt.Component`）。这些方法讨论如下：\n\
  \n- `Dimension getSize()`：以 `Dimension` 对象的形式返回组件的大小，该对象包含类型为 `int` 的成员 `height`\
  \ 和 `width`。\n- `void setBackground(Color c)`：设置组件的背景颜色。通常背景颜色用于渲染组件的文本区域。\n- `void\
  \ setForeground(Color c)`：设置组件的前景色。通常前景色用于渲染文本。如果我们不设置组件的前景色或背景色，组件将使用其直接父容器的前景色背景色。\n\
  - `void setFont(Font f)`：`setFont()` 方法决定组件在渲染任何需要显示的文本时使用的字体。如果我们不设置组件的字体，组件将使用其容器的字体。\n\
  - `void setEnabled(Boolean b)`：如果参数为 true，则组件显示其外观。如果参数为 false，则组件将变为灰色且不响应用户输入。\n\
  - `void setSize(Dimension d)`：设置组件的大小。\n- `void setSize(int width, int height)`：设置组件的大小。\n\
  - `void setBounds(int x, int y, int width, int height)`：尝试移动并调整组件的大小。左上角的新位置由 `x`\
  \ 和 `y` 指定，新大小由 `width` 和 `height` 指定。\n- `void setVisible(Boolean b)`：此方法接受一个布尔参数，决定组件是否在屏幕上显示。此方法通常用于帧（frames）。注意——如果我们调用了\
  \ `setSize()` 或 `setBounds()`，我们知道这通常是徒劳的。我们赋予组件的大小和位置会被布局管理器覆盖。事实上，这两个方法主要是供布局管理器使用的。该规则的主要例外是\
  \ `Frame` 类，它不受布局管理器的控制，并且完全接受自己的大小或边界。\n\n### 视觉组件\n视觉组件是用户实际上可以看到并与之交互的组件。AWT\
  \ 支持以下视觉组件：\n- `Canvas`\n- `Checkbox`\n- `Choice`\n- `FileDialog`\n- `Label`\n-\
  \ `List`\n- `ScrollPane`\n- `Scrollbar`\n- `TextArea`\n- `TextField`\n\n要在 GUI 中使用这些组件之一，我们首先通过调用适当的构造函数创建一个实例。然后将组件添加到容器中。\n\
  \n### Button\n`Button` 类实现了一个推入按钮。\n\n**构造函数：**\n- `Button()`\n- `Button(String)`：构造函数接受一个字符串参数，指定按钮标签的文本。当按钮被按下时，它会发送一个\
  \ `ActionEvent`。\n\n**方法：**\n- `String getLabel()`：获取此按钮的标签。\n- `void setLabel(String\
  \ label)`：将按钮的标签设置为指定的字符串。\n- `void addActionListener(ActionListener l)`：添加动作监听器以接收来自此按钮的动作事件。\n\
  \n### 示例 17.12\n```java\nimport java.awt.*;\nclass ButtonTest {\n    public static\
  \ void main(String args[]) {\n        Frame f=new Frame(\"Testing Button\");\n \
  \       f.setLayout(new FlowLayout());\n        Font f1=new Font(\"Arial\", Font.BOLD,\
  \ 0);\n        Color c1=new Color(255,0,0);\n        Color c2=new Color(0,255,0);\n\
  \        Button b1 = new Button();\n        Button b2 = new Button(\"Cancel\");\n\
  \        b1.setForeground(c1);\n        b2.setForeground(c1);\n        b1.setBackground(c2);\n\
  \        b2.setBackground(c2);\n        b1.setFont(f1);\n        b2.setFont(f1);\n\
  \        b1.setLabel(\"Ok\");\n        System.out.println(b2.getLabel());\n    \
  \    f.add(b1);\n        f.add(b2);\n        f.setSize(500,200);\n    }\n}\n```\n\
  \n\n\n\n\n```java\n        f.setVisible(true);\n }\n}\n```\nOutput:\n\n![](img/00074.jpeg)\n\
  \n## Canvas\n\n`Canvas` 是一个组件，没有默认的显示或行为。我们可以子类 `canvas` 来创建自定义绘制区域、工作区域、组件等。`Canvas`\
  \ 接收来自鼠标和键盘的输入事件，由程序员将这些输入转换为有意义的视觉效果。\n\n`canvas` 的默认大小（或更准确地说，首选大小）小得毫无处。解决这个问题的一种方法是使用一个可以调整\
  \ `canvas` 大小的布局管理器。另一种方法是我们自己对 canvas 调用 `setSize()`，canvas 是少数这种方法实际上可能有效的用例，因为我们传递到\
  \ `setSize()` 方法的值将成为 canvas 的首选大小。\n\n### 示例 17.13\n\n```java\nimport java.awt.*;\n\
  class CanvasTest {\n    public static void main (String args []) {\n        Frame\
  \ f = new Frame ();\n        f.setLayout(new FlowLayout());\n        Canvas c=new\
  \ MyCanvas();\n        c.setSize(100, 100);\n        f.add(c) ;\n        f.setSize(300,\
  \ 300 );\n        f.setVisible(true);\n    }\n}\nclass MyCanvas extends Canvas {\n\
  \    public void paint(Graphics g ) {\n        setBackground(Color.green);\n   \
  \     g.setColor(Color.red );\n        g.drawLine(0, 0, 99, 99 );\n    }\n}\n```\n\
  Output:\n![](img/0075.jpeg)\n\n## Checkbox\n\n复选框是一个状态按钮。两个状态为 `true`（已选中）和 `false`（未选中）。复选框构造函数的三种基本形式为：\
  \ \n\n- `Checkbox()`：创建一个标签为空字符串的复选框。\n- `Checkbox(String label)`：创建一个带有指定标签的复选框。\n\
  - `Checkbox(String label, boolean state)`：创建一个带有指定标签并设置指定状态的复选框。如果我们不指定初始状态，默认为\
  \ `false`。\n\n方法：\n\n- `String getLabel()`：获取此复选框的标签。\n- `void setLabel(String label)`：设置此复选框的标签为该字符串。\n\
  - `boolean getState()`：确定此复选框处于“开启”还是“关闭”状态。\n- `void setState(boolean state)`：将此复选框的状态设置为指定状态。\n\
  - `void addItemListener(ItemListener)`：添加指定的项监听器以接收来自此复选框的项事件。\n\n### 示例 17.14\n\
  \n```java\nimport java.awt.*;\nclass CheckboxTest {\n    public static void main(String\
  \ args[]) {\n        Frame f = new Frame(\"Testing Checkbox Component\");\n    \
  \    f.setLayout(new GridLayout(3,1));\n        Checkbox c1=new Checkbox();\n  \
  \      Checkbox c2=new Checkbox(\"Lunch\",true);\n        Checkbox c3=new Checkbox(\"\
  Dinner\");\n        c1.setLabel(\"Fast\");\n        c3.setState(true);\n       \
  \ f.add(c1);f.add(c2);f.add(c3);\n        if(c1.getState())\n            System.out.println(c1.getLabel());\n\
  \        if(c2.getState())\n            System.out.println(c2.getLabel());\n   \
  \     if(c3.getState())\n            System.out.println(c3.getLabel());\n      \
  \  f.setSize(100,100);\n        f.setVisible(true);\n    }\n}\n```\nOutput:\n![](img/0076.jpeg)\n\
  \n### 另一个示例\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass CheckboxTest\
  \ implements ItemListener {\n    Checkbox c1;\n    TextField tf1;\n    CheckboxTest()\
  \ {\n        setLayout(new GridLayout(2,1));\n        c1=new Checkbox(\"Red\");\n\
  \        c1.addItemListener(this);\n        add(c1);\n        tf1=new TextField();\n\
  \        add(tf1);\n        setSize(100,100);\n        setVisible(true);\n    }\n\
  \    public static void main(String args[]) {\n        new CheckboxTest();\n   \
  \ }\n    public void itemStateChanged(ItemEvent ie) {\n        if(c1.getState())\n\
  \            tf1.setBackground(Color.red);\n        else\n            tf1.setBackground(Color.white);\n\
  \    }\n}\n```\n\n## Radio button\n\n复选框可以被组成复选框组，它们具有单选行为。在单选行为下，任何时刻复选框组中只有一个成员可以为\
  \ `true`；选择新成员会将之前选中的成员状态变为 `false`。许多系统（例如 Motif）将单选组作为独立的组件实现。\n\n我们可以通过创建多个复选框并使用\
  \ `java.awt.CheckboxGroup` 将它们分组来实现 get 单选行为。在 Java 中，`CheckboxGroup` 类不是一个组件；它仅仅是一个组织复选框的可见类。这意味着\
  \ Java 不在组内成员之间施加任何空间关系。如果我们愿意，可以将组中的一个成员放在左上角，另一个成员放在右下角，第三个成员放在不同的帧（frame）中。当然，结果将违背常理和大多数\
  \ GUI 指南。\n\n`CheckboxGroup` 类的有两个方法支持获取和设置当前选中的成员或组：\n\n- `Checkbox getCheckbox()`：从此复选框组中获取当前选择。\n\
  - `void setSelectedCheckbox(Checkbox box)`：将此组中当前选中的复选框设置为指定的复选框。\n\n### 示例 17.15\n\
  \n```java\nimport java.awt.*;\nclass CheckboxTest {\n    public static void main(String\
  \ args[]) {\n        Frame f = new Frame(\"Testing RadioButton Component\");\n \
  \   }\n}\n```\n\n\n\n\n\n```java\nf.setLayout(new GridLayout(3,1));\nCheckboxGroup\
  \ cbg = new CheckboxGroup();\nCheckbox c1 = new Checkbox(\"BreakFast\", false, cbg);\n\
  Checkbox c2 = new Checkbox(\"Lunch\", true, cbg);\nCheckbox c3 = new Checkbox(\"\
  Dinner\", false, cbg);\nc3.setState(true);\nf.add(c1); f.add(c2); f.add(c3);\n\n\
  if(c1.getState())\n    System.out.println(c1.getLabel());\nelse if(c2.getState())\n\
  \    System.out.println(c2.getLabel());\nelse if(c3.getState())\n    System.out.println(c3.getLabel());\n\
  \nf.setSize(10,10);\nf.setVisible(true);\n```\n\n### Choice\n`Choice` 是一个拉取列表。\n\
  \n### Methods\n- `void add(String item)`: 向 `Choice` 菜单中添加一个项目。\n- `void addItem(ItemListener\
  \ i)`: 添加指定的 `listener` 以接收来自 `choice` 菜单的项事件。\n- `String getItem(int index)`: 获取\
  \ `Choice` 菜单中指定 `index` 处的 `String`。\n- `int getItemCount()`: 返回 `Choice` 菜单中的项目数量。\n\
  - `int getSelectedIndex()`: 返回当前选中项目的索引。\n- `String getSelectedItem()`: 获取当前选择的字符串表示。\n\
  - `void insert(String item, int index)`: 在指定的 `position` 处将 `item` 插入此 `choice`\
  \ 中。\n- `void remove(int position)`: 从选择菜单中移除第一个出现项。\n- `void remove(String item)`:\
  \ 从 Choice 菜单中移除 `item` 的第一个出现项。\n- `void removeAll()`: 移除选择菜单中的所有项目。\n- `void select(int\
  \ pos)`: 将选择菜单中的选中项目设置为指定位置处的项目。\n- `void select(String Str)`: 将 Choice 中名称与指定字符串的的项目设置为选中项目。\n\
  \n### Example 17.16\n```java\nimport java.awt.*;\nclass Test {\n    public static\
