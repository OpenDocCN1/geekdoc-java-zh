  \ Boolean valueOf(boolean b)` | 返回表示指定布尔值的 `Boolean` 实例。 |\n| `static Boolean valueOf(String\
  \ s)` | 返回表示指定字符串值的 `Boolean`。 |\n\n# Java 中的输入/输出\n\n## 简介\n## 流\nJava 程序通过流执行输入/输出。流是产生或消费信息的抽象。流与物理设备连接。\n\
  \n所有流的行为都是相同的，即使它们连接的实际物理设备不同。这意味着相同的输入输出类可以应用于任何设备。\n\n## Java 程序与输入输出的关系\n从一个流发送到另一个流（如一个管道供给另一个）的概念使得\
  \ Java 流成为强大的文件处理工具。我们可以使用简单的流操作构建复杂的文件处理序列。\n\n此功能可以用于沿流管道过滤数据，以便我们获得所需格式。例如，我们可以使用一个流获取二进制格式的原始数据，然后使用另一个流将其转换为整数。\n\
  \n## 输入流和输出流\nJava 流分为两种基本类型：输入流和输出流。输入流从源提取（即读取）数据并发送给程序。\n\n程序连接数据源并打开输入流，顺序读取数据。同样，程序连接数据目的地并打开输出流，顺序写入数据。在这情况下，程序都不知道端点（即源和目的地）的细节。\n\
  \n## 字节流和字符流\nJava 定义了两种流：字节流和字符流。字节流提供了处理字节输入输出的方便方法。字节流用于读取或写入二进制数据。字符流提供了处理字符输入输出的方便方法。它们使用\
  \ Unicode，因此可以国际化。而且在某些情况下，字符流比字节流更高效。\n\n\n\n\n\n我们还可以根据流读取或写入的源或目的类型对流进行跨组操作。源（或目的）可能是内存、文件或管道。\n\
  \n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/00038.jpeg)\n\
  \n![sss](img/00039.jpeg)\n\n(Java 流类分类)\n\n## 字节流类概览\n\n字节流类通过两个类层次结构进行定义。顶端是两个抽象类：\n\
  \n(1) `InputStream` 和 (2) `OutputStream`\n\n这些抽象类中的每一个都有若干具体的子类，它们负责处理各种设备之间的差异，例如磁盘文件、网络连接甚至内存缓冲区。\n\
  \n### InputStream 类\n\n用于读取 8 位字节的 `InputStream` 类包括一个名为 `InputStream` 的父类以及若干个支持各种输入相关功能的子类。\n\
  \n### 输入流类的层次结构\n\n(输入流类的层次结构)\n\n![![C:\\Users\\Made Man Harry\\Desktop\\Stars\\\
  black_star_logo.jpg](img/00040.jpeg)\n\n![abc](img/00041.jpeg)\n\n![ab](img/00042.jpeg)\n\
  \n### InputStream 类\n\n父类 `InputStream` 是一个抽象类，它定义了执行输入功能的方法，例如：\n\n*   读取字节。\n\
  *   关闭流。\n*   在流中标记位置。\n*   在流中跳过字节。\n*   查找流中的字节数。\n\n### InputStream 类的方法：\n\n\
  | 方法 |  |\n| :--- | :--- |\n| `int available()` | 提供输入中可用的字节数（必须由子类重写）。`InputStream`\
  \ 类的 `available` 方法始终返回 0。 |\n| `void close()` | 关闭此输入流并释放与流相关的任何系统资源。`InputStream`\
  \ 的 `close` 方法不做任何操作。 |\n| `void mark(int readlimit)` | 标记此输入流中的当前位置。`InputStream`\
  \ 的 `mark` 方法不做任何操作。 |\n| `boolean markSupported()` | 测试此输入流是否支持 `mark` 和 `reset`\
  \ 方法。`InputStream` 的 `markSupported` 方法返回 `false`。 |\n| `abstract int read()` |\
  \ 从输入流中读取下一个字节数据。子类必须提供此方法的实现。 |\n| `int read(byte[] b)` | 从输入流中读取若干字节并将其存储在缓冲区数组\
  \ `b` 中。实际读取的字节数作为整数返回。 |\n| `int read(byte[] b, int offset, int len)` | 从输入流中读取若干字节，并从参数\
  \ `off` 指定的位置开始存储在缓冲区数组 `b` 中。实际读取的字节数作为整数返回。 |\n| `void reset()` | 将此流重新定位到上一次在此输入流上调用\
  \ `mark` 方法时的位置。`InputStream` 的 `reset` 方法不做任何操作并始终抛出 `IOException`。 |\n| `long\
  \ skip(long n)` | 跳过并丢弃此输入流中的多达 `n` 个字节，并返回实际跳过的字节数。 |\n\n## DataInput 接口\n\n`DataInput`\
  \ 是一个接口，它定义了从 `InputStream` 读取原始数据类型的方法。\n\n### DataInput 接口的方法：\n\n| 方法 | 说明 |\n\
  | :--- | :--- |\n| `boolean readBoolean()` | 读取一个输入字节，如果该字节非零则返回 `true`，为零则返回 `false`。\
  \ |\n| `byte readByte()` | 读取并返回一个输入字节。 |\n| `char readChar()` | 读取一个输入字符并返回其值。\
  \ |\n| `double readDouble()` | 读取八个输入字节并返回一个 double 值。 |\n| `float readfloat()`\
  \ | 读取四个输入字节并返回一个 double 值。 |\n| `void readFully(byte[] b)` | 从输入流中读取若干字节并存储在缓冲区数组\
  \ `b` 中。如果此流在读取所有字节之前到达末尾，此方法将抛出 `EOFException`。 |\n| `void readFully(byte[] b,\
  \ int off, int len)` | 从输入流中读取 `len` 个字节，并从 `off` 指定的位置开始存储在缓冲区数组 `b` 中。如果此流在读取所有字节之前到达末尾，此方法将抛出\
  \ `EOFException`。 |\n| `int readInt()` | 读取四个输入字节并返回一个 `int` 值。 |\n| `String readLine()`\
  \ | 从输入流中读取下一行。 |\n| `long readLong()` | 读取八个输入字节并返回一个 `long` 值。 |\n| `short readShort()`\
  \ | 读取两个输入字节并返回一个 `short` 值 |\n| `Strig readUTF(()` | 读取使用修改 UTF-8 格式编码的字符串。 |\n\
  | `int skipBytes(int n)` | 尝试跳过输入流中的 `n` 个字节数据，并丢弃跳过的字节。返回实际跳过的字节数。 |\n\n## InputStream\
  \ 类总结\n\n`FilterInputStream` 包含另一个输入流，它将其作为基本数据源，可能在处理过程中转换数据并提供额外功能。\n\n`FilterInputStream`\
  \ 类本身简单地重写了 `InputStream` 的所有方法，其这些版本会将所有请求传递给所包含的输入流。`FilterInputStream` 的子类可能会进一步重写这些某些方法，并可能提供额外的方法和字段。\n\
  \n注意 `DataInputStream` 类继承自 `FilterInputStream` 并实现了 `DataInput`。`DataInputStream`\
  \ 除了使用 `InputStream` 方法外，还有 `DataInput` 中描述的方法。\n\n### InputStream 类总结：\n\n| 类 |\
  \ 说明 |\n| :--- | :--- |\n| `InputStream` | 此抽象类是表示字节流的类的基类。 |\n| `BufferedInputStream`\
  \ | `BufferedInputStream` 为另一个输入流增加了缓冲功能，支持 `mark` 和 `reset` 方法。 |\n| `ByteArrayInputStream`\
  \ | `ByteArrayInputStream` 包含一个可以从中读取的内部缓冲区。 |\n| `DataInputStream` | `DataInputStream`\
  \ 让应用程序以独立机器的方式从输入流读取 Java 数据类型。 |\n| `FileInputStream` | `FileInputStream` 包含文件的输入字节。\
  \ |\n| `FilterInputStream` | `FilterInputStream` 包含另一个输入流，将其作为基本数据源，可能在处理过程中转换数据并提供额外功能。\
  \ |\n| `PipedInputStream` | `PipedInputStream` 应连接到管道输出流，管道输入流提供写入管道输出流的所有字节。 |\n\
  | `PushbackInputStream` | `PushbackInputStream` 为另一个输入流增加了功能，即“推回”或“重读”一个字节。 |\n\
  | `SequenceInputStream` | `SequenceInputStream` 代表逻辑流连接。 |\n| `ObjectInputStream`\
  \ | `ObjectInputStream` 反序列化之前使用 `ObjectOutputStream` 写入的原始数据和对象。 |\n\n### OutputStream\
  \ 类\n\n`OutputStream` 类派自基类 `OutputStream`，它是一个抽象类，并有若干支持各种输出功能的子类。\n\n### OutputStream\
  \ 类\n\n(输出流类的层次结构)\n\n![z](img/images)\n\n### OutputStream 类的方法：\n\n| 方法 | 说明 |\n\
  | :--- | :--- |\n| `void close()` | 关闭此输出流并释放与流相关的任何资源。 |\n| `void flush()` | 刷新此输出流并强制输出任何缓冲输出字节。\
  \ |\n| `void write(byte[] b)` | 将指定的字节数组中的 `b.length` 个字节写入其输出流。 |\n| `void write(byte[]\
  \ b, int off, int len)` | 从指定的字节数组偏移量 `off` 开始将 `len` 个字节写入其输出流。 |\n| `abstract\
  \ void write( int b)` | 将指定的字节写入其输出流。 |\n\n## DataOutput 接口\n\n`DataOutput` 是一个接口，它定义了向\
  \ `OutputStream` 写入原始数据类型的方法。\n\n![IO_LayeredInput](img/00045.jpeg)\n\n\n\n\n\n\
  ![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/00046.jpeg)\n\
  \n# `DataOutput` 接口方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void writeBoolean(boolean\
  \ v)` | 将布尔值写入其输出流。 |\n| `void writeByte(int v)` | 将参数 `v` 的低 8 位写入输出流。 |\n| `void\
  \ writeBytes(string s)` | 将字符串写入输出流。对于字符串 `s` 中的每个字符（按顺序取出），向输出流写入一个字节。 |\n| `void\
  \ writeChar(int v)` | 将一个由两个字节组成的字符值写入输出流。 |\n| `void writeChars(string s)` | 将字符串\
  \ `s` 中的每个字符按两个字节的顺序写入输出流。 |\n| `void writeDouble(double v)` | 将一个由八个字节组成的双精度浮写入输出流。\
  \ |\n| `void writeFloat(float v)` | 将一个由四个字节组成的单精度浮点写入输出流。 |\n| `void writeInt(int\
  \ v)` | 将一个由四个字节组成的整数写入输出流。 |\n| `void writeLong(long v)` | 将一个由八个字节组成的长型整数写入输出流。\
  \ |\n| `void writeShort(int v)` | 将一个由两个字节组成的短型整数写入输出流。 |\n| `void writeUTF(String\
  \ str)` | 向输出流写入两个字节的长度信息，随后是字符串 `s` 中每个字符的修改后的 UTF-8 表示。 |\n\n## `OutputStream`\
  \ 类总结\n\n`DataOutputStream` 是 `DataInputStream` 的对应类。`DataOutputStream` 类在使用 `OutputStream`\
  \ 类方法 own，它还实现了 `DataOutput` 接口中描述的方法。\n\n## `OutputStream` 类总结\n\n| 类 | 描述 |\n\
  | :--- | :--- |\n| `OutputStream` | 此抽象类是所有表示字节输出流的类的父类。 |\n| `BufferedOutputStream`\
  \ | 该类实现了一个带缓冲的输出流。 |\n| `ByteArrayOutputStream` | 该类实现了一个输出流，数据被写入字节数组中。 |\n| `DataOutputStream`\
  \ | 数据输出流允许应用程序以可移植的方式将 Java 原始数据类型写入输出流。 |\n| `FileOutputStream` | 文件输出流是用于向 `File`\
  \ 写入数据的输出流。 |\n| `PipedOutputStream` | 管道输出流可以连接到管道输入流以创建一个通信管道。 |\n| `FilterOutputStream`\
  \ | `FilterOutputStream` 包含其他一些输出流，并将其作为目标，可能在传输过程中转换数据或提供额外功能。 |\n| `PrintStream`\
  \ | `PrintStream` 为另一个输出流增加了功能，即方便地打印各种数据值的表示。 |\n\n# 字符流类概览\n\n字符流通过使用两个类层次结构定义。顶端是两个抽象类：`Reader`\
  \ 和 `Writer`。这些抽象类处理 Unicode 字符流。\n\nJava 有这些中每个类的几个具体子类。抽象的 `Reader` 和 `Writer`\
  \ 类定义了其他流类实现的几个关键方法。其中最重要的两个方法是 `read()` 和 `write()`，它们分别读取和写入字符数据。这些方法被派生流类重写。\n\
  \n## `Reader` 流类\n\n`Reader` 流类设计用于从文件中读取字符。`Reader` 类是该组中所有其他类的基类。这些类在功能上与输入流类非常相似，但输入流使用字节作为信息的基本单位，而读取流使用字符。\n\
  \n`Reader` 类包含与 `InputStream` 类中提供的相同的方法。因此，`Reader` 类可以执行输入流类几乎实现的所有功能。\n\n![](img/00047.jpeg)\n\
  \n(Reader 流类层级结构)\n\n## `Reader` 类\n\n`Reader` 是一个抽象类，定义了 Java 的字符输入流模型。该类中的所有方法都会抛出\
  \ `IOException`。\n\n### `Reader` 类方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `abstract\
  \ void close()` | 关闭流。一旦流被关闭，进一步的 `read()`、`ready()`、`mark()` 或 `reset()` 调用将抛出\
  \ `IOException`。然而，关闭一个已经关闭的流没有影响。 |\n| `void mark()` | 标记流中的当前位置。随后的 `reset()`\
  \ 调用将尝试将流重置到此点。并不是所有的字符输入流都支持 `mark()` 操作。 |\n| `boolean markSupported()` | 告诉我们此流是否支持\
  \ `mark()` 操作。 |\n| `int read()` | 读取单个字符并返回来自调用输入流的下一个可用字符的整数表示。当遇到文件末尾时返回 -1。\
  \ |\n| `int read(char[] buffer)` | 尝试将最多等于缓冲区长度的字符读取到 `buffer` 中，并返回成功读取的字符数。遇到文件末尾时返回\
  \ -1。读取器的子类必须实现此方法。 |\n| `abstract int read(char[] buffer, int offset, int numChar)`\
  \ | 尝试从 `buffer[offset]` 开始读取最多 `numChar` 个字符到缓冲区，返回成功读取的字符数。遇到文件末尾时返回 -1。读取器的子类必须实现此方法。\
  \ |\n| `boolean ready()` | 告诉此流是否准备好读取。如果不需要等待则返回 true，否则返回 false。 |\n| `void reset()`\
  \ | 重置流。并不是所有字符输入流都支持此方法。 |\n| `long skip(long n)` | 跳过 `n` 个字符并返回跳过的的数量。如果 `n`\
  \ 为负则抛出 `IllegalArgumentException`。 |\n\n## `Reader` 类总结\n\n| 类 | 描述 |\n| :--- |\
  \ :--- |\n| `Reader` | 读取字符流的抽象类。 |\n| `BufferedReader` | 从字符输入流读取文本，缓冲字符以便高效读取字符、数组和行。\
  \ |\n| `CharArrayReader` | 实现一个作为字符流使用的缓冲区。 |\n| `FileReader` | 读取文件的便利类。 |\n| `FilterReader`\
  \ | 读取过滤流的抽象类。 |\n| `InputStreamReader` | 从字节流到字符流的桥梁：它使用指定的字符将字节解码为字符。 |\n| `PipedReader`\
  \ | 管道字符输入流。 |\n| `PushbackReader` | 允许将字符推回流的字符读取器。 |\n| `StringReader` | 源自字符串的字符流。\
  \ |\n\n## `Writer` 类\n\n`Writer` 流类设计用于向文件/输出设备写入字符。`writer` 类是一个抽象类，作为所有写入流类的基类。\n\
  \n通过定义与 `OutputStream` 类相同的方法为所有输出操作提供支持。\n\n`Writer` 类包含与 `OutputStream` 类提供的相同的方法。因此，`Writer`\
  \ 类可以执行输出流类几乎实现的所有功能。\n\n![](img/00048.jpeg)\n\n(Writer 流类层级结构)\n\n## `Writer` 类\n\
  \n`Writer` 是一个抽象类，定义了字符输出。该类中的所有方法都返回 void 值，并在出错时抛出 `IOException`。\n\n### `Writer`\
  \ 类方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `abstract void close()` | 关闭流并先刷新它。 |\n\
  | `abstract void flush()` | 刷新流。 |\n| `void write(char[] cbuf)` | 写入字符数组。 |\n| `abstract\
  \ void write(char[] cbuf, int off, int len)` | 从指定的偏移开始写入数组的一部分。子类必须实现此方法。 |\n\n\
  \n\n\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `void write(int c)` | 向调用的输出流写入单个字符。注意该参数类型为\
  \ `int`，这允许你直接对表达式调用 `write`，而无需将其强制转换回 `char`。 |\n| `void write(String str)` |\
  \ 写入字符串。 |\n| `void write(String str, int off, int len)` | 写入字符串从指定偏移量开始的区域。 |\n\
  \n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\Star_logo_yellow.jpg](img/00050.jpeg)\n\
  \n*(注：图像路径保持不变）*\n\n## Writer 类总结\n\n| 类 | 说明 |\n| :--- | :--- |\n| `Writer` | 用于向字符流写入数据的抽象类。\
  \ |\n| `BufferedWriter` | 将文本写入字符输出流，通过缓冲字符以便高效地写入单个字符、数组和字符串。 |\n| `CharArrayWriter`\
  \ | 该类实现了一个可以作为 `Writer` 的字符缓冲区。 |\n| `FileWriter` | 用于写入字符文件的便利类。 |\n| `FilterWriter`\
  \ | 用于写入过滤字符流的抽象类。 |\n| `OutputStreamWriter` | `OutputStreamWriter` 是字符流到字节流的桥梁：写入它的字符将使用指定的字符集编码为字节。\
  \ |\n| `PipedWriter` | 管道字符输出流。 |\n| `PrintWriter` | 将对象的格式化表示打印到文本输出流。 |\n| `StringWriter`\
  \ | 字符流，将其输出收集在字符串缓冲区中，然后可以使用它来构造字符串。 |\n\n## File 类\n\n尽管 `java.io` 中定义的大多数类都是操作流的，但\
  \ `File` 类并非。它直接处理文件和文件系统。也就是说，`File` 类并没有指定如何从文件中检索信息或将信息存储在文件中。它描述的是对象自身的属性。\n\
  \n文件对象用于获取或操作与磁盘文件关联的信息，例如权限、时间、日期和目录路径，以及在子目录层次结构中导航。\n\n尽管出于安全考虑，文件在 applet 中的使用受到严格限制，但文件仍然是存储持久和共享信息的核心资源。\n\
  \nJava 中的目录被简单地视为一个文件，额外多了一个属性——可以通过 `list()` 方法检查的文件名列表。\n\n| 方法 | 说明 |\n| :---\
  \ | :--- |\n| `public File(String)` | |\n| `public File(String, String)` | |\n|\
  \ `public File(File, String)` | |\n| `public File(URI)` | 此构造函数由 Java 2（版本 1.4）添加。\
  \ |\n| `public String getName()` | 返回文件或目录名称。 |\n| `public String getParent()` |\
  \ 返回对象创建期间指定的路径中的文件父目录；如果此路径没有命名父目录，则返回 `null`。 |\n| `public String getPath()` |\
  \ 返回相对路径。 |\n| `public boolean isAbsolute()` | 测试此抽象路径名（abstract pathname）是否为绝对路径。\
  \ |\n| `public String getAbsolutePath()` | 返回从根目录开始的绝对（完整）路径。 |\n| `public boolean\
  \ canRead()` | 测试该应用程序是否可以读取由此抽象路径名所表示的文件。 |\n| `public boolean canWrite()` | 测试该应用程序是否可以修改由此抽象路径名所表示的文件。\
  \ |\n| `public boolean exists()` | 测试由此抽象路径名所表示的文件或目录是否存在。 |\n| `public boolean\
  \ isDirectory()` | 测试由此抽象路径名所表示的是否目录。 |\n| `public boolean isFile()` | 测试由此抽象路径名所表示的是否普通文件。\
  \ |\n| `public boolean isHidden()` | 测试由此抽象路径名命的文件是否为隐藏文件。 |\n| `public long lastModified()`\
  \ | 返回由此抽象路径名所表示的文件最后修改的时间。 |\n| `public long length()` | 返回由此抽象路径名所表示的文件长度。 |\n\
  | `public boolean createNewFile()` throws `java.io.IOException` | 仅当不存在以此名称命名的文件时，自动创建一个由此抽象路径名命名的空文件。\
  \ |\n| `public boolean delete()` | 删除由此抽象路径名所表示的文件或目录。 |\n| `public String[] list()`\
  \ | 返回一个命名此抽象路径名所表示的目录中的文件和目录的字符串数组。如果 `File` 对象对应于文件，则返回 `null`。 |\n| `public boolean\
  \ mkdir()` | 创建由此抽象路径名命名的目录。 |\n| `public boolean mkdirs()` | 创建由此抽象路径名命名的目录，包括任何必要的但不存在的父目录。\
  \ |\n| `public boolean setLastModified(long)` | 设置由此抽象路径名命名的文件或目录的修改时间。 |\n| `public\
  \ boolean setReadOnly()` | 标记由此抽象路径名命名的文件或目录，只允许读取操作。 |\n| `public boolean setWritable(boolean)`\
  \ | |\n| `public boolean setReadable(boolean)` | |\n| `public boolean canExecute()`\
  \ | |\n| `public long getTotalSpace()` | |\n| `public long getFreeSpace()` | |\n\
  | `public long getUsableSpace()` | |\n| `boolean renameTo(File)` | 重命名由此抽象路径名表示的文件。\
  \ |\n\n## 示例\n\n```java\nFile f1 = new File(\"/\");\nFile f2 = new File(\"/\", \"\
  autoexec.bat\");\nFile f3 = new File(f1, \"autoexec.bat\");\n```\n\n### 注意\nJava\
