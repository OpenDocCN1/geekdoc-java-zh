  - tally.imp 它是一个文件\n- Data 它是一个目录\n\n### FileInputStream\n`FileInputStream` 是 `InputStream`\
  \ 类的直接子类。要打开文件进行读取，只需创建一个 `FileInputStream` 类的对象，并将文件名（直接或间接）作为构造函数的参数。\n\n| 方法\
