  Three:4\nOne:5\nTwo:5\nThree:5\nOne Exiting\nTwo Exiting\nThree Exiting\nMain thread\
  \ exiting\n```\n\n### 使用 `isAlive()` 和 `join()` 强制排序\n\n通常我们希望主线程最后结束。实现这一点的一种方法是在\
  \ `main` 中调用 `sleep()`。这是一种相当粗糙的方法。有两种方法可以判断线程是否已完成。首先，我们可以在线程上调用 `isAlive()`。该方法由\
  \ `Thread` 定义，其通用形式为：`boolean isAlive()`。如果调用该方法的线程仍在运行，则 `isAlive()` 方法返回 `true`；否则返回\
  \ `false`。虽然 `isAlive()` 有时很有用，但我们通常用于等待线程完成的方法是 `join()`，如下所示：`void join() throws\
  \ InterruptedException`。该方法会一直等待直到调用它的方法的线程终止。`join()` 的其他形式允许我们指定等待指定线程终止的最长时限。下面的示例使用了\
  \ `join()` 来确保主线程是最后一个停止的。它还演示了 `isAlive()` 方法。\n\n\n\n\n\n```java\n        }\n\
  \    }\n    System.out.println(name + \"Exiting\");\n    }\n}\n\nclass DemoJoin\
  \ {\n    public static void main(String args[]) {\n        A ob1 = new A(\"One\"\
  );\n        A ob2 = new A(\"Two\");\n        A ob3 = new A(\"Three\");\n       \
  \ System.out.println(\"Thread One is alive?:\" + ob1.t.isAlive());\n        System.out.println(\"\
  Thread Two is alive?:\" + ob2.t.isAlive());\n        System.out.println(\"Thread\
  \ Three is alive?:\" + ob3.t.isAlive());\n        try {\n            ob3.t.join();\n\
  \            ob2.t.join();\n            ob1.t.join();\n        } catch (InterruptedException\
  \ e) {\n            System.out.println(\"main thread interrupted\");\n        }\n\
  \        System.out.println(\"Thread One is alive?:\" + ob1.t.isAlive());\n    \
  \    System.out.println(\"Thread Two is alive?:\" + ob2.t.isAlive());\n        System.out.println(\"\
  Thread Three is alive?:\" + ob3.t.isAlive());\n        System.out.println(\"Main\
  \ thread exiting\");\n    }\n}\n```\n\n输出：\n```text\nChild thread:Thread[One,5,main]\n\
  Child thread:Thread[Two,5,main]\nChild thread:Thread[Three,5,main]\nThread One is\
  \ alive?:true\nThread Two is alive?:true\nThread Three is alive?:true\n```\n\n```java\n\
  class Clicker implements Runnable {\n    long click = 0;\n    Thread t;\n    volatile\
  \ boolean running = true;\n\n    Clicker(int p) {\n        t = new Thread(this);\n\
  \        t.setPriority(p);\n    }\n\n    public void run() {\n        while (running)\
  \ {\n            click++;\n        }\n    }\n\n    public void stop() {\n      \
  \  running = false;\n    }\n\n    public void start() {\n        t.start();\n  \
  \  }\n}\n\nclass HiLoPri {\n    public static void main(String args[]) {\n     \
  \   Thread.currentThread().setPriority(Thread.MAX_PRIORITY);\n        Clicker hi\
  \ = new Clicker(Thread.NORM_PRIORITY + 1);\n        Clicker lo = new Clicker(Thread.NORM_PRIORITY\
  \ - 1);\n        lo.start();\n        hi.start();\n        try {\n            Thread.sleep(10000);\n\
  \        } catch (InterruptedException e) {\n            System.out.println(e);\n\
  \        }\n        lo.stop();\n        hi.stop();\n        try {\n            lo.join();\n\
  \            hi.join();\n        } catch (InterruptedException e) {\n          \
  \  System.out.println(e);\n        }\n        System.out.println(\"Low : \" + lo.click);\n\
  \        System.out.println(\"High : \" + hi.click);\n    }\n}\n```\n\n\n\n\n\n\
  高优先级线程获得了超过 98% 的 CPU 时间。但线程仍然发生了上下文切换，尽管它们既没有主动释放 CPU，也没有因为 I/O 而阻塞。当此相同的程序在非抢占式系统运行时，将获得不同的结果。\n\
  \n注意： 变量 `running` 前面带有关键字 `volatile`，以确保在每次迭代以下循环时，都会检查 `running` 的值。\n\n```java\n\
  while (running)\n{           \n    click++;\n}\n```\n\n如果不使用 `volatile`，Java 可以自由地对循环进行优化，创建一个\
  \ `running` 的局部副本。使用 `volatile` 可以防止这种优化，告诉 Java `running` 可能会以当前代码中无法直接看出的方式发生变化。\n\
  \n## 同步\n\n当两个或多个线程需要访问共享资源时，它们需要某种方式来确保资源在同一时刻只有一个线程在使用。实现这一目标的过程被称为同步。\n\n同步的关键是监控器（monitor）概念（也称为信号量）。监控器是一个用作互斥锁的对象。在给定时间内，只有一个线程可以拥有监控器。\n\
  \n当一个线程获取锁时，被认为它进入了监控器。所有其他尝试进入被锁监控器的线程都将被挂起，直到第一个线程退出监控器。这些其他线程被称为正在等待监控器。拥有监控器的线程如果愿意，可以重新进入同一个监控器。我们可以通过两种方式之一对我们的代码进行同步：\n\
  \n(i) 使用 `synchronized` 方法\n(ii) 使用 `synchronized` 语句\n\n## 使用 synchronized 方法\n\
  \n在 Java 中同步是非常简单的，因为所有对象都有一个与其关联的隐式监控器。要进入对象的监控器，只需调用用 `synchronized` 关键字修改的方法。当一个线程在同步方法内部时，所有尝试在该实例上调用该方法（或其他任何同步方法）的其他线程都必须\
  \ `wait()`。要退出监控器并将对象的控制权交给下一个等待的线程，监控器的所有者只需从同步方法返回即可。\n\n### 示例 12.8\n\n下面的程序说明了三个线程在并发运行时生成的输出会发生混杂。\n\
  \n```java\nclass A\n{\n    void display(String msg)\n    {\n        System.out.print(\"\
  [\" + msg);\n        try\n        {\n            Thread.sleep(1000);\n        }\n\
  \        catch(InterruptedException e)\n        {\n            System.out.println(e);\n\
  \        }\n        System.out.println(\"]\");\n    }\n}\nclass B implements Runnable\n\
  {\n    A obj;\n    String msg;\n    Thread t;\n    B(A obj1, String m)\n    {\n\
  \        msg = m;\n        obj = obj1;\n        t = new Thread(this);\n        t.start();\n\
  \    }\n    public void run()\n    {\n        obj.display(msg);\n    }\n}\nclass\
  \ Synch1\n{\n    public static void main(String args[])\n    {\n        A a1 = new\
  \ A();\n        B b1 = new B(a1,\"Hello\");\n        B b2 = new B(a1,\"World\");\n\
  \        B b3 = new B(a1,\"Matrix\");\n    }\n}\n```\n\n输出:\n```\n[Hello[World[Matrix]\n\
  ]\n]\n```\n\n正如我们看到的，通过调用 `sleep()`，`display()` 方法允许执行切换到另一个线程。这导致了三个消息字符串输出混杂。在这个程序中，没有任何机制可以阻止所有三个线程在同一时间对同一个对象调用同一个方法。\n\
  \n这被称为竞态条件（race condition），因为这三个线程正在相互竞争以完成该方法。这个示例使用 `sleep()` 使得效果可重复且显易。在大多数情况下，竞态条件更加微妙且难以以预测，因为我们无法确定上下文切换何时会发生。这可能导致程序这一次运行是正确的，下一次运行就是错误的。\n\
  \n为了做到这一点，我们只需要在方法 `display()` 的定义前加上 `synchronized` 关键字。这可以防止任何线程在另一个线程正在使用它时进入\
  \ `display()`。\n\n### 示例 12.9\n\n混杂问题通过简单地将 `display()` 方法声明为同步方法就得到了解决。\n\n```java\n\
  class A\n{\n    synchronized void display(String msg)\n    {\n        System.out.print(\"\
  [\" + msg);\n        try\n        {\n            Thread.sleep(100);\n        }\n\
  \        catch(InterruptedException e)\n        {\n            System.out.println(e);\n\
  \        }\n        System.out.println(\"]\");\n    }\n}\nclass B implements Runnable\n\
  {\n    A obj;\n    String msg;\n    Thread t;\n    B(A obj1, String m)\n    {\n\
  \        msg = m;\n        obj = obj1;\n        t = new Thread(this);\n        t.start();\n\
  \    }\n    public void run()\n    {\n        obj.display(msg);\n    }\n}\n```\n\
  （注：原文在描述中提到了 `call()`，但代码块使用了 `display()`；为了与提供的代码保持一致，已调整以匹配所提供的代码逻辑。）\n\n\n\n\n\
  虽然在我们创建的类中创建同步方法是实现同步的一种简单且有效的方法，但在并非所有情况下它都适用。为了理解原因，请考虑以下情况：假设我们想要同步访问一个并非为多线程访问设计的类对象。也就是说，该类没有使用同步方法。此外，该类不是由我们创建的，而是由第三方创建；而且我们无法源代码。因此，我们无法在该类适当的方法上添加\
  \ `synchronized` 修饰符。那么如何通过 `synchronized` 对该类的对象进行访问呢？\n\n解决方案是将该类定义的方法调用放在 `synchronized`\
  \ 块内部。`synchronized` 语句的一般形式如下：\n\n```java\nsynchronized(object)\n{\n    //需要同步的语句\n\
  }\n```\n\n在这里，`object` 是被同步对象的引用。`synchronized` 块确保只有当当前线程成功进入 `object` 的监视器（monitor）时，对\
  \ `object` 成员方法的调用才会发生。\n\n### 示例 12.10\n前一个示例的替代版本，在 `run()` 方法中使用 `synchronized`\
  \ 块：\n\n```java\nclass A\n{\n    void display(String msg)\n    {\n        System.out.print(\"\
  [\" + msg);\n        try\n        {\n            Thread.sleep(1000);\n        }\n\
  \        catch(InterruptedException e)\n        {\n            System.out.println(e);\n\
  \        }\n        System.out.println(\"]\");\n    }\n}\nclass B implements Runnable\n\
  {\n    A obj;\n    String msg;\n    Thread t;\n    B(A obj1, String m)\n    {\n\
  \        msg = m;\n        obj = obj1;\n        t = new Thread(this);\n        t.start();\n\
  \    }\n    public void run()\n    {\n        synchronized(obj)\n        {\n   \
  \         obj.display(msg);\n        }\n    }\n}\nclass Synch3\n{\n    public static\
  \ void main(String[])\n    {\n        A a1 = new A();\n        B b1 = new B(a1,\"\
  Hello\");\n        B b2 = new B(a1,\"World\");\n        B b3 = new B(a1,\"Matrix\"\
  );\n    }\n}\n```\n输出：\n`[Hello][World][Matrix]`\n\n### 多线程在不同对象上调用同一方法：示例 12.1\n\
  线程可以并发地对同一类的不同对象调用同一个 `synchronized` 实例方法，每个对象都有一个不同的锁。这将再次导致输出混杂。\n\n```java\n\
  class A\n{\n    synchronized void display(String msg)\n    {\n        System.out.print(\"\
  [\" + msg);\n        try\n        {\n            Thread.sleep(1000);\n        }\n\
  \        catch(InterruptedException e)\n        {\n            System.out.println(e);\n\
  \        }\n        System.out.println(\"]\");\n    }\n}\nclass B implements Runnable\n\
  {\n    A obj;\n    String msg;\n    Thread t;\n    B(A obj1, String m)\n    {\n\
  \        msg = m;\n        obj = obj1;\n        t = new Thread(this);\n        t.start();\n\
  \    }\n    public void run()\n    {\n        obj.display(msg);\n    }\n}\nclass\
  \ Synch4\n{\n    public static void main(String[])\n    {\n        A a1 = new A();\n\
  \        A a2 = new A();\n        A a3 = new A();\n        B b1 = new B(a1,\"Hello\"\
  );\n        B b2 = new B(a2,\"World\");\n        B b3 = new B(a3,\"Matrix\");\n\
  \    }\n}\n```\n输出：\n`[Hello][World][Matrix]`\n\n### 使用同步方法：示例 12.2\n在下面的示例中，尽管我们在不同的对象上调用了\
  \ `display()` 方法，但输出并没有混杂。这是因为 `display()` 是 `static` 的，因此锁是整个类 `A` 获取的，而不是针对单个对象。\n\
  \n```java\nclass A\n{\n    static synchronized display(String msg)\n    {\n    \
  \    System.out.print(\"[\" + msg);\n        try\n        {\n            Thread.sleep(1000);\n\
  \        }\n        catch(InterruptedException e)\n        {\n            System.out.println(e);\n\
  \        }\n        System.out.println(\"]\");\n    }\n}\nclass B implements Runnable\n\
  {\n    A obj;\n    String msg;\n    Thread t;\n    B(A obj1, String m)\n    {\n\
  \        msg = m;\n        obj = obj1;\n        t = new Thread(this);\n        t.start();\n\
  \    }\n    public void run()\n    {\n        obj.display(msg);\n    }\n}\nclass\
  \ Synch5\n{\n    public static void main(String[])\n    {\n        A a1 = new A();\n\
  \        A a2 = new A();\n        A a3 = new A();\n        B b1 = new B(a1,\"Hello\"\
  );\n        B b2 = new B(a2,\"World\");\n        B b3 = new B(a3,\"Matrix\");\n\
  \    }\n}\n```\n\n\n\n```java\nA a1 = new A();\nA a2 = new A();\nA a3 = new A();\n\
  B b1 = new B(a1, \"Hello\");\nB b2 = new B(a2, \"World\");\nB b3 = new B(a3, \"\
  Matrix\");\n```\n\nOutput:\n```\n[Hello]\n[World]\n[Matrix]\n```\n\n## 线程间通信\n\n\
  如前所述，多线程通过将我们的任务划分为离散的逻辑单元，取代了事件循环编程。线程还证明了另一个次要优势：它们消除了轮询。轮询通常通过循环实现，该循环用于反复检查某些条件。一旦条件为真，就会采取相应的行动。\n\
  \n这浪费了 CPU 周期。例如，考虑经典的队列问题，其中一个线程生产数据，而另一个线程消费这些数据。为了让问题更具交互性，假设生产者必须等待消费者完成后才能生成更多数据。在轮询系统中，消费者在等待生产者生产数据时会浪费大量的\
  \ CPU 周期。一旦生产者完成，它就会开始轮询，再次浪费更多的 CPU 周期来等待消费者完成，以此此类推。\n\n为了避免轮询，Java 通过 `wait()`、`notify()`\
  \ 和 `notifyAll()` 方法包含了一种优雅（智能）的进程间通信机制。这些方法在 `Object` 类中实现为 `final` 方法，因此所有类都拥有它们。这三个方法只能在\
  \ `synchronized` 上下文中调用。使用这些方法有某些规则。\n\n- `wait()` 告诉调用线程放弃监视器并睡眠，直到其他线程进入同一个监视器并调用\
  \ `notify()`。\n- `notify()` 唤醒在同一个对象上调用过 `wait` 的线程（通常是第一个调用的线程）。\n- `notifyAll()`\
  \ 唤醒所有在同一个对象上调用过 `wait()` 的线程。通常，优先级最高的线程将首先运行。\n\n这些方法在 `Object` 类中声明，如下：\n\n```java\n\
  final void wait() throws InterruptedException\nfinal void notify()\nfinal void notifyAll()\n\
  ```\n\n### 示例 12.13\n\n以下示例程序错误地实现了一个简单的生产者/消费者问题。它由四个类组成：`Q`，我们正尝试同步的队列；`Producer`，产生队列条目的线程对象；`Consumer`，消费队列条目的线程对象；以及\
  \ `PC`，创建单个 `Q`、`Producer` 和 `Consumer` 的微型类。\n\n```java\nclass Q {\n    int n;\n\
  \    synchronized int get() {\n        System.out.println(\"Got:\"+n);\n       \
  \ return n;\n    }\n    synchronized void put(int n) {\n        this.n=n;\n    \
  \    System.out.println(\"Put:\"+n);\n    }\n}\nclass Producer implements Runnable\
  \ {\n    Q q1;\n    Producer(Q q2) {\n        q1=q2;\n        new Thread(\"Producer\"\
  ).start();\n    }\n    public void run() {\n        int i=0;\n        while(true)\
  \ {\n            q1.put(++i);\n        }\n    }\n}\nclass Consumer implements Runnable\
  \ {\n    Q q1;\n    Consumer(Q q2) {\n        q1=q2;\n        new Thread(this,\"\
  Consumer\").start();\n    }\n    public void run() {\n        while (true) {\n \
  \           q1.get();\n        }\n    }\n}\nclass PC {\n    public static void main(String\
  \ args[]) {\n        Q q1=new Q();\n        new Producer(q1);\n        new Consumer(q1);\n\
  \        System.out.println(\"Press Control-C to stop\");\n    }\n}\n```\n\n尽管 `Q`\
  \ 上的 `put()` 和 `get()` 方法是同步的，但没有任何东西能阻止生产者超过消费者，也没有东西能阻止消费者两次消费同一个队列值。因此，我们可能会得到所示的错误输出：\n\
  \nOutput:\nPress Control-C to stop\nPut :1\nPut :2\nPut:3\nPut:4\nPut:5\nPut:6\n\
  Put:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nPut:8\nPut:9\nPut:10\n\
  Put:11\nPut:12\nPut:13\nPut:14\nPut:15\nGot:15\nGot:15\nGot:15\nGot:5\nGot:5\nGot:5\n\
  \n在 Java 中编写此程序的正确方法是使用 `wait()` 和 `notify()` 进行双向信号，如下所示：\n\n```java\nclass Q {\n\
  \    int n;\n    boolean valueSet=false;\n    synchronized int get () {\n      \
  \  if(!valueSet) {\n            try {\n                wait();\n            } catch\
  \ (InterruptedException e) {\n                System.out.println(e);\n         \
  \   }\n        }\n        System.out.println(\"Got :\" + n);\n        valueSet =\
  \ false;\n        notify();\n        return n;\n    }\n    synchronized void put\
  \ (int n) {\n        if(valueSet) {\n            try {\n                wait();\n\
  \            } catch (InterruptedException e) {\n                System.out.println(e);\n\
  \            }\n        }\n    }\n}\n```\n\n\n\n```java\n        }\n           \
  \ this.n=n;\n            valueSet =true;\n            System.out.println(\"Put :\"\
  \ + n);\n            notify ();\n        }\n    }\nclass Producer implements Runnable\
  \ {\n    Q q1;\n\n    Producer (Q q2) {\n        q1 = q2;\n        new Thread(this,\
  \ \"Producer\").start ();\n    }\n\n    public void run ( ) {\n        int i = 0;\n\
  \        while (true) {\n            q1.put (++i);\n        }\n    }\n}\nclass Consumer\
  \ implements Runnable {\n    Q q1;\n\n    Consumer (Q q2) {\n        q1 =q2;\n \
  \       new Thread (this, \"consumer\").start ( );\n    }\n\n    public void run\
  \ ( ) {\n        while (true) {\n            q1.get ( );\n        }\n    }\n}\n\
  class PC2 {\n    public static void main (String args []) {\n        System.out.println(\"\
  Press Control-C\");\n        Q q1 = new Q( );\n        new Producer(q1);\n     \
  \   new Consumer(q1);\n    }\n}\n```\n输出:\n```\nPress Control-C\nPut:1\nGot:1\n\
  Put:2\nGot:2\nPut:3\nGot:3\nPut:4\nGot:4\nPut:5\nGot:5\n```\n\n## 死锁 (Deadlock)\n\
  \n在多任务处理中我们需要避免的一种特殊类型错误是死锁。当两个线程对一对同步对象形成循环依赖时，就会死锁。例如，假设一个线程进入了对象 `X` 的监控器，另一个线程进入了对象\
  \ `Y` 的监控器。如果 `X` 中的线程尝试调用 `Y` 上的任何同步方法，它将如预期地阻塞。然而，如果 `Y` 中的线程反过来尝试调用 `X` 上的任何同步方法，该线程将永远等待，因为为了访问\
  \ `X`，它必须释放对 `Y` 的锁，以便第一个线程完成操作。死锁是一个很难调试的错误，原因有两个：\n\n(i) 通常情况下，它只在两个线程的时间切片方式恰好合适时极少发生。\n\
  (ii) 它可能涉及两个以上的线程和两个以上的同步对象。\n\n### 示例 12.15\n\n```java\nclass A {\n    synchronized\
  \ void foo(B b1) {\n        System.out.println(\"Method called and then blocked\"\
  );\n        try {\n            Thread.sleep(100);\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e.getMessage());\n        }\n        System.out.println(\"\
  Trying to call b1.last()\");\n        b1.last();\n    }\n\n    synchronized void\
  \ last() {\n        System.out.println(\"This will not be printed\");\n    }\n}\n\
  class B {\n    synchronized void bar(A a1) {\n        System.out.println(\"Method\
  \ bar called and then blocked\");\n        try {\n            Thread.sleep(100);\n\
  \        } catch(InterruptedException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n        System.out.println(\"Trying to call a1.last()\");\n        a1.last();\n\
  \    }\n\n    synchronized void last() {\n        System.out.println(\"This will\
  \ not be printed\");\n    }\n}\nclass DeadLock implements Runnable {\n    A a1=\
  \ new A();\n    B b1 = new B();\n\n    DeadLock() {\n        Thread t = new Thread(this);\n\
  \        t.start();\n        a1.foo(b1);\n    }\n\n    public void run() {\n   \
  \     b1.bar(a1);\n    }\n\n    public static void main(String args[]) {\n     \
  \   new DeadLock();\n    }\n}\n```\n输出:\n```\nMethod called and then blocked\nMethod\
  \ bar called and then blocked\nTrying to call b1.last()\nTrying to call a1.last()\n\
  ```\n\n### Java 1.1 及早版本的挂起、恢复和停止线程\n\n在 Java 2 之前，`suspend()` 和 `resume()` 是 `Thread`\
  \ 类定义的，用于暂停和重启线程执行。它们的格式所示：\n\n```java\nfinal void suspend( )\nfinal void resume(\
  \ )\n```\n\n#### 示例 12.16:\n\n```java\nclass A implements Runnable {\n    String\
  \ name;\n    Thread t;\n\n    A(String threadname) {\n        name = threadname;\n\
  \        t = new Thread(this, name);\n        System.out.println(\"Child: \" + t);\n\
  \        t.start();\n    }\n\n    public void run() {\n        for(int i=1; i<=30;i++)\
  \ {\n            System.out.println(name + \": \" + i);\n            try {\n   \
  \             Thread.sleep(100);\n            }\n        }\n    }\n}\n```\n\n\n\n\
  \n```java\n        } catch(InterruptedException e) {\n            System.out.println(e);\n\
  \        }\n    }\n    System.out.println(name + \" exiting\");\n}\n}\nclass SuspendResume\n\
  {\n    public static void main(String args[])\n    {\n        A ob1 = new A(\"One\"\
  );\n        A ob2 = new A(\"Two\");\n        try\n        {\n            Thread.sleep(100);\n\
  \            ob1.t.suspend();\n            System.out.println(\"Suspending one\"\
  );\n            Thread.sleep(100);\n            ob1.t.resume();\n            System.out.println(\"\
  Resuming one\");\n            ob2.t.suspend();\n            System.out.println(\"\
  Suspending two\");\n            Thread.sleep(1000);\n            ob2.t.resume();\n\
  \            System.out.println(\"Resuming two\");\n        }\n        catch(InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        try\n        {\n\
  \            System.out.println(\"Waiting for threads to finish\");\n          \
  \  ob1.t.join();\n            ob2.t.join();\n        }\n        catch(InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n    }\n}\n```\n\n### 输出\n\
  ```text\nChild: Thread[One,main]\nChild: Thread[Two,main]\nOne: 1\nTwo: 2\nOne:\
  \ 3\nTwo: 4\nOne: 5\nTwo: 6\nOne: 7\nTwo: 8\nOne: 9\nTwo: 10\nSuspending one\nTwo:\
  \ 12\nTwo: 13\nTwo: 14\nTwo: 15\nResuming one\nOne: 16\nOne: 17\nOne: 18\nOne: 19\n\
  Resuming two\nSus: one\nSus21\nTwo: 22\nOne: 23\nTwo: 24\nOne: 25\nTwo: 26\nOne:\
  \ 27\nTwo: 28\nOne: 29\nTwo: 30\nOne: \n```\n\n### 注意\n该类还定义了一个名为 `stop()` 的方法来停止线程。其签名所示：`final\
  \ void stop()`。一旦线程被停止，就无法使用 `resume()` 重新启动。在 Java 中挂起和停止线程已被废用。\n\n## 示例\n```java\n\
  class A implements Runnable\n{\n    String name;\n    Thread t;\n    boolean suspendFlag;\n\
  \    A(String threadname)\n    {\n        name = threadname;\n        t = new Thread(this,\
  \ name);\n        System.out.println(\"Child Thread: \" + t);\n        suspendFlag\
  \ = false;\n        t.start();\n    }\n    void mysuspend()\n    {\n        suspendFlag\
  \ = true;\n    }\n    synchronized void myresume()\n    {\n        suspendFlag =\
  \ false;\n        notify();\n    }\n    public void run()\n    {\n        for(int\
  \ i=1;i<=5;i++)\n        {\n            System.out.println(name + \": \" + i);\n\
  \            try\n            {\n                Thread.sleep(200);\n          \
