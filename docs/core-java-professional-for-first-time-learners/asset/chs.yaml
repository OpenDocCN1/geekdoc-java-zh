  ### 适配器（Adapters）：\n\n某些事件监听器接口包含多个方法。最大的接口 `WindowListener` 拥有七个方法。假设我们想要捕获 `windowClosing()`\
  \ 事件，以便执行关闭窗口的代码。虽然我们在实现 `WindowListener` 的类中只需要 `windowClosing()` 这一个方法，但我们必须为所有方法提供空位实现。\n\
  \n`java.awt.event` 包提供了几个适配器类（adapter classes），每个类对应一个定义了多个单一方法的监听器接口。\n\n适配器简单来说就是一个通过提供“什么都不做”的方法来实现一个接口的类。例如，`WindowAdapter`\
  \ 类实现了拥有七个方法的 `WindowListener` 接口。\n\n| 适配器类 | 监听器接口 |\n| :--- | :--- |\n\n\n\n\n\
  \n### 接口\n- `ContainerAdapter` / `ContainerListener`\n- `FocusAdapter` / `FocusListener`\n\
  - `KeyAdapter` / `KeyListener`\n- `MouseAdapter` / `MouseListener`\n- `MouseMotionAdapter`\
  \ / `MouseMotionListener`\n- `WindowAdapter` / `WindowListener`\n\n### 示例 18.6 使用\
  \ `WindowAdapter` 类。\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  class A6\n{\n    public static void main (String args[])\n    {\n        Frame f=\
  \ new Frame();\n        f.setLayout(new FlowLayout());\n        f.setSize(300,300);\n\
  \        f.addWindowListener(new B( ));\n        f.setVisible(true);\n    }\n}\n\
  class B extends WindowAdapter\n{\n    public void windowClosing(WindowEvent we)\n\
  \    {\n        System.out.print(\"Window\");\n        Frame f = (Frame) we.getWindow(\
  \ );\n        f.dispose();\n    }\n}\n```\n\n### `InputEvent` 类\n这是所有组件级事件的根事件类。输入事件在被其源组件正常处理之前，会传递给监听器。这允许监听器和子类“消费”事件，从而使源组件不会其默认方式处理它们。例如，在\
  \ `Button` 组件上消费鼠标事件将防止 `Button` 被激活。\n\n### 方法\n- `void consume()`: 消费此事件，使其不会被产生它的源组件按默认方式处理。\n\
  - `int getModifiers()`: 返回此事件的修饰符掩码（Modifier mask）。\n- `int getModifiersEx()`: 返回此事件的扩展修饰符掩码。\n\
  - `static String getModifiersExText(int modifiers)`: 返回描述扩展修饰键的字符串，如“shift”、“Ctrl\
  \ + Shift”等。\n- `long getWhen()`: 返回此事件发生的时间戳。\n- `boolean isAltDown()`: 返回此事件中的\
  \ `Alt` 修饰键是否被按下。\n- `boolean isConsumed()`: 返回此事件是否已被消费。\n- `boolean isControlDown()`:\
  \ 返回此事件中的 `Control` 修饰键是否被按下。\n- `boolean isShiftDown()`: 返回此事件中的 `shift` 修饰键是否被按下。\n\
  \n### `MouseEvent` 类\n这是 `InputEvent` 的子类。此事件表示组件中发生了鼠标动作。当且仅当鼠标光标位于组件子类的被遮挡部分或顶层窗口上方时，则认为鼠标动作发生在特定组件中。此事件既用于鼠标事件（点击、按下、释放），也用于移动移动事件（移动和拖动）。\n\
  \n### 方法\n- `int getButton()`: 返回哪个鼠标键（如果有的话）处于被按下状态。\n- `int getClickCount()`:\
  \ 返回与此事件相关的鼠标点击次数。\n- `static String getModifiersText(int modifiers)`: 返回描述事件期间被按下的修饰键的字符串，如“Shift”或“Ctrl\
  \ + shift”。\n- `point getPoint()`: 返回事件相对于源组件的 x, y 位置。\n- `int getX()`: 返回事件相对于源组件的水平\
  \ x 位置。\n- `int getY()`: 返回事件相对于源组件的垂直方向 y 位置。\n- `boolean isPopupTrigger()`: 返回此鼠标事件是否为该平台的弹出菜单触发事件。\n\
  \n注意：弹出菜单在不同系统上的触发方式不同。因此，为了实现良好的跨平台功能，应该在 `mousePressed` 和 `mouseReleased` 中都检查\
  \ `isPopupTrigger()`。\n\n#### 处理鼠标事件：示例 18.7\n\n```java\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\nclass A7\n{\n    public static void main(String args[])\n \
  \   {\n        Frame f= new Frame();\n        f.setLayout(new FlowLayout());\n \
  \       f.setSize(300,30);\n        Button b1 = new Button(\"Push Me\");\n     \
  \   b1.addMouseListener(new B());\n        b1.addMouseMotionListener(new C());\n\
  \        b1.addActionListener(new D());\n        f.add(b1);\n        f.setVisible(true);\n\
  \    }\n}\nclass B implements MouseListener\n{\n    public void mouseEntered(MouseEvent\
  \ me)\n    {\n        System.out.println(\"Mouse Entered...\");\n        System.out.println(me.getX());\n\
  \        System.out.println(me.getY());\n    }\n    public void mouseExited(MouseEvent\
  \ me)\n    {\n        System.out.println(\"Mouse Exited...\");\n        Point p1=me.getPoint();\n\
  \        System.out.println(p1.x);\n        System.out.println(p1.y);\n    }\n \
  \   public void mousePressed(MouseEvent me)\n    {\n        System.out.println(\"\
  Mouse pressed...\");\n        int ms = me.getModifiersEx();\n        String s =\
  \ me.getModifiersExText(ms);\n        System.out.println(s);\n    }\n    public\
  \ void mouseReleased(MouseEvent me)\n    {\n        System.out.println(\"Mouse Released...\"\
  );\n        System.out.println(\"ClickCount->\" + me.getClickCount());\n    }\n\
  \    public void mouseClicked(MouseEvent me)\n    {\n        System.out.println(\"\
  Mouse Clicked...\");\n        System.out.println(\"Button->\"+me.getButton());\n\
  \    }\n}\nclass C implements MouseMotionListener\n{\n}\n```\n\n\n\n\n\n```java\n\
  public void mouseMoved(MouseEvent me) {\n    System.out.println(\"Mouse Moved...\"\
  );\n}\n\npublic void mouseDragged(MouseEvent me) {\n    System.out.println(\"Mouse\
  \ Dragged...\");\n}\n\nclass D implements ActionListener {\n    public void actionPerformed(ActionEvent\
  \ ae) {\n        System.out.println(\"Button Pressed...\");\n    }\n}\n```\n\n##\
  \ ActionEvent 类\n\n它是一种语义化事件，表示发生了一个由组件定义的动作。这种高级事件是由组件（如 `Button`）在发生组件特定动作时（例如被按下）生成的。该事件会被传递给每个使用组件的\
  \ `addActionListener` 方法注册的用以接收此类事件的 `ActionListener` 对象。\n\n实现 `ActionListener`\
  \ 接口的对象在事件发生时会获取到此 `ActionEvent`。因此，监听器无需处理单个鼠标移动和鼠标点击的细节，而是可以处理诸如“按钮被按下”之类的“有意义的”（语义）事件。\n\
  \n**注意**：要使用键盘在 `Button` 上触发 `ActionEvent`，请使用空格键。\n\n### Methods\n\n- `String getAction(Command\
  \ command)`：返回与此动作关联的命令字符串。\n- `int getModifiers()`：返回在此事件发生期间按下的修饰键。\n- `long getWhen()`：返回事件发生的时间戳。\n\
  \n### 示例 18.8\n\n此说明了我们如何在 `ActionEvent` 发生时识别键修饰符。\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\n\npublic class KeyModifier extends ActionListener {\n\
  \    Button b;\n\n    KeyModifier() {\n        b = new Button(\"Button\");\n   \
  \     b.addActionListener(this);\n        setLayout(new FlowLayout());\n       \
  \ add(b);\n        setBounds(100,100,200,200);\n        setVisible(true);\n    }\n\
  \n    public static void main(String args[]) {\n        new KeyModifier();\n   \
  \ }\n\n    public void actionPerformed(ActionEvent ae) {\n        System.out.println(\"\
  Button Pressed\");\n        int ms = ae.getModifiers();\n        if ((ms & InputEvent.CTRL_DOWN_MASK)\
  \ != 0) {\n            System.out.println(\"CTRL key was pressed\");\n        }\n\
  \        if ((ms & InputEvent.SHIFT_DOWN_MASK) != 0) {\n            System.out.println(\"\
  Shift Key was pressed\");\n        }\n        if ((ms & InputEvent.ALT_DOWN_MASK)\
  \ != 0) {\n            System.out.println(\"ALT key was pressed\");\n        }\n\
  \    }\n}\n```\n\n## 处理多个命令\n\nAction 事件是最简单的。当我们发现滚动条发送了调整事件时，显而易见的问题是：“现在滚动条的值是多少？”当我们发现鼠标被点击时，自然会想：“鼠标的\
  \ x 和 y 坐标是什么？”但当我们发现一个按钮发送了事件时，似乎没有任何额外的信息需要寻找了；按钮被点击了，这似乎就是全部了。\n\n然而，`ActionEvent`\
  \ 仍然关联着额外的一条信息。这条信息是一个字符串，被称为命令（command）。我们可以通过 `getAction()` 方法提取事件命令。如果 `ActionEvent`是由文本字段发送的，`getAction()`\
  \ 将返回文本字段当前的内容（当用户输入 `Enter` 键时，文本字段会发送 `ActionEvent`）。如果 `ActionEvent` 是由按钮发送的，默认行为是\
  \ `getAction()` 返回按钮标签的字符串。然而，我们可以通过调用 `setAction(String)` 方法显式设置按钮的命令。\n\n```java\n\
  Button btn = new Button(\"Hello\");\nbtn.setAction(\"Hello\");\n```\n\n当按钮的监听器需要决定如何对事件做出反应时，命令的优势就显而易见了。单个监听器作为多个组件的监听器是很常见的；在我们的上下文中，单个对象可能是许多按钮的监听器。在这种情况下，对象的\
  \ `actionPerformed()` 方法必须判断是哪个按钮被触发。下面的示例演示了这一点：\n\n### 示例 18.9\n\n```java\nimport\
  \ java.awt.*;\nimport java.awt.event.*;\n\nclass ButtonRefTest {\n    Button b1,\
  \ b2, b3;\n\n    ButtonRefTest() {\n        Frame f = new Frame();\n        f.setLayout(new\
  \ FlowLayout());\n        f.setSize(30,30);\n        b1 = new Button(\"Push Me\"\
  );\n        b2 = new Button(\"Click Me\");\n        b3 = new Button(\"Hit Me\");\n\
  \        add(b1);\n        add(b2);\n        add(b3);\n        B obj = new B(b1,\
  \ b2, b3);\n        b1.addActionListener(obj);\n        b2.addActionListener(obj);\n\
  \        b3.addActionListener(obj);\n        f.setVisible(true);\n    }\n\n    public\
  \ static void main(String args[]) {\n        new ButtonRefTest();\n    }\n}\n\n\
  class B implements ActionListener {\n    Button b4, b5, b6;\n\n    B(Button b1,\
  \ Button b2, Button b3) {\n        b4 = b1;\n        b5 = b2;\n        b6 = b3;\n\
  \    }\n\n    public void actionPerformed(ActionEvent ae) {\n        Button b =\
  \ (Button)ae.getSource();\n    }\n}\n```\n\n\n\n\n\n```java\nif(b==b4) {\n    System.out.println(\"\
