  \ `Java` 程序的结构。\n\n## 编程练习\n\n1. 编写一个程序计算整数的平均值。\n2. 编写一个程序在不使用第三变量的情况下交换两个数字。\n\
  3. 编写一个程序将小时、分钟转换为总秒。\n4. 编写一个程序计算给定圆的面积和周长。\n\n## 第 2 章 (Java 语言)\n\n### 标记 (Tokens)\n\
  \n最小独立单元被称为标记，例如 `keywords`（关键字）、`identifiers`（标识符）、`strings`（字符串）和 `Operators`（运算符）。\n\
  \nA. `Keywords` 是语言的保留名称，不能用作变量、函数等的名称。\nB. `Identifier` 指 `variable`（变量）、`arrays`（数组）、`classes`（类）、`Interfaces`（接口）等的名称。\n\
  C. `Constants/Literals`（常量/字面量）指的是程序中无法更改的固定值。\nD. `Operators` 是作用于 `variable` 和\
  \ `constants` 的特殊符号，并构成一个 `expression`（表达式）。\nE. `Separators`（分隔符）是用于分隔语句的特殊字符，如\
  \ `( )`、`{ }`、`[ ]`、`,`。\n\n### 关键字 (Keywords)\n\n`abstract`, `assert`, `boolean`,\
  \ `break`, `byte`, `case`, `catch`, `char`, `class`, `continue`, `default`, `do`,\
  \ `else`, `extends`, `final`, `finally`, `float`, `goto`, `if`, `implements`, `instanceof`,\
  \ `int`, `interface`, `long`, `native`, `package`, `private`, `protected`, `return`,\
  \ `short`, `static`, `super`, `synchronized`, `this`, `throws`, `try`, `transient`,\
  \ `void`, `volatile`.\n\n\n\n\n\nJava 提供了丰富的运算符集合。操作符将常量、变量和子表达式组合成表达式。Java 中的大多数运算符的行为与\
  \ C/C++ 相似，但存在少量细微差异，本文将在此介绍。\n\n运算符可以分为以下几类：\n\n### 算术运算符 (`+`, `-`, `*`, `/`,\
  \ `%`)\n- 这些运算符与 C/C++ 中的相同。\n- `%` 运算符也可以作用于浮点数。\n- 当二元运算符应用于两个不同类型的操作数时，较低类型的操作数会在评估之前转换为较高类型，结果的类型将与较高类型的操作数类型相同。\n\
  - 对于 `int` 类型，除以零或取模会导致 `ArithmeticException`（运行时错误），但对于浮点数则不会。\n- 当我们对 `int` 应用算术运算符且结果超出\
  \ `int` 取值范围时，额外的高位位将被截断，此新值将赋值给接收结果的变量；但在浮点类型中，溢出将导致 `Infinity` 或 `–Infinity`，下溢则将导致\
  \ `0`。\n\n### 递增和递减运算符 (`++`, `--`)\n这些运算符与 C/C++ 中的相同。\n```java\nint a=5,b;\nb\
  \ = ++a*++a;\nSystem.out.print(b); //42\na = 5;\nSystem.out.print(++a*++a); //42\n\
  ```\n\n### 关系运算符 (`<`, `>`, `<=`, `>=`, `instanceof`)\n这些运算符与 C/C++ 相同，但 `<`, `<=`,\
  \ `>`, `>=` 不能应用于布尔类型和引用类型。\n\n### instanceof 运算符\n`instanceof` 运算符用于测试对象的类。`instanceof`\
  \ 运算符的通用形式为：\n```\nif(object instanceof type)\n```\n在这里，`object` 是一个类的实例，`type`\
  \ 是一个类类型。如果 `object` 是指定类型的实例或该指定类型任何子类的实例，则 `instanceof` 运算符返回 `true`，否则结果为 `false`。\n\
  \n### 赋值运算符 (`=`, `+=`, `-=`, `*=`, `/=`, `%=`)\n这些运算符与 C/C++ 中的相同。\n\n### 相等运算符\
  \ (`==`, `!=`)\n这些运算符与 C/C++ 中的相同。\n\n### 逻辑运算符 (`&&`, `||`, `!`)\n这些运算符与 C/C++\
  \ 中的相同。\n\n### 条件运算符 (`? :`)\n该运算符与 C/C++ 中的相同。\n\n### 位运算运算符 (`&`, `|`, `^`, `~`,\
  \ `<<`, `>>`, `>>>`)\n这些运算符与 C/C++ 相同，移位运算符除外。移位运算符仅作用于整数类型。\n\n### 左移 (`<<`) 运算符\n\
  要获得 `<<` 运算符的结果，左侧操作数中的位将根据右侧操作数指定的位数左移，右侧的空位用零 填充。向左移 1 位等同于乘以 2。结果的符号可能与左侧操作数的符号不同。这可能是因为符号取决于最左位，而该位可能会从\
  \ 0 变为 1 或从 1 变为 0，从而改变符号。\n示例 `b = a << 2;`。要获得 `b` 的值，将 `a` 中的位左移 2 位，并用 0 填充右侧\
  \ 2 位。\n\n### 右移 (`>>`) 运算符（带符号）\n要获得 `>>` 运算符的结果，左侧操作数的位将根据右侧操作数指定的位数右移，左侧的空位用符号位填充。向右移\
  \ 1 位等同于除以 2。该运算符永远不会改变结果的符号，即与左侧操作数的符号相同。\n示例 `b = a >> 2;`。要获得 `b` 的值，将 `a` 中的位右移\
  \ 2 位，并用符号填充右侧 2 位（如果 `a` 为正则为 0，`a` 为负则为 1）。\n\n### 零填充右移 (`>>>`) 运算符（无符号）\n要获得\
  \ `>>>` 运算符的结果，左侧操作数的位将根据右侧操作数指定的位数右移，左侧的空位用 0 填充。向右移 1 位等同于除以 2。如果发生了移位，结果将始终为正数，因为最右位将变为\
  \ 0。\n示例 `b = a >>> 2;`。要获得 `b` 的值，将 `a` 中的位右移 2 位，并用 0 填充右侧 2 位。\n\n### 运算符优先级\n\
  | 级别 | 运算符 | 说明 | 结合性 |\n| :--- | :--- | :--- | :--- |\n| 1 | `[]` | 函数调用、下标 | 从左到右\
  \ |\n| 2 | `++--~!` | 递增、递减、位取反 | 从右到左 |\n| 3 | `*/%` | 乘、除、取模 | 从左到右 |\n| 4 | `+-`\
  \ | 加、减 | 从左到右 |\n| 5 | `>>><<` | 位右移、位左移、无符号位右移 | 从左到右 |\n| 6 | `>=instanceof`\
  \ | 大于等于、小于等于 | 从左到右 |\n| 7 | `=!=` | 等于、不等于 | 从左到右 |\n| 8 | `&` | 按位位与 | 从左到右 |\n\
  | 9 | `^` | 位异异 | 从左到右 |\n| 10 | `\\|` | 按位或 | 从左到右 |\n| 11 | `&&` | 逻辑与、短路与 | 从左到右\
  \ |\n| 12 | `\\|\\|` | 逻辑或、短路或 | 从左到右 |\n| 13 | `?:` | 条件运算符（三元） | 从左到右 |\n| 14\
  \ | `=+=-*/%=&=^>>=>>=` | 赋值、减赋值、乘赋值、除赋值、取模赋值、位与赋值、位或赋值、位右移赋值、位左移赋值、复合赋值 | 从右到左\
  \ |\n\n### 分隔符\n| 符号 | 名称 | 用途 |\n| :--- | :--- | :--- |\n| `()` | 括号 | 用于在方法定义和调用中包含参数列表。也用于定义优先级、在控制语句中包含表达式以及类型转换。\
  \ |\n| `{}` | 大括号 | 用于初始化数组，也用于定义语句块、类、方法和局部作用域。 |\n| `[]` | 方括号 | 用于声明数组。 |\n|\
  \ `;` | 分号 | 结束语句。 |\n| `,` | 逗号 | 分隔变量声明中的标识符，也用于连接语句。 |\n| `.` | 点 | 用于分隔包名和子包。也用于分隔变量或方法。\
  \ |\n\n 数据类型\nJava 中的数据类型大致分为两类：\n\n### 1. 基本数据类型/ 简单类型\nJava 是一门面向对象的语言，但基本数据类型不是对象。出于性能考虑\
  \ Java 保留了它们。它们是我们程序中定义的其他类型的基础。Java 是一种强类型语言。\n\n**整数类型**\n- `byte` (1 字节)：范围 -128\
  \ 到 127\n- `short` (2 字节)：范围 -32768 到 32767\n- `int` (4 字节)：范围 -2147483648 到 2147483647\n\
  - `long` (8 字节)：范围 -922337203685475808 到 922337203685475807\n包含 `byte`、`short`、`int`\
  \ 的表达式会自动提升为 `int`。\n\n**浮点数据类型**\n- `float` (4 字节)：范围 1.401298464324817E-45f 到\
  \ 3.4028234663852886E38f\n- `double` (8 字节)：范围 4.9E-324d 到 1.7976931348623157E308d\n\
  \n**布尔类型**: boolean\n\n**字符数据类型**\n- `char` (2 字节)：范围 0 到 65535\nUnicode 集中前 128\
  \ 个字符与 7 位 ASCII 字符集相同，前 256 个字符对应扩展 ASCII（8 位 ISO Latin-1）字符集。\nJava 字符也可以用于整数表达式。当字符作为整数表达式的一部分时，使用其\
  \ Unicode 值。\n\n### 2. 非基本数据类型/ 派生数据类型或引用\n\n\n\n\n\n# 数据类型\n\n引用数据类型也称为派生数据类型，因为它们派生自原始数据类型。\n\
  \n## 类\n1. 内置/库类\n2. 用户定义类\n\n### 接口\n3. 内置/库类\n4. 用户定义类\n\n# 数组\n数组在 Java 中也被视为对象。\n\
  \nJava 的自动转换会在以下情况发生：\n1. 两种类型是的。\n2. 目标类型大于源类型。\n\n## 变量\n变量是用于存储值的内存位置名称。在向变量中存储值之前，必须声明变量。或者说变量是主内存内部的内存位置，我们可以在其中存储数据或值。\n\
  \n变量有三种：\n\n### 局部变量\n局部变量用于代码块或方法内部。局部变量（也称为自动变量）默认不初始化。局部变量在第一次使用之前必须显式初始化，否则将出现编译时错误“变量可能未初始化”。\n\
  \n示例\n```java\nint a,b=5;\n\nif(b>2)\n{\n    a = b;\n}\n\nSystem.out.print(a);\n\
  ```\n在上述程序中，如果 `if` 条件为假，则 `a` 的值未定义，因此编译器将给出错误“变量 a 可能未初始化”。\n\n在 Java 中，我们不能在内部块中定义与外部块同名的变量。\n\
  ```java\nint a=5;\n{\n    int a=7;             // Error\n}\n```\n\n### 实例变量\n实例变量用于定义对象的属性或状态。\n\
  \n### 类变量\n类变量用于定义属性/状态，这对该类的所有对象都是通用的。\n\n## Math 类库方法\n\n| 方法 | 描述 |\n| :--- |\
