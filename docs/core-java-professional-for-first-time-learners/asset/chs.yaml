  \ throws IOException` | |\n\n### FileOutputStream\n`FileOutputStream` 是 `OutputStream`\
  \ 类的直接类。要打开文件进行写入，我们只需创建一个 `FileOutputStream` 类的对象，并将文件名（直接或间接）作为参数。\n\n| 方法 | 描述\
