  - `String[] getSelectedItems()`：获取滚动列表中的选中项。\n- `void remove(int position)`：从滚动列表中删除指定位置的项。\n\
  - `void remove(String item)`：从列表中删除第一个指定的项。\n- `void removeAll()`：从列表中删除所有项。\n-\
  \ `void replaceItem(String newValue, int index)`：用新字符串替换滚动列表中指定索引处的项。\n- `void select(int\
  \ index)`：选中滚动列表中指定索引处的项。\n- `void setMultipleMode(boolean b)`：设置标志以决定此列表是否允许多选。\n\
