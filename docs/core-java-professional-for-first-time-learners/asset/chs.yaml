  Q\");\n    break;\n    case 4: System.out.print(\"R\");\n    default: System.out.print(\"\
  S\");\n}\n```\n哪些值会被打印？\na) P\nb) Q\nc) R\nd) S\n\n3. 假设下面的代码中 `val` 被定义为正整数：\n\
  ```java\nif( val > 4 )\n    System.out.println(\"Test A\");\nelse if( val > 9 )\n\
  \    System.out.println(\"Test B\");\nelse\n    System.out.println(\"Test C\");\n\
  ```\n哪些 `val` 的值会导致打印 \"Test C\"：\na) `val < 0`\nb) `val` 在 0 到 4 之间\nc) `val` 在\
  \ 4 到 9 之间\nd) `val > 9`\ne) `val = 0`\nf) 没有任何 `val` 值可以满足条件\n\n4. 对于代码：\n```java\n\
  m = 0;\nwhile( m++ < 2 )\n    System.out.println( m );\n```\n以下哪个被打印到标准输出？\na) 0\n\
  b) 1\nc) 2\nd) 3\ne) 什么都没有打印且抛出了异常\n\n5. 考虑下面的代码片段：\n```java\nouter: for( int i\
  \ = 1; i <3; i++ )\n    inner: for( j = 1; j < 3; j++ )\n    {\n        if( j==2\
  \ )\n            continue outer;\n        System.out.println( \"i = \" + i+\", j\
  \ = \" + j );\n    }\n```\n以下哪个会被打印到标准输出？\n(a) i = 1, j = 1\n\n\n\n\n(b) `i = 1,\
  \ j = 2`\n(c) `i = 1, j = 3`\n(d) `i = 2, j = 1`\n(e) `i = 2, j = 2`\n(f) `i = 2,\
  \ j = 3`\n(g) `i = 3, j = 1`\n(h) `i = 3, j = 2`\n\n答案: 1(c,d,e,f,g) 2(a,b) 3(b)\
  \ 4(b,c) 5(a,d)\n\n## 理论题\n\n1. Java 有 \"goto\" 吗？\n2. 什么是带标签循环？\n\n## 编程练习\n\n\
