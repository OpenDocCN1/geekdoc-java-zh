  \ f.add(ta4);\nf.add(ta5);\n\ntf1.setText(\"abc\");\nSystem.out.println(tf3.getText());\n\
  tf3.setEditable(false);\nf.setSize(800, 400);\nf.setVisible(true);\n```\n\n输出: ![](img/0081.jpeg)\n\
  \n### FileDialog\n\n此类类表示文件打开或保存对话框。文件对话框是一个模态对话框，这意味着只要对话框显示在屏幕上，来自其父框架的输入将专门定向到对话框。当用户指定文件或点击取消按钮时，对话框会自动移除。最有用的\
  \ `FileDialog` 构造函数具有以下形式：\n\n`FileDialog(Frame parent, String title, int mode)`\n\
  \n`parent` 是对话框出现的框架。`title` 字符串显示在对话框的标题栏中。`mode` 应该是以下之一：\n- `FileDialog.LOAD`\n\
  - `FileDialog.SAVE`\n\n在用户指定文件后，可以使用以下方法获取文件名或其目录：\n- `String getDirectory()`：获取此文件对话框选定的目录。\n\
  - `String getFile()`：获取此文件对话框选定的文件。\n\n### 示例 17.20\n```java\nimport java.awt.*;\n\
  public class FileDialogTest {\n    public static void main(String args[]) {\n  \
  \      Frame f=new Frame();\n        f.setLayout(new FlowLayout());\n        f.setSize(200,\
  \ 200);\n        f.setVisible(true);\n        Dialog fd=new Dialog(f, \"Load file\"\
  , Dialog.LOAD);\n        fd.setVisible(true);\n        System.out.println(fd.getFile());\n\
  \        System.out.println(fd.getDirectory());\n    }\n}\n```\n\n### ScrollPane\n\
  \n一个 `ScrollPane` 可以包含单个组件，该组件可能比滚动面板本身更高或更宽。如果容器大于滚动面板，那么滚动面板的默认行为是根据需要获取水平或垂直滚动条。\n\
  \n该类有两个构造函数：\n- `ScrollPane()`：创建一个滚动条策略为“按需”（as needed）的滚动面板容器。\n- `ScrollPane(int\
  \ scrollDisplayPolicy)`：创建一个具有指定滚动行为的新滚动面板。滚动显示策略应该是以下之一：\n  - `ScrollPane.SCROLLBARS_AS_NEEDED`（默认）\n\
  \  - `ScrollPane.SCROLLBARS_ALWAYS`\n  - `ScrollPane.SCROLLBARS_NEVER`\n\n下面列出的代码创建了一个具有默认（`AS_NEEDED`）滚动条行为的滚动面板。该滚动面板包含一个非常大的按钮；因此肯定需要滚动条。\n\
