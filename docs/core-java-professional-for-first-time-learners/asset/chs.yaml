  \n\n\n\n\n\n\n\n\n\n\n\n\n### 献词\n\n“本书献给所有做出日常牺牲的人，\n特别是那些为了确保我们的自由与安全而做出牺牲的人。”\n\
  \n非常感谢湿婆神（Lord Shiva）在我的生活中赋予我写作的技术和所有能力。\n\n亲爱的爸爸，感谢你 `baauji`，通过以身作教导我基于原则生活的意义。\n\
  \n亲爱的两位妈妈，感谢你们向我真实地展示如何根据最重要的原则和无条件的爱去生活。\n\n亲爱的姐妹、兄弟+Priya，谢谢你们，你们的笑容点亮了我的每一天。你们的热情让我的心在歌唱。我爱你们所有人。\n\
  \n我特别想提到生命中帮助我应对忧伤的那些美丽面孔：\n\n感谢你 `Priyanka`，你是我生命的意义，我的掌中明珠，我对你的爱无法言表。\n\n谢谢 `Hem\
  \ Zizu`、`Navneet`、`Aman(Rajjo)` `Eminem` - 你们是我的灵感，你们让我想要“为运动而歌唱”。\n\n感谢全球所有的 `Anonymous`\
  \ 和黑帽黑客。\n\n怀念我亲爱的——我的舅舅 `Lt. G.C`。\n\n怀念我亲爱的——我的奶奶 `Lt. Grand Mom`。\n\n你告诉我一切最后都会好好的，\n\
  你还告诉我，如果一切不好，那就还没有结束。\n“我将穿越 1000 个世界和 10000 世，直到我找到你。”\n\n### 关于作者\n\n`Harry` 是一位`匿名黑客活动分子`、`GOC\
  \ 著名计算机程序员`、畅销 Java 作者以及科学黑客专家，在计算机编程、黑客攻击和网络安全领域拥有独特经验。\n\n他曾帮助全球许多国家政府和跨国软件公司保护其网络和安全。他编写了多本关于各种计算机编程语言以及计算机安全与黑客攻击的书。\n\
  \n他是一位技术专业的软件工程师和硕士。他是`C 编程`和 `C++` 的领先权威。\n\n\n\n\n\n\n从畅销书 Java 编程作者 Harry H.\
  \ Chaudhary（书籍已售超过 167,000 本）那里，快速掌握 Java 编程的所有基础和高级特性。这本 Java 指南从基础开始，通过数千行 Java\
  \ 代码详细引导你进入 Java 的高级特性，我承诺这本书将使你成为 Java 专家级冠军。任何人都可以通过这本书达到专家水平学习 Java。\n\n工程专业的学生和新手开发者也可以这本书。这本书涵盖了所有计算机科学专业专业的通用核心大纲。如果你真的认认真，请通过这本终极\
  \ Java 书来开启你的一天。\n\n本 Java 书的主要目标不仅仅是给你提供 Java 编程知识，我遵循了一种模式，针对每个 Java 主题问题，通过不同的\
  \ Java 复杂度来改进数千个代码的解决方案，你将为复杂的 Java 问题找到多种解决方案。\n\n## 特之处\n\n在书中，我为开发者和新手详细涵盖并解释了最新的\
  \ Java 8 特性的几个主题，如——`Lambdas`、`Java 8` `Functional interface`、以及 `Java 8` 中的 `Stream`\
  \ 和 `Time API`。\n\n如果你读过这本书，你就知道可以期待什么：一种为了你大脑工作方式设计的视觉丰富的格式。如果你没读过，那将有一场享受。你会发现为什么人们说它与你读过的任何\
  \ Java 书都不同。\n\n学习一种新语言并非易事，尤其是当它是像 `Java` 这样面向对象的编程语言时。你可能认为问题出在大脑上。它似乎有自己的主意，并不总是想要接受你被迫学习的那些枯燥技术内容。事实是，你的大脑渴望新奇。它不断地寻找、扫描，等待异常情况的发生。毕竟，它是为了帮助你生存而这样构建的。它将所有常规、普通、无味的内容过滤到背景中，以免干扰你大脑的真实工作——记录重要的事情。你的大脑如何知道什么是重要的？\n\
  \n这本 Java 书不需要之前的编程经验。然而，如果你拥有 `C` 或 `C++` 编程背景，那么你将学得更快。\n\n正因如此，这本 Java 书对 `Java`\
  \ 的几个关键特性进行了快速详细的概述。这里描述的内容将为你提供一个立足点，允许你编写和理解简单且典型的程序。讨论大部分主题将在后续章节中通过数千个实时 Java\
  \ 代码示例进行更详细的检查。\n\n正如我们所知，过去几年记录了这样一个事实：Web 已不可逆转地重塑了计算的面貌，不愿意掌握其环境的程序员将被遗留。前述是一个强有力的陈述，也是事实。\n\
  \n越来越多的应用程序必须与 Web 接口。应用程序是什么已不再重要，几乎通用的 Web 访问正在拖拽、推动和诱导程序员为在线世界编程，而 `Java` 是许多人将用来来实现这一目的的语言。坦率地说，熟练掌握\
  \ `Java` 对于专业程序员来说不再是一个选项，而是一项要求。这本书将帮助你掌握它。\n\n![11](img/00005.jpeg) ![11](img/00005.jpeg)\
  \ ![11](img/00005.jpeg) ![11](img/00005.jpeg) ![11](img/00005.jpeg)\n\n![STAR-LOGO-2013](img/00006.jpeg)\n\
  \n# 第 ∞ 1 章\n\n## (Java 概览)\n\n## 引言\n`Java` 是一种由 Sun Microsystems 公司于 1991 年开发的强大的面向对象的编程语言。`Java`\
  \ 的开发最初是为了消费电子设备，但后来它转向了互联网。现在，`Java` 已成为互联网广泛使用的编程语言。`Java` 是一种平台中性的语言（机器无关）。由\
  \ `Java` 开发的程序可以运行在世界上任何硬件或任何操作系统上。\n\nSun Microsystems (Oracle) 在 1995 年 5 月的一场大型会议上正式宣布了\
  \ `Java`。通常，这样的事件不会引起太大关注。然而，由于人们对万维网的极大兴趣，`Java` 引起了商业界的立即关注。\n\n`Java` 现在用于创建具有动态和交互内容的\
  \ Web 页面，开发大型企业应用程序，增强互联网的功能。\n\n### Java 的必要性\n`Java` 的开发是因为一种平台中性的语言，用于创建嵌入到各种消费电子设备（如微波炉和遥控器）中的软件。用\
  \ `C` 和 `C++` 编写程序是针对特定的硬件和软件编译的，该程序不会在任何其他硬件上运行。因此，需要平台中性的语言。这样从该语言编译的程序就可以在任何硬件上运行。这种需求导致了\
  \ `Java` 的诞生。\n\n### Java 类库\n`Java` 程序由称为“类”的单元组成。类由方法组成，方法执行任务并在完成后返回信息。你可以使用\
  \ Java 类库对编写形成 Java 程序所需的每个部分。然而，大多数 Java 程序员都利用了 Java 类库中丰富的现有类集合。类库也被称为 Java `APIs`（应用程序接口）。\n\
  \n因此，学习 Java “世界”实际上有两个部分。第一部分是学习语言本身，以便你可以编写自己的类；第二部分是学习如何使用大量 Java 类库中的类。在整书中，我们讨论了许多库类。类库主要由编译器供应商提供，但许多类库也由独立软件供应商\
  \ (ISVs) 提供。此外，许多类库可以在互联网和万维网上作为免费软件或共享软件获取。你可以下载免费产品并免费使用，但受版权所有者指定的任何限制。\n\n##\
  \ 典型环境的基础\nJava 系统通常由几个部分组成：环境、语言、Java 编程接口 (`API`) 和各种类库。接下来的讨论解释了典型的 Java 程序开发环境，Java\
  \ 程序通常通过五个阶段进行执行。这些阶段是：编辑、编译、加载、验证和执行。后续描述使用了从 Oracle 提供的标准 `Java SE 7` 开发包 (`JDK\
  \ 7`)。\n\n如果你在使用不同的 Java 开发环境，你可能需要遵循不同的程序来编译和执行 Java 程序。在这种情况下，请咨询你的编译器文档获取详情。\n\
  \n阶段 1 涉及编辑文件。\n这是通过编辑器程序（通常称为编辑器）完成的。程序员使用编辑器输入 Java 程序，并在时进行修正。当程序员指定编辑器中的文件应保存时，程序被存储在次级存储设备上，如磁盘。Java\
  \ 程序文件名以 `.java` 扩展结尾。\n\n在 UNIX/Linux 系统上广泛使用的两种编辑器是 `vi` 和 `emacs`。在 Windows 95/98/ME\
  \ 和 Windows NT/2000 上，简单的编辑程序如 DOS Edit 命令和 Windows 记事本就足够了。\n\n\n\n\nJava 集成开发环境（IDEs），例如\
  \ Java 社区版的 Forte、NetBeans、Borland 的 JBuilder、Symantec 的 Visual Cafe 以及 IBM 的 Visual\
  \ Age，都内置了集成到编程环境中的编辑器。\n\n我们假设读者知道如何编辑文件。像 `Java` 等语言是面向对象的——在这样的语言上进行编程被称为面向对象编程（OOP），它允许设计人员将面向对象的设计实现为运行的系统。相比之下，`C`\
  \ 等语言是过程化编程语言，因此编程倾向于以动作为面向。\n\n在 `C` 中，编程的单元是 `function`（函数）。在 `Java` 中，编程的单元是\
  \ `class`（类），对象最终从类中实例化（“创建”的形象术语）。`Java` 类包含 `methods`（方法，实现类的行为）和 `attributes`（属性，实现类的数据）。\n\
  \n`C` 程序员专注于编写 `functions`。执行某些共同任务的动作组被组合成 `functions`，而 `functions` 又被组合在一起形成程序。数据在\
  \ `C` 中固然重要，但观点是数据存在主要是为了支持 `functions` 执行的动作。系统规范中的动词有助于 `C` 程序员确定实现该系统所需的 `functions`\
  \ 集合。\n\n`Java` 程序员专注于创建自己的自定义类型，称为 `classes`（类）和 `components`（组件）。每个 `class` 包含数据以及操作这些数据的\
  \ `functions` Set。`Java` 类的数据组件被称为 `attributes`（属性）。\n\n`Java` 函数组件被称为 `methods`（方法）。正如\
  \ `int` 等内置类型的实例被称为 `variable`（变量）一样，自定义类型（即 `class`）的实例被称为 `object`（对象）。程序员使用内置类型作为构建自定义类型的“构建块”。\n\
  \n`Java` 的重点是 `classes`（我们从这些类中创建对象）而不是 `functions`。系统规范中的名词有助于 `Java` 程序员确定用于创建对象的\
  \ `classes` 集合，这些对象将共同工作以实现系统。\n\n`classes` 之于 `objects` 正如蓝图之于房屋。我们可以从一张蓝图建造许多房屋，也可以从一个\
  \ `class` 实例化许多对象。`classes` 还可以与其他 `classes` 建立关系。\n\n例如，在银行的面向对象设计中，“银行柜员”类需要与“客户”类相关。这些关系被称为关联（associations）。我们将看到，当软件被封装成\
  \ `classes` 时，这些 `classes` 可以在未来的软件系统中被重用。相关的 `classes` 组通常被封装成可重用的组件。\n\n你创建的每一个新\
  \ `class` 都有成为价值的软件资产的潜力，你和其他程序员可以使用它来加速并提高未来软件开发工作的质量——这是一个令人兴奋的可能性。\n\n# Java\
  \ 与 C、C++ 及 C# 的关系\n\n`Java` 从 `C` 处派生了语法，从 `C++` 处派生了面向对象的特性。它不是 `C++` 的增强版本。`Java`\
  \ 既向上也不向下兼容 `C++`。我想告诉你们的一点重要事情是，`Java` 语言的设计并不是为了取代 `C++` 和 `C#`。微软开发的用于支持 `.NET`\
  \ 框架的另一种语言 `C#` 与 `Java` 密切相关，因为它们共享 `C++` 和 `C` 风格的语法，支持分布式编程，并使用相同的对象模型。\n\n#\
  \ Java 的主要目标是实现 -\n\n## 1. 安全性\n\n当我们使用兼容 `Java` 的网络浏览器时，没有病毒感染的威胁。此外，也没有恶意程序从本地机器收集隐私信息（如信用卡号、银行账户余额和密码）的威胁。\n\
  \n`Java` 在网络应用程序和我们的计算机之间提供了一个防火墙。\n\n## 2. 可移植性\n\n`Java` 程序可以从一台计算机移植到另一台运行不同操作系统和不同硬件的计算机。\n\
  \n## Java 字节码\n\n`Java` 编译器的输出是 `bytecode`（字节码）而不是机器码（`.class` 文件）。`bytecode` 是一组高度优化的指令集，旨在由\
  \ Java 运行时系统执行，该系统被称为 `JVM`（Java 虚拟机）。\n\n`JVM` 是解释 `bytecode` 的解释器。编译后的程序运行更快，但\
  \ `Java` 仍然使用解释器来实现可移植性，因此 `Java` 程序运行得稍慢。现在，通过 `Java` 编译器编译的程序可以在任何环境中运行，但每个平台都需要实现一个\
  \ `JVM`。`Java` 程序是被解释的。这也有助于提高安全性，因为每个 `Java` 程序的执行都在 `JVM` 的控制之下。\n\n## JIT (即时编译)\n\
  \n`JIT` 是 `JVM` 使用的将 `bytecode` 翻译成实际机器码的翻译器。它不翻译整个 `bytecodes`，而是根据需要逐个翻译。\n\n\
  ## Java 的不同版本\n\n### Java 1\n- `JDK 1.0`\n- `JDK 1.1`\n\n### Java 2\n- `JDK 1.2`\n\
  - `JDK 1.3`\n- `JDK 1.4`\n- `JDK 1.5` 或 `JDK 5`\n- `JDK 1.6` 或 `JDK 6`\n- `Java\
  \ 1.7` 或 `SE 7`\n- `Java 8` (2014 年 4 月)\n\n注释 1：`JDK` (Java 开发包)\n注释 2：旧 `Java`\
  \ 版本的许多功能在新版本中已弃用\n\n# Java 可以开发的应用程序类型\n\n## 1. 独立应用程序\n独立应用程序是运行在我们的本地计算机上的程序，类似于\
  \ `C` 或 `C++` 程序。\n\n## 2. Applet (小程序)\n`applet` 是一种跨越互联网传输并在客户端机器上由 `Java` 的浏览器（如\
  \ `Internet Explorer` 或 `Netscape Navigator`）执行的程序。`applet` 实际上是一个动态下载的微型 `Java`\
  \ 程序。`applet` 程序存储在 Web 服务器上，并在客户端请求时传输到客户端机器。\n\n`applet` 不能像独立应用程序那样执行。`applet`\
  \ 只能通过嵌入 HTML 页面来执行，例如声音文件、图像文件或视频剪。\n\n现在，嵌入了 `applet` 的 HTML 页面可以在下载后运行。`applet`\
  \ 是一个可以响应用户输入并动态变化的程序。它不会反复运行相同的动画或声音。\n\n## 3. Web 应用程序\n这些是运行在 Web 服务器上的程序。当我们在浏览器中指定\
  \ `URL`（通用资源定位符）访问网站时，浏览器会向 Web 服务器发送请求。服务器接收到请求后运行一个程序，该程序被称为 Web 应用程序。我们使用 `Java\
  \ Servlets` 和 `JSP` (Java Server Pages) 来编写此类程序。\n\n这些程序运行在服务器上，并将结果/响应发送给客户端。`JSP`\
  \ 页面可以被视为 HTML 和 Java 代码的结合。Web 服务器在执行之前会将 `JSP` 页面转换为 `Java Servlets`。\n\n## 4.\
  \ 分布式应用程序\n`Java` 应用程序被分为运行在单独机器上的小型程序。这些程序中的对象可以相互通信。这些应用程序被称为分布式应用程序。这允许两个不同计算机上的对象执行远程过程调用。为此，使用了\
  \ `RMI` (远程方法调用)。\n\n# Java 的特性:-\n\n\n\n\n## 1. 简单\nJava 的语法与 C 和 C++ 几乎相似，因此熟悉\
  \ C/C++ 的程序员不需要从头开始学习语法。但 C/C++ 中许多既复杂又导致歧义的特性在 Java 中被移除了。\n\n1. Java 不支持多继承，因为这个概念有点复杂并可能导致歧义。\n\
  2. Java 不支持全局变量，这也导致了 C/C++ 程序中出现许多 bug。\n3. Java 不使用 `pointers`（指针）且不允许 `pointer\
  \ arithmetic`（指针运算），由于固有的复杂性，这是 C/C++ 程序中大多数 bug 的根源。\n4. Java 不支持重载，因为这可能会导致混淆。\n\
  5. Java 中没有垃圾值的概念。我们必须在使用变量之前对其初始化。\n\n## 2. 安全\nJava 程序运行在 `JVM`（Java 虚拟机）内部，其他部分无法访问它们。这极大地提高了安全性。由于这一特性，Java\
  \ 程序很少很少发生挂起。这与频繁挂起的 C/C++ 程序大不相同。Java 的安全模型由三个主要部分组成：\n\n1. 类加载器（Class loader）。\n\
  2. 字节码验证器（Bytecode Verifier）。\n3. 安全管理器（Security Manager）。\n\nJava 使用不同的类加载器从本地机器和远程机器加载类文件（可执行文件）。从远程机器加载的类（如\
  \ `Applet` 类）不允许读取或写入本地机器的文件。这防止了恶意程序损坏本地文件系统。`Bytecode verifier`（字节码验证器）会在类加载器完成工作后立即对字节码进行验证。它确保字节码是有效的\
  \ Java 代码。它几乎消除了 Java 程序执行恶意活动（如访问 `JVM` 外部内存）的可能性。`Security Manager`（安全管理器）控制许多关键操作，如删除文件、创建线程等。只有当\
  \ Java 程序具有足够的权限时才允许这些操作，否则 `Security Manager` 将不允许这些操作并生成 `Security Exception`。\n\
  \n## 3. 可移植\nJava 程序是平台无关的。它们遵循“编写一次，处运行”的策略。为 Windows 平台编写的 Java 程序只需拷贝字节码（`.class`\
  \ 文件）即可运行在任何其他平台（`Unix`、`Linux`、`Sun Solaris` 等）。不需要像 C/C++ 程序那样拷贝源代码并重新编译。这一特性使得\
  \ Java 成为一种强大的语言。只要机器拥有 `JVM`，我们就可以在任何机器上运行字节码。`JVM` 本身依赖平台，但它让 Java 代码与平台无关。实际上是\
  \ `JVM` 将字节码转换为机器码并执行它们。\n\n因此我们可以说 Java 是一种可移植语言。另一个让 Java 高度可移植的特性是原生数据类型的长度是固定的，不受平台影响。例如，Java\
  \ 中的 `int` 始终为 4 字节。与 C/C++ 不同，`int` 的大小在某些机器上可能是 2 字节，而在其他机器上可能是 4 字节。\n\n## 4.\
  \ 面向对象\nJava 几乎是纯面向对象的语言，但出于性能考虑，它支持原生数据类型如 `byte`、`short`、`int`、`long`、float、double、char、`boolean`。\n\
  \n## 5. 健壮\n大多数程序失败是因为以下两个原因之一：\n\n1. 内存管理。\n2. 运行时的异常情况。\n\n在设计这种语言时，目标之一是确保 Java\
  \ 程序尽可能健壮，即它们很少失败。因此，Java 特别重视上述的两个因素。\n\n在 Java 中，内存的分配和释放由语言本身处理，这消除了由于 C/C++\
  \ 中动态内存管理功能而引起的许多问题。Java 还支持面向对象的异常处理功能来处理运行时发生的异常情况。这允许 Java 程序在发生异常情况后能够恢复并继续执行。\n\
  \n## 6. 多线程\nJava 的设计是为了满足现实世界创建交互式、网络化程序的需求。Java 提供了编写多线程程序的支持来实现这一目标。这允许程序员编写可以并发执行许多任务的程序。\n\
  \n例如，基于 `GUI`（图形用户界面）的应用程序可能正在监听用户事件并采取相应行动，另一个线程可能正在打印，另一个线程可能正在从网络上的某台下载文件，所有这些都是并发进行的。这导致了更好的性能和更高的\
  \ CPU 利用率。\n\n在其他语言中编写多线程程序也是可能的，但那仅通过使用 `System` 调用来实现，而在 Java 中，可以通过使用语言本身的特性来实现。\n\
  \n## 7. 体系中立\n程序员面临的主要问题之一是，没有办法保证我们今天写的程序在明天还能运行——即使在同一台机器上。操作系统升级、处理器升级以及核心系统资源的更改都可能导致程序发生故障。但\
  \ Java 程序的目标是“编写一次，处运行”。\n\n## 8. 解释执行与高性能\nJava 程序是解释执行的，但与其他解释器相比，它们的运行速度仍然很快。\n\
  \n## 9. 分布式\nJava 是为互联网的分布式环境设计的。Java 为此目的内置支持了各种基于 `TCP/IP` 的协议。事实上，使用 `URL` 访问资源与访问本地机器上的文件相似。Java\
  \ 还具有远程方法调用（Remote Method Invocation）功能，这与远程过程调用（`RPC`）有些相似。这允许不同计算机上的对象远程执行过程。Java\
  \ 为此目的内置了 API，称为 `RMI`。\n\n## 10. 动态\n每个 Java 类都是一个独立的执行单元。类只有在需要时才在运行时加载。Java 中绑定方法的默认机制也是动态的（运行时绑定）。\n\
