  ```\n\n\n\n\n\n# AWT 事件简介\n\n## 序言\n\n当一个普通的 Java 程序（非 GUI 基础）需要输入时，它会提示用户然后调用某些输入方法，例如\
  \ `readline()`，也就是说交互是由程序发起的。这与基于 GUI 的程序的行为方式不同。是由用户与程序进行交互，而不是由程序发起动作。\n\n例如，在文字处理软件中，用户通过点击不同的按钮来发起动作，这会产生一个事件并执行某些代码，从而发生相应的操作。点击保存按钮将调用将内容保存到文件的方法。\n\
  \n### 事件映射表\n\n| 接口 | 事件(方法) | 类 | 方法 |\n| :--- | :--- | :--- | :--- |\n| `ActionListener`\
  \ | `actionPerformed()` | `ActionEvent ae` | `getSource` |\n| `ItemListener` | `itemStateChanged()`\
  \ | `ItemEvent ie` | `getItem` |\n| `AdjustmentListener` | `adjustmentValueChanged()`\
  \ | `AdjustmentEvent ae` | `getAdjustable()` |\n| `MouseListener` `MouseAdapter`\
  \ | `mouseEntered` `mouseExited` `mouseClicked` `mousePressed` `mouseReleased` |\
  \ `MouseEvent me` | `getX()` `getY()` `getPoint()` `getClickCount()` `getButton()`\
  \ `getModifiersEx()` `getModifiersExText()` |\n| `MouseMotionListener` `MouseMotionAdapter`\
  \ | `mouseMoved` `mouseDragged` | `MouseEvent me` | 同上述。 |\n| `KeyListener` `KeyAdapter`\
  \ | `keyTyped` `keyPressed` `keyReleased` | `KeyEvent ke` | `getKeyChar()` `getKeyCode()`\
  \ |\n| `FocusListener` `FocusAdapter` | `focusGained` `focusLost` | `FocusEvent\
  \ fe` | `getSource()` |\n| `WindowListener` `WindowAdapter` | `windowOpen` `windowClosing`\
  \ `windowClosed` `windowActivated` `windowDeactivated` `windowIconified` `windowDeiconified`\
  \ | `WindowEvent we` | `getWindow()` |\n\nJava 使用事件委托模型进行事件处理。在事件委托模型中，可以告诉组件当它产生特定类型的事件时，应该通知哪个对象。\n\
  \n如果组件对某种类型的事件不感兴趣，那么该类型的事件将不会被传播。委托模型基于以下核心概念：\n\n*   事件类。\n*   事件监听器。\n*   适配器。\n\
  \n### 事件类\n\n点击按钮会产生一个事件。该事件关联有大量信息，例如：时间、产生事件的组件、发生点击的坐标等。\n\n这些信息被放在事件类内部。该概念与异常处理相似。每当发生异常时，就会创建一个相应异常类的对象，并将所有与异常相关信息都放入该对象中。\n\
  \n我们有一套事件类层次结构，这与异常处理有些相似。每当发生异常时，就会创建一个相应异常类的对象，并将所有与异常相关信息都放入该对象中。\n\n我们有一套事件类层次结构，这与异常处理有些相似。每当发生异常时，就会创建一个相应异常类的对象，并将所有与异常相关信息都放入该对象中。\n\
  \n我们有一套事件类层次结构，这与异常处理有些相似。每当发生异常时，就会创建一个相应异常类的对象，并将所有与异常相关信息都放入该对象中。\n\n我们有一套事件类层次结构，这与异常处理有些相似。每当发生异常时，就会创建一个相应异常类的对象，并将所有与异常相关信息都放入该对象中。\n\
  \n### 事件监听器\n\n点击按钮会产生一个事件。该事件关联有大量信息，例如：时间、产生事件的组件、发生点击的坐标等。\n\n这些信息被放在事件类内部。该概念与异常处理相似。每当发生异常时，就会创建一个相应异常类的对象，并将所有与异常相关信息都放入该对象中。\n\
  \n### 适配器\n\n点击按钮会产生一个事件。该事件关联有大量信息，例如：时间、产生事件的组件、发生点击的坐标等。\n\n这些信息被放在事件类内部。该概念与异常处理相似。每当发生异常时，就会创建一个相应异常类的对象，并将所有与异常相关信息都放入该对象中。\n\
  \n### 事件层次结构\n\n点击按钮会产生一个事件。该事件关联有大量信息，例如：时间、产生事件的组件、发生点击的坐标等。\n\n这些信息被放在事件类内部。该概念与异常处理相似。每当发生异常时，就会创建一个相应异常类的对象，并将所有与异常相关信息都放入该对象中。\n\
