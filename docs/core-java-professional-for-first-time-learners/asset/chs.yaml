  \n**注意：** 一个组件可能关联了多个监听器。无法保证监听器会按照它们添加的顺序被通知。\n\n同样无法保证所有监听器的通知会在同一个线程中发生，因此监听器必须采取措施防止损坏共享数据。\n\
  \n可以通过调用 `removeXXXListener()` 方法并传入要移除的监听器，从组件的监听器列表中移除它。\n\n例如，下面的代码从按钮 `btn`\
  \ 中移除了动作监听器 `al`：\n\n```java\nbtn.removeActionListener(al);\n```\n\n### 处理窗口事件\n\
