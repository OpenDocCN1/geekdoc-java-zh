  \n\n# 第 19 章：在 AWT 中绘制\n\n## 引言\n许多类型的 AWT 组件（例如）其外观是由窗口系统决定的。其他组件类型，特别是 applet、frame\
  \ 和 canvas，并没有外观。如果我们使用这些类中的类作为容器并希望它们看起来有用，那么我们就必须提供相应的代码。\n\n每个组件都关联着一个图形上下文（graphics\
  \ context）。我们可以使用该上下文在组件上进行绘制。在组件上绘图是通过调用图形上下文来实现的，该句柄是 `Graphics` 类的一个实例。图形上下文知道如何在三种介质上进行渲染：\n\
  1. 组件\n2. 图像\n3. 打印机\n\n任何类型的组件都可以与图形上下文相关联。这种关联是永久的；上下文无法重新分配给新的组件。虽然我们可以使用图形上下文在任何组件上绘图，但对于已经具有外观的组件这样做并不寻常。按钮（Buttons）、复选框（Checkboxes）、标签（Labels）、滚动条（Scrollbars）、文本框（TextFields）和文本区域（TextAreas）通常不需要程序员进行渲染。大多数情况下，这些组件仅使用从\
  \ `component` 超类继承的 `paint()` 方法。该方法的默认版本什么都不做；组件由窗口系统进行渲染。\n\n然而，有四类“空白”组件它们没有默认外观，除非它们被子类化并赋予\
  \ `paint()` 方法，否则它们将显示为空矩形。这四个组件类是：\n* `Applet`\n* `Canvas`\n* `Frame`\n* `Panel`\n\
  \n环境似乎在正确的时刻调用 `paint()` 做得很好。在任何组件上绘图的正确方法是重写它的 `paint()` 方法，该方法有一个类型为 `Graphics`\
  \ 的参数。\n\n### 示例 19.1 扩展 Frame 类并重写 paint() 方法更改 frame 的外观。\n\n```java\nimport java.awt.*;\n\
  \npublic class SimplePaint extends Frame {\n    public static void main (String\
  \ args[]) {\n    }\n}\n```\n\n\n\n\n\n```java\nFrame f=new SimplePaint();\nf.setSize(200,200);\n\
  f.setVisible(true);\n}\npublic void paint (Graphics g) {\n    g.setColor(Color.white);\n\
  \    g.fillRect(0,0,300,300);\n    g.setColor(Color.grey);\n    g.fillOval(30,30,50,50);\n\
  }\n```\n\n![](img/00086.jpeg)\n\n当我们子类一个组件类并为子类提供它自己的 `paint()` 方法时，环境会在适当的时间调用该方法，并传入一个合适的\
  \ `Graphics` 实例。\n\n## graphics 类支持的操作\n\n`graphics` 类（图形上下文）提供的四种大类操作是：\n\n*  \
  \ 选择颜色。\n*   选择字体。\n*   绘制与填充。\n*   裁剪。\n\n### 选择颜色\n\n通过调用 `setColor()` 方法来选择颜色。所需的参数是\
  \ `color` 类的一个实例。\n\n有 13 种预定义的颜色，可以通过 `color` 类的静态 final 变量来访问。\n\n（这些变量本身是 `color`\
  \ 类的实例。这让某些人感到不安，但 Java 处理此类事情没有问题。）预定义的颜色有：\n\n1. `Color.black`\n2. `Color.blue`\n\
  3. `Color.cyan`\n4. `Color.darkGray`\n5. `Color.gray`\n6. `Color.green`\n7. `Color.lightGray`\n\
  8. `Color.magenta`\n9. `Color.orange`\n10. `Color.pink`\n11. `Color.red`\n12. `Color.white`\n\
  13. `Color.yellow`\n\n如果我们想要一个不在此列表中的颜色，可以构造自己的。`color` 构造函数有几个版本，最的是：`Color(int\
  \ redLevel, int greenLevel, int blueLevel)`\n\n这三个参数是原色在 0 到 255 范围内的强度级。颜色是相加的，这意味着它们像光一样混合，而不是像像颜料那样混合。\n\
  \n*   `new Color(0,0,0)`：黑色（光的缺失）\n*   `new Color(255,0,0)`：红色（仅包含红色色调）\n*   `new\
  \ Color(255,255,255)`：白色（所有颜色同时发光）\n\n下面的代码片段列出了 `paint()` 方法的第一部分，它将其图形的颜色设置为浅绿色：\n\
  \n```java\npublic void paint(Graphics g) {\n    Color c= new Color(170,255,170);\n\
  \    g.setColor(c);\n}\n```\n\n在上述代码调用 `setColor()` 后，所有的图形都将绘制成浅绿色，直到下一次调用 `setColor()`。调用\
  \ `setColor()` 不改变已经绘制的内容的颜色；它只影响后续操作。\n\n### 选择字体\n\n设置图形上下文的字体就像设置后续绘制操作将使用的新字体，而之前绘制的内容不受影响。在设置字体之前，我们必须先创建一个。`font`\
  \ 类的构造函数看起来如下：`Font(String fontName, int style, int size)`\n\n第一个参数是字体的名称。字体的可用性取决于平台。我们可以通过如下调用工具包上的\
  \ `getFontList()` 方法来获取可用字体名称列表，以字符串数组返回：`String fontNames[]= Toolkit.getDefaultToolkit().getFontList();`\n\
  \n有三个与平台无关字体名称，我们鼓励使用它们：\n\n1. “Serif”\n2. “Sansserif”\n3. “Monospaced”\n\n在 JDK\
  \ 的 1.0.X 版本中，这些分别被称为“TimesRoman”、“Helvetica”和“Courier”。\n\n`style` 参数可以传递给以下任何一个\
  \ int 常量：\n\n1. `Font.PLAIN`\n2. `Font.BOLD`\n3. `Font.ITALIC`\n\n下面的代码片段将图形上下文\
  \ `gc` 的字体设置为 24 点加粗无衬线字体：\n\n```java\nFont f =new Font(\"Sansserif\",Font.BOLD,24);\n\
  gc.setFont(f);\n```\n\n我们可以通过传递样式的和来指定样式的组合，例如粗体斜体字体，如下所示：`Font.BOLD + Font.ITALIC`\n\
  \n### 绘制与填充\n\n`graphics` 类的所有渲染方法都为它们所渲染的每个形状指定了像素坐标位置。每个组件都有它自己的坐标系，原点位于组件的左上角，x\
  \ 向右增加，y 向下增加。下图显示了组件坐标系：\n\n![](img/00087.jpeg)\n\n图形上下文类没有广泛的绘制方法。（复杂的渲染由 `2d`、`3d`\
  \ 和动画等扩展 API 处理。）\n\n我们需要了解的图形上下文类中的方法有：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void\
  \ drawLine(int x1, int y1, int x2, int y2)` | 在此图形上下文坐标系中使用当前颜色在点 `(x1,y1)` 和 `(x2,\
  \ y2)` 之间绘制一条直线。 |\n| `void drawRect(int x, int y, int width, int height)` | 绘制指定矩形的轮廓。\
  \ |\n| `void fillRect (int x, int y, int width, int height)` | 填充指定的矩形。 |\n| `void\
  \ drawOval(int x, int y, int width, int height)` | 绘制由指定矩形边界的椭圆轮廓。 |\n| `void fillOval(int\
  \ x, int y, int width, int height)` | 用当前颜色填充由指定矩形边界的椭圆。椭圆位于矩形框内，并在矩形各边的中点切，如下所示：要绘制圆形，使用正方形边界框。注意绘制只绘制前景像素，不绘制背景，因此矩形框内椭圆外的空间保持不变。这里\
  \ `x` 和 `y` 是边界框的左上角坐标，`width` 和 `height` 是框的宽度和高度。 |\n| `void drawArc(int x, int\
  \ y, int width, int height, int startAngle, int arcAngle)` | 绘制覆盖矩形的圆形或椭圆弧轮廓。 |\n\
  | `void fillArc(int x, int y, int width, int height, int startAngle, int arcAngle)`\
  \ | 填充覆盖矩形的圆形或椭圆弧。弧是椭圆的一部分。要指定弧，我们首先像 `drawOval()` 和 `fillOval()` 那样指定椭圆的边界框。我们还需要指定弧的起点和终点，通过指定起始角度和弧扫过的角度来实现。\
  \ |\n| `void drawPolygon(int[] xPoints, int[] yPoints, int nPoints)` | 绘制由 x y 坐标数组定义的封闭多边形。\
  \ |\n| `void fillPolygon (int[] xPoints, int[] yPoints, int nPoints)` | 填充由 x y\
  \ 坐标数组定义的封闭多边形。多边形是任意数量顶点的封闭图形……注意：终点与第一个点连接。折线与多边形相似，但它是开放的而非封闭的。没有连接最后一个顶点和第一个点的线。\
  \ |\n| `void drawPolyLine(int[] xPoints, int[] yPoints , int nPoints)` | 绘制由 x y\
  \ 数组定义的一系列连接线。 |\n\n\n\n\n\n\n### 方法引用\n\n- `void drawString(String str, int x,\
  \ int y)`: 使用此图形上下文的当前字体和颜色绘制指定字符串的文本。`x`、`y` 参数指定字符串基线的左边缘。带有下伸线部（descenders）的字符（在大多数字体中为\
  \ g, j, p, q 和 y）会延伸到基线以下。文本坐标相对于基线这一事实非常重要。例如，在简单的文本中，我们可能会尝试在 `(0,0)` 处绘制字符串，并期望它出现在区域的左上角。然而，由于基线的存在，我们只能看到字符串的下延伸部分，这可能意味着我们什么也看不见。默认情况下，图形上下文使用关联组件的字体；但是，我们可以通过调用图形上下文的\
  \ `setFont()` 方法设置不同的字体。\n\n- `boolean drawImage(Image img, int x, int y, ImageObserver\
  \ observer)`: 绘制当前可用的指定图像。在这里，`img` 是要渲染的图像，`x` 和 `y` 是目标组件内图像左上角的坐标。图像观察者必须是一个实现了\
  \ `ImageObserver` 接口的对象。图像是矩形像素值集合离屏表示。Java 的图像支持是复杂的。现在，假设我们通过某种方式获取了图像（即 `java.awt.Image`\
  \ 类的实例），并想要使用特定的图形上下文将其渲染到屏幕上。这样做的方法是调用图形上下文的 `drawImage()` 方法。\n\n### 示例 19.2\n\
  \n此示例说明了如何创建一个图像并使用其图形上下文在上面绘制。然后可以使用 `drawImage()` 方法在 applet 窗口中显示该图像。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n/*<applet code=\"\
  PaintImage\" width=200 height=100></applet>*/\npublic class PaintImage extends Applet\
  \ {\n    private Image im;\n    public void init() {\n        im = createImage(100,50);\n\
  \        Graphics imgc=im.getGraphics();\n        imgc.setColor(Color.gray);\n \
  \       imgc.fillRect(0,0,100,50);\n        imgc.setColor(Color.black);\n      \
  \  imgc.fillOval(0,0,5,0);\n    }\n    public void paint(Graphics g) {\n       \
  \ g.drawImage(im,10,10,this);\n    }\n}\n```\nOutput:![](img/0088.jpeg)\n\n### 示例\
  \ 19.3\n\n此示例说明了如何从现有图像创建图像对象。然后可以使用 `drawImage()` 方法在 applet 窗口中显示该图像。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\nimport java.net.*;\n/*\n<applet code=\"\
  PaintImage\" width=500 height=500>\n</applet>\n*/\npublic class PaintImage extends\
  \ Applet {\n    private Image im;\n    public void init() {\n        try {\n   \
  \         im=getImage(new URL(\"file:///c:/matrix/logo.gif\"));\n            //im=getImage(new\
  \ URL(\"http://127.0.0.1:808/logo.gif\"));\n        } catch (MalformedURLException\
  \ e) {\n            System.out.println(e);\n        }\n    }\n    public void paint(Graphics\
  \ g) {\n        g.drawImage(im,10,10,this);\n    }\n}\n```\n\n### 裁剪 (Clipping)\n\
  \n程序员对图形上下文进行的大多数调用涉及颜色选择或绘制和填充。一种不常用的操作是裁剪。裁剪简单地限制图形上下文可以修改的区域。\n\n每个图形上下文（即每个\
  \ `Graphics` 类的实例）都有一个裁剪区域，该区域定义了关联组件的全部或部分。当我们调用 `Graphics` 类的某个 `drawXXX()` 或\
  \ `fillXXX()` 方法时，只有位于图形上下文裁剪区域内的像素才会被修改。\n\n图形上下文的默认裁剪区域是关联组件的整个可见区域。有方法可以获取和修改裁剪区域。考虑以下\
  \ paint 方法。\n\n#### 示例 19.4\n\n```java\nimport java.awt.*;\nclass Clip extends Frame\
  \ {\n    public static void main(String args[]) {\n        Frame f=new Clip();\n\
  \        f.setSize(30,30);\n        f.setVisible(true);\n    }\n    public void\
  \ paint(Graphics g) {\n        for(int i=0; i<300; i=i+100) {\n            for(int\
  \ j=30; j<330; j=j+100) {\n                g.fillOval(i,j,100,100);\n          \
  \  }\n        }\n    }\n}\n```\nOutput:![](img/0090.jpeg)\n\n上述程序的 `paint()` 方法绘制了一个点状图案。考虑当这是一个\
  \ 200*200 像素的 applet frame 的 `paint()` 方法时会发生什么。由于计数器一直到 500，该方法尝试在 applet frame\
  \ 边界之外绘制。这不是一个问题，因为图形上下文默认的裁剪区域与 applet frame 自身重合。\n\n要为图形上下文设置矩形裁剪，我们可以调用 `setClip(x,y,\
  \ width, height)` 方法，传入四个描述所需矩形位置和大小的 int。例如，上面的代码可以修改如下：\n\n#### 示例 19.5\n\n```java\n\
  import java.awt.*;\nclass Clip2 extends Frame {\n    public static void main(String\
  \ args[]) {\n        Frame f=new Clip2();\n        f.setSize(300,330);\n       \
  \ f.setVisible(true);\n    }\n    public void paint(Graphics g) {\n        g.setClip(50,80,200,200);\n\
  \        for(int i=0; i<300; i=i+100) {\n            for(int j=30; j<330; j=j+100)\
  \ {\n                g.fillOval(i,j,100,100);\n            }\n        }\n    }\n\
  }\n```\n\n\n\n\n\n22. } }\n\n输出：\n\n![](img/00091.jpeg)\n\n如上所示，现在绘制被裁剪在 300 * 300\
  \ 小程序框架中心的一个 200 * 200 矩形内。\n\n裁剪本身就是是一项值得了解的知识。当环境需要修复组件的暴露部分时，裁剪也会发挥作用。\n\n###\
  \ 关于 `paint()` 方法和图形上下文的总结：\n\n`Graphics` 上下文专门用于单个组件。若要在组件上进行绘制，我们调用图形上下文的 `drawXXXX()`\
  \ 和 `fillXXXX()` 方法。若要更改图形操作的颜色或字体，我们分别调用图形上下文的 `setColor()` 或 `setFont()` 方法。\n\
  \n### GUI 线程与绘制：\n\nJava 运行时环境创建并控制其在后台运行的各个线程，其中一个线程负责 GUI 管理。\n\nGUI 线程是环境用于接收用户输入事件以及调用需要绘制的组件的\
  \ `paint()` 方法的工具。\n\n对 `paint()` 的调用并非都由环境生成。当然，Java 程序可以进行自己的调用，可以是直接调用，也可以通过\
  \ `repaint()` 方法间接调用。\n\n还可以使用组件的图形上下文在组件上进行绘制。这种方法下不需要调用 `paint()` 或 `repaint()`\
  \ 方法。\n\n在组件上绘制的不同方法如下：\n\n(i) 获取组件的 `Graphics` 上下文后直接绘制。\n(ii) 自发绘制（由 GUI 线程隐式/自动地调用\
  \ `paint()` 方法）。\n(iii) 显式调用 `paint()` 方法。\n(iv) 显式调用 `repaint()` 方法，然后由其间接调用 `paint()`\
  \ 方法。\n\n### 获取组件的图形上下文后直接绘制：\n\n由于可以使用 `getGraphics()` 方法获取组件 `Graphics` 上下文的引用，人们很容易认为可以从任何方便的方法直接在组件上绘图。通常，这种方法存在严重的缺陷。\n\
  \n假设我们有一个小程序，想要在最近一次鼠标点击的位置绘制一个红点。该程序的其余部分应为黄色。假设该程序正在处理自己的鼠标事件。我们可能会考虑创建这样的事件处理器：\n\
  \n示例 19.6：\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass PaintApproach\
  \ extends Frame implements MouseListener {\n    public static void main(String args[])\
  \ {\n        PaintApproach f = new PaintApproach();\n        f.setSize(300,300);\n\
  \        f.addMouseListener(f);\n        f.setVisible(true);\n    }\n    public\
  \ void mouseEntered(MouseEvent e) {}\n    public void mouseExited(MouseEvent e)\
  \ {}\n    public void mousePressed(MouseEvent e) {}\n    public void mouseReleased(MouseEvent\
  \ e) {}\n    public void mouseClicked(MouseEvent e) {\n        System.out.println(\"\
  Clicked...\");\n        Graphics g = getGraphics();\n        g.setColor(Color.yellow);\n\
  \        g.fillRect(0,0, getSize().width, getSize().height);\n        g.setColor(Color.Red);\n\
  \        g.fillOval(e.getX()-10, e.getY()-10,20,20);\n    }\n}\n```\n\n\n\n\n\n\
  ```java\npublic class PaintApproach1 extends Frame implements MouseListener {\n\
  \    int mouseX, mouseY;\n\n    public static void main(String arg[]) {\n      \
  \  PaintApproach1 f = new PaintApproach2();\n        f.setSize(300, 300);\n    \
  \    f.addMouseListener(f);\n        f.setVisible(true);\n    }\n\n    public void\
  \ mouseEntered(MouseEvent e) {}\n    public void mouseExited(MouseEvent e) {}\n\
  \    public void mousePressed(MouseEvent e) {}\n    public void mouseReleased(MouseEvent\
  \ e) {}\n    public void mouseClicked(MouseEvent e) {\n        System.out.println(\"\
  Mouse Clicked...\");\n        mouseX = e.getX();\n        mouseY = e.getY();\n \
  \       Graphics g = getGraphics();\n        paint(g);\n    }\n    public void paint(Graphics\
  \ g) {\n        g.setColor(Color.yellow);\n        g.fillRect(0, 0, getSize().width,\
  \ getSize().height);\n        g.setColor(Color.red);\n        g.fillOval(mouseX\
  \ - 10, mouseY - 10, 20, 20);\n    }\n}\n```\n\n### 显式调用 `repaint()` 方法，从而间接地调用\
  \ `paint()` 方法\n\n显式调用 `paint()` 方法可能会导致两个严重问题。\n\n第一个问题是 GUI 线程会在需要时随时调用 `paint()`\
  \ 方法。这发生在需要处理窗口暴露（exposure）时。这可能会导致线程交互问题。\n\n公平地说，我们会发现，即使使用首选的方法，我们也可能需要处理这些问题中的某些，因为\
  \ `paint()` 方法将使用我们正在其他线程中修改的数据。然而，如果我们允许 `paint()` 仅在 GUI 线程中被调用，就能最大限度地减少这个问题。\n\
  \n第二个问题是 CPU 使用率问题。考虑以下场景：我们的程序定期收到通知，要求它用动画的下一帧或类似的连续移动图形更新显示。此外假设绘图过程是复杂且耗时的。如果我们简单地调用整个\
  \ `paint()` 方法，当帧触发发生时，我们可能只完成了绘图的一部分。这将导致程序所有时间都花在绘图上。此外，绘图将进一步落后于预期进度。\n\n这些问题可以通过使用首选的绘图处理方法简单地解决。其核心思想是主程序维护应该呈现给用户的数据，但不直接调用绘图程序。相反，程序请求\
  \ GUI 线程运行绘图程序，这与线程处理暴露时的方式大致相同。为了支持这种方法，GUI 系统提供了一个名为 `repaint()` 的方法。该方法定义在 `Component`\
  \ 类中，因此 GUI 中的任何可见对象可用。当我们调用此方法时，我们是在向 GUI 线程发出一个请求，让它执行绘图程序。GUI 线程会在合理的范围内执行操作，尽管这可能会受到其他高优先级活动的限制。这种方法确保了\
  \ GUI 线程与线程之间的交互降至最低。当然，我们必须确保在数据处于不一致状态时，GUI 绝不会使用这些数据。然而，可以使用同步（synchronization）或双缓冲（double\
  \ buffering）技术轻松实现这一点。这种行为的另一个结果是，无论程序尝试做多少，系统都保持与当前帧同步。这是因为如果我们在 GUI 线程能够处理第一次调用之前，（例如）调用了多次\
  \ `repaint()` 方法，那么结果将是绘图系统执行一次。这意味着程序员可以编写出在特定平台上获得最佳性能的代码，同时在任何其他平台上也能保持良好的可接受性。以下代码实现了这种方案：\n\
  \n#### 示例 1.9\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\nclass\
  \ PaintApproach2 extends Frame implements MouseListener {\n    int mouseX, mouseY;\n\
  \n    public static void main(String args[]) {\n        PaintApproach2 f = new PaintApproach2();\n\
  \        f.setSize(300, 300);\n        f.addMouseListener(f);\n        f.setVisible(true);\n\
  \    }\n\n    public void mouseEntered(MouseEvent e) {}\n    public void mouseExited(MouseEvent\
  \ e) {}\n    public void mousePressed(MouseEvent e) {}\n    public void mouseReleased(MouseEvent\
  \ e) {}\n    public void mouseClicked(MouseEvent e) {\n        System.out.println(\"\
  Mouse Clicked...\");\n        mouseX = e.getX();\n        mouseY = e.getY();\n \
  \       repaint();\n    }\n    public void paint(Graphics g) {\n        g.setColor(Color.white);\n\
  \        g.fillRect(0, 0, getSize().width, getSize().height);\n        g.setColor(Color.gray);\n\
  \        g.fillOval(mouseX - 10, mouseY - 10, 20, 20);\n    }\n}\n```\n\n\n\n\n\
  尝试绘图的前台线程与 GUI 线程之间的交互是受控且可预测的。\n\n虚拟机永远不会被绘图任务淹没。\n\n当所有代码都这样编写时，对于其他尝试调试代码的程序员来说，就不会有意外发生。\n\
  \n尽管这种方法效果良好，但在一种情况下仍需进一步改进：动画。如果我们完全按照描述的方法来操作，可能会注意到动画在运行时会出现不愉快的闪烁。\n\n### 平滑动画\n\
  \n重绘机制的默认行为中有一个特性我们可能并不总是需要的，即系统在响应我们对 `repaint()` 的调用准备过程中，会清除我们的绘制区域。这会导致动画和其他实时绘制出现不愉快的闪烁。事实证明，当我们调用\
  \ `repaint()` 时，GUI 线程并没有调用 `paint()`，而是调用了 `update()` 方法。`update()` 的默认行为是两件事：清除背景然后调用\
  \ `paint`。如下：\n\n```java\npublic void update (Graphics g) {\n    g.clearRect (0,0,width,\
  \ height);\n    paint(g);\n}\n```\n\n我们可能会合理地问，为什么 `repaint()` 一开始就开始清除窗口，如果这会导致闪烁。在很多情况下，绘图是在背景上使用线条、矩形、椭圆等绘制完成的。\n\
  \n如果我们正尝试制作一个旋转的棒子，我们需要在绘制新线之前移除旧线。考虑这个问题的另一种方式是：如果我们正尝试绘制一幅新图，应该先擦除旧的。\n\n那么，我们如何能在不预先清除整个显示器的情况下安排新图的出现呢？我们只需要找到另一种移除旧图的方法。通用方法是确保我们在每次绘制帧时，都绘制整个图形——包括背景和前景。如果我们能安排好，就不需要清除组件，闪烁也就消失了。\n\
  \n为了防止组件在调用 `paint()` 之前被清除，我们只需重写 `update()` 方法，使其直接调用 `paint`，如下所示：\n\n```java\n\
  public void update (Graphics g) {\n    paint (g);\n}\n```\n\n这是一项标准技术且工作非常完美，只要我们的\
  \ `paint()` 方法确实刷新了显示器的所有像素。处理这种情况的一种特别简单的方法是使用离屏图像来存储应该在显示器上显示的图形。\n\n这种技术在速度或内存方面并不总是最高效的，但它简单易于实现，并且通常被\
  \ Java 程序员所理解。\n\n![11](img/00005.jpeg) ![11](img/00005.jpeg) ![11](img/00005.jpeg)\
  \ ![11](img/00005.jpeg) ![11](img/00005.jpeg)\n\n![STAR-LOGO-2013](img/00006.jpeg)\n\
  \n# (Java.Lang.Object 类)\n\n## 简介\n\n`java.lang` 包中的 `Object` 类是 Java 中所有层次结构的根。所有类都直接或间接地继承\
  \ `Object` 类。\n\n即使你写了一个简单的类（即它没有继承任何基类），它也会隐含地继承内置的 `Object` 类。因此，该类的特征在所有类中可用。\n\
  \n### Object 类中的方法\n\n`object` 类定义了以下方法，所有类都继承它们：\n\n1. `public int hashCode()`\n\
  2. `public boolean equals(Object obj)`\n3. `public final Class getClass()`\n4. `public\
  \ String toString()`\n5. `protected void finalize() throws Throwable`\n6. `protected\
  \ Object clone() throws CloneNotSupportedException`\n7. `public final void wait(long\
  \ timeout) throws InterrputedException`\n8. `public final void wait(long timeout,\
  \ int nanos) throws InterrputedException`\n9. `public final void wait() throws InterrputedException`\n\
  10. `public final void notify()`\n11. `public final void notifyAll()`\n\n#### 1.\
  \ `public int hashCode()`\n在哈希表中存储对象时，可以使用此方法获取对象的哈希值。该值在程序执行期间被保证是一致的。\n\n####\
  \ 2. `boolean equals(Object obj)`\n如果每个对象都被视为唯一的，那么没有必要重写 `Object` 类的 `equals()`\
  \ 方法。该方法比较对象的引用是否相等。\n\n#### 3. `final Class getClass()`\n返回对象的运行时类，该类在运行时由 `java.lang.Class`\
  \ 类的对象表示。\n\n**示例 20.1**: 下面的示例说明了此方法可以用于获取与任何 Java 对象对应的 `Class` 对象。然后我们可以使用 `Class`\
  \ 类的方法通过反射/内省获取有关对象类的信息。`getMethods()` 和 `getFields()` 将只显示所有公共成员，但 `getDeclaredMethods()`\
  \ 和 `getDeclaredFields()` 将显示所有的。\n\n```java\nimport java.lang.reflect.Method;\n\
  import java.lang.reflect.Field;\nclass DispClass1 {\n    public static void main(String\
  \ args[]) {\n        String s = new String(\"Hello\");\n        Class c = s.getClass();\n\
  \        Method m[] = c.getMethods();\n        System.out.println(\"…… Methods (\"\
