  \        fout.close();\n    }\n}\n```\n\n\n\n\n\n# FileReader\n`FileReader` 类创建一个\
  \ `Reader`，你可以用它来读取文件的内容。它最常用的两个构造函数是：\n\n- `FileReader(File file)`：创建一个 `FileReader`\
  \ 流，用于从指定的文件读取内容。\n- `FileReader(String fileName)`：创建一个 `FileReader` 流，用于从指定的文件名读取内容。\n\
  \n**注意：** 如果文件不存在、文件是一个目录而非普通文件，或者由于其他原因无法打开读取，这两个构造函数均可能抛出 `FileNotFoundException`。\n\
  \n# FileWriter\n`FileWriter` 类创建一个写入器，你可以用它向文件写入。它最常用的两个构造函数是：\n\n### 构造函数\n- `FileWriter(File\
  \ file)`：构造一个 `FileWriter` 对象以写入指定的文件。\n- `FileWriter(String fileName)`：构造一个 `FileWriter`\
  \ 对象以写入指定的文件。\n- `FileWriter(File file, boolean append)`：构造一个 `FileWriter` 对象，以\
  \ `append` 模式写入指定的文件。\n- `FileWriter(String filename, boolean append)`：构造一个 `FileWriter`\
  \ 对象，以 `append` 模式写入指定的文件。如果使用前两个构造函数，则总是创建一个新文件。如果存在指定名称的文件，它将被覆盖。如果使用后两个构造函数且\
  \ `append` 标志为 `false`，则它们的行为与前两个构造函数相同。\n\n如果 `append` 标志为 `true`，则以追加模式打开文件，如果如果文件存在，文件指针将指向文件末尾；如果文件不存在，则创建新文件。\n\
  \n**注意：**\n如果文件存在但是一个目录而非普通文件、不存在但无法创建，或由于其他原因无法打开，这些构造函数可能会抛出 `IOException`。例如，当你尝试打开一个只读文件时，将抛出\
  \ `IOException`。\n\n### 示例 15.5\n```java\nimport java.io.*;\nclass FileCopy {\n\
  \    public static void main(String args[]) throws IOException {\n        FileReader\
  \ fin=null;\n        FileWriter fout=null;\n        fin=new FileReader(args[0]);\n\
  \        fout=new FileWriter(args[1]);\n        int a;\n        a = fin.read();\n\
  \        while(a != -1) {\n            fout.write((char)a);\n            a = fin.read();\n\
  \        }\n        fin.close();\n        fout.close();\n    }\n}\n```\n\n# RandomAccessFile\n\
  `RandomAccessFile` 封装了一个随机访问文件。`RandomAccessFile` 允许我们从文件的某个位置读取和写入字节、文本和原始数据类型（在配合适当访问权限的情况下）。它没有继承自\
  \ `InputStream`，而是实现了 `DataInput` 和 `DataOutput` 接口，这两个接口定义了基本的 I/O 方法。它还支持定位请求——也就是说，你可以将文件指针定位文件的任意位置。\n\
  \n`mode` 参数指定打开文件的访问模式。允许的值及其含义如下：\n\n| 值 | 含义 |\n| :--- | :--- |\n| `r` | 仅读打开。调用结果对象的任何\
  \ `write` 方法都将导致抛出 `IOException`。 |\n| `rw` | 读写模式打开。如果文件不存在，将尝试创建它。 |\n| `rws`\
  \ | 读写模式打开，与 `rw` 相同，并且要求对文件内容或元数据的每次更新都必须同步写入底层存储设备。 |\n| `rwd` | 读写模式打开，与 `rw`\
  \ 相同。并且要求对文件内容（数据）的每次更新都必须同步写入底层存储设备。 |\n\n### RandomAccessFile 类的方法\n除了 `DataInput`\
  \ 和 `DataOutput` 接口的方法外，该类的一些常用方法包括：\n\n- `public RandomAccessFile(String, String)\
