  \ write(int) throws java.io.IOException` | |\n| `public void write(byte[]) throws\
  \ java.io.IOException` | |\n| `public void write(byte[], int, int) throws java.io.IOException`\
  \ | |\n| `public void close() throws java.io.IOException` | |\n\n### 示例 5.2\n```java\n\
