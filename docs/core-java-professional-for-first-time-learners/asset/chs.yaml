  \ 13: 978-1500730![STAR-LOGO-2013](img/00006.jpeg)\n\n## 第 4 章：Scanner 类与数组\n(命令行参数)\n\
  \n## 简介\n\n### Scanner 类：\n这是 Java 在 JDK 1.5 版本中引入的新类，用于获取基本数据类型的输入。使用该类获取输入非常简单，只需要创建该类的对象并调用特定方法。该类位于\
  \ `java.util` 包中。\n\n| `java.util.Scanner(java.io.InputStream);` |\n| `java.util.Scanner(java.io.File)\
  \ throws java.io.FileNotFoundException;` |\n| `java.util.Scanner(java.lang.String);`\
  \ |\n| `public void close();` |\n| `public boolean hasNext();` |\n| `java.lang.String\
  \ next();` 输入不含空格的字符串 |\n| `java.lang.String nextLine();` 输入可能包含空格的字符串 |\n| `public\
  \ boolean hasBoolean();` |\n| `public byte nextByte();` |\n| `public boolean hasShort();`\
  \ |\n| `public short nextShort();` |\n| `public boolean hasInt();` 输入值是否为整数 |\n\
  | `public int nextInt();` |\n| `public boolean hasLong();` |\n| `public long nextLong();`\
  \ |\n| `public boolean hasFloat();` |\n| `public float nextFloat();` |\n| `public\
  \ boolean hasDouble();` |\n| `public double nextDouble();` |\n\n**示例 4.1:**\n```java\n\
  import java.util.*;\nclass SumInput {\n    public static void main(String args[])\
  \ {\n        Scanner sc=new Scanner(System.in);\n        int a,b,sum;\n        System.out.print(\"\
  Enter number\");\n        a = sc.nextInt();\n        System.out.print(\"Enter 2nd\
  \ number\");\n        b = sc.nextInt();\n        sum = a+b;\n        System.out.println(\"\
  Sum is \" + sum);\n    }\n}\n```\n**输出:**\n```\nEnter number45\nEnter 2nd number55\n\
  Sum is 100\n```\n\n# 数组\nJava 数组是相同类型变量或数据的有序集合。Java 允许任意维度的数组。Java 数组与 C/C++ 有不同，可以在声明时指定数组的大小。内存分配总是动态的。Java\
  \ 中的每个数组都被视为一个具有特殊属性 `length`的对象，该属性指定数组中元素的数量。\n\n## 一维数组\n\n**声明：**\n`type array_name[];`\
  \ // 声明时不分配内存\n或\n`type [] array_name;`\n\n重要的是，声明并没有真正创建数组。它只是声明了一个可以指向数组对象的引用。\n\
  `int a1 [], a2;`\n`int [] a3, a4;`\n\n这两个声明将 `a1`、`a3` 和 `a4` 声明为可以表示 int 数组的引用变量，但变量\
  \ `a2` 不能表示 int 数组，它仅仅是一个 `int` 变量。当 `[]` 符号跟在类型后面，声明中的所有变量都是数组。否则，`[]` 符号必须跟在每个单独数组名称后面。\n\
  \n**使用 `new` 操作符分配内存：**\n`array_name = new type[SIZE];` // `SIZE` 可以是常量或变量。\n\n\
  - 注意 1：数组的所有元素将自动初始化为零，但为了用不同的值初始化数组，我们可以初始化数组本身：`int a[]={5,7};`\n- 注意 2：数组索引从零开始。\n\
  - 注意 3：在 Java 中，所有数组都将分配的大小存储在一个名为 `length` 的变量中。我们可以使用属性 `array_name.length` 访问数组的长度。\n\
