  \n`TextField` 和 `TextArea` 类实现了用于文本输入和显示的一维和二维组件。这两个类都继承了 `TextComponent`：`Object`\
  \ → `Component` → `TextComponent` → (`TextField, TextArea`)。这两个类都有多种构造函数，允许指定或不指定初始字符串或首选尺寸。不指定首选尺寸的构造函数最适用于布局管理器将忽略组件首选尺寸的情况。\n\
  \n### TextField 类构造函数\n- `TextField()`: 构建一个新的文本字段。\n- `TextField(int columns)`:\
  \ 构建一个具有指定列数列宽的新文本字段。\n- `TextField(String text)`: 构建一个带有指定文本的新文本字段。\n- `TextField(String\
  \ text, int columns)`: 构建一个用指定文本初始化的文本字段，宽度足够容纳指定的列数。\n\n### TextArea 类构造函数\n- `TextArea()`:\
  \ 构建一个带有空字符串的新文本区域。\n- `TextArea(int rows, int columns)`: 构建一个具有指定行数和列数的空文本文本区域。\n\
  - `TextArea(String text)`: 构建一个带有指定文本的新文本区域。\n- `TextArea(String text, int rows,\
  \ int columns)`: 构建一个带有指定文本以及指定行数和列数的文本区域。\n- `TextArea(String text, int rows, int\
  \ columns, ScrollbarPolicy)`: 构建一个带有指定文本以及指定的行、列数和滚动策略的文本区域。\n\n`Area` 类定义了几个常量，可以作为\
  \ `scrollbarPolicy` 参数的值：\n- `SCROLLBAR_BOTH`\n- `SCROLLBAR_VERTICAL_ONLY`\n- `SCROLLBAR_HORIZONTAL_ONLY`\n\
  - `SCROLLBAR_NONE`\n\n对于这两个类，`columns` 参数都存在一些出人意料的问题。首先，列数是根据特定字体渲染的文本列数来衡量宽度的。一个使用小字体的\
  \ 25 列文本区域将非常窄，而一个使用巨大字体的 5 列文本区域将极其宽。其次，存在比例字体的问题。对于等宽字体，列宽应该是多少显而易见。对于比例字体，列宽被视为字体所有字符宽度的平均值。这个平均值是集中所有字符的简单平均值；并没有考虑使用频率。因此在大多数情况下，包含小写字母的文本组件显示的字符数将超过请求的数量。\n\
  \n### Component 类中的方法\n- `String getText()`: 返回此文本组件显示的文本中选中的文本。\n- `String getText()`:\
  \ 返回此文本组件显示的文本。\n- `void setEditable(Boolean b)`: 设置决定此文本组件是否可编辑的标志。\n- `void setText(String\
  \ t)`: 将此文本组件显示的文本设置为指定的文本。\n\n### 示例 17.19\n```java\nimport java.awt.*;\nclass\
  \ TextFieldTest {\n    public static void main(String args[]) {\n        Frame f\
  \ = new Frame();\n        f.setLayout(new FlowLayout());\n        TextField tf1\
  \ = new TextField();\n        TextField tf2 = new TextField(8);\n    }\n}\n```\n\
  \n\n\n\n\n```java\nTextField tf3=new TextField(\"matrix\");\nTextField tf4=new TextField(\"\
