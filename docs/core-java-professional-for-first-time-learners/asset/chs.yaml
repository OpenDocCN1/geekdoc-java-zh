  \ of Circle\ngetdata() of Rectangle\narea() of Rectangle\ndisplay() of Rectangle\n\
  ```\n\n## 抽象类与抽象方法\n\n我们已经看到，通过将方法标记为 `final` 可以确保该方法不在子类中被重新定义。Java 允许我们做与之完全相反的操作。即我们可以指示某个方法必须在子类中被重新定义，从而使重写成为强制。这是通过在方法定义中使用\
  \ `abstract` 修饰实现的。\n\n在某些情况下，我们希望定义一个父类，它声明给定抽象的结构，但不提供每个方法的完整实现。也就是说，有时我们希望创建一个父类，它只定义一个由其所有子类共享的通用形式，而留给每个子类去填充细节。这种类决定了子类必须实现的方法性质。这种情况发生的一种方式是父类无法为某个方法创建有意义的实现。\n\
  \n要声明抽象方法，请使用此通用形式：\n`abstract return_type name (parameter-list);`\n\n任何包含一个或多个抽象方法的类也必须声明为\
  \ `abstract`。要声明一个类为 `abstract`，我们只需要在声明开始处的 `class` 关键字前面使用 `abstract` 关键字即可。\n\
  \n抽象类不能对象。也就是说，抽象类不能用 `new` 运算符直接实例化。这样的对象是没用的，因为抽象类没有被完全定义。我们还不能声明抽象构造函数或抽象静态方法。抽象类的子类必须实现父类中所有的抽象方法，或者本身也被声明为\
  \ `abstract`。\n\n### Example 6.6\n\n```java\nabstract class Shape {\n    abstract\
  \ void getdata();\n    abstract void area();\n    abstract void display();\n}\n\n\
  class Circle extends Shape {\n    void getdata() {\n        System.out.println(\"\
  getdata() of Circle\");\n    }\n}\n```\n\n\n\n\n\n```java\n    }\n\n    void display()\
  \ {\n        System.out.println(\"display() of Circle\");\n    }\n}\nclass Rectangle\
  \ extends Shape {\n    void getdata() {\n        System.out.println(\"getdata()\
  \ of Rectangle\");\n    }\n    void area() {\n        System.out.println(\"area()\
  \ of Rectangle\");\n    }\n    void display() {\n        System.out.println(\"display()\
  \ of Rectangle\");\n    }\n}\nclass InheritTest6 {\n    public static void main(String\
  \ args[]) {\n        //super reference variable accept sub class object\n      \
  \  //Dynamic binding\n        Shape s[]={new Circle(), new Rectangle()};\n     \
  \   for(int i=0;i<s.length;i++) {\n            s[i].getdata();\n            s[i].area();\n\
  \            s[i].display();\n        }\n    }\n}\n```\nOutput:\ngetdata() of Circle\n\
  area() of Circle\ndisplay() of Circle\ngetdata() of Rectangle\narea() of Rectangle\n\
  display() of Rectangle\n\n### Final 方法\n如果我们不希望一个方法被派生类重写，那么可以将基类定义为 `final`。\n\n\
  ```java\nclass A {\n    final method1() {\n        -----\n    }\n}\nclass B extends\
  \ A {\n    void method1() // error\n    {\n        -----\n    }\n}\n```\n\n### Final\
  \ 类\n有时出于安全考虑，我们可能希望防止一个类被进一步子类。不能被子类的类被称为 final 类。在 Java 中，通过如下方式使用 `final` 关键字来实现：\n\
  \n```java\nfinal class A1 {\n    -----\n    -----\n}\n```\n任何尝试继承 `A` 的行为都会导致错误，编译器将不允许这样做。将类声明为\
  \ `final` 可以防止意外的扩展。\n\n## 理论题\n1. 什么是继承？\n2. Java 中共有多少种类型的继承？\n3. 默认构造函数和参数化构造函数之间的区别是什么？\n\
  4. `final` 类和 `final` 方法之间的区别是什么？\n5. 什么是 `super` 类？\n6. 什么是 `abstract` 类？\n7. 编译时绑定和运行时绑定之间的区别是什么？\n\
  8. 方法重载和方法重写之间的区别是什么？\n\n### 简介 - 面向对象编程与过程化编程\n所有程序由两个元素组成：过程（逻辑）和数据。取决于我们的主要关注是处理还是数据，可以有两种不同的方法。过程化语言（`FORTRAN`、`PASCAL`、`COBOL`\
  \ 等）侧重于处理部分，即它们更关注“发生了什么”（过程），而较少关注“谁受到了什么影响”（数据）。随着程序变得庞大且复杂，过程化方法变得越来越不适用。面向对象的编程语言的开发是为了克服过程化语言的局限性。与过程化语言中的类似程序相比，面向对象的编程语言复杂度要低得多。面向对象的程序是围绕数据（即对象）以及该数据的一组定义良好的接口（公共方法）组织的。Java\
  \ 基于面向对象范式。Java 几乎 一门纯的面向对象语言。我们使用“几乎”一词是因为由于性能原因，Java 也支持基本数据类型。`C++` 不是纯面向对象的语言。`C++`\
  \ 是 `C` 的扩展，因此它使用了一种混合了面向过程方法和面向对象方法的方法。\n\n两种方法的基本区别总结如下：\n(i) 面向对象的程序是以数据为中心的，而用过程化语言编写的程序是以过程为中心的。\n\
  (ii) 面向对象的程序围绕数据（对象）组织，因此它们能更好地模拟真实世界的对象。\n(iii) 与过程化方法相比，面向对象方法的代码可重用性和扩展性非常高。因此代码量更少。\n\
  (iv) 面向对象的程序更容易维护，因为它们相对复杂度较低且规模较小。\n(v) 面向对象的程序基于自下而上的设计方法，而过程化程序基于自上而下的设计方法。\n\
  \n### OOP（面向对象编程）的基本概念\n下面提到了面向对象编程的一些基本元素：\n- 抽象\n- 象对象与类\n- 三大 OOP 原则：\n    -\
  \ 封装\n    - 继承\n    - 多态\n- 持久化 (Persistence)\n- 泛型 (Genericity)\n- 组合 / 聚合 (Composition\
  \ / Aggregation)\n\n### 1. 抽象\n抽象是任何编程语言（包括过程化语言）的基本元素之一。内置数据类型的概念也是一种抽象。在 `C` 语言中使用\
  \ `struct` 定义自定义数据类型的特征进一步扩展了这种抽象。\n抽象的基本目的是通过隐藏细节来降低复杂性。例如，一栋建筑不被认为是建筑材料的集合，而是一个具有独特特征和属性的定义对象。\n\
  抽象可以定义为识别对象的本质属性和行为，而不深入细节。对象的属性和行为使其与其他相似类型的对象区分开来，并有助于对对象进行分类/分组。面向对象的编程语言使用类和对象来模拟抽象。\n\
  \n### 2. 对象与类\n**对象：** 对象是一个物理或抽象的实体或事物，可以与其他相似类型的对象区分开来。对象具有三个特征：\n(i) 标识性。\n(ii)\
  \ 属性（特征）。\n(iii) 行为（方法 / 操作 / 函数）。\n对象也可以被视为 `class` 的实例，其中 `class` 类似于一种内置数据类型，而对象是变量。\n\
  \n**类：** `class` 通过抽象对象的属性和行为来表示一类对象。`class` 可以被视为创建对象的蓝图。对象具有由其 `class` 定义的属性和行为。`class`\
  \ 可以被视为用户定义的数据类型，而对象是该 `class` 所代表的数据类型的变量/实例。\n\n\n\n\n\n类也可以被视为一种用户定义的数据类型，而对象是该数据类型的一个变量。一旦定义了类，我们就可以创建任意属于该类的对象。\n\
  \n## 3. 三大 OOP 原则\n\n### 封装 (Encapsulation)\n封装是将代码与代码所操作的数据结合在一起的机制。Java 类支持这一点，因为它允许我们把代码和数据定义在一起。封装还通过将某些类成员声明为\
  \ `private`，使得它们无法从类之外的代码中访问，从而有助于实现数据隐藏。\n\n### 继承 (Inheritance)\n在面向对象编程中，继承指的是一个类的属性可以被其他被称为子类或派生类的类使用。子类或派生类是从现有类派生而来的类。它继承了现有类的所有特征，现有类也被称为基类或超类。因此，继承可以定义为从超类或基类派生出一个类的过程。继承一个类不会给基类/超类引入任何变化。与基类相比，派生类/子类拥有更丰富的属性和行为。\n\
  \n继承的主要优势是代码复用。如果基类已经使用了长时间，并且需要添加一些额外的属性和方法，我们可以通过派生另一个类来实现。派生类将能够使用基类的代码而无需调试，因为这些代码已经使用了很久。\n\
  \n### 类层次结构 (Class Hierarchy)\n所有派生自同一个基类的类都属于一个家族，并形成一个类层次结构。类层次结构可以与树结构相比，其中一个基类位于根节点且没有超类。\n\
  \n所有其他类要么派生自层次结构根节点的类，要么派生自其他类（后者直接或间接地派生自根类）。随着我们向下移动，添加的功能也越多。由叶子节点表示的类没有任何子类。以下示例展示了一些类层次结构。\n\
  \n![](img/00020.jpeg)\n\n### 多态 (Polymorphism)\n多态是一种允许用同一个接口用于一组通用动作的特性。大多数面向对象的语言在以下情况下使用多态：\n\
  \n- 运算符重载。\n- 方法重载。\n- 方法重写。\n\n#### 运算符重载 (Operator Overloading)\n大多数语言都使用这种形式的多态来处理内置操作。例如，C/C++\
  \ 或 Java 中所有的算术运算符都可以用于许多类型的操作数（`int`、`long`、`float`、`double` 等）。因此，相同的加法运算符既可以加两个整数，也可以加两个浮点数。\n\
  \nC++ 允许用户重载内置运算符。例如，我们可以重载算术运算符来处理复数。虽然 Java 对内置运算符使用了运算符重载，但它不允许用户重载运算符。\n\n####\
  \ 方法重载 (Method Overloading)\n这一特性允许我们编写多个同名的方法。C++ 和 Java 都具有这一特性。同名的方法（C++ 中称为函数）根据参数（实参）进行区分。被重载的方法必须具有不同的参数数量，或者在参数数量相同时参数的类型必须不同。\n\
  \n如果对重载方法的调用可以在编译时解析，即如果编译器可以决定调用哪一个重载方法，则称为静态绑定，这是编译时多态的一个示例。\n\n如果对重载方法的调用无法在编译时解析，即如果编译器无法决定调用哪一个重载方法，则称为动态绑定，这是运行时多态的一个示例。\n\
  \n通常情况下，Java 在运行时解析对重载方法的调用，但在许多情况下，重载方法的调用是在编译时解析的。\n\n#### 方法重写 (Method Overriding)\n\
  子类可以定义一个与超类同名的方法，且具有相同数量和类型的参数。这被称为方法重写。\n\n编译器无法解析对重写方法的调用。Java 通常使用动态绑定来解析对重写方法的调用，即决策发生在运行时。\n\
  \n## 4. 持久化 (Persistence)\n某些面向对象的语言允许我们从持久化存储介质存储/检索程序的状态，例如次级存储等永久存储介质。这被称为持久化。\n\
  \nJava 允许我们将任何对象存储在次级存储中，并在以后检索它。如果我们尝试在对象图的顶部存储一个对象，所有其他引用的对象都会被递归地定位并保存。同样，当以后检索该对象时，所有的对象及其引用（即整个对象图）都会在主内存中正确创建。\n\
  \n例如，只需保存树的根，就可以保存整个树形结构。在后续阶段，只需保存树的根，就可以在内存中重建整个树形结构。C++ 不支持这一特性。\n\n## 5. 泛型\
  \ (Genericity)\n定义一种算法，使其独立于任何特定数据类型，然后无需任何额外努力的情况下将该算法应用于各种数据类型的概念被称为泛型。C++ 使用模板支持这一特性。Java\
  \ 也通过 `Object` 类支持这一特性，`Object` 类位于 Java 中任何类层次结构的顶端。\n\n例如，使用这一特性，我们可以实现一个泛型数据类型\
  \ `stack`，使得栈能够存储任何任意类型的元素。这一特性在很大程度上提高了复用程度。\n\n## 6. 组合 / 聚合 (Composition / Aggregation)\n\
  一个对象可能由其他对象组成。这样的对象被称为复合对象或聚合对象。例如，如果 `vehicle` 类的对象被定义为由 `Engine`、`Body`、`Axle`、`Seats`\
  \ 等对象组成的复合对象，这是恰当的。\n\n### 继承 vs 组合\n从现有类派生新类有两种基本机制：继承和组合。`Bus` 类可以通过继承 `vehicle`\
  \ true 属性来派生。这里 `Bus` 是一种车辆，除了所有车辆共同属性外，还有额外的属性。\n\n也就是说，`Bus` 类与 `vehicle` 类之间是“是”（is-a）的关系，因为我们可以说公交是一辆车辆。\n\
  \n`vehicle` 类本身可能通过组合从许多其他类派生。例如，`vehicle` 类的对象可能由属于 `Engine`、`Gear Box`、`Seats`、`Driver’s\
  \ Seat Body` 和 `Steering Wheel` 等类的对象组成。\n\n在这种情况下，派生类与代表复合对象的类之间是“整体-部分”（whole-part）的关系。我们不能说车辆是一个\
  \ `Engine` 或车辆是一个 `Gear Box`。\n\n# 超类与子类 (Super classes and Subclasses)\n通常，一个类的对象同样也是另一个类的对象。矩形显然是四边形（正方形、平行四边形和梯形也是）。因此，可以说\
  \ `Rectangle` 类继承自 `Quadrilateral` 类。在这种背景下，`Quadrilateral` 类是超类，`Rectangle` 类是子类。\n\
  \n矩形是四边形的一种类型，但声称四边形是矩形是不错误的（四边形可能是平行四边形）。图展示了一些简单的继承示例。继承通常会产生比超类特征更多的子类，因此超类和子类这些术语可能会引起困惑。\n\
  \n\n\n\n\n# 继承概念\n\n然而，还有另一种看待这些术语的方式，这种方式完全合乎逻辑。因为每个子类对象都是其父类的对象，而且由于一个父类可以有多个子类，所以父类所代表的对象的集合通常比该父类的任何一个子类所代表的对象的集合大。\n\
  \n例如，父类 `Vehicle` 以通用的方式表示所有车辆，如汽车、卡车、船只、自行车等。然而，子类 `Car` 仅代表了世界上所有 `Vehicles` 中的一小部分集。继承关系形成了树形的分级结构。\n\
  \n父类与其子类之间存在层级关系。一个类完全可以独立存在，但只有当类与继承机制一起使用时，它才会成为为其他类提供属性和行为的父类，或者是继承这些属性和行为的子类。通常情况下，一个类既是子类也是父类。\n\
  \n| 父类 | 子类 |\n| :--- | :--- |\n| Student | 研究生、本科生 |\n| Shape | 圆形、三角形、矩形 |\n|\
  \ Loan | 汽车贷款、住房贷款、教育贷款 |\n| Employee | 教职人员、员工 |\n| Account | 支票账户、储蓄账户 |\n\n![11](img/00005.jpeg)\
  \ ![11](img/00005.jpeg) ![11](img/00005.jpeg) ![11](img/00005.jpeg) ![11](img/00005.jpeg)\n\
  ![STAR-LOGO-2013](img/00006.jpeg)\n\n# 第 8 章：包\n\n## 引言\n\n当我们开发一个项目时，必须将程序拆分成几个类。为了组织这些类，我们使用\
  \ `Packages`（包）。包既是一种命名机制，也是一种可见性控制机制。包是相互相关的类和接口的集合。在包的帮助下，只要类定义在不同的包中，就可以给多个类赋予相同的名称。\n\
  \n单个包不能包含两个同名的类。\n\n程序是以包的集合的形式组织的。每个包都有自己的子包集，这有助于防止命名冲突。顶层包只有在被声明为 `public` 时才能在包外部被访问。包的命名结构是层级的。包的成员包括类、接口类型以及子包。`java`\
  \ 中的包是一种封装机制，用于将相关的类、接口和子包组合在一起。\n\n对于小型程序，包可以是未命名的或有一个简单的名称，但如果代码要广泛分发，则应该选择唯一的包名。这可以防止冲突——如果两个开发小组恰好选择了相同的包名，且这些包随后被用于同一个程序中，就会发生冲突。如果我们没有为\
  \ `java` 类指定包，那么该类将成为 Java 默认包（称为无名包）的一部分。但这要求每个类必须有唯一的名称以避免冲突。\n\n### 无名包的示例\n\n\
  ```java\nclass A {\n    // - - - - - -\n    // - - - - - -\n}\nclass A_demo {\n\
  \    public static void main(String args[]) {\n        // - - - - - -\n        //\
  \ - - - - - -\n    }\n}\n```\n\n## 如何定义包\n\n要创建一个包，请将包命令作为 Java 源文件中的第一条语句。在该文件中声明的任何类都属于指定的包。包语句定义了存储类的命名空间。如果我们省略了包语句，类名将被放入默认包中，该包没有名称，被称为无名包。\n\
  \n包语句的语法如下：\n\n```java\npackage package_name;\n```\n\n`Java` 使用文件系统目录来存储包。记住大小是敏感的，目录名称必须与包名完全匹配。多个文件可以包含相同的包语句。\n\
  \n**语法：**\n\n```java\npackage p1; // 包声明\nclass A // 类声明\n{\n    // - - - - - -\
  \ 类 A 的体\n} // - - - - - -\n```\n`package` 是关键字。`p1` 是类 `A` 将要存储的包名。\n\n### 示例 8.1\n\
  \n```java\npackage p1;\nclass A {\n    public static void main(String args[]) {\n\
  \        System.out.println(\"First Package program.\");\n    }\n}\n```\n我们假设当前文件夹是\
  \ `c:\\javaprg\\p1>`\n```bash\nC:\\javaprg\\p1>javac A.java\nC:\\javaprg\\p1>java\
  \ p1.A\n```\n**输出：**\n```\nFirst Package Program\n```\n注意：如果我们在 `c:\\javaprg>` 中使用\
  \ `javac -d . A.java` 编译上述程序，则会自动创建 `p1` 文件夹，上述程序的 `.class` 文件将保在该文件夹中。但如果我们不使用\
  \ `-d` 选项编译，那么我们的责任创建 `p1` 文件夹并将 `.class` 文件放置在该文件夹中。（`.` 指导编译器在当前文件夹创建 `p1` 文件夹。如果我们想在其他文件夹中创建文件夹，也可以输入完整路径\
  \ `javac -d c:\\javaprg A.java`）。\n\n## 包\n\n`Java` 的所有内置类都存储在某些命名的包中；没有类存储在无名的默认包中。由于包内的类必须使用其包名或包名进行完全限定，为每个想要使用的类输入长长的点分隔的包路径名可能会非常繁琐。因此，`java`\
  \ 包含了 `import` 语句，用于将某些类或整个包引入可见范围。一旦导入，就可以仅使用类名直接引用该类。\n\n`import` 语句是为了程序员提供的便利，在技术上编写一个完整的\
  \ `java` 程序并不需要它。如果我们要在应用程序中引用几十个类，那么 `import` 语句将节省大量的打字时间。\n\n在 `java` 源文件中，`import`\
  \ 语句紧随包语句（如果存在）之后，并在任何类定义之前。这是 import 语句的一般形式。\n\n```java\nimport pkg1[.pkg2].classname;\n\
  import pkg1[.pkg2].*;\n```\n\n### 示例 8.2\n\n```java\n// 使用包 java.util 中的 Random\
  \ 类打印任意 10 个随机数\n// 未使用 import\nclass Random1 {\n    public static void main(String\
  \ args[]) {\n        java.util.Random r1 = new java.util.Random();\n        for(int\
  \ i=1; i<=10; i++) {\n            System.out.println(Math.abs(r1.nextInt()));\n\
  \        }\n    }\n}\n```\n**输出：**\n```\n158865952\n481996564\n21087567\n386971039\n\
  360473512\n192264171\n393055462\n88944253\n```\n\n### 示例 8.3\n\n```java\n// 使用包\
  \ java.util 中的 Random 类打印任意 10 个随机数\n// java.util import 语句\nimport java.util.*;\n\
  class Random2 {\n    public static void main(String args[]) {\n        Random r1\
  \ = new Random();\n        for(int i=1; i<=10; i++) {\n            System.out.println(Math.abs(r1.nextInt()));\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(Math.abs(r1.nextInt()));\n\
  }\n}\n}\n```\n**输出：**\n```\n686722541\n1154462827\n452959606\n1235134497\n1421490552\n\
  1065881855\n424893046\n731473166\n1217844570\n437181304\n```\n\n### CLASSPATH:\n\
  \n如果我们在当前文件夹之外的任何文件夹运行上述程序，它将无法运行。默认情况下，Java 运行时系统使用当前工作目录作为起点。\n\n因此，如果我们的包在当前目录中，或者当前目录的子目录中，它就能被找到。但要从任何其他文件夹运行上述程序，我们必须在提示符中使用命令\
  \ `SET CLASSPATH=.;C:\\JAVAPRG` 来设置类路径。`CLASSPATH` 是一个环境变量。我们每次第一次启动计算机时都必须输入此命令。但如果我们将此命令放在`我的计算机属性高级环境变量`\
  \ 中，就不需要再反复反复地输入该命令了。\n\n我们也可以在不设置 `CLASSPATH` 环境变量的情况下运行程序。这样做请输入：\n\n```bash\n\
  java –classpath c:\\javaprg p1.A\n```\n\n**注意 4**-我们可以创建包的层次级结构。要这样做，只需使用点 `.` 将每个包名与其上面的包名分开。多级包语句的通用形式为：\n\
  \n`package package_name1[.package_name2][.package_name3];`\n\n包的层次结构必须在 Java 开发系统的文件系统中反映。例如，包\
  \ `java.awt.Image` 需要存储在 `java\\awt\\image`（WINDOWS）或 `java/awt/image`（UNIX）或 `java:swt:image`（MACINTOSH）文件系统中。\n\
  \n包的层次结构代表了 `java` 类和接口的组织。它并不代表类和接口的源代码组织。\n\n每个 `java` 源文件（也称为编译单元）可以包含零或多个类和接口的定义，但编译器会为其中的每一个项生成一个包含\
  \ `java` 字节码的单独类文件。类或接口可以使用包声明来指示其 `java` 字节码放在特定的包中。\n\n*   包 `java` 有子包 `awt`、`applet`、`io`、`lang`、`net`\
  \ 和 `util`，但没有类或接口。\n*   包 `java.awt` 有一个名为 `image` 的子包，以及许多类和接口。\n*   因为包 `java.awt`\
  \ 有子包 `image`，它不能包含名为 `image` 的类或接口类型的声明。\n*   如果一个包的全限定名是 `P`，且 `Q` 是 `P` 的子包，那么\
  \ `P.Q` 就是该子包的全限定名。\n*   如果有一个名为 `mouse` 的包，且该包中有一个成员类 `Button`（这可能被引用为 `mouse.Button`），则不存在全限定名为为\
  \ `mouse.Button` 或 `mouse.Button.Click` 的包。\n*   一个源文件中最多出现一个包语句，且它必须是 Java 源文件中的第一个语句。\n\
  \n### 类成员的可见性：\n\n类和包都是封装和包含变量及方法的命名空间和范围的手段。包作为类和其他从属包的容器。类作为数据和方法代码的容器。\n\n类是\
  \ `java` 最小抽象单元。由于类和包之间的相互作用，Java 处理了类成员的五类可见性。\n\n1. 类内部可见性。\n2. 同一包内子类中的可见性。\n\
  3. 同一包内非子类的可见性。\n4. 不同包的子类中的可见性。\n5. 既不在同一包中也不是子类的子类中的可见性。\n\n**注意 1**-顶层类和接口只有两种可能的访问权限：`default`\
  \ 和 `public`。\n\n**注意 2**-如果类被声明为 `public`，则可以通过其他代码访问。\n\n**注意 3**-如果类具有默认访问权限，则它只能被同一包内的其他代码访问。\n\
  \n**注意 4**-只有当类可见时，成员的可见性才有意义。如果类的可见性修饰符是默认的，即使是类的 `public` 成员也在包内可见。\n\n### 访问修饰符：\n\
  \n![](img/00021.jpeg)\n\n### JAR 文件：(Java 档文件)\n\n为了压缩文件，我们使用某些如 `winzip` 的程序。\n\
  \n包 `java` 有子包 `awt`、`applet`、`io`、`lang`、`net` 和 `util`，但没有类或接口。\n\n包 `java.awt`\
  \ 有一个名为 `image` 的子包，以及许多类和接口。\n\n因为包 `java.awt` 有子包 `image`，它不能包含名为 `image` 的类或接口类型的声明。\n\
  \n如果一个包的全限定名是 `P`，且 `Q` 是 `P` 的子包，那么 `P.Q` 就是该子包的全限定名。\n\n如果有一个名为 `mouse` 的包，且该包中有一个成员类\
  \ `Button`（这可能被引用为 `mouse.Button`），则不存在全限定名为为 `mouse.Button` 或 `mouse.Button.Click`\
  \ 的包。\n\n一个源文件中最多出现一个包语句，且它必须是 Java 源文件中的第一个语句。\n\n### JAR 选项：\n\n| 选项 |  |\n| :---\
  \ | :--- |\n| `c` | 创建新的归档。 |\n| `C` | 执行期间更改目录。 |\n| `f` | 文件列表的第一个元素是将被创建的归档名称。\
  \ |\n| `i` | 应提供索引信息。 |\n| `m` | 文件列表的第二个元素是外部清单文件的名称。 |\n| `M` | 不创建清单文件。 |\n|\
  \ `t` | 归档应列出。 |\n| `u` | 更新现有的 JAR 文件。 |\n| `v` | 执行时应提供详细输出。 |\n| `x` | 要从归档中提取的文件。\
  \ |\n| `o` | 不使用压缩。 |\n\n创建 JAR 文件：\n```bash\njar -cf Myjar.jar pack1\n```\n这将创建一个名为\
  \ Myjar.jar 的归档，其中包含包 1 的所有文件。\n\n提取 JAR 文件：\n```bash\njar -xf Myjar.jar\n```\n\
  此命令用于提取 jar 文件（如 unzip）。\n\n列出 jar 文件的内容：\n```bash\njar -tf Myjar.jar\n```\n以下命令列出\
  \ Myjar.jar 的内容。\n\n更新现有 JAR 文件：\n```bash\njar -uf Myjar.jar pack1\n```\n以下命令用于更新文件。\n\
  \n创建可执行 JAR 文件：\n```bash\njar -cmf mainClass Myjar.jar pack1\n```\n其中 `mainClass`\
  \ 是一个文本文件，包含 \"Main-Class: pack1.pack2.pack3\"，保存在 `javaprg` 文件夹中。\n\n执行 jar 文件：\n\
  ```bash\njava -jar Myjar.jar\n```\n\n### 理论：\n\n1. 我们对包有什么理解？\n2. 解释所有的修饰符及其在不同包、子包、子类和其他类中的作用范围。\n\
  3. JAR 文件的作用是什么？\n4. `import` 语句的作用是什么？\n\n# 第 9 章：(接口)\n\n## 简介\n\n接口基本上是类的一种。。和类一样，接口包含方法和变量，但有一个主要的区别。区别在于接口只定义了抽象方法和\
  \ final 变量（常量）。这意味着接口不编写任何代码来实现这些方法，且数据字段只包含常量。\n\n\n\n\n因此，由类来实现一个接口，用以定义这些方法的实现代码。接口在语法上与类相似，但它们缺乏实例变量，且其方法声明时没有方法体。在实践中，这意味着我们可以定义接口，而不对它们的实现方式做任何假设。接口的目的是将类的接口与其实现分离来。接口仅仅定义了类必须做什么，而不对实现过程做任何说明。接口只定义方法签名，不包含任何实例变量。\n\
  \n```java\ninterface interface_name\n{\n    variable declarations;\n    methods\
  \ declarations;\n}\n```\n\n在这里，`interface` 是关键字，`interface_name` 是任何有效的 java 标识符（类似于类名）。\n\
  \n**注意：** 当我们定义一个接口时，默认情况下它是公有的且抽象的。\n\n### 接口修饰符\n\n顶层接口唯一可以修饰符是 `abstract` 和 `public`。即使我们不使用\
  \ `abstract` 修饰符，接口也会隐式地声明为抽象的，因此不需要使用 `abstract` 修饰符。顶层接口的可见性可以是包私有（package）或公共（public），就像顶层类一样。如果不使用可见性修饰符，则接口的可见性假设为包私有。\n\
  \n### 数据变量成员声明\n\n接口中只能定义常量。接口中的所有变量都是隐式的 `public`、`final` 和 `static`，这意味着它们不能被实现类修改。它们还必须用常量值进行初始化。\n\
  \n```java\npublic static final type variable_name=value;\n```\n\n在接口中声明的变量是 `public`、`static`\
  \ 且 `final` 的。这意味着是一个具有公共访问权限的静态变量。该变量也被声明为 `final`，这意味着它必须在声明时赋值，并且之后不能再修改。`final`\
  \ 关键字类似于 C/C++ 中的 `const`。\n\n### 方法声明\n\n方法声明将仅包含方法列表，而不包含任何代码语句。它们在参数列表后以分号结束。它们本质上是抽象方法，接口中指定的任何方法都不能有默认实现。\n\
  \n接口中的所有方法默认始终具有 `public` 和 `abstract` 修饰符。我们不能在接口中声明静态方法。\n\n```java\npublic abstract\
  \ return_type method_name(parameter_list);\n```\n\n这是一个包含两个变量和一个方法的接口定义示例。\n\n```java\n\
  interface item\n{\n    static final int code = 1001;\n    static final String name\
  \ = \"Matrix\";\n    abstract void display( );\n}\n```\n\n**注意：** 接口中不包含方法的代码，方法声明简单地以分号结束。\n\
  \n另一个接口示例：\n\n```java\ninterface area\n{\n    float pi = 3.14f;\n    float compute\
  \ (float x, float y);\n    void show( );\n}\n```\n\n#### interface\n\n像类一样，接口也可以被扩展，即一个接口可以从其他接口继承。新接口将以子类的方式继承子接口的所有成员。这是通过使用下所示的\
  \ `extends` 关键字实现的\n\n```java\ninterface interface_1\n{\n    int code = 1001;\n\
  \    String name = \"Matrix\";\n}\n\ninterface interface_2 extends interface_1\n\
  {\n    void display();\n}\n```\n\n`interface_2` 将继承其中的常量 `code` 和 `name`。\n\n**注意：**\
  \ 变量 `name` 和 `code` 的是像普通变量一样声明的。这在这里是允许的，但接口中的所有变量都被视为常量、公共且静态的，尽管这里没有 `public`、`static`\
  \ 和 `final` 关键字。\n\n我们可以将多个接口组合在一个接口中。以下声明是有效的：\n\n```java\ninterface interface_1\n\
  {\n    int code = 1001;\n    String name = \"Matrix\";\n}\n\ninterface interface_2\n\
  {\n    void display();\n}\n\ninterface interface_3 extends interface_1, interface_2\n\
  {\n}\n```\n\n**注意：** 始终记住接口不能扩展类。这将违反“接口只能有抽象方法和常量”的规则。\n\n### 实现接口\n\n接口被用作“超类”，其属性被类继承。因此，必须创建一个继承给定接口的类。一旦定义了接口，一个或多个类就可以实现该接口。\n\
  \n要实现接口，要在类定义中包含 `implements` 子句，然后创建接口声明的方法。实现类必须提供所有接口中所有方法的方法体，否则必须声明为抽象类。实现类还可以扩展一个类，并实现多个接口。\n\
  \n```java\nclass class-name implements interface-name\n{\n}\n\nclass _name implements\
  \ interface_name\n```\n\nJava 不支持多继承，但它支持多接口继承，即一个类可以实现多个接口，如下所示：\n\n```java\nclass\
  \ class-name implements interface-1, interface-2, interface-3, ....interface-n\n\
  {\n}\n```\n\n**注意：** 当我们实现接口方法时，它必须声明为 `public`。实现接口方法类似于重写，我们不能降低可见性。\n\n#### 示例\
  \ 9.1\n\n```java\ninterface interface_1\n{\n    void show(int x);\n}\n\nclass class_1\
  \ implements interface_1\n{\n    public void show(int x)\n    {\n    }\n}\n```\n\
  \n#### 抽象类的示例 9.2\n\n```java\ninterface common\n{\n    void push(int x);\n    int\
  \ pop();\n}\n\nabstract class stack implements common\n{\n    abstract void disp();\n\
  }\n```\n\n\n\n\n在这里，`stack` 类没有实现 `push()` 和 `pop()` 方法。因此，我们必须将 `stack` 类声明为抽象类，这种技术被称为部分实现。\n\
  \n## 接口继承的各种形式：\n\n(a)\n![](img/00023.jpeg)\n(单级接口继承)\n\n(b)\n![](img/00024.jpeg)\n\
  (多级接口继承)\n\n(c)\n![](img/00025.jpeg)\n(层级接口继承)\n\n(d)\n![](img/00026.jpeg)\n(混合接口继承)\n\
  \n## 通过接口引用访问实现类对象\n\n我们可以将变量声明为使用接口而非类类型的对象引用。任何实现了所声明接口的类的实例，都可以通过此类变量进行引用。当我们通过这些引用之一调用方法时，将根据所引用的接口的实际实例调用正确版本。\n\
  \n这是接口的重要特性之一。要执行的方法将在运行时动态查找，这允许类在调用其方法的代码之后再创建。调用代码可以通过接口进行分发，而无需了解关于“调用者”的任何信息。这一过程类似于使用父类引用来访问子类对象。\n\
  \n由于运行时对方法的动态查找与 Java 中的普通方法调用相比会产生巨大的开销，因此在性能关键代码中，我们应随意使用接口。\n\n### 示例 9.3\n\n\
  ```java\ninterface Math_function {\n    void display(int x);\n}\n\nclass Sqrt implements\
  \ Math_function {\n    public void display(int x) {\n        System.out.println(\"\
  sqrt of x =\"+Math.sqrt(x));\n    }\n}\n\nclass Log implements Math_function {\n\
  \    public void display(int x) {\n        System.out.println(\"log of x = \"+Math.log(x));\n\
  \    }\n}\n\nclass Math_Demo {\n    public static void main(String args[]) {\n \
  \       Math_function f1 = new Sqrt();\n        Math_function f2 = new Log();\n\
  \        f1.display(27);\n        f2.display(3);\n        Math_function f3;\n  \
  \      f3 = f1; // 多态（赋值引用）\n        f3.display(30);\n        f3 = f2; // 多态（赋值引用）\n\
  \        f3.display(5);\n    }\n}\n```\n输出：\n![](img/00027.jpeg)\n\n## 接口的特性\n\n\
  - 接口 是一个关键字。\n- 接口可以声明为抽象的，但它默认就是抽象的，因此不需要添加 `abstract` 关键字。\n- 所有变量始终是 `public\
  \ static-final`。\n- 接口的所有方法必须在类中实现。\n- 实现类实现的所有方法必须是 `public` 的。\n- 接口仅包含方法的声明。\n\
  - 接口方法不能声明为 `static`。它们始终被声明为实例方法。\n- 类既不能缩小接口方法的访问权限，也不能在方法的 `throws` 子句中指定新的异常；因为尝试这样做等同于更改接口，这是非法的。重写方法的标准也适用于实现接口方法。\n\
  - 在实现类中，所有方法都需要定义为 `public`。\n- 这里允许使用 `abstract` 关键字进行部分实现。\n- 无论类直接或间接实现了多少接口，对于在接口中可能有多个声明的方法，它只提供单一的实现。\n\
  - 方法原型声明也可以像类的情况一样进行重载。\n- 接口常量可以通过任何客户端（类或接口）使用其全限定名来访问，无论该客户端是否扩展或实现了该接口。然而，如果客户端是实现此接口的类或扩展此接口的接口，则客户端也可以直接访问此类常量，而无需使用全限定名。此类客户端继承了接口常量。\n\
  - 在接口常量多继承的情况下，任何名称冲突都可以使用相关常量的全限定名来解决。\n\n### 接口变量\n接口中的所有变量始终是 `public static\
  \ final`，因为它们是实现类访问数据类型和方法的公共部分。\n\n### 接口变量的内存管理\n静态变量在程序加载时总是获得内存，它们占用独立的内存，不与任何对象的内存共享。它们也被称为常量变量。可以直接使用接口名称和\
  \ `.` 运算符访问它们。\n\n### 示例 9.4\n\n```java\ninterface Static_Var {\n    int sun = 1;\n\
  \    int mon = 2;\n    int tues = 3;\n    int wed = 4;\n    int thurs = 5;\n   \
  \ int fri = 6;\n    int sat = 7;\n}\n\nclass Week_Day {\n    public static void\
  \ main(String args[]) {\n        System.out.println(Static_Var.sun);\n        System.out.println(Static_Var.mon);\n\
  \        System.out.println(Static_Var.tues);\n        System.out.println(Static_Var.wed);\n\
  \        System.out.println(Static_Var.thurs);\n        System.out.println(Static_Var.fri);\n\
  \        System.out.println(Static_Var.sat);\n    }\n}\n\nclass Week_Day {\n   \
  \ public static void main(String args[]) {\n        System.out.println(Static_Var.sun);\n\
  \        System.out.println(Static_Var.mon);\n        System.out.println(Static_Var.tues);\n\
  \        System.out.println(Static_Var.wed);\n    }\n}\n```\n\n\n\n\n\n```java\n\
  System.out.println(Static_Var.thurs);\nSystem.out.println(Static_Var.fri);\nSystem.out.println(Static_Var.sat);\n\
  ```\n\n输出: 1\n2\n3\n4\n5\n6\n7\n\n###  9.5\n\n```java\ninterface Two_Methods {\n\
  \    void m1( );\n    void m2( );\n}\nclass Three_Methods implements Two_methods\
  \ {\n    public void m1( ) {\n        // body of m1;\n    }\n    public void m2(\
  \ ) {\n        // body of m2;\n    }\n    public void m3( ) {\n        // body of\
  \ m3;\n    }\n}\nclass Methods_Demo {\n    public static void main(String args[])\
  \ {\n        Two_methods tm1 = new Three_methods();\n        tm1.m1();\n       \
  \ tm1.m2();\n        //tm1.m3(); error\n        Three_Methods tm2 = new Three_Methods();\n\
  \        tm2.m3();\n    }\n}\n```\n\n**注意**：在这里我们不能使用接口引用调用 `m3()`，因为该方法在接口中没有声明。因此，接口引用只能访问在接口自身块中声明的方法。否则，我们可以调用相同类的对象或扩展类的对象。\n\
  \n### 示例 9.6 在类中实现两个接口\n\n```java\ninterface Two_Methods {\n    void m1( );\n  \
  \  void m2( );\n}\ninterface One_Method extends Two_Methods {\n    void m3();\n\
  }\nclass Three_Methods implements One_methods {\n    int arr[] = new int[5];\n \
  \   int top= -1;\n    public void push(int item) {\n        if(top == 4) {\n   \
  \         System.out.println(\"Overflow\");\n            return;\n        }\n  \
  \      top++;\n        arr[top]=item;\n    }\n    public int pop() {\n        if(top\
  \ == -1) {\n            System.out.println(\"Underflow\");\n            return -1;\n\
  \        }\n        int item = arr[top];\n        top--;\n        return (item);\n\
  \    }\n    void disp() {\n        for(int i=top;i>=0;i--) {\n            System.out.println(arr[i]);\n\
  \        }\n    }\n}\nclass Stack_Demo {\n    public static void main(String args[])\
  \ {\n        Stack s1=new Stack();\n        s1.pop();\n        for(int i=0;i<5;i++)\n\
  \            s1.push(i+100);\n        s1.push(60);\n        System.out.println(\"\
  ----Display All Item----\");\n        s1.disp(); //non methods\n        System.out.println(\"\
  ----Removing All Items----\");\n        for(int i=0;i<5;i++) {\n            System.out.println(s1.pop());\
  \ //1 underflow\n        }\n        Two_Methods t1=new Stack();\n        t1.push(10);\n\
  \        System.out.println(t1.pop());\n        //t1.disp(); error\n    }\n}\n```\n\
  \n输出:\nUnderflow\nOverflow\n----Display All Item----\n104\n103\n102\n101\n100\n\
  ----Remove All Items----\n104\n103\n102\n101\n100\n10\n\n\n\n\n\n# (String 和 StringBuffer)\n\
  \n## 简介\n在 Java 中，String 是类对象，并通过两个类实现，即 `String` 和 `StringBuffer`。与 C 语言字符串相比，Java\
  \ 的 `String` 更为可靠且可预测。这基本上是因为 C 语言缺乏边界检查。Java 的 `String` 不是字符数组，也不是以 NULL 结尾的。通常情况下，Java\
  \ 不允许将运算符应用到 `String` 对象上。\n\n这条规则的唯一例外是 `+` 和 `+=` 运算符，它们会连接两个字符串并生成一个 `String`\
  \ 对象作为结果。在 Java 中，字符数组不被视为字符串。Java 定义了 `String` 类来执行所有的字符串操作。`String` 类和 `StringBuffer`\
  \ 类是 `java.lang` 包的一部分。\n\n## String 类\n```java\nString s1 = new String(\"matrix\"\
  );\nString s2 = \"matrix\";\nSystem.out.println(s1);\nSystem.out.println(s1.length);\n\
  System.out.println(\"matrix\".length);\n```\n\nString 在 Java 中具有以下特性：\n\n### (i)\
  \ String 是 Java 中的一个对象\n`String` 代表一个字符序列，但与许多将 String 实现为字符数组的语言不同，Java 将字符串实现为\
  \ `string` 类型的对象。\n\n字符串操作是许多 Java 程序中最常见的部分。将字符串实现为内置对象允许 Java 能够提供全套功能，使得字符串处理变得非常方便。此外，字符串对象可以通过多种方式构造，使得在需要时很容易获取字符串。\n\
  \n### (ii) String 是不可变的\n`String` 是不可变的，也就是说我们无法在创建后更改该字符串。但是，声明为 `String` 引用的变量可以随时更改以指向其他字符串对象。\n\
  \n我们仍然可以执行所有类型的字符串操作。每当我们需要现有字符串的修改版本时，都会创建一个包含修改内容的新 `String` 对象。\n\n原始字符串保持不变。采用这种方法是因为固定的、不可变的字符串可以比可变的字符串实现得更高效。\n\
  \n对于那些需要修改字符串的场景，有一个名为 `StringBuffer` 的伴随类，它的对象包含了了可以在创建后进行修改的字符串。\n\n### (iii)\
  \ String 类是 final 的\n`String` 和 `StringBuffer` 类都是 `final` 的。这意味着我们不能在其他类中扩展 `String`\
  \ 类。这允许进行某些优化，从而提高常用字符串操作的性能。\n\n## String 类的构造器与方法\n\n| 序号 | 方法 |or | 示例 |\n| :---\
  \ | :--- | :--- | :--- |\n| 1 | `public String()` | 初始化新创建的 `String` 对象，使其表示空字符序列。\
  \ | `String s1 = new String();` |\n| 2 | `public String(String str)` | 初始化新创建的 `String`\
  \ 对象，使其表示与参数相同的字符序列；换句话说，新创建的字符串是参数字符串的拷贝。 | `String s1 = new String(\"Matrix\"\
  ); String s2 = new String(s1); // 字符串 s2 是 s1 的拷贝。虽然内容相同，但 s1 和 s2 指向不同的字符串对象。 |\n\
  | 3 | `public String(char ch[])` 分配一个新的 `String`，使其表示字符数组参数当前包含的字符序列。 | `char ch[]\
  \ = {'a', 'b', 'c'}; String s1 = new String(ch); //s1 将持有 \"abc\"` |\n| 4 | `public\
  \ String(char value[], int offset, int count)` | 分配一个新的 `String`，其包含来自字符数组参数子数组的字符。\
  \ | `char ch[] = {'a', 'b', 'c', 'd', 'e', 'f'}; String s1 = new String(ch, 2, 3);\
  \ // s1 将持有 \"cde\"` |\n| 5 | `public String(int value[], int offset, int count)`\
  \ | 分配一个新的 `String`，其包含包含字符 Unicode 的整数数组子数组的字符。 | `int a[] = {97, 98, 99, 100,\
  \ 101, 102}; String s1 = new String(a, 2, 3); // s1 将持有 \"cde\"` |\n| 6 | `public\
  \ String(byte b[], int offset, int count)` | 使用平台的默认字符集解码指定的字节子数组以构造新的 `String`。\
  \ | `byte b[] = {97, 98, 99, 100, 101, 102}; String s1 = new String(b, 2, 3); //\
  \ s1 将持有 \"cde\"` |\n| 7 | `public String(byte[])` | 使用平台的默认字符集解码指定的字节数组以构造新的 `String`。\
  \ | `byte b[] = {97, 98, 99}; String s1 = new String(b); //s1 将持有 \"abc\"` |\n|\
  \ 8 | `public String(StringBuffer)` | 从 `StringBuffer` 构造 `String`。 | |\n| 9 | `public\
  \ int length()` | 返回字符串中的字符数。 | |\n| 10 | `public boolean isEmpty()` | 如果字符串为空则返回\
  \ true，否则返回 false。 | `String s1 = new String(); System.out.println(s1.isEmpty());`\
  \ |\n| 11 | `public char charAt(int index)` | 返回指定索引处的字符。如果索引无效则抛出 `StringOutOfBoundsException`。\
  \ | `String s1 = \"matrix\"; System.out.println(s1.charAt(0)); // 将打印 \"m\"` |\n\
  | 12 | `public void getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)`\
  \ | 将此字符串中的字符拷贝到目标数组中。 | |\n| 13 | `public void getBytes(int srcBegin, int srcEnd,\
  \ byte[] dst, int dstBegin)` | 将 `srcBegin` 到 `srcEnd` 的字符串编码到从 `dstBegin` 开始的字节数组中。\
  \ | |\n| 14 | `public byte[] getBytes()` | 使用默认字符集将此字符串编码为字节序列。 | |\n| 15 | `public\
  \ boolean equals(Object obj)` | 比较调用的字符串与指定的对象。 | |\n| 16 | `public boolean equalsIgnoreCase(String\
  \ str)` | 忽略大小写比较调用的字符串与另一个字符串。 | |\n| 17 | `public int compareTo(String str)` |\
  \ 按字典顺序比较调用的字符串与作为参数传递的字符串。 | |\n| 18 | `public int compareToIgnoreCase(String str)`\
  \ | 忽略大小写差异按字典顺序比较两个字符串。 | |\n| 19 | `public boolean regionMatches(int startIndex,\
  \ String str2, int str2StartIndex, int len)` | 测试两个字符串区域是否相等。 | |\n| 20 | `public\
  \ boolean regionMatches(Boolean ignoreCase, int startIndex, String str2, int str2StartIndex,\
  \ int len)` | 忽略大小写测试两个字符串区域是否相等。 | |\n| 21 | `public boolean startsWith(String\
  \ prefix, int startIndex)` | 测试此字符串从指定的索引开始是否以指定的前缀开头。 | |\n| 22 | `public boolean\
  \ startsWith(String prefix)` | 测试此字符串是否以指定的前缀开头。 | |\n\n\n\n\n\n| 行 | 方法 | 描述 |\n\
  |---|---|---|\n| 23 | `public boolean endsWith(String suffix)` | 测试此字符串是否以指定的后缀结束。\
  \ |\n| 24 | `public int indexOf(char ch)` | 返回指定字符在此字符串中首次出现的索引。 |\n| 25 | `public\
