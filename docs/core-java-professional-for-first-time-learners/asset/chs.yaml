  \n### 动态 Applet\n\nApplet 窗口中显示的输出可以是是动态的。例如，我们可以显示一个滚动横幅。Applet 还可以用于应用程序，如通过从服务器获取板球比赛得分和其他统计数据；显示股票价格等。\n\
  \n### 示例 16.3\n下面的示例显示了一个滚动横幅。它演示了使用 `repaint()` 方法来刷新显示。该 applet 从右到左跨越 applet\
  \ 窗口滚动消息。\n\n由于消息滚动是一项重复任务，它由一个单独的线程执行，该线程在 applet 初始化时被创建。此程序还演示了可以在 `stop()` 方法中释放资源，并在\
  \ `start()` 方法中重新获取。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n/*applet\
  \ code=\"App3\" width=500 height=100></applet*/\npublic class App3 extends Applet\
  \ implements Runnable {\n    String msg=\"A Moving Banner.\" ;\n    Thread t = null;\n\
  \    boolean stopFlag;\n    public void init () {\n```\n```\n\n\n\n```java\nsetBackground(Color.cyan);\n\
  setForeground(Color.red);\n}\npublic void start()\n{\n    t=new Thread(this);\n\
  \    stopFlag = false ;\n    t.start ();\n}\npublic void stop()\n{\n    stopFlag=true;\n\
  \    t=null;\n}\npublic void paint(Graphics g)\n{\n    g.drawString(msg, 0, 0);\n\
  }\npublic void run()\n{\n    for (;;)\n    {\n        repaint();\n        try\n\
  \        {\n            Thread.sleep(250);\n        }\n        catch(InterruptedException\
  \ e)\n        {\n            System.out.println(e);\n        }\n        msg = msg.substring\
  \ (1) + msg.charAt(0);\n        if (stopFlag)\n            break;\n    }\n}\n```\n\
  \n输出：\n\n### 使用状态窗口：\n\n除了在其窗口中显示信息外，applet 还可以向运行其的浏览器窗口或 `appletviewer` 的状态窗口输出消息。\n\
  \n要做到这一点，请调用 `getStatus( )` 并传入我们想要显示的字符串。状态窗口是向用户反馈 applet 中正在发生的情况、建议选项或报告某些类型错误的好地方。\n\
  \n状态窗口也是极佳的调试辅助（帮助），因为它为我们提供了一种输出关于 applet 信息的简单方法。\n\n#### 示例 16.4：下面的示例演示了如何使用状态窗口。\n\
  \n```java\nimport java.awt.*;\nimport java.applet.*;\n/*<applet code=\"App4\" width=500\
  \ height=100></applet>*/\npublic class App4 extends Applet\n{\n    public void init()\n\
  \    {\n        setBackground(Color.cyan);\n    }\n    public void paint(Graphics\
  \ g)\n    {\n        g.drawString(\"This is in the applet window\",0,20);\n    \
  \    getStatus(\"This is shown in status window\");\n    }\n}\n```\n输出：images/00056.jpeg\n\
  \n### HTML 的 APPLET 标签：\n\n`APPLET` 标签用于从 HTML 文档和 `appletviewer` 启动 applet。\n\n\
  `appletviewer` 会在独立的窗口中执行找到的每个 `APPLET` 标签；而像 Netscape Navigator 和 Internet Explorer\
  \ 等浏览器允许在单个页面上许多 applet。\n\n标准 `APPLET` 标签的语法为：\n\n```html\n<APPLET\n    CODE=appletclassname\n\
  \    CODEBASE=codebase URL\n    ALT=alternate Text,\n    NAME=appletInstename\n\
  \    WIDTH=pixels\n    HEIGHT=pixels\n    ALIGN=alignment\n    VSPACE=vertical space\
  \ in pixels\n    HSPACE=horizontal space in pixels>\n<PARAM NAME=attributeName-1\
  \ VALUE=Attribute Value-1>\n<PARAM NAME=attributeName-2 VALUE=Attribute Value-2>\n\
  -------------\n<PARAM NAME=attributeName-N VALUE=Attribute Value-N>\n………在没有 Java\
  \ 的显示的 HTML………\n</APPLET>\n```\n\n### CODE：\n\n`CODE` 是一个必需属性，用于提供包含我们 applet 编译类文件的文件名。该文件相对于\
  \ applet 的 `CODEBASE` URL，而 `CODEBASE` 是 html 文件所在的目录，或者是在设置了 `CODEBASE` 时所指定的目录。\n\
  \n### CODEBASE：\n\n`CODEBASE` 是一个可选属性，用于指定 applet 代码的基础 URL，该目录将用于搜索 applet 的可执行类文件（由\
  \ `CODE` 标签指定）。如果没有指定此属性，则使用 HTML 文档的 URL 作为 `CODEBASE`。`CODEBASE` 不一定位于读取 HTML\
  \ 文档的主机上。\n\n### ALT：\n\n`ALT` 标签是一个可选属性，用于指定当浏览器理解 `APPLET` 标签但当前无法运行 applet 时应显示的短文本。这与我们为不支持\
  \ applet 的浏览器提供的替代 HTML 是不同的。\n\n#### NAME：\n\n`NAME` 是一个可选属性，用于为 applet 实例指定名称。applet\
  \ 必须命名，以便同一页面上的其他 applet 能通过名称找到它们并与之通信。要通过名称获取 applet，请使用 Applet 接口定义的 `applet()`。\n\
  \n#### WIDTH 和 HEIGHT：\n\n`WIDTH` 和 `HEIGHT`：applet 显示区域的大小（单位为像素）。\n\n### ALIGN：\n\
  \n`ALIGN` 是一个可选属性，用于指定 applet 的对齐方式。该属性的处理方式与 HTML 的 `IMG` 标签相同，可能值为：`LEFT`、`RIGHT`、`BOTTOM`、`TEXTTOP`、`MIDDLE`\
  \ 和 `BOTTOM`。\n\n#### VSPACE 和 HSPACE：\n\n`VSPACE` 和 `HSPACE`：这些属性是可选的。`VSPACE`\
  \ 指定 applet 上下方的间距（像素）。`HSPACE` 指定 applet 左右两侧间距（像素）。它们的处理方式与 `IMG` 标签的 `VSPACE`\
  \ 和 `HSPACE` 属性相同。\n\n#### PARAM 标签\n\n`PARAM` 标签允许我们在 HTML 页面中指定 applet 特定的参数。applet\
  \ 通过 `getParameter()` 方法访问其属性。`PARAM` 标签有两个属性：`NAME` 和 `VALUE`。\n\n#### 示例 16.5\
  \ 此示例演示了如何从 HTML 页面向 Applet 传递参数。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
  /*<applet code=\"App5\" width=500 height=100>\n    <param name=\"fontName\" value=\"\
  Arial\">\n    <param name=\"fontSize\" value=\"30\">\n</applet>*/\npublic class\
  \ App5 extends Applet\n{\n    String fName;\n    int fSize;\n    public void init\
  \ ()\n    {\n        fName = getParameter(\"fontName\");\n        if (fName == null)\n\
  \            fName = \"Courier\";\n        fSize = Integer.parseInt(getParameter(\"\
  fontSize\"));\n        Font f1= new Font(fName, Font.PLAIN, fSize);\n        setFont(f1);\n\
  \    }\n    public void paint (Graphics g)\n    {\n        g.drawString(\"Font Name\
  \ : \" + fName, 0, 25);\n        g.drawString(\"Font Size : \" + fSize, 0, 50 );\n\
  \    }\n}\n```\n\n\n\n\n\n```java\ng.drawString (\"Hello world\", 0,75);\n    }\n\
  }\n```\n\n输出:\n\n![](img/00058.jpeg)\n\n## 获取 DocumentBase 和 CodeBase\n\n通常，我们会创建需要显式加载媒体和文本的\
  \ applet。Java 允许 applet 从启动 applet 的 HTML 文件所在的目录（文档基础，document base）以及加载 applet\
  \ 类文件的目录（代码基础，code base）加载数据。\n\n这些目录以 `URL` 对象返回。它们可以与命名我们想要加载的文件的字符串拼接。要实际加载另一个文件，我们将使用由\
  \ `Applet` 接口定义的 `showdocument()` 方法。\n\n### 示例 16.6 下面的示例演示了如何在 applet 代码中获取文档基础和代码基础。\n\
  \n### App6.java\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n\
  public class App6 extends Applet\n{\n    public void paint (Graphics g)\n    {\n\
  \        URL u1 = getCodeBase();\n        g.drawString (\"Code base:-\" + u1, 10,20);\n\
  \        URL u2 = getDocumentBase();\n        g.drawString (\"Document base:-\"\
  +u2, 10,40);\n    }\n}\n```\n\n### App6.html\n```html\n<html>\n<body>\n    <applet\
  \ code=\"App6\" width=500 height=200></applet>\n</body>\n</html>\n```\n输出:\n\n##\
  \ AppContext 和 ShowDocument\n\nJava 的一个应用场景是使用活跃的图像和动画，以提供一种图形化的网页导航手段，这比超文本使用的下划线文字更有趣。为了允许我们的\
  \ applet 将控制转移到另一个 URL，我们必须使用由 `AppContext` 接口定义的 `showDocument()` 方法。\n\n`AppContext`\
  \ 是允许我们从 applet 的执行环境中获取信息的接口。当前执行的 applet 的上下文通过调用 applet 类定义的 `getContext()` 方法获取。在\
  \ applet 内部，一旦我们获得了 applet 的上下文，就可以通过调用 `showDocument()` 方法将另一个文档引入视图。此方法没有返回值，也不会抛出异常，因此请谨慎使用。有两个\
  \ `showDocument()` 方法：\n\n- `void showDocument(URL url)`：用给定的 URL 替换当前查看的网页。\n-\
  \ `void showDocument (URL url, String where)`：在浏览器窗口内的指定位置显示指定的文档。`where` 的有效参数为：\n\
  \    - `\"_self\"`（在当前帧中显示）\n    - `\"_parent\"`（在父帧中显示）\n    - `\"_top\"`（在顶层帧中显示）\n\
  \    - `\"_blank\"`（在新浏览器窗口中显示）\n\n### 示例 16.7 下面的 applet 演示了 Applet Context 和 showDocument()\
  \ 的用法。执行时，它获取当前的 applet 上下文并使用该上下文将控制转移到名为 `A.html` 的文件。该文件必须与 applet 位于同一目录。`Test.html`\
  \ 可以包含你喜欢的任何超文本。\n\n### App7.java\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
  import java.net.*;\npublic class App7 extends Applet\n{ \n    AppContext ac;\n \
  \   URL u1;\n    public void init()\n    {\n        setBackground(Color.cyan);\n\
  \    }\n    public void start( )\n    {\n        ac = getContext();\n        u1\
  \ = getCodeBase();\n        try\n        {\n            Thread.sleep(300);\n   \
  \         ac.showDocument(new URL(u1 + \"A.html\"),\"_blank\");\n        }\n   \
  \     catch(MalformedURLException e)\n        { \n            showStatus(\"Invalid\
  \ URL\");\n            e.printStackTrace();\n        }\n        catch(InterruptedException\
  \ e)\n        { \n            showStatus(\"Invalid URL\");\n            e.printStackTrace();\n\
  \        }\n    }\n    public void paint (Graphics g)\n    {\n        g.drawString(\"\
  A.html\",0,20);\n        try\n        {\n            Thread.sleep(300);\n      \
  \  }\n        catch(InterruptedException e)\n        {\n            System.out.println(e);\n\
  \        }\n    }\n}\n```\n\n### App7.html\n```html\n<html>\n<head>\n    <Title>Applet\
  \ Demo</Title>\n</head>\n<body>\n    <applet code=\"App7\" width=200 height=200></applet>\n\
  </body>\n</html>\n```\n\n### A.html\n```html\n<html>\n<head>\n    <title>New Page</title>\n\
  </head>\n<body bgcolor=blue text=red>\n    <h1>matrix</h1>\n</body>\n</html>\n```\n\
  \n### 示例 16.8\n```java\nimport java.applet.*;\nimport java.awt.*;\nimport java.awt.event.*;\n\
  /*<applet code=\"CopyApp\" width=500 height=20>*/\npublic class CopyApp implements\
