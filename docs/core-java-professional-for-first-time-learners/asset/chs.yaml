  \ void main(String args[]) {\n        Frame f=new Frame();\n        f.setLayout(new\
  \ GridLayout(1, 2));\n        f.setSize(250, 150);\n        ScrollPane pane=new\
  \ ScrollPane();\n        pane.setBackground(Color.green);\n        f.add(pane);\n\
  \        f.add(new TextArea());\n        Button b1=new Button(\"Push Me !\n    \
