  Button Pushed\");\n    }\n}\n\nclass C implements ActionListener {\n    public void\
  \ actionPerformed(ActionEvent e) {\n        System.out.println(\"Button Clicked\"\
  );\n    }\n}\n```\n\n**输出：** ![](img/0084.jpeg\n\n### 示例 18.2\n\n```java\nimport\
