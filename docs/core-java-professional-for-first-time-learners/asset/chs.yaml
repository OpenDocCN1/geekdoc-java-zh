  \ | `public int indexOf(String str)` | 返回指定子字符串在此字符串中首次出现的索引。 |\n| 27 | `public\
  \ int indexOf(String str, int fromIndex)` | 从指定的索引处开始，返回指定子字符串在此字符串中首次出现的索引。 |\n\
  | 28 | `public int lastIndexOf(int ch)` | 返回指定字符在此字符串中最后一次出现的索引。 |\n| 29 | `public\
