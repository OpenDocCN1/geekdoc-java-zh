  `javac DispClassMembers.java`\n`DispClassMembers`\n\n### toString():\n\n如果子类没有重写此方法，它将返回对象的文本表示，其格式如下：`<类名>@<对象的哈希值>`。该方法通常会被重写并用于调试目的。方法调用\
  \ `System.out.println(obj)` 会隐式地使用 `toString()` 方法将其参数转换为文本表示。\n\n### 示例 20.3:\n\
  \n此示例演示了如果我们尝试显示 `Box` 类的对象时会发生什么。该对象通过该类的 `toString` 方法转换为文本表示。\n\n```java\nclass\
  \ Box {\n    double w,h,d;\n    Box(double w, double h, double d) {\n        this.w=w;\n\
  \        this.h=h;\n        this.d=d;\n    }\n}\nclass ToStringDemo1 {\n    public\
  \ static void main(String args[]) {\n        Box b= new Box(10,2,4);\n        String\
  \ s=\"Box:\"+b;\n        System.out.println(b);\n        System.out.println(s);\n\
  \    }\n}\n```\n\n输出：\nBox@hashcode\nBox:Box@hashcode\n\n### 示例 20.4:\n\n此示例演示了如果我们在\
  \ `Box` 类中重写了 `toString()` 方法，则将使用重写后的方法将对象转换为其文本表示。\n\n```java\nclass Box {\n \
  \   double w,h,d;\n    Box(double w, double h, double d) {\n        this.w=w;\n\
  \        this.h=h;\n        this.d=d;\n    }\n    public String toString() {\n \
  \       return \"Dimensions are \"+w+\" by \"+h+\" by \"+d+\"\".\";\n    }\n}\n\
  class ToStringDemo2 {\n    public static void main(String args[]) {\n        Box\
  \ b= new Box(10,2,4);\n        String s=\"Box:\"+b;\n        System.out.println(b);\n\
  \        System.out.println(s);\n    }\n}\n```\n\n输出：\nDimensions are 10.0 by 2.0\
  \ by 4.0.\nBox:Dimensions are 10.0 by 2.0 by 4.0.\n\n\n\n\n\n```java\nclass TestClone1\
  \ implements Cloneable {\n    int a;\n    float b;\n    public TestClone1 clone2()\
  \ throws CloneNotSupportedException {\n        return (TestClone1) clone();\n  \
  \  }\n}\n\nclass CloneDemo1 {\n    public static void main(String a[]) throws CloneNotSupportedException\
  \ {\n        TestClone1 tc1 = new TestClone1();\n        TestClone1 tc2;\n     \
  \   tc1.a = 8; tc1.b = 4.5f;\n        tc2 = tc1.clone2();\n        System.out.println(tc2.a);\n\
  \        System.out.println(tc2.b);\n    }\n}\n```\n输出:\n8\n4.5\n\n在这里，`clone2()`\
  \ 方法调用了 `Object` 类的 `clone()` 并返回结果。请注意，`clone()` 返回的对象必须强制转换为其相应的类型，即 `TestClone1`。\n\
  \n示例 2：重写了 `clone()` 方法以便在类外部进行调用。要做到这一点，它的访问修饰符必须是 `public`。\n\n```java\nclass\
  \ TestClone2 implements Cloneable {\n    int a;\n    float b;\n    public Object\
  \ clone() throws CloneNotSupportedException {\n        return super.clone();\n \
  \   }\n}\n\nclass CloneDemo2 {\n    public static void main(String args[]) throws\
  \ CloneNotSupportedException {\n        TestClone2 tc1 = new TestClone2();\n   \
  \     TestClone2 tc2;\n        tc1.a = 8; tc1.b = 4.5f;\n        tc2 = (TestClone2)\
  \ tc1.clone();\n        System.out.println(tc2.a + \" , \" + tc2.b);\n    }\n}\n\
  ```\n输出: 8 , 4.5\n\n示例 3：重写了 `clone()` 方法，使其不使用 `Object` 类的 `clone()` 方法。我们正在编写自己的\
  \ `clone()` 方法。\n\n```java\nclass TestClone3 {\n    int a;\n    float b;\n    public\
  \ Object clone() {\n        TestClone3 tc = new TestClone3();\n        tc.a = a;\n\
  \        tc.b = b;\n        return tc;\n    }\n}\n\nclass CloneDemo3 {\n    public\
  \ static void main(String args[]) {\n        TestClone3 tc1 = new TestClone3();\n\
  \        TestClone3 tc2;\n        tc1.a = 8;\n        tc1.b = 4.5f;\n        tc2\
  \ = (TestClone3) tc1.clone();\n        System.out.println(tc2.a + \" \" + tc2.b);\n\
  \    }\n}\n```\n输出: 8 4.5\n\n注意：在实现 `clone()` 方法时，你不需要声明 `CloneSupportedException`，但需要实现\
  \ `Cloneable` 接口。\n\n### 克隆的副作用\n\n克隆引起的副作用有时难以发现。人们很容易认为一个类可以安全克隆，但实际上并非如此。通常情况下，如果没有充分理由，你不应该为任何类实现\
  \ `Cloneable`。\n\n示例 4：此示例演示了克隆的副作用。\n\n```java\nclass TestShallow implements Cloneable\
  \ {\n    int a;\n    float b;\n    int c[];\n    public Object clone() throws CloneNotSupportedException\
  \ {\n        return super.clone();\n    }\n}\n\nclass ShallowCloneDemo {\n    public\
  \ static void main(String arg[]) throws CloneNotSupportedException {\n        TestShallow\
  \ tc1 = new TestShallow();\n        TestShallow tc2;\n        tc1.a = 8;\n     \
  \   tc1.b = 4.5f;\n        int c[] = new int[4];\n        for(int i=0; i<4; i++)\
  \ {\n            c[i] = i;\n        }\n        tc1.c = c;\n        for(int i=0;\
  \ i<4; i++) {\n            System.out.println(\"tc1.c[\" + i +\"]=\" + tc1.c[i]);\n\
  \        }\n        tc2 = (TestShallow) tc1.clone();\n        System.out.println(\"\
  tc2.a\"+tc2.a);\n        System.out.println(\"tc2.b\"+tc2.b);\n        for(int i=0;\
  \ i<4; i++) {\n            System.out.println(\"tc2.c[\" + i +\"]=\" + tc2.c[i]);\n\
  \        }\n        for(int i=0; i<4; i++) {\n            tc2.c[i] = i+4;\n    \
  \    }\n        for(int i=0; i<4; i++) {\n            System.out.println(\"tc2.c[\"\
  \ + i +\"]=\" + tc2.c[i]);\n        }\n        for(int i=0; i<4; i++) {\n      \
  \      System.out.println(\"tc1.c[\" + i +\"]=\" + tc1.c[i]);\n        }\n    }\n\
  }\n```\n输出:\ntc1.c[0]=0\ntc1.c[1]=1\ntc1.c[2]=2\ntc1.c[3]=3\ntc2.a=8\ntc2.b=4.5\n\
  tc2.c[0]=0\ntc2.c[1]=1\ntc2.c[2]=2\ntc2.c[3]=3\ntc2.c[0]=4\ntc2.c[1]=5\ntc2.c[2]=6\n\
  tc2.c[3]=7\ntc1.c[0]=4\ntc1.c[1]=5\ntc1.c[2]=6\ntc1.c[3]=7\n\n示例 5：以下代码通过实现深克隆消除了上一个示例中面临的问题。\n\
  \n```java\nclass TestDeepClone implements Cloneable {\n    int a;\n    float b;\n\
  \    int c[];\n    public Object clone() throws CloneNotSupportedException {\n \
  \       TestDeepClone tc = (TestDeepClone) clone();\n        int[] d = new int[4];\n\
