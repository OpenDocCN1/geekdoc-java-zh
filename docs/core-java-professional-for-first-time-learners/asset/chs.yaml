  \ 可见性模式)\n\n## 引言\n修饰符是 Java 关键字，用于向编译器提供关于代码、数据、类或接口的信息。例如，我们一直可见性修饰符 `public`、`private`、`protected`、`package\
  \ public` 等来指定类成员的可见性。除了可见性，我们还使用了修饰符 `static`、`final` 和 `abstract`。\n\n为了便于理解，修饰符可以分类为：\n\
  \n1. 顶级类和接口的访问权限修饰符。\n2. 类的成员访问/可见性修饰符。\n3. 接口的成员访问/可见性修饰符。\n4. 顶级类的其他修饰符。\n5. 顶级接口的其他修饰符。\n\
  6. 接口成员的其他修饰符。\n7. 类成员的其他修饰符。\n\n### 1. 顶级类和接口的访问权限修饰符：\n\n* `public`\n* `default`\
  \ (包) 访问权限\n\n### 2. 类的成员访问/可见性修饰符：\n\n通过指定成员访问权限修饰符，类可以控制哪些信息对客户端（即其他类）可见。这些修饰符帮助类定义契约，让客户端确切知道该类提供了哪些服务。\n\
  \n成员的访问/可见性可以是以下之一：\n\n* `public`\n* `protected`\n* `default`（也称为包访问权限）\n* `private`\n\
  \n注意：只有当类（或其某个子类）对客户端可见时，成员访问权限修饰符才有意义。另外注意，一个成员可以指定一个访问权限修饰符。\n\n该讨论同时适用于类的实例成员和静态成员。\n\
  \n### 3. 接口的成员访问/可见性修饰符：\n\n可以与接口数据成员和方法使用的唯一成员访问/可见性修饰符是 `public`。\n\n`public`\
  \ 也是接口成员的隐式访问/可见性修饰符，即即使我们不使用 `public` 修饰符，成员总是被隐式地假设为公共的。\n\n### 4. 顶级类的其他修饰符：\n\
  \n除了可见性修饰符，我们还可以在顶级类之前使用以下修饰符：\n\n**(a) `abstract`**\n可以使用 `abstract` 关键字指定类，表示它不能被实例化。包含抽象方法的类必须是抽象类。\n\
  \n**(b) `final`**\n可以使用 `final` 关键字指定类，表示它不能被扩展。`final` 也是接口成员的隐式访问/可见性修饰符，即即使在类继承中，成员总是被隐式地假设为公共。\n\
  \n### 5. 顶级接口的其他修饰符：\n\n**(a) `abstract`**\n这是除可见性修饰符外，可以用于接口的唯一修饰符。\n\n### 6. 接口成员的其他修饰符：\n\
  \n**数据成员：**\n除了可见性修饰符 `public`，还可以使用修饰符 `static` 和 `final`。\n\n**方法：**\n除了可见性修饰符\
  \ `public`，我们还可以使用修饰符 `abstract`。\n\n### 7. 类成员的其他修饰符：\n\n可以通过以下关键字在声明指定字段和方法的某些特性：\n\
  \n1. `static`\n2. `final`\n3. `abstract`\n4. `synchronized`\n5. `native`\n6. `transient`\n\
  7. `volatile`\n\n### A. `static` 修饰符：\n静态成员属于它们声明的类，而不属于类的任何实例。根据类中静态成员的访问权限修饰符，客户端可以使用类名或类的对象的引用来访问这些成员。\n\
  \n#### 静态变量（也称为类变量）：\n这些变量仅存在于它们定义的类中。当类加载时，如果没有指定显式的初始化表达式，静态变量将初始化为默认值。静态成员变量通常用于跟踪有关实例的全局信息。\n\
  \n### 静态方法：\n这些被称为类方法。类中的静态方法可以直接访问类中的其他静态成员。它无法访问类的实例（即非静态）成员，因为静态方法没有关联的对象的概念。\n\
  \n\n\n\n\n* 只能访问静态数据成员。\n* 不能以任何方式引用 `this` 或 `super`。\n\n### 静态初始化块\n\n一个 Java\
  \ 类可以有一个或多个静态初始化块。静态初始化块的语法如下所示：\n\n```java\nstatic\n{\n    code\n}\n```\n\n静态初始化块可以被视为一种静态方法，它在类加载时会被隐式/自动地调用。\n\
  \n静态块在以下情况下非常有用：\n* 静态变量的动态初始化。\n* 在类加载时执行一次性活动。例如，加载 jdbc 驱动类。\n* 在 `Hashtable`、`HashMap`、`Properties`\
  \ 等中加载小型数据库/配置文件。\n\n### final 修饰符\n\n修饰符 `final` 可用于\n* 局部变量\n* 实例变量/数据成员\n* 静态变量/数据成员\n\
  * 实例方法\n\n### final 变量变量\n\nfinal 变量通常在声明时初始化，一旦赋值，其值就不能修改。以下是关于 final 变量的一些重要点：\n\
  \n* final 变量是一个常量，尽管它被称为变量。一旦初始化，它的值就无法改变。这适用于实例、静态和局部变量，包括声明为 `final` 的参数。\n* `final`\
  \ 是唯一适用于局部变量或形式参数的修饰符。\n* 基本数据类型的 final 变量一旦初始化就不能改变其值。\n* 引用类型的 final 变量一旦初始化就不能改变其引用值，但它所指向的对象的状态仍然可以改变。\n\
  * 通常 final 变量在声明时初始化，但并非必须如此。这种 final 变量被称为“空白 final 变量”（blank final variable），在在使用之前必须初始化一次。\n\
  * `final static` 变量通常用于定义命名常量，例如 `Integer.MAX_VALUE`，它是 int 的最大值。\n\n#### 局部 final\
  \ 变量\n\n#### 示例 13.1\n以下示例说明了如上所述，局部 final 变量可以留空，但在第一次使用之前必须初始化。变量 `x` 在在显示器上显示其值之前才进行初始化。\n\
  \n```java\nclass FinalTest1 // 使用空白 final\n{\n    public static void main(String\
  \ args[])\n    {\n        final int x;           // 必须在声明时初始化\n        x = 50;\n\
  \        System.out.println(x);\n    }\n}\n```\n输出：50\n\n#### 示例 13.2\n以下代码将无法编译，因为\
  \ final 变量被初始化了两次。\n\n```java\nclass FinalTest2 // 使用空白 final\n{\n    public static\
  \ void main(String args[ ])\n    {\n        final int x;\n        x=50;\n      \
  \  System.out.println(x);\n        x = 60;\n    }\n}\n```\n\n### 实例 final 变量\n\n\
  实例变量可以留空，但在获取包含 final 变量类的对象引用之前必须初始化。因此，如果在声明时进行初始化，那么 final 变量可以初始化的其他地方是：\n*\
  \ 构造函数\n* 初始化块\n\n#### 示例 13.3\n以下程序将无法编译，因为 final 变量未初始化。默认值初始化概念不适用于 final 变量，因为它们在初始化后无法被修改。\n\
  \n```java\nclass FinalTest3 // 使用空白 final\n{\n    int x; // 实例变量没有初始化\n}\nclass\
  \ MyClass\n{\n    public static void main(String args[])\n    {\n        FinalTest3\
  \ f=new FinalTest3();\n        System.out.println(f.x);\n    }\n}\n```\n输出（编译时错误）：variable\
  \ `x` might not have been initialized.\n\n#### 示例 13.4\n以下程序也将无法编译，因为 final 变量在获取引用之后才被初始化。\n\
  \n```java\nclass FinalTest4\n{\n    final int x;\n}\nclass MyClass\n{\n    public\
  \ static void main(String args[])\n    {\n        FinalTest4 f=new FinalTest4();\n\
  \        f.x = 0;\n        System.out.println(f.x);\n    }\n}\n```\n\n#### 示例 13.5\n\
  以下示例说明空白实例变量可以在构造函数中进行初始化。\n\n```java\nclass FinalTest5\n{\n    final int x;\n \
  \   FinalTest5()\n    {\n        x=0;\n    }\n    public static void main(String\
  \ args[])\n    {\n        FinalTest5 f=new FinalTest5();\n        System.out.println(f.x);\n\
  \    }\n}\n```\n输出：0\n\n#### 示例 13.6\n以下程序说明空白 final 变量可以使用动态值初始化，并可以使用 `this` 关键字进行引用。因此，相同类的对象可以具有不同的\
  \ final 变量值。\n\n```java\nclass FinalTest6\n{\n    final int x;\n    FinalTest6(int\
  \ x1)\n    {\n        x = x1;\n    }\n    public static void main(String args[])\n\
  \    {\n        FinalTest6 f1=new FinalTest6(10);\n        FinalTest6 f2=new FinalTest6(20);\n\
  \        System.out.println(f1.x);\n        System.out.println(f2.x);\n    }\n}\n\
  ```\n\n\n\n\n\n初始化块可以被认为是一个构造函数，它在对象创建时被隐式地/自动调用。事实上，如果一个类包含初始化块，它们将按照定义的顺序从上到下执行，并在任何构造函数之前执行。\n\
  \n### 示例 13.7：\n\n```java\nclass FinalTest7 {\n    final int x;\n    public static\
  \ void main(String args[]) {\n        FinalTest7 f = new FinalTest7();\n       \
  \ System.out.println(f.x);\n    }\n    {\n        x = 20;\n    }\n}\n```\n\n初始化块在以下情况下有用：\n\
  * 实例变量的动态初始化。\n* 定义所有构造函数通用的代码。这将增加代码的重用性并减少维护工作。\n\n### static final 变量：\n\n`static\
  \ final` 变量可以为空，但必须在类对程序可用之前完成初始化。因此，如果我们不在声明时进行初始化，那么 `static final` 变量唯一的初始化位置就是：\n\
  * `static` 初始化块\n\n### 示例 13.8\n\n以下示例说明了空白的 `static final` 变量可以在 `static` 块中初始化。\n\
  \n```java\nclass FinalTest8 {\n    static final int x;\n    public static void main(String\
  \ args[]) {\n        System.out.println(FinalTest8.x);\n    }\n    static {\n  \
  \      x = 20;\n    }\n}\n```\n输出：`20`\n\n### final 方法：\n\n* 类中的 `final` 方法是完整的（即具有实现体），并且不能在任何子类中被重写。\n\
  * 编译器能够对 `final` 方法执行某些优化，因为可以对此类成员做出某些假设。当调用非静态方法时，运行时系统会确定对象的实际类，将方法调用绑定到该类型的正确实现上，然后调用该实现。\n\
  * 对于 `final` 方法，我们确定子类不能重写该方法，因此绑定是在编译时完成的，这与 `private` 和 `static` 方法的情况相同，并极地提升了性能。\n\
  * 对于 `final` 方法，编译器可能会像宏一样将调用替换为方法的实际体。这种机制被称为“内联”（inlining）。在 C++ 中，我们可以选择将函数声明为\
  \ `inline`（尽管该决定由编译器做出），但在 Java 中，由编译器做出决定。\n\n### abstract 修饰符：\n\n`abstract` 修饰符只能用于实例方法。`abstract`\
  \ 方法没有实现体；也就是说，`abstract` 方法没有定义方法体，仅在类定义中提供方法原型。它的类也是 `abstract` 的（即不完整的），并且必须显式地声明为\
  \ `abstract`。`abstract` 类的子类必须提供方法的实现；否则，它们也将是抽象的。\n\n以下是一些与抽象方法相关的要点：\n* `abstract`\
  \ 方法不能被声明为 `private`。这是显而易见的，因为我们无法重写 `private` 方法，而在 `abstract` 方法的情况下，体始终是由子类通过重写方法来提供的。\n\
  * 只有实例方法可以声明为 `abstract`，因为 `static` 方法不能被重写；声明一个 `abstract static` 方法没有意义，并将导致编译错误。\n\
  * `final` 方法不能是 `abstract` 的，反之亦然。\n* 关键字 `abstract` 不能与方法的任何非访问权限修饰符结合使用。\n* 在接口中指定的方法隐式是\
  \ `abstract` 的，因为接口中只定义了方法原型。\n\n### synchronized 修饰符：\n\n`synchronized` 关键字可以用于方法和代码块。程序中的多个线程可以同时执行。它们可能会尝试在同一个对象上同时执行多个方法。如果要求一次只有一个线程可以执行对象中的方法，可以将方法声明为\
  \ `synchronized`。它们的执行在所有线程之间是互斥的。\n\n在任何给定时刻，最多有一个线程可以执行对象上的 `synchronized` 方法。此讨论也适用于类的\
  \ `static synchronized` 方法。\n\n注意：`synchronized` 修饰符不适用于类或成员变量。\n\n### native 修饰符：\n\
  \n`native` 修饰符只能引用方法。与 `abstract` 关键字一样，`native` 表示方法的体将在其他处找到。`native` 方法的体完全位于\
  \ JVM 之外，位于库中。原生代码是用非 Java 语言（通常是 C 或 C++）编写的，并针对目标机器类型进行编译。因此，Java 的平台无关性被破坏了。将\
  \ Java 移植到新平台的人实现了大量的原生代码，以支持 GUI 组件、网络通信以及广泛的其他特定平台的功能。然而，应用程序和 App 程序员很少需要编写原生代码。\n\
  \n### transient 修饰符：\n\n对象可以使用序列化进行存储。序列化将对象转换为利于存储对象的输出格式。随后可以按照序列化时的相同状态检索对象，这意味着包含在序列化中的所有字段将具有与序列化时相同的值。此类对象被称为持久化对象。\n\
  \n在类声明中，可以将某个字段指定为 `transient`，表示当类的对象被写入持久化存储器时，不应保存其值。\n\n```java\nclass Experiment\
  \ implements Serializable {\n    transient int currentTemperature;\n    double mass;\
  \ //持久化值\n}\n```\n\n对 `static` 变量指定 `transient` 修饰符是多余的，因此不建议这样做。`static` 变量不是序列化对象持久化状态的一部分。\n\
  \n### volatile 修饰符：\n\n在执行期间，编译代码可能会为了效率而缓存字段的值。由于多个线程可以访问同一个字段，确保不允许缓存在读取和写入字段值时导致不一致至关重要。\n\
  \n# 章节\n∞ 14 ∞\n\n## (包装类)\n\n## 简介\n\nJava 中的基本数据类型不是对象。如果我们想将这些数据类型作为对象使用，我们就必须为这些基本数据类型中的每一个使用包装类。\n\
  \n\n\n\n\nJava 为每种基本数据类型都提供了对应的包装类，如下表所示：\n\n| 基本数据类型 | 包装类 |\n| :--- | :--- |\n\
  | boolean | `Boolean` |\n| char | `Character` |\n| byte | `Byte` |\n| short | `Short`\
  \ |\n| int | `Integer` |\n| long | `Long` |\n| float | `Float` |\n| double | `Double`\
  \ |\n\n## Number 类\n\n抽象类 `Number` 定义了一个父类，由封装数值类型 `byte`、`short`、`int`、`long`、`float`\
  \ 和 `double` 的类实现。`Number` 类具有抽象方法，用于返回对象在不同数字格式下的值。这些方法如下：\n\n| 方法 |  |\n| :---\
  \ | :--- |\n| `byte byteValue()` | 将指定的数字作为 byte 返回。 |\n| `short shortValue()` |\
  \ 将指定的数字作为 short 返回。 |\n| `abstract int intValue()` | 将指定的数字作为 int 返回。 |\n| `abstract\
  \ long longValue()` | 将指定的数字作为 long 返回。 |\n| `abstract float floatValue()` | 将指定的数字作为\
  \ float 返回。 |\n| `abstract double doubleValue()` | 将指定的数字作为 double 返回。 |\n\n注- `byteValue()`、`shortValue()`、`intValue()`、`longValue()`、`floatValue()`\
  \ 和 `doubleValue()` 方法返回的值可能涉及舍五或截断。\n\n### 示例 14.1\n\n以下示例演示了调用 `Number` 类的方法时如何发生舍五和截断。\n\
  \n```java\nclass Wrapper {\n    public static void main(String args[ ]) {\n    \
  \    Integer iObj = new Integer(128);\n        System.out.println(iObj.byteValue());\
  \ // truncation\n        Long lObj = new Long(123456789123456789L);\n        System.out.println(lObj);\n\
  \        System.out.println(lObj.doubleValue());\n        Float fObj = new Float(3.99f);\n\
  \        System.out.println(fObj.intValue()); // truncation\n    }\n}\n```\n\n**输出：**\n\
  ```\n-128\n123456789123456789\n1.23456789123456784E17\n3\n```\n\n## 使用包装类的构造函数将基本类型转换为对象，并将数值对象转换回基本类型\n\
  \n### 示例 14.2\n\n以下示例演示了如何将基本类型封装成对象，以及如何将其转换回基本类型。\n\n```java\nclass Convert {\n\
  \    public static void main(String args[]) {\n        System.out.println(\"primitive\
  \ numbers to constructors\");\n        byte b = 105;\n        Byte bObj = new Byte(b);\n\
  \        System.out.println(bObj); // toString()\n        short s = 205;\n     \
  \   Short sObj = new Short(s);\n        System.out.println(sObj);\n        int i=32717;\n\
  \        Integer iObj = new Integer(i);\n        System.out.println(iObj);\n   \
  \     long l = 234543335565675L;\n        Long lObj = new Long(l);\n        System.out.println(lObj);\n\
  \        float f = 3.145f;\n        Float fObj = new Float(f);\n        System.out.println(fObj);\n\
  \        double d = 3.1415;\n        Double dObj = new Double(d);\n        System.out.println(dObj);\n\
  \n        System.out.println(\"numeric objects to primitive numbers\");\n      \
  \  byte b1 = bObj.byteValue();\n        short s1 = sObj.shortValue();\n        int\
  \ i1 = iObj.intValue();\n        long l1 = lObj.longValue();\n        float f1 =\
  \ fObj.floatValue();\n        double d1 = dObj.doubleValue();\n        System.out.println(b1);\n\
  \        System.out.println(s1);\n        System.out.println(i1);\n        System.out.println(l1);\n\
  \        System.out.println(f1);\n        System.out.println(d1);\n    }\n}\n```\n\
  \n**输出：**\n```\nprimitive numbers to constructors\n105\n205\n32717\n234543335565675\n\
  3.145\n3.1415\nnumeric objects to primitive numbers\n105\n205\n32717\n234543335565675\n\
  3.145\n3.1415\n```\n\n### 使用包装类的静态方法 `toString()` 将基本类型转换为字符串\n\n示例 14.3：\n\n```java\n\
  class ConvertPrimitiveToString {\n    public static void main(String args[]) {\n\
  \        System.out.println(\"primitive numbers to String using toString() static\
  \ method of wrapper class:\");\n        byte b = 105;\n        String str=Byte.toString(b);\n\
  \        System.out.println(str);\n        short s=303;\n        str = Short.toString(s);\n\
  \        System.out.println(str);\n        int i=100;\n        str = Integer.toString(i);\n\
  \        System.out.println(str);\n        long l=45444444444l;\n        str = Long.toString(l);\n\
  \        System.out.println(str);\n        float f=3.444f;\n        str=Float.toString(f);\n\
  \        System.out.println(str);\n        double d=3.44444;\n        str=Double.toString(d);\n\
  \        System.out.println(str);\n    }\n}\n```\n\n**输出：**\n```\nprimitive numbers\
  \ to String using toString() static method of wrapper class:\n105\n303\n100\n45444444444\n\
  3.444\n3.14444\n```\n\n### 使用包装类的静态方法 `toString()` 将对象转换为字符串\n\n```java\nclass ObjectDemo\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  objects to Strings\");\n        byte b = 103;\n        Byte bObj = new Byte(b);\n\
  \        String str=Byte.toString(bObj);\n        System.out.println(str);\n   \
  \ }\n}\n```\n\n\n\n\n使用相应包装类的 `toString()` 方法将对象数字转换为字符串：\n\n**输出：**\n```\n103\n\
  203\n32000\n4544444444444\n3.1444\n4.1444\n```\n\n使用相应包装类的静态方法 `valueOf()` 将字符串对象（数字型字符串）转换为数值对象：\n\
  \n### 示例 14.5\n\n```java\nclass StringToNumericObjectDemo {\n    public static void\
  \ main(String args[]) {\n        String str = \"30\";\n        String str2 = \"\
  30.33\";\n        Byte bObj = Byte.valueOf(str);\n        System.out.println(bObj);\n\
  \        // bObj1 = new Byte(str2); //NumberFormatException\n        Short sObj\
  \ = Short.valueOf(str);\n        System.out.println(sObj);\n        Integer iObj\
