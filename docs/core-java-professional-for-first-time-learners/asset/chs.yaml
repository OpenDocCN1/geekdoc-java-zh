  \        f.setVisible(true);\n    }\n}\n```\n输出: ![](img/0082.jpeg)\n\n### Scrollbar\n\
  \n调整列表和滚动面板的 `Scrollbar` 组件可以作为一个独立的组件存在。它有三个构造函数：\n- `Scrollbar()`：构造一个新的垂直滚动条。\n\
  - `Scrollbar(int orientation)`：构造一个指定方向的新滚动条。\n- `Scrollbar(int orientation, int\
  \ initialValue, int sliderSize, int minValue, int maxValue)`：构造一个具有指定方向、初始值、滑块大小以及最小值和最大值的滚动条。`sliderSize`\
  \ 参数控制滑块的大小，但不是以像素为单位。\n\n对于接受方向参数的构造函数，该值应该是以下之一：\n- `Scrollbar.HORIZONTAL`\n-\
  \ `Scrollbar.VERTICAL`\n\n### 示例 17.22\n```java\nimport java.applet.*;\nimport java.awt.*;\n\
