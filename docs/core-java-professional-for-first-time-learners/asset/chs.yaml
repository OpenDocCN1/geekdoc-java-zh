  area() of Shape\");\n    }\n    void display() {\n        System.out.println(\"\
  display() of Shape\");\n    }\n}\n\nclass Circle extends Shape {\n    void getdata()\
  \ {\n        System.out.println(\"getdata() of Circle\");\n    }\n    void area()\
