  C\nEChanged\nD\nB\n\n### HashSet 类：\n`HashSet` 类继承自 `AbstractSet` 并实现了 `Set` 接口。它创建了一个使用哈希表存储的集合。\n\
  \n哈希的优势使得 `add()`、`contains()`、`remove()` 和 `size()` 等基本操作的执行时间即使在集合很大时也能保持常数级。\n\
  \n\n\n\n创建一个新的空集合，底层的 `HashMap` 实例具有指定的初始容量和指定的负载因子。填充率必须在 0.0 到 1.0 之间。\n\n```java\n\
  public java.util.Iterator iterator();\npublic int size( );\npublic boolean isEmpty(\
  \ );\npublic boolean contains(java.lang.Object);\npublic boolean add(java.lang.Object);\n\
  public boolean remove(java.lang.Object);\npublic void clear( );\npublic java.lang.Object\
  \ clone( );\n```\n\n`HashSet` 不保证其元素的顺序，因为哈希处理过程通常不利于创建排序集合。如果你需要排序存储，那么像 `TreeSet`\
  \ 其他集合是更好的选择。\n\n### 示例 21.3\n\n```java\nimport java.util.*;\nclass HashSetTest\
  \ {\n    public static void main (String args[]) {\n        HashSet<String> hs =\
  \ new HashSet<String>();\n        hs.add(\"B\");\n        hs.add(\"A\");\n     \
  \   hs.add(\"E\");\n        hs.add(\"C\");\n        hs.add(\"F\");\n        System.out.println(hs);\n\
  \    }\n}\n```\n\n**输出：**\n`[E, F, A, B, C]`\n\n元素不是按排序顺序存储的，精确的输出可能会不同。\n\n###\
  \ LinkedHashSet 类\n\n`LinkedHashSet` 类继承自 `HashSet` 并没有添加任何自己的成员。`LinkedHashSet`\
  \ 类维护了一个集合中条目的链表列表，按照它们被插入的顺序排列。\n\n这也是它们在对 `LinkedHashSet` 对象调用 `toString()` 方法时返回的字符串中所包含的顺序。要查看\
  \ `LinkedHashSet` 的效果，尝试在前面的程序中将 `HashSet` 替换为 `LinkedHashSet`。输出将是：`[B, A, E, C,\
  \ F]`。这元素的插入顺序。\n\n### TreeSet 类\n\n`TreeSet` 提供了 `Set` 接口的实现，它使用树进行存储。对象按升序排序进行存储。访问和检索速度非常快，这使得在存储大量必须快速找到的排序信息时，`TreeSet`\
  \ 是一个极佳的选择。\n\n### 构造函数\n\n它具有以下构造函数：\n\n- `TreeSet()`: 创建一个新的空集合，按照自然顺序排序。\n- `TreeSet(Collection\
  \ c)`: 创建一个新的包含指定集合中元素的集合，按照自然顺序排序。\n- `TreeSet(Comparator c)`: 创建一个新的空集合，按照比较器排序。\n\
  - `TreeSet(SortedSet ss)`: 创建一个新的包含指定排序集合中元素的集合，按照相同的排序规则。\n- `public java.util.Iterator\
  \ iterator()`\n- `public java.util.Iterator descendingIterator()`\n- `public int\
  \ size()`\n- `public boolean isEmpty()`\n- `public boolean contains(java.lang.Object)`\n\
  - `public boolean add(java.lang.Object)`\n- `public boolean remove(java.lang.Object)`\n\
  - `public void clear()`\n- `public boolean addAll(java.util.Collection)`\n- `public\
  \ java.lang.Object clone()`\n\n#### 示例 1.4\n\n```java\nimport java.util.*;\nclass\
  \ TreeSetTest {\n    public static void main (String args[]) {\n        TreeSet<String>\
  \ ts = new TreeSet<String>();\n        ts.add(\"C\");\n        ts.add(\"A\");\n\
  \        ts.add(\"D\");\n        ts.add(\"E\");\n        ts.add(\"F\");\n      \
  \  ts.add(\"B\");\n        // 显示元素。\n        Iterator i = ts.iterator();\n     \
  \   while(i.hasNext()) {\n            Object o = i.next();\n            System.out.println(o\
  \ + \" \");\n        }\n    }\n}\nclass MyComp implements Comparator {\n    public\
  \ int compare(Object a, Object b) {\n        String aStr, bStr;\n        aStr =\
  \ (String) a;\n        bStr = (String) b;\n        // 反转比较。\n        return bStr.compareTo(aStr);\n\
  \    }\n}\n```\n\n**输出：**\n`[A, B, C, D, E, F]`\n\n`TreeSet` 和 `TreeMap` 均按排序顺序存储元素。然而，是\
  \ `comparator` 精确地定义了什么是“排序顺序”。\n\n默认情况下，这些类使用 `java` 所说的“自然排序”来存储元素，这通常是我们所预期的顺序。如果我们想以不同的方式对元素进行排序，可以在构造集合或映射时指定一个\
  \ `comparator` 对象。这样做使我们能够精确控制元素在排序集合或映射中的存储方式。\n\n`comparator` 接口定义了前面讨论过的两个方法：`compare()`\
  \ 和 `equals()`。`compare()` 方法比较两个元素的顺序：\n`int compare(T obj1, T obj2)`\n- `obj1`\
  \ 和 `obj2` 是要比较的对象。\n- 如果对象相等，该方法返回零。\n- 如果 `obj1` 大于 `obj2`，则返回正值。\n- 如果 `obj1`\
  \ 小于 `obj2`，返回负值。\n- 如果对象的类型不兼容比较，这些方法可能会抛出 `ClassCastException`。\n通过重写 `compare()`，你可以更改对象的排序方式。例如，要按逆序排序，你可以创建一个反转比较结果的比较器。`equals()`\
  \ 方法测试对象是否等于调用的 `comparator`。\n`boolean equals(Object obj)`\n\n#### 示例 1.5\n\n```java\n\
  import java.util.*;\nclass CompTest {\n    public static void main (String args[])\
  \ {\n        TreeSet ts = new TreeSet(new Comp());\n        ts.add(\"C\");\n   \
