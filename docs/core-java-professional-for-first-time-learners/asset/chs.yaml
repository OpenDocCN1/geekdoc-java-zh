  ## 第 3 章 控制语句\n\n控制语句用于改变执行流。Java 的控制语句可以分为三类。\n\n### 1. 选择语句（判别结构）\n选择语句允许程序根据表达式的结果或变量的状态，从不同的执行路径中选择一条路径。\n\
  \n1. `if`\n2. `if else`\n3. `nested if`（嵌套 if）\n4. `switch`\n\n### (a) `if` 的语法\n\
  ```java\nif (condition) {\n    statements;\n} else {\n    if (condition) {\n   \
  \     statements;\n    } else {\n        statements;\n    }\n}\n```\n\n### (b) `if\
  \ else` 的语法\n```java\nif (condition) {\n    statements;\n} else {\n    statements;\n\
  }\n```\n\n### (c) 嵌套 `if else` 的语法\n```java\nif (condition) {\n    statements;\n\
  } else {\n    if (condition) {\n        statements;\n    } else {\n        if (condition)\
  \ {\n            statements;\n        } else {\n            statements;\n      \
  \  }\n    }\n}\n```\n\n### (d) `if-else Ladder`（if-else 链）的语法\n```java\nif (condition)\
  \ {\n    statements;\n} else if (condition) {\n    statements;\n} else if (condition)\
  \ {\n    statements;\n} else {\n    statements;\n}\n```\n\n### (e) `switch case`\
  \ 的语法\n```java\nswitch (expression) {\n    case 1:\n        statement 1;\n     \
  \   break;\n    case 2:\n        statement 2;\n        break;\n    case 3:\n   \
  \     statement 3;\n        break;\n    case n:\n        break;\n    default:\n\
  \        default statement sequence;\n}\n```\n\n### 示例 3.1 求两个数最大值的程序 (Max.Java)\n\
  \n```java\nclass Max {\n    public static void main(String args[]) {\n        int\
  \ a, max;\n        a = 10;\n        b = 20;\n        if (a > b) {\n            max\
  \ = a;\n        } else {\n            max = b;\n        }\n        System.out.println(\"\
  Max of numbers is \" + max);\n    }\n}\n```\n\n### 2. 迭代语句（循环结构）\n循环是一个允许我们重复单条语句或一组语句\
  \ n 次的过程。\n\n1. `for`\n2. `while`\n3. `do while`\n\n### (a) `for` 循环的语法\n```java\n\
  for (initialize; condition; increment/decrement) {\n    statements;\n}\n```\n\n\
  ### (b) `while` 循环的语法\n```java\ninitialize;\nwhile (condition) {\n    statements;\n\
  \    increment/decrement;\n}\n```\n\n### (c) `do while` 循环的语法\n```java\ninitialize;\n\
  do {\n    statements;\n    increment/decrement;\n} while (condition);\n```\n\n\n\
  \n条件可以是任何布尔表达式。只要条件表达式为真，循环体就会一直执行。当 `condition` 变为假时，控制将立即传递到循环后的下一行代码。\n\n###\
  \ 示例 3.2\n\n```java\nclass Loop1 {\n    public static void main(String args[]) {\n\
  \        int n=5;\n        for(int i=1;i<=n;i++) {\n            for(int j=1;j<=i;j++)\
  \ {\n                System.out.print(j);\n                System.out.println();\n\
  \            }\n        }\n    }\n}\n```\n**输出：**\n```\n1\n12\n123\n1234\n12345\n\
  ```\n\n### 跳跳转语句- 它允许我们的程序以非线性方式工作\n1. `break`\n2. `labeled break`（标签 break）\n3.\
  \ `continue`\n4. `labeled continue`（标签 continue）\n5. `return`\n\n大多数语句的语法与 C/C++\
  \ 中对应的语句相同。但存在一些不同之处：\n* `if`、`for` 和 `do` 语句中的条件表达式必须是布尔表达式，即它们的值应当为 `true` 或 `false`。我们可以像\
  \ C/C++ 中那样用 `0` 代替 `false`，或用非零值代替 `true`。\n* Java 没有 `goto` 语句，尽管 `goto` 是一个保留字。Java\
  \ 提供了 `labeled break` 和 `labeled continue` 语句，它们通常被称为 `goto` 的文明形式，因为它们被认为是 goto\
  \ 的更好的替代品。\n* 在 Java 中，`switch` 表达式可以是任何整数表达式（`long` 除外），即 `switch` 的类型可以是 `byte`、`short`\
  \ 或 `int`。但 Java 的 `int` 是 4 字节，这与 C/C++ 中的 `long` 大小相同。\n* `case` 标签像 C/C++ 一样是常量表达式，但\
  \ `case` 标签的值必须在 `switch` 类型的范围内，否则程序将无法编译。\n* `labeled break` 语句用于终止由 `break` 语句中指定的标签的块。与简单的\
  \ `break` 语句不同，我们可以终止任何块。例如，可以从深层嵌套的 `for` 循环内部终止最层循环。\n* `labeled continue` 语句指定要继续的闭层循环的标签。标签不需要对应于最近的闭层循环。\n\
  \n### (a) break\n```java\nfor(int i=1;i<=10;i++) {\n    if(i == 5)\n        break;\
  \ // 如果 i 是 5 则终止循环\n    System.out.print( i );\n}\n```\n**输出：** 1 2 3 4\n\n###\
  \ (b) labeled break\n```java\nboolean t=true;\nfirst : {\n    second: {\n      \
  \  third: {\n            System.out.println(\"Before the break\");\n           \
  \ if(t) break second; // 跳出 second 块\n            System.out.println(\"This will\
  \ not execute\");\n        }\n        System.out.println(\"This will not execute\"\
  );\n    }\n    System.out.println(\"This is after second block\");\n}\n```\n**输出：**\n\
  Before the break\nThis is after second block\n\n### (c) continue\n```java\nfor(int\
  \ i=0;i<10;i++) {\n    System.out.print( i + \" \");\n    if ( i % 2 == 0 )\n  \
  \      continue;\n    System.out.println();\n}\n```\n**注意：** 此代码使用 `%` 运算符检查 `i`\
  \ 是否为偶数。如果它是偶数，则循环将继续而不打印新行。\n**输出：**\n```\n0 \n2 \n4 \n6 \n8 \n```\n\n### (d) labeled\
  \ continue\n```java\nouter : for(int i=0;i<5;i++) {\n    for(int j=0;j<5;j++) {\n\
  \        if( j > i ) {\n            System.out.println();\n            continue\
  \ outer;\n        }\n        System.out.print(\"\\t\"+ ( i * j ) );\n    }\n}\n\
  ```\n**输出：**\n```\n0\n0\t1\n0\t2\t4\n0\t3\t6\t9\n0\t4\t6\t8\n```\n\n### (e) return\n\
  ```java\nint sum(int a, int b) {\n    int c;\n    c = a+b;\n    return(c);\n}\n\
  ```\n\n---\n\n### 多选题\n\n1. 给定定义的变量：\n`int one = 1;`\n`int two = 2;`\n`char initial\
  \ = '2';`\n`boolean flag = true;`\n\n以下哪个是有效的？\na) `if( one )`\nb) `if( one = two\
  \ )`\nc) `if( one == two )`\nd) `if( flag )`\ne) `switch( one )`\nf) `switch( flag\
  \ )`\ng) `switch( initial )`\n\n2. 如果下面的代码中 `val = 1`：\n```java\nswitch( val ) {\n\
