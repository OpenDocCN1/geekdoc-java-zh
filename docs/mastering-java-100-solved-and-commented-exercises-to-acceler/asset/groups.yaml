    \        System.out.print(\"请输入第二个数字: \");\n        int number2 = scanner.nextInt();\n\
    \n        // 检查第一个数字是否能被...\n        if (number2 != 0 && number1 % number2 ==\
    \ 0) {\n    System.out.println(number1 + \" 能被 \" + number2 + \" 整除\");\n} else\
