    \ % 来实现这一点，它会返回除法的余数。如果余数为 0（number1 % number2 == 0），则第一个数字能被第二个数字整除。\n\n如果条件为真，程序将显示“number1\
    \ 能被 number2 整除”。否则，它将显示“number1 不能被 number2 整除”。\n\n## 重复循环 (Repeat Loops)\n\n\
    在 Java 中，有三种主要的循环：*for*、*while* 和 *do-while*。\n\n### For 循环\n\n*for* 循环的结构为 *for\
