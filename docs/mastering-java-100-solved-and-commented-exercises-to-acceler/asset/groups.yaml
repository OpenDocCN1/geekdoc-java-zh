    web and interpreted by the Virtual Machine (JVM) on whichever platform it is being
    run on.


    **Simple**: Java is designed to be easy to learn. If you understand the basic
    concept of OOP, Java would be easy to master.


    **Secure**: With Java''s secure feature, it enables to develop virus-free, tamper-free
    systems. Authentication techniques are based on public-key encryption.


    **Architectural-Neutral**: Java compiler generates an architecture-neutral object
    file format, which makes the compiled code executable on many processors, with
    the presence of a Java runtime system.


    **Portable**: Being architectural-neutral and having implementation dependent
    aspects of the specification makes Java portable.


    **Robust**: Java makes an effort to eliminate error-prone situations by emphasizing
    mainly on compile-time error checking and runtime checking.


    **Multithreaded**: With Java''s multithreaded feature, it is possible to write
    programs that can perform many tasks simultaneously.'
