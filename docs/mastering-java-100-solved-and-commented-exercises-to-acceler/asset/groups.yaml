    # # Strings


    In Java, **String** is a built-in class used to manipulate character strings that
    are immutable (constant and cannot be changed once created). The **String** class
    provides a number of methods to perform operations on strings such as comparison,
    concatenation, conversion, trimming, replacing, splitting, etc.


    Creating Strings


    There are two ways to create String objects in Java:


    By string literal:


    ```

    String s1 = "Hello";

    ```


    Java uses a concept called "String pool" to efficiently manage memory used by
    strings. When a string is created using a literal, the JVM checks the string pool.
    If the string already exists, it returns the reference of the pool string, else
    it creates a new string in the pool.'
