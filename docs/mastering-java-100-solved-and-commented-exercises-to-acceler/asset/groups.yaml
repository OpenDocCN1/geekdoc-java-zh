  md: "\n## 38. Write a program that prints all even numbers from 1 to 100.\n\n###\
    \ Solution 1\n\n```java\npublic class EvenNumberDisplay {\n    public static void\
    \ main(String[] args) {\n    // Use a for loop to iterate from 1 to 100\n    for\
    \ (int i = 1; i <= 100; i++) {\n        // Check if the number is even\n     \
    \   // (i.e., divisible by 2 with no remainder)\n        if (i % 2 == 0) {\n \
    \           System.out.println(i);\n        }\n    }\n    }\n}\n```\n\nWe define\
    \ a public class named EvenNumberDisplay. The class will contain our main method.\n\
    \nInside the main method, we use a for loop to iterate from 1 to 100. The loop\
    \ variable i is initialized to 1 (int i = 1), which is the starting point of the\
    \ loop.\n\nThe for loop's condition is $i <= 100$, meaning the loop will continue\
    \ as long as $i$ is less than or equal to 100. After each iteration, the loop\
    \ variable $i$ is incremented by 1 ($i++$).\n\nInside the loop body (enclosed\
    \ within curly braces), we use an $if statement to check if the current value\
    \ of $i$ is even. We do this by using the modulo operator %, which gives us the\
    \ remainder of the division. If $i % 2$ equals 0, it means that $i$ is divisible\
    \ by 2 with no remainder, and thus, it is an even number.\n\nIf the condition\
    \ is true (i.e., $i$ is even), we use $System.out.println(i)$ to print the value\
    \ of $i$ on the console. This line of code will be executed only for even numbers,\
    \ effectively printing all even numbers from 1 to 100.\n\nThe loop will continue\
    \ iterating until the loop variable $i$ becomes 101, at which point the loop condition\
    \ $i <= 100$ will become false, and the loop will terminate.\n\nSince there is\
    \ no more code after the loop, the program will terminate, and the execution will\
    \ end.\n\n### Solution 2\n\n```java\npublic class EvenNumberDisplay {\n    public\
    \ static void main(String[] args) {\n        // Initialize the loop variable i\
    \ to 2 (the first even number)\n        int i = 2;\n\n        // Use a while loop\
    \ to iterate and print\n        // even numbers from 1 to 100\n        while (i\
    \ <= 100) {\n            System.out.println(i);\n            // Increment the\
    \ loop variable i by 2\n            // for the next even number\n            i\
    \ += 2;\n        }\n    }\n}\n```\n\nIn this program, we use a while loop to print\
    \ all even numbers from 1 to 100. We first initialize the loop variable *i* to\
    \ 2 (*int i = 2*), which is the first even number in the given range.\n\nThe while\
    \ loop's condition is *i <= 100*, meaning the loop will continue as long as *i*\
    \ is less than or equal to 100. Inside the loop body (enclosed within curly braces),\
    \ we use System.out.println(i) to print the value of i on the console.\n\nAfter\
    \ printing the current value of i, we increment the loop variable i by 2 (i +=\
    \ 2). This step ensures that we move to the next even number for the next iteration.\
    \ Since we are incrementing i by 2, the loop will only print even numbers.\n\n\
    The loop will keep running and printing even numbers until the loop condition\
    \ i <= 100 becomes false when i becomes 102.\n\n## 39. Write a program that displays\
    \ even numbers 1 to 50 and odd numbers 51 to 100 using a repeating loop.\n\n```java\n\
    public class NumberDisplay {\n  public static void main(String[] args) {\n   \
    \ // Use a loop to iterate and print even numbers from 1 to 50\n    for (int i\
    \ = 1; i <= 50; i++) {\n        if (i % 2 == 0) {\n            System.out.println(i);\n\
    \        }\n    }\n    // Use a for loop to iterate and print odd numbers\n  \
    \  // from 51 to 100\n    for (int i = 51; i <= 100; i++) {\n      if (i % 2 !=\
    \ 0) {\n        System.out.println(i);\n      }\n    }\n  }\n}\n```\n\nThe *for*\
    \ loop initializes the loop variable *i* to 1 (*int i = 1*), and the loop will\
    \ continue as long as *i* is less than or equal to 50 (*i <= 50*). After each\
    \ iteration, the loop variable *i* is incremented by 1 (*i++).\n\nInside the first\
    \ loop's body, we use an if statement to check the current value of *i* is even.\
    \ We do this by using the modulo operator %, which gives us the remainder of the\
    \ division. If *i % 2* equals 0, it means that *i* is divisible by 2 with no remainder,\
    \ and thus, it is an even number.\n\nIf the condition is true (i.e., i is even),\
    \ we use System.out.println(i) to print the value of $i$ on the console. This\
    \ line of code will be executed only for even numbers from 1 to 50.\n\nThe second\
    \ loop initializes the loop variable *i* to 51 (*int i = 51*), and the loop will\
    \ continue as long as *i* is less than or equal to 100 (*i <= 100*). After each\
    \ iteration, the loop variable *i* is incremented by 1 (*i++).\n\nInside the second\
    \ loop's body, we use an if statement to check the current value of *i* is odd.\
    \ We do this by using the modulo operator %, which gives us the remainder of the\
    \ division. If *i % 2* equals 0, it means that *i* is not divisible by 2 with\
    \ no remainder, and thus, it is an odd number.\n\nIf the condition is true (i.e.,\
    \ i is odd), we use System.out.println(i) to print the value of $i$ on the console.\
    \ This line of code will be executed only for odd numbers from 51 to 100.\n\n\
    ## 40. Create a program that prompts the user for a number and displays its multiplication\
    \ table.\n\n```java\nimport java.util.Scanner;\n\npublic class MultiplicationTable\
    \ {\n    public static void main(String[] args) {\n        // Create a Scanner\
    \ object to read input\n        Scanner scanner = new Scanner(System.in);\n\n\
    \        // Prompt the user for a number\n        System.out.print(\"Enter a number:\
    \ \");\n        int number = scanner.nextInt();\n\n        // Display the multiplication\
    \ table\n        System.out.println(\"Multiplication Table of \" + number + \"\
    :\");\n        for (int i = 1; i <= 10; i++) {\n            int result = number\
    \ * i;\n            System.out.println(number + \" x \" + i + \" = \" + result);\n\
    \        }\n\n        // Close the scanner\n        scanner.close();\n    }\n\
    }\n```\n\nThis program uses a Scanner object to read input from the console. It\
    \ prompts the user to enter a number using scanner.nextInt().\n\nThe program then\
    \ uses a for loop to iterate from 1 to 10. In each iteration, it calculates the\
    \ product of the input number and the loop index i, then prints the result to\
    \ the console.\n\nFinally, the scanner is closed to free up resources.\n"
  mdcn: "\n\n## 38. 写一个程序打印 1 到 100 之间所有的偶数。\n\n### 方案 1\n\n```java\npublic class\
    \ EvenNumberDisplay {\n    public static void main(String[] args) {\n    // 使用\
    \ for 循环从 1 迭代到 100\n    for (int i = 1; i <= 100; i++) {\n        // 检查是否为偶数\n\
    \        //（即能被 2除且没有余数）\n        if (i % 2 == 0) {\n            System.out.println(i);\n\
    \        }\n    }\n    }\n}\n```\n\n我们定义了一个名为 `EvenNumberDisplay` 的公共类。该类将包含我们的主方法。\n\
    \n在主方法内部，我们使用 `for` 循环从 1 迭代到 100。循环变量 `i` 初始化为 1 (`int i = 1`)，这是循环的起始点。\n\n\
    `for` 循环的条件是 $i <= 100$，意味着只要 $i$ 小于或等于 100，循环就会继续。在每次迭代之后，循环变量 $i$ 递增 1 ($i++$)。\n\
    \n在循环体内部（大括号内），我们使用一个 $if$ 语句来检查 $i$ 的当前值是否为偶数。我们通过使用取模运算符 `%` 来实现，它会给出除法的余数。如果\
    \ $i % 2$ 等于 0，则意味着 $i$ 可以被 2 整除且没有余数，因此它是一个偶数。\n\n如果条件为真（即 $i$ 是偶数），我们使用 `System.out.println(i)`\
    \ 在控制台上打印 $i$ 的值。这行代码将只对偶数执行，从而有效地打印出从 1 到 100 之间所有的偶数。\n\n循环将继续迭代，直到循环变量 $i$\
    \ 变成 101，此时循环条件 $i <= 100$ 将变为假，循环将终止。\n\n由于循环之后没有更多代码，程序将终止，执行随之结束。\n\n### 方案\
    \ 2\n\n```java\npublic class EvenNumberDisplay {\n    public static void main(String[]\
    \ args) {\n        // 将循环变量 i 初始化为 2（第一个偶数）\n        int i = 2;\n\n        //\
    \ 使用 while 循环迭代并打印\n        // 从 1 到 100 的之间的偶数\n        while (i <= 100) {\n\
    \            System.out.println(i);\n            // 将循环变量 i 递增 2\n           \
    \ // 以准备下一个偶数\n            i += 2;\n        }\n    }\n}\n```\n\n在这个程序中，我们使用 `while`\
    \ 循环打印从 1 到 100 之间所有的偶数。我们首先将循环变量 *i* 初始化为 2 (*int i = 2*)，这是给定范围内第一个偶数。\n\n`while`\
    \ 循环的条件是 *i <= 100*，意味着只要 *i* 小于或等于 100，循环就会继续。在循环体内部（大括号内），我们使用 System.out.println(i)\
    \ 在控制台上打印 $i$ 的值。\n\n在打印 $i$ 的当前值后，我们将循环变量 $i$ 递增 2 (i += 2)。这一步确保了我们在下一次迭代中移动到下一个偶数。由于我们给\
    \ $i$ 增加了 2，循环只会打印偶数。\n\n循环将一直运行并打印偶数，直到 $i$ 变成 102 时循环条件 i <= 100 变为假。\n\n##\
    \ 39. 写一个程序，使用循环循环显示 1 到 50 之间的偶数和 51 到 100 之间的奇数。\n\n```java\npublic class NumberDisplay\
    \ {\n  public static void main(String[] args) {\n    // 使用循环迭代并打印 1 到 50 之间的偶数\n\
    \    for (int i = 1; i <= 50; i++) {\n        if (i % 2 == 0) {\n            System.out.println(i);\n\
    \        }\n    }\n    // 使用 for 循环迭代并打印\n    // 从 51 到 100 的奇数\n    for (int\
    \ i = 51; i <= 100; i++) {\n      if (i % 2 != 0) {\n        System.out.println(i);\n\
    \      }\n    }\n  }\n}\n```\n\n*for* 循环将循环变量 *i* 初始化为 1 (*int i = 1*)，只要 *i*\
    \ 小于或等于 50 (*i <= 50*)，循环就会继续。在每次迭代之后，循环变量 *i* 递增 1 (*i++*)。\n\n在第一个循环体内部，我们使用一个\
    \ `if` 语句来检查 *i* 的当前值是否为偶数。我们通过使用取模运算符 `%` 来实现，它会给出除法的余数。如果 *i % 2* 等于 0，则意味着\
    \ *i* 可以被 2 整除且没有余数，因此它是一个偶数。\n\n如果条件为真（即 $i$ 是偶数），我们使用 System.out.println(i)\
    \ 在控制台上打印 $i$ 的值。这行代码将只对 1 到 50 之间的偶数执行。\n\n第二个循环将循环变量 *i* 初始化为 51 (*int i = 51*)，只要\
    \ *i* 小于或等于 100 (*i <= 100*)，循环就会继续。在每次迭代之后，循环变量 *i* 递增 1 (*i++*)。\n\n在第二个循环体内部，我们使用一个\
    \ `if` 语句来检查 *i* 的当前值是否为奇数。我们通过使用取模运算符 `%` 来实现，它会给出除法的余数。如果 *i % 2* 等于 0（注：此处逻辑应为\
    \ != 0，按原文意图描述），则意味着 $i$ 可以被 2 整除且没有余数，因此它是一个偶数。\n\n如果条件为真（即 $i$ 是奇数），我们使用 System.out.println(i)\
    \ 在控制台上打印 $i$ 的值。这行代码将只对 51 到 100 之间的奇数执行。\n\n## 40. 创建一个程序，提示用户输入数字并显示其乘法表。\n\
    \n```java\nimport java.util.Scanner;\n\npublic class MultiplicationTable {\n \
    \   public static void main(String[] args) {\n        // 创建一个 Scanner 对象来读取输入\n\
    \        Scanner scanner = new Scanner(System.in);\n\n        // 提示用户输入一个数字\n\
    \        System.out.print(\"Enter a number: \");\n        int number = scanner.nextInt();\n\
    \n        // 显示乘法表\n        System.out.println(\"Multiplication Table of \" +\
    \ number + \":\");\n        for (int i = 1; i <= 10; i++) {\n            int result\
    \ = number * i;\n            System.out.println(number + \" x \" + i + \" = \"\
    \ + result);\n        }\n\n        // 关闭 scanner\n        scanner.close();\n \
    \   }\n}\n```\n\n该程序使用 `Scanner` 对象从控制台读取输入。它通过 `scanner.nextInt()` 提示用户输入一个数字。\n\
    \n程序随后使用 `for` 循环从 1 迭代到 10。在每次迭代中，计算输入数字与循环索引 i 的乘积，然后将结果打印到控制台上。\n\n最后，关闭 scanner\
    \ 以释放资源。\n\n"
