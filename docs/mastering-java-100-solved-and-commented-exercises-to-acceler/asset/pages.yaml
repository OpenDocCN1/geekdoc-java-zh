  md: "# # Repeat Loops\n\nIn Java, there are three main types of loop structures:\
    \ *for*, *while*, and *do-while*.\n\nFor Loop\n\nThe *for* loop has the structure\
    \ *for (initialization; termination; increment)*. It is useful when you know exactly\
    \ how many times you want to loop through a block of code.\n\n```\nfor (int i\
    \ = 0; i < 5; i++) {\n  System.out.println(\"Count: \" + i);\n}\n```\n\nIn this\
    \ example, *i = 0* is the initialization, *i < 5* is the termination condition,\
    \ and *i++* is the increment operation done after each loop iteration.\n\nWhile\
    \ Loop\n\nThe *while* loop repeatedly executes a block of code as long as a particular\
    \ condition is true."
