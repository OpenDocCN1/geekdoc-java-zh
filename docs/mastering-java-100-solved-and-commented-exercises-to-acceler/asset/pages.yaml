  md: '# Non-Primitive Data Types


    Non-primitive data types are created by the programmer and are not defined by
    Java (except for String). Non-primitive types can be used to call methods to perform
    certain operations, while primitive types cannot. A non-primitive data type can
    also be null, while a primitive type cannot.


    Examples of non-primitive types include Strings, Arrays, Classes, Interfaces,
    and so on. For example, String in Java is a non-primitive data type.


