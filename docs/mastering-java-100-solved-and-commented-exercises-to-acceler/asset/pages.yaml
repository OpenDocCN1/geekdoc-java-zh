  md: '# Variables


    In Java, a variable is a name given to a memory location. It''s called a variable
    because the information stored in the memory location may change during the execution
    of the program. Each variable in Java has a specific data type, which determines
    the size and layout of the variable''s memory, the range of values that can be
    stored within that memory, and the set of operations that can be applied to the
    variable.


    There are three types of variables in Java:


    **Local Variables:** A variable defined within a method is called a local variable.
    The variable will be destroyed once the method has completed.


    **Instance Variables (Non-static Fields):** Instance variables are non-static
    and are declared in a class outside any method, constructor or block. They are
    created when an object is created with the use of the keyword ''new'' and destroyed
    when the object is destroyed.


    **Class Variables (Static Fields):** A variable that is declared as static is
    called a static variable. It cannot'
