    Part of this messy inner monologue spills out to the customs agent at Rome’s airport,
    in rusty pronunciation hampered by Inglese-influenced dialect.


    His head tilted at an angle to study me. “Really? You haven''t been to visit your
    relatives in thirty-six years?”


    I nodded. “Imagine the guilt.”


    He smiled and stamped my passport. “Welcome back.”


    Nadia, a friend from Rome whom I met when I lived in Vancouver, picked up me.
    She would be my host, your guide, and fortunately, transportation to Bonefro.
    Sixteen years and a handful of emails had passed before we reunited. Relief flooded
    through my heart when she embraced me in a fierce hug. *Perhaps,* I let myself,
    the days could be curative.* I piggy this trip onto a writers’ conference in Padula,
    Salerno, where I was scheduled to participate on two panels that Nadia was to
    attend. Her folks lived in Campobasso, the capital of Molise, twenty-five kilometres
    southwest from ground zero.


    Through Facebook, I connected with my maternal cousin’s daughter to let them know
    the day I would arrive. Nadia lives by a different clock. My jaw tensed at our
    late morning departure. Nadia sped down the motorway while I chewed my inner cheek,
    unable to admire the cloudless azure canopy.


