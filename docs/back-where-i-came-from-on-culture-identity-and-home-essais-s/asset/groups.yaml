    在一次回香港参加表亲婚礼期间，我姐姐和我回了那里。当我们在暑假访问香港时，我们的基地始终。在西英蒲（Sai Ying Poon）寻找宝婆的童年家园。第一次访问时，我五岁，我姐姐一岁，机票装放在特殊的信封里，餐点附有餐具。我记得被柴油味和热气的垃圾味环绕，当我们从香港岛的中环码头下车时，在前往长洲的渡轮上喝柠檬茶和杯装面。我出生在加拿大的感官对商店里挂着的整头猪的鼻子完全没有对比。但我对那些挤满了色彩鲜艳的塑料滩玩具和最新的双星、Hello
