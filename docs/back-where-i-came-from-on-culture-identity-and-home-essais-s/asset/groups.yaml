    # 回家之旅


    最近，一位记者问我妈妈，她是否愿意再经历一次。是否愿意再次带着所有的孩子坐上一艘摇摇欲坠的渔船出海，冒着生命危险。是否愿意再次作为“船民”难民从越南来到加拿大。在翻译妈妈的回答时，我犹豫了。


    那个外交式的、浪漫的、英雄式的答案应该是“是”。是的，她愿意一遍又一遍地经历所有的痛苦与苦难，将她的孩子们带到这片充满希望与机会的土地。毕竟，我和我的兄弟姐妹们在这个惊人的国家里为自己创造了美好的生活，拥有温暖的家、充足的食物、持久的安全感、良好的教育以及许多职业机会等一切优权。我，她六个孩子中最小的那个，已经成为了一名医生。而四十年前，我们还只是这些船民，这些卑微的起起点。


    但本能的反应是“不”。不，她不想再经历一次了。


    往昔的画面在我脑海中闪过。妈妈自杀的画面，用皮带勒住脖子，而年幼的孩子在旁边惊恐地尖叫哭着让她停手。


