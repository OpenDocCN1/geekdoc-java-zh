    settlement in a rural setting as a city. For years, the false cognate of commune,
    a term I learned first in English, did not fit the locale by any stretch of my
    imagination. I can''t match the thousand-year-old castle, the eight-hundred-year-old
    (rebuilt) Santa Maria delle Rose Church, or the four-hundred-year-old Santa Maria
    delle Grazie former convent with images I associate with lifestyle choices and
