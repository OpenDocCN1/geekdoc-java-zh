    # Hungary, 1984


    When my parents got to Canada, they arrived in a country that was not known to
    immigrants as a safe haven. It was a country wrestling with the notion of welcoming
    so many people from another country at one time. The stories from the Hungarian
    Revolution, the romance of freedom fighters tossing Molotov cocktails at Soviet
    tanks, had won over the Canadian public, but there was still the issue of what
    to do when all of these people actually arrived in the autumn of 1956.


    My parents married in Austria, inside a small church by the refugee camp they’d
    been living for a few weeks. This, they learned, would help ensure that they would
    be assigned to the same destination in the Western world. Initially, that was
    the United Kingdom, but refugees at that time were allowed to trade their tickets.
    So, when my mom learned that her two brothers were going to Canada, my parents
    traded spots with two people who wanted the British Isles over the long trip to
    a cold country they knew very little about.


    Once my parents arrived in Canada — a Canada that did not think of itself as a
    multicultural mosaic — they were told they had a year to learn English or French.
    They had to assimilate and fit in.


    And a generation of nearly forty refugees took it to heart. In Canada, names were
    changed to be more well, English. A generation of kids were born to hyphenated
    Hungarian families who tried their damned not to be too Hungarian. Being sort
    of Hungarian was okay, but saddling the kids with a ridiculously difficult language
    that hardly anyone spoke was not worth the price of cultural preservation. They
    were preoccupied with thoughts of not sticking out or being seen as a burden.'
  - '[PAGE 99]


    So, I''d always seen my Hungarian-ness as something I could take on and off, like
    a coat. I went to Hungarian school on Saturday mornings in Toronto''s Kensington
    Market, but the language wasn''t all that important to me. It was a chore, like
    someone being forced to attend church to keep up appearances.


    Today, you''ll go to Hungary and find many flags with red cut out of the middle,
    right where the Soviet star used to be until 1990. The message is obvious: it’s
    saying “never again” to communism. But, to me, it also symbolizes our defiance
    in the face of being forced to do anything. I''d argue that there aren''t many
    additions you could make to the flag without Hungarians binring with the scissors
    — not even a red tin of sweet paprika.


    To be a hyphenated Hungarian means being constantly suspicious of one''s own Hungarian-ness.


    That''s what I''ve come to realize over the years. But, when I was thirteen years
    old, going to Hungary giving up a summer of baseball and hanging out with friends.
    It was a place that wasn''t as exciting as Disney World or even Niagara Falls.


    I made my first visit to Hungary in 1984, at age thirteen, on a big family trip
    with my mom and dad. Reagan was president and the Cold War dominated my thoughts.
    Everyone I knew was totally fucked up by The Day After, a TV movie that educated
    the masses in how we''d burn all and fry within minutes of NATO and Soviet forces
    declaring World III. And, as the film showed us, if you survived the opening salvoes
    of a nuclear war, well, you''d rather be dead.


    So, it was weird to be behind the Iron Curtain, thinking across the ocean “our”
    missiles were pointed at me. Our family vacation felt a little like pointing a
    gun at our own heads.


    My parents were aghast that I had managed to smuggle a Los Angeles 1984 Olympics
    T-shirt into our luggage, and told me that I was in no way going to be allowed
    to wear that thing in public. After all, Hungary was one of the Soviet-Bloc countries
    boycotting the Games. Advertising those very'
