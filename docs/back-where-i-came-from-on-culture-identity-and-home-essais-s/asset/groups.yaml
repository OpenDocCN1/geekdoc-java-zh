    When we visited Sydney two years later, I thought I could finally be my true self.
    After all, this was home, or so said my passport. But everyone said I looked American,
    spoke like an American. The accent was meant survival, I explained, a defence
    against “you talk funny” and asked to repeat myself, and being made to feel that
    my manner of speaking was more interesting than what I had to say.


    The feeling deepened when I visited Australia a second time years later. By then
    the country had adopted a new national anthem and the metric system. A new skyscraper
    lorded over Sydney, the needle-pointed Sydney Tower. I was now an Australian citizen
    turned American tourist.


    I never returned to Australia after that trip. I came to the painful conclusion
    that I had to cut the mooring and let the Land of Oz drift into the ether of the
    distant past. So, if Australia — the country that I remembered the best, where
    I spent my formative childhood — wasn’t home, then what was?


    I decided to embrace being American, although I’d never learnt to sing “The Star-Spangled
    Banner” or eat a peanut-butter-and-jelly sandwich. I never mentioned going around
    the world and let everyone assume I was from northern New Jersey. I became the
    first in my family to get U.S. citizenship and begin the traditional American
    career climb, slogging for eight years as a reporter and editor of newspapers
    in northern and central New Jersey.


    I got bored.


    A yearning for novelty and adventure, no doubt seeded by my childhood, pushed
    within me. I couldn’t keep pretending to be like my colleagues — content with
    covering small-town politics and school boards and vacationing at the Jersey Shore
    — because I wasn’t. I quit my job with the abstract goal of living somewhere that
    would challenge me to learn another language, in the hope that I’d find my home
    in foreignness. Over the next decade, I moved from Spain to Guatemala to Venezuela,
    teaching English at times, but mostly working as a journalist for media in the
    U.S. and U.K. Every day presented a novelty, a chance to explore and learn.


    I loved it. What I didn’t anticipate was that, although I was clearly foreign
    by my looks and accent in Spanish, everyone assumed I was a typical American.
    But I wasn’t. Nor was I really Australian or Kiwi. I was still adrift. Lifelong
    nomads met I had grown up as children of diplomats, and thus their identity was
    anchored to their parents’ country. It wasn’t the same as I was raised.


    I grew to envy people who had hometowns, who grew up with sameness — the same
    kids, same house, same neighbours, same traditions. That stability seemed comforting,
    safe, nurturing. In my mid-thirties, I grew angry at my parents for hauling me
    around the world, for not giving any constancy. I missed out on having meaningful
