    # Dede’s Dream


    "Whoa,” says my sister, “this famous person on the money looks like Dad when he
    was young!” She’s doling out drams to pay the visa entry fees at the Zvartnos
    International Airport in Yerevan, Armenia, while I take inventory of my two teenage
    children, tired-but-beaming seventy-nineyear-old mother, and our disorganized
    belongings. I turn for a quick glance — then lean forward for a closer look at
    the one-thousand dram note. It''s uncanny: Armenian poet and activist Yeghishe
    Charents looks like a longlost relative. And perhaps he was, though it would be
    impossible to know without procuring and then comparing Charent''s DNA samples
    to our own. Separated for millennia by the Ararat mountain range, by myriad conquerors,
    by genocide, Western Armenians have been ancestrally and physically disconnected
    from the land that now comprises Armenia.


    Our family’s story, echoing the resilience of the Armenian spirit, is deeply rooted
    in the 1915–16 Armenian Genocide, which is widely considered to be the first genocide
    of the twenty-first century, and the mass exodus that followed. My mother’s parents,
    survivors from Kayseri, Turkey, carried a legacy that profoundly impacted our
    family. My Sahag deede (grandfather) was orphaned, then “adopted” by a Turkish
    family, and then “kidnapped” by his sister, before age ten. Desperate to leave
    Turkey, sold all his belongings in the 1930s and gave his life savings to a man
    promising passports to Armenia, a country quickly carved out territory and then
    quickly colonized again by the Soviets. In effect, there were no passports to
    be granted. But my grandfather, an uneducated villager, could not have known better.
