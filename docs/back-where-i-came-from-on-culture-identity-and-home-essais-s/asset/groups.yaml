    especially not with one another. My small doubts seemed even more minuscule in
    comparison to how our lives were in harmonious bond with the land. In the quiet
    stillness of Khuisiin Naiman Lake, I could laugh at my silly ideas of belonging
    and identity. The fears I harboured in truly embodying my hyphenated identity
    didn''t have to be a choice between one and the other when so much of me was influenced
    by both. I could be as fluid and momentary as the passing streams in the river.
    I validate the scattered, unfinished, cut, and edited parts of me that are equal
    to this strange abstract whole.


    The land is a timeless mother, gracious in her patience and yearning for her children
    to return. Despite the passing years, how far I might have gone, and how much
    I’ve changed, the land will always remember me when I come home.'
