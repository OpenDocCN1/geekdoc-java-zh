    ANGELO SANTOS 是一位作家、电影制作人和物理治疗师，曾居住在世界各地，包括菲律宾、中东、美国和加拿大。2020年，他被选为加拿大作家联盟BIPOC作家连接会议的学员。Angelo的作品曾发表在*Ricepaper
    Magazine*、*Filling Station Magazine*以及菲律宾裔加拿大人人写作选集*Magdaragat*上。他住在安大略省的奥克维尔。


