  - '[PAGE 179]


    promoting me to “permanent resident.” It is my host country, but our relationship
    is a rocky one. I permanently reside here, but my sense of belonging is perpetually
    murky.


    What if the war never happened? What if I returned and raised my daughter there?
    What if we had never left?


    In America, I''m the one with the accent, the name that has mangled. The one who
    answers your simple questions about my background with geography and history lessons,
    and whose name you''ll forget within minutes of us meeting. The one who''s from
    the place you don''t know much about, except for what you read in a travel magazine,
    but you have things you want to tell me about anyway. I am unmoored and divided,
    like the nation that birthed me.


    I''ve spent my whole adult life in the United States, so my English is better
    than my Croatian. I know my way around, know the lingo, know how to manoeuvre
    the culture and social norms. But nothing here feels familiar or clear as a swim
    in the Adriatic. Even if I''m having fun with friends at a barbecue, a piece of
    me is missing, or something feels out of place. In America, I''m the unsteady
    tourist struggling to find my way. Decades away from my motherland have loosened
    my grip, but I''m the strange creature still clinging to my home.'
  - '[PAGE 180]


    # Acknowledgements


    First and foremost, we would like to thank Hazel Millar and Jay MillAr for their
    support in our vision and for giving this book a home with Book*hug Press. We
    are grateful for the faith and trust you placed in us. Our gratitude extends to
    Shannon Whibbs for copy editing, to Ingrid Paulson for the type and design, and
    to everyone involved in the production of this book. Taking an idea from concept
    to bookstore is a huge undertaking requiring the passion of so many others along
    the printing and distribution chain. We thank you all.


    We''re deeply grateful to the writers and editors who enthusiastically shared
    their support and expertise along the way. Thank you to Bonnie Nish, who fanned
    the flames of what was just an idea of a book, and who provided space for conversations
    around these themes at Pandora’s Collective and Word Vancouver events. You are
    a gem of a friend and the champion everyone needs in their life. Thank you to
    Ayelet Tsavari, who believed in this anthology from the beginning and generously
    shared her time and knowledge to help us get off the ground. Thank you to Samantha
    McCabe and Pandemic University for helping gather submissions, and Shereen Zinck
    and the Edmonton Community Foundation for helping us expand our collection.


    Many thanks to our friends and families. Your celebratory notes at every step
    of this journey warmed our hearts.


    This book wouldn''t be this without the contributors that we are so proud of and
    their willingness to explore these ideas with such vulnerability and dedication.
    Writers, thank you for your beautiful stories.'
  - '[PAGE 181]


    # Biographies


    EDITORS


    TASLIM JAFFER is a writer, editor, and writing instructor with an MFA in creative
    nonfiction from the University of King’s College. Her bylines include Maclean’s,
    Asparagus, WestCoast Families, CBC British Columbia, Peace Arch News, Unearth
    Women, and more. She is the winner of the 2022 Creative Nonfiction Contest from
    the Creative Nonfiction Collective and Humber Literary Review, and recipient of
    a 2021 Silver Canadian Online Publishing Award. Jaffer has been a keynote speaker
    on diversity and interfaith topics on a variety of stages and teaches creative
    nonfiction and expressive writing in community and rehabilitative settings. She
    is working on a debut collection of literary essays and lives in Surrey, British
    Columbia, with her husband and three children.


    OMAR MOUELLEM is an author, filmmaker, and educator. His journalism has appeared
    in The Guardian, WIRED, and the Wall Street Journal. His book How Muslims Shaped
    the Americas won the 2022 Wilfred Eggleston Award for Nonfiction and was named
    one of the Globe and Mail’s one hundred best books of 2021. His documentary The
    Lebanese Burger Mafia, which documents the unlikely link between fast food and
    Lebanese immigrants, won the 2023 Audience Choice for Best Doc at NorthwestFest.
    He also teaches creative nonfiction at the University of King’s College and is
    the “fake dean” of Pandemic University School of Writing, a virtual school he'
  - '[PAGE 182]


    founded in support of writers affected by the COVID-19 pandemic. He lives in Edmonton.


    # CONTRIBUTORS


    **NADINE ARAKSI** is an Armenian-Canadian writer whose work explores womanhood,
    identity, and the transformative power of storytelling. Her writing has appeared
    in Canadian publications such as Chatelaine, Maclean''s, Today''s Parent, and
    Canadian Geographic. Nadine finds inspiration in Toronto''s diverse and vibrant
    neighbourhoods, where she lives with her two teenagers and her faithful feline,
    Cookie.


    **OFELIA BROOKS** is a Black, Latin, first-generation writer and lawyer. Her writing
    has appeared in Electric Literature, Catapult, Cutleaf, Insider, and the anthology
    Mamas, Martyrs, and Jezebels (Black Lawrence Press). Her essay "Mother Tongue"
    was nominated for the Pushcard Prize. She lives in Chicago.


    **ESMERALDA CABRAL**''s travel memoir How to Clean a Fish and Other Adventures
    in Portugal* was published in Spring 2023 and shortlisted for the Sunshine Coast
    Writers and Editors Society Prize for B.C. authors. Her writing has been published
    in the Globe and Mail, Understore Magazine, Gáve-Brown, The Common, Canadian Traveller,
    Curiosity Magazine, and nine anthologies. She is a graduate of the Writer''s Studio
    at Simon Fraser University and holds an MFA in creative nonfiction from the University
    of King''s College in Halifax. Esmeralda was born in the Azores, Portugal, and
    now lives in Vancouver.


    **JUNE CHUA** was born on the island of Borneo and grew up in Alberta. She worked
    for two decades at the CBC as a reporter, producer, and news writer/editor, where
    she also crafted monthly columns. She has directed'
  - '[PAGE 183]


    independent award-winning documentaries and written articles for national newspapers
    and magazines. Her essays have appeared in Stranger in the Mirror and the Best
    of rabble.ca. She currently resides in Berlin, Germany.


    # SEEMA DHAWAN is


    is a Calgary-based journalist who has contributed to USA TODAY, Condé Nast Traveler,
    and Huffington Post, where she was an editor. Dhawan holds an MFA in creative
    nonfiction and is working on a collection of essays about her grandparents’ pickle
    empire.


    # KRISTA EIDE’s


    fiction and creative nonfiction have appeared in publications across Canada. She
    lives on unceded Musquam, Squamish, and Tleil-Waututh territories (Vancouver,
    British Columbia), where she is the managing editor of EVENT magazine and works
    in film and television.


    # OMAR EL AKDAD is


    an author and journalist. His first novel, American War, was translated into thirteen
    languages and is an international bestseller. It was selected by the BBC as one
    of hundred novels that shaped our world. His second novel, What Strange Paradise,
    won the Scotiabank Giller Prize, the Oregon Book Award, and the Pacific Northwest
    Book Award. He lives in the woods just south of Portland, Oregon.


    # EUFEMIA FANTTI is


    the author of My Father, Fortune-tellers & Me: A Memoir, and A Recipe for Disaster
    & Other Unlikely Tales of Love, winner of the Bressani Prize for Short Fiction
    and runner-up for the Danuta Guest Literary Award. The anthology she co-edited
    with Ayelet Tsabari and Leonarda Carranza, Tongues: On Longing and Belonging through
    Language (Book*hug Press), won Gold from the 2022 IPPY Awards and Silver from
    the 2021 Foreword INDIES Book Awards. Her nonfiction has been published in various
    anthologies, including Conspicuous Accents, Flash Nonfiction Funny, Love Me True,
    and Body & Soul. She lives in'
  - '[PAGE 184]


    Toronto, where she teaches creative writing at Humber College and is co-editor
    of the Humber Literary Review.


    # AYESHA HABIB is a writer and photographer based in Vancouver, British Columbia.
    She has been a journalist and editor for publications such as the Globe and Mail,
    Chatelaine, Toronto Life, Capital Daily, and Maisonneur. In 2021, Habib self-published
    a photography z called Papercut and directed the experimental film i hope you
    find the person you want to drown in. She lives with her exceptionally loud cat.


    CHRISTINA HOAG is the author of novels Girl on the Brink, named Suspense Magazine’s
    Best of YA; and Skin of Tattoos, a Silver Falchion Award finalist; Law of the
    Jungle; and The Blood Room, an Audible bestseller. She co-authored Peace in the
