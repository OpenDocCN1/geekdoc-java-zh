    rejoined us, Mom’s face conveyed a cool self-satisfaction and serenity, as her
    dutiful act had immediately lifted a burden from her typically hunched shoulders.
    My mother shimmered with the triumph of a promise fulfilled. As I watched her,
    I felt the burden of a displaced generation begin to lift off her.


    We packed our bags and piled into George’s car to pay respects to our ancestors
    at Tsiternakbed, the genocide memorial. Rain trickled onto dozen massive slabs
    of stone, each representing one of Armenians’ lost provinces” in Turkey, which
    leaned over the famous eternal flame representing the 1.5 million lost, shielding
    our grief. Speakers played “Der Voghormia, the saddest song in the Armenian liturgy.
    I wept under my umbrella, grateful that we had managed to forge our space for
    collective grief.


    On the way back to meet George in the parking lot, some local men greeted us and
    asked where we were from. Their initial friendliness turned to scrutiny upon my
    learning children Armenian. “You didn’t teach them Armenian? Is their father Armenian?
    What kind of Armenian are they, then?” Though perhaps well-intentioned, I felt
    an undercurrent of judgment, as our authenticity as Armenians was still pending
    evaluation. How to explain the exhaustion of a North American working mom, my
    struggles with logistics due to ADHD, and how losing a precious day off with them
    to the one remaining “Saturday school” felt unmanageable, if not to me?


