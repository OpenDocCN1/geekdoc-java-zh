    这段时间一直没有访亲，没有观光，没有购物。相反，我们正出去远足。天空呈现出明亮的蓝色。今天水里没有游泳的人。我们看到了台风山竹过后的遗迹：路灯以令人心惊的角度倾斜，通往直升机停泊场的铺设道路变成了扭曲的金属和破碎的混凝土。如果路没有被扭曲，这里应该是鲍鲍（Pau
    Pau）从救护车上转运出来飞往香港岛大医院的地方。现在他们不得不开车送她到一个体育场去赶直升机。


    我一直以为我的鲍鲍从未把我看作中国人。凭我勉强及格的粤语，混血身份，我那鬼佬（gwai lo）父亲，以及在加拿大的成长。


    我的第一代香港移民母亲和第五代爱尔兰裔加拿大移民者父亲不知道如何教我们谈论种族。我们被培养得真的会认为自己是中国人吗吗？我经常希望自己能更坚强，去面对那些内化的关于我身份认同的矛盾信息。在小学时，我在操场上跟不上那些说粤语的同学。然而，我会去课后的中文书法班和中文夏令营，我们的大部分餐都在埃德蒙顿的中国餐厅和唐人街餐厅吃。成年后，许多白人陌生人在学习任何其他中文东西之前，总会强着向我讲述他们的亚洲妻子或中国之行。中国亲戚有时会问我是否会用筷子。中国爱好者曾自豪于他们背了多少个汉字，并对我所掌握的汉字量少得多表示惊讶。同样是华裔背景的朋友们也曾告诉我，我并不是真正的中国人，因为我的父母不把多余的垃圾袋放在洗碗机里，或者不知道“芥兰菜”（gaai
    laat）和“生菜”（gaai aan）发音的区别。成年后，我曾在办公室的午餐室里看到过白人同事对我的豆腐皱皱鼻子。


    当我二十五出头，刚大学本科毕业时，我决定用上积蓄回到“母国”。我觉得这是一种寻找根源的方式，让我从身份认同的混乱和不适中走出来——那是作为一名混血亚洲女性在自己的皮肤上经历过的挣扎。为了帮助我更好地融入定居殖民主义的加拿大（我称之为家），作为一名非白人的定居者（祖先是从其他英国殖民者移民过来的），我买了一张去香港的单程机票，并制定了一个模糊的计划。我会和鲍鲍住一段时间，学习更多粤语和普通话，也许找份工作，也许在有机农场做志愿者，然后，哇哒哒！我变得更像中国人了。我母亲安排我每个月给鲍鲍一笔钱作为“电费”。我在那里待了几个月，住得太久了。我本以为我设计了一场自主的留学之旅，我将从长辈那里学习，连接根源，并找回我的文化和语言。相反，那是一段尴尬、笨拙且充满冲突的时光。我因为洗衣服的方式被责备（并不算冒犯），也因为有一次把筷子直插在碗里被责备（这是大忌）。几乎每天，鲍鲍都会问：“你在这儿干什么？”


    居留一个月后，农历新年临近，鲍鲍给了我一个红包，里面塞着几张挺括的香港钞票。她把我赶出房子，催促我去“行街”（hang gaai）——逛街/散步——为新年买新衣服。我走在街上进一家精品店，挑了一件舒适的深蓝色白色波点毛衣，背部有一排扣子。我回到家，把它从皱巴巴的粉色塑料袋里拿出来，自豪地展示给她看。我做到了！在体验我的文化！


    她的脸垮了下来，大声地叹了口气：“哎呀！”


    我不知道发生了什么。她拿起电话，拨了一长串长途电话的十四位数字，嘟囔道：“你妈妈没教过你任何东西。”


    “喂？”我妈妈睡意惺醒的声音传来。那是埃德蒙顿的午夜。


    鲍鲍对着我妈妈说话很快，间隙中对我比着歪曲的手指，然后把电话递给我。


    我妈妈解释道：“过农历新年你要穿幸运色——红色、粉色，甚至是紫色都可以。但你选了最不利的颜色。蓝色和白色。这些是丧礼色。”我简直不能更糟了。


    鲍鲍拿上她的零钱包和雨伞。我们要出门了。她径直走街去另一家精品店，用伞指着门口，让我进去。我穿过一道厚实的塑料帘，目光落在一件鲜红色的卫衣夹克上。我试了试，袖子只到我前臂一半——我很确定那不是那种七分袖，完全不合我这（相对巨大且宽肩）的加拿大体型。我瞥了一眼它，寻找鲍鲍。她点头表示了粗鲁的认可。


    足够了。*好吧，我把袖子卷起来就行了。*我买了那件卫衣。我们转过角来到她最喜欢的云吞店，吃了一顿快速、廉价、热气腾腾的云吞晚餐。总的来说，这是一次成功的出行。


    回家的路上，我们路过被火光照亮的阳台；那些依然遵循传统的人正在红罐里烧纸钱来迎接新年。我们碰到了一个推着推车的小狗的邻居。我们交换了红包，“身体健康隆！”——祝你健康快乐。狗狗合拢爪子，祝新年快乐。


    # 2018


    在鲍鲍葬礼的前一天晚上，我们无法入睡。那些遵循传统的人正在红罐里烧纸钱来迎接新年。我们碰到了一个推着推车的小狗的邻居。我们交换了红包，“身体健康隆！”——祝你健康快乐。狗狗合拢爪子，祝新年快乐。


