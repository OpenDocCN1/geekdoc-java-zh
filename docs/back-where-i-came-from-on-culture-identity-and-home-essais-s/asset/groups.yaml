    ## Hooky in my Homeland


    “Are you going to Friday prayer?” asked Amal, my grandparents’ caretaker. I looked
    at Teta and Gido sitting beside me on the balcony I considered my options. I''d
    arrived last night and felt it too soon to offend my elders and start rumours
    about myself, the heathen Canadian, so I said sure. “Good,” she said, “I’ll leave
    you some hot water so you can make wudu.”


    I needed to freshen up after a day of travel, anyway, and was eager to explore
    my family’s hometown, something I’d never done before. It was my first trip to
    Lebanon in eight years and my first as an adult. Fresh out of college, I planned
    to spend the previous summer here to figure out what, if anything, I could do
    with two certificates from two separate colleges and little life experience. I
    was prepared to extend it a year if time allowed it. But six days before my departure
    flight, on July 12, 2006, Hezbollah militants instigated a war with Israel, whose
    government retaliated with predictable cruelty; in addition to killing civilians
    and wiping out entire families, the Israeli Defense Forces targeted civilian infrastructure,
    including runways at Beirut’s Rafic Hariri International Airport — which had been
    renamed in honour of his prime minister assassinated by an agent of Hezbollah
    with suspected Syrian backing. So, instead I spent that summer educating myself
    in Middle Eastern history, psyching myself up for the rescheduled trip a year
    later, and enrolling in yet another — my third in three years.


    People told me I was crazy or brave to still go, but if not that summer, then
    when? The situation, I agreed, would likely get worse before I got better — but
    would get better while I was still wandering young adult convinced that my hidden
    potential lay dormant in the homeland? Well, at least shave your beard, advised
    an uncle before I left, concerned that I''d be mistaken for a Shiite — i.e., Hezbollah
    sympathizer — especially in Kab Elias, our predominantly Sunni with some Christian
    neighbourhoods in the foothills of Mount Lebanon. I told him never; my beard had
    been my defining feature since the ninth grade. It signified my proud Middle Eastern
    identity in defiance of anyone who, joking or not, call me a terrorist, and if
    I''m being honest with myself, in defiance of my own failures to embrace my heritage.
    Abstaining from alcohol and reading Arabic was hard, but I could still distinguish
    my Arabness with basic grooming.


    The advice continued after landing in Beirut. My uncles and cousins reprimanded
    me for my beard on the drive from the airport the night before, and I''d heard
    it again from Amal and my grandparents on the balcony — upped my motivation to
    get dressed and get going.


    With a slim digital camera and notebook in my satchel, I bid them goodbye. I never
    intended to go to Jumah; I planned to see them, revisit childhood memories, and
    return home after prayer finished.


    My first order of duty was to buy cigarettes for a fraction of the cost that they
    were in Canada. I stood in line behind a kid who couldn''t see over the counter,
    yet could buy a pack of Viceroy for his dad (one hopes). Not recognizing any of
    the brands myself, I asked for the same when it was my turn. The clerk, who I
    vaguely remembered as a distant relative named Karomi, “You’re Ahmed Moualleem’s,”
    he said, then proceeded to remind me how chubby I was in the seventh grade. “Look
    at you. You’ve lost weight.” Karomi dragged his knuckles across his cheeks. “What''s
    this? You look like a terrorist.” We laughed about it and caught up for long as
    my limited Arabic allowed, and then I was on my way.


    I didn''t get far before running into Ghassan, another distant cousin, who used
    to own a billiards and arcade room. Once, when I was seen, walking around his
    store, my foot slipped out of my flip-flops onto a sharp, rusty dustpan and was
    sliced open. Ghassan rushed me to the hospital for stitches and a tetanus shot.
    Fifteen years later, it was the first thing he remembered about me. I offered
    to show him the scar, but he was busy looking for his cat, so beautiful, she was,
    that, Ghassan was convinced someone had stolen her.


    I suggested he print posters of her and offer a finder’s reward. Ghassan liked
    the idea and asked me to help make some posters. He took me into his house to
    choose a picture from his son’s computer. While his son booted the computer up,
    I scanned the teenager’s bedroom walls. Amid of posters of Brazilian soccer all-stars,
    there were pictures of Hezbollah leader Hassan Nasrallah with his fist raised.
    Three flags hung down the ceiling — Lebanon, Brazil, and the yellow Hezbollah
    emblem with the A in Allah rising up to a machine gun. You’d never see these decorations
    outside of Shi’s home a year or more ago. Many, if not most, of my relatives in
    Kab Elias have portraits of Rafic Hariri or his prodigal son, Saad. Nasrallah
    was a parasite to them. The 2006 war was changing his public image. Creeped up,
    I wanted to leave, but first I had to survive a hundred pictures of his kitty,
    and each time, had to remark on how beautiful she was. The call to prayer mercifully
    intervened. Ghassan offered to take me with him to mosque, but I said I needed
    to run home and make wudu first.


    “Hurry,” he said, “there’s not much time.”


    On the way out I saw another Nasrallah picture, framed and mantled where most
    people keep family photos. Ghassan caught me glancing at it, and smiling tenderly,
    said, “You look like him with your glasses and beard.”


