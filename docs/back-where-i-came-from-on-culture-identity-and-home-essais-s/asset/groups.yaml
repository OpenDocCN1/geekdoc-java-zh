    [content]

    that eventually culminated in heartwarming tales that brought families closer
    together. This is what life had made of my expectations. Love’s prevalence. The
    inevitability of family. But the months that followed my diagnosis were absent
    of silver linings. Grief and guilt met in the back of a bar and destroyed each
    other, held nothing back. Breast cancer materialized, like deep-seated and uncomfortable
    conversations around gender presentation and sexuality that had been carefully
    and comfortably avoided in previous years in my family. I felt responsible — as
    if I had manifested the cleaving off of my most feminine asset.


    “God takes from you you are not grateful for,” my mother used to tell me. She
    mourned and mourned my gone womanhood, picturing her plump and fleshy lineage
    curved against the ghost of a chest.


    When the winter at last showed the first signs of melting away, the long and jagged
    scar across my chest a satisfying shade of pink, my mother clasped, with all her
    might, at a spidery thread of hope, and refused to let go. She presented my family
    with a solution to our heartbreak.


    “I think it’s time for a visit home.”


    My sister and I were lucky enough to spend many summers of our childhood in Tehran,
    surrounded by family, watching our parents transform in the confidence and comfort
    of being in a home they knew. My mother laughing with her sisters. My father gifting
    a yellow dress to his niece. We saw these moments. We understood that distance
    was a feeling.


    My parents had left the country in 1989 when my father was granted a student bursary
    to study molecular biology in Edmonton. He was to return to Iran, work, raise
    his family. We were never supposed to stay. But as Iran was plunged deeper into
    economic difficulty, following decades of stifling Western sanctions, we stayed.
    We moved to Toronto, settled into a Regent Park apartment, became Iranian Canadians.
    Collecting scratch-off calling cards in a corner of the kitchen table. Driving
    to Niagara Falls on long weekends. Waiting for summers in Iran.


    In the early years, when we''d arrive at the airport in Tehran, we''d be treated
    like celebrities. My mother''s huge family would stand behind the glass at Mehrabad
    International Airport with bouquets of flowers in their hands, eyes glistening,
    jumping with excitement. When I was small enough to be carried, I remember being
    passed from arm to arm, pinched and smothered in a blur of kisses. I remember
    picturing myself crowd-surfing in movies I''d seen, all that love excuse carrying
    me to the warm, gasoline-scented air outside.


    Our family''s arrival was an opportunity and excuse for everyone to gather. Old
    fights would be resolved or pushed out. Spontaneous road trips to the Caspian
    would be arranged. Not a day passed that we weren''t invited to someone''s home.
    I''d spend the days following my grandmother, a devout Ashtayani woman, as she
    fed the pale-chested pigeons on the balcony. I''d play gorg be hava with my cousins
    in the cracked and muddy water pool in my aunt''s yard, where in each cracked
    corner, small yellow flowers sprouted amongst bunches of weeds.


    We silenced grief with these memories on the plane ride over.


    > Do you remember Amoo Ismail always snoring in the back room? May God grant mercy
    to his soul.

    Remember the year Moha and I painted all the tiles on the balcony? And how we
    wept when the rain washed it all off?


    Remember all the laughter?


    Everyone suffered together story after story on the plane until our excitement
    bubbled off the wings and into the night''s blinking sky. All our hope, like eggs
    in a Tehran-shaped basket. "Ay vatan," Baba said from his seat, his heart beating
    against his chest. Oh, homeland. We were going back to Iran and surely it would
    wash all the salt from our wounds, all the mud from our hair. It was Norouz. A
    new day, a new beginning. Enough, enough with the loneliness and sorrow and rooms
    holding all the pain of the past six months. We would find our way back to one
    another. This is what life made of our expectations: home is what heals us.


    Inshall.


    Some kinds of losses are simple. Black and white. They either shatter heart into
    pieces small enough to slide between teeth — or they don’t.


    Losing a body part. Losing a country. Those are the complicated kinds of loss.


    A few days before my left breast sliced like a pear off my terrified body, my
    dear friend Rou, a quiet and thoughtful photographer, showed up with a camera
    and a notebook to my third-floor apartment. She took photos of my body before
    it became mismatched. Me lying on my bed. Me looking in the mirror. Hands by my
    side. Hands folded across my chest. “Don’t smile,” she kept reminding me, “look
    natural.”


    Before she took the photos, she had asked if it would be okay to pose some questions.
    We sat on square brown chairs, our faces lost in the fog of steam rising from
    our teacups. My chair made a clicking sound each time I moved, the back screw
    loose. Rou wondered:


    - What thoughts were going through my head with the mastectomy

    - How did I anticipate saying goodbye to this body part?

    - What was my relationship with my breasts?


    I was unsure how to answer. “It’s complicated,” I had said. “They hold so much
    . . . discomfort.” They’ve been punched and squeezed and poked without my permission.
    They’ve connected me to a femininity I resented yet felt intimately obligated
    to.


    In truth, there is little to say of occupancy, ownership. Sometimes hidden, sometimes
    not. But never guarded, never protected, never safe. Even with all that padding.


    On that day, the surgery was less than forty-eight hours away. “There’s not enough
    time,” I told Rou. There was not enough time, and I was unsure what a body needed.
    My body, with its rivers and valleys and patience. My untimely remorse that showed
    up anyway, head hanging.


    More than anything, I was sorry. I apologized to my body, begging for its forgiveness.
    God takes from you what you are not grateful for. Rou listened to my pleas and
    sobs, waiting patiently, her hand on my arm.


    She said, “Tell me when you’re ready.”


    “My body is a place,” writes poet M. Soledad Caballero. “Part of something beyond
    bone and rage.”


    A few months after our plane landed in Tehran that mid-March night, the heartbeat
    of a young Kurdish woman would be silenced. The straw would land. The camel would
    collapse. The bloodied hands of tyrants from every direction would scramble to
    the beat of their own interests. Sons and daughters, and all between and beyond,
    would swarm the streets chest-first, growing like mitosis, multiplying by the
    day. It would come as no surprise after decades of patience thinned by grief and
    resentment. The choke of inflation and theft and greed.


    Nothing had happened yet. But we could feel it, from the night we arrived. The
    tired, aching body of a city we arrogantly thought we knew. The body had changed.

