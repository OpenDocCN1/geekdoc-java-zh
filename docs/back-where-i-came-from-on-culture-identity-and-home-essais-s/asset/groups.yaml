    The last time I was in El Salvador was during a vacation with my mom and my siblings
    in 1989. I planned to stay most of the time at my maternal grandparents’ home
    in Santa Teccla, a little two-bedroom, five-hundred-square-foot row house with
    a black metal gate at the front. When I was a child, I remember the abuelito picking
    me up on top of the stairs and feeling nervous at the altitude. He was the tallest
    adult. My abuela, however, was so short that I surpassed his height by my tenth
    birthday. Every hug from her was like the first in a long time: “has crecido mi
    Omarcito,” she’d say, holding me tightly. You’ve grown, my little Omar.


    It had been fourteen years since our last hug. I arrived at the El Salvador International
    Airport feeling relaxed and in no hurry to retrieve my suitcase. My dad had warned
    of thieves and fraudsters who prey on incoming naive tourists. I was naive but
    I wasn''t a tourist; this was my home.


    My cousins pulled outside the airport with their pickup truck and helped load
    my luggage. There were more cousins than seats, so I''d be travelling in the back
    of the truck. Somehow, seeing seven-year-old cousin mount up short-circuit my
    anxiety over a thousand imagined scenarios of collisions and body dismemberment
    I could experience on the highway to San Salvador.


    Returning as an adult felt much different than it did as a child. There was a
    solemnity in returning to this land as I recognized the gift of having family
    remain and welcome me back. My abuela, without abandon, immediately wrapped her
    arms around my waist when I entered the house, and just like when I was ten years
    old, commented on how tall I had gotten. My abuelo, never known to smile, merely
    smirked as he extended his arms to embrace. He seemed shorter than I had last
    visited, and you could see it in his cataracts how time had sapped his vigour.
    I sensed he and I were both asking ourselves the same question: why hadn''t I
    visited sooner?


    The next morning, while lying in my room, not fully awake, I scribbled a few sentences
    in my journal as a placeholder of all the raw emotions I was feeling. Then I closed
    my eyes to rest a little. Before I could fall back asleep, I heard a faint and
    familiar melody outside the window. As'
