    And yet, we always returned to Palestine in the summers, despite the dangers,
    despite the hassles and the indignities and the traumas. As I grew older, I found
    my anger growing, and I felt compelled to do something, to bring evidence back
    of the treatment I witnessed. In one misguided effort at documenting the abuse,
    I frantically snapped pictures through the window of Uncle Khaled’s home as an
    invading soldier detained young stone-throwing boys from the streets outside.
    I thought I was discreet, but soon the soldiers pounded their way into the house,
    rifles pointed at all of us as they yelled in their broken Arabic to “bring out
    the camera.” I handed it over. As I watched them pull the film out. Unsatisfied,
    they ransacked the entire home, overrunning drawers, dumping the contents of cupboards
    on the floor and arresting Khaled, taking him on a twisted joyride before later
    dumping him on the side of a road; he walked through the night before finding
    a Palestinian to bring him back home the next day. I’ve never forgotten the guilt
    of that moment, or my searing resentment at the fact that my efforts to capture
    evidence of our oppression had led to my entire family being punished and my uncle
    being hauled away.


    My family hasn’t forgotten it, either, though they recall it with emotions much
    different than mine.


    “Do you still have the photos you took of the soldiers when you were here?” Khaled’s
    wife asked me twenty years later. The memory is recounted with surprising nonchalance
    and levity. My uncle chuckles as he recalls having to find his wife back to the
    village.


    “At least they didn’t throw me in jail,” he says, smirking. The incident has become
    family lore; the strong-headed Palestinian from Canada who thought a few pictures
    might make all the difference. The years since, I’ve come to realize they wouldn’t
    have mattered at all. Images of Palestinians being brutalized by the Israeli military
    are plentiful. But it would require the person looking at the image to see our
    full humanity to recognize the treatment as depraved.


    There’s an old joke that you’ll always know you met a Palestinian because they’ll
    waste no time telling you where they’re from. It’s our way of asserting ourselves,
    our identity, our existence in a world that’s tried to erase us or paint us as
    violent terrorists. Being Palestinian means being denied the right to exist fully
    and freely in the place that you come from. And here we are, still existing, still
    fighting, still rooted to the land.


    My two weeks this summer have been some of the most joyous memories from Palestine.
    At thirty-eight, I now look at my family and see my features in the faces of my
    uncles and aunts — the same almond-shaped eyes, the same weak chin, the same wide
    smiles and wonder what took me so long to return. The generosity, the laughter,
    the time spent together among Uncle Saleh’s avocado and lemon trees, haggling
    in the souk and eating kanafeh. The late-night gatherings with tea and extra-strong
    coffee flowing between the stories and memories. It’s as if no time has passed
    at all. The faces of my family remind me that no distance, no injustice, can uproot
    me. Despite all the reasons for despair, we find joy in every day.


    # Chicken Soup and Tortillas


    I was five years old when I heard the sound of metralletas (submachine guns) near
    my house.


    Thinking back, I''m surprised by how decisively I hid beneath my bed without instruction
    from my nanny, who had opened the front door to let me in. It was a strategic
    move because when I was playing in my bedroom, I overheard my parents tell their
    friends that mattresses can stop bullets. Something about how the wires and cotton
    fibres entangle the tiny projectiles'' spin.


    I lay underneath the bed until the gunshots faded, like the tail end of a parade
    dissipating into the horizon. El Salvador was in the middle of a civil war between
    the government army and the guerrilleros. The origins of the conflict endured
    for forty years until a large-scale confrontation finally broke out. This lasted
    for about thirteen years, with reported deaths of approximately 75,000 people,
    mainly civilians. What I heard that day was a regular occurrence for many, including
    my nanny, a stern nurturing woman in her thirties, who reached down with her hand
    and impatiently asked if I wanted some juice and bread, as if she''d experienced
    an annoying seat to her routine.


    Many middle-income families had nannies during the eighties. They were usually
    hired from rural and poorer peers of El Salvador to help with cooking, house cleaning,
    and child-rearing. My nanny, Alicia, wasn''t just an employee of my parents; Alicia
    was family. We both cried when my parents told her we were moving to Canada one
    day in 1985.


    When my parents retell any story about our life in El Salvador, Alicia is hardly
    ever mentioned. When you''re a refugee in a new country, escaping civil war, living
    within the poverty line in subsidized housing, realizing your family once had
    hired felt seems painfully humbling and incongruent.


    A nanny doesn’t fit into the narrative of the struggling and suffering immigrant,
    so she inevitability gets erased from family lore.


    But the thing about trauma is you don''t get to choose what you want to remember.
    So, for me, Alicia wasn''er erased; her part was just edited to a minor character
    who sometimes appears within a jumbled traumatic memory of explosions and violence.
    Whenever fireworks paint the sky with a kaleidoscope of lights, the reverberation
    transports me back to feeling helpless and terrified. Escaping wars is a misnomer;
    you never escape them—you just learn to turn the volume down. Unfortunately, on
    most days, Alicia''s reassuring memory also dimmed down.


