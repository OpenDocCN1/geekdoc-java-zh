    “I was born.” There must have been something in my voice that day; he relented
    and we booked flights departing eight weeks later. When Dad’s cousin learned we
    were coming, she offered us untated flat, noting that it was newly renovated,
    air-conditioned, and would be stocked with bottles of filtered water for our stay.
    I was embarrassed by my relief at these offerings, this subtle acknowledgement
    of our foreignness. But I wasn''t going to give up air conditioning. We gracefully
    accepted.


    The air was warm and humid when my cousin and a driver picked us up from Moi International
    Airport at 2:00 a.m. My hair dampened around the nape of my neck as we walked
    towards the car, answering my cousin''s questions about the three flights that
    brought us there. On the drive, I tried to take in what I could, peering out the
    window, but was met with only darkness. Security guards let us in to Makupa Flats,
    a gated community built around an Ismaili jamatkhana, but I''d had to wait till
    daylight to truly see eyes on the place I grew up, where my paternal grandmother
    had lived, and where my first cousin still calls home.


    After selecting the bedroom off the living room, and sliding into pajamas, I pulled
    back the mosquito netting surrounding my bed. I relished being horizontal for
    the first time in almost two days, but a few hours later, I was still awake to
    hear the morning azaan, a man’s voice trumpeting through the dawn air, calling
    the pious prayer. I felt my dry eyes sting as the tears pricked them; I''d never
    heard the azaan in public at home.


    I might have dozed off because my next memory is hearing Dad opening and closing
    kitchen cupboards and the tick-tick-tick of the gas stove. I joined him in the
    kitchen despite being bone-weary. We fuelled ourselves with strong Kenyan chai
    and Huseini Bakery nankatai, then sank onto the living room couch to make a list
    of landmarks we intended to visit: family homes, places of worship and schools,
    mostly. Dad mentioned Four Twenty South cottages in Diani, where he and Mom honeymooned
    — the setting of my favourite photos. “Maybe Uncle can take us there if they are
    still around,” he said. “I don’t know if I can find it on my own.”


    A few days into our stay, our driver took us aboard the Likoni Ferry inched the
    harbour to Diani. Cars and passengers were packed together on the same deck, which
    made it impossible for me to see much from my window except bodies and steel.
    The drive from Likoni to Diani was a colourful, moving scene of bright fabrics
    hung on clotheslines, market stalls set up with wares, children running barefoot
    in the dirt. Snapshot after snapshot of an everyday life that I could only look
    at through the lens of a foreigner, a tourist with a camera.


    Uncle''s home in Diani is palatial and set back on a cliff above the beach. The
    cool tile floors were a relief for my swollen feet. Before lunch, Dad, Uncle,
    Aunty, and I dropped down the concrete stairs behind their home and walked further
    south where the rocky beach meets white sand. We spread out our towels far from
    the reaching fingers of the Indian Ocean and deposited our hats and sunglasses
    on all. That was left to give in the pull of the water; we walked towards the
    blue-green, the sand like granules of sugar between our toes. I was eager to swim,
    not just to cool down; until now on this trip, I had only gazed at the ocean from
    the veranda of Mombasa Hospital when Dad and I went to see the maternity where
    I was born. There had envisioned Mom’s labour, her eyes squeezed tight as she
    bore to bring me into the world and gave me a first-class view of it upon my arrival.


    The Indian Ocean was 28.9 degrees Celsius. It was an invitation, unlike the Pacific
    twenty minutes from my home, where frigid waters, even in summer, cause me to
    tiptoe with dread. Along the shoreline, locals sold hand-carved keychains, hair-braiding,
    and glass-bottom boat tours. Looking back at the shore from the water, I thought
    about how a few days before, on the north coast’s Bamburi Beach, a local had approached
    us with dark objects in his hand. “Jambo!” he called. I returned the greeting.
    He held up keychains, souvenirs he insisted we buy to take back home. Dad had
    protested in Kiswahili, brushing him off politely as he could saying that we didn’t
    need souvenirs, that we were from there. After a minute or so of this back-and-forth,
    Dad ended away, turning his back to end the exchange. The man, still talking,
    followed. I caught the word “mzungu” aimed at Dad who is not a white man, and
    who, when asked where he’s from, has always answered “Kenya.” He stopped. I giggled.
    The vendor turned his gaze to me. From his swift, melodic river of Kiswahili,
    I pulled the word “ulaya.” He laughed when I said nothing in reply. Later, I asked
    Dad ulaya meant. “Europe,” he said. “He thinks you were raised in boarding school
    in London.” I treaded water, watching from a distance as Dad morphed into a child,
    splashing water and laughing, with his head tilted back, at whatever Uncle was
    saying. At a break in his laughter, I heard Dad Ask where the Four South cottages
    were. I looked at Uncle, curious. In all our floating, we drifted farther south,
    maybe a kilometre from his home. “Oh yeah, yeah,” Uncle said, squinting at the
    distant shoreline, shielding his eyes as he scanned the beach. He pointed. “We’re
    right in front of them.”


    “What?” I asked. Dad said nothing, pulled a few strokes to shallower waters, then
    stood on the sandy bottom, rising to his full height. The waves lapped at the
    backs of our legs, nudging us towards the shore. Palm fronds beckoned from the
    grassy slope just past the sand, sat a stark-white wooden bench with the words
    this property was purchased by a British family in 1966, there was nothing but
    some cottages and coral forest, and locating it was easiest by its coordinates:
    four degrees, twenty minutes south of the equator. Renamed, it became a popular
    vacation spot for folks like my parents, who honeymooned there in the plane 1977.
    A couple years later, they cradled me in their arms and boarded the plane that
    carried us to our new home on the west coast of Canada, fourteen thousand kilometres
    away. But they never stopped talking about where we came from.


    We walked as close as possible to the property without trespassing. I recognized
    the colonial-style cottages and the gardens. I had only ever seen them in sepia-toned
    photographs and here they were, a glorious green. Later that evening swatting
    mosquitoes in Uncle and Aunty’s backyard, Dad and I theorized about how we ended
    up there without meaning to. Coincidence? Mom guiding us down the beach, bringing
    us to where she once stood at the edge of her new life?


    On the same beach as Four Twenty South, over one hundred nests are laid by green
    turtles every year. Each nest can have up one hundred eggs requiring an incubation
    period of fifty to eighty days. A few days after hatching, the baby sea turtles
    begin an instinctual and perilous crawl toward the ocean. Of the thousands that
    hatch and set forth on this journey, dodging natural and man-made predators, many
    will not survive. During their slow migration to the waters, the turtles'' brains
    are imprinted with all the chemical cues they use. This information — the sand,
    the climate, the ocean currents — is recorded in their brains. Tests performed
    in captivity have shown that turtles can detect their X-Y coordinates via an internal
    compass. The female turtles who make it to safe waters travel thousands of kilometres
    over the next decade returning to their natal shores. Sometimes when the female
    returns, they miss the exact spot because the earth''s magnetic field shifts each
    year. That’s when they rely on those imprinted cues to bring them closer to where
    they are meant to be. Turtles go back to their birth shores to lay eggs because
    their mothers have passed on immunity to their offspring; the babies are better
    able to resist the parasites of that particular place.


    Mom did not pass on any such immunity to me. The night I got sick in Mombasa was
    I ate homemade ondhvo served around a group of women sitting on the benches outside
    the jamathana. Not a fan of ondhvo, but feeling grateful to be part of this impromptu
    gathering, I scanned for the smallest piece, then regretted it within minutes
    at the first rumble of my stomach. I excused myself from these ladies, whom I’d
    just met, who had welcomed me into their circle with their generous of Nanimaa’s
    unrivalled sewing skills, and walked the sixty-three steps to the flat in increasing
    discomfort. As I stumbled toward the bathroom, doubled over with cramps, my body
    said that, at least in this way, I was not from there.

