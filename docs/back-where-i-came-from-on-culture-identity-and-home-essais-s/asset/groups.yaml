    crisis (the number of asylum-seekers sweeping through Lampedusa in 2016 are staggering
    and heartbreaking). I countered: for a country with a diaspora the size of Italy’s
    to deny shelter to those in search of peace and potential prosperity is criminal
    and inhumane. As a kid, I adored her and preferred her company to anyone else’s,
    but then I reasoned that her older brother was a bully and her youngest brother,
    still a baby.


    Over lunch, she voiced a daydream that I would fix up my father’s home damaged
    in the 2002 earthquake — and spend summers in Molise. “What do you think? Is it
    possible?”


    Her husband chimed in to say the government no longer funded the rebuild.


    I contemplated an alternative life. Where one I could live the stereotype of Italian
    connectivity, holding huge feasts for family and friends, inviting everyone to
    stay for free in an idyllic setting straight from a Renaissance painting. I coveted
    the seductive surroundings — the emerald hills, golden wheat fields, and mackerel
    sky formation against turquoise as if God airbrushed the clouds himself.


    The ache in my chest was that ancient longing to thrum through the heart of humanity.
    We cannot survive without others. Even a hermit knows this, I’m sure. I visualize
    the venture: the ability to visit and tend to the graves of my beloved Nonna Femia
    and Nonno Gennaro whenever I wanted. To plant plants in the soil that fed my ancestors
    for a millennium, and more. To eat fresh figs, to turn into second, third, and
    fourth cousins during a stroll, to speak the language of Dante, flawlessly greeting
    everyone without dread lodged in my throat.


