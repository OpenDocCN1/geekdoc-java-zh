  mdcn: '


    “我出生了。”那天我的声音里一定带着某种什么；他动摇了，我们预订了八周后出发的机票。当爸爸的表姐得知我们要来时，她为我们提供了一间空闲的公寓，并提到那里新装修过，有空调，并且在我们入住期间会备好一瓶瓶过滤水。我对这些提议感到有些羞愧，那是对我们这种“外人”身份的微妙认可。但我并不打算放弃空调。我们大方地接受了。


    凌晨 2 点，当我的表姨和一名司机从莫伊拜国际机场接我们时，空气变得暖热而潮湿。当我们走向汽车时，我后颈的头发被汗水打湿了，回答着表姨关于带我们来到这里的三趟航班的问题。在车途中，我试图透过窗户观察我所能看到的一切，但看到的只有一片黑暗。安保人员让我们进入了
    Makupa 公寓，这是一个围绕着伊斯玛仪派集会堂（jamatkhana）建造的封闭式社区，但我不得不等到天亮才能真正看清这个我长大的地方——那里是我祖母住过的地方，也是我表亲目前仍称为家的地方。


    选好客厅旁的卧室并换上睡衣后，我拉开了床铺周围的蚊帐。我享受着近两天来第一次横平躺下的快感，但几小时后，我依然清醒着，听到了清晨的宣礼（azaan），一个男人的声音在黎明的空气中回荡，召唤着虔诚的祈祷。我感到干涩的双眼刺痛，泪水夺眶而出；我在家里从未在公共场合听过宣礼。


    我许是打了盹，因为我的下一段记忆是听到爸爸开合厨房柜门的声音以及燃气炉“嗒、嗒、嗒”的声音。尽管筋疲力竭，我还是进了厨房。我们用浓烈的肯尼亚茶和 Huseini
    烘焙店的 nankatai 饼补充了能量，然后坐在客厅沙发上，列了一份打算访问的地标清单：主要是家家、礼拜场所和学校。爸爸提到了迪亚尼（Diani）的 Four
    Twenty South 小屋，那是他和妈妈度蜜月的地方——也是我最喜欢的照片的背景。“如果那些地方还在，也许叔叔可以带我们去那儿，”他说，“我不知道自己能不能找到。”


    入住几天后，我们的司机带我们乘上利科尼渡轮（Likoni Ferry）穿过港口到达迪亚尼。汽车和乘客拥挤在同一层甲板上，这导致我无法从窗外看到太多东西，除了人身躯和钢铁。从利科尼到迪亚尼的沿途中是一段色彩斑斓、动人的景象：挂在晾衣绳上的鲜艳布料、摆满货物的市集摊位、光脚在地上奔跑的孩子。这是一帧接一帧的日常生活快照，而我只能透过一个外国人的视角去观察它——一个带着相机的游客。


    叔叔在迪亚尼的家像宫殿一样宏伟，坐落在海滩上方悬崖上。凉爽的地砖地板对我肿胀的双脚来说是一种慰藉。午饭前，爸爸、叔叔、婶和我走下他们房子后面的混凝土楼梯，继续向南走，直到岩石海滩与白沙交汇处。我们在远离印度洋触手可及的地方铺开毛巾，把帽子和墨镜放在上面。那些东西就留给海浪冲走吧；我们向蓝绿色的海水走去，沙子在脚趾间像糖粒一样。我渴望游泳，不仅仅是为了清凉；在此次旅行之前，我只在爸爸和我我去往我出生地的蒙巴萨医院产科门廊上凝望过大海。我曾想象过妈妈分娩时的场景，她为了将我带到这个世界而紧闭闭双眼，并在我降临时给了我一个关于这片世界（出生之刻）的绝佳视野。


    印度洋的水温是 28.9 摄氏度。这是一种邀请，不像我家二十分钟路程外的太平洋，那里的即使在夏天，冰冷的海水也让我恐惧地踮起脚尖。沿着岸线，当地人卖着手刻钥匙扣、编发服务和玻璃底船游览。从水上回望岸边，我想起几天前，在北岸的班布里海滩（Bamburi
    Beach），一个当地人手里拿着深色的物体向我们来。“Jambo（你好）！”他喊道。我回了问候。他举起钥匙扣，那是他坚持要我们买回家的纪念品。爸爸用斯瓦希里语抗议，礼貌地拒绝了他，并说我们不需要纪念品，我们就是那里的人。在这样拉锯大约一分钟后，爸爸离开了，转过身结束了交流。那个男人还在说话，跟了上来。我听到一个针对爸爸的“mzungu（外国人）”，爸爸并不是白人，而且当被问来自哪里时，他总是回答“肯尼亚”。他停住了。我咯咯笑。卖家转看向我。从他那流畅、旋律般的斯瓦希里语流中，我听出了“ulaya（欧洲）”这个词。当我没有回答时，他笑了。后来，我问爸爸
    *ulaya* 是什么意思。“欧洲，”他说，“他认为你是在伦敦的寄宿学校长大的。”我踩着水，远远看着爸爸变成了一个孩子，拍打水花大笑着，仰着头对着叔叔说的任何话回应。在他笑声的间隙，我听到爸爸问
    Four South 小屋在哪里。我看向叔叔，满心好奇。在我们所有的漂浮中，我们向更南方漂移，可能离他的家也许有一公里远。“噢，是，是，”叔叔说，眯着眼睛盯着远处的岸线，用手遮住眼睛扫描海滩。他指了指，“我们就在它们面前。”


    “什么？”我问。爸爸没说话，划了几下进入浅水区，然后站在沙地上，直起腰子。波浪拍打着我们的腿后部，将我们推向岸边。棕榈叶在沙滩后方的草坡上招手，那里放着一张纯白的木长椅，上面写着该物业由一个英国家庭于
    1966 年购买；那里除了几间小屋和珊瑚森林外空无一物，通过坐标定位最容易：南纬 4 度 20 分。更名后，它成了我父母这类人的热门度假地，他们在 1977
    年飞往那里度蜜月。几年后，他们将我抱在怀里，登了带我们前往加拿大西岸一万四千公里新家的飞机。但他们从未停止谈论我们来自哪里。


    我们在不侵入的情况下尽可能贴近那处房产走。我认出了那些殖民风格的小屋和花园。我只在深褐色调的照片中见过它们，而现在它们就在这里，一片绚丽的绿。那天晚上，在叔叔和婶的后院拍打蚊子时，爸爸和我推测我们是如何在无意间到达那里的。巧合吗？妈妈引导我们沿着海滩走，把我们带到了她曾经站在新生活边缘的地方？


    在 Four South 所在的这片海滩，每年有绿龟产下一百多个卵巢。每个巢可能有上百颗卵，需要 50 到 80 天的孵化期。孵化几天后，幼海龟开始本能而危险地爬向海洋。在成千上万出生并开启旅程、躲避自然和人为捕食者的途中，许多并没有幸存。在向水域缓慢移动的过程中，海龟的大脑中记录了它们使用的化学信号。这些信息——沙子、气候、洋流——通过进行的实验显示，海龟可以通过内部罗盘探测它们的
    XY 坐标。进入水域的母龟在十年后旅行数千公里回到出生地。有时母龟返回时会错过准确位置，因为地球磁场每年都会变化。这时它们依靠那些记忆的线索回到它们所在的地方。海龟回到出生地产卵是因为妈妈向后代传递了免疫力；宝宝能更好地抵抗那个地区的寄生虫。


    妈妈并没有向我传递过这种免疫力。我在蒙巴萨生病那个晚上，是因为吃了一些坐在集会堂外长椅上的一群女性提供的自制 ondhvo。

