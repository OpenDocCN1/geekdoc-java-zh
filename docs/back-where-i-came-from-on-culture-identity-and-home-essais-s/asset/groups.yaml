    roofs. Each body of water is still, I can''t tell if it''s salt or fresh. Yet,
    as we approach our destination, my anxiety surges. Throat tightens, vision blurs.
    “You’re fine,” Dad said. Then he too starts to feel it — a dizziness that surfaces
    as he drives. He opens the window.


    One afternoon two years ago, lightning shot through my spinal column, my heart
    jolted, and my scalp went numb. And then again, a few days later. And then every
    day. After a year, the panic mostly subsided, but left their memory hidden in
    my body like a dormant virus. Now I suspect this vertigo is just anxiety in another
    form, I still think the worst — a fatal brain tumour squeezing my inner ear, tilting
    the earth from its axis. This thought is also suspect.


    The highway terminates at a ferry dock and we park behind a long vehicle. The
    small vessels outlined, framed in blue layers — sea, mountain, sky. This fjord
    could be How Sound, birth a Gulf Island landing. Only the mountains are — the
    jagged, volcanic spine I’m used to, peaks with smooth edges, landforms mellowed
    by a longer geological lifetime. Then, just when the setting starts to feel familiar,
    it disorients. On the other shore of the fjord, we disembark and drive straight
    into a tunnel. The gears struggle, the car slows. It takes us a long minute to
    understand that, in this dark tube, we are climbing.


    We reach our rental by late afternoon, a cornflower-blue cottage on the edge of
    a lake. Everything is quiet and serene, the whitewashed walls close in. I swallow
    an Ativan and step onto the deck. Across the lake, fine waterfalls drizzle the
    mountainside, so they appear frozen. The tinkling of brass bells — goats grazing
    in the distant hills. The twilight air is damp. Calm flows my veins. Later, I
    burrow under a heavy duvet and drift into a dreamless sleep.


    In the morning, our Norwegian cousin Odd-Core arrives at our cottage to guide
    us to Sandane, the nearby village where he and his family live in my grandfather’s
    childhood home. He is a round-faced dairy farmer who speaks softly in English.
    We follow his car ten kilometres down the highway to a rural road, then pull up
    to a small white farmhouse. Beyond it, rolling fields are dotted with cows and
    framed by distant mountains. This'
