    Nothing had happened yet. But we could feel it, from the night we arrived. The
    tired, aching body of a city we arrogantly thought we still knew. Acres of air
    in front of us, dense.


    Tehran had changed. Of course, Tehran changed. It had been six years. Half-built
    buildings lay like surgical patients in the shadow of large cranes. Baba pointed
    at the new high-rises in disbelief. “Tehran has changed.” He stated the obvious.


    In the weeks that followed, I reached for the familiar, my finger poised on the
    window, looking for Waldo, for Kolah Gherhemi. Stray cats with patches of misery
    hiding under cars. The trees jutting out in the middle of streets. That old, abandoned
    Qajar-era house with dogs barking violently inside its prison of yellow bricks.


    Along the highway, my eyes would cling to the tops of trees and the illumination
    of billboards. Qasem Soleimani with a halo, thick twigs sprouting from his broad
    shoulders. Qasem Soleimani in the arms of the Prophet, his face invisible behind
    a bright white light. In a few short months, many of these, including the one
    where Soleimani’s head rests pensively in the crutch of his own curled palm, would
    be tor in the early hours of the morning, smoke blurring and breaking the sun’s
    arrival.'
