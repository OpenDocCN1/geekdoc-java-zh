    It grew louder. I recognized it as the voice of a woman singing, with dignity
    and confidence, “Tortillas! Tortillas! Tortillas!” I had forgotten what it was
    to live in a place where music was ever-present and how it smoothed out the rough
    edges of living in a country devastated by war. This was how I knew my country
    to be before the sound of gunshots rewrote my memories.


    My abuelita poked her head in to offer me some scrambled eggs and tortillas. “Yes,”
    I said, a child dependent on my elders for nourishment, “I’m ready to eat.”


    Their daily routine was uninterrupted by my arrival. By the time I dragged my
    jet-legged body out of bed, my grandparents had already drunk their coffee, eaten
    their eggs, and picked up pastries from the bakery. I ate what was left, feeling
    as if I entered the liminal space between adulthood and childhood, man and grandson.
    An adult, but also a grandchild entrusted to their care.


    The phone rang and my abuela awakened it. Sensing familiarity in her voice as
    she spoke to the person on the other end, I gathered my dishes in the sink to
    give her some privacy.


    “Someone wants to speak to you,” she suddenly said.


    I placed the dishes into the sink full of water and walked toward her. “Who is
    it?” I asked, sounding as if it — destabilized.


    She smiled and held the phone in my direction until I took it from her. To make
    things stranger, my abuelito got up from the table and stood beside me to listen
    in. “Omarcito!”


    My memory scrambled to recall why that voice was so recognizable. In my life,
    there are only three people who call me “Omarcito”: my mom, my grandma, and my
    nanny.


    “Uh… hi, Alicia… uh… I’m in El Salvador visiting. Where are you?


    I wasn’t sure what else to say. She quickly filled the silence by asking me when
    it would be best for her to visit. “I’ll make lunch,” she said. “I am so happy
    to hear your voice, Omarcito. This has been a dream of mine.”


    After I hung up, my abuelito explained Alicia had kept in contact with my grandparents
    after we’d moved, checking on their well-being, dropping off groceries, helping
    with house cleaning — all without the knowledge of my family. Even after all these
    years, and without any compensation, Alicia had been caring for them — and caring
    for us. “She always asked about your family and you,” my abuelito said. “I would
    update you about how you and your siblings were becoming Canadians and learning
    to speak English.”


    “I didn’t know,” I said guiltily. “Is she doing well? My Mom would be so happy
    to hear from her.”


    “Alicia has kept herself busy and her son is older now and helps her out.” And
    then, as if to reassure me, he said, “I know she’s going to be so happy to see
    you.”


    All along, Alicia had faded from our family’s collective consciousness, but she,
    in return, remained presently attentive to us. Standing in my grandparents’ kitchen,
    I felt the heaviness of our absence. Time and distance was no excuse; if anything,
    it was a reason to keep that connection alive. I knew I was undeserving of her
    warm and joyous welcome, the promise to nourish me again. I should be the one
    rolling out a feast for her, not the other way around.


    Alicia showed up with a bag of vegetables in one hand and a dead chicken in the
    other. I was repulsed by this lifeless, fully feathered poultry dangling from
    her hand, but my abuelito later explained, fresh chicken was an extraordinary
    gesture. As I watched Alicia prepare the chicken soup lunch, I was beginning to
    feel like Canada had protected me from seeing the whole reality of my homeland,
    much in the same way that grocery store chicken — neatly cut in plastic and styrofoam
    packaging — had obscured the reality of farming poultry.


    To my surprise, Alicia had barely changed from my last memory of her. There was
    not a grey strand in her hair or wrinkle on her face. It was only when she moved,
    slowly and deliberately, that I saw the mark of her age.


    And she was shorter than I remembered, but this said more about how much I''d
    aged after sixteen years.


    Sitting around the table and sharing stories, I felt like I was rewriting my own
    sense of history in real time. Our history is not just marked by war survival,
    as I remembered it to be, but generosity, loyalty, and hope. Alicia was a war
    survivor who selflessly took upon herself to ensure that vulnerable Salvadorians,
    like my grandparents, were still cared for, and she held tight to the belief that
    those who had fled from war would one day return. This meal was an act of gratitude.


    In that moment, I saw in Alicia the embodiment of what El Salvador special. We
    are the smallest country in Central America, but we dream big. We love deeply
    and sacrificially.


    My father knew that culture is lost when the language is forgotten, which is why,
    after we moved to Canada, he taught me to teach in Spanish and English concurrently.
    But there''s another language that''s just as important — an invisible language
    of yearning and belonging, composed of memories, pictures, emotions, smells, and
    the intangibility of connectedness to the soil your ancestors walked on. It''s
    not learned; it''s lived through. It''s the reclaiming of that was lost and holding
    it.


    Before she left my grandparents'' home, Alicia and I shared a long embrace. "I
    get to say goodbye to two times," she said, "but this time, I''m saying it with
    happiness."


    Alicia, our almost-forgotten family, had shown me at an early age how compassion
    can be more protective than walls and mattresses. How it can be more than just
    survival; it can be a bridge. It was a reminder that even when we are miles apart,
