    # Introduction


    This book was born from the mutual curiosity of two children of immigrants about
    the experiences of diasporic writers who’ve travelled back to their, or their
    parents’, or in some cases grandparents’, countries of origin. As writers ourselves
    who had journeyed back to our motherlands, we wanted to find the common threads
    between storytellers with an array of backgrounds, and where, and why, those common
    threads ended. Did they, like us, bump up against uncomfortable questions about
    themselves when they visited their ancestral lands? Did they return with a renewed
    sense of belonging, home, and identity? And could we artistically represent these
    narratives, give them their rightful space in English literature, and shed some
    light on the joys and struggles of being both “here” and “there”?


    We put a submission call to the writing community and received many submissions.
    We envisioned an anthology that would showcase the diversity of human experiences.
    It was clear that stories of travel would include many different angles; in "Flight
    Paths" Omar El Akkad recounts his life of his father’s death, while in "Deployment"
    Christina Hoag shows what it’s like growing up third-culture kid with privilege.


    At a time when the discussion about rights to lay claim to a land is in the spotlight,
    when people are paying attention to the diversity of human experiences, we are
    proud to add context and nuance to the conversation. This is a book of writers
    we, the editors, now live, have come back to their own history. In this spirit,
    we hear Alison Tedford Seaweed, a member of the Kwaki First Nation of northern
    Island, who experiences a homecoming that deepens her Indigenous identity, and
    Israeli-Canadian Lishai Peel, in "Mother. Land.," who finds her way back to her
    mom and homeland after distancing herself from her government’s "violent occupation—there
    was no escaping the person who made me."


    The "The Motherland Knows My Name" by Alexandra C. Yeboah shows she is not African
    enough. Ayesha Habib, "What Remains of Home," acknowledges the complicated history
    of India under Britain. Nhung N. Tran-Davies makes "The Journey Home" to Vietnam
    with her mother through a medical school opportunity and returns with greater
    knowledge of her mother’s background that answers questions about her own upbringing.


    "Chicken Soup and Tortillas" by Omar Reyes is an endearing tale of Salvador. "The
    Land Remembers All of Its Children" by Hannah Zalaa-UulI names Mongolia "four
    degrees, twenty minutes south" no how long she has been away. The title for this
    book is meant to be a little tongue-in-cheek, a response to the not-so-creative
    directive hurled at immigrants (or perceived immigrants) to go back where they
    came from. Here are twenty-six writers who did just that and returned with an
    array of profound and complicated and funny and magical stories to tell. We welcome
    readers to lands far, far away and to places deep within our ideas of who we are,
    where we belong, and what “home” means to us.

