    place passed down from his grandfather — my grandfather’s oldest brother. We are
    astonished to see that the property and house, even the mountain view, are nearly
    identical to the Fraser Valley hobby farm where Dad was raised in the house built
    by his father.


    Cousin takes us to the village churchyard, and we find our last name, rare in
    Canada, on dozens of gravestones. In Norwegian, our name means isthmus, or more
    precisely, “the land between lake and sea,” which is where this town lies — between
    the northwestern shore of Bremsvatnet Lake, where we are staying, the fingertip
    of Gloppenffenjorden. Some part of us belongs to this sliver of land, has belonged
    here a long time. The idea is both comforting and confining.


    After a few days in the village, stillness settles into my body. Then my vertigo
    picks up again, like a maelstrom gathering force.


    Odd-Kore’s older sister arrives from a nearby town, curious to meet us. When she
    sees my father, she begins to cry. "He looks just like a favourite cousin’s recently
    died," she explains through tears. Dad doesn’t know what to do with this. “Ja,
    ja,” he says, nodding. “Ja, ja.” Throat catching, eyes watering — as though he’s
    the ghost of cousin, as though he’s a man whose father left his country.


    “Let’s hit the road,” Dad says. Back home, he’s an amateur historian known to
    make new friends on eight-hour driving tours around B.C. — no charge, for pleasure.
    But in Norway, his usual social self is tamed. Before our visit with our cousins
    is through, he’s eager to say goodbye to these living links to his father. Dad
    was a boy who lost his father at thirteen, his mother at seventeen.


    (I nearly lost Dad when I was fourteen, a fact I’ve half-submerged in my memory’s
    depths. His months-long illness, the guilt-stained relief each time I exited the
    hospital into the soft spring light, my mind turning to listen to music or books
    — anything).


    The spoken Norwegian contains a word that’s an inversive sound — a quick, inhaled
    “ha!” It’s an exclamation of incredulity, or an affirmation that one is listening,
    as English speakers might insert “wow” or “uh-huh” as someone tells a story. Sometimes
    the word is soft, barely audible,


    sometimes it is startling, like a drowning person breaking the surface to gasp
    for oxygen. I jump when our Norwegian cousins unconsciously use it as they speak
    English. This sharp inhale becomes a family joke — my father''s, my sister''s,
    and mine. Although, in the privacy of our rural cottage, we use the way we understand
    it — to scare each other.


    I''d always thought Dad was just being pessimistic when he''d say, “I’m dying.”
    I thought it was mortal dread from his parents'' deaths, or residual trauma from
    his real illness years ago. Hypochondria, our mother taught us young. No one said
    anxiety disorder in the eighties. Nobody panic attacks. Only recently did I realize
    my father might actually feel those pains — the lung squeezes, the lightning strikes.
    I understand now because I’ve arrived at the emergency room, believing I was near
    death, and completely wrong.


    Before my grandfather boarded a ship to Canada, my great-grandmother pointed out
    a young pine on the family property and told him that son was his tree. My grandfather
    embraced the tree and swore that he’d return to measure his absence with his arms.
    As we say our goodbyes, Odd-Kore tells us this story and describes the tree. On
    the road back, we find standing tall, the only pine among the remains of its felled
    neighbours. My grandfather never returned home, never saw his parents and siblings,
    his country. Ninety-five years later, his son and granddaughters complete his
    journey. Dad wraps his arms around it when I take photos. My father’s eyes are
    wet, but his face won''t tell me anything else.


    We drive south to Bergen, where Dad’s mood lifts as we stroll the harbour and
    ride the funicular up the mountainside. My vertigo must be subsiding because I
    keep myself, "Do I feel it, do I feel it?" — like a teenager after her first beer.


    We’ve planned to visit other Scandinavian highlights, so we fly to Copenhagen,
    where the land is flat and sun shimmers across the canals. September rushes towards
    October. In Stockholm, rain falls in fat, cold drops. The vertigo has finally
    left my body.


    On the final day of our trip, we’re walking to the Stockholm metro to go sightseeing
    when Dad stops, clutches his chest, says he feels weird. “It’s a panic attack,”
    I tell him. “Breathe.” My sister and I each take an arm and walk our father back
    to the Airbnb, where I bring him Ativan and chamomile tea. I turn on Swedish television
    and we sink into the sofa in a strange family’s home. I''m still worried something
    worse than anxiety is wrong with Dad. Then I realize he must be exhausted from
    the trip, from being confronted with the past, from keeping up with his daughters.
    Maybe homesickness has infected his body like a cold.


    The next morning, we head to the airport to trace our route home to Vancouver.
    When the Fraser River and jagged Coast Range come into view, and we’re minutes
    from landing, all three of us lean toward the tiny airplane window and anticipate
    the ground.


