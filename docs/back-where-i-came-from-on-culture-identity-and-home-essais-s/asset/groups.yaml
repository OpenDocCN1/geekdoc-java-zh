    Six months later, after a visit to Mumbai, I found myself lounging in Chhatrapati
    Shivaji Maharaj International Airport, reflecting on my love for this city. There
    was something about its rhythm, about its home-ness, that instantly picked me
    up in its joy, making me want to stay.


    As I sat there, waiting to board my flight, begrudgingly yet another departure,
    it hit me: I had just graduated from university and I had paid my dues by giving
    “living in Canada” thing a chance. Why don’t I try to get a job here, rent a flat,
    and see how it goes?


    Suddenly, leaving seemed the most irrational thing to do. I called my mom, convinced
    I was about to make the wrong choice by getting on the plane. “Are you sure its
    a good idea for me to get on this flight?” I asked her. “What am I even waiting
    for?


    My mom tried to reason with me. “Get the job and then you can go back,” she said.


    But I reasoned back: how will I get a job if I’m in Canada? It''s always easier
    for companies to hire locals. “Why don’t I just get an apartment and see how it
    goes for a few months?” I said.


    “You know how much an apartment costs in Mumbai?” I conceded that I should plan
    this out better, then I boarded the flight, but before buying two extra vada pavs,
    just in case it would take me extra time to taste my favourite street food again.


    It wasn''t until my visit to India six years later, while sitting in the back
    of a black-and-yellow taxi in Mumbai, that I looked around the city, and for the
    first time in life, I didn’t feel an urgent need to stay.


    I still felt at home and an overwhelming sense of love for the city, but I also
    felt a strange sense of acceptance with living elsewhere. To this day, I don’t
    know what caused me to finally relax. Maybe it was because my surroundings were
    different for many years by point, that the tall trees and Gothic buildings of
    Mumbai felt removed from my everyday life. Maybe it was because now that I missed
    Canadian things in India, while still missing India in Canada.


