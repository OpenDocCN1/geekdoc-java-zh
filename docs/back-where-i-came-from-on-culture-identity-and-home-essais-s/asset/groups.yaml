    The last time I had been to Iran had been six years before, when I was twenty,
    long-haired, and singing for a crowd at my cousin’s wedding. I was a good daughter.
    I was not a mismatched body. There is a photo of me wearing a long, pastel dress
    at the wedding, a photo my mother often returns to, brimming with longing. She
    strokes the sides of my pixelated face. She says, “The evil eye was on our family
    that night.”


    It is my way of imprisoning. Making it doesn’t get away. This is what life made
    of my mother’s expectations: loss, loss, loss. A new country overnight. The disappearance
    of neighbours. Lonely winters. The evil eye. She’s learned to hold on to the body
    like an anchor. She asks questions. She begs it to remind her of everything she
    once possessed.


    She is not nostalgic, she cannot help it.

    Neither can I.


    “Tenses,” Audre Lord says, “are a way of ordering the chaos around time.” We place
    ourselves in one moment, then another. We move forward and back. We remember what
    we used to be. We trace the path of what could. The body, then, is perhaps a way
    of ordering the chaos around grief. We see the scars. We remember what we used
    to be. We trace the path of what could.

    We understand distance as a feeling.


    I haven''t yet asked to look at the pictures Rou took of my pre-mastectomy body.
    I have not wanted to look back, afraid of what I’d see. I can sometimes believe
    I am brand new now, that I am no longer all I am attached to. I can tell myself
    stories.


    That summer did not disappear the cratered distances within my family. But it
    did allow us to stand in the dark. There, where there is only the body. Where
    one learns how far forgiveness can stretch, how it holds infinite shapes.


    How it becomes connective tissue.'
