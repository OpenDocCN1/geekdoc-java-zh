    ## 在我家乡的经历


    “你要去参加周五祈祷吗？”我祖父母的照顾者阿玛尔（Amal）问我。我看着坐在阳台上的奶奶（Teta）和爷爷（Gido），思考着我的选择。我昨晚刚到，觉得现在还太早去冒犯长辈并开始关于我自己的——那个异教徒加拿大人人——的传言，所以我说好。“很好，”她说，“我会给你留一些热水，这样你就可以小净了。”


    反正，一天的旅程后我需要清醒一下，而且渴望探索家人的故乡，这是我从未做过的事。这是我八年来第一次去黎巴嫩，也是我成年后的第一次。大学刚毕业时，我计划在之前的夏天留在这里，看看凭借两所不同学院的两个证书和几乎没有的生活经验，我到底能做些什么。如果时间允许，我准备好多留一年。但在我起飞前的六天，即2006年7月12日，真主党武装分子与以色列爆发了战争，以色列政府以意料中的残忍手段进行报复；除了杀害平民和消灭整个家庭，以色列国防军还针对了平民基础设施，包括贝鲁特拉菲克·哈里里国际机场的跑道——该机场是为了纪念他的首相命名的，而他被一名怀疑有叙利亚背景的真主党特工暗杀。因此，那个夏天我花时间自学中东历史，为一年后重新安排旅行做心理准备，并读了另一门课程——这是我三年内的第三门。


    人们说我还要要去简直不是疯了就是勇敢，但如果不是那个夏天，还能什么时候？我同意，情况可能会在我好转之前变得更糟——但当我仍然作为一个游荡的年轻成年人，深信我隐藏的潜能潜伏在故乡时，情况会好起来吗？好吧，至少离开前把胡子刮了，在我离开前，一位叔叔建议道，他担心我会被误认为是什叶派——即真主党同情者——特别是在卡布·埃利亚斯（Kab
    Elias），那是我们位于黎巴嫩山脚的一个以逊尼派为主、带有一些基督徒社区的地区。我告诉他绝不；从九年级开始，胡须就是我的特征。它代表了我自豪的中东身份，反抗任何无论是开玩笑还是真的叫我恐怖分子的人；而且如果我对自己诚实，也是反抗我未能拥抱传承的失败。戒酒和学习阿拉伯语很难，但我仍然可以通过基本的理容管理来区分我的阿拉伯人身份。


    降落在贝鲁特后，这种建议还在继续。在前一天晚上从机场回来的路上，我的叔叔和堂兄弟们就对我的胡子指责了我，在阳台上我又听了来自阿玛尔和祖父母的教诲——这增加了我洗脸出发的动力。


    挎包里装着一台轻便的数码相机和一个笔记本，我向他们告别。我从未打算参加周五聚会（Jumah）；我计划是看看他们，重温童年记忆，并在祈祷结束后回家。


    我的首要任务是买香烟，价格只有加拿大的几分之一。我站在一个看不见柜台的小男孩后面，但他能为他父亲买到一包维斯罗（Viceroy）香烟（希望如此）。我自己并不认识任何品牌，轮到我时要了同样的。店员我模糊记得是个远亲，卡罗米（Karomi），他说：“你是艾哈迈德·穆阿莱姆（Ahmed
    Moualleem）的，”接着开始提醒我七年级时有多胖。“看看你。你瘦了。”卡罗米用指关节划过脸颊。“这是什么？你长得像个恐怖分子。”我们对此大笑，并在我有限的阿拉伯语允许范围内聊了许久，然后我就出发了。


    我没走多远就遇到了哈桑（Ghassan），另一个远亲，他以前拥有一间台球室和游戏机厅。有一次，当他看到我在店里转悠时，我的脚从拖鞋里滑出，落在一个尖利的生锈簸箕上，被割开了一个口子。哈桑赶紧送我去医院缝了伤口并打了破风针。十五年后，这是他关于我记得的第一件事。我提议给他看那个伤疤，但他正忙着找他的猫，那只猫太美了，以至于哈桑相信有人偷走了它。


    我建议他打印一些她的猫的海报并提供赏金。哈桑喜欢这个主意，并请我帮忙制作一些海报。他带我进家里，从他儿子的电脑里选照片。当他儿子启动电脑时，我扫视了那个青少年卧室的墙。在巴西足球之星的海报中，有真主党领袖哈桑·纳斯斯拉（Hassan
    Nasrallah）高举拳头的照片。天花板上挂着三面旗——黎巴嫩、巴西，以及黄色的真主党标志，上面代表安真拉”的A字母指向一把机枪。在一年前或多以前，你在什叶派家里外面永远看不到这些装饰。我在卡布·埃利亚斯的大多数、不是所有的亲戚都有拉菲克·哈里里或他放荡的儿子萨阿（Saad）的画像。纳斯斯拉对他们来说是个寄生虫。2006年的战争正在改变他的公众形象。感到毛骨悚然，我想离开，但我必须先忍受一百张他猫的照片，每次都必须赞美它有多漂亮。祈祷声仁慈地介入了。哈桑提议带上我一起去清真寺，但我说我需要先回家小净。


    “快点，”他说，“时间不多了。”


    在出去时，我看到了另一张纳斯斯拉的照片，它被框着，挂在大多数人放家庭照片的地方。哈桑抓到我正盯着它看，温柔地笑着说：“你戴着眼镜留着胡子长得真像他。”


    我潜入了在交通流中穿行的祈拜者人群，然后在……之前的最后一个路口溜了出来。


