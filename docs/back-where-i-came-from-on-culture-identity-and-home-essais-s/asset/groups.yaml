    # What Remains of Home


    I''ve been thinking about pigeons lately. No matter how far you take one from
    its birthplace, it will find its way back home. It''s one of the many mysteries
    of nature, an instinctual, primal urge in their souls. A pigeon only knows one
    home; it knows where it belongs.


    Sometimes I wonder if humans were designed with that same conviction, that same
    absoluteness of home. Somewhere along the way, in the eons of evolution and migration,
    we''ve forgotten, and in our confusion we ache for a primal sort of belonging.
    I wonder if it''s this forgotten instinct in my blood that pulls me back to my
    childhood home in the moments I feel the most homeless: when my melancholy was
    born, when my innocence rotted into bitterness, when my father died.


    It was innocence and pure belonging.


    I was born in Nairobi, Kenya, as a third-generation Indian Ismaili. My childhood
    was rust-red roads and exhaust fumes. It was torrential rainfalls that left as
    quickly as they arrived and constant power outages. It was searching for fairies
    in our garden and watching the birds build nests in the trees outside my window.
    It was monkeys that once got into our kitchen and stole all of our fruit, and
    lizards that scurried up walls and sometimes dropped to the ground or on top of
    our heads. It was Swahili and English and Gujarati and Kutchi. It was fresh chapati
    off the stew and meat on charcoal barbecues and samosas and biryani and ugali
    and tandoori. It was at khanana (mosque) every Friday evening and Ma and Ba''s
    (my father''s parents) house every Sunday morning.


    I was nine when my father''s work as a banker took us to Dubai. There, I saw my
    mother cry for the first time, homesick for the world she had known all her life.
    My own melancholy stirred inside me during this time. I was growing, but not proportionally
    gracefully. I was lanky limbs and buck teeth and inflamed acne and a dark, fuzzy
    moustache. My peers, who came from all around the world, seemed crueller than
    the friends I left behind. I was teased for many things: my quietness, my glasses,
    my frizzy hair, my hairy legs.


    At barely eleven, I was becoming bitter, an outcast. I wrapped myself in the only
    good memories I had, which were all in Kenya. Even though I was still a child,
    I romanticized the idyllic haze of childhood. I constantly daydreamed of my return.
    In my head, everything I hated about myself would go away once I was back home.
    My skin would become smooth, my hair sleek, and my secret beauty would finally
    arrive. I would be graceful and confident and loved by all.


    A year later, over summer vacation, we visited Kenya — my father, mother, brother,
    and me. I returned heavier in my heart when I left, but I was happy, nonetheless.
    We returned to the familiar places, and even though it hadn''t been very long
    since we''d left, I adored every space like it had been a century. We visited
    the food court in the mall, where we once owned an Indian-Kenyan fusion outlet
    and that now had new owners. They retained the old menu, but the food tasted bland,
    like cut-corners and cheap ingredients. Then, at my request, we went to the giraffe
    centre, where we could feed rescued giraffes by hand. My love for animals had
    only grown since leaving Kenya, and, in returning, I felt, more than ever, an
    almost spiritual connection to all the creatures of this land. I often daydreamed
    of acquiring the ability to speak to animals, and secretly believed that this
    power would one day present itself, and confirm, with a spiritual sense of absoluteness,
    that I belonged to this world. I tried, telepathically, to urge the giraffe to
    understand me, to see in me a sense of kinship and love. Instead, I only received
    a slimy tongue, coiling around the treats in my hand.


    We visited our old home with permission from the new owners, an elderly English
    couple. It was smaller than I remembered. It smelled different, though I could
    not quite place how. I walked through familiar rooms filled with unfamiliar furniture.
    There is a word for that surreal feeling of existing in a space that is both home
    and unknown? Still, my return trip only solidified my conviction that Kenya was
    my true home, that any other place I lived was only temporary.


    It''s been fifteen years since we left. I haven''t been back since.


    I was twelve when my father uprooted us again and took us to Canada. This time,
    to start the grueling process of permanent residency, then citizenship. We settled
    in a North Vancouver neighbourhood, becoming one of the only non-white families
    on the block. It''s here that I would see my father cry for the first time. It''s
    here where I would witness my family''s downfall.


    There''s a specific sadness in watching your parents awkwardly navigate new homes,
    new social situations, new ways of talking and being. Aside from a few relatives
    in Canada who could never truly connect to, they were unfriendly. My father left
