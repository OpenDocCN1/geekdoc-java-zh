    # Ah-Ling Ge Lui

    Fan Lai La! Ah-Ling’s

    Girl Has Come Home


    2018

    The smell of brine fills my nose as the ferry pulls up to the 長洲 Cheung Chau pier.
    A sailor in a navy blue uniform with white trim tosses a mooring rope around a
    dock bollard and brings us in. I disembark, heavy-legged from a trans-Pacific
    red-eye flight and fifteen-hour time difference. Push through a crowd of people
    in business attire and school uniforms boarding the ferry for its next sailing
    boat to Hong Kong Island.


    My feet know the way from here. They carry me straight through the plaza, right
    at the dim sum restaurant, down past the hardware shop and hairdresser, and around
    the corner. I stop to wave at the neighbour smoking cigarettes and hanging her
    laundry, reach over the waist-high, brown metal gate and let myself in. But this
    time, I don’t know what to expect. Pau Pau, my maternal grandmother, passed away
    four days ago, and I’m here with my parents and sister for the funeral.


    My mother, Ah-Ling, was born on a tombolo named 長洲 Cheung Chau, literally “long
    island,” one of Hong Kong’s 263 outlying islands. The majority of Cheung Chau’s
    seventy thousand inhabitants live elbow-to-elbow on the flat part of the island,
    between two rocky hills at the northern and southern ends. Three-storey walk-up
    apartments are so close to each other that you can watch your neighbour’s tv.
    Laundry flaps on rooftops. Sampans and fishing boats jostle in the harbour. The
    outdoor seaside'
  - '[PAGE 32]


    restaurants are popular weekend destinations for local tourists. Save for specially
    designed miniature ambulances and fire trucks, no cars are allowed on the island;
    the streets are too narrow and crowded with people: Indonesian and Filipina domestic
    helpers pushing grandparents in wheelchairs; weekend tourists canoeing on rented
    bikes; dock workers hauling all manner of goods on rackety dollies. The island
    is known for its street snacks (especially fish balls), and as home to the treasure
    cave of nineteenth-century pirate Chung Po Tsai. My grandfather, Gong Gong, was
    born on the island into a farming family. Pau Pau was urban, born into a family
    of steworkers on Hong Kong Island, the centre of the British colony, in a district
    called Sai Ying Poon, once a fishing port and the British military’s first base.


    On one visit back to Hong Kong for a cousin’s wedding, my sister and I went to
    Sai Ying Poon looking for Pau Pau’s childhood home. We arrived at the address
    given by our uncle to be greeted by the breezy indifference of a sleek luxury
    apartment. How naive of us to think we might find some fragment of connection
    to an ancestral home that had twice replaced. Later, we sat at a bar overlooking
    the street sipping on a beer called gwai lo (literally foreign devil, meaning
    foreigner or white guy). On another visit, a few months later, a friend and I
    stumbled upon Tuck Chong Sum Kee Bamboo Steamer Company, a shop making bamboo
    steamers the traditional way. Stepping inside, we watched the maker work, tucked
    between steamers stacked up to the ceiling. He used his bare feet to hold one
    end of a piece of bamboo while he wrapped the other end around a frame. Some of
    them were stamped with the name NEWTON BAKERY, a Chinese Filipino bakery and restaurant
    I’d eat at countless times in Vancouver’s Chinatown. A place where I shared conversations
    with other diasporic friends about Hong Kong, our grandparents, cultural identity,
    the future of Chinatowns. Ten thousand kilometres of distance and differences
    were knotted together in an unexpected moment of connection.'
  - '[PAGE 33]


    I’ve made the journey at regular intervals throughout my life. Sometimes with
    family, sometimes with friends, sometimes solo. Growing up in a middle-class,
    semi-diasporic family, we travelled internationally only to visit the homeland.
    No Disneyland or Caribbean resorts. It was either road trips, motels, and car-camping
    in Western Canada or a fourteen-hour overseas flight to one of the most densely
    populated cities in the world. When we would visit Hong Kong on summer holidays,
    our home base was always Pau Pau’s house on Cheung Chau.


    The first time we visited, I was five years old and my sister was one, plane tickets
    came in special envelopes, and meals came with silverware. I remember being embraced
    by clouds of diesel and the smell of hot garbage as we stepped out of a taxi at
    Central Piers on Hong Kong Island, lemon tea and instant cup noodles on the ferry
    to Cheung Chau, the narrow streets of my mother’s birthplace.


    My Canadian-born senses had no point of comparison for the whole pigs hanging
    with their snouts in the open storefronts of boutiques. But I was enthralled with
    the shops bursting with bright plastic beach toys and the latest Twin Stars and
    Hello Kitty stationery. In every photo, chubby cheeks flush, bangs stick to my
    sweaty forehead, and the tower above my Hong cousins. I don’t know if it was to
    save dishwashing water or Pau Pau had a designated mug for each of us in her living-room
    drawer. We were not to drink out of anyone else’s.


    # 2018


    My family is out for a hike around the island’s mini Great Wall. It’s ten days
    since I last washed my hair, and my scalp itches in the mid-morning sun. My mother,
    sister, and I are observing a Chinese custom where you stop washing your hair
    from the day someone passes until their funeral rites are completed. For the last
    ten days we’ve been folding gold and silver paper into ingots, to burn as offerings
    at Pau Pau’s funeral. My great-aunt drops by every day to check on us, popping
    over from the corner store she owns and lives above the street. Other than that,'
- md: '

    have been no visiting relatives, no sight-seeing, no shopping. So instead, we''re
    out for a hike. The sky is a brilliant blue. There are no swimmers in the water
    today. We see the aftermath of Typhoon Mangkhut: streetlights tilted at jarring
    angles, the paved road leading to the helipad twisted metal and broken concrete.
    Had the road not been twisted up, this is where Pau Pau would have been transferred
    out of the ambulance to be flown to the bigger hospital on Hong Kong Island. They
    had to drive her to a sports field to catch the helicopter.


    I always assumed my Pau Pau never saw me as Chinese. With my barely passable Cantonese,
    with mixed-racness, my gwai lo father, with Canadian upbringing.


    My first-generation Hong Kong immigrant mother and fifth-generation Irish-Canadian
    settler father didn''t know how to raise us to talk about race. Were we raised
    to really think of ourselves as Chinese. I''ve often wished I could be better
    at thickening my skin to the mixed messages I''ve internalized about my identity.
    In elementary school, I couldn''t keep up with my Cantonese-speaking classmates
    on the playground. Yet I''d go to after-school Chinese calligraphy class and Chinese
    summer camps, and most of our meals were out in Edmonton''s Chinese and Chinatown
    restaurants. As an adult, many a white stranger compelled to tell me about their
    Asian wife or trip to China, before learning anything else Chinese. Chinese relatives
    sometimes ask if I can use chopsticks. Sinophiles have boasted about how many
    Chinese characters they''ve memorized, and expressed surprise that I have far
    fewer in my repertoire. Fellow Chinese diasporic friends have let me know that
    I''m not really Chinese because my parents didn''t keep their extra garbage bags
    in the dishwasher, or don''t know the difference between how to pronounce mustard
    (gaai laat) and greens (gaai aan). As an adult, I''ve had white colleagues in
    a workplace lunchroom wrinkle their nose at my tofu.


    When I was in my mid-twenties and had just finished my undergrad, I decided to
    take my savings and journey “back” to the motherland. I thought it would be a
    way of rooting myself, to find my way out of the cloud of identity confusion and
    discomfort in my own skin that had been experience as a mixed-race Asian woman.
    To help me self-locate in relation to living in settler-colonial Canada, the place
    I called home, as a non-white settler, whose ancestors had migrated from other
    British colonists, bought a one-way plane ticket to Hong Kong, and made a loose
    plan. I''d live with Pau Pau for a while, learn more Cantonese and Mandarin, maybe
    find a job, maybe volunteer on an organic farm, and in doing so, voila! I became
    more Chinese. My mother arranged that I would pay Pau Pau a small amount each
    month for “electricity.” I hung out for a few months and overstayed my welcome.
    I thought I had designed a self-directed, study-abroad session where I would learn
    from my elders, connect with my roots, and reclaim my culture and language. Instead,
    it was awkward, fumbling time, filled with conflict. I was scolded for the way
    I did laundry (not frequently offensive), for the way I once rested my chopsticks
    on a bowl (upright offensive). Almost daily, Pau Pau would ask, “Why are you here?”


    One month into my sojourn, with Lunar New Year approaching, Pau Pau handed me
    a lycee, a red envelope stuffed with several crisp Hong Kong banknotes. She shooeded
    me out of the house, urging me to go haang gaai 行街 — to go shopping/to go for
    a walk — to buy new clothes for the new year. I wandered down the street to one
    of the boutiques and picked out a cozy navy blue sweater with white polka dots
    and a row of buttons down the back. I got home and pulled it of its crinkly pink
    plastic bag, proud to show her. I''m doing it! Living my culture!


    Her face fell and she sighed loudly, “Ai ya!”


    I had no idea what was going on. She picked up the phone and jabbed in the fourteen
    digits of a long-distance number, muttering, “Your mother didn’t teach you anything.”


    “Wai?” My mom’s sleepy voice answered. It was midnight in Edmonton.


    Pau Pau spoke rapidly to my mom, intermittently waving her crooked finger at me,
    then handed me the phone.


    My mom explained, “For Chinese New Year, you need to wear lucky colours — red,
    pink, even purple would be okay. But you chose the most unlucky colours. Blue
    and white. These are funeral colours.” I couldn''t have done any worse.


    Pau Pau got her change purse, her umbrella. We were going out. She marched down
    the street to another boutique and jabbed her umbrella at the entrance, telling
    me to go in. I stepped through a heavy plastic curtain, and my eyes landed on
    a bright red sweatshirt jacket. I tried it, and the sleeves came halfway up my
    forearm — I was pretty sure it was not meant to be three-quarter sleeves that
    fit my (relatively gigantic and broad-shouldered) Canadian frame. I glanced at
    it, looking for Pau Pau. She nodded her gruff approval.


    Good enough. *Oh well, I''ll just roll them up.* I bought the sweatshirt. We walked
    around the corner to her favourite wonton place for a quick, affordable dinner
    of steaming wonton meal. All in all, a successful outing.


    On the way home, we passed balconies illuminated by firelight; who still observed
    the traditions were burning paper money in red tins to welcome the new year. We
    bumped into a neighbour pushing a little dog in a shopping cart. We exchanged
    red envelopes, “Sun tay gi hong!”— wishing you health and happiness. The dog put
    its paws together to wish a happy New Year.


    # 2018


    The night before Pau Pau’s funeral, we can''t sleep in the eerie emptiness of
    her apartment and so my sister, my father, and I walk with my mother to one of
    the island’s plazas. Inside, of a large white funeral tent that has been set up
