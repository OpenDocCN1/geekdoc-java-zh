    Mombasa in 1979, my first language still sounds like Mombasa, my mishkaki, masala
    potatoes, and mahamri barazi taste like Mombasa, my oodh perfumes smell like Mombasa.


    Though Mombasa has lived inside of me for decades, I’ve never felt certain that
    I exist anywhere in it, whether my osmotic nostalgia is strong enough, or authentic
    enough, for me to slip back into my birthplace and a part of it.


    At the beginning of 2019, I was rummaging through a box of my mom’s albums, looking
    for images for a family history project, when I came across an 8.5 x 11 page,
    folded in thirds. It was a printout of an email addressed to Dad, dated August
    2005, from his best friend now living in Dian Beach, across the harbour from their
    hometown Mombasa. Uncle wrote about how sorry he was to miss his graduating class’s
    upcoming reunion in Calgary and urged Dad to come back. “Bring your children,”
    he wrote. “So they can see for themselves . . . the places where we spent our
    simple but very happy childhood days.


    It wasn’t the first time I came across the letter, but the timing of finding that
    day felt significant; I’d been talking to Dad for months about going to Mombasa
    together. Dad was always noncommittal whenever I brought up a return, unconvinced
    seeing his old home was a good idea, despite his fond memories. Friends and relatives
    who had gone back for visits reported everything had changed. Mom would shake
    her head and cluck her tongue, the telltale sign of her disappointment, whenever
    she’d hear this. My parents never went back.


