    # Such a Pity, Senhora


    I had my ears pierced when I was three weeks old. Not that I remember, but my
    mother talked about this often, and offered it as an explanation for my fascination
    with earrings from a young age. Apparent, when I was two years old, I asked Santa
    for a pair of earrings, and I squealed with delight when I opened it at Christmas
    Eve. That whole scene has become part of our family lore.


    When I arrived in Canada at the age of seven, I learned that not all girls got
    their ears pierced as babies. Many of my friends in elementary school told me
    their parents wouldn’t allow them to get their ears pierced at all, even in Grade
    5 or 6.


    “Huh,” I used to say. “Why not?”


    When my daughter was born, though, my Canadian husband and I decided that we would
    not inflict this Portuguese cultural tradition on her. Instead, we would wait
    until she voiced her own desire to have her ears pierced. I sensed my mother was
    disappointed, but she didn’t say much.


    “Can I give her a gold chain, then?” she asked. “Sure, we’ll keep it for when
    she’s older,” I said. “Because I think it’s kind of dangerous. I mean, what if
    it catches on something and she chokes?”


    My mother reminded me that my sisters and I had all worn gold chains from the
    day we were born, and we had never choked, but “it’s up to you,” she said. “I
    don’t want to be responsible if anything happens.”


    These traditions involving jewellery seemed trivial to me. What I thought was
    important for my children to grow up with a strong sense of their Portuguese heritage.
    I felt we could foster this by taking them to Portugal'
- md: '

    early in their lives, and then often as possible. That way they could learn the
    cultural norms in the proper context, I reasoned. My husband agreed.


    On his first sabbatical leave as a university professor, Eric decided he would
    conduct research in New Zealand, so our family moved there for most of the year.
    Afterward, he would be writing scientific papers based on that research, and he
    could do that from anywhere. “Why don’t we go to Portugal?” he offered.


    We decided to spend three months on the home island of São Miguel, in the Azores,
    the Portuguese archipelago of nine islands located in the Mid-Atlantic. It would
    give us an opportunity to reacquaint ourselves with the island, and also to introduce
    the children, young as they were, to Portuguese culture.


    Our son, Matt, was five years old, and Georgia was eight months and not yet walking.
    We found it easy to travel with the children at this age. Georgia was still breastfeeding,
    and Matt was readily entertained by rocks and sandy beaches. We stood out as foreigners.
    We wore hats and sunglasses, and carried Georgia in a backpack. The baby carrier
    was a great conversation starter — people often stopped and stared at us.


    One day, Eric was at home, and I decided to take the children to the piscina,
    a natural seaside pool, for a swim. While I was in the queue, a woman struck up
    a conversation with me. She fussed over the children, mostly Georgia, and said
    how beautiful those cheeks were. She kissed my face and then gave Matt a lollipop.
    I smiled and said “obrigada,” then quickly finished my coffee and rushed back
    out. I felt a strange sensation on the top of my head, but I shrugged it off and
    thought it was likely due to fatigue. Once I got to the pool and changed into
    my bathing suit, I put my hand to my head and felt something sticky!


    “Why didn’t you tell me the lady had given Matt a lollipop?” I asked Eric later.
    My horror at seeing the sticky tuft of hair on top of my head was compounded when
    I thought of my baby, barely eating. I don''t remember what I said, but I was
    near tears.


    Giving sweets, I learned, was one way adults showed kindness to young children.
    I had already noticed that children were highly prized in island culture. Whenever
    we went out for dinner, families sat together with toddlers and babies who were
    remarkably well-behaved. If a baby cried, people showed concern and offered to
    hold them while their parents finished their dinner. I left the island and immigrated
    to Canada with my parents, but our ties to the Azores remained strong and we visited
    often. I could speak the language well and found it easy to insert myself into
    island life.


    I spent the longest time realizing that it was a class-oriented society, that
    people tend to mingle with labourers, for example. I had grown up mostly in Canada,
    where society seemed more egalitarian, and I was uncomfortable with elitism. This
    was one part of culture I didn''t care for, and I had decided even before arriving
    that I would talk to everyone, just as I did in Canada.


    We rented a house in a village adjacent to the one my family was from. It was
    a short uphill walk from the house where we lived, but might as well have been
    on the other side of the archipelago. I didn''t know anyone lived there.


    That summer was one of the hottest on record. Our rental was in the middle of
    a row of attached houses perched on a cliff, overlooking fields of grapes and
    vegetables and the Atlantic Ocean beyond. When I hung the laundry on the back
    deck, I could gaze to the horizon and imagine life beyond. On a map, I could see
    that there was no land directly to the south, between us and Antarctica. Sometimes
    I''d sit out on the patio and let the hot sun bake my skin, never lasting long.
    Instead, I spent most days at the beach with the children where the breeze from
    the water kept us cool. Eric found it hard to work in the heat and eventually
    started writing in the early mornings and evenings only, which freed him during
    the day to accompany us on our adventures.


    The town became livelier after sunset. I noticed that after dinner the women on
    the street stood out on their front stoops or leaned their windows to watch the
    goings-on and chat with each other. Their husbands would go to local coffee shops
    or bars to meet with friends. After a week or two of witnessing this, I was brave
    enough to sit out on my front stoop as well. I knew I''d disrupting the habit,
    but I welcomed the opportunity to speak my language and get to know my neighbours.
    I would out there with Georgia while Eric read to Matt and put him to bed. Then
    I''d go inside and start the process with the baby.


    During the day, we''d often meet friends at the piscina. I told them that I had
    this evening ritual with the neighbourhood women and my friend sounded surprised.


    “What do you have in common with them? What do you talk about?” she asked.


    “Ha, lots, actually. Mostly we talk about the kids. Sometimes they ask questions
    about Canada. They keep calling Eric an American and I have to remind them that
    he''s Canadian,” I explained.


    “Oh, don’t bother, it''s all the same to us,” my friend said with a grin. One
    evening, I was feeling especially tired and opted out of the chat. The kids were
    cranky, and I thought we could all benefit from an early night. As I was nursing
    Georgia to sleep, I could hear the women coming onto the street, talking and laughing.
    I had closed the bedroom shutters, but the windows were open, and I could hear
    them clearly.


    “She’s so friendly. She talks to everyone,” I heard my next-door neighbour say.


    “Her husband doesn’t say much, though.” I think that was the neighbour from across
    the street and down a house or two.


    “He doesn’t speak Portuguese!” another woman said, sounding like she was defending
    Eric.


    “They say he’s a professor, but have you seen how he dresses? Sandals and shorts!
    What kind of professor dresses like that?”


    “And that poor baby. She doesn’t even have shoes. And the little boy — so shy
    . ..$


    I couldn’t identify some of the voices.


    “I’ve heard that’s not the style in America.”


    “But she’s Portuguese!” My neighbour was sounding passionate.


    I felt like I was intruding on a private conversation and got up to close the
    window.


    The next evening, I joined in again. Someone said it was nice to see me out there,
    that they’d missed me. I explained that we had all felt tired the day before,
    too much sun, maybe, so we put the kids to bed early and let myself fall asleep.


    “But you know, the windows were open, and I could hear you out here. You know
    that I can understand everything you say, don’t?”

