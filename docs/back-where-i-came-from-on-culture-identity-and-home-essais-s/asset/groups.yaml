    20 世纪 80 年代的移民潮，由独裁者费迪南德·马科斯推动在菲律宾建立汇款驱动型经济所引发。这一举措激励了菲律宾人去世界各地填补空缺，这一举措深刻且不可恢复地改变了我们所有人的的人生轨迹。现在长大了，我意识到我们都只是风中的旗帜，听命于任何袭向我们的阵风。


    当舞会音乐在宴会厅里回响到深夜时，我的一个叔舅问我什么时候回来回这个国家看看。


    我诚实地回答不知道，因为我觉得自己不再是多年前离开时的那个同一个人了——如果真是这样，当我回来时，我会是谁呢？在那一刻，我看到了眼前的未来：很快，我和 Vi
    将在加拿大开创自己的生活，远离我从小长大的许多菲律宾传统，我父母和祖父母的传统，以及他们祖父母的传统。尽管我如此热爱菲律宾，但事实是，那里对我来说不再是家，加拿大和中东也是如此：我感到自己现在陷入了一种新的无根之感，我的家处于各个国家之间，或许是三角定位的，就在我们来这里时乘飞机跨越的那些广阔海洋的中间。我曾——而且可能永远是——在岸上之外，在翻滚的浪涛中漂泊。


