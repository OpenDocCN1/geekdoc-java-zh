    她把我们搬到了加拿大，她的哥哥和家人住在那里。她希望让我们在一个新的国家有一个全新的开始，摆脱我们那混乱家族史的束缚。她希望大哥能重新回到家庭。但在住在加拿大的第一年，她就去世了，留下我和我的兄弟们独自面对与姨叔舅妈之间紧张的关系。我们在他们家里的存在让我们觉得自己像个麻烦。我们睡在冰冷地下室的垫子上，能真切地感受到，我们待在他们的空间里给他们带来了多大的困扰。尽管如此，他们还是慷慨地收留了我们，而债务的负担沉重地压在我们年轻的肩膀上。


    在以色列生活了五年后，加拿大是一个陌生的土地，那里有着陌生的人，他们对任何事情都表示道歉，有秩序地排队，说话声音不大。公交准时到达，街道上没有狗屎，这可能是因为到处都是数量惊人的垃圾桶。我找找了一份零售工作，同事建议我把名字改成“Lee”，以便别人发音。与此同时，在姨叔舅妈家里，紧张的气氛显而易见，我尽力避开他们。我还在试图（但没有成功）逃避兵役。


    但我又回到这里了。从技术上说，我回到了以色列土地。如果他们想把我送上飞机回以色列，他们有能力做到。一年半前，我完成了`Tzav Rishon`——我首次入伍以色列军，这是在这个男性必须服役三年、女性必须服役两年的国家里的强制性第一步。但随后我搬到了加拿大，错过了兵役。国家想要我回去，现在声称我是“我们自己人之一”。真是讽刺，我一直被那种不属于母国、不属于其文化、语言和社会习俗的感觉所追赶，却被政府命令回来，因为事实证明，尽管我的希伯来语糟糕，尽管同化以色列文化的能力有缺陷，但我作为以色列人足以服役。


    我的名字被叫到了，我被带进房间，坐着一个面色严肃的中年女性，皮肤苍白，留着金色的短发衬托出她锐利的五官。我告诉她我倾向于用英语交流，她径直用希伯语说话，要求我给出解释和答案，而这些我几乎没有力气用英语说出来，更不用说用我挣扎了五年的语言了。我拿出文件，向她展示了证明我哥哥由我监护的命令。她并不满意。她问我为什么是她的法定监护人，并不是因为她在安抚桌子另一边的女孩（女孩的声音开始像叶子一样颤抖）。她问我是因为她代表国家，而不像我的母亲，以色列不会轻易放过它的孩子。她用像钢铁一样冰冷的声音问了我那个最致命的问题：你母亲在哪里？


    这太让人受不了了。我的声音哑了，我开始哭起来，一旦开始就无法停下。她面无表情。也许她认为我在假装。这只是又一个诉情的故事。当我试图平复心情，她再次审阅了文件。她没有理由继续留我在那里。如果一个女性有孩子或法定抚养人，就可以免服役。大使馆将我推向寒冷而明亮的日子，此时我依然哽咽着泪水。我走回地铁站，我知道我是自由的，但从未真正从疏离的痛苦中解脱。我的母亲和我的母国现在对我来说已经失去了。


    离开以色列已经十多年了，我终于决定回来。我有一个可爱的男孩，正处于说第一个词的边缘，是时候给妈妈惊喜并带他去见她了。我决定租辆车，和妈妈一起开车穿越沙漠。我只见过一次内盖夫，那是十五年前。景色在我面前展开，像一条被风吹住的铜色围巾。荒凉山坡中发现的广阔令我屏息。我的孩子睡了，我的母亲说话，用她不停的闲谈填满了车子，仿佛她在不断告诉任何愿意或不愿倾听的人：“我在这里，我存在，你们会听到我的。”面对我的儿子，她极尽专注，试图用她坚韧的坚持赢得他的心。


    她在车里和他一起唱歌，当他睡着后，她继续用灵活的手和活跃的大脑活跃整个下午，不在在她单方面的对话中停歇。沙漠以它广阔的寂静、它对沉默的坚持，也要求我关注。尽管我曾试图只记得在以色列生活的碎片，尽管我因以色列政府的政治行为、对Palest勒斯坦领土的暴力占领感到羞愧而疏远，尽管我顺从在加拿大的生活，抛弃了过去，忘记我曾如何爱过棕榈树（正如我的母亲曾爱过它们），我的母亲，这片土地从未离开过我。它溢满了这种情感。我无法逃避创造我的人和塑造我的国家。多年来我一直抛弃我的历史，我的血脉。但历史有它不离开的方式，血脉有它撒谎的方式。


    好几年后，我再次回到以色列。我在机场看到棕榈树，它们带给我一阵宽慰和温暖，像一位母亲张开双臂迎接，将你拥在怀里。这次我的儿子四岁了，我在特尔维夫南部租了一间公寓。在公园里，我的儿子看到一群埃塞俄比亚裔的以色列孩子爬上维护棚的屋顶。他请求让他们帮他一起爬上去。他们伸出手拉他，孩子们站在屋顶上，在阳光下露出胜利的脸庞。


