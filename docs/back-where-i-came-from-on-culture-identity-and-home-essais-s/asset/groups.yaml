  - '[PAGE 25]


    early in their lives, and then often as possible. That way they could learn the
    cultural norms in the proper context, I reasoned. My husband agreed.


    On his first sabbatical leave as a university professor, Eric decided he would
    conduct research in New Zealand, so our family moved there for most of the year.
    Afterward, he would be writing scientific papers based on that research, and he
    could do that from anywhere. “Why don’t we go to Portugal?” he offered.


    We decided to spend three months on home island of São Miguel, in the Azores,
    the Portuguese archipelago of nine islands located in the Mid-Atlantic. It would
    give us an opportunity to reacquaint ourselves with the island, and also to introduce
    the children, young as they were, to Portuguese culture.


    Our son, Matt, was five years old, and baby Georgia was eight months and not yet
    walking. We found it easy to travel with the children at this age. Georgia was
    still mostly breastfeeding, and Matt was readily entertained by rocks and sandy
    beaches.


    We stood out as foreigners. We wore hats and sunglasses, and we carried Georgia
    in a backpack. People often stopped and unabashed stared at us. The baby carrier
    was a great conversation starter — I often ended up chatting on the street, in
    Portuguese, to people I didn’t know, my accent revealing that I am an islander,
    like them.


    One day, Eric was at home writing, and I decided to take the children to the piscina,
    a natural rocky seaside pool, for a swim. I stopped for a coffee on the way, and
    while I was in the queue, a woman struck a conversation with me. She fuss over
    the children, mostly Georgia, and said how beautiful she was, those cheeks, those
    eyes. She kissed her face, and then bent down and gave Matt a lollipop.


    I wasn''t thrilled about the candy, or the kiss, but I knew she was trying to
    be kind. I smiled and said obrigada, then quickly finished my coffee and rushed
    back out into the sun with the children, and down the hill to the seashore. I
    felt a strange sensation on the top of my head, but I shrugged it off and thought
    it was likely due to fatigue or the intense heat. Once I got to the pool and changed
    into my bathing suit, I put my hand to my head and'
  - '[PAGE 26]


    felt a lollipop stuck to my hair! I had to get the lifeguard to cut it off, and
    a chunk of my hair, too.


    “Why didn’t you tell me the lady had given one to Georgia, too?” I asked Matt.


    My horror at seeing the tuft of short hair on top of my head was compounded when
    I thought of my baby, barely eating, sucking on a lollipop. I don''t remember
    what I said, but I was near tears. I can still hear the lifeguard saying, “Oh,
    senhora, it''s only sugar.”


    Giving sweets, I learned, was one way that adults showed kindness to young children.
    I had already noticed that children were highly prized in island culture. Whenever
    we went out for dinner, families sat together, sometimes with toddlers and babies
    who were remarkably well-behaved. If a baby cried, there were no hostile looks
    from other patrons for the ambiance ruined; rather, people showed concern and
    offered to hold the children or even entertain them while their parents finished
    their dinner.


    I left the island as a child and immigrated to Canada with my parents, but our
    ties to the Azores remained strong, and we visited often. I could speak the language
    well, and found it easy to reinsert myself into island life whenever I returned.
    I had always gone back for short visits, though, and this would be, by far, the
    longest time I had spent since immigrating.


    I was aware that it was a class-oriented society, that people tend to mingle primarily
    within their social class — professionals don''t really mix with fish and labourers,
    for example. I had grown up mostly in Canada, where society seemed more egalitarian,
    and I was uncomfortable with elitism. This was one part of my culture that I didn''t
    care for, and I had decided even before arriving that I wouldn''t buy into the
    whole class thing — I would talk to everyone, just as I did in Canada.


    We rented a house in a village adjacent to the one where my family was from. It
    was a short uphill walk from the house where we had lived, but it might as well
    have been on the other side of the archipelago. I didn''t know anyone lived there.
    I knew we would be the foreigners, coming to live'
  - '[PAGE 27]


    in this small place, and word would get around that we were from North America.


    That summer was one of the hottest on record. Our rental was in the middle of
    a row of attached houses perched on a cliff top, overlooking fields of grapes
    and vegetables, and the Atlantic Ocean beyond. When I hung the laundry on the
    line on the back deck, I could gaze to the horizon and imagine life beyond line.
    On a map, I could see that there was no land directly to the south, between us
    and Antarctica. Sometimes I''d sit out on the patio and let the hot sun bake my
    skin, I never lasted very long. Instead, I spent most days at the beach or the
    seashore with the children, where the breeze from the water kept us cool. Eric
    found it hard to work in the heat and eventually started writing in the early
    mornings and evenings only, which freed him during the day to accompany us on
    our adventures.


    The town became livelier after sunset. I noticed that after dinner, the women
    on the street stood out on their front stoops or lean their windows to watch the
    goings-on and chat with each other. Their husbands would go to the local coffee
    shops or bars to meet with friends.


    After a week or two of witnessing this, I was brave enough to sit out on my front
    stoop as well. I knew I''d disrupting the habitual, but I welcomed the opportunity
    to speak my language and to get know my neighbours. I would out there with Georgia
    while Eric read to Matt and put him to bed. Then I''d go inside and start the
    process with the baby.


    During the day, we''d often meet friends at the piscina. I told of them that I
    had this evening ritual with the neighbourhood women and my friend sounded surprised.


    “What do you have in common with them? What do you talk about?” she asked.


    “Ha, lots, actually. Mostly we talk about the kids. Sometimes they ask questions
    about Canada. They keep calling Eric an Americano and I have to remind them that
    he''s Canadian,” I explained.


    “Oh, don’t bother, it''s all the same to us,” my friend said with a grin. One
    evening, I was feeling especially tired, and opted out of the chatfest. The kids
    were cranky, and I thought we could all benefit from an early'
  - '[PAGE 28]


    night. As I was nursing Georgia to sleep, I could hear the women coming onto the
    street, talking and laughing. I had closed the bedroom shutters, but the windows
    were open, and I could hear them clearly.


    “She’s so friendly. She talks to everyone,” I heard my next-door neighbour say.


    “Her husband doesn’t say much, though.” I think that was the neighbour from across
    the street and down a house or two.


    “He doesn’t speak Portuguese!” another woman said, sounding like she was defending
    Eric.


    “They say he’s a professor, but have you seen the he dresses? Sandals and shorts!
    What kind of professor dresses like that?”


    “And that poor baby. She doesn’t even have shoes. And the little boy — so shy
    . . .$


    I couldn’t identify some of the voices.


    “I’ve heard that’s not the style in America.”


    “But she’s Portuguese!” My neighbour was sounding passionate.


    I felt like I was intruding on a private conversation and got up to close the
    window.


    The next evening, I joined in again. Someone said it was nice to see me out there,
    that they’d missed me. I explained that we had all felt tired the day before,
    too much sun, maybe, so we put the kids to bed early and let myself fall asleep.


    “But you know, the windows were open, and I could hear you out here. You know
    that I can understand everything you say, don’t?”


    They didn’t seem amazed or apologetic. We just kept talking as if evening’s conversation
    had not been awkward at all.


    “Tell me, vizinha,” one woman asked me, “why does that beautiful baby of yours
    not have her ears pierced? Is it because her husband doesn’t like ways ways?”


    “Oh, no,” I chuckled. “That’s not at all. We’ve just agreed that we will let her
    decide for herself and she can get it done when she wants to.”


    “Such a pity,” she said.'
