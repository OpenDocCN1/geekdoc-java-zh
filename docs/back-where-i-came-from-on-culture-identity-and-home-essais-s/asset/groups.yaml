    of our forebears to the diverse and open skies of Canada.


    The small bag in my mother’s suitcase carried not just the physical essence of
    Armenia but also a tangible link to Dede that we could now bring back to his headstone
    at York Cemetery.


    My brief time in Armenia gave me a townhouse to my history while opening my eyes
