    My mother is from the village of Jayyous, just six kilometres from the Green Line,
    and my father from Qalqiliya, a city surrounded by Israel''s separation wall.
    My father was working in a factory in Germany in 1969, when one of the companies
    that gave Hamilton, Ontario, its “Steeltown” moniker, lured him across the Atlantic.
    He returned to the West Bank to marry my mother, and they both immigrated to Canada
    within days. Mom and Dad became citizens within a year.


    They were among the first Arab families to settle in Hamilton, where my three
    sisters and I were born, and where everyone, save for the third child (me), still
    lives. It''s also where we buried our father in 2006.


    I don’t remember the first time I visited the West Bank. Our summer trips began
    when I was a toddler and continued through our adolescence. Our journey would
    usually begin in Jordan. After a few weeks visiting relatives in Amman, we''d
    embark on an exhausting taxi ride to the border, enduring long queues, first declaring
    our luggage, then waiting in a security line before finally reaching the front,
    whereupon Israeli soldiers would search, question, and finally allow us to pass
    — but without first reminding us that we were foreigners in our own land. As a
    child, it enraged me, but I knew better than to tell off the eighteen-year-olds
    holding the indiscriminate power to grant or deny us access to our loved ones.


    Travel to and within Palestine was always an exercise in humiliation. Getting
    there meant being dehumanized by racist interrogations, strip searches, delays
    for no other purpose than prove that they held all the power and you held exactly
    none. Because my sisters and I often travelled to Palestine with our mother, our
    first stop was always Jayyous. Making our way there, I''d stare out the window,
    taking in the landscape and occasionally asking my mother about the strange towns
    that seemed to have popped out of nowhere. With their characteristic red roofs,
    swimming pools, and suburban architecture, the illegal Israeli settlements stood
    out'
