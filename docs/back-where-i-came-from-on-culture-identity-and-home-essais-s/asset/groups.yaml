    Magazine*、半岛新闻、CBC、*Today’s Parent*、*Best Health Magazine*、《温哥华商业评论》的原住民版等杂志。她担任传播和原住民关系顾问，目前是西蒙·弗雷泽大学的研究生。


    MAKDA TESHOME 出生并住在安大略省多伦多。2020年，她毕业于多伦多大学，获得犯罪学、社会学研究和历史的文学学士学位（BAS(c)）。她从事项目管理工作，并对以社会正义和城市发展为中心的活动和项目感到自豪。Teshome是文坛新人，曾为Tillism写过一篇关于埃塞俄比亚五音阶的作品“Tizita”。她希望继续创作以移民和第一代经历为中心的虚构和非虚构作品。


    NHUNG N. TRAN-DAVIES 是一位作家、医生、三个孩子的母亲，也是教育社会正义的倡导者。她小时候作为越南战争的难民来到加拿大。她喜欢写儿童故事来传递我们生活中的人性，她的书籍主题包括难民和移民、贫困以及善良与教育的力量。她是三本绘本书的作者，如《每磅十美分》、《娃娃》和《青木瓜》，以及一部中级小说《一粒米》。她的作品曾入围TD文学奖、红枫叶奖、蓝云杉奖和TD加拿大儿童文学奖。她目前住在阿尔伯塔州的卡尔马。


    ALEXANDRA C. YEBOAH 是一位居住在安大略省布兰普顿的作家、创意引导者、旅行爱好者和宁静的颠覆者。作为移民父母的二代加拿大人，YeboAH描写双文化身份及其如何与日常生活、自我接纳、成长和有趣的发现交织。她的作品《打破障碍》于2021年由Mayworks节出版。她目前阿尔伯塔文学节多样性顾问委员会成员。


    HANNAH ZALAA-UUL（她/她）是一位蒙古族作家，创作短篇小说、个人散文和诗歌。凭借国际发展学位和两年的实地工作经验，她在非营利部门担任赠款官，负责为西非和东南亚社区协调可持续的水、卫生设施和卫生项目。Zalaa-Uul致力于跨越世代和国界的叙事，展现人类共同经验的侧面。她住在多伦多。


