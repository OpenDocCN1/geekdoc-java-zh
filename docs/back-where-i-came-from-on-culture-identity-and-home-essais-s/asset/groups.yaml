    “Before All Saints,” Luisa added.


    Steadily we marched at an incline of forty-five degrees until Luisa stopped and
    said, “Is something calling to you? Do you feel anything?


    I glanced at the pale pink, dilapidated three-storey structure on the corner and
    gasped. “It’s your house!”—


    I corrected her. “— it’s my father’s.” I ran to the locked street-level stable
    where chickens, pigs, and rabbits were raised. A yoke hung on the wall next to
    a rustic bicycle. A wooden ladder led to the main floor of the house — the trap
    door near the main floor lay open.


