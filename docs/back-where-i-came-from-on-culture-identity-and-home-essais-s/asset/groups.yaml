    # Coriander, Chai, and Canada


    It''s impossible to go back where I came from, because where I came from came
    with me. It''s in the black tea leaves I drop into my pot of water every morning,
    the charred liquid boiling chai as pieces of cardamom flip flip over. It''s in
    the fact that I know that the stem of coriander has the most flavour and never
    discard it from my cutting board, as if it was trash. It''s in the way I stood
    up for my Grade 8 classmate when he was being bullied by my new Canadian school,
    my bold Mumbai personality seeping through.


    At the same time, a part of where I came was left behind. It''s the Arabian Sea,
    feeling imbalanced by my removal, wondering where I am. It''s the flat in Mumbai,
    vacant just for a beat before a new family it with new dreams, its floors still
    adjusting to the new movements above.


    It took me a total of sixteen years to get over my parents'' decision to move
    us from a city of thirty-five million to Calgary, a city with far fewer inhabitants
    than yearly visitors to the Taj Mahal.


    I vowed to return to India. I looked for all types of excuses and opportunities
    to go back, from volunteering and exchange programs for summer vacations and job
    opportunities. I thought if I got an impressive job in India, then I would simply
    have to move. When I was twenty-three, I applied for jobs and was called by a
    recruiter. “It says your education is from Canada?” he asked, confused, by my
    application.


    “Yes,” I said.


    “But you live in India now?”


    “Kind of of. I can move to India immediately,” I said.


    “Ah, okay,” he said; I never got a call back.'
