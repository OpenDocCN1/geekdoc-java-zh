    The curtains were now drawn, through the window, I was seeing a very different
    woman. I appreciated why she worked three jobs to support us. I recognized the
    afflictions that made her the person she was, in all her strict and seemingly
    harsh ways with us. I understood why, at times, she wanted to run away, and even
    hurt herself.


    It was not easy for Mom to raise six children with low income, a new country,
    with all the challenges of a new language, and a very different culture and value
    system. It was extremely hard — on all of us. But, we survived, then thrived —
    because of Mom.


    A thirty-seven-year age gap separates me and her. We saw and experienced the world
    differently. She lived through the French occupation, then the Japanese, and lastly,
    the Vietnam War. I grew up with the privileges of peace, freedom, and opportunities
    in Canada. I had gone back to Vietnam for the purpose of travelling and doing
    a medical elective. Little did I know that the journey would narrow the divide
    between Mom and me. Seeing her aged frame seated across from me, frailer and more
    bent by the years, her silver strands pulled back in a bun, I understood. I understood
    and respected why she would not choose to do it all over again.


    I can recall, though, on the return flight when our plane touched down in Edmonton,
    that Mom smiled. I sensed it was with gratitude. We were home.


    MARIAM IBRAHIM


    ## Bullets, Soldiers, and Checkpoints


    ### A Family Vacation


    It’s a brutally hot July day at the Allenby border crossing, one of the hottest
    on record, and I’m waiting among the throngs of other travellers, some with wet
    towels placed on their heads to alleviate the heat, to get into a taxi to take
    me to my mother’s village in the West Bank. The journey from my aunt’s home in
    Amman had taken us several hours, and the time standing in line at the border,
    waiting as Israeli soldiers use their broken Arabic to order us to go here, wait
    there, show them their passports, conjures a rush of memories.


    I settle into a taxi with my mom and fifteen-year-old niece, not much older than
    I was the last time I’d visited, and wait more. Before we can go, our “service,”
    or shared taxi, must fill up with passengers. I’ve waited twenty years to return
    to Palestine, yet feel like I can’t put it off for another second, especially
    in this unbearable heat, so finally I offer to pay the driver for the empty seats.


    It’s impossible to miss the difference that two decades makes. The settlements
    have exploded in number, at times so common I wonder if our driver had taken a
    detour through Israel, despite having a green licence designed to quickly identify
    Palestinians and keep them out. But no, this is Palestine, regardless of the settler-only
    buses passing by.


    I keep my eyes firmly out the window, determined to take in everything I’d missed
    over the years. Billboards advertising these illegal communities beckon new settlers.
    In the distance, construction cranes signal unabated expansion. Usurpers continue
    their illegal efforts to squeeze out the natives. Two systems of life, separate
    and unequal.


    I also notice fewer Israeli soldiers in Jeeps and tanks on the streets because
    the last time I visited, the summer right after high school, in 2003, was near
    the end of the second Intifada. I remember protesting and funeral marches, getting
    held up at checkpoints, seeing detain boys as young as ten, and hearing so many
    tragic stories of Palestinians killed by occupation soldiers. Back then, arbitrary
    road closures and blockades forced us to take detours through groves and over
    hills to reach Nablus and Tulkarem, cities that were each about forty kilometres
    away from ours. Twenty years later, I don’t see many permanent checkpoints, but
    the occupation is far from invisible: I see Israeli soldiers standing roadside
    at various points, dressed in thick military vests and helmets, machine guns at
    the ready.


    As we get closer to my mom’s village, memories of many family summer holidays
    to the homeland come back.


    Though they seemed completely normal to me, I’ve to realize they weren’t your
    typical vacations. No hotel stays and tour groups to take in the sights of the
    Holy Land. No sunbathing at the beach and visits to museums and galleries. With
    so many relatives in the West Bank — dozens upon us on both sides of my family
    — summer vacations, to me, meant all days of visiting. It meant connecting over
    meals of makloubeh and molokhia and staying up late, waiting for the heat to break,
    so we could comfortably enjoy mint tea and platters of watermelon, grapes, and
    plums. As a family, we’d spend the better part of our summers there, and by even
    the end feel like we hadn’t had enough. I suppose that’s why I always felt visiting
    Palestine was a commitment, and in the past decades I hadn’t found a way to commit.
    In reality, I didn’t need anything more than a plane ticket and a determination
    that I could — go back, even just for a few weeks.


    In my twenty years of absence, I often thought about returning with my mother,
    who, undeterred by the military occupation, the indignities at the border, the
    invasive and accusatory questions asked by the officers, still made the pilgrimage
    nearly every year. So, last summer, when she called to say that she was planning
    a relatively short trip to Jordan and Palestine with my niece, I realized there
    would never be a perfect time to go, in fact now was as good as a time as any.


    My mother is from the village of Jayyous, just six kilometres from the Green Line,
