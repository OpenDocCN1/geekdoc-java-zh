  mdcn: "\n## \n\n迈克尔的（Michael’s）。这一点我早就知道，尽管他除了去那里学英语以外，从未提到过。\n\n我不想通过询问比他自愿分享的更多的来窥探，于是我止于此，并继续以自己的方式寻找答案。我成了某种程度的家族档案保管员，钻研报纸，并收集提到我们家族艺术以及为了保护文化遗产而进行的政治反抗历史的文章截图。\n\
    \n我在祖父的一次采访中读到，阿尔尔特湾（Alert Bay）也是我家族爱情开始的地方：我的祖母在离开渡轮时遇见了他。他们相爱并搬到大陆组建家庭，但正是在那个小岛的岸边，因为两个人的相爱，我才成了一个可能。\n\
    \n在经历了这样一个动人的教后，我继续在网上关注该文化中心和其他相关账号，最终参加了一个结合了瑜伽、夸古特尔（Kwakiutl）文化教学、夸克瓦卡拉语言培训以及符合文化的健康养信息的项目。我新结的阿姨是我们的长者，几周以来，我一直从她和其他老师那里学习。我一个通过语言班认识的表亲也在那个项目里。每一节课，我都在与家联系，至少在虚拟上，看着屏幕上住在那里的阿姨和其他老师们微笑。我学习新单词，试探性地读出它们，同时品味着词汇量增长的成就感。我完成了这个项目，是时候毕业了。\n\
    \n当我第一次读到这个项目时，人们谈论要在阿尔尔特湾举行毕业典礼，考虑到不断变化的公共卫生指令，我怀疑这是否会发生。我希望它真的能实现；希望我能找到家的路。幸运站在我们这一边。\n\
    \n毕业当天早晨，我去了文化中心，墙上挂着我祖父和高高祖父的照片。在最终前往“大屋”（Big House）之前，我欣赏了家族的艺术品，那是一个作为社区精神文化中心的建筑。\n\
    \n那里有精彩的演讲，中心燃着一堆火，还有丰盛且闻气诱人的食物。我想起，当我在治疗进食障碍治疗期间，第一次在病房墙上看到阿尔尔特湾的照片时，自己一直是格么饥饿，而现在我在这里，和家人一起畅享大餐。我的专家团队曾担心让我运动，而现在我正在教瑜伽。\n\
    \n我们被引导到后方准备跳“女士舞”（Ladies Dance）。我从未学过传统舞蹈，除了童年在一次表亲的婚礼上跳过一次，我担心自己看起来会很傻。裹着一条借来的披肩，我加入了项目中的其他女士并学会了舞蹈。\n\
    \n当我走在“大屋”的地板上时，我的脚趾接触到了凉凉的土地，而医院的地板是无菌且坚硬的。我感到不稳和犹豫，不是因为眩晕，而是因为缺乏经验；我的阿姨牵着我的手，告诉我要怎么做。\n\
    \n我让大地粘附在脚底，让泥土钻进脚趾，在亲属的引导下穿过地板。我感到脚踏实地，尽管我的身体和内心都在剧烈运动，作为一名夸克瓦卡瓦（Kwakwaka'wakw）女性挺拔地行走。身处“大屋”让我深受感动，在祖父出生的土地上跳舞，在祖父母相爱的地方，在我们家族的雕塑屹立的地方。\n\
    \n## 迪米特里·纳斯拉拉（DIMITRI NASRALLAH）\n\n## 哭包子（Crybaby）\n\n2009年11月，我第一次回黎巴嫩，自从我五岁那一个命运的早晨我们登上渡轮前往塞浦路斯以来。尽管二十七年前作为一个家庭离开了那里，但我是独自回来的。这感觉像是一件必须做的事，我无法再推延了。\n\
    \n我记得飞往贝鲁特时的恐惧，记得在巴黎的长途转机，离开蒙特利尔，在她怀孕第二个月开始时，在一个我只从记忆最深处知道的地方待上一个月。我当时在写第二本小说，我失败了，在经过多次草稿后仍找不到它的核心。它变成了一个关于离开黎巴嫩的故事，但没有跳动的心。黎巴嫩是一个我熟悉的世界，但我从本质上与它疏远。因为它，我的生活中充满了愤怒，挫败感被跨越世界并连根拔起，带着一种看似随意的严厉。当我年轻时，我把所有的愤怒都发泄在父母身上。但现在我已经独自生活了几年，没有办法留下所有的记忆。我不想让这些回响传递给明年四月的孩子。\n\
    \n（注：原文中存在大量重复段落，已根据指令“不要重复输出原文”，译文仅保留核心内容逻辑。）\n\n"
