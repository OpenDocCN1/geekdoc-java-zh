    # WISHBONE


    Luisa studied my manicured hands and manicured feet saying, “I’ve never done that.”
    She’d been a young bride and now, a doting mother. She’s skittish about the refugee
    crisis (the number of asylum-seekers sweeping through Lampedusa in 2016 are staggering
    and heartbreaking). I countered: for a country with a diaspora the size of Italy’s
    to deny shelter to those in search of peace and potential prosperity is criminal
    and inhumane. As a kid, I adored her and preferred her company to anyone else’s,
    but then I reasoned that her older brother was a bully and her youngest brother,
    still a baby.


    Over lunch, she voiced a daydream that I would fix up my father’s home damaged
    in the 2002 earthquake — and spend summers in Molise. “What do you think? Is it
    possible?”


    Her husband chimed in to say the government no longer funded the rebuild.


    I contemplated an alternative life. Where one I could live the stereotype of Italian
    connectivity, holding huge feasts for family and friends, inviting everyone to
    stay for free in an idyllic setting straight from a Renaissance painting. I coveted
    the seductive surroundings — the emerald hills, golden wheat fields, and mackerel
    sky formation against turquoise as if God airbrushed the clouds himself.


    The ache in my chest was that ancient longing to thrum through the heart of humanity.
    We cannot survive without others. Even a hermit knows this, I’m sure. I visualize
    the venture: the ability to visit and tend to the graves of my beloved Nonna Femia
    and Nonno Gennaro whenever I wanted. To plant plants in the soil that fed my ancestors
    for a millennium, and more. To eat fresh figs, to turn into second, third, and
    fourth cousins during a stroll, to speak the language of Dante, flawlessly greeting
    everyone without dread lodged in my throat.


    Could I collect all the sensory story details I desired then? I wondered.


    I’d prepped a bucket list for this trip: visit the Capuchin Crypt, tour the Colosseum,
    take in a museum or art gallery. A bout of heatstroke sidelined all plans. I managed
    to observe a sunrise in Molise, the hills in the distance glowing pale yellow
    and tangerine. Once I regained partial strength after several incoherent and painful
    days stuck in bed, I joined a tour group making its way through the crowded iconic
    amphitheater.


    And my favourite memory: After lunch, Luisa and her daughter accompanied me and
    Nadia on a walk; my cousin spoke of the quake that structurally destroyed parts
    of the old village. Her kids were in school when the ground shook at eleven on
    October 31.


    I was about to say “Halloween,” when Nadia spoke up. “The Day of the Ancestors.”


    “Before All Saints,” Luisa added.


    Steadily we marched at an incline of forty-five degrees until Luisa stopped and
    said, “Is something calling to you? Do you feel anything?


    I glanced at the pale pink, dilapidated three-storey structure on the corner and
    gasped. “It’s your house!”—


    I corrected her. “— it’s my father’s.” I ran to the locked street-level stable
    where chickens, pigs, and rabbits were raised. A yoke hung on the wall next to
    a rustic bicycle. A wooden ladder led to the main floor of the house — the trap
    door near the main floor lay open.


    A woman drew near as I snapped pics with trembling hands. She lived across the
    road, a paved pathway of about three metres. She’d known my nonna and cried, “You
    look exactly like Zi Femia!”


    Luisa asked, “Where is everyone? Hoped we’d catch Frank.” Luisa thought my father’s
    delinquent cousin lived in the adjacent abode had key.


    “A serpent passed this morning. Everyone’s inside with their doors closed.”


    Someone found someone with a bolt cutter to pry open the gate. A man of slight
    build entered through the animal stall and unlocked the front door.


    Everyone insisted I not cross the threshold — too perilous. Thirty years of dust
    caked the photos and furniture. A propane tank stood off to the side of the stove.
    The walls contained massive fissures angled like trapped lightning. Rubble was
    strewn across my grandparents'' bed. The man retrieved my grandfather''s army
    portrait, First Communion photos of my cousins, and a wedding portrait of my parents
    that I hadn''t seen since their acrimonious divorce a decade earlier.


    Back in Campobasso, I carefully cleaned the glass frames, my hands turning black
    from grime.


    Tongue tired and mind depleted, in English I asked, “Nadia, a snake in front of
    the house on Via Rosello. What do serpents represent?” In Christianity, the molting
    creatures are affiliated with evil. As a boy, my father narrowly avoided death
    by viper; the family dog, Rizzoli, barked a warning, lept in front of my dad,
    and died from the venomous bite. I was open to the possibility the presence was
    an auspicious sign, an offbeat welcome.


    Nadia thought it over. Exhaling cigarette smoke she said, “Knowledge. They represent
    knowledge.”


    How fortuitous. Understanding was what I wanted all along. This trip was only
    the beginning.


