    like organic café in a poor neighbourhood. I had travelled these roads so often
    as a child that I could practically map them out in my mind’s eye. As a teen,
    I never knew how to describe my trips “back home” to my non-Arab friends. Most
    Arabs dealing with border guards and military was a fact of life under occupation,
    that at any moment a gun could be pointed at you, your mobility could be thwarted
    by an indiscriminate checkpoint soldier — facts so commonly understood that they
    didn’t warrant discussion. Not so for the Jenifers and Ashleys and Emilys. Speaking
    to them about Palestine required a political consciousness and vocabulary few
    middleschoolers possess. Because many of my trips happened during the first and
    second Intifadas, I was contending with the images of Palestinians portrayed as
    violent terrorists baked into their minds by mainstream media.


    “I heard that place is dangerous.”

    “Isn’t there a war going on there?”

    “Did you pack a bulletproof vest?”


    It turned my summer vacation stories into something more complicated and exhausting.
    Once, when I was about eight, I got home from school to find a reporter from the
    local newspaper in our living room. My mother brought a tray of mint tea and cookies
    to the coffee table before recounting the violence we endured during that summer
    toward the end of the first Intifada, a particularly traumatic season in Jayyous.


    On more than one occasion, our village was the target of Israeli military raids,
    events would send fear and adrenaline through my body. As I sat outside one afternoon,
    overlooking the road leading up to the village entrance, we heard young boys shouting
    that soldiers were on their way. Some gathered rocks to throw at the military
    vehicles, and others ran inside as their mothers yelled them to stay out of the
    fray. My older sister and I climbed the stairs to the flat roof of our Uncle Salah’s
    home for a better view of the events as they unfolded, spotting a military Jeep
    pulled over the side of the road down the hill, an olive grove between us and
    the intruders. I couldn’t tell how long we were watching, but the first bullet
    aimed at my sister'
