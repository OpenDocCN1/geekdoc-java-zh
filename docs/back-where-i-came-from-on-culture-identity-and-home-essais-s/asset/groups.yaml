    An officer came up to the car and knocked on the window. My grandfather rolled
    the window down. The officer peered inside the car, and then turned at me, studying
    the strange Hungarian teenager before him, whose New Wave fashion sense, I’m sure,
    must have appeared to him like a beacon of my not-from-Hungary-ness. “Excuse me,”
    he said in English, and further to our surprise, without a hint of an accent,
    “you will have to wait a few minutes, we’re having games.”


    War games? Right by the highway? I thought, This totally makes my day. But it
    got better. “How old are you?” asked the officer, looking straight at me in my
    Duran—inspired headband. “Thirteen,” I said.


    “Would you like to ride in a tank?”


    Before I could say, “Yesyesyesyesyesyesyes,” my father — the voice of reason,
    man who repeatedly told me never to trust people in uniforms, including the police
    officer who came to my elementary school class to teach us not to talk to strangers
    — coldly intercepted the communist’s offer: “No, he would not.” He turned to me
    from the passenger seat and gave me the sort of look that suggested I might not
    want to speak for a while.


    It never took my dad long to go from the person who killed fun to James Bond.


    Except James Bond would never been caught dead in a place like Lillaförd, the
    sleepiest of resort towns. Really, it was only a small village, located in the
    Bükk Mountains in the northern part of the country — a small lake surrounded by
    lush forest.


    My families — that is, both my mother’s and father’s sides — decided that this
    would be a good place for a retreat. We all stayed in a series of cabins near
    the lake.


    The evening we arrived, my cousin Eve and I went to the shore hunting for empty
