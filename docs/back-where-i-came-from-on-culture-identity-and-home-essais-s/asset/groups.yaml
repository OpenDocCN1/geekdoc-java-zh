    Relatively speaking, I was the one with privilege, and in spades; at this point,
    I had already recognized my family back home as having privilege, but now I knew
    that, as a working balikbayan, I was in an echelon above. Nothing cemented this
    further than when I made a withdrawal from an ATM and saw my chequing account
    balance converted to Philippine pesos — if ever there was a time in my life that
    I felt the closest to being wealthy, it was then. What kind of world did we live
    in, that an hour of my labour in Canada could be so much more than an hour of
    someone’s here?


    At my cousin’s wedding reception, in a swanky hall flanked on either side by extravagant
    floral displays, I gave my best speech, a riff on how my cousin hoarded his toys
    as a kid. As I spoke, I remember that I was the hoarder now, hoarding my attachments
    to this conception of the person I no longer was, a person with closer ties to
    my birth country than I actually had. In reality, my sense of belonging to the
    Philippines had been forfeited in a million tiny ways over the last decades: when
    my dad emigrated as an overseas worker and took my mom with me when I was a toddler;
    when my parents chose to speak to me in English and not Tagalog; when my parents
    chose to send me to a school in the Middle East with an American curriculum —
    there were myriad examples. And it wasn’t my parents’ fault; they did all of these
    things because they wanted to create better opportunities for me and my sisters.
    At the time, my parents were also caught up in something larger than themselves,
    namely the wave of migration in the 1980s spurred by dictator Ferdinand Marcos’
    move to create a remittance-based economy in the Philippines, a move that incentivized
    Filipinos to fill shortages across the world, a move that profoundly and irrevocably
    changed the trajectory of all of our lives. Older now, I realize that we’re all
    just flags in the wind, at the mercy of whatever gusts come our way.


    As the dance music blared into the wee hours at the reception hall, one of my
    uncles asked me when I was coming back to the country to visit.


    I replied honestly that I didn''t know, because I didn''t feel like the same person
    who left years ago — and if this were the case, who would I be when I came back?
    In that moment, I saw the years ahead of me: soon Vi and I would be forging a
    life of our own in Canada, apart from many of the Filipino traditions I grew up
    with, the traditions of my parents and grandparents, and those of their parents
    and grandparents. As much as I loved the Philippines, the truth was that it no
    longer felt home to me, and neither for that matter did Canada nor the Middle
    East: I felt now edged into a new kind of rootlessness, and my home was one between
    countries, triangulated perhaps, in the middle of one of those vast oceans that
    we crossed on airplane on the way here. I was — and probably would always be —
    overboard, adrift in the rolling waves.


    The camera spent much of its time in my bag after that. It bristled whenever someone
    asked me for a photo, grunted in response if they asked again. On one of our nights
    in Manila, possessed of a kind of wild energy, Vi and I brought the camera out
    and took photos of ourselves on the streets in my grandmother’s barangay, giggling
    and posing outrageously, trying to get the city lights softly out of focus in
    the background the way we saw in the photos we admired on social media. We took
    several dozen pictures of ourselves, both of us fiddling with the settings, but
    we could already tell by previewing the images on the camera’s rear screen that
    none of them turned out — the images were all dark and too grainy. “If you want
    to freeze a moment in time, you must get your shutter down to one-sixth of a second
    or less,” our Scotsman instructor had joined us at the course, and I remember
    looking up helplessly at the images projected on the screen at that moment, images
    featuring blooms of water frozen in time, a soccer player mid-kick with his leg
    thrust out, appearing as motionless as a statue.


    I’ve kept all of the photos that Vi and I took, despite their obvious lack of
    quality. As it turned out, it would take us another full year or two before we
    truly felt competent at using that camera. Still, there is something intriguing
    to me about the imperfection of those photos: there are sixteen of me in total,
    and in every single one I am blurry, my edges not clearly delineated — I am in
    motion, forever unfrozen, the camera unable to capture me.


