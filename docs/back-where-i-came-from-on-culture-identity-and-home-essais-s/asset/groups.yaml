    我变得非常喜欢这些女人。以至于在我们临近离开时，我感到一种挥之不去的失落感。我会想念她们的。一天早晨，当我正胡想这件事时，门口传来了敲门声。当我开门时，站在那里的是街那头的一个女性，我不熟悉她，但一眼就认了出来。她手里拿着一个信封。


    “Bom dia（早上好），请进，”我说。


    “就一分钟，女士（senhora）。”她走进屋内，我好关上门，隔绝了交通噪音。


    她把信封递给我说：“这是给你的。我们大家的礼物。”


    “噢，谢谢！这是什么？”


    我打开信封，发现里面有钱。

    “这些钱足够让你宝宝打耳洞了。我们想也许你丈夫不会给你钱去打，因为他不喜欢，所以我们大家一起凑了一点。”


    “噢，女士！Obrigada（谢谢）。”我感到泪水夺眶而出。“这真是一件贴心的事情。”


    “我们真的很喜欢你，看到你要回美国了，我们非常难过。”她咬着下唇，转过脸去。说道。


    “回加拿大。而且我们会回来的，你知道的，”我说。


    在那几年里，我通过信件与一些邻居保持联系。通常之后我们家人确实回过几次葡萄，但大多数时候我们去大陆。我们去圣米尔岛（São Miguel）进行短途侧游，但行程排满了观光和探亲。十五年后，我们才回到了同一个小镇。我们走在鹅卵石街道上，爬上山，再次饱眼那片壮丽的景色。记忆的碎片回到了马特（Matt）脑海，但乔治亚（Georgia）看起来就像是第一次看到。


    我敲响了隔壁邻居的门。一个年轻女性开了门，我们不认识。


    “噢，我们在找奥莉维亚女士（Senhora Olivia），”我说。


    “那是我妈妈，”她说。“父亲去世后，我现在和她住在一起。”


    当我解释了我们是谁时，她说她知道我们，见到见到我们非常高兴。她邀请我们进去，但提醒说她妈妈可能认不出我们。“她最近记忆有些事情有些困难，”她说。接着她继续道，“你们可能知道住在街对面的那个邻居搬到了波顿，而住在她楼上的那个搬到了市中心。”


    “不，我不知道，”我说。


    我们穿过一条昏暗的走廊来到房子后方。奥莉维亚女士坐在露台的桌子旁，喝着茶。我们向她打招呼，然后和她一起喝茶。我展示了我们上次住那里的照片，但不知道她是否还记得我们。我搂住女儿的肩膀说：“这是宝宝乔治亚。看，她打耳洞了了！”乔治亚转过头来展示她那对传统的金耳环。她在六岁时，是出于自意愿地接受了这种传统。


    奥莉维亚女士给乔治亚露出了灿烂的微笑。然后她一个一个地看向我们每一个人，眼里泛满了泪水。我喜欢想，在那个准确的时刻，她清楚地知道我们是谁。


    # 阿灵归来（Ah-Ling Ge Lui）

    番来！（Fan Lai La!）阿灵的

    女儿回家了（Ah-Ling’s Girl Has Come Home）


    2018

    当渡轮靠在长洲（Cheung Chau）码头时，咸水味充斥着我的鼻腔。一名穿着深蓝色白色滚边海军服的水员将系缆绳套在码头的系桩上，带我们靠岸。我下了船，由于跨越太平洋的红眼航班和十五小时的时差，双腿沉重。穿过一群身着正装和校服的人群，他们正准备登下一班前往香港岛的渡轮。


    我的脚很熟悉这里的路。它们带着我直穿过广场，路过那家点心店，经过五金行店和理发店，转过弯。我停下来向那个正在抽烟、挂衣服的邻居挥挥手，越过腰高的棕色金属门，走了进去。但这一次，我不知道该期待会发生什么。我的外婆宝婆（Pau
    Pau）四天前去世了，我和父母、姐姐来到这里参加她的葬礼。


    我的母亲阿灵（Ah-Ling）出生在一个名为长洲（Cheung Chau）的沙质陆陆岛上，字面意思是“长岛”，是香港263个离岛岛屿之一。长洲七万居民的大多数挤在岛屿的平坦部分，位于南北两端岩石山之间。三层楼梯式公寓彼此非常近，以至于你可以看到邻居的电视。屋顶上挂着晾衣架。舢船和渔船在港口拥挤。户外海滨的餐厅是当地游客周末的热目的地。除了专门设计的微型救护车和消防车，岛上不允许汽车通行；街道太窄了，挤满了人：印尼和菲律宾籍女佣推着坐轮椅的祖辈；周末游客租用自行车划划艇；码头工人推着嘎吱作响的小推车运各种货物。这座岛以街头小吃（尤其是鱼蛋）闻名，而且十九世纪海盗中榜寨（Chung
    Po Tsai）宝藏的所在地。我的爷爷公公（Gong Gong）出生在岛上的一个农民家庭。宝婆是城市人，出生在英国殖民地中心的香港岛，一个叫西英蒲（Sai
    Ying Poon）的地区，那里曾是渔港，也是英国军队的第一处基地。


    在一次回香港参加表亲婚礼期间，我姐姐和我回了那里。通常之后我们家人确实回过几次葡萄，但大多数时候我们去大陆。我们去圣米尔岛（São Miguel）进行短途侧游，但行程排满了观光和探亲。十五年后，我们才回到了同一个小镇。我们走在鹅卵石街道上，爬上山，再次饱眼那片壮丽的景色。记忆的碎片回到了马特（Matt）脑海，但乔治亚（Georgia）看起来就像是第一次看到，当然。


    我敲响了隔壁邻居的门。一个年轻女性开了门，我们不认识。


    “噢，我们在找奥莉维亚女士（Senhora Olivia），”我说。


    “那是我妈妈，”她说。“父亲去世后，我现在和她住在一起。”


    当我解释了我们是谁时，她说她知道我们，见到我们非常高兴。她邀请我们进去，但提醒说她妈妈可能认不出我们。“她最近记忆有些事情有些困难，”她说。接着她继续道，“你们可能知道住在街对面的那个邻居搬到了波顿，而住在她楼上的那个搬到了市中心。”


    “不，我不知道，”我说。


    我们穿过一条昏暗的走廊来到房子后方。奥莉维亚女士坐在露台的桌子旁，喝着茶。我们向她打招呼，然后和她一起喝茶。我展示了我们上次住那里的照片，但不知道她是否还记得我们。我搂住女儿的肩膀说：“这是宝宝乔治亚。看，她打耳洞了！”乔治亚转过头来展示她那对传统的金耳环。她在六岁时，是出于自意愿地接受了这种传统。


    奥莉维亚女士给乔治亚露出了灿烂的微笑。然后她一个一个地看向我们每一个人，眼里泛满了泪水。我喜欢想，在那个准确的时刻，她清楚地知道我们是谁。


