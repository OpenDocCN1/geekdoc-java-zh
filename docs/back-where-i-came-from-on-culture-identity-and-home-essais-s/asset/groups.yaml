    将我提升为“永久居民”。这是我的东道国，但我们的关系却波折重重。我在这里永久居住，但我的归属感永远模糊不清。


    如果战争从未发生过呢？如果我回去并在那里养大我的女儿呢？如果我们从未离开过呢？


    在美国，我是那个带着口音的人，那个名字总是被读错的人。那个在回答你关于我背景的简单问题时，用地理和历史课来回答的人，以及在我们见面几分钟后你就会忘记我的名字的人。那个来自一个你并不熟悉的地方的人，除了你在旅游杂志上读到的以外，但你还是有些话想对我说。我是无根无源且分裂的，就像生下我的那个国家一样。


    我的整个成年年生活都是美国度过的，所以我的英语比克罗地亚语要好。我熟悉这里的环境，了解俚语，知道如何应对这里的文化和社会准则。但这里没有任何地方感觉像在亚德里亚海游泳那样熟悉或清晰。即使我和朋友们在烧烤聚会上玩得很开心，我的一部分似乎缺失了，或者某些东西格格不入。在美国，我是一个挣扎着寻找方向的局促游客。离开母国几十年松动了我的抓握，但我依然那个紧紧贴着家园的异类生物。


    ## 致谢


    首先，我们要感谢 Hazel Millar 和 Jay Millar 对我们愿景的支持，并让这本书在 Book*hug Press 找到了家。我们对你们对我们付出的信心和信任表示感激。我们的谢意还感谢
    Shannon Whibbs 的文字编辑，Ingrid Paulson 的排版与设计，以及参与此书制作的每一个人。将一个想法从概念变为书店书籍是一项艰巨工程，需要印刷和分销链上许多人的热情。我们感谢大家。


    我们深心感谢在这一过程中一直热情分享支持和专业知识的作家和编辑们。感谢 Bonnie Nish，她为这本最初还只是构思的书点燃了火花，并在 Pandora’s
    Collective 和 Word Vancouver 活动中为围绕这些主题的对话提供了空间。你是一位像宝石一样好的朋友，也是每个人生活中都需要的捍卫者。感谢
    Ayelet Tsavari，她从一开始就相信这本选集，并慷慨地分享了她的时间和知识来帮助我们起步。感谢 Samantha McCabe 和 Pandemic
    University 帮助收集稿件，感谢 Shereen Zinck 和 Edmonton Community Foundation 帮助我们扩大作品集。


    非常感谢我们的朋友和家人。你们在这段旅程每一步的祝贺都温暖了我们的心。


    如果没有这些让我们深感自豪的贡献者，如果没有他们愿意以如此脆弱和奉献的精神来探索这些想法，这本书就不会是现在。作家们，感谢你们优美的故事。


    ## 简介


    ### 编辑


    TASLIM JAFFER 是一位作家、编辑和写作指导，拥有金立学院大学创意非虚构文学硕士学位。她的作品曾发表于《Maclean’s》、《Asparagus》、《WestCoast
    Families》、《CBC British Columbia》、《Peace Arch News》、《Unearth Women》等杂志。她是 Creative
    Nonfiction Collective 和 Humber Literary Review 举办的 2022 年创意非虚构大赛的获得者，也是 2021 年加拿大银奖在线出版奖获得者。Jaffer曾在多个舞台就多样性和跨宗教话题发表主旨演讲，并在社区和康复机构教授创意非虚构和表达性写作。她正在撰写她的处女散文集，与丈夫和三个孩子住在不列颠哥比亚省的素瑞。


    OMAR MOUELLEM 是一位作家、电影制作者和教育者。他的新闻报道发表于《卫报》、《WIRED》和《华街日报》。他的著作《How Muslims Shaped
    the Americas》（穆斯林如何塑造美国）获得了 2022 年 Wilfred Eggleston 非虚构文学奖，并被为《环球与邮件报》2021年百本书之一。他的纪录片《黎巴嫩汉堡黑手》记录了快餐与黎巴嫩移民之间意想不到的联系，获得了
    2023 年 NorthwestFest 观众选择最佳纪录片奖。他还在金立学院大学教授创意非虚构，并担任 Pandemic University 写作学院的“假院长”，那是他创立的一所虚拟学校，旨在支持受
    COVID-19 疫情影响的作家。他住在埃德蒙顿。


    ## 贡献者


    **NADINE ARAKSI** 是一位亚美尼亚裔加拿大作家，她的作品探索女性身份、身份以及叙故事的转型力量。她的文章曾发表在《Chatelaine》、《Maclean''s》、《Today''s
    Parent》和《Canadian Geographic》等加拿大出版物上。Nadine 在多伦多多元且充满力的社区中寻找灵感，她和她的两个青少年以及忠诚的猫咪
    Cookie 住在那里。


    **OFELIA BROOKS** 是一位黑人、拉丁裔第一代作家兼律师。她的作品曾发表于《Electric Literature》、《Catapult》、《Cutleaf》、《Insider》以及选集《Mamas,
    Martyrs, and Jezebels》(Black Lawrence Press)。她的散文《Mother Tongue》（母语）曾入围 Pushcard
    奖。她住在芝加哥。


    **ESMERALDA CABRAL** 的旅行回忆录《How to Clean a Fish and Other Adventures in Portugal*》（如何清洗鱼以及在葡萄牙的其他冒险）于
    2023 年春季出版，并入围阳光海岸作家和编辑协会不列颠哥伦比亚省作者奖。她的作品曾发表在《环球与邮件报》、《Understore Magazine》、《Gáve-Brown》、《The
    Common》、《Canadian Traveller》、《Curiosity Magazine》以及九本选集上。她是西蒙·弗雷泽大学作家工作室的毕业生，并拥有哈利法克斯金立学院大学的创意非虚构文学硕士学位。Esmeralda
    出于葡萄牙的亚速尔群岛，现住在温哥华。


    **JUNE CHUA** 出生于婆洲，在阿尔伯塔省长大。她是一位第二代巴勒斯坦裔加拿大人人，根在被占领的西岸和安大略省的汉密尔顿（那里是 Erie、Huron-Wendat
    和 Haudenosaee 人的传统领土）。她是两家巴勒斯坦人权组织的联合创始人，曾向不同观众发表关于巴勒斯坦问题的演讲。


    **SEEMA DHAWAN** 是一位住在卡加里的记者，曾为稿于《USA TODAY》、《Condé Nast》、《Huffington Post》等。她拥有创意非虚构文学硕士学位，正在创作一部散文集。她的非虚构作品曾发表在《Conspicuous
    Accents》、《Flash Nonfiction》等选集中。


    **KRISTA EIDE** 是一位作家和诗人，她的小说和非虚构作品曾发表于加拿大。她住在不列颠哥伦比亚省温哥华未割让的奎什土地，在那里担任《Event》杂志的执行编辑。


    **OMAR ELDAD** 是一位作家和记者。他的第一部小说《American War》（美国战争）被翻译成十三种语言，并被 BBC 选为百本书之一。他的第二部小说《What
    Paradise》（天堂）获得了 Scotiabank Giller 奖和俄勒冈图书奖。他住在俄勒冈州波特兰南部的森林里。


    **EUFEMIA FANTTI** 是小说家，也是 Silver Falchion 奖决赛。


    **AYESHA HABIB** 是一位住在不列颠哥伦比亚省温哥华的作家和摄影师。她曾是《环球与邮件报》、《Chatelaine》、《Toronto Life》、《Capital
    Daily》等杂志的记者和编辑。2021 年，Habib 自行出版了名为《Papercut》的摄影集，并执导了一部实验电影。


    **CHRISTINA HOAG** 是小说《Girl on the Brink》、《Skin of Tattoos》、《Law of the Jungle》和《The
    Blood Room》的作者。她的故事和散文发表在众多文学评论杂志上。她曾是《迈阿密讯报》的记者和拉丁洲的外派记者。她住在洛杉矶。


    **MARIAM IBRAHIM** 是一位作家、编辑和曾获奖的报纸记者，曾担任广播和电视评论员。她目前与丈夫和年老的猫一起住在首尔。

