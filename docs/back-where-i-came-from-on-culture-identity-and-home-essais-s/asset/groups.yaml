    # Four Degrees, Twenty Minutes South


    For many children of immigrants, “back home” exists in stories, and, if we’re
    lucky to have them, photographs, like the ones Dad dropped off at my house a couple
    of years after Mom died.


    My mom’s albums in Bombasa, Kenya, are my greatest treasures; I would run back
    into a burning building for the images of her as a cherub-like toddler, as a college
    student with ice-blue makeup painted on her eyelids, photos of Nanimaa and her
    sisters in the courtyard, cooking biryani in huge suforia, of Maa holding a bandhani
    pacheri over Dad’s head in a pre-wedding ceremony. As an adolescent, I pored over
    these photos, traced faces with my finger, noted hairstyles, backgrounds, and
    decor, while Mom brought the moments to life with her stories of back home. I
    recall her talking about the beaches, and the wind that blew through her hair.
    Listening to her memories, my brain registered my wistfulness, and the scent of
    the biryani air buried in my nostrils. “That.” Mom would smile, and I would taste
    it. In Kutchi, you don’t say “feel” the wind, you say “eat” the wind. When Mom
    talked about the wind on the Kenyan beaches while the rain painted the windows
    of our B.C. home, I’d imagine her gaping mouth ingesting the gusts off the ocean.


    With Mom gone, the albums are an umbilical cord to my birthplace and my extended
    family, feeding my need for a connection to where, and who, I’m from. Beyond the
    albums, my parents had brought “back home” to B.C. in other ways, too: African
    art, Indo-African cuisine, and our native Indian language, Kutchi, which, after
    a century of being spoken in Kenya, included many Kiswahili words. Even though
    I was an infant when we'
