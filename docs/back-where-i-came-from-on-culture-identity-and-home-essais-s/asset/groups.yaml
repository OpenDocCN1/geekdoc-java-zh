    In 1982, Dede died with an unrealized dream born of displacement and longing —
    to touch the soil of his homeland. Lying on his deathbed in Scarborough, where
    he’d lived since 1977, he shared his last wish with his baby — my mother.


    It would take nearly four decades before my mom, now a yaya herself, would bring
    us along to fulfill Dede’s dream with a small spade and a Ziploc bag discretely
    packed in her suitcase.


    As the family storyteller, I hoped my journey to Armenia would provide a bridge
    from the past to understanding ourselves and our place in the world. With Mom
    advancing in years, our pilgrimage felt urgent. I wrestled with expectations for
    my own dream: to connect the dots of our scattered heritage and experience the
    land that was always a part of us so far from our realities in Canada.


    Yerevan’s crisp air embraced me like a suffocating auntie as we left the airport
    to meet George, our driver. Originally from Aleppo, George sought a safer life
    for his family in Armenia, as roughly sixteen thousand other Syrian-Armenians,
    when the Syrian Civil War began in 2011. Compared to the customs officers’ unfamiliar
    Eastern-Armenian dialect and Russian-influenced accents, George’s soft-spoken
    Western Armenian made it easy to convert. With a “Yalla!” he drove us to Marriott
    in Republic Square, promising to return later that week for our tour of historical
    sites.


    The realization of being in the land where our ancestors once walked, loved, and
    struggled overwhelmed me. Everything felt new familiar. It didn’t take long for
    me to understand why a growing number of Western Armenians had repatriating or
    spending extended periods visiting this small country of three million. Armenia,
    young in its independence, symbolized resilience and hope. Since the introduction
    of dual citizenship in 2007, initiatives like Birthright Armenia and Repat Armenia
    have inspired youth and entrepreneurs to invest in nation building. The 2018 Velvet
    Revolution, a peaceful citizens’ movement demanding democratic governance, ignited
    a new vision of Armenia, appealing to the diaspora''s youth to shape its future.
    The allure grew as Kim Kardashian and other Armenian celebrities flocked to Yerevan
    to help showcase our modern traditions to the world, and maybe more importantly,
    to prove the next generation that rebuilding Armenia wasn''t just vital — it was
    cool. Now, seeing the awe on my son''s face, gave me hope that, he might come
    again here on his own accord.


    On our first daylight exploration, my son and I climbed 750 limestone steps to
    look over this stunning city from above the Cascade. Halfway up, a hillside speaker
    played French-Armenian crooner Charles Aznavour’s “Here Encore.” We soon discovered
    the tunes were coming from a museum dedicated to the recently deceased chansonnier.
    We twirled with joy, the sun beaming on our jet-lagged faces, our iconic Mount
    Ararat in the distance, and at that moment, Armenia felt like Disney World for
    the diaspora. I was living Deede’s dream in real time.


    I''d never experienced a city where everyone, even the statues, looked like family.
    Sure, the popular look for women was Kardashian Karine from the Ladies Auxiliary
    church group, but seeing short-statured, dark-haired, big-nosed people like me
    all around was a revelation. Who would I have been if I''d grown up here? So many
    of my teenage struggles came from my desire to assimilate. Torn between the culture
    of my homeland and my motherland, I constantly rebelled against the latter. Home
    felt like a museum that preserved old Bolshay traditions, where I had to be a
    “lady,” speaking only Armenian, serving me first at dinners “out of respect,”
    and preparing for my future as the Armenian bride and mother I was expected to
    grow up to. Against the push to be a good, traditional first-born daughter, I
    felt pulled to “just be like everyone else” until the door burst and I could breathe
    — the only way to experience Canada was never to be home. But now, staring at
    centuries-old Armenian artifacts, I found myself imploring them to reclaim me
    — their lost daughter who had carelessly discarded parts of her priceless heritage
    with youthful arrogance.


    I could see the effects Armenia was having on Mom, too. Seta had practically reverse-aged
    overnight, insisting on strutting down Yerevan’s streets in search of a talked-about
    light show while the rest of us were ready to call it a night. I watched in awe,
    her elderly body moving with the confidence of a woman with incredible history,
    tossing her scarf elegantly over her shoulder to let you know it,


    The following day brought new adventures to Shant, George’s young colleague, chauffeured
    in a spacious vehicle to explore remote sites. Shant played vintage Armenian classics,
    putting Mom in a lively, relaxed mood as she sang along the smooth sounds of Adiss
    Harmandian. On our way to visit UNESCO-protected churches and monasteries, we
    rolled grassy hills, dotted with steep or protruding masses of black obsidian.
    Hits of beauty were abruptly interrupted by eerie, half-built subdivisions and
    gas stations when Russia switched from diesel to petroleum, though the infrastructure
    had come down with the Berlin Wall.


