  - '[PAGE 138]


    The host, my aunt Vanessa, turned the television toYouTube. She started to input
    letters in the search bar.


    I could bet what was coming. Only one song played nonstop in the house before
    the family split. "Nani Wine," a soca classic, was my grandmother’s favourite.
    The fast, percussive beat would summon the family wherever my grandmother was
    to dance and sing along. I looked at Vanessa ascance, unsure if the song would
    retain its magic.


    A aunts and uncles tapped their feet when "Nani Wine" blared. Vanessa noticed.
    She teased over the noise, "Ai si you memba dehnya sang. I know you remember these
    songs."Memba dehndeh day z Bileez wen mi-di daans ain sinh ain w ain ting? she
    said while following the song’s instructions and twisting her waist like it was
    wire. "You remember the days in Belize when we used to dance, sing, wine, and
    stuff," she said.


    My aunts and uncles stood up and bobbed their heads by one. Before too long, my
    generation stepped to the middle of the room and swayed to the beat.


    My mother eventually joined the crowd and blurted the chorus, "Nani wain dong
    low. Nani wain dong soh."


    Kriol’s rhythm was buried deep. It was time to resurrect it.

    I scoured the Internet for a Kriol tutor. Unlike mainstream languages, Belizeans
    only heard Kriol at home. Newcasters didn''t speak in it, journalists didn''t
    write in it, and teachers didn''t teach it in. There were no Google translations,
    movies with Kriol subtitles, or Rosetta Stone compact discs.


    Fortunately, I found Kriol classes offered by a mid-fifties cab driver living
    in Belize City. I started weekly classes on Skype. I learned words of the day,
    proverbs, and syntax in class on social media as I followed Belize missives about
    appropriate slang for someone my age, classic songs any my prideful Belizean knew
    by heart, and how to flirt, joke, and curse in Kriol.'
  - '[PAGE 139]


    I loved the way Kriol sounded. I adored its melodic lilt, bombast, and mixture
    of English, Spanish, Garifuna, and Mayan influences.


    My interest in learning Kriol amused my mother. Apparently, I had ashamed of it
    as a child. She reminded me, “Yu mi seh wee mi-di taak foni.” You said spoke funny.


    Perhaps the shame my mother perceived was because I couldn''t talk Kriol back
    to my grandmother when she asked how school was, or during a rowdy family game
    of Po-Ke-No. I''d sigh out an answer in English. As I learned Kriol as an adult,
    I stopped referring to it as Broken English. There was nothing broken about our
    language to me.


    Late into the reunion, my mother''s fake dinner plans if things got awkward, we
    said goodbye.


    How would I connect to my family and country as time passed after my grandmother''s
    death? I couldn''t recount old memories — I had a few. I couldn''t just listen
    to coca songs — I didn''t know many of those, either. There was no nostalgia to
    grasp. From those destroyed homes homesick.


    I remembered a YouTube video from Kriol class. Two Belize girls teach Kriol slang.
    One introduces the phrase “gaahn awf.” The other explains: “If your friends played
    in a game well, you tell them, ‘Unu gaahn awf!’” The girls, mestizo for Vanessa
    and my mom, sounded like them. In my mind, I saw Vanessa and my mom playing in
    the grassy yard of the cottage, high-fiving the other after winning Po-Ke-No.
    ‘Wee gaahn awf damn!’ my mother cheers.


    In another video, a Belize fashion designer explains Kriol saying. She looks to
    be in her twenties, the same age my grandmother was when she left Belize.


    The fashion designer introduces the next phrase: “When someone looks nice, we
    say ‘Yu noh eezi.’ She stretches out the first syllable of the Kriol word for
    ‘easy.’ Eeeee-zi. I heard my grandmother saying Yu noh eeeee-zi to my mother,
    twirling in a frilly dress my grandmother sewed.'
  - '[PAGE 140]


    mother goes to the school dance. “Nani Wine” booms. She puts her long fingers
    over her button nose and full lips while she wain dong low. I could imagine her
    because she gave me the same features. She was not easy at all.


    Through Kriol, I could go back. I could go to places I''d never been and see things
    I never was. By speaking the language kept only for family, I could gain a piece
    of the identity for which I''d yearned. I could go home.


    I recently called my mother out of the blue. She answered in English.

