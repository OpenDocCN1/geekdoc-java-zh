    # Hooky in

    t Homeland


    “Are you going to Friday prayer?” asked Amal, my grandparents’ caretaker. I looked
    at Teta and Gido sitting beside me on the balcony I considered my options. I''d
    arrived last night and felt it too soon to offend my elders and start rumours
    about myself, the heathen Canadian, so I said sure. “Good,” she said, “I’ll leave
    you some hot water so you can make wudu.”


    I needed to freshen up after a day of travel, anyway, and was eager to explore
    my family’s hometown, something I’d never done before. It was my first trip to
    Lebanon in eight years and my first as an adult. Fresh out of college, I planned
    to spend the previous summer here to figure out what, if anything, I could do
    with two certificates from two separate colleges and little life experience. I
    was prepared to extend it a year if time allowed it. But six days before my departure
    flight, on July 12, 2006, Hezbollah militants instigated a war with Israel, whose
    government retaliated with predictable cruelty; in addition to killing civilians
    and wiping out entire families, the Israeli Defense Forces targeted civilian infrastructure,
    including runways at Beirut’s Rafic Hariri International Airport — which had been
    renamed in honour of his prime minister assassinated by an agent of Hezbollah
    with suspected Syrian backing. So, instead I spent that summer educating myself
    in Middle Eastern history, psyching myself up for the rescheduled trip a year
    later, and enrolling in yet another — my third in three years.


    People told me I was crazy or brave to still go, but if not that summer, then
    when? The situation, I agreed, would likely get worse before I got'
  - '[PAGE 91]


    better — but would get better while I was still wandering young adult convinced
    that my hidden potential lay dormant in the homeland? Well, at least shave your
    beard, advised an uncle before I left, concerned that I''d be mistaken for a Shiite
    — i.e., Hezbollah sympathizer — especially in Kab Elias, our predominantly Sunni
    with some Christian neighbourhoods in the foothills of Mount Lebanon. I told him
    never; my beard had been my defining feature since the ninth grade. It signified
    my proud Middle Eastern identity in defiance of anyone who, joking or not, call
    me a terrorist, and if I''m being honest with myself, in defiance of my own failures
    to embrace my heritage. Abstaining from alcohol and reading Arabic was hard, but
    I could still distinguish my Arabness with basic grooming.


    The advice continued after landing in Beirut. My uncles and cousins reprimanded
    me for my beard on the drive from the airport the night before, and I''d heard
    it again from Amal and my grandparents on the balcony — upped my motivation to
    get dressed and get going.


    With a slim digital camera and notebook in my satchel, I bid them goodbye. I never
    intended to go to Jumah; I planned to see തന്നെ, revisit childhood memories, and
    return home after prayer finished.


    My first order of duty was to buy cigarettes for a fraction of the cost that they
    were in Canada. I stood in line behind a kid who couldn''t see over the counter,
    yet could buy a pack of Viceroy for his dad (one hopes). Not recognizing any of
    the brands myself, I asked for the same when it was my turn. The clerk, who I
    vaguely remembered as a distant relative named Karomi, “You’re Ahmed Moualleem’s,”
    he said, then proceeded to remind me how chubby I was in the seventh grade. “Look
    at you. You’ve lost weight.” Karomi dragged his knuckles across his cheeks. “What''s
    this? You look like a terrorist.” We laughed about it and caught up for long as
    my limited Arabic allowed, and then I was on my way.


    I didn''t get far before running into Ghassan, another distant cousin, who used
    to own a billiards and arcade room. Once, when I was seen, walking around his
    store, my foot slipped out of my flip-flops onto a sharp, rusty dustpan and was
    sliced open. Ghassan rushed me to the hospital for stitches and a tetanus shot.
    Fifteen years later, it was the first thing he remembered'
  - '[PAGE 92]


    about me. I offered to show him the scar, but he was busy looking for his cat,
    so beautiful, she was, that, Ghassan was convinced someone had stolen her.


    I suggested he print posters of her and offer a finder’s reward. Ghassan liked
    the idea and asked me to help make some posters. He took me into his house to
    choose a picture from his son’s computer. While his son booted the computer up,
    I scanned the teenager’s bedroom walls. Amid of posters of Brazilian soccer all-stars,
    there were pictures of Hezbollah leader Hassan Nasrallah with his fist raised.
    Three flags sunk down the ceiling — Lebanon, Brazil, and the yellow Hezbollah
    emblem with the A in Allah rising up to a machine gun. You’d never see these decorations
    outside of Shi’s home a year or more ago. Many, if not most, of my relatives in
    Kab Elias have portraits of Rafic Hariri or his prodigal son, Saad. Nasrallah
    was a parasite to them. The 2006 war was changing his public image. Creeped up,
    I wanted to leave, but first I had to survive a hundred pictures of his kitty,
    and each time, had to remark on how beautiful she was. The call to prayer mercifully
    intervened. Ghassan offered to take me with him to mosque, but I said I needed
    to run home and make wudu first.


    “Hurry,” he said, “there’s not much time.”


    On the way out I saw another Nasrallah picture, framed and mantled where most
    people keep family photos. Ghassan caught me glancing at it, and smiling tenderly,
    said, “You look like him with your glasses and beard.”


    I slipped into the procession of worshippers walking through traffic, then slipped
    out at the last intersection before the mosque. It didn’t take long to reach the
    outskirts of Kab Elias. I wandered the industrial area toward a strip of undeveloped
    land and unfinished family apartments representing the unrealized dreams of emigrés
    like my father, who left Lebanon vowing to return. They bought the land, started
    building, and either ran out of money or changed their minds. For my father, it
    was the latter, and his dream project never broke ground. I saw the empty plot
    on'
  - '[PAGE 93]


    the highway (pointed out to me by my uncle the night before). In my lifetime,
    its only use was as a parking lot for tanks by the occupying Syrian army, until
    mass demonstrations following Hariri''s assassination pressured President Bashar-al-Assad
    to end the twenty-eight-year-long occupation.


    I paused to photograph an Arabic stop sign, thinking it might earn me some traveller
    clout if I posted it on Facebook. As I took photos from different angles, a mechanic
    across the street came toward me, shaking a big wrench. “Ey!”


    I looked at him, then behind me, around me, and back to him.


    “Ey! Come here!”

    I waved at him happily, stupidly, which had the intended effect of chilling him
    out.


    “Where are you from?” he asked.

    “Canada.”


    “Canada?” he asked, instantly friendlier. “What are you doing?”

    “Just taking pictures of things for my friends.”

    “No, here in Kab Elias. What are you doing?”

    “Visiting family.”


    “What bay are you from?” His eyes lit up when I told him which household. “Bayt
    Mouallem! Are you Ahmed Mouallem’s son?”


    Suddenly, he’d forgotten that I was a suspected national security threat. With
    a vigorous handshake and a hearty “Ahlan sahlen,” he welcomed me back home.


    The whole exchange lasted a minute, but prepared me for the next time I took out
    my camera not much later. It was a cemetery that caught my eye on account of the
    curious graffiti on it: a bunch ofing addresses spray-painted for reasons I didn’t
    understand but found terrifically hilarious. Unfortunately, though, the hilarity
    was hard to explain to the barber in the adjacent building. He jumped down his
    steps, got right in my face, and demanded that I tell him who I was and what I
    was doing. With my wretched Arabic, I could only describe my fascination with
    the wall as, “It laughs.”


    “The wall laughs?” he asked, baffled.'
  - '[PAGE 94]


    “Yeah, the emails on it. We don’t do that in Canada.”


    “You’re not Lebanese.”


    “No, not Lebanese. Canadian,” I said. “From Bay Mouallem. Son of Ahmed Mouallem.”


    “Mouallem! My son married a Mouallem. In Canada, too. Do you know her?” He mentioned
    her name, and indeed I knew her very well. We grew up together in northern Alberta.
    As I connected my family trees, his grin suddenly inverted, as he appeared distracted
    by a concerning thought. “Why did you say you are not Lebanese?” he asked.


    “I’m Lebanese here,” I said, pointing to my head. “And I’m Lebanese here,” I said,
    pointing to my heart. I pointed to my lips and said, “But here, I’m not so Lebanese.”


    He laughed. “I can hear that.” The barber advised that I be careful walking around
    alone with my camera — and beard. Times are tense, explained. People will think
    I m a spy.


    I decided my fellow Sunni Muslims were too paranoid and nosy, so I started uphill
    hiking up the Maronite community, but all along the way, and even once there,
    I scrutinized with what felt like more intensity. The eyes of deceased soldiers
    staring back at me in photos adorning saintly shrines did not calm my nerves.
    People behind me whispered, “Who’s that?” which prompted me to do something completely
    benign like talk to wild chickens, so that, at the very least, they’d think I
    was a “simple” terrorist.


    The only people who seemed not to give a shit were two soldiers on foot. “Marhaba,”
    I said as we crossed paths. They nodded their heads in unison with the bearded
    spy and kept walking.


    The view of the Bekaa Valley was spectacular. The red tops of the buildings stretched
    into farmland, then another small town just like it, the Anti-Lebanon Mountains
    bordering Syria. From the speakers in the minaret hundreds of metres below, I
    heard the Friday sermon and prayer wind down. A crowd spilled out of the mosque
    and now it was time for everyone to return to work or home, myself included.'
