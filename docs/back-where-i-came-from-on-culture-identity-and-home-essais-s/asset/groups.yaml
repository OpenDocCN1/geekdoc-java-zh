    On the red-eye to London Heathrow, my sister drowns her sleeping pills in white
    wine and passes out mid-dinner. For nine long hours, my father and I toss and
    turn against each other under our airline blankets.


    Oslo is a gorgeous harbourside whose edges recede into forests and mountains,
    unlike Vancouver. Although the Oslo I experience is filtered through my tick-tocking
    vision and my unease is heightened by jet lag, The massive nineteenth-century
    vessels at the Viking Ship Museum conjuring bodies pulling oars in stormy seas.
    In Frogner Park, Gustav Vigeland''s outdoor granite sculpture, *The Monolith*,
    is a tower of desperate, naked humans scrambling over one another to reach the
    sky. At every café the coffee is black rocket fuel that has my hands trembling.


    At the Munch Museum, we watch a short film about Edvard Munch. Losing his mother
    and sister as a child set the tone for his life and work. He was anxious, depressed,
    agoraphobic, obsessed with illness and death. In the gallery, I absorb the churning
    waters and agitated skies of Angst Nordic winters. If any nineteenth-century Norwegians
    had SSRS. Although I can''t be smug, with my half-Scandinavian genes, my decades
    lived in the grey light and perhaps drizzle of British Columbia. Outside the museum
    is a large golden frame and we take a turn standing inside it, slapping our cheeks
    and making our mouths into silent Os — Instagram-ready versions of *The Scream*.


    Four days in Oslo and our circadian rhythms are still out of sync. We find three
    each other at odd hours in our Airbnb’s kitchen — my father in his ruffled sleep
    clothes, my sister with dark circles under her eyes. We consult maps, find where
    to collect our rental car, plan our road trip to the ancestral village. “My shoulder,”
    Dad says. He windmills his left arm in the dim light. “It’s probably angina.”


    My sister gives me a look. “You probably slept on it,” she tells him.


    My grandfather’s hometown in the western fjords is a five-hour drive from Oslo,
    but it’s missing from our *Lonely Planet* guide. We’re dazzled by each landscape
    we move through — desolate tundra that drops into a valley of prematurely bronze
    birches, shorefront cottages with electric sod'
