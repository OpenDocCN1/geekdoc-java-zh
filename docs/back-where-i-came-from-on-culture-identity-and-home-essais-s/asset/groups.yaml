    you taking the ferry to come back?

    I would pull her pocket-sized ferry schedule from its spot beside her land line,
    and wobble through the Cantonese numbers on my fingers, yat-zee-sam-say-mm-look-tzat-but-gau
    to land on gau. “Gau deem dap shun.”nThe 9:00 p.m. big ferry.


    Over my many visits, I usually come to prefer the big ferry. It’s slower, and
    takes an hour to get from Hong Kong Island to Cheung Chau. I love sitting in the
    last row of seats on the open-air deck at the back of the boat. Sipping over syrup
    lemon tea on the onboard vending machine. Watching the tiara of Hong Kong’s lights
    soften into the distance as the boat slips back through the slick water.


    In my late teens and early twenties, as a fresh backpack, I thought I knew how
    to travel. To travel was to pack a backpack with a guidebook and the essentials,
    to pass through new places, navigate the unknown, gather experiences, and return
    home changed by it all. Maybe seems obvious to say, but I wonder now if my trips
    to Hong Kong were more about visiting. My map of Cheung Chau and Hong Kong is
    woven from threads of memories and experiences. Travelling and visiting overlap.
    To visit is to be picked at the airport, to bring oranges, to be offered cold
    lemon tea. To be a good guest, to be accountable, to maintain relationships.


    # 2018


    Because Pau Pau lived past ninety, they call it a 笑衰 smiling funeral. After the
    funeral, the sky lights up. In the final funeral rite, we are the last to jump
    over the fire and splash our faces with pomelo leaf water. We wash our hair, and
    switch the blue flowers for red ones. My sister and I put on newly purchased,
    loudly colourful clothes. Today, the ugly duckling self-consciousness I usually
    feel feeling about being the sweaty, clumsy Canadian among my matte, sleek Hong
    Kong cousins is nowhere to be found. I proudly wear my red floral shirt and forest
    green pants to the hotel lunch that marks the end of my Pau’s funeral festivities,
    knowing she would approve.'
