  - '[PAGE 133]


    journalists. One of them asked some of the tourism representatives if they had
    any accommodation recommendations for Mumbai, the city we were headed to next.
    The representatives assumed that the journalists were looking for complimentary
    accommodations. Speaking to each other in a local dialect I can understand, they
    warned against making any promises to these journalists. I chuckled to myself,
    realizing they thought of me as a foreigner, too, or at least someone too severed
    from her Indian origins to understand the local dialect.


    Being between homes means you’re always adapting and merging between cultures,
    making a new home of your own so much that, at times, even the locals can’t spot
    you.


    I once asked the owner of an Indian restaurant in Calgary, “Don’t you ever want
    to go back?” This was something I asked often, curious about why others hadn’t
    moved back yet.


    “Canada is a sweet beehive,” she said. Sticky, sweet, entangling. “Once you come
    here, you stay,” she added as she filled a cardboard container with laddus.


    Going back to India is now bittersweet. The Arabian Sea still calls to me, and
    seeing familiar faces on the street makes me feel at home Yet, while my favourite
    sweet shops are still there, my grandparents who bought the laddus for me aren’t.
    The streets are busy, but the homes are emptier. I could join the workforce, more
    easily than ever, but am not if my values would fit in. I’m entangled in the beehive.
    There’s the sweetness of Canadians, a country where apologetic demeanour I’ve
    come to adore. There’s the stickiness that often rises when I smell some marigolds,
    or bite into a soft piece of naan, wanting to move to India, but wanting to stay
    in Canada more. There’s the entanglement of loving my life in Canada now, like
    wearing an outfit that feels really well, but never forever.


    So I make chai in the mornings, boiling your tea leaves until they’ve given it
    their all, and then sit back and relish all the good parts of the move, of which
    there are many. We can never fully go back to where we came from, but isn’t that
    always true for everyone?'
  - '[PAGE 134]


    # Find Your Way Back


    Your mother tongue is your window into the world.


    > — Ngũgĩ wa Thiong’o, Between the Covers podcast


    “Will you go to Belize with me?” I asked my mother while she made panades in her
    kitchen. I had a free summer before starting law school. Friends had invited me
    on trips to Belize during spring break, but I always declined. I’d never been
    and couldn’t go without my mother, who was all I knew about the country my family
    had emigrated in the seventies, thirty years before I asked her to take me.


    She raised her eyebrow and returned to the panades. She scooped tuna out of a
    can onto a disk of masa. “Mek Ai tink bowt dat,” she said in Kriol, Belize’s mother
    tongue. Let me think about that.


    Nobody talked about going back to Belize when I grew up in California in the nineties.
    While many immigrants longed to return home only for a visit, my family did not.
    My family came to the States to get green cards, not visas. They wanted to be,
    and permanent residents.


    They looked forward. Returning to Belize was going in the wrong direction. Back
    to a crowded two-bedroom cottage. Back to working in grade school back to military
    turmoil, as the colony fought for its independence from the U.K., and the attendant
    sexual violence by soldiers that was the price of self-determination.


    My mother waited a week before my first trip to tell me she couldn’t go. “Ai chrai
    bout Ai deh eena di ra main fin go deh,” she admitted. I tried, but I’m not in
    the right mind to go there.'
  - '[PAGE 135]


    She had no desire to revisit the chaos she had barely escaped.

    Disheartened, I told her I''d go alone and stay with distant relatives.

    She dropped me at the airport. I hugged her and whispered, “I hope you’ll be able
    to go back one day.”


    I guled the thick air as I walked toward the Philip Goldson International Airport
    terminal. While other passengers choked on the humidity, my lungs seemed to have
    breathed this air before.

    A cab ride later, I tapped on my grand-aunt’s house door. A younger version of
    my grandmother answered. She welcomed me into a living room with people resembling
    my mom and her siblings. Same Indigenous almond eyes, coarse hair, and clay-red
    undertones. Same mestizo coils, freckles, and endless eyelashes. Same Creole cheekbones
    and mahogany skin.

    They hurried me to the couch and peppered me with questions. I answered them in
    English. They looked puzzled and asked more questions in Kriol. With each of my
    responses in English, their excitement faded.

    I assured them I could understand Kriol. I just couldn''t speak it. “How do mi
    hnap? You do noh Bileezyan?” they asked. *How did that happen? Aren''t you Belizean?*

    I exhaled as my grand-aunt called us to the table, relieved that I would not have
    to find an answer to those particular questions. I heaped spoons of stewed chicken,
    rice and beans, plantains on my plate while I let the breezy, melodic Kriol around
    the table me away. A cousin for more plantains.

    “Now wat da ‘plan-tain?’” he imitated my phonetic pronunciation of ‘plantain.’
    “Daan-tin,” she corrected, shortening the last syllable where I had elongated
    it.

    The table laughed about those da farain — *foreigners*. I shrank in front of people
    who may have looked identical to me, but were strangers.

    It was time to learn Kriol. I needed to figure out where to begin.'
  - '[PAGE 136]


    My grandmother spoke Kriol with her children while they raised my generation in
    the States, but they didn’t teach us how to speak it. They locked Kriol away.


    For most of the country’s history, Belizeans called their language “Broken English.”
    They were taught Kriol, their native tongue, was inferior to European colonial
    languages. It was considered a degenerate version of English that originated with
    enslaved Africans who mixed up their native African languages with English when
    speaking to their captors. Belizeans were banned from speaking Kriol outside the
    home, whether the home was in Belize or elsewhere. In my household in the States,
    Kriol had no place.


    Since Kriol had no role in my success in the U.S., I never asked to learn to speak
    it. By the time I realized it wasn’t a bastardized version of English, but rather
    a full-fledged language of its own, I was away in college on the East Coast, and
    it was too late to practice speaking it.


    My classmates knew me as a Black girl from California. Only when people questioned
    if I was “regular Black” did I reveal that I was Central American.


    A Central American identity was as specific as I got until a student in history
    class said Belizeans were the same as Jamaicans. I chimed in, “No. We’re our people
    with our own culture.”


    My friends gave me quizzical looks and fired off questions. “You’re from Belize?”


    “What are people from Belize called?” “Aren’t y’all Spanish or something?” “Are
    you related to Shyne?”


    I answered most questions. But when I shared that one of the languages spoken
    in Belize was Kriol, and they motioned for me to say something, I didn’t even
    attempt. I couldn’t do it.


    Not being able to speak the language made me feel like a fake. But Kriol reminded
    me of the heritage from which I was estranged, of the past my family left.'
  - '[PAGE 137]


    So, I put it away. I stayed silent during future academic discussions about Caribbeans.


    My grandmother passed away during the COVID-19 pandemic. My siblings and I begged
    my mother to go to Belize with us and her grandchildren. She obliged us, not wanting
    her grandkids to miss out on going to Belize with their grandmother as we had.


    It had been fifty years since her mother had set foot in Belize. We stayed in
    a hotel in Belize City, the country’s capital, where my family was from. My mom
    didn’t talk much. She waved off the constant questions about what it was to return,
    what was different, and what was the same.


    She had no clue. She had blocked out her traumatic life in Belize.


    I tried to lift her spirits by visiting the main street where we grew up. Tall
    grass covered the lot where her childhood house once stood. City officials had
    to tear it down to make way for a cemetery. I looked at the lot blindly. I had
    never been there or seen pictures. I had nothing to miss.


    After the trip, I prodded my mother about the next one. She cut me off.


    Returning to the motherland with my own mother mother didn’t show me where I belonged.
    The family home was a graveyard. There was nothing to miss.


    One of my aunts organized a family reunion in the house we grew up in for my grandmother’s
    first heavenly birthday. Only the family matriarch could get all fourteen of us
    together. As many immigrants from developing countries do, we lived packed together
    in a small house in California until a family fight turned into a two-decades-long
    fissure beginning in 2000. All of the adults experienced an aunt moved out with
    their children in tow while my grandmother and aunt stayed in the family home.


    I looked around the room, wondering how we had gotten here. The guests checked
    their phones. An hour had passed, and we were past the distraction of food and
    pleasantries.'
- md: '

    The host, my aunt Vanessa, turned the television to YouTube. She started to input
    letters in the search bar.


    I could bet what was coming. Only one song played nonstop in the house before
    the family split. "Nani Wine," a soca classic, was my grandmother’s favourite.
    The fast, percussive beat would summon the family wherever my grandmother was
    to dance and sing along. I looked at Vanessa as once, unsure if the song would
    retain its magic.


    Aunts and uncles tapped their feet when "Nani Wine" blared. Vanessa noticed. She
    teased over the noise, "Ai si you memba dehnya sang. I know you remember these
    songs. Memba dehndeh day z Bileez wen mi-di daans ain sinh ain w w ain ting?"
    she said while following the song’s instructions and twisting her waist like it
    was wire. "You remember the days in Belize when we used to dance, sing, wine,
    and stuff," she said.


    My aunts and uncles stood up and bobbed their heads by one. Before too long, my
    generation stepped to the middle of the room and swayed to the beat.


    My mother eventually joined the crowd and blurted the chorus, "Nani wain dong
    low. Nani wain dong soh."


    Kriol’s rhythm was buried deep. It was time to resurrect it.


    I scoured the Internet for a Kriol tutor. Unlike mainstream languages, Belizeans
    only heard Kriol at home. Newcasters didn''t speak in it, journalists didn''t
    write in it, and teachers didn''t teach it in. There were no Google translations,
    movies with Kriol subtitles, or Rosetta Stone compact discs.


    Fortunately, I found Kriol classes offered by a mid-fifties cab driver living
    in Belize City. I started weekly classes on Skype. I learned words of the day,
    proverbs, and syntax in class on social media as I followed Belize missives about
    appropriate slang for someone my age, classic songs any my prideful Belizean knew
    by heart, and how to flirt, joke, and curse in Kriol.


    I loved the way Kriol sounded. I adored its melodic lilt, bombast, and mixture
    of English, Spanish, Garifuna, and Mayan influences.


    My interest in learning Kriol amused my mother. Apparently, I had ashamed of it
    as a child. She reminded me, “Yu mi seh wee mi-di taak foni.” You said spoke funny.


    Perhaps the shame my mother perceived was because I couldn''t talk Kriol back
    to my grandmother when she asked how school was, or during a rowdy family game
    of Po-Ke-No. I''d sigh out an answer in English. As I learned Kriol as an adult,
    I stopped referring to it as Broken English. There was nothing broken about our
    language to me.


    Late into the reunion, my mother''s fake dinner plans if things got awkward, we
    said goodbye.


    How would I connect to my family and country as time passed after my grandmother''s
    death? I couldn''t recount old memories — I had a few. I couldn''t just listen
    to coca songs — I didn''t know many of those, either. There was no nostalgia to
    grasp. From those destroyed homes homesick.


    I remembered a YouTube video from Kriol class. Two Belize girls teach Kriol slang.
    One introduces the phrase “gaahn awf.” The other explains: “If your friends played
    in a game well, you tell them, ‘Unu gaahn awf!’” The girls, mestizo for Vanessa
    and my mom, sounded like them. In my mind, I saw Vanessa and my mom playing in
    the grassy yard of the cottage, high-fiving the other after winning Po-Ke-No.
    ‘Wee gaahn awf damn!’ my mother cheers.


    In another video, a Belize fashion designer explains Kriol saying. She looks to
    be in her twenties, the same age my grandmother was when she left Belize.


    The fashion designer introduces the next phrase: “When someone looks nice, we
    say ‘Yu noh eezi.’ She stretches out the first syllable of the Kriol word for
    ‘easy.’ Eeeee-zi. I heard my grandmother saying Yu noh eeeee-zi to my mother,
    twirling in a frilly dress my grandmother sewed.


    mother goes to the school dance. “Nani Wine” booms. She puts her long fingers
    over her button nose and full lips while she wain dong low. I could imagine her
    because she gave me the same features. She was not easy at all.


    Through Kriol, I could go back. I could go to places I''d never been and see things
    I never was. By speaking the language kept only for family, I could gain a piece
    of the identity for which I''d yearned. I could go home.


    I recently called my mother out of the blue. She answered in English.

    I cleared my throat and relaxed my tongue into saying, “Gud maanin Wats op?”


    Her pause worried me. Maybe she needed to be in the mood for language practice.
    She spoke Kriol for my sake, but returning home was challenging. She had to be
    in the right mind.


    Then she spilled, “Oah gyal Ai fain. Laad, mek Ai tel yu wat mi hapn ada day.”
    Girl, I''m fine. Lord, let me tell you what happened the other day.


    Her voice light. I heard her reach a part of herself that had been distant for
    too long. She was back dancing and playing under the Belize sun.


    Her ease put me at ease. I answered, without as much effort as in Kriol class,
    “Gyal, mek shoar yu mee evriting!” Girl, make sure you tell me everything!


    She giggled while gossiping about her neighbours. I baited her for more dirt in
    almost perfect Kriol.


