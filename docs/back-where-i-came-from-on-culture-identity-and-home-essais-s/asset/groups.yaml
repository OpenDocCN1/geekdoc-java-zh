    have been no visiting relatives, no sight-seeing, no shopping. So instead,

    we''re out for a hike. The sky is a brilliant blue. There are no swimmers in

    the water today. We see the aftermath of Typhoon Mangkhut: streetlights

    tilted at jarring angles, the paved road leading to the helipad twisted

    metal and broken concrete. Had the road not been twisted up, this is where

    Pau Pau would have been transferred out of the ambulance to be flown to

    the bigger hospital on Hong Kong Island. They had to drive her to a sports

    field to catch the helicopter.


    I always assumed my Pau Pau never saw me as Chinese. With my barely

    passable Cantonese, with mixed-racness, my gwai lo father, with Canadian

    upbringing.


    My first-generation Hong Kong immigrant mother and fifth-generation

    Irish-Canadian settler father didn''t know how to raise us to talk about race.

    Were we raised to really think of ourselves as Chinese. I''ve often

    wished I could be better at thickening my skin to the mixed messages I''ve

    internalized about my identity. In elementary school, I couldn''t keep up

    with my Cantonese-speaking classmates on the playground. Yet I''d go to

    after-school Chinese calligraphy class and Chinese summer camps, and

    most of our meals were out in Edmonton''s Chinese and Chinatown

    restaurants. As an adult, many a white stranger compelled to tell me

    about their Asian wife or trip to China, before learning anything else

    Chinese. Chinese relatives sometimes ask if I can use chopsticks. Sinophiles

    have boasted about how many Chinese characters they''ve

    memorized, and expressed surprise that I have far fewer in my repertoire.

    Fellow Chinese diasporic friends have let me know that I''m not really

    Chinese because my parents didn''t keep their extra garbage bags in the

    dishwasher, or don''t know the difference between how to pronounce

    mustard (gaai laat) and greens (gaai aan). As an adult, I''ve had white

    colleagues in a workplace lunchroom wrinkle their nose at my tofu.


    2011'
  - '[PAGE 35]


    When I was in my mid-twenties and had just finished my undergrad, I decided to
    take my savings and journey “back” to the motherland. I thought it would be a
    way of rooting myself, to find my way out of the cloud of identity confusion and
    discomfort in my own skin that had been experience as a mixed-race Asian woman.
    To help me self-locate in relation to living in settler-colonial Canada, the place
    I called home, as a non-white settler, whose ancestors had migrated from other
    British colonists, bought a one-way plane ticket to Hong Kong, and made a loose
    plan. I''d live with Pau Pau for a while, learn more Cantonese and Mandarin, maybe
    find a job, maybe volunteer on an organic farm, and in doing so, voila! I became
    more Chinese. My mother arranged that I would pay Pau Pau a small amount each
    month for “electricity.” I hung out for a few months and overstayed my welcome.
    I thought I had designed a self-directed, study-abroad session where I would learn
    from my elders, connect with my roots, and reclaim my culture and language. Instead,
    it was awkward, fumbling time, filled with conflict. I was scolded for the way
    I did laundry (not frequently offensive), for the way I once rested my chopsticks
    on a bowl (upright offensive). Almost daily, Pau Pau would ask, “Why are you here?”


    One month into my sojourn, with Lunar New Year approaching, Pau Pau handed me
    a lycee, a red envelope stuffed with several crisp Hong Kong banknotes. She shooeded
    me out of the house, urging me to go haang gaai 行街 — to go shopping/to go for
    a walk — to buy new clothes for the new year. I wandered down the street to one
    of the boutiques and picked out a cozy navy blue sweater with white polka dots
    and a row of buttons down the back. I got home and pulled it of its crinkly pink
    plastic bag, proud to show her. I''m doing it! Living my culture!


    Her face fell and she sighed loudly, “Ai ya!”


    I had no idea what was going on. She picked up the phone and jabbed in the fourteen
    digits of a long-distance number, muttering, “Your mother didn’t teach you anything.

    ”


    “Wai?” My mom’s sleepy voice answered. It was midnight in Edmonton.'
  - '[PAGE 36]


    Pau Pau spoke rapidly to my mom, intermittently waving her crooked finger at me,
    then handed me the phone.


    My mom explained, “For Chinese New Year, you need to wear lucky colours — red,
    pink, even purple would be okay. But you chose the most unlucky colours. Blue
    and white. These are funeral colours.” I couldn''t have done any worse.


    Pau Pau got her change purse, her umbrella. We were going out. She marched down
    the street to another boutique and jabbed her umbrella at the entrance, telling
    me to go in. I stepped through a heavy plastic curtain, and my eyes landed on
    a bright red sweatshirt jacket. I tried it, and the sleeves came halfway up my
    forearm — I was pretty sure it was not meant to be three-quarter sleeves that
    fit my (relatively gigantic and broad-shouldered) Canadian frame. I glanced at
    it, looking for Pau Pau. She nodded her gruff approval.


    Good enough. *Oh well, I''ll just roll them up.* I bought the sweatshirt. We walked
    around the corner to her favourite wonton place for a quick, affordable dinner
    of steaming wonton meal. All in all, a successful outing.


    On the way home, we passed balconies illuminated by firelight; who still observed
    the traditions were burning paper money in red tins to welcome the new year. We
    bumped into a neighbour pushing a little dog in a shopping cart. We exchanged
    red envelopes, “Sun tay gi hong!”— wishing you health and happiness. The dog put
    its paws together to wish a happy New Year.


