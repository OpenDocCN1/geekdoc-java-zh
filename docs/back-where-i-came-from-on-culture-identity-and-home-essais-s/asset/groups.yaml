    On my way back, I saw a man watching me from his window. He disappeared, then
    reappeared in front of me. I offered my declaration of place, family, and father
    again, but it fell short. So, I told him who my mom was, and as luck would have
    it, they went to junior high together thirty years ago. I accepted his invitation
    for coffee, which seemed sincere at the time, but now think was probably feigned
    hospitality that I was expected to decline. But I accepted.


    Arm in arm, he led me to his apartment, introduced me to his family, then asked
    his son to gather his brother’s family from upstairs. We had a rickety conversation
    about life in Canada compared to life in Lebanon, translated through niece Nadine,
    who was also delegated to cote on me with offerings. Again and again, she disappeared
    into the kitchen and reappeared with a platter of fresh cherries, Turkish coffee
    that she placed in front of me, and refilled before it emptied. Their generosity
    became satirical after I complained about the costs of cigarettes in Canada, and
    how happy I was to buy them for a dollar in Lebanon. “But I don’t know which brand
    is best yet,” I said.


    “Nadine, get him the cigarettes,” her uncle said, embarrassing us both. I assured
    them it wasn''t necessary, but soon Nadine replaced my fruit tray with a platter
    of every cigarette brand. He insisted I try each one. I couldn’t tell if this
    was a teachable moment about the harms of smoking, but I wanted to. One by one,
    I picked a brand, but the cigarette to my lips for the patriarch to light it,
    smoked a bit, sniffed it out, and let him light another. Overloaded on nicotine
    and coffee, I felt light-headed and shaky. I realized the only way to escape their
    hospitality challenge was declaring one brand superior to all others.


    He kindly handed me the whole pack of Lucky Strikes. “It’s yours.” I thanked them
    all for their generosity and promised that I’d drop by again.


    “But shave, all right?” he said, sincerely.

    “I’ll think about it.”


    By the time I was approaching my family’s apartment building, I’d been gone for
    three hours — far longer than Jumah prayers. As I considered my alibi, I spotted
    my cousin walking on one side of the road and his dad driving slowly on the other.
    They seemed to be searching for someone. My uncle stopped the car, hopped out,
    and called for his son. “I see him.” Then he turned to me, looking unusually angry.
    “Get in the car.”


    As far I knew, they weren''t religious, so I couldn''t understand why they cared
    about me playing hooky with Friday prayer. But I did as I was told. My uncle launched
    into tirade. “You’re going around taking pictures? What were you thinking? You
    can’t do that. Do you know what the state of Lebanon is like? People are very
    afraid. They’re looking for anything unusual. And you! You walk around your beard
    and bag and camera. A yellow shirt?”


    I looked down my shirt, and yeah, I guess it was yellow.


    “You look like you’re from Hezbollah!”


    “I do?”


    “Yes, you do! And what else? I go to the barber and he tells me he met my nephew.
    My nephew, yes, taking pictures of a wall. Why are you taking pictures of a wall?”


    “It laughs.”


    “The wall laughs! He thought you were a spy. And what else? You weren’t at prayer.”
    He continued, “We thought for the soldiers saw you and arrested you.”


    “Actually,” I said, trying to hide my amusement, “I did talk to soldiers. Three
    of them. I said marhaba.”


    “And?” he asked, surprised.


    “And here I am.”


    My comedy of errors was practically folklore that summer in Kab Elias, exaggerated
    and elongated with every iteration. Due to my stunted Arabic, I was rarely the
    storyteller. I’d sit silently with a forced grin as people told their versions
    of it. In each case, I was always yelled at by the barber.


    Sometimes I was chased by him. In one inexplicable version, I was spotted talking
    to someone in a red truck, getting in with him, and driving away.


    The rumours were reinforced when the barber himself would come over for family
    dinners. “Hey, it’s your friend,” Amal joked when he walked in. “Nasrallah!” he’d
    call me, then turn his handshake into a citizen’s arrest by pinning my hands behind
    my back while everyone laughed. If teasing me was an elaborate scheme to get more
    clients, it worked. I went in for a shave and was never called a terrorist again.
    At least not in the homeland.


    ## Hungary, 1984


    When my parents got to Canada, they arrived in a country that was not known to
    immigrants as a safe haven. It was a country wrestling with the notion of welcoming
    so many people from another country at one time. The stories from the Hungarian
    Revolution, the romance of freedom fighters tossing Molotov cocktails at Soviet
    tanks, had won over the Canadian public, but there was still the issue of what
    to do when all of these people actually arrived in the autumn of 1956.


    My parents married in Austria, inside a small church by the refugee camp they’d
    been living for a few weeks. This, they learned, would help ensure that they would
    be assigned to the same destination in the Western world. Initially, that was
    the United Kingdom, but refugees at that time were allowed to trade their tickets.
    So, when my mom learned that her two brothers were going to Canada, my parents
    traded spots with two people who wanted the British Isles over the long trip to
    a cold country they knew very little about.


    Once my parents arrived in Canada — a country that did not think of itself as
    a mosaic — they were told they had to learn English or French. A generation of
    nearly forty refugees took it to heart. In Canada, names were changed to be more
    English. A generation of kids were born to hyphenated families who tried not to
    be too Hungarian.


    It was weird to be behind the Iron Curtain, thinking across the ocean “our” missiles
    were pointed at me. Our family vacation felt a little like pointing a gun at our
    own heads. They were preoccupied with not sticking out or being a burden. I''d
    always seen my Hungarian-ness as something I could take on and off, like a coat.
    I went to Hungarian school on Saturday mornings in Toronto''s Kensington Market,
    but the language wasn''t that important to me. It was a chore, like someone being
    forced to attend church to keep up appearances. Today, you''ll go to Hungary and
    find many flags with red cut out of the middle, right where the Soviet star used
    to be until 1990. The message is obvious: it’s saying “never again” to communism.
    But, to me, it also symbolizes our defiance in the face of being forced to do
    anything. I''d argue that there aren''t many additions you could make to the flag
    without being with the scissors — not even a red tin of sweet paprika.


    To be a hyphenated Hungarian means being constantly suspicious of one''s own Hungarian-ness.


    That''s what I''ve come to realize over the years. But, when I was thirteen years
    old, going to Hungary gave up a summer of baseball and hanging out with friends.
    It was a place that wasn''t as exciting as Disney World or even Niagara Falls.


    I made my first visit to Hungary in 1984, at age thirteen, on a big family trip
    with my mom and dad. Reagan was president and the Cold War dominated my thoughts.
    Everyone I knew was totally fucked up by The Day After, a TV movie that educated
    the masses in how we''d burn all and fry within minutes of NATO and Soviet forces
    declaring World III. And, as the film showed us, if you survived the opening salvoes
    of a nuclear war, well, you''d rather be dead. My parents were aghast that I had
    managed to smuggle a Los Angeles 1984 Olympics T-shirt into our luggage, and told
    me that I was in no way going to be allowed to wear that thing in public. After
    all, Hungary was one of the Soviet-Bloc countries boycotting the Games. Advertising
