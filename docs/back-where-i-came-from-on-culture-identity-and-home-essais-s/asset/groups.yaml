    used to dare each other to jump across as children, with the same golden dandelions
    lined around the bank that we used to make flower crowns.


    We made a bonfire in celebration of our family reunion, with five sisters together
    for the first time in thirteen years, on the land that my ancestors roamed with
    pride, and that my father yearned to return to every summer. Now we yearned to
    belong and Every sibling in one corner of the globe. We had learned to read and
    write in one place and became adults in another. I wanted to say how proud I was
    to be their sister and how much courage I felt seeing how they embodied the fragments
    of their identity unapologetically, with honesty. It made me brave to do the same.
    I often wondered if being so far and different made them feel just as lonely as
    it made me feel at times. Even now, with all of us situated on different continents,
    Knew just as well that they had yearned to meet again in the middle. I doubted
    if I would be able to say any of these sentiments without crying.


    In the bonfire, we whispered our prayers and blessings and asked for strength
    from the flames. Under the light of the full moon, we prayed for good fortune
    for our family. I had already started tearing up when my mother shared stories
    about my grandmother who had recently passed, broke down into sobs when she embraced
    me. My father joined, enveloping the two of us, and we cried out all that we kept
    in our hearts.


    In all that time we spent sightseeing, none of us said the words: “I missed you.
    It was hard without you.” And I too had to say, “Look, look what I became, on
    my own! I did it! It was impossible and I did it!” Which coincided with the even
    smaller neglected voice of mine saying, “I’m still small and young, and I still
    need you, doing life without you is not easy.” Being with my family the night
    sky, on our ancestral land, I knew belonged.


    Here it didn''t matter that I harboured guilt for being away for so long, or that
    my Mongolian was dusty, or that, when nervous, I spoke with a blended Indian,
    Canadian, and Singaporean accent. It didn''t matter that I felt responsible for
    the chasm between myself and my family members, as we were never accustomed to
    sharing exactly how we feel, anyway,'
