    kids, they headed to Istanbul, where neither the passports nor the man they had
    paid to procure them ever materialized. Stuck in the former Ottoman capital with
    no money or place to go, their lives as Bolsahays — Istanbul Armenians — began.


    The Armenian-Canadian community I grew up in had little to ties to this new Armenia.
    They tended to belong to other diasporas connected to Iran, Syria, Lebanon, Iraq,
    Ethiopia, and a number of other places our Anatolian Armenian ancestors fed to.
    Because of this, there are now many ways of being Armenian, apparent in the charming
    subtle differences of our slang and recipes — or the language a diaspora pulls
    pulls when stuck for a word. My debe and yalla pulled from Turkish, which was
    often met with judgment for employing the language of our oppressors.


    Possibly the most misunderstood ethnic offshoot, the Bolsahays had to navigate
    a complex identity, integrating Turkish culture for survival while maintaining
    their Armenian heritage. The number of Armenians who never made it out of the
    country that tried to exterminate them is unclear — it’s estimated that 40 to
    80 per cent of the 1.5 million Armenians living under Ottoman rule were killed
    in the brutal and final days of the Empire — but today, a scant sixty thousand
    remain in Turkey. I often wonder what might have been like for my grandparents
    to live knowing their government and neighbours could turn against them.


    Growing up in Scarborough in the eighties, my parents sent my sister and me to
    Holy Cross Armenian Day School, where teachers did their best to make us understand
    Armenian culture, language, and history as more than distant contacts. We had
    a country, this I knew, but that country, established as a sovereign homeland
    in 1917, had been shrouded by the Iron Curtain for the majority of its existence.
    Only the most privileged diaspora folks could access Soviet Armenia. For everyone,
    Armenia was an idea imbued with a sense of duty and reverence — a mandate reinforced
    by parents, family, and our community: that the preservation of our land, its
    language, and culture was of the utmost importance to our survival. But try as
    I might, Armenia, to me, remained a mythical land of ancestral pride that I read
    about in books from far away.'
