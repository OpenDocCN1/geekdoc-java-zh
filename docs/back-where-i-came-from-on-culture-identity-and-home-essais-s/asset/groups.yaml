    square — core meeting place of elderly men in every Italian municipality.


    At eleven, I was chastised for walking through the piazza in midday and entering
    a café-slash-bar-slash-man-cave to buy myself a ghiacciolo, lemon popsicle with
    a licorice stem. Nonno Gennaro interrupted his card game, pulled me outside, and
    explained the etiquette I overook.'
