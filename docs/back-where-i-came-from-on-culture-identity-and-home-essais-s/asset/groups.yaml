  - '[PAGE 86]


    relocating us to Canada, where her brother and his family lived. She wanted to
    give us a fresh start in a new country, unmarried by our messy family history.
    She wanted older brother to rejoin the family. But within the first year of living
    in Canada, she was gone, leaving my brothers and I to contend with our nettled
    relationship with our aunt and uncle. Our presence in their house made us feel
    like an inconvenience. We slept on mattresses in the cold basement and felt keenly
    how much it troubled them that we were there, in their space. Nevertheless, they
    had been generous enough to take us in and by burden of debt rested heavily on
    our young shoulders.


    After five years of living in Israel, Canada was a strange land with strange people
    who apologized for everything and waited in an orderly line and did not speak
    too loudly. The buses ran on time and there was no dog shit on the streets, probably
    due to the extraordinary number of garbage bins everywhere. I landed a retail
    job and my colleagues at work instructed me to change my name to “Lee” so that
    people could pronounce it. Meanwhile, at my aunt and uncle''s house, the tension
    was palpable and I tried best to avoid them. I was also trying, unsuccessfully,
    to avoid my military draft.


    But there I was again. Technically, back on Israeli soil. If they wanted to put
    me on a plane back to Israel, they would have the power to do it. A year and a
    half prior, I had completed the Tzav Rishon — my first induction to the Israeli
    army, a mandatory first step in a country where men have to serve three years
    and women must serve two. But then I had moved to Canada and missed my draft.
    The state wanted me back, claiming me now as “one of ours.” How ironic to be pursued
    by the feeling of not belonging to my home country, its culture and language and
    social customs, only to be ordered by the government to return because, as it
    turns out, despite my faulty Hebrew, my defective ability to assimilate into Israeli
    culture, I was more than Israeli enough to serve.


    My name was called and I was led into a room with a stern-faced, middle-aged woman
    with pale skin and a blond bob accentuating her sharp features. I told her I prefer
    to speak in English, and she proceeded to talk in'
  - '[PAGE 87]


    Hebrew, demanding of me explanations and answers that I could barely find strength
    enough to articulate in English, let alone in the language I had wrestled with
    for the last five years. I took out my documents and showed her the order proving
    that my brother was in my custody. She was not satisfied. She asked me why I was
    her legal guardian, not because she was softening the girl at the other side of
    the desk whose voice was beginning to tremble like a leaf. She asked me because
    she was the state, and unlike my mother, Israel does not let go of its children
    so easily. In a voice as cold as steel, she asked me the single most damning question:
    Where is your mother?


    It was too much. My voice cracked and I began to cry and once I started, it was
    impossible to stop. Her face was impassive. Perhaps she thought I was faking.
    It was just another sob story. She reviewed the paperwork again while I tried
    to compose myself. She had no grounds to hold me there any longer. A woman is
    exempted from service if she has a child or a legal dependent. The embassy spat
    me into the cold, bright day as I was still choking on tears. I walked back to
    the subway station, knowing that I was free, but never truly free from the grief
    of estrangement. My mother and my home country were now lost to me.


    It had been over a decade since I left Israel and I finally decided to return.
    I had a beautiful boy, on the cusp of saying his first words, and it was time
    to surprise my mother and bring him to meet her. I decided to rent a vehicle and
    drive through the desert with my mother. I''d only seen the Negev once, fifteen
    years prior. The vistas unfolded before me like a copper-coloured scarf caught
    in the wind. I was left breathless by the expansiveness I found in the barren
    slopes. My child slept and my mother talked, filling the car with her ceaseless
    chatter, as though she were constantly telling anyone willing or unwilling to
    listen, “I am here, I exist, you will hear me.” With my son, she was endlessly
    attentive, trying to win him over with her tenacious persistence.'
  - '[PAGE 88]


    She sang songs with him in the car, and when he fell asleep, she continued animating
    the afternoon with her moving hands and moving mind, not resting to take pause
    in her one-sided conversation. The desert, with its vast stillness, its insistence
    on a reverence for silence, was also demanding my attention. Although I had tried
    to only remember my life in Israel in fragments, although I distanced myself,
    ashamed by the political actions of Israel''s government, its violent occupation
    of Palestinian territory, although I conformed to live in Canada, shedding my
    past and forgetting how I had once loved the palm trees, just as my mother had
    once loved them, my mother, this land, had never left me. It was brimming with
    it. There was no escaping the person who made me and the country that shaped me.
    I had tried for so many years to shed my history, my blood. But history has a
    way of not leaving and blood has a way of lying.

    It is several years before I return again to Israel. I see the palm trees at the
    airport and they bring me a wave of relief and warmth, like a mother holding her
    arms wide in greeting, closing them around you. This time my son is four years
    old, and I rent an apartment in south Tel Aviv. In the park, my son sees a group
    of Israeli kids of Ethiopian descent climbing onto the roof of a maintenance shed.
    He begs to help him climb up with them. They reach out to give him a hand and
    the children stand on the roof, triumphant faces under the glare of the punishing
    July sun. They speak to him inquisitively, inquiring what his name is. He speaks
    not a word of Hebrew, but children have a way of making do when they want to play
    together. Off goes with the children, head of golden hair bobbing up and down
    as he skips and hops his way to the playground. I am amazed by his ease, the way
    he can freely navigate his surroundings. I, too, feel at ease, despite myself.
    I speak Hebrew with a fluidity that is surprising considering I haven''t spoken
    it for fifteen years. Perhaps I had missed the language, perhaps it was no longer
    lodged in fear the way it had been at the embassy all those years ago. I take
    my family to the beaches in Tel Aviv, I kiss my grandmother, I eat the foods I
    had missed. There is a familiarity that softens me. This land, occupied as it
    is, scared as it is, politically charged and full of problems as it is, is still
    my mother country.'
  - '[PAGE 89]


    The trip to the desert during the winter a few years prior and the summer stay
    in Tel Aviv shifts something inside of me. After driving past walls of towering
    cacti, through wind-worn rock formations and cracked, scorched land, after walking
    with my child through a crush of poppy fields, their red bloom bobbing in the
    gentle wind, after swimming with my child in the cold winter waters of the Red
    Sea, after getting lashed by the wind in Mitze Ramon, after feeding a camel from
    my open, sweaty palm, after pinching fresh pita between my fingers and scooping
    dollops of hummus, masabacha, and labene into my mouth — the Arabic foods I missed
    the most after negotiating deals with the shop owners in Jaffa, after riding a
    pink bicycle as my shoulders crisp and burn, the Mediterranean shoreline glistening
    to my left, after eating homemade moufleta with matbucha made by my Moroccan aunt,
    while my uncle shows me all the olive trees surrounding his house and complains
    about how they grow, after trying on a million pairs of cheap sunglasses in Shuk
    HaCarmel, after obligingly listening to a dozen taxi drivers complain about the
    cost of living, after being a terrorist-sympathizing bitch for voicing concern
    about continuous Palestinian displacement, after being stung by a huge white jellyfish
    that lumbered along beside me in the warm waters at Banana Beach, after savouring
    the taste of fresh, soft cheese with warm olives and pita for breakfast, after
    plucking an unripe pomegranate off the tree to show my son, after watching the
    palm trees lining the airport runway fade from vision until there is an ache of
    longing inside me, just as my mother had for those palm trees three years ago
    in England, all of this I leave Israel with a deep understanding that my home
    country has always been a part of my story, just as my mother has always been
    a central character in my life. I am resolved to no longer hide from where I come
    from. We all live with our mothers in our bodies, even though we have travelled
    so far from the day we once belonged to them.'
