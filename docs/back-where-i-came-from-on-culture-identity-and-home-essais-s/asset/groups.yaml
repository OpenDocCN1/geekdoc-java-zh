    你是坐渡轮回来吗？

    我会从她座线电话旁拿出出那本口袋大小的渡轮时刻，在手指上比着粤语数字：yat-zee-sam-say-mm-look-tzat-but-gau，最后停在“gau（九）”上。“Gau
    deem dap shun。”晚上九点的大渡轮。


    在我的多次访问中，我通常更倾向于乘坐大渡轮。它速度较慢，从香港岛到长洲需要一小时。我喜欢坐在船后部露天甲板最后一排座位上。喝着船上自动售卖机里的糖柠檬茶。看着船只滑过光滑的水面，香港的灯火如皇冠般在远方变得柔和。


    在我青少年后期和二十岁出头，作为一个新鲜的背包客，我以为自己知道如何旅行。旅行就是背上装有指南和必需品的背包，穿过新地方，探索未知，积累经验，并在这一切改变后回到家。也许这听起来显而易见，但我现在怀疑，我的香港之行更多是关于“访问”。我对长洲和香港的地图是由记忆和经验的丝线织成的。旅行与访问是重叠的。访问是在机场被接机、带橙子、被递上冷柠檬茶。做一个好客人，负责任，维护关系。


    ## 2018


    因为波波（Pau Pau）活过了九十岁，他们称这为“笑衰”（微笑葬礼）。葬礼结束后，天空亮了。在最后的葬礼仪式中，我们是最后跳过火并用柚叶水拍脸的人。我们洗了头，把蓝花换成了红花。我和姐姐穿上了新买的、色彩鲜艳的衣服。今天，我平时那种在肤色黝黑、精致的香港堂亲中，觉得自己是个流汗、笨拙的加拿大人的“丑鸭鹅”式的自卑感消失了。我自豪地穿着我的红色花花衫和森林绿长裤参加酒店午餐，那是我波波葬礼活动的结束，我知道她会认可的。


    我想象她站在一楼的阳台上，挥手说“拜拜”，模仿着背背包的动作，说：“Fong ga fan lai la（放假回来）。”有假期就回来。然后用最后的“joy
    geen（高兴）”或“拜拜”送我们我们。


    我想，如果我现在去，我的脚还会带我去她的家吗？谁会坐在敞开门的藤椅上，双脚交叠，一只眼睛扫视着邻里的八卦？他们会放下报纸吗？他们会伸出粗糙的手接过我递的那袋橙子吗？把水果滚进碗里，然后平好透明的红色塑料袋，整齐地折好，放在座线电话下的抽屉里？他们会拿出我的杯子，给我一些滚水（gwan
    seoi）吗？


    那时我并不知道，波波的葬礼将是在三大重大事件动摇这座城市和我生活之前的，最后一次香港之行：香港抗议、COVID-19 以及成为一名母亲。从那以后，我一直推迟完成一个诗歌项目，那个项目深入我与粤语的关系。在对香港抗议发表意见时，我觉得自己像个冒充者。我没有时间反思，她离开这个世界的旅程对我与母亲祖国日益疏远的纽带意味着什么。我失去了学习这门语言的紧迫感。我不确定自己是否有权利、能力或欲望对中国、粤语或香港身份做出任何认同。我想，移民可能不是单程旅程，而是一次往复。像织机上的梭。像一个在世界之间开启的瞬间之门。我担心随着波波的去世，那扇门已经关上了。


    当我写下这些时，我给妈妈发了短信：“我有一个问题——当长洲的人对波波说‘Ah-Ling ge lui fan（阿玲女儿）’时，意思是阿玲女儿回来了？”


    她回复道：“是的，在那种语境下，长洲是根据，所以阿玲的女回来了。”


