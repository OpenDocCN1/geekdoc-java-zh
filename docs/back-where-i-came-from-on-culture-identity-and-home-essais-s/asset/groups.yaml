    were stacked, Jenga-style, against me. Without glossy hair, perfect body proportions,
    savoury behaviour, a willingness to be subservient to someone else''s needs, and
    a delicious ragu to rivals others and serve to any guest time, beatification was
    not my future. I can handle the disappointment; some days I juggle the rejection:
    living on my own terms outside of a conformist society — the birthplace of fascism,
    where the populace recently voted a far-right party into power and propagandist
    belief is summed up in the saying, “Mussolini also did a lot of good”—is a win
    away I slice the Panettone.


