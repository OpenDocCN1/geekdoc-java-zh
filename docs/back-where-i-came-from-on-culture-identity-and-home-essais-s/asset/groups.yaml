    I was born.” There must have been something in my voice that day; he relented
    and we booked flights departing eight weeks later. When Dad’s cousin learned we
    were coming, she offered us untenated flat, noting that it was newly renovated,
    air-conditioned, and would be stocked with bottles of filtered water for our stay.
    I was embarrassed by my relief at these offerings, this subtle acknowledgement
    of our foreignness. But I wasn''t going to give up air conditioning. We gracefully
    accepted.


    The air was warm and humid when my cousin and a driver picked us up from Moi International
    Airport at 2:00 a.m. My hair dampened around the nape of my neck as we walked
    towards the car, answering my cousin''s questions about the three flights that
    brought us there. On the drive, I tried to take in what I could, peering out the
    window, but was met with only darkness. Security guards let us in to Makupa Flats,
    a gated community built around an Ismaili jamatkhana, but I''d had to wait till
    daylight to truly see eyes on the place my grew up, where my paternal grandmother
    had lived, and where my first cousin still calls home.


    After selecting the bedroom off the living room, and sliding into pajamas, I pulled
    back the mosquito netting surrounding my bed. I relished being horizontal for
    the first time in almost two days, but a few hours later, I was still awake to
    hear the morning azaan, a man’s voice trumpeting through the dawn air, calling
    the pious prayer. I felt my dry eyes sting as the tears pricked them; I''d never
    heard the azaan in public at home.


    I might have dozed off because my next memory is hearing Dad opening and closing
    kitchen cupboards and the tick-tick-tick of the gas stove. I joined him in the
    kitchen despite being bone-weary. We fuelled ourselves with strong Kenyan chai
    and Huseini Bakery nankatai, then sank onto the living room couch to make a list
    of landmarks we intended to visit: family homes, places of worship and schools,
    mostly. Dad mentioned Four Twenty South cottages in Diani, where he and Mom honeymooned
    — the setting of'
