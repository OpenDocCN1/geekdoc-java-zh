    into independent women. Making their independent path in a country I left behind.


    I now recognized the pressure building up to that point as grief. Grief for the
    person I didn''t become. For the stories and milestones I''m not a part of, and
    for this evolving world I stubbornly didn''t recognize. I grieved that world was
    moving on without a place for me. If I wasn''t anyone here, where was I anywhere
    else?


    Our time together was limited, with every occasion and sightseeing packed into
    our one-month stay. Parents, my sisters, their kids, and I piled into four separate
    cars to make our way to Grandma''s place in the countryside. The roads outside
    of the city were narrow with cracks and potholes, forcing us to occasionally veer
    off dirt roads while construction workers repaired the pavement. My elder sisters''
    children had gotten motion sick, and we tried our best to make the journey comfortable
    for them as we could. We stopped for breaks, played hide-and-seek to stretch our
    limbs, took pictures, and took them on their first camel rides in the singing
    sand dunes (duut mankh) on our way to Uvkurhangai province. It occurred to me
    that the childhood memories I cling for comfort were happening for them on this
    very trip. Maybe, in their twenties, they will also think about the dunes, the
    horses and camels, skipping rocks across the lake, hiking to mountaintops and
    playing with goats — reconnecting with a cherished time when they felt an unwavering
    sense of belonging.


    In Mongolian culture, households present their guests with fresh meat and dairy
    products as a gesture of respect and hospitality, and in return arriving guest
    must have at least a bite. So, in one month, I ate my weight in meat and dairy
    treats. We connected through food. That''s what I love most about our culture,
    the unspoken ways that we claim each other as own.


    My grandmother''s summer dwelling was exactly as I remembered it in childhood.
    Her ger — an intricately woven traditional dwelling, at the skirt of Zalaa Uul,
    the towering mountain with a stone crown at its crest — was my father''s namesake.
    The ger was still situated by the river stream where we used to dare each other
    to jump across as children, with the same golden dandelions lined around the bank
    that we used to make flower crowns.


    We made a bonfire in celebration of our family reunion, with five sisters together
    for the first time in thirteen years, on the land that my ancestors roamed with
    pride, and that my father yearned to return to every summer. Now we yearned to
    belong and Every sibling in one corner of the globe. We had learned to read and
    write in one place and became adults in another. I wanted to say how proud I was
    to be their sister and how much courage I felt seeing how they embodied the fragments
    of their identity unapologetically, with honesty. It made me brave to do the same.
    I often wondered if being so far and different made them feel just as lonely as
    it made me feel at times. Even now, with all of us situated on different continents,
    I knew just as well that they had yearned to meet again in the middle. I doubted
    if I would be able to say any of these sentiments without crying.


    In the bonfire, we whispered our prayers and blessings and asked for strength
    from the flames. Under the light of the full moon, we prayed for good fortune
    for our family. I had already started tearing up when my mother shared stories
    about my grandmother who had recently passed, broke down into sobs when she embraced
    me. My father joined, enveloping the two of us, and we cried out all that we kept
    in our hearts.


    In all that time we spent sightseeing, none of us said the words: “I missed you.
    It was hard without you.” And I too had to say, “Look, look what I became, on
    my own! I did it! It was impossible and I did it!” Which coincided with the even
    smaller neglected voice of mine saying, “I’m still small and young, and I still
    need you, doing life without you is not easy.” Being with my family the night
    sky, on our ancestral land, I knew I belonged.


    Here it didn''t matter that I harboured guilt for being away for so long, or that
    my Mongolian was dusty, or that, when nervous, I spoke with a blended Indian,
    Canadian, and Singaporean accent. It didn''t matter that I felt responsible for
    the chasm between myself and my family members, as we were never accustomed to
    sharing exactly how we feel, anyway, especially not with one another. My small
    doubts seemed even more minuscule in comparison to how our lives were in harmonious
    bond with the land. In the quiet stillness of Khuoisin Naiman Lake, I could laugh
    at my silly ideas of belonging and identity. The fears I harboured in truly embodying
    my hyphenated identity didn''t have to be a choice between one and the other when
    so much of me was influenced by both. I could be as fluid and momentary as the
    passing streams in the river. I validate the scattered, unfinished, cut, and edited
    parts of me that are equal to this strange abstract whole.


    The land is a timeless mother, gracious in her patience and yearning for her children
    to return. Despite the passing years, how far I might have gone, and how much
    I’ve changed, the land will always remember me when I come home.


