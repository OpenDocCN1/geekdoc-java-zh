    games, with a shirt with blue and red stars all over it was just asking for trouble.


    Growing up in Canada, with so much American cultural influence, we learned that
    military operations are top secret; prototype airplanes, the newest tanks and
    the mobile missile launchers were kept away from the prying eyes of the public.
    When you crossed into the Bloc, a Soviet-led military force had no use of keeping
    itself secret. Some of you are old enough to remember those old-new broadcasts
    of May Day parades from Red Square. Soldiers marched in columns, followed by tanks,
    missile launchers, and pretty well any killing machine the Soviets could wheel
    through Red Square.


    In Budapest, one of the biggest tourist attractions is the Citadel, a monument
    atop the Buda Hills. From there, you get a panoramic view of the Danube splitting
    the city in two. But, back in 1984, it was surrounded by soldiers, tents, and
    camouflage netting — a military exercise in plain sight.


    Almost all Hungarians drove cars in the Bloc: Škoda, Ladas, Romanian Dacias. My
    grandfather loved his Skoda, a beige-coloured Czechoslovak death trap. The shortest
    turn made the car lurch like it was rolling over. It shook when the key was turned
    in the ignition. Later in the trip, the axle broke while we were on the road.
    It was as if Kafka himself had imagined this as a joke about the trivial nature
    of life.


    We were all inside of this hellbox, on our way from Budapest to Eger, an ancient
    city that''s one of the great tourist spots of Hungary, a place that defined the
    battle lines between European kingdoms and the Ottoman Empire. Eger is a city
    with prayer towers and minarets that had changed hands between empires over the
    centuries like a third-line hockey player being sent from team to team.


    My dad sat next to my grandfather, with my mom and I in the back. I was mad that
    I didn''t get to go in my Uncle Lénard''s green Polski Fiat, because he drove
    the hilly roads like he was auditioning for an F1 seat.


    We had to slow down for a roadblock. We were in the middle of the country, with
    farmers'' fields on either side of the two-lane highway. Then, it came across
    the road in front of us. A tank. A real Russian tank. Red star and everything.
    Rather than tracks, it had big fat tires.


    An officer came up to the car and knocked on the window. My grandfather rolled
    the window down. The officer peered inside the car, and then turned at me, studying
    the strange Hungarian teenager before him, whose New Wave fashion sense, I’m sure,
    must have appeared to him like a beacon of my not-from-Hungary-ness. “Excuse me,”
    he said in English, and further to our surprise, without a hint of an accent,
    “you will have to wait a few minutes, we’re having games.”


    War games? Right by the highway? I thought, *This totally makes my day.* But it
    got better. “How old are you?” asked the officer, looking straight at me in my
    Duran—inspired headband. “Thirteen,” I said.


    “Would you like to ride in a tank?”


    Before I could say, “Yesyesyesyesyesyesyes,” my father — the voice of reason,
    man who repeatedly told me never to trust people in uniforms, including the police
    officer who came to my elementary school class to teach us not to talk to strangers
    — coldly intercepted the communist’s offer: “No, he would not.” He turned to me
    from the passenger seat and gave me the sort of look that suggested I might not
    want to speak for a while.


    It never took my dad long to go from the person who killed fun to James Bond.


    Except James Bond would never been caught dead in a place like Lillaförd, the
    sleepiest of resort towns. Really, it was only a small village, located in the
    Bükk Mountains in the northern part of the country — a small lake surrounded by
    lush forest.


    My families — that is, both my mother’s and father’s sides — decided that this
    would be a good place for a retreat. We all stayed in a series of cabins near
    the lake.


    The evening we arrived, my cousin Eve and I went to the shore hunting for empty
    Traubisoda bottles. A couple of guests walked by, carrying fishing tackle. They
    stopped, looked at my cousin and I, and spoke to me in Hungarian, but in perfect
    English, making what my thirteen-year-old brain perceived to be small talk. Just
    two harmless fishermen asking me how old I was, who I was visiting with, and whether
    I was enjoying my stay. Then they were on their way.


    Later that evening, I told my dad about it. “Funny, Dad, I think there’s a couple
    of Canadian or American guys right next to us.”


    My dad’s face turned a particular shade of red. “Come with me, son.” He took my
    hand and walked the grounds until we saw the fishermen walking into their cottage.
    My dad had a special kind of walk when he was angry, like he was about to begin
    a sprint, but never quite gets there. Each step was more like a lurch.


    He followed the fishermen up the steps to their cabin door.


    “Look, I understand the KGB might want to follow my wife and me. But, do not speak
