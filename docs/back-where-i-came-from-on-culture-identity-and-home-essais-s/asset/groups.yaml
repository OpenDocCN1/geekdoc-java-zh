    Sapoch 那种出格的残忍，以及我母亲在教孩子上令人震惊的无能，决定耻辱就是耻辱。此外，我想，至少让我的孩子别变成那样。出生在一个歧视女性、父权制的罗马天主教文化中，这种文化崇拜男性而贬低女性，这些条条框像叠高木（Jenga）一样层层堆积在我面前。如果没有光泽的长发、完美的身体比例、得体的举止、乐于满足他人需要的意，以及一份足以与人竞争并随时为宾客服务的美味肉酱，那么圣化绝不是我的未来。我可以处理这种失望；有些日子，我与拒绝作斗争：在一个从俗的社会之外按照自己的方式生活——那是法西斯主义的发源地，那里的人们最近投票让极右党上台，而宣传性的信仰被总结为一句话：“墨索里尼也做了很多好事”——这离我切开潘内托蛋糕（Panettone）只有之遥。


    ## 幽骨


    把 Bonefro 称为一个村子是不的。在意大利语中，它是一个人口略超过千人的市镇（comune，已从离散前的五千人减少到如今）。Comune 译为“市”——尽管把一个农村环境中的山坡定居点看作城市是很违和的。多年来，我先在英语中学会了“commune”这个假同源词，在我的想象范围内完全不适合这个地方。我无法用那座千古城堡、拥有百年历史（重建）的圣马利亚·德莱罗塞教堂，或拥有四百年历史的圣马利亚·德莱格拉齐旧修道院，来匹配那些与我生活选择和檀香味在一起的意象。我大脑字典里有很多无法翻译的词，在我所有的叙述中，Bonefro
    始终是“那个村子”。


    这段混乱的内心独白流露在了罗马机场的海关官员口中，用一种受英语影响的方言阻碍的生涩口音表达出来。


    他歪着头打量我。“真的吗？你已经三十六年没回亲戚那里看过了？”


    我点了点头。“想象一下那种内疚感。”


    他笑了并盖了我的护照。“欢迎回来。”


    Nadia 是我在温哥华生活时结识的一个罗马朋友，她来接了我。她将是我的东主、向导，幸运的是，还是前往 Bonefro 的交通工具。十六年和几封邮件之后，我们才重重逢。当她有力地拥抱我时，宽慰感流遍了我的心。*也许，*我允许自己认为，日子是可以治愈的。*我把这次旅行顺插在萨尔诺省帕杜拉（Padula）的一次作家会议上，我计划参加
    Nadia 也会出席的两个小组讨论。她的父母住在莫利塞区的首府坎波萨索（Campobasso），距离零地南部二十五公里。


    通过 Facebook，我联系了母舅的女儿，告诉他们我到达的日期。Nadia 遵循另一套时间表。在我们午晚出发时，我的下颌紧绷了。Nadia 在公路上疾驰，而我咬着内脸颊，无法欣赏那片无云的蔚蓝天幕。


    小时后，在村子边缘，Nadia 停下来，指了指限速三十公里的 Bonefro 标志牌。我们停在 Luisa 家对对面，那里的一栋建筑被证明是养老院，我的祖父
    Gennaro 在那里度过晚年，那里离广场（piazza）只有一小路——广场是每个意大利市镇老年男人的核心聚会场所。


    十一点，我因为在正午穿过广场，并由于穿着短裤和吊带上衣进入一个“咖啡馆兼酒吧兼男士窝子”的地方给自己买了一支冰冰（ghiacciolo，带甘草茎的柠檬冰棒）而受到训备。Nonno
    Gennaro 中断了他的牌局，将我拉到室外，解释了我所忽略的礼仪。


    他指出，穿着短裤和吊带上衣走动已经够成问题了，但在正午？进入浓缩咖啡馆是不合礼的。要再来一个甜点是不体雅的。如果我想吃冰淇淋，我应该克制食欲并让他帮我买一个。好女孩白天要在家里干活。


    我可以处理这种失望；有些日子，我与拒绝作斗争：在一个从俗的社会之外按照自己的方式生活——那是法西斯主义的发源地，那里的人们最近投票让极右党上台，而宣传性的信仰被总结为一句话：“墨索里尼也做了很多好事”——这离我切开潘内托蛋糕只有之遥。

