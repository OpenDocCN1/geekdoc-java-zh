    Alicia''s reassuring memory also dimmed down.


    My family first settled in Toronto for five years before making the trek to Edmonton,
    where I eventually went to Bible college. Intent on becoming a church pastor,
    I paid for school by working part-time cleaning jobs, while earning volunteer
    experience as a youth pastor. As recent converts to Pentecostal Christianity,
    we had embraced a wilder version of faith than the stoic Roman Catholicism familiar
    to most Salvadorans. My parents beamed with pride at the positive impact I was
    having in our church through the sermons I preached and activities I organized.


    But by the time I got my theology degree, I needed a break from the pressure of
    working at a church. I could see the disappointment in their faces when I told
    them I didn''t want to be a pastor anymore. I needed time away from all of my
    familiar surroundings to figure out what I wanted to do with my life. How, they
    wondered, could I have spent all that time and money on a degree I wasn''t going
    to do anything with?


    I moved out to Calgary to live on my own and worked at a bank, hoping to save
    enough to fly to El Salvador that summer. It wasn''t meant to be a vacation but
    a pilgrimage, the kind you take when you''ve spent five years of your life in
    college and graduate with a sense of purpose blank as the symbolic rolled-up paper
    you''re handed during your graduation ceremony.'
