    这是任何 TSA（美国运输安全局）官员听过的最荒谬的解释——当时要去安德鲁斯空军基地，飞往关塔尼奥湾拘留营，或者是在前往阿富汗之前，在弗吉尼亚参加战地记者培训。但我唯一一次被带入审查室并接受审问，是我到达
    JFK 机场并告诉他们我是来见表哥的时候。事实证明，有很多恐怖分子声称他们是为了探望表亲。


    ## 4.

    1998


    在卡塔尔作为一名外籍人士——这是我们用来形容那些富到不至于被称为“移民”的人的词——必须获得“卡法拉”（kafala），这是一种由当地公民或公司颁发的某种担保。为了保护这个国家的石油和天然气财富，卡塔尔政府让任何外国人都无法获得国籍。居住在卡塔尔的大多数人都是外国人，处于这种不稳定的生存状态，随时可能被一夜遣逐的可能性始终存在。大家都清楚规矩：你来到这里，赚点钱，但你永远是个客人。这里没有归属感，只是路过。


    一年，在这一地方住了十多年后，很清楚的是，我们在卡塔尔的时间即将结束。8月的最后一天，我们登上了飞往加拿大的飞机。


    我对加拿大一无所知。在蒙特利尔的第一周，我上了一辆公交，试图把一张二十美元钞票塞进硬币口想要找零。我完全不知道公交系统是如何运作的；卡塔尔根本没有公共交通。我当时只有十六岁，从零开始的前景——适应那种在零下四十度时空气像针一样刺入肺部的感觉——是令人无法忍受的。世界是一场开始的冲击。


    ## 5.

    2001


    在很长一段时间里，我父亲在蒙特利尔找不到工作。他的法语不够，学历也不够。当我们耗尽积蓄时，他向外扩大搜索范围，直到获得了一个在威斯康星州一家酒店担任会计的录用，那个州我们没有一个能在地图上指出来。但薪水足够高，而且别无选择，于是他接受了。还有一些文件需要完成——一份工作许可，他的潜在雇主向他保证这应该相当简单——最晚在9月第二周完成。9月第二周到了。


    工作许可的办理陷入了停滞；大家都知道原因。最终，酒店别无选择停止等待并雇了别人。我们没有搬到威斯康星州。我想象我家人的另一个版本进入了那个奇异、幽灵般的“本可以”社区，与生活在特里波利的我们，以及留在开罗的我们并肩。所有这些被夭折的轨迹，所有这些从未离岸的容器。


    ## 6.

    2010


    8月的一个周日，我的朋友安娜试图在多伦多寻找一位意大利语翻译。为了把我父亲的遗体带回家，我们需要安抚埃及、加拿大和意大利政府的官僚主义无常，这除了许多文件外，还需要我父亲意大利语死亡证明的认证翻译。在伊斯兰教传统中，死者应该在二十四小时内埋葬，但我们花了好几天时间处理所有必要的许可，最后才回到开罗，这是自十二年前我们来到加拿大以来我们第一次同行的飞行。


    在埃及，任何抵达的遗体都归军管辖。我们在凌晨三点左右落地，我和表哥陪着棺材来到机场一个新荒凉的角落，那里坐着一个坐在桌前，既无聊又烦躁的行政人员。


    她检查了文件，来自那勒斯殡仪馆、多伦多翻译员以及罗马埃及大使馆的文件。事实证明我们漏了一份表格，没有它，我们在技术上犯了法。以这种方式运输我父亲的遗体是非法的，现在已经来不及任何补救了。


    我们站在那里，感觉过了很长一段时间。最后


    HANNAH ZALAA-UUL


    ### 大地记得

    它所有的孩子


    飞机滑行停止，我的心很沉重。也许是期待或紧张，我对自己说。我能透过窗户看到洗刷过的绿色平原。与任何地方都不同，这只能属于我们的土地。我们的家。五年来第一次看到它的熟悉感，我的心澎湃了。


    自从搬家、重建并回来后，我对家的定义似乎存在于来来去中，存在于无形的国界之间，在水面之上、天空之下。大约如此。


    我走下飞机，我怀疑自己的语言能力。多年没有练习，在机场登机口紧张地回答着问题，希望行政官员看不出这是一个我尚未真正熟悉的世界。


    过去，几十个长辈对我说：“蒙古人应该说蒙古语，而不是这种外语”以及“你应该对英语说得比母语还流利而感到羞耻”，随后还心自得意地跟着一句：“你现在还是个蒙古人吗？”仿佛语言决定了我的血统，抹消了我的血液和
    DNA。但那些刻薄的评论留在我脑海里，每当我结巴、紧张地用外语口音读词、或艰难地用蒙古语解释某事时，这些话就会浮现。


    在和姐姐和她的两个孩子一起回我们家的路上，我在心里记录了自从我离开以来发生的所有变化和保持不变的事物。嗯，路变好了，有了用于道路安全的监控摄像头，有了新的更高的建筑。比我记忆中的有更多的餐厅、连锁店和咖啡馆。


    [注：从这之后开始的后续文本似乎包含严重的 OCR 错误或源文档不匹配，叙述从一个关于埃及的故事突然转变为关于蒙古的故事。]


    （此处后续为重复的混乱文本，已按要求保留格式并进行翻译/处理）

