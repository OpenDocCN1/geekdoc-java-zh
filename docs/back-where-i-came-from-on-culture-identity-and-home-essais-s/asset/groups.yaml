    # Sea Creatures


    After watching me peel and eat raw barnacles off a rock, my daughter insisted
    on doing the same. With her right hand, she held onto the ladder that connects
    the rocky coastline to the Adriatic Sea. With her left hand, she searched for
    a stone she could use to remove the barnacle, like she saw me doing a minute earlier.


    “Is this one okay, Mama?” she said, waving a stone twice the size of her fist.


    “Oh, hon, that’s too big,” I said, motioning for her to drop it into the sea.
    Her next pick was a pebble so comically small that I smiled and passed her stone.
    She held it tightly and pounded away at the brownish, quarter-sized barnacle glued
    on the rock in front of her. But the oval creature maintained its stubborn grip
    on its host, and only muddied the sea around it.


    There are some thousand types of barnacles, and they usually live within shallow
    waters, where they cling to rocks for life. In Croatian, we call them lupari or
    lumari, and they’re a common sight for those of us who grew up on the Adriatic
    coast. More formally, some call them priljepci, where ljepit means “to glue”—a
    reference to the sticky substance that makes them bond to their habitat. Their
    slightly cone-shaped shells are greyish or brownish, like the rock formations
    they adhere to.


    They’re an odd-looking thing, but their sheer numbers convey a sense of belonging.
    A single rock can house a dozen or more of them; it’s clear they’ve tethered to
    their home, and a child’s whacks are not enough to sever that bond.


    Growing up in Croatia, my dad often walked into the sea below our house with a
    mesh bag and filled it with lupari. He’d later toss them in a pan with olive oil,
    garlic, onions, chopped tomatoes to make sauce for pasta or risotto. Other times,
    he’d cut up the edible meat with that of other shellfish, then I mix it with lemon,
    olive oil, capers, and scallions to prepare a fresh seafood salad. As kids, my
    two sisters and I snacked on raw lupari between our swims — I have no doubt we
    were the subject of some amused British and German tourists taking photos.


    Now, watching my daughter wrestle with one of these creatures, I recognized a
    first-grader’s frustration creeping across her face. I grabbed the stone from
    her hand and moved towards another barnacle. Instead of hitting it at the pointy
    tip of its shell, I approached it from the side and struck it, forcing its sticky
    hold to relax.


    Once I secured it in my hand, I scooped out the circle-shaped meaty part with
    my index finger, rinsed it out in the sea, and tossed the shell aside. The edge
    of the meat is dark grey, then gets lighter and sometimes more yellowish towards
    the centre. It is much smaller, harder, and not nearly as delicious as an oyster,
    but that familiar seafood taste I enjoy. I passed it to my daughter, who ate it
    in one bite.


    “Mmmmm, yummy,” she said. “Can I have another?”


    We were on Lokrum, a small island outside of Dubrovnik’s Old Town, a medieval
    walled city known as the Pearl of the Adriatic and, more recently, a Game of Thrones
    set. To me, Dubrovnik is a place I call home even if I have not lived there in
    three decades.


    My family left when I was thirteen and Yugoslavia — of which Croatia was a part
    — turning into a war zone. We immigrated to Canada, and after finishing high school,
    I moved to the United States for college. But I still return to my Croatian hometown
    every summer vacation.


    It’s always hot and sunny there in August, and I love swimming in the bay where
    I grew up. A pedestrian path sprinkled with pine needles hugs the cove, where
    shades of green and turquoise waters gradually darken into deeper blues. Mediterranean
    homes with red terracotta roofs line the footpath, with bougainvillea and pine
    trees creating shade on the stone terraces. With towels across their shoulders,
    kids walk to their favourite swim spots without grown-ups in sight. Stray cats
    sprawl on the trail, oblivious to the postcard views of the sea around them.


    When I''m not eating raw barnacles, I snorkel and search for colourful sea urchin
    shells. On a good day, I''ll find a perfectly intact green or reddish one, take
    a deep breath before diving to the bottom to remove the delicate casing with my
    hand, careful not to let the black prickles pierce me. Occasionally, I''ll stumble
    upon haliotis, the ear-shaped sparkling shells I like to collect.


    There is no sand here — Croatia''s coastline is unapologetically rocky. I walk
    right in, but the tourists wobble in their squeaky water shoes, their arms stretched
    to the side for balance as they shift from one rock to the next. But I know the
    pattern of the waves here, know which rocks are smooth and sway under my feet.
    I know the nook where the crabs hide, know how close I can get near them before
    they scatter.


    The absence of sand the Adriatic Sea is so clear, I can see the bottom from the
    deepest spot in the bay. It leaves a comforting taste of salt on my tongue and
    a white trail on my shoulders when I emerge and lounge on a rock to dry off.


    This is the only time of the year when my husband and I are not under work deadlines
    and not schlepping our seven-year-old to soccer, basketball, or whatever his latest
    obsession is. But there are other pressures and deadlines on our trip, my annual
    pilgrimage to the motherland. Pressure to immerse my only child in my mother tongue.
    And deadlines because our time is compressed, no matter how many vacation days
    we string together.


    My husband is American, and my parents and most of my relatives from the former
    Yugoslavia live outside the United States, so I am aware that the responsibility
    to connect my daughter with her heritage falls to me, leaving me with both sense
    of guilt and nostalgia. I''ve lived in North America for most of my life and have
    made more of an effort to embrace my background.


    So, when I take her to the Euarket store in New York''s Astoria neighborhood,
    I buy her the same Bajadera and Tortica chocolates I''ve enjoyed since my childhood.
    And when we visit my parents in Toronto, I love how she savours my dad''s black
    risotto for dinner. I''m frustrated when I speak to her in Croatian and she responds
    exclusively in English. When I suggest Croatian lessons, she shakes her head "No!".
    As an immigrant raising a child in America, my efforts sometimes seem fruitless.


    I want her to spend time with my aunt and uncle, to freshly catch fish in the
    sea waves, away from the constraints of an American pool staffed by lifeguards.
    I want her to play with turtles in my childhood home''s garden and feed them the
    same oranges I did when I was her age. I want her to absorb the hard consonants
    of my native language, let them roll off her ankles. I want my child to see my
    childhood and cherish it as I do. There are moments when she does. At a restaurant
    in Dubrovnik last summer, she gulped octopus salad with speed that my husband
    and I had to compete for a bite. But two weeks later, we were at a restaurant
    in Connecticut, and all she wanted was mac and cheese. We won''t be over jet lag
    yet, but she''ll already transitioned to her American self.


    For her, Connecticut is home, and Croatia is a fun place she visits in the summer.
    There is no nostalgia and longing for the past, no push-and-pull of immigration,
    no sadness and regret about living an ocean away from your homeland. Her identity
    is not fractured by a war, her personality not splintered by continents. She has
    no concept of a present shaped by a past, and her biggest What if revolves around
    what happens if she tries an icecream flavour she doesn''t like.


    I don''t think America will ever earn the label of "home" for me, no matter how
    many years and decades it owns my address. America sends me to a different airport
    line from my American husband and daughter. America fingerprints me every time
    I enters its borders, checks my documents with the Department of Homeland Security
    because it equates immigrants with danger. America called me a "foreign alien"
