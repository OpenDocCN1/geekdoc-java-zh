    I thought back to what my aunt had said: I''d been an anxious child, a crybaby,
    needy. I''d never remembered myself that way, though to think of it now, lying
    in the sea and staring at the city, I did wet my bed till the age of twelve. How
    much of that had to do with the war? With shuttering ourselves indoors for safety,
    running down staircases, panicking at the sudden shake of nearby bombing, being
    pulled by the collar to run away? How could I not act fearful, with fear all around
    me? It must have found a way in.


    I remembered being a happy child in Greece, up until that changed and my father
    moved away, and then we immigrated to Canada. I remember being frustrated with
    my lot in life once we went to Canada, feeling my angriest. I blamed my parents
    for that, but mostly my mom, because my day wasn''t engaged with enough to notice
    my anger. But what if that anger had been an echo of what had happened here? What
    if part of the venom was fomenting from this life before memories were formed,
    when I was in the hands of people who had their own lives and troubles before
    the war even began?


    I swam back to shore, baptized by realization, as if seeing the constellation
    of events that made up my life; the one extra detail about my neediness had finally
    revealed to me the person I really was.


    I went back to swim in the sea every day for the rest of the week. It reminded
    me of all the times my father had brought us swimming at the beach club not far
    away when we lived just up the street. By week’s end, I got sick and lost my appetite.
    My skin grew pale and my cheeks gaunt, as I slept all day, too weak to move.


    My aunt Muna came to feel my head with the back of her hand. “You shouldn’t have
    gone swimming in the sea,” she said. “That water’s polluted.”'
