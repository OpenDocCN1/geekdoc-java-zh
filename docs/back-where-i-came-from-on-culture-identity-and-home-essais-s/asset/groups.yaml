    could tell by my mom''s facial expression that she was growing annoyed. Then,
    my aunt Medhin pointed to a figure across the unpaved street. I buzzed with excitement
    at the chance to meet this man. As he came closer, I saw how his clothes draped
    on his small frame and realized that he was not much taller than my five-foot-four
    mother. The image I had of him disappeared, anxiety taking its place. It was only
    when he pulled me into an embrace that I felt an immediate connection to him.
    Despite being smaller than I expected, he was strong, holding me tight, kissing
    my cheeks multiple times. When he released me from his embrace, I realized that
    my imagination was not wrong.


    My mother had not been back to Ethiopia for fourteen years by the time we went
    as a family in 2011. Within those fourteen years, she lost both her mom and an
    older brother, leaving her with an insurmountable amount of grief that was difficult
    to process alone in Canada. She would speak of them often and so it felt like
    they were near. But I could feel a heaviness filling the truck as we drove through
    Adwa toward her mother’s house. My mom let out a guttural cry while the neighbours,
    who all knew my grandmother and helped raise my mom, surrounded her immediately,
    whisking her off into the house to calm her down. For me, there was a feeling
    of closure: unlike my Uncle Teddy, I would have to imagine what they might’ve
    looked like or how their hugs felt.'
  - '[PAGE 107]


    For a long time, my idea of “back home” was coloured by the stories parents would
    tell us. My mom, who spent much of her young adulthood in the country’s capital,
    zipping around town, could no longer tell you what was where. The different neighbourhoods
    had transformed. Many of the open-air marketplaces she went to as a young adult
    were now enclosed shopping areas and restaurants. At times, all my mom and dad
    could sit quietly in the car, letting a gasp every now and then the changes around
    them. Their idea of “back home” disappeared. The skyline, previously open and
    clear, was now interrupted by the eruptions of tall condo buildings and factories.
    The conflict was apparent on their face; there was pride in the progress, but
    dismay that they could not recognize what was once home.


    Language was where I held most of my grief. Every time I extended family, anxiety
    would cover me like an itchy blanket. The routine was the same: they would run
    up to hug my brother and me, plant multiple kisses on our cheeks and start speaking
    in rapid Tigrinya or Amharic to us. This collection of words — some I understood
    and some did not — left me guessing what my family members were saying. It felt
    like a puzzle that I couldn''t put together a beautiful picture never realized.
    Despite my best efforts, my parents would have to come and translate what our
    family members were saying, even going so far to help us respond in the appropriate
    language. However, when things got difficult, and I grew frustrated at how my
    English tongue couldn’t wrap around a Tigrinya or Amharic word, I would respond
    in English and leave my parents to translate.


    As you can imagine, my brother and I were slightly panicked when my parents left
    with Howboy Haddish and Fita one day while they visited family members in a more
    dangerous part of Addis. We couldn''t speak Tigrinya or Amharic and they couldn''t
    speak English. What do we talk to them about? Do we just stay in our rooms to
    avoid the awkwardness?

    “We''ll be back by lunchtime,” our parents told us. Well, lunchtime came, and
    they were not back, leaving my brother and me to lie on the couch all day and
    watch Arabic MTV. That was until our aunt and uncle sat in the'
  - '[PAGE 108]


    living room with us. Fita took the remote from the coffee table and changed the
    channel. Not wanting to spend an evening watching talking heads argue about politics,
    my brother and I sat up, ready to return to our rooms. “Kof belu, kof belu,” my
    aunt and uncle said, waving their hands for us to sit back down. To our surprise,
    it wasn''t the news that they were watching, but a World Wrestling Entertainment
    match. My brother and I glanced at each other as the theme music rolled in, shocked
    that the WWE shown all the way to Ethiopia. Never having watched wrestling, we
    were both new to this world, but our aunt and uncle were experts, giving commentary
    on the whole thing. Due to the language barrier, we all had to resort to visually
    expressing our thoughts to each other, and maybe, if lucky, use a word in the
    language the other party understood. If someone came up who they thought was going
    to win, my aunt would flex her arms to signal his strength and yell, “Good! Strong!”
    With every body slam they would cheer and applaud, even laugh at times, with my
    brother and I slowly following suit. By the time our parents finally did come
    home, they found all four of us yelling at the screen.


    This was the first and last time I travelled to Ethiopia. Admitted, I felt a wave
    of relief when we landed back in Toronto. We all did. Going “back home” was a
    logistical nightmare, with every day packed with meeting different family members,
    handing out items brought from Canada to the right people, and warding off family
    members who asked for a little too much. In September, I returned to school, feeling
    like I had some sort of badge. I, too, could add to the conversation when the
    topic of “back home” came up. As I got older, I missed the country and planned
    on returning after receiving my undergraduate degree in 2020. I told myself this
    trip would be different. Instead of going on with my brother and I called the
    “royal tour,” meeting family members and shaking hands, I would go to see specific
    sites. The obelisks in Axum. King Yohannes’ palace in Mekelle. Unfortunately,
    2020 brought with it a global pandemic and a war in Ethiopia. The latter changed
    my idea of “back home” forever. I began to see the dark underside of the country
    and it frightened me deeply. The beauty of Ethiopia that was recounted to me by
    relatives, the legends and history of'
- md: '

    that land, began to feel like buried treasures. But to reach them, you must wade
    through the country’s muddier waters. Still, I long to return and experience Ethiopia
    for myself, to bridge the distance between myself and this faraway land.


    ## ANGELO SANTOS


    ## Shutter


    A camera, to the uninitiated, is a grim contraption: it is covered in tiny buttons
    and dials, miniature switches and cold pieces of glass, and a rubbery black plastic
    like something lifted off the back of an orca. It feels bulky in your hands, an
    inert hunk of material. Recently, I saw an AI illustration of a professional camera
    it looked monstrous: crammed on every square inch of the camera''s surface like
    a pox, the barrel of the lens choked with too many serrated rings, a few of which
    appeared to be melting into the rest of the camera. When Vi — my girlfriend then,
    now my wife — gave me my first camera as a birthday gift, I remember feeling a
    twinge of foreboding when unboxing it, as though the machinery of the camera might
    get the better of me, fearful that perhaps it would get lost in its obscurities.


    Still, when my cousin Vince asked me to be his best man at his wedding in Manila,
    I knew that I would take the camera with me. Besides being the country of my birth
    that my parents and I left when I was three, the Philippines was also the place
    where we as a family had returned annually every summer for a decade when we lived
    in the Middle East where was common practice to offer expatriate employees as
    part of a standard benefits package; it was also the country that, now we were
    in Canada, we hadn''t visited for almost five years. My cousin''s wedding aside,
    this was an occasion to bring a camera: a homecoming, a return to the motherland.


    Soon, my entire family was booked to make the pilgrimage: my parents, my two sisters
    (who were both born after we left the Philippines), and Vi, who was able to rearrange
    her work schedule to join us. For weeks leading up to the trip, I caught myself
    dreaming of halo-halo and nasal, tricycles and jeepneys, and the mellifluous iambic
    pentameter of spoken Tagalog on the streets.


    Travelling with a camera, I soon learned, requires forethought and careful attention
    to detail. Before this trip, I had never carted something so expensive, and I
    fretted over the prospect of damaging the camera at some juncture, opening my
    bag to find a cracked lens, or a rattle of internal components. I rearranged the
    padding in my carry-on as we battled our boxes the camera effectively stayed nestled
    in a cushion as we went through the airport''s long queues, as we wrestled our
    balikbayan boxes over flimsy baggage carts, as we sat and writhed through the
    punishing thirteen-hour flight to the other side of the world. When we emerged
    from the concourse doors into the oppressive tropical humidity of Manila, I checked
    inside the bag and was relieved to see that the camera was still intact. Vi, who
    had seen me peering into my carry-on several times over the course of the flight,
    teased, “Did our baby make it okay?” and I shot her a dirty (but also guilty)
    look.


    Months earlier, when the camera was still new, Vi and I took a photography course
    in the cramped, dimly lit backpack of a local camera store in Toronto. We were
    drawn to the course because we had both been inspired by the pictures we saw on
    social media taken by accomplished photographers — the ones whose images looked
    sun-kissed, everyone’s hair glow, backgrounds blurred to a creamy texture — and
    we sought to recreate some of this magic on our own. Our instructor, an austere
    Scotsman whose work hung in galleries, had been insistent in imparting this particular
    strategy: memorize just a few of the most common settings, then just go out and
    shoot! “The trick is,” he said, “not to let the camera get in the way.” I scoffed
    at this advice, and promptly went home and searched the Internet for hours, looking
    for best tutorials. (Vi, who was more relaxed about things, was content to let
    me learn the basics first, then teach them to later.) I read articles about aperture,
    shutter speed, and ISO; I watched videos about autofocus settings. Growing up,
    I was someone for whom anxiety about the unknown inspired bouts of intense overpreparation
    — this is what got me through school, after all — and I was not about to change
    this pattern of behaviour. All of this instruction coalesced in my mind into a
    murky, confusing tangle of numbers and concepts; at times, I felt as though it
    would be easier to build a camera from scratch than use one to take a decent picture.
    As my cousin''s wedding approached, I secretly hoped that I might rise to the
    occasion, the rookie who winds up at the free-throw line at the end of a tie game
    and calmly sinks a pair of baskets.


    Unfortunately, once I actually got to the Philippines, all of that overpreparation
    did not pay off. This was not for lack of diligence; I took the camera everywhere:
    to the sprawling shopping malls patrolled by armed security guards, to the bustle
    of the local palenge, to the breathtaking views of Taal Volcano, to the restaurants
    where my family gathered for various pre-wedding celebrations. I snapped photos
    of colourful jeepneys in repose, photos of the Sacred Heart of Jesus plastered
    on lampposts, Vi smirking while holding the salacious man-in-a-barrel at a market.
    After each day of shooting, I would remove the memory card from the camera to
    view the photos on my laptop’s screen, and the results were sobering: most of
    the photos were some combination of too bright, too dark, or too blurry, and only
    about half were in focus. The only photos that were salvage were the ones I took
    in automatic mode, but these were also the photos that Vi and I wanted.


    My family, unaware of my aspirations (conflating the possession of high-end equipment
    with skill), were nonetheless thrilled with my hobby; I instantly became the ad
    hoc portraitist. I accepted my appointment with zeal; my services were enlisted
    at every gathering, every meal, every trip. To cope with demand, I eventually
    dispensed with my bag and started to wear the camera around my neck, the strap
    crossing my chest diagonally, allowing the camera to remain at my side like a
    holstered pistol, still discreet enough not to draw much unwanted attention (The
    strap in half when you’re not paying attention, warned one of my cousins). Now,
    the moment someone uttered my clarion call — Kodakan tayo! — I was ready. Soon,
    I was filling memory cards with family portraits: my relatives thriving at long
    tables at restaurants; my relatives thriving in the lobbies of upscale resorts;
    my relatives thriving in front of a mammoth karaoke machine at my uncle’s house;
    my relatives thriving outside the nail salon for some pre-wedding pampering, Vi
    at the edge of the frame, trying her best to blend in with my boisterous aunts.


    After the third week in the Philippines, I noticed it. Perhaps it was how the
    people at the market looked at me, or how their tone changed subtly when they
    addressed me. I had long been aware that there were differences in the way I was
    compared to my relatives, but something had shifted, or perhaps I had just become
    more attuned to it. For this entire trip, I had taken pains to blend in; I wore
    nothing too extravagant or foreign, opting for the most unassuming tsinelas and
    sandos from nearby shopping malls. Within seconds, everyone seemed to know the
    truth: I was an interloper, a non-local, and the camera was the icing on the cake.
    How could I have not seen it? I could not hide my accent, the halting way I spoke
    Tagalog, nor how I struggled to figure out exactly how to address someone on the
    street. With this camera yoked around my neck, I was a walking caricature, paparazzi,
    a Hawaiian tourist sans floral shirt. But who could blame me, my kababayan? With
    my entry-level wage as a hospital physiotherapist in Toronto, I already had more
    money than most of them could dream of.

