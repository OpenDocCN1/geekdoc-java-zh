    I became very fond of these women. So much that as our departure neared, I felt
    an impending sense of loss. I was going to miss them. One morning, as I was contemplating
    just that, I heard a knock on the door. When I answered, there stood one of the
    women from farther down the street, whom I didn’t know very well, but recognized
    right away. She held an envelope in her hand.


    “Bom dia, please come in,” I said.


    “Just for a minute, senhora.” She stepped inside so I could close the door and
    shut out the traffic noise.


    She handed the envelope and said, “This is for you. From all of us.”


    “Oh, thank you! What is it?”


    I opened the envelope and saw that there was money inside.

    There’s enough for you to get your baby’s ears pierced. We think that maybe your
    husband won’t give you the money to have it because he doesn’t like it, so we
    all pitched in a little bit for you.


    “Oh, senhora! Obrigada.” I felt the tears rush to my eyes. “What a lovely thing
    to do.”


    “We all really like you, and we’re so sad that you’re going back to America.”
    She said as she bit her bottom lip and turned her face away.


    “To Canada. And we’ll be back, you know,” I said.


    I kept in touch by mail with some of the neighbours for a few years. Usually our
    family did go back to Portugal several times after that, but mostly we went to
    the mainland. We made short side trips to São Miguel, but packed them with sightseeing
    and visits to family. It was fifteen years before we made back to that same town.
    We walked the cobblestoned streets and climbed the hill to feast our eyes on that
    glorious view again. Snippets of memories came back to Matt, but Georgia looked
    at it as if for the first time, of course.


    I knocked on the door of the next-door neighbour’s house. A young woman answered,
    we didn’t recognize.


    “Oh, we’re looking for Senhora Olivia,” I said.


    “That’s my mother,” she said. “I live here with her now after my father passed
    away.”


    When I explained who we were, she said she knew of us, and was very happy to meet
    us. She invited us in, but cautioned that her mother might not recognize us. “She
    is having trouble remembering some things these days,” she said. And then she
    continued, “You probably know that the neighbour across the street from those
    days moved to Boston, and the one who lived upstairs from her has moved to the
    city.”


    “No, I didn’t know,” I said.


    We walked down a dark hallway to the back of the house. Senhora Olivia was sitting
    at a table on the deck, sipping from a cup of tea. We greeted her then joined
    her for tea. I showed pictures of when we had last lived there, but wondered if
    she remembered us. I put my arm around my daughter and said, “And this is baby
    Georgia. And look, she got her ears pierced!” Georgia turned her head to the side
    to show off her traditional gold hoops. She bought into the tradition on her own
    accord, at the age of six.


    Senhora Olivia gave Georgia a broad smile. Then she looked at each of us in turn
    and her eyes welled up. I like to think that at that precise moment, she knew
    exactly who we were.


    # Ah-Ling Ge Lui

    Fan Lai La! Ah-Ling’s

    Girl Has Come Home


    2018

    The smell of brine fills my nose as the ferry pulls up to the 長洲 Cheung Chau pier.
    A sailor in a navy blue uniform with white trim tosses a mooring rope around a
    dock bollard and brings us in. I disembark, heavy-legged from a trans-Pacific
    red-eye flight and fifteen-hour time difference. Push through a crowd of people
    in business attire and school uniforms boarding the ferry for its next sailing
    boat to Hong Kong Island.


    My feet know the way from here. They carry me straight through the plaza, right
    at the dim sum restaurant, down past the hardware shop and hairdresser, and around
    the corner. I stop to wave at the neighbour smoking cigarettes and hanging her
    laundry, reach over the waist-high, brown metal gate and let myself in. But this
    time, I don’t know what to expect. Pau Pau, my maternal grandmother, passed away
    four days ago, and I’m here with my parents and sister for the funeral.


    My mother, Ah-Ling, was born on a tombolo named 長洲 Cheung Chau, literally “long
    island,” one of Hong Kong’s 263 outlying islands. The majority of Cheung Chau’s
    seventy thousand inhabitants live elbow-to-elbow on the flat part of the island,
    between two rocky hills at the northern and southern ends. Three-storey walk-up
    apartments are so close to each other that you can watch your neighbour’s tv.
    Laundry flaps on rooftops. Sampans and fishing boats jostle in the harbour. The
    outdoor seaside


    restaurants are popular weekend destinations for local tourists. Save for specially
    designed miniature ambulances and fire trucks, no cars are allowed on the island;
    the streets are too narrow and crowded with people: Indonesian and Filipina domestic
    helpers pushing grandparents in wheelchairs; weekend tourists canoeing on rented
    bikes; dock workers hauling all manner of goods on rackety dollies. The island
    is known for its street snacks (especially fish balls), and as home to the treasure
    cave of nineteenth-century pirate Chung Po Tsai. My grandfather, Gong Gong, was
    born on the island into a farming family. Pau Pau was urban, born into a family
    of steworkers on Hong Kong Island, the centre of the British colony, in a district
    called Sai Ying Poon, once a fishing port and the British military’s first base.


    On one visit back to Hong Kong for a cousin’s wedding, my sister and I went to
    Sai Ying Poon looking for Pau Pau’s childhood home. We arrived at the address
    given by our uncle to be greeted by the breezy indifference of a sleek luxury
    apartment. How naive of us to think we might find some fragment of connection
    to an ancestral home that had twice replaced. Later, we sat at a bar overlooking
    the street sipping on a beer called gwai lo (literally foreign devil, meaning
    foreigner or white guy). On another visit, a few months later, a friend and I
    stumbled upon Tuck Chong Sum Kee Bamboo Steamer Company, a shop making bamboo
    steamers the traditional way. Stepping inside, we watched the maker work, tucked
    between steamers stacked up to the ceiling. He used his bare feet to hold one
    end of a piece of bamboo while he wrapped the other end around a frame. Some of
    them were stamped with the name NEWTON BAKERY, a Chinese Filipino bakery and restaurant
    I’d eat at countless times in Vancouver’s Chinatown. A place where I shared conversations
    with other diasporic friends about Hong Kong, our grandparents, cultural identity.
    Ten thousand kilometres of distance were knotted together in an unexpected moment
    of connection.


    I’ve made the journey at regular intervals throughout my life. Sometimes with
    family, sometimes with friends, sometimes solo. Growing up in a middle-class,
    diasporic family, we travelled internationally only to visit the homeland. No
    Disneyland or Caribbean resorts. It was either road trips, motels, and car-camping
    in Western Canada or a fourteen-hour overseas flight to one of the densely populated
    cities. When we would visit Hong Kong on summer holidays, our base was always
    Pau Pau’s house on Cheung Chau.


    The first time we visited, I was five years old and my sister was one, plane tickets
    came in special envelopes, and meals came with silverware. I remember being embraced
    by clouds of diesel and the smell of hot garbage as we stepped out of a taxi at
    Central Piers on Hong Kong Island, lemon tea and instant cup noodles on the ferry
    to Cheung Chau. My Canadian-born senses had no point of comparison for the whole
    pigs hanging with their snouts in the open storefronts. But I was enthralled with
    the shops bursting with bright plastic beach toys and the latest Twin Stars and
    Hello Kitty stationery. In every photo, chubby cheeks flush, bangs stick to my
    sweaty forehead, and the tower above my Hong cousins. I don’t know if it was to
    save dishwashing water or Pau Pau had a designated mug for each of us in her living-room
    drawer. We were not to drink out of anyone else’s.


    My family is out for a hike around the island’s mini Great Wall. It’s ten days
    since I last washed my hair, and my scalp itches in the mid-morning sun. My mother,
    sister, and I are observing a Chinese custom where you stop washing your hair
    from the day someone passes until their funeral rites are completed. For the last
    ten days we’ve been folding gold and silver paper into ingots, to burn as offerings
    at Pau Pau’s funeral. My great-aunt drops by every day to check on us, popping
    over from the corner store she owns and lives above the street. Other than that,

