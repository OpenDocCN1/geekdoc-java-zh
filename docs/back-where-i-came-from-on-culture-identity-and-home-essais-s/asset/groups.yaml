    走到镜子前。我觉得那件长袍把我淹没了。就像是我闯了妈妈的衣柜一样。


    当我姨妈在那儿拉拉扯裙子时，我的目光被一个穿着无袖苏利亚（zuria）的模特吸引了。它像一件比基尼一样，有粗棉带可以系在脖子上，而且它不是单色的，而是白色的，腰部和裙底有浅蓝色的装饰。非常合身，而不是我想象中那种笨拙的设计。我把它从模特身上取下来，迅速展示给我的家人看，然后直接走向商店后面，消失在蓝帘后。尽管试衣间很小，而且没有镜子，但在把布料穿过头之前，我就知道我会喜欢它。令我惊讶的是，当我展示给家人看时，他们都同意了。当我回试衣间时，我不禁想整个过程是如此简单。我哪里知道，商店前面正酝酿着一场小战斗。


    当我见到那两个个人时，店主用阿姆哈拉语问我是否真的喜欢我刚穿过的那条裙。我点头轻声说：“噢。”就在那一刻，我从家人的反应中看出我犯错了。那个男人已经怀疑我是个外来人（verenj），但现在，多亏了我的口音，我姨妈在抓住我的手并带着我们其他人回到街道之前，先是告诉了店主。“那条苏利亚的价格太贵了，”她对我说。我们一路走回主路，我的向导（howboy）在车里等在那里。看到我们后，他下车听着菲塔向他讲述了整个遭遇。他转向我，问我是否真的想要那条苏利亚。当我点头说是时，他径直带着我们冲进商店，片刻后回来告诉店主同意降价了。价格仍然比当地人买到的要贵，但还没到离谱的地步。晚餐期间，我得知我的向导是如何谈判价格的。他告诉店主，他应该感到羞耻，竟然试图骗一个一个小女孩的衣服。尤其是一个第一次回来看妈妈的女孩。


    我记得见到我妈妈的长兄特沃德罗斯（Tewodros）的那一天，他的绰号是“泰迪”。在我童话般的想象中，我把他与泰迪熊联系在一起：高大、宽阔、柔软且好抱。当时，他住在妈妈的家乡阿德瓦（Adwa）。我爸爸的妹妹梅德辛（Medhin）雇了一个人开着一辆油漆斑斑的老旧丰田面包车送我们。旅程是危险的——我们行驶在没有护栏的山蜒山间土路上。稍有不慎，我们就会掉下悬崖进入茂密的森林。当我们终于到达阿德瓦时，我们在一个小市场区域停下，下车等我舅舅到达。我从妈妈的面部表情看出她正变得不耐烦。这时，我的姨妈梅德辛指着未铺路路对面一个身影。一有机会见到这个男人，我兴奋不已。当他走近时，我看到他的衣服穿在他瘦小的身材上，意识到他并没有我那五英尺四的妈妈高不了多少。我脑中他的形象消失了，焦虑随之而来。只有当他将我拥入怀中时，我才感到与他产生了联系。尽管比我预想的要小，但他很强壮，紧紧地抱着我，亲了好几次我的脸颊。当他从我的怀中放开我时，我意识到我的想象并没有错。


    当我们2011年全家人一起回去时，我妈妈已经十四年没有回埃塞俄比亚了。在这十四里，她失去了母亲和一个哥哥，给她留下了无法逾越的悲伤，这种悲伤在加拿大很难独自消化。她经常谈起他们，所以感觉他们就在身边。但当我们穿过阿德瓦开车她妈妈家时，我感觉到车里弥漫着一种沉重感。妈妈发出一声低沉的哀嚎，那些认识我奶奶并帮妈妈带大的邻居立刻围住了她，把她带进屋安抚。对我来说，这是一种释然的感觉：不像我的泰迪舅舅，我必须想象他们可能是什么样子，或者他们的拥抱是什么感觉。


    很长一段时间，我对“家乡”的概念被父母告诉我们的故事所影响。我妈妈年轻时大部分时间待在这个国家的首都，在镇上穿梭，她再也无法告诉你哪里在哪里了。不同的社区已经发生了变迁。她年轻时常去的许多露天市场现在已变成封闭的购物区和餐厅。有时，我妈妈和爸爸只能静静地坐在车里，偶尔对周围的变化发出惊叹。他们记忆中的“家乡”消失了。曾经开阔清朗的天际线，现在被高层公寓楼和工厂的兴起所中断。这种冲突在他们的脸上显而易见；对进步感到自豪，但也对无法认出曾经的家感到沮丧。


    语言是我承载大部分悲伤的地方。每当我见到亲戚时，焦虑就像一条发痒的毯子一样覆盖着我。模式是一样的：他们会跑过来拥抱我和哥哥，在我们脸颊上亲好几，然后开始用流利的提格林雅语（Tigrinya）或阿姆哈拉语对我们说话。这些词汇的组合——有些我听懂，有些我不懂——让我猜测我的家人在说什么。这感觉像一个我无法拼成美丽画面的拼图。尽管我尽了努力，我的父母还是得过来翻译我们家人所说的话。


    这是我第一次也是最后一次去埃塞俄比亚旅行。承认，当我们回到多伦多时，我感到一阵宽慰。我们都是如此。回“家乡”是一场后勤噩梦，每一天都满了见不同的亲戚、分发从加拿大带回的物品给合适的人，以及躲避那些要求过多的亲戚。九月，我回到了学校，感觉自己像戴了某种勋章。当谈起“家乡”话题时，我也能加入对话。随着年龄增长，我怀念那个国家，并计划在2020年获得本学位后返回。我告诉自己这次旅行将有所不同。不再和我哥哥进行那种被我们称为“皇家巡游”、会见亲戚并握手的行程，而是去看特定的景点。阿克姆（Axum）的方碑。梅凯莱（Mekelle）的约翰内斯国王宫。不幸的是，2020年带来了全球大流行和埃塞俄比亚的战争。后者永远地改变了我对“家乡”的概念。我开始看到这个国家黑暗的一面，这让我深感恐惧。亲戚向我讲述的埃塞俄比亚之美，那些传说和历史……

