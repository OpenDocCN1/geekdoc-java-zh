    那片土地，开始变得像埋藏的宝藏。但要到达那里，你必须穿过这个国家最浑浊的水域。尽管如此，我渴望回去亲身体验埃塞俄比亚，弥合我与这片遥远土地之间的距离。


    ## 安捷洛·桑托斯


    ## 快门


    对于门外汉来说，相机是一件冷酷的装置：它上面布满了细小的按钮和旋钮、微型开关和冷冰冰的玻璃片，还有一种像从虎鲸背上取下来的黑色橡胶塑料。它握在手里感觉很沉重，像是一块毫无生气的物质块。最近，我看到了一张专业相机的
    AI 插画，它看起来像个怪物：像麻疹一样密密麻麻地挤在相机面的每一个角落，镜头筒被过多的齿状环卡得死的，其中几个似乎融化在了相机的其他部分中。当 Vi——我当时的女友，现在是我的妻子——把生日礼物送给我的第一台相机时，我记得在拆箱时感到一丝预感，仿佛相机的机械结构会战胜我，担心它或许会迷失在那些晦涩的细节中。


    尽管如此，当我的表弟 Vince 邀请我担任他在马尼拉婚礼的花伴时，我知道我会带着相机去。菲律宾不仅和我父母在我三岁时离开的出生国，还是我们全家在 ways东生活的十年里，每年夏天都会回到那里的地方——在那儿，为外派员工提供假期作为标准福利包的一部分是常有的做法；而且，在我们现在住在加拿大的这，那里也是我们近五年没有访问过的国家。除了表弟的婚礼外，这也是一个带上相机的契机：一次归乡，一次回到母国的旅程。


    很快，我们全家都订好了行程进行这次朝圣之旅：我的父母、我的两个姐姐（她们都在我们离开菲律宾后出生），以及 Vi，她重新安排了工作时间与我们一起。在旅行前的几周里，我发现自己经常梦见七虹沙冰（halo-halo）、猪肉糕（nasal）、三轮车和吉普车，以及街道上口出的菲律宾语那悦耳的抑扬五音节。


    我很快学会了带着相机旅行需要深思熟虑和对细节的关注。在这次旅行之前，我从未携带过如此昂贵的东西，我一直担心会在某个时刻损坏相机，打开包时发现镜头裂了，或者内部组件咯咯作响。当我们和那些箱子搏斗时，我重新调整了手提箱里的填充物；相机有效地安顿在垫子里，随着我们穿过机场漫长的队伍，随着我们在简陋的行李推车上挣扎海外人箱（balikbayan
    boxes），随着我们在通往世界另一端的、那场折磨人的13小时飞行中坐着并扭动着。当我们从候机楼大门进入马尼拉闷热的热带湿气中时，我检查了包内，看到相机完好无损，我松了一口气。Vi
    看到我在飞行期间好几次窥视我的随身包，调侃道：“我们的宝宝平安到达了吗？”我投了她一个充满不满（但也带着愧疚）的眼神。


    几个月前，当相机还很新时，Vi 和我在多伦多一家当地相机商店那狭窄、光线昏暗的背包里上了一个摄影课程。我们被这门课程所吸引，是因为我们都被社交媒体上由优秀摄影师拍摄的照片所启发——那些照片看起来像是被阳光吻过的，每个人的头发都在发光，背景模糊成奶油般的质地——我们试图在自己身上创造出这种魔力。我们的导师是一位严厉的苏格兰人，他的作品挂在画廊里，他一直坚持传授这种特定的策略：只记住几个最常用的设置，然后直接出去出去去拍就行了！“诀窍在于，”他说，“不要让相机成为阻碍。”我对这个建议嗤之以鼻，回到家后在互联网上搜了几个小时，寻找最好的教程。（Vi
    对事情比较随和，她满足于让我先学习基础知识，以后再教她。）

    '
