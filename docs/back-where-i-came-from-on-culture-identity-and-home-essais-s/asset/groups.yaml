    the beach, bringing us to where she once stood at the edge of her new life?


    On the same beach as Four Twenty South, over one hundred nests are laid by green
    sea turtles every year. Each nest can have up to one hundred eggs requiring an
    incubation period of fifty to eighty days. A few days after hatching, the baby
    sea turtles begin an instinctual and perilous crawl toward the ocean. Of the thousands
    that hatch and set forth on this journey, dodging natural and man-made predators,
    many will not survive. During their slow migration to the waters, the turtles''
    brains are imprinted with all the chemical cues they use. This information — the
    sand, the climate, the ocean currents — is recorded in their brains. Tests performed
    in captivity have shown that turtles can detect their X-Y coordinates via an internal
    compass. The female turtles who make it to safe waters travel thousands of kilometres
    over the next decade returning to lay eggs on their natal shores. Sometimes when
    the female returns, they miss the exact spot because the earth''s magnetic field
    shifts slightly each year. That’s when they rely on those imprinted cues to bring
    them closer to where they are meant to be. Turtles go back to their birth shores
    to lay eggs because their mothers have passed on immunity to their offspring;
    the babies are better able to resist the parasites of that particular place.


    Mom did not pass on any such immunity to me. The night I got sick in Mombasa was
    I ate homemade ondhvo served around a group of women sitting on the benches outside
    the jamathana. Not a fan of ondhvo, but feeling grateful to be part of this impromptu
    gathering, I scanned for the smallest piece, then regretted it within minutes
    at the first rumble of my stomach. I excused myself from these ladies, whom I’d
    just met, who had welcomed me into their circle with their গ্রহণের of Nanimaa’s
    unrivalled sewing skills, and walked the sixty-three steps to the flat in increasing
    discomfort. As I stumbled toward the bathroom, doubled over with cramps, my body
    said that, at least in this way, I was not from there. I have the imprints of
    another shoreline.'
