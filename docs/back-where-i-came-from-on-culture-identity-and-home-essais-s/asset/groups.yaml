    # 引言


    本书诞生于两个移民后代之间的共同好奇心，他们关注那些散居作家的经历，这些作家回到了自己、他们的父母、或者在某些情况下是祖辈的祖国。作为同样回到过母国的作家，我们希望在背景迥异的故事讲述者之间找到共同的纽带，以及这些纽带在何处为何结束。他们在访问祖先土地时，是否像我们一样，遭遇了关于自己的不安问题？他们是否带着更新的归属感、家园感和身份感回到？我们是否能以艺术形式呈现这些叙事，让它们在英语文学中占据应有的空间，并为同时处于“这里”和“那里”的快乐与挣扎提供思考？


    向写作界发起了征稿并收到了许多投稿。我们构想了一部展示人类经验多样性的文集。显然，关于旅行的故事将包含许多不同的角度；在《飞行路径》中，Omar El Akkad
    讲述了关于父亲去世的经历，而在《部署》中，Christina Hoag 展示了作为一个拥有特权的第三文化孩子成长的感受。


    在当今对土地主权的讨论成为焦点、当人们关注人类经验的多样性此时，我们很自豪能为这场对话增加背景和细微差别。这是一本由作家组成的书，我们这些编辑者现在生活在、并回到了自己的历史之中。本着这种精神，我们听了来自北方岛
    Kwaki 第一民族成员 Alison Tedford Seaweed 的讲述，她经历了一场加深其原住民认同的回归；还有以色列-加拿大的 Lishai Peel
    在《母亲。土地。》中讲述了她在远离政府的“暴力占领”后如何回到她的母亲和故乡——“无法逃避那个创造我的人”。


    Alexandra C. Yeboah 写的《母国知道我的名字》展示了自己并不足够“非洲”。Ayesha Habib 的《家留下了什么》承认了英国殖民时期印度复杂的历史。Nhung
    N. Tran-Davies 在《家之旅》中通过医学院的机会跟随回到越南，并带着对母亲背景更深入的回来，这回答了关于她自身成长的问题。


    Omar Reyes 写的《鸡汤与玉米饼》是一个关于萨尔瓦多多的动人故事。Hannah Zalaa-UulI 在《土地记得它的所有孩子》中将蒙古命名为“南纬
    20 度 20 分”，无论她离开了多久。这本书的标题带有几丝幽默感，是为了回应那些向移民（或被视为移民的人）发出的“回到你们来处”的乏味指令。这里有二十六位作家，他们确实做到了，并带回了深刻、复杂、幽默且神奇的故事供我们讲述。我们欢迎读者来到遥远的土地，进入我们关于自己是谁、属于何处以及“家”对我们意味着什么的思想深处。


