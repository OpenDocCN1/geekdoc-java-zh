    spirit. By the eleventh-century Kecharis Monastery, “katchkars”—iconic masses
    of stone engraved with crosses — stood as powerful symbols of Dede’s resilience.
    The green mountains of Tsaghkadzor evoked the land of his family’s Turkish village,
