    VESNA JAKSIC LOWE 是一位作家，也是致力于促进人权和社会正义的非营利组织传播顾问。她在前南斯拉夫的地区长大，曾为《2023年康涅狄格文学选集》、《纽约时报》、《纽约每日新闻》、《Catapult》和《Pigeon
    Pages》写过她的移民经历。她运营着一份关于移民文学的月度通讯《移民风》（Immigrant Storm），并在罗格斯大学的 Cooper Street
    文字工作坊教授过相关主题。她曾作为一等奖家长奖金获得者参加了玛莎葡萄岛创意写作学院的会议。她居住在康塔诸治州的老格林尼奇。


    KATHRYN GWUN-YEEN LENNON 是作家兼编辑，居住在埃德蒙顿/Amiskwacīskahikan，拥有香港粤语和爱尔兰混合血统。她的诗歌发表在*Canthus*、*Brickyard
    Spoken Word*、*The Polyglot*、*Living Hyphen*、*The Globe and Mail*、《Ricepaper Magazine》和*The
    Ethnic Aisle*上。她的非虚构作品发表在*Spacing and Alternatives*上。她的作品被收录在多部选集中，包括《重新构构火：能源的未来》。她是*Hungry
    Zane*的创始人兼共同编辑，曾是埃德蒙顿2012年格斗诗歌团队的成员。


    DIMITRI NASRALLAH 是四部小说的作者，其中包括《流血、尼科、黑体》，该书曾入围丰业吉勒奖，并入选了CBC“加拿大阅读”计划的短名单。他于1977年出生于黎巴嫩，1988年移往加拿大。他住在蒙特利尔，在那里担任*Véhicule
    Press*旗下*Esplanade Fiction*出版的虚构编辑，并在康考迪亚大学教授创意写作。


    LISHAI PEEL 是一位居住在安大略省哈密尔顿的作家、社区参与型艺术家和顾问，在艺术文化领域拥有十多年经验。她的作品曾获得加拿大作家信托基金、《The
    Malahat Review》和温哥华作家节颁发的奖项。她的散文和诗歌发表在*Room Magazine*、*Lilith Magazine*、*Hey Alma*、*Middleground*、*Arc
    Poetry Magazine*、*The Malahat Review*、*Ilanot Review*等杂志上。Peel拥有格尔夫大学的创意写作文学硕士学位，是哈密尔顿市的首位“驻地诗人”。


    # OMAR REYES 将时间分配在写作和社会工作之间。他对著名艺术家和名人的采访曾发表在《Georgie Magazine》上。他还担任一家名为“美丽的桌子”教会的共同牧师，在那里可以重新获得更具解放性和包容性的信仰。Reyes与妻子和三个儿子住在埃德蒙顿。


