    # The Journey Home


    A reporter recently asked my mom if she would do it all over again. Risk our lives
    by taking all her children to sea in a rickety fishing boat. Come to Canada from
    Vietnam as “boat people” refugees. I hesitated to translate Mom’s answer.


    The diplomatic, romantic, heroic answer would have been “Yes.” Yes, she would
    have gone through all the pain and suffering again and again to bring her children
    to this land of hope and opportunities. After all, my siblings and I have created
    beautiful lives for ourselves in this amazing country, with all the privileges
    of warm homes, adequate food, enduring safety, good education, and many career
    opportunities. I, the youngest of her six children, had become a medical doctor.
    From all our humble beginnings as boat people, forty years ago.


    But the instinctive response was “No.” No, she would not do it all over again.


    Images of times gone by flashed before me. Images of Mom strangling herself, tightening
    a belt around her neck, as young kids frantically screamed and cried for her stop.


    Her answer was heavy, weighed down in part by my shame. Seeing her aged frame
    seated across me, frailer and bent by the years, her silver strands pulled back
    in a bun, I understood. It was not easy for a single mother to raise six children
    in a new, often bitterly cold, land. In fact,


    In 2000, I was twenty-six, halfway through my medical school training and eager
    to travel. What better way to start travelling, I thought, than to do a medical
    elective in Vietnam? Mom thought so, too, as was an opportunity for her to tag
    along. I was only four years old when our family escaped from the ravages of the
    Vietnam War; it was time to go back to my birthplace, the small city of Cà Mau
    on the southern tip of the country.


    You could say my feelings were a potpourri of angst and joy, dread and excitement.
    Not only was the political climate of communist Vietnam rather uncertain at that
    time, but my relationship with Mom was precarious too — complicated by years of
    turmoil in our single-parent immigrant home marked by the occasional fist driven
    into the wall by my older brother, lashing out against my mother’s strictness.
    She guided us kids with harsh measures for fear that any wandering on our part
    would bring dishon to the sponsors who brought our family to Canada.


    The country had just reopened its doors to the West, and the diaspora were trickling
    back to revisit the families and life we’d left behind. My heart danced in my
    chest when the plane touched down, but my mind remained in disbelief. It was surreal
    for me to set foot on the soils of a land that only, up until then, existed in
    Mom’s stories, news reports, or my own nebulous childhood memories.


    I was no longer sure that I could survive a month in this country — a country
    still pulling itself from the destruction of war. My very survival depended on
    my ability to position myself on the toilet so not to fall into the bottomless
    pit, all while the pinching nose and holding my breath to prevent asphyxiation
    from the malodorous ambience. Alas, you were doomed doubled if you forgot to bring
    your own toilet paper!


    Mom, though, was unfazed. This was her home. I became acutely aware of how accustomed
    she was to living for years under these conditions, without adequate food or electricity,
    raising six children, practically on her own, the constant threats of bullets
    and bombs. Having hot water, or consistent running water, for that matter, to
    shower or bathe in were privileges I had growing up in Canada.


    Word of Mom’s return to Cà Mau sped quickly. And a steady stream of old friends
    and distant relatives came, some literally from the jungle, to visit Mom at Aunty’s
    tube house. Tears poured as we marvel, embraced, and reconnected after twenty-two
    years. I learned of a local saying: “Do not pick fights with anyone in Cà Mau,
    since anyone could be a relative.”


    Those who remembered me were in awe of how big I was. My cousins weren’t shy to
    laugh at me stuttering and stumbling my accented way through broken Vietnamese.
    People on the streets knew my paler skin, my mannerisms, that I was an outsider.


    Người Việt Kiều is the word. People stopped and stared and whispered to one another.
    It was a novelty for them to see these overseas Vietnamese. Little did they know
    it was also a novelty for them, seeing a sea of black-haired people who, at a
    glance, looked pretty much like me.


    Their thinner, smaller frames, sun-scorched skin, dusty outfits, worn-out slippers,
    told the story of the life we left behind. Men and women, stooped by the heavy
    loads on their back and shoulders, meandering down the dirt roads. Nourished street
    kids in tattered clothes swarming with palms outstretched, begging. Not long ago,
    people here were being robbed and killed for a bag of rice. This was the reason
    Mom rummaged through our garbage in Edmonton, much to our dismay, to make sure
    that every last grain of rice was eaten.


    At the dinner table with my aunts and uncles, I saw Mom in a light that was a
    rarity in my younger memory — Mom laughing and giggling over shared stories. This
    was a talkative side of Mom I never knew.


    My youth was coloured by the times Mom poured her heart out in despair, as kids
    chased her down the snow-blown streets, profusely apologizing and begging for
    her to come home. The lessons learned from our defiant words or acts of rebellion
    were harsh. So harsh at times, I buried it. Buried it all, so as to go on.


    It became clear that my cousins, were ten years my senior, knew Mom very well;
    perhaps, even more than I.


    I had little recollection of my cousins, being that I was so young when we left.
    I had only known their faces through a handful of black-and-white photographs
    sent from overseas. They, however, banked a lot of memories. These memories came
    alive on the streets of Cà Mau while I rode behind my cousins on their mopeds.
    As we toured the city, the passing vignettes prompted my relatives to share stories
    of times when Mom roared all day to market through the Mekong Delta only to discover
    all of produce spoiled and rotten from the scorching heat. How devastating that
    was for her, as she had children to feed. There were stories of how she was blindfolded
    and dragged by soldiers for the sake of taunting their citizens. And more stories
    of still harder times that followed after Mom stole away with her children from
    an abusive husband.


    The air was not hot at dusk. I never knew my own father. All I knew was that he
    died before I was born, and I didn''t care to know more. Mom was all I knew and
    needed to know. I was finally seeing this woman for who she really was. This woman,
    back in Canada, toiled all day, all night making meals, washing dishes, sweeping
    floors, sewing clothes, doing laundry, and so much more. Could I stay better for
    those times she tracked us down to parties to drag us to finish our studies while
    we protested indignantly—“People can take everything away from you, but they can''t
    take away your education,” she would say.


    During one of my clinic days at the Cà Mau hospital, a young patient came in for
    what I understood to be a tonsilection. To my horror, the surgeon proceeded to
    excise and extract the patient''s tonsils while the patient was still awake and
    seated upright. The poor patient gagged and choked, and spat blood through it
    all.


    Obviously, much in Vietnam hadn’t changed significantly in the decades since we
    left.


    I would have to say of our struggles as Vietnamese refugees and immigrants to
    Canada. For twenty years, we struggled to come terms with the trauma of war, destruction,
    abuse, and poverty that Mom, and especially my older siblings, lived through.
    Twenty years on, the scars still haunted us. They infused themselves into every
    decision, argument, and emotional breakdown.


    Now I know that those ongoing struggles were largely because I neither knew nor
    really understood Mom.

    '
