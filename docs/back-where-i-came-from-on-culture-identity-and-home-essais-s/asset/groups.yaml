    # DIMITRI NASRALLAH


    # Crybaby


    In November 2009, I returned to Lebanon for the first time since we boarded a
    ferry and sailed off to Cyprus that fateful morning when I was five. Though we''d
    left as a family twenty-seven years ago, I was returning alone. It felt like something
    I had to do, that I couldn''t put it off any longer.


    I remember the trepidation of the flight to Beirut, its long stopover in Paris,
    leaving Montreal and, at the beginning of her second trimester, to spend a month
    in a place I only knew from the furthest reaches of my memory. I was writing a
    second novel, and I was failing at it, unable to find its core after multiple
    drafts. It transformed into a story about leaving Lebanon, but it had no beating
    heart. Lebanon was a world that I knew, but from which I was inherently distanced.
    Had anger in my life because of it, frustrations being pulled across the world
    and uprooted many times with what felt like arbitrary strictness. When I was young,
    I planted all that anger on my parents. But now that I had lived alone for a few
    years, there was no way to leave all those memories behind. I did not want to
    pass on those reverberations to the child next April.


    There weren''t many passengers on the turbulent Middle East Airlines flight from
    Paris to Beirut. As the plane approached the airport and the Mediterranean below
    finally gave to the shores of Lebanon, I was able to move into a window seat and
    take every moment of the descent. I had come back for answers, but I didn''t know
    what questions I was asking, and I wanted to absorb everything — the shoreline
    refineries, the yellow cloud that hung over the city in the air. I knew a fair
    bit of trivia about the land below. Ever since the assassination of Prime Minister
    Rafic Hariri in 2005, followed by the war with Israel in 2006, I had awakened
    to the fact that I could read Lebanon’s'
  - '[PAGE 18]


    daily news online. I had read about the country’s ongoing struggle to distance
    itself from Syrian influence, Israeli aggression, the growing power for Hezbollah’s
    political arm among Shiites, the regular assassinations of public intellectuals.
    I knew that the same political families who’d been in power when I left at age
    five were still in power as I returned at age thirtytwo.


    What I did not know as well, and which was much more intimidating, was the large,
    multibranced family I had there. After I retrieved my suitcase, I walked out into
    the arrivals area and looked around for my Uncle Murad and Aunt Muna, my mother''s
    brother and wife, whom I fondly remembered as visiting us in Athens and Toronto,
    where I''d spent my childhood. Their youngest son, Raja, had been my best friend
    when I lived in Beirut. Their oldest son, Eid, had died at eleven years old, the
    victim of a car bomb that went off on a street near their apartment building.


    I looked around the arrivals area for my uncle’s thick glasses, my aunt’s straight
    brown hair, but they found me first. “Keefak, ya sakeh?” Uncle Murad said as he
    pulled me for a hug.


    “How you''ve grown!” my aunt Muna exclaimed, kissing my cheeks. I was immediately
    transported back to when I was young and my would give me loose change for candy,
    and my aunt would wet the ends of a tissue to clean my cheek at church. Maybe
    it was because I was exhausted from travel, but their warmth was sudden and unexpected,
    an affection from loving adults that I hadn''t even realized I''d been missing
    all along. It wasn''t the culture that was cold, distracted, and distant—it was
    my parents.


    We drove through the south ends of the city toward their home in Hamra, near the
    American University in the commercial heart of Ras Beirut, that saw some of the
    fiercest battles of the war when we were back there. I exchanged news of my family
    as I looked out the window at the bustling, chaotic driving around my uncle’s
    car, the brown dirt that made up the sides of the roads, the new construction
    sites going up next to bullet-marked abandoned buildings awaiting demolition,
    and I thought again of how I had initiated this trip in secret, without telling
    my parents. Having'
  - '[PAGE 19]


    joined Facebook the year before, I''d connected with my relatives on my own for
    the first time. I''d previously shunned relatives or anything to do family. Our
    first decade in Canada had been tumultuous and filled with sacrifice, and I''d
    concluded that I was better off alone, reinventing myself without family or the
    heritage attached to them. But now that I was an adult preparing to have his own
    child, I began to see them differently. I''d written to my aunt and expressed
    my interest in visiting Lebanon. To my surprise, she wrote back within the hour
    inviting me to stay with them for as long as I liked.


    In the car, she turned around and said to me, “Everyone is so curious to meet
    you. We''ve had calls from your dad''s side of the family."


    “How do they even know I''m here?” My father was the youngest of eight brothers
    and sisters, who had each gone on to have their own large families, and since
    they were mostly a generation older, I knew few of my many paternal cousins.


    “The news spreads,” she said. “Everyone wants to know what happened.

    What do you mean?


    Your family is the only one that has never returned,” my uncle said, his eyes
    on the road. “They erased us all from their lives."


    “Everyone else came back?”


    “It hasn''t been easy for them,” I said, feeling obliged to defend my parents.
    Here, I quickly realized, I was not my own person, but an extension of them. “We
    live halfway around the world.”


    “Sure, you''re right,” my uncle said. “But even when they were young, they couldn''t
    leave quite enough.”


    In Beirut, in between daily meetings with relatives, I walked a lot. I walked
    along Hamra Street and looked at all the shops. I walked along the Corniche and
    stared out at the sea. I walked along Bliss Street and tried to remember what
    it looked like when I was last here, when it was falling apart, just boarded-up
    storefronts that hadn''t yet cratered. Where'
