    # JUNE CHUA


    # Foreign Body


    My sisters and I had been walking toward the washroom, a small concrete building
    standing several metres away from my great-aunt''s home in Kuching. It was our
    first day in Malaysia and our family''s first trip to the motherland since migrating
    to Canada eight years prior, when I was six. We were unaccustomed to the idea
    of having to pee into chamber pots, and so we plotted to get together.


    On our way, we saw an elderly gardener tending to the plants before he left for
    the day. He''d quickly assessed us and muttered: “Oh, the Australians!" My great-aunt''s
    grandchildren, who lived in Australia, sometimes visited. They looked very different
    from us, as their mother had a European background.


    So, we thought we fit in.


    That, perhaps, we looked cast as belonged.


    His statement immediately cast us as outsiders.


    “No, we''re from Canada. But how did you know we aren''t from here?" my sister
    asked.


    “You smell like butter!" And with that, he shuffled off. His words cloaked the
    air. It was humid and hot, I felt like sticky rice wrapped in banana leaf. Now,
    I imagined myself as a melting stick of butter.


    We had been in Canada for seven years by then. Somehow, Canada had infused us
    with a milky smell that eman foreignness no matter what we looked like. Physiological
    transformations were afloat.


    I have since discovered that in parts of East Asia, Westerners are thought to
    reek of butter. In post–World War II Japan, when it was heavily occupied by American
    and British Allied Forces, foreigners were deemed bata-kusai, a derogatory term
    meaning “stinking of butter."'
  - '[PAGE 142]


    When we first arrived in Canada in the seventies, people offered us giant glasses
    of milk and cheeseburgers, or — worst of all — milkshakes! We could barely finish
    half of the shakes, the milk, the burgers. They gave us stomach aches and seemed
    faintly disgusting to taste — the odour of cow’s liquid winding its way down our
    digestive tracts thick and heavy, the sludge milkshakes lining the walls of my
    stomach like house paint.


    In Malaysia, evaporated milk and sweetened condensed milk were staples like rice
    or shrimp paste. In tropical lands, canned foods were safe to keep for months.
    It was rare to get cakes with whipped cream as the heat would render them sodden
    mess within minutes.


    When we first arrived in Canada, we soon began our journey of ingesting many more
    milk-based foods, which in time became an intrinsic part of our diet. It was converting
    me on a cellular level, altering my being. A Canadian friend once told me how
    simple it was to make butter; just whip the cream until the fat separates from
    the liquid. I immediately thought of myself as the cream and the force of migration
    as mixer, separating me into something new and shapeable.


    # CAKE


    I turned seven a month after our arrival. Da traversed a busy Vancouver freeway
    to purchase a Black Forest cake from Safeway. We thought the name of the supermarket
    odd but liked that it conferred a greeting *welcome, you will be secure here.*
    From that point on, this utterly German confection would be the only cake we’d
    ever have for birthdays. Mum was obsessed with it. She loved the layers of cherry-liquored
    cream interspersed with chocolate cake and topped with maraschino cherries. It
    was mostly cream. These cakes tasted of fake milk product and bad, syrup liqueur.
    I think it perhaps represented all those European-style cream cakes she could
    never get back home. Nevertheless, it became tradition. A new ritual to signify
    our march march toward citizenship and a frosted future.


    In time, we were complaining to my mom whenever she cooked curry or stir-fried
    veggies with fermented shrimp paste, telling her that belacan stank'
- md: '

    like stinky socks.


    It made our clothes and hair reek, we said. Not wanting this foreign smell to
    block our integration, we urged her to only cook her Malaysian/Chinese dishes
    on weekends. We still hankered for those flavours from time to time.


    ## MAC ‘N’ CHEESE


    My older sister was tasked with making us after-school snacks and lunches during
    spring and breaks. This meant an array of convenience foods: lots of mac ‘n’ cheese,
    creamy Campbell’s soups, canned Chef Boyardee ravioli, and in warm months, ice
    cream. Our fridge was stocked with those orange slices of cheese in their clear
    sleeves. I recall peeling off the cheese tile as a quick after-school snack. In
    the mornings, I enjoyed the saccharine sweetness of the milk in our Cap’n’ Crunch.
    I devoured Fudgesicles and Peanut Butter Parfaits at the Dairy Queen in our neighbourhood.


    We were slowly transforming from the inside, upping our intake of cottage cheese
    and yogurt. Each morsel of milky food was immersing further into Western culture
    and habits. It would be irreversible. Moreover, my parents had instituted an English-only
    rule, afraid that we’d fall behind in school. They didn’t imagine the consequences
    of severing our linguistic connection, that one day we’d return to Malaysia, and,
    without Hokkien, find it impossible to communicate with our aunties, uncles, and
    cousins. We were to become milk-fed, Anglo-adjacent Canadians in order to succeed
    in one of five approved professions: doctor, lawyer, dentist, engineer, or corporate
    leader with an MBA. Our monolingual status would help us get there, just another
    part of Western culture that we were to inhabit like an ill-fitting costume.


    Yet, externally, we were still different from the mainstream population. Children
    often made fun of our eyes, pulling the sides of their eyes to become slanted.
    Our Western “costume” was transparent.


    I longed to have eyelashes and paler skin.


    I was a yellow alien with slitted eyes . . . capped by thick, black hair that
    absorbed the sun instead of silky blond locks that gave off light.


    ## TURTLE EGGS


    By the time we were back in Kuching, I was undergoing puberty, and this was deeply
    uncomfortable. My body was morphing in unpleasant ways, sprouting large breasts
    and giving me a circular, soft shape. I felt about three times the size of most
    Malaysian women and girls. Relatives commented on how “big” I was. I grew sullen.
    Being back “home,” I felt more alien than ever before.


    We spent those weeks consuming noodle dishes, seafood wok-fried in lemongrass
    and shallots, crispy greens tinged with spices, garlic, and galangal making us
    unusually greasy. Still, I found it thoroughly delectable. Turtle egg, on the
    other hand… I cannot bear to eat unscrambled chicken eggs, let alone those translucent,
    gooey, soft eggs offered by my aunt and uncle. But it was a delicacy, and I was
    their grateful guest who would never dare decline such hospitality out of feared
    rudeness. I asked for a glass of Coke and proceeded to have heaven down in gulps
    of pop, to prove my gratitude for such a delicacy. After the fourth, I asked for
    more to drink. My uncle’s wife exclaimed: “Oh, I guess you like it! Would you
    like more eggs?” I gracefully declined, intoning that I was so full and thank
    you very much. But perhaps I possessed acting skills far by excellence and had
    performed genuine delight too realistically because my aunt, a slim and sweet
    woman, insisted on refilling my bowl.


    “No, no, I can’t. It’s too much to ask for, save some for yourselves,” I said.


    “It’s our pleasure,” she replied. “You don’t visit so often.”


    I finally got out of it by asking for dessert.


    I suddenly longed for the familiarity of those processed foods in Canada, the
    other home. My taste buds had crossed over. While there were still Malaysian dishes
    I relished, the thought of mac ‘n’ cheese seemed comforting. My allegiances were
    mixed.


    To this day, I have a texture/taste memory of the squishy rounds and the sulfurous
    tang of yolk lodged in my mind. Just thinking of it makes me want to retch.


    ## HUNGER


    When we returned to Canada, I soon began my first year in high school. Unsure
    of my changing body, of my shifting allegiances to the motherland, and the uncertainties
    about belonging. I sought a harbour for my insecurities, to find my own tribe.


    Within months, I fell into a no man''s land. An awkward teenager becoming a woman,
    part nerd and part non-Canadian.


    I couldn''t reside comfortably in the homeland. I wasn''t entirely accepted in
    the chosen land.


    I was alien inside my own skin, estranged from the mutating curves of my body.


    There was no internal home to return to.


    Exercise became my religion. Measuring my food and counting calories. On bad weather
    days, I blasted music in the basement and did a dance workout. After three months,
