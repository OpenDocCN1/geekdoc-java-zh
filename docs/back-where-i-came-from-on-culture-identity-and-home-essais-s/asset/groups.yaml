    about these trips that my friends were taking, and every year they placated me
    by saying that we would go visit the next year. Next year would come and they
    promise me the same thing. Finally, when I was twelve, they told my younger brother
    and me that we would be taking a trip. Back home. To Ethiopia. That summer.


