    they know so much better but had no interest in seeing again.


    I spent time with my aunt Souad, my mother’s older sister. She looked like my
    mother, but spoke more generously and smiled more frequently. We sat in her small
    living room, in a room where I remember my uncle used to keep a barbershop during
    the war. My aunt Muna had come along as my mediator, because we all sensed it
    was a strange experience to reconnect with relatives you should know but don''t.


    “You used to spend a lot of time here,” Aunt Souad said in Arabic, the only language
    she speaks. “Every day you were here, when Maha went to work.


    “I remember spending time with Roula,” said I her daughter, who was about seven
    or eight years older than me. This was the most Arabic I’d used since I was eleven
    and we’d moved to Canada. Even though I could understand it fluently, I’d lost
    my ability to write and read it, and only had a child’s portion of the spoken
    language from when my parents would speak it at home.


