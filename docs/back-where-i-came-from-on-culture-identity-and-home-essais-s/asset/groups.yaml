    # KRISTA EIDE


    # Land Between Lake and Sea


    My vertigo is a seasickness — not a spinning sensation, but a voyage across the
    roiling Atlantic. I can walk a straight line, but my vision lists — left-right,
    left-right — from the moment I wake up sleep. It''s been three months, and no
    one can explain it, nothing can be done for it. It''ll just go away, the doctors
    say, but I''m worried I''ll be like this for the rest of my life — my eyes, brain,
    and inner ears colluding to upset the world.


    In January, my sister and I surprised my dad with a seventieth birthday gift —
    a father-daughter trip to Norway, to the village his father emigrated from as
    a young man in 1921. We made fall plans to connect with distant cousins and explore
    the region. I never knew my grandfather — he died suddenly in 1959, when Dad was
    thirteen. Dad choked when he opened the card, but still managed to quip: “If I''m
    still around by then.” He''s been dying of something or another for my entire
    life.


    I hoped to be well by the time we left for Norway, but now it''s September and
    my computer screen blurs and bobs. Two days before our flying, I curl myself around
    my office floor and call my sister, sobbing. “I can''t go,” I tell her.


    She''s stern: “If I can, you can.” She''s recently developed a crippling fear
    of flying.


    In the car to YVR, everything tilts and tilts. My father feels nervous. He looks
    thinner than usual, more tired. It is just his aging, or is something actually
    wrong with him? My sister rubs circles into her temples. Afternoon sun floods
    the back seat. “It’s too nice here to leave,” Dad says. My sister and I silently
    agree. We feel safe here, our bodies tethered by gravity to this land.'
