  - '[PAGE 185]


    VESNA JAKSIC LOWE is a writer and communications consultant for non-profit organizations
    that promote human rights and social justice. She grew up in the former Yugoslavia
    and has written about her immigrant experience for the Connecticut Literary Anthology
    2023, the New York Times, the New York Daily News, Catapult, and Pigeon Pages.
    She runs a monthly newsletter on immigrant literature, Immigrant Storm, and has
    taught on the topic for Rutgers University’s Cooper Street Writing Workshops.
    She participated in Martha’s Vineyard Institute of Creative Writing’s conference
    as a first-prize parent-fellow. She lives in Old Greenwich, Connecticut.


    KATHRYN GWUN-YEEN LENNON is a writer and editor, and based in Edmonton/Amiskwacīskahikan,
    with mixed Hong Cantonese and Irish ancestry. Her poetry has been published in
    *Canthus*, Brickyard Spoken Word, *The Polyglot*, Living Hyphen, *The Globe and
    Mail*, Ricepaper Magazine*, and *The Ethnic Aisle*. Her nonfiction has been published
    in *Spacing and Alternatives*. Her work has been included in several anthologies,
    including *Reimagining Fire: The Future of Energy*. She is the co-founder and
    co-editor of *Hungry Zane* and was a member of Edmonton’s 2012 Slam Poetry Team.


    DIMITRI NASRALLAH is the author of four novels, including *The Bleeds, Niko, Blackbodying*,
    which was nominated for the Scotiabank Giller Prize and shortlisted for *CBC*’s
    Canada Reads. He was born in Lebanon in 1977 and moved to Canada in 1988. He lives
    in Montreal, where he serves as fiction editor for *Véhicule Press’s Esplanade
    Fiction* imprint and teaches creative writing at Concordia University.


    LISHAI PEEL is a Hamilton, Ontario-based writer, community-engaged artist, and
    consultant with over a decade of experience in the arts and'
  - '[PAGE 186]


    culture sector. Her writing has won awards from the Writers’ Trust of Canada,
    The Malahat Review, and Vancouver Writers Fest. Her essays and poems have appeared
    in Room Magazine, Lilith Magazine, Hey Alma, Middleground, Arc Poetry Magazine,
    The Malahat Review, Ilanot Review, and more. Peel has an MFA in creative writing
    from the University of Guelph and is the inaugural Poet in Place for the City
    of Hamilton.


    # OMAR REYES divides his time between writing and social work. His interviews
    with notable artists and luminaries have appeared in Georgie Magazine. He also
    co-pastors a church called A Beautiful Table, where people can reclaim a more
    liberating and inclusive faith. Reyes lives with his wife and three sons in Edmonton.


    MAHTA RIAZI is a poet, community worker, and educator living in Tkaronto/Toronto.
    She is the winner of the 2022 Briarpatch Magazine Writing in the Margins contest,
    and her poetry and short fiction have been shortlisted for the Vallum Poetry Award
    and longed for the Nona Macdonald Heaslip Award. She is inspired and indebted
    to the poetry of Kristin Chang, Forough Farokhzaad, Sayeh, Hieu Minh Nguyen, George
    Abraham, and Joshua Bennett, among others. You can find her work in Plenitude
    Magazine, Acta Victoriaiana, Yolk Literary Journal, Bahr Magazine, and Bricklight,
    among others. Her chapbook Parastoo was published in June 2022 by Cactus Press.


    # STEVEN SANDOR is an award-winning writer and magazine editor. In 2015, he was
    named Alberta Magazine Publishers Association Editor of the Year. He is the author
    of two books on hockey history and eight young adult novels. He has received two
    commendations from the Canadian Children’s Book Centre. A new book on hockey and
    race will be published in 2025. Sandor lives in Edmonton, where he is the editor-in-chief
    of Edify magazine.'
  - '[PAGE 187]


    ANGELO SANTOS is a writer, filmmaker, physiotherapist who has lived in various
    places around the world, including the Philippines, the Middle East, the United
    States, and Canada. In 2020, he was selected as a mentee for the Writers’ Union
    of Canada BIPOC Writers Connect conference. Angelo’s work has been published in
    Ricepaper Magazine, filling Station Magazine, and Magdaragat, an anthology of
    Filipinx-Canadian writing. He lives in Oakville, Ontario.


    ALISON TEDFORD SEWEED is a Kiakiutl First Nation member and lives in Abbotsford,
    British Columbia. She has published three business books, including the Canadian
    Owner’s Guide to Reconciliation and a middle-grade textbook sharing the teachings
    of Indigenous creative professionals. Her essays have appeared in Broadview Magazine,
    Al Jazeera, CBC, Today’s Parent, Best Health Magazine, Business in Vancouver’s
    Indigenous edition, and more. She works as a consultant in communications and
    Indigenous relations and is a graduate student at Simon Fraser University.


    MAKDA TESHOME was born and lives in Toronto, Ontario. In 2020, she graduated from
    the University of Toronto with a BAS(c) in criminology, sociological studies,
    and history. She works in program management and takes pride in coordinating events
    and programs centred on social justice and urban development. New to the literary
    world, Teshome has written one piece on the Ethiopian pentatonic scale, “Tizita,”
    for Tillism. She hopes to continue writing fiction and nonfiction pieces centring
    on the immigrant and first-generation experience.


    NHUNG N. TRAN-DAVIES is an author, physician, mother of three, and advocate for
    social justice in education. She came to Canada as a refugee from the Vietnam
    War when she was a young child. She loves to write'
  - '[PAGE 188]


    children’s stories that convey the humanity in our lives, and the themes of her
    books include refugees and immigration, poverty, and the power of kindness and
    education. She is the author of three picture books, Ten Cents a Pound, The Doll,
    and Green Papayas, as well as the middle-grade/YA novel, A Grain of Rice. Her
    books have been shortlisted for the TD Literary Awards, the Red Maple Award, the
    Blue Spruce Award, and the TD Canadian Children’s Literature Award. She currently
    lives in Calmar, Alberta.


    ALEXANDRA C. YEBOAH is a Brampton, Ontario-based writer, creative facilitator,
    wanderlust, and quiet disruptor. A second-generation Canadian to immigrant parents,
    Yeboah writes about bicultural identity and how it intersects with everyday experiences,
    self-acceptance, growth, and playful discovery. Her print project, Breaking Barriers,
    was published by the Mayworks Festival in 2021. She currently sits on the Festival
    of Literary Alberta Diversity’s advisory council board.


    HANNAH ZALAA-UUL (she/her) is a Mongolian writer of short stories, personal essays,
    and poetry. With a degree in international development and two years of professional
    experience in the field, she works in the nonprofit sector as a grant officer
    coordinating sustainable water, sanitation, and hygiene projects for communities
    across West Africa and Southeast Asia. Zalaa-Uul is dedicated to storytelling
    that bridges connections across generations and nationalities, offering a glimpse
    into shared human experiences. She lives in Toronto.'
