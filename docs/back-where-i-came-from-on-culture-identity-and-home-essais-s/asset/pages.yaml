  md: 'Many years later, after I''d left the government job and started my own business,
    and after the pandemic hit, I found a way back to Alert Bay, in a sense. Scrolling
    through Instagram, I noticed the cultural centre in Alert Bay was offering Kwak''wala
    lessons online. Health orders precluded lessons in person, so even locals were
    attending lessons remotely, and it was opened to anyone who wanted to learn the
    language. Though my grandfather is a fluent speaker who taught our language at
    a local university, I rarely heard it spoken. I only knew how to say “cow” and
    “thank you” and life never provided an opportunity to learn the two together.
    Embarrassed at how little of my language I could speak, I wanted to learn how
    to have a conversation with my grandpa in our


    At the start of the first lesson, I introduced myself to all the unfamiliar faces
    on my screen, and when I shared my birth name, my instructor smiled. “I am your
    aunt!” she exclaimed. Gesturing to her sisters in the meeting who were also teaching
    the language with her, she said, “These are all your aunties!” To be claimed by
    new family in this way felt discovering the beginning of a new and glorious chapter,
    full of cultural context, hope, and possibility, with all the weight that comes
    with having to write a new life story.


    This was just after the 215 graves our hearts were heavy. We said a prayer for
    those who did not survive and in a moment of joy grief, and her sisters sang us
    “You Are My Sunshine” in Kwak''wala. My aunties sing and dance in Alert Bay, I
    was so moved that I had to turn off my camera to hide my tears. It felt like I
    was right there with them, and at the same time, I felt so far away. My heartached
