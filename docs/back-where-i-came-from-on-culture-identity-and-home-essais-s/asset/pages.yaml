  md: '# Sea Creatures


    After watching me peel and eat raw barnacles off a rock, my daughter insisted
    on doing the same. With her right hand, she held onto the ladder that connects
    the rocky coastline to the Adriatic Sea. With her left hand, she searched for
    a stone she could use to remove the barnacle, like she saw me doing a minute earlier.


    “Is this one okay, Mama?” she said, waving a stone twice the size of her fist.


    “Oh, hon, that’s too big,” I said, motioning for her to drop it into the sea.
    Her next pick was a pebble so comically small that I smiled and passed her stone.
    She held it tightly and pounded away at the brownish, quarter-sized barnacle glued
    on the rock in front of her. But the oval creature maintained its stubborn grip
    on its host, and only muddied the sea around it.


    There are some thousand types of barnacles, and they usually live within shallow
    waters, where they cling to rocks for life. In Croatian, we call them lupari or
    lumari, and they’re a common sight for those of us who grew up on the Adriatic
    coast. More formally, some call them priljepci, where ljepit means “to glue”—a
    reference to the sticky substance that makes them bond to their habitat. Their
    slightly cone-shaped shells are greyish or brownish, like the rock formations
    they adhere to.


    They’re an odd-looking thing, but their sheer numbers convey a sense of belonging.
    A single rock can house a dozen or more of them; it’s clear they’ve tethered to
