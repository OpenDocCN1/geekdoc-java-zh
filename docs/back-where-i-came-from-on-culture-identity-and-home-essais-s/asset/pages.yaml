    We headed up to the ferry that would take us to Alert Bay. I checked into a hotel
    on a pier and fell asleep to the sounds of the waves crashing below. A log was
    entangled below the dock, and it thumped against the posts all night, reminding
    me of the way my grandpa learned to dance to the beat of a drumstick connecting
    with a hollow log.


    We were in town for a community justice forum, and I met some community members
    attending the event to share their perspectives, who, upon learning who my grandfather
    was, explained to how we were related. I knew my grandparents, aunts, uncles,
    and cousins on the mainland who gathered together at the holidays, but until that
    moment, knew almost nothing about our extended family on Vancouver Island. Through
    their stories, smiles, and hugs, I saw the lines of my family tree filling out
    with indelible ink.


    I explored the little town as much as I could during our short stay, eating at
    local restaurants, walking around, and taking pictures. I snapped a photo of the
    residential school my grandfather attended, a building that a few years later,
    would be demolished for safety reasons. And, of course, I saw the totem pole with
    my own eyes.


    It was strange to see the painting come to life. I took it all in from behind
    the graveyard''s fence, which stood in protection of the graves and totems, standing
    in awe at a distance. So close and still so far, I wondered what it might feel
    like to touch the wood carved, to feel the grain under my fingertips. The fence
    was for good reason and there would be more appropriate times to get closer to
    his work. I was to witness and that was enough.


    The next day, I went back home to the Fraser Valley, unsure I I would back. It
    was far away, I had a young son at home, and as a single parent I didn''t have
    much of a travel budget, so the idea of returning was tempting but felt impractical.
    Even though I didn''t have a timeline for my return, I knew for sure that one
    day I would.'
