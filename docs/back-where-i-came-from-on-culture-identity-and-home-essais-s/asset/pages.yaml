  md: '# Introduction


    This book was born from the mutual curiosity of two children of immigrants about
    the experiences of diasporic writers who’ve travelled back to their, or their
    parents’, or in some cases grandparents’, countries of origin. As writers ourselves
    who had journeyed back to our motherlands, we wanted to find the common threads
    between storytellers with an array of backgrounds, and where, and why, those common
    threads ended. Did they, like us, bump up against uncomfortable questions about
    themselves when they visited their ancestral lands? Did they return with a renewed
    sense of belonging, home, and identity? And could we artistically represent these
    narratives, give them their rightful space in English literature, and shed some
    light on the joys and struggles of being both “here” and “there”?


    We put a submission call to the writing community and received over one hundred
    thoughtful submissions detailing travels across the globe and the full gamut of
    emotions experienced in diasporas. The abstract space between cultures, where
    many hyphenated Canadians and Americans live, opened up as writers delivered into
    the contrast between home and homeland, to unpack family matters, heartbreaks,
    health issues, and themselves. Writers did not shy away from vulnerability in
    sharing with us their dreams — dashed and fulfilled — and often sent their essays
    with a note of thanks for the opportunity to put on the page some meaningful,
    difficult, or gratifying experiences. “Writing this was a joy,” one author said,
    “and even if it’s not selected, I’m more than grateful to have spent this time
    putting into words something even my wife did not fully know.”'
  merge: -1
