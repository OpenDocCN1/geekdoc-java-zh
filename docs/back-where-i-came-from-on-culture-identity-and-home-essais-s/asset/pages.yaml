  md: 'My grandmother spoke Kriol with her children while they raised my generation
    in the States, but they didn’t teach us how to speak it. They locked Kriol away.


    For most of the country’s history, Belizeans called their language “Broken English.”
    They were taught Kriol, their native tongue, was inferior to European colonial
    languages. It was considered a degenerate version of English that originated with
    enslaved Africans who mixed up their native African languages with English when
    speaking to their captors. Belizeans were banned from speaking Kriol outside the
    home, whether the home was in Belize or elsewhere. In my household in the States,
    Kriol had no place.


    Since Kriol had no role in my success in the U.S., I never asked to learn to speak
    it. By the time I realized it wasn’t a bastardized version of English, but rather
    a full-fledged language of its own, I was away in college on the East Coast, and
    it was too late to practice speaking it.


    My classmates knew me as a Black girl from California. Only when people questioned
    if I was “regular Black” did I reveal that I was Central American.


    A Central American identity was as specific as I got until a student in history
    class said Belizeans were the same as Jamaicans. I chimed in, “No. We’re our people
    with our own culture.”


    My friends gave me quizzical looks and fired off questions. “You’re from Belize?”


    “What are people from Belize called?” “Aren’t y’all Spanish or something?” “Are
    you related to Shyne?”


    I answered most questions. But when I shared that one of the languages spoken
    in Belize was Kriol, and they motioned for me to say something, I didn’t even
    attempt. I couldn’t do it.


    Not being able to speak the language made me feel like a fake. But Kriol reminded
    me of the heritage from which I was estranged, of the past my family left.'
