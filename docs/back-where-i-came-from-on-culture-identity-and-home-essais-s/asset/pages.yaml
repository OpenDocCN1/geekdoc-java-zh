  md: 'essay “Chicken Soup and Tortillas” by Omar Reyes is an endearing tale of classism
    and self-discovery in El Salvador, one of the twenty-four countries you will travel
    to as you read this book.


    We envisioned an anthology that would showcase rich and vivid storytelling from
    around the globe. We welcomed writers who came at our themes of culture, identity,
    and from slightly different angles; in “Flight Paths” Omar El Akkad recounts his
    life of multiple migrations in the wake of his father’s death, while in “Deployment”
    Christina Hoag shows what it’s like growing up a third-culture kid with relative
    privilege but no ties to any one country.


    It was clear that stories of travel would include about land and the institutions
    that govern them. In “The Land Remembers All of Its Children,” Hannah Zalaa-Uul
    names Mongolia “a timeless mother” who welcomes her home no matter how long she
    has been away, no matter how of a cultural outsider she feels she is. This idea
    is echoed in Alexandra C. Yeboah’s poetic essay “The Motherland Knows My Name”
    and the many ways she tells she is not African enough. Ayesha Habib, “What Remains
    of Home,” acknowledges the complicated history between a wave of Indian migrants
    from their homes and the native population of East Africa under Britain’s imposed
    segregation. Which brings us to the countries that we, the editors and writers
    of this book, now live in, and our own history of settler-colonialism that we
    reconcile in our own ways. In this spirit, we hear Alison Tedford Seaweed, a member
    of the Kwakiut First Nation of northern Vancouver Island, who experiences a homecoming
    that deepens her ties with her Indigenous identity, and Israeli-Canadian Lishai
    Peel, in “Mother, Land, Land,” who finds her way back to her mom and homeland
    after distancing herself from her government’s “violent occupation of Palestinian
    territory,” recognizing that “there was no escaping the person who made me and
    the country that shaped me.”


    Family relationships are another strong theme woven throughout this collection.
    Eufemia Fantetti makes a trek to Bonefro, Italy, after thirty-six years of estrangement
    from the land and her family there—“Imagine the'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'guilt,” she says before discovering a new understanding of past family trauma.
    Nhung N. Tran-Davies makes “The Journey Home” to Vietnam with her mother through
    a medical school opportunity and returns with greater knowledge of her mother’s
    background that answers questions about her own difficult upbringing.


    At a time when the discussion about rights to lay claim to a land is in the spotlight,
    when people are paying attention to the diversity of human experiences, we are
    proud to add context and nuance to the conversation. This is a book of dualities:
    of commonalities and eclecticism, of connection and disconnection, of belonging
    and alienation.


    The title for this book is meant to be a little tongue-in-cheek, a response to
    the not-so-creative directive hurled at immigrants (or perceived immigrants) to
    go back where they came from. Here are twenty-six writers who did just that and
    returned with an array of profound and complicated and funny and magical stories
    to tell. We welcome readers to lands far, far away and to places deep within our
    ideas of who we are, where we belong, and what “home” means to us.'
