    Growing up in Canada, with so much American cultural influence, we learned that
    military operations are top secret; prototype airplanes, the newest tanks and
    the mobile missile launchers were kept away from the prying eyes of the public.
    When you crossed into the Bloc, a Soviet-led military force had no use of keeping
    itself secret. Some of you are old enough to remember those old new broadcasts
    of Mayday parades from Red Square. Soldiers marched in columns, followed by tanks,
    missile launchers, and pretty well any killing machine the Soviets could wheel
    through Red Square.


    In Budapest, one of the biggest tourist attractions is the Citadel, a monument
    atop the Buda Hills. From there, you get a panoramic view of the Danube splitting
    the city in two. But, back in 1984, it was surrounded by soldiers, tents, and
    camouflage netting — a military exercise in plain sight.


    Almost all Hungarians drove cars in the Bloc: Škoda, Ladas, Romanian Dacias. My
    grandfather loved his Skoda, a beige-coloured Czechoslovak death trap. The shortest
    turn made the car luch like it was rolling over. It shook when the key was turned
    in the ignition. Later in the trip, the axle broke while we were on the road.
    It was as if Kafka himself had imagined this as a joke about the trivial nature
