  md: '# Hungary, 1984


    When my parents got to Canada, they arrived in a country that was not known to
    immigrants as a safe haven. It was a country wrestling with the notion of welcoming
    so many people from another country at one time. The stories from the Hungarian
    Revolution, the romance of freedom fighters tossing Molotov cocktails at Soviet
    tanks, had won over the Canadian public, but there was still the issue of what
    to do when all of these people actually arrived in the autumn of 1956.


    My parents married in Austria, inside a small church by the refugee camp they’d
    been living for a few weeks. This, they learned, would help ensure that they would
    be assigned to the same destination in the Western world. Initially, that was
    the United Kingdom, but refugees at that time were allowed to trade their tickets.
    So, when my mom learned that her two brothers were going to Canada, my parents
    traded spots with two people who wanted the British Isles over the long trip to
    a cold country they knew very little about.


    Once my parents arrived in Canada — a Canada that did not think of itself as a
    multicultural mosaic — they were told they had a year to learn English or French.
    They had to assimilate and fit in.


    And a generation of nearly forty refugees took it to heart. In Canada, names were
    changed to be more well, English. A generation of kids were born to hyphenated
    Hungarian families who tried their damned not to be too Hungarian. Being sort
    of Hungarian was okay, but saddling the kids with a ridiculously difficult language
    that hardly anyone spoke was not worth the price of cultural preservation. They
    were preoccupied with thoughts of not sticking out or being seen as a burden.'
