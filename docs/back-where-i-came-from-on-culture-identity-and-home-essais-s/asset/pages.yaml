    I looked around the arrivals area for my uncle’s thick glasses, my aunt’s straight
    brown hair, but they found me first. “Keefak, ya sakeh?” Uncle Murad said as he
    pulled me for a hug.


    “How you''ve grown!” my aunt Muna exclaimed, kissing my cheeks. I was immediately
    transported back to when I was young and my would give me loose change for candy,
    and my aunt would wet the ends of a tissue to clean my cheek at church. Maybe
    it was because I was exhausted from travel, but their warmth was sudden and unexpected,
    an affection from loving adults that I hadn''t even realized I''d been missing
    all along. It wasn''t the culture that was cold, distracted, and distant—it was
    my parents.


