    # Alive in Alert Bay


    Coming Home to the Big House


    I got my first glimpse of Alert Bay, British Columbia, from a hospital bed. Common
    sense and geography would tell you that what I''m telling you is impossible, given
    that the hospital bed was 350 kilometres across the Salish Sea, in Maple Ridge,
    but I can assure you it''s true. Sometimes the most meaningful truths start out
    as a mystery, and I feel like the magic of my ancestors isn''t bound by the same
    rules about time and space.


    I didn''t know I was looking at my ancestors'' seaside community until my grandparents
    pointed it out, the village on Cormorant Island, where my family''s roots run
    deep. They''d come to visit me at Ridge Meadows Hospital when Grandma asked me
    the strangest question as I lay in my bed: “Did you bring that painting with you?”
    I explained to her that people don''t bring art with them to the hospital — especially
    teenagers. I was fifteen years old and could scarcely remember to bring my house
    keys with me I left the house, alone a painting. I wondered what it meant and
    what she would even think to ask.


    She gestured to the artwork on the wall and explained, “That’s a painting of a
    totem pole your great-great-grandfather carved.” It seemed wild that it would
    happen to be hanging in a room five hundred kilometres from where the totem pole
    stood, but there it was. Grandma took the painting down and walked out to the
    nurse''s station. She explained the personal connection to the art and audaciously
    asked if she could take it.


    I can only imagine how bewildered the staff were by her request. That was Grandma,
    always clear about what she wanted, and I''m quite sure the staff had no manual
    to refer to for this kind of situation. They agreed and Grandma took the painting
    with her, only to return to me framed with a'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'photo of her and Grandpa standing in front of the actual totem pole in Alert
    Bay.


    I took it as a sign that my ancestors were with me and wanted me to be okay. It
    couldn''t have been a coincidence a watercolour print depicting my family''s art
    would be hanging there while I was recovering from my eating disorder. I had been
    fighting for years, malnourished and unsteady on my feet with dizzy spells. I
    was prone to fainting and my condition had progressed to the point where, in the
    hospital, my bare feet only connected with the cold floor to go and from the bathroom.
    That was on doctor''s orders, lest I try to use them to exercise.


    Though I had seen photographs of my great-grandfather''s totem poles, I had never
    been to Alert Bay to see this one in person. I didn''t know anything about the
    village of 450 people, and I was deep in my troubles to worry about it. Once I
    was released from the hospital, I hung the art in the entryway of my home. I would
    think about it every time I looked at the painting, but it would be before I find
    myself on those shores.


    By time I was a mother myself, headed to Alert Bay on a business trip as a finance
    and data quality officer with the federal prison system. I was supposed to drive
    a member of the parole board to the airport to fly with me to Port Hardy, I''d
    recently been in a car accident. My colleague''s husband drove us to the airport
    instead, and when I explained that my family was from the area, and gave my birth
    him, he told me a story about when he''d been the band manager of my family''s
    reserve near Port Hardy, where he''d had many conversations with my great-grandfather.


    When my colleague and I landed at our destination, she drove me through the reserve
    to see where our people had lived — and still do. It felt surreal to drive over
    the roads where my greatparents once walked, and I imagined them there, recalling
    what their faces looked like the snapshots in my photo album. I had pictures of
    them holding me, smiling at me, loving me in their arms, but they passed away
    when I was so small that I could not remember the sounds of their voices.'
