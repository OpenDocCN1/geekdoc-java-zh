  trans: "\n\n每张表都包含一组列。这些列定义了表中的不同数据项。这正是关系模型与其他类型数据库的不同之处。你会发现，有些数据库将数据完全存储在一起。然而，在关系模型中，所有数据都是通过列分隔的，且每一列都有一个名称。每列还可以限制被添加到其中的数据类别和大小。例如，某些列只能存储字符串，而某些列只能存储数字。分配给每列的限制取决于数据库的创建者。\n\
    \n列还被分为“必填”和“非必填”。必填列意味着表中的每一行都必须有且与该列要求相对应的数据。另一方面，非必填列意味着我们可以为该列下的每行数据指定一个 `NULL`\
    \ 值。在学习 `SQL` 的过程中，你会发现 `NULL` 在数据库编程中有许多用途。\n\n使用行的主要用点是拥有可检索的数据和可以存储数据的容器。我们为什么要存储数据？简单来说，是因为我们希望在将来再次获取这些数据，而且我们只是想为它们提供一个临时存放的地方。因此这就是数据库的核心思想。\n\
    \n## 键 (Keys)\n\n键是关系型数据库的关重要元素之一。我们现在知道表有几列，且每列都有名称。每列还具有相关的属性。我们可以在列中断定的这些属性之一就是键。\n\
    \n在关系型数据库中，我们总是为每一行分配一个主键（primary key）。这种特殊类型的键用于唯一确定某一行。这意味着该键的值必须保持唯一，且在表内不能有任何重复。当且仅当我们的关系模型中存在另一个包含该键的表时，我们可能可以将这两个表合并在一起。\n\
    \n在合并两张表时，总会有没有重复的主键。合并后，你会注意到表中会出现一列带有这些键的新列。这些键现在被称为外键（Foreign keys）。它们充当通向第二张表主键的链接，允许你方便地连接来自两个分离表的行。\n\
    \n除了主键和外键，我们还拥有自然键（natural keys）。自然键是全局性的。这意味着你不能更改它们，因为它们在全世界范围内被用于标识单个实体。例如，出版的书籍总有自然键，我们所熟的为\
    \ `ISBN`。每本出版的书都有自己唯一的 `ISBN`，在处理书籍的关系型数据库时，你需要使用它作为主键。在处理具有非自然键（如电子邮件、人员）的数据库时，情况会有不同，此时你需要为每一行发明自己的主键。\n\
    \n让我们用一个人员及其联系电话的数据库作为示例。我们不能将姓名视为主键。同样不能将人的电话号码视为主键。这是因为全球可能有两个或多个人拥有相同的联系电话、名字，甚至是姓氏。因此，我们应该自己创建主键。这就是标识列（identity\
    \ column）派上用场的地方。标识列作为一个自动递增列，当我们向表中添加数据时，它会继续生成唯一键。键的组合并不重要，因为我们只需要为数据库中的每个身份提供一个唯一键。\n\
    \n# 第 2 章 – 关系模型示例\n\n由于我在上一节中使用了人员数据库，现在我将为你提供一个联系人数据库作为关系模型的完美示例。\n\n一个简单的联系人数据库通常看起来如下：\n\
