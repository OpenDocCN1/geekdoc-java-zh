    第四点是 SQL 是不区分大小写的。你可以将变量写成小写或写成大写。在结构化查询语言中，这两种方式都能正常工作。一个很好的练习方法是将 SQL 特定的关键字使用大写，而将用户定义的关键字使用小写。这将允许你高效、快速地识别语句中的不同关键字。


    # SQL 命令


    记住所有的 SQL 语句都以一个命令开始，这是重要的。该命令通常是一个动词，表示数据库需要执行的操作。SQL 语句中使用的命令的一个很好的例子是 `SELECT`。


    `SELECT` 命令告诉数据库选择一组数据。如你所见，它是一个基于英语的单词，系统将要做的操作非常显而易见。这是该命令在 SQL 语句中使用时的样子。


    ```

    | SELECTVALUESFROMTABLENAME; |

    ```


    上面的示例是一个 SQL 语句的通用示例，稍后我将逐部分进行说明。


    请注意，在语句中需要断言的值集或变量取决于你尝试执行的命令。所有这些变量都紧跟在命令之后。


    ## 值的命名


    正如我之前所说的，SQL 语句由 SQL 规范内的单词和用户创建的名称组成。这意味着为键、表名、列等值进行命名在 SQL 中是非常重要的。


    在 SQL 中命名事物没有绝对的规则。人们有自己命名变量的方法，但为了保持一致性，我建议你遵循我在本书中使用的方法。这里是我将在本书中实施的两个命名规则：


    *   所有表名必须是单数形式。（例如：`person`、`email`、`phone`、`user` 等）

    *   数据库中的列名永远不应重复。


    有些人倾向于为表名使用复数形式。这并没有错。尽管如此，使用单数形式表名时我感到更舒服。至于列名，总会有两个或多个来自不同表的列具有相同的名称。因此，我的做法是为每个列命名唯一的名称以消除歧义。例如，与其在
    `user` 表和 `email` 表中都使用 `ID` 作为主键列名；我宁愿使用 `user_ID` 和 `email_ID` 作为每个列的名称。


    你还需要注意 SQL 中的名称是有作用域的。这意味着数据库本身必须有一个名称。数据库内的表必须有名称。每个表内部的列也必须命名。调用表时，其名称必须通过数据库名进行限定，使用点（`.`分隔名称。因此，它们在
    SQL 语句中断言时的样式如下：


    *   `Database.Table`

    *   `Table.Column`


    ## 在 SQL 中创建数据


    我打算教你如何从零创建一个数据库。作为初学者，的任务应该只围绕向已有的数据库添加或更新值。然而，我觉得你们中的一些仍然渴望学习 SQL 以创建包括数据库在内的整个应用程序。因此，我将介绍
    SQL 的这部分，但仅足以让你快速上手。


    创建新数据库的 SQL 关键字是 `CREATE DATABASE` 语句，这属于 ANSI 规范。假设你想为人的联系号码创建一个新数据库，并将这个新数据库命名为
    `Contacts`。以下是操作方法：


    ```

    | CREATE DATABASE Contact; |

    ```


    为了能够操作该数据库，你需要首先使用它。我们需要的关键字是 `USE DATABASE` 命令。这是我们执行它的方式。


    ```

    | USE DATABASEContact; |

    ```


    如果你想在 `Contact` 数据库内部创建一个表，那么你需要执行的就是 `CREATE TABLE` 命令，以下是操作方法：


    ```

    | CREATE TABLE Contacts.User (…); |

    ```


    之后，你现在可以所有的列名、类型和定义。


    ## 数据类型


    数据类型很重要，因为遵循了列的限制。每个列都有规则规定你可以在其中存储什么类型的数据。


    以下是一些主要数据类型及其简短描述。


    | 数据类型 | 描述 |

    | :--- | :--- |

    | `CHARACTER` | 用于定义列中允许的字符数。不多，不少。 |

    | `CHARACTER VARYING` | 用于定义列中允许的最大字符数。可以较少，但不能超过特定值。 |

    | `BINARY` | 将该列专门用于十六进制数据。 |

    | `SMALLINT` | 用于存储范围从 -32,768 到 32,767 的数值数据。 |

    | `INTEGER` | 用于存储范围从 -2, 147, 483, 648 到 2, 147, 483, 647 的数值数据。 |

    | `BIGINT` | 用于存储范围从 -9, 223, 372, 036, 854, 775, 808 到 9, 223, 372, 036, 854,
    775, 807 的数值数据。 |

    | `BOOLEAN` | 用于存储 `TRUE` 或 `FALSE` 值。 |

    | `DATE` | 用于存储以下格式的 `DAY`、`MONTH` 和 `YEAR`：`YYYY-MM-DD`。 |

    | `TIME` | 用于存储以下格式的 `HOUR`、`MINUTE` 和 `SECOND`：`HH:MM:SS`。 |

    | `TIMESTAMP` | 用于存储 `TIME` 和 `DATE`：`YYYY-MM-DD HH:MM:SS`。 |

    | `UNICODE` | 用于存储字符，针对字符。 |


    还有其他支持的数据类型你可以使用，例如普通字符。


    # 第 4 章 - 在 MySQL 中编码


    我将教你如何使用 `MySQL` 编写 SQL。为什么选择 `MySQL`？首先它是开源平台，你可以免费获取。其次它兼容所有操作系统：`Linux`、`OSX`
    和 `Windows`。第三它支持 ANSI 模式。并不是所有的 RDM 都具有此功能。


    在本章中，我将教你如何高效使用 `SELECT` 命令。这将允许你使用该命令创建有趣的查询。


    ## SELECT 命令结构


    你现在应该已经学会了我们关键字 `SELECT`，它是从数据库获取特定数据的命令。在 `SELECT` 关键字之后，紧接着的是我们想要从数据库获取的项目列表。我们称之为“选择列表”。如果选择列表只包含变量，你可以简单地写成：


    ```

    | SELECT [Variable],[Variable]; |


    大多数情况下，选择列表包含列名。在这种情况下，重要的是定义从哪里找到这些列。这就是 `FROM` 命令派上用场的地方。


    例如，选择列表包含 `User`（列 A）和 `Email`（列 B），我们可以在名为 `Contact` 的表中找到这些列。为了定义查找哪个表，我们应该这样做包含
    `FROM` 命令：


    ```

    | Format:SELECT [COLUMN_NAME], [COLUMN_NAME] FROM [TABLE_NAME];Example:SELECTUser,EmailFROMContact;
    |

    ```


    但是，如果表有很多列，我想选择所有列，你是这样问的？嗯，这就是星号（`*`）的用武之地。这被称为 SQL 语句中的通配符。为了选择表中的所有列，你需要执行如下格式的语句：


    ```

    | SELECT* FROM [TABLE_NAME]; |

    ```


    如你所见，通配符位于 `SELECT` 命令之后。现在这在选择所有列时有用。如果你不需要选择所有列，使用通配符可能会变得危险且低效。


    根据你所使用的平台，有不同的方法可以在 SQL 语句中快速断言多个列。我个人建议你避免使用通配符命令，因为低效使用这种语法可能会破坏应用程序。


    ## FROM 命令


    选择单个表编写 SQL 语句相当简单。如从之前的示例所示，它只遵循简单的格式。


    ```

    | FROM [TABLE_NAME] |

    ```

