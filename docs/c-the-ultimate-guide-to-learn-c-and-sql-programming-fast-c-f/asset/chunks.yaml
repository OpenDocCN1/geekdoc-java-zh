  trans: "\n\n# 引言\n# 第一章 – 你的程序\n# 第二章 – 变量\n## 使用变量\n# 第三章 - 扩展你的程序\n## iostream\
    \ 库\n# 第四章 – 运算符\n# 第五章 – 条件判断\n# 第六章 – 循环\n# 第七章 – 数组\n# 第八章 – 函数\n# 第九章 – 指针\n\
    # 第十章 - 动态内存\n# 第十一章 类与对象\n# 结论\n\n## 引言\n\nC++ 是一种新兴的编程语言，它基于对象和编译。如果你是一个从未编写过程序的人，可能会对“对象”和“编译”这些词感到困惑。\n\
    \n使用编译运行的程序是由计算机的 CPU 读取的，而不是通过安装在计算机上用于运行该程序的程序进行解释的。因此，程序更多的是与计算机的处理系统通信，而不是与某个程序通信。\n\
    \n你可能已经知道这一点，但计算机无法读取字母，必须读取二进制代码，因此代码必须翻译成计算机可读的形式。这个过程被称为编译。现在，面向对象的代码只是代码的结构方式。你将在后续章节中更好地理解这一细节。\n\
    \n那么这一切意味着什么，你为什么要需要知道这些？作为一名使用 C++ 的程序员，你需要的不仅仅是一个普通的文本编辑器。只有极少数编程语言只需要这些，而它们实际上并不是真正的编程语言。你将需要的工具之一就是编译器。\n\
    \n你可能想要的另一个东西是集成开发环境，也称为 IDE。这是一种面向程序员的文本编辑器，具有语法高亮功能并集成了编译器。对于 Windows 和 Linux，你可以使用几个选项。\n\
    \n你实际上并不需要 IDE，因为基础的文本编辑器就可以，但像记事本（Notepad）这样的工具会让事情变得稍微困难。文字处理软件也是一个糟糕的选择，因为它们有拼写和语法自动纠正，如果不小心这会弄乱你的代码。\n\
    \n在开始学习 C++ 之前，你应该理解它有严格的语法。这意味着代码是区分大小写的，所以输入‘Hello’和输入‘hello’是不同的。此外，你应该知道这种编程语言并不在乎空格，所以不用担心它。\n\
    \n以上就是你初学 C++ 时需要知道的所有内容。让我们进入一些实际编码来开启之旅吧！\n\n## 第一章 – 你的程序\n\n![ANd9GcSiYFVzWNtEsPfcM_CSykJhn4tkkH-GCJ4xX-yvN9K3b23DtDU2aQ](img/00010.jpeg)\
    \ 既然这是一个关于如何开始学习 C++ 的短教程，我们将在第一章让你从一个程序开始。你的第一个程序将非常简单。你要做的只是在屏幕上写一个短语，但这不像在\
    \ Word 文档中写那么简单。首先，让我们来看代码，然后深入探讨它的含义。\n\n![](img/00011.jpeg)\n\n这一行将告诉编译器，它必须将程序链接到\
    \ `iostream` 流库。库是一个存储代码片段的仓库，这些片段被称为函数。库还存储其他东西，比如变量有时有时运算符。\n\n`iostream` 库的代码允许你将字符发送到文本流中，然后输入到屏幕上。把它想象成一条河流。你是河流的源头，屏幕是海洋。任何从源头放入河流的东西都会显示在屏幕上。\n\
    \n接下来的行（第二行）让编译器知道你想使用名为 `std` 的命名空间，这是一个标准命名空间。命名空间是存储代码的区域。\n\n接下来的行（第三行）使用\
    \ `cout` 命令在控制台打印一个字符串。\n\n```\n#include <iostream>\nint main() {\n    std::cout\
    \ << \"Hello World!\" << std::endl;\n    return 0;\n}\n```\n\n接下来的行（第四行）使用 `<<`\
    \ 运算符将字符串 \"Hello World!\" 插入 `cout` 流中。第五行使用 `endl` 插入一个换行符。最后一行（第六行）向操作系统返回\
    \ 0，表示程序成功结束。右括号 `}` 结束了 `main` 函数。\n\n这一行将告诉编译器，它必须将程序链接到 `iostream` 流库。库是一个存储代码片段的仓库，这些片段被称为函数。库还存储其他东西，比如变量有时运算符。\n\
    \n`iostream` 库的代码允许你将字符发送到文本流中，然后输入到屏幕上。把它想象成一条河流。你是河流的源头，屏幕是海洋。任何从源头放入河流的东西都会显示在屏幕上。\n\
    \n接下来的行（第二行）让编译器知道你想使用名为 `std` 的命名空间，这是一个标准命名空间。命名空间是存储代码的区域。\n\n接下来的行（第三行）使用\
    \ `cout` 命令在控制台打印一个字符串。\n\n```\n#include <iostream>\nint main() {\n    std::cout\
    \ << \"Hello World!\" << std::endl;\n    return 0;\n}\n```\n\n接下来的行（第四行）使用 `<<`\
    \ 运算符将字符串 \"Hello World!\" 插入 `cout` 流中。第五行使用 `endl` 插入一个换行符。最后一行（第六行）向操作系统返回\
    \ 0，表示程序成功结束。右括号 `}` 结束了 `main` 函数。\n\n![`potcode.com/03/helloworld.gif`](img/00012.jpeg)\n\
    \n## 第二章 – 变量\n\n在上一章中提到了变量，并说将讨论它们。现在是讨论它们的时候。变量是存储值的东西。想象每个变量都是一个盒子，每个盒子都有标签。\n\
    \n![`img.c4learn.com/2012/02/Variable-in-Java.jpg`](img/00013.jpeg) 类别是它所存储的项目类型，名称是特定的变量。盒子可以存储很多东西，但只要这些东西放得下。变量也是如此。它们都有类型、名称和大小，决定了它们是什么以及能存储。\n\
    \n例如，一种变量类型是整数。如果你了解基础数学，你就知道整数是零、整数数及其对应的负数。所以 -5、4、0 和 -378 都是整数。此外，整数变量具有固定的大小。\n\
    \n它们只能包含两个数字之间的一个数字。这些是针对特定的，现在还没有详细讨论，但默认的整数范围是 -2³¹ = -2,147,483,648 到 2³¹–1\
    \ = 2,147,483,647。你现在可能不需要比这更大的数字，所以我们把剩下的留到以后。\n\n这里有一个表格可以查看你可以使用的不同变量类型。\n\n\
    ## 使用变量\n\n看看以下程序：\n\n这个程序的大部分看起来很熟悉，除了第四行和第六行。第一个不熟悉的部分是声明变量。这是在告诉编译器你将使用一个变量。在声明中，变量类型在前面。在示例中，它使用了\
    \ `int` 类型。\n\n"
- fmt: "\nIt’s easy and simple. A variable name can be anything, but be sure it’s\
    \ something relevant and not something that’s already reserved and means something\
    \ in C++ and it doesn’t begin with a number or a special character. You should\
    \ start with a lowercase letter, and end the statement with a semi-colon.\n\n\
    Line nine in the code above is known as an assignment and assigns a value to the\
    \ variable. The equal sign is the assignment operator, and it is what does the\
    \ assigning. The variable on the left is given the value on the right, and the\
    \ `=` is a binary operator because it has two operands. One to the left and the\
    \ other to the right. The operand on the right doesn’t have to be a value. It\
    \ can be another variable. The left has to be a variable and you can’t change\
    \ the meaning of the number seven. In the example, the integer variable `var`\
    \ is a value of forty-two.\n\nYou can see the `cout` statement doesn’t have quotations\
    \ marks around the variable name. That’s because you want to output the value\
    \ of the `var` and not display the string ‘var’. If you were compiling the program,\
    \ it would print ‘42’ because that is the value the `var` has. Try changing it\
    \ to another integer and look at the output.\n\n![images](images/0001.jpeg)\n\n\
    Variables also have prefixes that are added to their declaration that changes\
    \ how they act. Some will change the size, and others will not allow negative\
    \ numbers, and others might do something entirely different.\n\nNow that you know\
    \ about variables let’s talk about how to expand the program!\n\n# Chapter Three\
    \ - Expanding Your Program\n\nNow that you know how to use variables and how to\
    \ put them into the program let’s take a look at how to expand the program. All\
    \ you really know what to do is use the variables and put them into your program,\
    \ so all you can really do is set the output and values of the variable. That\
    \ isn’t useful when you’re creating a real program.\n\n![images(2)](images/00017.jpeg)\n\
    \nWhat you need is a way to manipulate the variables and receive input from a\
    \ user. So let’s take a look at the next!\n\n## iostream Library\n\nYou already\
    \ know that the `iostream` library is able to output data, but it can also obtain\
    \ input data, too. The command is very like the `cout` statement. The command\
    \ is `cin`. There is one different, though. When you use `cin`, the operator after\
    \ it’s inverted.\n\nInstead of being `<<`, it’s `>>`. This is confusing to remember\
    \ in the beginning, but you’ll learn it eventually. Note that when you run the\
    \ program, you’ll need to press the enter key after you put in the desired information,\
    \ like a terminal`cmd` prompt.\n\nTake a look at the following program to see\
    \ the difference between the two.\n\n![](images/00018.jpeg)\n\nNow you can probably\
    \ see that it’s simple to get the user’s input using the `iostream` library, which\
    \ produces some more useful programs. `iostream` is a lot more powerful, though.\
    \ You can combine many statements into one.\n\nFor example, to put out two strings\
    \ or variables you would normally need two statements, but you can combine many\
    \ `cout` statements and produce a much shorter code. All you have to do is just\
    \ add another operator for the item you’re outputting or inputting.\n\nFor example:\n\
    \n![](images/00019.jpeg)\n\nYou can also combine together `cin` statements in\
    \ the same way you’d receive several parts of the input in a row. Enter has to\
    \ be pressed after each one, and you can’t mix input and output on a line of code.\n\
    \nNow that you know how to combine code and expand your program let’s talk more\
    \ about operators.\n\n# Chapter Four – Operators\n\nYou’ve learned how to output\
    \ text, declare a variable and obtain input, but you can’t do anything with the\
    \ variables. Sure, you can give them values, but what use is that in the real\
    \ world? What you really need is a way to manipulate the variables without doing\
