    \n除了主键和外键，我们还拥有自然键（natural keys）。自然键是全局性的。这意味着你不能更改它们，因为它们在全世界范围内被用于标识单个实体。例如，出版的书籍总有自然键，我们所熟知的\
    \ `ISBN`。每本出版的书都有自己唯一的 `ISBN`，在处理书籍的关系型数据库时，你需要使用它作为主键。在处理具有非自然键（如电子邮件、人员）的数据库时，情况会有不同，此时你需要为每一行发明自己的主键。\n\
    \n让我们用一个人员及其联系电话的数据库作为示例。我们不能将姓名视为主键。同样不能将人的电话号码视为主键。这是因为全球可能有两个或多个人拥有相同的联系电话、名字，甚至是姓氏。因此，我们应该自己创建主键。这就是标识列（identity\
    \ column）派上用场的地方。\n\n标识列作为一个自动递增列，当我们向表中添加数据时，它会继续生成唯一键。键的组合并不重要，因为我们只需要为数据库中的每个身份提供一个唯一键。\n\
    \n# 第 2 章 – 关系模型示例\n\n由于我在上一节中使用了人员数据库，现在我将为你提供一个联系人数据库作为关系模型的完美示例。\n\n一个简单的联系人数据库通常看起来如下：\n\
    \n| 名字 (First Name) | 姓 (Last Name) | 电子邮件地址 (Email Address) |\n| :--- | :---\
    \ | :--- |\n| John | Doe | johndoe@email.com |\n| Mae | Lee | maelee@email.com\
    \ |\n\n在这张表中，我们有三列在寻找特定数据。第一列请求名字。第二列请求姓，第三列请求该人的电子邮件地址。\n\n我们的行（除第一行外）每一行都指的是一个单一实体。第一个实体的行指的是名为\
    \ John Doe 的人，他的电子邮件是 `johndoe@email.com`。第二个实体的行指的是 Mae Lee，其电子邮件地址为 `maelee@email.com`。\n\
    \n这是一个由三列划分的两个实体的数据库示例。\n\n让我们说 John Doe 有两个电子邮件地址，而 Mae Lee 有三个。有些人最终会增加列。这种情况下表将如下：\n\
    \n*(由于原文表格数据不全，此处仅翻译可见描述文本)*\n"
