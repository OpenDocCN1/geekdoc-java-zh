    \ one. This process is known as compiling. Now, object-oriented code is just how\
    \ the code is structured. You’ll understand that tidbit a little better in the\
    \ following chapters.\n\nSo what does that all mean and why do you need to know\
    \ it? As a programmer using C++, you’re going to need more than just the average\
    \ text editor. There only a few programming languages where that’s all you’ll\
