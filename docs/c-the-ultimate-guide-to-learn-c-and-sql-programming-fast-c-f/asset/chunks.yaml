    它实际上有自己的名字。它是一个无限循环，所以它会无限循环下去。通过代码，你会得到类似“1 等于 1 吗？是的，相等，打印一个‘a’。”的内容。这将一遍一遍一遍重复。还有其他创建无限循环的方法，但你可能不想创建一个。


    ## Do While 循环

    第二种类型的循环是 `do while` 循环。`do while` 循环看起来如下：


    ![](img/00028.jpeg)


    虽然它看起来与你刚刚看到的标准 `while` 循环不同，但它们几乎是一样的，只有一个区别。`while` 循环会评估一个条件来判断其是否为真，如果是，则执行代码；而
    `do while` 循环会先执行某些代码，然后检查条件是否为真。由于这种情况，无论你为大括号之间的代码初始化 `userInput` 为什么，它都会被执行。


    ## For 循环

    第三种类型的循环是 `for` 循环。这是三种中最复杂的，但一旦你理解了它，它非常强大。现在，我们只需介绍它的用法。看看这个 `for` 循环。


    ![](img/00029.jpeg)


    这段代码告诉程序首先将值 `i` 设置为 2，只要 `i` 小于 10，就将其值输出到屏幕并递增。你可以轻松地使用 `while` 循环复制这个循环，但这会使用多得多的代码而且非常杂乱。


    你还应该知道，`for` 循环第一行使用的变量必须是同一个变量。你还应该记住，第一个语句不是条件判断，而是赋值。


    当你想要遍历各种数据段时，这种循环会非常有用，当你阅读下一章关于数组的内容就会看到这一点。


    ## 第七章 – 数组

    数组是一组由于具有共同用途而归类在一起的变量列表。它们并不真的需要有什么共同点，但当你把无关的东西放在在一起并不是一个好主意。这就像向你的文件柜里塞满随机纸张而从不整理它们。如果你打算那样做，还需要文件柜干什么呢？


    这里是一个整数变量数组的声明。


    ```cpp

    int a[5];

    ```


    你可以看到数组看起来像普通变量，但它们末尾有一些方括号。当你声明数组时，括号内填充的是你所寻找的数组的大小。在这种情况下，你将存储五个整数变量。


    ![images(2)](img/00030.jpeg)


    数组可以是任何你想要的，只要你有空闲的内存（RAM），但它一次只能包含一种类型的变量。变量类型可以是通常使用的任何类型。


    访问数组中的特定变量非常简单。你将所需的变量数字放在方括号中。所以，对于你想要的第一个变量使用 `[0]`，对于第二个使用 `[1]`，以此此类推。看看下面的示例。


    ![](img/00031.jpeg)


    你不应该做的一件事是访问数组中不存在的变量，例如，在一个有五个位置的数组中访问第十个变量，或者访问没有给它分配变量的变量。如果它没有分配变量，你将得到所谓的“垃圾值”，因为它返回的值是不可用的。


    如果变量不存在，你可能会得到“段错误”（segmentation fault），因为程序将尝试访问它未被允许访问的内存段。这可能导致程序意外终止。


    现在你已经知道了如何创建数组，让我们来看看如何创建函数！


    ## 第八章 – 函数

    函数是编写复杂程序的好方法，而不需要重复代码。例如，假设你有一段复杂的代码从用户那里获取输入并对其解析。现在，假设你需要运行这段代码几次，但不在循环中运行。在此之前，你每次都必须写一遍。


    ![images(3)](img/00032.jpeg)


    有了现代的复制粘贴，这并不是大问题，但它看起来会很糟糕，而且在修复任何错误时，重复的代码可能会成为问题。为了解决这个问题，你可以创建函数，即是可以反复调用的代码段而不需要每次编写。


    实际上，你已经用过函数了。`Main` 就是一个函数。所以让我们来看看它是如何工作的。


    ![](img/00033.jpeg)


    让我们检查第一行，即包含 `main` 单词的那行。它开始了一个不带参数的函数定义，被称为 `main`，并将将返回一个 `int` 类型的值。你已经知道
    `int` 是什么（一种变量类型），但“返回一个值”意味着什么？


    C++ 中的函数就像数学中的函数一样，你输入一个数字并对其进行某些操作，然后得到一个答案。在这里，`int` 是输出函数将要的变量。参数是放入函数的变量，然后函数在返回结果之前会执行操作。


    让我们来看看带有 `main` 的函数。


    ![](img/00034.jpeg)


    参数的写法类似于变量定义并用逗号分隔。它们写在函数名之后，并放在括号内。


    ## 第九章 – 指针

    随机存内存（RAM）是计算机保存所有变量的地方，但有时了解这些是好的。整数是四个字节长的，即使你只使用一个字节，它仍然占用四个字节。


    ![images(4)](img/00035.jpeg)


    但你为什么需要知道这些？C++ 程序员需要知道编译器并没有为他们进行高级的寻址（将变量翻译到内存中），但有时自己了解这些转换是好的。考虑一下数组是如何工作的，它们只是类型由程序员告诉编译器的长行变量。


    所以你可能认为这就像内存一样，你是对的。当你标记数组且第五个值实际上是数字六（因为所有数组都从零开始），你实际上是在取第一个变量之后的第五个变量。如果你说数组是整数型，第一个整数来自内存地址
    1000，那么结合你所知道的整数占四个字节的知识，你可以看到数组中的第 n 个整数将具有这个地址：


    ![](img/00036.jpeg)


    因此，第六个元素的地址是 1020。所以为什么很有用？你可以在程序编译运行时创建数组并使其具有正确的大小。


    指针是一个普通变量，但它不存储整数，而是存储另一个变量的地址。这是一个指针。


    ![](img/00037.jpeg)


    在这个指针中，你有一个存储整数地址的变量。`*` 是作为指针的变量，而不是普通变量。你将其赋值为零。当你给指针赋值时，你不是在给它们数字或字符，而是在给它们另一个变量的地址。

    '
