    Now that you know what they are, let’s move on to dynamic memory in the following
    chapter.


    # Chapter Ten - Dynamic Memory


    So far you’ve been able to create variables at compile-time and modify them during
    run-time; however, you can create them in run-time, too when you use dynamic memory
    allocation. This method uses allocation and deallocation of RAM as the program
    is running. Since you’re accessing RAM, it’s natural to assume that you’ll do
    it with pointers, but dynamic memory in `C++` is utilized differently than it
    is in C.


    Take a look at the following block of code.


    ![](images/00038.jpeg)


    Here you’ve made a pointer to an `int` and set aside some memory for it. Since
    `i` is still the pointer, not a variable, you’ll have to set the value pointed
    to by `i` to five and not `i`. This changes the location point by `i` and orphaned
    the set aside memory in RAM somewhere. This memory that’s been forgotten is known
    as memory leak. To stop this, be sure to deallocate the memory you set aside in
    the first place using the `delete` operator.


    ![images(5)](images/00039.jpeg)


    Allocating memory down to single variables doesn’t help much, though. If you know
    the variable was going to exist then you could declare it normally. What this
    does is create variable size arrays that are not known as compile-time. How would
    you possibly know it, really? You can’t create an array of pointers and tap into
    them as you need them, that’s just a more RAM intensive version of making gigantic
    array and hoping everything goes well.


    Now that you know what dynamic memory is and how to use it, let’s take a look
    at classes and objects in the following chapter.


    # Chapter Eleven - Classes and Objects


    This is actually what `C++` was made to do, support classes and objects. Without
    them, `C++` is just really C. But what are the classes and objects that have been
    mentioned before? Classes are like a type of mold and the object is the thing
    that comes from the mold. These molds are flexible and are able to be used to
    make whatever type of object you’d like. The molds can be general or they can
    be specific.


    ![images(5)](images/00040.jpeg)


    So let’s say you want to make a vehicle. This is going to be an abstract tutorial
    as the code is not actually doing to do anything. Think of what properties a car
    needs. They need speed, price, color, manufacturer, and a model. What about if
    it’s four wheel drive or not? And what can you do with it? Can you start the engine
    and stop?


    Let’s take a look at the class definition of what the car looks like.


    ![](images/00041.jpeg) ![](images/00042.jpeg)


    ![](images/00043.jpeg)


    So as you can see, classes are defined a lot like structs, and that makes sense
    because they are both a way to group data. But this class contains something that
    a struct is not able to, functions.


    # Conclusion


    So by now you know how to create your first, simple program and much more! You
    know what a variable is, how to expand your program, how to use operators, conditions,
    loops, arrays, functions, pointers, dynamic memory, and classes and objects to
    morph your program into a masterpiece! You see, `C++` was not as difficult as
    you may have once though it was.


    The next step is to gather the knowledge you’ve gleaned from this book and go
    on to read more about the wonderful world of `C++` programming. Once you’re comfortable,
    set up a virtual machine to do your coding in and get started! You’ll learn a
    skill that’s highly valuable in the computer industry today.


    Thank you for reading. I hope you enjoy it. I ask you to leave your honest feedback.

    '
