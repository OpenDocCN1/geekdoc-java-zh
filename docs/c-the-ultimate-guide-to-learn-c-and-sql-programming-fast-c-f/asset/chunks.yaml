    \n## Introduction\n\nC++ is an up and coming programming language that’s based\
    \ on objects and compiling. If you’re someone who’s never programmed before, you\
    \ might be confused by the words object and compiling.\n\nA program that utilized\
    \ compiling is read by the computer’s CPU rather than by being interpreted by\
    \ a program installed on the computer to run that program. Therefore, the program\
    \ speaks more to the computer’s processing system rather than a program.\n\nYou\
    \ may already know this, but computers are not able to read letters and have to\
