  raw: 'With regard to performance, all programs created in Java are known for being
    slow and needing a huge memory. However, ever since just-in-time compilation was
    introduced in 1997 and 1998, the execution speed of Java has significantly improved.
    More language features that support better code analysis have been added. These
    include inner classes, optional assertions, and StringBuilder. Optimizations like
    HotSpot have been added as well.


    The Purpose of Java


    Java was created for the purpose of security and portability.


    Security


    Each time you download a program, you actually take a risk for the code that you
    download may have a virus. A malicious code is harmful because it can access your
    system resources without authorization. For instance, a virus program may obtain
    private and sensitive information, such as passwords and credit card details.
    It does this by searching the local file system of your computer. Fortunately,
    Java enables the safe download of applets by confining applets to its execution
    environment and preventing access to the other parts of your computer. Security
    is, in fact, considered to be Java’s most innovative aspect. You can download
    applets without worrying that anything would breach the security of your computer
    system.


    Portability


    One of the Internet’s major aspects is portability. There are just so many different
    kinds of operating systems and computers connected to the Internet. So if a program
    using Java is virtually run on a computer with an Internet connection, there has
    to be something that enables such program to be executed on multiple systems.
    For instance, when using an applet, it has to be downloadable and executable by
    different kinds of operating systems, browsers, and CPUs connected to the Internet.
    It is not a good idea to use different types of applets on different computer
    systems. Keep in mind that the same code should be able to work on all kinds of
    computers. This means that you need something to generable portable executable
    codes. Also, remember that the same mechanism should be able to ensure security
    and create portability.


    Buzzwords


    Now that you have learned why Java was created, you have to learn about the buzzwords
    associated with it. Aside from security and portability, there are a bunch of
    other factors that play a crucial role in its development. The programming language’s
    design team sums up its key considerations in the following buzzwords list:


    Simple


    *   It is easy to learn and use.


    *   It makes writing programs easier and more convenient.


    *   It allows ease of expression.


    *   It has a cohesive and concise set of features.


    *   Most of the confusing or complex features found in C++ are not found in Java.


    Secure


    *   It offers data security by means of encapsulation.


    *   It allows applets, which are small programs that are automatically downloadable
    from a computer to another, to be written for security.


    *   Security does not get compromised when it comes to applets being able to access
    the system resources.


    *   The applets are run within JVM, protecting them against illegal or unauthorized
    access to the system resources.


    Portable


    *   The applications created with Java can be described as portable since they
    are executable on any type of computer that uses any operating system or CPU.


    *   When applications are compiled, they generate intermediate code files known
    as bytecodes.


    *   These bytecodes enable Java to be portable. They can also be taken to any
    kind of computer for direct execution.


    Object – Oriented


    *   Java has an object-oriented model.


    *   Therefore, it supports features such as encapsulation, polymorphism, inheritance,
    and abstraction.


    Robust


    *   Applications and programs in Java are described as robust when they are able
    to provide response to context.


    *   Java has features that make its programs robust, such as exception handling
    and type checking.


    Multithreaded


    *   Multithreading is supported in Java, but not in C or C++.


    *   Threading is a lightweight process and multithreading can increase the efficiency
    of the CPU.


    *   Programs may be divided into different threads, with each thread concurrently
    executed or in parallel with other threads.


    Architecture – Neutral


    *   The bytecodes help the programming language become portable.


    *   The bytecodes are executable on computers that run on any type of CPU or operating
    system.


    *   Java is said to be architecture-neutral because its applications can be executed
    on whatever type of CPU.


    High Performance and Interpreted


    *   An interpreter is available in version 1.0 specifically for executing bytecodes.


    *   Compared to compilers, interpreters are slower. This is why the programs that
    use Java tend to be executed slowly.


    *   The just-in-time (JIT) compiler replaced the interpreter after version 1.0.


    *   The just-in-time (JIT) compiler makes use of the Hot Spot technology from
    the Sun Microsystem.


    *   The just-in-time (JIT) compiler converts bytecodes into machine codes one
    at a time as well as caches them for later use.


    *   The performance of programs is enhanced, thereby allowing them to be rapidly
    executed.


    Distributed


    *   Distributed computation that uses the Remote Method Invocation (RMI) concept
    is supported by Java.


    *   The client and the server are allowed to communicate with each other. The
    programs are rapidly executed when computations are divided among the computers
    available.


    *   Resources are shared in a distributed system.


    Dynamic


    *   Most runtime information regarding objects and the program itself are maintained
    by the Java Virtual Machine (JVM).


    *   At runtime, the libraries are linked dynamically.


    *   Hence, the program does not get affected even though you do some dynamic changes
    to the codes.


    # Chapter 2: Program Structure and Syntax


    All programs written in Java consist of classes. A class is basically a template
    used to create an object. Every object contains members, which are either methods
    or fields. A method is an operation on values or objects passed as arguments while
    a field is practically a container that stores the value. Objects made by certain
    class templates are known as the objects or instances of that particular class.
    Every instance has members that are mentioned in the class template.


    Members of a class have identifiers as their names. These names should abide by
    the syntactic rules specifically made for variables. The objects in Java are actually
    a Scheme struct generalization since the methods operating on class instances
    are determined by class definition. The operation sets that manipulate structs
    in Scheme are fixed.


    In this chapter, the structure and basic syntax of a Java program will be discussed.


    Structure of a Program


    Consider the following sample program:


    package sct ;


    public class HelloJavaWorld {


    / * *


    * comments


    * /


    public static void main ( String [ ] args ) {


                  / / Comment : printing the output on console


                  System.out.println ( “ Wendy says Hello Java World “ ) ;


      }


    }


    As you can see in the above given example, the program has five parts: package
    sct, public class HelloJavaWorld, comments section, public static void main (
    String [ ] args ), and System.out.println ( “ Wendy says Hello Java World “ )
    . Let us discuss each part in detail.


    First, package sct is the package declaration statement. It defines a name space
    wherein the classes are stored. The package organizes classes depending on their
    functionality. When you do not include the package statement, you put the class
    names in the default package that does not have a name. Take note that package
    statements are not allowed to appear anywhere else in the program. Your package
    statement has to either appear on the first line or be omitted.'
