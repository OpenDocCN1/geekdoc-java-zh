    there are no class objects that are present. Void is a keyword that states nothing
    will be returned from method even though method can return any object or primitive.
    The method content is within the curly braces ( { } ) .


    Finally, there is system.out.println ( “ Wendy says Hello Java World “ ) . System
    is the name of the utility class in Java while out represents an object that belongs
    to the System class. Println is a utility method name that is commonly used to
    send a String to console and “ Wendy says Hello Java World “ is a string literal
    that functions as an argument to the println method.


    Basic Syntax


    A program in Java can be described as a collection of objects that communicate
    by invoking their methods.


    An object has a state and behavior. To help you understand it better, you can
    compare it with a cat. Let us say that the cat is the object. It has states, such
    as its name, breed, and color. Similarly, it has behaviors, such as purring, eating,
    and sleeping. With this being said, you can conclude that the object is actually
    an instance of the class.


    A class is a template that describes the states or behaviors of the supported
    object.


    A method is a behavior. Take note that a class may contain as many methods as
    necessary. It is in these methods where data is manipulated, logic is written,
    and actions are executed.


    Every object has its own unique instance variable set. The state of the object
    is the output of the values allocated to the instance variables.


    With regard to syntax, you should always remember that there are certain points
    crucial in every Java program. It is wise to keep the following pointers in mind:


    *   Case sensitivity. Java is a case sensitive programming language. This means
    that words featuring uppercase and lowercase letters do not mean the same thing.
    For example, hello, Hello, and HeLLo are all different identifiers. They have
    the same spelling, but they are read differently by the computer due to the arrangements
    of their uppercase and lowercase letters.


    *   Class names. Take note that the initial letter of every class name has to
    be capitalized. If you are using several words for the name of your class, you
    have to use an uppercase letter at the beginning of each one of these words. For
    example, you can write class  HelloJavaWorld.


    *   Method names. Just like with class names, you have to pay particular attention
    to the first letter of your method names. However, instead of uppercase letters,
    you have to use lowercase letters. If there are several words used for your method
    name, you have to use a lowercase letter at the beginning of the first word and
    uppercase letters at the beginning of the rest of the words. For example, you
    can write public void helloJavaWord ( ) .


    *   Program file name. The name of your program file has to be an exact match
    for your class name. When you save your file, you have to save it with a class
    name. Since Java is a case sensitive programming language, you have to append
    .java to the end part of your file name. In the event that your class name and
    file name do not match, the program will not successfully compile. For example,
    if your class name is ThisIsMyJavaProgram, then you have to save it as ThisIsMyJavaProgram.java.


    *   public static void main ( String args [ ] ) . The processing of a program
    begins at the main ( ) method. This method is actually a mandatory part of all
    programs written in Java.


    # Chapter 3: Variables and Data Types


    In Java, there are three main types of variables: local, class or static, and
    instance or non-static. Variables are basically memory locations wherein values
    are stored. They have names, types, and values. Before you can use them, you need
    to declare them. Once you have successfully declared them, you can start allocating
    values to them.


    Anyway, local variables are used within method definitions. Nonetheless, they
    may also be used within blocks. When a block is done with the execution, the variable
    definition along with its value disappears. You should use local variables if
    you need to store data needed by instance variables or a single method to hold
    information that is needed by methods in an object.


    Class variables and instance variables are quite similar, except for the fact
    that the values of class variables apply to the class and its instances instead
    of have different values for every object. Instance variables are used for defining
    attributes or states of objects.


    Unlike other programming languages, there are no global variables in Java. When
    you say global variables, these variables are global to every part of the program.
    Class and instance variables, for instance, may be utilized to communicate global
    data between different objects.


    Variable Declaration


    Before you can use a variable in a program written in Java, you have to declare
    it. Declaring variables require the use of a variable name and a type. Take a
    look at the following example:


    int myAge ;


    String myName ;


    boolean is Tired ;


    Take note that variable definitions may be placed anywhere within a method definition
    although, they tend to be declared at the start of the definition prior to their
    execution. For example:


    ![nuno1.jpg](images/00001.jpeg)


    It is possible to string variable names with a similar type together. Consider
    the following example:


    int a , b , c ;


    String givenName , Surname ;


    You are allowed to give variables initial values when you declare them as well.
    Consider the following examples:


    int mySize, myAge, numShoes = 20 ;


    String myName = “ Wendy “ ;


    boolean is Tired = true ;


    int w = 4 , x = 5 , y = 6 ;


    If there are several variables on the line with just one initializer, the first
    value only applies to the final variable in the declaration. An example of this
    would be the first line on the sample codes shown above. Also, you can group initializers
    and variables on the same line with the use of commas just like what is shown
    on the last line in the above given example.


    Keep in mind that when it comes to using local variables, you have to give them
    values before you use them. Otherwise, your program will not successfully compile.
    With this being said, you should make it a habit to give your local variables
    initial values. Class and instance variable definitions, nonetheless, do not have
    a similar restriction. This is because their initial values depend on their variable
    type: 0 for numeric variables, false for booleans, null for class instances, and
    \0 for characters.'
