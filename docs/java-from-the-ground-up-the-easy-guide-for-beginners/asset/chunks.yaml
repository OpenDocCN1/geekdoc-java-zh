- fmt: "\nWith regard to performance, all programs created in `Java` are known for\
    \ being slow and needing a huge memory. However, ever since just-in-time compilation\
    \ was introduced in 1997 and 1998, the execution speed of `Java` has significantly\
    \ improved. More language features that support better code analysis have been\
    \ added. These include inner classes, optional assertions, and `StringBuilder`.\
    \ Optimizations like `HotSpot` have been added as well.\n\n# The Purpose of Java\n\
    \nJava was created for the purpose of security and portability.\n\n## Security\n\
    \nEach time you download a program, you actually take a risk for the code that\
    \ you download may have a virus. A malicious code is harmful because it can access\
    \ your system resources without authorization. For instance, a virus program may\
    \ obtain private and sensitive information, such as passwords and credit card\
    \ details. It does this by searching the local file system of your computer. Fortunately,\
    \ `Java` enables the safe download of applets by confining applets to its execution\
    \ environment and preventing access to the other parts of your computer. Security\
    \ is, in fact, considered to be `Java`’s most innovative aspect. You can download\
    \ applets without worrying that anything would breach the security of your computer\
    \ system.\n\n## Portability\n\nOne of the Internet’s major aspects is portability.\
    \ There are just so many different kinds of operating systems and computers connected\
    \ to the Internet. So if a program using `Java` is virtually run on a computer\
    \ with an Internet connection, there has to be something that enables such program\
    \ to be executed on multiple systems. For instance, when using an applet, it has\
    \ to be downloadable and executable by different kinds of operating systems, browsers,\
    \ and CPUs connected to the Internet. It is not a good idea to use different types\
    \ of applets on different computer systems. Keep in mind that the same code should\
    \ be able to work on all kinds of computers. This means that you need something\
    \ to generable portable executable codes. Also, remember that the same mechanism\
    \ should be able to ensure security and create portability.\n\n## Buzzwords\n\n\
    Now that you have learned why `Java` was created, you have to learn about the\
    \ buzzwords associated with it. Aside from security and portability, there are\
    \ a bunch of other factors that play a crucial role in its development. The programming\
    \ language’s design team sums up its key considerations in the following buzzwords\
    \ list:\n\n### Simple\n- It is easy to learn and use.\n- It makes writing programs\
    \ easier and more convenient.\n- It allows ease of expression.\n- It has a cohesive\
    \ and concise set of features.\n- Most of the confusing or complex features found\
    \ in `C++` are not found in `Java`.\n\n### Secure\n- It offers data security by\
    \ means of encapsulation.\n- It allows applets, which are small programs that\
    \ are automatically downloadable from a computer to another, to be written for\
    \ security.\n- Security does not get compromised when it comes to applets being\
    \ able to access the system resources.\n- The applets are run within `JVM`, protecting\
    \ them against illegal or unauthorized access to the system resources.\n\n###\
    \ Portable\n- The applications created with `Java` can be described as portable\
    \ since they are executable on any type of computer that uses any operating system\
    \ or CPU.\n- When applications are compiled, they generate intermediate code files\
    \ known as bytecodes.\n- These bytecodes enable `Java` to be portable. They can\
    \ also be taken to any kind of computer for direct execution.\n\n### Object –\
    \ Oriented\n- `Java` has an object-oriented model.\n- Therefore, it supports features\
    \ such as encapsulation, polymorphism, inheritance, and abstraction.\n\n### Robust\n\
    - Applications and programs in `Java` are described as robust when they are able\
    \ to provide response to context.\n- `Java` has features that make its programs\
    \ robust, such as exception handling and type checking.\n\n### Multithreaded\n\
    - Multithreading is supported in `Java`, but not in `C` or `C++`.\n- Threading\
    \ is a lightweight process and multithreading can increase the efficiency of the\
    \ CPU.\n- Programs may be divided into different threads, with each thread concurrently\
