  trans: "\n在性能方面，所有用 `Java` 创建的程序都以运行缓慢和需要大量内存而闻名。然而，自从 1997 和 1998 年引入即时编译（just-in-time\
    \ compilation）以来，`Java` 的执行速度显著提高。此外增加了更多支持更好代码分析的语言特性，包括内部类、可选断言和 `StringBuilder`。同时还引入了如\
    \ `HotSpot` 等优化技术。\n\n# Java 的目的\n\nJava 的创建目的是为了安全性和移植性。\n\n## 安全性\n\n每次下载一个程序时，你实际上面临着风险，因为下载的代码可能包含病毒。恶意代码是有害的，因为它可以在未经授权的情况下访问你的系统资源。例如，病毒程序可能会获取隐私和敏感信息，如密码和信用卡详情。它是通过搜索你计算机的本地文件系统来实现的。幸运的是，`Java`\
    \ 通过将 applet 限制在其执行环境中并防止其访问计算机的其他部分，实现了 applet 的安全下载。事实上，安全性被认为是 `Java` 最具创新性的方面。你可以下载\
    \ applet 而而不必担心任何内容会破坏你计算机系统的安全性。\n\n## 可移植性\n\n互联网的主要特征之一就是可移植性。连接到互联网的有许多不同的操作系统和计算机。因此，如果一个使用\
    \ `Java` 的程序几乎可以在任何连接互联网的计算机上运行，那么必须有某种机制使该程序能够在多个系统上执行。例如，当使用 applet 时，它必须能够被连接到互联网的各种操作系统、浏览器和\
    \ CPU 下载并执行。在不同的计算机系统上使用不同类型的 applet 不是一个好主意。请记住，相同的代码能够在所有类型的计算机上运行。这意味着你需要某种东西来生成可移植的可执行代码。此外，记住相同的机制应该能够确保安全性并创建可移植性。\n\
    \n## 术语\n\n现在你已经了解了为什么要创建 `Java`，你必须学习与它相关的术语。除了安全性和移植性之外，还有许多其他因素在其开发过程中起着至关重要的作用。编程语言的设计团队在以下术语列表中总结了其核心考虑因素：\n\
    \n### 简单 (Simple)\n- 易学习和使用。\n- 它让编写程序变得更容易、更方便。\n- 它允许轻松表达。\n- 它拥有一组凝聚且简洁的特性。\n\
    - `C++` 中发现的大多数令人困惑或复杂的特性在 `Java` 中并不存在。\n\n### 安全 (Secure)\n- 通过封装提供数据安全。\n-\
    \ 它允许为 applet（一种可以从一台计算机自动下载到另一台计算机的小型程序）编写安全性的代码。\n- 在 applet 能够访问系统资源时，安全性不会受到损害。\n\
    - applet 在 `JVM` 内部运行，保护它们免受对系统资源的非法或未经授权的访问。\n\n### 可移植 (Portable)\n- 用 `Java`\
    \ 创建的应用程序可以被认为是可移植的，因为它们可以在使用任何操作系统或 CPU 的任何计算机上执行。\n- 当应用程序编译时，它们会生成称为字节码（bytecodes）的中间代码文件。\n\
    - 这些字节码使得 `Java` 可移植。它们也可以被带到任何类型的计算机上直接执行。\n\n### 面向对象 (Object – Oriented)\n\
    - `Java` 有面向对象的模型。\n- 因此，它支持封装、多态、继承和抽象等特性。\n\n### 健壮 (Robust)\n- 当 `Java` 中的应用程序和程序能够对上下文做出响应时，它们被描述为健壮的。\n\
    - `Java` 具有使其程序变得健壮的特性，例如异常处理和类型检查。\n\n### 多线程 (Multithreaded)\n- `Java` 支持多线程，但\
    \ `C` 或 `C++` 不支持。\n- 线程是一种轻量级进程，多线程可以提高 CPU 的效率。\n- 程序可以被分成不同的线程，每个线程并发或与其他线程并行执行。\n\
    \n### 架构中立 (Architecture – Neutral)\n- 字节码帮助编程语言变得可移植。\n- 字节码可以在运行任何类型 CPU 或操作系统的计算机上执行。\n\
    - `Java` 被认为是架构中立的，因为它的应用程序可以在任何类型的 CPU 上执行。\n\n### 高性能和解释执行 (High Performance\
    \ and Interpreted)\n- 1.0 版本专门提供了一个用于执行字节码的解释器。\n- 与编译器相比，解释器较慢。这就是为什么使用 `Java`\
    \ 的程序往往执行得缓慢。\n- 在 1.0 版本之后，即时编译器（`JIT`）取代了解释器。\n- 即时编译器（`JIT`）利用了 Sun Microsystems\
    \ 的 `Hot Spot` 技术。\n- 即时编译器（`JIT`）逐个将字节码转换为机器码，并将其缓存以备后用。\n- 程序的性能得到了增强，从而允许它们快速执行。\n\
    \n### 分布式 (Distributed)\n- `Java` 支持使用远程方法调用（`RMI`）概念的分布式计算。\n- 允许客户端和服务器相互通信。当计算在可用计算机之间分配时，程序会被快速执行。\n\
    - 资源在分布式系统中共享。\n\n### 动态 (Dynamic)\n- 关于对象和程序本身的大多数运行时信息由 虚拟机（`JVM`）维护。\n- 在运行时，库是动态链接的。\n\
    - 因此，即使你对代码进行动态更改，程序也不会受到影响。\n\n# 第 2 章：程序结构与语法\n\n所有用 `Java` 编写程序都由类组成。类基本上是一个用于创建对象的模板。每个对象都包含成员，成员可以是方法或字段。方法是对作为参数传递的值或对象的操作，而字段实质上是一个存储值的容器。\n\
    \n## 程序的结构\n\n考虑以下示例程序：\n\n```java\npackage sct;\n\npublic class HelloJavaWorld\
    \ {\n    /*\n     * comments\n     */\n    public static void main(String[] args)\
    \ {\n        // Comment : printing the output on console\n        System.out.println(\"\
    Wendy says Hello World\");\n    }\n}\n```\n\n如你在上面的示例所示，程序有五个部分：`package sct`、`public\
    \ class HelloJavaWorld`、注释部分、`public static void main(String[] args)` 以及 `System.out.println(\"\
    Wendy says Hello World\")`。让我们详细每个部分。\n\n首先，`package sct` 是包声明语句。它定义了存储类的命名空间。包根据功能组织类。当你不包含包语句时，你将类名放在没有名字的默认包中。注意，包语句不允许出现在程序的任何地方。你的包语句要么出现在第一行，要么被省略。\n\
    \n"
- fmt: '

    `Public class HelloJavaWorld` is a line that has a variety of programming aspects.
    `Public` is an access modifier keyword that commands compiler access to class.
    Different access modifier values can actually be `private`, `public`, `protected`,
    and no value or default. `Class` is a keyword used for declaring class. The name
    of the class, which in this case is `HelloJavaWorld`, follows it.


    The comments section is the area of the program in which you put line comments
    or block comments. If you choose to write line comments, you have to use a couple
    of forward slashes (`//` ) at the beginning of the comment. Likewise, you have
    to put these forward slashes at the end of that same comment line. Keep in mind
    that an ending symbol is no longer necessary when writing a line comment.


    A block comment, on the other hand, begins with a forward slash ( `/` ) and an
    asterisk ( `*` ), so it looks like this : `/ *`. It ends with an asterisk and
    a forward slash, which looks like this : `* /`. If you choose to writ block comments,
    you can extend them across as many lines as you want.


    `Public static void main ( String [ ] args )` is a method or function with a string
    array as an argument. `Public` serves as the access modifier while `static` is
    a reserved keyword that indicates the existence of a usable and accessible method
    even when there are no class objects that are present. `Void` is a keyword that
    states nothing will be returned from method even though method can return any
    object or primitive. The method content is within the curly braces (`{ }`).


    Finally, there is `system.out.println ( “ Wendy says Hello Java World “ )`. `System`
    is the name of the utility class in Java while `out` represents an object that
    belongs to the `System` class. `println` is a utility method name that is commonly
    used to send a `String` to console and `" Wendy says Hello Java World “` is a
    string literal that functions as an argument to the `println` method.


    ## Basic Syntax


    A program in Java can be described as a collection of objects that communicate
    by invoking their methods.


    An object has a state and behavior. To help you understand it better, you can
    compare it with a cat. Let us say that the cat is the object. It has states, such
    as its name, breed, and color. Similarly, it has behaviors, such as purring, eating,
    and sleeping. With this being said, you can conclude that the object is actually
    an instance of the class.


    A class is a template that describes the states or behaviors of the supported
    object.


    A method is a behavior. Take note that a class may contain as many methods as
    necessary. It is in these methods where data is manipulated, logic is written,
    and actions are executed.


    Every object has its own unique instance variable set. The state of the object
    is the output of the values allocated to the instance variables.


    With regard to syntax, you should always remember that there are certain points
    crucial in every Java program. It is wise to keep the following pointers in mind:


    - **Case sensitivity**. Java is a case sensitive programming language. This means
    that words featuring uppercase and lowercase letters do not mean the same thing.
    For example, `hello`, `Hello`, and `HeLLo` are all different identifiers. They
    have the same spelling, but they are read differently by the computer due to the
    arrangements of their uppercase and lowercase letters.

    - **Class names**. Take note that the initial letter of every class name has to
    be capitalized. If you are using several words for the name of your class, you
    have to use an uppercase letter at the beginning of each one of these words. For
    example, you can write class `HelloJavaWorld`.

    - **Method names**. Just like with class names, you have to pay particular attention
    to the first letter of your method names. However, instead of uppercase letters,
    you have to use lowercase letters. If there are several words used for your method
    name, you have to use a lowercase letter at the beginning of the first word and
    uppercase letters at the beginning of the rest of the words. For example, you
    can write `public void helloJavaWord ( )`.

    - **Program file name**. The name of your program file has to be an exact match
    for your class name. When you save your file, you have to save it with a class
    name. Since Java is a case sensitive programming language, you have to append
    `.java` to the end part of your file name. In the event that your class name and
    file name do not match, the program will not successfully compile. For example,
    if your class name is `ThisIsMyJavaProgram`, then you have to save it as `ThisIsMyJavaProgram.java`.

    - `public static void main ( String args [ ] )`. The processing of a program begins
    at the `main ( )` method. This method is actually a mandatory part of all programs
    written in Java.


    # Chapter 3: Variables and Data Types


    In Java, there are three main types of variables: local, class or static, and
    instance or non-static. Variables are basically memory locations wherein values
    are stored. They have names, types, and values. Before you can use them, you need
    to declare them. Once you have successfully declared them, you can start allocating
    values to them.


    Anyway, local variables are used within method definitions. Nonetheless, they
    may also be used within blocks. When a block is done with the execution, the variable
    definition along with its value disappears. You should use local variables if
    you need to store data needed by instance variables or a single method to hold
    information that is needed by methods in an object.


    Class variables and instance variables are quite similar, except for the fact
    that the values of class variables apply to the class and its instances instead
    of have different values for every object. Instance variables are used for defining
    attributes or states of objects.


    Unlike other programming languages, there are no global variables in Java. When
    you say global variables, these variables are global to every part of the program.
    Class and instance variables, for instance, may be utilized to communicate global
    data between.


    ## Variable Declaration


    Before you can use a variable in a program written in Java, you have to declare
    it. Declaring variables require the use of a variable name and a type. Take a
    look at the following example:


    ```

    int myAge;

    String myName;

    boolean is Tired;

    ```


    Take note that variable definitions may be placed anywhere within a method although,
    they tend to be declared at the start of the definition prior to their execution.
    For example:


    ![nuno1.jpg](images/00001.jpeg)


    It is possible to string variable names with a similar type together. Consider
    the following example:


    ```

    int a , b , c;

    String givenName , Surname ;

    ```


    You are allowed to give variables initial values when you declare them as well.
    Consider the following examples:


    ```

    int mySize, myAge, numShoes = 20;

    String myName = “ Wendy “;

    boolean is Tired = true;

    int w = 4 , x = 5 , y = 6;

    ```


    If there are several variables on the line with just one initializer, the first
    value only applies to the final variable in the declaration. An example of this
    would be the first line on the sample codes shown above. Also, you can group initializers
    and variables on the same line with the use of commas just like what is shown
    on the last line in the above given example.


    Keep in mind that when it comes to using local variables, you have to give them
    values before you use them. Otherwise, your program will not successfully compile.
    With this being said, you should make it a habit to give your local variables
    initial values. Class and instance variable definitions, nonetheless, do not have
    a similar restriction. This is because their initial values depend on their variable
    type: 0 for numeric variables, false for booleans, null for class instances, and
    \0 for characters.

