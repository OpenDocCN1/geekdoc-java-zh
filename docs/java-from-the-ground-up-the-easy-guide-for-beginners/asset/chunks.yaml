    这些是 `Exception` 的子类，但 `RuntimeException` 及其子类除外。它们强制你处理所遇到的任何异常。当这些异常在方法中发生时，该方法必须接收这些异常并采取适当的措施，或者将它们传递给调用者。`ArithmeticException`
    就是检查异常（checked exception）的一个示例。


    ## 未检查异常


    这些异常包括 `RuntimeException` 及其所有子类。对于未检查异常，编译器不会强制你捕获它们或在 `throws` 子句中声明它们。你可能根本不知道此类异常可以被抛出。这些异常（运行时异常外）必须在编译期间被接收。`ArrayIndexOutOfBoundsException`
    是一个未检查异常的一个示例。


    ## 异常处理


    作为一名程序员，你必须知道如何处理异常，以便开发出健壮的应用程序。异常处理意味着在发生异常时，将程序的执行转移到适当的处理器中。你可以使用 `try` 块和
    `catch` 块来处理异常。


    `try` 块包含可能发生异常的语句。其后跟着一个 `catch` 块，用于处理与 `try` 块相关的任何异常。它后面应该始终紧跟一个 `catch` 块、一个
    `finally` 块或两者都有。


    `catch` 块用于匹配异常。它始终与 `try` 块相关联。一个 `try` 块可以有多个 `catch` 子句。如果 `try` 块内部发生异常，则必须执行相应的
    `catch` 块。


    只要有 `try` 块，`finally` 块就会始终执行。然而，它的作用不仅仅是在异常处理期间执行。它还允许你避免处理那些因 `continue`、`break`
    或 `return` 而意外跳过的清理代码。即使你不预料会发生任何异常，始终将清理代码放在 `finally` 块中也是一个好习惯。


    # 结


    感谢你下载本书！


    希望这本书能够帮助你从初学者的角度学习 Java 编程语言。


