    # 引言

    本书包含了如何使用 `Java` 编程语言创建程序的成熟步骤和策略。它还包含了每个初学者都应该注意的主题细节。


    本书还包含了关于你在 `Java` 中发现的特有用信息，以及为什么 `Java` 是一个很好的程序语言。你还将发现一些示例程序，可以在编写自己的程序时将它们作为指南。


    感谢下载本书，希望你喜欢！


    # 第一章：Java 简介

    `Java` 是一种于 1991 年在 Sun Microsystems 创建的面向对象的编程语言，该公司以其高级 Unix 工作站而闻名。该编程语言以 `C++`
    为模型，最初的设计目标是简单、小巧，并兼容各种操作系统和平台。


    `Java` 通常与 `HotJava` 归为一类，`HotJava` 是孙的一个浏览器，类似于 `Mosaic` 或 `Netscape`。`HotJava`
    与其他浏览器最明显的区别可能是它在你的系统中运行和下载 applet（小程序）的能力。这些 applet 像其他图像一样出现在你的网页中，但它们是交互性和动态的。你可以用它们制作动画和图形，以及其他对你的输入有响应的内容。


    尽管 `HotJava` 是第一个托管 applet 的网页浏览器，但 `Java` 的支持很快在许多其他浏览器中可用。例如，`Netscape 2.0`
    支持 `Java` applet。


    如果你想开发 applet，你必须使用 `Java` 编写程序并对其进行编译。参考 HTML 网页中的 applet。像处理任何其他图像或 HTML 文件一样，将你的
    `Java` 和 `HTML` 文件放置在网站上。当其他人使用 `HotJava` 浏览器查看你的网页时，浏览器会自动将嵌入的 applet 下载到他们的本地系统并运行。读者随后可以以他们想要的方式查看并与
    applet 交互。


    请记住，除了开发 applet 外，你还可以用 `Java` 做很多事情。这种编程语言的编写方式有助于你解决问题和完成任务，就像你使用 `C` 语言或 `C++`
    一样。事实上，`HotJava` 包括它的显示、网络和界面都是使用 `Java` 创建的。


    ## Java 简介

    计算机语言的创新主要受两个因素的影响：编程的改进和计算环境的变化。通过 `Java`，你仍然找到 `C` 和 `C++` 中的元素，但具有更多功能和改进。该编程语言以重构编程以实现更好架构的功能为傲。


    `Java` 是 `James Gosling`、`Chris Wrath`、`Patrick Naughton`、`Mike Sheridan` 和 `Ed
    Frank` 的结晶。它在 Sun Microsystems 开发，最初被称为“Oak”。后来在 1995 年，它的名字被改为 `Java`。`Java`
    的原始目的不是连接互联网，而是作为一种平台无关的语言，用于为各种电子设备开发软件，包括遥控器和微波炉。不同类型的 CPU 被用控制器。然而，在那个时代，计算机语言大多被设计为为特定目标进行编译。


    尽管为任何类型的 CPU 编译 `C++` 程序是可能的，但这需要为该特定 CPU 提供一个完整的编译器。由于编译器的创建需要大量时间且成本高昂，`Gosling`
    和他的团队寻找一种更具移植性的语言，能够产生与不同环境中的不同 CPU 兼容的代码。最终的结果就是 `Java` 编程语言。


    ## 原理与平台

    `Java` 有五个主要目标：它必须简单、熟悉且面向对象；它必须安全且健壮；它必须可移植且与架构中立；它必须执行高效；它必须是动态、解释性和多线程的。


    移植性是 `Java` 的设计目标之一。这意味着为该平台创建的程序要在具有足够运行时操作系统组合上运行。这通过将语言代码编译为被称为 `Java bytecode`
    的中间表示来实现，而不是特定架构的机器码。


    请注意 `Java` 的字节码指令与机器码类似。然而，它们旨在由一种特殊的、为主机硬件制造虚拟机 (`VM`) 执行。运行时环境通常由用户使用。它被安装在浏览器中用于
    applet，或者安装在机器上用于独立应用程序。


    ## 实现与性能

    目前，`Java` 平台由 `Oracle Corporation` 所有。他们的实现适用于 `Microsoft Windows`，包括 `XP`。它也适用于
    `Solaris`、`Mac OS X` 和 `Linux`。这种实现实际上是事实标准，因为 `Java` 没有一个被 `ANSI`、`ISO/IEC`、`Ecma
    International` 或任何第三方标准组织认可的正式标准。


    这种实现也被封装成两个发行版本：包含调试器、`Jar`、`Javadoc` 和 `Java compiler` 等开发工具的开发工具包，以及运行程序所需的平台部分的运行时环境。另一个以
    `GNU GPL` 许可的 Java 实现是 `OpenJDK`。它的实现是从 `Java` 源代码根据 `GPL` 发布开始的。自 `Java SE 7`
    以来，一直是官方的参考实现。


    `Java` 的目标是让每个实现相互兼容。`Sun` 使用 `Java` 的商标许可实际上坚持所有实现必须兼容。正因如此，当 `Sun` 声称 `Microsoft`
    的实现不支持 `JNI` 或 `RMI` 时，引发了法律纠纷。`Sun` 起诉了 `Microsoft` 并在 2001 年获得了 2000 万美元的和解。`Microsoft`
    不再随 `Windows` 自带 Java。


