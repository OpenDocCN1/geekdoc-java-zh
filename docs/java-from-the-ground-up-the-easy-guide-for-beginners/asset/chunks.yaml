    \n# 变量类型\n\n对于每一个变量声明，必须有一个变量类型来定义该变量可以存储的任何值。这种变量类型可以是以下任意一种：数组、类名或基本原始数据类型。共有八种原始数据类型，用于处理浮点数、整数、`Boolean`\
    \ 值和字符的基本类型。它们被称为原始数据类型是因为它们是内置在系统中的。它们并不是真正的对象，这就是为什么它们效率更高。它们还与机器无关，因此它们的特性和大小在每个程序中始终保持一致。\n\
    \n在 Java 中，有四种可用整数类型，每种都有不同的值范围。它们都是有符号的，因此能够容负数或正数。无论你为变量选择何种类型，都取决于你希望该变量存储的值范围。如果值对于你的变量类型来说太大了，它会被截断。\n\
    \n# 关键字\n\n与其它编程语言一样，`Java` 中使用了保留字。这些单词不能用作变量、常量或任何标识符名。以下是 Java 中使用的关键字：\n\n\
    # 注释\n\n在本书的之前章节的示例程序中，你已经读过注释了。`Java` 支持单行注释和多行注释。这些注释实际上与 `C` 和 `C++` 的注释非常相似。当你创建注释时，编译器会忽略其中所有的字符。\n\
    \n请看下面的示例：\n\n```java\npublic class HelloJavaProgram {\n    /* 这是一个用 Java 编写的程序示例。\n\
    \     * 将打印输出 ‘ Hello Java World ‘。\n     * 这是一个多行注释。\n     */\n    public static\
    \ void main ( String [] args ) {\n        // 这是一个单行注释示例。\n        /* 这是另一个单行注释示例。\
    \ */\n        System.out.println (“ Hello Java World ”);\n    }\n}\n```\n\n记住，注释是不可能嵌套的。这意味着你不能将注释放在另一个注释内部。如果你使用单行注释，则必须使用双斜杠（`//`）。到该行结束为止的所有文本都不会被程序读取。\n\
    \n以 `/*` 开头并以 `*/` 结尾的注释是特殊的注释。它们被用于 `Javadoc` 系统，该系统对于从代码生成 API 文档是关重要的。\n\n\
    # 字面量\n\n这些用于指示程序中的简单值。字面量（literal）是 `Java` 中的一个术语，实际上意味着你输入什么，你就会得到什么。所以，如果你输入\
    \ `3`，你将获得一个值为 `3` 的整数。如果你输入 `w`，你将获得一个值为 `w` 的字符。\n\n## 数字字面量\n\n`Java` 中主要有两种类型的数字字面量：精确和近似。\n\
    \n精确数字字面量是指不带小数点的数值。例如，`+28`、`-100` 和 `11` 都是不带小数点的数值。当你在 `Java` 中使用整数语法时，精确数字字面量将支持\
    \ `long` 范围内的数字。\n\n另一方面，近似数字字面量是用科学计数法表示的数值。`+11.4`、`29` 和 `-99.9` 都是这种类型的示例。当你在\
    \ `Java` 中使用浮点字面量语法时，你会发现近似数字字面量实际上支持 `double` 范围内的数字。\n\n整数字面量有不同的类型。例如，数字 `5`\
    \ 是一个 `int` 类型十进制整数字面量。尽管如此，你也可以将其赋值给类型为 `short` 或 `byte` 的 `var`，因为合适。如果值对于你的变量类型来说太大了，它会被截断。\n\
    \n（注：文本中包含大量重复句子，已合并。）\n\n对于浮点字面量，它们通常包含两个部分：整数和小数。无论精度如何，它们的结果都是 `double` 类型数字。如果你想强制让一个数字成为\
    \ `float`，可以在其后面附加 `F`，例如 `2.56F`。此外，你可以通过字母 `E` 或 `e` 使用指数。它甚至可以是一个负数。例如，你可以写\
    \ `.36E-2` 或 `10e45`。\n\n## 布尔字面量\n\n这些字面量是 `true` 或 `false`。关键字 `true` 和 `false`\
    \ 对大小不敏感，因此你可以用大写或小写字母编写，计算机读取结果相同。你还可以在程序中任何需要测试或作为唯一可能的布尔值的地方使用它们。\n\n## 字符字面量\n\
    \n这些字面量使用带有单引号的单个字符表示，例如 `'w'`、`'5'` 和 `'#'`。字符实际上在 `Unicode` 中存储为 16 位字符。以下是表示不可打印字符和包含在\
    \ Unicode 中的字符的特殊代码列表。注意 Unicode、八进制和十六进制转义中的字母代表十六进制数字或数值。\n\n如果你习惯用 `C` 或 `C++`\
    \ 编写程序，你可能会发现 `Java` 中没有包含 `\\v`（垂直制表符）或 `\\a`（响铃）的字符代码。\n\n# 字符串字面量\n\n字符串本质上是字符的组合。在\
    \ `Java` 中，字符串是 `String` 类的实例。由于字符串对象被视为真实的对象，它们拥有允许你轻松测试、修改和组合字符串的方法。当你编写字符串字面量时，你必须在双引号内编写其他字符。请看下面的示例：\n\
    \n```java\n“你好，这是一个字符串字面量的示例。”\n\"\" // 这实际上是一个空字符串\n```\n\n注意，字符串可能包含如 Unicode\
    \ 字符、换行符和制表符等字符常量。有一些示例示例帮助你进一步理解这一概念：\n\n```java\n“这是一个包含 \\t 或制表符的字符串示例 ”\n\
    “嵌套字符串是在另一个 \\ 字符串内部的 \\ 字符串 ”\n“这个字符串示例由 Javaman\\u2122 编写 ”\n```\n\n"
