    # ROLE MODEL


    # BRENDAN EICH: INVENTOR OF JAVAS PROGRAMMING LANGUAGE


    Brendan Eich is an American technologist and creator of the JavaScript programming
    language. He co-founded the Mozilla project, the Mozilla Foundation and the Mozilla
    Corporation, and served as the Mozilla Corporation’s chief technical officer and
    briefly as its executive officer.


    ![](img/a67e9007ff8fb6a450e070349689c51f_42_0.png)


    # Early life


    Brendan Eich received his bachelor''s degree in mathematics and computer science
    at Santa Clara University. He received his master''s degree in 1985 from the University
    of Illinois at Urbana-Champaign. Eich started his career at Silicon Graphics,
    working for seven years on operating system and network code. He then worked for
    three years at MicroUnity Systems writing microkernel and DSP code, and doing
    the very first MIPS R4000 port of GCC.


    # Netscape and JavaScript


    He worked at Netscape Communications Corporation in April 1995. Having originally
    intending to put Scheme “in the browser”, Eich was instead commissioned to create
    a new language that resembled Java, JavaScript for the Netscape Navigator browser.
    The first version was completed in ten days in order to accommodate the Navigator
    2.0 Beta release schedule, and was called Mocha, which was later renamed JavaScript
    in September 1995 and later JavaScript in the same month. Eich continued to oversee
    the development of Spider Monkey, the specific implementation of JavaScript in
    Navigator, until 2011.


    # Mozilla


    In early 1998, Eich co-founded the Mozilla project, with a website at mozilla.org,
    that was meant to manage open-source


    ![](img/a67e9007ff8fb6a450e070349689c51f_42_1.png)'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'contributions to the Netscape source code. He served as Mozilla’s chief architect.
    AOL bought Netscape in 1999. After AOL shut down the Netscape browser unit in
    July 2003, Eich helped spin out the Mozilla Foundation.


    In August 2005, serving as Lead Technologist and as a member of the Board of Directors
    of the Mozilla Foundation, Each became CTO of the newly founded Mozilla Corporation,
    meant to be the Mozilla Foundation''s for-profit arm.


    # CEO appointment and resignation


    On March 24, 2014, Eich was promoted to CEO of Mozilla Corporation. His appointment
    sparked controversy over a $1,000 political donation Eich had made in 2008 to
    the successful campaign for California Proposition 8, which sought to establish
    that, "Only marriage between a man and a woman is valid or recognized in California.
    "This was criticized by gay rights activists on Twitter. In the ensuing public
    debate, OKCupid and two gay application developers called for a boycott of the
    company. Others at the Mozilla Corporation spoke out on their blogs in his favor.
    Board members wanted him to stay in the company with a different role.


    On April 3, 2014, Eich stepped down as CEO and resigned from working at Mozilla.
    In his personal blog, Eich posted that “under the present circumstances, I cannot
    be an effective leader.


    Following Eich''s resignation, the National Organization for Marriage called for
    its own boycott of Mozilla, due to “gay activists who have forced him out of the
    company he has helped lead for years".


