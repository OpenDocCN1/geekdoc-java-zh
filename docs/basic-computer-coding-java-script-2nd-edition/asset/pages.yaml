    \ {\n      result += objName + ' ' + i + ' = ' + obj[i] + '\\n';\n    }\n  }\n\
    \  return result;\n}\n```\n\n> The mid-2000s, additional server-side JavaScript\
    \ implementations have been introduced, such as Node.js in 2009.\n\nSo, the function\
    \ call showProps(myCar, \"myCar\") return the following:\n\n+   myCar.make = Ford\n\
