  md: '# 9.7 JAVASCRIPT ONRESIZE EVENT


    The onresize event in JavaScript generally occurs when the window has been resized.
    To get the size of the window, we can use the JavaScript''s window.outerWidth
    and window.outerHeight events. We can also use the JavaScript''s properties as
    innerWidth, innerHeight, clientWidth, clientHeight, offsetWidth to get the size
    of an element.


    In HTML, we can use the onresize attribute and assign a JavaScript function to
    it. We can also use the JavaScript''s addEventListener() method and pass a resize
    event to it for greater flexibility.


    # 9.7.1 Syntax


    Now, we see the syntax of using the onresize event in HTML and in javascript (without
    addEventListener method or by using the addEventListener() method).


    # 9.7.2 In HTML


    ```

    <element onresize = "fun()">

    ```


    # 9.7.3 In JavaScript


    ```

    object.onresize = function() { myScript };

    ```


    # 9.7.4 In JavaScript by using the addEventListener() method


    ```

    object.addEventListener("resize", myScript);

    ```


    Let''s see some of the illustrations to understand the onresize event.


    # Example


    In this example, we are using the HTML onresize attribute. Here, we are using
    the window.outerWidth and window.outerHeight events of JavaScript to get the height
    and width of the window.


    When the resize the the window, the updated width and height of the window will
    be displayed on the screen. It will also display how many times the user tried
    to resize the window. When we change the height of the window, the updated height
    will change accordingly. Similarly, when we change the width of the window, the
    updated width will change accordingly.


    +   1. <!DOCTYPE html>


    ![](img/a67e9007ff8fb6a450e070349689c51f_337_0.png)'
