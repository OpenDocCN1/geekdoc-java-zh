  md: '# JavaScript Events


    Accessibility: You can add the above two events to any element, but it''s better
    to apply it on the items that are usually clicked, or it will not be accessible
    through keyboard navigation. All mouse events discussed below cannot be triggered
    by the keyboard.


    +   - mousedown: It fires when the user clicks down on any mouse button.


    Touch-screen: You can use the touchstart event.


    +   - Mouseup: It fires when the user releases a mouse button.


    Touch-screen: You can use the touchend event.


    We separate mousedown and mouse events to add drag-and-drop functionality or controls
    in game development. Don''t forget a click event is the combination of mousedown
    and mouse events.


    +   - mouseover: It fires when the user moves the cursor, which was outside an
    element, inside the element. We can say that it fires when we move the cursor
    over the element.


    +   - mouseout: It fires when the user moves the cursor, which was inside an element,
    outside the element. We can say that it fires when the cursor moves off the element.


    The mouseover and mouseout events usually change the appearance of graphics on
    our webpage. A preferred alternative is to use the CSS: hover pseudo-class.


    +   - mousemove: It fires when the user moves the cursor around the element. This
    event is frequently triggered.


    # 9.2.4 Keyboard Events


    These events fire on any kind of device when a user interacts with a keyboard.


    +   - input: This event fires when the value of an <input> or a <textarea> changes
    (doesn''t fire for deleting in IE9). You can use keydown as a fallback in older
    browsers.


    +   - keydown: It fires when the user presses any key in the keyboard. If the
    user holds down the key, this event fires repeatedly.


    +   - keypress: It fires when the user presses a key that results in printing
    a character on the screen. This event fires repeatedly if the user holds down
    the key. This event will not fire for the enter, tab, or arrow keys; the keydown
    event would.


    +   - keyup: The keyup event fires when the user releases a key on the keyboard.


    The keydown and keypress event fire before a character appears on the screen,
    the keyup fires after it shows.'
