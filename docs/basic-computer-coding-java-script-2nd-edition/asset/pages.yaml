    ![](img/a67e9007ff8fb6a450e070349689c51f_192_0.png)


    One user registration ends after completing many pages. But how to maintain users’
    session information across all the pages.


    ![](img/a67e9007ff8fb6a450e070349689c51f_192_1.png)


    Cookies were originally invented by Netscape to give ‘memory’ to web servers and
    browsers. The HTTP protocol, which arranges for the transfer of web pages to your
    browser and browser requests for pages to servers, is state-less, which means
    that the server never sent a page to a browser requesting it, it does not remember
    anything about it. So if you come to the same web page a second, hundredth or
    million time, the server once ever came there. This can be annoying in a number
    of ways. The server cannot remember if you identified your user preferences, it
    cannot remember anything. As soon as personalization was invented, this became
    a major problem. Cookies were invented to solve this problem, but cookies are
    easy to maintain and very versatile.


    ![](img/a67e9007ff8fb6a450e070349689c51f_192_2.png)


    > The computer cookie dates back to 1994. In that, it was adapted as a tool for
    the World Wide Web by Leo Montulli from a similar technique, called “magic cookie,”
    which was used in UNIX® systems. This is also the origin of the term itself. It
    was not for another couple of years, however, that the cookies became widely known
    to the general public.


    # 6.1.1 Using Cookies in JavaScript


    Cookies are the name given to the small files your browser stores on your computer,
    which contain information relevant to the sites you have visited in the past.
    Using JavaScript you can write these text files and extract data from them whenever
    your reader returns to your site. Cookies are variables


