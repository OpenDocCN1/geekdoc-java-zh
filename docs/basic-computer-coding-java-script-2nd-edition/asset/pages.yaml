  md: '# 40 Basic Computer Coding: Java Script


    Some aspects of JavaScript syntax and formatting are based on different schools
    of thought. That is, there are stylistic rules or choices that are not mandatory
    and will not result in errors when the code is run. However, there are many common
    conventions that are sensible to follow, as developers between projects and codebases
    will be more familiar with the style. Adhering to common conventions leads to
    improved readability.


    Consider the following three examples of assignment:


    ```

    const greeting="Hello"; // no whitespace between variable & string

    const greeting = "Hello"; // excessive whitespace after assignment

    const greeting = "Hello"; // single whitespace between variable & string

    ```


    All three of the examples above will function exactly the same in the output,
    the third option of greeting = "Hello" is by far the most used, and the most readable
    way of writing code, especially when considering it within the context of a larger
    program. It is important to keep your entire project''s style consistent. From
    one organization to another, you will encounter different guidelines to follow,
    so you must also be flexible. We''ll go over code examples below to familiarize
    yourself with the syntax and structure of JavaScript code.


    # Whitespace


    Whitespace in JavaScript consists of spaces, tabs, and newlines (pressing ENTER
    on the keyboard). As demonstrated, excessive whitespace out of a string and the
    spaces between operators and symbols are ignored by JavaScript. This means the
    following three examples of assignment will have the exact same computed output:


    ```

    const userLocation = "New York City," + "NY";

    const userLocation="New York City,\+NY";

    const userLocation = "New York City", + "NY";

    ```


    userLocation will represent New York City, NY no matter which of these styles
    are written in the script, nor will it make a difference to JavaScript whether
    the whitespace is written with tabs or spaces.


    A good thumb to follow the most common whitespace conventions is to follow the
    same rules as you are used in math and language grammar.


    For example, let x = 5 * y is more readable than let x=5y.


    One notable exception to this style you may see during assignment of multiple
    variables. Note the position of = in the following example:


    ```

    const companyName = "DigitalOcean";

    const companyHeadquarters = "New York City";

    const companyHandle = "digitalocean";

    ```


