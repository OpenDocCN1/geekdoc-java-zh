  md: '# Introduction to JavaScript


    # 1.4.1 JavaScript Build tools and Automation Systems


    Build tools for cross-platform languages like .Net or Java are a usual thing;
    however, using such capabilities with JavaScript can seem ridiculous. Though,
    times change. As soon as developers have started to use JS for large-scale projects,
    they''ve faced the issues with scalability, maintenance, security and general
    performance. This is where build tools can prove to be useful.


    +   * Webpack is one of the latest front-end tools. It is a module bundler that
    creates a dependency graph with all the modules needed by your JavaScript application.
    Webpack packages them into one or several small bundles to be loaded by a browser.
    Beyond that, it is often used as a task runner, because it analyzes dependencies
    between modules and generates assets.


    ![](img/a67e9007ff8fb6a450e070349689c51f_34_0.png)


    +   * Task runners like Grunt are used for one major purpose — automation of repetitive
    and time-consuming tasks. It comes with a huge ecosystem (over 6010 plugins),
    though, currently, JavaScript developers tend to apply more advanced tools.


    +   * Gulp has been released after Grunt, despite the fact that it is another
    task runner, it takes the absolutely different approach, defining tasks as JavaScript
    functions. It updates painful tasks, offering large ecosystem, and provides better
    transparency and control over the processes.


    +   * Browserify allows developers to employ node.js style modules in a browser.
    You define the dependencies and it builds all it into a new JS file. As a result,
    JavaScript files can be included using “require” statements and enable modules—
    import from npm.


    The main idea behind Brunch.io is simplicity and speed. It comes with light configuration
    and detailed documentation for a quick start. Branch automatically creates a source
    map for your JavaScript files, together with CSS stylesheets, simplifying the
    debugging process on the client side.


    +   * Yeoman is a multi-operated tool since it can be used with any programming
    language (JavaScript, Python, C#, etc.). It is a basic scaffolding system for
    web app development with the rich ecosystem (6213 plugins) and ability to create
    the new generators. Yeoman allows developers to quickly create new projects and
    to enhance the maintenance of existing ones.


    3G E-LEARNING'
