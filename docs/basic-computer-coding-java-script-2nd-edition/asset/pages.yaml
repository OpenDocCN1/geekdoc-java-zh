    In the example above: we first create the cookie username=Hans relative to this
    page and the alert confirms this. The next however is defined as a new (!) cookies
    username=John with Path=\ entire domain). The alert now actually shows 2 cookies
    with the same name: username=Hans; So which do we use in our code? In the 3rd
    part we change the value of the relative cookies, for example because we forgot
    to add the path, and guess what things become messy real quick. Here you can see
    how important it can be to properly define the path.


    # 6.2.8 Combining options – A Cookie jar of options


    All these options can be combined in a single line as well, separated by semi
    colons, even when it might make little or no sense:


    document.cookie = "username=Hans;Path=/; Domain=email.example.com; Expires=Sun,
    22 Oct 2017 08:00:00 UTC; Secure; HttpOnly; SameSite=strict;

    alert(document.cookie);


    So this cookie holds the username=Hans value pair, can be used until Sunday October
    22nd, 8 AM UTC (GMT), and only be accessed in the email.example.com domain with
    the path /secretdata, cross use is prohibited (SameSite). HTTPS is required (secure)
    and it is a HTTPOnly cookie (which can only be read by the server).


