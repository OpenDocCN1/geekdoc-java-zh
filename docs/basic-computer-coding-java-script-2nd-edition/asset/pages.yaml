    # Whitespace and Line Breaks


    JavaScript ignores spaces, tabs, and newlines that appear in JavaScript programs.
    You can use spaces, tabs, and newlines freely in your program and you are free
    to format and indent your programs in a neat and consistent way that makes the
    code easy to read and understand.


    # Semicolons are Optional


    Simple statements in JavaScript are generally followed by a semicolon character,
    just as they are in C, C++, and Java. however, allows you to omit this semicolon
    each of your statements are placed on a separate line. For example, the following
    code could be written without semicolons.


    ```

    <script language="javascript" type="text/javascript">

    <!--

    var1 = 10

    var2 = 20

    -->

    </script>

    ```


    When formatted in a single line as follows, you must use semicolons


    ```

    <script language="javascript" type="text/javascript">

    <!--

    var1 = 10; var2 = 20;

    -->

    </script>

    ```


    It is a good programming practice to use semicolons.


    # Case Sensitivity


    JavaScript is a case-sensitive language. This means that the language keywords,
    variables, function names, and any other identifiers must always be typed with
    a consistent capitalization of letters.


    So the identifiers Time and TIME will convey different meanings in JavaScript.


