  md: "# 7.3.4 Enumerate the Properties of an Object\n\nStarting with ECMAScript 5,\
    \ there are three native ways to list/traverse object properties:\n\nfor...in\
    \ loops\n\nThis method traverses all enumerable properties of an object and its\
    \ prototype chain\n\nObject.keys(o)\n\nThis method returns an array with all the\
    \ own (not in the prototype chain) enumerable properties’ (“keys”) of an object\
    \ o.\n\nObject.getOwnPropertyNames(o)\n\nThis method returns an array containing\
    \ all the properties’ names (enumerable or not) of an object o.\n\nBefore ECMAScript\
    \ 5, there was no native way to list properties of an object. However, this can\
    \ be achieved with the following function:\n\n```\nfunction listProperties(o)\
    \ {\n  var objectToInspect;\n  var result = [];\n\n  for(objectToInspect = o;\
    \ objectToInspect != null; {\n    result = result.concat(Object.getOwnPropertyNames(objectToInspect));\n\
    \  }\n\n  return result;\n}\n```\n\nThis can be useful to reveal “hidden” properties\
    \ (properties in the prototype chain which are not accessible through the object,\
    \ because another property has the same name earlier in the prototype chain).\
    \ Listing accessible properties only can easily be done by removing duplicates\
    \ in the array.\n\n![](img/a67e9007ff8fb6a450e070349689c51f_245_0.png)"
