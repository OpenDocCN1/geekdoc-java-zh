  md: '# 5.2 HTML DOM DOCUMENT


    HTML DOM document object is the owner of all other objects in your web page.


    # 5.2.1 The HTML DOM Document Object


    The document object represents your web page.

    If you want to access any element in an HTML page, you always start with accessing
    the document object.

    Below are some examples of how you can use the document object to access and manipulate
    HTML.


    # 5.2.2 Finding HTML Elements


    | Method | Description |

    | --- | --- |

    | document.getElementById(id) | Find an element by element id |

    | document.getElementsByTagName(name) | Find elements by tag name |

    | document.getElementsByClassName(name) | Find elements by class name |


    # 5.2.3 Changing HTML Elements


    | Method | Description |

    | --- | --- |

    | element.innerHTML = new html content | Change the inner HTML of an element |

    | element.attribute = new value | Change the attribute value of an HTML element
    |

    | element.setAttribute(attribute, value) | Change the attribute value of an HTML
    element |

    | element.style.property = new style | Change the style of an HTML element |


    # 5.2.4 Adding and Deleting Elements


    | Method | Description |

    | --- | --- |

    | document.createElement(element) | Create an HTML element |

    | document.removeChild(element) | Remove an HTML element |


