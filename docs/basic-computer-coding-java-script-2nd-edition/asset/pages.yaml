  md: '# What CAN''T in-browser JavaScript do?


    JavaScript''s abilities in the browser are limited for the sake of the user''s
    safety. The aim is to prevent an evil webpage from accessing private information
    or harming the user''s data.


    The examples of such restrictions are:


    +   - JavaScript on a webpage may not read/write arbitrary files on the hard disk,
    copy them or execute programs. It has no direct access to OS system functions.

    - Modern browsers allow it to work with files, but the access is limited and only
    if the user does certain actions, like "dropping" a file into a browser window
    or selecting it via `<input>`.


    +   There are ways to interact with camera/microphone and other devices, but they
    require a user''s permission. A JavaScript-enabled page may not secretly enable
    a web-camera, observe the surroundings and send the information to the NSA.

    - Different tabs/windows generally do not know about each other. Sometimes they
    do, for example when one window uses JavaScript to open the other one. But in
    this case, JavaScript from one page may not access the other if they come from
    different sites (from a different domain, protocol or port).


    This is called the "Same Origin Policy". To work around that, both pages must
    contain a special JavaScript code that handles data exchange.


    The limitation is for user''s safety. A page from http://anysite.com which a user
    has opened must not be able to access another browser tab with the URL http://gmail.com
    and steal information from there.


    +   - JavaScript can easily communicate over the net to the server where the current
    page came from. But its ability to receive data from other sites/domains is crippled.
    Though possible, it requires explicit agreement (expressed in HTTP headers) from
    the remote side. Once again, that''s safety limitations.


    ![](img/a67e9007ff8fb6a450e070349689c51f_54_0.png)'
