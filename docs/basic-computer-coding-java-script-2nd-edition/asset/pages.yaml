  md: "# Java Script: Classes and Objects\n\n# Defining properties for an object type\n\
    \nYou can add a property to a previously defined object type by using the prototype\
    \ property. This defines a property that is shared by all objects of the specified\
    \ type, rather than just one instance of the object. The following code adds a\
    \ color property to all objects of type Car, and then assigns a value to the color\
    \ property of the object car.\n\n```\nCar.prototype.color = null;\ncarl1.color\
    \ = 'black';\n```\n\n# Creating Objects with Constructor Functions\n\nObject literal\
    \ notation, such as var x = [], is preferred if all need a single object and there\
    \ is no need for multiple instances. However, if you need multiple instances,\
    \ it is better to use a constructor function. Here is an example of a book constructor\
    \ function.\n\n+   1. function Book(isbn) {\n2. this.isbn = isbn;\n3. this.getIsbn\
    \ = function () {\n4. return \" + this.isbn;\n5. \n6. }\n\nProperties, including\
    \ methods, are assigned to the 'this' value in the function's body. In the above\
    \ example a property and function are assigned. Also notice that this function\
    \ is capitalized (i.e. Book); constructor functions are capitalized by convention\
    \ in JavaScript\n\nTo create a new object with this function you use the new operator\
    \ by function invocation. A function that is invoked this way is called a constructor\
    \ function whose main purpose is to initialize a new object. Here we are creating\
    \ a new book:\n\n+   1. var book = new Book(\"901-3865\");\n2. alert(book.getIsbn());\
    \ // => Isbn is 901-3865\n\nWhen Book() is invoked, JavaScript creates an empty\
    \ Object and sets an internal property which specifies the new object's prototype\
    \ to Book, that is, the newly created object inherits the prototype of the function.\
    \ It passes the Book() function two arguments: object as this (a hidden parameter)\
    \ and the \"901-3865\" as isbn. The function, in turn, sets the object's isbn\
    \ property to \"901-3865\" and also adds the getIsbn() method to the object. JavaScript\
    \ returns the newly created object to the caller which assigns the new object\
    \ to the book variable.\n\n![](img/a67e9007ff8fb6a450e070349689c51f_250_0.png)"
