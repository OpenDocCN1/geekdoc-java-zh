    # 9.2 JAVASCRIPT EVENT TYPES


    These are the top 8 types of JavaScript Event discussed below:


    # 9.2.1 User Interface Events


    These occur as the result of any interaction with the browser window rather than
    the HTML page. In these events, we attach the event listener to the window object,
    not the document object. The various UI events are as follows.


    +   - load: The event fires when the webpage finishes loading. It can also fire
    on nodes of elements like images, scripts, or objects.

    - unload: This event fires before the users leave the page, i.e., the webpage
    is unloading. Page unloading usually happens because a new page has been requested.

    - error: This event fires when the browser encounters a JavaScript error or an
    asset that doesn''t exist.

    - resize: It fires when we resize the browser window. But browsers repeatedly
    fire this event, so avoid using this event to trigger complicated code; it might
    make the page responsive.

    - scroll: This event fires when the user scrolls up/down the browser window. It
    can relate to the entire page or a specific element on the page.


    # 9.2.2 Focus and Blur Events


    These events fire when the HTML elements you can interact with gain/lose focus.
    They are most commonly used in forms and especially helpful when you want to do
    the following tasks:


    ![](img/a67e9007ff8fb6a450e070349689c51f_306_0.png)'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'To show tips or feedback to users as they interact with an element within a
    form. The tips are usually shown in the elements other than the one the user is
    interacting with.


    To trigger form validation as a user moves from one control to the next without
    waiting to submit the form. The different focus and blur events are as follows:


    +   - focus: This event fires, for a specific DOM node, when an element gains
    focus.

    - blur: This fires, for a specific DOM node, when an element loses focus.

    - focusin: This event is the same as the focus event. But Firefox doesn''t support
    the focusin event.

    - focusout: This is the same event as the blur event. This is a new event type
    in JavaScript, thus not supported in Firefox right now.


    The focus and blur events use the capture approach, while both capture and bubble
    approach of the event flow.


    # 9.2.3 Mouse Events


    Keyword Touchscreen of the assembly of both an input (''touch panel'') and output
    (''display'') device.


    These events fire when the mouse moves or the user clicks a button. All the elements
    of the page support these events and use the bubbling approach. These actions
    work differently on touchscreen devices. Preventing the default behavior of mouse
    events can cause unexpected results. The various mouse events of JavaScript are
    as follows:


    +   - click: This event fires when the user clicks on the primary mouse button
    (usually the left button). This event also fires if the user presses the Enter
    key on the keyboard when an element has focus.

    - Touch-screen: A tap on the screen acts like a single left-click.

    - dblclick: This event fires when the user clicks the primary mouse button, in
    quick succession, twice.

    - Touch-screen: A double-tap on the screen acts like a double left-click.


    ![](img/a67e9007ff8fb6a450e070349689c51f_307_0.png)'
