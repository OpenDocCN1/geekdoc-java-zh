    Spaghetti code is easily avoided once we know how to avoid it. The problem is
    things get really messy when you connect things together. And an application is
    ultimately all connecting pieces of code to each other. But if we connect all
    the pieces to all the other pieces, suddenly you can''t move anything around anymore.


    # Separation of Concerns


    We can separate our code into fundamentally different pieces. No matter how the
    size of the application


    +   Model: All the data is stored here which includes data from the server and
    the user.


    +   View: This is all stuff user sees and interacts with includes DOM elements,
    input elements, buttons and images. This is user''s interface to the application
    both for giving and ready data.


    +   Controller: Connects Model and View. Controller provides the separation of
    concerns that are needed when we''re building applications. This holds things
    together but also keeps them separate to allow changes in individual pieces without
    disturbing the real i.e., view can be changed without disturbing the model or
    we can change the way we store data in the model without disturbing the view.


