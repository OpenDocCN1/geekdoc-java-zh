  md: '# SUMMARY


    +   - The JavaScript interacts with the documents HTML code using *events*, which
    are triggered when a particular moment of interest happens in the document or
    the browser window.


    +   - JavaScript Events makes the webpages interactive and responsive. These events
    are *asynchronous* (ie can occur anytime).Most events are triggered by user action
    but there are some exceptions like the event *load*


    +   - When an error occurs there are some fault which the browser takes(like clicking
    on a link over the location specified in attribute *href*). An event may be a
    click, mouseover, keystroke etc.


    +   - The change in the state of an object is known as an Event. In HTML, there
    are various events which represent some activity is performed by the user or by
    the browser. When javascript code is included in HTML, js react over these events
    and allow the execution. Process of reacting over the events is called Event Handling.
    Thus, js handles the HTML events via Event Handlers.


    +   - TheaddEventListener() method is used to attach an event handler to a particular
    element. It does not override the existing event handlers. Events are said to
    be an essential part of the JavaScript. A web page responds according to the event
    occurred. Events can be user-generated or generated by API. An event listener
    is a JavaScript''s procedure that waits for the occurrence of an event.


    +   - The onclick event generally occurs when the user clicks on an element. It
    allows the programmer to execute a JavaScript''s function when an element gets
    clicked. This event can be used for validating a form, warning messages and many
    more.


    +   - The dblclick event generates an event on double click. The event fires when
    an element is clicked twice in a very short span of time. We can also use the
    JavaScript''s addEventListener() method to find the double click event.


    +   - The onload attribute fires when an element has been loaded. The purpose
    of this attribute is to execute a script when the associated element loads.


    +   - The onload attribute is generally used with the <body> to execute a script
    once before the content (using CSS files, images, scripts, etc.) of the webpage
    is completely loaded. It is not necessary to use it only with <body> tag, as it
    can be used with other HTML elements.


    +   - The onresize event in JavaScript generally occurs when the window has been
    resized. To get the size of the window, we can use the JavaScript''s window.outerWidth
    and window.outerHeight events. We can also use the JavaScript''s properties such
    as innerWidth, innerHeight, clientWidth, clientHeight, offsetWidth, offsetHeight
    to get the size of an element.


    ![](img/a67e9007ff8fb6a450e070349689c51f_346_0.png)'
  merge: -1
