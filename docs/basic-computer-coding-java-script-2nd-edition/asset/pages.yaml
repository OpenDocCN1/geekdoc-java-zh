  md: '# Example Explained


    This code creates a new <p> element;

    var para = document.createElement("p");


    To add text to the <p> element, you must create a text node first. This code creates
    a text node:


    var node = document.createTextNode("This is a new paragraph.");

    Then you must append the text node to the <p> element:

    para.appendChild(node);


    Finally you must append the new element to an existing element.

    This code finds an element:


    var element = document.getElementById("div1");

    This appends the new element to the existing element;

    element.appendChild(para);


    # 5.10.2 Creating new HTML Elements - insertBefore


    The appendChild() method in the previous example, appended the new element as
    the last child of the parent.

    If you don''t want that you can use the insertBefore() method:


    # Example


    ```

    <div id="div1">

    <p id="p1">This is a paragraph. </p>

    <p id="p2">This is another paragraph. </p>

    </div>

    <script>

    var para = document.createElement("p");

    var node = document.createTextNode("This is a new.");

    para.appendChild(node);


    var element = document.getElementById("div1");

    var child = document.getElementById("p1");

    element.insertBefore(para, child);

