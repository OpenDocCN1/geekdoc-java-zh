- img_proc: true
  md: 'Now refreshing the cookies in the web developer tools should not show a cookie,
    neither does the "alert()" ... which is correct. The cookie exists, but we are
    just not allowed to access it with JavaScript.


    # 6.2.5 SameSite Cookie – A Cookie only for this website


    SameSite prevents the browser from sending this cookie along cross-site requests.
    The main goal is mitigate the risk of cross-origin information leakage. It also
    provides some protection against cross-site request forgery attacks. SameSite
    cookies, if supported by the browser, knows two variants: strict and lax. Here
    strict is the preferred setting, since it closes down all domain access.


    ```

    document.cookie = "username=Hans; SameSite = strict";

    alert(document.cookie);

    ```


    When you want to allow "some" cross domain access:

    document.cookie = "username=Hans; SameSite = lax";

    alert(document.cookie);


    This is again a tricky one, it might only show something with your local web-server.
    A file or JSFiddle might not show anything in the "alert()", but the web developer
    tools will show that the cookie actually exists.


    # 6.2.6 Cookie Domain – For Cookies that are only for a specific domain


    The cookie domain is an important security feature, perhaps even more important
    than the secure flag. It tells the browser that this cookie must only be sent
    to matching domains. We can define a domain and path in which a cookie can be
    accessed. To limit a cookie to a certain domain, you can try the following examples.
    The first one will use a random domain, example.com. The second example will use
    the domain jshell.net – which is the domain used by JSFiddle.


    > Note: when entering "example.com" as the domain, the cookie can only be accessed
    from that exact domain, but not from sub domains. When adding a period in front
    of the domain, for "example.com" then the cookie can be accessed from sub domains
    as well (e.g. forum.example.com, email.example.com, www.example.com, etc).


    ```

    document.cookie = "username=Hans; domain = .example.com";

    alert(document.cookie);

    ```


    You will notice that there is no cookie and the alert is not showing anything
    either – which is correct since we are not allowed access to these cookies, we
    are working in the wrong domain (not example.com).


