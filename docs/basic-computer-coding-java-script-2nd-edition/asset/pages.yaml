  md: '# Basic Computer Coding: Java Script


    The name-value pair part of the entry is very similar to declaring a variable
    – when you want to retrieve information you ask for the value that is associated
    with a name that you provide. The expiry date is expressed in an unfriendly UTC
    format; though fortunately there are methods for generating a suitable date. If
    a date is not set, the entry is deleted when you close your browser.


    The domain and path that you associate your cookie with have to be part of the
    same domain that your site belongs to. For instance, you can set your cookie to
    be active for www.yourhtmlsource.com, the default; or yourhtmlsource.com, which
    will cover and all subdomains you set up for the site. You cannot, however, set
    it to yahoo.com, for obvious security reasons. Using the path you can restrict
    a cookie to be valid for a certain directory. Usually you will want it to be available
    to any page in the domain, if it is set to /, the root directory.


    # 6.1.3 Setting, Reading and Erasing Cookies


    The document has an object in JavaScript called document.cookie, which is used
    to read and retrieve cookie data. It is a repository of Strings (though not an
    array). You can create new entries, read an existing name-value pair, or erase
    an entry through JavaScript. To create a cookie for your site, you write


    ```

    document.cookie =

    "value1=Yes; expires=Fri, 13 Jul 2004 05:28:21 UTC; path="/"

    ```


    The whole entry is supplied as one String with segments set apart by semicolons
    – first the name-value pair, then the expiry date in the correct format, and finally
    the path. This syntax is fixed, and you should not be rearranging the elements.
    Write this entry. To test out the cookie''s contents, you can use a simple script
    like alert(document.cookie);


    Which will yield this result. You may see another value in there, which is used
    by our StyleSheet-switcher. We can write another entry to the cookie, using a
    different name, as so:


    ```

    document.cookie =

    "value2=Nah; expires=Fri, 13 Jul 2004 05:28:21 UTC; path="/"

    ```


    Checking the cookie''s contents now, we can see that our first value is still
    in there. Had we used the same name, the new entry has been overwritten; but since
    we used a different name, the new entry has been added with the first.


    Erasing cookie entries is easy – just set a new value and give an expiry before
    today, as in


    ```

    document.cookie =

    "value2=Whatever; expires=Fri, 13 Jul 2001 05:28:21 UTC; path="/"

    ```


