  md: '# CASE STUDY


    # DOCUMENT OBJECT MODEL


    The history of the Document Object Model, known as the DOM, is tightly coupled
    with the beginning of the JavaScript and JScript scripting languages.


    # JavaScript


    The LiveScript language was designed at Netscape Communications to make the Java
    support more accessible to non-Java programmers. LiveScript, like any scripting
    language, is a loosely-typed language. It is intended for a large audience of
    Web designers and developers.


    In 1995, LiveScript was renamed JavaScript and released as part of Netscape Navigator
    2.0. For marking purposes, JavaScript has nothing to do with the Java language
    developed and maintained by Sun Microsystems. The Web community started then to
    manipulate the content of Web documents, in order to bring interactivity and typography
    to the formerly static Web.


    # JScript


    In July 1996, Microsoft released Internet Explorer 3.0 with a port of JavaScript
    called JScript.


    # ECMAScript


    In June 1997, ECMA adopted a hybrid version of the scripting languages called
    ECMAScript. The International Organization for Standardization (ISO) followed
    suit in 1998. ECMAScript arrived too late for the 4.0 releases of Netscape Navigator
    and Internet Explorer. Each introduced their own document object model, DHTML
    and dHTML, that came to be called Dynamic HTML.


    ECMA-262, released in 1999, is still not followed by Microsoft and their Internet
    Explorer. Netscape claims to support ECMA-262 in Netscape Navigator versions 6
    and 7.


    # The World Wide Web Consortium


    In 1994, Tim Berners-Lee, inventor of the World Wide Web, created the World Wide
    Web Consortium (W3C) to lead the Web to its full potential. At the beginning of
    1997, the companies involved in this consortium — including Netscape Communications


    ![](img/a67e9007ff8fb6a450e070349689c51f_183_0.png)'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'and Microsoft — decided to find a consensus around their object models to access
    and manipulate documents. While trying to stay as backward compatible as possible
    with the original browser object models, the W3C’s Document Object Model (DOM)
    provided a better object representation of HTML documents.


    # HTML and XML


    In 1996, a new markup language, the Extensible Markup Language (XML), was developed
    in the W3C as well. Meant to remove the HTML language’s extensibility restrictions,
    the idea of developing an object model for XML quickly became another goal of
    the DOM effort.'
