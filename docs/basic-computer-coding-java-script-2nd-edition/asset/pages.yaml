  md: '# Basic Computer Coding: Java Script


    enable the cookie notice.


    20 things you did not know about cookies (for programmers)


    +   1. All cookies have an expiry time. A cookie that has expired in the past
    will be deleted once the web browser is closed. Cookies can also be deleted explicitly.

    2. It is this behavior that leads to ‘session cookies’. Session cookies have no
    actual definition beyond that they are expired in the past from the very time
    they are created. The emergent behavior is that they act as temporary cookies,
    existent only for a browser session.

    3. Session cookie XSS prevention security is lost if web tabs are used: the cookies
    do not expire because the browser is never closed.

    4. Cookie expiry time is measured in GMT UNIX timestamp seconds, hence client/server
    time is theoretically the same – but care is needed as computer clocks may be
    fast/slow

    5. A third-party cookie is a cookie that is set onto a domain name that the main
    page document cannot read. This is possible because images on other servers, and
    these images may themselves set cookies (any URL generate cookies). Some browser
    privacy settings disable.

    6. While cookies are sometimes disabled by privacy concerns, session cookies are
    usually allowed as an exception – so it is not the end of the world if session
    cookies are required – but it is better to be able to store IDs in the URL. Most
    popular websites do require cookies to be enabled though (Tesco.com, New York
    Times, ...).

    7. Full cookie data is sent with all web requests that the cookies are scoped
    under, even image requests – so it is inefficient to store a lot of cookies.

    8. Cookies must be set against a domain name. This is either done by putting .domain
    as the cookie domain, or by leaving the domain blank when setting the cookie;
    the domain should never be defined as domain as it not work properly.

    9. Cookies work with an elaborate but confusing precedence system. Only cookies
    underneath a matched domain/path combination will be sent to a server URL (for
    privacy reasons), and they be given precedence based ‘most specific gets priority’.
    To change a cookie the server must set it against the domain/path combination
    it created with. The variables a cookie defined under are not available server-side,
    which means that anyone modifying the cookie must know these in advance, or guess
    wildly.

    10. There is legitimate privacy concern with cookies when ads are concerned. Banner
    rotations run from centralized sites, and hence have the ability to


    ![](img/a67e9007ff8fb6a450e070349689c51f_205_0.png)'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'effectively track users from this centralised site but with regard any site
    that they visit that uses the rotation. Nevertheless, such tracking could happen
    regardless of cookies, by server logging and cross-server messaging – so blaming
    cookies is simplistic.


    +   11. Microsoft made a great extension to Netscape''s original cookie spec,
    allowing ''HTTP only'' cookies (JavaScript cannot read). Use of prevents XSS vulnerabilities.


    +   12. At the protocol level, cookies are sent to the server in a single Cookie
    HTTP header, but from the server using Individual Set-Cookie headers.


    +   13. Cookies store just name and values, and never any data that a web server
    or normal JavaScript would not be able to discern – because it is the web server
    or browser that sets the cookie.


    +   14. JavaScript provides its cookie support by a virtual variable,document.cookie.
    The variable can be set and read, but the process is not actually direct.


    +   15. A common server-side coding mistake is to set a cookie and refer to the
    cookie value within the same server – yet the cookie would not have activated
    until the response had been sent.


    +   16. Some servers (including Apache) restrict cookie data length, refusing
    to server data if the length is exceeded.


    +   17. Cookies should not contain certain special characters ‘=’ as these have
    special meanings within HTTP and there is no standard escaping mechanism for cookie
    names. (Unexpected bugs may happen if you attempt to set such cookies)


    +   18. Cookies were invented by Netscape, by the usual bodies (the IETF or W3C).


    +   19. On some web servers it is not possible to set a cookie at the same time
    as doing an HTTP redirect.


    +   20. The name ‘cookie’ was given for no particular reason, but it is the origin
    of endless bad jokes.


    # 6.1.7 Advantages and Disadvantages of using Cookies


    A cookie is a small bit of text that accompanies requests and pages as they go
    between the Web server and browser.


    # Advantages of using cookies


    Here are some of the advantages of using cookies to store session state.


    +   - Cookies are simple to use and implement.


