  md: '# 7.3.3 Working with Objects


    JavaScript is designed on a simple object-based paradigm. An object is a collection
    of properties, and a property is an association between a name (or key) and a
    value. A property value can be a function, in which case the property is known
    as a method. In addition to objects that are predefined in the browser, you can
    define your own objects. This chapter describes how to use objects, properties,
    functions, methods, and how to create your own objects.


    # Objects overview


    Objects in JavaScript, just as in many other programming languages, can be compared
    to objects in real life. The concept of objects in JavaScript can be understood
    with real life, tangible objects.


    In JavaScript, an object is a standalone entity, with properties and type. Compare
    it with a cup, for example. A cup is an object, with properties. A cup has a color,
    a design, weight, a material it is made of, etc. The same way JavaScript objects
    have properties, which define their characteristics.


    ![](img/a67e9007ff8fb6a450e070349689c51f_242_0.png)


    # Objects and Properties


    A JavaScript object has properties associated with it. A property of an object
    can be explained as a variable that is attached to the object. Object properties
    variables are basically the same as ordinary variables, except for the attachment
    to objects. The properties of an object define the characteristics of the object.
    You access the properties of an object with a


    > An operating system (OS) is system software that manages computer hardware and
    software resources and provides common services for computer programs.


    +   - simple dot notation


    ```

    objectName.propertyName

    ```


    Like all JavaScript variables, the object name (which could be a normal variable)
    and property name are case sensitive. You can define a property by assigning it
    a value. For example, let''s create an object named myCar and give it properties
    named make, model, and year as follows:


    ```

    var myCar = new Object();

    ```


