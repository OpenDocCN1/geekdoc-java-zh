  md: 'each node is an object representing a part of the document. The DOM represents
    a document with a logical tree. Each branch of the tree nodes contains objects.
    DOM methods allow programmatic access to the tree; with them one can change the
    structure, style or content of a document. Nodes can have event handlers attached
    to them. Once an event is triggered, the event handlers get executed.


    ![](img/a67e9007ff8fb6a450e070349689c51f_155_0.png)


    The principal standardization of the DOM was handled by the World Wide Web Consortium
    (W3C), which last developed a recommendation in 2004. WHATWG took over the development
    of the standard, publishing it as a living document. The W3C now publishes stable
    snapshots of the WHATWG standard.


    # # 5.1 HTML DOM METHODS


    HTML DOM methods are actions you can perform (on HTML Elements).


    HTML DOM properties are values (of HTML Elements) that you can set or change.


    # ## 5.1.1 The DOM Programming Interface


    The HTML DOM can be accessed with JavaScript (and other programming languages).


    In the DOM, all HTML elements are defined as objects. The programming interface
    is the properties and methods of each object.


    ![](img/a67e9007ff8fb6a450e070349689c51f_155_1.png)


    The innerHTML property can be used to get or change any HTML element, including
    <html> and <body>.


