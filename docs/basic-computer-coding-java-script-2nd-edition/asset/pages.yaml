  md: '# SUMMARY


    +   - JavaScript classes, introduced in ECMA Script 2015, are primarily JavaScript
    classes, introduced in ECMA Script 2015, are primarily syntactic sugar over JavaScript''s
    existing prototype-based inheritance. The class syntax does not introduce a new
    object-oriented inheritance model to JavaScript. JavaScript is a very flexible
    object-oriented language when it comes to syntax.


    +   - Classes are in fact "special functions", and just as you can define function
    expressions and function declarations, the class syntax has two components: class
    expressions and class declarations.


    +   - A expression is another way to define a class. Class expressions can be
    named or unnamed.


    +   - The body of a class is the part that is in curly brackets []. This is where
    you define class members, such as methods or constructor.


    +   - The static keyword defines a static method for a class. Static methods are
    called without instantiating their class and cannot be called through a class
    instance. Static methods are often used to create utility functions for an application.


    +   - A constructor is a function that creates and initializes an object. JavaScript
    provides a special constructor function called Object() to build the object. The
    return value of the Object() constructor is assigned to a variable.


    JavaScript is designed on a simple object-based paradigm. An object is a collection
    of properties, and a property is an association between a name (or key) and a
    value. A property''s value can be a function, in which case the property is known
    as a method.d.


