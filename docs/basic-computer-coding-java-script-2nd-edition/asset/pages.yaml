    on the spatial layout and connections between symbols (which may be textual or
    graphical).


    +   - JavaScript is a case-sensitive language. JavaScript keywords, variables,
    functions, and any other identifiers must be typed with a consistent capitalization
    of letters.


    +   - The modern JavaScript is a “safe” programming language. It does not provide
    low-level access to memory or CPU, because it was initially created for browsers
    which do not require it.


    +   - JavaScript''s abilities in the browser are limited for the sake of the user''s
    safety. The aim is to prevent evil webpage from accessing private information
    or harming the user''s data.


    +   - The name of a variable, function, or property is known as an identifier
    in JavaScript. Identifiers consist of letters and numbers, but they cannot include
    any symbol outside of $ and _ and cannot begin with a number.


    +   - JavaScript is a rich and expressive language in its own right. While it
    will be of particular value to people with no programming experience, even people
    who have used other programming languages may benefit from learning some of the
    peculiarities of JavaScript.


    +   - JavaScript operators are used to assign values, compare values, perform
    arithmetic operations, and more.


    +   - Arrays are zero-indexed lists of values. They are a way to store a set of
    related items of the same type (such as strings), though in reality, an array
    can include multiple types of items, including other arrays.


    +   - “Scope” refers to the variables that are available to a piece of code at
    a given time. A lack of understanding of scope can lead to frustrating debugging
    experiences.


