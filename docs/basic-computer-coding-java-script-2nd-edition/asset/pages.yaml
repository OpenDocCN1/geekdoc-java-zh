  md: '# Basic Computer Coding: Java Script


    2nd Edition


    JavaScript is a programming language that is primarily used by Web browsers to
    provide users with a dynamic and interactive experience. The majority of the functions
    and applications that make the Internet indispensable in modern life are written
    in JavaScript. While JavaScript is not the only client-side-side scripting language
    available on the Internet, it was one of the first and remains the most popular.
    Enterprising programmers have created JavaScript libraries, which are more concise
    languages built from JavaScript building blocks that are less complex and can
    be targeted for specific applications. JavaScript has become integral to the Internet
    experience as developers build interaction and complexity into their applications.
    Search engines, ecommerce, content management systems, responsive design, social
    media and phone apps would not be possible without it.


    This edition contains nine chapters. Information is completely revised and new
    chapters are added. This book provides clear guidance on how to use writing JavaScript.
    A guide for beginners offers an overview of JavaScript basics and explains how
    to create Web pages, identify browsers, and integrate sound, graphics, and animation
    into Web applications.'
