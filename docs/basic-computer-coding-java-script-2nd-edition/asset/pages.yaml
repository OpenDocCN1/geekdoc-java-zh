  md: '# Basic Computer Coding: Java Script


    # Using a constructor function


    Alternatively, you can create an object with writing these two steps:


    +   - Define the object type by writing constructor function. There is a strong
    convention, with good reason, to use a capital initial letter.


    +   - Create an instance of the object with new.

    To define an object type, create function for the object type that specifies its
    name, properties, and methods. For example, suppose you want to create an object
    type for cars. You want this type of object to be called Car, and you want it
    to have properties for make, model, and year. To do this, you would write the
    following function:


    ```

    function Car(make, model, year) {

    this.make = make;

    this.model = model;

    this.year = year;

    }

    ```


    Notice the use of this to assign values to the object''s properties based on the
    values passed to the function.


    Now you can create an object mycar as follows:


    ```

    var mycar = new Car(''Eagle'', ''Talon TSi'', 1993);

    ```


    This statement creates mycar and assigns it the values for its properties. The
    value of mycar.make is the string ''Eagle'', mycar.year is the integer 1993, and
    so on.

    You can create any number of Car objects by calls to new. For example:


    ```

    var kscar = new Car(''Nissan'', ''300ZX'', 1992);

    var vpgscar = new Car(''Mazda'', ''Miata'', 1990);

    ```


    An object can have a property that is itself another object. For example, suppose
    you define an object called person as follows:


    ```

    function Person(name, age, sex) {

    this.name = name;

    this.age = age;

    ```


