  md: '# Basic Computer Coding: Java Script


    If you would prefer to not use the browsers developer tools, you could also use
    an alert, which would look something like this:


    ```

    document.cookie = "username=Hans";nalert(document.cookie);

    ```


    The result should be a popup, showing something like this:


    ![](img/a67e9007ff8fb6a450e070349689c51f_209_0.png)


    Alright then we have the basics kind-under a control, so now time to do more advanced
    things by adding options. These options are stored as value pairs as well, in
    the same document.cookie property. Let''s go through them one at a time.


    Sessions have the following advantages over conventional


    +   - they allow remembering of guests

    - they can be used to force explicit logic for a member

    - they can be used even when cookies are disabled


    Note that IP addresses could never be used instead of sessions because and a single
    user''s dynamic IP address may often change. Composr has an added layer of security,
    in that it only allows a session cookie to work if it was created for a similar
    IP address; this reduces the security risk of ''session stealing'' if a hacker
    somehow managed to find another user''s session (which should not be possible
    in itself).


    # 6.2.2 Persistent Cookie – A Cookie that survives the browser


    A persistent cookie is a data file capable of providing websites with user preferences,
    settings and information for future visits. Persistent cookies provide convenient
    and rapid access to familiar objects, which enhances the user experience (UX).
    A persistent cookie is also known as a stored or permanent


