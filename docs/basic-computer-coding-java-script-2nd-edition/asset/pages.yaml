  md: '# 9.4 JAVASCRIPT ONCLICK EVENT


    The onclick event generally occurs when the user clicks on an element. It allows
    the programmer to execute a JavaScript’s function when an element gets clicked.
    This event can be used for validating a form, warning messages and many more.


    Using JavaScript, this event can be dynamically added to any element. It supports
    all HTML elements except <html>, <head>, <title>, <style>, <script>, <base>, <iframe>,
    <body>, <br>, <meta>, and <param>. It means we cannot apply the onclick event
    on the given tags.


    In HTML, we can use the onclick attribute and assign a JavaScript function to
    it. We can also use the JavaScript’s addEventListener() method and pass a click
    event to it for greater flexibility.


    # 9.4.1 Syntax


    Now, we see the syntax of the onclick event in HTML and in javascript (without
    addEventListener method) or by using the addEventListener() method).


    # 9.4.2 In HTML


    ```

    <element onclick="fun()">

    ```


    # 9.4.3 In JavaScript


    ```

    object.onclick = function() { myFunction };

    ```


    # 9.4.4 In JavaScript by using the addEventListener() method


    ```

    object.addEventListener("click", myScript);

    ```


