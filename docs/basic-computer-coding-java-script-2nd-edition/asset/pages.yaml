    # 7.3.2 Object Methods


    Methods are the functions that let the object do something or let something be
    done to it. There is a small difference between a function and a method – a function
    is a standalone unit of statements and a method is attached to an object and can
    be referenced by this keyword.


    Methods are used for everything for displaying the contents of the object to the
    screen performing complex mathematical operations on a group of local properties
    and parameters.


    **Example** Following is a simple example to show how to use the write() method
    of object to write any content on the document.

    document.write("This is test");


    # User-Defined Objects


    All user-defined objects and built-in objects are descendants of an object called
    Object.


    # The new Operator


    The new operator is used to create an instance of an object. To create an object,
    the new operator is followed by the constructor method.


    In the following, the constructor methods are Object(), Array(), and Date(). These
    constructors are JavaScript functions.


    ```

    var employee = new Object();

    var books = new Array("C++", "Perl", "Java");

    var day = new Date("August 15, 1947");

    ```


    # The Object() Constructor


    A constructor is a function that creates and initializes an object. JavaScript
    provides a special constructor called Object() to build the object. The return
    value of the Object() constructor is assigned to a variable.


    The variable contains a reference to the new object. The properties assigned to
    the object are not variables and not defined with the var keyword.


    Example 1


    Try the following example; it demonstrates how to create an Object.


