  md: '# ROLE MODEL


    # DOUGLAS CROFORD


    Douglas Crock is an American computer programmer and entrepreneur who is involved
    in the development of the JavaScript language. He popularized the data format
    JSON (JavaScript Object Notation), and has developed various JavaScript related
    tools such as JLint and JSMin. He was a senior JavaScript architect at PayPal
    until 2019, and is also a writer and speaker on JavaScript, JSON, and related
    web technologies.


    ![](img/a67e9007ff8fb6a450e070349689c51f_344_0.png)


    # Education


    Crockford earned a degree in Radio and Television from San Francisco State University
    in 1975. He took classes in FORTRAN and worked with a university lab''s computer.


    # Career


    Crockford purchased an Atari 8-bit computer in 1980 and wrote the game Galalahad
    and the Holy Grail for the Atari Program Exchange (APX), which resulted in Chris
    Crockford hiring him at Atari, Inc. While at Atari, Crockford wrote another game,
    Burgers!, for APX and a number of experimental audio/visual demos that were freely
    distributed.


    After Warner Communications sold the company, he joined National Semiconductor.
    In 1984 Crockford joined Lucasfilm, and later Paramount Pictures. He became known
    on video game oriented listservers in the early 1990s after he posted his memoir
    “The Exurgation of Maniac Mansion” to a videogaming bulletin board. The memoir
    documented his efforts to censor the computer game Maniac Mansion to Nintendo''s
    satisfaction that they could release it as a cartridge, and Crockford''s mounting
    frustrations as Nintendo''s demands became obscure and confusing.


    With sandy Farmer and Chip Morningstar, Crockford founded Electric Communities
    and was its CEO from 1994 to 1995. He was involved in the development of the programming
    language E.'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'Crockford was the founder of State Software (also known as Veil Networks) and
    its CTO from 2001 to 2002.


    During his time at State Software, Crockford popularized the JSON data format,
    based on existing JavaScript language constructs, a lightweight alternative to
    XML. He obtained the domain name json.org in 2002, and put up his description
    of the format there. In July 2006, he specified the format officially, as RFC
    4627.


    # "Good, not Evil"


    In 2002, in reference to President George Bush''s war on "evildoers", Crockford
    started releasing JSON under a custom license, which he created by adding the
    requirement "The Software shall be used for Good, not Evil" to the open source
    MIT License. This software was hosted on Google Code until December 2009 when,
    due to the additional clause, Google determined that the license was not compliant
    with the definition of free and open source software, which does not permit any
    restriction on how software may be used. JSON-PHP was forced to migrate to a new
    hosting provider.


    Crockford''s license has caused problems for some open source projects who mistook
    the license for an open source variant of the MIT license. Affected open source
    developers have asked Crockford to change the license, but he has continued to
    use it. He has, however, granted "IBM, its customers, partners, and minions" permission
    to use JSLint for evil", a solution which appeared to satisfy IBM''s lawyers.


    # In Media


    # Books


    +   - Crockford is listed in the acknowledements of the 1995 hardcover edition
    of The Diamond Age, by Neal Stephenson as Douglas (Carl Hollywood) Crockford.'
