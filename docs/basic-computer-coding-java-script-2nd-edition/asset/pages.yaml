  md: '# 9.3.2 Parameter Values


    event: It is a required parameter. It can be defined as a string that specifies
    the event''s name.


    function: It is also a required parameter. It is a JavaScript function which responds
    to the event occur.


    useCapture: It is an optional parameter. It is a Boolean type value that specifies
    whether the event is executed in the bubbling or capturing phase. Its possible
    values are true and false. When it is set to true, the event handler executes
    in the capturing phase. When it is set to false, the event handler executes in
    the bubbling phase. Its default value is false.


