  md: "In the screenshot above, the left column is built without box-sizing, while\
    \ the right column uses this property with the value border-box. Notice how this\
    \ lets us ensure that all of the elements occupy the same amount of space, despite\
    \ the platform's default rules for each kind of widget.\n\n# 4.3.4 Positioning\n\
    \nPositioning of HTML form widgets is generally not a problem; however, there\
    \ are two elements you should take special note of:\n\n# legend\n\nThe <legend>\
    \ element is okay to style, except for positioning. In every browser, the <legend>\
    \ element is positioned on top of the top border of its <fieldset>parent. There\
    \ is absolutely no way to change it to be positioned within the HTML flow, away\
    \ from the top border. You can, however, position it absolutely or relatively,\
    \ using the position property. But otherwise it is part of the fieldborder. Because\
    \ the <legend> element is very important for accessibility reasons, it will be\
    \ spoken by assistive technologies as part of the label of each form element inside\
    \ the fieldset, it's quite often paired with a title, and then hidden in an accessible\
    \ way.\n\n# textarea\n\n```\nHTML\n<fieldset>\n  <legend>Hi!</legend>\n  <h1>Hello</h1>\n\
    </fieldset>\nCSS\nlegend {\n  width: 1px;\n  height: 1px;\n  overflow: hidden;\n\
    }\n```\n\n![](img/a67e9007ff8fb6a450e070349689c51f_138_0.png)"
