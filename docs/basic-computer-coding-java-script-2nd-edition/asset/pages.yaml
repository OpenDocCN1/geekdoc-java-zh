  md: 'Cookies can be used in many ways. Now you know how to create your own Hellobar.
    You could take it step further and figure out how to authenticate users (remember
    login details) and save entire sessions in the cookies (sign up process does not
    get lost in case you refresh the page).


    # 6.1.6 Privacy and Legislation


    Cookies can only be read by the site that created them, or a site ''underneath''
    the site they created. This prevents other websites from stealing cookies. When
    cookies were fairly new, there was a lot of controversy about their ability to
    track users browsing ''around the web''. This is not really the case, due to sites
    only being able to read their own cookies; however, for affiliated companies,
    such as advertising companies, it is true that cookies could be placed in banners
    that any site showing a banner could add the banner company in tracking every
    website the banner viewer visited on their network.


    > Privacy is the ability of an individual or group to exclude themselves, or information
    about themselves, and thereby express themselves selectively.


    Therefore as paranoid users may feel the need to disable their cookies, Composer
    does not require them: session details may be relayed by URL in Composer. The
    obvious disadvantage is that automatic login is not possible in this situation,
    and there is an additional disadvantage that JavaScript will be thought to be
    disabled, Composer needs to use cookies to detect it. The first problem may be
    remedied by the web browser ''auto-fill'' feature, which can be used to automatically
    remember how forms, such as login forms, were filled. The developers recommend
    that users who have cookies enabled, but they possibly disable ''third party cookies''
    if they are concerned about privacy so that advertisers cannot track the advertising
    sites they view.


    # EU legislation


    The EU require tracking cookies be declared for organizations operating inside
    the EU. The Composer ''Cookie notice'' configuration option implements this. It
    is not by default because Composer''s cookies are heavily minimized to what we
    consider reasonable compliance without special notice. However, use of something
    like Adsense strictly requires you


