  md: '# DID YOU KNOW?


    This section equip readers the interesting facts and figures of the topic.


    # EXAMPLE


    The book cabinets'' examples to illustrate specific ideas in each chapter.


    As you know, the value of the candle and its type depends on how long it lasts.
    The more expensive the candle, the longer it lasts. The cheaper the candle, the
    shorter it lasts. This is not always the case.


    +   - There are many types of candles each with unique components


    # 1.1 Comparing Impact and Exhibit Variety


    The candles have many types, each with different uses. Some candles are meant
    to float in water, while others are meant to stand in holders. Taper candles are
    the most common type, they are long and thin. Pillar candles are thicker and can
    be used without a holder. The variety of candle types means that there is a candle
    for every occasion.


    The candles are decorated beautifully, making them pleasant to look at even before
    used.


    The candles are scented with various fragrances to make them smell nice.


    The candles are made of different materials such as beeswax, soy wax, or paraffin.


    The wide variety of colors and shapes allows candles to fit any decor style.


    ![](img/a67e9007ff8fb6a450e070349689c51f_7_0.png)


    As you know, the value of the candle and its type depends on how long it lasts.
    The more expensive the candle, the longer it lasts. This is not always the case.


    +   - The Type of the candle determines its function

    - The color of the candle can match the decor

    - The fragrance affects the atmosphere it creates


    The use of candles at home can create a warm and welcoming atmosphere.


    ![](img/a67e9007ff8fb6a450e070349689c51f_7_1.png)


    # ROLE MODEL


    A biography of someone who has/had remarkable success in their respective field
    as Role Models are important because they give us the ability to imagine our futures.


    # ROLE MODEL


    # ALAN COPTER: FATHER OF VISUAL BAKING


    Alan Copain was an American artist and baker known for his visual approach to
    baking. He developed a more visual and intuitive method to baking, making it accessible
    to everyone. His recipes were often illustrated with clear photographs, making
    them easier to follow.


    # CASE STUDY


    This reveals what students need to create an opportunity for the development of
    key skills such as communication, group working and solving problems.


    # CASE STUDY


    # FLIPPED CLASSROOM FACILITATION BY HS NET


    Flipped classroom is a teaching method where students watch lecture videos at
    home and do practical work in the classroom. This approach allows for more time
    for interaction between teachers and students.


    # Outlining


    Outlining is the process of organizing ideas into a logical structure before writing.
    It helps students to organize their thoughts and ensure that all necessary points
    are covered. By outlining, students can identify gaps in their arguments and improve
    the flow of their writing.


    The flipped classroom model has been used in various subjects and grade levels,
    and it has shown promise in improving student engagement and learning outcomes.


    # KNOWLEDGE CHECK


    This is given to the students to progress check at the end of each chapter.


    # KNOWLEDGE CHECK


    +   1. Which of the following do you remember from the lesson?

    2. Recall the key terms from memory.


    # REVIEW QUESTIONS


    This section is to analyze the knowledge and understanding of the reader.


    # REVIEW QUESTIONS


