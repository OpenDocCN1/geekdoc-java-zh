  md: '# SUMMARY


    +   HTML Forms are one of the main points of interaction between a user and a
    web site or application. They allow users to send data to the web site. Most of
    the time this is sent to the web server, but the web page can also intercept it
    to use it on its own.


    +   An HTML Form is made of one or more widgets. Those widgets can be text fields
    (single line or multiline), select boxes, buttons, checkboxes, or radio buttons.
    Most of the time these widgets are paired with a label that describes their purpose
    — properly implemented labels are able to clear both sighted and blind users on
    what to enter into a form input.


    +   Web forms are used by virtually all websites for a wide range of purposes.
    Users of forums and social networks use forms to add content and interact with
    other users.


    +   HTML Form is a document which stores information of a user on a web server
    using interactive controls. An HTML form contains different kind of information
    such as username, password, contact number, email id etc.


    +   textarea is, basically, a large, multi-line textbox. The anticipated number
    of rows and columns can be defined with rows and cols attributes, although you
    can manipulate the size to your heart’s content using CSS.


    +   HTML forms are an awesome and professional tool for collecting user data.
    However, these forms, just like everything else in HTML, wouldn’t work without
    some HTML form elements.


    +   HTML form elements are used to capture user input. There are many different
    types of form elements such as the text box, check drop down, submit button, and
    much more.


    +   The text box input is used to capture text such as a name, address, or any
    other type of text. To create an HTML text box we will use the input tag and specify
    that the type attribute to be text.


    ![](img/a67e9007ff8fb6a450e070349689c51f_148_0.png)'
