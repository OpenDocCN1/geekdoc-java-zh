    | Hour | getUTCHours() | 0-23 | 0 = midnight |

    | Minute | getUTCMMinutes() | 0-59 | |

    | Second | getUTCSeconds() | 0-59 | |

    | Millisecond | getUTCMilliseconds() | 0-999 | |


    To test the difference between local and UTC methods, we can run the following
    code.

    UTC.js


    ```

    // Assign current time to a variable

    const now = new Date();


    // Print local and UTC timezones

    console.log(now.getUTCHours());

    console.log(now.getUTCHours());

    ```


    Running this code will print out the current hour, and the hour of the UTC time
    zone. If you are currently in the UTC time zone the numbers that are output from
    running the program above will be the same. UTC is useful in that it provides
    an international time standard reference and can therefore keep your code consistent
    across time zones if that is applicable to what you are developing.


