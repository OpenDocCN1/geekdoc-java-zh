    knowingly or unknowingly. Have you ever saved your Facebook password so that you
    do not have to type it each and every time you try to log in? If yes, then you
    are using cookies. Cookies are saved as key/value pairs.


    ![](img/a67e9007ff8fb6a450e070349689c51f_191_0.png)


    A computer cookie, also referred to as an "HTTP cookie," is a small text file
    that contains a unique ID tag, placed on the user''s computer by a website. In
    this file, various information can be stored, from pages visited on the site,
    to information voluntarily given to the site. These tiny files provide practical
    benefits to both users and website operators, and generally make surfing the net
    a smoother experience than it would otherwise be. Nevertheless, privacy advocates
    intend to be wary of them, since many users are unaware of exactly what information
    is collected, and how the information may be used or shared.


    The communication between a web browser and server happens using a stateless protocol
    named HTTP. Stateless treats each request independent. So, the server does not
    keep the data after sending it to the browser. But in many situations, the data
    will be required again. Here come cookies into a picture. With cookies, the web
    browser will not have to communicate with the server each time the data is required.
    Instead, it can be fetched directly from the computer.


    > Web browser

