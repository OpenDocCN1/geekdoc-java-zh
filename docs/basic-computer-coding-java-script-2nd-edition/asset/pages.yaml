    # 9.2 Form Events


    These events are common while using forms on a webpage. In particular, we see
    the submit event most in form of validation (checking form values). As described
    in our tutorial: Features of JavaScript, if the users miss any required information
    or enter incorrect input, validation before sending the data to the server is
    faster. The list below explains the different form of events available to the
    user.


    +   - submit: This fires on the node representing the <element> when a user submits
    a form.

    - change: It fires when the status of various form elements changes. This is a
    better option than using the click event because clicking is not the only way
    users interact with the form.

    - input: The event is very common with the <input> and <textarea> elements.


    ![](img/a67e9007ff8fb6a450e070349689c51f_309_1.png)


    We use the focus and blur events with forms, but they are also available in conjunction
    with other elements links.


    # 9.2.6 Mutation Events and Observers


    Whenever the structure of the DOM tree changes, it triggers a mutation event.
    The change in the tree may be due to the addition or removal of a DOM node through
    your script. But these have an alternative that will replace them: mutation observers.
    The following are the numerous mutation events in JavaScript.


    +   - DOMNodeInserted: It fires when the script inserts a new node in the DOM
    tree using appendChild(), insertBefore(), etc.

    - DOMNodeRemoved: This event fires when the script removes an existing node from
    the tree using removeChild(), replaceChild(), etc.


    ![](img/a67e9007ff8fb6a450e070349689c51f_309_2.png)'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# JavaScript Events


    +   - DOMSubtreeModified: It fires when the structure of the DOM tree changes

    i.e. the above two events occur.


    +   - DOMNodeInsertedIntoDocument: This event fires when the script inserts

    a node in the DOM tree as the descendant of another node already in the

    document.


    +   - DOMNodeRemovedFromDocument: This event fires when the script removes

    a node from the DOM tree as the descendant of another node already in the

    document.


    The problem with the mutation events is that lots of changes to your page can

    make your page slow or unresponsive. This can also trigger other event listeners,

    modifying DOM and leading to more mutation event fires. This is the reason for

    introducing mutation observers to the script.


    Mutation observers wait until the script finishes its current task before reacting,

    reports the changes in a batch (not one at a time). This reduces the number

    of events that fire when you change the DOM tree through your script. You can
    also

    specific changes in the DOM you want to react to.


