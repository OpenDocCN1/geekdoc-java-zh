  md: 'them being logged-in, storing additional information in URLs: however this
    is unwieldy. Cookies were designed to resolve this problem, and another one:


    +   - it would allow server-side applications to identify a specific user by the
    computer they accessed with

    - it would allow client-side web applications to have a memory, which was otherwise
    impossible


    # 6.2.1 Session Cookie –First Cookie


    A session identifies a user, even if they are not a member. It is a unique number
    attached to a user and stored in a ‘cookie’ or theirs. A session cookie is a special
    kind of cookie that is automatically deleted when a user closes their web browser.
    We will start with the most basic cookie: the Session cookie you can create and
    is referred to as “Session Cookie” since it does not live outside of a session,
    so it deletes automatically when you close the browser. Information of a cookie
    is stored in value pairs, and it is most simplest form would look something like:


    ```

    username=Hans;

    ```


