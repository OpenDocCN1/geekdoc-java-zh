  md: '# Basic Computer Coding: Java Script


    +   - Occupies less memory, do not require any server resources and are stored
    on the user''s computer so no extra burden on server.


    +   - We can configure cookies to expire when the browser session ends (session
    cookies) or they can exist for a specified length of time on the client''s computer
    (persistent cookies).


    +   - Cookies persist a much longer period of time than Session state.


    # Disadvantages of using cookies


    Here are some of the disadvantages:


    +   - Cookies are not secure as they are stored in clear text they may pose a
    security risk as anyone can open and tamper with cookies. You can manually encrypt
    and decrypt cookies, but it requires extra coding and can affect application performance
    because of the time that is required for encryption and decryption


    +   - Some limitations exist on the size of the cookie text (4kb in general),
    number of cookies(20 per site in general), etc.


    +   - User has the option of disabling cookies on his computer from browser''s
    setting.


    +   - Cookies will not work if the security level is set to high in the browser.


    +   - Users can delete cookies.


    +   - Users can refuse cookies, so your code has to anticipate that possibility.


    +   - Complex type of data not allowed (e.g. dataset etc.). It allows only plain
    text (i.e. cookie allows only string content)


    # 6.2 SETTING DIFFERENT COOKIE KINDS IN JAVASCRIPT


    A cookie is a named piece of data, created and used by a certain website for a
    certain viewing user, and sent from the user''s browser to the web server each
    time a page is viewed. In this section we will show you how to create different
    kind of cookies, in JavaScript.


    ![](img/a67e9007ff8fb6a450e070349689c51f_207_0.png)


    Originally there was no way to identify a user on the web that was viewing a website
    with a user that had previously visited, unless they had an account on the website
    and logged in each time. It was possible to identify a user within a visit, without'
