  md: '# 9.2.8 CSS Events


    These events trigger when the script encounters a CSS element. As CS is a crucial
    part of web development, the developers decided to add these events to js to make
    working with CSS easier. Some of the most common events are as follows:


    +   - transitionend: This event fires when a CSS transition ends in a program.
    It is useful to notify the script of the end of transition that it can take further
    action.

    - animationstart: This event fires when CSS animation starts in the program.

    - animationiteration: This event occurs when any CSS animation repeats itself.
    We can determine the number of times an animation iterates in the script.

    - animationend: It fires when the CSS animation comes to an end in the program.
    This is useful when we want to act just after the animation process finishes.


    # 9.3 JAVASCRIPT ADDEVENTENER()


    TheaddEventListener method is used to attach an event handler to a particular
    element. It does not override the existing event handlers. Events are said to
    be an essential part of the JavaScript. A web page responds according to the event
    that occurred. Events can be user-generated or generated by API''s. An event listener
    is a JavaScript''s procedure that waits for the occurrence of an event.


    TheaddEventListener method is an inbuilt function of JavaScript. We can add multiple
    event handlers to a particular element without overwriting the existing event
    handlers.


    # 9.3.1 Syntax


    ```

    element.addEventListener(event, function, useCapture);

    ```


    Although it has three parameters, the parameters event and function are widely
    used. The third parameter is optional to define. The values of this function are
    defined as follows.'
