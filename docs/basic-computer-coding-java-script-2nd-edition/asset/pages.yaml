- img_proc: true
  md: 'A secure cookie always has the secure attribute activated, so it is used mostly
    via HTTPS and securely transmitted with encrypted connections. The HttpOnly flag
    in the secure cookie headers ensures JavaScript or non-HTTP methods cannot access
    the cookie. The cookie works through the assistance of two headers: set-cookie
    and the job of the set-cookie header is to create a secure cookie on the user''s
    system in response to a http request. While the cookie header is part of the application
    an http request sent to the server to validate if there is a secure cookie that
    matches the domain and path requested. The secure attribute and HttpOnly flag
    work to ensure the browser is able to restrict access to the secure cookie data
    from malicious scripts that may infected the browser or the network. This mitigates
    many of the damages that many XSS attacks can cause, specifically those that target
    cookies.


    # 6.2.4 HttpOnly Cookie – The Cookie that can only be accessed by the web-server


    HttpOnly is a flag to cookies that the browser not to display the cookie through
    client-side scripts (document.cookie and others). The agenda behind HttpOnly is
    not to spill cookies when an XSS flow exists, as a hacker might be able to run
    their script but the fundamental benefit of having an XSS vulnerability (the ability
    steal cookies and hijack a currently established session) is lost.


    When you set a cookie with the HttpOnly flag, it informs the browser that this
    special cookie should only be accessed by the server. Any try to access the cookie
    from client side script is strictly forbidden. Of course, this presumes you have:
    A modern browser. HttpOnly cookies were first presented in Microsoft''s Internet
    Explorer 6 SPI, and as of now, this has become a popular practice while setting
    cookies.


    The same goes for making a HttpOnly cookie, we just add "Http-Cookie;" – before
    doing so, you might want to delete all cookies in the web developer tools of your
    browser.


    ```

    document.cookie = "username=Hans; HttpOnly;"

    alert(document.cookie);

    ```


    > Remember Whether the cookie must use the HTTP protocol. If this value is TRUE,
    scripting languages such as JavaScript cannot access the cookie. The default is
    FALSE.


    ![](img/a67e9007ff8fb6a450e070349689c51f_212_0.png)'
