  md: '# SUMMARY


    +   A cookie is an item of data that a web server saves to your computer''s hard
    disk via a web browser. A cookie is a piece of data that is stored on your computer
    to be accessed by your browser.


    +   A computer cookie, also referred to as an “HTTP cookie,” is a small text file
    that contains a unique ID tag, placed on the user’s computer by a website.


    +   Cookies are relatively small text files that a web browser embeds on a user''s
    computer. Cookies allow stateless HTTP communications to emulate state (i.e.,
    memory). Cookies are being replaced by newer technologies such as local storage
    and session storage; however, cookies are still widely used by many websites today.


    +   Cookies are necessary because the HTTP protocol that is used to transfer webpages
    is state-less. This means that web servers cannot remember information about users
    throughout their travels, and so everyone becomes anonymous.


    +   The document has an object in JavaScript called document.cookie, which is
    used to read and retrieve cookie data. It is a repository of Strings (though not
    an array).


    +   A cookie is a small bit of text that accompanies requests and pages as they
    go between the Web server and browser.


    +   A cookie is a named piece of data, created and used by a certain website for
    a certain viewing user, and sent from the user’s web browser to the web server
    each time a page is viewed.


    +   A persistent cookie is a data file capable of providing websites with user
    preferences, settings and information for future visits. Persistent cookies provide
    convenient and rapid access to familiar objects, which enhances the user experience
    (UX). A persistent cookie is also known as a stored or permanent cookie.


    +   A secure cookie, also known as httpOnly cookie, is a type of cookie that only
    works with HTTP/HTTPS and does not work for scripting languages JavaScript.


    +   HttpOnly is a flag added to cookies that tell the browser not to display the
    cookie through client-side scripts (document.cookie and others).


