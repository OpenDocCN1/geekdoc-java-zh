  md: '# SUMMARY


    A function is a block of code that performs an action or returns a value. Functions
    are custom code defined by programmers that are reusable, and can therefore make
    your programs modular and efficient. JavaScript has several "top-level" built-in
    functions. JavaScript also has four built-in objects: Array, Date, Math, and String.


    A function (also known as a method) is a self-contained piece of code that performs
    a particular "function", then returns a value. You can recognize it by its format
    — it is a piece of descriptive text, followed by open and close brackets.


    JavaScript is a functional language meaning functions that are the primary modular
    units of execution. Functions are obviously very important in JavaScript.


    JavaScript, first introduced by Netscape, changed the static of the HTML web pages.
    Before JavaScript came into existence, HTML pages were just used to render static
    content. Inserting JavaScript to a web page, can give it a significant degree
    of interactivity and functionality.


    JavaScript is an object oriented programming language. It supports the concept
    of objects in the form of attributes. An object attribute consists of function,
    then it is a method of that object, or an object attribute consists of values,
    then it is a property of that object.


    JavaScript arrays are a special kind of object, and are created dynamically. An
    array object contains a number of variables may be zero, in which case the array
    is to be empty. The variables contained in an array have no names; instead they
    are referenced by access expressions that use nonnegative index values. These
    variables are called components of the array.


    The Date object provides a system-independent abstraction of dates and times.
    Dates may be constructed from a year, month, day of the month, hour, minute, second,
    and second those six components, as well as the day of the week, can be extracted
    from a date. Dates may also be parsed and converted to a readable string form.
    A Date is represented to a precision of one millisecond.


    JavaScript gives you a number of built-in functions, including the prompt() function,
    which lets you ask the user for written input. As with the confirm() function,
    you provide a text prompt to ask the user to provide a value. On return, you set
    the output of the function equal to the prompt() function and use the data in
    your application.


