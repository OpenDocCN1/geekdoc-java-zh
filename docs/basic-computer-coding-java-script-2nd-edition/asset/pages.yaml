    Here the instructor pointed out a bug that we can come across with respect to
    closures.


    Let''s say you have an array of elements and you are looping through them and
    want to alert the number when that element is clicked


    ```

    var nms = [1,2,3];

    ```


    ```

    for (var i = 0; i < nms.length; i++) {

    var num = nms[i];

    var elem = document.createElement(''div'');

    elem.textContent = num;

    ```


    ```

    elem.addEventListener(''click'', function() {

    alert(num);

    });

    document.body.appendChild(elem);

    ;

    ```


    We might expect to see 1, 2 and 3 alerted but we get the last number 3 all by
    the time we click.


    This is because the value of num changing in the for loop but the event handler
    function is executed when the element is clicked by which num would have been
    set to last element 3.


    The fix involves use closures. We can create an inner scope to hold the value
    of num at the exact time when the event handler is added.


    ```

    elem.addEventListener(''click'', function(numCopy) {

    return function() {

    alert(numCopy);

    }

    })(num));

    ```


