  md: '# SUMMARY


    The Document Object Model (DOM) is a cross-platform and language-independent interface
    that treats an XML or HTML document as a tree structure wherein each node is an
    object representing a part of the document. The DOM represents a document with
    a logical tree. Each branch of the tree ends in a node, and each node contains
    objects.


    +   - HTML DOM methods are actions you can perform (on HTML Elements).


    +   - HTML DOM properties are values (of HTML Elements) that you can set or change.


    +   - A property is a value that you can get or set (like changing the content
    of an HTML element).


    +   - HTML DOM document object is the owner of all other objects in your web page.


    +   - The HTML DOM allows JavaScript to change the content of HTML elements.


    +   - The HTML DOM allows JavaScript to change the style of HTML elements.


    +   - JavaScript animations are done by programming gradual changes in an element''s
    style.'
