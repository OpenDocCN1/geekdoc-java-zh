    # What makes JavaScript unique?


    There are at least three great things about JavaScript:


    +   - Full integration with HTML/CSS.

    - Simple things done simply.

    - Supported by all major browsers and enabled by default.


    Combined, these three exist only in JavaScript and no other browser technology.


    That''s what makes JavaScript unique. That''s why it''s the most widespread tool
    to create browser interfaces.


    While planning to learn a new technology, it is beneficial to check its perspectives.
    So let''s move on to the modern trends that include new languages and browser
    abilities.


    # Languages “over” JavaScript


    The syntax of JavaScript does not suit everyone''s needs. Different people want
    different features.


    That''s to be expected, because projects and requirements are different for everyone.
    So recently a plethora of new languages appeared, which are transpiled (converted)
    to JavaScript before they run in the browser.


    Modern tools make the transposition very fast and transparent, allowing developers
    to code in another language and autoconverting it “under the hood”.


    Examples of such languages:


    +   - Coffee is a “syntactic sugar” for JavaScript, it introduces shorter syntax,
    allowing to write more precise and clear code. Usually Rust devs like it.

    - TypeScript is concentrated on “strict data typing”, to simplify development
    and support of complex systems. It is developed by Microsoft.


    Interface in the Java programming language is an abstract type that is used to
    specify a behavior that classes must implement. They are similar to protocols.
    Interfaces are declared using the interface keyword, and may only contain method
    signature declarations.


