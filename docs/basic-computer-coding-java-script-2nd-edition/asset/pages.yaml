  md: '# 5.8.1 The addEventListener() method


    Example


    Add an event listener that fires when a user clicks a button:

    document.getElementById("myBtn").addEventListener("click", displayDate);

    The addEventListener method attaches an event handler to the specified element.

    The addEventListener method attaches an event handler to an element without overwriting
    existing event handlers.

    You can add many event handlers to one element.

    You can add many event handlers of the same type to one element, i.e two "click"
    events.

    You can add event listeners to any DOM object not only HTML elements. i.e the
    window object.

    The addEventListener() makes it easy to control how the event reacts to bubbling.

    When using theEventListener method, the JavaScript is separated from the HTML
    markup and allows you to add event listeners when you do not control the HTML
    markup.

    You can easily remove an event listener using the removeEventListener() method.


    # 5.8.2 Syntax


    element.addEventListener(event, function, useCapture);

    The first parameter is the type of the event like "click" or "mousedown".

    The second parameter is the function we want to call when the event occurs.

    The third parameter is a boolean value specifying whether to use event bubbling
    or event capturing.


    # 5.8.3 Add an Event Handler to an Element


    Example


    Alert "Hello World!" when the user clicks on an element:

    element.addEventListener("click", function() { alert("Hello World!"); });

    You can also refer to an external "named" function:


