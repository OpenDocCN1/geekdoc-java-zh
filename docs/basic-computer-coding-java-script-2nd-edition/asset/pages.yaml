  md: '# Basic Computer Coding: Java Script


    that can be stored on a user''s computer and be picked up by any other web pages
    in the correct domain and path. Cookies are set to expire after a certain length
    of time. They are limited to string values only. Be warned that many users (including
    me) will not permit cookies on their computers. Do not make your web sites rely
    on them. The reason for this is that many web sites use cookies as advert tracing
    systems, which they use to track your movement around the Internet. We would not
    want anyone to follow me around a city while you was shopping, taking notes of
    every shop we visit and whether you look in the lingerie section, as that would
    be an invasion of our privacy. Many people feel the same about the Internet. You
    may find it helps to display a message saying what you are going to use the cookie
    for, for example to store a username and password for the next time they visit
    the site.


    ![](img/a67e9007ff8fb6a450e070349689c51f_193_0.png)


    Note also that European law requires to gain explicit permission before using
    cookies, unless those cookies are essential to the operation of the site (such
    as a shopping basket). Most browsers will have a limit to how many cookies they
    can store, usually 300 cookies or more, of which there may be 20 cookies per domain
    name. A total of 4 KB (after encoding) of cookies can be stored for any domain
    or path. The document.cookie object is a string representation of all cookies
    available to the current web page. The document.cookie object is something unusual
    when you assign values to it, it does not become the value that you assign to
    it. Instead, it takes a part of that value and appends its current value to that,
    so making a string containing several pairs of variableName=variableValue.


    # Why we use Cookies


    Cookies are necessary because the HTTP protocol that is used to transfer webpages
    around the web is state-less. This means that web servers cannot remember information
    about users throughout their travels, and so everyone becomes anonymous. If'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'ever return to a site you visited previously, you are treated as if it was
    your first visit. This is especially unsatisfactory for sites which ask their
    users to log in — if you leave and return just a few minutes later, you will have
    to log in again. The server does not remember anything about your visit or your
    preferred settings. So, cookies were invented to give memory, of a sort, to web
    servers.


    # What Kinds of Data Can Be Stored in Cookie?


    A cookie is basically a string of characters not longer than 4 KB. Cookies are
    set in name=value pairs, separated by semi-colons. For example, a cookie might
    be a string like the following:


    ```

    “theme-blue; max-age=60; path=/; domain=theisewizard.com”

    ```


    This example cookie has 4 variable/value pairs:


    +   - max-age, is set to 60,

    - path, is set to the slash character "/",

    - domain, which is set to “theisewizard.com",

    - and theme, which is set to “blue”.


    The variables “max-age”, “path” and “domain” are special variable names that are
    recognized by the browser to control things like the lifespan of the cookie and
    the URLs for the cookie is valid. Only the “theme” variable in your example contains
    the real data that you want to set. You can create any variable name you want,
    and set it to whatever value wish, subject to the following constraints:


    +   - max-age, by default, a lifespan of the current browser session. As soon
    as your visitor closes his browser, your cookie disappears. To make it last longer,
    you will need to set the max-age variable to contain the number of seconds (yes,
    seconds) you want the cookie.


    For example, if you want your cookie to last 30 days, it is set to 2,592,000.
    Actually instead of pre-calculating this and putting into your script, you can
    have the JavaScript interpreter calculate it at run time, and simply encode it
    as

    “theme=blue; max-age= +60*24*30; path=/; domain=theisewizard.com”

    This is superior to writing a huge number that will forget the meaning of in the
    future.


    +   - path

    By default cookies are valid only for web pages in the directory of the current
    web page that them stored, as well as its descendants. This is it will be valid
    for http://example.com/abc/webpage.html, another-page.html as well as http://example.com/abc/Sub-Folder/index.html,
    but not


    ![](img/a67e9007ff8fb6a450e070349689c51f_194_0.png)'
