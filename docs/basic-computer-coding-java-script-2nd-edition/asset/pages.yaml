  md: '# Java Script: Classes and Objects


    # Creating New Objects


    JavaScript has a number of predefined objects. In addition, you can create your
    own objects. You can create an object using an object initializer. Alternatively,
    you can first create a constructor function and then instantiate an object invoking
    that function in conjunction with the new operator.


    # Using object Initializers


    In addition to creating objects using a constructor function, you can create objects
    using an object initializer. Using object initializers is sometimes referred to
    as creating objects with literal notation. "Object initializer" is consistent
    with the terminology used by C++.


    The syntax for using an object initializer is:


    ```

    var obj = { property_1: value_1, // property_# may be an identifier...

    2: value_2, // or a number...

    // ...

    ''property_n'': value_n }; // or a string

    ```


    where obj is the name of the object, property_i is an identifier (either a name,
    a number, or a string literal), and each value_i is an expression value assigned
    to property_i. The obj assignment is optional; if you do not need to refer to
    it elsewhere, you may not the variable. (Note that you may need to wrap the object
    literal in parentheses if the object appears where a statement is expressed, so
    as not to have the literal confused with a block statement.)


    Object initializers are expressions, and each object initializer result in a new
    object being created whenever the statement in which it is executed. Identical
    object initializers create distinct objects that will not compare to each other
    as equal. Objects are created as if a call to new Object() were made; that is,
    objects made from literal expressions are instances of Object.


    The following statement creates an object and assigns it to the variable x if
    only if the condition cond is true:


    ```

    if (cond) var x = {greeting: ''hi there''};

    ```


    The following example creates myHonda with three properties. Note that the engineproperty
    is an object with its own properties.


    ```

    var myHonda = {color: ''red'', wheels: 4, engine: {cylinders: 4, size: 2.2}};

    ```


    You can also use object initializers to create arrays.


    ![](img/a67e9007ff8fb6a450e070349689c51f_246_0.png)'
