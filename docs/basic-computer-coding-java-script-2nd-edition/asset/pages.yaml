  md: 'cookie. When users visit a website and set choices or preferences, persistent
    cookies may be used to remember these options. Persistent cookies can help isolate
    and identify a specific client and are capable of traversing a user''s path toward
    a website. They are stored as text files on the hard drive of a computer and usually
    have expiration dates of one to two years. Persistent cookies facilitate setting
    the following preferences:


    +   - Favorites or internal bookmarks


    +   - User authentication


    +   - Login details


    +   - Theme selection, if applicable


    +   - Language preferences


    Persistent cookies are also capable of providing the browsing behavior of users.
    As mentioned before, we can make a cookie persistent by defining it is expiration
    date and time, which would look like something like the example below:

    username=Hans; Expires=Sun, 22 Oct 2017 08:00:00 UTC;

    This will also be to delete a cookie, by setting the expiration date to a date
    in the past - your browser will remove the cookie based on that.


    +   - The date format for cookies must be in a UTC/GMT format (i.g. Sun, 22 Oct
    2017 08:00:00 UTC), so correct for your timezone if needed.

    - UTC versus GMT: both indicate the same time, however: UTC is a time standard,
    whereas GMT is a timezone. UTC is preferred.


    OK, ready for an example – here it be very helpful to look at the earlier mentioned
    "Inspect" (web developer) tools, since it lists these properties as well. Our
    JavaScript will look something like this (remember to change the date if you are
    trying this after Oct 22 2017 8 AM UTC):


    # Example


    document.cookie = "username=Hans; Expires=Sun, 22 Oct 2017 08:00:00 UTC";

    alert(document.cookie);

    And when inspecting the cookies with Google Chrome (for example), we will see
    something like this:


    | Name | Domain | Path | Expires / Max-Age | Size | HTTP | Secure | Samesite |

    |---|---|---|---|---||-|-|-|--|

    | username | Hans | folly.jshell.net | /display | 2017-10-22T08:00:00.000Z | 12
    | | | |


