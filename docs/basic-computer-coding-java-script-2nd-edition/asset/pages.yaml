  md: '# ## 4.2.6 Radio Input


    Radio buttons should be used in cases of ''yes'' or ''no''. The pair of radio
    buttons may be arranged either vertically or horizontally. Radio buttons may often
    have a default or preferred selection. This preferred selection should be the
    first button of the pair whenever possible. In some instances when a single selection
    may be made but there are several options to choose from, all the radio button
    in the set may appear un-selected or ''empty''. Once a user has made a selection
    however the selected state should be evident and visible heretofore, even if the
