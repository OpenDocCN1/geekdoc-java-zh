  md: 'for http://example.com/index.html.


    If you want the cookie to be valid in some other directory, say, http://example.com/special/,
    you will need to set the path variable to contain the value "special". If you
    want the cookie to be valid everywhere on your site, it is set to the root of
    your web directory, that is, "/".


    +   - domain


    Another special variable name that you may want to take note of is the domain
    variable. Cookies set in example.com will only be valid for subdomain. If you
    want it to be valid for all sub-domains of example, you will need to set the domain
    to point to "example.com". The cookie will then be valid for "example.com", "blog.example.com",
    and whatever subdomains that you may have.


    +   - secure


    There''s another variable that has special meaning: secure. This variable should
    not be assigned any value. Including it means that the cookie will only be sent
    if your visitor is visiting your website over a secure connection.


    +   - expires


    The expires variable is obsolete although still supported by today''s browsers.
    Use the max-age variable instead, since it is easier to use. Be careful not to
    use "expires" as a variable to store your data as well.


    +   - No spaces, commas, semi-colons


    Your cookie values have no embedded whitespaces, commas or semi-colons. If you
    have any, they must be converted to their "encoded" equivalent. The easiest way
    to do this is to use the encodeURI() function to encode it, and the decodeURI()
    function to decode it when you read the cookie.


    Expanding on your earlier example, if you want to set a "theme" variable to "blue
    theme", you can do it with:


    ```

    "theme=" + encodeURI("blue theme") + "; max-age=" + 60*60*24*30 + "; path=/; domain=thetisewizard";

    ```


    Of course in the above case, since there is only one space character to encode,
    you can do it manually as "blue%20 theme" as well.


