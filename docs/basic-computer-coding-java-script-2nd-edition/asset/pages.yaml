  md: '# Basic Computer Coding: Java Script


    The browser has an embedded engine, sometimes it''s also called a “JavaScript
    virtual machine”.


    Different engines have different “codenames”, for example:


    +   - V8 – in Chrome and Opera.

    - SpiderMonkey – in Firefox.

    - There are other codenames like “Trident”, “Chakra” for different versions of
    IE, “Nitro” and “SquirrelFish” for Safari etc.


    The terms above are good to remember, because they are used in developer articles
    on the internet. We’ll use them.


    ![](img/a67e9007ff8fb6a450e070349689c51f_53_0.png)


    If a “feature X is supported by V8”, then it probably works in Chrome and Opera.


    # What can be in-browser JavaScript do?


    The modern JavaScript is a “safe” programming language. It does not provide low-level
    access to memory or CPU, because it was initially created for browsers which do
    not require it.


    The capabilities greatly depend on the environment that runs JavaScript. For instance,
    NodeJS supports functions that allow JavaScript to read/write arbitrary files,
    perform network requests etc.


    In-browser JavaScript can do everything related to webpage manipulation, interaction
    with the user and the webserver. In-browser JavaScript is able to:


    +   - Add new HTML to the page, change the existing content, modify styles.

    - React to user actions, run on mouse clicks, pointer key presses.

    - Send requests over the network to remote servers, download and upload files
    (so-called AJAX technologies).

    - Get and set cookies, ask questions to the visitor, show messages.

    - Remember the data on the client-side (“local storage”).


    ![](img/a67e9007ff8fb6a450e070349689c51f_53_1.png)'
