    \ p2); });\n```\n\n# 5.8.7 Event Bubbling or Event Capturing?\n\nThere are two\
    \ ways of event propagation in the HTML DOM, bubbling and capturing.\n\nEvent\
    \ propagation is a way of defining the event order when an event occurs. If you\
    \ have a <p> element inside a <div> element, and the user clicks on the <p> element,\
    \ which element's \"click\" event should be handled first?\n\nIn bubbling the\
    \ inner most element's event is handled first and then the outer: the <p> element's\
    \ click event is handled first, then the <div> element's click event. \n\nIn capturing\
    \ the outer most element's event is handled first and then the inner: the <div>\
    \ element's click event will be handled first, then the <p> element's click event.\n\
    \nWith the addEventListener method you can specify the propagation type by using\
    \ the \"useCapture\" parameter:\n\n```\naddEventListener(event, function, useCapture);\n\
    ```\n\nThe default value is false, which will be the bubbling propagation, when\
    \ the value is set to true, the event uses the capturing propagation.\n\n# Example\n\
    \n```\ndocument.getElementById(\"myP\").addEventListener(\"click\", myFunction,\
    \ true);\ndocument.getElementById(\"myDiv\").addEventListener(\"click\", myFunction,\
    \ true);\n```\n\n# 5.8.8 The removeEventListener() method\n\nThe removeEventListener()\
