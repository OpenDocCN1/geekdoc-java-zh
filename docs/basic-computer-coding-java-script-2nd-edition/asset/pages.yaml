  md: "# HTML Forms 127\n\nvertical-align: middle; /* This is optional but it makes\
    \ legacy IEs look better */\n<textarea> elements default to being rendered as\
    \ a block element. The two important things here are the resize and overflow properties.\
    \ Because our design is a fixed-size design, we will use the resize property to\
    \ prevent users from using our multi-line text field. The overflow property is\
    \ used to make the field more consistently across browsers. Some browsers default\
    \ to the value auto, while some default to the value scroll. In our case, it's\
    \ better to sure every one will use auto:\n\n```\ntextarea {\n  display : block;\n\
    \n  padding : 10px;\n  margin : 10px 0 -10px;\n  width : 340px;\n  height : 360px;\n\
    \n  resize : none;\n  overflow: auto;\n}\n```\n\nThe <button> element is really\
