  md: '# Basic Computer Coding: Java Script


    Here we can see the name, value, domain, path, expiration date/time, size (number
    of characters + value), HTTPOnly, Secure and SameSite. The alert on the other
    hand only shows “username=Hans”.


    A few things to note here, and the alert() message kind-a points in this direction
    as well:


    +   - document.cookie only holds the name-value pairs that we are allowed to see,

    - properties of a value pair (like expiration) is not returned when we use document.cookie.


    The fact that we can see this in the web developer tool, is these tools are part
    of your browser and allow looking into the inner workings—which is great for developers
    and for us we are learning more about cookies.


    # 6.2.3 Secure Cookie – Which only works when HTTPS is being used


    A secure cookie, also known as httpOnly, is a type of cookie that only works with
    HTTP/HTTPS and does not work for scripting languages like JavaScript. Since it
    is only in storing information and used for hypertext transfer protocol requests
    over the internet, exploits and hacks made through scripting are unable to access
    them. So secure cookie''s main benefit is that it can stop them through cross-site
    scripting (XSS).


    Making a secure cookie is pretty easy as well, we simply add the option “Secure”.nusername=Hans;
    Secure;


    This can be a tricky one to test with a local file or your own web-server, since
    this would only work over a HTTPS connection which typically is not the case.
    JSFiddle on the other hand uses HTTPS so it will work here;


    ```

    document.cookie = “username=Hans; Secure;";

    alert(document.cookie);

    ```


    The “Inspect” option in Google Chrome, might require you to click the refresh
    button in the web developer tools (as indicated before). You will now see a checkmark
    in the “secure” column as well.'
