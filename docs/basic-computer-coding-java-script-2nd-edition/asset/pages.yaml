    # 2.2.4 Arrays


    Arrays are zero-indexed lists of values. They are a handy way to store a set of
    related items of the same type (such as strings); though in reality, an array
    can include multiple types of items, including other arrays. Objects allow to
    store keyed collections of values. That''s fine. But quite often we find that
    we need an ordered collection, where we have a 1st, a 2nd, a 3rd element and so
    on. For something: users, goods, HTML elements etc. It is not convenient to use
    an object here, because it provides no methods to manage the order of elements.
    We can''t insert a new property “between” the existing ones. Objects are not meant
    for such use.


    ```

    A simple array

    var myArray = [''hello '', ''world '' ];

    Accessing array items by index

    var myArray = [''hello '', ''world '', ''foo '', ''bar '' ];

    console.log (myArray[3]); // logs ''bar''

    Testing the size of an array

    var myArray = [''hello '', ''world '' ];

    console.log (myArray.length); // logs 2

    Changing the value of an array item

    var myArray = [''hello '', ''world '' ];

    myArray[1] = ''changed ''

    ```


