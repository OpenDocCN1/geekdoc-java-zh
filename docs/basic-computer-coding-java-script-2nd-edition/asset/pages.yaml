    # 2.1.2 Understanding Syntax and Code Structure in JavaScript


    Before writing in a spoken language, you must first learn the rules of grammar.
    Here are a few examples of rules you might find in the English language:


    +   - A sentence starts with a capital letter.

    - A sentence ends in a period.

    - A new paragraph is indented.

    - Spoken dialogue is placed inside double quotation.


    Similarly, all programming languages must adhere to specific rules in order to
    function. This set of rules that determine the correct structure of programming
    languages is known as syntax. Many programming languages consist largely of similar
    concepts with variations in syntax.


    # Functionality and Readability


    Functionality and readability are two important reasons to focus on syntax as
    you begin to work with JavaScript.


    There are some syntax rules that are mandatory for JavaScript functionality. If
    they are not followed, the console will throw an error and the script will cease
    execution.


    Consider a syntax error in the "Hello, World!" program:


    ```

    // Example of a broken JavaScript program

    console.log("Hello, World!")

    ```


    This code is missing the closing parenthesis, and instead of printing the expected
    "Hello, World!" to the console, the following error will appear:


    Output


    Uncaught SyntaxError: missing ) after argument list


    The missing ) must be added before the script will continue to run. This is an
    example of how a mistake in JavaScript syntax can break the script, as correct
    syntax must be followed in order to code for run.


