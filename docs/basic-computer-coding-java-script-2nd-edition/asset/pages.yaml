    # 4.3 STYLING HTML FORMS


    To style elements are easy to style with CSS, you should not face any difficulties,
    since they mostly behave like any other HTML element. However, the user-agent
    style sheet of every browser can be a little inconsistent, so there are a few
    tricks that help you style them in an easier way.


    ![](img/a67e9007ff8fb6a450e070349689c51f_135_0.png)


    # 4.3.1 Search Fields


    Search boxes are the only kind of text fields that can be a little tricky to style.
    On WebKit based browsers (Chrome, Safari, etc.), you''ll have to tweak it with
    the -webkit-appearance property.'
