    \ = 'Ford';\n```\n\n```\npropertyName = 'model';\nmyCar[propertyName] = 'Mustang';\n\
    ```\n\nYou can use the bracket notation for...in iterate over all the properties\
    \ of an object. To illustrate how this works, the following function displays\
