  md: '# SUMMARY


    +   BOM refers to the browser object model in JavaScript. BOM is used on the Windows
    screen and communicates with the browser. BOM refers to Windows objects in JavaScript.


    +   The window object represents a window in browser. Any object of window is
    created automatically by the browser.


    +   The window object properties return the height and width of the browser content.
    We cannot change it in height and width as these properties are read-only.


    +   The name property will return the name of the windows. This property is often
    used to change the name of the window after the window is created.


    +   The JavaScript history object represents an array of URLs visited by the user.
    By using this, you can load previous, forward or on any particular page.


    +   Navigator object is used for browser detection. It can be used to get browser
    information such as version and browser type.


    +   The Navigator enabled() method is used to return a Boolean value that indicates
    whether or not Java is enabled in a browser. If Java is enabled in the browser
    it returns true else false.


    +   The navigator taint() method was best avoided in Javascript version 1.5, and
    was later removed to prevent run-time errors. It returns a Boolean false value,
    specifying whether the data-tainting feature is enabled in the browser.


    +   The Navigator geolocation object provides a geolocation object that can be
    used to track the user''s status.


    +   The location object window in JavaScript enables it to save the information
    about the current page location or address (URL), and redirect the browser to
    a new page.


    +   A location object is part of the window object, it accesses through the windows.
    There is no general standard for the location object, but all major browsers support
    the location object.


    +   The location assign() method is used for loading a new document in a new page.
    It is not possible to go back to the previous document using your browser ''back''
    button.


    +   The location href property in HTML is used to set or redirect the current
    (URL) of the current page. The location href returns the full URL of the page
    and protocol.


    +   The JavaScript screen object holds information of browser screen. It can be
    used to display screen width, height, colorDepth etc.


