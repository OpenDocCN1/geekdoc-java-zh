    # 6.1 BASICS TO READING/WRITING COOKIES WITH JAVASCRIPT


    Cookies are relatively small text files that a web browser embeds on a user''s
    computer. Cookies allow otherwise HTTP communications to emulate state (i.e.,
    memory). Cookies are being replaced by somewhat newer technologies such as local
    storage and session storage; however, cookies are still widely used by many major
    websites today. For that reason


