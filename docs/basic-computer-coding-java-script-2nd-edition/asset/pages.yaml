  md: '# Cookie Limits


    Although different browsers may implement different limits for cookies, the bare
    minimum that they are supposed to support is as follows:


    +   - Cookie length: 4 KB. The total length of your string, including all the
    variables with special meaning, should not be more than 4,096 characters.


    +   - Maximum number of cookies per web server: 20.


    +   - Total number of cookies supported by the browser: 300. This includes cookies
    stored by other websites.


    # 1.6.2 Structure of a Cookie


    Cookies are no more than simple text files — usually found in your browser cache,
    or ''Internet files'' — contain one or more entries. Each entry is made up of


    +   - A name-value pair which stores whatever data you want to save.

    - An expiry date, after which time the entry will be deleted.

    - The web domain and path that the entry should be associated with.


    You can use JavaScript to read or write a new entry to the cookie file. The process
    of creating an entry is often referred to as ''writing a cookie'', but this is
    misleading. The cookie is the text file contains all of your entries, while the
    individual entries hold the data. Each domain name on the web can have a cookie
    file associated with it, and each cookie can hold multiple entries.


    ![](img/a67e9007ff8fb6a450e070349689c51f_196_0.png)


    When you request a file from a server that you have used previously, the data
    in the relevant cookie is sent to the server along with your request. This way,
    server-side scripts, such as those written in Perl or PHP, can read your cookie
    and figure out whether you have permission to view a cookie page, for instance.
    Cookies can also be used for more malicious purposes, usually by advertising companies
    to track your behavior online. Most modern browsers include good measures that
    allow you to block cookies from certain sites, which sites disclose to is now
    at your discretion.


    ![](img/a67e9007ff8fb6a450e070349689c51f_196_1.png)'
