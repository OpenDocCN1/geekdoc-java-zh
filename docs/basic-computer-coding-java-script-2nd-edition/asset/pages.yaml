  md: '# 9.3.3 Event Bubbling or Event Capturing


    Now, we understand the use of the third parameter of JavaScript''s addEventListener(),
    i.e. useCapture.


    In HTML DOM, Bubbling and Capturing are the two ways of event propagation. We
    can understand these ways by taking an example.


    Suppose we have a div element and a paragraph element inside it, and we are applying
    the "click" event to both of them using the addEventListener() method. The question
    is on clicking the paragraph element, which element''s event is handled.


    So, in Bubbling, the event of paragraph element is handled first, and then the
    inner element''s event is handled, and then the outermost element''s event will
    be handled.


    In Capturing the event of div element is handled first, and then the paragraph
    element''s event is handled. It means that capturing the outer element''s event
    is handled first, and then the innermost element''s event will be handled.


    ```

    addEventListener(event, function, useCapture);

    ```


    We can specify the propagation using the useCapture parameter. When it is set
    to false (which is its default value), then the event uses bubbling propagation,
    and when it is set to true, there is capturing propagation.


    We can understand the bubbling and capturing using an illustration.


    # Example


    In this example, there are two div elements. We can see the bubbling effect on
    the first div element and the capturing effect on the second div element.


    When we double click the span element of the first div element, then the span
    element''s event is handled first than the div element. It is called bubbling.


    But when we double click the span element of the second div element, then the
    div element''s event is handled first than the span element. It is called capturing.'
