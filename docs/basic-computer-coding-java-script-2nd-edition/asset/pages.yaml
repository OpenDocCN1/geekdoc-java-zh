    Properties of JavaScript objects can also be accessed or set using a bracket notation
    (for more details see property access). Objects are sometimes called associative
    arrays, where each property is assigned with a string value that can be used to
    access it. So, for example, you could access the properties of the myCar object
    as follows:


    ```

    myCar[''make''] = ''Ford'';

    myCar[''model''] = ''Mustang'';

    myCar[''year''] = 1969;

    ```


    An object name can be any valid JavaScript string, or anything that can be converted
    to a string, including the empty string. However, any property name that is not
    a valid JavaScript identifier (for example, a property name that has a space or
    a hyphen, or starts with a number) can only be accessed using the square bracket
    notation. This notation is also very useful when property names are to be deically
    determined (when the property name is not determined until runtime). Examples
    as follows:


    ```

    // four variables are created and assigned in a single go,

    // separated by commas

    var myObj = new Object();

    str = ''myString'';

    rand = Math.random();

    obj = new Object();

    ```


