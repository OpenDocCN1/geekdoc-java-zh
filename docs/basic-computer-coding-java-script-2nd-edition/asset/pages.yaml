  md: '# Introduction to JavaScript


    # Server-side JavaScript


    In 1995, soon after releasing JavaScript for browsers, Netscape introduced an
    implementation of the language for server-side scripting with Netscape Enterprise
    Server.


    Since 1996, the IIS web-server has supported Microsoft''s implementation of server-side
    Javascript -- JavaScript in ASP and .NET pages. Since the mid-2000s, server-side
    JavaScript implementations have been introduced, such as Node.js in 2009.


    # Adoption by Microsoft


    Microsoft script technologies including VBScript and JavaScript were released
    in 1996. JavaScript, a reverse-engineered implementation of Netscape''s JavaScript,
    was part of Internet Explorer 3. JavaScript was also available for server-side
    scripting in Internet Information Server. IE3 also included Microsoft''s first
    support for CSS and various extensions to HTML, but in each case the implementation
    was noticeably different from that found in Netscape Navigator at the time. These
    differences made it difficult for designers and programmers to use of “best view
    in Netscape” and “best view in Internet Explorer” logos that characterized these
    early years of the browser wars. JavaScript began to acquire to acquire a reputation
    for being one of the roadblocks to a cross-platform and standards-driven web.
    Some developers took on the task of trying to make their sites work in both major
    browsers, but many could not afford the time. With the release of Internet Explorer
    4, Microsoft introduced the concept of Dynamic HTML, but the differences in language
    implementations and the proprietary Document Object Models remained were obstacles
    to widespread take-up of JavaScript on the web.


    # Standardization


    In 1996, Netscape submitted JavaScript to ECMA International to carve out a standard
    specification, which other browser vendors could then implement based on the work
    done at Netscape. This led to the official release of the language specification
    ECMAScript published in the first edition of the ECMA-262 standard in June 1997,
    with JavaScript being the most well-known of the implementations. ActionScript
    and JavaScript were other well-known implementations of ECMAScript.


    The standards process continued in cycles, with the release of ECMAScript 2 in
    June 1998, which brings some modifications to conform to the ISO/IEC 16262 standard.
    The release of ECMAScript 3 followed in December 1999, which is the baseline for
    modern JavaScript. The original ECMAScript 4 work led by Waldemar Horwat (then
    at Netscape, now at Google) started in 2000 and first, Microsoft sought to participate
    and even implemented some of the proposals in JavaScript .NET language.


