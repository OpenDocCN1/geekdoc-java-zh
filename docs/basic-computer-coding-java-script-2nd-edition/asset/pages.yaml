    document objects.


    +   - hashchange: It fires when the URL changes without refreshing the entire

    window. Hashes (#) link specific parts (known as anchors) within a page.

    It works on the window object; the event contains both the oldURL and

    tnewURL properties holding the URLs before and after the hashchange.


    +   - beforeunload: This event fires on the window object just before the page

