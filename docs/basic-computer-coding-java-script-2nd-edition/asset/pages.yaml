    # 7.3.5 Inheritance


    All objects in JavaScript inherit from at least one other object. The object being
    inherited from is known as the prototype, and the inherited properties are found
    in the prototype object of the constructor.


    # Indexing Object Properties


    You can refer to a property of an object either by its property name or by refer
    to its ordinal. If you initially define a property by name, you must always refer
    to it by its name, and if you initially define a property by an index, you must
    always refer to it by its index.This restriction applies when you create an object
    and its properties with a constructor function (as we did previously with the
    Car object) and when you define individual properties explicitly (for example,
    myCar.color = "red". If you initially define an object property with an index,
    such as myCar[5] = "25 mpg", you subsequently refer to the property only as myCar[5].


    The exception to this rule is array-like reflected from HTML, such as the forms
    array-like object. You can always refer to by their ordinal number (where they
    appear in the document) or their name (if defined). For example, if the second
    <FORM> tag in a document has a NAME attribute of "myForm", you can refer to the
    form as document.forms[1] or document.forms["myForm"]] or document.forms.myForm.


