  md: "# Example\n\n```\n<form>\n<input type=\"search\">\n</form>\ninput[type=search]\
    \ {\n  border: 1px dotted #999;\n  border-radius: 0;\n  -webkit-appearance: none;\n\
    }\n```\n\n![](img/a67e9007ff8fb6a450e070349689c51f_136_0.png)\n\nAs you can see\
    \ on this screenshot of the search field in Chrome, the two fields have a border\
    \ set as in our example. The first field is rendered without using the -webkit-appearance\
    \ property, whereas the second is rendered using -webkit-appearance:none. This\
    \ difference is noticeable.\n\n# 4.3.2 Fonts and Text\n\nCSS font and text features\
    \ can be used easily with any widget (and yes, you can use @font-face with form\
    \ widgets). However, browsers' behaviors are often inconsistent. By default, some\
    \ widgets do not inherit font-family and font-sizefrom their parents. Many browsers\
    \ use the system default appearance instead. To make your forms' appearance consistent\
    \ with the rest of your content, you can add the following rules to your stylesheets:\n\
    \n+   - button, input, select, textarea {\n  font-family : inherit;\n  font-size\
    \ : 100%;}\n\nThe screenshot shows the difference; on the left is the default\
    \ rendering of the element in Firefox on Mac OS X, with the platform's default\
    \ font style in use. On the right are the same elements, with our font harmonization\
    \ style rules applied."
