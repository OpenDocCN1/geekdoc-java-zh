    # ## 1.4.3 JavaScript Documentation Tools


    Documentation turns your application into a glass box, making the inner processes
    understandable and obvious. It explains how the software operates and how it should
    be used. Automated documentation tools describe functions and their purposes,
    saving time on analysis and understanding of each in the future.


    +   - **Swagger** is generally a set of rules and tools for describing APIs. Here''s
    the thing, a language-agnostic utility for getting everyone (both developers and
    non-developers) on the same page. Swagger creates clear documentation that is
    both machine and human readable, allowing for automation of API-dependent processes.


    +   - **JSDoc Toolkit** automatically generates template-formatted, multi-page
    text-based documentation (HTML, JSON, XML, etc.) from comments in the JavaScript
    source code. Written in JavaScript, this application can come handy for managing
    large-scale projects.


    +   - **jGrouDoc** (jGD) is a flexible open source tool that allows developers
    to generate API documentation from the comments in the JS source code. It documents
    not only variables and functions, but namespaces, interfaces, packages, and other
    elements as well.


    +   - **UIDoc** is a Node.js app that follows the same principles of generating
    API documentation from source code. It uses syntax similar to Javadoc and Doxygen
    offers live previews, extensive language support, and advanced markup.


    +   - **Docco** is a free documentation tool written in Literate CoffeeScript.
