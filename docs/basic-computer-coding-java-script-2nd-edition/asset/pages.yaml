  md: '# Comments in JavaScript


    JavaScript supports both C-style and C++-style comments, Thus –


    +   * Any text between a // and the end of a line is treated as a comment and
    is ignored by JavaScript.

    * Any text between the characters /* and */ is treated as a comment. This may
    span multiple lines.

    * JavaScript also recognizes the HTML comment opening sequence <--. JavaScript
    treats this as a single-line comment, just as it does the // comment.

    * The HTML comment closing sequence --> is not recognized by JavaScript so it
    should be written as //->.


    # Example


    The following example shows how to use comments in JavaScript.


    ```

    <script language="javascript" type="text/javascript">

    <-


    // This is a comment. It is similar to comments in C++


    /*

    * This is a multiline comment in JavaScript

    * It is very similar to comments in C Programming

    */


    -->

    </script>

    ```


    # 2.1.1 JavaScript Browser


    JavaScript was initially created to "make webpages alive". The programs in this
    language are called scripts. They can be written right in the HTML and execute
    automatically as the page loads. Scripts are provided and executed as a plain
    text. They don’t need a special preparation or a compilation to run. In this aspect,
    JavaScript is very different from another language called Java.


    At present, JavaScript can execute not only in the browser, but also on the server,
    or actually on any device where there exists a special program called the JavaScript
    engine.'
