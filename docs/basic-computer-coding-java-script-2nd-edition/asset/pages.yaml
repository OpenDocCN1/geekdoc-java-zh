  md: '# 1.2 HELLO WORLD: WRITING YOUR FIRST JAVASCRIPT PROGRAM


    “Hello World” is a staple of programming courses. The objective of this program
    is simple: output the “Hello World” on a computer screen. Because of the simplicity
    of the message and syntax, it is usually the first program to beginners. Writing
    a “Hello World” program in JavaScript, as we will learn, is exceptionally easy
    and requires more than 3 lines of code.


    # What You''ll Need


    Since JavaScript is interpreted by the browser itself, we don''t need any fancy
    compilers or additional software to write JS programs. All you need is:


    +   - A text editor. Your humble Notepad will do fine, but we highly recommend
    Notepad++ (free).

    - A web browser. You can use anything you want – Google Chrome, Firefox, Internet
    Explorer or Safari.


    # 1.2.1 Getting Started: Creating the HTML Framework


    JavaScript programs are usually embedded within the web page itself. This means
    they are written along with the HTML, though you can include them externally as
    well.


    To get started, we will create a simple HTML file where we can include our JavaScript.


    Open your text editor and type the following code into it:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <title>JavaScript Hello World</title>

    </head>

    <body>

    <h1>JavaScript Hello World Example</h1>

    </body>

    </html>

    ```


    Save this file as test.html (make sure to save as ‘All Files’ if using Notepad).

    This is a standard HTML template, nothing special about it. It should be pretty
    clear to anyone with even a basic grasp of HTML.


