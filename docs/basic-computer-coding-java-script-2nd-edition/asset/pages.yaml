  md: "# Basic Computer Coding: Java Script\n\n| Which font do I use? | Which font\
    \ do I use? ↗ |\n|---|---|n| Which font do I use? | Which font do I use? |\n|\
    \ Which font do I use? | Which font do I use? |\n| Which font do I use? | Which\
    \ font do I use? |\n\nThere’s a lot of debate as to whether forms look better\
    \ using the system default styles, or customized styles designed to match your\
    \ content. The decision is yours to make, as the designer of your site, or Web\
    \ application.\n\n# 4.3.3 Box Model\n\nAll text fields have complete support for\
    \ every property related to the CSS box model (width, height, padding, and border).\
    \ As as before, browsers rely on the system default styles when displaying these\
    \ widgets. It is up to you to define how you wish to blend them into your content.\
    \ If you want to keep the native look and feel of the widgets, you’ll face a difficulty\
    \ if you want to give them a consistent size. This is because each widget has\
    \ its own rules for border, padding and margin. So if you want to give the same\
    \ size to different widgets, you have to use the box-sizing property:\n\n```\n\
    input, textarea, select, {\n  width: 150px;\n  margin: 0;\n  -webkit-box-sizing:\
    \ border-box; /* For legacy WebKit based browsers *\n  -moz-box-sizing: border-box;\
    \ /* For legacy (Firefox <29) Gecko based browsers *\n  box-sizing: border-box;\n\
    }\n```\n\n| I 150px wide | I 150px wide |\n|---|---|n| I 150px wide | I 150px\
    \ wide |\n| I 150px wide | I 150px wide |\n\nChrome 22 / Windows 7"
