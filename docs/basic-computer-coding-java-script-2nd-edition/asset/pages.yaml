  md: "# 3.1.1 Defining a Function\n\nFunctions are defined, or declared, with the\
    \ function keyword.\nBelow is the syntax for a function in JavaScript\n\n```\n\
    function nameFunctionName() {\n  // Code to be executed\n}\n```\n\nThe declaration\
    \ begins with the function keyword, followed by the name of the function. Function\
    \ names follow the same rules as variables— they can contain numbers, underscores\
    \ and signs, and are frequently written in camel case. The name is followed by\
    \ a set of parentheses, which can be used for optional parameters. The code of\
    \ the function is contained in curly brackets, just like a statement or an if\
    \ statement.\n\nIn our first example, we will make a function declaration to print\
    \ a greeting statement to the console.\n\n```\n// Initialize function\ngreet()\
    \ {\n  console.log(\"Hello, World!\");\n}\n```\n\nHere we have the code to print\
    \ Hello, World! to the console contained inside the greet() function. However,\
    \ nothing will happen and no code will execute until we invoke, or call the function.\
    \ You can invoke a function by writing the name of the function followed by the\
    \ parentheses.\n\n```\n// Invoke the function\ngreet();\n```\n\nNow we will put\
    \ those together, defining our function and invoking it.\n\n```\ngreet.js\n//\
    \ Initialize greeting function\ngreet() {\n  console.log(\"Hello, World!\");\n\
    }\n```\n\n```\n// Invoke the function\ngreet();\n```\n\n> Parentheses allow a\
    \ writer to provide additional information. The parenthetical material might be\
    \ a single word, a fragment, or multiple complete sentences.\n\n> 1995, Netscape\
    \ recruited Brendan Eich with the goal of embedding the Scheme programming language\
    \ into its Netscape Navigator Before started, Netscape collaborated with Sun Microsystems\
    \ to include in Netscape Navigator Sun's more static programming language Java,\
