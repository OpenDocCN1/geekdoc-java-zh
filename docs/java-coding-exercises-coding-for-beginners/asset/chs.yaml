  \ is 0.336472\n```\n\n## 使用减法运算符除两个指定的整数\nJAVA CODE\n```java\nimport java.util.Scanner;\n\
  public class Main {\n    public static float divide_using_traction(int dividend,\
  \ int divider) {\n        if (divider == 0) {\n            return 0;\n        }\n\
  \        float result = 0;\n        while (dividend > divider) {\n            dividend\
  \ -= divider;\n            result++;\n        }\n        float decimalPart = (float)\
  \ dividend / (float) divider;\n        result += decimalPart;\n        return result;\n\
  \    }\n    public static void main(String[] args) {\n        Scanner in = new Scanner(System.in);\n\
  \        System.out.print(\"Input the dividend: \");\n        int dividend = in.nextInt();\n\
  \        System.out.print(\"Input the divider: \");\n        int divider = in.nextInt();\n\
  \        System.out.println(\"\\nResult: \" + divide_using_traction(dividend,divider));\n\
  \    }\n}\n```\nOUTPUT\n```\nInput the dividend: 900\nInput the divider: 30\nResult:\
  \ 30.0\n```\n\n## 不使用乘法运算符乘以两个指定的整数\nJAVA CODE\n```java\nimport java.util.*;\npublic\
  \ class Main {\n    public static int multiply(int n1, int n2) {\n        int result\
  \ = 0;\n        boolean negative_num = (n1 < 0 && n2 >= 0) || (n2 < 0 && n1 >= 0);\n\
  \        boolean positive_num = !negative_num;\n        n1 = Math.abs(n1);\n   \
  \     for (int i = 0; i < n1; i++) {\n            if (negative_num && n2 > 0 ||\
  \ positive_num && n2 < 0)\n                result -= n2;\n            else\n   \
  \             result += n2;\n        }\n        return result;\n    }\n    public\
  \ static void main(String[] args) {\n        Scanner in = new Scanner(System.in);\n\
  \        System.out.print(\"Input the first number: \");\n        int n1 = in.nextInt();\n\
  \        System.out.print(\"Input the second number: \");\n        int n2 = in.nextInt();\n\
  \        System.out.println(\"\\nResult: \" + multiply(n1,n2));\n    }\n}\n```\n\
  OUTPUT\n```\nInput the first number: 25\nInput the second number: 30\nResult: 75\n\
  ```\n\n## 打印和、差、平均值、距离和最小值\nJAVA CODE\n```java\nimport java.util.Scanner;\npublic\
  \ class Main {\n    public static void main(String[] args) {\n        Scanner in\
  \ = new Scanner(System.in);\n        System.out.print(\"Input 1st integer: \");\n\
  \        int firstInt = in.nextInt();\n        System.out.print(\"Input 2nd integer:\
  \ \");\n        int secondInt = in.nextInt();\n        System.out.printf(\"Sum of\
  \ two integers: %d\\n\", firstInt + secondInt);\n        System.out.printf(\"Difference\
  \ of two integers: %d\\n\", firstInt - secondInt);\n        System.out.printf(\"\
  Product of two integers: %d\\n\", firstInt * secondInt);\n        System.out.printf(\"\
  Average of two integers: %.2f\\n\", (firstInt + secondInt) / 2);\n        System.out.printf(\"\
