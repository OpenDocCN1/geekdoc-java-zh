    Java 类别和 Java Application，并点击 next（下一步）进入第二步。


    当你点击 next 按钮时，程序将给你选择项目名称的选项。当你输入项目名称时，你会发现底部的名称将更改以匹配你的项目名称，即在“Create Main Class（创建主类）”中。我们将恰当地地将项目命名为“FirstProject”。


    ![](img/image00035.jpeg)

    图 2


    在上面的图中，“Create Main Class”的名称是 `firstproject.Main`。我们不能让它保持那样，否则该类将包含“Main”名称。我们需要像下图所示将其更改为
    `FirstProject`。


    ![](img/image00036.jpeg)

    图 3


    重命名后，创建的类将带有“FirstProject”的名字。注意项目类名开头有一个大写的“F”，后面也有一个大写的“P”。此外，包名为 `firstproject`，字母是小写的“f”和“p”。


    Project Location（项目位置）文本框将会出现，并为你提供更改默认保存位置的选项。如果你希望将文件保存到默认区域以外的任何位置，可以在这里进行。此外，NetBeans
    程序还会在你选择的相同默认位置创建一个包含你项目名的默认文件夹。点击 finish（完成）按钮将提示 NetBeans 在后台工作并创建所需的文件。完成后，系统将带你回到
    IDE，你可以在那里看到并定位你所有的项目。如果万一左上角的项目区域不可见，你应该导航到菜单栏上的 `window>project tab（窗口>项目标签页）`。


    ![](img/image00037.jpeg)

