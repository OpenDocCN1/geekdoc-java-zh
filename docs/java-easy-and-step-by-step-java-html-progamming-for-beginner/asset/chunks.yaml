    Java 世界的内部原理。


    ## Java 的内部原理


    在 Java 中，你在文本编辑器上编写代码。然而，在 NetBeans 中，有一个专门的区域用于编写你的代码。你此时编写的代码是“源代码”，你用 `.java`
    扩展名保存它。创建源代码后，你必须通过运行 `JaVac` 程序来将其转换为 Java 字节码；我们称这个过程为“编译”。如果计算过程中没有错误，`JaVac`
    程序会创建一个 `.class` 扩展名的文件。这个（`.class`）文件就是你在 Java 虚拟机中运行的文件。以下是上述说明的步骤：


    1. 创建一个带有 `.java` 扩展名的源代码。

    2. 使用 `JaVac` 程序编译成带有 `.class` 扩展名的文件。

    3. 在虚拟机上运行编译后的 `.class` 文件。


    NetBeans 为你提供了在后台自动完成创建和编译的优势。它获取你的源代码并创建一个 Java 文件，然后运行 `JaVac` 来编译成 `.class`
    文件。此外，NetBeans 还可以其自身的软件中运行程序，这省去了你使用终端窗口输入长字符串命令的麻烦。


    这就是 Java 环境/世界的内部原理。由于你现在有了更清晰的理解，现在可以启动 NetBeans 软件并进入我们学习过程的下一步。


    # 理解 NetBeans 软件


    既然我们已经了解了 Java 的工作原理并安装了所有需要的软件，是时候从上一章留下的地方继续了，即启动 NetBeans 软件。


    像所有其他程序一样，如果你了解了 NetBeans 启动时会发生什么，你就不会对着屏幕发呆，不知道下一步该做什么。以下是预期的内容。


    第一次加载 NetBeans 时，系统可能会有点慢，因为它正在启动运行它所需的所有资源。请耐心等待。当程序启动后，你需要导航到 NetBeans 顶部菜单的
    `File>New Project`（文件>新建项目）开始新项目。这应该与下面的图片相似。


    ![](img/image00034.jpeg)

    图 1


