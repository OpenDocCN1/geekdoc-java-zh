    # Introduction


    Computer programming is complicated stuff, especially for the complete beginner.
    There is one thing though; with a little enthusiasm and a lot of desire to learn,
    you can learn any computer programming language. Java Html is the most popular
    programming language, even more popular than `C++` or other computer languages.
    This makes it a must learn for any budding programmer.


    Java as a language has gotten a lot of press coverage in recent times. Part of
    this extensive coverage is the fact that the media touts Java as a complete change
    in the normal or traditional way of programming. How so? The media holds the view
    that the language has intentions firmly in being a vehicle for `OOP` (object-oriented
    programming) which the media also touts as a serious change to the standards of
    programming. While the statement may hold some truth, Codes and data structures
    in `OOP` have different arrangement, and the `OOP` environment does indeed have
    the potential to produce safe, clear, and modular programs. You should not be
    so quick to buy into the media hype; after all, programming is programming, and
    the same frame of mind required to create programs is similar across the board
    regardless of the language used. In fact, anyone who has been in the coding world
    will tell you that every now and then, there are imaginary illusions of programs
    that will “have a ripple paradigm shift effect” only for them to fall short of
    the expectations of the computer that designed them. Nevertheless, this is not
    to mean that Java is short of exceptional.


    While learning any new language may be a challenge, nothing is impossible if you
    have the correct approach. This is something we shall look at in a chapter of
    this book. Rather than dedicating an entire chapter on the importance of Java,
    which I am sure you already know otherwise you would not be here, I will simply
    state some of the characteristics of Java that make it such a powerful language.


    - While it may not exactly be `OOP`, it is the closest you will get. This makes
    it a “cleaner” language than `C++` or any other computer programming language
    for that matter. It also makes it easy to make modular programs and reusable code.

    - Java as a language is not platform dependent. This means you can write a program
    the same manner regardless of whether you are running `OSX`, `UNIX`, or `Windows`.

    - The language is distributed making it easy to do distributed computing thanks
    to its networking capability, which is integrated into the language.

    - Java is also very secure with the interpreter, compiler, language and run time
    environment developed with security in mind.

    - Early error detection in Java is quite easy since `java` compilers can detect
    problems long before the problem even gets to the execution time.

    - Java is also multithreaded, which means that you can do several tasks simultaneously
    unlike in other programs where you need to have some program specific procedures
    for multreading.


    # Java For The Complete Beginner Or Novice


    While Java is an exciting language, it is easy to get lost in the maze. This is
    because to create programs using the language, you need to install a few computer
    peripherals and programs. This is before you can write a single code. The tool
    (software) also Interface development interface (`IDE`) we need to write our code
    is `NETBEANS`, which is the most popular `IDE` for writing programs in Java. Here
    is the kicker; while it is easy to navigate to the `NETANS` URL and download the
    program, things are never that easy. For `NETBEANS` to operate (load up) on your
    system, you need to install some necessary Java files and components. First, you
    need the Java Virtual Machine.


    ## Java Virtual Machine


    We have already stated that Java is independent from any platform and will run
    on any modern operating system; this component is the reason why Java does not
    care what OS you are running. `Java Virtual Machine` is the program that interprets/processes
    your code correctly. The program is one of the mandatory programs you must install
    before you can create any Java code or program. You can download the program from
    the relevant website.


    P.s. Across the web, there are many sources of Java related programs. I suggest
    you only download all your files from the official Sun Microsystems website, Java’s
    parent company.


    Once you are on the website, you can proceed to download the Java Virtual machine
    also known as `JRE` (Java Runtime Environment). Additionally, while on the website,
    you can check whether your computer is running a version of `JRE` by clicking
    on the relevant “do I have Java?” link. The resulting search result will tell
    you the version of `JRE` running on your computer, if any.


    If you do not have the program installed, install it and restart your computer.


    Next is the Java Software development Kit


    ## Java Software Development Kit

