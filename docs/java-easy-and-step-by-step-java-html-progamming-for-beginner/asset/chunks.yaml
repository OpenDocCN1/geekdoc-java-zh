  trans: "\n\n![](img/image00051.jpeg)\n\n图 18\n\n如果你双击 `dist` 文件夹，你会得到以下内容\n\n![](img/image00052.jpeg)\n\
    \n图 19\n\n在上面的图 19 中，`dist`文件夹中的文件就是你要发送给你的“程序员朋友们”的内容。在文件中，有关于如何在控制台或终端窗口运行程序的指令。将文件发送给你的朋友，等待他们对你的编程造诣感到惊叹。\n\
    \n# 理解 Java 变量\n\n作为一名刚出炉的程序员，你将想要通过练习来提高你的编程技能。Java 程序通过操作内存中存储的数据来工作。就像数据库会有可变的数据一样，这些内存中的数据也是可变的，这意味着数据可以是对象、文本、数字或指向其他内存区域的指针等形式。每条数据都有一个分配的名称，以便在需要时更容易地调用这些数据。分配给这些数据的名称和值被称为“变量”。让我们从查看数值开始。\n\
    \n在 Java 中存储数字有许多选择。对于存储整数（例如 8-10-12），你使用整数（`int`）变量。要存储 8-4-10-5-12-8 等，你使用\
    \ `double` 变量。使用等号 (=) 进行存储。通过我们的第一个源代码，让我们来看一些示例。\n\n要设置一个整数（整数字），你需要将下面的代码添加到你的“my\
    \ first project”项目的 `main` 方法中。\n\n```java\npublic static void main(String[ ]\
    \ args) {\n    int first_number;\n    System.out.println(\"My First Project\"\
    );\n}\n```\n\n为了让 Java 识别出你正在存储一个整数，你首先需要输入单词 `int` 并在后面跟一个空格。接下来，你需要为你的整数变量取一个名称。虽然你可以给整数变量起任何你名称，但在命名时，你必须考虑一些规则。\n\
    \n- 变量名不能以数字开头。这意味着使用 `first_number` 作为你的变量是可以的，但使用 `1st_number` 则是不行的。这并不意味着你不能在变量名的其他地方使用数字；它不能位于开头。\n\
    - 变量名不能与 Java 关键字相同。这些关键字有很多，而且 NetBeans 会将它们变成蓝色，就像上面 `int` 的示例一样。\n- 你的变量名不能包含空格。如果我们在变量声明中使用\
    \ `int first number`，我们将得到错误，因此使用了下划线。此外，第一个单词以小写字母开头而随后的单词大写字母的情况并不罕见，例如 `firstNumber`\
    \ 或 `myFirstNumber`。\n- 变量名对大小写敏感。这意味着 `firstNumber` 和 `FirstNumber` 之间是有的。\n\n\
    当你需要在名为 `first_number` 的变量中存储内容时，你需要输入一个等号，后面跟着你想要存储的值。遵循下面的代码。\n\n![](img/image00053.jpeg)\n\
    \n在上面的代码中，我们正在告诉 Java 我们想在我们恰好命名为 `first_number` 的整数变量中存储一个 10 的值。如果你愿意，也可以用一行完成上述操作。\n\
    \n![](img/image00054.jpeg)\n\n为了看到它是如何工作的，你需要将 `println` 方法修改为如下：\n\n```java\n\
    System.out.println(\"First number = \" + first_number);\n```\n\n现在我们在 `println`\
    \ 的圆括号之间有了用双引号包围的直接文本。\n`(\"First number = \"`\n\n此外，我们在 `+` 符号后面跟着我们的变量名 `+ first_number\
    \ );`\n\n`+` 符号简单意味着连接。这意味着我们正在将变量名与直接文本连接。这种连接过程就是我们说的拼接（concatenation）。\n\n\
    下图（图 20）说明了你的代码窗口将如何显示。你应该注意每行以分号结尾的次数。\n\n![](img/image00055.jpeg)\n\n图 20\n\n\
    如果你运行程序，这里是输出窗口底部应该显示的内容\n\n![](img/image00056.jpeg)\n\n图 21\n\n我们存存储在名为 `first_number`\
    \ 的变量中的变量 `number` 位于 `=` 符号后的第一个输出中。\n\n如果我们做一些加法会怎样？让我们再添加两个 `int` 变量。一个将存储第二个数字，另一个将存储答案。\n\
    \n![](img/image00057.jpeg)\n\n在 Java 中，我们可以像上面那样在同一行中写三个变量名，但只有当变量类型相同时才可以，在我们的例子中是\
    \ `int`。此外，你会注意到每个变量名之间通过逗号隔开。\n\n我们的新变量看起来是这样的：\n\n![](img/image00058.jpeg)\n\
    \n对于 `answer` 变量，我们需要加上第一个和第二个数字（`first+second`）。在大多数编程中，我们使用 `(+)` 符号进行加法。这提示\
    \ Java 相加 `first_number` 和 `second_number` 中的值。此外，当它相加值时，它会将总和存储在等号左边的变量中。这意味着与其给变量名赋值\
    \ 10 或 20，它会自动将它们相加并赋值。下图（图 22）描述了我们刚刚看到的内容。\n\n![](img/image00059.jpeg)\n\n图\
    \ 22\n\n上面的图也可以等同于：\n\n```java\nanswer = 10 + 20;\n```\n\n然而，Java 已经知道两个变量 `first_number`\
    \ 和 `second_number` 内部的值，这意味着你可以直接使用名称。\n\n为了获得输出，我们需要再次修改我们的 `println` 方法为：\n\
    \n![](img/image00060.jpeg)\n\n你应该注意到我们正在组合被双引号包围的直接文本。这里是你的代码窗口现在应该显示的图。\n\n![](img/image00061.jpeg)\n\
    \n图 23\n\n再次，当你运行程序时，下图是在你的输出窗口上应该显示的内容\n\n![](img/image00062.jpeg)\n\n图 24\n\n\
    这是我们的程序完成的任务列表：\n1- 存储了一个数字\n2- 存储了第二个数字\n3- 将两个数字相加\n4- 将加法结果存储在第三个变量中\n5- 打印出这些结果\n\
    \n此外，我们可以直接使用数字。要这样做，你需要将 `answer` 那行改为如下：\n\n```java\nanswer = first_number +\
    \ second_number + 12;\n```\n\n现在运行你的程序并注意打印了什么。注意代码中的微小变化是如何影响整体输出的。\n\n`int`\
    \ 值的最大值为 2147483647，这意味着你可以存储的数字很大。如果你需要一个负数，最低值是 -2147483648。比这更大的值需要双精度类型。\n\
    \n# 最后建议\n\n情况是这样的：在学习的初始阶段使用 Java 编程需要大量的耐心。记住，当事情进展不如顺利时，很容易失去希望。坚持下去，你将获得使用\
    \ Java 编程的奇妙且甜美的果实。编程就是关于犯错、从中学习，并随着进步编写更好的代码。\n\n作为一名程序员，你不能忽视 Java 在我们所生活的计算机解放世界中的重要性。如果你想取得成功，就必须理解这门非常重要的语言。此外，今天开发的大多数系统越来越多地使用\
    \ Java，并在创建数据库和应用程序时放弃其他语言。使用 Java 所需的操作环境是免费的，这一事实也有助于它推向最佳编程语言列表的顶端。\n\n"
