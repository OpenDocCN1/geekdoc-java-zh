    当这种情况发生时，我们将其称为灰色注释。在程序的运行阶段，这些灰色的（注释）是无关紧要的。这意味着你可以使用注释功能来说明或解释你正在创建的代码想要实现的目标。你可以通过输入两个斜杠后跟注释内容来实现这一点。这里有一个示例。


    ```java

    //在此处放置你的单行注释

    ```


    你可以通过以下任一方式拥有多行注释：


    ```java

    //我们正准备

    //将注释拆分为两行

    ```


    或者


    ```java

    /*

    此注释跨越了两个行

    */

    ```


    如果你查看上面的注释，你会发现它以 `/*` 开头，以 `*/` 结尾。


    此外，如果你查看上一张图片（图 8），你会发现有些注释以单个正斜杠和两个星号 (`/**`) 开头，以一个星号和一个正斜杠结束；这被称为 Javadoc 注释。例如：


    ```java

    /**

    *这是一个 Javadoc 注释的示例

    */

    ```


    这种代码用于代码文档。如果你认为这对他们有帮助，可以将文档化的代码转换为 HTML 页面并与他们共享。你可以通过点击 NetBeans 菜单中的运行来访问
    Javadoc 注释；在运行菜单中，你应该选择 `Generate Javadoc`。随着你编程能力的提高，这将非常有用。然而，现在没什么可看的，因为我们目前还做得不多。你也可以选择删除
    Javadoc 注释。以下是我们的代码没有注释的样子：


    ![](img/image00042.jpeg)


    图 9


    接下来，我们学习如何运行程序以及代码的结构。


    # Java 代码的结构以及如何运行程序


    在我们结束上一章节时，我们清理了代码（参见图 9）。在图中，你应该注意到包名排在最前面。此外，你应该注意分号是行的结束标记。分号是非常重要的，如果由于遗漏了它，程序将无法编译。


    ```java

    package firstproject;

    ```


    接下来是类名


    ```java

    public class FirstProject {


    }

    ```


    理想情况下，你应该将类看作一个代码段。然而， Java 规定你必须告诉它代码段的开始和结束。你可以通过使用大括号来实现这一点。你可以在代码的开头使用左大括号，并使用右大括号结束代码
    `{这是一个大括号代码段的示例}`，但你应该注意，左右大括号内部的任何内容都是该代码段的一部分。此外，类左右大括号内部的任何内容实际上都是一个代码段。这就是我的意思是：


    ```java

    public static void main( String[ ] args ) {


    }

    ```


    比其他任何事情都重要的是 `main` 这个词。为什么？因为每当任何 Java 程序启动时，它都会首先寻找名为 `main` 的方法。简单来说，方法是一段代码。程序随后执行大括号内的代码作为
    main 的部分。如果你的代码中没有 `main` 方法，你可能会在 Java 程序中收到错误消息。然而，由于这是程序的程序的入口点，你不太可能遗漏它。


    代码的公共部分（蓝色部分）仅意味着该方法在类外部是可见的。另一方面，`static` 意味着不需要创建新对象，而 `void` 意味着没有返回值，命令将继续执行。


    命令行参数是 `main` 圆括号之间的部分。除了技术细节外，你不应该担心这些。你只需要努力记住我们的类是 `FirstProject`，它包含了方法 `main`，并且类和
    main 都使用它们自己的一组大括号。你还应该记住，代码的很大一部分是类 `FirstProject` 的一部分。


    # 如何运行 Java 程序


    你在 NetBeans 上运行的任何程序都会直接在输出窗口中运行，你可以在屏幕底部代码正下方找到输出窗口。这种设计是有逻辑的，因为输出窗口可用，你不需要调用控制台窗口或终端，因为在
    NetBeans 中，输出窗口充当了控制台。


    在 NetBeans 中，你可以通过多种方式运行程序，最简单的是在键盘上按下 `F6` 键。你也可以使用 NetBeans 顶部的菜单来运行程序。在菜单中，找到
    `Run` 菜单并执行 `run main project` 。


    ![](img/image00043.jpeg)


    图 10


    在 NetBeans 工具栏上，你会看到一个“绿色播放”箭头；你可以用它来运行程序。


    ![](img/image00044.jpeg)


    图 11


    你也可以通过导航到项目窗口来运行程序。这对于确保运行的是正确的源代码特别为有效。要做到这一点，你需要点击项目窗口中的 java 源文件，然后右键点击查看选项。执行
    `run` 命令。见下方所示。


    ![](img/image00045.jpeg)


    图 12


    如果你对我们目前的代码使用上述任何程序执行方法，你应该应该在输出窗口中得到类似于图 13 的内容


    ![](img/image00046.jpeg)


    图 13


    在上面的图 13 中，你可以看到第一行是 `run` 命令。第二行是我们的代码“My Code”。如果你对某些内容不确定并想再次运行，你可以查看图 13 上方的绿色箭头。


    # 关于输出窗口的所有信息


    到目前，我们可以创建一个代码并将其转换为程序。如果我们使用我们目前代码的示例，我们就可以成功将其转换为程序，尽管它目前没做什么。在接下来的学习步骤中，我们将开始输出文本到控制台，我们在
    main 方法中添加以下代码：


    ```java

    public static void main( String[ ] args ) {


    System.out.println( "My Project" );

    }

    ```


    提示：在 `System` 之后输入句号后，NetBeans 将显示一组供选项，类似于图 14。


    ![](img/image0047.jpeg)


    图 14

