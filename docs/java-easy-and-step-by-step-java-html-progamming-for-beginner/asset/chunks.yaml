    # 引言


    计算机编程是一项复杂的工作，对完全初学者来说尤其是。但有一点：只要有一点热情和大量的学习欲望，你可以学习任何计算机编程语言。Java 是最流行的编程语言，甚至比
    `C++` 或其他语言还要流行。这使其成为任何初出程序员的必修课。


    作为一种语言，Java 最近引起了大量的媒体报道。这些广泛报道的一部分是，媒体宣称 Java 是对常规或传统编程方式的彻底改变。这是如何呢？媒体认为这种语言的初衷是成为
    `OOP`（面向对象编程）的媒介，媒体也宣称这是对编程标准的重大变革。虽然这一说法可能有些道理，但 `OOP` 中的代码和数据结构有不同的安排，而且 `OOP`
    环境确实具有产生安全、清晰和模块化程序的潜力。你不应该如此快地接受媒体的炒作；毕竟，编程就是编程，无论使用哪种语言，创建程序所需的心态都是相似的。事实上，任何进入过代码世界的人都会告诉你，每隔一段时间就会出现某些程序将“产生范式转移效应”的幻想幻象，但它们往往无法达到设计它们的计算机的预期。尽管如此，这并不意味着
    Java 并不出众。


    虽然学习任何新语言可能是一项挑战，但如果你有正确的方法，一切皆可能的。我们将在本书的一个章节中讨论这一点。我不会花整一章来介绍 Java 的重要性（我确定你已经知道了，否则你不会来这里），我将简单说明
    Java 的一些特性，这些特性使其成为强大的语言。


    - 它可能不完全是 `OOP`，但它是你最接近它的。这使其成为一种比 `C++` 或任何其他计算机编程语言更“干净”的语言。它还让创建模块化程序和可重复代码变得容易。

    - Java 这种语言不依赖平台。这意味着无论你运行的是 `OSX`、`UNIX` 还是 `Windows`，都可以以相同的方式编写程序。

    - 该语言是分布式的，得益于集成在语言中的网络功能，易于分布式计算。

    - Java 非常安全，其解释器、编译器、语言和运行时环境在开发时考虑了安全性。

    - Java 的早期错误检测非常容易，因为 `java` 编译器可以在问题到达执行时间很之前检测到问题。

    - Java 还是多线程的，这意味着你可以同时执行多个任务，而其他程序需要特定的多线程程序。


    # 面向完全初学者或新手的 Java


    虽然 Java 是一种令人兴奋的语言，但在迷宫中很容易迷失。这是因为要使用该语言创建程序，你需要安装一些计算机外设和程序。这是在编写代码之前。我们编写代码所需的工具（软件）集成开发环境（IDE）是
    `NetBeans`，它是编写 Java 程序最流行的 `IDE`。关键在于；虽然导航到 `NetBeans` URL 并下载程序很容易，但事情并非如此简单。为了让
    `NetBeans` 在你的系统上运行（加载），你需要安装一些必要的 Java 文件和组件。首先，你需要 Java 虚拟机。


    ## Java 虚拟机


    我们已经说过 Java 是独立于任何平台的，可以在任何现代操作系统上运行；这个组件正是 Java 不在乎你运行什么操作系统的原因。`Java 虚拟机` 是解释/处理你代码的程序。


    '
- fmt: '

    After installing the JRE, we are not yet ready to write our first code. At this
    point, all we have done is installing the support software needed to run Java
    programs on your computer. You need a tool to write and test code, the Software
    Development kit, which you can also download from the [Sun Microsystems official](http://www.oracle.com/technetwork/indexes/downloads/index.html?ssSourceSiteId=ocomen)
    website. I suggest that you download the Java SE (standard edition) and additionally,
    the `JDK 6` that you will find on the Java SE page. When you navigate to the `JDK
    6` page, you might get confused because there are many options. Depending on the
    IDE you are using, you can select the relevant option. In our case, we are using
    NETBEANS so you should locate the following `JDK 6 Update X` with `NetBeans 6.x`.


    Click on download and head over to the next page to select a download file relevant
    to your operating system. Download and install the file. It is important to note
    that the file is a compressed file of over 130 bytes so you should ensure your
    internet connection is working while you perform the download, otherwise the file
    might corrupt halfway through the download. So far, we have done everything right.
    We have downloaded and installed the necessary environments and software needed
    to write your first code. However, before we launch the applications we have installed,
    we need to understand the inner working of the world of Java.


    ## Inner workings of Java


    In Java, you write your code on a text editor. However, in NetBeans, there is
    a special area designated for writing your code. The code you write at this point
    is “the source code” and you save it with the file extension `.java`. After you
    create the source code, you have to turn it into Java Byte Code by running it
    through the `JaVac` program; we call this process “compiling”. The `JaVac` program
    then creates a `.class` extension file if there are no errors in the computing
    process. This (`.class`) file is the file you run in the Java Virtual Machine.
    Here is the above explanation in steps:


    1. Create a `.java` extension source code.

    2. Compile a `.class` extension file by using the `JaVac` program.

    3. Run the complied `.class` file on the Virtual machine.


    NetBeans offers you the advantage of creating and compiling for you, behind the
    scenes. It takes your source code and creates a Java file, then it runs `JaVac`
    to compile the `.class` file. In addition, NetBeans can also run the program within
    its own software, which saves you the trouble of using a terminal window to type
    long strings of commands.


    This is the inner working of the Java environment/ world. Because you now have
    a clearer understanding, you can now proceed to launch the NetBeans software and
    proceed to the next step of our learning process.


    # Understanding the NetBeans Software


    Now that we have seen the working of Java, installed all the required software,
    it is time we pick up from where we left in the previous chapter i.e. launching
    the NetBeans software.


    Like every other program, if you learn what to expect when NetBeans launches,
    you will not stare at your screen blankly wondering what to do next. Here is what
    to expect.


    The first time you load NetBeans, the system may be a bit slow as it starts all
    the resources required to run it. Be patient. When the program does start, you
    need to navigate to start new project which is on `File>New Project` part of the
    NetBeans menu at the top. This should be similar to the Image below.


    ![](Images/image00034.jpeg)

    Figure 1


    If you look at the above figure, you will notice that the dialog box on the far
    right hand side has options of the kind of projects you want to create. You can
    create projects in all the forms available there. In our instance, we are creating
    a Java application. Therefore, we need to select the Java category and Java application
    in the project tab and click on next to move on to step two.


    When you click on the next button, the program will give you the option of choosing
    a name for your project. As you type the name of your project, you will notice
    that the name at the bottom will change to match the name of your project i.e.
    in “Create Main Class.” We shall aptly name our project “FirstProject”.


    ![](Images/image00035.jpeg)

    Figure 2


    In the above figure, the “Create Main Class” name is `firstproject.Main`. We cannot
    leave it like that otherwise; the class will contain the name “Main”. We need
    to change it to `FirstProject` as shown in the figure below.


    ![](Images/image00036.jpeg)

    Figure 3


    After renaming, the class created will bear the name “FirstProject”. Notice that
    the project class name has a capital “F” at the start and a capital “P”. Additionally,
    the package name has the name `firstproject` with a lower case “f” and “p”.


    The Project Location text box will appear and offer you the option of changing
    the default save location. If you would prefer to save the file on any other location
    than the default area, you can do it here. Additionally, the NetBeans program
    will also create default folder containing your project name in the same default
    location you opt for. Clicking on the finish button will prompt NetBeans to work
    in the background and create the necessary files for use. When it is through,
    the system will return you to the IDE where you can see and locate all your projects.
    If by any chance the project area found in the top left corner is not visible,
    you should navigate to the `window>project tab` on the menu bar.


    ![](Images/image00037.jpeg)

    Figure 4


    You can expand your project by pressing `+`, after which, your project will look
    similar to the figure below.


    ![](Images/image00038.jpeg)

    Figure 5


    You should then click `+` on the source to expand it and peek at your project
    name. We are doing this to see our Java source code. This is shown in the figure
    below.


    ![](Images/image0039.jpeg)

    Figure 6


    The source code (the same source code) should appear on the right in the text
    area and will bear the name `FirstProject.java`. Sometimes, the code window will
    not display. This is not something to be overly concerned about, simply click
    and press enter on the `FirstProject.java` available in your project window to
    call up the code window; after this, you can start on your code. Here is a sample
    image of the coding window. The `@author` you part is where your name as an author
    will appear.


    ![](Images/image00040.jpeg)

    Figure 7


    You should note that the class bears the name `FirstProject`.


    ```java

    public class FirstProject {

    ```


    How so you wonder? After all, this is actually the same name as that of your java
    source file available on your project window, `FirstProject.java`. There is a
    simple explanation for this. The complier demands of it. Once you run a program,
    the class name and the source file must match for the compiler to work. What does
    this mean? It means that if your `.java` file bears the name `firstproject` while
    the class bears `FirstProject`, you will receive a compile error simply because
    the letter class do not match, i.e. the first one is lower class while the second
    one is upper class.


    Remember that our whole project bears the name `first project` as a working experiment;
    you can name your package any other name such as `anyprogram` the name package
    does not necessarily have to bear the same name as the java source file or the
    class found in the source file. The only two that must match are the name of the
