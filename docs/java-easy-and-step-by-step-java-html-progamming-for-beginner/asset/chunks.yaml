    ## The inner workings of Java


    In Java, you write your code on a text editor. However, in NetBeans, there is
    a special area designated for writing your code. The code you write at this point
    is “the source code” and you save it with the file extension .java. After you
    create the source code, you have to turn it into Java Byte Code by running it
    through the JaVac program; we call this process “compiling”. The JaVac program
    then creates a .class extension file if there are no errors in the computing process.
    This (.class) file is the file you run in the Java Virtual Machine. Here is the
    above explanation in steps


    1.  Create a .java extension  source code


    2.  Compile a .class extension file by using the JaVac program


    3.  Run the complied .class file on the Virtual machine


    NetBeans offers you the advantage of creating and compiling for you, behind the
    scenes. It takes your source code and creates a Java file, then it runs JaVac
    to compile the .class file. In addition, NetBeans can also run the program within
    its own software, which saves you the trouble of using a terminal window to type
    long strings of commands.


    This is the inner working of the Java environment/ world. Because you now have
    a clearer understanding, you can now proceed to launch the NetBeans software and
    proceed to the next step of our learning process.


