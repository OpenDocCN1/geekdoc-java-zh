    When this occurs, we call the grey’s comments. In the running stages of the program,
    the grey’s (comments) are moot. This is to mean that you can use the comment feature
    to state or explain what the code you are creating wants to achieve. You can achieve
    this by typing two slashes and then the comment. Here is a sample.


    ```

    //Place your single line comment here

    ```


    You can have more than one comment line by doing either of the following:


    ```java

    //We are going to

    //spread the comments into two

    ```


    Or


    ```java

    /*

    This comment spreads over two lines

    */

    ```


    If you look at the comment above, you will notice that it starts with `/*` but
    ends with `*/`.


    Additionally, if you look at the previous image (figure 8) you will notice that
    there are comments that begin with a single forward slash and two asterisks (`/**`)
    but end with one asterisks and one forwards slash; this is called a Javadoc comment.
    For example


    ```java

    /**

    *Here is an example of a Javadoc comment

    */

    ```


    This type of code is for code documentation. You can then turn the documented
    code into a HTML page that you can share with others if you think it will be helpful
    to them. You can access the Javadoc comments by clicking run on the NetBeans menu;
    from the run menu, you should select `Generate Javadoc`. This will be useful as
    your coding prowess manifests. However, there is not much to see right now because
    we have not done much as of yet. You can also choose to delete the Javadoc comments.
    Here is how our code would look without the comments


    ![](Images/image00042.jpeg)


