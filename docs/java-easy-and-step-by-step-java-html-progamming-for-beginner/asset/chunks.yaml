    The public part of the code (the blue part) simply means that the method is viewable
    outside that class. On the other hand, static means that the creation of a new
    object is not necessary while void means that, there is not returnable value and
    the command gets on with it.


    Command line arguments are the parts between the round brackets of the main. Except
    for the technical bits, you should not concern yourself with this. You should
    only strive to remember that our class is FirstProject, which contains the method
    main and that both the class and the main use their own set of curly brackets.
    You should also remember that a huge part of your code is part of the class FirstProject.


    ## How to run Java programs


    Any program you run on NetBeans will run on the output window that you can find
    at the bottom of your screen directly underneath your code. This design is logical
    because, with the output window readily available, you do not have to call up
    the console window or the terminal because in NetBeans, the output window plays
    the role of the console.


    In NetBeans, you can run a program in a number of ways with the easiest being,
    pressing the F6 key on your keyword. You can also use the menus found at the top
    of NetBeans to run the program. In the menus, locate the menu Run and execute
    the run main project option. Check out the figure below.


    ![](Images/image00043.jpeg)


    Figure 10


    In the NetBeans tool bar, you will notice a “green play” arrow; you can use this
    to run a program.


    ![](Images/image00044.jpeg)


    Figure 11


    You can also run a program by navigating to your projects window. This is especially
    effective in ensuring that the correct source code is running. To do this, you
    need to click on your java source file contained in the project window and then
    right click for options. Execute the run command. See figure below.


    ![](Images/image00045.jpeg)


    Figure 12


    If you use any of the program execution methods above on our code so far, you
    should get something similar to figure13 below on the output window


    ![](Images/image00046.jpeg)


    Figure 13


    In figure 13 above, you can see that the first line is the run command. The second
    is our code “My First Project.” If there is something you are not sure of and
    would like to run the code again, you can simply press the “two almost fast-forward
    green arrows” visible on figure 13 above.


    # Everything About The Output Window


    So far, we can create a code and turn it into a program. If we use the example
    of the code we have made so far, we can successfully turn it into a program even
    though it will not do much. For our next learning step, we are going to add a
    code to our project to gauge how it works. We will begin by outputting text to
    the console frame, and then we are going to add the line below to our main method.


    public static void main( String[ ] args ) {


    System.out.println( "My First Project" );


    }


    P.s. After typing the full stop after the “System”, NetBeans will display a list
    of options that you can choose from, similar to figure 14 below.


    ![](Images/image00047.jpeg)


    Figure 14


    If you double click out, it will become part of your code, after which, you can
    type another full stop. After this full stop, another list of options will pop
    up. See figure 15 below.


    ![](Images/image00048.jpeg)


    Figure 15


    When this list pops up, select println ( ). This prints a line to the output window.
    However, there has to be text between the round brackets of printIn “()” the text
    goes between the par of double quote as elaborated in figure 16 below


    ![](Images/image00049.jpeg)


    Figure 16


    Once the double quotes are in place, type your text between then (like when writing
    present spoken word) as illustrated in figure 17 below.


    ![](Images/image00050.jpeg)


    Figure 17


    If you look at figure 17 above, you will notice that the line ends in a semicolon.
    This is synonymous with every complete line of code in Java; a missing semicolon
    will make the program return errors and fail to compile.


    We need to save our work before we test it out; click on the save option or the
    save all option on the NetBeans tool bar.


    Always remember to test your work each time you add any new code to the source
    code. This is to make sure that your work does not have any error and to make
    sure that you do not write several codes with many errors.


    How To Share Your Java Programs


    Every programmer will tell you that the best way to test out your programs is
    to send it to colleagues for testing. To share, you need to create a JAR file
    (Java archive file). Luckily, NetBeans can compile the files for you straight
    from the menu. You need to navigate to the run menu and select “clean and build
    main project.”


    Once you do this, NetBeans saves your complete work inclusive all necessary files
    in the local directory in a “dist” folder. See figure18 below.'
