    ![](img/image0039.jpeg)

    图 6


    源代码应该出现在右侧，并带有 `FirstProject.java` 的名称。有时，代码窗口不会显示。这并不是需要过度担心的事情，只需点击项目窗口中的 `FirstProject.java`
    即可调用代码窗口；之后你就可以开始编写代码了。这里是代码的示例图像。@author 部分是你作为作者的名字出现的地方。


    ![](img/image00040.jpeg)

    图 7


