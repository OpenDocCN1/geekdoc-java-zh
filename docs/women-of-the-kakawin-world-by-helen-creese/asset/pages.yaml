  md: '# Balinese Kakawin


    The Balinese period of kakawin literature can be further subdivided into a Balinese
    and a Lombok tradition because, from the early eighteenth century until the end
    of the nineteenth century, kakawin poets were also based at the Balinese courts
    established in the western part of the neighboring island of Lombok.¹16 More than
    one hundred and fifty works that can be broadly classified as belonging to the
    kakawin genre and were composed largely between the seventeenth and twentieth
    centuries in Bali and Lombok have now been identified.¹17


    The Balinese kakawin corpus displays a diversity that is only hinted at the Javanese
    kakawin record, which suggests that kakawin writing was widespread outside the
    royal courts. Approximately half of the existing Balinese kakawin works are epic
    kakawin. The remaining works are shorter lyrical poems and are concerned with
    a variety of topics, including religious, and didactic themes.¹18 A small number
    of kakawin also deals with poetry, meter, and the craft of kakawin composition,
    and there are a number of short lyrical texts that can be broadly described as
    love poems.


    Over half of the epic kakawin from Bali are dedicated to royal patrons, although
    rarely are specific patrons. Instead, references are made to the splendor and
    benevolence of the ruler, without further detail. A considerable number of epic
    kakawin of Balinese origin are dedicated not to royal patrons but to spiritual
    mentors, particularly the goddess of learning, Saraswati, and to the creative
    genius of the great poets of earlier eras. Nevertheless, a degree of chronological
    reliability for the Balinese kakawin is possible. In addition to a number of works
    that can be dated on the basis of a particular patron''s name, some individual
    works contain a chronogram (date in words) in the introduction or prologue, providing
    detailed information about the time, place, and circumstances of their composition.
    Generations of copies have also added to this store of historical data by incorporating
