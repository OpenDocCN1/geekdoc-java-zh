  md: '# Glossary


    This glossary lists the foreign terms used most frequently in this study, including
    words left untranslated in the kakawin extracts. Words that are used only once
    or are glossed in the text or notes have generally not been included. Although
    many of the terms are also known in Sanskrit, the Old Javanese rather than Sanskrit
    meanings and spellings are given in most cases. The major source for the definitions
    of Old Javanese words is P.J. Zoetmulder, *Old Javanese–English Dictionary*.


    +   * acari. Female acarya (spiritual guide or teacher).

    adat. Tradition, custom.

    akrab kambe. See makrab kambe.

    alun-alun. The great square before the palace.

    namarang. The female wedding attendants who oversee the consumption of the union.

    amindon. Cousin. In Old Javanese and Balinese, *mindon* denotes second cousin;
    in Modern Javanese (*mindoan*), it is third cousin. See also misan; amintigta;
    naksanak.

    amisanan. Cousin. In Old Javanese and Balinese, *misan* denotes first cousin;
    in Modern Javanese it is second cousin. See also amindon; amintigta; naksanak.

    anak-anakan. Doll or anything fondled and treated like a baby; usually in the
    form of a pudak.

    andong (endong). Small ornamental plant. There are red and green varieties; in
    Bali also the name of a tree (*Calodracon jaquina*).

    arak. Distilled alcoholic liquor from palm sap.

    arwawinda. Lotus (*Nelumbium speciosum* or *Nymphaea nelumbo*).

    ardhaniswara/ardhaniswaris. “Lord who is half male”'
