    # Life Stages


    Kakawin poets are primarily interested in kakawin women in their roles as potential
    partners in marriage, and nearly every kakawin female of any importance is portrayed
    as a young woman of marriageable age or a married woman in her prime. Nevertheless,
    the poems also touch on the earlier stages of human existence and allow us to
    chart the lives of women in the inner court from the brink of adulthood as they
    prepare to embark on marriage life. Just two kakaw provide detailed descriptions
    of childhood, the thirteenth-century Death by Sumanasa Flower and the fourteenth-century
    Tale of Sutasoma. There is a marked contrast between the representations of these
    childhood experiences: Sutasoma''s childhood augurs his exalted life as archetypal
    kakawin hero, ruler, and incarnation of Buddha;s childhood represents a step along
    the path to marriage. Nevertheless, in the development of her character, insight
    can be gained into the ways of childhood in the inner court.


