    Nawanataya: A compilation of commentaries on appropriate conduct for courtiers,
    court life, and etiquette. It comprises three main sections: the Nawanataya, which
    details how a courtier should serve the king in nine key areas—game, meat, drink,
    gambling, erotic pleasures, humor, armored battles, mock combat, and poetry and
    aesthetics; the Pancawisa, an overview of the courtier’s role in ensuring that
    his master has access to enjoyment of Court; and the Tatanagara (or Kamanagara),
    “The Regulation of the Court,” which describes the roles and duties of various
    court officials. Selections from this work have been published and translated
    in Th. Pigeaud, Java in the Fourteenth Century: A Study in Cultural History.


