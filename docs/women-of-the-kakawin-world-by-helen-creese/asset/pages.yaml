    a member of the ruling family who issued an inscription in 1204. The Kresnaya
    story is depicted in reliefs dated 1375 at Candi Panaran. Editions and translations:
    Soewito Santoso, Kresnaya: The Kresna Legend in Indonesia. Unless otherwise indicated,
    translations in this study are taken from Thomas Hunter, “Kres나가.”


    Tale of Kunjakarakarna (Kunjakarakarna): Javanese kakawin telling the story of
    the efforts by the demon Kunjakarakarna to rid himself of his demonic nature.
    It is a Buddhist religious, didactic work, which the author refers to as “a story
    of dharma.” No patron is mentioned, and the poet refers to himself as Mpu Dusun,
    “Master Rustic,” suggesting that he worked outside the court. The story is depicted
    on reliefs Candi Joko near present-day Malang. Candi Joko was established in c.
    1280, but parts were rebuilt in the fourteenth century. Both the kakawin and the
    Kunjakarakarna reliefs probably date from the later period. Editions and translations:
    A. Teeuw and S.O. Robson, Kunjakarakarna Dharmakathana—Liberation through the
    Law of the Buddha: An Old Javanese Poem by Mpu Dusun.


    Tale of Sutasoma (Sutasoma): Javanese kakawin telling the story of life of Sutasoma,
    including his marriage to Chandrawati. The Sutasoma is a strongly Buddhist kakawin.
    The author is Mpu Tantular, who wrote the Victory of Arjuna. The patron is Ramamanggala
    (d. 1400), a member of the Mahapahit royal family who was the nephew and son-in-law
    of King Rajasanagara. Editions and translations: Soewito Santoso, Sutasoma: A
    Study in Javanese Vajrayana. Unless otherwise indicated, translations in this
    study are taken from Kathleen O’Brien, Sutasoma.


    Tantri Kamandaka: Old Javanese prose of uncertain dating. It comprises two sections:
    The first deals with the search by King Eswaryawara for a suitable partner and
    his subsequent marriage to Tantri the daughter of his chief minister. The second
    part of the work comprises moralistic animal fables. Editions and translations:
    C. Hooyka, Tantri Kamandaka: Een Oud Javaans Pancatantra-werking.'
