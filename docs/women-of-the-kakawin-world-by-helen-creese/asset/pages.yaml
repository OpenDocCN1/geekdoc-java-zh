  md: 'For their material well-being kakawin poets needed more than an insubstantial
    relationship with a deity or muse, no matter how spiritually uplifting, and were
    reliant on royal patronage. The major epic kakawin that have survived from both
    Java and Bali are dedicated to royal patrons, and one of the common epithets of
    patrons in these works is the lord “for whom one wears the stylus” until it snaps
    in two or is worn away.³ The reality of the existence of these patrons can be
    confirmed in epigraphical and other historical records. Religious concepts of
    divine kingship, borrowed from Indian philosophy, were crucial features of Javanese
    and Balinese structures. Writing a kakawin and offering it in homage to a royal
    patron served also to promote both the invincibility of the king and the prosperity
    of the world.


    Individual patrons were often celebrated as incarnations of gods and heroes invoked
    in the poems. They were not simply like these figures; they were regarded as divine,
    as portrait statues of Javanese rulers as incarnations of deities.³⁴ Just as kakawin
    could become temples in praise of the gods, so, in the material world, they became
    sacred objects, part of the royal regalia of individual patrons. The literary
    works themselves served to enhance the reputation and status of the patron, to
    promote the king’s activities, and to ensure victories over his enemies. The relationship
    was reciprocal, and the supernatural power of the king helped to ensure the success
    of the poet’s literary efforts.


