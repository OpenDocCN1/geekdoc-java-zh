    Documentary sources for the history of the Indonesian archipelago before the period
    of European contact in the early sixteenth century are extremely scant, and therefore
    writing the history of the region is rather like trying to put together a jigsaw
    puzzle from which most of the pieces are missing. The study of this history has
    been based on a limited body of archaeological and epigraphical data and a handful
    of textual works preserved in later copies, many from the eighteenth and nineteenth
    centuries. Most concrete historical data for the political and social history
    of ancient Java and Bali come from the royal inscriptions interspersed between
    the fifth and fifteenth centuries. The inscriptions deal largely with the endowment
    of freeholds and royal grants, and tangible historical evidence gleaned from them
    little more than a list of the reign dates of various rulers, together with some
    limited information about broad social structures and economic conditions.78


    Although recent work on the early economic history of Java, supported by archaeological
    excavations of ancient port cities, has provided new insights into economic exchanges
    and networks and material culture, the fragmentary nature of the sources has meant'
