  md: 'been undertaken. This book is therefore partly a historical study since it
    deals with texts and cultures from the past, and seeks to describe marriage in
    a historical context. From a gender studies perspective, it takes a specific interest
    in the representations of women and gender ideology, partly a focus that arises
    out of personal interest, but one that is shaped also by the prominence of women
    in kakawin themselves.


    The major concern of this book is the experiences of the women of the court—the
    kakawin world. Its focus is the noble princesses and their entourages of attendants
    and servants who live in the inner courts of the royal palaces in which the kakawin
    narratives are set. It describes their lifestyles and daily activities (chapter
    2) and traces their experiences and feelings from the first moments of sexual
    awakening through the long process of courtship to marriage and sexual fulfillment.
    It discusses the forms of the marriage contract and the importance of political
    alliances and of kinship in the choice of marriage partners (chapter 3), describes
    the ceremonies and festivities of the wedding itself (chapter 4), as well as the
    consumption of the marriage and concepts of sexuality (chapter 5), and comes finally
    to the often tragic consequences for royal women on the deaths of their bands—either
    widow burial (sati), or withdrawal from society to a mountain heritage (chapter
    6).


    Kakawin represent the public celebration of royal power and hegemonic reach through
    conquest and marriage alliance. The women depicted in kakawin, at least those
    described in the public, court-sponsored epic kakawin works that have survived,
    represent the male, elite court. The world conjured by kakawin poets is also an
    elite world, bounded by the precise restrictions of the social milieu of the court.
    Kakawin provided exemplary models of appropriate behavior for those with close
    links to the court, highlighting the social obligations of the men and women of
    the ksatriya, or warrior class, the class to which the rulers—and patrons of poetry—belonged.
    Not surprisingly, kakawin sources do not provide a general representation of society,
    but instead reflect the concerns and interests of social elites. Nearly all kakawin
    characters are noble, and even where commoners briefly enter the kakawin stories,
    they are the servants and retainers who also belong to the world of the'
