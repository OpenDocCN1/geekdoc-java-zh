  md: '# Preface


    For more than a millennium, the poets of the Indic courts of Java and Bali composed
    epic *kakawin* poems in which they re-created the *kakawin* world, the court environment
    in which they and their royal patrons lived. Yet their endeavors have remained
    relatively unmarked. Although the academic study of indigenous textual traditions
    was a hallmark of many humanities scholarship, since World War II these traditions,
    including *kakawin*, have rarely been incorporated into more broadly focused studies
    of the culture and history of the Indonesian archipelago. Still produced in Bali
    in the twenty-first century, *kakawin* have remained of ongoing interest and relevance
    to Balinese cultural and religious identities. They also provide much interest
    for contemporary scholars.


    The foundations of this book—the basic empirical spadework of sprawling the texts
    themselves—were laid down many years ago. In his seminal study of Old Javanese
    literature, *Kalangan: A Survey of Old Javanese Literature*, published in 1974,
    the renowned Old Javanese scholar, P.J. Zoetmulder, relying on *kakawin* poetry
    as the major source for his work, noted that *kakawin* provide a rich supply of
    material for a culture history of ancient Java. In response to a suggestion that
    the lengthy descriptions of royal weddings represented one such area of potential
    interest, I devoted one chapter of my doctoral thesis to this topic. It is a reflection
    of shifts in both my own academic interests and those of Indonesian and Southeast
    Asian studies more generally a single chapter has now grown into a full-length
    book.


    This book is multidisciplinary in its focus. Its primary purpose is to document
    the experiences of women belonging to the *kakawin* world, although the texts,
    by nature, reveal more about the discourses concerning women, sexuality, and gender
    than about the historical experiences of individual women. More importantly, they
    reflect the ongoing construction'
  merge: -1
