    8. The exception is the Old Javanese Ramayana, which rather than being divided
    into cantos instead comprises chapters called sarga. The Ramayana, the only surviving
    work from the Central Javanese period, is unique in many ways. C.C. Hooykas, The
    Old Javanese Ramayana: An Exemplary Kakawin as Form and Content. See Sointo Santos,
    Ramayana Kakawin; Zoetmer, Kalangan, chapter 6. Unless otherwise noted, all citations
    from the Ramayana in this book are from Thomas M. Hunter, "Ramayana."


    9. Kakawin is a nominal form derived from the root kawi ("poet"; "poetic language")
    of Sanskrit orthodoxy is generally rendered as in Indonesian languages. Thus,
    Sanskrit poetry covers kakawin in Old Javanese.


    10. Overviews of the dynastic history and political events of the Central and
    East Asia Javanese periods can be found in George Coedes, The Indianized States
    of Southeast Asia, and Keith Taylor, "The Early Kingdoms." For the history of
    the Indic courts in Bali, see Helen Creese, "In Search of Majapahit: The Transformation
    of Balinese."


    11. Pre-Islamic Javanese history is conventionally divided into two broad periods,
    the Central Javanese period, from the fifth to the twelfth century, and the East
    Javanese period, from 929 to 1527.


    12. Some kakawin draw on epic topics, but twentieth and twentyfirstcentury kakawin
    encompasses a wide range of modern concerns, including world geography, Balinese
    historical events and figures, and religious practices.


    13. The most comprehensive overview of Javanese manuscripts, including Old Javanese
    kakawin, is H. Pigeaud, The Literature of Java: Catalogue Raisonne of Javanese
    Manuscripts in the Library of Leiden and other Public Collections in the Netherlands
    (3 vols. plus Supplement). For Balinese manuscripts, see J.L.A. Brandes, Beschcribing
