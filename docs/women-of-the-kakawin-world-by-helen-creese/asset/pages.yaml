  md: '# Frameworks


    Suddenly all-enveloping darkness descended

    and an image of the prince emerged

    distinctly in the princess''s heart.

    She was shattered, flooded by the surging of lovesickness,

    overwhelmed by feelings of deep emotion.


    > […]


    She then returned to her bedchamber,

    sleeping a wink the whole night.

    dejected and sighing, she tossed and turned;

    mystified by what course she should take,

    she buried her face in the sleeping mat,

    Even the coolness of the mist that gently caressed

    her seemed violently scorching.

    Her disdain of love returned as an irresistible attack, so that

    suddenly everything brought her pain.


    (Mpu Panuluh, Hari''s Line 12:4-5, twelfth century, Java)¹


    In a scented pavilion by a princess restless, overwhelmed by

    feelings she cannot explain, feelings of both longing and trepidation.

    These feelings are a prelude to marriage, an entrée to a new world

    where she will soon exchange the familiarity of her childhood home

    for the life of a married woman. With marriage her destiny will be

