    # Kakawin Sexuality


    Kakawin celebrate the pursuit of sensual pleasure (karma)—one of the four aims
    of human existence in Hindu thought—but they are more than just narratives about
    love, marriage, and sex.³¹ They encapsulate a moral vision showing dharma, or
    right conduct, in action, and easily accessible examples of how, in the journey
    through life, human beings are constantly faced with the fulfillment or the transgression
    of their moral order. In the moral universe of kakawin, there is considerable
    dictiction outlining correct behavior for men and women in their sexual relationships.
    In their actions, the heroes andines of kakawin are role models. They embody the
    characteristics most valued by elite society—for women, physical beauty, modesty,
    shyness, obedience, and submission; for men, physical and spiritual prowess.


    The sexual relationship that lies at the heart of marriage, together with eroticism
    and aesthetic pleasure, is the central poetic motif in kakawin. There is, however,
    an ambivalence about sexuality in kakawin. In their portrayal of marriage and
    love, kakawin celebrate sexuality, they also warn of its potential harm. Love
    and women are exalted, but they represent the dangerous and polluting nature of
    sensual pleasure that constantly harass the carries for spiritual release. Not
    is only “intoxicating love . . . the greatest obstacle to release,”³² “but the
    truth about sexual union is that it puts obstacles in the way.”³³


