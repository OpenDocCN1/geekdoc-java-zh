  md: '# Notes


    # Notes to Chapter 1


    The overall framework for this book was originally outlined in my article “Images
    of Women and Embodiment in Kakawin Literature,” published in Intersections: Gender,
    History and Culture in the Asian Context 5 (2001). The ideas, and occasionally
    the text, of that article have been incorporated at different points in this book.


    +   1. Thomas M. Hunter, “Hariwangsa,” with minor modifications. Unless other-wise
    noted, all citations from Hari’s Lineage in this book are taken from Hunter, “Hariwangsa.”
    See also A. Teuw, Hariwangsa: Tekst en Critisch Apparatat.

    2. Use the term Indic in the more conventional terms Hindu-Buddhist and Hindu-Javanese
    to refer to the unique blend of religious, cultural, and social practices adapted
    in Java and Bali. Throughout its history, Indian-influenced culture and religious
    practice in the Indonesian archipelago encompassed not only Hinduism, which was
    strongly influenced by Sivism, and Buddhism, but also indigenous animist beliefs.

    3. For a comprehensive survey of Old Javanese kakawin literature, see P.J. Zoetmulder,
    Kalawang: A Survey of Old Indic Literature. Zoetmulder’s study remains unsurpassed
    as a source of information about kakawin literature. For details of the Balinese
    kakawin corpus, to which Zoetmulder pays less attention, see Helen Creese, The
    Balinese Kakawin Tradition: A Preliminary Description and Inventory.”

    4. A glossary is included for easy reference at the end of this book, as an appendix,
    which provides brief sketches of each of the principal textual sources used in
    this.

    5. For a wide-reaching analysis of the processes of Sanskritization in Java and
    in Southeast Asia more generally, see Sheldon, “The Sanskrit Cosmopolis, 300–1300:
    Transculturation, Vernacularization and Question of Ideology.” Pollock posits
    the existence of a vast cultural and religious zone of influence, which hence
    the Sanskrit elite, or cosmos, that spread throughout the Indian subcontinent
    and Southeast Asia.

    6. Although indigenous records attest their inclusion in the zone of Sanskrit
    influence, no written literary traditions that parallel those Java and Bali enable
    us to study the kakawin world are known to have existed in Sumatra and Kalimantan.

    7. For an overview of the development of the Old Javanese language, see Zoetmulder,
    Kalawang, chapter 1.'
