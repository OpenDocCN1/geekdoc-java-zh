    Throughout fourteenth and fifteenth centuries, marriages within the royal family
    of Majapahit were predominantly between cousins. Figure 3.4 and Table 3.2 show
    the relationships between the rulers of Majapahit in this period based on epigraphical
    data.¹⁴⁸ Generation after generation, the reigning monarchs of Majapahit appear
    to have married a cousin. A number of the marriages that took between members
    of the royal family outside the core line also relates.¹⁴⁹ There does not appear
    to be a clear preference for a particular kind of cousin marriage, with both parallel
    and cross-cousin marriages evident.


    These historical data provided by the fourteenth- and fifteenth inscriptions suggest
    that the marriage of cousins is so central in kakawin marriage alliances was indeed
    a preferred practice within the Javanese royal family. Endogamous marriage practices,
    and in particular cousin marriage, effectively restricted unions of royal women
    to the royal group. These alliances served to consolidate claims and differentiate
    the ruling dynasty from other members of the royal line.


    Support for the existence of marriage between cousins in pre-Islamic Java is also
    found in present-day kinship systems, where the preference for marriage with either
    a second (mamisan) or third (mindoan) cousin.'
