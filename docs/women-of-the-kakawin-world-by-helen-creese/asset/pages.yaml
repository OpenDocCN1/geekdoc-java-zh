    # The Wedding Rituals


    While the wedding guests and spectators are regaled with feasting and entertainments,
    the long series of marriage rituals begins. The rituals comprise three major phases.
    They commence with the pididukan ceremony—the installation of the bride to prepare
    her ritual and physically for the forthcoming wedding—continue with a number of
    ceremonies in which the bride and groom together receive religious blessings,
    and end with rituals of formal homage paid to the bride and groom by those invited
    to attend the marriage celebrations.


