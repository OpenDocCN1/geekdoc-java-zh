    # The Preservation of Kakawin Literature


    The preservation of the Old Javanese literary corpus is a remarkable story. Like
    all Old Javanese and Balinese textual works, kakawin were inscribed with a small
    knife on the leaves of the tal palm (Borrasus flabellifer), which were smeared
    with a black ink dye. The inscribed leaves were bound into books lontar. In the
    humid, tropical, and insect-ridden climate of Java and Bali, few of these palm
    manuscripts lasted more than one hundred years. Each work that survived the journey
    down through the centuries therefore had to be repeatedly copied and recopied.
    In the case of the earliest known literary works from Java, textual preservation
    reflects an ongoing commitment to the significance of individual works for more
    than thousand years. Equally remarkable the the fact numerous copies of these
    works are preserved in libraries or scriptorium throughout Bali, Lombok, and in
    the case of some of the earliest works, Java as well.


    It is probable that palm leaf manuscripts, which were commonly used throughout
    India and Southeast Asia for writing before paper became available, were in Java
    and Bali throughout the history of kakawin literature. There are references to
    palm leaves (ron) in inscriptions from the late Javanese period, and to palm leaves
    or boards (ripta) in East Javanese inscriptions from the twelfth and thirteenth
    centuries. Orthographically, the scripts found in Javanese and Balinese inscriptions
    from the mid-eighth century display a style that may have developed for writing
