    Tale of Kresna (Kresnayana): Javanese kakawin telling the story of Kresna’s abduction
    of and marriage to Princess Rukmini, which is also told in the Hariwangsa. The
    poet is Mpu Triguna. The poet’s patron, Rajalaya, is also the patron of Mpu Monaguna,
