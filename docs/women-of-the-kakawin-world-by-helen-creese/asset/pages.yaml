    Because the women of the *kakawin* world are defined largely in terms of their
    duties and social obligations within marriage and alliance, *kakawin* sources
    are particularly valuable for the exploration of the historical construction of
    ideas of gender. A gendered analysis of *kakawin* not only provides new insights
    into gender ideologies in the premodern Indonesian archipelago that continue to
    resonate in contemporary social practice, but also allows *kakawin* to be viewed
    from new perspectives.


    *Kakawin* narratives provide exemplary imagers for the proper conduct of human
    relationships and uphold the highly valued expression of spiritual and physical
    control. In its representations of women, and also of men, *kakawin* literature
    therefore embodies the ethics of control. This control pervades all aspects of
    the lives of the noble princes and princesses of the *kakawin* world. In the context
    of love and marriage that is the primary concern of this study, this control manifests
    itself in the control of women''s sexuality and the limits imposed on their agency
    within the core social institutions that most affected their lives, namely, courtship
    and marriage. Control is also crucial to male representations, in contrast to
    the control of female sexuality, male control comes from within than without.


    Gender differences create two distinct areas of moral concern in *kakawin*, one
    for men who occupy public and political roles, and one for women that is largely
    set in the social domain of the court. For kings and princes, the costly focus
    of the *kakawin* genre lends itself to discourse on the proper conduct for rulers
    (*nitisastra*), which can only be accomplished by means of adherence to a *dharma*
    that encompasses spiritual and social control. In this study, representations
    of men have been mainly limited to their roles as sexual partners, the primary
    roles in which their interactions with women are enacted. In the wider context
    of *kakawin* literature, however, there are many other female representations,
    including their mastery of wise counsel in the conduct and successful accomplishment
    of war against both human and nonhuman enemies, the implementation of their social
    obligations in dealing justly and righteousness with all creatures as they oversee
    the welfare of the world, and their spiritual obligations to ensure proper worship
    of the deities and the conduct of religious rites.


    In their portrayal of women, *kakawin* encompass narrow patriarchal views and
    roles that are concerned almost exclusively with the containment of female physicality
    and sexuality. Women are passive and fragile, submissive and obedient. Through
    the sequestering of women, male'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'control over women is guaranteed. Only love and desire, ultimately also under
    the control of men, are capable of galvanizing normally subdued kakawin women
    into feats of unimaginable bravery outside the safety of the inner court. Kakawin
    representations simultaneously celebrate and repress women, marginalizing them
    even as they accord them honor. For both men and women, emotion and sexual passion
    are subdued by the generally held belief in the asceticism of sexual practice.


    As products of court society, kakawin as the major court-sponsored genre of the
    Indic courts meant kakawin were incorporated into royal regalia and handed down
    from generation to generation; therefore encompassed patriarchal, hierarchical
    norms. The underlying political dimensions of the royal sponsorship of kakawin
    writing served to emphasize the public and political nature of gender interactions
    and masculistic concepts of power and prowess. The restricted social milieu of
    the kakawin world more generally meant that kakawin poets rarely interrogate values:
    the hierarchical order is taken for granted, and the life of luxury and privilege
    accepted without question.


    The kakawin poet''s view of the inner court is almost exclusively male, and frequently
    voyistic. Kakawin rely heavily on masculine discourse and utilize metaphorical
    language and images that are overwhelmingly masculine in tone, particularly in
    the violence of the depiction of sexual relationships, the ongoing imagery of
    the defeat and death of women, their bodily reactions to the changes wrought by
    the transition from childhood to physical maturity, as well as the lack of attention
    to male embodiment.


    Although the control of female sexuality within the social institutions of courtship
    and marriage provides the main narrative interest in kakawin, control of women
    more generally is a subtheme that runs through kakawin literature. In the aftermath
    of the ubiquitous battle scenes, with the deaths of noble widows and their royal
    retainers and servants in the final gesture of loyalty towards their lords in
    the practice of self-immolation itself, kakawin depicts the cultural construction
    and justification of this brutal resolution of the problems presented to society
    by the presence of sexually experienced single women.


    The final task is to reassess the boundaries between fiction and reality noted
    in the introductory chapter. Kakawin literature represents just one small part
    of the textual heritage of the Indonesian archipelago. Development is marked by
    shifts in geographical and political circum-'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# 248 CHAPTER 7


    stances, but it is nevertheless a genre that crosses the boundaries be-tween pre-Islamic
    Java and Bali. The kakawin world survived for more than one thousand years, and
    this durability is the main reason that kakawin poetry provides a rich resource
    for the study of social and cultural history in the Indic courts of the Indonesian
    archipelago.


    The validity of kakawin sources for historical inquiry is not immediately obvious.
    The Indian settings, the uniformity of genre and language, the anonymity of the
    sources, and their geographical and temporal di-versity obscure and hide have
    tended to distort their value for cultural history. Although this distortion has
    been partially compensated by restricting the use of kakawin sources in this book
    to works of known provenance and dating, we cannot deny that the kakawin world
    is fundamentally a fictional one.


    This study of the kakawin world demonstrates the richness of the largely indigenous
    literary texts for reconstructing the Indonesian past. There is an abundance of
    material in kakawin that supports the analysis of the marriage practices in the
    Indic-influenced areas of the Indonesian archipelago over the long term. The level
    of detail in the descriptions of court society is more marked in kakawin than
    in most indigenous literary from the Indonesian archipelago and helps to confirm
    the validity of the social and cultural institutions described in the poems. Much
    of the minutiae of kakawin description—the use of amulets and bracelets made of
    threads in babyhood, the white attire of widows performing sati, the distinct
    stages of the nuptial celebrations, the names of officials, food, buildings, utensils,
    musical instruments—are even today recognably Javanese and Balinese. There seems
    little doubt that these elements of kakawin description are no more fictional
    or fantastic than those listed in the inspirational records on which our knowledge
    of the modern Javanese and Balinese past has previously built. Moreover, when
    we have at our disposal conventional historical documentation, as is the case,
    for example, in the practice of sati, the parallels between kakawin and more objective
    accounts are striking. The fictionalized plots and characters do not invalidate
    the information concerning the social and cultural institutions that are the focus
    of this book; rather, kakawin provide unique insights into life in the Indic courts.


    Although earlier generations of scholars interested in political and dynastic
    histories found little of interest in kakawin literature, for new areas of inquiry
    in cultural and gender history the opposite holds true. Per-'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# THE POETICS OF CONTROL 249


    tions of the mythological and fantastic nature of Javanese Balinese indigenous
    sources precluded their incorporation by earlier generations of historians into
    the wider repertoire of historical documentation for the Indonesian archipelago.
    However, the fantastical is far less pronounced in the documenting of women''s
    activities and experiences in in many other areas of concern in kakawin. Kakawin
    heroes may roam in the liminal zone of battlefield and forest where magical, and
    supernatural events abound, but within the palace walls, within the domestic sphere
    of female activity, there is little evidence of such unbelievable features. Even
    allowing for a degree of exaggeration and hyperbole in the depiction of women
    in kakawin are grounded in the world of human experience, and their activities
    restricted to a handful of social institutions that to a certain extent are timeless
    and by nature highly conservative.


    As sources of cultural and social history, kakawin provide insights that are simply
    not available in other sources. The personal experiences of men and women were
    rarely documented in the public records that survive the Indie courts, but kakawin
    do open one window into their social and cultural environment. Perhaps the main
    benefit of using kakawin as historical testimony is that although they may have
    been written by men and their preservation decreed by patriarchal norms, poets,
    particularly in their overwhelming interest in love and marriage, do in fact highlight
    the private rather than the political aspects of the roles of women and men on
    aspects of gender and social relationships that are absent from other indigenous,
    and most Western, sources. Kakawin descriptions also act as a counter to, or at
    times a confirmation of, accounts drawn from archival sources or from contemporary
    ethnography. Because they are the only indigenous records we have for these aspects
    of social history, we decline to incorporate them, we pass up an opportunity to
    encompass the most comprehensive view of the Indonesian past.


    Kakawin are largely interested in the universalizing of the individual experience
    of love and marriage through poetry. While the picture present may not represent
    the reality of women''s lives, kakawin images constitute a reality by creating
    a framework for idealized social interactions within the courts. In other words,
    even if we continue to recognize the limitations of kakawin as sources of history,
    this study may also allow us to appreciate their possibilities.'
