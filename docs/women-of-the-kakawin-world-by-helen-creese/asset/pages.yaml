  md: '# 8 CHAPTER 1


    world also owes much to the collection, both official and unofficial, of cultural
    artifacts, including manuscripts, during the colonial period, as well as to more
    recent textual documentation projects established by the central and regional
    Indonesian governments, particularly since the 1970s.¹13


    # Javanese Kakawin


    Relatively few Javanese kakawin have survived the perilous journey down the centuries.
    From the six-hundred-year period between the ninth and the fifteenth centuries,
    when the Indian kingdoms flourished in Central and East Java, only sixteen epic
    kakawin survive. The surviving works do not form a continuum of poetic endeavor.
    Instead, there are long gaps, sometimes of more than one hundred years, in the
    textual record.


    The majority of the surviving pre-Islamic kakawin works were composed by court
    poets under the sponsorship of rulers and nobles in the Indian courts of Java.
    Most of them have been reliably dated on the basis of the names of the royal patrons
    mentioned in the texts, whose names and reign dates are also known from epigraphical
    records.¹⁴ Apart from the Ramayana, which dates from the Central Javanese period,
    all the surviving kakawin works survive in East Java, most notably at the courts
    of Kadiri (1049–1222) and Majapahit (1293–c. 1527). No kakawin survives from the
    Singasari period (1222–1292). The last of the East Javanese works, the Observance
    of the Night of Siwa (Swaratrikpa), was composed during the reign of the Suraprabhawa
    (ruled 1466–1478), as just Islam began to penetrate the Javanese courts. There
    is some indication that kakawin composition may also have taken place outside
    the court. Two Javanese kakawin probably date from the fourteenth century, and
    are didactic rather than epic in character—the Tale of Kunjararna (Kunjakarna)
    and the Sacrifice of Partha (Parthajayana)—appear to have been written outside
    the court, possibly in priestly hermitages. There are also a small number of kakawin
    works assumed to be of Javanese provenance that are concerned not with epic heroes
    but with religious philosophy, statecraft, and metrical forms, but those too are
    likely to have arisen from court-related concerns.¹⁵ All the Javanese epic kakawin
    have been used in this study and are listed in Table 1.1 (See page 10).'
