    Marriage is a central theme in a number of kakawin, many of which specifically
    include the word “marriage” in their titles.¹ Nearly all the forms of marriage
    depicted in the kakawin have their basis in Indian literary tradition, either
    directly from Sanskrit texts or indirectly via the tenth-century Old Javanese
    versions of the Mahabarata. The most important narrative source is the first book
    of the epic, the Book of the Beginning(Adiparwa), which details the background
    of the gods and heroes who take part in the great battle. The form of marriage
    described in a particular kakawin work is, therefore, in many cases simply that
    of the original source material. In contrast to the other aspects of marriage,
    particularly the wedding ceremonies and festivities, there is less scope for authorial
    inventiveness, and in many respects kakawin simply reflect Sanskrit norms and
    preferences for contracting marital unions. Nevertheless, kakawin poets were it
    to liberate, and a considerable amount of incidental information about attitudes
    to the arrangement of marriage among the nobility in the kakawin world, as well
    as the preferred spouses of such unions, is revealed in the texts.


    Marriage was, and remains, a marker of adult status in the Indonesian archipelago.
    It was in a pragmatic process, governed by social and legal frameworks that encompassed
    many indigenous well as Indian practices and ideals. Marriage was of immense significance
    in mediating relationships among elite families, although in reality there were
    probably few options to high-ranking women and men in the marriage stakes. The
    unions depicted in kakawin reflect these social and political restrictions on
    marital practices of the Indic courts of Java and Bali. At the same time, they
    present individual love as the overriding force in determining the choice of life
    partners.


    # Forms of Marriage in Kakawin


    The marriages that take place in the kakawin fall into three major categories:
    marriage by arrangement, capture marriage by elopement or abduction, and marriage
    by self-choice. Table 3.1 shows the main partnerships recounted in the kakawin
    that focus on marriage. Many of these relationships are dealt with in more than
    one work and attest to the popularity of particular stories and storybook couples
    many centuries.'
