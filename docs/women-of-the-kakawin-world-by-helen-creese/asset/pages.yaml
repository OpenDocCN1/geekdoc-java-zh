  md: '# 6 CHAPTER 1


    court, and therefore do not represent the lives and interests of ordinary men
    and women.


    Although kakawin themes are familiar ones, for most readers the context is undoubtedly
    exotic and unfamiliar. This introductory chapter provides an outline of the aesthetic
    and cultural functions of kakawin, describes the characteristics of the genre
    as a whole, and explores the social roles of texts in kakawin society—considering
    questions of who wrote them, for whom they were written, and why they were composed.
    It also explores the methodological context of the study, situating it within
    the historical and gender frameworks that shape the analysis of kakawin as sources
    for the cultural and social history of women in the Indonesian archipelago. From
    chapter 2 we enter the kakawin world itself.


    # The Kakawin Genre


    Kakawin poetry is the most ancient literary genre known in the Indonesian archipelago,
    stretching back to the ninth century in Java and beyond to ancient India. From
    about the third century onward, Sanskrit influence from India throughout of Southeast
    Asia, including the Indonesian archipelago. Maritime trade appears to have spearheaded
    the initial contact, the religious and cultural riches of Hinduism and Buddhism,
    particularly as they were reflected in the great Sanskrit epics the Ramayana and
    the Mahabharata, the puranas, and Buddhist texts, were spread by priests and intellectuals
    by way of royal courts and religious centers. Perhaps the most striking feature
    of the process of Sanskritization in Southeast Asia is that it appears to have
    happened through a process of cultural imitation and borrowing, without any element
    of military or political connect. A wealth of Indian cultural, social, and religious
    concepts blended with animist, ancestor-centered indigenous beliefs to create
    the rich cultures of the Indic cult developed in Java and Bali, as well as in
    Sumatra and Kalimantan. Indian influence was particularly strong in matters of
    religion, philosophy, statecraft, and social organization, but it also provided
    a treasury of artistic and literary riches. The kakawin genre is one such legacy.


    The kakawin on which this study draws are long epic poems, usually hundreds of
    stanzas in length, written in the Old Javanese language. Most relate the adventures
    of the gods and heroes of'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'The Sanskrit epics, the Mahabharata and the Ramayana. Kakawin poetry is a highly
    stylized and formalized genre of poetry. Each kakawin comprises a number of cantos
    written in a metrical verse derived from Sanskrit literature, based on a set of
    syllables per line, in fixed patterns of long and short syllables. The kakawin
    genre owes much to the classical Sanskrit traditions of India, drawing on many
    of the rules of Sanskrit poets and prosody, and on Indian ideals of literary form.
    The word kakawin derives from the Sanskrit word kavya—the Sanskrit court epic
    flourished in India particularly between the fifth and fourteenth centuries.


    The kakawin genre is one of the most enduring literary traditions in Southeast
    Asia. The oldest known kakawin, the Old Javanese Ramayana, dates from the mid-ninth
    century, in Bali the court sponsored kakawin tradition flourished until the late
    nineteenth century, only coming to an end with the final integration of the island
    into the Dutch colonial empire in 1908. The epic kakawin that are the focus of
    this study divide chronologically into two distinct periods: a Javanese period
    spanning the ninth to fifteenth centuries, and a subsequent Balinese period, from
    sixteenth to to nineteenth centuries. Kakawin composition in Java appears to abut
    rather than overlap. By the late fifteenth century or early sixteenth century,
    by which time the last of the major Javanese Indian kingdoms, the Majapahit empire,
    which dominated the region between the thirteenth and fifteenth centuries, had
    fallen, and the Javanese Islamic courts had been established. The earliest traces
    of a distinct Balinese kakawin tradition date only from the mid-fifteenth century.
    In Bali, where the Hindu religion and Indian culture were maintained, only Old
    Javanese works were studied and preserved, but many new kakawin works were created.
    The composition and study of kakawin have fact continued in Bali until the present,
    but twentieth- and twenty-first-century kakawin have different thematic concerns
    from the epic kakawin of the traditional court world and are not included in the
    present study. The Old Javanese textual record was largely preserved in Bali rather
    than in Java, and it is thanks to later generations of Balinese copyists and textual
    experts that we have access to the Javanese kakawin that have survived. Our knowledge
    of the textual record of the kakawin'
  merge: -1
