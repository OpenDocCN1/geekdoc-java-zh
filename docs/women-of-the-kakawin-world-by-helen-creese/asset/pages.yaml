    own right—and to create dramatic moments within their poems. More important, these
    scenes were powerful evocations of which allowed poets to extol the values of
    fidelity and selflessness on which social relationships were founded. Loyal maids
    and occasionally mothers or daughters are also prepared to make this final sacrifice
    for those they love.


