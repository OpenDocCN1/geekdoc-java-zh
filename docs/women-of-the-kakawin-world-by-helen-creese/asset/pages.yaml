    mortals.


    asana. A tree with deep green fragrant flowers (Terminalia tomentose).

    asoka. A tree with magnificent red flowers (Jonesia asoka Roxb.).

    babad. Balinese historical text genre.


    bael. A peculiar kind of tree (Aegle marmelos). This tree gives its name

    to the kingdom of Majapahit, “bitter bael” (maja).


    bela. “to lay down one’s life, be prepared to die with another

