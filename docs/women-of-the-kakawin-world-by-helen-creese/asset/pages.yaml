    yogic meditation and visualization of the beloved (*asmaracpita*), which is then
    combined with correct sexual behavior in which the lover’s skill brings satisfaction
    to his partner (*asmaragama*). All these stages culminate in the magical, mystical
    doctrine of love (*asmaratantra*), the actual moment of union.¹¹¹⁶


    The social institutions of elite courtship and marriage depicted in kakawin literature,
    the celebration of the joining of two lovers, complementary halves of a spiritual
    and social unity. The newly married couple represents the basic unit of kakawin
    society—the married couple who will share a life, producing children to ensure
    the continuity of the family line. But the complementarity is underpinned by an
    ambiguous sense of power and hierarchy epitomized in the possession of the bride
    by the prince, his ownership proclaimed to the world in the kraban ceremony. In
    the kakawin world, however, even marital bliss is not secure, and for many couples
    the parting, at least for this incarnation, comes too soon. For many kakawin women
