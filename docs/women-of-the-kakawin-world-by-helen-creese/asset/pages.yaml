  md: '# xii PREFACE


    and perpetuation of gender ideologies in Java and Bali, ideologies that are closely
    linked to and intertwined with the discourses of power that arise from the political,
    religious, and social institutions of their times. While the principal analysis
    of this book is more on the description of marriage and sexuality as social institutions
    than the literary aspects of the *kakawan* genre, because the sources themselves
    are overwhelmingly literary I hope it will introduce a wider audience to what
    is perhaps one of the world''s best-kept literary secrets—*kakawan* literature.


