  md: '# 4 CHAPTER 1


    not only geographically, but also because this familiarity is deceptive. For this
    princess belongs to the kakawin world of Java and Bali—a world conjured through
    the poetic skills of generations of poets who lived and worked in the Indic courts
    that flourished in Java and Bali between the ninth and nineteenth centuries. Nor
    is this princess any ordinary princess. She is an image—a woman no would ever
    meet in reality, but who is nonetheless representative of the ideals of the society
    that created and perpetuated her. Real or imaginary? Fact or fiction? A little
    of both? It is these issues that this book sets out to explore.


    This study draws on the epic kakawin poetry tradition of Java and Bali to examine
    representations of women and sexuality and the institutions of courtship and marriage
    in the Indic courts of Java and Bali. Indic courts, imbued with centuries of cultural
    interchange with Indian, Sanskrit traditions, flourished in pre-Islamic Java between
    the seventh and fifteenth centuries, and from the ninth century until the nineteenth
    century in Bali, where the Balinese courts maintained the centuries-old cultural
    and religious traditions they had shared with the Javanese before the coming of
    Islam. For more than one thousand years these royal courts were major centers
    of patronage and the court-sponsored epic kakawin works that have survived therefore
    provides an ongoing testimony to the cultural and social concerns of court society
    in Java and Bali from the time of its earliest recorded history until its demise
    at the end of the nineteenth century.


    Kakawin are not dry historical documents but works of literary art—poems in which
    individual poets tried to capture the essence of tales of exceptional women and
    men. Through the telling of aesthetic pleasure in beautiful words through the
    thematic concerns of kakawin poetry are war—to which little attention is given
    in this book—kakawin can be read for the sheer pleasure of its story and its language.
    But these poems are also a rich and untapped resource for the study of the pivotal
    social institution of marriage in Java and Bali in premodern times.


    This study sets out to explore the kakawin corpus as a source for the cultural
    and social history of the Indic courts, and to consider gender within the texts,
    not only because kakawin texts lend themselves well to this purpose, but also
    because such a study has never'
  merge: -1
