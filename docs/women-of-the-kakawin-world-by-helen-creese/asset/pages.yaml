    Besar. Twelfth month of the Muslim lunar calendar.

    betel. The nut of the betel palm (Areca catechu), a symbol of intimacy

    in Southeast Asia.


    Bhadra. A month of the Indian lunar calendar, equivalent to August–

    September.


    Bhre. Javanese royal title.

    bodhisatwa resi. The Buddha, “whose is perfect knowledge.”

    hujangga resi. The malevolent or demonic chtonic forces in Balinese ritual

    and religious practices. Regular offerings are made to appease the

    bhutakala.


    bodhi. The sacred fig tree (Ficus religiosa).

    brahman. A priest belonging to the brahmana caste. Also brahmin.


    bramana. The first of the four castes, priests.

    brahmin. See brahman.

    bukukundur. A head ornament, possibly a crown.


    Caitra. A month of the Indian lunar calendar, equivalent to March–April.

    campaka. A tree with white or yellow flowers (Michelia campaka).

    candi. sanctuary.


    caru. In Sanskrit, celu is an oblation boiled with milk and butter for pre-\sentation
    to the gods or men; In Javanese it has a general sense

    of “offering.” In Bali, caru offerings are propitiatory offerings to the

    demonic forces of the underworld that are placed on the ground.


    cataka. A bird that subsists on raindrops (Culculus melanole).

