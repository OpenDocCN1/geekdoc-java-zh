    # A Note on Spelling


    I have sought to make this book as accessible to as wide a readership as possible
    by choosing not to use diacritical marks and have taken the somewhat unusual spelling
    of giving the kakaw English-language titles rather than their familiar Old Javanese
    names. Throughout this book, Indonesian rather than Sanskrit spelling is used
    for words of Sanskrit origin, except where direct reference to Sanskrit orthography
    is rendered as in Indonesian languages, and no distinction is made between the
    different kinds of s, n, t, and d. Thus, Sanskrit Pandawa is transcribed as Pandawa,
    Shiva as Shiva, Vishnu as Wisnu, Krishna as Kresna, and so on.


