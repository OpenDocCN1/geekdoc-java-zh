  md: 'Helen Creese is senior lecturer in Indonesian in the School of Languages and
    Comparative Cultural Studies at the University of Queensland, Australia. Her research
    focuses on Bali, covering broad themes in history and literature. She is particularly
    interested in the historical formation of Balinese regional identities in Indonesia,
    including gender. She is the author of Parthayana, The Journeying of Partha: An
    Eighteenth-Century Balinese Kakawin (KITLV Press, 1998) and has published widely
    on Balinese literature, historiography, and gender issues.'
