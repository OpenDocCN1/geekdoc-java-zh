  md: "# 21.3 Bamboo\n\nIn your Selenium project, add few selenium tests as mentioned\
    \ below.\nA typical Selenium test project includes few test classes.\nEach test\
    \ class extends the base class where we define before test and after test methods.\
    \ In before test method, we create the webdriver instance and also perform test\
    \ initialization tasks. In after test method, we close the driver and also perform\
    \ clean up tasks like closing the processes created during test run.\n\nBelow\
    \ is the sample base class for all Selenium Test classes.\n\n```\npackage seleniumtests;\n\
    import org.junit.Before;\nimport org.junit.After;\nimport org.openqa.selenium.WebDriver;\n\
    import\norg.openqa.selenium.firefox.FirefoxDriver;\n\npublic class BaseTest\n\
    {\n    public WebDriver driver;\n    @Before\n    public void init()\n    {\n\
    \        driver = new FirefoxDriver();\n    }\n\n    @After\n    public void cleanup()\n\
    \    {\n        driver.close();\n        driver.quit();\n    }\n}\n```"
