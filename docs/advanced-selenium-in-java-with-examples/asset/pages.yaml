  md: '# 1. Introduction


    Selenium web driver is the most popular browser automation testing tool. Project
    is hosted at https://github.com/seleniumhq/selenium.


    Key features of Selenium WebDriver are - Open source


    +   - Supports all major browsers - IE, Firefox, Chrome, Safari, Opera

    - API is available in all popular languages like Java, Groovy, C#, PHP, Python
    etc.

    - Selenium Webdriver is a W3C standard protocol for Browser Automation

    - Supports testing for Desktop web applications, iOS and Android mobile applications

    - Testing web applications on emulated mobile devices is possible using mobile
    emulation in chrome


    For every web browser, there is a separate web driver implementation that helps
    us automate the browser operations.


    For example ->


    If you want to automate chrome, you will need chromedriver. Chromedriver is an
    application file that is used to perform the operations on browser.Similarly for
    firefox and Internet Explorer there are different drivers.'
