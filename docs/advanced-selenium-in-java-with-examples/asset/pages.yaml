    # 2. Test Data Sheet in Selenium Webdriver framework


    As displayed in below figure, the data sheet contains

    below columns.


    +   1. ID -Test_Case_Name - Name of the test case

    2. Exec_Flag - Execution flag to tell if you want to

    execute this test case. Y means that test will be

    executed

    3. Test_Step_Id - Step Id of the Test case

    4. Test_Case_Steps - Step name of the test case

    5. Keyword - The name of method in function library

    you want to call.

    6. objectTypes - type of the web elements like

    webedit, weblist, webcheckbox etc

    7. objectNames - Web element identification method

    and expression like xpath://td

    8. objectValues - actual test data you want to enter in

    the webElement

    9. parameter1 - extra parameter to drive the method

    control

    10. parameter2 - one more parameter to drive the

    method control'
