  md: '# Advanced Selenium in Java


    # 23. Mobile application testing


    # 23.1 First Mobile Automation Testing Using Appium


    # What is Appium?


    Appium is a mobile automation testing tool used to test android and IOS applications.


    # Installation and Setting up of Environment for running Appium tests


    Please follow below steps to set up the environment.


    +   1. Download and Install Java. Set up JAVA_HOME and JRE_HOME.

    2. Download and Install Android SDK. Set up ANDROID_HOME.

    3. Also configure system path variable to include Java and Android tools.

    4. Download and Extract Appium.

    5. Set up device (Virtual device or Android phone) on which tests have to be run.
    If you are using real Android phone for testing then please enable developer option
    by tapping on the version menu (found in settings->About device) 7 times. Once
    Developer option is made visible, you should enable usb debugging. Then you can
    attach your device to laptop using usb cable. For the first time, your device
    mac address will be registered in device manager, You also need to accept a message
    to acknowledge the registration on your phone.'
