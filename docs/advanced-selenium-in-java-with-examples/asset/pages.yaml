  md: 'Now let us take a look at different constructors for ChromeDriver.


    +   1. ChromeDriver()

    2. ChromeDriver(Capabilities capabilities)

    3. ChromeDriver(ChromeDriverService service)

    4. ChromeDriver(ChromeDriverService service, Capabilities capabilities)

    5. ChromeDriver(ChromeDriverService service, ChromeOptions options)

    6. ChromeDriver(ChromeOptions options)


    As you can see, in Java Selenium API, we have 6 constructors for the ChromeDriver
    class. The first constructor takes no arguments. But rest of them are taking the
    arguments as mentioned below.


    +   1. Capabilities

    2. ChromeDriverService

    3. ChromeOptions


    Now let us try to understand the significance of these classes.


    Capabilities are used to manage the browser attributes. For example - we can set
    the browser name, version, platform using capabilities. ChromeDriverService is
    used to manage the chrome server (exe). Finally, ChromeOptions are used to set
    the options specific to the chrome browser like adding extensions, setting the
    binary path etc.'
