    # 5. Browsers


    # 5.1 Launch internet explorer


    You can download the IE driver from the link - http://docs.seleniumhq.org/download/.
    IEDriver supports 32 bit as well as 64 bit Internet Explorer.


    # Setting the driver parameters


    Ensure that Server path is included in System PATH variable or set the property
    as shown below.


    ```

    System.setProperty("webdriver.ie.driver", "F:\selenium\java\iedriver.exe");

    ```


    Other properties that we can set are given below.


    +   1. webdriver.ie.driver.host

    2. webdriver.ie.driver.loglevel

    3. webdriver.ie.driver.logfile

    4. webdriver.ie.driver.silent


    # Browser Settings


    Ensure that Protected mode settings for all zones should be the same and for IE10
    and above, enhanced protected mode must be disabled and the browser zoom level
    must be set to 100%.


