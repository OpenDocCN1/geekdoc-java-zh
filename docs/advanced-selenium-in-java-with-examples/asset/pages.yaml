    +   3. Timed out receiving message from renderer

    You may get exception saying - timeout: Tim out receiving message from renderer
    when working with Selenium web driver and chrome browser.


    I fixed this exception using below statement in Java.


    ```

    driver.manage().timeouts().pageLoadTimeout(60, TimeUnit.SECONDS);

    ```


    I was getting the exception earlier when the page load time was 20 seconds. I
    increased the page load time to 60 seconds and it started working like a charm.


    As a good practiseise, always make sure that page load time out is at least 60
    seconds.'
