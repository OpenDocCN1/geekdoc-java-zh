    What is inside this WebDriver Interface?

    Important methods declared inside this interface are -


    +   1. get

    2. findElement

    3. getTitle

    4. getPageSource....etc


    The classes that implement this interface are given below.


    +   1. ChromeDriver

    2. EventFiringWebDriver

    3. FirefoxDriver

    4. HtmlUnitDriver

    5. InternetExplorerDriver

    6. OperaDriver

    7. RemoteWebDriver

    8. SafariDriver'
