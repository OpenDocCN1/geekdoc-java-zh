  md: '# 25. Comparing selenium with other tools


    # 25.1 Difference between Selenium WebDriver and UFT (QTP)


    Selenium and QTP , both of them are automation testing tools.


    Major difference between QTP and Selenium are :


    +   1. Selenium is an open source tool while QTP is not an open source tool. It
    is owned by the HP.

    2. Selenium is used to test only web based applications while QTP can be used
    to test wide variety of applications like web based, .net based, Java based, mainframe
    applications.

    3. Selenium supports scripting in many different languages like Java, .Net, Python,
    Ruby etc While in QTP only vb scripting is provided.

    4. Web automation testing with selenium requires less cost as comparead to automation
    using QTP due to license cost.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Advanced Selenium in Java


    2.2 Difference between Selenium and LeanFT

    Here is the main difference between Selenium and LeanFT


    +   1. Selenium is open source. LeanFT is licensed tool developed by HP

    2. Selenium can be used to automate only Web applications. LeanFT can be used
    to automate web as well as desktop applications

    3. Selenium uses the locators like XPATH, CSS. LeanFT uses properties and value
    pairs. But we can also use XPATH

    4. Selenium is better in cross browser testing than LeanFT

    5. Both are platform independent.

    6. LeanFT scripts can be developed in only Java and C#. Selenium scripts can be
    written many languages like Java, Perl, PHP, Python, Ruby, JavaScript etc.


    2.3 Difference between Selenium and Appium

    Here is the comparison between Selenium and Appium


    +   1. Selenium is an open source tool to test web applications running in desktop
    browsers. Appium is an open source tool to test the web applications running in
    mobile browsers. Appium also supports automation of native and hybrid mobile applications
    developed for iOS and Android OS. Appium uses selenium API to test the applications.

    2. Appium wraps vendor specific API into Webdriver API which is common for automating
    all types of mobile browsers. For example - Android API is different than iOS
    API. But Webdriver API is same. That''s what Appium does for you!'
