    # ## 18.7 Data driven frameworks


    One of them is Data driven framework. This kind of framework is used when we need
    to test same application flows using different combinations of data. Different
    types of applications need different types of frameworks. We must use Data driven
    framework in a situation where there are limited number of Application flows but
    there is wide variety of data that is consumed by application.


    For example - Consider a simple register functionality of a website. You need
    to verify that password should meet below criteria.


    +   1. At least 8 characters in length

    2. Should contain alphanumeric characters

    3. Should contain at least one non-alphanumeric character.

    4. Should contains at least one lower case and one upper case letter.


    All we need to do test this functionality is write simple test which will enter
    values in the password textbox and verify if the password test passes. In this
    scenario, all steps are same except test data. That is when we should Data driven
    frameworks. We can store data in either excel sheet or database.

    Test reads each set of data and repeats same steps.'
