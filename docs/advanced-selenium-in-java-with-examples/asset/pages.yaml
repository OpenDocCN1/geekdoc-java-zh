  md: '# How to write XPath expressions that find the relative elements?


    We can use following-sibling and preceding-sibling keywords as shown below.


    In below image, we have input box with name "q". Yes, we can use xpath directly
    in this case. But consider a scenario where you do not have name attribute or
    the textbox attributes are changing at run time. In that case, you have a very
    robust method to find out the textbox using label next to it. There is a rare
    possibility that label for the textbox will change. So how to write xpath now?
    We can use following-sibling keyword as shown below. So even if the position of
    the textbox changes tomorrow, below xpath will be able to find that easily.


    ```

    //td[contains(text(),''Name'')//following-sibling::td//input

    ```


