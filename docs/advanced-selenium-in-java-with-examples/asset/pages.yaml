  md: '# Advanced Selenium in Java

    We solve above issues by below code.


    ```

    WebElement c = driver.findElement(By.xpath("//select[@name=''type'']"));


    ((JavascriptExecutor) driver).executeScript("arguments[0].value=''X'';",c);

    ```


    Above script will select value X from the drop down.


    After this you will have to trigger the on change event on the drop down using
    below code.


    ```

    ((JavascriptExecutor) driver).executeScript("var evt = document.createElement(''HTMLEvents'');


    evt.initEvent(''change'', true, true);


    arguments[0].dispatchEvent(evt);",c);

    ```


    This will fire the drop down change event on the web list.'
