  md: '# Advanced Selenium in Java


    # 15. Exceptions in Selenium


    # 15.1 Common Exceptions that might occur


    Here is the list of common exceptions in Java in selenium web driver.


    +   1. Element is not clickable at point (x, y).

    2. No Such Element - for Frame related issue

    3. The driver executable does not exist. Driver executable must be set by the
    webdriver.ie.driver system property. The path to the driver executable must be
    set by the webdriver.chrome.driver system property

    4. Stale Element Reference - This happens when element comes in ajax


    # 15.2 Environmental issues and Exceptions


    +   1. Unexpected error launching Internet Explorer Protected Mode settings are
    not the same for all zones You may get below error message when working with Selenium
    Webdriver and Internet Explorer browser.


    Unexpected error launching Internet Explorer. Protected Mode settings are not
    the same for all zones. Enable Protected Mode must be set to the same value (enabled
    or disabled) for all zones. (WARNING: The server did not provide any stacktrace
    information) Command duration or timeout: 1.43 seconds


    To fix above error you need to make below setting in Internet Option -> Security
    Tab as shown in below image.'
