  md: '# Who is this book for


    This book is for software developers, automation testers, Devops and engineers
    working on selenium automation testing project. Whether you are a beginner or
    an experienced developer, this book will help you master the skills on Selenium.


    The book starts with introduction of Selenium and then dives into key concepts
    like setting up project in IntelliJ, integration with Junit and TestNG, integration
    with build tools like Gradle and Maven. You will also learn how to integrate selenium
    with Cucumber. In the end, you will learn how to run the Selenium tests on CI
    servers like TeamCity, Bamboo and Jenkins. You will also learn how to work with
    various types of frameworks like Page object models, Page factory Keyword driven
    frameworks etc. Book also touches the concepts related to mobile automation using
    Selenium.'
