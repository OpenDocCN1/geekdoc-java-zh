  md: '# Advanced Selenium in Java


    4. Unexpected modal dialog is present in Internet Explorer When automating the
    test cases using Selenium WebDriver, we often encounter this error saying "Unexpected
    Modal Dialog found".


    This error usually comes when Selenium Webdriver is not able to perform any operation
    on the page due to Alert dialog being open on the page.


    5. Element is disabled Exception Sometimes you need to enter data into web controls
    which are disabled. But Selenium will throw exceptions saying element is disabled.


