    the network speed, application latency or browser limitations. But that is not
    the case at all times. You can avoid these wait statements in your code by adopting
    standard coding practices as mentioned below.


    +   1. Use WebDriverWait and ExpectedConditions class - I recommend that we should
    use these classes whenever we think that test might fail due to synchronization
    issue. With the help of these classes we can make selenium webdriver wait until
    some condition is satisfied like specific element enabled or displayed.

    2. While switching to the new window, ensure that the web document is really loaded
    into the window before trying to perform any operation. In one of the projects,
    I faced the issue in which I was trying to switch to the window. But due to the
    latency, test was failing unpredictably. I ensured that count of window handles
    is 2. But still I was facing the issue in random runs. I used 10 second fix wait
    but still problem persisted. I kept on increasing the sleep time but finally I
    realized that must be better technique to handle this scenario. Then I used a
    loop to check that title of the window has changed as per the expected one and
    then I tried to switch to it. This made my code more robust. This is how I got
    rid of sleep statements in the code. If you are still not able to switch to the
    new window, try to switch to the first window and re-switch to the new window.

    3. Another scenario where testers often use wait statements is when selecting
    the value from the'
