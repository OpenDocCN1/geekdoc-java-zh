  md: '# 20. Miscellaneous


    20.1 Viewing the remote machine desktop of Linux using VNC


    Most of the times, tests are run on the remote Linux machines. We can view the
    execution on remote Linux machine using virtual desktop. We need below 2 binaries
    running on the server.


    +   - xvfb - Virtual frame buffer - display server that implements X11 display
    server protocol. It does not show anything on screen. Another option is Xdummy.
    So in short, xvfb creates the virtual network computing display in memory.

    - VNC Server - xvnc - Virtual network computing (display server). RealVNC, x11vnc
    and TightVNC are other tools that you can use. In short, VNC server allows you
    to start the server attached to display created by xvfb.

    - On the client side, you need to install VNC client. VNC client connects to the
    VNC server allowing you to view the virtual display.


    # Starting the virtual display and VNC server


    ```

    if [ - "${DISPLAY}" ]

    then

    echo "DISPLAY environment variable is not set"

