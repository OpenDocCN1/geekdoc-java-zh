- md: "\n# ADVANCED SELENIUM IN JAVA\n\n![](img/6cb05a5e3a692f75be836db166e84232_0_0.png)\n\
    \n# WITH EXAMPLES\n\nPAUL WATSON\n\n![](img/6cb05a5e3a692f75be836db166e84232_1_0.png)\n\
    \nhttps://archive.org/details/advancedselenium0000paul\n\n# About the Author\n\
    \nMr. Paul Watson has many years of experience in working with Selenium Webdriver,\
    \ Junit, TestNG and Cucumber. He has worked on large software projects in USA,\
    \ UK, Singapore, Hong Kong, Dubai, Australia and Switzerland.\n\nHis hobbies include\
    \ travelling to new tourist places, watching basketball, cricket, Soccer and learning\
    \ latest technological stuff.\n\n# Who is this book for\n\nThis book is for software\
    \ developers, automation testers, Devops and engineers working on selenium automation\
    \ testing project. Whether you are a beginner or an experienced developer, this\
    \ book will help you master the skills on Selenium.\n\nThe book starts with introduction\
    \ of Selenium and then dives into key concepts like setting up project in IntelliJ,\
    \ integration with Junit and TestNG, integration with build tools like Gradle\
    \ and Maven. You will also learn how to integrate selenium with Cucumber. In the\
    \ end, you will learn how to run the Selenium tests on CI servers like TeamCity,\
    \ Bamboo and Jenkins. You will also learn how to work with various types of frameworks\
    \ like Page object models, Page factory Keyword driven frameworks etc. Book also\
    \ touches the concepts related to mobile automation using Selenium.\n\n# Preface\n\
    \nIn this book, you will find all concepts related to Selenium Webdriver.\n\n\
    You will learn below topics.\n\n- 1. Introduction\n- 2. Selenium Architecture\n\
    - 3. WebDriver JSON Wire protocol\n- 4. Installation, Browsers\n- 5. Capabilities\n\
    - 6. Basic operations\n- 7. Element identification methods\n- 8. Element operations\n\
    - 9. Synchronization\n- 10. Advanced XPATH and CSS expressions\n- 11. Working\
    \ with tables\n- 12. Handling multiple browser windows\n- 13. Exceptions\n- 14.\
    \ Switching contexts\n- 15. JavascriptExecutor\n- 16. Frameworks with selenium\
    \ – Junit and TestNG\n- 17. BDD frameworks - Cucumber\n- 18. Integration with\
    \ CI servers like Bamboo, TeamCity and Jenkins\n- 19. Selenium in Cloud\n- 20.\
    \ Mobile application testing\n- 21. Selenium grid\n- 22. Comparing selenium with\
    \ other tools\n- 23. Challenges in Selenium automation\n\n# Advanced Selenium\
