    # Advanced Selenium in Java


    # 19. BDD frameworks


    # 19.1 Cucumber


    Cucumber is one of the most popular BDD testing frameworks. In this article, you
    will learn how to write the feature files and step definitions for running Selenium
    tests.


    # What tools you will need to run cucumber tests?


    +   - JAVA IDE - IntelliJ IDEA

    - JDK

    - Maven or Gradle

    - Cucumber API

    - Cucumber plug-in for IntelliJ IDEA

    - IntelliJ IDEA plug-ins for Gherkin and Cucumber for Java


    You will need to add below dependencies in your project to use Cucumber API


    ```

    testCompile ''info.cukes:cucumber-java:1.2.4'' testCompile ''info.cukes:cucumber-junit:1.2.4''

    ```


    # How to write tests using Cucumber?


    Below example shows how you can write a simple cucumber test class. When we run
    that Test class, all features in the src/test/resources directory are run. If
    there are no step definitions written for the steps in feature file, it creates
    sample step methods for you.'
