    ## 1. Introduction


    Selenium web driver is the most popular browser automation tool. Project is hosted
    at https://github.com/seleniumhq/selenium.


    Key features of Selenium WebDriver are:


    - Open source

    - Supports all major browsers - IE, Firefox, Chrome, Safari, Opera

    - API is available in all popular languages like Java, Groovy, C#, PHP, Python
    etc.

    - Selenium Webdriver is W3C standard protocol for Browser Automation

    - Supports testing for Desktop web applications, iOS and Android mobile applications

    - Testing web applications on emulated mobile devices is possible using mobile
    emulation in chrome


    For every web browser, there is a separate web driver implementation that helps
    us automate the browser.


    For example


    If you want to automate chrome, you will need chromedriver. Chromedriver is an
    application file that is used to perform the operations on browser. Similarly
    for firefox and Internet Explorer there are different drivers.


    ## Advanced Selenium in Java


    ```java

    System.setProperty("webdriver.chrome.driver", "C:\\chromedriver.exe");

    WebDriver driver = new ChromeDriver();

    ```


    Above code will create new web driver reference that can be used to automate the
    test cases on chrome browser.


    ```java

    File profileDir = new File("C:\\Users\\Firefox\\Profiles\\default");

    FirefoxProfile profile = new FirefoxProfile(profileDir);

    wb = new FirefoxDriver(profile);

    ```


    Above code will launch firefox.


    ## 2. Selenium Architecture


    You will get to know the Selenium WebDriver architectural diagram.

    Before you take a look at a diagram, kindly note below points.


    1. Selenium webdriver uses JSON WIRE protocol over well known HTTP protocol.

    2. Your automation code sends HTTP commands to WebDriver Server (IEDriverServer.exe
    or ChromeDriver.exe).

    3. Webdriver Server (IEDriverServer.exe or ChromeDriver.exe) sends these commands
    to the browser under test through HTTP proxy.

    4. Browser under test executes the commands sent by Webdriver Server and sends
    the results back to the Webdriver Server.

    5. Webdriver server interprets the results and your automation code takes further
    action on those results.

