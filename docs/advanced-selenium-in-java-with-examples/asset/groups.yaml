    # Advanced Selenium in Java


    # 26.Challenges in Selenium automation


    # 26.1 Limitations of Selenium


    Even though Selenium is the most popular automation testing tool, it has got below
    limitations.


    +   1. We can only test web applications. We cannot test desktop based test applications.

    2. We can test mobile applications but we need to use the Appium for that.

    3. We cannot automate the CAPTCHA

    4. We can not automate the complex control like Flash, Silver light Components,
    Applet controls, native window dialogs etc

    5. We often encounter issues like Selenium not launching latest browsers due to
    incompatibility issues. In such scenarios, we will have to downgrade the browser
    in order to automate it.


    # 26.2 Handling windows dialog using AutoIT


    Some times you will have to handle the file upload window using selenium web driver.


    Selenium does not provide any such way to handle the window pop ups.


    You can use AutoIT script to automate this task. AutoIT is a scripting language
    for Microsoft windows applications. You will have to download and install AutoIT
    from this url Download AutoIT


    Once downloaded, you can write below code in the script'
