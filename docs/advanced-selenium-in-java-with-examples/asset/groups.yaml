    \        driver.get(\"http://www.post.org\");\n        driver.quit();\n      \
    \  //quit the browser\n    }\n}\n```\n\n# 25. Comparing selenium with other tools\n\
    \n## 25.1 Comparing selenium with UFT (QTP)\n\nEven though Selenium is popular,\
    \ major difference between Selenium and UFT are:\n\n- Selenium is open source\
    \ tool. UFT is owned by HP.\n- Selenium is used to test web applications. UFT\
    \ is used for desktop applications.\n- Selenium supports many languages like Java,\
    \ C#, Python, Ruby. UFT uses VBScript.\n\n## 25.2 Difference between Selenium\
    \ and UFT\n\nHere is the main difference between Selenium and UFT:\n\n- Selenium\
    \ is open source. UFT is not open source.\n- Selenium is used for web applications.\
    \ UFT is used for native applications.\n- Selenium is platform independent. UFT\
    \ is licensed.\n\n## 26. Challenges in Selenium\n\nEven though Selenium is popular\
    \ automation tool, it has got below limitations:\n\n- We can only test web applications.\n\
    - We cannot test complex controls like Flash, Silverlight, Applet.\n- We cannot\
    \ automate CAPTCHA.\n- We often encounter issues like Selenium launching latest\
    \ browsers due to incompatibility. In such scenarios, we will have to downgrade\
    \ the browser.\n\n## 26.2 Handling windows dialog using AutoIT\n\nSome times you\
    \ will have to handle the file upload window using selenium driver. Selenium does\
