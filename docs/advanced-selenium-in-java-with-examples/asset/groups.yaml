- md: "\n![](img/6cb05a5e3a692f75be836db166e84232_15_0.png)\n\n# 3. WebDriver JSON\
    \ Wire protocol\n\nDid you ever wonder how Selenium 2.0 works internally?\nIn\
    \ this post, you will get to know how selenium automates\nthe browser.\n\nSelenium\
    \ API sends HTTP commands in the form of JSON\nprotocol to Selenium Server.\n\
    Selenium server then uses native browser API to automate\nthe browser.\n\nSo when\
    \ use below statement in your code –\n\n```\ndriver = new ChromeDriver();\n```\n\
    \nIt actually sends the below HTTP command to the\nselenium server.\n\nPOST /session\n\
    \nFor each selenium API method, there is a corresponding\nHTTP request that is\
    \ sent to the server. Here is the list of\nsome of the HTTP commands that are\
    \ sent to Selenium\nServer.\n\n- POST /session - Create new session\n- GET /status\
    \ - Get the state of server\n- DELETE /session/:sessionId - Delete the session\
    \ with id - sessionId\n- 4. POST /session/:sessionId/timeouts/implicit_wait\n\
    Specify the amount of time the driver should wait when searching for elements.\n\
    - 5. GET /session/:sessionId/url - Navigate to the specific url\n\nBelow image\
