    Malformed Exception\");\n        }\n    }\n}\n```\n\nYou can watch your tests\
    \ executing on below url.\nhttps://www.browserstack.com/automate\n\nAdvanced Selenium\
    \ in Java\nBelow image shows how the BrowserStack dashboard looks like.\n\n![](img/6cb05a5e3a692f75be836db166e84232_241_0.png)\n\
    \n## Advanced Selenium in Java\n\n## 23. Mobile application testing\n\n### 23.1\
    \ First Mobile Automation Testing Using Appium\n\n#### What is Appium?\n\nAppium\
    \ is a mobile automation testing tool used to test android and IOS applications.\n\
    \n#### Installation and Setting up of Environment for running Appium tests\n\n\
    Please follow below steps to set up the environment.\n\n- 1. Download and Install\
    \ Java. Set up JAVA_HOME and JRE_HOME.\n- 2. Download and Install Android SDK.\
    \ Set up ANDROID_HOME.\n- 3. Also configure system path variable to include Java\
    \ and Android tools.\n- 4. Download and Extract Appium.\n- 5. Set up device (Virtual\
    \ device or Android phone) on which tests have to be run. If you are using real\
    \ Android phone for testing then please enable developer option by tapping on\
    \ the version menu (found in settings->About device) 7 times. Once Developer option\
    \ is made visible, you should enable usb debugging. Then you can attach your device\
    \ to laptop using usb cable. For the first time, your device mac address will\
    \ be registered in device manager, You also need to accept a message to acknowledge\
    \ the registration on your phone.\n\n### First Mobile Automation Testing Using\
    \ Appium\n\nYou can write tests using Appium in any language like Java, C#, Python\
    \ etc. Below program uses C#.\n\n```csharp\nusing System;\nusing Microsoft.VisualStudio.TestTools.UnitTesting;\n\
    using OpenQA.Selenium;\nusing OpenQA.Selenium.Remote;\nusing OpenQA.Selenium.Support;\n\
    using System.Text.RegularExpressions;\n\nnamespace Appium\n{\n    [TestClass]\n\
    \    public class UnitTest2\n    {\n        [TestMethod]\n        public void\
    \ Test1()\n        {\n            IWebDriver driver;\n            DesiredCapabilities\
    \ capabilities = new DesiredCapabilities();\n            capabilities.SetCapability(\"\
    browserName\", \"Android\");\n            capabilities.SetCapability(\"version\"\
    , \"4.4\");\n            capabilities.SetCapability(\"deviceName\", \"yourdevice\"\
    );\n            capabilities.SetCapability(\"appPackage\", \"com.calculator\"\
    );\n            capabilities.SetCapability(\"appActivity\", \"com.calculator.MainActivity\"\
    );\n\n            driver = new RemoteWebDriver(new Uri(\"http://127.0.0.1:4723/wd/hub\"\
    ), capabilities);\n            driver.findElement(By.id(\"fn\")).sendKeys(\"Sagar\"\
    );\n            driver.quit();\n        }\n    }\n}\n```\n\n## Advanced Selenium\
    \ in Java\n\n### 23.2 Mobile emulation using chrome\n\nBelow example illustrates\
    \ how to execute the Selenium tests on iPhone 5 using mobile emulation feature\
    \ in chrome. Similarly we can run tests on other devices like Apple iPad, Google\
    \ Nexus 5.\n\n```java\npackage browsertests;\n\nimport org.junit.Test;\nimport\
    \ org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.chrome.ChromeDriver;\n\
    import org.openqa.selenium.chrome.ChromeOptions;\nimport org.openqa.selenium.remote.DesiredCapabilities;\n\
    import java.util.HashMap;\nimport java.util.Map;\n\npublic class MobileEmulationOnChrome\
    \ {\n\n    @Test\n    public void launchChrome() {\n        Map<String, String>\
    \ mobileEmulation = new HashMap<String, String>();\n        // mobileEmulation.put(\"\
    deviceName\", \"Google Nexus 5\");\n        // mobileEmulation.put(\"deviceName\"\
    , \"Apple iPhone 5\");\n        // mobileEmulation.put(\"deviceName\", \"Apple\
    \ iPad\");\n        Map<String, Object> chromeOptions = new HashMap<String, Object>();\n\
    \        chromeOptions.put(\"mobileEmulation\", mobileEmulation);\n\n        DesiredCapabilities\
    \ capabilities = DesiredCapabilities.chrome();\n        capabilities.setCapability(ChromeOptions.CAPABILITY,\
    \ chromeOptions);\n\n        System.setProperty(\"webdriver.chrome.driver\", \"\
    C:\\\\softwares\\\\selenium\\\\chromedriver2.2.exe\");\n\n        WebDriver driver\
    \ = new ChromeDriver(capabilities);\n        driver.get(\"http://softpost.org/\"\
    );\n        driver.quit();\n    }\n}\n```\n\n## 23.3 Selendroid - Android application\
    \ testing tool\n\n#### What is Selendroid?\n\nSelendroid is an android application\
    \ testing tool.\n\n#### Setting up environment\n\n- 1. Download and Install Java.\
    \ Set up JAVA_HOME and JRE_HOME. Download and Install Android SDK. For example\
    \ - D:\\Program Files\\Java\\jdk1.8.0_45\n- 2. Set up ANDROID_HOME. Also configure\
    \ system path variable to include Java and Android tools. For example - D:\\Android\\\
    sdk\n- 3. Set up device (Virtual device or Android phone) on which tests have\
    \ to be run. If you are using real Android phone for testing then please enable\
    \ developer option by tapping on the version menu (found in settings->About device)\
    \ 7 times. Once Developer option is made visible, you should enable usb debugging.\n\
    \n#### Difference between Appium and Selendroid\n\nAppium can be used to test\
    \ android as well as iOS applications. Selendroid can only test Android based\
    \ applications. Appium can test application using API level 17 and above. But\
    \ Selendroid can only test application API level 17. We can use UI automate tool\
    \ in Selendroid to inspect the elements of application.\n"
