    \ File(\"c:\\reportfile.html\").exists()){\n    new File(\"c:\\reportfile.html\"\
    ).delete();\n}\n```\n\n以下代码将数据追加到存储在给定 filePath 的现有报告中\n\n```java\npublic static\
