    Username\"));\n    e1.sendKeys(\"userid\");\n    WebElement e2 = driver.findElement(By.id(\"\
    Password\"));\n    e2.sendKeys(\"password\");\n    WebElement e3 = driver.findElement(By.name(\"\
    submit\"));\n    e3.click();\n\n    Boolean isPresent = driver.findElements(By.className(\"\
    logoutlink\")).size()>0;\n\n    if (isPresent == true) {\n        //System.out.println(\"\
    Login was successful\");\n        return true;\n    } else {\n        //System.out.println(\"\
    Login was not successful\");\n        return false;\n    }\n}\n```\n\nPlease note\
    \ that you can write methods to perform more complex operations in similar fashion\n\
    \n### 2. Test Data Sheet in Seleniumdriver\n\nAs displayed in below figure, the\
    \ data sheet contains below columns.\n\n- 1. ID - Test_Case_Name - Name of test\
    \ case\n- 2. Exec_Flag - Execution flag to tell if you want to execute this test\
    \ case Y means that test will be executed\n- 3. Test_Id - Step Id of Test case\n\
    - 4. Test_Case_Steps - Step name of test case\n- 5. Keyword - The name of method\
    \ in library you want to call\n- 6. objectTypes - type of web elements like checkbox,\
    \ list, etc\n- 7. objectNames - Web element identification method and expression\
    \ like xpath\n- 8. objectValues - actual test data you want to enter in webElement\n\
    - 9. parameter1 - extra parameter to drive the method control\n- 10. parameter2\
    \ - one more parameter to drive the method control\n\n### 3. Seleniumdriver in\
    \ Java\n\nThis is the driver instance you will create to execute the test cases.\
