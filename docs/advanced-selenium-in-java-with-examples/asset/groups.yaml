  mdcn: "\n\n# Java 高级 Selenium \n\n![](img/6cb05a5e3a692f75be836db166e84232_0_0.png)\n\
    \n# 实例详解\n\nPAUL WATSON\n\n![](img/6cb05a5e3a692f75be836db166e84232_1_0.png)\n\
    \nhttps://archive.org/details/advancedselenium0000paul\n\n# 关于作者\n\nPaul Watson\
    \ 先生在使用 Selenium Webdriver、Junit、TestNG 和 Cucumber 方面拥有多年经验。他曾在美国、英国、新加坡、香港、迪拜、澳大利亚和瑞士参与过大型软件项目。\n\
    \n他的爱好包括去新的旅游胜地旅行、看篮球、板球球、足球以及学习最新的技术事物。\n\n# 本书适合谁读\n\n本书适用于软件开发人员、自动化测试人员、Devops\
    \ 以及以及从事 Selenium 自动化测试项目的工程师。无论你是初学者还是经验丰富的开发者，本书都将帮助你掌握 Selenium 技能。\n\n本书从介绍\
    \ Selenium 开始，然后深入探讨核心概念，如在 IntelliJ 中设置项目、与 Junit 和 TestNG 的集成、与 Gradle 和 Maven\
    \ 等构建工具的集成。你还将学习如何将 selenium 与 Cucumber 集成。最后，你将学习如何在 TeamCity、Bamboo 和 Jenkins\
    \ 等 CI 服务器上运行 Selenium 测试。你也将学习如何处理各种类型的框架，如页面对象模型（Page object models）、页面工厂、关键字驱动框架等。书中还涉及了使用\
    \ Selenium 进行移动自动相关的概念。\n\n# 前言\n\n在书中，你将找到与 Selenium Webdriver 相关的所有概念。\n\n你将学习以下主题：\n\
    \n- 1. 简介\n- 2. Selenium 架构\n- 3. WebDriver JSON Wire 协议\n- 4. 安装、浏览器\n- 5. 能力\
    \ (Capabilities)\n- 6. 基础操作\n- 7. 元素定位方法\n- 8. 元素操作\n- 9. 同步\n- 10. 高级 XPATH 和\
    \ CSS 表达式\n- 11. 表格操作\n- 12. 多浏览器窗口处理\n- 13. 异常\n- 14. 上下文切换\n- 15. JavascriptExecutor\n\
    - 16. 使用 selenium 的框架 – Junit 和 TestNG\n- 17. BDD 框架 - Cucumber\n- 18. 与 Bamboo、TeamCity\
    \ 和 Jenkins 等 CI 服务器的集成\n- 19. 云端 Selenium\n- 20. 移动应用测试\n- 21. Selenium Grid\n\
    - 22. Selenium 与其他工具对比\n- 23. Selenium 自动化的挑战\n\n# Java 高级 Selenium\n\n- 关于作者\
