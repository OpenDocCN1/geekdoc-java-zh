    # Advanced Selenium in Java


    developer will use the copy and paste the XPath for second button. But we have
    a problem here. The number of employees are not constant. So if today we have
    a Employee Id 142 at second row. But after a few days, it might move to 6th position
    or any other position. So we should write the xpath expression in such a way that
    we should be able to click on the correct Update button even though position of
    the row changes.


    If columns are fixed, you can use below XPATH.


    ```

    //td[contains(text(),''172'')]//following-sibling::td[2]//button

    ```


    If columns are not fixed, you can use below XPATH provided that a row has only
    one button.


    ```

    //td[contains(text(),''172'')]//parent:::tr//button

    ```


    Both the xpath expressions above, find the button relative to the TD tag that
    contains Employee Id. So even if Employee Id row changes, Selenium will find the
    correct button using relative xpath expression.'
