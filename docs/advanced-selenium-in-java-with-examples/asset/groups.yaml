    # 18. Frameworks with selenium


    # 18.1 Keyword driven frameworks in Selenium


    Keyword driven Automation Framework is very popular framework used in Selenium
    Webdriver with Java. In this article I will explain you all details about how
    we can design and use keyword driven automation framework in Selenium Webdriver
    with Java along with example.


    # Keyword driven automation framework in Selenium Webdriver with Java - Introduction


    In keyword driven automation framework we create the methods in Java that are
    mapped to the functionality of the application.


    For example - Suppose you have a bus ticket booking application which provides
    many features like


    +   1. Login to the bus booking website

    2. Search Buses with given source and destination and time

    3. Select the bus tickets

    4. Book bus tickets

    5. Cancel bus tickets

    6. View the booking history

    7. Make the payment.


    To automate the test cases for such web applications, We usually write the methods
    that perform specific task. For example we may write the searchBus method in Java


