    # 10. Synchronization


    # 10.1 Adding synchronization points


    We can add synchronization points in Selenium using 3 ways as mentioned below.


    +   1. Page Load Synchronization

    2. Element Synchronization

    3. Specific condition synchronization


    # Page Load Synchronization


    We can set the default page navigation timeout. Below statement will set the navigation
    timeout as 50. This means that selenium script will wait for maximum 50 seconds
    for page to load. If page does not load within 50 seconds, it will throw an exception.


    ```

    driver.manage().timeouts().pageLoadTimeout(50, TimeUnit.SECONDS);

    ```


    # Element Synchronization


    We can set the default element existance timeout. Below statement will set the
    default object synchronization timeout as 20. This means that selenium script
    will wait for maximum 20 seconds for element to exist. If Web element does not
    exist within 20 seconds, it will throw an exception.


    ```

    driver.manage().timeouts().implicitlyWait(20, TimeUnit.SECONDS);

    ```


    # Synchronization based upon specific condition


    We can also instruct selenium to wait until element is in expected condition.'
