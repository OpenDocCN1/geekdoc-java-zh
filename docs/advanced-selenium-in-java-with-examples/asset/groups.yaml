- md: "\nAbout device 7 times. Once Developer option becomes visible, you should enable\
    \ usb debugging. Then you can attach your device to laptop using usb cable. For\
    \ the first time, your device mac address will be registered in device manager,\
    \ You also need to accept a message with RSA key fingerprint to acknowledge the\
    \ registration on your phone. To check that your device is up and running, you\
    \ must run the command \"adb devices\". This command displays all the devices\
    \ attached to computer.\n\n- Download Selendroid jar files and test apk application.\n\
    \n## First program to test application using Selendroid\n\n```java\nimport io.selendroid.client.SelendroidDriver;\n\
    import io.selendroid.common.SelendroidCapabilities;\nimport org.openqa.selenium.WebDriver;\n\
    \npublic class Sele {\n  /**\n   * @param args\n   */\n  public static void main(String[]\
    \ args) throws Exception {\n    WebDriver driver;\n    SelendroidCapabilities\
    \ x;\n    x = new SelendroidCapabilities(\"io.selendroid.testapp:015.0\");\n \
    \   driver = new SelendroidDriver(x);\n  }\n}\n```\n\n## Advanced Selenium in\
    \ Java\n\n## Running First program using Selendroid\n\ni. Run the command `java\
    \ -jar selendroid.jar -auto selendroid-test.apk`. You should see the server running\
    \ at http://localhost:4444/wd/hub/status\nii. then run above code.\n\n## Troubleshooting\
    \ Issues\n\n- 1. To fix the error - \"Error occurred while resigning the app selendroid\
    \ set the Java_home to home directory.\n- 2. You may see error saying \"The requested\
    \ application under test is not configured in selendroid server.. select correct\
    \ app id from url\". To fix this error, make sure that you have given correct\
    \ app id.\n- 3. emulator: ERROR: x86 emulation currently requires hardware acceleration!\
    \ This error comes when you try to launch virtual device. To fix this you will\
    \ need to install Intel HAXM software.\n\n## Other important points to consider\
    \ –\n\n- 1. You need to download Selendroid client jar file from http://repo1.maven.org/maven2/io/selendroid/selendroid-client/0.15.0/\
    \ - download client. This is required as SelendroidDriver class and other classes\
    \ are defined inside it.\n- 2. You can use tool at below url to inspect the application\
    \ structure. http://localhost:4444/inspector\n\n## Important Android tools –\n\
    \n- 1. Android device monitor shows all devices attached to computer and also\
    \ gives details about app package name, activity name and also we can view the\
    \ app structure and code\n- 2. With AVD Manager, we can manage android devices,\
    \ attach new devices.\n- 3. With SDK Manager, we can install/uninstall android\
    \ api packages.\n- 4. with chrome:://inspect#devices, you can inspect web apps\
    \ in chrome –\n\nBelow screenshot shows the device monitor.\n\n![](img/6cb05a5e3a692f75be836db166e84232_250_0.png)\n\
    \nAdvanced Selenium in Java\n\n## 24. Selenium grid\n\n### 24.1 RemoteWebDriver\
    \ in Selenium\n\nYou will need to use RemoteWebDriver if you want to connect to\
    \ selenium server. We pass the capabilities to remote server which passes the\
    \ commands to appropriate machine where the driver with given capabilities is\
    \ available.\n\nRemoteWebDriver is mainly useful when you are using Selenium Grid\
    \ or running tests in Cloud. One of the constructors of RemoteWebDriver takes\
    \ 2 parameters - url of selenium server and capabilities\n\n### 24.2 Selenium\
    \ grid\n\nSelenium grid allows you to run the same tests on different platforms\
    \ in parallel. Just imagine that you have a web application that can be accessed\
    \ from desktop, laptop, iPad, iPhone, Android phone or any other mobile device.\n\
    \nTesting the same application on all these platforms is a challenging task and\
    \ time consuming as well. But with Selenium Grid you can test your application\
    \ on various platforms very quickly. The beauty about selenium is that you do\
    \ not need to write different code for running tests on various configurations.\
    \ Same selenium code works on all platforms.\n\n## Components of Selenium Grid\
    \ -\n\n- 1. Hub - Selenium Server - Passes on JSON commands to capable nodes.\
    \ A single HUB controls all nodes. HUB knows what are the capabilities of each\
    \ node are like OS, browser etc.\n- 2. Node - Selenium Server driving actual browser.\
    \ On node actual automation execution happens. Each node registers itself with\
    \ the HUB.\n- 3. Test machine - Where your test code is executed.\n\n## Steps\
    \ in Selenium Grid automation execution\n\n- 1. You run your selenium code from\
    \ editor like IntelliJ IDEA or eclipse\n- 2. Your code send http commands to HUB\
    \ including information like what the desired capabilities are. For example -\
    \ you may ask for remote webdriver that can run tests on Windows OS and chrome\
    \ browser.\n- 3. HUB reads the capabilities information and forwards the commands\
    \ to the capable node.\n- 4. Node creates a new session and returns the result\
    \ to HUB.\n- 5. HUB returns the result to your code.\n- 6. All other commands\
    \ are executed in the same session\n\n## Starting Hub\n\nYou can start the hub\
    \ using below command.\n\n```bash\njava -jar server.jar -role hub\n```\n\nYou\
    \ can also use the below command to start the hub with json configuration\n\n\
    ```bash\njava -jar server.jar -role hub -hubConfig myconfig.json\n```\n\n![](img/6cb05a5e3a692f75be836db166e84232_253_0.png)\n\
    \n## Starting Node\n\nYou can start the node using below command. \n\n```bash\n\
    java -jar server.jar -role node -hub http://localhost:4444/grid/register -port\
    \ 3333\n```\n\nYou can also register the node using json file. \n\n```bash\njava\
    \ -jar server.jar -role node -nodeConfig myconfig.json\n```\n\nHere is the sample\
    \ node configuration json file.\n\n```json\n{\n  \"capabilities\": [\n    {\n\
    \      \"platform\": \"WINDOWS\",\n      \"browserName\": \"chrome\",\n      \"\
    maxInstances\": 1,\n      \"seleniumProtocol\": \"WebDriver\"\n    },\n    {\n\
    \      \"platform\": \"WINDOWS\",\n      \"browserName\": \"firefox\",\n     \
    \ \"maxInstances\": 1,\n      \"seleniumProtocol\": \"WebDriver\"\n    },\n  \
    \  {\n      \"platform\": \"WINDOWS\",\n      \"browserName\": \"internet explorer\"\
    ,\n      \"maxInstances\": 1,\n      \"seleniumProtocol\": \"WebDriver\"\n   \
    \ }\n  ],\n  \"configuration\": {\n    \"cleanUp\": 6000,\n    \"register\": 6000,\n\
    \    \"timeout\": 1000,\n    \"polling\": 50000,\n    \"hub\": \"http://localhost:4444/grid\"\
    ,\n    \"proxy\": \"org.openqa.grid.proxy.DefaultProxy\",\n    \"maxSession\"\
    : 2,\n    \"port\": 6666,\n    \"nodeName\": \"node\",\n    \"register\": true,\n\
    \    \"hubPort\": 4444,\n    \"hubHost\": \"localhost\"\n  }\n}\n```\n\nOnce Hub\
    \ and node is up, you can view your grid at below url http://localhost:4444/grid/console\n\
    \n![](img/6cb05a5e3a692f75be836db166e84232_256_1.png)\n"
