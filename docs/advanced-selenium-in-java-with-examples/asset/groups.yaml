    \ page$\", () -> {\n        });\n    }\n}\n```\n\n## 20. Miscellaneous\n\n###\
    \ 20.1 Viewing the remote machine desktop of Linux using VNC\n\nMost of the times,\
    \ tests are run on the remote Linux machines. We can view the execution on remote\
    \ Linux machine using virtual desktop. We need below 2 binaries running on the\
    \ server.\n\n- xvfb - Virtual frame buffer - display server that implements X11\
    \ display server protocol. It does not show anything on screen. Another option\
    \ is Xdummy. So in short, xvfb creates the virtual network computing display in\
    \ memory.\n- VNC Server - xvnc - Virtual network computing (display server). RealVNC,\
    \ x11vnc and TightVNC are other tools that you can use. In short, VNC server allows\
    \ you to start the server attached to display created by xvfb.\n- On the client\
    \ side, you need to install VNC client. VNC client connects to the VNC server\
    \ allowing you to view the virtual display.\n\n### Starting the virtual display\
    \ and VNC server\n\n```bash\nif [ - \"${DISPLAY}\" ]\nthen\n    echo \"DISPLAY\
    \ environment variable is not set\"\n    exit 1\nfi\nXVFB_RUNNING=`ps -efa | grep\
    \ \"Xvfb :97\" | grep -v grep | cat`\n```\n\n## Advanced Selenium Java\n\n```bash\n\
    if [ ! -z \"${XVFB_RUNNING}\" ]; then \n    echo Xvfb is running: ${XVFB_RUNNING}\n\
    \    exit 2\nfi\nVNC_RUNNING=`ps -efa | grep \"Xvnc\" | grep -v grep | grep cat`\n\
