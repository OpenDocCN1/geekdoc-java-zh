    \ in Java\n\n## 5.1 Launch internet explorer\n\nYou can download the IE driver\
    \ from the link - http://docs.seleniumhq.org/download/. IEDriver supports 32 bit\
    \ as well as 64 bit.\n\n# Setting the driver parameters\n\nEnsure that path is\
    \ included in PATH variable or set the property as below.\n\n```\nSystem.setProperty(\"\
    webdriver.driver\", \"F:\\selenium\\java\\iedriver.exe\");\n```\n\nOther properties\
    \ that we can set are given below.\n\n- 1. webdriver.driver.host\n2. webdriver.driver.loglevel\n\
    3. webdriver.driver.logfile\n4. webdriver.driver.silent\n\n# Browser Settings\n\
    \nEnsure that mode settings for all zones should be the same and for IE10 and\
    \ above, enhanced mode must be disabled and the browser level must be set to 100%.\n\
    \nFor IE11 only, You Will need to edit below registry keys.\n\nFor 32-bit Windows,\
