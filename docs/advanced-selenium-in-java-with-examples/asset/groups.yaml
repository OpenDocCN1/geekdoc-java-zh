    \n![](img/6cb05a5e3a692f75be836db166e84232_250_0.png)\n\nJava 高级 Selenium\n\n\
    ## 24. Selenium grid\n\n### 24.1 Selenium 中的 RemoteWebDriver\n\n如果你想连接到 selenium\
    \ 服务器，则需要使用 RemoteWebDriver。我们将能力（capabilities）传递给远程服务器，由服务器将命令传递给具有给定能力的相应机器。\n\
    \n当你在使用 Selenium Grid 或在云端运行测试时，RemoteWebDriver 特别有用。RemoteWebDriver 的一个构造函数接受\
    \ 2 个参数 - selenium 服务器的 url 和 capabilities。\n\n### 24.2 Selenium grid\n\nSelenium\
    \ grid 允许你在不同的平台上并行运行相同的测试。想象你有一个 Web 应用，可以通过台式电脑、笔记本电脑、iPad、iPhone、Android 手机或任何移动设备访问。\n\
    \n在所有这些平台上测试同一个应用程序是一项具有挑战性且耗时的任务。但通过 Selenium Grid，你可以非常快速地在各种平台上测试你的应用程序。Selenium\
    \ 的之处在于，你不需要为在不同配置上运行测试编写不同的代码。相同的 selenium 代码可以在所有平台上运行。\n\n## Selenium Grid\
    \ 的组件 -\n\n- 1. Hub - Selenium Server - 将 JSON 命令传递给能力的节点。单个 HUB 控制所有节点。HUB 知道每个节点的能力，如操作系统、浏览器等。\n\
    - 2. Node - 驱动实际浏览器的 Selenium Server。实际的自动化执行在节点上进行。每个节点向 HUB 注册自己。\n- 3. Test\
    \ machine - 执行测试代码的地方。\n\n## Selenium Grid 自动化执行的步骤\n\n- 1. 你在 IntelliJ IDEA 或\
    \ eclipse 等编辑器中运行 selenium 代码\n- 2. 你的代码向 HUB 发送 http 命令，包括所需能力等信息。例如 - 你可能请求一个可以在\
    \ Windows 操作系统和 chrome 浏览器上运行测试的远程 webdriver\n- 3. HUB 读取能力信息并将命令转发给能力的节点\n- 4.\
    \ Node 创建新会话并将结果返回给 HUB\n- 5. HUB 将结果返回给你的代码\n- 6. 所有其他命令将在同一个会话执行\n\n## 启动 Hub\n\
    \n你可以使用下面的命令启动 hub。\n\n```bash\njava -jar server.jar -role hub\n```\n\n你也可以使用下面的命令通过\
    \ json 配置启动 hub。\n\n```bash\njava -jar server.jar -role hub -hubConfig myconfig.json\n\
    ```\n\n![](img/6cb05a5e3a692f75be836db166e84232_253_0.png)\n\n## 启动 Node\n\n你可以使用下面的命令启动\
    \ node。\n\n```bash\njava -jar server.jar -role node -hub http://localhost:4444/grid/register\
    \ -port 3333\n```\n\n你也可以使用 json 文件注册 node。\n\n```bash\njava -jar server.jar -role\
    \ node -nodeConfig myconfig.json\n```\n\n这里是节点配置 json 文件的示例。\n\n```json\n{\n \
    \ \"capabilities\": [\n    {\n      \"platform\": \"WINDOWS\",\n      \"browserName\"\
    : \"chrome\",\n      \"maxInstances\": 1,\n      \"seleniumProtocol\": \"WebDriver\"\
    \n    },\n    {\n      \"platform\": \"WINDOWS\",\n      \"browserName\": \"firefox\"\
    ,\n      \"maxInstances\": 1,\n      \"seleniumProtocol\": \"WebDriver\"\n   \
    \ },\n    {\n      \"platform\": \"WINDOWS\",\n      \"browserName\": \"internet\
    \ explorer\",\n      \"maxInstances\": 1,\n      \"seleniumProtocol\": \"WebDriver\"\
    \n    }\n  ],\n  \"configuration\": {\n    \"cleanUp\": 6000,\n    \"register\"\
    : 6000,\n    \"timeout\": 1000,\n    \"polling\": 50000,\n    \"hub\": \"http://localhost:4444/grid\"\
    ,\n    \"proxy\": \"org.openqa.grid.proxy.DefaultProxy\",\n    \"maxSession\"\
    : 2,\n    \"port\": 6666,\n    \"nodeName\": \"node\",\n    \"register\": true,\n\
    \    \"hubPort\": 4444,\n    \"hubHost\": \"localhost\"\n  }\n}\n```\n\n一旦 Hub\
    \ 和 node 启动，你可以在下面的 URL 查看你的 grid：http://localhost:4444/grid/console\n\n![](img/6cb05a5e3a692f75be836db166e84232_256_1.png)\n"
