    \ test cases with different input test data. This speeds up the automation process\
    \ with increased productivity.\n\n## The Components of keyword driven automation\
    \ framework in Selenium Webdriver with Java\n\nEach keyword driven automation\
    \ framework has some common components as mentioned below.\n\n- 1. Java Class\
    \ Library with functionality specific methods.\n- 2. Test Data Sheet (generally\
    \ in excel format)\n- 3. Selenium Webdriver with Java.\n- 4. Reports in HTML format)\n\
    - 5. Main Java driver script\n\n### 1. Java Class Library with functionality specific\
    \ methods.\n\nAs explained earlier, we can create methods for functionality in\
