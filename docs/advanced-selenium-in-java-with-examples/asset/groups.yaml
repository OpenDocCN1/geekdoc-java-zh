  mdcn: "\n\n## 7.6 如何获取当前 URL\n\n在 Selenium 中，可以使用下面的代码获取浏览器的当前 URL。\n\n```java\n\
    String currentUrl = driver.getCurrentUrl();\n```\n\n## 7.7 如何刷新页面\n\n你可以使用下面的代码在\
    \ Selenium 中刷新页面。\n\n```java\ndriver.navigate().refresh();\n```\n\n或者，你也可以通过使用\
    \ sendKeys 方法或 Robot 类按下 F5 键来刷新页面。\n\n## 7.8 如何获取当前页面的 HTML 源代码\n\n下面的代码可以用于获取\
    \ Selenium 中当前网页的 HTML 源代码。\n\n```java\nString pageSource = driver.getPageSource();\n\
    ```\n\n## 7.9 调整和移动浏览器窗口\n\n要调整浏览器窗口的大小，可以使用下面的代码。Dimension 构造函数接受 2 个参数 - 窗口的高度和宽度。\n\
    \n```java\ndriver.manage().window().setSize(new Dimension(100, 100));\n```\n\n\
    要设置浏览器窗口的位置，可以使用下面的代码。Point 构造函数接受 2 个参数 - 浏览器窗口的 X 和 Y 坐标。以下语句将窗口向下移动 200 像素。\n\
    \n```java\ndriver.manage().window().setPosition(new Point(0,200));\n```\n\n要最大化窗口，可以使用下面的代码。\n\
    \n```java\ndriver.manage().window().maximize();\n```\n\n## 8. 元素识别\n\n元素识别方法在\
    \ Java、C# .Net 等所有编程语言中都是通用的，只是语法有所不同。\n\n我们可以使用下面的方法在 Selenium WebDriver 中识别\
    \ Web 元素：\n\n- 1. 通过 Xpath\n- 2. 通过 Css Selectors\n- 3. 通过 Id\n- 4. 通过 Name\n\
    - 5. 通过 Tag Name\n- 6. 通过 Class Name\n- 7. 通过 Linktext（链接文本）\n- 8. 通过 Partial\
    \ Link text（部分链接文本）\n\n在这些方法中，xpath 和 css 方法非常流行且。我们可以使用 xpath 和 css 选择器识别网页中的各种元素。\n\
    \n只要给定的元素分配了 id、name 或 class name，我们也可以使用 Id、Name、Class Name 来识别元素。\n\n我们还可以使用\
    \ table、div、form 等 html 标签来识别元素。\n\n为了识别链接，selenium driver 提供了 link text 和 Partial\
    \ link text 两个额外方法。\n\n### Java 中的 Web 元素识别示例 -\n\n```java\ndriver.findElement(By.tagName(\"\
    TD\"));\n```\n\n上述方法将返回具有指定标签 - TD 的第一个元素。\n\n示例 -\n\n```java\nWebElement e =\
    \ driver.findElement(By.tagName(\"div\"));\n```\n\n上面的代码将获取标签为 div 的第一个元素。\n\n\
    要获取所有的 div 元素，可以使用下面的代码\n\n```java\nList <WebElement> we_collection = driver.findElements(By.tagName(\"\
    div\"));\n```\n\n请注意，获取单个元素我们使用 `findElement` 方法，而获取元素集合我们使用 `findElements` 方法。\n\
    \n如果你知道元素的类名，可以使用下面的代码访问该元素：\n\n```java\ndriver.findElement(By.className(\"box\"\
    ));\n```\n\n如果你知道元素的 id，可以使用下面的代码访问元素：\n\n```java\ndriver.findElement(By.id(\"\
    selenium\"));\n```\n\n如果你知道 name 属性的值，可以使用下面的代码访问元素：\n\n```java\ndriver.findElement(By.name(\"\
    sagar\"));\n```\n\n要查找网页中的链接，下文所述了两种方法：\n\n```java\ndriver.findElement(By.partialLinkText(\"\
    news\"));\ndriver.findElement(By.linkText(\"hello\"));\n```\n\n如果你知道链接名称的局部，可以使用\
    \ `By.partialLinkText`。\n如果你知道完整的链接名称，可以使用 `By.linkText`。\n\n如果你知道元素的 xpath 表达式，可以使用下面的代码访问元素：\n\
    \n```java\ndriver.findElement(By.xpath(\"//table\"));\n```\n\n如果你知道元素的 css 表达式，可以使用下面的代码访问元素：\n\
    \n```java\ndriver.findElement(By.cssSelector(\"#kid\"));\n```\n\n### 查找所有元素可以使用下面的语法。\n\
    \n```java\nList<WebElement> cells = tr.get(1).findElements(By.tagName(\"td\"));\n\
    ```\n\n上面的代码将选择网页中所有的 TD 元素。\n\n请注意，一些自动化工程师在元素识别时使用不同的术语，例如对象识别方法或 Selenium 定位器等。在\
    \ UFT 中，我们使用对象库（object repository）来存储对象。在 Selenium 中，我们没有单独的文件来存储对象或元素。但我们可以创建自定义文件，在其中存储有关对象及其定位器的信息。\n\
    \n## 8.2 检查元素是否真的存在页面上\n\n使用 Selenium 进行自动化测试经常会遇到检查特定元素是否存在的情况。\n\n我们可以使用 Java\
    \ 中下面的代码轻松地实现这一点。\n\n```java\nif (driver.findElements(By.id(\"abc\")).size() !=\
    \ 0)\n    System.out.println(\"Element is present\");\nelse\n    System.out.println(\"\
    Element is not present\");\n```\n\n在 Java 或 Python 等其他语言 API 中，你可以使用类似的方法来检查元素是否存在。\n\
    \n请注意，如果你使用 `FindElement` 方法，将抛出 `NoSuchElementException`。\n\n## 0.3 检查弹窗是否真的存在页面上\n\
    \n你可以使用下面的代码检查网页上是否打开了 Alert 弹窗（模态对话框）。\n\n```java\ntry {\n    driver.switchTo().alert();\n\
    \    // Alert 存在且我们已切换它\n} catch (NoAlertPresentException exception) {\n    //\
    \ 如果 alert 不存在，将执行此块\n}\n```\n\n## 9. 元素操作\n\n点击按钮、链接以及任何其他元素。我们可以使用 id 点击任何 Web\
    \ 元素。\n\n示例 -\n\n```java\nWebElement e = driver.findElement(By.id(\"myid\"));\n\
    ```\n\n上面的代码将点击 id 值为 myid 的元素。\n\n我们也可以使用下述的 JavaScript 代码点击 Web 元素：\n\n```java\n\
    ((JavascriptExecutor)driver).executeScript(\"arguments[0].click()\",e);\n```\n\
    \n## 9.2 在文本框中输入数据\n\n我们可以使用 sendKeys 方法在网页的编辑框或输入框中输入数据。\n\n```java\nWebElement\
    \ e = driver.findElement(By.id(\"mainb\"));\ne.sendKeys(\"hello\");\n```\n\n上面的代码将在\
    \ id 为 mainb 的编辑框/文本框中输入 hello。\n\n"
