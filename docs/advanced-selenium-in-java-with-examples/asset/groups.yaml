    register\": true\n  }\n}\n```\n\n255\n\n```json\n  \"registerCycle\": 6000,\n\
    \  \"role\": \"node\"\n}\n```\n\nHere is the sample json configuration file for\
    \ Android\n\n```json\n{\n  \"capabilities\": [\n    {\n      \"deviceName\": \"\
