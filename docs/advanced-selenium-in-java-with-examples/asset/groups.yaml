    \nConsider a scenario wherein you are expecting specific element to appear within\
    \ 20 seconds. Time to load that element might change from 5 seconds to 20 seconds.\
    \ In this situation, we can use Fluent Wait as mentioned in below example.\n\n\
    ```java\n@Test\npublic void testWait() {\n  String driver = System.setProperty(\"\
    webdriver.chrome.driver\", \"C:\\chromedriver.exe\");\n  driver = new ChromeDriver();\n\
    }\n```\n"
