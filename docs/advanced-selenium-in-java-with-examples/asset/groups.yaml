    \    try {\n        File temp = new File(filePath);\n        FileWriter fw = new\
    \ FileWriter(temp, true);\n        fw.append(data);\n        fw.close();\n   \
    \ } catch (Exception e){}\n}\n```\n\n请注意，你需要导入 `java.io` 包中的类来处理文件。\n\n### 5.\
