    Advanced Selenium in Java


    # # 24. Selenium grid


    # ## 24.1 RemoteWebDriver in Selenium


    You will need to use RemoteWebDriver if you want to connect to selenium server.
    We pass the capabilities to remote server which passes the commands to appropriate
    machine where the driver with given capabilities is available.


    RemoteWebDriver is mainly useful when you are using Selenium Grid or running tests
    in Cloud. One of the constructors of RemoteWebDriver takes 2 parameters - url
    of selenium server and capabilities


    # ## 24.2 Selenium grid


    Selenium grid allows you to run the same tests on different platforms in parallel.
    Just imagine that you have a web application that can be accessed from desktop,
    laptop, iPad, iPhone, Android phone or any other mobile device.


    Testing the same application on all these platforms is a challenging task and
    time consuming as well. But with Selenium Grid you can test your application on
    various platforms very quickly. The beauty about selenium is that you do not need
    to write different code for running tests on various configurations. Same selenium
    code works on all platforms.'
  - '[PAGE 252]


    # Advanced Selenium in Java


    # Components of Selenium Grid -


    +   1. Hub - Selenium Server - Passes on JSON commands to capable nodes. A single
    HUB controls all nodes. HUB knows what are the capabilities of each node are like
    OS, browser etc.


    +   2. Node - Selenium Server driving actual browser. On node actual automation
    execution happens. Each node registers itself with the HUB.


    +   3. Test machine - Where your test code is executed.


    # Steps in Selenium Grid automation execution


    +   1. You run your selenium code from editor like IntelliJ IDEA or eclipse


    +   2. Your code send http commands to HUB including information like what the
    desired capabilities are. For example - you may ask for remote webdriver that
    can run tests on Windows OS and chrome browser.


    +   3. HUB reads the capabilities information and forwards the commands to the
    capable node.


    +   4. Node creates a new session and returns the result to HUB.


    +   5. HUB returns the result to your code.


    +   6. All other commands are executed in the same session


    # Starting Hub


    You can start the hub using below command.


    ```

    java -jar server.jar -role hub

    ```'
