    x\")));\n\n//below statement will wait until element becomes clickable.\np=w.until(ExpectedConditions.elementToBeClickable(By.id(\"\
    ss\")));\n```\n\n## 10.2 How to avoid Thread.Sleep in Selenium\n\nI have seen\
    \ many automation engineers using fixed wait (sleep) statements in selenium or\
    \ any other automation tool. My personal opinion says that we should never use\
    \ fixed wait statements in the code as it will slow down the test execution unnecessarily.\
    \ Sometimes fixed sleep statements might solve your problems. Let us say you added\
    \ a statement to wait for 5 seconds and the code is working fine today but what\
    \ will happen if in next release 5 second wait is not sufficient. We never know.\
    \ This is a risky approach and a bad coding practice.\n\n## Advanced Selenium\
    \ in Java\n\nWhen test cases are failing due to synchronization issues, we often\
    \ tend to blame the network speed, application latency or browser limitations.\
    \ But that is not the case at all times. You can avoid these wait statements in\
    \ your code by adopting standard coding practices as mentioned below.\n\n- 1.\
    \ Use WebDriverWait and ExpectedConditions class - I recommend that we should\
    \ use these classes whenever we think that test might fail due to synchronization\
    \ issue. With the help of these classes we can make selenium webdriver wait until\
    \ some condition is satisfied like specific element enabled or displayed.\n- 2.\
    \ While switching to the new window, ensure that the web document is really loaded\
    \ into the window before trying to perform any operation. In one of the projects,\
    \ I faced the issue in which I was trying to switch to the window. But due to\
    \ the latency, test was failing unpredictably. I ensured that count of window\
    \ handles is 2. But still I was facing the issue in random runs. I used 10 second\
    \ fix wait but still problem persisted. I kept on increasing the sleep time but\
    \ finally I realized that must be better technique to handle this scenario. Then\
    \ I used a loop to check that title of the window has changed as per the expected\
    \ one and then I tried to switch to it. This made my code more robust. This is\
    \ how I got rid of sleep statements in the code. If you are still not able to\
    \ switch to the new window, try to switch to the first window and re-switch to\
    \ the new window.\n- 3. Another scenario where testers often use wait statements\
    \ is when selecting the value from the Advanced Selenium in Java drop down. The\
    \ issue here is - After selecting the value from the drop down box, new web controls\
    \ or elements are added or removed from the page dynamically. In this situation,\
    \ sometimes page itself become unresponsive. In this case, we can use custom function\
    \ which will use loop until we have performed our operation successfully.\n\n\
    ## 10.3 wait until element is displayed\n\nBelow example illustrates how to wait\
    \ until element is displayed in Selenium. Please note that we are not using any\
    \ wait conditions. Below methods are useful when handling Ajax requests. Ajax\
    \ gets the data from server and displays it on the page dynamically. So we can\
    \ use below method until element is displayed.\n\n```java\npublic boolean waitUntilElementIsDisplayed(By\
    \ by, int seconds) {\n    if (checkElementExists(by,seconds)) {\n        for (int\
    \ i=0;i<seconds;i++) {\n            if (driver.findElement(by).isDisplayed())\
    \ {\n                return true;\n            } else {\n                sleep(1000);\n\
    \            }\n        }\n        return false;\n    } else {\n        return\
    \ false;\n    }\n}\n```\n\n```java\npublic boolean checkElementExistsBy(By by,\
    \ int seconds) {\n    boolean result=false;\n    try {\n        driver.manage().timeouts().\n\
    \        implicitlyWait(seconds, TimeUnit.SECONDS);\n        driver.findElement(by);\n\
    \        result = true;\n    }\n    catch (org.openqa.selenium.NoSuchElementException\
    \ ex) {\n        result = false;\n    }\n    finally {\n        driver.manage().timeouts().\n\
    \        implicitlyWait(20, TimeUnit.SECONDS);\n    }\n    return result;\n}\n\
    ```\n\n## 10.4 Explicit Wait Conditions\n\nWe have below wait conditions in Selenium\
    \ C# API.\n\n- 1. Wait until Element exists in page\n- 2. Wait until Element becomes\
    \ visible on page\n- 3. Wait until page title becomes expected\n\n## Advanced\
    \ Selenium in Java\n\n## 10.5 Wait until element disappears\n\nBelow code waits\
    \ until element disappears in Selenium.\n\n```java\npublic void waitUntilDisappear(By\
    \ by) {\n    for (int i=0;i<=60;i++) {\n        if (checkElementExists(by)) {\n\
    \            sleep(1000);\n        } else {\n            break;\n        }\n \
    \   }\n}\n```\n\n## Advanced Selenium in Java\n\n## 10.6 Wait until page title\
    \ changes\n\nBelow method will wait until page title changes to the one passed\
    \ as parameter in Selenium.\n\n```java\npublic boolean waitUntilTitle(String title)\
    \ {\n    for (int i=0;i<60;i++) {\n        if (driver.getTitle().equalsIgnoreCase(title))\
    \ {\n            return true;\n        } else {\n            sleep(1000);\n  \
    \      }\n    }\n    return false;\n}\n```\n\n## Advanced Selenium in Java\n\n\
    ## 10.7 check if element exists\n\nBelow code demonstrates how to check if an\
    \ element exists. The code returns true if element exists. It returns false if\
    \ element is not found. Please note that code will not throw the exception if\
    \ element is not present.\n\n```java\npublic boolean checkElementExists(By by,\
    \ int seconds) {\n    boolean result=false;\n    try {\n        driver.manage().timeouts().implicitlyWait(seconds,\
    \ TimeUnit.SECONDS);\n        driver.findElement(by);\n        result = true;\n\
    \    } catch (org.openqa.selenium.NoSuchElementException ex) {\n        result\
    \ = false;\n    } \n    finally {\n        driver.manage().timeouts().implicitlyWait(20,\
    \ TimeUnit.SECONDS);\n    }\n    return result;\n}\n```\n\n## 10.8 Fluent Wait\n\
    \nFluent wait is used to synchronize the elements in the browser.\n\nFluent wait\
