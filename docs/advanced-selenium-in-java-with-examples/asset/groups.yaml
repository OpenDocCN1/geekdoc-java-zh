- md: "\n# 17. JavascriptExecutor\n\nBelow code will illustrate how we can execute\
    \ javascript in selenium webdriver.\n\nPlease note that we need to import below\
    \ interface\n\n```java\nimport org.openqa.selenium.JavascriptExecutor;\n```\n\n\
    Return innertext of the entire webpage using JavascriptExecutor\n\n```java\nString\
    \ x=((JavascriptExecutor) driver).executeScript(\"return document.documentElement.innerText;\"\
    ).toString();\n```\n\nReturning the document node of the webpage\n\n```java\n\
    WebElement p=(WebElement)((JavascriptExecutor) driver).executeScript(\"return\
    \ document.documentElement;\");\n```\n\n# Finding the browser name using JavascriptExecutor\n\
    \n```java\npublic boolean getBrowserName() {\n    String agent = (String) ((JavascriptExecutor)\
    \ driver)\n        executeScript(\"return navigator.userAgent\");\n    if (agent.toLowerCase().contains(\"\
    chrome\")) {\n        return \"Chrome\";\n    }\n    else if (agent.toLowerCase().contains(\"\
    firefox\")) {\n        return \"Firefox\";\n    }\n    else if (agent.toLowerCase().contains(\"\
    .net\")) {\n        return \"IE\";\n    }\n    else if (agent.toLowerCase().contains(\"\
    macintosh\") || agent.toLowerCase().contains(\"safari\")) {\n        return \"\
    Safari\";\n    }\n}\n```\n\n# Finding the screen width using JavascriptExecutor\n\
    \n```java\nboolean isScreenWidthSmall()\n{\n  Long width = (Long)(((JavascriptExecutor)\
    \ \n  driver).executeScript(\"return window.screen.width;\"));\n\n  if (width\
    \ < 767)\n    return true;\n  else\n    return false;\n}\n```\n\n# Scrolling using\
    \ JavascriptExecutor\n\n```java\npublic void scrollToElement(WebElement element)\
    \ \n{\n  ((JavascriptExecutor) driver).\n  executeScript(\"arguments[0].scrollIntoView();\"\
    , \n  element);\n  ((JavascriptExecutor) \n  driver).executeScript(\"window.scrollBy(0,-111)\"\
    );\n}\n\npublic void scrollToTop() \n{\n  ((JavascriptExecutor) \n  driver).executeScript(\"\
    window.scrollTo(0,200)\");\n}\n```\n\n# Get document state using JavascriptExecutor\n\
    \n```java\npublic String getDocumentState() {\n    String state = ((JavascriptExecutor)driver)\n\
    \    executeScript(\"return document.readyState;\");\n    return state;\n}\n```\n\
    \n# Get Inner HTML of document using JavascriptExecutor\n\n```java\npublic String\
    \ getInnerHtml(WebElement element) {\n    ((JavascriptExecutor)driver)\n    executeScript(\"\
    return arguments[0].innerHTML;\",element);\n}\n```\n\n# Clicking on element using\
    \ JavascriptExecutor\n\n```java\nprotected void clickJavascript(WebElement element)\
    \ {\n    ((JavascriptExecutor)driver)\n    executeScript(\"arguments[0].click();\"\
    ,element);\n}\n```\n\n# Complete example to execute javascript is given below\
    \ in Java\n\n```java\npackage abc;\nimport java.util.concurrent.TimeUnit;\nimport\
    \ org.openqa.selenium.By;\nimport org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.WebElement;\n\
    import org.openqa.selenium.chrome.ChromeDriver;\nimport org.openqa.selenium.JavascriptExecutor;\n\
    \npublic class ExecuteJavaScript {\n    public static void main(String[] args)\
    \ {\n        System.setProperty(\"webdriver.chrome.driver\", \"F:\\\\chromedriver.exe\"\
    );\n        WebDriver driver = new ChromeDriver();\n\n        try {\n        \
    \    driver.manage().timeouts().implicitlyWait(20, TimeUnit.SECONDS);\n      \
    \      driver.manage().timeouts().pageLoadTimeout(50, TimeUnit.SECONDS);\n   \
    \         driver.manage().timeouts().explicitWait(20, TimeUnit.SECONDS);\n\n \
    \           driver.get(\"http://www.google.com\");\n\n            String x = ((JavascriptExecutor)driver).executeScript(\"\
    return document.documentElement.innerText;\").toString();\n\n            // sometimes\
    \ we want to click on elements so we can use below code\n            // below\
    \ statement will click on element e.\n            ((JavascriptExecutor)\n    \
    \        driver).executeScript(\"arguments[0].click();\",e);\n\n            //\
    \ print the contents of open page\n            System.out.println(x);\n\n    \
    \        Thread.sleep(2000);\n        } catch(Exception ex) {\n            System.out.println(ex.toString());\n\
    \        } finally {\n            driver.close();\n            driver.quit();\n\
    \        }\n    }\n}\n```\n\nJavascript plays very important role when we are\
    \ not able to perform complex operation on the element on the webpage. We can\
    \ use all HTML methods and properties using javascript.\n\nWe can pass the parameters\
    \ to execute the script as below.\n\n```java\n((JavascriptExecutor)driver).executeScript(\"\
    arguments[0].click();\",e);\n```\n\nIn above code I have passed element - e to\
    \ execute script. I can access the passed argument using arguments[] array.\n\n\
    # Advanced Selenium in Java - 7.2 How to scroll element in Selenium\n\nWhen automating\
    \ iOS applications running on iPad or iPhone in Safari, you encounter exceptions\
    \ like element is not visible. But the same code works fine on other browsers\
    \ like chrome and firefox. So what is causing the issue in safari?\n\nTo fix this\
    \ issue, you need to scroll to element and work on that element. Below method\
    \ will accept the element and scroll to it.\n\n```java\npublic void scrollToElement(WebElement\
    \ element) {\n    ((JavascriptExecutor) driver).executeScript(\"arguments[0].scrollIntoView();\"\
    ,element);\n    ((JavascriptExecutor) driver).executeScript(\"window.scrollBy(0,-100)\"\
    )\n}\n```\n\n# 17.3 Click not working Selenium\n\nSometimes click method of selenium\
    \ does not work. In such situations, you can use below solutions.\n\n- Use javascript\n\
    - Use Actions class\n\nBy using javascript, you can click on any element.\n\n\
    ```java\nWebElement element = driver.findElement(By.linkText(\"Log in\")); jsClick(element);\n\
    \npublic static void jsClick(WebElement element) {\n    ((JavascriptExecutor)\
    \ driver).executeScript(\"arguments[0].click();\",element);\n}\n```\n\nBy using\
    \ Actions, you can click on any element.\n\n```java\nWebElement element = driver.findElement(By.linkText(\"\
    Log in\")); clickByActions(element);\n\npublic static void clickByActions(WebElement\
    \ element) {\n    Actions builder = new Actions(driver);\n    Action click = builder.click(element).build();\n\
    \    click.perform();\n}\n```\n\n# 17.4 Enter data in test box using JavaScript\n\
    \nSometimes, sendKeys method does not work on text boxes. In such scenarios, you\
    \ can use JavascriptExecutor to set the value in edit box. Below method takes\
    \ 2 arguments. It sets the value passed in second argument in text box identified\
    \ as first parameter.\n\n```java\nprotected void setValueByJavascript(WebElement\
    \ element, String value) {\n    ((JavascriptExecutor) driver).executeScript(\"\
    arguments[0].value='{{'+value+''\", element);\n}\n```\n\n# 17.5 Selecting drop\
    \ down value using JavaScript\n\nSometimes you may encounter a scenario where\
    \ selenium Select class can not be used to select the value from the drop down\
    \ or list box in any browser like internet explorer, google chrome or firefox.\
    \ Sometimes situation is more difficult because after selecting the value from\
    \ drop down, other controls on the page get auto populated. So basically there\
    \ are 2 problems.\n\n- Selenium unable to select the value from the drop down.\n\
    - Java script event does not get invoked. So other controls do not get auto populated.\n\
    \n# Advanced Selenium in Java\n\nWe solve above issues by below code.\n\n```java\n\
    WebElement c = driver.findElement(By.xpath(\"//select[@name='type']\"));\n((JavascriptExecutor)\
    \ driver).executeScript(\"arguments[0].value='X';\",c);\n```\n\nAbove script will\
    \ select value X from the drop down.\n\nAfter this you will have to trigger the\
    \ on event on the drop down using below code.\n\n```java\n((JavascriptExecutor)\
    \ driver).executeScript(\"var evt = document.createElement('Event');\nevt.initEvent('change',\
    \ true, true);\narguments[0].dispatchEvent(evt);\",c);\n```\n\nThis will fire\
    \ the drop down change event on the web list.\n\n# 18. Frameworks with selenium\n\
    \n# 18.1 Keyword driven frameworks in Selenium\n\nKeyword driven Automation Framework\
    \ is very popular framework used in Selenium Webdriver with Java. In this article\
    \ I will explain you all details about how we can design and use keyword driven\
    \ automation framework in Selenium Webdriver with Java along with example.\n\n\
    # Keyword driven automation framework in Selenium Webdriver with Java - Introduction\n\
    \nIn keyword driven automation framework we create the methods in Java that are\
    \ mapped to the functionality of the application.\n\nFor example - Suppose you\
    \ have a bus ticket booking application which provides many features like\n\n\
    -1. Login to the bus booking website\n2. Search Buses with given source and destination\
    \ and time\n3. Select the bus tickets\n4. Book bus tickets\n5. Cancel bus tickets\n\
    6. View the booking history\n7. Make the payment.\n\nTo automate the test cases\
    \ for such web applications, We usually write the methods that perform specific\
    \ task. For example we may write the searchBus method in Java\n"
