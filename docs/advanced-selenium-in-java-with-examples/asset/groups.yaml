    # Advanced Selenium in Java


    +   1. It can be used to send the log messages to multiple appenders like file,
    console etc

    2. Various log level are OFF, FATAL, ERROR, WARN, INFO, DEBUG and TRACE.

    3. If you set the log level as WARN, then only higher level (FATAL and ERROR)log
    messages are logged.

    4. It allows you to set the log level at root level as well as class level.

    5. We restrict the log level for each appender using threshold parameter.


    Here is the sample log4j.properties file. We usually keep this file in resources
    directory of the Java project.


    ```

    # We have specified the logging level as INFO and 2 appenders are set up

    log4j.rootLogger=INFO, mystdoutappender, myfileappender

    # Send log messages to file with name mylog4j.log

    log4j.appender.fileappender=org.apache.log4j.FileAppender

    log4j.appender.fileappender.File=mylog4j.log

    log4j.appender.fileappender.layout=org.apache.log4j.PatternLayout

    log4j.appender.fileappender.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %5p
    %c{1}:%L - %m%n

