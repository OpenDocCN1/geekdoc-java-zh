    \    try {\n        File temp = new File(filePath);\n        FileWriter fw = new\
    \ FileWriter(temp, true);\n        fw.append(data);\n        fw.close();\n   \
    \ } catch (Exception e){}\n}\n```\n\nPlease note that you will need to import\
    \ the classes in package java.io to work with files.\n\n### 5. Main driver script\
