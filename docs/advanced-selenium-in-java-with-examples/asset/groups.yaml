    Whatever is the name of window, you need to\npass it here.\n\nWinWaitActive(\"\
    Open\")\n\n;below line will enter the file location to be\nupload.\nSend(\"C:\\\
    Users\\sagar\\Documents\\onion_fennel_bisque.jpg\")\n\n;finally we need to click\
    \ on Ok or press enter\nto start the upload process.\nSend(\"{ENTER}\")\n```"
