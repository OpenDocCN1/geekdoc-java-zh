  trans: "\n\n# 核心要点\n\n- `Mockito.mock()`：创建一个 mock 对象。\n- `when(...).thenReturn()`：配置\
    \ mock 对象的行为。\n\n## 5. 基础之外\n\n- **插件**：探索如 `maven-surefire-plugin` 等插件以控制测试执行。\n\
    - **配置文件 (Profiles)**：使用 `<profiles>` 定义不同的 Maven 配置（例如针对不同的测试环境）。\n\n## 让我们实践起来！\n\
    \n在下一章节中，我们将开始理解“被测系统”（System Under Test）——即你将测试的代码——以及如何对其进行设置以便有效地使用 Mockito。\n\
    \n## 额外资源\n\n- **Maven 仓库**（获取最新库版本）：[`mvnrepository.com/`](https://mvnrepository.com/)\n\
    - **Mockito 官网**:[`site.mockito.org/`](https://site.mockito.org/)\n\n准备好开始定义你想要测试的代码了吗？\n\
    \n# 定义被测系统 (SUT) – 第一部分\n\n让我们进入使用 Mockito 测试的核心。理解你的被测系统对于编写高效且聚焦的单元测试至关重要。\n\
    \n### 1. 什么是被测系统 (SUT)？\n\n- SUT 是你正在隔离并测试的特定代码片段。这可能是：\n    - 单个类\n    - 一组相关的类\n\
    \    - 类中的某个方法\n\n### 2. 单元测试的精神\n\n- **聚焦**：真正的单元测试会精确定位代码库中微小、独立部分的问题。\n- **解耦**：目标是与它的协作者隔离，对单元进行独立测试。Mockito\
    \ 将是我们实现这一点的工具。\n\n### 3. 识别 SUT\n\n在决定什么构成你的 SUT 时，请考虑以下因素：\n\n- **粒度**：你希望测试细到什么种程度？测试单个方法与测试整个类是在“精准定位问题”和“设置便利”之间的权衡。\n\
    - **逻辑分布**：如果核心逻辑分散在多个类中，可能需要对 SUT 有更宽泛的定义。\n- **协作者**：你的代码与哪些类或服务交互？这些将是使用 Mockito\
    \ 进行 mock 的理想候选对象。\n\n#### 示例：订单处理\n\n场景：你想测试一个 `OrderProcessingService`。以下是潜在的\
    \ SUT 范围：\n\n- **窄粒度 SUT**：`OrderProcessingService` 的 `calculateTax(Order)` 方法。\n\
    - **中粒度 SUT**：整个 `OrderProcessingService` 类。\n- **宽粒度 SUT**：`OrderProcessingService`，它与\
    \ `InventoryManager` 和 `PaymentGateway` 等类交互（尽管这些类会被 mock）。\n\n### 4. 良好 SUT 的考虑因素\n\
    \n- **内聚性**：理想的 SUT 具有定义良好的职责和内部逻辑。\n- **最小化依赖**：复杂的依赖网络使得难以在真正的隔离状态下测试单元。\n-\
    \ **可测试性**：有时可能对对代码进行微重构，使其更便于单元测试。\n\n#### 示例：重审订单处理\n\n想象我们的 `OrderProcessingService`\
    \ 直接执行以下操作：\n\n1. 计算税费\n2. 联系数据库进行库存检查\n3. 通过电子邮件发送订单确认\n\n这对于单元测试来说是不理想的。我们可能会通过重构来引入协作者（`TaxCalculator`、`InventoryService`、`EmailService`），使\
    \ `OrderProcessingService` 更容易进行隔离测试。\n\n## 第二部分：设置 SUT\n\n在下一章节中，我们将讨论实例化和准备被测系统的实用方法，使其准备好与\
    \ Mockito 驱动的 mock 对象和 stub 进行交互。\n\n## 额外资源\n\n- **为了可测试性进行重构**：[`refactoring.guru/`](https://refactoring.guru/)\
    \ 如果你的代码需要重做，可以提供见解。\n\n准备好探索如何让你的 SUT 准备好测试了吗？\n\n# 导航 SUT 设置 – 第二部分\n\n让我们深入研究设置被测系统的实际操作！\n\
    \n### 1. 构建技术\n\n如何实例化你的 SUT 对有效测试至关重要：\n\n- **直接实例化**：如果你的 SUT 没有外部依赖（或只有简单的依赖），你可以直接使用\
    \ `new` 关键字：\n```\nOrderProcessingService sut = new OrderProcessingService();\n\
    ```\n- **依赖注入 (DI)**：提高可测试性。主要有两种方式：\n    - **构造函数注入**：将依赖项传入 SUT 的构造函数。这使得 SUT\
    \ 的需求变得显式。\n```\nInventoryService inventoryService = ... // 之后可以是 Mockito mock\n\
    OrderProcessingService sut = new OrderProcessingService(inventoryService);\n```\n\
    \    - **Setter 注入**：使用 setter 方法在 SUT 构建后提供依赖项。\n```\nOrderProcessingService\
    \ sut = new OrderProcessingService();\nsut.setInventoryService(inventoryService);\n\
    ```\n\n### 2. 引入 Mockito – Mock 协作者\n\n当你的 SUT 依赖于其他类时，Mockito 是你的超能力：\n\n```\n\
    InventoryService inventoryServiceMock = Mockito.mock(InventoryService.class);\n\
    OrderProcessingService sut = new OrderProcessingService(inventoryServiceMock);\n\
    ```\n\n- **收益**：\n    - 将 SUT 的逻辑与其协作者的行为隔离。\n    - 允许你根据不同的测试场景控制协作者“返回”什么。\n\
    \n### 3. 特殊情况\n\n- **静态依赖**：如果你的 SUT 调用了静态方法，我们之后需要 PowerMock（我们将在第 5 节详细介绍）。\n\
    - **数据库和外部系统**：目标是使用 mock stub 掉数据库调用、网络请求等。\n\n#### 示例：演进中的订单处理\n\n让我们通过构造函数注入增强我们的\
    \ `OrderProcessingService` 的可测试性：\n\n```java\npublic class OrderProcessingService\
    \ {\n    private final InventoryService inventoryService;\n    private final TaxCalculator\
    \ taxCalculator;\n\n    public OrderProcessingService(InventoryService inventoryService,\
    \ TaxCalculator taxCalculator) {\n        this.inventoryService = inventoryService;\n\
    \        this.taxCalculator = taxCalculator;\n    }\n    // ... 订单处理逻辑\n}\n```\n\
    \n#### 测试设置 (Mockito)\n\n```java\nInventoryService inventoryServiceMock = Mockito.mock(InventoryService.class);\n\
    TaxCalculator taxCalculatorMock = Mockito.mock(TaxCalculator.class);\nOrderProcessingService\
    \ sut = new OrderProcessingService(inventoryServiceMock, taxCalculatorMock);\n\
    ```\n\n### 4. 最佳实践\n\n- **测试驱动开发 (TDD)**：在实现之前编写测试以明确需求并辅助设计。\n- **平衡设置**：力求简单的设置，但记住可能需要某些重构。\n\
    - **框架辅助**：如果你使用 Spring，它的依赖注入容器和测试功能将简化你的设置！\n\n## 下一步：使用 Mockito 进行 Stubbing\n\
    \n现在 SUT 已经准备好，让我们学习如何控制其协作者的行为。这就是 Mockito Stubbing 能力大显身手的地方！\n\n## 额外资源\n\n\
    - **依赖注入**：[`martinfowler.com/articles/injection.html`](https://martinfowler.com/articles/injection.html)\n\
    \n准备好使用 Mockito 为你的 SUT 协作者编写行为了吗？让我们开始吧！\n\n# 说明 Stubbing – 第一部分\n\n让我们解锁 Mockito\
    \ 的核心——stubbing 的艺术！我们将学习如何让 mock 以特定的方式运行，从而测试你的被测系统。\n\n### 1. 什么是 Stubbing？\n\
    \n- **协作者**：stubbing 的本质是为 mock 依赖项定义预定义的响应或行为。\n- **为什么要 Stub？**\n    - 隔离 SUT\
    \ 的内部逻辑。\n    - 在不依赖真实的、可能复杂或缓慢的协作者的情况下测试不同场景。\n    - 驱动 SUT 进入特定的边缘情况以进行稳健测试。\n\
    \n### 2. Mockito 的 “当……那么……”\n\nMockito 的 Stubbing 语法遵循良好的可读性模式：\n\n`Mockito.when(mockedObject.someMethod(arguments)).thenReturn(result);`\n\
    \n- `when(...)`：指定激活 stub 的条件（方法调用、参数）。\n- `thenReturn(...)`：定义当满足条件时 mock 方法应该返回的值。\n\
    \n#### 示例：库存检查\n\n想象我们的 `OrderProcessingService` 依赖于 `InventoryService`：\n\n"
- fmt: "\n```java\nInventoryService inventoryServiceMock = Mockito.mock(InventoryService.class);\n\
    \nwhen(inventoryServiceMock.isProductInStock(\"12345\")).thenReturn(true);\n\n\
    // Now, during testing, calling 'inventoryServiceMock.isProductInStock(\"12345\"\
    )'\n// will ALWAYS return 'true'.\n```\n\n### 3. Stubbing Variations\n\nLet’s\
    \ expand our stubbing toolbox:\n\n- **Returning Different Values**: Respond conditionally\
    \ based on input arguments.\n- **Throwing Exceptions**: `when(...).thenThrow(new\
    \ SomeException())`. Test your SUT’s error handling.\n- **Void Methods**: Mocking\
    \ methods that don’t return anything:\n\n```java\nMockito.doNothing().when(emailServiceMock).sendConfirmationEmail(...);\n\
    ```\n(We’ll cover this more in the “Verification” chapters).\n\n#### Example:\
    \ Tax Calculation\n\n```java\nTaxCalculator taxCalculatorMock = Mockito.mock(TaxCalculator.class);\n\
    \nwhen(taxCalculatorMock.calculateTax(any(Order.class))).thenReturn(10.0);\n```\n\
    \n### 4. Best Practices\n\n- **Keep Stubs Focused**: Each stub should aim to set\
    \ up one specific scenario for a test.\n- **Start Simple**: Begin with simple\
    \ return values, gradually increasing complexity as needed.\n- **Meaningful Naming**:\
    \ Your test names and stubbed values should guide others (and your future self!)\
    \ in understanding the test’s intent.\n\n### 5. A Note on Argument Matchers\n\n\
    In the last example, we used `any(Order.class)`. Mockito provides powerful Argument\
    \ Matchers for flexible stubbing – we’ll dedicate a whole chapter to them!\n\n\
    #### Additional Resources\n\n- **Mockito Documentation (Stubbing)**: [https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html#stubbing](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html#stubbing)\n\
    \n# Mastering Stubbing Techniques – Part 2\n\nLet’s build on our stubbing foundation\
    \ and explore more nuanced scenarios.\n\n### 1. Stubbing for Multiple Outcomes\n\
    \nSometimes, a single stub isn’t enough. You might need your mock to return different\
    \ things in sequence:\n\n```java\nwhen(inventoryServiceMock.isProductInStock(\"\
    12345\"))\n    .thenReturn(true)\n    .thenReturn(false); // Subsequent call will\
    \ return false\n```\n\n- **Use Cases**: Simulating stock depletion, intermittent\
    \ errors from external services, etc.\n\n### 2. Stubbing Consecutive Calls (Advanced)\n\
    \nFor granular control over consecutive calls, Mockito offers additional techniques:\n\
    \n- `thenAnswer(...)`: Define custom behavior using Java lambda expressions. This\
    \ enables dynamic responses based on invocation count, arguments, and more.\n\
    - `thenThrow(...)` followed by `thenReturn(...)`: Simulate an error followed by\
    \ successful recovery.\n\n#### Example: Complex Calculation\n\n```java\nwhen(complexServiceMock.performCalculation(anyInt()))\n\
    \    .thenAnswer(invocation -> {\n        int arg = invocation.getArgument(0);\n\
    \        if (arg < 0) {\n            throw new IllegalArgumentException();\n \
    \       }\n        return arg * 2;\n    });\n```\n\n### 3. Stubbing Interactions\n\
    \nImagine our `OrderProcessingService` emails a receipt on successful processing.\
    \ Here’s how to stub AND later verify this interaction (we’ll cover verification\
    \ in-depth soon):\n\n```java\nEmailService emailServiceMock = Mockito.mock(EmailService.class);\n\
    \ndoNothing().when(emailServiceMock).sendOrderConfirmation(any(Order.class));\n\
    \n// In your test, after exercising the OrderProcessingService:\nMockito.verify(emailServiceMock).sendOrderConfirmation(any(Order.class));\n\
    ```\n\n**Key Points:**\n\n- `doNothing()`: For void methods that don’t return\
    \ values.\n- `verify(...)`: Mockito’s way of checking if expected calls on mocks\
    \ actually happened.\n\n### 4. Partial Stubs with `thenCallRealMethod()`\n\nSometimes,\
    \ you want most of a method’s behavior, but need to tweak one aspect:\n\n```java\n\
    ProductService realProductService = new ProductService(); // Real implementation\n\
    ProductService productServiceMock = Mockito.spy(realProductService);\n\nwhen(productServiceMock.calculateFinalPrice(any())).thenCallRealMethod();\n\
    ```\n\n- `Mockito.spy(...)`: Creates a partial mock. By default, calls go to the\
    \ real implementation.\n- `thenCallRealMethod()`: Selectively override behavior.\n\
    \n### 5. Considerations & Cautions\n\n- **Over-Stubbing**: Risk of tests that\
    \ mirror implementation, becoming brittle. Strike a balance!\n- **Test Intent**:\
    \ Stubs should clearly serve a testing purpose, not just replicate how the SUT\
    \ is coded.\n- **Readability**: Complex stubs can make tests harder to understand.\
    \ Comments and clear structure are key.\n\n#### Additional Resources\n\n- **Mockito\
    \ thenAnswer**: [https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html#thenAnswer(org.mockito.stubbing.Answer)](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html#thenAnswer(org.mockito.stubbing.Answer))\n\
