  trans: "\n区分基本类型和对象之间相等性断言的工作机制至关重要：\n\n- 基本类型：直接对值进行比较。`assertEquals(7, 7)` 通过。\n\
    - 对象：默认情况下，JUnit 检查对象是否指向同一个内存位置（引用相等性）。通常，你可能希望比较对象的内容（使用 `equals()` 方法）。\n\n\
    ### 示例：对象比较\n\n```java\nPerson person1 = new Person(\"Alice\", 30);\nPerson person2\
    \ = new Person(\"Alice\", 30); // 相同的姓名和年龄\n\n// 这一断言很可能会失败（除非你在 Person 类中重写了\
    \ .equals）\nassertEquals(person1, person2);\n```\n\n## 第 2 部分：更多断言与技术\n\n在下一部分中，我们将通过更多专门的方法、浮点数的比较，以及让你的断言更具信息量的技术，来扩展我们的断言工具箱。\n\
    \n### 额外资源\n\n- JUnit 5 断言 API: [`junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html`](https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html)\n\
    - Java 对象与相等性: [`www.geeksforgeeks.org/equals-hashcode-methods-java/`](https://www.geeksforgeeks.org/equals-hashcode-methods-java/)\n\
    \n# 掌握绿色通过条：相等性断言技术：第 2 部分\n\n## 进阶基础\n\n让我们探索更多专门的断言，以提高测试的精确性：\n\n- `assertArrayEquals(expectedArray,\
    \ actualArray)`：逐个元素比较两个数组的相等性。元素的顺序非常重要。\n- `assertIterableEquals(expectedIterable,\
    \ actualIterable)`：与 `assertArrayEquals` 类似，但适用于任何 `Iterable`（列表、集合等）。元素的顺序很重要。\n\
    - `assertLinesMatch(expectedLines, actualLines)`：允许比较多行文本内容（字符串列表），有助于验证文件内容。\n\
    - `assertTimeout(duration, executable)`：确保代码块在指定的时间限制内执行，以防止潜在的挂起。\n- `assertTimeoutPreemptively(duration,\
    \ executable)`：`assertTimeout` 的更严格版本，如果超过超时，测试将立即失败，即使代码块稍后才完成。\n\n### 示例：数组与可迭代断言\n\
    \n```java\n@Test\nvoid testArrayEquality() {\n    int[] expected = {1, 5, 3};\n\
    \    int[] actual = calculator.sortNumbers(new int[] {3, 1, 5});\n    assertArrayEquals(expected,\
    \ actual);\n}\n\n@Test\nvoid testIterableEquality() {\n    List<String> expected\
    \ = Arrays.asList(\"Alice\", \"Bob\");\n    Set<String> actual = calculator.getUniqueNames();\n\
    \    assertIterableEquals(expected, actual); // 在这种情况下顺序不重要\n}\n```\n\n### 浮点数精度\n\
    \n直接使用 `assertEquals` 比较浮点数（例如 `double`、`float`）可能是危险的，因为它们的表示存在固有的舍入误差。JUnit\
    \ 提供了一个解决方案：\n\n- `assertEquals(double expected, double actual, double delta)`：断言两个\
    \ double 值在指定的容差（`delta`）范围内。\n\n#### 示例：浮点数比较\n\n```java\n@Test\nvoid testApproximateCalculation()\
    \ {\n    double result = calculator.calculateFormula(0.1);\n    assertEquals(0.333,\
    \ result, 0.001); // 容差为 0.001\n}\n```\n\n### 自定义失败消息\n\n所有断言方法都有重载版本，可以接受一个额外的\
    \ `String` 参数作为第一个参数。此 `String` 作为自定义的失败消息，在测试失败时提供更多上下文。\n\n#### 示例：自定义失败消息\n\
    \n```java\n@Test\nvoid testInvalidLogin() {\n    String username = \"wrongUser\"\
    ;\n    String password = \"badpassword\";\n    assertFalse(authService.login(username,\
    \ password), \"登录应因凭据无效而失败\");\n}\n```\n\n### 断言的最佳实践\n\n- **每个测试一个断言（理想情况下）**：避免编写包含多个断言的过于复杂的测试。力求每个测试用例对应一个主要的断言。这有助于失败隔离，并使结果更具信息量。\n\
    - **描述性消息**：使用自定义消息使失败的测试更易理解。\n- **测试辅助方法**：如果你有复杂的断言逻辑，将其封装到可重用的辅助方法中，或创建自定义断言类以保持测试用例整洁。\n\
    \n### 使用断言进行 TDD\n\n记住，测试驱动开发（TDD）鼓励你先编写断言。在编写代码之前思考你期望代码产生的结果，将引导出更专注的设计。\n\n\
    #### 示例：阶乘方法的 TDD 方法\n\n1. **编写测试**：\n```java\n@Test\nvoid testFactorial() {\n\
    \    // 此处省略代码...\n}\n```\n\n2. **编写最简单的实现（即使它失败）**：\n```java\npublic class FactorialCalculator\
    \ {\n    public int calculate(int n) {\n        return 1; // 初始测试失败\n    }\n}\n\
    ```\n\n3. **迭代并让测试通过！**\n\n## 下节预：结构合理的测试\n\n在接下来的章节中，我们将讨论如何重构你的测试以获得更好的可维护性和长期成功。\n\
    \n### 额外资源\n\n- JUnit 5 断言 API（参见重载方法）：[`junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html`](https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html)\n\
    - 测试驱动开发 (TDD)：[`en.wikipedia.org/wiki/Test-driven_development`](https://en.wikipedia.org/wiki/Test-driven_development)\n\
    \n# 打造健壮的测试：完善你的测试套件：第 1 部分\n\n测试不仅仅是为了今天的绿色通过条。它们需要随项目的发展而保持可靠。如果测试套件经常因无关的代码而失败，就会破坏它本应提供的信心。让我们开始为测试构建健壮性。\n\
    \n## 健壮测试的原则\n\n在构建测试结构时，请记住以下指导原则：\n\n- **隔离性**：良好的单元测试仅关注被测单元，减少与其他组件的依赖。这使得失败更容易定位，且不易引发连锁反应。\n\
    - **可维护性**：测试也是代码！结构良好的测试在代码更改时更容易更新，从而节省宝贵时间。\n- **可读性**：测试是活文档。清晰的测试名称和结构有助于理解代码应该如何工作。\n\
    - **可重复性**：如果依赖项没有发生变化，测试应该产生相同的的结果。波动会破坏对测试的信任。\n\n## 脆弱测试的常见原因\n\n让我们剖析一些导致测试不稳定的常见问题：\n\
    \n- **过于具体的断言**：当断言与代码的内部实现耦合时，任何实现的重构都可能导致测试失败。\n- **隐藏的外部依赖**：依赖当前日期、系统属性、文件系统状态或网络调用的测试会引入不确定性，破坏可重复性。\n\
    - **测试用例重叠**：具有显著重叠的测试会导致连锁失败。一个 bug 可能会导致多个测试失败，掩盖真正的问题源头。\n"
- fmt: "\n- **Method Naming**: Adopt naming conventions like `shouldCalculatePriceCorrectlyWhenProductIsOnSale()`.\n\
    - **Arrange-Act-Assert (AAA)**: A pattern that promotes clear separation of test\
    \ phases – setup, executing the code under test, and then assertions.\n\n## Example:\
    \ Refactoring a Test\n\nLet’s imagine a test for an `OrderService` that depends\
    \ on the current date:\n\n### Fragile Version\n```java\n@Test\nvoid testOrderIsDiscountedOnBlackFriday()\
    \ {\n  LocalDate orderDate = LocalDate.of(2023, 11, 24);  //Black Friday\n  OrderService\
    \ orderService = new OrderService();\n  double discount = orderService.calculateDiscount(orderDate);\n\
    \  assertEquals(0.25, discount);\n}\n```\n\n### Refactored for Robustness\n###\
    \ More Resilient Version\n```java\n@Test\nvoid testOrderIsDiscountedOnBlackFriday()\
    \ {\n  Clock fixedClock = Clock.fixed(LocalDate.of(2023, 11, 24).atStartOfDay(ZoneId.systemDefault()).toInstant(),\
    \ ZoneId.systemDefault());\n  OrderService orderService = new OrderService(fixedClock);\
    \  // Inject a controllable clock\n  double discount = orderService.calculateDiscount();\n\
    \  assertEquals(0.25, discount);\n}\n```\n\n**Key Changes**: We’ve introduced\
    \ the `java.time.Clock` interface, allowing us to inject a “fixed” clock into\
    \ our `OrderService`, ensuring it always believes it’s Black Friday.\n\n## Part\
    \ 2: More Refactoring, Test Smells, and Making Tests Self-Sufficient\n\nIn the\
    \ next part, we’ll cover techniques to identify problematic tests (“test smells”),\
    \ how to make tests self-sufficient to increase isolation, and delve into more\
    \ refactoring patterns.\n\n### Additional Resources\n- **Test Smells**: [https://martinfowler.com/bliki/TestSmell.html]\n\
    - **Java Time Clock**: [https://docs.oracle.com/javase/8/docs/api/java/time/Clock.html]\n\
    - **Refactoring Techniques**: [https://refactoring.guru/refactoring/techniques]\n\
    \n# Enhancing Test Robustness: Advanced Refactoring Techniques: Part 2\n\n## Recognizing\
    \ Test Smells\n\nBefore we dive deeper into refactoring, let’s learn to spot common\
    \ “test smells” – tell-tale signs that hint at potential problems in your test\
    \ code.\n\n- **Fragile Tests**: Frequent breaks with unrelated code changes.\n\
    - **Slow Tests**: Tests that take a long time to execute discourage frequent testing.\n\
    - **Over-Mocking**: Complex mocking setups can make tests hard to understand and\
    \ maintain. A sign your unit might not be well-isolated.\n- **Redundancy**: Multiple\
    \ tests asserting the same thing provide little value.\n- **Obscure Test Logic**:\
    \ Complex test code that’s difficult to follow suggests that refactoring is needed.\n\
    - **Conditional Test Logic**: Tests that run selectively based on environment\
    \ or data indicate hidden dependencies or problems with repeatability.\n\n## Advanced\
    \ Refactoring Techniques\n\nLet’s focus on some more involved refactoring techniques\
    \ to armor your test suite:\n\n1. **Introducing Test Doubles**: Replace complex\
    \ dependencies with simplified stand-ins (`Mocks, Stubs, Fakes)`. We’ll cover\
    \ this in great detail when we explore `Mockito`, but the concept is key to isolation.\n\
    2. **Builder Pattern for Test Data**: Instead of scattered test data, the `Builder\
    \ Pattern` centralizes how test objects are constructed, making test setup more\
    \ consistent.\n\n### Example: Test Data Builder\n```java\npublic class OrderBuilder\
    \ {\n  private String orderId = \"123\";\n  private LocalDate orderDate = LocalDate.now();\n\
    \  private List<LineItem> lineItems = new ArrayList<>();\n\n  public OrderBuilder\
    \ withOrderId(String orderId) {\n    this.orderId = orderId;\n    return this;\n\
    \  }\n  // ... More 'with' methods for customization\n  public Order build() {\n\
    \    Order order = new Order(orderId, orderDate);\n    order.setLineItems(lineItems);\n\
    \    return order;\n  }\n}\n```\n\n### Usage in Test\n```java\n@Test\nvoid testCalculateTotal()\
    \ {\n  Order order = new OrderBuilder()\n    .withOrderId(\"test-order\")\n  \
    \  .withLineItem(new LineItem(\"Product1\", 10.0, 2))\n    .build();\n  // ...\n\
    }\n```\n\n3. **Object Mother Pattern**: Similar to the `Builder Pattern` but focused\
    \ on creating reusable, “archetypical” test objects that reduce redundancy across\
    \ several tests.\n4. **Extracting Setup Logic**: Move repeated test setup code\
    \ into helper methods or reusable setup/teardown functions (`@Before`, `@BeforeEach`,\
    \ etc.) to improve DRYness.\n\n## Addressing Specific Test Smells\n\n- **Fragile\
    \ Tests**: Employ test doubles liberally to isolate the unit under test, and focus\
    \ assertions on the unit’s behavior, not internal details of collaborators.\n\
    - **Slow Tests**: Identify bottlenecks, and potentially introduce optimizations\
    \ or mocks to speed them up. Consider selectively running slow tests as part of\
    \ a nightly build rather than every development change.\n- **Over-Mocking**: A\
    \ signal to reassess your design. If your class requires many mocks to test, perhaps\
    \ its responsibilities could be broken down further.\n\n## Beyond Refactoring:\
    \ Good Practices\n\n- **Meaningful Naming**: Give both your production code and\
    \ tests clear names that reflect their purpose.\n- **Encapsulation**: Keep test\
    \ classes mirroring the structure of your product code for easy navigation.\n\
    - **Design for Testability**: Writing tests influences your design. Code that\
    \ is hard to test often indicates problems in your production code’s structure.\n\
    \n## Continuous Improvement\n\nTreat your test suite as an integral part of your\
    \ codebase. Refactor your tests constantly alongside your production code to maintain\
    \ a healthy, adaptable project.\n\n## Next Up: Boolean Logic with assertTrue and\
    \ assertFalse\n\nIn the next chapter, we’ll shift gears and discuss how to effectively\
    \ verify conditions within your tests using JUnit’s `assertTrue` and `assertFalse`\
    \ methods.\n\n### Additional Resources\n- **Test Smells**: [https://martinfowler.com/bliki/TestSmell.html]\n\
    - **Refactoring Patterns**: [https://refactoring.guru/refactoring/techniques]\n\
    - **Design for Testability**: [https://martinfowler.com/articles/practical-test-pyramid.html]\n\
    \n# Validating Conditions: Leveraging assertTrue and assertFalse: Part 1\n\nBeyond\
    \ equality checks, tests often need to verify logical conditions. Enter JUnit’s\
    \ `assertTrue` and `assertFalse` – your fundamental tools for asserting boolean\
    \ truths within your code.\n\n## The Basics\n\n- `assertTrue(boolean condition)`:\
    \ Asserts that the provided `condition` evaluates to `true`. The test case passes\
    \ if the condition is true, and fails otherwise.\n- `assertFalse(boolean condition)`:\
    \ Asserts that the provided `condition` evaluates to `false`. The test case passes\
    \ if the condition is false, and fails otherwise.\n\n### Example: Checking Login\
    \ Status\n```java\n@Test\nvoid testLoginSuccess() {\n  AuthService authService\
    \ = new AuthService();\n  boolean isLoggedIn = authService.login(\"john.doe\"\
    , \"password123\");\n  assertTrue(isLoggedIn);\n}\n```\n\n## Beyond Simple true/false\n\
    \nThese methods are particularly powerful due to their ability to evaluate expressions:\n\
    \n```java\n@Test\nvoid testDiscountEligibility() {\n  Customer customer = new\
    \ Customer(true); // Loyal customer\n  Product product = new Product(55.0);\n\
    \  DiscountService discountService = new DiscountService();\n  boolean isEligible\
    \ = discountService.isEligibleForDiscount(customer, product);\n  assertTrue(isEligible);\n\
    }\n```\n\n## Use Cases\n\nHere are some common scenarios where `assertTrue` and\
    \ `assertFalse` shine:\n\n- **Conditional Logic**: Verifying that ‘if’ statements\
    \ and other decision-making structures in your code lead to the correct outcomes.\n\
    - **State Verification**: Checking an object’s state after a particular method\
    \ call (e.g., `isEmpty()` on a collection, property flags, etc.).\n"
