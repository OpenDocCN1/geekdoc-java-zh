    \n### 3. 传统方式：@Test(expected=...)\n\n适用于旧版本的 JUnit 或简单用例：\n\n```java\n@Test(expected\
    \ = IllegalArgumentException.class)\npublic void testInvalidEmailFormat() {\n\
    \    userService.register(\"bad_email\");\n}\n```\n\n* **局限性**：精细度较低；无法检查异常的内容。\n\
    \n### 4. try-catch 模式\n\n有时候，你需要对抛出的异常进行更精细的控制：\n\n```java\n@Test\nvoid testFileLoadError()\
    \ {\n    try {\n        fileProcessor.processFile(\"missing.csv\");\n        fail(\"\
    Should have thrown a FileNotFoundException\");\n    } catch (FileNotFoundException\
    \ ex) {\n        // 可选断言异常的更多细节\n        assertThat(ex.getMessage(), containsString(\"\
    missing.csv\"));\n    }\n}\n```\n\n### 选择你的策略\n\n* `assertThrows`：大多数场景下的现代、首选方法。对异常本身提供断言能力。\n\
    * `@Test(expected=...)`：如果你没有使用最新的 JUnit，这种方法对于基本的“是否抛出异常”的测试足够了。\n* `try-catch`：当你需要处理异常或\
    \ `assertThrows` 不符合你的测试结构时，提供了细粒度的控制。\n\n### 示例：健壮计算\n\n```java\n@Test\nvoid\
    \ testDivideByZero() {\n    assertThrows(ArithmeticException.class, () -> calculator.divide(10,\
    \ 0));\n}\n\n@Test\nvoid testNegativeSquareRoot() {\n    assertThrows(IllegalArgumentException.class,\
    \ () -> calculator.sqrt(-4));\n}\n```\n\n### 进阶内容\n\n* **自定义异常类型**：确保对自定义的异常类通过了正确触发的测试。\n\
    * **测试异常传播**：验证异常如何通过你的方法调用层层冒泡。\n* **框架集成 (Spring)**：许多测试框架都提供了异常处理工具。探索它们与 JUnit\
    \ 的集成。\n\n### 最佳实践\n\n* **聚焦的异常测试**：为不同的预期异常和场景编写分离测试。\n* **整洁的测试失败**：确保测试失败清晰地指向异常问题，而不是关于异常的断言失败。\n\
    \n**下一步**：性能测试考虑因素，参数化测试\n\n在下一章中，我们将讨论如何优化 JUnit 测试的性能，并介绍如何对其进行参数化以获得更广泛的覆盖。\n\
    \n---\n\n# 性能验证：确保 JUnit 测试的最佳性能\n\n单元测试不仅关乎正确性，还关乎速度。缓慢测试会影响开发速度。让我们探索如何识别并解决测试中的性能问题。\n\
    \n### 为什么性能在单元测试中很重要\n\n* **快速反馈**：缓慢的测试会让人抑制频繁测试，而对于测试驱动开发（TDD）和敏捷工作流至关重要。\n\
    * **定位问题**：测试套件中的性能分析有助于尽早隔离生产代码中的瓶颈。\n* **扩展性**：大型且缓慢的测试套件会阻碍项目的增长和可维护性。\n\n\
    ### 常见的性能元凶\n\n1. **昂贵的设置**：在每个测试之前重复执行 `@Before` 方法、数据库调用或网络操作。\n2. **未优化的测试代码**：被测试代码中效率低下的算法或数据结构，就像普通的\
    \ Java 代码一样。\n3. **外部依赖**：测试依赖的外部系统、文件或 Web 服务的缓慢交互。\n\n### 对测试进行性能分析\n\n虽然存在基础的计时机制，但专用的分析工具是你的最佳选择：\n\
    \n* **内置分析器**：你的 IDE（IntelliJ, Eclipse）可能提供了适用于测试执行的分析功能。\n* **JMH (Java Microbenchmark\
    \ Harness)**：一个为微基准测试设计的框架，包括类似单元测试的场景。设置较复杂，但提供了更细粒度的控制。\n\n### 示例：初级计时\n\n```java\n\
    @Test\nvoid testDatabaseQueryPerformance() {\n    long startTime = System.currentTimeMillis();\n\
    \    productRepository.fetchProductsByCategory(\"Electronics\");\n    long endTime\
    \ = System.currentTimeMillis();\n    long duration = endTime - startTime;\n  \
    \  assertTrue(duration < 500); // 目标执行时间在 500ms 内\n}\n```\n\n### 优化策略\n\n* **Mock（模拟）**：使用\
    \ mock 和 stub 将你的测试与缓慢的外部依赖解耦（稍后我们将关注 Mockito）。\n* **缓存**：如果测试场景内的结果是可预测的，避免冗余的计算或数据获取。\n\
    * **面向测试的设计**：有时，为了可测试性重构生产代码也有助于性能。\n* **选择性执行**：标记性能测试。\n\n### JUnit 专用工具\n\n\
    * `@Timeout`：强制执行最大持续时间。\n\n示例：使用 @Timeout\n\n```java\n@Test\n@Timeout(value =\
    \ 100, unit = TimeUnit.MILLISECONDS)\nvoid testStringConcatenation() {\n    //\
    \ ...\n}\n```\n\n### 关键考虑量\n\n* **基线**：建立性能预期。\n* **焦点**：检测回归。\n* **真实的负载**：模拟实际使用情况。\n\
    \n### 最佳实践\n\n* **集成测试**：隔离的单元测试。\n* **持续监控**：将性能跟踪纳入构建中。\n\n**下一步**：参数化测试\n\n\
    ### 额外资源\n\n* **JUnit 异常测试**：[`junit.org/junit5/docs/current/user-guide/`](https://junit.org/junit5/docs/current/user-guide/)\n\
    * **JMH (Java Microbenchmark Harness)**：[`openjdk.java.net/projects/code-tools/jmh/`](https://openjdk.java.net/projects/code-tools/jmh/)\n\
    \n---\n\n# 拥抱变化：参数化测试技术 – 第一部分\n\n通常一个测试需要针对多组输入输出执行。手动为每个变化编写相似的测试既枯燥又容易出错。引入参数化测试！\n\
    \n### 参数化的威力\n\n* **数据驱动测试**：使用紧凑的测试覆盖大量场景。\n* **减少冗余**：维护单一测试模板，减少代码重复。\n* **提高可读性**：专注于核心逻辑，输入/输出清晰分离。\n\
    * **边界情况探索**：系统地测试边界条件和各种用例。\n\n### 核心概念\n\n1. **参数源**：指示测试如何获取输入值。JUnit 提供了多种内置选项。\n\
    2. **参数化测试方法**：测试类中标记了 `@ParameterizedTest` 注解的方法。该方法接收参数源填充的参数。\n\n### 从 JUnit\
    \ 的内置源开始\n\n* `@ValueSource`：对于简单数据类型（字符串、数字、枚举）最简单。\n\n```java\n@ParameterizedTest\n\
    @ValueSource(ints = {2, 4, 8, -5})\nvoid testIsEven(int number) {\n    assertTrue(number\
    \ % 2 == 0);\n}\n```\n\n* `@CsvSource`：处理逗号分隔的值，适用于稍微复杂的数据。\n\n```java\n@ParameterizedTest\n\
    @CsvSource({\"apple, 5\", \"banana, 3\", \"orange, 8\"})\nvoid testFruitCost(String\
    \ fruit, int price) {\n    // ...\n}\n```\n\n* `@EnumSource`：对枚举值进行迭代。\n\n```java\n\
    enum Currency { USD, EUR, GBP }\n\n@ParameterizedTest\n@EnumSource(Currency.class)\n\
    void testCurrencySymbol(Currency currency) {\n    // ...\n}\n```\n\n### 示例：数学工具\n\
    \n```java\n@ParameterizedTest\n@ValueSource(doubles = {0.0, 1.0, -3.14, Double.MAX_VALUE})\n\
    void testAbsoluteValue(double input) {\n    // ...\n}\n```\n\n"
- fmt: "\n```java\nassertEquals(Math.abs(input), MathUtils.absolute(input));\n```\n\
    \n## Considerations\n\n- **Naming**: `JUnit` generates test names including your\
    \ parameter values. Use meaningful argument names in your test method.\n- **Test\
    \ Structure**: Keep the parameterized test method’s logic focused on the essentials\
    \ of what’s being tested.\n- **Readability Counts**: Don’t sacrifice clarity for\
    \ the sake of parameterization.\n\n## Part 2: Custom Sources and Fine-Tuning\n\
    \nIn Part 2, we’ll learn to craft custom sources for more complex data objects,\
    \ explore how to tweak test execution and naming conventions, and see how parameterized\
    \ tests play with other `JUnit` features.\n\n### Additional Resources\n\n- JUnit\
    \ 5 Parameterized Tests: [https://junit.org/junit5/docs/current/user-guide/](https://junit.org/junit5/docs/current/user-guide/)\n\
    \n## Parameterized Precision: Fine-Tuning Your Tests – Part 2\n\nIn Part 1, we\
    \ began our parameterized testing journey. Now, let’s unlock more customization\
    \ and advanced techniques.\n\n### 1. Custom Parameter Sources (`@MethodSource`)\n\
    \nWhen built-in sources don’t suffice, build your own to feed complex data into\
    \ tests:\n\n```java\n@ParameterizedTest\n@MethodSource(\"provideStringsAndLengths\"\
    )  // References our custom source\nvoid testStringLength(String input, int expectedLength)\
    \ {\n    assertEquals(expectedLength, input.length());\n}\n\n// Our custom parameter\
    \ provider\nstatic Stream<Arguments> provideStringsAndLengths() {\n    return\
    \ Stream.of(\n      Arguments.of(\"hello\", 5),\n      Arguments.of(\"JUnit in\
    \ Action\", 15)\n    );\n}\n```\n\n- **Flexibility**: Generate test data from\
    \ files, databases, or calculations.\n- **Arguments Object**: The `Arguments`\
    \ class bundles up multiple values into a single ‘test case’ unit.\n\n### 2. Test\
    \ Names with `@DisplayName`\n\nParameterized tests get auto-generated names that\
    \ can be hard to parse. The `@DisplayName` annotation to the rescue!\n\n```java\n\
    @ParameterizedTest(name = \"[{index}] User ID: {0}\")  // Use {0}, {1}, ... for\
    \ arguments\n@CsvSource({\"123, John Doe\", \"456, Jane Smith\"})\n@DisplayName(\"\
    Testing User Registration\")\nvoid testUserRegistration(String userId, String\
    \ fullName) {\n    // ...\n}\n```\n\n- **Readability Wins**: Descriptive test\
    \ names go a long way in test reports and when debugging failures.\n\n### 3. Tweaking\
    \ Execution with `@TestTemplate`\n\nSometimes, you want even more control over\
    \ how your parameterized tests are invoked. Introduce the `@TestTemplate` annotation:\n\
    \n```java\n// ... imports ...\n\n@TestTemplate\n@ExtendWith(MyCustomTestTemplateInvoker.class)\
    \  // Your custom logic\nvoid testMultiplicationTable(int multiplier, int input,\
    \ int expected) {\n    assertEquals(expected, multiplier * input);\n}\n```\n\n\
    - **Specialized Scenarios**: Custom invokers can change execution order, filter\
    \ parameter combinations, and more. (Note: This is an advanced technique often\
    \ requiring deeper `JUnit` extension knowledge)\n\n### 4. Mixing with Assumptions\n\
    \nCombine parameterization with `assumeTrue` or `assumeFalse` from our earlier\
    \ chapters for conditional test execution:\n\n```java\n@ParameterizedTest\n@ValueSource(strings\
    \ = { \"racecar\", \" \", \"Java\"})\nvoid testIsPalindrome(String word) {\n \
    \   assumeTrue(word.length() > 1);  // Skip single-character words\n    assertEquals(StringUtils.reverse(word),\
    \ word);\n}\n```\n\n#### Example: Complex Calculation\n\n```java\n@ParameterizedTest\n\
    @MethodSource(\"complexCalculationInputs\")\nvoid testCompoundGrowth(double principal,\
    \ double rate, int periods, double expected) {\n    assertEquals(expected, calculator.calculateFutureValue(principal,\
    \ rate, periods), 0.01);\n}\n\nprivate static Stream<Arguments> complexCalculationInputs()\
    \ {\n    return Stream.of(\n      Arguments.of(10000, 0.05, 10, 16289.0),\n  \
    \    Arguments.of(5000, 0.08, 5, 7346.64)\n    );\n}\n```\n\n## Best Practices\n\
    \n- **Balance**: Parameterization is powerful, but don’t overdo it. Sometimes\
    \ multiple traditional tests are clearer.\n- **Provider Method Naming**: Conventions\
    \ like `provide...` or `testCases...` aid readability.\n- **Documentation**: If\
    \ you have complex custom providers, explain their logic for future maintainers.\n\
    \n## Next: Tailoring Parameterization for Specific Needs\n\nIn Part 3, we’ll discover\
    \ how to use even more advanced parameter sources with the `@ArgumentsSource`\
    \ annotation and create even more bespoke parameterized tests!\n\n### Additional\
    \ Resources\n\n- Custom Parameter Sources with `@MethodSource`: [https://junit.org/junit5/docs/current/user-guide/](https://junit.org/junit5/docs/current/user-guide/)\n\
    \n## Tailored Parameterization: Custom Suites – Part 3\n\n### 1. `ArgumentsSource`\n\
    \nSometimes, `@MethodSource` doesn’t suffice when you need data from external\
    \ sources.\n\n```java\n@ParameterizedTest\n@ArgumentsSource(CustomProvider.class)\n\
    void testValidation(String email, boolean expected) {\n    // ...\n}\n\nstatic\
    \ class CustomProvider implements ArgumentsProvider {\n    @Override\n    Stream<?\
    \ extends Arguments> provideArguments(ExtensionContext context) {\n        //\
    \ Load from...\n        return Stream.of(\n          Arguments.of(\"valid@com\"\
    , true),\n          Arguments.of(\"invalid_email\", false)\n        );\n    }\n\
    }\n```\n\n### 2. Composable Sources\n\nCombine multiple sources using `@CsvSource`,\
    \ `@MethodSource`, etc.\n\n```java\n@ParameterizedTest\n@CsvSource({\"10, 20,\
    \ 30\"})\n@MethodSource(\"provideObjects\")\nvoid testCalculator(int a, int b,\
    \ int expected)\n\nstatic Stream<Arguments> provideObjects() {\n    // ...\n}\n\
    ```\n\n### 3. External Files (CSV, JSON)\n\nGreat for extensive data. Libraries\
    \ like `Jackson` or `OpenCSV` simplify parsing:\n\n```java\n@ParameterizedTest\n\
    @CsvSource(resources = \"/product_pricing.csv\", numLinesToSkip = 1) // Header\n\
    void testPrice(String productId, double cost, double taxRate, double expectedPrice)\n\
    ```\n\n### 4. Filtering\n\nLimit the test cases executed. Options include:\n\n\
    - `@TestTemplate`: We touched upon this in Part 2.\n- Third-Party Extensions:\
    \ Explore filtering mechanisms for parameterized tests.\n\n#### Example: Login\
    \ Tests\n\n```java\n@ParameterizedTest\n@ArgumentsSource(UserArgumentProvider.class)\n\
    void testLogin(String username, String password, String role, boolean shouldSucceed)\
    \ {\n    // ...\n}\n\nstatic class UserArgumentProvider implements ArgumentsProvider\
    \ {\n    @Override\n    Stream<? extends Arguments> provideArguments(ExtensionContext\
    \ context) throws IOException {\n        return Files.lines(Paths.get(\"user_credentials.csv\"\
    ))\n            .map(line -> line.split(\",\"))\n            .map(data -> Arguments.of(data[0],\
    \ data[1], data[2], Boolean.parseBoolean(data[3])));\n    }\n}\n```\n"
