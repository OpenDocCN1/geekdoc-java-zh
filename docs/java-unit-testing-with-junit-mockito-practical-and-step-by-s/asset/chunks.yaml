    Mockito works beautifully with them! Let’s delve into how this duo elevates your
    ability to write expressive and robust assertions.


    Section 4:


    Mastering Mockito''s


    Advanced Techniques


    # Exploring Hamcrest Matchers: Enhancing Assertion Power – Part 1


    Let’s embark on a journey into the world of Hamcrest matchers. These will transform
    how you write assertions, making your tests incredibly expressive and unlocking
    more fine-grained testing capabilities.


    1\. Beyond  assertEquals: The Need for Flexibility


    Classic  assertEquals,  assertTrue, etc., while core to JUnit, can be limiting:


    ● Rigid Comparisons: What if you want partial string matches, checking if a number
    is within a range, or asserting a collection has certain elements?


    ● Verbose Error Messages: assertEquals failures just tell you what didn’t match,
    not why.


    ● Combining Checks: Difficult to cleanly assert multiple things about a single
    object.


    2\. Enter Hamcrest


    ●     Library: Include it alongside JUnit and Mockito ([https://hamcrest.org/JavaHamcrest/](https://hamcrest.org/JavaHamcrest/))


    ● Matchers: The building blocks; describe conditions an object should fulfill.


    ●     Readable Syntax: Assertions read like natural language!


    3\. Basic Usage


    import org.hamcrest.MatcherAssert;


     import  static org.hamcrest.Matchers.*;  // Contains commonly used matchers


    @Test


    public  void  testEmailFormatting()  {


        String email =  "user@domain.com";


        MatcherAssert.assertThat(email,  containsString("@"));


        MatcherAssert.assertThat(email,  startsWith("user"));


    }


    Let’s dissect:


    ● import static org.hamcrest.Matchers.*: Brings in matchers like  containsString,  startsWith
    for convenience.


    ●     MatcherAssert.assertThat(...): Entry point for Hamcrest assertions.


    4\. Core Matchers


    Hamcrest offers a treasure trove:


    ●     Comparables: greaterThan,  lessThanOrEqualTo,  closeTo (for floating-point).


    ●     Strings: containsString,  startsWith,  endsWith,  equalToIgnoringCase.


    ●     Collections: hasSize,  hasItem,  hasItems,  everyItem.


    ●     Logical: allOf,  anyOf,  not.


    Example: Number Range Check


    MatcherAssert.assertThat(orderTotal,  both(greaterThan(10.0)).and(lessThan(100.0)));


    Part 2: Composing Matchers, Customizations, and Beyond


    Next, we’ll see how to create intricate assertions, write your own matchers, and
    discover how Hamcrest improves your test failure messages.


    Additional Resources


    ●     Hamcrest GitHub: Find even more matchers: [https://github.com/hamcrest/JavaHamcrest](https://github.com/hamcrest/JavaHamcrest)


    # Mastering Hamcrest Matchers: Elevating Assertion Precision – Part 2


    Let’s continue our Hamcrest exploration and see how it gives us incredible control
    over our assertions, leading to more meaningful and robust tests.


    1\. Combining Matchers: The Power of Logical Operators


    ● allOf():  Every matcher within it must pass for success. Lets you assert multiple
    aspects of an object at once.


    ● anyOf(): If at least one inner matcher passes, the overall assertion succeeds.
    Great for alternatives.


    ●     not(): Reverses the logic of a matcher.


    Example: Sophisticated Validation


    MatcherAssert.assertThat(user,  allOf(


            hasProperty("email",  containsString("@")),


            hasProperty("registrationDate",  not(nullValue())),


            hasProperty("status",  is("ACTIVE"))


    ));


    2\. Customizing Failure Descriptions


    Hamcrest shines in how it reports errors:


    MatcherAssert.assertThat("totalPrice",  is(42.5),  reason("Incorrect calculation"));


    ●     is(value): A core matcher for equality.


    ● reason(String): If the assertion fails, the reason is included, making debugging
    much easier.


    3\. Matchers for Collections


    Want to be specific about collection content? Hamcrest has your back!


    ●     hasItem(...),  hasItems(...): Check if certain elements are present.


    ● everyItem(...) Ensures all elements within a collection match a condition.


    ●     contains(...),  containsInAnyOrder(...): Ordered vs. unordered sequence
    matching.


    Example: Validating an Order


    List<String> orderItems =  Arrays.asList("Laptop",  "Monitor");


    MatcherAssert.assertThat(order.getItems(),  containsInAnyOrder(


        hasItems("Laptop",  "Monitor")


    ));


    4\. Custom Matchers


    When built-in matchers don’t suffice, build your own!


    public  class  IsDivisibleBy  extends  BaseMatcher<Integer>  {


        private  final  int divisor;


        // ... constructor ...


        @Override


        public  boolean  matches(Object actual)  {


            return  (Integer) actual % divisor ==  0;


        }


        @Override


        public  void  describeTo(Description description)  {


            description.appendText("divisible by "  + divisor);


        }


    }


    Let’s use it:


    MatcherAssert.assertThat(total,  is(new  IsDivisibleBy(3)));


    Part 3: Diagnosing Failures, Matchers with Mockito, and More!


    Next, we’ll tackle understanding verbose Hamcrest error messages, making your
    custom matchers even better, and the beautiful interplay between Hamcrest and
    Mockito.


    Additional Resources


    ●     Hamcrest API Docs: The full array of matchers: [http://hamcrest.org/JavaHamcrest/javadoc/2.2/org/hamcrest/package-summary.html](http://hamcrest.org/JavaHamcrest/javadoc/2.2/org/hamcrest/package-summary.html)


    ●     Writing Custom Matchers:  [http://hamcrest.org/JavaHamcrest/tutorial](http://hamcrest.org/JavaHamcrest/tutorial)


    Ready to level up your test assertions? Let’s get expressive!


    Unraveling the Depths of Hamcrest Matchers – Part 3


    Let’s conclude our Hamcrest odyssey by exploring more of its power, how to make
    the most of failure messages, and the synergy between Hamcrest and Mockito.


    1\. Diagnostic Matchers


    Sometimes, you want fine-grained information why an assertion failed.


