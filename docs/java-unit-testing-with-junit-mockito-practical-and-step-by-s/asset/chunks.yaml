  raw: "●     Mockito BDD Extension:  [https://javadoc.io/doc/org.mockito/mockito-bom/latest/org/mockito/bdd/package-summary.html](https://javadoc.io/doc/org.mockito/mockito-bom/latest/org/mockito/bdd/package-summary.html)\n\
    \n●     Stubbing Void Methods:  [https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#stubbing_consecutive_calls](https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#stubbing_consecutive_calls)\n\
    \nAre you ready for when typical stubbing just isn’t enough? Let’s navigate the\
    \ trickier side of Mockito!\n\nNavigating Complex Stubbing Scenarios – Part 4\n\
    \nIn this chapter, we’ll tackle scenarios that might make you question your sanity,\
    \ but fear not, we’ll come out stronger!\n\n1\\. When Stubs Fight Back: Recursive\
    \ Calls\n\nImagine testing a method that itself calls another method on the same\
    \ mock:\n\n// Our Service with a self-referential method:\n\nclass  InventoryService\
    \  {\n\n    ...\n\n    public  int  calculateAvailableStock(Product product) \
    \ {\n\n        int inStock =  getStockCount(product);  // Calls a method on itself\
    \ (same mock)\n\n        // ...more logic...\n\n    }\n\n    ...\n\n}\n\n● Solution\
    \ 1:  thenCallRealMethod() If appropriate, let the initial stub trigger real behavior\
    \ for the recursive part.\n\n● Solution 2: Refactor If possible, break out the\
    \ recursive logic into a testable helper, making your code cleaner overall.\n\n\
    2\\. Mocking the Unmockable?\n\n● Final Classes/Methods: We saw PowerMock as the\
    \ solution, but be aware of trade-offs (complexity, setup). Seriously consider\
    \ refactoring the SUT first.\n\n● Third-Party Classes: If you don’t control the\
    \ code, a thin wrapper class that you do control might be your best bet. This\
    \ lets you introduce an interface for testability.\n\n3\\. The Case of the Overly-Helpful\
    \ Mock\n\nMockito, by default, returns “sensible” values even for unstubbed methods\
    \ (empty collections, 0 for primitives, etc.). Sometimes, this hides bugs!\n\n\
    when(shippingServiceMock.calculateRates(any())).thenReturn(ratesList);\n\n// What\
    \ if getSupportedCountries() on a mock was NEVER stubbed?\n\nif(shippingServiceMock.getSupportedCountries().contains(\"\
    CA\"))  {  ...  }\n\n●     Solution 1:  Mockito.RETURNS_DEEP_STUBS – Mocks behave\
    \ more strictly\n\n● Solution 2:  verifyNoMoreInteractions(...) – Ensuring the\
    \ mock is only used as you intended.\n\n4\\. Testing the Interaction, Not Just\
    \ the Outcome\n\nSuppose you’re less concerned with the return value and more\
    \ about a mock being used at all within an interaction.\n\n// Did the service\
    \ trigger the repository AT ALL to save?\n\nverify(productRepositoryMock,  times(1)).save(any(Product.class));\n\
    \n5\\. Best Practices for Complex Stubbing\n\n● Isolating the SUT: The more complex\
    \ your stubbing, the more likely the SUT’s design has issues. Strive for easily\
    \ testable units.\n\n● Test Intent: Ask yourself, “What am I really testing here?”\
    \ This guides your stubbing strategy.\n\n● Comments as a Last Resort: If you find\
    \ yourself needing complex comments to explain your stubs, it’s a red flag!\n\n\
    Taming Stubbing Complexity\n\nComplex stubbing is a symptom of a potentially bigger\
    \ issue – tightly coupled code. While Mockito is powerful, the best tests accompany\
    \ well-designed, modular code.\n\nNext: Behavior-Driven Testing with Mockito\n\
    \nLet’s explore how Mockito integrates with a formal BDD approach to specify and\
    \ test system behavior!\n\nAdditional Resources\n\n●     Design vs. Mocking Trade-offs:\
    \  [https://martinfowler.com/articles/mocksArentStubs.html](https://martinfowler.com/articles/mocksArentStubs.html)\n\
    \nReady to wrestle with those stubborn mocking scenarios? \U0001F4AA\n\n# Embracing\
    \ BDD Style: Implementing Given-When-Then Approach – Part 1\n\nLet’s explore how\
    \ Mockito empowers you to write tests in a Behavior-Driven Development (BDD) style,\
    \ promoting readability and expressiveness that aligns with how we naturally think\
    \ about requirements!\n\n1\\. What is BDD (in the Testing World)?\n\n● Focus on\
    \ Behavior: Less about how the code works, more about what it accomplishes from\
    \ a user’s perspective.\n\n● Collaboration: Bridges the gap between technical\
    \ and non-technical stakeholders by using a shared language.\n\n● Living Specifications:\
    \ Tests become a clear description of features, not just a jumble of assertions.\n\
    \n2\\. The “Given-When-Then” Structure\n\nThe essence of BDD testing lies in this\
    \ pattern:\n\n● Given: The initial context or setup for the scenario. (Think of\
    \ this as your preconditions).\n\n●     When: The action or trigger being tested.\n\
    \n●     Then: The expected outcomes or observable results.\n\nExample: E-commerce\
    \ Order Processing\n\nGiven the customer has items in their cart\n\nWhen they\
    \ place an order\n\nThen the order status is \"confirmed\"\n\nAnd an order confirmation\
    \ email is sent\n\n3\\. Mockito + BDDMockito\n\nWhile core Mockito supports basic\
    \ BDD, let’s bring in  BDDMockito for a more fluent syntax:\n\n●     given(condition).willReturn(...)\
    \ Reads like a natural sentence\n\n●     willThrow(),  willAnswer(), etc. Variations\
    \ for other stubbing needs\n\nCode Example (Refactoring from Earlier)\n\n// Old\
    \ style\n\nwhen(inventoryServiceMock.isProductInStock(\"123\")).thenReturn(true);\n\
    \n// BDD style\n\ngiven(inventoryServiceMock.isProductInStock(\"123\")).willReturn(true);\n\
    \n4\\. Benefits of BDD with Mockito\n\n● Readability: Even non-programmers can\
    \ grasp the intent of test cases.\n\n● Specification-Driven: Test design focuses\
    \ on desired system behavior from the outset.\n\n● Mockito Harmony: Mockito’s\
    \ focus on mocks and interactions blends perfectly with BDD’s emphasis on behavior\
    \ over implementation.\n\n5\\. Considerations\n\n● Verbosity: BDD tests can be\
    \ longer to write, so strike a balance.\n\n● Ideal Fit: Most beneficial for complex\
    \ domain logic or areas with frequent requirement changes.\n\n● It’s a Tool: Don’t\
    \ be dogmatic; sometimes classic JUnit-style asserts are the most practical choice.\n\
    \nPart 2: Putting BDD into Practice\n\nNext, we’ll dive into a more complete example,\
    \ showcase the improved readability of the BDD approach, and learn how to manage\
    \ more intricate setups effectively.\n\nAdditional Resources\n\n●     BDDMockito\
    \ on GitHub:  [https://github.com/mockito/bddmockito](https://github.com/mockito/bddmockito)\n\
    \n●     Introduction to BDD (General):  [https://cucumber.io/docs/bdd/](https://cucumber.io/docs/bdd/)\n\
    \nAre you ready to transform your tests into clear, behavior-focused specifications?\n\
    \n# Enhancing BDD Style Implementation – Part 2\n\nIn this chapter, we’ll go beyond\
    \ simple examples and see how to structure BDD-style tests effectively for more\
    \ complex scenarios.\n\n1\\. A Realistic Scenario: Shipping Calculation\n\nLet’s\
    \ imagine a  ShippingCalculator that determines costs based on order total, destination,\
    \ etc. Here’s a BDD-flavored test:\n\nclass  ShippingCalculatorTest  {\n\n    private\
    \  ShippingCalculator shippingCalculator;\n\n    private  LocationService locationServiceMock;\n\
    \n    private  ProductService productServiceMock;\n\n    @BeforeEach\n\n    void\
    \  setup()  {\n\nlocationServiceMock =  Mockito.mock(LocationService.class);\n\
    \nproductServiceMock =  Mockito.mock(ProductService.class);\n\nshippingCalculator\
    \ =  new  ShippingCalculator(locationServiceMock, productServiceMock);\n\n    }\n\
