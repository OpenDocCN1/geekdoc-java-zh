    \n### 3. The Legacy Way: @Test(expected=...)\n\nFor older JUnit versions or simple\
    \ cases:\n\n```java\n@Test(expected = IllegalArgumentException.class)\npublic\
    \ void testInvalidEmailFormat() {\n    userService.register(\"bad_email\");\n\
    }\n```\n\n* **Limitations**: Less refined; can’t examine the exception’s content.\n\
    \n### 4. The try-catch Pattern\n\nSometimes, you need finer control over the thrown\
    \ exception:\n\n```java\n@Test\nvoid testFileLoadError() {\n    try {\n      \
    \  fileProcessor.processFile(\"missing.csv\");\n        fail(\"Should have thrown\
    \ a FileNotFoundException\");\n    } catch (FileNotFoundException ex) {\n    \
    \    // Optionally assert more details of the exception\n        assertThat(ex.getMessage(),\
    \ containsString(\"missing.csv\"));\n    }\n}\n```\n\n### Choosing Your Strategy\n\
    \n* `assertThrows`: The modern, preferred approach for most scenarios. Offers\
    \ assertion power on the exception itself.\n* `@Test(expected=...)`: Fine for\
    \ basic “does-it-throw” tests if you’re not using the latest JUnit.\n* `try-catch`:\
    \ Provides granular control when you need to manipulate the exception or when\
    \ `assertThrows` doesn’t suit your test structure.\n\n### Example: Robust Calculation\n\
    \n```java\n@Test\nvoid testDivideByZero() {\n    assertThrows(ArithmeticException.class,\
    \ () -> calculator.divide(10, 0));\n}\n\n@Test\nvoid testNegativeSquareRoot()\
    \ {\n    assertThrows(IllegalArgumentException.class, () -> calculator.sqrt(-4));\n\
    }\n```\n\n### Beyond the Basics\n\n* **Custom Exception Types**: Ensure your own\
    \ exception classes are tested for correct triggering.\n* **Testing Exception\
    \ Propagation**: Verify how exceptions bubble up through your method calls.\n\
    * **Framework Integrations (Spring)**: Many testing frameworks offer exception-handling\
    \ utilities. Explore their integration with JUnit.\n\n### Best Practices\n\n*\
    \ **Focused Exception Tests**: Separate tests for different expected exceptions\
    \ and scenarios.\n* **Clean Test Failures**: Ensure test failures clearly point\
    \ to the exception issue, not assertion failures about the exception.\n\n**Next**:\
    \ Performance Testing Considerations, Parameterized Testing\n\nIn the next chapter,\
    \ we’ll discuss optimizing your JUnit tests for performance and introduce how\
    \ to parameterize them for broader coverage.\n\n---\n\n# Performance Validation:\
    \ Ensuring Optimal Performance in JUnit Tests\n\nUnit tests are not just about\
    \ correctness but also about speed. Slow tests hinder development velocity. Let’s\
    \ explore how to identify and address performance issues in your tests.\n\n###\
    \ Why Performance Matters in Unit Tests\n\n* **Fast Feedback**: Sluggish tests\
    \ discourage frequent testing, which is essential for Test-Driven Development\
    \ (TDD) and agile workflows.\n* **Pinpointing Problems**: Performance profiling\
    \ within your test suite helps isolate bottlenecks in your production code early.\n\
    * **Scalability**: A large, slow test suite impedes your project’s growth and\
    \ maintainability.\n\n### Common Performance Culprits\n\n1. **Expensive Setup**:\
    \ Repetitive `@Before` methods, database calls, or network operations before each\
    \ test.\n2. **Unoptimized Test Code**: Inefficient algorithms or data structures\
    \ in the code you’re testing, just like in any regular Java code.\n3. **External\
    \ Dependencies**: Slow interactions with external systems, files, or web services\
    \ that your tests rely on.\n\n### Profiling Your Tests\n\nWhile basic timing mechanisms\
    \ exist, dedicated profiling tools are your best bet:\n\n* **Built-in Profilers**:\
    \ Your IDE (IntelliJ, Eclipse) likely offers profiling capabilities applicable\
    \ to test execution.\n* **JMH (Java Microbenchmark Harness)**: A framework designed\
    \ for microbenchmarking, including unit-test-like scenarios. More complex to set\
    \ up but offers finer control.\n\n### Example: Rudimentary Timing\n\n```java\n\
    @Test\nvoid testDatabaseQueryPerformance() {\n    long startTime = System.currentTimeMillis();\n\
    \    productRepository.fetchProductsByCategory(\"Electronics\");\n    long endTime\
    \ = System.currentTimeMillis();\n    long duration = endTime - startTime;\n  \
    \  assertTrue(duration < 500); // Aim for execution under 500ms\n}\n```\n\n###\
    \ Strategies for Optimization\n\n* **Mocking**: Decouple your tests from slow\
    \ external dependencies with mocks and stubs (Mockito will be our focus later).\n\
    * **Caching**: Avoid redundant calculations or data fetching if results are predictable\
    \ within a test scenario.\n* **Test-Focused Design**: Sometimes, refactoring your\
    \ production code for testability also aids its performance.\n* **Selective Execution**:\
    \ Tag performance tests.\n\n### JUnit-Specific Tools\n\n* `@Timeout`: Enforces\
    \ a maximum duration.\n\nExample: Using @Timeout\n\n```java\n@Test\n@Timeout(value\
    \ = 100, unit = TimeUnit.MILLISECONDS)\nvoid testStringConcatenation() {\n   \
    \ // ...\n}\n```\n\n### Key Considerations\n\n* **Baselines**: Establish performance\
    \ expectations.\n* **Focus**: Detect regressions.\n* **Realistic Workloads**:\
    \ Mimic usage.\n\n### Best Practices\n\n* **Integration Tests**: Unit tests in\
    \ isolation.\n* **Continuous Monitoring**: Incorporate performance tracking into\
    \ build.\n\n**Next**: Parameterized Testing\n\n### Additional Resources\n\n* **JUnit\
    \ Exception Testing**: [https://junit.org/junit5/docs/current/user-guide/](https://junit.org/junit5/docs/current/user-guide/)\n\
    * **JMH (Java Microbenchmark Harness)**: [https://openjdk.java.net/projects/code-tools/jmh/](https://openjdk.java.net/projects/code-tools/jmh/)\n\
    \n---\n\n# Embracing Variance: Parameterized Testing Techniques – Part 1\n\nOften\
    \ a single test needs to be executed with multiple sets of inputs and outputs.\
    \ Manually writing near-identical tests for each variation is tedious and error-prone.\
    \ Enter parameterized tests!\n\n### The Power of Parameterization\n\n* **Data-Driven\
    \ Testing**: Cover a wide range of scenarios using a compact set of tests.\n*\
    \ **Reduced Redundancy**: Maintain a single test template, minimizing code duplication.\n\
    * **Improved Readability**: Focus on the core logic, with input/output pairs cleanly\
    \ separated.\n* **Edge Case Exploration**: Systematically test boundary conditions\
    \ and diverse use cases.\n\n### Core Concepts\n\n1. **Parameter Source**: Indicates\
    \ how your test obtains its input values. JUnit offers several built-in options.\n\
    2. **Parameterized Test Method**: A designated method in your test class marked\
    \ with the `@ParameterizedTest` annotation. This method accepts arguments that\
    \ will be populated from parameter source.\n\n### Let’s Start with JUnit’s Built-In\
    \ Sources\n\n* `@ValueSource`: Easiest for simple data types (strings, numbers,\
    \ enums).\n\n```java\n@ParameterizedTest\n@ValueSource(ints = {2, 4, 8, -5})\n\
    void testIsEven(int number) {\n    assertTrue(number % 2 == 0);\n}\n```\n\n* `@CsvSource`:\
    \ Handles comma-separated values, good for slightly more complex data.\n\n```java\n\
    @ParameterizedTest\n@CsvSource({\"apple, 5\", \"banana, 3\", \"orange, 8\"})\n\
    void testCalculateFruitCost(String fruit, int price) {\n    // ...\n}\n```\n\n\
    * `@EnumSource`: Iterates over values of an enumerated type.\n\n```java\nenum\
    \ Currency { USD, EUR, GBP }\n\n@ParameterizedTest\n@EnumSource(Currency.class)\n\
    void testCurrencySymbol(Currency currency) {\n    // ...\n}\n```\n\n### Example:\
    \ Math Utilities\n\n```java\n@ParameterizedTest\n@ValueSource(doubles = {0.0,\
    \ 1.0, -3.14, Double.MAX_VALUE})\nvoid testAbsoluteValue(double input) {\n   \
    \ // ...\n}\n```\n"
