  trans: "\n```java\n // ... (mock setup as before) ...\n\n shoppingCart.addItem(\"\
    123\", 2);\n\n // Assertions - let's get detailed!\n\n // (We should check if\
    \ the repository's method was called with the right arguments...)\n\nverify(productRepositoryMock).findById(\"\
    123\");\n\n // ... and ideally, assert something about what gets added to the\
    \ cart.\n\n // (We'll need Mockito to help here!)\n}\n```\n\n## 2. 引入参数捕获 (Argument\
    \ Capturing)\n\n我们如何实际检查（假设）已添加到 `ShoppingCart` 内部（假设）购物车中的内容呢？\n\n- `ArgumentCaptor`:\
    \ 一个 Mockito 类，用于捕获传递给 mock 的参数。\n\n```java\nimport static org.mockito.ArgumentMatchers.anyInt;\
    \ // 我们很快会学习到这个\n\n@Test\nvoid addItem_withValidProduct() {\n   // ... setup ...\n\
    \   shoppingCart.addItem(\"123\", 2);\n\n   // ArgumentCaptor!\n   ArgumentCaptor<Product>\
    \ productCaptor = ArgumentCaptor.forClass(Product.class);\n   ArgumentCaptor<Integer>\
    \ quantityCaptor = ArgumentCaptor.forClass(Integer.class);\n\n   // 捕获 mock 调用发生的情况（假设购物车使用了某些\
    \ 'add' 方法）\n   verify(shoppingCart).add(productCaptor.capture(), quantityCaptor.capture());\n\
    \n   // 使用捕获的值进行断言\n   assertEquals(\"123\", productCaptor.getValue().getId());\n\
    \   assertEquals(2, quantityCaptor.getValue());\n}\n```\n\n## 3. 匹配器 (Matchers):\
    \ 灵活的 Stubbing 与断言\n\n注意上面 `anyInt()` 的使用。匹配器允许我们在需要时保持具体，或保持灵活性：\n\n- `anyInt()``,\
    \ `anyString()`，等：匹配该类型的任意值。\n- `eq(...)`: 匹配精确值（类似于 JUnit 自带的 `assertEquals`）。\n\
    - 更多：你可以根据正则表达式、自定义规则等进行匹配！\n\n### 示例：税费计算（匹配器）\n\n```java\nwhen(taxServiceMock.calculateTax(any(Order.class))).thenReturn(8.0);\n\
    ```\n\n## 4. 最佳实践\n\n- 针对性捕获：仅捕获你断言时真正需要的参数。\n- 匹配器技巧：使用匹配器在测试的严谨性与避免脆弱性之间取得平衡。\n\
    - 不要忘记 ‘verify’：捕获通常与 `verify` 配合使用，以确保方法确实被调用了。\n\n## 5. 演进我们的测试\n\n我们的 `ShoppingCartTest`\
    \ 正在成型！我们现在正在检查代码的行为以及涉及 mock 协作所产生的结果。\n\n### 额外资源\n\n- Mockito ArgumentCaptor:\
    \ [`www.baeldung.com/mockito-argumentcaptor`](https://www.baeldung.com/mockito-argumentcaptor)\n\
    - Mockito Argument Matchers: [`javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html`](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html)\n\
    \n# 进阶 Mockito – 第 3 部分\n\n让你的 Mockito 技能提升一个层次。在本章中，我们将涵盖一些中级和高级技术，使你的测试更健壮、更易维护。\n\
    \n## 1. 精通验证 (Mastering Verification)\n\n在之前的章节中，我们使用 `verify()` 来确保 mock 被调用。让我们深入浅一下：\n\
    \n- 验证次数 (Verification Times):\n  - `times(n)`：方法应该被调用 ‘n’ 次。\n  - `atLeastOnce()`,\
    \ `atMost(n)`：设置灵活的边界。\n  - `never()`：确保方法没有被调用。\n- 顺序顺序 (Call Order)：对于调用顺序重要的场景，使用\
    \ `InOrder`：\n\n```java\nInOrder inOrder = inOrder(mock1, mock2);\ninOrder.verify(mock1).doSomething();\n\
    inOrder.verify(mock2).doSomethingElse();\n```\n\n### 示例：登录尝试\n\n想象一个注重安全且限制登录重试的组件。你的测试可能包含如下验证：\n\
    \n```java\nverify(loginService, times(3)).processLogin(anyString(), anyString());\n\
    verify(notificationService).sendAccountLockedEmail(anyString());\n```\n\n## 2.\
    \ 重置 Mock 对象 (Resetting Mocks)\n\n有时，你需要在测试内部有一个全新的开始：\n\n```java\nMockito.reset(mock1,\
    \ mock2, ...); // 重置 stubbing 和调用计数\n```\n\n- 使用场景：\n  - 当单个测试方法在不同条件下多次执行 SUT（被测试对象）时使用。\n\
    - 注意事项：谨慎使用。如果你过度依赖重置，可能会掩盖某些问题。\n\n## 3. 使用 Answer 自定义 Stubbing\n\n`when(...).thenAnswer(...)`\
    \ 为复杂的 stubbing 提供了极大的控制力：\n\n```java\nwhen(inventoryServiceMock.isProductInStock(anyString()))\n\
    \    .thenAnswer(invocation -> {\n        String productId = invocation.getArgument(0);\n\
    \        return productId.startsWith(\"A\"); // 示例\n    });\n```\n"
- fmt: "\n# Mockito’s Spying Capabilities [https://www.baeldung.com/mockito-spy](https://www.baeldung.com/mockito-spy)\n\
    \n## Section 3: Unveiling the Essentials of Mockito\n\n## Advanced Stubbing Techniques:\
    \ Exploring Argument Matchers & Beyond – Part 1\n\nLet’s embark on a journey into\
    \ the power of Mockito’s argument matchers, which will take your stubbing precision\
    \ to a whole new level!\n\n### 1. Beyond Simple Equality\nWhile Mockito’s `when(...).thenReturn(...)`\
    \ is useful, what if you need flexibility in how you define what the mock should\
    \ react to? Enter Argument Matchers!\n\n#### Basic Example\n```java\nwhen(inventoryServiceMock.getProductPrice(anyString())).thenReturn(9.99);\n\
    // Any String argument will trigger this stub\n```\n\n### 2. Matchers: The Core\
    \ Toolkit\nMockito provides built-in matchers (use `static import` from `org.mockito.ArgumentMatchers.*`\
    \ for brevity):\n\n*   `any(...)`: Matches anything of that type (`anyInt()`,\
    \ `anyList()`, etc.).\n*   `eq(...)`: Exact value match (like JUnit’s own assertions).\n\
    *   `isNull()`, `notNull()`: Checks for null and non-null references.\n*   Regular\
    \ Expressions: Match strings with patterns (`matches()` matcher).\n\n#### Example:\
    \ Filtering Products\n```java\nwhen(inventoryServiceMock.filterProducts(anyString(),\
    \ eq(\"Electronics\"), anyDouble()))\n    .thenReturn(filteredProductList);\n\
    ```\n\n### 3. The Power of `any(...)`\n*   **Placeholder**: Use when an argument’s\
    \ value isn’t central to the test.\n*   **Flexibility**: Prevents tests from breaking\
    \ due to changes in unrelated values.\n*   **With Argument Capture**: Use `any()`\
    \ to capture values for later assertions, as we’ve seen previously.\n\n### 4.\
    \ Custom Argument Matchers\nWhen the built-in ones aren’t enough, build your own:\n\
    \n```java\nclass IsValidProduct implements ArgumentMatcher<Product> {\n    @Override\n\
    \    public boolean matches(Product product) {\n        return product.isValid();\
    \ // Your custom logic here!\n    }\n}\n```\n\n#### Use it:\n```java\nwhen(inventoryServiceMock.updateStock(argThat(new\
    \ IsValidProduct()))).then(...)\n```\n\n### 5. Considerations\n*   **Specific\
    \ vs. Loose**: Balance precision to prevent false positives in your tests and\
    \ brittleness caused by over-specificity.\n*   `verify(...)` with Matchers: Ensure\
    \ mocks were called with the right arguments.\n*   **Readable but Precise**: Good\
    \ matchers improve test intent clarity.\n\n---\n\n## Part 2: Complex Matchers\
    \ and Beyond\n\nNext, we’ll combine matchers, build more sophisticated custom\
    \ ones, and explore Mockito features that work alongside argument matching!\n\n\
    ### Additional Resources\n*   Mockito Argument Matchers Documentation: [https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html)\n\
    *   Custom Argument Matchers [https://www.baeldung.com/mockito-argument-matchers](https://www.baeldung.com/mockito-argument-matchers)\n\
    \n## Advanced Stubbing Strategies: Unraveling Argument Matchers & More – Part\
    \ 2\n\nLet’s continue our deep dive into Mockito’s advanced stubbing capabilities.\
    \ This time, we’ll combine matchers in interesting ways and go beyond the basics!\n\
    \n### 1. Mixing and Matching (Matchers)\nYou’re not limited to one matcher per\
    \ stubbing! Combine them to fine-tune your criteria:\n\n```java\nwhen(inventoryServiceMock.calculateDiscount(\n\
    \    any(Order.class),\n    argThat(order -> order.getItems().size() > 5), //\
    \ Custom Matcher\n    matches(\"SUMMER_SALE\")\n))\n.thenReturn(0.20); // 20%\
    \ discount\n```\n\n### 2. Logical Operators\nMockito provides matchers for common\
    \ logical operations:\n\n*   `not(matcher)`: Negates a matcher\n*   `or(matcher1,\
    \ matcher2)`: True if either matcher matches\n*   `and(matcher1, matcher2)`: True\
    \ if both matchers match\n\n#### Example: Invalid Login Handling\n```java\nwhen(userServiceMock.authenticate(\n\
    \    not(eq(\"admin\")), // Exclude the admin user\n    anyString()\n)).thenThrow(new\
    \ InvalidCredentialsException());\n```\n\n### 3. Matchers for Collections\nNeed\
    \ to check the contents of a list or a map? Mockito has you covered:\n\n*   `contains(...)`:\
    \ For checking if a collection contains something.\n*   `hasSize(...)`: Matching\
    \ based on the collection’s size.\n*   `hasEntry(...)`, `hasKey(...)`, `hasValue(...)`:\
    \ Matchers for maps.\n\n#### Scenario: Large Surcharge\n```java\nwhen(orderServiceMock.applySurcharge(argThat(hasSize(20))));\n\
    ```\n\n### 4. Beyond `when()` -> `thenReturn()`\nWhile `thenReturn()` is common,\
    \ Mockito’s arsenal includes:\n\n*   `thenThrow()`: We’ve seen this for errors.\n\
    *   `thenAnswer()`: We’ve seen this for dynamic responses.\n*   `thenCallMethod()`:\
    \ For spies.\n*   `doNothing()`, `doReturn()`, `doThrow()`: For void methods.\n\
    \n### 5. Considerations\n*   **Unnecessary Complexity**: Too much in `Answer`\
    \ muddles test intent.\n*   **Test vs. Implementation**: Over-specificity ties\
    \ tests to internal details.\n\nNext: `any()` and `argThat()`\n\n## Delving Deeper\
    \ into Stubbing Variations: Advanced Techniques – Part 3\n\nLet’s explore even\
    \ more nuanced scenarios where Mockito’s capabilities shine!\n\n### 1. Stubbing\
    \ with Side Effects\nOccasionally, you don’t just want to return a value, but\
    \ a side effect on the mock:\n\n```java\nwhen(inventoryServiceMock.restock(any(Product.class),\
    \ anyInt()))\n    .thenAnswer(invocation -> {\n        Product product = invocation.getArgument(0);\n\
    \        product.setQuantity(product.getQuantity() + invocation.getArgument(1));\n\
    \        return null;\n    });\n```\n\nCautions:\n*   **Complex Side Effects**:\
    \ Refactor if possible.\n*   **Shared State**: If not careful, side effects can\
    \ bleed between tests.\n\n### 2. Stubbing Chains of Calls\nWhat if your mock needs\
    \ to return different things sequentially?\n\n```java\nwhen(paymentServiceMock.isPaymentAuthorized(any()))\n\
    \    .thenReturn(true) // First time...\n    .thenReturn(false); // Second time\
    \ onwards...\n```\n\n### 3. BDD-Style with Mockito (BDDMockito)\nMockito has an\
    \ extension for a “Given-When-Then” style, promoting readability:\n\n```java\n\
    given(productRepositoryMock.findById(\"123\")).willReturn(optionalOf(product));\n\
    // instead of: when(productRepository.findById(\"123\")).thenReturn(...)\n```\n\
    \n*   **Pros**: Can make tests read like specifications\n*   **Cons**: Adds another\
    \ dependency (BDDMockito).\n\n### 4. ‘Void’ Methods That Need Special Attention\n\
    Sometimes a void method method indirectly changes something you need to assert\
    \ on:\n\n```java\n// Imagine this updates some internal status...\norderService.processReturn(order);\n\
    \n// Using an ArgumentCaptor:\nArgumentCaptor<Order> captor = ArgumentCaptor.forClass(Order.class);\n\
    verify(orderService).processReturn(captor.capture());\n\nOrder returnedOrder =\
    \ captor.getValue();\nassertTrue(returnedOrder.isRefunded());\n```\n\n### 5. Beyond\
    \ Just Unit Testing\nWhile Mockito’s core is unit testing, stubbing concepts are\
    \ essential for:\n\n*   **Integration Tests**: Mocking external dependencies.\n\
    *   **Spring**: Mocking beans within a Spring context for focused tests.\n\nNext:\
    \ Tackling Complex Scenarios\n"
  raw: "●     Mockito’s Spying Capabilities  [https://www.baeldung.com/mockito-spy](https://www.baeldung.com/mockito-spy)\n\
    \nSection 3:\n\nUnveiling the Essentials of Mockito\n\n# Advanced Stubbing Techniques:\
    \ Exploring Argument Matchers & Beyond – Part 1\n\nLet’s embark on a journey into\
    \ the power of Mockito’s argument matchers, which will take your stubbing precision\
    \ to a whole new level!\n\n1\\. Beyond Simple Equality\n\nWhile Mockito’s  when(...).thenReturn(...)\
    \ is useful, what if you need flexibility in how you define what the mock should\
    \ react to? Enter Argument Matchers!\n\nBasic Example\n\nwhen(inventoryServiceMock.getProductPrice(anyString())).thenReturn(9.99);\n\
    \n // Any String argument will trigger this stub\n\n2\\. Matchers: The Core Toolkit\n\
    \nMockito provides built-in matchers (use  static import from  org.mockito.ArgumentMatchers.*\
    \ for brevity):\n\n●     any(...): Matches anything of that type (anyInt(),  anyList(),\
    \ etc.).\n\n●     eq(...): Exact value match (like JUnit’s own assertions).\n\n\
    ●     isNull(),  notNull(): Checks for null and non-null references.\n\n●     Regular\
    \ Expressions: Match strings with patterns (matches() matcher).\n\nExample: Filtering\
    \ Products\n\nwhen(inventoryServiceMock.filterProducts(anyString(),  eq(\"Electronics\"\
    ),  anyDouble()))\n\n   .thenReturn(filteredProductList);\n\n3\\. The Power of\
    \  any(...)\n\n● Placeholder: Use when an argument’s value isn’t central to the\
    \ test.\n\n● Flexibility: Prevents tests from breaking due to changes in unrelated\
    \ values.\n\n● With Argument Capture: Use  any() to capture values for later assertions,\
    \ as we’ve seen previously.\n\n4\\. Custom Argument Matchers\n\nWhen the built-in\
    \ ones aren’t enough, build your own:\n\nclass  IsValidProduct  implements  ArgumentMatcher<Product>\
    \  {\n\n    @Override\n\n    public  boolean  matches(Product product)  {\n\n\
           return product.isValid();  // Your custom logic here!\n\n    }\n\n}\n\n\
    // Use it:\n\nwhen(inventoryServiceMock.updateStock(argThat(new  IsValidProduct()))).then(...)\n\
    \n5\\. Considerations\n\n● Specific vs. Loose: Balance precision to prevent false\
    \ positives in your tests and brittleness caused by over-specificity.\n\n● verify(...)\
    \ with Matchers: Ensure mocks were called with the right arguments.\n\n●     Readable\
    \ but Precise: Good matchers improve test intent clarity.\n\nPart 2: Complex Matchers\
    \ and Beyond\n\nNext, we’ll combine matchers, build more sophisticated custom\
    \ ones, and explore Mockito features that work alongside argument matching!\n\n\
    Additional Resources\n\n●     Mockito Argument Matchers Documentation:  [https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html)\n\
    \n●     Custom Argument Matchers  [https://www.baeldung.com/mockito-argument-matchers](https://www.baeldung.com/mockito-argument-matchers)\n\
    \nAdvanced Stubbing Strategies: Unraveling Argument Matchers & More – Part 2\n\
    \nLet’s continue our deep dive into Mockito’s advanced stubbing capabilities.\
    \ This time, we’ll combine matchers in interesting ways and go beyond the basics!\n\
    \n1\\. Mixing and Matching (Matchers)\n\nYou’re not limited to one matcher per\
    \ stubbing! Combine them to fine-tune your criteria:\n\nwhen(inventoryServiceMock.calculateDiscount(\n\
    \n    any(Order.class),\n\n argThat(order -> order.getItems().size()  >  5), \
    \ // Custom Matcher\n\n    matches(\"SUMMER_SALE\")\n\n    ))\n\n.thenReturn(0.20);\
    \  // 20% discount\n\n2\\. Logical Operators\n\nMockito provides matchers for\
    \ common logical operations:\n\n●     not(matcher): Negates a matcher\n\n●     or(matcher1,\
    \ matcher2): True if either matcher matches\n\n●     and(matcher1, matcher2):\
    \ True if both matchers match\n\nExample: Invalid Login Handling\n\nwhen(userServiceMock.authenticate(\n\
    \n      not(eq(\"admin\")),  //  Exclude the admin user\n\n      anyString()\n\
    \n   )).thenThrow(new  InvalidCredentialsException());\n\n3\\. Matchers for Collections\n\
    \nNeed to check the contents of a list or a map? Mockito has you covered:\n\n\
    ●     contains(...): For checking if a collection contains something.\n\n●     hasSize(...):\
    \ Matching based on the collection’s size.\n\n●     hasEntry(...),  hasKey(...),\
    \  hasValue(...): Matchers for maps.\n\nScenario: Large Order Surcharge\n\nwhen(orderServiceMock.applySurcharge(argThat(hasSize(greaterThan(20)))))\n\
    \n    .thenCallRealMethod();\n\n4\\. Beyond  when() -> thenReturn()\n\nWhile \
    \ thenReturn() is common, Mockito’s stubbing arsenal includes:\n\n●     thenThrow():\
    \ We’ve seen this for error simulations.\n\n● thenAnswer(): We’ve used this for\
    \ dynamic responses based on arguments.\n\n● doNothing(),  doReturn(),  doThrow()...:\
    \ Variants for void methods, chaining stubs, etc.\n\n5\\. Stubbing Cautions\n\n\
    ● Unnecessary Complexity: Overly-complex matchers can hurt readability. Sometimes\
    \ simple equality comparisons are better.\n\n● Test vs. Implementation Coupling:\
    \ Too much specificity ties your tests to the SUT’s internal workings, making\
    \ them brittle.\n\nNext: Even More Stubbing Power!\n\nIn Part 3, we’ll delve deeper\
    \ into scenarios where stubbing gets intricate with advanced techniques and the\
    \ concept of ‘behavior-driven development’ with Mockito.\n\nAdditional Resources\n\
    \n●     Mockito Combining Matchers:  [https://www.baeldung.com/mockito-argument-matchers](https://www.baeldung.com/mockito-argument-matchers)\n\
    \n●     Mockito Stubbing Options:  [https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#stubbing](https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#stubbing)\n\
    \nDelving Deeper into Stubbing Variations: Advanced Techniques – Part 3\n\nLet’s\
    \ explore even more advanced and nuanced scenarios where Mockito’s stubbing capabilities\
    \ shine!\n\n1\\. Stubbing with Side Effects\n\nOccasionally, you don’t just want\
    \ to return a value, but a side effect on the SUT or the mock:\n\nwhen(inventoryServiceMock.restock(any(Product.class),\
    \  anyInt()))\n\n    .thenAnswer(invocation ->  {\n\n        Product product =\
    \ invocation.getArgument(0);\n\n        product.setQuantity(product.getQuantity()\
    \  + invocation.getArgument(1));\n\n        return  null;  // Example assumes\
    \ void operation\n\n    });\n\nCautions:\n\n● Complex Side Effects: Too much in\
    \ an  Answer block muddles test intent. Refactor your SUT if possible.\n\n● Shared\
    \ State: If not careful, side effects can bleed between tests, leading to unpredictable\
    \ results.\n\n2\\. Stubbing Chains of Calls\n\nWhat if your mock needs to return\
    \ different things sequentially based on another mock’s behavior?\n\nwhen(paymentServiceMock.isPaymentAuthorized(any()))\n\
    \n    .thenReturn(true)   // First time...\n\n    .thenReturn(false);  // Second\
    \ time onwards...\n\n● Use-cases: Simulating a service with a usage quota, or\
    \ a system that changes state over time.\n\n3\\. BDD-Style with Mockito (BDDMockito)\n\
    \nMockito has an extension for a “Given-When-Then” style, promoting readability:\n\
    \ngiven(productRepositoryMock.findById(\"123\")).willReturn(optionalOf(product));\n\
    \n // instead of: when(productRepository.findById(\"123\")).thenReturn(...)              \n\
    \n●     Pros: Can make tests read like specifications\n\n● Cons: Adds another\
    \ dependency (BDDMockito). Can be verbose if the setup is complex.\n\n4\\. ‘Void’\
    \ Methods That Need Special Attention\n\nSometimes a  void method indirectly changes\
    \ something you need to assert on:\n\n// Imagine this updates some internal status...   \n\
    \norderService.processReturn(order);\n\n// Using an ArgumentCaptor:\n\nArgumentCaptor<Order>\
    \ captor =  ArgumentCaptor.forClass(Order.class);\n\n verify(orderService).processReturn(captor.capture());\n\
    \n Order returnedOrder = captor.getValue();\n\n assertTrue(returnOrder.isRefunded());\n\
    \n5\\. Beyond Just Unit Testing\n\nWhile Mockito’s core is unit testing, stubbing\
    \ concepts are essential for:\n\n●     Integration Tests: Mocking external dependencies.\n\
    \n● Spring: Mocking beans within a Spring context for focused tests.\n\nPart 4:\
    \ Tackling Complex Scenarios\n\nNext, we’ll tackle intricate mocking situations\
    \ and how to avoid common pitfalls!\n\nAdditional Resources"
