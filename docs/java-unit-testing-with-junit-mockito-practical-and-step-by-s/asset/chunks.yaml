  trans: "\n\n接下来，我们将探索数据访问层的测试、验证与 mock 的交互，以及更高级的 Spring 测试场景。\n\n## 额外资源\n\n- Spring\
    \ Spring 框架测试指南：[`docs.spring.io/spring-framework/docs/current/reference/html/testing.html`](https://docs.spring.io/spring-framework/docs/current/reference/html/testing.html)\n\
    - Mockito + Spring 示例：[`www.baeldung.com/mockito-spring`](https://www.baeldung.com/mockito-spring)\n\
    \n准备好将你的 Spring 测试提升到新水平了吗？\n\n# Mockito 在 Spring 中的真实应用 – 第 2 部分\n\n让我们继续 Spring\
    \ 与 Mockito 的集成之旅，并探索更高级的场景。\n\n### 1. 测试 Spring Data 存储库 (Repositories)\n\nSpring\
    \ Data 为数据库交互提供了强大的抽象层。让我们看看 Mockito 是如何接入的：\n\n- `@DataJpaTest`：`@SpringBootTest`\
    \ 的聚焦变体，主要用于测试数据访问逻辑。\n- `@AutoConfigureTestDatabase`：如果你想在测试中使用内存数据库（如 `H2`）以避免连接真实数据库，请使用它。\n\
    \n#### 示例 Repository 测试\n\n```\n@DataJpaTest\n@AutoConfigureTestDatabase(replace\
    \ = AutoConfigureTestDatabase.Replace.NONE)\npublic class ProductRepositoryTest\
    \ {\n    @Autowired private ProductRepository productRepository;\n    @MockBean\
    \ private InventoryService inventoryServiceMock;\n\n    @Test\n    public void\
    \ findByCategory_Success() {\n        when(inventoryServiceMock.productCodeExists(\"\
    CODE123\")).thenReturn(true);\n        List<Product> products = productRepository.findByCategory(\"\
    Electronics\");\n        // 对检索到的产品进行断言...\n    }\n}\n```\n\n#### 观察：\n\n- 我们的\
    \ repository 被注入了（`@Autowired`）。\n- 如果需要，我们仍然会选择性地 mock repository 的协作类。\n\n###\
    \ 2. 验证与 Spring Bean 的交互\n\n记得 Mockito 的 `verify()`是一个强大的工具。在 Spring 测试中，我们通常想验证\
    \ Spring 管理组件是如何使用我们的 mock 的：\n\n```java\n@Test\npublic void orderProcessing_InventoryUpdated()\
    \ {\n    // ... 按照之前的方式进行设置 ..\n    orderService.processOrder(someOrder);\n  \
    \  verify(inventoryServiceMock, times(1)).reduceStock(any());\n}\n```\n\n### 3.\
    \ 基础之外：高级场景\n\n- **对 Spring Bean 进行 Spy 监控**：如果需要选择性地 mock Spring bean 的某些方法，Mockito\
    \ 的 `@SpyBean` 将派上用场。（我们很快会详细介绍 Spies！）\n- **使用 Profiles 进行测试**：Spring 的 profile\
    \ 支持用于为测试选择不同的 bean 配置。\n- `@WebMvcTest`：`@SpringBootTest` 的专门化，用于隔离测试 Spring\
    \ MVC。\n\n### 4. 最佳实践\n\n- **测试切片 (Test Slices)**：专注于 Spring 的特定层（`@DataJpaTest`、`@WebMvcTest`\
    \ 等），以获得更快的执行和针对性的结果。\n- **不要过度 Mock Spring**：在涉及连接时，让 Spring 各行其事。审慎地 mock 以隔离你正在测试的单元。\n\
    - **拥抱构造器注入**：这使得你的组件从本质上是可测试的，简化了 Mockito 的使用和 Spring 配置。\n\n#### 权衡\n\n始终考虑速度与保真度。在\
    \ Spring 测试中大量 mock 会使测试更快，但对真实系统的代表性会降低。\n\n#### 额外资源\n\n- 测试 Spring Boot（官方指南）：[`docs.spring.io/spring-boot/docs/current/reference/html/boot-testing.html`](https://docs.spring.io/spring-boot/docs/current/reference/html/boot-testing.html)\n\
    - @SpyBean 文档：[`docs.spring.io/spring-framework/docs/current/javadoc-api/spring/boot/test/mock/MockitoPostProcessor.html#spybean-java.lang.Object-`](https://docs.spring.io/spring-framework/docs/current/javadoc-api/spring/boot/test/mock/MockitoPostProcessor.html#spybean-java.lang.Object-)\n\
    \n后续预告：Mockito Spies！\n准备好通过 Mockito 的 Spy 进入部分 mock 的有趣世界了吗？让我们看看它们如何赋予我们的测试更灵活的活性。\n\
    \n# 理解 Mockito Spy：第 1 部分\n\n让我们准备好深入 Spies 的世界！Spies 为我们提供了一种细致的方法，将真实对象的行为与选择性的\
    \ mock 混合在一起，开启了新的可能性。\n\n### 1. 当 Stub (打桩) 不够时\n\n记住，传统的 Mockito mocks 是“空白板”。除非我们对其进行打桩，否则它们没有自己的行为。但如果：\n\
    - 你希望类的大部分方法都能正常运行？\n- 你需要观察真实对象上的某些方法是如何被调用的？\n\nSpy 出场！\n\n### 2. Spy 演示\n\n\
    - **创建**：`spy()` 创建了一个包装了你的类真实实例的 spy。\n```java\nList<String> myList = new ArrayList<>();\n\
    List<String> spyList = Mockito.spy(myList);\n```\n- **行为**：\n    - **默认真实**：如果你调用一个方法而没有对其进行打桩，spy\
    \ 将委托给真实的底层对象。\n    - **选择性 mock**：你仍然可以使用 `when(...).thenReturn(...)` 来根据需要覆盖行为。\n\
    \n### 3. 示例：带有协作类的支付服务\n\n\n\n```javaclass PaymentService {\n    private Logger\
    \ logger;\n    public PaymentService(Logger logger) {\n        this.logger = logger;\n\
    \    }\n    public void processPayment() {\n        // ... 复杂的支付逻辑 ...\n     \
    \   logger.info(\"Payment processed\");\n    }\n}\n```\n\n**测试场景：**\n- 验证支付逻辑。\n\
    - 确保日志已记录。\n\n**使用 Spy：**\n\n```java\n@Test\npublic void processPayment_Logs()\
    \ {\n    PaymentService paymentService = new PaymentService(new Logger());\n \
    \   PaymentService paymentSpy = Mockito.spy(paymentService);\n    paymentSpy.processPayment();\n\
    \    verify(paymentSpy).info(\"Payment processed\"); // 如果 info 方法被调用\n}\n```\n\
    \n### 4. 关键点\n\n- **部分而非整体替换**：Spies 适用于针对特定的场景，而不是 mock 一切。\n- **验证力量**：Spies\
    \ 的强大之处在于结合 `verify()` 来确保某些方法按预期调用。\n\n第 2 部分：更多的 Spy 细节、最佳实践\n接下来，我们将探讨何时选择\
    \ spy 还是 mock、如何对 Spring bean 进行 spy，以及需要考虑的权衡。\n\n 额外资源\n\n- Mockito 的 Spy 文档：[`javadoc.io/static/mockito-core/3.12.4/org/mockito.Spy.html`](https://javadoc.io/static/mockito-core/3.12.4/org/mockito.Spy.html)\n\
    \n让我们让测试变得更精进——准备掌握 Spy！\n\n# 掌握 Mockito Spy：第 2 部分\n\n让我们结束 Spring 与 Mockito\
    \ 的之旅，并探索 spy 更高级的用法。\n\n### 1. 对 Spring Bean 进行 Spy\n\nMockito 的 `@SpyBean` 专为将\
    \ spy 集成到你的测试中设计：\n- **在测试类中**：使用 `@SpyBean` 声明字段。\n- **Spring 注入**：在测试期间，Spring\
    \ 会注入一个包装真实 bean 的 spy。\n\n**示例：**\n\n```java\n@SpringBootTest\npublic class OrderServiceTest\
    \ {\n    @SpyBean\n    private InventoryService inventoryService;\n    @Autowired\n\
    \    private OrderService orderService;\n\n    @Test\n    public void orderFlow_verifyInventoryInteractions()\
    \ {\n        orderService.processOrder(...);\n        verify(inventoryService,\
    \ times(1)).reduceStock(any());\n    }\n}\n```\n\n### 2. Spy 的最佳实践\n\n- **审慎使用**：当你需要一个主要是真实的对象配合选择性\
    \ mock 时，spy 是最有价值的。\n- **验证重点**：spy 的优势在于结合 `verify()` 使用，以确保真实对象上的某些方法按预期被调用。\n\
    - **谨慎使用 doReturn()**：虽然你可以对 spy 使用 `doReturn(...).when(...)`，但要注意过度的打桩可能会掩盖你想要在测试中发现的问题。\n\
    \n### 3. Spies vs. Mocks：做出选择\n\n让我们明确何时选择哪一个：\n\n| 场景 | 何时使用 Spy…… 何时使用 Mock……\
    \ |\n| :--- | :--- | :--- |\n\n"
- fmt: "\n| You need most real behavior, but want to selectively override or verify\
    \ | You want to isolate certain methods or you want full control to check interaction\
    \ with the real object. | You don’t care about the real implementation at all.\
    \ |\n| :--- | :--- | :--- |\n| Testing legacy code with tight coupling | You can\
    \ spy on collaborators to test one unit in isolation (though refactoring is often\
    \ a longer-term goal). | You want to completely isolate the unit under test. |\n\
    | You want to stub out complex dependencies | You want to focus on the real behavior\
    \ of the majority of the component’s logic. | The dependency is slow, external,\
    \ or its setup is complex. |\n\n## 4. Cautions\n\n- **Potential Overuse**: Don’t\
    \ fall into the trap of spying on everything, diminishing the value of your tests.\n\
    - **Hidden Complexity**: Spies can make tests harder to understand if the balance\
    \ between real and mocked behavior isn’t clear.\n\nAlways remember: Your testing\
    \ goals should drive your tool choice!\n\n## Next Up: PowerMock\n\nReady to break\
    \ the usual boundaries of mocking? Let’s learn how to mock static methods, constructors,\
    \ and more with PowerMock!\n\n## Section 5: Unleashing Advanced Testing Techniques\
    \ with PowerMock and Mockito\n\n# Initial Setup: Integrating PowerMock with Your\
    \ System Under Test – Part 1\n\nLet’s embark on the PowerMock journey. Be warned:\
    \ We’re entering a realm where standard Java limitations start to bend, so use\
    \ these powers wisely!\n\n### 1. Why PowerMock? When the Usual Isn’t Enough\n\n\
    Recall the usual rules of unit testing:\n\n- **Isolate the Unit**: Focus on one\
    \ class at a time.\n- **Mock Dependencies**: Control external collaborators.\n\
    \nPowerMock steps in when you face roadblocks:\n\n- **Static Methods**: The design\
    \ of your code heavily relies on static methods (often found in legacy systems\
    \ or utility classes).\n- **Constructors**: You need to control the creation of\
    \ objects within your system under test.\n- **Private Methods**: Your test needs\
    \ to reach into the private inner workings of a class.\n\n### 2. Adding PowerMock\
    \ to Your Project\n\n#### Dependencies (Maven)\n\nAdd these to your `pom.xml`:\n\
    \n- **PowerMock JUnit Runner**:\n```xml\n<dependency>\n  <groupId>org.powermock</groupId>\n\
    \  <artifactId>powermock-module-junit4</artifactId>\n  <version>LATEST_VERSION</version>\n\
    \  <scope>test</scope>\n</dependency>\n```\n\n- **PowerMock Mockito API**:\n```xml\n\
    <dependency>\n  <groupId>org.powermock</groupId>\n  <artifactId>powermock-api-mockito2</artifactId>\n\
    \  <version>LATEST_VERSION</version>\n  <scope>test</scope>\n</dependency>\n```\n\
    \n### 3. Embracing the New Rules\n\nKey changes to your JUnit tests:\n\n- `@RunWith(PowerMockRunner.class)`:\
    \ Replace your usual runner at the class level.\n- `@PrepareForTest({...})`: At\
    \ the top of your test class, list classes containing static methods, constructors,\
    \ or private methods you want PowerMock to enable mocking on.\n\n#### Example\
    \ Fragment\n\n```java\n@RunWith(PowerMockRunner.class)\n@PrepareForTest({MyClassWithStaticMethods.class,\
    \ AnotherClass.class})\npublic class OrderServiceTest {\n    // ... your tests\
    \ ...\n}\n```\n\n### 4. Basic Usage: Say Hello to Static Mocking\n\nLet’s imagine\
    \ a utility class:\n\n```java\npublic class StringUtils {\n    public static boolean\
    \ isEmpty(String str) {\n        // ...\n    }\n}\n```\n\nWith PowerMock:\n\n\
    ```java\n@Test\npublic void testWithStaticMock() {        \n    PowerMockito.mockStatic(StringUtils.class);\n\
    \    PowerMockito.when(StringUtils.isEmpty(anyString())).thenReturn(true);\n \
    \   // Code that uses StringUtils will now get our mocked behavior\n}\n```\n\n\
    **Important Notes:**\n\n- **JUnit 4 Required**: The runner is currently tied to\
    \ JUnit 4. JUnit 5 support is under development.\n- **Use Judiciously**: Be very\
    \ aware that with great power… comes great responsibility. Overreliance on PowerMock\
    \ can lead to brittle tests, or code that’s hard to refactor later.\n\n## Part\
    \ 2: PowerMocking Constructors, Private Methods, and a Word of Caution\n\nNext,\
    \ we’ll delve into the specifics of constructor manipulation, taming those private\
    \ methods, and essential best practices to keep your tests robust even when using\
    \ these powerful tools.\n\n**Additional Resources:**\n\n- **PowerMock Documentation**:\
    \ [https://github.com/powermock/powermock](https://github.com/powermock/powermock)\n\
    \nWarning: Be prepared for the balance of testing to shift. Think extra carefully\
    \ about your design choices if you find yourself needing PowerMock heavily!\n\n\
    ## Configuring PowerMock for Seamless Integration – Part 2\n\nLet’s continue our\
    \ journey into configuring PowerMock for a smooth experience.\n\n### 1. Mocking\
    \ Constructors with PowerMock\n\nConsider a class with a hard-to-manage dependency\
    \ in its constructor:\n\n```java\npublic class OrderService {\n    private final\
    \ InventoryService inventoryService;\n    public OrderService(InventoryService\
    \ inventoryService) {\n        this.inventoryService = inventoryService;\n   \
    \ }\n}\n```\n\nPowerMock to the Rescue:\n\n```java\n@RunWith(PowerMockRunner.class)\n\
    @PrepareForTest(OrderService.class)\npublic class OrderServiceTest {\n    @Test\n\
    \    public void testConstructor() {\n        InventoryService inventoryMock =\
    \ Mockito.mock(InventoryService.class);\n        PowerMockito.whenNew(InventoryService.class).withAnyArguments().thenReturn(inventoryMock);\n\
    \        OrderService orderService = new OrderService(); // Now uses the mock!\n\
    \    }\n}\n```\n\n**Explanation:**\n\n- `@PrepareForTest(OrderService.class)`:\
    \ Signals we want to influence `OrderService`.\n- `PowerMockito.whenNew(InventoryService.class).withAnyArguments().thenReturn(inventoryMock)`:\
    \ Intercepts constructor.\n\n### 2. Private Methods: Exposing the Hidden\n\nSuppose\
    \ a class needs some refactoring, but you want to test it:\n\n```java\npublic\
    \ class UserManager {\n    public void changePassword(String username, String\
    \ newPassword) {\n        String encrypted = encryptPassword(newPassword);\n \
    \       // ... logic\n    }\n    private String encryptPassword(String rawPassword)\
    \ {\n        return rawPassword;\n    }\n}\n```\n\nTesting with PowerMock:\n\n\
    ```java\n@RunWith(PowerMockRunner.class)\n@PrepareForTest(UserManager.class)\n\
    public class UserManagerTest {\n    @Test\n    public void changePassword_EncryptsCorrectly()\
    \ throws Exception {\n        UserManager userManager = PowerMockito.spy(new UserManager());\n\
    \        String rawPassword = \"test\";\n        PowerMockito.doReturn(\"ENCRYPTED\"\
    ).when(userManager, \"encryptPassword\", rawPassword);\n        \n        userManager.changePassword(\"\
    john\", rawPassword);\n        // Now you can verify if the rest of the logic\
    \ used the encrypted value\n    }\n}\n```\n"
