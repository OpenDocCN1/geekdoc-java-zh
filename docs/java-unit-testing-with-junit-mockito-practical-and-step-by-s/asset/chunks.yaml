    // Now, during testing, calling 'inventoryServiceMock.isProductInStock(\"12345\"\
    )'\n// will ALWAYS return 'true'.\n```\n\n### 2. Stubbing Variations\n\nLet’s\
    \ expand our stubbing toolbox:\n\n- **Returning Different Values**: Respond conditionally\
    \ based on input arguments.\n- **Throwing Exceptions**: `when(...).thenThrow(new\
    \ SomeException())`. Test your SUT’s error handling.\n- **Void Methods**: Mocking\
    \ methods that don’t return anything:\n\n```java\nMockito.doNothing().when(emailServiceMock).sendConfirmationEmail(...);\n\
    ```\n(We’ll cover this more in the “Verification” chapters).\n\n#### Example:\
    \ Tax Calculation\n\n```java\nTaxCalculator taxCalculatorMock = Mockito.mock(TaxCalculator.class);\n\
    \nwhen(taxCalculatorMock.calculateTax(any(Order.class))).thenReturn(10.0);\n```\n\
    \n### 3. Best Practices\n\n- **Keep Stubs Focused**: Each stub should aim to set\
    \ up one specific scenario for a test.\n- **Start Simple**: Begin with simple\
    \ return values, gradually increasing complexity as needed.\n- **Meaningful Naming**:\
    \ Your test names and stubbed values should guide others (and your future self!)\
    \ in understanding the test’s intent.\n\n### 4. A Note on Argument Matchers\n\n\
    In the last example, we used `any(Order.class)`. Mockito provides powerful Argument\
    \ Matchers for flexible stubbing – we’ll dedicate a whole chapter to them!\n"
