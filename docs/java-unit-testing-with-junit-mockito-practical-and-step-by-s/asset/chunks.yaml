    \n      PowerMockito.doReturn(mockCustomer).when(databaseMock).findCustomer(anyString());\n\
    \n       // Now the chain of object creation is under our control\n\n  }\n\n3\\\
    . Refactoring vs. Mocking: The Eternal Struggle\n\nLet’s be real. Could these\
