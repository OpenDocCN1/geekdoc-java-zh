  trans: "\n\n- **方法命名**：采用如 `shouldCalculatePriceCorrectlyWhenProductIsOnSale()`\
    \ 的命名规范。\n- **安排-执行-断言 (AAA)**：一种促进测试阶段清晰分离的模式——设置环境、执行被测代码、然后进行断言。\n\n## 示例：重构测试用\n\
    \n让我们想象一个依赖于当前日期的 `OrderService` 测试用：\n\n### 脆弱版本\n```java\n@Test\nvoid testOrderIsDiscountedOnBlackFriday()\
    \ {\n  LocalDate orderDate = LocalDate.of(2023, 11, 24);  // 黑色星期五\n  OrderService\
    \ orderService = new OrderService();\n  double discount = orderService.calculateDiscount(orderDate);\n\
    \  assertEquals(0.25, discount);\n}\n```\n\n### 重构以增强健壮性\n### 更具韧性的版本\n```java\n\
    @Test\nvoid testOrderIsDiscountedOnBlackFriday() {\n  Clock fixedClock = Clock.fixed(LocalDate.of(2023,\
    \ 11, 24).atStartOfDay(ZoneId.systemDefault()).toInstant(), ZoneId.systemDefault());\n\
    \  OrderService orderService = new OrderService(fixedClock);  // 注入可控的时钟\n  double\
    \ discount = orderService.calculateDiscount();\n  assertEquals(0.25, discount);\n\
    }\n```\n\n**关键变化**：我们引入了 `java.time.Clock` 接口，允许向 `OrderService` 注入一个“固定”的时钟，确保它始终认为现在是黑色星期五。\n\
    \n## 第二部分：更多重构、测试气味以及使测试自给足\n\n在下一部分，我们将涵盖识别问题测试（“测试气味”）的技术、如何让测试自给足以增加隔离性，并深入探讨更多的重构模式。\n\
    \n### 额外资源\n- **测试气味**：[https://martinfowler.com/bliki/TestSmell.html]\n- **Java\
    \ 时间时钟**：[https://docs.oracle.com/javase/8/docs/api/java/time/Clock.html]\n- **重构技术**：[https://refactoring.guru/refactoring/techniques]\n\
    \n# 增强测试健壮性：高级重构技术：部分部分\n\n## 识别测试气味\n\n在我们深入探讨重构之前，让我们学会识别常见的“测试气味”——这些是暗示你的测试代码中可能存在问题的明显迹象。\n\
    \n- **脆弱的测试**：因与其无关的代码更改而频繁失败。\n- **缓慢的测试**：执行时间过长的测试会降低人们频繁测试的意愿。\n- **过度模拟 (Mocking)**：复杂的\
    \ Mock 设置可能使测试难以理解和维护。这是你的单元可能没有良好隔离的信号。\n- **冗余**：多个测试断言同一件事价值很小。\n- **晦涩的测试逻辑**：难以追踪的复杂测试代码表明需要进行重构。\n\
    - **条件测试逻辑**：根据环境或数据选择性运行的测试表明存在隐藏的依赖关系或可重复性问题。\n\n## 高级重构技术\n\n让我们关注一些更复杂的重构技术，为你的测试套件装上铠：\n\
    \n1. **引入测试替身 (Test Doubles)**：用简化的替代品（`Mocks, Stubs, Fakes`）替换复杂的依赖。我们将在探索 `Mockito`\
    \ 时详细介绍这一点，但该概念是隔离性的关键。\n2. **测试数据的构建器模式 (Builder Pattern)**：不再使用分散的测试数据，`Builder\
    \ Pattern` 集中了测试对象的构建方式，使测试设置更加一致。\n\n### 示例：测试数据构建器\n```java\npublic class OrderBuilder\
    \ {\n  private String orderId = \"123\";\n  private LocalDate orderDate = LocalDate.now();\n\
    \  private List<LineItem> lineItems = new ArrayList<>();\n\n  public OrderBuilder\
    \ withOrderId(String orderId) {\n    this.orderId = orderId;\n    return this;\n\
    \  }\n  // ... 更多用于自定义的 'with' 方法\n  public Order build() {\n    Order order =\
    \ new Order(orderId, orderDate);\n    order.setLineItems(lineItems);\n    return\
    \ order;\n  }\n}\n```\n\n### 在测试中使用\n```java\n@Test\nvoid testCalculateTotal()\
    \ {\n  Order order = new OrderBuilder()\n    .withOrderId(\"test-order\")\n  \
    \  .withLineItem(new LineItem(\"Product1\", 10.0, 2))\n    .build();\n  // ...\n\
    }\n```\n\n3. **对象母亲模式 (Object Mother Pattern)**：与 `Builder Pattern` 类似，但侧重于创建可重用的、“原型”测试对象，以减少多个测试之间的冗余。\n\
    4. **提取设置逻辑**：将重复的测试设置代码移动到辅助方法或可重用的设置/清理函数（`@Before`, `@BeforeEach` 等）中，以提高 DRY（不要重复自己）性。\n\
    \n## 解决特定的测试气味\n\n- **脆弱的测试**：大量使用测试替身来隔离被测单元，并将断言关注在单元的行为上，而不是协作者的内部细节。\n- **缓慢的测试**：识别瓶颈，并可能引入优化或\
    \ Mock 来加速。考虑将缓慢测试作为 nightly 构建的一部分选择性运行，而不是每次开发更改都运行。\n- **过度模拟**：重新评估你的设计的信号。如果你的类需要许多\
    \ Mock 才能进行测试，也许它的职责可以进一步拆分。\n\n## 重构之外：良好实践\n\n- **有意义的命名**：为你的生产代码和测试都给出反映其目的的清晰名称。\n\
    - **封装**：保持测试类镜像你的产品代码结构，以便于导航。\n- **为可测试性而设计**：编写测试会影响你的设计。难以测试的代码通常表明生产代码结构存在问题。\n\
    \n## 持续改进\n\n将你的测试套件视为代码库不可或的一部分。与生产代码同步重构你的测试以保持项目的健康和适应性。\n\n## 下一个：assertTrue\
    \ 和 assertFalse 的布尔逻辑\n\n在下一章节，我们将转换方向，讨论如何使用 JUnit 的 `assertTrue` 和 `assertFalse`\
    \ 方法在测试中验证条件。\n\n### 额外资源\n- **测试气味**：[https://martinfowler.com/bliki/TestSmell.html]\n\
    - **重构模式**：[https://refactoring.guru/refactoring/techniques]\n- **为可测试性设计**：[https://martinfowler.com/articles/practical-test-pyramid.html]\n\
    \n# 验证条件：利用 assertTrue 和 assertFalse\n\n除了等性检查外，测试通常还需要验证逻辑条件。引入 JUnit 的 `assertTrue`\
    \ 和 `assertFalse` —— 这是在代码中断言布尔事实的基础工具。\n\n## 基础\n\n- `assertTrue(boolean condition)`：断言提供的\
    \ `condition` 求值为 `true`。如果条件为真，则测试通过，否则测试失败。\n- `assertFalse(boolean condition)`：断言提供的\
    \ `condition` 求值为 `false`。如果条件为假，则测试通过，否则测试失败。\n\n### 示例：检查登录状态\n```java\n@Test\n\
    void testLoginSuccess() {\n  AuthService authService = new AuthService();\n  boolean\
    \ isLoggedIn = authService.login(\"john.doe\", \"password123\");\n  assertTrue(isLoggedIn);\n\
    }\n```\n\n## 不仅仅是 true/false\n\n这些方法由于能够评估表达式而特别强大：\n\n```java\n@Test\nvoid testDiscountEligibility()\
    \ {\n  Customer customer = new Customer(true); // 忠诚客户\n  Product product = new\
    \ Product(55.0);\n  DiscountService discountService = new DiscountService();\n\
    \  boolean isEligible = discountService.isEligibleForDiscount(customer, product);\n\
    \  assertTrue(isEligible);\n}\n```\n\n## 用场景\n\n以下是 `assertTrue` 和 `assertFalse`\
    \ 发光的一些常见场景：\n\n- **条件逻辑**：验证代码中的 ‘if’ 语句和其他决策结构会导致正确的输出。\n- **状态验证**：在调用特定方法后检查对象的状态（例如，集合的\
    \ `isEmpty()`、属性标志位等）。\n\n"
- fmt: "\n- Combined Assertions: You can chain assertions together for more complex\
    \ checks.\n\n### Example: Order Status\n\n```java\n@Test\nvoid testOrderIsShipped()\
    \ {\n    OrderService orderService = new OrderService();\n    orderService.processOrder(12345);\n\
    \    Order order = orderService.getOrder(12345);\n    assertTrue(order.isPaid());\n\
    \    assertTrue(order.isShipped());\n}\n```\n\n### Custom Failure Messages\n\n\
    As with other assertions, you can include custom messages to make test failures\
    \ more informative:\n\n```java\n@Test\nvoid testAccountActivation() {\n    //\
    \ ... setup\n    assertFalse(account.isLocked(), \"Account should not be locked\
    \ after activation\");\n}\n```\n\n### Key Considerations\n\n- **Readability**:\
    \ Sometimes your boolean expressions can get complex. Break them into well-named\
    \ variables to enhance code readability.\n- **Test-Driven Development (TDD)**:\
    \ Write your assertions before your production code, driving your design decisions.\n\
    \n### Pitfall: Overusing Negation\n\nWhile technically possible, avoid chains\
    \ of `!` (negation) operators in your conditions. This can make tests harder to\
    \ parse. Instead, opt for clearer expressions or refactor your code to yield the\
    \ condition directly.\n\n### Example: Refactoring for Clarity\n\n```java\n// Less\
    \ Ideal:\nassertFalse(!accountService.isUserAccountActive(userId));\n\n// Better:\n\
    assertTrue(accountService.isUserAccountActive(userId));\n```\n\n### Complementary\
    \ Assertions\n\nRemember these other useful assertions provided by JUnit:\n\n\
    - `assertNull(object)`: Verifies a given object is `null`.\n- `assertNotNull(object)`:\
    \ Verifies a given object is not null.\n\n# Part 2: Enhanced Techniques & Integration\n\
    \nIn the next part, we’ll delve into using `assertTrue` and `assertFalse` for\
    \ testing collections, error scenarios, and how they integrate with advanced testing\
    \ concepts like Hamcrest matchers.\n\n### Additional Resources\n\n- JUnit 5 Assertions\
    \ API: [https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html](https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html)\n\
    \n# Asserting Conditions with Precision: Advanced Techniques – Part 2\n\n### Testing\
    \ Collections\n\nFrequently, you’ll need to ensure that collections (Lists, Sets,\
    \ Maps) contain specific elements or have certain properties:\n\n- **Checking\
    \ Content**:\n```java\nList<Integer> numbers = Arrays.asList(2, 4, 6);\nassertTrue(numbers.contains(4));\n\
    ```\n\n- **Empty or Not**:\n```java\nSet<String> errors = validator.validate(data);\n\
    assertTrue(errors.isEmpty(), \"Validation should have passed without errors\"\
    );\n```\n\n### Handling Exceptions\n\nJUnit’s `assertThrows` comes in handy for\
    \ error scenarios. Remember, we briefly touched upon this in an earlier chapter.\
    \ Now, let’s go deeper:\n\n```java\n@Test\nvoid testInvalidDiscountCode() {\n\
    \    assertThrows(InvalidDiscountCodeException.class, () -> {\n        store.applyDiscount(\"\
    badCode\");\n    });\n}\n```\n\n- **Verifying the Exception Message**:\n```java\n\
    Exception exception = assertThrows(IllegalArgumentException.class, () -> {\n \
    \   calculator.divide(10, 0);\n});\nassertTrue(exception.getMessage().contains(\"\
    Division by zero\"));\n```\n\n### Going Beyond with Hamcrest Matchers\n\nWe’ll\
    \ dive into Hamcrest in a dedicated chapter later, but let’s get a preview! Hamcrest\
    \ matchers provide a rich vocabulary to express assertions with extraordinary\
    \ flexibility and readability.\n\n### Example: Collection Checks with Hamcrest\n\
    \n```java\nimport static org.hamcrest.MatcherAssert.assertThat;\nimport static\
    \ org.hamcrest.Matchers.*;\n\n@Test\nvoid testProductNames() {\n    List<String>\
    \ products = Arrays.asList(\"Mug\", \"T-shirt\", \"Notebook\");\n    assertThat(products,\
    \ hasItems(\"Mug\", \"Notebook\"));\n    assertThat(products, hasSize(3));\n}\n\
    ```\n\n**Explanation:**\n\n- `assertThat`: The entry point for Hamcrest assertions.\n\
    - `hasItems`, `hasSize`: Example of the extensive matchers Hamcrest offers.\n\n\
    ### Combining with `assertTrue` for Fluidity\n\nYou can integrate Hamcrest with\
    \ standard boolean assertions for maximum expressiveness:\n\n```java\n@Test\n\
    void testOrderStateTransitions() {\n    Order order = new Order();\n    order.place();\n\
    \    order.ship();\n    assertTrue(order.getState().matches(OrderState.SHIPPED));\
    \  // Custom matcher\n}\n```\n\n### Test Timeouts\n\nRemember the `assertTimeout`\
    \ and `assertTimeoutPreemptively` methods? These are vital for ensuring your tests\
    \ don’t hang indefinitely due to bugs or potential infinite loops.\n\n**Example**\n\
    \n```java\n@Test\nvoid testNetworkTimeout() {\n    assertTimeout(Duration.ofMillis(500),\
    \ () -> {\n        client.fetchData();\n    });\n}\n```\n\n### Best Practices\n\
    \n- **Naming**: Use descriptive names for tests and variables.\n- **Clarity**:\
    \ Favor clear expressions over complex logic.\n- **Cleanup**: Ensure resources\
    \ are properly released using `@AfterEach`.\n"
