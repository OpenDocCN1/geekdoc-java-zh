  trans: "\n\n- 组合断言：你可以将断言链在一起以进行更复杂的检查。\n\n### 示例：订单状态\n\n```java\n@Test\nvoid testOrderIsShipped()\
    \ {\n    OrderService orderService = new OrderService();\n    orderService.processOrder(12345);\n\
    \    Order order = orderService.getOrder(12345);\n    assertTrue(order.isPaid());\n\
    \    assertTrue(order.isShipped());\n}\n```\n\n### 自定义失败消息\n\n与其他断言一样，你可以包含自定义消息，以使测试失败提供更详尽的信息：\n\
    \n```java\n@Test\nvoid testAccountActivation() {\n    // ... setup\n    assertFalse(account.isLocked(),\
    \ \"Account should not be locked after activation\");\n}\n```\n\n### 关键考虑\n\n\
    -   **可读性**：有时你的布尔表达式可能会变得复杂。将它们拆分为命名良好的变量，以增强代码的可读性。\n-   **测试驱动开发 (TDD)**：在编写生产代码之前编写断言，以此驱动你的设计决策。\n\
    \n### 陷阱：过度使用否定操作\n\n虽然在技术上可行，但请避免在条件中使用连续的 `!`（否定）操作符链。这会让测试更难解析。相反，请选择更清晰的表达式或重构你的代码以直接产生条件。\n\
    \n### 示例：为了清晰性进行重构\n\n```java\n// 不太理想：\nassertFalse(!accountService.isUserAccountActive(userId));\n\
    \n// 更好：\nassertTrue(accountService.isUserAccountActive(userId));\n```\n\n###\
    \ 互补断言\n\n记住 JUnit 提供的其他有用断言：\n\n-   `assertNull(object)`：验证给定的对象为 `null`。\n-\
    \   `assertNotNull(object)`：验证给定的对象不为 `null`。\n\n# 第二部分：增强技术与集成\n\n在下一部分中，我们将深入研究使用\
    \ `assertTrue` 和 `assertFalse` 测试集合、错误场景，以及它们如何与 Hamcrest 匹配器等高级测试概念集成。\n\n###\
    \ 额外资源\n\n-   JUnit 5 断言 API：[`junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html`](https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html)\n\
    \n# 精确断言条件：高级技术 – 第二部分\n\n### 测试集合\n\n通常，你需要确保集合（Lists、Sets、Maps）包含特定的元素或具有某些属性：\n\
    \n-   **检查内容**：\n```java\nList<Integer> numbers = Arrays.asList(2, 4, 6);\nassertTrue(numbers.contains(4));\n\
    ```\n\n-   **是否为空或非空**：\n```java\nSet<String> errors = validator.validate(data);\n\
    assertTrue(errors.isEmpty(), \"Validation should have passed without errors\"\
    );\n```\n\n### 处理异常\n\nJUnit 的 `assertThrows` 在错误场景下非常有用。记住，我们在之前的章节中简要地提到过这一点。现在，让我们深入探究：\n\
    \n```java\n@Test\nvoid testInvalidDiscountCode() {\n    assertThrows(InvalidDiscountCodeException.class,\
    \ () -> {\n        store.applyDiscount(\"badCode\");\n    });\n}\n```\n\n-   **验证异常消息**：\n\
    ```java\nException exception = assertThrows(IllegalArgumentException.class, ()\
    \ -> {\n    calculator.divide(10, 0);\n});\nassertTrue(exception.getMessage().contains(\"\
    Division by zero\"));\n```\n\n### 使用 Hamcrest 匹配器进阶\n\n我们将在后的专门章节中深入研究 Hamcrest，但让我们先预览一下！Hamcrest\
    \ 匹配器提供了丰富的词汇，以极高的灵活性和可读性来表达断言。\n\n### 示例：使用 Hamcrest 检查集合\n\n```java\nimport\
    \ static org.hamcrest.MatcherAssert.assertThat;\nimport static org.hamcrest.Matchers.*;\n\
    \n@Test\nvoid testProductNames() {\n    List<String> products = Arrays.asList(\"\
    Mug\", \"T-shirt\", \"Notebook\");\n    assertThat(products, hasItems(\"Mug\"\
    , \"Notebook\"));\n    assertThat(products, hasSize(3));\n}\n```\n\n**说明：**\n\n\
    -   `assertThat`：Hamcrest 断言的入口点。\n-   `hasItems`, `hasSize`：Hamcrest 提供的大量匹配器示例。\n\
    \n###  `assertTrue` 以实现流式处理\n\n你可以将 Hamcrest 与标准的布尔断言结合，以获得最大的表达力：\n\n```java\n\
    @Test\nvoid testOrderStateTransitions() {\n    Order order = new Order();\n  \
    \  order.place();\n    order.ship();\n    assertTrue(order.getState().matches(OrderState.SHIPPED));\
    \ // 自定义匹配器\n}\n```\n\n### 测试超时\n\n记得 `assertTimeout` 和 `assertTimeoutPreemptively`\
    \ 方法吗？这些对于确保你的测试不会因为 Bug 或潜在的无限循环而无限运行至关重要。\n\n**示例**\n\n```java\n@Test\nvoid\
    \ testNetworkTimeout() {\n    assertTimeout(Duration.ofMillis(500), () -> {\n\
    \        client.fetchData();\n    });\n}\n```\n\n### 最佳实践\n\n-   **命名**：为测试和变量使用性名称。\n\
    -   **清晰性**：优先使用清晰的表达式而非复杂的逻辑。\n-   **清理**：使用 `@AfterEach` 确保资源被正确释放。\n\n"
- fmt: "\n## Static vs. Instance Methods\n\n- Methods annotated with `@BeforeClass`\
    \ and `@AfterClass` must be `static`. However, `@BeforeEach` and `@AfterEach`\
    \ methods should typically not be `static` so they have access to instance fields\
    \ of the test class.\n- **Maintainability**: These annotations dramatically improve\
    \ test code readability and organization.\n\n## Common Scenarios for Setup/Teardown\n\
    \n- **Database interactions**: Creating test records, rolling back transactions.\n\
    - **Mocking**: Configuring test doubles (we’ll discuss this in later Mockito chapters).\n\
    - **External systems**: Starting test servers, clearing caches, etc.\n- **Data\
    \ generation**: Creating test objects.\n\n## A Note on Inheritance\n\nSetup/teardown\
    \ methods are inherited within test class hierarchies. Parent class methods execute\
    \ before child class methods (for `@BeforeClass` and `@BeforeEach`), and after\
    \ child class methods (for `@AfterEach` and `@AfterClass`).\n\n# Part 2: Optimizing\
    \ for Performance and Complex Scenarios\n\nIn the next part, we’ll delve into\
    \ advanced setup and teardown strategies, considerations for performance, and\
    \ how these annotations play well with other JUnit features.\n\n## Additional\
    \ Resources\n- JUnit 5 User Guide - Test Lifecycle: [https://junit.org/junit5/docs/current/user-guide/](https://junit.org/junit5/docs/current/user-guide/)\n\
    \n# Optimizing Test Initialization and Cleanup: Advanced Strategies – Part 2\n\
    \n## Performance Considerations\n\nWhile `@Before` and `@After` (and their variants)\
    \ are fantastic, keep these performance optimizations in mind, especially for\
    \ large test suites:\n\n- **Laziness is a Virtue**: If possible, create expensive\
    \ objects or set up resources only when tests actually need them. Avoid heavy\
    \ initialization in `@BeforeEach` unless absolutely necessary.\n- **Selective\
    \ Setup**: Can you group tests that share common setup logic to avoid redundant\
    \ work? Consider nested classes or clever reuse patterns.\n- **Test Object Pools**:\
    \ For some objects, object creation might be the bottleneck. Maintaining a pool\
    \ of reusable objects can sometimes offer a speedup.\n\n## Complex Hierarchies\n\
    \nWhen your setup and cleanup involve multiple dependencies or intricate sequences,\
    \ consider:\n\n- **Builder Pattern**: We touched on this in the refactoring chapter.\
    \ The Builder Pattern promotes controlled, step-by-step object construction, centralizing\
    \ setup logic.\n- **Custom Setup/Teardown Utilities**: Encapsulate complex setup\
    \ steps into helper functions or dedicated utility classes, making your test methods\
    \ more concise.\n\n## Beyond Setup and Cleanup\n\nLet’s look at techniques that\
    \ complement these annotations:\n\n1. **Test Data Management**:\n    - **In-memory\
    \ Databases (H2, HSQLDB)**: Instead of hitting a real database for every test,\
    \ use embedded databases for lightning-fast tests.\n    - **Data Fixtures**: Predefined\
    \ data sets that you load before tests (XML, JSON, CSV).\n2. **Speeding up External\
    \ Interactions**:\n    - **Mocking**: Mockito is your ultimate tool here. We’ll\
    \ dedicate a whole section to mastering it. Simulate slow external dependencies\
    \ to keep unit tests fast.\n    - **Test Doubles in General**: Stubs, fakes, etc.,\
    \ as lighter-weight stand-ins.\n\n### Example: Test Data Fixture\n\n```java\n\
    @BeforeEach\nvoid loadTestData() {\n    testDataLoader.load(\"default-accounts.json\"\
    , accountRepository);\n}\n```\n\n## Interplay with Other JUnit Features\n\n- `@TestInstance(Lifecycle.PER_CLASS)`:\
    \ This changes how JUnit instantiates your test class (`PER_METHOD` is the default).\
    \ Using `PER_CLASS` means all your test methods share one instance of the class.\
    \ Setup with `@BeforeAll` works, but tread carefully, as this can introduce unwanted\
    \ dependencies between tests if you’re not managing state.\n- **Assumptions (assumeTrue,\
    \ assumeFalse)**: Conditionally run entire tests only if certain setups succeeded.\
    \ Use with caution to avoid masking hidden errors.\n\n## Cautionary Notes\n\n\
    - **Overuse**: Excessive setup can signal design problems in your production code.\
    \ Are your classes too complex?\n- **State Leaks**: Ensure `@AfterEach` truly\
    \ cleans up changes, avoiding side effects between tests. Thorough cleanup is\
    \ a must!\n\n### Example: Cautious State Reset\n\n```java\n@AfterEach\nvoid resetCalculator()\
    \ {\n    if (calculator != null) {\n        calculator.clear();\n    }\n}\n```\n\
    \n- **Balancing Granularity**: Avoid initializing everything within a single `@BeforeEach`.\
    \ A balance between fine-grained setup and test efficiency is key.\n\n## Next:\
    \ Static Setup/Teardown with @BeforeClass and @AfterClass\n\nNext, we’ll discuss\
    \ the strategic use of those “class-level” setup and teardown annotations and\
    \ when they fit best within your testing arsenal.\n\n## Additional Resources\n\
    - Test Data Management Strategies: [https://searchsoftwarequality.techtarget.com/definition/test-data-management](https://searchsoftwarequality.techtarget.com/definition/test-data-management)\n\
    - JUnit 5 @TestInstance: [https://junit.org/junit5/docs/current/user-guide/](https://junit.org/junit5/docs/current/user-guide/)\n\
    \n# Coordinating Test Lifecycle: @BeforeClass and @AfterClass\n\nSometimes, setup\
    \ and teardown tasks are global to an entire test class. Enter `@BeforeClass`\
    \ and `@AfterClass` – your tools for class-wide orchestration.\n\n## When to Use\
    \ Them\n\nCommon use cases include:\n- **Expensive Initialization**: Setting up\
    \ things like database connections, embedded servers, or heavy-duty test fixtures\
    \ that all tests share.\n- **Static Resources**: Modifying static fields or system\
    \ properties that tests interact with.\n- **One-time Cleanup**: Releasing resources\
    \ acquired within the class.\n\n## Essential Notes\n\n- **Execution Order**:\n\
    \    1. `@BeforeClass`: Executed once before any tests.\n    2. `@BeforeEach`\
    \ -> Test Method -> `@AfterEach` (repeated for each test).\n    3. `@AfterClass`:\
    \ Executed once after all tests.\n- **Scope**: Class level.\n- **Methods must\
    \ be `static`**: Only static methods can carry these annotations. Instance methods\
    \ can’t access them.\n\n## Example: Database-Centric Tests\n\n```java\n@TestInstance(Lifecycle.PER_CLASS)\
    \ // Example usage with this lifecycle\npublic class InvoiceRepositoryTest {\n\
    \    private static InvoiceRepository repository;\n    private static Connection\
    \ connection;\n\n    @BeforeClass\n    static void setupDatabase() {\n       \
    \ connection = TestDatabaseUtil.createConnection();\n        repository = new\
    \ InvoiceRepository(connection);\n    }\n\n    @AfterClass\n    static void tearDownDatabase()\
    \ {\n        repository = null;\n        TestDatabaseUtil.closeConnection(connection);\n\
    \    }\n\n    @Test\n    // ... your test methods ...\n}\n```\n\n## Explanation\n\
    \n- The setup and teardown routines are performed once for the entire test class,\
    \ centralizing costly database operations.\n- `@TestInstance(Lifecycle.PER_CLASS)`\
    \ is used here for illustrative purposes, but use this cautiously as it breaks\
    \ the standard isolation of tests by sharing state between them.\n\n## Key Considerations\n\
    \n- **Test Isolation**: Generally, prefer per-test setup (`@BeforeEach`) and teardown\
    \ (`@AfterEach`) for maximum isolation. Use class-wide setup judiciously.\n- **State\
    \ Management**: If your code interacts with static fields or system-wide properties,\
    \ rigorous cleanup in `@AfterClass` is critical to avoid unexpected state leaking\
    \ between your tests.\n- **Performance**: These annotations can improve test suite\
    \ performance if you are performing costly initialization that’s genuinely shared.\n\
    \n## When Not to Use Them\n\n- **Per-Test Requirements**: Avoid these if each\
    \ test needs fresh objects or its own unique setup of environment variables.\n\
    - **Overuse**: Excessive class-wide setup might suggest that your classes have\
    \ too many dependencies or responsibilities and could be refactored.\n\n## Alternatives\
    \ and Complements\n\n- **Test Suites**: Consider JUnit’s `@Suite` annotation if\
    \ you need to group multiple test classes that share a very specific and expensive\
    \ setup.\n"
