  trans: "\n\n# Mockito 的监视能力 [`www.baeldung.com/mockito-spy`](https://www.baeldung.com/mockito-spy)\n\
    \n## 第 3 节：揭示 Mockito 的核心要素\n\n## 高级 Stub 技术：探索参数匹配器及其他 – 部分 1\n\n让我们开启探索 Mockito\
    \ 参数匹配器（argument matchers）强大之处之旅，这将将你的 Stub 精准度提升到一个全新的水平！\n\n### 1. 超越简单相等\n\
    虽然 Mockito 的 `when(...).thenReturn(...)` 非常用，但如果你需要灵活地定义 mock 对什么内容做出响应，怎么办？引入参数匹配器（Argument\
    \ Matchers）吧！\n\n#### 基础示例\n```java\nwhen(inventoryServiceMock.getProductPrice(anyString())).thenReturn(9.99);\n\
    // 任何字符串参数都会触发此存桩\n```\n\n### 2. 匹配器：核心工具箱\nMockito 提供了内置的匹配器（为了简洁起见，请从 `org.mockito.ArgumentMatchers.*`\
    \ 使用 `static import`）：\n\n*   `any(...)`: 匹配该类型的任何内容（`anyInt()`, `anyList()`,\
    \ 等）。\n*   `eq(...)`: 精确值匹配（类似于 JUnit 自身的断言）。\n*   `isNull()`, `notNull()`: 检查空和非空引用。\n\
    *   正则表达式: 匹配符合模式的字符串（`matches()` 匹配器）。\n\n#### 示例：过滤产品\n```java\nwhen(inventoryServiceMock.filterProducts(anyString(),\
    \ eq(\"Electronics\"), anyDouble()))\n    .thenReturn(filteredProductList);\n\
    ```\n\n### 3. `any(...)` 的威力\n*   **占位符**: 当参数的值不是测试的核心时使用。\n*   **灵活性**: 防止测试因无关值的变动而崩溃。\n\
    *   **配合参数捕获（Argument Capture）**: 正如我们之前看到的，使用 `any()` 来捕获值以供后续断言使用。\n\n### 4.\
    \ 自定义参数匹配器\n当内置匹配器不够用时，可以构建自己的：\n\n```java\nclass IsValidProduct implements ArgumentMatcher<Product>\
    \ {\n    @Override\n    public boolean matches(Product product) {\n        return\
    \ product.isValid(); // 在此处编写你的自定义逻辑！\n    }\n}\n```\n\n#### 使用方法：\n```java\n\
    when(inventoryServiceMock.updateStock(argThat(new IsValidProduct()))).then(...)\n\
    ```\n\n### 5. 注意事项\n*   **特定 vs. 宽松**: 平衡精确度，以防止测试中出现假阳性，以及由于过于具体而导致的脆弱性。\n* \
    \  配合匹配器的 `verify(...)`: 确保 mock 是用正确的参数被调用的。\n*   **可读性与精确性**: 良好的匹配器可以提高测试意图的清晰度。\n\
    \n---\n\n## 部分 2：复杂匹配器及其他\n\n接下来，我们将组合匹配器，构建更复杂的自定义匹配器，并探索与参数匹配协同工作的 Mockito 特性！\n\
    \n### 额外资源\n*   Mockito 参数匹配器文档：[`javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html`](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html)\n\
    *   自定义参数匹配器 [`www.baeldung.com/mockito-argument-matchers`](https://www.baeldung.com/mockito-argument-matchers)\n\
    \n## 高级 Stub 策略：破解参数匹配器及更多 – 部分 2\n\n让我们继续深入探讨 Mockito 的高级 Stub 能力。这次，我们将以有趣的方式组合匹配器，并超越基础范围！\n\
    \n### 1. 混合与配对（匹配器）\n你不局限于每个 Stub 只能使用一个匹配器！组合它们来微调你的标准：\n\n```java\nwhen(inventoryServiceMock.calculateDiscount(\n\
    \    any(Order.class),\n    argThat(order -> order.getItems().size() > 5), //\
    \ 自定义匹配器\n    matches(\"SUMMER_SALE\")\n))\n.thenReturn(0.20); // 20% 折\n```\n\
    \n### 2. 逻辑运算符\nMockito 提供了常用逻辑操作的匹配器：\n\n*   `not(matcher)`: 对匹配器取反\n*   `or(matcher1,\
    \ matcher2)`: 如果任一匹配器匹配则为真\n*   `and(matcher1, matcher2)`: 如果两个匹配器都匹配则为真\n\n####\
    \ 示例：处理无效登录\n```java\nwhen(userServiceMock.authenticate(\n    not(eq(\"admin\"\
    )), // 排除管理员用户\n    anyString()\n)).thenThrow(new InvalidCredentialsException());\n\
    ```\n\n### 3. 集合的匹配器\n需要检查列表或 map 的内容吗？Mockito 已经准备好了：\n\n*   `contains(...)`:\
    \ 用于检查集合是否包含某项内容。\n*   `hasSize(...)`: 根据集合的大小进行匹配。\n*   `hasEntry(...)`, `hasKey(...)`,\
    \ `hasValue(...)`:  map 的匹配器。\n\n#### 场景：大额附加费\n```java\nwhen(orderServiceMock.applySurcharge(argThat(hasSize(20))));\n\
    ```\n\n### 4. 超越 `when()` -> `thenReturn()`\n虽然 `thenReturn()` 很常见，但 Mockito 的武器库还包括：\n\
    \n*   `thenThrow()`: 我们已经见过它处理错误。\n*   `thenAnswer()`: 我们已经见过它用于动态响应。\n*   `thenCallMethod()`:\
    \ 用于 spy（监视）。\n*   `doNothing()`, `doReturn()`, `doThrow()`: 用于 void 方法。\n\n###\
    \ 5. 注意事项\n*   **不必要的复杂性**: `Answer` 中内容过多会模糊测试意图。\n*   **测试 vs. 实现**: 过度具体会导致测试与内部细节耦合。\n\
    \n接下来：`any()` 和 `argThat()`\n\n## 深入研究 Stub 变体：高级技术 – 部分 3\n\n让我们探索更多细微的场景，Mockito\
    \ 的能力将大放异彩！\n\n### 1. 带副作用的 Stub\n有时，你不只是想返回一个值，而是对 mock 产生副作用：\n\n```java\nwhen(inventoryServiceMock.restock(any(Product.class),\
    \ anyInt()))\n    .thenAnswer(invocation -> {\n        Product product = invocation.getArgument(0);\n\
    \        product.setQuantity(product.getQuantity() + invocation.getArgument(1));\n\
    \        return null;\n    });\n\n\n*   **复杂的副作用**: 如果可能，请重构。\n*   **共享状态**: 如果不小心，副作用会在测试间泄露。\n\
    \n### 2. 调用链的 Stubbing\n如果你的 mock 需要顺序返回不同的结果怎么办？\n\n```java\nwhen(paymentServiceMock.isPaymentAuthorized(any()))\n\
    \    .thenReturn(true) // 第一次...\n    .thenReturn(false); // 第二次开始...\n```\n\n\
    ### 3. BDD 风格的 Mockito (BDDMockito)\nMockito 有一个扩展用于“Given-When-Then”风格，提高了可读性：\n\
    \n```java\ngiven(productRepositoryMock.findById(\"123\")).willReturn(optionalOf(product));\n\
    // 代替：when(productRepository.findById(\"123\")).thenReturn(...)\n```\n\n*   **优点**:\
    \ 可以让测试读起来像规范\n*   **缺点**: 增加了另一个依赖（BDDMockito）。\n\n### 4. 需要特殊关注的 void 方法\n\n\
    一个 void 方法会间接改变某些你需要断言的内容：\n\n```java\n// 假设这更新了某些内部状态...\norderService.processReturn(order);\n\
    \n// 使用 ArgumentCaptor（参数捕获）：\nArgumentCaptor<Order> captor = ArgumentCaptor.forClass(Order.class);\n\
    verify(orderService).processReturn(captor.capture());\n\nOrder returnedOrder =\
    \ captor.getValue();\nassertTrue(returnedOrder.isRefunded());\n```\n\n### 5. 不仅仅是单元测试\n\
    虽然 Mockito 的核心是单元测试，但 Stub 概念对于这些至关重要：\n\n*   **集成测试**: 模拟外部依赖。\n*   **Spring**:\
    \ 在 Spring 上下文中 mock bean 以进行专注的测试。\n\n接下来：应对复杂场景\n\n"
- fmt: "\n* Mockito BDD Extension: [https://javadoc.io/doc/org.mockito/mockito-bom/latest/org/mockito/bdd/package-summary.html](https://javadoc.io/doc/org.mockito/mockito-bom/latest/org/mockito/bdd/package-summary.html)\n\
    * Stubbing Void Methods: [https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#stubbing_consecutive_calls](https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#stubbing_consecutive_calls)\n\
    \nAre you ready for when typical stubbing just isn’t enough? Let’s navigate the\
    \ trickier side of Mockito!\n\n# Navigating Complex Stubbing Scenarios – Part\
    \ 4\n\nIn this chapter, we’ll tackle scenarios that might make you question your\
    \ sanity, but fear not, we’ll come out stronger!\n\n## 1. When Stubs Fight Back:\
    \ Recursive Calls\n\nImagine testing a method that itself calls another method\
    \ on the same mock:\n\n```java\n// Our Service with a self-referential method:\n\
    \nclass InventoryService {\n    ...\n    public int calculateAvailableStock(Product\
    \ product) {\n        int inStock = getStockCount(product);  // Calls a method\
    \ on itself (same mock)\n        // ...more logic...\n    }\n    ...\n}\n```\n\
    \n* **Solution 1**: `thenCallRealMethod()` If appropriate, let the initial stub\
    \ trigger real behavior for the recursive part.\n* **Solution 2**: Refactor If\
    \ possible, break out the recursive logic into a testable helper, making your\
    \ code cleaner overall.\n\n## 2. Mocking the Unmockable?\n\n* **Final Classes/Methods**:\
    \ We saw PowerMock as the solution, but be aware of trade-offs (complexity, setup).\
    \ Seriously consider refactoring the SUT first.\n* **Third-Party Classes**: If\
    \ you don’t control the code, a thin wrapper class that you do control might be\
    \ your best bet. This lets you introduce an interface for testability.\n\n## 3.\
    \ The Case of the Overly-Helpful Mock\n\nMockito, by default, returns “sensible”\
    \ values even for unstubbed methods (empty collections, 0 for primitives, etc.).\
    \ Sometimes, this hides bugs!\n\n```java\nwhen(shippingServiceMock.calculateRates(any())).thenReturn(ratesList);\n\
    \n// What if getSupportedCountries() on a mock was NEVER stubbed?\n\nif(shippingServiceMock.getSupportedCountries().contains(\"\
    CA\"))  { ...  }\n```\n\n* **Solution 1**: `Mockito.RETURNS_DEEP_STUBS` – Mocks\
    \ behave more strictly\n* **Solution 2**: `verifyNoMoreInteractions(...)` – Ensuring\
    \ the mock is only used as you intended.\n\n## 4. Testing the Interaction, Not\
    \ Just the Outcome\n\nSuppose you’re less concerned with the return value and\
    \ more about a mock being used at all within an interaction.\n\n```java\n// Did\
    \ the service trigger the repository AT ALL to save?\n\nverify(productRepositoryMock,\
    \ times(1)).save(any(Product.class));\n```\n\n## 5. Best Practices for Complex\
    \ Stubbing\n\n* **Isolating the SUT**: The more complex your stubbing, the more\
    \ likely the SUT’s design has issues. Strive for easily testable units.\n* **Test\
    \ Intent**: Ask yourself, “What am I really testing here?” This guides your stubbing\
    \ strategy.\n* **Comments as a Last Resort**: If you find yourself needing complex\
    \ comments to explain your stubs, it’s a red flag!\n\n### Taming Stubbing Complexity\n\
    \nComplex stubbing is a symptom of a potentially bigger issue – tightly coupled\
    \ code. While Mockito is powerful, the best tests accompany well-designed, modular\
    \ code.\n\n### Next: Behavior-Driven Testing with Mockito\n\nLet’s explore how\
    \ Mockito integrates with a formal BDD approach to specify and test system behavior!\n\
    \n### Additional Resources\n\n* Design vs. Mocking Trade-offs: [https://martinfowler.com/articles/mocksArentStubs.html](https://martinfowler.com/articles/mocksArentStubs.html)\n\
    \nReady to wrestle with those stubborn mocking scenarios? \U0001F4AA\n\n# Embracing\
    \ BDD Style: Implementing Given-When-Then Approach – Part 1\n\nLet’s explore how\
    \ Mockito empowers you to write tests in a Behavior-Driven Development (BDD) style,\
    \ promoting readability and expressiveness that aligns with how we naturally think\
    \ about requirements!\n\n## 1. What is BDD (in the Testing World)?\n\n* **Focus\
    \ on Behavior**: Less about how the code works, more about what it accomplishes\
    \ from a user’s perspective.\n* **Collaboration**: Bridges the gap between technical\
    \ and non-technical stakeholders by using a shared language.\n* **Living Specifications**:\
    \ Tests become a clear description of features, not just a jumble of assertions.\n\
    \n## 2. The “Given-When-Then” Structure\n\nThe essence of BDD testing lies in\
    \ this pattern:\n\n* **Given**: The initial context or setup for the scenario.\
    \ (Think of this as your preconditions).\n* **When**: The action or trigger being\
    \ tested.\n* **Then**: The expected outcomes or observable results.\n\n### Example:\
    \ E-commerce Order Processing\n\n* *Given* the customer has items in their cart\n\
    * *When* they place an order\n* *Then* the order status is \"confirmed\"\n* *And*\
    \ an order confirmation email is sent\n\n## 3. Mockito + BDD\n\nWhile Mockito\
    \ supports basic BDD, let’s use `BDDMockito` for more:\n\n* `given(...).thenReturn(...)`\
    \ Reads like a natural sentence\n* `given(...).thenThrow()`, `willAnswer()`, etc.\
    \ for other stubbing\n\n### Code Example\n\n```java\n// Old style\nwhen(serviceMock.isStock(\"\
    123\")).thenReturn(true);\n\n// BDD style\ngiven(serviceMock.isStock(\"123\")).willReturn(true);\n\
    ```\n\n## 4. Benefits of BDD\n\n* **Readability**: Even non-programmers can grasp\
    \ the intent.\n* **Specification-Driven**: Test focuses on behavior.\n* **Mockito\
    \ Harmony**: Mockito’s focus on interactions blends perfectly.\n\n## 5. Considerations\n\
    \n* **Verbosity**: BDD tests can be longer, so strike a balance.\n* **Ideal Fit**:\
    \ Most beneficial for complex logic.\n* **It’s a Tool**: sometimes JUnit-style\
    \ asserts are enough.\n\n### Part 2: Putting BDD into Practice\n\nNext, we’ll\
    \ dive into a more complete example, learn how to manage setups.\n\n* BDMockito\
    \ on GitHub: [https://github.com/mockito/bddmockito](https://github.com/mockito/bddmockito)\n\
    * Introduction to BDD (General): [https://cucumber.io/docs/](https://cucumber.io/docs/)\n\
    \nAre you ready to transform your tests into clear specifications?\n\n# Enhancing\
