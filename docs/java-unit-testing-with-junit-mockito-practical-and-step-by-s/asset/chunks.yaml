  trans: "\n\n# 断言：验证预期行为与实际行为的语句。JUnit 提供了丰富的断言方法集。\n\n## 核心 JUnit 注解\n\n到为止，你已经看到了\
    \ `@Test`。让我们再介绍几个：\n\n- `@Disabled`: 临时跳过测试用例的执行。开发期间非常有用。\n- `@DisplayName`:\
    \ 为你的测试提供清晰、可读的名称，显示在测试报告中。\n\n### 使用 @DisplayName 的示例\n\n```java\n@Test\n@DisplayName(\"\
    两个正数相加\")\npublic void testAdd() {\n    // ... 其他测试代码 ...\n}\n```\n\n## 下一步工作\n\
    \n这是你进入 JUnit 世界的第一步！在下一部分中，我们将探索项目配置以获得流畅的测试体验，并深入研究更强大的断言方法。\n\n## 额外资源\n\n\
    - JUnit 5 用户指南：[`junit.org/junit5/docs/current/user-guide/`](https://junit.org/junit5/docs/current/user-guide/)\n\
    - Maven 入门：[`maven.apache.org/guides/getting-started/`](https://maven.apache.org/guides/getting-started/)\n\
    - Gradle 入门：[`docs.gradle.org/current/userguide/getting_started.html`](https://docs.gradle.org/current/userguide/getting_started.html)\n\
    \n# 配置 JUnit 以成功：第 2 部分\n\n在上一章中，我们开始为你的 JUnit 测试之旅奠定基础。现在，让我们精调 JUnit 设置，以简化测试工作流并解锁高级功能。\n\
    \n## 自定义测试执行\n\nJUnit 在运行测试方面提供了灵活性。以下是调整执行行为的方法：\n\n- **测试运行器 (Test Runners)**：JUnit\
    \ 使用运行器执行并报告结果。默认运行器适用于大多数场景。然而，JUnit 支持用于特殊用例的自定义运行器：\n    - `Parameterized`:\
    \ 用于运行参数化测试（本书后将介绍）\n    - `Suite`: 用于创建测试类集合\n- **测试排序**：默认情况下，测试执行的顺序是不可预测的。对于特定场景，你可以使用以下方式强制排序：\n\
    \    - `@Order` 注解：为每个测试方法分配一个整数来控制序列。\n    - `@FixMethodOrder` 注解：强制测试按照其方法名称（字母顺序）确定的特定顺序运行。请谨慎使用这些，因为顺序依赖通常意味着测试隔离性较差。\n\
    \n## 假设：条件下的测试\n\n假设（Assumptions）允许你在某些先决条件不时不跳过测试。这对于根据你的环境或特定状态过滤测试非常有用。\n\n\
    - `assumeTrue()` 和 `assumeFalse()`：如果提供的条件不满足，则使测试失败。\n\n```java\nimport static\
    \ org.junit.jupiter.api.Assumptions.assumeTrue;\n\n@Test\nvoid testOnLinuxEnvironment()\
    \ {\n    assumeTrue(System.getProperty(\"os.name\").equals(\"Linux\"));\n    //\
    \ 专门为 Linux 设计的测试逻辑\n}\n```\n\n## 管理测试超时\n\n偶尔测试可能会陷入无限循环或挂起。JUnit 的超时功能可以防止这种情况的发生：\n\
    \n- `@Timeout`: 为测试指定最大执行时间。如果超过该时间，测试将失败。\n\n```java\n@Test\n@Timeout(value=100,\
    \ unit=TimeUnit.MILLISECONDS)\nvoid testWithTimeout() {\n    // 应该在 100 毫秒内执行的测试逻辑\n\
    }\n```\n\n## 基础之外：实用的 JUnit 特性\n\n让我们探索一些少为人知但强大的 JUnit 能力：\n\n- **使用 @Tag 分组测试**：为你的测试分配自定义标签以进行选择性执行。例如，将慢测试标记为\
    \ `@Tag(\"integration\")` 并在单独的构建配置中运行它们。\n- **条件测试执行**：你可以使用 `@EnabledIf` 和 `@DisabledIf`\
    \ 配合自定义系统（例如检查环境变量）根据条件启用/禁用测试。\n- `@Nested`：创建嵌套测试类来结构化复杂的测试用例，或在单个类中对相关测试分组。这提高了了测试的可读性。\n\
    \n### 示例：条件执行与分组\n\n```java\n@Test\n@EnabledIf(\"isDevelopmentEnvironment\")\n\
    @Tag(\"integration\")\nvoid integrationTestOnDevelopment() {\n    // ... 集成测试逻辑\n\
    }\n\nprivate static boolean isDevelopmentEnvironment() {\n    return \"dev\".equals(System.getProperty(\"\
    env\"));\n}\n```\n\n## 与构建工具集成 (Maven 和 Gradle)\n\n构建工具无缝地将 JUnit 集成到你的项目生命周期中，允许你轻松运行测试。以下是典型的命令：\n\
    \n### Maven:\n\n- `mvn test`: 执行所有测试\n- `mvn test -Dtest=CalculatorTest`: 只执行\
    \ `CalculatorTest`\n- `mvn test -Dtest=CalculatorTest#testAdd`: 执行 `CalculatorTest`\
    \ 中的 `testAdd` 方法\n\n### Gradle:\n\n- `gradle test`: 执行所有测试\n- `gradle test --tests\
    \ CalculatorTest`: 只执行 `CalculatorTest`\n- `gradle test --tests CalculatorTest.testAdd`:\
    \ 执行 `CalculatorTest` 中的 `testAdd` 方法\n\n## 高级配置\n\n构建工具提供了高级选项来自定义测试报告、过滤等。请探索各自的文档以获取这些选项。\n\
    \n## 额外资源\n\n- JUnit 5 用户指南（条件执行、假设等）：[`junit.org/junit5/docs/current/user-guide/`](https://junit.org/junit5/docs/current/user-guide/)\n\
    - Maven Surefire 插件（测试配置）：[`maven.apache.org/surefire/maven-surefire-plugin/`](https://maven.apache.org/surefire/maven-surefire-plugin/)\n\
    - Gradle Test Task（测试配置）：[`docs.gradle.org/current/dsl/org.gradle.api.tasks.testing.Test.html`](https://docs.gradle.org/current/dsl/org.gradle.api.tasks.testing.Test.html)\n\
    \n让我们继续专注于强大的断言技术，不断增强你对 JUnit 的掌握！\n\n# 实现成功：绿色条条与断言相等性：第 1 部分\n\n将那些测试结果变成绿色是一次令人满意的体验！在本章中，我们将开始深入探索\
    \ JUnit 的断言方法。这些是验证你代码行为正确性的骨干，而掌握它们是编写有效的单元测试是基础。\n\n## 断言的重要性\n\n断言是单元测试的核心。它们表达了你对代码的预期。当其中一个断言失败时，它会精确地指出你的代码何时偏离了设计。\n\
    \n## JUnit 断言方法：基础\n\n让我们先概述 `org.junit.jupiter.api.Assertions` 提供的核心断言方法：\n\n\
    - `assertEquals(expected, actual)`：最基础的断言。验证两个对象是否相等。对于基本类型，这意味着直接值相等（例如 `5 ==\
    \ 5`）。对于对象，它通常使用对象的 `.equals()` 方法。\n- `assertNotEquals(unexpected, actual)`：`assertEquals`\
    \ 的相反，确保两个对象不相等。\n- `assertTrue(condition)`：断言布尔条件为 `true`。\n- `assertFalse(condition)`：断言布尔条件为\
    \ `false`。\n- `assertNull(object)`：断言给定对象为 `null`。\n- `assertNotNull(object)`：断言给定对象不为\
    \ `null`。\n\n## 示例：断言实践\n\n让我们回顾 `Calculator` 类并添加一些测试：\n\n```java\nimport org.junit.jupiter.api.Test;\n\
    import static org.junit.jupiter.api.Assertions.*;\n\npublic class CalculatorTest\
    \ {\n    private Calculator calculator = new Calculator();\n\n    @Test\n    void\
    \ testSubtract() {\n        assertEquals(3, calculator.subtract(5, 2));\n    }\n\
    \n    @Test\n    void testMultiply() {\n        assertEquals(10, calculator.multiply(5,\
    \ 2));\n    }\n\n    @Test\n    void testDivisionByZero() {\n        assertThrows(ArithmeticException.class,\
    \ () -> calculator.divide(5, 0));\n    }\n}\n```\n\n让我们拆解新的测试 `testDivisionByZero()`：\n\
    \n- `assertThrows`：专门为测试异常场景设计。在这里，我们预期除以零时会抛出 `ArithmeticException`。\n- Lambda\
    \ 表达式：代码 `() -> calculator.divide(5, 0)` 是一个 Lambda 表达式，提供了预期触发异常的可执行代码块。\n\n\
    ## 深度相等：基本类型 vs. 对象\n\n"
- fmt: "\nIt’s crucial to distinguish between how equality assertions work for primitive\
    \ types and objects:\n\n- Primitives: Values are compared directly. `assertEquals(7,\
    \ 7)` passes.\n- Objects: By default, JUnit checks if objects refer to the same\
    \ memory location (reference equality). Often, you’ll want to compare object content\
    \ (`equals()` method).\n\n### Example: Object Comparison\n\n```java\nPerson person1\
    \ = new Person(\"Alice\", 30);\nPerson person2 = new Person(\"Alice\", 30); //\
    \ Same name and age\n\n// This assertion likely FAILS (unless you have overridden\
    \ .equals in the Person class)\nassertEquals(person1, person2);\n```\n\n## Part\
    \ 2: More Assertions and Techniques\n\nIn the next part, we’ll expand our assertion\
    \ toolkit with more specialized methods, comparisons for floating-point numbers,\
    \ and techniques to make your assertions even more informative.\n\n### Additional\
    \ Resources\n\n- JUnit 5 Assertions API: [https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html](https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html)\n\
    - Java Objects and Equality: [https://www.geeksforgeeks.org/equals-hashcode-methods-java/](https://www.geeksforgeeks.org/equals-hashcode-methods-java/)\n\
    \n# Mastering Green Bars: Asserting Equality Techniques: Part 2\n\n## Beyond the\
    \ Basics\n\nLet’s explore more specialized assertions for greater precision in\
    \ your tests:\n\n- `assertArrayEquals(expectedArray, actualArray)`: Compares two\
    \ arrays for element-by-element equality. Order of elements matters.\n- `assertIterableEquals(expectedIterable,\
    \ actualIterable)`: Similar to `assertArrayEquals` but works on any `Iterable`\
    \ (Lists, Sets, etc.). Order of elements matters.\n- `assertLinesMatch(expectedLines,\
    \ actualLines)`: Allows comparison of multi-line text content (List of Strings),\
    \ helpful for file content verification.\n- `assertTimeout(duration, executable)`:\
    \ Ensures a code block executes within a specified time limit, preventing potential\
    \ hangs.\n- `assertTimeoutPreemptively(duration, executable)`: A stricter version\
    \ of `assertTimeout` where the test fails immediately if the timeout is exceeded,\
    \ even if the code block finishes later.\n\n### Example: Array and Iterable Assertions\n\
    \n```java\n@Test\nvoid testArrayEquality() {\n    int[] expected = {1, 5, 3};\n\
    \    int[] actual = calculator.sortNumbers(new int[] {3, 1, 5});\n    assertArrayEquals(expected,\
    \ actual);\n}\n\n@Test\nvoid testIterableEquality() {\n    List<String> expected\
    \ = Arrays.asList(\"Alice\", \"Bob\");\n    Set<String> actual = calculator.getUniqueNames();\n\
    \    assertIterableEquals(expected, actual); // Order doesn't matter in this case\n\
    }\n```\n\n### Floating-Point Precision\n\nComparing floating-point numbers (e.g.,\
    \ `double`, `float`) directly with `assertEquals` can be risky due to rounding\
    \ errors inherent in their representation. JUnit has a solution:\n\n- `assertEquals(double\
    \ expected, double actual, double delta)`: Asserts that two doubles are within\
    \ a specified tolerance (`delta`).\n\n#### Example: Floating-Point Comparison\n\
    \n```java\n@Test\nvoid testApproximateCalculation() {\n    double result = calculator.calculateFormula(0.1);\n\
    \    assertEquals(0.333, result, 0.001); // Tolerance of 0.001\n}\n```\n\n###\
    \ Custom Failure Messages\n\nAll assertion methods have an overloaded version\
    \ taking an additional `String` parameter as the first argument. This `String`\
    \ serves as a custom failure message, providing more context when a test fails.\n\
    \n#### Example: Custom Failure Message\n\n```java\n@Test\nvoid testInvalidLogin()\
    \ {\n    String username = \"wrongUser\";\n    String password = \"badpassword\"\
    ;\n    assertFalse(authService.login(username, password), \"Login should have\
    \ failed with invalid credentials\");\n}\n```\n\n### Best Practices with Assertions\n\
    \n- **One Assertion per Test (Ideally)**: Avoid overly complex tests with multiple\
    \ assertions. Strive for one primary assertion per test case. This improves failure\
    \ isolation and makes results more informative.\n- **Descriptive Messages**: Use\
    \ custom messages to make failed tests easier to understand.\n- **Test Helper\
    \ Methods**: If you have complex assertion logic, package it into reusable helper\
    \ methods or create custom assertion classes for cleaner test cases.\n\n### TDD\
    \ with Assertions\n\nRemember, Test-Driven Development (TDD) encourages you to\
    \ write your assertions first. Thinking about what you expect your code to produce\
    \ before you write it leads to a more focused design.\n\n#### Example: TDD Approach\
    \ for Factorial Method\n\n1. **Write the Test**:\n```java\n@Test\nvoid testFactorial()\
    \ {\n    assertEquals(120, factorialCalculator.calculate(5));\n}\n```\n\n2. **Write\
    \ the Simplest Implementation (Even if it fails)**:\n```java\npublic class FactorialCalculator\
    \ {\n    public int calculate(int n) {\n        return 1; // Initially fails the\
    \ test\n    }\n}\n```\n\n3. **Iterate and Make the Test Pass!\n\n## Next Up: Structurally\
    \ Sound Tests\n\nIn the coming chapter, we’ll discuss how to refactor your tests\
    \ for better maintainability and long-term success.\n\n### Additional Resources\n\
    \n- JUnit 5 Assertions API (see overloaded methods): [https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html](https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html)\n\
    - Test Driven Development (TDD): [https://en.wikipedia.org/wiki/Test-driven_development](https://en.wikipedia.org/wiki/Test-driven_development)\n\
    \n# Crafting Resilient Tests: Refining Your JUnit Suite: Part 1\n\nYour tests\
    \ aren’t just about green bars today. They need to remain trustworthy as your\
    \ project evolves. A fragile test suite that breaks frequently due to unrelated\
    \ code changes undermines the very confidence it’s supposed to provide. Let’s\
    \ start building robustness into your tests.\n\n## Principles for Resilient Tests\n\
    \nLet’s keep a few guiding principles in mind when structuring tests:\n\n- **Isolation**:\
    \ A good unit test focuses solely on the unit under test, minimizing dependencies\
    \ on other components. This makes failures easier to pinpoint and less likely\
    \ to cascade through your test suite.\n- **Maintainability**: Tests are code,\
    \ too! Readable, well-structured tests are easier to update when your production\
    \ code changes, saving valuable time.\n- **Readability**: Tests serve as living\
    \ documentation. Clear test names and structure make them valuable for understanding\
    \ how your code should work.\n- **Repeatability**: A test should produce the same\
    \ results each time if nothing it depends on has changed. Flakiness destroys trust\
    \ in your tests.\n\n## Common Causes of Fragile Tests\n\nLet’s dissect some common\
    \ problems that make tests unstable:\n\n- **Overly Specific Assertions**: When\
    \ your assertions are coupled to the precise internal workings of your code, any\
    \ implementation change, even a harmless refactoring, can lead to failing tests.\n\
    - **Hidden External Dependencies**: Tests relying on things like the current date,\
    \ system properties, file system state, or network calls introduce variability,\
    \ breaking repeatability.\n- **Test Case Overlap**: Tests with significant overlap\
    \ can lead to cascading failures. A single bug can cause multiple tests to break,\
    \ obscuring the true problem source.\n- **Poor Test Data Management**: Inconsistent\
    \ or shared test data can lead to unpredictable outcomes and race conditions.\n\
    \n## Refactoring for Resilience\n\nRefactoring is not just for your production\
    \ code; it’s essential for your tests, too. Here’s how to focus your refactoring\
    \ efforts:\n\n1. **Target Pain Points**: Start with tests that break frequently\
    \ or are notoriously difficult to update. These are hotspots for fragility.\n\
    2. **Improve Isolation**: Seek out hidden dependencies. Could you replace a real\
    \ database dependency with an in-memory alternative for your test? This will lead\
    \ to faster and more reliable tests.\n3. **Decouple Assertions from Implementation**:\
    \ Focus your assertions on the behaviors or outputs of your code, not the intermediate\
    \ steps involved in producing them.\n\n4. **Test Structure**:\n"
