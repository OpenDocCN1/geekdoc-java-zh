  trans: "\n\n请记住，Mockito 在设计上无法直接操作静态方法。这是很有道理的，因为过度使用静态方法通常预示着设计的可测试性较低。然而，现实情况往往是骨感的：\n\
    \n- **遗留代码**：你正在处理一个高度依赖散落在各处的静态方法的代码库。\n- **工具类**：你需要控制充斥静态辅助方法的类（如 `FileUtils`、`StringUtils`\
    \ 等）中的行为。\n- **外部库**：你正在处理第三方库，其中不理想的行为位于静态方法内部。\n\n## 2. 引入 PowerMock：打破规则\n\n\
    PowerMock 与 Mockito 结合，让你能够：\n\n- **Mock 静态方法**：为了打桩目的，可以将静态方法像实例方法一样对待（`PowerMockito.mockStatic()`）。\n\
    - **验证调用**：在静态方法上使用 Mockito 的 `verify()` 来检查它们是否按预期被调用。\n\n## 3. 示例：驯服一个棘手的工具类\n\
    \n让我们假设这个工具类正让我们非常头疼：\n\n```java\npublic class FileUtils {\n    public static\
    \ boolean deleteFile(String path) {\n        File file = new File(path);\n   \
    \     return file.delete();\n    }\n}\n```\n\n**测试场景**：你想测试使用了 `FileUtils.deleteFile()`\
    \ 的代码，但不想在测试期间实际删除文件。\n\n**PowerMock 的实战：**\n\n```java\n@RunWith(PowerMockRunner.class)\n\
    @PrepareForTest(FileUtils.class)\npublic class OrderServiceTest {\n    @Test\n\
    \    public void processOrder_FileDeletionControlled() {\n        PowerMockito.mockStatic(FileUtils.class);\n\
    \        PowerMockito.doReturn(true).when(FileUtils.class); // 注意：这里没有参数匹配器\n\
    \        FileUtils.deleteFile(anyString());\n        // 现在，调用 FileUtils.deleteFile()\
    \ 的代码将不会实际删除\n    }\n}\n```\n\n## 4. 关键点\n\n- **`@PrepareForTest`**：不要忘记这个！告诉\
    \ PowerMock 哪些类包含你目标的静态方法。\n- **`PowerMockito.mockStatic()`**：标记该类以便进行静态方法 Mock。\n\
    - **`when()` 语法**：看起来很熟悉，但由于没有对象实例，你直接在 `when()` 之后引用类。\n\n### 重要：权衡利弊！\n\nMock\
    \ 静态方法虽然强大，但可能导致：\n\n- **测试与实现紧耦合**：如果你更改了 `FileUtils` 的内部工作方式，即使其外部行为正确，你的测试可能会崩溃。\n\
    - **增加重构难度**：静态方法以难以重构而闻名。这类测试会让重构变得更加困难。\n\n---\n\n## 第 2 部分：更多细节、验证与最佳实践\n\n\
    接下来，我们将学习如何验证静态方法的调用，探索部分静态 Mock，并讨论何时该明智地使用这种力量。\n\n### 额外资源\n\n- **PowerMock\
    \ 静态 Mock 使用**：[`github.com/powermock/powermock`](https://github.com/powermock/powermock)\n\
    \n**记住**：能力越大，责任越大。在深度依赖 PowerMock 之前，请务必考虑设计的替代方案！\n\n# 掌握静态方法 Mock 技术 – 第 2\
    \ 部分\n\n让我们深入研究如何使用 PowerMock 弯曲静态方法以满足测试意愿。\n\n## 1. 验证静态方法调用\n\n就像 Mockito 的\
    \ `verify()` 对实例方法非常强大一样，我们也可以检查静态交互：\n\n```java\n@Test\npublic void fileDeletion_callsSystemLog()\
    \ {\n    // ... 按照之前的方式设置...\n    processOrder(); // 调用内部使用 FileUtils.deleteFile()\
    \ 的方法\n    PowerMockito.verifyStatic(SystemLogger.class);\n    SystemLogger.logMessage(\"\
    File deleted\");\n}\n```\n\n- **`PowerMockito.verifyStatic()`**：静态方法的 `verify()`\
    \ 对应项。我们传入包含静态方法的类。\n\n## 2. 静态类的部分 Mock\n\n有时你可能只想 Mock 一个类中的某些静态方法，而让其他方法正常运行：\n\
    \n```java\n@PrepareForTest(FileUtils.class)\npublic class FileServiceTest {\n\
    \    @Test\n    public void something() {\n        PowerMockito.spy(FileUtils.class);\
    \ // 将其转换为部分 Mock\n        PowerMockito.when(FileUtils.calculateFileSize(anyString())).thenReturn(1024L);\n\
    \        // FileUtils.deleteFile() 仍然具有其真实的行为！\n    }\n}\n```\n\n- **`PowerMockito.spy()`**：创建指定类的部分\
    \ Mock。\n\n## 3. 最佳实践与注意事项\n\n- **测试交互而非内部实现**：重点关注验证你的被测系统是否以预期的方式与静态方法交互。\n\
    - **参数**：根据需要使用 Mockito 的 `any()`、`eq()`。\n- **返回值**：使用 `doReturn(...).when(...)`\
    \ 进行打桩。\n\n## 4. 常见陷阱\n\n- **过度 Mock**：如果你发现自己在 Mock 极数量的方法，请重新审视你的设计。\n- **忘记\
    \ `@PrepareForTest`**：没有它，PowerMock 将无法施展魔法。\n- **复杂性**：静态 Mock 通常会让测试变得更加脆弱。\n\
    \n### 示例：驯服一个棘手的工具类\n\n假设你有一个 `Time` 类。PowerMock 允许你控制 `getCurrentTime()` 以实现确定性。\n\
    \n- **可测试性**：考虑是否可以注入一个非全局的来源代替。\n\n---\n\n# 静态 Mock 高级策略 – 第 3 部分\n\n让我们进入高级领域。这些技术非常强大，但伴随着额外的副作用！\n\
    \n## 1. Mock 系统类\n\n考虑 `System.currentTimeMillis()`、`Math.random()` 等。PowerMock\
    \ 允许你篡改标准库。\n\n**示例：稳定随机性**\n\n```java\n@RunWith(PowerMockRunner.class)\n@PrepareForTest(Math.class)\n\
    public class LotteryTest {\n    @Test\n    public void luckyDraw_alwaysWins()\
    \ {\n        PowerMockito.mockStatic(Math.class);\n        PowerMockito.when(Math.random()).thenReturn(0.9999);\n\
    \        LotteryService lotteryService = new LotteryService();\n        Assert.assertTrue(lotteryService.draw());\n\
    \    }\n}\n```\n\n**重要**：\n- Mock 核心系统类可能会对其他测试产生意外的连锁反应。请极其谨慎地使用。\n- 考虑是否有其他注入的方式。\n\
    \n## 2. 抑制方法\n\n有时，你想阻止某些静态方法的执行。例如，日志框架可能会干扰测试输出：\n\n```java\n@PrepareForTest(LogManager.class)\n\
    public class MyClassTest {\n    @Test\n    public void testSomething() {\n   \
    \     PowerMockito.suppress(PowerMockito.method(LogManager.class, \"getLogger\"\
    ));\n        // 现在，调用 LogManager.getLogger() 将实际上无所作为\n    }\n}\n```\n\n## 3.\
    \ Mock Final 类中的 Final 方法\n\nPowerMock 真正弯曲了 Java 的常规规则：\n\n- **警告**：并非所有 PowerMock\
    \ 之上的 Mock 框架都支持此，而且可能取决于 JVM 版本。\n\n```java\n@PrepareForTest(MyFinalClass.class)\n\
    public class ... {\n    @Test\n    public void testMockingFinalMethod() {\n  \
    \      PowerMockito.mockStatic(MyFinalClass.class);\n        PowerMockito.when(MyFinalClass.someFinalStaticMethod()).thenReturn(\"\
    hello\");\n        // ...\n    }\n}\n```\n\n"
- fmt: "\nMocking system classes, suppressing methods, and mocking final things deeply\
    \ ties your tests to the exact implementation. Even minor changes in these areas\
    \ will likely break your tests. Only resort to this level of control if absolutely\
    \ necessary.\n\n## 4. Best Practices (Beyond the Usual)\n\n- **Isolation**: If\
    \ possible, run tests heavily using `PowerMock` in a separate suite to avoid unexpected\
    \ side effects on other tests.\n- **Documentation**: Leave clear comments in your\
    \ `PowerMock` tests explaining why you’re using these extraordinary techniques.\n\
    - **Refactor Often**: Continuously evaluate if your design can evolve to avoid\
    \ needing `PowerMock` as much. A well-structured codebase might eliminate the\
    \ reason to use it in the first place!\n\n### Additional Resources:\n\n- **Suppressing\
    \ Methods**: [https://github.com/powermock/powermock](https://github.com/powermock/powermock)\n\
    \n## The Big Takeaway:\n\n- `PowerMock` is like a potent medicine: use in small\
    \ doses for targeted treatment, not as a daily vitamin. Overreliance will hurt\
    \ your code’s long-term health.\n- Always consider alternatives like dependency\
    \ injection or refactoring to reduce the need for such heavy-handed mocking.\n\
    \n**Next Up**: Tampering with Java’s internals – mocking private methods!\n\n\
    # Exploring the Realm of Private Method Invocation – Part 1\n\nLet’s venture into\
    \ the mysterious world of testing those hidden private methods. Remember, this\
    \ is truly bending the rules of encapsulation, so proceed with great caution!\n\
    \n### 1. Why Reach into the Private Realm?\n\nNormally, unit tests focus on public\
    \ behavior. Private methods are considered implementation details. However, there\
    \ are times you might find cause to test them:\n\n- **Legacy Code**: When dealing\
    \ with complex private methods lacking their own tests, and refactoring is too\
    \ risky at the moment.\n- **Indirect Effects**: A private method has logic whose\
    \ results are significant, even if not directly exposed by a public API.\n- **Algorithm\
    \ Isolation**: You want to test a specific algorithm that happens to be encapsulated\
    \ within a private method.\n\n### 2. PowerMock to the Rescue (or Regret?)\n\n\
    Let’s see the mechanics:\n\n```java\nclass OrderService {\n    private String\
    \ generateTrackingId() {\n        // ... complex generation logic ...\n    }\n\
    \n    public void processOrder() {\n        String trackingId = generateTrackingId();\n\
    \        // ...\n    }\n}\n\n@RunWith(PowerMockRunner.class)\n@PrepareForTest(OrderService.class)\n\
    public class OrderServiceTest {\n    @Test\n    public void generateTrackingId_HasValidFormat()\
    \ throws Exception {\n        OrderService orderService = new OrderService();\
    \ // Real object\n        PowerMockito.when(orderService, \"generateTrackingId\"\
    ).thenReturn(\"TEST1234\");\n    }\n}\n```\n\n#### Explanation\n\n- `PowerMockito.when(...).then(...)`:\
    \ Now targets a private method using a string for the method name.\n- **Reflection\
    \ Under the Hood**: `PowerMock` uses reflection to forcibly access and manipulate\
    \ your class’s private parts.\n\n### 3. The Grand Trade-off\n\n- **Testing Internals**:\
    \ You gain the ability to verify or stub behavior that’s normally inaccessible.\n\
    - **Brittle Tests**: Any change to the private method’s name, arguments, or internal\
    \ logic is likely to break your test even if the external functionality remains\
    \ the same.\n\n### 4. Cautions and Best Practices\n\n- **Refactor First, Ask Questions\
    \ Later**: Is there truly no way to reasonably structure your code for testability\
    \ without resorting to private method testing?\n- **Conceptual Tests**: Instead\
    \ of aiming at the step-by-step behavior of a private method, focus on its output\
    \ or side effects within the context of your public methods.\n- **Comments as\
    \ Life Support**: If you MUST do this, provide extensive justification in comments\
    \ within your test.\n\n### Additional Resources:\n\n- **Private Method Mocking**:\
    \ [https://github.com/powermock/powermock](https://github.com/powermock/powermock)\n\
    \n**Important**: `PowerMock`, while a fascinating tool, gives you the proverbial\
    \ rope…. Be very mindful of the maintainability implications!\n\n**Part 2: More\
    \ Techniques, Spies, and the Ever-Important “Why?”**\n\nNext, we’ll look at advanced\
    \ scenarios for private method manipulation and how using spies can sometimes\
    \ offer a less intrusive alternative.\n\n# Delving Deeper into Private Method\
    \ Invocation Techniques – Part 2\n\nLet’s continue our journey into testing the\
    \ untestable with `PowerMock`. Get ready for even more intricate ways to control\
    \ your private methods.\n\n### 1. Partial Mocking with Spies\n\nRecall spies from\
    \ `Mockito`? It turns out, they have a role to play in private method testing:\n\
    \n```java\nclass OrderService {\n    private String generateShipmentLabel() {\
    \ /* ... */ }\n\n    public void shipOrder() {\n        String label = generateShipmentLabel();\n\
    \        // ...\n    }\n}\n\n@RunWith(PowerMockRunner.class)\n@PrepareForTest(OrderService.class)\n\
    public class OrderServiceTest {\n    @Test\n    public void generateTrackingId_HasValidFormat()\
    \ throws Exception {\n        OrderService orderService = PowerMockito.spy(new\
    \ OrderService());\n        PowerMockito.doReturn(\"Label\").when(orderService).generateShipmentLabel();\n\
    \        orderService.shipOrder();\n    }\n}\n```\n\n### 2. PowerMock Whitebox\n\
    \nPowerMock offers a utility class named `Whitebox` for even more manipulation:\n\
    \n```java\nclass MyClass {\n    private int calculateInternally() { /* ... */\
    \ }\n}\n\n@Test\npublic void testSomething() throws Exception {\n    MyClass myClass\
    \ = new MyClass();\n    int result = Whitebox.invokeMethod(myClass, \"calculateInternally\"\
    );\n    assertEquals(42, result);\n}\n```\n\n### 3. When to Use What?\n\n- **Simple\
    \ Stubbing**: If you just need to replace the output of a private method during\
    \ the execution of a public method, `PowerMockito.when(...).then(...)` might suffice.\n\
    - **Verification**: Spies are great when you want to ensure your private method\
    \ was called (or called with the right parameters) as part of a process.\n- **Raw\
    \ Power**: `Whitebox` is for when you need to either invoke or set the values\
    \ of private fields without any formalities.\n\n### 4. Best Practices (The Usual,\
    \ but Louder!)\n\n- **Exhaustive Documentation**: Testing private methods this\
    \ way requires crystal-clear explanations of the reasoning within your tests.\
    \ Why are you doing this?\n- **Test the What, Not the How**: Whenever possible,\
    \ focus your test assertions on the observable outputs or side effects of public\
    \ methods, even if those results were influenced by a private one.\n\n## The Elephant\
    \ in the Room: Design\n\nThese techniques shine an uncomfortable spotlight on\
    \ your code’s design. If you find yourself needing them frequently, it’s an almost\
    \ guaranteed sign of either:\n\n- **Excessive Internal Complexity**: Your classes\
    \ might be trying to do too much.\n- **Testability as an Afterthought**: Consider\
    \ ways to expose outcomes of internal logic in a way that’s testable without breaking\
    \ encapsulation so heavily.\n\n### Additional Resources\n\n- **PowerMock’s Whitebox**:\
    \ [https://www.baeldung.com/powermock](https://www.baeldung.com/powermock)\n"
