  trans: "\n\n```java\nInventoryService inventoryServiceMock = Mockito.mock(InventoryService.class);\n\
    \nwhen(inventoryServiceMock.isProductInStock(\"12345\")).thenReturn(true);\n\n\
    // Now, during testing, calling 'inventoryServiceMock.isProductInStock(\"12345\"\
    )'\n// will ALWAYS return 'true'.\n```\n\n### 3. 桩方法的变体\n\n让我们扩展我们的桩工具箱：\n\n-\
    \ **返回不同的值**：根据输入参数条件地进行响应。\n- **抛出异常**：`when(...).thenThrow(new SomeException())`。测试被测试对象（SUT）的错误处理能力。\n\
    - **空方法**：对没有返回值的方法建模：\n\n```java\nMockito.doNothing().when(emailServiceMock).sendConfirmationEmail(...);\n\
    ```\n（我们将在“验证”章节中详细介绍这一点）。\n\n#### 示例：税务计算\n\n```java\nTaxCalculator taxCalculatorMock\
    \ = Mockito.mock(TaxCalculator.class);\n\nwhen(taxCalculatorMock.calculateTax(any(Order.class))).thenReturn(10.0);\n\
    ```\n\n### 4. 最佳实践\n\n- **保持桩方法聚焦**：每个桩方法都旨在为测试设置一个特定的场景。\n- **从简单开始**：从简单的返回值开始，根据需要逐渐增加复杂性。\n\
    - **有意义的命名**：你的测试名称和桩值应该引导他人（以及你未来的自己！）理解测试的意图。\n\n### 5. 关于参数匹配器的说明\n\n在上一个示例中，我们使用了\
    \ `any(Order.class)`。Mockito 提供了强大的参数匹配器（Argument Matchers）来实现灵活的桩——我们将专门用一个章节来介绍它们！\n\
    \n#### 额外资源\n\n- **Mockito 文档（Stubbing）**：[`javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html#stubbing`](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html#stubbing)\n\
    \n# 精通桩技术 – 第 2 部分\n\n让我们在桩的基础上探索更细微的场景。\n\n### 1. 针对多个结果的桩\n\n有时，单个桩方法是不够的。你可能需要\
    \ mock 对象按顺序返回不同的内容：\n\n```java\nwhen(inventoryServiceMock.isProductInStock(\"\
    12345\"))\n    .thenReturn(true)\n    .thenReturn(false); // 后续调用将返回 false\n```\n\
    \n- **用例**：模拟库存耗尽、外部服务的间性错误等。\n\n### 2. 连续调用的桩（进阶）\n\n为了对连续调用进行细粒度控制，Mockito 提供了额外的技术：\n\
    \n- `thenAnswer(...)`：使用 Java Lambda 表达式定义自定义行为。这允许根据调用次数、参数等进行动态响应。\n- `thenThrow(...)`\
    \ 后紧跟 `thenReturn(...)`：模拟一个错误发生后的成功恢复。\n\n#### 示例：复杂计算\n\n```java\nwhen(complexServiceMock.performCalculation(anyInt()))\n\
    \    .thenAnswer(invocation -> {\n        int arg = invocation.getArgument(0);\n\
    \        if (arg < 0) {\n            throw new IllegalArgumentException();\n \
    \       }\n        return arg * 2;\n    });\n```\n\n### 3. 桩化交互\n\n假设我们的 `OrderProcessingService`\
    \ 在处理成功后发送电子邮件收据。以下是桩化并稍后验证这种交互的方法（我们很快会深入介绍验证）：\n\n```java\nEmailService emailServiceMock\
    \ = Mockito.mock(EmailService.class);\n\ndoNothing().when(emailServiceMock).sendOrderConfirmation(any(Order.class));\n\
    \n// 在你的测试中，执行 OrderProcessingService 后：\nMockito.verify(emailServiceMock).sendOrderConfirmation(any(Order.class));\n\
    ```\n\n**关键点：**\n\n- `doNothing()`：用于不返回值的 void 方法。\n- `verify(...)`：Mockito 检查对\
    \ mock 对象的预期调用是否真实发生的方法。\n\n### 4. 使用 `thenCallRealMethod()` 的部分桩\n\n有时，你想要方法的大部分行为，但需要调整其中一个方面：\n\
    \n```java\nProductService realProductService = new ProductService(); // 真实实现\n\
    ProductService productServiceMock = Mockito.spy(realProductService);\n\nwhen(productServiceMock.calculateFinalPrice(any())).thenCallRealMethod();\n\
    ```\n\n- `Mockito.spy(...)`：创建一个部分 mock（partial mock）。默认情况下，调用将指向真实实现。\n- `thenCallRealMethod()`：选择性地覆盖行为。\n\
    \n### 5. 注意事项与警告\n\n- **过度桩化（Over-Stubbing）**：测试可能会镜像实现，导致变得脆弱。请保持平衡！\n- **测试意图**：桩应该清楚地服务于测试目的，而不仅仅复制\
    \ SUT 的编码方式。\n- **可读性**：复杂的桩会让测试更难以理解。注释和清晰的结构是关键。\n\n#### 额外资源\n\n- **Mockito\
    \ thenAnswer**：[`javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html#thenAnswer(org.mockito.stubbing.Answer)`](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html#thenAnswer(org.mockito.stubbing.Answer))\n\
    \n---\n*(注：输入文本的后续部分似乎是上述内容的重复草稿/大纲，已按要求进行清理和格式化)*\n\n## 开启 Mockito 之旅：第一步\n\n\
    ### 1. 基础场景\n\n让我们想象一个简单的 `ShoppingCart`。我们想要测试它的 `addItem()` 方法。\n\n```java\n\
    InventoryService inventoryServiceMock = Mockito.mock(InventoryService.class);\n\
    \nwhen(inventoryServiceMock.isProductInStock(\"12345\")).thenReturn(true);\n\n\
    // 现在，在测试期间，调用 'inventoryServiceMock.isProductInStock(\"12345\")'\n// 将始终返回 'true'.\n\
    ```\n\n### 2. 桩方法的变体\n\n让我们扩展我们的桩工具箱：\n\n- **返回不同的值**：根据输入参数条件地进行响应。\n- **抛出异常**：`when(...).thenThrow(new\
    \ SomeException())`。测试被测试对象（SUT）的错误处理能力。\n- **空方法**：对没有返回值的方法建模：\n\n```java\n\
    Mockito.doNothing().when(emailServiceMock).sendConfirmationEmail(...);\n```\n\
    （我们将在“验证”章节中详细介绍这一点）。\n\n#### 示例：税务计算\n\n```java\nTaxCalculator taxCalculatorMock\
    \ = Mockito.mock(TaxCalculator.class);\n\nwhen(taxCalculatorMock.calculateTax(any(Order.class))).thenReturn(10.0);\n\
    ```\n\n### 3. 最佳实践\n\n- **保持桩方法聚焦**：每个桩方法都旨在为测试设置一个特定的场景。\n- **从简单开始**：从简单的返回值开始，根据需要逐渐增加复杂性。\n\
    - **有意义的命名**：你的测试名称和桩值应该引导他人（以及你未来的自己！）理解测试的意图。\n\n### 4. 关于参数匹配器的说明\n\n在上一个示例中，我们使用了\
    \ `any(Order.class)`。Mockito 提供了强大的参数匹配器（Argument Matchers）来实现灵活的桩——我们将专门用一个章节来介绍它们！\n\
    \n"
- fmt: "\n```java\n // ... (mock setup as before) ...\n\n shoppingCart.addItem(\"\
    123\", 2);\n\n // Assertions - let's get detailed!\n\n // (We should check if\
    \ the repository's method was called with the right arguments...)\n\nverify(productRepositoryMock).findById(\"\
    123\");\n\n // ... and ideally, assert something about what gets added to the\
    \ cart.\n\n // (We'll need Mockito to help here!)\n}\n```\n\n## 2. Introducing\
    \ Argument Capturing\n\nHow do we actually check the contents of what was (presumably)\
    \ added to the (presumably) internal cart within our `ShoppingCart`?\n\n- `ArgumentCaptor`:\
    \ A Mockito class designed to capture arguments passed to mocks.\n\n```java\n\
    import static org.mockito.ArgumentMatchers.anyInt; // We'll learn about this soon\n\
    \n@Test\nvoid addItem_withValidProduct() {\n   // ... setup ...\n   shoppingCart.addItem(\"\
    123\", 2);\n\n   // ArgumentCaptor!\n   ArgumentCaptor<Product> productCaptor\
    \ = ArgumentCaptor.forClass(Product.class);\n   ArgumentCaptor<Integer> quantityCaptor\
    \ = ArgumentCaptor.forClass(Integer.class);\n\n   // Capture what happens on a\
    \ mock call (assuming the cart uses some 'add' method)\n   verify(shoppingCart).add(productCaptor.capture(),\
    \ quantityCaptor.capture());\n\n   // Assertions using captured values\n   assertEquals(\"\
    123\", productCaptor.getValue().getId());\n   assertEquals(2, quantityCaptor.getValue());\n\
    }\n```\n\n## 3. Matchers: Flexible Stubbing and Assertions\n\nNote the use of\
    \ `anyInt()` above. Matchers let us be specific or flexible when needed:\n\n-\
    \ `anyInt()`, `anyString()`, etc.: Matches any value of that type.\n- `eq(...)`:\
    \ Matches an exact value (like JUnit’s own `assertEquals`).\n- More: You can match\
    \ on regex, custom rules, and more!\n\n### Example: Tax Calculation (Matchers)\n\
    \n```java\nwhen(taxServiceMock.calculateTax(any(Order.class))).thenReturn(8.0);\n\
    ```\n\n## 4. Best Practices\n\n- Targeted Captures: Only capture arguments you\
    \ truly need for assertions.\n- Matcher Finesse: Use matchers to strike the balance\
    \ between test strictness and avoiding brittleness.\n- Don’t Forget ‘verify’:\
    \ Capturing is often paired with `verify` to ensure methods were actually called.\n\
    \n## 5. Evolving Our Test\n\nOur `ShoppingCartTest` is shaping up! We’re now checking\
    \ the behavior of the code and the results that the mock collaborator is involved\
    \ in.\n\n### Additional Resources\n\n- Mockito ArgumentCaptor: [https://www.baeldung.com/mockito-argumentcaptor](https://www.baeldung.com/mockito-argumentcaptor)\n\
    - Mockito Argument Matchers: [https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html)\n\
    \n# Advancing with Mockito – Part 3\n\nLet’s take your Mockito skills up a notch.\
    \ In this chapter, we’ll cover some intermediate and advanced techniques to make\
    \ your tests more robust and maintainable.\n\n## 1. Mastering Verification\n\n\
    In previous chapters, we used `verify()` to ensure mocks were called. Let’s go\
    \ deeper:\n\n- Verification Times:\n  - `times(n)`: The method should be called\
    \ ‘n’ times.\n  - `atLeastOnce()`, `atMost(n)`: Set flexible boundaries.\n  -\
    \ `never()`: Ensure a method was not called.\n- Call Order: Use `InOrder` for\
    \ scenarios where the sequence of calls matters:\n\n```java\nInOrder inOrder =\
    \ inOrder(mock1, mock2);\ninOrder.verify(mock1).doSomething();\ninOrder.verify(mock2).doSomethingElse();\n\
    ```\n\n### Example: Login Attempts\n\nImagine a security-minded component that\
    \ limits login retries. Your tests might have verifications like:\n\n```java\n\
    verify(loginService, times(3)).processLogin(anyString(), anyString());\nverify(notificationService).sendAccountLockedEmail(anyString());\n\
    ```\n\n## 2. Resetting Mocks\n\nSometimes, you need a fresh start within a test:\n\
    \n```java\nMockito.reset(mock1, mock2, ...); // Resets stubbing and call counts\n\
    ```\n\n- Use Cases:\n  - When a single test method exercises the SUT multiple\
    \ times with varying conditions.\n- Caution: Use judiciously. Resetting can hide\
    \ issues if you rely on it too heavily.\n\n## 3. Customizing Stubbing with Answer\n\
    \n`when(...).thenAnswer(...)` gives you immense control for complex stubbing:\n\
    \n```java\nwhen(inventoryServiceMock.isProductInStock(anyString()))\n    .thenAnswer(invocation\
    \ -> {\n        String productId = invocation.getArgument(0);\n        return\
    \ productId.startsWith(\"A\"); // Example\n    });\n```\n\n## 4. Customizing Stubbing\
