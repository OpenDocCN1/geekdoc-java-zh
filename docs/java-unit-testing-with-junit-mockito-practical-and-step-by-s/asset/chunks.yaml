  trans: "\n\n| 你需要大多数真实行为，但希望选择性地覆盖或验证 | 你想隔离某些方法，或者你想要完全控制以检查与真实对象的交互。 | 你完全不在乎真实的实现。\
    \ |\n| :--- | :--- | :--- |\n| 对紧耦合的遗留代码进行测试 | 你可以对协作方进行监控（spy），以测试单个单元（尽管重构通常是长期的目标）。\
    \ | 你想完全隔离被测试的单元。 |\n| 你想存桩（stub）复杂的依赖 | 你想关注组件大部分逻辑的真实行为。 | 依赖项缓慢的、外部的，或其设置非常复杂。\
    \ |\n\n## 4. 注意事项\n\n- **过度使用的风险**：不要掉入一切都使用 spy 的陷阱，这会削弱测试的价值。\n- **隐藏的复杂性**：如果真实行为与模拟行为之间的平衡不清晰，Spy\
    \ 会让测试更难以理解。\n\n始终记住：你的测试目标应该驱动你的工具选择！\n\n## 下一节：PowerMock\n\n准备好打破 Mock 的常规边界了吗？让我们学习如何使用\
    \ PowerMock 来模拟静态方法、构造函数等内容！\n\n## 第 5 部分：使用 PowerMock 和 Mockito 释放高级测试技术\n\n\
    # 初始设置：将 PowerMock 集成到你的被测试系统 – 部分 1\n\n让我们开启 PowerMock 之之旅。警告：我们正在进入一个标准 Java\
    \ 限制开始弯的领域，请明智地使用这些力量！\n\n### 1. 为什么选择 PowerMock？当常规手段不足时\n\n回顾单元测试的常规规则：\n\n\
    - **隔离单元**：一次关注一个类。\n- **Mock 依赖**：控制外部协作方。\n\n当你面临障碍时，PowerMock 会介入：\n\n- **静态方法**：你的代码设计严重依赖静态方法（通常出现在遗留系统或工具类中）。\n\
    - **构造函数**：你需要控制被测试系统内部对象的创建过程。\n- **私有方法**：你的测试需要进入类的私有内部实现。\n\n### 2.向项目添加 PowerMock\n\
    \n#### 依赖项 (Maven)\n\n将这些内容添加到你的 `pom.xml` 中：\n\n- **PowerMock JUnit Runner**：\n\
    ```xml\n<dependency>\n  <groupId>org.powermock</groupId>\n  <artifactId>powermock-module-junit4</artifactId>\n\
    \  <version>LATEST_VERSION</version>\n  <scope>test</scope>\n</dependency>\n```\n\
    \n- **PowerMock Mockito API**：\n```xml\n<dependency>\n  <groupId>org.powermock</groupId>\n\
    \  <artifactId>powermock-api-mockito2</artifactId>\n  <version>LATEST_VERSION</version>\n\
    \  <scope>test</scope>\n</dependency>\n```\n\n### 3. 接受新规则\n\n对 JUnit 测试的关键更改：\n\
    \n- `@RunWith(PowerMockRunner.class)`：在类级别替换你通常使用的 runner。\n- `@PrepareForTest({...})`：在测试类顶部，列出包含静态方法、构造函数或私有方法的类，以便\
    \ PowerMock 对这些类启用 Mock。\n\n#### 示例片段\n\n```java\n@RunWith(PowerMockRunner.class)\n\
    @PrepareForTest({MyClassWithStaticMethods.class, AnotherClass.class})\npublic\
    \ class OrderServiceTest {\n    // ... 你的测试 ...\n}\n```\n\n### 4. 基础用法：开启静态 Mock\n\
    \n让我们想象有一个工具类：\n\n```java\npublic class StringUtils {\n    public static boolean\
    \ isEmpty(String str) {\n        // ...\n    }\n}\n```\n\n使用 PowerMock：\n\n```java\n\
    @Test\npublic void testWithStaticMock() {        \n    PowerMockito.mockStatic(StringUtils.class);\n\
    \    PowerMockito.when(StringUtils.isEmpty(anyString())).thenReturn(true);\n \
    \   // 使用 StringUtils 的代码现在将获得我们的模拟行为\n}\n```\n\n**重要说明：**\n\n- **需要 JUnit 4**：该\
    \ runner 目前绑定到 JUnit 4。JUnit 5 的支持正在开发中。\n- **谨慎使用**：要非常意识到能力越大，责任越大。过度依赖 PowerMock\
    \ 可能会导致测试变得脆弱，或者导致代码以后难以重构。\n\n## 第 2 部分：Mock 构造函数、私有方法以及警告\n\n接下来，我们将深入研究构造函数操作的细节、驯服那些私有方法，以及在使用这些强大工具时保持测试健壮的必性最佳实践。\n\
    \n**额外资源：**\n\n- **PowerMock 文档**：[`github.com/powermock/powermock`](https://github.com/powermock/powermock)\n\
    \n警告：做好测试平衡发生偏移的准备。如果你发现自己需要大量使用 PowerMock，请额外仔细地考虑你的设计选择！\n\n## 配置 PowerMock\
    \ 以实现无缝集成 – 部分 2\n\n让我们继续配置 PowerMock 的之旅，以获得流畅的体验。\n\n### 1. 使用 PowerMock Mock\
    \ 构造函数\n\n考虑一个构造函数中有一个难以管理的依赖的类：\n\n```java\npublic class OrderService {\n   \
    \ private final InventoryService inventoryService;\n    public OrderService(InventoryService\
    \ inventoryService) {\n        this.inventoryService = inventoryService;\n   \
    \ }\n}\n```\n\nPowerMock 来救救了：\n\n```java\n@RunWith(PowerMockRunner.class)\n@PrepareForTest(OrderService.class)\n\
    public class OrderServiceTest {\n    @Test\n    public void testConstructor()\
    \ {\n        InventoryService inventoryMock = Mockito.mock(InventoryService.class);\n\
    \        PowerMockito.whenNew(InventoryService.class).withAnyArguments().thenReturn(inventoryMock);\n\
    \        OrderService orderService = new OrderService(); // 现在使用了 mock 对象！\n \
    \   }\n}\n```\n\n**解释：**\n\n- `@PrepareForTest(OrderService.class)`：信号我们想要影响 `OrderService`。\n\
    - `PowerMockito.whenNew(InventoryService.class).withAnyArguments().thenReturn(inventoryMock)`：拦截了构造函数。\n\
    \n### 2. 私有方法：暴露隐藏的内容\n\n假设一个类需要一些重构，但你想测试它：\n\n```java\npublic class UserManager\
    \ {\n    public void changePassword(String username, String newPassword) {\n \
    \       String encrypted = encryptPassword(newPassword);\n        // ... 逻辑\n\
    \    }\n    private String encryptPassword(String rawPassword) {\n        return\
    \ rawPassword;\n    }\n}\n```\n\n使用 PowerMock 测试：\n\n```java\n@RunWith(PowerMockRunner.class)\n\
    @PrepareForTest(UserManager.class)\npublic class UserManagerTest {\n    @Test\n\
    \    public void changePassword_EncryptsCorrectly() throws Exception {\n     \
    \   UserManager userManager = PowerMockito.spy(new UserManager());\n        String\
    \ rawPassword = \"test\";\n        PowerMockito.doReturn(\"ENCRYPTED\").when(userManager,\
    \ \"encryptPassword\", rawPassword);\n        \n        userManager.changePassword(\"\
    john\", rawPassword);\n        // 现在你可以验证剩余逻辑是否使用了加密后的值\n    }\n}\n```\n\n"
- fmt: "\nRecall that Mockito, by design, can’t directly manipulate static methods.\
    \ This makes sense, as overuse of static methods often hints at less testable\
    \ designs. However, sometimes reality bites:\n\n- **Legacy Code**: You’re working\
    \ with a codebase that relies heavily on static methods scattered throughout.\n\
    - **Utility Classes**: You need to control behavior in classes full of static\
    \ helper methods (`FileUtils`, `StringUtils`, etc.)\n- **External Libraries**:\
    \ You’re dealing with third-party libraries where the undesirable behavior is\
    \ inside static methods.\n\n## 2. Enter PowerMock: Breaking the Rules\n\nPowerMock,\
    \ in conjunction with Mockito, empowers you to:\n\n- **Mock Static Methods**:\
    \ Treat static methods like instance methods for stubbing purposes (`PowerMockito.mockStatic()`).\n\
    - **Verify Invocations**: Use Mockito’s `verify()` on static methods to check\
    \ if they were called as expected.\n\n## 3. Example: Taming a Troublesome Utility\
    \ Class\n\nLet’s imagine this utility class is giving us headaches:\n\n```java\n\
    public class FileUtils {\n    public static boolean deleteFile(String path) {\n\
    \        File file = new File(path);\n        return file.delete();\n    }\n}\n\
    ```\n\n**Test Scenario**: You want to test code that uses `FileUtils.deleteFile()`,\
    \ but don’t want to actually delete things during your test.\n\n**PowerMock in\
    \ Action:**\n\n```java\n@RunWith(PowerMockRunner.class)\n@PrepareForTest(FileUtils.class)\n\
    public class OrderServiceTest {\n    @Test\n    public void processOrder_FileDeletionControlled()\
    \ {\n        PowerMockito.mockStatic(FileUtils.class);\n        PowerMockito.doReturn(true).when(FileUtils.class);\
    \ // Note: No argument matchers here\n        FileUtils.deleteFile(anyString());\n\
    \        // Now, code that calls FileUtils.deleteFile() won't actually delete\n\
    \    }\n}\n```\n\n## 4. Key Points\n\n- **@PrepareForTest`**: Don’t forget this!\
    \ Tell PowerMock which classes contain the static methods you’ll target.\n- **`PowerMockito.mockStatic()`**:\
    \ Marks the class for static method mocking.\n- **`when()` Syntax**: Seems familiar,\
    \ but since there’s no object instance, you directly reference the class after\
    \ `when()`.\n\n### Important: Weigh the Trade-offs!\n\nMocking static methods,\
    \ while powerful, can lead to:\n\n- **Coupling Tests to Implementation**: If you\
    \ change how `FileUtils` works internally, your tests might break even if its\
    \ outward behavior is correct.\n- **Making Refactoring Harder**: Static methods\
    \ are notoriously tricky to refactor. These kinds of tests make it even more difficult.\n\
    \n---\n\n## Part 2: More Nuances, Verification, and Best Practices\n\nNext, we’ll\
    \ learn how to verify static method calls, explore partial static mocking, and\
    \ discuss when to use this power judiciously.\n\n### Additional Resources\n\n\
    - **PowerMock Static Mocking Usage**: [https://github.com/powermock/powermock](https://github.com/powermock/powermock)\n\
    \n**Remember**: With great power, comes great responsibility. Always consider\
    \ design alternatives before heavily relying on PowerMock!\n\n# Mastering Static\
    \ Method Mocking Techniques – Part 2\n\nLet’s delve deeper into the intricacies\
    \ of bending static methods to our testing will with PowerMock.\n\n## 1. Verifying\
    \ Static Method Calls\n\nJust as Mockito’s `verify()` is potent for instance methods,\
    \ so too can we check static interactions:\n\n```java\n@Test\npublic void fileDeletion_callsSystemLog()\
    \ {\n    // ... setup as before...\n    processOrder(); // Calls the method which\
    \ internally uses FileUtils.deleteFile()\n    PowerMockito.verifyStatic(SystemLogger.class);\n\
    \    SystemLogger.logMessage(\"File deleted\");\n}\n```\n\n- **`PowerMockito.verifyStatic()`**:\
    \ The counterpart to `verify()` for static methods. We pass in the class containing\
    \ the static method.\n\n## 2. Partial Mocking of Static Classes\n\nSometimes you\
    \ might want to mock only some static methods of a class, leaving others to behave\
    \ normally:\n\n```java\n@PrepareForTest(FileUtils.class)\npublic class FileServiceTest\
    \ {\n    @Test\n    public void something() {\n        PowerMockito.spy(FileUtils.class);\
    \ // Turns it into a partial mock\n        PowerMockito.when(FileUtils.calculateFileSize(anyString())).thenReturn(1024L);\n\
    \        // FileUtils.deleteFile() will still have its REAL behavior!\n    }\n\
    }\n```\n\n- **`PowerMockito.spy()`**: Creates a partial mock of the specified\
    \ class.\n\n## 3. Best Practices & Considerations\n\n- **Testing the Interaction,\
    \ Not the Guts**: Focus on verifying that your system-under-test interacts with\
    \ the static method in the way.\n- **Arguments**: Use Mockito’s `any()`, `eq()`\
    \ as needed.\n- **Return Values**: Stub using `doReturn(...).when(...)`.\n\n##\
    \ 4. Common Pitfalls\n\n- **Over-Mocking**: If you find yourself mocking large\
    \ numbers, revisit your design.\n- **Forgetting @PrepareForTest**: Without this,\
    \ PowerMock won’t be able to do magic.\n- **Complexity**: Static mocking often\
    \ makes tests more fragile.\n\n### Example: Taming a Troublesome Utility Class\n\
    \nImagine you have a `Time` class. PowerMock allows you to control `getCurrentTime()`\
    \ for determinism.\n\n- **Testability**: Consider if you can inject a less global\
    \ source instead.\n\n---\n\n# Advanced Strategies for Mocking Static – Part 3\n\
    \nLet’s get ready into advanced corners. These techniques are powerful, but come\
    \ with an extra dose!\n\n## 1. Mocking System Classes\n\nThink `System.currentTimeMillis()`,\
    \ `Math.random()`, etc. PowerMock lets you tamper with the standard library.\n\
    \n**Example: Stabilizing Randomness**\n\n```java\n@RunWith(PowerMockRunner.class)\n\
    @PrepareForTest(Math.class)\npublic class LotteryTest {\n    @Test\n    public\
    \ void luckyDraw_alwaysWins() {\n        PowerMockito.mockStatic(Math.class);\n\
    \        PowerMockito.when(Math.random()).thenReturn(0.9999);\n        LotteryService\
    \ lotteryService = new LotteryService();\n        Assert.assertTrue(lotteryService.draw());\n\
    \    }\n}\n```\n\n**Important**:\n- Mocking core system classes can have unintended\
    \ ripple effects on other tests. Use with extreme caution.\n- Consider if there’s\
    \ a way to inject instead.\n\n## 2. Suppressing Methods\n\nSometimes, you want\
    \ to prevent the execution of certain static methods. For example, logging frameworks\
    \ might interfere with test output:\n\n```java\n@PrepareForTest(LogManager.class)\n\
    public class MyClassTest {\n    @Test\n    public void testSomething() {\n   \
    \     PowerMockito.suppress(PowerMockito.method(LogManager.class, \"getLogger\"\
    ));\n        // Now, calls to LogManager.getLogger() will effectively do nothing\n\
    \    }\n}\n```\n\n## 3. Mocking Final Methods on Final Classes\n\nPowerMock truly\
    \ bends the usual rules of Java:\n\n- **Caveat**: Not all mocking frameworks PowerMock\
    \ is built upon might support this, and it might depend on JVM versions.\n\n```java\n\
    @PrepareForTest(MyFinalClass.class)\npublic class ... {\n    @Test\n    public\
    \ void testMockingFinalMethod() {\n        PowerMockito.mockStatic(MyFinalClass.class);\n\
    \        PowerMockito.when(MyFinalClass.someFinalStaticMethod()).thenReturn(\"\
    hello\");\n        // ...\n    }\n}\n```\n"
