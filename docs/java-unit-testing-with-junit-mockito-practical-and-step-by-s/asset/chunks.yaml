  trans: "\n\n● `JUnit 5 用户指南`: [https://junit.org/junit5/docs/current/user-guide/]\n\
    ● `Mockito 项目主页`: [https://site.mockito.org/]\n● `Spring Framework 框架`: [https://docs.spring.io/spring-framework/docs/current/reference/html/testing.html]\n\
    \n注意：这些是补充你知识的重要资源。\n\n## 第 1 部分：理解单元测试的本质\n\n# 单元测试在 Java 开发中的意义\n\n想象正在构建一台由数百个复杂部件组成的巨型机器。你会先组装好整个机器，然后尝试通电并希望一切都能完美运行吗？当然不会！有效的工程意味着在集成之前，对单个组件进行严格的测试。软件开发也遵循这一原理，单元测试就是你进行质量控制的核心工具。\n\
    \n### 什么是单元测试？\n\n单元是应用程序中最小的可独立测试代码单元，通常是一个 `method`（方法）、`function` 或 `class`。单元测试是编写小型、集中的测试的过程，以隔离的方式验证这些单个单元的行为。将单元测试想象为对你软件机器中单个齿轮的显微镜检查。\n\
    \n### 为什么单元测试很重要\n\n让我们深入探讨为什么单元测试是健壮 Java 开发基础的这些原因：\n\n- **早期发现 Bug**：发现 Bug\
    \ 越早，修复的成本越低、越容易。单元测试在开发周期早期就能捕捉错误。与其让 Bug 在几周后作为 UI 中的模糊症状出现，不如让单元测试精确地定位到负责的特定组件。\n\
    - **代码信心**：单元测试像是一个安全网。随着代码库的增长和更改，你的测试套件会确保没有发生意外破坏。这允许你无畏地进行重构和添加功能，从而加速开发速度。\n\
    - **改进设计**：编写测试往往会迫使你预先考虑代码的设计。当你的代码易于测试时，通常意味着其结构良好、模块化且职责清晰。\n- **活的文档**：代码在几个月或几年后可能很难理解（即使是你自己的代码！）。单元测试充当了可执行规范，有效地记录了你的代码组件预期的工作方式。\n\
    - **防止回归**：当你修复一个 Bug 时，你会希望有一个测试确保该 Bug 永远不再出现。单元测试可以防止旧问题随着软件开发的进行而重新出现。\n\n\
    ### 不测试的代价\n\n跳过单元测试最初似乎节省了时间，但这是一场灾难的配方：\n\n- **遗漏 Bug**：Bug 将不可避免地渗透到生产环境，导致用户感到沮丧，并可能损害你的应用程序声誉。\n\
    - **浪费调试时间**：在大型未测试代码库中寻找 Bug 是一场噩梦，会导致开发时间的浪费和不可预测的发布计划。\n- **害怕改变**：由于没有测试作为安全网，即使是微小的修改也可能感觉充满风险，抑制你创新和改进项目的能力。\n\
    - **技术债**：缺乏测试会导致代码变得越来越脆弱且难以维护，从长远来看会拖慢团队进度。\n\n### 良好的单元测试的核心特征\n\n为了让你的单元测试真正有效，它们应该遵循几个关键原则：\n\
    \n- **快速 (FAST)**：单元测试运行速度应该极快，提供近乎时的反馈。成千上万个缓慢测试会让开发者失去积极性并阻塞你的开发工作流。\n- **隔离\
    \ (Isolated)**：每个测试都应该只关注被测试的单元，外部依赖应得到适当的控制或模拟（mocked）。\n- **可重复 (Repeatable)**：无论环境或时间如何，单元测试都应该给出一致的结果，对它们所测试的代码产生信心。\n\
    - **自检 (Self-Checking)**：测试应该能够自己判断通过或失败。只需要极少的人工解读。\n- **及时 (Timely)**：理想情况下，单元测试应与其旨在测试的代码一同编写，帮助驱动设计过程本身。\n\
    \n### 单元测试思维\n\n编写良好的单元测试需要转变你的开发方法。思考你的代码可能会如何失败，而不只是它应该如何工作。努力实现边缘情况覆盖。考虑意外的输入、无效的状态和潜在错误。你的测试应该以所有正确的方式“弄坏”你的代码。\n\
    \n### 让我们开始吧\n\n在下一章中，我们将深入 `JUnit` 的实际世界，这个著名的 Java 测试框架将成为你的测试工具包。\n\n### 额外资源\n\
    \n- `JUnit 5 用户指南`: [https://junit.org/junit5/docs/current/user-guide/]\n- `测试驱动开发\
    \ (TDD) 概述`: [https://en.wikipedia.org/wiki/Test-driven_development]\n- `单元测试的益处`:\
    \ [https://docs.microsoft.com/en-us/visualstudio/test/unit-test-basics?view=vs-2022]\n\
    \n## 使用 JUnit 建立你的基础：第一部分\n\n`JUnit` 几十年来一直是 Java 测试的骨干，提供了一个编写单元测试的结构化框架。在本章中，我们将开始构建单元测试专业知识。让我们涵盖基础内容：设置项目、编写基础测试以及理解核心概念。\n\
    \n### 配置环境\n\n1. **选择你的工具**：\n   - IDE：大多数现代 IDE（如 `IntelliJ`、`Eclipse`、`NetBeans`）都内置了\
    \ `JUnit` 支持。\n   - 构建工具：广泛使用 `Maven` 或 `Gradle`。\n2. **添加依赖**：\n   - Maven：在你的\
    \ `pom.xml` 中包含此：\n```xml\n<dependency>\n  <groupId>org.junit.jupiter</groupId>\n\
    \  <artifactId>junit-jupiter</artifactId>\n  <version>5.9.2</version>\n  <scope>test</scope>\n\
    </dependency>\n```\n   - Gradle：在你的 `build.gradle` 中添加此：\n```gradle\ntestImplementation(\"\
    org.junit.jupiter:junit-jupiter:5.9.2\")\n```\n\n### 创建你的第一个测试\n\n让我们写一个简单的测试来感受\
    \ `JUnit` 的结构。考虑这个类：\n\n```java\npublic class Calculator {\n    public int add(int\
    \ a, int b) {\n        return a + b;\n    }\n}\n```\n\n这里是针对 `add` 方法的 JUnit 测试：\n\
    \n```java\nimport org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\
    \npublic class CalculatorTest {\n    @Test\n    public void testAdd() {\n    \
    \    Calculator calculator = new Calculator();\n        assertEquals(5, calculator.add(2,\
    \ 3));\n    }\n}\n```\n\n#### 解析：\n- **导入 (Imports)**：你需要 `org.junit.jupiter.api.Test`\
    \ 来使用测试注解，使用 `org.junit.jupiter.api.Assertions` 来断言结果。\n- **测试类**：为你的测试类以 \"Test\"\
    \ 结尾命名（例如 `CalculatorTest`），以便于识别。\n- **@Test 注解**：标记一个方法为由 `JUnit` 执行的测试。\n-\
    \ **断言 (Assertions)**：`assertEquals` 是最基础的断言方法，验证预期结果与被测试代码的实际输出匹配。\n\n### 运行测试\n\
    \n你的 IDE 通常具有运行 JUnit 测试的功能。寻找：\n- **运行/调试按钮**：通常位于测试方法或类附近。\n- **测试运行视图 (Test\
    \ Runner View)**：显示测试结果的专用界面。\n\n### 理解 JUnit 术语\n\n- **测试用例 (Test Case)**：单个测试方法（示例中的\
    \ `testAdd`）。\n- **测试套件 (Test Suite)**：测试用例的集合，通常在一个类中。\n- **测试固件 (Test Fixture)**：一组测试所需的设置和清理工作（我们稍后会通过\
    \ `@Before`、`@After` 等介绍）。\n\n"
- fmt: "\n# Assertions: Statements that verify expected vs. actual behavior. JUnit\
    \ provides a rich set of assertion methods.\n\n## Essential JUnit Annotations\n\
    \nSo far, you’ve seen `@Test`. Let’s introduce a few more:\n\n- `@Disabled`: Temporarily\
    \ skips a test case from execution. Useful during development.\n- `@DisplayName`:\
    \ Provides a clear, readable name for your test that appears in test reports.\n\
    \n### Example with `@DisplayName`\n\n```java\n@Test\n@DisplayName(\"Adding two\
    \ positive numbers\")\npublic void testAdd() {\n    // ... rest of the test code\
    \ ...\n}\n```\n\n## Next Steps\n\nThis was your first step into the world of JUnit!\
    \ In the next part, we’ll explore project configuration for a smooth testing experience\
    \ and dive into more powerful assertion methods.\n\n## Additional Resources\n\n\
    - JUnit 5 User Guide: [https://junit.org/junit5/docs/current/user-guide/](https://junit.org/junit5/docs/current/user-guide/)\n\
    - Maven Getting Started: [https://maven.apache.org/guides/getting-started/](https://maven.apache.org/guides/getting-started/)\n\
    - Gradle Getting Started: [https://docs.gradle.org/current/userguide/getting_started.html](https://docs.gradle.org/current/userguide/getting_started.html)\n\
    \n# Configuring JUnit for Success: Part 2\n\nIn the previous chapter, we started\
    \ laying the foundation of your testing journey with JUnit. Now, let’s fine-tune\
    \ your JUnit setup to streamline your testing workflow and unlock advanced features.\n\
    \n## Customizing Test Execution\n\nJUnit provides flexibility in how you run your\
    \ tests. Here’s how to adjust execution behavior:\n\n- **Test Runners**: JUnit\
    \ employs runners to execute and report results. The default runner is adequate\
    \ for most scenarios. However, JUnit supports custom runners for special use cases:\n\
    \    - `Parameterized`: For running parameterized tests (covered later in the\
    \ book)\n    - `Suite`: For creating suites of test classes\n- **Ordering Tests**:\
    \ By default, the order of test execution is unpredictable. For specific scenarios,\
    \ you can enforce order using:\n    - `@Order` Annotation: Assign an integer to\
    \ each test method to control sequence.\n    - `@FixMethodOrder` Annotation: Force\
    \ tests to run in a specific order determined by their method names (alphabetically).\
    \ Use these carefully, as order dependencies often indicate poorly isolated tests.\n\
    \n## Assumptions: Testing Under Conditions\n\nAssumptions allow you to skip tests\
    \ when certain preconditions are unmet. This is useful for filtering tests based\
    \ on your environment or specific states.\n\n- `assumeTrue()` and `assumeFalse()`:\
    \ Fail a test if the provided condition is not met.\n\n```java\nimport static\
    \ org.junit.jupiter.api.Assumptions.assumeTrue;\n\n@Test\nvoid testOnLinuxEnvironment()\
    \ {\n    assumeTrue(System.getProperty(\"os.name\").equals(\"Linux\"));\n    //\
    \ Test logic that is specifically designed for Linux\n}\n```\n\n## Managing Test\
    \ Timeouts\n\nOccasionally tests might get stuck in infinite loops or hang. JUnit’s\
    \ timeout feature safeguards against that:\n\n- `@Timeout`: Specify a maximum\
    \ execution time for a test. If exceeded, the test fails.\n\n```java\n@Test\n\
    @Timeout(value=100, unit=TimeUnit.MILLISECONDS)\nvoid testWithTimeout() {\n  \
    \  // Test logic which should execute under 100 ms\n}\n```\n\n## Beyond the Basics:\
    \ Useful JUnit Features\n\nLet’s explore some lesser-known but powerful JUnit\
    \ capabilities:\n\n- **Grouping Tests with `@Tag`**: Assign custom tags to your\
    \ tests for selective execution. For example, tag slow tests as `@Tag(\"integration\"\
    )` and run them with a separate build profile.\n- **Conditional Test Execution**:\
    \ You can use `@EnabledIf` and `@DisabledIf` along with custom systems (e.g.,\
    \ checking environment variables) to enable/disable tests based on conditions.\n\
    - `@Nested`: Create nested test classes to structure complex test cases or group\
    \ related tests within a single class. This improves test readability.\n\n###\
    \ Example: Conditional Execution and Grouping\n\n```java\n@Test\n@EnabledIf(\"\
    isDevelopmentEnvironment\")\n@Tag(\"integration\")\nvoid integrationTestOnDevelopment()\
    \ {\n    // ... integration test logic\n}\n\nprivate static boolean isDevelopmentEnvironment()\
    \ {\n    return \"dev\".equals(System.getProperty(\"env\"));\n}\n```\n\n## Integration\
    \ with Build Tools (Maven and Gradle)\n\nBuild tools seamlessly manage JUnit’s\
    \ integration into your project lifecycle, allowing you to effortlessly run tests.\
    \ Here are typical commands:\n\n### Maven:\n\n- `mvn test`: Executes all tests\n\
    - `mvn test -Dtest=CalculatorTest`: Executes only `CalculatorTest`\n- `mvn test\
    \ -Dtest=CalculatorTest#testAdd`: Executes the `testAdd` method within `CalculatorTest`\n\
    \n### Gradle:\n\n- `gradle test`: Executes all tests\n- `gradle test --tests CalculatorTest`:\
    \ Executes only `CalculatorTest`\n- `gradle test --tests CalculatorTest.testAdd`:\
    \ Executes the `testAdd` method within `CalculatorTest`\n\n## Advanced Configuration\n\
    \nBuild tools offer advanced options to customize test reporting, filtering, and\
    \ more. Explore their respective documentation for these options.\n\n## Additional\
    \ Resources\n\n- JUnit 5 User Guide (Conditional Execution, Assumptions, etc.):\
    \ [https://junit.org/junit5/docs/current/user-guide/](https://junit.org/junit5/docs/current/user-guide/)\n\
    - Maven Surefire Plugin (Test Configuration): [https://maven.apache.org/surefire/maven-surefire-plugin/](https://maven.apache.org/surefire/maven-surefire-plugin/)\n\
    - Gradle Test Task (Test Configuration): [https://docs.gradle.org/current/dsl/org.gradle.api.tasks.testing.Test.html](https://docs.gradle.org/current/dsl/org.gradle.api.tasks.testing.Test.html)\n\
    \nLet’s continue enhancing your mastery of JUnit with a focus on powerful assertion\
    \ techniques!\n\n# Achieving Success: Green Bars and Asserting Equality: Part\
    \ 1\n\nTurning those test results green is a satisfying experience! In this chapter,\
    \ we’ll begin our in-depth exploration of JUnit’s assertion methods. These are\
    \ the backbone for verifying the correctness of your code’s behavior, and mastering\
    \ them is fundamental to writing effective unit tests.\n\n## The Importance of\
    \ Assertions\n\nAssertions are the heart of a unit test. They express the expectations\
    \ you place on your code. When one fails, it pinpoints exactly where your code\
    \ deviates from its design.\n\n## JUnit Assertion Methods: The Basics\n\nLet’s\
    \ start by outlining the core assertion methods provided by `org.junit.jupiter.api.Assertions`:\n\
    \n- `assertEquals(expected, actual)`: The most fundamental assertion. Verifies\
    \ that two objects are equal. For primitive types, this means direct value (e.g.,\
    \ `5 == 5`). For objects, this typically uses the object’s `.equals()` method.\n\
    - `assertNotEquals(unexpected, actual)`: The opposite of `assertEquals`, ensuring\
    \ two objects are not equal.\n- `assertTrue(condition)`: Asserts that a boolean\
    \ condition evaluates to `true`.\n- `assertFalse(condition)`: Asserts that a boolean\
    \ condition evaluates to `false`.\n- `assertNull(object)`: Asserts that a given\
    \ object is `null`.\n- `assertNotNull(object)`: Asserts that a given object is\
    \ not null.\n\n## Example: Putting Assertions into Action\n\nLet’s revisit our\
    \ `Calculator` class and add some more tests:\n\n```java\nimport org.junit.jupiter.api.Test;\n\
    import static org.junit.jupiter.api.Assertions.*;\n\npublic class CalculatorTest\
    \ {\n    private Calculator calculator = new Calculator();\n\n    @Test\n    void\
    \ testSubtract() {\n        assertEquals(3, calculator.subtract(5, 2));\n    }\n\
    \n    @Test\n    void testMultiply() {\n        assertEquals(10, calculator.multiply(5,\
    \ 2));\n    }\n\n    @Test\n    void testDivisionByZero() {\n        assertThrows(ArithmeticException.class,\
    \ () -> calculator.divide(5, 0));\n    }\n}\n```\n\nLet’s break down the new test\
    \ `testDivisionByZero()`:\n\n- `assertThrows`: This is specifically designed for\
    \ testing exception scenarios. Here, we EXPECT an `ArithmeticException` to be\
    \ thrown when dividing by zero.\n- Lambda Expression: The code `() -> calculator.divide(5,\
    \ 0)` is a lambda expression, providing the executable code block that is expected\
    \ to throw the exception.\n\n## Equality in Depth: Primitives vs. Objects\n"
