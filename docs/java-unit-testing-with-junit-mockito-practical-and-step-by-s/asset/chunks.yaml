    \n // Assertions - let's get detailed!\n\n // (We should check if the repository's\
    \ method was called with the right arguments...)\n\n   verify(productRepositoryMock).findById(\"\
    123\");\n\n // ... and ideally, assert something about what gets added to the\
    \ cart.\n\n // (We'll need Mockito to help here!)\n\n}\n\n2\\. Introducing Argument\
    \ Capturing\n\nHow do we actually check the contents of what was (presumably)\
    \ added to the (presumably) internal cart within our  ShoppingCart?\n\n● ArgumentCaptor:\
    \ A Mockito class designed to capture arguments passed to mocks.\n\nimport  static\
    \ org.mockito.ArgumentMatchers.anyInt;  // We'll learn about this soon\n\n@Test\n\
    \nvoid  addItem_withValidProduct()  {\n\n   // ... setup ...\n\n   shoppingCart.addItem(\"\
    123\",  2);\n\n   // ArgumentCaptor!\n\n   ArgumentCaptor<Product> productCaptor\
    \ =  ArgumentCaptor.forClass(Product.class);\n\n   ArgumentCaptor<Integer> quantityCaptor\
    \ =  ArgumentCaptor.forClass(Integer.class);\n\n // Capture what happens on a\
    \ mock call (assuming the cart uses some 'add' method)\n\n   verify(shoppingCart).add(productCaptor.capture(),\
    \ quantityCaptor.capture());\n\n // Assertions using captured values\n\n   assertEquals(\"\
    123\", productCaptor.getValue().getId());\n\n   assertEquals(2, quantityCaptor.getValue());\n\
    \n }\n\n3\\. Matchers: Flexible Stubbing and Assertions\n\nNote the use of  anyInt()\
    \ above. Matchers let us be specific or flexible when needed:\n\n●     anyInt(),\
    \  anyString(), etc.: Matches any value of that type.\n\n●     eq(...): Matches\
    \ an exact value (like JUnit’s own  assertEquals).\n\n● More: You can match on\
    \ regex, custom rules, and more!\n\nExample: Tax Calculation (Matchers)\n\nwhen(taxServiceMock.calculateTax(any(Order.class))).thenReturn(8.0);\n\
    \n4\\. Best Practices\n\n● Targeted Captures: Only capture arguments you truly\
    \ need for assertions.\n\n● Matcher Finesse: Use matchers to strike the balance\
    \ between test strictness and avoiding brittleness.\n\n● Don’t Forget ‘verify’:\
    \ Capturing is often paired with  verify to ensure methods were actually called.\n\
    \n5\\. Evolving Our Test\n\nOur  ShoppingCartTest is shaping up! We’re now checking\
    \ the behavior of the code and the results that the mock collaborator is involved\
    \ in.\n\nAdditional Resources\n\n●     Mockito ArgumentCaptor:  [https://www.baeldung.com/mockito-argumentcaptor](https://www.baeldung.com/mockito-argumentcaptor)\n\
    \n●     Mockito Argument Matchers:  [https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentMatchers.html)\n\
    \nAdvancing with Mockito – Part 3\n\nLet’s take your Mockito skills up a notch.\
    \ In this chapter, we’ll cover some intermediate and advanced techniques to make\
    \ your tests more robust and maintainable.\n\n1\\. Mastering Verification\n\n\
    In previous chapters, we used  verify() to ensure mocks were called. Let’s go\
    \ deeper:\n\n●     Verification Times:\n\n○     times(n): The method should be\
    \ called ‘n’ times.\n\n○     atLeastOnce(),  atMost(n): Set flexible boundaries.\n\
    \n○     never(): Ensure a method was not called.\n\n○ Call Order: Use  InOrder\
    \ for scenarios where the sequence of calls matters:\n\nInOrder inOrder =  inOrder(mock1,\
    \ mock2);\n\ninOrder.verify(mock1).doSomething();\n\ninOrder.verify(mock2).doSomethingElse();\n\
    \nExample: Login Attempts\n\nImagine a security-minded component that limits login\
    \ retries. Your tests might have verifications like:\n\nverify(loginService, \
    \ times(3)).processLogin(anyString(),  anyString());\n\nverify(notificationService).sendAccountLockedEmail(anyString());\n\
    \n2\\. Resetting Mocks\n\nSometimes, you need a fresh start within a test:\n\n\
    Mockito.reset(mock1, mock2,  ...); // Resets stubbing and call counts\n\n●     Use\
    \ Cases:\n\n○ When a single test method exercises the SUT multiple times with\
    \ varying conditions.\n\n● Caution: Use judiciously. Resetting can hide issues\
    \ if you rely on it too heavily.\n\n3\\. Customizing Stubbing with  Answer\n\n\
    when(...).thenAnswer(...) gives you immense control for complex stubbing:\n\n\
    when(inventoryServiceMock.isProductInStock(anyString()))\n\n    .thenAnswer(invocation\
    \ ->  {\n\n        String productId = invocation.getArgument(0);\n\n        return\
    \ productId.startsWith(\"A\");  // Example: Products starting with 'A' in stock\n\
    \n    });\n\nUse Cases:\n\n●     Dynamic responses based on arguments\n\n●     Simulating\
    \ side effects (e.g., updating an in-memory counter)\n\n●     Testing error paths\
    \ by injecting exceptions\n\n4\\. Mockito & Frameworks (Spring Context)\n\nBriefly,\
    \ as Spring is a later section:\n\n●     @RunWith(MockitoJUnitRunner.class): Initializes\
    \ Mockito for JUnit tests\n\n●     @Mock: Creates mocks to be injected by Spring.\n\
    \n●     @InjectMocks: Injects mocks into your SUT\n\n● Spring’s  @MockBean: Replaces\
    \ Spring beans with Mockito mocks within a test context.\n\nPart 4: Mockito’s\
    \ Hidden Gems\n\nNext time, we’ll delve into some lesser-known Mockito features\
    \ and best practices to help you write even more powerful and effective unit tests!\n\
    \nAdditional Resources\n\n●     Mockito Verification Documentation:  [https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html#verification](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html#verification)\n\
    \n●     Mockito Answer Documentation:  [https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/stubbing/Answer.html](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/stubbing/Answer.html)\n\
    \nUnraveling Mockito Mysteries – Part 4\n\nLet’s conclude our Mockito deep dive\
    \ by exploring some of the lesser-known corners and the nuances that will take\
    \ your testing to the next level.\n\n1\\. Mocking Final Classes/Methods\n\n● The\
    \ Challenge: By default, Mockito cannot mock final classes or methods in Java\
    \ (these are designed to be non-extendable).\n\n●     Solution:\n\n○ PowerMock:\
    \ A library that extends Mockito, enabling this functionality. (We’ll dedicate\
    \ whole chapters to PowerMock!)\n\n○ Refactoring if Possible: If you control the\
    \ codebase, sometimes removing  final or designing for testability is the better\
    \ long-term solution.\n\n2\\. Spying on Real Objects\n\nMockito.spy(...) creates\
    \ a partial mock. Let’s see its use:\n\n● Spying for Control: Lets you selectively\
    \ override methods of a real object while keeping the rest of its behavior intact.\n\
    \nPaymentService paymentService =  new  PaymentService(); // Real object\n\nPaymentService\
    \ paymentServiceSpy =  Mockito.spy(paymentService);\n\n// Selective Stub:\n\n\
    when(paymentServiceSpy.calculateFee(any())).thenReturn(1.0);\n\n// Real behavior\
    \ remains:\n\ndouble result = paymentServiceSpy.processPayment(100.0);\n\n3\\\
    . Gotchas and Caveats\n\n● Over-Mocking: Mockito is powerful, but overuse leads\
    \ to brittle tests tied to implementation details rather than behavior.\n\n● Stubbing\
    \ Complex Objects: If a collaborator is complex to stub, it may signal a design\
    \ issue in your SUT (too many dependencies).\n\n● any(...) vs. Specific Matchers:\
    \ Strike a balance between test flexibility and precision.\n\n● @InjectMocks Limitations:\
    \ While convenient, it has limits with complex object graphs or non-standard constructor\
    \ injection.\n\n4\\. Mockito’s \"Philosophy\n\n● Behavioral Focus: Mockito encourages\
    \ testing how your code behaves in collaboration, not just the internal state\
    \ of individual objects.\n\n● Cleanliness Matters: Readable tests are maintainable\
    \ tests. Mockito supports a fluent style that enhances readability when used well.\n\
    \n● It’s a Tool, Not a Religion: If a different mocking library or hand-rolled\
    \ test doubles work better for a specific situation, use those!\n\n5\\. When Mockito\
    \ Might Not Be the Best Fit\n\n● Heavy focus on private methods: Could indicate\
    \ a need to refactor your code for better testability.\n\n● Mocking the World:\
    \ Tests with too many mocks become setup nightmares. Consider a small integration\
    \ test in some cases.\n\nAdditional Resources\n\n● Mockito and Final Classes/Methods:\
    \ Discussion (not an ‘official’ resource but informative): [https://www.baeldung.com/mockito-final](https://www.baeldung.com/mockito-final)"
