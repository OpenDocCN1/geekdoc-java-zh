  trans: "\n\n## 静态方法与实例方法\n\n- 注解了 `@BeforeClass` 和 `@AfterClass` 的方法必须是 `static`\
    \ 的。然而，`@BeforeEach` 和 `@AfterEach` 方法通常不应该是 `static` 的，这样它们就可以访问测试类的实例字段。\n-\
    \ **可维护性**：这些注解显著提高了测试代码的可读性和组织性。\n\n## 设置/清理（Setup/Teardown）的常见场景\n\n- **数据库交互**：创建测试记录、回滚事务。\n\
    - **Mock ****：配置测试体（我们将在后的 Mockito 章节中讨论这一点）。\n- **外部系统**：启动测试服务器、清除缓存等。\n- **数据生成**：创建测试对象。\n\
    \n## 关于继承的说明\n\nSetup/teardown 方法在测试类的层次结构中被继承。父类方法会在子类方法之前执行（针对 `@BeforeClass`\
    \ 和 `@BeforeEach`），在子类方法之后执行（针对 `@AfterEach` 和 `@AfterClass`）。\n\n# 第 2 部分：针对性能和复杂场景进行优化\n\
    \n在下部分，我们将深入探讨高级的设置和清理策略、性能考虑因素，以及这些注解如何与其他 JUnit 功能良好地协作。\n\n## 额外资源\n- JUnit\
    \ 5 用户指南 - 测试生命周期：[`junit.org/junit5/docs/current/user-guide/`](https://junit.org/junit5/docs/current/user-guide/)\n\
    \n# 优化测试初始化与清理：高级策略 – 第 2 部分\n\n## 性能考虑\n\n虽然 `@Before` 和 `@After`（及其变体）非常棒，但请记住这些性能优化，特别是对于大型测试套件：\n\
    \n- **懒是一种美德**：如果可能，仅在测试实际需要时才创建昂贵对象或设置资源。除非绝对必要，否则避免在 `@BeforeEach` 中进行复杂的初始化。\n\
    - **选择性设置**：是否可以将共享相同设置逻辑的测试分组以避免重复工作？考虑嵌套类或巧妙的重用模式。\n- **测试对象池**：对于某些对象，对象的创建可能是瓶颈。维护一个重用对象池有时可以加速。\n\
    \n## 复杂层次结构\n\n当你的设置和清理涉及多个依赖项或复杂的序列时，请考虑：\n\n- **构建模式 (Builder Pattern)**：我们在重构章节中提到过这一点。构建模式促进了受控的、逐步的对象构建，使设置逻辑集中化。\n\
    - **自定义设置/清理工具**：将复杂的设置步骤封装到辅助函数或专用的工具类中，使你的测试方法更加简洁。\n\n## 设置与清理之外\n\n让我们看看与这些注解互补的技术：\n\
    \n1. **测试数据管理**：\n    - **内存数据库 (H2, HSQLDB)**：不要为每个测试都访问真实数据库，使用嵌入式数据库来实现极速测试。\n\
    \    - **数据固件 (Data Fixtures)**：测试前加载的预定义数据集（XML, JSON, CSV）。\n2. **加速外部交互**：\n\
    \    - **Mock**：Mockito 是你这里的终极工具。我们将专门用一个章节来掌握它。模拟缓慢的外部依赖以保持单元测试的快速。\n    - **通用测试体\
    \ (Test Doubles)**：存根 (Stubs)、假象 (Fakes) 等作为更轻量级的替代品。\n\n### 示例：测试数据固件\n\n```java\n\
    @BeforeEach\nvoid loadTestData() {\n    testDataLoader.load(\"default-accounts.json\"\
    , accountRepository);\n}\n```\n\n## 与其他 JUnit 功能的相互作用\n\n- `@TestInstance(Lifecycle.PER_CLASS)`：这更改了\
    \ JUnit 实例化测试类的方式（`PER_METHOD` 是默认值）。使用 `PER_CLASS` 意味着所有的测试方法都共享该类的一个实例。使用 `@BeforeAll`\
    \ 进行设置是可以行的，但要小心，因为如果你不管理状态，这可能会在测试之间引入意外的依赖。\n- **假设 (assumeTrue, assumeFalse)**：仅在某些设置成功时有条件地运行整个测试。谨慎使用以避免掩盖隐藏错误。\n\
    \n## 注意事项\n\n- **过度使用**：过度的设置可能意味着你的生产代码存在设计问题。你的类是否太复杂了？\n- **状态泄漏**：确保 `@AfterEach`\
    \ 真正清理了更改，避免测试之间的副作用。彻底的清理是必须的！\n\n### 示例：谨慎的状态重置\n\n```java\n@AfterEach\nvoid\
    \ resetCalculator() {\n    if (calculator != null) {\n        calculator.clear();\n\
    \    }\n}\n```\n\n- **平衡粒度**：避免在单个 `@BeforeEach` 中初始化所有内容。在细粒度设置和测试效率之间取得平衡是关键。\n\
    \n## 下一步：使用 @BeforeClass 和 @AfterClass 进行静态设置/清理\n\n接下来，我们将讨论这些“类级”设置和清理注解的策略性使用，以及它们何时最适合你的测试工具箱。\n\
    \n## 额外资源\n- 测试数据管理策略：[`searchsoftwarequality.techtarget.com/definition/test-data-management`](https://searchsoftwarequality.techtarget.com/definition/test-data-management)\n\
    - JUnit 5 @TestInstance：[`junit.org/junit5/docs/current/user-guide/`](https://junit.org/junit5/docs/current/user-guide/)\n\
    \n# 协调测试生命周期：@BeforeClass 和 @AfterClass\n\n有时，设置和清理任务对于整个测试类来说是全局的。引入 `@BeforeClass`\
    \ 和 `@AfterClass` —— 你用于类级编排的工具。\n\n## 何时使用它们\n\n常见用例包括：\n- **昂贵的初始化**：设置如数据库连接、嵌入式服务器或所有测试共享的重量级测试固件。\n\
    - **静态资源**：修改测试与之交互的静态字段或系统属性。\n- **一次性清理**：释放在类内获取的资源。\n\n## 核心笔记\n\n- **执行顺序**：\n\
    \    1. `@BeforeClass`：在任何测试之前执行一次。\n    2. `@BeforeEach` -> 测试方法 -> `@AfterEach`（每个测试重复）。\n\
    \    3. `@AfterClass`：在所有测试之后执行一次。\n- **范围**：类级。\n- **方法必须是静态的**：只有静态方法可以使用这些注解。实例方法不行。\n\
    \n## 示例：以数据库为中心的测试\n\n```java\n@TestInstance(Lifecycle.PER_CLASS) // 使用此生命周期示例\n\
    public class InvoiceRepositoryTest {\n    private static InvoiceRepository repository;\n\
    \    private static Connection connection;\n\n    @BeforeClass\n    static void\
    \ setupDatabase() {\n        connection = TestDatabaseUtil.createConnection();\n\
    \        repository = new InvoiceRepository(connection);\n    }\n\n    @AfterClass\n\
    \    static void tearDownDatabase() {\n        repository = null;\n        TestDatabaseUtil.closeConnection(connection);\n\
    \    }\n\n    @Test\n    // ... 你的测试方法 ...\n}\n```\n\n## 解释\n\n- 设置和清理例程对整个测试类执行一次，使昂贵的数据库操作集中化。\n\
    - `@TestInstance(Lifecycle.PER_CLASS)` 在此处用于说明，但要谨慎使用，因为它通过共享状态破坏了测试的标准隔离性。\n\n\
    ## 关键考虑因素\n\n- **测试隔离**：通常情况下，优先选择每个测试设置（@BeforeEach）和清理（@AfterEach）以获得最大的隔离性。谨慎地使用类级设置。\n\
    - **状态管理**：如果你的代码与静态字段或系统属性交互，在 `@AfterClass` 中进行彻底清理至关重要，以避免状态意外泄漏。\n- **性能**：如果你正在执行真正共享的昂贵初始化，这些注解可以提高测试套件的性能。\n\
    \n## 何时不使用它们\n\n- **每个测试的需求**：如果每个测试都需要新的对象或独特的环境变量设置，请避免使用这些。\n- **过度使用**：过度的类级设置可能意味着你的类有过多的依赖或责任，可以进行重构。\n\
    \n## 替代方案与补充\n\n- **测试套件 (Test Suites)**：如果你需要一组共享非常特定且昂贵的设置的测试类，请考虑 JUnit 的 `@Suite`\
    \ 注解。\n\n"
- fmt: "\n- External Tools: For complex setup, explore tools like `Testcontainers`\
    \ to manage the lifecycle of external dependencies, such as databases or web services,\
    \ in test environments.\n\nLet’s move on to array comparison techniques!\n\n##\
    \ Additional Resources\n\n- `JUnit` `@Suite`: [https://junit.org/junit5/docs/current/user-guide/](https://junit.org/junit5/docs/current/user-guide/)\n\
    - `Testcontainers` [https://www.testcontainers.org/](https://www.testcontainers.org/)\n\
    \n# Mastering Arrays: Effective Techniques for Array Comparison – Part 1\n\nArrays\
    \ are fundamental to Java development, and ensuring their contents align with\
    \ expectations is a regular testing task. However, a simple `assertEquals(array1,\
    \ array2)` won’t cut it!\n\n## The Challenge with Arrays\n\n- **Reference Equality**:\
    \ In Java, arrays are objects. Using the default `equals()` method or the `==`\
    \ operator compares if they refer to the same memory location, not their element-by-element\
    \ contents.\n- **Order Matters**: For a test to pass, arrays must have the same\
    \ elements in the same order.\n\nLet’s explore reliable techniques for array comparisons\
    \ in your JUnit tests.\n\n### 1. JUnit’s `assertArrayEquals()`\n\nYour first weapon\
    \ is JUnit’s dedicated assertion method:\n\n```java\nimport static org.junit.jupiter.api.Assertions.assertArrayEquals;\n\
    \n@Test\nvoid testArrayEquality() {\n int[] expected = {1, 5, 2, 7};\n int[] actual\
    \ = {1, 5, 2, 7};\n    assertArrayEquals(expected, actual);\n}\n```\n\n- **Functionality**:\
    \ Handles element-wise comparison, accounting for both values and order. Works\
    \ with arrays of primitive types.\n\n### 2. `Arrays.equals()` (from `java.util.Arrays`)\n\
    \nUseful for comparing arrays of objects:\n\n```java\nimport java.util.Arrays;\n\
    \n@Test\nvoid testObjectArrayEquality() {\n    String[] expected = {\"Hello\"\
    , \"World\"};\n    String[] actual = {\"Hello\", \"World\"};\n    assertTrue(Arrays.equals(expected,\
    \ actual));\n}\n```\n\n- **Important**: Elements within the object arrays must\
    \ implement their own `equals()` method for content comparison.\n\n### 3. Hamcrest\
    \ Matchers\n\nHamcrest matchers offer incredible expression power (we’ll have\
    \ a dedicated chapter on them later):\n\n```java\nimport static org.hamcrest.MatcherAssert.assertThat;\n\
    import static org.hamcrest.Matchers.*;\n\n@Test\nvoid testWithHamcrestMatchers()\
    \ {\n    Integer[] numbers = {4, 1, 8};\n    assertThat(numbers, arrayContaining(1,\
    \ 8, 4));  // Order not important\n    assertThat(numbers, is(arrayContainingInAnyOrder(8,\
    \ 4, 1)));  // Flexible\n}\n```\n\n## Trade-offs to Consider\n\n- **Readability**:\
    \ `assertArrayEquals` is the most direct for basic cases. Hamcrest shines with\
    \ more nuanced scenarios.\n- **Types**: `assertArrayEquals` is specifically for\
    \ primitive arrays. For object arrays, `Arrays.equals` or Hamcrest are needed.\n\
    \n## Advanced Considerations\n\n- **Deep Comparisons**: For arrays containing\
    \ other arrays or custom objects, you’ll need `Arrays.deepEquals()` or a custom\
    \ solution for comparing nested elements.\n- **Tolerances**: When comparing floating-point\
    \ arrays (`double[]`, `float[]`), consider using an overload of `assertArrayEquals`\
    \ that takes a delta for approximation.\n\n### Example: Sorting Algorithm Test\n\
    \n```java\n@Test\nvoid testSorting() {\n int[] unsorted = {8, 3, 6, 1};\n int[]\
    \ expectedSorted = {1, 3, 6, 8};\n    Arrays.sort(unsorted);  // Your sorting\
    \ logic\n    assertArrayEquals(expectedSorted, unsorted);\n}\n```\n\n## Part 2:\
    \ Enhanced Array Comparisons\n\nIn Part 2, we’ll dive into comparing arrays with\
    \ partial matches, ignoring specific elements, using custom comparators, and strategies\
    \ for multidimensional arrays.\n\n## Additional Resources:\n\n- `JUnit` `assertArrayEquals`:\
    \ [https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html](https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html)\n\
    - `Java` `Arrays` class: [https://docs.oracle.com/javase/8/docs/api/java/util/Arrays.html](https://docs.oracle.com/javase/8/docs/api/java/util/Arrays.html)\n\
    \n# Arrays Revisited: Advanced Strategies for Comprehensive Comparison – Part\
    \ 2\n\n## Beyond the Basics\n\nIn Part 1, we covered the core methods for array\
    \ assertion. Now, let’s tackle more nuanced scenarios:\n\n### 1. Partial Matches\n\
    \nOften, you only want to check if an array contains certain elements, regardless\
    \ of their complete order. Hamcrest matchers come in particularly useful here:\n\
    \n```java\n@Test\nvoid testPartialMatch() {\n    String[] productCodes = {\"ABC123\"\
    , \"PQR987\", \"XYZ456\"};\n    assertThat(productCodes, hasItems(\"PQR987\",\
    \ \"XYZ456\"));  // Only these must exist\n}\n```\n\n### 2. Ignoring Elements\n\
    \nSometimes you need to assert array similarity, excluding specific elements:\n\
    \n```java\nimport static org.hamcrest.Matchers.*;\nimport static org.hamcrest.collection.IsIterableContainingInAnyOrder.*;\n\
    \n@Test\nvoid testIgnoringElements() {\n Integer[] allNumbers = {5, 1, 8, 2, 7};\n\
    \ // Ignore '8' and check if the rest of the elements exist\n assertThat(allNumbers,\
    \ containsInAnyOrder(equalToIgnoringCase(\"HELLO\"), 5, 1, 2, 7));\n}\n```\n\n\
    ### 3. Custom Comparators\n\nFor comparing arrays of objects based on specific\
    \ properties, build custom comparators:\n\n```java\nclass Product {\n    int id;\n\
    \    String name;\n    // ...\n}\n\n// Custom comparator comparing products by\
    \ ID\nclass ProductIdComparator implements Comparator<Product> {\n    @Override\n\
    \    public int compare(Product p1, Product p2) {\n        return Integer.compare(p1.id,\
    \ p2.id);\n    }\n}\n\n@Test\nvoid testWithComparator() {\n    Product[] expectedProducts\
    \ = { /* ... */ };\n    Product[] actualProducts = { /* ... */ };\n    // logic\
    \ using ProductIdComparator\n}\n```\n\n### 4. Multidimensional Arrays\n\n- `Arrays.deepEquals()`:\
    \ Handles nested arrays.\n- **Recursion**: For deep comparison of objects, you\
    \ may need recursive logic.\n\n### Example: 2D Array Comparison\n\n```java\n@Test\n\
    void test2DArray() {\n    int[][] matrix1 = {{1, 2}, {3, 4}};\n    int[][] matrix2\
    \ = {{3, 4}, {1, 2}};\n    assertFalse(Arrays.deepEquals(matrix1, matrix2));\n\
    }\n```\n\n## Choosing the Right Tool\n\n- **Directness**: `assertArrayEquals`\
    \ is the most direct for simple cases.\n- **Flexibility**: When partial matches\
    \ or order flexibility are needed, Hamcrest shines.\n- **Complexity**: With nested\
    \ structures or unique comparison logic, consider `Arrays.deepEquals`.\n\n## Key\
    \ Considerations\n\n- **Test Intent**: What aspect of the arrays are you truly\
    \ verifying? This drives your strategy.\n- **Readability**: While powerful, excessive\
    \ customization can hurt test clarity.\n\nLet’s move on to exception handling\
    \ with JUnit!\n"
