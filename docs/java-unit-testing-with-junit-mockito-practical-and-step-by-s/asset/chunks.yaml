    ## 2. Beyond Simple Verification: Making It Readable\n\nWhile Mockito is powerful,\
    \ raw `verify()` calls can get clunky. Let’s improve things:\n\n- Static Imports:\
    \ `import static org.mockito.Mockito.*;` cleans up your test code.\n- Custom Matchers:\
    \ Combine with `verify` for domain-specific checks (e.g., `verify(mailer).sendWelcomeMessage(wasAddedToPremium(user));`).\n\
    - BDDMockito: `then(mock).should(...)` provides more fluent assertions, especially\
    \ in BDD-style tests.\n\n## 3. The ‘Other Side’ of Verification: `verifyNoInteractions()`\n\
    \nSometimes, ensuring things didn’t happen is equally important:\n\n```\nverifyNoInteractions(paymentServiceMock);\
    \  // Should not charge if order is incomplete\n```\n\n- Caution: Overuse leads\
    \ to brittle tests. Isolate your SUT well; otherwise, this breaks if anything\
    \ touches the mock.\n\n## 4. Verification and BDD\n\nRecall our Given-When-Then\
    \ style. Verification often lives in the ‘Then’:\n\n```\n// Given\ngiven(inventoryServiceMock.hasItemsInStock(order)).willReturn(true);\n\
    \n// When\norderService.placeOrder(order);\n\n// Then\nthen(inventoryServiceMock).should(times(1)).reduceStock(order);\n\
    then(notificationServiceMock).should().send(\"Order Placed\", ...);\n```\n\n##\
    \ 5. Common Pitfalls\n\n- Verifying Implementation, Not Behavior: Do your verifications\
    \ focus on low-level details or the observable outcome?\n- Test Doubles as Spies:\
    \ If you feel the need to heavily verify mocks, it might be a sign your SUT is\
    \ doing too much.\n- Forgetting `verify()`: A common mistake! Stubs work even\
    \ without verification, but your test won’t catch unintended side effects.\n\n\
    ## 6. When Verification Might Be Overkill\n\n- TDD with Fine-Grained Steps: During\
    \ the red-green-refactor cycle, verification might be temporary as you flesh out\
    \ the implementation.\n- Pure Functions: If your SUT’s methods have no side effects,\
    \ traditional assertions on their return values are often enough.\n\n### Balancing\
    \ Verification and Readability\n\nIt’s an art! Aim for tests that clearly express\
    \ the intent and the mechanism of how the system should operate. Overly detailed\
    \ verifications can hinder refactoring and make tests harder to understand.\n\n\
    ### Next: Argument Capture\n\nWe’ve checked that calls happen with the right arguments.\
    \ But what if we need to inspect those arguments within our test assertions? That’s\
    \ where Argument Capture comes in!\n\n### Additional Resources\n\n- Mockito’s\
    \ `InOrder` verification [https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/InOrder.html](https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/InOrder.html)\n\
    - Discussion on Verification Overuse: [https://martinfowler.com/articles/mocksArentStubs.html](https://martinfowler.com/articles/mocksArentStubs.html)\n\
    \nAre you ready to master the art of ensuring your mocks are used as expected?\n\
    \n## Grasping Argument Capturing in Mockito – Part 1\n\nLet’s explore how Mockito’s\
    \ Argument Capture allows us to examine the values passed into our mocks, opening\
    \ up a whole new dimension of testing possibilities.\n\n## 1. Beyond Verification:\
    \ Inspecting Arguments\n\nThink of scenarios like these:\n\n- Calculating Values:\
    \ You don’t just verify a calculation service was called, you need to assert on\
    \ the result based on the input.\n- Message Formatting: Ensure that a notification\
    \ service constructs the message with the correct data.\n\n## 2. Introducing `ArgumentCaptor`\n\
    \nMockito’s solution is the `ArgumentCaptor` class:\n\n```\n@Captor\nprivate ArgumentCaptor<Order>\
    \ orderCaptor;\n\n@Test\nvoid orderProcessingUpdatesInventory() {\n    // ...\
    \ setup ...\n    orderService.processOrder(order);\n    verify(inventoryServiceMock).reduceStock(orderCaptor.capture());\n\
    \    Order capturedOrder = orderCaptor.getValue();\n    // ... assertions on capturedOrder\n\
    }\n```\n\nLet’s break this down:\n\n- `@Captor`: This annotation magically creates\
    \ an `ArgumentCaptor`.\n- `capture()`: Places the argument passed to the mock\
    \ into the Captor.\n- `getValue()`: Retrieves the captured value for assertions.\n\
    \n## 3. Captor Flexibility\n\n- Generic Type: `ArgumentCaptor<Order>` ensures\
    \ it only captures `Order` objects.\n- `getAllValues()`: Capture multiple invocations\
    \ if needed.\n- Captor with Matchers: You can even use `argThat(...)` within a\
    \ `verify` call for more sophisticated matching.\n\n## 4. Use Cases\n\n- Complex\
    \ Assertions: When assertions on your inputs and outputs are intricate.\n- Modifying\
    \ & Reusing: Capture a value, modify it, and potentially pass it to another mock.\n\
    - When State Is Hard to Access: The mock’s internal state is inaccessible, but\
    \ its behavior on certain inputs reveals what’s going on.\n\n## 5. A Word of Caution\n\
    \n- Potential Overuse: Can lead to tests tightly coupled to the implementation\
    \ and less focused on the end result.\n- Balance: Use it judiciously, alternating\
    \ with verification-only tests where appropriate.\n\n### Example: Email Formatting\n\
    \n```\n@Captor\nArgumentCaptor<String> emailCaptor;\n\n// ...\nverify(emailService).send(anyString(),\
    \ eq(\"Order Placed\"), emailCaptor.capture());\n\nString capturedBody = emailCaptor.getValue();\n\
    assertTrue(capturedBody.contains(order.getId()));\n```\n\nPart 2: Power Techniques\n\
    \n## Harnessing the Power of Argument Capturing – Part 2\n\nIn this chapter, we’ll\
    \ go beyond the basics and explore more applications.\n\n## 1. Capturing Multiple\
    \ Arguments\n\nWhat if a method has more than one parameter you want to inspect?\n\
    \n```\n@Captor\nArgumentCaptor<String> addressCaptor;\n\n@Captor\nArgumentCaptor<Double>\
    \ amountCaptor;\n\n// ... in the test ...\nverify(paymentServiceMock).processRefund(addressCaptor.capture(),\
    \ amountCaptor.capture());\n```\n- Create multiple captors, one for each argument.\n\
    \n## 2. Captor with Matchers\n\nCombine the power of matchers with capturing for\
    \ fine-grained control:\n\n```\n@Captor\nArgumentCaptor<Payment> paymentCaptor;\n\
    \nverify(paymentServiceMock).processRefund(\n    argThat(payment -> payment.getAmount()\
    \ > 100.0 && payment.getStatus().equals(\"PENDING\"))\n);\n\nPayment capturedPayment\
    \ = paymentCaptor.getValue();\n```\n\n## 3. When Argument Capture Shines\n\nHere\
    \ are some scenarios where the extra power is truly useful:\n\n- State Changes:\
    \ Your SUT modifies an input, and you need to assert on the modifications.\n-\
    \ Generated Values: The SUT creates an ID or timestamp; you want to capture it\
    \ for later use.\n- No Accessors: The mock collaborates with a class that lacks\
    \ getters, but its behavior on certain inputs reveals what’s happening.\n\n##\
    \ 4. Case Study: Order Processing with Discounts\n\nLet’s imagine our `OrderService`\
    \ now applies discounts:\n\n```java\nclass OrderService {\n    // ...\n    public\
    \ void applyDiscount(Order order, Discount discount) {\n        // Complex logic\
    \ to modify the order based on the discount\n    }\n    // ...\n}\n```\n\nOur\
    \ Test Might:\n\n1. Create an `ArgumentCaptor<Order>`.\n2. Invoke `orderService.applyDiscount(...)`.\n\
    3. Capture the modified `Order`.\n4. Assert that the discount was correctly factored\
    \ into the order’s total.\n\n## 5. Considerations\n\n- Don’t Overmix with `thenReturn()`:\
    \ If you can directly stub a result, there’s usually no need to capture.\n- Readability:\
    \ If captures make your test logic overly convoluted, refactor or consider simpler\
    \ assertions.\n\n### Best Practices\n\n- Clear Intent: Why are you capturing?\
    \ The test name and comments should explain it.\n- Focused Assertions: Don’t try\
    \ to assert everything about the captured value; keep your tests to the point.\n"
