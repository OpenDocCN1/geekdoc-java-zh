  trans: "\n\n* Mockito BDD 扩展: [`javadoc.io/doc/org.mockito/mockito-bom/latest/org/mockito/bdd/package-summary.html`](https://javadoc.io/doc/org.mockito/mockito-bom/latest/org/mockito/bdd/package-summary.html)\n\
    * 空方法存存桩: [`javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#stubbing_consecutive_calls`](https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#stubbing_consecutive_calls)\n\
    \n你准备好应对普通的存桩（stubbing）不够用的情况了吗？让我们探索 Mockito 更复杂的部分吧！\n\n# 应对复杂的 Stub 场景 – 第\
    \ 4 部分\n\n在本章中，我们将处理一些可能会让你怀疑人生的场景，但别担心，我们会变得更强大！\n\n## 1. 当存桩反击时：递归调用\n\n想象正在测试一个方法，该方法本身会调用同一个\
    \ mock 对象上的另一个方法：\n\n```java\n// 我们有一个具有自引用方法的服务：\n\nclass InventoryService {\n\
    \    ...\n    public int calculateAvailableStock(Product product) {\n        int\
    \ inStock = getStockCount(product);  // 调用了自身的方法（同一个 mock）\n        // ...更多逻辑...\n\
    \    }\n    ...\n}\n```\n\n* **解决方案 1**: `thenCallRealMethod()`。如果合适，让初始存桩触发递归部分的真实行为。\n\
    * **解决方案 2**: 重构。如果可能的话，将递归逻辑拆分到可测试的辅助方法中，使你的代码整体更加整洁。\n\n## 2. Mock 无法 Mock 的对象？\n\
    \n* **Final 类/方法**：我们见过 PowerMock 是一个解决方案，但请注意权衡（复杂性、配置）。请认真考虑先重构 SUT（被测单元）。\n\
    * **第三方类**：如果你无法控制代码，编写一个你所控制的薄封装类（wrapper class）可能是你的最佳选择。这允许你引入一个接口以提高可测试性。\n\
    \n## 3. 过度热心的 Mock 案例\n\nMockito 默认对即使对于未存桩的方法也会返回“合理”的值（空集合、基本数据类型的 0 等）。有时，这会隐藏\
    \ Bug！\n\n```java\nwhen(shippingServiceMock.calculateRates(any())).thenReturn(ratesList);\n\
    \n// 如果 mock 上的 getSupportedCountries() 从没有被存桩过会怎样？\n\nif(shippingServiceMock.getSupportedCountries().contains(\"\
    CA\"))  { ...  }\n```\n\n* **解决方案 1**: `Mockito.RETURNS_DEEP_STUBS` – Mock 的行为会更严格。\n\
    * **解决方案 2**: `verifyNoMoreInteractions(...)` – 确保 mock 仅按你预期的方式被使用。\n\n## 4.\
    \ 测试交互，而不仅仅是结果\n\n假设你不太关心返回值，而更关心 mock 是否在交互中被使用过。\n\n```java\n// 服务是否真的触发了 repository\
    \ 来执行保存？\n\nverify(productRepositoryMock, times(1)).save(any(Product.class));\n\
    ```\n\n## 5. 复杂存桩的最佳实践\n\n* **隔离 SUT**：存桩越复杂，SUT 的设计出现问题的概率越大。力求易于测试的单元。\n* **测试意图**：问问自己，“我在这里到底在测试什么？”这将引导你的存桩策略。\n\
    * **注释作为最后手段**：如果你发现自己需要复杂的注释来解释你的存桩，那这是一个红灯！\n\n### 驯服存桩的复杂性\n\n复杂的存桩是一个潜在更大问题的症状——代码紧耦合。虽然\
    \ Mockito 强大强大，但最好的测试是伴随着设计良好、模块化的代码的。\n\n### 下一步：使用 Mockito 进行行为驱动测试\n\n让我们探索\
    \ Mockito 如何与正式的 BDD 方法集成以规范并测试系统行为！\n\n### 额外资源\n\n* 设计与 Mock 的权衡：[`martinfowler.com/articles/mocksArentStubs.html`](https://martinfowler.com/articles/mocksArentStubs.html)\n\
    \n准备好与那些顽固的 Mock 场景搏斗了吗？\U0001F4AA\n\n# 拥抱 BDD 风格：实现 Given-When-Then 方法 – 第 1\
    \ 部分\n\n让我们探索 Mockito 如何赋予你以行为驱动开发（BDD）风格编写测试的能力，提升可读性和表达力，并使其与我们自然思考需求的方式保持一致！\n\
    \n## 2. 什么是 BDD（在测试世界中）？\n\n* **关注行为**：较少关注代码如何工作，更多关注从用户角度看它实现了什么。\n* **协作**：通过使用共享语言弥合技术和非技术利益相关者之间的鸿沟。\n\
    * **活规范**：测试成为特征的清晰描述，而不仅仅是断言的堆砌。\n\n## 2. “Given-When-Then”结构\n\nBDD 测试的核心在于这种模式：\n\
    \n* **Given（假设）**：场景的初始上下文或设置。（将其视为你的前提条件）。\n* **When（当）**：正在测试的动作或触发因素。\n* **Then（那么）**：预期的结果或观测结果。\n\
    \n### 示例：电子商务订单处理\n\n* *Given* 客户购物车中有物品\n* *When* 当他们下单时\n* *Then* 订单状态为“已确认”\n\
    * *And* 发送了订单确认邮件\n\n## 3. Mockito + BDD\n\n虽然 Mockito 支持基本的 BDD，但让我们使用 `BDDMockito`\
    \ 来更多功能：\n\n* `given(...).thenReturn(...)` 读起来像一个自然的句子\n* `given(...).thenThrow()`,\
    \ `willAnswer()`，等。用于其他存桩\n\n### 代码示例\n\n```java\n// 旧样式\nwhen(serviceMock.isStock(\"\
    123\")).thenReturn(true);\n\n// BDD 样式\ngiven(serviceMock.isStock(\"123\")).willReturn(true);\n\
    ```\n\n## 4. BDD 的优势\n\n* **可读性**：非程序员也能理解其意图。\n* **规范驱动**：测试关注行为。\n* **Mockito\
    \ 的谐**：Mockito 对交互的关注完美融合。\n\n## 5. 注意事项\n\n* **冗长**：BDD 测试可能会更长，所以要平衡。\n* **理想选择**：对于复杂逻辑最有益。\n\
    * **它是一种工具**：有时 JUnit 风格的断言足够了。\n\n### 第 2 部分：将 BDD 化\n\n接下来，我们将深入一个更完整的示例，学习如何管理设置。\n\
    \n* GitHub  BDMockito：[`github.com/mockito/bddmockito`](https://github.com/mockito/bddmockito)\n\
    * BDD 简介（通用）：[`cucumber.io/docs/`](https://cucumber.io/docs/)\n\n你准备好将你的测试转换为清晰的规范了吗？\n\
    \n# 增强 BDD 风格 – 第 2 部分\n\n在本章中，我们将超越简单的示例，查看如何为复杂场景构建 BDD 风格的测试。\n\n## 1. 真实场景：物流\n\
    \n想象有一个 `ShippingCalculator` 根据订单总额、目的地决定费用。这里有一个 BDD 风格的测试：\n\n```java\nclass\
    \ ShippingCalculatorTest {\n    private ShippingCalculator shippingCalculator;\n\
    \    private LocationService locationServiceMock;\n    private Product productServiceMock;\n\
    \n    @BeforeEach\n    void setup() {\n        locationServiceMock = Mockito.mock(LocationService.class);\n\
    \        productServiceMock = Mockito.mock(ProductService.class);\n        shippingCalculator\
    \ = new ShippingCalculator(locationServiceMock, productServiceMock);\n    }\n\n\
    \    @Test\n    void shouldCalculateStandardShippingForDomesticOrders() {\n  \
    \      // Given\n        Order order = anOrder().withTotal(50.0).build();\n  \
    \      given(locationServiceMock.isDomestic(order.getAddress())).willReturn(true);\n\
    \n        // When\n        double shippingCost = shippingCalculator.calculateShipping(order);\n\
    \n        // Then\n        assertEquals(10.0, shippingCost);\n    }\n}\n```\n\n\
    ### 改进：\n\n* **流式构建器 (anOrder())**：使设置变得易读，考虑为此使用一个库。\n* **测试命名**：描述性的名称传达了场景。\n\
    \n## 2. 组合复杂的设置\n\n如果存在复杂的设置，BDD 测试不应该害怕变长一点：\n\n```java\n@Test\nvoid shouldApplyFreeShippingForOrdersOverThreshold()\
    \ {\n    // Given\n```\n\n"
- fmt: "\n```java\nOrder order = anOrder().withItems(someProduct(10.0), someProduct(45.0)).build();\n\
    \ngiven(productServiceMock.isEligibleForFreeShippingPromotion(order)).willReturn(true);\n\
    \n// ... rest of the test ...\n\n}\n```\n\n- **Clarity over Brevity**: If the\
    \ scenario is complex, break setup into logical steps.\n- **Helper Methods**:\
    \ `someProduct()`, etc., encapsulate the creation of test data.\n\n## 3. The ‘Then’\
    \ Phase: Expressive Assertions\n\n- **BDDMockito** `then(mock)...should()`: Use\
    \ for verifying mock interactions in a BDD style.\n- **Custom Matchers**: Combine\
    \ with `Mockito` for domain-specific assertions (`“shouldHaveDiscountApplied”`).\n\
    - **Hamcrest**: We’ll cover this in-depth later; it offers powerful matchers!\n\
    \n## 4. BDD Anti-Patterns to Avoid\n\n- **Overly Rigid Structure**: Don’t let\
    \ `Given-When-Then` stifle flexible test design.\n- **One Scenario per Test Method**:\
    \ Sometimes grouping related sub-scenarios makes sense for efficiency.\n- **Neglecting\
    \ Traditional Asserts**: `assertEquals` and friends are still invaluable!\n\n\
    ## 5. Organizing BDD Tests\n\n- **Nested Classes**: Can group scenarios related\
    \ to specific features/components.\n- **Feature Files (Cucumber)**: If you want\
    \ full-blown BDD tooling, consider `Cucumber`, which integrates with `JUnit`.\n\
    \n# Next: Making BDD Tests Shine\n\nIn Part 3, we’ll refine the readability aspect\
    \ even further, explore how BDD tests evolve over time, and discuss when BDD might\
    \ not be the perfect fit.\n\n## Additional Resources\n\n- **Example of Fluent\
    \ Builders**: [https://github.com/eugenp/tutorials/tree/master/patterns/fluent-builder](https://github.com/eugenp/tutorials/tree/master/patterns/fluent-builder)\n\
    - **Cucumber – BDD Tool**: [https://cucumber.io/](https://cucumber.io/)\n\nAre\
    \ you starting to see how BDD and `Mockito` combine to create clear, expressive\
    \ tests? Let’s perfect this style!\n\n# Perfecting BDD Style – Part 3\n\nIn this\
    \ chapter, we’ll focus on maintainability, the evolution of a BDD test suite,\
    \ and discuss when BDD might not be the optimal choice.\n\n## 1. The Living Specification\n\
    \nBDD tests, at their best, serve as easily understood documentation of system\
    \ behavior. To keep them this way:\n\n- **Strive for a Ubiquitous Language**:\
    \ Collaborate with domain experts to ensure your test scenarios align with how\
    \ business users describe the system.\n- **Refactor Fearlessly**: As code evolves,\
    \ refactor your BDD tests (both setup and assertions) to maintain clarity.\n\n\
    ### Example: Renaming Changes Things\n\nSuppose `isDomestic(address)` is renamed\
    \ to `isShippingWithinCountry(...)`. Refactor your tests accordingly! The BDD\
    \ layer helps drive meaningful code changes.\n\n## 2. BDD as a Collaboration Tool\n\
    \n- **Early Feedback**: Share BDD test scenarios with stakeholders before full\
    \ implementation to expose misunderstandings early.\n- **Driving Design**: Use\
    \ the process of writing BDD tests to shape the API/interface of your `SUT`, focusing\
    \ on what it does from the outside.\n- **Pair Programming**: Devs and QA can pair\
    \ on writing BDD scenarios – excellent knowledge-sharing!\n\n## 3. When BDD May\
    \ Fall Short\n\nIt’s important to be pragmatic, not dogmatic. BDD might not be\
    \ ideal for:\n\n- **Low-Level Algorithms**: Tests focused on intricate calculations\
    \ often read better with classic assertions.\n- **Heavy Use of TDD**: TDD’s extremely\
    \ iterative style can clash with BDD’s up-front scenario definition.\n- **Exploratory\
    \ Testing**: Where requirements are vague, a spike implementation first might\
    \ make more sense.\n\n## 4. Tooling and Beyond\n\n- **Cucumber**: If you want\
    \ the full-Gherkin (“Given-When-Then” in a textual format), `Cucumber` integrates\
    \ with `JUnit`.\n- **Behavior-Driven Frameworks**: `JBehave` (Java), `SpecFlow`\
    \ (.NET), and others exist, offering rich ecosystems.\n- **Don’t Forget “Normal”\
    \ Mockito**: Even in BDD tests, `Mockito`’s stubbing and verification are core\
    \ to what you do.\n\n## 5. Evolving Your Testing Style\n\nHere’s a possible progression\
    \ as you master testing:\n\n1. **Basic JUnit & Asserts**: Getting those green\
    \ bars!\n2. **Mockito for Isolation**: Mocking out collaborators.\n3. **BDD for\
    \ Key Features**: Applying it to areas with high business value.\n4. **Hamcrest\
    \ for Readability**: Powerful assertions (we’ll explore this soon!).\n5. **Refactoring\
    \ for Maintainability**: Keeping tests aligned with the code.\n\n### Continuous\
    \ Improvement!\n\nTesting is a skill. The more you do, the better you’ll intuit\
    \ which tool is the right one for a given problem.\n\n## Additional Resources\n\
    \n- **Cucumber – BDD Tool**: [https://cucumber.io/](https://cucumber.io/)\n- **Introduction\
    \ to JBehave (another BDD tool)**: [https://jbehave.org/](https://jbehave.org/)\n\
    \n# Verifying Calls on Mocks – Part 1\n\nLet’s dive into the crucial aspect of\
    \ verifying how our mocks are used within tests. This ensures our units not only\
    \ produce the right output, but interact with their collaborators in the expected\
    \ manner.\n\n## 1. Beyond “Does it Return the Right Thing?”\n\n- **Behavior, Not\
    \ Just State**: Well-written unit tests assert how a system behaves, not merely\
    \ the end state.\n- **Example**: `OrderService` shouldn’t just return “success”;\
    \ it also interacts with `InventoryService`.\n\n## 2. Mockito’s `verify()` Method\n\
    \nThis is our core tool for verification:\n\n```java\n@Test\nvoid orderPlacementTriggersUpdate()\
    \ {\n    // ... setup ...\n    orderService.placeOrder(order);\n    verify(inventoryService).reduceStock(order);\n\
    }\n```\n\n- **Important**: Verification should generally happen after the code\
    \ under test has been exercised.\n\n## 3. Verification Modes\n\n- `verify(mock,\
    \ times(n))`: Did the interaction happen a specific number of times?\n- `atOnce()`,\
    \ `atLeast(n)`, `atMost(n)`, `never()`: Flexibility on call count.\n\n## 4. Veri-fying\
    \ with Argument Matchers\n\nOften, you don’t care about all argument details:\n\
    \n```java\nverify(notificationServiceMock).send(\n    eq(\"Order Placed\"),\n\
    \    anyString(),\n    argThat(address -> address.contains(\"@example.com\"))\n\
    );\n```\n\n- We’ve seen `eq()`, `anyString()`, and a custom matcher here!\n\n\
    ## 5. Considerations\n\n- **Over-Specification**: Are you verifying low-level\
    \ details that tie your test too closely to the implementation?\n- **Test Intent**:\
    \ What are you really checking with a verification?\n- **Ordering (Usually Doesn’t\
    \ Matter)**: By default, Mockito doesn’t care if `updateStock()` was called before\
    \ `sendNotification()`, unless your logic dictates that.\n\n## 6. Careful with\
    \ `verifyNoInteractions()`\n\n`verifyNoInteractions(inventoryServiceMock);`\n\n\
    - **Use-cases**: Ensuring your mock isn’t used in unexpected ways.\n- **Risk**:\
    \ Can make tests brittle by implying only the explicitly stubbed and verified\
    \ methods should be touched.\n\n### Example: When Verification Helps Refactoring\n\
    \nSuppose your `OrderService` calls several methods on `InventoryService`. A verification\
    \ test ensures that if you refactor the internals of `OrderService`, you don’t\
    \ accidentally break the expected interactions.\n\n# Next: More Verification Power\n\
    \nNext, we’ll look at verifying call order, techniques to make verifications more\
    \ readable, and the interplay between verification and BDD-style testing.\n\n\
    ## Additional Resources\n\n- **Mockito Verify Documentation**: [https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#verification](https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#verification)\n\
    \n# Mastering Call Verification Techniques – Part 2\n\nLet’s delve deeper into\
