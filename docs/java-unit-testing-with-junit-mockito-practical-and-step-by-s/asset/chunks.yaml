  trans: "\n```java\nMockitoSettings.strictness(Strictness.STRICT_STUBS);\n```\n\n\
    ### @Mock 注解调整：`@Mock` 注解具有可选字段：\n\n* `name`: 为 mock 对象提供显式名称，有助于调试。\n* `answer`:\
    \ 定义默认的回答行为（很少需要）。\n* `extraInterfaces`: 让你的 mock 对象实现额外的接口。\n\n### 3. 注解与 Spring：强大的组合\n\
    \n在 Spring 应用中，Mockito 的注解可以完美集成，从而简化集成测试的设置：\n\n* `@SpringBootTest`: 用于启动你的 Spring\
    \ 上下文的注解。\n* `@MockBean`: 用 Mockito mock 对象替换上下文中的 Spring 豆（beans）。\n* `@Autowired`:\
    \ 将你的 mock 对象（以及其他 豆）直接注入到你的测试中。\n\n#### 示例：Spring 集成测试\n\n```java\n@SpringBootTest\n\
    class OrderServiceIntegrationTest {\n    @Autowired OrderService orderService;\n\
    \    @MockBean InventoryService inventoryServiceMock;\n\n    @Test\n    void orderFlowIntegration()\
    \ {\n        // 测试你的订单服务，库存调用已被 mock 了！\n    }\n}\n```\n\n### 4. 最佳实践回顾\n\n让我们强化一些关键点：\n\
    \n* **清晰优于简洁（有时如此）**：如果少量的手动设置（例如，通过 `@Before` 方法）能让你的测试意图清晰得多，请尽管这样做。\n* **Mockito\
    \ 是工具，而不是宗教**：它的存在是为了帮助你以适合你项目的方式编写良好的测试。\n* **Spring 集成**：注解在这种语境下大放异彩，使得测试设置变得异常流畅。\n\
    \n#### 注意事项\n\n* **在 Spring 中过度 mock**：避免 mock Spring 可以为你提供的豆，因为这可能会掩盖集成问题。\n\
    * **无处不加注解**：注解很棒，但从根本上了解 Mockito 的工作原理仍然关关。不要过度依赖它们。\n\n到此，我们已经结束了这场专属 Mockito\
    \ 注解奥德赛之旅！\n\n### 额外资源\n\n* **Mockito 和 Spring 指南**：[`www.baeldung.com/mockito-spring`](https://www.baeldung.com/mockito-spring)\n\
    * **Mockito FAQ（包含注解注意事项章节）**：[`javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html`](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html)\n\
    \n# 利用 Mockito JUnit Rule：简化测试执行\n\n让我们探索 Mockito JUnit Rule 的细微差别，了解它何时是 `@RunWith`\
    \ 的价值替代方案，并看看它如何提高测试执行的灵活性。\n\n### 1. 回顾：Rule 与 Runner（运行器）\n\n* `@RunWith(MockitoJUnitRunner.class)`：将\
    \ Mockito 的行为应用于你测试类中的所有测试。\n* `@Rule public MockitoRule rule = MockitoJUnit.rule();`：在单个测试方法级别提供\
    \ Mockito 功能。\n\n**主要区别**：runner 是类级别的；而 rules 的细粒度更细。\n\n### 2. 为什么考虑 Rule？\n\
    \n以下是 rule 发挥作用的某些场景：\n\n* **混合 JUnit Rules**：你的测试需要组合自定义规则或其他测试框架提供的规则。\n* **旧版\
    \ JUnit**：与早于 4.7 版本的 JUnit 版本（该版本引入了 `@RunWith`）保持兼容。\n* **细粒度控制**：你刻意只想将 Mockito\
    \ 的行为应用于特定的测试方法，而不是整个类。\n* **隔离**：如果你担心 Mockito 的初始化与其他测试工具的行为之间可能存在冲突。\n\n###\
    \ 3. 示例：组合规则\n\n假设要测试一个带有 Spring 依赖的类，并且需要一个自定义规则来重置数据：\n\n```java\n@SpringBootTest\n\
    public class OrderServiceTest {\n    @Rule\n    public MockitoRule mockitoRule\
    \ = MockitoJUnit.rule();\n    @Rule\n    public TemporaryFolder tempFolder = new\
    \ TemporaryFolder(); // 创建临时文件的 JUnit 规则\n    @Autowired OrderService orderService;\n\
    \    @MockBean InventoryService inventoryServiceMock;\n    // ... 同时使用 Mockito\
    \ 和 tempFolder 能力的测试 ...\n}\n```\n\n### 4. 使用方法：Rule vs. Runner\n\n在大多数情况下，你编写单个测试的方式几乎没有变化：\n\
    \n* `@Mock`：工作相同。\n* `@Captor`, `verify()`, `when()`：用法相同。\n\n**主要区别**：使用 `@RunWith`\
    \ 时，任何未通过注解创建的 mock 都需要 `MockitoAnnotations.openMocks(this)`。使用 rule 时，在测试方法中无需这种手动初始化。\n\
    \n### 5. 注意事项\n\n* **稍显繁琐**：每个使用 rule 的测试都需要声明字段。\n* **最佳适用**：rule 并不是 runner\
    \ 的替代品。runner 可能是你的默认选择；只有当它的优势符合你特定的测试需求时再使用 rule。\n\n#### 权衡\n\n一如既常，关键在于选择正确的工具：便利性与灵活性。Mockito\
    \ 为你提供了两种选择！\n\n### 额外资源\n\n* **JUnit Rule 的 Mockito Javadoc**：[`javadoc.io/static/org.mockito/`](https://javadoc.io/static/org.mockito/)\n\
    \n# 下一站：Mockito & Spring\n\n让我们开启进入测试核心的之旅\n\n### 1. 为什么 Mockito & Spring 是绝佳组合\n\
    \n* **依赖注入**：Spring 鼓励组件具有 `@Autowired` 的设计。\n* **隔离**：Mockito 替换豆，避免了潜在的冲突。\n\
    * **简化测试设置**：Mockito 的注解显著减少了你编写的代码量。\n* **Spring 集成**：注解增强了你的体验。\n\n### 2. 关键要素\n\
    \n让我们介绍 Spring 的核心组件：\n\n* `@SpringBootTest`：该注解是基础。它启动你的 Spring 环境。\n* `@RunWith(SpringRunner.class)`（或\
    \ JUnit 5 等效物）：一个 JUnit runner。\n* `@MockBean`：主角！它告诉 Spring 替换上下文中的豆。\n* `@Autowired`：用于注入豆（包括真实的和\
    \ mock）。\n\n### 3. 基础场景\n\n考虑一个典型的 Spring 服务：\n\n```java\n@Service\npublic class\
    \ OrderService {\n    @Autowired InventoryService inventoryService;\n    public\
    \ void processOrder(Order order) {\n        if (inventoryService.isInStock(order.getProductId()))\
    \ {\n            // 复杂的订单处理\n        } else {\n            throw new InsufficientInventoryException();\n\
    \        }\n    }\n}\n```\n\n#### 使用 Mockito 和 Spring 进行测试\n\n```java\n@SpringBootTest\n\
    @RunWith(SpringRunner.class)\npublic class OrderServiceTest {\n    @Autowired\
    \ OrderService orderService;\n    @MockBean InventoryService inventoryServiceMock;\n\
    \n    @Test\n    public void orderProcessing_WithInventory_Success() {\n     \
    \   // 设置 mock 行为\n        when(inventoryServiceMock.isInStock(anyInt())).thenReturn(true);\n\
    \        // 执行被测方法\n        orderService.processOrder(new Order(...));\n     \
    \   // 此处预期异常，因为库存检查应该通过\n    }\n}\n```\n\n注意：\n\n* Spring 上下文被加载了（@SpringBootTest`）。\n\
    * 我们的 `InventoryService` 被替换为了 mock（@MockBean`）。\n* 我们控制了 mock 的行为并将所有内容注入 `OrderService`（@Autowired`）。\n\
    \n### 4. 真实性与控制\n\nSpring 集成测试的一个关键方面是取得平衡：\n\n* **过度 mock**：你可能会没有测试到集成点本身。\n\
    * **mock 过少**：你的测试可能会变得缓慢、不稳定或依赖外部资源。\n\n找到平衡点对于有效的测试至关重要！\n\n第二部分：深入探索\n"
- fmt: "\nNext, we’ll explore testing data access layers, verifying interactions with\
    \ mocks, and more advanced Spring testing scenarios.\n\n## Additional Resources\n\
    \n- Spring Framework Testing Guide: [https://docs.spring.io/spring-framework/docs/current/reference/html/testing.html](https://docs.spring.io/spring-framework/docs/current/reference/html/testing.html)\n\
    - Mockito + Spring Example: [https://www.baeldung.com/mockito-spring](https://www.baeldung.com/mockito-spring)\n\
    \nReady to take your Spring testing to the next level?\n\n# Real-World Application\
    \ of Mockito with Spring – Part 2\n\nLet’s continue our Spring & Mockito integration\
    \ journey and explore more advanced scenarios.\n\n### 1. Testing Spring Data Repositories\n\
    \nSpring Data brings a powerful abstraction layer for database interactions. Let’s\
    \ see how Mockito fits in:\n\n- `@DataJpaTest`: A focused variant of `@SpringBootTest`,\
    \ configured primarily for testing data access logic.\n- `@AutoConfigureTestDatabase`:\
    \ Use this if you want an in-memory database (like `H2`) for the test, avoiding\
    \ hitting a real database.\n\n#### Example Repository Test\n\n```\n@DataJpaTest\n\
    @AutoConfigureTestDatabase(replace = AutoConfigureTestDatabase.Replace.NONE)\n\
    public class ProductRepositoryTest {\n    @Autowired private ProductRepository\
    \ productRepository;\n    @MockBean private InventoryService inventoryServiceMock;\n\
    \n    @Test\n    public void findByCategory_Success() {\n        when(inventoryServiceMock.productCodeExists(\"\
    CODE123\")).thenReturn(true);\n        List<Product> products = productRepository.findByCategory(\"\
    Electronics\");\n        // Assert on the retrieved products...\n    }\n}\n```\n\
    \n#### Observations:\n\n- Our repository is injected (`@Autowired`).\n- We still\
    \ selectively mock collaborators of the repository if needed.\n\n### 2. Verifying\
    \ Interactions with Spring Beans\n\nRecall that Mockito’s `verify()` is a potent\
    \ tool. In Spring tests, we often want to verify how our mocks were used by the\
    \ Spring-managed components:\n\n```java\n@Test\npublic void orderProcessing_InventoryUpdated()\
    \ {\n    // ... setup as before ..\n    orderService.processOrder(someOrder);\n\
    \    verify(inventoryServiceMock, times(1)).reduceStock(any());\n}\n```\n\n###\
    \ 3. Beyond Basics: Advanced Scenarios\n\n- **Spyying on Spring Beans**: If selectively\
    \ mocking only some methods of a Spring bean is needed, Mockito’s `@SpyBean` comes\
    \ to the rescue. (We’ll cover Spies in more detail soon!)\n- **Testing with Profiles**:\
    \ Spring’s profile support can be used to select different bean configurations\
    \ for your tests.\n- `@WebMvcTest`: Specialization of `@SpringBootTest` for testing\
    \ Spring MVC in isolation.\n\n### 4. Best Practices\n\n- **Test Slices**: Focus\
    \ on specific layers of your Spring (`@DataJpaTest`, `@WebMvcTest`, etc.) for\
    \ faster execution and targeted outcomes.\n- **Don’t Over-Mock Spring**: Let Spring\
    \ do its thing when it comes to wiring. Mock judiciously to isolate the unit you’re\
    \ testing.\n- **Embrace Constructor Injection**: This makes your components inherently\
    \ testable, simplifying both Mockito usage and Spring configuration.\n\n#### Trade-offs\n\
    \nAlways consider the speed vs. fidelity. Mocking heavily in Spring tests can\
    \ make them faster but less representative of the real system.\n\n#### Additional\
    \ Resources\n\n- Testing Spring Boot (Official Guide): [https://docs.spring.io/spring-boot/docs/current/reference/html/boot-testing.html](https://docs.spring.io/spring-boot/docs/current/reference/html/boot-testing.html)\n\
    - @SpyBean Documentation: [https://docs.spring.io/spring-framework/docs/current/javadoc-api/spring/boot/test/mock/MockitoPostProcessor.html#spybean-java.lang.Object-](https://docs.spring.io/spring-framework/docs/current/javadoc-api/spring/boot/test/mock/MockitoPostProcessor.html#spybean-java.lang.Object-)\n\
    \nNext Up: Mockito Spies!\nReady to delve into the intriguing world of partial\
    \ mocks with Mockito’s Spy? Let’s see how they empower us with more flexibility\
    \ in our tests.\n\n# Understanding Mockito Spy: Part 1\n\nLet’s get ready for\
    \ a deep dive into the world of Spies! Spies give us a nuanced way to blend real\
    \ object behavior with selective mocking, opening up new possibilities.\n\n###\
    \ 1. When Stubbing Isn’t Enough\n\nRemember, traditional Mockito mocks are ‘blank\
    \ slates’. They have no behavior of their own unless we stub it. But if:\n- You\
    \ want the majority of a class’s methods to function normally?\n- You need to\
    \ observe how certain methods were called on the real object?\n\nEnter the Spy!\n\
    \n### 2. Spying in Action\n\n- **Creation**: `spy()` creates a spy that wraps\
    \ around a real instance of your class.\n```java\nList<String> myList = new ArrayList<>();\n\
    List<String> spyList = Mockito.spy(myList);\n```\n- **Behavior**:\n    - **Real\
    \ by Default**: If you call a method without stubbing it, the spy will delegate\
    \ to the real underlying object.\n    - **Selective Mocking**: You can still use\
    \ `when(...).thenReturn(...)` to override behaviors if desired.\n\n### 3. Example:\
    \ Payment Service with Collaborator\n\n```javaclass PaymentService {\n    private\
    \ Logger logger;\n    public PaymentService(Logger logger) {\n        this.logger\
    \ = logger;\n    }\n    public void processPayment() {\n        // ... complex\
    \ payment logic ...\n        logger.info(\"Payment processed\");\n    }\n}\n```\n\
    \n**Test Scenario:**\n- Verify the payment logic works.\n- Ensure the logging\
    \ occurs as expected.\n\n**With a Spy:**\n\n```java\n@Test\npublic void processPayment_LogsInformation()\
    \ {\n    PaymentService paymentService = new PaymentService(new Logger());\n \
    \   PaymentService paymentServiceSpy = Mockito.spy(paymentService);\n    paymentServiceSpy.processPayment();\n\
    \    verify(paymentServiceSpy).info(\"Payment processed\"); // Success if the\
    \ real 'info' method was called\n}\n```\n\n### 4. Key Points\n\n- **Partial, Not\
    \ a Full Replacement**: Spies are best for targeted scenarios, not mocking everything.\n\
    - **Verification Power**: Spies are fantastic collaborators for using `verify()`\
    \ to check interactions on the partially mocked object.\n\nPart 2: More Spy Nuances,\
    \ Best Practices\nNext, we’ll delve into when to choose a spy over a mock, how\
    \ to spy on Spring beans, and the trade-offs to consider.\n\n#### Additional Resources\n\
    \n- Mockito’s Spy Documentation: [https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#3](https://javadoc.io/static/org.mockito/mockito-core/3.12.4/org/mockito/Mockito.html#3)\n\
    \nLet’s get even more sophisticated with our testing – prepare for Spy mastery!\n\
    \n# Embracing Mockito Spy: Part 2\n\nLet’s wrap up our Mockito and Spring journey\
    \ and explore even more advanced uses of spies.\n\n### 1. Spying on Spring Beans\n\
    \nMockito’s `@SpyBean` is designed specifically for integrating spies into your\
    \ Spring tests:\n- **In the Test Class**: Declare a field with `@SpyBean`.\n-\
    \ **Spring Injects**: During the test, Spring will inject a spy wrapping a real\
    \ bean from the application context.\n\n**Example:**\n\n```java\n@SpringBootTest\n\
    public class OrderServiceTest {\n    @SpyBean\n    private InventoryService inventoryService;\n\
    \    @Autowired\n    private OrderService orderService;\n\n    @Test\n    public\
    \ void orderFlow_verifyInventoryInteractions() {\n        orderService.processOrder(...);\n\
    \        verify(inventoryService, times(1)).reduceStock(any());\n    }\n}\n```\n\
    \n### 2. Best Practices for Spies\n\n- **Judicious Use**: A spy is most valuable\
    \ when you need a primarily real object with selective mocking, not the other\
    \ way around.\n- **Verification Focus**: The strength of spies lies in using them\
    \ with `verify()` to ensure certain methods on the real object were invoked as\
    \ expected.\n- **doReturn() with Caution**: While you can use `doReturn(...).when(...)`\
    \ with spies, be mindful that excessive stubbing can mask issues you’d want to\
    \ catch in a test.\n\n### 3. Spies vs. Mocks: Making the Choice\n\nLet’s crystallize\
    \ when to pick each:\n\n| Scenario | Use a Spy When… | Use a Mock When… |\n| :---\
    \ | :--- | :--- |\n"
