    \n    assertTrue(order.getState().matches(OrderState.SHIPPED));  // Custom matcher\n\
    \n}\n\nTest Timeouts\n\nRemember the  assertTimeout and  assertTimeoutPreemptively\
    \ methods? These are vital for ensuring your tests don’t hang indefinitely due\
