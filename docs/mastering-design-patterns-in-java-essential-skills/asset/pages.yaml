    # Thread Execution and the Runnable State


    After a thread is created and started using the start() method, it enters the
    runnable state. A thread in this state is considered to be executing its task.
    However, it''s important to note that calling start() doesn''t immediately execute
    the thread''s run() method. Instead, it signals the thread scheduler that the
    thread is ready to run. The scheduler then decides when to execute the thread
    based on thread prioritization and CPU availability.


    # The Lifecycle of a Thread in Java


    The lifecycle of a thread in Java includes several states:


    +   - **New:** The thread is created but not yet started.

    - **Runnable:** The thread is executing in the Java virtual machine but may be
    waiting for other resources from the operating system.

    - **Blocked:** The thread is blocked and waiting for a monitor lock to enter a
    synchronized block/method.

    - **Waiting:** The thread is waiting indefinitely for another thread to perform
    a particular action.

    - **Timed Waiting:** The thread is waiting for another thread to perform an action
    for up to a specified waiting time.

    - **Terminated:** The thread has completed its execution.'
