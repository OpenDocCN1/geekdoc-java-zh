    # 4.9 Memento Pattern: Capturing and Restoring an Object''s Internal State


    The Memento Pattern is a behavioral design pattern that allows an object to capture
    and externalize its internal state so that the object can be restored to this
    state later. This pattern is particularly useful in scenarios where you need to
    provide an undo mechanism or take snapshots of an object''s state that can be
    restored at a later stage without exposing the internals of the object.


    The Memento Pattern involves three key actors:


    +   - **Originator**: The object whose state needs to be saved and restored.

    - **Memento**: A lightweight object that stores the internal state of the originator.
    The memento object is passive; it only holds the state and has no logic of its
    own.

    - **Caretaker**: The object that keeps track of multiple memento objects. It decides
    when to save and restore the originator''s state.


