  md: '# 3.4 Proxy Pattern: Controlling Access to Objects


    The Proxy design pattern plays a pivotal role in controlling access to objects.
    It acts as a surrogate or placeholder for another object to control access to
    it. This is particularly useful in scenarios where direct access to an object
    is either undesirable or impractical due to reasons such as the need for security,
    cost of creating a full object, or the desire to add additional behaviors when
    an object is accessed. The proxy pattern introduces a level of indirection when
    accessing an object, allowing one to perform additional functionality either before
    accessing the target object, after accessing it, or in some cases, even avoiding
    accessing the object altogether.


    In Java, the Proxy pattern is implemented by creating a proxy class that encloses
    a reference to the object it intends to proxy. This proxy class implements the
    same interface as the target object, ensuring the proxy can stand in for the target
    object. Operations on the proxy are then interpreted, resulting in modifications
    to the target object or in additional behavior. There are several variations of
    the Proxy pattern, each with its specific use case, including Virtual Proxies,
    Protection Proxies, and Remote Proxies, among others.


    # Illustration with a Simple Example


    Consider a scenario where we have a Document interface representing various types
    of documents in our application. We want to implement lazy loading for large documents
    meaning we only create or load a document when it is actually needed. This can
    save resources and improve the application''s response time. Here, we use a Virtual
    Proxy.


    Firstly, we define the Document interface:'
