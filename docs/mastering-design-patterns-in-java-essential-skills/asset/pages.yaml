    The JCF is designed around a few interfaces, each serving different types of collections:


    +   - Collection - The root of the collection hierarchy. A collection represents
    a group of objects, known as its elements. This interface is the least common
    denominator that all collections frameworks implement.


    +   - Set - A collection that cannot contain duplicate elements. It models the
    mathematical set abstraction.


    +   - List - An ordered collection (also known as a sequence). The user can access
    elements by their integer index (position in the list), and search for elements
    in the collection.


    +   - Queue - A collection used to hold multiple elements prior to processing.
    Besides basic collection operations, queues provide additional insertion, extraction,
    and inspection operations.


    +   - Map - An object that maps keys to values. A map cannot contain duplicate
    keys; each key can map to at most one value.


    Each of these interfaces is implemented by multiple classes, such as ArrayList,
    HashSet, LinkedList, PriorityQueue, and HashMap, each offering specific behaviors
    suitable for different tasks.


