    for creating families of related or dependent objects without specifying their
    concrete classes. This pattern is particularly useful when a system needs to be
    independent from how its objects are created, composed, and represented. It emphasizes
    a group of related products which are designed to be used together, and hence,
    it ensures consistency among the products produced.


