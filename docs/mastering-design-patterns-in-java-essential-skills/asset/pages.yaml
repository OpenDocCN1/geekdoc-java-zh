  md: '# 1.3 The Types of Design Patterns: Creational, Structural, Behavioral


    Design patterns in software engineering are an essential tool, offering proven
    solutions to common problems encountered during software development. These patterns
    are categorized based on the nature of the problem they solve, leading to three
    main types: Creational, Structural, and Behavioral. Each category encompasses
    several patterns that share common goals and address specific aspects of software
    design and implementation, particularly in the Java programming environment.


    # Creational Patterns


    Creational design patterns focus on the process of object creation in software
    development. These patterns aim to abstract the instantiation process, making
    the system more independent of how its objects are created, composed, and represented.
    In Java, where creating objects directly, using the new operator, can sometimes
    lead to inflexible and tightly coupled code, creational patterns offer a way to
    introduce flexibility and encapsulation in the creation process.


    Some of the widely used creational patterns include:


    +   - Singleton Pattern ensures that a class has only one instance and provides
    a global point of access to that instance. It can be particularly useful in a
    Java application for logging, driver objects, caching, thread pools, and configuration
    settings.


    +   - Builder Pattern separates the construction of a complex object from its
    representation, allowing the same construction process to create various representations.
    This pattern is useful in Java when creating complex objects with numerous parameters,
    some of which may be optional.


    +   - Factory Method Pattern defines an interface for creating an object but lets
    subclasses the type of objects that will be created. This is particularly useful
    in Java for frameworks, where implementation details are expected to be extended
    by client developers.


    ![](img/fc18b6e271f00721fd88ebed58579bc2_16_0.png)'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Abstract Factory Pattern provides an interface for creating families of related
    or dependent objects without specifying their concrete classes. In Java, it promotes
    consistency among the products created.


    Prototype Pattern creates new objects by copying an existing object, known as
    the prototype. This pattern is used in Java when the cost of creating an object
    is more expensive or complex than copying an existing instance.


    # Structural Patterns


    Structural patterns are concerned with how classes and objects are composed to
    form larger structures. These patterns ease the design by identifying a simple
    way to realize relationships between entities. In Java, structural patterns help
    in forming a bridge between the abstraction and the implementation, making it
    easier to scale and maintain the application.


    Important structural patterns in Java include:


    +   - Adapter Pattern allows objects with incompatible interfaces to collaborate.
    This is particularly useful in Java when we want to use an existing class, and
    its interface doesn''t match the one we need.


    +   - Composite Pattern decomposes objects into tree structures to represent part-whole
    hierarchies. It lets clients treat individual objects and compositions of objects
    uniformly. This pattern is useful in Java for representing hierarchical structures
    such as graphic user interfaces or file systems.


    +   - Proxy Pattern provides a surrogate or placeholder for another object to
    control access to it. This can be useful in Java for implementing lazy initialization,
    access control, logging, monitoring, and securing access to remote objects.


    +   - Flyweight Pattern minimizes memory usage or computational expenses by sharing
    as much as possible with similar objects; it''s especially useful in Java for
    optimizing performance and memory use in large numbers of similar objects.


    +   - Bridge Pattern decouples an abstraction from its implementation so that
    the two can vary independently. This pattern is beneficial in Java for separating
    an interface from its implementation, allowing them to be modified independently.'
  merge: -1
