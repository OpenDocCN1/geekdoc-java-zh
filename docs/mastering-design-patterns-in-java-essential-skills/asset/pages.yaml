    The Composite pattern is a structural design pattern that allows you to compose
    objects into tree structures to represent part-whole hierarchies. This pattern
    provides a way to work with collections of objects and individual objects in a
    uniform manner. When applied to Java collections and streams, the Composite pattern
    can greatly enhance code readability, maintainability, and performance by treating
    single objects and collections of objects uniformly.


    The essence of the Composite pattern lies in the creation of an abstract class
    or interface that represents both primitives (individual objects) and their containers
