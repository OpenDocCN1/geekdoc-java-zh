    # 4.10 Chain of Responsibility Pattern: Passing Requests along a Chain of Handlers


    The Chain of Responsibility (CoR) pattern is a behavioral design pattern that
    allows an object to pass a request along a chain of potential handlers until one
    of them handles the request. This pattern decouples the sender of a request from
    its receivers by giving more than one object a chance to handle the request. It
    promotes the principle of least knowledge, encouraging minimal coupling between
    systems.'
