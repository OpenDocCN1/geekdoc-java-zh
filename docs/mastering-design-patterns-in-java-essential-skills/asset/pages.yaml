    ```

    List<Integer> numbers = Arrays.asList(1, 2, 3, 4);

    int sum = numbers.stream().reduce(0, (a, b) -> a + b);

    ```


    This eliminates the side-effects, making the operation safe for use in parallel
    streams and easier to reason about.


    # Leveraging Parallel Streams for Performance


    The Stream API introduced alongside lambda expressions in Java 8 supports functional-style
    operations on collections. One of its powerful features is the ability to easily
    parallelize operations to leverage multicore processors for improved performance.
    To use parallel streams effectively, it''s essential to understand when they are
    beneficial:


    +   * When working with large datasets.

    * When the cost of processing elements outweighs the overhead introduced by parallelization.

    * When operations are stateless and independent, avoiding the risk of thread interference
    or memory consistency errors.


    However, parallel streams may not always lead to improved performance and can
    introduce complexity if not used judiciously. Understanding the characteristics
    of the dataset and operations is key.


    // Sequential stream


    ```

    int sum = myList.stream().reduce(0, Integer::sum);

    ```'
