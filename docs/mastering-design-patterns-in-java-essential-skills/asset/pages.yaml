    # 4.7 Visitor Pattern: Adding Operations to Object Structures without Modifying
    Them


    The Visitor pattern stands out as a quintessential solution when it comes to extending
    the functionalities of an object structure without tampering with the actual structure
    itself. This pattern separates an algorithm from an object structure on which
    it operates. It achieves this by creating a Visitor class that implements a set
    of operations to be performed on the elements of the object structure. This dynamic
    mechanism allows adding new operations easily without modifying the objects on
    which it operates. This design is especially useful in situations where an object
    structure includes many classes of objects with differing interfaces, and you
    need to perform operations across these objects that depend on their concrete
    classes.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'The essence of the Visitor pattern lies in its ability to utilize double-dispatch.
    Basically, it''s a method of dispatching function call to different concrete classes.
    First dispatch determines the type of the Visitor, and the second dispatch determines
    the type of the element being visited. This process enables the Visitor to execute
    operation-specific to the element''s class.


    # Understanding the Components of the Visitor Pattern


    The Visitor pattern primarily involves two abstract classes or interfaces and
    their concrete implementations:


    +   * **Visitor Interface**: This defines a visit operation for each type of ConcreteElement
    in the object structure. Each operation is named with a unique identifier and
    the method signature typically includes a parameter for the element being visited.


    +   * **ConcreteVisitor**: Implements each visit operation declared by the Visitor.
    Each operation embodies the algorithm to be executed on the elements, which can
    vary as per the ConcreteVisitor.


    +   * **Element Interface**: An interface declaring an accept operation that takes
    a Visitor as an argument.


    +   * **ConcreteElement**: Implements the accept operation declared by the Element.
    This implementation usually includes a call to the visit method of the Visitor,
    passing itself as an argument.


    +   * **Object Structure**: A collection or composite of Elements that can iterate
    over its elements and allow a visitor to visit its elements.


