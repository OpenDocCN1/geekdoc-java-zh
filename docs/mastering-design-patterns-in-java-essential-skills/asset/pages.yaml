- img_proc: true
  md: 'A method reference can be thought of as a shorthand for a lambda expression
    that calls a single method. They are particularly useful for creating more readable
    and concise code. Consider the following transformation of a lambda expression
    using a method reference:


    ```

    // Using a lambda expression

    list.forEach(element -> System.out.println(element));


    // Using a method reference

    list.forEach(System.out::println);

    ```


    There are four kinds of method references:


    +   - Reference to a static method: **ContainingClass::staticMethodName**

    - Reference to an instance method of a particular object: **containingObject::instanceMethodName**

    - Reference to an instance method of an arbitrary object of a particular type:
    **ContainingType::methodName**

    - Reference to a constructor: **ClassName::new**


    Using method references when applicable can make your lambda expressions cleaner
    and easier to understand.


    # **Statelessness and Side-effects**


    When working with lambda expressions, it''s important to avoid maintaining state
    or causing side-effects. Lambda expressions are ideally stateless — they should
    not modify any state outside of their scope, ensuring predictability and thread
    safety. The following example demonstrates an undesirable use of lambda expressions
    with side effects:'
