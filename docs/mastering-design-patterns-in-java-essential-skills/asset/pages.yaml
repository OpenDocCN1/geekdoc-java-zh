    # 3.2 Adapter Pattern: Connecting Incompatible Interfaces


    The Adapter Pattern is a structural design pattern that enables objects with incompatible
    interfaces to collaborate. This pattern acts as a bridge between two incompatible
    interfaces or classes by converting the interface of one class into another interface
    that a client expects. In the context of Java, it is a powerful tool for ensuring
    seamless communication between objects that would otherwise not be able to interact
    due to mismatched interfaces.


    Consider the scenario where you have a client expecting data in a certain format,
    but the available service provides data in a different format. Directly connecting
    the client to the service would lead to compilation or runtime errors due to the
    interface incompatibility. This is where the Adapter Pattern comes into play,
    serving as an intermediary that translates or adapts the service''s interface
    into the form the client expects.


    The Adapter Pattern can be implemented in Java through two main approaches: the
    class adapter method, which uses inheritance, and the object adapter method, which
    relies on composition. Both methods aim to encapsulate the process of adaptation,
    but they do so by following different strategies.'
  merge: -1
  pgno: 104
- img_proc: true
  md: "# Class Adapter Method\n\nThe class adapter method employs inheritance to adapt\
    \ interfaces. It involves creating a new class (Adapter) that extends one of the\
    \ classes it intends to adapt and implements the target interface the client expects.\
    \ This method is best applied when you aim to adapt a single class.\n\n```\npublic\
    \ interface TargetInterface {\n    void targetMethod();\n\n}\n```\n\n```\npublic\
    \ class Adaptee {\n    public void incompatibleMethod() {\n        System.out.println(\"\
    Executed incompatibleMethod\");\n    }\n}\n```\n\n```\npublic class Adapter extends\
    \ Adaptee implements TargetInterface {\n    @Override\n    public void targetMethod()\
    \ {\n        incompatibleMethod();\n    }\n}\n```"
