    lambda expressions in Java and explore the critical concept of functional interfaces,
    which underpin the application of lambdas.


    # Syntax of Lambda Expressions


    A lambda expression in Java is characterized by the following syntax:


    ```

    (parameters) -> { body }

    ```


    The parameters section represents the parameters passed to the lambda. The arrow
    token "->" separates the list of parameters from the lambda body. The body contains
    expressions or statements to execute.


    Lambda expressions can have zero, one, or multiple parameters:


    +   * No parameters: ( ) -> System.out.println("Hello World")

    * One parameter: X -> X *

    * Multiple parameters: (x, y) -> x + y'
