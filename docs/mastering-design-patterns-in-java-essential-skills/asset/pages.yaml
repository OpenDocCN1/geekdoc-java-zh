  md: '# Anti-Patterns to Avoid


    +   - **Overusing Singletons:** While the Singleton pattern has its merits, overusing
    it can lead to issues like hidden dependencies, making unit testing difficult
    and hampering scalability.


    +   - **Excessive Use of Factories:** While factory patterns offer clear advantages,
    over-applying them where simple object creation would suffice unnecessarily complicate
    the codebase, leading to higher maintenance costs.


    +   - **Ignoring Principle of Least Knowledge:** Creational patterns should not
    expose more than necessary. For instance, a factory should only expose methods
    relevant to object creation, maintaining encapsulation and reducing dependency.


    +   - **Misusing Prototype for Mutable Objects:** Using the Prototype pattern
    without considering the mutability of the objects can lead to shared reference
    issues, where changes to a cloned object inadvertently affect the prototype.


    +   - **Complicated Builder Patterns:** While the Builder pattern is beneficial
    for constructing complex objects, overcomplicating the builder with too many options
    or steps can reduce the clarity and efficiency of the object creation process.


    Properly understanding and applying creational patterns can greatly enhance the
    design and maintainability of your Java applications. By adhering to the mentioned
    best practices and avoiding the outlined anti-patterns, developers can harness
    the true power of creational patterns, creating a codebase that is more efficient,
    scalable, and easier to understand.


