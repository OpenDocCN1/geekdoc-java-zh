    The Composite pattern is a pivotal structural design pattern that conceptualizes
    a group of objects to be treated in the same manner as a single instance of an
    object. The essence of this pattern is to compose objects into tree structures
    to represent part-whole hierarchies. This facilitates clients in treating individual
    objects and compositions of objects'
