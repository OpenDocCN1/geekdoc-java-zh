    - The ExecutorService extends Executor, adding features that help manage the lifecycle
    of both tasks and the executor itself. It provides methods for submitting callable
    tasks, shutting down the executor, and tracking the progress of tasks.

    - The ScheduledExecutorService extends ExecutorService, adding functionalities
    to schedule commands to run after a given delay or to execute repeatedly.


