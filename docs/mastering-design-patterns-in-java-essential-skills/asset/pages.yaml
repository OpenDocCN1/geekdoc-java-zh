    # 3.5 Flyweight Pattern: Minimizing Memory Usage through Sharing


    The Flyweight pattern is a structural design pattern that aims to minimize memory
    usage and improve performance by sharing as many data as possible with similar
    objects. It is particularly useful when a program must create a large number of
    similar objects. In Java, implementing the Flyweight pattern can substantially
    reduce the memory footprint of your application, making it more scalable and efficient.'
  merge: -1
  pgno: 115
- img_proc: true
  md: "The essence of the Flyweight pattern lies in its ability to segregate object\
    \ state into intrinsic and extrinsic states. The intrinsic state is invariant,\
    \ shared across many objects, and stored in the Flyweight itself. In contrast,\
    \ the extrinsic state varies between objects and is passed to the Flyweight when\
    \ its operations are invoked.\n\n# Understanding the Components of the Flyweight\
    \ Pattern\n\nThe Flyweight pattern comprises several key components:\n\n+   -\
    \ **Flyweight**: An interface through which flyweights can receive and act upon\
    \ extrinsic states.\n\n+   - **ConcreteFlyweight**: Implements the Flyweight interface\
    \ and stores intrinsic state. ConcreteFlyweights must be shareable and capable\
    \ of operating on extrinsic state.\n\n+   - **FlyweightFactory**: Manages flyweight\
    \ objects and ensures that flyweights are shared properly. When a client requests\
    \ a flyweight, this factory provides an existing instance or creates a new one\
    \ if none exists.\n\n+   - **Client**: Maintains references to flyweights along\
    \ with their extrinsic state. It computes or stores the extrinsic state of flyweights.\n\
