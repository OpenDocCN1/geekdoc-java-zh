    # 2.10 Best Practices and Anti-Patterns in Applying Creational Patterns


    Creational patterns in Java, as in any programming language, offer a structured
    approach to object creation. However, the benefits they bring can be undermined
    if not applied judiciously. This section explores the best practices to optimize
    the benefits of creational patterns, alongside common anti-patterns to avoid.


    # Best Practices


    +   - Know When to Use Which Pattern: Understanding the nuances and specific use
    cases for each creational pattern is paramount. For instance, the Singleton pattern
    is best for cases where exactly one instance of a class is needed throughout the
    application. Conversely, the Prototype pattern shines in scenarios requiring copies
    of a prototype object with potential variations.


    +   - Encapsulate What Varies: Encapsulation is a core principle of OOP that holds
    true for creational patterns. Abstracting the instantiation logic into factories
    or builders helps confine what varies, making your code more maintainable and
    scalable.


    +   - Prefer Composition Over Inheritance: Favoring composition over inheritance
    when applying creational patterns, such as utilizing a Factory Method in a composed
    class rather than an inherited one, can increase modularity and flexibility in
    your design.


    +   - Lazy Initialization for Resource Efficiency: For patterns like Singleton,
    adopting a lazy initialization strategy—where the instance is created only when
    needed—can improve resource utilization, especially if the instantiation is resource-intensive.


    +   - Limit the Use of Direct Constructors: Directly invoking constructors can
    make code harder to manage and less adaptable to change. Creational patterns act
    as a buffer, offering a more flexible approach to object creation.'
