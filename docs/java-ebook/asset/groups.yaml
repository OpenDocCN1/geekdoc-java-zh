    - Basics


    Java is a powerful general-purpose programming language. It is used to develop
    desktop and mobile applications, big data processing, embedded systems, and so
    on. According to Oracle, the company that owns Java, Java runs on 3 billion devices
    worldwide, which makes Java one of the most popular programming languages.


    ## Java Development Kit


    ![](img/5dd48e01a3cc15319489428476134150_5_0.png)


    We use Java Development Kit (JDK) to build Java applications. JDK contains a compiler,
    the Java Runtime Environment (JRE) and a library of classes that we use to build
    applications.


    ## Java Editions:


    We have four editions of Java, each used for building a different type of application:


    Java Standard Edition (SE): the core Java platform. It contains all of the libraries
    that every Java developer must learn.


    Java Enterprise Edition (EE): used for building very large-scale distributed systems.
    It''s built on top of Java SE and provides additional libraries for building fault-tolerant,
    distributed multi-tier software.


    Java Micro Edition (ME): a subset of Java SE, designed for Mobile devices.


    Java Card: used in smart cards.


    ## How Java Code Gets Executed


    The Java compiler takes Java code and compiles it down to Java Byte code format.
    When we run Java applications, Java Virtual Machine (JVM) gets loaded in memory.
    It takes our bytecode as the input and translates it to the native code for the
    underlying operating system. There are various implementations of Java Virtual
    Machine for almost all operating systems.


    ## Architecture of Java Applications


    ![](img/5dd48e01a3cc15319489428476134150_7_0.png)


    The smallest building blocks in Java programs are methods (also called functions
    in other programming languages). We combine related methods in classes, and related
    classes in packages. This modularity in Java allows us to break down large programs
    into smaller building blocks that are easier to understand and re-use.


    ## 5 Interesting Facts about Java


    1. Java was developed by James Gosling in 1995 at Sun Microsystems (later-acquired
    by Oracle).

    2. It was initially called Oak. Later it was renamed to Green and was finally
    renamed to Java inspired by Java coffee.

    3. Java has close to 9 million developers worldwide.

    4. About 3 billion mobile phones run Java, as well as 125 million TV sets and
    every Blu-Ray player.

    5. According to indeed.com, the average salary of a Java developer is just over

    a. $100,000 per year in the US.


    ![](img/5dd48e01a3cc15319489428476134150_8_0.png)


    ## Types


    ## Variables


    As the name suggests, data types specify the type of data that can be stored inside
    variables in Java. Java is a statically-typed language. This means that all variables
    must be declared before they can be used.


    A variable is a location in memory (storage area) to hold data. To indicate the
    storage area, each variable should be given a unique name (identifier).


    We use variables to temporarily store data in computer''s memory. In Java, the
    typeof of a variable should be specified at the time of declaration.


    In Java, we have two categories of types:


    - Primitives: for storing simple values like Numbers, Strings and Booleans.

    - Reference Types: for storing complex objects like email messages.


    ## Primitive Types


    A primitive data type specifies the size and type of variable values, and it has
    no additional methods. There are eight primitive data types in Java.

