- md: "\n| Type | Bytes | Range |\n|---|---|---|\n| byte | 1 | [-128, 127] |\n| short\
    \ | 2 | [-32K, 32K] |\n| int | 4 | [-2B, 2B] |\n| long | 8 | |\n| float | 4 |\
    \ |\n| double | 8 | |\n| char | 2 | A, B, C, ... |\n| boolean | 1 | true / false\
    \ |\n\n## Declaring Variables\n\n```java\n//@curious_.programmer\nbyte age = 30;\n\
    long viewsCount = 3_123_456L; float price = 10.99F;\nchar letter = 'A';\nboolean\
    \ isEligible = true;\n```\n\n- In Java, we terminate statements with a semicolon.\n\
    - We enclose characters with single quotes and strings (series of characters)\
    \ with double quotes.\n- The default integer type in Java is int. To represent\
    \ a long value, we should add L to it as a postfix.\n- The default floating-point\
    \ type in Java is double. To represent a float, we should append F to it as a\
    \ postfix.\n\n## Comments\n\nWe use comments to add notes to our code. Two Types\
    \ of comments in Java commonly used.\n\n- Single Line Comment:\n- Multi Line Comment:\n\
    \n```java\n// Single Line comment - This is a comment and it won't get executed.\n\
    \n/* Multi Line Comment - This is a comment and it won't get executed.\n   @curious_,programmer\n\
    \   This is a comment and it won't get executed.\n*/\n```\n\n## Reference Types\n\
    \nIn Java we have 8 primitive types. All the other types are reference types.\
    \ These types don't store the actual objects in memory. They store the reference\
    \ (or the address of) an object in memory.\n\nTo use reference types, we need\
    \ to allocate memory using the new operator. The memory gets automatically released\
    \ when no longer used.\n\n```java\nDate now = new Date();\n```\n\n## Strings\n\
    \nIn Java, a string is a sequence of characters. For example, \"hello\" is a string\
    \ containing a sequence of characters 'h', 'e', 'l', and 'o'. We use double quotes\
    \ to represent a string in Java.\n\nStrings are reference types but we don't need\
    \ to allocate memory to them. We can declare string variables like the primitives\
    \ since we use a lot.\n\n```java\n//Curious_programmer\nclass Main {\n    public\
    \ static void main(String[] args) {\n\n        // create strings\n        String\
    \ first = \"Java\";\n        String second = \"Python\";\n        String third\
    \ = \"JavaScript\";\n\n        // print strings\n        System.out.println(first);\
    \ // print Java\n        System.out.println(second); // print Python\n       \
    \ System.out.println(third); // print JavaScript\n    }\n}\n```\n\n```bash\njava\
    \ -cp /tmp/zpNjEpowW Main\nJava\nPython\nJavaScript\n```\n\n## Useful String Methods\n\
    \nThe String class in Java provides a number of useful methods:\n\n![](img/5dd48e01a3cc15319489428476134150_14_0.png)\n\
    \nStrings are immutable, which means once we initialize them, their value cannot\
    \ be changed. All methods that modify a string (like to Upper Case) return a new\
    \ string object. The original string remains unaffected.\n\n## Escape Sequences\n\
    \nIf you need to use a backslash or a double quotation mark in string, you need\
    \ to prefix it with a backslash. This is called escaping.\n\nCommon escape sequences:\n\
    \n- \\'\n- \\n (new line)\n- \\t (tab)\n\n## Arrays\n\nAn array is, a collection\
    \ of similar types of data.\n\nFor example, if we want to store the names of 100\
    \ people then we can create an array of the string type that can store 100 names.\n\
    \n```java\nString [] array = new String[100];\n```\n\nHere, the above array cannot\
    \ store more than 100 names. The number of values in a Java array is always fixed.\n\
    \nWe use arrays to store a list of objects. We can store any type of object in\
    \ an array (primitive or reference type). All items (also called elements) in\
    \ an array have the same type.\n\nJava arrays have a fixed length (size). You\
    \ cannot add or remove new items once you instantiate an array. If you need to\
    \ add new items or remove existing items, you need to use one of the collection\
    \ classes.\n\n```java\n//@curious_.programmer\nint[] numbers = new int[5];\nnumbers[0]\
    \ = 10;\nnumbers[1] = 20;\nnumbers[2] = 30;\nnumbers[3] = 40;\nnumbers[4] = 50;\n\
    \n// Shortcut\nint[] numbers = { 10, 20, 30, 40, 50 };\n```\n\n```java\n//Curious.Programmer\n\
    class Testarray{\n    public static void main(String[] args){\n        int a[]=new\
    \ int[5];//declaration and instantiation\n        a[0]=10;//initialization\n \
    \       a[1]=20;\n        a[2]=70;\n        a[3]=40;\n        a[4]=50;\n     \
    \   // traversing array\n        for(int i=0; i<a.length;i++){\n            System.out.println(a[i]);\n\
    \        }\n    }\n}\n```\n\n// creating and initializing an array of 5 elements\n\
    ```bash\njava -cp /tmp/zpNjEpowW Testarray\n10\n20\n70\n40\n50\n```\n\n## The\
    \ Array Class\n\nThe java.util.Arrays class contains a static factory that allows\
    \ arrays to be viewed as lists. Following are important points about Arrays -\n\
    \n- class contains various methods for manipulating arrays (such as sorting and\
    \ searching).\n- The methods in this class throw an Exception if the specified\
    \ array is null.\n- Array class provides a few useful methods for working with\
    \ arrays.\n\n```java\n//@curious_.programmer\nint[] numbers = { 4, 2, 3 };\nArrays.sort(numbers);\n\
    String result = Arrays.toString(numbers);\nSystem.out.println(result);\n```\n\n\
    ## Multi-dimensional Arrays\n\nA multidimensional array is an array of arrays.\
    \ Each element of multidimensional array is an array itself. For example,\n\n\
    ```java\n// @curious_.programmer\n// Creating 2x3 array (two rows, three columns)\n\
    int[][] matrix = new int[2][3];\nmatrix[0][0] = 10;\n\n// Shortcut\nint[][] matrix\
    \ = {\n    {1, 2, 3},\n    {4, 5, 6}\n};\n```\n\n```java\n//Curious_.programmer\n\
    class Main {\n    public static void main(String[] args) {\n        int[][] myNumbers\
    \ = {{1, 2, 3}, {4, 5, 6}};\n        for (int i = 0; i < myNumbers.length; i++)\
    \ {\n            for (int j = 0; j < myNumbers[i].length; j++) {\n           \
