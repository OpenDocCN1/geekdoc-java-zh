  md: '# Reference Types


    In Java we have 8 primitive types. All the other types are reference types. These
    types don''t store the actual objects in memory. They store the reference (or
    the address of) an object in memory.


    To use reference types, we need to allocate memory using the new operator. The
    memory gets automatically released when no longer used.


    ```

    Date now = new Date();

    ```


    # Strings


    In Java, a string is a sequence of characters. For example, "hello" is a string
    containing a sequence of characters ''h'', ''e'', ''l'', and ''o''. We use double
    quotes to represent a string in Java.


    Strings are reference types but we don''t need to allocate memory to them. We
    can declare string variables like the primitives since we use a lot.'
