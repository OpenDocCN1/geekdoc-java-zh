    int x = 10 % 3; // modulus (remainder of division)

    ```


    # Comparison Operators


    operators are used to check the relationship between two operands. We use comparison
    operators to compare values.


    It returns either true or false.


    ```

    //@curious._programmer

    x == y // equality operator

    x != y // in-inequality operator

    x > y

    x < y

    x <= y

    ```'
