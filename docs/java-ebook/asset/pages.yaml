  md: '# Arithmetic Expressions


    Arithmetic operators are used to perform arithmetic operations on variables and
    data. For example,


    ```

    //@curious._programmer

    int x = 10 + 3;

    int x = 10 - 3;

    int x = 10 * 2;

    int x = 10 / 3; // returns an int

