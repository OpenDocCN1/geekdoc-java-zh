  md: '# Arrays


    An array is, a collection of similar types of data.


    For example, if we want to store the names of 100 people then we can create an
    array of the string type that can store 100 names.


    ```

    String [] array = new String[100];

    ```


    Here, the above array cannot store more than 100 names. The number of values in
    a Java array is always fixed.


    We use arrays to store a list of objects. We can store any type of object in an
    array (primitive or reference type). All items (also called elements) in an array
    have the same type.


    Java arrays have a fixed length (size). You cannot add or remove new items once
    you instantiate an array. If you need to add new items or remove existing items,
    you need to use one of the collection classes.'
