  md: '# Java AWT


    Java AWT (Abstract Window Toolkit) is an API to develop Graphical User Interface
    (GUI) or windows-based applications in Java.


    Java AWT components are platform-dependent i.e. components are displayed according
    to the view of operating system. AWT is heavy weight i.e. its components are using
    the resources of underlying operating system (OS).


    The java.awt package provides classes for AWT API such as TextField, Label, TextArea,
    RadioButton, CheckBox, Choice, List etc.


    # Component Class


    All the elements like the button, text fields, scroll bars, etc. are called components.
    In Java-AWT, there are classes for each component.


    In order to place every component in a particular position on a screen, we need
    to add them to a container.


    # Container


    The Container is a component in AWT that can contain another components like buttons,
    textfields, labels etc. The classes that extends Container class are known as
    container such as Frame, Dialog and Panel.


    It is basically a screen where the where the components are placed at their specific
    locations. Thus it contains and controls the'
