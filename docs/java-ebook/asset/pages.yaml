  md: '# Logical Operators


    We use logical operators to combine multiple boolean

    values/expressions.


    +   - x && (AND): if both x and y are true, the result will be true.

    - x || (OR): if either x or y or both are true, the result will be true.

    - !x (NOT): reverses a boolean value. True becomes false.


    ```

    //@curious_programmer

    bool hasHighIncome = true;

    bool hasGoodCredit = false;

    bool hasCriminalRecord = false;

    bool isEligible = (hasHighIncome || hasGoodCredit) && !isEligible;

    ```


    # The Ternary Operator


    A ternary operator evaluates the test condition and executes a block

    of code based on the result of the condition.


    ```

    String className = (income > 100_000) ? "First" : "Economy";

    ```'
