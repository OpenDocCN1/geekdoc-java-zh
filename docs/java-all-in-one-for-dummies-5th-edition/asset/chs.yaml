  \ 方法即可获取简单的文本输入。该方法使用单个参数，用于指定显示在对话框中的提示消息。它返回一个字符串值，然后你可以将其解析为相应的类型。`JOptionPane`\
  \ 类是 `javax.swing` 包的一部分，因此你需要在任何使用该类的程序开头添加 `import javax.swing.JOptionPane` 语句。\n\
  \n列表 2-4 显示了一个使用 `JOptionPane` 类获取整数值并将其显示在控制台上的简单程序。\n\n96 第 2 卷 **编程基础**\n\n**列表\
