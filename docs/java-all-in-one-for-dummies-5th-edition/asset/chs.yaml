  \ 创建随机数\n\n早晚，你都会想要创建每次运行结果都不相同的程序。几乎所有的游戏都内置了偶然元素，因此你需要一种方法来实现它。\n\n严格来说，计算机并不具备生成真正随机数的能力，但多年来，聪明的计算机科学家开发了在所有目的上都看起来随机的方法。这些数字被称为*伪随机数*。\n\
  \nJava 有许多生成随机数的方法和类。例如，`java.util.Random` 类提供了约十种专门生成随机值的方法。生成生成 0.0 到 1.0 之间的\
  \ double，你可以执行 `new Random().nextDouble()`。此外，`java.security.SecureRandom` 类为加密敏感文档提供随机值。如果大小对你很重要，`java.math.BigInteger`\
  \ 类允许你生成任意大的随机数（如果你需要 1000 位的数字）。\n\n然而，大多数需要随机值的计算机应用程序需要的是任意低值（通常是 1，但并不总是）和任意高值之间的随机整数。玩骰子的程序需要\
  \ 1 到 6 之间的随机数，而发牌程序需要 1 到 52 之间的随机数（如果使用王牌则为 53）。\n\n因此，你需要一个 Java 表达式将随机函数返回的\
  \ double 值转换为程序所需的范围内的 int 值。以下代码展示了如何操作，并将针对骰子的游戏设置为 1 和 6：\n\n```java\nint low\
  \ = 1; // 范围内的最低值\nint high = 6; // 范围内的最高值\nint rnd = (int)(Math.random() * (high\
  \ - low + 1)) + low;\n```\n\n\n\n\n\n2. 将随机值乘以范围上限减去下限再加 1。在这个示例中，上限是 6，下限是 1，因此你现在得到了一个大于或等于\
  \ 0.0 但小于 6.0 的随机数。（它可能是 5.99999999999999，但永远不会是 6.0。）\n\n3. 该值通过 `(int)` 强制类型转换转换为整数。现在你有了一个值为\
  \ 0、1、2、3、4 或 5 的整数。（记住，当你将 `double` 转换为 `int` 时，该值的任何小数部分都会被丢弃。因为该数字小于 6.0，所以当它被转换为\
  \ `int` 时，永远不会被截断为 6.0。）\n\n4. 将范围内的最小值加到随机数。假设 `low` 是 1，那么随机数现在就是 1、2、3、4、5 或\
  \ 6。这正是你所所愿的：一个介于 1 和 6 之间的随机数。\n\n# 第 3 章：处理数字和表达式\n\n为了让你了解这种随机数计算的工作原理，列表 3-4\
  \ 显示了一个程序，它将此计算放在一个名为 `randomInt` 的方法中，然后调用它来模拟 100 次骰子投掷。`randomInt` 方法接受两个参数，代表范围的下限和上限，并返回一个范围内的随机整数。在该程序的\
  \ `main` 方法中，`randomInt` 方法被调用了 100 次，每个随机数都通过调用 `System.out.print` 打印。\n\n该程序的控制台输出类似于：\n\
  \n```\nHere are 100 random rolls of the dice:\n4 1 1 6 1 2 6 6 6 6 5 5 5 4 5 4 4\
  \ 1 3 6 1 3 1 4 4 3 3 3 5 6 5 6 6 3 5 2 2 6 3 3\n4 1 2 2 4 2 2 4 1 4 3 6 5 5 4 4\
  \ 2 4 1 3 5 2 1 3 3 5 4 1 6 3 1 6 5 2 6 6 3 5 4 5\n2 5 4 5 3 1 4 2 5 2 1 4 4 4 6\
  \ 6 4 6 3 3\n```\n\n然而，每当你运行这个程序时，你看到的都是不同的 100 个数字序列。列表 3-4 中的程序使用了你尚未见过的几个 Java\
  \ 特性。\n\n**列表 3-4：掷骰子**\n\n```java\npublic class DiceApp {\n    public static void\
  \ main(String[] args) {\n        int roll;\n        String msg = \"Here are 100\
  \ random rolls of the dice:\";\n        System.out.println(msg);\n        for (int\
  \ i=0; i<100; i++) {\n            roll = randomInt(1, 6);\n            System.out.print(roll\
  \ + \" \");\n        }\n        System.out.println();\n    }\n\n    public static\
  \ int randomInt(int low, int high) {\n        int result = (int)(Math.random() *\
  \ (high - low + 1)) + low;\n        return result;\n    }\n}\n```\n\n接下来的段落解释了程序的工作原理，但如果你没有完全理解程序中的所有元素，也不要担心。要关注的是将\
  \ `Math.random` 方法返回的随机双值转换为整数的表达式。\n\n- `for` 语句导致其体内的语句（第 10 行和第 11 行）执行 100 次。现在不用担心该语句是如何工作的；你将在第二本书第\
  \ 5 章中了解到它。\n- 该语句调用 `randomInt` 方法，指定 1 和 6 为生成随机整数的范围。生成的随机数被赋值给变量 `roll`。\n-\
  \ `System.out.print` 方法用于打印随机数并在后跟一个空格。因为该语句调用的是 `print` 方法而不是 `println` 方法，所以随机数打印在同一行，而不是分行打印。\n\
  - `randomInt` 方法的声明表明该方法返回一个 `int` 值并接受两个 `int` 参数：一个命名为 `low`，另一个命名为 `high`。\n\
  - 该表达式将随机双值转换为 `low` 和 `high` 之间的整数。\n- `return` 语句将随机数传回调用 `randomInt` 方法的语句。\n\
  \n## 舍入函数\n\n`Math` 类有四个方法可以舍入或截断 `float` 或 `double` 值。表 3-5 列出了这些方法。正如你所看到的，这些方法每个都使用不同的技术来计算靠近作为参数的\
  \ `double` 或 `float` 值的整数。注意，尽管这四个方法都将浮点值舍入为整数值，但只有 `round` 方法实际上返回整数类型（`int` 或\
  \ `long`，取决于参数是 `float` 还是 `double`）。其他方法返回的是恰好为整数值的 `double`。\n\n**表 3-5：Math 类提供的舍入函数**\n\
  \n| 方法 | 解释 |\n| :--- | :--- |\n| `ceil(argument)` | 返回一个整数且大于或等于参数值的最小 `double`\
  \ 值。 |\n| `floor(argument)` | 返回一个整数且小于或等于参数值的最大 `double` 值。 |\n| `rint(argument)`\
  \ | 返回一个整数且最接近参数值的 `double` 值。如果两个整数值一样近，则返回偶数值。 |\n| `round(argument)` | 返回最接近参数的整数。如果参数是\
  \ `double`，则返回 `long`。如果参数是 `float`，则返回 `int`。 |\n\n**列表 3-5：使用 Math 类舍入方法的程序**\n\
  \n```java\npublic class RoundingApp {\n    public static void main(String[] args)\
  \ {\n        double x = 29.4;\n        double y = 93.5;\n        double z = -19.3;\n\
  \        System.out.println(\"round(x) = \" + Math.round(x));\n        System.out.println(\"\
  round(y) = \" + Math.round(y));\n        System.out.println(\"round(z) = \" + Math.round(z));\n\
  \        System.out.println();\n        System.out.println(\"ceil(x) = \" + Math.ceil(x));\n\
  \        System.out.println(\"ceil(y) = \" + Math.ceil(y));\n        System.out.println(\"\
  ceil(z) = \" + Math.ceil(z));\n        System.out.println();\n        System.out.println(\"\
  floor(x) = \" + Math.floor(x));\n        System.out.println(\"floor(y) = \" + Math.floor(y));\n\
  \        System.out.println(\"floor(z) = \" + Math.floor(z));\n        System.out.println();\n\
  \        System.out.println(\"rint(x) = \" + Math.rint(x));\n        System.out.println(\"\
  rint(y) = \" + Math.rint(y));\n        System.out.println(\"rint(z) = \" + Math.rint(z));\n\
  \    }\n}\n```\n\n## 数字格式化\n\n到目前为止你看到的大部分程序使用 `System.out.println` 或 `System.out.print`\
  \ 方法打印包含数字变量的值。当你将数字变量传递给这些方法之一时，变量的值在打印之前会被转换为字符串。用于表示该值的确切格式并不好看：大值在打印时没有任何逗号，而且\
  \ `double` 或 `float` 值的所有小数位无论你是否想要都会打印出来。在许多情况下，你希望在打印之前对数字进行格式化——例如为大值添加逗号并限制打印的小数位数。或者，如果一个数字代表货币金额，你可能想添加美元符号（或适用于你所在区域的货币符号）。为了做到，你\n\
  \n\n\n\n可以使用 `NumberFormat` 类。表 3-6 列出了 `NumberFormat` 类的方法。\n\n# 第 3 章 处理数字和表达式\n\
  \n## 表 3-6：NumberFormat 类的方法\n\n| 方法 | 解释 |\n| :--- | :--- |\n| `getCurrencyInstance()`\
  \ | 静态方法，返回一个用于格式化货币数值的 `NumberFormat` 对象 |\n| `getPercentInstance()` | 静态方法，返回一个格式化百分比的\
  \ `NumberFormat` 对象 |\n| `getNumberInstance()` | 静态方法，返回一个格式化基础数字的 `NumberFormat`\
  \ 对象 |\n| `format(number)` | 返回一个包含格式化后数字的字符串 |\n| `setMinimumFractionDigits(int)`\
  \ | 设置小数点后显示的最小数字位数 |\n| `setMaximumFractionDigits(int)` | 设置小数点后显示的最大数字位数 |\n\n\
  与 Java 的许多方面一样，使用 `NumberFormat` 类的步骤有点笨拙。它的设计目的是为了需要格式化大量数字的应用程序提供效率，但对于大多数应用程序来说，它大材小用了。\n\
  \n使用 `NumberFormat` 类格式化数字的步骤需要一点时间来适应。首先，你必须调用其中一个静态 `getXxxInstance` 方法来创建一个可以以特定方式格式化数字的\
  \ `NumberFormat` 对象。然后，如果你需要，可以调用 `setMinimumFractionDigits` 或 `setMaximumFractionDigits`\
  \ 方法来设置要显示的位数。最后，你调用该对象的 `format` 方法来实际格式化数字。\n\n请注意，`NumberFormat` 类位于 `java.text`\
  \ 包中，因此在任何使用 `NumberFormat` 的类开头，必须包含以下导入语句：\n\n```java\nimport java.text.NumberFormat;\n\
  ```\n\n这是一个使用 `NumberFormat` 类将 `double` 值格式化为货币的示例：\n\n```java\ndouble salesTax\
  \ = 2.425;\nNumberFormat cf = NumberFormat.getCurrencyInstance();\nSystem.out.println(cf.format(salesTax));\n\
  ```\n\n运行此代码时，控制台将打印出以下行：\n$2.43\n\n注意，货币格式将数值从 `2.425` 四舍五入到了 `2.43`。\n\n这是一个使用通用数字格式格式化数字并精确保留三位小数的示例：\n\
  \n```java\ndouble x = 19923.3288;\nNumberFormat nf = NumberFormat.getNumberInstance();\n\
  nf.setMinimumFractionDigits(3);\nnf.setMaximumFractionDigits(3);\nSystem.out.println(nf.format(x));\n\
  ```\n\n运行此代码时，将打印：\n19,923.329\n在这里，数字使用了逗号格式化，且数值四舍五入到了三小数。\n\n这是一个使用百分比格式的示例：\n\
  \n```java\ndouble grade = .92;\nNumberFormat pf = NumberFormat.getPercentInstance();\n\
  System.out.println(pf.format(grade));\n```\n\n运行此代码时，将打印：\n92%\n\n如果你的程序格式化多个数字，考虑将\
  \ `NumberFormat` 对象创建为类变量。这样，`NumberFormat` 对象会在程序启动时创建。然后你可以从程序类的任何方法中使用该对象。列表\
  \ 3-6 是展示此过程如何工作的简单示例。运行此程序时，产生以下输出：\n\nMy allowance: $5.00\nCost of Paint Ball\
  \ Gun: $69.95\n\n在这里，变量 `cf` 被创建为类变量。然后 `printMyAllowance` 和 `printCostOfPaintBallGun`\
  \ 方法都可以在第 19 行和第 27 行可以使用。\n\n### 列表 3-6：使用 NumberFormat 类变量的程序\n\n```java\nimport\
  \ java.text.NumberFormat;\n\npublic class NumberFormatClassApp\n{\n    static NumberFormat\
  \ cf = NumberFormat.getCurrencyInstance();\n\n    public static void main(String[]\
