  You're right!\");\n        else\n            System.out.println(\"You're wrong!\"\
  \ + \" The number was \" + number);\n        // Play again?\n        do\n      \
  \  {\n            System.out.print(\"\\nPlay again? (Y or N)\");\n            answer\
  \ = sc.next();\n            validInput = true;\n            if (answer.equalsIgnoreCase(\"\
  Y\"));\n            else if (answer.equalsIgnoreCase(\"N\"))\n                keepPlaying\
