  \n第 4 章 **处理日期与时间**\n\n![Image 54](img/index-59)\n\n\n\n\n使用 CSS 进行格式化。此表单简单的 CSS\
  \ 文件添加了背景图像，增强了文本格式，并修改了按钮的外。\n\n你好，JavaFX！\n\n**图 1-2：**\nJavaFX 允许你使用 CSS 为用户界面元素指定格式。\n\
  \n除了 CSS，JavaFX 还提供了许多其他功能。例如：\n\n- **视觉效果：** 你可以为用户界面元素添加各种视觉效果，包括阴影、反射、模糊、光照和透视效果。\n\
  - **动画：** 你可以指定随时间逐渐应用过渡的动画效果。\n- **3D 对象：** 你可以绘制三维对象，如立方体、圆柱体、球体以及复杂的形状。\n- **触摸界面：**\
  \ JavaFX 可以轻松处理触摸屏设备，如智能手机和平板电脑。\n\n你将在本微型书籍的后续章节中发现这些以及更多功能。但现在，是时候来看一个简单的 JavaFX\
  \ 程序了，让你对 JavaFX 程序的外观有一个初步感受。\n\n# 第 1 章 你好，JavaFX! 565\n\n![Image 58](img/index-588_1.png)\n\
  \n## 查看一个简单的 JavaFX 程序\n\n图 1-3 显示了一个非常简单的 JavaFX 程序的用户界面，它只包含一个按钮。最初，此按钮的文本显示为\
  \ Click me please!（请点击我）。当你点击它时，按钮的文本会变为 You clicked me!（你点击了我）。如果你再次点击按钮，文本会变回\
  \ Click me please!。之后，每次点击按钮，文本会在 Click me please! 和 You clicked me! 之间循环。要退出程序，只需点击\
  \ Close 按钮（右上角的 X）。\n\n**图 1-3：**\nClick Me 程序。\n\n列表 1-1 显示了该程序的完整代码列表。\n\n**列表\
  \ 1-1：Click Me 程序**\n\n```java\nimport javafx.application.*;\nimport javafx.stage.*;\n\
  import javafx.scene.*;\nimport javafx.scene.layout.*;\nimport javafx.scene.control.*;\n\
  \npublic class ClickMe extends Application\n{\n    public static void main(String[]\
  \ args)\n    {\n        launch(args);\n    }\n\n    Button btn;\n\n    @Override\
  \ \n    public void start(Stage primaryStage)\n    {\n        // Create the button\n\
  \        btn = new Button();\n        btn.setText(\"Click me please!\");\n     \
  \   btn.setOnAction(e -> buttonClick());\n\n        // Add the button to a layout\
  \ pane\n        BorderPane pane = new BorderPane();\n        pane.setCenter(btn);\n\
  \n        // Add the layout pane to a scene\n        Scene scene = new Scene(pane,\
  \ 300, 250);\n\n        // Finalize and show the stage\n        primaryStage.setScene(scene);\n\
  \        primaryStage.setTitle(\"The Click Me App\");\n        primaryStage.show();\n\
  \    }\n\n    public void buttonClick()\n    {\n        if (btn.getText() == \"\
  Click me please!\")\n        {\n            btn.setText(\"You clicked me!\");\n\
  \        }\n        else\n        {\n            btn.setText(\"Click me please!\"\
  );\n        }\n    }\n}\n```\n\n接下来的部分描述了此基础 JavaFX 程序的关键方面。\n\n#### 导入 JavaFX 包\n\
  \n与任何 Java 程序一样，JavaFX 程序以一系列 import 语句开头，引用程序将使用的各种 JavaFX 包。Click Me 程序包含了以下五个\
  \ import 语句：\n\n```java\nimport javafx.application.*;\nimport javafx.stage.*;\n\
  import javafx.scene.*;\nimport javafx.scene.layout.*;\nimport javafx.scene.control.*;\n\
  ```\n\n如你所见，所有的 JavaFX 包都以 `javafx` 开头。Click Me 程序使用了来自不同 JavaFX 包的类：\n\n- `javafx.application`：此包定义了所有\
  \ JavaFX 应用程序依赖的核心类：`Application`。你将在本章稍后的“扩展 Application 类”部分中阅读更多关于 `Application`\
  \ 类的信息。\n- `javafx.stage`：此包中最重要的类是 `Stage` 类，它定义了所有用户界面对象的顶层容器。`Stage` 是 JavaFX\
  \ 应用程序最高级别的窗口，应用程序的所有用户界面元素都显示在其中。\n- `javafx.scene`：此包中最重要的类是 `Scene` 类，它是一个容纳程序显示的所有用户界面元素的容器。\n\
  - `javafx.scene.layout`：此包定义了一种特殊类型的用户界面元素，称为 `layout manager`（布局管理器）。布局管理器的工作是确定在用户界面中显示的每个控件的位置。\n\
  - `java.scene.control`：此包包含了定义单个用户界面控件的类，如按钮、文本框和标签。Click Me 程序仅使用了此包中的一个类 `Button`，它代表一个用户可以点击的按钮。\n\
  \n### 扩展 Application 类\n\nJavaFX 应用程序是一个继承自 `javafx.application.Application` 类的\
  \ Java 类。因此，Click Me 应用程序的主类声明如下：\n\n```java\npublic class ClickMe extends Application\n\
  ```\n\n在这里，ClickMe 应用程序由名为 `ClickMe` 的类定义，该类继承了 `Application` 类。\n\n由于 Click Me\
  \ 程序第 1 行导入了整个 `javafx.application` 包，因此 `Application` 类不需要全限定名。如果你省略了 `javafx.application`\
  \ 包的 import 语句，`ClickMe` 类的声明将必须像这样：\n\n```java\npublic class ClickMe extends javafx.application.Application\n\
  ```\n\n`Application` 类负责管理所谓的 JavaFX *生命周期*（life cycle）。该生命周期包括以下步骤：\n\n1. **创建\
  \ Application 实例。**\n2. **调用 init 方法。** `init` 方法的默认实现什么都不做，但你可以重写它以在显示用户界面之前执行任何处理。\n\
  3. **调用 start 方法。** `start` 方法是一个抽象方法，这意味着 `Application` 类没有提供默认实现。因此，你必须提供自己的 `start`\
  \ 方法版本。`start` 方法负责构建和显示用户界面。（更多信息请参见本章稍后的“重写 start 方法”）。\n4. **等待应用程序结束，这通常在用户关闭主窗口或选择退出程序时发生。**\
  \ 在期间，应用程序并不是闲的，而是忙于响应用户事件，例如点击按钮或从下拉列表中选择项目。\n5. **调用 stop 方法。** 与 `init` 方法一样，`stop`\
  \ 方法的默认实现没有任何，但你可以重写它并在程序终止时执行必要的处理，例如关闭数据库资源或保存文件。\n\n# 第 1 章 你好，JavaFX! 569\n\n\
  ## 启动应用程序\n\n如你所知，Java 程序的标准入口是 `main` 方法。以下是 Click Me 程序的 `main` 方法：\n\n```java\n\
  public static void main(String[] args)\n{\n    launch(args);\n}\n```\n\n如你所见，`main`\
  \ 方法只包含一条语句，调用 `Application` 类的 `launch` 方法。`launch` 方法实际上启动了 JavaFX 应用程序。`launch`\
  \ 方法是一个静态方法，因此可以在 `main` 方法的静态环境中调用。它创建 `Application` 类的实例，然后启动 JavaFX 生命周期，调用 `init`\
  \ 和 `start` 方法，等待应用程序结束，最后调用 `stop` 方法。\n\n`launch` 方法在 JavaFX 应用程序结束之前返回。假设你这样编写\
  \ Click Me 程序的 `main` 方法：\n\n```java\npublic static void main(String[] args)\n{\n\
  \    System.out.println(\"Launching JavaFX\");\n    launch(args);\n    System.out.println(\"\
  Finished\");\n}\n```\n\n那么，当 JavaFX 窗口打开时，你会在控制窗口看到 Launching JavaFX。当你关闭 JavaFX\
  \ 应用程序\n\n\n\n\n窗口，随后你将在控制台窗口看到 Finished。\n\n### 重写 start 方法\n\n每个 JavaFX 应用程序都包含一个\
  \ `start` 方法。你在 `start` 方法中编写创建程序用户将要交互的用户界面元素的代码。例如，列表 1-1 中的 `start` 方法包含了显示带有\
  \ “Click Me!” 文本的按钮的代码。\n\n当一个 JavaFX 应用程序启动时，JavaFX 框架会在 `Application` 类初始化后调用\
  \ `start` 方法。\n\nClick Me 程序的 `start` 方法如下所示：\n\n```java\n@Override public void\
  \ start(Stage primaryStage)\n{\n// 创建按钮\nbtn = new Button();\nbtn.setText(\"Click\
  \ me please!\");\nbtn.setOnAction(e -> buttonClick());\n\n// 将按钮添加到布局窗格\nBorderPane\
  \ pane = new BorderPane();\npane.setCenter(btn);\n\n// 将布局窗格添加到场景\nScene scene =\
  \ new Scene(pane, 300, 250);\n\n// 完成阶段设置并显示阶段\nprimaryStage.setScene(scene);\n\
  primaryStage.setTitle(\"The Click Me App\");\nprimaryStage.show();\n}\n```\n\n为了为\
  \ Click Me 程序创建用户界面，`start` 方法执行了以下四个基本步骤：\n\n1. **创建一个名为 btn 的按钮控件。按钮的文本设置为 Click\
  \ me please!，当用户点击按钮时，将调用一个名为 buttonClick 的方法。**\n关于此代码的更详细解释，请参阅本章节后面的“创建按钮”和“处理动作事件”部分。\n\
  \n2. **创建一个名为 pane 的布局窗格并将按钮添加到其中。**\n欲了解更多细节，请参阅本章节后面的“创建布局窗格”部分。\n\n3. **创建一个名为\
  \ scene 的场景并将布局窗格添加到其中。**\n欲了解更多细节，请参阅本章节后面的“制作场景”部分。\n\n4. **通过设置场景、设置标题以及显示阶段来完成阶段设置。**\n\
  更多细节请参阅本章节后面的“设置阶段”部分。\n\n你将在本章节的后半部分找到这些这些代码块的相关详细信息。在我继续之前，我想指出关于 `start` 方法的几处额外的显著细节：\n\
  \n- `start` 方法在 `Application` 类中被定义为抽象方法，因此当你在 JavaFX 程序中包含 `start` 方法时，你实际上是在重写抽象的\
  \ `start` 方法。\n- 虽然不是强制要求的，但包含 `@Override` 注解始终是一个好习惯，可以显式声明你正在重写 `start` 方法。如果你省略此注解，然后在方法名的拼写上出现错误（例如，使用\
  \ `Start` 而不是 `start`）或列出的参数不正确，Java 会认为你正在定义一个新方法而不是重写 `start` 方法。\n- 与 `main`\
  \ 方法不同，`start` 方法不是静态方法。当你从静态的 `main` 方法调用 `launch` 方法时， `launch` 方法会创建你的 `Application`\
  \ 类的实例，然后调用 `start` 方法。\n- `start` 方法接受一个参数：用于显示应用程序用户界面的 `Stage` 对象。当应用程序调用你的 `start`\
  \ 方法时，应用程序会通过 `primaryStage` 参数传递主阶段（称为 primary stage，即主阶段）。因此，你可以在 `start` 方法的后续部分使用\
  \ `primaryStage` 参数来引用应用程序的阶段。\n\n### 创建按钮\n\nClick Me 程序显示的按钮是使用名为 `Button` 的类创建的。该类是你用于创建用户界面控件的许多类之一。`Button`\
  \ 类以及大多数其他控件类都位于 `javafx.scene.control` 包中。\n\n要创建一个按钮，只需定义一个 `Button` 类型的变量，然后像这样调用\
  \ `Button` 构造函数：\n\n```java\nButton btn;\nbtn = new Button();\n```\n\n在列表 1-1 代码中，`btn`\
  \ 变量被声明为 `start` 方法之外的类变量，但 `Button` 对象实际上是在 `start` 方法内部创建的。控件通常被声明为类变量，以便你从类中定义的任何方法中访问它们。正如你在接下来的章节（“处理动作事件”）中发现的，当用户点击按钮时，会调用一个名为\
  \ `buttonClicked` 的独立方法。通过将 `btn` 变量定义为类变量，`start` 方法和 `buttonClicked` 方法都可以访问该按钮。\n\
  \n要设置按钮显示的文本值，请调用 `setText` 方法，并将要显示的文本作为字符串传递进去：\n\n```java\nbtn.setText(\"Click\
  \ me please!\");\n```\n\n这里有关于按钮的几个额外小知识：\n\n- `Button` 构造函数允许你将要在按钮上显示的文本作为参数传递，例如此例：`Btn\
  \ = new Button(\"Click me please!\");`。如果你通过这种方式设置按钮文本，则不需要调用 `setTitle` 方法。\n-\
  \ `Button` 类是许多派自名为 `javafx.scene.control.Control` 的父类的类之一。许多其他类也派自此类，包括 `Label`、`TextField`、`ComboBox`、`CheckBox`\
  \ 和 `RadioButton`。\n- `Control` 类是派自更高级父类 `javafx.scene.Node` 的几个不同类之一。`Node` 是所有可以显示在场景中的用户界面元素的基类。控件是一种特定类型的节点，但还有其他类型的节点。\n\
  \n### 处理动作事件\n\n当用户点击按钮时，会触发一个动作事件（action event）。你的程序可以通过提供事件处理器来响应该事件，事件处理器仅仅是当事件发生时执行的一段代码。\n\
  \n在 JavaFX 中有几种处理事件的方法。最直接的方法是指定在事件发生时调用某个方法，然后提供该方法的实现。要指定要调用的方法，你调用按钮的 `setOnAction`\
  \ 方法。以下是列表 1-1 中的实现方式：\n\n```java\nbtn.setOnAction(e -> buttonClick());\n```\n\n\
  如果这里使用的语法看起来有点陌生，那是因为它使用了 Lambda 表达式（lambda expression），这是 Java 1.8 引入的特性。在此所示，这种新语法包含三个元素：\n\
  \n- 参数 `e` 代表 `ActionEvent` 类型的对象，程序可以使用它获取有关事件的详细信息。Click Me 程序忽略了这个参数，所以你也可以忽略它，至少目前如此。\n\
  - 箭头 `->` 是 Java 8 引入的用于 Lambda 表达式的新运算符。\n- 方法调用 `buttonClick()` 只是调用名为 `buttonClick`\
  \ 的方法。\n\n在确定 `buttonClick` 为用户点击按钮时调用的方法后，下一步是编写 `buttonClick` 方法。你在列表 1-1 的底部找到它：\n\
  \n```java\npublic void buttonClick()\n{\n    if (btn.getText() == \"Click me please!\"\
  )\n    {\n        btn.setText(\"You clicked me!\");\n    }\n    else\n    {\n  \
  \      btn.setText(\"Click me please!\");\n    }\n}\n```\n\n该方法使用 `if` 语句交替更改按钮显示的文本为\
  \ “You clicked me!”或 “Click me please!”换句话说，当用户点击按钮时，如果按钮的文本是 “Click me please!”,则\
  \ `buttonClicked` 方法将文本更改为 “You clicked me!”；否则，`if` 语句将按钮文本改回 “Click me please!”。\n\
  \n\n\n\n\n`buttonClicked` 方法使用了 `Button` 类的两个方法来执行其工作：\n\n- `getText`: 返回按钮显示的文本（字符串）\n\
  - `setText`: 设置按钮显示的文本\n\n有关处理事件的更多信息，请参阅本迷你书籍的第 2 章。\n\n## 创建布局窗格 (Layout Pane)\n\
  \n按钮本身并没有什么用处。你必须实际上将其显示在屏幕上，用户才能点击它。而且，任何真实的 JavaFX 程序都会包含一个以上的控件。当你向用户界面中添加第二个控件时，你就需要一种方法来指定控件之间的相对位置。\n\
  \n例如，如果你的应用程序有两个按钮，你是希望它们垂直堆叠（一个在另一个正上方），还是并排显示？这就是布局窗格（layout panes）大显身场。`layout\
  \ pane`是一个容器类，你可以向其中添加一个或多个用户界面元素。然后，布局窗格会决定这些元素之间具体的显示方式。\n\n要使用布局窗格，你首先创建一个窗格的实例。然后，向窗格中添加一个或多个控件。在这样做时，你可以指定窗格显示时控件的排列细节。当你将所有控件添加到窗格并安排妥当后，将该窗格添加到场景（scene）中。\n\
  \nJavaFX 提供了共八种不同类型的布局窗格，它们都由 `javafx.scene.layout` 包中的类定义。“Click Me”程序使用了一种名为 `border\
  \ pane`（边框窗格）的布局类型，它将窗格的内容分为五个区域：顶部、左侧、右侧、底部和中间。`BorderPane` 类非常适合此类布局：即顶部有菜单和工具栏等元素，底部有状态栏，左侧或右侧可选的任务窗格或工具栏，屏幕中心是主工作区域。\n\
  \n“Click Me”程序中创建边框窗格的代码行如下：\n\n```\nBorderPane pane = new BorderPane();\npane.setCenter(btn);\n\
  ```\n\n在这里，声明了一个类型为 `BorderPane` 名为 `pane` 的变量，并调用 `BorderPane` 构造函数来创建一个新的 `BorderPane`\
  \ 对象。然后，使用 `setCenter` 方法在窗格的中心区域显示按钮 (`btn`)。\n\n以下是关于布局窗格的其他有趣细节：\n\n- 布局窗格会根据其所包含元素的大小以及布局窗格显示空间的大小，自动调整其包含元素的精确位置。\n\
  - 我之前说过控件是节点（node）的一种，你将在的后续部分读到其他类型的节点。很好，你刚刚读到了其中一种：布局窗格也是节点的一种。\n- 边框窗格的每个区域都可以包含一个节点。因为布局窗格本身也是节点，所以边框窗格的每个区域都可以包含另一个布局窗格。例如，假设你想在边框窗格的中心区域显示三个控件。为了实现这一点，你需要创建第二个布局窗格并将三个控件添加到其中。然后，你把第二个布局窗格设置为要在第一个布局窗格中心区域显示的节点。\n\
  - 你可以在本迷你书籍的第 4 章中读到更多关于 `BorderPane` 类以及一些常用布局窗格的知识。\n\n## 创建场景 (Scene)\n\n在你创建了包含想要显示的控件的布局窗格后，下一步是创建一个将显示该布局窗格的场景。你可以通过一行代码来实现：声明一个类型为\
  \ `Scene` 的变量并调用 `Scene` 类的构造函数。这就是我在“Click Me”程序中的做法：\n\n```\nScene scene = new\
  \ Scene(pane, 300, 250);\n```\n\n`Scene` 构造函数接受三个参数：\n\n- 一个代表场景显示的 `root node`（根节点）的节点对象。场景只能有一个根节点，因此根节点通常是一个布局窗格，它又包含了要显示的其他控件。在“Click\
  \ Me”程序中，根节点是包含按钮的边框布局窗格。\n- 场景的像素宽度。\n\n注意：如果你省略宽度和高度，场景将根据根节点中包含元素的大小自动调整尺寸。\n\
  \n你可以在本迷你书籍的第 3 章了解 `Scene` 类的其他功能。\n\n## 设置舞台 (Stage)\n\n如果说 `scene`（场景）代表应用程序显示的节点（控件和布局窗格），那么\
  \ `stage`（舞台）就代表显示场景的窗口。当 JavaFX 框架调用应用程序的 `start` 方法时，它会传递给你一个 `Stage` 类的实例，代表应用程序的主舞台——即代表应用程序主窗口的舞台。该引用通过\
  \ `primaryStage` 参数传递。\n\n创建好场景后，你现在准备好完成主舞台，以便显示场景。要做到这一点，你必须至少做两件事：\n\n- 调用主舞台的\
  \ `setScene` 方法来设置要显示的场景。\n- 调用主舞台的 `show` 方法来显示场景。\n\n调用 `show` 方法后，你的应用程序窗口将变得对用户可见，用户随后就可以开始与其控件进行交互。通常的惯例还会设置应用程序标题栏中显示的标题。你通过调用主舞台的\
  \ `setTitle` 方法来实现。“Click Me”程序 `start` 方法的最后三行执行了这些功能：\n\n```\nprimaryStage.setScene(scene);\n\
  primaryStage.setTitle(\"The Me\");\nprimaryStage.show();\n```\n\n当最后一行调用 `show`\
  \ 方法时，你的应用程序窗口将显示如图 2-1 所示。你可以在第 3 章了解 `Stage` 类的其他功能。\n\n## 检查计数器程序 (Click Counter\
