  \ `type=\"submit\"` 创建提交按钮。`name` 属性提供了你在程序中使用的 `\"name\"`，用于检索用户输入的数据。 |\n| `&nbsp;`\
  \ | 代表不换行空格。 |\n\n## 运行 Servlet\n\n到底如何运行 Servlet 呢？首先，你必须编译 `.java` 文件以创建 `.class`\
  \ 文件；然后你必须将 `.class` 文件移动到 Tomcat 可以运行该 Servlet 的目录中。为了测试，你可以将 Servlet 的类文件移动到 `c:\\\
  tomcat\\webapps\\Examples\\WEB-INF\\classes`，然后输入如下的地址：\n\n`http://localhost:8080/servlet/HelloWorld`\n\
  \n你可能还想要重写 `doPost` 方法，以处理 POST 请求，因为许多 Servlet 与表单相关，用户可以在其中输入数据。如果你想让 Servlet\
  \ 响应 POST 请求，可以重写 `doPost` 方法，而不是（或额外的）`doGet` 方法。除了方法名外，`doPost` 的签名与 `doGet` 相同。事实上，经常看到\
  \ `doPost` 方法直接调用 `doGet`：\n\n```java\npublic void doPost(HttpServletRequest request,\
  \ HttpServletResponse response)\nthrows IOException, ServletException\n{\n    doGet(request,\
  \ response);\n}\n```\n\n为了这样做，你可以这样编写 `doPost` 方法：\n\n## 改进 HelloWorld Servlet\n\
  \n在本章前面所示 `HelloWorld` Servlet 并不有趣，因为它总是发送相同的文本。本质上，它是一个静态 Servlet —— 这很大程度上失去了使用\
  \ Servlet 的意义。你可以轻松提供一个静态 HTML 页面。\n\n列表 2-2 展示了更动态的 `HelloWorld` Servlet。这个版本随机显示六种问候语之一。它使用\
  \ Math 类的 `random` 方法在 1 到 6 之间选取一个随机数，然后根据这个数字决定显示哪种问候语。它还重写了 `doPost` 方法以及 `doGet`\
  \ 方法，因此 POST 和 GET 的方式相同。\n\n### 列表 2-2：HelloServlet Servlet\n\n```java\nimport\
  \ java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\nimport java.util.*;\n\
  \npublic class HelloServlet extends HttpServlet\n{\n    public void doGet(HttpServletRequest\
  \ request, HttpServletResponse response)\n    throws IOException, ServletException\n\
  \    {\n        response.setContentType(\"text/html\");\n        PrintWriter out\
  \ = response.getWriter();\n        String msg = getGreeting();\n        out.println(\"\
  <html>\");\n        out.println(\"<head>\");\n        out.println(\"<title>HelloWorld\
  \ Servlet</title>\");\n        out.println(\"</head>\");\n        out.println(\"\
  <body>\");\n        out.println(\"<h1>\");\n        out.println(msg);\n        out.println(\"\
  </h1>\");\n        out.println(\"</body>\");\n        out.println(\"</html>\");\n\
  \    }\n\n    public void doPost(HttpServletRequest request, HttpServletResponse\
  \ response)\n    throws IOException, ServletException\n    {\n        doGet(request,\
  \ response);\n    }\n\n    private String getGreeting()\n    {\n        String msg\
  \ = \"\";\n        int rand = (int)(Math.random() * (6)) + 1;\n        // ... 设置问候语的逻辑\
  \ ...\n        return msg;\n    }\n}\n```\n\n\n\n\n\n*(续上)*\n\n# 第 2 章 创建 Servlet\
  \ 731\n\n**代码列表 2-2：**\n\n```java\nswitch (rand)\n{\ncase 1:\nreturn \"Hello, World!\"\
  ;\ncase 2:\nreturn \"Greetings!\";\ncase 3:\nreturn \"Felicitations!\";\ncase 4:\n\
  return \"Yo, Dude!\";\ncase 5:\nreturn \"Whasssuuuup?\";\ncase 6:\nreturn \"Hark!\"\
  ;\n}\n\nreturn null;\n}\n\n```\n\n## 从用户获取输入\n\n如果 Servlet 被来自表单的 HTTP GET 或 POST\
  \ 请求调用，你可以调用 `request` 对象的 `getParameter` 方法来获取用户在每个表单字段中输入的值。这里有一个示例：\n\n`String\
  \ name = request.getParameter(\"name\")`\n\n这里获取了名为 `name` 的表单输入字段中输入的值，并将其赋值给 `String`\
  \ 变量 `name`。\n\n## 表单操作\n\n如你所见，在 Servlet 中获取用户输入的数据是非常简单的。困难的部分是创建一个允许用户输入数据的表单。为了实现这一点，你需要使用单独的\
  \ HTML 文件来创建表单。代码列表 2-3 显示了一个名为 `InputServlet.html` 的 HTML 文件，它显示了图 2-4 所示的表单。\n\
  \n732 第 7 本书 **Web Programming**\n\n![Image 100](img/index-755_1.png)\n\n## 创建 Servlet\n\
  \n**图 2-4：** 一个简单的输入表单。\n\n**代码列表 2-3：**\n**InputServlet.html 文件**\n\n```html\n\
  <<html>\n<head>\n<title>Input Servlet</title>\n</head>\n<body>\n<form action=\"\
