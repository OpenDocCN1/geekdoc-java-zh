  \n## 验证数字数据\n\n如果你在使用文本字段获取数字数据，需要特别小心。使用包装类的解析方法。*注意：*这些这些方法在字符串无法转换时都会抛出 `NumberFormatException`。因此，你需要在\
  \ `try/catch` 块中调用它们以捕获此异常。\n\n### 表 5-2 将字符串转换为数字的方法\n\n| 包装类 | 方法 |\n| :--- |\
  \ :--- |\n| Integer | `parseInt(String)` |\n| Short | `parseShort(String)` |\n|\
  \ Long | `parseLong(String)` |\n| Byte | `parseByte(String)` |\n| Float | `parseFloat(String)`\
  \ |\n| Double | `parseDouble(String)` |\n\n如果你的程序使用一个多个数字输入文本字段，考虑创建独立的方法来验证用户的输入。以下代码片段显示了一个接受文本字段和错误信息字符串（在数据无法转换时显示）的方法。该方法返回一个\
  \ `boolean` 值，指示字段是否包含整数：\n\n```java\nprivate boolean isInt(TextField f, String\
  \ msg) {\n    try {\n        Integer.parseInt(f.getText());\n        return true;\n\
  \    } catch (NumberFormatException e) {\n        Alert a = new Alert(Alert.AlertType.WARNING,\
  \ msg);\n        a.setTitle(\"Invalid Data\");\n        a.showAndWait();\n     \
  \   return false;\n    }\n}\n```\n\n当你需要检查文本字段是否为有效整数时，可以调用此方法。这里有一个获取 `txtCount`\
  \ 文本字段输入的值并在该值是有效整数时在消息框中显示的方法：\n\n```java\npublic void buttonOKClick() {\n    if\
  \ (isInt(textCount, \"你必须输入一个整数.\")) {\n        Alert a = new Alert(Alert.AlertType.INFORMATION,\
  \ \"你输入了 \" + Integer.parseInt(textCount.getText()), \"你的数字\");\n        a.showAndWait();\n\
  \    }\n    textCount.requestFocus();\n}\n```\n\n## 使用复选框\n\n*复选框*是一种用户可以点击勾选或清除控件。复选框允许用户为选项指定“是”或“否”。图\
  \ 5-2 显示了一个带有三个复选框的窗口。\n\n668 BOOK 6 **JavaFX**\n\n![Image 77](img/index-691_1.png)\n\
  \n\n\n\n严格来说，复选框（check box）有三种状态：已选中、未选中和未定义。未定义状态通常与树形视图（TreeView）控件配合使用。\n\n**图\
  \ 5-2：**\n三个复选框。\n\n要创建一个复选框，你可以使用 `CheckBox` 类。其常用的构造函数和方法如 5-3 所示。\n\n### 从用户获取输入\n\
  \n**表 5-3**\n**常用的 CheckBox 构造函数和方法**\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n| `CheckBox()`\
  \ | 创建一个初始未选中的新复选框 |\n| `CheckBox(String text)` | 创建一个显示指定文本的新复选框 |\n| **方法** |\
  \ 描述 |\n| `String getText()` | 获取复选框显示的文本 |\n| `boolean isSelected()` | 如果复选框已选中返回\
  \ true，未选中则返回 false |\n| `void setOnAction(EventHandler<ActionEvent> value)` | 设置\
  \ ActionEvent 监听器以处理动作事件 |\n| `void setSelected(boolean value)` | 如果参数为 true 则选中复选框；如果参数为\
  \ false 则取消选中 |\n| `void setText(String text)` | 设置复选框文本 |\n\n与任何 JavaFX 控件一样，如果你想在程序中的任何方法中引用复选框，请声明一个类变量来引用该控件：\n\
  \n`CheckBox chkPepperoni, chkMushrooms, chkAnchovies;`\n\n然后你可以在 `start` 方法中使用如下语句来创建复选框并将它们添加到布局面板中（在本例中为\
  \ `pane1`）：\n\n```java\nchkPepperoni = new CheckBox(\"Pepperoni\");\npane1.add(chkPepperoni);\n\
  chkMushrooms = new CheckBox(\"Mushrooms\");\npane1.add(chkMushrooms);\nchkAnchovies\
  \ = new CheckBox(\"Anchovies\");\npane1.add(chkAnchovies);\n```\n\n注意，我没有在构造函数中指定这些复选框的初始状态。结果是它们初始是未选中的。如果你想创建一个初始为选中的复选框，可以调用\
  \ `setSelected` 方法，如下：\n\n```java\nchkPepperoni.setSelected(true);\n```\n\n在事件监听器中，你可以使用\
  \ `isSelected` 方法测试复选框的状态，并可以通过调用 `setSelected` 方法来设置复选框的状态。这里有一个方法，当用户点击 OK 时会显示消息框并清空三个复选框：\n\
  \n```java\npublic void btnOK_Click()\n{\n    String msg = \"\";\n    if (chkPepperoni.isSelected())\n\
  \        msg += \"Pepperoni\\n\";\n    if (chkMushrooms.isSelected())\n        msg\
  \ += \"Mushrooms\\n\";\n    if (chkAnchovies.isSelected())\n        msg += \"Anchovies\\\
  n\";\n    if (msg.equals(\"\"))\n        msg = \"You didn't order any toppings.\"\
  ;\n    else\n        msg = \"You ordered these toppings:\\n\" + msg;\n\n    Alert\
  \ a = new Alert(Alert.AlertType.INFORMATION, msg);\n    a.setTitle(\"Your Order\"\
  );\n    a.showAndWait();\n\n    chkPepperoni.setSelected(false);\n    chkMushrooms.setSelected(false);\n\
  \    chkAnchovies.setSelected(false);\n}\n```\n\n在这里，用户选择的每个披萨配料名称都被添加到文本字符串中。例如，如果你选择了意大利腊肠和安士��鱼，将显示以下消息：\n\
  \nYou ordered these toppings:\nPepperoni\nAnchovies\n\n如果你愿意，可以为复选框添加事件监听器，以响应用户点击这些复选框时生成的事件。假设你的餐厅菜单上有安士��鱼，但你拒绝实际上制作带有安士��鱼的披萨。这里有一个可以在事件监听器中调用的方法，当用户尝试勾选安士��鱼复选框时显示消息；显示消息后，该方法将清空该复选框：\n\
  \n```java\npublic void btnOK_Click()\n{\n    String msg = \"\";\n    if (chkPepperoni.isSelected())\n\
  \        msg += \"Pepperoni\\n\";\n    if (chkMushrooms.isSelected())\n        msg\
  \ += \"Mushrooms\\n\";\n    if (chkAnchovies.isSelected())\n        msg += \"Anchovies\\\
  n\";\n    if (msg.equals(\"\"))\n        msg = \"You didn't order any toppings.\"\
  ;\n    else\n        msg = \"You ordered these toppings:\\n\" + msg;\n\n    Alert\
  \ a = new Alert(Alert.AlertType.INFORMATION, msg);\n    a.setTitle(\"Your Order\"\
  );\n    a.showAndWait();\n\n    chkPepperoni.setSelected(false);\n    chkMushrooms.setSelected(false);\n\
  \    chkAnchovies.setSelected(false);\n}\n```\n\n### 单选按钮（Radio Buttons）\n\n单选按钮与复选框相似，但有一个关键区别：它们成组出现，且一组内只能选择一个。当你点击一个单选按钮时，组内之前选中的按钮会自动取消选中。图\
  \ 5-3 显示了带有三个单选按钮的窗口。\n\n![Image 784)\n\n**图 5-3：**\n三个单选按钮的窗口。\n\n要操作单选按钮，你需要使用两个类。首先使用\
  \ `RadioButton` 类创建单选按钮，其构造函数和方法如 5-4 所示。然后使用 `ToggleGroup` 类为协同工作的单选按钮创建一个分组。`ToggleGroup`\
  \ 对象本身不是控件，也不会显示。要显示单选按钮，必须将它们添加到布局面板。\n\n**表 5-4**\n**各种 RadioButton 构造函数和方法**\n\
  \n| 构造函数 | 描述 |\n| :--- | :--- |\n| `RadioButton()` | 创建一个没有文本的新单选按钮 |\n| `RadioButton(String\
  \ text)` | 创建一个带有指定文本的新单选按钮 |\n| **方法** | 描述 |\n| `String getText()` | 获取单选按钮显示的文本\
  \ |\n| `boolean isSelected()` | 如果单选按钮已选中返回 true，未选中则返回 false |\n| `void setOnAction(EventHandler<ActionEvent>\
  \ value)` | 设置 ActionEvent 监听器以处理动作事件 |\n| `void setSelected(boolean value)` | 如果参数为\
  \ true 则选中单选按钮；如果参数为 false 则取消选中 |\n| `void setText(String text)` | 设置复选框文本 |\n\n\
  创建单选按钮的通常方法是声明一个变量将其作为类变量，以便在类的任何地方访问，如下所示：\n\n`RadioButton rdoSmall, rdoMedium,\
  \ rdoLarge;`\n\n然后，在 `start` 方法中，你调用 `RadioButton` 构造函数来创建单选按钮：\n\n```java\nrdoSmall\
  \ = new RadioButton(\"Small\");\n```\n\n之后，你可以按照通常方式将单选按钮添加到布局面板。为了为协同工作的单选按钮创建一个切换组，调用\
  \ `ToggleGroup` 类构造函数：\n\n```java\nToggleGroup sizeGroup = new ToggleGroup();\n\
  ```\n\n然后调用每个单选按钮的 `setToggleGroup` 方法：\n\n```java\nrdoSmall.setToggleGroup(sizeGroup);\n\
  rdoMedium.setToggleGroup(sizeGroup);\nrdoLarge.setToggleGroup(sizeGroup);\n```\n\
