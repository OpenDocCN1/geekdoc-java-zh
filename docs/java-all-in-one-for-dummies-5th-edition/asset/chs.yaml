  * 识别导入类的方法\n\n在本章中，你将找到编写简单 Java 程序的知识。你在本章中看到的程序非常简单：它们只是在*控制台*（在 Windows 中就是命令行提示窗口）上显示简单信息。在开始编写任何有价值的程序之前，你还需要学习几章。在本章中看到的简单程序足以说明\
  \ Java 程序的基本结构。\n\n请注意，在本章中，我为你介绍了几个 Java 编程特性，这些特性在后面的章节中有更详细的解释。例如，你会看到一些变量声明、一个方法，甚至一个\
  \ `if` 语句和一个 `for` 循环。本章的目标并不是让你立即精通这些编程元素，而是为了向你介绍它们。\n\n你可以在书中使用的所有代码列表可以在 `[www.dummies.com/go/javaaiofd5e](http://www.dummies.com/go/javaaiofd5e)`\
  \ 找到。\n\n# 列表 1-1：HelloApp 程序\n\n```java\npublic class HelloApp {\n    public static\
  \ void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n \
  \   }\n}\n```\n\n### 查看 Hello, World! 程序\n\n许多书籍从一个在控制台上显示“Hello, World!”的简单程序开始。在第\
  \ 1 章中，我将逐字地带你学习它。\n\n第 1 行和第 2 行标记了 `public class` 的声明。\n\n* **public**: Java 语言的关键字，表示后面的元素应该是公开可用的。这意味着除了\
  \ `HelloApp` 类之外的类都可以使用它。在这种情况下，紧随其后的是名为 `HelloApp` 的类。\n* **class**: 另一个 Java 关键字，表示此处定义的元素是一个类。所有的\
  \ Java 程序都由一个或多个*类*组成。虽然大多数真实世界中的程序由多个类组成，但你在书中看到的简单程序只有一个类。\n* **HelloApp**: 标识符，为此处定义的类提供名称。相反，像\
  \ `public` 和 `class` 这样的关键字是 Java 语言定义的单词，而标识符是你创建的单词，用于为你使用的各种元素命名。在这种情况下，标识符 `HelloApp`\
  \ 为该公共类提供了名称。\n* **{**: 第 2 行的左括号标记了类*体体*的开始。类体的结束由第 7 行的右括号标记。这些括号内的所有内容都属于该类。在学习\
  \ Java 时，你会发现它经常使用大括号。\n\n第 3 行到第 6 行定义了 `HelloApp` 类的一个名为 `main` 方法：\n\n* **public**:\
  \ 再次使用了 public 关键字，这次表示此处声明的方法应该具有公共访问权限。这意味着除了 `HelloApp` 类之外的类都可以使用它。所有的 Java\
  \ 程序必须有一个声明了名为 `main` 的公共方法的类。main 方法包含运行程序时执行的语句。\n* **static**: 你可以在第 3 章第 3 章找到关于\
  \ `static` 关键字的所有内容。现在只需听我的，Java 语言要求在声明 main 方法时指定 `static`。\n* **void**: 在 Java\
  \ 中，*方法*是一个可以计算并返回值的代码单元。例如，你可以创建一个计算销售总额的方法。销售总额就是该方法的返回值。如果方法不需要返回值，则必须使用 `void`\
  \ 关键字来表示不返回值。由于 Java 要求 main 方法不返回值...\n\n\n\n\n返回一个值，你必须声明主方法时必须指定 `void`。\n\n\
  `main:`：最后，这里是为该方法提供名称的标识符。\n\n正如我已经提到的，Java 要求此方法必须命名为 `main`。\n\n除了 `main` 方法外，你可以使用任何你喜欢的名称创建额外的方法。你将在\
  \ `Book2` 的 `Chapter 7` 中发现如何创建额外方法。在此之前，程序仅包含一个名为 `main` 的方法。\n\n`(String[] args)`：噢，老兄。这个\
  \ Java 元素太高级了，现在还无法进行彻底解释。它被称为*参数列表*（parameter list），用于向方法传递数据。Java 要求 `main` 方法必须接收一个\
  \ `String` 对象数组作为单一参数。按照惯例，此参数命名为 `args`。如果你不知道什么是参数、`String` 或数组，不用担心。你可以在下一章中了解什么是\
  \ `String`，参数在 `Book2` 的 `Chapter 7` 中；数组在 `Book4` 中。在此期间，请记住在在你所有程序的 `main` 方法声明中，都必须编写\
  \ `(String[] args)`。\n\n### 4 另一个 {\n另一组括号从第 4 行开始，到第 6 行结束。这些括号标记了 `main` 方法的主体。注意第\
  \ 6 行的右括号与第 4 行的左括号匹配，而第 7 行的右括号与第 2 行的左括号匹配。这种配对在 Java 中很常见。简而言之，每当你遇到右括号时，它都会与最近的一个尚未关闭的左括号匹配——即尚未与右括号配对的左括号。\n\
  \n### 5 System.out.println(\"Hello, World!\");\n这是整个程序中唯一的语句。它调用了属于 `System.out`\
  \ 对象的名为 `println` 的方法。`println` 方法在控制台上显示一行文本。要显示的文本作为参数传递给 `println` 方法，位于单词 `println`\
  \ 随后的括号中。在这种情况下，文本是封装在双引号中的字符串字面量 `Hello, World!`。因此，该语句在控制台上显示文本 `Hello, World!`。注意，在\
  \ Java 中，大多数（但不是所有）语句必须以分号结束。由于该语句是程序中唯一的语句，所以这一行是唯一需要分号的行。\n\n### 6 }\n第 6 行包含右括号，标记了由第\
  \ 4 行左括号开始的 `main` 方法主体的结束。\n\n### 7 另一个 }\n第 7 行包含右括号，标记了由第 2 行左括号开始的 `HelloApp`\
  \ 类主体的结束。由于此程序只包含一个类，这一行也标记了程序的结束。\n\n要运行此程序，你必须首先使用如 `Notepad` 或 `TextPad` 等文本编辑器输入它——完全按照列表\
  \ 1-1 所示的内容——保存到名为 `HelloApp.java` 的文本文件中。然后你可以在命令行提示符中运行以下命令来编译它：\n\n```bash\n\
  javac HelloApp.java\n```\n\n此命令创建了一个名为 `HelloApp.class` 的类文件，其中包含了为 `HelloApp` 类编译的\
  \ Java 字节码。\n\n你可以通过输入此命令来运行程序：\n\n```bash\njava HelloApp\n```\n\n现在你已经看到了 Java\
  \ 程序实际的模样，你就能更好地理解此命令的具体作用了。首先，它将 Java 虚拟机 (`JVM`) 加载到内存中。然后它找到位于名为 `HelloApp.class`\
  \ 文件中的 `HelloApp` 类。最后，它运行 `HelloApp` 类的 `main` 方法。`main` 方法反而在控制台上显示消息“Hello, World!”。\n\
  \n本章的其余部分将更详细地描述 Java 编程语言的一些基本元素。\n\n## 处理关键字\n\n*关键字*（keyword）是由 Java 编程语言定义的具有特殊含义的单词。之前列表\
  \ 1-1 中所示程序使用了四个关键字：`public`、`class`、`static` 和 `void`。Java 一共有 53 个关键字。它们按字母顺序列列在表\
  \ 1-1 中。\n\n**表 1-1：Java 关键字**\n\nabstract, default, goto, package, synchronized,\
  \ assert, do, if, private, this, boolean, double, implements, protected, throw,\
  \ break, else, import, public, throws, byte, enum, instanceof, return, transient,\
  \ case, extends, int, short, true, catch, false, interface, static, try, char, final,\
  \ long, strictfp, void, class, finally, native, super, volatile, const, float, new,\
  \ switch, while, continue, for, null.\n\n奇怪的是，表 1-1 中列出的三个关键字——`true`、`false` 和\
  \ `null` 在技术上并不被视为关键字。相反，它们被称为*字面量*（literals）。尽管如此，它们以非常相似的方式被 Java 语言保留。\n\n##\
