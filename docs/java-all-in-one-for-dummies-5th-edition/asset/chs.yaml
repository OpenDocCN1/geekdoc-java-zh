  \ 方法减少计数器并相应地更新标签文本。\n\n**处理事件**\n\n第 2 章 **处理事件** 601\n\n![Image 62](img/index-625_1.jpg)\n\
  \n**本章内容**\n- » 学习 Stage 和 Scene 类的一些实用用方法\n- » 在单个舞台内交替场景（scenes）\n- » 显示警报框（alert\
  \ boxes）\n- » 探发现退出 JavaFX 程序的正确方法\n\n# 第 3 章 设置舞台和场景布局 603\n\n## 检查 Stage 类\n\n\
  舞台（stage）由 `Stage` 类表示，它是 JavaFX 用户界面出现的顶层容器。在 Windows、Mac 或 Linux 中，舞台通常是一个窗口。在其他类型的设备上（如智能手机或平板电脑），舞台可能是全屏或平铺区域。\n\
  \n当 JavaFX 启动时，会自动创建一个名为*主舞台*（primary stage）的舞台。该舞台通过 `primaryStage` 参数传递给应用程序的\
  \ `start` 方法：\n\n```java\n@Override\npublic void start(Stage primaryStage) {\n \
  \   // primaryStage 指向主舞台\n}\n```\n\n然后你可以通过添加场景（Scene）来创建应用程序的界面，场景包含一个或多个控件或其他界面节点。在许多情况下，你需要在\
  \ `start` 方法的作用范围内访问主舞台。你可以通过定义类字段并使用它引用主舞台来轻松实现这一点。你将在本章后面的“切换场景”部分看到如何操作的示例。\n\
  \n主舞台最初具有普通窗口应用程序的默认特性，这取决于运行程序的操作系统。如果你需要，可以更改这些默认设置以适应应用程序的需求。至少你应该始终设置窗口标题。你可能还想更改舞台是否可调整以及舞台外观的各个方面。\n\
  \n`Stage` 类配备了许多方法，让你操作舞台的外观和行为。表 3-1 列出了你最可能使用的方法。\n\n604 第 6 **JavaFX**\n\n**表\
  \ 3-1：Stage 类的常用方法**\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `close()` | 关闭舞台。 |\n| `initModality(Modality\
  \ modality)` | 设置舞台的模态。此方法必须在 `show` 方法之前调用。模态可以是以下之一：`Modality.NONE`、`Modality.APPLICATION_MODAL``Modality.WINDOW_MODAL`。\
  \ |\n| `initStyle(StageStyle style)` | 设置舞台的样式。此方法必须在 `show` 方法之前调用。样式可以是以下之一：`StageStyle.DECORATED`、`StageStyle.UNDECORATED`。\
  \ |\n\n\n\n\n\n`StageStyle.TRANSPARENT`\n\n`StageStyle.UNIFIED`\n\n`StageStyle.UTILITY`\n\
  \n`void getMaxHeight(double maxheight)`\n获取阶段的最大高度。\n\n`void getMaxWidth(double\
  \ maxwidth)`\n获取阶段的最大宽度。\n\n`void getMinHeight(double maxheight)`\n获取阶段的最小高度。\n\n\
  `void getMinWidth(double maxwidth)`\n获取阶段的最小宽度。\n\n`void setFullScreen(boolean fullscreen)`\n\
  设置阶段的全屏状态。\n\n`void setIconified(boolean iconified)`\n设置阶段的最小化状态。\n\n`void setMaximized(boolean\
  \ maximized)`\n设置阶段的最大化状态。\n\n`void setMaxHeight(double maxheight)`\n设置阶段的最大高度。\n\
  \n`void setMaxWidth(double maxwidth)`\n设置阶段的最大宽度。\n\n`void setMinHeight(double maxheight)`\n\
  设置阶段的最小高度。\n\n`void setMinWidth(double maxwidth)`\n设置阶段的最小宽度。\n\n`void setResizable(boolean\
  \ resizable)`\n设置阶段的可调整大小状态。\n\n### 设置舞台与场景布局\n\n`void setScene(Scene scene)`\n\
  设置要在舞台上显示的场景。\n\n（上上）\n\n第 3 章 设置舞台与场景布局 605\n\n### 表 3-1（续）\n\n| 方法 | 说明 |\n| :---\
  \ | :--- |\n| `void setTitle(String title)` | 设置在舞台标题栏中显示的标题（如果标题栏可见）。 |\n| `void\
  \ show()` | 使舞台可见。 |\n| `void showAndWait()` | 使舞台可见，然后等待舞台关闭后继续执行程序。 |\n| `void\
  \ toFront()` | 强制将舞台置于顶层。 |\n| `void toBack()` | 强制将舞台置于底层。 |\n\n接下来的段落指出了使用表 3-1\
  \ 中列出的 `Stage` 类方法的一些细节：\n\n**» 对于许多（如果不是大多数）应用程序来说，你只需要使用表 3-1 中的三个方法：`setScene`、`setTitle`\
  \ 和 `show`。**\n\n- 每一个舞台*必须*有一个场景。\n- 每一个舞台*理上应该*有一个标题。\n- 如果你不打算向用户显示舞台，那么创建一个舞台就没有太大意义。\n\
  \n表中的其他方法允许你更改舞台的外观或行为，但在大多数情况下，默认设置是可以接受的。\n\n**» 如果你想防止用户调整舞台的大小，可以像这样使用 `setResizable`\
  \ 方法：**\n\n```java\nprimaryStage.setResizable(false);\n```\n\n然后，用户就无法更改窗口的大小。（默认情况下，舞台是可调整大小的。因此，除非你想让舞台不可调整，否则不需要调用\
  \ `setResizable` 方法。）\n\n**» 如果舞台是可调整大小的，你可以设置窗口的最小和最大尺寸。** 例如：\n\n```java\nprimaryStage.setResizable(true);\n\
  primaryStage.setMinWidth(200);\nprimaryStage.setMinHeight(200);\nprimaryStage.setMaxWidth(600);\n\
  primaryStage.setMaxHeight(600);\n```\n\n在这个示例中，用户可以调整窗口大小，但最小允许尺寸是 200x200 像素，最大允许尺寸是\
  \ 600x600 像素。\n\n606 第 6 本 JavaFX\n\n**» 如果你想在最大化窗口中显示舞台，请调用 `setMaximized`：**\n\
  \n```java\nprimaryStage.setMaximized(true);\n```\n\n最大化窗口仍然具有通常的装饰（标题栏、窗口边框以及最小化、还原和关闭按钮）。如果你想让舞台完全占据屏幕且没有任何此类装饰，请使用\
  \ `setFullScreen` 方法：\n\n```java\nprimaryStage.setFullScreen(true);\n```\n\n当你的舞台进入全屏模式时，JavaFX\
  \ 会显示一条消息，告知用户如何退出全屏模式。\n\n**» 如果出于某种原因，你想让程序最小化为图标启动，请使用 `setIconified` 方法：**\n\
  \n```java\nprimaryStage.setIconified(true);\n```\n\n**» 有关 `close` 方法的更多信息，请参见本章后面的“退出，谢幕”部分。**\n\
  \n**» `initModality` 和 `initStyle` 方法很有趣，因为它们只能在调用 `show` 方法*之前*被调用。** `initModality`\
  \ 方法允许你创建一个模态对话框——即在用户继续使用程序内其他功能之前必须关闭的窗口。而 `initStyle` 方法则允许你创建没有通常装饰（如标题栏或最小化、还原和关闭按钮）的窗口。你通常在需要为主舞台之外的应用程序创建额外的舞台时使用这些方法。你可以在本章稍后的“创建对话框”部分阅读更多关于其工作原理的内容。\n\
  \n## 查看 Scene 类\n\n与 `Stage` 类一样，`Scene` 类也是 JavaFX 程序的基础。在每个 JavaFX 程序中，你都会至少使用一个\
  \ `Scene` 类的实例来持有用户在运行程序时与之交互的用户界面控件。\n\n设置舞台与场景布局\n\n表 3-2 列出了 `Scene` 类中更常用的构造函数和方法。\n\
  \n第 3 章 设置舞台与场景布局 607\n\n### 表 3-2：Scene 类的常用构造函数和方法\n\n| 构造函数 | 说明 |\n| :--- |\
  \ :--- |\n| `Scene(Parent root)` | 创建具有指定根节点的新场景 |\n| `Scene(Parent root, double\
  \ width, double height)` | 创建具有指定根节点、宽度和高度的新场景 |\n\n| 方法 | 说明 |\n| :--- | :--- |\n\
  | `double getHeight()` | 获取场景的高度 |\n| `double getWidth()` | 获取场景的宽度 |\n| `double\
  \ getX()` | 获取场景的水平位置 |\n| `double getY()` | 获取场景的垂直位置 |\n| `void setRoot(Parent\
  \ root)` | 设置根节点 |\n\n接下来的段落解释了 `Scene` 类构造函数和方法的一些有趣细节：\n\n**» 所有的 Scene 构造函数都要求指定根节点。**\
  \ 你可以通过调用 `setRoot` 方法更改根节点，但无法没有根节点创建场景。\n\n**» 你可能奇怪为什么根节点是 `Parent` 的实例而不是 `Node`\
  \ 的实例。** `Parent` 类实际上是 `Node` 的子类，代表一个具有子节点的节点。还有其他 `Node` 的子类代表没有子节点的节点；这些节点不能作为场景的根节点。\n\
  \n**» 你可以在创建场景时通过指定 Width 和 Height 参数设置场景的尺寸。** 如果你不设置大小，场景将根据内容确定自己的大小。\n\n**»\
  \ 你可以通过 `getHeight` 和 `getWidth` 方法获取场景的大小。** 没有对应的设置方法让你设置高度或宽度。\n\n**» 通常情况下，场景的大小决定舞台的大小，只要该场景不小于舞台指定的最小尺寸或大于最大尺寸。**\n\
  \n**» 如果用户调整舞台大小，场景的大小也会随之调整。**\n\n608 第 6 本 JavaFX\n\n![图 63](img/index-631_1.png)\n\
  \n![图 64](img/index-631_2.png)\n\n## 切换场景\n\nJavaFX 程序的主舞台（或任何其他舞台）在任何时候内部只能显示一个场景。然而，这并不意味着你的程序不能创建多个场景并在需要时切换。例如，假设你正在开发一个文字处理程序，并让让可以在编辑视图和页面预览视图之间切换。你可以通过创建两个不同的场景（每个视图一个）来实现。然后，为了在视图之间切换，你只需调用舞台的\
  \ `setScene` 方法即可切换场景。\n\n在本书的第 1 章中，你阅读了一个 `ClickCounter` 程序，它的场景显示一个标签和一个按钮，然后更新标签以指示用户点击按钮的次数。然后，在本书的第\
  \ 2 章中，你看到了 `AddSubtract` 程序的几种变体，它的场景显示一个标签和两个按钮：一个按钮点击时会将计数器加 1，另一个则从计数器中减 1。\n\
