  \ 循环用于测试各种移动情况。\n- **72**: `printBoard` 方法使用嵌套循环来打印棋盘。外层循环打印每一行。注意，它是反向索引数组，从 7\
  \ 开始一直到 0。这样做是为了让第一行打印在输出的底部。\n- **78**: `convertSquareToPos` 方法的功能与 `convertPosToSquare`\
