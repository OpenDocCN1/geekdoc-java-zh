  \ alignment)` | 设置行内节点的对齐方式。 |\n| `void setSpacing(double value)` | 设置流式布局内显示节点之间的间距。\
  \ |\n| `void setVgap(double value)` | 设置垂直间隙。对于垂直流式布局，这是节点之间的空间。对于水平流式布局，这是行之间的空间。\
  \ |\n\n640 第 6 册 **JavaFX**\n\n`FlowPane` 类定义在 `javafx.scene.layout` 包中，因此在任何使用流式布局的程序中都应该包含以下导入语句：\n\
  \n`import javafx.scene.layout.*;`\n\n该类的构造函数允许你指定水平和垂直间隙（提供布局水平和垂直元素之间的间距）、方向（水平或垂直）以及填充布局的子节点。\n\
  \n要设置流式布局换行的限制，使用 `setPrefWrapLength` 方法。换行长度应用于窗格流内容的维度。因此，对于水平流式布局，换行长度指定窗格的首选宽度；对于垂直流式布局，它指定首选高度。\n\
  \n注意，无论首选换行长度如何，如果不调用此方法，换行长度默认为 400 像素。\n\n以下示例创建一个具有 10 像素水平和垂直间隙的水平布局，填充了五个按钮，并将首选换行长度设置为\
  \ 300 像素：\n\n```java\nButton btn1 = new Button(\"Button One\");\nButton btn2 = new\
  \ Button(\"Button Two\");\nButton btn3 = new Button(\"Button Three\");\nButton btn4\
  \ = new Button(\"Button Four\");\nButton btn5 = new Button(\"Button Five\");\nFlowPane\
  \ pane = new FlowPane(Orientation.HORIZONTAL, 10, 10, btn1, btn2, btn3, btn4, btn5);\n\
  ```\n\n641 第 4 章 **使用布局窗格来安排你的场景**\n\n![Image 71](img/index-664_1.png)\n\n\n\n\n\
  \n```java\npane.setPrefWrapLength(300);\n```\n\n图 4-5 显示了当将布局添加到场景并在舞台中显示场景时，这些按钮外观。此图还显示了当用户调整窗口大小时，流式布局（flow\
  \ layout）中的按钮是如何重新排列的。注意，最初，前三个按钮出现在第一行，接下来的两个出现在第二行。当窗口被向外拖宽一点时，按钮会重新流式，使得第一行可以容纳四个按钮，而只有一个按钮溢到第二行。然后，当窗口被向内缩小时，前两行中各只出现两个按钮，并为第五个按钮创建了第三行。\n\
  \n**图 4-5：**\n带有五个按钮的流式布局面板。\n\n642 第 6 卷 **JavaFX**\n\n![Image 72](img/index-665_1.png)\n\
  \n## 使用边界布局 (Border Layout)\n\n边框布局是一种划分为五个区域的面板：顶部、左侧、中间、右侧和底部，如图 4-6 所示。当你向布局中添加组件时，可以指定该组件放入这些区域中的哪一个。\n\
  \n### 使用布局面板安排你的场景\n\n**图 4-6：**\n边界布局如何划分区域。\n\n边界布局是具有传统窗口布局应用程序的理想布局管理器，在这种布局中，菜单和工具栏显示在窗口顶部，状态栏或\
  \ OK 和取消按钮显示在底部，导航面板显示在左侧，各种任务面板显示在右侧，内容显示在中间。\n\n使用 `BorderPane` 类来创建边界布局。表 4-7\
  \ 列出了 `BorderPane` 类的构造函数和最常用的方法。\n\n`BorderPane` 类定义在 `javafx.scene.layout` 包中，因此在任何使用边界布局的程序中，都应该包含以下导入语句：\n\
  \n```java\nimport javafx.scene.layout.*;\n```\n\n第 4 章 **使用布局面板安排你的场景** 643\n\n\
  **表 4-7**\n**BorderPane 构造函数与方法**\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n| `BorderPane()`\
  \ | 创建一个空的边界布局。 |\n| `BorderPane(Node center)` | 创建具有指定中间节点的边界布局。 |\n| `BorderPane(Node\
  \ center, Node top, Node right, Node bottom, Node left)` | 创建具有指定的中间、顶部、右侧、底部和左侧节点的边界布局。\
  \ |\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void setCenter(Node node)` | 设置中间节点。 |\n\
  | `void setTop(Node node)` | 设置顶部节点。 |\n| `void setRight(Node node)` | 设置右侧节点。 |\n\
  | `void setBottom(Node node)` | 设置底部节点。 |\n| `void setLeft(Node node)` | 设置左侧节点。\
  \ |\n| `void setAlignment(Pos alignment)` | 设置边界面板内节点的对齐方式。参见表 4-5 关于 `Pos` 枚举的解释。更多信息请参阅本章前面的“在布局面板中对齐节点”部分。\
  \ |\n| `static void setMargin(Node child, Insets value)` | 为指定的子节点设置边距。参见表 4-2 关于\
  \ `Insets` 类的构造函数。更多信息请参阅本章前面的“使用边距添加空间”部分。 |\n\n该类的默认构造函数会创建一个空的边界布局，你可以稍后为其添加节点，如示例所示：\n\
  \n```java\nButton btn1 = new Button(\"Button One\");\nButton btn2 = new Button(\"\
  Button Two\");\nButton btn3 = new Button(\"Button Three\");\nVBox vbox = new VBox(btn1,\
  \ btn2, btn3);\nBorderPane pane = new BorderPane();\npane.setCenter(vbox);\n```\n\
  \n在这里，创建了三个按钮并将其到 `VBox` 中。然后，创建一个边界布局，并将 `VBox` 添加到它的中间区域。\n\n644 第 6 卷 **JavaFX**\n\
  \n或者，你可以通过 `BorderPane` 构造函数向中间区域添加节点，如下：\n\n```java\nBorderPane pane = new BorderPane(vbox);\n\
  ```\n\n表 4-7 列出的第三个构造函数允许你一次性向所有五个区域添加节点。以下示例假设你已经创建了五个名为 `centerPane`、`topPane`、`rightPane`、`bottomPane`\
  \ 和 `leftPane` 的面板：\n\n**使用布局面板安排你的场景**\n\n```java\nBorderPane pane = new BorderPane(centerPane,\
  \ topPane, rightPane, bottomPane, leftPane);\n```\n\n这里有关于 `BorderPane` 类需要了解的额外要点：\n\
  \n- » 如果你没有向其中一个区域添加节点，则该区域将不会渲染。\n- » 边界布局区域的大小根据其内容确定。因此，如果你向右侧区域添加一个 `VBox` 面板，则\
  \ `VBox` 面板的宽度将决定右侧区域的宽度。\n- » 如果用户调整窗口大小使其变宽，顶部、中间和底部的区域宽度将扩展——而左侧和右侧区域的宽度保持不变。\n\
  同样，如果用户拖动窗口使其更高，左侧、中间和右侧区域的高度将扩展；顶部和底部区域的高度保持不变。\n- » 你添加到边界面板区域中的节点，其本身几乎总是其他的其他布局面板。\n\
  \n## 使用网格面板布局 (GridPane Layout)\n\n网格面板布局管理器允许你在行和列的网格中安排 GUI 元素。与平铺面板不同，网格面板的行和列不需要相同的大小。相反，网格面板根据你添加的组件自动调整列的宽度和行的高度。\n\
  \n第 4 章 **使用布局面板安排你的场景** 645\n\n![Image 73](img/index-665_1.png)\n\n这里是网格布局的一些额外重要点：\n\
  \n- » 你可以指定组件放入哪个单元格，并控制组件在面板中的位置。\n- » 你可以创建跨越多行或多列的组件，例如跨两列或四行。\n- » 你可以告诉 `GridPane`\
  \ 伸展组件以填充区域（如果它不够大），可以是水平、垂直或两者。\n- » 如果组件没有填充其分配的区域，你可以告诉网格布局如何对其对齐——例如左对齐或右对齐。\n\
  \n以下章节将介绍使用网格面板的内部和细节。\n\n### 规划草图\n\n在创建网格面板之前，先画一张草图，显示你希望组件在面板中的外观。然后将面板划分为行和列，并从左上开始为行列编号。图\
  \ 4-7 显示了一个用于订购披萨应用程序的草图。\n\n**图 4-7：**\n面板草图。\n\n646 第 6 卷 **JavaFX**\n\n| 组件 |\
  \ x | y | 对齐方式 | 跨度 |\n| :--- | :--- | :--- | :--- | :--- |\n| “姓名”标签 | 0 | 0 |\
  \ 右 | |\n| “电话”标签 | 0 | 1 | 右 | |\n| “地址”标签 | 0 | 2 | 右 | |\n| 姓名文本框 | 1 | 0 | 左\
  \ | 2 |\n| 电话文本框 | 1 | 1 | 左 | 2 |\n| 地址文本框 | 1 | 2 | 左 | 2 |\n| 尺寸单选按钮 | 0 | 3\
  \ | 左 | |\n| 样式单选按钮 | 1 | 3 | 左 | |\n| 披萨配料复选框 | 2 | 3 | 左 | |\n| OK 和关闭按钮 | 2 |\
  \ 4 | 右 | |\n\n在布局好网格后，你就可以编写代码将每个组件放在正确的位置。\n\n### 创建网格面板\n\n表 4-8 显示了 `GridPane`\
  \ 类最常用的构造函数和方法，你使用它们来创建网格面板。\n\n要创建一个基础网格面板，首先调用 `GridPane` 构造函数。然后，使用 `add` 方法将节点添加到网格面板的单元格中。`add`\
  \ 方法的参数指定了要添加的节点、节点的列索引和行索引。例如，以下代码段创建了一个标签，然后创建一个网格面板并将标签添加到列 0、行 0 的单元格中：\n\n\n\
  \n```java\nLabel lblName = new Label(\"Name\");\nGridPane grid = new GridPane();\n\
  grid.add(lblName, 0, 0);\n```\n\n\n\n\n\n# 第 4 章：使用布局面板安排你的场景\n\n## 表 4-8：GridPane\
  \ 构造函数和方法\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n| `GridPane()` | 创建一个空的网格面板。 |\n\n\
  | 方法 | 描述 |\n| :--- | :--- |\n| `void add(Node node, int col, int row)` | 在指定的列和行索引处添加节点。\
  \ |\n| `void add(Node node, int col, int row, int colspan, int rowspan)` | 在指定的列和行索引处添加节点，并指定列跨度和行跨度。\
  \ |\n| `void addColumn(int col, Node... nodes)` | 添加一整列节点。 |\n| `void addRow(int\
  \ row, Node... nodes)` | 添加一整行节点。 |\n| `<ObservableList> getColumnConstraints()`\
  \ | 返回列约束。更多信息请参见表 11-6。 |\n| `<ObservableList> getRowConstraints()` | 返回行约束。更多信息请参见表\
  \ 11-7。 |\n| `void setColumnSpan(Node node, int colspan)` | 设置指定节点的列跨度。 |\n| `void\
  \ setRowSpan(Node node, int colspan)` | 设置指定节点的行跨度。 |\n| `void setHalignment(Node\
  \ node, HPos value)` | 设置节点的水平对齐方式。允许的 HPos 值有 `HPos.LEFT`、`HPos.CENTER` 和 `HPos.RIGHT`。\
  \ |\n| `void setValignment(Node node, VPos value)` | 设置节点的垂直对齐方式。允许的 VPos 值有 `VPos.BOTTOM`、`VPos.CENTER`\
  \ 和 `VPos.TOP`。 |\n| `void setHgap(double value)` | 设置列与列之间间隙的大小。 |\n| `void setVgap(double\
  \ value)` | 设置行与行之间间隙的大小。 |\n| `static void setMargin(Node node, Insets value)`\
  \ | 设置特定节点的边距。关于 `Insets`类的解释参见第 5 章表 5-2。 |\n| `void setPadding(Insets value)`\
  \ | 设置网格面板内部边缘的内边距。关于 `Insets` 解释参见第 5 章表 5-2。 |\n| `void setMinHeight(double value)`\
  \ | 设置网格面板的最小高度。 |\n| `void setMaxHeight(double value)` | 设置网格面板的最大高度。 |\n| `void\
  \ setPrefHeight(double value)` | 设置网格面板的优先高度。 |\n| `void setMinWidth(double value)`\
  \ | 设置网格面板的最小宽度。 |\n| `void setMaxWidth(double value)` | 设置网格面板的最大宽度。 |\n| `void\
  \ setPrefWidth(double value)` | 设置网格面板的优先宽度。 |\n\n## 使用布局面板安排你的场景\n\n在网格面板中填充节点的典型方法是为每个节点调用\
  \ `add` 方法。然而，如果你愿意，，可以通过一次调用 `addColumn` 或 `addRow` 来一次添加一整列或一整行的节点。例如，此示例创建了一个标签和一个文本字段，然后创建一个网格面板并将标签和文本字段添加到第一行：\n\
  \n```java\nLabel lblName = new Label(\"Name\");\nTextField txtName = new TextField();\n\
  GridPane grid = new GridPane();\ngrid.addRow(0, lblName, txtName);\n```\n\n如果一个节点应该跨越多个列，你可以调用\
  \ `setColumnSpan` 方法来指定节点应跨越的列数。例如：\n\n```java\ngrid.setColumnSpan(txtName, 2);\n\
  ```\n\n在这里，`txtName` 节点将跨越两列。如果你需要配置节点跨越多行，可以以类似的方式使用 `setRowSpan`。\n\n要控制节点的水平对齐方式，可以使用本例所示的\
  \ `setHalignment` 方法：\n\n```java\ngrid.setHalignment(lblName, HPos.RIGHT);\n```\n\
  \n在这里，`lblName` 在其所在的列中右对齐。`setValignment` 方法的作用原理也类似。\n\n与其他布局面板一样，`GridPane` 类拥有许多用于设置间距和对齐细节的方法。你可以使用\
  \ `setHgap` 和 `setVgap` 方法来设置行与列之间的间距，这样你的布局看起来就不会那么拥挤了。你可以使用 `setPadding` 和 `setMargins`\
  \ 方法来设置内边距和边距，它们的工作方式与其他布局面板完全相同。你还可以为网格面板设置最小、最大和优先的宽度和高度。\n\n## 使用网格面板约束工作\n\n\
  你可以使用 `GridPane` 类的方法控制网格面板布局的大多数方面，但遗憾的是，你无法控制单个列或行的大小。要实现这一点，你必须使用 `ColumnConstraints`\
  \ 或 `RowConstraints` 类，如表 4-9 和 4-10 所示。\n\n### 表 4-9：ColumnConstraints 类\n\n| 构造函数\
  \ | 描述 |\n| :--- | :--- |\n| `ColumnConstraints()` | 创建一个空的列约束对象。 |\n| `ColumnConstraints(double\
  \ width)` | 创建具有固定宽度的列约束。 |\n| `ColumnConstraints(double min, double pref, double\
  \ max)` | 创建具有指定最小、优先和最大宽度的列约束。 |\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void setMinWidth(double\
  \ value)` | 设置列的最小宽度。 |\n| `void setMaxWidth(double value)` | 设置列的最大宽度。 |\n| `void\
  \ setPrefWidth(double value)` | 设置列的优先宽度。 |\n| `void setPercentWidth(double value)`\
  \ | 设置总宽度的百分比设置宽度。 |\n| `void setHgrow(Priority value)` | Determine 当网格面板宽度增加时，列宽度是否伸缩。允许值为\
  \ `Priority.ALWAYS`、`Priority.NEVER` 和 `Priority.SOMETES`。 |\n| `void setWidth(boolean\
  \ value)` | 如果为 true，网格面板将扩展节点以填充空间。 |\n| `void setHalignment(HPos value)` | 设置整个列的水平对齐方式。允许值为\
  \ `HPos.LEFT`、`HPos.CENTER` 和 `HPos.RIGHT`。 |\n\n要使用列约束设置网格面板每列的固定宽度，首先为每一列创建一个约束。然后将这些约束添加到网格面板。这是一个示例：\n\
  \n```java\nColumnConstraints col1 = new ColumnConstraints(200);\nColumnConstraints\
  \ col2 = new ColumnConstraints(200);\nColumnConstraints col3 = new ColumnConstraints(200);\n\
  GridPane grid = new GridPane();\ngrid.getColumnConstraints().addAll(col1, col2,\
  \ col3);\n```\n\n### 表 4-10：RowConstraints 类\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n\
  | `RowConstraints()` | 创建一个空的行约束对象。 |\n| `RowConstraints(double height)` | 创建具有固定高度的行约束。\
  \ |\n| `RowConstraints(double min, double pref, double max)` | 创建具有指定的最小、优先和最大高度的行约束。\
  \ |\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void setMinHeight(double value)` | 设置行的最小高度。\
  \ |\n| `void setMaxHeight(double value)` | 设置行的最大高度。 |\n| `void setPrefHeight(double\
  \ value)` | 设置行的优先高度。 |\n| `void setPercentHeight(double value)` | 设置总高度的百分比高度。\
  \ |\n| `void setVgrow(Priority value)` | Determine 当网格面板高度增加时，行高度是否伸缩。允许值为 `Priority.ALWAYS`、`Priority.NEVER`\
  \ 和 `Priority.SOMETES`。 |\n| `void setHeight(boolean value)` | 如果为 true，网格面板将扩展节点以填充空间。\
  \ |\n| `void setValignment(VPos value)` | 设置整个行的垂直对齐方式。允许值为 `VPos.TOP`、`VPos.CENTER`\
  \ 和 `VPos.BOTTOM`。 |\n\n列约束最有用的功能之一是能够将网格面板列的宽度作为网格面板总宽度的百分比。例如，假设网格面板将由三列组成，你希望无论网格面板宽度如何，它们的宽度都相同。以下代码实现了这一点：\n\
  \n```java\nColumnConstraints col1 = new ColumnConstraints();\ncol1.setPercentWidth(33);\n\
  ColumnConstraints col2 = new ColumnConstraints();\ncol2.setPercentWidth(33);\nColumnConstraints\
  \ col3 = new ColumnConstraints();\ncol3.setPercentWidth(33);\nGridPane grid = new\
  \ GridPane();\ngrid.getColumnConstraints().addAll(col1, col2, col3);\n```\n\n在这个示例中，每列将填充网格的\
  \ 33%。\n\n\n\n\n\n![Image 74](img/index-674_1.png)\n\n可以通过列约束或行约束设置的属性中，有几个与你可以通过\
  \ `GridPane` 类为单个节点设置的属性相似。例如，你可以通过调用 `grid pane` 上的 `setHalignment` 方法设置单个节点的水平对齐方式。或者，你也可以通过创建一个列约束，设置其水平对齐方式，然后将该列约束应用于\
  \ `grid pane` 中的某一列，从而设置整列的水平对齐方式。\n\n### 检查 grid pane 示例\n\n列表 4-1 显示了显示图 4-8 中我绘制场景的程序代码，而图\
