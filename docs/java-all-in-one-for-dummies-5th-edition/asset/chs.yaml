  \ = true;\n            if ((guess < 1) || (guess > 10))\n            {\n       \
  \         System.out.print(\"I said, between 1 \" + \"and 10. Try again: \");\n\
  \                validInput = false;\n            }\n        } while (!validInput);\n\
