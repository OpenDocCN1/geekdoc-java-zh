  # 第 2 章 处理事件\n\n### 检查事件\n\n*事件*（event）是在用户对你的用户界面组件执行某些值得关注的操作时生成的对象。然后，该事件对象会被传递到你创建的一个特殊方法，该方法被称为事件处理器（event\
  \ handler）。*事件处理器*可以检查事件对象，确定确切发生了什么种类型的事件，并据此做出响应。如果用户点击了按钮，事件处理器可能会将用户通过文本字段输入的任何数据写入文件。如果用户将鼠标光标悬停在标签上，事件处理器可能会更改标签显示的文本。如果用户从组合框中选择一个项，事件处理器可能会使用所选的值在数据库中查找信息。可能性是无限的！\n\
  \n事件由 `javafx.event.Event` 类的实例或其许多子类之一表示。表 2-1 列出了最常用的事件类。\n\n### 表 2-1 常用事件类\n\
  \n| 事件类 | 包 | 描述 |\n| :--- | :--- | :--- |\n| `ActionEvent` | `javafx.event` | 当用户对按钮或其他组件执行操作时创建。通常这意味着用户点击了按钮，但用户也可以通过\
  \ Tab 键切换到按钮并按 Enter 键来触发按钮操作。这是最常用的事件类，因为它代表了最常见的用户界面事件。 |\n| `InputEvent` | `javafx.scene.input`\
  \ | 当发生由于用户输入的事件（如鼠标点击或按键点击）时创建。 |\n| `KeyEvent` | `javafx.scene.input` | 当用户按下键盘上的按键时创建。此事件可用于监控用户输入的特定按键。（`KeyEvent`\
  \ 是 `InputEvent` 的子类。） |\n| `MouseEvent` | `javafx.scene.input` | 当用户使用鼠标进行有趣操作时创建，例如点击其中一个按钮、拖动鼠标或简单地将鼠标光标移动到另一个对象上。（`MouseEvent`\
  \ 是 `InputEvent` 的子类。） |\n| `TouchEvent` | `javafx.scene.input` | 当用户在允许触摸输入的设备上启动触摸事件时创建。\
  \ |\n| `WindowEvent` | `javafx.stage` | 当窗口（阶段）状态发生变化时创建。 |\n\n以下是你需要的四个重要术语：\n\n\
  - **事件 (Event):** 当用户对组件执行值得关注的操作（如点击它）时创建的对象。\n- **事件源 (Event source):** 初始发生事件的对象。\n\
  - **事件目标 (Event target):** 事件指向的节点。这通常是用户点击或其他以此方式操作的按钮或其他控件。（在大多数情况下，事件源和事件目标是同一个。）\n\
  - **事件处理器 (Event handler):** 监听事件并在事件发生时对其进行处理的对象。\n\n事件监听器对象必须实现 `EventHandler`\
  \ 接口，该接口定义了一个名为 `handle` 的单方法（参见表 2-2）。`EventHandler` 接口定义在 `javafx.event` 包中。\n\
  \n### 表 2-2 EventHandler 接口\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void handle<T event>`\
  \ | 当事件发生时调用 |\n\n#### 处理事件\n\n现在你已经了解了用于事件处理的基本类和接口，你可以准备好研究如何将它们连接起来，创建一个响应事件的程序了。在本节中，我将讨论如何通过编写程序的\
  \ `Application` 代码来实现事件处理器，使其在扩展 `Application` 类的同时，也实现 `EventHandler` 接口。在本章的后续章节中，我将讨论实现事件处理器的替代技术，这些技术更简洁，在许多情况下更容易使用。\n\
  \n请注意，本微型书籍第 1 章中显示的程序使用了简洁的 lambda 表达式技术，本书其余部分的大部分程序也使用了 lambda 表达式。但了解其他技术是非常关重要的，这样你对事件处理的实际工作原理有一个完整的理解。\n\
  \n处理 JavaFX 事件你必须采取以下三个步骤：\n\n### 1. 创建事件源。\n*事件源*简单来说就是一个可以生成事件的控件，例如按钮。通常，你将引用事件源的变量声明为私有类字段，位于\
  \ `start` 方法或任何其他类方法之外：\n\n```java\nprivate Button btn;\n```\n\n然后，在 `start` 方法中，你可以这样创建按钮：\n\
  \n```java\nbtn = new Button();\nbtn.setText(\"Click me please!\");\n```\n\n### 2.\
  \ 创建事件处理器。\n要创建一个事件处理器，你必须创建一个实现名为 `EventHandler` 接口的对象。该对象必须提供 `handle` 方法的实现。\n\
  \n这里有四种创建事件处理器的方法：\n\n- 在程序的 `Application` 类中添加 `implements EventHandler` 并提供 `handle`\
  \ 方法的实现。你可以在“实现 EventHandler 接口”节中了解如何使用这种技术。\n- 在 `Application` 类内部创建一个实现 `EventHandler`\
  \ 的内部类。你可以在“使用内部类处理事件”节中了解如何使用这种技术。\n- 创建一个实现 `EventHandler` 的匿名内部类。我将在“使用匿名内部类处理事件”节中为你展示如何使用这种技术。\n\
  - 使用 lambda 表达式来实现 `handle` 方法。你可以在“使用 Lambda 表达式处理事件”节中阅读如何使用这种技术。\n\n### 3. 将事件处理器注册到事件源。\n\
  最后一步是将事件处理器注册到事件源，以便事件发生时调用 `handle` 方法。每个作为事件源的组件都提供了一个注册事件监听器的方法。例如，`Button` 控件提供了\
  \ `setOnAction` 方法来注册动作事件处理器。在 `setOnAction` 方法中，你将事件处理器对象作为参数。具体方法取决于你使用哪种技术创建事件处理器。\n\
  \n## 实现 EventHandler 接口\n为了看到这些元素如何在完整程序中协作工作，图 2-1 显示了一个名为 AddSubtract 的程序的输出。该程序显示了一个标签和两个按钮，标题分别为\
  \ Add 和 Subtract。标签最初显示数字 0。每当用户点击 Add 按钮，标签显示的数值就会增加 1；每当用户点击 Subtract 按钮，数值就会减少\
  \ 1。\n\n**图 2-1:** AddSubtract 程序。\n\n列表 2-1 显示此程序的完整代码。\n\n### 列表 2-1：AddSubtract\
  \ 程序\n```java\nimport javafx.application.*;\nimport javafx.stage.*;\nimport javafx.scene.*;\n\
  import javafx.scene.layout.*;\nimport javafx.scene.control.*;\nimport javafx.event.*;\n\
  \npublic class AddSubtract extends Application implements EventHandler<ActionEvent>\
  \ {\n\n    public static void main(String[] args) {\n        launch(args);\n   \
  \ }\n\n    Button btnAdd;\n    Button btnSubtract;\n    Label lbl;\n    int iCounter\
  \ = 0;\n\n    @Override\n    public void start(Stage primaryStage) {\n        //\
  \ 创建 Add 按钮\n        btnAdd = new Button();\n        btnAdd.setText(\"Add\");\n\
  \        btnAdd.setOnAction(this);\n\n        // 创建 Subtract 按钮\n        btnSubtract\
  \ = new Button();\n        btnSubtract.setText(\"Subtract\");\n        btnSubtract.setOnAction(this);\n\
  \n        // 创建 Label\n        lbl = new Label();\n    }\n}\n```\n\n\n\n\n```java\n\
  lbl.setText(Integer.toString(iCounter));\n\n// Add the buttons and label to an HBox\
  \ pane\nHBox pane = new HBox(10);\n\npane.getChildren().addAll(lbl, btnAdd, btnSubtract);\n\
  \n// Add the layout pane to a scene\nScene scene = new Scene(pane, 200, 75);\n\n\
  // Add the scene to the stage, set the title\n// and show the stage\nprimaryStage.setScene(scene);\n\
  primaryStage.setTitle(\"Add/Sub\");\nprimaryStage.show();\n\n}\n\n@Override public\
  \ void handle(ActionEvent e)\n{\n    if (e.getSource()==btnAdd) {\n        iCounter++;\n\
  \    }\n    else {\n        if (e.getSource()==btnSubtract) {\n            iCounter--;\n\
  \        }\n    }\n    lbl.setText(Integer.toString(iCounter));\n}\n}\n```\n\n接下来的段落指出了程序中的一些关键行：\n\
  \n- **→6**: 程序必须导入 `javafx.event` 包，该包定义了 `ActionEvent` 类和 `EventHandler` 接口。\n\
  - **→9**: 与任何 JavaFX 程序一样，`AddSubtract1` 类继承了 `Application` 类。然而，`AddSubtract1`\
  \ 类还实现了 `EventHandler` 接口，以便它可以定义一个 `handle` 方法来处理由按钮生成的 `ActionEvent` 事件。`EventHandler`\
  \ 接口是一个泛型接口，这意味着你必须指定接口将实现的特定事件类型。在这种情况下，该类将处理 `ActionEvent` 事件。\n- **→11**: 像常一样需要\
  \ `main` 方法。该方法简单地调用 `launch` 方法来创建 `AddSubtract` 类的实例，而该实例反过来调用 `start` 方法。\n-\
  \ **→16**: 定义了两个按钮（`btnAdd` 和 `btnSubtract`）和一个标签（`lbl`）为类字段，以便在整个类中访问它们。\n- **→19**:\
  \ `iCounter` 变量用于跟踪标签显示的值。\n\n#### 处理事件\n\n当用户点击 `btnAdd` 按钮时，值会增加；当用户点击 `btnSubtract`\
  \ 按钮时，值会减小。\n\n- **→21**: 当应用程序启动时会调用 `start` 方法。\n- **→24**: 这一行和下一行创建了 Add 按钮，并将其文本设置为单词\
  \ `Add.`。\n- **→26**: 这一行将当前对象设置为 `btnAdd` 按钮的事件处理器。在这里使用 `this` 关键字是因为 `AddSubtract`\
  \ 类实现了 `EventHandler`。实际上，`AddSubtract` 类本身处理了由其自身控件创建的任何事件。\n- **→29**: 这几行创建了\
  \ Subtract 按钮，将其文本设置为单词 `Subtract,`，并将当前对象（`this`）设置为该按钮的事件处理器。\n- **→33**: 这两行创建了标签，并将初始文本值设置为变量\
  \ `iCounter` 的等效字符串。\n- **→38**: 对于此程序，边框布局（border pane）不是合适的布局类型。相反，对于此程序，使用一种名为\
  \ `HBox` 的新类型布局面板。`HBox` 布局将你添加的任何控件按水平行排列。参数 `10` 表示控件之间应该用十像素宽的间隔隔开。\n- **→39**:\
  \ 这一行将标签和两个按钮添加到水平框中。诚然，实现此操作所需的代码有点复杂。首先，你必须调用 `getChildren` 方法来获取 `HBox` 中所有子节点的列表。然后，你调用\
  \ `addAll` 方法来添加一个或多个控件。在这种情况下，添加了三个控件：标签（`lbl`）、Add 按钮（`btnAdd`）和 Subtract 按钮（`btnSubtract`）。\n\
  - **→42**: 这一行创建一个新场景，使用 `HBox` 布局作为其根节点。\n- **→46**: 这一行将第 42 行创建的场景设置为舞台的主场景，设置舞台标题，然后显示舞台。\n\
  - **→51**: 必须编写 `handle` 方法，因为 `AddSubtract` 类实现了 `EventHandler` 接口。每当用户点击其中任一个按钮时，按钮对象都会调用此方法。`ActionEvent`\
  \ 参数是点击按钮时生成的事件，并传递给 `handle` 方法。\n- **→53**: `getSource` 方法确定事件源。如果事件源是 `btnAdd`，则\
  \ `iCounter` 变量加 1。\n- **→59**: 反之，如果事件源是 `btnSubtract`，则 `iCounter` 变量减 1。\n- **→64**:\
  \ 标签的文本设置为 `iCounter` 的等效字符串。\n\n#### 使用内部类处理事件\n\n内部类是嵌套在另一个类中的类。内部类通常用于事件处理器。\n\
  \n#### 列表 2-2: 带有内部类的 Subtract2 程序\n\n```java\nimport javafx.application.*;\nimport\
  \ javafx.stage.*;\nimport javafx.scene.*;\nimport javafx.scene.layout.*;\nimport\
  \ javafx.scene.control.*;\nimport javafx.event.*;\n\npublic class AddSubtract2 extends\
  \ Application {\n\n    Button btnAdd;\n    Button btnSubtract;\n    Label lbl;\n\
  \    int iCounter = 0;\n\n    public static void main(String[] args) {\n       \
  \ launch(args);\n    }\n\n    @Override\n    public void start(Stage primaryStage)\
  \ {\n        // 创建一个 ClickHandler 实例\n        ClickHandler ch = new ClickHandler();\n\
  \n        // 创建 Add 按钮\n        btnAdd = new Button();\n        btnAdd.setText(\"\
  Add\");\n        btnAdd.setOnAction(ch);\n\n        // 创建 Subtract 按钮\n        btnSubtract\
  \ = new Button();\n        btnSubtract.setText(\"Subtract\");\n        btnSubtract.setOnAction(ch);\n\
  \n        // 创建 Label \n        lbl = new Label();\n        lbl.setText(Integer.toString(iCounter));\n\
  \n        // 将按钮和标签添加到 HBox 布局面板\n        HBox pane = new HBox(10);\n        pane.getChildren().addAll(lbl,\
  \ btnAdd, btnSubtract);\n\n        // 将布局面板添加到场景\n        Scene scene = new Scene(pane,\
  \ 200, 75);\n\n        // 将场景添加到舞台，设置标题\n        // 并显示舞台\n        primaryStage.setScene(scene);\n\
  \        primaryStage.setTitle(\"Add/Sub\");\n        primaryStage.show();\n   \
  \ }\n\n    private class ClickHandler implements EventHandler<ActionEvent> {\n \
  \       @Override\n        public void handle(ActionEvent e) {\n            if (e.getSource()==btnAdd)\
  \ {\n                iCounter++;\n            }\n            else {\n          \
  \      if (e.getSource()==btnSubtract) {\n                    iCounter--;\n    \
  \            }\n            }\n            lbl.setText(Integer.toString(iCounter));\n\
  \        }\n    }\n}\n```\n\n此程序的工作方式与列表 2-1 中的程序基本相同，因此我不再回顾每一个细节。相反，我只强调不同之处：\n\
  \n- **→8**: `AddSubtract2` 类仍然继承 `Application` 但没有实现 `EventHandler`。\n- **→23**:\
  \ 该语句创建了 `ClickHandler` 类（内部类）的实例并将其赋值给变量 `ch`。\n- **→28**: 该语句将 `ch` 设置为 Add 按钮的监听器。\n\
  - **→33**: 该语句将 `ch` 设置为 Subtract 按钮的监听器。\n- **→53**: 通过将声明完全放在 `AddSubtract2` 类内部，`ClickHandler`\
  \ 类被为内部类。`ClickHandler` 类实现了 `EventHandler` 接口以便它可以处理事件。\n- **→38**: 此处的 `handle`\
  \ 方法与列表 2-1 程序中的 `handle` 方法相同，但它位于内部类中而不是外部类中。\n\n### 使用匿名内部类处理事件\n\n*匿名内部类*（通常称为*匿名类*）是在需要它的地方即时定义的类。由于你直接编写\n\
  \n\n\n\n类的主体直接位于你需要的地方，你不需要为它命名；这就是为什么它被称为匿名类。\n\n匿名类通常用于事件处理器，以避免为了需要创建一个显式实现 `EventHandler`\
  \ 接口的独立类。\n\n#### 处理事件\n\n使用匿名类作为事件处理器的一个优势是，你可以为每个产生事件的控件轻松地创建一个独立的事件处理器。然后，在这些事件处理器的\
  \ `handle` 方法中，你可以省去检查事件源的 `if` 语句。\n\n考虑列表 2-2 所示的 `AddSubtract2` 程序的事件处理器：它必须检查事件源，以确定是增加还是减少\
  \ `iCounter` 变量。通过使用匿名类，你可以为 `Add` 和 `Subtract` 按钮创建独立的事件处理器。`Add` 按钮的事件处理器增加 `iCounter`，而\
  \ `Subtract` 按钮的事件处理器则减少它。这两个事件处理器都不需要检查事件源，因为只有当与处理器关联的按钮触发事件时，该处理器的 `handle` 方法才会被调用。\n\
  \n列表 2-3 显示了 `AddSubtract3` 程序，它以这种方式使用了匿名内部类。\n\n**列表 2-3：**\n**使用匿名内部类的 AddSubtract3\
  \ 程序**\n\n```java\nimport javafx.application.*;\nimport javafx.stage.*;\nimport\
  \ javafx.scene.*;\nimport javafx.scene.layout.*;\nimport javafx.scene.control.*;\n\
  import javafx.event.*;\n\npublic class AddSubtract3 extends Application\n{\n   \
  \ public static void main(String[] args)\n    {\n        launch(args);\n    }\n\n\
