  \ 0;\n\n    @Override \n    public void start(Stage primaryStage)\n    {\n     \
  \   // 创建 Add 按钮\n        btnAdd = new Button();\n        btnAdd.setText(\"Add\"\
  );\n        btnAdd.setOnAction(\n            new EventHandler<ActionEvent>()\n \
  \           {\n                public void handle(ActionEvent e)\n             \
  \   {\n                    iCounter++;\n                    lbl.setText(Integer.toString(iCounter));\n\
  \                }\n            } \n        );\n\n        // 创建 Subtract 按钮 \n \
  \       btnSubtract = new Button();\n        btnSubtract.setText(\"Subtract\");\n\
  \        btnSubtract.setOnAction(\n            new EventHandler<ActionEvent>()\n\
  \            {\n                public void handle(ActionEvent e)\n            \
  \    {\n                    iCounter--;\n                    lbl.setText(Integer.toString(iCounter));\n\
  \                }\n            } \n        );\n\n        // 创建 Label \n       \
  \ lbl = new Label();\n        lbl.setText(Integer.toString(iCounter));\n\n     \
  \   // 将按钮和标签添加到 HBox 面板\n        HBox pane = new HBox(10);\n        pane.getChildren().addAll(lbl,\
  \ btnAdd, btnSubtract);\n\n        // 将布局面板添加到场景中\n        Scene scene = new Scene(pane,\
  \ 200, 75);\n\n        // 将场景添加到舞台，设置标题并显示舞台\n        primaryStage.setScene(scene);\n\
  \        primaryStage.setTitle(\"Add/Sub\");\n        primaryStage.show();\n   \
  \ }\n}\n```\n\n接下来的段落强调了该程序如何使用匿名内部类处理按钮事件的关键点：\n\n- **→26**：此行调用了 `Add` 按钮的 `setOnAction`\
  \ 方法，并创建 `EventHandler` 类的匿名实例，指定 `ActionEvent` 为类型。\n- **→28**：`handle` 方法必须在匿名类的体内部定义。\n\
  - **→30**：由于此 `handle` 方法只有在点击 `Add` 按钮时才会被调用（而不是点击 `Subtract` 按钮时），因此它不需要确定事件源。相反，方法简单地增加计数器变量，并设置标签文本以显示计数器新值。\n\
  - **→39**：此行调用了 `Subtract` 按钮的 `setOnAction` 方法，并创建另一个 `EventHandler` 类的匿名实例。\n\
  - **→41**：这一次，`handle` 方法减少计数器变量并更新标签文本以显示新的计数值。\n\n# 使用 Lambda 表达式处理事件\n\nJava\
  \ 8 引入了一项新功能，它在某些方面与匿名类相似，但语法更简洁。具体来说，Lambda 表达式允许你创建一个实现特定类型接口的匿名类——*函数式接口*（functional\
  \ interface），该接口只有一个且只有一个抽象方法。\n\n用于处理 JavaFX 事件的 `EventHandler` 接口符合该定义：它只有一个抽象方法\
  \ `handle`。因此，`EventHandler` 是一个函数式接口，可以与 Lambda 表达式配合使用。\n\nLambda 表达式是创建实现函数式接口匿名类的简洁方式。你不需要提供包含返回类型、方法名、参数类型和方法体的正式方法声明，只需要定义参数类型和方法体即可。Java\
  \ 编译器会根据你使用 Lambda 表达式的上下文推断其余部分。\n\n参数类型与方法体之间由一个新的运算符分隔——*箭头运算符*（arrow operator），它由一个连字符后跟一个大于号组成。\n\
  \n这是一个实现 `EventHandler` 接口的 Lambda 表达式示例：\n\n```java\ne ->\n{\n    iCounter++;\n\
  \    lbl.setText(Integer.toString(iCounter));\n}\n```\n\n在这种情况下，`iCounter` 增加，标签文本得到更新以显示新的计数值。以下是如何将此\
  \ Lambda 表达式注册为按钮的事件处理器：\n\n```java\nbtnAdd.setOnAction(e -> {\n    iCounter++;\n\
  \    lbl.setText(Integer.toString(iCounter));\n});\n```\n\n\n\n\n```java\nbtnSubtract.setOnAction(\
  \ e -> {\n    iCounter--;\n    lbl.setText(Integer.toString(iCounter));\n} );\n\n\
  // 创建标签\nlbl = new Label();\nlbl.setText(Integer.toString(iCounter));\n\n// 将按钮和标签添加到\
  \ HBox 面板中\nHBox pane = new HBox(10);\npane.getChildren().addAll(lbl, btnAdd, btnSubtract);\n\
  \n// 将布局面板添加到场景（Scene）\nScene scene = new Scene(pane, 200, 75);\n\n// 将场景添加到舞台（Stage），设置标题\n\
  // 并显示舞台\nprimaryStage.setScene(scene);\nprimaryStage.setTitle(\"Add/Sub\");\nprimaryStage.show();\n\
  }\n```\n\n598 第 6  **JavaFX**\n\n此程序的工作原理与列表 2-3 所示的程序基本相同，因此我直接指出与 lambda 表达式使用相关的特征：\n\
  \n- **→25**: 该语句使用 lambda 表达式为 Add（相加）按钮添加了一个事件处理器。该 lambda 表达式的方法体增加了计数器变量，然后设置标签文本以反映更新后的值。\n\
  - **→34**: 该语句使用类似的 lambda 表达式为 Subtract（减法）按钮创建事件处理器。此 lambda 表达式与 Add 按钮对应的唯一区别在于，这里计数器变量是减少的而不是增加。\n\
  \n请注意，在这个示例中，两个事件处理器的 lambda 表达式非常简单，因为当点击此程序中的任何按钮时，需要处理的操作非常少。然而，如果一个或多个按钮点击所需的处理需要数百行\
  \ Java 代码来实现，该程序会变成什么样呢？lambda 表达式将变得臃肿。因此，我经常倾向于将事件处理器要执行的实际隔离在一个单独的方法中。这样，lambda\
  \ 表达式本身只包含一行简单的调用方法代码。\n\n列表 2-5 显示了使用该技术实现的 AddSubtract5 程序的另一种变体。请注意，列表 2-5 中使用的技术是书中其余大部分程序所使用的技术。\n\
