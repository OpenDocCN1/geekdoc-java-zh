  \ 方法来列出 `f` 目录的内容。然而，缩进字符串增加了两个空格，以便 `f` 目录中的任何目录都比当前目录右缩进两个空格。\n\n如果你很难理解此程序中的递归是如何工作的，可以这样想：`listDirectory`\
  \ 方法列出单个目录下所有的子目录。对于每个目录，该方法做了两件事：(1) 打印目录名称 (2) 调用自己来打印该目录的任何子目录。在本章前面，我提到所有递归方法都必须具有某种条件测试，导致方法停止调用自己。在这个程序中，该条件测试可能并不明显。但最终，`listDirectories`\
  \ 方法将接收到一个没有任何子目录的目录。当这种情况发生时，递归结束——至少对于目录树的该分支是如此。\n\n# 使用递归\n\n## 编写你自己的排序程序\n\
  \n世界上充满了计算机专业的学生，他们对计算机的了解并不比你多，但他们曾经上过一门老师解释排序算法工作原理的课。他们可能在那门课上只拿了一个 `C`，但这足够毕业了。\n\
  \n现在你有机会发现自己由于没有主修计算机专业而错过了什么。我将向你展示最常用的排序技术之一实际上是如何运作的。这种技术被称为 `Quicksort`（快速排序），它是递归的一种非常巧妙的使用。我甚至向你展示它的简单\
  \ Java 实现。\n\n快速排序无疑是整书中技术性最强的部分。如果你从未想主修计算机科学（如果你甚至不想和学计算机的人聊天），你可能想跳过本章剩余的内容。\n\
  \n对于我们大多数人来说，理解像 `Quicksort` 这样的排序算法仅仅是一种智力练习。Java `API` 已经内置了排序。（例如查看 `Arrays.sort`\
  \ 方法。）\n\n# 理解快速排序的工作原理\n\n`Quicksort` 算法通过递归进行排序。其基本步骤如下：\n\n1. 在数组范围内选择一个任意值。这个值就是基准点（`pivot\
  \ point`）。选择基准值的常用方法是简单选择数组的第一个元素。\n2. 重新排列数组，使得所有小于基准值的都在左侧，所有大于它的值都在右侧。\n3. 现在将这两个部分视为独立的数组并重新开始。\n\
  \n## 使用 sort 方法\n\n驱动快速排序程序的实际代码简单得惊人：\n\n```java\npublic static void sort(int low,\
  \ int high)\n{\n    if (low >= high)\n        return;\n\n    int p = partition(low,\
  \ high);\n    sort (low, p);\n    sort (p+1, high);\n}\n```\n\n该方法排序传递给它的 `low`\
  \ 和 `high` 索引值所指示的数组部分。忽略 `if` 语句，`sort` 方法通过调用 `partition` 方法工作。该方法将数组重新排列为两个分区，使得左分区的所有值都小于右侧分区的所有值。`partition`\
  \ 方法返回左分区结束的索引。\n\n为了启动 `sort` 方法，你用 `0` 作为 `low` 值，并将数组长度减 `1` 作为 `high` 值来调用它。因此，`sort`\
  \ 方法从排序整个数组开始。\n\n\n\n\narray。每当执行 `sort` 方法时，它都会自己调用自己来对数组的较小分区进行排序。\n\n`sort`\
  \ 方法开头的 `if` 语句比较 `low` 值与 `high` 值。如果 `low` 值等于或大于 `high` 值，则说明该分区只剩元素（或者可能没有元素），因此已经排序完毕了。在这种情况下，`sort`\
  \ 方法将直接返回，不再再次调用自己。这就是结束递归的条件。\n\n## 使用 partition 方法\n\n`sort` 方法本身是快速排序技术中比较简单的部分。难点在于在于\
  \ `partition` 方法。该方法接受两个参数：`low` 和 `high` 索引，它们标记了需要排序的数组部分。`partition` 方法的基本轮廓如下：\n\
  \n1. **选取一个基准点（pivot point）。**\n2. **将所有小于基准点的元素移动到分区的左侧。**\n3. **将所有大于基准点的元素移动到分区的右侧。**\n\
  4. **返回基准点的索引。**\n\n划分数组最常用的技术是维护两个名为 `i` 和 `j` 的索引变量，它们从数组的两端向中心移动。首先，`i` 从数组开始开始并向前移动，直到遇到一个大于基准值的值。然后，`j`\
  \ 从数组的对端开始并向后移动，直到找到一个小于基准点的值。此时，`partition` 方法在数组左侧拥有一个大于基准点的值，在数组右侧拥有一个小于基准点的值。因此将它们进行交换。\n\
  \n接下来，循环重复此过程：`i` 递增，直到找到另一个大于基准值的值；`j` 递减，直到找到另一个小于基准值的值，然后交换这些元素。这个过程一直持续，直到 `j`\
  \ 小于 `i`，这意味着索引已经交叉，划分完成。\n\n以下是这些代码整合了上述逻辑的代码：\n\n```java\npublic static int partition(int\
  \ low, int high)\n{\n    int pivot = a[low];\n    int i = low - 1;\n    int j =\
  \ high + 1;\n    while (i < j)\n    {\n        for (i++; a[i] < pivot; i++);\n \
  \       for (j--; a[j] > pivot; j--);\n        if (i < j)\n            swap(i, j);\n\
  \    }\n    return j;\n}\n```\n\n注意在此代码中，被排序的数组是一个名为 `a` 的静态 int 数组。待划分的分区的 `low`\
  \ 和 `high` 端作为参数传递进来，方法开始选择分区中的第一个元素作为基准点的值。接着，它根据参数初始化索引变量 `i` 和 `j`。注意在 `low`\
  \ 值上减去了 1，在 `high` 值上加上了 1。在循环开始之前，索引变量从数组回退了一步，以便它们有一个良好的起点。\n\n`while` 循环用于指示划分何时完成。只要\
  \ `i` 小于 `j`，循环就会重复。当这些索引变量停止后，划分完成，返回 `j` 的值以指示划分左分区和右分区的索引点。\n\n在 `while` 循环体内有两个奇怪的空体\
  \ `for` 循环。这些 `for` 循环没有循环体是因为它们唯一的目的是移动其索引值，直到找到一个一个小于或大于基准值的值。\n\n## 使用递归\n\n\
  第一个 `for` 循环递增 `i` 索引变量，直到找到一个大于基准点的值。这个 `for` 循环找到了第一个可能需要移动到数组另一侧的值。\n\n接下来，第二个\
  \ `for` 循环递减 `j` 索引变量，直到找到一个小于基准点的值。因此这个循环找到了一个可能需要与第一个 `for` 循环找到的值进行交换的值。\n\n\
  最后，`if` 语句检查索引是否交叉。假设它们还没有交叉，则调用 `swap` 方法来交换元素。`swap` 方法幸运地非常简单：\n\n```java\npublic\
  \ static void swap(int i, int j)\n{\n    int temp = a[i];\n    a[i] = a[j];\n  \
  \  a[j] = temp;\n}\n```\n\n该方法将 `i` 元素移动到一个临时变量，将 `j` 元素移动到 `i` 元素的位置，然后将临时变量移动到\
  \ `j` 元素的位置。\n\n## 汇总\n\n现在你已经了解了创建快速排序程序所需的这些步骤，列表 3-2 显示了一个运行这些方法的程序。该程序创建了一个包含\
  \ 100 个随机选择数字的数组，数值范围为 1–100。它打印数组，使用之前节所示的排序方法对数组，然后打印排序后的数组。以下是示例运行：\n\n未排序的数组：\n\
