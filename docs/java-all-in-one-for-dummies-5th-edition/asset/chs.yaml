  \n## 本章内容\n\n- 文本字段和文本区域的操作\n- 验证数值数据和创建复选框\n- 设置单选按钮\n- 在完整程序中使用这些组件\n\n# 第 **5**\
  \ 章 **从用户获取输入**\n\n在本微型书籍的前四章中，我讨论了如何仅使用两个基本的 JavaFX 输入控件：标签和按钮来创建 JavaFX 程序。如果你只想编写在用户点击按钮时显示文本的程序，那么你现在可以把书了。但如果你想编写一些真正有价值的程序，你需要使用其他的\
  \ JavaFX 输入控件。\n\n在本章中，你将了解到如何使用一些常用的 JavaFX 控件。首先，你将读到标签以及从用户获取信息的控件。你将了解到更多关于文本字段控件（获取一行文本）和文本区域控件（获取多行文本）的细节。然后我将转向两个从用户获取“二选一”信息的输入控件：单选按钮和复选框。在此过程中，你将发现任何从用户收集输入数据的\
  \ JavaFX 程序的一个重要方面：数据验证。数据验证程序对于确保用户不输入虚假数据至关重要。例如，你可以使用数据验证来确保用户向必填字段输入数据，或者确保用户输入到数值字段的数据确实是有效数字。\n\
  \n# 第 5 章 **从用户获取输入** 659\n\n## 使用文本字段\n\n*文本字段*（text field）是一个用户可以在其中输入单行文本的框。你通过使用\
  \ `TextField` 类来创建文本字段。表 5-1 显示了该类一些有趣且实用的构造函数和方法。\n\n### 表 5-1：实用的 TextField 构造函数和方法\n\
  \n| 构造函数 | 描述 |\n| :--- | :--- |\n| `TextField()` | 创建一个新的文本字段。 |\n| `TextField(String\
  \ text, int cols)` | 创建带有初始文本值的新文本字段。 |\n\n| **方法** | **描述** |\n| `String getText()`\
  \ | 获取字段中输入的文本值。 |\n| `void requestFocus()` | 请求将焦点移动到此文本字段。注意，该字段必须存在于场景中，焦点请求才会生效。\
  \ |\n| `void setEditable(boolean value)` | 如果为 false，则使字段设为只读。 |\n| `void setMaxWidth(double\
  \ width)` | 设置字段的最大宽度。 |\n| `void setMinWidth(double width)` | 设置字段的最小宽度。 |\n| `void\
  \ setPrefColumnCount(int cols)` | 设置文本字段以列为单位的选大小（即平均宽度文本字符的数量）。 |\n| `void setPrefWidth(double\
  \ width)` | 设置字段的优选宽度。 |\n| `void setPromptText(String prompt)` | 设置字段的提示值。如果字段已有文本值或字段拥有焦点，则提示值将不会显示。\
  \ |\n| `void setText(String text)` | 设置字段的文本值。 |\n\n`TextField` 类定义在 `javafx.scene.control`\
  \ 包中，因此在任何使用文本字段的程序中都应该包含以下导入语句：\n\n```\nimports javafx.scene.control.*;\n```\n\n\
  创建文本字段最常见的方法是调用不带参数的构造函数，如下：\n\n```\nTextField text1 = new TextField();\n```\n\n\
  你可以这样设置显示的初始值：\n\n```\nTextField text1 = new TextField(\"Initial value\");\n```\n\
  \n或者，如果你以后需要设置值，可以调用 `setText` 方法：\n\n```\ntext1.setText(\"Text value\");\n```\n\
  \n要检索用户在文本字段中输入的值，像这样调用 `getText` 方法：\n\n```\nString value = text1.getText();\n\
  ```\n\n## 从用户获取输入\n\n与任何 JavaFX 控件一样，管理文本字段的宽度可能有点棘手。最终，JavaFX 将根据多个因素确定文本字段的宽度，包括包含舞台和场景的窗口的大小，以及在包含文本字段的面板上设置的任何尺寸限制。你可以通过调用\
  \ `setMinWidth` 和 `setMaxWidth` 方法为文本字段尺寸设置最小和最大限制，并通过 `setPrefWidth` 方法指定优选宽度，例如所示：\n\
  \n```\nTextField text1 = new TextField();\ntext1.setMinWidth(150);\ntext1.setMaxWidth(250);\n\
  text1.setPrefWidth(200);\n```\n\n设置优选宽度的另一种方法是使用 `setPrefColumnCount` 方法，它以平均字符数来设置宽度。例如，以下代码将字段宽度设置为\
  \ 50 个字符：\n\n```\ntext1.setPrefColumnCount(50);\n```\n\n注意 `setPrefColumnCount`\
  \ 方法并不限制用户输入字段的字符数。它限制的是字段一次可以显示的字符数。\n\n第 5 章 **从用户获取输入** 661\n\n每当你使用文本字段时，提供一个提示让用户知道应该输入什么。这样做的一种常用方法是将标签放置在文本字段的左侧。例如：\n\
  \n```\nLabel lblName = new Label(\"Name:\");\nlblName.setMinWidth(75);\nTextField\
  \ txtName = new TextField();\ntxtName.setMinWidth(200);\nHBox pane = new HBox(10,\
  \ lblName, txtName);\n```\n\n在这里，标签和文本字段被创建并并排显示。\n\nJavaFX 还允许在文本字段内部显示提示。提示以较浅的颜色显示并在字段获得焦点时消失。你使用\
  \ `setPromptText` 方法来创建这样的提示：\n\n```\nTextField txtName = new TextField();\ntxtName.setPromptText(\"\
  Enter the customer's name\");\n```\n\n在这里，`Enter the customer's name` 将出现在文本字段内部。\n\
  \n要检索用户在文本字段中输入的值，像这样调用 `getText` 方法：\n\n```\nString lastName = textLastName.getText();\n\
  ```\n\n这里在 `textLastName` 字段中输入的值赋值给 `String` 变量 `lastName`。\n\n一个简单的程序，允许用户输入角色名称和扮演该角色的演员名称。假设用户在两个字段中都输入了文本，程序随后显示一个警框谁将扮演该角色。如果用户漏掉一个或两个字段，则会显示警框来指示错误。\n\
