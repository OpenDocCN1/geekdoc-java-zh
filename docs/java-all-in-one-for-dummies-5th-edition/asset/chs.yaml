  \ try\n        {\n            line = in.readLine();\n        }\n        catch (IOException\
  \ e)\n        {\n            System.out.println(\"I/O Error\");\n            System.exit(0);\n\
  \        }\n        if (line == null)\n            return null;\n        else\n\
  \        {\n            String[] data = line.split(\"\\t\");\n            title\
  \ = data[0];\n            year = Integer.parseInt(data[1]);\n            price =\
  \ Double.parseDouble(data[2]);\n            return new Movie(title, year, price);\n\
  \        }\n    }\n}\n```\n\n第 3 章 **使用 JavaServer Pages** 754\n\n第 4 章\n\n使用 JavaBean\n\
  \n*JavaBean* 是一种特殊的 Java 类，你可以通过几种有趣的方式使用它来简化开发。某些 Bean 被设计为视觉组件，可以在图形用户界面（GUI）编辑器中使用来快速构建界面。其他\
  \ Bean（称为企业 JavaBeans，EJB）设计在特殊的 EJB 服务器上运行，可以处理大型应用程序的数据访问和业务逻辑。\n\n在本章中，我将介绍一种更简单的\
  \ JavaBean，它设计用于简化构建 JavaServer Pages 的任务。简单来说，你可以使用简单的 JavaBean 来构建 JavaServer\
  \ Pages，而无需在 JSP 本身中编写任何 Java 代码。\n\n**了解 JavaBean**\n\n简单来说，JavaBean 是任何符合以下规则的\
  \ Java 类：\n- **它必须有一个空构造函数** —— 即不接受任何参数的构造函数。如果该类没有任何构造函数，它也符合条件，因为默认构造函数没有参数。但如果该类至少有一个接受一个或多个参数的构造函数，它还必须包含\n\
  \n\n\n\n一个无参数的构造函数，以符合 JavaBean 的定义。\n\n- » 它不能有公共的 `instance variables`。类定义的所有实例变量必须是私有的（private）或保护的（protected）。\n\
  - » 它必须提供名为 `getProperty` 和 `setProperty` 的方法来获取和设置类提供的任何 `properties` 的值，但使用 `isProperty`\
  \ 获取属性值的 `boolean` 属性除外。`property` 这个词并不是正式的 Java 术语。简而言之（或者应该说是 *在 beanpod 里面*？），一个\
  \ `property` 是对象的任何值，该值可以通过 `get` 方法（如果属性是布尔类型，则通过 `is` 方法）获取，或通过 `set` 方法设置。例如，如果一个类有一个名为\
  \ `lastName` 的属性，它应该使用名为 `getLastName` 的方法来获取姓氏，使用 `setLastName` 来设置姓氏。或者，如果该类有一个名为\
  \ `taxable` 的布尔属性，那么设置它的方法称为 `setTaxable`，获取它的方法称为 `isTaxable`。\n\n请注意，一个类不需要拥有任何属性就可以成为\
  \ JavaBean，但如果它确实拥有属性，这些属性必须按照此命名模式进行访问。\n\n此外，并不是所有属性都必须具有 `get` 和 `set` 访问器。`read-only\
  \ property`（只读属性）可以只有 `get` 访问器，而 `write-only property`（只写属性）可以只有 `set` 访问器。在访问属性的方法中，属性名大写，但属性名本身不是。因此\
  \ `setAddress` 设置的是名为 `address` 的属性，而不是 `Address`。\n\n就是这些。更高级的 bean 还可以具有其他特性，为它们提供视觉界面，以便在集成开发环境\
  \ (IDE) 中以拖放样式使用。此外，某些 bean 实现了一个接口，允许将其状态写入输出流，以便以后重新创建。但这些功能是可选的；任何符合此处三个标准的类都是\
  \ bean，并可以在 JSP 页面中作为 bean 使用。你已经见过很多具有类似 `getCount` 和 `setStatus` 方法方法的类。这些名称是一种称为\
  \ `Accessor pattern`（访问器模式）的设计模式的一部分，我将在第三本书第 2 章中介绍。因此，你在整本书中看到了很多 bean 的示例，你可能已经自己写过很多\
  \ bean 类了。\n\n任何符合此模式的类都是 bean。没有你必须继承的 `JavaBean` 类；也没有你必须实现以创建 bean 的 `Bean` 接口。一个类要成为\
  \ bean，所做的只需遵循该模式。\n\n758 第 7 本 **Web 编程**\n\n查看示例 Bean\n\n列表 4-1 显示了一个名为 `Triangle`\
  \ 的示例 JavaBean 类，它用于计算勾股定理，在知道直角三角形两条短边长度的情况下，它可以计算出长边（斜边）。该类定义了三个属性：`sideA` 和 `sideB`\
  \ 代表三角形的两条短边，`sideC` 代表长边。使用此 bean 的正常方法是首先使用 `setSideA` 和 `setSideB` 方法将 `sideA`\
  \ 和 `sideB` 属性设置为短边的长度，然后使用 `getSideC` 方法获取长边的长度。如果你想不起初中高时的知识了，长边等于第一个短边平方加上第二个短边平方的平方根。\n\
  \n**列表 4-1：**\nTriangle Bean\n\n```java\npackage com.lowewriter.calculators;\n\n\
  public class Triangle\n{\n    private double sideA;\n    private double sideB;\n\
  \n    public Triangle()\n    {\n        this.sideA = 0.0;\n        this.sideB =\
  \ 0.0;\n    }\n\n    public String getSideA()\n    {\n        return Double.toString(this.sideA);\n\
  \    }\n\n    // Using JavaBeans\n    public void setSideA(String value)\n    {\n\
  \        try\n        {\n            this.sideA = Double.parseDouble(value);\n \
  \       }\n        catch (Exception e)\n        {\n            this.sideA = 0.0;\n\
  \        }\n    }\n\n    public String getSideB()\n    {\n        return Double.toString(this.sideB);\n\
  \    }\n}\n```\n*(接上)*\n\n第 4 章 **使用 JavaBeans** 759\n\n**列表 4-1：**\n***（续）***\n\
  \n```java\n    public void setSideB(String value)\n    {\n        try\n        {\n\
  \            this.sideB = Double.parseDouble(value);\n        }\n        catch (Exception\
  \ e)\n        {\n            this.sideB = 0.0;\n        }\n    }\n\n    public String\
  \ getSideC()\n    {\n        if (sideA == 0.0 || sideB == 0.0)\n            return\
  \ \"Please enter both sides.\";\n        else\n        {\n            Double sideC;\n\
  \            sideC = Math.sqrt(\n            (sideA * sideA) + (sideB * sideB));\n\
  \            return Double.toString(sideC);\n        }\n    }\n}\n```\n\n接下来的段落指出了\
  \ bean 类的亮点：\n\n大多数 servlet 类一样，这个 bean 是一个包的一部分。在这种情况下，包名为 `com.lowewriter.calculators`。（我假设如果你需要一个\
  \ bean 来计算勾股定理，你可能还需要其他 bean 来计算导数、质数等。）\n- 该包（名为 `com.lowewriter.calculators`）使用了一对实例变量来跟踪边。\n\
  - 根据 JavaBean 的规则，这些实例变量声明为 `private`。\n- 声明了一个无参数的构造函数。（严格来说，这个构造函数不需要显式初始化它们到默认值。）\n\
  - `getSideA` 方法返回 `sideA` 属性值的字符串。\n- `setSideA` 方法通过字符串设置 `sideA` 属性值。再次，`try/catch`\
  \ 语句捕捉无法解析字符串的异常。\n- `getSideB` 方法返回 `sideB` 属性值的字符串。\n- `setSideB` 方法通过字符串设置 `sideB`\
  \ 属性值。\n- `getSideC` 方法计算长边长度并返回结果。如果任一值为 0，方法假设用户没有输入任何数据，因此返回错误消息。（因为三角形的边不能为零。）\n\
  - 注意没有 `setSideC` 方法。因此 `sideC` 是只读属性。\n\n在 JSP 页面中使用 Bean\n\n要在 JSP 页面中使用 bean，需要在页面中添加特殊标签来创建\
  \ bean、设置属性并检索属性。表格 4-1 列出了这些标签，后续章节将介绍每个标签的详细信息。\n\n使用 JavaBeans\n\n创建 bean 实例\n\
  \n要在 JSP 页面中包含 bean，需要在页面添加特殊的 `jsp:useBean` 标签。其简单形式如下：\n\n`<jsp:useBean id=\"\
  name*\" class=\"package.class*\" />` `id` 属性提供了你在 JSP 其他地方引用该 bean 的名称，`class` 属性提供了类的限定类名。这里是使用\
  \ `Triangle` bean 的 `jsp:useBean` 标签：\n\n```jsp\n<jsp:useBean id=\"triangle\" class=\"\
  com.lowewriter.calculators.Triangle\" />\n```\n\n第 4 章 **使用 JavaBeans** 761\n\n\
  **表格 4-1**\n用于 Bean 的 JSP 标签\n\n| 标签 | 说明 |\n| :--- | :--- |\n| `<jsp:useBean id=\"\
  name*\" class=\"package.class*\" />` | 建立 bean 的引用并在必要时创建实例。`id` 属性指定的名称被其他标签用于引用该\
  \ bean。 |\n| `<jsp:getProperty name=\"name*\" property=\"property*\" />` | 从 `name`\
  \ 属性指定的 bean 获取指定的属性。 |\n| `<jsp:setProperty name=\"name*\" property=\"property*\"\
  \ value=\"value*\" />` | 将指定的属性设置为 `property*` `value*` 属性中的值。 |\n| `<jsp:setProperty\
  \ name=\"name*\" property=\"property*\" param=\"parameter*\" />` | 将指定的属性设置为 `param`\
  \ 属性中指定的参数 `property*`的值。参数通常是 `param=\"parameter*\"`。 |\n\n\n\n\n\n表单字段的名称。\n\n\
  ```jsp\n<jsp:setProperty name=\"name\" property=\"*\" />\n```\n\n将 bean 定义的所有属性设置为相应的参数值，前提是存在名称名称的参数。\n\
  \n`jsp:useBean` 标签在实例不存在时，通过调用空构造函数来创建一个 bean 实例。如果 bean 已经存在，则将使用现有实例。\n\n以下是关于\
  \ `jsp:useBean` 标签你应该了解的另外几点：\n\n- `jsp:useBean` 标签可以出现在 JSP 文档的任何位置，但它必须出现在任何引用该\
  \ bean 的标签之前。\n- 此标签以及所有 bean 标签都是区分大小写的，因此请务必按照所示内容精确编写代码。`<jsp:usebean.../>` 将无法工作。\n\
  - 如果在运行 JSP 时 Tomcat 报错找不到你的 bean，请双击包名和类名——它们也是区分大小写的——并确保该 bean 存储在 `WEB-INF\\\
  classes` 下一个与包名同名的目录中。例如，你可能将 `Triangle` bean 的类文件存储在 `WEB-INF\\classes\\calculators`\
  \ 中。（有关 Tomcat 的更多信息，请翻阅第 7 章第 2 章。）\n- `jsp:useBean` 元素可以有一个包含 `jsp:setProperty`\
  \ 标签体，用于初始化属性值。此时该元素的形式更像普通的 HTML，具有正确的开始和结束标签，例如所示：\n\n```jsp\n<jsp:useBean id=\"\
  t1\" class=\"com.lowewriter.calculators.Triangle\" >\n  <jsp:setProperty name=\"\
  t1\" property=\"sideA\" value=\"3.0\" >\n  <jsp:setProperty name=\"t1\" property=\"\
  sideB\" value=\"3.0\" >\n</jsp:useBean>\n```\n\n先不要担心 `jsp:setProperty` 标签的细节。只需记住只有当\
  \ `jsp:useBean` 标签实际上创建了 bean 的新实例时，这些标签才会执行。如果 bean 实例已经存在，则不会执行 `jsp:setProperty`\
  \ 标签。\n\n- `jsp:useBean` 标签还有一个 `scope` 属性，我将在本章后面的“设置 bean 的作用域”部分中进行解释。\n\n###\
  \ 获取属性值\n\n要获取 bean 属性的值，你使用 `jsp:getProperty` 标签。该标签的形式非常直观：\n\n```jsp\n<jsp:getProperty\
  \ name=\"name\" property=\"property\" />\n```\n\n这是一个从前一节创建的 `Triangle` bean 中获取\
  \ `sideC` 属性的标签：\n\n```jsp\n<jsp:getProperty name=\"triangle\" property=\"sideC\"\
  \ />\n```\n\n`name` 属性必须与创建该 bean 的 `jsp:useBean` 标签中 `id` 属性所指定的值一致。此外，`property`\
  \ 属性用于确定 getter 方法的名字——在这种情况下，是 `getSideC`。\n\n属性名始终以小写字母开头。如果你指定 `property=\"SideC\"\
  `，在运行页面时你会收到来自服务器的错误消息。\n\n### 使用 JavaBeans\n\n在大多数情况下，你使用 `jsp:getProperty` 将属性值插入页面中，但你也可以用它来指定\
  \ JSP 文档中其他标签的属性值，例如所示：\n\n```jsp\n<input type=\"text\" name=\"sideA\" value=\"\
  <jsp:getProperty name=\"triangle\" property=\"sideA\" />\" >\n```\n\n在这里，`sideA`\
  \ 属性的值被检索并用于名为 `sideA` 的输入框的 `value` 属性。结果是当此输入框发送到浏览器时，它的初始值是来自 `Triangle` bean\
  \ 的值。\n\n特别注意匹配标签的引号以及开启和关闭括号。在这个示例中，整个 `jsp:getProperty` 标签都包含在引号内，这些引号指示输入框 `value`\
  \ 属性的值。出现在最最后的右括号闭合了输入元素本身。\n\n### 设置属性值\n\n要设置属性值，你可以使用 `jsp:setProperty` 标签的多种变体之一。如果你想将属性设置为一个字面量字符串，可以这样写标签：\n\
  \n```jsp\n<jsp:setProperty name=\"triangle\" property=\"sideA\" value=\"4.0\" />\n\
  ```\n\n在这里，`name` 属性必须与创建该 bean 的 `jsp:useBean` 标签的 `id` 属性匹配；`property` 属性用于确定\
  \ setter 方法的名字（在这种情况下，是 `setSideA`）；`value` 属性提供了要设置的值。\n\n我将这个标签分在三行写是因为它太长了，无法在一行内放入本面的页边范围内。在实际操作中，大多数\
  \ JSP 开发人员会将这些标签写在同一行，除非它们真的非常长，而这种情况并不常见。\n\n虽然这种形式的 `jsp:setProperty` 标签很有用，但\
  \ `param` 更有用。它允许将属性设置为用户在表单字段中输入的值或通过查询字符串传递给 JSP 的值。如果你的 JSP 一个带有 `FirstSide`\
  \ 输入字段的表单，你可以这样将该字段的值赋值给 `sideA` 属性：\n\n```jsp\n<input type=\"text\" name=\"FirstSide\"\
  \ >\n<jsp:setProperty name=\"triangle\" property=\"sideA\" param=\"FirstSide\" />\n\
  ```\n\n在这里，如果用户在 `FirstSide` 中输入一个值，该值将被赋值给 bean 的 `sideA` 属性。\n\n在前面的示例中，我故意为输入框使用了非\
  \ `sideA` 的名称，以免你对属性和 `param` 属性指定相同值的事感到困惑。在实际操作中，你通常会让输入字段与其关联的属性同名，如下所示：\n\n\
  ```jsp\n<input type=\"text\" name=\"sideA\" >\n<jsp:setProperty name=\"triangle\"\
  \ property=\"sideA\" />\n```\n\n如果输入字段的名称与属性名相同，你可以用一个标签将它们都赋值给相应的属性，如下：\n\n```jsp\n\
  <jsp:setProperty name=\"triangle\" property=\"*\" />\n```\n\n这里 `property` 属性中的星号\
  \ `*` 表示所有与字段（或查询参数）同名的属性都会自动赋值。对于字段很多的表单，这种形式的 `jsp:setProperty` 可以为你节省大量的代码工作。\n\
  \n### 使用 bean 的页面\n\n![Image 108](img/index-787_1.png)\n\n**图 4-1:** 在浏览器中显示的 Triangle.jsp。\n\
  \n### 使用 JavaBeans\n\n**列表 4-2：Triangle.jsp 页面**\n\n```jsp\n<html>\n<head>\n  <title>三角形计算器</title>\n\
  </head>\n<body>\n  <h1>三角形计算器</h1>\n  <form action=\"Triangle.jsp\" method=\"post\"\
  >\n    <jsp:useBean id=\"triangle\" class=\"com.lowewriter.calculators.Triangle\"\
  \ />\n    <jsp:setProperty name=\"triangle\" property=\"*\" />\n    Side A: <input\
  \ type=\"text\" name=\"sideA\" value=\"<jsp:getProperty name=\"triangle\" property=\"\
  sideA\" />\" >\n    Side B: <input type=\"text\" name=\"sideB\" value=\"<jsp:getProperty\
  \ name=\"triangle\" property=\"sideB\" />\" >\n    Side C: <jsp:getProperty name=\"\
  triangle\" property=\"sideC\" />\n    <input type=\"submit\" value=\"Calculate\"\
  \ >\n  </form>\n</body>\n</html>\n```\n\n以下段落解释了此 JSP 中的关键行：\n\n- `jsp:useBean`\
  \ 标签创建 `calculators.Triangle` bean 的实例并将其命名为 `triangle`。\n- `jsp:setProperty` 标签将\
  \ `sideA` 和 `sideB` 属性设置为对应名为 `sideA` 和 `sideB` 的输入字段。\n- `form` 标签创建一个表单，使用 HTTP\
  \ `POST` 方法回传到同一个 JSP 文件。\n\n\n\n\n\n`sideA`，且其初始值被设置为 bean 的 `sideA` 属性的值。\n\n\
  →**18** 第二个输入文本字段名为 `sideB`。它的初始值被设置为 bean 的 `sideB` 属性的值。\n\n→**24** 这一行是获取 `sideC`\
  \ 属性的地方，从而根据边 `A` 和 `B` 的长度计算三角形边 C 的长度。结果直接插入到文档中。\n\n→**27** `Submit` 按钮提交表单，以便\
  \ `Triangle` bean 执行其功能。\n\n766 第 7 册 **Web 编程**\n\n# Bean 的作用域\n\nJavaBean 的 *scope*（作用域）决定了\
  \ bean 的生命周期长短。你通过使用 `jsp:useBean` 标签的 `scope` 属性来指定作用域。`scope` 属性可以是表 4-2 列出的四个值之一\n\
  \n### 表 4-2: 作用域设置\n\n| 作用域 | 说明 |\n| :--- | :--- |\n| page | 此设置将 bean 与当前页面关联。因此，每当用户请求页面时，都会创建一个新的\
  \ bean。当页面发送回浏览器时，bean 就会被销毁。因此，每次往返服务器都会创建一个 bean 的新实例。 |\n| request | 此设置与 page\
  \ 类似，但 bean 对同一请求处理的其他页面也可用。这种作用域对于单个请求使用多个 servlet 或 JSP 的应用程序非常有用。 |\n| session\
  \ | 此设置将 bean 与用户的会话关联。当用户第一次请求应用程序的页面时，会创建一个 bean 并与用户关联。然后，同一个用户的后续请求将使用同一个相同的\
  \ bean。 |\n| application | 此设置意味着应用程序的所有用户都使用一个 bean 的单一副本。 |\n\n默认作用域是 `page`，这意味着每当用户请求新页面时，bean\
  \ 都会被创建和销毁。然而，`session` 作用域对于需要从一个页面到另一个页面跟踪用户信息的 Web 应用程序非常有帮助。为人知的例子是购物车，用户可以在其中选择他想要购买的物品。购物车的内容可以保存在\
  \ session bean 中。\n\n# 使用 JavaBeans\n\n## 购物车应用程序\n\n图 4-2 显示了一个简单的购物车应用程序，其中用户可以选择点击三个按钮之一来购买我最近出版的三本书之一。当用户点击按钮时，一个物品会被添加到购物车中。如果用户已将书籍添加到购物车，则数量会增加\
  \ 1。在图中，用户点击了一次 *Electronics All-in-One For Dummies* 按钮，点击了两次 *Networking All-in-One\
  \ For Dummies* 按钮。\n\n第 4 章 **使用 JavaBeans** 767\n\n![Image 109](img/index-790_1.png)\n\
  \n**图 4-2:** 一个超简单的购物车应用程序。\n\n接下来的段落描述了使此购物车运行的关键技术：\n\n*   购物车本身是一个 JavaBean，它只有两个公共方法：`setBook`（将书籍添加到购物车）和\
  \ `getList`（返回一个字符串，以 HTML 表格的形式整齐地显示购物车物品）。\n*   购物车类包含一个表示 `Book` 对象的内部类。为了保持应用程序的简单，`Book`\
  \ 类将三个标题硬编码在内部。在真实的购物车程序中，你使用文件或数据库而不是硬编码这些值。\n*   出现在页面顶部的产品列表实际上是三个独立的表单，每个表单对应一个产品。这些表单中的每一个都指定了一个通过查询字符串传递到服务器端\
  \ JSP 的参数。该参数名为 `book`，其值是用户订购书籍的代码。该参数绑定到购物车 bean 的 `book` 属性上，因此当用户点击三个按钮之一时，将使用通过\
  \ `book` 参数传递的值调用 `setBook` 方法。这就是购物车知道用户订购了哪本书的原因。\n*   在书籍列表下方，JSP 使用 `jsp:getProperty`\
  \ 标签获取 `list` 属性，从而显示购物车。\n\n### 购物车页面\n\n列表 4-3 显示了购物车页面的 JSP。\n\n768 第 7 册 **Web\
  \ 编程**\n\n**列表 4-3: BuyMyBook.jsp**\n\n```html\n<html>\n<jsp:useBean id=\"cart\"\
  \ class=\"com.lowewriter.books.BookCart\" scope=\"session\"/>\n<jsp:setProperty\
  \ name=\"cart\" property=\"*\" />\n<head>\n<title>Buy My Books!</title>\n</head>\n\
  <body>\n<h1>Which of my books do you want to buy?</h1>\n<form action=\"BuyMyBook.jsp?book=elecaio\"\
  \ method=\"post\">\n<input type=\"submit\" value=\"Buy\" >&nbsp;&nbsp;\nElectronics\
  \ All-in-One For Dummies<br><br>\n</form>\n<form action=\"BuyMyBook.jsp?book=netaio\"\
  \ method=\"post\">\n<input type=\"submit\" value=\"Buy\" >&nbsp;&nbsp;\nNetworking\
  \ All-in-One Desk Reference For Dummies<br><br>\n</form>\n<form action=\"BuyMyBook.jsp?book=wordaio\"\
  \ method=\"post\">\n<input type=\"submit\" value=\"Buy\" >&nbsp;&nbsp;\nJava All-in-One\
  \ Desk Reference Dummies<br><br>\n</form>\n<h2>Your cart contains:</h2>\n<jsp:getProperty\
  \ name=\"cart\" property=\"list\" />\n</body>\n</html>\n```\n\n接下来的段落描述了 JSP 最重要的行：\n\
  \n→**2** `jsp:useBean` 标签加载了 `com.lowewriter.books.BookCart`，指定它具有 `session` 作用域。因此，bean\
  \ 在每次请求页面后不会删除。相反，用户操作的是整个会话。\n\n→**4** 设置了属性。当用户第一次请求页面时，没有参数，但当用户点击三个按钮之一时，`book`\
  \ 参数被添加到 URL 中，导致调用 `setBook` 方法。\n\n→**10** 这一行是第一本书的表单。它的属性指定 book 参数设置为 `elecaio`。\n\
  \n→**15** 这一行是第二本书的表单。它指定了 `netaio` 为 book 参数。\n\n→**21** 这一行是第三本书的表单。它指定了 `wordaio`\
  \ 为 book 参数的值。\n\n→**28** 在书籍列表之后，`jsp:getProperty` 调用 bean 的 `getList` 方法。该方法返回一个包含当前内容的字符串。\n\
  \n# BookCart JavaBean\n\n现在你已经看了购物车应用程序的 JSP，请查看列表 4-4 中 `BookCart` bean 的 Java\
  \ 代码。列表 4-4 包含两个类：`BookCart` 类和一个名为 `Book` 的内部类。因此当你编译列表 4-4 中的代码时，会两个类文件：`BookCart.class`\
  \ 和 `BookCart$Book.class`。要运行此应用程序，你必须将两个类文件复制到 Tomcat 目录（`WEB-INF\\classes\\`）。\n\
  \n**列表 4-4: BookCart JavaBean**\n\n```java\npackage com.lowewriter.books;\n\nimport\
  \ java.util.ArrayList;\nimport java.text.NumberFormat;\n\npublic class BookCart\
  \ {\n    private ArrayList<Book> cart;\n    private NumberFormat cf = NumberFormat.getCurrencyInstance();\n\
  \n    public BookCart() {\n        cart = new ArrayList<Book>();\n    }\n\n    public\
  \ void setBook(String code) {\n        boolean found = false;\n        for (Book\
  \ b : cart) {\n            if (b.getCode().equals(code)) {\n                b.addQuantity(1);\n\
  \                found = true;\n            }\n        }\n        if (!found) {\n\
  \            cart.add(new Book(code));\n        }\n    }\n\n    public String getList()\
  \ {\n        String list = \"<table border=2>\";\n        list += \"<tr><td>Title</td><td>Qty</td><td>Price</td><td>Total</td></tr>\"\
  ;\n        double total = 0.0;\n        for (Book b : cart) {\n            list\
  \ += \"<tr><td>\" + b.getTitle() + \"</td>\"\n            + \"<td>\" + b.getQuantity()\
  \ + \"</td>\"\n            + \"<td>\" + cf.format(b.getPrice())\n            + \"\
  </td></tr>\";\n        }\n        return list;\n    }\n}\n```\n\n\n\n\n\n```java\n\
  + \"<td>\" + cf.format(b.getTotal())\n+ \"</td>\"\n+ \"</tr>\";\n\ntotal += b.getTotal();\n\
  \n}\n\nlist +=\"<tr><td></td><td></td><td>Total:</td>\"\n+ \"<td>\" + cf.format(total)\n\
  + \"</td></tr>\";\n\nlist += \"</table>\";\n\nreturn list;\n```\n\n# 使用 JavaBeans\n\
  \n```java\nprivate class Book {\n    private String code;\n    private int quantity;\n\
  \n    public Book(String code) {\n        this.code = code;\n        this.quantity\
  \ = 1;\n    }\n\n    public String getCode() {\n        return this.code;\n    }\n\
  \n    public String getTitle() {\n        // (continued)\n        if (code.equals(\"\
  elecaio\"))\n            return \"Electronics All-in-One For Dummies\";\n      \
  \  else if (code.equals(\"netaio\"))\n            return \"Networking All-in-One\
  \ For Dummies\";\n        else if (code.equals(\"javaaio\"))\n            return\
  \ \"Java All-in-One For Dummies\";\n        else\n            return \"Unknown book\"\
  ;\n    }\n\n    public double getPrice() {\n        if (code.equals(\"elecaio\"\
  ))\n            return 34.99;\n        else if (code.equals(\"netaio\"))\n     \
  \       return 22.99;\n        else if (code.equals(\"javaaio\"))\n            return\
  \ 29.99;\n        else\n            return 0.0;\n    }\n\n    public int getQuantity()\
  \ {\n        return this.quantity;\n    }\n\n    public void addQuantity(int qty)\
  \ {\n        this.quantity += qty;\n    }\n\n    public double getTotal() {\n  \
  \      return this.quantity * this.getPrice();\n    }\n}\n```\n\n接下来的段落描述了 bean\
  \ 的要点：\n\n1. `BookCart` 类存在于 `books` 包中。\n2. 购物车本身保存在 `BookCart` bean 内部，是一个存储 `Book`\
  \ 项的私有 `ArrayList`。\n3. 要成为一个 `JavaBean`，你需要一个无参数构造函数。这个构造函数只是初始化了购物车 `ArrayList`。\n\
  4. 调用 `setBook` 方法是为了将书籍添加到购物车中。书籍的代码作为参数传递。该方法首先查看 `ArrayList` 中所有的 `books`，以检查用户是否已经添加了具有该代码的书籍。如果是，则调用该书籍的\
  \ `addQuantity` 方法将该书籍的订单数量增加 1。如果不是，则创建一个带有指定代码的新书籍并将其添加到购物车。\n5. 此方法构建了一个字符串，其中购物车中的所有书籍都以\
  \ HTML 表格的形式呈现。如果你不熟悉 HTML 表格，你只需要知道 `<tr>` 和 `</</tr>` 标签标记了每一行的开始和结束，而 `<td>`\
  \ 和 `</dd>` 标签标记了行内每个单元格的开始和结束。表格为购物车中的每本书都包含一行。每行都包含标题、数量、价格和总计的单元格。如果你将此方法中的代码与图\
  \ 4-2 所示的实际表格进行比较，就可以了解该方法实际创建的 HTML 内容。\n6. 还要注意，构建每个表格行的循环会维护整个购物车的运行总计，该总计显示在表格底部单独的一行中。此外，表格开头会显示一行标题行。\n\
  6. `Book` 类被定义为内部类，以便它可以表示 `ArrayList` 中的书籍。\n8. `Book` 类对每本书只存储了两项信息：书籍代码和数量。后者代表用户订购的书籍数量。其他值是由返回它们的方法计算的。\n\
  9. 构造函数接受书籍代码并初始化实例字段。注意 `quantity` 被初始化为 1。\n10. `getCode` 方法简单地返回 `code` 变量。\n\
  11. `getTitle` 方法根据 `code` 返回三个书籍标题之一。如果 `code` 不属于三个预定义代码之一，则返回 `Unknown book`。\n\
  12. 同样，`getPrice` 方法根据 `code` 返回三个价格之一。如果 `code` 不属于三个允许的代码之一，那么这本书就是免费的！\n13. `getQuantity`\
  \ 方法直接返回 `quantity` 变量。\n14. `addQuantity` 方法为 `quantity` 变量增加一个值。\n15. `getTotal`\
  \ 方法通过将价格乘以数量来计算总额。\n\n# 8 个文件与数据库\n\n## 目录摘要\n\n- **第一章：处理文件** ... 777\n- **第二章：处理文件流**\
  \ ... 799\n- **第三章：使用 JDBC 连接数据库** ... 827\n- **第四章：使用 JavaBeans** ... 845\n- **第五章：处理\
  \ XML** ... 861\n\n# 第一章：处理文件\n\n**本章内容**\n在本章中，你将发现处理文件的各种门道。我不会向你展示如何读取或写入文件，但你将发现如何创建、删除、重命名文件以及处理目录。从\
  \ Java 1.7 开始，处理文件你有种选择：你可以使用原始的 `File` 类，也可以使用新的 `Path` 类。\n\n## 使用 File 类\n\n\
  `File` 类是处理文件和目录的关键。一个 `File` 对象代表一个文件或一个目录。请注意，它并不一定在硬盘上存在。相反，`File` 对象表示的是一个可能存在也可能不存在的文件。Java\
  \ 使用同一个类来表示文件和目录，因为目录实际上只是一种特殊的文件。我想 Java 的设计者本可以创建一个 `Directory` 类来表示目录，但那样你就需要学习如何使用两个类而不是一个。`File`\
  \ 类位于 `java.io` 包中，因此任何使用它的程序都应该导入 `java.io.File` 或 `java.io.*`。Java 1.7 引入了一个新的\
  \ `Path` 类，旨在取代 `File` 类。\n\n### 类的构造函数和方法\n\n表 1-1 列出了 `File` 类的主要构造函数和方法。\n\n\
  #### 表 1-1：File 类\n\n| 构造函数/字段 | 描述 |\n| :--- | :--- |\n| `File(String pathname)`\
  \ | 创建指定路径的文件。 |\n| `separator` | 系统中路径组件的分隔符；通常为 `\\` 或 `/`。 |\n| `canRead()` |\
  \ 判断文件是否可以读取。 |\n| `canWrite()` | 判断文件是否可以写入。 |\n| `createNewFile()` | 如果文件不存在则在硬盘上创建它。如果创建了文件则返回\
  \ true，如果文件已存在则返回 false。 |\n| `delete()` | 删除文件或目录。如果文件删除成功则返回 true。 |\n| `exists()`\
  \ | 如果文件在硬盘上存在则返回 true，如果不存在则返回 false。 |\n| `getCanonicalPath()` | 返回文件的完整路径，在 Windows\
  \ 系统上运行时包含驱动器号；抛出 `IOException`。 |\n| `getName()` | 获取此文件名。 |\n| `getParent()` |\
  \ 获取此文件或目录的父目录名称。 |\n| `getParentFile()` | 获取表示该文件或目录的父目录的 `File` 对象。 |\n\n\n\n\n\
  \n`boolean isDirectory()`\n如果此 `File` 对象是目录，则返回 true；如果它是文件，则返回 false。\n\n`boolean\
  \ isFile()`\n如果此 `File` 对象是文件，则返回 true；如果它是目录，则返回 false。\n\n`boolean isHidden()`\n\
  如果此文件或目录被操作系统标记为隐藏，则返回 true。\n\n`long lastModified()`\n返回文件最后修改的时间，用自 1970 年 1 月\
  \ 1 日凌晨 0:00:00 以来的毫秒数表示。\n\n`long length()`\n返回以字节为单位的文件的文件大小。\n\n`String[] list()`\n\
  返回一个 `String` 对象的数组，包含该目录中每个文件和目录的。每个字符串都是简单的文件名，而不是完整路径。如果此 `File` 对象不是目录，该方法返回\
  \ `null`。\n\n`File[] listFiles()`\n返回一个 `File` 对象的数组，代表该目录中的每个文件和目录。如果此 `File` 对象不是目录，该方法返回\
  \ `null`。\n\n`static File[] listRoots()`\n返回一个包含 `File` 对象的数组，每个对象代表 Java 运行时上每个可用文件系统的根目录。Unix\
  \ 系统通常只有一个根目录，但 Windows 系统为每个驱动器都有一个根目录。\n\n`boolean mkdir()`\n从此 `File` 对象在硬盘上创建一个目录。如果目录创建成功，则返回\
  \ true。\n\n`boolean mkdirs()`\n从此 `File` 对象在硬盘上创建一个目录，包括目录路径中列出但不存在的任何父目录。如果目录创建成功，则返回\
  \ true。\n\n`boolean renameTo(File dest)`\n将 `File` 对象重命名为指定的目录 `File` 对象。如果重命名成功，该方法返回\
  \ true。\n\n`boolean setLastModified(long time)`\n设置 `File` 对象的最后修改时间。如果 `time` 设置成功，则返回\
  \ `true`。\n\n`boolean setReadOnly()`\n将文件标记为只读。如果文件标记成功，则返回 true。\n\n# 使用文件\n\n\
  `String toString()`\n以字符串形式返回此文件或目录的路径名。\n\n## 创建 File 对象\n要创建一个 `File` 对象，你只需调用\
  \ `File` 构造函数，并传递一个代表文件名的字符串作为参数。这是一个示例：\n\n```java\nFile f = new File(\"hits.log\"\
  );\n```\n\n这里文件的名称是 `hits.log`，它位于当前目录，该目录通常是启动 Java 虚拟机（JVM）的目录。如果你不想让文件存在于当前目录，可以在参数字符串中提供完整的路径名。然而，你现在正在进入\
  \ Java 中少数依赖于系统的区域之一，因为你编写路径名的方式取决于你使用的操作系统。例如，路径名 `c:\\logs\\hits.log` 在 Windows\
  \ 系统上有效，但在 Unix 或 Macintosh 系统上则无效，因为这些系统不使用驱动器号，而是使用斜杠而不是反斜杠来分隔目录。\n\n如果你将路径名硬编码为字符串字面量，反斜杠字符是\
  \ Java 字符串的转义字符。因此，你必须编写两个反斜杠才能在路径中获得一个反斜杠。你必须这样编写路径 `c:\\logs\\hits.log`：\n\n```java\n\
  String path = \"c:\\\\logs\\\\hits.log\";\n```\n\n## 创建文件\n创建一个 `File` 对象并不会硬盘上创建文件。相反，它会创建一个内存中的对象，代表一个可能存在也可能不存在于硬盘上的文件或目录。要检查文件或目录是否存在，你可以像这个示例一样使用\
  \ `exists` 方法：\n\n```java\nFile f = new File(path);\nif (!f.exists())\n    System.out.println(\"\
  输入文件不存在!\");\n```\n\n在这里，如果文件不存在，控制台上会显示错误消息。要在硬盘上创建一个新文件，可以使用你想要使用的文件名创建一个 `File`\
  \ 对象，然后使用 `createNewFile` 方法，如下：\n\n```java\nFile f = new File(path);\nif (f.createNewFile())\n\
  \    System.out.println(\"文件已创建.\");\nelse\n    System.out.println(\"无法创建文件。\");\n\
  ```\n\n注意 `createNewFile` 方法返回一个 `boolean` 值，表示文件是否创建成功。如果文件已经存在，`createNewFile`\
  \ 将返回 `false`，因此你不需要在调用 `createNewFile` 之前使用 `exists` 方法。当你使用 `createNewFile` 方法创建文件时，文件中没有任何内容。如果你想让文件包含数据，可以使用我在第\
  \ 8 卷第 2 章中描述的类向文件写入信息。\n\n## 获取有关文件的信息\n`File` 类的几个方法简单地返回有关文件或目录的信息。例如，你可以通过调用其\
  \ `isDirectory` 或 `isFile` 方法来确定 `File` 对象代表的是文件还是目录。其他方法让你发现文件是否是只读的或隐藏的，或者检索文件的年龄以及最后修改的时间。\n\
  \n你可以通过几种流行的方法获取 `File` 对象代表的文件名：\n\n*   要仅获取文件名，使用 `getName` 方法。该方法返回一个仅包含文件名的字符串，不包含完整路径。\n\
  *   要获取创建 `File` 对象时指定的路径（例如 `\\logs\\hit.log`），使用 `toString` 方法。\n*   要获取文件的完整路径——即包含驱动器号（对于\
  \ Windows 系统）并消除任何相对路径的路径——使用 `canonicalPath` 方法。\n\n## 获取目录的内容\n目录是一个包含其他文件的文件。目录由\
  \ `File` 类表示。你可以通过调用 `isDirectory` 方法判断特定的 `File` 对象是否为目录。如果该方法返回 true，则它是目录。然后你可以通过调用\
  \ `listFiles` 方法获取目录包含的所有文件的数组。\n\n以下代码片段列出了存储在字符串 `path` 中的目录中的每个文件的名称：\n\n```java\n\
  File dir = new File(path);\nif (dir.isDirectory()) {\n    File[] files = dir.listFiles();\n\
  \    for (File f : files)\n        System.out.println(f.getName());\n}\n```\n\n\
  下面的片段更具选择性，因为它只列出文件而不是目录，并且不列出隐藏文件：\n\n```java\nFile dir = new File(path);\nif (dir.isDirectory())\
  \ {\n    File[] files = dir.listFiles();\n    for (File f : files) {\n        if\
  \ (f.isFile() && !f.isHidden())\n            System.out.println(f.getName());\n\
  \    }\n}\n```\n\n目录列表特别适用于递归编程，因为 `listFiles` 方法返回的每个 `File` 对象都可能是另一个目录。\n\n##\
  \ 重命名文件\n你可以使用 `renameTo` 方法重命名文件。该方法使用另一个 `File` 对象作为参数，指定你要将当前文件重命名为什么的文件。它返回一个\
  \ `boolean` 值，指示重命名是否成功。\n\n以下语句将名为 `hits.log` 的文件重命名为 `savedhits.log`：\n\n```java\n\
  File f = new File(\"hits.log\");\nif (f.renameTo(new File(\"savedhits.log\")))\n\
  \    System.out.println(\"文件已重命名.\");\nelse\n    System.out.println(\"文件重命名失败.\"\
  );\n```\n\n根据操作系统的功能，`renameTo` 方法还可以将文件从一个目录移动到另一个目录。这段代码将 `hits.log` 文件从 `logs`\
  \ 文件夹移动到 `savedlogs` 文件夹：\n\n```java\nFile f = new File(\"logs\\\\hits.log\");\n\
  ```\n\n\n\n\n\n```java\nif (f.renameTo(new File(\"savedlogs\\\\hits.log\"))) {\n\
  \    System.out.println(\"File moved.\");\n} else {\n    System.out.println(\"File\
  \ not moved.\");\n}\n```\n始终测试 `renameTo` 方法的返回值，以确保文件已成功重命名。\n\n## 删除文件\n\n要删除文件，请为文件创建一个\
  \ `File` 对象，然后调用 `delete` 方法，如下例所示：\n\n```java\nFile f = new File(\"hits.log\");\n\
  if (f.delete()) {\n    System.out.println(\"File deleted.\");\n} else {\n    System.out.println(\"\
  File not deleted.\");\n}\n```\n\n如果文件是一个目录，则该目录必须为空才能删除。通过某些递归编程，你可以创建一个删除非空目录的方法——但请务必注意接下来的警告。该方法看起来如下：\n\
  \n```java\nprivate static void deleteFile(File dir) {\n    File[] files = dir.listFiles();\n\
  \    for (File f : files) {\n        if (f.isDirectory()) {\n            deleteFile(f);\n\
  \        } else {\n            f.delete();\n        }\n    }\n    dir.delete();\n\
  }\n```\n\n然后，要删除名为 `folder1` 的文件夹及其所有的文件和子目录，调用 `deleteFile` 方法：\n\n```java\ndeleteFile(new\
  \ File(\"folder1\"));\n```\n\n将此功能添加到程序中是极其危险的。在没有经过仔细测试之前，不要使用它。如果你不小心删除了硬盘上的所有文件，请不要怪我！\n\
  \n## 使用命令行参数\n\n从第一卷第一章开始，我在目前为止的每个 Java 程序中都使用了这种结构：\n\n```java\npublic static\
  \ void main(String[] args)\n```\n\n现在是时候让你去搞清楚 `main` 方法的 `args` 参数是用来用的了。`args`\
  \ 参数是一个字符串数组，允许你访问用户在运行你的程序时指定的任何命令行参数。\n\n假设你从类似下面的命令行程序运行一个名为 `Test` 的 Java 程序：\n\
  \n`C:\\>java Test the quick brown fox`\n\n在这种情况下，Java 程序接收了四个参数：`the`、`quick`、`brown`\
  \ 和 `fox`。你可以通过 `args` 数组访问这些参数。\n\n假设 `Test` 类的 `main` 方法编写如下：\n\n```java\npublic\
  \ static void main(String[] args) {\n    for (String s : args) {\n        System.out.println(s);\n\
  \    }\n}\n```\n\n那么当使用几段落前显示的命令运行时，该程序会在控制台上显示以下输出：\n\n```\nthe\nquick\nbrown\n\
  fox\n```\n\n命令行参数在处理文件的 Java 程序中非常有用，可以作为一种向程序传递路径名的方法。这里有一个程序，列出作为参数传递给程序的目录中的所有文件：\n\
  \n```java\nimport java.io.*;\n\npublic class ListDirectory {\n    public static\
  \ void main(String[] args) {\n        if (args.length > 0) {\n            String\
  \ path = args[0];\n            File dir = new File(path);\n            if (dir.isDirectory())\
  \ {\n                File[] files = dir.listFiles();\n                for (File\
  \ f : files) {\n                    System.out.println(f.getName());\n         \
  \       }\n            } else {\n                System.out.println(\"Not a directory.\"\
  );\n            }\n        }\n    }\n}\n```\n\n## 在 Swing 应用中选择文件\n\n在大多数情况下，你不想在\
  \ Swing 应用中折腾命令行参数。相反，你希望使用 `JFileChooser` 类让用户选择他们想要处理的文件。该类允许你只需几行代码即可显示与你在其他图形用户界面\
  \ (GUI)应用程序中看到的相似的打开和保存对话框。\n\n图 1-1 显示了仅用这两行代码创建的打开对话框：\n\n```java\nJFileChooser\
  \ fc = new JFileChooser();\nint result = fc.showOpenDialog(this);\n```\n\n**图 1-1：**\
  \ 由 `JFileChooser` 类显示的打开对话框。\n\n这段代码出现在一个自 `JFrame` 类的框架类中，因此 `showOpenDialog`\
  \ 调用中的 `this` 关键字指向父框架。\n\n`showOpenDialog` 方法返回的结果表示用户是选择打开文件还是点击了取消，而 `JFileChooser`\
  \ 类提供了一个方便的 `getSelectedFile` 方法，你可以用它来获取用户选择的文件的 `File` 对象。\n\n关于 `JFileChooser`\
  \ 类需要了解的重要点是，它实际上并没有打开或保存用户选择的文件；相反，它返回一个用户所选文件的 `File` 对象。你的程序负责打开或保存该文件。`JFileChooser`\
  \ 类有许多额外方法，你可以用几乎任何想象的任何方式来定制它的外观和行为。表 1-2 列出了这个强大类常用的构造函数和方法。\n\n### 表 1-2 JFileChooser\
  \ 类\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n| `JFileChooser()` | 创建从用户默认目录开始的文件选择器。在\
  \ Windows 系统上，此目录通常是“我的文档”。 |\n| `JFileChooser(File file)` | 创建从 `file` 参数指定的位置开始的文件选择器。\
  \ |\n| `JFileChooser(String path)` | 创建从 `path` 指定的位置开始的文件选择器。 |\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `void addFileFilter(Filter)` | 为选择器添加过滤器。 |\n| `File getSelectedFile()`\
  \ | 返回用户选择的 `File` 对象。 |\n| `File[] getSelectedFiles()` | 返回用户选择的 `File` 对象数组。 |\n\
  | `void setAllVisible(boolean value)` | 如果为 false，则从选择器中移除“所有文件”过滤器。 |\n| `void\
  \ setApproveButtonText(String text)` | 设置批准按钮的文本。 |\n| `void setDialogTitle(String\
  \ title)` | 设置对话框显示的标题。 |\n| `void setFileHidingEnabled(boolean value)` | 如果为 true，则显示隐藏文件。\
  \ |\n| `void setMultiSelectionEnabled(boolean value)` | 如果为 true，允许用户选择多个文件。 |\n\
  | `int showDialog(Component parent, String text)` | 显示带有指定文本的对话框。返回 `JFileChooser.CANCEL_OPTION`、`JFileChooser.APPROVE_OPTION`\
  \ 和 `JFileChooser.ERROR_OPTION`。 |\n| `int showOpenDialog(Component parent)` | 显示打开对话框。返回值与\
  \ `showDialog` 相同。 |\n| `int showSaveDialog(Component parent)` | 显示保存对话框。返回值与 `showDialog`\
  \ 相同。 |\n\n## 创建打开对话框\n\n正如你看到的，只需几行代码即可创建一个打开对话框。首先，你调用 `JFileChooser` 构造函数创建一个\
  \ `JFileChooser` 实例；然后调用 `showOpenDialog` 方法显示打开对话框。\n\n如果你不向构造函数传递参数，文件选择器将从用户的默认目录开始，在大多数系统上是操作系统的当前目录。如果你想从其他目录开始，你有两个选择：\n\
  \n- 为目录创建一个 `File` 对象，然后将该 `File` 对象传递给构造函数。\n- 将你想开始的目录路径名传递给构造函数。\n\n`JFileChooser`\
  \ 类还包含许多方法，允许你控制对话框的外观。你可以使用 `setDialogTitle` 方法设置标题（默认是 Open），可以使用 `setFileHidingEnabled`\
  \ 方法控制是否显示隐藏文件。`setFileSelectionMode(int mode)` 允许你指定用户可以选择文件、目录还是两者。该方法的选项需要稍微解释：\n\
  \n- `JFileChooser.FILES_ONLY`：使用此选项（默认值），用户只能在文件选择器对话框中选择文件。用户可以导航\n\n\n在文件选择对话框中显示目录，但无法实际选择目录。\n\
  \n- `JFileChooser.DIRECTORIES_ONLY`: 使用此选项时，用户只能选择目录，而不能选择文件。此选项的一个常见用途是让用户为应用程序使用的文件选择一个默认位置，而无需实际打开文件。\n\
  - `JFileChooser.FILES_AND_DIRECTORIES`: 此选项允许用户选择文件或目录。对于大多数应用程序，你可能希望用户只选择一个文件或一个目录，而不是两者兼选，因此你可能不会使用此选项。\n\
  \n除了“打开（Open）”对话框外，你还可以通过调用 `showSaveDialog` 方法显示“保存（Save）”对话框。保存对话框与打开对话框相似，但在标题和确认（Approve）按钮上显示的文本具有不同的默认值。除此之外，这些对话框的工作方式基本相同。\n\
  \n# 文件与数据库\n\n## 获取选定的文件\n文件选择对话框是一个*模态*（modal）对话框，这意味着调用 `showOpenDialog` 方法后，你的应用程序将处于阻塞状态，直到用户点击“打开”或“取消”按钮关闭文件选择对话框。\n\
  \n你可以通过检查 `showOpenDialog` 方法的返回值来确定用户点击了哪个按钮：\n\n- 如果用户点击了“打开”，返回值为 `JFileChooser.APPROVE_OPTION`。\n\
  - 如果用户点击了“取消”，返回值为 `JFileChooser.CANCEL_OPTION`。\n- 如果发生 I/O（输入/输出）或其他错误，返回值为 `JFileChooser.ERROR_OPTION`。\n\
  \n假设 `showOpenDialog` 方法返回 `APPROVE_OPTION`，你可以使用 `getSelectedFile` 方法来获取用户所选文件对应的\
  \ `File` 对象。然后，你可以在程序的其他地方使用该 `File` 对象来读取或写入数据。\n\n将以上内容整合在一起，这里有一个方法，它会显示一个文件选择对话框，并返回一个代表用户选定文件的\
  \ `File` 对象。如果用户取消或发生错误，该方法将返回 `null`。\n\n```java\nprivate File getFile()\n{\n \
  \   JFileChooser fc = new JFileChooser();\n    int result = fc.showOpenDialog(null);\n\
  \    File file = null;\n    if (result == JFileChooser.APPROVE_OPTION)\n       \
  \ file = fc.getSelectedFile();\n    return file;\n}\n```\n\n你可以在用户点击按钮、选择菜单命令或以其他方式表示想要打开文件时，在事件处理程序中调用此方法。\n\
  \n## 使用文件过滤器\n文件选择对话框包含一个“文件类型（Files of Type）”下拉列表过滤器，用户可以使用该过滤器来控制选择器显示的文件类型。默认情况下，该下拉列表中唯一的可用项是“所有文件（All\
  \ Files）”，它不会对文件进行任何过滤。如果你想向此列表添加另一个过滤器，必须创建一个继承自 `FileFilter` 抽象类的类，然后将该类的实例传递给\
  \ `addChoosableFileFilter` 方法。\n\n表 1-3 列出了 `FileFilter` 类的方法。幸运的是，你只需要实现其中的两个方法。该类位于\
  \ `javax.swing.filechooser` 包中。\n\n出于某种原因，Java 设计者给这个类取了一个名字与 `java.io` 包中一个接口相同的名称，而该接口在处理文件的应用程序中频繁使用。因此，当你扩展该类时，需要使用全限定名，如下所示：\n\
  \n```java\nclass JavaFilter\nextends javax.swing.filechooser.FileFilter\n```\n\n\
  ### 表 1-3：FileFilter 类\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `public boolean abstract\
  \ accept(File f)` | 你必须实现此方法。如果你希望该文件显示在选择器中，则返回 true；如果你不想显示该文件，则返回 false。 |\n\
  | `public String abstract getDescription()` | 你必须实现此方法，以返回在选择器对话框“文件类型”下拉列表中显示的描述字符串。\
  \ |\n\n`getDescription` 方法简单地返回显示在“文件类型”下拉列表中的文本。你通常用一个单一的 return 语句来实现它，返回描述信息。这里是一个示例：\n\
  \n```java\npublic String getDescription()\n{\n    return \"Java files (*.java)\"\
  ;\n}\n```\n在这里，字符串 `Java files (*.java)` 将显示在“文件类型”列表中。\n\n`accept` 方法负责文件过滤的工作。文件选择器会对其显示的每个文件调用此方法。文件是作为参数传递的。`accept`\
  \ 方法返回一个布尔值，指示该文件是否被显示。\n\n`accept` 方法可以使用任何所需的标准来决定接受哪些文件以及拒绝哪些文件。大多数过滤器根据文件名的扩展名部分来实现此功能。遗憾的是，`File`\
  \ 类没有直接返回文件扩展名的方法，但你可以使用 `getName` 方法获取名称，然后使用 `matches` 方法配合正则表达式来确定文件是否是你正在寻找的类型。以下是一个\
  \ if 语句，用于判断 `name` 变量中的文件名是否为 `.java` 文件：\n\n```java\nif (name.matches(\".*\\\\\
  .java\"))\n```\n在这里，正则表达式匹配以任何字符序列开头并以 `.java` 结尾的字符串。（有关正则表达式的更多信息，请参阅第 5 本第 3\
  \ 章。）\n\n这是一个显示 `.java` 扩展名文件的 `FileFilter` 类：\n\n```java\nprivate class javaFilter\n\
  extends javax.swing.filechooser.FileFilter\n{\n    public boolean accept(File f)\n\
  \    {\n        if (f.isDirectory())\n            return true;\n        else\n \
  \           return false;\n    }\n\n    public String getDescription()\n    {\n\
  \        return \"Java files (*.java)\";\n    }\n}\n```\n\n创建实现过滤器的类后，你可以通过调用 `addChoosableFileFilter`\
  \ 将过滤器添加到选择器，如下所示：\n\n```java\nfc.addChoosableFileFilter(new JavaFilter());\n```\n\
  \n如果你想，可以通过调用 `setAllFilterUsed` 移除“所有文件”过滤器：\n\n```java\nfc.setAllFilterUsed(false);\n\
  ```\n这样只有你添加的过滤器才会出现在“文件类型”列表中。\n\n## Path 对象\nJava 1.7 引入了名为 `Path` 的新类型，以解决自 1.0\
  \ 以来 `File` 类的某些缺陷。`Path` 对象解决的 `File` 类最严重的缺陷是：许多操作在发生问题时不会提供详细的错误信息。例如`File` 类的\
  \ `delete` 方法返回一个布尔值指示文件是否被删除，但如果无法删除，则找不到原因。`Path` 对象通过抛出包含详细信息的异常修正了这一缺陷。\n\n\
  注意 `Path` 并不是一个类，而是一个接口。这意味着你不能通过调用构造函数直接创建 `Path` 对象。相反，你使用新类 `Paths` 的方法来创建 `Path`\
  \ 对象。这种命名很令人困惑——`Path` 与 `Paths`、接口与类——但在使用 `Paths` 类创建 `Path` 对象后，你就会习惯这种区别。\n\n\
  `Path` 接口和 `Paths` 类都位于 `java.nio.file` 包中，因此任何使用它们的程序都应该导入 `java.nio.file.*`。\n\
  \n表 1-4：Path 方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `Path copyTo(Path target)` |\
  \ 将文件复制到指定的目标文件。 |\n| `Path moveTo(Path target)` | 将文件移动到目标路径并删除原始文件。 |\n| `Path\
  \ createDirectory()` | 如果目录不存在，则在硬盘上创建它。 |\n| `Path createFile()` | 如果文件不存在，则在硬盘上创建它。\
  \ |\n| `void delete()` | |\n\n\n\n删除文件或目录。如果文件或目录不存在或无法删除，该方法将抛出异常。\n\n`void deleteIfExists()`\n\
  \n如果文件或目录存在则将其删除。如果文件或目录不存在，该方法不会抛出异常。\n\n`boolean exists()`\n\n如果文件存在于硬盘上返回 true，如果文件不在硬盘上则返回\
  \ false。\n\n`boolean notExists()`\n\n如果文件不在硬盘上则返回 true，如果文件存在于硬盘上则返回 false。\n\n\
  `String toAbsolutePath()`\n\n返回文件的完整绝对路径，如果在 Windows 系统上运行，则包含驱动器盘号。\n\n### 文件与数据库\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `DirectoryStream newDirectoryStream()` | 获取一个\
  \ `DirectoryStream` 对象，可以使用它读取目录的内容。 |\n| `DirectoryStream newDirectoryStream(String\
  \ filter)` | 获取一个由 `filter` 字符串过滤的 `DirectoryStream` 对象，该字符串可以包含通配符（如 `*.txt`），以仅检索\
  \ `.txt` 文件。 |\n| `boolean isFile()` | 如果此 `File` 对象是文件则返回 true，如果是目录则返回 false。\
  \ |\n| `String toString()` | 以字符串形式返回此文件或目录的路径。 |\n\n#### 使用 Paths 类创建文件\n\n你一开始可能会感到困惑的一点是\
  \ `Path` 对象是通过调用 `Paths` 类的静态方法创建的。`Path` 和 `Paths` 是两个不同的东西：`Path` 是一个接口，而 `Paths`\
  \ 是一个类。要创建一个 `Path` 对象，请使用静态类 `Paths` 的 `get` 方法，如下：\n\n```java\nPath p = Paths.get(\"\
  c:\\\\test.txt\");\n```\n\n这里的文件名是 `test.txt`，它位于 C: 盘的根目录下。\n\n与 `File` 对象一样，`Path`\
  \ 对象代表一个可能存在也可能不存在于硬盘上的文件。你可以像这样测试文件是否存在：\n\n```java\nPath p = Paths.get(path);\n\
  if (!p.exists())\n    System.out.println(\"The input file does not exist!\");\n\
  ```\n\n要创建一个新文件，使用 `createFile` 方法，如下：\n\n```java\nPath p = Paths.get(\"c:\\\\test.txt\"\
  );\ntry {\n    p.createFile();\n    System.out.println(\"File created!\");\n} catch\
  \ (Exception e) {\n    System.out.println (\"Error: \" + e.getMessage());\n}\n```\n\
  \n注意，如果无法创建文件，`createFile` 方法将抛出异常。该异常的 `getMessage` 方法会返回一个解释为何无法创建文件的消息。\n\n####\
  \ 获取目录内容\n\n`File` 类的弱点之一是它不能很好地处理大型目录。特别是像 `listFiles` 这样允许你访问目录内容的方法返回的是 `File`\
  \ 对象的数组。如果目录包含几十甚至几百个文件，这没问题，但如果目录包含成千上万甚至几万个文件呢？简而言之，`File` 类是不可扩展的。\n\n`Path`\
  \ 类通过允许通过 `DirectoryStream` 定义的流对象访问目录内容，弥补了这一缺陷。我将在第 8 卷第 2 章中详细介绍关于处理流的操作，但目前只需说明，流提供了一种逐个访问大量数据项的简单方法。你可以使用增强型\
  \ for 语句轻松地检索目录流中的项，如示例所示：\n\n```java\nPath c = Paths.get(\"C:\\\\\");\ntry {\n\
  \    DirectoryStream<Path> stream = c.newDirectoryStream();\n    for (Path entry:\
  \ stream)\n        System.out.println(entry.toString());\n} catch (Exception e)\
  \ {\n    System.out.println(\"Error: \" + e.getMessage());\n}\n```\n\n此示例显示了 `C:\\\
  ` 目录的内容列表，就像在命令提示符输入 `DIR C:\\` 一样。\n\n你可以通过更改 `try` 语句后的第一个语句，将前面的示例修改为仅列出文本文件（扩展名为\
  \ `.txt` 的文件）：\n\n```java\nDirectoryStream<Path> stream = c.newDirectoryStream(\"\
  *.txt\");\n```\n\n#### 使用文件访问者（File Visitor）遍历文件树\n\n在本章前面的“获取目录内容”节中，我提到使用 `File`\
  \ 类处理主目录的子目录需要复杂的递归编程。在 Java 1.7（及更高版本）中，你可以使用一项新功能，该功能可以为你完成编程中复杂的递归部分。它是通过*遍历*文件树来实现的——访问树中的每个文件，并调用你创建的特殊类（称为文件访问者）中定义的一个或多个方法。以下是这种魔法运作的基本细节：\n\
  \n**1. 创建一个文件访问者类，它继承自 FileVisitor 或更常见的 SimpleFileVisitor。**\n\n`SimpleFileVisitor`\
  \ 类定义了几个方法，这些方法会在文件树的每个文件处被调用，如表 1-5 所示。\n\n**表 1-5：SimpleFileVisitor 类**\n\n| 方法\
  \ | 说明 |\n| :--- | :--- |\n| `FileVisitResult visitFile(T file, BasicFileAttributes\
  \ attr)` | 文件树中的每个文件调用一次。 |\n| `FileVisitResult visitFileFailed(T file, IOException\
  \ e)` | 当文件无法访问时调用。 |\n| `FileVisitResult preVisitDirectory(T dir)` | 为文件树中的每个目录调用一次。在访问目录内文件之前调用。\
  \ |\n| `FileVisitResult preVisitDirectoryFailed(T dir, IOException e)` | 当目录无法访问时调用。\
  \ |\n| `FileVisitResult postVisitDirectory(T dir)` | 为文件树中的每个目录调用一次。在访问目录内所有文件后调用。\
  \ |\n\n**2. 在文件访问者中，重写 SimpleFileVisitor 类定义的一个或多个方法。**\n\n这些方法是你想要在遍历文件树时执行代码的地方。你至少需要重写表\
  \ 1-5 中列出的三种方法：\n\n- `visitFile`：用于文件树中的每个文件\n- `visitFileFailed`：用于文件无法访问时（通常由于权限问题）\n\
  - `preVisitDirectoryFailed`：用于目录无法访问时\n\n**3. 创建一个指示你想要遍历的文件树起点（即根目录）的 Path 对象。**\n\
  \n例如，如果你想访问 C 盘上的所有文件，此路径应指向 `C:\\`。\n\n**4. 调用静态 Files 类的 walkFileTree 方法来处理文件。**\n\
  \n该方法接受两个参数：`Path` 对象（标识文件树的根目录）和一个文件访问者类的实例。还是模糊吗？一个示例可以解释清楚。列表 1-1 显示了我能想出的简单的文件访问者示例。该程序列出了\
  \ `C:\\Windows\\System32` 中的所有文件。\n\n**列表 1-1：简单文件访问者**\n\n```java\nimport java.nio.file.*;\n\
  import java.io.*;\nimport java.nio.file.attribute.*;\n\npublic class FileVisitorDemo\n\
  {\n    public static void main(String[] args)\n    {\n        Path start = Paths.get(\"\
  c:\\\\Windows\\\\System32\");\n        MyFileVisitor visitor = new MyFileVisitor();\n\
  \        try {\n            Files.walkFileTree(start, visitor);\n        } catch\
  \ (Exception e) {\n            System.out.println(e.getMessage());\n        }\n\
  \    }\n\n    private static class MyFileVisitor extends SimpleFileVisitor<Path>\n\
  \    {\n        public FileVisitResult visitFile(Path file, BasicFileAttributes\
  \ attr)\n        {\n            System.out.println(file.toString());\n         \
  \   return FileVisitResult.CONTINUE;\n        }\n\n        public FileVisitResult\
  \ visitFileFailed(Path file, BasicFileAttributes attr)\n        {\n            System.out.println(file.toString()\
  \ + \" COULD NOT ACCESS!\");\n            return FileVisitResult.CONTINUE;\n   \
  \     }\n\n        public FileVisitResult preVisitDirectoryFailed(Path dir, IOException\
  \ e)\n        {\n            System.out.println(dir.toString() + \" COULD NOT ACCESS!\"\
  );\n            return FileVisitResult.CONTINUE;\n        }\n    }\n}\n```\n\n\n\
  \n\n\n```java\nreturn FileVisitResult.CONTINUE;\n}\n\n}\n```\n\n以下是该程序工作原理的亮点：\n\
  \n→ **9** 创建一个 `Path` 类的实例，从 `C:\\Windows\\System32\\` 开始遍历文件树。你可以用任何需要的目录来替换此路径。\n\
  \n→ **10** 创建一个 `MyFileVisitor` 类的实例，该类在程序的稍后部分定义（第 21 行）。\n\n→ **13** 使用第 10 行创建的\
  \ `MyFileVisitor` 对象，从 `start` 指定的目录开始遍历文件树。\n\n→ **21** 定义 `MyFileVisitor` 类，该类继承自\
  \ `SimpleFileVisitor` 类。`SimpleFileVisitor` 是一个泛型类，因此你必须指定一个类型。通常你指定指定 `Path` 类型，以便让\
  \ `SimpleFileVisitor` 处理 `Path` 对象。\n\n→ **23** 重写 `visitFile` 方法，该方法在遍历文件树时，每访问一个文件就会被调用一次。此方法简单地将文件名打印到控制台。在更实际的程序中，你会对文件执行一些更有意义的操作，例如复制文件或打开文件并读取其内容。\n\
  \n→ **27** 生成 `visitFile` 方法的返回值，其类型为 `FileVisitResult`。最常用的返回值是 `CONTINUE`，表示文件树遍历器应该继续处理文件。其他选项包括\
  \ `TERMINATE`、`SKIP_SIBLINGS` 和 `SKIP_SUBTREE`。\n\n→ **30** 重写 `visitFileFailed`\
  \ 方法，每当无法访问文件时，该方法就会被调用。在本程序中，`visitFileFailed` 方法简单地打印错误信息。\n\n→ **36** 重写 `preVisitDirectoryFailed`\
  \ 方法，每当无法访问目录时，该方法就会被调用。与 `visitFileFailed` 方法一样，`preVisitDirectoryFailed` 方法只是打印错误信息。\n\
  \n# 文件操作\n第 1 章 797\n\n![Image 113](img/index-821_1.jpg)\n\n## 本章内容\n- 了解 Java 流（Streams）\n\
  - 读取和写入文本流\n- 读取和写入二进制流\n\n# 文件流操作\n第 2 章\n\nI/O，I/O，我要去工作了。这首经典歌曲是这么唱的，它基本上概括了计算机的所有目的。没有\
  \ I/O（输入/输出），计算机以及运行在上面的程序都将毫无用处。\n\n要想象任何不进行某种形式 I/O 的有用计算机程序是很困难的。即使是书中介绍的第一个程序——经典的\
  \ `Hello, World!` 程序——也包含了 I/O；它在屏幕上显示了一条简单的消息。\n\n在本章中，你将了解到 Java 用于在程序中输入和输出数据的最基本的技术：流。在整本书中，你一直都在使用流。当你使用\
  \ `System.out.print` 或 `System.out.println` 方法在控制台上显示文本时，你实际上是在将数据发送到输出流；而当你使用 `Scanner`\
  \ 对象从 `System.in` 获取数据时，你正在从输入流读取数据。\n\n在本章中，你将基于已掌握的流 I/O 知识，学习如何使用它来读取和写入硬盘文件中的数据。\n\
  \n第 2 章 799\n\n## 理解流\n*流*（stream）简单来说就是程序与程序之间的字符流。流的另一端可以是任何可以接收或生成字符流的实体，包括控制台窗口、打印机、磁盘驱动器上的文件甚至是另一个程序。流并不知道你数据的结构或意义；流仅仅是一序列字符。在第\
  \ 8 册的后续章节中，你将了解到如何使用数据库和 XML 在更高层次上处理数据。\n\n你可以将 Java 流 I/O 世界大致分为两营：\n\n- **字符流（Character\
  \ streams）：** *字符流*用于读取和写入表示字符串的文本字符。你可以将字符流连接到文本文件，以便在硬盘上存储文本数据。通常，文本文件使用称为*分隔符*（delimiters）的特殊字符来分隔文件元素。例如：\n\
  \    - *逗号分隔文件*（comma-delimited file）使用逗号分隔各个数据字段。\n    - *制表符分隔文件*（tab-delimited\
  \ file）使用制表符分隔字段。\n  通常，你可以在文本编辑器中显示文本文件并理解其内容。\n\n- **二进制流（Binary streams）：** *二进制流*用于读取和写入表示原始数据类型的单个字节。你可以将二进制流连接到*二进制文件*（binary\
  \ file），以便在硬盘上存储二进制数据。二进制文件的内容对于读写它的程序来说完全有意义，但如果你尝试用文本编辑器打开二进制文件，其内容看起来就像是一堆乱码。\n\
  \n从概念上说，理解流如何工作最困难的部分是让你的大脑适应所有不同的类。Java 几乎有 100 个用于处理流的类。幸运的是，对于大多数文件 I/O 应用，你只需要了解其中少数几个。在本章的剩余部分中，我将为你介绍处理字符流和二进制流最重要的类。（如需查看文件\
  \ I/O 类的完整列表，请访问 `http://download.java.net/jdk9/docs/api` 并点击左上角包列表中的 `java.io`。）\n\
  \n800 第 8 册 文件与数据库\n\n## 读取字符流\n要通过字符流读取文本文件，你通常会用到以下类：\n\n- **File：** `File` 类（我将在第\
  \ 8 册中介绍）代表硬盘上的一个文件。在 I/O 应用中，`File` 类的主要目的是标识要读取或写入的文件。\n- **FileReader：** `FileReader`\
  \ 类提供了从源自文件的字符流中读取数据的基本方法。它让你逐一个字符读取数据。通常，你不会直接使用这个类。相反，你会创建一个 `FileReader` 对象来连接文件，然后将其传递给\
  \ `BufferedReader` 的构造函数，以提供更高效的访问。\n- **BufferedReader：** 该类封装了 `FileReader` 以提供更高效的输入。它为输入流添加了*缓冲区*（buffer），允许分块地从硬盘读取数据而不是逐字节读取，这可以极大提高性能。`BufferedReader`\
  \ 类允许你逐字符或逐行读取数据。在大多数程序中，你会逐行读取数据，然后使用 Java 的字符串处理功能将该行拆分为各个字段。\n\n表 2-1 列出了这些类最重要的构造函数和方法。\n\
  \n**表 2-1**\n**BufferedReader 和 FileReader 类**\n\n构造函数 | 描述\n`BufferedReader(Reader\
  \ in)` 从任何扩展 `Reader` 类的对象创建缓冲器。通常你向此构造函数传递一个 `FileReader` 对象。\n`FileReader(File\
  \ file)` 从指定的 `File` 对象创建文件读取器。如果文件不存在或目录而非文件，则抛出 `FileNotFoundException`。\n`FileReader(String\
  \ path)` 从指定的路径名创建文件读取器。如果文件不存在或目录而非文件，则抛出 `FileNotFoundException`。\n\n\n\n\n读取整行并将其作为字符串返回。如果到达文件末尾，该方法返回\
  \ `null`。它会抛出 `IOException`。\n\n```java\nvoid skip(long num)\n```\n\n`skip()` 跳过指定数量的字符。\n\
  \n在接下来的章节中，你将了解到如何读取一个名为 `movies.txt` 的文件，该文件包含十行，每行代表我喜部电影。文件的每行都包含电影标题、一个制表符、电影上映年份、另一个制表符以及我为该电影支付的价格。以下是文件的内容：\n\
  \nIt's a Wonderful Life→1946→14.95\nYoung Frankenstein→1974→16.95\nStar Wars→1977→17.95\n\
  The Princess Bride→1987→16.95\nGlory→1989→14.95\nThe Game→1997→14.95\nShakespeare\
  \ in Love→1998→19.95\nZombieland→2009→18.95\nThe King's Speech→2010→17.85\nStar\
  \ Trek: Into Darkness→2013→19.95\n\n（在此列表中，箭头代表制表符字符。）在本章稍后的部分，我将向你展示一个向此文件写入数据的程序。\n\
  \n如果你用文本编辑器创建此文件，请确保你的文本编辑器能够正确保留制表符。\n\n## 创建 BufferedReader\n\n将字符流连接到文件的标准方法是为该文件创建一个\
  \ `File` 对象，并使用第 8 卷第 1 章中介绍的技巧之一。然后，你可以调用 `FileReader` 构造函数来创建一个 `FileReader` 对象，并将此对象传递给\
  \ `BufferedReader` 构造函数以创建一个 `BufferedReader` 对象，例如所示：\n\n802 第 8 卷 **文件与数据库**\n\
  \n```java\nFile f = new File(\"movies.txt\");\nBufferedReader in = new BufferedReader(\n\
  \    new FileReader(f));\n```\n\n这里创建了一个 `BufferedReader` 对象来读取 `movies.txt` 文件。\n\
  \n## 从字符流中读取\n\n### 使用文件流的操作\n\n要从文件中读取一行，你将使用 `BufferedReader` 类的 `readLine` 方法。当到达文件末尾时，该方法返回\
  \ `null`。因此，在 `while` 循环中测试 `readLine` 方法返回的字符串以处理文件中的所有行是常见的做法。\n\n这段代码段从文件中读取每一行并将其打印到控制台：\n\
  \n```java\nString line = in.readLine();\nwhile (line != null)\n{\n    System.out.println(line);\n\
  \    line = in.readLine();\n}\n```\n\n从文件中读取一行数据后，你可以使用 Java 的字符串处理功能从该行中提取出各个数据位。特别是，你可以使用\
  \ `split` 方法将该行分割为由制表符分隔的各个字符串。然后，你可以使用相应的解析方法（如 `parseInt` 和 `parseDouble`）将每个字符串转换为其正确的数据类型。\n\
  \n这是一个例程，将从 `movies.txt` 文件中读取的行转换为标题（字符串）、年份（int）和价格（double）：\n\n```java\nString[]\
  \ data = line.split(\"\\t\");\nString title = data[0];\nint year = Integer.parseInt(data[1]);\n\
  double price = Double.parseDouble(data[2]);\n```\n\n读取完整个文件后，你可以调用 `close` 方法关闭流，如下所示：\n\
  \n```java\nin.close();\n```\n\n第 2 章 **使用文件流的操作** 803\n\n## 读取 movies.txt 文件\n\n\
  列表 2-1 显示了一个完整的、尽管是简单的程序，该程序读取 `movies.txt` 文件并将文件内容打印到控制台。\n\n**列表 2-1：** **从文本文件中读取**\n\
  \n```java\nimport java.io.*;\nimport java.text.NumberFormat;\n\npublic class ReadFile\n\
  {\n    public static void main(String[] args)\n    {\n        NumberFormat cf =\
  \ NumberFormat.getCurrencyInstance();\n        BufferedReader in = getReader(\"\
  movies.txt\");\n\n        Movie movie = readMovie(in);\n        while (movie !=\
  \ null)\n        {\n            String msg = Integer.toString(movie.year);\n   \
  \         msg += \": \" + movie.title;\n            msg += \" (\" + cf.format(movie.price)\
  \ + \")\";\n            System.out.println(msg);\n            movie = readMovie(in);\n\
  \        }\n    }\n\n    private static BufferedReader getReader(String name)\n\
  \    {\n        BufferedReader in = null;\n        try\n        {\n            File\
  \ file = new File(name);\n            in = new BufferedReader(\n               \
  \ new FileReader(file) );\n        }\n        catch (FileNotFoundException e)\n\
  \        {\n            System.out.println(\"The file doesn't exist.\");\n     \
  \       System.exit(0);\n        }\n        return in;\n    }\n\n    private static\
  \ Movie readMovie(BufferedReader in)\n    {\n        String title;\n        int\
  \ year;\n        double price;\n        String line = \"\";\n        String[] data;\n\
  \        try\n        {\n            line = in.readLine();\n        }\n        catch\
  \ (IOException e)\n        {\n            System.out.println(\"I/O Error\");\n \
  \           System.exit(0);\n        }\n        if (line == null)\n            return\
  \ null;\n        else\n        {\n            data = line.split(\"\\t\");\n    \
  \        title = data[0];\n            year = Integer.parseInt(data[1]);\n     \
  \       price = Double.parseDouble(data[2]);\n            return new Movie(title,\
  \ year, price);\n        }\n    }\n\n    private static class Movie\n    {\n   \
  \     public String title;\n        public int year;\n        public double price;\n\
  \n        public Movie(String title, int year, double price)\n        {\n      \
  \      this.title = title;\n            this.year = year;\n            this.price\
  \ = price;\n        }\n    }\n}\n```\n\n如果你运行此程序，控制台将显示以下输出：\n1946: It's a Wonderful\
  \ Life ($14.95\n1974: Young Frankenstein $16.95\n1977: Star Wars $17.95\n1987: The\
  \ Princess Bride $16.95\n1989: Glory $14.95\n1997: The Game $14.95\n1998: Shakespeare\
  \ in Love $19.95\n2009: Zombieland $18.95\n2010: The King's Speech $17.85\n2013:\
  \ Star Trek: Into Darkness $19.95\n\n\n\n\n### `BufferedWriter`: 此类连接到 `FileWriter`\
  \ 并提供输出缓冲。如果没有缓冲区，数据将以一个字符为单位写入硬盘。此类允许程序在缓冲区中累积数据，并仅在缓冲区满或程序请求写入数据时才将数据写入。\n\n###\
  \ `PrintWriter`: 此类连接到一个 `Writer`，该 `Writer` 可以是 `BufferedWriter`、`FileWriter` 或任何扩展了抽象\
  \ `Writer` 类的对象。大多数情况下，你会将此类连接到 `BufferedWriter`。在向文件写入数据时，`PrintWriter` 类是这些类中你通常会使用的类。表\
  \ 2-2 列出了该类最重要的构造函数和方法。\n\n#### 表 2-2：`PrintWriter, BufferedWriter, and and FileWriter`\
  \ 类\n\n| 构造函数 | 说明 |\n| :--- | :--- |\n| `PrintWriter(Writer out)` | 为指定的输出写入器创建一个打印写入器。\
  \ |\n| `PrintWriter(Writer out, boolean flush)` | 为指定的输出写入器创建一个打印写入器。如果第二个 `boolean`\
  \ 参数为真`，则每当调用 `println` 方法时，缓冲区都会自动刷新。 |\n| `BufferedWriter(Writer out)` | 从指定的写入器创建一个缓冲写入器。通常，你会向此构造函数传递一个\
  \ `FileWriter` 对象。 |\n| `FileWriter(File file)` | 从指定的 `File` 对象创建一个文件写入器，如果发生错误，则抛出\
  \ `IOException`。 |\n| `FileWriter(File file, boolean append)` | 从指定的 `File` 对象创建一个文件写入器，如果发生错误，则抛出\
  \ `IOException`。如果第二个参数为真`，如果文件已存在，则数据将添加到文件末尾。 |\n| `FileWriter(String path)` |\
  \ 从指定的路径创建一个文件写入器，如果发生错误，则抛出 `IOException`。 |\n| `FileWriter(String path, boolean\
  \ append)` | 从指定的路径创建一个文件写入器，如果发生错误，则抛出 `IOException`。如果第二个参数为真`，如果文件已存在，则数据将添加到文件末尾。\
  \ |\n\n#### `PrintWriter` 方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `void close()` |\
  \ 关闭文件。 |\n| `void flush()` | 将缓冲区的内容写入硬盘。 |\n| `int read()` | 从文件中读取单个字符并作为整数返回。如果到达文件末尾，则返回\
  \ –1。它抛出 `IOException`。 |\n| `void print(value)` | 写入值，值可以是任何基本类型或任何对象。如果值是一个对象，则调用该对象的\
  \ `toString()` 方法。 |\n| `void println(value)` | 写入值，值可以是任何基本类型或任何对象。如果值是一个对象，则调用该对象的\
  \ `toString()` 方法。在值之后写入一个换行符。 |\n\n### 将 `PrintWriter` 连接到文本文件\n\n要将字符流连接到输出文件，你首先需要为该文件创建一个\
  \ `File` 对象，正如我在第 8 卷第 1 章中所描述的那样。然后你调用 `PrintWriter` 构造函数创建一个 `PrintWriter` 对象，你可以用它来写入文件。此构造函数包装了一个\
  \ `BufferedWriter` 对象，而 `BufferedWriter` 又包装了一个 `FileWriter` 对象，如下：\n\n```java\n\
  File file = new File(\"movies.txt\");\nPrintWriter out = new PrintWriter(\n    new\
  \ BufferedWriter(\n        new FileWriter(file)\n    ) );\n```\n\n如果你觉得这种安排有点困惑，那很好！这让我感觉好受一点，因为我也觉得有点困惑。这里的基本思想是，每个类都为它包装的类增加了一种功能。最底层是\
  \ `FileWriter` 类，它具有向文件写入字符的能力。`BufferedWriter` 类在其中引入了缓冲，将数据保存在缓冲区中，直到认为一次性大批量写入文件是有意义的为止。`PrintWriter`\
  \ 类增加了基本的格式化能力，例如在每行的末尾添加行结束符，并将基本类型转换为字符串。\n\n`FileWriter` 和 `PrintWriter` 类都带有一个可选的\
  \ `boolean` 参数，你可以用它为文件流添加额外功能。如果你在 `FileWriter` 构造函数中指定为 `true`，如果文件已存在，则追加该文件。*追加*简单意味着文件中的任何数据都会被保留；你在程序中写入文件的数据只需被添加到文件的末尾。这里有一个向其文件追加数据的\
  \ `PrintWriter` 构造函数：\n\n```java\nFile file = new File(\"movies.txt\");\nPrintWriter\
  \ out = new PrintWriter(\n    new BufferedWriter(\n        new FileWriter(file,\
  \ true)\n    )); // append mode\n```\n\n如果你用 `false` 代替 `true`，或者漏掉此参数，现有的文件将被删除，其数据也会丢失。\n\
  \n`PrintWriter` 类中的 `boolean` 参数的后果没有那么严重。它只是告诉 `PrintWriter` 类，每当你使用 `println`\
  \ 方法写入一行数据时，它应该告诉 `BufferedWriter` 类刷新其缓冲区。虽然这个选项可能会略微降低你程序的效率，但它也让程序更可靠一点，因为如果程序或整个计算机在未写入的数据仍在缓冲区中时崩溃，它减少了丢失数据的概率。\n\
  \n遗憾的是，指定此选项的代码看起来有点笨拙，因为 `BufferedWriter` 和 `FileWriter` 类的构造函数是嵌套的：\n\n```java\n\
  File file = new File(\"movies.txt\");\nPrintWriter out = new PrintWriter(\n    new\
  \ BufferedWriter(\n        new FileWriter(file)\n    ), true); //// mode flush\n\
  ```\n\n如果这些嵌套的构造函数让你头晕，你完全单独构造每个对象并使用变量来跟踪它们。这里有一个这样做的示例，并且开启了 `FileWriter` 的追加模式和\
  \ `PrintWriter` 的刷新模式：\n\n```java\nFileWriter fw = new FileWriter(file, true);\n\
  BufferedWriter bw = new BufferedWriter(fw);\nPrintWriter out = new PrintWriter(bw,\
  \ true);\n```\n\n如果你觉得这种编码技术更容易理解，请尽管使用。\n\n### 写入字符流\n\n在你成功将字符流连接到文件后，向其写入数据就像向控制台写入一样简单。你只需使用\
  \ `print` 和 `println` 方法，就像向控制台写入一样。一个微小的复杂之处在于，如果你以分隔符格式写入数据，你必须包含写入分隔符的语句。假设（例如）要写入文本文件的电影标题和年份存储在名为\
  \ `title` 和 `year` 的 `String` 变量中。这段代码使用制表符写入这些字段：\n\n```java\nSystem.out.print(title);\n\
  System.out.print(\"\\t\");\nSystem.out.println(year);\n```\n\n这里最后一个写入的项目是用 `println`\
  \ 方法而不是 `print` 方法写入的。这结束了当前行。\n\n如果你喜欢更高效一点，可以构建一个代表整行的字符串，然后一次写入该行，如下：\n\n```java\n\
  String line = title + \"\\t\" + year;\nSystem.out.println(line);\n```\n\n这种方法比之前的版本高效一点，但并没有你想的那么大。在大多数情况下，`BufferedWriter`\
  \ 仍然会在调用 `println` 方法时将你的文本留在缓冲区中。\n\n如果你在创建 `PrintWriter` 对象时没有指定刷新选项，你仍然可以通过调用\
  \ `flush` 方法定期将缓冲区中的任何数据写入硬盘，如下：\n\n```java\nout.flush();\n```\n\n此外，当你完成向文件写入数据后，可以调用\
  \ `close` 方法来关闭文件，如下：\n\n```java\nout.close();\n```\n\n### 写入 movies.txt 文件\n\n\
  列表 2-2 显示了一个向文本文件写入行的完整程序。写入的数据来自一个硬编码在文件中的数组，但你可以轻松地...\n\n\n\n\n想象如何通过提示控制台输入或在\
  \ Swing 应用中使用文本字段从用户处获取数据。（有关 Swing 的完整内容，请参阅第 6 章。）\n\n### 列表 2-2：写入文本文件\n\n```java\n\
  import java.io.*;\n\npublic class WriteFile {\n\n    // Working with File Streams\n\
  \    public static void main(String[] args)\n    {\n        Movie[] movies = getMovies();\n\
  \        PrintWriter out = openWriter(\"movies2.txt\");\n        for (Movie m :\
  \ movies)\n            writeMovie(m, out);\n        out.close();\n    }\n\n    private\
  \ static Movie[] getMovies()\n    {\n        Movie[] movies = new Movie[10];\n \
  \       movies[0] = new Movie(\"It's a Wonderful Life\", 1946, 14.95);\n       \
  \ movies[1] = new Movie(\"Young Frankenstein\", 1974, 16.95);\n        movies[2]\
  \ = new Movie(\"Star Wars\", 1977, 17.95);\n        movies[3] = new Movie(\"The\
  \ Princess Bride\", 1987, 16.95);\n        movies[4] = new Movie(\"Glory\", 1989,\
  \ 14.95);\n        movies[5] = new Movie(\"The Game\", 1997, 14.95);\n        movies[6]\
  \ = new Movie(\"Shakespeare in Love\", 1998, 19.95);\n        movies[7] = new Movie(\"\
  Zombieland\", 1997, 18.95);\n        movies[8] = new Movie(\"The King's Speech\"\
  , 1997, 19.95);\n        movies[9] = new Movie(\"Star Trek Into Darkness\", 1997,\
  \ 19.95);\n        return movies;\n    }\n\n    private static PrintWriter openWriter(String\
  \ name)\n    {\n        try {\n            File file = new File(name);\n       \
  \     PrintWriter out = new PrintWriter(\n                new BufferedWriter(\n\
  \                    new FileWriter(file) ), true );\n            return out;\n\
