  );\n            System.exit(0);\n        }\n        return null;\n    }\n\n    private\
  \ static void writeMovie(Movie m, PrintWriter out)\n    {\n        String line =\
  \ m.title;\n        line += \"\\t\" + Integer.toString(m.year);\n        line +=\
  \ \"\\t\" + Double.toString(m.price);\n        out.println(line);\n    }\n\n   \
  \ private static class Movie {\n        public String title;\n        public int\
  \ year;\n        public double price;\n        public Movie(String title, int year,\
  \ double price) {\n            this.title = title;\n            this.year = year;\n\
  \            this.price = price;\n        }\n    }\n}\n```\n\n因为此程序中的所有编码元素已经在本章中解释过，接下来的段落仅为程序的主要部分提供路线图：\n\
  \n- `main` 方法开始时调用一个名为 `getMovies()` 的方法，该方法返回一个 `Movie` 对象的数组，用于写入文件。（`Movie` 类在程序稍后被定义为内部类。）然后它调用\
  \ `openWriter()`，该方法创建了一个 `PrintWriter` 对象，程序可以使用它向文件写入数据。接下来，它使用增强型 for 循环对数组中的每部电影调用\
  \ `writeMovie` 方法。该方法接受一个包含要写入电影的 `Movie` 对象和一个用于将电影写入到目标位置的 `PrintWriter` 对象。最后，关闭了\
  \ `PrintWriter`。\n\n- `getMovies()` 方法返回一个 `Movie` 对象的数组，这些对象会被写入文件。在实际程序中，你可能会在该方法中执行除硬编码电影信息以外的某些操作。例如，你可能会提示用户输入数据，或者使用\
  \ Swing 框架来获取数据。\n\n- `openWriter()` 方法为作为参数传递给它的文件名创建一个 `PrintWriter` 对象。`PrintWriter`\
  \ 使用缓冲区，该缓冲区在每次调用 `println()` 时都会刷新。\n\n- `writeMovie()` 方法接受两个参数：一个要写入的 `Movie`\
  \ 对象和一个应该将电影写入到其位置的 `PrintWriter` 对象。它创建一个包含标题、制表符、年份、另一个制表符和价格的字符串；然后将该字符串写入文件。\n\
  \n- `Movie` 类是一个定义电影对象的内部类。该类简单地由三个公共字段（`title`、`year` 和 `price`）以及一个初始化这些字段的构造函数组成。\n\
  \n### 读取二进制流\n\n二进制流用于以原始二进制格式而非文本格式存储数据，它们读取起来比字符流要困难一点。读取二进制流时需要越过的最大障碍是，你需要确切知道写入文件的每个项目的具体类型。如果文件中包含任何错误数据，程序将无法工作，因此你需要确保文件包含你的程序预期的数据。\n\
  \n要读取二进制文件，你通常与以下类一起工作：\n\n- **File**: 再次，你使用 `File` 类来表示文件本身。\n- **FileInputStream**:\
  \ `FileInputStream` 是连接输入流与文件的媒介。\n- **BufferedInputStream**: `BufferedInputStream`\
  \ 为流添加了缓冲区，从而提高了流的效率。\n- **DataInputStream**: `DataInputStream` 是你实际用于从流中读取数据的类。其他类一次只读取一个字节。而此类知道如何读取基本类型，包括原始数据类型。\n\
  \n#### 使用文件流\n\n如果你不熟悉 UTF，它是在文本文件中编码字符的标准化方法。最常用的 UTF 形式是 UTF-8（它将每个字符编码为单字节）和\
  \ UTF-16（它将每个字符编码为 2 字节序列）。要获取更多信息，请使用你喜爱的搜索引擎搜索 UTF。\n\n#### 创建 DataInputStream\n\
  \n要从二进制文件读取数据，你希望将 DataInputStream 对象连接到\n\n\n\n\n一个输入文件。为了做到这一点，你使用一个 `File` 对象来表示文件，使用一个\
  \ `FileInputStream` 对象将文件作为输入流，使用一个 `BufferedInputStream` 对象在其中添加缓冲功能，最后使用一个 `DataInputStream`\
  \ 对象来提供读取各种数据类型的方法。这个“大怪兽”的构造函数看起来如下：\n\n```java\nFile file = new File(\"movies.dat\"\
  );\nDataInputStream in = new DataInputStream(\n    new BufferedInputStream(\n  \
  \      new FileInputStream(file) ) );\n```\n\n如果这种嵌套让你感到恶心，你可以使用下面的格式：\n\n```java\n\
  File file = new File(\"movies.dat\");\nFileInputStream fs = new FileInputStream(file);\n\
  BufferedInputStream bs = new BufferedInputStream(fs);\nDataInputStream in = new\
  \ DataInputStream(bs);\n```\n\n无论采用哪种方式，效果都是相同的。\n\n### 从数据输入流中读取\n\n对于二进制文件，你不需要将整行内容读入程序并将其解析为各个字段。相反，你使用\
  \ `DataInputStream` 类中的各种 `read` 方法来逐个读取字段。为了做到这一点，你必须知道数据值在文件中出现的确切顺序。\n\n下面是一段读取单个电影信息并将数据存储在变量中的代码：\n\
  \n```java\nString title = in.readUTF();\nint year = in.readInt();\ndouble price\
  \ = in.readDouble();\n```\n\n所有的 `read` 方法在到达文件末尾时都会抛出 `EOFException`，在发生 I/O 错误时抛出\
  \ `IOException`，因此你需要在捕获这些异常的 `try/catch` 块中调用这些方法。`readUTF` 方法还会抛出 `UTFDataFormatException`，但该异常是\
  \ `IOException` 的一种类型，所以你可能不需要单独捕获它。\n\n`read` 方法通常用于 `while` 循环中以读取文件的所有数据。当到达文件末尾时，会抛出\
  \ `EOFException`。然后你可以捕获此异常并停止循环。做到这一点的一种方法是使用布尔变量来控制循环，如下：\n\n```java\nboolean\
  \ eof = false;\nwhile (!eof) {\n    try {\n        String title = in.readUTF();\n\
  \        int year = in.readInt();\n        double price = in.readDouble();\n   \
  \     // 在这里对数据进行操作\n    } catch (EOFException e) {\n        eof = true;\n    }\
  \ catch (IOException e) {\n        System.out.println(\"An I/O error \" + \"has\
  \ occurred!\");\n        System.exit(0);\n    }\n}\n```\n\n在这里，当抛出 `EOFException`\
  \ 时，布尔变量 `eof` 被设置为 `true`，只要 `eof` 为 `false`，循环就会继续执行。\n\n从文件中读取一行数据后，你可以使用 Java\
  \ 的字符串处理功能从行中提取各个数据位。特别是，你可以使用 `split` 方法将行分离为制表符分隔的各个字符串。然后，你可以使用相应的 `parse` 方法将每个字符串解析为其正确的数据类型。\n\
  \n下面是将从 `movies.txt` 文件读取的一行数据转换为标题（字符串）、年份（int）和价格（double）的例程：\n\n```java\nString[]\
  \ data = line.split(\"\\t\");\nString title = data[0];\nint year = Integer.parseInt(data[1]);\n\
  double price = Double.parseDouble(data[2]);\n```\n\n在读取完整个文件后，你可以调用 `close` 方法关闭流，如下：\n\
  \n```java\nin.close();\n```\n\n此方法也会抛出 `IOException`，因此你想要将其放在 `try/catch` 块中。\n\
  \n### 读取 movies.dat 文件\n\n现在你已经了解了从二进制文件中读取数据各个各个独立元素，列表 2-3 演示了一个使用这些技术的完整程序。该程序读取\
  \ `movies.dat` 文件；为每个标题、年份和价格值创建一个 `Movie` 对象；并为每部电影在控制台上打印一行。如果你运行此程序，输出结果与本章稍之前“读取\
  \ movies.txt 文件”部分中介绍的文本版本的输出完全相同。（注意，在运行此程序之前，你必须先创建 `movies.dat` 文件。创建 `movies.dat`\
  \ 文件的程序在本章稍后的列表 2-4 中。）\n\n#### 列表 2-3：从二进制文件读取\n\n```java\nimport java.io.*;\n\
  import java.text.NumberFormat;\n\npublic class ReadBinaryFile {\n    public static\
  \ void main(String[] args) {\n        NumberFormat cf = NumberFormat.getCurrencyInstance();\n\
  \        // (续)\n        DataInputStream in = getStream(\"movies.dat\");\n     \
  \   boolean eof = false;\n        while (!eof) {\n            Movie movie = readMovie(in);\n\
  \            if (movie == null)\n                eof = true;\n            else {\n\
  \                String msg = Integer.toString(movie.year);\n                msg\
  \ += \": \" + movie.title;\n                msg += \" (\" + cf.format(movie.price)\
  \ + \")\";\n                System.out.println(msg);\n            }\n        }\n\
  \        closeFile(in);\n    }\n\n    private static DataInputStream getStream(String\
  \ name) {\n        DataInputStream in = null;\n        try {\n            File file\
  \ = new File(name);\n            in = new DataInputStream(\n                new\
  \ BufferedInputStream(\n                    new FileInputStream(file) ) );\n   \
  \     } catch (FileNotFoundException e) {\n            System.out.println(\"The\
  \ file doesn't exist.\");\n            System.exit(0);\n        }\n        return\
  \ in;\n    }\n\n    private static Movie readMovie(DataInputStream in) {\n     \
  \   String title = \"\";\n        int year = 0;\n        double price = 0.0;\n \
  \       try {\n            title = in.readUTF();\n            year = in.readInt();\n\
  \            price = in.readDouble();\n        } catch (EOFException e) {\n    \
  \        return null;\n        } catch (IOException e) {\n            System.out.println(\"\
  I/O Error\");\n            System.exit(0);\n        }\n        return new Movie(title,\
  \ year, price);\n    }\n\n    private static void closeFile(DataInputStream in)\
  \ {\n        try {\n            in.close();\n        } catch (IOException e) {\n\
  \            System.out.println(\"I/O Error file.\");\n        }\n    }\n\n    private\
  \ static class Movie {\n        public String title;\n        public int year;\n\
  \        public double price;\n\n        public Movie(String title, int year, double\
  \ price) {\n            this.title = title;\n            this.year = year;\n   \
  \         this.price = price;\n        }\n    }\n}\n```\n\n接下来的段落描述了程序中每个方法的作用：\n\
  \n- `main` 方法被刻意保持简单，以便它能够专注于控制程序的流，而不是执行访问文件的细节工作。因此，它调用 `getStream` 方法来获取一个用于读取文件的数据流对象。然后它使用\
  \ `while` 循环调用 `readMovie` 方法来获取一个电影对象。如果 Movie 对象不空，则将电影数据打印到控制台上。最后，当循环结束时，会调用\
  \ `closeFile` 方法关闭文件。\n- `getStream` 方法为作为参数传递的文件名创建一个 `DataInputStream` 对象。如果抛出任何异常，程序将退出。\n\
  - `readMovie` 方法读取单部电影的数据并创建一个 `Movie` 对象。如果到达文件末尾，该方法将返回 `null`。\n- `closeFile`\
  \ 方法关闭输入流。\n- 像本章中的其他程序一样，`Movie` 类被定义为 `private` 内部类。\n\n### 写入二进制流\n\n要向二进制文件写入数据，你使用以下类：\n\
  \n- `FileOutputStream`：`FileOutputStream` 类连接到 `File` 对象并创建一个可以写入文件的输出流。然而，它的能力是有限的，因为它只能向文件写入原始字节。也就是说，它不知道如何写入如\
  \ int、double 或字符串。\n- `BufferedOutputStream`：该类连接到 `FileOutputStream` 并添加输出缓冲。\n\
  - `DataOutputStream`：该类为流添加了写入原始数据类型和字符串的能力。\n\n表格 2-4 列出了这些类的本质构造函数和方法。\n\n\n\n\
  \n`BufferedIOutputStream(OutputStream out)`\n\n为指定的流创建一个缓冲输出流。\n\n通常，你会向此构造函数传递一个\
  \ `FileOutputStream` 对象。\n\n## 操作文件流\n\n`FileOutputStream(File file)`\n\n从文件创建一个文件写入器。如果发生错误，将抛出\
  \ `FileNotFoundException`。\n\n`FileOutputStream(File file, boolean append)`\n\n\
  从文件创建一个文件写入器。如果发生错误，将抛出 `FileNotFoundException`。如果第二个参数为 true，且文件已存在，则数据将添加到文件末尾。\n\
  \n`FileOutputStream(String path)`\n\n从指定的路径创建一个文件写入器。如果发生错误，将抛出 `FileNotFoundException`。\n\
  \n`FileOutputStream(String path, boolean append)`\n\n从指定的路径创建一个文件写入器。如果发生错误，将抛出\
  \ `FileNotFoundException`。如果第二个参数为 true，且文件已存在，则数据将添加到文件末尾。\n\n### DataInputStream\
  \ 方法\n\n#### 描述\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void close()` | 关闭文件。 |\n| `void\
  \ flush()` | 将缓冲区的内容写入硬盘。 |\n| `int size()` | 返回写入文件的字节数。 |\n| `void writeBoolean(boolean\
  \ value)` | 向输出流写入一个布尔值。会抛出 `IOException`。 |\n| `void writeByte(byte value)` | 向输出流写入一个字节值。会抛出\
  \ `IOException`。 |\n| `void writeChar(char value)` | 向输出流写入一个字符。会抛出 `IOException`。\
  \ |\n| `void writeDouble(double value)` | 向输出流写入一个双精度浮值。会抛出 `IOException`。 |\n|\
  \ `void writeFloat(float value)` | 向输出流写入一个浮点型值。会抛出 `IOException`。 |\n| `void writeInt(int\
  \ value)` | 向输出流写入一个整数值。会抛出 `IOException`。 |\n| `void writeLong(long value)` | 向输出流写入一个长型值。会抛出\
  \ `IOException`。 |\n| `void writeShort(short value)` | 向输出流写入一个短型值。会抛出 `IOException`。\
  \ |\n| `void writeUTF(String value)` | 向输出流写入以 UTF 格式存储的字符串。会抛出 `EOFException`、`IOException`\
  \ 和 `UTFDataFormatException` |\n\n## 创建一个 DataOutputStream\n\n创建一个 `DataOutputStream`\
  \ 对象需要另一个那种疯狂的嵌套构造函数：\n\n```java\nFile file = new File(name);\nDataOutputStream\
  \ out = new DataOutputStream(\n  new BufferedOutputStream(\n    new FileOutputStream(file)\
  \ ) );\n```\n\n如果你愿意，可以像这样解开构造函数：\n\n```java\nFile file = new File(name);\nFileOutputStream\
  \ fos = new FileOutputStream(file);\nBufferedOutputStream bos = new BufferedOutputStream(fos);\n\
  DataOutputStream out = new DataOutputStream(bos);\n```\n\n`FileOutputStream` 类有一个可选的\
  \ `boolean` 参数，你可以用它来指示如果文件存在则进行追加。要使用此功能，可以按如下方式调用构造函数：\n\n```java\nFile file =\
  \ new File(name);\nDataOutputStream out = new DataOutputStream(\n  new BufferedOutputStream(\n\
  \    new FileOutputStream(file, true) ) );\n```\n\n如果你指定 `false` 而不是 `true` 或省略该参数，则现有文件将被删除，其数据也会丢失。\n\
  \n## 写入二进制流\n\n在成功将 `DataOutputStream` 连接到文件后，向其写入数据只需调用各种 `write` 方法将不同类型的数据写入文件即可。以下代码将一个\
  \ `Movie` 对象的数据写入文件：\n\n```java\nout.writeUTF(movie.title);\nout.writeInt(movie.year);\n\
  out.writeDouble(movie.price);\n```\n\n这些方法理然会抛出 `IOException`。因此，你必须将它们封装在 `try/catch`\
  \ 块中。\n\n如果你在流中包含了 `BufferedOutputStream` 类，它会在缓冲区中累积数据，直到它决定将数据写入硬盘为止。如果你需要，可以通过调用\
  \ `flush` 方法强制将缓冲区写入硬盘，如下所示：\n\n```java\nout.flush();\n```\n\n此外，当你完成向文件写入数据时，调用\
  \ `close` 方法关闭文件，如下所示：\n\n```java\nout.close();\n```\n\n`flush` 和 `close` 方法也会抛出\
  \ `IOException`，因此你需要一个 `try/catch` 块来捕获异常。\n\n## 写入 movies.dat 文件\n\n列表 2-4 展示了一个程序，该程序从一个\
  \ `Movie` 对象数组写入 `movies.dat` 文件，这些对象的值是硬编码在程序中的。\n\n**列表 2-4: 写入二进制文件**\n\n```java\n\
  import java.io.*;\n\npublic class WriteBinaryFile\n{\n    public static void main(String[]\
  \ args) {\n        Movie[] movies = getMovies();\n        DataOutputStream out =\
  \ openOutputStream(\"movies.dat\");\n        for (Movie m : movies)\n          \
  \  writeMovie(m, out);\n        closeFile(out);\n    }\n\n    private static Movie[]\
  \ getMovies() {\n        Movie[] movies = new Movie[10];\n        movies[0] = new\
  \ Movie(\"It's a Wonderful Life\", 1946, 14.95);\n        movies[1] = new Movie(\"\
  Young Frankenstein\", 1974, 16.95);\n        movies[2] = new Movie(\"Star Wars\"\
  , 1977, 17.95);\n        movies[3] = new Movie(\"The Princess Bride\", 1987, 16.95);\n\
  \        movies[4] = new Movie(\"Glory\", 1989, 14.95);\n        movies[5] = new\
  \ Movie(\"The Game\", 1997, 14.95);\n        movies[6] = new Movie(\"Shakespeare\
  \ in Love\", 1998, 14.95);\n        movies[7] = new Movie(\"Zombieland\", 2009,\
  \ 17.95);\n        movies[8] = new Movie(\"The King's Speech\", 2010, 17.95);\n\
  \        movies[9] = new Movie(\"Star Trek Into Darkness\", 2013, 17.95);\n    \
  \    return movies;\n    }\n\n    private static DataOutputStream openOutputStream(String\
  \ name) {\n        DataOutputStream out = null;\n        try {\n            File\
  \ file = new File(name);\n            out = new DataOutputStream(\n            \
  \  new BufferedOutputStream(\n                    new FileOutputStream(file) ) );\n\
  \            return out;\n        } catch (IOException e) {\n            System.out.println(\"\
  I/O opening file.\");\n            System.exit(0);\n        }\n    }\n\n    private\
  \ static void writeMovie(Movie m, DataOutputStream out) {\n        try {\n     \
  \       out.writeUTF(m.title);\n            out.writeInt(m.year);\n            out.writeDouble(m.price);\n\
  \        } catch (IOException e) {\n            System.out.println(\"I/O writing\
  \ data.\");\n            System.exit(0);\n        }\n    }\n\n    private static\
  \ void closeFile(DataOutputStream out) {\n        try {\n            out.close();\n\
  \        } catch (IOException e) {\n            System.out.println(\"I/O closing\
  \ file.\");\n            System.exit(0);\n        }\n    }\n\n    private static\
  \ class Movie {\n        public String title;\n        public int year;\n      \
  \  public double price;\n\n        public Movie(String title, int year, double price)\
  \ {\n            this.title = title;\n            this.year = year;\n          \
  \  this.price = price;\n        }\n    }\n}\n```\n\n由于本章解释了程序中所有的代码元素，以下段落仅提供了程序主要部分的路线图：\n\
  \n- `main` 方法调用 `getMovies` 获取获取 `Movie` 对象数组。接下来，它调用 `openOutputStream` 获取一个用于向文件写入数据的流。\n\
  - 然后，使用增强 for 循环调用 `writeMovie` 将电影写入文件。\n- 最后，该方法调用 `closeFile` 关闭文件。\n- `getMovies`\
  \ 方法创建一个要写入文件的电影数组。\n- `openOutputStream` 方法创建一个 `DataOutputStream` 对象，以便程序可以向文件写入数据。\n\
  - `writeMovie` 方法接受两个参数：要写入的电影和用于写入数据的输出流。\n- `closeFile` 方法关闭文件。\n- 再次，`Movie`\
  \ 类被作为内部类包含。\n\n\n\n\nSQL 代表 `Structured Query Language`（结构化查询语言）。`SQL` 是关系型数据库的通用语言（这不是一种面条，而是一种语言）。它是用于创建和访问关系型数据库的标准语言，也是\
  \ Java 数据库处理的基础。\n\nJava  `Java Database Connectivity (JDBC)`（Java 连接），它可以让你编写 SQL\
  \ 语句，将其发送到数据库服务器并处理结果。然而，要使用 `JDBC`，你需要了解 SQL 数据库的一些基本概念，并至少掌握足够编写合理 SQL 语句的 SQL\
  \ 知识。\n\n本章不会让你成为数据库大师或 SQL 专家——SQL 是一种复杂的语言，是许多整本书的主题，包括 Allen G. Taylor (Wiley)\
  \ 编写的第 8 版《SQL For Dummies》（SQL 傻瓜指南）。本章涵盖的 SQL 知识足以让你开始使用 `JDBC`。\n\n此外，本章没有涵盖\
  \ `JDBC`。我决定将这个主题留到第 8 本第 4 章，所以如果你已经熟悉 SQL，可以跳过本章。\n\n# 第 3 章 100 美元的数据库 827\n\n\
  ## 定义关系型数据库\n`relational database`（关系型数据库）一词是整个计算机领域最常用且最被滥用的术语之一。关系型数据库可以是：\n\n\
  - 一个数据存储在表中的数据库：可以根据共同信息在表之间建立关系。例如，客户表和发票表可能都包含 `customer-number`（客户编号）列。该列可以作为表之间关系的基础。\n\
  - 通过 SQL 访问的数据库：IBM 发明 `SQL` 是为了提供一种访问存储在关系型数据库中的实用方法。\n\n从 Java 程序员的角度来看，第二个定义是唯一重要的。如果你可以使用\
  \ SQL 访问数据库，那么该数据库就是关系型的。\n\n## 理解（并发音）SQL\n`SQL` 是一种 `query language`（查询语言），这意味着它设计用于提取、组织和更新关系型数据库中的信息。在很久早的\
  \ 1970 年代，当它被发明时（`SQL` 的年纪足以可以当 Java 的爷爷父了），`SQL`  supposed 应该是一种类似于英语的查询语言，让未经训练的用户可以使用它来访问和更新关系型数据库数据，而无需编程。当然，事实并没有发生。`SQL`\
  \ 一点也不像英语。对于未经训练的用户来说，它太复杂且晦奥了。但它已经成为程序员中无可压倒的宠爱。\n\n从你第一次看到 `SQL` 这个缩写开始，你可能一直在想怎么发音它。（如果没有，也请听听我的。）关于这个主题有两种观点：\n\
  \n- 逐字母拼读出来：`Ess-Queue-El`。\n- 像单词 `sequel` 一样发音。\n\n两种方法都能达到目的，但请注意：有些人坚决认为必须以其中一种方式发音。这些人往往倾向于认为，任何以“错误”方式（在他们看来）发音的人都是不识字的书呆子。\n\
  \n828 第 8 本 文件与数据库\n\n## 介绍 SQL 语句\n与 Java 不同，`SQL` 不是面向对象的。记住，`SQL` 是在尼克松政府期间发明的。然而，与\
  \ Java 类似，`SQL` 使用语句来完成工作。表 3-1 列出了你最常用的 SQL 语句。\n\n### 表 3-1 常用 SQL 语句\n\n| SQL\
  \ 语句 | 描述 |\n| :--- | :--- |\n| **数据操作** | |\n| `select` | 从一个或多个表中检索数据。这是你最频繁使用的语句。\
  \ |\n| `insert` | 向表中插入一行或多行。 |\n| `delete` | 从表中删除一行或多行。 |\n| `update` | 更新表中已有的行。\
  \ |\n| **数据定义** | |\n| `create` | 创建表和其他数据库对象。 |\n| `alter` | 更改表或其他数据库对象的定义。 |\
  \ |\n| `drop` | 删除表或其他数据库对象。 |\n| `use` | 在脚本中，指明后续语句适用于哪个数据库。 |\n\n与 Java 语句不同，`SQL`\
  \ 语句是不区分大小写的，这意味着你可以写 `select`、`Select` 或 `SELECT`。如果你想的话，甚至可以写成 `sElEcT` 来增加趣味。\n\
  \n## 创建 SQL 数据库\n在向关系型数据库存储数据之前，你必须先创建数据库。通常你不会在 Java 程序中这样做。相反，你通过编写一个脚本文件来实现，其中包含创建表所需的\
  \ `Create` 语句，然后通过数据库服务器的管理程序运行该脚本。（某些数据库服务器也允许你交互式地定义数据库，但脚本方法更受青睐，因为你在测试应用程序时经常需要删除并重建数据库。）\n\
  \n第 3 章 100 美元的数据库 829\n\n本节（以及本章其他部分）中显示的脚本适用于 `MySQL` 5.5 版本。`MySQL` 是一个免费的 SQL\
  \ 数据库服务器，你可以从 `dev.mysql.com/downloads/mysql` 下载。完整的 `MySQL` 下载包包含了服务器和一个名为 `MySQL\
  \ Command Line Client`（MySQL 命令行客户端）的实用程序，它可以让你从提示符输入 SQL 命令并立即查看结果。（要安装 `MySQL`，请访问本段落开头提到的网站，点击适用于你\
  \ Windows 版本的安装程序链接，然后按照屏幕指示操作。）\n\n脚本语句以分号结尾，这是 `SQL` 脚本与 Java 脚本之间唯一的共同点之一。然而，请注意，在\
  \ Java 程序中使用 SQL 语句时并不需要分号。只有在脚本或交互式使用 SQL 语句时才需要分号。\n\n我没有足够的空间在书中提供关于编写脚本的完整教程。相反，我展示了列表\
  \ 3-1 —— 一个名为 `movies` 数据库的脚本，我在本章和后续章节都会都会它。### 列表 3-1：数据库创建脚本\n```sql\ndrop database\
  \ if exists movies;\ncreate database movies;\nuse movies;\ncreate table movie (\n\
  \  id int not null auto_increment,\n  title varchar(50),\n  year int,\n  price decimal(8,2),\n\
  \  primary key(id)\n);\ninsert into movie (title, year, price)\nvalues (\"It's a\
  \ Wonderful Life\", 1946, 14.95);\ninsert into movie (title, year, price)\nvalues\
  \ (\"Young Frankenstein\", 1974, 16.95);\ninsert into movie (title, year, price)\n\
  values (\"Star Wars\", 1977, 17.95);\ninsert into movie (title, year, price)\nvalues\
  \ (\"The Princess Bride\", 1987, 16.95);\ninsert into movie (title, year, price)\n\
  values (\"Glory\", 1989, 14.95);\ninsert into movie (title, year, price)\nvalues\
  \ (\"The Game\", 1997, 14.95);\ninsert into movie (title, year, price)\nvalues (\"\
  Shakespeare in Love\", 1998, 19.95);\ninsert into movie (title, year, price)\nvalues\
  \ (\"Zombieland\", 2009, 18.95);\ninsert into movie (title, year, price)\nvalues\
  \ (\"The King's Speech\", 2010, 17.85);\ninsert into movie (title, year, price)\n\
  values (\"Star Trek Into Darkness\", 2013, 19.95);\n```\n\n接下来的段落描述了该脚本的关键行：\n\n\
  **1**：创建数据库的脚本通常以 `drop database` 语句开头，删除任何同名的数据库。在测试期间，经常需要删除并重建数据库，因此你需要在脚本中包含此语句。\n\
  \n**2**：该语句创建一个名为 `movies` 的新数据库。\n\n**3**：`use` 语句指明后续语句适用于新创建的 movies 数据库。\n\n\
  **4**：此 `create table` 语句创建一个名为 `movie` 的表，包含 `id`、`title`、`year` 和 `price` 列。该语句还指定表的主键为\
  \ `id` 列。\n\n**5**：`id` 列的数据类型为 `int`，它对应 Java 的 `int` 类型。该列还指定了 `not null`，这意味着它必须有值。\n\
  \n\n\n\n每一行，并且它指定了自动增长，这意味着数据库服务器本身会为该列提供值。每当向表中添加新行时，`id` 列的值就会自动增加。\n\n→**6**\
  \ `title` 列的数据类型是 `varchar`，它类似于 Java 的 `String`。\n\n→**7** `year` 列的数据类型是 `int`。\n\
  \n→**8** `price` 列的数据类型是 `decimal`。Java 并没有 `decimal` 类型，因此该列的值会被转换为 `double`。\n\
  \n→**9** `create table` 语句指定 `id` 列是该表的主键。`primary key`（主键）是一个列（或多个列的组合），它为表中的每一行都包含一个唯一的值。每个表都应该有一个主键。\n\
  \n→**11** `insert` 语句向数据库中添加数据。这十条语句中的每一条都向 `movie` 表中添加了一行。`insert` 语句的语法很奇怪，因为你首先要列出所有想要插入数据的列，然后才列出实际的数据。例如，每个\
  \ `insert` 语句都会为三列插入数据：`title`、`year` 和 `price`。第一个 `insert` 语句（第 12 行）插入了值 \"It's\
  \ a Wonderful Life”、1946 和 14.95。\n\n要在 MySQL 中运行此脚本，请从开始菜单启动 MySQL 命令行客户端，然后使用\
  \ `source` 命令并指定脚本名称，例如所示：\n\n```\nmysql> source c:\\data\\create.sql\n```\n\n注意，第一次运行此脚本时，你会看到一条错误消息，指示\
  \ `movies` 数据库无法删除，因为它不存在。你可以安全地忽略此错误。\n\n## 查询数据库\n\n正如 `Structured Query Language`（结构化查询语言）的名称所示，查询是\
  \ SQL 的核心。`query`（查询）是对一个或多个 SQL 表执行的一种操作；它从表中提取数据并创建一个 `result set`（结果集），该结果集包含了选定的行和列。\n\
  \n需要理解的关键点是，结果集本身是一个由行和列组成的表。当你从 Java 程序查询数据库时，结果集会以从 `ResultSet` 类创建的对象的形式返回给程序。该类的方法可以让你从结果集中每行的每列中提取数据。\n\
  \n### 使用基础 select 语句\n\n要查询数据库，你可以使用 `select` 语句。在该语句中，你列出想要从中检索数据的表或多个表；你想要检索的特定表列（你可能对表中的所有内容都不感兴趣）；以及指示要检索哪些行、以什么顺序呈现行的其他子句。这里有一个简单的\
  \ select 语句，列出了 `movie` 表中的所有电影：\n\n```sql\nselect title, year\nfrom movie\norder\
  \ by year;\n```\n\n在接下来的列表中，我将这条语句拆解为各个部分：\n\n- » `select title, year` 命名了你想要包含在查询结果中的列。\n\
  - » `from movie` 命名了你想要从中检索行的表。\n- » `order by year` 表示结果按 `year` 列排序，以便最旧的电影最先出现。\n\
  \n换句话说，这条 select 语句检索了 `movie` 表中所有行的 `title` 和 `year`，并按年份顺序进行排序。你可以直接在命令行客户端中输入它来运行此查询。你将得到：\n\
  \n```mysql\nmysql> select title, year from movie order by year;\n+-------------------------+------+\n\
  | title | year |\n+-------------------------+------+\n| It's a Wonderful Life |\
  \ 1946 |\n| Young Frankenstein | 1974 |\n| Star Wars | 1977 |\n| The Princess Bride\
  \ | 1987 |\n| Glory | 1989 |\n| The Game | 1997 |\n| Shakespeare in Love | 1998\
  \ |\n| Zombieland | 2009 |\n| The King's Speech | 2010 |\n| Star Trek Into Darkness\
  \ | 2013 |\n+-------------------------+------+\n10 rows in set (0.00 sec)\n```\n\
  \n你可以看到，命令行客户端显示了由 `select` 语句返回的行。当你规划程序所需的 select 语句，或者当你在测试一个更新表的程序并想确保更新正确执行时，这个功能会非常有用。\n\
  \n如果你想让查询检索每行中的所有列，可以使用星号 `*` 代替指定具体的列名，如下所示：\n\n```sql\nselect * from movie order\
  \ by year;\n```\n\n然而，这样使用星号并不是一个好主意，因为构成表的列可能会发生变化。如果你使用星号，你的程序无法处理表结构的变化。\n\n\
  到目前为止的两个示例都包含 `order by` 子句。在 SQL 数据库中，存储在表中的行并不被认为具有特定的顺序。因此，如果你想按顺序显示查询结果，必须在\
  \ `select` 语句中包含 `order by`。\n\n### 缩小查询范围\n\n假设你想找到关于某一个特定视频的信息。要从表中选择某些行，请在 `select`\
  \ 语句中使用 `where` 子句，例如所示：\n\n```mysql\nmysql> select title, year from movie where\
  \ year <= 1980 order by year;\n+-----------------------+------+\n| title | year\
  \ |\n+-----------------------+------+\n| It's a Wonderful Life | 1946 |\n| Young\
  \ Frankenstein | 1974 |\n| Star Wars | 1977 |\n+-----------------------+------+\n\
  3 rows in set (0.00 sec)\n```\n\n在这里，select 语句选择了所有 `year` 列小于或等于 1980 的行。结果按 `year`\
  \ 列排序。\n\n### 排除行\n\n也许你想要检索所有行，但符合某些标准的行。这里有一个忽略了 70 年代制作电影的查询（这可能是一个好主意）：\n\n\
  ```mysql\nmysql> select title, year from movie where year < 1970 or year > 1979\
  \ order by year;\n+-------------------------+------+\n| title | year |\n+-------------------------+------+\n\
  | It's a Wonderful Life | 1946 |\n| The Princess Bride | 1987 |\n| Glory | 1989\
  \ |\n| The Game | 1997 |\n| Shakespeare in Love | 1998 |\n| Zombieland | 2009 |\n\
  | The King's Speech | 2010 |\n| Star Trek Into Darkness | 2013 |\n+-------------------------+------+\n\
  8 rows in set (0.01 sec)\n```\n\n### 使用单行查询\n\n当你想要检索特定行的信息时，在 `where` 子句中提及主键列，如下：\n\
  \n```mysql\nmysql> select title, year from movie where id = 7;\n+---------------------+------+\n\
  | title | year |\n+---------------------+------+\n| Shakespeare in Love | 1998 |\n\
  +---------------------+------+\n1 row in set (0.49 sec)\n```\n\n在这里，`where` 子句选择了\
  \ `id` 列等于 7 的行。这种 select 语句被称为 `singleton select`（单行查询），因为它只检索一行。单行查询通常用于 Java\
  \ 程序，允许用户访问或更新特定的数据库行。\n\n### 模糊匹配\n\n假设你想检索某部电影的信息，但不完全记得它的名字，但你知道它包含 `princess`\
  \ 这个词。`where` 子句最有趣的变体之一是引入了 `like`，它允许使用通配符搜索行。这里是一个示例，其中百分号（`%`）是一个通配符：\n\n```mysql\n\
  mysql> select title, year from movie where title like \"%princess%\";\n+--------------------+------+\n\
  | title | year |\n+--------------------+------+\n| The Princess Bride | 1987 |\n\
  +--------------------+------+\n1 row in set (0.01 sec)\n```\n\n### 使用列函数\n\n如果你想统计\
  \ `movie` 表中电影的总数，或者想统计 1970 年之前制作的电影数量呢？要做到这一点，你需要使用列函数。SQL 的列函数允许你对列进行计算。\n\n\n\
  \n\n你可以计算整列的总和、平均值、最大值或最小值，或者统计整列值的个数。\n\n表 3-2 汇总了这些函数。*注意：*函数作用于结果集中返回的值，而结果集并不一定是整个表。\n\
  \n### 表 3-2：列函数\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `sum(column-name)` | 相加列中的所有值。\
  \ |\n| `avg(column-name)` | 计算该列的平均值。计算中不包含空值。 |\n| `min(column-name)` | 确定列中的最低值。\
  \ |\n| `max(column-name)` | 确定列中的最高值。 |\n| `count(column-name)` | 统计该列具有数据值的行数。\
  \ |\n| `countDistinct(column-name)` | 统计该列中不同值的个数。 |\n| `count(*)` | 统计结果集的行数。 |\n\
  \n要使用这些函数之一，请在 `select` 语句中指定函数而不是列名。以下 `select` 语句计算了表中的行数以及最老电影的年份：\n\n```mysql\n\
  select count(*), min(year) from movie;\n```\n```\n+----------+-----------+\n| count(*)\
  \ | min(year) |\n+----------+-----------+\n| 10 | 1946 |\n+----------+-----------+\n\
  1 row in set (0.00 sec)\n```\n如你所见，表中有十部电影，最老的一部是 1946 年制作的。\n\n如果 `select` 语句包含\
  \ `where` 子句，则只有符合条件的行会被包含在计算中。此语句查找表中有多少部电影是在 1970 年之前制作的：\n\n```mysql\nselect\
  \ count(*) from movie where year < 1970;\n```\n```\n+----------+\n| count(*) |\n\
  +----------+\n| 2 |\n+----------+\n1 row in set (0.00 sec)\n```\n结果是 2。\n\n####\
  \ 从多个表中选择数据\n\n在现实世界中，大多数 `select` 语句从两个或多个表里检索数据。假设你想获取一份你目前借给朋友的所有电影列表。为了实现这一点，你必须在数据库中创建另一个表，列出朋友的名字和他们借过的任何电影的\
  \ ID。以下是一个用于创建此类表的 `create table` 语句：\n\n```sql\ncreate table friend (\n  lastname\
  \ varchar(50),\n  firstname varchar(50),\n  movieid int\n);\n```\n\n现在向其加载一些数据，如下：\n\
  \n```sql\ninsert into friend (lastname, firstname, movieid)\nvalues (\"Haskell\"\
  , \"Eddie\", 3);\ninsert into friend (lastname, firstname, movieid)\nvalues (\"\
  Haskell\", \"Eddie\", 5);\ninsert into friend (lastname, firstname, movieid)\nvalues\
  \ (\"Cleaver\", \"Wally\", 9);\ninsert into friend (lastname, firstname, movieid)\n\
  values (\"Mondello\", \"Lumpy\", 2);\ninsert into friend (lastname, firstname, movieid)\n\
  values (\"Cleaver\", \"Wally\", 3);\n```\n处理好这些后，你就可以在单个 `select` 语句中使用结合 `friend`\
  \ 表和 `movie` 表了。你只需要在 `from` 子句中列出两个表，然后在 `where` 子句中提供一个关联这些表的条件，如下：\n\n```mysql\n\
  select lastname, firstname, title\nfrom movie, friend\nwhere movie.id = friend.movieid;\n\
  ```\n```\n+----------+-----------+--------------------+\n| lastname | firstname\
  \ | title |\n+----------+-----------+--------------------+\n| Haskell | Eddie |\
  \ Star Wars |\n| Haskell | Eddie | Glory |\n| Cleaver | Wally | The King's Speech\
  \ |\n| Mondello | Lumpy | Young Frankenstein |\n| Cleaver | Wally | Star Wars |\n\
  +----------+-----------+--------------------+\n5 rows in set (0.00 sec)\n```\n在这里你可以看到哪些电影被借出去了，以及被谁借了。注意\
  \ `where` 子句中的 `id` 和 `movieid` 列使用了其所属的表名进行限定。\n\n以下是一个列出 Eddie Haskell 借过的所有电影的\
  \ `select` 语句：\n\n```mysql\nselect title from movie, friend\nwhere movie.id = friend.movieid\n\
  and lastname = \"Haskell\";\n```\n```\n+----------+\n| title |\n+----------+\n|\
  \ Star Wars |\n| Glory |\n+----------+\n2 rows in set (0.00 sec)\n```\n那家伙拿走了你两部最棒电影！\n\
  \n注意在这个例子中，即使你实际上没有检索它的任何列，你仍然可以在 `where` 子句中引用 `friend` 表。然而，你仍然必须在 `from` 子句中列出两个表。\n\
  \n#### 去除重复项\n\n如果你只想知道所有借了电影的朋友的名字，可以对 `friend` 表执行一个简单的 `select`，如下：\n\n```mysql\n\
  select lastname, firstname from friend;\n```\n```\n+----------+-----------+\n| lastname\
  \ | firstname |\n+----------+-----------+\n| Haskell | Eddie |\n| Haskell | Eddie\
  \ |\n| Cleaver | Wally |\n| Mondello | Lumpy |\n| Cleaver | Wally |\n+----------+-----------+\n\
  5 rows in set (0.00 sec)\n```\n结果中出现了重复项。你可以通过在 `select` 中添加 `distinct` 关键字来消除重复行，如下：\n\
  \n```mysql\nselect distinct lastname, firstname from friend;\n```\n```\n+----------+-----------+\n\
  | lastname | firstname |\n+----------+-----------+\n| Haskell | Eddie |\n| Cleaver\
  \ | Wally |\n| Mondello | Lumpy |\n| Cleaver | Wally |\n+----------+-----------+\n\
  4 rows in set (0.00 sec)\n```\n现在每个名字只出现一次。\n\n#### 更新和删除行\n\n如果你想更新某些数据，可以使用 `update`\
  \ 语句。例如，更新年份：\n\n```mysql\nupdate movie set year = 2015 where id = 10;\n```\n```\n\
  Query OK, 1 row affected (0.00 sec)\n```\n更新后，可以使用 `select` 语句确认，如下：\n\n```mysql\n\
  select * from movie where id = 10;\n```\n```\n+----+----------------------+-------+\n\
  | id | title | year |\n+----+----------------------+-------+\n| 10 | It's a Wonderful\
  \ Life | 2015 |\n+----+----------------------+-------+\n1 row in set (0.00 sec)\n\
  ```\n\n如果你想删除行，可以使用 `delete` 语句。例如，删除 ID 为 10 的电影：\n\n```mysql\ndelete from movie\
  \ where id = 10;\n```\n```\nQuery OK, 1 row affected (0.00 sec)\n```\n删除后，可以使用 `select`\
  \ 语句确认它已被删除，如下：\n\n```mysql\nselect * from movie where id = 10;\n```\n```\nEmpty\
  \ set (0.00 sec)\n```\n\n\n\n\n# 使用 update 语句\n\nupdate 语句选择表中的一行或一行，然后修改所选行中一个或多个列的值。它的语法如下：\n\
  \n```sql\nupdate *table-name*\nset *expressions*...\nwhere *condition*;\n```\n\n\
  set 表达式类似于 Java 的赋值语句。这里有一个将 ID 为 8 的电影价格改为 18.95 的语句：\n\n```sql\nmysql> update\
  \ movie set price = 18.95 where id = 8;\n```\nQuery OK, 1 row affected (0.44 sec)\n\
  Rows matched: 1 Changed: 1 Warnings: 0\n\n你可以使用一个快速的 select 语句来验证价格是否已更改，如下：\n\n\
  ```sql\nmysql> select id, price from movie;\n```\n+----+-------+\n| id | price |\n\
  +----+-------+\n| 1 | 14.95 |\n| 2 | 16.95 |\n| 3 | 17.95 |\n| 4 | 16.95 |\n| 5\
  \ | 14.95 |\n| 6 | 14.95 |\n| 7 | 19.95 |\n| 8 | 18.95 |\n| 9 | 17.85 |\n+----+-------+\n\
  9 rows in set (0.00 sec)\n\n要更新多个列，请使用逗号分隔表达式。这里有一个更改 `friend` 表中 Eddie Haskell\
  \ 名字语句：\n\n```sql\nmysql> update friend set lastname = \"Bully\",\n-> firstname\
  \ = \"Big\"\n-> where lastname = \"Haskell\";\n```\nQuery OK, 2 rows affected (0.46\
  \ sec)\nRows matched: 2 Changed: 2 Warnings: 0\n\n再次，通过快速的 select 显示行已正确更新，如下：\n\
  \n```sql\nmysql> select firstname, lastname from friend;\n```\n+-----------+----------+\n\
  | firstname | lastname |\n+-----------+----------+\n| Big | Bully |\n| Big | Bully\
  \ |\n| Wally | Cleaver |\n| Lumpy | Mondello |\n| Wally | Cleaver |\n+-----------+----------+\n\
  5 rows in set (0.00 sec)\n\n关于 update 语句，你应该知道的最后一个技巧是，set 表达式可以包含计算。以下语句将所有电影的价格提高了\
  \ 10%：\n\n```sql\nmysql> update movie set price = price * 1.1;\n```\nQuery OK, 10\
  \ rows affected (0.46 sec)\nRows matched: 10 Changed: 10 Warnings: 0\n\n这里有一个 select\
  \ 语句来验证此更新有效：\n\n```sql\nmysql> select id, price from movie;\n```\n+----+-------+\n\
  | id | price |\n+----+-------+\n| 1 | 16.45 |\n| 2 | 18.65 |\n| 3 | 19.75 |\n| 4\
  \ | 18.65 |\n| 5 | 16.45 |\n| 6 | 16.45 |\n| 7 | 21.95 |\n| 8 | 20.85 |\n| 9 | 19.64\
  \ |\n| 10 | 21.95 |\n+----+-------+\n10 rows in set (0.01 sec)\n\n# 第 4 章：使用 JDBC\
  \ 连接数据库\n\n`JDBC` — *Java Database Connectivity* — 是一种 Java 特性，允许你连接到几乎任何关系型数据库系统，执行\
  \ SQL 命令并处理结果，这一切都可以在 Java 程序内部完成。在本章中，你将设置 JDBC 并使用它访问 MySQL 数据库中的数据。\n\n如果你不熟悉\
  \ SQL 的基础知识，请在处理本章之前阅读上一章。\n\n## 设置驱动程序\n\n在编写通过 JDBC 数据库的 Java 程序之前，你必须首先安装将 Java\
  \ 数据库 API 类链接到实际数据库的驱动程序。正确设置驱动程序可能很复杂，但一旦运行成功，访问数据库就很简单。\n\n要安装 MySQL 的 JDBC 驱动程序，请访问\
  \ `www.mysql.com/products/connector` 并点击 `JDBC Driver for MySQL (Connector/J)` 链接。然后按照提供的说明下载并安装安装程序的二进制版本。\n\
  \n## 连接数据库\n\n在使用 JDBC 访问 SQL 数据库之前，你必须首先与数据库建立连接。建立连接的第一步涉及*注册*驱动类，以便该类可用。要做到这一点，请使用\
  \ `Class` 类的 `forName` 方法，并指定驱动程序的包和类名。\n\n注册 MySQL 连接器，请使用此语句：\n\n```java\nClass.forName(\"\
  com.mysql.jdbc.Driver\");\n```\n\n注册 ODBC 驱动程序，请使用此语句：\n\n```java\nClass.forName(\"\
  sun.jdbc.odbc.JdbcOdbc\");\n```\n\n注意 `forName` 会抛出 `ClassNotFoundException`，因此必须将其封装在\
  \ try/catch 块中。注册驱动类后，你可以调用 `DriverManager` 类的 `getConnection` 方法来打开连接。该方法接受三个参数：URL、用户名和密码。这是一个示例：\n\
  \n```java\nString url = \"jdbc:mysql://localhost/Movies\";\nString user = \"root\"\
  ;\nString pw = \"pw\";\ncon = DriverManager.getConnection(url, user, pw);\n```\n\
  \nURL 参数具有以下语法：`jdbc:subprotocol://subname`，其中 `subprotocol` 对于 MySQL 为 `mysql`，对于\
  \ ODBC 为 `odbc`。`subname` 是数据库名称。例如：\n\n```java\nString url = \"jdbc:mysql://localhost/Movies\"\
  ;\n```\n\n注意 `getConnection` 会抛出 `SQLException`，因此你需要将其封装在 try/catch 语句中。将所有内容整合，这里有一个返回连接电影数据库的\
  \ `Connection` 对象的方法：\n\n```java\nprivate static Connection getConnection() {\n\
  \    Connection con = null;\n    try {\n        Class.forName(\"com.mysql.jdbc.Driver\"\
  );\n        String url = \"jdbc:mysql://localhost/Movies\";\n        String user\
  \ = \"root\";\n        String pw = \"pw\";\n        con = DriverManager.getConnection(url,\
  \ user, pw);\n    } catch (ClassNotFoundException e) {\n        System.out.println(e.getMessage());\n\
  \        System.exit(0);\n    } catch (SQLException e) {\n        System.out.println(e.getMessage());\n\
  \        System.exit(0);\n    }\n    return con;\n}\n```\n\n你可以在 `java.sql` 包中找到这些类以及其他用于\
  \ SQL 的类。因此，在任何使用 JDBC 的程序中都需要导入该包。\n\n## 查询数据库\n\n在与数据库建立连接后，你可以执行 select 语句来检索数据。要这样做，你必须使用几个类和接口：\n\
  \n- **Connection**: `Connection` 类有两个你可能会使用的方法。`close` 方法关闭连接，`createStatement`\
  \ 方法返回一个 `Statement` 对象，你随后使用它执行语句。\n- **Statement**: `Statement` 接口包含了将语句发送到数据库执行并返回结果的方法。特别是，你使用\
  \ `executeQuery` 方法执行 select 语句，或者使用 `executeUpdate` 方法执行 insert、update 或 delete\
  \ 语句。\n- **ResultSet**: `ResultSet` 接口表示查询返回的行。它提供了你可以用于行与行之间移动以及获取列数据的方法。\n\n表\
  \ 4-1 列出了你执行查询时使用的 `Connection` 类和 `Statement` 接口的方法。（你将在本章稍晚部分的“遍历结果集”节中了解 `ResultSet`\
  \ 接口的许多方法。）\n\n**表 4-1**\n**Connection 和 Statement 方法**\n\n\n\n\n\n# Connection\
  \ 类方法\n\n## Description\n\n`void close()`\n关闭连接。\n\n`Statement createStatement()`\n\
  创建一个 `Statement` 对象，可以在由连接的数据库上执行 SQL 语句。\n\n`Statement createStatement(int type,\
  \ int concur)`\n创建一个 `Statement` 对象，可以在由连接的数据库上执行指定类型的 SQL 语句。\n\n## Statement 接口方法\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `ResultSet executeQuery(String sql)` | 执行 `sql`\
  \ 参数中的 select 语句，并将结果数据作为 `ResultSet` 对象返回。 |\n| `ResultSet executeQuery(String\
  \ sql)` | 执行 `sql` 参数中的 select 语句，并将结果数据作为 `ResultSet` 对象返回。 |\n| `int executeUpdate(String\
  \ sql)` | 执行字符串参数包含的 insert、update 或 delete 语句，并将结果数据作为 `ResultSet` 对象返回。 |\n\n\
  ## createStatement 详情\n\n`createStatement` 方法的第一个参数指定要创建的结果集类型，可以是以下之一：\n- `ResultSet.TYPE_FORWARD_ONLY`\n\
  - `ResultSet.TYPE_SCROLL_INSENSITIVE`\n- `ResultSet.TYPE_SCROLL_SENSITIVE`\n\n第二个参数指示结果集是只读还是可更新，可以是以下之一：\n\
  - `ResultSet.CONCUR_READ_ONLY`\n- `ResultSet.CONCUR_UPDATABLE`\n\n## 执行 select 语句\n\
  \n以下代码段执行了一个 select 语句并获取结果：\n\n```java\nStatement s = con.createStatement();\n\
  String select = \"Select title, year, price \" + \"from movie order by year\";\n\
  ResultSet rows = s.executeQuery(select);\n```\n这里结果集存储在 `rows` 变量中。\n\n## 遍历结果\n\
  \n`executeQuery` 语句返回的 `ResultSet` 对象包含了 select 语句检索的所有 `rows`。你一次只能访问这些行中的一个。结果集维护了一个名为\
  \ `cursor` 的指针来跟踪当前行。你可以使用表 4-2 所示的方法在结果集中移动光标。\n\n### 表 4-2：ResultSet 接口的导航方法\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `void close()` | 关闭结果集。 |\n| `void last()` | 将光标移动到最后一行。\
  \ |\n| `int getRow()` | 获取当前行号。 |\n| `boolean next()` | 移动到下一行。 |\n\n以下代码段展示了如何构建处理结果集中每一行的代码：\n\
  \n```java\nwhile(rows.next()) {\n    // 处理当前行\n}\n```\n你所做的是将注释替换为从结果集中检索数据并处理这些数据的语句，如下一节所述。\n\
  \n## 从结果集中获取数据 \n\n表 4-3 列出了你可以用于从当前行检索数据的 `ResultSet` 接口方法。如你所见，这些方法中的每种都有两个版本：一个通过列名指定列，另一个通过索引号指定列。如果你知道索引号，使用它来访问列值比使用列名更高效。\n\
  \n### 表 4-3：ResultSet 接口的 Get 方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `BigDecimal\
  \ getBigDecimal(String columnName)` | 作为 `BigDecimal` 获取指定列的值。 |\n| `BigDecimal\
  \ getBigDecimal(int columnIndex)` | 作为 `BigDecimal` 获取指定列的值。 |\n| `boolean getBoolean(String\
  \ columnName)` | 作为 `boolean` 获取指定列的值。 |\n| `boolean getBoolean(int columnIndex)`\
  \ | 作为 `boolean` 获取指定列的值。 |\n| `Date getDate(String columnName)` | 作为 `Date` 获取指定列的值。\
  \ |\n| `Date getDate(int columnIndex)` | 作为 `Date` 获取指定列的值。 |\n| `double getDouble(String\
  \ columnName)` | 作为 `double` 获取指定列的值。 |\n| `double getDouble(int columnIndex)` |\
  \ 作为 `double` 获取指定列的值。 |\n| `float getFloat(String columnName)` | 作为 `float` 获取指定列的值。\
  \ |\n| `float getFloat(int columnIndex)` | 作为 `float` 获取指定列的值。 |\n| `int getInt(String\
  \ columnName)` | 作为 `int` 获取指定列的值。 |\n| `int getInt(int columnIndex)` | 作为 `int`\
  \ 获取指定列的值。 |\n| `long getLong(String columnName)` | 作为 `long` 获取指定列的值。 |\n| `long\
  \ getLong(int columnIndex)` | 作为 `long` 获取指定列的值。 |\n| `short getShort(String columnName)`\
  \ | 作为 `short` 获取指定列的值。 |\n| `short getShort(int columnIndex)` | 作为 `short` 获取指定列的值。\
  \ |\n| `String getString(String columnName)` | 作为 `String` 获取指定列的值。 |\n| `String\
  \ getString(int columnIndex)` | 作为 `String` 获取指定列的值。 |\n\n以下是获取当前行标题、年份和价格的代码：\n\
  \n```java\nString title = row.getString(\"title\");\nint year = row.getInt(\"year\"\
  );\ndouble price = row.getDouble(\"price\");\n```\n\n假设列按顺序出现，以下代码执行了相同的操作：\n\n\
  ```java\nString title = row.getString(1);\nint year = row.getInt(2);\ndouble price\
  \ = row.getDouble(3);\n```\n注意，与 Java 中几乎所有其他索引不同，列索引从 1 开始，而不是从 0。\n\n## 整合在一起：一个从数据库读取的程序\n\
  \n现在你已经看到了构成使用 JDBC 查询数据库的程序的各种元素，列表 4-1 显示了一个从数据库读取数据并在控制台上列出这些内容的程序。当你运行此程序时，控制台上会显示以下内容：\n\
  \n### 列表 4-1：电影列表程序\n\n```java\nimport java.sql.*;\nimport java.text.NumberFormat;\n\
  \npublic class ListMovies {\n    public static void main(String[] args) {\n    \
  \    NumberFormat cf = NumberFormat.getCurrencyInstance();\n        ResultSet rows\
  \ = getMovies();\n        try {\n            while (rows.next()) {\n           \
  \     Movie m = getMovie(rows);\n                String msg = Integer.toString(m.year);\n\
  \                msg += \": \" + m.title;\n                msg += \" (\" + cf.format(m.price)\
  \ + \")\";\n                System.out.println(msg);\n            }\n        } catch\
  \ (SQLException e) {\n            System.out.println(e.getMessage());\n        }\n\
  \    }\n\n    private static ResultSet getMovies() {\n        Connection con = getConnection();\n\
  \        try {\n            Statement s = con.createStatement();\n            String\
  \ select = \"Select title, year, price \" + \"from movie order by year\";\n    \
  \        ResultSet rows;\n            rows = s.executeQuery(select);\n         \
  \   return rows;\n        } catch (SQLException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n        return null;\n    }\n\n    private static Connection getConnection()\
  \ {\n        Connection con = null;\n        try {\n            Class.forName(\"\
  com.mysql.jdbc.Driver\");\n            String url = \"jdbc:mysql://localhost/Movies\"\
  ;\n            String user = \"root\";\n            String pw = \"PassWord\";\n\
  \            con = DriverManager.getConnection(url, user, pw);\n        } catch\
  \ (ClassNotFoundException e) {\n            System.out.println(e.getMessage());\n\
  \            System.exit(0);\n        } catch (SQLException e) {\n            System.out.println(e.getMessage());\n\
  \            System.exit(0);\n        }\n        return con;\n    }\n\n    private\
  \ static Movie getMovie(ResultSet movies) {\n        try {\n            String title\
  \ = movies.getString(\"Title\");\n            int year = movies.getInt(\"Year\"\
  );\n            double price = movies.getDouble(\"Price\");\n            return\
  \ new Movie(title, year, price);\n        } catch (SQLException e) {\n         \
  \   // handle exception\n        }\n    }\n}\n```\n\n注意，你可能还会收到建议安装 SSL 证书以提供安全访问\
  \ MySQL 数据库的消息。为了测试 JDBC 的目的，你可以忽略此消息。\n\n\n\n\n\n## 列表 4-1: (续)\n\n```java\n{\n\
  \    System.out.println(e.getMessage());\n}\nreturn null;\n}\n\nprivate static class\
  \ Movie\n{\n    public String title;\n    public int year;\n    public double price;\n\
  \n    public Movie(String title, int year, double price)\n    {\n        this.title\
  \ = title;\n        this.year = year;\n        this.price = price;\n    }\n}\n```\n\
  \n接下来的段落描述了该程序的工作原理：\n\n- **6** `main` 方法通过调用 `getMovies` 方法开始，获取一个包含要列出电影的 `ResultSet`\
  \ 对象。然后，通过 `while` 循环读取结果集的每一行。调用 `getMovie` 方法根据当前行中的数据创建一个 `Movie` 对象。然后创建一个输出字符串并将其发送到控制台。该循环被包含在\
  \ `try/catch` 语句中，因为下一个方法可能会抛出 `SQLException`。\n\n- **28** `getMovies` 方法负责获取数据库连接，然后查询数据库获取电影。第一个任务被委托给\
  \ `getConnection` 方法。然后创建一个 `Statement` 并使用以下选择语句进行执行：\n`select title, year, price\
  \ from movie order by year`\n然后将结果集返回给 `main` 方法。\n\n- **46** `getConnection` 方法创建一个指向数据库的\
  \ `Connection` 对象。请注意，用户 ID 和密码被硬编码在此方法中。在实际应用程序中，你从用户或配置文件中获取这些信息。\n\n- **70**\
  \ `getMovie` 方法从当前行中提取 `title`、`year` 和 `price`，并使用这些值来创建一个 `Movie` 对象。\n\n- **86**\
  \ `Movie` 类被作为一个内部类创建。为了保持此应用程序的简单，该类使用了公共字段和单个构造函数，该构造函数使用传递参数的值初始化字段。\n\n## 更新\
  \ SQL 数据\n\n除了执行 `select` 语句外，你还可以使用 `Statement` 对象执行 `insert`、`update` 或 `delete`\
  \ 语句。要执行这些操作，请调用 `executeUpdate` 方法而不是 `executeQuery` 方法。该方法返回一个 `int` 值，表示更新了多少行。你可以通过测试返回值来确定数据是否已正确更新。\n\
  \n这里有一个接受电影 ID、姓和名的方法，然后在 friend 表中插入一行：\n\n```java\nprivate static void loanMovie(int\
  \ id, String lastName, String firstName)\n{\n    Connection con = getConnection();\n\
  \    try\n    {\n        Statement stmt = con.createStatement();\n        String\
  \ insert = \"insert into friend \"\n        + \"(lastname, firstname, movieid) \"\
  \n        + \"values (\"\n        + \"\\\"\" + lastName + \"\\\", \\\"\"\n     \
  \   + firstName + \"\\\", \" +\n        + id + \")\";\n        int i = stmt.executeUpdate(insert);\n\
  \        if (i == 1)\n            System.out.println(\"Loan recorded.\");\n    \
  \    else\n            System.out.println(\"Loan not recorded.\");\n    }\n    catch\
  \ (SQLException e)\n    {\n        System.out.println(e.getMessage());\n       \
  \ System.exit(0);\n    }\n}\n```\n\n在此方法开始处调用的 `getConnection` 方法与列表 4-1 中的 `getConnection`\
  \ 方法相同。创建连接后，会创建一个 `Statement` 对象，并使用通过参数传递的值构建插入语句。例如，如果你传递了 `id` 3，姓 `Haskell`，名\
  \ `Eddie`，则构建了如下插入语句：\n`Insert into friend (lastname, firstname, movieid) Values\
  \ (\"Haskell\", \"Eddie\", 3)`\n\n然后调用 `executeUpdate` 方法执行插入语句。使用 `if` 语句来判断行是否已插入。你可以以相同的方式执行更新或删除语句。当你测试执行由此类字符串构建的\
  \ SQL 语句的数据库代码时，添加一个 `System.out.println` 调用将语句打印到控制台。这样，你就可以验证语句是否被正确创建。\n\n##\
  \ 使用可更新的 RowSet 对象\n\n如果你正在使用较新的 JDBC 驱动程序（支持 JDBC 2.0 或更高版本的驱动程序），你还有另一种更新数据的选择方法：使用可更新的结果集。通过可更新的结果集，你可以更改结果集行中的数据、向结果集中添加行，或从结果集中删除行。当你执行这些操作时，更新将自动写回底层数据库。\n\
  \n要创建一个可更新的结果集，你必须在创建 `Statement` 对象时，在 `createStatement` 方法上指定 `ResultSet.CONCUR_UPDATABLE`\
  \ 字段，如下：\n\n```java\nStatement stmt = con.createStatement(\n    ResultSet.TYPE_SCROLL_SENSITIVE,\n\
  \    ResultSet.TYPE_CONCUR_UPDATABLE);\n```\n\n第一个参数表示结果集是可滚动的，这意味着你可以通过结果集向前向后移动光标。你可以使用表\
  \ 4-4 中列出的方法来滚动结果集。该参数还表示结果集可以与数据库同步，以便其他用户所的更改都能反映在结果集中。\n\n### 表 4-4: 可滚动结果集的方法\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `boolean absolute(int row)` | 将光标移动到此 `ResultSet`\
  \ 对象中指定的行号。 |\n| `void afterLast()` | 将光标移动到此 `ResultSet` 的末尾。 |\n| `void beforeFirst()`\
  \ | 将光标移动到此 `ResultSet` 的开头。 |\n| `boolean first()` | 将光标移动到此 `ResultSet` 的第一行。\
  \ |\n| `boolean last()` | 将光标移动到此 `ResultSet` 的最后一行。 |\n| `boolean next()` | 将光标从当前位置向下移动一行。\
  \ |\n| `boolean previous()` | 将光标移动到此 `ResultSet` 的上一行。 |\n| `boolean relative(int\
  \ rows)` | 将光标移动相对行数，正数或负数。 |\n\n### 表 4-5: 可更新结果集的方法\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `void cancelUpdates()` | 取消对此 `ResultSet` 中当前行所做的更新。 |\n| `void deleteRow()`\
  \ | 从 `ResultSet` 和底层数据库中删除当前行。 |\n| `void insertRow()` | 将插入行的内容插入到 `ResultSet`\
  \ 和数据库中。 |\n| `void moveToCurrentRow()` | 将光标移动到记录的光标位置，通常是当前行。 |\n| `void moveToInsertRow()`\
  \ | 将光标移动到插入行。 |\n| `void refreshRow()` | 使用数据库中最新的值刷新当前行。 |\n| `void updateRow()`\
  \ | 使用此 `ResultSet` 当前行的新内容更新底层数据库。 |\n\n\n\n\n\n```java\nvoid updateBigDecimal(String\
  \ columnName, BigDecimal value)\nvoid updateBigDecimal(int columnIndex, BigDecimal\
  \ value)\nvoid updateBoolean(String columnName, boolean value)\nvoid updateBoolean(int\
  \ columnIndex, boolean value)\nvoid updateDate(String columnName, Date value)\n\
  void updateDate(int columnIndex, Date value)\nvoid updateDouble(String columnName,\
  \ double value)\nvoid updateDouble(int columnIndex, double value)\nvoid updateFloat(String\
  \ columnName, float value)\nvoid updateFloat(int columnIndex, float value)\nvoid\
  \ updateInt(String columnName, int value)\nvoid updateInt(int columnIndex, int value)\n\
  void updateLong(String columnName, long value)\nvoid updateLong(int columnIndex,\
  \ long value)\nvoid updateShort(String columnName, short value)\nvoid updateShort(int\
  \ columnIndex, short value)\nvoid updateString(String columnName, String value)\n\
  void updateString(int columnIndex, String value)\n```\n\n## 插入行\n\n要插入一行，你会在结果集中可以使用一个名为\
  \ `insert row`（插入行）的特殊行。首先，**使用 JDBC 连接到数据库**，调用 `moveToInsertRow()` 方法将光标移动到插入行。然后使用更新方法设置插入行中每一列的值。接着，你调用\
  \ `insertRow()` 方法将插入行复制到结果集中，这会向数据库写入新行。最后，调用 `moveToCurrentRow()` 将光标移回结果集中之前的位置。\n\
  \n这是一个示例：\n\n```java\ntry\n{\n    rs.moveToInsertRow();\n    rs.updateString(\"\
  title\", \"Monty Python and the Holy Grail\");\n    rs.updateInt(\"year\", 1975);\n\
  \    rs.updateDouble(\"price\", 13.95);\n    rs.insertRow();\n    rs.moveToCurrentRow();\n\
  }\ncatch (SQLException e)\n{\n    System.out.println(e.getMessage());\n    System.exit(0);\n\
  }\n```\n\n## 第 5 章：使用 XML\n\n在本章中，你将了解到如何处理*可扩展标记语言*（`XML`）——这是自真空管发明以来计算领域发生的最棒事件（至少根据某些过度热情的预言者所说）。\n\
  \n本章侧重于将 XML 文档读取到内存并从中提取数据的基础知识。凭借本章的背景知识，你不应该在自己学习 API 文档遇到太大困难，从而发现更多关于 XML 编程的内容。\n\
  \n### 定义 XML\n\n大多数计算机行业的专家都认为，XML 将完全改变你与计算机交互的方式。以下 XML 变革计算机世界的一些方式：\n\n*   解锁存储在公司大型机计算机机库中的海量数据仓库。\n\
  *   让地球上的每台电子设备（从最复杂的超级计算机到台式电脑、手机和手表）都能够相互通信。\n*   允许每一个编写过的计算机程序与其他每一个编写过的计算机程序交换数据。\n\
  *   可能还会治愈癌症并解决预算赤字。\n\n（哈欠。）\n\n那么 XML 到底是什么？简单来说，XML 是一种标准化的存储和交换信息的方法，它易于在不同类型的计算机系统或程序之间创建、检索和传输。当\
  \ XML 存储在文件中时，文件通常带有 `.xml` 扩展名。\n\n### 标签\n\n像超文本标记语言（`HTML`）一样，XML 使用标签来标记数据。这里有一段描述书籍的\
  \ XML：\n\n```xml\n<Book>\n    <Title>Java All-In-One For Dummies</Title>\n    <Author>Lowe</Author>\n\
  </Book>\n```\n\n这段 XML 定义了一个名为 `Book` 的 `element`（元素），它包含单本书的信息。`Book` 元素又包含两个子元素：`Title`\
  \ 和 `Author`。\n\n注意，每个元素都以一个列出元素名称的标签开始。这个标签被称为 `start tag`（起始标签）。元素以一个重复元素名称且前面带有一个斜杠的元素结束——即\
  \ `end tag`（结束标签）。在起始标签和结束标签之间出现的所有内容都是该 `element` 的 `content`（内容），它可能由文本数据或一个或多个额外的元素组成。在后一种情况下，嵌套在元素中的额外元素被称为\
  \ `child elements`（子元素），而包含它们的元素被称为 `parent element`（父元素）。\n\nXML 文档中最高级别的元素被称为\
  \ `root element`（根元素）。一个格式正确的 XML 文档由单个根元素组成，该元素可以包含嵌套在其中的元素。假设你想创建一个包含两部电影信息的 XML\
  \ 文档。该 XML 文档可能像这样：\n\n```xml\n<Movies>\n    <Movie>\n        <Title>It's a Wonderful\
  \ Life</Title>\n        <Year>1946</Year>\n        <Price>14.95</Price>\n    </Movie>\n\
  \    <Movie>\n        <Title>Young Frankenstein</Title>\n        <Year>1974</Year>\n\
  \        <Price>16.95</Price>\n    </Movie>\n</Movies>\n```\n\n### 属性\n\n你可以使用属性（attributes）而不是子元素来为元素提供数据。`attribute`（属性）是写在元素起始标签内部的键值对。\n\
  \n```xml\n<Movie year=\"1946\">\n    <Title>It's a Wonderful Life</Title>\n    <Price>14.95</Price>\n\
  </Movie>\n```\n\n使用属性还是子元素在很大程度上取决于个人喜好。许多 XML 纯主义者说你应该避免使用属性，或仅将它们用于标识数据（如识别码或代码）；另一些人建议自由使用。根据我的经验，偶尔使用几个属性并无害，但在大多数情况下我避免它们。\n\
  \n### XML 声明\n\n每个 XML 文件都应该以 XML 声明开头，以标识所使用的 XML 版本。对于大多数 XML 文档，声明应该如下：\n\n```xml\n\
  <?xml version=\"1.0\"?>\n```\n\n注意，XML 声明不需要结束标签。XML 声明应该是文件的第一行。\n\n### movies.xml\
  \ 文件\n\n供参考，列表 5-1 显示了 movies.xml 文件，本章后面出现的程序将使用它。\n\n```xml\n<?xml version=\"\
  1.0\"?>\n<Movies>\n    <Movie year=\"1946\">\n        <Title>It's a Wonderful Life</Title>\n\
  \        <Price>14.95</Price>\n    </Movie>\n    <Movie year=\"1974\">\n       \
  \ <Title>Young Frankenstein</Title>\n        <Price>16.95</Price>\n    </Movie>\n\
  \    <Movie year=\"1977\">\n        <Title>Star Wars</Title>\n        <Price>17.95</Price>\n\
  \    </Movie>\n    <Movie year=\"1987\">\n        <Title>The Princess Bride</Title>\n\
  \        <Price>16.95</Price>\n    </Movie>\n    <Movie year=\"1989\">\n       \
  \ <Title>Glory</Title>\n        <Price>14.95</Price>\n    </Movie>\n    <Movie year=\"\
  1997\">\n        <Title>The Game</Title>\n        <Price>14.95</Price>\n    </Movie>\n\
  </Movies>\n```\n\n\n\n\n\n```xml\n<Movie year=\"1998\">\n  <Title>Shakespeare in\
  \ Love</Title>\n  <Price>19.95</Price>\n</Movie>\n<Movie year=\"2009\">\n  <Title>Zombieland</Title>\n\
  \  <Price>18.95</Price>\n</Movie>\n<Movie year=\"2010\">\n  <Title>The King's Speech</Title>\n\
  \  <Price>17.95</Price>\n</Movie>\n<Movie year=\"2013\">\n  <Title>Star Trek Into\
  \ Darkness</Title>\n  <Price>19.95</Price>\n</Movie>\n</Movies>\n```\n\n## 使用 DTD\n\
  \nXML 文档可以包含一个 `DTD`，它精确规定了哪些元素可以出现在 XML 文档中以及这些元素的出现顺序。`DTD` 是 `Document Type Definition”（文档类型定义）的缩写，但这在考试中不会出现。\n\
  \n例如，一个关于电影的 XML 文档的 `DTD` 可以规定每个 `Movie` 元素必须包含 `Title` 和 `Price` 子元素，以及一个名为 `year`\
  \ 的属性。它还可以规定根元素必须命名为 `Movies` 并由任意数量的 `Movie` 元素组成。\n\n`DTD` 的主要目的是规定 XML 文档的结构，以便文档用户知道如何解释它。`DTD`\
  \ 的另一个同样重要的用途是 `validate`（验证）文档，以确保它没有结构性错误。例如，如果你创建一个为一个电影两个标题的 `Movies` XML 文档，你可以使用\
  \ `DTD` 来检测该错误。\n\n你可以将 XML 文档的 `DTD` 存储与 XML 数据相同的文件中，但更多情况下，你会将 `DTD` 存储在单独的文件。这样，你可以使用一个\
  \ `DTD` 管理多个相同类型 XML 文档的格式。要指定包含 `DTD` 的文件名，可以在 XML 文档中添加 `<!DOCTYPE>` 声明。例如：\n\n\
  ```\n<!DOCTYPE Movies SYSTEM \"movies.dtd\">\n```\n\n在这里，XML 文件被识别为 `Movies` 文档，其\
  \ `DTD` 可以在 `movies.dtd` 文件中找到。将此标签添加到 `movies.xml` 文件的开头，紧跟 `<?xml>` 标签之后。\n\n\
  列表 5-2 显示了列表 5-1 所示 `movies.xml` 文件的 `DTD` 文件。\n\n### 用于 movies.xml 文件的 DTD 文件\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!ELEMENT Movies (Movie*)>\n\
  <!ELEMENT Movie (Title, Price)>\n<!ATTLIST Movie year CDATA #REQUIRED>\n<!ELEMENT\
  \ Title (#PCDATA)>\n<!ELEMENT Price (#PCDATA)>\n```\n\n`DTD` 中的每个 `ELEMENT` 标签都定义了可以出现在文档中的元素类型，并指示了该元素类型的内容可以包含什么。`ELEMENT`\
  \ 标签的通用形式如下：\n\n```\n<!ELEMENT *element* (*content*)>\n```\n\n使用表 5-1 中列出的规则来表示内容。\n\
  \n例如，我在列表 5-2 中展示的 `DTD` 中的第一个 `ELEMENT` 标签说明 `Movies` 元素由零或多个 `Movie` 元素组成。第二个\
  \ `ELEMENT` 标签说明 `Movie` 元素由一个 `Title` 元素后跟一个 `Price` 元素组成。第三和第四 `ELEMENT` 标签说明\
  \ `Title` 和 `Price` 元素由文本数据组成。\n\n如果这种表示法看起来似眼熟悉，那是因为源于正则表达式。\n\n`ATTLIST` 标签提供了每个属性的名称。它的通用形式如下：\n\
  \n```\n<!ATTLIST *element attribute type default-value*>\n```\n\n### 表 5-1：指定元素内容\n\
  \n| 内容 | 描述 |\n| :--- | :--- |\n| `element*` | 指定的元素可以出现 0 次或多次。 |\n| `element+`\
  \ | 指定的元素可以出现 1 次或多次。 |\n| `element?` | 指定的元素可以出现 0 次或 1 次。 |\n| `element1|element2`\
  \ | 可以出现 `element1` 或 `element2`。 |\n| `element1, element2` | 出现 `element1`，随后出现\
  \ `element2`。 |\n| `#PCDATA` | 允许文本数据。 |\n| `ANY` | 允许任何子元素。 |\n| `EMPTY` | 不允许任何类型的子元素。\
  \ |\n\n以下是该标签的拆解：\n\n- `element` 指定属性可以出现的元素名称。\n- `attribute` 提供了属性的名称。\n- `type`\
  \ 指定了可以作为属性值的内容。该类型可以是表 5-2 中列出的任何项。\n- `default` 提供了默认值并指示该属性是必选的可选的。`default`\
  \ 可以是表 5-3 中列出的任何项。\n\n### 表 5-2：属性类型\n\n| 元素 | 属性值 . . . |\n| :--- | :--- |\n|\
  \ `CDATA` | 可以是任意字符串。 |\n| `(string1|string2...)` | 可以列出的字符串之一。 |\n| `NMTOKEN` |\
  \ 必须是一个`name token`（名称令牌），由字母和数字组成的字符串。 |\n| `NMTOKENS` | 必须是一个或多个由空格分隔的名称令牌。 |\n\
  | `ID` | 是一个必须是唯一的名称令牌。也就是说，文档中没有其他元素可以对此属性具有相同的值。 |\n| `IDREF` | 必须与文档其他地方使用的 `ID`\
  \ 值相同。 |\n| `IDREFS` | 是由空格分隔的 `IDREF` 值列表。 |\n\n### 表 5-3：属性默认值\n\n| 默认 | 必选？ |\n\
  | :--- | :--- |\n| `#REQUIRED` | 必选。 |\n| `#IMPLIED` | 可选。 |\n| `#FIXED` | 可选 |\n\
  \n## 与 XML 操作\n\n### 以两种方式处理 XML\n\n通常，你可以使用两种方法之一来处理 XML 文档：\n\n- **DOM**: 代表 Document\
  \ Object Model（文档对象模型）。DOM 的基本思想是从文件中读取整个 XML 文档到内存中，文档以树的形式存储在其中。然后，你可以以任何想要的方式处理元素（称为\
  \ `nodes` 节点）。如果你更改了任何节点，可以将文档写回文件。\n- **SAX**: 代表 Simple API for XML（XML 简单接口）。SAX\
  \ 是一种处理 XML 的只读技术，允许你从文件读取 XML 文档的元素并对其做出反应。由于 SAX 不需要一次性存储整个 XML 文档，因此它经常用于大型 XML\
  \ 文档。\n\n在本节中，我将介绍使用 DOM 从 XML 文档提取信息的基础。DOM 在内存中将 XML 文档表示为 `Node` 对象的树。图 5-1 显示具有两个\
  \ `Movie` 元素的 XML 文档的简化 DOM 树。注意根元素（`Movies`）是一个节点，每个 `Movie` 元素是一个节点，每个 `Title`\
  \ 和 `Price` 元素也是节点。此外，文本值存储在其所属元素的子节点。因此，`Title` 和 `Price` 元素各有一个包含文本子节点。\n\n###\
  \ 读取 DOM 文档\n\n在处理 DOM 文档之前，你必须从 XML 文件将文档读入内存。你可能会认为这是一个相当直接的问题，但遗憾的是它涉及到一些复杂的指令。与其遍历必须使用的所有类和方法，我直接查看完整方法的代码，该方法接受包含文件名的\
  \ `String` 作为参数，并返回 `Document` 对象作为返回值。在此过程中，你会发现每个类和方法的作用。\n\n```java\nprivate\
  \ static Document getDocument(String name)\n{\n  try\n  {\n    DocumentBuilderFactory\
  \ factory =\n    DocumentBuilderFactory.newInstance();\n    factory.setIgnoringComments(true);\n\
  \    factory.setIgnoringElementContentWhitespace(true);\n    factory.setValidating(true);\n\
  \    DocumentBuilder builder =\n    factory.newDocumentBuilder();\n```\n\n\n\n\n\
  \n```java\nreturn builder.parse(new InputSource(name));\n\n} catch (Exception e)\
  \ {\n    System.out.println(e.getMessage());\n}\n\nreturn null;\n}\n```\n\n## 创建\
  \ DocumentBuilderFactory\n\n上一个示例的第一语句调用了 `DocumentBuilderFactory` 类的 `newInstance`\
  \ 方法来创建一个新的 `DocumentBuilderFactory` 对象。`DocumentBuilderFactory` 的工作是创建 `DocumentBuilder`\
  \ 对象，这些对象可以读取 XML 输入并在内存中创建 DOM 文档。\n\n为什么不调用 `DocumentBuilderFactory` 的构造函数呢？事实证明\
  \ `DocumentBuilderFactory` 是一个抽象类，因此它没有构造函数。`newInstance` 是一个静态方法，它根据你的系统配置来决定创建哪个类的实例。\n\
  \n## 配置 DocumentBuilderFactory\n\n在获取 `DocumentBuilderFactory` 之后，你可以配置它以你想要的方式读取文档。接下来的三语句配置了三个应用于由此工厂对象创建的文档构建器的选项：\n\
  \n```java\nfactory.setIgnoringComments(true);\nfactory.setIgnoringElementContentWhitespace(true);\n\
  factory.setValidating(true);\n```\n\n这里让我们更详细地查看这些语句：\n\n- `setIgnoringComments`\
  \ 方法告诉文档构建器不要为 XML 文件中的注释创建节点。大多数 XML 文件不包含注释，但如果包含，它们也不是文档所表示的数据的一部分，因此可以安全地忽略。设置此选项会导致它们被自动忽略。（如果你不设置此选项，将为文档中的每条注释创建一个节点，由于你无法预测注释会在何时或何地出现，你的程序必须检查它所处理的每个节点，以确保该节点不是注释。）\n\
  - `setIgnoringElementContentWhitespace` 方法导致文档构建器忽略任何不是文本值部分的空白字符。如果你不包含此选项，DOM\
  \ 文档将包含表示空白字符的节点。这些空白节点唯一的用处就是让 DOM 文档变得更难处理，因此你应该始终设置此选项。\n- `setValidating` 方法告诉文档构建器，如果输入\
  \ XML 指定了 DTD，则对输入进行验证。验证输入也可以极大地简化你的程序，因为你确信了 DOM 文档符合 DTD 的要求。如果你正在处理本章之前列表 5-1\
  \ 所示的 `movies.xml` 文件，你确切知道 `Movie` 元素的第一个子元素是 `Title` 元素，第二个子元素是 `Price` 元素。如果没有验证，你只知道\
  \ `Movie` 元素的第一个子元素*应该是*一个 `Title` 元素，但你必须对其进行检查以确保。\n\n## 创建文档构建器和文档\n\n设置好选项后，你可以调用\
  \ `newDocumentBuilder` 方法创建一个文档构建器，如下所示：\n\n```java\nDocumentBuilder builder = factory.newDocumentBuilder();\n\
  ```\n\n在这里，文档构建器由名为 `builder` 的变量引用。最后，你可以通过调用文档构建器的 `parse` 方法来创建 DOM 文档。该方法接受一个\
  \ `InputSource` 对象作为参数。幸运的是，`InputSource` 类有一个接受 `filename` 参数的构造函数，并返回与文件关联的输入源。因此你可以在一个语句中创建输入源、解析\
  \ XML 文件、创建 DOM 文档并将 DOM 文档返回给调用者：\n\n```java\nreturn builder.parse(new InputSource(name));\n\
  ```\n\n注意这些方法中的几个会抛出异常。特别是 `newDocumentBuilder` 会抛出 `ParserConfigurationException`，而\
  \ `parse` 会抛出 `IOException` 和 `SAXException`。为了保持此示例简单，我在一个 catch 句中捕获了所有异常并将异常消息打印到控制台。\n\
  \n## 使用 getDocument 方法\n\n通过添加 `getDocument` 方法，你可以通过一个语句从文件创建 DOM 文档，例如：\n\n```java\n\
  Document doc = getDocument(\"movies.xml\");\n```\n\n在这里，通过 `getDocument` 方法获取 DOM\
  \ 文档：\n\n```java\nimport javax.xml.parsers.*;\nimport org.w3c.dom.*;\nimport org.xml.sax\n\
  ```\n\n`DocumentBuilderFactory` 用于创建文档。\n\n## 读取 DOM 节点\n\n当你有了 DOM 文档后，可以轻松从文档中检索数据。DOM\
  \ 的 API 是基于接口而不是类：\n\n- **Document** 接口表示文档。`Node` 接口提供了所有节点的方法。表 5-4 列出了这些常用的方法。\n\
  \n### 表 5-4：Node 接口\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `NodeList getChildNodes()`\
  \ | 获取子节点的 `NodeList` 对象。 |\n| `Node getFirstChild()` | 获取第一个子节点。 |\n| `Node getLastChild()`\
  \ | 获取最后一个子节点。 |\n| `int getNodeType()` | 获取指示节点类型的 `int`。该值可以是下表列出的字段之一。 |\n| `String\
  \ getNodeValue()` | 获取节点的值（如果该节点有值）。 |\n| `Node getNextSibling()` | 获取下一个兄弟节点。 |\n\
  | `Node getPrevSibling()` | 获取上一个兄弟节点。 |\n| `boolean hasChildNodes()` | 判断节点是否有任何子节点。\
  \ |\n\n| 字段 | 描述 |\n| :--- | :--- |\n| `ATTRIBUTE_NODE` | 节点是属性节点。 |\n| `CDATA_SECTION_NODE`\
  \ | 节点具有内容数据。 |\n| `COMMENT_NODE` | 节点是注释。 |\n| `DOCUMENT_NODE` | 节点是文档节点。 |\n|\
  \ `ELEMENT_NODE` | 节点是元素节点。 |\n| `TEXT_NODE` | 节点是文本节点。 |\n\n- **Element** 接口表示\
  \ XML 文档中的元素。`Element` 继承自 `Node`，因此实现 `Element` 的对象也是 `Node`。表 5-5 列出了该接口的一些常用方法。\n\
  \n### 表 5-5：Element 接口 \n\n| 方法 | 描述 |\n| :--- | :--- |\n| `String getAttribute(String\
  \ name)` | 获取指定属性的值。 |\n| `NodeList getElementsByTagName(String name)` | 获取包含此元素内部且具有指定名称的所有元素节点的\
  \ `NodeList` 对象。 |\n| `boolean hasAttribute(String name)` | 判断元素是否具有指定属性。 |\n\n\
  - **Text**：元素的文本内容并不包含在元素本身，而是存储作为元素子节点的 `Text` 节点中。`Text` 接口有一些有趣方法你可能想要查找，但对于大多数应用程序，你只需要使用继承自\
  \ `Node` 接口的 `getNodeValue` 方法来检索文本节点存储的文本。\n\n\n\n\n与 Java 中几乎所有其他索引一样，第一个节点的索引是\
  \ 0，而不是 1。）\n\n## 处理元素\n\n假设你在构建文档时使用 DTD 来验证 XML 文件，那么你通常可以通过遍历文档来获取所需的信息，而无需诉助于\
  \ `NodeList` 对象。这里有一个例程，它在将 `movies.xml` 文件解析为名为 `doc` 的 `Document` 对象后（本章前面的的列表\
  \ 5-1 所示），简单地统计文件中所有 `Movie` 元素的数量：\n\n```\nint count = 0;\nElement root = doc.getDocumentElement();\n\
  Node movie = root.getFirstChild();\nwhile (movie != null)\n{\n    count++;\n   \
  \ movie = movie.getNextSibling();\n}\nSystem.out.println(\"There are \" + count\
  \ + \" movies.\");\n```\n\n该方法首先调用 `getFirstChild` 方法获取根元素的第一个子节点。然后，它使用每个子元素的 `getNextSibling`\
  \ 方法获取下一个也是根元素子节点的元素。\n\n如果你运行一个包含这些行的程序，控制台将会显示以下内容：\n\nThere are 10 movies.\n\n\
  此程序对 `Movie` 元素除了计数之外没有进行任何操作，但在下一节（“获取属性值”）中，你将看到如何从 `Movie` 元素中提取数据。\n\n处理 `movies.xml`\
  \ 文件所有元素的另一种方法是使用 `getChildNodes` 方法返回一个包含所有元素的 `NodeList` 对象。然后，你可以使用 `for` 循环逐个访问每个元素。这是一个列出每个元素名称的代码片段：\n\
  \n```\nElement root = doc.getDocumentElement();\nNodeList movies = root.getChildNodes();\n\
  for (int i = 0; i < movies.getLength(); i++)\n{\n    Node movie = movies.item(i);\n\
  \    System.out.println(movie.getNodeName());\n}\n```\n\n在这里，`item` 方法被用于 `for`\
  \ 循环中以检索每个 `Movie` 元素。如果你运行一个包含这些行的程序，控制台将显示十行带有 `Movie` 单词的输出。\n\n## 获取属性值\n\n\
  要获取元素属性的值，请调用 `getAttribute` 方法并将属性名称作为参数传递。此代码返回属性的字符串值。然后，如果有必要，你可以将此值转换为其他类型。注意，该值可能包含某些空格，因此你应该通过\
  \ `trim` 方法处理该值以去除多余的空格。\n\n这是一个示例，它获取 `movies.xml` 文件中每个电影的 `year` 属性，并确定集合中最旧电影的年份：\n\
  \n```\nElement root = doc.getDocumentElement();\nElement movie = (Element)root.getFirstChild();\n\
  int oldest = 9999;\nwhile (movie != null)\n{\n    String s = movie.getAttribute(\"\
  year\");\n    int year = Integer.parseInt(s);\n    if (year < oldest)\n        oldest\
  \ = year;\n    movie = (Element)movie.getNextSibling();\n}\nSystem.out.println(\"\
  The oldest movie in the file \" + \"is from \" + oldest + \".\");\n```\n\n通过这两行代码提取了\
  \ `year` 属性：\n\n```\nString s = movie.getAttribute(\"year\");\nint year = Integer.parseInt(s);\n\
  ```\n\n第一行获取 `year` 属性的字符串值，第二行将其转换为 `int`。\n\n注意此方法中进行的额外类型转换。这是必要的，因为 `movie`\
  \ 变量必须是 `Element` 类型，你才能调用 `getAttribute` 方法。然而，`getNextSibling` 方法返回的是 `Node` 而不是\
  \ `Element`。因此，除非你先将其强制转换为 `Element`，否则编译器不允许将节点赋值给 `movie` 变量。\n\n## 获取子元素值\n\n\
  你可能会惊讶地发现元素的文本内容并不是存储在元素中的。相反，它存储在类型为 `Text` 的子节点中。考虑以下 XML：\n\n```xml\n<Title>The\
  \ Princess Bride</Title>\n```\n\n该元素在 XML 文档中产生两个节点：一个名为 `Title` 的 `Element` 节点和一个包含文本\
  \ `The Princess Bride` 的 `Text` 节点。\n\n因此，如果你有一个 `Title` 元素，你必须在获取文本内容之前获取 `Text`\
  \ 元素，例如所示：\n\n```\nNode textElement = titleElement.getFirstChild();\nString title\
  \ = textElement.getNodeValue();\n```\n\n如果你喜欢把代码写得简洁一些，可以使用这样的单语句：\n\n```\nString\
  \ title = titleElement.getFirstChild().getNodeValue();\n```\n\n如果你觉得这个咒语有点冗长，并且在程序中大量使用它，可以为自己写一个简单的辅助方法，像下面这样：\n\
  \n```java\nprivate static String getTextValue(Node n)\n{\n    return n.getFirstChild().getNodeValue();\n\
  }\n```\n\n然后你就可以通过调用 `getTextValue` 方法获取元素的文本内容，如下：\n\n```\nString title = getTextValue(titleElement);\n\
  ```\n\n在获取文本内容后，如果需要，你可以将其解析为数值类型。\n\n## 汇总：一个程序\n\n### 列出电影\n\n现在你已经看到了用于从 XML\
  \ 文件中获取数据的各种接口和类，列表 5-3 显示了一个完整的程序，它读取 `movies.xml` 文件（本章前面的 5-1 所示）并在控制台上列出每个电影的标题、年份和价格。当你运行此程序时，控制台将显示如下：\n\
  \n**列表 5-3:**\n\n```java\nimport javax.xml.parsers.*;\nimport org.xml.sax.*;\nimport\
  \ org.w3c.dom.*;\nimport java.text.*;\n\npublic class ListMovies\n{\n    private\
  \ static NumberFormat cf = NumberFormat.getCurrencyInstance();\n\n    public static\
  \ void main(String[] args)\n    {\n        Document doc = getDocument(\"movies.xml\"\
  );\n        Element root = doc.getDocumentElement();\n        Element movieElement\
  \ = (Element)root.getFirstChild();\n        Movie m;\n        while (movieElement\
  \ != null)\n        {\n            m = getMovie(movieElement);\n            String\
  \ msg = Integer.toString(m.year);\n            msg += \": \" + m.title;\n      \
  \      msg += \" (\" + cf.format(m.price) + \")\";\n            System.out.println(msg);\n\
  \            movieElement = (Element)movieElement.getNextSibling();\n        }\n\
  \    }\n\n    private static Document getDocument(String name)\n    {\n        try\n\
  \        {\n            DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
  \            factory.setIgnoringComments(true);\n            factory.setIgnoringElementWhitespace(true);\n\
  \            factory.setValidating(true);\n            DocumentBuilder builder =\
  \ factory.newDocumentBuilder();\n            return builder.parse(new InputSource(name));\n\
  \        }\n        catch (Exception e)\n        {\n            System.out.println(e.getMessage());\n\
  \        }\n        return null;\n    }\n\n    private static Movie getMovie(Element\
  \ e)\n    {\n        // get the year attribute\n        String yearString = e.getAttribute(\"\
  year\");\n        int year = Integer.parseInt(yearString);\n        // get the Title\
  \ element\n        Element tElement = (Element)e.getFirstChild();\n        String\
  \ title = getTextValue(tElement).trim();\n        // get the Price element\n   \
  \     Element pElement = (Element)tElement.getNextSibling();\n        String pString\
  \ = getTextValue(pElement).trim();\n        double price = Double.parseDouble(pString);\n\
  \        return new Movie(title, year, price);\n    }\n\n    private static String\
  \ getTextValue(Node n)\n    {\n        return n.getFirstChild().getNodeValue();\n\
  \    }\n\n    private static class Movie\n    {\n        public String title;\n\
  \        public int year;\n        public double price;\n\n        public Movie(String\
  \ title, int year, double price)\n        {\n            this.title = title;\n \
  \           this.year = year;\n            this.price = price;\n        }\n    }\n\
  }\n```\n\n由于该程序的所有代码在本章的其他地方已经出现过，下面的段落仅简单描述该程序中每个方法的功能：\n\n**处理 XML**\n\n1. 哇，需要导入这么多包。真遗憾\
  \ Java 的设计者……\n\n\n\n无法将所有 XML 类都放在一个 `big` 包中。\n\n→**11**\n`main` 方法首先通过调用 `getDocument`\
  \ 方法从文件 `movies.xml` 中获取一个 `Document` 对象。然后，它获取根元素 `CHAPTER`，并使用 `while` 循环遍历所有的子元素。你已经知道这些子元素是\
  \ `Movie` 元素，因为文档在解析时已经通过了验证。在处理每个 `Movie` 元素时，它会被传递给 `getMovie` 方法，该方法会提取 `year`\
  \ 属性以及 `title` 和 `price` 元素，并返回一个 `Movie` 对象。最后，在控制台上打印该电影信息。\n\n→**29**\n`getDocument`\
  \ 方法接受文件名作为参数并返回一个 `Document` 对象。在创建 `DocumentBuilder` 对象之前，它会设置配置选项，以忽略注释和空白字符，并对\
  \ XML 文件进行验证。由于 XML 文件经过了验证，因此你必须创建一个 DTD 文件（如本章前面列表列表 5-2 中的文件）。此外，你必须用 `DOCTYPE`\
  \ 声明开始 XML 文件（例如 `<!DOCTYPE Movies SYSTEM \"movies.dtd\">`）。\n\n→**49**\n`getMovie`\
  \ 方法接收一个代表 `Movie` 元素的 `Element` 对象。它提取 `year` 属性，获取 `title` 元素的文本值，并将 `price` 元素的文本值解析为\
  \ `double`。然后，它使用这些值创建一个新的 `Movie` 对象并返回给调用者。\n\n→**65**\n`getTextValue` 方法只是一个简单的辅助方法，用于从节点中获取文本内容。该方法假设节点拥有一个包含文本值的子节点，因此除非你确定情况如此，否则不应调用此方法。（由于\
  \ XML 文档经过了验证，所以你是的。）\n\n→**70**\n`Movie` 类是一个私有内部类，表示单部电影。它使用公共字段来存储 `title`、`year`\
  \ 和 `price` 数据，并提供了一个简单的构造函数来初始化这些字段。\n\n**索引**\n\n**特殊字符与**\n**A**\n**数字**\n格式模式，555\n\
