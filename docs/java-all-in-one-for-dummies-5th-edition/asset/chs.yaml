  \ `do` 循环的每个周期都会玩一轮游戏。在用户表示想停止玩之前，`do` 循环会一直持续。\n*   **13**: 调用 `playARound` 方法玩一轮游戏。\n\
  *   **14**: 调用 `askForAnotherRound` 方法确定用户是否想再玩一轮。该方法返回的布尔值被用作 `do` 循环的表达式。因此，如果\
  \ `askForAnotherRound` 方法返回 `true`，则`do` 循环重复。\n*   **18**: `playARound` 方法的开始。\n\
  *   **25**: 调用 `getRandomNumber` 方法获取一个 1 到 10 之间的随机数。该方法返回的值存储在 `number` 中。\n*\
  \   **31**: 调用 `getGuess` 方法获取用户的猜测。该方法返回的值存储在 `guess` 变量中。\n*   **41**: `getRandomNumber`\
