  # 使用递归\n第 3 章 **使用递归** 537\n\n![Image 53](img/index-561_1.jpg)\n\n## 本章内容\n- » 理解人类和计算机的日期时间\n\
  - » 使用 `java.time` 类来表示日期和时间\n- » 比较日期和时间\n- » 对日期和时间进行计算\n- » 格式化日期和时间\n\n# 第 4\
  \ 章：处理日期和时间\n\n真的有人知道现在几点吗？真的有人人在乎时间吗？*芝加哥交通局*（后来简称为*芝加哥*）的罗伯特·拉姆在 1969 年曾这样思考过。\n\
  \n我不确定在 1969 年谁很在乎时间，但我知道 1995 年设计 Java 初版版本的人并不怎么在乎它，至少从他们在 `java.util` 包中提供的用于处理时间和日期的弱势类可以证明这一点。Java\
  \ 程序员长期以来一直在与涉及日期和时间的简单计算作斗争，例如确定今天 45 天后是哪一天，或者计算两个给定日期之间的天数。\n\n随着 Java 8 的发布，Java\
  \ 终于跟上了时代，它引入了一个用于处理日期和时间的全新框架，通常被称为 Date-Time API（日期时间 API）。这个新 API 非常复杂，涉及大约 50\
  \ 个新类和接口以及数百个新方法。在本章中，我将向你介绍新 Date-Time API 中最重要且实用的几个类。然后你可以通过 Oracle 的文档 `http://download.java.net/jdk9/docs/api/index.html/`\
  \ 在线探索其余。\n\n## 思考时间是如何表示的\n在开始介绍新 Date-Time API 类的细节之前，让我们回顾几个关于时间的几个概念。关于时间，可能最重要的基本概念（至少从编程的角度来看）是计算机和人类使用两种完全不同的方法来记录时间。\n\
  \n人类使用一套逐渐变长的单位系统来测量时间，从秒开始，增加到分钟、小时、天、周、月、年、十年和世纪。我们的人类时间单位在直觉上很熟悉，但它们的精确定义比你想象的要复杂得多。各种因素都会弄乱我们表示时间的方式：闰日、时区和夏令时。你知道吗，大约每\
  \ 18 个月，科学家就会挑选一天（他们通常选择 6 月 30 日或 12 月 31 日），在那一天增加一秒？这是必要的，因为地球自转速度会有细微变化，导致我们的时钟偏差。\n\
  \n相比之下，计算机记录时间的方式要简单得多：计算机只需计算从给定开始时间以来经过的单位数（通常是毫秒或纳秒）。因此，对于计算机来说，时间就是一个数字。在 Java\
  \ 中，机器时间被设置为自 1970 年 1 月 1 日午夜以来所经过的纳秒数。为什么是 1970 年 1 月 1 日？除了历史原因外没有特别的理由：Java\
  \ 从 Unix 操作系统那里继承了那个日期，而 Unix 是在 20 世纪 70 年代开发的。（更多信息，请参见侧边栏“你还以为世纪 K 问题已经糟糕了！”）\n\
  \n微软 Windows 的设计者决定使用 1601 年 1 月 1 日作为他们时钟的起始日。我想那对威廉·莎士来说是一个意义非凡的年份；1601 年他可以使用第一版本的\
  \ Word 来编写他的戏剧。\n\n### 你还以为世纪 K 问题已经糟糕了！\n原始的 Unix 使用带符号的 32 位数字来计算时间，并以秒而非纳秒计数。因此，在\
  \ Unix 中，时间表示为自 1970 年 1 月 1 日以来经过的秒数。因为带符号 32 位数字能表示的最大数字较小，Unix 时间将在 2038 年 1\
  \ 月 19 日结束。今天，大多数 Unix 和 Linux 系统已经升级为使用 64 位数字来计数，因此这些系统的世界不会在 2038 年结束。但仍使用旧式\
  \ 32 位时间的系统将在 2038 年崩溃。我已经开始期待世界末日派了。\n\n人类和计算机记录时间的差异使得任何处理日期的计算机程序都变得有些棘手。例如，假设你想在两个人之间安排通话，一个在洛杉矶，另一个在纽约。显然，你们约定的时间必须考虑到每个参与者的时区。或者假设你想计算发票日期\
  \ 45 天后的截止日期。计算截止日的算法必须意识到 1 月有 31 天，2015 年的 2 月有 28 天。幸运的是，新的 Date-Time API 设计旨在为你处理所有细节。\n\
  \n## 为你的应用程序选择正确的日期时间类\n开发处理日期或时间（或两者）的应用程序时，首要任务是选择表示日期时间值的日期时间类。`java.time` 包定义了十个不同的类来表示不同类型的时间日期，如表\
  \ 4-1 所示。\n\n**表 4-1：java.time 中的十个日期时间类**\n\n| 类 | 表示的内容 |\n| :--- | :--- |\n|\
  \ `LocalTime` | 不关联时区的时间（小时、分钟和秒，精确到纳秒）。 |\n| `LocalDate` | 不关联时区的日期（年、月、日）。 |\n\
  | `LocalDateTime` | 不关联时区的日期和时间。 |\n| `OffsetTime` | 时间以及相对于 UTC（协调世界时，也称为格林治时间）的偏移。\
  \ |\n\n\n\n\n平均时间（Mean），例如 12:30:00-8.00，这意味着时间是 12:30，且相对于 UTC 有 -8 小时的偏移。\n\n\
  `OffsetDateTime`\n具有 UTC 偏移量的日期和时间。\n\n`ZonedDateTime`\n具有关联时区的日期和时间，例如 `America/Los_Angeles`。\n\
  \n`MonthDay`\n不关联年份的月份和日期。你可以使用 `MonthDay` 对象来表示生日、周年纪念或节日的日期。\n\n`YearMonth`\n\
  年份和月份，例如 2015 年 12 月。年份和月份没有关联日期、时间或时区值。\n\n`Year`\n年份，例如 2038 年。年份没有关联月份、日期、时间或时区值。\n\
  \n`Instant`\n单一的时间点，内部表示为自 1970 年 1 月 1 日午夜以来经过的纳秒数。该值假设 UTC/GMT 时间偏移量为 0。\n\n这些类中的都有许多不同的方法，允许你创建日期和时间对象、对它们进行计算、比较它们，并将它们转换为可以供人类显示和读取的字符串。你可以在线找到这些类方法的完整文档，[位于\
  \ `http://download.java.net/jdk9/docs/api/index.html`]。\n\n## 使用 now 方法创建日期-时间对象\n\
  \n所有日期-时间类都有一个静态的 `now` 方法，该方法创建一个表示当前日期和/或时间的对象。例如，要获取当前日期，你可以使用下面的代码：\n\n```java\n\
  LocalDate date = LocalDate.now();\n```\n\n要获取带时区的当前日期时间，请使用此代码：\n\n```java\nZonedDateTime\
  \ datetime = ZonedDateTime.now();\n```\n\n以下程序使用所有十个类显示当前时间，使用 `now()` 创建每个类的对象并使用\
  \ `toString()` 将其打印出来：\n\n```java\nimport java.util.*;\nimport java.time.*;\n\n\
  public class TimeTester\n{\n    public static void main(String[] args)\n    {\n\
  \        System.out.println(\"\\nLocalTime: \"\n        + LocalTime.now().toString());\n\
  \        System.out.println(\"\\nLocalDateTime: \"\n        + LocalDateTime.now().toString());\n\
  \        System.out.println(\"\\nZonedDateTime: \"\n        + ZonedDateTime.now().toString());\n\
  \        System.out.println(\"\\nOffsetTime: \"\n        + OffsetTime.now().toString());\n\
  \        System.out.println(\"\\nOffsetDateTime: \"\n        + OffsetDateTime.now().toString());\n\
  \        System.out.println(\"\\nMonthDay: \"\n        + MonthDay.now().toString());\n\
  \        System.out.println(\"\\nYearMonth: \"\n        + YearMonth.now().toString());\n\
  \        System.out.println(\"\\nInstant: \"\n        + Instant.now().toString());\n\
  \    }\n}\n```\n\n如果你编译并运行此程序，输出将类似于所示所示：\n\n```text\nLocalTime: 20:56:26.325\n\
  LocalDateTime: 2013-10-07T20:56:26.388\nZonedDateTime: 2013-10-07T20:56:26.388-07:00[America/Los_Angeles]\n\
  OffsetTime: 20:56:26.388-07:00\nOffsetDateTime: 2013-10-07T20:56:26.388-07:00\n\
  MonthDay: --10-07\nYearMonth: 2013-10\nInstant: 2013-10-08T03:56:26.388Z\n```\n\n\
  从此输出中，你可以了解各种日期-时间类所表示的信息。\n\n## 使用 parse 方法创建日期-时间对象\n\n创建日期-时间对象的另一种方法是使用静态的 `parse`\
  \ 方法，它可以从表示特定日期或时间的字符串创建日期-时间对象。例如，以下代码创建一个表示 2014 年 12 月 15 日的 `LocalDate` 对象：\n\
  \n```java\nLocalDate d = LocalDate.parse(\"2014-12-15\");\n```\n\n要创建一个表示特定日期特定时间的\
  \ `LocalDateTime` 对象，请使用 `parse` 方法。这里是一个示例，将时间设置为 2014 年 12 月 15 日下午 3:45：\n\n\
  ```java\nLocalDateTime dt;\ndt = LocalDateTime.parse(\"2014-12-15T15:45\");\n```\n\
  \n注意字母 `T` 分隔了日期和时间，时间以 24 小时制格式表示。如果你需要更精确，还可以指定秒，如此示例所示：\n\n```java\ndt = LocalDateTime.parse(\"\
  2014-12-15T15:45:13.5\");\n```\n\n这里的时间设置为下午 2:45 之后的 13.5 秒。\n\n如果字符串格式不正确，`parse`\
  \ 方法将抛出 `DateTimeParseException`。每当你使用 `parse` 方法时，都应该将其封装在 `try-catch` 块中，如此示例所示：\n\
  \n```java\nLocalDateTime dt;\ntry {\n    dt = LocalDateTime.parse(\"2014-12-15T15:45\"\
  );\n} catch (DateTimeParseException ex) {\n    System.out.println(ex.toString());\n\
  }\n```\n\n`parse` 方法对于将用户输入转换为日期-时间特别有用。例如，你可能会结合 `Scanner` 类使用它从控制台读取日期，或者你可以在\
  \ Swing 应用程序中使用它，以便在用户输入格式错误时读取日期。\n\n因此，你可以这样创建一个日期：\n\n```java\nLocalDate date\
  \ = LocalDate.of(2014,Month.DECEMBER,15);\n```\n\n有趣的是，`Month` 枚举有一些有趣的方法，你可能会偶尔发现它们很有用。例如，你可以这样打印\
  \ 12 月的天数：\n\n```java\nSystem.out.println(\"December hath \" + Month.DECEMBER.length(false)\
  \ + \" days.\");\n```\n\n`length` 方法中的布尔值参数表示计算是否针对闰年进行。\n\n\n\n\n要创建一个 `ZonedDateTime`，你必须首先使用\
  \ `ZoneId` 类创建一个时区对象。要创建一个时区，你必须知道想要创建的时区的标准名称。遗憾的是，有 500 多个不同的时区 ID，而且它们会定期发生变化。因此，在这里列出它们是不行的，但你可以使用下面这段方便的代码轻松地列出它们：\n\
  \n```java\nfor (String id : ZoneId.getAvailableZoneIds())\n    System.out.println(id);\n\
  ```\n\n这个 `for` 循环会将每个 `ZoneId` 的名称写入控制台。一旦你知道了想要使用的 `ZoneId` 名称，就可以使用 `ZoneId.of()`\
  \ 创建它，然后像这个示例所示使用它来创建一个 `ZonedDateTime`：\n\n```java\nZoneId z = ZoneId.of(\"America/Los_Angeles\"\
  );\nZonedDateTime zdate;\nzdate = ZonedDateTime.of(2014, 12, 15, 0, 0, 0, 0, z);\n\
  ```\n\n或者，如果你愿意，可以在创建 `ZonedDateTime` 的时候直接创建 `ZoneId`：\n\n```java\nzdate = ZonedDateTime.of(2014,\
  \ 12, 15, 0, 0, 0, 0,\n    ZoneId.of(\"America/Los_Angeles\"));\n```\n\n# 第 4 章\
  \ 日期与时间处理\n\n## 使用 ZoneOffset 类\n\n`OffsetTime` 和 `OffsetDateTime` 类的 `of` 方法使用一个名为\
  \ `ZoneOffset` 的额外类来表示相对于 UTC 的偏移量。你可以使用 `ZoneOffset` 类的任何方法来创建 `ZoneOffset`：\n\n\
  - `of(String offsetId)`\n- `ofHours(int hours)`\n- `ofHoursMinutes(int hours, int\
  \ minutes)`\n- `ofHoursMinutesSeconds(int hours, int minutes, int seconds)`\n- `ofTotalSeconds(int\
  \ totalSeconds)`\n\n例如，你可以像这样创建一个偏移为 -8 小时的 `ZoneOffset`：\n\n```java\nZoneOffset\
  \ z = ZoneOffset.ofHours(-8);\n```\n\n或者，你也可以像这个示例那样用字符串指定偏移量：\n\n```java\nZoneOffset\
  \ z = ZoneOffset.of(\"-08:00\");\n```\n\n注意，当你使用字符串偏移量时，必须为小时、分钟和（可选的）秒提供两位。\n\n\
  一旦你有了了 `ZoneOffset` 对象，就可以用它来创建 `OffsetTime`，如这个示例所示：\n\n```java\nOffsetTime time\
  \ = OffsetTime.of(10, 30, 0, 0, z);\n```\n\n或者，如果你愿意，可以在调用 `OffsetTime` 的 `of` 方法时直接创建\
  \ `ZoneOffset`：\n\n```java\nOffsetTime time = OffsetTime.of(10, 30, 0, 0,\n    ZoneOffset.ofHours(-8));\n\
  ```\n\n## 深入观察 LocalDate 类\n\n基础的 `java.time` 类非常相似，一旦学会了如何使用其中一个，你就会发现学习其他的也很容易。因此，在本章的剩余部分，我将只关注一个：`LocalDate`\
  \ 类。该类表示一个日期（年、月、日），而不关联的时间。在本节以及随后的章节中，你将学习如何使用该类的许多方法来提取有关日期的信息、比较两个日期以及对日期进行计算。\n\
  \n表 4-3 显示了 `LocalDate` 类最常用的方法。为了方便起见，该表包含了创建 `LocalDate` 对象所需的方法，尽管这些方法在本章较早之前已经介绍。\n\
  \n### 表 4-3：LocalDate 类的方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| **创建 LocalDate 对象的方法**\
  \ | |\n| `LocalDate now()` | 创建一个表示当前日期的 `LocalDate` 对象。 |\n| `LocalDate of(int\
  \ year, int month, int dayOfMonth)` | 创建具有给定年、月、日的 `LocalDate` 对象。 |\n| `LocalDate\
  \ of(int year, Month month, int dayOfMonth)` | 创建具有给定年、月、日的 `LocalDate` 对象。 |\n\
  | `LocalDate parse(String text)` | 通过解析文本字符串创建 `LocalDate` 对象。 |\n| **提取日期信息的方法**\
  \ | |\n| `int getYear()` | 返回年份。 |\n| `Month getMonth()` | 返回作为 `Month` 对象的月份。 |\n\
  | `int getMonthValue()` | 返回 1 到 12 之间的月份。 |\n| `int getDayOfMonth()` | 返回月份中的某一天。\
  \ |\n| `DayOfWeek getDayOfWeek()` | 返回作为 `DayOfWeek` 对象的星期几。 |\n| `int getDayOfYear()`\
  \ | 返回一年中的第几天。 |\n| `int lengthOfMonth()` | 返回本月的天数。 |\n| `int lengthOfYear()` |\
  \ 返回这一年的天数。 |\n| **比较日期的方法** | |\n| `boolean isAfter(LocalDate other)` | 如果 `other`\
  \ 发生在此日期之后，则返回 true。 |\n| `boolean isBefore(LocalDate other)` | 如果 `other` 发生在此日期之前，则返回\
  \ true。 |\n| `boolean isEqual(LocalDate other)` | 如果此日期和 `other` 表示同一日期，则返回 true。\
  \ |\n| **执行日期计算的方法** | |\n| `LocalDate plusDays(long days)` | 返回增加指定天数后的日期。 |\n\
  | `LocalDate plusMonths(long months)` | 返回增加指定月份后的日期。 |\n| `LocalDate plusWeeks(long\
  \ weeks)` | 返回增加指定周数后的日期。 |\n| `LocalDate plusYears(long years)` | 返回增加指定年份后的日期。\
  \ |\n| `LocalDate minusDays(long days)` | 返回减去指定天数后的日期。 |\n| `LocalDate minusMonths(long\
  \ months)` | 返回减去指定月份后的日期。 |\n| `LocalDate minusWeeks(long weeks)` | 返回减去指定周数后的日期。\
  \ |\n| `LocalDate minusYears(long years)` | 返回减去指定年份后的日期。 |\n| `long until(LocalDate\
  \ endDate, ChronoUnit unit)` | 返回此日期与 `endDate` 之间的差值，单位为指定的。 |\n\n## 获取日期信息\n\n\
  `LocalDate` 类的几个方法可以让你提取有关日期的有用信息。例如，以下示例展示了如何提取年、月、日：\n\n```java\nLocalDate date\
  \ = LocalDate.now();\nint year = date.getYear();\nint month = date.getMonthValue();\n\
  int day = date.getDayOfMonth();\n```\n\n如果你需要知道日期是一年中的第几天，可以使用此代码：\n\n```java\n\
  LocalDate date = LocalDate.parse(\"2016-04-09\");\nSystem.out.println(date.getDayOfYear());\n\
  ```\n\n这个示例将打印 100，因为 4 月 9 日是 2016 年的第 100 天。`getDayOfWeek` 方法返回 `DayOfWeek` 类型，这是一个包含以下值的枚举：SUNDAY、THURSDAY、MONDAY、FRIDAY、TUESDAY、SATURDAY、WEDNESDAY。\n\
  \n这是一个使用方法的示例：\n\n```java\nLocalDate date = LocalDate.parse(\"2016-04-09\");\nSystem.out.println(date.getDayOfWeek());\n\
  ```\n\n在这个示例中，将打印 SATURDAY，因为在 2016 年，4 月 9 日是星期六。\n\n`lengthOfMonth` 和 `lengthOfYear`\
  \ 对于想要知道 `LocalDate` 所代表月份或年份的天数非常有用。\n\n## 比较日期\n\n你不能使用 Java 的标准运算符来比较日期和时间对象。考虑以下示例：\n\
  \n```java\nif (LocalDate.now() == LocalDate.now())\n    System.out.println(\"All\
  \ is right in the universe.\");\nelse\n    System.out.println(\"There must be a\
  \ disturbance in the space-time continuum!\");\n```\n\n如果你运行这段代码，将打印“There must\
  \ be a disturbance in the space-time continuum!”这是因为当运算符用于对象时，测试的是两个表达式是否引用同一个对象，而不是具有相同值的对象。要测试两个日期的相等性，你必须使用\
  \ `isEqual` 方法，如这个示例所示：\n\n```java\nif (LocalDate.now().isEqual(LocalDate.now()))\n\
  \    System.out.println(\"All is right in the universe.\");\n```\n\n同样，你必须使用 `isBefore`\
  \ 或 `isAfter` 方法来确定一个日期是否在另一个日期之前或之后。注意，你可以对返回整数结果的方法内置运算符。因此，以下代码将如你预期的那样工作：\n\n\
  ```java\nif (LocalDate.now().getDayOfMonth() < 15)\n```\n\n\n\n\n```java\nSystem.out.println(\"\
  It is not yet the 15th.\");\n```\n\n由于 `getDayOfMonth` 方法返回一个整数，你可以使用 `<` 运算符来判断本月的\
  \ 15 号是否已经到来。\n\n## 日期计算\n\n就像你不能对日期使用 Java 内置的比较运算符一样，你可能也无法使用内置的数学运算符。相反，你可以使用各种\
  \ `plus` 和 `minus` 方法对日期进行加减操作，并使用 `until` 方法确定两个日期之间的差值。\n\n在进行日期时间计算时，需要考虑的一个重要事实是\
  \ Date-Time 对象是**不可变的**`immutable`）。这意味着一旦你创建了一个 Date-Time 对象，就无法更改它的值。当你对 Date-Time\
  \ 对象执行计算时，结果是一个具有新值的新 Date-Time 对象。\n\n`plus` 和 `minus` 方法允许你向 Date-Time 对象添加各种日期和时间单位。表\
  \ 4-3 列出了 `LocalDate` 类中每种方法的四种变体，允许你对 `LocalDate` 对象增加或减少年、月、周和天。以下代码打印了当前日期、明天的日期，以及现在一周、一月和一年后的日期：\n\
  \n```java\nSystem.out.println(\"Today: \" + LocalDate.now());\nSystem.out.println(\"\
  Tomorrow: \" + LocalDate.now().plusDays(1));\nSystem.out.println(\"Next week: \"\
  \ + LocalDate.now().plusWeeks(1));\nSystem.out.println(\"Next month: \" + LocalDate.now().plusMonths(1));\n\
  System.out.println(\"Next year: \" + LocalDate.now().plusYears(1));\n```\n\n要确定两个日期之间的差值，请使用\
  \ `until` 方法。它计算日期与作为第一个参数的日期之间的差值，以第二个参数指定的单位为测量。例如，以下代码确定了 2014 年 5 月 16 日和 2014\
  \ 年 12 月 15 日之间的天数：\n\n```java\nLocalDate date1 = LocalDate.parse(\"2014-05-16\"\
  );\nLocalDate date2 = LocalDate.parse(\"2014-12-15\");\n```\n\n## 处理日期和时间\n\n```java\n\
  System.out.println(date1.until(date2, ChronoUnit.DAYS));\n```\n\n某些日期计算可能会稍微复杂一些。例如，考虑一家在每月\
  \ 15 号准备发票的企业。以下代码段显示了从当前日期到下一次开票日的天数：\n\n```java\nLocalDate today = LocalDate.now();\n\
  LocalDate invDate = LocalDate.of(today.getYear(), today.getMonthValue(), 15);\n\
  if (today.getDayOfMonth() > 15)\n    invDate = invDate.plusMonths(1);\nlong daysToInvoice\
  \ = today.until(invDate, ChronoUnit.DAYS);\nSystem.out.println(daysToInvoice + \"\
  \ until next invoice date.\");\n```\n\n此示例的工作原理是：首先获取当前日期，然后创建一个代表本月 15 号的新 `LocalDate`\
  \ 对象。然后，如果本月的当前日期大于 15，它会在开票日期上增加一个月。换句话说，如果今天是 16 号或更晚，开票将发生在*下个月*的 15 号，而不是本月。然后它使用\
  \ `until` 方法来确定当前日期与下一次开票日之间的天数。\n\n`ChronoUnit` 是一个枚举，定义了在日期时间计算中可以使用的各种时间单位。可能的值有：\n\
  \n- `CENTURIES`\n- `DAYS`\n- `DECADES`\n- `ERAS`\n- `FOREVER`\n- `HALF-DAYS`\n-\
  \ `HOURS`\n- `MICROS`\n- `MILLENNIA`\n- `MILLIS`\n- `MINUTES`\n- `MONTHS`\n- `NANOS`\n\
  - `SECONDS`\n- `WEEKS`\n- `YEARS`\n\n其中大部分内容都是自言自明的，但其中两个有点特殊：\n\n- `ERA` 指明日期指的是公元（CE，也称为\
  \ AD）还是公元前（BCE，也称为 BC）。\n- `FOREVER` 代表可以表示为持续时间的最大值。遗憾的是，Java 不会让你永生。以下代码会抛出异常：\n\
  \n```java\nLocalDate birthday = LocalDate.parse(\"1959-05-16\");\nbirthday = birthday.plus(1,\
  \ ChronoUnit.FOREVER);\n```\n\n注意 `ChronoUnit` 位于 `java.time.temporal` 包中，因此在使用\
  \ `ChronoUnit` 的任何程序顶部，请务必包含以下述语句：\n\n```java\nimport java.time.temporal.*;\n```\n\
  \n## 日期格式化\n\n如果你使用 `toString()` 方法将 `LocalDate` 转换为字符串，你会得到类似 `2014-10-31` 的字符串。但如果你想以不同的格式显示日期，例如\
  \ `10-31-2014` 或 `October 31, 2014` 怎么办？为了实现这一点，可以使用 `LocalDate` 类的 `format` 方法结合你使用\
