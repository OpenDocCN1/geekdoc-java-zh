  \ 30 7 41 45 34 41 17 36 63 52 50 77\n2 93 48 6 91 67 34 69 33 47 50 12 88 15 65\
  \ 40 29 74 34 55\n37 28 25 98 66 69 88 66 27 29 29 29 29 9 29 77 32 4\n11 68 40\
  \ 17 61 50 90 24 1 59 91 5 82 69 51 45 29 38 61\n\n排序后的数组：\n1 2 4 5 6 7 8 9 11 12\
  \ 14 15 17 22 24 25 27 28 29 29 29 29 29 29 32 33 34 34 34 36 37 38 39 40 40 41\
  \ 41 45 45 46 47 48 49 50 50 50 51 51 52 55 55 58 59 60 61 61 61 63 65 65 66 66\
  \ 66 67 68 69 69 69 73 74 76 77 77 77 82 87 88 88 88 90 90 91 92 93 93 98 99\n\n\
  \n\n\n\n如果它们恰好是 100，行将不会完全对齐。）\n\n→**29**      使用了一个名为 `a` 的静态变量来在排序期间持有数组。\n\n\
  536 第 5 卷 **编程技巧**\n\n→**31**      `sort` 方法有两个版本。第一个版本接受一个 `int` 数组作为参数，并返回一个包含已排序后数值的\
  \ `int` 数组。该方法将静态变量 `a` 设置为通过参数传递的数组，调用 `sort` 方法的第二个版本对整个数组进行排序，然后返回排序后的数组。\n\n\
