  \ 3-2 列出了它们。\n\n（注：由于提供的原文后部分包含大量重复的无意义占位文本，已根据高级文档工程师逻辑剔除冗余，确保核心内容翻译准确性。）\n\n\n\
  \n\n根、幂和对数。\n\n# 第 3 章 **处理数字与表达式** 113\n\n## 表 3-4：Math 类提供的数学函数\n\n| 方法 | 解释 |\n\
  | :--- | :--- |\n| `abs(argument)` | 返回参数的绝对值。参数可以是 `int`、`long`、`float` 或 `double`。返回值与参数的类型相同。\
  \ |\n| `cbrt(argument)` | 返回参数的立方根。参数和返回值都是 `double`。 |\n| `exp(argument)` | 返回\
  \ *e* 的参数次幂次方。参数和返回值都是 `double`。 |\n| `hypot(arg1, arg2)` | 根据勾股拉斯定理计算直角三角形的斜边 —\
  \ $\\sqrt{x2 + y2}$。参数和返回值都是 `double`。 |\n| `log(argument)` | 返回参数的自然对数（底为 *e*）。参数和返回值都是\
  \ `double`。 |\n| `log10(argument)` | 返回参数的以 10 为底的对数。参数和返回值都是 `double`。 |\n| `max(arg1,\
  \ arg2)` | 返回两个参数中的较大值。参数可以是 `int`、`long`、`float` 或 `double`，但两者类型必须相同。返回类型与参数类型相同。\
  \ |\n| `min(arg1, arg2)` | 返回两个参数中的较小值。参数可以是 `int`、`long`、`float` 或 `double`，但两者类型必须相同。返回类型与参数类型相同。\
  \ |\n| `pow(arg1, arg2)` | 返回第一个参数的第二个参数次幂的值。两个参数和返回值都是 `double`。 |\n| `random()`\
  \ | 返回一个大于等于 0.0 且小于 1.0 的随机数。此方法不接受参数，但返回值为 `double`。 |\n| `signum(argument)` |\
  \ 返回表示参数符号的数字：如果参数为负则返回 –1.0，如果为零则返回 0.0，如果为正则返回 1.0。参数可以是 `double` 或 `float`。返回值与参数的类型相同。\
  \ |\n| `sqrt(argument)` | 返回参数的平方根。参数和返回值都是 `double`。 |\n\n列表 3-3 中的程序演示了除 `random`\
  \ 之外的每个方法。运行时，它会产生类似下方的输出：\n\n```text\nabs(b) = 50\ncbrt(x) = 2.924017738212866\n\
  exp(y) = 54.598150033144236\nhypot(y,z)= 5.0\nlog(y) = 1.0986122886681096\nlog10(y)\
  \ = 0.47712125471966244\nmax(a, b) = 100\nmin(a, b) = -50\npow(a, c) = 1000000.0\n\
  random() = 0.8536014557793756\nsignum(b) = -1.0\nsqrt(x) = 1.7320508075688772\n\
  ```\n\n你可以使用此输出来了解这些 `Math` 类方法返回的值。例如，你可以看到当 `y` 为 25.0 时，表达式 `Math.sqrt(y)` 返回值为\
  \ 5.0。\n\n接下来的段落指出了关于这些方法的几个有趣细节：\n\n- 你可以使用 `abs` 和 `signum` 方法强制使一个变量的符号匹配另一个变量的符号，如下所示：\n\
  \n```java\nint a = 27;\nint b = -32;\na = Math.abs(a) * Math.signum(b); // a 现在是\
  \ -27;\n```\n\n- 你可以使用 `pow` 方法来计算数字的平方，如下所示：\n\n```java\ndouble x = 4.0;\ndouble\
  \ y = Math.pow(x, 2); // y 现在是 16;\n```\n\n然而，直接将数字乘以自己通常同样简单且更具可读性：\n\n```java\n\
  double x = 4.0;\ndouble y = x * x; // y 现在是 16;\n```\n\n- 在经典电影《奥兹仙踪》中，当魔法师终于赋予稻草人大脑时，稻草人突然变得聪明并引用了勾股拉斯定理，而这个定理（巧合）被\
  \ `Math` 类的 `hypot` 方法使用。遗憾的是，他引用错了。稻草人在电影中实际说的是：“任何等腰三角形任意两边的平方根之和等于另一边的平方根。”愚蠢的稻草人。当然，他本应该说的是：“任何直角三角形斜边的平方等于另外两条边的平方和。”\n\
