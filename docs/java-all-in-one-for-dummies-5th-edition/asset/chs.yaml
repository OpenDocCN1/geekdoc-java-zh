  text\" name=\"Name\">\n<br><br>\n<input type=\"submit\" value=\"Submit\">\n</form>\n\
  </body>\n</html>\n```\n\n该表单 `form` 标签中的 `action` 属性指定了在提交表单时调用 `/servlet/InputServlet`，而\
  \ `method` 属性表示表单是通过 POST 请求而非 GET 请求提交的。表单本身由一个名为 `name` 的输入文本字段和一个 提交（Submit）按钮组成。它并没有什么复杂的——足以从用户那里获取一些文本并发送到\
  \ Servlet。\n\n## 使用 InputServlet Servlet\n\n代码列表 2-4 显示了一个可以从代码列表 2-3 所示的表单中检索数据的\
  \ Servlet。\n\n**代码列表 2-4：**\n**InputServlet Servlet**\n\n```java\nimport java.io.*;\n\
  import javax.servlet.*;\nimport javax.servlet.http.*;\npublic class InputServlet\
