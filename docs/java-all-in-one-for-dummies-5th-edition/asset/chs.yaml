  \n本章是对 Java 世界的入门介绍。在接下来的几页中，你将了解到什么是 Java、它从哪里来以及它将走向何方。你还将发现 Java 的一些独特优势以及缺点。此外，你还将看到\
  \ Java 与其他流行编程语言的对比，包括 C、C++、C# 和 Visual Basic。\n\n顺便说，我在在本章假设你至少有足够的背景了解什么是计算机编程。这并不意味着假设你是一个专家或专业程序员。这意味着我不需要花时间去解释什么是计算机程序、什么是编程语言等基础知识。如果你完全没有编程经验，我建议你买一本《傻瓜学\
  \ Java》第 5 版或《傻瓜学 Java 编程》第 3 版，这两本书都是 Barry Burd 编写（Wiley 出版）。\n\n在本章中，你会看到一些 Java\
  \ 程序代码片段，以及一些用其他语言（包括 C、C++ 和 Basic）编写的代码片段。如果你完全不知道这些代码的意思或作用，不要慌。我只是想让你感受一下 Java\
  \ 编程是什么样的，以及它与其他语言的编程相比如何。\n\n书中使用的所有代码列表均可在 `[www.dummies.com/go/javaaiofd5e]`\
  \ 下载。\n\n## 第 1 章 欢迎来到 Java 7\n\n### 什么是 Java？它为什么这么棒？\n\nJava 是一种遵循 C 和 C++传统的传统的语言。因此，如果你有\
  \ C 或 C++ 的经验，在发现 Java 的各种特性时，通常会发现自己处于熟悉的领域。（有关 Java 与 C 或 C++ 之间相似之处的更多信息，请参见本章后面的“Java\
  \ 与其他语言”部分。）\n\n然而，Java 与其他编程语言有几个显著的不同之处。我在后续章节中指出最重要的区别。\n\n#### 平台无关性\n\nJava\
  \ 如此受欢迎的原因之一是它的平台无关性，这简单意味着 Java 程序可以在许多类型的计算机上运行。Java 程序可以在任何安装了 `Java Runtime\
  \ Environment`（也称为 `JRE`）的计算机上运行。`JRE` 几乎适用于你能想到的每种计算机：运行任何版本 Windows 的 PC、Macintosh\
  \ 计算机、Unix 和 Linux 计算机、巨大的主机计算机，甚至是手机。\n\n在 Java 出现之前，其他编程语言通过为不同平台提供兼容的编译器来承诺平台无关性。（`compiler`\
  \ 是将用编程语言编写的程序翻译成一种可以在计算机上实际运行的形式的程序。）这种想法是，你可以为每个平台编译不同版本的程序。遗憾的是，这个想法从未真正奏效。每个平台上的编译器从不是完全相同的；每个编译器都有它们自己的细微差别。结果，你必须为你想要支持的每个平台维护一个不同版本的程序。\n\
  \nJava 的平台无关性并不是基于为不同平台提供兼容的编译器。相反，Java 是基于虚拟机的概念。你可以将 Java 虚拟机（有时称为 `JVM`）想象成一个假设的计算机平台——一个以实际硬件形式不存在的计算机设计。相反，`JRE`\
  \ 是一个 `emulator`（仿真器）——该程序留出你硬盘的一部分来充当计算机（即 `JVM`），该计算机可以执行 Java 程序。\n\nJava 编译器不会将\
  \ Java 翻译成程序运行所在计算机的机器语言。相反，编译器将 Java 翻译成 JVM 的机器语言，这被称为 `bytecode`。然后 `JRE` 运行这些\
  \ `bytecode`。\n\n# 8 书 1 Java 基础\n\n### 欢迎来到 Java\n\n- » `JRE` 与 Java 编译器是分开的。因此，你不需要安装编译器就可以运行编译后的\
  \ Java。你只需要 `JRE`。\n- » 当有人问你的电脑“有有 Java”时，他或她通常是想问：“你安装了运行环境吗？”（你需要 `JRE` 才能运行程序。）\n\
  - » 平台无关性是有局限的。如果你有一台冷门的计算机系统——例如古董的 Olivetti 101——并且没有为它提供 `JRE`，那么你就无法在它上运行 Java\
  \ 程序。\n\n我不是编造 Olivetti 101 的。它是 20 世纪 60 年代的一种台式电脑，恰好是我编程的启蒙。（我的初中老师在教室后面有一台，他在午餐时间让我玩它。）在\
  \ Google 上搜索 **Olivetti 101**，你就能找到几个关于它的有趣网站。\n\n- » Java 的平台无关性并非完美。虽然 `bytecode`\
  \ 在每个拥有 `JRE` 的计算机上运行方式完全相同，但 Java 的某些部分使用了底层操作系统提供的服务。结果，有时会出现细微的差异，特别是在使用图形界面的应用程序中。\n\
  - » 因为模拟 `JVM` 的运行时系统执行 Java 字节码，有些人误错误地将 Java 与 Basic 或 Perl 等解释型语言进行比较。然而，这些语言完全没有编译。相反，解释器在执行每条语句时读取并解释它。Java\
  \ 是一种真正的编译型语言；它只是被编译成 JVM 的机器语言，而不是实际计算机平台的机器语言。\n- » 如果你感兴趣，`JVM` 是完全基于栈的；* 它没有用于存储本地数据的寄存器。（我不会解释那个术语的意思，所以如果你不理解，请跳过它。这并不重要。这只是对了解栈、寄存器之类的事的极客来说很有趣。）\n\
  \n#### 面向对象\n\nJava 本质上是面向对象的，这意味着 Java 程序由对象组成\n\n\n由被称为“对象”的编程元素组成。简单来说（当你在计算机书籍中读到*这种话*难道你不喜欢吗？），\n\
  \n# 第 1 章 **欢迎来到 Java** 9\n\n`object`（对象）是一个代表现实世界对象或抽象概念的编程实体。\n\n所有对象都有两个基本特征：\n\
  \n- » 对象拥有数据，也称为 `state`（状态）。例如，一个代表书籍的对象拥有如书名、作者和出版商等等的数据。\n- » 对象还具有 `behavior`（行为），这意味着它们可以执行某些任务。\n\
  \n在 Java 中，这些任务被称为 `methods`（方法）。一个代表汽车的对象可能有 `start`、`stop`、`drive` 和 `crash` 等方法。某些方法仅允许你访问对象的数据。书籍对象可能有一个\
  \ `getTitle` 方法，可以告诉你书名。\n\n类（Classes）与对象紧密相关。`class`（类）是你编写的、用于创建对象的程序代码。类描述了定义对象状态和行为的数据和方法。当程序执行时，类被用来创建对象。\n\
  \n假设你正在编写一个工资结算程序。这个程序可能需要对象来代表公司的员工。因此，程序包含一个类（可能命名为 `Employee`），它定义了每个 `Employee`\
  \ 节点的数据和方法。当你的程序运行时，它使用该类为公司的每位员工创建一个对象。\n\n**Java API**\n\nJava 语言本身非常简单，但 Java\
  \ 随带了一个类库，提供了许多常用的工具函数，大多数 Java 程序没有这些函数无法运行。这个类库被称为 `Java API`（*application programming\
  \ interface* 应用编程接口的缩写），它与语言本身一样是 Java Java。事实上，发现如何使用 Java 的真正挑战并不是精通语言，而是精通 API。Java\
  \ 语言只有大约 50 个关键字，但 `Java API` 拥有数千个类，以及数以万计的你可以在程序中使用的方法。\n\n`Java API` 拥有的类可以让你进行三角函数计算、将数据写入文件、在屏幕上创建窗口以及从数据库中检索信息等。API\
  \ 中的许多类是通用的且常用的。例如，有一整系列类用于存储数据集合。但也有许多类非常晦懂，仅在特殊情况下使用。\n\n10 书 1 **Java 基础**\n\n\
  幸运的是，你不需要学习几乎所有的 `Java API`。大多数程序员只精通它的一小部分：即直接与他们编写的程序类型最相关的部分。如果你发现需要使用 API 中某个你尚不熟悉的类，可以[在\
  \ Java API 文档 `http://download.java.net/jdk9/docs/api/`] 中查找该类的作用。\n\n**互联网**\n\n\
  **欢迎来到 Java**\n\nJava 经常与互联网联系在一起，这是理所当然的，因为阿尔尔·戈尔（Al Gore）在发明互联网后几天就发明了 Java。好吧，Java\
  \ 并不是真的由阿尔尔·戈尔发明的。它是在万维网成为一种现象的时期开发的，Java 专为为利用网络而设计的。特别是，`JVM` 背后的整个概念是让任何连接到互联网的计算机都能运行\
  \ Java 程序，无论计算机的类型或运行的操作系统如何。\n\n你可以在互联网上找到三种不同的 Java 程序：\n\n- » **Servlets：** `Servlets`\
  \ 是基于 Web 的 Java 程序，运行在互联网服务器计算机上，而不是互联网用户的网页浏览器中。Servlets 是许多（如果不是大多数）商业网站运行的真实方式。Servlet\
  \ 生成一个 HTML 页面并发送到用户的计算机，以便在用户的网页浏览器中显示。如果你从在线商店请求产品信息，商店的 Web 服务器会运行 Servlet 来生成包含你请求的产品信息的\
  \ HTML 页面。\n- » **Applets：** `Applets` 是直接在网页浏览器中运行的 Java 程序。要运行 applet，浏览器会启动一个\
  \ `JVM`，该虚拟机会被分配网页的一部分来工作。然后，虚拟机会运行 applet 的字节码。\n- » **Web Start 应用：** `Web Start`\
  \ 是一种 Java 应用，设计为从网页启动但直接运行在用户的计算机上，而不是在网页浏览器中运行。\n\nApplets 最近已不受宠，因为它们经常与不同版本的浏览器产生兼容性问题。结果，Web\
  \ Start 应用在很大程度上取代了 Applets。你将在第 7 章了解到如何创建 servlet 和 Web Start 应用。\n\n第 1 章 **欢迎来到\
  \ Java** 11\n\n**Java 与其他语言**\n\n从表面上看，Java 看起来非常像它之前的许多语言，最著名的 C 和 C++。例如，这里是用\
  \ C 编程语言编写的经典 Hello, World! 程序：\n\n```c\nmain()\n{\n    printf(\"Hello, World!\"\
  );\n}\n```\n\n这个程序只是在计算机的控制台上显示 \"Hello, World!\" 文本。这里是用 Java 编写的经典 Hello, World!\
  \ 程序：\n\n```java\npublic class HelloApp\n{\n    public static void main(String[]\
  \ args)\n    {\n        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\n\
  虽然 Java 版本稍微冗长一些，但两者之间有几个相似之处：\n\n- » 两者都要求每个可执行语句以分号（`;`）结束。\n- » 两者都使用大括号（`}`）来标记代码块。\n\
  - » 两者都使用名为 `main` 的例作为主入口点。\n\n许多其他相似之处在这些简单的示例中并不显而易见，但它们引出了 C 和 Java 之间的主要区别：面向对象即使在简单的示例中也露了头。考虑以下几点：\n\
  \n- » 在 Java 中，即使简单的程序也是类，所以你必须提供一行类的声明。在这个示例中，类名为 `HelloApp`。`HelloApp` 有一个名为 `main`\
  \ 的方法，`JVM` 在运行时会自动调用它。\n- » 在 C 示例中，`printf` 是你用来向控制台打印信息的库函数。在 Java 中，你使用 `PrintStream`\
  \ 类来写入信息。\n\n12 书 1 **Java 基础**\n\nPrintStream? 程序里没有 PrintStream！等一下——有的。每个 Java\
  \ 程序都有一个写入控制台的 `PrintStream` 对象。你可以通过调用另一个类 `System` 的 `out` 方法来获取这个 `PrintStream`\
  \ 对象。因此 `System.out` 获取了写入控制台的 `PrintStream` 对象。`PrintStream` 类转而有一个名为 `println`\
  \ 的方法可以写入控制台。\n\n所以 `System.out.println` 实际上做了两件事，顺序如下：\n\n**欢迎来到 Java**\n\n如果你相信\
  \ Oracle 等其他人的营销宣传，你会认为 Java 是自内存发明以来计算机领域发生的最好事。Java 可能并没有*那么*具有革命性，但它确实具有许多内置特性，与其他语言区分开来。接下来的章节描述了让\
  \ Java 如此受欢迎的众多特性中的三个。\n\n**类型检查**\n\n\n\n\n\n所有编程语言都必须以某种方式处理`type checking`（类型检查）——即语言处理存储不同类型数据的变量的方式。\n\
  \n例如，数字、字符串和日期是大多数编程语言中通用的`data types`（数据类型）。大多数编程语言还有多种数字，例如整数和实数。\n\n所有语言都必须检查数据类型，以确保你不会尝试做没有意义的事情（例如，将国内生产总值乘以你的姓氏）。问题在于，这门语言是要求你声明每个变量的类型，以便在编译程序时进行类型检查，还是在语言在运行程序后才进行类型检查？\n\
  \n# 第 1 章 欢迎来到 Java\n\n某些语言（如 Perl）在类型检查方面没有 Java 那么严谨。例如，Perl 并不要求你指定变量将包含整数、浮点数还是字符串。因此，对于名为\
  \ `$a` 的单个变量，以下语句都是允许的：\n\n```\n$a = 5\n$a = \"Strategery\"\n$a = 3.14159\n```\n\
  \n在这里，三种不同类型的数据——整数、字符串和双精度浮点数被赋值给了同一个变量。\n\n相反，Java 在运行时会完成类型检查。因此，你必须将所有变量为特定类型，以便编译器能够确保你正确地使用变量。例如，下面这段\
  \ Java 代码将无法编译：\n\n```java\nint a = 5;\nString b = \"Strategery\";\nString c = a\
  \ * b;\n```\n\n如果你尝试编译这些行，你会收到一条错误信息，显示 Java 无法将整数和字符串相乘。\n\n在 Java 中，你定义的每个类都会为语言创建一种新的数据类型。因此，你在\
  \ Java 中可用的数据类型不仅仅是简单的预定义类型（如数字和字符串）。你可以创建自己的类型。\n\n如果你正在编写一个工资单系统，可能会创建一个 `Employee`\
  \ 类型。然后你可以声明类型为 `Employee` 的变量，它们只能持有 `Employee` 对象。这种能力可以防止许多编程错误。考虑这段代码片段：\n\n\
  ```\nEmployee newHire;\nnewHire = 21;\n```\n\n这段代码创建了一个只能持有 `Employee` 对象的变量 (`newHire`)。然后它尝试给它赋值数字\
  \ `21`。Java 编译器不会让你运行这个程序，因为 `21` 是数字，而不是一个员工。\n\nJava 的一个名为 `inheritance`（继承）的重要面向对象特性为类型检查增加了一个有趣的——极其实用的——转折。继承太复杂了，现在还无法深入探讨，所以我在这里简要说明一下：在\
  \ Java 中，你可以创建派自其他数据类型的自定义数据类型。例如，员工是人，客户也是人，所以你可能会创建一个 `Person` 类，然后创建 `Employee`\
  \ 和 `Customer` 类，它们都继承自 `Person` 类。然后你就可以写出这样的代码：\n\n```\nPerson p;\nEmployee e;\n\
  Customer c;\n\np = e; // 这是允许的，因为 Employee 也是 Person。\nc = e; // 这是不允许的，因为 Employee\
  \ 不是 Customer。\n```\n\n感到困惑了吗？如果是的话，那是我的错。对于一本 Java 手的书的第一章来说，继承是一个相当烧脑的话题。如果现在还看不懂，不要惊慌。等当你读完第\
  \ 3 本的第 4 章时，一切都会豁然开，那一章涵盖了使用继承的所有细微差别。\n\n## 自动内存管理\n\n内存管理是所有编程语言都必须处理的另一个细节。所有编程语言都允许你创建变量。当你创建一个变量时，语言会分配计算机内存的一部分来存储由该变量所引用的数据。内存具体是如何分配的，是你通常可以安全忽略的细节，无论你在使用哪种语言。\n\
  \n但许多语言不允许你安全忽略的一个细节是：当你不再需要存储其中的数据时，那部分内存会发生什么。\n\n在 C++ 和类似的语言中，你必须编写代码显式释放这些内存，以便其他程序可以访问它们。如果不这样做，或者做错了，你的程序可能会出现内存泄漏。在\
  \ `memory leak`（内存泄漏）中，你的程序会缓慢但持续地从其他程序夺取内存，直到操作系统耗尽内存，计算机停止运行。\n\n在 Java 中，当你用完内存时不需要显式释放；相反，当内存不再被需要时，会自动释放。`JVM`\
  \ 包含一个名为 `garbage collector`（垃圾回收器）的特殊进程，它会在虚拟机内存中搜索；确定数据何时不再被使用；并自动删除这些数据，释放它们占用的内存。\n\
  \n与垃圾回收相关的特性是 `bounds checking`（边界检查），它保证程序无法访问不属于它们的内存。C 和 C++ 等语言没有这种安全网。因此，C\
  \ 或 C++ 中的编程错误可能会导致一个程序践踏另一个程序正在使用的内存，反之可能会导致你的电脑崩溃。\n\n## 异常处理\n\n正如罗伯特·伯斯（Robert\
  \ Burns）所说：“鼠和人类最周密的计划往往会事与，留给我们的只有痛苦！”当你钻研计算机编程时，很快就会理解他的意思了。无论你如何仔细地规划和测试你的程序，错误总会发生，当它们发生时，它们会威胁导致你的整个程序崩溃。\n\
  \nJava 有一种独特的错误处理方法，优于任何其他语言（C# 除外，它复制了 Java 方法）。在 Java 中，JRE 将所有类型的错误拦截并转换为特殊类型的对象，即\
  \ `exception object`。毕竟 Java 是完全面向对象的，它的异常处理功能难道不应该是面向对象的吗？Java 要求可能引发异常的语句封装在可以处理异常的代码中。换句话说，作为程序员，你必须预测运行时可能发生的错误，并确保这些错误得到妥善处理。\n\
  \n## 缺点：Java 的弱点\n\n到为止，我一直在大肆赞扬 Java。为了防止你认为学习它轻而易举，以下段落指出了 Java 的某些缺点（其中许多与 API\
  \ 有关，而非语言本身）：\n\n- **体积太大**：它包含了太多的类和方法，你可能永远用不到其中一半。此外，Java API 的庞大规模让你无法独自在其中漫游，并发现那个完美适合你正在解决问题的类。\n\
  - **过度设计**：在某些情况下，Java 的设计者似乎刻意让本该简单使用的事情变得复杂。例如，定义多行文本区域的 API 类没有滚动条。相反，另一个单独的类定义了带有滚动条的面板。为了创建一个带有滚动条的多行文本区域，你必须同时使用这两个类。\n\
  \n\n\n\n从那时起，API 的许多部分已经经过了更周全的重构，但 API 仍然充满了 Java 早期版本的痕迹。\n\n» 在看来，Java 最大的弱点是它不直接支持真正的小数数据。这个问题有点太复杂，无法在此深入探讨。\n\
  \n# 欢迎来到 Java\n\n现在如此，但其含义是：如果没有特殊的编码（很少有 Java 书会解释这一点，也很少 Java 程序员意识到），Java 并不知道如何相加。考虑这段代码：\n\
  \n```java\ndouble x = 5.02;\ndouble y = 0.01;\ndouble z = x + y;\nSystem.out.println(z);\n\
  ```\n\n这个小程序应该打印出 `5.03`，对吧？它并没有。相反，它打印出 `5.02999999999999999`。这个小错误看起来可能微不足道，但它们会积少多。如果你在网上商店购物并发现销售税少了一分钱，这就是原因。关于这些错误发生的原因以及如何防止它们，解释非常有技术性，但这是每个\
  \ Java 程序员都需要理解的内容。\n\n## Java 版本的疯狂\n\n与大多数产品一样，Java 会定期进行升级和增强。自 1996 年首次发布以来，Java\
  \ 经历了以下版本更新：\n\n» **Java 1.0:** 该版本是 Java 的原始版本，于 1996 年发布。该语言的大部分仍然与版本 1.0 基本相同，但自发布以来，API\
  \ 已经发生了很大变化。\n\n» **Java 1.1:** 该版本是 Java 的首次升级，于 1997 年发布。这次发布很重要，因为大多数 浏览器都内置了对基于\
  \ Java 1.1 的 applet 支持。要运行基于更高版本的 Java 的 applet，大多数情况下你必须下载并安装当前的 `JRE`。\n\n» **Java\
  \ 1.2:** 该版本于 1998 年后期发布，相比之前的版本有了巨大的改进——事实上，Sun 公司将其称为 Java 2。它包含了一个名为 `Swing`\
  \ 的完全全新的 API，用于创建图形用户界面，以及其他主要新功能。\n\n» **Java 1.3:** 该版本于 2000 年发布，主要关于通过更改运行时系统的工作方式来提高性能。奇怪的是，尽管这个版本在技术上是\
  \ Java 1.3，它也被称为 Java 2 版本 1.3。随你怎么吧。\n\n» **Java 1.4:** 该版本于 2001 年发布，提供了一系列改进。正如你猜到的那样，它被称为\
  \ Java 2 版本 1.4。继续猜吧 . . .\n\n» **Java 1.5:** 该版本于 2004 年发布，包含了比任何其他版本更多的变化和改进。为了增加\
  \ Sun 在版本命名上显而易见的不可预测性，这个版本正式拥有*两个版本号*。Sun 的官方 Java 网站这样解释：\n\n版本号 `1.5.0` 和 `5.0`\
  \ 都用于识别此 Java 2 平台标准版的发布版本。版本 `5.0` 是产品版本，而 `1.5.0` 是开发者版本。\n\n这让一切都清楚了，不是吗？\n\n\
  » **Java 1.6:** 于 2006 年 12 月发布（赶在假期期间！），这个版本的 Java 提供了微小的改进和更高的效率。对于 Java 1.6，产品版本是\
  \ `6`（不是 `6.0`）。还记得 1998 年神奇出现的额外 `2` 吗？嗯，`2` 在 Java 1.6 中消失了。所以与 1998 年到 2006 年之间的版本不同，Java\
  \ 1.6 的正式名称是 Java Platform（而不是 Java 2 Platform）。个人认为，Sun 的某人一直在和乔治·卢斯聊天。我完全预计 Java\
  \ 的下一个版本将是一个名为 Java 0 Episode 1 的前传。\n\n» **Java 1.7:** 于 2011 年年中发布，这是一个相对较小的升级，为\
  \ API 增加了一些增强，对语言本身进行了一些微调。\n\n» **Java 1.8:** 于 2014 年 2 月发布，Java 8（如其名称所示）为 Java\
  \ 增加了一些重大且长期期待的新功能。其中最重要的之一是*lambda 表达式*，这是一种简化了面向对象编程某些方面的语言特性。其他新功能包括一个完全重构的用于日期和时间的\
  \ API，以及一个处理大型数据集的新框架，该框架可以轻松利用多核处理器。\n\n» **Java 1.9:** 于 2017 年发布，Java 9 增加了一个重大且长期期待的功能——*Java\
  \ 模块系统*，它提供了一种新的改进方法来管理组成完整 Java 程序的 Java 代码集合。你将在第 3 章第 8 章中学习这个新功能。\n\n如果你正在编写希望在较早版本的\
  \ Java 上运行的应用程序，你可能需要注意版本差异。但记住，Java 的主要优势之一是运行时系统是免费的，终端用户可以轻松下载和安装。因此，当你需要 Java\
  \ 9 的特性时，不要犹豫使用它们。\n\n# Java 基础\n\n## 名字的含义？\n\n我想在本章中涵盖的最后一个主题是每当你阅读或谈论 Java 时经常遇到的各种缩写词，例如\
  \ `JVM`、`JRE`、`JDK` 和 `JEE`。\n\n\n\n提供了编辑 Java 程序的特性（如自动缩进）以及编译和运行程序的快捷键。然而，它并不会为你生成任何代码，也不会提供任何形式的视觉设计辅助。`TextPad`\
  \ 是我开发书中所示所有示例时使用的工具。有关下载和使用 `TextPad` 的信息，请参阅第 1 本第 3 章。\n\n# 第 2 章 安装和使用 Java\
  \ 工具\n\n## 下载与安装\n\n### Java 开发工具包\n在开始编写 Java 程序之前，你必须为你正在使用的计算机系统下载并安装正确版本的 Java\
  \ 开发工具包（`JDK`）。Oracle Java 网站提供了适用于 Windows、Solaris 和 Unix 的版本。以下章节将向你展示如何下载和安装\
  \ `JDK`。\n\n 下载 JDK\n要进入下载页面，请将浏览器指向[`http://java.oracle.com/technetwork/java`。然后按照相应的链接下载适用于你操作系统的\
  \ `JDK 9`。\n\n当你到达 Java 下载页面时，你会发现下载 `JDK` 或 `JRE` 的链接。点击 `JDK` 链接；`JRE` 链接只会获取\
  \ Java 运行环境，而不是完整的 Java 开发工具包。\n\n`JDK` 下载提供两个版本：一个需要活动 Internet 连接来安装 `JDK` 的在线版本，另一个允许你将\
  \ `JDK` 安装文件下载到计算机并在以后安装的离线版本。\n\n我建议你使用离线版本。它的安装速度更快，如果你以后需要，可以重新安装 `JDK` 而无需再次下载。\n\
  \n#### 法律术语\n在下载 `JDK` 之前，你必须同意 Java 许可协议——全部 1,919 个单词，包括 Oracle 法律部门精细构思的所有 *thereupon*（此后）s\
  \ *、*whereas*（由于）es * 以及 *hitherto*（到今为止）s so。我不是律师（我也没有在电视上演过律师），但我将尝试为你总结该许可协议：\n\
  \n*   第一方（即 Oracle）授予你按原样使用 Java 的权利，并且不保证 Java 会产生任何作用。\n*   第二方（即你）反过来承诺仅使用 Java\
  \ 编写程序。你不允许尝试弄清楚 Java 的工作原理并将你的秘密卖给微软。\n*   你不能使用 Java 制造核弹或导弹弹射系统。（这不是我编造的。它确实在许可协议中。）\n\
  \n离线版本的具体大小取决于平台，但大多数版本在 50MB 到 60MB 之间。因此，如果你没有高速 Internet 连接，下载将需要几个小时。使用电缆、DSL\
  \ 或 T1 连接，下载时间少于五分钟。\n\n 安装 JDK\n下载 `JDK` 文件后，你可以通过运行下载的可执行文件来安装它。该过程根据你操作系统的不同而略有差异，但基本上，你只需要在下载后运行\
  \ `JDK` 安装程序文件即可，具体如下所示：\n\n*   在 Windows 系统上，打开你保存安装程序的文件夹，并双击安装程序的图标。\n*   在 Linux\
  \ 或 Solaris 系统上，使用控制台命令切换到下载文件的目录，然后运行该程序。\n\n启动安装程序后，它会提示你提供恰当安装 `JDK` 所需的任何信息，例如你想安装哪些功能，以及你想将\
  \ `JDK` 安装在哪个文件夹中。你可以安全地为每个选项选择默认答案。\n\n 浏览 JDK 文件夹\n当 `JDK` 自行安装时，它会在你的硬盘上创建几个文件夹。这些文件夹的位置取决于你的系统，但在所有\
  \ 32 位的 Windows 版本中，`JDK` 根文件夹位于启动驱动器上的路径 `Program Files\\Java`。在 64 位的 Windows\
  \ 版本中，根文件夹将 `Program Files\\Java` 或 `Program Files (x86)\\Java`。`JDK` 根文件夹的名称取决于你安装的\
  \ Java 版本。对于 1.9 版本，根文件夹命名为 `jdk-9`。\n\n表 2-1 列出了 `JDK` 根文件夹中创建的子文件夹。在你操作 Java 时，你会频繁引用这些文件夹。除了这些文件夹，`JDK`\
  \ 還在 `JDK` 根文件夹中安装了几个文件。我在表 2-2 中列出了这些文件。\n\n**表 2-1：JDK 根文件夹的子文件夹**\n\n| 文件夹 |\
  \ 说明 |\n| :--- | :--- |\n| `bin` | 编译器和其他 Java 开发工具 |\n| `conf` | 配置文件 |\n| `include`\
  \ | 此库包含将 Java 与其他语言编写的程序集成的文件 |\n| `jmods` | Java 模块系统的模块（Java 1.9 新增） |\n| `jre`\
  \ | Java 运行环境 |\n| `lib` |库文件，包括 Java API 类库 |\n\n**表 2-2：JDK 根文件夹中的文件**\n\n| 文件\
  \ | 说明 |\n| :--- | :--- |\n| `README.html` | HTML 格式的 Java 自文件。 |\n| `README.txt`\
  \ | 同样是自文件，这次是文本格式。 |\n| `LICENSE` | 你在下载时同意的 Java 许可协议 |\n\n 设置路径\n安装 `JDK` 后，你需要配置你的操作系统使其能够找到\
  \ `JDK` 命令行工具。为了实现这一点，你必须设置 `Path` 环境变量——操作系统用于查找可执行程序的文件夹列表。要在 Windows 7 或之前的版本上执行，请遵循以下步骤：\n\
  \n1.  点击开始菜单，然后右键点击**计算机**。\n2.  点击**高级系统设置**。\n3.  点击**环境变量**按钮。\n4.  在系统变量列表中滚动到\
  \ `Path` 变量，选择它，然后点击**编辑**按钮。\n5.  将 `JDK bin` 文件夹添加到 `Path` 值的开头。使用分号将 bin 文件夹与路径中可能存在的其他信息隔开。\n\
  \    ***注意：*** bin 文件夹的名称在你的系统上可能不同，如示例所示：`c:\\Program Files\\Java\\jdk-9\\bin;\
  \ *其他目录...*`\n6.  连续点击确定退出。第一次确定返回到环境变量对话框；第二次确定返回到系统属性对话框；第三个确定关闭系统属性对话框。\n\n对于\
  \ Linux 或 Solaris，该过程取决于你正在使用的 shell。如需更多信息，请查阅你所使用的 shell 的文档。\n\n\n\nJava 自带几个命令行工具，你可以直接从命令提示符运行它们。最重要的两个工具是\
  \ `javac`（用于编译程序的 Java 编译器）和 `java`（用于运行 Java 程序的运行时命令）。无论你使用什么种操作系统，这些工具的工作方式基本上都是相同的。\n\
  \n### 编译程序\n\n你可以使用 `javac` 命令从命令提示符编译程序。然而，在在此之前，你需要一个需要编译的程序。请按照以下步骤操作：\n\n1.\
  \ **使用任何文本编辑器，在文件中输入以下文本，并将其保存为 HelloApp.java：**\n\n```java\npublic class HelloApp\n\
  {\n    public static void main(String[] args)\n    {\n        System.out.println(\"\
  Hello, World!\");\n    }\n}\n```\n\n请特别注意大小写。例如，如果你输入的是 `Public` 而不是 `public`，程序将无法运行。（如果你不想费力输入，可以从本书的网站在\
  \ `www.dummies.com`) 下载示例程序。）\n\n2. **将文件保存到你喜欢的任何目录中。**\n\n3. **打开命令提示符，使用 `cd`\
  \ 命令切换到保存程序文件的目录，然后输入命令 `javac HelloApp.java`。**\n\n此命令会编译程序（`javac`）并创建一个名为 `HelloApp.class`\
  \ 的类文件。假设你输入的程序完全正确，`javac` 命令将不会显示任何信息。然而，如果程序包含任何错误，你会在屏幕上看到一个或多个错误消息。尽管我在本节前面已经发出了警告，如果你输入的是\
  \ `Public` 而不是 `public`，编译器将显示以下错误消息：\n\n```\nC:\\java\\samples> javac HelloApp.java\n\
  HelloApp.java:1: error: class, interface, or enum expected\nPublic class HelloApp\n\
  ^\n1 error\nC:\\java\\samples>\n```\n\n编译器错误消息表明 `HelloApp.java`文件的第 1 行存在错误。如果编译器报告了类似这样的错误消息，说明你的程序包含代码错误。你需要找到错误、纠正它，并重新编译程序。\n\
  \n### 编译多个文件\n\n通常情况下，`javac` 命令仅编译你在命令行中指定的文件，但你可以通过我在后续段落中描述的任何技术来诱使 `javac` 一时编译多个文件：\n\
  \n#### 安装和使用 Java 工具\n\n* 如果你在命令行中指定的 Java 文件引用了同一文件夹中由 `java` 文件定义的另一个 Java 类，则\
  \ Java 编译器会自动编译该类。假设你有一个名为 `TestProgram` 的 Java 程序，它引用了一个名为 `TestClass` 的类，且 `TestClass.java`\
  \ 文件与 `TestProgram.java` 文件位于同一文件夹。当你使用 `javac` 命令编译 `TestProgram.java` 文件时，编译器会自动编译\
  \ `TestClass.java` 文件。\n* 你可以在 `javac` 命令中列出多个文件名。以下命令编译了三个文件：\n```\njavac TestProgram1.java\
  \ TestProgram2.java TestProgram3.java\n```\n\n* 你可以使用通配符来编译文件夹中的所有文件，如下：\n```\n\
  javac *.java\n```\n\n* 如果你需要同时编译很多文件，但不想使用通配符（可能你想编译大量文件但而不是文件夹中的所有文件），你可以创建一个参数文件，其中列出要编译的文件。在参数文件中，你可以输入任意数量的文件名，使用空格或换行符分隔它们。这是一个名为\
  \ `TestPrograms` 的参数文件，列出了三个要编译的文件：\n```\nTestProgram1.java\nTestProgram2.java\n\
  TestProgram3.java\n```\n\n你可以通过在 `javac` 命令行中使用 `@` 字符后跟参数文件的名称来编译该文件中的所有程序，如下：\n\
  ```\njavac @TestPrograms\n```\n\n### 使用 Java 编译器选项\n\n`javac` 命令有一系列选项，可以使用它们来影响它编译程序的方式。为了方便参考，我在表\
  \ 2-3 中列出了这些选项。\n\n**表 2-3：Java 编译器选项**\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-g`\
  \ | 生成所有的调试信息。 |\n| `-g:none` | 不生成调试信息。 |\n| `-g:{lines,vars,source}` | 生成部分调试信息。\
  \ |\n| `-nowarn` | 不生成警告。 |\n| `-verbose` | 输出关于编译器正在做什么的消息。 |\n| `-deprecation`\
  \ | 输出使用已弃 API 的源码位置。 |\n| `-classpath <path>` | 指定查找用户类文件的路径。 |\n| `-cp <path>`\
  \ | 指定查找用户类文件的路径。 |\n| `-sourcepath <path>` | 指定查找输入源文件的路径。 |\n| `-bootclasspath\
  \ <path>` | 覆盖启动类文件的位置。 |\n| `-extdirs <dirs>` | 覆盖已安装扩展的路径。 |\n| `-endorseddirs\
  \ <dirs>` | 覆盖受认可的标准路径位置。 |\n| `-d <directory>` | 指定生成的类文件的存放位置。 |\n| `-encoding\
  \ <encoding>` | 指定源文件使用的字符编码。 |\n| `-source <release>` | 提供与指定版本的兼容性。 |\n| `-target\
  \ <release>` | 为指定的虚拟机版本生成类文件。 |\n| `-version` | 提供版本信息。 |\n| `-help` | 打印标准选项的摘要。\
  \ |\n| `-X` | 打印非标准选项的摘要。 |\n| `-J<flag>` | 将 `<flag>` 直接传递给运行时系统。 |\n\n要使用这些选项中的一个或多个，可以在文件名之前或之后输入。例如，以下命令在启用\
  \ `-verbose` 和 `-deprecation` 的情况下编译 `HelloWorld.java`：\n```\njavac -verbose -deprecation\
  \ HelloWorld.java\njavac HelloWorld.java -verbose -deprecation\n```\n\n如果你不理解所有选项的作用，不要感到困惑。它们大多数在特殊情况下才有用。你常用的选项有：\n\
  \n* `-classpath` 或 `-cp`：如果你的程序使用了存储在单独文件夹中的类文件，请使用此选项。\n* `-deprecation`：如果你在使用已弃用的方法，使用此选项可以让编译器警告你。（已弃方法是曾经属于\
  \ Java API 但正走向淘汰的方法。它们仍然可以使用，但在未来的 Java 版本中可能会失效。）\n* `-source`：使用此选项将编译器限制为之前的\
  \ Java 版本。但注意，此选项仅适用于 Java 语言特性，不适用于类库。例如，如果你指定 `-source 1.4`，编译器将不允许你使用在该版本之后引入的新语言特性，如泛型、增强\
  \ for 循环或 Lambda 表达式。但你仍然可以使用 1.5 添加的新 API 特性，例如 `Scanner` 类。\n* `-help`：使用此选项列出\
  \ `javac` 命令可用的选项。\n\n### 运行 Java 程序\n\n当你成功编译 Java 程序后，可以通过输入 `java` 命令后跟包含程序主方法的类名来运行该程序。JRE\
  \ 会加载你指定的类，然后运行该类中的 main 方法。例如，运行 `HelloApp` 程序，输入此命令：\n\n```\nC:\\java\\samples>\
  \ java HelloApp\n```\n\n程序的响应是显示消息“Hello, World!”\n\n类必须包含在与类同名的文件中，且文件名必须具有 `.class`\
  \ 扩展名。你通常不需要担心类文件的命名，因为它在你使用 `javac` 命令编译程序时会自动创建。因此，如果你编译一个名为 `HelloApp.java` 的文件，编译器会创建一个名为\
  \ `HelloApp` 的类，并将其保存为名为 `HelloApp.class` 的文件。\n\n\n\n\n# 理解错误消息\n\n如果 Java 找不到与类相对应的文件名，你将收到一个简单的错误消息，指示找不到该类。如果你输入\
  \ `JelloApp` 而不是 `HelloApp`，你会得到以下内容：\n\n```\nC:\\java\\samples> java JelloApp\n\
  Exception in thread \"main\"\njava.lang.NoClassDefFoundError: JelloApp\n```\n\n\
  这条错误消息仅意味着 Java 找不到名为 `JelloApp` 的类。\n\n# 指定选项\n\n与 Java 编译器一样，Java 运行时命令 `java`\
  \ 允许你指定指定可以影响其行为的选项。表 2-4 列出了最常用的选项。\n\n### 表 2-4\n### 常用 Java 命令选项\n\n| 选项 | 描述\
  \ |\n| :--- | :--- |\n| `-client` | 运行客户端虚拟机。 |\n| `-server` | 运行服务器虚拟机，该虚拟机针对服务器系统进行了优化。\
  \ |\n| `-classpath` *directories and archives* | 列出用于搜索类文件的目录或 JAR 或 Zip 归档文件。 |\n\
  | `-cp <search path>` | 作用与 `-classpath` 相同。 |\n| `-D name=value` | 设置系统属性。 |\n\
  | `-verbose` | 启用详细输出。 |\n| `-version` | 显示 JRE 版本号后停止。 |\n| `-showversion` | 显示\
  \ JRE 版本号后继续。 |\n| `-?` 或 `-help` | 列出标准选项。 |\n| `-X` | 列出非标准选项。 |\n| `-ea` 或 `-enableassertions`\
  \ | 启用 `assert` 命令。 |\n| `-ea classes or packages` | 为指定的类或包启用断言。 |\n| `-esa` 或\
  \ `-enablesystemassertions` | 启用系统断言。 |\n| `-dsa` 或 `-disablesystemassertions` |\
  \ 禁用系统断言。 |\n\n# 使用 javap 命令\n\n`javap` 命令被称为 Java 反汇编器，因为它会拆解类文件并告诉你是内部的内容。你可能不会经常使用这个命令，但有时使用它来查找特定\
  \ Java 语句的工作原理是很有趣的。如果你没有用于创建该类的源码，也可以用它来查找某个类可以使用哪些方法。\n\n# 安装和使用 Java 工具\n\n以下是你运行\
  \ `javap HelloApp` 命令时获得的信息：\n\n```\nC:\\java\\samples> javap HelloApp\nCompiled\
  \ from \"HelloApp.java\"\npublic class HelloApp{\n    public HelloApp();\n    public\
  \ static void main(java.lang.String[]);\n}\n```\n\n如你所示，`javap` 命令表明 `HelloApp`\
  \ 类是从 `HelloApp.java` 文件编译的，它由一个 `HelloApp` 公共类和一个 `main` 公共方法组成。\n\n你可能想在 `javap`\
  \ 命令中使用两个选项。如果你使用 `-c` 选项，`javap` 命令将显示编译器为类创建的实际 Java 字节码。如果你使用 `-verbose` 选项，则会显示字节码（以及关于类内部结构的大量其他有趣信息）。\n\
  \n如果你成为了一位 Java 大师，可以使用这类信息来确切找出某些 Java 特性是如何工作的。在此之前，除非在你想用对 Java 的深入知识给朋友留印象的少数情况下，否则你可能应该不要管\
  \ `javap` 命令。（只希望在你这样做时，他们不会问你 `aload` 或 `invokevirtual` 指令是做什么的。）\n\n# 使用其他命令行工具\n\
  \nJava 有许多其他命令行工具经常会派上用场。你可以在以下网站找到命令行工具的完整列表：\n`http://download.java.net/jdk9/docs/technotes/tools/index.html#basic_html`\n\
  \n我在本书的其他部分描述了这三个额外工具：\n\n* **applet viewer**: 运行 Web applet 应用程序。更多信息请参阅第 7 卷第\
  \ 1 章。\n* **javadoc**: 自动为你的 Java 类创建 HTML 文档。更多信息请参阅第 3 卷第 7 章。\n* **jar**: 创建\
  \ Java 归档 (JAR) 文件，将类存储在类似于 Zip 文件的压缩文件中。我在第 3 卷第 7 章介绍了该命令。\n\n# 使用 Java 文档\n\n\
