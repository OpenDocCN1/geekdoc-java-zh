  ### 方法描述\n\n以下段落描述了这些方法的功能：\n\n- `doGet` 方法调用 `getMovieList` 方法来获取包含所有电影列表的字符串，这些电影之间用换行（`<br>`）标签分隔。然后它使用一系列\
  \ `out.println` 语句来编写显示此列表的 HTML。\n- `doPost` 方法简单地调用 `doGet` 方法。这样，无论是由 `GET` 还是\
  \ `POST` 请求调用的，该 servlet 都能正常工作。\n- `getMovieList` 方法调用 `MovieIO.getMovies` 方法获取包含从文件中读取的所有电影的\
  \ `ArrayList`。然后它使用增强型 for 循环获取每个 `Movie` 对象。每部电影的年份和标题被添加到 `msg` 字符串中并用 `<br>`\
  \ 标签分隔。\n\n### 本章内容\n\n- 了解 servlet 的工作原理\n- 处理页面指令（page directives）\n- 尝试表达式（expressions）\n\
  - 使用脚本段（scriptlets）\n- 设计声明（declarations）\n- 理解类\n\n## 第 3 章：使用 JavaServer Pages\n\
  \n在第 7 本的第 2 章中，你发现了如何通过 `response.out` 访问 `PrintWriter` 对象来创建直接将 HTML 数据写入页面的 servlet。虽然这种技术可行，但它有一个主要的缺点：你必须手动编写一组字符串字面量来构建\
  \ HTML。如果 HTML 有错误，在你运行 servlet 查看其效果之前，你并不知道它的存在。此外，在 `out.println` 语句中手工制作 HTML\
  \ 并不是创建美观网页最高效的方法。\n\n这就是 JavaServer Pages（通常简称为 `JSP`）大显用场的地方。*JavaServer Page*（Java\
  \ 器页面）是一个 HTML 文件，其中通过特殊标签嵌入了 Java servlet 代码。当你运行一个 `JSP` 时，所有的 HTML 都会作为响应的一部分自动发送，连同你嵌入\
  \ JSP 文件的 Java 代码创建的任何 HTML。因此，`JSP` 免去了你编写所有那些 `out.println` 语句的苦差。\n\n在本章中，你将学习如何创建基本的\
  \ JavaServer Pages。在 `www.dummies.com/extras/javaaio`，我将向你如何将名为 *JavaBeans* 的特殊\
  \ Java 类整合到你的 JSP 页面中。\n\n**注意：** 要使用 JavaServer Pages，你必须先设置好有效的 Tomcat 环境。有关如何操作的信息，请参考第\
  \ 7 本的第 2 章。\n\n## 理解 JavaServer Pages\n\n`JSP` 是扩展名为 `.jsp` 而不是 `.htm` 或 `.html`\
  \ 的 HTML 文档。与 servlet 类文件不同，JSP 文件可以存储在 Web 服务器可用的任何目录下。\n\n当用户第一次请求 JSP 文件时，该文件会通过一个翻译程序，该程序将文件转换为\
  \ Java servlet 程序并进行编译。原始 JSP 文件中的所有 HTML 都会转换为 `out.print` 语句以将 HTML 发送到响应，而 JSP\
  \ 文件中的 Java 语句被整合到 servlet 程序中。然后执行 servlet 程序并将结果返回给浏览器。\n\n注意，这种转换只发生一次：即第一次有人请求\
  \ JSP 时。之后，每当用户请求 JSP 时，servlet 都会直接运行。概念介绍到此为止——现在来看代码。当你创建一个 JSP 时，你会将特殊的 JSP\
  \ 元素混合到你的普通 HTML 中。你可以包含四种 JSP 元素：\n\n- **指令（Directives）：** *指令*（directive）是一种选项设置，影响如何从\
  \ JSP 页面构建 servlet。\n- **表达式（Expressions）：** *表达式*（expression）可以是任何 Java 表达式。结果会被求值并插入文档中。\n\
  - **脚本段（Scriptlets）：** *脚本段*（scriptlet）是直接插入 servlet 的 Java 语句序列。\n- **声明（Declarations）：**\
  \ *声明*（declaration）是位于 servlet 类方法之外的 Java 代码。\n\n### 使用页面指令（Page Directives）\n\n\
  *页面指令*（page directive）是一种 JSP 元素，用于设置决定 JSP 如何转换为 servlet 的选项。页面指令的基本格式为：\n\n```jsp\n\
  <%@ page attribute=value %>\n```\n\n### 使用 JavaServer Pages\n\n*attribute* 可以是表\
  \ 3-1 中列出的任何属性。\n\n**表 3-1：常用的页面指令属性**\n\n| 名称 | 描述 |\n| :--- | :--- |\n| `import=\"\
  package.class\"` | 向 servlet 添加 import 语句，以便在其他 JSP 元素中使用类无需完全限定。 |\n| `content-Type=\"\
  MIME-type\"` | 允许你指定 servlet 创建的文档类型。默认为 `text/html`。你很少需要更改此设置。 |\n| `isThreadSafe=\"\
  boolean\"` | 如果为 true，假设 servlet 是线程安全的。如果为 false，servlet 声明中会实现 SingleThreadModel，使线程在单线程模型中运行。默认为\
  \ true。 |\n| `session=\"boolean\"` | 如果为，servlet 使用会话管理。默认为 `true`。 |\n| `buffer=\"\
  size\"` | 指定 `out` 变量使用的缓冲区大小。默认取决于服务器，但绝小于 8KB。 |\n| `errorPage=\"URL\"` | 指定当此\
  \ servlet 抛出未捕获的异常时显示的错误页面名称。 |\n| `isErrorPage=\"boolean\"` | 如果为，此页面是其他 JSP 页面的错误页面。默认为\
  \ `false`。 |\n\n你最常用的页面指令是 `import`，因为它允许导入 API 类的包，以便在表达式、脚本段和声明元素中使用它们。这里有一个导入\
  \ `java.util` 包的页面指令：\n\n```jsp\n<%@ page import=\"java.util.*\" %>\n```\n\n\n\n\
  \n你将它们放置在顶部或顶部附近以便于查找。\n\n### 使用表达式\n\nJSP `expression`（表达式）是任何求值为字符串的 Java 表达式。实际上，该表达式并不需要直接求值。以下是你可以如何使用\
  \ `java.util.Date` 类来显示当前日期和时间：\n\n```jsp\n<%=new java.util.Date()%>\n```\n\n此表达式创建了\
  \ `java.util.Date()` 类的一个新实例，该实例代表当前的日期和时间。系统会隐式调用 `toString()` 方法将此对象转换为字符串。\n\n\
  如果你包含了页面导入指令（page import directive），你就可以省略此表达式中的限定符，如下例所示：\n\n```jsp\n<%@ page import=\"\
  java.util\" %>\n```\n\n```jsp\n<%=new Date()%>\n```\n\n为了使用表达式执行更多有趣的操作，你可以使用预定义变量，也称为隐式对象（implicit\
  \ objects）——即在整个 JSP 页面中供表达式、脚本段或声明可使用的 Java 变量。表 3-2 列出了你最常用的 JSP 隐式对象。\n\n隐式对象的工作方式与其在\
  \ servlet 中对应的对象相同。例如，`response` 对象就是传递给 `doGet` 或 `doPost` 方法的响应参数。\n\n你在表达式中使用得最多的隐式对象是\
  \ `request`。特别是，你使用它的 `getParameter` 方法来获取用户在表单中输入的值。以下是一个显示在标题为 \"Name\" 的输入字段中输入值的表达式：\n\
  \n```jsp\n<%= request.getParameter(\"Name\")%>\n```\n\n#### 表 3-2：隐式对象\n\n| 名字 |\
  \ 描述 |\n| :--- | :--- |\n| `out` | 用于向响应写入数据；等同于 servlet 中的 `response.getWriter()`。\
  \ |\n| `request` | 作为请求对象；等同于 servlet 中 `doGet` 或 `doPost` 方法的 `request` 参数。 |\n\
  | `response` | 作为响应对象；等同于 servlet 中 `doGet` 或 `doPost` 方法的 `response` 参数。 |\n| `session`\
  \ | 用于管理会话；等同于 servlet 中的 `request.getSession()`。 |\n\n`Name` 字段的值会被插入在该表达式出现在 JSP\
  \ 文件中的任何地方。这里有一个名为 `InputJSP.jsp` 的简单 JSP 文件，它显示了一个输入文本框和一个按钮。当用户点击按钮时，他在输入字段中输入的任何文本都将显示在按钮下方，如下所示：\n\
  \n```html\n<html>\n<head>\n<title>Input JSP</title>\n</head>\n<body>\n<form action=\"\
  InputJSP.jsp\" method=\"post\">\nEnter some text:&nbsp;\n<input type=\"text\" name=\"\
  Text\">\n<br><br>\n<input type=\"submit\" value=\"Submit\">\n</form><br>\n<h3>You\
  \ entered:&nbsp;\n<%= request.getParameter(\"Text\")%></h3>\n</body>\n</html>\n\
  ```\n\n此 JSP 的 HTML 定义了一个表单，其中包含一个名为 `Text` 的输入文本字段和一个 `Submit` 按钮。当用户点击 `Submit`\
  \ 按钮时，会向服务器发送一个 HTTP POST 请求以请求 `InputJSP.jsp`。用户输入的任何文本都会随请求一起发送。当运行 servlet 运行时，文本将通过表达式\
  \ `request.getParameter(\"Text\")` 获取并显示在按钮下方。\n\n图 3-1 显示了此 servlet 的运行情况。\n\n\
  ***注意：*** 表达式还可以调用你通过声明元素（declaration elements）添加到 JSP 中的方法。你可以在本章稍后的“使用声明”部分看到如何这样做的示例。\n\
  \n![Image 103](img/index-768_1.png)\n\n**图 3-1：** Input-JSP.jsp 的运行。\n\n### 使用脚本段\n\
  \n正如本章前面提到的，`scriptlet`（脚本段）是直接插入到 servlet 中的语句或语句组，插入的位置就在生成周围 HTML 的 `out.print`\
  \ 语句处。简而言之，脚本段允许你在渲染页面的代码中添加自己的代码。\n\n脚本段遵循以下基本形式：\n\n```jsp\n<% *statements...\
  \ %>\n```\n\n这是一个名为 `DateJSP.jsp` 的 JSP，它使用 `DateFormat` 类来格式化日期并将其显示在页面上：\n\n```jsp\n\
  <html>\n<%@ page import=\"java.text.*\" %>\n<%@ page import=\"java.util.*\" %>\n\
  <head>\n<title>Date JSP</title>\n</head>\n<body>\n<h1>\nToday is\n<%\nDateFormat\
  \ df = DateFormat.getDateInstance(DateFormat.FULL);\nDate today = new Date();\n\
  String msg = df.format(today);\nout.println(msg);\n%>\n</h1>\n<h1>Have a nice day!</h1>\n\
  </body>\n</html>\n```\n\n此 JSP 以一对页面导入指令开始，用于导入 `java.text` 和 `java.util` 包。然后，接下来的\
  \ Java 语句被直接插入在生成文本 `Today is` 和 `Have a nice day!` 的行之间，如下所示：\n\n```java\nDateFormat\
  \ df = DateFormat.getDateInstance(DateFormat.FULL);\nDate today = new Date();\n\
  String msg = df.format(today);\nout.println(msg);\n```\n\n这些行创建了一个名为 `msg` 的字符串变量，然后使用\
  \ `out.println` 将字符串写入响应输出。结果是，格式化的日期被插入到 `<h1>Today is </h1>` 和 `<h1>Have a nice\
  \ day!</h1>` 之间。\n\n此 JSP 以一对页面导入指令开始，用于导入 `java.text` 和 `java.util` 包。然后，接 Java\
