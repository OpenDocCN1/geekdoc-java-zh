  \ alignment)` | 设置列内节点的对齐方式。`Pos` 枚举的解释请参见表 4-5。 |\n| `void setHgap(double value)`\
  \ | 设置水平间隙。对于水平流式布局，这是节点之间的空间。对于垂直流式布局，这是列之间的空间。 | |\n| `static void setMargin(Node\
  \ child, Insets value)` | 设置给定子节点的内边距。`Insets` 类的构造函数请参见表 4-2。 |\n| `void setOrientation(Orientation\
