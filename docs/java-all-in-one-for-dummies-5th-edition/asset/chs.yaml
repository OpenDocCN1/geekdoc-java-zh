  \ 命令\n\n`javadoc` 命令有几十个选项可以设置，这使其成为一个非常复杂的命令。然而，你可以忽略所有这些选项来创建一个基础的文档页面。只需指定你想要创建文档的所有\
  \ Java 文件的完整路径即可，如下：\n\n`javadoc com\\lowewriter\\payroll\\*.java`\n\n`javadoc`\
  \ 命令会在当前目录中创建文档页面，因此你可能需要先切换到你希望这些页面所在的目录。\n\n有关使用此命令的更完整信息，请参阅 Oracle 网站上的 `javadoc`\
  \ 文档。你可以在这里找到：[`www.oracle.com/technetwork/articles/java/index-jsp-135444.html`](http://www.oracle.com/technetwork/articles/java/index-jsp-135444.html)\n\
  \n#### 查看 JavaDoc 页面\n\n运行 `javadoc` 命令后，你可以从 `index.html` 页面开始访问文档页面。要快速显示此页面，只需在运行\
  \ `javadoc` 命令后在命令行提示符中输入 `index.html` 即可。或者你可以启动浏览器，导航到创建文档页面的目录，并打开 `index.html`\
  \ 页面。无论哪种方式，图 8-1 显示了一个列出两个类的索引页。\n\n**图 8-1:** JavaDocs 索引页。\n\n如果你觉得这个页面看起来熟悉，那是因为\
  \ Java API 的文档是使用 JavaDocs 创建的。因此你应该已经知道如何在这些页面之间跳转。\n\n要查看某个类的文档，点击类名的链接。会弹出一个包含该类完整文档的页面。例如，图\
  \ 8-2 显示了 `Employee` 类文档页的一部分。JavaDocs 是根据列表 8-1 所示的源文件生成此页面的。\n\n**图 8-2:** `Employee`\
  \ 类的文档。\n\n### 使用 Java 模块系统\n\n本章到目前为止的 Java 包自 1995 年引入 Java 的第一个版本以来，一直为 Java\
  \ 程序员提供了很好的支持。在 Java 首次发布时，包是非常先进的，但多年来它们已经显现出过时的之感。例如，开发者在管理使用大量包的大型应用程序的包时，经常会遇到问题，特别是当这些包需要不同版本的\
  \ Java 时。\n\n包的另一个问题是它们没有提供一种简单的方法来创建轻量级应用程序，其运行时仅包含实际需要的 Java 部分。这可能会限制 Java 在资源有限的设备（如嵌入式控制器或智能手机）上运行的能力。\n\
  \nJava 9 新引入的 Java 模块系统旨在解决这两个问题，以及旧包系统中的其他一些更更微妙的问题。Java 模块系统也被称为 Project Jigsaw（拼图项目），已经开发了六多年。它最初计划在\
  \ 2011 年随 Java 7 一起发布，但未能按时完成，因此被推迟到了 Java 8。当 Java 8 在 2014 年推出时，Project Jigsaw\
  \ 仍然没有完成，因此它被推迟到了 Java 9。Java 9 的发布被延迟了多次，以便完成 Project Jigsaw，好消息是，Java 模块系统终于面了！\n\
  \nProject Jigsaw 花费如此长时间进行开发，这证明了该项目的重要性。Project Jigsaw 的开发者想要确保他们的工作是正确的，并且要确保\
  \ Java 模块系统不会以任何方式破坏任何依赖久经考验的 Java 包系统的现有应用程序。事实上，Java 模块系统设计为与现有的 Java 包并排工作，因此在你准备好并愿意这样做之前，你不需要将任何现有的\
  \ Java 代码转换为 Project Jigsaw。\n\n#### 理解模块\n\n*模块* 是一种分组类的新方法，它显式地列出它依赖于哪些模块，以及模块中的哪些包可以提供给其他模块。具体来说：\n\
  \n- 模块必须显式列出它的*依赖项*——即模块编译和运行需要哪些其他模块。例如，如果模块中的一个或多个类需要数据库访问，它将需要标准的 `java.SQL`\
  \ 模块。\n- 模块还必须显式列出其包含的任何包的*可见性*。正如你所知，你可以在传统的包中创建公共类型，这些公共类在整个包中都是可用的。有了模块，包中的公共类型只有在该包被显式列为导出（exported）类型时才能在模块外部可用。\n\
  \n## 与包和模块工作\n\n如果这听起来很复杂，不要担心——其实并不是。像传统的包一样，模块存储在 JAR 文件中。包含模块的 JAR 文件称为模块 JAR\
  \ 文件。模块 JAR 文件与普通 JAR 文件的唯一区别在于模块 JAR 文件包含一个名为 `module-info.class` 的特殊类。`module-info.class`\
  \ 类文件标识了模块的依赖关系以及其他模块可见的包。这一切都是通过名为 `module-info.java` 的源文件实现的。\n\n## module-info.java\
  \ 文件\n\n`module-info.java` 文件是定义模块的 Java 源文件。模块通过使用 Java 9 引入的多种 Java 语言元素的组合定义。\n\
  \n这是一个创建模块但没有定义任何依赖或导出包的简单 module-info.java 文件：\n\n```java\nmodule com.lowewriter.payroll\
  \ {}\n```\n\n在这个示例中，模块名称是 `com.lowewriter.payroll`。注意，模块的命名与包一样，通常使用反向域名法。换句话说，对于这个示例，我使用了自己的个人域名（lowewriter.com）的反向，后面跟着模块名称。\n\
  \n要指定模块依赖于另一个模块，你需要添加 `requires` 语句来指定该模块名称。例如，如果该模块将需要数据库访问，它需要标准的 `java.SQL` 模块：\n\
  \n```java\nmodule com.lowewriter.payroll\n{\n    requires java.SQL;\n}\n```\n\n\
  如果该模块还依赖于你创建的名为 `com.` 的另一个模块\n\n\n\n\n\n对于 `lowewriter.util`，你还需要为该模块添加一个 `requires`\
  \ 语句：\n\n```java\nmodule com.lowewriter.payroll\n{\n    requires java.SQL;\n   \
  \ requires com.lowewriter.util;\n}\n```\n\n你还可以添加 `exports` 语句来导出模块中包含的包。当你导出一个包时，该包内的任何公共类或接口对其他模块都是可见的。例如：\n\
  \n```java\nmodule com.lowewriter.payroll\n{\n    requires java.SQL;\n    requires\
  \ com.lowewriter.util;\n    exports com.lowewriter.payrolldb;\n}\n```\n\n在这个示例中，`com.lowewriter.payrolldb`\
  \ 包定义的任何公共类或接口对其他模块都是可见的。\n\n370 第 3  **面向对象编程**\n\n**为模块设置文件夹**\n\n为模块设置源文件夹与为包设置文件夹类似，但有一个额外要求：`module-info.java`\
  \ 文件必须位于模块的根目录中。通常，模块的根目录命名与模块名称相同，并使用点分隔。例如，`com.lowewriter.payroll` 模块的根目录是 `com.lowewriter.payroll`。\n\
  \n`module-info.java` 文件位于根目录内。此外，作为模块一部分的包路径通常遵循与普通包相同的约定。因此，在模块根目录下有一个名为 `com`\
  \ 的文件夹，`com` 文件夹内有一个名为 `lowewriter` 的文件夹，而 `lowewriter` 文件夹内有一个名为 `payroll` 的文件夹。`payroll`\
  \ 包的 java 文件位于 `payroll` 文件夹中。\n\n假设 `payroll` 包有两个源文件（名为 `Address.java` 和 `Employee.java`），则包含\
  \ `payroll` 示例源文件的完整文件夹结构如下所示：\n\n```\ncom.lowewriter.payroll\n  module-info.java\n\
  \  com\n    lowewriter\n      payroll\n        Address.java\n        Employee.java\n\
  ```\n\n也许 `module-info.java` 文件中的 `exports` 命令现在更有意义了：\n\n**处理包与模块**\n\n```java\n\
  exports com.lowewriter.payroll;\n```\n\n注意，从模块根目录到包源文件的路径对应于包名。\n\n**编译模块**\n\n\
  要编译一个模块，你可以从命令提示符使用 `javac` 命令，并指定想要编译的所有源文件的名称。首先，导航到模块的根目录（在此例中为 `C:\\java9\\\
  com.lowewriter.payroll`）。然后使用如下 `javac` 命令：\n\n```\njavac module-info.java com\\\
  lowewriter\\payroll\\*.java\n```\n\n该命令将在模块的根目录中创建一个 `module-info.class` 文件，并为 `com\\\
  lowewriter\\payroll` 中所有的 Java 源文件创建 `.class` 文件。对于此示例，`com\\lowewriter\\payroll`\
  \ 文件夹将创建两个类文件：`Address.class` 和 `Employee.class`。\n\n**创建模块化 JAR 文件**\n\n创建 Java\
  \ 模块的最后一步是将编译后的类文件（包括 `module-info.class`）汇成一个模块 JAR 文件。你可以使用 `jar` 命令来实现这一点，如下所示：\n\
  \n```\njar cf com.lowewriter.payroll.jar *.class com\\lowewriter\\payroll\\*.class\n\
  ```\n\n在这个示例中，`cf` 表示创建一个 Jar 文件。`cf` 后面跟着要包含的类文件。为了保持命令简单，我使用了通配符来包含模块根目录下的所有类文件以及\
  \ `com\\lowewriter\\payroll` 文件夹下的所有类文件。\n\n你可以通过运行带有 `tf` 选项并跟 Jar 文件名的命令来验证 Jar\
  \ 文件是否包含正确的内容。例如：\n\n```\nC:\\Java9\\com.lowewriter.payroll>jar tf com.lowewriter.payroll.jar\n\
  META-INF/\nMETA-INF/MANIFEST.MF\nmodule-info.class\ncom/lowewriter/payroll/Address.class\n\
  com/lowewriter/payroll/Employee.class\n```\n\n如你所见，`jar tf` 命令表明 Jar 文件包含了预期的三个类：`module-info.class`\
  \ 以及两个 `com.lowewriter.payroll` 类。\n\n关于 Java 模块系统还有很多内容超出了本书的范围，但这些应该足够让你开始学习。欲需更多信息，请在网上搜索\
  \ *Java Module System*（Java 模块系统）。你会在来自 Oracle 以及其他来源的关于处理大型应用程序模块的高级细节中找到大量优质信息。\n\
