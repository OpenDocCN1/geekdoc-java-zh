  *   **48**: `getGuess` 方法使用 `while` 循环，只有当用户输入 1 到 10 之间的数字时才会退出。注意如果数字超出范围，返回语句就不会执行。相反，程序会显示错误消息，`while`\
  \ 循环会重复。\n*   **61**: `askForAnotherRound` 方法的开始，该方法返回一个布尔值。\n*   **63**: `askForAnotherRound`\
  \ 方法使用 `while` 循环，当用户输入有效的 Y 或 N 时退出。\n*   **69**: `askForAnotherRound` 方法在用户输入\
  \ Y 或 y 时返回 `true`。\n*   **71**: `askForAnotherRound` 方法在用户输入 N 或 n 时返回 `false`。\n\
  \n### 带有参数的方法\n\n*参数*（parameter）是你传递给方法的值。然后方法可以像使用局部变量一样使用参数，其值是由调用方法传递的。\n\n列表\
  \ 7-2 显示的猜数字应用程序有一个名为 `getRandomNumber` 的方法，它返回一个 1 到 10 之间的随机数：\n\n```java\npublic\
  \ static int getRandomNumber()\n{\n    return (int)(Math.random() * 10) + 1;\n}\n\
  ```\n\n这个方法很有用，但如果你能告诉它你想要的随机数范围，它会变得更有用。如果这样调用方法来获取 1 到 10 之间的随机数将会很棒：\n\n```java\n\
  int number = getRandomNumber(1, 10);\n```\n\n如果你的程序需要掷骰子，你可以调用同一个方法：\n\n```java\n\
  int number = getRandomNumber(1, 6);\n```\n\n或者，为了从一副 52 张的牌中随机抽取一张牌，你可以这样调用它：\n\n\
  ```java\nint number = getRandomNumber(1, 52);\n```\n\n你也不必从 1 开始。为了获取一个 50 到 100\
  \ 之间的随机数，你可以这样调用该方法：\n\n```java\nint number = getRandomNumber(50, 100);\n```\n\n\
  #### 为你的疯狂程序添加一些方法\n\n**声明参数**\n\n接受参数的方法必须在方法声明中列出参数。\n\n\n\n\n声明。参数放置在方法名后括号内的\
  \ `parameter list` 中。对于方法使用的每个参数，你都需要列出参数类型，紧接着是参数名称。如果你需要多个参数，请用逗号分隔这些参数。\n\n这里是一个接受参数的\
  \ `getRandomNumber` 方法版本：\n\n```java\npublic static int getRandomNumber(int min,\
  \ int max)\n{\n    return (int)(Math.random() * (max - min + 1)) + min;\n}\n```\n\
  \n# 第 7 章 为你的疯狂程序添加一些方法\n\n在这里，该方法使用了两个参数，类型均为 `int`，分别名为 `min` 和 `max`。然后，在方法体内，这些参数可以像局部变量一样使用。\n\
  \n你为参数使用的名称可以与调用方法时传递给方法的变量名称相同，但并不一定相同。你可以这样调用 `getRandomNumber` 方法：\n\n```java\n\
  int min = 1;\nint max = 10;\nint number = getRandomNumber(min, max);\n```\n\n或者你也可以这样调用它：\n\
  \n```java\nint low = 1;\nint high = 10;\nint number = getRandomNumber(low, high);\n\
  ```\n\n或者你完全可以省去变量，直接将字面量传递给方法：\n\n```java\nint number = getRandomNumber(1, 10);\n\
  ```\n\n你还可以指定表达式作为参数值：\n\n```java\nint min = 1;\nint max = 10;\nint number = getRandomNumber(min\
  \ * 10, max * 10);\n```\n\n在这里，`number` 被赋值为 10 到 100 之间的某个值。\n\n## 参数的作用域\n\n参数的作用域是声明该参数的方法。因此，参数的名称可以与其他方法中局部变量名称相同，而不会引起任何冲突。考虑这个程序：\n\
  \n```java\npublic class ParameterScope\n{\n    public static void main(String[]\
  \ args)\n    {\n        int min = 1;\n        int max = 10;\n        int number\
  \ = getRandomNumber(min, max);\n        System.out.println(number);\n    }\n\n \
  \   public static int getRandomNumber(int min, int max)\n    {\n        return (int)(Math.random()\
  \ * (max - min + 1)) + min;\n    }\n}\n```\n\n在这里，`main` 方法声明了名为 `min` 和 `max` 的变量，而\
  \ `getRandomNumber` 方法使用 `min` 和 `max` 作为其参数名称。这没有导致任何冲突，因为在每个情况下，作用域都限于单个方法。\n\n\
  ## 理解值传递（pass-by-value）\n\n当 Java 通过参数将变量传递给方法时，方法本身接收的是变量值的副本，而不是变量本身。这种副本被称为 `pass-by-value`，它有一个重要的结果：如果方法更改了它作为参数接收到的值，该更改**将不会**反映在传递给方法的原始变量上。以下程序可以帮助理解这一点：\n\
  \n```java\npublic class ChangeParameters\n{\n    public static void main(String[]\
  \ args)\n    {\n        int number = 1;\n        tryToChangeNumber(number);\n  \
  \      System.out.println(number);\n    }\n\n    public static void tryToChangeNumber(int\
  \ i)\n    {\n        i = 2;\n    }\n}\n```\n\n在这里，名为 `number` 的变量被设置为 1，然后传递给名为\
  \ `tryToChangeNumber` 的方法。该方法接收名为 `i` 的变量作为参数，并将 `i` 的值设置为 2。与此同时，在 `main` 方法中，在\
  \ `tryToChangeNumber` 方法返回后使用 `println` 打印 `number` 的值。因为 `tryToChangeNumber` 只得到了\
  \ `number` 的副本而不是 `number` 变量本身，所以此程序在控制台上显示以下内容（请鼓掌 . . .）：1。\n\n关键点在于：尽管 `tryToChangeNumber`\
  \ 方法更改了其参数的值，但该更改对传递给方法的原始变量没有影响。\n\n## 尝试另一个版本的猜数字游戏程序\n\n为了展示接受参数的方法的好处，列表 7-3\
  \ 显示了猜数字游戏的另一个版本。该版本除了 `main` 之外，还使用了以下方法：\n\n- **playARound**: 该方法玩一轮猜数字游戏。它不返回值，但接受两个参数\
  \ `min` 和 `max`，它们表示要猜数字的最小值和最大值。\n- **getRandomNumber**: 该方法返回一个在作为参数传递的 `min`\
  \ 和 `max` 值之间的随机数。\n- **getGuess**: 该方法也接受两个参数 `min` 和 `max`，用于限制用户猜测的范围。\n- **askForAnotherRound**:\
  \ 该方法询问用户再玩一轮，并返回一个 `boolean` 值表示用户是否想继续玩。它接受一个 `String` 值作为参数；此字符串显示在控制台上，以提示用户回复。\n\
  \n### 列表 7-3: 另一个版本的猜数字游戏程序\n\n```java\nimport java.util.Scanner;\n\npublic class\
  \ GuessingGameMethod3\n{\n    static Scanner sc = new Scanner(System.in);\n\n  \
  \  public static void main(String[] args)\n    {\n        System.out.println(\"\
  Let's play a guessing game!\");\n        do\n        {\n            playARound(1,\
  \ getRandomNumber(7, 12));\n        } while (askForAnotherRound(\"Try again?\"));\n\
  \        System.out.println(\"Thank you for playing!\");\n    }\n\n    public static\
  \ void playARound(int min, int max)\n    {\n        boolean validInput;\n      \
  \  int number, guess;\n        number = getRandomNumber(min, max);\n        System.out.println(\"\
  I'm thinking of a number between \" + min + \" and \" + max + \".\");\n        guess\
  \ = getGuess(min, max);\n        if (guess == number)\n        {\n            System.out.println(\"\
  You're right!\");\n        }\n        else\n        {\n            System.out.println(\"\
  You're wrong! The number was \" + number);\n        }\n    }\n\n    public static\
  \ int getRandomNumber(int min, int max)\n    {\n        return (int)(Math.random()\
  \ * (max - min + 1)) + min;\n    }\n\n    public static int getGuess(int min, int\
  \ max)\n    {\n        while (true)\n        {\n            System.out.print(\"\
  between \" + min + \" and \" + max + \". What do you think it is? \");\n       \
  \     guess = sc.nextInt();\n            if ((guess < min) || (guess > max))\n \
  \           {\n                System.out.print(\"Try again: \");\n            }\n\
  \            else\n            {\n                return guess;\n            }\n\
  \        }\n    }\n\n    public static boolean askForAnotherRound(String prompt)\n\
  \    {\n        while (true)\n        {\n            String answer;\n          \
  \  System.out.print(\"\\n\" + prompt + \" (Y or N) \");\n            answer = sc.next();\n\
  \            if (answer.equalsIgnoreCase(\"Y\"))\n            {\n              \
  \  return true;\n            }\n            else if (answer.equalsIgnoreCase(\"\
  N\"))\n            {\n                return false;\n            }\n        }\n\
  \    }\n}\n```\n\n\n\n\n相反，程序会显示一条错误消息，然后重复 `while` 循环。\n\n→ 63 `askForAnotherRound`\
  \ 方法接受一个字符串变量作为提示符。\n\n## 第 8 章：处理异常\n\n## 本章内容\n- 当良好的程序出现问题时该怎么办\n- 深入了解异常的所有信息\n\
  - 使用 `try`、`catch` 和 `finally`\n- 从源头上防止异常的发生\n\n本章介绍了当 Java 遇到无法处理的错误情况时会发生什么。多年来，计算机编程语言设计了许多方法来处理这类错误。早期的编程语言处理这些错误非常粗暴：直接终止程序并以十六进制格式打印出计算机内存的所有内容。这种输出被称为\
  \ `dump.*`。\n\n后来的编程语言尝试了各种方法，在发生严重错误时保持程序运行。在某些语言中，可能导致错误的语句被添加了某些元素，以提供关于错误的反馈。例如，一个从磁盘文件读取数据的语句在发生\
  \ I/O 错误时可能会返回一个错误代码。另一些语言允许你为程序创建一个特殊的错误处理部分，如果发生错误，控制权就会转移到该部分。\n\n作为一种面向对象的编程语言，Java\
  \ 通过在使用错误发生时创建特殊的 `exception objects` 来处理错误。此外，Java 还有一种名为 `try` 的特殊语句，你必须使用它来处理异常对象。在本章中，你将找到处理异常对象和\
  \ `try` 语句的所有细节。\n\n### 理解异常\n\n`exception`（异常）是在 Java 程序发生错误且 Java 无法自动修复该错误时创建的对象。异常对象包含了有关所发生错误类型的信息。最重要的信息——错误原因——是通过创建异常的异常类名称指定的。你通常不需要对异常对象做任何事情，只需搞清楚你拥有哪一个即可。\n\
  \n可能发生的每种异常都由不同的异常类表示。以下是一些异常：\n\n- `IllegalArgumentException`：你向方法传递了错误的参数。\n-\
  \ `InputMismatchException`：控制台输入与 `Scanner` 类方法预期的数据类型不匹配。\n- `ArithmeticException`：你尝试了非法的算术操作，例如整数除以零。\n\
  - `IOException`：执行 I/O 的方法遇到了无法恢复的 I/O 错误。\n- `ClassNotFoundException`：找不到必要的类。\n\
  \n还有许多其他类型的异常，你将在本书的后续章节中了解到其中许多。\n\n你还需要了解关于异常的其他几点：\n\n- 当错误发生并创建异常对象时，可以说 Java\
  \ “抛出了异常”（`thrown an exception.*`）。Java 的抛掷手臂相当有力，所以异常总是会被抛回给导致其创建的语句。\n- 导致异常的语句如果想要，就可以\
  \ `catch`（捕获）该异常，但如果不需要，也不必捕获。相反，它可以躲避并让其他人捕获异常。那另一个人是调用当前执行方法的语句。\n- 如果每个人都躲避，且异常从未被程序捕获，程序将突然结束并在控制台上显示一条难看的的异常消息（在下一节中将详细介绍）。\n\
  - Java 中的两种基本类型异常是检查异常（checked exceptions）和未检查异常（unchecked exceptions）：\n    - `checked\
  \ exception`（检查异常）是编译器要求你以某种方式提供的异常。如果你不提供，你的程序将无法编译。\n    - `unchecked exception`（未检查异常）是你可以提供但不必提供的异常。\n\
  - 到目前为止，在书中我避免了使用任何抛出检查异常的 Java API 方法，但我使用了可能抛出未检查异常的方法。例如， `Scanner` 类的 `nextInt`\
  \ 方法在用户输入有效整数值以外的内容时会抛出未检查异常。更多信息，请继续阅读。\n\n## 见证异常\n\n呈请你审批的是一个仓忙编写的 Java 程序故事，它是为了说明某些\
  \ Java 编程细节而快速组合的，同时忽略了其他细节。正如俗说，“眼不见为净”。该程序与用户玩猜数字游戏，通过一个名为 `Scanner` 的类接受数字输入。然而，同一个程序忽略了用户可能输入奇怪且意料之外数据的真实可能性——这些数据几乎不能被认为是数字，至少在传统意义上不是如此。时间：现在。地点：这里。这个程序即将跨入\
  \ . . . 异常区域（Exception Zone）。\n\n我在这里说的程序当然是在最近几章中以几种形式出现的猜数字游戏程序。（你可以在第 2 卷第 7\
  \ 章最后找到最新版本。）该程序包含一个验证例程，防止用户做出不在 1 到 10 之间的猜测。然而，该验证例程假设用户输入了一个有效的整数 `num`。如果用户输入了整数以外的值，`Scanner`\
  \ 类的 `nextInt` 方法就会严重失败。\n\n图 8-1 显示了当用户输入文本（如“five”）而不是数字时，控制台看起来的示例。用户输入错误数据后的第一行显示程序遇到了一个名为\
  \ `InputMismatchException` 的异常。简而言之，此异常意味着用户输入的数据无法与 `Scanner` 类预期的数据类型匹配。`nextInt`\
  \ 方法期望找到一个整数，结果却找到了单词“five（五）”。\n\n## 寻找罪凶手\n\n你可以通过检查显示在异常发生行之后的行，找到你程序中导致异常发生的精确语句。这些行被称为堆栈跟踪（`stack\
  \ trace,*`），列出了异常在程序中止之前经过的方法。通常，列出的第一个方法位于 Java API 的深处，最后一个列出的方法是你的应用程序的主方法。在中间某个，你会发现从\
  \ Java API 方法到你程序方法的切换。那通常就是你程序中导致错误的语句所在的位置。\n\n```\nat java.util.Scanner.throwFor(Scanner.java:909)\n\
  at java.util.Scanner.next(Scanner.java:1530)\nat java.util.Scanner.nextInt(Scanner.java:2160)\n\
  at java.util.Scanner.nextInt(Scanner.java:2119)\nat GuessingGameMethod3.getGuess(GuessingGameMethod3.java:51)\n\
  at GuessingGameMethod3.playARound(GuessingGameMethod3.java:31)\nat GuessingGameMethod3.main(GuessingGameMethod3.java:13)\n\
  ```\n\n每行不仅列出了类和方法名，还列出了包含类的文件名以及异常发生的行号。因此，此堆栈跟踪中的第一行指示异常在 `Scanner.java` 文件的 909\
  \ 行 `Scanner` 类的 `throwFor` 方法中被处理。\n\n\n\n\n异常发生在 `GuessingGameMethod3.java` 文件的第\
  \ 51 行。\n\n果其然，那一行调用了 `Scanner` 类的 `nextInt` 方法来获取用户输入的输入。\n\n### 捕获异常\n\n每当你使用可能会抛出异常的语句时，都应该编写特殊的代码来预测并捕获异常。这样，如果发生异常，你的程序就不会像图\
  \ 8-1 所示那样崩溃。\n\n你通过 `try` 语句来捕获异常，它的通用形式如下：\n\n```java\ntry {\n    // 可能抛出异常的语句\n\
  }\ncatch (exception-type identifier)\n{\n    // 抛出异常时执行的语句\n}\n```\n\n在这里，你将可能抛出异常的语句放在\
  \ `try 块` 中。然后你用 `catch 块` 捕获异常。\n\n关于 `try` 语句，有几点需要注意：\n\n- 你可以编写多个 `catch` 块。这样，如果\
  \ `try 块` 中的语句可能抛出不止一种类型的异常，你可以在单独的 `catch 块` 中捕获每种异常。\n- 从作用域的角度考虑，`try 块` 是一个自包含的块，与\
  \ `catch 块` 离。因此，你在 `try 块` 中声明的任何变量在 `catch 块` 中都是不可见的。如果你希望它们可见，请在 `try` 语句之前立即声明它们。\n\
  - 你还可以在所有 `catch` 块之后编写一个特殊块（称为 `finally 块`）。有关编写 `finally 块` 的更多信息，请参阅本章后半部分的“使用\
  \ finally 块”节。\n- Java API 中的各种异常类定义在不同的包中。如果你使用的异常类没有定义在始终可用的标准 `java.lang` 包中，你需要为定义该异常类的包提供\
  \ `import` 语句。\n\n#### 处理异常\n\n#### 简单示例\n\n为了说明如何处理异常，这里有一个程序，它对两个数字进行除法，并使用 `try/catch`\
  \ 语句在第二个数字为零时捕获异常：\n\n```java\npublic class DivideByZero\n{\n    public static void\
  \ main(String[] args)\n    {\n        int a = 5;\n        int b = 0; // 你知道这行行不通\n\
  \        try\n        {\n            int c = a / b; // 但你还是试了试\n        }\n    \
  \    catch (ArithmeticException e)\n        {\n            System.out.println(\"\
  Oops, you can't \" + \"divide by zero.\");\n        }\n    }\n}\n```\n\n在这里，除法发生在\
  \ `try 块` 中，并由 `catch 块` 处理 `ArithmeticException`。`ArithmeticException` 由 `java.lang`\
  \ 定义，因此不需要它的它的 `import` 语句。\n\n当你运行此程序时，控制台会显示以下内容：\n\n`Oops, you can't divide by\
  \ zero.`\n\n这里没有其他内容了。不过，下一节将展示更复杂的示例。\n\n#### 另一个示例\n\n列表 8-1 显示了一个程序的简单示例，该程序使用方法从用户处获取有效的整数。如果用户输入的不是有效的整数，`catch\
  \ 块` 会捕获错误并强制循环重复。\n\n**列表 8-1：获取有效整数**\n\n```java\nimport java.util.*;\n\npublic\
  \ class GetInteger\n{\n    static Scanner sc = new Scanner(System.in);\n    public\
  \ static void main(String[] args)\n    {\n        System.out.print(\"Enter an integer:\
  \ \");\n        int i = GetAnInteger();\n        System.out.println(\"You entered\
  \ \" + i);\n    }\n\n    public static int GetAnInteger()\n    {\n        while\
  \ (true)\n        {\n            try\n            {\n                return sc.nextInt();\n\
  \            }\n            catch (InputMismatchException e)\n            {\n  \
  \              sc.next();\n                System.out.print(\"That's not \" + \"\
  an integer. Try again: \");\n            }\n        }\n    }\n}\n```\n\n在这里，从用户处获取输入并返回给调用方法的语句被编写在\
  \ `try 块` 中。如果用户输入了有效的整数，该语句是该方法中执行的唯一语句。\n\n然而，如果用户输入无法转换为整数的数据，`nextInt` 方法会抛出\
  \ `InputMismatchException`。然后，此异常会被 `catch 块` 拦截——该块通过调用 `next` 方法处理用户的错误输入，并显示错误消息。然后\
  \ `while 循环` 重复。\n\n以下是该程序典型执行时，控制台可能的内容如下：\n\n`Enter an integer: three`\n`That's\
  \ not an integer. Try again: 3.001`\n`That's not an integer. Try again: 3`\n`You\
  \ entered 3`\n\n关于此程序还有其他几点需要注意：\n\n- `import` 语句指定了 `java.util.*` 以导入 `java.util`\
  \ 包中的所有类。这样，`InputMismatchException` 类就被导入了。\n- 必须在 `catch 块` 中调用 `next` 方法来处理用户的无效输入，因为如果抛出了\
  \ `InputMismatchException`，`nextInt` 方法会将输入值留在 `Scanner` 的输入流中。如果你省略了调用 `next` 的语句，`while\
  \ 循环` 将继续读取它，抛出异常并在无限循环中显示错误消息。见图 8-2。\n\n#### 先发制人的处理异常\n\n`try` 语句是程序员工具箱中一个有用且必要的工具。然而，处理异常的最佳方法是防止它们的发生。这并非总是可能的，但在很多情况下是可以的。通过检查数据，你通常可以避免除零导致的\
  \ `ArithmeticException`：\n\n```java\nif (b != 0)\n    c = a / b;\n```\n\n这消除了将除法封装在\
  \ `try 块` 中的必要。你可以通过使用 `Scanner` 的 `hasNextInt` 方法将这种技术同样应用于输入验证。（Scanner 类将下一个输入值称为标记，但这并不重要。）你可以用多种方法实现这种技术，我从第二卷第\
  \ 2 章一直在鼓励你思考这个问题。现在大大期待的答案：列表 8-2。\n\n**列表 8-2：GetInteger 方法的版本**\n\n```java\n\
  import java.util.*;\n\npublic class GetInteger2\n{\n    static Scanner sc = new\
  \ Scanner(System.in);\n    public static void main(String[] args)\n    {\n     \
  \   System.out.print(\"Enter an integer: \");\n        int i = GetAnInteger();\n\
  \        System.out.println(\"You entered \" + i);\n    }\n\n    public static int\
  \ GetAnInteger()\n    {\n        while (!sc.hasNextInt())\n        {\n         \
  \   sc.nextLine();\n            System.out.print(\"That's not \" + \"an integer.\
  \ Try again: \");\n        }\n        return sc.nextInt();\n    }\n}\n```\n\n这是一个巧妙的编程技巧，你觉得呢？`while`\
  \ 语句中的条件表达式调用了 `Scanner` 的 `hasNextInt` 方法来检查下一个值是否为整数。只要该调用返回 `false`（表示下一个值不是有效整数），`while\
  \ 循环` 就会重复。循环体调用 `nextLine` 丢弃坏数据并显示错误消息。只有当你确定输入流中有良好数据时，循环才会结束，因此 `return` 语句调用\
  \ `nextInt` 将数据解析为整数并返回结果。\n\n#### 一次捕获所有异常\n\nJava 提供了一个名为 `Exception` 的全能异常类，所有其他类型的异常都基于它。（不用担心我所指的细节。）\n\
  \n\n\n\n（当你阅读第三本书第 4 章时，这就会变得更有意义了。）\n\n# 第 8 章 异常处理 221\n\n如果你不想在 `catch` 块中写得太具体，可以指定\
  \ `Exception` 而不是更具体的异常类。例如：\n\n```java\ntry\n{\n    int c = a / b;\n}\ncatch (Exception\
  \ e)\n{\n    System.out.println(\"Oops, you can't \" + \"divide by zero.\");\n}\n\
  ```\n\n在这个示例中，`catch` 块指定的是 `Exception` 而不是 `ArithmeticException`。\n\n如果你有某些代码可能会抛出几种类型的异常，并且你想对其中某些类型提供特定的处理，而对所有其他类型提供通用处理，可以按如下方式编写\
  \ `try` 语句：\n\n```java\ntry\n{\n    // 可能会抛出几种类型异常的语句\n}\ncatch (InputMismatchException\
  \ e)\n{\n    // 处理 InputMismatchException 的语句\n}\ncatch (IOException e)\n{\n   \
  \ // 处理 IOException 的语句\n}\ncatch (Exception e)\n{\n    // 处理所有其他异常类型的语句\n}\n```\n\
  \n在这个示例中，假设 `try` 块中的代码可能会抛出 `InputMismatchException`、`IOException` 以及可能的其他某种未预料的异常。这里的三个\
  \ `catch` 块为这些每种可能性提供了支持。\n\n在 `try` 语句上编写多个 `catch` 块时，务必先列出更具体的异常。如果你包含了一个捕捉 `Exception`\
  \ 的 `catch` 块，请将其放在最后。\n\n222 第 2 本 编程基础\n\n## 显示异常消息\n\n在大多数情况下，`try` 语句的 `catch`\
  \ 块对传递给它的异常对象不做任何操作。然而，你可能偶尔想显示错误消息；异常对象有一些有趣的方法，可以经常派上用场。这些方法列在表 8-1 中。\n\n**表\
  \ 8-1：Exception 类的方法**\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `String getMessage()`\
  \ | 用文本消息描述错误。 |\n| `void printStackTrace()` | 将堆栈跟踪打印到标准错误流。 |\n| `String toString()`\
  \ | 返回异常的描述。该描述包括异常类的名称，后跟一个冒号和 `getMessage` 消息。 |\n\n下面的示例显示了你如何在 `catch` 块中为异常打印消息：\n\
  \n```java\ntry\n{\n    int c = a / b;\n}\ncatch (Exception e)\n{\n    System.out.println(e.getMessage());\n\
  }\n```\n\n如果 `b` 的值为 0，这段代码会在控制台上显示文本 `/ by zero`。你可以通过在 `catch` 子句中使用这一行代码：`e.printStackTrace(System.out);`\
  \ 来获取更有趣的输出。\n\n## 使用 finally 块\n\n`finally` 块是一个出现在语句中所有 `catch` 块之后的块。无论 `try`\
  \ 块是否抛出了异常，无论异常是否被任何 `catch` 块捕获，它都会执行。它的目的是让你清理异常可能留下的任何烂摊子，例如打开的文件或数据库连接。\n\n\
  带有 `finally` 块的 `try` 语句的基本框架如下：\n\n```java\ntry\n{\n    *可能会抛出异常的语句*\n}\ncatch\
  \ (*exception-type identifier*)\n{\n    *抛出异常时执行的语句*\n}\nfinally\n{\n    *无论是否发生异常都会执行的语句*\n\
  }\n```\n\n列表 8-3 显示了一个人为构造但很有用的示例，演示了如何使用 `finally` 子句。在这个示例中，一个名为 `divideTheseNumbers`\
  \ 的方法尝试两次除法。如果第一次除法失败（由于 `divide-by-zero` 异常），它会再次尝试除。我知道这完全不理理。但很执着，像青少年一样。\n\n\
  **列表 8-3：使用 finally 子句的程序**\n\n```java\npublic class CrazyWithZeros\n{\n    public\
  \ static void main(String[] args)\n    {\n        try\n        {\n            int\
  \ answer = divideTheseNumbers(5, 0); // 7\n        }\n        catch (Exception e)\
  \ // 9\n        {\n            System.out.println(\"Tried twice, \" + \"still didn't\
  \ work!\");\n        }\n    }\n    public static int divideTheseNumbers(int a, int\
  \ b) // 16\n    throws Exception\n    {\n        int c;\n        try\n        {\n\
  \            c = a / b; // 22\n            System.out.println(\"worked!\"); // 23\n\
  \        }\n        catch (Exception e) // 27\n        {\n            System.out.println(\"\
  didn't work first time.\"); // 28\n        }\n        finally // 29\n        {\n\
  \            System.out.println(\"clean up my mess.\"); // 33\n        }\n     \
  \   return c; // 36\n    }\n}\n```\n\n这是该程序的控制台输出：\n```\nTried twice, still didn't\
  \ work!\nclean up my mess.\ndidn't work first time.\nclean up my mess.\nworked!\n\
  clean up my mess.\n```\n\n接下来的段落逐步解释发生了什么：\n\n`main` 方法调用 `divideTheseNumbers`，并将\
  \ `5` 和 `0` 作为参数传递。`divideTheseNumbers` 声明它会抛出 `Exception`。`try` 块是第一次尝试。如果第一次尝试成功，将执行这一行，你会在控制台上看到\
  \ `worked!`。不幸的是，除法抛出了异常，所以这一行永远不会执行。相反，`catch` 子句捕获了异常，并显示了 `didn't work first\
  \ time.`。`finally` 块无论如何都会执行。这就是控制台输出中第二行的来源。在 `finally` 块执行后，`ArithmeticException`\
  \ 被向上抛出到调用方法，并在第 `9` 行被捕获。这就是控制台输出最后一行的来源。\n\n`divideTheseNumbers` 方法固执地再次尝试除以相同的数字。这一次，没有\
  \ `try` 语句来捕捉错误。然而，由于第二次除法又抛出了异常，这一行仍然不会执行。因此，你没有看到 `second time!`。（如果你看到了，那你就在《阴影区》的剧集里。）\n\
  \n第 8 章 异常处理 225\n\n## 处理检查异常\n\n检查异常是 Java 的设计者认为你的程序必须以某种方式对其提供的异常。每当你编写一个可能抛出检查异常的语句时，你的程序必须做以下两件事之一：\n\
  \n- 通过将语句放在带有该异常 `catch` 块的 `try` 语句中捕获异常。\n- 在包含该语句的方法上指定 `throws` 子句，表示你的方法不想处理该异常，因此它正在将其向上传递。\n\
  \n这被称为**捕获或抛出**规则。简单来说，任何包含可能抛出检查异常的语句的方法都必须承认它知道可能会抛出异常。方法通过直接处理异常或将其向上传递给其调用者来这样做。\n\
  \n为了说明检查异常的使用，我必须使用一些抛出这些异常的方法。到目前为止，我一直避免引入抛出检查异常的类，因此下面的插图使用了一些你不熟悉的类。不要担心这些类是做什么的或如何工作的。重点是看如何处理它们抛出的检查异常。\n\
  \n## 查看捕获或抛出的编译器错误\n\n这里有一个使用 `FileInputStream` 类的程序。要从该类创建对象，你必须向构造函数传递一个包含路径的字符串\n\
  \n226 第 2 本 编程基础\n\n\n\n\n以及计算机上存在的一个文件名。如果找不到该文件，`FileInputStream` 将抛出一个 `FileNotFoundException`，你必须捕获它或抛出它。该类位于\
  \ `java.io` 包，因此任何使用它的程序都必须包含 `import java.io` 语句。\n\n考虑以下程序：\n\n```java\nimport\
  \ java.io.*;\n\npublic class FileException1\n{\n    public static void main(String[]\
  \ args)\n    {\n        openFile(\"C:\\test.txt\");\n    }\n\n    public static\
  \ void openFile(String name)\n    {\n        FileInputStream f = new FileInputStream(name);\n\
  \    }\n}\n```\n\n这个程序无法编译。编译器发出以下错误信息：\n\n`unreported exception java.io.FileNotFoundException;\
  \ must be caught or declared to be thrown`\n\n这条信息意味着你必须处理 `FileNotFoundException`。\n\
  \n### 捕获 FileNotFoundException\n\n#### 处理异常\n\n处理 `FileNotFoundException` 的一种方法是通过普通的\
  \ try 语句捕获它：\n\n```java\nimport java.io.*;\n\npublic class FileException2\n{\n \
  \   public static void main(String[] args)\n    {\n        openFile(\"C:\\test.txt\"\
  );\n    }\n\n    public static void openFile(String name)\n    {\n        try\n\
  \        {\n            FileInputStream f = new FileInputStream(name);\n       \
  \ }\n        catch (FileNotFoundException e)\n        {\n            System.out.println(\"\
  File not found.\");\n        }\n    }\n}\n```\n\n在这个示例中，如果 `C:\\test.txt` 文件不存在，则会显示消息“File\
  \ not found.”。\n\n### 抛出 FileNotFoundException\n\n假设你不想在 `openFile` 方法中处理这种错误情况，而是倾向于将异常传递给调用\
  \ `openFile` 的方法。\n\n要做到这一点，你省略 `try` 语句。相反，你在 `openFile` 方法的声明中添加 `throws` 子句。该子句表示\
  \ `openFile` 方法知道它包含一个可能抛出 `FileNotFoundException` 的语句，但不想在此处理该异常。相反，异常将被传递给调用者。\n\
  \n下面是添加了 `throws` 子句的 `openFile` 方法：\n\n```java\npublic static void openFile(String\
  \ name)\nthrows FileNotFoundException\n{\n    FileInputStream f = new FileInputStream(name);\n\
  }\n```\n\n如你所见，`throws` 子句只是列出方法可能抛出的异常或多个异常。如果列表中多个异常，请用逗号分隔异常：\n\n```java\npublic\
  \ static void readFile(String name)\nthrows FileNotFoundException, IOException\n\
  ```\n\n在 `openFile` 方法中添加 `throws` 子句意味着当发生 `FileNotFoundException` 时，它将简单地传递给调用\
  \ `openFile` 的方法。这意味着调用方法（在例例中为 `main`）必须捕获或抛出该异常。为了捕获异常，`main` 方法的代码应编写如下：\n\n\
  ```java\npublic static void main(String[] args)\n{\n    try\n    {\n        openFile(\"\
  C:\\test.txt\");\n    }\n    catch (FileNotFoundException e)\n    {\n        System.out.println(\"\
  File not found.\");\n    }\n}\n```\n\n然后，如果文件不存在，`catch` 块会捕获异常，并显示错误信息。\n\n###\
  \ 从 main 方法抛出异常\n\n如果你不想让程序处理 `FileNotFoundException` 异常，你可以在 `main` 方法中添加 `throws`\
  \ 子句，如下所示：\n\n```java\npublic static void main(String[] args)\nthrows FileNotFoundException\n\
  {\n    openFile(\"C:\\test.txt\");\n}\n```\n\n那么，如果发生异常，程序将带有异常消息和堆栈轨迹异常终止。\n\n\
  #### 处理异常\n\n### 吞没异常 (Swallowing exceptions)\n\n如果发生了检查异常，你不想什么都不做怎么办？换句话说，你想简单地忽略异常。你可以通过在\
  \ `try` 语句的 `catch` 块中捕获异常但保持 `catch` 块体为空。这是一个示例：\n\n```java\npublic static void\
  \ openFile(String name)\n{\n    try\n    {\n        FileInputStream f = new FileInputStream(name);\n\
  \    }\n    catch (FileNotFoundException e)\n    {\n    }\n}\n```\n\n在这里，`FileNotFoundException`\
  \ 被捕获并忽略了。这种技术被称为*吞没异常 (swallowing the exception)*。\n\n吞没异常被认为是不良的实践。在编写复杂的程序时，简单地吞没你明知应该处理的异常是有诱惑力的。因为你计划在解决程序的基本功能后回来处理该异常，稍微吞没一下异常似乎并不是一个那么坏的主意。问题在于，你不可避免地永远不会回到异常处理程序，所以你的程序在带有吞没的异常的情况下匆忙投入生产。\n\
  \n如果你必须吞没异常，至少向控制台写一条消息，表示发生了异常。这样，你就有一个不断的提醒，程序还有一些你必须处理的未完成细节。\n\n注意，并不是所有的吞异常都是坏的。假设你希望\
  \ `openFile` 方法返回一个布尔值来指示文件是否存在，而不是抛出异常。你可以这样编写该方法：\n\n```java\npublic static boolean\
  \ openFile(String name)\n{\n    boolean fileOpened = false;\n    try\n    {\n  \
  \      FileInputStream f = new FileInputStream(name);\n        fileOpened = true;\n\
  \    }\n    catch (FileNotFoundException e)\n    {\n    }\n    return fileOpened;\n\
  }\n```\n\n在这里，异常没有被吞没。相反，它被转换为从方法返回的 own。\n\n### 抛出自定义异常\n\n虽然这种方法并不常见，但你可能想编写抛出自己的异常的方法。要这样做，你使用\
  \ `throw` 语句。`throw` 语句具有以下基本格式：\n\n`throw new exception-class()`\n\n`exception-class`\
  \ 可以是 `Exception` 或派自 `Exception` 的类。现在，我只关注编写抛出通用 `Exception` 的方法。这里有一个程序演示了抛出异常的基本结构：\n\
  \n```java\npublic class MyException\n{\n    public static void main(String[] args)\n\
  \    {\n        try\n        {\n            doSomething(true);\n        }\n    \
  \    catch (Exception e)\n        {\n            System.out.println(\"Exception!\"\
  );\n        }\n    }\n\n    public static void doSomething(boolean t)\n    throws\
  \ Exception\n    {\n        if (t)\n            throw new Exception();\n    }\n\
  }\n```\n\n在这里，`doSomething` 方法接受一个布尔值作为参数。如果值为真，它会抛出一个异常；否则什么都不做。从这个平凡的示例中可以得出以下要点：\n\
  \n- 你通过执行 `throw` 语句来抛出异常。`throw` 语句指定要抛出的异常对象。\n- 如果方法包含 `throw` 语句，它必须在声明中包含 `throws`\
  \ 子句。\n- 调用抛出异常方法的方法必须捕获或抛出该异常。\n\n### 捕获多个异常\n\nJava 7 中的新功能允许你用单个 `catch` 语句捕获两个或多个异常类型。假设你的代码可能会抛两个不同的异常——例如\
  \ `FileNotFoundException` 和 `IOException`——并且你想以相同的方式处理它们。这样做的一种方法是编写两个 `catch`\
  \ 语句（每个捕获一个），如下：\n\n```java\ntry\n{\n    // 可能会抛出 FileNotFoundException // 或 IOException\n\
  }\ncatch (FileNotFoundException e)\n{\n    System.out.println(e.getMessage());\n\
  }\ncatch (IOException e)\n{\n    System.out.println(e.getMessage());\n}\n```\n\n\
  这种方法可行，但很笨拙。Java 允许你在 `catch` 语句中指定两个或多个异常类型。你用竖线分隔异常类型，如下：\n\n\n\n\n\n\n```java\n\
  // statements that might throw FileNotFoundException // or IOException\ncatch (FileNotFoundException\
  \ | IOException e) {\n    System.out.println(e.getMessage());\n}\n```\n通过这种方式，你只需要一个代码块就可以处理两种异常类型。\n\
  \n# 编程基础\n232 第 2 册\n\n![Image 27](img/index-255_1.jpg)\n\n# 3 面向对象编程\n\n## 目录\n\
  \n- **第一章：理解面向对象编程** . . . . 235\n- **第 2 章：创建你自己的类** . . . . . . 249\n- **第 3 章：使用静态成员**\
  \ . . . . . . . 267\n- **第 4 章：使用子类和继承** . . . . . 277\n- **第 5 章：使用抽象类和接口** . .\
  \ . . . . 299\n- **第 6 章：使用 Object 和 Class 类** . . . . . 315\n- **第 7 章：使用内部类、匿名类和\
  \ Lambda 表达式** . . . 341\n- **第 8 章：使用包和新的 Java 模块系统** . . . . 353\n\n![Image 28](img/index-257_1.jpg)\n\
  \n### 本章内容\n- 了解什么是面向对象编程\n- 理解对象和类\n- 研究继承和接口\n- 使用对象设计程序\n- 使用 UML 画图\n\n## 第一章：理解面向对象编程\n\
  \n本章是对面向对象编程的入门介绍。它介绍了你在掌握 `Java` 中面向对象编程运作的具体细节时，需要了解的一些基本概念和术语。\n\n如果你是一个更倾向于实践型的人，可能想跳过这一章，直接看第\
  \ 3 册第 2 章，在那里你将了解到如何在 Java 中创建你自己的类。你随时可以回来查看这一章，回顾驱动面向对象编程的基本概念。哪种方式对我来说。无论你是现在读这一章，还是跳过它以后回来，我的薪水都是那样的。\n\
  \n### 什么是面向对象编程？\n\n*面向对象编程*这个术语意味着许多不同的含义。但其核心在于，面向对象编程是一种计算机编程，其前提是：所有程序本质上都是现实世界对象或抽象概念的计算机模拟。例如：\n\
  \n- **飞行模拟程序**试图模仿真实飞机的行为。有些程序做得惊人的好；军事和商业飞行员就在它们上进行训练。在 20 世纪 60 年代，阿波罗宇航员使用计算机控制的模拟器为月球登陆进行练习。\n\
  - **许多电脑游戏**是人类玩的实际游戏的模拟，例如棒球、NASCAR 赛和象棋。但即使是像《吃鼠》和《最终幻想 4》这样的抽象游戏，也试图模拟*可能*存在某处的生物和对象的行为。这些程序模拟了一个概念性游戏——一种在现实世界的任何地方都无法实际，但*可以*被计算机模拟的游戏。\n\
  - **业务程序**可以被视为业务流程的模拟——例如接单、客户服务、发货和计费。例如，一张发票不仅仅是一张纸；它代表了公司与其其中一个客户之间发生的一笔交易。因此，计算机生成的发票实际上只是那次交易的模拟。\n\
  \n编程语言具有此类前提的想法并不新。传统的编程语言如 `C`（以及它的前身，甚至包括 `COBOL`）是基于这样一个前提的：计算机程序是实际过程的计算机化实现——电子版的“步骤\
  \ 1：将 A 卡片插入 B 槽”。`LISP` 编程语言基于一种观点：所有的编程问题都可以看作操作列表的不同方式。而广受欢迎的数据库操作语言 `SQL` 则将编程问题视为操作数学集合的方法。\n\
  \n关于计算机程序是现实世界对象或抽象概念模拟的观点，这里还有一些额外的想法：\n\n- 有时模拟比真实的东西还要好。文字处理程序最初是打字机的模拟，但现代的文字处理程序远优于任何打字机。\n\
  - 所有计算机程序都是某种模拟的想法并不新奇。事实上，第一种面向对象编程语言（`Simula`）开发于 20 世纪 60 年代。到 1967 年，这种语言已经具有许多我们现在认为面向对象编程基础的特性：类、对象和虚方法。\n\
  - 仔细想想，手动记录系统也是模拟。一个装满发票的文件柜并不持有实际订单；它持有的是那些订单的*表示*。236 第 3 册 面向对象编程\n\n### 理解对象\n\
  \n这些关于模拟的讨论让我觉得有点哲学化了，所以现在转向构成程序的对象的本质。接下来的章节描述了一些最重要的特征：标识性、状态和行为。\n\n#### 对象具有标识性\n\
  面向对象程序中的每个对象都具有一个*标识性*。换句话说，特定类型的每一次出现——称为*实例*——都可以与相同类型的其他每一次出现区分开来。在现实世界中，对象标识性是一个相当直观且显而易见的概念。拿起两个苹果，你就知道虽然它们都是苹果（这是对象类型，在下一节描述），但你知道它们不是同一个苹果。每个苹果都有独特的标识性。打开一个装满发票的文件柜，你会发现一页接一页的看起来几乎一模一样的纸，但每张纸的顶部附近都印有一个发票号码。这个号码并不是真正赋予这些发票唯一标识身份的因素，但它为你提供了一个易于识别每份单独发票的方法。\n\
  \n在面向对象编程中，每个对象在计算机内存中都有自己的位置。因此，两个对象即使属于相同类型，也有它们各自不同的内存位置。对象起始位置的地址提供了区分不同对象的方法，因为没有两个对象可以占据相同的内存。\n\
  \n关于 Java 中的对象标识性，这里其他重要的想法：\n\n- Java 将每个对象的标识性基本保密。换句话说，没有简单的方法获取对象的内存地址；Java\
  \ 认为这与你无关，而且也确实如此。如果 Java 将这些信息轻易地提供给你，你就会受到诱惑去碰它，这可能会引起各种问题，正如任何 `C` 或 `C++` 程序员所说的那样。Java\
  \ 对象拥有某些被称为*哈希码*的东西，这是一个 `int` 值。\n\n\n\n\n它是为每个对象自动生成的，并且几乎代表了对象的标识。在大多数情况下，对象的哈希值（hash\
  \ code）基于对象的内存地址，但并不总是如此。Java 不保证两个不同的对象不会具有相同的哈希值。\n\n» 当与对象一起使用，相等运算符 `(==)` 实际上是在测试两个变量或表达式的对象标识（object-identity）。如果它们指向同一个对象实例，则这两个变量或表达式被认为是相等的。\n\
  \n### 对象具有类型\n\n我记得在大学读英语专业时，读过亨利·里德（Henry Reed）在 1942 年写的一首美诗《部件的命名》（Naming of\
  \ Parts）：\n\n今天我们有部件命名。昨天，\n我们有大扫除。而明天早上，\n我们要去做射击之后的事。但今天，\n今天我们有部件命名。映球花\n在所有相邻的花园里像珊瑚一样闪发光，\n\
  而今天我们有部件命名。\n\n诚然，这是一首优秀的反战诗之类的，但它对面向对象编程也有一点点启发意义。在第一节之后，诗歌继续命名步枪的各个部分：\n\n这是下背带环。而这\n\
  是上背带环，你将会看到它的用途，\n当你被发了背带时。这个是插销环，\n在你们的情况下，你们还没有这个。\n\n想象一整个房间的新兵正在拆解他们的步枪，而士练官告诉他们：“这是下背带环。而这是上背带环……”\
  \ 每个士兵的步枪都有其中一个这些部分 —— 用面向对象的术语来说，这就是一个特定类型的对象。士兵步枪上的下背带环是不同的对象，但它们都属于 `LowerSlingSwivel`\
  \ 类型。\n\n就像这首诗中的士练官一样，面向对象编程允许你为程序中不同类型的对象命名。在 Java 中，类型是由类定义的。因此，当你从一个类型创建一个对象时，你是在说该对象是该类指定的类型。接下来的示例语句创建了一个类型为\
  \ `Invoice` 的对象：\n\n```\nInvoice i = new Invoice();\n```\n\n在这种情况下，该对象的标识（即它在内存中的地址）被赋值给变量\
  \ `i`，编译器知道该变量可以持有指向 `Invoice` 类型对象的引用。\n\n### 对象具有状态\n\n现在切换到另一位文学天才：\n\n一条鱼，两条鱼，\n\
  红鱼，蓝鱼\n\n在面向对象的术语中，苏斯博士在这里列举了一对类型为 `Fish` 的对象。`Fish` 类型显然有两个属性；我们称它们为 `Number` 和\
  \ `Color`。这两个对象在这些属性上具有不同的值：\n\n| 属性 | 对象 1 | 对象 2 |\n| :--- | :--- | :--- |\n|\
  \ Number | One | Two |\n| Color | Red | Blue |\n\n对象的类型决定了对象拥有哪些属性。因此，所有特定类型的对象都具有相同的属性。然而，它们在这些属性上的值并不一定相同。在这个例中中，所有的\
  \ `Fish` 都具有名为 `Number` 和 `Color` 的属性，但两个 `Fish` 对象在这些属性上的值不同。\n\n一个对象的所有属性值的组合被称为对象的*状态*（state）。与它的标识不同，对象的状态在其生命周期内可以——而且通常会发生改变。例如，某些鱼可以改变颜色。特定客户的总销售额在客户每次购买另一个产品时改变。学生的平均分在每次记录新的课程成绩时改变。如果员工搬家，员工的地址和电话号码就会改变。\n\
  \n关于对象状态，这里还有一些有趣的细节：\n\n» 对象的某些属性是公开的，但另一些可以是私有的。私有属性可能对对象的内部运行至关重要，但对象外部没人知道它们的存在。它们就像你的私密想法：它们影响着你的言行，但除了你，没人知道。\n\
  \n» 在 Java 中，对象的状态由类变量表示，这些变量被称为*字段*（fields）。*公共字段*（public field）是用 `public` 关键字声明的字段，以便该变量对外部世界可见。\n\
  \n### 对象具有行为\n\n对象的另一个特征是它们具有*行为*（behavior），这意味着它们可以做事情。和状态一样，对象的特定行为取决于它的类型。但与状态不同，类型的每个实例的行为是相同的。假设教室里所有的学生都有相同类型的计算器。让他们都拿出计算器并加两个数字\
  \ —— 他们任意选择的两个数字。所有的计算器显示不同的数字，但它们都以相同的方式相加——也就是说，它们有不同的状态但相同的行为。\n\n说对象具有行为的另一种说法是它们提供了可以被其他对象使用的服务。你已经见过许多为其他对象提供服务的对象示例。例如，从\
  \ `NumberFormat` 类创建的对象提供了格式化服务，将数值转换为格式化良好的字符串，如 `$32.95`。\n\n在 Java 中，对象的行为由它的方法提供。因此，`NumberFormat`\
  \ 类的 `format` 方法为 `NumberFormat` 对象提供了格式化行为。\n\n关于对象行为，这里还有其他值得注意的点：\n\n» 类的*接口*（interface）是该类公开的方法和字段集合，以便其他对象可以访问它们。\n\
  \n» 对象具体如何执行功能可以隐藏在对象内部。使用对象的人只需要知道它能做什么，而不需要知道它是如何工作的。如果你以后发现了让对象工作的更好方法，你可以在不被任何人发现的情况下更换新版本。\n\
  \n### 理解对象的生命周期\n\n在 Java 中处理对象时，理解对象如何出生、生存和死亡是非常重要的。这个主题被称为对象的生命周期，它的过程如下：\n\n\
  1. 在从类创建对象之前，该类必须被*加载*。为了这一点，Java 在磁盘上定位该类（在 `.class` 文件中）并将其读入内存。然后 Java 会寻找任何*静态初始化*（static\
  \ initializers）来初始化静态字段 —— 这些字段不属于类的任何实例，而是属于类本身，并由从该类创建的所有共享。当你第一次从类创建对象或第一次访问类的静态字段或方法时，类会被加载。例如，当你运行类的\
  \ `main` 方法时，类就会被初始化。\n\n2. 当你使用 `new` 关键字时，从类创建一个对象。为了初始化类，Java 为对象分配内存并设置指向对象的引用，以便\
  \ Java 运行时可以跟踪它。然后 Java 调用类的*构造方法*（constructor），它像方法，但只在创建对象时调用一次。构造方法负责执行初始化对象所需的任何处理\
  \ —— 初始化变量、打开文件或数据库等。\n\n3. 对象度过它的生命，为任何想要和需要的人提供公共方法和字段。\n\n4. 当对象死去时，对象从内存中移除，Java\
  \ 丢弃对它的内部引用。你不需要自己销毁对象。Java 运行时一个名为*垃圾回收器*（garbage collector）的特殊部分会在对象不再使用时销毁所有对象。\n\
  \n\n\n\n到目前为止，你在书中看到的大多数类所创建的对象都是独立的，每个对象都像是一个自足的小岛屿。然而，面向对象编程的真正威力在于它能够创建描述密切相关对象的类。\n\
  \n例如，棒球（Baseballs）和垒垒球（softballs）非常相似。它们都是特定类型的球。每种球都有直径和重量；两种球都可以被投掷、接住或击中。然而，棒球和垒垒球具有不同的特征，导致它们在投掷、接住或击中时表现不同。\n\
  \n如果你正在编写一个模拟棒球和垒垒球工作方式的程序，你需要一种方法来表示这两种球。一种方案是创建独立的类来表示每种类型的球。这些类非常相似，所以你可以直接从一个类中复制大部分代码到另一个类中。\n\
  \n另一种方案是使用单个类来表示这两种球。这时，你向构造函数传递一个参数，以指示该类的实例是像棒球还是垒垒球。\n\nJava 有两个面向对象编程特性特性专门用于处理此类关联的类：继承（inheritance）和接口（interfaces）。我将在后面的章节中简要描述这些特性。\n\
  \n### 继承\n\n`Inheritance` 是一种面向对象编程技术，让你使用一个类作为另一个类的基础。现有的类被称为 `base class`基类、`superclass`超类或\
  \ `parent class`父类；而派生自它的新类被称为 `derived class`派生类、`subclass`子类或 `child class`子类类。\n\
  \n当你创建一个子类时，子类会自动获得其父类定义的所有方法和字段。你可以直接使用这些方法和字段，也可以重写（override）它们以改变它们的行为。此外，你还可以添加定义子类特有数据和行为的方法和字段。\n\
  \n你可以利用继承解决上一节中的棒球/垒垒球问题：创建一个名为 `Ball` 的类提供所有类型球的基本特征，然后将其作为名为 `BaseBall` 和 `SoftBall`\
  \ 的独立类的基类。然后，这些类可以重写对于每种球需要不同行为的方法。\n\n理解继承的一种方式是将其视为实现“是一种……的关系”（is-a-type-of relationships）的方法。垒垒球是球的一种类型，棒球也是。因此，继承是实现这些相关类的合适方法。（有关继承的更多信息，请参见第\
  \ 3 本第 4 章。）\n\n# 接口\n\n`interface` 是一组方法和字段，类必须提供这些内容来 `implement` 实现该接口。接口本身仅仅一组赋予了名的公共方法和字段声明。注意，接口本身不提供实现这些方法的代码。相反，它只提供声明。然后，实现（implements）该接口的类将为接口定义的每个方法提供代码。\n\
  \n你可以使用接口来解决棒球/垒垒球问题：创建一个名为 `Ball` 的接口，指定球应该拥的所有方法和字段。然后，你可以创建 `SoftBall` 和 `BaseBall`\
  \ 类，让它们都实现 `Ball` 接口。接口与继承紧密相关，但有两个关键区别：\n\n- 接口本身不提供实现其任何方法的代码。接口仅仅是一组方法和字段签名（signatures）。相比之下，基类可以提供其部分或所有方法的实现。\n\
  - 一个类只能有一个基类，但一个类可以实现任意数量的接口。\n\n你可以在第 3 本第 5 章中找到更多关于接口的信息。\n\n# 使用对象设计程序\n\n一个面向对象的程序通常不是单一对象。相反，它是一组共同工作以完成任务的对象。开发面向对象程序最重要的部分是设计用于创建程序对象的类。基本思想是将一个大问题拆分为一组类，每个类在规模和复杂度上都是可控的。然后，你编写实现这些类的\
  \ Java 代码。\n\n因此，设计面向对象应用程序的任务归结为决定应用程序需要哪些类——以及这些每个类的公共接口（public interface）应该是怎样的。如果你良好地规划了类，实现应用程序就会很容易。如果你规划类得很糟糕，让你的应用程序运行起来将很困难。\n\
  \n设计面向对象应用程序的一种常用方法是将应用程序分为几个不同的 `layers`（层）或 `tiers`（层），这些层提供不同类型的功能。最常见的是三层方法，如图\
  \ 1-1 所示。在这里，应用程序的对象被分为三个基本层：\n\n- **表现层（Presentation）：** 这一层的对象处理与用户的所有直接交互。网络应用程序中的\
  \ HTML 页面位于这一层，基于 GUI 的应用程序中的 Swing 页面类和框架类也是如此。（我在第 6 本中介绍了 Swing。）\n- **逻辑层（Logic）：**\
  \ 这一层的对象代表应用程序的核心对象。对于典型的业务型应用程序，这一层包含了代表业务实体的对象，如客户、产品、订单、供应商等。这一层有时被称为 `business\
  \ rules layer`（业务规则层），因为这一层中的对象负责执行管理应用程序的规则。\n- **数据库层（Database）：** 这一层的对象处理与应用程序所使用的任何数据存储形式交互的所有细节。例如，如果数据存储在\
  \ SQL 数据库中，这一层的对象将处理所有的 SQL。\n\n# 使用 UML 绘制类\n\n从计算机编程之初，程序员就喜欢为程序创建图表。最初，他们绘制流程图，以图形化的方式表示程序的过程逻辑。流程图擅长绘制过程，但它们太详细了。\n\
  \n当 20 世纪 70 年代结构化编程风靡一时，程序员开始考虑程序的整体结构时，他们从流程图切换到 `structure charts`（结构图），用于说明程序模块之间的组织关系。\n\
  \n现在面向对象编程成为主流，程序员绘制 `class diagrams`（类图）来说明组成应用程序的类之间的关系。图 1-2 显示了一个具有四个类的简单系统的类图。矩形表示类本身，箭头表示类之间的关系。\n\
  \n\n\n\n类图中的基本元素是类。在 UML 中，每个类都被画成一个矩形。至少，矩形必须包含类名。你可以将矩形分为两个或三个区域，这些区域可以包含关于类的额外信息，如图\
  \ 1-3 所示。\n\n**图 1-3：**\n类。\n\n类的中间区域列出类变量，而底部区域列出类方法。每个变量或方法的名称之前可以跟一个 `可见性指示符`，它可以可以是表\
  \ 1-1 中列出的符号之一。（在实际操作中，通常会省略可见性指示符，仅列出具有公共可见性的字段或方法。）\n\n### 表 1-1：类变量和方法的可见性指示符\n\
  \n| 指示符 | 说明 |\n| :--- | :--- |\n| `+` | 公共 (Public) |\n| `-` | 私有 (Private) |\n\
  | `#` | 保护 (Protected) |\n\n如果你需要，可以包含变量以及方法和参数的类型信息。变量的类型通过在变量名加上冒号和类型来指示：\n\n\
  `connectionString: String`\n\n方法的返回类型以相同的方式指示：\n\n`getCustomer(): Customer`\n\n\
  参数列在括号内，并列出名称和类型。例如：\n\n`getCustomer(custno: int): Customer`\n\n***注意：*** 在 UML\
  \ 图中省略类型和参数信息是常见的。\n\n接口的绘制方式与类非常相同，但类名之前会有 `interface` 单词：\n\n`<<interface>>`\n\
  ProductDB\n\n***注意：*** 单词 `interface` 被包含在一组双左箭头和双右箭头之间。这些箭头并不仅仅是连续输入的两个小于号或大于号；它们是符号的特殊组合。坦率地说，双箭头符号是\
  \ ASCII 字符集的标准部分。你可以在 Microsoft Word 中通过“插入符号”命令来访问它。\n\n### 绘制箭头\n\n除了使用矩形表示类之外，类图还包含箭头来表示类之间的关系。UML\
  \ 使用多种类型的箭头，正如我在后续段落中描述的。\n\n![Image 29](img/index-269_1.png)\n![Image 30](img/index-269_2.png)\n\
  ![Image 31](img/index-269_3.png)\n\n一端带有空心闭合箭头的实线表示继承：\n箭头指向基类。一端带有空心闭合箭头的虚线表示一个类实现了一个接口：\n\
  箭头指向接口。一端带有开启箭头的实线表示 `关联` (association)：\n\n关联简单地表示两个类一起工作。可能是其中一个类创建了另一个类的对象，或者其中一个类需要另一个类的对象来执行其工作。又或者，一个类的实例包含了另一个类的实例。\n\
  \n你可以为关联箭头添加一个名称以指示其用途。如果关联箭头表示一个类的实例创建了另一个类中的对象，你可以在箭头旁边放置 `Creates`（创建）单词。\n\n\
  ### 本章内容\n* 创建你自己的类\n* 查看类的各个部分\n* **声明** (declaration)\n* 了解类字段\n* 构建构造函数\n* 在你的类中添加方法\n\
  * 使用 `this` 关键字\n\n# 第 2 章：创建你自己的类\n\n好了，同学们，是时候学习如何创建你自己的类了。在本章中，你将发现在 Java 中创建类的基础知识。所有的\
  \ Java 程序都是类，所以你已经见过很多类的例子了。你已经见过类头，例如 `public class GuessingGame` 以及静态方法，例如 `public\
  \ static void main`。现在，在本章中，我将向你展示如何创建包含多个程序的。\n\n### 声明类\n\n所有类都必须由 `class declaration`（类声明）定义——即提供类名和类体的代码行。这里是类声明最基本的形式：\n\
  \n```\n[public] class ClassName { class-body\n```\n\n`public` 关键字表示此类可供其他类使用。虽然它是可选的，但你通常会在类声明中包含它。毕竟，你写类声明的主要目的是为了让其他类能够从你所定义的类中创建对象。（在本章稍后的“查看类去向何方”章节中了解更多关于使用\
  \ `public` 关键字的知识。）\n\n在本书的后续章节中，你将了解到一些可以放在类声明中的额外元素。我在这里描述的格式只是用于创建基本类的基础格式。\n\
  \n### 选取类名\n\n`ClassName` 是一个为你的类提供名称的标识符。你可以使用任何想要的标识符来为类命名，但遵循以下三条指南可以简化你的生活：\n\
  \n* **类名以大写字母开头。** 如果类名由多个单词组成，请每个单词的首字母都大写：例如 `Ball`、`RetailCustomer` 和 `GuessingGame`。\n\
  * **尽可能使用名词作为你的类名。** 类创建对象，而名词是你用来标识对象的单词。因此，大多数类名应该是名词。\n* **避免使用 API 类的名称。** 没有规则规定你绝对必须这样做，但如果你创建的类与\
  \ API 类同名，你就必须使用完全限定名（例如 `java.util.Scanner`）来将你的类与 API 类区分开来。\n\n有成千上万个 API 类，所以完全避开它们是非常困难的。但至少，你应该避免使用常用的类名，以及你的应用程序可能使用的任何\
  \ API 类。例如，创建一个名为 `String` 或 `Math` 的类纯粹是自找麻烦。\n\n### 了解类体中的内容\n\n类的 `class body`（类体）是类声明结尾大括号内的所有内容。类声明的\
  \ `public class ClassName` 部分只需要一行，但类体可能需要几百行（如果你写得太尽兴的话）。\n\n类体可以包含以下元素：\n\n* **字段\
  \ (Fields)**：变量声明定义了类的公共或私有字段。\n* **方法 (Methods)**：方法声明定义了类的方法。\n* **构造函数 (Constructors)**：构造函数是一个类似于方法的代码块，但在创建实例时用于初始化对象。构造函数的名称与类名相同，尽管它看起来像方法，但它没有返回类型。\n\
  * **初始化器 (Initializers)**：这些独立的代码块仅在类初始化时运行一次。实际上它们有两种类型，称为 `静态初始化器` 和 `实例化初始化器`。虽然你不会经常使用它们，我将在章稍后的“使用初始化器”章节中会提到实例化器。（有关静态初始化器的信息，请参阅第\
  \ 3 本第 3 章。）\n* **其他类和接口**：一个类可以包含另一个类，这种类类被称为 `内部类` 或 `嵌套类`。类也可以包含接口。（有关内部类的更多信息，请参阅第\
  \ 3 本第 7 章。有关接口的信息，请参阅第 3 本第 5 章。）\n\n\n\n\n我通常在类的开头将所有字段写在一起，之后是构造函数，然后是方法。如果类包含初始化器，我会将它们放置在它们初始化的字段附近。如果类包含内部类，我通常会将它们放在使用这些内部类的方法之后。有些程序员喜欢将字段放在类的末尾而不是开头。只要能带给你快乐，对我来说都可以。\n\
  \n一个类中包含的字段、方法、类和接口被称为类的 `members`（成员）。构造函数和初始化器不被视为成员，原因由于技术性太强，目前不便解释。（你可以在第 3\
  \ 本第 3 章中找到解释。）\n\n## 了解类的位置\n\n公共类（public class）必须写在一个与类名相同的源文件中，扩展名为 `java`。例如，一个名为\
  \ `Greeter` 的公共类必须存放在名为 `Greeter.java` 的文件中。\n\n因此，你不能在同一个放置两个公共类。以下源文件（命名为 `DiceGame.java`）将无法编译：\n\
  \n```java\npublic class DiceGame\n{\n    public static void main(String[] args)\n\
  \    {\n        Dice d = new Dice();\n        d.roll();\n    }\n}\n\npublic class\
  \ Dice\n{\n    public void roll()\n    {\n        // code that rolls the dice goes\
  \ here\n    }\n}\n```\n\n编译器会抛出一个消息，指示 `Dice` 是一个公共类，必须在名为 `Dice.java` 的文件中声明。\n\
  \n这个问题有两个解决方案。第一个方案是移除 `Dice` 类中的 `public` 关键字：\n\n```java\npublic class DiceGame\n\
  {\n    public static void main(String[] args)\n    {\n        Dice d = new Dice();\n\
  \        d.roll();\n    }\n}\n\nclass Dice\n{\n    public void roll()\n    {\n \
  \       // code that rolls the dice goes here\n    }\n}\n```\n\n编译器乐意地接受了这个程序。\n\
  \n`inner class`（内部类）是定义在另一个类体内的类，并且仅从该类内部可用。（更多关于内部类的信息，请参见第 3 本第 7 章。）\n\n当你在单个源文件中编写多个类时，Java\
  \ 仍然会为每个类创建一个单独类文件。因此，当你编译 `DiceGame.java` 文件时，Java 编译器会创建两个类文件：`DiceGame.class`\
  \ 和 `Dice.class`。\n\n对于较小的程序，移除类中的 `public` 关键字是可以接受的，但其局限性是 `Dice` 类仅对定义在 `DiceGame.java`\
  \ 文件中的类可用。如果你希望 `Dice` 类更广泛可用，请选择第二个方案：将其带有 `public` 关键字放置在名为 `Dice.java` 的独立文件中。\n\
  \n如果你打算创建一个包含多个公共类的应用程序，请为该创建一个创建一个单独文件夹。然后将应用程序的所有类文件保存到此文件夹中。如果你将类文件保存在同一个文件夹中，Java\
  \ 编译器就能找到它们。如果你将它们放在不同的文件夹中，你可能需要调整 `ClassPath` 环境变量来帮助编译器找到这些类。\n\n## 操作成员\n\n\
  类的 `members` 是定义在类体中的字段和方法。（从技术上讲，定义在类中的类和接口也是成员。不过，我在在本章中不讨论它们，所以你现在可以忽略它们。）下面的章节描述了在类中使用字段和方法的基础知识。\n\
  \n### 理解字段\n\n`field`（字段）是定义在类体中、任何类方法之外的变量。字段（也称为 `class variables`）对类的所有方法可用。此外，如果字段指定了\
  \ `public` 关键字，则该字段在类外可见。如果你不希望字段在类外可见，请改用 `private` 关键字。\n\n字段的定义与任何其他 Java 变量相同，但它可以有一个修饰符，用于指定字段是公有的还是私有的。以下是一些公共字段声明的示例：\n\
  \n```java\npublic int trajectory = 0;\npublic String name;\npublic Player player;\n\
  ```\n\n要创建一个私有字段，请用 `private` 代替 `public`：\n\n```java\nprivate int x_position =\
  \ 0;\nprivate int y_position = 0;\nprivate String error-message = \"\";\n```\n\n\
  字段也可以声明为 `final`：\n\n```java\npublic final int MAX_SCORE = 1000;\n```\n\n`final`\
  \ 字段的值在初始化后无法更改。**注意：** 使用全大写字母命名 final 字段是惯例（但不是要求的）。\n\n### 理解方法\n\n你通过我在第 2 本第\
  \ 7 章中描述的相同技术为类定义方法。要声明一个对类用户可用的方法，在方法声明中添加 `public` 关键字：\n\n```java\npublic boolean\
  \ isActive()\n{\n    return this.isActive;\n}\n```\n\n要创建一个可以在类内部但在类外外可见的私有方法，请使用\
  \ `private` 关键字：\n\n```java\nprivate void calculateLunarTrajectory()\n{\n    //\
  \ code to get the calculated lunar trajectory\n}\n```\n\n### 理解可见性\n\n在前面的章节中，我提到字段和方法都可以使用\
  \ `public` 或 `private` 关键字来指示字段或方法是否可以从类外访问。这被称为字段或方法的 `visibility`（可见性）。所有具有公共访问权限的成员组合有时被称为类的\
  \ `public interface`（公共接口）。这些成员是其他对象与从你的类创建的对象进行通信的唯一手段。因此，请仔细考虑你的类声明了哪些公共字段和方法。\n\
  \n`expose`（暴露）一词有时指创建公共字段和方法。例如，如果一个类有一个名为 `isActive` 的公共方法，你可以说该类暴露了 `isActive`\
  \ 方法。这仅仅意味着该方法对其他类可用。\n\n你可以在类内部使用私有字段和方法——但不能从其他类使用。私有字段和方法提供了可能对你的类运行至关重要但不应暴露给外部世界的实现细节。私有字段和方法有时被称为\
  \ `internal members`（内部成员），因为它们仅从类内部可用。\n\n## 使用 Getter 和 Setter\n\n面向对象编程的基本目标之一是将类的实现细节隐藏在类内部，同时仔细控制类的哪些方面被暴露给外部世界。作为一个一般规则，你应该避免创建公共字段。相反，你可以将所有字段都设为私有。然后你可以通过向类中添加特殊的\
  \ `accessors`（访问器）方法来选择性地授予对字段所包含数据的访问权限。\n\n访问器有两种类型。`get accessor`（也称为 `getter`）是获取字段值的方法，而\
  \ `set accessor (setter)` 是设置字段值的方法。这些方法通常命名为 `get *FieldName` 和 `set *FieldName`。例如，如果字段名为\
  \ `count`，那么 getter 和 setter 方法分别为 `getCount` 和 `setCount`。\n\n这是一个使用名为 `Health`\
  \ 的私有字段来指示游戏程序中玩家健康值的类：\n\n```java\npublic class Player\n{\n    private int health;\n\
  \n    public int getHealth()\n    {\n        return health;\n    }\n\n    public\
  \ void setHealth(int h)\n    {\n        health = h;\n    }\n}\n```\n\n在这里`health`\
  \ 字段本身被声明为私有，因此无法直接访问。相反，它只能通过 `getHealth` 和 `setHealth` 方法访问。使用访问器而不是简单的公共字段来创建类有几个好处：\n\
  \n- 通过提供 get accessor 但不提供 set accessor，你可以创建一个只读属性。这样其他类就可以检索属性值——但不能更改它。\n\n\n\
  \n\n-   与其将属性值存储在私有字段中，你可以在每次调用访问器方法（get accessor method）时计算它。假设你有一个名为 `Order` 的类，它包含了名为\
  \ `unitPrice` 和 `quantityOrdered` 的字段。该类可能包含一个如下所示的 `getOrderTotal` 方法\n\n```java\n\
  public double getOrderTotal()\n{\n    return unitPrice * quantityOrdered;\n}\n```\n\
  \n在这里，get 访问器不是返回类字段的值，而是计算要返回的值。\n\n-   你可以通过在属性设置访问器（set accessor）中验证数据来保护类免受不良数据的影响，如果向方法传递了无效数据，可以忽略它或抛出异常。假设你有一个名为\
  \ `Health` 的 `int` 属性设置访问器，其值范围从 0 到 100。以下是一个防止 `Health` 属性被设置为错误值的设置访问器：\n\n```java\n\
  public void setHealth(int h)\n{\n    if (h < 0)\n    health = 0;\n    else if (h\
  \ > 100)\n    health = 100;\n    else\n    health = h;\n}\n```\n\n在这里，如果调用 `setHealth`\
  \ 方法时的值小于 0，则 `health` 被设置为 0。同样，如果值大于 100，则 `health` 被设置为 100。关于访问器使用的更多见解，请参阅旁边的侧边栏“访问器模式”。\n\
  \n# 访问器模式\n\n访问器的使用（如本章“使用 Getters 和 Setters”节所述）是 Java 程序员常用设计模式的一个示例。`访问器模式`（`Accessor\
  \ pattern`）的设计目的是为了提供一种一致的方法来设置或检索类字段的值，而无需将字段本身暴露给外部世界。\n\n## 创建你自己的类\n\n大多数 Java\
  \ 程序员很快就会学会面向对象编程的基本准则之一是避免使用公共字段。遗憾的是，他们通常对这一准则的反应是将所有字段设为私有，然后为每个字段提供 get 和 set\
  \ 访问器，无论他们是否需要。因此，他们写了像这样的类：\n\n```java\npublic class MyClass\n{\n    private int\
  \ fieldX;\n    private int fieldY;\n    public int getX() { return x; }\n    public\
  \ void setX(int xValue) { this.x = xValue; }\n    public int getY() { return y;\
  \ }\n    public void setY(int yValue) { this.y = yValue; }\n}\n```\n\n为什么不直接让 `fieldX`\
  \ 和 `fieldY` 成为公共字段并跳过访问器呢？如果你所有的访问器只是设置和返回值，而不进行任何数据验证或其他处理，你大可以跳过它们。将字段设为私有的意义是为了仔细控制对它们的访问。如果你打算对所有字段都使用访问器，你还不如将字段设为公共的。相反，要仔细考虑哪些字段确实应该被外部世界访问——并仅为那些确实需要它的字段提供访问器。\n\
  \n### 方法重载\n\nJava 类可以包含两个或多个同名的方法，前提是这些方法接受不同的参数。这种技术被称为 `重载`（`overloading`），是为你的类构建灵活性的关键之一。通过重载，你可以预见到某人想要调用对象函数的不同方式，并为每种替代方案提供重载方法。\n\
  \n`重载` 这个词是准确的，但有点不幸。通常当你说某物被过载时，会出问题。我曾见过一张载了 3,000 磅木材的大众 Jetta 的照片。（你可以从 Snopes.com，即城市传说参考页网站\
  \ `www.snopes.com/photos/automobiles/lumber.asp` 找到这张照片）。那是普通意义上“过载”的经典例子。幸运的是，你不需要担心\
  \ Java 会因为重载方法的重量而崩溃。\n\n你已经熟悉了几个具有重载方法的类了，尽管你可能没有意识到这一点。例如，`PrintWriter` 类（你通过\
  \ `System.out` 访问它）定义了 10 个版本的 `println` 方法，允许你打印不同类型的数据。以下行显示了这些重载方法的每一个声明：\n\n\
  ```java\nvoid println()\nvoid println(boolean x)\nvoid println(char x)\nvoid println(char[]\
  \ x)\nvoid println(double x)\nvoid println(float x)\nvoid println(int x)\nvoid println(long\
  \ x)\nvoid println(Object x)\nvoid println(String x)\n```\n\n创建重载方法的的基本规则是每个方法必须具有唯一的签名（signature）。方法的\
  \ `签名` 是其名称以及它接受的参数的数量和类型的组合。因此，每个 `println` 方法都具有不同的签名，因为尽管所有方法的名称都相同，但每个方法接受的参数类型不同。\n\
  \n有两点*不是*方法签名的一部分：\n\n-   方法的返回类型：你不能编写两个名称和参数相同但返回类型不同的方法。\n-   参数的名称：方法签名关心的只有参数的类型以及它们出现的顺序。因此，以下两个方法具有相同的签名：\n\
  \n```java\ndouble someMethodOfMine(double x, boolean y)\ndouble someMethodOfMine(double\
  \ param1, boolean param2)\n```\n\n### 创建构造函数\n\n`构造函数`（`constructor`）是在创建对象实例时被调用的代码块。在许多方面，构造函数与方法相似，但存在一些差异：\n\
  \n-   它没有返回类型。\n-   构造函数的名称必须与类相同。\n-   与方法不同，构造函数不被视为类的成员。\n-   它在创建新实例时被调用。事实上，是\
  \ `new` 关键字调用了构造函数。创建对象后，你不能再次调用构造函数。\n\n以下是编写构造函数的基本格式：\n\n```java\npublic ClassName(parameter-list*)\
  \ [throws exception... ]\n{\n    *statements...*\n}\n```\n\n`public` 关键字表示其他类可以访问构造函数。这通常是你想要的，但在下一章中，你会看到为什么可能需要创建一个私有构造函数。`ClassName`\
  \ 必须与包含构造函数的类相同。编写参数列表的方法与编写方法相同。注意，构造函数在遇到无法恢复的情况时可以抛出异常。\n\n### 创建基本构造函数\n\n编写构造函数可能的原因是在创建对象时为类字段提供初始值。假设你有一个名为\
  \ `Actor` 的类，拥有字段 `firstName` 和 `lastName`。你可以为 `Actor` 类创建一个构造函数：\n\n```java\n\
  public Actor(String first, String last)\n{\n    firstName = first;\n    lastName\
  \ = last;\n}\n```\n\n然后通过调用此构造函数创建 `Actor` 类的实例：\n\n```java\nActor a = new Actor(\"\
  Arnold\", \"Schwarzenegger\");\n```\n\n创建了一个 Actor 对象。就像方法一样，构造函数也可以重载。也就是说，你可以为一个类提供多个构造函数，前提是每个构造函数都有唯一的签名。这里是为\
  \ `Actor` 类提供的另一个构造函数：\n\n```java\npublic Actor(String first, String last, boolean\
  \ good)\n{\n    firstName = first;\n    lastName = last;\n    goodActor = good;\n\
  }\n```\n\n这个构造函数允许你创建一个包含演员名称之外其他信息的 `Actor` 对象：\n\n```java\nActor a = new Actor(\"\
  Arnold\", \"Schwarzenegger\", false);\n```\n\n\n\n我是看着《警匪风》（*Dragnet.*）长大的。我仍然听到乔·弗莱迪（Joe\
  \ Friday）告知某些暴者的权利：\n\n“在审讯期间，你有权获得律师。如果你需要律师但付不起，将为你免费指定一名律师。”\n\nJava 构造函数也是如此。每个类都拥有拥有构造函数的权利。如果你不提供构造函数，Java\
  \ 就会免费为你指定一个。这个免费的构造函数被称为 `default constructor`（默认构造函数）。它不接受任何参数，也不执行任何操作，但它确实允许你的类被实例化。\n\
  \n因此，以下两个类是相同的：\n\n```java\npublic class Class1\n{\n    public Class1() { }\n}\n\
  \npublic Class1 { }\n```\n\n在第一个示例中，该类显式声明了一个不接受任何参数且体内存没有任何语句的构造函数。在第二个示例中，Java\
  \ 创建了一个默认构造函数，其工作方式与第一个示例中的构造函数相同。如果你为类声明了任何构造函数，就不会创建默认构造函数。因此，如果你声明了一个接受参数的构造函数，但仍然想要空的构造函数（无参数且无体体），你必须显式地为类声明一个空的构造函数。\n\
  \n一个例子可能会说明这一点。以下代码**无法**编译：\n\n```java\npublic class BadActorApp\n{\n    public\
  \ static void main(String[] args)\n    {\n        Actor a = new Actor(); // error：无法编译\n\
  \    }\n}\n\nclass Actor\n{\n    private String lastName;\n    private String firstName;\n\
  \    private boolean goodActor;\n\n    public Actor(String last, String first)\n\
  \    {\n        lastName = last;\n        firstName = first;\n    }\n\n    public\
  \ Actor(String last, String first, boolean good)\n    {\n        lastName = last;\n\
  \        firstName = first;\n        goodActor = good;\n    }\n}\n```\n\n这个程序无法编译，是因为它没有为\
  \ `Actor` 类显式提供默认构造函数；因为它提供了其他构造函数，所以系统不会自动生成默认构造函数。\n\n#### 调用其他构造函数\n\n构造函数可以使用特殊关键字\
  \ `this` 作为方法调用，来调用同类的另一个构造函数。当你有多个相互构建基础的构造函数时，这种技术非常常用。\n\n考虑这个类：\n\n```java\n\
  public class Actor\n{\n    private String lastName;\n    private String firstName;\n\
  \    private boolean goodActor;\n\n    public Actor(String last, String first)\n\
  \    {\n        lastName = last;\n        firstName = first;\n    }\n\n    public\
  \ Actor(String last, String first, boolean good)\n    {\n        this(last, first);\n\
  \        goodActor = good;\n    }\n}\n```\n\n在这里，第二个构造函数调用第一个构造函数来设置 `lastName`\
  \ 和 `firstName` 字段。然后它设置了 `goodActor` 字段。\n\n在使用 `this` 关键字作为构造函数调用时，有一些限制：\n\n\
  - 你只能在构造函数的第一语句中调用另一个构造函数。因此，以下代码无法编译：\n\n```java\npublic Actor(String last, String\
  \ first, boolean good)\n{\n    goodActor = good;\n    this(last, first); // error：无法编译\n\
  }\n```\n\n如果你尝试编译带有此构造函数的类，你会收到一条消息，说 `call to this must be first statement in constructor`。\n\
  \n- 每个构造函数只能调用另一个一个构造函数，但你可以建立构造函数链。如果一个类有三个构造函数，第一个构造函数可以调用第二个，而第二个反过来调用第三个。\n\n\
  - 你不能创建构造函数相互调用的循环。这里有一个无法编译的类：\n\n```java\nclass CrazyClass\n{\n    private String\
  \ firstString;\n    private String secondString;\n\n    public CrazyClass(String\
  \ first, String second)\n    {\n        this(first);\n        secondString = second;\n\
  \    }\n\n    public CrazyClass(String first)\n    {\n        this(first, \"DEFAULT\"\
  ); // error：无法编译\n    }\n}\n```\n\n第一个构造函数从调用第二个构造函数开始，第二个又调用了第一个。编译器抱怨说这个错误是递归构造函数调用，并礼貌地拒绝编译该类。\n\
  \n如果你没有在构造函数的第一行显式调用构造函数，Java 会插入代码自动调用基类的默认构造函数——即 `this` 类所继承的类。（这个小细节在你开始学习继承之前不会变得太重要，继承将在第\
  \ 3 第 4 章中介绍，所以现在可以方便地忽略它。）\n\n#### 寻找 `this` 关键字的更多用途\n\n正如我在上一节中描述的样，你可以在构造函数中使用\
  \ `this` 关键字来调用当前类的另一个构造函数。你还可以在类构造函数体或方法体中使用 `this` 来引用当前对象——即调用该构造函数或方法的类实例。\n\
  \n`this` 关键字通常用于限定当前对象的实例变量的引用。例如：\n\n```java\npublic Actor(String last, String\
  \ first)\n{\n    this.lastName = last;\n    this.firstName = first;\n}\n```\n\n\
  在这里，`this` 并不是必要的，因为编译器可以判断 `lastName` 和 `firstName` 指的是类变量。然而，假设你使用 `lastName`\
  \ 和 `firstName` 作为构造函数的参数名：\n\n```java\npublic Actor(String lastName, String firstName)\n\
  {\n    this.lastName = lastName;\n    this.firstName = firstName;\n}\n```\n\n在这里，需要\
  \ `this` 关键字来区分名为 `lastName` 和 `firstName` 的参数与实例变量。\n\n你还可以在方法体中使用 `this`。例如：\n\
  \n```java\npublic String getFullName()\n{\n    return this.firstName + \" \" + this.lastName;\n\
  }\n```\n\n由于这个例子没有歧义，`this` 并不真正需要。然而，许多程序员即使在不需要时也喜欢使用，因为这明确了他们引用的是实例变量。\n\n有时你会单独使用\
  \ `this` 关键字作为方法参数。可以使用以下语句将当前对象打印到控制台：\n\n```java\nSystem.out.println(this);\n\
  ```\n\n`println` 方法调用对象的 `toString()` 方法来获取对象的字符串表示并打印。默认情况下，`toString()` 打印创建对象的类以及对象的哈希码。如果你想让\
  \ `println` 方法打印更有意义的内容，请为类提供自己的 `toString()` 方法。\n\n#### 使用初始化器\n\n初始化器（有时称为初始化块）是一个放置在任何方法、构造函数或其他代码块之外的独立代码块。每当创建类的实例时，初始化器都会执行，无论使用哪个构造函数。\n\
  \n初始化块类似于用于初始化变量的变量初始化器。区别在于，在初始化块中，你可以编写多个语句。这里有一个在初始化时从用户那里获取类字段值的类：\n\n```java\n\
  class PrimeClass\n{\n    private Scanner sc = new Scanner(System.in);\n    public\
  \ int x;\n\n    {\n        System.out.print(\"Enter the starting value for x: \"\
  );\n        x = sc.nextInt();\n    }\n}\n```\n\n你几乎可以使用其他编码技术来实现相同的效果，这些技术通常更直接。例如，你可以在构造函数中提示用户输入值，或者可以在字段初始化器中调用方法，如下所示：\n\
  \n```java\nclass PrimeClass\n{\n    private Scanner sc = new Scanner(System.in);\n\
  \    public int x = getX();\n\n    private int getX()\n    {\n        System.out.print(\"\
  Enter the starting value for x: \");\n        return sc.nextInt();\n    }\n}\n```\n\
  \n无论哪种方式，效果都是相同的。关于初始化器还有一些小知识：\n\n\n\n\n\n- 如果一个类包含多个初始化器，这些初始化器将按照它们在程序中出现的顺序执行。\n\
  - 初始化器在任何类构造函数执行之前执行。\n- 一种特殊的初始化器块被称为 `static initializer`（静态初始化器），允许你初始化静态字段。（更多信息，请参见下一章。）\n\
  - 初始化器有时用于匿名类，正如我在第 3 卷第 6 章中描述的那样。\n\n# 第 3 章：使用静态成员\n\n## 本章内容\n- 向类中添加静态字段\n\
  - 创建静态方法\n- 创建可以实例化的类\n- 使用静态初始化器\n\n`static method`（静态方法）是一种与类的实例不关联的方法。（除非你直接跳到了这一章，否则你已经知道了这一点。）相反，该方法属于类本身。因此，你可以在不先创建类实例的情况下调用该方法。在本章中，你将了解到关于创建和使用静态字段及静态方法所需的所有知识。\n\
  \n### 理解静态字段和方法\n\n根据我那本好记的 `Webster’s` 字典，`static` 这个词有多种含义，其中大多数与静止或不变的概念有关。`static\
  \ display`（静态显示）是不移动的。`static electricity`（静电）是不流动的电荷。`static design`（静态设计）是不改变的设计。\n\
  \n然而，在 Java 中，`static` 一词并不意味着不变。例如，你可以创建一个静态字段，并在程序执行时对其赋值。因此，静态字段的值是可以改变的。为了让情况更复杂化，`static`\
  \ 一词也可以意味着干扰，例如无线电中的静音（防止你在收音机上清晰地听音乐）。但在 Java 中，`static` 一词与干扰或信号接收不良无关。\n\n那么\
  \ `static` 在 Java 中什么意思？它被用于描述一种与类的特定实例不关联的特殊字段或方法。相反，静态字段和方法与类本身关联，这意味着你不需要创建实例即可访问静态字段或方法。相反，你通过指定类名（而不是引用对象的变量）来访问静态字段或方法。\n\
  \n静态字段的值在类的所有实例中都是相同的。换句话说，如果一个类有一个名为 `CompanyName` 的静态字段，那么从该类创建的所有对象其 `CompanyName`\
  \ 都具有相同的值。\n\n静态字段和方法有许多共同用途。以下是其中几个：\n- **提供与类实例无关的常量或其他值：** 一个 `Billing` 类可能有一个名为\
  \ `SALES_TAX_RATE` 的常量，提供州销售税率。\n- **统计创建了多少个类实例：** 游戏中使用的 `Ball` 类可能有一个静态字段，用于计算创建了多少实例。\n\
  - **在业务中，跟踪分配给对象的引用：** 一个 `Invoice` 类可能有这样一个静态字段。\n- **提供创建实例的替代方式：** 你可能使用它的一个原因是由于\
  \ `NumberFormat` 类，它拥有静态方法。\n- **提供与对象不关联的实用函数：** Java API 中一个极好的例子是 `Math` 类，它提供了静态方法。\n\
  \n#### 使用静态字段\n\n`static field`（静态字段）是用 `static` 关键字声明的字段。与实例变量一样，静态字段与类本身关联，而不是与任何实例。因此，静态字段的值在类的所有实例中都是相同的。\n\
  \n静态字段在类首次加载时被创建并初始化。另一种初始化静态字段的方法是使用 `static initializer`。这是一个示例：\n\n```java\n\
  private String district = \"Northwest\";\n```\n\n#### 使用静态方法\n\n`static method`（静态方法）是用\
  \ `static` 关键字声明的方法。与静态字段一样，静态方法与类本身关联，而不是与任何实例。因此，在使用静态方法之前，你不需要从类中创建对象。\n\n使用静态方法的基本规则之一是，你不能从静态方法访问非静态方法或字段，因为静态方法没有可用的类实例。\n\
  \n```java\npublic class TestClass {\n    private int x = 5; // an instance field\n\
  \    public static void main(String[] args) {\n        int y = x; // error:无法编译\n\
  \    }\n}\n```\n***注意：*** 然而，你*可以*从实例方法访问静态方法和字段。\n\n## 统计实例\n\n静态变量的一个常见用途是跟踪创建了多少个类实例。为了说明如何做到这一点，请考虑列表\
  \ 3-1 中的程序。该程序包含两个类。`CountTest` 类是一个简单的类，用于跟踪构造函数被调用了多少次。然后 `CountTestApp` 类使用 `for`\
  \ 循环创建该类的 10 个实例，并在创建每个实例后显示已创建的实例数量。\n\n请注意，此应用程序中的实例计数在每次运行运行时都会重置为零。因此，它不会跟踪共创建过多少个\
  \ `CountTest` 类实例——只跟踪在程序*特定执行期间*创建了多少个。\n\n**列表 3-1：**\n\n\n\n\n\n# CountTest \n\
  \n```java\npublic class CountTestApp {\n    public static void main(String[] args)\
  \ {\n        printCount();\n        for (int i = 0; i < 10; i++) {\n           \
  \ // Working with Statics\n            CountTest c1 = new CountTest();\n       \
  \     printCount();\n        }\n    }\n\n    private static void printCount() {\n\
  \        System.out.println(\"There are now \"\n            + CountTest.getInstanceCount()\n\
  \            + \" instances of the CountTest class.\");\n    }\n}\n\nclass CountTest\
  \ {\n    private static int instanceCount = 0;\n\n    public CountTest() {\n   \
  \     instanceCount++;\n    }\n\n    public static int getInstanceCount() {\n  \
  \      return instanceCount;\n    }\n}\n```\n\n## 第 3 章：静态成员 271\n\n接下来的段落描述了该程序的一些亮点：\n\
  \n- →**1** 这一行是 `CountTestApp` 类的开始，该测试了 `CountTest` 类。\n- →**8** 这一行创建了 `CountTest`\
  \ 类的实例。因为这段代码位于 `for` 循环中，所以创建了 10 个实例。\n- →**9** 这一行调用 `printCount` 方法，该方法打印到为止创建的\
  \ `CountTest` 对象数量。\n- →**15** 这一行打印一条消息，指示到为止创建了多少个 `CountTest` 对象。它调用 `CountTest`\
  \ 类的静态方法 `getInstanceCount()` 来获取实例计数。\n- →**21** 这一行是 `CountTest` 类的开始。\n- →**23**\
  \ 静态变量 `instanceCount` 存储实例计数。\n- →**25** 这一行是 `CountTest` 类的构造函数。注意 `instanceCount`\
  \ 变量在构造函数内部被增加。这样，每当创建该类的新实例时，实例计数就会加 1。\n- →**29** 静态方法 `getInstanceCount()` 简单地返回静态字段\
  \ `instanceCount` 的值。\n\n## 单例模式\n\n`singleton`（单例）是一种你可以使用它来只创建一个实例的类。当你尝试创建一个实例时，类会首先检查是否已经存在实例。如果是，则使用已有的实例；如果不是，则创建一个新实例。\n\
  \n你无法通过 Java 构造函数来实现这种效果，因为在构造函数执行时，类实例已经创建好了。（这就是为什么你可以在构造函数内部使用 `this` 关键字。）因此，实现单例类的标准方法是将类的所有构造函数都声明为\
  \ `private`。这样，其他类无法使用这些构造函数。然后你提供一个返回实例的静态方法。该方法要么创建一个新实例，要么返回一个已有的实例。\n\n这是一个单例类的简单示例：\n\
  \n```java\nclass SingletonClass {\n    private static SingletonClass instance;\n\
  \n    private SingletonClass() {\n    }\n\n    public static SingletonClass getInstance()\
  \ {\n        if (instance == null)\n            instance = new SingletonClass();\n\
  \        return instance;\n    }\n}\n```\n\n在这里，`SingletonClass` 包含一个私有实例变量，维持对类实例的引用。声明了一个具有\
  \ `private` 可见性的默认构造函数，以防止在类外部使用构造函数。最后，静态方法 `getInstance()` 在实例变量为 `null` 时调用构造函数来创建一个实例。然后它将实例返回给调用者。\n\
  \n下面是调用两次 `getInstance` 方法并比较结果对象的代码：\n\n```java\nSingletonClass s1 = SingletonClass.getInstance();\n\
  SingletonClass s2 = SingletonClass.getInstance();\nif (s1 == s2)\n    System.out.println(\"\
  The objects are the same\");\nelse\n    System.out.println(\"The objects are not\
  \ the same\");\n```\n\n当运行这段代码时，第一次调用 `getInstance()` 创建了 `SingletonClass` 类的一个新实例。第二次调用\
  \ `getInstance()` 仅仅返回第一次调用时创建的实例的引用。因此，`if` 语句中的比较为真，控制台会打印第一条消息。\n\n## 防止实例化\n\
  \n有时你可能想要创建一个完全无法实例化的类。这种类完全由静态字段和方法组成。Java API 中一个很好的例子是 `Math` 类。它的方法提供了工具类型的函数，这些函数并不与某个特定的对象关联。你可能也需要自己创建类似的类。例如，你可能会创建一个带有静态方法的类来验证输入数据，或者创建一个具有静态方法用于从数据库检索数据的数据库访问类。你不需要创建任何一个这些类的实例。\n\
  \n你可以使用一个简单的技巧来防止任何人实例化类。要创建类实例，你必须至少有一个 `public` 构造函数。如果你在类中没有提供构造函数，Java 会自动插入一个默认构造函数，而它恰好是\
  \ `public` 的。\n\n那么，防止创建类实例只需要提供一个单独的 `private` 构造函数，如下：\n\n```java\npublic class\
  \ Validation {\n    private Validation() {} // 防止实例化\n    // 静态方法和字段在这里\n}\n```\n\
  \n现在，因为构造函数是私有的，该类无法被实例化。顺便提一下，`Math` 类使用了这种技术来防止你创建实例。这里是 `Math` 类中的一段实际代码片段：\n\
  \n```java\npublic final class Math {\n    /**\n    * 不要让此类实例化。\n    */\n    private\
  \ Math() {}\n}\n```\n\n## 使用静态初始化器\n\n在在前一章中，你发现了用于初始化实例变量的*初始化块*（initializer blocks）。初始化块在类的实例被创建时才会执行，所以你不能依靠它们来初始化静态字段。Java\
  \ 提供了一种名为静态初始化器（static initializer）的功能，专门设计用于让你初始化静态字段。静态初始化器的通用形式如下：\n\n```java\n\
  static {\n    *statements...\n}\n```\n\n正如你所看到的，静态初始化器与初始化块相似，但以 `static` 关键字开头。与初始化块一样，你在类体中编写静态初始化器，但在任何其他块（如方法或构造函数的体）之外。\n\
  \n当你第一次访问静态成员（如静态字段或静态方法），类中的任何静态初始化器都会执行——前提是你还没有创建实例。这是因为静态初始化器在第一次创建实例时也会执行。在这种情况下，静态初始化器会在构造函数执行*之前*执行。\n\
  \n如果一个类有多个静态初始化器，它们将按照它们在程序中出现的顺序执行。\n\n这是一个包含静态初始化器的类示例：\n\n```java\nclass StaticInit\
  \ {\n    public static int x;\n\n    static {\n        x = 32;\n    }\n    // 其他类成员，如构造函数和\n\
  \    //方法写在这里...\n}\n```\n\n这个例子非常平淡。事实上，你只需要在声明变量时赋值为 32 就可以实现相同的效果。然而，如果你必须通过一个复杂的计算来确定\
  \ `x` 的值——或者它的值来自数据库——那么静态初始化器可能会非常有用。\n\n\n\n\n于是子类就像是父类的孩子一样：它继承了父类的所有特征，包括优点和缺点。父类的所有的字段和方法都会传递给子类。子类可以原样地使用这些字段或方法，也可以对它们进行重写（override），以提供自己的版本。此外，子类还可以添加自己的字段或方法。\n\
  \n在本章中，你将发现这种魔法是如何运作的，并学习创建和使用继承其他类的 `Java` 类的基础知识。你还会发现一些可以帮助你充分利用继承的奇妙技巧。\n\n\
  ## 介绍继承\n\n`inheritance`（继承）这个词会让人联想到几种非计算机的含义：\n\n- 孩子从父母那里继承某些特征。例如，我的三个孩子中有两个是红发。（理想情况下，他们\
  \ 30 岁时不会掉光半头头发。）\n- 孩子也可以从父母那里继承行为。正如俗语所说，“果实不离树”。\n- 当某人去世时，他的继承人获得他的财产。其中一些是好东西，但有些可能不是。我的孩子们在翻找我的车库、决定谁得到什么时，一定会会过得很快的。\n\
  - 你也可以继承权利而不仅仅是财产。你可能因为父母是某个国家的公民而而成为了该国家的公民。\n\n在 `Java` 中，`inheritance` 指面向对象编程的一种特性，它允许你创建派自其他类的类。基于另一个类的类被称为继承（inherit）另一个类。被继承的类被称为\
  \ `parent class`（父类）、`base class`（基类）或 `superclass`（超类）。继承的类被称为 `child class`（子类）、`derived\
  \ class`（派生类）或 `subclass`。\n\n`subclass` 和 `superclass` 这两个术语似乎是 `Java` 大师们首选的术语。所以，如果你想让自己看起来很专业，请使用这些术语。此外，注意\
  \ `subclass` 一词也可以用作动词。例如，当你创建一个继承基类的 `subclass` 时，你正在对基类进行 `subclassing` 操作。\n\n\
  你需要了解关于继承的几点重要事项：\n\n- 派生类会自动获得其基类的所有行为和属性。因此，如果你需要创建几个类来描述并不相同但具有许多共同特征的类型，你可以创建一个定义所有共同特征的基类。然后你可以创建几个继承这些共同特征的派生类。\n\
  - 派生类可以通过定义自己的方法和字段，向其继承的基类添加特征。这是派生类区分于其基类的一种方式。\n- 派生类还可以改变由基类提供的行为。例如，基类可以规定所有派生自它的类都必须有一个名为\
  \ `play` 的方法，但每个类都可以自由地提供 `play` 方法的自己的实现。在这种情况下，所有扩展基类的类都提供了它们自己的 `play` 方法的实现。\n\
  - 继承最适合实现 `is-a-type-of`（是一种……的类型）关系。这里有几个例子：纸牌游戏是一种游戏类型；卡车是一种车辆类型；发票是一种交易类型。在每种情况下，特定类型的对象都是更广泛类别中对象的特定类型。\n\
  \n接下来的章节提供了更多示例，帮助说明这些观点。\n\n## 摩托车、火车和汽车\n\n继承通常用现实世界中的对象（如汽车、摩托车或鸟类和爬虫）来解释。考虑各种类型的车辆。汽车和摩托车是两种不同的车辆类型。如果你正在编写代表车辆的软件，可以从创建一个名为\
  \ `Vehicle` 的类开始，该类将描述所有类型车辆共有的特征，例如轮子；司机；载客的能力以及执行驾驶、停止、转弯和碰撞等操作的能力。\n\n摩托车是一种进一步细化\
  \ `Vehicle` 类的车辆。`Motorcycle` 类将继承 `Vehicle` 类，因此它将拥有轮子；司机；可能的乘客以及驾驶、停止、转弯和碰撞的能力。此外，它还将具有区别于其他类型车辆的特征，例如两个轮子和用于转向控制的车手。\n\
  \n汽车也是一种车辆。`Car` 类将继承 `Vehicle` 类，因此它也将拥有轮子；司机；可能的一些乘客以及驾驶、停止、转弯和碰撞的能力。此外，它还将具有自己的特征，例如四个轮子、方向盘、安全带和气囊以及可选的自动变速箱。\n\
  \n## 游戏玩法\n\n由于你不太可能编写一个模拟汽车、摩托车和其他车辆的程序，让我们来看一个更常见的例子：游戏。假设你想开发一系列桌游游戏，如 `Life`（人生）、`Sorry!`（不起！）和\
  \ `Monopoly`（富大翁）。大多数桌游游戏都有某些共同特征：\n\n- 它们有一个游戏板，上面有玩家可以占据的位置。\n- 它们有由对象表示的玩家。\n\
  - 游戏由每个玩家轮流进行。当游戏开始时，它会一直持续直到有人获胜。（如果你不信我，去问问那些在有人获胜之前试图停止《忌忌环》游戏的孩子吧。）\n\n每种特定类型的游戏都有这些基本特征，但添加了自己的特征。`Life`\
  \ 游戏增加了金钱、保险单据、配偶、孩子以及游戏板中间一个华丽的转盘等特征。`Sorry!` 有你抽取的牌牌来决定每次移动，以及其他玩家无法攻击你的安全区域。`Monopoly`\
  \ 有 `Chance`（机会）牌和 `Community Chest`（公共基金）牌、房产、酒店和金钱。\n\n如果你为这些游戏设计类，可能会创建一个通用的\
  \ `Board Game` 类来定义所有桌游的基本特征，并将其作为特定桌游类的基类，例如 `LifeGame`、`SorryGame` 和 `MonopolyGame`。\n\
  \n## 业务示例\n\n如果车辆或游戏还不能说明这一点，这里有一个来自商业世界的例子。假设你正在设计一个工资系统，并且正在编写代表员工的类。你意识到工资单包含两种类型的员工：薪资员工和小时制员工。因此你决定创建两个类，合理地命名为\
  \ `SalariedEmployee` 和 `HourlyEmployee`。\n\n你很快发现这两个类执行的大部分工作是相同的。两种类型的员工都有姓名、地址、社会安全号码、年度支付总额、预扣税额等。\n\
  \n员工类型之间也有重要的区别。最明显的是薪资员工有年薪，而小时制员工有时薪。此外，小时制员工有每周变化的时间表，而薪资员工可能拥有一种不面向小时制员工的福利计划。\n\
  \n因此你决定创建三个类而不是两个。一个名为 `Employee` 的类处理两种类型员工的所有特征；然后这个类就是 `SalariedEmployee` 和 `HourlyEmployee`\
  \ 类的基类。这些类提供了区分薪资员工和小时制员工的额外特征。\n\n\n\n\n你已经看到了如何使用 `Employee` 类作为基类来创建两种类型的子类：用于薪制员工的\
  \ `SalariedEmployee` 类和用于小时薪制员工的 `HourlyEmployee` 类。假设薪制员工分为两类：管理层和销售层。那么可以使用 `SalariedEmployee`\
  \ 类作为另外两个类的基类：`Manager` 和 `SalesPerson`。\n\n因此，`Manager` 是 `SalariedEmployee` 的一种类型。因为\
  \ `SalariedEmployee` 是 `Employee` 的一种类型，所以 `Manager` 也是 `Employee` 的一种类型。\n\n所有类最终都继承自名为\
  \ `Object` 的 Java 类。任何没有明确说明其派生自哪个类的类都被认为继承自 `Object` 类。该类提供了所有 Java 类共有的一些基本特性，例如\
  \ `toString` 方法。更多信息，请参阅第 3 册第 6 章。\n\n#### 创建子类\n\n创建子类的基本步骤非常简单：你只需要在子类的声明中使用\
  \ `extends` 关键字即可。继承基类的类声明的基本格式如下：\n\n```java\npublic class ClassName extends BaseClass\n\
  {\n    // class body goes here\n}\n```\n\n假设你有一个名为 `Ball` 的类，它定义了一个基础球，而你想创建一个名为\
  \ `BouncingBall` 的子类来增加跳跃的能力：\n\n```java\npublic class BouncingBall extends Ball\n\
  {\n    // 为基础 Ball 对象添加跳跃能力的\n    // 方法和字段：\n    public void bounce()\n    {\n \
  \       // The bounce 方法\n    }\n}\n```\n\n在这里我创建了一个名为 `BouncingBall` 的类，它继承了 `Ball`\
  \ 类。（`Extends` 是 Java 中“继承”的单词。）\n\n子类自动拥有它所继承类的所有方法和字段。因此，如果 `Ball` 类拥有名为 `size`\
  \ 和 `weight` 的字段，那么 `BouncingBall` 类也拥有这些字段。同样，如果 `Ball` 类有一个名为 `throw` 的方法，`BouncingBall`\
  \ 类也会获得该方法。\n\n## 使用子类和继承\n\n继承是 Java 等面向对象编程语言的伟大特性之一，但并不是所有编程问题的答案。而且，坦率，很多 Java\
  \ 程序员过度使用了它。在很多情况下，简单地在另一个类中包含一个类的实例比使用继承更简单。这种技术有时被称为 `Delegation pattern`（委托模式）。\n\
  \n假设你需要创建一个名为 `EmployeeCollection` 的类来表示一组员工。创建该类的方法之一是扩展 Java API 提供的集合类之一，例如 `ArrayList`\
  \ 类。那么你的 `EmployeeCollection` 类将是 `ArrayList` 类的特殊版本，并拥有 `ArrayList` 类可用的所有方法。\n\
  \n然而，更简单的替代方案是在你的 `EmployeeCollection` 类中声明一个类型为 `ArrayList` 的类字段。然后你可以提供方法使用这个\
  \ `ArrayList` 对象来从集合中添加或检索员工。\n\n为什么这种技术被称为 `delegation`（委托）呢？你并没有编写实现集合功能的代码，而是将该任务*委托*给一个\
  \ `ArrayList` 对象，因为 `ArrayList` 对象已经知道如何执行这些功能。（有关 `ArrayList` 类的更多信息，请参阅第 4 册第\
  \ 3 章。）\n\n要正确使用继承，你需要了解一些重要的细节：\n\n- 子类继承其基类的所有成员。然而，构造函数*不*被视为成员。因此，子类*不会*继承自其基类的构造函数。\n\
  - 继承自基类的任何成员的可见性（`public` 或 `private`）在子类中是相同的。这意味着你不能从子类方法或字段访问基类中声明为 `private`\
  \ 的成员。\n- 你可以通过在子类中声明具有相同签名的新成员来*override*（重写）方法。更多信息请参阅下一节。\n- 一种名为 `protected`\
  \ 的特殊可见性会隐藏其他类的字段和方法，但会让它们对子类可用。更多信息，请参阅本章稍后的“保护你的成员”部分。\n- 你可以向子类添加更多私有或受保护的方法或字段。例如，本节之前显示的\
  \ `BouncingBall` 类添加了一个名为 `bounce` 的公共方法。\n\n#### 重写方法\n\n如果子类声明了一个与基类公共方法具有相同签名的方法，则子类版本的方法将*overrides*（重写）基类版本的方法。这种技术允许你修改基类的行为以适应子类的需求。\n\
  \n假设你有一个名为 `Game` 的基类，它有一个名为 `play` 的方法。基类不代表任何特定的游戏，它实现了该方法：\n\n```java\npublic\
  \ class Game\n{\n    public void play()\n    {\n    }\n}\n```\n\n然后你声明了一个名为 `Chess`\
  \ 的类，它继承了 `Game` 类，但也为 `play` 方法提供了实现：\n\n```java\npublic class Chess extends Game\n\
  {\n    public void play()\n    {\n        System.out.println(\"I give up. You win.\"\
  );\n    }\n}\n```\n\n在这里，当你调用 `Chess` 对象的 `play` 方法时，游戏宣布它放弃了。（我是想为这个示例提供一个完整的象棋程序实现，但这会让这一章变得\
  \ 600 页长。所以我在这里选择了更简单的版本。）\n\n注意，要重写方法必须满足三个条件：\n\n- 该类必须继承定义你想重写的方法类。\n- 该方法必须在基类中以\
  \ `public` 权限声明。你不能重写私有方法。\n- 子类中的方法必须与基类方法具有相同的签名。也就是说，方法的名称和参数类型必须相同。\n\n## 保护你的成员\n\
  \n你已经熟悉 `public` 和 `private` 关键字，它们用于指示类成员在类外部是否可见。当你继承一个类时，父类的所有公共成员对子类都是可用的，但私有成员不是。它们确实变成了派生类的一部分，但你不能在派生类中直接访问它们。\n\
  \nJava 提供了第三种可见性选项，在创建子类时很有用：`protected`。具有 `protected` 可见性的成员对子类可用，但对其他类无效。考虑这个例子：\n\
  \n```java\npublic class Ball\n{\n    private double weight;\n    protected double\
  \ getWeight()\n    {\n        return this.weight;\n    }\n    protected void setWeight(double\
  \ weight)\n    {\n        this.weight = weight;\n    }\n}\n\npublic class BaseBall\
  \ extends Ball\n{\n    public BaseBall()\n    {\n        setWeight(5.125);\n   \
  \ }\n}\n```\n\n在这里，`getWeight` 和 `setWeight` 方法以 `protected` 权限声明，这意味着它们在子类 `BaseBall`\
  \ 中可见。然而，这些方法对于没有继承 `Ball` 的类不可见的。\n\n## 在子类中使用 this 和 super\n\n你已经知道了 `this` 关键字：它提供了一种引用当前对象实例的方法。它通常用于区分局部变量或参数与具有同名的类字段。例如：\n\
  \n```java\npublic class Ball\n{\n    private int velocity;\n    public void setVelocity(int\
  \ velocity)\n    {\n        this.velocity = velocity;\n    }\n}\n```\n\n在这里，`this`\
  \ 关键字指示赋值语句左侧引用的 `velocity` 变量是名为 `velocity` 的类字段，而不是同名的参数。\n\n但如果你需要引用属于基类的字段或方法呢？为了\n\
  \n\n\n\n要做到这一点，你需要使用 `super` 关键字。它的工作原理类似，但它指向的是基类的实例，而不是当前类的实例。\n\n考虑这两个类：\n\n\
  ```java\npublic class Ball\n{\n    public void hit() {\n        System.out.println(\"\
  You hit it a mile!\");\n    }\n}\n\nclass BaseBall extends Ball\n{\n    public void\
  \ hit() {\n        System.out.println(\"You tore the cover off!\");\n        super.hit();\n\
  \    }\n}\n```\n\n在这里，`BaseBall` 类中的 `hit` 方法调用了其基类对象的 `hit` 方法。因此，如果你调用 `BaseBall`\
  \ 对象的 `hit` 方法，控制台上将显示以下两行：\nYou tore the cover off!\nYou hit it a mile!\n\n你还可以在子类的构造函数中使用\
  \ `super` 关键字来显式地调用父类的构造函数。欲更多信息，请参阅下一节。\n\n# 使用子类与继承\n\n## 理解继承与构造函数\n\n当你创建一个子类的实例时，Java\
  \ 在执行子类构造函数之前会自动调用基类的默认构造函数。考虑以下类：\n\n```java\npublic class Ball\n{\n    public\
  \ Ball() {\n        System.out.println(\"Hello from the Ball constructor\");\n \
  \   }\n}\n\npublic class BaseBall extends Ball\n{\n    public BaseBall() {\n   \
  \     System.out.println(\"Hello from the BaseBall constructor\");\n    }\n}\n```\n\
  \n如果你创建一个 `BaseBall` 类的实例，控制台上将显示以下两行：\nHello from the Ball constructor\nHello from\
  \ the BaseBall constructor\n\n如果你愿意，可以使用 `super` 关键字从子类显式地调用基类构造函数。由于 Java 会自动为你调用默认构造函数，你唯一的唯一理由是为了调用带有参数的基类构造函数。这里有一个\
  \ `Ball` 和 `BaseBall`类的版本，其中 `BaseBall` 构造函数调用了使用参数的 `Ball` 构造函数：\n\n```java\npublic\
  \ class Ball\n{\n    private double weight;\n    public Ball(double weight) {\n\
  \        this.weight = weight;\n    }\n}\n\npublic class BaseBall extends Ball\n\
  {\n    public BaseBall() {\n        super(5.125);\n    }\n}\n```\n\n在这里，`BaseBall`\
  \ 构造函数调用 `Ball` 构造函数为球提供了一个默认的 `weight`。\n\n在处理父类构造函数时，你需要遵守一些规则和规定：\n\n- 如果你使用\
  \ `super` 来调用父类构造函数，你必须在构造函数的第一语句中这样做。\n- 如果你没有显式地调用 `super`，编译器会插入一个对基类默认构造函数的调用。在这种情况下，基类必须有一个默认构造函数。如果基类没有默认构造函数，编译器将拒绝编译该程序。\n\
  - 如果父类本身也是一个子类，则其父类的构造函数将以相同的方式被调用。这会持续到继承层次的最顶端，直到到达 `Object` 类，它没有父类。\n\n## 使用\
  \ final\n\nJava 有一个 `final` 关键字，具有三个用途。当你对变量使用 `final` 时，它会创建一个常量，其值在初始化后无法更改。常量将在第\
  \ 2 卷第 2 章介绍，因此我在这里不再详细描述 `final` 关键字的这种用法。`final` 关键字的另外用途是创建 final 方法和 final 类。我将在接下来的章节中描述\
  \ `final` 的这两种用法。\n\n### Final 方法\n\n一个 `final method` 是一个不能被子类重写的方法。要创建一个 final\
  \ 方法，你只需要在方法声明中添加 `final` 关键字即可。例如：\n\n```java\npublic class SpaceShip\n{\n    public\
  \ final int getVelocity() {\n        return this.velocity;\n    }\n}\n```\n\n在这里，方法\
  \ `getVelocity` 被声明为 `final`。因此，任何使用 `SpaceShip` 类作为基类的类都不能重写 `getVelocity` 方法。如果它尝试重写，编译器会发出错误信息（\"\
  Overridden method final\"）。\n\n这里是关于 final 方法的一些额外细节：\n\n- 你可能认为子类不需要重写某个方法，但并没有理由能确定这一点。预测他人可能如何使用你的类是困难的。因此，除非你有极佳的理由，否则通常你应该避免使用\
  \ `final` 方法。\n- final 方法的执行效率比非 final 方法更高，因为编译器在编译时就知道对 final 方法的调用不会被其他方法重写。性能提升并不巨大，但对于对性能至关重要的应用程序，这种提升是可以感知到的。\n\
  - 私有方法被自动视为 final，因为你无法重写一个看不见的方法。\n\n### Final 类\n\n一个 `final class` 是一个不能作为基类的类。要声明一个类为\
  \ final，只需在类声明中添加 `final` 关键字即可：\n\n```java\npublic final class BaseBall\n{\n  \
  \  // BaseBall 类的成员存放在这里\n}\n```\n\n那么，没有人再可以使用 `BaseBall` 类作为另一个类的基类。当你声明一个类为 final\
  \ 时，它所有的方法也都被视为 final 方法。从逻辑上讲，这是是合理的。因为你不能将 final 类作为另一个类的基类，所以任何类都不可能重写它的方法。\n\
  \n## 向上转型与向下转型\n\n派生类型的对象可以被视为其基类型对象。例如，如果 `BaseBall` 继承自 `Ball`，一个 `BaseBall` 对象可以被视为\
  \ `Ball` 对象。这种安排被称为向上转型，Java 会自动完成，因此你不需要编写转换代码。以下代码是合法的：\n\n```java\nBall b = new\
  \ BaseBall();\n```\n\n在这里创建了一个 `BaseBall` 类型的对象。然后将该对象赋值给类型为 `Ball` 的变量 `b`。现在假设你在一个名为\
  \ `hit` 的球类中有一个如下声明的方法：\n\n```java\npublic void hit(Ball b)\n```\n\n换句话说，该方法接受 `Ball`\
  \ 类型作为参数。当你调用此方法时，你可以传递一个 `Ball` 对象或 `BaseBall` 对象，因为 `BaseBall` 是 `Ball` 的子类。所以以下代码有效：\n\
  \n```java\nBaseBall b1 = new BaseBall();\nhit(b1);\n\nBall b2 = b1;\nhit(b2);\n\
  ```\n\n然而，自动转型不能反过来。因此，你不能在需要 `BaseBall` 对象的地方使用 `Ball` 对象。假设你的程序有一个如下声明的方法：\n\n\
  ```java\npublic void toss(BaseBall b)\n```\n\n以下代码无法编译：\n\n```java\nBall b = new\
  \ BaseBall();\ntoss(b); // 错误：无法编译\n```\n\n但你可以显式地将变量 `b` 强制转换为 `BaseBall` 对象：\n\
  \n```java\nBall b = new BaseBall();\ntoss((BaseBall) b);\n```\n\n注意，如果 `b` 变量引用的对象不是\
  \ `BaseBall` 对象，则第二个语句会抛出 `ClassCastException` 异常。所以以下代码不起：\n\n```java\nBall b =\
  \ new SoftBall();\ntoss((BaseBall) b); // 错误：b 不是 Softball\n```\n\n如果你想从一个由父类变量引用的对象调用由子类定义的方法呢？假设\
  \ `SoftBall` 类有一个名为 `riseBall` 的方法，该方法在 `Ball` 类中没有定义。你如何从 `Ball` 变量调用它？一种方法是创建一个子类的变量，然后使用赋值语句来转换对象：\n\
  \n```java\nBall b = new SoftBall();\nSoftBall s = (SoftBall)b; // 将 Ball 转换为 SoftBall\n\
  s.riseBall();\n```\n\n但有一种更好的方法：Java 允许你在同一语句中将 `Ball` 对象转换为 `SoftBall` 并调用 `riseBall`\
  \ 方法。你只需要额外的一对括号。\n\n\n\n这些断言，如下所示：\n\n```\nBall b = new SoftBall();\n((SoftBall)\
  \ b).riseBall();\n```\n\n在这里，表达式 `((SoftBall) b)` 返回由变量 `b` 引用的对象，并将其强制转换为 `SoftBall`。然后你就可以使用点运算符调用\
  \ `SoftBall` 类的任何方法。（如果 `b` 不是 `SoftBall` 对象，则该操作符会抛出 `ClassCastException`。）\n\n\
  作为一条通用规则，你应该尽可能在类层级结构中的高处声明带有类型的方法参数。例如，与其创建分别接受 `Ball` 和 `SoftBall` 对象的独立 `toss`\
  \ 方法，不如创建一个接受 `Ball` 对象的单一 `toss` 方法。如果有必要，`toss` 方法可以使用 `instanceof` 运算符（在下一节中将描述）来确定它正在抛出哪种类型的球。\n\
  \n#### 确定对象的类型\n\n如前节所述，一种类型的变量可能持有指向另一种类型对象的引用。如果 `SalariedEmployee` 是 `Employee`\
  \ 类的子类，那么以下语句是完全合法的：\n\n```\nEmployee emp = new SalariedEmployee();\n```\n\n在这里，变量\
  \ `emp` 的类型是 `Employee`，但它引用的对象是 `SalariedEmployee`。\n\n假设你有一个名为 `getEmployee` 的方法，其返回类型为\
  \ `Employee`，但实际上返回 `SalariedEmployee` 或 `HourlyEmployee` 对象：\n\n```\nEmployee emp\
  \ = getEmployee();\n```\n\n在很多情况下，你不需要担心这个方法返回哪种类型的员工，但有时确实需要。假设 `SalariedEmployee`\
  \ 类通过添加一个名为 `getFormattedSalary` 的方法扩展了 `Employee` 类，该方法返回以货币格式化的员工工资。同样，`HourlyEmployee`\
  \ 类通过 `getFormattedRate` 方法扩展了 `Employee` 类，该方法返回以货币格式化的员工时薪资率。那么，你需要知道特定对象是哪种类型的员工，以便知道是应该调用\
  \ `getFormattedSalary` 方法还是 `getFormattedRate` 方法来获取员工的工资。\n\n要判断赋值给变量 `emp` 的是什么种类型的对象，你可以使用\
  \ `instanceof` 运算符，它是专门为此目的设计的。以下是使用 `instanceof` 运算符重写的之前的代码：\n\n```\nEmployee\
  \ emp = getEmployee();\nString msg;\nif (emp instanceof SalariedEmployee)\n{\n \
  \   msg = \"The employee's salary is \";\n    msg += ((SalariedEmployee) emp).getFormattedSalary();\n\
  }\nelse\n{\n    msg = \"The employee's hourly rate is \";\n    msg += ((HourlyEmployee)\
  \ emp).getFormattedRate();\n}\nSystem.out.println(msg);\n```\n\n在这里，`instanceof`\
  \ 运算符用于 `if` 语句，以确定 `getEmployee` 方法返回的对象类型。这样就可以对 `emp` 进行强制转换，而无需担心出现 `CastClassException`。\n\
  \n## 使用子类和继承\n\n### 多态什么？\n\n*多态*（polymorphism）一术是指 Java 使用基类变量引用子类对象的能力；跟踪对象属于哪个子类；以及即使在程序编译时不知道子类，也可以使用子类的被重写的方法。\n\
  \n这听起来很绕口，但当你看到示例时并不难理解。假设你正在开发一个可以玩井井棋（Tic-Tac-Toe）的应用程序。你首先创建一个名为 `Player` 的类来代表其中一个玩家。该类有一个名为\
  \ `move` 的公共方法，返回一个 `int` 来表示玩家想要标记棋盘上的哪个格子：\n\n```\nclass Player\n{\n    public\
  \ int move()\n    {\n        for (int i = 0; i < 9; i++)\n        {\n          \
  \  System.out.println(\"\\nThe basic player says:\");\n            System.out.println(\"\
  I'll take the first open square!\");\n            return firstOpenSquare();\n  \
  \      }\n        return -1;\n    }\n    private int firstOpenSquare()\n    {\n\
  \        int square = 0;\n        // 寻找第一个空格的代码在这里\n        return square;\n   \
  \ }\n}\n```\n\n这个 `Player` 类的基础版本使用简单的策略来确定它的下一步移动是什么：它选择棋盘上的第一个空格。这种策略满足了你的自尊心，让你觉得每次都能赢电脑。（为了保持示例简单，我省略了实际选择移动的代码。）\n\
  \n现在，你需要创建一个 `Player` 类的子类，使用更智能的方法来选择下一步移动：\n\n```java\nclass BetterPlayer extends\
  \ Player\n{\n    public int move()\n    {\n        System.out.println(\"\\nThe better\
  \ player says:\");\n        System.out.println(\"I'm looking for a good move...\"\
  );\n        return findBestMove();\n    }\n    private int findBestMove()\n    {\n\
  \        int square = 0;\n        // 寻找最佳移动的代码在这里\n        return square;\n    }\n\
  }\n```\n\n如你所示，这个版本的 `Player` 类重写了 `move` 方法，并使用更好的算法来选择移动。（再次，为了保持示例简单，我没有显示实际选择移动的代码。）\n\
  \n接下来要做的事情是写一个短类，使用这两个 `Player` 类来玩游戏。该类包含一个名为 `playTheGame` 的方法，接受两个 `Player` 对象。它调用这两个对象的\
  \ `move` 方法：\n\n```java\npublic class TicTacToeApp\n{\n    public static void main(String[]\
  \ args)\n    {\n        Player p1 = new Player();\n        Player p2 = new BetterPlayer();\n\
  \        playTheGame(p1, p2);\n    }\n    public static void playTheGame(Player\
  \ p1, Player p2)\n    {\n        p1.move();\n        p2.move();\n    }\n}\n```\n\
  \n注意，`playTheGame` 方法不知道哪一个玩家是基础玩家，哪一个是更好的玩家。它只是调用每个对象的 `move` 方法。当你运行这个程序时，控制台会显示以下输出：\n\
  \n```Basic player says:\nI'll take the first open square!\nBetter player says:\n\
  I'm looking for a good move...\n```\n\n当调用 `p1` 的 `move` 方法时，执行的是 `Player` 类的 `move`\
  \ 方法。但当调用 `p2` 的 `move` 方法时，执行的是 `BetterPlayer` 类的方法。Java 知道要调用 `BetterPlayer` 类的方法，因为它使用了一种被称为延迟绑定的技术。*延迟绑定*简单来说意味着当编译器无法确定变量引用的具体类型时，它不会在程序编译时硬编码方法调用。\n\
  \n## 自定义异常\n\n在本章中我想涵盖的最后一个主题是如何使用继承来创建你自己的自定义异常。我在第二本书第 8 章中涵盖了处理异常的大部分细节，但那时还没有探索继承，因此无法在该章中讨论自定义异常类。我承诺过会在本书里提到这一点。接下来的章节将履行这个期待已久的承诺。\n\
  \n### 追踪 Throwable 层次结构\n\n如你所知，你使用 `try/catch` 语句来捕获异常，使用 `throw` 语句来抛出异常。每个可以捕获或抛出的异常类型由不同的异常类表示。你可能没有意识到这些异常类使用了相当复杂的继承链，如图\
  \ 4-1 所示。\n\n以下段落描述了该层次结构中的类：\n\n- `Throwable`：异常层次结构的根是 `Throwable` 类。该类代表可以使用\
  \ `throw` 语句抛出并被 `catch` 子句捕获的任何对象。\n- `Error`：`Throwable` 的子类表示程序无法恢复的严重错误情况。该类的子类表示发生的特定错误类型。例如，如果\
  \ Java 虚拟机内存不足，将抛出 `VirtualMachineError`。\n\n\n\n\n必须担心在程序中捕获这些错误。\n\n**» Exception（异常）：**\
  \ 这是 `Throwable` 的一个子类，表示大多数程序应该尝试恢复的错误状况。因此，`Exception` 实际上是你通过 `try/catch` 语句捕获的异常类型层次结构的顶端。\n\
  \n除了 `RuntimeException`（抱歉）之外，`Exception` 的子类表示特定类型的检查异常（checked exceptions），这些异常必须被捕获或抛出。注意，这些某些子类还有自己的子类。例如，名为\
  \ `IOException` 的异常类有 25 个多个子类，代表可能发生的各种 I/O 异常。\n\n**» RuntimeException：** 这是 `Exception`\
  \ 的子类，表示未检查异常（unchecked exceptions）。你不需要捕获或抛出未检查异常，但如果你愿意也可以这样做。`RuntimeException`\
  \ 的子类包括 `NullPointerException` 和 `ArithmeticException`。\n\n如果你的应用程序需要抛出自定义异常，可以创建一个继承自此层次结构中任何类的异常类。通常情况下，你会从\
  \ `Exception` 类开始创建一个自定义的检查异常。下一节将解释如何这样做。\n\n# 使用子类和继承\n\n## 创建异常类\n\n要创建一个自定义异常类，你只需要定义一个扩展\
  \ Java 异常层次结构中某个类的类即可。通常，你会扩展 `Exception` 来创建一个自定义的检查异常。\n\n假设你正在开发一个从文件或数据库检索产品数据的类，并且你希望在遇到\
  \ I/O 错误的方法抛出自定义异常，而不是 Java API 提供的通用 `IOException`。你可以通过创建一个扩展 `Exception` 类的类来实现：\n\
  \n```java\npublic class ProductDataException extends Exception\n{\n}\n```\n\n遗憾的是，构造函数不被视为类成员，因此当你扩展一个类时，它们不会被继承。结果是\
  \ `ProductDataException` 只有一个默认构造函数。`Exception` 类本身以及大多数其他异常类都有一个构造函数，允许你传递一个字符串消息，该消息会随异常存储，并可以通过\
  \ `getMessage` 方法检索。因此，你需要在你的类中添加这个构造函数，这意味着你也想添加一个显式的默认构造函数。现在 `ProductDataException`\
  \ 类看起来如下所示：\n\n```java\npublic class ProductDataException extends Exception\n{\n\
  \    public ProductDataException()\n    {\n    }\n\n    public ProductDataException(String\
  \ message)\n    {\n        super(message);\n    }\n}\n```\n\n虽然这是可能的，但向自定义异常类中添加字段或方法是不常见的。\n\
  \n## 抛出自定义异常\n\n对于任何异常，你都使用 `throw` 语句来抛出自定义异常。你通常会在捕获某些其他更通用异常的 `catch` 语句中间编写此\
  \ `throw` 语句。这里有一个方法从文件检索产品数据，并在发生 `IOException` 时抛出 `ProductDataException`：\n\n\
  ```java\npublic class ProductDDB\n{\n    public static Product getProduct(String\
  \ code)\n    throws ProductDataException\n    {\n        try\n        {\n      \
  \      Product p;\n            // 从文件中获取产品的代码\n            // 并且可能会抛出 IOException\n\
  \            p = new Product();\n            return p;\n        }\n        catch\
  \ (IOException e)\n        {\n            throw new ProductDataException(\"发生了一个\
  \ IO 错误.\");\n        }\n    }\n}\n```\n\n以下是调用 `getProduct` 方法并捕获异常的代码：\n\n```java\n\
  try\n{\n    Product p = ProductDB.getProduct(productCode);\n}\ncatch (ProductDataException\
  \ e)\n{\n    System.out.println(e.getMessage());\n}\n```\n\n在这里，如果抛出了 `ProductDataException`，消息将直接显示在控制台上。在实际程序中，你希望记录错误、通知用户，并弄清楚即使发生此异常如何优雅地继续运行程序。\n\
  \n### 本章内容\n- **理解抽象方法和类**\n- **使用基本接口**\n- **将接口作为类型使用**\n- **在接口中添加常量**\n- **继承接口**\n\
  - **处理回调函数**\n- **使用默认方法**\n\n# 使用抽象类和接口\n\n在本章中，你将了解到如何使用两个相似但细微区别的特性：抽象类和接口。这两者都允许你将类实现的方法和字段签名与类本身分开声明。抽象类通过继承来实现这一点。接口在不使用继承的情况下实现这一点，但效果相似。本章还涵盖了名为\
  \ `default methods`（默认方法）的特性，该特性旨在使接口更易使用。\n\n## 使用抽象类\n\nJava 允许你声明一个方法或整个类是 `abstract`（抽象的），这意味着该方法没有方法体。`abstract\
  \ method` 只是方法的原型：一个返回类型、名称、参数列表以及（可选的）`throws` 子句。\n\n要创建一个抽象方法，你需要指定修饰符 `abstract`\
  \ 并用分号替换方法体：\n\n```java\npublic abstract int hit(int batSpeed);\n```\n\n在这里，名为 `hit`\
  \ 的方法被声明为抽象方法，它返回一个 `int` 值并接受一个 `int` 参数。\n\n一个包含至少一个抽象方法的类被称为 `abstract class`（抽象类），并且必须在类声明中使用\
  \ `abstract` 修饰符进行声明。例如：\n\n```java\npublic abstract class Ball\n{\n    public abstract\
  \ int hit(int batSpeed);\n}\n```\n\n如果你在类声明中省略了 `abstract` 修饰符，Java 编译器会抛出错误信息，提醒你该类必须声明为\
  \ `abstract`。\n\n抽象类不能被实例化。因此，给定前面的声明，下行代码无法编译：\n\n```java\nBall b = new Ball();\
  \ // 错误：Ball 是抽象的\n```\n\n问题不在于将变量 `b` 声明为 `Ball`，而在于尝试使用 `new` 关键字配合 `Ball` 类来创建\
  \ `Ball` 对象。因为 `Ball` 是抽象类，你不能用它来创建实例。\n\n你可以这样从抽象类创建一个子类：\n\n```java\npublic class\
  \ BaseBall extends Ball\n{\n    public int hit(int batSpeed)\n    {\n        //\
  \ 在这里实现 方法\n    }\n}\n```\n\n当你扩展抽象类时，子类必须为抽象类中的每个抽象方法提供实现。换句话说，它必须用非抽象方法覆盖每个抽象方法。（如果不是，子类也是抽象的）。\n\
  \n## 抽象工厂模式\n\n抽象类的一个常见用途是在预先不知道需要哪个子类的情况下提供一种获取多个子类实例的方法。为了实现这一点，你可以创建一个 `Abstract\
  \ Factory class`（抽象工厂类），它拥有一个或多个返回子类的方法。\n\n假设你想创建一个 `Ball` 对象，但你想让用户选择创建 `SoftBall`\
  \ 还是 `BaseBall`。使用抽象工厂模式，你需要创建一个类（我称之为 `BallFactory`），它有一个名为 `getBallInstance` 的方法。该方法接受一个\
  \ `String` 参数，如果你想要 `BaseBall` 对象，则设置为 `\"BaseBall\"`；如果你想要 `SoftBall` 对象，则设置为 `\"\
  SoftBall\"`。\n\n这里是工厂类：\n\n```java\nclass BallFactoryInstance\n{\n    public static\
  \ Ball getBall(String t)\n    {\n        if (s.equalsIgnoreCase(\"BaseBall\"))\n\
  \            return new BaseBall();\n        if (s.equalsIgnoreCase(\"SoftBall\"\
  ))\n            return new SoftBall();\n        return null;\n    }\n}\n```\n\n\
  那么，假设字符串变量 `userChoice` 已根据用户的选择进行了设置，你可以这样创建所选类型的 `Ball` 对象：\n\n```java\nBall b\
  \ = BallFactory.getBallInstance(userChoice);\n```\n\n\n\n\n在实际应用中，使用枚举（enum）变量比使用字符串（String）变量来指示返回对象的类型更好。\n\
  \n当你想要创建一个通用类型作为两个或多个子类的父类，但父类本身不代表任何实际对象时，抽象类非常有用。例如，如果所有员工要么领月薪要么按小时计费，那么创建一个抽象的\
  \ `Employee` 类并将其作为 `SalariedEmployee`（薪资员工）和 `HourlyEmployee`（小时员工）子类的基类是有意义的。\n\
  \n# 使用抽象类和接口\n\n关于抽象类，这里有几点需要考虑：\n\n- 抽象类中的并非所有方法都必须是抽象的。类可以为某些方法提供实现，但对其他方法不是。事实上，即使一个类没有任何抽象方法，你仍然可以将其声明为抽象。（在这种情况下，该类无法被实例化。）\n\
  - 私有方法不能是抽象的。这很合理，因为子类无法重写私有方法，而抽象方法必须被重写。\n- 尽管你不能创建抽象类的实例，但可以使用抽象类作为其类型来声明变量。然后使用该变量来引用该抽象类的任何子类的实例。\n\
  - 类不能同时指定为抽象（abstract）和最终（final）。这会导致某种逻辑悖论，导致宇宙毁灭。嗯，理想情况下，影响应该是局部的。但重点是，因为抽象类只有在被继承时才能使用，而\
  \ final 类不能被继承，因此让同一个类同时指定 abstract 和 final 是没有意义的。\n\n抽象类在 Java API 中被广泛使用。许多抽象类的名称以\
  \ Abstract 开头——例如 `AbstractBorder`、`AbstractCollection` 和 `AbstractMap`——但大多数抽象类并不是。例如，`InputStream`\
  \ 类（由 `System.in` 使用）就是抽象的。\n\n# 接口\n\n接口（interface）与抽象类相似，但接口可以只包含抽象方法和 final 字段（常量），且接口不能作为基类。类通过为接口声明的每个方法提供代码来“实现（implements）”一个接口。\n\
  \n与继承相比，接口有两个优势：\n\n- 接口比抽象类更容易处理，因为你不需要担心在接口中提供任何实现细节。\n- 一个类只能扩展另一个类，但它可以实现你需要的数量的接口。\n\
  \n接下来的章节描述了创建和使用接口的细节。\n\n## 创建基本接口\n\n这是一个基本接口，定义了一个名为 `Playable` 的方法，它包含一个名为 `play`\
  \ 的单方法：\n\n```java\npublic interface Playable\n{\n    void play();\n}\n```\n\n此接口声明，任何实现\
  \ `Playable` 接口的类必须为名为 `play` 的方法提供实现，该方法不接受参数且没有返回值。\n\n此接口有一些有趣的细节：\n\n- 接口本身被声明为\
  \ `public`，以便其他类可以使用。像公有类一样，公有接口必须在同同名的文件中声明。因此，此接口必须位于名为 `Playable.java` 的文件中。\n\
  - 接口的名称（`Playable`）是一个形容词。大多数接口用形容词 own 名词命名，因为它们描述了实现接口的类的某些额外能力或属性。因此，实现 `Playable`\
  \ 接口的类代表可以被玩的对象。\n- 如果你很久没上英语课了，*形容词（adjective）*是修饰名词的词。你可以通过在单词末尾添加 *-able* 将许多动词转换为形容词——例如\
  \ `playable`、`readable`、`drivable` 和 `stoppable`。这种形容词通常用于接口名称。\n- 另一种命名接口的常用方法是将形容词与名词结合，以指示接口为特定类型的对象增加了某些功能。你可以将提供扑牌游戏唯一方法的接口命名为\
  \ `CardGame`，这个接口可能拥有 `deal`、`shuffle` 和 `getHand` 等方法。\n- 接口中的所有方法都被假设是 public\
  \  abstract 的。如果你愿意，可以在接口方法上编写 `public` 和 `abstract` 关键字。然而，这种编码被认为是不良习惯，因为可能表明你认为默认值是私有的而不是抽象的。\n\
  \n# 实现接口\n\n要实现一个接口，类必须做两件事：\n\n- 它必须在类声明中指定一个 `implements` 子句。\n- 它必须为接口声明的每个方法提供实现。\n\
  \n这是一个实现 `Playable` 接口的类：\n\n```java\npublic class TicTacToe implements Playable\n\
  {\n    // 额外的字段和方法放在这里\n    public void play()\n    {\n        // 运行游戏的代码在这里\n \
  \   }\n    // 额外的字段和方法放在这里\n}\n```\n\n这里 `TicTacToe` 类的声明指定了 `implements Playable`。然后类的主体包含了\
  \ `play` 方法的实现。\n\n一个类可以实现多个接口：\n\n```java\npublic class Hearts implements Playable,\
  \ CardGame\n{\n    // 必须实现 Playable\n    // 和 CardGame 接口的方法\n}\n```\n\n在这里，`Hearts`\
  \ 类实现了两个接口：`Playable` 和 `CardGame`。\n\n类可以继承一个父类并实现一个或多个接口。这是一个示例：\n\n```java\n\
  public class Poker extends Game implements Playable, CardGame\n{\n    // 继承 Game\
  \ 类的所有成员\n    // 必须实现 Playable\n    // 和 CardGame 接口\n}\n```\n\n## 将接口作为类型\n\n在\
  \ Java 中，接口是一种类型，就像类一样。因此，可以使用接口作为变量、参数或方法的返回值类型。\n\n考虑这段代码片段：\n\n```java\nPlayable\
  \ game = getGame();\ngame.play();\n```\n\n在这里我假设 `getGame()` 返回一个实现了 `Playable`\
  \ 接口的对象。在第一个语句中，它被赋值给一个 `Playable` 类型的变量。第二个语句调用该对象的 `play` 方法。\n\n对于另一个（稍微复杂一点的）示例，假设你有一个名为\
  \ `Dealable` 的接口，它定义了一个接受纸牌数量作为参数的 `deal` 方法：\n\n```java\npublic interface Dealable\n\
  {\n    void deal(int cards);\n}\n```\n\n现在假设有一个名为 `startGame` 的方法，它接受两个参数：一个 `Dealable`\
  \ 对象和一个指示什么游戏的 `String`。这个方法可能像这样：\n\n```java\nprivate void startGame(Dealable deck,\
  \ String game)\n{\n    if (game.equals(\"Poker\"))\n        deck.deal(5);\n    else\
  \ if (game.equals(\"Hearts\"))\n        deck.deal(13);\n    else if (game.equals(\"\
  Gin\"))\n        deck.deal(10);\n}\n```\n\n假设你还有一个名为 `CardDeck` 的类实现了 `Dealable`\
  \ 接口，你可能会像示例语句这样开始玩游戏：\n\n```java\nDealable d = new CardDeck();\nstartGame(d, \"\
  Hearts\");\n```\n\n注意变量 `d` 被声明为 `Dealable`。你完全可以将其声明为 `CardDeck`：\n\n```java\n\
  CardDeck d = new CardDeck();\nstartGame(d, \"Hearts\");\n```\n\n因为 `CardDeck` 类实现了\
  \ `Dealable` 接口，因此它可以作为参数传递给 `startGame` 方法。\n\n# 接口可以做的更多事情\n\n接口不仅仅是创建抽象方法。接下来的\n\
  \n\n\n\n章节描述了你可以对接口进行的一些其他有趣操作。\n\n继续阅读. . . .\n\n### 向接口中添加字段\n\n除了抽象方法外，接口还可以包含最终字段（final\
  \ fields）——即常量。接口字段用于提供与接口相关的常量值。例如：\n\n```java\npublic interface GolfClub\n{\n\
  \    int DRIVER = 1;\n    int SPOON = 2;\n    int NIBLICK = 3;\n    int MASHIE =\
  \ 4;\n}\n```\n\n在这里，任何实现 `GolfClub` 接口的类都可以这四个字段（即常量）。\n\n注意，接口字段被自动假设为 `static`、`final`\
  \ 和 `public`。在创建接口常量时，你可以包含这些关键字，但没有必要。\n\n### 扩展接口\n\n你可以使用 `extends` 关键字来扩展接口。扩展现有接口的接口称为`子接口`（subinterface），而被扩展的接口称为`超接口`（superinterface）。\n\
  \n306 第 3 册 **面向对象编程**\n\n当你在对接口使用 `extends` 关键字时，`超接口`的所有字段和方法都会被有效地复制到`子接口`中。因此，子接口由`超接口`中的字段和方法加上`子接口`定义的字段和方法组合而成。\n\
  \n这是一个示例：\n\n```java\npublic interface ThrowableBall\n{\n    void throwBall();\n\
  \    void catchBall();\n}\n\npublic interface KickableBall\n{\n    void kickBall();\n\
  \    void catchBall();\n}\n\npublic interface PlayableBall\nextends ThrowableBall,\
  \ KickableBall\n{\n    void dropBall();\n}\n```\n\n在这里声明了三个接口。第一个名为 `ThrowableBall`，定义了两个方法：`throwBall`\
  \ 和 `catchBall`。第二个名为 `KickableBall`，也定义了两个方法：`kickBall` 和 `catchBall`。第三个名为 `PlayableBall`扩展了\
  \ `ThrowableBall` 和 `KickableBall`，并添加了自己的名为 `dropBall` 的方法。\n\n因此，任何实现 `PlayableBall`\
  \ 接口的类必须为四个方法提供实现：`throwBall`、`catchBall`、`kickBall` 和 `dropBall`。注意，由于 `ThrowableBall`\
  \ 和 `KickableBall` 接口定义的 `catchBall` 方法具有相同的签名，因此 `PlayableBall` 接口中只包含一个 `catchBall`\
  \ 方法。\n\n### 使用接口进行回调\n\n在剧院里，回调（callback）是你参加初次试镜，他们喜欢你的表现，并告诉他们希望你再回来，以便他们再看一遍。\n\
  \n在 Java 中，`callback` 就像那样。这是一种编程技术，一个对象让另一个对象知道每当发生特定事件时，第二个对象就应该调用第一个对象的方法之一。第一个对象被称为`事件监听器`（event\
  \ listener），因为它会耐心地等待另一个对象调用它。第二个对象被称为`事件源`（event source），因为它是导致调用监听器的事件的源头。第 5\
  \ 章节 **使用抽象类和接口** 307\n\n好了，我的剧院类比有点牵强。Java 中的回调并不真的那么像你试镜大角色时的那种回调（回访）。回调更像是你需要通过电话联系某人，当你知道他不在那里时给他打电话，并在他的语音信箱中留下你的电话号码，以便他回给你电话。\n\
  \nJava 中的回调通过一组专为此目的设计的接口来处理。回调最常见的用法是在使用 `Swing` 构建的图形应用程序中，在其中你创建事件监听器来处理用户界面事件，例如鼠标点击。你将在第\
  \ 6 册中了解到 `Swing` 的所有信息。现在，我通过使用 `javax.Swing` 包中的 `Timer` 类来研究回调。该类实现了一个基础定时器，按间隔生成事件——并允许你设置一个`listener\
  \ object`来处理这些事件。监听器对象必须实现 `ActionListener` 接口，该接口定义了一个名为 `actionPerformed`的方法，该方法在每次定时器事件时被调用。\n\
  \n`标记接口`（marker interface）是不包含任何成员的接口。它在生命中唯一的目的是标识一个类属于具有某些能力或具有共同特征的类集合。\n\n标记接口最著名的例子是\
  \ Java API 中的 `Cloneable` 接口，它标记了可以被隆的类。所有类最终都继承的 `Object` 类提供了一个名为 `clone` 的方法，可以创建对象的副本。然而，只有当对象实现了\
  \ `Cloneable` 接口时，你才允许调用 `clone` 方法。如果你尝试对没有实现 `Cloneable` 的对象调用 `clone`，将抛出 `CloneNotSupportedException`。（有关\
  \ `clone` 方法的更多信息，请参考第 3 册第 6 章。）\n\n以下是 `Cloneable` 接口的实际代码：\n\n```java\npublic\
  \ interface Cloneable {\n}\n```\n\n在某些情况下，你可能会在自己的应用程序中发现标记接口的用途。如果你正在编写一组用于创建游戏的类，你可能会创建一个名为\
  \ `Winnable` 的标记接口，以区分有胜者的游戏和仅为了消遣玩的游戏。\n\n308 第 3 册 **面向对象编程**\n\n`Timer` 类构造函数接受两个参数：\n\
  \n- 第一个参数是一个 `int` 值，代表定时器事件发生的频率。\n- 第二个参数是一个实现 `ActionListener` 接口的对象。该对象的 `actionPerformed`\
  \ 方法将被调用。\n\n\n\n`Timer` 类是 `javax.swing` 包的一部分，因此需要此条导入语句。\n\n→10 这条语句创建了一个新的 `Timer`\
  \ 对象。定时器的间隔设置为 1,000 毫秒——等同于 1 秒。将 `Ticker` 类的新实例作为第二个参数传递。。定时器在每次滴答（tick）时调用该对象的\
  \ `actionPerformed` 方法——换句话说，每秒调用一次。\n\n→11 这条语句调用 `start` 方法来启动定时器。\n\n→15 `JOptionPane`\
  \ 类用于显示一个对话框，告诉用户点击 OK 按钮停止应用程序。你可能认为我包含这个对话框是为了给用户提供一种结束程序的方法。实际上，我使用它是为了给定时器留出运行时间。如果我在启动定时器后直接结束\
  \ `main` 方法，应用程序就会结束，从而杀死定时器。由于我在这里使用了 `JOptionPane`，只要对话框一直显示，应用程序就会继续运行。（关于 `JOptionPane`\
  \ 的更多信息，请参见第 2 第 2 章。）\n\n→20 这一行是 `Ticker` 类的声明，它实现了 `ActionListener` 接口。\n\n→22\
  \ 这一行是一个私有布尔类字段，用于跟踪 `Ticker` 显示的是 Tick... 还是 Tock...。每次调用 `actionPerformed` 方法时，该字段都会切换一次状态。\n\
  \n→24 这一行是 `actionPerformed` 方法，它在每个定时器间隔时被调用。\n\n→28 如果 `tick` 为 true，这一行会在控制台上打印\
  \ Tick...。\n\n→32 如果 `tick` 为 false，这一行会在控制台上打印 Tock...。\n\n→34 这一行切换 `tick` 变量的值。换句话说，如果\
  \ `tick` 为 true，则将其设置为 false；如果 `tick` 为 false，则将其设置为 true。\n\n# 使用抽象类和接口\n\n##\
  \ 使用默认方法（Default Methods）\n\n虽然接口是 Java 中一个功能极其有用的特性，但它们有一个固有的局限性：在你定义了一个接口并构建实现该接口的类之后，没有简单的方法可以通过向其添加额外方法来修改接口。例如，假设你创建了以下接口：\n\
  \n```java\npublic interface Playable\n{\n    void play();\n}\n```\n\n然后你构建了几个实现此接口的类。这里是一个简单的例子：\n\
  \n```java\nclass Game implements Playable\n{\n    public void play()\n    {\n  \
  \      System.out.println(\"Good luck!\");\n    }\n}\n```\n\n当然，这是一个非常毫无意义的游戏；每当调用\
  \ `play` 方法时，它只是简单地打印消息“Good luck!”\n\n现在，假设你决定 `Playable` 接口应该有一个额外的功能——具体来说，你想要添加一种通过调用名为\
  \ `quit` 的方法来结束游戏的能力。你可能想直接将新方法添加到现有的接口中，如下所示：\n\n```java\npublic interface Playable\n\
  {\n    void play();\n    void quit();\n}\n```\n\n遗憾的是，这样做会破坏 `Game` 类，因为它没有提供 `quit`\
  \ 方法的实现。\n\n当然，你可以通过添加 `quit` 方法的实现来修改 `Game` 类。但如果你已经写了数十甚至上百个实现 `Playable` 的类呢？正如你想象的，一旦一个接口变得流行，修改它就几乎是不可能的。\n\
  \n为了缓解这个问题，Java 1.8 引入了一种新类型的接口方法，称为**默认方法（default method）**，它提供了代码，并将作为任何实现接口但自身未为默认方法提供实现的类的该方法实现。\n\
  \n因此，Java 8 允许你通过将 `quit` 方法指定为默认方法来安全地将其添加到 `Playable` 接口中，如下：\n\n```java\ninterface\
  \ Playable\n{\n    void play();\n    default void quit()\n    {\n        System.out.println(\"\
  Sorry, quitting is not allowed.\");\n    }\n}\n```\n\n在这里，`Playable` 接口规定，如果实现类没有提供\
  \ `quit` 方法的实现，将使用默认方法。在这种情况下，默认方法只需打印消息“Sorry, quitting is not allowed.”\n\n注意，上述示例在\
  \ 1.8 之前的 Java 版本上无法编译。当你尝试编译使用 `default` 关键字的接口时遇到错误信息，请检查你的 Java 版本，以确保你运行的是 1.8\
  \ 或更高版本。\n\n这是一个使用 `Playable` 接口及其 `default` 方法的完整示例：\n\n```java\npublic class TestLambdaCollection\n\
  {\n    public static void main(String[] args)\n    {\n        Game g = new Game();\n\
  \        g.play();\n        g.quit();\n    }\n}\n\ninterface Playable\n{\n    void\
  \ play();\n    default void quit()\n    {\n        System.out.println(\"Sorry, quitting\
  \ is not allowed.\");\n    }\n}\n\nclass Game implements Playable\n{\n    public\
  \ void play()\n    {\n        System.out.println(\"Good luck!\");\n    }\n}\n```\n\
  \n当你运行此程序时，控制台上将显示如下：\n\n```\nGood luck!\nSorry, quitting is not allowed.\n```\n\
  \n# 本章内容\n- 使用 `toString` 方法\n- 实现 `equals` 方法\n- 尝试 `clone` 方法\n- 理解 `Class` 类\n\
  \n## 第 6 章：使用 Object 和 Class 类\n\n### 类之母：Object\n\n`Object` 是所有类的祖类。在 Java 中，每个类都继承\
  \ `Object` 类。该类提供了一组供每个 Java 对象使用的方法。\n\n## 每个对象都是 Object\n\n任何没有 `extends` 子句的类都会隐式继承\
  \ `Object`。因此，你不需要编写这样的类：\n\n```java\npublic class Product extends Object\n```\n\
  \n如果子类有一个 `extends` 子句指定了 `Object` 以外的父类，该类仍然继承 `Object`。这是因为继承链最终会到达一个没有 `extends`\
  \ 子句的父类，而该父类继承了 `Object` 并将其传递给所有子类。\n\n假设你有这些类：\n\n```java\npublic class Manager\
  \ extends SalariedEmployee...\npublic class SalariedEmployee extends Employee...\n\
  public class Employee extends Person...\npublic class Person...\n```\n\n在这里，`Manager`\
  \ 类间接继承 `Object` 类，因为它继承 `SalariedEmployee`，后者继承 `Employee`，以此类推，直到最终继承 `Object`。在\
  \ Java 中，创建一个不继承 `Object` 的类是不可能的。\n\n## 作为类型的 Object\n\n如果你不知道或不在乎引用的对象的类型，可以将其类型指定为\
  \ `Object`。以下示例是完全合：\n\n```java\nObject emp = new Employee();\n```\n\n然而，你无法对 `emp`\
  \ 变量进行任何有用操作，因为编译器不知道它是一个 `Employee`。如果 `Employee` 类有一个名为 `setLastName` 的方法，以下代码无法工作：\n\
  \n```java\nObject emp = new Employee();\nemp.setLastName(\"Smith\"); // 错误：无法编译\n\
  ```\n\n\n\n\n\n由于 `emp` 是一个 `Object` 而不是 `Employee`，编译器并不知道 `setLastName` 方法。\n\n\
  注意，你仍然可以将该对象强制转换为 `Employee`：\n\n```java\nObject emp = new Employee();\n((Employee)emp).setLastName(\"\
  Smith\"); // 这样可以运行\n```\n\n## 使用 Object 和 Class 类\n\n但这样做有什么意义呢？你不如一开始就让 `emp`\
  \ 一个 `Employee`。\n\n然而，在某些情况下，将变量、参数或返回类型声明为 `Object` 是完全有意义的。Java API 提供了一组用于维护对象集合的类。这些类中，常用之一是\
  \ `ArrayList` 类，它有一个名为 `add` 的方法，接受一个 `Object` 作为参数。该方法将指定的对象添加到集合中。由于参数类型是 `Object`，你可以使用\
  \ `ArrayList` 类创建任何类型对象的集合。（有关 `ArrayList` 类和其他集合类的类的更多信息，请参阅第 4 册。）\n\n## Object\
  \ 类的方法\n\n表 6-1 列出了 `Object` 类的所有方法。通常情况下，我不会列出类类的所有方法；我只会列出我认为最有用的那些。然而，由于 `Object`\
  \ 在面向对象编程的游戏中如此重要的角色，我认为向你展示它所有的能力是最好的，尽管某些方法有些晦涩。\n\n我警告过你了——这整章应该有一个“技术细节（Technical\
  \ Stuff）”图标。\n\n### 表 6-1：Object 类的方法\n\n| 方法 | 功能 |\n| :--- | :--- |\n| `protected\
  \ Object clone()` | 返回此对象的副本。 |\n| `boolean equals(Object obj)` | 表明此对象是否等于 `obj`\
  \ 对象。 |\n| `protected void finalize()` | 在对象被销毁时由垃圾回收器调用。 |\n| `Class getClass()`\
  \ | 返回表示此对象运行时类的 `Class` 对象。 |\n| `int hashCode()` | 返回此对象的哈希码。 |\n\n#### 表 6-1（续）\n\
  \n| 方法 | 功能 |\n| :--- | :--- |\n| `void notify()` | 用于多线程应用程序，唤醒正在等待此对象的线程。 |\n\
  | `void notifyAll()` | 用于多线程应用程序，唤醒所有等待此对象的线程。 |\n| `String toString()` | 返回此对象的字符串表示。\
  \ |\n| `void wait()` | 使此对象的线程等待，直到另一个线程调用 `notify` 或 `notifyAll`。 |\n| `void wait(Long\
  \ timeout)` | 基础 `wait` 方法的变体。 |\n| `void wait(Long timeout, int nanos)` | `wait`\
  \ 方法的另一个变体。 |\n\n***注意：*** 这些方法中几乎一半（`notify`、`notifyAll` 以及三个 `wait` 方法）与线程有关。你在第\
  \ 5 册第 1 章中找到这五个方法的完整信息。以下是其余六方法的简述：\n\n- **clone**: 该方法通常用于创建对象的副本，在在你自己的类中重写它并不罕见。我将在本章稍后的“The\
  \ clone Method”部分中详细解释此该方法。\n- **equals**: 该方法通常用于比较对象。任何表示可以与另一个对象比较的对象的类都应该重写此方法。请参阅本章稍后的“The\
  \ equals Method”部分以获取更多信息。\n- **finalize**: 当垃圾回收器意识到一个对象不再被使用并可以丢弃时，就会调用此方法。该方法的意图是让你创建的对象在被丢弃之前通过关闭打开的文件和执行其他清理任务来自己清理。但由于\
  \ Java 垃圾回收器的工作方式，无法保证 `finalize` 方法是否真的被调用过。因此，此方法并不常用。\n- **getClass**: 该方法有时与\
  \ `Class` 类结合使用，我将在本章稍后的“The Class Class”部分中描述它。\n- **hashCode**: 每个 Java 对象都有一个哈希码，它是该类的\
  \ `int` 类型表示，对某些操作有用。在 particular 开始处理哈希表之前，此方法并不极端重要——这是一种非常高级的技术，最好留给那些带口袋笔并用胶带粘住眼镜的人们。\n\
  - **toString**: 该方法是 Java 中最常用的方法之一。我将在本章稍后的“The toString Method”部分中描述它。\n\n###\
  \ 基本类型不是对象\n\n我需要指出，基本数据类型（如 `int` 和 `double`）不是对象。因此，它们不继承 `Object` 类，无法访问上一节列出的方法。\n\
  \n因此，以下代码将无法工作：\n\n```java\nint x = 50;\nString s = x.toString(); // 错误：无法编译\n```\n\
  \n如果你真的想以这种方式将 `int` 转换为字符串，你可以使用包装类（如 `Integer`）从该值创建一个对象，然后调用它的 `toString` 方法：\n\
  \n```java\nString s = new Integer(x).toString(); // OK\n```\n\n每个包装类还定义了一个静态的 `toString`\
  \ 方法，你可以像这样使用它：\n\n```java\nString s = Integer.toString(x);\n```\n\n有时，使用允许在字符串拼接表达式中使用基本数据类型的编译器快捷方式更简单：\n\
  \n```java\nString s = \"\" + x;\n```\n在这里，`int` 变量 `x` 与空字符串拼接。\n\n### toString\
  \ 方法\n\n`toString` 方法返回此对象的字符串表示。默认情况下，`toString` 方法返回类名加上其哈希码。在接下来的章节中，我将向展示如何使用\
  \ `toString` 方法以及如何在你自己的类中重写它。\n\n#### 使用 toString\n\n这是一个让 `toString` 方法发挥作用的简单程序：\n\
  \n```java\npublic class TestToString {\n    public static void main(String[] args)\
  \ {\n        Employee emp = new Employee(\"Martinez\", \"Anthony\");\n        System.out.println(emp.toString());\n\
  \    }\n}\n\nclass Employee {\n    private String lastName;\n    private String\
  \ firstName;\n\n    public Employee(String lastName, String firstName) {\n     \
  \   this.lastName = lastName;\n        this.firstName = firstName;\n    }\n}\n```\n\
  此代码创建了一个新的 `Employee` 对象；然后将其 `toString` 方法的结果打印到控制台上。当你运行该程序时，控制台会打印出以下行：\n\n`Employee@82ba41`\n\
  \n***注意：*** 哈希码——在本例中为 `82ba41`——在你的系统中无疑会不同。\n\n事实证明，在这个例子中显式调用 `toString` 并不是必要的。我完全可以这样写\
  \ main 方法的第二行：\n\n```java\nSystem.out.println(emp);\n```\n这是因为 `println` 方法会自动调用传递它的任何对象的\
  \ `toString` 方法。\n\n#### 重写 toString\n\n`toString` 的默认实现在大多数情况下并不好用。例如，通过查看哈希码，你并不能学到关于\
  \ `Employee` 对象。如果 `toString` 方法能返回对象的某些实际数据（例如员工姓名），不是更好吗？\n\n为了实现这一点，你必须在你的类中重写\
  \ `toString` 方法。事实上，Java 面向对象编程的基本准则之一是*始终*重写 `toString`。这是一个重写了 `toString` 的 `Employee`\
  \ 类的简单程序：\n\n```java\npublic class TestToString {\n    public static void main(String[]\
  \ args) {\n        Employee emp = new Employee(\"Martinez\", \"Anthony\");\n   \
  \     System.out.println(emp.toString());\n    }\n}\n\nclass Employee {\n    private\
  \ String lastName;\n    private String firstName;\n\n    public Employee(String\
  \ lastName, String firstName) {\n        this.lastName = lastName;\n        this.firstName\
  \ = firstName;\n    }\n\n    @Override\n    public String toString() {\n       \
  \ return lastName + \", \" + firstName;\n    }\n}\n```\n\n\n\n\n\n```java\nthis.lastName\
  \ = lastName;\nthis.firstName = firstName;\n}\n\npublic String toString()\n{\n \
  \   return \"Employee[\"\n    + this.firstName + \" \"\n    + this.lastName + \"\
  ]\";\n}\n}\n```\n\n当你运行此程序时，控制台上会显示以下行内容：\n\n`Employee[Anthony Martinez]`\n\n注意，输出由类名以及括号中对象的某些数据组成。这种约定在\
  \ Java 编程中非常常见。\n\n# 第 6 章 使用对象和类\n\n上一个示例的唯一问题是类名被硬编码在 `toString` 方法中。你可以使用 `getClass`\
  \ 方法在运行时获取实际的类名：\n\n```java\npublic String toString()\n{\n    return this.getClass().getName()\
  \ + \"[\"\n    + this.firstName + \" \"\n    + this.lastName + \"]\";\n}\n```\n\n\
  在这里，`getClass` 方法返回一个表示当前对象的 `Class` 对象。然后使用 `Class` 对象的 `getName` 方法来获取实际的类名。（你将在本章稍后的部分了解到更多关于\
  \ `Class` 对象的信息。）\n\n### equals 方法\n\n测试对象以判断它们是否相等是任何面向对象编程语言的基本任务之一。遗憾的是，Java\
  \ 在这方面并不出色。\n\n考虑这个程序：\n\n```java\npublic class TestEquality1\n{\n    public static\
  \ void main(String[] args)\n    {\n        Employee emp1 = new Employee(\n     \
  \   \"Martinez\", \"Anthony\");\n        Employee emp2 = new Employee(\n       \
  \ \"Martinez\", \"Anthony\");\n        if (emp1 == emp2)\n            System.out.println(\n\
  \            \"These employees are the same.\");\n        else\n            System.out.println(\n\
  \            \"These are different employees.\");\n    }\n}\nclass Employee\n{\n\
  \    private String lastName;\n    private String firstName;\n\n    public Employee(String\
  \ lastName, String firstName)\n    {\n        this.lastName = lastName;\n      \
  \  this.firstName = firstName;\n    }\n}\n```\n\n在这里，`main` 方法创建了具有相同数据的 `Employee`\
  \ 对象并对它们进行了比较。遗憾的是，比较返回了 `false`。尽管 `Employee` 对象具有相同的数据，但它们并不被认为是相等的，因为相等运算符 (`==`)\
  \ 比较的是对象的引用，而不是对象包含的数据。因此，只有当 `emp1` 和 `emp2` 都指向 `Employee` 类的同一个实例时，比较才会返回 `true`。\n\
  \n如果你想创建包含相同数据时被认为是相等的对象，你需要做两件事：\n\n- 使用 `equals` 方法而不是相等运算符来比较它们。\n- 在你的类中重写 `equals`\
  \ 方法，以根据数据比较对象。\n\n接下来的章节描述了这两个步骤。\n\n#### 使用 equals\n\n要使用 `equals` 方法而不是相等运算符测试对象，你只需要这样重写比较表达式：\n\
  \n```java\nif (emp1.equals(emp2))\n    System.out.println(\"These employees are\
  \ the same.\");\nelse\n    System.out.println(\"These are different employees.\"\
  );\n```\n\n在这里，使用 `emp1` 的 `equals` 方法来比较 `emp1` 和 `emp2`。默认情况下，`equals` 运算符返回的结果与相等运算符相同。所以，除非像下一节所说明的那样重写了\
  \ `equals` 方法，否则仅仅将 `==` 替换为 `equals` 方法没有任何影响。\n\n使用哪个对象的 `equals` 方法并不。。这里显示的\
  \ `if` 语句返回相同的结果：\n\n```java\nif (emp2.equals(emp1))\n    System.out.println(\"\
  These employees are the same.\");\nelse\n    System.out.println(\"These are different\
  \ employees.\");\n```\n\n注意，我说过这*不*重要。每当你重写 `equals` 方法时，你都应该确保比较在两个方向上都是有效的。然而，粗糙的编程有时会导致\
  \ `equals` 方法出现 `a 等于 b` 但 `b 不等于 a` 的情况。请保持警惕。\n\n## 重写 equals 方法\n\n你可以重写 `equals`\
  \ 方法，以便根据值对对象进行比较。从表面上看，你可能认为这很容易。你可能想为 `Employee` 类编写如下 `equals` 方法：\n\n```java\n\
  // 警告 -- 这段代码中有几个错误！\npublic boolean equals(Employee emp)\n{\n    if (this.getLastName().equals(emp.getLastName())\n\
  \    && this.getFirstName().equals(emp.getFirstName()))\n        return true;\n\
  \    else\n        return false;\n}\n```\n\n这段代码的基本问题——以及编写良好的 `equals` 方法的挑战——在于传递给\
  \ `equals` 方法的参数必须是一个 `Object`，而不是 `Employee`。这意味着 `equals` 方法必须准备好处理遇到的任何对象。例如，有人可能会尝试将一个\
  \ `Employee` 对象与一个 `Banana` 对象或 `null` 比较比较。`equals` 方法必须准备好处理所有可能性。\n\n具体来说，Java\
  \ API 文档说明，每当你重写 `equals` 方法时，必须确保 `equals` 方法满足五个特定条件。以下直接引自 API 文档的内容：\n\n- **它是自反的（reflexive）。**\
  \ 对于任何非空引用值 `x`，`x.equals(x)` 应该返回 `true`。\n- **它是对称的（symmetric）。** 对于任何非空引用值 `x`\
  \ 和 `y`，如果 `x.equals(y)` 为真，则 `y.equals(x)` 也必须为真。\n- **它是传递的（transitive）。** 对于任何非空引用值\
  \ `x`、`y` 和 `z`，如果 `x.equals(y)` 为真且 `y.equals(z)` 为真，则 `x.equals(z)` 必须为真。\n- **它是一致的（consistent）。**\
  \ 只要不修改用于比较的对象的信息，多次调用 `x.equals(y)` 将返回相同的结果。\n- **它是不为 null 的（non-null）。** 对于任何非空值\
  \ `x`，`x.equals(null)` 应该返回 `false`。\n\n听起来很复杂吗？幸运的是，它并没有看起来那么复杂。只要你处理好了其他规则，传递规则就会自动发生。只要你不在比较中引入\
  \ `Math.random()` 等调用，就不会有问题。\n\n这里是创建一个良好的 `equals` 方法的通用公式（假设参数名为 `obj`）：\n\n\
  1. **测试自反规则。**\n使用这样的语句：\n```java\nif (this == obj)\n    return true;\n```\n换句话说，如果有人傻到检查对象是否自己相等，它会返回\
  \ `true`。\n\n2. **测试非空规则。**\n使用这样的语句：\n```java\nif (this == null)\n    return false;\n\
  ```\nNull 不等于任何东西。\n\n3. **测试 obj 是否与此具有相同类型。**\n你可以使用 `getClass` 方法来实现，如下：\n```java\n\
  if (this.getClass() != obj.getClass())\n    return false;\n```\n如果两个对象的类型不同，它们就不可能是相同的。（初看起来这并不明显，但这个测试是为了满足对称规则——即如果\
  \ `x` 等于 `y`，则 `y` 也必须等于 `x`。）\n\n4. **将 obj 强制转换为你的类变量；然后比较你想要作为返回依据的字段，并返回结果。**\n\
  这是一个示例：\n```java\nEmployee emp = (Employee) obj;\nreturn this.lastName.equals(emp.getLastName())\n\
  && this.firstName.equals(emp.getFirstName());\n```\n注意，对 String 值的字段比较使用了 `equals`\
  \ 方法而不是 `==`。这是因为你不能信任 `==` 来比较字符串。如果你需要比较基本类型，可以使用 `==`。但你应该使用 `equals` 来比较字符串和任何其他引用类型。\n\
  \n将这一切整合在一起，列表 6-1 显示了一个通过正确构造的 `equals` 方法比较两个 `Employee` 对象的程序。\n\n**列表 6-1:**\
  \ **比较对象**\n\n```java\npublic class TestEquality2\n{\n    public static void main(String[]\
  \ args)\n    {\n        Employee emp1 = new Employee(\n        \"Martinez\", \"\
  Anthony\");\n        Employee emp2 = new Employee(\n        \"Martinez\", \"Anthony\"\
  );\n        if (emp1.equals(emp2))\n            System.out.println(\n```\n\n\n\n\
  \n\n```java\n        \"These employees are the same.\");\n\nelse\n\n    System.out.println(\n\
  \        \"These are different employees.\");\n    }\n}\n\nclass Employee\n{\n \
  \   private String lastName;\n    private String firstName;\n\n    public Employee(String\
  \ lastName, String firstName)\n    {\n        this.lastName = lastName;\n      \
  \  this.firstName = firstName;\n    }\n\n    public String getLastName()\n    {\n\
  \        return this.lastName;\n    }\n\n    public String getFirstName()\n    {\n\
  \        return this.firstName;\n    }\n\n    public boolean equals(Object obj)\n\
  \    {\n        // an object must equal itself\n        if (this == obj)\n     \
  \       return true;\n        // no object equals null\n        if (this == null)\n\
  \            return false;\n        // objects of different types are never equal\n\
  \        if (this.getClass() != obj.getClass())\n            return false;\n   \
  \     // cast to an Employee, then compare the fields\n        Employee emp = (Employee)\
  \ obj;\n        return this.lastName.equals(emp.getLastName())\n            && this.firstName.equals(emp.getFirstName());\n\
  \    }\n}\n```\n\n以下是此列表中的一些值得注意的点：\n\n- 创建了一个名为 `Anthony Martinez` 的 `Employee`\
  \ 对象。\n- 创建了另一个名为 `Anthony Martinez` 的 `Employee` 对象。\n- 使用 `equals` 方法比较这两个 `Employee`\
  \ 对象。\n- **18** `Employee` 类。\n- **39** 重写的 `equals` 方法。\n- **42** 如果比较的是相同的对象实例，则返回\
  \ `true`。这满足第一个等价性测试：对象必须始终等于它自己。\n- **46** 如果被比较的对象为 `null`，则返回 `false`。这满足最后一个等价性测试：没有任何东西等于\
  \ `null`。\n- **50** 如果被比较的对象类型不正确，则返回 `false`。这有助于确保对称性测试：如果 `x` 等于 `y`，则 `y` 必须等于\
  \ `x`。\n- **54** 在跳过其他测试后，你可以假设你正在比较两个不同的 `Employee` 对象，因此下一步是将另一个对象转换为 `Employee`。\n\
  - **55** 将另一个对象转换为 `Employee` 后，将比较两个字段（`lastName` 和 `firstName`），并返回复合比较的结果。\n\n\
  ### `clone` 方法\n\n*克隆*（cloning）指的是创建对象完全相同副本的过程。遗憾的是，在像 `Java` 这样面向对象的语言中，这个过程被证明是一项相当困难的任务。你可能认为克隆像这字节简单：\n\
  \n```java\nEmployee emp1 = new Employee(\"Stewart\", \"Martha\");\nEmployee emp2\
  \ = emp1;\n```\n\n然而，这段代码并没有创建 `Employee` 对象的拷贝。相反，你现在有两个引用同一个对象的变量，这通常不是你想要的。假设你执行了这些语句：\n\
  \n```java\nemp1.setLastName(\"Washington\");\nemp2.setLastName(\"Graham\");\nString\
  \ lastName = emp1.getLastName();\n```\n\n在执行这些语句后，`lastName` 返回 `Washington` 还是\
  \ `Graham`？正确答案是 `Graham`，因为 `emp1` 和 `emp2` 都指向同一个 `Employee` 对象。\n\n相比之下，`clone`\
  \ 是一个完全全新的对象，具有与原始对象相同的值。通常你可以使用像下面的代码手动创建一个克隆：\n\n```java\nEmployee emp1 = new\
  \ Employee(\"Stewart\", \"Martha\");\nEmployee emp2 = new Employee();\nemp2.setLastName(emp1.getLastName());\n\
  emp2.setFirstName(emp1.getFirstName());\nemp2.setSalary(emp1.getSalary());\n```\n\
  \n这里创建了一个新的 `Employee` 对象，它的字段被设置为与原始对象相同的值。\n\nJava 提供了一种更优雅的方式来创建对象拷贝：`clone`\
  \ 方法，它对所有类都可用，因为它继承自 `Object` 类。然而，正如你在接下来的章节中发现的，`clone` 方法可能很难创建和使用。出于这个原因，你只想对那些你认为能从克隆中真正受益的类实现它。\n\
  \n### 实现 `clone` 方法\n\n`clone` 方法由 `Object` 类定义，因此对所有 `Java` 类都可用，但 `clone` 在 `Object`\
  \ 类中被声明为 `protected` 访问权限。因此，给定类的 `clone` 方法仅在类类内部可用。如果你想让其他对象能够克隆你的对象，你必须重写 `clone`\
  \ 方法并赋予它 `public` 访问权限。\n\n注意，`Object` 类定义的 `clone` 方法返回 `Object` 类型。这完全合理，因为 `Object`\
  \ 类并不知道你将在哪个类中重写 `clone` 方法类型。返回 `Object` 的一个不便副作用是，每当你调用重写了 `clone` 的类的 `clone`\
  \ 方法时，你必须将结果转换为所需的对象类型。\n\n列表 6-2 提供了一个克隆 `Employee` 对象的简单示例。简而言之，该程序重写了 `Employee`\
  \ 类的 `clone` 方法：它创建了一个 `Employee` 对象，克隆它，更改原始 `Employee` 对象的名称，并将两个对象打印到控制台。\n\n\
  **列表 6-2：克隆示例**\n\n```java\npublic class CloneTest\n{\n    public static void main(String[]\
  \ args)\n    {\n        Employee emp1 = new Employee(\"Martinez\", \"Anthony\");\n\
  \        emp1.setSalary(40000.0);\n        Employee emp2 = (Employee)emp1.clone();\n\
  \        emp1.setLastName(\"Smith\");\n        System.out.println(emp1);\n     \
  \   System.out.println(emp2);\n    }\n}\n\nclass Employee\n{\n    private String\
  \ lastName;\n    private String firstName;\n    private Double salary;\n\n    public\
  \ Employee(String lastName, String firstName)\n    {\n        this.lastName = lastName;\n\
  \        this.firstName = firstName;\n    }\n\n    public String getLastName()\n\
  \    {\n        return this.lastName;\n    }\n\n    public void setLastName(String\
  \ lastName)\n    {\n        this.lastName = lastName;\n    }\n\n    public String\
  \ getFirstName()\n    {\n        return this.firstName;\n    }\n\n    public void\
  \ setFirstName(String firstName)\n    {\n        this.firstName = firstName;\n \
  \   }\n\n    public Double getSalary()\n    {\n        return this.salary;\n   \
  \ }\n\n    public void setSalary(Double salary)\n    {\n        this.salary = salary;\n\
  \    }\n\n    public Object clone()\n    {\n        Employee emp;\n        emp =\
  \ new Employee(this.lastName, this.firstName);\n        emp.setSalary(this.salary);\n\
  \        return emp;\n    }\n\n    public String toString()\n    {\n        return\
  \ this.getClass().getName() + \"[\"\n            + this.firstName + \" \"\n    \
  \        + this.lastName + \", \"\n            + this.salary + \"]\";\n    }\n}\n\
  ```\n\n当你运行此程序时，控制台会显示以下内容：\n\n`Employee[Anthony Smith, 40000.0]`\n`Employee[Anthony\
  \ Martinez, 40000.0]`\n\n可以看出，第二个 `Employee` 对象的名称被成功更改，而没有影响第一个 `Employee` 对象的名称。\n\
  \n以下段落引导你注意该程序的一些亮点：\n\n- **5** 创建了名为 Anthony Martinez 的第一个 `Employee` 对象。\n- **7**\
  \ 设置 Martinez 先生的工资。\n- **8** 为 Martinez 先生创建一个 `Employee` 副本。注意返回值必须转换为 `Employee`，因为\
  \ `clone` 方法的返回值是 `Object`。\n- **9** 更改第二个 `Employee` 对象的姓。\n- **10** 打印第一个 `Employee`\
  \ 对象。\n- **11** 打印第二个 `Employee` 对象。\n\n\n\n\n在在上的示例中，`clone` 方法手动创建了原始对象的副本并返回它。在许多情况下，这是创建克隆最简单的方法。但如果你的类有数百个或更多需要复制的字段怎么办？遗忘复制其中一个字段的概率很高，而且如果你以后向类中添加了字段，你可能会忘记修改\
  \ `clone` 方法以包含该新字段。\n\n幸运的是，你可以通过在自己的 `clone` 方法中直接使用 `Object` 类的 `clone` 方法来解决这个问题。`Object`\
  \ 类的 `clone` 方法可以自动创建你的对象的副本，该副本包含所有原始类型字段（如 `int` 和 `double`）的副本，以及不可变引用类型的拷贝——最显著的是字符串（strings）。因此，如果你的类中的所有字段都是原始类型或字符串，你就可以使用\
  \ `Object` 类提供的 `clone` 方法来克隆你的类。\n\n这种类型的克隆被称为**浅拷贝**（shallow copy），原因我将在下一节中解释。\n\
  \n要在你自己的 `clone` 方法中调用 `clone` 方法，只需指定 `super.clone()` 即可。但在此之前，你必须做两件事：\n\n- 声明该类支持\
  \ `Cloneable` 接口。`Cloneable` 接口是一个标记接口（tagging interface），它不提供任何方法。它只是标记一个类适用于克隆。\n\
  - 将对 `super.clone()` 的调用封装在一个捕获 `CloneNotSupportedException` 异常的 `try/catch` 语句中。如果你尝试对没有实现\
  \ `Cloneable` 接口的类调用 `clone`，就会抛出此异常。只要你实现了 `Cloneable`，这个异常就不会发生，但由于 `CloneNotSupportedException`\
  \ 是受检异常，你必须捕获它。\n\n这是一个这是一个类的示例，它使用 `super.clone()` 来克隆自己：\n\n```java\nclass Employee\
  \ implements Cloneable\n{\n    // 省略了字段和方法...\n    public Object clone()\n    {\n\
  \        Employee emp;\n        try\n        {\n            emp = (Employee) super.clone();\n\
  \        }\n        catch (CloneNotSupportedException e)\n        {\n          \
  \  return null; // 永远发生\n        }\n        return emp;\n    }\n}\n```\n\n注意，此方法不需要感知\
  \ `Employee` 类中声明的任何字段。然而，此 `clone` 方法仅适用于所有字段均为原始类型或不可变对象（如字符串）的类。\n\n#### 创建深拷贝\n\
  \n类中的某些字段实际上是其他对象的情况并不罕见。例如，`Employee` 类可能有一个类型为 `Address` 的字段，用于存储每个员工的地址：\n\n\
  ```java\nclass Employee\n{\n    public Address address;\n    // 省略了其他字段和方法\n}\n\
  ```\n\n如果是如此，`super.clone()` 方法将不会创建对象的完整拷贝。克隆对象不会获得 `address` 字段的克隆。相反，它拥有与原始对象相同的地址对象的引用。\n\
  \n为了解决这个问题，你必须对 `Employee` 对象进行**深拷贝**。深拷贝是指主对象中的任何子对象也被克隆的克隆。为了实现这一目标，`clone` 方法首先调用\
  \ `super.clone()` 来创建对象的浅拷贝。然后，它调用主对象包含的每个子对象的 `clone` 方法，以创建这些对象的克隆。（当然，为了使深拷贝生效，这些对象也必须支持\
  \ `clone` 方法。）\n\n列表 6-3 显示了一个示例。在这里，`Employee` 类包含一个名为 `address` 的公共字段，该字段持有 `Address`\
  \ 类的实例。如你所示，`Employee` 类的 `clone` 方法创建 `Employee` 对象的浅拷贝，然后将拷贝的 `address` 字段设置为原始对象\
  \ `address` 字段的克隆。为了使这个示例生效，`Address` 类也重写了 `clone` 方法。它的 `clone` 方法调用 `super.clone()`\
  \ 来创建 `Address` 对象的浅拷贝。\n\n#### 列表 6-3：创建深拷贝\n\n```java\npublic class CloneTest2\n\
  {\n    public static void main(String[] args)\n    {\n        Employee emp1 = new\
  \ Employee(\"Martinez\", \"Anthony\");\n        emp1.setSalary(40000.0);\n     \
  \   emp1.address = new Address(\"1300 N. First Street\", \"Fresno\", \"CA\", \"\
  93702\");\n        Employee emp2 = (Employee)emp1.clone();\n        System.out.println(\"\
  **** after cloning ****\\n\");\n        printEmployee(emp1);\n        printEmployee(emp2);\n\
  \        emp2.setLastName(\"Smith\");\n        emp2.address = new Address(\"2503\
  \ N. 6th Street\", \"Fresno\", \"CA\", \"93722\");\n        System.out.println(\"\
  **** after changing emp2 ****\\n\");\n        printEmployee(emp1);\n        printEmployee(emp2);\n\
  \    }\n\n    private static void printEmployee(Employee e)\n    {\n        System.out.println(e.getFirstName()\
  \ + \" \" + e.getLastName());\n        System.out.println(e.address.getAddress());\n\
  \        System.out.println(\"Salary: \" + e.getSalary());\n    }\n}\n\nclass Employee\
  \ implements Cloneable\n{\n    private String lastName;\n    private String firstName;\n\
  \    private Double salary;\n    public Address address;\n\n    public Employee(String\
  \ lastName, String firstName)\n    {\n        this.lastName = lastName;\n      \
  \  this.firstName = firstName;\n    }\n\n    public String getFirstName()\n    {\n\
  \        return firstName;\n    }\n\n    public void setFirstName(String firstName)\n\
  \    {\n        this.firstName = firstName;\n    }\n\n    public String getLastName()\n\
  \    {\n        return lastName;\n    }\n\n    public void setLastName(String lastName)\n\
  \    {\n        this.lastName = lastName;\n    }\n\n    public Double getSalary()\n\
  \    {\n        return salary;\n    }\n\n    public void setSalary(Double salary)\n\
  \    {\n        this.salary = salary;\n    }\n\n    public Object clone()\n    {\n\
  \        Employee emp;\n        try\n        {\n            emp = (Employee) super.clone();\n\
  \        }\n        catch (CloneNotSupportedException e)\n        {\n          \
  \  return null;\n        }\n        emp.address = (Address) address.clone();\n \
  \       return emp;\n    }\n}\n\nclass Address implements Cloneable\n{\n    private\
  \ String street;\n    private String city;\n    private String state;\n    private\
  \ String zipCode;\n\n    public Address() {}\n\n    public Address(String street,\
  \ String city, String state, String zipCode)\n    {\n        this.street = street;\n\
  \        this.city = city;\n        this.state = state;\n        this.zipCode =\
  \ zipCode;\n    }\n\n    public String getAddress()\n    {\n        return street\
  \ + \"\\n\" + city + \", \" + state + \" \" + zipCode;\n    }\n\n    public Object\
  \ clone()\n    {\n        try\n        {\n            return super.clone();\n  \
  \      }\n        catch (CloneNotSupportedException e)\n        {\n            return\
  \ null;\n        }\n    }\n}\n```\n\n`CloneTest2` 类中的 `main` 方法创建了一个 `Employee`\
  \ 对象并设置了姓名、薪水和地址。然后它创建了该对象的克隆并打印了包含的数据。接下来，它更改了第二个员工的姓和地址，并再次打印数据。以下是运行该程序时产生的输出：\n\
  \n```\n**** after cloning ****\n\nAnthony Martinez\n1300 N. First Street\nFresno,\
  \ CA 93702\nSalary: 40000.0\nAnthony Martinez\n1300 N. First Street\nFresno, CA\
  \ 93702\nSalary: 40000.0\n**** after changing emp2 ****\n\nAnthony Martinez\n1300\
  \ N. First Street\nFresno, CA 93702\nSalary: 40000.0\nAnthony Smith\n2503 N. 6th\
  \ Street\nFresno, CA 93722\nSalary: 40000.0\n```\n\n正如你看到的，两个 `Employee` 对象在克隆后数据是相同的，但在更改了第二个对象的字段后，它们的数据就不同了。因此，你可以安全地更改一个对象的数据而不会影响另一个\n\
  \n\n\n\n影响另一个对象。\n\n以下段落描述了此程序的一些亮点：\n\n→ **5** 创建一个名为 Anthony Martinez 的员工。\n\n\
  → **8** 设置员工的地址。\n\n→ **11** 克隆该员工（行吧，只是克隆对象，不是克隆同事）。\n\n→ **13** 在克隆后打印两个 `Employee`\
  \ 对象。它们应该具有相同的数据。\n\n→ **18** 修改第二个员工的名字。\n\n→ **19** 修改第二个员工的地址。\n\n→ **23** 在修改第二个员工的数据后，打印两个\
  \ `Employee` 对象。现在这两个对象应该具有不同的数据。\n\n# 第 6 章使用对象类和 Class 类\n\n→ **30** 一个实用方法，用于打印\
  \ `Employee` 对象的数据。\n\n→ **40** `Employee` 类。注意该类实现了 `Cloneable` 接口。\n\n→ **46**\
  \ 地址 字段，它持有一个类型为 `Address` 的对象。\n\n→ **85** `Employee` 类中的 `clone` 方法。\n\n→ **90**\
  \ 创建 `Employee` 对象的浅拷贝。\n\n→ **91** 创建 `Address` 对象的浅拷贝，并将其赋值给克隆的 `Employee` 对象的\
  \ `address` 字段。\n\n→ **93** 捕获 `CloneNotSupportedException`，这永远不会发生，因为类实现了 `Cloneable`。编译器在此处要求\
  \ `try/catch` 语句，因为 `CloneNotSupportedException` 是一个检查异常。\n\n→ **97** 返回克隆的 `Employee`\
  \ 对象。\n\n→ **109** `Address` 类，它也实现了 `Cloneable`。\n\n→ **133** `Address`类的 `clone`\
  \ 方法。\n\n→ **137** 返回 `Address` 对象的浅拷贝。\n\n### Class 类\n\n好了，同学们，是时候学习本章的最后一门类了：`Class`\
  \ 类。这个措辞可能会让人困惑，所以请动动你们脑筋。\n\nJava 程序所使用的每个类在内存中都由一个 `Class` 类型的对象表示。例如，如果你的程序使用了\
  \ `Employee` 对象，那么也会有一个对应 `Employee` 类的 `Class` 对象。这个 `Class` 对象包含的信息不是关于特定员工的，而是关于\
  \ `Employee` 类本身的信息。\n\n你已经看到如何通过使用 `getClass` 方法来获取 `Class` 对象。该方法是由 `Object` 类定义的，因此每个对象都可以使用。这里有一个例子：\n\
  \n```java\nEmployee emp = new Employee();\nClass c = emp.getClass();\n```\n\n注意，在调用\
  \ `getClass` 方法之前，你必须用一个对象实例初始化变量。这是因为 `getClass` 方法返回的是与变量所引的对象类型相对应的 `Class` 对象，而不是变量声明时指定的类型。\n\
  \n假设有一个 `HourlyEmployee` 类继承了 `Employee` 类。现在考虑以下语句：\n\n```java\nHourlyEmployee\
  \ emp = new Employee();\nClass c = emp.getClass();\n```\n\n在这里，`c` 指向的是 `HourlyEmployee`\
  \ 类的 `Class` 对象，而不是 `Employee` 类。\n\n`Class` 类有 50 多个方法，但只有其中 2 个值得你关注：\n\n- `getName()`：返回一个表示类名的\
  \ `String`。\n- `getSuperclass()`：返回另一个表示该 `Class` 对象父类的 `Class` 对象。\n\n如果你对 `Class`\
  \ 类的其他功能感兴趣，可以随时在 Java API 文档中查看。\n\n`getClass` 方法最常用的用途之一是通过比较它们的 `Class` 对象来判断两个对象是否为同一类型。这之所以有效，是因为\
  \ Java 保证对于应用程序使用的每个不同类，`Class` 对象只有一个实例。因此，即使你的应用程序实例化了 1,000 个 `Employee` 对象，对于\
  \ `Employee` 类也只有一个 `Class` 对象。\n\n结果是，以下代码可以判断两个对象是否为相同类型的对象：\n\n```java\nObject\
  \ o1 = new Employee();\nObject o2 = new Employee();\nif (o1.getClass() == o2.getClass())\n\
  \    System.out.println(\"They're the same.\");\nelse\n    System.out.println(\"\
  They are not the same.\");\n```\n\n在这种情况下，两个对象的类型都是 `Employee`，所以比较结果为真。\n\n要判断一个对象是否是特定类型，使用对象的\
  \ `getClass` 方法获取对应的 `Class` 对象。然后使用 `getName` 方法获取类名，并使用字符串比较来检查类名。这是一个示例：\n\n\
  ```java\nif (emp.getClass().getName().equals(\"Employee\"))\n    System.out.println(\"\
  This is an employee object.\");\n```\n\n如果这一连串的方法调用让你头疼，你可以将代码拆分：\n\n```java\nClass\
  \ c = emp.getClass();\nString s = c.getName();\nif (s.equals(\"Employee\"))\n  \
  \  System.out.println(\"This is an employee object.\");\n```\n\n结果是相同的。\n\n## 本章内容\n\
  - 使用内部类\n- 创建静态内部类\n- 实现匿名类\n- 添加 Lambda 表达式\n\n# 第 7 章使用内部类、匿名类和 Lambda 表达式\n\n\
  在本章中，你将了解到如何使用三种高级类类型：内部类、静态内部类和匿名内部类。这三种类型在某些情况下都是很有用的。特别是内部类和匿名内部类常与 Swing 使用。关于\
  \ Swing 的更多信息，请参考第 6 章。在本章中，我将重点介绍这些类型类的机制。你还将学习 Java 8 引入的一个特性，即 lambda 表达式，它简化了创建匿名类的任务。\n\
  \n\n\n\n偶尔，内部类中的代码需要引用其外部类的实例。要实现这一点，你需要列出外部类的名称，后面紧跟点运算符和 `this`。例如，如果外部类命名为 `MyOuterClass`，你将使用\
  \ `MyOuterClass.this` 来引用外部类的实例。\n\n#### 查看示例\n\n第 3 卷第 5 章介绍了一个使用 `Swing` 包中 `Timer`\
  \ 类（`javax.swing.Timer`）的应用程序，该程序每隔一秒在控制台上显示 `Tick...` 和 `Tock...`。它使用了一个名为 `Ticker`\
  \ 的类，该类实现了 `ActionListener` 接口以处理 `Timer` 对象的计时事件。\n\n在本章中，你会看到该应用程序三个版本。如果你不清楚该应用程序如何使用\
  \ `Timer` 类显示 `Tick...` 和 `Tock...` 消息，或者为什么需要 `JOptionPane` 对话框，你可能想快速回顾第 3 卷第\
  \ 5 章。\n\n列表 7-1 显示了该应用程序的版本，它将 `Ticker` 类实现为内部类。\n\n### 列表 7-1：使用内部类的 Tick Tock\n\
  \n```java\nimport java.awt.event.*;\nimport javax.swing.*;\n\npublic class TickTockInner\n\
  {\n    private String tickMessage = \"Tick...\";\n    private String tockMessage\
  \ = \"Tock...\";\n\n    public static void main(String[] args)\n    {\n        TickTockInner\
  \ t = new TickTockInner();\n        t.go();\n    }\n\n    private void go()\n  \
  \  {\n        // 创建一个定时器，每隔一秒\n        // 调用一次 Ticker 类\n        Timer t = new Timer(1000,\
  \ new Ticker());\n        t.start();\n        // 显示消息框以防止程序\n        // 立即结束\n \
  \       JOptionPane.showMessageDialog(null,\n        \"Click OK to exit program\"\
  );\n        System.exit(0);\n    }\n}\n\n// (续)\nclass Ticker implements ActionListener\n\
  {\n    private boolean tick = true;\n    public void actionPerformed(ActionEvent\
  \ event)\n    {\n        if (tick)\n        {\n            System.out.println(tickMessage);\n\
  \        }\n        else\n        {\n            System.out.println(tockMessage);\n\
  \        }\n        tick = !tick;\n    }\n}\n```\n\n接下来的段落描述了程序的的一些亮点：\n\n名为 `tickMessage`\
  \ 和 `tockMessage` 的 `String` 变量（第 7 行）包含要在控制台上打印的消息。请注意，这些变量被定义为外部类的字段。正如你将看到的，内部类\
  \ `Ticker` 能够直接访问这些字段。\n\n## 观察者模式\n\nJava 中的事件监听器是 Java 一个名为“委托事件模型”（Delegation\
  \ Event Model）的模型的一部分，它是更通用的设计模式——“观察者模式”（Observer pattern）的实现。当其中一个对象的状态发生变化，并且你需要创建相互交互的对象时，这种模式非常有用。被监控变化的对象称为“可观察对象”（observable\
  \ object），而监控这些变化的对象称为“观察者对象”（observer object）。观察者对象向可观察对象注册自己，后者在状态改变时就会通知观察者对象。\n\
  \n你将在第 6 卷中发现更多关于 Java 如何实现这种模式来处理事件。但如果你感兴趣，可能想研究 Java API 部分的 `Observer` 和 `Observable`\
  \ 接口。它们提供了创建观察者模式简单实现的标准方法。\n\n由于内部类只能由实例对象使用，因此你不能直接从静态 `main` 方法中使用它。结果，程序中的 `main`\
  \ 方法简单地创建了应用程序类（`TickTockInner`）的实例。这一行执行了 `TickTockInner` 类新实例的 `go` 方法。第 11 行和第\
  \ 12 行使用的技术是一种常见的编程技术，它允许应用程序快速离开静态上下文并进入面向对象的模式。\n\n这一行是从第 12 行调用的 `go` 方法。此行创建了一个\
  \ `Timer` 类的实例，并将定时器间隔设置为 1,000 毫秒（1 秒），并将 `ActionListener` 设置为名为 `Ticker` 的内部类的新实例。在这里，使用\
  \ `JOptionPane` 类来显示对话框。这个对话框对于给定时器运行的机会是必要的。当用户点击 OK 时应用程序结束。\n\n此行调用了 `System`\
  \ 类的 `exit` 方法，它会立即关闭 Java 虚拟机。在这里此方法调用并不是严格要求的，但如果你漏掉它，在你点击 OK 后，定时器会继续运行几秒，然后\
  \ JVM 才会意识到应该杀死定时器。\n\n这一行是名为 `Ticker` 的内部类的声明。注意，该类实现了 `ActionListener` 接口。`Timer`\
  \ 对象每 1,000 毫秒调用一次 `actionPerformed` 方法。在这一行和第 41 行，内部类直接访问了外部类的字段。\n\n#### 使用静态内部类\n\
  \n`static inner class`静态内部类）与内部类类似，但它不需要外部类的实例。它的基本形式如下：\n\n```java\nclass outerClassName\n\
  {\n    private static class innerClassName\n    {\n        // 内部类体\n    }\n}\n```\n\
  \n与静态方法一样，静态内部类无法访问外部类中的任何非静态字段或方法。然而，它可以访问静态字段或方法。列表 7-2 显示了应用程序的版本，它使用了静态内部类而不是普通的内部类。\n\
  \n### 列表 7-2：使用静态内部类的 Tick Tock\n\n```java\nimport java.awt.event.*;\nimport javax.swing.*;\n\
  \npublic class TickTockStatic\n{\n    private static String tickMessage = \"Tick...\"\
  ;\n    private static String tockMessage = \"Tock...\";\n\n    public static void\
  \ main(String[] args)\n    {\n        TickTockStatic t = new TickTockStatic();\n\
  \        t.go();\n    }\n\n    private void go()\n    {\n        // 创建一个定时器，每隔一秒\n\
  \        // 调用一次 Ticker 类\n        Timer t = new Timer(1000, new Ticker());\n  \
  \      t.start();\n        // 显示消息框以防止程序\n        // 立即结束\n        JOptionPane.showMessageDialog(null,\n\
  \        \"Click OK to exit program\");\n        System.exit(0);\n    }\n\n    static\
  \ class Ticker implements ActionListener\n    {\n        private boolean tick =\
  \ true;\n        public void actionPerformed(ActionEvent event)\n        {\n   \
  \         if (tick)\n            {\n                System.out.println(tickMessage);\n\
  \            }\n            else\n            {\n                System.out.println(tockMessage);\n\
  \            }\n            tick = !tick;\n        }\n    }\n}\n```\n\n此版本的应用程序与列表\
  \ 7-1 版本只有三个区别：\n\n- `tickMessage` 字段被声明为 `static`。这是为了让静态类能够访问它的必要的。\n- `tockMessage`\
  \ 字段也被声明为 `static`。\n- `Ticker` 类被声明为 `static`。\n\n## 使用匿名内部类\n\n*Anonymous inner\
  \ classes*（通常直接称为 *anonymous classes*）可能是 Java 语言中最奇怪的特性之一。当你第一次看到匿名类时，你几乎会认为有人犯了错误，代码根本无法编译。但它确实可以编译，而且运行良好。当你学会了如何使用匿名类后，你会怀疑自己以前是如何没有它们的情况下过来的。\n\
  \n匿名类是在你想要实例化的地方就地定义的类。因为你是在需要的地方直接编写类体，所以你不需要给它起名字。（这就是为什么它被称为*匿名*类。）\n\n### 创建匿名内部类\n\
  \n声明和实例化匿名类的基本形式如下：\n\n```java\nnew ClassOrInterface() { *class-body* }\n```\n\n\
  \n\n\n# 第 7 章 使用内部类、匿名类和 Lambda 表达式\n\n如你所见，你指定 `new` 关键字，后面跟着类或接口的名称，该名称指定了从匿名类创建的对象的类型。该类或接口名称后面跟着括号，括号可能包含传递给匿名类构造函数的参数列表。然后你编写一个用大括号括起来的类体。这个类体可以包含普通类体可以包含的内容：字段、方法，甚至是其他的类或接口。\n\
  \n这里有一个简单的匿名类示例：\n\n```java\npublic class AnonClass\n{\n    public static void main(String[]\
  \ args)\n    {\n        Ball b = new Ball()\n        {\n            public void\
  \ hit()\n            {\n                System.out.println(\"You hit it!\");\n \
  \           }\n        };\n        b.hit();\n    }\n    interface Ball\n    {\n\
  \        void hit();\n    }\n}\n```\n\n在这个示例中，我创建了一个名为 `Ball` 的接口，它有一个名为 `hit` 的方法。然后，在\
  \ `main` 方法中，我声明了一个类型为 `Ball` 的变量，并使用匿名类来创建一个对象。匿名类的体包含 `hit` 方法的实现，该方法只是在控制台上显示消息\
  \ `You hit it!`。在匿名类实例化并赋值给变量 `b` 之后，下一条语句调用了 `hit` 方法。\n\n当你运行此程序时，控制台上会显示单行 `You\
  \ hit it!`。\n\n在使用匿名类时，有几点需要思考：\n\n- » 你不能为匿名类创建构造函数，因为匿名类没有名称。无论如何，你给构造函数起什么名字呢？\n\
  - » 如果匿名类是基于接口，你就无法传递参数。这是合理的；接口没有构造函数，所以 Java 没有地方可以传递这些参数。\n- » 赋值语句可以像本示例所示使用匿名类。在这种情况下，匿名类体后面跟着一个分号，标记赋值语句的结束。注意，这个分号是赋值语句的一部分，而不是匿名类的一部分。（在下一节中，你将看到一个作为方法参数传递的匿名类示例。在那个示例中，类体后面没有分号。）\n\
  - » 匿名类是类特殊的内部类；像任何内部类一样，它自动可以访问其外部类的字段和方法。\n- » 匿名类不能是静态的。\n\n## 使用匿名类创建程序\n\n\
  列表 7-3 显示了一个更复杂的匿名类示例：`Tick Tock` 应用程序的一个版本，它使用匿名类作为定时器的动作监听器。\n\n**列表 7-3：带有匿名类的\
  \ Tick Tock**\n\n```java\nimport java.awt.event.*;\nimport javax.swing.*;\n\npublic\
  \ class TickTockAnonymous\n{\n    private String tickMessage = \"Tick...\";\n  \
  \  private String tockMessage = \"Tock...\";\n\n    public static void main(String[]\
  \ args)\n    {\n        TickTockAnonymous t = new TickTockAnonymous();\n       \
  \ t.go();\n    }\n\n    private void go()\n    {\n        // 创建一个定时器，每隔一秒\n    \
  \    // 调用 Ticker 类\n        Timer t = new Timer(1000,\n            new ActionListener()\n\
  \            {\n                private boolean tick = true;\n\n               \
  \ public void actionPerformed(ActionEvent event)\n                {\n          \
  \          if (tick)\n                    {\n                        System.out.println(tickMessage);\n\
  \                    }\n                    else\n                    {\n      \
  \                  System.out.println(tockMessage);\n                    }\n   \
  \                 tick = !tick;\n                }\n            } );\n        t.start();\n\
  \        // 显示一个消息框以防止\n        // 程序立即结束\n        JOptionPane.showMessageDialog(null,\n\
  \                \"Click OK to exit program\");\n        System.exit(0);\n    }\n\
  }\n```\n\n到目前，你已经看到了足够版本的程序，应该理解它是如何工作的。接下来的段落解释了该版本如何使用匿名类作为提供给 `Timer` 构造函数的 `ActionListener`\
  \ 参数：\n\n- 匿名类无法在静态上下文，因此 `main` 方法创建了 `TickTockAnonymous` 类的实例并执行了 `go` 方法。\n-\
  \ 在 `go` 方法中，创建了 `Timer` 类的实例。\n- `Timer` 构造函数的第二个参数是一个实现了 `ActionListener` 接口的对象。该对象在这里通过匿名类创建。`ActionListener`\
  \ 被指定为该类的类型。\n- 这个左括号标记了匿名类体的开始。\n- 定时器每 1,000 毫秒调用一次 `actionPerformed` 方法。注意，此方法可以自由访问在外部类中定义的字段。\n\
  - 这一行的右括号标记了匿名类体的结束。然后右括号标记了 `Timer` 构造函数参数列表的结束。与此右括号对应的左括号在第 19 行。最后，分号标记了赋值语句的结束。\n\
  \n## Lambda 表达式\n\nJava 8 引入了一个新功能，它在某些方面与匿名类相似，但语法更简洁。更具体地说，Lambda 表达式允许你创建一个实现特定类型接口的匿名类，这种接口被称为“函数式接口”（functional\
  \ interface）——它有且抽象方法。上一节介绍的 `Ball` 接口符合该定义：\n\n```java\ninterface Ball\n{\n   \
  \ void hit();\n}\n```\n\n这里的抽象方法是 `hit` 方法。\n\n在 Java 8 之前，这是不可能的，因为接口只能包含抽象方法。然而在\
  \ Java 8 中你可以创建默认方法来提供默认实现。因此，函数式接口可以包含一个或多个默认方法，但只能包含一个抽象方法。（关于默认方法的更多信息，请参考本书的第\
  \ 5 章。）\n\nLambda 表达式是创建实现函数式接口的匿名类的简洁方式。你不需要提供包含返回类型、方法名、参数类型和方法体的正式方法声明，你只需要定义参数类型和方法体。Java\
  \ 编译器会根据你使用 Lambda 表达式的上下文推断其余部分。\n\n参数类型通过一个新运算符与方法体分离，该运算符被称为箭头，由一个连字符和一个大于号组成。这里有一个实现\
  \ `Ball` 接口的示例：\n\n```java\n() -> { System.out.println(\"You hit it!\"); }\n```\n\
  \n这里的 Lambda 表达式实现了一个不接受参数的单一方法。当调用该方法时，会打印文本 `You hit it!`。\n\n你可以在可以使用普通 Java\
  \ 表达式的地方使用 Lambda 表达式。你会在赋值语句或作为参数中使用它们。唯一的限制是，你只能在需要函数式接口实例的上下文中使用 Lambda 表达式。例如，这里有一个使用\
  \ Lambda 表达式实现 `Ball` 接口的完整程序：\n\n```java\npublic class LambdaBall\n{\n    public\
  \ static void main(String[] args)\n    {\n        Ball b = () -> { System.out.println(\"\
  You hit it!\"); };\n        b.hit();\n    }\n    interface Ball\n    {\n       \
  \ void hit();\n    }\n}\n```\n\nLambda 表达式通用语法如下：\n\n```\n(parameters) -> expression\n\
  ```\n\n或者：\n\n```\n(parameters) -> { statement;...}\n```\n\n如果你使用表达式，则不需要分号。如果你使用一个或多个语句，则语句必须在大括号括起来，并且每个语句末尾都需要分号。\n\
  \n\n\n\n不要忘记，使用 lambda 表达式的语句本身必须以分号结尾。因此，在上一个示例中，lambda 表达式有两个靠得很近的分号：\n\n```\n\
  Ball b = () -> { System.out.println(\"You hit it!\"); };\n```\n\n第一个分号标记了调用 `System.out.println`\
  \ 语句的结束；第二个分号标记了将 lambda 表达式赋值给变量 `b` 的赋值语句的结束。\n\n# 第 8 章：包与新的 Java 模块系统\n\n本章将向你展示如何处理创建的类。具体来说，我将展示如何将类组织成整洁的包。包允许你将类与\
  \ Java API 中的类分开，允许你在其他应用程序中重用你的类，甚至可以将你的类分给他人。如果其他人对你的类感兴趣，你可能不想给他们发送所有的类文件，而是将它们打包到一个名为\
  \ `JAR` 的文件中。本章也将介绍了这一点。然后，我将展示如何使用一个名为 `JavaDocs` 的功能为你的类添加注释。通过 `JavaDocs`，你可以自动构建看起来专业的文档。当你把这些页面发布到网站时，你的朋友会认为你是一个\
  \ Java 大师。最后，我将向你展示如何使用 Java 9 的新功能 `Java Module System`，它提供了一种改进的包处理方式，避免了旧包系统的某些陷。\n\
  \n## 本章\n* 为你的类创建包\n* 将包存为 `JAR` 文件\n* 使用 `JavaDocs` 为你的类建模\n* 使用模块系统\n\n## 使用包\n\
  \n`package` 是一组在一起的类。如果没有包，整个 Java 类的世界将是一个巨大的混乱。想象一下，全世界程序员创建的数百万个 Java 类全部丢在一个大池子里。包允许你将这些内容组织成较小的、可管理的类集合。\n\
  \n#### 导入类和包\n\n在 Java 源文件的开头使用 `import` 语句时，你可以在整个文件中可以使用这些包。（我在第 1 章介绍过 `import`\
  \ 语句，但在这里重复一下也没有处。）\n\n`import` 语句可以使用通配符导入包中的所有类。在这里，`java.util` 包中的所有类都被导入了：\n\
  \n```\nimport java.util.*;\n```\n\n或者，你可以一个一个导入类。在这里，只有 `ArrayList` 类被导入了：\n\n```\n\
  import java.util.ArrayList;\n```\n\n注意：不需要使用 `import` 语句也可以使用包中的类。但如果不使用 `import`\
  \ 语句，你必须对类的引用进行*完全限定*。例如，你可以在不导入 `java.util` 的情况下使用 `ArrayList` 类：\n\n```\njava.util.ArrayList\
  \ = new java.util.ArrayList();\n```\n\n由于完全限定名非常麻烦，你应该始终使用 `import` 语句来导入应用程序使用的包或类。\n\
  \n你永远不需要显式导入两个包：\n\n* **`java.lang`**：此包包含了极其常用的类，Java 编译器让每个程序都可以。该包中的类示例有 `String`、`Exception`\
  \ 以及各种包装类，如 `Integer` 和 `Boolean`。\n* **默认包**：此包包含了没有专门放在某个包中的类。书中到为止的所有程序都依赖于默认包。\n\
  \n对于简单的程序开发和实验，使用默认包是可以的。但如果你开始编写严肃的 Java 应用程序，请创建一个单独包并将类放在那里。你将在下一节学习如何操作。\n\n\
  即使你想，也无法导入默认包。假设你有两个包——默认包和 `com.lowewriter.util` 包。默认包的代码包含语句 `import com.lowewriter.util.*`。这没关系。但默认包没有名字——至少没有你在程序内部使用的名字。`com.lowewriter.util`\
  \ 包的代码不能包含这样的语句：\n\n```\nimport that_default_package.you_know.the_one_with_name\n\
  ```\n\n#### 创建自己的包\n\n创建自己的包来存放类是简单的。嗯，至少相对来说。你必须经过以下步骤：\n\n1. **为你的包选择一个名字。**\n\
  你可以使用任何想要的名字，但我建议你遵循将互联网域名（如果有的话）反过来使用的既定惯例。我拥有名为 `LoweWriter.com` 的域名，所以我所有的包都使用\
  \ `com.lowewriter` 这个名字。（反过来域名可以确保你的包名是唯一的。）\n\n注意包名全小小写。这不是绝对要求，但它是你应该遵守的 Java\
  \ 惯例。如果你在包名中使用大写字母，你绝对是个反叛者。而且由于 Java 是大小敏感的，名为 `com.lowewriter` 的包与名为 `com.LoweWriter`\
  \ 的包是不同的包。\n\n如果你愿意，可以在域名之外添加额外的层级。例如，我将工具类放在名为 `com.lowewriter.util` 的包中。如果你没有自己的域名，尝试反过来使用你的电子邮件地址。例如，如果你的电子邮件地址是\
  \ `SomeBody@SomeCompany.com`，请使用 `com.somecompany.somebody` 作为包名。\n\n2. **在硬盘上选择一个目录作为你类库的根目录。**\n\
  你需要在硬盘上有一个地方存储你的类。我建议创建一个类似 `c:\\javaclasses` 的目录。这个文件夹将成为 Java 包的*根目录*。\n\n3. **在根目录下为你的包创建子目录。**\n\
  例如，对于包 `com.lowewriter.util`，在 `c:\\javaclasses` 目录下创建一个名为 `com` 的目录。然后，在 `com`\
  \ 目录下创建一个名为 `lowewriter` 的目录。接着，在 `lowewriter` 中创建一个名为 `util` 的目录。因此，包含 `com.lowewriter.util`\
  \ 包类的目录完整路径是 `c:\\javaclasses\\com\\lowewriter\\util`。\n\n4. **将包的根目录添加到 `ClassPath`\
  \ 环境变量中。**\n具体操作取决于你的操作系统。你可以通过双击控制面板中的“系统”设置 `ClassPath`。点击“高级”选项卡，然后点击“环境变量”。不要干扰\
  \ `ClassPath` 中已列出的任何目录。\n\n\n\n将你的根目录添加到 `ClassPath` 中，在 `ClassPath` 值的末尾添加一个分号并跟上你的根目录路径。例如，假设你的\
  \ `ClassPath` 已经设置如下内容：\n\n`;c:\\util\\classes`\n\n然后将其修改为如下形式：\n\n`;c:\\util\\\
  classes;c:\\javaclasses`\n\n在这里，我在 `ClassPath` 值的末尾添加了 `;c:\\javaclasses`。\n\n###\
  \ 5. 将任何想要放入特定包（package）的类文件保存到该包对应的目录下。\n\n例如，将属于 `com.lowewriter.util` 包的类文件保存到\
  \ `c:\\javaclasses\\com\\lowewriter\\util` 中。\n\n### 6. 在每个属于包的源文件开头添加包声明语句（package\
  \ statement）。\n\n包声明语句仅用于提供文件中任何类所所属的包名称。例如：\n\n`package com.lowewriter.util;`\n\
  \n包声明语句必须是文件中的第一个非注释的语句。\n\n#### 示例示例\n\n假设你开发了一个名为 `Console` 的工具类，它包含了一系列方便的静态方法，用于从控制台获取用户输入。例如，该类有一个名为\
  \ `askYorN` 的静态方法，可以从用户处获取 `Y` 或 `N` 并返回一个 `boolean` 值以表示用户输入的值。你决定将此类放在名为 `com.lowewriter.util`\
  \ 的包中，以便你和其他志同道合的程序员可以在自己的程序中使用它。\n\n以下是 `Console` 类的源文件：\n\n```java\npackage com.lowewriter.util;\n\
  \nimport java.util.Scanner;\n\npublic class Console\n{\n    static Scanner sc =\
  \ new Scanner(System.in);\n\n    public static boolean askYorN(String prompt)\n\
  \    {\n        while (true)\n        {\n            String answer;\n          \
  \  System.out.print(\"\\n\" + prompt + \" (Y or N) \");\n            answer = sc.next();\n\
  \            if (answer.equalsIgnoreCase(\"Y\"))\n                return true;\n\
  \            else if (answer.equalsIgnoreCase(\"N\"))\n                return false;\n\
  \        }\n    }\n}\n```\n\n好了，目前这个类只有一个方法（`askYorN`），但以后某天你还会向它添加许多其他有用方法。在此期间，你想要将其设置在包中，以便立即开始使用它。\n\
  \n因此，你创建一个名为 `c:\\javaclasses\\com\\lowewriter\\util` 的目录（如上一节所述），并将源文件保存到该目录。然后编译程序，使\
  \ `Console.class` 文件也存储在该目录中。最后，将 `c:\\javaclasses` 添加到你的 `ClassPath` 环境变量中。\n\n\
  现在你可以使用以下程序来测试你的包是否运行正常：\n\n```java\nimport com.lowewriter.util.*;\n\npublic class\
  \ PackageTest\n{\n    public static void main(String[] args)\n    {\n        while\
  \ (Console.askYorN(\"Keep going?\"))\n        {\n            System.out.println(\"\
  D'oh!\");\n        }\n    }\n}\n```\n\n在这里，`import` 语句导入了 `com.lowewriter.util`\
  \ 包中的所有类。然后，`main` 方法中的 `while` 循环会反复询问用户是否想继续。\n\n字体 将你的类放入 JAR 文件\n\n`JAR 文件`\
  \ 是一个单文件，可以包含多个压缩格式的类，Java 运行时环境可以快速访问这些类。（`JAR` 代表 `Java archive`。）一个 `JAR` 文件可以只包含几个类，也可以包含成千上万类。事实上，整个\
  \ Java API 都存储在一个名为 `rt.java` 的单个 `JAR` 文件中。（`rt` 代表 `runtime`）。这是一个相当大的文件——超过 35MB——但考虑到它包含了\
  \ 12,000 多个类，这并不糟糕。\n\nJAR 文件是由 `jar` 工具创建的，你可以在 Java bin 目录中找到它，以及其他 Java 命令行工具，如\
  \ `java` 和 `javac`。JAR 文件的格式与 `Zip` 文件相似，Zip 是一种由 `PKZIP` 程序普及的压缩格式。主要的区别在于 JAR\
  \ 文件包含一个名为“清单文件（manifest file）”的特殊文件，该文件包含了有关归档文件中文件的信息。此清单由 `jar` 工具自动创建，但你也可以提供自己的清单，以提供有关归档文件的额外信息。\n\
  \nJAR 文件是分发完成的 Java 应用程序的标准方式。完成应用程序后，从命令提示符运行 `jar` 命令来准备 JAR 文件。然后，另一个用户就可以将 JAR\
  \ 文件拷贝到他的计算机上。该用户随后可以直接从 JAR 文件运行应用程序。\n\nJAR 文件也用于分发类库。你可以将 JAR 文件添加到 `ClassPath`\
  \ 环境变量中。然后， JAR 文件中的类对于任何导入包含这些类的包的 Java 程序都是自动可选。\n\n### jar 命令行选项\n\n`jar` 命令是一个老式的类\
  \ Unix 命令，带有一系列晦涩的命令行选项，如果你希望让 `jar` 能够执行某些有用的操作，就必须正确设置这些选项。\n\n`jar` 命令的基本格式如下：\n\
  \n`jar options jar-file [manifest-file] class-files...`\n\n这些选项指定了你想让 `jar` 执行的基本操作，并提供了有关你希望命令如何运行的额外信息。表\
  \ 8-1 列出了这些选项。\n\n#### 表 8-1：jar 命令选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `c` | 创建新的\
  \ jar 文件。 |\n| `u` | 更新现有的 jar 文件。 |\n| `x` | 从现有的 jar 文件提取文件。 |\n| `t` | 列出 jar\
  \ 文件的内容。 |\n| `f` | 表明指定了 jar 文件。 |\n| `v` | 详细输出。 |\n| `0` | 在将文件添加到归档时不进行压缩。 |\n\
  | `m` | 表明提供了清单文件。 |\n| `M` | 表明不将清单文件添加到归档。 |\n\n### 归档包\n\n`jar` 工具最常用的用途是创建整个包的归档。具体操作取决于你所使用的系统。但是，无论使用哪种系统，`jar`\
  \ 命令都是相同的。以下是在运行任意版本的 Windows 上归档包步骤：\n\n**1. 打开命令行窗口。**\n简单的方法是选择开始➪运行，在打开框中输入\
  \ `cmd` 并点击确定。在 Windows 8 上，右键点击开始按钮，然后从菜单选择命令提示符。如果你在第 3 步运行 `jar` 命令遇到困难，可能需要以管理员身份运行命令提示符。这样做只需点击开始菜单，输入\
  \ `cmd`，右键点击顶部的 `cmd.exe`，然后选择以管理员身份运行。\n\n**2. 使用 cd 命令导航到包根目录。**\n例如，如果你的包存储在\
  \ `c:\\javaclasses` 中，使用此命令：\n`cd \\javaclasses`\n\n**3. 使用指定了 cf 选项、文件名以及要归档的类文件路径的\
  \ jar 命令。**\n例如，创建一个名为 `utils.jar` 包含 `com.lowewriter.util` 包中所有类文件的存档，使用此命令：\n\
  `jar cf utils.jar com\\lowewriter\\util\\*.class`\n\n**4. 要验证 jar 文件是否创建正确，使用指定了\
  \ tf 选项和文件名的 jar 命令。**\n例如，如果文件名为 `utils.jar`，使用此命令：\n`jar tf utils.jar`\n\n这会列出\
  \ jar 文件的内容，让你看到添加了哪些类。以下是该命令的典型输出：\n\n```\nMETA-INF/\nMETA-INF/MANIFEST.MF\ncom/lowewriter/util/Console.class\n\
  ```\n\n\n\n\n如你所见，`utils.jar` 文件包含了 `Console` 类，它位于我的 `com.lowewriter.util` 包中。\n\
  \n## 5. 全部完成！\n\n你已经完成了。你可以将 jar 文件留在原处，也可以把它给你的朋友，让他们能够使用其中包含的类。\n\n### 将 jar 文件添加到你的类路径（classpath）\n\
  \n要使用归档包中的类，你必须将 jar 文件添加到 `ClassPath` 环境变量中。我在在本章前面的部分“创建你自己的包”中，已经描述了在 Windows\
  \ XP 中修改 `ClassPath` 变量的过程。因此，我不再在此重复这些细节。\n\n要将归档包添加到 `ClassPath` 变量中，只需添加该归档包的完整路径，并确保使用分号将其与\
  \ `ClassPath` 中已存在的任何其他路径隔开。这里有一个示例：\n\n```\n.;c:\\javaclasses\\utils.jar;c:\\javaclasses\n\
  ```\n\n在这里我将路径 `c:\\javaclasses\\utils.jar` 添加到了我的 `ClassPath` 变量中。\n\n从 Java 1.6\
  \ 开始，你可以一次性将特定目录下的所有 jar 文件添加到 `ClassPath` 中。例如，假设你的 `c:\\javaclasses` 目录包含两个 jar\
  \ 文件 —— `utils.jar` 和 `extras.jar`。要将这两个 jar 文件都添加到 `ClassPath`，请使用正斜杠（`/`）后跟星号：\n\
  \n```\n.;c:\\javaclasses/*\n```\n\n### 与包和模块一起\n\n正斜杠看起来很奇怪，特别是当它与 `c:\\javaclasses`\
  \ 中的反斜杠结合时。但这就是使用 `ClassPath` 通配符的方法。\n\n`ClassPath` 变量中的第一个路径始终是一个点（`.`），这允许 Java\
  \ 在当前目录中查找类。\n\n此外，注意 Java 会按照你列出的顺序搜索 `ClassPath` 变量中的各种路径和归档文件。因此，对于 `ClassPath.;c:\\\
  javaclasses\\utils.jar;c:\\javaclasses`，Java 首先在当前目录中搜索，然后在 `utils` 归档中搜索，最后在 `c:\\\
  javaclasses` 目录中。\n\n### 直接从归档运行程序\n\n只需少量操作，你就可以设置归档包，使得 Java 程序可以直接从中运行。你只需要在创建归档包之前创建一个*清单文件（manifest\
  \ file）*。然后，当你运行 `jar` 工具创建归档包时，在 `jar` 命令行包含该清单文件。\n\n*清单文件*是一个简单的文本文件，其中包含了有关归档包中文件的信息。虽然它可以包含许多行信息，但它只需要一行即可创建一个可执行的\
  \ jar 文件：\n\n```\nMain-Class: ClassName\n```\n\n类名是包含用于启动应用程序的执行的 `main` 方法的类的全限定名。这不是强制要求的，但通常为清单文件使用\
  \ `.mf` 扩展。\n\n例如，假设你有一个应用程序，其主类是 `GuessingGame`，且该应用程序的所有类文件都在 `com.lowewriter.game`\
  \ 包中。\n\n首先，在 `com\\lowewriter\\game` 目录下创建一个名为 `game.mf` 的清单文件。该文件包含以下行：\n\n```\n\
  Main-Class: com.lowewriter.game.GuessingGame\n```\n\n然后运行 `jar` 命令，使用选项 `cfm`、要创建的归档名称、清单文件的名称以及类文件的路径。这里有一个示例：\n\
  \n```\njar cfm game.jar com\\lowewriter\\game\\game.mf com\\lowewriter\\game\\*.class\n\
  ```\n\n现在，你可以通过命令行提示符使用 `java` 命令配合 `-jar` 切换以及归档文件名直接运行应用程序。这里有一个示例：\n\n```\njava\
  \ -jar game.jar\n```\n\n此命令启动 JRE 并执行 `game.jar` 归档包中由清单文件指定的类的 `main` 方法。如果你的操作系统配置得当，你也可以通过双击\
  \ jar 文件的图标来运行应用程序。\n\n### 使用 JavaDoc 为你的类编写文档\n\n在你发布你火热的新类库或应用程序之前，还剩下最后一步：为它的类准备文档。幸运的是，Java\
  \ 提供了一个名为 *JavaDoc* 的工具，它可以根据你的源文件中的注释自动创建精美的基于 HTML 的文档。你只需要为每个公共类、字段和方法添加注释；然后通过\
  \ `javadoc` 命令运行源文件；*搞定！（voilá!）* 你的类拥有了专业的、基于网络的文档。\n\n后续章节将向你展示如何向源文件添加 JavaDoc\
  \ 注释、如何通过 `javadoc` 命令运行源文件，以及如何查看生成的文档页面。\n\n#### 添加 JavaDoc 注释\n\n创建 JavaDoc 注释的基本规则是它们以\
  \ `/**` 开始并以 `*/` 结束。你可以将 JavaDoc 注释放在源文件中的三个位置之一：\n\n- 紧跟公共类声明之前\n- 紧跟公共字段声明之前\n\
  - 紧跟公共方法或构造函数声明之前\n\nJavaDoc 注释可以包含描述类、字段或方法的文本。多行 JavaDoc 注释的后续每行通常以星号开头。JavaDoc\
  \ 会忽略这个星号以及它与行内第一个单词之间的任何空格。\n\n如果你想应用精美的格式，JavaDoc 注释中的文本可以包含 HTML 标记。你应该避免使用标题标签（`<h1>`\
  \ 等），因为 JavaDoc 会创建那些，并且会引起混乱。你可以使用加粗（`<b>`）和斜体（`<i>`）或格式化代码示例（`<pre>`）。此外，你可以使用标签来格式文档页面。表\
  \ 8-2 总结了常用的 JavaDoc 标签。\n\n| 标签 | 解释 |\n| :--- | :--- |\n| `@author` | 提供作者的信息，通常是姓名、电子邮件地址、网站信息等。\
