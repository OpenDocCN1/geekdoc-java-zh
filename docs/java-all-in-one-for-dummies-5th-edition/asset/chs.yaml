  }\n```\n\n如你所见，这个 Servlet 与代码列表 2-1 中的第一个 HelloWorld Servlet 并没有太大区别。最大的区别在于它检索了用户在\
  \ `name` 字段中输入的值，并将其用于发送到响应 `PrintWriter` 对象的 HTML 中。例如，如果用户在 `name` 输入字段中输入了 Calvin\
  \ Coolidge，则会生成以下 HTML：\n\n734 第 7 本书 **Web Programming**\n\n```html\n<<html><head><title>HelloWorld</title></head><body><h1>Hello\
  \ Calvin Coolidge</h1></body></html>\n```\n\n因此，页面上将显示消息 Hello Calvin Coolidge。虽然现实生活中的\
  \ Servlet 做的比简单地重复用户输入的信息多得多，但大多数它们都遵循这种惊地简单的结构——当然，会有一些变化。真实世界中的 Servlet 会验证输入数据，并在用户输入错误数据或遗漏重要数据时显示错误信息，大多数真实的\
  \ Servlet 会在文件或数据库中检索或更新数据。尽管如此，基本结构也几乎是相同的。\n\n## 在 Servlet 中使用类\n\n在开发 Servlet\
  \ 时，你通常想要访问你创建的其他类，例如从文件或数据库检索数据的输入/输出（I/O）类、提供常用功能（如数据验证）的工具或辅助类，甚至可能代表业务对象（如客户或产品）的类。为了实现这一点，你只需要将类文件保存在\
  \ Servlet 根目录下的 `classes` 目录——对于本章而言，它是 `c:\\tomcat\\webapps\\ROOT\\WEB-INF\\classes`。\n\
  \n为了说明使用多个类的 Servlet，图 2-5 显示了一个列出从文本读取的电影的 Servlet 输出。此 Servlet 使用了三个类：\n\n- **Movie**：代表单个电影的类。\n\
  - **MovieIO**：一个具有 `static public` 方法 `getMovies` 的类。它返回从文件中读取的电影的 `ArrayList`。\n\
  - **listFiles**：主 Servlet。它调用 `Movie`。\n\n735\n![Image 100](img/index-755_1.png)\n\
