  \ 傻瓜指南*（Java All-in-One For Dummies）第 5 版——这本旨在替代你可能需要购买的一整架枯燥、乏味书籍的 Java 教科。这本书包含了你上手\
  \ Java 编程所需的所有基础信息，从编写语句、使用变量开始，到编写使用动画和游戏的技巧结束。在此过程中，你还会发现许多关于用户界面编程、类与对象、创建 Web\
  \ 应用程序以及处理文件和数据库的非基础信息。\n\n你可以（可能最终也应该）为这些主题中的每一个主题单独购买书籍。不了多久，你的书架就会挤满 10,000 页或更多关于\
  \ Java 编程中可以想象的每一个细微差别的详细信息。在你准备好深入研究每一个主题之前，你需要先获得一个全局观。这正是本书的所在。\n\n如果你已经拥有了 10,000\
  \ 页或更多的 Java 信息，你可能会被大量的细节和奇点所困扰，并想：“我真的需要为了创建一个简单的网页就读 1,200 页关于 JSP 的内容吗？我真的需要一本六磅重的\
  \ JavaFX 书吗？”事实是，大多数 1,200 页的编程书中只有大约 200 页是非常实用的信息——你每天都会用的那种——以及大约 1,000 页极其痛苦的细节，这些细节主要在你编写核导弹引导控制程序或纽约证券交易所交易系统时才有用。\n\
  \n这里的核心思想是，我尝试从这些不同的 Java 编程主题中提炼出大约一百页最有用的信息：设置与配置、基础编程、面向对象编程、编程技巧、JavaFX、文件和数据库编程、Web\
  \ 编程以及动画和游戏编程。因此，你得到了一本精简。\n\n所以，无论你是刚开始学习 Java 编程还是资深专家，你都找到了正确的书。\n\n## 关于本书 1\n\
  *Java 傻瓜指南*第 5 版是你编写 Java 程序时可能需要知道的所有妙事（可能也包括一些不那么妙的事）的参考书。当然，你可以为本书涵盖的每个编程主题都买一本巨大的\
  \ 1,200 页书籍。但那样的话谁来帮你从书店把它们带回家呢？你在哪里找书架来存放它们？你什么时候会有时间读它们呢？\n\n在本书中，你需要的所有信息都方便地封装在同一个封面之间。而且所有的信息都适用于最新的\
  \ Java 版本，即 `JDK 9`。本书并没有自称是关于 Java 编程每个可能领域的每个细节的全面参考书。相反，它向你展示如何快速上手，让你有更多时间去做你真正想做的事情。本书采用易读的*傻瓜系列*格式设计，帮助你获取所需信息，而无需费力寻找。\n\
  \n*Java 傻瓜指南*第 5 版是一本由九本较小的书组成的大书——你可以称它们为“微型书”。每本微型书都涵盖编程中一个关键要素的基础，例如安装 Java 以及编译和运行程序、使用基础\
  \ Java 语句，或使用 JavaFX 编写 GUI 应用程序。\n\n每当一个大整体由几个小部分组成时，总是存在混乱的可能性。这就是为什么这本书有多个访问点。开头是涵盖全书的详细目录。然后每本微型书都以一个微型目录开始，让你一眼看出该微型书包含哪些章节。每页顶部都有实用的运行页眉，指出该页讨论的主题。页面侧边有方便的标签（thumbtabs），帮助你快速找到每本微型书。最后，全面的索引让你能在全书的任何地方找到信息。\n\
  \n## 愚的假设\n你我从未见过面，所以我很难对你为什么对这本书感兴趣做出任何假设。然而，让我们从几个基本假设开始：\n\n- **你拥有一台或可以使用相当现代的计算机。**示例是在\
