  \ `MovieIO` 类。该类从文本文件中读取电影。（关于该类如何工作的详细说明，请跳转到第 8 卷第 2 章。）\n\n```java\npackage movie;\n\
  import java.io.*;\nimport java.util.*;\n\npublic class MovieIO\n{\n    public static\
  \ ArrayList<Movie> getMovies()\n    {\n        ArrayList<Movie> movies = new ArrayList<>();\n\
  \        BufferedReader in = getReader(\"data\\\\movies.txt\");\n        Movie movie\
  \ = readMovie(in);\n        while (movie != null)\n        {\n            movies.add(movie);\n\
  \            movie = readMovie(in);\n        }\n        return movies;\n    }\n\n\
  \    private static BufferedReader getReader(String name)\n    {\n        BufferedReader\
  \ in = null;\n        try\n        {\n            File file = new File(name);\n\
  \            in = new BufferedReader(new FileReader(file));\n        }\n       \
  \ catch (FileNotFoundException e)\n        {\n            System.out.println(\"\
  文件不存在.\");\n            System.exit(0);\n        }\n        return in;\n    }\n\n\
  \    private static Movie readMovie(BufferedReader in)\n    {\n        String title;\n\
