  \n\n\n\n语句。接下来的章节将介绍使用 Java 语句的各种细节。\n\n# 语句的类型\n\nJava 有许多类型的语句。某些语句仅仅创建变量，你可以使用它们来存储数据。这些语句通常被称为*声明语句*，其形式通常如下：\n\
  \n```java\nint i;\nString s = \"This is a string\";\nCustomer c = new Customer();\n\
  ```\n\n另一种常见的语句类型是*表达式语句*，它执行计算。以下是表达式语句的一些示例：\n\n```java\ni = a + b;\nsalesTax\
  \ = invoiceTotal * taxRate;\nSystem.out.println(\"Hello, World!\");\n```\n\n# Java\
  \ 编程基础\n\n请注意，这一组中的最后一个语句与列表 1-1 中的第 5 行相同。因此，`HelloApp` 程序中的单个语句是一个表达式语句。\n\n第\
  \ 1 章 **Java 编程基础** 51\n\n除了这两种之外，还有许多类型的语句。例如，`if-then` 语句仅在满足特定条件时执行其他语句，而 `for`、`while`\
  \ 和 `do` 等语句则会一次或多次执行一组语句。\n\n人们常说每个 Java 语句都必须以分号结束。实际上，这并不完全正确。*某些*类型的 Java 语句必须以分号结束——但其他语句则不需要。基本规则是声明语句和表达式语句必须以分号结束，但大多数其他语句类型不需要。然而，这条规则变得复杂的地方在于，大多数其他类型的语句包含一个或多个使用分号的声明语句或表达式语句。这里是一个典型的\
  \ `if` 语句：\n\n```java\nif (total > 100)\n    discountPercent = 10;\n```\n\n在这里，如果\
  \ `total` 变量的值大于 100，则给名为 `discountPercent` 的变量赋值为 10。表达式语句以分号结束，但 `if` 语句本身没有。（如果你在不该使用分号的地方，Java\
  \ 编译器会提示你。）\n\n# 空白字符\n\n在 Java 中，*空白字符*一词指的是一个或多个连续的空格字符、制表符或换行符。所有的空白字符都被视为相同的。换句话说，单个空格的处理方式与制表符、换行符或空格、制表符和换行符的任何组合相同。\n\
  \n如果你用过 Visual Basic，空白字符与你习惯的有所不同。在 Visual Basic 中，换行符标记语句的结束，除非使用了特殊的延续字符。在 Java\
  \ 中，你不需要执行任何特殊操作即可将语句延续到第二行。因此，语句\n\n```java\nx = (y + 5) / z;\n```\n\n与此语句等同：\n\
  \n```java\nx = (y + 5) / z;\n```\n\n52 第 2 卷 **编程基础**\n\n事实上，如果你想的话，可以这样写前面的语句：\n\
  \n```java\nx = ( y + 5 ) / z ;\n```\n\n我不建议这样做，但该语句确实可以正确编译和执行。不过，请注意，你不能在关键字或标识符的中间放置空白字符。下面的示例将无法工作：\n\
  \n```java\np u b l i c static v o i d main(String[] args)\n```\n\n在这里，单词 *public*\
  \ 和 *void* 字母之间的额外空格会混淆编译器。\n\n在程序中适量使用空白字符是一个好主意。特别是，你应该像这样例性地使用空白字符：\n\n- **»\
  \ 换行：** 将每个语句放在单独的一行上。\n- **» 制表符：** 属于在一起的元素。\n\n编译器会忽略额外的空白字符，因此它们不会影响为你的程序创建的字节码。结果，在程序中使用额外的空白字符不会以任何方式影响程序的性能，但它确实会让程序的源代码更易于阅读。\n\
  \n# 使用块\n\n*块*是一个被大括号括起来的一个或多个语句的组。块以左括号（`{`）开始，以右括号（`}`）结束。在左括号和右括号之间，你可以编写一个或多个语句。这里有一个由三个语句组成的块：\n\
  \n```java\n{\n    int i, j;\n    i = 100;\n    j = 200;\n}\n```\n\n块本身也是语句的一种。因此，每当\
  \ Java 语言需要语句时，你都可以用一个块来执行多个语句。在第 2 卷第 4 章中，你将发现 `if` 语句的基本语法如下：\n\n`if ( *expression*\
  \ ) *statement*`\n\n在这里，语句可以是一个单独语句，也可以是一个块。如果你觉得这个想法很困惑，不要担心；当你读到第 2 卷第 4 章时，它会更有意义。你可以用两种流行的方法编写标记块的大括号。一种方法是将两个括号都放在单独的行上，然后缩进组成块的语句。例如：\n\
  \n```java\nif (i > 0)\n{\n    String s = \"The value of i is \" + i;\n    System.out.print(s);\n\
  }\n```\n\n另一种风格是将块的左括号放在与该块关联的语句同一行，如下所示：\n\n```java\nif (i > 0) {\n    String s\
  \ = \"The value of i is \" + i;\n    System.out.print(s);\n}\n```\n\n使用哪种风格取决于个人喜好。注意，尽管块可以被视为单个语句，但你不*应该*用分号结束块。\n\
  \n53 第 1 章 **Java 编程基础**\n\n# 创建标识符\n\n*标识符*是你用来指代 Java 元素的单词。虽然你可以将标识符分配许多许多 元素，但它们最常用于：\n\
  \n- **类：** 如列表 1-1 中的 `HelloApp`\n- **方法：** 如列表 1-1 中的 `main`\n- **变量和字段：** 程序使用的数据\n\
  - **参数：** 向方法传递数据\n\n标识符有时也称为*名称*。严格来说，名称与标识符并不相同；名称通常由两个或多个通过点（称为*点*）连接的标识符组成。在\
  \ 1-1 的第 5 行，`System` 和 `out` 都是标识符，但 `System.out` 是名称。实践中，*名称*和*标识符*这两个词互换使用。\n\
  \n创建标识符时你必须遵循一些简单的规则：\n\n- **» 标识符区分大小写。** 因此，`SalesTax` 和 `salesTax` 是不同的标识符。\n\
  - **» 标识符由大小写字母、数字、下划线字符 (_) 和美元符号 ($) 组成。** 因此，`Port1`、`SalesTax$` 和 `Total_Sales`。\n\
  - **» 所有标识符必须以字母开头。** 因此，`a15` 是有效的标识符，但 `13Unlucky` 则不是（因为它以数字开头）。\n- **» 标识符不能与表\
  \ 1-1 中列出的任何关键字相同。** 因此，你不能创建一个名为 `for` 的变量或名为 `public` 的类。\n- **» Java 语言规范建议你在创建名称时避免使用美元符号**，因为代码生成器使用美元符号来创建标识符。因此，避免美元符号可以帮助你避免创建与生成名称冲突名称。\n\
  \n54 第 2 卷 **编程基础**\n\n# 编写注释\n\n注释是提供代码说明的文本。编译器忽略注释，因此你可以在注释中放置任何想要的文本。在程序中使用大量的注释是解释程序功能及其工作原理的好方法。Java\
  \ 有三种基本的注释类型：*行尾注释*、*传统注释*和 *JavaDoc 注释*。关于这些的内容稍后介绍。\n\n## 行尾注释\n\n*行尾注释*以序列 `//`（一对连续的斜杠）开始，并在行尾结束。你可以在任何行的末尾放置行尾注释。你在\
  \ `//` 之后输入的所有内容都会被编译器忽略。例如：\n\n\n\n\n\n```\ntotal = total * discountPercent; //\
  \ 计算折扣后的总额\n```\n\n如果你愿意，也可以将行尾注释单独放在一行中，如下所示：\n\n```\n// 计算折扣后的总额\ntotal = total\
  \ * discountPercent;\n```\n\n你还可以在跨越两或多行的语句中间放置行尾注释。例如：\n\n```java\ntotal = (total\
  \ * discountPercent) // 先应用折扣\n+ salesTax; // 然后加上销售税\n```\n\n## 传统注释\n\n`传统注释`（traditional\
  \ comment）以序列 `/*` 开始，以序列 `*/` 结束，并可以跨多行。这里有一个示例：\n\n```\n/* HelloApp 示例程序。\n\n\
  此程序演示了所有 Java 程序 \n必须遵循的基本结构。 */\n```\n\n传统注释可以在行的任何地方开始和结束。如果你愿意，甚至可以将注释夹杂在其他 Java\
  \ 编程元素之间，如下所示：\n\n```\nx = (y + /* 放置注释的奇怪地方 */ 5) / z;\n```\n\n通常情况下，传统注释单独成行。传统注释的一个常见用途是在类的开头放置一个块注释块，用以指示关于该类的信息\
  \ —— 例如该类的功能、谁编写的等。然而，那种类型的注释通常最好编写为下一节介绍的 JavaDoc 注释。\n\n你可能会想通过在范围内的第一行之前放置 `/*`，在范围内的最后行之后放置\
  \ `*/` 来临时注释掉一段行代码。然而，这种做法可能会给你带来麻烦，如果你尝试注释的行范围包含了传统注释，因为传统注释是不能*嵌套*的。\n\n例如，以下代码将无法编译：\n\
  \n```\n/*\nint x, y, z;\ny = 10;\nz = 5;\nx = (y + /* 放置注释的奇怪地方 */ 5) / z;\n*/\n\
  ```\n\n在这里，我尝试注释掉一段已经包含传统注释的行范围。遗憾的是，第五行末尾的 `*/` 序列被解释为从第一行开始的传统注释的结束，因此当编译器遇到第\
  \ 6 行中的 `*/` 序列时，它会生成错误信息。\n\n## JavaDoc 注释\n\n`JavaDoc 注释`实际上是传统注释的一种特殊类型，你可以用它自动为你的程序创建基于\
  \ Web 的文档。\n\n因为当你了解更多对象对象编程知识时，会对 JavaDoc 注释有更好的理解，所以我在第 3 本第 8 章专门安排了一个章节来创建和使用\
  \ JavaDoc 注释。\n\n## 介绍面向对象编程\n\n在介绍了 Java 编程语言的一些最基本元素后，大多数 Java 书接下来会转向变量和数据类型这两个重要主题。然而，由于\
  \ Java 本身是一种面向对象的编程语言，而且类是面向对象编程的核心，我接下来将查看类以探索它们在创建对象方面所起的重要作用。我将在下一章首先介绍变量和数据类型。\n\
  \n## Java 编程基础\n\n### 理解类和对象\n\n正如我已经提到的，`class`（类）是定义一种称为 Java 编程元素的 `object`（对象）行为的代码。`object`是一个同时具有状态和行为的实体。对象的`state`由对象可能跟踪的任何数据组成，而`behavior`由对象可以执行的`actions`组成。这些行为在类中由一个或多个方法表示，这些方法可以被调用以执行操作。\n\
  \n类和对象的区别类似于蓝图和房屋之间的区别。蓝图是房子的计划。房子是蓝图的实现。一组蓝图可以用来建造许多房子。同样，类是对象的计划，而对象 —— 在 Java\
  \ 术语中 是类的 `instance`（实例）。你可以使用单个类来创建多个对象。\n\n当一个对象被创建时，Java 会留出一块计算机内存区域，足以容纳对象存储的所有数据。因此，类的每个实例都有自己的数据，与该同一类其他实例使用的数据相互独立。\n\
  \n### 理解静态方法\n\n你不一定需要创建类的实例来使用类的方法。如果你用 `static` 关键字声明一个方法，你可以在不先创建类实例的情况下调用该方法，因为静态方法是从类调用的，而不是从对象调用的。\n\
  \nJava 应用程序的 `main` 方法必须用 `static` 关键字声明，因为当你通过命令行 `java` 命令启动 Java 程序时，Java 并会创建应用程序类的实例。相反，它只是调用程序的静态\
  \ `main` 方法。\n\n静态方法和非静态方法的区别会在你在第 3 本中深入研究面向对象编程时变得更加明显。但现在，请考虑这个类比。房子的蓝图包含了完工房屋中实际运行系统的细节，例如电气和水水系统。要使用这些系统，你必须实际建造一座房屋。换句话说，你不能仅凭蓝图就打开热水；你必须有一座带有实际加热设备的实际房屋。\n\
  \n然而，蓝图确实包含了房屋尺寸的详细测量值。因此，你*可以*使用蓝图来确定客厅的平方英尺。\n\n许多 Java 程序 —— 实际上，第 2 本中的许多程序\
  \ —— 完全由静态方法组成。然而，大多数真实的程序都要求你创建程序所使用的一个或多个对象。因此，知道如何创建简单的类以及如何从这些类中创建对象是 Java 的基本技能。\n\
  \n### 从类创建对象\n\n在 Java 中，你可以通过几种方法从类创建对象。最直接的方法是创建一个变量，为它提供一个你可以用于引用该对象的名称，使用 `new`\
  \ 关键字创建类的实例，然后将生成的对象赋值给该变量。执行这一“魔法”的语句的一般形式如下：\n\n```\nClassName variableName =\
  \ new ClassName();\n```\n\n要创建一个名为 `Class1` 的类的对象实例，并将其赋值给名为 `myClass1Object` 的变量，你会写如下所示语句：\n\
  \n```\nClass1 myClass1Object = new Class1();\n```\n\n为什么你必须列两次类名？第一次，你是在为变量提供`type`（类型）。换句话说，你是在说在这里创建的变量可以用来持有从\
  \ `Class1` 类创建的对象。当你第二次列出类名时，你正在从该类创建一个对象。`new` 关键字告诉 Java 创建一个对象，而类名提供了创建该对象的类名。\n\
  \n等号 (`=`) 是一个*assignment operator*（运算符）。它只是说将 `new` 关键字创建的对象赋值给变量。因此，这条语句实际上执行了*三*件事：\n\
  \n1. 它创建了一个名为 `myClass1Object` 的变量，该变量可以用来持有从 `Class1` 类创建的对象。此时，还没有创建对象 —— 只是一个可以存储对象的变量。\n\
  2. 从 `Class1` 类在内存中创建一个新对象。\n3. 将这个新创建的对象赋值给 `myClass1Object` 变量。\n\n\n\n\n\n你可以使用\
  \ `myClassObject` 变量来引用创建的对象。\n\n# Java 编程基础\n\n第 1 章 Java 编程基础 59\n\n## 查看使用对象的程序\n\
  \n为了让你尽早了解面向对象编程的概要，列表 1-2 和列表 1-3 展示了 HelloApp 程序的另一个版本——这次使用了两个类，其中一个类在程序运行时实际上被创建了一个对象。第一个类名为\
  \ `HelloApp2`，如列表 1-2 所示。\n\n该类与列表 1-1 中的 `HelloApp` 类类似，但它使用从名为 `Greeter` 的第二个类创建的对象来实际上在控制台上显示“Hello,\
  \ World!” 消息。`Greeter` 类如列表 1-3 所示。它定义了一个名为 `sayHello` 的方法来显示该消息。\n\n`HelloApp`\
  \ 类和 `Greeter` 类都是公共类（public）。Java 要求每个公共类必须存储在与类名同名的单独文件中；文件名以 `.java` 结尾。因此，`HelloApp2`\
  \ 类存储在名为 `HelloApp2.java` 的文件中，而 `Greeter` 类存储在名为 `Greeter.java` 的文件中。\n\n### HelloApp2\
  \ 类\n\n`HelloApp2` 类如列表 1-2 所示。\n\n#### 列表 1-2：HelloApp2 类\n\n```java\n// 此应用程序通过创建\
  \ Greeter\n// 类的实例并调用 Greeter\n// 对象的 sayHello 方法，在控制//\n// 上显示 hello 消息。\npublic\
  \ class HelloApp2\n{\n    public static void main(String[] args)\n    {\n      \
  \  Greeter myGreeterObject = new Greeter();\n        myGreeterObject.sayHello();\n\
  \    }\n}\n```\n\n接下来的段落描述了关键点：\n\n* **1**: 该类起始于一系列注释行，用于标识程序的功能。对于这些注释，我使用了简单的行尾注释，而不是传统的块注释。（有关关于注释的更多信息，请参阅本章节前面的“编写注释”部分。）\n\
  * **6**: `HelloApp2` 类从第 6 行开始，使用了 `public class` 声明。由于使用了 `public` 关键字，名为 `HelloApp2.java`\
  \ 的文件必须包含该类。\n* **8**: 声明了 `main` 方法，使用的形式与此程序的第一个版本（列表 1-1）中的 `main` 方法相同。请习惯这种形式，因为所有\
  \ Java 都包含包含以此方式声明的 `main` 方法。\n* **10**: `main` 方法体的第一行创建了一个名为 `myGreeterObject`\
  \ 的变量，它可以持有从 `Greeter` 类创建的对象。然后，它使用 `Greeter` 类创建了一个新对象，并将该对象赋值给 `myGreeterObject`\
  \ 变量。\n* **11**: `main` 方法体的第二行调用了 `myGreeterObject` 对象的 `sayHello` 方法。正如你很快将看到的，该方法简单地在控制台上显示“Hello,\
  \ World!”消息。\n\n### Greeter 类\n\n`Greeter` 类如列表 1-3 所示。\n\n#### 列表 1-3：Greeter 类\n\
  \n```java\n// 此类创建一个 Greeter 对象\n// 在控制台上显示一个 \n// hello 消息。\npublic class Greeter\n\
  {\n    public void sayHello()\n    {\n        System.out.println(\"Hello, World!\"\
  );\n    }\n}\n```\n\n接下来的段落描述了关键点：\n\n* **1**: 该类也起始于一系列注释行，用于标识程序的功能。\n* **5**:\
  \ 类声明从这一行开始。该类被声明为 `public`，以便其他类可以使用它。此声明是必要的，以便 `HelloApp2` 类可以访问 `Greeter` 类。\n\
  * **7**: 使用 `public` 关键字声明了 `sayHello` 方法，以便使用 `Greeter` 类的其他类可以使用它。`void` 关键字表示该方法不会向调用它的类返回任何数据，而\
  \ `sayHello` 仅提供方法的名称。\n* **9**: 该方法的体由仅一行代码组成，该代码在控制台上显示“Hello, World!”消息。\n\n\
  ### 那么区别是什么？\n\n你可能注意到，在 `HelloApp2` 程序中，唯一一行执行了实际工作的代码是 `Greeter` 类中的第 9 行（列表 1-3），而这一行恰好与原始\
  \ `HelloApp` 类（列表 1-1）中的第 5 行相同。除了第二个版本需要两倍的代码之外，这两个者之间真正的区别是什么呢？\n\n简单来说，第一个版本是过程化的，而第二个版本是面向对象的。为了说明这一点，请考虑如果你使用\
  \ 1-4 所示的 `Greeter` 类而不是 1-3 所示的类会发生什么。我将不再解释它是如何工作的，但你可以在下一章中找到更多信息。\n\n这里需要意识到的重要点是，`HelloApp2`\
  \ 类不需要更改来使用这个新版本的 `Greeter` 类。相反，你所做的只是将旧的 `Greeter` 类替换为新的，重新编译 `Greeter` 类，`HelloApp2`\
  \ 类就不会感知到区别。这是面向对象编程的好处之一。\n\n## 导入 Java API 类\n\n你可能注意到列表 1-4 中的 `Greeter` 类包含了语句：\n\
  \n`import javax.swing.JOptionPane`\n\n`import` 语句的目的是让编译器知道程序正在使用由 `JOptionPane`\
  \ 的 Java API 定义类。由于 Java API 包含数以千计的类，需要某种形式的组织以便访问。Java 通过将类分成名为包（packages）的可管理组来实现。在之前的示例中，包含\
  \ `JOptionPane` 类的包名为 `javax.swing`。\n\n严格来说，`import` 语句永远不是必须的。但如果你不使用 `import`\
  \ 语句来导入程序使用的 API 类，那么在使用它们时必须通过在类名前列列包名来“完全限定”（fully-qualify）类名。因此，如果列表 1-4 中的类没有包含第\
  \ 5 行的 `import` 语句，你必须这样编写第 11 行：\n\n```java\njavax.swing.JOptionPane.showMessageDialog(null,\
  \ \"Hello, World!\", \"Greeter\", javax.swing.JOptionPane.INFORMATION_MESSAGE);\n\
  ```\n\n也就是说，每当你引用该类时，都要指定 `javax.swing.JOptionPane` 而不仅仅是 `JOptionPane`。\n\n关于使用\
  \ `import` 语句的一些额外规则：\n\n* `import` 语句必须出现在类文件的开头，在任何类声明之前。\n\n\n\n\n\n- 你可以包含任意数量的\
  \ `import` 语句，以导入程序中使用的所有类。\n- 你可以通过列出包名后跟星号通配符 `*` 来导入特定包中的所有类，例如：\n```java\nimport\
  \ javax.swing.*;\n```\n- 由于许多程序都使用了 `java.lang` 包中的类，所以你不需要导入该包。相反，这些类对所有程序都是自动可用的。`System`\
  \ 类定义在 `java.lang` 包中。因此，使用该类时不需要提供 `import` 语句。\n- Java 的最新版本 JDK 9 引入了一个用于管理包的新功能，称为\
  \ `Java Platform Module System`。我将在第 3 本第 8 章介绍这个新功能。\n\n# 第 2 章：使用变量和数据类型\n\n##\
  \ 本章内容\n- 创建正确的变量声明\n- 发现基本类型和引用类型之间的区别\n- 查看 Java 的内置数据类型\n- 介绍字符串\n- 从控制台获取输入\n\
  - 如果你使用的是旧版本的 Java，如何获取输入\n\n在本章中，你将学习在 Java 中操作变量的基础知识。变量是使 Java 程序具有通用性的关键。例如，上一章中的\
  \ `Hello, World!` 程序是非常具体的：它们唯一说的话就是“Hello, World!”但有了变量，你就可以让这类程序更具通用性。你可以更改问候语，让它有时说“Hello,\
  \ World!”，有时说“Greetings, Foolish Mortals。”或者你可以对问候语进行个性化处理，让它说“Hello, Bob!”或“Hello,\
  \ Amanda!”变量也是创建能够执行计算的程序的关键。假设你想创建一个程序，根据圆的半径计算圆的面积。这样的程序使用两个变量：一个表示圆的半径，另一个表示圆的面积。程序要求用户为第一个变量输入值，然后计算第二个变量的值。\n\
  \n## 声明变量\n在 Java 中，你必须在使用变量之前显式地声明所有变量。这条规则与某些语言形成对比——最著名的是 Basic 和早期版本的 Visual\
  \ Basic，它们允许你使用尚未自动声明的变量。允许使用未显式声明的变量初看起来似乎是个好主意，但它是由于变量名拼写错误导致错误的常见根源。Java 要求显式地声明变量，这样如果你拼写错了变量名，编译器就能检测到你的错误并显示编译器错误。\n\
  \n变量声明的基本形式如下：\n```\ntype name;\n```\n\n以下是一些示例：\n```java\nint x;\nString lastName;\n\
  double radius;\n```\n\n在这些示例中，声明了名为 `x`、`lastName` 和 `radius` 的变量。`x` 变量存储整数值，`lastName`\
  \ 变量存储 `String` 值，而 `radius` 变量存储 `double` 值。关于这些类型含义的更多信息，请参阅本章稍后的“使用基本数据类型”部分。在此之前，你只需要知道\
  \ `int` 变量可以存储整数（如 `5`、`1340` 或 `-34`），`double` 变量可以存储带有小数部分的数字（如 `0.5`、`99.97`\
  \ 或 `3.1415`），而 `String` 变量可以存储文本值（如 `\"Hello, World!\"` 或 `\"Jason P. Finch\"`）。注意变量声明以分号结尾。这是因为变量声明本身就是一种类型的语句。变量名遵循与其它\
  \ Java 标识符相同的规则，正如我在第 2 本第 1 章中描述的那样，详情请参阅该章节。简之，变量名可以是字母、数字或下划线和美元符号的任意组合，但必须以字母开头。大多数程序员倾向于用小写字母开始变量名，并将名称中每个单词的首字母大写。例如，`firstName`\
  \ 和 `salesTaxRate` 就是典型的变量名。\n\n### 在一条语句中声明两个或多个变量\n你可以通过逗号分隔变量名，在一条语句中声明同种类型的多个变量。例如：\n\
  ```java\nint x, y, z;\n```\n在这里声明了三个 `int` 类型的变量，名称分别为 `x`、`y` 和 `z`。作为一个原则，我建议你避免在一条语句中声明多个变量。如果你为每个变量提供单独的声明，你的代码将更容易阅读和维护。\n\
  \n### 声明类变量\n`类变量`是类中任何方法都可以访问的变量，包括像 `main` 这样的静态方法。在声明类变量时，遵循两个基本规则：\n- 你必须将声明放在类体内部，但不能放在任何类方法内部。\n\
  - 你必须在声明中包含 `static` 单词。`static` 单词位于变量类型之前。\n\n以下程序展示了声明名为 `helloMessage` 的类变量正确方法：\n\
  ```java\npublic class HelloApp\n{\n    static String helloMessage;\n    public static\
  \ void main(String[] args)\n    {\n        helloMessage = \"Hello, World!\";\n \
  \       System.out.println(helloMessage);\n    }\n}\n```\n你可以看到，声明包含了 `static` 单词，并放置在\
  \ `HelloApp` 类中，但在 `main` 方法之外。你不需要将类声明放在类的开头。有些程序员倾向于将其放在类的末尾，如示例所示：\n```java\n\
  public class HelloApp\n{\n    public static void main(String[] args)\n    {\n  \
  \      helloMessage = \"Hello, World!\";\n        System.out.println(helloMessage);\n\
  \    }\n    static String helloMessage;\n}\n```\n在这里，`helloMessage` 变量声明在 `main`\
  \ 方法*之后*。我认为先声明变量更容易阅读，所以你在那里看到它们。\n\n### 声明实例变量\n`实例变量`与类变量相似，但在声明中没有指定 `static`\
  \ 单词。正如其名所示，实例变量与类的实例相关。因此，你只有在创建类的实例时才能使用它们。由于静态方法与类的实例无关，所以你不能在静态方法中使用实例变量——这包括\
  \ `main` 方法。下面的示例程序无法编译：\n```java\npublic class HelloApp\n{\n    String helloMessage;\
  \ // 错误——应该使用 static 关键字\n    public static void main(String[] args)\n    {\n  \
  \      helloMessage = \"Hello, World!\";\n        System.out.println(helloMessage);\
  \ // 编译\n    }\n}\n```\n如果你尝试编译此程序，会得到以下错误信息：\n```\nC:\\Java\\HelloApp.java:7: error:\
  \ non-static variable helloMessage cannot be referenced from a static context\n\
  helloMessage = \"Hello, World!\";\n^\nC:\\Java\\HelloApp.java:8: error: non-static\
  \ variable helloMessage cannot be referenced from a static context\nSystem.out.println(helloMessage);\n\
  ^\n```\n这两个错误都发生是因为 `main` 方法是静态的，因此它无法访问实例变量。\n\n### 声明局部变量\n`局部变量`是在方法体内部声明的变量。那么你只能在该方法内部该变量。类中的其他方法甚至无法感知到该变量的存在。\n\
  \n\n\n\n\n这是一个 `HelloApp` 类的版本，其中 `helloMessage` 变量被声明为局部变量：\n\n```java\npublic\
  \ class HelloApp\n{\n    public static void main(String[] args)\n    {\n       \
  \ String helloMessage;\n        helloMessage = \"Hello, World!\";\n        System.out.println(helloMessage);\n\
  \    }\n}\n```\n\n注意，在声明局部变量时不需要指定 `static`。如果你这样做，编译器会生成错误信息并拒绝编译你的程序。局部变量始终存在于方法环境中，并且只在方法方法执行期间存在。因此，是否创建了类的实例无关。\n\
  \n与类变量和实例变量不同，局部变量对声明的位置非常挑剔。特别是你必须将声明放在第一个使用该变量的语句之前。因此以下程序无法编译：\n\n```java\npublic\
  \ class HelloApp\n{\n    public static void main(String[] args)\n    {\n       \
  \ helloMessage = \"Hello, World!\"; // error -- helloMessage\n        System.out.println(helloMessage);\
  \ // is not yet declared\n        String helloMessage;\n    }\n}\n```\n\n当运行到 `main`\
  \ 方法的第一行时，编译器会生成两条错误信息，抱怨找不到符号 `\"helloMessage\"`。这是因为该符号尚未声明。\n\n尽管大多数局部变量都在方法体的开头附近声明，但你也可以在花括号标记的较小代码块中声明局部变量。当你学习使用代码块的语句（如\
  \ `if` 和 `for` 语句）时，这会对你更有意义。这里有一个例子：\n\n```java\nif (taxRate > 0)\n{\n    double\
  \ taxAmount;\n    taxAmount = subTotal * taxRate;\n    total = subTotal + total;\n\
  }\n```\n\n在这里，变量 `taxAmount` 只存在于 `if` 语句的大括号范围内。（变量 `taxRate`、`subtotal` 和 `total`\
  \ 定义在大括号定义的代码块之外。）\n\n### 初始化变量\n\n在 Java 中，局部变量不会赋予初始默认值。编译器会检查你在在使用局部变量之前是否已经为其赋了值。以下示例程序无法编译：\n\
  \n```java\npublic class testApp\n{\n    public static void main(String[] args)\n\
  \    {\n        int i;\n        System.out.println(\"The value of i is \" + i);\n\
  \    }\n}\n```\n\n如果你尝试编译此程序，你会得到以下错误信息：\n\n`C:\\Java\\testApp.java:6: error: variable\
  \ i might not have been initialized`\n`System.out.println(\"The value of i is \"\
  \ + i);`\n`^`\n\n为了避免此错误信息，你必须在使用局部变量之前对其进行初始化。你可以通过赋值语句或初始化器来实现，正如我在后续章节中描述的那样。\n\
  \n与局部变量不同，类变量和实例变量会被赋予默认值。数值类型会自动初始化为零，`String` 变量被初始化为空字符串。因此，你不需要初始化类变量或实例变量，尽管如果你希望它们具有除默认值以外的初始值也可以这样做。\n\
  \n#### 使用赋值语句初始化变量\n\n初始化变量的一种方法是在变量声明后编写一个赋值语句。赋值语句具有如下通用形式：\n\n`variable = expression;`\n\
  \n在这里，表达式可以是任何产生与变量相同类型值的 Java 表达式。这里是上一个示例中 `main` 方法的版本，它在运行变量 `i` 之前正确地对其进行了初始化：\n\
  \n```java\npublic static void main(String[] args)\n{\n    int i;\n    i = 0;\n \
  \   System.out.println(\"i is \" + i);\n}\n```\n\n在这个示例中，在调用 `println` 方法打印变量值之前，变量被初始化为零。你可以在第\
  \ 2 本第 3 章中了解到更多关于表达式的内容。目前，你只需要使用简单的字面量，例如本示例中的 `0`。\n\n#### 使用初始化器初始化变量\n\nJava\
  \ 还允许你在声明变量的同一语句中对其进行初始化。要做到这一点，你使用初始化器，它具有如下通用形式：`type name = expression;`\n\n\
  实际上，初始化器让你将声明和赋值语句合并为一个简洁的语句。以下是一些示例：\n\n```java\nint x = 0;\nString lastName =\
  \ \"Lowe\";\ndouble radius = 15.4;\n```\n\n在每情况下，变量都在同一个语句中完成了声明和初始化。当在一个语句中声明多个变量时，每个变量都可以有自己的初始化器。以下代码声明了名为\
  \ `x` 和 `y` 的变量，并将 `x` 初始化为 `5`，将 `y` 初始化为 `10`：\n\n`int x = 5, y = 10;`\n\n当你在一个语句中声明两个类变量或实例变量但只使用一个初始化器时，你可能会误认为初始化器适用于两个变量。考虑这条语句：\n\
  \n`static int x, y = 5;`\n\n你可能认为 `x` 和 `y` 都会初始化为 `5`。但初始化器只适用于 `y`，因此 `x` 被初始化为它的默认值\
  \ `0`。（如果你在局部变量上犯了这个错误，编译器会对第一个使用变量 `x` 的语句显示错误信息。）\n\n#### 使用 final 变量（常量）\n\n\
  `final 变量（称为常量）是在初始化后无法更改值的变量。` 要声明 final 变量，你在声明中添加 `final` 关键字，如下：\n\n`final int\
  \ WEEKDAYS = 5;`\n\n虽然你可以创建 final 局部变量，但大多数 final 变量都是类变量或实例变量。要创建 final 类（类常量），在声明中添加\
  \ `static final`（而不是 `final static`）：\n\n`static final WEEKDAYS = 5;`\n\n虽然不是强制的，但\
  \ final 变量使用全大写字母是常见的。这样做可以让你一眼识别程序中 final 变量的使用。常量对于在程序多处使用且在运行过程中不改变的值非常有用。假设你正在编写一个带有弹球的游戏，你希望球的半径始终为\
  \ 6 像素。程序可能在多个地方需要直径——在屏幕上画球、判断球是否撞击墙、判断球是否撞击球等。与其在需要半径的地方指定 `6`，不如设置名为 `BALL_RADIUS`\
  \ 的类常量：\n\n`static final BALL_RADIUS = 6;`\n\n使用类常量有两个优点：\n\n- 如果你以后决定球半径应该是 `7`，你只需要在一个地方进行更改：`BALL_RADIUS`\
  \ 常量的初始化器。\n- 常量有助于说明程序的原理。如果使用半径的复杂计算指定 `BALL_RADIUS` 而不是 `6` 将更容易理解。\n\n#### 处理原始数据类型\n\
  \n*数据类型*指的是存储在变量中的数据类型。Java 有时被称为强类型语言，因为当你声明变量时必须指定变量的类型。然后编译器会确保你不会尝试将错误类型的数据赋值变量。以下示例代码会产生编译错误：\n\
  \n```java\nint x;\nx = 3.1415;\n```\n\n因为 `x` 被声明为 `int` 类型变量（存储整数），所以你不能将 `3.1415`\
  \ 赋值给它。\n\n\n\n\n\n## 基本类型\n\n`Primitive types`（基本类型）是由语言本身定义的数据类型。\n\n`Reference\
  \ types`（引用类型）是由 Java 应用程序接口（API）中的类或你创建的类定义的，而不是由语言本身。\n\n基本类型与引用类型之间的区别在于：基本类型变量关联的内存位置包含变量的值。因此，基本类型有时被称为\
  \ `value types`（值类型）。相比之下，与引用类型变量关联的内存位置包含一个地址（称为 `pointer` 指针），它指向实际对象的内存位置。\n\n\
  我在本章稍后的“使用引用类型”节中更详细地解释引用类型，所以如果这个解释现在还不理解，请不要担心。\n\n引用类型是由 Java API 定义而非 Java 语言规范定义的，这种说法并不完全正确。少数引用类型（如\
  \ `Object` 和 `String`）是由 API 中的类定义的，但这些类在 Java 语言 API 中有规定。此外，一种名为 `array`（数组）的特殊类型变量（它可以包含多个基本类型或引用类型的变量）被视为引用类型。\n\
  \nJava 共定义了八种基本类型，如表 2-1 所示。在八种基本类型中，六种用于数字，一种用于字符，一种用于真/假尔值。\n\n### 表 2-1：Java\
  \ 的基本类型\n\n| 类型 | 解释 |\n| :--- | :--- |\n| `int` | 32 位（4 字节）整数值 |\n| `short` |\
  \ 16 位（2 字节）整数值 |\n| `long` | 64 位（8 字节）整数值 |\n| `byte` | 8 位（1 字节）整数值 |\n| `float`\
  \ | 32 位（4 字节）浮点值 |\n| `double` | 64 位（8 字节）浮点值 |\n| `char` | 使用 Unicode 编码方案的 16\
  \ 位字符 |\n| `boolean` | 真（true）或假（false）值 |\n\n## 整数类型\n\n`integer`（整数）是一个整数——即没有分数或小数部分的数字。Java\
  \ 有四种整数类型，你可以用它们来存储不同大小的数字。最常用的整数类型是 `int`。该类型使用 4 字节存储一个整数值，范围大约从负 20 亿到正 20 亿。\n\
  \n### 变量与数据类型操作\n\n如果你正在编写一个计算麦当劳卖出了多少汉堡的应用，`int` 变量可能不够大。在这种情况下，你可以使用 `long` 整数。`long`\
  \ 是一个 64 位整数，可以容纳大约从负 9000 万亿到正 9000 万亿之间的数字。（即使按照联邦赤字标准这也是一个巨大的数字。）\n\n在某些情况下，你可能不需要标准\
  \ `int` 类型那么大的整数。对于这些情况，Java 提供了两种较小的整数类型。`short` 类型表示两位整数，可以存放从 –32,768 到 +32,767\
  \ 的数字，而 `byte` 类型定义了一个 8 位整数，范围从 –128 到 +127。\n\n尽管 `short` 和 `byte` 类型所需的内存比 `int`\
  \ 和 `long` 类型少，但在内存通常充足的桌面应用程序中，通常没有理由使用它们。程序中多出几个字节对大多数程序的性能不会产生任何影响——所以大多数大多数时候你应该坚持使用\
  \ `int` 和 `long`。此外，只有在你知道处理的数字太大超出 `int` 范围时才使用 `long`。\n\n在 Java 中，整数数据类型的大小由语言规定，无论程序运行在什么计算机上都是相同的。这是相对于\
  \ `C` 和 `C++` 语言的巨大改进，后者允许不同平台的编译器来决定整数数据类型的最佳大小。结果是在在一种计算机上编写和测试的 `C` 或 `C++` 程序在另一种计算机上的执行结果可能完全不同。\n\
  \nJava 允许将整数类型 `promote`（提升）为更大的整数类型。例如，Java 允许如下：\n\n```java\nint xInt;\nlong yLong;\n\
  xInt = 32;\nyLong = xInt;\n```\n\n在这里，你可以将 `xInt` 变量的值赋值给 `yLong` 变量，因为 `yLong`\
  \ 比 `xInt` 大。但 Java 不允许相反操作：\n\n```java\nint xInt;\nlong yLong;\nyLong = 32;\nxInt\
  \ = yLong;\n```\n\n`yLong` 变量的值不能赋值给 `xInt`，因为 `xInt` 比 `yLong` 小。由于这种赋值可能会导致数据丢失，Java\
  \ 不允许这样做。（如果你需要将 `long` 赋值给 `int` 变量，必须使用本章稍后“类型转换”节中描述的显式强制转换。）\n\nJava 7 引入的一项特性允许包含下划线以使长数字更易读。因此，以下语句为变量\
  \ `xLong1` 和 `xLong2` 分配了相同的值：\n\n```java\nlong xLong1 = 58473882;\nlong xLong2\
  \ = 58_473_882;\n```\n\n## 浮点类型\n\n`Floating-point`（浮点）数字是带有小数部分的数字。当你需要带有小数点的数字时，应使用浮点数。\n\
  \nJava 有两种浮点基本类型：`float` 使用 4 字节，`double` 使用 8 字节。在几乎所有情况下，当你需要带小数点的数字时应使用 `double`。\n\
  \n浮点值的 `precision`（精度）表示该值可以拥有的有效位。`float` 类型的精度只有六或七位，这对于大多数类型是不够的。相比之下，`double`\
  \ 变量的精度约为 15 位，对于大多数用途都是足够的。\n\n浮点数实际上使用 `exponential notation`（指数符号，也称为科学计数法）来存储其值。这意味着浮点数实际上记录两个数字：基数（称为\
  \ `mantissa` 尾数）和 `exponent`（指数）。浮点的实际值通过尾数乘以 2 的指数幂计算得出。对于 `float` 类型，指数范围从 –127\
  \ 到 +128。对于 `double` 类型，指数范围从 –1023 到 +1024。因此 `float` 和 `double` 变量都能表示非常大或非常小的数字。\n\
  \n关于处理浮点值的一些细节，可以参考第 2 卷第 3 章。当你使用浮点字面量时，应该始终包含小数点，如下所示：\n\n```java\ndouble period\
  \ = 99.0;\n```\n\n## 使用科学计数法 float 和 double\n\n如果你具有科学头，在编写浮点字面量时可能想使用科学计数法。以下语句\n\
  \n```java\ndouble e = 5.10e+6;\n```\n\n等同于\n\n```java\ndouble e = 5100000D;\n```\n\
  \n如果指数为正，符号是可选的，所以你也可以写成\n\n```java\ndouble e = 5.10e6;\n```\n\n注意，指数可以为负以表示小于 1\
  \ 的值。以下语句\n\n```java\ndouble impulse = 23e-7;\n```\n\n等同于\n\n```java\ndouble impulse\
  \ = 0.0000023;\n```\n\n如果省略后缀，默认为 `D`。因此，你通常可以省略双字面量的 `D` 后缀。\n\n\n\n\n\n有趣的是，浮点数有两个不同的零值：负零和正零。你不需要过于担心这些，因为\
  \ Java 将它们视为相等。尽管如此，它们仍然可以作为智力节目《飞问妙答》（*Jeopardy!*）中的一个很好的问题（“我要 200 美元的奇数字题，亚历克斯。”）。\n\
  \n## char 类型\n\n`char` 类型表示 Unicode 字符集中的单个字符。需要注意的是，字符与字符串是不同的；你将在本章晚些后的“处理字符串”章节中学习字符串的内容。现在，只需要意识到\
  \ `char` 变量只能存储一个字符，而不能像字符串那样存储字符序列。\n\n要给 `char` 变量赋值，你需要使用字符字面量，它始终被包含在单引号（apostrophes）而不是双引号中。这里有一个示例：\n\
  \n```java\nchar code = 'X';\n```\n\n在这里，字符 `X` 被赋值给名为 `code` 的变量。\n\n以下语句将无法编译：\n\
  \n```java\nchar code = \"X\"; // error -- 应该使用单引号，而不是双引号\n```\n\n这是因为引号用于标记字符串，而不是字符常量。*Unicode*\
  \ 是一种 2 字节字符代码，可以表示世界上大多数语言中使用的字符。目前，Unicode 字符集中定义了约 35,000 个代码，还有 29,000 个代码未定义。Unicode\
  \ 字符集前 256 个字符与 ASCII 字符集的字符相同，ASCII 是带有西方语言的计算机最常用的字符集。\n\n有关 Unicode 字符集的更多信息，请参阅\
  \ Unicode 官方[网站：www.unicode.org]。\n\n字符字面量还可以使用特殊的*转义序列*（escape sequences）来表示特殊字符。表\
  \ 2-2 列出了允许的转义序列。这些转义序列允许你为无法在字符常量输入的字符创建字面量。\n\n### 表 2-2：字符常量的转义序列\n\n| 转义序列 |\
  \ 解释 |\n| :--- | :--- |\n| `\\b` | 退格 |\n| `\\t` | 水平表符 |\n| `\\n` | 换行符 |\n| `\\\
  f` | 分页符 |\n| `\\r` | 回车符 |\n| `\\\"` | 双引号 |\n| `\\'` | 单引号 |\n| `\\\\` | 反斜杠 |\n\
  \n## Boolean 类型\n\n`Boolean` 类型可以取两个值之一：`true` 或 `false`。布尔值用于执行逻辑操作，最常见的是判断某个条件是否为真。例如：\n\
  \n```java\nboolean enrolled = true;\nboolean credited = false;\n```\n\n在这里，声明并初始化了一个类型为\
  \ `boolean` 的变量 `enrolled`，值为 `true`；并声明并初始化另一个名为 `credited` 的布尔变量，值为 `false`。\n\
  \n在某些语言（如 `C` 或 `C++`）中，整数值可以被布尔值，0 等于 `false`，任何其他值等于 `true`。Java 则不然。在 Java 中，你不能在整数类型和\
  \ `boolean` 类型之间进行转换。\n\n## 包装类\n\n每个基本类型在 Java API 类库中都有一个对应的类。这个类有时被称为*包装类*（wrapper\
  \ class），因为它用面向对象等效的精美包装纸和蝴蝶结将基本值包装起来，使得基本类型在看起来和行为上都像一个对象。表 2-3 列出了八种基本类型的包装类。\n\
  \n正如你在本章晚些时候会的，你可以使用这些包装类将基本值转换为字符串，反之亦然。\n\n### 表 2-3：基本类型的包装类\n\n| 基本类型 | 包装类\
  \ |\n| :--- | :--- |\n| `int` | `Integer` |\n| `short` | `Short` |\n| `long` | `Long`\
  \ |\n| `byte` | `Byte` |\n| `float` | `Float` |\n| `double` | `Double` |\n| `char`\
  \ | `Character` |\n| `boolean` | `Boolean` |\n\n## 使用引用类型\n\n在第 3 卷第 1 章中，你将接触面向对象编程的基本概念。特别是，你会看到所有\
  \ Java 程序是如何由一个或多个类组成的，以及如何使用类来创建对象。在本节中，我将展示如何创建可以与类创建的对象协作的变量。\n\n首先，*引用类型*（reference\
  \ type）是一种基于类的类型，而不是基于 Java 语言内置的基本类型之一。引用类型可以基于 Java API 类库提供的类，也可以基于你自己编写的类。无论何种，当你从类创建对象时，\
  \ Java 会分配存储该对象所需的任何内存。然后，如果你将对象赋值给变量，该变量实际上赋值的是对象的*引用*，而不是对象本身。该引用是存储对象的内存位置的地址。\n\
  \n假设你正在编写一个涉及球的程序程序，你创建了一个名为 `Ball` 的类来定义球的行为。要声明一个可以引用 `Ball` 对象的变量，你使用如下语句：\n\n\
  ```java\nBall b;\n```\n\n在这里，变量 `b` 是类型为 `Ball` 的变量。\n\n要从类创建对象的新实例，你使用 `new` 关键字加上类名。对类名的第二次引用实际上是对该类中一个特殊例程的调用，称为*构造函数*（constructor）。构造函数负责初始化新对象。\n\
  \n\n\n\n\n# 字符串的声明与初始化\n\n字符串的声明和初始化与基本类型非常。事实上，你最初可能注意到的唯一区别是 `String` 的首字母大写，这与像\
  \ `int` 和 `double` 这样的基本类型关键字不同。这是因为 `String` 并不是关键字。相反，它是 Java API 类名，用于提供字符串对象。\n\
  \n以下语句定义并初始化了一个字符串变量：\n\n```\nString s;\ns = \"Hello, World!\";\n```\n\n这里声明了一个类型为\
  \ `String` 的名为 `s` 的变量，并用字符串字面量（string literal） `\"Hello, World!\"` 进行初始化。注意，字符串字面量包含在双内，而不是单引号。单引号用于字符字面量（character\
  \ literals），它们与字符串字面量不同。\n\n与变量声明一样，字符串声明也可以包含初始化器。因此，你可以在一个语句中声明并初始化字符串变量，如下：\n\
  \n```java\nString s = \"Hello, World!\";\n```\n\n类变量和实例变量会自动初始化为空字符串，但局部变量不会。要将局部字符串变量初始化为空字符串，可以使用如下语句：\n\
  \n```java\nString s = \"\";\n```\n\n# 组合字符串\n\n使用加号（`+`）作为连接运算符（concatenation operator）组合两个字符串。（在\
  \ Java 术语中，组合字符串被称为连接 concatenation.）以下语句将两个字符串变量的值组合创建一个第三个字符串：\n\n```java\nString\
  \ hello = \"Hello, \";\nString world = \"World!\";\n```\n\n# 使用变量与数据类型\n\n```java\n\
  String greeting = hello + world;\n```\n\n`greeting` 变量的最终值为 `\"Hello, World!\"`。\n\
  \n当 Java 连接字符串时，不会在字符串之间插入任何空格。因此，如果你想组合两个字符串并在它们之间显示空格，请确保第一个字符串以空格结尾，或者第二个字符串以空格开头。（在上例中，第一个字符串以空格结尾。）\n\
  \n或者，你可以将字符串字面量与字符串变量连接。例如：\n\n```java\nString hello = \"Hello\";\nString world\
  \ = \"World!\";\nString greeting = hello + \", \" + world;\n```\n\n在这里，出现在 Hello\
  \ 和 World 之间的逗号和空格作为字符串字面量被插入。\n\n连接是最常用的字符串处理技术之一，因此你在书中可以看到很多例子。事实上，我在这章中已经使用过一次连接了。早些，我向你展示了一个包含以下行的程序：\n\
  \n```java\nSystem.out.println(\"The value of i is \" + i);\n```\n\n在这里，`System.out`\
  \ 对象的 `println` 方法打印当字面量 `\"The value of i is \"` 与变量 `i`的值连接时生成的字符串。\n\n# 将基本类型转换为字符串\n\
  \n由于字符串连接允许你组合两个或多个字符串值，而且由于 `int` 和 `double` 等基本类型**不是**字符串类型，你可能在好奇上一节中的最后一个示例是如何工作的。换句话说，Java\
  \ 如何在这一语句中将字符串字面量 `\"The value of i is \"` 与整数值 `i` 连接起来呢？\n\n```java\nSystem.out.println(\"\
  The value of i is \" + i);\n```\n\n答案是，当你在连接中使用基本值时，Java 会自动将基本值转换为字符串值。\n\n你可以通过基本类型包装类的\
  \ `toString` 方法显式地将基本值转换为字符串。例如，要将 `int` 变量 `x` 转换为字符串，你可以使用此语句：\n\n```java\nString\
  \ s = Integer.toString(x);\n```\n\n在下一章中，你将发现如何使用名为 `Number Format` 的特殊类将基本类型转换为字符串，同时对值应用各种类型的格式化，例如添加逗号、美元符号或百分比标记。\n\
  \n# 将字符串转换为基本类型\n\n将基本值转换为字符串值非常简单。反过来——将字符串值转换为基本类型——则稍微复杂一些，因为并不总是有效。例如，如果字符串包含值\
  \ `10`，你可以轻松地将其转换为整数。但如果字符串包含的是三十二，你却做不到。\n\n要将字符串转换为基本类型，你使用表 2-4 所示的相应包装类的 `parse`\
  \ 方法。要将字符串值转换为整数，你使用如下的语句：\n\n```java\nString s = \"10\";\nint x = Integer.parseInt(s);\n\
  ```\n\n### 表 2-4：将字符串转换为数值型基本类型的方法\n\n| 包装类 | parse 方法 | 示例 |\n| :--- | :--- | :---\
  \ |\n| Integer | `parseInt(String)` | `int x = Integer.parseInt(\"100\");` |\n|\
  \ Short | `parseShort(String)` | `short x = Short.parseShort(\"100\");` |\n| Long\
  \ | `parseLong(String)` | `long x = Long.parseLong(\"100\");` |\n| Byte | `parseByte(String)`\
  \ | `byte x = Byte.parseByte(\"100\");` |\n| Float | `parseFloat(String)` | `float\
  \ x = Float.parseFloat(\"19.95\");` |\n| Double | `parseDouble(String)` | `double\
  \ x = Double.parseDouble(\"19.95\");` |\n| Character | (无) | |\n| Boolean | `parseBoolean`\
  \ | `boolean x = Boolean.parseBoolean(\"true\");` |\n\n当然，你并没有真正的理由这样做，但正如你稍后看到的，你可以使用\
  \ `parse` 方法将用户输入的值转换为基本类型。这样你就可以通过控制台输入数值数据。注意，将 `String` 转换为 `Character` 不需要 `parse`\
  \ 方法。如果你需要这样做，你可以在第 4 章中找到。\n\n# 转换与强制转换数值数据\n\n有时，你需要将一种类型的数值数据转换为另一种类型。你可能需要将\
  \ `double` 值转换为整数，反之亦然。某些转换可以自动完成；其他则通过称为强制转换的技术完成。我在后续章节中描述自动转换和强制转换。\n\n## 自动转换\n\
  \nJava 在需要时会自动将某些基本类型转换为其他类型。图 2-1 显示了允许哪些转换。注意图中用虚线表示的转换可能会丢失值的精度。例如，`int` 可以转换为\
  \ `float`，但较大的 `int` 值可能无法被 `float` 类型精确表示。\n\n每当你对两个类型不相同的值进行数学运算时，Java 会自动将其中一个转换为另一种。以下是\
  \ Java 在此时遵循的规则：\n\n- 如果其中一个值是 `double`，则另一个值转换为 `double`。\n- 如果两者都不是 `double` 但其中一个是\
  \ `float`，则另一个转换为 `float`。\n- 如果两者都不是 `double` 也不是 `float` 但其中一个是 `long`，则另一个转换为\
  \ `long`。\n- 如果所有尝试都失败，则两个值都转换为 `int`。\n\n## 类型强制转换\n\n强制转换* 与转换相似，但不是自动的。你使用强制转换来执行图\
  \ 2-1 中未显示的转换。例如，如果你想将 `double` 转换为 `int`，你必须使用 `casting`。\n\n当你使用强制转换时，面临着丢失信息的风险。例如，`double`\
  \ 可以存储比 `int` 更大的数字。此外，`int` 无法存储 `double` 的小数部分。因此，如果你将 `double` 强制转换为 `int`，你面临着丢失数据或准确性的风险，例如\
  \ `3.1415` 会变成 `3`。\n\n要将基本值从一种类型强制转换为另一种类型，你使用 强制转换运算符，它简单就是放在要转换值之前的括号基本类型名称。例如：\n\
  \n```java\ndouble pi = 3.1314;\nint iPi;\niPi = (int) pi;\n```\n\n\n\n\n注意，当 `double`\
  \ 转换为 `integer` 时，其小数部分会被直接丢弃，而不是四舍五入。例如：\n\n```java\ndouble price = 9.99;\nint\
  \ iPrice = (int) price;\n```\n\n在这里 `iPrice` 被赋值为 `9`。如果你想在转换 `double` 值时进行四舍五入，可以使用\
  \ `Math` 类的 `round` 方法，正如我在下一章展示的那样。\n\n## 框内思考\n\n## 变量与数据类型\n\n从 1.5 版本开始，Java\
  \ 语言支持装箱（boxing）和拆箱（unboxing）。当 Java 将原始值转换为其对应的包装对象时，就会发生 `Boxing`；当 Java 执行反向操作（从包装对象转换为对应的原始值）时，就会发生\
  \ `unboxing`。这里是一个示例：\n\n```java\nInteger wrap = 10;\nSystem.out.println(wrap);\n\
  int prim = wrap;\nSystem.out.println(prim);\n```\n\n这段代码的输出是 `10` 紧接着是另一个 `10`。在第一行中，你将一个原始值\
  \ `10` 赋值给名为 `wrap` 的包装对象。信不信，Java 做了大量工作才把这个小数字 `10` 放入一个漂亮的 `Integer` 包装器中。在第三行代码中，Java\
  \ 将大的包装对象 `wrap` 转回原始值 `10`（因为变量 `prim` 的类型是 `int`）。同样，Java 在后台完成了一些工作。\n\n将 `boxing`\
  \ 和 `unboxing` 视为 `wrapping` 和 `unwrapping` 的外号即可。核心点是，Java 可以自动包装和拆箱值。这非常方便。\n\n\
  ## 理解作用域\n\n变量的 `scope`（作用域）指的是变量在类的哪些部分存在。简单来说，每个变量只存在于声明它的块中，以及包含该块的任何块中。这就是为什么在类体中定义的\
  \ `class` 变量和实例变量可以被该类定义的任何方法访问，但在方法内部定义的局部变量只能由定义它的方法访问。\n\n在 Java 中，一个 `block`（块）由一对匹配的大括号标记。Java\
  \ 有许多种块，包括类体、方法体以及属于 `if` 或 `for` 语句的块语句。但在每情况下，块都标记了在其内部声明的变量的作用域边界。\n\n列表 2-1\
  \ 中的程序可以帮助理类变量和局部变量的作用域。\n\n### 列表 2-1：演示类变量和局部变量作用域的程序\n\n```java\npublic class\
  \ ScopeApp {\n    static int x;\n    public static void main(String[] args) {\n\
  \        x = 5;\n        System.out.println(\"main: x = \" + x);\n        myMethod();\n\
  \    }\n    public static void myMethod() {\n        int y;\n        y = 10;\n \
  \       if (y == x + 5) {\n            int z;\n            z = 15;\n           \
  \ System.out.println(\"myMethod: z = \" + z);\n        }\n        System.out.println(\"\
  myMethod: x = \" + x);\n        System.out.println(\"myMethod: y = \" + y);\n  \
  \  }\n}\n```\n\n接下来的章节解释了此类中使用的每个变量的作用域：\n\n- `2`：变量 `x` 是一个类变量。它的作用域从第 2 行开始，到第\
  \ 27 行结束。因此，`main` 方法和 `myMethod` 方法都可以访问它。\n- `16`：变量 `y` 是局部变量，在第 16 行初始化。因此，它的作用域从第\
  \ 16 行开始，到第 25 行结束（即 `myMethod` 方法体的结束处）。\n- `17`：变量 `z` 是一个局部变量，在第 17 行属于 `if`\
  \ 语句的语句块中声明并初始化。\n- `22`：变量 `z` 的作用域从第 20 行变量初始化时开始，到第 22 行语句块结束结束。\n\n当你运行此程序时，将得到以下输出：\n\
  \n```\nmain: x = 5\nmyMethod: z = 15\nmyMethod: x = 5\nmyMethod: y = 10\n```\n\n\
  严格来说，局部变量的作用域从变量初始化时开始，到包含该变量声明的块结束结束。相比之下，类变量或实例变量的作用域是声明该的整个类。这意味着你可以在物理上出现在变量声明之前的方法中使用类变量或实例变量，但你不能在声明局部变量之前使用\n\
  \n## 变量遮蔽\n\n`shadowed variable`（遮蔽变量）是指原本可以访问，但因为在更直接的作用域中声明了同名变量而导致其暂时不可用的变量。这听起来很绕，但列表\
  \ 2-2 中的示例一目了然。\n\n### 列表 2-2：演示遮蔽的类\n\n```java\npublic class ShadowApp {\n    static\
  \ int x;\n    public static void main(String[] args) {\n        x = 5;\n       \
  \ System.out.println(\"x = \" + x);\n        int x;\n        x = 10;\n        System.out.println(\"\
  x = \" + x);\n        System.out.println(\"ShadowApp.x = \" + ShadowApp.x);\n  \
  \  }\n}\n```\n\n以下段落解释了程序中的作用域问题：\n\n- `2`：变量 `x` 是类变量。它的作用域是整个类，从第 2 行到第 17 行。\n\
  - `8–9`：类变量 `x` 在第 8 行被赋值为 5。然后该值在第 9 行打印到控制台。\n- `10`：在第 10 行声明了一个局部变量 `x`。该变量遮蔽了类变量\
  \ `x`。\n- `11`：局部变量 `x` 在第 11 行初始化。从那时起，它进入作用域，直到方法结束。\n- `12`：第 12 行的 `System.out.println`\
  \ 语句打印局部变量 x。注意此语句与第 9 行打印类变量的语句相同。\n- `14`：当类变量被遮蔽时，你可以通过指定类名来访问它，如第 14 行所示。在这里\
  \ `ShadowApp.x` 指类变量。\n- `15`：当 `main` 方法在第 15 行结束时，类变量不再被遮蔽。\n\n你从此程序获得的输出如下：\n\
  \n```\nx = 5\nx = 10\nShadowApp.x = 5\n```\n\n## 使用 System.out 打印数据\n\n你已经见过几个使用\
  \ `System.out.println` 在控制台上显示输出的程序。在接下来的章节中，我将正式向你展示该方法的工作原理，以及一个名为 `print` 的相关方法。\n\
  \n## 使用标准输入输出流\n\nJava 程序设计用于在终端输入输出（I/O）环境中运行。每个 Java 程序都可以使用三个 *I/O streams*，这些流是为基于终端的输入输出而设计的，每次发送或接收一个字符。这三个流是：\n\
  \n**标准输入：** 用于接收输入数据的流。该流通常连接到运行程序的计算机的键盘。这样，用户就可以将字符输入到标准输入流中。\n\n在本章稍后的“使用 Scanner\
  \ 类获取输入”节中，你\n\n\n\n\n将此输入流连接到名为 `Scanner` 的类，这使得从标准输入流读取原始数据类型变得简单。\n\n### » 标准输出\n\
  一种用于在屏幕上显示文本输出的流。\n\n## 变量与数据类型\n当你在 Windows 下运行 Java 程序时，会打开一个特殊的控制窗口，标准输出流会连接到那里。然后，你发送到标准输出的任何文本都会显示在该窗口中。\n\
  \n### » 标准错误\n另一个用于输出的流。该流也连接到控制窗口。因此，写入标准输出流的文本往往与写入错误流的文本交织在一起。\n\nWindows 和其他操作系统允许你将标准输出重定向（`redirect`）到其他目标——通常是一个文件。当你这样做时，只有标准输出数据会被重定向。写入标准错误的的文本仍然显示在控制窗口中。\n\
  \n要重定向标准输出，你需要在运行 Java 类的命令中使用一个大于号（`>`）符号，其后跟上你想要保存标准输出文本的文件名。这是一个示例：\n\n```cmd\n\
  C:\\Java> java TestApp >output.txt\n```\n\n在这里，由 `TestApp` 类创建的标准输出被保存在一个名为 `output.txt`\
  \ 的文件中。然而，发送到标准错误流的任何文本仍然出现在控制窗口中。因此，标准错误流对于那些使用输出重定向来显示状态消息、错误消息或其他程序的有用。\n\n当你使用单个\
  \ `>` 符号进行重定向时，如果重定向的文件已存在，Windows 将覆盖该文件。如果你喜欢向现有文件的末尾添加内容，请使用两个大于号，如下：\n\n```cmd\n\
  C:\\Java> java TestApp >>output.txt\n```\n\n那么，如果 `output.txt` 文件已存在，`TestApp` 类写入标准输出的任何内容都将添加到现有\
  \ `output.txt` 文件的末尾。\n\n所有三个标准流都可以通过 `System` 类的字段供每个 Java 程序使用，见表 2-5。\n\n**表\
  \ 2-5：System 对象的静态字段**\n\n| 字段 |  |\n| :--- | :--- |\n| `System.in` | 标准输入 |\n|\
  \ `System.out` | 标准输出 |\n| `System.err` | 标准错误 |\n\n### 使用 System.out 和 System.err\n\
  `System.out` 和 `System.err` 都代表名为 `PrintWriter` 的类的实例，该类定义了用于向控制台写入数据的 `print` 和\
  \ `println` 方法。你可以使用这两种方法分别配合 `String` 参数或任何原始数据类型的参数。\n\n`print` 方法和 `println`\
  \ 方法之间的唯一区别是，`println` 方法在输出末尾添加了一个换行符，因此下一次调用 `print` 或 `println` 的输出将从新行开始。\n\n\
  由于 `print` 方法不会开始新行，所以当你想在同一行打印两个或多个项目时，`print` 方法是非常实用的。这是一个示例：\n\n```java\nint\
  \ i = 64;\nint j = 23;\nSystem.out.print(i);\nSystem.out.print(\" and \");\nSystem.out.println(j);\n\
  ```\n\n这些行产生的控制台输出是：\n```\n64 and 23\n```\n\n注意，你可以通过使用字符串拼接使用单个 `println` 调用来实现相同的操作，如下：\n\
  \n```java\nint i = 64;\nint j = 23;\nSystem.out.println(i + \" and \" + j);\n```\n\
  \n### 使用 Scanner 类获取输入\n在 Java 1.5 之前，在基于控制的 Java 程序中获取用户的文本输入并不简单。但 Java 1.5 引入了一个新类——名为\
  \ `Scanner`——来简化从用户获取输入的任务。在接下来的章节中，你将使用 `Scanner` 类从用户获取简单的输入值。我在这里介绍的技术将用于书中后面显示的许多程序中。\n\
  \n如果你在使用旧版本的 Java，你仍然应该阅读这一节，因为书中的许多程序都使用了 `Scanner` 类。然而，你也应该阅读下一节“使用 JOptionPane\
  \ 类获取输入”，因为该节描述了另一种适用于早期版本 Java 的获取用户输入的方法。\n\n### 变量与数据类型\n在接下来的整个章节中，我引用了列表 2-3\
  \ 显示的程序。这个简单的程序使用 `Scanner` 类从用户处读取一个整数值，然后将该值显示回控制台，以验证程序接收到了用户输入的值。以下是该程序的控制窗口示例：\n\
  \n```\nEnter an integer: 5\nYou entered 5.\n```\n\n程序首先在第一行显示消息 `Enter an integer:`。然后它等待你输入一个数字。当你输入一个数字（例如\
  \ 5）并按下回车键时，它会在第二行显示确认消息（`You entered 5.`）。\n\n**列表 2-3：使用 Scanner 类的程序**\n```java\n\
  import java.util.Scanner;\n\npublic class ScannerApp {\n    static Scanner sc =\
  \ new Scanner(System.in);\n\n    public static void main(String[] args) {\n    \
  \    System.out.print(\"Enter an integer: \");\n        int x = sc.nextInt();\n\
  \        System.out.println(\"You entered \" + x + \".\");\n    }\n}\n```\n\n###\
  \ 导入 Scanner 类\n在使用 `Scanner` 类之前，你必须导入它。为了做到这一点，在程序开头编写一个导入语句，如列表 2-3 第 1 行所示：\n\
  \n```java\nimport java.util.Scanner;\n```\n\n注意 `java` 和 `util` 没有大写，但 `Scanner`\
  \ 有。如果你使用 `java.util` 包中的其他类，可以通过如下导入语句导入整个包：\n\n```java\nimport java.util.*;\n\
  ```\n\n#### 声明并创建 Scanner 对象\n在使用 `Scanner` 类从控制台读取输入之前，你必须声明一个 `Scanner` 变量并创建\
  \ `Scanner` 实例。我建议将 `Scanner` 变量创建为类变量，并在初始化器中创建，如 2-3 第 6 行所示：\n\n```java\nstatic\
  \ Scanner sc = new Scanner(System.in);\n```\n\n这样你就可以类的任何方法中使用 `sc` 变量。要创建一个 `Scanner`\
  \ 对象，你需要使用 `new` 关键字后调用 `Scanner` 构造函数。注意 `Scanner` 需要一个参数指示输入来源。在这里可以使用 `System.in`\
  \ 指定标准输入。\n\n#### 获取输入\n要从用户处读取输入值，可以使用表 2-6 列出的 `Scanner` 类的方法。如你所示，原始数据类型都有对应的方法。\n\
  \n**表 2-6：获取输入的 Scanner 类方法**\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `nextBoolean()`\
  \ | 从用户处读取布尔值。 |\n| `nextByte()` | 从用户处读取字节值。 |\n| `nextDouble()` | 从用户处读取双浮点值。\
  \ |\n| `nextFloat()` | 从用户处读取浮点值。 |\n| `nextInt()` | 从用户处读取整数值。 |\n| `nextLine()`\
  \ | 从用户处读取字符串值。 |\n| `nextLong()` | 从用户处读取长整数值。 |\n| `nextShort()` | 从用户处读取短整数值。\
  \ |\n\n注意表格的第一列，每个方法列表都以该方法返回的值类型开头。例如，`nextInt` 方法返回 `int` 值。此外，注意每个方法都以一对空括号结束。这意味着这些方法不需要参数。如果某个方法确实需要参数，参数将在这些括号内。\n\
  \n由于这些方法从用户处读取值并返回该值，你通常将它们用于将值赋值给变量的语句。例如，列表 2-3 第 11 行读取一个整数并赋值给名为 `x` 的变量。当执行\
  \ `nextInt` 方法时，程序会等待用户输入一个\n\n\n\n\n控制台窗口中的值。为了让用户知道程序期望什么类型的输入，通常你应该在调用获取输入的 `Scanner`\
  \ 方法之前，先调用 `System.out.print` 方法。列表 2-3 中的第 10 行调用了 `System.out.print` 在控制台上显示 `Enter\
  \ an integer:` 消息。这样，用户就知道程序正在等待输入。\n\n如果用户输入了无法转换为正确类型的值，程序就会`crashes`崩溃，这意味着程序会意外终止。当程序崩溃时，它会显示一条晦涩的错误信息，指示失败的原因。例如，如果你输入\
  \ `three` 而不是实际数字，控制台窗口看起来如下：\n\n```\nEn r an integer: three Exception in thread\
  \ \"main\" java.util.\nInputMismatchException\nat java.util.Scanner.throwFor(Scanner.java:819)\n\
  at java.util.Scanner.next(Scanner.java:1431)\nat java.util.Scanner.nextInt(Scanner.java:2040)\n\
  at java.util.Scanner.nextInt(Scanner.java:2000)\nat ScannerApp.main(ScannerApp.java:11)\n\
  ```\n\n此消息表示发生了一个名为 `InputMismatchException` 的`exception`，这意味着程序期望看到一个整数，但实际得到了其他内容。在第\
  \ 2 卷第 8 章中，你将学会处理此类异常，以便程序能够显示更友好的消息并让用户再次尝试输入正确的值。在此之前，你必须接受这样一个事实：如果用户输入了错误数据，你的程序就会不优雅地崩溃。\n\
  \n你可以通过先使用表 2-7 中列出的方法之一来测试下一个输入以确保其有效，从而防止 `nextInt` 和类似方法因错误的输入数据而崩溃。我还没有介绍执行此测试测试所需的\
  \ Java 语句，但别担心；在第 2 卷第 8 章，我会向你展示解决方案。\n\n第 2 章 **变量与数据类型操作** 95\n\n![Image 18](img/index-118_1.png)\n\
  \n**表 2-7**\n\n**检查有效输入值的 Scanner 类方法**\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `boolean\
