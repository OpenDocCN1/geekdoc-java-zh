  \n#### 使用括号分组\n\n当你用括号标记一组字符时，匹配的文本会被*捕获*，以便你可以在模式的后续使用它。被捕获的组被称为*捕获组*，并从 1 开始编号。然后你可以使用反斜杠加上组号，指示该文本必须匹配捕获的文本。\n\
  \n假设遵循模式 `\\w\\d-\\w\\d` 的机器人在第二个和第五个字符具有相同的数字。也就是说，`r2-d2` 和 `b9-k9` 是有效的机器人名称，但\
  \ `r2-d4` 和 `d3-r4` 不是。\n\n第 2 章 **使用正则表达式** 517\n\n这里有一个可以此类名称的示例：\n\n输入正则表达式：`\\\
  w(\\d)-\\w\\1`\n\n输入字符串：`r2-d2`\n\n匹配。\n\n输入字符串：`d3-r4`\n\n不匹配。\n\n输入字符串：`b9-k9`\n\
  \n匹配。\n\n在这里 `\\1` 指向第一个捕获组。因此，字符串的最后一个字符必须与第二个字符相同，后者必须是数字。\n\n#### 使用管道符号\n\n\
  竖线（`|`）符号定义了“或”操作，允许你创建接受两种或更多变体的模式。这里是验证机器人名称的改进模式：\n\n输入正则表达式：`(\\w\\d-\\w\\d)|(\\\
  w-\\d\\w\\w)`\n\n输入字符串：`r2-d2`\n\n匹配。\n\n输入字符串：`c-3po`\n\n匹配。\n\n`|` 字符表示左侧组或右侧组中的任意一个可用于匹配字符串。左侧组匹配一个单词字符，\n\
  \n\n\n\n一个数字、一个连字符、一个字符以及另一个数字。右侧的组匹配一个字符、一个连字符、一个数字和两个字符。\n\n你可能想在 `|` 起作用的整个模式部分周围再使用一组括号。这样你就可以在\
  \ `|` 组之前或之后添加模式元素。如果你想让用户输入带或不带括号的电话区号怎么办？这里有一个可以实现该功能的正则表达式模式：\n\n输入正则表达式：`((\\\
  d{3} )|(\\(\\d{3}\\) ))?\\d{3}-\\d{4}` \n\n输入字符串：`(559) 555-1234`\n\n匹配。\n\n输入字符串：`559\
  \ 555-1234`\n\n匹配。\n\n输入字符串：`555-1234`\n\n匹配。\n\n518 页 第 5  **编程技巧**\n\n该模式的第一部分是一个组，由两个用\
  \ `|` 字符分隔的较小组组成。这些组中的第一个匹配不带括号且后跟空格的区号，第二个匹配带括号且后跟空格的区号。因此，外层组匹配带或不带括号的区号。这整个组后面跟着一个问号，标记为可选；然后模式继续是三个数字、一个连字符和四个数字。\n\
  \n# 使用正则表达式\n\n## 在 Java 程序中\n\n到目前为止，本章节向你展示了创建正则表达式的基础知识。接下来的章节将向你展示如何在 Java 程序中使用它们。\n\
  \n#### 理解字符串问题\n\n在介绍用于处理正则表达式的类之前，我想向你介绍一下 Java 在处理包含正则表达式的字符串时面临的一个问题。正如你在整个章节中所看到的，正则表达式模式依赖于反斜杠字符来标记模式的不同元素。坏消息是，Java\
  \ 将字符串字面量中的反斜杠字符视为转义字符。因此，你不能直接在字符串字面量中引用正则表达式，因为 Java 在反斜杠到达正则表达式类之前就已经将其“偷走”了。\n\
  \n在大多数情况下，编译器会直接抱怨字符串字面量不正确。以下行无法编译：\n\n```\nString regex = \"\\w\\d-\\w\\d\"; //\
  \ ：无法编译\n```\n\n编译器看到字符串中的反斜杠，并期望找到一个有效的 Java 转义序列，而不是正则表达式。\n\n遗憾的是，这个问题的解决办法很丑：你必须在任何出现反斜杠的地方都将其双倍。Java\
  \ 将两个连续的反斜杠视为转义后的反斜杠，并在字符串中放置单个反斜杠。因此，你必须这样编写前一个示例中的语句：\n\n```\nString regex = \"\
  \\\\w\\\\d-\\\\w\\\\d\"; // 现在可以编译了\n```\n\n在这里，我在正则表达式中需要的每个反斜杠在字符串字面量中都编码为一对反斜杠。\n\
  \n第 2 章 **使用正则表达式** 519 页\n\n如果你不确定字符串字面量编写得是否正确，只需使用 `System.out.println` 打印生成的字符串。然后你可以检查控制台输出，以确保你写对了字符串字面量。如果我在前面的语句后跟随\
  \ `System.out.println(regex)`，控制台将出现输出：\n\n```\n\\w\\d-\\w\\d\n```\n\n因此，我知道我正确编码了用于正则表达式的字符串字面量。\n\
  \n#### 与 String 类使用正则表达式\n\n如果你对正则表达式的需求仅是检查字符串是否匹配某种模式，可以使用 `String` 类的 `matches`\
  \ 方法。该方法接受一个正则表达式作为参数，并返回一个布尔值，指示字符串是否匹配该模式。\n\n这里有一个验证机器人（droid）名称的静态方法：\n\n```java\n\
  private static boolean validDroidName(String droid)\n{\n    String regex = \"(\\\
  \\w\\\\d-\\\\w\\\\d)|(\\\\w-\\\\d\\\\w\\\\w)\";\n    return droid.matches(regex);\n\
  }\n```\n\n在这里，机器人名称通过参数传递，方法返回一个布尔值，指示机器人名称是否有效。该方法简单地从字符串字面量创建一个正则表达式，然后使用机器人字符串的\
  \ `matches` 方法来匹配模式。\n\n你还可以使用 `split` 方法根据匹配正则表达式的分隔符将字符串拆分为 `String` 对象的数组。实现此点的一种常用方法是直接创建一个可以作分隔符的自定义字符类，例所示：\n\
  \n```java\nString s = \"One:Two;Three|Four\\tFive\";\nString regex = \"[:;|\\\\\
  t]\";\nString strings[] = s.split(regex);\nfor (String word : strings)\n    System.out.println(word);\n\
  ```\n\n在这里，一个字符串被拆分为由冒号、分号、竖线或制表符标记的单词。当你运行此程序时，控制台将显示以下文本：\n\n```\nOne\nTwo\nThree\n\
  Four\nFive\n```\n\n520 页 第 5 ** **编程技巧**\n\n#### 使用 Pattern 和 Matcher 类\n\n`matches`\
  \ 方法对于偶尔使用正则表达式很好，但如果你想让你的程序执行大量的模式匹配，你应该改用 `Pattern` 和 `Matcher` 类。`Pattern` 类表示一个已编译为可执行形式的正则表达式。（记住，正则表达式就像小程序。）然后，你可以使用编译后的\
  \ `Pattern` 对象来创建 `Matcher` 对象，并用它来匹配字符串。\n\n`Pattern` 类本身非常简单。尽管它有大约十个方法，但你通常只需要使用两个：\n\
  \n- `static Pattern compile(String pattern)`：编译指定的模式。该静态方法返回一个 `Pattern` 对象。如果模式包含错误，它会抛出\
  \ `PatternSyntaxException`。\n- `Matcher matcher(String input)`：创建一个匹配此模式的 `Matcher`\
  \ 对象。\n\n首先，你使用 `compile` 方法创建一个 `Pattern` 实例。（Pattern 是那些没有构造函数的奇怪类之一。它依赖于静态 `compile`\
  \ 方法来创建实例。）获取 `Pattern` 实例后，你使用 `matcher` 方法创建一个 `Matcher` 类的实例。\n\n就本书而言，我只关心 `matches`\
  \ 方法：`static boolean matches()`。\n\n为了说明如何使用这些方法，这里是 `validDroidName` 方法的增强版本，它为机器人验证正则创建一个模式并将其保存在静态类字段中：\n\
  \n```java\nprivate static Pattern droidPattern;\nprivate static boolean validDroidName(String\
  \ droid)\n{\n    if (droidPattern == null)\n    {\n        String regex = \"(\\\\\
  w\\\\d-\\\\w\\\\d)|\"\n        + \"(\\\\w-\\\\d\\\\w\\\\w)\";\n        droidPattern\
  \ = Pattern.compile(regex);\n    }\n    Matcher m = droidPattern.matcher(droid);\n\
  \    return m.matches();\n}\n```\n\n在这里，私有类字段 `droidPattern` 保存了编译后的模式。`validDroidName`\
  \ 方法中的 `if` 检查模式是否已经创建。如果没有，则通过调用 `Pattern` 类的静态 `compile` 方法创建模式。然后使用 `matcher`\
  \ 方法为传入的字符串创建一个 `Matcher` 对象，并通过调用 `Matcher` 对象的 `matches` 方法来验证字符串。\n\n\n\n\n\n\
  递归是一种基础的编程技术，方法通过调用自己来解决某些问题。使用这种技术的方法被称为递归方法。\n\n许多编程问题只有通过递归才能解决，而某些可以通过其他技术解决的问题，用递归解决效果更好。\n\
  \n我不确定，但我认为“递归（recursion）”一词源于拉丁语 *recurse,*、*recurset,*、*recursum,*，意思是“反复地诅咒”。我确定的是，当许多程序员在挣扎复杂的递归编程问题时，他们的感觉确实很想诅咒。\n\
  \n确实，递归的概念可能有点复杂。许多程序员都会避开它，寻找其他技术来解决眼下的问题，在很多情况下，非递归解决方案是最好的。然而，许多问题确实需要递归。\n\n\
  ## 计算经典的阶乘示例\n\n引入递归的经典问题之一是计算整数的阶乘。任何给定整数的阶乘——我称其为 `n` 以便我听起来更有数学味——都是从 1 到 `n`\
  \ 的所有整数的乘积。因此，5 的阶乘是 120：5 × 4 × 3 × 2 × 1。\n\n### 非递归解决方案\n\n你不需要使用递归来计算阶乘。相反，你可以使用一个简单的\
  \ `for` 循环。这里有一个接受 `int number` 并返回该数字阶乘的 `long` 类型的方法：\n\n```java\nprivate static\
  \ long factorial(int n) {\n    long f = 1;\n    for (int i = 1; i <= n; i++)\n \
  \       f = f * i;\n    return f;\n}\n```\n\n该方法使用 `for` 循环从 1 计数到该数字，在此过程中跟踪乘积。这里是调用该方法并显示结果的代码片段：\n\
  \n```java\nint n = 5;\nlong fact;\nfact = factorial(n);\nSystem.out.println(\"The\
  \ factorial of \"+ n + \" is \" + fact + \".\");\n```\n\n如果你运行这段代码，控制台上将显示以下行：\n\
  `The factorial of 5 is 120.`\n\n阶乘增长非常快。你应该使用 `long` 而不是 `int` 来计算结果。此外，你应该使用 `NumberFormat`\
  \ 类来格式化结果。如果 `int` 是 20 而不是 5，前面的代码会在控制台上打印此内容：\n`The factorial of 20 is 2432902008176640000.`\n\
  \n如果你使用 `NumberFormat` 类格式化结果，控制台输出更具可读性：\n`The factorial of 20 is 2,432,902,008,176,640,000.`\n\
  \n### 递归解决方案\n\n阶乘问题的非递归解决方案有效，但并无趣。递归解决方案基于这样一个概念：只要 `n` 大于 1，任何数字 `n` 的阶乘等于 `n`\
  \ 乘以 `n – 1` 的阶乘。如果 `n` 是 1，阶乘就是 1。\n\n这种阶乘的定义是递归的，因为定义包含了阶乘方法本身。它还包含了任何递归方法最重要的部分：终止条件。终止条件指示递归方法何时应该停止调用自己。在这种情况下，当\
  \ `n` 为 1 时，我直接返回 1。如果没有终止条件，递归方法将无限地调用自己。\n\n这里是阶乘方法的递归版本：\n\n```java\nprivate\
  \ static long factorial(int n) {\n    if (n == 1)\n        return 1;\n    else\n\
  \        return n * factorial(n-1);\n}\n```\n\n该方法返回的结果与上一节中的版本完全相同，但它使用递归来计算阶乘。\n\
  \n可视化递归工作原理的一种方法是想象你有五个朋友：Jordan, Jeremy, Jacob, Justin 和 Bob。你的朋友并不聪明，但他们非常相似。事实上，他们是彼此的克隆。克隆还不是完美的过程，所以这些克隆有局限性。每个人只能做一个乘法题，并可以向其中一个克隆问一个问题。\n\
  \n现在假设你走到 Jordan 面前问：“Jordan，5 的阶乘是多少？” Jordan 说：“我不知道，但我知道它是 5 乘以 4 的阶乘。Jeremy，4\
  \ 的阶乘是多少？”\n\nJeremy 说：“我不知道，但我知道它是 4 乘以 3 的阶乘。Jacob，3 的阶乘是多少？”\n\nJacob 说：“我不知道，但我知道它是\
  \ 3 乘以 2 的阶乘。Justin，2 的阶乘是多少？”\n\nJustin 说：“我不知道，但我知道它是 2 乘以 1 的阶乘。嘿，Bob！1 的阶乘是多少？”\n\
  \nBob 因为没有以 J 开头的名字是这群人中最聪明的，回答道：“当然是 1。”他把答案告诉了 Justin。\n\nJustin 说：“啊 —— 2 × 1\
  \ 是 2。”他把答案告诉了 Jacob。\n\nJacob 说：“谢谢—— 3 × 2 是 6。”Jacob 把答案告诉了 Jeremy。\n\n## 显示目录\n\
  \n递归适用于需要遍历结构的应用程序，例如 Windows 或 Unix 文件系统。在文件系统中，目录是文件和目录的列表。目录可以嵌套在其他目录中，且数量没有限制。\n\
  \n目录列表应用程序非常简单。但在解释其细节之前，我想指出该程序使用了 `File` 类，它是 `java.io` 包的一部分。`File` 类表示单个文件或目录。现在，你只需要知道这五点细节：\n\
  \n- 该类的构造函数接受一个目录路径作为参数，并创建一个表示该目录的对象。\n- 你可以使用 `exists()` 方法来查找指定路径的目录是否存在。\n-\
  \ `listFiles()` 方法返回一个 `File` 对象数组，代表当前 `File` 对象中的所有文件和目录。\n- `isDirectory()` 方法返回一个布尔值，指示当前\
  \ `File` 对象是否为目录。如果此方法返回 `false`，你可以假设 `File` 对象是一个文件。\n- `getName()` 方法返回文件的名称。\n\
  \n\n\n\n\n```java\nprivate static void listDirectories(File dir, String indent)\n\
  {\n    File[] dirs = dir.listFiles();\n    for (File f : dirs)\n    {\n        if\
  \ (f.isDirectory())\n        {\n            System.out.println(indent + f.getName());\n\
  \            listDirectories(f, indent + \" \");\n        }\n    }\n}\n\nprivate\
  \ static boolean askAgain()\n{\n    System.out.print(\"Another? (Y or N) \");\n\
  \    String reply = sc.nextLine();\n    if (reply.equalsIgnoreCase(\"Y\"))\n   \
  \     return true;\n    return false;\n}\n```\n\n接下来的段落指出了该程序运行的亮点：\n\n1. 使用 `File`\
  \ 类需要此导入语句。\n\n15. 使用一个 `Scanner` 对象从用户处获取 `pathname`。\n\n17. 将 `pathname` 传递给 `File`\
  \ 类的构造函数，以便为用户输入的目录创建一个新的 `File` 对象。\n\n18. 调用 `exists` 和 `isDirectory` 方法，以确保用户输入的路径存在，并且指向的是目录而不是文件。\n\
