  \n**变量与数据类型操作** 97\n\n**使用 enum 创建你自己的数据类型**\n\n你经常会发现自己在使用 `String` 或 `int` 变量，但你想将其限制在少数几个值中。例如，假设你正在编写一个玩牌游戏的程序，你想一种方法来表示每张牌的花色。你可以通过\
  \ `String` 变量来实现，其值应该是 Hearts、Spades、Clubs 或 Diamonds。或者你可能使用 `int`，并用 1 代表红心，2\
  \ 代表黑桃，3 代表梅桃，4 代表方片。但这种方案很容易出错。如果你给 `int` 变量赋值为 5 会怎样？\n\n更好的方法是创建一个 *enum*（枚举），它本质上是一种具有限制值集的自定义变量类型。要定义枚举，你使用\
  \ `enum` 关键字（通常带有 `public` 修饰符），后面跟着括号内的可能值列表：\n\n```java\npublic enum CardSuit\
  \ {HEARTS, SPADES, CLUBS, DIAMONDS}\n```\n\n你可以使用枚举名称作为数据类型声明变量：\n\n```java\nCardSuit\
  \ suit;\n```\n\n然后，你可以通过使用枚举名称后跟点和任何枚举值来赋值，如下例所示：\n\n```java\nsuit = CardSuit.HEARTS;\n\
  ```\n\n这是一个完整的程序，它定义了一个枚举，创建了该枚举类型的变量，赋值并打印结果：\n\n```java\npublic class EnumTest\
  \ {\n    public enum CardSuit {HEARTS, SPADES, CLUBS, DIAMONDS}\n\n    public static\
  \ void main(String[] args) {\n        CardSuit suit;\n        suit = CardSuit.HEARTS;\n\
  \        System.out.println(\"The suit is \" + suit);\n    }\n}\n```\n\n该程序在控制台上显示以下行内容：\n\
  \nThe suit is HEARTS\n\n\n\n\n\n为什么 Java 的数学运算有时产生你可能预期的结果。\n\n## 使用算术运算符\n\n*运算符*（operator）是一个特殊的符号或关键字，用于指定数学操作或其他可以在一个或多个值（称为*操作数*，operand）上执行的其他类型操作。Java\
  \ 总共约有 40 个运算符。本章重点介绍执行算术的运算符。这些*算术运算符*（arithmetic operators）——共七种，如表 3-1 所示——执行基本的算术运算，如加、减、乘、除。\n\
  \n### 表 3-1：Java 的算术运算符\n\n| 运算符 | 说明 |\n| :--- | :--- |\n| `+` | 加法 |\n| `-` |\
  \ 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 模数 |\n| `++` | 递增 |\n| `--` | 递减 |\n\
  \n以下代码有助于明确这些运算符在 `int` 类型上如何工作：\n\n```java\nint a = 32, b = 5;\nint c = a + b;\
  \ // c 是 37\nint d = a - b; // d 是 27\nint e = a * b; // e 是 160\nint f = a / b;\
  \ // f 是 5 (32 / 5 等于 6 余 2)\nint g = a % b; // g 是 2 (32 / 5 等于 6 余 2)\na++; //\
  \ a 现在是 33\nb--; // b 现在是 4\n```\n\n注意，对于除法，结果会被截断。因此 `32 / 5` 返回的是 `6`，而不是 `6.4`。关于整数除法的更多信息，请参阅本章后面的“整数除法”部分。\n\
  \n以下是运算符对 `double` 值的工作方式：\n\n```java\ndouble x = 5.5, y = 2.0;\ndouble m = x +\
  \ y; // m 是 7.5\ndouble n = x - y; // n 是 3.5\ndouble o = x * y; // o 是 11.0\ndouble\
  \ p = x / y; // p 是 2.75\ndouble q = x % y; // q 是 1.5\nx++; // x 现在是 6.5\ny--;\
  \ // y 现在是 1.0\n```\n\n## 按操作数数量对运算符分类\n\n分类 Java 运算符的常用方法是根据运算符作用的操作数数量。当按这种方式分类运算符时，你会发现三种类型：\n\
  \n*   **一元运算符**（Unary operators）：仅作用于一个操作数的运算符。一元运算符的示例包括取反（`-x`，返回 `x` 的负值）和递增（`x++`，将\
  \ `x` 加 1）。\n    一元运算符可以是前缀运算符也可以是后缀运算符。*前缀运算符*（prefix operator）写在操作数之前，如下：\n```\n\
  operator operand\n```\n*后缀运算符*（postfix operator）写在操作数之后，如下：\n```\noperand operator\n\
  ```\n\n*   **二元运算符**（Binary operators）：作用于两个操作数的运算符。二元运算符的示例包括加法（`x + y`）、乘法（`invoiceTotal\
  \ * taxRate`）和比较运算符（`x < leftEdge`）。在 Java 中，所有二元运算符都是*中缀运算符*（infix operators），这意味着它们出现在操作数之间，如下：\n\
  ```\noperand1 operator operand2\n```\n\n*   **三元运算符**（Ternary operators）：作用于三个操作数的运算符。Java\
  \ 只有一个三元运算符，称为*条件运算符*（conditional operator）`?:`。*条件运算符也是中缀的：\n```\noperand1 ? operand2\
  \ : operand3\n```\n\n当你除法两个 `int` 值时，结果是一个整数值，即使你将其赋值给一个 `double` 变量也是。例如：\n\n```java\n\
  int a = 21, b = 6;\ndouble answer = a / b; // answer = 3.0\n```\n\n如果这不是你想要的，你可以在执行除法之前将其中一个操作数*转换*（cast）为\
  \ `double`。（*转换操作数*意味着将它的值从一种数据类型转换为另一种数据类型。）转换方法如下：\n\n```java\nint a = 21, b =\
  \ 6;\ndouble answer = (double)a / b; // answer = 3.5\n```\n\n这个故事的教训是，如果你想除法 `int`\
  \ 值并获得准确的 `double` 结果，你必须将至少一个 `int` 值转换为 `double`。\n\n当你今晚躺在床上思考 Java 算术运算符的奇妙时，这里有几点额外可以你考虑的内容：\n\
  \n*   在代数中，你可以将一个数字直接写在变量旁边来表示乘法。在这种情况下，*4x* 意味着“4 倍 *x*”。Java 中并非如此。以下语句无法编译：\n\
  ```java\nint x;\ny = 4x; // 错误，此行无法编译\n```\n\n*   余数运算符（`%`）也称为*模数*（modulus）运算符。它返回第一个操作数除以第二个操作数时的余数。余数运算符通常用于判断一个数是否能被另一个数整除，在这种情况下结果为零。有关更多信息，请参阅下一节“整数除法”。\n\
  \n*   所有运算符（包括算术运算符）在 Java 中都被视为分隔符。因此，表达式中任何空格的使用都是可选的。因此，以下两个语句是等价的：\n```java\n\
  a = ( (x + 4) * 7 ) / (y * x);\na=((x+4)*7)/(y*x);\n```\n只需记住，空格无大处，有时还能增加可读性。\n\
  \n## 整数除法\n\n当你用一个整数除另一个整数时，结果是一个整数。任何部分都会被丢弃。例如，`5 / 4` 是 `1`。如果你希望 `5 / 4` 的结果为\
  \ `1.25`，你必须在表达式中使用至少一个 `double`：\n\n```java\ndouble result = 5.0 / 4; // 结果为 1.25\n\
  double result = 5 / 4.0; // 结果为 1.25\ndouble result = (double)5 / 4; // 结果为 1.25\n\
  ```\n\n或者，你可以在执行除法之前将整数转换为 `double`：\n\n```java\nint a = 5;\nint b = 4;\ndouble\
  \ result = (double)a / b; // result 为 1.25\n```\n\n## 分分糖的程序\n\n以下程序演示了如何使用除法和余数运算符：\n\
  \n```java\nimport java.util.Scanner;\n\npublic class MarblesApp {\n    static Scanner\
  \ sc = new Scanner(System.in);\n\n    public static void main(String[] args) {\n\
  \        int numberOfbles;\n        int numberOfChildren;\n        int marblesPerChild;\n\
  \        int marblesLeftOver;\n\n        System.out.println(\"Welcome to the marble\
  \ divvyer.\");\n        System.out.print(\"Number of marbles: \");\n        numberOfbles\
  \ = sc.nextInt();\n        System.out.print(\"Number of children: \");\n       \
  \ numberOfChildren = sc.nextInt();\n\n        marblesPerChild = numberOfbles / numberOfChildren;\n\
  \        marblesLeftOver = numberOfbles % numberOfChildren;\n\n        System.out.println(\"\
  Give each child \" + marblesPerChild + \" marbles.\");\n        System.out.println(\"\
  You will have \" + marblesLeftOver + \" marbles left over.\");\n    }\n}\n```\n\n\
  该程序的示例输出：\n\n```\nWelcome to the marble divvyer.\nNumber of marbles: 93\nNumber\
  \ of children: 5\nGive each child 18 marbles.\nYou will have 3 marbles left over.\n\
  ```\n\n## 组合运算符\n\n你可以组合运算符来形成复杂的表达式。当你这样做时，...\n\n\n\n\n\n操作执行的顺序由表达式中每个运算符的优先级决定。算术运算符的优先级顺序如下：\n\
  \n- 首先评估自增（`++`）和自减（`--`）运算符。\n- 然后应用符号运算符（`+` 或 `-`）。\n- 然后评估乘法（`*`）、除法（`/`）和取模（`%`）运算符。\n\
  - 最后应用加法（`+`）和减法（`-`）运算符。\n\n例如，在表达式 `a + b * c` 中，乘法的优先级高于加法。因此先将 `b` 乘以 `c`。然后将该乘法的结果加到\
  \ `a` 上。\n\n如果一个表达式包含两个或多个相同优先级的运算符，则从左到右评估这些运算符。因此，在表达式 `a * b / c` 中，先将 `a` 乘以\
  \ `b`，然后将结果除以 `c`。\n\n如果你愿意，可以使用括号来改变操作的执行顺序。括号内的操作始终在括号外操作之前执行。因此，在表达式 `(a + b)\
  \ * c` 中，先将 `a` 加到 `b` 上。然后将结果乘以 `c`。\n\n如果一个表达式包含两组以上的括号，则先执行最内层括号的操作。在表达式 `(a\
  \ * (b + c)) / d` 中，先将 `b` 加到 `c` 上。然后将该结果乘以 `a`。最后，将该结果除以 `d`。\n\n除了自增和自减运算符外，这些优先级规则和括号的使用与基础代数相同。所以，如果你在八年级时留过心，那么优先级规则应该是容易理解的。\n\
  \n对于 `double` 或 `float` 值，改变相同优先级运算符的从左到右顺序不会影响结果。然而，对于整数类型，如果涉及除法，可能会产生巨大的差异。考虑这些语句：\n\
  \n```\nint a = 5, b = 6, c = 7;\nint d1 = a * b / c; // d1 是 4\nint d2 = a * (b\
  \ / c); // d2 是 0\n```\n\n这种差异发生是因为整数除法总是返回整数结果，即它是实际结果的截断版本。因此，在第一个表达式中，先将 `a`\
  \ 乘以 `b`，得到结果 30。然后将此结果除以 `c`。截断答案得到结果 4。但在第二个表达式中，先将 `b` 除以 `c`，得到截断后的结果 0。然后将此结果乘以\
  \ `a`，得到最终答案 0。\n\n### 使用一元加和一元减运算符\n\n一元加和一元减运算符允许你更改操作数的符号。请注意，这些操作中实际使用的运算符与二元加减运算符是相同的。编译器通过检查表达式来确定你是想使用这些运算符的二元版本还是一元版本。\n\
  \n一元减运算符并不一定会操作数变为负值。相反，它会改变操作数原本的符号。因此，如果操作数初始值为正值，一元减运算符会将其变为负值。但如果操作数初始值为负值，一元减运算符会将其变为正值。以下示例说明了这一点：\n\
  \n```\nint a = 5; // a 是 5\nint b = -a; // b 是 -5\nint c = -b; // c 是 +5\n```\n\n\
  有趣的是，一元加运算符实际上什么都不做。例如：\n\n```\nint a = -5; // a 是 -5\nint b = +a; // b 是 -5\na\
  \ = 5; // a 现在是 5\nint c = +a; // c 是 5\n```\n\n注意，如果 `a` 初始为正，`+a` 也是正的。但如果 `a`\
  \ 初始为负，`+a` 仍然是负的。因此，一元加运算符没有影响。我猜 Java 提供一元加运算符是为了平衡的需求。\n\n你还可以在更复杂的表达式中使用这些运算符，例如：\n\
  \n```\nint a = 3, b = 4, c = 5;\nint d = a * -(b + c); // d 是 -27\n```\n\n在这里，将\
  \ `b` 加到 `c` 上得到结果 9。然后应用一元减运算符得到结果 -9。最后，将 -9 乘以 `a`，得到结果 -27。\n\n### 使用自增和自减运算符\n\
  \n计算机编程中最常见的操作之一是对变量加或减 1。给变量加 1 称为变量的*自增*（incrementing）。减 1 称为*自减*（decrementing）。自增变量的传统方法是：\n\
  \n```\na = a + 1;\n```\n\n在这里，计算表达式 `a + 1`，并将结果赋值给变量 `a`。\n\nJava 提供了一种更简单的方法来执行此类计算：自增（`++`）和自减（`--`）运算符。这些一元运算符适用于单个变量。因此，要自增变量\
  \ `a`，你只需要编写：\n\n```\na++;\n```\n\n注意，使用自增或自减运算符的表达式本身就是一个语句。这是因为自增或自减运算符也是赋值运算符的一种，因为它改变了所作用变量的值。\n\
  \n你只能对变量使用自增和自减运算符——不能用于数字字面量或其他表达式。例如，Java 不允许以下表达式：\n\n```\na = b * 5++; // 不能自增数字\
  \ 5\na = (b * 5)++; // 不能自增表达式 (b * 5)\n```\n\n注意，你可以在赋值语句中使用自增或自减运算符。这里有一个例子：\n\
  \n```\nint a = 5;\nint b = a--; // a 和 b 都被设置为 4\n```\n\n当执行第二个语句时，首先评估表达式 `a--`，因此\
  \ `a` 被设置为 4。然后将 `a` 的新值赋值给 `b`。因此 `a` 和 `b` 都被设置为 4。\n\n自增和自减运算符之所以特殊，是因为它们是一元运算符，可以放在所作用变量之前（*前置\
  \ prefix*）之后（*后置 postfix*）。将运算符放在变量之前还是之后会对表达式的评估方式产生重大影响。如果你将自增或自减运算符放在变量之前，则该运算符会在表达式其余部分评估之前应用。结果是变量自增后的值将用于表达式。相比之下，如果你将运算符放在变量之后，则运算符会在表达式评估之后应用。因此，变量的原始值将用于表达式。\n\
  \n感到困惑了吗？一个简单的例子可以消除云义。首先，考虑这些使用后置自增表达式的语句：\n\n```\nint a = 5;\nint b = 3;\nint\
  \ c = a * b++; // c 被设置为 15\n```\n\n当评估第三条语句中的表达式时，`b` 的原始值——3 被用于乘法。因此 `c` 被设置为\
  \ 15。然后 `b` 自增到 4。\n\n现在考虑这个使用前置自增的版本：\n\n```\nint a = 5;\nint b = 3;\nint c = a\
  \ * ++b; // c 被设置为 20\n```\n\n这一次，`b` 在执行乘法之前就先自增了，因此 `c` 被设置为 20。无论如何，`b` 最终都被设置为\
  \ 4。\n\n同样，考虑这个例子：\n\n```\nint a = 5;\nint b = --a; // b 被设置为 5, a 被设置为 4.\n```\n\
  \n这个例子与之前的示例相似，但这次使用了前置自增运算符。当执行第二个语句时，`a` 的值被赋值给 `b`。然后 `a` 自减。结果是，`b` 被设置为 5，`a`\
  \ 被设置为 4。\n\n由于自增和自减运算符在表达式中与其他运算符一起使用时可能会引起困义，我建议你单独使用它们。每当你想将自增或自减运算符整合到更大的表达式中，请将自增或自减从表达式中提取出来，并使其成为表达式之前或之后的独立语句。也就是说，编写：\n\
  \n```\nb++;\nc = a * b;\n```\n\n而不是：\n\n```\nc = a * ++b;\n```\n\n在第一种情况下，显而易见的是\
  \ `b` 在执行乘法之前已经自增了。\n\n\n\n\n标准赋值运算符（`=`）用于将表达式的结果赋值给变量。在最简单的形式下，你的代码这样写：\n\n```\n\
  variable = expression;\n```\n\n第 2 册 编程基础\n\n这里有一个示例：\n\n```java\nint a = (b * c)\
  \ / 4;\n```\n\n你已经见过很多像这样的赋值语句示例了，所以我不再对这一点进行多余的阐述。我确实指出一点——仅仅为了留存在案——你*不能*在等号的左侧编写算术表达式。因此，以下语句无法编译：\n\
  \n```\nint a;\na + 3 = (b * c);\n```\n\n在本节的剩余部分中，我将指出一些使用赋值运算符的不寻常方法。我不建议你实际使用这些任何技术，因为它们很少需要，而且几乎总是会让人困惑，但了解它们可以帮助理解\
  \ Java 表达式的工作原理，并且有时可以帮助你发现代码中隐蔽的问题。\n\n## 与数字和表达式的操作\n\n理解本节其余内容的关键在于意识到，在 Java\
  \ 中，赋值是表达式，而不是语句。换句话说，`a = 5` 是一个赋值表达式，而不是一个赋值语句。只有当你在末尾添加分号时，它才变成一个赋值语句。\n\n赋值表达式的结果是赋值变量的值。例如，表达式\
  \ `a = 5` 的结果是 `5`。同样，表达式 `a = (b + c) * d` 的结果是表达式 `(b + c) * d` 的结果。\n\n这意味着你可以在其他表达式中间使用赋值表达式。下面的示例是合法的：\n\
  \n```java\nint a;\nint b;\na = (b = 3) * 2; // a 是 6, b 是 3\n```\n\n与任何表达式一样，括号内的表达式部分首先求值。因此，`b`\
  \ 被赋值为值 `3`。然后执行乘法，并将结果 `(6)` 赋值给变量 `a`。\n\n现在考虑一个更复杂的情况：\n\n```java\nint a;\nint\
  \ b = 2;\na = (b = 3) * b; // a 是 9, b 是 3\n```\n\n这里发生的情况是括号内的表达式首先求值，这意味着在执行乘法之前，`b`\
  \ 被设为 `3`。\n\n第 3 章 与数字和表达式的操作\n\n在上示例中，括号是重要的，因为如果没有括号，赋值运算符是 Java 优先级顺序中最后一个被求值的运算符。再考虑一个示例：\n\
  \n```java\nint a;\nint b = 2;\na = b = 3 * b; // a 是 6, b 是 6\n```\n\n这次，首先执行乘法\
  \ `3 * b`，得到结果 `6`。然后将此结果赋值给 `b`。最后，将该赋值表达式的结果 `(6)` 赋值给 `a`。\n\n顺便提一下，下面的表达式也是合法的：\n\
  \n```\na = b = c = 3;\n```\n\n该表达式将值 `3` 赋值给三个变量。虽然这段代码看起来相当无害，但你还是直接写三个赋值语句更好。（你可能猜到将赋值合并比写三行更有效率，但你是错的。这三个赋值无论以何种方式所需的字节码指令数量都是相同的。）\n\
