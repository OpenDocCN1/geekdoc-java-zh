  \ df = DateFormat.getDateInstance(DateFormat.FULL);\n    Date today = new Date();\n\
  \    return df.format(today);\n}\n%>\n```\n\n文档末尾的声明声明了一个返回当前日期字符串字符串格式的方法。然后，使用表达式\
  \ `<%= getDate() %>` 将日期插入到文档中。\n\n---\n\n750 第 7 卷 **Web 编程** \n\n## 使用类\n\n大多数\
  \ JSP 应用都复杂到需要额外的类来保持代码的可维护性。你可能想要创建处理文件或数据库 I/O 的类，并想要创建诸如 `Products` 和 `Customers`\
  \ 这样的业务对象。\n\n让 Tomcat 与类一起工作可能有点棘手，但如果你遵循以下指南，就会很容易：\n\n- **»将所有类包含包中。** 为你的应用程序选择一个好的包名，然后在类文件的开头添加包语句。\n\
  - **»将类文件（不一定是源文件）存储在 JSP 页面所在目录的 WEB-INF\\classes\\ 目录下。** 如果包名是 `movie`，而你将 JSP\
  \ 页面存储在 `c:\\tomcat\\webapps\\ROOT`，请将类文件保存在 `c:\\tomcat\\webapps\\ROOT\\WEB-INF\\\
  classes\\movie`\n- **»在任何使用该类的 JSP 中包含导入包的页面指令。** 如下：\n```jsp\n<%@ page import=\"\
  movie.*\" %>\n```\n- **»将你保存包的目录添加到 ClassPath 变量中。** 你需要添加包含包的目录，而不是类所在的目录，因为 Java\
  \ 编译器使用包名来查找。如果你将类放在 `webapps\\ROOT\\WEB-INF\\classes` 目录，你需要将 `c:\\tomcat\\webapps\\\
  ROOT\\WEB-INF\\classes` 添加到你的 `ClassPath`。\n\n为了说明 JSP 如何使用类，图 3-4 显示了一个列出 `movies.txt`\
  \ 文件中电影的 JSP。显示此页面的 JSP 见示例 3-1。该 JSP 文件存储在 `c:\\tomcat\\webapps\\ROOT`。\n\n第 3\
  \ 章 **使用 JavaServer Pages** 751\n\n![Image 106](img/index-774_1.png)\n\n**图 3-4：**\n\
  ListMovies JSP 的运行。\n\n**示例 3-1：**\n**ListMovies.jsp**\n```html\n<!doctype html\
  \ \"-//W3C//DTD HTML 4.0 Transitional//EN\">\n<%@ page import=\"movie.*\" %>\n<%@\
  \ page import=\"java.util.*\" %>\n<html>\n<head>\n<title>列出电影</title>\n</head>\n\
