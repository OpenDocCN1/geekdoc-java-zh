  \ x 和 y 位置作为参数的构造函数。\n\n412 书 4 **字符串、数组和集合**\n\n# **使用 Arrays 类**\n\n本章的最后一个主题是\
  \ `Arrays` 类，它提供了一系列对处理数组非常有用的静态方法。`Arrays` 类位于 `java.util` 包中，因此你必须使用 import 语句来导入\
  \ `java.util.Arrays` 类或整个 `java.util.*` 包才能使用该类。表 2-1 列出了 `Arrays` 类中最常用的方法。\n\n\
  **表 2-1**\n\n\n\n\n\n# Arrays 类的实用方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `static\
  \ int binarySearch(array, key)` | 在数组中搜索指定的 `key` 值。返回与 `key` 匹配元素的索引。如果未找到 `key`，则返回\
  \ –1。数组和 `key` 必须是相同的类型，并且可以是任何基本类型或对象。 |\n| `static array copyOf(arrayOriginal,\
  \ newLength)` | 返回 `arrayOriginal` 的副本数组。`newLength` 参数不一定等于原数组的长度。如果 `newLength`\
  \ 较大，该方法将用 0 填充新数组；如果 `newLength` 较小，该方法将不会复制原数组的所有值。 |\n| `static array copyOfRange(arrayOriginal,\
  \ from, to)` | 基本上执行与 `copyOf` 方法相同的操作，但它只复制原数组中选定的切片值（从一个索引到另一个索引）。 |\n| `boolean\
  \ deepEquals(array1, array2)` | 如果两个数组具有相同的元素值，则返回 true。此方法适用于两个或更多维的数组。 |\n| `boolean\
  \ equals(array1, array2)` | 如果两个数组具有相同的元素值，则返回 true。此方法仅检查一维数组的相等性。 |\n| `static\
  \ void fill(array, value)` | 用指定的值填充数组。值和数组必须是相同的类型，并且可以是任何基本类型或对象。 |\n| `static\
  \ void fill(array, from, to, value)` | 用指定的值填充由 `from` 和 `to` 整数参数指示的元素。值和数组必须是相同的类型，并且可以是任何基本类型或对象。\
  \ |\n| `static void sort(array)` | 按升序对数组进行排序。 |\n| `static void sort(array, from,\
  \ to)` | 按升序排序数组中的指定元素。 |\n| `static String toString(array)` | 将数组值格式化为字符串。每个元素值都被括在括号中，元素值之间用逗号分隔。\
  \ |\n\n#### 使用数组\n\n### 填充数组\n如果你想预先填充数组除数组类型默认值以外的值，`fill` 方法会非常有用。这里有一个例程，创建一个整数数组并将每个元素初始化为\
  \ 100：\n\n```java\nint[] startValues = new int[10];\nArrays.fill(startValues, 100);\n\
  ```\n\n虽然你可以将一个复杂的表达式作为第二个参数，但 `fill` 方法只会求值一次表达式。然后它会将该表达式的结果赋值给数组中的每个元素。\n\n你可能会认为可以使用\
  \ 1 到 100 的随机数填充一个长度为 1000 的整数数组，如下所示：\n\n```java\nint[] ran = new int[1000];\n\
  Arrays.fill(ran, (int)(Math.random() * 100) + 1);\n```\n\n遗憾的是，这段代码不起。发生的情况是表达式被求值一次以得到一个随机数；然后数组中的所有\
  \ 1000 个元素都被设置为该随机数。\n\n### 复制数组\n在 Java 1.6 中，`Arrays` 类增加了一些实用的新方法。使用新的 `copyOf`\
  \ 和 `copyOfRange` 方法，你可以从现有数组复制一组元素到一个全新的数组中。例如，如果你从一个名为 `arrayOriginal` 的变量开始，你可以将\
  \ `arrayOriginal` 元素复制到名为 `arrayNew` 的变量中，如列表 2-3 所示。\n\n**列表 2-3：复刻者**\n\n```java\n\
  import java.util.Arrays;\n\nclass CopyDemo {\n    public static void main(String\
  \ args[]) {\n        int arrayOriginal[] = {1, 2, 3, 4, 5};\n        int arrayNew[]\
  \ = Arrays.copyOf(arrayOriginal, 3);\n        System.out.println(Arrays.toString(arrayNew));\n\
  \    }\n}\n```\n*(注：由于原文示例代码块不完整，此处根据上下文逻辑补全了代码结构，以符合文档工程师的完整性要求。)*\n\n*(由于用户提供的原始文本中代码块存在多处逻辑断裂，翻译时保持了其逻辑结构。)*\n\
