  \ hgap, double vgap, Node... children)` | 创建一个具有指定水平和垂直间隙并填充了指定子节点的水平流式布局。 |\n|\
  \ `FlowPane(Node... children)` | 创建一个水平和垂直间隙均设置为零并填充了指定子节点的水平流式布局。 |\n| *注：* 在下列的每个构造函数中，`Orientation`\
  \ 可以是 `Orientation.HORIZONTAL` 或 `Orientation.VERTICAL`。 | |\n| `FlowPane(Orientation\
  \ orientation)` | 创建一个具有指定方向且水平和垂直间隙均设置为零的空流式布局。 |\n| `FlowPane(Orientation orientation,\
  \ double hgap, double vgap)` | 创建一个具有指定方向和指定水平、垂直间隙的空流式布局。 |\n| `FlowPane(Orientation\
  \ orientation, double hgap, double vgap, Node... children)` | 创建一个具有指定方向、水平和垂直间隙并填充了指定子节点的流式布局。\
