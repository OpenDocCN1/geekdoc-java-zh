  \ -1。\n\n`offer(Object elem)`\n将指定的对象添加到列表的末尾。此方法返回一个布尔值，该值始终为 true。\n\n`offerFirst(Object\
  \ elem)`\n将指定的对象添加到列表的开头。此方法返回一个布尔值，该值始终为 true。\n\n`offerLast(Object elem)`\n将指定的对象添加到列表的末尾。此方法返回一个布尔值，该值始终为\
  \ true。\n\n`peek()`\n返回（但不移除）列表中的第一个元素。如果列表为空，则返回 null。\n\n`peekFirst()`\n返回（但不移除）列表中的第一个元素。如果列表为空，则返回\
  \ null。\n\n`peekLast()`\n返回（但不移除）列表中的最后一个元素。如果列表为空，则返回 null。\n\n`poll()`\n获取第一个元素并将其从列表中移除。它返回获取的元素，或者如果列表为空，则返回\
  \ null。\n\n`pollFirst()`\n获取第一个元素并将其从列表中移除。它返回获取的元素，或者如果列表为空，则返回 null。\n\n`pollLast()`\n\
  获取最后一个元素并将其从列表中移除。它返回获取的元素，或者如果列表为空，则返回 null。\n\n`pop()`\n从由此列表表示的栈弹出一个元素。\n\n`push(Object\
  \ elem)`\n向由此列表表示的栈推入一个元素。\n\n`remove()`\n获取第一个元素并从列表中移除。它返回获取的元素。如果列表为空，则抛出 `NoSuchElementException`。\n\
  \n`remove(int index)`\n移除指定索引处的对象并返回被移除的元素。\n\n`remove(Object elem)`\n从列表中移除一个对象。注意，如果有多个元素指向该对象，此方法仅移除其中一个。它返回一个布尔值，表示该对象是否在列表中。\n\
  \n`removeAll(Collection c)`\n从此链表中移除指定集合中的所有对象。\n\n`removeFirst()`\n获取第一个元素并将其从列表中移除。它返回获取的元素。如果列表为空，则抛出\
  \ `NoSuchElementException`。\n\n`removeFirstOccurrence(Object elem)`\n在列表中找到 `elem`\
  \ 的第一次出现并并从列表中移除该次出现。如果列表中没有此类出现项，则返回 false。\n\n`removeLast()`\n获取最后一个元素并将其从列表中移除。它返回获取的元素。如果列表为空，则抛出\
  \ `NoSuchElementException`。\n\n`removeLastOccurrence(Object elem)`\n在列表中找到 `elem`\
  \ 的最后一次出现并从列表中移除该次出现。如果列表中没有此类出现项，则返回 false。\n\n`retainAll(Collection c)`\n从此链表中移除所有不在指定集合中的对象。\n\
  \n`set(int index, Object elem)`\n将指定的元素设置为指定的对象。之前该位置的元素将作为方法的返回值返回。\n\n`size()`\n\
  返回列表中的元素数量。\n\n`toArray()`\n将链表的元素作为对象数组（`Object[]`）返回。\n\n`toArray(type[] array)`\n\
  将链表的元素作为通过参数传递的数组类型相同的数组返回。\n\n## 创建 LinkedList\n\n与其他任何类型的对象一样，创建链表是一个两步过程。首先，你声明一个\
  \ `LinkedList` 变量；然后调用 `LinkedList` 的构造函数来创建对象，如下所示：\n\n```java\nLinkedList officers\
  \ = new LinkedList();\n```\n\n这里创建了一个链表并赋值给变量 `officers`。如果你使用的是 Java 1.5 或更高版本，可以在声明链表时使用泛型来指定类型。这里有一个创建字符串链表的语句：\n\
  \n```java\nLinkedList<String> officers = new LinkedList<>();\n```\n\n这样你只能添加 String\
  \ 对象。\n\n## 向 LinkedList 添加项\n\n`LinkedList` 类提供了多种向列表添加项的方法。最基本的是 `add` 方法，它的工作方式与\
  \ `ArrayList` 类非常相似。这是一个示例：\n\n```java\nLinkedList<String> officers = new LinkedList<String>();\n\
  officers.add(\"Blake\");\nofficers.add(\"Burns\");\nofficers.add(\"Houlihan\");\n\
  officers.add(\"Pierce\");\nofficers.add(\"McIntyre\");\nfor (String s : officers)\n\
  \    System.out.println(s);\n```\n\n`add` 方法将这些项添加到列表的末尾。因此生成的输出为：\n\n```\nBlake\n\
  Burns\nHoulihan\nPierce\nMcIntyre\n```\n\n`addLast` 方法的工作方式相同，但 `addFirst` 方法将项添加到列表的开头。考虑这些语句：\n\
  \n```java\nLinkedList<String> officers = new LinkedList<String>();\nofficers.addFirst(\"\
  Blake\");\nofficers.addFirst(\"Burns\");\nofficers.addFirst(\"Houlihan\");\nofficers.addFirst(\"\
  Pierce\");\nofficers.addFirst(\"McIntyre\");\nfor (String s : officers)\n    System.out.println(s);\n\
  ```\n\n这里生成的输出显示人员顺序反相反：\n\n```\nMcIntyre\nPierce\nHoulihan\nBurns\nBlake\n```\n\
  \n要向列表的特定位置插入对象，请在 `add` 方法中指定索引，如下：\n\n```java\nLinkedList<String> officers = new\
  \ LinkedList<String>();\nofficers.add(\"Blake\");\nofficers.add(\"Burns\");\nofficers.add(\"\
  Houlihan\");\nofficers.add(\"Pierce\");\nofficers.add(\"McIntyre\");\nofficers.add(2,\
  \ \"Tuttle\");\nfor (String s : officers)\n    System.out.println(s);\n```\n\n这些语句的控制台输出为：\n\
  \n```\nBlake\nBurns\nTuttle\nHoulihan\nPierce\nMcIntyre\n```\n\n\n\n\n\nBurns, Tuttle,\
  \ Houlihan, Pierce, McIntyre\n\n（如果你不是 *M*A*S*H* 的粉丝：Tuttle 是 Hawkeye 和 Trapper\
  \ 在其中一集剧中虚构的一个军官，目的是为了领取他的薪水并捐给当地的孤儿院。不幸的是，这个计策失控了。当 Tuttle 赢得勋章时，一位将军想亲自颁发，于是他们安排“Tuttle”在一场不幸的直升机事故中“死去”。）\n\
  \n在思考如何向链表添加元素时，还有一些需要考虑的想法：\n\n- » 如果你在创建列表时为列表指定了类型，那么你添加的项必须是正确的类型。如果不符合，编译器就会抱怨。\n\
  - » 与数组以及 Java 中的其他一切一样，链表的索引从零开始。\n- » 如果你指定了一个不存在的索引，`add` 方法会抛出 `IndexOutOfBoundsException`。这是一个运行时异常，所以你不需要处理它。\n\
  - » `LinkedList` 还有一些名为 `offer`、`offerFirst` 和 `offerLast` 的奇怪方法。`offer` 方法将项添加到列表末尾，返回类型为\
  \ `boolean`，但它始终返回 `true`。`offer` 方法是由 `Queue` 接口定义的，而 `LinkedList` 实现该接口。某些实现 `Queue`\
  \ 的类可能会拒绝接受通过 `offer` 添加到列表的对象。在这种情况下，`offer` 方法返回 `false`。但由于链表永远不会耗尽空间，`offer`\
  \ 方法始终返回 `true`，表示提议给列表的对象已被接受。\n\n### 从 LinkedList 中检索项\n\n与 `ArrayList` 类一样，你可以使用\
  \ `get` 方法根据索引检索项。如果你传递了一个无效的索引数字，`get` 方法会抛出未检查的 `IndexOutOfBoundsException`。\n\
  \n你还可以使用增强型 for 循环来检索链表中的所有项。上一节中的示例使用了这种增强型 for 循环来打印军官链表的内容：\n\n```java\nfor (String\
  \ s : officers)\n    System.out.println(s);\n```\n\n### 使用 LinkedList 类\n\n如果你愿意，还可以使用\
  \ `iterator` 方法获取一个可以访问列表的迭代器。（有关迭代器的更多信息，请参阅第 4 册第 3 章。）\n\n`LinkedList` 类还有许多其他从列表中检索项的方法。其中一些方法会在检索项时将其删除；另一些在列表为空时抛出异常；还有的返回\
  \ `null`。\n\n有九个方法检索列表中的第一个项：\n\n- » `getFirst`: 检索列表中的第一个项。该方法不会删除该项。如果列表为空，将抛出\
  \ `NoSuchElementException`。\n- » `element`: 与 `getFirst` 方法相同。这个命名奇怪的方法之所以是因为是由\
  \ `Queue` 接口定义的，而 `LinkedList` 类实现了 `Queue`。\n- » `peek`: 与 `getFirst` 相似，但如果列表为空不会抛出异常。相反，它只返回\
  \ `null`。（`Queue` 接口也定义了这个方法。）\n- » `peekFirst`: 与 `peek` 相同。只是更改了方法名以保护无辜。\n- »\
  \ `remove`: 与 `getFirst` 相似，但也会从列表中删除该项。如果列表为空，会抛出 `NoSuchElementException`。\n-\
  \ » `removeFirst`: 与 `remove` 相同。如果列表为空，会抛出 `NoSuchElementException`。\n- » `poll`:\
  \ 与 `removeFirst` 相似，但如果列表为空则返回 `null`。（该方法是 `Queue` 接口定义的另一个方法。）\n- » `pollFirst`:\
  \ 与 `poll` 相同（好吧，除了方法名外相同）。\n- » `pop`: 与 `removeFirst` 相同（但名字更响亮）。\n\n还有四个方法检索列表中的最后一个项：\n\
  \n- » `getLast`: 检索列表中的最后一个项。该方法不会删除该项。如果列表为空，将抛出 `NoSuchElementException`。\n- »\
  \ `peekLast`: 与 `getLast` 相似，但如果列表为空不会抛出异常。相反，它只返回 `null`。\n- » `removeLast`: 与\
  \ `getLast` 相似，但也会删除项。如果列表为空，会抛出 `NoSuchElementException`。\n- » `pollLast`: 与 `removeLast`\
  \ 相似，但如果列表为空则返回 `null`。\n\n### 更新 LinkedList 项\n\n与 `ArrayList` 类一样，你可以使用 `set`\
  \ 方法用另一个对象替换链表中的对象。在 Hawkeye 和 Trapper 虚构 Tuttle 上尉的那个 *M*A*S*H* 剧，当他在那场不幸的直升机事故中去世后，他们迅速找到了他的替补。以下是\
  \ Java 如何实现这一情节的：\n\n```java\nLinkedList<String> officers = new LinkedList<String>();\n\
  // 添加原始军官\nofficers.add(\"Blake\");\nofficers.add(\"Burns\");\nofficers.add(\"Tuttle\"\
  );\nofficers.add(\"Houlihan\");\nofficers.add(\"Pierce\");\nofficers.add(\"McIntyre\"\
  );\nSystem.out.println(officers);\n\n// 用 Murdock 替换 Tuttle\nofficers.set(2, \"\
  Murdock\");\nSystem.out.println(\"\\nTuttle is replaced:\");\nSystem.out.println(officers);\n\
  ```\n\n该代码的输出如下：\n\n```\n[Blake, Burns, Tuttle, Houlihan, Pierce, McIntyre]\nTuttle\
  \ is replaced:\n[Blake, Burns, Murdock, Houlihan, Pierce, McIntyre]\n```\n\n与 `ArrayList`\
  \ 一，对列表中获取的对象进行的任何更改都会反映在列表中。这是因为列表包含对象的引用，而不是对象本身。\n\n删除 删除项\n\n你已经看到，几个从列表检索项的方法也会删除这些项。特别是\
  \ `remove`、`removeFirst` 和 `poll` 方法会删除列表中的第一个项，而 `removeLast` 方法会删除最后一个项。\n\n你也可以通过指定其索引或要删除的对象的引用来删除任意项。例如，要删除第\
  \ 3 个项，可以使用如下语句：\n\n```java\nofficers.remove(3);\n```\n\n如果你有要删除的项的引用，使用 `remove`\
  \ 方法，例如：\n\n```java\nofficers.remove(tuttle);\n```\n\n要删除列表中的所有项，请使用 `clear` 方法：\n\
  \n```java\nofficers.clear(); // 再见，永别，感谢。\n```\n\n\n\n\n你会发现总有一天你想要创建自己的泛型类。你的朋友一定会会认为你是个天才。\n\
  \n# 第 5 章：创建泛型集合类\n\n坦率地说，我不会涵盖泛泛型编程的所有细节。如果你的下份工作恰好是为 Oracle 编写 Java 类库，那么你需要了解比本章涵盖的得多的泛型知识。我只专注于编写简单泛型类的基础知识。\n\
  \n## 为什么要用泛型？\n\n在 Java 1.5 之前，集合类可以持有任何类型的对象。例如，`ArrayList` 类的 `add` 方法有如下声明：\n\
  \n```java\npublic boolean add(Object o)\n{\n// 实现 add 方法的代码\n}\n```\n\n因此，你可以将任何类型的对象传递给\
  \ `add` 方法——数组列表会乐意地接受它。\n\n当你从集合中检索一个项时，在对其进行任何操作之前，必须将其强制转换为正确的对象类型。例如，如果你有一个名为\
  \ `empList` 包含 `Employee` 对象的数组列表，你会使用像下面的语句从列表中获取第一个 `Employee`：\n\n```java\nEmployee\
  \ e = (Employee)empList.get(0);\n```\n\n问题是，如果列表中的第一个项不是 `Employee` 怎么办？因为 `add`\
  \ 方法接受任何类型的对象，所以没有办法保证只有特定类型的对象可以被添加到集合中。\n\n这就是发明泛型原因。现在你可以像这样声明 `ArrayList`：\n\
  \n```java\nArrayList<Employee> empList = new ArrayList<Employee>();\n```\n\n在这里，`empList`\
  \ 被声明为只能持有 `Employee` 类型的 `ArrayList`。现在，`add` 方法的声明等同于以下内容：\n\n```java\npublic\
  \ boolean add(Employee o)\n{\n// 实现 add 方法的代码\n}\n```\n\n因此，你只能向列表添加 `Employee`\
  \ 对象。而 `get` 方法的声明等同于以下内容：\n\n```java\npublic Employee get(int index)\n{\n// 实现\
  \ get 方法的代码\n}\n```\n\n因此，`get` 方法返回 `Employee` 对象。你不需要将结果强制转换为 `Employee`，因为编译器已经知道该对象是\
  \ `Employee`。\n\n## 创建泛型类\n\n泛型允许你创建可以用于程序员在编译时指定的任何类型的类。为了实现这一点，Java 设计者在语言中引入了一个新特性，称为\
  \ `形式类型参数`（formal type parameters）。要创建一个使用形式类型参数的类，你需要在类名的角括号后列出类型参数。类型参数有一个名称——Oracle\
  \ 建议你使用单个大写字母作为类型参数名称——你可以在类中任何本该使用使用类型的地方使用它。\n\n例如，这里是 `ArrayList` 类声明的简单化版本：\n\
  \n```java\npublic class ArrayList<E>\n```\n\n我去掉了 `extends` 和 `implements` 子句，以便重点关注形式类型参数：`<E>`。`E`\
  \ 参数指定了存储在列表中元素的类型。Oracle 建议对于任何指定集合元素类型的参数使用类型参数名 `E`（代表 Element）。\n\n所以，考虑一下这条语句：\n\
  \n```java\nArrayList<Employee> empList;\n```\n\n在这里，`E` 参数是 `Employee`，这仅意味着该 `ArrayList`\
  \ 类实例的元素类型是 `Employee`。\n\n## 创建泛型集合类\n\n现在看看 `ArrayList` 类 `add` 方法的声明：\n\n```java\n\
  public boolean add(E o)\n{\n// 省略方法体（致谢）\n}\n```\n\n在通常期望看到参数类型的地方，你看到了字母 `E`。因此，此方法声明指定参数\
  \ `o` 的类型为形式类型参数 `E` 所指定的类型。如果 `E` 是 `Employee`，则意味着 `add` 方法只接受 `Employee` 对象。\n\
  \n到目前为止，一切顺利。现在看看你如何将形式类型参数作为返回类型。这里是 `get` 方法的声明：\n\n```java\npublic E get(int\
  \ index)\n{\n// 省略方法体（不客气）\n}\n```\n\n在这里，`E` 被指定为返回类型。这意味着如果 `E` 是 `Employee`，此方法将返回\
  \ `Employee` 对象。\n\n在继续之前，你需要了解的最后一个技术是：你可以在类中使用形式类型参数来创建任何其他接受形式类型参数的类的对象。例如，`ArrayList`\
  \ 类的 `clone` 方法写法如下：\n\n```java\npublic Object clone()\n{\n    try\n    {\n    \
  \    ArrayList<E> v = (ArrayList<E>) super.clone();\n        v.elementData = (E[])new\
  \ Object[size];\n        System.arraycopy(elementData, 0, v.elementData, 0, size);\n\
  \        v.modCount = 0;\n        return v;\n    }\n    catch (CloneNotSupportedException\
  \ e)\n    {\n        // 这不应该发生，因为我们实现了 Cloneable\n        throw new InternalError();\n\
  \    }\n}\n```\n\n你不需要过多关注此方法的细节；只需注意 `try` 块中的第一语句声明了一个类型为 `<E>` 的 `ArrayList`。换句话说，`ArrayList`\
  \ 类使用它自己的形式类型参数来创建另一个相同类型的数组列表对象。如果你仔细考虑，这完全合逻辑。毕竟，这就是 `clone` 方法所做的。泛型的关键优势在于，这种类型是在编译时发生的。\n\
  \n## 栈类\n\n现在已经了解了创建泛型类的基础，在本节中我们将查看实现栈的简单泛型类。栈（stack）是一种允许你向顶部添加对象并从顶部移除对象的集合类型。我在本节中将该类命名为\
  \ `Stack`，它具有以下方法：\n\n- `push`：向顶部添加对象。\n- `pop`：从栈顶部检索项。该项会被移除。如果栈为空，它返回 `null`。\n\
  - `peek`：让你查看栈顶部的项。换句话说，它返回该项但不将其移除。如果栈为空，它返回 `null`。\n- `hasItems`：如果栈至少有一个项，该方法返回\
  \ `boolean` 值 `true`。\n- `size`：该方法返回指示栈中数量的 `int` 值。\n\n`Stack` 类使用 `LinkedList`\
  \ 实现栈。在大多数情况下，此类使用更适合栈的名称暴露 `LinkedList` 类的各种方法。\n\n###  5-1：Stack 类\n\n```java\n\
  import java.util.*;\n\npublic class Stack<E> {\n    private LinkedList<E> list =\
  \ new LinkedList<E>();\n\n    public void push(E item)\n    {\n        list.addFirst(item);\n\
  \    }\n\n    public E pop()\n    {\n        return list.poll();\n    }\n\n    public\
  \ E peek()\n    {\n        return list.peek();\n    }\n\n    public boolean hasItems()\n\
  \    {\n        return !list.isEmpty();\n    }\n\n    public int size()\n    {\n\
  \        return list.size();\n    }\n}\n```\n\n下文段落强调了此类中的重要细节：\n\n- 类声明指定了形式类型参数\
  \ `<E>`。因此，此类的用户可以指定栈元素的类型。\n- 此类使用一个私有的 `LinkedList` 对象 `list` 来存储在栈中的项。`LinkedList`\
  \ 的声明类型与 `Stack` 类本身相同。因此，如果 `E` 类型参数是 `Employee`，则该 `LinkedList` 的类型就是 `Employee`。\n\
  \n\n\n\n- `pop` 方法返回一个类型为 `E` 的值。它使用了链表的 `poll` 方法，该方法会移除并返回链表中的第一个元素。如果列表为空，`poll`\
  \ 方法——因此 `pop` 方法——将返回 `null`。\n- `peek` 方法同样返回一个类型为 `E` 的值。它简单地返回了链表的 `peek` 方法的结果。\n\
  - `hasItems` 方法返回链表的 `isEmpty` 方法的反结果。\n- `size` 方法简单地返回了链表的 `size` 方法的结果。\n\n就是这些。接下来的程序对\
  \ `GenStack` 类进行了一次小测试，以确保其功能正常：\n\n```java\npublic class GenStackTest\n{\n    public\
  \ static void main(String[] args)\n    {\n        GenStack<String> gs = new GenStack<String>();\n\
  \        System.out.println(\"Pushing four items onto the stack.\");\n        gs.push(\"\
  One\");\n        gs.push(\"Two\");\n        gs.push(\"Three\");\n        gs.push(\"\
  Four\");\n        System.out.println(\"There are \" + gs.size() + \" items in the\
  \ stack.\\n\");\n        System.out.println(\"The top item is: \" + gs.peek() +\
  \ \"\\n\");\n        System.out.println(\"There are still \" + gs.size() + \" items\
  \ in the stack.\\n\");\n\n        // Creating Generic Collection Classes\n     \
  \   System.out.println(\"Popping everything:\");\n        while (gs.hasItems())\n\
  \            System.out.println(gs.pop());\n        System.out.println(\"There are\
  \ now \" + gs.size() + \" items in the stack.\\n\");\n        System.out.println(\"\
  The top item is: \" + gs.peek() + \"\\n\");\n    }\n}\n```\n\n该程序创建了一个可以存放 `String`\
  \ 对象的 `GenStack` 对象。然后它将四个字符串推入栈中，并打印栈中的元素数量。接下来，它使用 `peek` 方法打印栈顶元素，并再次打印栈中的元素数量，以确保\
  \ `peek` 方法不会意外移除该元素。接着，它使用一个 `while` 循环从栈中弹出每个元素并将其打印出来。最后，它再次打印元素数量（现在应该是 0），并查看栈顶元素（结果应该是\
  \ `null`）。\n\n运行此程序后得到的输出如下：\n\n```\nPushing four items onto the stack.\nThere are\
  \ 4 items in the stack.\nThe top item is: Four\nThere are still 4 items in the stack.\n\
  Popping everything:\nFour\nThree\nTwo\nOne\nThere are now 0 items in the stack.\n\
  The top item is: null\n```\n\n注意，当程序从栈中弹出元素时，它们的输出顺序与入栈的顺序相反。这是栈的正常行为。事实上，由于这个原因，栈有时被称为*后进先出*（Last-In,\
  \ First-Out）列表或 *LIFO* 列表。\n\n## 使用通配符类型参数\n\n假设你有一个如下声明的方法：\n\n```java\npublic\
  \ void addItems(ArrayList<Object> list)\n{\n    // 方法体未显示\n}\n```\n\n思考题：以下语句可以编译通过吗？\n\
  \n`addItems(new ArrayList<String>());`\n\n答案：不能。\n\n这很令人惊讶，因为 `String` 是 `Object`\
  \ 的子类型。所以你可能会认为，一个声明接受对象 `ArrayList` 的参数也接受字符串的 `ArrayList`。遗憾的是，在涉及形式类型参数时，继承机制并不是这样工作的。相反，你必须使用泛型的另一个特性，称为*通配符*。\n\
  \n简而言之，如果你想创建一个接受任何类型 `ArrayList` 的方法，你必须这样编写该方法：\n\n```java\npublic void addItems(ArrayList<?>\
  \ list)\n```\n\n在这种情况下，问号表示你可以在这里编写任何类型。这几乎和继承一样好用，但如果你想将参数实际上限制为某个特定父类的集合呢？例如，假设你正在开发一个工资系统，该系统有一个名为\
  \ `Employee` 的父类，以及两个名为 `HourlyEmployee` 和 `SalariedEmployee` 的子类，而你希望此方法能接受 `Employee`\
  \ 对象、`HourlyEmployee` 对象或 `SalariedEmployee` 对象的 `ArrayList`？\n\n在这种情况下，你可以为通配符添加一个\
  \ `extends` 子句，如下所示：\n\n```java\npublic void addItems(ArrayList<? extends Employee>\
  \ list)\n```\n\n然后就可以用类型为 `Employee`、`HourlyEmployee` 或 `SalariedEmployee` 的 `ArrayList`\
  \ 来调用 `addItems` 方法了。\n\n现在，在结束工作之前，再将这个例子更进一步：假设此 `addItems` 方法出现在一个泛型类中，它使用形式类型参数\
  \ `<E>` 来指定类接受的元素类型，而你希望 `addItems` 方法接受 `E` 类型或其子类的 `ArrayList`。为了实现这一点，你需要这样声明\
  \ `addItems` 方法：\n\n```java\npublic void addItems(ArrayList<? extends E> list)\n\
  ```\n\n这里的通配符类型 `<? extends E>` 意味着 `ArrayList` 类型可以是 `E`。\n\n既然你已经学会了如何在泛型类中使用通配符，本节将介绍队列。队列是另一种集合类型，允许你从末尾添加对象并从头部移除对象。队列广泛应用于各种，从数据处理到网络系统。该队列命名为\
  \ `GenQueue`，并包含以下方法：\n\n### 5-2：GenQueue 类\n\n```java\nimport java.util.*;\n\n\
  public class GenQueue<E>\n{\n    private LinkedList<E> list = new LinkedList<E>();\n\
  \n    public void enqueue(E item)\n    {\n        list.addLast(item);\n    }\n\n\
  \    public E dequeue()\n    {\n        return list.poll();\n    }\n\n    public\
  \ boolean hasItems()\n    {\n        return !list.isEmpty();\n    }\n\n    public\
  \ int size()\n    {\n        return list.size();\n    }\n\n    public void addItems(GenQueue<?\
  \ extends E> q)\n    {\n        while (q.hasItems())\n            list.addLast(q.dequeue());\n\
  \    }\n}\n```\n\n以下段落指出了重点：\n\n- 类声明指定了形式类型参数 `<E>`。因此，类的用户可以指定元素的类型。\n- 与 `GenStack`\
  \ 类一样，该类使用私有的 `LinkedList` 对象 `list` 来存储元素。\n- `enqueue` 方法接受一个类型为 `E` 的参数。它使用链表的\
  \ `addLast` 方法将元素添加到队尾。\n- `dequeue` 方法返回一个类型为 `E` 的值。类似于 `GenStack` 类的 `pop` 方法，该方法使用链表的\
  \ `poll` 方法返回列表中的第一个元素。\n- `hasItems` 方法返回链表的 `isEmpty` 方法的反结果。\n- `size` 方法返回链表的\
  \ `size` 方法的结果。\n- `addItems` 方法接受的参数必须是另一个 `GenQueue` 对象，其元素类型与此 `GenQueue` 对象的元素类型相同，或者是此\
  \ `GenQueue` 对象的元素类型的子类型。该方法使用 `while` 循环从参数 `q` 中移除所有元素并添加到此队列中。\n\n接下来的程序将测试 `GenQueue`\
  \ 类：\n\n\n\n\n\n```java\npublic class GenQueueTest\n{\n    public static void main(String[]\
  \ args)\n    {\n        GenQueue<Employee> empList;\n        empList = new GenQueue<Employee>();\n\
  \        GenQueue<HourlyEmployee> hList;\n        hList = new GenQueue<HourlyEmployee>();\n\
  \        hList.enqueue(new HourlyEmployee(\"Trump\", \"Donald\"));\n        hList.enqueue(new\
  \ HourlyEmployee(\"Gates\", \"Bill\"));\n        hList.enqueue(new HourlyEmployee(\"\
  Forbes\", \"Steve\"));\n        empList.addItems(hList);\n        while (empList.hasItems())\n\
  \        {\n            Employee emp = empList.dequeue();\n            System.out.println(emp.firstName\
  \ + \" \" + emp.lastName);\n        }\n    }\n}\n\nclass Employee\n{\n    // 460\
  \ BOOK 4 Strings, Arrays, and Collections\n    public String lastName;\n    public\
  \ String firstName;\n    public Employee() {}\n    public Employee(String last,\
  \ String first)\n    {\n        this.lastName = last;\n        this.firstName =\
  \ first;\n    }\n    public String toString()\n    {\n        return firstName +\
  \ \" \" + lastName;\n    }\n}\n\nclass HourlyEmployee extends Employee\n{\n    public\
  \ double hourlyRate;\n    public HourlyEmployee(String last, String first)\n   \
  \ {\n        super(last, first);\n    }\n}\n```\n\n该程序首先创建了一个可以存放 `Employee` 对象的\
  \ `GenQueue` 对象。该队列被赋值给名为 `empList` 的变量。接下来，程序创建了另一个 `GenQueue` 对象。这个对象可以存放 `HourlyEmployee`\
  \ 对象（`HourlyEmployee` 是 `Employee` 的子类），并被赋值给名为 `hList` 的变量。\n\n然后，创建了三名新员工并将他们添加到\
  \ `hList` 队列中。接着调用 `empList` 队列的 `addItems` 方法将这些员工从 `hList` 队列转移到 `empList` 队列。由于\
  \ `HourlyEmployee` 是 `Employee` 的子类，`empList` 队列的 `addItems` 方法接受 `hList` 作为参数。最后，使用\
  \ `while` 循环打印现在位于 `empList` 队列中的员工。\n\n## 创建泛型集合类\n\n### 第 5 章 创建泛型集合类 461\n\n\
  当该程序运行时，控制台将打印以下内容：\n\n```\nDonald Trump\nBill Gates\nSteve Forbes\n```\n\n因此，`addItems`\
  \ 方法成功地将员工从持有 `HourlyEmployee` 对象的 `hlist` 队列转移到了持有 `Employee` 对象的 `empList` 队列。\n\
  \n## 使用菱形运算符\n\n在使用泛型时，令人恼的问题之一是，当你创建一个泛型类型的变量时，必须指定两次类型，然后使用构造函数实例化对象。例如，要创建一个\
  \ `String` 类型的 `ArrayList`，你必须编写如下代码：\n\n```java\nArrayList<String> nums = new ArrayList<String>();\n\
  ```\n\n在这里，类型 `String` 必须指定两次：一次在变量的类型声明中，另一次调用构造函数时。Java 7 引入了一个名为“菱形运算符”的新特性，允许你在调用构造函数时跳过类型，如下：\n\
  \n```java\nArrayList<String> nums = new ArrayList<>();\n```\n\n这是另一个例子：\n\n```java\n\
  ArrayList<String> nums;\nnums = new ArrayList<>();\n```\n\n菱形运算符简单地根据变量的类型推导出正确的类型。\n\
  \n### 462 BOOK 4 Strings, Arrays, and Collections\n\n![Image 48](img/index-485_1.jpg)\n\
  \n## 本章内容\n\n- » 理解基础流操作\n- » 检查流接口\n- » 过滤和排序流\n- » 计算总和、平均值和其他其他数值\n\n## 第 6 章使用集合进行批量数据操作\n\
  \n对集合最常见的操作之一是对其进行迭代，对其所有元素执行某种操作。例如，你可能会使用 `foreach` 循环来打印所有元素。`foreach` 循环体中可能包含一个\
  \ `if` 语句来选择打印哪些元素。或者它可能会执行某些计算，例如累加总数或统计符合给定条件的数量。\n\n在 Java 中，`foreach` 循环很容易创建且非常强大。然而，它们有一个明显的缺点：它们逐个遍历集合的元素，从第一个元素开始顺序进行到最后一个元素。因此，`foreach`\
  \ 循环必须在单线程内顺序执行。\n\n这很遗憾，因为现代计算机拥有多核处理器，能够同时处理几件事。如果你能将一个 `foreach` 循环分成几部分，每个部分都能在其中一个处理器核心上独立运行，那不是太棒了？对于小型集合，用户可能察觉不到差异。但如果集合非常大（例如，几百万元素），释放多核处理器的力量可以让程序运行快得多。\n\
  \n### 第 6 章使用集合进行批量数据操作 463\n\n虽然你可以在早期的 Java 版本中做到这一点，但编程起来非常复杂。你必须掌握 Java 编程中较困难的方面之一：处理线程，线程就像是程序中可以同时执行的独立分部分。你将在第\
  \ 5 卷第 1 章学习处理线程的基础知识。现在，请听我一句：编写处理大量数据集合并利用多个线程的程序是一项艰巨的任务。至少在 Java 8 之前是如此。\n\n\
  使用 Java 8 或更高版本，你可以使用名为“批量数据操作”的特性，它是专门为解决这个问题设计的。当你使用批量数据操作时，不需要直接使用 `foreach`\
  \ 循环遍历集合。相反，你只需提供对每个元素执行的操作，让 Java 将工作分配到多个线程上。批量数据操作的核心是一个名为 `stream` 的新类型，由 `stream`\
  \ 接口定义。`stream` 简单来说是任何数据类型的序列，可以顺序或并行处理。`stream` 接口提供了各种方法，例如过滤元素或对每个元素执行操作。流依赖于\
  \ lambda 表达式来传递执行的操作。事实上，Java 开发者引入 lambda 表达式的主要原因就是为了流。如果你还没有读过第 3 卷第 7 章，建议你现在去读，然后再继续阅读本章。否则你会对书中使用的\
  \ lambda 表达式语法感到非常困惑。\n\n在本章中，你将学习使用流进行简单批量数据操作的基础。\n\n## 查看基础批量数据操作\n\n假设你有一个巫师使用的咒列表，出于版权考虑，我们将其简称为\
  \ HP。咒由名为 `Spell` 的类表示，其定义如下：\n\n### 464 BOOK 4 Strings, Arrays, and Collections\n\
  \n```java\npublic class Spell\n{\n    public String name;\n    public SpellType\
  \ type;\n    public String description;\n    public enum SpellType {SPELL, CHARM,\
  \ CURSE}\n\n    public Spell(String spellName, SpellType spellType, String spellDescription)\n\
  \    {\n        name = spellName;\n        type = spellType;\n        description\
  \ = spellDescription;\n    }\n\n    public String toString()\n    {\n        return\
  \ name;\n    }\n}\n```\n\n如你所示，`Spell` 类有三个公共字段，分别代表咒语的名称、类型和描述，以及一个可以指定咒语名称、类型和描述的构造函数。此外，`toString()`\
  \ 方法被重写为简单地返回咒语名称。\n\n让我们将 HP 的一些咒语加载到 `ArrayList` 中：\n\n```java\nArrayList<Spell>\
  \ spells = new ArrayList<>();\n```\n\n\n\n\n\n```java\nspells.add(new Spell(\"Aparecium\"\
  , Spell.SpellType.SPELL, \"让隐形水显形。\"));\nspells.add(new Spell(\"Avis\", Spell.SpellType.SPELL,\
  \ \"从魔杖上发射鸟类。\"));\nspells.add(new Spell(\"Engorgio\", Spell.SpellType.CHARM, \"\
  放大某个物体。\"));\nspells.add(new Spell(\"Fidelius\", Spell.SpellType.CHARM, \"在某人身上隐藏秘密。\"\
  ));\nspells.add(new Spell(\"Finite Incatatum\", Spell.SpellType.SPELL, \"停止所有当前咒语。\"\
  ));\nspells.add(new Spell(\"Locomotor Mortis\", Spell.SpellType.CURSE, \"锁定对手的腿部。\"\
  ));\n```\n\n# 第 6 章 在集合上使用批量数据数据操作\n\n现在，假设你想在控制台上列出每个咒语的名称。你可以使用如下的 `foreach` 循环来实现：\n\
  \n```java\nfor (Spell spell : spells)\n    System.out.println(spell.name);\n```\n\
  \n使用流（streams）的等效代码如下：\n\n```java\nspells.stream().forEach(s -> System.out.println(s));\n\
  ```\n\n在这里，我首先使用 `ArrayList` 类的 `stream` 方法将 `ArrayList` 转换为一个流。所有继承自 `java.Collection`\
  \ 的类都实现了 `stream` 方法，该方法返回一个 `Stream` 对象。这不仅包括 `ArrayList`，还包括 `LinkedList` 和 `Stack`。\n\
  \n接下来，我使用流的 `forEach` 方法来迭代流，传递一个 lambda 表达式，该表达式会为流中的每个项调用 `System.out.println`。`forEach`\
  \ 方法处理整个流，将每个元素写入控制台。\n\n假设你只想列出咒语，而不列出护身咒或诅咒。使用传统的 `foreach` 循环，你可以这样操作：\n\n```java\n\
  for (Spell spell : spells)\n{\n    if (spell.type == Spell.SpellType.SPELL)\n  \
  \      System.out.println(spell.name);\n}\n```\n\n这里通过一个 `if` 语句只选择了咒语，这样就不会列出护身咒和诅咒了。\n\
  \n以下是使用流实现的相同操作：\n\n```java\nspells.stream()\n  .filter(s -> s.type == Spell.SpellType.SPELL)\n\
  \  .forEach(s -> System.out.println(s));\n```\n\n在这个示例中，`stream` 方法将 `ArrayList`\
  \ 转换为流。然后，使用流的 `filter` 方法仅选择 `SPELL` 项。最后，通过 `forEach` 方法将选定的项发送到控制台。注意，`forEach`\
  \ 方法和 `filter` 方法中都使用了 lambda 表达式。\n\n`Stream` 类的 `filter` 方法返回一个 `Stream` 对象。因此，可以在第一个\
  \ filter 的结果上应用第二个 `filter`，如下所示：\n\n```java\nspells.parallelStream()\n  .filter(s\
  \ -> s.type == Spell.SpellType.SPELL)\n  .filter(s -> s.name.toLowerCase().startsWith(\"\
  a\"))\n  .forEach(s -> System.out.println(s));\n```\n\n## 在集合上使用批量数据操作\n\n在这个示例中，仅列出了以字母\
  \ A 开头的咒语。*pipeline*（流水线）一词通常用于描述一系列方法调用，这些调用始于创建一个流，然后通过调用 `filter` 等方法以各种方式对流进行处理，最后以调用一个不返回另一个流对象的方法（如\
  \ `forEach`）结束。\n\n## 深入观察 Stream 接口\n\n`Stream` 接口定义了约 40 个方法。此外，三个相关的接口——`DoubleStream`、`IntStream`\
  \ 和 `LongStream` 扩展了 `Stream` 接口，以定义针对特定数据类型的操作：`double`、`int` 和 `long`。表 6-1 列出了这些接口中最常用的方法。\n\
  \n表 6-1 中的第一组方法定义了返回其他 `Stream` 对象的方法。这些方法中的每一个都会以某种方式对流进行处理，然后将修改后的流传递给流水线，由另一个操作进行处理。\n\
  \n`filter` 方法是最常用的流方法之一。它的参数被称为 *predicate*（谓词），它是一个返回布尔值的函数。该函数会为流中的每个元素被调用一次，并接收一个包含所讨论元素的单个参数。如果方法返回\
  \ `true`，则该元素被传递到结果流。如果返回 `false`，则该元素*不会*被传递。\n\n实现 `filter` 谓词最简单的方法是使用指定条件表达式的\
  \ lambda 表达式。例如，以下 lambda 表达式检查流元素的 `name` 字段，如果它以字母 *a*（大写或小写）开头，则返回 `true`：\n\n\
  ```java\ns -> s.name.toLowerCase().startsWith(\"a\")\n```\n\n第一组中的其他方法允许你限制流中的元素数量或对流元素进行排序。要对流进行排序，可以使用元素的自然顺序，或者提供你自己的比较器函数。\n\
  \n表 6-1 中的第二组方法被称为 *mapping methods*（映射方法），因为它们将元素类型为一种类型的流元素类型为另一种类型的流。你必须作为参数传递的映射函数负责将数据从第一种类型转换为第二类型。\n\
  \n### 表 6-1：Stream 及相关接口\n\n| 返回流的方法 | 解释 |\n| :--- | :--- |\n| `Stream distinct()`\
  \ | 返回由去重元素组成的流。换句话说，去除了重复项。 |\n| `Stream limit(long maxSize)` | 返回输入流中最多 `maxSize`\
  \ 个元素的流。 |\n| `Stream filter(Predicate super T predicate)` | 返回输入流中符合 `predicate`\
  \ 条件的元素。 |\n| `Stream sorted()` | 使用自然顺序对流元素排序。 |\n| `Stream sorted(Comparator super\
  \ T comparator)` | 使用指定的 `Comparator` 对流元素排序。该 `Comparator` 接受两个参数，如果第一个小于第二个则返回负值，相等则返回零，第一个大于第二个则返回正值。\
  \ |\n\n| 映射方法 | 解释 |\n| :--- | :--- |\n| `<R> Stream<R> map(Function<? super T,\
  \ ? extends R> mapper)` | 将 `mapper` 应用于每个元素生成的流。 |\n| `DoubleStream mapToDouble(ToDoubleFunction<?\
  \ super T> mapper)` | 将 `mapper` 应用于每个元素生成的 `DoubleStream`。 |\n| `IntStream mapToInt(ToIntFunction<?\
  \ super T> mapper)` | 将 `mapper` 应用于每个元素生成的 `IntStream`。 |\n| `LongStream mapToLong(ToLongFunction<?\
  \ super T> mapper)` | 将 `mapper` 应用于每个元素生成的 `LongStream`。 |\n\n| 终端操作与聚合方法 | 解释\
  \ |\n| :--- | :--- |\n| `void forEach(Consumer super T action)` | 对流中的每个元素执行 `action`。\
  \ |\n| `void forEachOrdered(Consumer super T action)` | 对流中的每个元素执行 `action`，确保按输入元素的顺序处理。\
  \ |\n| `long count()` | 返回流中元素的数量。 |\n| `Optional<T> max(Comparator super T comparator)`\
  \ | 返回流中的最大元素。 |\n| `Optional<T> min(Comparator super T comparator)` | 返回流中的最小元素。\
  \ |\n| `OptionalDouble average()` | 返回元素的平均值。仅适用于 `DoubleStream`、`IntStream` 和 `LongStream`。\
  \ |\n| `double sum()` | 返回元素的总和。结果类型对于 `DoubleStream` 为 `double`，`IntStream` 为 `int`，`LongStream`\
  \ 为 `long`。 |\n| `Statistics summaryStatistics()` | 返回一个汇总统计对象，包含流元素的 `getCount`、`getSum`、`getAverage`、`getMax`\
  \ 和 `getMin` 属性方法。结果类型对于 `IntStream` 为 `IntSummaryStatistics`，对于 `DoubleStream`\
  \ 为 `DoubleSummaryStatistics`，对于 `LongStream` 为 `LongSummaryStatistics`。 |\n\n\n\
  \n\n\n映射方法的一个常见用途是将复杂类型的流转换为 `double`、`int` 或 `long` 类型的简单数值流，然后你可以使用这些流来执行求和或平均值等聚合计算。例如，假设哈利波的法咒是可以出售的，并且\
  \ `Spell` 类包含一个名为 `price` 的公共字段。为了计算所有法咒的平均价格，你必须先将 `Spell` 对象的流转换为 `double` 流。为了实现这一点，你需使用\
  \ `mapToDouble` 方法。映射函数只需返回 `price` 字段即可：\n\n```\n.mapToDouble(s -> s.price)\n```\n\
  \n表 6-1 中最后一组中的方法被称为**终端方法（terminal methods）**，因为它们不会返回另一个流。因此，它们始终是流流水线中最后被调用的方法。\n\
  \n你已经看到过 `forEach` 方法的作用了；它提供了一个为流中的每个元素调用一次的函数。请注意，在之前的示例中，在每个元素上执行的函数仅包含一个单一的方法调用，因此我直接将其包含在\
  \ lambda 表达式中。如果函数更复杂，可以将其隔离在自己的方法中。然后 lambda 表达式应该调用定义该函数的方法。\n\n聚合方法对流中的所有元素执行计算，然后返回结果。在聚合方法中，`count`\
  \ 是直观的：它简单地返回流中的元素数量。其他聚合方法需要稍微解释，因为它们返回的是可选数据类型（optional data type）。`可选数据类型`是一个可能包含值的对象，也可能不包含。\n\
  \n例如，`average` 方法计算整数、长或双精度流的平均值，并将结果作为 `OptionalDouble` 返回。如果流为空，则平均值是未定义的，因此 `OptionalDouble`\
  \ 不包含值。你可以通过调用其 `isPresent` 方法来判断 `OptionalDouble` 是否包含值，如果存在值，则返回 `true`。如果有值，你可以通过调用\
  \ `getAsDouble` 方法获取它。\n\n请注意，如果没有值，`getAsDouble` 将抛出异常，因此你应该在调用 `getAsDouble` 之前始终调用\
  \ `isPresent`。\n\n这里有一个计算法咒平均价格的示例：\n\n```\nOptionalDouble avg = spells.stream()\n\
  .mapToDouble(s -> s.price)\n.average();\n```\n\n以下是将平均价格打印到控制台的方法：\n\n```\nif (avg.isPresent())\n\
  {\n    System.out.println(\"Average = \"\n    + avg.getAsDouble());\n}\n```\n\n\
  #### 使用并行流\n\n流有两种基本类型：`sequential`（顺序）和 `parallel`（并行）。顺序流中的元素由 `stream` 方法产生，并创建出逐接处理每个元素的流。相比之下，并行流可以通过将其元素拆分为两个或多个更小的流，对它们执行操作，然后重新组合这些流以创建最终的结果流，从而充分利用多核处理器。每个中间流都可以由单独的线程处理，这可以提高大型流的性能。\n\
  \n默认情况下，流是顺序的。但创建并行流很容易：只需在流水线的开始使用 `parallelStream` 方法代替 `stream` 方法即可。\n\n例如，要使用并行流打印哈利·波的所有法咒，请使用以下代码：\n\
  \n```\nspells.parallelStream()\n.forEach(s -> System.out.println(s));\n```\n\n注意，当你使用并行流时，无法预测流中每个元素被处理的顺序。因为当流被拆分并在两个或多个线程上运行时，处理器执行线程的顺序是不可预测的。\n\
  \n为了演示这一点，请考虑这个简单的示例：\n\n```\nSystem.out.println(\"First Parallel stream: \");\n\
  spells.parallelStream()\n.forEach(s -> System.out.println(s));\n\nSystem.out.println(\"\
  \\nSecond Parallel stream: \");\nspells.parallelStream()\n.forEach(s -> System.out.println(s));\n\
  ```\n\n当你执行这段代码时，结果看起来如下：\n\n```\nFirst parallel stream:\nFidelius\nFinite Incatatum\n\
  Engorgio\nLocomotor Mortis\nAparecium\nAvis\n\nSecond parallel stream:\nFidelius\n\
  Engorgio\nFinite Incatatum\nLocomotor Mortis\nAvis\nAparecium\n```\n\n注意，尽管每个流打印的是相同的法咒，但它们的打印顺序是不同的。\n\
  \n\n\n\n继续工作。这些程序启动一个单独的线程来处理打印任务。\n\n*   文字处理器还你输入时时检查拼写。取决于文字处理器的实现，它可能会在单独的线程中运行拼写检查。\n\
  *   游戏程序通常使用多个线程来处理游戏的不同部分，以提高游戏的整体响应能力。\n*   所有基于 GUI 的程序至少使用两个线程 —— 一个线程运行应用程序的主逻辑，另一个线程用于监控鼠标和键盘事件。你将在第\
  \ 6 章中学习如何用 Java 创建 GUI 程序。\n*   事实上，Java 虚拟机本身也使用线程来处理一些内部管理工作。例如，垃圾回收器作为一个单独的线程运行，这样它就可以不断监控虚拟机内存的状态，并决定何时需要通过移除不再使用的对象来创建一些可用内存。\n\
  \n# 创建线程\n\n假设你正在为美国国家航空航天局（NASA）开发软件，你负责控制载人航天器倒计时最后 31 秒的程序。你的软件必须协调计时到达特定点时发生的几个关键事件：\n\
  \n*   **T 减 16 秒：** 淹没发射平台。此事件向发射平台释放 35 万加仑水，这有助于在发射期间保护航天器系统。\n*   **T 减 6 秒：**\
  \ 启动主引擎。当引擎建立推力时，巨大的夹具会将航天器固定住。\n*   **T 减 0：** 起飞！夹具释放，航天器飞向太空。\n\n对于这个程序，我并没有实际启动任何火箭引擎或释放大量水。相反，我只是在控制台上显示消息来模拟这些事件。但我确实创建了四个独立的线程来让一切正常运行。一个线程管理倒计时钟。另外三个线程在\
  \ T 减 16 秒（淹没平台）、T 减 6 秒（点引擎）和 T 减 0（发射）时触发各自的事件。\n\n对于该程序的第一次尝试，我只是让倒计时钟运行起来。倒计时钟由名为\
  \ `CountDownClock` 的类表示。该类所做的只是每隔 1 秒钟从 20 倒数到 0，并在计数的过程中在控制台上显示诸如 T 减 20 等消息。这个版本的程序并没有做什么，但它演示了如何让一个线程运行起来。我们将从查看\
  \ `Thread` 类开始。\n\n## 理解 Thread 类\n\n`Thread` 类允许你创建一个对象，该对象可以在多线程 Java 应用程序中作为线程运行。`Thread`\
  \ 类有很多构造函数和方法，但对于大多数应用程序，你只需要使用表 1-1 中列出的那些。（注意，此表是为了向你提供 `Thread` 类的概述并作为参考。先不要担心每个构造函数和方法的细节。在本章结束时，我将解释每一个构造函数和方法。）\n\
  \n### 表 1-1 Thread 类的构造函数和方法\n\n| 构造函数 | 解释 |\n| :--- | :--- |\n| `Thread()` | 创建\
  \ `Thread` 类的实例。该构造函数是不带参数的基础 `Thread` 构造函数。 |\n| `Thread(String name)` | 创建一个 `Thread`\
  \ 对象并将指定的名称分配给该线程。 |\n| `Thread(Runnable target)` | 将任何实现 `Runnable` 接口的对象转换为线程。你将在本章稍后看到如何使用这个更高级的构造函数。\
  \ |\n| `Thread(Runnable target, String name)` | 从任何实现 `Runnable` 的对象创建线程，并将指定的名称分配给该线程。\
  \ |\n| `static int activeCount()` | 返回活动线程的数量。 |\n| `static int enumerate(Thread[]\
  \ t)` | 用每个活动线程的副本填充指定的数组。返回值为添加到数组中的线程数。 |\n| `String getName()` | 返回线程的名称。 |\n\
  | `int getPriority()` | 返回线程的优先级。 |\n| `void interrupt()` | 中断此线程。 |\n| `boolean\
  \ isInterrupted()` | 检查线程是否被中断。 |\n| `void setPriority(int priority)` | 设置线程的优先级。\
  \ |\n| `void setName(String name)` | 设置线程的名字。 |\n| `static void sleep(int milliseconds)`\
  \ | 使当前执行的线程睡眠指定的毫秒数。 |\n| `void run()` | 在线程启动时被调用。在此方法内部放置你想要让线程执行的代码。 |\n| `void\
  \ start()` | 启动线程。 |\n| `static void yield()` | 使当前执行的线程让给等待执行的其他线程。 |\n\n## 扩展\
  \ Thread 类\n\n创建线程最简单的方法是编写一个扩展 `Thread` 类的类。然后你启动线程要做的就是创建你的线程类的实例并调用它的 `start`\
  \ 方法。\n\n代码列表 1-1：CountDownClock 类（版本 1）\n\n```java\npublic class CountDownClock\
  \ extends Thread {\n    public void run() {\n        for (int t = 20; t >= 0; t--)\
  \ {\n            System.out.println(\"T minus \" + t);\n            try {\n    \
  \            Thread.sleep(1000);\n            } catch (InterruptedException e) {\n\
  \            }\n        }\n    }\n}\n```\n\n**列表 1-1 中的要点：**\n*   `CountDownClock`\
  \ 类扩展了 `Thread` 类。`Thread` 定义在 `java.lang` 包中，所以不需要导入。\n*   `CountDownClock` 类有一个方法\
  \ `run`，该方法在线程启动时被调用。由线程执行的所有处理必须在 `run` 方法中或在 `run` 方法调用的其他方法中。\n*   `run` 方法包含一个从\
  \ 20 到 0 的 `for` 循环。\n*   它使用 `sleep` 方法暂停 1 秒。由于 `sleep` 方法抛出 `InterruptedException`，因此使用\
  \ `try/catch` 语句处理该异常。如果捕获到异常，则将其忽略。\n*   在执行的某些时刻，`run` 方法必须调用 `sleep` 或 `yield`\
  \ 以给予其他线程执行的机会。\n\n## 创建并启动线程\n\n在定义了定义线程对象的类后，你可以创建并启动线程。这里是倒计时应用程序的主类：\n\n```java\n\
  public class CountDownApp {\n    public static void main(String[] args) {\n    \
  \    Thread clock = new CountDownClock();\n        clock.start();\n    }\n}\n```\n\
  \n在这里声明了一个 `Thread` 类型的变量，并创建了 `CountDownClock` 的实例赋值给它。这创建了一个 `Thread` 对象，但在调用其\
  \ `start` 方法之前，线程不会开始执行。当你运行此程序时，线程开始每 1 秒递减一次倒计时，并在控制台上显示如下消息：\n\nT 减 20\nT 减 19\n\
  T 减 18\n依此类推，直到零。\n\n## 实现 Runnable 接口\n\n对于触发特定倒计时事件（如淹没发射平台、启动事件和起飞）的线程，我创建了另一个名为\
  \ `LaunchEvent` 的类。该类使用了另一种创建和启动线程的技术 —— 这种技术需要多几行代码，但更灵活。\n\n创建扩展 `Thread`类的类的问题是，类只能有一个父类。如果你希望你的线程对象扩展其他某个类呢？在这种情况下，你可以创建一个实现\
  \ `Runnable` 接口的类，而不是扩展 `Thread` 类。`Runnable` 接口标记了一个可以作为线程运行的对象。它只有一个方法 `run`，该方法包含了由线程执行的代码。\n\
  \n\n\n在线程中执行的代码。（`Thread` 类本身实现了 `Runnable`，这也就是为什么 `Thread` 类拥有一个 `run` 方法。）\n\n\
  480 第 5 本 **编程技巧**\n\n## 使用 Runnable 接口\n\n要使用 `Runnable` 接口创建并启动线程，你必须执行以下操作：\n\
  \n1. 创建一个实现 `Runnable` 的类。\n2. 在第 1 步创建的类中提供一个 `run` 方法。\n3. 创建一个 `Thread` 类的实例，并将你的\
  \ `Runnable` 对象作为参数传递给它的构造函数。这将创建一个可以运行你的 `Runnable` 类的 `Thread` 对象。\n4. 调用 `Thread`\
  \ 对象的 `start` 方法。\n\n你的 `Runnable` 对象的 `run` 方法将被调用并在单独的线程中执行。\n\n这前两个步骤很容易完成。巧妙之处在于第三和第四步，因为你可以通过多种方式来完成它们。这里是一种方法，假设你的\
  \ `Runnable` 类名为 `RunnableClass`：\n\n### 编程线程\n\n```\nRunnableClass rc = new RunnableClass();\n\
  Thread t = new Thread(rc);\nt.start();\n```\n\nJava 程序员喜欢尽可能简洁，所以你经常看到这段代码被压缩成类似下面的样子：\n\
  \n```\nThread t = new Thread(new RunnableClass());\nt.start();\n```\n\n甚至只是这样：\n\
  \n```\nnew Thread(new RunnableClass()).start();\n```\n\n这种单行版本是可行的——只要你不需要在程序的后续部分访问该线程对象。\n\
  \n## 创建实现 Runnable 的类\n\n为了顺序启动 NASA 应用程序的事件，我创建了一个名为 `LaunchEvent` 的 `Runnable`\
  \ 对象。该类的构造函数接受两个参数：触发事件的倒计时时间，以及时间到达时显示的消息。该类的 `run` 方法使用 `Thread.sleep` 等待到指定的时间到达。然后它显示该消息。\n\
  \n第 1 章 **编程线程** 481\n\n代码列表 1-2 显示了该类的代码。\n\n**代码列表 1-2：**\n**LaunchEvent 类（版本\
  \ 1）**\n\n```java\npublic class LaunchEvent implements Runnable\n{\n    private\
  \ int start;\n    private String message;\n\n    public LaunchEvent(int start, String\
  \ message)\n    {\n        this.start = start;\n        this.message = message;\n\
  \    }\n\n    public void run()\n    {\n        try\n        {\n            Thread.sleep(20000\
  \ - (start * 1000));\n        }\n        catch (InterruptedException e)\n      \
  \  {}\n        System.out.println(message);\n    }\n}\n```\n\n接下来的段落将你引起列表中的关键行：\n\
  \n- **1**: 此类实现了 `Runnable` 接口。\n- **6**: 构造函数接受两个参数：一个表示开始时间（秒为单位）的整数和一个时间到达时显示的字符串消息。构造函数简单地将这些参数值存储在\
  \ `private` 字段中。\n- **16**: 在 `run` 方法中，调用了 `Thread.sleep` 方法让线程休眠，直到指定的倒计时时间到达。线程应该睡眠的时间通过表达式\
  \ `20000 - (start * 1000)` 计算。倒计时钟从 20 秒开始，即 20,000 毫秒。该表达式简单地从 20,000 中减去对应目标开始时间的毫秒数。因此，如果目标开始时间是\
  \ 6 秒，`sleep` 方法将睡眠 14,000 毫秒——即 14 秒。\n- **20**: 当线程唤醒时，它将通过构造函数传递的消息显示在控制台上。\n\
  \n482 第 5 本 **编程技巧**\n\n## 使用 CountDownApp 类\n\n现在你已经已经了 `LaunchEvent` 和 `CountDownClock`\
  \ 类的代码，代码列表 1-3 显示了 `CountDownApp` 类的代码，它使用这些类来发射飞天器。\n\n**代码列表 1-3：**\n**CountDownApp\
  \ 类（版本 2）**\n\n```java\npublic class CountDownApp\n{\n    public static void main(String[]\
  \ args)\n    {\n        Thread clock = new CountDownClock();\n        Runnable flood,\
  \ ignition, liftoff;\n        flood = new LaunchEvent(16, \"Flood the pad!\");\n\
  \        ignition = new LaunchEvent(6, \"Start engines!\");\n        liftoff = new\
  \ LaunchEvent(0, \"Liftoff!\");\n        clock.start();\n        new Thread(flood).start();\n\
  \        new Thread(ignition).start();\n        new Thread(liftoff).start();\n \
  \   }\n}\n```\n\n接下来的段落总结了该程序的工作原理：\n\n- **5**: `main` 方法通过创建一个 `CountDownClock`\
  \ 类的实例并将其保存在 `clock` 变量中开始。\n- **7**: 接下来，它创建了三个 `LaunchEvent` 对象，分别在 16 秒填充发射场、6\
  \ 秒启动发动机以及 0 秒起飞。这些对象被赋值给类型为 `Runnable` 的变量，分别为 `flood`、`ignition` 和 `liftoff`。\n\
  - **12**: 启动 `clock` 线程。倒计时开始计数。\n- **14**: 最后，程序将三个 `LaunchEvent` 对象作为线程启动。这是通过创建\
  \ `Thread` 的新实例，将 `LaunchEvent` 对象传递给 `Thread` 构造函数，然后调用 `start` 方法启动线程来实现。（注意：提供的文本包含一些来源行号，已清理）。\n\
  \n运行该程序时显示以下输出：\n\n483\nT minus 20\nT minus 19\nT minus 18\nT minus 17\nT minus\
  \ 16\nFlood the pad!\nT minus 15\nT minus 14\nT minus 13\nT minus 12\nT minus 11\n\
  T minus 10\nT minus 9\nT minus 8\nT minus 7\nStart engines!\nT minus 6\nT minus\
  \ 5\nT minus 4\nT minus 3\nT minus 2\nT minus 1\nLiftoff!\nT minus 0\n\n正如你所见，`LaunchEvent`\
  \ 消息与 `CountDownClock` 消息交错出现。注意由于计时差异，某些消息出现的精确顺序可能会不同。\n\n这种技术的优势在于你不需要为每个 `LaunchEvent`\
  \ 创建单独的变量。（不要忘记添加 `java.util.*` 导入语句以访问 `ArrayList` 类。）\n\n484 第 5 本 **编程技巧**\n\n\
  ```java\npublic static void main(String[] args)\n{\n    Thread clock = new CountDownClock();\n\
  \    ArrayList<Runnable> events = new ArrayList<Runnable>();\n    events.add(new\
  \ LaunchEvent(16, \"Flood the pad!\"));\n    events.add(new LaunchEvent(6, \"Start\
  \ engines!\"));\n    events.add(new LaunchEvent(0, \"Liftoff!\"));\n    clock.start();\n\
  \    for (Runnable e : events)\n        new Thread(e).start();\n}\n```\n\n## 编程线程\n\
  \n### 创建协作工作的线程\n\n遗憾的是，上一节介绍的倒计时应用程序有一个主要的缺陷：`CountDownClock` 和 `LaunchEvent` 线程严格依赖计时来协调它们的活动。这些线程启动后是相互独立运行的。结果，计时的随机波动会导致线程行为发生变化。如果你连续运行程序几次，你会发现有时\
  \ Start engines! 消息出现在 T minus 6 消息之后，而有时它出现在 T minus 6 消息*之前*。这对你来说可能不是什么大事，但对飞天器上的航天员来说可能是灾难性的。这些类真正需要一种通信方式。代码列表\
  \ 1-4 显示了倒计时应用程序的改进版本，它包含了几项增强。此版本的 `CountDownClock` 类增加了一个名为 `getTime` 的新方法，用于获取倒计时中的当前时间。然后\
  \ `LaunchEvent` 类每 10 毫秒检查一次倒计时时间并引-\n\n\n\n\n仅当倒计时器实际显示时间到达时才触发事件。这个版本的应用程序运行非常稳定。\n\
  \n此外，你希望启用 `LaunchEvent` 类来监控 `CountDownClock` 的状态，但你不想让 `LaunchEvent` 和 `CountDownClock`\
  \ 类之间的耦合过于紧密。假设以后你开发了一个更好的倒计时器。如果 `LaunchEvent` 类知道是哪个类在进行计数，那么当你使用不同的倒计时类时，就必须重新编译它。\n\
  \n# 第 1 章 线程编程 (485)\n\n解决方案是使用接口作为类之间的缓冲区。该接口定义了一个获取时钟当前状态的方法。然后，`CountDownClock`\
  \ 类可以实现该接口，而 `LaunchEvent` 类可以使用任何实现该接口的对象来获取时间。\n\n### 列表 1-4: 协调倒计时应用程序\n\n```java\n\
  import java.util.ArrayList;\n\n// 倒计时应用程序 2.0 版本\n\npublic class CountDownApp\n\
  {\n    public static void main(String[] args)\n    {\n        CountDownClock clock\
  \ = new CountDownClock(20);\n        ArrayList<Runnable> events = new ArrayList<Runnable>();\n\
  \        events.add(new LaunchEvent(16, \"Flood the pad!\", clock));\n        events.add(new\
  \ LaunchEvent(6, \"Start engines!\", clock));\n        events.add(new LaunchEvent(0,\
  \ \"Liftoff!\", clock));\n        clock.start();\n        for (Runnable e : events)\n\
  \        {\n            new Thread(e).start();\n        }\n    }\n}\n\ninterface\
  \ TimeMonitor\n{\n    int getTime();\n}\n\nclass CountDownClock extends Thread implements\
  \ TimeMonitor\n{\n    private int t;\n    public CountDownClock(int start)\n   \
  \ {\n        this.t = start;\n    }\n    public void run()\n    {\n        for (;\
  \ t >= 0; t--)\n        {\n            System.out.println(\"T minus \" + t);\n \
  \           try\n            {\n                Thread.sleep(1000);\n          \
  \  }\n            catch (InterruptedException e)\n            {}\n        }\n  \
  \  }\n    public int getTime()\n    {\n        return t;\n    }\n}\n\nclass LaunchEvent\
  \ implements Runnable\n{\n    private int start;\n    private String message;\n\
  \    TimeMonitor tm;\n    public LaunchEvent(int start, String message, TimeMonitor\
  \ monitor)\n    {\n        this.start = start;\n        this.message = message;\n\
  \        this.tm = monitor;\n    }\n    public void run()\n    {\n        boolean\
  \ eventDone = false;\n        while (!eventDone)\n        {\n            try\n \
  \           {\n                Thread.sleep(10);\n            }\n            catch\
  \ (InterruptedException e)\n            {}\n            if (tm.getTime() <= start)\n\
  \            {\n                System.out.println(this.message);\n            \
  \    eventDone = true;\n            }\n        }\n    }\n}\n```\n\n(486 书 5 编程技术)\n\
  \n接下来的段落描述该版本的亮点：\n\n- 正如你在第 35 行所示，`CountDownClock` 类的构造函数现在接受一个参数来指定倒计数的起始时间。因此，该行指定\
  \ 20 为 `CountDownClock` 对象的起始时间。\n- 使用一个 `LaunchEvent` 对象的 `ArrayList` 来存储每个发射事件。\n\
  - 创建 `LaunchEvent` 对象的行将 `CountDownClock` 对象作为参数传递给 `LaunchEvent` 构造函数。这样，`LaunchEvent`\
  \ 对象就可以根据需要调用时钟的中止方法。\n- 时钟启动了！\n- 一个增强型 for 循环启动线程来运行 `LaunchEvent` 对象。\n- `TimeMonitor`\
  \ 接口只定义了一个方法，命名为 `getTime`。该方法返回一个表示倒计时器上剩余秒数的整数。\n- `CountDownClock` 类实现了 `TimeMonitor`\
  \ 接口。\n- 使用一个名为 `t` 的私有字段来存储倒计时时器的当前值。这样，构造函数、`run` 方法和 `getTime` 方法就可以访问当前时钟值。\n\
  - `CountDownClock` 类的构造函数接受倒计数的起始时间作为参数。因此，这个倒计时器不需要从 20 秒开始。通过此参数传递的值被保存在 `t` 字段中。\n\
  - `run` 方法中的 `for` 循环测试并递减变量 `t`。但由于该变量已经过初始化，所以它没有初始化表达式。\n- `getTime()` 方法简单地返回\
  \ `t` 变量的值。\n- 这一行是 `LaunchEvent` 类的开始。\n- 使用类型为 `TimeMonitor` 的私有字段来访问倒计时时器。该对象的引用被传递给构造函数。\n\
  - `while` 循环包含了对 `Thread.sleep(10)` 的调用。\n- 如果 `tm.getTime() <= start`，则显示并将 `eventDone`\
  \ 设置为 `true`。\n\n# 使用 Executor\n\n线程编程\n(第 1 章 线程编程 487)\n\n### 列表 1-5: 新的 CountDownClock\n\
  \n```java\nclass CountDownClock extends Thread implements TimeMonitor\n{\n    int\
  \ t;\n    public CountDownClock(int start)\n    {\n        this.t = start;\n   \
  \ }\n    public void run()\n    {\n        System.out.println(\"T minus \" + t);\n\
  \    }\n}\n```\n\n### 列表 1-6: 新的 Event Launcher\n\n```java\nclass LaunchEvent implements\
  \ Runnable\n{\n    private String message;\n    public LaunchEvent(String message)\n\
  \    {\n        this.message = message;\n    }\n    public void run()\n    {\n \
  \       System.out.println(message);\n    }\n}\n```\n\n### 列表 1-7: 新的倒计时应用程序\n\n\
  ```java\nimport java.util.concurrent.ScheduledThreadPoolExecutor;\nimport java.util.concurrent.TimeUnit;\n\
  \nclass CountDownAppNew\n{\n    public static void main(String[] args)\n    {\n\
  \        ScheduledThreadPoolExecutor pool = new ScheduledThreadPoolExecutor(25);\n\
  \        Runnable flood, ignition, liftoff;\n        flood = new LaunchEventNew(\"\
  Flood the pad!\");\n        ignition = new LaunchEventNew(\"Start engines!\");\n\
  \        liftoff = new LaunchEventNew(\"Liftoff!\");\n        for (int t = 20; t\
  \ >= 0; t--)\n            pool.schedule(new CountDownClockNew(t), (long) (20 - t),\
  \ TimeUnit.SECONDS);\n        pool.schedule(flood, 3L, TimeUnit.SECONDS);\n    \
  \    pool.schedule(ignition, 13L, TimeUnit.SECONDS);\n        pool.schedule(liftoff,\
  \ 19L, TimeUnit.SECONDS);\n        pool.shutdown();\n    }\n}\n```\n\n在新倒计时应用程序版本中，列表\
  \ 1-7 完成了所有的繁琐工作。列表使用了 `ScheduledThreadPoolExecutor` 类。该类的长名称说明了大部分信息：\n\n- **Scheduled（调度）**：使用该类，你可以安排在未来的某个运行代码。\n\
  - **ThreadPool（线程池）**：该类通常同时创建多个线程（线程池）。当你想要运行某些代码时，从池中获取一个可用线程并使用该线程运行你的代码。\n-\
  \ **Executor（执行器）**：Executor 执行某些操作。没什么意外！\n\n列表 1-7 中的循环生成了 20 个线程，每个线程都有自己的初始延迟。例如，第五次循环迭代调用了\n\
  `pool.schedule(new CountDownClockNew(16), (long) (20 - 16), TimeUnit.SECONDS);`\n\
  \n\n\n\n\n在 `pool.schedule` 方法调用中，数字 `(long)` `(20 - 16)` 告诉 Java 在运行 T minus 16\
  \ 线程之前等待 4 秒。每个 T minus 都有不同的延迟，因此每个线程都会在适当的时间运行。洪流（flood）、点火（ignition）和起飞（liftoff）事件也是如此。\n\
  \n## 线程编程\n\n### 同步方法\n\n每当你编写使用线程的程序时，都必须考虑一个棘手的并发 `*.*` 问题。特别是，如果两个线程尝试在同一时刻访问对象的同一个方法会怎样？除非你的编程非常严谨，否则结果可能是灾难性的。执行简单计算的方法可能会返回不准确的结果。在在线银行应用程序中，你可能会发现某些存款被记了两次，而某些取款完全没有入账。在在线订单系统中，一个客户的订单可能会记录在另一个客户的账户下。\n\
  \n处理并发问题的关键在于识别出更新数据并可能被多个线程调用的方法。识别出这些方法后，解决方案非常简单。你只需要在方法声明中添加 `synchronized`\
  \ 关键字，如下：\n\n```\npublic synchronized void someMethod()...\n```\n\n这段代码告诉 Java 在对象上放置一个锁（`lock`），在该方法完成之前，其他任何方法无法调用该对象的任何其他同步方法。换句话说，它临时禁用了该对象的多线程。（我将在本章后面的“创建锁”部分中讨论锁的内容。）\n\
  \n接下来的几个列表展示了一些具体的示例。列表 1-8 创建了 `CountDownClock` 类的实例（见列表 1-1 中的类）。\n\n**列表 1-8：创建两个\
  \ CountDownClock 线程**\n\n```java\nimport java.util.concurrent.ScheduledThreadPoolExecutor;\n\
  \npublic class DoTwoThings\n{\n    ScheduledThreadPoolExecutor pool =\n    new ScheduledThreadPoolExecutor(2);\n\
  \n    CountDownClock clock = new CountDownClock(20);\n\n    public static void main(String[]\
  \ args)\n    {\n        new DoTwoThings();\n    }\n\n    DoTwoThings()\n    {\n\
  \        pool.execute(clock);\n        pool.execute(clock);\n        pool.shutdown();\n\
  \    }\n}\n```\n\n最终输出是两个线程输出的不可预测的混合，其中某些计数重复了，另一些则完全跳过了，如下：\n\n```\nT minus 20\n\
  T minus 20\nT minus 19\nT minus 19\nT minus 18\nT minus 17\nT minus 16\nT minus\
  \ 15\nT minus 13\nT minus 13\nT minus 12\nT minus 12\nT minus 11\nT minus 11\nT\
  \ minus 10\nT minus 9\nT minus 7\nT minus 7\nT minus 6\nT minus 5\nT minus 4\nT\
  \ minus 3\nT minus 2\nT minus 2\nT minus 1\nT minus 0\n```\n\n两个线程同时执行它们的循环，因此当一个线程显示其\
  \ T minus 20 后，另一个线程也会显示它自己的 T minus 20。T minus 19、T minus 18 等情况也是如此。\n\n然后，列表\
  \ 1-9 产生了两个线程，每个线程都运行 `CountDownClock` 实例代码的副本。\n\n**列表 1-9：再创建两个 CountDownClock\
  \ 线程**\n\n```java\nimport java.util.concurrent.ScheduledThreadPoolExecutor;\n\n\
  public class DoTwoThingsSync\n{\n    ScheduledThreadPoolExecutor pool =\n    new\
  \ ScheduledThreadPoolExecutor(2);\n\n    CountDownClockSync clock =\n    new CountDownClockSync(20);\n\
  \n    public static void main(String[] args)\n    {\n        new DoTwoThingsSync();\n\
  \    }\n\n    DoTwoThingsSync()\n    {\n        pool.execute(clock);\n        pool.execute(clock);\n\
  \        pool.shutdown();\n    }\n}\n```\n\n在列表 1-10 中，Java 的 `synchronized` 关键字确保同一时间只有一个线程调用\
  \ `run` 方法。最终输出显示了一次完整的 `run` 方法执行，随后是另一次执行。\n\n**列表 1-10：使用 synchronized 关键字**\n\
  \n```java\nclass CountDownClockSync extends Thread\n{\n    private int start;\n\n\
  \    public CountDownClockSync(int start)\n    {\n        this.start = start;\n\
  \    }\n\n    synchronized public void run()\n    {\n        for (int t = start;\
  \ t >= 0; t--)\n        {\n            System.out.println(\"T minus \" + t);\n \
  \           try\n            {\n                Thread.sleep(1000);\n          \
  \  }\n            catch (InterruptedException e)\n            {}\n        }\n  \
  \  }\n}\n```\n\n两个线程对 `run` 方法的调用不是交错的，因此输出从 20 递减到 0，然后再次从 20 递减到 0：\n\n```\nT\
  \ minus 20\nT minus 19\nT minus 18\n... 等此类推，直到\nT minus 2\nT minus 1\nT minus 0\n\
  T minus 20\nT minus 19\nT minus 18\n... 等此类推，直到\nT minus 2\nT minus 1\nT minus 0\n\
  ```\n\n最困难的部分在于知道哪些方法需要进行同步。当我说任何更新数据的方法都可以同步时，我指的不仅仅是更新数据库的方法。任何更新实例变量的方法都有风险。即使是只有一行代码的方法也存在风险。考虑这种情况：\n\
  \n```java\nint sequenceNumber = 0;\n\npublic int getNextNumber()\n{\n    return\
  \ sequenceNumber++;\n}\n```\n\n你可能会认为，因为这个方法只有一条语句，其他线程无法中断它。遗憾的是，事实并非如此。该方法编译后产生\
  \ 11 条字节码指令。如果线程在这些字节码之间的任何位置被另一个调用相同方法的线程抢占执行，序列号就会混乱。为了安全起见，为什么不直接将方法设置为同步的呢？有两个理由不这样做：\n\
  \n1. 同步方法需要时间。Java 必须在对象上获取锁（见下一节），运行该方法，然后释放锁。但在此之前，它必须检查是否有其他线程已经获取了该对象的锁。\n2.\
  \ 更重要的是，同步所有方法会违背多线程的初衷，因此你应该只同步那些需要的方法。\n\n`synchronized` 关键字并没有阻止对对象的所有访问。在对象被锁定时，其他线程仍然运行该对象的非同步方法。\n\
  \n### 创建锁\n\n几年前，Java 1.5 版本引入了许多新的线程特性。其中一个特性就是引入了锁。锁可以取代 Java 的 `synchronized`\
  \ 关键字，但锁要通用得多。1-11 和 1-12 展示了锁的使用。\n\n**列表 1-11：再次创建 CountDownClock 线程**\n\n```java\n\
  import java.util.concurrent.ScheduledThreadPoolExecutor;\n\npublic class DoTwoThingsLocked\n\
  {\n    ScheduledThreadPoolExecutor pool =\n    new ScheduledThreadPoolExecutor(2);\n\
  \n    CountDownClock clock = new CountDownClock(20);\n\n    public static void main(String[]\
  \ args)\n    {\n        new DoTwoThingsLocked();\n    }\n\n    DoTwoThingsLocked()\n\
  \    {\n        pool.execute(clock);\n        pool.execute(clock);\n        pool.shutdown();\n\
  \    }\n}\n```\n\n**列表 1-12：使用锁**\n\n```java\nimport java.util.concurrent.locks.ReentrantLock;\n\
  \npublic class CountDownClockLocked extends Thread\n{\n```\n\n\n\n\n\n```java\n\
  ReentrantLock lock = new ReentrantLock();\n\npublic void run()\n{\n    lock.lock();\n\
  \    for (int t = 20; t >= 0; t--)\n    {\n        System.out.println(\"T minus\
  \ \" + t);\n        try\n        {\n            Thread.sleep(1000);\n        }\n\
  \        catch (InterruptedException e)\n        {}\n    }\n    lock.unlock();\n\
  }\n```\n\n`Listing 1-12` 与 `Listing 1-10` 非常相似。唯一的显著区别是用对 `ReentrantLock` 方法的调用替换了\
  \ `synchronized` 关键字。\n\n在 `Listing 1-12` 的开始处，代码声明了变量 `lock` —— 它是 `ReentrantLock`\
  \ 类的一个实例。这个 `lock` 对象就像加油站的洗手间钥匙：一次只能有一个线程拥有 `lock` 对象。当一个线程获取了 `lock` 对象时（通过在 `run`\
  \ 方法开始处调用 `lock.lock()`），其他其他线程都无法通过 `lock.lock()` 调用。第二个线程必须在 `lock.lock()` 调用处等待，直到“洗手间钥匙”可用。在\
  \ `Listing 1-12` 中，只有当第一个线程到达 `lock.unlock()` 语句时，钥匙才可用。在第一个线程调用 `lock.unlock()`\
  \ 之后，第二个线程将进入该方法的 `for` 循环。\n\n最终结果与 `Listings 1-9` 和 `1-10` 的输出相同。在这个例子中，使用 `lock`\
  \ 并不比使用 Java 的 `synchronized` 关键字更好。但 Java `1.5` 拥有多种锁，每种锁都有其独有的有用特性。\n\n## 处理线程中断\n\
  \n你可以通过调用另一个线程的 `interrupt` 方法来中断它，前提是你拥有该线程的引用，例所示：\n\n```java\nt.interrupt();\n\
  ```\n\n在这里，变量 `t` 所引用的线程被中断了。现在，所有被中断的线程需要做的就是发现自己被中断了，并做出相应的响应。这就是后续章节的主题。\n\n\
  ### 确定你是否被中断\n\n正如你所看到的，`Thread` 类的几个方法（包括 `sleep` 和 `yield`）会抛出 `InterruptedException`。到目前为止，我一直告诉你只需忽略这个异常\
  \ —— 在很多情况下，这样做是恰当的。然而，许多（如果不是大多数的话）线程都应该以某种方式响应 `InterruptedException`。在大多数情况下，线程在被中断时应该终止。\n\
  \n遗憾的是，确定一个线程是否被中断并没有听起来那么简单。当线程没有执行代码时，如果另一个线程调用该线程的 `interrupt` 方法，就会抛出 `InterruptedException`。这就是为什么那些可能导致线程将控制权交给另一个线程的方法抛出这个异常。这样，当线程恢复执行时，你就知道它被中断了。\n\
  \n然而，`yield` 和 `sleep` 方法并不是夺取线程控制权的唯一方式。有时线程调度器会直接介入并说：“你的时间够了；现在轮到别人玩了。”如果发生这种情况，随后另一个线程调用了你线程的\
  \ `interrupt` 方法，并没有抛出 `InterruptedException`。相反，一个名为*中断标记*（interrupted flag）的特殊标记会被设置，以指示该线程被中断。你可以通过调用静态方法\
  \ `interrupted` 来测试此标记的状态。\n\n遗憾的是，这意味着你的线程必须检查两次以确定它们是否被中断。\n\n通常的做法是遵循以下这种形式：\n\
  \n```java\npublic void run()\n{\n    boolean done = false;\n    boolean abort =\
  \ false;\n    while(!done)\n    {\n        // 在此处执行线程的工作\n        // 完成后将 done 设置为\
  \ true\n        try\n        {\n            sleep(100); // 休一会\n        }\n    \
  \    catch(InterruptedException e)\n        {\n            abort = true;\n     \
  \   }\n        if (Thread.interrupted())\n            abort = true;\n        if\
  \ (abort)\n            break;\n    }\n}\n```\n\n在这里，如果抛出了 `InterruptedException`\
  \ 或设置了中断标记，布尔变量 `abort` 将被设置为 true。然后，如果 `abort` 被设置为 true，将执行 `break` 语句退出 `while`\
  \ 循环。当然，这种方案有无数种变体，但这种在大多数情况下都是有效的。\n\n## 中止倒计时\n\n为了说明你如何中断线程，`Listing 1-13` 展示了倒计时应用程序的另一个版本。如果任何发射事件出现问题，该版本将中止倒计时。\n\
  \n为了稍微简化代码，我假设 NASA 的情况并不顺利，因此每个发射事件都会导致失败，并指示需要中止倒计时。因此，每当 `LaunchEvent` 的启动时间到达时，`LaunchEvent`\
  \ 类都会尝试中止倒计时。不言而喻，在真实的发射控制程序中，除非真的*发生*了错误，否则你不想中止发射。\n\n### 列表 1-13: 带有中止功能的倒计时应用程序\n\
  \n```java\nimport java.util.ArrayList;\n\npublic class CountDownApp\n{\n    public\
  \ static void main(String[] args)\n    {\n        CountDownClock clock = new CountDownClock(20);\n\
  \        ArrayList<Runnable> events = new ArrayList<Runnable>();\n        events.add(new\
  \ LaunchEvent(16, \"Flood the pad\", clock));\n        events.add(new LaunchEvent(10,\
  \ \"Start engines\", clock));\n        events.add(new LaunchEvent(0, \"Liftoff!\"\
  , clock));\n\n        for (Runnable e : events)\n        {\n            new Thread(e).start();\n\
  \        }\n    }\n}\n\ninterface TimeMonitor\n{\n    int getTime();\n    void abortCountDown();\n\
  }\n\nclass CountDownClock extends Thread implements TimeMonitor\n{\n    private\
  \ int t;\n\n    public CountDownClock(int start)\n    {\n        this.t = start;\n\
  \    }\n\n    public void run()\n    {\n        boolean done = false;\n        boolean\
  \ abort = false;\n        while (!done)\n        {\n            System.out.println(\"\
  T minus \" + t--);\n            try\n            {\n                sleep(1000);\n\
  \            }\n            catch (InterruptedException e)\n            {\n    \
  \            abort = true;\n            }\n            if (Thread.interrupted())\n\
  \                abort = true;\n            if (abort)\n            {\n        \
  \        System.out.println(\"Stopping the clock!\");\n                break;\n\
  \            }\n        }\n    }\n\n    public synchronized int getTime()\n    {\n\
  \        return t;\n    }\n\n    public synchronized void abortCountDown()\n   \
  \ {\n        Thread[] threads = new Thread[Thread.activeCount()];\n        Thread.enumerateStackThreads(threads);\n\
  \        for (Thread t : threads)\n        {\n            t.interrupt();\n     \
  \   }\n    }\n}\n\nclass LaunchEvent implements Runnable\n{\n    private int start;\n\
  \    private String message;\n    private TimeMonitor tm;\n\n    public LaunchEvent(int\
  \ start, String message, TimeMonitor monitor)\n    {\n        this.start = start;\n\
  \        this.message = message;\n        this.tm = monitor;\n    }\n\n    public\
  \ void run()\n    {\n        boolean eventDone = false;\n        boolean abort =\
  \ false;\n        while (!eventDone)\n        {\n            try\n            {\n\
  \                sleep(100);\n            }\n            catch (InterruptedException\
  \ e)\n            {\n                abort = true;\n            }\n            if\
  \ (tm.getTime() <= start)\n            {\n                System.out.println(message);\n\
  \                eventDone = true;\n                System.out.println(\"ABORT!!!!\"\
  );\n            }\n            if (Thread.interrupted())\n                abort\
  \ = true;\n            if (abort)\n            {\n                System.out.println(\"\
  Aborting \" + message);\n                break;\n            }\n        }\n    }\n\
  }\n```\n\n\n\n\n\n→54: 如果 `aborted` 字段被设置为 `true`，则意味着线程已被中断，此时会显示消息 `Stopping the\
  \ clock!`，并通过 `break` 语句退出循环。从而终止线程。\n\n→67: `abortCountDown` 方法是同步的（synchronized）。这是因为任何一个\
  \ `LaunchEvent` 对象都可以调用它，而且无法保证它们不会同时尝试调用它。\n\n→69: `abortCountDown` 方法开始时会创建一个\
  \ `Thread` 对象的数组，数组的大小足够容纳所有活跃的线程。活跃线程的数量由 `Thread` 类的 `activeCount` 方法提供。\n\n→70:\
  \ `abortCountDown` 方法调用 `Thread` 类的 `enumerate` 方法将所有活跃线程复制到该数组中。注意，该方法是 `static`（静态的），因此你不需要任何特定线程的引用即可使用它。（第\
  \ 69 行使用的 `activeCount` 方法也是 `static` 的。）\n\n→71: 使用增强型 for 循环调用所有活跃线程的 `interrupt`\
  \ 方法。该方法会关闭所有内容。\n\n→92: 像 `CountDownClock` 类一样，`LaunchEvent` 类使用一个布尔变量来指示线程是否已被中断。如果在第\
  \ 101 行捕获到 `InterruptedException`，或者在第 111 行 `Thread.interrupted()` 返回 `true`，则该变量会被设置为真；随后在第\
  \ 112 行对其进行测试。如果 `aborted` 变量被设置为 `true`，线程会打印一条指示启动事件已中止的消息，并使用 `break` 语句退出循环（从而）终止线程。\n\
  \n→101: 当启动事件的开始时间到达时，`LaunchEvent` 类会显示消息 `ABORT!` 并调用 `abortCountDown` 方法。因此，当任何启动事件发生时，倒计时就会中止。\n\
  \n# 线程编程\n\n当你运行这个版本的倒计时应用程序时，控制台输出将类似于所示（由于线程同步性，可能会出现细微差异）：\n\n```\nT minus 20\n\
  T minus 19\nT minus 18\nT minus 17\nT minus 16\nFlood the pad!\nABORT!!!!\nStopping\
  \ the clock!\nAborting Flood the pad!\nAborting Start engines!\nAborting Liftoff!\n\
  ```\n\n# 第 2 章：使用正则表达式\n\n## 本章内容\n- 介绍正则表达式\n- 通过一个实用的程序尝试正则表达式\n- 创建匹配字符模式的简单表达式\n\
  - 使用正则表达式的特性，如自定义类、量词和分组\n- 在 `String` 类中使用正则表达式\n- 使用 `Pattern` 和 `Matcher` 类处理更广泛的正则表达式\n\
  \n正则表达式并不是那种饮食中含有大量“纤维”的表达式。相反，*正则表达式*（regular expression）是一种特殊的模式匹配字符串，对于进行字符串操作的程序非常有用。正则表达式字符串包含特殊的模式匹配字符，这些字符可以与另一个字符串进行匹配，以检查另一个字符串是否符合该模式。你会发现正则表达式对于执行复杂的数据验证非常方便——例如，确保用户输入的是格式正确的电话号码、电子邮件地址或社会安全码。\n\
  \n正则表达式对于许多其他用途也有用，包括搜索文本文件以查看其是否包含某些模式（你能直说 Google 吗？）、根据内容过滤电子邮件，或执行复杂的搜索和替换功能。\n\
  \n在本章中，你将了解到使用正则表达式的基础知识。我强调了验证，并关注于将用户输入的字符串与正则表达式指定的模式进行比较，以查看它们是否匹配。对于更复杂的正则表达式用法，你必须转向更广泛的正则表达式参考资料。你可以使用\
  \ Google 等搜索引擎找到几个深度教程；搜索 `regular expression tutorial` 即可。\n\n正则表达式是用一种简单但强大的微语言构建的，因此它们本身就像小程序。遗憾的是，这种微语言非常精简——极其简洁——以至于有时完全晦涩。它大部分取决于包含大量意义的单个字符，而这些意义往往很模糊。所以请注意——正则表达式的语法需要一点时间适应。不过，一旦你掌握了基础知识，就会发现创建简单的正则表达式并不困难，而且非常有用。\n\
  \n此外请注意，本章仅涵盖了正则表达式能做的部分内容。如果你发现自己需要使用更复杂的模式，可以在互联网上找到大量有用信息。只需在任何搜索引擎中搜索 *regular\
  \ expression.* 即可。\n\n正则表达式通常被称为 *regex*。大多数人读这个词时 *g* 是软音的，就像拼写成 *rejex* 一样，有些人的读音则像拼写成\
  \ *rejects*。\n\n## 创建用于实验正则表达式的程序\n\n在我详细介绍组合正则表达式的细节之前，请大家关注列表 2-1，它展示了一个在学习如何创建正则表达式时非常有用的短程序。首先，这个程序让你输入正则表达式。接下来，你输入一个字符串，程序会针对正则表达式进行测试并告诉你是否匹配。当你完成时，只需按回车键而不输入字符串。###\
  \ 列表 2-1：正则表达式测试程序\n\n```java\nimport java.util.regex.*;\nimport java.util.Scanner;\n\
  \npublic final class Reg {\n    static String r, s;\n    static Pattern pattern;\n\
  \    static Matcher matcher;\n    static boolean match, validRegex, doneMatching;\n\
  \    private static Scanner sc = new Scanner(System.in);\n\n    public static void\
  \ main(String[] args) {\n        System.out.println(\"Welcome to the Regex Tester\\\
  n\");\n        do {\n            do {\n                System.out.print(\"\\nEnter\
  \ regex: \");\n                r = sc.nextLine();\n                validRegex =\
  \ true;\n                try {\n                    pattern = Pattern.compile(r);\n\
  \                } catch (Exception e) {\n                    System.out.println(e.getMessage());\n\
  \                    validRegex = false;\n                }\n            } while\
  \ (!validRegex);\n            doneMatching = false;\n            while (!doneMatching)\
  \ {\n                System.out.print(\"Enter string: \");\n                s =\
  \ sc.nextLine();\n                if (s.length() == 0) {\n                    doneMatching\
  \ = true;\n                } else {\n                    matcher = pattern.matcher(s);\n\
  \                    if (matcher.matches()) {\n                        System.out.println(\"\
  Match.\");\n                    } else {\n                        System.out.println(\"\
  Does not match.\");\n                    }\n                }\n            }\n \
  \       } while (askAgain());\n    }\n\n    private static boolean askAgain() {\n\
  \        System.out.print(\"Another? (Y or N) \");\n        String reply = sc.nextLine();\n\
  \        if (reply.equalsIgnoreCase(\"Y\")) {\n            return true;\n      \
  \  }\n        return false;\n    }\n}\n```\n\n这是该程序的示例运行结果。现在，不要担心正则表达式字符串的细节。只需注意它应该匹配任何以\
  \ *f* 开头、以 *r* 结尾，且中间有 *a, i,* 或 *o* 的三字母单词。\n\n```\nWelcome to the Regex Tester\n\
  \nEnter regex: f[aio]r\nEnter string: for\nMatch.\nEnter string: fir\nMatch.\nEnter\
  \ string: fur\nDoes not match.\nEnter string: fod\nDoes not match.\nEnter string:\
  \ \nAnother? (Y or N) n\n```\n\n\n\n\n在此测试中，我输入了正则表达式 `f[aio]r`。然后我输入了字符串 `for`。程序指示该字符串匹配表达式并要求输入另一个字符串。于是我输入了\
  \ `fir`，它也匹配了。接着我输入了 `fur` 和 `fod`，它们并不匹配。然后，我输入了一个空字符串，程序询问我是否想要测试另一个正则表达式。我输入了\
  \ `n`，程序结束结束。\n\n这个程序使用了 `Pattern` 和 `Matcher` 类，我会在本章最后再解释它们。不过，我建议你结合本章内容使用这个程序。如果你实际尝试一下并观察它们的运行情况，正则表达式会变得意义得多。此外，你也可以在过程中通过尝试简单的变体来学到很多东西。（如果你不想自己输入，可以从本书的网站\
  \ `http://www.dummies.com/go/javaaiofd5e` 下载该程序的源代码。）\n\n事实上，在本书章的其余部分，我使用了该程序的控制台输出来说说明正则表达式。要观察正则表达式如何工作，没有比这的方法：查看一个表达式以及一些匹配和不匹配该表达式的字符串示例。\n\
  \n#### 执行基础字符匹配\n\n大多数正则表达式仅仅通过匹配字符来检查字符串是否符合简单的模式。你可以检查一个字符串，看它是否符合社会安全号码 (`xxx-xx-xxxx`)、电话号码\
  \ `[(xxx) xxx-xxxx]` 或更复杂的模式，如电子邮件地址。（实际上，社会安全号码和电话号码比你想象的要复杂——关于这一点，请见本章稍后的“使用预定义字符类”部分。）在接下来的章节中，你将了解到如何创建基础字符匹配的正则模式。\n\
  \n#### 匹配单个字符\n\n最简单的正则模式精确匹配字符串字面量，如下例所示：\n\n**使用正则表达式**\n\n```\nEnter regex: abc\n\
  Enter string: abc\nMatch.\n```\n```\nEnter string: abcd\nDoes not match.\n```\n\
  在这里，模式 `abc` 匹配字符串 `abc`，但不匹配 `abcd`。\n\n#### 使用预定义字符类\n\n*字符类*（character class）代表特定类型的字符，而不是某个特定的字符。正则表达式允许你使用两种类型的字符类：预定义类和自定义类。预定义字符类如表\
  \ 2-1 所示。\n\n**表 2-1：字符类**\n\n| 正则表达式 | 匹配 |\n| :--- | :--- |\n| `.` | 任意字符 |\n\
  | `\\d` | 任意数字 (0–9) |\n| `\\D` | 任意非数字（0–9 以外的任何字符） |\n| `\\s` | 任意空白字符（空格、制表符、换行、返回或退格）\
  \ |\n| `\\S` | 空白字符以外的任意字符 |\n| `\\w` | 任意单词字符（a–z, A–Z, 0–9 或下划线） |\n| `\\W` |\
  \ 单词字符以外的任意字符 |\n\n点号类似于通配符，匹配任意字符，如下例：\n\n```\nEnter regex: c.t\nEnter string:\
  \ cat\nMatch.\n```\n```\nEnter string: cot\nMatch.\n```\n```\nEnter string: cart\n\
  Does not match.\n```\n在这里，`c.t` 匹配任何以 `c` 开头并 `t` 结尾的三字母字符串。在这个例子中，前两个字符串（`cat`\
  \ 和 `cot`）匹配，但第三个字符串（`cart`）不匹配，因为它超过了三个字符。\n\n`\\d` 类表示数字，通常用于正则模式中验证输入数据。这里有一个验证美国社会安全号码的简单正则模式，它必须以\
  \ `xxx-xx-xxxx` 的格式输入：\n\n```\nEnter regex: \\d\\d\\d-\\d\\d-\\d\\d\\d\\d\nEnter\
  \ string: 779-54-3994\nMatch.\n```\n```\nEnter string: 550-40-004\nDoes not match.\n\
  ```\n在这里，正则模式规定了字符串必须包含三个数字、一个连字符、两个数字、另一个连字符和四个数字。\n\n注意，这个正则模式不足以验证真实的社会安全号码，因为政府对这些号码的限制比简单的\
  \ `xxx-xx-xxxx` 模式要多。例如，任何社会安全号码不能以 `779` 开头。因此，上一个示例中输入的数字 `779-54-3994` 并不是有效的社会安全号码。\n\
  \n注意 `\\d` 类有一个对应项：`\\D`。`\\D` 类匹配任何*不是*数字的字符。这里是验证机器人名称的正则首次尝试：\n\n```\nEnter regex:\
  \ \\D\\d-\\D\\d\nEnter string: R2-D2\nMatch.\n```\n```\nEnter string: C2-D0\nMatch.\n\
  ```\n```\nEnter string: C-3PO\nDoes not match.\n```\n在这里，该模式匹配以非数字字符开头的字符串，后面跟着一个数字字符，接着是一个连字符，然后是另一个非数字字符，最后以一个数字结尾。因此，`R2-D2`\
  \ 和 `C3-P0` 匹配。遗憾的是，这个正则远非完美，任何《星球大战》粉丝都能告诉你，因为那个闪闪发金色协议机器人的名字正确拼写是 `C-3PO`，而不是\
  \ `C3-P0`。\n\n`\\s` 类匹配空白字符，包括空格、制表符、换行、返回和退格。当你想要允许实际空格时，这个类非常有用，例如：\n\n```\nEnter\
  \ regex: ...\nEnter string: abc def\nMatch.\n```\n```\nEnter string: abc def\nMatch.\n\
  ```\n\n`\\s` 类也有对应项：`\\S`。`\\S` 匹配任何不是空白字符的字符。如果你想将空白字符限制为实际空格，可以在正则中使用空格：\n\n```\n\
  Enter regex: ...\nEnter string: abc\nMatch.\n```\n```\nEnter string: abc\nDoes not\
  \ match.\n```\n\n最后的预定义类是 `\\w` 和 `\\W`。`\\w` 类识别任何用于单词的字符，包括大小写字母、数字和下划线。示例展示了它的样子：\n\
  \n```\nEnter regex: \\w\\w\\w\\W\\w\\w\nEnter string: abc def\nMatch.\n```\n```\n\
  Enter string: 123 456\nMatch.\n```\n```\nEnter string: 123_456\nDoes not match.\n\
  ```\n在这里，模式要求两个单词字符组之间由一个非字符分隔。\n\n#### 使用自定义字符类\n\n要创建自定义字符类，只需将所有字符列在括号内。示如下：\n\
  \n```\nEnter regex: b[aeiou]t\nEnter string: bat\nMatch.\n```\n```\nEnter string:\
  \ bet\nMatch.\n```\n```\nEnter string: bit\nMatch.\n```\n```\nEnter string: bot\n\
  Match.\n```\n```\nEnter string: but\nMatch.\n```\n```\nEnter string: bmt\nDoes not\
  \ match.\n```\n在这里，模式规定字符串必须以字母 `b` 开头，后面跟着一个包含 a、e、i、o 或 u 的类，最后是 `t`。换句话说，它接受以\
  \ *b,* 开头以 *t,* 结尾且中间有元音的三字母单词。如果你想让模式包含大写字母和小写字母，必须把它们都列出来：\n\n```\nEnter regex:\
  \ b[aAeEiIoOuU]t\nEnter string: bat\nMatch.\n```\n```\nEnter string: BAT\nDoes not\
  \ match.\n```\n```\nEnter string: bAt\nMatch.\n```\n你可以在同一行使用任意数量的自定义组。这里的示例展示了\n\
  \n\n\n\n为第一个和最后一个字符定义类，以便它们也可以是大写或小写的：\n\n输入正则表达式：`[bB][aAeEiIoOuU][tT]`\n\n输入字符串：`bat`\n\
  \n匹配。\n\n输入字符串：`BAT`\n\n匹配。\n\n## 使用正则表达式\n\n此模式指定了三个字符类。第一个可以是 `b` 或 `B`，第二个可以是任何大写或小写元音，第三个可以是\
  \ `t` 或 `T`。\n\n#### 使用范围\n\n自定义字符类也可以指定字母和数字的*范围*，如下：输入正则表达式：`[a-z][0-5]`\n\n输入字符串：`r2`\n\
  \n匹配。\n\n输入字符串：`b9`\n\n不匹配。\n\n在这里，字符串长度可以是两个字符。第一个必须是 `a–z` 中的一个字符，第二个必须是 `0–5`。\n\
  \n第 2 章 **使用正则表达式** 513\n\n你还可以在一个类中使用多个范围，如下：\n\n输入正则表达式：`[a-zA-Z][0-5]`\n\n输入字符串：`r2`\n\
  \n匹配。\n\n输入字符串：`R2`\n\n匹配。\n\n在这里，第一个字符可以是小写 `a–z` 或大写 `A–Z`。\n\n你可以使用范围来构建一个只接受真实单词中字符的类（与允许下划线的\
  \ `\\w` 类相反）：\n\n输入正则表达式：`[a-zA-Z0-9]`\n\n输入字符串：`a`\n\n匹配。\n\n输入字符串：`N`\n\n匹配。\n\
  \n输入字符串：`9`\n\n匹配。\n\n#### 使用否定\n\n正则表达式可以包含匹配任何字符*但*不是类中列出的字符的类。要实现这一点，你需要在类的开头使用脱字符符号，如下：\n\
  \n输入正则表达式：`[^cf]at`\n\n输入字符串：`bat`\n\n匹配。\n\n输入字符串：`cat`\n\n不匹配。\n\n输入字符串：`fat`\n\
  \n不匹配。\n\n在这里，字符串必须是一个以 `at` 结尾的三字母单词，但不是 `fat` 或 `cat`。\n\n#### 匹配多个字符\n\n本章目前为止的正则表达式模式要求输入字符串中的每个位置都匹配特定的字符类。例如，模式\
  \ `\\d\\W[a-z]` 要求第一个位置是数字，第二个位置是空白字符，第三个位置是字母 `a–z` 之一。这些要求是非常严格的。\n\n514 书 5 **编程技巧**\n\
  \n为了创建更灵活的模式，你可以使用表 2-2 中列出的任何量词。*量词*允许你创建匹配字符串某处变动数量字符的模式。\n\n**表 2-2 量词**\n\n\
  | 正则表达式 | 匹配前一个元素 |\n| :--- | :--- |\n| `?` | 零次或一次 |\n| `*` | 零次或多次 |\n| `+` |\
  \ 一次或多次 |\n| `{n}` | 恰好 *n* 次 |\n| `{n,}` | 至少 *n* 次 |\n| `{n,m}` | 至少 *n* 次但不超过\
  \ *m* 次 |\n\n要使用量词，紧跟在你你想它应用的元素之后。这里有一个使用量词的社会安全号码模式版本：\n\n输入正则表达式：`\\d{3}-\\d{2}-\\\
  d{4}`\n\n输入字符串：`779-48-9955`\n\n匹配。\n\n输入字符串：`483-488-9944`\n\n不匹配。\n\n该模式匹配三个数字，后面跟着一个连字符，然后是两个数字，再次是一个连字符，最后是四个数字。\n\
  \n简单复制元素而不是使用量词同样简单，甚至更简单。`\\d\\d` 和 `\\d{2}` 一样简单。\n\n`?` 量词允许你创建一个可选元素，该元素在字符串中可能存在也可能不存在。假设你想允许用户输入没有连字符的社会安全号码。你可以使用此模式：\n\
  \n输入正则表达式：`\\d{3}-?\\d{2}-?\\d{4}`\n\n输入字符串：`779-48-9955`\n\n匹配。\n\n输入字符串：`779489955`\n\
  \n匹配。\n\n输入字符串：`779-489955`\n\n匹配。\n\n输入字符串：`77948995`\n\n不匹配。\n\n问号表示连字符是可选的。注意，此模式允许你包含或省略任何连字符。最后输入的字符串不匹配，因为它只有八位数字，而模式要求九位。\n\
  \n#### 使用转义\n\n在正则表达式中，某些字符具有特殊含义。如果你想搜索这些特殊字符之一呢？在这种情况下，你通过在字符前面加上反斜杠来对其进行*转义*。这是一个示例：\n\
  \n输入正则表达式：`\\(\\d{3}\\) \\d{3}-\\d{4}`\n\n输入字符串：`(559) 555-1234`\n\n匹配。\n\n输入字符串：`559\
  \ 555-1234`\n\n不匹配。\n\n在这里，`\\(` 代表左括号，`\\)` 代表右括号。如果没有反斜杠，正则表达式会将括号视为分组元素。\n\n\
