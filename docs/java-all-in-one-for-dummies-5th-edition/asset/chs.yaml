  \ (!validInput);\n    }\n}\n```\n\n关于这个方法有几个重要的细节需要注意：\n\n- 因为 `main` 方法（第 12 行）和\
  \ `playARound` 方法（第 60 行）都必须访问 `keepPlaying` 变量，我将它声明为类变量，而不是 `main` 方法中的局部变量。如果你打算从\
  \ `static` 方法访问类变量，类变量必须是 `static` 的。\n- `main` 方法中 `while` 循环的体部只有一行：对 `playARound`\
  \ 方法的调用。因此，每次循环重复时，程序都会与用户玩一轮游戏。\n- `playARound` 方法的声明将该方法标记为 `static`，这样静态的 `main`\
  \ 方法就可以调用它。\n\n`playARound` 方法的体部与第 2 卷第 5 章所示的程序单方法版本中使用的 `while` 循环体部完全相同。如果你想复习这段代码是如何工作的，我礼貌地建议你参考章节末尾的列表\
  \ 5-1。\n\n### 返回值的方法\n\n只执行工作而不返回任何数据的方法仅在有限的情况下才有用。方法的真正用途在于它们可以执行某些平凡的任务（例如计算），并然后将该计算的结果返回给调用方法，以便调用方法能够对该值进行处理。你将在接下来的章节中学习如何做到这一点。\n\
  \n### 声明方法的返回类型\n\n要创建一个返回值的方法，你只需要在方法声明中使用方法返回的值的类型来替换 `void` 关键字。这里有一个创建一个返回 `int`\
  \ 值方法的的声明：\n\n```java\npublic static int getRandomNumber()\n```\n\n在这里，`getRandomNumber`\
  \ 方法计算一个随机数，并将该数返回给调用者。方法的返回类型可以是 Java 的任何原始返回类型之一（在第 2 卷第 2 章中描述）：\n- `int`\n-\
  \ `long`\n- `float`\n- `char`\n- `short`\n- `byte`\n- `double`\n- `boolean`\n\n\
  或者，返回类型可以是*引用类型*，包括由 API 定义的类（如 `String`）或你自己创建的类。\n\n#### 使用 return 语句返回值\n\n当你在方法声明中指定\
  \ `void` 以外的返回类型时，你必须使用 `return` 语句来返回值。\n\n[content]\n如果你在方法声明中指定 `void` 以外的返回类型时，方法的体部必须包含一个要返回值的\
  \ `return` 语句。`return` 语句的形式如下：\n\n`return expression;`\n\n`expression` 评估的值必须与方法声明中指定的类型相同。也就是说，如果方法返回一个\
  \ `int`，那么 `return` 语句评估的结果必须是 `int`。这里有一个使用方法确定 1 到 10 之间随机数的程序：\n\n```java\npublic\
  \ class RandomNumber\n{\n    public static void main(String[] args)\n    {\n   \
  \     int number = getRandomNumber();\n        System.out.println(\"The number is\
  \ \" + number);\n    }\n    public static int getRandomNumber()\n    {\n       \
  \ int num = (int)(Math.random() * 10) + 1;\n        return num;\n    }\n}\n```\n\
  \n在这个程序中，`getRandomNumber` 方法使用 `Math.random` 方法计算一个 1 到 10 的随机数。`return` 语句返回计算出的数字。由于\
  \ `return` 语句也可以指定表达式而不是简单的变量，我完全可以这样写 `getRandomNumber` 方法：\n\n```java\npublic\
  \ static int getRandomNumber()\n{\n    return (int)(Math.random() * 10) + 1;\n}\n\
  ```\n\n## 为你的疯狂添加一些方法\n\n### 返回类型的方法\n\n你可以在赋值语句中使用返回一个类型的方法，例如：\n\n```java\nint\
  \ number = getRandomNumber();\n```\n\n在这里，`getRandomNumber` 方法被调用，它返回的值赋值给变量 `number`。你还可以在表达式中使用返回值的方法，例如：\n\
  \n```java\nnumber = getRandomNumber() * 10;\n```\n\n在这里，`getRandomNumber` 方法返回的值乘以\
  \ 10，结果赋值给 `number`。\n\n### 你必须有一个正确的 return 语句\n\n如果方法声明了 `void` 以外的返回类型，它*必须*使用\
  \ `return` 语句来返回值。编译器不允许没有正确 `return` 语句的方法通过。\n\n如果你的 `return` 语句位于 `if` 语句内部，情况就会变得复杂。有时编译器会被欺骗并拒绝编译你的程序。为了解释这种情况，我提供了以下关于尝试解决看似简单的编程问题的多次尝试。\n\
  \n假设你想创建一个随机数方法，它返回 1 到 20 之间的随机数，但从不返回 12（因为你有被称为“十二恐惧症”的情况——正如《花生漫画》中的 Lucy 会告诉的那样——那是对数字\
  \ 12 的恐惧）。你的第一个想法是直接忽略 12，如下所示：\n\n```java\npublic static int getRandomNumber()\n\
  {\n    int num = (int)(Math.random() * 20) + 1;\n    if (num != 12)\n        return\
  \ num;\n}\n```\n\n然而，编译器在这里并没有被你的花招欺骗。它知道如果数字是 12，`return` 语句就不会执行，因此它会发出信息 `missing\
  \ return statement` 并拒绝编译你的程序。\n\n\n\n你的下一个想法是每当出现 `12` 时简单地将其替换为 `11`：\n\n```java\n\
  public static int getRandomNumber()\n{\n    int num = (int)(Math.random() * 20)\
  \ + 1;\n    if (num != 12)\n        return num;\n    else\n        return 11;\n\
  }\n```\n\n当天晚些时候，你意识到这个解决方案并不是好的办法，因为数字已经不再是真正的随机数。良好的随机数生成器的一个要求是：任何数字出现的概率应该与其他任何数字相等。但由于你把所有的\
  \ `12` 都改成了 `11`，你让 `11` 出现的概率变成了其他数字的两倍。\n\n为了修复这个错误，你决定将随机数生成器放在一个循环中，该循环只有在随机数不是\
  \ `12` 时才会结束：\n\n```java\npublic static int getRandomNumber()\n{\n    int num;\n\
  \    do\n    {\n        num = (int)(Math.random() * 20) + 1;\n        if (num !=\
  \ 12)\n            return num;\n    } while (num == 12);\n}\n```\n\n但编译器拒绝再次编译该方法。事实证明编译器很聪明，但并不十分聪明。它没有发现\
  \ `do-while` 循环中的条件与 `if` 语句中的条件是相反的，这意味着离开循环的唯一方法就是通过 `if` 语句中的 `return` 语句。因此，编译器又抱怨缺少返回语句。\n\
  \n在思考了一会儿后，你想出了这个解决方案：\n\n```java\npublic static int getRandomNumber()\n{\n    int\
  \ num;\n    while (true)\n    {\n        num = (int)(Math.random() * 20) + 1;\n\
  \        if (num != 12)\n            return num;\n    }\n}\n```\n\n现在大家都很开心了。编译器知道离开循环的唯一方法是执行\
  \ `return` 语句，你那个有“十二恐惧症”的用户不需要担心看到数字 `12`，而且你知道随机数变成 `11` 的概率并不是其他数字的两倍。生活很美好，你可以继续学习下一个话题了。\n\
  \n### 尝试猜数字程序的另一个版本\n\n为了说明使用带返回值方法的用处，列表 7-2 展示了猜数字程序的另一个版本，除了 `main` 之外还使用了四个方法：\n\
  \n*   **`playARound`**: 该方法玩一轮猜数字游戏。它没有返回值。\n*   **`getRandomNumber`**: 该方法返回一个\
  \ 1 到 10 之间的随机数。\n*   **`getGuess`**: 该方法获取用户的猜测，确保它在 1 到 10 之间，如果在这个接受范围内则返回该猜测。\n\
  *   **`askForAnotherRound`**: 该方法询问用户是否再玩一轮，并返回一个布尔值表示用户是否想继续玩。\n\n#### 列表 7-2：猜数字程序的另一个版本\n\
  \n```java\nimport java.util.Scanner;\n\npublic class GuessingGameMethod2\n{\n  \
