  \ 方法打印二维数组的内容，请使用 `for` 循环来为每个子数组调用 `toString` 方法。\n\n## 第 2 章：使用数组\n\n![Image 45](img/index-445_1.jpg)\n\
  \n## 本章内容\n* 使用 `ArrayList` 类\n* 创建数组列表（array list）\n* 介绍泛型\n* 向数组列表添加元素\n* 从数组列表中删除元素或修改数组列表中的元素\n\
  \n# 第 3 章：使用 ArrayList 类\n\n有些人喜欢喜欢收集东西：小摆件、棒球卡、邮票、娃娃——只要是你想到的，就一定有人在收集。\n\n如果我是某种随机物品的收集者——比如，旧的锡制广告牌——那么数组将是存储数据的糟糕选择。因为在任何一天，我可能都会在跳蚤市场上发现另一个锡制广告牌。所以，如果我之前有\
  \ 87 块锡制广告牌，并且创建了一个足够容纳所有 87 块的数组，我就必须更改数组声明以容纳 88 块。\n\nJava 的`集合类`（collection\
  \ classes）设计用于简化必须跟踪对象组的应用程序的编程。这些类非常强大，用起来又异常简单——至少基础用法如此。集合类的高级功能需要一些认真的编程才能正确实现，但对于大多数应用程序，几个简单的方法就足够你使用集合类了。遗憾的是，Java\
  \ 的集合类是根据相当复杂的继承层次组织的，这对于初学者来说非常困惑。我书架上的大多数 Java 书都从解释这种继承方案开始，展示各种集合类是如何融入该方案的，以及为什么。\n\
  \n我不打算这样做。我认为，对于集合的新手来说，在了解基本类如何工作的细节之前，让他们去涉足一个毫无意义的类层次结构是非常困惑的。相反，我直接向你展示如何使用这些类最好的两个。\n\
  \n在本章中，你将了解到如何使用 `ArrayList` 类。在下一章中，你将了解到如何使用它的表兄弟 `LinkedList`。当你学会了如何使用这两个类后，就不应该在尝试通过\
  \ API 文档了解如何使用其他集合类时遇到任何困难。\n\nJava 1.5 引入了一项重大的新语言特性`泛型`（generics），旨在让集合更加易用。具体来说，`泛型`特性允许你创建列表对象（例如\
  \ `ArrayList` 或 `LinkedList`），绑定到特定的数据类型，如字符串或整数）。\n\n由于泛型是 Java 1.5 及后续版本中集合工作方式不可或缺的一部分，我从一开始就将泛型特性整合到了本章中。在过程中，我会指出不使用泛型使用\
  \ `ArrayList` 的区别，以防你正在使用旧版本的 Java，或者正在处理在 Java 1.5 出现之前编写的程序。（关于`泛型`特性如何工作的完整解释，你可以跳转到第\
  \ 4 册的第 5 章。）\n\n关于新功能我还有更多好消息：Java 8 引入的重大新功能`lambda 表达式`（lambda expressions）提供了一种处理集合的全新方式，这对于高效处理包含大量项的集合特别有用。关于使用这些新集合功能的更多信息，请参阅本微型书籍的第\
  \ 6 章。关于`lambda 表达式`的更多信息，请参阅第 3 册的第 7 章。\n\n## 理解 ArrayList 类\n\n`array list`（数组列表）是\
  \ Java 集合中最基本的类型。你可以将 array list 想象成“加强版的数组”。它与数组类似，但规避了处理数组时常见的许多常见问题，特别是以下这些：\n\
  \n* **数组列表会在需要时自动调整自身的大小。** 如果你创建一个包含 100 个元素的数组，然后填满它并需要添加第 101 个元素，你就倒霉了。你能做的最好就是创建一个包含\
  \ 101 个元素的新数组，将旧数组中的 100 个元素复制到新数组中，然后将新数据放在第 101 个元素中。使用 array list，你可以创建元素数量永远没有限制。你可以随所欲地继续添加元素。\n\
  * **数组列表允许你在集合的中间插入元素。** 在数组中，插入元素相当困难。假设你有一个可以容纳 100 个元素的数组，但只有前 50 个有数据。如果你需要在第\
  \ 25 个项目之后插入一个新元素，你必须先复制第 26 到 50 个元素以为新元素腾出空间。使用 array list，你只需要告诉 array list 你想在第\
  \ 25 个项目之后插入新元素；array list 会负责处理这些元素的移动。\n* **数组列表允许你删除项目。** 如果你从数组中删除一个项目，被删除的元素变为\
  \ `null`，但该项目占据的空位仍留在数组中。当你从 array list 中删除一个项目时，数组中的任何后续项目都会向前移动一个位置以填充被删除项目占据的位置。\n\
  * **ArrayList 类实际上实际上使用一个数组来存储你添加到 array list 中的数据。** `ArrayList` 类负责管理此数组的大小。当你向\
  \ array list 中添加一个项目时，如果底层数组已满，`ArrayList` 会自动创建一个更大的数组。\n\n`ArrayList` 类有多个构造函数和大量方法。为了参考，表\
  \ 3-1 列出了 `ArrayList` 类的构造函数和方法。\n\n### 使用 ArrayList 类\n\n本章剩余部分将展示如何使用这些构造函数和方法来操作\
  \ `ArrayList` 对象。\n\n### 表 3-1 ArrayList 类\n\n| 构造函数 | 解释 |\n| :--- | :--- |\n|\
  \ `ArrayList()` | 创建一个初始容量为十的数组列表。 |\n| `ArrayList(int capacity*)` | 创建一个指定初始容量的数组列表。\
  \ |\n| `ArrayList(Collection c)` | 创建一个数组列表并将指定集合中的所有元素复制其中。 |\n\n| 方法 | 解释 |\n\
  | :--- | :--- |\n| `add(Object element)` | 将指定对象添加到数组列表。如果你在创建数组列表时指定了类型，则对象必须是正确的类型。\
  \ |\n| `add(int index, Object element)` | 在指定位置将指定对象添加到数组列表。如果你在创建数组列表时指定了类型，则对象必须是正确的类型。\
  \ |\n| `addAll(Collection c)` | 将指定集合的所有元素添加到此数组列表。 |\n| `addAll(int index, Collection\
  \ c)` | 在指定位置将指定集合的所有元素添加到此数组列表。 |\n| `clear()` | 删除数组列表中的所有元素。 |\n| `clone()` |\
  \ 返回数组列表的浅拷贝。拷贝中包含的元素与原始元素是相同的对象实例。 |\n| `contains(Object elem)` | 返回布尔值，表示指定对象是否在数组列表中。\
  \ |\n| `containsAll(Collection c)` | 返回布尔值，表示此数组列表是否包含指定集合中的所有对象。 |\n| `ensureCapacity(int\
  \ minCapacity)` | 将数组列表的容量增加到指定的值。（如果容量 `minCapacity` 已大于指定值，则此方法不执行任何操作。） |\n|\
  \ `get(int index*)` | |\n\n\n\n\n返回列表中指定位置的对象。\n\n`indexOf(Object elem)`\n\n返回指定对象在数组列表中首次出现的索引位置。如果该对象不在列表中，则返回\
  \ -1。\n\n`isEmpty()`\n\n返回一个布尔值，表示该数组列表是否为空。\n\n`iterator()`\n\n返回数组列表的迭代器。\n\n\
  `lastIndexOf(Object elem)`\n\n返回指定对象在数组列表中最后一次出现的索引位置。如果该对象不在列表中，则返回 -1。\n\n`remove(int\
  \ index)`\n\n删除指定索引处的对象，并返回被删除的元素。\n\n`remove(Object elem)`\n\n从列表中删除一个对象。注意，可能有多个元素引用该对象；此方法只删除其中其中一个。它返回一个布尔值，表示该对象是否在列表中。\n\
  \n`remove(int fromIndex, int toIndex)`\n\n删除所有索引值在 `fromIndex` 到 `toIndex` 之间的对象。注意，`fromIndex`\
  \ 和 `toIndex` 位置的元素本身不会被删除。\n\n`removeAll(Collection c)`\n\n从此数组列表中移除指定集合中的所有对象。\n\
  \n`retainAll(Collection c)`\n\n从此数组列表中移除所有不在指定集合中的对象。\n\n`set(int index, Object\
  \ elem)`\n\n将指定的元素设置为指定的对象。之前在该位置的元素将作为方法的返回值返回。\n\n`size()`\n\n返回列表中元素的数量。\n\n\
  `toArray()`\n\n将数组列表的元素作为对象数组（`Object[]`）返回。\n\n`toArray(type[] array)`\n\n将数组列表的元素作为数组返回，其类型与参数传递的数组相同。\n\
  \n# 字符串、数组和集合\n\n## 创建 ArrayList 对象\n\n要创建一个数组列表，你首先声明一个 `ArrayList` 变量，然后调用 `ArrayList`\
  \ 构造函数来实例化 `ArrayList` 对象并将其赋值给该变量。你可以分行进行操作：\n\n```\nArrayList signs;\nsigns =\
  \ new ArrayList();\n```\n\n或者，你可以在一行内完成：\n\n```java\nArrayList signs = new ArrayList();\n\
  ```\n\n关于创建数组列表，有以下几点需要注意：\n\n- » `ArrayList` 类位于 `java.util` 包中，因此你的程序必须导入 `java.util.ArrayList`\
  \ 或 `java.util.*`。\n- » 与数组不同，数组列表不需要你指定容量——尽管如果你愿意，也可以指定。这里是一个创建一个初始容量为 100 的数组列表语句：\n\
  \n```java\nArrayList signs = new ArrayList(100);\n```\n\n如果你没有为数组列表指定容量，初始容量将设置为\
  \ 10。在创建数组列表时，至少提供每个数组列表能容纳多少元素的粗略估计是一个好主意。\n\n- » 数组列表的容量不是固定限制。`ArrayList` 类会在需要时自动增加列表的容量。\n\
  - » 如果你使用的是 Java 1.5 或更高版本，你还可以指定数组列表允许包含的元素类型。此语句创建一个持有 `String` 对象的数组列表：\n\n```java\n\
  ArrayList<String> signs = new ArrayList<String>();\n```\n\n在声明数组列表时指定类型的用处是，如果你随后尝试向列表添加类型错误的对象，编译器会报错。（这一特性被称为*泛型*，因为它允许\
  \ Java API 设计师创建通用的集合类，用以存储任何类型的对象。如需更多信息 tin，请参阅书籍第 4 卷第 5 章。）\n\n- » `ArrayList`\
  \ 类还有一个构造函数，允许你指定另一个集合对象（通常是另一个数组列表），其条目会被复制到新的数组列表中。这提供了一种创建数组列表副本的简单方法，你也可以用它将任何其他类型的集合转换为数组列表。\n\
  \n### 使用 ArrayList 类\n\n#### 添加元素\n\n在创建数组列表后，你可以使用 `add` 方法向数组列表添加对象。以下是向数组列表添加字符串的代码：\n\
  \n```java\nsigns.add(\"Drink Pepsi\");\nsigns.add(\"No minors allowed\");\nsigns.add(\"\
  Say Pepsi, Please\");\nsigns.add(\"7-Up: You Like It, It Likes You\");\nsigns.add(\"\
  Dr. Pepper 10, 2, 4\");\n```\n\n如果你在创建数组列表时指定了类型，则通过 `add` 方法添加的对象必须是正确的类型。\n\n\
  你可以通过在 `add` 方法列出位置在列表的特定位置插入对象。考虑这些语句：\n\n```java\nArrayList<String> nums = new\
  \ ArrayList<String>();\nnums.add(\"One\");\nnums.add(\"Two\");\nnums.add(\"Three\"\
  );\nnums.add(\"Four\");\nnums.add(2, \"Two and a half\");\n```\n\n执行这些语句后，`nums`\
  \ 数组列表包含以下字符串：\n- One\n- Two\n- Two and a half\n- Three\n- Four\n\n在向数组列表添加元素时，请记住一些重要点：\n\
  \n- » 如果在添加元素时数组列表已达到容量，数组列表会自动扩展其容量。虽然这种容量是灵活的，但效率也不高。只要可能，你应该预估你将向数组列表添加多少个元素，并据此设置列表的初始容量。（你也可以通过调用\
  \ `ensureCapacity` 方法随时更改容量。）\n- » 与数组一样，数组列表的索引从零开始。当你使用接受索引的 `add` 方法时请记住这一点。\n\
  - » 如果对象不在你指定的索引位置，接受索引的 `add` 方法将抛出未检查异常 `IndexOutOfBoundsException`。\n\n## 访问元素\n\
  \n要访问列表中的特定元素，你可以使用 `get` 方法，它指定要检索的元素的索引值。这里有一个打印数组列表中所有字符串的 for 循环：\n\n```java\n\
  for (int i = 0; i < nums.size(); i++)\n    System.out.println(nums.get(i));\n```\n\
  \n这里使用 `size` 方法设置循环变量的限制。\n\n访问数组列表中所有元素最简单的方法是使用增强 for 语句，它让你无需担心索引或 `get` 方法。例如：\n\
  \n```java\nfor (String s : nums)\n    System.out.println(s);\n```\n\n这里 `nums` 列表中的每个\
  \ `String` 元素打印到控制台。\n\n如果你需要数组列表中特定对象的索引号，并且拥有该对象的引用，可以使用 `indexOf` 方法。这里有一个增强\
  \ for 循环，打印每个字符串及其索引号：\n\n```java\nfor (String s : nums) {\n    int i = nums.indexOf(s);\n\
  \    System.out.println(\"Item \" + i + \": \" + s);\n}\n```\n\n根据数组列表的内容，此循环的输出可能如下：\n\
  - Item 0: One\n- Item 1: Two\n- Item 2: Three\n- Item 3: Four\n\n## 打印 ArrayList\n\
  \n`ArrayList` 类（以及其他集合类）的 `toString` 方法旨在方便快速打印列表的内容。它返回括号的内容，元素之间用逗号分隔。调用每个元素的\
  \ `toString` 方法以获取元素值。\n\n考虑这些语句：\n\n```java\nArrayList<String> nums = new ArrayList<String>();\n\
  nums.add(\"One\");\nnums.add(\"Two\");\nnums.add(\"Three\");\nnums.add(\"Four\"\
  );\nSystem.out.println(nums);\n```\n\n当你运行这些语句时，控制台上会显示：\n`[One, Two, Three, Four]`\n\
  \n虽然这种输出对实际应用程序没有太大用，但对于测试目的或调试使用数组列表的程序非常方便。\n\n## 使用迭代器\n\n另一种访问数组列表（或任何其他集合）所有元素的方法是\n\
  \n\n\n\n\n... 是使用一个迭代器（iterator）。一个 `iterator` 是一种特殊的对象，其唯一生命目的就是让你逐步遍历集合中的元素。\n\
  \nJava 1.5 引入的增强 `for` 语句旨在简化使用迭代器的程序。因此，如果你正在使用 Java 1.5 或更高版本，可以使用增强 `for` 语句来代替迭代器。尽管如此，你可能仍遇到使用迭代器的现有程序，因此你需要了解它们是如何运作的。\n\
  \n迭代器对象实现了 `Iterator` 接口，该接口定义在 `java.util` 包中。因此，要使用迭代器，你必须导入 `java.util.Iterator`\
  \ 或 `java.util.*`。`Iterator` 接口恰恰定义了三个方法，如表 3-2 所示。这些方法是你访问集合中每个元素所需的所有方法。（实际上，你只需要\
  \ `hasNext` 和 `next` 方法。`remove` 方法是额外的锦添花。）\n\n**表 3-2：Iterator 接口**\n\n| 方法 |\
  \ 说明 |\n| :--- | :--- |\n| `hasNext()` | 如果集合中至少有一个尚未检索的元素，则返回 `true` |\n| `next()`\
  \ | 返回集合中的下一个元素 |\n| `remove()` | 移除最近检索到的元素 |\n\n要使用迭代器，你首先调用数组列表的 `iterator` 方法来获取迭代器。然后你使用迭代器的\
  \ `hasNext` 和 `next` 方法来检索集合中的每个项。通常的做法是使用 `while` 循环。这里有一个示例：\n\n```java\nArrayList<String>\
  \ nums = new ArrayList<String>();\nnums.add(\"One\");\nnums.add(\"Two\");\nnums.add(\"\
  Three\");\nnums.add(\"Four\");\n\nString s;\nIterator e = nums.iterator();\nwhile\
  \ (e.hasNext()) {\n    s = (String)e.next();\n    System.out.println(s);\n}\n```\n\
  \n在这里，前五条语句创建一个数组列表并向其中添加了四个字符串。接下来，调用 `iterator` 方法获取 `nums` 数组列表的迭代器。在 `while`\
  \ 语句中调用 `hasNext` 方法，并调用 `next` 方法获取要打印的元素。\n\n注意，`next` 方法返回的对象必须强制转换为 `String`。这是因为\
  \ `Iterator` 接口并不知道集合中存储的对象的类型。因此，它简单地返回一个 `Object`。在使用它之前，你必须将其强制转换为正确的类型。\n\n\
  ### 更新元素\n\n你可以使用 `set` 方法用另一个对象替换现有对象。考虑这个示例：\n\n```java\nArrayList<String> nums\
  \ = new ArrayList<String>();\nnums.clear();\nnums.add(\"One\");\nnums.add(\"Two\"\
  );\nnums.add(\"Three\");\nSystem.out.println(nums);\nnums.set(0, \"Uno\");\nnums.set(1,\
  \ \"Dos\");\nnums.set(2, \"Tres\");\nSystem.out.println(nums);\n```\n\n在这里，创建了一个包含三个字符串的数组列表，并将列表的内容打印到控制台。然后，三个字符串中的每一个都被另一个字符串替换，内容再次打印到控制台。当你运行这段代码时，会在控制台上看到以下输出：\n\
  \n```\n[One, Two, Three]\n[Uno, Dos, Tres]\n```\n\n由于数组列表包含的是对象的引用而非对象本身，因此你对列表中的对象所任何更改都会自动反映在列表中。因此，你并不经常使用\
  \ `set` 方法。例如：\n\n```java\nArrayList<Employee> emps = new ArrayList<Employee>();\n\
  // 将员工添加到数组列表\nemps.add(new Employee(\"Addams\", \"Gomez\"));\nemps.add(new Employee(\"\
  Taylor\", \"Andy\"));\nemps.add(new Employee(\"Kirk\", \"James\"));\n// 打印数组列表\n\
  System.out.println(emps);\n\n// 修改其中一个员工的名字\nEmployee e = emps.get(1);\ne.changeName(\"\
  Petrie\", \"Robert\");\n// 再次打印数组列表\nSystem.out.println(emps);\n```\n\n这个示例使用了 `Employee`\
  \ 类，该类的构造函数接受员工的姓和名来创建一个新的员工对象，还有一个 `changeName` 方法。`main` 方法从创建一个 ArrayList 并添加三个员工开始。然后，它打印数组列表的内容。接下来，它获取索引为\
  \ 1 的员工并更改该员工的名字。最后，它再次打印数组列表的内容。以下是该代码在控制台上的输出：\n\n```\n[Gomez Addams, Andy Taylor,\
  \ James Kirk]\n[Gomez Addams, Robert, James Kirk]\n```\n\n### 迭代器模式\n\nJava 的迭代器遵循一种常见的设计模式，称为迭代器模式（Iterator\
  \ pattern），当你需要为对象集合提供顺序访问时，这种模式非常有用。迭代器模式依赖于接口，使得使用迭代器的代码不需要知道正在迭代的是哪个具体的类。只要该类实现了迭代器接口，就可以被迭代。\n\
  \n`Iterator` 接口本身定义了用于顺序访问的方法。通常模式是该接口至少提供两个方法：\n\n- `hasNext`: 返回一个布尔值，指示是否有另一个可用项。\n\
  - `next`: 返回下一个项。\n\nJava 还为其 `Iterator` 接口定义了第三个方法：`remove`，用于移除最近检索的对象。\n\n除了\
  \ `Iterator` 接口外，集合本身还需要一种获取迭代器的方法。它通过 `iterator` 方法实现，该方法返回集合的迭代器。`iterator` 方法是由\
  \ `Iterable` 接口定义的。因此，任何实现 `Iterable` 的对象都有一个 `iterator` 方法。\n\n#### 删除元素\n\n`ArrayList`\
  \ 类提供了几种方法从集合中移除元素。要移除所有元素，请使用 `clear` 方法，如下：\n\n```java\nemps.clear();\n```\n\n\
  要移除特定元素，请使用 `remove` 方法。它允许根据索引移除元素，如下：\n\n```java\nemps.remove(0);\n```\n\n或者，你可以传递想要删除的实际对象。如果你不知道想要删除对象的索引，但恰好拥有该对象的引用，这种方法非常有用，如下例：\n\
  \n```java\nArrayList<Employee> emps = new ArrayList<Employee>();\n// 创建员工对象\nEmployee\
  \ emp1 = new Employee(\"Addams\", \"Gomez\");\nEmployee emp2 = new Employee(\"Taylor\"\
  , \"Andy\");\nEmployee emp3 = new Employee(\"Kirk\", \"James\");\n// 将员工对象添加到数组列表\n\
  emps.add(emp1);\nemps.add(emp2);\nemps.add(emp3);\n// 打印数组列表\nSystem.out.println(emps);\n\
  \n// 移除其中一个员工\nemps.remove(emp2);\n// 再次打印数组列表\nSystem.out.println(emps);\n```\n\
  \n这是该代码在控制台上的输出：\n\n```\n[Gomez Addams, Andy Taylor, James Kirk]\n[Gomez Addams,\
  \ James Kirk]\n```\n\n这里有几个需要注意的重要细节：\n\n`clear` 和 `remove` 方法并没有真正删除对象，它们只是从数组列表中移除了对对象的引用。与任何其他对象一样，集合中的对象由垃圾回收器自动删除——并且仅当这些对象不再被程序引用时。\n\
  \n你可以通过使用 `removeRange` 方法一次性移除多个元素。在该方法上，你可以指定起始和结束索引。\n\n\n\n\n\nnumbers.（注意：此方法会移除你指定的元素之间的所有元素，但你指定的元素本身不会被移除。例如，`removeRange(5,\
  \ 8)` 会移除元素 6 和 7，但元素 5 和 8 不会被移除。）\n\n» 你也可以使用 `removeAll` 方法从一个集合中移除另一个集合中的所有对象。一个类似的方法\
  \ `retainAll` 则会移除所有*不在*另一个集合中的对象。\n\n# 第 3 章 使用 ArrayList 类 435\n\n![Image 46](img/index-459_1.jpg)\n\
  \n## 本章内容\n» 介绍（链表）\n» 将链表与数组列表（array lists）进行比较\n» 创建链表\n» 向链表中添加项\n» 从链表中检索项\n\
  » 在链表中更新和删除项\n\n# 第 4 章 使用 LinkedList 类\n\n我在前一节中介绍的 `ArrayList` 类是一个基于数组的集合类。数组既有其优点也有其缺点。数组的优点是它非常高效——至少在你填满它，或者尝试通过插入或删除元素来重新组织它之前是这样。之后，它就会突然变得非常低效。\n\
  \n多年来，计算机科学家开发了各种数组的替代方案，这些方案对于某些类型的访问更加高效。这些替代方案中最老老的之一就是链表（linked list）。对于根据索引号直接访问元素等任务，链表的效率低于数组，但当你需要在列表中间插入或删除项时，链表的表现就远超数组了。\n\
  \n在本章中，你将了解到如何使用 Java 的 `LinkedList` 类，该类提供了一个基于链表而非数组的集合。你会发现，尽管 `LinkedList` 类提供了与\
  \ `ArrayList` 类许多相同的功能，但它也有自己的一些小窍门。\n\nJava 1.5 引入了一个重大的新语言特性，称为*泛型*（generics），它专门旨在让集合变得更易用。具体来说，泛型使得你能够创建绑定到特定数据类型（如字符串或整数）的列表对象，例如\
  \ `ArrayList` 或 `LinkedList`。\n\n# 第 4 章 使用 LinkedList 类 437\n\n由于泛型是 Java 1.5 及以上版本集合工作方式不可或缺的一部分，我从这一章开始就将泛型功能包含在内。在此过程中，我会指出不使用泛型使用\
  \ `ArrayList` 的区别，以防你正在使用旧版本的 Java，或者正在处理在 Java 1.5 发布之前编写的程序。（关于泛型功能如何工作的完整解释，你可以阅读第\
  \ 4 本第 5 章。）\n\n此外，请注意，Java 8 引入的 lambda 表达式为处理集合提供了一种替代方法，包括 `LinkedList` 类。更多关于使用这些新集合功能的信息，请参阅本迷你书籍的第\
  \ 6 章。关于 lambda 表达式的更多信息，请参阅第 3 本第 7 章。\n\n## 理解 LinkedList 类\n\n*链表*（linked list）是一种集合，其中中的每个对象都维护一个指向列表中后一个对象的指针，以及另一个指向列表中前一个对象的指针。链表中完全不涉及任何数组。相反，列表完全由这些指针进行管理。别担心——你不需要自己进行任何这些指针管理。这一切都由\
  \ `LinkedList` 类为你处理好了。\n\n这种安排相比数组具有某些引入胜的优势：\n\n» 由于 `ArrayList` 类使用数组来存储列表数据，当你向列表中添加项时，`ArrayList`\
  \ 类经常需要重新分配其数组。`LinkedList` 类则不然。链表没有任何尺寸问题。你可以不断向链表中添加项，直到你的计算机内存耗尽。\n\n» 与 `ArrayList`\
  \ 类一样，`LinkedList` 类允许你向列表中间插入项。然而，对于 `ArrayList` 类，这种操作非常低效。它必须将插入点之后的所有项都向前移动一个位置，以便为你要插入的项腾出一个位置。`LinkedList`\
  \ 类则不然。要在链表的中间插入一个项，你只需要更改前一个对象和后一个对象的指针即可。\n\n» 对于数组列表，从列表中移除项是非常低效的。`ArrayList`\
  \ 类必须将被删除项之后的每一个项都向数组的前部移动一个位置，以填补被删除项留下的空白。`LinkedList` 类则不然。要从链表中移除一个项，只需要更新被删除项之前和之后的项中的指针即可。\n\
  \n438 第 4 本 字符串、数组和集合\n\n例如，如果你想从拥有 10,000 个项的列表中删除第三个项，`ArrayList` 类必须复制 9,997\
  \ 个项。相比之下，`LinkedList` 类只需更新两个项即可完成。等 `ArrayList` 类处理完时，`LinkedList` 类已经有时间去割草坪、读书并去迪士尼乐园了。\n\
  \n» 链表特别适用于创建两种常见的列表：\n* *栈*（Stacks）：*栈*是一种只能从列表头部添加项和检索项的列表。\n* *队列*（Queues）：*队列*是一种项始终从末尾添加并始终从头部检索的列表。对于栈和队列所需的处理类型，数组的效率极低。（你可以在第\
  \ 4 本第 5 章中看到如何使用链表创建栈和队列的示例。）\n\n» `ArrayList` 类实际上内部使用数组来存储你添加的数据。`ArrayList`\
  \ 类负责管理该数组的大小。当你向列表添加项时，如果底层数组已满，`ArrayList` 类会自动创建一个更大的数组并将现有项复制过去。然而，世界上没有免费的午餐。链表的灵活性是有代价的：链表比数组需要更多内存，并且在顺序访问方面比数组慢。\n\
  \n与 `ArrayList` 类一样，`LinkedList` 类有许多构造函数和方法。为了方便参考，表 4-1 列出了 `LinkedList` 类的构造函数和方法。\n\
  \n### 使用 LinkedList 类\n\n当你查看这些方法时，你会发现几个似乎相同的方法。这些相似的方法通常有细微的区别。例如，`getFirst` 和\
  \ `peek` 方法都从列表中获取第一个元素而不将其移除。唯一的区别在于列表为空时。在这种情况下，`getFirst` 会抛出异常，而 `peek` 返回 null。\n\
  \n在某些情况下，方法是完全相同的，例如 `remove` 和 `removeFirst` 方法。事实上，如果你疯狂地查看 `LinkedList` 类的源代码，你会发现\
  \ `remove` 方法只包含一行代码：对 `removeFirst` 方法的调用。\n\n第 4 章 使用 LinkedList 类 439\n\n## 表\
