  \ {\n    stage.close();\n}\n```\n\n# 第 6 章：从列表中选择\n\n有一整类 JavaFX 控件设计用于让用户从列表中选择一个或多个项目。本章介绍了三个此类控件：选择框（choice\
  \ boxes）、组合框（combo boxes）和列表（lists）。在此过程中，你将发现如何使用 `ObservableList` 接口，它被用于管理由选择框、组合框或列表视图（list\
  \ view）控件显示的项目列表。\n\n实际上，如果你一直读到这里，已经简要接触过 `ObservableList` 接口，因为它也用于管理在布局面板中显示的控件列表。在第\
  \ 5 章中，你学习了如何使用该接口的 `addAll` 方法。在本章中，你将学习该接口的其他功能。你还将发现如何添加事件监听器，以便在用户更改当前选择时做出响应。\n\
  \n## 使用选择框\n\n*选择框*（choice box）是一种允许用户从下拉列表中选择项目的控件。初始状态，选择框仅显示当前选中的项目。当用户点击选择框时，选项列表就会显示。用户可以通过点击列表中的任何项目来更改选择。图\
  \ 6-1 显示了一个带有简单选择框的场景。\n\n你使用 `ChoiceBox` 类来创建选择框。表 6-1 列出了该类常用的构造函数和方法。\n\n###\
  \ 表 6-1：常用的 ChoiceBox 构造函数和方法\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n| `ChoiceBox<T>()()`\
  \ | 创建一个指定类型的空选择列表 |\n| `ChoiceBox<T>(ObservableList<T> items)` | 创建选择列表并用指定列表中的值填充\
  \ |\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `ObservableList<T> getItems()` | 获取项目列表 |\n\
  | `void setItems(ObservableList<T> items)` | 设置项目列表 |\n| `T getValue()` | 返回当前选中的项目\
  \ |\n| `void setValue(T value)` | 设置当前选中的项目 |\n| `void show()` | 显示项目列表 |\n| `void\
  \ hide()` | 隐藏项目列表 |\n| `boolean isShowing()` | 表示项目列表当前可见 |\n\n### 创建选择框\n\n创建选择框非常简单。`ChoiceBox`\
  \ 类是泛型的，因此需要为与选择框关联的列表指定类型。例如：\n\n```java\nChoiceBox<String> choice = new ChoiceBox<String>();\n\
  ```\n\n在这里，创建了一个显示字符串的选择框。下一步是向选择框添加项目。你可以通过调用 `getItems` 方法来访问项目列表，然后调用 `add` 方法添加项目：\n\
  \n```java\nchoice.getItems().add(\"Bashful\");\nchoice.getItems().add(\"Doc\");\n\
  choice.getItems().add(\"Dopey\");\nchoice.getItems().add(\"Grumpy\");\nchoice.getItems().add(\"\
  Happy\");\nchoice.getItems().add(\"Sleepy\");\nchoice.getItems().add(\"Sneezy\"\
  );\n```\n\n或者，你可以调用 `addAll` 方法一次性添加所有字符串，如下：\n\n```java\nchoice.getItems().addAll(\"\
  Bashful\", \"Doc\", \"Dopey\", \"Grumpy\", \"Happy\", \"Sleepy\", \"Sneezy\");\n\
  ```\n\n`getItems` 方法返回一个 `ObservableList` 类型的对象，它提供了许多让你操作列表的方法。更多信息，请参阅本章稍后的“使用\
  \ Observable 列表”部分。`ChoiceBox` 类还包含一个构造函数，允许你在创建选择框时添加一个 `ObservableList` 对象。这允许你将在创建选择框之前创建列表。\n\
  \n你可以向选择框添加任何种类的对象。选择框会调用每个项目的 `toString` 方法来确定显示的文本。假设你有一个名为 `Astronaut` 的类，代表太空任务中的航天员：\n\
  \n```java\nclass Astronaut {\n    private String firstName;\n    private String\
  \ lastName;\n\n    public Astronaut(String FirstName, String LastName) {\n     \
  \   firstName = FirstName;\n        lastName = LastName;\n    }\n\n    public String\
  \ toString() {\n        return firstName + \" \" + lastName;\n    }\n}\n```\n\n\
  然后，你可以创建一个列出阿波罗 13 号宇天员的选择框：\n\n```java\nChoiceBox<Astronaut> apollo13 = new ChoiceBox<Astronaut>();\n\
  apollo13.getItems().add(new Astronaut(\"Jim\", \"Lovell\"));\napollo13.getItems().add(new\
  \ Astronaut(\"John\", \"Swigert\"));\napollo13.getItems().add(new Astronaut(\"Fred\"\
  , \"Haise\"));\n```\n\n如果你愿意，可以在用户点击之前显示选择框的内容。要这样做，调用 `show` 方法：\n\n```java\napollo13.show();\n\
  ```\n\n要隐藏列表，调用 `hide` 方法：\n\n```java\napollo13.hide();\n```\n\n### 设置默认值\n\n默认情况下，选择框首次显示时没有初始选择。要设置初始值，调用\
  \ `setValue` 方法并传递你想作为初始选择的对象。\n\n如果选择框包含字符串，可以通过将所需的字符串值传递给 `setValue` 方法来设置初始值：\n\
  \n```java\nchoice.setValue(\"Dopey\");\n```\n\n如果指定的字符串不存在，初始值将保持未指定。\n\n如果选择框包含对象（例如前节所示的\
  \ `Astronaut` 对象），你必须传递你想作为默认选择的对象引用。例如：\n\n```java\nAstronaut lovell = new Astronaut(\"\
  Jim\", \"Lovell\");\nAstronaut swigert = new Astronaut(\"John\", \"Swigert\");\n\
  Astronaut haise = new Astronaut(\"Fred\", \"Haise\");\n\nChoiceBox<Astronaut> apollo13\
  \ = new ChoiceBox<Astronaut>();\napollo13.getItems().addAll(lovell, swigert, haise);\n\
  apollo13.setValue(lovell);\n```\n\n在这里，Jim Lovell 被设置为默认航天员。\n\n### 获取选中的项目\n\n\
  你可以调用 `getValue` 方法来获取用户选中的项目。返回值的类型取决于你在创建选择框时指定的类型。例如，如果你指定了 `String` 类型，`getValue`\
  \ 方法返回字符串。如果你为选择框指定了 `Astronaut` 类型，该方法则返回航天员对象。\n\n`getValue` 方法通常用于按钮的动作事件处理器中。例如：\n\
  \n```java\npublic void btnOK_Click() {\n    String message = \"You chose \";\n}\n\
  ```\n\n\n\n\n\n```java\nmessage += apollo13.getValue();\n```\n\n## 从列表中选择\n\n```java\n\
  Alert a = new Alert(Alert.AlertType.INFORMATION, message);\na.setTitle(\"Your Favorite\
  \ Astronaut\");\na.showAndWait();\n```\n\n## 使用可观测列表 (Observable Lists)\n\n正如你在上一节中看到的，`ChoiceBox`\
  \ 类并不包含允许你直接从选择框显示的列表中添加或删除项的方法。相反，它包含一个命名为 `getItems` 的方法，该方法返回一个类型为 `ObservableList`的对象。该方法返回的对象是一个可观测列表；它代表了选择框显示的列表。\n\
  \n要对选择框显示的项进行操作，你必须先访问可观测列表，然后使用 `ObservableList` 类的方法来访问列表中的各个项目。\n\n可观测列表不仅被 `ChoiceBox`\
  \ 类使用，还被其他显示列表项的控件类使用，例如 `ComboBox` 和 `List`，你可以在本章的稍后部分阅读关于它们的内容。这两个类都有一个返回 `ObservableList`\
  \ 的 `getItems` 方法。\n\n可观测列表还被布局窗格（如 `HBox` 和 `VBox`）使用，你可以在第 5 章中读到它们。所有布局类共有的 `getChildren`\
  \ 方法返回一个 `ObservableList`。\n\n到目前为止，我只讨论了 `ObservableList` 接口的两个方法：`add` 和 `addAll`，它们允许向可观测列表添加项。这里是本章较之前\
  \ `add` 方法的一个示例：\n\n```java\ncbox.getItems().add(\"Bashful\");\n```\n\n这里是来自第 5\
  \ 章的一个示例，它使用 `addAll` 方法将按钮添加到布局窗格：\n\n```java\npane.getChildren().addAll(btnOK,\
  \ btnCancel);\n```\n\n`ObservableList` 接口除了 `add` 和 `addAll` 之外还有许多其他方法。表 6-2 显示了你最可能使用的方法。\n\
  \n### 表 6-2：常用的 ObservableList 方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void add(E\
  \ element)` | 将指定的元素添加到列表末尾。 |\n| `void add(int index, E element)` | 在指定的索引位置将指定的对象添加到列表。\
  \ |\n| `void addAll(E...elements)` | 将所有指定的元素添加到列表末尾。 |\n| `void addAll(Collection<E>\
  \ c)` | 将指定集合的所有元素添加到列表末尾。 |\n| `E set(int index, E elem)` | 将指定的元素设置为指定的对象。之前在该位置的元素作为方法的返回值返回。\
  \ |\n| `void clear()` | 删除列表中的所有元素。 |\n| `void remove(int fromIndex, int toIndex)`\
  \ | 移除所有索引值在指定值范围之间的对象。 |\n| `void removeAll(E...elements)` | 移除所有索引值在指定范围之间的对象。\
  \ |\n| `boolean contains(Object elem)` | 返回一个布尔值，指示指定的对象是否在列表中。 |\n| `E get(int\
  \ index)` | 返回列表中指定位置的对象。 |\n| `int indexOf(Object elem)` | 返回指定对象在列表中第一次出现的索引位置。如果该对象不在列表中，则返回\
  \ –1。 |\n| `boolean isEmpty()` | 返回一个布尔值，指示列表是否为空。 |\n| `E remove(int index)` |\
  \ 移除指定索引处的对象并返回被移除的元素。 |\n| `boolean remove(Object elem)` | 从列表中移除一个对象。**注意：** 可能有多个元素引用该对象；此方法仅移除其中一个。返回一个布尔值，指示该对象是否在列表中。\
  \ |\n| `int size()` | 返回列表中元素的数量。 |\n| `void addListener(ListChangeListener listener)`\
  \ | 添加一个 `ListChangeListener`，每当列表发生变化时就会被调用。 |\n\n如果你熟悉 Java 集合类（如 `ArrayList`），你可能注意到表\
  \ 6-2 中列出的许多方法都很熟悉。这是因为 `ObservableList` 类继承了 `List` 类，而 `List` 正是由 `ArrayList`\
  \ 和 `Vector` 等类实现的。因此，任何适用于 `ArrayList` 的方法也可以用于 `ObservableList`。\n\n例如，你可以像清除数组列表的内容一样清除选择框的内容：\n\
  \n```java\ncbox.getItems().clear();\n```\n\n如果你需要知道选择框中有多少项，请调用 `size` 方法：\n\n```java\n\
  int count = cbox.getItems().size();\n```\n\n要从列表中删除特定项，请使用 `remove` 方法：\n\n```java\n\
  cbox.getItems().remove(\"Grumpy\");\n```\n\n无论列表中是否出现字符串 \"Grumpy\"，此方法都会成功。你可以通过在\
  \ `addAll` 方法中指定集合，轻松地从现有的 Java 集合（如数组列表）向选择框插入项。例如，假设你有一个名为 `list` 的数组列表，其中包含你想在选择框中显示的项。你可以这样添加项：\n\
  \n```java\ncbox.getItems().addAll(list);\n```\n\n你可能会疑惑，为什么基于列表的 JavaFX 控件显示的项需要可观测列表。为什么不直接使用现有的集合类呢？因为为了让基于列表的控件高效工作，控件本身需要监控你对列表进行的任何更改。表\
  \ 6-2 中列出的最后一个方法（`addListener`）通过允许在列表内容变化时添加监听器提供了这种功能。**注意：** 你并不使用 `addListener`\
  \ 方法来响应用户在选择框中的选择。相反，你使用一种名为选择模型的构造结构来响应变化。\n\n## 监听选择变化\n\n希望程序在用户更改选择框或其他列表控件的选择时立即做出响应是非常常见的，而无需等待用户点击按钮提交数据。例如，你可能有一个标签，希望在用户更改选择时立即更新其值。你甚至可能根据选择显示或隐藏不同的控件。\n\
  \n遗憾的是，选择框和其他列表控件在用户更改选择时不会产生动作事件。因此，`ChoiceBox` 类没有 `setOnAction` 方法。相反，你必须使用一系列方法调用来设置一种不同类型的事件监听器，称为更改监听器。\n\
  \n以下是调用序列：\n\n1. 通过调用选择框的 `getSelectionModel` 方法获取选择模型。\n2. 通过调用选择模型的 `selectedItemProperty`\
  \ 方法获取 `selectedItem` 属性。\n3. 在 `selectedItem` 属性上调用 `addListener` 方法添加更改监听器。\n\n\
  \n\n\n当 `selectedItem` 属性的值发生变化时，监听器就会被调用。更改监听器实现了一个自然称为 `ChangeListener` 的函数式接口。由于\
  \ `ChangeListener` 是一个函数式接口（即它只有一个方法），你可以使用 lambda 表达式来实现更改监听器。\n\n你通常会在一个语句中完成这三个步骤，如下例所示：\n\
  \n```java\nchoice.getSelectionModel().selectedItemProperty()\n.addListener( (v,\
  \ oldValue, newValue) ->\nlbl.setText(newValue); );\n```\n\n在上一个示例中，更改监听器将标签控件显示的值设置为用户选中的新值。\n\
  \n## 从列表中选择\n\n作为一个函数式接口，`ChangeListener` 定义了一个名为 `changed` 的单函数，每当属性值发生变化时，该方法就会被调用。`changed`\
  \ 方法接收三个参数：\n\n- **observable（可观测对象）：** 值发生变化的属性\n- **oldValue（旧值）：** 属性属性值\n- **newValue：**\
  \ 属性的新值\n\n这三个参数在 Lambda 表达式开头的括号中指定。在 Lambda 表达式的体内，`newValue` 参数被赋值给标签的文本。因此，用户选择的值将由标签显示，每当用户更改选择框的选择时，标签都会自动更新。\n\
  \n## 使用组合框\n\n*组合框*（combo box）是选择框控件更高级的兄弟控件。你通过组合框获得的主要改进有：\n\n- **组合框包含了限制显示列表时显示项目数量的能力。**\
  \ 如果列表中的项目数量超过限制，将自动添加滚动条，允许用户滚动整个列表。\n- **组合框包含一个文本字段，允许用户直接输入值，而不是从列表中选择值。** 该文本字段是可选的，且默认不显示，但你可以通过单个方法调用添加它。图\
  \ 6-2 显示了带有文本字段的组合框。\n- **每当用户更改选择时，组合框都会触发一个动作事件。** 因此，与选择框相比，设置事件处理器来响应用户的选择变化要简单得多。\n\
  \n**图 6-2：**\n组合框。\n\n你使用 `ComboBox` 类来创建组合框。表 6-3 列出了该类最常用的构造函数和方法。\n\n### 表 6-3：常用的\
  \ ComboBox 构造函数和方法\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n| `ComboBox<T>()` | 创建一个指定类型的空组合框。\
  \ |\n| `ComboBox<T>(ObservableList<T> items)` | 创建一个组合框并用指定列表中的值填充它。 |\n\n| **方法**\
  \ | **描述** |\n| `void setEditable(boolean value)` | 如果为 true，则显示文本字段以允许用户直接编辑选择。\
  \ |\n| `void setVisibleRowCount(int value)` | 设置显示的项目数量。 |\n| `void setPromptText(String\
  \ text)` | 设置最初在文本字段中显示的提示文本。 |\n| `ObservableList<T> getItems()` | 获取项目列表。 |\n\
  | `void setItems(ObservableList<T> items)` | 设置项目列表。 |\n| `T getValue()` | 返回当前选中的项目。\
  \ |\n| `void setValue(T value)` | 设置当前选中的项目。 |\n| `void show()` | 显示项目列表。 |\n| `void\
  \ hide()` | 隐藏项目列表。 |\n| `void setOnAction(EventHandler<ActionEvent> handler)` |\
  \ 设置在每次选择变化时调用的事件处理器。 |\n| `boolean isShowing()` | 表示项目列表当前是否可见。 |\n\n## 创建组合框\n\
  \n创建组合框与创建选择框非常相似。由于 `ComboBox` 是泛型的，请为它将包含的项目指定一个类型，如下例：\n\n```java\nComboBox<String>\
  \ cbox = new ComboBox<String>();\n```\n\n然后，你可以使用 `getItems` 方法来访问包含组合框显示的列表内容的\
  \ `ObservableList` 对象。例如，你可以这样向列表添加项目：\n\n```java\ncbox.getItems().addAll(\"Bashful\"\
  , \"Doc\", \"Dopey\", \"Grumpy\", \"Happy\", \"Sleepy\", \"Sneezy\");\n```\n\n有关关于与\
  \ `ObservableList` 接口操作的更多信息，请翻阅本章前面的“与 Observable Lists 交互”部分。\n\n默认情况下，不允许用户编辑组合框文本字段部分的数据。如果你想允许用户编辑文本字段，请使用\
  \ `setEditable` 方法，如下：\n\n```java\ncbo.setEditable(true);\n```\n\n然后用户就可以输入一个组合框中不存在的值。\n\
  \n如果你需要，可以通过调用 `setVisibleRows` 方法来限制列表显示的项目数量：\n\n```java\ncbo.setVisibleRows(10);\n\
  ```\n\n在这里，列表最多显示十个项目。如果列表包含超过十个项目，则会自动添加滚动条，使用户可以滚动整个列表。\n\n你还可以通过 `setPromptText`\
  \ 方法在组合框的文本字段组件中指定提示文本：\n\n```java\ncbo.setPromptText(\"Make a choice\");\n```\n\
  \n在这里，文本 `Make a choice` 显示在文本字段中。\n\n### 获取选中的项目\n\n要获取用户选择的项目，请使用 `getValue` 方法，就像对选择框这样做一样。你通常在响应用户选择的事件处理器中这样做。例如：\n\
  \n```java\npublic void getValue_Click() {\n    String message = \"You chose \";\n\
  \    message += cbo.getValue();\n    Alert a = new Alert(AlertType.INFORMATION,\
  \ message);\n    a.setTitle(\"Your Choice\");\n    a.showAndWait();\n}\n```\n\n\
  请注意，`getValue` 返回可能不在组合框的列表中。这是因为用户可以在文本字段中输入任何内容。如果你想知道用户是从列表中选择了一个项目还是通过文本框输入了不同的项目，请使用\
  \ `ObservableList` 类的 `contains` 方法，如下：\n\n```java\nif (!cbo.getItems().contains(cbo.getValue()))\
  \ {\n    Alert a = new Alert(AlertType.INFORMATION, \"You chose outside the box\"\
  );\n    a.setTitle(\"Good Thinking!\");\n}\n```\n\n在这里，如果用户输入了列表之外的项目，就会显示警告。\n\n\
  ### 处理组合框事件\n\n当用户从组合框选择项目时，会生成一个动作事件。在大多数应用程序中，你只需忽略此事件，因为你通常不需要在用户选择项目时立即执行操作。相反，会在点击按钮时处理选择的项目。\n\
  \n如果你想在用户选择项目时提供立即反馈，可以通过调用组合框的 `setOnAction` 方法设置事件处理器。大多数情况下，这样做最简单的方法是创建一个包含用户选择项目时要执行的代码的方法，然后通过\
  \ lambda 表达式将此方法传递给 `setOnAction`。\n\n例如，以下方法在用户选择 Dopey 时会显示“My favorite too!”的对话框：\n\
  \n```java\npublic void cbo_Changed() {\n    if (cbo.getValue().equals(\"Dopey\"\
  )) {\n        Alert a = new Alert(AlertType.INFORMATION, \"He's my favorite too!\"\
  );\n        a.setTitle(\"Good Choice\");\n        a.showAndWait();\n    }\n}\n```\n\
  \n这里是每当用户更改组合框选择时调用该方法的代码：\n\n```java\ncbo.setOnAction(e -> cbo_Changed());\n```\n\
  \n## 使用列表视图\n\n*列表视图*（list view）是一种强大的 JavaFX 控件，在框内显示对象列表。根据列表的配置，用户可以选择列表中的一个项目或多个项目。此外，你对列表项目的显示方式拥有惊人的控制。图\
  \ 6-3 显示了一个带有列表视图的示例场景。\n\n列表视图和组合框有几个重要的区别：\n\n\n\n\n\n- 列表视图（ListView）没有允许用户编辑所选项目的文本字段。相反，用户必须直接从列表视图选择项目。\n\
  - 列表视图不会展开。相反，列表项显示在一个框中，你可以指定该框的大小。\n- 列表视图中的项目可以垂直排列（默认设置）或水平排列。图 6-4 显示了一个水平列表框。\n\
  - 列表视图允许用户选择多个项目。默认情况下，列表视图允许用户只选择一个项目，但你可以轻松地配置它以允许多项选择。\n\n要在列表中选择多个项目，请按住 `Ctrl`\
  \ 键并点击想要选择的项。要选择一个范围内的项目，点击第一个项目，按住 `Shift` 键，然后点击最后一个项目。\n\n694 第 6 册 **JavaFX**\n\
  \n![Image 85](img/index-717_1.png)\n\n**图 6-4:**\n水平列表视图控件。\n\n你使用 `ListView` 类来创建列表视图控件。表\
  \ 6-4 列出了该类最常用的构造函数和方法。\n\n**表 6-4**\n**常用的 ListView 构造函数和方法**\n\n| 构造函数 | 说明 |\n\
  | :--- | :--- |\n| `ListView<T>()` | 创建指定类型的空列表视图。 |\n| `ListView<T>(ObservableList<T>\
  \ items)` | 创建列表视图并用指定列表中的值填充它。 |\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `ObservableList<T>\
  \ getItems()` | 获取项目列表。 |\n| `void setItems(ObservableList<T> items)` | 设置项目列表。\
  \ |\n| `void setOrientation(Orientation o)` | 设置列表的方向。该方向可以是 `Orientation.HORIZONTAL`\
  \ 或 `Orientation.VERTICAL`。 |\n| `MultipleSelectionModel<T> getSelectionModel()`\
  \ | 返回列表视图控件的选择模型。 |\n\n你可以使用选择模型通过调用其 `getSelectedItems` 方法来获取已选择项的可观测列表。你也可以通过调用\
  \ `getSelectedItem` 来获取最近选择的项。\n\n### 从列表中选择\n\n#### 创建列表视图\n创建列表视图控件与创建组合框框（combo\
  \ box）类似。以下是一个创建了图 6-3 所示列表视图的示例：\n\n```java\nListView list = new ListView();\n\
  list.getItems().addAll(\"Sausage\", \"Pepperoni\", \"Linguica\", \"Salame\", \"\
  Olives\", \"Mushrooms\", \"Onions\", \"Peppers\", \"Pineapple\", \"Spinach\", \"\
  Canadian Bacon\", \"Tomatoes\", \"Kiwi\", \"Anchovies\", \"Gummy Bears\");\n```\n\
  \n注意图 6-3 显示的列表视图仅显示列表中的前八项。与组合框一样，如果项目集合中的项目总数无法显示，则会自动向列表视图添加滚动条。\n\n默认情况下，列表视图控件仅允许单项选择。要允许多项选择，请添加此行：\n\
  \n```java\nlist.getSelectionModel().setSelectionMode(SelectionMode.MULTIPLE);\n\
  ```\n\n要让列表视图水平排列而不是垂直排列，请添加此行：\n\n```java\nlist.setOrientation(Orientation.HORIZONTAL);\n\
  ```\n\n#### 获取所选项\n从列表视图控件获取所选项有点复杂。首先，你必须通过调用 `selectionModel` 获取选择模型对象。然后，调用选择模型的\
  \ `getSelectedItems` 方法。这返回一个只读的可观测列表，其中仅包含被选中的项。\n\n以下示例构建了一个字符串，列出了用户为图 6-3 所示披萨配料列表视图选择的所有项目：\n\
  \n```java\nString tops = \"\";\nObservableList<String> toppings;\ntoppings = list.getSelectionModel().getSelectedItems();\n\
  for(String topping : toppings)\n{\n    tops += topping + \"\\n\";\n}\n```\n\n在前面的示例中，字符串\
  \ `tops` 将包含用户选择的所有配料，并用换行符分隔。\n\n### 使用树视图\n*树视图*（tree view）是一种高级的 JavaFX 控件，它以大纲形式显示分级数据，我们这些电脑痴将其之为树。树形结构在计算机世界非常常见。你磁盘驱动器的文件夹结构是一棵树，JavaFX\
  \ 场景图也是如此。\n\n696 第 6 册 **JavaFX**\n\n![Image 86](img/index-719_1.png)\n\n图 6-5\
  \ 显示了一个包含树视图控件的 JavaFX 场景。在这个示例中，我使用树控件来表示我喜欢的几部电视剧，以及从它们衍生出来的剧集。\n\n**图 6-5:**\n\
  树视图控件。\n\n在我介绍如何创建树控件的机制之前，你需要了解一些描述树中元素的术语：\n\n- **节点 (Node):** 树中的每个元素都是一个*节点*。树中的每个节点都是由\
  \ `TreeItem` 类创建的。`TreeItem` 类是一个泛型类，你可以为它关联一个类型。因此，你可以使用任何类型的对象来创建树，包括你自己创建的类型。\n\
  - **根节点 (Root node):** *根节点*是树的起始节点。每棵树必须有一个且仅有一个根节点。当你创建一个树组件时，将根节点传递给 `TreeView`\
  \ 构造函数。\n- **子节点 (Child node):** 出现在给定节点下方的节点是该节点的子节点。\n- **父节点 (Parent node):**\
  \ 紧邻节点上方的节点是该节点的父节点。\n- **兄弟节点 (Sibling node):** 具有相同父节点的节点。\n- **叶子节点 (Leaf node):**\
  \ 不具有任何子节点的节点。\n- **路径 (Path):** 路径包含该节点及其所有祖先——即它的父节点、父节点的父节点等等——直到根节点。\n- **展开节点\
  \ (Expanded node):** 子节点可见的展开节点。\n- **折叠节点 (Collapsed node):** 子节点隐藏的折叠节点。\n\n####\
  \ 构建树\n在实际创建树视图之前，你必须先构建它显示的树。为此，请使用 `TreeItem` 类，详情见表 6-5。\n\n**表 6-5**\n**TreeItem\
  \ 类**\n\n| 构造函数 | 说明 |\n| :--- | :--- |\n| `TreeItem<T()` | 创建一个空树节点。 |\n| `TreeItem<T>(T\
  \ value)` | 创建指定值的树节点。 |\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `T getValue()` | 返回树项的值。\
  \ |\n| `void setValue(T value)` | 设置树项的值。 |\n| `ObservableList getChildren()` |\
  \ 返回表示此树项子项的可观测列表。 |\n| `TreeItem getParent()` 获取父节点。 |\n| `void setExpanded(boolean\
  \ expanded)` | 指定展开节点。 |\n| `boolean isExpanded()` | 返回树项是否展开。 |\n| `boolean isLeaf()`\
  \ | 返回树项是否为叶子节点（即没有子节点）。 |\n| `TreeItem nextSibling()` | 返回树项的下一个兄弟节点。如果没有下一个兄弟节点，则返回\
  \ null。 |\n| `TreeItem prevSibling()` | 返回树项的上一个兄弟节点。如果没有上一个兄弟节点，则返回 null。 |\n\n\
  `TreeItem` 类为每个节点提供了三个基本特征：\n\n- **值 (value)**，包含了节点表示的数据。在我的示例中，我使用字符串作为用户对象，但你可以使用任何类型的对象作为用户对象。树控件调用用户对象的\
  \ `toString` 方法来确定为每个节点显示的文本。\n- **父节点 (parent)**，除非节点恰好是根节点。\n- **子项 (children)**，用\
  \ `ObservableList` 表示。如果节点恰好是叶子节点，则列表将为空。\n\n在本节中，我构建了一棵树，列出了过去三部热门电视剧的衍生剧：\n\n\n\
  \n\n\n- *《安迪·格里菲斯秀》（The Andy Griffith Show）产生有两个衍生剧：*《戈纳·派尔，美国海军陆战队》和*《梅伯瑞 R.F.D.》。\n\
  - *《家庭一切》（All in the Family）直接衍生了四部剧集：*《杰斐森一家》、*《莫德》、*《格洛丽亚》和*《阿奇·邦克的地方》。\n\n此外此外，其中两部衍生剧又各自衍生了涉及女佣的剧集：杰斐森一家的女佣成为了一部名为《入住登记》（Checking\
  \ In）的短剧的主角，而莫德的女佣则成为了《欢乐时光》（Good Times）的主角。\n- *《欢乐时光》（Happy Days）衍生了*《莫克与米迪》（Mork\
  \ and Mindy）、*《莱恩与莎莉》（Laverne and Shirley）以及*《乔妮爱查奇》（Joanie Loves Chachi）。\n\n##\
  \ 从列表中选择\n\n你可以采取许多方法来构建树结构，其中大多数都涉及某种递归编程。为了保持简单，我将在本节中避免递归编程，但这种规避意味着你必须将树的一些细节硬编码到程序中。大多数处理树的实际程序都需要某种形式的递归编程来构建树。\n\
  \n创建树的第一步是为每个非叶子节点声明一个 `TreeItem` 变量。对于我的电视剧示例，我从以下代码开始：\n\n```\nTreeItem andy,\
  \ archie, happy, george, maude;\n```\n\n这些变量可以作为 `start` 方法中的局部变量，因为一旦设置好树，你就不再需要这些变量了。稍后你就会明白为什么不需要叶子节点的变量了。\n\
  \n接下来，我创建根节点并将其展开状态设置为 `true`，这样在树初始显示时它就会展开：\n\n```\nTreeItem root = new TreeItem(\"\
  Spin Offs \");\nroot.setExpanded(true);\n```\n\n为了简化创建其他节点节点，我使用了以下辅助方法 `makeShow`：\n\
  \n```java\npublic TreeItem<String> makeShow(String title, TreeItem<String> parent)\n\
  {\n    TreeItem<String> show = new TreeItem<String>(title);\n    show.setExpanded(true);\n\
  \    parent.getChildren().add(show);\n    return show;\n}\n```\n\n此方法接受一个字符串和另一个节点作为参数，并返回一个用户对象被设置为\
  \ `String` 参数的节点。返回的节点也会作为子节点添加到父节点，并且该节点会被展开。因此，你可以调用此方法来同时创建新节点并将节点放置在树中。\n\n\
  下一步是创建一些节点。继续我的示例，我首先创建了《安迪·格里菲斯秀》及其衍生剧的节点：\n\n```\nandy = makeShow(\"The Andy Griffith\
  \ Show\", root);\nmakeShow(\"Gomer Pyle, U.S.M.C.\", andy);\nmakeShow(\"Mayberry\
  \ R.F.D.\", andy);\n```\n\n在这里，调用 `makeShow` 来为《安迪·格里菲斯秀》创建一个节点，并将根节点指定为其父节点。该方法返回的节点保存在\
  \ `andy` 变量中。然后调用两次 `makeShow` 来创建衍生剧，这次指定 `andy` 为父节点。\n\n由于《戈纳·派尔，美国海军陆战队》和《梅伯瑞\
  \ R.F.D.》都没有衍生剧，我不需要将这些节点作为父参数传递给 `makeShow` 方法。这就是为什么我没有费心创建一个变量来引用这些节点。\n\n接在我的示例中，我创建了《家庭一切》及其衍生剧的节点：\n\
  \n```\narchie = makeShow(\"All in the Family\", root);\ngeorge = makeShow(\"The\
  \ Jeffersons\", archie);\nmakeShow(\"Checking In\", george);\nmaude = makeShow(\"\
  Maude\", archie);\nmakeShow(\"Good Times\", maude);\nmakeShow(\"Gloria\", archie);\n\
  makeShow(\"Archie Bunker's Place\", archie);\n```\n\n在这种情况下，《杰斐森一家》和《莫德》有自己的子节点。因此，这两部剧需要变量，以便在我创建《入住登记》和《欢乐时光》的节点时，将它们作为父参数传递给\
  \ `makeShow`。\n\n最后，这里是创建《欢乐时光》及其衍生剧节点的代码：\n\n```\nhappy = makeShow(\"Happy Days\"\
  , root);\nmakeShow(\"Mork and Mindy\", happy);\nmakeShow(\"Laverne and Shirley\"\
  , happy);\nmakeShow(\"Joanie Loves Chachi\", happy);\n```\n\n完整的树已在内存中成功创建，所以我可以开始创建一个\
  \ `TreeView` 控件来展示这棵树。\n\n## 创建 TreeView 控件\n\n你使用 `TreeView` 类来创建一个显示树节点的树组件。表\
  \ 6-6 显示了该类的关键构造函数和方法。\n\n### 表 6-6：TreeView 类\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n\
  | `TreeView<T>()` | 创建一个空树（如果你问我的话，这没什么用）。 |\n| `TreeView<T>(TreeItem root)` | 创建显示从指定节点开始的树。\
  \ |\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `TreeItem getRoot()` | 获取根节点。 |\n| `void\
  \ setRoot(TreeItem root)` | 设置根节点。 |\n| `MultipleSelectionModel<T>` | 返回列表视图控件的选择模型。你可以调用\
  \ `getSelectionModel()` 使用选择模型通过调用 `getSelectedItem()` 来获取选中项的可观察列表。 |\n| `void\
  \ setShowRoot(boolean visible)` | 决定根节点是否可见。 |\n\n创建 TreeView 控件的第一步是声明一个 `TreeView`\
  \ 变量，以便可以在任何方法中访问它，如下：\n\n```\nTreeView tree;\n```\n\n然后，在应用程序的 `start` 方法中，调用 `TreeView`\
  \ 构造函数来创建树，传递你希望它显示的根节点：\n\n```\ntree = new TreeView(root);\n```\n\n默认情况下，用户只能从树中选择一个节点。要允许选择多个节点，请使用此咒语：\n\
  \n```\ntree.getSelectionModel().setSelectionMode(SelectionModel.MULTIPLE);\n```\n\
  \n就这些了！你现在有了一个 TreeView 控件，可以将其添加到布局面板并在场景中显示。\n\n虽然树控件显示的树必须从根节点开始，但在许多情况下，根节点是多余的。例如，在你看过的示例中，显示根节点有什么意义呢？如果你不想显示根节点，TreeView\
  \ 控件允许你抑制。要隐藏根节点，只需调用此方法：\n\n```\ntree.setShowRoot(false);\n```\n\n图 6-6 显示了隐藏根节点的树外观。\n\
  \n## 获取选中节点\n\n有多种方法可以确定树视图中当前选择了哪些节点。一种方法是通过调用 `getSelectionModel()` 访问树的选择模型。然后，你可以调用选择模型的\
  \ `getSelectedItems()` 方法来返回一个包含已选中项的只读可观察列表。\n\n例如：\n\n```java\nString msg = \"\
  \";\nObservableList<TreeItem<String>> shows = tree.getSelectionModel().getSelectedItems();\n\
  for(TreeItem show : shows) {\n    msg += show.getValue() + \"\\n\";\n}\n```\n\n\
  前面的示例中，`msg` 字符串将包含用户从树中选择的所有节目，用换行符分隔。\n\n另一种方法是添加一个事件处理器，每当选择发生变化时调用它。你可以这样做：\n\
  \n```java\ntree.getSelectionModel().selectedItemProperty()\n.addListener( (v, oldValue,\
  \ newValue) -> tree_SelectionChanged(newValue) );\n```\n\n\n\n\n它调用了一个名为 `tree_SelectionChanged`\
  \ 的方法。新选择的值将作为参数传递。\n\n# 第 6 章 **从列表中选择** 703\n\n以下是 `tree_SelectionChanged` 方法的内容：\n\
  \n```java\npublic void tree_SelectionChanged(TreeItem<String> item)\n{\n    if (item\
  \ != null)\n    {\n        lblShowName.setText(item.getValue());\n    }\n}\n```\n\
  \n在这里，一个名为 `lblShowName` 的标签被更新，以显示新选中项目的值。**注意：** 使用了 `if` 语句来确保该项目不为空。这是必要的，因为如果用户取消选择某个项目，则\
  \ `tree_SelectionChanged` 方法将以 `null` 值作为其 `item` 参数被调用。\n\n## 查看使用树视图的完整程序\n\n\
  呼！有很多信息需要消化。在这一节中，我将它们整合在了一起。列表 6-1 显示了创建图 6-6 所示场景的完整程序。该程序允许用户从树中选择一个节目，并在树下方的标签中显示选中节目的标题。\n\
  \n**列表 6-1:** **衍生剧程序**\n\n```java\nimport javafx.application.*;\nimport javafx.stage.*;\n\
  import javafx.scene.*;\nimport javafx.scene.layout.*;\nimport javafx.scene.control.*;\n\
  import javafx.geometry.*;\n\npublic class SpinOffs extends Application\n{\n    public\
  \ static void main(String[] args)\n    {\n        launch(args);\n    }\n\n    TreeView<String>\
  \ tree;\n    Label lblShowName;\n\n    @Override public void start(Stage primaryStage)\n\
  \    {\n        TreeItem<String> root, andy, archie, happy, george, maude;\n   \
  \     root = new TreeItem<String>(\"Spin Offs\");\n        root.setExpanded(true);\n\
  \        andy = makeShow(\"The Andy Griffith Show\", root);\n        makeShow(\"\
  Gomer Pyle, U.S.M.C.\", andy);\n        makeShow(\"Mayberry R.F.D\", andy);\n  \
  \      archie = makeShow(\"All in the Family\", root);\n        george = makeShow(\"\
  The Jeffersons\", archie);\n        makeShow(\"Checking In\", george);\n       \
  \ maude = makeShow(\"Maude\", archie);\n        makeShow(\"Good Times\", maude);\n\
  \        makeShow(\"Gloria\", archie);\n        makeShow(\"Archie Bunker's Place\"\
  , archie);\n        happy = makeShow(\"Happy Days\", root);\n        makeShow(\"\
  Mork and Mindy\", happy);\n        makeShow(\"Laverne and Shirley\", happy);\n \
  \       makeShow(\"Joanie Loves Chachi\", happy);\n        tree = new TreeView<String>(root);\n\
  \        tree.setShowRoot(false);\n        tree.getSelectionModel().selectedItemProperty()\n\
  \            .addListener( (v, oldValue, newValue) ->\n                tree_SelectionChanged(newValue)\
  \ );\n        lblShowName = new Label();\n        VBox pane = new VBox(10);\n  \
  \      pane.setPadding(new Insets(20,20,20,20));\n        pane.getChildren().addAll(tree,\
  \ lblShowName);\n\n        // 从列表中选择\n        Scene scene = new Scene(pane);\n \
  \       primaryStage.setScene(scene);\n        primaryStage.setTitle(\"My Favorite\
  \ Spin Offs\");\n        primaryStage.show();\n    }\n\n    public TreeItem<String>\
  \ makeShow(String title, TreeItem<String> parent)\n    {\n        TreeItem<String>\
  \ show = new TreeItem<String>(title);\n        show.setExpanded(true);\n       \
  \ parent.getChildren().add(show);\n        return show;\n    }\n\n    public void\
  \ tree_SelectionChanged(TreeItem<String> item)\n    {\n        if (item != null)\n\
  \        {\n            lblShowName.setText(item.getValue());\n        }\n    }\n\
  }\n```\n\n此程序中的所有代码已在本章中展示过，因此我在这里只需指出重点：\n\n- **→15:** 树模型和列表模型被定义为类实例变量。\n- **→20:**\
  \ 为根节点和每个带有衍生剧的节目定义了 `TreeItem` 变量。\n- **→23:** 创建了文本为 \"Spin-Offs\" 的根节点。\n- **→26:**\
  \ 这些行代码为 *The Andy Griffith Show* 及其衍生剧创建了节点。\n- **→31:** 这些行代码为 *All in the Family*\
  \ 及其衍生剧创建了节点。\n- **→39:** 这些行代码为 *Happy Days* 及其衍生剧创建了节点。\n- **→44:** 该行代码创建了 `TreeView`\
  \ 控件，并将根节点指定为树根。下一行隐藏了根节点。\n- **→46:** 该行代码为被选中项目的属性创建了事件监听器。Lambda 表达式导致名为 `tree_SelectionChanged`\
  \ 方法被调用。\n- **→54:** `TreeView` 控件和标签被添加到 `VBox` 中，然后添加到 `scene` 中。\n- **→64:**\
  \ `makeShow` 方法根据字符串创建一个节点并将其添加到 `parent` 中。\n- **→73:** 每当 `lblShowName` 变化时，就会调用\
  \ `tree_SelectionChanged` 方法。\n\n704 书 6 **JavaFX**\n\n\n\n\n```java\n// 将场景添加到舞台上，设置标题\n\
  // 并显示舞台\n\nprimaryStage.setScene(scene);\nprimaryStage.setTitle(\"The Click Me\
  \ App\");\nprimaryStage.show();\n\n}\n\npublic void buttonClick()\n{\n    if (btn.getText()\
  \ == \"Click me please!\")\n    {\n        btn.setText(\"You clicked me!\");\n \
  \   }\n    else\n    {\n        btn.setText(\"Click me please!\");\n    }\n}\n```\n\
  \n可以使用命令行提示符通过以下命令将 `ClickMe.java` 源文件编译为 Java 类文件：\n\n```bash\njavac ClickMe.java\n\
  ```\n\n然后，可以使用此命令使用类文件创建一个可执行的 JAR 文件：\n\n```bash\njar cf ClickMe.jar *.class\n\
  ```\n\n创建 JAR 文件后，你就可以准备配置 Java Web Start 以从网页上启动 `ClickMe` 程序了。\n\n# 使用 Java Web\
  \ Start\n\n## 了解 Java Web Start\n\nJava Web Start 的工作原理是提供一个指向特殊文件 `JNLP` 的 链接。该文件包含了在用户计算机上下载和启动\
  \ Java 应用程序所需的所有信息。当用户点击 `JNLP` 文件的链接时，Web 服务器会读取 `JNLP` 文件的内容，下载 Java 程序，并在用户的计算机上运行它。\n\
  \n通过 Java Web Start，Java 程序不会在用户的 Web 浏览器环境中运行。相反，Java Web Start 在用户的计算机上本地运行 Java\
  \ 虚拟机（`JVM`），然后在 `JVM` 内部运行应用程序。\n\n一种名为 `applets` 的旧技术允许 Java 程序直接在 Web 浏览器中运行。这需要浏览器插件的帮助，而这可能会导致不同插件版本之间的兼容性问题。浏览器制造商最近宣布他们将不再包含支持\
  \ applets 的插件，且 Oracle 已在 Java 9 中正式弃用了 applets。\n\n如果用户的计算机上没有安装 Java 运行时（或安装的版本不正确），Java\
  \ Web Start 将提供自动下载并安装 Java 运行时的服务。因此，即使用户没有安装 Java，只需点击几次鼠标即可安装 Java 并运行 Java 应用程序。\n\
  \n通常情况下，通过 Java Web Start 运行的应用程序会被阻止执行某些可能会给用户带来安全风险的操作，例如在用户文件系统上进行读写操作或访问用户的本地网络。你可以配置\
  \ Java Web Start 安全功能以允许此类类型的活动，但这样做超出了本书的范围。有关更多信息，请在网上搜索 `Java Web Start`。\n\n\
  设置通过 Java Web Start 运行应用程序的通用流程如下：\n\n### 1. 创建包含你想通过 Java Web Start 运行的 Java 应用程序的\
  \ JAR 文件。\n\n有关如何创建 JAR 文件的信息，请参考第 3 第 8 章。在本章中，假设你已经为 `ClickMe` 应用程序创建名为 `ClickMe.jar`\
  \ 的 JAR 文件。\n\n### 2. 创建 JNLP 文件，指定启用程序从 Java Web Start 运行的必要信息。\n\n此外，`JNLP` 文件必须包含应用程序\
  \ JAR 文件的位置。对于本章所示的应用程序，我们将 JNLP 文件命名为 `clickme.jnlp`。\n\n有关创建 `JNLP` 文件的更多信息，请参见下一节。\n\
  \n### 3. 创建一个包含指向 JNLP 文件链接的 HTML 文件。\n\nHTML 文件将显示在用户的浏览器中。当用户点击 `JNLP` 文件的链接时，`JNLP`\
  \ 文件中定义的应用程序就会运行。在本章中，HTML 文件将命名为 `clickme.html`。\n\n有关创建 HTML 文件的更多信息，请参见本章后后部分的“创建一个启动\
  \ Java 应用程序的 HTML 文件”章节。\n\n### 4. 将 JAR、JNLP 和 HTML 文件拷贝到 Web 服务器相应的文件夹中。\n\n可以使用任何\
  \ FTP 客户端（如 `FileZilla`）将文件上传到你的 Web 服务器，或者使用你的 Web 主机的文件管理工具来上传文件。在大多数情况下，JAR、`JNLP`\
  \ 和 HTML 文件将位于 Web 服务器上的同一个文件夹中。不过，也可以将每个文件保存到不同的文件夹。\n\n## 创建 JNLP 文件\n\n要通过 Java\
  \ Web Start 部署 Java 应用程序，你必须创建一个 `JNLP` 文件，其中包含定位和运行应用程序所需的详细信息。`JNLP` 文件是一个小型 XML\
  \ 文件，包含诸如应用程序名称、指向应用程序 JAR 文件的 URL、创建应用程序的供应商、应用程序所需的 Java 版本，以及在用户计算机上尚未安装 Java\
  \ 运行时时用于下载 Java 运行时的 URL。\n\n`JNLP` 代表 `Java Network Launch Protocol`（Java 网络启动协议），但这不会出现在考试中。如果你还不熟悉\
  \ XML 的基础知识，可以在第 8 卷第 5 章中学习 XML 的语法要求。\n\n## 使用 Java Web Start\n\n列表 1-2 显示了一个名为\
  \ `ClickMe.jnlp` 的 `JNLP` 文件，可以用于从网站 `www.lowewriter.com` 运行 `ClickMe` 应用程序。\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<jnlp codebase=\"http://www.lowewriter.com/ClickMe/\"\
  \ version=\"1.0\">\n  <information>\n    <title>ClickMe</title>\n    <vendor>LoweWriter</vendor>\n\
  \  </information>\n  <resources>\n    <jar href=\"ClickMe.jar\" main=\"true\" />\n\
  \  </resources>\n  <application-desc main-class=\"ClickMe\"/>\n</jnlp>\n```\n\n\
  此 JNLP 文件中的大多数行对于所有 Java 应用程序都是相同的。特定的 Java 应用程序需要更改的行如下：\n\n- **codebase**: 应更改为应用程序所在的根位置。在这种情况下，应用程序的文件存储在\
  \ `http://www.lowewriter.com/ClickMe/`。虽然 `codebase` 属性不是绝对要求的，但使用它可以简化 JNLP 文件的其他部分，因为\
  \ JNLP 文件中出现的其他 URL 都是相对于 `codebase` 的。\n- **href (in jnlp)**: 指向 JNLP 文件的路径。注意，在示例中我只指定了文件名而不是完整路径。因为\
  \ jnlp 文件位于 `http://www.lowewriter.com/ClickMe/` 文件夹中，此处只需指定文件名。\n- **title**: 提供应用程序的名称——在本例中，“ClickMe”。\n\
  - **vendor**: 提供应用程序供应商的名称——在本例中，“LoweWriter”。\n- **href (in jar)**: 提供应用程序 JAR\
  \ 文件的位置。同样，由于此文件位于 `codebase` 指定的文件夹中，我在这里只需指定文件名。\n- **main-class**: 指向应用程序主类的名称，该类包含了启动应用程序时调用的\
  \ `main` 方法。在这种情况下，主类是 `ClickMe`。\n\n\n\n\n\n# 启动 Java \n\n一旦你创建了描述 Java Web Start\
  \ 应用程序的 JNLP 文件，就可以创建一个 HTML 文件，用户可以通过查看该文件来启动应用程序。该 HTML 文件应该包含指向 JNPL 文件的链接。提供该链接最简单的方法是在\
  \ HTML 文件中使用 `a` 元素，如列表 1-3 所示的 `ClickMe.html` 文件。\n\n### 列表 1-3：一个链接到 JNPL 文件的\
  \ HTML 文件\n\n```html\n<html>\n<head>\n<title>ClickMe (Java Web Start)</title>\n\
  </head>\n<body>\n<h1>ClickMe!</h1>\n<a href=ClickMe.jnlp>Run the ClickMe application</a>\n\
  </body>\n</html>\n```\n\n在列表 1-3 中，`a` 元素提供了必要的链接：\n\n**使用 Java Web Start**\n```html\n\
  <a href-clickme.jnlp>Run the ClickMe application</a>\n```\n\n图 1-2 显示了 `ClickMe.html`\
  \ 文件在浏览器窗口中显示时的外观。\n\n![Image 91](img/index-738_1.png)\n\n**图 1-2：** ClickMe HTML\
  \ 页面。\n\n# 将 Java Web Start 文件上传到 Web 服务器\n\n对于这个简单的 Java Web Start 应用程序，我一共创建了五个文件：\n\
  \n*   `ClickMe.java`：`ClickMe` 应用程序的源代码，如列表 1-1 所示。\n*   `ClickMe.class`：`ClickMe`\
  \ 应用程序的编译类文件，由 Java 编译器创建。\n*   `ClickMe.jar`：包含 `ClickMe` 类的 JAR 文件。该文件将上传到 Web\
  \ 服务器，当用户从网页启动应用程序时，它会被下载到用户的计算机。\n*   `ClickMe.jnlp`：引用 `ClickMe.jar` 文件的 JNLP\
  \ 文件。该文件也将上传到 Web 服务器。\n*   `ClickMe.html`：提供 `ClickMe.jnlp` 文件链接的 HTML 文件。该文件也将上传到\
  \ Web 服务器。\n\nJAR、JNLP 和 HTML 文件都需要上传到你的 Web 服务器，以便用户能够通过浏览器访问它们。你可以使用任何你喜欢的方法上传文件。如果你倾向于使用\
  \ FTP，可以使用 `FileZilla` 等 FTP 客户端来上传文件。如果你的 Web 托管主机提供上传工具，你可以使用它。或者，如果你的 Web 服务器位于自己的网络中（例如，如果是内网服务器），你可以简单地使用操作系统拷贝文件。\n\
  \n无论你如何实现，目标是将 JAR、JNLP 和 HTML 文件放在 Web 服务器上的一个文件夹中。对于 `ClickMe` 应用程序，我将文件上传到了 Web\
  \ 根目录下的 `ClickMe` 文件夹中，因此可以通过 URL `http://www.lowewriter.com/ClickMe/ClickMe.html`\
  \ 访问 HTML 文件。\n\n![Image 92](img/index-739_1.png)\n\n# 使用 Java Web Start 启动 ClickMe\
  \ 应用程序\n\n当所有文件就绪后，Web 用户可以通过打开 Web 浏览器并导航到 HTML 页面的 URL（在示例中为 `http://www.lowewriter.com/ClickMe/ClickMe.html`）来访问\
  \ `ClickMe` 应用程序。参考图 1-2 查看页面在浏览器窗口中的显示。\n\n当用户点击 `Run the ClickMe application`\
  \ 链接时，会显示图 1-3 所示的对话框，询问用户是否想要运行该应用程序。\n\n![Image 93](img/index-740_1.png)\n\n**图\
  \ 1-3：** 用户点击 Java Web Start 链接时显示的安全提示。\n\n假设用户点击运行（Run），随后运行 `ClickMe` 应用程序，如图\
  \ 1-4 所示。\n\n**图 1-4：** 运行中的 ClickMe 应用程序。\n\n# 创建异常以允许 Java 应用程序运行\n\n某些情况下，Java\
  \ 的安全设置可能会阻止 Java 应用程序运行。如果发生这种情况，用户可以通过将应用程序的 URL 添加到 Java 异常列表（Exception List）来解决问题。以下是在\
  \ Windows 计算机执行此操作的步骤：\n\n1. **打开 Java 控制面板。** 最简单的方法是按下开始按钮，输入 `java`，按回车，然后点击配置\
  \ Java。\n2. **点击“Web”选项卡。** 由于你正在更改安全设置，你可能认为需要点击“安全”（Security）选项卡。但异常列表位于“Web”选项卡上，如图\
  \ 6 所示。\n3. **点击“添加”（Add）。** 这会弹出一个文本输入框，你可以在其中输入 URL。\n4. **输入你想添加的网站 URL 并按回车。**\
  \ 在此示例中，输入 `http://www.lowewriter.com`。该 URL 将添加到异常列表中。\n5. **点击“确定”关闭 Java 控制面板。**\
  \ 现在你应该能够通过 Java 运行应用程序了。\n\n![Image 94](img/index-741_1.png) ![Image 95](img/index-741_2.png)\n\
  \n**图 5：** Java 控制面板。\n**图 6：** “Web”选项卡。\n\n# 创建 Servlet\n\nServlet 是今天开发 Web 应用程序最流行的方式之一。许多知名网站都由\
  \ Servlet 驱动，包括 Gmail、Amazon、LinkedIn 和 eBay。在本章中，我将向你介绍基础知识：什么是 Servlet、如何设置你的计算机以编写和测试\
  \ Servlet，以及如何创建一个简单的 Servlet。接下来的两章将在此基础上扩展该主题。\n\n## 理解 Servlet\n\n在理解什么是 Servlet\
  \ 以及它如何工作之前，你需要了解 Web 服务器的工作原理。Web 服务器使用一种称为 `HTTP` 的网络协议向用户发送网页。（`HTTP` 代表超文本传输协议，但测试中不会涉及它。）通过\
  \ `HTTP`，客户端计算机使用统一资源定位符（即 `URL`）请求位于服务器上的文档。`HTTP` 采用 `请求/响应模型`，这意味着客户端（Web 用户）向\
  \ `HTTP` 服务器发送请求，服务器反向客户端发送响应。\n\n基础的 `HTTP` 交互工作如下：\n\n1. 使用运行在客户端计算机上的 Web 浏览器程序指定要访问的文件的\
  \ `URL`。在某些情况下，你实际上输入地址的 `URL`，但大多数情况下点击指定 `URL` 的链接。\n2. 你的 Web 浏览器向 `URL` 指定服务器计算机发送\
  \ `HTTP` 请求消息。请求包含了你想检索的文件名。\n3. 服务器计算机接收文件请求，检索所需的文件，并以 `HTTP` 响应消息的形式将文件传给你。\n\
  4. 浏览器接收文件，解释其中包含的 `HTML`，并在屏幕上显示结果。\n\n关于普通交互最重要的点是它们是静态的。静态静态意味着发送给用户的文件内容始终相同。如果用户连续请求同一个文件\
  \ 20 次，同一个页面就会显示 20 次。\n\n相比之下，Servlet 提供了一种动态内容的方式。`servlet` 是扩展 `javax.servlet.Servlet`\
  \ 类的 Java 程序。`Servlet` 类使程序能够在 Web 服务器上响应用户请求并运行，Servlet 的输出作为 HTML 页面发送回 Web 用户。\n\
  \n\n\n\n关键的第三步是 servlet 与众不同的之处。如果用户指定的 URL 指向的是 servlet 而不是文件，那么第 3 步的操作如下：\n\n\
  **3.** 服务器计算机接收 servlet 请求，找到请求所指示的 Java 程序，运行它，并以 HTTP 响应消息的形式返回程序的输出。\n\n换句话说，服务器不是发送文件的内容，而是发送由\
  \ servlet 程序生成的输出。通常情况下，servlet 程序会生成一些由浏览器显示的 HTML。\n\nServlet 的设计初衷是快速完成工作并结束。每当\
  \ servlet 运行时，它都会处理来自浏览器的一个请求，生成一个发送回浏览器的页面，然后结束。下一次当该用户或任何其他用户再次请求同一个 servlet 时，servlet\
  \ 将再次运行。\n\n722 页 第 7 卷 **Web 编程**\n\n## 使用 Tomcat\n\n遗憾的是，你不能在任何旧的电脑上运行 servlet\
  \ 程序。首先，你必须安装一个名为 `servlet engine`（servlet 引擎）的特殊程序，将你的计算机变成能够运行 servlet 的服务器。最著名的\
  \ servlet 引擎是 Apache Tomcat，你可以从 Apache 软件基金会在 [`tomcat.apache.org/default.htm`](http://tomcat.apache.org/default.htm)\
  \ 免费获取。在本章中，我使用的是 Tomcat 8 版本。\n\n## 创建 Servlet\n\nTomcat 也可以作为一个基础 Web 服务器。在实际生产环境中，Tomcat\
  \ 通常与专门的 Web 服务器（如 Apache 的 HTTP Server）结合使用。\n\n### 安装和配置 Tomcat\n\n安装 Tomcat 并不是什么复杂的科学，但也不像做吐司那样简单。你可以按照以下步骤来设置\
  \ Tomcat 8：\n\n#### 1. [从 Apache 网站下载 Tomcat Zip 文件 (http://tomcat.apache.org/default.htm)](http://tomcat.apache.org/default.htm)。**\n\
  \n尽管 Apache 也提供了一个用于安装 Tomcat 的可执行设置文件，但我建议你下载 Zip 文件。\n\n#### 2. 通过右键点击文件并选择“解压所有”来解压\
  \ Zip 文件的内容；然后指定 c:\\ 为文件的解压位置。\n\n我知道你不想让你的根目录堆满一堆文件，但 Tomcat Zip 文件包含一个名为 `apache-tomcat-8_0_0`\
  \ 的文件夹（版本号可能会有所不同），所以只会创建一个这个文件夹。在解压所有文件后，给这个文件夹重命名一个更容易输入的名称。我建议使用 `c:\\tomcat`\n\
  \n#### 3. 创建一个名为 JAVA_HOME 的环境变量，指向你的 Java 开发工具包 (JDK) 位置。\n\n要创建环境变量，打开控制面板，双击“系统”图标，然后点击“高级系统设置➪环境变量➪新建”，并创建一个名为\
  \ `JAVA_HOME` 的变量。该变量的值需要是你 JDK 安装文件夹的完整路径，例如 `c:\\Program Files\\Java\\jdk-9`。\n\
  \n一个常见的错误是将此变量设置为 `bin` 目录或 Java 运行环境 (JRE) 目录，而不是 JDK。如果以后 Tomcat 没有启动，请双检查 `JAVA_HOME`\
  \ 目录。\n\n723 页 第 2 章节 **创建 Servlet**\n\n![Image 97](img/index-746_1.png)\n\n####\
  \ 4. 将 servlet-api.jar 文件复制到 JDK 根目录下的 jre\\lib\\ext 文件夹。\n\n如果你的 JDK 安装在 `c:\\\
  Program Files\\Java\\jdk-9`，请将此文件复制到 `c:\\Program Files\\Java\\jdk-9\\jre\\lib\\\
  ext`。假设你已将 Tomcat 文件解压到 `c:\\tomcat`，你可以在 `c:\\tomcat\\lib` 中找到 `servlet-api.jar`\
  \ 文件。\n\n如果你跳过这一步或将 `servlet-api.jar` 文件复制到错误的位置，将无法编译你的 servlet 程序。如果你收到编译器信息抱怨\
  \ `javax.servlet` 包不存在，请双检查此步骤以确保你操作正确。\n\n### 启动和停止 Tomcat\n\n安装并配置 Tomcat 后，你可以通过打开命令窗口、切换到\
  \ `c:\\tomcat\\bin` 目录并输入 `startup.` 来启动它。批处理文件运行并启动 Tomcat。当 Tomcat 启动时，它会打开第二个命令窗口，显示各种状态消息。图\
  \ 2-1 显示了状态窗口运行。\n\n**图 2-1：**\n\n正在启动 Tomcat。\n\n当你看到类似下面的行时，说明 Tomcat 已经启动，它指示了启动所需的时间：\n\
  \n```\nINFO: Server startup in 1186 ms\n```\n\n如果 Tomcat 窗口出现几秒钟，然后一条异常消息飞闪而过且窗口关闭，最可能的问题是你系统中已经运行了一个\
  \ Web 服务器，而该服务器已经占用了 Tomcat 想用于 HTTP 通信的端口。该问题的解决方法是编辑 `c:\\tomcat\\conf` 中的 `server.xml`\
  \ 文件，并查找此标签：\n\n```xml\n<Connector port=\"8080\"... />\n```\n\n724 页 第 7 卷 **Web\
  \ 编程**\n\n![Image 98](img/index-747_1.png)\n\n将端口号从 8080 改为其他数字，例如 18080。稍后当你在浏览器窗口中显示\
  \ servlet 时，必须将此数字指定为 HTTP 端口号，而不是 8080。\n\n在修改其中一个配置文件后，你不需要关闭 Tomcat。你可以通过运行 `shutdown`\
  \ 批文件来停止 Tomcat。`c:\\tomcat\\bin` 目录下运行 `startup` 批文件可以再次启动。\n\n## 创建 Servlet\n\n\
  ### 测试 Tomcat\n\n要确定 Tomcat 是否安装正确，打开 Web 浏览器，并输入以下地址：http://localhost:8080（如果你通过编辑\
  \ `server.xml` 修改了端口号，请使用你指定的端口号代替 8080）。\n\n会出现如图 2-2 所示页面。如果没有出现，请参考本章前面的“安装和配置\
  \ Tomcat”部分，并双检查每个步骤以确保操作正确。\n\n**图 2-2：**\n\n测试 Tomcat。\n\n725 页 第 2 章节 **创建 Servlet**\n\
  \n## 创建简单的 Servlet\n\n好了，配置部分结束；现在你可以开始编写代码。接下来的章节将介绍创建简单的 HelloWorld 类型 servlet\
  \ 的基础。\n\n### 导入包\n\n大多数 servlet 需要访问三个包：`javax.servlet`、`javax.servlet.http` 和\
  \ `java.io`。因此，通常从以下导入语句开始：\n\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\
  import javax.servlet.http.*;\n```\n\n根据你的 servlet 执行的其他处理，可能需要额外的导入语句。\n\n### 扩展\
  \ HttpServlet 类\n\n要创建一个 servlet，你需要编写一个扩展 HttpServlet 类。表 2-1 列出了可以在 servlet 类中重写的六个方法。\n\
  \n**表 2-1**\n\n**HttpServlet 类**\n\n| 方法 | 调用时机 | 签名 |\n| :--- | :--- | :--- |\n\
  | doDelete | HTTP DELETE 请求 | `public void doDelete(HttpServletRequest request,\
  \ HttpServletResponse response) throws IOException, ServletException` |\n| doGet\
  \ | HTTP GET 请求 | `public void doGet(HttpServletRequest request, HttpServletResponse\
  \ response) throws IOException, ServletException` |\n| doPost | HTTP POST 请求 | `public\
  \ void doPost(HttpServletRequest request, HttpServletResponse response) throws IOException,\
  \ ServletException` |\n| doPut | HTTP PUT 请求 | `public void doPut(HttpServletRequest\
  \ request, HttpServletResponse response) throws IOException, ServletException` |\n\
  | init() | servlet 首次运行时 | `public void init() throws ServletException` |\n| destroy()\
  \ | servlet 被销毁时 | `public void destroy()` |\n\n726 页 第 7 卷 **Web 编程**\n\n大多数 servlet\
  \ 至少重写了 `doGet` 方法。当用户通过浏览器地址栏输入地址或点击指向该 servlet 的链接请求该 servlet 时，servlet 引擎会调用该方法。\n\
  \n有两个参数被传递给 `doGet` 方法：\n\n\n\n\n\n# 创建 Servlet\n\n- 一个 `HttpServletRequest` 对象，代表来自用户的入站请求。你主要使用\
  \ `request` 参数来获取用户在表单字段中输入的数据。你将在本章稍后的“从用户处获取输入”部分中了解如何进行操作。\n- 一个 `HttpServletResponse`\
  \ 对象，代表发送给用户的响应。你使用 `response` 参数来构建返回给用户的输出内容。你将在下一节中了解如何操作。\n\n## 打印到网页上\n\n大多数\
  \ Servlet 的主要工作之一是编写 HTML 输出，并将其发送回用户的浏览器。要实现这一点，你首先需要调用 `HttpServletResponse` 类的\
  \ `getWriter()` 方法，该方法返回一个与响应对象连接的 `PrintWriter` 对象。因此，你可以使用熟悉的 `print` 和 `println`\
  \ 方法来写入 HTML 文本。\n\n下面是一个简单的 `HelloWorld` Servlet 的 `doGet` 方法示例：\n\n```java\npublic\
  \ void doGet(HttpServletRequest request, HttpServletResponse response)\nthrows IOException,\
  \ ServletException\n{\n    PrintWriter out = response.getWriter();\n    out.println(\"\
  Hello, World!\");\n}\n```\n\n这里，通过 `response.getWriter()` 返回的 `PrintWriter` 对象被用于向浏览器发送一个简单的文本字符串。如果你运行这个\
  \ Servlet，浏览器将显示文本 `Hello, World!`。\n\n## 使用 HTML 响应\n\n在大多数情况下，你并不想向浏览器发送简单的文本。相反，你想要发送格式化的\
  \ HTML。要做到这一点，你必须首先告诉响应对象输出是 HTML 格式的。你可以通过调用 `setContentType()` 方法并将字符串 `\"text/html\"\
  ` 作为参数传递来实现。然后你就可以使用 `PrintWriter` 对象来发送 HTML。\n\n列表 2-1 显示了一个发送 HTML 响应的基础 `HelloWorld`\
  \ Servlet。\n\n### 列表 2-1：HelloWorld Servlet\n\n```java\nimport java.io.*;\nimport\
  \ javax.servlet.*;\nimport javax.servlet.http.*;\nimport java.util.*;\n\npublic\
  \ class HelloWorld extends HttpServlet\n{\n    public void doGet(HttpServletRequest\
  \ request, HttpServletResponse response)\n    throws IOException, ServletException\n\
  \    {\n        response.setContentType(\"text/html\");\n        PrintWriter out\
  \ = response.getWriter();\n        out.println(\"<html>>\");\n        out.println(\"\
  <head>\");\n        out.println(\"<title>HelloWorld</title>\");\n        out.println(\"\
  </head>\");\n        out.println(\"<body>\");\n        out.println(\"<h1>Hello,\
  \ World!</h1>\");\n        out.println(\"</body>\");\n        out.println(\"</html>\"\
  );\n    }\n}\n```\n\n在这里，以下 HTML 将被发送到浏览器（我添加了缩进以显示 HTML 的结构）：\n\n```html\n<html>\n\
  <head>\n    <title>HelloWorld</title>\n</head>\n<body>\n    <h1>Hello, World!</h1>\n\
  </body>\n</html>\n```\n\n运行时，`HelloWorld` Servlet 会产生图 2-3 所示的页面。显然，你对对 HTML 有深入的理解才能编写\
  \ Servlet。如果 HTML 像是一门外语语言，那么在继续学习之前，你需要找一本好的 HTML 书，例如由 Ed Tittel 和 Jeff Noble\
  \ (Wiley) 编写的 *HTML, XHTML, & CSS For Dummies* 第 7 版。\n\n为了方便你参考，表 2-2 总结了我在书中使用的所有\
  \ HTML 标签。\n\n### 表格 2-2：足够使用的的 HTML\n\n| HTML 标签 | 描述 |\n| :--- | :--- |\n| `<html>`,\
  \ `</html>` | 标记 HTML 文档的开始和结束。 |\n| `<head>`, `</head>` | 标记 HTML 文档 head 部分的开始和结束。\
  \ |\n| `<title>`, `</title>` | 标记标题元素。开始和结束标签之间的文本显示在浏览器窗口的标题栏中。 |\n| `<body>`,\
  \ `</body>` | 标记 HTML 文档 body 部分的开始和结束。文档的内容位于这些标签之间。 |\n| `<h1>`, `</h1>` | 将这些标签之间的文本格式化为\
  \ 1 级标题。 |\n| `<h2>`, `</h2>` | 将这些标签之间的文本格式化为 2 级标题。 |\n| `<h3>`, `</h3>` | 将这些标签之间的文本格式化为\
