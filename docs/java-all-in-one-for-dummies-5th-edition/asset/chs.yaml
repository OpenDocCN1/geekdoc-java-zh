  \ 将场景切换到 `scene1`。\n\n### 创建 Alert 框\n\n### 设置舞台与场景布局\n\nJavaFX 通过使用 `Alert` 类提供了一种简单的方法来显示基础消息框，该类类似于你在第二本书的第\
  \ 2 章中学到的 `JOptionPane` 类。\n\n**表格 3-3：Alert 类的常用构造函数和方法**\n\n| 构造函数 | 说明 |\n| :---\
  \ | :--- |\n| `Alert(Alert.AlertType)` | 创建指定类型的类型 alert |\n| `Alert(Alert.AlertType,\
  \ String text)` | 创建指定类型的新 alert 并设置消息文本 |\n| `Alert(Alert.AlertType, String text,\
  \ ButtonType type...)` | 创建新 alert 并设置要显示的按钮 |\n\n| 方法 | 说明 |\n| :--- | :--- |\n\
  | `void setTitle(String text)` | 设置标题 |\n| `Optional<ButtonType> showAndWait()`\
  \ | 显示 alert 并等待用户响应，响应以 `ButtonType` 对象的形式返回 |\n\n下面是使用 `Alert` 类显示简单信息消息的代码片段：\n\
  \n\n\n\n\n```java\nAlert a = new Alert(Alert.AlertType.INFORMATION, \"You have clicked\
  \ once.\");\na.showAndWait();\n```\n\n图 3-2 显示了生成的警框框。\n\n![Image 65](img/index-637_1.png)\n\
  \n**图 3-2:**\n\n一个 Alert 对话框。\n\n你可以通过使用可选的 `ButtonType` 参数来控制 Alert 框上显示哪些按钮。你可以从以下类型的按钮中选择：\n\
  \n- `ButtonType.APPLY`\n- `ButtonType.CANCEL`\n- `ButtonType.CLOSE`\n- `ButtonType.FINISH`\n\
  - `ButtonType.NEXT`\n- `ButtonType.NO`\n- `ButtonType.OK`\n- `ButtonType.PREVIOUS`\n\
  - `ButtonType.YES`\n\n你只需要在构造函数中指定多个 `ButtonType` 参数，就可以在 Alert 框中包含多个按钮。例如：\n\n\
  ```java\nAlert a = new Alert(Alert.AlertType.INFORMATION, \"Are you certain?\",\n\
  ButtonType.YES, ButtonType.NO);\n```\n\n在这个示例中，Alert 框将同时包含 YES 和 NO 按钮。\n\n要确定用户点击了哪个按钮，你必须测试\
  \ `showAndWait` 方法返回的值。该值是一个 `Optional` 类型的对象，因为用户可以在不点击任何显示的按钮的情况下关闭对话框。你应该首先通过调用\
  \ `isPresent` 方法来测试用户是否点击了按钮。然后，你可以调用 `get` 方法来获取实际结果。\n\n# 设置舞台和场景布局\n\n这里是一个判断用户是否点击了\
  \ YES 按钮的示例：\n\n```java\nAlert a = new Alert(Alert.AlertType.INFORMATION, \"Are\
  \ you certain?\",\nButtonType.YES, ButtonType.NO);\nOptional<ButtonType> r = a.showAndWait();\n\
  if (r.isPresent() && r.get() == ButtonType.YES)\n{\n    // 用户点击了 OK！\n}\n```\n\n\
  为了演示如何使用 `Alert` 类，列表 3-2 所示的程序是第 2 章中最初讨论过的 `ClickCounter` 程序的变体。该程序的原始版本显示了一个标签（label）和一个按钮，使用标签显示用户点击按钮的次数。而版本的程序省弃了标签，而是使用\
  \ `Alert` 类来显示一条消息，指示用户点击按钮的次数。\n\n### 列表 3-2：ClickCounterAlert 程序\n\n```java\n\
  import javafx.application.*;\nimport javafx.stage.*;\nimport javafx.scene.*;\nimport\
  \ javafx.scene.layout.*;\nimport javafx.scene.control.*;\n\npublic class ClickCounterAlert\
  \ extends Application\n{\n    public static void main(String[] args)\n    {\n  \
  \      launch(args);\n    }\n\n    Button btn;\n    Label lbl;\n    int iClickCount\
  \ = 0;\n\n    @Override public void start(Stage primaryStage)\n    {\n        //\
  \ 创建按钮\n        btn = new Button();\n        btn.setText(\"Click me please!\");\n\
  \        btn.setOnAction(e -> buttonClick());\n\n        // 将按钮添加到布局窗格\n       \
  \ BorderPane pane = new BorderPane();\n        pane.setCenter(btn);\n\n        //\
  \ 将布局窗格添加到场景\n        Scene scene = new Scene(pane, 250, 150);\n\n        // 将场景添加到阶段，设置标题\n\
  \        // 并显示阶段\n        primaryStage.setScene(scene);\n        primaryStage.setTitle(\"\
  Click Counter\");\n        primaryStage.show();\n    }\n\n    public void buttonClick()\n\
  \    {\n        iClickCount++;\n        if (iClickCount == 1)\n        {\n     \
  \       Alert a = new Alert(Alert.AlertType.INFORMATION, \"You have clicked once.\"\
  );\n            a.showAndWait();\n        }\n        else\n        {\n         \
  \   Alert a = new Alert(Alert.AlertType.INFORMATION, \"You have clicked \" + iClickCount\
  \ + \" times.\");\n            a.showAndWait();\n        }\n    }\n}\n```\n\n该程序与第\
  \ 2 章中介绍的版本（列表 2-2）几乎完全相同。事实上，这里只有两处不同：\n\n- 此程序中没有定义标签，因为使用了消息框而不是标签来显示按钮被点击的次数。\n\
  - 在第 2 章版本的 `buttonClick` 方法中，调用了标签的 `setText` 方法来显示按钮被点击的次数。而在这一版本中，使用的是一个 Alert\
  \ 框。\n\n图 3-2 显示了 ClickCounter 程序新版本的运行情况。在这里，你可以看到用户第一次点击按钮时显示的警框框。（在这个示例中，我将消息框向侧移动了一点，以便你可以看到它下方的主阶段。当你实际运行程序时，消息框将居于主阶段正上方。）\n\
  \n## 退出，舞台右侧\n\n由于我在本章的开头引用了莎士比亚，我想通过引用 Snagglepuss（老版 Hanna-Barbera 动画片中著名的粉红山狮）来结束本章会很不错。他经常通过说“从舞台左侧退出”（Exit,\
  \ stage left）或“从舞台右侧退出”（Exit, stage right）来离开场景。\n\n天哪 Mergatroyd！\n\n甚至退出舞台也有正确的方法和错误的方法。到目前为止，此书中介绍的所有程序没有一个是以正确的方式退出的。在大多数情况下，退出程序的正确方法涉及以下内容：\n\
  \n- 添加一个按钮、菜单命令或其他方式让用户发出想要关闭程序的信号。\n- 可选地显示一个确认框，验证用户是否真的想关闭程序。\n- 如果用户确实想关闭程序，程序应该执行必要的清理工作，例如：\n\
  \    - 保存文档、数据库的更改。\n    - 正确关闭数据库和其他资源。\n- 在完成所有必要的清理工作后，调用主阶段的 `close` 方法关闭应用程序。\n\
  - 无论用户是使用你提供的用户界面中的按钮或菜单命令，还是点击内置的窗口关闭按钮尝试关闭程序，都应该采取验证和清理步骤。\n\n### 创建按钮\n\n要添加一个允许用户关闭的按钮或其他用户界面元素，你只需要提供一个调用阶段\
  \ `close` 方法的动作事件处理器即可。\n\n例如，假设你使用以下代码创建一个关闭按钮：\n\n```java\nButton btnClose = new\
  \ Button();\nbtnClose.setText(\"Close\");\nbtnClose.setOnAction(e -> primaryStage.close());\n\
  ```\n\n在这种情况下，事件处理器只需调用 `primaryStage.close()` 来关闭应用程序。\n\n如果你想在事件处理器中执行的操作不仅仅是调用\
  \ `close` 方法，你可能希望将事件处理器隔离在单独的方法中，如下例所示：\n\n```java\nbtnClose.setOnAction(e -> btnClose_Clicked());\n\
  ```\n\n因为 `btnClose_Clicked` 方法需要访问主阶段来关闭它，你定义定义一个 `Stage` 类型的类字段并使用它来引用主阶段。这样，你的\
  \ `btnClose_Clicked` 方法就可以轻松地执行额外的任务。例如：\n\n```java\nprivate void btnClose_Click()\n\
  {\n    boolean reallyQuit = false;\n    reallyQuit = ConfirmationBox.show(\n   \
  \     \"Are you sure you want to quit?\",\n        \"Confirmation\",\n        \"\
  Yes\", \"No\");\n    if (reallyQuit)\n    {\n```\n\n\n\n\n\n```java\n// 在此处执行清理任务\n\
  \n// 例如保存文件或释放资源\n\nstage.close();\n\n}\n\n}\n```\n\n# 莎士比亚最伟大的舞台指示\n\n到本章为止，我引用了一次威廉·莎士比亚和了一次斯纳格·普斯（Snagglepuss）。\n\
  \n这两处引用都适用于本章的主题：来自《亨利五世》的莎士比亚式引用指的是舞台和场景，而斯纳格·普斯的引用指的是离开舞台的正确方式。尽管如此，引用斯纳格普斯的频率如果和莎士比亚一样高，似乎有些失衡。因此，我认为最好再加入一段莎士比亚的引用，以挽回我的大学英语教授们对我可能仍存的一丝尊重。\n\
  \n莎士比亚的剧剧中大量分布着舞台指示。其中大多数非常简短，例如《罗密欧与朱丽叶》中的 `Enter Tybalt`（泰巴特上场）或 `Exit Romeo`（罗密欧退出）。有些则详细一些，例如同样来自《罗密欧与朱丽叶》的\
  \ `Enter several of both houses, who join the fray,`（双方若干人上场，加入混战）。有时它们也有些模糊，例如来自《提图斯·安德洛尼》的\
  \ `Enter a messenger with two heads and a hand`（一个两个头和一个手的信使上场）。\n\n但我看来，莎士比亚所有舞台指示中最有趣的发现于《冬日传说》中，当安提戈尼斯在船难后被阻止救援佩尔迪塔时：`Exit,\
  \ pursued by a bear.`（退出，身后被一只熊追逐）。\n\n当你离开舞台时，因为被一只熊追逐，你没法收拾物品，无法完成你设定的任何其他重要任务，例如拯救公主或保存用户对文档所做的重要更改。相反，你只能转身逃跑，这正是用户点击窗口关闭按钮时（除非你正确处理了\
  \ `CloseRequest` 事件）会发生的情况。\n\n在这个示例中，将显示一个确认框以确保用户确实想退出程序。\n\n## 处理 CloseRequest\
  \ 事件\n\n提供一个“关闭”按钮是允许用户干净退出程序的极佳方法。然而，用户可以通过简单的关闭窗口来绕过你的退出处理——即点击窗口关闭按钮（通常表示为窗口框右上角的\
  \ X）。除非你另有说明，否则点击此按钮将不礼貌地终止应用程序，绕过你所有用于确认用户是否想保存工作、关闭任何已打开资源以及提供优雅退出的优美代码。\n\n幸运的是，你可以轻松地避免这种不优雅的退出。每当用户尝试关闭显示\
  \ JavaFX stage 的窗口时，JavaFX 都会生成一个 `CloseRequest` 事件并发送到 stage。你可以通过调用 `Stage` 类的\
  \ `setOnCloseRequest` 方法为该事件提供一个事件处理程序。然后，每当用户尝试关闭窗口时，该事件处理器就会被调用。\n\n你可能想创建一个单一方法，同时作为“关闭”按钮的\
  \ `Action` 事件和 `CloseRequest` 事件的事件处理器，如下所示：\n\n```java\nbtnClose.setText(\"Close\"\
  );\nbtnClose.setOnAction( e -> btnClose_Click () );\nprimaryStage.setOnCloseRequest(\
  \ e -> btnClose_Click () );\n```\n\n在这里，意图是处理 `CloseRequest` 事件的方式完全就像用户点击了 `btnClose`\
  \ 按钮一样。\n\n这是一个好主意，但如果 `btnClose_Click` 事件显示确认框，并且仅在用户确认其确实想退出程序时才关闭 stage，那么它就不起作用。这是因为当\
  \ `CloseRequest` 事件的事件处理器结束时，如果处理器没有显式关闭 stage，JavaFX 会自动关闭它。\n\n为了防止这种情况发生，你必须调用\
  \ `CloseRequest` 事件对象的 `consume` 方法。消费（Consume）事件会导致它在事件处理器内部停止，从而防止 JavaFX 在处理器结束时自动关闭\
  \ stage。\n\n## 设置舞台和场景布局\n\n在传递给 `setOnCloseRequest` 方法的 Lambda 表达式中，`CloseRequest`\
  \ 事件对象由参数 `e` 表示。因此，你可以通过 `e.consume()` 来消费 `CloseRequest` 事件。\n\n提供一个同时处理“关闭”按钮的\
  \ `Action` 事件和 stage 的 `CloseRequest` 事件方法的简单方法，是为 `setOnCloseRequest` 方法构建一个 Lambda\
  \ 表达式，使其在调用处理事件的方法之前先消费该事件：\n\n```java\nbtnClose.setText(\"Close\");\nbtnClose.setOnAction(\
  \ e -> btnClose_Click () );\nprimaryStage.setOnCloseRequest(\ne -> {\n    e.consume();\n\
  \    btnClose_Click ();\n} );\n```\n\n在这里，`CloseRequest` 事件的事件处理器首先消费事件，然后调用 `btnClose_Click`。随后，`btnClose_Click`\
  \ 方法会显示确认框，并在用户确认这确实是他们想做的事后关闭 stage。\n\n## 整合一切\n\n现在你已经了解了如何向场景添加“关闭”按钮，以及如何处理\
  \ `CloseRequest` 事件，我将查看一个结合了这两个元素的程序，以演示退出 JavaFX 程序的正确方法。\n\n本节介绍了 `ClickCounter`\
  \ 程序的一个变体，除了“点击我！”按钮外还包含一个“关闭”按钮。当用户点击“点击我！”按钮时，会显示消息框以指示按钮被点击的次数。但当用户尝试退出程序时（无论是点击“关闭”按钮还是直接关闭窗口），将使用列表\
  \ 3-3 显示的 `ConfirmationBox` 类询问用户是否真的想退出程序。然后，只有当用户点击确认框中的“是”按钮时，stage 才会关闭。\n\n\
  该程序的源码见列表 3-3。\n\n### 列表 3-3:\n**ClickCounter 程序**\n\n```java\nimport javafx.application.*;\n\
  import javafx.stage.*;\nimport javafx.scene.*;\nimport javafx.scene.layout.*;\n\
  import javafx.scene.control.*;\nimport javafx.geometry.*;\nimport java.util.*;\n\
  \npublic class ClickCounter extends Application\n{\n    public static void main(String[]\
  \ args)\n    {\n        launch(args);\n    }\n\n    Stage stage;\n    int iClickCount\
  \ = 0;\n\n    @Override public void start(Stage primaryStage)\n    {\n        stage\
  \ = primaryStage;\n        // 创建点击我按钮\n        Button btnClickMe = new Button();\n\
  \        btnClickMe.setText(\"Click me!\");\n        btnClickMe.setOnAction(e ->\
  \ btnClickMe_Click());\n\n        // 创建关闭按钮\n        Button btnClose = new Button();\n\
  \        btnClose.setText(\"Close\");\n        btnClose.setOnAction(e -> btnClose_Click());\n\
  \n        // 将按钮添加到布局面板\n        VBox pane = new VBox(10);\n        pane.getChildren().addAll(btnClickMe,\
  \ btnClose);\n        pane.setAlignment(Pos.CENTER);\n\n        // 将布局面板添加到场景\n\
  \        Scene scene = new Scene(pane, 250, 150);\n        // 完成并显示阶段\n        primaryStage.setScene(scene);\n\
  \        primaryStage.setTitle(\"Click Counter\");\n        primaryStage.setOnCloseRequest(\
  \ e -> {\n            e.consume();\n            // 设置舞台和场景布局\n            btnClose_Click();\n\
  \        } );\n        primaryStage.show();\n    }\n\n    // (继续)\n    public void\
  \ btnClickMe_Click()\n    {\n        iClickCount++;\n        if (iClickCount ==\
  \ 1)\n        {\n            Alert a = new Alert(Alert.AlertType.INFORMATION, \"\
  You have clicked once.\" );\n            a.showAndWait();\n        }\n        else\n\
  \        {\n            Alert a = new Alert(Alert.AlertType.INFORMATION, \"You have\
  \ clicked \"\n            + iClickCount + \" times.\");\n            a.showAndWait();\n\
  \        }\n    }\n\n    public void btnClose_Click()\n    {\n        Alert a =\
  \ new Alert(Alert.AlertType.CONFIRMATION,\n        \"Are you sure you want to quit?\"\
  ,\n        ButtonType.YES, ButtonType.NO);\n        Optional<ButtonType> confirm\
  \ = a.showAndWait();\n        if (confirm.isPresent() && confirm.get() == ButtonType.YES)\n\
  \        {\n            stage.close();\n        }\n    }\n}\n```\n\n\n\n\n\n# 尝试调整布局面板中节点间距的各种选项\n\
  \n## 第 4 章：使用布局面板排列场景\n\n调整场景中组件的布局通常是 JavaFX 开发中最困难的方面之一。事实上，有时这甚至让人感到非常抓狂。很多时候，这些组件似乎有自己的想法。它们变得非常固执，拒绝移动。当你想要让它们并排排列时，它们却会堆叠在一起。当你对标签或文本字段进行微小的更改时，整个场景似乎又重新排列了。有时，你真想一拳砸穿显示器。\n\
  \n我不建议你拳穿显示器。那样你会弄得一团糟，割伤手，还要花钱买一个新显示器——而且当你修好电脑后，那些组件*仍然*不会按照你想要的方式对齐。\n\n问题不在于组件，而在于布局面板，它们决定了每个组件在它的框架或面板中出现的位置。布局面板是特殊的类，其人生的唯一目的就是控制场景中出现节点的布局。JavaFX\
  \ 提供了几种不同类型的布局面板；每种类型都使用不同的方法来控制节点的布局。成功布局场景的秘诀在于正确组合使用布局面板，来实现你想要的排列方式。\n\n## 使用布局面板\n\
  \n理解布局面板是创建美观且实用的 JavaFX 框架的关键。\n\n### 介绍 JavaFX 布局面板\n\nJavaFX 提供了许多不同的布局面板供你使用。在本章中我介绍了以下五种：\n\
  \n- **HBox**: 这种布局面板水平排列节点，一个接一个。你用它来创建整齐行排列的控件。\n- **VBox**: 这种布局面板垂直排列节点，一个在上在上。你用它来创建整齐列排列的控件。\n\
  - **FlowPane**: 这种布局面板相邻排列节点，直到空间用尽；然后它会换行继续布局节点。你可以配置 `FlowPane` 以水平行或垂直列的形式排列节点。\n\
  - **Border**: 这种布局面板将面板分为五个区域：顶部（Top）、左侧（Left）、中间（Center）、右侧（Right）和底部（Bottom）。添加节点时，你可以指定你想将节点放置在哪个区域。\n\
  - **GridPane**: 这种布局面板将面板划分为网格，让你对行和列中的元素排列拥有完全控制。\n\n为了让你对前四种布局类型可以实现的结果有一个大致的概念，图\
  \ 4-1 显示了四个各使用一种布局面板的示例窗口。你将在本章稍后的部分看到 `GridPane` 布局如何工作的详细示例。\n\n#### 创建布局面板\n\n\
  使用布局面板的基本过程非常简单。以下是创建布局节点的通用步骤：\n\n1. **创建你想添加到面板的控件或其他节点。**\n   例如，如果布局面板将包含两个按钮，那么你应该使用类似下面的代码创建这两个按钮：\n\
  \n```\nButton btnOK = new Button();\nbtnOK.setText(\"OK\");\nbtnOK.setOnAction(\
  \ e -> btnOK_Click() );\n\nButton btnCancel = new Button();\nbtnCancel.setText(\"\
  Cancel\");\nbtnCancel.setOnAction( e -> btnCancel_Click() );\n```\n\n2. **通过调用构造函数创建布局面板。**\n\
  \   例如：\n```\nHBox pane = new HBox();\n```\n\n3. **对布局面板使用的可选设置进行微调。**\n   每种类型的布局面板都有一组独特的可选参数，控制节点在面板内布局的细节。例如，`HBox`\
  \ 面板允许你设置分离面板中每个节点的像素数。你可以按照如下方式设置此值：\n```\nHBox.setSpacing(10);\n```\n\n4. **添加将出现在布局面板中的每个节点。**\n\
  \   每种类型的布局面板都提供向面板添加节点的方法。对于 `HBox` 面板，你必须先调用 `getChildren()` 方法获取已添加到面板的所有节点列表。然后，你调用\
  \ `addAll()` 方法向面板添加一个或多个节点。例如：\n```\npane.getChildren().addAll(btnOK, btnCancel);\n\
  ```\n\n5. **创建场景，并将布局面板指定为场景的根节点。**\n   例如：\n```\nScene scene = new Scene(pane,\
  \ 300, 400);\n```\n在此示例中，`pane` 被添加 `scene` 的根节点。\n\n### 组合布局面板\n\n你可以组合多个布局面板来创建比单个布局面板提供的更复杂的布局。例如，假设你想创建一个底部有一行水平按钮、右侧有一列垂直按钮的布局。要做到这一点，你可以为底部的按钮创建一个\
  \ `HBox`，并为右侧的按钮创建一个 `VBox`。然后，你可以创建一个 `BorderPane`，并将 `HBox` 添加到底部，将 `VBox` 添加到右侧。这种组合是可能的，因为布局面板继承了类\
  \ `javafx.scene.layout.Pane`。换句话说，所有的面板都是节点。你可以根据需要深度嵌套布局面板，以实现应用程序所需的精确布局。\n\n\
  ### 使用 HBox 布局\n\n`HBox` 类提供了 JavaFX 所有布局管理器中最简单的一种：它将一个或多个节点排列成水平行。表 4-1 展示了 `HBox`\
  \ 类最常用的构造函数和方法。\n\n`HBox` 类定义在 `javafx.scene.layout` 包中，因此在任何使用 `HBox` 的程序中应包含以下导入语句：\n\
  ```\nimport javafx.scene.layout.*;\n```\n\n创建 `HBox` 最简单的方法是先创建你想放在 `HBox` 中的节点，然后调用\
  \ `HBox` 构造函数并将节点作为参数传递。例如：\n```\nButton btn1 = new Button(\"Button One\");\nButton\
  \ btn2 = new Button(\"Button Two\");\nButton btn3 = new Button(\"Button Three\"\
  );\nHBox hbox = new HBox(btn1, btn2, btn3);\n```\n\n\n\n\n\n### `setPadding`\n设置\
  \ `Hbox` 内部边缘的内边距。\n\n`(Insets value)`\n\n请参见表 4-2 获取 `Insets` 类的构造函数。\n\n更多信息，请参阅本章节后面的“留间距”（Spacing\
  \ Things Out）节。\n\n### `setSpacing`\n设置 `HBox` 内部显示节点之间的间距。\n\n`(double value)`\n\
  \n更多信息，请参阅本章节后面的“留间距”（Spacing Things Out）节。\n\n# 第 4 章：使用布局面板排列你的场景\n\n如果你希望在空状态下创建\
  \ `HBox` 控件，稍后再添加控件，可以这样做：\n\n```java\nHBox hbox = new HBox();\nhbox.getChildren().addAll(btn1,\
  \ btn2, btn3);\n```\n\n在这里，调用了 `getChildren` 方法，它返回一个包含添加到 `HBox` 面板的所有子节点的集合。该集合由\
  \ `ObservableList` 类定义，它包含一个名为 `addAll` 的方法，你可以用它向列表添加一个或多个节点。\n\n## 留间距\n\n默认情况下，布局面板中的子节点紧挨排列，之间没有任何空隙。如果你想在面板节点之间留出空间，可以通过四种方式：\n\
  \n- 在面板内的元素之间添加间距\n- 在面板的内部边缘添加内边距\n- 为面板中的单个节点添加外边距\n- 创建可以增长以填充可用空间的占位符节点（spacer\
  \ nodes）\n\n在本节中，我将向你如何向面板添加间距和内边距。接下来的三三节将向你展示如何使用另外两种技术。\n\n注意，尽管我在这些节中使用 `HBox`\
  \ 布局面板来演示这些技术，但这些技术也适用于其他类型的面板。\n\n要设置 `HBox` 面板的间距，可以使用 `HBox` 构造函数上的 `spacing`\
  \ 参数，或者调用 `setSpacing` 方法。例如，此语句创建一个默认间距为 10 像素的 `HBox`面板：\n\n```java\nHBox hbox\
  \ = new HBox(10);\n```\n\n此示例创建了一个具有 10 像素间距的 `HBox` 面板并添加了三个按钮：\n\n```java\nHBox\
  \ hbox = new HBox(10, btn1, btn2, btn3);\n```\n\n而此示例使用默认构造函数创建一个 `HBox` 面板，然后调用\
  \ `setSpacing` 方法将间距设为 10 像素：\n\n```java\nHBox hbox = new HBox();\nhbox.setSpacing(10);\n\
  ```\n\n虽然间距会在 `HBox` 面板的节点之间添加空间，但它并不会在节点与面板边缘之间提供任何空间。例如，如果你将间距设置为 10 像素并向面板添加三个按钮，那么这三个按钮之间将会有\
  \ 10 像素的间隙。然而，在第一个按钮的左边缘与面板本身的左边缘之间将没有任何空间。按钮顶部与面板顶部之间也不会有任何空间。换句话说，这三个按钮将紧密地挤在面板中。\n\
  \n要向布局面板的周边缘添加空间，请使用 `setPadding` 方法。该方法接受一个 `Insets` 类型的对象作为参数，该对象代表对象顶、右、底和左边缘的内边距大小（像素为单位）。你可以使用表\
  \ 4-2 中列出的两个构造函数之一来创建 `Insets` 对象。第一个为对象的四个边缘提供均匀的内边距；第二个允许为每个边缘设置不同的内边距值。\n\n要将内边距设置为均匀的\
  \ 10 像素，可以这样调用 `setPadding` 方法：\n\n```java\nhbox.setPadding(new Insets(10));\n```\n\
  \n要为每个边缘设置不同的内边距值，可以这样调用：\n\n```java\nhbox.setPadding(new Insets(20, 10, 20, 10));\n\
  ```\n\n在此示例中，顶部和底部内边距设置为 20，右侧和左侧内边距设置为 10。\n\n### 表 4-2：Insets 构造函数\n\n| 构造函数 |\
  \ 描述 |\n| :--- | :--- |\n| `Insets(double value)` | 创建 `Insets` 对象，顶、右、底、左边边距使用相同的值。\
  \ |\n| `Insets(double top, double right, double bottom, double left)` | 创建 `Insets`\
  \ 对象，使用指定的顶、右、底、左边边距。 |\n\n`Insets` 枚举定义在 `javafx.geometry` 包中，因此在任何使用 `Insets`\
  \ 的程序中，你都应该包含以下导入语句：\n\n```java\nimport javafx.geometry.*;\n```\n\n## 使用外边距添加空间\n\
  \n在布局面板的节点周围添加空间的另一种方法是在单个节点周围创建外边距。这种技术允许你为布局面板中的每个节点设置不同的外边距大小，让你对每个节点的间距拥有完全控制。\n\
  \n要创建外边距，请为你每个想要添加外边距的节点调用 `setMargin` 方法。你可能认为，因为每个节点都可以有自己的外边距，所以 `setMargin`\
  \ 方法属于 `Node` 类。相反，`setMargin` 方法是由 `HBox` 类定义的。`setMargin` 方法接受两个参数：\n\n- 你想要为其添加外边距的节点\n\
  - 定义你想要添加的外边距的 `Insets` 对象\n\n这是一个为名为 `btn1` 的按钮的所有边设置 10 像素外边距的示例：\n\n```java\n\
  HBox hbox = new HBox();\nhbox.setMargin(btn1, new Insets(10));\n```\n\n`setMargin`\
  \ 是 `HBox` 的静态方法，所以当你调用它时，可以引用 `HBox` 类本身而不是 `HBox` 实例。因此，以下代码同样有效：\n\n```java\n\
  HBox.setMargin(btn1, new Insets(10));\n```\n\n（是的，有一个细微的区别：在第一个示例中，`hbox` 指向 `HBox`\
  \ 的实例；在第二个示例中，`HBox` 指向类本身。）\n\n这是一个为面板每个侧设置不同外边距的示例：\n\n```java\nHBox.setMargin(btn1,\
  \ new Insets(10, 15, 20, 10));\n```\n\n在此示例中，顶部外边距为 10 像素，右侧为 15 像素，底部为 20 像素，左侧为\
  \ 10 像素。\n\n注意，外边距、间距和内边距可以共同工作。因此，如果你为两个按钮的四个边都设置 5 像素的外边距，并将这两个按钮添加到一个间距设置为 10\
  \ 像素且内边距设置为 10 像素的面板中，它们之间将相隔 20 像素，与边缘将相隔 15 像素。\n\n## 通过节点增长添加空间\n\n在 `HBox` 中节点之间添加空间的第三种方法是创建一个专门用于两个节点之间空间的节点。然后，你可以配置该占位符节点以增长并填充可用空间。通过只配置占位符节点而不配置其他节点，只有占位符会增长。这样做的效果是将占位符两侧的节点推开。\n\
  \n例如，假设你想创建一个包含三个按钮的 `HBox` 布局面板。与其均匀地排列这三个按钮，你希望前两个按钮出现在面板左侧，第三个按钮出现在面板右侧。第二个和第三个按钮之间的空间完全取决于面板的大小。因此，如果用户拖动窗口扩大舞台，第二个和第三个按钮之间的空间应该相应增加。\n\
  \n创建占位符节点简单的方法是使用 `Region` 类。`Region` 类是 `Control` 类的基类，`Button` 和 `Label` 等控件派自于。它也是\
  \ `Pane` 类的基类，本章描述的所有布局面板都派自它。\n\n对于我这里的用途，我只需使用 `Region` 类的默认构造函数创建一个在布局面板中作为简单占位符的节点。我没有为区域提供特定的大小。相反，我配置它在水平方向上增长以填充其容器内的任何可用空间。\n\
  \n要做到这一点，你使用 `HBox` 类的静态方法 `setHgrow`，指定其中之一\n\n\n\n\n\n由名为 `Priority` 的枚举类型定义了三个常量值。表\
  \ 4-3 列出了这些常量并解释了每个常量的作用。\n\n### 表 4-3：Priority 枚举\n\n| 常量 | 描述 |\n| :--- | :---\
  \ |\n| `Priority.NEVER` | 表示不应调整节点的宽度以填充窗格中的可用空间。这是默认设置。因此，在默认情况下，节点**不会*根据包含它们的布局窗格的大小进行调整大小。\
  \ |\n| `Priority.ALWAYS` | 表示如果有必要，节点的宽度应该始终调整以填充窗格中的可用空间。如果你将两个或多个节点设置为 `ALWAYS`，则调整间隙将平均分配给每个节点。\
  \ |\n| `Priority.SOMETIMES` | 表示如果有必要，节点的宽度可能会调整以填充窗格。然而，只有在没有其他指定为 `ALWAYS` 的节点时，才会进行调整。\
  \ |\n\n## 第 4 章：使用布局窗格安排你的场景\n\n`Priority` 枚举定义在 `javafx.scene.layout` 包中；该包也定义了需要它的布局管理器。因此，在使用\
  \ `Priority` 枚举时，你不需要包含额外的导入语句。\n\n以下示例创建了三个按钮和一个间距器，将三个按钮的边距设置为 10 像素，然后将这三个按钮和间距器添加到\
  \ `HBox` 中，使得前两个按钮显示在 `HBox` 的左侧，第三个按钮显示在右侧：\n\n```java\n// 创建按钮\nButton btn1 =\
  \ new Button(\"One\");\nButton btn2 = new Button(\"Two\");\nButton btn3 = new Button(\"\
  Three\");\n\n// 创建间距器\nRegion spacer = new Region();\n\n// 设置边距\nhBox.setMargin(btn1,\
  \ new Insets(10));\nhBox.setMargin(btn2, new Insets(10));\nhBox.setMargin(btn3,\
  \ new Insets(10));\n\n// 为间距器设置 Hgrow\nhBox.setHgrow(spacer, Priority.ALWAYS);\n\
  \n// 创建 HBox 布局窗格\nHBox hbox = new HBox(10, btn1, btn2, spacer, btn3);\n```\n\n\
  图 4-2 显示了该窗格在添加到阶段（stage）时的外观。为了让你看到间距器是如何工作的，第一幅图显示了窗格的三种形态，每个窗口都被拖动到了不同的大小。注意第二个和第三个按钮之间的间距是如何自动调整的，使得前两个按钮位于窗格左侧，第三个位于右侧。\n\
  \n与 `setMargin` 方法一样，`setHgrow` 方法是 `HBox` 类的静态方法。因此，你可以从 `HBox` 实例调用它（如前面的示例所示），也可以从\
  \ `HBox` 类本身调用它。换句话说，以下代码段中的后两行是多余的：\n\n```java\nHBox pane = new HBox();\npane.setHgrow(spacer,\
  \ Priority.ALWAYS);\nHBOX.setHgrow(spacer, Priority.ALWAYS);\n```\n\n![Image 68](img/index-657_1.png)\n\
  **图 4-2：** 使用间距器节点在 HBox 窗格中分隔按钮。\n\n## 使用 VBox 布局\n\n`VBox` 类与 `HBox` 类类似，但它不是在行中水平排列节点，而是在列中垂直排列节点。表\
  \ 4-4 显示了 `VBox` 类最常用的构造函数和方法。\n\n`VBox` 类定义在 `javafx.scene.layout` 包中，因此在任何使用 `VBox`\
  \ 的程序中，都应该包含以下导入语句：\n\n```java\nimport javafx.scene.layout.*;\n```\n\n这是一个创建三个按钮并使用\
  \ `VBox` 将它们排列成一列的示例：\n\n```java\nButton btn1 = new Button(\"Button One\");\nButton\
  \ btn2 = new Button(\"Button Two\");\nButton btn3 = new Button(\"Button Three\"\
  );\nVBox vbox = new VBox(btn1, btn2, btn3);\n```\n\n你可以通过使用默认构造函数并调用 `getChildren`\
  \ 方法来实现相同的功能，此示例所示：\n\n```java\nVBox vbox = new VBox();\nVbox.getChildren().addAll(btn1,\
  \ btn2, btn3);\n```\n\n### 表 4-4：VBox 构造函数和方法\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n\
  | `VBox()` | 创建一个空的 VBox。 |\n| `VBox(double spacing)` | 创建一个具有指定间距的空 VBox。 |\n|\
  \ `VBox(Node... children)` | 创建一个带有指定子节点的 VBox。此构造函数允许你同时创建一个 VBox 并向其添加子节点。 |\n\
  | `VBox(double spacing, Node... children)` | 创建一个具有指定间距和子节点的 VBox。 |\n\n| 方法 | 描述\
  \ |\n| :--- | :--- |\n| `ObservableList<Node>` | 返回已添加到 VBox 的 `getChildren()` 中的所有子节点集合。该集合以\
  \ `ObservableList` 类型返回，该类型包含 `addAll` 方法，允许你向列表添加一个或多个节点。 |\n| `static void setAlignment(Pos\
  \ alignment)` | 设置 HBox 内部子节点的对齐方式。请參参见表 4-5 对 `Pos` 枚举的解释。更多信息请参阅本章节后面的“在布局窗格中排列节点”部分。\
  \ |\n| `static void setMargin(Node child, Insets value)` | 设置指定节点的边距。 |\n| `void\
  \ setPadding(Insets value)` | 设置 VBox 内部的内边距。 |\n| `static void setVgrow(Node child,\
  \ Priority priority)` | 设置指定节点的增长行为。 |\n\n与 `HBox` 类一样，你可以使用间距、内边距、边距和间距器来控制 VBox\
  \ 内部的间距。这是一个示例：\n\n```java\nButton btn1 = new Button(\"One\");\nButton btn2 = new\
  \ Button(\"Two\");\nButton btn3 = new Button(\"Three\");\n\n// 创建间距器\nRegion spacer\
  \ = new Region();\n\n// 为间距器设置 Vgrow\nVBox.setVgrow(spacer, Priority.ALWAYS);\n\n\
  // 创建 VBox 布局窗格\nVBox vbox = new VBox(10, btn1, btn2, spacer, btn3);\nvbox.setPadding(new\
  \ Insets(10));\n```\n\n## 在布局窗格中排列节点\n\n`HBox` 和 `VBox` 布局窗格都有 `setAlignment` 方法，用于控制窗格内节点相互对齐。`setAlignment`\
  \ 方法接受单个参数，即 `Pos` 枚举定义的常量，见表 4-5。\n\n`Pos` 枚举定义在 `javafx.geometry` 包中，因此在任何使用 `Insets`\
  \ 的程序中，都应该包含以下导入语句：\n\n```java\nimport javafx.geometry.*;\n```\n\n以下示例展示了如何创建一个在窗格内居中的三个按钮垂直列：\n\
  \n```java\nButton btn1 = new Button(\"Number One\");\nButton btn2 = new Button(\"\
  Two\");\nButton btn3 = new Button(\"The Third Button\");\nVBox vbox = new VBox(10,\
  \ btn1, btn2, btn3);\nvbox.setPadding(new Insets(10));\nvbox.setAlignment(Pos.CENTERED);\n\
  ```\n\n### 表 4-5：Pos 枚举\n\n| 常量 | 垂直对齐 | 水平对齐 |\n| :--- | :--- | :--- |\n| `Pos.TOP_LEFT`\
  \ | Top | Left |\n| `Pos.TOP_CENTER` | Top | Center |\n| `Pos.TOP_RIGHT` | Top |\
  \ Right |\n| `Pos.CENTER_LEFT` | Center | Left |\n| `Pos.CENTER` | Center | Center\
  \ |\n| `Pos.CENTER_RIGHT` | Center | Right |\n| `Pos.BOTTOM_LEFT` | Bottom | Left\
  \ |\n| `Pos.BOTTOM_CENTER` | Bottom | Center |\n| `Pos.BOTTOM_RIGHT` | Bottom |\
  \ Right |\n| `Pos.BASELINE_LEFT` | Baseline | Left |\n\n\n\n\n\n`Pos.BASELINE_CENTER`\n\
  基线居中\n\n`Pos.BASELINE_RIGHT`\n基线右对\n\n当此窗格被添加到场景并在舞台中显示时，结果类似于图 4-3 所示的窗口。\n\n**图\
  \ 4-3：**\n在 VBox 布局窗格中居中的三个按钮。\n\n## 使节点具有相同的宽度\n\n当你在布局窗格中放置一组按钮或其他控件时，你可能希望所有按钮具有相同的宽度，以创建整洁、均匀的外观。当你将它们放置在\
  \ `VBox` 窗格的垂直列中时，这一点尤为重要，因为垂直列会突出按钮宽度之间的任何差异。\n\n638 第 6 册 **JavaFX**\n\n![Image\
  \ 70](img/index-661_1.jpg)\n\n你可以通过将每个按钮的最大宽度设置为 `Double.MAX_VALUE` 来轻松指定所有按钮具有相同的宽度。以下是前面示例的修订版本，其中三个按钮被设置为相同的宽度：\n\
  \n```java\nButton btn1 = new Button(\"Number One\");\nButton btn2 = new Button(\"\
  Two\");\nButton btn3 = new Button(\"The Third Button\");\nbtn1.setMaxWidth(Double.MAX_VALUE);\n\
  ```\n\n## 使用布局窗格来安排你的场景\n\n```java\nbtn2.setMaxWidth(Double.MAX_VALUE);\nbtn3.setMaxWidth(Double.MAX_VALUE);\n\
  VBox vbox = new VBox(10, btn1, btn2, btn3);\nvbox.setPadding(new Insets(10));\n\
  vbox.setAlignment(Pos.CENTERED);\n```\n\n图 4-4 显示了当窗格被添加到场景并在舞台中显示时，这些按钮的外观。注意所有三个按钮都采用了最宽按钮（`btn3`）的宽度。\n\
  \n**图 4-4：**\n三个宽度相同的按钮。\n\n## 使用流式布局\n\n流式布局有两种：水平和垂直。水平流式布局将子节点按行排列，直到窗格的宽度达到你指定的特定尺寸。当达到该尺寸时，布局会在第一行下方开始的一行子节点。这种流动持续进行，每当达到尺寸限制时就会开始新行，直到所有子节点都放置完毕。\n\
  \n垂直流式布局的工作方式相同，但子节点按列排列，直到达到尺寸限制。当达到尺寸限制时，会在第一列右侧立即开始新列。\n\n你使用 `FlowPane` 类来创建流式布局。表\
  \ 4-6 显示了 `FlowPane` 类的构造函数和最常用的方法。\n\n第 4 章 **使用布局窗格来安排你的场景** 639\n\n### 表 4-6：FlowPane\
