  \n\n\n\n\n程序可以很容易地进行广泛的更改。假设利率出现在程序中十几个不同的语句中，当利率发生变化时，常量名称定义中的初始化值是唯一需要修改的值。`static`\
  \ 修饰符结合 `final` 关键字也用于定义常量（有关更多细节见第 13 章）。例如：\n\n```java\nstatic final int CONSTANT_VALUE\
  \ = 100;\n```\n\n这是一个简单的示例。\n\n### 示例 3.33: StaticFinalEx.java - 使用 static 和 final\
  \ 关键字\n```java\npackage ch03;\n\npublic class StaticFinalEx {\n    static final\
  \ int CONSTANT_VALUE = 100;\n    public static void main(String[] args){\n     \
  \   System.out.println(\"Constant Value : \" + CONSTANT_VALUE);\n        // CONSTANT_VALUE\
  \ = 40\n    }\n}\n```\n输出：`Constant Value : 100`\n\n### 示例 3.34: FinalEx.java\n\
  ```java\npackage ch03;\n\npublic class FinalEx {\n    public static void main(String[]\
  \ args){\n        // char MAX_NUM = 100;\n        // System.out.println(MAX_NUM);\n\
  \        final int MAX_NUM = 200;\n        System.out.println(MAX_NUM);\n    }\n\
  }\n```\n输出：`200`\n\n***\n\n## 变量、常量与字面量的区别\n\n### 变量\n`Variable`（变量）是内存位置的名称，允许我们存储一个值以供以后使用。它被称为变量，是因为你可以随时更改其中的内容。\n\
  \n### 常量\n`Constant`（常量）类似于变量。常量与变量唯一的区别是它们一旦定义就不能更改。\n\n### 字面量\n`Literals`（字面量）是赋值给变量和常量的值。\n\
  \n***\n\n## Java 关键字\n关键字是 Java 编程中预定义的保留字，对编译器具有特殊含义。例如 `int`、`for`、`class`、`package`\
  \ 等。你不能将关键字作为变量或常量名称（或标识符）。下面是 Java 编程中所有关键字的完整列表。\n\n### 表 3.9 | Java 关键字\n| class\
  \ | public | default | if | goto | void | protected |\n| while | static | continue\
  \ | do | const | enum | synchronized |\n| super | assert | boolean | for | float\
  \ | byte | implements |\n| break | double | private | new | this | throws | strictfp\
  \ |\n| short | native | package | int | throw | return | volatiles |\n| import |\
  \ switch | finally | case | long | final | transient |\n| catch | extends | abstract\
  \ | else | char | interface | |\n\n***\n\n## 总结\n- 变量是用于存储特定数据类型值的内存位置名称。\n- 在 Java\
  \ 中有四种变量：非静态变量、静态变量、局部变量和参数。\n- 局部变量是在方法内部声明的变量。\n- Java 编程语言是静态类型的，这意味着所有变量在使用之前必须先进行声明。\n\
  - 变量声明指示编译器：保留部分内存空间，为该保留的内存位置分配一个名称，并分配它将包含的数据类型。\n- 初始化是在声明语句中为变量赋值值。\n- 变量一次时间只能持有一个值。\n\
  - 标识符是我们给变量、方法、类、包和接口命名的名称。\n- 数据类型指的是存储在变量中的数据类型。\n- Java 被称为“强类型语言”，因为当你声明变量时，必须指定变量的类型。\n\
  - 数据类型分为两类：基本或原始数据类型以及对象或引用数据类型。\n- 原始数据类型是那些变量一次只能持有一个值的类型。这些数据类型被称为原始，是因为你不能使用它们来创建对象。\n\
  - 在 Java 中我们有八种原始数据类型，分为四组。它们是：整数类型（`byte`、`short`、`int`、`long`）、浮点类型（`float`、`double`）、字符类型（`char`）、布尔类型（`boolean`）。\n\
  - 字面量是可以赋值给原始或字符串变量的值，或作为参数传递给方法调用。\n- 在 Java 中，以反斜杠（`\\`）开头的字符是转义序列，对 Java 有特殊含义。\n\
  - 字符串字面量可以包含任何作为字符字面量出现的转义序列。\n- Java 中有六种字面量。它们是：整数字面量、浮点字面量、字符串字面量、字符字面量、布尔字面量和类字面量。\n\
  - Java 有两种浮点数：`float` 和 `double`。如果浮点字面量以字母 `F` 或 `f` 结尾，则它是 `float` 类型；否则它的类型是\
  \ `double`，并且可以以字母 `D` 或 `d` 结尾。\n- 字符字面量用一对单引号括起来的字符表示。\n- 字符串字面量是双引号内的一组字符。\n\
  - 我们指定 `Null` 字面量是为了减少对对象的引用。\n- 值 `true` 和 `false` 在 Java 中被视为字面量。当我们给布尔变量赋值时，只能使用这两个值。记住，字面量\
  \ `true` 并不是由它周围的引号表示的。\n- 在 Java 中，数值字面量数字之间的任何地方都可以任意数量的划线字符（`_`）。\n- 常量是创建存储固定值的变量。命名常量是一个内容固定的变量。\n\
  - 关键字是 Java 编程中预定义的保留字，对编译器具有特殊含义。\n\n***\n\n## 第 4 章：表达式与运算符\n表达式由两个部分组成：运算符和操作数。运算符是表示加法等简单计算的符号。运算符对数据或操作数执行操作。所有表达式至少有一个操作数。\n\
  \n### 算术运算符\n算术运算符用于数学表达式（加、减、除、乘等）。Java 提供了表中所示的算术运算符。\n\n### 表 4.1 | 算术运算符（假设整数变量\
  \ A 的值为 10，B 的值为 20）\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `+` | 运算符两侧相加\
  \ | `A + B = 30` |\n| `-` | 从左操作数减去右操作数 | `A - B = -10` |\n| `*` | 运算符两侧相乘 | `A\
  \ * B = 200` |\n| `/` | 左操作数除以右操作数 | `B / A = 2` |\n| `%` | 左操作数除以右操作数并返回余 | `B\
  \ % A = 0` |\n| `++` | 操作数的值加 1 | `B ++ = 21` |\n| `--` | 操作数的值减 1 | `B -- = 19`\
  \ |\n\n### 示例 4.1: ArithmeticOp1.java\n```java\npackage ch04;\n\npublic class ArithmeticOp1\
  \ {\n    public static void main(String[] args){\n        int x;\n        int y\
  \ = 10;\n        int z = 5;\n        x = y + z;\n        System.out.println(\"+\
  \ operator resulted in \" + x);\n        x = y - z;\n        System.out.println(\"\
  - operator resulted in \" + x);\n        x = y * z;\n        System.out.println(\"\
  * operator resulted in \" + x);\n        x = y / z;\n        System.out.println(\"\
  / operator resulted in \" + x);\n        x = y % z;\n        System.out.println(\"\
  % operator resulted in \" + x);\n    }\n}\n```\n\n\n\n\n\n21\n22 x = -y;\n23 System.out.println(\"\
  Unary operator resulted in\" + x); //-10\n24 }\n25 }\n\nOutput\n+ operator resulted\
  \ in 15\n- operator resulted in 5\n* operator resulted in 50\n/ operator resulted\
  \ in 2\n% operator resulted in 0\nUnary operator resulted in-10\n\n### Explanation\n\
  * Line 04: 创建一个名为 `x` 的变量。\n* Line 05: 创建一个名为 `y` 的变量并为其赋值值 10。\n* Line 06: 创建一个名为\
  \ `z` 的变量并为其赋值值 5。\n* Line 07: 将 `y` 和 `z` 的值相加并将结果赋值给变量 `x`。\n* Line 08: 将变量 `x`\
  \ 的值 传递给 `println()` 方法。显示变量的内容。\n* Line 10: 减去 `y` 和 `z` 的值并将结果赋值给变量 `x`。\n* Line\
  \ 11: 将变量 `x` 的值 传递给 `println()` 方法。显示变量的内容。\n* Line 13: 乘以 `y` 和 `z` 的值并将结果赋值给变量\
  \ `x`。\n* Line 14: 将变量 `x` 的值 传递给 `println()` 方法。显示变量的内容。\n* Line 16: 除以 `y` 和 `z`\
  \ 的值并将结果赋值给变量 `x`。\n* Line 17: 将变量 `x` 的值 传递给 `println()` 方法。显示变量的内容。\n* Line 19:\
  \ 将变量 `y` 的值从 10 转换为 -10。然后将结果赋值给变量 `x`。\n* Line 20: 将变量 `x` 的值 传递给 `println()`\
  \ 方法。显示变量的内容。\n\n这里是示例。\n示例 4.2: ArithmeticOp2.java\n```java\npackage ch04;\n\n\
  public class ArithmeticOp2 {\n    public static void main(String[] args){\n    \
  \    int a = 10;\n        int b = 20;\n\n        System.out.println(\"a + b = \"\
  \ + (a+b));\n        System.out.println(\"a - b = \" + (a-b));\n        System.out.println(\"\
  a * b = \" + (a*b));\n        System.out.println(\"a / b = \" + (a/b));\n      \
  \  System.out.println(\"a % b = \" + (a%b));\n        System.out.println(\"b % a\
  \ = \" + (b%a));\n        System.out.println(\"a++ = \" + (a++));\n        System.out.println(\"\
  a-- = \" + (a--));\n    }\n}\n```\nOutput\na + b = 30\na - b = -10\na * b = 200\n\
  a / b = 0\na % b = 10\nb % a = 0\na++ = 10\na-- = 11\n\n### Explanation\n* Line\
  \ 04: 创建一个名为 `a` 的变量并为其赋值值 10。\n* Line 05: 创建一个名为 `b` 的变量并为其赋值值 20。\n* Line 07:\
  \ 将 `a` 和 `b` 相加并显示结果 30。\n\n**注意**：括号内的表达式从左到右求值。考虑以下示例：`System.out.println(\"\
  a + b = \" + a + b ); // 1020`\n当字符串（String）与任何其他数据类型相加时，结果值是一个字符串。另一个变量也会转换为字符串，然后进行拼接。`System.out.println(\"\
  a + b = \" + a + b ); // 输出: 1020`\n如果 `println()` 方法中的表达式包含括号，则括号内的值先求值。因此，当两个整数使用\
  \ `(+)` 符号进行操作时，`(+)` 符号充当加法运算符而不是拼接运算符。考虑以下示例 - `System.out.println(\"a + b = \"\
  \ + (a+b)); // 输出: 30`\n括号被用来改变求值的顺序。首先求值括号内的表达式。因此，`a + b` 被求值为整数 30，然后它与字符串 `\"\
  a + b = \"` 拼接，得到最终的字符串 `\"a + b = 30\"`。\n\n***\n\n### Java 关系运算符\nJava 中的关系运算符用于比较两个值并返回一个布尔值。例如，小于运算符\
  \ (`<`) 确定一个值是否小于另一个值。Java 提供了六种关系运算符。表 4.2 列出了 Java 关系运算符，并展示了几个比较变量 `A` 和 `B`\
  \ 的关系表达式示例。\n\n表 4.2 | 关系运算符（假设整数变量 `A` 值为 10，变量 `B` 值为 20）\n\n| 运算符 | 描述 | 关系表达式\
  \ |\n| :--- | :--- | :--- |\n| `==` (等于) | 检查 `A` 和 `B` 的值是否相等，如果是，则条件为真。 | `(A==B)`\
  \ 为假 |\n| `!=` (不等于) | 检查 `A` 和 `B` 的值是否相等，如果是，则条件为真。 | `(A!= B)` 为真 |\n| `>` (大于)\
  \ | 检查 `A` 的值是否大于 `B` 的值，如果是，则条件为真。 | `(A>B)` 为假 |\n| `<` (小于) | 检查 `A` 的值是否小于 `B`\
  \ 的值，如果是，则条件为真。 | `(A<B)` 为真 |\n| `>=` (大于或等于) | 检查 `A` 的值是否大于或等于 `B` 的值，如果是，则条件为真。\
  \ | `(A>=B)` 为真 |\n| `<=` (小于或等于) | 检查 `A` 的值是否小于或等于 `B` 的值，如果是，则条件为真。 | `(A<=B)`\
  \ 为真 |\n\n所有关系运算符都是二元的，这意味着它们使用两个操作数。下面的示例展示了如何使用它们。示例 4.3: RelationalOp.java\n\
  ```java\npackage ch04;\n\npublic class RelationalOp {\n    public static void main(String[]\
  \ args) {\n        int a = 10;\n        int b = 20;\n\n        System.out.println(\"\
  a == b = \" + (a==b));\n        System.out.println(\"a != b = \" + (a!=b));\n  \
  \      System.out.println(\"a > b = \" + (a>b));\n        System.out.println(\"\
  a < b = \" + (a<b));\n        System.out.println(\"a >= b = \" + (a>=b));\n    \
  \    System.out.println(\"a <= b = \" + (a<=b));\n    }\n}\n```\nOutput\na == b\
  \ = false\na != b = true\na > b = false\na < b = true\na >= b = false\na <= b =\
  \ true\n\n### Explanation\n* Line 04: 创建一个名为 `a` 的变量并为其赋值值 10。\n* Line 05: 创建一个名为\
  \ `b` 的变量并为其赋值值 20。\n* Line 07-12: 展示了各种关系运算符的比较结果。\n\n***\n\n### Java 逻辑运算符\nJava\
  \ 中的逻辑运算符用于比较两个布尔值并返回一个布尔值。例如，与运算符 (`&&`) 确定两个值是否都为真。Java 提供了四种逻辑运算符。表 4.3 列出了 Java\
  \ 逻辑运算符，并展示了比较布尔变量 `A` 和 `B` 的几个逻辑表达式示例。\n\n表 4.3 | 逻辑运算符（假设布尔变量 `A` 为真，变量 `B` 为假）\n\
  \n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `&&` (逻辑与) | 检查两个值，只有当两个都为真时，结果才为真。\
  \ | `A && B` 为假 |\n| `\\|\\|` (逻辑或) | 检查两个值，只要其中一个为真时，结果就为真。 | `A \\|\\| B` 为真 |\n\
  | `!` (逻辑非) | 反转布尔表达式的值。如果值为真，则结果为假。 | `!A` 为假 |\n| `^` (逻辑异或) | 检查两个值，只有当两个值不同时，结果才为真。\
  \ | `A ^ B` 为真 |\n\n所有逻辑运算符都是二元的，这意味着它们使用两个操作数。下面的示例展示了如何使用它们。示例 4.4: LogicalOp.java\n\
  ```java\npackage ch04;\n\npublic class LogicalOp {\n    public static void main(String[]\
  \ args) {\n        boolean a = true;\n        boolean b = false;\n\n        System.out.println(\"\
  a && b = \" + (a&&b));\n        System.out.println(\"a || b = \" + (a||b));\n  \
  \      System.out.println(\"!a = \" + (!a));\n        System.out.println(\"a ^ b\
  \ = \" + (a^b));\n    }\n}\n```\nOutput\na && b = false\na || b = true\n!a = false\n\
  a ^ b = true\n\n### Explanation\n* Line 04: 创建一个名为 `a` 的变量并为其赋值 true。\n* Line 05:\
  \ 创建一个名为 `b` 的变量并为其赋值 false。\n* Line 06: `println()` 方法显示 `a && b = false`，因为 `a`\
  \ 和 `b` 不都为真。\n* Line 07: `println()` 方法显示 `a || b = true`，因为 `a` 或 `b` 其中为真。\n\
  * Line 08: `println()` 方法显示 `!a = false`，因为 `a` 为真。\n* Line 09: `println()` 方法显示\
  \ `a ^ b = true`，因为 `a` 和 `b` 的值不同。\n\n\n\n\n\n- 第 07 行：逻辑或（OR）运算符结合两个布尔变量（`a ||\
  \ b`）并返回 true。`println()` 方法在屏幕上显示 `a || b = true`。\n- 第 08 行：逻辑非（NOT）运算符反布尔表达式的值（`a\
  \ && b`）。然后，`!(a && b)` 为真。`println()` 方法在屏幕上显示 `!(a&&b) = true`。\n\n## Java 赋值运算符\n\
  \n赋值运算符在 Java 中用于为变量赋值。赋值运算符获取右侧操作数的值并将其放入左侧操作数标识的变量中。右操作数可以是字面量或变量。\n\n#### 语法\n\
  `<left-side-operand> = <right-side-operand>`\n`=` 运算符左侧的操作数必须是一个变量名。`=` 运算符右侧的操作数必须是有值的表达式。\n\
  \n### 示例 4.5: AssignmentOp1.java\n```java\n01 public class AssignmentOp1{\n02 public\
  \ static void main(String[] args) {\n03 int length = 10;\n04 int width;\n05 // change\
  \ the content of length to 20.\n06 length = 20;\n07\n08 // assigns the value of\
  \ the length variable to the width variable.\n09 // length still has the same value\
  \ 20.\n10 width = length;\n11\n12 System.out.println(\"Length value is \" + length);\n\
  13 System.out.println(\"Width value is \" + width);\n14 }\n15 }\n```\n**输出**\n```\n\
  Length value is 20\nWidth value is 20\n```\n\n重要：赋值运算符只改变其左侧操作数的内容。以下是 Java 支持的赋值运算符。\n\
  \n### 表 4.4 | 赋值运算符（假设布尔变量 A 持有 true，变量 B 持有 false）\n\n| 运算符 | 描述 | 示例 |\n| :---\
  \ | :--- | :--- |\n| `=` | 赋值运算符。将右操作数的值赋给左侧操作数。 | 左侧操作数。`C = A + B` 将 `A + B` 的值赋给\
  \ `C` |\n| `+=` | 加赋值运算符。将右操作数加到左操作数上，并将结果赋给左操作数。 | `C += A` 等同于 `C = C + A` |\n\
  | `-=` | 减赋值运算符。从左操作数中减去右操作数，并将结果赋给左操作数。 | `C -= A` 等同于 `C = C – A` |\n| `*=` |\
  \ 乘赋值运算符。将左操作数乘以右操作数，并将结果赋给左操作数。 | `C *= A` 等同于 `C = C * A` |\n| `/=` | 除赋值运算符。将左操作数除以右操作数，并将结果赋给左操作数。\
  \ | `C /= A` 等同于 `C = C / A` |\n| `%=` | 取模赋值运算符。使用两个操作数取模，并将结果赋给左操作数。 | `C %= A`\
  \ 等同于 `C = C % A` |\n| `<<=` | 左移赋值运算符。 | `C <<= 2` 等同于 `C = C << 2` |\n| `>>=`\
  \ | 按位与赋值运算符。 | `C &= 2` 等同于 `C = C & 2` |\n| `&=` | 右移赋值运算符。 | `C >>= 2` 等同于 `C\
  \ = C >> 2` |\n| `^=` | 按位异或赋值运算符。 | `C ^= 2` 等同于 `C = C ^ 2` |\n| `|=` | 按位或赋值运算符。\
  \ | `C \\|= 2` 等同于 `C = C \\| 2` |\n\n### 示例 4.6: AssignmentOp2.java\n```java\n\
  01 package ch04;\n02 public class AssignmentOp1 {\n03 public static void main(String[]\
  \ args) {\n04 int a = 10, b = 20, c = 0;\n05 c = a + b;\n06 System.out.println(\"\
  c = a + b = \" + c);\n07\n08 c += a;\n09 System.out.println(\"c+= a = \" + c);\n\
  10\n11 c -= a;\n12 System.out.println(\"c -= a = \" + c);\n13\n14 c *= a;\n15 System.out.println(\"\
  c *= a = \" + c);\n16 a = 10;\n17 c = 15;\n18 c /= a;\n19 }\n```\n**输出**\n```\n\
  c = a + b = 30\nc+= a = 40\nc -= a = 30\nc *= a = 300\n```\n 解释\n- 第 04 行：创建一个名为\
  \ `a` 的变量并赋值 `10`。\n- 第 04 行：创建一个名为 `b` 的变量并赋值 `20`。\n- 第 04 行：创建一个名为 `c` 的变量并赋值\
  \ `0`。\n- 第 05 行：将 `a` 和 `b` 的值相加并将结果赋给 `c`。\n- 第 06 行：将 `c` 的值发送到 `println()` 方法。显示为：`c\
  \ = a + b = 30`\n- 第 08 行：将 `a` 的值加到 `c` 上并将结果赋给 `c`。\n- 第 09 行：将 `c` 的值发送到 `println()`\
  \ 方法。显示为：`c+= a = 40`\n- 第 11 行：从 `c` 中减去 `a` 的值并将结果赋给 `c`。\n- 第 12 行：将 `c` 的值发送到\
  \ `println()` 方法。显示为：`c -= a = 30`\n- 第 14 行：将 `c` 的值乘以 `a` 的值并将结果赋给 `c`。\n- 第 15\
  \ 行：将 `c` 的值发送到 `println()` 方法。显示为：`c *= a = 300`\n- 第 16 行：为 `a` 赋值 `10`。\n- 第\
  \ 17 行：为 `c` 赋值 `15`。\n- 第 18 行：将 `c` 除以 `a`并将结果赋给 `c`。\n\n## 按位运算符\n\nJava 提供了按位运算符在位位上操作变量的内容。这些变量必须是数值类型（`char`、`short`、`int`\
  \ 或 `long`）。\n\n### 表 4.5 | 按位运算符（假设整数变量 A 持有 60，变量 B 持有 15）\n\n| 运算符 | 描述 | 示例\
  \ |\n| :--- | :--- | :--- |\n| `&` | 对每一位进行按位与运算。只有当 `a` 和 `b` 都为 1 时，结果为 1。 | `a\
  \ = 60 (00111100)`, `b = 15 (00001111)` |\n| `\\|` | 对每一位进行按位或运算。当 `a` 或 `b` 其中一个为\
  \ 1 时，结果为 1。 | `a = 60 (00111100)`, `b = 15 (00001111)` |\n| `^` | 对每一位进行按位异或运算。当\
  \ `a` 和 `b` 不同时，结果为 1。 | `a = 60 (00111100)`, `b = 15 (00001111)` |\n| `~` | 对每一位进行按非运算。`~a`\
  \ 产生 `a` 的反反值（补码）。 | `a = 60 (00111100)` |\n\n## 按位移运算符\n\n按位移运算符接受两个操作数：第一个是待移动的数量，第二个指定第一个操作数移动的位数。\n\
  \n### 表 4.6 | 按位移运算符\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `&` | 使用 `&`\
  \ 运算符，只有当两个操作数中都存在该位时，结果中的该位为 1。 | `a = 60 (00111100)`, `b = 15 (00001111)` |\n\
  | `\\|` | 如果位在任一操作数中存在，则结果中的该位为 1。 | `a = 60 (00111100)`, `b = 15 (00001111)` |\n\
  | `^` | 对每一位进行按位异或运算。当 `a` 和 `b` 不同时，结果为 1。 | `a = 60 (00111100)`, `b = 15 (00001111)`\
  \ |\n| `~` | （按位取反）对每一位进行按非运算。`~a` 产生 `a` 的反值（补码）。 | `a = 60 (00111100)` |\n| `<<`\
  \ | 在 `<<` 左移运算符中，所有位都按右操作数指定的位数向左移动。 | `a << 2; a = 60 (00111100)`, 左移 2 位 |\n\
  | `>>` | 正数：二进制右移运算符。左操作数的值按右操作数指定的位数向右移动。 | `a >> 2; a = 60 (00111100)`, 右移 2 位\
  \ |\n| `>>` | 负数：`>>` 将位向右移动并用 0 填充最左侧，完成后会将左侧位重置为 1 以保持结果为负。 | `a = -99 >> 2` |\n\
  | `>>>` | 正数：右移零填充运算符。左操作数的值按右操作数指定的位数向右移动，移出的位用 0 填充。 | `a >>> 2; a = 60 (00111100)`,\
  \ 右移 2 位 |\n\n\n\n\n\n| `>>>` (无符号右移) 负数 | 使用 `>>>` 时，所有位向右移动，零填充在最左侧位。 | `a = -1;\
  \ a >>> 2 ;` |\n\n操作数 `-1` : `11111111`\n\n变为：`00111111` |\n\n### 示例 4.7：`BitwiseOp1.java`\n\
  假设 `a = 40` 且 `b = 10`；现在它们的二进制格式表示如下：\n\n```java\npackage ch04;\n\npublic class\
  \ BitwiseOp1 {\n    public static void main(String[] args) {\n        int a = 40;\
  \ // 40 = 0010 1000\n        int b = 10; // 10 = 0000 1010\n        int c = 0;\n\
  \        c = a & b;  // 8 = 0000 1000\n        System.out.println(\"a & b = \" +\
  \ c);\n        c = a | b;  // 42 = 0010 1010\n        System.out.println(\"a | b\
  \ = \" + c);\n        c = a ^ b;  // 34 = 0010 0010\n        System.out.println(\"\
  a ^ b = \" + c);\n        c = ~a;\n        System.out.println(\"~a = \" + c);\n\
  \        c = a << 2; // 160 = 1010 0000\n        System.out.println(\"a << b = \"\
  \ + c);\n        c = a >>> 2; // 10 = 0000 1010\n        System.out.println(\"a\
  \ >>> 2 = \" + c);\n    }\n}\n```\n**输出**\n```\na & b = 8\na | b = 42\na ^ b = 34\n\
  ~a = -41\na >> b = 160\na >>> 2 = 10\n```\n\n### 示例 4.8：`BitwiseOp2.java`\n```java\n\
  package ch04;\n\npublic class BitwiseOp2 {\n    public static void main(String[]\
  \ args){\n        int x = 0xFAEF; // 1111101011101111\n        int y = 0xF8E9; //\
  \ 1111100011101001\n        int z;\n        System.out.println(\"x & y : \" + (x\
  \ & y));\n        System.out.println(\"x ^ y : \" + (x ^ y));\n        System.out.println(\"\
  ~x : \" + (~x));\n        System.out.println(\"x << y : \" + (x << y));\n      \
  \  System.out.println(\"x >> y : \" + (x >> y));\n        System.out.println(\"\
  x >>> y : \" + (x >>> y));\n        // 无无符号左移运算符\n    }\n}\n```\n**输出**\n```\nx\
  \ & y : 63721\nx ^ y : 518\n~x : -64240\nx << y : 32890368\nx >> y : 125\nx >>>\
  \ y : 125\n```\n\n在操作数的两个对应位之间应用位运算符的结果如下表所示：\n\n| `A` | `B` | `~A` | `A&B` | `A\\\
  |B` | `A^B` |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | 1 | 0 | 1 | 1\
  \ | 0 |\n| 1 | 0 | 0 | 0 | 1 | 1 |\n| 0 | 1 | 1 | 0 | 1 | 1 |\n| 0 | 0 | 1 | 0 |\
  \ 0 | 0 |\n\n## Java 自增和自减运算符\n自增和自减运算符属于算术运算符。\n\n*   `++` 将操作数的值加 1。\n*   `--`\
  \ 将操作数的值减 1。\n\n表 4.7 | 自增和自减运算符。（假设整数变量 `B` 存储 20）\n\n| 运算符 | 描述 | 示例 |\n| :---\
  \ | :--- | :--- |\n| `++` (自增) | 将操作数的值加 1。 | `B++` 得到 21 |\n| `--` (自减) | 将操作数的值减\
  \ 1。 | `B--` 得到 19 |\n\n### 示例 4.9：`IncDecOp.java`\n```java\npackage ch04;\n\npublic\
  \ class IncDecOp {\n    public static void main(String[] args) {\n        int a\
  \ = 1;\n        a++;\n        int b = 2;\n        b++;\n\n        System.out.println(\"\
  a = \" + a);\n        System.out.println(\"b = \" + b);\n    }\n}\n```\n**输出**\n\
  ```\na = 2\nb = 3\n```\n\n### 解析\n*   第 05 行：将变量 `a` 的值加 1。\n*   第 07 行：将 `b` 的值加\
  \ 1。\n\n## 总结\n*   控制结构由三种类型组成：序列、选择和循环。\n*   序列结构按顺序执行。\n*   选择结构根据条件的真假改变流程。\n\
  *   选择结构使用关系运算符测试条件。\n*   算术运算符用于计算。\n*   逻辑运算符用于组合布尔表达式。\n*   赋值运算符将值赋予变量。\n* \
  \  位运算符操作单个位。\n*   自增和自减运算符属于算术运算符。\n*   `++` 将操作数的值加 1。\n*   `--` 将操作数的值减 1。\n\n\
  ## 控制结构\n介绍控制结构（控制流）\n控制结构决定语句执行的顺序。\n\n**控制结构的类型：**\n1.  序列结构。\n2.  判定（选择）结构。\n\
  3.  重复（循环）结构。\n\n### 序列结构\n程序是一系列语句，按顺序执行。这是默认执行方式。然而循环和选择是改变流程的特殊指令。例如：\n\n```java\n\
  public class ClassName {\n    public static void main(String[] args) {\n       \
  \ System.out.println(\"第一条语句\");\n        System.out.println(\"第二条语句\");\n    }\n\
  }\n```\n序列结构从上到下执行。然而，循环和选择是改变流程的特殊指令。\n\n### 选择结构\n选择语句（条件结构）根据条件的真假将程序转移到特定的流程。选择结构使用关系运算符测试条件。有多种选择结构用于实现结果。\n\
  \n**选择结构的类型：**\n*   `if` 选择语句\n*   `if...else` 选择语句\n*   条件运算符 (`? :`)\n*   `if...else\
  \ if` 选择语句\n*   嵌套 `if` 选择语句\n*   `switch` 选择语句\n\n#### `if` 选择语句\n当条件为真时执行操作，为假时跳过操作。`if`语句只在条件为真时执行一个或多个语句。\n\
  \n语法：\n```java\nif (condition) {\n    // 如果布尔表达式 (condition) 为真则执行语句\n}\n// 如果布尔表达式\
  \ (condition) 为假则执行语句\n```\n\n解析：\n*   条件应始终包含在括号内。\n*   布尔表达式（`condition`）是真或假之一。如果条件为真，则执行\
  \ `{` 和 `}` 之间的语句。否则会被跳过。该语句是条件执行的（仅在括号内的表达式为真时执行）。\n*   如果条件为假，则执行 `{` 和 `}` 之后的后续语句。\n\
  \n#### 示例 5.1：`IfSelect.java`\n`IfSelect.java` 程序演示了 `if` 语句的使用。\n\n```java\npackage\
  \ ch05;\n\npublic class IfSelect {\n    public static void main(String[] args) {\n\
  \        int x = 15;\n        if (x > 10) {\n            System.out.println(\"x\
  \ 大于 10.\");\n        }\n        System.out.println(\"if 语句后的第一条语句\");\n    }\n\
  }\n```\n`if` 语句的控制流如图所示。（Image00077.jpg）\n图 1.2 | if 语句的控制流\n\n\n\n\n*   第 05 行：条件\
  \ `(x > 10)` 为真，因此执行 `{` 和 `}` 之间的下一个语句。\n*   第 07 行：在屏幕上显示消息 \"x is greater than\
  \ 10.\"。\n*   第 09 行：执行 `{` 和 `}` 之后的下一个语句（如果存在），这些语句会在屏幕上显示 \"First statement after\
  \ the body of if condition\"（if 条件体后的第一条语句）。\n\n决策可以基于任何表达式 - 如果表达式的求值结果为 0，则它被视为假（false）；如果表达式的求值结果为非\
  \ 0（nonzero），则被视为真（true）。\n\n***\n\n## 关系运算符\n\n通常情况下，`if` 语句测试的条件是由关系运算符形成的。关系运算符用于确定两个值之间是否存在特定的关系。下表总结了这些关系运算符：\n\
  \n### 表 5.1 | Java 关系运算符表\n\n| 优先级 | 关系运算符 | 含义 |\n| :--- | :--- | :--- |\n| 1 |\
  \ `>` | 大于 |\n| 2 | `<` | 小于 |\n| 3 | `>=` | 大于或等于 |\n| 4 | `<=` | 小于或等于 |\n| 5\
  \ | `==` | 等于 |\n| 6 | `!=` | 不等于 |\n\n所有的关系运算符都是二元的，这意味着它们使用两个操作数。\n\n### 比较变量\
  \ `A` 和 `B` 的若干条件示例\n\n| 表达式 | 含义 |\n| :--- | :--- |\n| `A > B` | `A` 大于 `B` 吗？\
  \ - 如果 `A` 大于 `B`则返回 true |\n| `A < B` | `A` 小于 `B` 吗？ - 如果 `A` 小于 `B`则返回 true |\n\
  | `A >= B` | `A` 大于或等于 `B` 吗？ - 如果 `A` 大于或等于 `B`则返回 true |\n| `A <= B` | `A` 小于或等于\
  \ `B` 吗？ - 如果 `A` 小于或等于 `B`则返回 true |\n| `A == B` | `A` 等于 `B` 吗？ - 如果 `A` 和 `B`\
  \ 相则返回 true |\n| `A != B` | `A` 不等于 `B` 吗？ - 如果 `A` 和 `B` 不相等则返回 true |\n\n下面是一个示例\
  \ `GreaterT.java`，它定义了一个整数，并使用关系运算符来确定其值是否大于 40。由于该表达式只能为真或假，因此它是一个布尔表达式。\n\n###\
