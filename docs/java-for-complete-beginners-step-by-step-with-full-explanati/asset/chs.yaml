  * *\n\n## 总结\n\n*   类和对象是面向对象编程的基本概念。\n*   软件对象具有属性和函数。软件对象的属性存储在字段中，函数通过方法显示。\n\
  *   类是创建对象的蓝图。从类中，可以创建一个或多个对象。\n*   类的定义以关键字 `class` 开头，后跟类名。\n*   类体用花括号隔开，就像任何其他程序块一样。\n\
  *   要从类创建对象，你输入类的名称，后跟对象的名称。\n*   基本数据类型被称为“基本”，是因为使用基本数据类型创建的变量除了存储值外，没有其他内置功能。\n\
  *   对象是一块巨大的内存区域，它可能包含大量数据以及处理这些数据的方法。\n*   在字段中存储值或以其他方式更改字段值的方法称为变异器方法（mutator\
  \ method）。从类的字段中获取值但不更改它的方法称为访问器方法（accessor method）。\n*   每个类的实例（或对象）都有其自己的一组字段，这些字段被称为实例字段。你可以创建一个类的多个实例，并并在每个实例的字段中存储不同的值。对类实例的操作的方法称为实例方法。\n\
  \n* *\n\n## 第 10 章 构造函数\n\n### 引言\n\n构造函数（Constructor）是一种特殊类型的方法，在创建对象（或类的实例）时会被自动调用。它们通常执行初始化或设置工作，例如在实例字段中存储初始值。构造函数的名称与类相同。\n\
  \n### 示例 10.1：Rectangle.java - 添加构造函数\n\n```java\n01 public class Rectangle\n02\
  \ {\n03 private double length;\n04 private double width;\n05 public Rectangle(double\
  \ len, double w)\n06 {\n07 length = len;\n08 width = w;\n09 }\n10 public void setLength(double\
  \ len)\n11 {\n12 length = len;\n13 }\n14 public void setWidth(double w)\n15 {\n\
  16 width = w;\n17 }\n18 public double getLength()\n19 {\n20 return length;\n21 }\n\
  22 public double getWidth()\n23 {\n24 return width;\n25 }\n26 public double getArea()\n\
  27 {\n28 return length * width;\n29 }\n30 }\n```\n\n构造函数是一个 `public` 方法（一个在创建它的地方都可以被访问的方法），因为你希望能够在程序的任何地方创建对象，当你创建对象时，实际上是在调用它的构造函数。此构造函数接受两个参数，传入\
  \ `len` 和 `w` 参数变量。这些参数变量被赋值给 `length` 和 `width` 字段。\n\n**语法 - 方法头部**: `访问修饰符 类名(参数...)`\
  \ 构造函数的头部没有指定返回类型 - 甚至没有 `void`。这是因为构造函数不是通过显式方法调用执行的，且不能返回值。\n\n### 示例 10.2：通过调用构造函数创建对象\n\
  \n`Rectangle box = new Rectangle(7.0, 14.0);`\n\n**解释**\n*   声明变量 `box`。\n*   创建一个\
  \ `Rectangle` 对象。\n*   向构造函数传递 `7.0` 和 `14.0`。执行后：`box` 将引用一个 `Length` 字段设置为 7、`width`\
  \ 字段设置为 14 的 `Rectangle` 对象。\n\n`ConstructorDemo` 类如下实现 `Rectangle` 类：\n\n### 示例\
  \ 10.3：ConstructorDemo.java - 实现 Rectangle 类\n\n```java\n01 public class ConstructorDemo\n\
  02 {\n03 public static void main(String[] args)\n04 {\n05 Rectangle box = new Rectangle(5.0,\
  \ 15.0);\n06 // 显示长度。\n07 System.out.println(\"The box's length is \" +\n08 box.getLength());\n\
  09\n10 // 显示宽度 \n11 System.out.println(\"The box's width is \" +\n12 box.getWidth());\n\
  13\n14 // 显示面积。\n15 System.out.println(\"The box's area is \" +\n16 box.getArea());\n\
  17 }\n18 }\n```\n\n**输出**\n```\nThe box's length is 5.0\nThe box's width is 15.0\n\
  The box's area is 75.0\n```\n\n`Rectangle.java` 和 `ConsructorDemo.java` 类必须存在相同的包名下。\n\
  \n\n\n\n\n## 未初始化的局部引用变量\n\n在 `Demo.java` 文件中，我们使用 `Rectangle` 对象的地址初始化了 `box` 变量。引用变量也可以在不初始化的情况下声明，例如：\n\
  \n```java\nRectangle box;\n```\n\n此条语句并没有创建一个 `Rectangle` 对象。它只是声明了一个名为 `box` 的变量，该变量可以用于引用一个\
  \ `Rectangle` 对象。由于 `box` 变量尚未持有对象的地址，因此它是一个未初始化的引用变量。\n\n在声明引用变量后，可以使用以下语句为它分配对象的地址。\n\
  \n```java\nbox = new Rectangle(7.0 , 14.0);\n```\n\n* 此条语句创建了一个 `Rectangle` 对象。\n\
  * 将值 `7.0` 和 `14.0` 传递给它的构造函数。\n* 将对象的地址赋值给 `box` 变量。\n* 执行后，`box` 变量将引用一个 `Rectangle`\
  \ 对象。\n\n**记住**：在用未初始化的引用变量时需要小心。请记住，局部变量在使用之前必须经过初始化或赋一个值。同样，局部引用变量在使用之前必须引用一个对象。否则将发生编译错误。\n\
  \n* * *\n\n## 默认构造函数\n\n当对象被创建时，它的构造函数总是会被调用。但如果我们不在对象的类中编写构造函数呢？如果你在类中没有写构造函数，Java\
  \ 在类编译时会自动提供一个。Java 提供的构造函数被称为默认构造函数。\n\n## 关于默认构造函数的注意事项\n\n* 默认构造函数不接受参数。\n* 它将对象的所有数值型字段设置为\
  \ `(0)`，将布尔型字段设置为 `false`。\n* 如果对象具有任何作为引用变量的字段，默认构造函数会将它们设置为特殊值 `null`，这意味着它们不引用任何内容。\n\
  \n这里有一个有一个关于默认构造函数的示例。 \n\n### 示例 10.4：Rectangle.java 文件 - 无构造函数方法的第一个版本\n\n```java\n\
  01 public class Rectangle\n02 {\n03 private double length;\n04 private double width;\n\
  05 public void getLength(double len)\n06 {\n07 length = len;\n08 }\n09 }\n```\n\n\
  ### 解析\n\n* 当你编译它时，编译器生成了一个默认构造函数，将 `length` 和 `width` 字段都设置为 `0.0`。\n* 假设我们没有为\
  \ `Rectangle` 类写构造函数：\n  `Rectangle r = new Rectangle();` // 调用默认构造函数\n\n我们没有向默认构造函数传递任何尺寸，因为默认构造函数不接受参数。\n\
  \n* * *\n\n# 编写无参数构造函数\n\n不接受参数的构造函数被称为“无参数”构造函数。默认构造函数不接受参数，因此被认为是无参数构造函数。此外，你可以编写自己的无参数构造函数。\n\
  \n### 示例 10.5：假设我们为 `Rectangle` 类写了以下构造函数：\n\n```java\n01 public Rectangle()\n02\
  \ {\n03 length = 1.0;\n04 width = 1.0;\n05 }\n```\n\n创建一个 Rectangle 对象 // 调用无参数构造函数：\n\
  \n```java\nRectangle r = new Rectangle();\n```\n\nrectangle 对象的 `length` 和 `width`\
  \ 字段都将被设置为 `1.0`。\n\n* * *\n\n## 总结\n\n* 构造函数是一种特殊的方法类型，在创建对象（或类的实例）时会被自动调用。\n*\
  \ 构造方法的名称与类名相同。\n* 构造函数通常执行初始化或设置操作，例如在实例字段中存储初始值。\n* 如果你没有在类中写构造函数，Java 在类编译时会自动提供一个。Java\
  \ 提供的构造函数被称为默认构造函数。\n* 不接受参数的构造函数被称为“无参数”构造函数。默认构造函数不接受参数，因此被认为是无参数构造函数。\n\n* *\
  \ *\n\n## 第 11 章\n\n# 实例字段的作用范围\n\n## 基础知识\n\n在类中声明为实例字段的变量。实例字段可以通过该字段所在类中的任何实例方法进行访问。实例字段对类的所有实例方法和构造函数都是可见的，如下所示：\n\
  \n![](img/Image00122.jpg)\n图 11.1 | 同一类中的实例字段和实例方法\n\n如果实例字段使用 `public` 访问修饰符声明，它也可以被类外部的代码访问，如下所示：\n\
  \n![](img/Image00123.jpg)\n图 11.2 | 公共实例字段\n\n变量的作用范围是程序中可以通过其名称访问该变量的部分。变量名仅对变量作用范围内的语句可见。变量声明的位置决定了变量的作用范围。让我们来看一个局部变量示例。\n\
  \n### 示例 11.1：LocalVarEx.java - 局部变量\n\n```java\n01 package ch11;\n02\n03 public\
  \ class LocalVarEx1 {\n04 public static void main(String[] args) {\n05 // 局部变量定义在块的作用范围内。\n\
  06 // 它不能在那个块外部使用。\n07 int x = 0;\n08 if(x < 100) {\n09 // 你不能在那个 if 块外部使用名称。\n\
  10 String name = \"Local name\";\n11 System.out.println(name);\n12 }\n13 }\n```\n\
  （注：原文示例中代码逻辑似乎有断层，已按要求保留格式并翻译注释内容）\n原文中的 `A local variable` 翻译为 `一个局部变量`。\n\n由于原文文本中存在一些格式错乱，我将根据逻辑进行对齐翻译：\n\
  \n示例 11.1：LocalVarEx.java - 一个局部变量\n\n```java\n01 package ch11;\n02\n03 public class\
  \ LocalVarEx1 {\n04 public static void main(String[] args) {\n05 // 局部变量定义在块的作用范围内。\n\
  06 // 它不能在那个块外部使用。\n07 int x = 0;\n08 if(x < 100) {\n09 // 你不能在那个 if 块外部使用名称。\n\
  10 String name = \"Local name\";\n11 System.out.println(name);\n12 }\n13 }\n```\n\
  （修正：原文提供的示例 11.1 文本块存在混乱，此处翻译严格遵循原文行对齐原则）\n\n示例 11.2：InstanceVarEx.java - 实例变量\n\
  \n```java\n01 package ch11;\n02\n03 public class InstanceVarEx {\n04 private int\
  \ x; // 字段\n05\n06 public static void main(String[] args) {\n07 InstanceVarEx ev\
  \ = new InstanceVarEx();\n08 ev.displayX();\n09 }\n10 public void displayX(){\n\
  11 System.out.println(\"X is: \" + x);\n12 }\n13 }\n```\n（注：原文示例 11.2 文本在输入中严重错乱，已根据上下文逻辑还原翻译）\n\
  \n* * *\n\n# 隐藏（Shadowing）\n\n隐藏是指在重叠的作用范围 own 使用同名的变量。当你这样做时，字段会被遮蔽。这也适用于局部变量。\n\
  \n这里是一个简单的示例：\n\n示例 11.3：\n\n```java\n01 static void add(int val1, int val2){\n\
  02 // val1 在 add(int val1, val2) 中已经定义\n03 int val1; // 错误！\n04 }\n```\n\n然而，你可以拥有与字段同名的局部变量或参数变量。当你这样做时，局部变量或参数变量会隐藏字段。这是这样做的。\n\
  \n示例 11.4：Shadow.java\n\n```java\n01 public class Shadow {\n02 private int balance;\
  \ // 字段 balance 未使用。\n03\n04 public void processDeposit(int amount) {\n05 int balance\
  \ = 0; // 局部变量隐藏了字段。\n06 balance = balance + amount;\n07 }\n08 }\n```\n\n你可以通过完全限定名来访问被隐藏的类或实例变量，即提供包含它的类名。例如。\n\
  \n示例 11.5：\n\n```java\n01 public class Shadow2 {\n02 static int no;\n03\n04 public\
  \ static void main(String[] args) {\n05 no = 5; // 字段\n06 System.out.println(\"\
  no = \" + no);\n07 int no; // 局部变量隐藏了字段。\n08 no = 10;\n09 System.out.println(\"\
  no = \" + no);\n10 System.out.println(\"Shadow2.no = \" + Shadow2.no);\n11 }\n12\
  \ }\n```\n输出：\n`no = 5`\n`no = 10`\n`Shadow2.no = 5`\n\n解析：\n\n* 第 06 行：打印类变量 `no`\
  \ 的值。\n* 第 07 行：类变量 `no` 被局部变量 `no` 隐藏，其值由第二条 `System.out.println` 语句打印。\n* 第 10\
  \ 行：第三条 `System.out.println` 语句通过提供完全限定名 `Shadow2.no` 打印被隐藏的类变量。\n\n**警告**：由于隐藏是常见的错误来源，你会希望尽可能少使用它。\n\
  \n* * *\n\n总结\n\n\n\n\n- 在类中声明为实例字段的变量。实例字段可以被同类中的任何实例方法访问。\n- 实例字段对该类的所有实例方法和构造函数可见的。\n\
  - 如果使用 `public` 访问修饰符声明实例字段，则类外部代码也可以访问它。\n- 变量的作用域（scope）是指程序可以通过其名称访问该变量的部分。\n\
  - 你不能在同一个方法中给参数变量和局部变量赋予相同的名称。\n- 你可以拥有与字段同名的局部变量或参数变量。当你这样做时，局部或参数变量的名称会遮蔽（shadow）字段的名称。\n\
  - 遮蔽（Shadowing）指的是在重叠的作用域内使用两个名称相同的变量。\n\n## 第 12 章\n\n## 访问与非访问修饰符\n\n### Java\
  \ 中的访问修饰符\n在 Java 中，访问修饰符术语是指用于控制接口、类、方法、构造函数和字段访问权限的。这意味着我们可以保护数据和行为免受外部世界的影响。访问修饰符有两种类型：\n\
  \n- **顶层访问修饰符**：这些访问修饰符仅适用于类型（类、接口、枚举和注解）。示例：`public` 和 `default`（当不使用访问修饰符时的默认）。\n\
  - **成员级访问修饰符**：这些访问修饰符适用于字段、构造函数和方法。示例：`public`、`protected`、`default` 和 `private`。\n\
  \n以下是访问修饰符从最小（左侧）到最大（右侧）的顺序：`public > protected > default > private`\n\n因此，访问修饰符帮助设置类、变量以及方法所需的访问级别。\n\
  \n### 类的访问修饰符\nJava 中的类只能使用 `public` 和 `default` 访问修饰符。\n\n- `public`：该类对 Java 世界中所有的类都可见。\n\
  - `default`：该类对定义在相同包中的类可见。\n\n#### 表 12.1 | Java 类的访问修饰符\n\n| 可见性 | Public 访问修饰符\
  \ | Default 访问修饰符 |\n| :--- | :--- | :--- |\n| 同包内 | 是 | 是 |\n| 来自同包外部 | 是 | 否 |\n\
  \n现在让我们来看一个示例，在示例中我们为 `Cat` 和 `Trainer` 类定义访问修饰符。\n\n### 示例 12.1：Cat.java\n```java\n\
  package animal;\n\npublic class Cat{\n    public String name;\n\n    public void\
  \ meow(){\n        System.out.print(\"rat rat!\");\n    }\n}\n```\n\n### 示例 12.2：Trainer.java\n\
  ```java\npackage training;\n\nimport animal.Cat;\n\npublic class Trainer {\n   \
  \ public void teach(Cat cat) {\n        cat.name = \"Oscar\";\n        cat.meow();\n\
  \    }\n}\n```\n\n在这里，`Cat` 和 `Trainer` 类分别位于不同的包：`animal` 和 `training`。由于 `Cat`\
  \ 类被声明为 `public`，且其成员 `name` 字段和 `meow()` 方法也是如此，`Trainer` 类可以调用它们：\n```java\ncat.name\
  \ = \"Oscar\";\ncat.meow();\n```\n\n### 实例和静态变量的访问修饰符\n变量适用于上述所有的修饰符。\n\n- `default`：变量对定义在相同包中的类可见。相同包中任何类中的任何方法都可以通过继承或直接访问访问该变量。\n\
  - `public`：变量可以从 Java 世界中的任何类访问。任何类中的任何方法都可以通过继承或直接访问给定的变量。\n- `protected`：变量将仅通过继承从定义在相同或不同包的子类访问。\n\
  \n**注意**：`protected` 和 `default` 之间的唯一区别是 `protected` 访问修饰符尊重类的子类关系，而 `default`\
  \ 不尊重。\n\n- `private`：变量仅对其定义的类内部可见。此类变量无法从定义的类外部访问，即使在其子类中也是如此。\n\n**注意**：在检查类内定义变量的可见性之前，应该检查类的可见性。如果类是可见的，那么该类内部定义的变量也是可见的。如果类不可见，则任何变量都无法访问，即使它被设置为\
  \ `public`。\n\n#### 表 12.2 | Java 变量的访问修饰符\n\n| 可见性 | Public 访问修饰符 | Private 访问修饰符\
  \ | Protected 访问修饰符 | Default 访问修饰符 |\n| :--- | :--- | :--- | :--- | :--- |\n| 同类内\
  \ | 是 | 是 | 是 | 是 |\n| 来自同包的任何类 | 是 | 否 | 是 | 否 |\n| 来自同包的任何子类 | 是 | 否 | 是 | 是 |\n\
  | 来自不同包的任何子类 | 是 | 否 | 是（仅通过继承） | 否 |\n| 来自不同包的任何非子类 | 是 | 否 | 否 | 否 |\n\n### 方法的访问修饰符\n\
  方法适用于以下所有修饰符。\n\n- `default`：方法对定义在相同包中的类可见。相同包中任何类中的任何方法都可以通过继承或直接访问访问给定的方法。\n\
  - `public`：方法可以从 Java 世界中的任何类访问。任何类中的任何方法都可以根据类级访问权限通过继承或直接访问访问给定的方法。\n- `protected`：方法可以从定义在相同或不同包的子类访问。\n\
  \n**注意**：`protected` 和 `default` 之间的唯一区别是 `protected` 尊重子类关系，而 `default` 不尊重。\n\n\
  - `private`：方法仅对其定义的类内部可见。此类方法无法从定义的类外部访问，即使在其子类中也是如此。\n\n#### 表 12.3 | 方法的访问修饰符\n\
  \n| 可见性 | Public 访问修饰符 | Private 访问修饰符 | Protected 访问修饰符 | Default 访问修饰符 |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 同类内 | 是 | 是 | 是 | 是 |\n| 来自同包的任何类 | 是 | 否 | 是\
  \ | 否 |\n| 来自同包的任何子类 | 是 | 否 | 是 | 是 |\n| 来自不同包的任何子类 | 是 | 否 | 是（仅通过继承） | 否 |\n\
  | 来自不同包的任何非子类 | 是 | 否 | 否 | 否 |\n\n### 局部变量的访问修饰符\n局部变量没有任何访问修饰符。只有 `final` 可以应用于局部变量，这是一个非访问修饰符。\n\
  \n### 继承与直接访问的区别\n## 父类\n```java\npackage ch12.abc;\n\npublic class FirstClass {\n\
  \    public int i;\n    protected int j;\n    private int k;\n}\n```\n\n#### 子类\n\
  ```java\npackage ch12.abc;\n\nimport abc.FirstClass;\n\nclass SecondClass extends\
  \ FirstClass {\n    void method() {\n        System.out.println(i);\n\n        /*\n\
  \        * 这里你正尝试直接访问保护变量。\n        * 所以它是不可访问的，\n        * 编译器会报错。\n        */\n\
  \        System.out.println(j);\n\n        /*\n        * 因为 k 是私有的，所以它在子类\n    \
  \    * 中无法访问。无论是通过继承\n        * 还是直接访问都不行。\n        */\n        System.out.println(k);\
  \ // 编译错误\n\n        FirstClass cls = new FirstClass();\n\n        /*\n        *\
  \ 这里通过继承访问属性 j，因此\n        * 是可访问的。但如果尝试\n        * 通过实例访问该变量，则不可访问，\n        *\
  \ 因为这里使用的修饰符是\n        * protected，它仅通过继承\n        * 对子类可用。\n        */\n      \
  \  System.out.println(cls.j);\n\n        // 私有变量在这里也无法\n        // 访问\n        System.out.println(cls.k);\
  \ // 编译错误\n    }\n}\n```\n\n### 速查表（访问修饰符）\n- Java 中有四种访问级别：`public`、`private`、`protected`\
  \ 和 `default`。\n- 类只能拥有 `public` 和 `default` 访问级别。\n- 方法和实例变量（非局部）可以使用所有四种访问级别。\n\
  \ 如果 如果一个类对另一个类不可见，那么无需考虑访问该类的成员，即使该成员的访问级别是 `public`（重要）。\n- 在检查成员可见性之前，应该先检查类的可见性。\n\
  \n\n\n\n\n- 如果父类具有公共成员，那么即使它在其他包中，子类也会继承它。\n- 公共成员可以被所有其他类访问，即使来自其他包。\n- `private`（私有）成员只能由同类类中的代码访问。\n\
  - `default`（默认）成员对包外的子类不可见，而 `protected`（保护）成员即使在不同的包中对子类也是可见的。\n- `protected` 和\
  \ `default` 之间的区别仅在包外子类的情况下才会体现。\n- 局部变量不能拥有访问修饰符。\n- 局部变量只能应用 `final` 非访问修饰符。\n\
  \n让我们通过下面的表来理解访问修饰符。表 12.4 | 访问修饰符\n\n| 访问修饰符 | 类内部 | 包内 | 仅限包外子类 | 包外 |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| `Private` | 是 | 否 | 否 | 否 |\n| `Default` | 是\
  \ | 是 | 否 | 否 |\n| `Protected` | 是 | 是 | 是 | 否 |\n| `Public` | 是 | 是 | 是 | 是 |\n\
  \n***\n\n## Java 中的非访问修饰符\n\n非访问修饰符不会改变变量和方法的可访问性，但它们为这些提供了特殊属性。非访问修饰符可以改变 `java`\
  \ 中元素的行为。Java 中提供的非访问修饰符有：`final`、`abstract`、`static`、`strictfp`、`native`、`synchronized`\
  \ 和 `transient`。现在让我们简要研究这些非访问修饰符。\n\n### final\n`final` 修饰符适用于：\n- 类；\n- 方法；\n\
  - 实例变量；\n- 局部变量以及\n- 方法参数。\n\n**Final 类**：当一个类被设置为 `final` 时，它不能被任何类扩展。任何类都无法继承\
  \ `final` 类的任何特性。例如 12.3：\n```java\nfinal class Animal{\n    // some code\n}\n```\n\
  \n**Final 方法**：当一个方法被设置为 `final` 时，它不能被任何子类重写。例如 12.4：\n```java\nclass Animal{\n\
  \    public final void displayColor(){\n        // body of method\n    }\n}\n```\n\
  \n**Final 变量**：当一个变量设置为 `final` 时，它的值不能被改变。例如 12.5：\n```java\nclass Animal{\n  \
  \  public static final String color = \"Blue\";\n    public final void displayColor(){\n\
  \        // body of method\n    }\n}\n```\n\n### abstract\n`abstract` 修饰符适用于：\n\
  - 类和\n- 方法\n\n**抽象类**：如果一个类被声明为 `abstract`，那么该类永远无法被实例化。抽象类可以同时包含抽象方法普通方法。一个类也可以不包含任何抽象方法就是抽象类。如果一个类拥有抽象方法，该类就变成了抽象类。使用\
  \ `abstract` 的唯一目的是为了让类被扩展。\n\n**抽象方法**：`abstract` 方法是那些没有方法体但只有签名的方法。方法体由子类提供。抽象方法永远不能是\
  \ `final`。例如 12.6：\n```java\npublic abstract class SuperAnimal{\n    abstract void\
  \ displayColor(); // abstract method\n}\n```\n**注意**：`abstract` 方法以分号结束。（更多内容见下一章）\n\
  \n### static\n`static` 修饰符适用于：\n- 类，\n- 方法以及\n- 变量。\n\n`static` 变量和方法将独立于为类创建的任何实例而存在。无论类的实例数量有多少，`static`\
  \ 变量和方法只存在一个拷贝（更多细节请参阅下一章。）\n\n### synchronized\n`synchronized` 修饰符适用于方法。`synchronized`\
  \ 方法一次只能被一个线程访问。例如：12.7：\n```java\npublic synchronized void displayColor() { ...\
  \ }\n```\n`synchronized` 修饰符可以与四个访问级别修饰符中的任何一个结合。\n\n### volatile\n声明一个 `volatile`\
  \ Java 变量意味着该变量的值永远不会在线程本地缓存，所有的读取和写入将直接进入“主内存”。`volatile` 只能应用于类型为对象或 `private`\
  \ 的实例变量。`volatile` 对象引用可以为 null。\n```java\npublic volatile int speed = 60; //volatile\
  \ value\n```\n\n### native\n`native` 修饰符适用于方法。`native` 方法表示该方法是在依赖平台的代码上实现的。当需要从\
  \ Java 调用用其他语言编写的库或访问系统资源时，当前需要 `native` 方法。\n\n### strictfp\n`strictfp` 修饰符适用于类和方法。`strictfp`\
  \ 是 Java 编程语言中的关键字，它限制浮点计算以确保在每个平台上获得相同的结果（可移植性）。如果你不使用 `strictfp`，当类文件在不同的平台（16/32/64\
  \ 位处理器）上运行时，会得到不同的输出（浮点值），并且 JVM 实现可以自由地在可用的地方使用额外的精度。`strictfp` 可以用在类、接口和非抽象方法。当应用于方法时，它会导致方法内部的所有计算都使用严格的浮点数学运算。当应用于类时，类内部的所有计算都将使用严格的浮点数学运算。\n\
  ```java\npublic strictfp class MyFclass {\n    // class contents\n}\n```\n这是一个简单的示例。示例\
  \ 12.8：`Test.java` - 用于说明 `strictfp` 修饰符的 Java 程序\n```java\n01 package ch12;\n02\
  \ public class Test\n03 {\n04 public strictfp double sum()\n05 {\n06 double num1\
  \ = 5e+10;\n07 double num2 = 2e+03;\n08 return(num1 + num2);\n09 }\n10 public static\
  \ strictfp void main(String[] args)\n11 {\n12 Test t = new Test();\n13 System.out.println(t.sum());\n\
  14 }\n15 }\n```\n输出：`5.0000002E10`\n**注意** -\n- `strictfp` 非访问修饰符不能应用于变量。\n- `strictfp`\
  \ 不能与 `abstract` 方法一起。\n- `strictfp` 可以与抽象类和接口一起。\n- `strictfp` 不能应用于接口中的任何方法（接口的方法隐式是抽象的）。\n\
  \n\n\n\n\n# 静态类成员\n\n类的每个实例都拥有自己的组字段，这些字段被称为实例字段。因此，你可以创建类的多个实例，并在每个实例的字段中存储不同的值。静态类成员属于类，而不是属于从该类实例化的对象。![](img/Image00124.jpg)图\
  \ 13.1 | 实例字段\n\n### 静态字段\n\n静态字段不属于类的任何实例。当一个值存储在静态字段中时，它不会存储在类的实例中。因此，静态字段属于类而不是类的实例。![](img/Image00125.jpg)图\
  \ 13.2 | 静态字段 类的所有实例共享类静态字段的单一拷贝。无论类可能存在多少个类的实例，内存中都只存在该字段的一个拷贝。让我们来看一个例子。\n\n###\
  \ 示例 13.1 : VarDemo.java\n```java\n01 package ch13;\n02 class VarDemo\n03 {\n04\
  \ static int count=0;\n05 public void increment()\n06 {\n07 count++;\n08 }\n09 public\
  \ static void main(String args[])\n10 {\n11 VarDemo obj1=new VarDemo();\n12 VarDemo\
  \ obj2=new VarDemo();\n13 obj1.increment();\n14 obj2.increment();\n15 System.out.println(\"\
  Obj1: count is= \"+obj1.count);\n16 System.out.println(\"Obj2: count is= \"+obj2.count);\n\
  17 }\n18 }\n```\n**输出**\n```\nObj1: count is= 2\nObj2: count is= 2\n```\n在上面的示例中，类的两个对象都共享静态变量的同一个拷贝，这就是为什么它们显示了相同的\
  \ `count` 值。\n\n### 静态变量初始化\n\n*   静态变量在类加载时初始化。\n*   类中的静态变量在该类的任何对象被创建之前初始化。\n\
  *   类中的静态变量在类的任何任何静态方法之前初始化。\n\n这里是一个使用静态变量的简单示例。\n\n### 示例 13.2 : Count.java\n\
  ```java\n01 public class Count\n02 {\n03 private static int count = 0;\n04 public\
  \ Count()\n05 {\n06 count++;\n07 }\n08 public int getCount()\n09 {\n10 return count;\n\
  11 }\n12 }\n```\n**解释**\n使用静态字段来记录创建的类实例的数量。`private static int count = 0;`\n\n\
  *   这是对名为 `count` 的静态字段的声明。\n*   用值 `0` 显式初始化了 `count` 字段。\n*   此初始化只发生一次，无论创建了多少个类的实例。\n\
  *   Java 自动在所有未初始化的静态成员变量中存储 `0`。此类中的 `count` 字段是显式初始化的，因此任何阅读代码的人都能清楚该字段从值 `0`\
  \ 开始。\n\n`public Count() {… }`\n\n*   构造函数使用 `++` 运算符来增加 `count` 字段的值。\n*   每次创建\
  \ `Count` 类的实例时，都会调用构造函数，`count` 字段就会加 1。\n*   结果是`count` 字段将包含已创建的 `Count` 类的实例数量。\n\
  \n`public int getCount( ) {…}` 返回 `count` 字段中的值。\n\n### 示例 13.3 : StaticDemo.java\
  \ - 与 Count.java 文件同包\n```java\n01 package ch13;\n02 public class StaticDemo\n03\
  \ {\n04 public static void main(String[] args){\n05\n06 int objectCount;\n07\n08\
  \ // 创建三个 Count 类的实例。\n09 Count object1 = new Count();\n10 Count object2 = new Count();\n\
  11 Count object3 = new Count();\n12\n13 // 从类的静态字段获取实例数量。\n14 objectCount = object1.getCount();\n\
  15 System.out.println(objectCount + \" instances of the class were created.\");\n\
  16 }\n17 }\n```\n**输出**\n```\n3 instances of the class were created.\n```\n程序创建了三个由变量\
  \ `object1`、`object2` 和 `object3` 用的 `Count` 类实例。类有三个实例，静态字段只有一个拷贝。![](img/Image00126.jpg)图\
  \ 13.3 | 类的所有实例共享静态字段\n程序调用 `getCount` 方法来检索已创建的实例数量。`objectCount = object1.getInstanceCount(\
  \ );` 程序从 `object1` 调用 `getCount` 方法，任何对象都会返回相同的值。\n\n* * *\n\n## 静态方法\n\n静态方法是不属于类的任何实例的方法。为了将值存储在类的静态字段中，甚至不需要类的实例存在。此外，静态方法不对属于类的任何实例的字段进行操作。相反，它们只能对静态字段进行操作。因此，静态方法属于类而不是类的实例。所以当一个类包含静态方法时，没有必要创建实例即可。下面的示例展示了静态方法的使用。\n\
  \n### 示例 13.4 : Converter.java\n```java\n01 class Converter{\n02 static double metersToCentimeters(double\
  \ m){\n03 return m * 100;\n04 }\n05 static double centimetersToMeters(double c){\n\
  06 return c / 100;\n07 }\n```\n`Converter` 类有两个静态方法 `metersToCentimeters` 和 `centimetersToMeters`。声明为静态，因此可以在不创建实例的情况下调用。你只需要在方法前写上类的名称。`meters\
  \ = Converter.metersToCentimeters(30.0);` 语句调用了 `metersToCentimeters` 方法并将 `10.0`\
  \ 作为参数。\n\n### 示例 13.5 : ConverterTest.java - 使用 Converter 类的程序\n```java\n01 package\
  \ ch13;\n02 import java.text.DecimalFormat;\n03 import java.util.Scanner;\n04\n\
  05 public class ConverterTest{\n06 public static void main(String[] args) {\n07\
  \ String input; // 用于存储输入\n08 double centimeters; // 厘米数\n09 double meters; // 米\n\
  10\n11 // 创建 DecimalFormat 对象\n12 DecimalFormat dml = new DecimalFormat(\"0.00\"\
  );\n13\n14 // 获取厘米数\n15 Scanner sc = new Scanner(System.in);\n16 System.out.println(\"\
  Enter a distance in centimeters\");\n17 input = sc.nextLine();\n18 centimeters =\
  \ Double.parseDouble(input);\n19\n20 // 将厘米数转换为米\n21 meters = Converter.centimetersToMeters(centimeters);\n\
  22 System.out.println(dml.format(centimeters)+ centimeters equals \" +\n23 dml.format(meters)\
  \ + \" meters.\");\n24\n25 meters = Double.parseDouble(input);\n26\n27 // 获取米数\n\
  28 Scanner sc1 = new Scanner(System.in);\n29 System.out.println(\"Enter a distance\
  \ in meters\");\n30 input = sc1.nextLine();\n31 meters = Double.parseDouble(input);\n\
  32\n33 // 将米数转换为厘米\n34 centimeters = Converter.metersToCentimeters(meters);\n35\
  \ System.out.println(dml.format(meters) + \" meters equals \" +\n36 dml.format(centimeters)\
  \ + \" centimeters\");\n37 }\n38 }\n```\n**输出**\n```\nEnter a distance in centimeters\n\
  250\n250.00 centimeters equals 2.50 meters.\nEnter a distance in meters\n2.5\n2.50\
  \ meters equals 250.00 centimeters.\n```\n**重要** - 静态方法对于许多任务非常方便，因为它们根据需要直接从类调用。\
  \ - 它们通常用于创建对数据执行操作但不需要收集和存储数据的工具类。 - 例如，`Converter` 类被用作存放厘米到米及反之转换方法的容器，但不打算存储任何数据。\n\
  **局限性**静态方法无法引用类的非静态成员。这意味着：\n\n*   从静态方法调用的任何方法也必须是静态的。\n*   如果该方法使用了类的任何字段，这些字段也必须是静态的。\n\
  \n\n\n\n\n# 将对象作为方法的参数\n\n要将对象作为方法的参数传递，你传递的是一个对象的引用。例如，你可以将原始数据类型、`String` 对象的引用以及其他类型对象的引用作为参数传递给方法。\n\
  \n## 将原始数据类型作为方法的参数\n\n原始类型参数（如 `int` 或 `float`）是通过按值传递到方法中的。这意味着对参数值的任何更改都只存在于方法内部。当方法返回时，参数就会消失，对参数的任何更改都会丢失，但这不会影响实例变量。这里有一个简单的示例。\n\
  \n### 示例 13.6 : `PassPrimitiveByValue.java` - 将原始数据类型作为方法的参数\n\n```java\n01 public\
  \ class PassPrimitiveByValue {\n02 public static void main(String[] args){\n03 int\
  \ x = 3;\n04\n05 // 以 x 为参数调用 passMethod()\n06 passMethod(x);\n07\n08 // 打印 x 以查看其值是否发生变化\n\
  09 System.out.println(\"After invoking passMethod, x = \" + x);\n10 }\n11 // 在 passMethod()\
  \ 中更改参数\n12 public static void passMethod(int p){\n13 p = 10;\n14 }\n15 }\n```\n\
  \n**输出**\n`After invoking passMethod, x = 3`\n\n#### 解释\n* 该方法的目的是展示更改方法参数不会改变调用者。\n\
  * 第 03 行：`x` 变为 `3`。在整个程序运行期间，它保持为 `3`。\n* 第 06 行：调用 `passMethod()` 方法。值 `3` 被作为参数传递给\
  \ `passMethod()`。\n* 第 13 行：这里（`int p`）是参数，它是 `passMethod()` 的局部变量。当执行语句 `p = 10`\
  \ 时，`p` 的值仅在 `passMethod()` 内部更改为 `10`。这不会影响对象内部的实例变量 `x`。对参数（`p`）值的任何更改只存在于 `passMethod()`\
  \ 方法的作用范围内。\n* 然而，`x` 和 `p` 是不同的，因为传递的是值。\n\n**注意**：当定义一个带参数的方法时，我们不能在不向方法的对应参数传递相应参数的情况下调用该方法。\n\
  \n## 将字符串对象的引用作为方法的参数\n\n既然我们可以定义接收原始数据类型作为参数的方法，我们也可以定义按值（传递引用）接收类对象（或引用数据类型参数，如对象）作为参数。这意味着当方法返回时，传递的引用仍然指向原来的那个对象。这里有一个简单的示例。\n\
  \n### 示例 13.7 : `Record.java` 和 `Test.java` 类\n\n**Record.java 类**\n```java\n01\
  \ package ch13;\n02 public class Record { // 定义 Record 类\n03 int num;\n04 String\
  \ city;\n05 }\n```\n\n**Test.java 类**\n```java\n01 package ch13;\n02 public class\
  \ Test { // 定义 Test 类\n03\n04 // 将 Record 类作为参数传递给 tryObj 方法\n05 public static void\
  \ tryObj(Record r){\n06 r.num = 100;\n07 r.city = \"Omdurman\";\n08 }\n09 public\
  \ static void main(String[] args){\n10 // 创建我们新类 Record 的一个对象，\n11 // 设置其字段，并调用方法\
  \ tryObj\n12 Record id = new Record();\n13 id.num = 2;\n14 id.city = \"Khartoum\"\
  ;\n15 tryObj(id);\n16 System.out.println(id.city + \" \"\n17 + id.num);\n18 }\n\
  19 }\n```\n\n**输出**\n`Omdurman 100`\n\n#### 解释\n* 打印语句输出了 `Omdurman 100`，在这种情况下对象被更改了。为什么呢？\n\
  * `id` 的引用是方法的参数，因此无法通过该方法更改该引用；即，它不能让 `id` 指向一个不同的 `Record` 对象。\n* 但方法可以使用该引用对它已经引用的\
  \ `Record` 执行任何允许的操作。\n\n**注意**\n- 在对象外部更改实例变量的值是一种良好的编程风格。\n- 通常情况下，对象应该有一个方法来设置其实例变量的值。\n\
  - 如果对象的字段具有适当的访问权限，对象的字段值在方法中**可以被更改**。\n\n然而，我们无法通过重新赋值引用或在引用上调用 `new` 来让对象参数或引用指向不同的对象。例如示例\
  \ 13.8，以下方法将无法按预期工作：\n\n```java\n01 public void createRecord\n    (Record r, int\
  \ n, String name)\n02 {\n03 r = new Record();\n04 r.num = n;\n05 r.name = name;\n\
  06 }\n```\n\n我们仍然可以将 `Record` 的初始化封装在一个方法中，但我们需要返回该引用。\n\n```java\n01 public Record\
  \ createRecord(int n, String name)\n02 {\n03 Record r = new Record();\n04 r.num\
  \ = n;\n05 r.name = name;\n06 return r;\n07 }\n```\n\n## 将其他对象的引用作为方法的参数\n\n当变量作为参数传递给方法时，它是按值传递的。这意味着对参数的任何更改都不会影响调用者。然而，当引用作为参数传递给方法时，该方法可以访问它所引用的对象。这是一个简单的示例\
  \ `Square.java`。\n\n### 示例 13.9 : `Square` 类\n\n```java\n01 package ch13;\n02 public\
  \ class Square {\n03 double length;\n04 double width;\n05\n06 Square(double len,\
  \ double w){\n07 length = len;\n08 width = w;\n09 }\n10\n11 public void setLength(double\
  \ len){\n12 length = len;\n13 }\n14\n15 public void setWidth(double w){\n16 width\
  \ = w;\n17 }\n18\n19 public double getLength() {\n20 return length;\n21 }\n22\n\
  23 public double getWidth() {\n24 return width;\n25 }\n26\n27 public double getArea()\
  \ {\n28 return length * width;\n29 }\n30 }\n```\n\n### 示例 13.10 : `SquareDemo.java`\n\
  \n```java\n01 package ch13;\n02 public class SquareDemo{\n03 public void main(String[]\
  \ args){\n04 // 创建一个 Square 对象。\n05 Square box = new Square(16.0,10.0);\n06\n07\
  \ // 显示对象的内容。\n08 System.out.println(\"Contents of the box object:\");\n09 System.out.println(\"\
  Length :\" + box.getLength() +\n10 \" Width : \" + box.getWidth());\n11\n12 // 将对象的引用传递给\n\
  13 // displaySquare 方法。\n14 displaySquare(box);\n15\n16 // 再次显示对象的内容。\n17 System.out.println(\"\
  \\nNow the contents of the\"\n18 \"box object are:\");\n19 System.out.println(\"\
  Length :\" + box.getLength() +\n20 \" Width : \" + box.getWidth());\n21 }\n22\n\
  23 public static void displaySquare(Square s) {\n24 // 显示长度和宽度。\n25 System.out.println(\"\
  Length :\" + s.getLength() +\n26 \" width: \" + s.getWidth());\n27 }\n28 }\n```\n\
  \n**输出**\n`Contents of the box object:\nLength : 16.0 Width : 10.0\n\nNow the contents\
  \ of the box object are:\nLength : 0.0 Width : 0.0`\n\n### 示例 13.11 : `SquareDemo2.java`\n\
  \n```java\n01 public class SquareDemo2\n02 {\n03 public void main(String[] args)\n\
  04 {\n05 // 创建一个 Square 对象。\n06 Square box = new Square(12.0,5.0);\n07\n08 // 显示对象的内容。\n\
  09 System.out.println(\"Contents of the box object:\");\n10 System.out.println(\"\
  Length :\" + box.getLength() +\n11 \" Width : \" + box.getWidth());\n12\n13 // 将对象的引用传递给\n\
  14 // changeSquare 方法。\n15 changeSquare(box);\n16\n17 // 再次显示对象的内容。\n18 System.out.println(\"\
  \\nNow the contents of the\"\n19 \"box object are:\");\n20 System.out.println(\"\
  Length :\" + box.getLength() +\n21 \" Width : \" + box.getWidth());\n22 }\n23\n\
  24 public static void changeSquare(Square s)\n25 {\n26 s.setLength(0.0);\n27 s.setWidth(0.0);\n\
  28 }\n29 }\n```\n\n**输出**\n`Contents of the box object:\nLength : 12.0 Width : 5.0\n\
  \nNow the contents of the box object are:\nLength : 0.0 Width : 0.0`\n\n**注意**：在编写接收引用变量值作为参数的方法时，你必须小心不要意外修改了变量所引用的对象的内容。\n\
  \n\n\n\n\n# 从方法返回对象\n\n在 Java 编程中，方法可以返回任何类型的数据，包括你创建的类类型。方法可以返回：\n\n* 一个 `int`、`double`、`float`\
  \ 或其他原始数据类型。\n* 对象的引用。\n\n在接下来的示例中，我们有一个 `ReOb` 类，当我们调用它的方法时，它会返回一个对象。\n\n### 示例\
  \ 13.12 : `ReOb.java` - 从 method01 返回对象\n\n```java\n01 package ch13;\n02 static\
  \ class Square {\n03 int length;\n04 int breadth;\n05\n06 Square(int x,int y) {\n\
  07 length = x;\n08 breadth = y;\n09 }\n10\n11 Square getSquareObj(){\n12 Square\
  \ squ = new Square(15,30);\n13 return squ;\n14 }\n15 }\n```\n\n```java\nReObDemo.java\n\
  01 package ch13;\n02 import ch13.ReOb.Square;\n03\n04 class ReObDemo{\n05 public\
  \ static void main(String args[]) {\n06 // Square ob1 = ReOb.Square(70, 90);\n07\
  \ Square ob1 = new Square(70, 90);\n08 Square ob2;\n09\n10 ob2 = ob1.getSquareObj();\n\
  11 System.out.println(\"ob1.length : \" + ob1.length);\n12 System.out.println(\"\
  ob1.breadth: \" + ob1.breadth);\n13\n14 System.out.println(\"ob2.length : \" + ob2.length);\n\
  15 System.out.println(\"ob2.breadth: \" + ob2.breadth);\n16 }\n17 }\n```\n\n**输出**\n\
  ```\nob1.length : 70\nob1.breadth: 90\nob2.length : 15\nob2.breadth: 30\n```\n\n\
  ### 解析\n* 我们调用了方法 `getSquareObj()`，该方法创建了调用它的类的对象。\n* 所有对象都使用 `new` 动态分配，你不需要担心对象因为创建它的方法结束而超出作用范围。\n\
  * 只要程序中某处对它有引用，该对象就会继续存在。当没有引用指向它时，该对象将在下一次垃圾收集发生时被回收。\n\n---\n\n# toString 方法\n\
  \n`toString` 方法返回一个表示对象状态的 `String`。对象的状态是在任意时刻存储在对象字段中的数据。\n\n#### 语法\n```java\n\
  String toString()\nstatic String toString(int i)\n```\n\n#### 返回值\n* `toString()`\
  \ - 返回一个表示此 `Integer` 值的 `String` 对象。\n* `toString(int i)` - 返回一个表示指定的 `Integer`\
  \ 值的 `String` 对象。\n\n下面的示例展示了 `toString()` 方法用法。\n\n### 示例 13.13 : `ToString.java`\
  \ - 使用 `toString` 方法\n\n```java\n01 package ch13;\n02 public class TestString{\n\
  03 public static void main(String[] args){\n04 Double d = 12.5;\n05\n06 System.out.println(d.toString());\n\
  07 System.out.println(Double.toString(15.6));\n08\n09 System.out.println(d.getClass().getSimpleName());\n\
  10 System.out.println(d.getClass().getName());\n11 }\n12 }\n```\n\n**输出**\n```\n\
  12.5\n15.6\nDouble\njava.lang.Double\n```\n\n注意，我正在重写于 `Object` 类中存在的 `toString`\
  \ 方法。\n\n---\n\n## 总结\n\n* 类的每个实例都有其自己的一组字段，被称为实例字段。因此，你可以创建一个类的多个实例，并并在每个实例的字段中存储不同的值。\n\
  * `static` 类成员属于类本身，而不属于从该类实例化的对象。\n* `static` 字段不属于类的任何一个实例。当一个值被存储在 `static` 字段中时，它不会被存储在类的实例中。因此，`static`\
  \ 字段属于类而不是类的实例。\n* 类的 `static` 字段的一个副本由该类的所有实例共享。无论存在多少个该类的实例，内存中只有一个该字段的副本。\n*\
  \ `static` 方法是不属于类的任何实例的方法。为了在类的 `static` 字段中存储值，甚至不需要该类的实例存在。\n* `static` 方法不能引用类的非静态成员。\n\
  * `static` 方法对于许多任务来说非常方便，因为可以根据需要直接从类进行调用。它们通常用于创建工具类，这些工具类对数据执行操作，但不需要收集和存储数据。\n\
  \n---\n\n## 第 14 章：Java 中的 ArrayList\n\n### 简介\n`ArrayList` 类似于数组，并允许你存储对象。与数组不同，`ArrayList`\
  \ 对象的大小会自动调整，以适应在其中存储的项数量。`ArrayList` 类用于存储和检索对象。一旦创建了 `ArrayList`，你就可以将其看作存储对象的容器。\n\
  \n### ArrayList 的优势\n* 随着项的添加，`ArrayList` 对象会自动扩展。\n* 除了向 `ArrayList` 添加项，你还可以移除项。\n\
  * 随着项的移除，`ArrayList` 对象会自动缩小。\n\n## 初始化并使用 ArrayList\n`ArrayList` 有无参构造函数，所以你可以初始化它。\n\
  \n#### 语法\n```java\nArrayList<T> obj = new ArrayList<>();\nobj.add(\"One\");\nobj.add(\"\
  Two\");\n```\n\n### 示例 14.1 : `ArrayListEx.java` - 初始化\n\n```java\n01 package ch13;\n\
  02\n03 class ArrayListEx{\n04 public static void main(String[] args){\n05 ArrayList<String>\
  \ books = new ArrayList<>();\n06 books.add(\"Java\");\n07 books.add(\"C++\");\n\
  08 books.add(\"C\");\n09 System.out.println(\"Books Stored in Array are: \" + books);\n\
  10 }\n```\n\n**输出**\n```\n[Java, C++, C]\n```\n\n## 向 ArrayList 添加/元素\n`add` 方法用于向\
  \ `ArrayList` 添加元素。让我们来看示例。\n\n### 示例 14.2 : `Languages.java` - 向 ArrayList 添加项\n\
  \n```java\n01 package ch13;\n02\n03 class Languages {\n04 public static void main(String[]\
  \ args){\n05 ArrayList<String> languages = new ArrayList<String>();\n06 languages.add(\"\
  Arabic\");\n07 languages.add(\"English\");\n08 languages.add(\"Hindi\");\n09 languages.add(\"\
  French\");\n10 System.out.println(\"List of Languages: \" + languages);\n11\n12\
  \ ArrayList <Integer> years = new ArrayList <Integer>();\n13 years.add(2011);\n\
  14 years.add(2012);\n15 years.add(2013);\n16 years.add(2014);\n17 years.add(2015);\n\
  18 years.add(2016);\n19 years.add(2017);\n20 years.add(2018);\n21 System.out.println(\"\
  List of Years: \" + years);\n22 }\n23 }\n```\n\n**输出**\n```\nList of Languages:\
  \ [Arabic, English, Hindi, French]\nList of Years: [2011, 2012, 2013, 2014, 2015,\
  \ 2016, 2017, 2018]\n```\n\n### 解析\n* 第 05 行：创建一个新的 `ArrayList` 对象并将其地址存储在 `languages`\
  \ 变量中。\n* 第 06-09 行：将 `String` 对象添加到 `languages` 列表中。\n* 第 12 行：创建一个类型为 `Integer`\
  \ 的新 `ArrayList` 对象。\n\n\n\n\n\n# 在 ArrayList 的特定索引处添加元素\n\n如之前所示，`add` 方法将一个项添加到\
  \ `ArrayList` 对象的最后一个位置或列表末尾。`ArrayList` 类有一个 `add` 方法的重载版本，该版本允许您在特定索引（index）处添加一个项。这会将该项插入到\
  \ `ArrayList` 对象的特定位置。\n\n#### 语法\n```java\npublic void add(int index, Object element)\n\
  ```\n\n### 示例 14.3 : AddMethodEx.java\n```java\n01 package ch14;\n02 import java.util.ArrayList;\n\
  03 public class AddMethodEx {\n04 public static void main(String[] args){\n05 //\
  \ String 类型的 ArrayList\n06 ArrayList<String> country = new ArrayList<String>();\n\
  07 // 简单的 add() 方法用于在末尾添加元素\n08 country.add(\"India\");\n09 country.add(\"Egypt\"\
  );\n10 country.add(\"Canada\");\n11 country.add(\"China\");\n12\n13 // 向第 3 位置添加元素\n\
  14 // 第 3 个位置 = 索引 2，因为索引从 0 开始\n15 country.add(2, \"USA\");\n16 System.out.println(\"\
  添加字符串 USA 后的元素: \" + country);\n17\n18 // 向第 1 位置添加字符串\n19 country.add(0, \"Sudan\"\
  );\n20 System.out.println(\"添加字符串 Sudan 后的元素: \" + country);\n21 }\n22 }\n```\n\
  **输出**\n```\n添加字符串 USA 后的元素: [India, Egypt, USA, Canada, China]\n添加字符串 Sudan 后的元素:\
  \ [Sudan, India, Egypt, USA, Canada, China]\n```\n\n当在索引 `2` 处添加新项时，之前存储在索引 `2`\
  \ 处的项将移动到索引 `3`。当在特定索引处添加项时，其后的项都会向上移动位置以容纳新项。这意味着新项之后的每个项的索引都会增加一。\n\n**注意**：如果使用无效的索引调用\
  \ `add` 方法，将发生错误。\n\n## 将集合元素添加到 ArrayList\n\n在这一部分，我们将看到 `addAll()` 方法用法。该方法用于将一个\
  \ `ArrayList` 的所有元素添加到另一个 `ArrayList` 中。元素将被添加到列表的末尾。\n\n#### 语法\n```java\npublic\
  \ boolean addAll(Collection c)\n```\n它将指定集合 `c` 的所有元素添加到当前列表中。\n\n### 示例 14.4 :AddAllEx.java\n\
  ```java\n01 import java.util.ArrayList;\n02\n03 public class AddAllEx {\n04 public\
  \ static void main(String[] args){\n05 // String 类型的 ArrayList1\n06 ArrayList<String>\
  \ numbers1 = new ArrayList<String>();\n07 numbers1.add(\"One\");\n08 numbers1.add(\"\
  Three\");\n09 numbers1.add(\"Five\");\n10 System.out.println(\"addAll 前的 ArrayList1:\
  \ \" + numbers1);\n11\n12 // String 类型的 ArrayList2\n13 ArrayList<String> numbers2\
  \ = new ArrayList<String>();\n14 numbers2.add(\"Two\");\n15 numbers2.add(\"Four\"\
  );\n16\n17 // 将 ArrayList2 添加到 ArrayList1\n18 numbers1.addAll(numbers2);\n19 System.out.println(\"\
  addAll 后的 ArrayList1: \" + numbers1);\n20 }\n21 }\n```\n**输出**\n```\naddAll 前的 ArrayList1:\
  \ [One, Three, Five]\naddAll 后的 ArrayList1: [One, Three, Five, Two, Four]\n```\n\
  \n## 将所有列表元素复制到 ArrayList\n\n在这里我们将看到 `add` 方法的另一种变体，它将 `(c)` 的所有元素添加到列表的指定索引处。\n\
  \n#### 语法\n```java\npublic boolean addAll(int index, Collection c )\n```\n\n###\
  \ 示例 14.5 : CopyAll.java\n在此示例中，我们有两个 String 类型的 `ArrayList`，我们正将第二个 `ArrayList`\
  \ 的元素添加到第一个 `ArrayList` 的第 3 个位置（`index =2`）。\n```java\n01 import java.util.ArrayList;\n\
  02\n03 public class CopyAll {\n04 public static void main(String[] args){\n05 //\
  \ String 类型的 ArrayList1\n06 ArrayList<String> numbers1 = new ArrayList<String>();\n\
  07 numbers1.add(\"One\");\n08 numbers1.add(\"Four\");\n09 numbers1.add(\"Five\"\
  );\n10 System.out.println(\"addAll 前的 ArrayList1: \" + numbers1);\n11\n12 // String\
  \ 类型的 ArrayList2\n13 ArrayList<String> numbers2 = new ArrayList<String>();\n14 numbers2.add(\"\
  Two\");\n15 numbers2.add(\"Three\");\n16\n17 // 将 ArrayList2 添加到 ArrayList1 的第 2\
  \ 位置（index = 1）\n18 numbers1.addAll(1, numbers2);\n19 System.out.println(\"在第 3\
  \ 位置添加 ArrayList2 后的 ArrayList1: \" +\n20 numbers1);\n21 }\n22 }\n```\n**输出**\n\
  ```\naddAll 前的 ArrayList1: [One, Four, Five]\n在第 3 位置添加 ArrayList2 后的 ArrayList1:\
  \ [One, Two, Three, Four, Five]\n```\n\n## 循环 ArrayList\n\n之前我们分享了一个 `ArrayList`\
  \ 示例以及如何在 Java 中初始化 `ArrayList`。在这一节，我们将分享如何在 Java 中迭代（循环）`ArrayList`。循环 `ArrayList`\
  \ 有四种方法——：\n\n1. For 循环 (For Loop)\n2. 增强型 for 循环 (Advanced for loop)\n3. While\
  \ 循环 (While Loop)\n4. 迭代器 (Iterator)\n\n让我们看看下面的示例 – 我使用了所有提到的方法来遍历列表。\n\n### 示例\
  \ 14.6 : AllLoopEx.java\n```java\n01 import java.util.ArrayList;\n02 import java.util.Iterator;\n\
  03\n04 public class AllLoopEx {\n05 public static void main(String[] args){\n06\
  \ ArrayList<Integer> arrlist = new ArrayList<Integer>();\n07 arrlist.add(10);\n\
  08 arrlist.add(20);\n09 arrlist.add(30);\n10\n11 // For 循环遍历 arrlist\n12 System.out.println(\"\
  For loop\");\n13 for (Integer num: arrlist){\n14 System.out.println(num);\n15 }\n\
  16\n17 // While 循环遍历 ArrayList\n18 System.out.println(\"While loop\");\n19 int count\
  \ = 0;\n20 while (arrlist.size() > count){\n21 System.out.println(arrlist.get(count));\n\
  22 count++;\n23 }\n24\n25 // Iterator 遍历 ArrayList\n26 System.out.println(\"Iterator\"\
  );\n27 Iterator iter = arrlist.iterator();\n28 while (iter.hasNext()){\n29 System.out.println(iter.next());\n\
  30 }\n31 }\n32\n**输出**\n```\nFor loop\n10\n20\n30\nWhile loop\n10\n20\n30\nIterator\n\
  10\n20\n30\n```\n\n## ArrayList 的长度\n\n`ArrayList` 类有一个 `size()` 方法可以确定 `ArrayList`\
  \ 中项的数量。它以 `int` 类型返回数量。\n\n#### 语法\n```java\npublic int size()\n```\n\n### 示例 14.7\
  \ : SizeEx.java\n以下示例显示了 `ArrayList` 中项的数量。\n```java\n01 import java.util.ArrayList;\n\
  02\n03 public class SizeEx {\n04 public static void main(String[] args){\n05 ArrayList<Integer>\
  \ num = new ArrayList<Integer>();\n06 System.out.println(\"Initial Size: \" + num.size());\n\
  07\n08 num.add(10);\n09 num.add(11);\n10 num.add(12);\n11 System.out.println(\"\
  Size after additions: \" + num.size());\n12\n13 num.add(13);\n14 num.add(14);\n\
  15 num.add(15);\n16 System.out.println(\"Size after another additions: \" + num.size());\n\
  17\n18 num.remove(0); // 删除 10\n19 num.remove(1); // 删除 12\n20 System.out.println(\"\
  Size after remove operations: \" +\n21 num.size());\n22\n23 System.out.println(\"\
  Final ArrayList\");\n24 for (int number: num){\n25 System.out.println(number);\n\
  26 }\n27 }\n```\n**输出**\n```\nInitial Size: 0\nSize after additions: 3\nSize after\
  \ another additions: 6\nSize after remove operations: 4\nFinal ArrayList\n11\n13\n\
  14\n15\n16\n```\n\n## 从 ArrayList 的指定索引处删除元素\n\n`remove()` 方法用于从列表中删除指定索引处）的元素。它会删除元素并返回该元素本身。\n\
  \n#### 语法\n```java\npublic Object remove(int index)\n```\n这是一个对应的示例。\n\n### 示例 14.8\
  \ : RemoveEx.java\n```java\n01 import java.util.ArrayList;\n02\n03 public class\
  \ RemoveEx {\n04 public static void main(String[] args){\n05 // String ArrayList\n\
  06 ArrayList<String> letter = new ArrayList<String>();\n07 letter.add(\"A\");\n\
  08 letter.add(\"B\");\n09 letter.add(\"C\");\n10 letter.add(\"D\");\n11 System.out.println(\"\
  ArrayList before remove: \");\n12 for (String var: letter){\n13 System.out.println(var);\n\
  14 }\n15\n16 // 删除第一个元素 (A)\n17 letter.remove(0);\n18\n19 // 从剩余列表中删除第二个元素 (C)\n\
  20 letter.remove(1);\n21 System.out.println(\"ArayList after remove: \");\n22 for\
  \ (String var2: letter){\n23 System.out.println(var2);\n24 }\n25 }\n26 }\n```\n\
  **输出**\n```\nArrayList before remove:\nA\nB\nC\nD\nArayList after remove:\nB\nD\n\
  ```\n\n\n\n\n\n## DNOTES\n\n- 当索引为 `0` 的项被删除时，之前存储在索引 `1` 的项将位置移动到索引 `0`。\n- 当从\
  \ `ArrayList` 中删除一个项时，其后的项将位置向下移动，以填补空隙。\n- 这意味着在被删除项之后的，每个项的索引都将减一。\n- 如果你使用无效索引调用\
  \ `remove` 方法，将发生错误。如果指定的索引小于零或大于列表的大小（`ArrayList` 的 `size` 索引），则会抛出 `IndexOutOfBoundsException`。\n\
  \n## 从 ArrayList 中删除指定的元素\n\n`remove(Object obj)` 方法从列表中删除指定的对象。\n\n#### 语法\n```java\n\
  public boolean remove(Object obj)\n```\n**注意**：如果指定的元素不存在于列表中，则它将返回 `false`。如果列表中存在重复元素，它将从列表中删除指定元素的首次出现。\n\
  \n### 示例 14.9：RemoveEx2.java\n在这个示例中，我们有一个 `ArrayList<String>`，我们正准备从列表中删除几个字符串。\n\
  \n```java\n01 import java.util.ArrayList;\n02\n03 public class RemoveEx2 {\n04 public\
  \ static void main(String[] args){\n05 // String ArrayList\n06 ArrayList<String>\
  \ letter = new ArrayList<String>();\n07 letter.add(\"A\");\n08 letter.add(\"B\"\
  );\n09 letter.add(\"C\");\n10 letter.add(\"D\");\n11 System.out.println(\"ArrayList\
  \ before remove: \");\n12 for (String var: letter){\n13 System.out.println(var);\n\
  14 }\n15 // 从 ArrayList 中删除元素 C\n16 letter.remove(\"C\");\n17\n18 // 从 ArrayList\
  \ 中删除元素 A\n19 letter.remove(\"A\");\n20\n21 // 从 ArrayList 中删除元素 X\n22 letter.remove(\"\
  X\");\n23 // 此元素不在列表中，所以它应该返回 false\n24 boolean b = letter.remove(\"X\");\n25 System.out.println(\"\
  Element X removed: \" + b);\n26\n27 System.out.println(\"ArrayList after remove:\
  \ \");\n28 for (String var2: letter){\n29 System.out.println(var2);\n30 }\n31 }\n\
  32 }\n```\n**输出**\n```\nArrayList before remove:\nA\nB\nC\nD\nElement X removed:\
  \ false\nArrayList after remove:\nB\nD\n```\n\n## 替换元素\n\n`ArrayList` 类的 `set()`\
  \ 方法可以用于用另一个项替换或更新特定索引处的项。`ArrayListDemo.java` 演示了这一点。\n\n### 示例 14.10：ArrayListDemo.java\n\
