  \ 方法返回 String 对象的引用\n\n* *\n\n## 总结\n*   方法是组合在一起的语句集合，用于执行特定任务。\n*   Java 有两种类型的方法：`void`\
  \ 方法和返回值的方法。`void` 方法只是执行一个任务然后结束。返回值的方法不仅执行任务，还将值传回给调用它的代码。\n*   要创建一个方法，你必须编写它的定义，由两个通用部分组成：方法头和方法体。\n\
  *   方法在被调用时执行。在 Java 中，我们通过指定它的名称来调用方法。\n*   方法可以写成接受参数。发送到方法的值称为参数。在方法头中，这些项被称为形式。\n\
  *   在 Java 中，所有原始数据类型的参数都是按值传递的，这意味着只有参数值的副本被传递到参数变量中。\n*   在 Java 中，我们可以编写接受引用的方法。\n\
  （此处省略了重复性总结，已关注核心逻辑）\n\n---\n\n## 第二部分：面向对象编程\n\n#### 类与对象\n### 引言\nJava 是一种面向对象的语言。面向对象编程是一种与类、对象、继承、多态等概念相关的风格。如果我们考虑现实世界，我们周围有很多对象，猫、汽车等。每个类都有一个属性（状态）和一个功能（行为）。如果我们考虑一个人类，它的属性是姓名、体重、颜色，功能是行走、进。。\n\
  \n![](img/Image00113.jpg)图 9.1 | 类与对象每个类都有 -\n*   与类相关的属性（字段或特征）。例如：姓名、大小、位置和颜色。\n\
  *   类的方法（功能）。例如：行走、说话、进、开门。\n\n#### 类创建\n正如我所说，类是对象的蓝图。当你创建一个类时，你必须告诉 Java 该类的特征。你通过使用\
  \ `class` 关键字以及类名来定义类，如下：\n\n```java\nclass ClassName {\n}\n```\n\n类定义从关键字 `class`\
  \ 开始，后面是类名。类体用大括号 `{` 和 `}`标记，就像任何其他程序块一样。在这种情况下，类体是空的。\n\n如果你将这些行保存到名为 `MyClass.java`\
  \ 的文件中，可以将类编译为 `.class` 文件，尽管如果你尝试运行它，它也不会执行任何操作。\n\n#### 为类声明字段\n你为类声明字段的方式与在程序中声明任何变量一样。\n\
  \n```java\nclass ClassName{\n    type instance-variable1;\n    type instance-variable2\n\
  }\n```\n\n这是一个简单的示例。示例 9.1：声明一个整数类型的数据类型\n\n```java\nclass ClassName {\n    int\
  \ fieldOne;\n}\n```\n\n#### 解释\n*   **第 03 行** 声明了一个 `int` 类型的字段。现在 `fieldOne` 是\
  \ `ClassName` 类的字段。该字段默认情况下只能被同一包中的方法访问。你可以通过 `public`、`protected` 和 `private` 关键字来更改这种访问规则。\n\
  *   `public` 数据字段可以被程序的任何部分访问，无论是在定义它的类的内部还是外部。\n*   `protected` 数据字段只能从类内部或从派生类（子类）内部访问。\n\
  *   `private` 数据字段甚至无法被派生类访问。\n\n\n\n\n\n## 定义方法\n\n方法的声明为编译器提供了许多关于该方法的信息。方法声明包含了诸如信息，如方法的名称、方法的返回类型、方法所需的参数数量和类型，以及其他哪些类和对象可以调用该方法。\n\
  \n方法声明中唯一两个要求的元素是方法名和方法返回的数据类型。\n\n#### 语法\n```java\n01 class ClassName{\n03 type\
  \ instance-variable1;\n04 type instance-variable2;\n06 type method-name1 (parameter-list){\n\
  07 // body of method.\n08 }\n09 type method-name2 (parameter-list){\n10 // body\
  \ of method.\n11 }\n12 }\n```\n\n### 示例 9.2\n以下代码在 `MyClass` 类中声明了一个名为 `SetField`\
  \ 的方法，该方法不返回值：\n```java\n01 class MyClass\n02 {\n03 private int fieldOne;\n04\n\
  05 public void SetField(int value)\n06 {\n07 fieldOne = value;\n08 }\n09 }\n```\n\
  \n#### 解释\n*   第 01 行：定义 `MyClass` 类。\n*   第 03 行：声明类的 `fieldOne` 字段。\n*   第 05\
  \ 行：定义 `SetField()` 方法。\n*   第 07 行：将字段设置为传递给 `SetField()` 的值。\n\n**注意**：所有类字段都应该声明为\
  \ `private`（私有）。\n\n***\n\n# 关于类类的说明\n\n*   `class` 是 Java 中的关键字，用于在 Java 中创建类。\n\
  *   类名是用户定义类的名称。当为同一个类创建多个对象时，所有对象都提供相同的实例变量副本。\n*   访问修饰符（Access specifier）可以应用于实例变量，例如\
  \ `public`（公共）、`private`（私有）。\n*   实例变量是该类的类变量。\n*   不同的对象其实例变量具有不同的值。\n*   实例变量也被称为\
  \ `Fields`（字段）。\n*   实例方法与类相关的方法。类方法可以声明为 `public` 或 `private`。这些方法用于操作类数据，即类变量。\n\
