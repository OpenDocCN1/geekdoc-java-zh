  \ 1 Name: Jasmine\nIndex: 2 Name: Nuha\n```\n\n***\n\n### ArrayList 的排序\n\n### ArrayList<String>\
  \ 的排序\n这里我们对 String 类型的 `ArrayList` 进行排序。我们通过简单调用 `Collections.sort(arraylist)`\
  \ 方法来实现。输出列表将按字母排序。\n\n### 示例 14.11：SortStringEx.java\n```java\n01 import java.util.ArrayList;\n\
  02 import java.util.Collections;\n03\n04 public class SortStringEx {\n05 public\
  \ static void main(String[] args){\n06 ArrayList<String> countries = new ArrayList<String>();\n\
  07 countries.add(\"Sudan\");\n08 countries.add(\"Palestine\");\n09 countries.add(\"\
  India\");\n10 countries.add(\"Egypt\");\n11\n12 // 未排序的列表\n13 System.out.println(\"\
  Before Sorting: \");\n14 for(String counter: countries){\n15 System.out.println(counter);\n\
  16 }\n17\n18 // 排序语句\n19 Collections.sort(countries);\n20\n21 // 排序后的列表\n22 System.out.println(\"\
  After Sorting: \");\n23 for (String counter: countries){\n24 System.out.println(counter);\n\
  25 }\n26 }\n```\n**输出**\n```\nBefore Sorting:\nSudan\nPalestine\nIndia\nEgypt\n\
  After Sorting:\nEgypt\nIndia\nPalestine\nSudan\n```\n\n### ArrayList 的排序\n同样的 `sort()`\
  \ 方法也可以用于 `Integer`。\n\n### 示例 14.12：SortInteger.java\n```java\n01 import java.util.ArrayList;\n\
  02 import java.util.Collections;\n03\n04 public class SortInteger {\n05 public static\
  \ void main(String[] args){\n06 ArrayList<Integer> num = new ArrayList<>();\n07\
  \ num.add(30);\n08 num.add(20);\n09 num.add(10);\n10\n11 // 未排序的列表\n12 System.out.println(\"\
  Before Sorting: \");\n13 for (int counter: num){\n14 System.out.println(counter);\n\
  15 }\n16\n17 // 排序语句\n18 Collections.sort(num);\n19\n20 // 排序后的列表\n21 System.out.println(\"\
  After Sorting: \");\n22 for (int counter: num){\n23 System.out.println(counter);\n\
  24 }\n25 }\n```\n**输出**\n```\nBefore Sorting:\n30\n20\n10\nAfter Sorting:\n10\n\
  20\n30\n```\n\n### ArrayList 的倒序排序\n我们将学习如何倒序排序 `ArrayList`。我们结合 `Collections.reverseOrder()`\
  \ 使用 `sort()`。这样列表首先按升序排序，然后进行反转。\n\n### 示例 14.13：SortArrayList.java\n```java\n\
  01 import java.util.ArrayList;\n02 import java.util.Collections;\n03\n04 public\
  \ class SortArrayList {\n05 public static void main(String[] args){\n06 ArrayList<String>\
  \ al = new ArrayList<>();\n07 al.add(\"A\");\n08 al.add(\"B\");\n09 al.add(\"C\"\
  );\n10 al.add(\"D\");\n11\n12 // 未排序的列表：排序前的内容\n13 System.out.println(\"Before Sorting:\
  \ \");\n14 for (String str: al){\n15 System.out.println(str);\n16 }\n17\n18 // 倒序排序\n\
  19 Collections.sort(al, Collections.reverseOrder());\n20\n21 // 倒序排序后的列表\n22 System.out.println(\"\
  ArrayList in descending order: \");\n23 for (String str: al){\n24 System.out.println(str);\n\
  25 }\n26 }\n```\n**输出**\n```\nBefore Sorting:\nA\nB\nC\nD\nArrayList in descending\
  \ order:\nD\nC\nB\nA\n```\n\n## 使用 comparable 和 comparator 接口排序 ArrayList\n我们通常使用\
  \ `Collections.sort()` 方法对列表。在本节中，我们将学习如何使用 `comparable` 和 `comparator` 接口根据属性或数据成员对对象\
