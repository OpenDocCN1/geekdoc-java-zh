  \        // 降序\n        //return pubYear2-pubYear1;\n    }\n}\n```\n\n### 示例 14.24\
  \ : PageNoComparator.java\n```java\npackage ch14;\n\nimport java.util.Comparator;\n\
  \npublic class PageNoComparator implements Comparator<Book4> {\n    /* 用于按页码排序的比较器\
  \ */\n    @Override\n    public int compare(Book4 o1, Book4 o2) {\n        int pageNo1\
  \ = o1.getPageNo();\n        int pageNo2 = o2.getPageNo();\n\n        // 升序\n  \
  \      return pageNo1-pageNo2;\n    }\n}\n```\n\n### 示例 14.25 : Test.java（Test 方法）\n\
  ```java\npackage ch14;\n\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
  \npublic class Test {\n    public static void main(String[] args) {\n        ArrayList<Book4>\
  \ list =\n            new ArrayList<Book4>();\n        list.add(new Book4(\"C Programming\"\
  , 552, 2007));\n        list.add(new Book4(\"How to Design Classes\", 666, 2012));\n\
  \        list.add(new Book4(\"Modern C\", 222, 2015));\n\n        // 按年份排序\n   \
  \     Collections.sort(list, new PubYearComparator());\n        for (Book4 str1:\
  \ list) {\n            System.out.println(str1);\n        }\n\n        // 按页数排序\n\
  \        Collections.sort(list, new PageNoComparator());\n        for (Book4 no:\
  \ list) {\n            System.out.println(no);\n        }\n    }\n}\n```\n**输出：**\n\
  ```\nBook Name = C Programming, Page No = 552, Publish Year = 2007\nBook Name =\
  \ How to Design Classes, Page No = 666, Publish Year = 2012\nBook Name = Modern\
  \ C, Page No = 222, Publish Year = 2015\nBook Name = Modern C, Page No = 222, Publish\
  \ Year = 2015\nBook Name = C Programming, Page No = 552, Publish Year = 2007\nBook\
  \ Name = How to Design Classes, Page No = 666, Publish Year = 2012\n```\n\n## Comparable\
  \ vs Comparator\n\n| Comparable 接口 | Comparator 接口 |\n| :--- | :--- |\n| 用于提供单一排序方式。逻辑上与对象进行比较。\
  \ | 用于提供不同的排序方式。逻辑上比较两个对象。 |\n| 它包含一个方法 - `compareTo()`。 | 它包含两个方法 `compare()` 和\
  \ `equals()`。 |\n| `compareTo()` 方法负责排序。 | `compare()` 方法负责排序。 |\n| 使用 Comparable\
  \ 时类需要实现它。 | 使用 Comparator 不需要对类进行任何修改。 |\n| 定义在 `java.lang` 包中。 | 定义在 `java.util`\
  \ 包中。 |\n\n`Comparable` 接口和 `Comparator` 接口都用于对对象的属性进行排序。我们可以使用任何接口进行排序，但建议选择比较器，它可以同时处理。\n\
  \n## 获取 ArrayList 子列表\n\n要获取 `ArrayList` 的子列表，我们使用 `ArrayList` 类的 `subList` 方法。\n\
  \n语法：`List subList(int fromIndex, int toIndex)`\n这里 `fromIndex` 包含，`toIndex` 不包含。\n\
  \n### 示例 14.26 : SublistEx.java - 从 ArrayList 获取子列表\n`subList` 方法返回一个 `list`，因此为了将子列表存储在另一个\
  \ `ArrayList` 中，我们必须对返回值进行类型转换，正如我在下面的示例中所所示。另一方面，如果我们将返回的子列表存储在 `list` 中，则不需要类型转换（参考示例）。\n\
