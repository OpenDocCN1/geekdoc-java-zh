  \n## 对象与原始变量\n\n原始数据类型被称为“原始的”（primitive），是因为使用原始数据类型创建的变量除了存储值外，没有其他内置功能。\n\n原始数据类型使用较少量的内存来表示单项数据。所有相同原始类型的数据大小都相同。例如，原始类型\
  \ `int` 使用 32 位表示整数。所有类型为 `int` 的变量都使用 32 位。\n\nJava 中只有八种原始数据类型：`byte`、`short`、`int`、`long`、`float`、`double`、`char`\
  \ 和 `boolean`。Java 程序不能定义任何其他原始数据类型。\n\n对象是一个巨大的内存块，可能包含大量数据以及处理这些数据的方法。\n\n***\n\
  \n## 构建一个简单类\n\n### 第一步：设计类\n**类名**：`Rectangle`（在 `Rectangle.java` 中）\n**字段**：\n\
  *   `length`：矩形的长度。\n*   `width`：矩形的宽度。\n**方法**：\n*   `setLength(double length)`：设置矩形的长度。\n\
  *   `setWidth(double width)`：设置矩形的宽度。\n*   `getLength()`：获取长度。\n*   `getWidth()`：获取宽度。\n\
  *   `getArea()`：计算并返回矩形的面积。\n\n### 第二步：编写类的骨架\n```java\n01 public class Rectangle\n\
  02 {\n03\n04 }\n```\n\n### 第三步：编写字段\n```java\n01 public class Rectangle\n02 {\n\
  03 private double length;\n04 private double width;\n05 }\n```\n解释：\n*   `private`\
  \ 是一个访问修饰符。它表示这些变量不能被类外部的代码访问。\n*   记住，对象可以执行数据隐藏，这意味着在对象内部的数据是受到保护的。\n*   当内部数据对外部代码隐藏，且对数据的访问限制在类的方法时，数据就可以防止意外损坏。\n\
  *   在面向对象编程中，一种常见的做法是将类的所有字段设为私有，并通过方法提供访问权限。\n*   在编写类时，你将主要使用 `private` 和 `public`\
  \ 访问修饰符。\n\n表 9.1 | 类成员私有和公共访问修饰符总结\n\n| 访问修饰符 | 说明 |\n| :--- | :--- |\n| `private`\
  \ | 当访问修饰符应用于类成员时，该成员不能被类外部的代码访问，该成员只能由同类的方法访问。 |\n| `public` | 当公共访问修饰符应用于类成员时，该成员可以被类内部或外部的代码访问。\
  \ |\n\n### 第四步：编写方法\n此方法将允许类外部代码在长度字段中存储值。\n```java\n01 public class Rectangle\n\
  02 {\n03 private double length;\n04 private double width;\n05 public void setLength(double\
  \ len)\n06 {\n07 length = len;\n08 }\n09 }\n```\n**public void setLength(double\
  \ len): setLength 方法的头部**\n*   `public` 关键字是一个访问修饰符。它表示该方法可以被类外部的代码调用。\n*   `void`\
  \ 关键字表示方法不向调用它的语句返回任何数据。\n*   `setLength` 是方法的名称。\n*   `(double len)` 是 double 类型参数变量的声明。\n\
  \n\n\n\n\n*   将 `len` 的值赋给 `length` 字段。当该方法执行时，`len` 参数变量将持有传递给方法的参数值。该值被赋给 `length`\
  \ 字段。\n\n注意：方法头中没有出现 `static` 单词。当一个方法被设计为在类的实例上工作时，它被称为实例方法（instance method），你不需要在方法头中编写\
  \ `static` 单词，因为该方法将在 `Rectangle` 类实例的 `length` 字段中存储一个值，所以它是一个实例方法（后文将进行讨论）。\n\n\
