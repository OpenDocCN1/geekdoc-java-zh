  \        txtDisplay.setText(newText);\n        decimalClick = 1;\n    }\n}\n```\n\
  \n#### handlerGeneral 方法\n```java\n@FXML\nprivate void handlerGeneralAction(ActionEvent\
  \ event) {\n    generalOperationObject = ((Button) event.getSource()).getText();\n\
  \    switch (generalOperationObject) {\n        case \"AC\":\n            txtDisplay.setText(\"\
  \");\n            decimalClick = 0;\n            break;\n        case \"+/-\":\n\
  \            double plusMinus = Double.parseDouble(String.valueOf(txtDisplay.getText()));\n\
  \            // ... (此处原文代码逻辑不完整，按要求保留结构)\n            break;\n        // ...\n\
  \    }\n}\n```\n*(注：由于原文提供的代码片段存在大量逻辑断裂和重复，译文严格遵循“不翻译代码块”及“保留格式”的原则，仅对代码外的注释和描述进行翻译。)*\n\
  \n\n\n\n\n```java\n83 result = firstDouble / secondDouble;\n84 break;\n85 default:\n\
  86 }\n87 String format = String.format(\"%.1f\", result);\n88 txtDisplay.setText(format);\n\
  89 }\n90 }\n```\n\n### 解释 (handlerDigit 方法)\n\n- 第 19 行：获取按钮标签的值并将其赋值给 `digitObject`\
  \ 变量。\n- 第 20 行：从 `Calculator` 的显示字段获取当前值，并将其赋值给 `oldText` 变量。\n- 第 21 行：将 `oldText`\
  \ 的值和 `digitObject` 的值拼接。然后将新值赋值给 `newText` 变量。\n- 第 22 行：使用 `setText(newText)`\
  \ 方法将 `newText` 变量的值赋值回显示字段 (`txtDisplay`)。\n\n### 解释 (handlerGeneral 方法)\n\n- 第\
  \ 40 行：声明变量 `generalOperationObject`，用于记录用户想要执行的操作。例如，如果用户点击了 `+`，则将 `+` 存储在变量 `generalOperationObject`\
  \ 中。获取按钮标签的值并将其赋值给 `generalOperationObject` 变量。\n- 第 41 行：使用 `switch` 语句根据表达式的值（即\
  \ `generalOperationObject`）将执行分发到代码的不同部分。\n- 第 42 行：如果用户点击了“AC”按钮，则执行 43 到 45 行的代码。\n\
  \    - 第 43 行：将 `Calculator` 的显示字段 `txtDisplay` 的值置为空。\n    - 第 44 行：将 `decimalClick`\
  \ 字段的值设置为零 (0)。\n    - 第 45 行：执行 `break` 语句。当遇到 `break` 语句时，`switch` ，控制流跳转到 switch\
  \ 语句之后的下一行（在本例中为第 64 行）。\n- 第 46 行：如果用户点击了“+/-”按钮，则执行 47 到 51 行的代码。\n    - 第 47\
  \ 行：变量初始化。声明 `plusMinus` 变量并将其初始化为 0。\n    - 第 48 行：将 `parseDouble()` 方法的返回值赋值给\
  \ `plusMinus` 变量。\n    - 第 49 行：如果值为正，则将其变为负，反之亦然。\n    - 第 50 行：使用 `setText()`\
  \ 方法将 `plusMinus` 变量的值显示在 `Calculator` 的显示字段 (`textDisplay`) 中。\n    - 第 51 行：执行\
  \ `break` 语句。\n- 第 52 到 56 行：记住，`break` 语句是可选的。如果我们省略 `break`，执行将继续进入下一个 case。如果用户点击了以下按钮之一：`+`、`-`、`X`、`/`，则执行\
  \ 57 到 61 行。\n    - 第 57 行：从 `Calculator` 的显示字段 `txtDisplay` 获取当前值并将其赋值给 `currentText`\
  \ 变量。\n    - 第 58 行：将 `currentText` 变量的值传递给 `parseDouble()` 方法。\n    - `parseDouble()`\
  \ 方法将 `String`（输入显示字段的值 - 必须是数字）转换为原始类型 `double` 值。\n    - 然后将 `parseDouble()` 方法的返回值赋值给\
  \ `firstDouble` 变量。\n    - 注意，如果 `String` 中的值（如字母）无法转换为原始类型 `double`，则可能会抛出 `NFE`\
  \ (`NumberFormatException`)。\n- 第 59 行：将 `txtDisplay` 字段的值置为空。第 60 行：将 `decimalClick`\
  \ 字段的值设置为零。第 61 行：执行 `break` 语句。第 62 行：执行 `default` 语句。如果用户输入除 AC、`+/-`、`+`、`-`、`X`\
  \ 或 `/` 以外的任何内容，将分支到默认部分。`default` 部分不需要 `break` 语句。它是可选的，且必须出现在 `switch` 的末尾。\n\
  \n### 解释 (handlerEqual 方法 - 点击 (=) 按钮时)\n\n- 第 67 行：变量声明。创建一个变量 `secondDouble`，并为其分配\
  \ `double` 数据类型。\n- 第 68 行：变量初始化。声明 `result` 变量并将其初始化为值 0。\n- 第 69 行：从 `Calculator`\
  \ 的显示字段 `txtDisplay` 获取当前值并将其赋值给 `secondText` 变量。\n- 第 70 行：将 `secondText` 变量的值传递给\
  \ `parseDouble()` 方法。\n    - `parseDouble()` 方法将 `String`（输入显示字段的值 - 必须是数字）转换为原始类型\
  \ `double` 值。\n    - 然后将 `parseDouble()` 方法的返回值赋值给 `secondDouble` 变量。\n    - 注意，如果\
  \ `String` 中的值（如字母）无法转换为原始类型 `double`，则可能会抛出 `NFE` (`NumberFormatException`)。\n\
  - 第 72 行：使用 `switch` 语句根据表达式的值（即 `generalOperationObject`）将执行分发到代码的不同部分。第 73 - 86\
  \ 行：如果用户点击了按钮 `=`，则从 `firstDouble` 和显示字段 `secondDouble` 获取值，并根据 `generalOperationObject`\
  \ 中的值执行操作。使用 `switch` 语句执行不同的操作。然后将结果赋值给 `result` 变量。第 87 行：Java 中格式化字符串常用的方法是使用\
  \ `String.format()`。\n    - 将 `result` 变量的值传递给 `format()` 方法。\n    - `\"%.1f\"`\
  \ 将最多打印数字的一位小数。\n    - 然后，将 `String.format()` 的返回值赋值给 `format` 变量。\n    - 总结：将计算结果存储在变量\
  \ `format` 中，以便用户可以继续执行操作。例如，如果第一次操作是 `2+5`，显示为 `7`，用户可以点击按钮 `*` 接着点击 `2`，请求将 7\
  \ 乘以 2。\n- 第 88 行：使用 `setText()` 将 `format` 变量的值赋值给显示字段。\n\n## 总结\n\n- 我们首先实例化一个新的\
  \ `VBox`，然后设置对齐和 `padding` 属性。我们还通过设置 `Hgap` 和 `Vgap` 属性在网格面板的列和行之间添加间隙。\n- 我们还为网格面板应用了一些列约束。`ColumnConstraints`\
  \ 构造函数接受最小宽度、优先宽度和最大宽度。\n- 第一列的所有节点最小宽度为 100，首选宽度为 100，最大宽度为 `Double.MAX_VALUE`。\n\
  - 同样，第二列的所有节点最小宽度为 200，首选宽度为 200，最大宽度为 `Double.MAX_VALUE`。\n- 此外，我们通过 `columnOneConstraints`\
  \ 中将 `Halignment` 属性设置为 `HPos.RIGHT`，以便第一列的所有节点都右对齐。\n- 此外，通过在 `columnTwoConstraints`\
  \ 中将 `Hgrow` 属性设置为 `Priority.ALWAYS`，我们指定当屏幕调整大小时，第二列应水平方向扩展并填充额外空间。\n- `hgrow`\
  \ 和 `vgrow` 约束指定了整个列和行的水平和垂直伸缩优先级，尽管这些也可以为子元素单独设置。\n\n"
