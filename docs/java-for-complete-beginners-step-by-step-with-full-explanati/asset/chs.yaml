  \ 对象返回。该字符串必须是用 `DataOutputStream` 类的 `writeUTF` 方法写入的。\n* `readChar()`: 从文件中读取一个\
  \ `char` 值并返回它。该字符预计是以双字节 Unicode 字符的形式存储的，正如 `DataOutputStream` 类的 `writeChar`\
  \ 方法写入的那样。\n\n## 字符串的写入与读取\n向二进制文件写入 `String`，你应该使用 `DataOutputStream` 类的 `writeUTF`\
  \ 方法。该方法以 UTF-8 编码格式写入其 `String` 参数。`UTF` 代表 Unicode 文本格式。请参考下面的示例。\n\n### 示例 24.14：WriteUTF.java\n\
  ```java\npackage ch24;\n\nimport java.io.*;\n\npublic class WriteUTF {\n    public\
  \ static void main(String[] args) throws IOException {\n        String names[] =\
  \ { \"Mohammed\", \"Mustafa\", \"Shereen\", \"Mansour\", \"Abd-Elrahman\", \"Nuha\"\
  };\n\n        // 创建输出对象。\n        FileOutputStream fstream = new FileOutputStream(\"\
  d:\\\\UTFnames.dat\");\n        DataOutputStream outputFile = new DataOutputStream(fstream);\n\
  \n        System.out.println(\"Writing the names to the file...\");\n\n        //\
  \ 将数组元素写入文件。\n        for (int i = 0; i < names.length; i++)\n            outputFile.writeUTF(names[i]);\n\
  \n        System.out.println(\"Done.\");\n\n        // 关闭文件。\n        outputFile.close();\n\
  \    }\n}\n```\n\n### 输出\n正在将名字写入文件...\nDone.\n\n#### 解释\n* 假设 `outputFile` 引用一个\
  \ `DataOutputStream` 对象，以下代码使用 `writeUTF` 方法写入字符串：\n`String name = \"Chloe\";`\n\
  `outputFile.writeUTF(name);`\n\n从二进制文件中读取字符串，你应该使用 `writeUTF` 方法。该方法用于从文件中读取 UTF\
  \ 编码的字符串。这里有一个示例。\n\n### 示例 24.15：ReadUTF.java\n```java\npackage ch24;\n\nimport\
  \ java.io.*;\n\npublic class ReadUTF {\n    public static void main(String[] args)\
  \ throws IOException {\n        String name;\n        boolean endOfFile = false;\n\
  \n        // 创建输入对象。\n        FileInputStream fstream = new FileInputStream(\"d:\\\
  \\UTFnames.dat\");\n        DataInputStream inputFile = new DataInputStream(fstream);\n\
  \n        System.out.println(\"Reading the names from the file:\");\n\n        //\
  \ 读取文件内容。\n        while (!endOfFile) {\n            try {\n                name\
  \ = inputFile.readUTF();\n                System.out.print(name + \" \");\n    \
  \        } catch (EOFException e) {\n                endOfFile = true;\n       \
  \     }\n        }\n\n        System.out.println(\"\\nDone.\");\n\n        // 关闭文件。\n\
  \        inputFile.close();\n    }\n}\n```\n\n### 输出\n正在从文件中读取名字：\nMohammed Mustafa\
  \ Shereen Mansour Abd-Elrahman Nuha\nDone.\n\n#### 解释\n* 假设 `inputFile` 引用一个 `DataInputStream`\
  \ 对象，以下语句使用 `readUTF` 方法从文件中读取一个 UTF-8 编码的字符串：`String name = inputFile.readUTF();`\n\
  \n**记住**：只有当字符串是用 `writeUTF` 方法写入时，`readUTF` 方法才能正确读取该字符串。\n\n## 向现有的二进制文件追加数据\n\
  如果你向 `FileOutputStream` 构造函数传递一个现有文件的名称，它将被擦除并创建一个同名的空文件。`FileOutputStream` 构造函数接受一个可选的第二个参数，该参数必须是一个布尔值（true\
  \ 或 false）。\n\n* `TRUE`: 如果文件已存在，则不会被擦除，新数据将写入到文件的末尾。\n* `FALSE`: 如果文件已存在，则文件将被擦除。\n\
  \n### 示例 24.16：为了输出打开 MyInfo.dat 文件。\n如果文件存在，它将不会被删除，任何写入文件的数据将追加到现有数据之后：\n```java\n\
  FileOutputStream fstream = new FileOutputStream(\"MyInfo.dat\", true);\nDataOutputStream\
  \ outputFile = new DataOutputStream(fstream);\n```\n\n***\n\n## 随机访问文件\n到目前为止你创建的所有访问文件的程序都执行的是顺序访问。在顺序访问中，当打开文件时，其位置位于文件的开头。`RandomAccessFile`\
  \ 允许程序跳转到文件中的任何位置。这意味着：\n\n* 从文件中的任何字节位置读取数据。\n* 将数据写入文件中的任何位置，覆盖现有数据。\n\n通用格式：`RandomAccessFile(String\
  \ filename, String mode)`\n\n#### 解释\n* `filename`: 文件的名称。\n* `mode`: 指定你希望使用的文件模式。模式有\
  \ `r` 用于读取，`rw` 用于读写。\n\n### 示例 24.17：OpenFile.java\n```java\npackage ch24;\n\n\
  import java.io.*;\n\npublic class OpenFile {\n    public static void main(String[]\
  \ args) throws IOException {\n        // 以读取模式打开文件\n        RandomAccessFile randomFile\
  \ = new RandomAccessFile(\"MyData.dat\", \"r\");\n\n        // 以读写模式打开文件\n     \
  \   RandomAccessFile randomFile = new RandomAccessFile(\"MyData.dat\", \"rw\");\n\
  \    }\n}\n```\n\n### 输出\n（如果 MyData.dat 存在）\n线程 \"main\" java.io.FileNotFoundException:\
  \ d:\\MyData.dat（找不到文件）\n\n（如果 MyData.dat 不存在）\n线程 \"main\" java.io.FileNotFoundException:\
  \ d:\\MyData.dat（找不到文件）\n\n## 使用 RandomAccessFile 写\n使用 `RandomAccessFile` 类处理二进制文件。在下面的示例中，我们使用\
  \ `RandomAccessFile` 类以读写模式打开 `Letters.dat` 文件。然后我们使用 `writeChar()` 方法将数组数据写入 `Letters.dat`\
  \ 文件。\n\n### 示例 24.18：WriteLetters.java\n```java\nimport java.io.*;\n\npublic class\
  \ WriteLetters {\n    public static void main(String[] args) throws IOException\
  \ {\n        char[] letters = {'a', 'b', 'c', 'd'};\n\n        System.out.println(\"\
  Opening the file.\");\n\n        // 以读写模式打开文件。\n        RandomAccessFile randFile\
  \ = new RandomAccessFile(\"Letters.dat\", \"rw\");\n\n        System.out.println(\"\
  Writing data to the file...\");\n\n        // 顺序将字母数组写入文件。\n        for (int i =\
  \ 0; i < letters.length; i++)\n            randFile.writeChar(letters[i]);\n\n \
  \       // 关闭文件。\n        randFile.close();\n\n        System.out.println(\"Done.\"\
  );\n    }\n}\n```\n\n### 输出\n打开文件。\n正在向文件写入数据...\nDone.\n\n#### 解释\n* 第 12 行：以读写\
  \ (`rw`) 打开名为 `Letters.dat` 的文件。\n* 第 19 行：使用 `writeChar()` 方法将字母表中的数据写入 `Letters.dat`\
  \ 文件。\n\n\n\n\n`RandomAccessFile` 类将文件视为字节流。这些字节是有编号的，第一个字节为 `byte 0`。最后一个字节的编号比文件中的字节总数少\
  \ 1。在内部，`RandomAccessFile` 类维护着一个名为文件指针（file pointer）的长整型（long）值。文件指针持有文件中某个位置的字节数。当文件被首次打开时，文件指针被设置为\
  \ `0`。这使得它“指向”文件中的第一个字节。当从文件中读取项时：\n\n*   它从文件指针所指向的字节开始读取。\n*   它会使文件指针移动到已读取项之后的的一个字节。\n\
  \n写入操作也发生在文件指针所指向的位置。若要移动文件指针，您需要使用 `seek()` 方法。\n\n```java\nvoid seek (long position)\n\
  ```\n\n参数是您想要让文件指针移动到的字节数。请参考下面的示例。\n\n### 示例 24.19 : SeekEx.java\n```java\npackage\
  \ ch24;\n\nimport java.io.IOException;\nimport java.io.RandomAccessFile;\n\npublic\
  \ class SeekEx {\n    public static void main(String[] args) throws IOException{\n\
  \        try {\n            RandomAccessFile f = new RandomAccessFile(\"d:\\\\MyInfo.dat\"\
  , \"r\");\n            f.seek(99);\n            byte b = f.readByte();\n       \
  \ } catch (IOException e){\n            System.out.println(e.getMessage());\n  \
  \      }\n    }\n}\n```\n**输出（如果文件已存在）：** `null`（意味着文件为空）\n**输出（如果文件不存在）：** `MyInfo.dat\
  \ (The system cannot find the file specified)`\n\n### 解析\n*   第 09 行：代码以读取模式打开文件\
  \ `MyInfo.dat`。\n*   第 10 行：调用 `seek` 方法将文件指针移动到字节数 `99`（即文件中的第 100 个字节）。\n*   第\
  \ 11 行：`readByte` 方法从文件中读取字节数为 `99` 的字节。\n\n语句执行后，文件指针将移动一个字节，因此它将指向字节 `100`。\n\n\
  ### 示例 24.20 : 假设我们使用以下代码继续处理同一个文件：\n```java\nRandomAccessFile f = new RandomAccessFile\
  \ (\"MyInfo.dat\", \"r\");\nf.seek(49);\nint i = f.readInt();\n```\n### 解析\n*  \
  \ 第 1 行：代码以读取模式打开文件 `MyInfo.dat`。\n*   第 2 行：`seek` 方法将文件指针移动到字节数 `49`。\n*   第 3\
  \ 行：`readInt` 方法从文件中读取一个 `int`。一个 `int` 的大小为 4 字节，因此该语句从字节数 `49` 开始读取 4 个字节。\n\n\
  语句执行后，文件指针将移动 4 个字节，因此它将指向字节 `53`。\n\n尽管文件可能包含字符、整数、双精度浮点数、字符串等，但 `RandomAccessFile`\
  \ 类仅将其视为字节流（Stream of bytes）。让我们来看一个例子。\n\n### 示例 24.21 : FilePtr.java\n```java\n\
  package ch24;\n\nimport java.io.IOException;\nimport java.io.RandomAccessFile;\n\
  \npublic class FilePtr {\n    public static void main(String[] args) throws IOException\
  \ {\n        // 打开文件进行读取。\n        RandomAccessFile randFile = new RandomAccessFile(\"\
  d:\\\\UTFnames.dat\", \"r\");\n        // 将文件指针移动到字节 5，即第 6 个字节\n        randFile.seek(5);\n\
  \        // 读取字符\n        Character ch = randFile.readChar();\n        // 这将显示什么？\n\
  \        System.out.println(\" The 6th letter is \" + ch);\n    }\n}\n```\n**输出：**\
  \ `The 6th letter is`\n\n`readChar` 方法将字符写入为 2 个字节，因为每个字符在文件中占用两个字节，第 6 个字符从字节 `10`\
  \ 开始，而不是字节 `5`。事实上，如果我们尝试从字节 `5` 开始读取字符，我们将读到垃圾数据，因为字节 `5` 并不是字符的开头。要确定字符在文件中的位置，必须考虑每个字符的大小。\n\
  \n### 注意事项\n*   如果文件指针指向的字节数超出文件范围，在执行读取操作时将抛出 `EOFException`。\n*   如果在执行写入操作时文件指针指向文件末尾，则数据将写入文件末尾。\n\
  *   如果文件指针持有文件内的某个字节数，且该位置已存储数据，则写入操作将覆盖该位置的现有有数据。\n\n### 示例 24.22 : FilePtr2.java\
  \ - 正确读取并显示第 6 个字符。\n（字符 X 的大小为我们要定位的字符的数目）。\n```java\npackage ch24;\nimport java.io.FileNotFoundException;\n\
  import java.io.IOException;\nimport java.io.RandomAccessFile;\n\npublic class FilePtr2\
  \ {\n    public static void main(String[] args) throws IOException {\n        final\
  \ int CHAR_SIZE = 2; // 每个 char 使用 2 字节\n\n        // 打开文件进行读取。\n        RandomAccessFile\
  \ randFile = new RandomAccessFile(\"d:\\\\UTFnames.dat\", \"r\");\n        // 将文件指针移动到字节\
  \ 5，即第 6 个字节\n        randFile.seek(5);\n        // 读取字符\n        Character ch =\
  \ randFile.readChar();\n        // 这将显示什么？\n        System.out.println(\" The 6th\
  \ letter is \" + ch);\n    }\n}\n```\n**输出：** `The 6th letter is`\n\n* *\n\n## 总结\n\
  *   `File` 类允许你访问底层文件系统。\n*   在对文件系统进行任何操作之前，必须获取 `File` 实例。\n*   一旦实例化了 `File`\
  \ 对象，就可以检查相应的文件是否存在。\n*   你可以使用 `File` 类创建不存在的目录。`File` 类包含 `mkdir()` 和 `mkdirs()`\
  \ 用于此目的。\n*   如果 `mkdirs()` 创建了路径中的所有目录，将返回 `true`。\n*   要重命名文件，请调用 `File` 的 `renameTo()`\
  \ 方法。\n*   如前所述，`renameTo()` 方法也可用于移动文件到不同的目录。传递给 `renameTo()` 的新文件名不需要位于文件所在的目录。\n\
  *   `renameTo()` 方法返回 `true` 或 `false`，表示重命名是否成功。\n*   调用 `delete()` 方法删除文件。\n*\
  \   你可以通过调用 `list()` 或 `listFiles()` 获取目录中的所有文件。`list()` 方法返回 `File` 所向目录的文件或目录名的\
  \ `String` 数组。`listFiles()` 返回表示 `File` 所向目录的文件或目录的 `File` 对象数组。\n*   要向二进制文件写入字符串，应使用\
  \ `DataOutputStream` 类的 `writeUTF`。\n*   如果你将现有文件的名称传递给 `FileOutputStream` 构造函数，它将被擦除并创建一个同名的空文件。`FileOutputStream`\
  \ 构造函数接受一个可选的第二个参数。\n\n## 第三部分：构建图形界面应用程序\n\n“用户界面是从混乱的复杂性转向优雅简单的过程。” – Akshat Paul，React\
  \ Native for iOS\n\n## 第 25 章：JavaFX 布局\nJava 程序可以拥有图形界面（GUI），包含按钮、列表、菜单、复选框等许多其他控件，允许用户与应用程序交互。现在\
  \ JavaFX 是我们将在书中用于构建界面的工具。什么是什么是 JavaFX？JavaFX 是一套 Java 包，允许开发者设计、创建、测试、调试和部署在不同平台（如\
  \ Windows、Linux 和 Mac）上一致运行的 GUI 。JavaFX 是 Swing 的继任者，Swing 是多年来推荐的 Java 用户界面（UI）工具包，但现在\
  \ Oracle 的方向是使用 JavaFX。JavaFX 用于开发桌面应用程序、互联网应用程序和移动应用程序的用户界面。编写 JavaFX 应用程序有两种截然不同的方法：\n\
  \n*   方法 1 - 使用 FXML 代码（推荐且本书中使用的方法）。\n*   方法 2 - 使用纯 Java 代码。\n\n\n\n现在让我们来看在 JavaFX\
  \ 中启动新程序的第一个方法。\n\n## 创建你的第一个 JavaFX 应用程序\n\nIntelliJ IDEA 有一个支持 JavaFX 应用程序的插件，该插件在\
  \ IntelliJ IDEA 中默认安装并启用。因此，要创建你的第一个 JavaFX 应用程序，请执行以下步骤：\n\n*   在欢迎界面上点击 `Create\
  \ New Project`。或者选择 `File > New > Project`。新项目向导会随之打开。\n*   在左侧窗格中，选择 `JavaFX` 类别。在页面右侧选择\
  \ `JavaFX application`。\n\n![](img/Image00140.jpg)\n\n*   你还可以指定项目项目使用的 `JDK`（`Project\
  \ SDK` 字段）。从列表中选择 `JDK`，或者点击 `New > select JDK` 并选择所用 `JDK` 的安装文件夹。点击 `Next`。\n\
  *   在 `Project name` 字段中，为你的新项目输入一个名称（例如 `JavaFXProject`）。你可以更改 `Location` 字段中显示的默认文件系统位置。点击\
  \ `Finish`。\n\n![](img/Image00141.jpg) 等待 IntelliJ IDEA 创建项目。当此过程完成后，新项目的结构将显示在\
  \ `Project` 工具窗口中。完成后，你将获得用于 JavaFX 应用程序的一些启动文件。\n\n## 探索项目文件\n\n项目文件的设计考虑了“模型-视图-控制器”（MVC）模式。`MVC`\
  \ 将应用程序分为三类型的组件：`Model`（模型）、`View`（视图）和 `Controller`（控制器）设计。\n\n*   `View` 可以是信息的任何输出表示形式，例如图表。\n\
  *   `Model` 是该模式的核心组件。它直接管理应用程序的数据、逻辑和规则。\n*   `Controller` 是决定当用户与用户界面交互时发生什么情况的代码。\n\
  \n让我们快速查看 IntelliJ IDEA 项目窗格中包含的内容：\n![](img/Image00142.jpg) `src` 文件夹用于你的源代码。在该文件夹中，已经有一个名为\
  \ `sample` 的包，其中包含三个文件：\n\n*   `sample.fxml`。这是用于定义用户界面（`View`）的 `FXML` 文件。\n* \
  \  `Main.java`（启动类）。这是启动应用程序的主应用程序类。该类将从 `FXML` 文档（在此例中为 `sample.fxml`）加载一个 `SCENE`\
  \ 并将其置于 `STAGE` 或 `WINDOW` 上。所有 `FXML` 文档都需要一个打开的“Scene”和一个“Stage”来放置。该文档正是这样做的（`Model`）。\n\
  *   `Controller.java`。该文件包含用户与程序或用户界面交互时运行所需的代码（Controller）。\n\n对于这个简单的应用程序，显然没有任何数据，而且\
  \ IntelliJ 生成的代码默认并不会创建任何 Java UI 控件。\n\n## 运行示例应用程序\n\n为了确保项目一切无正常，让我们立即运行示例应用程序：\n\
  \n*   点击 `Run > Run ‘Main’` 或点击工具栏上的图标。\n*   IntelliJ IDEA 编译源代码然后启动应用程序。应用程序窗口将会出现，目前它是空的。\n\
  \n![](img/Image00143.jpg)\n\n*   关闭应用程序窗口。\n\n***\n\n## JavaFX 应用程序骨架\n\n无论你使用哪种技术来编写\
  \ JavaFX 程序，所有的 JavaFX 应用程序都共享相同的基本骨架。因此，在查看更多 JavaFX 特性之前，查看该骨架的样貌将很有帮助。完整的骨架所示：\n\
  \n### Controller.java 类\n```java\npackage sample;\n\npublic class Controller {\n\
  \n}\n```\n你可以看到在现阶段它实际上是空的，因为我们还没有添加任何控件，如按钮、菜单和标签。控制器通常用于为 FXML 文件中定义的用户界面实现事件处理程序。\n\
  \n### Main.java 类\n```java\n01 package sample;\n02 import javafx.application.Application;\n\
  03 import javafx.fxml.FXMLLoader;\n04 import javafx.scene.Parent;\n05 import javafx.scene.Scene;\n\
  06 import javafx.stage.Stage;\n07\n08 public class Main extends Application {\n\
  09\n10 @Override\n11 public void start(Stage primaryStage) throws Exception{\n12\
  \ Parent root =\n13 FXMLLoader.load(getClass().getResource(\"sample.fxml\"));\n\
  14 primaryStage.setTitle(\"Hello World\");\n15 primaryStage.setScene(new Scene(root,\
  \ 300, 275));\n16 primaryStage.show();\n17 }\n18\n19 public static void main(String[]\
  \ args) {\n20 launch(args);  // or Application.launch(args)\n21 }\n22\n```\n\n####\
  \ 解释\n\n*   第 01 行：使用 `package` 关键字将 `Main` 类添加到 `sample` 包中。\n*   第 02-06 行：导入运行\
  \ `Main` 应用程序所需的类。\n*   第 08 行：`Main` 类是你创建的主启动类（JavaFX 应用程序要求）。该类将是 JavaFX 应用程序的入口点。`Main`\
  \ 类包含两个方法：`main()` 方法和 `start()` 方法。\n*   第 11 行：当 JavaFX 应用程序启动时会调用或执行 `start()`\
  \ 方法。它接收一个类型为 `Stage` 的参数。stage 是扩展了窗口类的顶层 JavaFX 容器。JavaFX 运行时会自动构造初始阶段并将其作为参数传递给\
  \ `start` 方法。\n*   第 13 行：从 `sample.fxml` 加载 UI。\n*   第 14 行：通过调用 `setTitle()` 方法设置阶段标题。标题将成为应用程序的名称。\n\
  *   第 15 行：加载 `FXML` 文件并将其赋值给 `Parent` 变量 `root`。我们构造了一个场景（scene）。\n*   第 16 行：`show()`\
  \ 方法显示窗口（即 stage）及其场景。\n*   第 19-21 行：`main()` 方法通过调用 `launch()` 方法启动应用程序。静态 `launch()`\
  \ 方法位于应用程序类中。它启动 JavaFX 运行时和你的 JavaFX 应用程序。\n\n注意 `main()` 方法的 `args` 参数被传递给了 `launch()`\
  \ 方法。你可以向 `launch()` 传递不同的参数或不传递。\n\n### sample.fxml 文件\n```xml\n01 <?import javafx.geometry.Insets?>\n\
  02 <?import javafx.scene.layout.GridPane?>\n03\n04 <?import javafx.scene.control.Button?>\n\
  05 <?import javafx.scene.control.Label?>\n06 <GridPane fx:controller=\"sample.Controller\"\
  \n07 xmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\" hgap=\"10\" vgap=\"\
  10\">\n08 </GridPane>\n```\n\n#### 解释\nFXML 是一种用于构建 JavaFX 应用程序用户界面的 XML 语言。\n第\
  \ 01、02、04 和 05 行：导入运行应用程序所需的类。\n第 06-08 行：创建一个 `GridPane` 布局。\n\n*   `GridPane`\
  \ 布局是 FXML 文档的根元素，因此具有两个属性。\n*   `fx:controller` 属性允许调用者将“控制器”类与 FXML 文档关联。\n* \
  \  `xmlns:fx` 属性是必须的，它指定了 `fx` 命名空间。\n\n\n\n\n* `alignment` 属性将网格的默认位置从场景的左上角更改为中心。\n\
  * `gap` 属性管理行与列之间的间距。\n\n注意：我们不需要构建一个新的 `stage` 对象。在实践中，我们加载一个不同的 `fxml` 文件到新的 `scene`\
  \ 中，然后直接调用它。JavaFX 应用程序中的这三个文件![](img/Image00144.jpg) 让程序显示在屏幕上的三个主要对象（从外到内）是：\n\
  \n### 第一：STAGE（舞台/阶段）\n这是应用程序的顶层容器。每个应用程序都有一个 `stage`，它负责显示一个 `scene`（场景）。在 JavaFX\
  \ 语言中，整个窗口被称为 `stage`。这里的整个窗口（包括关闭、最大化、最小化按钮）都称为 `stage`。![](img/Image00145.jpg)\n\
  图 25.1 | 舞台 (The Stage)\n\n### 第二：SCENE（场景）\n由 `stage` 直接包含的对象。`scene` 包含了 GUI 的所有元素。可以设计几个场景并使用\
  \ `Stage` 在它们之间切换。你窗口内部或 `stage` 内部的内容就是 `scene`。在 `scene` 上，我们将放置所有酷炫的内容，如绑定、组件等。![](img/Image00146.jpg)\n\
  图 25.2 | 场景 (The Scene)\n所以记住，他们不称其为窗口。你窗口内部的东西他们称为 `scene` 中的 `stage`。\n\n### 第三：ROOT\
  \ Pane/Container（根窗格/容器）\n此对象持有应用程序的所有部分，如按钮、标签、文本字段等。根容器可以使用多个 JavaFX 容器来表示，例如\
  \ `StackPane`、`GridPane` 和 `BorderPane`。![](img/Image00147.jpg)\n\n***\n\n## JavaFX\
  \ 布局\nJavaFX 布局是一种布局容器类（也称为 `pane`），用于轻松地管理 JavaFX 应用程序的用户界面组件或控件。JavaFX 提供了以下内置布局（也称为根窗格）：![](img/Image00148.jpg)\
  \ \n图 25.3 | JavaFX 内置布局\n\n但在进入布局之前，我只想讨论一下 JavaFX 控件的首选大小。\n\n### 首选大小 (Preferred\
  \ size)\n首选大小意味着控件的首选宽度和高度。默认情况下，每个用户界面 (UI) 控件根据其内容计算其首选大小的默认值。例如，`button` 的计算大小由文本的长度和大小决定。图\
  \ 1.4 显示了网格中几个按钮的默认大小![](img/Image00149.jpg)\n图 25.4 | 首选大小 (Preferred Sizes)\n\
  UI 控件还提供了基于控件典型用途的默认最小最大尺寸。例如，`Button` 对象的最大大小默认为首选大小，因为你通常不希望按钮无限增长。然而，`ScrollPane`\
  \ 对象的最大大小是无界的，因为通常你确实希望它们增长以填充空间。\n\n### GridPane 布局\nJavaFX `GridPane` 是一种布局组件，它在网格中布局其子组件。网格中的每个位置都称为一个\
  \ `cell`（单元格）。网格中单元格的大小取决于 `GridPane` 中显示的的组件，但遵循一些规则。\n\n* 同一行的所有单元格高度相同。该行的高度可以与其中包含的最高控件一样高。\n\
  * 同一列的所有单元格宽度相同。该列的宽度将与其包含的最宽控件一样宽。\n* 不同行可以有不同的高度。\n* 不同列可以有不同的宽度。\n* 子元素可以跨越多个行或列。\n\
  * 子元素可以在行或列内自由重叠，它们的堆叠顺序将由网格面板子列表的顺序定义（第一个节点在后面，最后一个节点在前面）。\n\n注意：当你向 `GridPane`\
  \ 添加组件时，你需要告诉它该组件应该插入到哪个单元格（行，列），以及该组件应该跨越多少行和多少列。\n\n### 创建 GridPane\n* 创建一个名为\
  \ `GridPane` 的新 JavaFX 项目。\n* 将 `Stage` 的 `title` 属性设置为 `GridPane Layout`。进入 `Main.java`\
  \ 类文件并修改以下代码：\n```\nprimaryStage.setTitle(\"GridPane Layout\");\n```\n* 使用 `FXML`\
  \ 创建 `GridPane`。进入 `sample.fxml` 文件，在第 2 行我们有一个 grid pane 的导入，显然第 6 行你可以看到 `GridPane`\
  \ 这个词，所以基本上这就是已经配置好的网格布局。\n\n```xml\n<GridPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\"\nalignment=\"center\" hgap=\"10\" vgap=\"\
  10\">\n</GridPane>\n```\n\n#### 向 GridPane 布局添加子元素\n* 使用 JavaFX 中的 `<Button>` 元素向此网格添加四个按钮。点击\
  \ `<GridPane>` 元素内部并输入以下内容：\n\n```xml\n01 <?import javafx.geometry.Insets?>\n02\
  \ <?import javafx.scene.layout.GridPane?>\n03 <?import javafx.scene.control.Button?>\n\
  04 <?import javafx.scene.control.Label?>\n05 <GridPane fx:controller=\"sample.Controller\"\
  \n06 xmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\" hgap=\"10\" vgap=\"\
  10\">\n07 <Button text=\"One\"/>\n08 <Button text=\"One Two\"/>\n09 <Button text=\"\
  One Three\"/>\n10 <Button text=\"One Three Four\"/>\n11 </GridPane>\n```\n（注：原文提供的\
  \ XML 示例中行号与内容存在错乱，已根据逻辑对齐翻译）\n* 修正：原文中 XML 块错乱，根据上下文翻译如下：\n* 使用 JavaFX 中的 `<Button>`\
  \ 元素向此网格添加四个按钮。点击 `<GridPane>` 元素内部并输入以下内容：\n\n```xml\n<?import javafx.geometry.Insets?>\n\
  <?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.Button?>\n\
  <?import javafx.scene.control.Label?>\n\n<GridPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\" hgap=\"10\" vgap=\"10\"\
  >\n    <Button text=\"One\" GridPane.rowIndex=\"0\" GridPane.columnIndex=\"0\"/>\n\
  \    <Button text=\"One Two\" GridPane.rowIndex=\"1\" GridPane.columnIndex=\"0\"\
  />\n    <Button text=\"One Three\" GridPane.rowIndex=\"0\" GridPane.columnIndex=\"\
  1\"/>\n    <Button text=\"One Three Four\" GridPane.rowIndex=\"1\" GridPane.columnIndex=\"\
  1\"/>\n</GridPane>\n```\n（注：由于原文文本中 XML 部分存在严重的行号错乱和标签重复，翻译时保持了其结构意图）\n\n* 运行程序。查看结果![](img/Image00150.jpg)\
  \ 屏幕显示如下：\n* 运行程序。查看结果![](img/Image00151.jpg) 屏幕显示如下：\n* 运行程序。查看结果![](img/Image00152.jpg)\
  \ 我们可以看到所有按钮。\n\n（注：由于原文文本中 XML 部分存在严重的行号错乱和标签重复，已根据逻辑意图进行了翻译）\n\n\n\n\n\n![](img/Image00153.jpg)\n\
  每当你遇到困难或事情没有按照你预期的方式进行时，请确保你添加了 `gridLinesVisible=\"true\"`。\n\n### 缩放包含 GridPane\
  \ 的窗口\n当我们缩放包含 `GridPane` 的窗口时，网格会保持在中心。![](img/Image00154.jpg)\n如果我们把窗口缩小或放大，它仍然会自动居中。它不会发生缩放，因为它的\
  \ own 已经足够大，可以容纳所有单元格中的所有子控件。\n\n*   那么，让我们给另一个按钮添加更多文本，使其变得非常长，看看实际上发生了什么。打开 `sample.fxml`\
  \ 文件，并在第 4 个按钮中添加以下文本：\n```xml\n<Button text=\"One Two Three Four\n    Four Four\
  \ Four Four Four Four Four \"\n    GridPane.rowIndex=\"1\"\n    GridPane.columnIndex=\"\
  1\"/>\n```\n*   运行应用程序。文本被截断了。三个点表示它没有被完全获取\n\n![](img/Image00155.jpg)\n\n*   放大窗口。Grid\
  \ pane 将不断缩放，直到它大到足以容纳所有的子控件：![](img/Image00156.jpg)\n一旦它缩放到那个水平，它就不会再尝试缩放了。\n\n\
  ### 使用 percentWidth 属性指定 GridPane 的宽度\n要让每列占据 grid panes 宽度的 50%，请执行以下步骤：\n\n* \
  \  在 `<GridPane>` 元素之后，我们的第一个按钮之前，按回车并输入以下内容：\n```xml\n<?import javafx.scene.layout.ColumnConstraints?>\n\
  \n<GridPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"center\" hgap=\"10\" vgap=\"10\"\ngridLinesVisible=\"true\">\n<columnConstraints>\n\
  \    <ColumnConstraints percentWidth=\"50.0\"/>\n    <ColumnConstraints percentWidth=\"\
  50.0\"/>\n</columnConstraints>\n</GridPane>\n```\n*   运行应用程序。屏幕将如下所示：![](img/Image00157.jpg)\n\
  \n### 解析\n*   每列占据宽度的 50%。网格占据了窗口的整个宽度。\n*   我们告诉 grid pane，我们希望每列占据其宽度的 50%，而不是仅仅大到足以容纳最宽的控件的首选宽度。\n\
  *   顺序非常重要。第一个列约束元素将应用于第一列，第二个列约束元素将应用于第二列，依此类推。\n因此，`ColumnConstraints` 类被用于设置每列的初始宽度，我们可以使用像素或百分比。\n\
  \n### 更改 GridPane 的对齐方式\n*   要更改 grid pane 的对齐方式，我们如下使用 `alignment` 属性：\n*   运行你的应用程序。屏幕将如下所示：![](img/Image00158.jpg)\n\
  注意，在标题结束处、窗口顶部以及实际列开始或实际行开始的地方没有间隙。\n\n### 在顶部添加一些内边距（padding）\n在 grid pane 中添加一个\
  \ `padding` 元素，并在内部为 padding 元素添加一个 `Insets` 子元素：因此在 `GridPane` 元素内部输入：\n```xml\n\
  <GridPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"TOP_CENTER\" hgap=\"10\" vgap=\"10\"\ngridLinesVisible=\"true\">\n\
  <columnConstraints>\n    <ColumnConstraints percentWidth=\"50.0\"/>\n    <ColumnConstraints\
  \ percentWidth=\"50.0\"/>\n</columnConstraints>\n<padding>\n    <Insets top=\"10\"\
  />\n</padding>\n<Button text=\"One\" GridPane.rowIndex=\"0\" GridPane.columnIndex=\"\
  0\"/>\n</GridPane>\n```\n*   运行你的应用程序。屏幕将如下所示：![](img/Image00159.jpg)\n\n### 使用\
  \ columnSpan 属性跨越多行\n*   第一：将第四个按钮移动到第四行。将 `GridPane.rowIndex` 改为 2：\n```xml\n<Button\
  \ text=\"One Two Three Four\" GridPane.rowIndex=\"2\" GridPane.columnIndex=\"0\"\
  />\n```\n*   第二：让第四个按钮跨越多行\n```xml\n<Button text=\"One Two Three Four\" GridPane.rowIndex=\"\
  2\" GridPane.columnIndex=\"0\" GridPane.columnSpan=\"2\"/>\n```\n![](img/Image00160.jpg)\n\
  `columnSpan` 允许你跨越超过一列。`columnIndex=0` 从第一列开始。\n\n### 更改按钮 1 的水平对齐方式\n所有按钮在它们的单元格中都是左对齐的。要更改按钮\
  \ One 的水平对齐方式，我们使用 `halignment` 属性。\n```xml\n<Button text=\"One\" GridPane.rowIndex=\"\
  0\" GridPane.columnIndex=\"0\" GridPane.halignment=\"RIGHT\"/>\n```\n\n### HBox\
  \ 布局\n`HBox` 是一个容器，它在单行内水平方向排列所有组件，并将组件的大小调整为它们的首选宽度。如果剩余任何水平空间，`HBox` 将拉伸以填充剩余空间，而不是拉伸它的组件。\n\
  如果有任何额外的高度空间，将取决于 `fill height` 属性。当 `fill height` 为 `true`（默认值）时，`HBox` 将扩展以填充任何高度；如果为\
  \ `false`，它将尝试调整组件的大小以填充该额外高度。某些组件（子控件）无法这样调整大小，在这种情况下，额外的高度将保持为空。![](img/Image00161.jpg)\n\
  \n#### 创建 HBox 布局\n*   创建一个名为 `HBox` 的新项目。\n*   打开 `sample.fxml` 文件，将 `<GridPane>`\
  \ 改为 `<HBox>`，然后删除 `hgap` 和 `vgap` 属性，因为它们不适用于此布局，如下所示：\n```xml\n<?import javafx.scene.layout.ColumnConstraints?>\n\
  \n<HBox fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"center\">\n    <Button text=\"OK\"/>\n    <Button text=\"Cancel\"\
  />\n    <Button text=\"About\"/>\n</HBox>\n```\n*   运行应用程序。右键点击 Main.java 并选择 ‘Main’。屏幕将如下所示：Image00162.jpg)\n\
  三个按钮水平排列在窗口中心。按钮之间没有间隙。因为 `HBox` 的 `fill height` 属性设置为 `true`，它会占据任何高度。\n\n所有按钮具有相同的宽度\n\
  要让所有按钮具有相同的宽度，为每个按钮设置相同的 `prefWidth`（例如 70）：\n```xml\n<Button text=\"OK\" prefWidth=\"\
  70\"/>\n<Button text=\"Cancel\" prefWidth=\"70\"/>\n<Button text=\"About\" prefWidth=\"\
  70\"/>\n```\n\n### 为 HBox 添加边框样式\n*   打开 `sample.fxml` 文件。\n*   在 `HBox` 的 `alignment`\
  \ 属性之后另起一行并输入：\n```xml\n<HBox fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"center\"\nstyle=\"-fx-border-color:red; -fx-border-width:3; -fx-border-style:dashed;\"\
  >\n```\n\n### 调整组件之间的间距\n要调整两个按钮之间的空间，输入：\n```xml\n<HBox fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\" alignment=\"BOTTOM_CENTER\"\nstyle=\"-fx-border-color:red;\
  \ -fx-border-width:3; -fx-border-style:dashed;\" spacing=\"10\">\n    <Button text=\"\
  OK\"/>\n    <Button text=\"Cancel\"/>\n    <Button text=\"About\"/>\n</HBox>\n```\n\
  *   运行应用程序。右键点击 Main.java 并选择 ‘Main’。现在按钮将如下所示：Image00163.jpg)\n`HBox` 占据了父容器的整个宽度和高度。\n\
  \n*   将对齐方式改为 `BOTTOM_CENTER`。HBox 将自己伸到了按钮上方。\n\n### 调整 GridPane 的 padding 和 insets\n\
  *   在 `HBox` 元素之后，输入以下高亮代码：\n```xml\n<HBox fx:controller=\"sample.Controller\"\n\
  xmlns:fx=\"http://javafx.com/fxml\" alignment=\"BOTTOM_RIGHT\"\nstyle=\"-fx-border-color:red;\
  \ -fx-border-width:3; -fx-border-style:dashed;\" spacing=\"10\">\n    <padding>\n\
  \        <Insets bottom=\"20\" right=\"20\"/>\n    </padding>\n    <Button text=\"\
  OK\"/>\n    <Button text=\"Cancel\"/>\n    <Button text=\"About\"/>\n</HBox>\n```\n\
  \n\n\n\n\n* 运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00165.jpg)\n\
  \n在底部有一个 20 像素的间隙。右侧也有 20 像素的间隙。无论我们做得多小还是多大，它应该保持不变。\n\n## `VBoxPane` 布局\n`VBoxPane`\
  \ 是一个容器，它在单列上排列子组件。\n\n### 创建 VBox 布局\n\n* 创建一个名为 `VBox` 的新 JavaFX 项目\n* 打开 `sample.fxml`\
  \ 文件，将 `GridPane` 更改为 `VBox`。然后删除 `hgap` 和 `vgap` 属性，因为它们不适用于此布局。\n\n向 `VBox` 布局添加三个按钮（`OK`、`Cancel`\
  \ 和 `About`）。\n\n```xml\n<?import javafx.scene.layout.VBox?>\n\n<VBox fx:controller=\"\
  sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\">\n\
  \    <Button text=\"OK\"/>\n    <Button text=\"Cancel\"/>\n    <Button text=\"About\"\
  />\n</VBox>\n```\n\n* 运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00166.jpg)\n\
  \n我们的三个按钮垂直排列在窗口的中心。三个按钮之间没有空间。由于 `VBox` 的 `fill height` 属性被设置为 `true`，额外的高度实际上位于按钮的上方和下方。因此，`VBox`\
  \ 会拉伸以填充任何多余的宽高度。\n\n## `BorderPane` 布局\n`BorderPane` 将其布局分为五个区域：`Top`（顶部）、`Bottom`（底部）、`Right`（右侧）、`Left`（左侧）和\
  \ `Center`（中心）。下图显示了 `BorderPane` 的五个区域：\n\n![](img/Image00167.jpg)\n图 25.5 | `BorderPane`\
  \ 的区域\n\n### 每个区域一个节点\n每个区域只能放置一个节点。你可以在每个区域放置任何想要的内容——单个控件或另一个容器（如 `HBox` 或 `VBox`，如果你想插入多个按钮等控件）。\n\
  \n### 尺寸\n`BorderPane` 对其子项使用以下缩放策略：\n\n* `Top` 和 `bottom` 可以占据所有可用的宽度。`top` 和 `bottom`\
  \ 区域的子组件将调整为其首选高度。只要子组件的最大宽度允许其扩展超过首选宽度，它们的宽度就会扩展以填充额外的可用水平空间。\n* `Left` 和 `right`\
  \ 可以占据整个高度。`right` 和 `left` 区域的子组件将调整为其首选宽度。只要子组件的最大高度允许其扩展超过首选高度，它们的高度就会扩展以填充额外的垂直空间。\n\
  * `center` 区域占据 `BorderPane` 布局中的大部分空间。中心的子节点将填充两个方向上剩余的可用空间。\n* 如果某个区域没有子节点，则不会为其留出空间。\n\
  * 在 `top` 和 `bottom` 区域之间有一行，按 `left`、`center` 和 `right` 的顺序包含其他三个区域。\n\n* 构建 BorderPane\
  \ 布局\n\n* 创建一个名为 `BorderPane` 的新 JavaFX 项目\n* 打开 `sample.fxml` 文件，将 `GridPane` 更改为\
  \ `BorderPane`。然后删除 `hgap`、`vgap` 和 `alignment` 属性，因为它们不适用于此布局。\n\n在 `BorderPane`\
  \ 布局的底部添加 `HBox` 窗格。然后在 `HBox` 窗格内部添加以下三个按钮。\n\n```xml\n<?import javafx.scene.control.Button?>\n\
  <?import javafx.scene.layout.BorderPane?>\n<?import javafx.scene.layout.HBox?>\n\
  \n<BorderPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  >\n    <bottom>\n        <HBox alignment=\"TOP_LEFT\">\n            <Button text=\"\
  OK\" prefWidth=\"70\"/>\n            <Button text=\"Cancel\" prefWidth=\"70\"/>\n\
  \            <Button text=\"About\" prefWidth=\"70\"/>\n        </HBox>\n    </bottom>\n\
  </BorderPane>\n```\n\n为 `HBox` 窗格布局添加 `alignment`、`spacing` 和 `padding` 属性。\n\n\
  ```xml\n<BorderPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  >\n    <bottom>\n        <HBox alignment=\"TOP_LEFT\" spacing=\"10\">\n        \
  \    <padding>\n                <Insets bottom=\"20\" right=\"20\"/>\n         \
  \   </padding>\n            <Button text=\"OK\" prefWidth=\"70\"/>\n           \
  \ <Button text=\"Cancel\" prefWidth=\"70\"/>\n            <Button text=\"About\"\
  \ prefWidth=\"70\"/>\n        </HBox>\n    </bottom>\n</BorderPane>\n```\n\n* 运行你的应用程序。右键点击\
  \ `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00168.jpg)\n\n### 在 `BorderPane`\
  \ 的顶部位置添加一个 Label\n在 `<BorderPane ...>` 之后输入以下代码：\n\n```xml\n<BorderPane fx:controller=\"\
  sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\">\n    <top>\n        <Label\
  \ text=\"The Top Position\"/>\n    </top>\n```\n\n* 对齐标签。为了对齐标签，我们使用 `BorderPane.alignment`\
  \ 属性：\n\n```xml\n<BorderPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  >\n    <top>\n        <Label text=\"The Top Position\" BorderPane.alignment=\"CENTER\"\
  />\n    </top>\n```\n\n* 运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n\
  ![](img/Image00169.jpg)\n\n### 在 `BorderPane` 的顶部位置添加一个 Label\n在 `<BorderPane ...>`\
  \ 之后输入以下代码，并为左、右和中心区域添加文本：\n\n```xml\n<BorderPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\">\n    <top>\n        <Label text=\"The Top\
  \ Position\"/>\n    </top>\n<left>\n    <Label text=\"Left Area\"/>\n</left>\n<right>\n\
  \    <Label text=\"Right Area\"/>\n</right>\n<center>\n    <Label text=\"Center\
  \ Area\"/>\n</center>\n```\n\n## `StackPane` 布局\n`StackPane` 是一个容器，它可以在单层上堆叠不同的组件。`StackPane`\
  \ 提供了一种在图像或形状上叠加文本以创建复杂形状的方法。\n\n### 构建 StackPane 布局\n\n* 创建一个名为 `StackPane` 的新\
  \ JavaFX 项目\n* 打开 `sample.fxml` 文件，将 `GridPane` 更改为 `StackPane`。删除 `hgap` 和 `vgap`\
  \ 属性，因为它们不适用于此布局。\n\n```xml\n<?import javafx.scene.layout.StackPane?>\n\n<StackPane\
  \ fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\">\n</StackPane>\n\
  ```\n\n添加带红色背景的按钮和一个带蓝色背景的标签。\n\n```xml\n<?import javafx.scene.control.Button?>\n\
  <?import javafx.scene.control.Label?>\n<?import javafx.scene.layout.StackPane?>\n\
  \n<StackPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"center\">\n    <Button text=\"Button One\" style=\"-fx-background-color:red\"\
  />\n    <Label text=\"Label One\" style=\"-fx-background-color:blue\"/>\n</StackPane>\n\
  ```\n\n* 运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00172.jpg)\n\
  \n注意。`Button` 组件消失了。为什么？因为子组件堆叠在一起，在某一时刻你只能看到位于上方的子组件。新添加的 `Label` 组件将位于上方。\n\n\
  ### 修改标签的位置\n\n* 将其剪切并粘贴到 `Button` 控件上方、`StackPane` 布局下方。\n\n```xml\n<StackPane\
  \ fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\" alignment=\"\
  center\">\n    <Label text=\"Label One\" style=\"-fx-background-color:blue\"/>\n\
  \    <Button text=\"Button One\" style=\"-fx-background-color:red\"/>\n</StackPane>\n\
  ```\n\n* 运行程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00173.jpg)\n\
  \n* 保存你的项目。\n\n## `FlowPane` 布局\n`FlowPane` 按行排列连续的子组件，如果当前行已满，它会自动将子组件推送到下一行。\n\
  \n### 创建 FlowPane 布局\n\n* 创建一个名为 `FlowPane` 的新 JavaFX 项目\n* 打开 `sample.fxml` 文件，将\
  \ `GridPane` 更改为 `FlowPane`。`hgap` 和 `vgap` 属性适用于此布局。\n\n```xml\n<?import javafx.scene.control.Button?>\n\
  <?import javafx.scene.layout.FlowPane?>\n\n<FlowPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\"\nhgap=\"10\" vgap=\"\
  10\">\n</FlowPane>\n```\n\n向 `FlowPane` 布局添加按钮。\n\n\n\n\n\n```xml\n<FlowPane fx:controller=\"\
  sample.Controller\" xmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\">\n\
  \    <Button text=\"Button One\"/>\n    <Button text=\"Button Two\"/>\n    <Button\
  \ text=\"Button Three\"/>\n    <Button text=\"Button Four\"/>\n    <Button text=\"\
  Button Five\"/>\n    <Button text=\"Button Six\"/>\n    <Button text=\"Button Seven\"\
  />\n</FlowPane>\n```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\
  ![](img/Image00174.jpg)\n\n*   调整窗口大小。屏幕将如下所示：\n![](img/Image00175.jpg)\n\n`TilePane`\
  \ 布局将其子组件排列在一行中，并在当前行填满时自动将子组件推到下一行。然而，它与 `FlowPane` 的不同之处在于子组件位于相同大小的网格单元中。\n\n\
  ### 创建 TilePane 布局\n\n*   创建一个新的 JavaFX 项目，并将其命名为 `TilePane`。\n*   打开 `sample.fxml`\
  \ 文件，并将 `GridPane` 改为 `TilePane`：\n\n```xml\n<?import javafx.scene.layout.TilePane?>\n\
  <TilePane fx:controller=\"sample.Controller\" xmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"center\" hgap=\"10\" vgap=\"10\">\n</TilePane>\n```\n\n向 TilePane\
  \ 布局添加七个按钮。\n\n```xml\n<?import javafx.scene.control.Button?>\n<?import javafx.scene.layout.TilePane?>\n\
  <TilePane fx:controller=\"sample.Controller\" xmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"center\" hgap=\"10\" vgap=\"10\">\n    <Button text=\"Button One\"\
  />\n    <Button text=\"Button Two\"/>\n    <Button text=\"Button Three\"/>\n   \
  \ <Button text=\"Button Four\"/>\n    <Button text=\"Button Five\"/>\n    <Button\
  \ text=\"Button Six\"/>\n    <Button text=\"Button Seven\"/>\n</TilePane>\n```\n\
  \n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n![](img/Image00176.jpg)\n\
  \n*   调整窗口大小。屏幕将如下所示：\n![](img/Image00177.jpg)\n\n*   子组件位于相同大小的网格单元中：\n![](img/Image00178.jpg)\n\
  \n***\n\n## 总结\n\n*   Java 应用可以包含图形用户界面 (GUI)，其中包含按钮、列表、菜单、复选框等许多其他允许用户与应用程序交互的控件。\n\
  *   `JavaFX` 是一组 Java 包，允许开发者设计能够在 Windows、Linux 和 Mac 等不同平台运行运行保持一致的 GUI 应用程序。\n\
  *   `JavaFX` 是 `Swing` 的继任者，`Swing` 曾多年作为 Java 推荐的用户界面 (UI) 工具包，但现在 Oracle 的方向是使用\
  \ `JavaFX`。\n*   `JavaFX` 中的项目文件设计考虑了模型-视图-控制器 (MVC) 模式。MVC 将应用程序分为三部分：模型 (Model)、视图\
  \ (View) 和控制器 (Controller) 设计。\n*   将程序显示在屏幕上的三个主要对象（从外到内）是：`stage`（应用程序的顶层容器），负责显示场景；`scene`（直接包含在\
  \ stage 中的对象），包含 GUI 的所有元素；根面板/容器持有应用程序的所有部分，如按钮、标签、文本框等。根容器可以用 `StackPane`、`GridPane`\
  \ 和 `BorderPane` 等多个 JavaFX 容器表示。\n*   `JavaFX` 布局是一种布局容器类（也称为面板），用于轻松管理 JavaFX\
  \ 应用程序的用户界面组件或控件。`JavaFX` 提供了以下内置布局（也称为根面板）：`GridPane`、`HBoxPane`、`VBoxPane`、`BorderPane`、`StackPane`。\n\
  *   优先尺寸是指控件的首选宽度和高度。默认情况下，每个用户界面 (UI) 控件根据其内容计算其优先尺寸的默认值。\n\n***\n\n1:https://docs.oracle.com/javafx/2/layout/size_align.htm\n\
  \n***\n\n# 第 26 章：JavaFX 控件\n\n### JavaFX 控件\nJava 控件可以在应用程序任何地方使用的复用组件。你可以使用 Java\
  \ 提供的内置控件，也可以创建自己的。让我们从 JavaFX `Button` 控件开始吧。\n\n### JavaFX Button\n图形用户界面中的控件是交互元素，例如按钮。`JavaFX\
  \ Button` 控件允许应用程序在用户点击按钮时执行某些操作。`Button` 控件可以显示文本、图像或两者都有。\n\n#### 创建 JavaFX Button\
  \ 控件\n\n*   创建一个名为 `Controls` 的新 JavaFX 项目。\n*   打开 `sample.fxml` 文件并创建一个标签为 `Click\
  \ Me` 的按钮，并将其添加到网格的第 0 列第 0 行。`Button` 作为 `GridPane` 布局的子元素添加。\n\n```xml\n<?import\
  \ javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.Button?>\n<?import\
  \ javafx.scene.control.Label?>\n<GridPane fx:controller=\"sample.Controller\" xmlns:fx=\"\
  http://javafx.com/fxml\" alignment=\"center\" hgap=\"10\" vgap=\"10\">\n    <Button\
  \ text=\"Click Me\"/>\n</GridPane>\n```\n\n运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\
  ![](img/Image0179.jpg)\n\n#### 为 Button 添加图像\n\n*   创建一个名为 `images` 的新包。\n*   将你想使用的图像复制到\
  \ `images` 包。\n*   打开 `sample.fxml` 文件。\n*   在按钮中输入以下代码以添加图像：\n\n```xml\n<?import\
  \ javafx.scene.control.Button?>\n<?import javafx.scene.image.ImageView?>\n<?import\
  \ javafx.scene.image.Image?>\n<GridPane fx:controller=\"sample.Controller\" xmlns:fx=\"\
  http://javafx.com/fxml\" alignment=\"center\" hgap=\"10\" vgap=\"10\">\n    <Button\
  \ text=\"Click Me\">\n        <graphic>\n            <ImageView>\n             \
  \   <Image src=\"@0.png\"/>\n            </ImageView>\n        </graphic>\n    </Button>\n\
  </GridPane>\n```\n\n### JavaFX Label\nJavaFX Label 用于在特定空间内显示文本或图像。\n\n#### 构建 Label\n\
  \n*   创建一个名为 `Label` 的新 JavaFX 项目。\n*   打开 `sample.fxml` 文件并创建一个文本为 `This is a Note`\
  \ 的标签，并将其添加到网格的第 1 列第 0 行。该 Label 作为 `GridPane` 布局的子元素添加。\n\n```xml\n<?import javafx.scene.layout.GridPane?>\n\
  <?import javafx.scene.control.Label?>\n<GridPane fx:controller=\"sample.Controller\"\
  \ xmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\" hgap=\"10\" vgap=\"10\"\
  >\n    <Label text=\"This is a Note\"/>\n</GridPane>\n```\n\n#### 为 Label 添加图像\n\
  \n*   创建一个名为 `images` 的新包。\n*   将你想使用的图像复制到 `images` 包。\n*   打开 `sample.fxml` 文件。\n\
  *   在 Label 中输入以下代码以添加图标：\n\n```xml\n<?import javafx.scene.control.Label?>\n<?import\
  \ javafx.scene.image.ImageView?>\n<?import javafx.scene.image.Image?>\n<GridPane\
  \ fx:controller=\"sample.Controller\" xmlns:fx=\"http://javafx.com/fxml\" alignment=\"\
  center\" hgap=\"10\" vgap=\"10\">\n    <Label text=\"This is a Note\">\n       \
  \ <graphic>\n            <ImageView>\n                <Image src=\"@1.png\"/>\n\
  \            </ImageView>\n        </graphic>\n    </Label>\n</GridPane>\n```\n\n\
  #### 修改 Label 的颜色\n使用 `textFill` 属性更改标签的颜色：\n\n```xml\n<Label text=\"This is a Note\"\
  \ textFill=\"blue\"/>\n```\n\n#### 修改 Label 的字体、样式和大小\n要更改 Label 的字体名称、大小，请在 `sample.fxml`\
  \ 文件中添加以下代码：\n\n```xml\n<?import javafx.scene.text.Font?>\n<Label text=\"This is\
  \ a Note\" textFill=\"blue\">\n    <font>\n        <Font name=\"Arial bold\" size=\"\
  14\"/>\n    </font>\n    <graphic>\n        <ImageView>\n            <Image src=\"\
  @1.png\"/>\n        </ImageView>\n    </graphic>\n</Label>\n```\n\n#### 文本换行\n当你创建标签时，有时必须将其放入比渲染所需的更小空间内。为了分解文本（换行）使其适应布局区域，请执行以下操作：\n\
  \n*   使标签的文本更长（例如：`text=\"This is a Note This is a Note This is a Note\"` ）\n* \
  \  如下所示添加 `wrapText` 属性：\n```xml\n<Label text=\"This is a Note This is a Note This\
  \ is a Note\" textFill=\"blue\" wrapText=\"true\"/>\n```\n\n\n\n\n\n![](img/Image00182.jpg)\n\
  \n# JavaFX 单选按钮\n\n`RadioButton` 控件可以被选中或取消选中。通常，单选按钮会被组合成组（也称为 `Toggle Group`），在该组中只能有一个项目被选中。\n\
  \n## 创建单选按钮控件\n\n*   创建一个名为 `RadioButton` 的新 JavaFX 项目。\n*   创建一个单选按钮组。\n\n```xml\n\
  <?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.RadioButton?>\n\
  <?import javafx.scene.control.ToggleGroup?>\n\n<GridPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\"\n    hgap=\"10\" vgap=\"\
  10\">\n<RadioButton GridPane.rowIndex=\"0\"\n    GridPane.columnIndex=\"0\" text=\"\
  Banana\"/>\n<RadioButton GridPane.rowIndex=\"0\"\n    GridPane.columnIndex=\"1\"\
  \ text=\"Orange\"/>\n<RadioButton GridPane.rowIndex=\"0\"\n    GridPane.columnIndex=\"\
  2\" text=\"Apple\"/>\n</GridPane>\n```\n\n## 将单选按钮添加到 ToggleGroup\n\n`ToggleGroup`\
  \ 提供了与其关联的所有单选按钮的引用，并对它们进行管理，确保一次只有一个单选按钮被选中。以下示例创建了一个切换组，三个三个单选按钮，将每个单选按钮添加到切换组中，并指定应用程序启动时应该选中哪个按钮。\n\
  \n*   创建一个名为 `fruitTG` 的 `Toggle Group`。将 `Toggle Group` 作为 `GridPane` 布局的子节点。\n\
  \n```xml\n<?import javafx.scene.control.ToggleGroup?>\n\n<GridPane fx:controller=\"\
  sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\nalignment=\"center\" hgap=\"\
  10\" vgap=\"10\">\n<fx:define>\n<ToggleGroup fx:id=\"fruitTG\"/>\n</fx:define>\n\
  <RadioButton GridPane.rowIndex=\"0\"\nGridPane.columnIndex=\"0\" text=\"Banana\"\
  />\n```\n\n*   将单选按钮添加到 `fruitTG` 切换组中。\n\n```xml\n<RadioButton GridPane.rowIndex=\"\
  0\"\n    GridPane.columnIndex=\"0\" text=\"Banana\"\n    toggleGroup=\"$fruitTG\"\
  />\n<RadioButton GridPane.rowIndex=\"0\"\n    GridPane.columnIndex=\"1\" text=\"\
  Orange\"\n    toggleGroup=\"$fruitTG\"/>\n<RadioButton GridPane.rowIndex=\"0\"\n\
  \    GridPane.columnIndex=\"2\" text=\"Apple\"\n    toggleGroup=\"$fruitTG\"/>\n\
  ```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’，屏幕将如下：\n\n![](img/Image00183.jpg)\n\
  \n## 将单选按钮放入 VBox 布局\n\n```xml\n<?import javafx.scene.layout.VBox?>\n\n. .\n<fx:define>\n\
  <ToggleGroup fx:id=\"colorTG\"/>\n</fx:define>\n<VBox GridPane.rowIndex=\"0\" GridPane.columnIndex=\"\
  1\">\n<RadioButton GridPane.rowIndex=\"0\" GridPane.columnIndex=\"0\"\ntext=\"Banana\"\
  \ toggleGroup=\"$fruitTG\"/>\n<RadioButton GridPane.rowIndex=\"0\" GridPane.columnIndex=\"\
  1\"\ntext=\"Orange\" toggleGroup=\"$fruitTG\"/>\n<RadioButton GridPane.rowIndex=\"\
  0\" GridPane.columnIndex=\"2\"\ntext=\"Apple\" toggleGroup=\"$fruitTG\"/>\n</Vbox>\n\
  ```\n\n## 设置默认选择项为第一个单选按钮\n\n```xml\n<RadioButton GridPane.rowIndex=\"0\"\n    GridPane.columnIndex=\"\
  0\" text=\"Banana\"\n    toggleGroup=\"$fruitTG\" selected=\"true\"/>\n```\n\n*\
  \   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’，屏幕将如下：\n\n![](img/Image00184.jpg)\n\
  \n# JavaFX 复选框\n\nJavaFX `CheckBox` 是一种按钮，可以处于三种状态之一：已选中、未选中和未知（不确定）。\n\n*   **已选中\
  \ (Checked)**：如果 `selected` 为 `true` 且 `indeterminate` 为 `false`，则复选框处于此状态。\n* \
  \  **未选中 (Unchecked)**：如果 `selected` 为 `false` 且 `indeterminate` 为 `false`，则复选框处于此状态。\n\
  *   **未定义 (Undefined)**：如果 `indeterminate` 为 `true`，无论 `selected` 的状态如何，复选框都处于此状态。典型的渲染会使用减号或横线，表示复选框的未定义或不确定状态。\n\
  \n## 创建复选框控件\n\n*   创建一个名为 `CheckBox` 的新 JavaFX 项目。\n*   打开 `sample.fxml` 文件并创建一个标签为\
  \ `Orange` 的新 `CheckBox` 控件，将其添加到网格的第 1 列第 1 行。`CheckBox` 作为 `GridPane` 布局的子节点：\n\
  \n```xml\n<?import javafx.scene.control.CheckBox?>\n\n<GridPane fx:controller=\"\
  sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\"\n\
  hgap=\"10\" vgap=\"10\">\n<CheckBox GridPane.rowIndex=\"1\"\nGridPane.columnIndex=\"\
  1\" text=\"Orange\"/>\n</GridPane>\n```\n\n## 使复选框选中\n\n```xml\n<CheckBox GridPane.columnIndex=\"\
  0\"\nGridPane.rowIndex=\"0\" selected=\"true\"\ntext=\"Orange\"/>\n```\n\n*   运行你的应用程序。右键点击\
  \ `Main.java` 文件并选择 Run ‘Main’，屏幕将如下：\n\n![](img/Image00185.jpg)\n\n## 在 VBox 布局中添加一组复选框\n\
  \n```xml\n<?import javafx.geometry.Insets?>\n<?import javafx.scene.layout.GridPane?>\n\
  <?import javafx.scene.control.CheckBox?>\n<?import javafx.scene.layout.VBox?>\n\n\
  <GridPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"center\"\nhgap=\"10\" vgap=\"10\">\n<VBox GridPane.rowIndex=\"0\"\
  \ GridPane.columnIndex=\"0\">\n<CheckBox text=\"Orange\" selected=\"true\"/>\n<CheckBox\
  \ text=\"Apple\"/>\n<CheckBox text=\"Banana\"/>\n</Vbox>\n</GridPane>\n```\n\n*\
  \   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’，屏幕将如下：\n\n# JavaFX 切换按钮\n\n切换按钮是\
  \ JavaFX 提供的另一种按钮类型。两个或多个切换按钮可以组合成组，其中一次只能选中一个。\n\n## 创建切换按钮\n\n*   创建一个名为 `ToggleButton`\
  \ 的 JavaFX 项目。\n*   打开 `sample.fxml` 文件并添加三个切换按钮，将其添加到 `HBox` 布局。`HBox` 布局作为 `GridPane`\
  \ 布局的子节点。\n\n```xml\n<?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.layout.HBox?>\n\
  <?import javafx.scene.control.ToggleButton?>\n\n<GridPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\">\n<HBox GridPane.rowIndex=\"0\" GridPane.columnIndex=\"\
  0\">\n<ToggleButton text=\"New Delhi\"/>\n<ToggleButton text=\"Khartoum\"/>\n<ToggleButton\
  \ text=\"Tokyo\"/>\n</HBox>\n</GridPane>\n```\n\n## 将切换按钮添加到组\n\n切换按钮的实现与 `RadioButton`\
  \ 非常相似。但是，与单选按钮不同，组中的切换按钮不会强制选择。也就是说，点击已选按钮会导致其取消选中。\n\n*   打开之前的 `ToggleButton`\
  \ 项目。\n*   打开 `sample.fxml` 文件并添加名为 `cityTG` 的切换组。该切换组作为 `GridPane` 布局的子节点。\n\n\
  ```xml\n<?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.layout.HBox?>\n\
  <?import javafx.scene.control.ToggleGroup?>\n<?import javafx.scene.control.ToggleButton?>\n\
  \n<GridPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \nalignment=\"center\" hgap=\"10\" vgap=\"10\">\n<fx:define>\n<ToggleGroup fx:id=\"\
  cityTG\"/>\n</fx:define>\n<HBox GridPane.rowIndex=\"0\" GridPane.columnIndex=\"\
  0\">\n<ToggleButton text=\"New Delhi\" toggleGroup=\"$cityTG\"/>\n<ToggleButton\
  \ text=\"Khartoum\" toggleGroup=\"$cityTG\"/>\n<ToggleButton text=\"Tokyo\" toggleGroup=\"\
  $cityTG\"/>\n</HBox>\n</GridPane>\n```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run\
  \ ‘Main’。\n\n# JavaFX TextField\n\n`TextField` 是一种允许用户输入单行文本的文本组件。\n\n## 创建文本字段控件\n\
  \n*   创建一个名为 `TextField` 的新 JavaFX 项目。\n*   打开 `sample.fxml` 文件并添加文本字段，到网格的第 0 列第\
  \ 0 行。`TextField` 作为 `GridPane` 布局的子节点。\n\n```xml\n<?import javafx.scene.layout.GridPane?>\n\
  <?import javafx.scene.control.TextField?>\n\n<GridPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\"\nalignment=\"center\" hgap=\"10\" vgap=\"\
  10\">\n<TextField GridPane.rowIndex=\"0\"\nGridPane.columnIndex=\"0\"/>\n</GridPane>\n\
  ```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’，屏幕将如下：\n\n\n\n\n\n![](img/Image00188.jpg)\n\
  \n# 设置文本字段的大小\n你可以应用 `prefColumnCount` 属性来设置文本字段的大小。文本字段的大小定义为它一次可以显示的最大字符数。\n\n\
  *   要设置文本字段的大小，请输入以下高亮代码：\n\n```xml\n<?import javafx.scene.layout.GridPane?>\n<?import\
  \ javafx.scene.control.TextField?>\n\n<GridPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\"\n   alignment=\"center\" hgap=\"10\" vgap=\"\
  10\">\n<TextField GridPane.rowIndex=\"0\"\n   GridPane.columnIndex=\"0\"\n   prefColumnCount=\"\
  20\"/>\n</GridPane>\n```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\
  \n![](img/Image00189.jpg)\n\n# JavaFX PasswordField (密码字段)\n`PasswordField` 是类似于\
  \ `TextField` 的输入字段，但它用于输入密码。用户输入的字符将通过为每个输入的字符显示一个圆圈被隐藏。\n\n## 创建密码框控件\n我将使用我在上一节中创建的同一个项目\
  \ - JavaFX `TextField`\n\n*   打开 `sample.fxml` 文件并添加一个密码框，将其添加到网格的列 0、行 1。`PasswordField`\
  \ 作为 `GridPane` 布局的子元素添加，所示：\n\n```xml\n<?import javafx.scene.layout.GridPane?>\n\
  <?import javafx.scene.control.TextField?>\n<?import javafx.scene.control.PasswordField?>\n\
  \n<GridPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"center\"\n   hgap=\"10\" vgap=\"10\">\n<TextField GridPane.rowIndex=\"\
  1\"\n   GridPane.columnIndex=\"0\"/>\n<PasswordField GridPane.rowIndex=\"1\"\n \
  \  GridPane.columnIndex=\"0\"/>\n</GridPane>\n```\n\n*   运行你的应用程序。右键点击 `Main.java`\
  \ 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00190.jpg)\n\n# JavaFX ComboBox (组合框)\n\
  组合框允许用户从项目下拉列表中选择一个项目。\n\n## 创建 ComboBox 控件\n*   创建一个名为 `ComboBox` 的新 JavaFX 项目\n\
  *   打开 `sample.fxml` 文件并创建一个 `ComboBox`，将其添加到网格的列 0、行 0。`ComboBox` 作为 `GridPane`\
  \ 布局的子元素添加。\n\n```xml\n<?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.ComboBox?>\n\
  <?import javafx.collections.FXCollections?>\n<?import java.lang.String?>\n\n<GridPane\
  \ fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\" alignment=\"\
  center\"\n   hgap=\"10\" vgap=\"10\">\n<ComboBox GridPane.columnIndex=\"0\"\n  \
  \ GridPane.rowIndex=\"0\" GridPane.columnSpan=\"2\">\n<items>\n<FXCollections fx:factory=\"\
  observableArrayList\">\n<String fx:value=\"Item 1\"/>\n<String fx:value=\"Item 2\"\
  />\n<String fx:value=\"Item 3\"/>\n<String fx:value=\"Item 4\"/>\n<String fx:value=\"\
  Item 5\"/>\n</FXCollections>\n</items>\n</ComboBox>\n</GridPane>\n```\n\n*   运行你的应用程序。右键点击\
  \ `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00191.jpg)\n\n# 设置 ComboBox\
  \ 的默认选择\n*   在 `<items>` 元素之后输入以下内容：\n\n```xml\n<value>\n<String fx:value=\"Item\
  \ 2\"/>\n</value>\n```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\
  \n![](img/Image00192.jpg)\n\n# 使 ComboBox 可编辑\n`ComboBox` 默认是不可编辑的。但一旦 `ComboBox`\
  \ 变为可编辑，用户就可以在 `ComboBox` 中输入值。要使 `ComboBox` 可编辑，请输入以下内容：\n\n```xml\n<ComboBox GridPane.columnIndex=\"\
  0\" GridPane.rowIndex=\"0\"\nGridPane.columnSpan=\"2\" editable=\"true\">\n```\n\
  \n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00193.jpg)\n\
  \n# JavaFX ChoiceBox (选择框)\n`ChoiceBox` 允许用户从项目列表中选择一个项目。\n\n## 创建 ChoiceBox 控件\n\
  *   创建一个名为 `ChoiceBox` 的新 JavaFX 项目\n*   打开 `sample.fxml` 文件并创建一个带有项目（Item 1, Item\
  \ 2, Item 3, Item 4, Item 5）的选择框，将其添加到网格的列 0、行 0。`ChoiceBox` 作为 `GridPane` 布局的子元素添加。\n\
  \n```xml\n<?import javafx.scene.layout.GridPane?>\n<?import javafx.collections.FXCollections?>\n\
  <?import java.lang.String?>\n<?import javafx.scene.control.ChoiceBox?>\n\n<GridPane\
  \ fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\" alignment=\"\
  center\"\n   hgap=\"10\" vgap=\"10\">\n<ChoiceBox GridPane.columnIndex=\"0\"\n \
  \  GridPane.rowIndex=\"1\">\n<items>\n<FXCollections fx:factory=\"observableArrayList\"\
  >\n<String fx:value=\"Item 1\"/>\n<String fx:value=\"Item 2\"/>\n<String fx:value=\"\
  Item 3\"/>\n<String fx:value=\"Item 4\"/>\n<String fx:value=\"Item 5\"/>\n</FXCollections>\n\
  </items>\n<value>\n<String fx:value=\"Item 3\"/>\n</value>\n</ChoiceBox>\n</GridPane>\n\
  ```\n*(注：此处根据上下文逻辑微调了原文示例 XML 中 ChoiceBox 的 rowIndex，原文中为 0 但描述为行 1，此处保持逻辑对齐)*\n\
  \n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00194.jpg)\n\
  \n# ComboBox 和 ChoiceBox 的区别\n*   `ChoiceBox` 用于小型项目集\n*   `ComboBox` 用于中等项目集\n\
  *   `ListView` 用于大型项目集\n\n# JavaFX ListView (列表视图)\n`ListView` 控件允许从预定义列表中选择一个或多个选项。\n\
  \n## 创建 ListView 控件\n*   创建一个名为 `ListView` 的新 JavaFX 项目\n*   打开 `sample.fxml` 文件并创建一个\
  \ `ListView`，将其添加到网格的列 0、行 0。`ListView` 作为 `GridPane` 布局的子元素添加。\n\n```xml\n<?import\
  \ javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.ListView?>\n\n<GridPane\
  \ fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\n   alignment=\"\
  center\" hgap=\"10\" vgap=\"10\">\n<ListView GridPane.rowIndex=\"0\"\n   GridPane.columnIndex=\"\
  0\"/>\n</GridPane>\n```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\
  \n![](img/Image00195.jpg)\n\n# 设置 ListView 的宽度和高度\n要更改列表的宽度和高度，使用 `prefWidth` 和\
  \ `prefHeight` 属性：将 Banana, Orange, Apple, Apricots, Plums, Kiwis 添加到 ListView 控件中。\n\
  \n```xml\nprefWidth=\"100\" prefHeight=\"100\"\n```\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<?import javafx.scene.control.ListView?>\n<?import javafx.scene.layout.GridPane?>\n\
  <?import javafx.collections.FXCollections?>\n<?import java.lang.String?>\n\n<GridPane\
  \ alignment=\"center\" hgap=\"10\" vgap=\"10\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \nxmlns=\"http://javafx.com/javafx/8.0.102\"\nfx:controller=\"sample.Controller\"\
  >\n\n<ListView GridPane.columnIndex=\"0\" GridPane.rowIndex=\"0\"\nprefWidth=\"\
  100\" prefHeight=\"100\">\n<items>\n<FXCollections fx:factory=\"observableArrayList\"\
  >\n<String fx:value=\"Banana\"/>\n<String fx:value=\"Orange\"/>\n<String fx:value=\"\
  Apple\"/>\n<String fx:value=\"Apricots\"/>\n<String fx:value=\"Plums\"/>\n<String\
  \ fx:value=\"Kiwis\"/>\n<String fx:value=\"Peaches\"/>\n</FXCollections>\n</items>\n\
  </ListView>\n</GridPane>\n```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\
  \n![](img/Image00196.jpg)\n\n# 使 ListView 对象水平排列\n你可以通过将 `orientation` 属性设置为 `HORIZONTAL`\
  \ 来使 ListView 对象水平排列。操作方法如下：\n\n*   将 `prefWidth` 属性设置为 250，`prefHeight` 属性设置为 100。\n\
  *   使用 `orientation` 属性并赋值 \"HORIZONTAL\" 值。\n\n```xml\n<ListView orientation=\"\
  HORIZONTAL\"\nGridPane.columnIndex=\"0\" GridPane.rowIndex=\"0\"\nprefWidth=\"250\"\
  \ prefHeight=\"100\"\norientation=\"HORIZONTAL\">\n```\n\n# JavaFX TextArea (文本区域)\n\
  `TextArea` 是一个允许用户输入多行文本的组件，随后应用程序可以读取这些文本。\n\n## 创建 TextArea 控件\n\n\n\n\n* 创建名为\
  \ `TextArea` 的新 JavaFX 项目\n\n* 打开 `sample.fxml` 文件并创建一个 `TextArea` 控件，将其添加到网格的第\
  \ 0 列、第 0 行。`TextArea` 作为 `GridPane` 布局的子节点添加。\n\n```xml\n<?import javafx.scene.layout.GridPane?>\n\
  <?import javafx.scene.control.TextArea?>\n\n<GridPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\"\nalignment=\"center\" hgap=\"10\" vgap=\"\
  10\">\n<TextArea GridPane.columnIndex=\"0\" GridPane.rowIndex=\"0\"/>\n</GridPane>\n\
  ```\n\n* 运行应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00198.jpg)\n\
  \n### 修改 TextArea 控件的宽度和高度\n要更改 `TextArea` 控件的宽度和高度，请如下所示使用 `prefRowCount` 和 `prefColumnCount`\
  \ 属性：\n\n```xml\n<TextArea GridPane.columnIndex=\"0\"\nGridPane.rowIndex=\"0\" prefRowCount=\"\
  10\"\nprefColumnCount=\"10\">\n```\n\n* `prefColumnCount`: 优先的文本列数（首选宽度）。\n* `prefRowCount`:\
  \ 优先的文本行数（首选高度）。\n\n运行应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n![](img/Image00199.jpg)\n\
  \n### JavaFX Spinner\n`Spinner`（计数器）是一个单行文本字段，允许用户从有序的值序列中选择数字或对象值。要循环遍历序列中的元素，您可以使用：\n\
  \n* 一对微小的箭头按钮。\n* 键盘上的上/下箭头键。\n* 直接在 `Spinner` 中输入（合法的）值。默认情况下，计数器是不可编辑的，但如果将 `editable`\
  \ 属性设置为 `true`，则接受输入。\n\n#### 创建 Spinner 控件\n* 创建名为 `Spinner` 的新 JavaFX 项目。\n\n\
  * 打开 `sample.fxml` 文件并创建一个具有以下属性的 `spinner`。将其添加到网格的第 0 列、第 0 行。`Spinner` 作为 `GridPane`\
  \ 布局的子节点添加。\n\n```xml\n<?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.Spinner?>\n\
  \n<GridPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"center\"\nhgap=\"10\" vgap=\"10\">\n<Spinner GridPane.columnIndex=\"\
  0\" GridPane.rowIndex=\"0\"\nmin=\"0\" max=\"100\" editable=\"true\" initialValue=\"\
  50\"/>\n</GridPane>\n```\n\n* 运行您的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\
  \n![](img/Image00200.jpg)\n\n### 解析\n* `min`: `spinner` 的最小值。\n* `max`: `spinner`\
  \ 的最大值。\n* `editable`: 指定用户是否能够在计数器编辑器中输入内容。\n* `initial value`: `Spinner` 首次实例化时的值。它必须在\
  \ `min` 和 `max` 参数的范围内，否则将使用最大值。\n\n### JavaFX ColorPicker\n颜色选择器允许用户从可用范围内选择特定颜色，或设置他们自己的自定义颜色。\n\
  \n#### 创建 Color Picker 控件\n* 创建名为 `ColorPicker` 的 JavaFX 项目\n\n* 打开 `sample.fxml`\
  \ 文件并创建一个 `ColorPicker` 控件，将其添加到网格的第 0 列、第 0 行。`ColorPicker` 作为 `GridPane` 布局的子节点添加。\n\
  \n```xml\n<?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.ColorPicker?>\n\
  \n<GridPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \nalignment=\"center\"\nhgap=\"10\" vgap=\"10\">\n<ColorPicker GridPane.rowIndex=\"\
  0\"\nGridPane.columnIndex=\"0\"/>\n</GridPane>\n```\n\n* 运行您的应用程序。右键点击 `Main.java`\
  \ 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00201.jpg)\n\n### JavaFX DatePicker\n\
  `DatePicker` 控件允许用户输入日期或从日历中选择日期。日历基于标准的 ISO-8601 年代法或 `java.time.chrono` 包定义的任何其他年代法类。\n\
  \n#### 创建 DatePicker 控件\n* 创建名为 `DatePicker` 的 JavaFX 项目\n\n* 打开 `sample.fxml` 文件并创建一个\
  \ `DatePicker` 控件，将其添加到网格的第 0 列、第 0 行。`DatePicker` 作为 `GridPane` 布局的子节点添加。\n\n```xml\n\
  <?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.DatePicker?>\n\
  \n<GridPane fx:controller=\"sample.Controller\"\nxmlns:fx=\"http://javafx.com/fxml\"\
  \ alignment=\"center\"\nhgap=\"10\" vgap=\"10\">\n<DatePicker GridPane.columnIndex=\"\
  0\" GridPane.rowIndex=\"0\"/>\n</GridPane>\n```\n\n* 运行您的应用程序。右键点击 `Main.java` 文件并选择\
  \ Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00202.jpg)\n\n### JavaFX TitledPane\nTitledPane（标题面板）是一个带有标题且可以展开和折叠的面板。`TitledPane`\
  \ 中的面板可以是 UI 控件，也可以是添加到布局容器中的节点组。\n\n#### 创建 Titled Pane 控件\n* 创建名为 `TitledPane`\
  \ 的 JavaFX 项目\n\n* 打开 `sample.fxml` 文件并创建一个标签为“Titled Pane”的 `TitledPane`，为其添加一个文本为“Label\
  \ in titled Pane 1”的 `Label`。将 `TitledPane` 添加到网格的第 0 列、第 0 行。`TitledPane` 作为 `GridPane`\
  \ 布局的子节点添加。\n\n```xml\n<?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.Label?>\n\
  <?import javafx.scene.control.TitledPane?>\n\n<GridPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\"\nalignment=\"center\" hgap=\"10\" vgap=\"\
  10\">\n<TitledPane text=\"Titled Pane\"\nGridPane.rowIndex=\"0\"\nGridPane.columnIndex=\"\
  0\">\n<Label text=\"Label in titled Pane 1\"/>\n</TitledPane>\n</GridPane>\n```\n\
  \n* 运行您的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\n![](img/Image00203.jpg)\n\
  \n### 在 Accordion 中添加 Titled Pane\nTitled panes 可以使用 `accordion` 控件进行分组。\n\n* 在\
  \ accordion 中添加 Titled panes：\n```xml\n<?import javafx.scene.layout.GridPane?>\n\
  <?import javafx.scene.control.Label?>\n<?import javafx.scene.control.TitledPane?>\n\
  <?import javafx.scene.control.Accordion?>\n\n<GridPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\"\nalignment=\"center\" hgap=\"10\" vgap=\"\
  10\">\n<Accordion GridPane.columnIndex=\"0\"\nGridPane.rowIndex=\"0\"\nGridPane.columnSpan=\"\
  2\">\n<panes>\n<TitledPane text=\"Titled Pane 1\">\n<Label text=\"Label in titled\
  \ Pane 1\"/>\n</TitledPane>\n<TitledPane text=\"Titled Pane 2\">\n<Label text=\"\
  Label in titled Pane 2\"/>\n</TitledPane>\n<TitledPane text=\"Titled Pane 3\">\n\
  <Label text=\"Label in titled Pane 3\"/>\n</TitledPane>\n<TitledPane text=\"Titled\
  \ Pane 4\">\n<Label text=\"Label in titled Pane 4\"/>\n</TitledPane>\n</panes>\n\
  </Accordion>\n</GridPane>\n```\n\n* 运行应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\
  \n![](img/Image00204.jpg)\n\n#### 设置在 Accordion 中默认打开的 TitledPane\n* 在所选的 `TitledPane`\
  \ 中添加 `fx:id` 标签：\n```xml\n<TitledPane fx:id=\"tp3\" text=\"Titled Pane 3\">\n```\n\
  * 在 `Accordion` 元素中添加 `expandedPane` 属性，引用所选的 `TitledPane`：\n```xml\n<Accordion\
  \ GridPane.columnIndex=\"0\"\nGridPane.rowIndex=\"0\"\nGridPane.columnSpan=\"2\"\
  \ expandedPane=\"$tp3\">\n```\n\n* 运行您的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下所示：\n\
  \n![](img/Image00205.jpg)\n\n### JavaFX Menu\n菜单是桌面应用程序选择选项的标准方式。菜单实际上由以下部分组成：\n\
  \n* 菜单栏（Menu Bar）：包含单个菜单的容器，例如文件菜单和帮助菜单。\n* 至少一个菜单（Menu）：菜单内部包含菜单项，例如编辑菜单中的某些菜单项是剪切、复制和粘贴。\n\
  * 多个菜单项。\n\n因此，菜单栏包含菜单，菜单包含包含菜单项。所以你需要创建一个菜单栏对象（javafx.scene.control.MenuBar）来持有菜单对象（javafx.scene.control.Menu）。菜单对象可以包含菜单和菜单项对象（javafx.scene.control.MenuItem）。菜单也可以包含其他菜单作为子菜单。\n\
  \n#### 创建 Menu 控件\n* 创建名为 `Menu` 的 JavaFX 项目\n\n* 打开 `sample.fxml` 文件并将 `GridPane`\
  \ 更改为 `BorderPane`。\n\n* 在 `BorderPane` 中移除 `alignment`、`hgap` 和 `vgap` 属性，因为它们不适用于此布局。\n\
  \n\n\n\n- 在 `BorderPane` 布局内部创建 `MenuBar` 控件，并指定 `MenuBar` 在 `BorderPane` 内部的位置，例如顶部（top）。\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<?import javafx.scene.control.MenuBar?>\n\
  <?import javafx.scene.layout.BorderPane?>\n\n<BorderPane prefHeight=\"228.0\" prefWidth=\"\
  190.0\" xmlns=\"http://javafx.com/javafx/8.0.102\" xmlns:fx=\"http://javafx.com/fxml/1\"\
  \ fx:controller=\"sample.Controller\">\n  <top>\n    <MenuBar>\n    </MenuBar>\n\
  \  </top>\n</BorderPane>\n```\n\n- 然后为 `MenuBar` 创建一个 `File` 菜单，并向 `File` 菜单添加 `Open`\
  \ 和 `Close` `MenuItem` 项。\n\n```xml\n<?import javafx.scene.control.Menu?>\n<?import\
  \ javafx.scene.control.MenuItem?>\n<!-- . . -->\n<top>\n  <MenuBar>\n    <Menu text=\"\
  File\">\n      <MenuItem text=\"Open\"/>\n      <MenuItem text=\"Close\"/>\n   \
  \ </Menu>\n  </MenuBar>\n</top>\n```\n\n- 运行你的应用程序。右键点击 `Main.java` 文件并选择 `Run \"\
  Main.java\"`。屏幕将如下：\n\n![](img/Image00206.jpg)\n\n**注意**：菜单栏可以放置在用户界面的其他地方，通常位于\
  \ UI 顶部，包含一个或多个菜单。菜单栏会自动调整大小以适应应用程序窗口的宽度。\n\n### JavaFX Tooltip\n`Tooltip` 可以设置在任何控件上。`Tooltip`\
  \ 有两种不同的状态：\n- **Activated（激活）**：当鼠标移动到控件上时。\n- **Showing（显示）**：当 tooltip 出现时。显示的\
  \ tooltip 也是被激活的。\n\n### 创建 Tooltip（为密码字段添加 Tooltip）\n创建一个名为 `Password` 的新 JavaFX\
  \ 项目。\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<?import javafx.scene.control.Tooltip?>\n\
  <?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.PasswordField?>\n\
  \n<GridPane alignment=\"center\" hgap=\"10\" prefHeight=\"400.0\" prefWidth=\"600.0\"\
  \ vgap=\"10\" xmlns:fx=\"http://javafx.com/fxml/1\" xmlns=\"http://javafx.com/javafx/9.0.1\"\
  \ fx:controller=\"sample.Controller\">\n  <PasswordField>\n    <tooltip>\n     \
  \ <Tooltip text=\"Your password must be at least 8 characters in length\"/>\n  \
  \  </tooltip>\n  </PasswordField>\n</GridPane>\n```\n![](img/Image00207.jpg)\n\n\
  ### JavaFX Separator\n`Separator` 类表示水平或垂直的分割线。它用于划分应用程序用户界面的元素，不会产生任何操作。默认情况下，分割线是水平的。你可以通过\
  \ `setOrientation` 方法更改它的方向。\n\n#### 创建垂直分割线\n```xml\n<Separator orientation=\"\
  VERTICAL\" prefHeight=\"200.0\" GridPane.columnIndex=\"1\"/>\n```\n\n#### 创建水平分割线\n\
  ```xml\n<Separator orientation=\"HORIZONTAL\" prefWidth=\"200.0\" />\n```\n通常，分割线用于划分\
  \ UI 控件组。\n\n***\n\n## 事件与事件处理器\n在 JavaFX 应用程序中，事件是某些已发生的通知。当用户点击按钮、按下键、移动鼠标或执行其他操作时，事件就会被分发。应用程序中注册的事件处理器会接收事件并提供响应。\n\
  \n### JavaFX 按钮事件\n每个按钮的主要功能是在被点击时产生操作。使用 `Button` 控件的 `onAction` 属性来定义用户点击按钮时会发生什么。\n\
  \n#### 为按钮控件分配事件处理器\n- 创建一个名为 `ButtonEvent` 的新 JavaFX 项目。\n- 打开 `sample.fxml` 文件并创建一个标签为\
  \ `Click Me` 的按钮，并将其添加到网格的第 0 列、第 0 行。`Button` 被作为 `GridPane` 布局的子元素添加。\n\n####\
  \ 创建一个名为 `onButtonClicked()` 的事件处理器\n- 打开 `Controller.java` 文件并按照如下所示添加 `onButtonClicked()`\
  \ 事件处理器：\n\n```java\npackage sample;\n\npublic class Controller {\n    public void\
  \ onButtonClicked(){\n        System.out.println(\"Hello\");\n    }\n}\n```\n\n\
  - 将 `Button` 控件分配给 `onButtonClicked()` 事件处理器。打开 `sample.fxml` 文件并将 `#onButtonClicked`\
  \ 值分配给 `onAction` 属性：\n\n```xml\n<Button text=\"Click Me\" GridPane.columnIndex=\"\
  0\" GridPane.rowIndex=\"0\" onAction=\"#onButtonClicked\"/>\n```\n\n- 运行你的应用程序。多次点击\
  \ `Click Me` 按钮。屏幕将如下：\n\n![](img/Image00208.jpg)\n\n按钮的动作每当按钮被点击、触摸或按下按键时就会被调用。\n\
  \n### JavaFX TextField 事件\n让我们在 `Button` 中添加一个 `TextField`。当按钮被按下时，hello 紧接着是字段中输入的内容，并将将被写入控制台。\n\
  \n- 打开 `sample.fxml` 文件，在网格布局中添加一个文本字段，并将其放在第二行。\n\n```xml\n<?import javafx.scene.control.TextField?>\n\
  <!-- . . -->\n<TextField GridPane.rowIndex=\"1\" GridPane.columnIndex=\"0\"/>\n\
  ```\n\n- 在 `Controller.java` 文件代码中引用 `sample.fxml` 文件中的 `TextField` 控件。因此进入 `sample.fxml`\
  \ 文件为 `TextField` 控件分配 `fx:id`：\n\n```xml\n<TextField fx:id=\"nameField\" GridPane.rowIndex=\"\
  1\" GridPane.columnIndex=\"0\"/>\n```\n\n- 在 `Controller.java` 文件代码中引用 `sample.fxml`\
  \ 文件中的 `TextField` 控件。因此进入 `sample.fxml` 文件为 `TextField` 控件分配 `fx:id`。\n\n```java\n\
  package sample;\nimport javafx.fxml.FXML;\nimport javafx.scene.control.TextField;\n\
  \npublic class Controller {\n    @FXML\n    private TextField nameField;\n\n   \
  \ public void onButtonClicked(){\n        System.out.println(\"Hello, \" + nameField.getText());\n\
  \    }\n}\n```\n- 运行你的应用程序。在字段中输入任何名称。屏幕将如下：\n\n![](img/Image0029.jpg)\n\n- 对事件处理器进行注解是一个好主意，但不是强制的。为什么？为了能够一眼看出该方法与\
  \ FXML 关联。\n\n```java\npackage sample;\nimport javafx.fxml.FXML;\nimport javafx.scene.control.TextField;\n\
  \npublic class Controller {\n    @FXML\n    private TextField nameField;\n\n   \
  \ @FXML\n    public void onButtonClicked(){\n        System.out.println(\"Hello,\
  \ \" + nameField.getText());\n    }\n}\n```\n\n### 注意\n- 确保变量 `nameField` 与 `fx:id`\
  \ 名称一致（sample.fxml）。\n- `@FXML` 注解允许 `FXLoader` 将 FXML 中定义的值注入到类的引用中。换句话说，如果你为 `nameField`\
  \ 注解了 `@FXML`，当 `load()` 方法被带有 `fx:id=\"nameField\"` 的元素调用时，它将被初始化。\n- 任何与 `fx:id`\
  \ 属性匹配的公共字段，或任何非公共字段，只要标记了 `@FXML` 即可。\n- `getText()` 方法用于获取文本字段的值。\n\n### 事件处理器\
  \ - 参数\n某些事件处理器可以接受参数。如果我们想这样做，实际上可以为现有的事件处理器方法添加一个 `ActionEvent` 参数。让我们尝试并看看它是如何工作的。\n\
  \n#### 为事件处理器方法添加 ActionEvent 参数\n进入 `Controller.java` 文件并为 `onButtonClicked()`\
  \ 事件处理器方法添加以下代码：\n\n```java\n@FXML\npublic void onButtonClicked(ActionEvent e){\n\
  \    System.out.println(\"Hello, \" + nameField.getText());\n}\n```\n为什么我们使用 `ActionEvent`\
  \ 参数？因为如果我们想为多个控件使用同一个事件/事件处理器，我们需要知道是哪个控件进行交互的。因此，不需要为每个控件创建一个事件处理器，我们只需要在方法中添加此参数，然后调用\
  \ `getSource()` 方法，它可以判断出实际上使用了哪个控件。\n\n#### 创建两个按钮控件并将它们添加到 onButtonClicked 方法\n\
  打开 `sample.fxml` 并添加两个按钮。\n\n```xml\n<GridPane fx:controller=\"sample.Controller\"\
  \ xmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\" hgap=\"10\" vgap=\"10\"\
  >\n  <TextField fx:id=\"nameField\" GridPane.rowIndex=\"0\" GridPane.columnIndex=\"\
  0\"/>\n</GridPane>\n```\n\n\n\n\n```xml\n<Button fx:id=\"byeButton\" text=\"Bye\"\
  \ GridPane.columnIndex=\"0\" GridPane.rowIndex=\"1\" onAction=\"#onButtonClicked\"\
  />\n<Button fx:id=\"helloButton\" text=\"Hello\" GridPane.rowIndex=\"1\" GridPane.columnIndex=\"\
  1\" onAction=\"#onButtonClicked\"/>\n</GridPane>\n```\n\n回到 `Controller.java` 文件并为两个按钮添加两个私有字段：\n\
  \n```java\nimport javafx.fxml.FXML;\nimport javafx.scene.control.Button;\nimport\
  \ javafx.scene.control.TextField;\nimport javafx.event.ActionEvent;\n\n@FXML\nprivate\
  \ TextField nameField;\n\n@FXML\nprivate Button helloButton;\n\n@FXML\nprivate Button\
  \ byeButton;\n```\n\n按照按照如下代码修改 `onButtonClicked(ActionEvent e)` 方法（一个处理两个按钮事件的事件处理器方法）：\n\
  \n```java\n@FXML\npublic void onButtonClicked(ActionEvent e){\n    if (e.getSource().equals(helloButton)){\n\
  \        System.out.println(\"Hello, \" + nameField.getText());\n    }else if (e.getSource().equals(byeButton)){\n\
  \        System.out.println(\"Bye, \" + nameField.getText());\n    }\n}\n```\n\n\
  运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将所示： \n![](img/Image00210.jpg)\n\n\
  ## 当文本字段为空时禁用按钮\n\n为了在文本字段为空时禁用按钮，请执行以下操作：\n\n*   进入 `Controller.java` 文件，在 `onButtonClicked()`\
  \ 方法之后，创建一个新方法并命名为 `handleKeyReleased()`。\n\n```java\n@FXML\npublic void handleKeyReleased(){\n\
  \    String text = nameField.getText();\n    boolean disableButtons = text.isEmpty()\
  \ || text.trim().isEmpty();\n    helloButton.setDisable(disableButtons);\n    byeButton.setDisable(disableButtons);\n\
  }\n```\n\n## 在应用程序首次运行时禁用按钮\n\n*   为了在应用程序首次运行时禁用按钮，我们必须向选择器中添加一个 `initialize` 方法。JavaFX\
  \ 运行时在初始化 UI 时会调用此方法。该方法不能有任何参数，必须是公共的，并且我们必须为其添加 `@FXML`。因此，在 `onButtonClicked()`\
  \ 方法之前添加以下代码：\n\n```java\n@FXML\npublic void initialize()(){\n    helloButton.setDisable(true);\n\
  \    byeButton.setDisable(true);\n}\n```\n\n*   将我们刚刚写的事件处理器关联到我们的文本字段。打开 `sample.fxml`\
  \ 文件并为 `TextField` 添加 `onKeyReleased` 属性：\n\n```xml\n<TextField fx:id=\"nameField\"\
  \ GridPane.rowIndex=\"0\"\nGridPane.columnIndex=\"0\" onKeyReleased=\"#handleKeyReleased\"\
  />\n```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将所示：\n![](img/Image00211.jpg)\n\
  \n当你输入内容时，按钮将变为启用状态。\n\n## JavaFX PasswordField 事件\n\n`PasswordField` 用于密码输入。用户输入的字符将通过显示回显字符串被隐藏。因此，在本节中，我们将创建一个密码字段组件并为其设置提示消息文本。\n\
  \n### 创建密码字段并设置提示消息文本\n\n*   创建一个名为 `PasswordEvents` 的新 JavaFX 项目。\n*   打开 `sample.fxml`\
  \ 文件并添加一个密码字段，将其添加到网格列 `0`、行 `0`。`PasswordField` 作为 `GridPane` 布局的子元素添加。\n\n```xml\n\
  <?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.control.TextField?>\n\
  <?import javafx.scene.control.PasswordField?>\n\n<GridPane fx:controller=\"sample.Controller\"\
  \nxmlns:fx=\"http://javafx.com/fxml\" alignment=\"center\" hgap=\"10\" vgap=\"10\"\
  >\n    <PasswordField GridPane.rowIndex=\"0\" GridPane.columnIndex=\"0\"/>\n</GridPane>\n\
  ```\n\n*   设置提示消息文本。提示显示为字段中的灰色文本，并为用户提供该字段用途的提示，而无需使用 label 控件。\n\n```xml\n<PasswordField\
  \ GridPane.rowIndex=\"0\" GridPane.columnIndex=\"0\" promptText=\"Enter Password\"\
  />\n```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将所示：\n![](img/Image00212.jpg)\n\
  \n对于密码字段，指定的字符串会被回显字符隐藏。默认情况下回显字符是一个点。可以通过 `getText()` 方法获取密码字段中的值。\n\n*   创建一个\
  \ label 控件，并将其添加到网格列 `0`、行 `1`。label 作为 `GridPane` 布局的子元素。\n\n```xml\n<Label text=\"\
  Label\"\n    GridPane.rowIndex=\"1\"\n    GridPane.columnIndex=\"0\" />\n```\n\n\
  *   使用 `fx:id` 属性将对象注入控制器（`Controller.java` 类），如下：\n\n```xml\n<PasswordField fx:id=\"\
  pwd\"\n    promptText=\"Enter Password\"\n    GridPane.rowIndex=\"0\"\n    GridPane.columnIndex=\"\
  0\"/>\n<Label fx:id=\"message\" text=\"Label\"\n    GridPane.rowIndex=\"1\" />\n\
  ```\n\n*   设置你的 `CheckPassword()` 方法来检查 `PasswordField` 中的文本。你的 `Controller.java`\
  \ 代码将类似于下面：\n\n```java\n01 package sample;\n02\n03 import javafx.fxml.FXML;\n04\
  \ import javafx.scene.control.Label;\n05 import javafx.scene.control.PasswordField;\n\
  06 import javafx.scene.paint.Color;\n07\n08 public class Controller {\n09 @FXML\n\
  10 private PasswordField pwd;\n11\n12 @FXML\n13 private Label message;\n14\n15 @FXML\n\
  16 public void initialize() {\n17 message.setText(\"\");\n18 }\n19\n20 @FXML\n21\
  \ public void CheckPassword() {\n22 if (!pwd.getText().equals(\"abc\")){\n23 message.setText(\"\
  Your password is incorrect!\");\n24 message.setTextFill(Color.red);\n25 }else {\n\
  26 message.setText(\"Your password has been confirmed\");\n27 message.setTextFill(Color.black);\n\
  28 }\n29 }\n30 }\n31\n\n*   使用 `onAction` 属性将 `CheckPassword()` 方法连接到 `PasswordField`\n\
  \n```xml\n<PasswordField fx:id=\"pwd\" onAction=\"#CheckPassword\" />\n```\n\n###\
  \ 说明\n\n*   如果值不符，消息将以红色显示。(Image00213.jpg)\n*   如果值符合要求，将显示确认消息。(Image00214.jpg)\n\
  \n## 在 JavaFX 中构建菜单\n\n菜单实际上由：\n*   `MenuBar`\n*   至少一个 `Menu`\n*   若干 `Menu Items`\n\
  \n`MenuBar` 是包含菜单的容器，例如 `File` 菜单、`Edit` 菜单和 `Help` 菜单。点击菜单时会出现菜单项。File 菜单中通常有 Save\
  \ 和 Quit。\n\n*   创建一个 Java 项目\n*   将 Stage 的 title 属性设置为 `Java Menu`。进入 `Main.java`\
  \ 类并修改代码：\n\n```java\nprimaryStage.setTitle(\"Java Menu\");\n```\n\n*   打开 `sample.fxml`\
  \ 文件并在 `GridPane` 中添加 `MenuBar`，如下：\n\n```xml\n<GridPane alignment=\"center\"\n\
  \    hgap=\"10\"\n    vgap=\"10\"\n    xmlns:fx=\"http://javafx.com/fxml\"\n   \
  \ xmlns=\"http://javafx.com/javafx/9.0.1\"\n    fx:controller=\"sample.Controller\"\
  >\n    <children>\n        <MenuBar>\n            <menus>\n                <Menu\
  \ mnemonicParsing=\"false\" text=\"File\">\n                    <items>\n      \
  \                  <MenuItem mnemonicParsing=\"false\" text=\"Close\"/>\n      \
  \              </items>\n                </Menu>\n                <Menu mnemonicParsing=\"\
  false\" text=\"Help\">\n                    <items>\n                        <MenuItem\
  \ mnemonicParsing=\"false\" text=\"About\"/>\n                    </items>\n   \
  \             </Menu>\n            </menus>\n        </MenuBar>\n    </children>\n\
  </GridPane>\n```\n\n*   使用 `prefWidth` 和 `prefHeight` 属性将 `GridPane` 的尺寸更改为 `200`\
  \ X `400`：\n\n```xml\n<GridPane alignment=\"center\"\n    hgap=\"10\"\n    vgap=\"\
  10\"\n    xmlns:fx=\"http://javafx.com/fxml/1\"\n    xmlns=\"http://javafx.com/javafx/9.0.1\"\
  \n    fx:controller=\"sample.Controller\"\n    prefWidth=\"200\" prefHeight=\"400\"\
  >\n```\n\n*   将 `GridPane` 布局的 `alignment` 属性设置为 `TOP_LEFT`如下：\n\n```xml\n<GridPane\
  \ alignment=\"TOP_LEFT\"\n    hgap=\"10\"\n    vgap=\"10\"\n    xmlns:fx=\"http://javafx.com/fxml/1\"\
  \n    xmlns=\"http://javafx.com/javafx/9.0.1\"\n    fx:controller=\"sample.Controller\"\
  >\n```\n\n*   将 `MenuBar` 控件的 `hgrow` 属性设置为 `STRETCH`。\n\n\n\n\n`<MenuBar GridPane.hgrow=\"\
  ALWAYS\">`菜单栏会自动调整大小以适应应用程序窗口的宽度。默认情况下，添加到菜单栏的每个菜单都由一个带有文本值的按钮表示。\n\n*   一旦创建了 `MenuBar`，你就可以向它中添加\
  \ `Menu`。一个 `Menu` 代表一个带有嵌套菜单项的单个垂直菜单。以下是一个向 `MenuBar` 中添加 `Menu` 的示例：\n\n```xml\n\
  <MenuBar>\n  <menus>\n    <Menu mnemonicParsing=\"false\" text=\"File\">\n    </Menu>\n\
  \  </menus>\n</MenuBar>\n```\n如你所见，`MenuBar` 中只有一个名为“File”的菜单。\n\n*   使用 `<MenuItem>`\
  \ 元素向菜单中添加菜单项。\n\n```xml\n<MenuBar>\n  <menus>\n    <Menu mnemonicParsing=\"false\"\
  \ text=\"File\">\n      <items>\n        <MenuItem mnemonicParsing=\"false\" text=\"\
  Close\" />\n      </items>\n    </Menu>\n  </menus>\n</MenuBar>\n```\n如你所见，“File”菜单中只有一个名为“Close”的菜单项。\n\
  \n*   运行应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main’。屏幕将如下：\n\n![](img/Image00215.jpg)\n\
  \n## MenuItem 事件\n\n在之前的示例中创建的 `MenuBar` 在你选择任何菜单项时不会做出反应。为了响应对 `MenuItem` 的选择，你必须在\
  \ `MenuItem` 上设置一个事件。让我们来这样做。\n\n*   创建一个名为 `onCloseClicked()` 的事件处理器。打开 `Controller.java`\
  \ 文件并按照如下所示添加 `onCloseClicked()` 事件处理器：\n\n```java\npackage sample;\n\nimport javafx.application.Platform;\n\
  import javafx.fxml.FXML;\nimport javafx.scene.control.MenuItem;\n\npublic class\
  \ Controller {\n    @FXML\n    private MenuItem close;\n\n    @FXML\n    public\
  \ void onCloseClicked(){\n        Platform.exit();\n    }\n}\n```\n\n*   将菜单项分配给\
  \ `onCloseClicked()` 事件处理器。打开 `sample.fxml` 文件并将 `#onCloseClicked` 的值分配给 `onAction`\
  \ 属性：\n\n```xml\n<MenuItem fx:id=\"close\" mnemonicParsing=\"false\" onAction=\"\
  #onCloseClicked\" text=\"Close\"/>\n```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run\
  \ ‘Main.java’。选择 File > Close。应用程序将关闭。\n\n## 助记键 (Key Mnemonics)\n\n助记键是菜单栏菜单中带有下划线的字母。当你按下\
  \ `Alt+<字母>` 时，菜单将被打开。它让你能够快速访问菜单。要定义一个助记键，请在你的菜单文本中放置字符 `_`，并在你的 FXML 或后端的支持代码中将\
  \ `mnemonicParsingProperty()` 设置为 `true`。然后，JavaFX 将自动计算并为你的菜单设置助记键。\n\n示例：为 File\
  \ 菜单添加键助记。创建一个使用字母“F”作为助记键的 File 菜单。\n\n*   要为“File”菜单添加键助记，我们如如下所示在 F 字母之前放置字符\
  \ `_`，并在 FXML 代码中将 `mnemonicParsing` 设置为 `true`：\n\n```xml\n<Menu mnemonicParsing=\"\
  true\" text=\"_File\">\n```\n\n*   运行你的应用程序。右键点击 `Main.java` 文件并选择 Run ‘Main.java’。按下\
  \ `Alt + F`，File 菜单将被打开。\n\n![](img/Image00216.jpg)\n\n## 键组合 (Key Combinations)\n\
  \n键组合是选择菜单选项的按键组合。键组合被称为键盘快捷键。键盘快捷键被称为加速器 (accelerator)。加速器由按键组合组成：\n\n*   一个主键：`A,\
  \ B, C, …`\n*   修饰键：`Ctrl`, `Command`, `Meta`, `Shift`, `Alt`\n\n键盘快捷键在 Windows\
  \ 上通常是 `Ctrl + <a 键>`，在 Mac 上通常是 `Meta + <a 键>`。例如，在 Windows 平台上，键组合 `(Ctrl + S)`\
  \ 可以保存文件。在 Mac OS 平台上，键组合将是 `(Command + S)`。通常修饰键与单个字母组合使用。\n\n### 创建键组合\n\n我们将学习如何使用按键\
  \ `Ctrl + C` 来调用 `MenuItem` 加速器，该加速器将退出应用程序。\n\n```xml\n<MenuItem fx:id=\"close\"\
  \ onAction=\"#onCloseClicked\" text=\"Close\" accelerator=\"shift+C\">\nOR\n<MenuItem\
  \ fx:id=\"close\" onAction=\"#onCloseClicked\" text=\"Close\" accelerator=\"alt+C\"\
  >\nOR\n<MenuItem fx:id=\"close\" onAction=\"#onCloseClicked\" text=\"Close\" accelerator=\"\
  meta+C\">\nOR\n<MenuItem fx:id=\"close\" onAction=\"#onCloseClicked\" text=\"Close\"\
  \ accelerator=\"shortcut+C\">\n```\n\n### 注意\n\n*   代码使用了 `KeyCombination.SHORTCUT_DOWN`\
  \ 值作为键修饰符，而不是 `CONTROL_DOWN` 或 `META_DOWN`。`SHORTCUT_DOWN` 的值将使应用程序能够跨平台。\n*   `CONTROL_DOWN`\
  \ 和 `META_DOWN` 分别在 Windows 和 Mac OS 平台上取决于系统，但 `SHORTCUT_DOWN` 在所有平台上均有效。\n\n##\
  \ JavaFX 上下文菜单和事件（响应鼠标右键点击）\n\n上下文菜单 (context menu) 是响应鼠标点击而出现的弹出窗口。上下文菜单可以包含多个菜单项。\n\
  \n### 在 JavaFX 中构建上下文菜单\n\n上下文菜单是响应鼠标点击而出现的弹出窗口。上下文菜单可以包含多个菜单项。\n\n*   响应鼠标点击的上下文菜单。\n\
  *   设置 `Stage` 标题为“JavaFX Context Menu”。\n*   在 `sample.fxml` 中，如下所示将 `MenuBar`\
  \ 放入 `GridPane` 中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\n<?import\
  \ javafx.scene.control.*?>\n<?import javafx.scene.layout.*?>\n\n<GridPane alignment=\"\
  center\" hgap=\"10\" prefHeight=\"400.0\" prefWidth=\"300.0\" vgap=\"10\">\n   <MenuBar>\n\
  \    <menus>\n      <Menu>\n        <items>\n          <MenuItem mnemonicParsing=\"\
  false\" text=\"Close\" onAction=\"#onCloseClicked\" />\n        </items>\n     \
  \ </Menu>\n    </menus>\n   </MenuBar>\n</GridPane>\n```\n\n*   在 `Main.java` 中设置场景：\n\
  \n```java\nprimaryStage.setScene(new Scene(root, 300, 400));\n```\n\n*   打开 `sample.fxml`\
  \ 并在 `GridPane` 中创建 `MenuBar`。向 `MenuBar` 中添加 `ContextMenu`。然后如下所示添加 `MenuItem`\
  \ \"Close\"：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\n<?import javafx.scene.control.*?>\n\
  <?import javafx.scene.layout.*?>\n\n<GridPane alignment=\"center\" hgap=\"10\" prefHeight=\"\
  400.0\" prefWidth=\"300.0\" vgap=\"10\">\n   <MenuBar>\n    <menus>\n      <Menu>\n\
  \        <items>\n          <MenuItem mnemonicParsing=\"false\" text=\"Close\" onAction=\"\
  #onCloseClicked\" />\n        </items>\n      </Menu>\n    </menus>\n   </MenuBar>\n\
  </GridPane>\n```\n\n*   将 `MenuBar` 的大小调整为 300x400，使用 `prefWidth` 和 `prefHeight`\
  \ 属性：\n\n```xml\n<MenuBar prefHeight=\"400.0\" prefWidth=\"300.0\">\n```\n\n*  \
  \ 为了响应鼠标右点击，添加一个事件处理器来监听右点击事件并调用上下文菜单的 `onCloseClicked()` 方法。打开 `Controller.java`\
  \ 文件并添加 `onCloseClicked()` 事件处理器：\n\n```java\npackage sample;\n\nimport javafx.application.Platform;\n\
  import javafx.fxml.FXML;\nimport javafx.scene.control.MenuItem;\n\npublic class\
  \ Controller {\n    @FXML\n    private MenuItem close;\n\n    @FXML\n    public\
  \ void onCloseClicked(){\n        Platform.exit();\n    }\n}\n```\n\n*   运行你的应用程序。右键点击\
  \ `Main.java` 文件并选择 Run ‘Main.java’。在窗口内右键点击并关闭。\n\n![](img/Image00217.jpg)\n\n\
  * * *\n\n总结\n\n*   Java 控件是应用程序中任何地方都可以使用的复用组件。可以使用 Java 内置控件，也可以创建自己的。所以让我们从 JavaFX\
  \ `Button` 控件开始。\n*   图形用户界面中的控件是交互元素，例如按钮、标签、单选框、复选框和文本字段。\n\n\n\n\n\n在 JavaFX\
  \ 应用中，事件是某些操作已发生的通知。当用户点击按钮、按下键、移动鼠标或执行其他操作时，事件就会被发布。\n\n- `https://docs.oracle.com/javafx/2/ui_controls/toggle-button.htm`\n\
  - `http://docs.oracle.com/`\n\n# 第 27 章 JavaFX 与 Scene Builder\n\n### 引言\n到目前，你已经学习了如何通过编程编写和样式化\
  \ UI 元素。现在，在本章中，你将学习如何使用 `Scene Builder` 构建一个简单的 UI。\n\n`JavaFX Scene Builder` 是一个视觉化布局工具，允许用户无需编写代码即可快速设计\
  \ JavaFX 应用程序的用户界面。用户可以将 UI 组件拖放到工作区域，修改它们的属性，应用样式表，而他们所创建的布局的 `FXML` 代码会在后台自动生成。其结果是一个\
  \ `FXML` 文件，随后可以通过将 UI 绑定到应用程序逻辑中，将其与 Java 项目结合。\n\n## 特性\n- **UI 布局工具**：`Scene\
  \ Builder` 允许你轻松布局 JavaFX UI 控件、图表、形状和容器。\n- **FXML 视觉编辑器**：`Scene Builder` 生成 `FXML`，这是一种基于\
  \ XML 的标记语言，允许用户定义应用程序的用户界面。\n- **集成开发工作流**：`Scene Builder` 可以与任何 Java IDE 配合使用，例如\
  \ `IntelliJ IDEA`、`NetBeans IDE` 和 `Eclipse IDE`。\n- **预览你的工作**：在创建项目的任何时候，你都可以预览用户界面在部署后的真实外观。\n\
  - **跨平台**：`Scene Builder` 以 JavaFX 应用程序的形式编写，支持 Windows、Mac OS X 和 Linux。\n- **自包含**：`Scene\
  \ Builder` 被封装成一个自包含的应用程序，这意味着它自带了一份私有的 `JRE` 副本。\n- **CSS 支持**：你可以通过使用样式表为你的 GUI\
  \ 布局应用选择的外观和感受。\n\n## 安装 Scene Builder\n安装 `Scene Builder` 就像安装大多数软件一样。以下是操作方法：\n\
  - 访问 `Scene Builder` (`http://gluonhq.com/products/scene-builder`)\n- 点击 `Download`\
  \ 按钮。\n- 点击对应你电脑操作系统的按钮（Windows、Mac 或 Linux）。\n- 在 Windows 电脑上，你会得到一个 `.exe` 文件。双击文件开始安装。\n\
  - 按照安装程序的说明进行。\n\n### 指定 JavaFX Scene Builder 可执行文件的路径\n为了能够能够在 `IntelliJ IDEA`\
  \ 中直接通过 `JavaFX Scene Builder` 打开你的 `FXML` 文件，你应该指定 `Scene Builder` 可执行文件所在的位置。你可以按照本节描述的方法单独进行。你也可以在以后进行，即当你第一次从\
  \ `IntelliJ IDEA` 内部通过 `Scene Builder` 打开 `FXML` 文件时。\n\n要指定 JavaFX Scene Builder\
  \ 可执行文件的路径：\n- 从主菜单中选择 `File` > `Settings`，然后进入 `Languages and Frameworks` > `JavaFX`。\n\
  - 在对话框右侧的 `JavaFX` 页面，点击 `Path to Scene Builder` 字段右侧的 `browse` 按钮。\n- 在打开的对话框中，选择\
  \ `Scene Builder` 可执行文件并点击 `OK`（例如 `C:\\Users\\<UserName>\\AppData\\Local\\SceneBuilder\\\
  SceneBuilder.exe`）。\n- 在 `Settings/Preferences` 对话框中点击 `OK`。\n- 现在，让我们开始吧！\n\n###\
  \ 创建新的 JavaFX 项目\n要从头创建一个用于 JavaFX 应用程序开发的项目：\n- 如果 `IntelliJ IDEA` 中当前没有打开任何项目，点击欢迎界面上的\
  \ `Create New Project`。否则，选择 `File` > `New` > `Project`。\n- 结果将打开 `New Project`\
  \ 向导。在向导的第一页中，在左侧窗格中选择 `JavaFX`。\n- 在页面右侧，指定项目将使用的 `SDK` (`JDK`)。从列表中选择 `JDK`，或点击\
  \ `New`、选择 `JDK` 并选择所需 `JDK` 的安装文件夹。点击 `Next`。\n- 指定项目名称（例如 `SBProject`）和位置，并点击\
  \ `Finish`。\n- 右键点击 `sample.fxml` 并选择 `Open In Scene Builder`。现在你应该能看到一个只有一个 `AncherPane`\
  \ 的 `Scene Builder`（在左侧的 `Hierarchy` 下可见）。\n\n## Scene Builder 的界面\n启动 `Scene Builder`\
  \ 后，你将获得以下 GUI：![](img/Image00218.jpg)\n默认情况下，`JavaFX Scene Builder` 的主窗口包含以下部分：\n\
  - **菜单栏 (Menu Bar)**：`Menu Bar` 提供了 `JavaFX Scene Builder` 中可用命令菜单的访问。\n- **路径、选择和消息栏\
  \ (Path, Selection and Message Bar)**：该栏显示选中元素的路径，并允许你选择一个元素使其聚焦。它还会显示任何错误或状态消息。\n\
  - **内容面板 (Content Panel)**：`Content Panel` 代表构成你的 `FXML` 布局的 GUI 元素的场景容器。默认情况下，`JavaFX\
  \ Scene Builder` 打开一个新的空的 `FXML` 文件。\n- **库面板 (Library Panel)**：`Library Panel`\
  \ 列出了可用的 JavaFX GUI 元素或控件（包括自定义控件），你可以使用它们来构建 `FXML` 布局。你从此面板选择 GUI 元素并将其添加到 `Content`\
  \ 面板或 `Hierarchy` 面板。\n- **文档面板 (Document Panel)**：`Document Panel` 包含 `Hierarchy`\
  \ 和 `Controller` 部分。`Hierarchy` 部分显示你正在构建的 `FXML` 布局的树形表示。\n- **检查器面板 (Inspector\
  \ Panel)**：`Inspector Panel` 包含 `Properties`、`Layout` 和 `Code` 部分。`Properties` 和\
  \ `Layout` 部分帮助你管理当前选中元素的属性。`Code` 部分允许你管理事件处理。\n\n## 使用 Scene Builder 设计\n现在，让我们使用\
  \ Scene Builder 创建一个简单的界面。我们将创建一个包含 `Label`、`Button`、`TextField` 和 `TextArea` 的\
  \ `VBox`。\n\n### 添加 UI 元素\n`FXML` 文档根元素是顶层对象。我们的顶层对象是 `GridPane`。首先我们将 `VBox` 添加到\
  \ `GridPane`。这可以通过从库面板拖入 `VBox` 到 `Content` 面板或 `Hierarchy` 面板来实现，所示![](img/Image0019.jpg)\n\
  \n### 为 VBox 设置属性\n- **为 VBox 设置样式**：在 `Hierarchy` 面板中，选择 `VBox` 元素并点击 `Inspector`\
  \ 面板的 `Properties` 部分。在示例中，以下属性被插入到 `Style` 文本框中。(Image00220.jpg)\n```css\n-fx-padding:\
  \ 10;\n-fx-border-style: solid;\n-fx-border-width: 2;\n-fx-border-insets: 5;\n-fx-border-radius:\
  \ 5;\n-fx-border-color: blue;\n```\n- **为 VBox 设置宽度和高度**：在 `Hierarchy` 面板中，选择 `VBox`\
  \ 元素并点击 `Inspector` 面板的 `Layout` 部分。在示例中，`Preferred Width` 和 `Preferred Height`\
  \ 被设置为 `300px`。(Image00221.jpg)\n- **为 VBox 分配标识符**：`FXML` 中创建的对象可以在同一文档的其他地方引用。在\
  \ JavaFX 代码中获取 `FXML` 创建的 UI 对象的引用是常见的。这可以通过首先在 `FXML` 中使用 `fx:id` 属性标识对象来实现。`fx:id`\
  \ 属性的值是对象的标识符。在 `Hierarchy` 面板中，选择 `VBox` 元素并点击 `Inspector` 面板的 `Code` 部分。在示例中，`Identifier`\
  \ 被设置为 `vbox1`。(Image00222.jpg)\n\n### 添加其他 UI 元素\n现在我们必须向 `VBox` 中添加其他必要的元素以完成我们的项目。首先我们添加一个\
  \ `Label`。\n\n\n\n\n\n# UI 设计构建\n\n*   **添加标签 (Label)**：从 Library 面板上的 Controls\
  \ 列表中拖入一个 Label 控件到 Content 面板或 Hierarchy（层级结构）面板中。在 Inspector 面板的 Properties 区域，将\
  \ `Text` 设置为 `Enter Your Name`，并将 `Font size` 设置为 `14px`。\n\n![](img/Image00223.jpg)\n\
  \n*   **为输入添加文本框 (TextField)**：从 Library 面板上的 Controls 列表中拖入一个 TextField 控件到 Content\
  \ 面板或 Hierarchy 面板。在 Inspector 面板的 Code 区域，将 `fx:id` 设置为 `inputText`。\n\n![](img/Image00224.jpg)\n\
  \n*   **添加一个处理必要的 ActionEvent 的按钮**：从 Library 面板上的 Controls 列表中拖入一个 Button 控件到 Content\
  \ 面板或 Hierarchy 面板。在 Inspector 面板的 Code 区域将 `fx:id` 设置为 `okBtn`，并在 Properties 区域将\
  \ `Text` 设置为 `OK`。\n\n![](img/Image00225.jpg)\n\n*   **最后，我们必须添加一个文本区域 (TextArea)**，它用于包含并显示我们的输入。从\
  \ Library 面板上的 Controls 列表中拖入一个 TextArea 控件到 Content 面板或 Hierarchy 面板。在 Inspector\
  \ 面板的 Code 区域，将 `fx:id` 设置为 `outputText`。\n\n![](img/Image00226.jpg)\n\n*   **保存项目**：通过选择\
  \ `File > Save`。\n\n*   **设计预览**：你始终可以通过“Preview”菜单项下的“Show Preview in Window”菜单项，在\
  \ Scene Builder 中对当前设计进行预览。\n\n![](img/Image00227.jpg) \n在启动应用程序后，你可以在输入框中插入文本并按下\
  \ OK 按钮。但此时它没有任何效果。原因在于我们还没有给按钮添加事件处理器（Event Handler）。这将在本节的下一部分中进行讨论。\n\n# 添加事件处理器\n\
  \n## 第一步：将 FXML 布局绑定到源控制器文件\n控制器源文件 `Controller.java` 管理你对正在构建的 FXML GUI 布局中添加的每个元素上执行的事件和操作。设置控制器类文件名可以让\
  \ Scene Builder 为你提供在控制器源文件中声明的事件处理器和实例变量的名称。\n\n注意，每个 FXML 文档只允许一个控制器，如果指定，它必须指定在根元素上（例如\
  \ `GridPane` 元素）。在 Scene Builder 中，你可以在屏幕左下角的 Controller 面进行设置。步骤如下：\n\n*   在 Hierarchy\
  \ 面板中选择 `GridPane`（根元素）。\n\n![](img/Image00228.jpg)\n\n*   在 Document 面板中，选择 Controller\
  \ 区域。在 Controller class 文本框中输入值 `sample`。通过从可用值的下拉列表中选择 Controller。\n\n![](img/Image00229.jpg)\n\
  \n## 第二步：为你的根元素编写一个控制器（例如 Controller.java）。\n在我们的案例中，根元素是包 `sample` 中的 `GridPane01`；\n\
  \n```java\npackage sample;\n\nimport javafx.fxml.FXML;\nimport javafx.scene.control.TextField;\n\
  import java.net.URL;\nimport java.util.ResourceBundle;\n\npublic class Controller\
  \ {\n    @FXML\n    private TextField inputText;\n\n    @FXML\n    private TextField\
  \ outputText;\n\n    // 添加一个公共无参构造函数\n    public Controller(){\n    }\n\n    @FXML\n\
  \    private void initialize() {\n    }\n\n    @FXML\n    private void printOutput(){\n\
  \        outputText.setText(inputText.getText());\n    }\n}\n```\n\n控制器类在某些成员上使用了\
  \ `@FXML` 注解。`@FXML` 注解可以用于字段和方法，但它不能用于类和构造函数。通过在成员上使用 `@FXML` 注解，你是在声明 FXML 加载器即使在成员是私有的（private）的情况下也可以访问它。FXML\
  \ 加载器使用的公共成员不需要标记 `@FXML` 注解。然而，在公共成员上标记 `@FXML` 并不是错误。最好对 FXML 加载器使用的所有成员（公共和私有）都标记\
  \ `@FXML` 注解。这告诉阅读代码的读者这些成员是如何被使用的。\n\n### 控制器需要遵循一些规则\n\n*   控制器必须有一个公共的无参构造函数。如果不存在，FXML\
  \ 加载器将无法实例化它，这将在加载时抛出异常。\n```java\n// 添加一个公共无参构造函数\npublic Controller(){\n}\n```\n\
  *   控制器可以拥有可访问的方法，这些方法可以在 FXML 中指定为事件处理器。\n```java\n@FXML\nprivate void printOutput(){\n\
  \    outputText.setText(inputText.getText());\n}\n```\n*   FXML 加载器会自动寻找控制器的可访问实例变量。如果可访问实例变量的名称与元素的\
  \ `fx:id` 属性匹配，则来自 FXML 的对象引用会自动复制到控制器实例变量中。此功能使得 FXML 中的 UI 元素引用对控制器可用。控制器以后可以使用它们，例如将它们绑定到模型（model）。\n\
  \n```xml\n<GridPane fx:id=\"pane\" alignment=\"center\" hgap=\"10\" vgap=\"10\"\
  \ xmlns=\"http://javafx.com/javafx/9.0.1\" xmlns:fx=\"http://javafx.com/fxml/1\"\
  \ fx:controller=\"sample.Controller\">\n```\n*   控制器可以有一个 `initialize()` 方法，该方法不应接受参数且返回类型为\
  \ `void`。FXML 加载器会在 FXML 加载完成后调用 `initialize()`。\n```java\n@FXML\nprivate void initialize()\
  \ {\n```\n\n## 第三步：为节点设置事件处理器\n你可以在 FXML 中为节点指定事件处理器。例如，在 Inspector 面板中将 On Action\
  \ 字段设置为 `printOutput`，从可用值的下拉列表中选择。\n\n![](img/00230.jpg)\n\n### FXML 代码 (sample.fxml)\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\n<?import javafx.scene.control.Button?>\n\
  <?import javafx.scene.control.Label?>\n<?import javafx.scene.control.TextArea?>\n\
  <?import javafx.scene.control.TextField?>\n<?import javafx.scene.layout.ColumnConstraints?>\n\
  <?import javafx.scene.layout.GridPane?>\n<?import javafx.scene.layout.RowConstraints?>\n\
  <?import javafx.scene.layout.VBox?>\n<?import javafx.scene.text.Font?>\n\n<GridPane\
  \ fx:id=\"pane\" alignment=\"center\" hgap=\"10\" vgap=\"10\" xmlns=\"http://javafx.com/javafx/9.0.1\"\
  \ xmlns:fx=\"http://javafx.com/fxml/1\" fx:controller=\"sample.Controller\">\n \
  \ <children>\n    <VBox fx:id=\"vbox1\" prefHeight=\"300.0\" prefWidth=\"300.0\"\
  \ style=\"-fx-padding: 10; -fx-border-style: solid; -fx-border-width: 2; -fx-border-insets:\
  \ 5; -fx-border-radius: 5; -fx-border-color: blue;\">\n      <children>\n      \
  \  <Label text=\"Enter Your Name\">\n          <font>\n            <Font size=\"\
  14.0\" />\n          </font>\n        </Label>\n        <TextField fx:id=\"inputText\"\
  \ />\n        <Button fx:id=\"okBtn\" mnemonicParsing=\"false\" onAction=\"#printOutput\"\
  \ text=\"OK\" />\n        <TextArea fx:id=\"outputText\" prefHeight=\"150.0\" prefWidth=\"\
  266.0\" />\n      </children>\n    </VBox>\n  </children>\n  <columnConstraints>\n\
  \    <ColumnConstraints />\n  </columnConstraints>\n  <rowConstraints>\n    <RowConstraints\
  \ />\n  </rowConstraints>\n</GridPane>\n```\n\n### Java 代码 (Controller.java)\n```java\n\
  package sample;\n\nimport javafx.fxml.FXML;\nimport javafx.scene.control.TextArea;\n\
  import javafx.scene.control.TextField;\n\npublic class Controller {\n\n    @FXML\n\
  \    private TextField inputText;\n\n    @FXML\n    private TextArea outputText;\n\
  \n    // 添加一个公共无参构造函数\n    public Controller(){\n    }\n\n    @FXML\n    private\
  \ void initialize(){\n    }\n\n    @FXML\n    private void printOutput(){\n    \
  \    outputText.setText(inputText.getText());\n    }\n}\n```\n\n### GUI\n在启动应用程序后，我们可以在文本框中插入文本，按下\
  \ OK 按钮，消息就会显示在文本区域中。\n\n![](img/Image0231.jpg)\n\n\n\n\n\n*   `JavaFX Scene Builder`\
  \ 是一个视觉化布局工具，允许用户无需编码即可快速设计 JavaFX 应用程序的用户界面。\n*   默认情况下，`JavaFX Scene Builder`\
  \ 的主窗口包含菜单栏、路径/选择/消息栏、内容面板、库面板、文档面板和检查器面板。\n*   控制器源文件 `Controller.java` 负责管理在你正在构建的\
  \ FXML GUI 布局中添加的每个元素上发生的事件和操作。\n*   控制器类在某些成员上使用了 `@FXML` 注解。`@FXML` 注解可以用于字段和方法，但不能用于类和构造函数。\n\
