  \n***\n\n# 第 28 章 使用 Scene Builder 创建登录表单应用程序\n\n### 简介\n在本章中，我们将创建一个登录表单，用户可以在其中输入用户名和密码，然后提交表单。当用户提交正确的用户名和密码时，我们将通过显示警告框来欢迎他。这是我们在本章中将构建的应用程序截图。(Image00232.jpg)\n\
  \n### 你将学习什么？\n在本章中，你将学习：\n*   如何创建 JavaFX 应用程序窗口的布局。\n*   如何添加如 `Text Field`（文本字段）、`Password\
  \ Field`（密码字段）和 `Button`（按钮）等 UI 控制。\n*   如何响应输入事件。\n\n好了！让我们开始吧。\n\n***\n\n## 创建主应用程序类\n\
  你需要完成的第一件事是为你的 JavaFX 应用程序创建一个扩展自 `javafx.application.Application` 的 `Main` 类，并重写它的\
  \ `start()` 方法。\n\n*   打开 `IntelliJ IDEA` IDE 并创建一个名为 `Login` 的新 JavaFX 项目。\n* \
  \  按照如下方式重命名文件：![](img/Image00233.jpg)\n*   将 `Stage` 的 `title` 属性设置为 `Login Form`。进入\
  \ `Login.java` 类并修改以下代码：\n```\nprimaryStage.setTitle(\"Login Form\");\n```\n*  \
  \ 创建一个以登录表单 `gridPane` 为根节点的场景，并将场景设置到主阶段中：\n```\nprimaryStage.setScene(new Scene(root,\
  \ 450, 250));\n```\n如果你现在运行应用程序，你将得到一个宽度为 450、高度为 250 的空窗口。让我们为应用程序添加 UI 控制。\n\n\
  ***\n\n## 向布局中添加用户界面 (UI) 控制\n`JavaFX` 提供了许多内置 GUI 控制，如 `TextField`、`PasswordField`、`Button`\
  \ 等。让我们将这些 UI 控制添加到我们的 `Login Form` 面板中。\n\n### 创建应用程序的布局\n我们将使用 `GridPane` 布局来设计我们的登录表单。`GridPane`\
  \ 布局允许你创建一个灵活的行列网格，可以在其中布局 UI 节点。\n\n*   因此进入 `Projects` 标签页，右键点击 `login.fxml` 文件并选择\
  \ `Open In Scene Builder`。\n*   设置 `GridPane` 的宽度和高度。在 `Hierarchy`（层次结构）面板中，选择 `GridPane`\
  \ 元素。在 `Inspector`（检查器）面板的 `Layout`（布局）部分找到 `GridPane` 的 `PrefWidth` 和 `PrefHeight`\
  \ 属性。为 `PrefWidth` 属性值输入 `450` 并按回车。为 `PrefHeight` 属性值输入 `250` 并按回车。(Image00234.jpg)\n\
  *   向 `GridPane` 添加一个 `Label`（标签）。点击 `Library`（库）面板中的 `Controls` 部分。如果 `Library`\
  \ 面板不可见，选择 `View > Show Library`。双击 `Control` 部分中的 `Label` 控制。`Label` 将出现在 `GridPane`\
  \ 的中心，如图所示。你将使用此标签控件来显示登录表单的文本。`Label` 默认显示文本 `Label`。注意 `Label` 的背景颜色是 `White`（白色）。![](img/Image00235.jpg)\n\
  *   设置 `Label` 的 `Text` 属性。点击 `Label` 选中它。在 `Property`（属性）部分为 `Label` 的 `Text` 属性值输入\
  \ `Login Form` 并按回车。(Image00236.jpg)\n*   设置 `Label` 的 `font`（字体）。点击 `Properties`\
  \ 部分下 `Font` 属性的值。在对话框中，你可以选择 `Font/Family` 名称（`Arial`、`Tahoma` 等）、字体样式（`Bold`、*italic*\
  \ 等）以及字体大小（`12`、`14` 等）点（1 点等于 1/72 英寸）。在 `Size` 类别下，选择 `24` 点。在 `Font` 类别下，选择 `Times\
  \ New Roman`。(Image00237.jpg)\n*   为 `GridPane` 添加列约束。点击 `GridPane` 选中它。点击第一个列约束选中它。右键点击所选的列约束并选择\
  \ `Add Column After` 添加另一个列约束。(Image00238.jpg)\n*   点击第一个列约束选中它。点击 `Inspector` 面板的\
  \ `Layout` 部分并设置 `MinWidth`、`PrefWidth`。(Image0039.jpg)\n*   点击第二个列约束选中它。点击 `Inspector`\
  \ 面板的 `Layout` 部分并设置 `MinWidth`、`PrefWidth`。(Image0040.jpg)\n*   点击 `GridPane` 选中它。点击\
  \ `Inspector` 面板的 `Layout` 部分并设置 `padding` 为 `20`。(Image0041.jpg)\n*   点击第一个行约束\
  \ 它 选中它。右键点击所选的行约束并选择 `Add Row Below` 添加另一个行约束。(Image0042.jpg)\n*   点击 `Label` 选中它。点击\
  \ `Inspector` 面板的 `Layout` 部分并设置 `colspan` 为 `2`、`halignment` 为 `CENTER`、`Margin\
  \ top` 为 `10` 以及 `Margin bottom` 为 `30`。(Image0043.jpg)\n*   添加两个标签（`User Name`\
  \ 和 `Password`），然后根据下表设置以下属性：\n| Section / Property | 2 | 3 |\n| :--- | :--- | :---\
  \ |\n| Properties > Text | User Name | Password |\n| Properties > Font > Family\
  \ | Arial | Arial |\n| Properties > Font > Size | 14 | 14 |\n| Layout > rowIndex\
  \ | 1 | 2 |\n| Layout > columnIndex | 0 | 0 |\n| Layout > Margin > right | 5 | 5\
  \ |\n输出：(Image0044.jpg)\n*   添加 `TextField` 和 `PasswordField` 控制如下：(Image0045.jpg)\n\
  *   根据下表设置 `TextField` 和 `PasswordField` 控制的 `promptText`、`prefHeight` 和 `fx:id`\
  \ 属性：\n| | TextField | PasswordField |\n| :--- | :--- | :--- |\n| Properties > promptText\
  \ | Enter Your Name | Enter Your Password |\n| Layout > prefHeight | 40 | 40 |\n\
  | Layout > columnIndex | 1 | 1 |\n| Layout > rowIndex | 1 | 2 |\n| Code > fx:id\
  \ | txtUsername | txtPassword |\n设置这些值后，登录表单所示所示(Image0046.jpg)\n*   如图所示向 `GridPane`\
  \ 添加一个 `button`：Image00247.jpg)\n*   根据 `Properties`、`Layout` 和 `Code` 部分，为 `Button`\
  \ 控件的 `Text`、`PreWidth` 和 `PreHeight` 属性指定以下值：\n| | Button |\n| :--- | :--- |\n\
  | Properties > Text | OK |\n| Code > fx:id | btnOK |\n| Layout > prefHeight | 40\
  \ |\n| Layout > preWidth | 150 |\n按钮在单元格中左对齐。要更改按钮的水平对齐，我们将 `halignment` 属性设置为 `CENTER`。\n\
  *   在 `columnTwoConstraints` 中将 `Hgrow` 属性设置为 `ALWAYS`（在 Layout 面板下）。Image00248.jpg\
  \ 我们正在指定如果屏幕调整大小，第二列将水平方向生长并填充额外空间。\n*   保存项目。选择 `File > Save` 保存修改后的项目。\n*   关闭\
  \ Scene Builder。选择 `File > Quit`。\n\n## 总结\n*   我们首先实例化一个新的 `GridPane`，然后设置对齐和内边距属性。\n\
  *   我们还对 `grid pane` 应用了一些列约束。\n*   第一列中的所有节点其 `min-width` 为 `100`，`pref-width`\
  \ 为 `100`，`max-width` 为 `Double.MAX_VALUE`。\n\n\n\n\n\n* 同样，第二列中的所有节点都将具有 200 的最小宽度（min-width）、200\
  \ 的首选宽度（pref-width）以及 `Double.MAX_VALUE` 的最大宽度。\n* 同时，我们将 `columnOneConstraints`\
  \ 中的 `Hal` 属性设置为 `RIGHT`，以便第一列中的所有节点都右对齐。\n* 此外，通过在 `columnTwoConstraints` 中将 `Hgrow`\
  \ 属性设置为 `ALWAYS`，我们指定了当窗口调整大小时，第 2 列应该水平方向扩展并填充额外的空间。\n\n***\n\n# 添加表单提交时执行的处理器代码\
  \ (LoginController.java 文件)\n\n### 第一步：创建一个名为 `onButtonClicked()` 的事件处理器\n首先，现在我们将我们的处理器代码添加到\
  \ OK 按钮上。每当你点击 OK 按钮或按下回车键时，该句处理器就会被调用。\n\n```java\n01 package sample;\n02 import\
  \ javafx.fxml.FXML;\n03 import javafx.scene.control.Alert;\n04 import javafx.scene.control.Button;\n\
  05 import javafx.scene.control.TextField;\n06 import javafx.scene.layout.GridPane;\n\
  07 import javafx.stage.Window;\n08\n09 public class LoginController {\n10 @FXML\n\
  11 private Button btnOK;\n12\n13 @FXML\n14 private TextField txtUsername;\n15\n\
  16 @FXML\n17 private TextField txtPassword;\n18\n19 @FXML\n20 private GridPane gridpane;\n\
  21\n22 @FXML\n23 public void onButtonClicked(){\n24 if(txtUsername.getText().isEmpty()){\n\
  25 showAlert(Alert.AlertType.ERROR, gridpane.getScene().getWindow(),\n26 \"Form\
  \ Error!\", \"Please enter your name\");\n27 return;\n28 }\n29 if(txtPassword.getText().isEmpty()){\n\
  30 showAlert(Alert.AlertType.ERROR, gridpane.getScene().getWindow(),\n31 \"Form\
  \ Error!\", \"Please enter a password\");\n32 return;\n33 }\n34 showAlert(Alert.AlertType.CONFIRMATION,\
  \ gridpane.getScene().getWindow(),\n35 \"Registration Successful!\", \"Welcome \"\
  \ + txtUsername.getText());\n36 }\n37\n38 private void showAlert(Alert.AlertType\
  \ alertType,\nWindow owner, String title, String message){\n39 Alert alert = new\
  \ Alert(alertType);\n40 alert.setTitle(title);\n41 alert.setHeaderText(null);\n\
  42 alert.setContentText(message);\n43 alert.initOwner(owner);\n44 alert.show();\n\
  45 }\n46 }\n```\n\n在上述代码中，如果任何表单字段缺失，我们将显示错误警告；否则，我们将向用户显示确认警告。我们使用 JavaFX 内置的 `Alert`\
  \ 类向用户显示警告框。\n\n### 第二步：为 `btnOK` 控件注册 `onButtonClicked` 事件处理器\n* 右键点击 `login.fxml`\
  \ 文件并选择 `Open In Scene Builder`。\n* 点击 OK 按钮选中它。点击检查器面板的 `Code` 部分，并将 `On Action`\
  \ 属性设置为 `onButtonClicked`，这用于为 `Button` 控件注册事件处理器。\n\n![](img/Image00249.jpg)\n\
  * 保存项目。选择 `File > Save` 保存你修改后的项目。\n* 关闭 Scene Builder。选择 `File > Quit`。\n* 运行应用程序。右键点击\
  \ `Main.java` 文件并选择 `Run ‘Main’`。将显示登录表单。输入任意用户名和密码。这将显示带有欢迎消息的消息标签页：\n\n![](img/Image00250.jpg)\n\
  * 如果输入的用户名或密码任空，将出现下方所示屏幕。\n\n![](img/Image00251.jpg)\n\n我希望本教程帮助你理解创建登录表单的基础知识。\n\
  \n***\n\n# 第 29 章：计算器应用程序\n\n### 介绍\n软件计算器允许用户输入数据，并且它们有一个自动应用于这些数据的内置公式。计算器能够执行加法、乘法、减法或除法等数学计算。\n\
  在这个项目中，我们将创建一个与 Windows 计算器具有许多功能的计算器。这是我们在本章将构建的应用程序截图。\n\n![](img/Image00252.jpg)\n\
  \n### 你将学习什么？\n在本章中，你将学习如何：\n* 使用 `VBox` 和 `GridPane` 布局设计 GUI。\n* 使用 `Button` 和\
  \ `TextField` GUI 组件。\n* 使用 Java 面对象编程能力，包括类、对象和继承。\n* 通过编程方式与 GUI 组件交互以响应输入事件。\n\
  \n太棒了！让我们开始吧。\n\n***\n\n# 创建主应用程序类\n你需要完成的第一件事是为你的 JavaFX 应用程序创建一个扩展自 `javafx.application.Application`\
  \ 的 `Main` 类，并重写它的 `start()` 方法。\n\n* 打开 `IntelliJ IDEA` IDE 并创建一个名为 `Calculator`\
  \ 的新 JavaFX 项目。\n* 按照如下重命名以下文件：\n\n![](img/Image00253.jpg)\n* 将 `Stage` 的 title\
  \ 属性设置为 `Calculator App`。进入 `CalcMain.java` 类并更改以下代码：\n`primaryStage.setTitle(\"\
  Calculator App\");`\n* 创建一个以登录表单 `gridpane` 为根节点的场景，并将场景设置在主阶段中：\n`primaryStage.setScene(new\
  \ Scene(root, 300, 250));`\n如果你运行它，将得到一个宽度为 300、高度为 250 的空窗口。\n\n![](img/Image00254.jpg)\n\
  \n# 在布局中添加 UI 控件\nJavaFX 提供了如 `TextField`、`Button` 等多种内置 GUI 控件。我们将这些 UI 控件添加到表单。\n\
