  - 保存你的设计并关闭 Scene Builder。\n- 运行你的项目。右键点击 `CalcMain.java` 文件并选择 Run ‘Main’。结果如下：\n\
  \n![](img/Image00262.jpg)\n\n在下一节中，你将学习如何让按钮（或其他组件）对用户操作做出响应，这样你就能完成计算器。\n\n## 为计算器添加事件处理\n\
  \n- 在 `CalcController` 类中创建四个独立的事件处理方法。将第一个方法命名为 `handlerDigit` - 它将包含处理数字按钮点击的代码。将第二个方法命名为\
  \ `handlerGeneral` - 它将包含处理加、减等按钮点击的代码。将第三个方法命名为 `handlerDecimal` - 它将包含处理点击（.)点按钮的代码。将第四个方法命名为\
  \ `handlerEqual` - 它将包含处理点击 (=）等号按钮的代码。\n\n- 将 `CalcController.java` 分配给 `VBox`\
  \ 元素。右键点击 `Calc.fxml` 文件并选择 Open In Scene Builder。点击 `VBox` 选中它。现在，为 Controller\
  \ 部分 `Controller` 类属性指定值 `calculator.CalcController`。\n\n![](img/Image00263.jpg)\n\
  \n- 现在，请根据下表为代码部分中按钮控制的 `On Action` 属性指定以下值：\n\n| 控制 | On Action 属性 | 控制 | On Action\
  \ 属性 |\n| :--- | :--- | :--- | :--- |\n| 1 | `handlerDigit` | = | `handlerEqual`\
  \ |\n| 2 | `handlerDigit` | + | `handlerGeneral` |\n| 3 | `handlerDigit` | - | `handlerGeneral`\
  \ |\n| 4 | `handlerDigit` | X | `handlerGeneral` |\n| 5 | `handlerDigit` | +/- |\
  \ `handlerGeneral` |\n| 6 | `handlerDigit` | / | `handlerGeneral` |\n| 7 | `handlerDigit`\
  \ | AC | `handlerGeneral` |\n| 8 | `handlerDigit` | - | `handlerDecimal` |\n| 9\
  \ | `handlerDigit` | 0 | `handlerDigit` |\n\n### 实现 4 个方法\n\n#### 字段\n```java\n\
  @FXML\nprivate TextField txtDisplay;\nprivate double decimalClick;\nprivate String\
