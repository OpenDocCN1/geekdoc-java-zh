  ```\n\n**输出**\n```\nEnter the first few characters of the last name to look up:\
  \ M\nHere are the names that match:\nMohammed, Mansour\n```\n\n## regionMatches(\
  \ ) 方法\n\n`String` 类提供了 `regionMatches` 的重载版本，用于确定两个字符串的指定区域是否匹配。让我们写这个示例。\n\n**示例\
  \ 19.9**: RegionEx.java\n\n```java\n01 String str = \"Four Score and Seven Years\
