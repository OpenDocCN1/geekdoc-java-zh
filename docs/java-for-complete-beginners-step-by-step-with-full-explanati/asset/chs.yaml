  System.out.println(String.valueOf(f));\nSystem.out.println(String.valueOf(d));\n\
  System.out.println(String.valueOf(b));\nSystem.out.println(String.valueOf(c));\n\
  System.out.println(String.valueOf(letters));\n```\nOutput:\n```\n46\n23.5\n15.4981567\n\
  true\nA\nabc\n```\n\n# StringBuilder 类介绍\n\n* `StringBuilder` 类与 `String` 类相似，不同之处在于，你可以更改\
  \ `StringBuilder` 对象的的内容，但你不能更改 `String` 对象的内容。\n* `StringBuilder` 类还提供了几个 `String`\
  \ 类没有的实用用方法。\n* 请记住，`String` 对象是不可变的。这意味着一旦你设置了 `String` 对象的内容，就无法更改它所持有的字符串值。\n\
  \n### 示例 19.26\n```java\nString name;\nname = \"George\";\nname = \"Sally\";\n```\n\
  **解释**\n* 第一个参数创建了 `name` 变量。\n* 第二个参数创建一个包含字符串 \"George\" 的 `String` 对象，并将其地址赋值给\
  \ `name` 变量。\n* 虽然我们可以让 `name` 变量引用不同的 `String` 对象。这就是第三条语句的作用，它创建另一个包含字符串 \"sally\"\
  \ 的 `String` 对象，并将其地址赋值给 `name`。包含 \"George\" 的 `String` 对象不再被引用。\n\n![](img/Image00136.jpg)图\
  \ 19.2 | 包含 \"George\" 的 `String` 对象不再被引用\n\n* 与 `String` 对象不同，`StringBuilder` 对象的方法允许你在不在内存中创建新对象的情况下修改其内容。\n\
  * 你可以更改特定字符、插入字符、删除字符并执行其他操作。\n* `StringBuilder` 对象会根据需要增大或缩小以适应变化。\n* `String`\
  \ 对象不可变这一事实通常不是问题，但如果你的程序需要对一个或多个字符串进行大量更改，你可以考虑使用 `StringBuilder` 对象。\n* 这通过减少必须创建然后由垃圾回收器移除的\
  \ `String` 对象数量，来提高程序的效率。\n\n现在让我们来看 `StringBuilder` 类的构造函数和方法。\n\n## StringBuilder\
  \ 构造函数\n表 19.8 | StringBuilder 构造函数\n\n| 构造函数 | 说明 |\n| :--- | :--- |\n| `StringBuilder()`\
  \ | 此构造函数不接受参数。它为对象提供了足够的存储空间来存放 16 个字符，但其中没有存储字符。 |\n| `StringBuilder(int length)`\
  \ | 此构造函数为对象提供了足够的存储空间来存放 `length` 个字符，但其中没有存储字符。 |\n| `StringBuilder(String str)`\
  \ | 此构造函数用字符串 `str` 初始化对象。对象的初始存储空间将字符串长度加 16。 |\n\n前两个构造函数创建指定大小的空 `StringBuilder`\
  \ 对象。第一个构造函数使 `StringBuilder` 对象足够大以包含 16 个字符，第二个构造函数使对象足够大以包含 `length` 个字符。记住，`StringBuilder`\
  \ 对象会自动调整大小，如果你以后想在对象中存储更大的字符串，这并不是问题。\n\n第三个构造函数接受一个 `String` 对象作为参数，并将对象的内容赋值给\
  \ `StringBuilder` 对象。考虑下例例。\n\n### 示例 19.27: StringB.java\n```java\nStringBuilder\
  \ city = new StringBuilder(\"Cairo\");\nSystem.out.println(city);\n```\n**解释**\n\
  * 创建一个 `StringBuilder` 对象并将其地址赋值给 `city` 变量。\n* 对象用字符串 \"Cairo\" 初始化。\n* 将 `StringBuilder`\
  \ 对象传递给 `println` 和 `print` 方法。\n\n`StringBuilder` 类的一个限制是，你不能使用赋值运算符将字符串赋值给 `StringBuilder`\
  \ 对象。例如：\n```java\nStringBuilder city = \"Cairo\"; // 错误！无法工作。\n```\n与其使用赋值运算符 (`=`)，你必须使用\
  \ `new` 关键字和构造函数，或者使用 `StringBuilder` 的方法之一来将字符串存储在 `StringBuilder` 对象中。\n\n## 其他\
  \ StringBuilder 方法\n`StringBuilder` 类提供了许多与 `String` 类相同的方法。此外，`StringBuilder` 类提供了几个\
  \ `String` 类没有的方法。让我们来看其中几个。\n\n### append 方法\n* `StringBuilder` 类有几个名为 `append`\
  \ 的方法的多个重载版本。\n* 这些方法接受一个参数，该参数可以是任何原始数据类型、`char array` 或 `String` 对象。\n* 它们将其参数的字符串表示附加到调用对象的当前内容之后。\n\
  \n由于有许多 `append` 的重载版本，我们将如下检查该方法典型调用的通用形式：\n`object.append(item);`\n在调用方法后，`item`\
  \ 的字符串表示将附加到 `objects` 的内容中。考虑下例所示。\n\n### 示例 19.28 : AppendEx.java\n```java\npublic\
  \ class AppendEx {\n    public static void main(String[] args) {\n        StringBuilder\
  \ str = new StringBuilder();\n\n        // 向对象添加值\n        str.append(\"We Sold\
  \ \"); // 添加一个 String 对象\n        str.append(12);   // 添加一个 int。\n        str.append(\"\
  \ doubuts for $\"); // 添加另一个字符串\n        str.append(15.95);   // 添加一个 double\n\n\
  \        // 显示对象的内容\n        System.out.println(str);\n    }\n}\n```\nOutput:\n\
  ```\nWe Sold 12 doubuts for $15.95\n```\n\n### insert 方法\n`StringBuilder` 类也有几个名为\
  \ `insert` 的方法的重载版本，它将值插入到调用对象的字符串中。这些方法接受两个参数：\n* 指定调用对象字符串中起始位置的 `int`\n* 要插入的值。要插入的值可以是任何原始数据类型、`char\
  \ array` 或 `String` 对象。\n\n由于有许多 `insert` 的重载版本，我们将如下检查该方法典型调用的通用形式：\n`object.insert(start,\
  \ item);`\n`start` 是插入的起始位置，`item` 是要插入的值。\n\n这是一个简单的示例。\n\n### 示例 19.29 : InsertEx.java\n\
  ```java\npublic class InsertEx {\n    public static void main(String[] args) {\n\
  \        StringBuilder str = new StringBuilder(\"July sold cars.\");\n        char[]\
  \ array = {'w', 'e', ' ' };\n\n        // 向对象添加值\n        str.insert(0 ,\"in \"\
  ); // 添加一个 String 对象\n        str.insert(8, array);  // 添加一个 char array\n      \
  \  str.insert(16, 20);  // 添加一个 int\n        str.insert(18, ' '); // 添加一个 char\n\
  \n        // 显示对象的内容\n        System.out.println(str);\n    }\n}\n```\nOutput:\n\
  ```\nin July sold 20 cars.\n```\n这是另一个示例。\n\n### 示例 19.30 : Telephone.java\n```java\n\
  public class Telephone {\n    public static String format(String number) {\n   \
  \     StringBuilder str = new StringBuilder(number);\n\n        // 在区码周围插入括号。\n\
  \        str.insert(0, '(');\n        str.insert(4, ')');\n\n        // 在前缀后插入连字符。\n\
  \        str.insert(8, '-');\n\n        // 返回格式化后的号码作为字符串。\n        return str.toString();\n\
  \    }\n}\n```\n\n### 示例 19.31 : TelephoneTester.java\n```java\npublic class TelephoneTester\
  \ {\n    public static void main(String[] args) {\n        // 创建未格式化的号码。\n     \
  \   String phone = \"9195551212\";\n\n        // 获取它的格式化版本。\n        String properNum\
  \ = Telephone.format(phone);\n\n        // 显示格式化后的号码。\n        System.out.println(properNum);\n\
  \    }\n}\n```\nOutput:\n```\n(919)555-1212\n```\n\n\n\n\n\n- `StringBuilder` 类拥有一个\
  \ `replace` 方法，该方法与 `String` 类的 `replace` 方法略有不同。\n- `String` 类的 `replace` 方法是将一个字符的所有出现处替换为另一个字符，而\
  \ `StringBuilder` 类的 `replace` 方法是将指定的子字符串替换为另一个字符串。\n\n调用 `replace()` 方法的通用形式：`object.replace(start,\
  \ end, str);`\n\n- `start` 是一个 `int` 类型，指定子字符串在调用对象中的起始位置。\n- `end` 是一个 `int` 类型，指定子字符串的结束位置。\n\
  - 起始位置被包含在子字符串内，但结束位置不包含在内。\n- `str` 参数是一个 `String` 对象。\n- 方法执行后，子字符串将被替换为 `str`。\n\
  \n示例 19.32：ReplaceStringEx.java\n```java\n01 public class ReplaceStringEx {\n02\
  \ public static void main(String[] args) {\n03 StringBuilder str =\n04 new StringBuilder(\"\
  We moved from Khartoum to Atlanta\");\n05 str.replace(14, 22, \"New York\");\n06\
  \ System.out.println(str);\n07 }\n08 }\n```\n输出：`We moved from New York to Atlanta`\n\
  \n`replace` 方法将单词 \"Chicago\" 替换为 \"New York\"。\n\n## delete, deleteCharAt 和 setCharAt\
  \ 方法\n\n- `delete` 和 `deleteCharAt` 方法用于从 `StringBuilder` 对象中删除子字符串或字符。\n- `setCharAll`\
  \ 方法将指定的字符更改另一个值。\n\n`StringBuilder` 类的 `delete`、`deleteCharAt` 和 `setCharAt` 方法\n\
  示例 19.33：StringBuilderDemo.java - 展示这 3 个方法\n```java\n01 public class StringBuilderDemo\
  \ {\n02 public static void main(String[] args) {\n03 StringBuilder str =\n04 new\
  \ StringBuilder(\"I ate 100 blueberries\");\n05 // 显示 StringBuilder 对象\n06 System.out.println(str);\n\
  07\n08 // 删除 'o'\n09 str.deleteCharAt(8);\n10\n11 // 删除 \"blue\"\n12 str.delete(9,\
  \ 13);\n13\n14 // 显示 StringBuilder 对象\n15 System.out.println(str);\n16\n17 // 将\
  \ '1' 改为 '5'\n18 str.setCharAt(6, '5');\n19\n20 // 显示对象的内容\n21 System.out.println(str);\n\
  22 }\n23 }\n```\n输出：\n`I ate 100 blueberries`\n`I ate 10 berries`\n`I ate 50 berries`\n\
  \n### 注意事项\n\n- `Java` 提供了一个名为 `StringBuffer` 的类，它本质上与 `StringBuilder` 类相同，具有相同的构造方法和方法。区别在于，`StringBuffer`\
  \ 类中的方法是同步的。这意味着 `StringBuffer` 类在多线程应用程序中使用是安全的。\n- 多线程应用程序是指并发运行多个执行线程的应用程序。在这样的应用程序中，可能有多个一个线程同时访问内存中的同一个对象。在多线程应用程序中，确保方法是\
  \ `synchronized`（同步的）重要的，以防止数据损坏的可能性。\n- 因为同步需要执行额外的步骤，`StringBuffer` 类比 `StringBuilder`\
  \ 类慢。\n- 在对象不会被多个线程访问的应用程序中，你应该使用 `StringBuilder` 类来获得最佳性能。\n- 在多个线程将访问该对象的应用程序中，你应该使用\
  \ `StringBuffer` 类以确保其数据不会被损坏。\n\n***\n\n## 字符串分词（Tokenizing Strings）\n\n字符串分词是将字符串分解为其组件的过程，这些组件被称为标记（tokens）。可以使用\
  \ `StringTokenizer` 类和 `String` 类的 `split` 方法对字符串进行分词。\n\n有时字符串将包含一组由空格或其他字符分隔的单词或其他数据。例如：\"\
  peach raspberry strawberry vanilla\"。这个 `String` 包含以下四个数据项：peach、raspberry、strawberry\
  \ 和 vanilla。在编程术语中，这些项目被称为“标记”。注意项目之间出现了一个空格。分隔标记的字符被称为“分隔符”（delimiter）。\n\n示例 19.34：“17;92;81;12;46;5”\n\
  - 该字符串包含以下标记：17, 92, 81, 12, 46 和 5。\n- 注意每个项目之间都出现了一个分号。在这个例中，分号被用作分隔符。\n- 一些编程问题要求你读取一个包含项目列表的字符串，然后从字符串中提取所有标记进行处理。\n\
  \n示例 19.35：“13-22-2005” - // 包含日期的字符串\n- 该字符串中的标记是 3,22 和 2005。\n- 分隔符是连字符。\n- \
  \ 程序可能需要从这样的字符串中提取月份、日期和年份。\n\n示例 19.36：一个 OS 文件路径：/home/rsullivan/data\n- 标记：home，rsullivan\
  \ 和 data。\n- 分隔符：`/` 字符。\n- 程序可能需要从这样的文件路径中提取所有的目录名。\n\n将字符串分解为标记的过程被称为分词。在本节中我们将讨论两种标记字符串的\
  \ Java 工具：`StringTokenizer` 类和 `String` 类的 `split` 方法。\n\n### StringTokenizer 类\n\
  \nJava 提供了一个 `StringTokenizer` 类，允许你对字符串进行分词。它属于 `java.util` 包，因此你需要以下导入语句：\n`import\
  \ java.util.StringTokenizer;`\n\n当你创建一个 `StringTokenizer` 实例时，你传递一个字符串作为其中一个构造方法之一。标记将从该字符串中提取。\n\
  \n表 19.9 | StringTokenizer 构造方法\n\n| 构造方法 | 说明 |\n| :--- | :--- |\n| `StringTokenizer(String\
  \ str)` | 将待分词的字符串传递给 `str`。空白字符（空格、制表符和换行）被用作分隔符。 |\n| `StringTokenizer(String\
  \ str, String delimiters)` | 将待分词的字符串传递给 `str`。`delimiters` 是分隔符。 |\n| `StringTokenizer(String\
  \ str, String delimiters, boolean returnTokens)` | 将待分词的字符串传递给 `str`。`delimiters`\
  \ 是分隔符。如果 `returnTokens` 参数设置为 `true`，则分隔符将作为标记。如果设置为 `false`，则分隔符将不作为标记。 |\n\n\
  第一个构造方法使用空白字符作为分隔符。例如：`StringTokenizer strTokenizer = new StringTokenizer(\"2 4\
  \ 5 6\");`\n\n第二个构造方法接受第二个参数，这是一个包含多个用作分隔符的字符串。例如：示例 19.37：使用此构造方法创建一个对象。它指定 `-`\
  \ 字符用作分隔符：`StringTokenizer strTokenizer = new StringTokenizer(\"10-14-2005\",\"\
  -\");`\n\n第三个构造方法接受第二个参数（包含多个分隔符的字符串）以及第三个参数（指示是否应将分隔符作为标记）。例如：示例 19.38：使用此构造方法创建一个对象。它指定\
  \ `-` 字符用作分隔符，并将分隔符作为标记：`StringTokenizer strTokenizer = new StringTokenizer(\"10-14-2005\"\
  ,true);`\n\n注意：前两个构造方法不将分隔符作为标记。\n\n### 提取标记\n\n一旦你创建了 `StringTokenizer` 对象，就可以使用它的方法从传递给构造方法的字符串中提取标记。\n\
  \n表 19.10 | 部分 StringTokenizer 方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `countTokens()`\
  \ | 该方法返回字符串中剩余标记的数量。 |\n| `hasMoreTokens()` | 如果字符串中还有标记，返回 `true`；否则返回 `false`。\
  \ |\n| `nextToken()` | 该方法返回字符串中找到下一个标记。 |\n\n示例 19.39：StrTokenEx.java - 代码演示了如何从\
  \ `StringTokenizer` 对象中提取所有标记。只要还有标记待提取，循环就会执行。\n\n```java\n01 import java.util.StringTokenizer;\n\
  \n02\n03 public class StrTokenEx {\n04 public static void main(String[] args) {\n\
  ```\n\n\n\n\n\n```java\nStringTokenizer strTokenizer = new StringTokenizer(\"One\
  \ Two Three\");\n\nwhile (strTokenizer.hasMoreTokens()) {\n    System.out.println(strTokenizer.nextToken());\n\
  }\n```\nOutput:\nOne\nTwo\nThree\n\n```\n\n### 示例 19.40：DateComponent.java\n```java\n\
  import java.util.StringTokenizer;\n\npublic class DateComponent {\n    private String\
  \ month; // 用于存储月份\n    private String day; // 用于存储日期\n    private String year;\
  \ // 用于存储年份\n\n    public DateComponent(String dateStr) {\n        // 创建 StringTokenizer\
  \ 对象。\n        StringTokenizer strTokenizer = new StringTokenizer(dateStr, \"/\"\
  );\n\n        // 提取标记。\n        month = strTokenizer.nextToken();\n        day =\
  \ strTokenizer.nextToken();\n        year = strTokenizer.nextToken();\n    }\n\n\
  \    public String getMonth() {\n        return month;\n    }\n\n    public String\
  \ getDay() {\n        return day;\n    }\n\n    public String getYear() {\n    \
  \    return year;\n    }\n}\n```\n\n使用一个 `StringTokenizer` 对象。它的构造函数接受一个包含 `MONTH/DAY/YEAR`\
  \ 格式日期的字符串。它提取月份、日期和年份并将这些值存储在 `month`、`day` 和 `year` 字段中。然后可以使用 `getMonth()`、`getDay()`\
  \ 和 `getYear()` 方法来获取这些值。下面的示例实现了 `DateComponent.java`。\n\n### 示例 19.41：DateTester.java\n\
  ```java\npublic class DateTester {\n    public static void main(String[] args) {\n\
  \        String date = \"10/23/2007\";\n        DateComponent dc = new DateComponent(date);\n\
  \n        System.out.println(\"Here's the date: \" + date);\n        System.out.println(\"\
  The month is \" + dc.getMonth());\n        System.out.println(\"The day is \" +\
  \ dc.getDay());\n        System.out.println(\"The year is \" + dc.getYear());\n\
  \    }\n}\n```\nOutput (DateTester.java):\nHere's the date: 10/23/2007\nThe month\
  \ is 10\nThe day is 23\nThe year is 2007\n\n### 使用多个分隔符\n某些情况需要你在同一个字符串中使用多个字符作为分隔符。例如：`Email\
  \ Address: ata4tech@gmail.com`\n\n* 此字符串使用了两个分隔符：`@`（at 符号）和 `.`（句号）\n* 要从此字符串中提取标记，我们必须在构造函数中指定这两个字符作为分隔符。\n\
  \n考虑下面的示例或上一个。\n\n### 示例 19.42：MultiDe.java\n```java\npackage ch19;\n\nimport java.util.StringTokenizer;\n\
  \npublic class MultiDe {\n    public static void main(String[] args) {\n       \
  \ StringTokenizer strTokenizer = new StringTokenizer(\"ata4tech@gmail.com\", \"\
  @ .\");\n        while (strTokenizer.hasMoreTokens()) {\n            System.out.println(strTokenizer.nextToken());\n\
  \        }\n    }\n}\n```\nOutput:\nata4tech\ngmail\ncom\n\n### 在分词前修剪字符串\n当你对用户输入的字符串进行分词，并且使用空白以外的字符作为分隔符时，你可能希望在分词之前对字符串进行修剪（trim）。否则，如果用户输入了开头空白字符，它们将成为第一个标记的一部分。同样，如果用户输入了结尾空白字符，它们将成为最后一个标记的一部分。\n\
  \n### 示例 19.43：TrimingEx.java - 创建带有开头和结尾空白的字符串\n```java\npackage ch19;\n\nimport\
  \ java.util.StringTokenizer;\n\npublic class TrimingEx {\n    public static void\
  \ main(String[] args) {\n        String str = \" One;Two;Three \";\n        // 使用分号作为分隔符对字符串进行分词\n\
  \        StringTokenizer strTokenizer = new StringTokenizer(str, \";\");\n     \
  \   // 显示标记\n        while (strTokenizer.hasMoreTokens()) {\n            System.out.println(\"\
  *\" + strTokenizer.nextToken() + \"*\");\n        }\n    }\n}\n```\nOutput:\n* One*\n\
  *Two*\n*Three *\n\n为了防止开头和/结尾空白字符包含在第一个和最后一个标记中，请使用 `String` 类的 `trim()` 方法移除它们。\n\
  \n### 示例 19.44：TrimingEx2.java - 修改代码以使用 trim 方法\n```java\npackage ch19;\n\nimport\
  \ java.util.StringTokenizer;\n\npublic class TrimingEx2 {\n    public static void\
  \ main(String[] args) {\n        String str = \" One;Two;Three \";\n\n        StringTokenizer\
  \ strTokenizer = new StringTokenizer(str.trim(), \";\");\n        // 显示标记\n    \
  \    while (strTokenizer.hasMoreTokens()) {\n            System.out.println(\"*\"\
  \ + strTokenizer.nextToken() + \"*\");\n        }\n    }\n}\n```\nOutput:\n*One*\n\
  *Two*\n*Three*\n\n### String 类的 Split 方法\n`String` 类有一个名为 `split` 的方法，它可以将字符串分词并返回一个\
  \ `String` 对象的数组。数组中的每个元素都是其中一个标记。\n\n### 示例 19.45：SplitDemo1.java\n```java\npublic\
  \ class SplitDemo1 {\n    public static void main(String[] args) {\n        // 创建一个用于分词的字符串。\n\
  \        String str = \"one two four\";\n\n        // 使用空格作为分隔符获取标记。\n        String[]\
  \ tokens = str.split(\" \");\n\n        // 显示标记\n        for (String s : tokens)\
  \ {\n            System.out.println(s);\n        }\n    }\n}\n```\nOutput:\none\n\
  two\nfour\n\n### 解析\n* 传递给 `split` 方法的参数指示分隔符。在这个示例中，使用空格作为分隔符。\n* 你传递给 `split`\
  \ 方法的参数是一个正则表达式。\n* 我们传递给 `split` 方法的是包含单个空格的字符串。\n* `split` 方法也允许使用多字符分隔符。你必须在正则表达式中包含分隔符。\n\
  \n### 示例 19.46：SplitDemo2.java - 程序代码\n```java\npublic class SplitDemo2 {\n    public\
  \ static void main(String[] args) {\n        // 创建一个用于分词的字符串。\n        String str\
  \ = \"one and two and four\";\n\n        // 使用 \" and \" 作为分隔符获取标记。\n        String[]\
  \ tokens = str.split(\" and \");\n\n        // 显示标记\n        for (String s : tokens)\
  \ {\n            System.out.println(s);\n        }\n    }\n}\n```\nOutput:\none\n\
  two\nthree\n\n### 数值数据类型的包装类\nJava 为每个数值数据类型提供了包装类。这些类具有处理原始值值的有用方法。\n\n#### 表 19.11：数值数据类型的包装类\n\
  | 包装类 | 对应的原始类型 |\n| :--- | :--- |\n| Byte | byte |\n| Double | double |\n| Float\
  \ | float |\n| Integer | int |\n| Long | long |\n| Short | short |\n\n#### 静态 toString\
  \ 方法\n每个数值包装类都有一个静态 `toString` 方法可以将数字转换为字符串。该方法接受数字作为参数并返回该数字的字符串表示。这里有一个简单的示例：\n\
  \n### 示例 19.47：ToStringEx.java\n```java\npublic class ToStringEx {\n    public static\
  \ void main(String[] args) {\n        int i = 12;\n        double d = 14.95;\n \
  \       String str1 = Integer.toString(i);\n        String str2 = Double.toString(d);\n\
  \        System.out.println(str1);\n        System.out.println(str2);\n    }\n}\n\
  ```\nOutput:\n12\n14.95\n\n#### toBinaryString, toHexString 和 toOctalString 方法\n\
  `toBinaryString`、`toHexString` 和 `toOctalString` 方法是 `Integer` 和 `Long` 包装类的静态成员。这些方法接受一个\
  \ `Integer` 作为参数，并返回转换为二进制、十六进制或八进制的数字字符串表示。例如：\n\n### 示例 19.48：ToEx.java\n```java\n\
  public class ToEx {\n    public static void main(String[] args) {\n        int number\
  \ = 14;\n        System.out.println(Integer.toBinaryString(number));\n    }\n}\n\
  ```\n\n\n\n\n\n```java\nSystem.out.println(Integer.toHexString(number));\nSystem.out.println(Integer.toOctalString(number));\n\
  }\n```\nOutput1110e\n\n## MIN_VALUE 和 MAX_VALUE\n\n数值包装类各有一组名为 `MIN_VALUE` 和 `MAX_VALUE`\
  \ 的静态 final 变量。这些变量存储了特定数据类型的最小值和最大值。这是一个简单的示例。\n\n### 示例 19.49: MinMaxEx.java -\
  \ 显示 int 的最小值和最大值\n```java\npublic class MinMaxEx {\n    public static void main(String[]\
  \ args) {\n        System.out.println(\"The min value for an int is \" +\n     \
  \   Integer.MIN_VALUE);\n        System.out.println(\"The max value for an int is\
  \ \" +\n        Integer.MAX_VALUE);\n    }\n}\n```\nOutput\nThe min value for an\
  \ int is -2147483648\nThe max value for an int is 2147483647\n\n## 自动装箱（Autoboxing）与自动拆箱（unboxing）\n\
  \n可以从包装类创建对象。一种方法是将初始值传递给构造函数：\n```java\nInteger number = new Integer(7);\n```\n\
  这创建了一个初始化值为 7 的 `Integer` 对象，并由变量 `number` 。另一种方法是简单声明一个包装类变量，然后给它分配一个基本类型值。例如：\n\
  ```java\nInteger number;\nnumber = 7;\n```\n\n### 解析\n* 第一条语句声明了一个名为 `number` 的\
  \ `Integer` 变量。它没有创建 `Integer` 对象，仅仅创建了一个变量。\n* 第二条语句是一个简单的赋值语句。它将基本类型值 7 赋值给变量\
  \ `number`。\n* 你可能怀疑这会导致错误。毕竟，`number` 是一个引用变量，而不是基本类型变量。\n* 然而，由于 `number` 是一个包装类变量，Java\
  \ 会执行自动装箱操作。\n\n**自动装箱（Autoboxing）** 是 Java 将一个值自动封装到对象内部的过程。当执行此赋值语句时，Java 会将整数对象内部的值\
  \ 7 装箱起来，然后将该对象的地址分配给变量 `number`。\n\n**自动拆箱（Unboxing）** 是装箱的反过程。它是将包装类对象转换为基本类型的过程。\n\
  \n### 示例 19.50: UnBoxEx.java - 一个拆箱操作\n```java\npublic class UnBoxEx {\n    public\
  \ static void main(String[] args) {\n        Integer myInt = 5; // 将值 5 自动装箱\n \
  \       int primitiveNumber;\n        primitiveNumber = myInt; // 将对象拆箱\n    }\n\
  }\n```\n\n### 解析\n* 第 03 行：声明 `myInt` 为 `Integer` 引用变量。\n* 基本类型值 5 被自动装箱，生成的对象地址被分配给变量\
  \ `myInt`。\n* 第 04 行：声明 `primitiveNumber` 为 `int` 变量。\n* 第 05 行：将 `myInt` 对象分配给\
  \ `primitiveNumber`。\n* 当执行此语句时，Java 自动拆箱 `myInt` 包装类对象，并将结果值（即 5）存储在 `primitiveNumber`\
  \ 中。\n\n虽然你很少需要创建包装类的实例，但 Java 的自动装箱和自动拆箱功能使得某些操作更加方便。偶尔，你会发现自己处于这样的情况：你想使用基本类型变量执行操作，但该操作只能与对象一起使用。\n\
  \n### 回顾 ArrayList 类\n* `ArrayList` 是一种类似数组的对象，可以用于存储其他对象。\n* 然而，你不能在 `ArrayList`\
  \ 中存储基本类型值。\n* 它仅设计用于存储对象。\n* 如果你尝试编译以下语句，将会发生错误：\n```java\nArrayList<int> list\
  \ = new ArrayList<int>( ); // 错误\n```\n但是，你可以在 `ArrayList` 中存储包装类对象。如果我们需要在 `ArrayList`\
  \ 中存储 `int` 值，必须指定该 `ArrayList` 将持有 `Integer` 对象。例如：\n```java\nArrayList<Integer>\
  \ list = new ArrayList<Integer>(); // 正确\n```\n此语句声明了 `list` 引用一个可以持有 `Integer`\
  \ 对象的 `ArrayList`。在 `ArrayList` 中存储 `int` 值的一种方法是实例化一个 `Integer` 对象，用所需的 `int` 值对其初始化，然后将该\
  \ `Integer` 对象传递给 `ArrayList` 的 `add` 方法。例如：\n```java\nArrayList<Integer> list =\
  \ new ArrayList<Integer>();\nInteger myInt = 5;\nlist.add(myInt);\n```\n然而，Java\
  \ 的自动装箱和自动拆箱功能使得没有必要创建 `Integer` 对象。如果你向 `ArrayList` 添加一个 `int` 值，Java 会对该值自动装箱。例如：\n\
  ```java\nArrayList<Integer> list = new ArrayList<Integer>();\nlist.add(myInt);\n\
  ```\n当值 5 被传递给 `add` 方法时，Java 将该值封装在一个 `Integer` 对象中。在需要时，Java 也会对从 `ArrayList`\
  \ 中获取的值进行拆箱。例如：\n```java\nArrayList<Integer> list = new ArrayList<Integer>();\n\
  list.add(myInt);\nint primitiveNumber = list.get(0);\n```\n最后一条语句获取索引为 0 的项。由于该项被赋值给\
  \ `int` 变量，Java 将其拆箱并将基本类型值存储在 `int` 变量中。\n\n***\n\n## 总结\n* Java 为基本类型提供了包装类。包装类是一个“封装”了基本类型的类，并允许你创建对象而不是变量。\n\
  * 针对给定基本类型的包装类不仅包含该类型的值，还包含与类型相关的方法。\n* 虽然这些包装类可以用来创建对象而不是变量，但很少程序员这样做。\n* 因为包装类是不可变的，这意味着一旦创建对象就无法更改值，它们不像变量那样容易使用。\n\
  * `Character` 类是 `char` 类型的包装类。它提供了许多测试和转换字符的方法。`Character` 类属于 `java.lang` 包。\n\
  * `startsWith` 方法判断调用字符串是否以子字符串开头。\n* `String` 类提供了 `regionMatches` 的重载版本，用于判断两个区域是否匹配。\n\
  * `indexOf` 和 `lastIndexOf` 方法可以搜索字符或子字符串。如果找到了搜索项，则返回其位置；否则返回 -1。\n* `indexOf`\
  \ 和 `lastIndexOf` 方法还可以搜索字符串中的子字符串。\n* `substring` 方法返回调用对象的子字符串副本。\n* `getChars`\
  \ 和 `toCharArray` 方法将调用字符串对象转换为字符数组。`getChars` 方法可以转换子字符串，而 `toCharArray` 方法转换整个字符串。\n\
  * `concat` 方法执行的操作与在字符串上使用 `+` 运算符相同。\n* `replace` 方法返回 `String` 对象的副本，其中所有指定字符都被替换为另一个字符。\n\
  * `replace` 方法不会修改调用 `String` 对象的内容，而是返回一个该对象的修改副本的 `String` 引用。\n* `trim` 方法返回\
  \ `String` 对象的副本，并删除了所有开头和结尾的空白字符。开头空白字符是指字符串开头、左侧的字符。\n* `StringBuilder` 类与 `String`\
  \ 类相似，区别在于你可以修改 `StringBuilder` 对象的内容，但不能修改 `String` 对象的内容。`StringBuilder` 类还提供了许多\
  \ `String` 类没有的有用方法。\n* 与 `String` 对象不同，`StringBuilder` 对象允许你修改内容而不必在内存中创建新对象。\n\
  * `StringBuilder` 对象会根据需要增大或缩小大小以适应变化。\n\n\n\n\n\n*   `StringBuilder` 类还具有几个名为 `insert`\
  \ 的重载方法，该方法可以将一个值插入到调用对象的字符串中。\n*   `delete` 和 `deleteCharAt` 方法用于从 `StringBuilder`\
  \ 对象中删除子字符串或某个字符。\n*   `setCharAll` 方法将指定的字符更改另一个值。\n*   Java 提供了一个名为 `StringBuffer`\
  \ 的类，它本质上与 `StringBuilder` 类相同，具有相同的构造函数和相同的方法。区别在于 `StringBuffer` 类中的方法是同步的。这意味着\
  \ `StringBuffer` 类在多线程应用程序中使用是安全的。\n*   字符串分词（Tokenizing）是一个将字符串拆分为其各个组件的过程，这些组件被称为标记（tokens）。可以使用\
  \ `StringTokenizer` 类和 `String` 类的 `split` 方法来对字符串进行分词。将字符串拆分为标记的过程被称为分词。\n*   Java\
  \ 提供了一个 `StringTokenizer` 类，它允许你对字符串进行分词。\n*   `toBinaryString`、`toHexString` 和\
  \ `toOctalString` 方法接受一个 `Integer` 作为参数，并返回该数字转换为二进制、十六进制或八进制的字符串表示。\n*   每个数值包装类都有一组名为\
  \ `MIN_VALUE` 和 `MAX_VALUE` 的静态常量变量。这些变量持有特定数据类型的最小值和最大值。\n*   自动装箱（Autoboxing）自动将对象内部的值装箱的过程。\n\
  *   自动拆箱（Unboxing）将包装类对象转换为原始类型的过程。\n\n## 第 20 章：继承\n\n## 什么是继承？\n继承允许新类扩展一个现有类。新类继承其扩展的类的成员。在现实世界中，你可以发现许多对象是更通用对象的特殊版本。例如：\n\
  \n| 通用对象 | 特殊对象 |\n| :--- | :--- |\n| 狗 | 贵宾 |\n| 车辆 | 汽车 |\n| 形状 | 矩形 |\n| 植物 |\
  \ 花 |\n\n特化对象具有通用对象的所有特征，外加上使其特殊的额外特征。在面向对象编程中，继承涉及一个父类（superclass）和一个子类（subclass）。父类是通用类，而子类是特化类。子类是父类的扩展版本。子类继承父类的字段和方法，而无需重写其中任何一个。子类可以添加新的字段和方法，这正是它成为父类特化版本的原因。父类也称为“基类”，子类也称为“派生类”。考虑下面的示例。\n\
  \n### 示例 20.1 : Vechicle.java\n```\n01 class Vehicle\n02 {\n03 // 成员声明\n04 }\n05\
  \ class Car extends Vehicle\n06 {\n07 // 继承 Vehicle 的可访问成员\n08 // 提供自己的成员声明\n09\
  \ }\n10 class Bus extends Vehicle\n11 {\n12 // 继承 Vehicle 的可访问成员\n13 // 提供自己的成员声明\n\
  14 }\n```\n`extends` 关键字位于类名之后、另一个类名之前。`extends` 之前的类名标识子类，`extends` 之后的类名标识父类。\n\
  \n## 父类的构造函数\n在继承关系中，父类的构造函数始终在子类的构造函数之前执行。考虑下面的示例。\n\n### 示例 20.2 : SuperClass\
  \ .java\n```\n01 public class SuperClass\n02 {\n03 public SuperClass()\n04 {\n05\
  \ System.out.println(\"This is the \" +\n06 \"superclass constructor.\");\n07 }\n\
  08 }\n```\n类 `SuperClass` 有一个无参构造函数。该构造函数显示消息“This is the superclass constructor”。\n\
  \n### 示例 20.3 : SubClass.java\n```\n01 public class SubClass extends SuperClass\n\
  02 {\n03 public SubClass()\n04 {\n05 System.out.println(\"This is the \" +\n06 \"\
  subclass constructor.\");\n07 }\n08 }\n```\n`SubClass` 扩展自 `SuperClass`。它也有一个无参构造函数，显示消息“This\
  \ is the subclass constructor”。\n\n### 示例 20.4 : ConstructorDemo.java\n```\n01 public\
  \ class ConstructorDemo\n02 {\n03 public static void main(String[] args)\n04 {\n\
  05 SubClass obj = new SubClass();\n06 }\n07 }\n```\n**输出：**\n`This is the subclass\
  \ constructor.`\n\n创建一个 `SubClass` 对象。父类的构造函数首先执行，接着执行 `SubClass` 构造函数。如果父类具有 (a)\
  \ 默认构造函数或 (b) 在类中编写的无参构造函数，则该构造函数将在子类构造函数执行之前自动调用。\n\n## 继承不可反向的\n在继承关系中，子类继承父类的成员，反之则不然。这意味着父类无法调用子类的方法。\n\
  \n## 调用父类构造函数\n\n### 简介\n记住，父类的默认构造函数或无参构造函数会在子类构造函数执行之前自动调用。但如果父类没有默认构造函数或无参构造函数呢？或者，如果父类有多个重载构造函数，而你想确保调用特定的一个呢？\n\
  \n**解决方案：** 使用 `super` 关键字显式地调用父类构造函数。`super` 关键字引用对象的父类，并用于访问父类的成员。\n\n### 示例 20.5\
  \ : SuperClass1.java\n```\n01 public class SuperClass1\n02 {\n03 public SuperClass1()\n\
  04 {\n05 System.out.println(\"This is the superclass \" +\n06 \"no-arg constructor.\"\
  );\n07 }\n08 public SuperClass1(int arg)\n09 {\n10  System.out.println(\"The following\
  \ argument \" +\n11 \"was passed to the superclass \"\n12 \"constructor: \" + arg);\n\
  13 }\n14 }\n```\n`SuperClass1` 类有一个无参构造函数和一个接受 `int` 的构造函数。\n\n### 示例 20.6 : SubClass1.java\n\
  ```\n01 public class SubClass1 extends SuperClass1\n02 {\n03 public SubClass1()\n\
  04 {\n05 super(10);\n06 System.out.println(\"This is the \" +\n07 \"subclass constructor.\"\
  );\n08 }\n09 }\n```\n`SubClass1` 扩展自 `SuperClass1`。该类的构造函数使用 `super` 关键字调用父类构造函数并传递参数。\n\
  \n### 关于调用父类构造函数需要记住的三条指南：\n1. 调用父类构造函数的 `super` 语句只能写在子类的构造函数中。你不能在其他方法中调用父类构造函数。\n\
  2. 调用父类构造函数的 `super` 语句必须是子类构造函数的第一个语句。这是因为父类的构造函数必须在子类构造函数的代码之前执行。\n3. 如果子类构造函数没有显式调用父类构造函数，Java\
  \ 会执行子类构造函数代码之前自动调用父类的默认构造函数或无参构造函数。这等同于在子类构造函数开头放置：`super()`\n\n## 当父类没有默认或无参构造函数时\n\
  * 只有当你没有为类提供构造函数时，Java 才会为类提供默认构造函数。这使得没有默认构造函数成为可能。\n* `SuperClass1` 类有一个接受参数的构造函数。因为我们提供了这个构造函数，`SuperClass1`\
  \ 类就没有默认构造函数。\n* 此外，我们没有为该类编写无参构造函数。\n* 如果 `SuperClass1` 没有默认构造函数也没有无参构造函数，那么继承它的类必须调用父类拥有的某个构造函数。否则，在编译子类时会产生错误。\n\
  \n## 继承中构造问题的总结\n关于继承关系中构造函数需要记住的问题。以下列表总结了它们：\n* 父类的构造函数始终在子类的构造函数之前执行。\n\n\n\n\
  \n\n- 你可以编写一个调用父类构造函数的 `super` 语句，但只能在子类的构造函数中编写。你不能从任何其他方法中调用父类构造函数。\n- 如果子类构造函数中出现了调用父类构造函数的\
  \ `super` 语句，它必须是第一条语句。\n- 如果子类构造函数没有显式地调用父类构造函数，Java 将在执行子类构造函数中的代码之前自动调用 `super()`。\n\
  - 如果父类没有默认构造函数且没有无参数构造函数，那么继承自它的类必须调用该父类所拥有的其中一个构造函数。\n\n## Object 类\n\n当一个类没有使用\
  \ `extends` 关键字继承另一个类时，java 会自动将其从 `object` 类进行扩展。`java` 中的每个类都直接或间接地继承自名为 `Object`\
  \ 的类，该类是 `java.lang` 包的一部分。例如：\n\n```java\n// 类声明\npublic class MyClass\n{\n   \
  \ (成员声明 ...)\n}\n```\n\n该类没有显式地继承任何其他类，因此 Java 将其处理为如下编写的内容：\n\n```java\n// 类声明\n\
  public class MyClass extends Object\n{\n    (成员声明 ...)\n}\n```\n\n最终，每个类都继承自 `Object`\
  \ 类。因此，每个类都继承 `Object` 类的成员。其中最有用的两个是 `toString` 和 `equal` 方法。\n\n## 重写父类方法\n\n\
  子类可能拥有一个与父类方法签名相同的方法。在这种情况下，子类方法重写了父类方法。有时，子类从其父类继承了一个方法，但该方法无法满足子类的需求。\n\n由于子类比父类更具专门性，有时子类需要将不合适的父类方法替换为更合适的。这被称为方法重写（Method\
  \ Overriding）。我们可以通过这段代码片段更清楚地理解它：\n\n示例 20.7: Abc.java - 方法重写\n```java\npackage\
  \ ch20;\n\npublic class Abc {\n    public static void main(String args[]){\n   \
  \     Company a = new Company();\n        Company b = new Xyz();\n        a.address();\n\
  \        b.address();\n    }\n}\nclass Company{\n    public void address() {\n \
  \       System.out.println(\"This is address of Abc company...\" );\n    }\n}\n\
  class Xyz extends Company{\n    public void address(){\n        super.address();\n\
  \        System.out.println(\"This is Xyz's address...\" );\n    }\n}\n```\n输出\n\
  ```\nThis is address of Abc company...\nThis is address of Abc company...\nThis\
  \ is Xyz's address...\n```\n\n### 解析\n- 为了让子类方法重写父类方法，它必须具有相同的签名。\n- 当子类对象调用该方法时，它调用的是子类版本的方法，而不是父类的版本。\n\
  - 如你所知，`super` 关键字指向对象的父类。\n- 子类可以通过在方法名前前加上 `super` 关键字和点符号（.）来调用被重写的父类方法。\n\n\
  ### 方法重写的规则\n- 在 `java` 中，方法只能写在 `Subclass` 中，而不能写在同一个类中。\n- 参数列表应与被重写方法的完全一致。\n\
  - 返回类型应与父类中原始被重写方法声明的返回类型相同，或是其子类型。\n- 访问级别不能比被重方法的访问级别更严格。例如，如果父类方法被声明为 `public`，那么子类中的重写方法不能是\
  \ `private` 或 `protected`。\n- 实例方法只有在被子类继承时才能被重写。\n- 声明为 `final` 的方法不能被重写。\n- 声明为\
  \ `static` 的方法不能被重写，但可以重新声明。\n- 如果方法无法被继承，则它不能被重写。\n- 与实例父类处于同一个包中的子类可以重写任何未声明为\
  \ `private` 或 `final` 的父类方法。\n- 不同包中的子类只能重写声明为 `public` 或 `protected` 的非 final 方法。\n\
  - 重写方法可以抛出任何未检查异常（unchecked exceptions），无论被重写方法是否抛出异常。然而，重写方法不应抛出比被重写方法声明的新或更广泛的检查异常（checked\
  \ exceptions）。重写方法可以抛出比被重写方法窄或更少的异常。\n- 构造函数不能被重写。\n\n## 重载与重写\n- **重载 (Overloading)**：当一个方法与一个或多个方法同名，但参数列表不同或签名不同。\n\
  - **重写 (Overriding)**：当一个方法重写了另一个方法，且它们都具有相同的签名。\n- 重载和重写都可以发生在继承关系中。\n- 你已经知道重载方法可以出现在同一个类中。子类中的方法可以重载父类中的方法。如果类\
  \ `A` 是父类而类 `B` 是子类，那么类 `B` 中的方法可以重载类 `A` 中的方法，或者重载类 `B` 中的另一个方法。\n- 另一方面，重写只能发生在继承关系中。如果类\
  \ `A` 是父类而类 `B` 是子类，那么类 `B` 中的方法可以重写类 `A` 中的方法。然而，一个方法不能重写同一类中的另一个方法。\n\n## 重载与重写的区别\n\
  重载与重写的区别很重要，因为它们会影响子类中父类方法的可访问性。\n- 如果两个方法名称相同但签名不同，它们就是重载的。这发生在方法位于同一个类中，或者一个方法在子类中而另一个在父类中时。\n\
  - 如果子类中的方法与父类中的方法签名相同，它们就是重写。这发生在一个方法在子类中而另一个在父类中，且子类方法替换了父类方法时。\n\n以下是用于解释上述内容的代码片段：\n\
  \n示例 20.8: SuperClass.java - 重载\n```java\npublic class SuperClass {\n    public\
  \ void showValue(int x) {\n        System.out.println(\"SUPERCLASS: The int argument\
  \ was \" + x);\n    }\n    public void showValue(String s) {\n        System.out.println(\"\
  SUPERCLASS: The String argument was \" + s);\n    }\n}\n```\n两个同名的 `showValue` 方法。一个接受\
  \ `int` 参数，另一个接受 `String` 参数。\n\n示例 20.9: SubClass2.java - 重写\n```java\npublic class\
  \ SubClass2 extends SuperClass {\n    public void showValue(int x) {\n        System.out.println(\"\
  SUBCLASS: The int argument was \" + x);\n    }\n    public void showValue(double\
  \ s) {\n        System.out.println(\"SUBCLASS: The double argument was \" + s);\n\
  \    }\n}\n```\n两个同名的 `showValue` 方法。第一个（L3-L6）接受 `int` 参数。它重写了父类方法之一，因为它们的签名相同。第二个\
  \ `showValue` 方法（L7-L10）接受 `double` 参数。它重载了其他 `showValue` 方法，因为其他方法都没有相同的签名。尽管这些类中共有四个\
  \ `showValue` 方法，但只有三个可以被 `SubClass` 对象调用。这将在下一个示例中演示。\n\n示例 20.10: ShowValueDemo.java\n\
  ```java\npublic class ShowValueDemo {\n    public static void main(String[] args)\
  \ {\n        // 创建 SubClass 对象。\n        SubClass2 myObject = new SubClass2();\n\
  \n        myObject.showValue(10); // 传递一个 int。\n        myObject.showValue(1.2);\
  \ // 传递一个 double。\n        myObject.showValue(\"Hello\"); // 传递一个 String。\n    }\n\
  }\n```\n输出\n```\nSUBCLASS: The int argument was 10\nSUBCLASS: The double argument\
  \ was 1.2\nSUPERCLASS: The String argument was Hello\n```\n\n\n\n\n\n## 父类\n\n`String`\
  \ 参数的值为 Hello。当将一个 `int` 参数传递给 `showValue` 时，会调用 `subClass` 的方法，因为它重写了父类方法。为了调用被重写的父类方法，我们必须在子类方法中使用\
  \ `super` 关键字。\n\n## 示例 20.11: 在子类方法中使用 super 关键字\n```java\n01 public class SubClass2\
  \ extends SuperClass2\n02 {\n03 public void showValue(int x)\n04 {\n05 super.showValue(x);\n\
  06 System.out.println(\"SUBCLASS: The int argument was \" + x);\n07 }\n08 public\
  \ void showValue(double s)\n09 {\n10 System.out.println(\"SUBCLASS: The double argument\
  \ was \" + s);\n11 }\n12 }\n```\n\n## 防止方法被重写\n当使用 `final` 修饰符声明方法时，该方法不能在子类中被重写。接面的方法头是一个使用\
  \ `final` 修饰符的示例：\n```\npublic final void message( );\n```\n如果子类尝试重写 `final` 方法，编译器将生成错误。这种技术可以用来确保特定的父类方法被子类使用，而不是其修改后的版本。\n\
  \n***\n\n## 保护成员\n\n## Java 访问修饰符\nJava 访问修饰符指定了哪些类可以访问给类及其字段、构造函数和方法。Java 提供了访问修饰符来设置类、变量、方法和构造函数的访问级别。四种访问级别为：\n\
  \n* `default`（包内可见）。不需要任何修饰符。\n* `private`（仅对类可见）。\n* `public`（对所有人可见）。\n* `protected`（对包及所有子类可见）。\n\
  \n## 保护成员\n类的保护成员可以被：\n* 被子类中的方法访问，以及与该类同一个包中的方法访问。\n* 被同一类的方法或子类的方法访问。\n* 被与保护成员所在类同一个包的任何类的方法访问。\n\
  \n保护成员并不完全是公共的，因为对它们的访问限制在同一类、子类以及与成员类同一个包的类中。保护成员的访问权限介于私有和公共之间。我们可以通过这些示例更清楚地理解它。\n\
  \n### 示例 20.12: Shape.java - 保护成员\n```java\n01 package ch20;\n02\n03 public class\
  \ Shape\n04 {\n05 protected int sides;\n06\n07 public Shape()\n08 {\n09 sides =\
  \ 2;\n10 }\n11 public int getSides()\n12 {\n13 return sides;\n14 }\n15 public void\
  \ printSides()\n16 {\n17 System.out.println(\"This object has \" + sides + \" sides.\"\
  \ );\n18 }\n19 }\n```\n\n### 示例 20.13: Square.java\n```java\n01 package ch20;\n\
  02\n03 public class Square extends Shape\n04 {\n05 public Square(int nSides)\n06\
  \ {\n07 sides = nSides;\n08 }\n09 }\n```\n\n### 示例 20.14: ProtectedVariable.java\n\
  ```java\n01 package ch20;\n02\n03 class ProtectedVariableDemo\n04 {\n05 public static\
  \ void main(String args[])\n06 {\n07 Square Obj = new Square(10);\n08 Obj.printSides();\n\
  09 }\n10 }\n```\n**输出 (ProtectedVariable.java)**\n`This object has 10 sides.`\n\n\
  虽然将类成员设置为保护的而不是私有的可能会让某些任务变得简单，但你应该尽可能避免这种做法，因为任何继承自该类或位于同一包中的类对保护成员都具有无限制的访问权限。将所有字段设为私有，然后提供公共方法来访问这些字段，总是更好的。\n\
  \n***\n\n## 包访问\n如果你不为类成员提供访问限定符，则该类成员默认获得包级访问权限。这意味着同包中的任何方法都可以访问该成员。这里有一个简单的示例。\n\
  \n### 示例 20.15: AA.java - 包访问\n```java\n01 // AA.java\n02 package A;\n03 class AA\n\
  04 void messsage() {\n05 System.out.println(\"Welcome\");\n06 }\n07 }\n```\n```java\n\
  01 // BB.java\n02 package B;\n03 import A.*;\n04 class BB\n05 public static void\
  \ main(String args[]) {\n06 AA obj = new AA(); // 编译错误\n07 obj.message(); // 编译错误\n\
  08 }\n09 }\n```\n\n#### 解释\n* 我们创建了两个包 `A` 和 `B`。\n* 我们从包外部访问 `AA` 类，由于 `AA` 类不是\
  \ `public` 的，所以无法从包外部访问。\n* 在上面的示例中，类 `AA` 及其方法 `message()` 的范围是默认的，因此无法从包外部访问。\n\
  \n保护访问和包访问之间存在细微的区别：\n* 保护访问成员可以被同包中的方法或子类中的方法访问。如果子类位于不同的包中（仅通过继承），这依然成立。\n* 然而，具有包访问权限的成员无法被位于不同包的子类访问。\n\
  \n### 注意事项\n* 你更有可能无意中而非设计上赋予类成员包访问权限，因为忘记了指定访问限定符。\n* 尽管在某些情况下包访问是有帮助的，但通常你应该避免它。\n\
  * 务必为类成员指定访问限定符。\n\n### 表 20.1：包内访问权限\n| 访问限定符 | 对同包内的子类可见？ | 对包内所有其他类可见 |\n| :---\
  \ | :--- | :--- |\n| default (无修饰符) | 是 | 是 |\n| public | 是 | 是 |\n| protected |\
  \ 是 | 是 |\n| private | 否 | 否 |\n\n### 表 20.2：包外访问权限\n| 访问限定符 | 对包外的子类可见？ | 对包外的其他类可见\
  \ |\n| :--- | :--- | :--- |\n| default (无修饰符) | 否 | 否 |\n| public | 是 | 是 |\n| protected\
  \ | 是 | 否 |\n| private | 否 | 否 |\n\n***\n\n## 总结\n* 继承允许新类扩展现有类。新类继承该类的成员。\n* 在面向对象编程中，继承涉及父类和子类。父类是通用类，子类是专门类。\n\
  * 子类是父类的扩展版本。子类继承父类的字段和方法，无需任何重写。父类也称为基类，子类也称为派生类。\n* 在继承关系中，父类的构造函数总在子类的构造函数之前执行。\n\
  * 在继承关系中，子类继承父类的成员，而不是相反。这意味着父类无法调用子类的方法。\n* `super` 关键字引用对象的父类，并用于访问父类的成员。\n* 调用父类构造函数的\
  \ `super` 语句必须是子类构造函数的第一个语句。这是因为父类的构造函数必须在子类构造函数的代码之前执行。\n* 如果类构造函数没有显式调用父类构造函数，Java\
  \ 会在子类构造函数执行之前自动调用父类的默认构造函数（无参数构造函数）。这相当于在子类构造函数的开头放置以下语句：`super();`。\n* 只有当你没有为类提供构造函数时，Java\
  \ 才会为类提供默认构造函数。这使得没有默认构造函数的可能。\n* 如果父类没有默认构造函数也没有无参数构造函数，那么继承它的类必须调用父类拥有的构造函数之一。\n\
  * 父类的构造函数总在子类的构造函数之前执行。\n\n\n\n\n\n## 覆盖规则与概念\n\n- 当一个类没有使用 `extends` 关键字继承另一个类时，java\
  \ 会自动从 `Object` 类对其进行扩展。java 中的每个类都直接或间接继承自名为 `Object` 的类，它是 `java.lang` 包的一部分。\n\
  - 子类方法中的返回类型应该是父类中原始被重写方法声明的返回类型或其子类型。\n- 访问权限不能比被重写方法的权限更严格。例如，如果父类方法被声明为 `public`，则子类中的重写方法不能是\
  \ `private` 或 `protected`。\n- 只有当实例方法被子类继承时，它才能被重写。\n- 声明为 `final` 的方法不能重写。\n- 声明为\
  \ `static` 的方法不能重写，但可以重新声明。\n- 如果一个方法无法被继承，则它不能被重写。\n- 与实例父类处于同一个包中的子类可以覆盖任何未声明为\
  \ `private` 或 `final` 的父类方法。\n- 不同包中的子类只能覆盖声明为 `public` 或 `protected` 的非 `final`\
  \ 方法。\n- 重写方法可以抛出任何未检查异常（unchecked exceptions），无论被重写方法是否抛出异常。然而，重写方法不应抛出比被重写方法声明的新或更广泛的检查异常（checked\
  \ exceptions）。重写方法抛出的异常可以比被重写方法的更窄或更少。\n- 构造函数不能被重写。\n- 重载是指一个方法与一个或多个方法具有相同名称，但参数列表或签名不同。\n\
  - 重写（Overriding）是指一个方法覆盖了另一个方法，且它们具有相同的签名。\n- 重载和重写都可以在继承关系中发生。\n- 你已经知道重载方法可以出现在同一个类中。子类中的方法可以重载父类中的方法。如果类\
  \ `A` 是父类而类 `B` 是子类，则类 `B` 中的方法可以重载类 `A` 中的方法，或类 `B` 中的另一个方法。\n- 重写只能在继承关系中发生。如果类\
  \ `A` 是父类而类 `B` 是子类，则类 `B` 中的方法可以重写类 `A` 中的方法。然而，一个方法不能重写同一类中的另一个方法。\n- 如果两个方法同相同但签名不同，它们就是重载。当方法在同一个类中，或者一个方法在父类中另一个方法在子类中时，均如此。\n\
  - 如果子类中的方法与父类中的方法具有相同，则子类方法重写父类方法。\n- 当子类重载父类方法时，可以使用子类对象调用这两种方法。\n- 然而，当子类重写父类方法时，只有子类的方法版本可以使用子类对象调用。\n\
  - Java 访问修饰符指定了哪些类可以访问给定的类及其字段、构造函数和方法。\n- Java 提供了许多访问修饰符来设置类、变量、方法和构造函数的访问级别。四种访问级别是\
  \ `default`（包可见）、`private`（仅类内可见）、`public`（对所有人可见）、`protected`（对包和所有子类可见）。\n\n##\
  \ 第 21 章：多态\n\n### 引言\n父类引用变量可以引用子类对象。正如我们所知，为了声明一个引用对象的变量，我们使用以下语法：\n`ClassName\
  \ variableName;`\n\n这里，`variableName` 是引用变量名，`ClassName` 是其类名。因此，`variableName`\
  \ 可以引用任何 `ClassName` 类的对象。然而，它也可以引用任何类为 `ClassName` 子类的对象。\n\n例如：如果类 `A` 是类 `B`\
  \ 的父类，且类 `B` 是类 `C` 的父类，在这种情况下，类 `A` 的变量可以引用任何派生自该类的对象（即类 `B` 和类 `C` 的对象）。这是可能的因为每个子类对象都是其父类的对象，但反之则不然。\n\
  \n### 示例 21.1：Abc.java\n为了说明父类引用变量如何引用派生类对象，让我们考虑以下示例，类 `SubClass1` 和 `SubClass2`\
  \ 派生自共同的父类 `SuperClass`。所有类具有相同名称的方法，我们使用父类引用变量来访问这些方法。\n\n```java\npackage ch21;\n\
  \nclass SuperClass {\n    public void display() {\n        System.out.println(\"\
  SuperClass class display method is called\");\n    }\n}\nclass SubClass1 extends\
  \ SuperClass {\n    public void display() {\n        System.out.println(\"SubClass1\
  \ class display method is called\");\n    }\n}\nclass SubClass2 extends SuperClass\
  \ {\n    public void display(){\n        System.out.println(\"SubClass2 class display\
  \ method is called\");\n    }\n}\nclass polymorphism {\n    public static void main(String[]\
  \ args){\n        SuperClass ptr; //SuperClass 类引用变量\n        SubClass1 dl = new\
  \ SubClass1();\n        SubClass2 d2 = new SubClass2();\n        ptr = dl; // ptr\
  \ 包含 SubClass1 对象的引用\n        ptr.display();\n        ptr = d2; // ptr 包含 SubClass2\
  \ 对象的引用\n        ptr.display();\n    }\n}\n```\n\n**输出：**\n```\nSubClass1 class\
  \ display method is called\nSubClass2 class display method is called\n```\n\n程序的输出显示子类的\
  \ `display()` 方法被调用。如果父类引用变量 `ptr` 包含 `SubClass1` 对象的引用，则会调用该对象的 `display()` 方法。同样，如果\
  \ `ptr` 包含 `SubClass2` 对象的引用，则会调用该对象的方法。这意味着一个 `ptr.display()` 调用可以根据 `ptr` 的内容调用不同的方法。这就是实现多态的方式。注意，调用哪个重写方法始终是由引用对象的类型决定的，而不是变量的类型。确定使用哪种实现的任务是由\
  \ JVM 在运行时执行的。这被称为动态绑定（Dynamic Binding）。\n\n只有在满足以下要求时才能实现多态行为：\n- 子类对象的调用必须通过父类引用变量。\n\
  - 被调用的方法在父类中声明并在子类中定义。\n- 父类和子类中的方法具有相同的名称和参数列表，且对应参数类型相同。\n- 方法返回类型在父类和子类中相同，或者是协变的。如果派生类方法的返回类型是基类返回类型的子类，则认为返回类型是协变的。\n\
  - 方法访问范围在子类中不能比父类更严格。\n\n### 示例 21.2\n考虑 `Square` 和 `Circle` 是 `Shape` 类的子类。假设我们要计算任何形状的面积，因此我们在\
  \ `Shape` 类中定义一个 `area()` 方法，并在 `Square` 和 `Circle` 子类中重写它，以计算矩形和圆形的面积。\n\n```java\n\
  class Shape {\n    public void area() {\n        System.out.println(\"Super class\
  \ area method is called\");\n    }\n}\nclass Square extends Shape {\n    private\
  \ double length, breadth;\n    Square(double x,double y) {\n        length = x ;\n\
  \        breadth = y ;\n    }\n    public void area() {\n        System.out.println(\"\
  Area of Square is = \" + (length * breadth));\n    }\n}\nclass Circle extends Shape\
  \ {\n    private double radius;\n    Circle(double r) {\n        radius = r;\n \
  \   }\n    public void area() {\n        // 圆形的实现\n    }\n}\n```\n\n\n\n\n\n```java\n\
  30 System.out.println(\"Area of Circle is = \" + (Math.PI*radius));\n31 }\n32 }\n\
  33 class ShapeEx\n{\n35 public static void main(String[] args)\n{\n37 Shape s;\n\
  38 Square r = new Square(10,20);\n39 s = r;\n40 s.area();\n41 Circle c = new Circle(5);\n\
  42 s = c;\n43 s.area();\n44 }\n```\n**输出：**\nArea of Square is = 200.0\nArea of\
  \ Circle is = 15.707963267948966\n\n### 示例 21.3 : SuperClass3.java\n```java\n01\
  \ package ch21;\n02\n03 class SuperClass3\n{\n05 void Message1()\n{\n07 System.out.print(\"\
  Hello\");\n08 }\n09 }\n10\n11 class SubClass extends SuperClass3\n{\n13 public void\
  \ Message1()\n{\n15 System.out.print(\"Welcome\");\n16 }\n17 }\n18\n19 class SubClass3\
  \ extends SuperClass3\n{\n21 public void Message1()\n{\n23 System.out.print(\"Hi\"\
  );\n24 }\n25\n26 }\n27 class Demo\n{\n29 public static void main(String args[])\n\
  {\n31 SuperClass3 ref; // 了一个名为 SuperClass3 的引用变量\n32 SubClass3 obj = new SubClass3();\n\
  33 ref = obj;\n34 ref.Message1();\n35 }\n36 }\n```\n**输出：** Hi\n\n### 解析\n- `SuperClass3`\
  \ 类引用变量可以指向一个 `SubClass3` 类对象！\n- `SuperClass3 ref` 告诉我们 `ref` 变量的数据类型是 `SuperClass3`。因此，我们可以使用\
  \ `ref` 变量来引用一个 `SuperClass3` 对象，所示：`obj = new SubClass3();`。\n- `SuperClass3` 类也被用作\
  \ `SubClass3` 类的父类。\n\n***\n\n## 多态与动态绑定\n运行时多态（Runtime Polymorphism）是一个过程，其中重写方法的调用在运行时解析，而不是在编译时解析。在这个过程中，通过父类的引用变量调用被重写的方法。当父类的引用变量指向子类的对象时，这种现象被称为向上转型（UpCasting）。\n\
  \n##### 示例 21.4\n```java\n01 class X{}\n02 class Y extends X{}\n03\n04 // 向上转型\n\
  05 X x = new Y();\n```\n插图![](img/Image00137.jpg](Image00137.jpg)\n\n当父类变量引用一个子类对象时，存在一个潜在问题。如果子类重写了父类中的一个方法，并且变量调用了该方法怎么办？变量是调用父类方法的版本，还是子类方法的版本？\n\
  \n将方法调用与正确的方法定义相匹配的过程被称为绑定（binding）。当变量包含一个多态引用时，Java 执行动态绑定或晚绑定。这意味着 Java 虚拟机在运行时根据变量引用的对象类型来决定调用哪个方法。因此，是对象的类型决定了调用哪个方法，而不是变量的类型。请考虑下面的示例。\n\
  \n##### 示例 21.5 : Polymorphic.java\n```java\n01 package ch21;\n02\n03 class Car\n\
  {\n04 void run()\n{\n06 System.out.println(\"running\");\n07 }\n08\n09 class Splender\
  \ extends Car\n{\n11 void run()\n{\n13 System.out.println(\"Running safely with\
  \ 60km\" );\n14 }\n15\n16 public static void main(String args[])\n{\n18 Car b =\
  \ new Splender();// 向上转型\n19 b.run();\n20 }\n21 }\n```\n**输出：** Running safely with\
  \ 60km\n\n***\n\n#### instanceof 运算符\nJava 中有一个名为 `instanceof` 的运算符，你可以用它判断一个对象是否是特定类的实例。\n\
  \n**使用 `instanceof` 运算符的表达式通用形式：**\n`refVar instanceof ClassName`\n\n**解析**\n- `refVar`\
  \ - 是引用变量。\n- `ClassName` - 是类名。\n\n这是一个布尔表达式的形式，如果 `refVar` 引用的对象是 `ClassName`\
  \ 的实例，则该表达式返回 `true`。否则，表达式返回 `false`。\n\n##### 示例 21.6\n以下代码中的 `if` 语句判断引用变量 `one`\
  \ 是否引用一个 `ClassOne` 对象。\n```java\n01 ClassOne one = new ClassOne();\n02 if (one\
  \ instanceof ClassOne)\n{\n04 System.out.println(\"Yes, one is a ClassOne\" );\n\
  05 }\n06 else\n{\n08 System.out.println(\"No, one is not a ClassOne\" );\n09 }\n\
  ```\n\n##### 示例 21.7\n```java\n01 ClassTwo two = new ClassTwo(20, 2);\n02 if (two\
  \ instanceof ClassTwo)\n03 System.out.println(\"Yes, two is a ClassTwo\" );\n04\
  \ else\n05 System.out.println(\"No, two is not a ClassTwo\" );\n```\n即使 `two` 引用的对象是\
  \ `ClassTwo` 的实例，该代码也会显示“Yes, two is a ClassTwo”。***\n\n## 总结\n- `SuperClass3` 类引用变量可以指向\
  \ `SubClass3` 类对象。\n- 运行时多态是一个过程，其中重写方法的调用在运行时解析，而不是在编译时解析。\n- 当父类的引用变量指向子类的对象时，被称为向上转型。\n\
  - 将方法调用与正确的方法定义相匹配的过程被称为绑定。\n- 当变量包含一个多态引用时，Java 执行动态绑定或晚绑定。\n- 这意味着 Java 虚拟机在运行时根据变量引用的对象类型来决定调用哪个方法。\n\
  - 因此，是对象的类型决定了调用哪个方法，而不是变量的类型。\n- `instanceof` 运算符用于判断一个对象是否是特定类的实例。\n\n## 第 22\
  \ 章\n\n### 抽象类与接口\n### 抽象类与抽象方法\n抽象类不能实例化，其他类继承它。抽象方法没有方法体，必须在子类中被重写。\n\n**抽象方法的语法：**\n\
  `abstract ReturnType MethodName(ParameterList);`\n\n**抽象类的语法：**\n`abstract class\
  \ ClassName`\n\n- 当抽象方法出现在类中时，必须在子类中重写。\n- 如果子类未能重写该方法，将产生错误。\n- 抽象类本身不能实例化，而是作为父类使用。\n\
  - 抽象类表示所有继承它的类的通用形式。\n\n##### 示例 22.1 : Student.java\n```java\n01 package ch22;\n\
  02\n03 abstract class Student\n{\n05 private String name; // 学生名\n06 private String\
  \ idNo; // 学生 ID\n07 public Student(String n, String id)\n{\n09 name = n;\n10 idNo\
  \ = id;\n11 }\n12 public String toString()\n{\n14 String str;\n15\n16 str = \"Name:\
  \ \" + name +\n17 \"\\nID Number: \" + idNo;\n18 return str;\n19 }\n20 abstract\
  \ int getRemainingHours();\n21 }\n```\n**解析**\n- 抽象类 `student` 持有所有学生共有的数据，但不包含特定专业所需的所有数据。\n\
  - `student` 类包含姓名、学号和入学年份的字段。它还拥有构造函数、`toString` 方法和一个抽象方法 `getRemainingHours`。\n\
  - 这个抽象方法必须在继承 `Student` 类的类中被重写。该方法的意图是返回学生在该专业内还需要修的学分。\n\n##### 示例 22.2 : CompStudent.java\n\
  ```java\n01 package ch22;\n02\n03 class CompStudent extends Student\n{\n05 // 要求学分\n\
  06 private final int OS_HOURS = 40; // 操作系统学分\n07 private final int DB_HOURS = 60;\
  \ // 数据库学分\n08\n09 // 已修学分\n10 private int osHours; // 已修的操作系统学分\n11 private int\
  \ dbHours; // 已修的数据库学分\n12 public CompStudent(String n, String id)\n{\n14 super(n,\
  \ id);\n15\n16 }\n17 public void setOsHours(int os)\n{\n19 osHours = os;\n20 }\n\
  21 public void setDbHours(int db)\n{\n23 dbHours = db;\n24 }\n```\n\n\n\n```java\n\
  public int getRemainingHours()\n{\n    int reqHours, // 总需小时数\n    int remainingHours;\
  \ // 剩余小时数\n\n    // 计算所需的小时数。\n    reqHours = OS_HOURS + DB_HOURS; // 100\n\n \
  \   // 计算剩余小时数。\n    remainingHours = reqHours - (osHours + dbHours);\n\n    return\
  \ remainingHours;\n}\n\npublic String toString()\n{\n    String str;\n\n    str\
  \ = super.toString() +\n        \"\\nMajor: Computer Science\" +\n        \"\\nOperating\
  \ System Hours Taken: \" + osHours +\n        \"\\nDatabase Hours Taken: \" + dbHours;\n\
  \n    return str;\n}\n```\n\n### 解析\n\n- 计算机学生修读的课程与生物学生修读的课程不同。\n- 理所当然，`CompStudent`\
  \ 类计算剩余小时数的方法与 `BilogyStudent` 类不同。\n- `CompStudent` 类继承自 `Student` 类，声明了以下 final\
  \ 整数字段：`OS_HOURS` 和 `DB_HOURS`。这些字段存储了计算机科学学生所需的操作系统小时数和数据库小时数。\n- 它还声明了以下字段：`osHours`、`dbHours`。这些字段存储了学生已修的操作系统小时数和数据库小时数。\n\
  - 提供了修改器方法（Mutator methods）用于在这些字段中存储值。\n- 此外，类重写了 `toString` 方法以及抽象方法 `getRamainningHours`。\n\
  \n`CompStudentDemo` 实现了 `CompStudent.java`。示例 22.3：`CompStudentDemo.java`\n\n```java\n\
  package ch22;\n\npublic class CompStudentDemo\n{\n    public static void main(String[]\
  \ args)\n    {\n        // 创建 CompStudent 对象。\n        CompStudent csStudent = new\
  \ CompStudent(\"Mohammed Mansour\", \"92500000\");\n\n        // 存储 OS 和 DB 小时的值。\n\
  \        csStudent.setOsHours(20);\n        csStudent.setDbHours(35);\n\n      \
  \  // 显示学生数据。\n        System.out.println(csStudent);\n\n        // 显示剩余小时数。\n \
  \       System.out.println(\"Hours remaining: \" + csStudent.getRemainingHours());\n\
  \    }\n}\n```\n\n输出(CompStudentDemo.java)\n```text\nName: Mohammed Mansour\nID\
  \ Number: 92500000\nYear Admitted: 2005\nMajor: Computer Science\nOperating System\
  \ Hours Taken: 20\nDatabase Hours Taken: 35\nHours remaining: 45\n```\n\n记住关于抽象方法和类的以下几点：\n\
  \n- 抽象方法和抽象类使用 `abstract` 关键字定义。\n- 抽象方法没有方法体，其头部必须以分号结束。\n- 抽象方法必须在子类中被重写。\n- 当一个类包含抽象方法时，该类不能被实例化。它必须作为父类。\n\
  \n### 接口 (Interfaces)\n\n接口指定了类的行为。接口类似于包含所有抽象方法的抽象类。它不能被实例化，且接口中列出的所有方法必须在其他地方编写。接口的目的是指定类的行为。\n\
  \n#### 语法\n```java\npublic interface InterfaceName\n{\n    (方法头部...)\n}\n```\n接口看起来与类相似，不同之处在于使用\
  \ `interface` 关键字代替 `class` 关键字，并且接口中指定的方法没有方法体，只有以分号结尾的头部。此外，方法头部不使用访问修饰符，因为接口中指定的所有方法都是公共的（public）。\n\
  \n为了让类使用接口，它必须实现该接口。这通过 `implements` 关键字来实现。例如（`MyClass.java`）：\n\n```java\npublic\
  \ class MyClass implements MyInterface\n{\n    . . .\n}\n```\n实现接口的类必须提供接口中列出的所有方法，且具有完全相同的的方法签名和相同的返回类型。“接口仅指定了这些方法的头部，而不规定这些方法应该做什么。”\n\
  \n#### 接口中的字段\n接口可以包含字段声明，但接口中的所有字段都被视为 `final`（常量）和 `static`（静态）。由于它们会自动变为 `final`，你必须提供一个初始化值。\n\
  \n#### 接口定义（示例）\n示例 22.5：接口定义\n```java\npublic interface Double\n{\n    int FIELD1\
  \ = 1;\n    int FIELD2 = 2;\n    (方法头部...)\n}\n```\n`FIELD1` 和 `FIELD2` 是 `final\
  \ static int` 变量。任何实现此接口的类都可以访问这些变量。\n\n#### 实现多个接口\n为什么我们既需要抽象类又需要接口，尽管它们非常相似。原因是类只能继承一个父类，但\
  \ Java 允许一个类实现多个接口。当一个类实现多个接口时，它必须提供所有这些接口指定的方法。要在类定义中指定多个接口，只需在 `implements` 关键字之后列出接口名称，并用逗号隔开即可。\n\
  \n示例：实现多个接口的类示例的第一行\n```java\npublic class MyClass implements interface1, interface2,\
  \ interface3\n```\n该类实现了三个接口：`Interface1`、`Interface2`、`Interface3`。\n\n#### 多态与接口\n\
  就像创建类类型的引用变量一样，Java 允许你创建接口类型的引用变量。接口引用变量可以引用任何实现了该接口的对象，无论其类类型如何。\n\n示例 22.6：`RetailItems.java`\
  \ - 多态的另一个示例\n```java\npublic interface RetailItem\n{\n    double getRemainingPrice();\n\
  }\n```\n该接口指定了一个方法：`getRemainingPrice`。`Book` 类实现了此接口。\n\n示例 22.7：`Book.java`\n\
  ```java\npublic class Book implements RetailItem\n{\n    private String title; //\
  \ Book 的标题\n    private String author; // Book 的作者\n    private double remainingPrice;\
  \ // Book 的剩余价格\n\n    public Book(String bookTitle, String bookAuthor, double bookPrice)\n\
  \    {\n        title = bookTitle;\n        author = bookAuthor;\n        remainingPrice\
  \ = bookPrice;\n    }\n\n    public String getTitle()\n    {\n        return title;\n\
  \    }\n\n    public String getAuthor()\n    {\n        return author;\n    }\n\n\
  \    public double getRemainingPrice()\n    {\n        return remainingPrice;\n\
  \    }\n}\n```\n\n`MainDemo` 实现了 `RetailItems` 接口。\n\n示例 22.9：`MainDemo.java`\n\
  ```java\npackage ch22;\n\nimport java.text.DecimalFormat;\n\npublic class MainDemo\n\
  {\n    public static void main(String[] args)\n    {\n        // 创建一个 Book 对象。\n\
  \        Book bo = new Book(\"Learn Java\", \"Mohammed Mansour\", 19.95);\n\n  \
  \      // 使用 RetailItem 引用变量引用 Book 对象。\n        RetailItem bi = new Book(\"Learn\
  \ Java\", \"Mohammed Mansour\", 19.95);\n\n        // 显示书籍的作者\n        System.out.println(\"\
  Author: \" + bi.getAuthor());\n\n        // 显示 Book 的标题。\n        System.out.println(\"\
  Item #1: \" + bi.getTitle());\n\n        // 显示书籍的价格。\n        System.out.println(\"\
  Price: $\" + bi.getRemainingPrice());\n    }\n}\n```\n输出(MainDemo.java)\n```text\n\
  Author: Mohammed Mansour\nItem #1: Learn Java\nPrice: $19.95\n```\n\n由于 `Book` 类实现了\
  \ `RetailItem` 接口，该类对象可以使用 `RetailItem` 引用变量引用。例如\n```java\nRetailItem bi = new\
  \ Book (\"Learn Java\", \"Mohammed Mansour\", 19.95);\n```\n解析\n\n- 声明了 `RetailItem`\
  \ 引用变量 `bi`。\n- `bi` 变量引用了一个书籍对象。这是可能的因为 `Book` 类实现了 `RetailItem` 接口。\n- 当一个类实现接口时，就会建立一种称为接口继承的继承关系。\n\
  \n由于这种继承关系，`Book` 对象是一个 `RetailItem`。因此，我们可以创建 `RetailItem` 引用变量并让它们引用 `Book` 对象。使用接口引用变量有一些局限性\n\
  \n- 你不能实例化接口。\n\n当接口变量引用对象时，你只能使用该接口变量调用接口中指定的方法。这里有一个简单的示例。\n示例 22.10：`MainDemo.java`\
  \ - 使用 `RetailItem` 变量引用 Book 对象\n```java\nBook bo = new Book(\"Learn Java\", \"\
  Mohammed Mansour\", 19.95);\n```\n\n\n\n\n```java\nRetailItem item = new Book(\"\
  Learn Java\", \"Mohammed Abdelmoniem\", 19.95);\n\n// 调用 getRetailPrice 方法\n\nSystem.out.println(item.getRetailPrice());\
  \ // 可以，这可以工作\n\n// 尝试调用 getTitle 方法\n\nSystem.out.print(item.getTitle()); // 错误！无法编译\n\
  ```\n\n最后一行代码将无法编译，因为 `RetailItem` 接口只指定了一个方法：`getRetailPrice`。因此，我们不能使用 `RetailItem`\
  \ 引用变量来调用任何其他方法。\n\n提示：可以将接口引用变量强制转换为它所引用的对象的类型，然后调用该类型的成员方法。然而，这种语法有些笨拙。导致编译错误的语句可以重写为：`((Book)item).getTitle();`\n\
  \n## 总结\n\n- `抽象类`不能被实例化，但类可以扩展它。\n- `抽象方法`没有方法体，必须在子类中被重写。\n- `抽象方法`是出现在父类中的方法，期望在子类中被重写。\n\
  - `抽象方法`只有方法头没有方法体。\n- 当 `抽象方法`出现在类中时，必须在子类中被重写。如果子类未能重写该方法，将产生错误。\n- `抽象方法`用于确保子类实现了该方法。\n\
  - 当类包含`抽象方法`时，无法创建该类的实例。\n- `抽象方法`通常在`抽象类`中使用。\n- `抽象类`不能被实例化，但作为其他类的父类。\n- `抽象类`代表了继承它的类的通用或抽象形式。\n\
  - `抽象方法`和`抽象类`是通过使用 `abstract` 关键字定义的。\n- `抽象方法`没有方法体，其方法头必须以分号结束。\n- `接口`类似于`抽象类`，拥有所有`抽象方法`。它不能被实例化，且`接口`中列出的所有方法必须在别处写出。`接口`的目的是为类指定行为。\n\
  - `接口`可以包含字段声明，但`接口`中的所有字段都是`final`  `static` 的。由于它们自动变为 `final`，你必须提供初始化值。\n- Java\
  \ 允许你创建`接口` 类型的引用变量。`接口引用变量`可以引用任何实现该接口的对象，无论其类类型。\n- `接口`看起来和`class`相似，只是使用 `interface`\
  \ 关键字代替了 `class`，且`接口`中指定的方法没有方法体，只有分号。\n- 实现`接口`的类必须提供`接口`中列出的所有方法，且具有相同的签名。`接口`只指定这些方法的（头，没有指定方法应该做什么。\n\
  \n## 第 23 章：异常\n\n### 引言\n\n### 什么是异常？\n异常是程序执行过程中发生的意外事件。当`异常`发生时，它会中断程序的正常流程。为了防止程序崩溃，必须编写检测并处理它们的代码。当`异常`产生时，被称为被“抛出”。除非异常被应用程序检测并处理，否则会导致应用程序停止。\n\
  \n`异常处理器`是响应被抛出的`异常`的代码段。解释和响应`异常`的过程被称为`异常处理`。为了检测已抛出的`异常`并防止应用程序停止，Java 允许你创建`异常处理器`。\n\
  \n如果你的代码没有处理被抛出的`异常`，默认`异常处理器`会处理它。默认`异常处理器`打印错误信息并导致程序崩溃。这是一个简单的示例：\n\n### 示例 23.1：ArrayError.java\n\
  ```java\n01 public class ArrayError\n02 {\n03 public static void main(String[] args)\n\
  04 {\n05 // 创建一个有 5 元素的数组。\n06 int[] numbers = { 1, 2, 3, 4, 5 };\n07\n08 // 尝试读取范围之外的\n\
  09 // 数组\n10 for (int i = 0; i <= 5; i++)\n11 System.out.println(numbers[i]);\n\
  12 }\n13 }\n```\n**输出**\n```\n1\n2\n3\n4\n5\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException:\
  \ 5\nat ArrayError.main(ArrayError.java:13)\n```\n\n### 解析\n- 程序尝试读取数组范围之外。`numbers`数组只有五个元素，下标为到\
  \ 4。\n- 程序在尝试读取 `numbers[5]` 时崩溃，并显示了类似于程序末尾显示的错误消息。\n- 此消息表示发生了`异常`，并提供了关于它的信息。\n\
  开发者必须检查异常并编写代码处理它们。\n\n### 处理异常\n\n在捕获`异常`之前，某些代码必须抛出（raise）一个。任何代码都可以抛出`异常`：你的代码、别人编写的代码。无论是什么抛出了`异常`，它总是通过\
  \ `throw` 语句抛出的。\n\n可能抛出某些异常的代码必须由以下之一包含：\n- 使用 `try-catch`。\n- 使用 `throws` 关键字。\n\
  \n### 使用 try 语句捕获并处理异常\n本节介绍了如何使用三个异常处理器组件——`try`、`catch` 和 `finally` 块来编写异常处理器。`Try\
  \ 和 catch` 意味着尝试一段代码，如果发生错误，就捕获它。\n\n**语法**\n```\n01 try\n02 {\n03 (try block...)\n\
  04 }\n```\n\n**解析**\n- **第 01 行**：出现 `try` 关键字。\n- **第 02-04 行**：括号内出现了一块代码，括号是必须的。这段代码被称为`try\
  \ 块`。`try 块`是执行并可能抛出异常的一个或多个语句。你可以认为`try 块`中的代码是受“保护”的，因为如果`try 块`抛出异常，应用程序不会停止。\n\
  - **第 05 行**：出现`catch 句`。`catch 句`以 `catch` 关键字开头，后面跟着代码 `(ExceptionType parameterName)`。这是一个参数变量声明，其中\
  \ `ExceptionType` 是异常类的名称，`parameterName` 是变量名。如果`try 块`中的代码抛出了 `ExceptionType`\
  \ 类的异常，则参数变量将引用异常对象。此外，执行紧跟在 catch 句后面的代码。\n- **第 06-08 行**：紧跟在 catch 句后面的代码被称为`catch\
  \ 块`。再次，括号是必须的。\n\n让我们尝试理解一下如果不使用`try-catch 块`会出现什么问题。\n\n### 示例 23.2：WithoutTry.java\
  \ - 不使用 try 语句\n```java\n01 import java.util.*;\n02\n03 public class WitoutTry{\n\
  04 public static void main(String[] args){\n05 Scanner input = new Scanner(System.in);\n\
  06\n07 System.out.println(\"Enter Your First NO: \");\n08 int number1 = input.nextInt();\n\
  09\n10 System.out.println(\"Enter Your Second NO: \");\n11 int number2 = input.nextInt();\n\
  12\n13 int sum = number1/number2;\n14 System.out.println(sum);\n15 }\n16 }\n```\n\
  **输出**\n```\nEnter Your First NO:\n12\nEnter Your Second NO:\n0\nException in thread\
  \ \"main\" java.lang.ArithmeticException: / by zero\nat Ex1.ex1.main(ex1.java:14)\n\
  C:\\Users\\HP\\AppData\\Local\\NetBeans\\Cache\\8.2\\executor-snippets\\run.xml:53:\
  \ Java returned: 1\nBUILD FAILED (total time: 7 seconds)\n```\n除以零会给你一个异常，所以这关闭了整个程序。让我们通过使用\
  \ Java `try-catch 块` 来解决上述问题。\n\n### 示例 23.3：WithTry.java - 使用 try-catch 语句\n```java\n\
  01 import java.util.*;\n02\n03 public class WithTry{\n04 public static void main(String[]\
  \ args){\n05 Scanner input = new Scanner(System.in);\n06\n07 System.out.println(\"\
  Enter Your First NO: \");\n08 int number1 = input.nextInt();\n09\n10 System.out.println(\"\
  Enter Your Second NO: \");\n11 int number2 = input.nextInt();\n12\n13 try {\n14\
  \     int sum = number1/number2;\n15     System.out.println(\"Sum is: \" + sum);\n\
  16 } catch (ArithmeticException e) {\n17     System.out.println(\"Error occurred:\
  \ \" + e.getMessage());\n18 }\n19 }\n20 }\n```\n*(注：由于原文文本在示例 23.3 处不完整，此处根据常见逻辑补全了代码示例结构)*\n\
  \n\n\n\n\n## WithTry 类\n\n```java\npublic class WithTry {\n    public static void\
  \ main(String[] args){\n        Scanner input = new Scanner(System.in);\n\n    \
  \    try {\n            System.out.println(\"Enter Your First NO: \");\n       \
  \     int number1 = input.nextInt();\n\n            System.out.println(\"Enter Your\
  \ Second NO: \");\n            int number2 = input.nextInt();\n\n            int\
  \ sum = number1/number2;\n            System.out.println(sum);\n        } catch\
  \ (Exception e){\n            System.out.println(\"Error!\");\n        }\n     \
  \   System.out.println(\"Out of Try catch statement\");\n    }\n}\n```\nOutput:\n\
  Enter Your First NO: 12\nEnter Your Second NO: 0\nError!\nOut of Try catch statement\n\
  \n记住 `try` 后面总是需要跟一个 `catch`。我们将捕获所有的错误（异常）。参数 `Exception` 意味着捕获所有异常。这意味着如果用户发生了任何错误，都会被捕获。\n\
  \n## 使用 `throws` 子句捕获和处理异常\n\nJava `throws` 关键字用于声明在 `METHOD EXECUTION`（方法执行）期间可能发生的异常列表。该方法的\
  \ `CALLER`（调用者）必须使用 `try-catch` 块来处理异常。\n\n语法：\n`<return type> method_name (parameters\
  \ if any) throws type_of_exception_list;`\n(`type_of_exception_list` 是方法可能抛出的所有异常的逗号分隔的列表)\n\
  \n语法：\n```java\npublic static void method() throws FileNotFoundException , ConnectException\
  \ {\n    // Code\n}\n```\n\n在程序中，如果存在抛出异常的可能性，编译器总是向我们警告，并且我们必须处理该异常，否则将得到编译时错误。为了理解什么是异常，请考虑以下代码。\n\
  \n### 示例 23.4 : ThrowEx1.java - 未处理异常时的错误\n```java\npublic class ThrowEx1{\n   \
  \ public static void main(String[] args){\n        Thread.sleep(10000);\n      \
  \  System.out.println(\"Welcome\");\n    }\n}\n```\nOutput:\nError: line (5)\njava:\
  \ unreported exception `java.lang.InterruptedException`; must be caught or declared\
  \ to be thrown\n\n#### 解释\n* 在之前的示例中，我们得到了编译时错误，是因为当 `main` 方法进入睡眠状态时可能会发生异常；其他线程有机会执行\
  \ `main()` 方法，这将会导致 `InterruptedException`。\n\n让我们通过使用 Java `throws` 关键字来解决上一个示例。\n\
  \n### 示例 23.5 : ThrowEx2.java - 使用 throws\n```java\npackage ch23;\n\npublic class\
  \ ThrowEx2 {\n    public static void main(String[] args) {\n        try {\n    \
  \        // Thread.sleep(10000);\n            method();\n            System.out.println(\"\
  Welcome\");\n        } catch(InterruptedException e){\n            // code\n   \
  \     }\n    }\n    public static void method() throws InterruptedException {\n\
  \        Thread.sleep(10000);\n    }\n}\n```\nOutput:\nWelcome\n\n#### 解释\n* 在上面的程序中，通过使用\
  \ `throws` 关键字，我们处理了 `InterruptedException` 并得到了输出 `Welcome`。\n* Java `throws` 关键字用于声明方法执行期间可能发生的异常列表（在我们例中为\
  \ `InterruptedException` 异常）。\n* `method` 的 `caller`（`main` 方法）必须使用 `try-catch`\
  \ 块来处理异常。\n\n## 异常传播\n\n异常从方法传播到方法，沿着调用栈向上传播，直到它被捕获。因此，如果 `main()` 调用了 `method()`，并且\
  \ `method()` 抛出了异常，异常将从 `method()` 传播到 `main()` 方法，除非这些方法中的一个捕获了异常——在我们例中是 `main`\
  \ 方法。\n\n假设如果 `one()` 调用 `two()`，`two()` 调用 `three()`，`three()` 调用 `four()`，如果 `four()`\
  \ 抛出了异常，异常将从 `four()` 传播到 `three()`、到 `two()`、到 `one()`，除非这些方法中的任何一个捕获了异常。\n\n当找到适当的处理器（`catch`\
  \ 块）时（在我们例中是 `main` 方法），运行时系统会将异常传递给处理器。如果没有找到异常处理器，异常将到达 `JVM` 的默认异常处理器，该处理器会将异常详情打印到日志并终止应用程序。\n\
  \n### 关于 `throws` 关键字的记忆要点\n* `throws` 关键字仅用于说服编译器，且使用 `throws` 关键字不会阻止程序的终止。\n\
  * 借助 `throws` 关键字，我们可以向方法的调用者提供有关异常的信息。\n\n**注意**：不要将 `throw` 语句与 `throws` 子句混淆。`throw`\
  \ 语句导致异常被抛出。`throws` 子句告知编译器某个方法抛出一个或多个异常。\n**注意**：我们可以使用 `throws` 子句声明受检异常和未检异常。但调用给定方法的方法必须处理受检异常。\n\
  \n### 使用 `throw` 语句抛出异常\n\n在 Java 异常处理中，`throw` 关键字用于从方法或构造函数抛出异常。\n\n### `throw`\
  \ 语句的语法\n`throw new ExceptionType (MessageString);`\n\n语法 2：\n```java\npublic void\
  \ method() {\n    // 抛出一个异常\n    throw new SomeException(\"Message\");\n}\n```\n\
  \n#### 解释\n* 如果我们使用 `throw` 语句抛出异常，我们必须在 `catch` 块中处理该异常，或者使用 `throws` 显式声明。\n*\
  \ `throw` 语句会导致异常对象的创建并抛出。\n* `ExceptionType` 是异常类名。\n* `MessageString` 是传递给异常对象的可选\
  \ `String` 参数。\n* `MessageString` 参数包含自定义消息，可以从异常对象的 `getMessage` 方法检索。\n* 如果你不向构造函数传递消息，异常的消息将为\
  \ null。\n\n这里有一个演示使用 `throw` 的简单示例。\n\n### 示例 23.6 : ThrowExcep.java\n```java\n\
  public class ThrowExcep {\n    static void test() {\n        try {\n           \
  \ throw new NumberFormatException(\"demo\");\n        } catch (NumberFormatException\
  \ e){\n            System.out.println(\"Caught inside test.\");\n            throw\
  \ e; // 抛出异常\n        }\n    }\n    public static void main(String[] args) {\n \
  \       try {\n            test();\n        } catch (NumberFormatException e){\n\
  \            System.out.println(\"Caught in main\");\n        }\n    }\n}\n```\n\
  Output:\nCaught inside test.\nCaught in main\n\n#### 解释\n* 执行 `throw` 语句后程序的执行流立即停止，并检查最近的\
  \ `try` 块以查看它是否有匹配异常异常的 `catch` 语句。如果找到匹配项，控制将转移到该语句，否则检查下一个嵌套的 `try` 块，依此类推。如果没有找到匹配的\
  \ catch，默认处理器将停止程序。\n\n## 查找异常详情\n\n在 Java 中有三种查找异常详情的方法。它们是：\n* 使用 `java.lang.Exception`\
  \ 类对象。\n* 使用 `public void print()` 方法。\n* 使用 `public string getMessage()` 方法。\n\n\
  ### 使用 `java.lang.Exception` 类对象\n`Exception` 类对象会打印异常名称和消息的性质。\n\n### 示例 23.7 :\
  \ Try1.java\n```java\npublic class Try1 {\n    public static void main(String[]\
  \ args){\n        try {\n            double x = Double.parseDouble(\"100.00y\");\n\
  \        } catch (Exception e) {\n            System.out.println(e);\n        }\n\
  \    }\n}\n```\n\n\n\n\n\n## 异常处理\n\n### 输出\n`java.lang.NumberFormatException: For\
  \ input string: \"100.00y\"`\n\n#### 解释\n- `java.lang.NumberFormatException`: 异常名称\n\
  - `For input String 100.00y`: 消息的性质\n\n## 使用 printStackTrace 方法\n该方法定义在 `java.lang.Throwable`\
  \ 类中，并被 `java.lang.Error` 类和 `java.lang.Exception` 类继承。此方法将显示异常名称、消息的性质以及异常发生的行号。这里是一个简单的示例。\n\
  \n#### 示例 23.8 : Try2.java\n```java\n01 public class Try2 {\n02 public static void\
  \ main(String[] args){\n03 try {\n04 double x = Double.parseDouble(\"100.00y\");\n\
  05 } catch (Exception e) {\n06 e.printStackTrace();\n07 }\n08 }\n09 }\n```\n###\
  \ 输出\n`java.lang.NumberFormatException: For input string: \"100.00y\"`\n`at java.base/jdk.internal.math.FloatingDecimal.readJavaFormatString(FloatingDecimal.java:2054)`\n\
  `at java.base/jdk.internal.math.FloatingDecimal.parseDouble(FloatingDecimal.java:110)`\n\
  `at java.base/java.lang.Double.parseDouble(Double.java:543)`\n`at ch23.Try2.main(Try2.java:6)`\n\
  \n#### 解释\n- `java.lang.NumberFormatException`: 异常名称\n- `For input String 100.00y`:\
  \ 消息的性质\n\n## 使用 getMessage 方法\n该方法定义在 `java.lang.Throwable` 类中，并同时被 `Error` 和 `Exception`\
  \ 类继承。此方法仅显示消息的性质。这里是一个简单的示例。\n\n#### 示例 23.9 : Try3.java\n```java\n01 public class\
  \ Try3 {\n02 public static void main(String[] args) {\n03 try {\n04 double x = Double.parseDouble(\"\
  100.00y\");\n05 } catch (Exception e) {\n06 System.out.println(e.getMessage());\n\
  07 }\n08 }\n09 }\n```\n### 输出\n`For input string: \"100.00y\"`\n\n---\n\n## 异常的多态引用\n\
  回想之前的课程，父类类型的引用变量可以引用子类对象。这被称为多态。在处理异常时，你可以将多态引用作为 `catch` 句的参数。例如：我们处理过的所有异常都继承自\
  \ `Exception` 类。因此，一个使用 `Exception` 类型参数变量的 `catch` 句能够捕获任何继承自 `Exception` 类的异常。请考虑下方的示例。\n\
  \n#### 示例 23.10 : ParseIntError.java\n```java\n01 package ch23;\n02\n03 import java.util.Scanner;\n\
  04\n05 public class ParseIntError {\n06 public static void main(String[] args) {\n\
  07 Scanner sc = new Scanner(System.in);\n08 System.out.println(\"Enter Yor Number\"\
  );\n09 String input = sc.nextLine();\n10 try\n11 {\n12 Integer number = Integer.parseInt(input);\n\
  13 System.out.println(\"The Result is \" + number/0);\n14 }\n15 catch (Exception\
  \ e)\n16 {\n17 System.out.println(\"Conversion error: \" + e.getMessage());\n18\
  \ }\n19 }\n20 }\n```\n### 输出\n`Enter Yor Number`\n`8`\n`Conversion error: / by zero`\n\
  \n`Integer` 类的 `parseInt` 方法抛出了一个 `NumberFormatException` 对象，这段代码仍然有效，因为 `NumberFormatException`\
  \ 类继承自 `Exception` 类。\n\n---\n\n## 处理多个异常\n到目前为止我们学习的程序只测试了单一类型的异常。但在许多情况下，`try`\
  \ 块中的代码能够抛出 hơn 一种类型的异常。在这种情况下，你需要为每种可能被抛出的异常类型编写一个 `catch` 句。这里是一个简单的示例。\n\n####\
  \ 示例 23.11 : MultiExcp.java\n```java\n01 public class MultiExcp {\n02 public static\
  \ void main(String[] args){\n03 try{\n04 int arr[] = new int[10];\n05 arr[3] = 10/0;\n\
  06 System.out.println(\"Try Block Statement\");\n07 } catch (ArithmeticException\
  \ e) {\n08 System.out.println(\"Divide By Zero Error Encountered\");\n09 } catch\
  \ (ArrayIndexOutOfBoundsException e){\n10 System.out.println(\"Access Array Beyond\
  \ the Limit\");\n11 } catch (Exception e) {\n12 System.out.println(\"Other Exception\"\
  );\n13 }\n14 System.out.println(\"Out of the try-catch\");\n15 }\n16 }\n```\n###\
  \ 输出\n`Divide By Zero Error Encountered`\n`Out of the try-catch`\n\n在上面的示例中，第一个\
  \ `catch` 块被执行，是因为我们在 `try` 块中写的代码抛出了 `ArithmeticException`（因为我们将数字除以零）。现在稍微修改一下代码看看输出的变化。\n\
  \n#### 示例 23.12 : MultiExcp.java\n```java\n01 public class MultiExcp {\n02 public\
  \ static void main(String[] args){\n03 try{\n04 int arr[] = new int[10];\n05 arr[3]\
  \ = 10/0;\n06 System.out.println(\"Try Block Statement\");\n07 } catch (ArithmeticException\
  \ e) {\n08 System.out.println(\"Divide By Zero Error Encountered\");\n09 } catch\
  \ (ArrayIndexOutOfBoundsException e){\n10 System.out.println(\"Access Array Beyond\
  \ the Limit\");\n11 } catch (Exception e) {\n12 System.out.println(\"Other Exception\"\
  );\n13 }\n14 System.out.println(\"Out of the try-catch\");\n15 }\n16 }\n```\n在上面的示例中，第一个\
  \ `catch` 块被执行，是因为我们在 `try` 块中写的代码抛出了 `ArithmeticException`（因为我们将数字除以零）。现在稍微修改一下代码看看输出的变化。\n\
  \n#### 示例 23.12 : MultiExcp2.java\n```java\n01 public class MultiExcp2 {\n02 public\
  \ static void main(String[] args) {\n03 try{\n04 int arr[] = new int[10];\n05 arr[12]\
  \ = 10/0;\n06 System.out.println(\"Try Block Statement\");\n07 } catch (ArithmeticException\
  \ e) {\n08 System.out.println(\"Divide By Zero Error Encountered\");\n09 } catch\
  \ (ArrayIndexOutOfBoundsException e){\n10 System.out.println(\"Access Array Beyond\
  \ the Limit\");\n11 } catch (Exception e) {\n12 System.out.println(\"Other Exception\"\
  );\n13 }\n14 System.out.println(\"Out of the try-catch\");\n15 }\n16 }\n```\n###\
  \ 输出\n`Access Array Beyond the Limit`\n`Out of the try-catch`\n\n在这种情况下，第二个 `catch`\
  \ 块被执行，因为抛出了 `ArrayIndexOutOfBoundsException`。\n\n---\n\n## finally 子句\n`finally`\
  \ 块包含无论是否发生异常都必须执行的语句。`try` 语句可以有一个可选的 `finally` 子句。\n\n### 通用语法（带 finally 子句的 try）\n\
  ```java\n01 try\n02 (try statement...)\n03 }\n04 catch (ExceptionTypeName)\n05 {\
  \ (catch statement...)\n06 }\n07 finally\n08 {\n```\n`finally` 块在 `try` 块和任何 `catch`\
  \ 块执行完毕后总是会执行。\n\n#### 示例 23.13 : Fin.java finally 块的简单示例\n你可以看到异常发生在 `try` 块中并被\
  \ `catch` 块处理，随后执行了 `finally` 块。\n```java\n01 public class Fin {\n02 public static\
  \ void main(String[] args){\n03 try{\n04 int arr[] = new int[10];\n05 arr[12] =\
  \ 10/2;\n06 System.out.println(\"Try Block Statement\");\n07 } catch (ArithmeticException\
  \ e) {\n08 System.out.println(\"Divide Zero Error Encountered\");\n09 } catch (ArrayIndexOutOfBoundsException\
  \ e){\n10 System.out.println(\"Access Array Beyond the Limit\");\n11 } catch (Exception\
  \ e) {\n12 System.out.println(\"Other Exception\");\n13 }finally {\n14 System.out.println(\"\
  This is finally block \");\n15 }\n16 System.out.println(\"Out of the try-catch\"\
  );\n17 }\n18 }\n```\n### 输出\n`Access Array Beyond the Limit`\n`This is finally block\
  \ `\n`Out of the try-catch`\n\n### 关于 finally 块的注意事项\n- `finally` 块必须与 `try` 块关联。\n\
  - `finally` 块是可选的。\n\n`finally` 块不执行的唯一情况是遇到了 `System.exit()`。例如：\n\n#### 示例 23.14\
  \ : Fin2.java\n```java\n01 public class Fin2 {\n02 public static void main(String[]\
  \ args){\n03 try{\n04 int arr[] = new int[10];\n05 arr[12] = 10/2;\n06 System.out.println(\"\
  Try Block Statement\");\n07 } catch (ArithmeticException e) {\n08 System.out.println(\"\
  Divide Zero Error Encountered\");\n09 } catch (ArrayIndexOutOfBoundsException e){\n\
  10 System.out.println(\"Access Array Beyond the Limit\");\n11 System.exit(0);\n\
  12 } catch (Exception e) {\n13 System.out.println(\"Other Exception\");\n14 }finally\
  \ {\n15 System.out.println(\"This is finally block \");\n16 }\n17 System.out.println(\"\
  Out of the try-catch\");\n18 }\n19 }\n```\n\n\n\n\n\n# 越界访问输出数组\n\n`finally` 块会覆盖\
  \ `try` 和 `catch` 块返回的返回值。\n\n### 示例 23.15: MyFinal.java \n让我们通过一个例子来理解这一点：\n\n\
  ```java\npublic class MyFinal {\n\n    public static int myTestingMethod(){\n  \
  \      try{\n            // 代码在这里\n            return 9;\n        }finally {\n \
  \           // 代码在这里\n            return 20;\n        }\n    }\n\n    public static\
  \ void main(String[] args){\n        MyFinal my = new MyFinal();\n        int i\
  \ = my.myTestingMethod();\n        System.out.println(i);\n    }\n}\n```\n\n**输出**\n\
  20\n\n程序返回 20，因为 `try` 返回的值被 `finally` 覆盖了。\n\n***\n\n# 堆栈跟踪 (Stack Trace)\n\n通常，一个方法会调用另一个方法，该方法再调用另一个方法。例如，方法\
  \ `A` 调用方法 `B`，`B` 调用方法 `C`。\n\n### 什么是调用栈 (Call Stack)？\n\n*   调用栈是当前正在执行方法的内部列表。\n\
  *   当异常在多层方法调用下抛出时，了解是哪些方法负责该调用是很有帮助的。\n*   堆栈跟踪是调用栈中所有方法的列表。它指示了发生异常时正在执行的所有方法。\n\
  \n请考虑以下示例。\n\n### 示例 23.16: StackTrace.java\n\n```java\npublic class StackTrace\
  \ {\n\n    public static void main(String[] args) {\n        System.out.println(\"\
  Calling myMethod...\");\n        myMethod();\n        System.out.println(\"main\
  \ is done.\");\n    }\n\n    public static void myMethod() {\n        System.out.println(\"\
  Calling produceError...\");\n        produceError();\n        System.out.println(\"\
  myMethod is done.\");\n    }\n\n    public static void produceError() {\n      \
  \  String str = \"abc\";\n\n        // 以下语句会导致错误\n        System.out.println(str.charAt(3));\n\
  \        System.out.println(\"produceError is done.\");\n    }\n}\n```\n\n**输出**\n\
  ```\nCalling myMethod...\nCalling produceError...\nException in thread \"main\"\
  \ java.lang.StringOutOfBoundsException: String index out of range: 3\nat java.base/java.lang.String.charAt(String.java:44)\n\
  at java.base/java.lang.String.charAt(String.java:69)\nat ch23.StackTrace.produceError(StackTrace.java:22)\n\
  at ch23.StackTrace.myMethod(StackTrace.java:14)\nat ch23.StackTrace.main(StackTrace.java:8)\n\
  ```\n\n### 解析\n\n* 程序有三个方法：`main`、`myMethod` 和 `produceError`。\n* `main` 方法调用 `myMethod`，调用\
  \ `produceError`。\n* `produceError` 调用 `String` 类的 `charAt` 方法。\n* 异常没有由程序处理，而是由默认异常处理器处理。\n\
  * 当异常发生时，错误信息显示为产生异常方法的堆栈跟踪。\n* 堆栈跟踪列出的第一个方法 `charAt` 是产生异常的方法。\n* 下一个方法 `produceError`\
  \ 是调用 `charAt` 的方法。\n* 下一个方法 `myMethod` 是调用 `produceError` 的方法。\n* 最后一个方法 `main`\
  \ 是调用 `myMethod` 的方法。\n* 堆栈跟踪显示了抛出异常时调用的方法链。\n\n**注意**：所有异常对象都有继承自 `Throwable` 类的\
  \ `printStackTrace` 方法，用于打印堆栈跟踪。\n\n***\n\n# 当未被捕获时\n\n* 当异常被抛出时，它必须被程序处理或默认异常处理器处理。\n\
  * 当方法中的代码抛出异常时，该方法的正常执行停止，JVM 在方法内部搜索兼容的异常处理器。\n* 如果方法没有代码来处理调用栈中的上一个方法（即调用错误方法的方法）。\n\
  * 如果该方法无法处理异常，则控制将再次沿调用栈传递给上一个方法。\n* 这种情况会一直持续直到控制到达 `main` 方法。如果 `main` 方法不处理异常，程序将停止并由默认异常处理器处理异常。\n\
  * `StackTrace.java` 中的程序就是此类情况。因为 `produceError` 方法没有处理异常，控制传回了 `myMethod`。\n* 它也没有处理异常，因此控制传回了\
  \ `main`。由于 `main` 没有处理异常，程序停止，默认异常处理器显示了错误信息。\n\n***\n\n# 异常类\n\n异常是一个对象。异常对象是由\
  \ Java 中的类创建的。Java 拥有广泛的异常类层次。下图显示了该层次的一部分。\n\n![](img/Image00138.jpg)\n**图 23.1\
  \ | 异常类层次的一部分**\n\n所有类都继承自 `Throwable` 类。在 `Throwable` 类下方是 `Error` 和 `Exception`\
  \ 类。继承自 `Error` 的类用于发生严重错误时抛出的异常，例如 Java 机器的内部错误或内存耗尽。你不应该处理这些异常，因为它们是严重的情况。你将处理的所有异常都是继承自\
  \ `Exception` 的类的实例。\n\n异常层次的一部分显示了其中两个类作为父类：\n\n* `IOException` 是与输入输出操作相关的异常的父类。\n\
  * `RuntimeException` 是源于编程错误（如下标越界）的异常的父类。\n\n异常层次的一部分显示了两个自 `IOException` 的类：`EOFException`\
  \ 和 `FileNotFoundException`。这些是创建异常对象的类。`EOFException` 对象在应用程序尝试读取文件末尾之外时抛出，而 `FileNotFoundException`\
  \ 对象在应用程序尝试打开一个不存在的文件时抛出。\n\n***\n\n# 检查异常与未检查异常\n\n在 Java 中，异常分为两类：未检查异常和检查异常。\n\
  \n### 未检查异常\n\n未检查异常是继承自 `Error` 类或 `RuntimeException` 类的异常。记得继承自 `Error` 的异常是在发生严重错误时抛出的。你不应该处理这些异常，因为产生这些异常的情况很少在程序中处理。记得\
  \ `RuntimeException` 是源于编程错误（如下标越界）的异常的父类。最好不要处理这些异常，因为它们可以通过编写良好的代码来避免。所以你不应该处理未检查异常。\n\
  \n### 检查异常\n\n所有剩余异常（即未继承自 `RuntimeException` 的异常）都是检查异常。这些是你应该在程序处理的异常。如果方法中的代码可能抛出检查异常，那么该方法必须满足以下要求之一：\n\
  \n* 它必须处理异常 - 或\n* 它必须在方法处理器中列出 `throws` 子句。`throws` 子句告知编译器可能从方法抛出的异常。\n\n这里有一个简单的示例。\n\
  \n```java\n// 此方法无法编译\npublic void displayFile(String name) {\n    // 打开文件\n   \
  \ File file = new File(name);\n    Scanner inputFile = new Scanner(file);\n\n  \
  \  // 读取并显示文件内容\n    while (inputFile.hasNext()) {\n        System.out.println(inputFile.nextLine());\n\
  \    }\n\n    // 关闭文件\n    inputFile.close();\n}\n```\n\n**解析**\n* 此方法中的代码能够抛出 `FileNotFoundException`，这是一个检查异常。\n\
  \n\n\n\n\n- 因为该方法没有处理此异常，因此它在方法头部中必须有一个 `throws` 子句，否则将无法通过编译。\n- `throws` 关键字写在方法头部的末尾，后面紧跟该方法可能抛出的异常类型列表。\n\
  \n修改后的方法头部：\n```java\npublic void displayFile(String name) throws FileNotFoundException\n\
  ```\n`throws` 子句告诉编译器，此方法可能会抛出 `FileNotFoundException`（如果有多种类型的异常，请用逗号将它们隔开）。现在你知道为什么在之前的章节中，你在方法上写了\
  \ `throws` 子句了。我们必须告知编译器，我们的方法可能会将这些异常向上传递给调用堆栈。\n\n### Summary\n\n- 异常（exception）是程序执行过程中发生的非预期事件。当异常发生时，它会中断程序的正常执行流。\n\
  - 为了防止异常导致程序崩溃，你必须编写检测并处理异常的代码。当产生异常时，称该异常被“抛出”（thrown）。除非应用程序检测并处理该异常，否则它会导致应用程序停止。\n\
  - 异常处理器（exception handler）是当异常被抛出时做出响应的代码段。解释和响应异常的过程称为异常处理（exception handling）。为了检测异常已抛出并防止其停止你的应用程序，Java\
  \ 允许你创建异常处理器。\n- 如果你的代码在异常抛出时没有处理它，则由默认异常处理器处理。默认异常处理器会打印错误信息并导致程序崩溃。\n- 可能抛出某些异常的代码必须使用\
  \ `try-catch` 或 `throws` 关键字括起来。\n- `try` 和 `catch` 意味着就像是你尝试运行一段代码，如果发生了错误，你不会关闭程序，而是会捕获（catch）该错误并对其进行处理。\n\
  - `throws` 是 Java 中的一个关键字，用于方法签名，表示该方法可能会抛出列出的类型之一的异常。这些方法的调用者必须使用 `try-catch` 块来处理异常。Java\
  \ 中的 `throw` 关键字用于从方法或任何代码块中显式地抛出异常。`throw` 关键字主要用于抛出自定义异常。\n- 你可以编写抛出标准 Java 异常的代码，或者抛出你设计的自定义异常类的实例。你可以使用\
  \ `throw` 语句来手动抛出异常。\n- 在 java 中，有三种方法可以找到异常的细节。它们分别是：使用 `java.lang.Exception` 类对象、`public\
  \ void printStackTrace()` 方法和 `public string getMessage()` 方法。\n- 在处理异常时，可以使用多态引用作为\
  \ `catch` 子句的参数。例如：我们处理过的所有异常都继承自 `Exception` 类。因此，使用 `Exception` 类型变量的 `catch`\
  \ 子句能够捕获任何继承自 `Exception` 的异常。\n- 超类类型的引用变量可以引用子类对象。这被称为多态（Polymorphism）。在处理异常时，你可以使用多态引用作为\
  \ `catch` 子句的参数。\n- 然而在许多情况下，`try` 块中的代码可能会抛出不止一种类型的异常。在这种情况下，你需要为每种可能抛出的异常类型编写一个\
  \ `catch` 子句。\n- `finally` 块包含了所有无论是否发生异常都执行的关键语句。\n- 所有异常对象都有一个继承自 `Throwable`\
  \ 类的 `printStackTrace` 方法，该方法可以打印堆栈跟踪（stack trace）。\n- 异常是一个对象。异常对象是从 Java 中的类创建的。Java\
  \ 拥有广泛的异常类层次结构。所有类都继承自 `Throwable` 类。紧邻 `Throwable` 类之下的是 `Error` 和 `Exception`\
  \ 类。\n- 继承自 `Error` 的类用于发生严重错误时抛出的异常，例如 Java 虚拟机的内部错误或内存耗尽。你的应用程序不尝试处理这些错误，因为它们是严重状况的结果。你将处理的所有异常都是继承自\
  \ `Exception` 的类的实例。异常类层次结构的一部分：显示了其中两个类：`IOException` 和 `RuntimeException`。这些类也充当父类。`IOException`\
  \ 是与输入输出操作相关的异常的父类。`RuntimeException` 是由于编程错误（如数组下标越界）导致的异常的父类。\n- 在 Java 中，异常分为两类：未检查异常（unchecked）和已检查异常（checked）。未检查异常是继承自\
  \ `Error` 类或 `RuntimeException` 类的异常。其余异常（即不继承自 `Error/RuntimeException` 的异常）都是已检查异常。这些是你应该在程序处理的异常。\n\
  - `main` 方法不应该抛出任何异常，因为 `main` 方法是由 `JVM` 调用的，`JVM` 无法提供用户友的消息。\n\n1:https://howtodoinjava.com/java/exception-handling/throw-vs-throws/\n\
  \n## 第 24 章 Java 文件 I/O\n\n在变量和数组中存储的数据是暂时的，一旦程序停止运行或电源关闭，就会消失。对于永久存储，我们使用文件，文件是存储在计算机辅助内存中的数据集合，如硬盘、CD-ROM、DVD-ROM\
  \ 和 USB 内存棒。文件被组织成目录（有时称为文件夹）。目录可以包含其他目录，也可以包含文件。通过 Java，我们可以从现有文件中读取数据、创建新文件、向文件写入数据等。在\
  \ Java 中，主要的 I/O 被称为流（streams）。输入流表示输入源，输出流表示可以发送输出的目的。有许多预定义类表示各种类型的流。Java 有两大类流：字节流（byte-streams）：处理机器格式的数据\n\
  \n- 对于读取机器格式的数据，主类是 `InputStream` 类。\n- 对于写入机器格式的数据，主类是 `OutputStream` 类。\n- 如果你向\
  \ `OutputStream` 写入数字，你可能将无法自己读取结果数据。但可以通过 `InputStream` 将数据读回计算机。\n- 字符流（character-streams）：处理人类可读的数据（如\
  \ 12.5、ABC 等）\n\n- 对于读取人类可读字符数据，主类是 `Reader` 类。\n- 对于写入人类可读字符数据，主类是 `Writer` 类。\n\
  \n本节讨论的标准流类定义在 `java.io` 包中，并带有若干辅助类。基础 I/O 类 `Reader`、`Writer`、`InputStream` 和\
  \ `OutputStream` 只提供了非常原始的 I/O 方法或操作，如下表 24.1 所示。\n\n### 表 24.1 原始 I/O 类及其方法\n\n\
  | 类 | 方法 | 说明 |\n| :--- | :--- | :--- |\n| `InputStream` | `read()` | 从输入流读取一个字节数据\
  \ |\n| `OutputStream` | `write()` | 向输出流写入一个字节数据 |\n| `Reader` | `read()` | 从输入流读取一个字符\
  \ |\n| `Writer` | `write()` | 向输出流写入一个字符 |\n\n这并不是问题，因为相反，你将使用 `InputStream/OutputStream`\
  \ 和 `Reader/Writer` 的子类，这些类增加了更方便的输入输出方法，而不是原始的功能。\n\n\n\n\n\n### File 类\n\n`File`\
  \ 类仅允许你访问文件和文件系统元数据。通过使用 `File` 类，你可以创建文件、删除文件、重命名或移动文件、创建目录等。那么，让我们开始吧。\n\n## 实例化\
  \ File 对象\n\n在对文件系统或 `File` 类进行任何操作之前，你必须先创建一个 `File` 实例。以下是具体实现方法：\n\n```java\n\
  import java.io.File;\n\n. . .\n\nFile f = new File(\"c:\\\\dir\\\\file.txt\");\n\
  ```\n\n#### 解释\n\n- 第 1 行：`java.io` 包提供了一个类库，用于从任何类型的位置（磁盘、网络、内存）以流的形式读取和写入任何类型的数据（文本、数字、图像）。\n\
  - 第 2 行：创建一个 `File` 对象，并定义文件的路径 - 在此例中路径为（`c:\\dir\\file.txt`）。\n\n我们将执行的是测试我们的计算机上是否存在某个文件。\n\
  \n## 检查文件是否存在\n\n一旦你实例化了一个 `File` 对象，就可以检查相应的文件是否已经存在。要检查文件是否存在，我们调用 `exists()`\
  \ 方法。这里有一个简单的示例。\n\n### 示例 24.1：CheckFile.java - 检查文件是否存在\n\n```java\n01 import\
  \ java.io.File;\n02 public class File1 {\n03 public static void main(String[] args){\n\
  04 File f = new File(\"D:\\\\Documents\\\\lang2.txt\");\n05 if(f.exists())\n06 System.out.println(\"\
  The \" + f.getName() + \" file is exists.\");\n07 else\n08 System.out.println(\"\
  The \" + f.getName() + \" file doesn't exists.\");\n09 }\n10 }\n```\n\n输出（如果 lang2.txt\
  \ 文件存在）：The lang2.txt file is exists.\n输出（如果 lang2.txt 文件不存在）：The lang2.txt file\
  \ doesn't exists.\n\n## 如果文件不存在则创建\n\n以下示例展示了使用 `try..catch` 语句使用 `createNewFile()`\
  \ 方法。\n\n### 示例 24.2：CreateEmptyFile.java - 使用 try.. catch 语句在文件不存在时创建文件\n\n```java\n\
  01 import java.io.File;\n02 import java.io.IOException;\n03\n04 public class CreateEmptyFile\n\
  05 {\n06 public static void main( String[] args )\n07 {\n08 try {\n09\n10 File f\
  \ = new File(\"d:\\\\new.txt\");\n11\n12 if (f.createNewFile()){\n13 System.out.println(\"\
  File is created!\");\n14 else{\n15 System.out.println(\"File already exists.\");\n\
  16 }\n17\n18 catch (IOException e){\n19 e.printStackTrace();\n20 }\n21 }\n```\n\n\
  输出（如果 new.txt 不存在）：File is created!\n输出（如果 new.txt 存在）：File already exists.\n\n\
  #### 解释\n\n- 第 10 行：创建一个 `File` 对象并定义文件的路径。\n- 第 12 行：如果文件创建则返回 `true`，如果文件已存在则返回\
  \ `false`。\n- 第 13 行：如果第 12 行的表达式为 `true`，则执行。\n- 第 15 行：如果第 12 行的表达式为 `false`，则执行。\n\
  \n## 如果目录不存在则创建目录\n\n你可以使用 `File` 类在目录尚存在时创建它们。`File` 类包含了用于此目的的 `mkdir()` 和 `mkdirs()`\
  \ 方法。以下两个示例解释了这两种方法。\n\n### 示例 24.3：CreateSingleDir.java - 使用 mkdir() 方法创建不存在的单目录\n\
  \n```java\n01 package ch24;\n02\n03 import java.io.File;\n04 import java.io.IOException;\n\
  05\n06 public class CreateSingleDir\n07 public static void main(String[] args){\n\
  08 try{\n09 File f = new File(\"D:\\\\Documents\\\\MyFiles\\\\newDir\");\n10 if\
  \ (f.mkdir()){\n11 System.out.println(\"Directory is created!\");\n12 else{\n13\
  \ System.out.println(\"Directory already exists.\");\n14 }\n15 catch(Exception e)\
  \ {\n16 e.printStackTrace();\n17 }\n18 }\n```\n\n输出（如果目录不存在）：Directory is created!\n\
  输出（如果目录存在）：Directory already exists.\n\n#### 解释\n\n- 只要目录 `D:\\Documents\\MyFiles`\
  \ 存在，上述代码将在 `MyFiles` 下创建一个名为 `newdir` 的子目录。\n- 如果创建了目录，`mkdir()` 返回 `true`；如果目录已存在，则返回\
  \ `false`。\n\n### 示例 24.4：CreateAllDirs.java - 使用 mkdirs() 方法创建 File 对象路径中缺失的所有目录\n\
  \n```java\n01 package ch24;\n02\n03 import java.io.File;\n04 import java.io.IOException;\n\
  05\n06 public class CreateSingleDir {\n07 public static void main(String[] args)\
