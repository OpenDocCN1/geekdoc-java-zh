  ```\nArrayList contains the string 'White': true\nArrayList contains the string\
  \ 'Brown': true\nArrayList contains the string 'Green': true\n```\n\n### Capacity\n\
  \n之前你已经学习过 `ArrayList` 对象的大小是存储在该 `ArrayList` 对象中的项数。当你向 `ArrayList` 对象中添加一个项时，它的大小会增加\
  \ 1；当你从 `ArrayList` 对象中删除一个项时，它的大小会减少 1。\n\n一个 `ArrayList` 对象还有一个容量（capacity），它是它在不增加大小的情况下可以存储的项数。当使用无参构造函数首次创建\
  \ `ArrayList` 对象时，它的初始容量为 10 个项。这意味着它可以在不增加大小的情况下最多容纳 10 个项。当添加第 11 个项时，`ArrayList`\
  \ 对象必须增加其大小以容纳新项。如果你需要，可以通过向 `ArrayList` 构造函数传递一个 `int` 参数来指定不同的起始容量，如下所示：\n\n示例\
  \ 14.34：创建一个初始容量为 100 个元素的 `ArrayList` 对象：\n```java\nArrayList list = new ArrayList(100);\n\
  ```\n\n考虑一种情况：需要向一个已经满的 `ArrayList` 中添加大量元素，在这种情况下，`ArrayList` 必须调整几次大小，这将导致性能低下。对于此类场景，`ensureCapacity()`\
  \ 方法非常有用，因为它可以通过指定的容量增加 `ArrayList` 的大小。\n\nSyntax\n```java\npublic void ensureCapacity(int\
  \ minCapacity)\n```\n\n示例 14.35：`EnsureCapacityEx.java`\n```java\nimport java.util.ArrayList;\n\
  \npublic class EnsureCapacityEx {\n    public static void main(String args[]){\n\
  \        // 容量为 3 的 ArrayList\n        ArrayList<String> numbers = new ArrayList<String>(3);\n\
  \n        // 添加 3 个元素\n        numbers.add(\"One\");\n        numbers.add(\"Two\"\
  );\n        numbers.add(\"Three\");\n\n        // 将容量增加到 4\n        numbers.ensureCapacity(4);\n\
  \        numbers.add(\"Four\");\n\n        // 打印列表中所有的可用元素\n        for (String\
  \ temp: numbers){\n            System.out.println(temp);\n        }\n    }\n}\n\
  ```\nOutput\n```\nOne\nTwo\nThree\nFour\n```\n\n### Summary\n\n* 一个 `ArrayList`\
  \ 对象随着项的添加而自动扩展。\n* 一个 `ArrayList` 对象随着项的删除而自动收缩。\n* `ArrayList` 类有一个无参构造函数。\n*\
  \ 要向 `ArrayList` 对象添加项，你使用 `add` 方法。\n* 存储在 `ArrayList` 中的项有对应的索引。\n* `ArrayList`\
  \ 类有一个 `size` 方法，用于报告 `ArrayList` 中存储的项数。\n* `ArrayList` 类的 `get` 方法返回存储在特定索引处的项。\n\
  * `ArrayList` 类有一个 `toString()` 方法，返回一个表示 `ArrayList` 对象中存储的所有项的字符串。\n* `ArrayList`\
  \ 类有一个 `remove()` 方法，用于删除特定索引处的项。\n* `ArrayList` 类的 `set()` 方法可以将特定索引处的项替换为另一个项。\n\
  * 当使用无参构造函数首次创建 `ArrayList` 对象时，它的初始容量为 10 个项。\n* `ArrayList` 可用于存储任何类型的对象。事实上，你可以在同一个\
  \ `ArrayList` 中存储不同类型对象的混合。\n* 然而，随着 Java 5 的发布，`ArrayList` 类变成了“类型安全的泛型数据类型”。这意味着你可以指定\
  \ `ArrayList` 将存储的对象类型，Java 将确保只有指定类型的对象会被存储在其中。你仍然可以使用传统方式（不指定类型）使用 `ArrayList`\
  \ 类，但在大多数情况下，你应该指定类型以减少错误的概率。\n\n## 第 15 章：方法和构造函数的重载\n\n## 方法重载\n\n方法重载（Overloaded）意味着同类中的两个或多个方法名称相同，但使用不同类型的参数（基于类型和数量）。\n\
  \n用处：\n* 有时，你需要几种不同的方式来执行相同的操作。\n* 我们可以编写更小、更直接的方法并在需要时调用它们。\n\n`Overload.java`\
  \ 示例展示了方法重载的使用。\n\n示例 15.1：`Overload.java` - 假设一个类有以下两个方法\n```java\npublic class\
  \ OverloadingMethods {\n\n    static int add(int val1, int val2) {\n        int\
  \ sum;\n        sum = val1 + val2;\n        return sum;\n    }\n\n    static String\
  \ add(String s1, String s2) {\n        String name;\n        name = s1 + s2;\n \
  \       return name;\n    }\n...\n \n（注：此处原文似乎出现了乱序或重复，已根据你提供的文本逻辑进行翻译）\n\n\n\n\n\
  \n`add s2 = new add(222,\"Mansour\",25);` 第一条语句创建了一个 `add` 对象，由 `s1` 变量引用并执行了构造函数。它的\
  \ `id` 和 `name` 字段将被设置为 111 和 “Mohammed”。第二条语句创建了另一个 `add` 对象，由 `s2` 变量引用并执行了第二个构造函数。它的\
  \ `id`、`name` 和 `age` 字段将分别设置为 222、\"Mansour\" 和 25。\n\n只有当你没有为一个类编写任何构造函数时，Java\
  \ 才提供默认构造函数。如果一个类有一个接受参数的构造函数，但没有无参构造函数，那么你无法在不向构造函数传递参数的情况下创建该类的实例。因此，每当你为类类写一个接受参数的构造函数时，如果你希望能够在不传递参数的情况下创建该类的实例，你也应该也写一个无参构造函数。\n\
  \n## 总结\n\n- 方法重载（Method overloaded）意味着同一个类中的两个或多个方法共享相同的名称，但使用不同类型的参数（基于类型和数量）。\n\
  - Java 使用方法的签名（signature）来将其与其他同名方法区分开。方法的签名由：方法名、输入参数的数量、方法参数的数据类型以及参数的顺序组成。\n\
  - 将方法调用与正确方法匹配的过程称为绑定（binding）。\n- 构造重载（Overloading constructor）意味着一个类可以拥有任意数量的构造函数。重载构造函数的规则与重载其他方法相同。\n\
  - 只有当你没有为一个类编写任何构造函数时，Java 才提供默认构造函数。\n\n## 第 16 章：聚合简介（Introduction to Aggregation）\n\
  \n### 引言\n在现实生活中，对象经常由其他对象组成。例如，一个学校是由门、窗户、墙对象组成的。所有这些对象的组合构成了一个学校对象。![](img/Image0013.jpg)图\
  \ 16.1 | 一个学校对象。\n\n聚合是关联（association）的一种特殊形式。它是类之间的一种关系，但它是一种单向关联。例如，考虑两个类：`Employee`\
  \ 类和 `Address` 类。每个员工都有一个地址，但如果你反过来考虑，就没有意义了，因为地址并不一定有一个员工。让我们来写这些例子。\n\n**示例 16.1：Address.java\
  \ 类**\n```java\n01 public class Address{\n02 String city;\n03 String state;\n04\
  \ String country;\n05 Address (String c, String st, String coun){\n06 this.city=c;\n\
  07 this.state=st;\n08 this.country=coun;\n09 }\n10 }\n```\n\n**示例 16.2：Employee.java\
  \ 类**\n```java\n01 public class Employee {\n02 int rollNum;\n03 String EmployeeName;\n\
  04\n05 // 与 Address 类建立单向关系\n06 Address EmployeeAddr;\n07 Employee(int roll, String\
  \ name, Address addr){\n08 this.rollNum=roll;\n09 this.EmployeeName=name;\n10 this.EmployeeAddr=addr;\n\
  11 }\n12 public static void main(String[] args){\n13 Address ad = new Address(\"\
  Omdurman\", \"Khartoum\", \"Sudan\");\n14 Employee obj = new Employee(123, \"Mohammed\"\
  , ad);\n15 System.out.println(obj.rollNum);\n16 System.out.println(obj.EmployeeName);\n\
  17 System.out.println(obj.EmployeeAddr.city);\n18 System.out.println(obj.EmployeeAddr.state);\n\
  19 System.out.println(obj.EmployeeAddr.country);\n20 }\n21 }\n```\n**输出 (Employee.java)**\n\
  ```\n123\nMohammed\nOmdurman\nKhartoum\nSudan\n```\n\n#### 解释\n- 当一个类的实例是另一个类中的字段时，就会发生聚合。例如（`Employee.java`\
  \ 类）：`06 Address EmployeeAddr;`\n- 你可以看到在 `Employee` 类中，我声明了一个 `Address` 类型的字段来获取员工地址。这是\
  \ Java 中聚合的一个典型示例。\n- 聚合表示两个类之间的一种关系，其中一个类包含另一个类的引用。\n\n### 为什么我们需要聚合？\n为了保持代码的可重用。为了理解这一点，让我们再次来看同样的例子。假设除了上述\
  \ `Employee` 和 `Address` 类外，还有两个类 `Department` 和 `Client`。为了维护 `Employee` 的地址、`Department`\
  \ 的地址和 `Client` 的地址，我们不需要反复使用相同的代码。我们只需要在定义这些每个类时使用 `Address` 引用即可。因此，我们可以通过使用聚合关系来提高代码的可重用性。\n\
  \n所以如果我必须在程序中编写这些，我会这样做：\n\n**示例 16.3：Address2.java 类**\n```java\n01 package ch16;\n\
  02\n03 public class Address2{\n04 String city;\n05 String state;\n06 String country;\n\
  07 Address2(String c, String st, String coun){\n08 this.city=c;\n09 this.state=st;\n\
  10 this.country=coun;\n11 }\n}\n```\n\n**示例 16.4：Department.java 类**\n```java\n\
  01 public class Department {\n02 String deptName;\n03\n04 // 与 Address 类建立单向关系\n\
  05 Address deptAddr;\n06 Department(String name, Address addr){\n07 this.deptName=name;\n\
  08 this.deptAddr=addr;\n09 }\n```\n\n**示例 16.5：Client.java 类**\n```java\n01 public\
  \ class Client {\n02 String clientName;\n03\n04 // 与 Address 类建立单向关系\n05 Address\
  \ clientAddr;\n06 Client(String name, Address addr){\n07 this.clientName=name;\n\
  08 this.clientAddr=addr;\n09 }\n```\n\n**示例 16.6：Employee2.java 类**\n```java\n01\
  \ package ch16;\n02\n03 public class Employee2 {\n04 int rollNum;\n05 String employeeName;\n\
  06\n07 // 与 Address 类建立单向关系\n08 Address employeeAddr;\n09 Employee2(int roll, String\
  \ name, Address addr){\n10 this.rollNum=roll;\n11 this.employeeName=name;\n12 this.employeeAddr=addr;\n\
  13 }\n14 public static void main(String[] args){\n15 Address ad = new Address(\"\
  Omdurman\", \"Khartoum\", \"Sudan\");\n16 Employee2 obj = new Employee2(123, \"\
  Mohammed\", ad);\n17 System.out.println(obj.rollNum);\n18 System.out.println(obj.employeeName);\n\
  19 System.out.println(obj.employeeAddr.city);\n20 System.out.println(obj.employeeAddr.state);\n\
  21 System.out.println(obj.employeeAddr.country);\n22 }\n23 }\n```\n**输出 (Employee2.java)**\n\
  ```\n123\nMohammed\nOmdurman\nKhartoum\nSudan\n```\n你可以看到，我们没有在这三个类中的任何一个里编写 `Address`\
  \ 代码，我们只是与 `Address` 类关系来使用 `Address` 代码。上面的 `dot` 部分可以替换为 `public static main`\
  \ 方法，其代码与我们在第一个例子中看到的相似。示例：一个表示课程的对象：\n\n- `Course` 类 - 持课程相关数据。\n- `Teacher` 类\
  \ - 持教师相关数据。\n- `NoteBook` 类 - 持书籍数据。\n\n这些类的实例可以作为 `Course` 类的字段。\n\n**示例 16.7：Teacher.java\
  \ 类**\n```java\n01 public class Teacher{\n02 String firstName;\n03 String lastName;\n\
  04\n05 Teacher(String lname, String fname){\n06 this.lastName=lname;\n07 this.firstName=fname;\n\
  08 }\n09\n10 Teacher(Teacher object2){\n11 this.lastName=object2.lastName;\n12 this.firstName=object2.firstName;\n\
  13 }\n14\n15 public void set(String lname, String fname){\n16 this.lastName=lname;\n\
  17 this.firstName=fname;\n18 }\n19\n20 public String toString(){\n21 str = \"Last\
  \ Name: \" + lastName + \"\\nFirst Name: \" + firstName;\n22 return str;\n23 }\n\
  24 }\n```\n\n**示例 16.8：NoteBook.java 类**\n```java\n01 public class NoteBook{\n02\
  \ String title;\n03 String author;\n04\n05 NoteBook(String textTitle, String auth){\n\
  06 this.title=textTitle;\n07 this.author=auth;\n08 }\n09\n10 NoteBook(NoteBook object2){\n\
  11 this.title=object2.title;\n12 this.author=object2.author;\n13 }\n14\n15 public\
  \ void set(String textTitle, String auth){\n16 this.title=textTitle;\n17 this.author=auth;\n\
  18 }\n19\n20 public String toString(){\n21 str = \"Title: \" + title + \"\\nAuthor:\
  \ \" + author;\n22 return str;\n23 }\n24 }\n```\n\n**要点：**\n- `Course` 类拥有 `Teacher`\
  \ 对象和 `NoteBook` 对象作为字段。\n\n\n\n\n- 将一个类的实例作为另一个类的字段被称为 `OBJECT AGGREGATION`（对象聚合）。\n\
  - `aggregate`（聚合）的意思是“由组成部分形成的整体”。\n- 在此示例中，`Course` 类是一个聚合类，因为它由组成对象组成。\n\n示例 16.9\
  \ : `Course.java`\n```java\n01 public class Course\n02 {\n03 private String courseName;\n\
  04 private Teacher teacher;\n05 private NoteBook noteBook;\n06\n07 public Course(String\
  \ name, Teacher teach, NoteBook note)\n08 {\n09 courseName = name;\n10 teacher =\
  \ new Teacher(teach);\n11 noteBook = new NoteBook(note);\n12 }\n13\n14 public String\
  \ getName()\n15 {\n16 return courseName;\n17 }\n18\n19 public Teacher getTeacher()\n\
  20 {\n21 return new Teacher(teacher);\n22 }\n23\n24 public NoteBook getNoteBook()\n\
  25 {\n26 // Return a copy of the noteBook object.\n27 return new NoteBook(noteBook);\n\
  28 }\n29\n30 public String toString()\n31 {\n32 String str = \"Course name: \" +\
  \ courseName +\n33 \"\\nTeacher Information:\\n\" + teacher +\n34 \"\\nNotebook\
  \ Information:\\n\"+ noteBook;\n35\n36 return str;\n37 }\n38 }\n```\n示例 16.10 :\
  \ `CourseDemo.java`\n```java\n01 public class CourseDemo\n02 {\n03 public static\
  \ void main(String[] args)\n04 {\n05 Teacher myTeacher = new Teacher(\"Mohamed\"\
  , \"Mansour\");\n06 NoteBook myNoteBook = new NoteBook(\"Core Java\", \"Mohammed\"\
  );\n07\n08 Course myCourse =\n09 new Course(\"Core Java\", myTeacher, myNoteBook);\n\
  10\n11 System.out.println(myCourse);\n12 }\n13 }\n```\n输出 (`CourseDemo.java`):\n\
  ```\nCourse name: Core Java\nTeacher Information:\nLast Name: Mohamed\nFirst Name:\
  \ Mansour\nNotebook Information:\nTitle: Core Java\nAuthor: Mohammed\n```\n\n* *\
  \ *\n\n## 总结\n* Java 聚合表示类与类之间的特殊关系。这种关系被称为 HAS-A（包含）关系。它是一种单向关系。\n* 当一个类的实例是另一个类的字段时，就会发生聚合。\n\
  * 我们需要聚合来维护代码的可重用性。代码的可重用意味着使用已经开发好的代码或类，而无需从头开始。\n* * *\n\n## 第 17 章\n## 枚举类型 (Enumerated\
  \ Types)\n\n### 引言\n枚举数据类型由使用单个名称的一组具名常量组成。例如，一周中的 7 天（周六、周日等）可以是 7 个命名为 `Day` 的枚举类型。当我们在编译时知道所有可能的值时，就会使用\
  \ `Enums`（枚举）。\n\n“`enum` 的主要目标是定义我们自己的数据类型（枚举数据类型）。”你可以使用该数据类型创建变量，这些变量只能持有属于枚举数据类型的值。例如；`int`\
  \ 数据类型的变量可以持有特定范围内的整数值（从 -2,147,483,648 到 2,147,483,647）。你不能给 `int` 变量分配浮点值，因为只有\
  \ `int` 值可以赋值给 `int` 变量。\n\n数据类型定义了该数据类型的任何变量的合法值。有时，创建一个具有特定合法值集合的自定义数据类型是有帮助的。例如，假设你想创建一个名为\
  \ `Day` 的数据类型，该数据类型中的合法值是星期几的名称（SUNDAY、MONDAY 等）。当你创建一个 `Day` 类型的变量时，你只能在那个变量中存储星期几的名称。任何其他值都是非法的。\n\
  \n| 数据类型 | 该数据类型中的合法值 |\n| :--- | :--- |\n| `Day` | SUNDAY, MONDAY, TUESDAY, WEDNESDAY,\
  \ THURSDAY, FRIDAY, SATURDAY. |\n| `MONTH` | January, February, March, April, May,\
  \ June, July, August, September, October, November, December. |\n\n在 Java 中，这种类型被称为“枚举数据类型”。\n\
  \n### 创建枚举数据类型\n![Image](img/Image00131.jpg)\n图 17.1 | 枚举数据类型的格式\n\n* `TypeName`:\
  \ 用户定义数据类型的名称。\n* `enum`: Java 关键字。\n* `enum constants`: 用户定义数据类型的值。\n\n你使用 `enum`\
  \ 关键字来创建你自己的数据类型并指定属于该类型的值。`enum constants` 不包含在引号中，因此它们不是字符串，枚举常量必须是合法的 Java 标识符。一旦定义了枚举，程序员就可以创建其类型类型的变量。然而，尽管枚举定义了一个类类型，但程序员不会使用\
  \ `new` 来初始化 `enum`。相反，他们可以像以前使用原始数据类型一样声明和使用枚举变量。\n\n#### 有效的枚举声明\n我们可以如下所示声明 `enum`s：\n\
  * 类内部\n* 类外部\n* 在其单独的文件中\n\n#### 无效的枚举声明\n* 方法内部。\n* 块内部。\n\n如果你尝试在方法内部声明 `enum`，将会出现错误。\n\
  \n#### 可用的修饰符\n`enum` 是隐式 `final` 的，因此 `abstract` 是不可用的。在方法内部或块内部声明 `enum` 将导致编译错误。\n\
  * 在类外部或在单独文件中声明 `enum` 时，可用的修饰符有：`public`、默认。\n\n**声明方法 1：在类外部声明枚举 (Enum1.java -\
  \ 第 01-04 行)**\n```java\n01 enum Day\n02 {\n03 SUNDAY, MONDAY, TUESDAY, WEDNESDAY,\
  \ THURSDAY, FRIDAY, SATURDAY;\n04 }\n05 public class Enum1\n06 // 驱动方法\n07 public\
  \ static void main(String[] args){\n08 Day d1 = Day.MONDAY;\n09 System.out.println(d1);\n\
  10 }\n```\n输出：`MONDAY`\n\n**声明方法 2：在类内部声明枚举 (Enum2.java - 第 02-05 行)**\n```java\n\
  01 public class Enum2\n02 enum Day\n03 {\n04 SUNDAY, MONDAY, TUESDAY, WEDNESDAY,\
  \ THURSDAY, FRIDAY, SATURDAY;\n05 }\n06 // 驱动方法\n07 public static void main(String[]\
  \ args){\n08 Day d1 = Day.FRIDAY;\n09 System.out.print(d1);\n10 }\n```\n输出：`FRIDAY`\n\
  \n根据 Java 命名规范，建议我们使用全大写命名常量。示例声明创建了一个名为 `Day` 的枚举数据类型。大括号内部的标识符 SUNDAY、MONDAY 等被称为枚举常量。它们代表属于\
  \ `Day` 数据类型的值。\n\n#### 声明枚举类型的变量\n一旦你在程序中创建了枚举数据类型，就可以声明该类型的变量。例如，将 `workDay` 声明为\
  \ `Day` 类型。如果你尝试赋值 Day 类型常量以外的值，会导致编译器错误。例如：\n```java\nDay workDay = Day.FRIDAY;\
  \ // 正确\nDay workDay = FRIDAY; // 错误\n```\n赋值 `Day.WEDNESDAY` 而不是 `WEDNESDAY`。在大多数情况下，你必须使用枚举常量的限定名称。\n\
  \n示例 17.1：在方法内部声明枚举数据类型 `Day` 的变量 `workDay`\n```java\n01 public class Enum2\n02\
  \ enum Day\n03 {\n04 SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY;\n\
  05 }\n06 // 驱动方法\n07 public static void main(String[] args){\n08 Day workDay = Day.WEDNESDAY;\n\
  09 System.out.print(workDay);\n10 }\n```\n输出：`WEDNESDAY`\n\n### 解析\n* 第 02 行：在 `Enum2`\
  \ 类内部创建一个名为 `Day` 的枚举类型。\n* 第 04 行：定义了 `Day` 数据类型的值。\n* 第 08 行：创建一个类型为 `Day` 的变量\
  \ `workDay`，并赋值为 `Day.WEDNESDAY`。\n* 第 09 行：通过将 `workDay` 变量作为参数传递给 `print(workDay)`\
  \ 方法，在屏幕上显示 `workDay` 变量的值。\n\n\n\n\n## 枚举类型是特殊化的类\n\n在 Java 中，我们也可以向枚举类型中添加变量、方法和构造函数。`enum`\
  \ 内部的第一行应该是常量的列表，然后是其他如方法、变量和构造函数等内容。当你编写一个枚举类型声明时，你实际上是在创建一个特殊的类。每个 `enum` 在内部都通过使用\
  \ `class.Enum` 实现，它通过简化冗长的代码简化了开发者的工作，并在内部遵循以下步骤：\n\n* 每一个 `enum` 常量在内部都使用类来实现。\n\
  * 每一个 `enum` 常量在内部都是 `public static final` 的。\n* 每一个 `enum` 常量的 `Enum`（类）声明代表 `Enum`\
  \ 类型的一个对象。\n\n考虑下面的示例并查看它在内部是如何转换的：\n\n```java\nenum Day\n{\n    SUNDAY, MONDAY,\
  \ TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY;\n}\n```\n\n上述 `Enum` 声明在内部将转换为如下形式：\n\
  \n```java\n/* 内部上述 enum Day 被转换为类 Day */\nclass Day\n{\n    public static final\
  \ Day SUNDAY = new Day();\n    public static final Day MONDAY = new Day();\n   \
  \ public static final Day TUESDAY = new Day();\n    public static final Day WEDNESDAY\
  \ = new Day();\n    public static final Day THURSDAY = new Day();\n    public static\
  \ final Day FRIDAY = new Day();\n    public static final Day SATURDAY = new Day();\n\
  }\n```\n\n此外，你在大括号内列出的 `enum` 常量实际上是该类的对象。在上一个示例中，`Day` 是一个类，而枚举常量 `Day.SUNDAY`、`Day.MONDAY`……等都是\
  \ `Day` 类的实例。当我们把 `Day.WEDNESDAY` 赋值给 `workDay` 变量时，我们是将 `Day.WEDNESDAY` 对象的地址赋值给该变量。`workDay`\
  \ 变量持有 `Day.WEDNESDAY` 对象的地址。\n\n图 17.2 | `workDay` 变量持有 `Day.WEDNESDAY` 对象的地址。\n\
  \n**注意**：每一个 `enum` 常量始终是隐式的 `public static final`。由于它是 `static` 的，我们可以通过使用 `enum`\
  \ 名称来访问它。由于它是 `final` 的，我们无法创建子枚举。\n\n我们可以在 `enum` 内部声明 `main()` 方法。因此，我们可以直接从命令行提示符调用\
  \ `enum`。\n\n示例 17.2：`Enum3.java`\n```java\n01 package Enum;\n02 /* 一个可以在 enum 类内部拥有\
  \ main() 的 Java 程序。 */\n03 enum Color\n04 {\n05 RED, GREEN, BLUE;\n06 // 驱动方法\n\
  07 public static void main(String[] args)\n08 {\n09 Color c1 = Color.RED;\n10 System.out.println(c1);\n\
  11 }\n12 }\n```\n输出：\nRED\n\n## `toString()`, `values()`, `ordinal()` 和 `valueOf()`\
  \ 方法\n\n### `toString` 方法\n`enum` 常量（实际上是对象）自动配备了几个方法。其中之一就是 `toString` 方法。`toString`\
  \ 方法简单地返回调用者枚举常量的名称作为 `String`。\n\n示例 17.3：假设 `Day` 数据类型如之前所示已声明，以下两个代码段都会显示字符串\
  \ `WEDNESDAY`。记住，当对象传递给 `System.out.println()` 时，会简单地调用 `toString` 方法。\n\n```java\n\
  // 此代码显示 WEDNESDAY\nDay workDay = Day.WEDNESDAY;\nSystem.out.println(workDay);\n\
  \n// 此代码也显示 WEDNESDAY\nSystem.out.println(Day.WEDNESDAY);\n```\n\n### `ordinal`\
  \ 方法\n`ordinal` 方法返回一个表示常量序数的整数值。常量的序数值是它在 `enum` 声明中的位置，第一个常量位于位置 0。\n\n图 17.3\
  \ | `Day` 枚举数据类型及其枚举常量的序数位置。\n\n示例 17.4：假设 `Day` 数据类型如之前所示已声明：\n```java\nDay lastWorkDay\
  \ = Day.FRIDAY;\nSystem.out.println(lastWorkDay.ordinal()); // 5\nSystem.out.println(Day.MONDAY.ordinal());\
  \ // 1\n```\n输出：\n5\n1\n\n### `values` 方法\n`values` 方法返回一个包含所有枚举常量列表的数组。\n\n示例 17.5：`EnumValues.java`\
  \ - 演示 `values` 方法工作的 Java 程序\n```java\n01 enum Day\n02 {\n03 SUNDAY, MONDAY, TUESDAY,\
  \ WEDNESDAY, THURSDAY, FRIDAY, SATURDAY;\n04 }\n05 public class EnumValues {\n06\n\
  07 public static void main(String[] args)\n08 {\n09 // 调用 values() 方法\n10 Day arr[]\
  \ = Day.values();\n11\n12 // 使用循环处理 enum\n13 for (Day day: arr)\n14 {\n15 // 调用\
  \ ordinal() 查找 Day 的索引\n16 System.out.println(day + \" at index \" + day.ordinal());\n\
  17 }\n18 // 使用 valueOf()。返回给定常量的 Day 对象\n19 System.out.println(Day.valueOf(\"MONDAY\"\
  ));\n20 }\n21 }\n```\n输出：\nSUNDAY at index 0\nMONDAY at index 1\nTUESDAY at index\
  \ 2\nWEDNESDAY at index 3\nTHURSDAY at index 4\nFRIDAY at index 5\nSATURDAY at index\
  \ 6\n最后 `Day` 类型中讨论的方法是 `equals` 和 `compareTo`。\n\n### `equals` 方法\n`equals` 方法接受一个对象作为参数，如果该对象等于指定的枚举常量，则返回\
  \ `true`。\n\n示例 17.6：假设 `Day` 数据类型如之前所示已声明，以下代码段将显示 `SAME`。\n```java\n01 package\
  \ ch17;\n02\n03 enum Day\n04 {\n05 SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY,\
  \ FRIDAY, SATURDAY;\n06 }\n07 public class EnumEquals {\n08 public static void main(String[]\
  \ args){\n09 Day workDay = Day.WEDNESDAY;\n10 if (workDay.equals(Day.WEDNESDAY))\
  \ {\n11 System.out.println(\"SAME\");\n12 } else {\n13 System.out.println(\"NOT\
  \ SAME\");\n14 }\n15 }\n16 }\n```\n输出：\nSAME\n解释：`equals` 方法接收 `Day2` 对象作为参数，如果它等于\
  \ `Day.WEDNESDAY` 常量，则返回 `true`。\n\n示例 17.7：`Enum2.java`\n```java\n01 enum Languages\
  \ {\n02 Arabic, English, Spanish, Hindi, Russian, French;\n03 }\n04 class Enum2\
  \ {\n05 public static void main(String[] args){\n06 Languages l1 = Languages.Arabic;\n\
  07 Languages l2 = Languages.English;\n08 Languages l3 = Languages.Spanish;\n09 Languages\
  \ l4 = Languages.Hindi;\n10 Languages l5 = Languages.Russian;\n11 Languages l6 =\
  \ Languages.French;\n12\n13 if (l1.equals(l2)) {\n14 System.out.println(l1 + \"\
  \ is equal to \" + l2);\n15 } else {\n16 System.out.println(l1 + \" is not equal\
  \ to \" + l2);\n17 }\n18 if (l2.equals(l3)) {\n19 System.out.println(l2 + \" is\
  \ equal to \" + l3);\n20 } else {\n21 System.out.println(l2 + \" is not equal to\
  \ \" + l3);\n22 }\n23 if (l3.equals(l4)) {\n24 System.out.println(l3 + \" is equal\
  \ to \" + l4);\n25 } else {\n26 System.out.println(l3 + \" is not equal to \" +\
  \ l4);\n27 }\n28 if (l4.equals(l5)) {\n29 System.out.println(l4 + \" is equal to\
  \ \" + l5);\n30 } else {\n31 System.out.println(l4 + \" is not equal to \" + l5);\n\
  32 }\n33 if (l5.equals(l6)) {\n34 System.out.println(l5 + \" is equal to \" + l6);\n\
  35 } else {\n36 System.out.println(l5 + \" is not equal to \" + l6);\n37 }\n38 }\n\
  39 }\n```\n输出：\nArabic is not equal to English\nEnglish is not equal to Spanish\n\
  Spanish is not equal to Hindi\nHindi is not equal to Russian\nRussian is not equal\
  \ to French\n\n### `compareTo()` 方法\n`compareTo()` 方法设计用于比较相同类型的枚举常量。它接受一个对象作为参数并返回：\n\
  * 负整数值，如果调用常量的序数小于参数的序数值。\n* 零，如果调用常量与参数相同。\n* 正整数值，如果调用常量的序数大于参数的序数值。\n\n这是一个简单的示例。\n\
  示例 17.8：`EnumCompare.java` - 假设 `Day` 数据类型如之前所示已声明，以下代码段将显示 \"FRIDAY is greater\
  \ than SUNDAY\"。\n```java\n01 package ch17;\n02\n03 enum Day3\n04 {\n05 SUNDAY,\
  \ MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY;\n06 }\n07 class EnumCompare\
  \ {\n08 public static void main(String[] args){\n09 Day3 anyDay = Day3.TUESDAY;\n\
  10 if (anyDay.compareTo(Day3.FRIDAY) > 0) {\n11 System.out.println(anyDay + \" is\
  \ greater than \" + Day3.FRIDAY);\n12 } else {\n13 System.out.println(anyDay + \"\
  \ is less than \" + Day3.FRIDAY);\n14 }\n15 }\n16 }\n```\n输出：\nTUESDAY is less than\
  \ FRIDAY\n\n在类内部声明枚举类型的另一个位置。如果你在类内部声明枚举类型，它不能在方法内部。以下示例演示了这一概念。\n示例 17.9：`EnumColors.java`\n\
  ```java\n01 public class EnumColors {\n02 // 在类中声明枚举类型\n03 enum Color\n04 {\n05\
  \ RED, ORANGE, PINK, YELLOW, BLUE, BROWN, GREEN ,PURPLE;\n06 }\n07 public static\
  \ void main(String[] args){\n08 // 声明一个 Color 变量并为其赋值\n09 }\n10 }\n```\n\n\n\n\n\
  ```java\nColor color = Color.RED;\n\n// The following statement displays RED\nSystem.out.println(color);\n\
  \n// The following statement displays the ordinal value for\n// Color.ORANGE, which\
  \ is 1\nSystem.out.println(\"The ordinal value for \" +\nColor.ORANGE + \" is \"\
  \ + Color.ORANGE.ordinal());\n\n// The following statement displays the ordinal\n\
  // value for Color.PURPLE, which is 7\nSystem.out.println(\"The ordinal value for\
  \ \"\n+ Color.PURPLE + \" is \" + Color.PURPLE.ordinal());\n\n// The following statement\
  \ compares two enum constants\nif (Color.ORANGE.compareTo(Color.PURPLE) > 0) {\n\
  \    System.out.println(Color.ORANGE + \" is greater than \"\n    + Color.PURPLE);\n\
  } else {\n    System.out.println(Color.ORANGE + \" is NOT greater than \"\n    +\
  \ Color.PURPLE);\n}\n```\nOutput:\n```\nRED\nThe ordinal value for ORANGE is 1\n\
  The ordinal value for PURPLE is 7\nORANGE is NOT greater than PURPLE\n```\n\n***\n\
  \n## 在其单独的文件编写枚举类型\n\n你也可以将枚举类型声明写在它自己的文件中。如果是这样做，文件名必须与类型名称匹配。例如，如果我们把 `Day` 类型存储在它自己的文件中，我们必须将文件命名为\
  \ `Day.java`。这是合理的，因为枚举数据类型是特化的类。下面的示例演示了这一概念。\n\n### 示例 17.10 : `Day4.java`\n```java\n\
  package ch17;\n\nenum Day4 {\nSUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY,\
  \ SATURDAY;\n}\n```\n`Day4.java` 程序包含一个名为 `Day4` 的枚举数据类型的声明。当编译时，将生成一个名为 `Day4.class`\
  \ 的字节码文件。在这里，`Day4Demo` 程序使用了 `Day4` 枚举数据类型。\n\n### 示例 17.11 : `Day4Demo.java`\n\
  使用这些枚举类型。\n```java\npackage ch17;\n\npublic class Day4Demo {\n    private Day4 d1;\n\
  \    // Driver Method\n    public static void main(String[] args) {\n        Day4\
  \ d1 = Day4.MONDAY;\n        System.out.println(d1);\n    }\n}\n```\nOutput:\n```\n\
  MONDAY\n```\n\n***\n\n## 对枚举类型进行切换\n\nJava 允许你使用 `switch` 语句测试枚举常量。\n\n### 示例 17.12\
  \ : `EnumSwitch.java` - 将枚举类型作为参数传递给 switch 语句\n```java\npackage ch17;\n\nenum Day5\
  \ {\nSUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY;\n}\n// 包含 'Day'\
  \ 对象和 main() 的驱动类\npublic class EnumSwitch {\n    private Day5 day;\n\n    // Constructor\n\
  \    public EnumSwitch(Day5 day) {\n        this.day = day;\n    }\n\n    // 使用\
  \ switch 打印关于日期的一行\n    public void Day5IsLike() {\n        switch (day) {\n   \
  \         case MONDAY:\n                System.out.println(\"Mondays are bad\");\n\
  \                break;\n            case FRIDAY:\n                System.out.println(\"\
  Fridays are better\");\n                break;\n            case SATURDAY:\n   \
  \         case SUNDAY:\n                System.out.println(\"Weekends are best.\"\
  );\n                break;\n            default:\n                System.out.println(\"\
  Midweek days are so-so.\");\n                break;\n        }\n    }\n\n    //\
  \ Driver method\n    public static void main(String[] args) {\n        String str\
  \ = \"MONDAY\";\n        EnumSwitch enumSwitch = new EnumSwitch(Day5.valueOf(str));\n\
  \        enumSwitch.Day5IsLike();\n    }\n}\n```\nOutput:\n```\nMondays are bad\n\
  ```\n\n### 解析\n* `switch` 语句测试 `day` 变量的值。\n* 根据 `day` 的值，程序分支到相应的 `case` 语句。\n\n\
  ***\n\n# Java 中带有自定义值的枚举\n\n默认情况下，枚举有它们自己的字符串值，我们也可以为枚举分配一些自定义值。请参考下面的示例。\n\n###\
  \ 示例 17.13 : `EnumFruits.java`\n```java\nenum Fruits {\nLIME(\"GREEN\"), BANANA(\"\
  YELLOW\"), APPLE(\"RED\");\n}\n```\n在上面的示例中，我们可以看到 `Fruits` 枚举有三个成员，即 `LIME`、`BANANA`\
  \ 和 `APPLE`，它们分别拥有不同的自定义值 `GREEN`、`YELLOW` 和 `RED`。现在要在代码中使用此枚举，请参考下面的示例：\n\n###\
  \ 示例 17.14 : `EnumFruits.java` - 完整代码\n```java\n// 演示如何为枚举赋值的 Java 程序\nenum Fruits\
  \ {\n    // 这将调用带有一个字符串参数的枚举构造函数\n    LIME(\"GREEN\"), BANANA(\"YELLOW\"), APPLE(\"\
  RED\");\n\n    // 声明私有变量以获取值\n    private String fruitCode;\n\n    // getter 方法\n\
  \    public String getCode() {\n        return fruitCode;\n    }\n\n    // 构造函数\n\
  \    private Fruits(String fruitCode) {\n        this.fruitCode = fruitCode;\n \
  \   }\n}\n\n// 驱动\npublic class EnumFruits {\n    public static void main(String[]\
  \ args) {\n        Fruits fr = Fruits.LIME;\n        System.out.println(fr.getCode());\n\
  \n        Fruits fr2 = Fruits.BANANA;\n        System.out.println(fr2.getCode());\n\
  \n        Fruits fr3 = Fruits.APPLE;\n        System.out.println(fr3.getCode());\n\
  \    }\n}\n```\nOutput:\n```\nGREEN\nYELLOW\nRED\n```\n\n\n\n\n*   `toString` 方法简单地将调用者的枚举常量的名称作为\
  \ `String` 类型返回。\n*   `ordinal` 方法返回一个表示常量序数值的整数值。常量的序数值是它在枚举声明中的位置，第一个常量的序数位置为\
  \ 0。\n*   `values` 方法可以用于返回枚举中存在的所有值。\n*   `equals` 方法接受一个对象作为参数，如果该对象等于调用者的枚举常量，则返回\
  \ `true`。\n*   `compareTo` 方法设计用于比较相同类型的枚举常量。\n*   你也可以在它自己的文件中编写枚举类型声明。如果是这样做的话，文件名必须与类型名称匹配。\n\
  *   Java 允许你使用 `switch` 语句对枚举常量进行测试。\n*   如果一个类有一个名为 `finalize` 的方法，它会在该类的实例被垃圾回收器销毁之前自动被调用。\n\
  \n* * *\n\n## 第 18 章\n\n## this 引用变量\n\n### 引言\n`this` 关键字是一个引用变量名，对象可以使用该变量引用它自己。它对所有非静态方法都可用。你可以在实例方法或构造方法内部通过\
  \ `this` 引用当前对象的任何成员。\n\n![Image00134.jpg](img/Figure 18.1 | this 是一个指向当前对象的引用变量。)\n\
  \n### Java this 关键字的用法\n这里是 Java `this` 关键字的 6 种用法。\n\n*   `this` 可以用于引用当前类的实例变量。\n\
  *   `this` 可以用于（隐式地）调用当前类方法。\n*   `this()` 可以用于调用当前类的构造方法。\n*   `this` 可以作为参数传递在方法调用中。\n\
  *   `this` 可以作为参数传递在构造方法调用中。\n*   `this` 可以用于从方法返回当前类的实例。\n\n**建议：** 如果你是 Java 初学者，请只需查找\
  \ `this` 关键字的三种用法。\n\n* * *\n\n## 使用 this 解决变量遮蔽（Shadowing）\n\n#### 在字段上使用 this\n\
  `this` 关键字的一个常见用途是克服参数名对字段名的遮蔽。请记住，如果方法的参数名与同类中的某个字段名相同，那么参数名就会遮蔽字段名。让我们来看一个例子。\n\
  \n**示例 18.1：Square.java 类 - 不使用 this**\n```java\npublic class Square {\n\n    public\
  \ int x = 10;\n    public int y = 10;\n\n    //构造方法\n    public Square(int a, int\
  \ b) {\n        x = a;\n        y = b;\n    }\n}\n```\n\n**示例 18.2：Square2.java\
  \ 类 - 使用 this**\n```java\npublic class Square2 {\n\n    public int x = 0;\n    public\
  \ int y = 0;\n\n    //构造方法\n    public Square2(int x, int y) {\n        this.x =\
  \ x;\n        this.y = y;\n    }\n}\n```\n构造方法的每个参数都遮蔽了对象的字段之一——在构造方法内部，`x` 是构造方法第一个参数的本地拷贝。要引用\
  \ `Square` 字段 `x`，构造方法必须使用 `this.x`。\n\n* * *\n\n## 使用 this 从另一个构造方法调用重载构造方法\n\n\
  记住，在创建对象时会自动调用构造方法。你不能像调用其他方法那样显式地调用构造方法。这条规则有一个例外，你可以使用 `this` 关键字在同一类中从一个构造方法调用另一个构造方法。请考虑下面的示例。\n\
  \n**示例 18.3：Shape.java**\n```java\npublic Shape(int l, int w) {\n    length = l;\n\
  \    width = w;\n}\n```\n此构造方法接受参数并赋值给 `length` 和 `width` 字段。假设我们还想要一个只接受 `length`\
  \ 字段参数并为 `width` 字段赋值 `0.0` 的构造方法。如示例 18.4 所示：\n```java\npublic Shape (int l) {\n\
  \    this(l, 0.0);\n}\n```\n此构造方法使用 `this` 变量调用第一个构造方法。它将 `l` 中的值作为第一个参数传递，并将 `0.0`\
  \ 作为第二个参数。结果是 `length` 字段被赋值为 `l` 的值，`width` 字段被赋值为 `0.0`。在构造方法内部，你也可以使用 `this`\
  \ 关键字调用同一类中的另一个构造方法。这样做被称为显式构造方法调用（Explicit Constructor Invocation）。\n\n**示例 18.5：Square3.java**\n\
  ```java\npublic class Square3 {\n\n    private int x, y;\n    private int width,\
  \ height;\n\n    public Square3() {\n        this(0, 0, 1, 1);\n    }\n\n    public\
  \ Square3(int width, int height) {\n        this(0, 0, width, height);\n    }\n\n\
  \    public Square3(int x, int y, int width, int height) {\n        this.x = x;\n\
  \        this.y = y;\n        this.width = width;\n        this.height = height;\n\
  \    }\n}\n```\n该类包含一组构造方法。每个构造方法初始化 `square3` 的部分或全部成员变量。构造方法为任何未通过参数提供初始值的成员变量提供了默认值。例如，无参数构造方法创建\
  \ 1x1 的 Square。两个参数构造方法调用四参数构造方法，传入 0。\n\n## 第 19 章\n\n## 文本处理与包装类\n\n### 包装类引言\n\
  回顾一下，基本数据类型之所以被称为基本（primitive），是因为它们不是通过类创建的，且变量没有属性或方法。它们被设计用于存储单个值。Java 为所有基本数据类型提供了包装类（Wrapper\
  \ classes）。包装类“封装”了基本类型，允许你创建对象而不是变量。\n\n基本类型的包装类不仅包含该类型的值，还包含与该类型相关的方法。例如，你已经使用包装类的\
  \ `parse` 方法将字符串转换为基本值。虽然这些包装类可以用来对象而不是变量，但很少程序员这样做。为什么呢？\n\n*   因为类是不可变的，这意味着一旦创建了对象就无法更改它的值。\n\
  *   因为对于简单操作，它们没有变量那么容易使用。\n\n例如；要获取对象中存储的值，必须调用方法，而变量可以直接用于赋值语句、数学运算、作为方法的参数等。虽然通常不需要从包装类创建对象，但它们提供了非常有用的静态方法。我们首先查看字符类，它是\
  \ `char` 类型的包装类。\n\n* * *\n\n### 使用 Character 类进行字符测试和转换\n`Character` 类是 `char`\
  \ 类型的包装类。它提供了许多测试和转换字符数据的方法。`Character` 类属于 `java.lang` 包，因此使用该类不需要导入语句。该类提供了几个用于测试\
  \ char 变量值的的静态方法。其中一些方法列在下表中。每个方法都接受单个 `char` 参数并返回一个布尔值。\n\n表 19.1 | 用于测试字符值的某些静态\
  \ Character 类方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `boolean isDigit(char ch)` |\
  \ 如果传入的 `ch` 是数字 0 到 9，则返回 `true`。否则返回 `false`。 |\n| `boolean isLetter(char ch)`\
  \ | 如果传入的 `ch` 是字母，则返回 `true`。否则返回 `false`。 |\n\n\n\n\n\n| 方法 | 说明 |\n| :--- | :---\
  \ |\n| `boolean isLetterOrDigit(char ch)` | 如果传递给 `ch` 的字符包含数字（0 到 9）或字母，则返回 true。否则返回\
  \ false。 |\n| `boolean isLowerCase(char ch)` | 如果传递给 `ch` 的参数是小写字母，则返回 true。否则返回\
  \ false。 |\n| `boolean isUpperCase(char ch)` | 如果传递给 `ch` 的参数是大写字母，则返回 true。否则返回\
  \ false。 |\n| `boolean isSpaceChar(char ch)` | 如果传递给 `ch` 的参数是空格字符，则返回 true。否则返回\
  \ false。 |\n| `boolean isWhiteSpace(char ch)` | 如果传递给 `ch` 的参数是空白字符（空格、制表符或换行符），则返回\
  \ true。否则返回 false。 |\n\n下面是一个使用 `Character` 类和静态方法 `isLetter()` 的程序示例。\n\n### 示例\
  \ 19.1: CharacterTest.java\n\n```java\npackage ch19;\n\nimport java.util.Scanner;\n\
  \npublic class CharacterTest\n{\n    public static void main(String[] args)\n  \
  \  {\n        String input; // 用于存储用户的输入\n        char ch; // 用于存储单个字符\n\n     \
  \   // 从用户处获取一个字符并存储 \n        // 在 ch 变量中。\n        Scanner sc = new Scanner(System.in);\n\
  \        System.out.println(\"Enter any single character\");\n        input = sc.nextLine();\n\
  \        ch = input.charAt(0);\n\n        // 测试该字符。\n        if (Character.isLetter(ch))\n\
  \        {\n            System.out.println(\"That is a letter.\");\n        }\n\n\
  \        if (Character.isDigit(ch))\n        {\n            System.out.println(\"\
  That is a digit.\");\n        }\n    }\n}\n```\n\n**输出：**\n```\nEnter any single\
  \ character\nr\nThat is a letter.\n```\n\n下面是一个程序示例，用于测试一个字符串以确定其是否为符合格式的 7 位客户编号。\n\
  \n### 示例 19.2: CustomerNumber.java\n\n```java\npackage ch19;\n\nimport java.util.Scanner;\n\
  \npublic class CustomerNumber\n{\n    public static void main(String[] args)\n \
  \   {\n        String input; // 用于存储用户的输入\n\n        // 获取一个客户编号。\n        Scanner\
  \ sc = new Scanner(System.in);\n        System.out.println(\"Enter a customer number\
  \ in the form LLLNNNN\\n\" +\n        \"(LLL = Letters and NNNN = numbers\");\n\
  \        input = sc.nextLine();\n\n        // 验证输入。\n        if (isValid(input))\n\
  \        {\n            System.out.println(\"That's a valid customer number.\");\n\
  \        }\n        else\n        {\n            System.out.println(\"That is not\
  \ the proper format of a \" +\n            \"customer number.\\nHere is an example:\
  \ ABC1234\");\n        }\n    }\n\n    private static boolean isValid(String custNumber)\n\
  \    {\n        boolean goodSoFar = true; // 标记\n        int i = 0; // 控制变量\n\n\
  \        // 测试长度。\n        if (custNumber.length() != 7)\n            goodSoFar\
  \ = false;\n\n        // 测试前三个字符是否为字母。\n        while (goodSoFar && i < 3)\n   \
  \     {\n            if (!Character.isLetter(custNumber.charAt(i)))\n          \
  \      goodSoFar = false;\n            i++;\n        }\n\n        // 测试后四个字符是否为数字。\n\
  \        while (goodSoFar && i < 7)\n        {\n            if (!Character.isDigit(custNumber.charAt(i)))\n\
  \                goodSoFar = false;\n            i++;\n        }\n        return\
  \ goodSoFar;\n    }\n}\n```\n\n### 解析\n\n- 它测试一个字符串，以确定其是否为符合格式的七位客户编号。\n- 客户编号预期长度为\
  \ 7 位，由 3 个字母后跟 4 个数字位组成。\n- `isValid` 方法接收一个 `String` 参数，并对其进行测试。\n- 该方法使用了以下局部变量，它们声明在第\
  \ 32 行和第 33 行中：\n    - `boolean goodSoFar = true;` // 标记\n    - `int i = 0;` //\
  \ 控制变量\n- 测试长度。在 `custNumber.length() != 7` 时，将 `goodSoFar` 设为 false。\n- 测试前三个字符是否为字母。在\
  \ `while (goodSoFar && i < 3)` 循环中，如果 `!Character.isLetter(custNumber.charAt(i))`\
  \ 为真，则将 `goodSoFar` 设为 false。\n- 测试后四个字符是否为数字。在 `while (goodSoFar && i < 7)` 循环中，如果\
  \ `!Character.isDigit(custNumber.charAt(i))` 为真，则将 `goodSoFar` 设为 false。\n- 返回 `goodSoFar`\
  \ 的值。\n\n#### Character 类的大小转换方法\n\n`Character` 类还提供了静态方法：\n\n| 方法 | 说明 |\n| :---\
  \ | :--- |\n| `toLowerCase(char ch)` | 返回传递给 `ch` 的参数的小写形式。 |\n| `toUpperCase(char\
  \ ch)` | 返回传递给 `ch` 的参数的大写形式。 |\n\n- 如果 `toLowerCase` 的参数是大写字母，则该方法返回其小写形式。\n- 如果参数已经是小写的，`toUpperCase`\
  \ 将其原样返回。\n- 传递给 `toLowerCase` 或 `toUpperCase` 的任何非字母字符都按原样返回。下面的示例计算并显示圆的面积。\n\n\
  ### 示例 19.5: CircleArea.java\n\n```java\nimport java.util.Scanner;\nimport java.text.DecimalFormat;\n\
  \npublic class CircleArea\n{\n    public static void main(String[] args)\n    {\n\
  \        double radius; // 圆的半径\n        double area; // 圆的面积\n        String input;\
  \ // 用于存储一行输入\n        char choice; // 用于存储单个字符\n\n        // 创建一个 Scanner 对象读取键盘输入。\n\
  \        Scanner keyboard = new Scanner(System.in);\n\n        // 创建一个 DecimalFormat\
  \ 对象。\n        DecimalFormat fmt = new DecimalFormat(\"0.00\");\n\n        do\n\
  \        {\n            // 获取圆的半径。\n            System.out.print(\"Enter the circle's\
  \ radius: \");\n            radius = keyboard.nextDouble();\n\n            // 消耗剩余的换行符。\n\
  \            keyboard.nextLine();\n\n            // 计算并显示面积。\n            area =\
  \ Math.PI * radius * radius;\n            System.out.println(\"The area is \" +\n\
  \            fmt.format(area));\n\n            // 重复这个？\n            System.out.print(\"\
  Do you want to do this again? (Y or N) \");\n            input = keyboard.nextLine();\n\
  \            choice = input.charAt(0);\n\n        } while (Character.toUpperCase(choice)\
  \ == 'Y');\n    }\n}\n```\n\n**输出：**\n```\nEnter the circle's radius: 12\nThe area\
  \ is 452.39\nDo you want to do this again? (Y or N) n\n```\nProcess finished with\
  \ exit code 0\n\n\n\n\n\n## 查找子字符串\n\n`String` 类提供了几种用于搜索和处理 `String` 对象的方法。`String`\
  \ 类提供了多种方法在字符串内部查找另一个字符串。“子字符串”（substring）一词通常指作为另一个字符串部分的字符串。\n\n### 表 19.3 | 搜索子字符串的\
  \ String 方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `boolean startsWith(String str)`\
  \ | 如果调用字符串以传入 `str` 的字符串开头，则该方法返回 true。 |\n| `boolean endsWith(String str)` | 如果调用字符串以传入\
  \ `str` 的字符串结尾，则该方法返回 true。 |\n| `boolean regionMatches(int start, String str, int\
  \ start2, int n)` | 如果调用字符串的指定区域与传入 `str` 的字符串的指定区域匹配，则该方法返回 true。`start` 参数表示该区域在调用字符串中的起始位置。`start2`\
  \ 参数表示该区域在 `str` 中的起始位置。`n` 参数表示两个区域中的字符数。 |\n| `boolean regionMatches(Boolean ignoreCase,\
  \ int start, String str, int start2, int n)` | 该 `regionMatches` 方法的重载版本有一个额外参数\
  \ `ignoreCase`。如果向此参数传入 true，方法在比较区域时忽略调用字符串和 `str` 的大小写。如果向 `ignoreCase` 参数传入 false，则比较是区分大小写的。\
  \ |\n\n每个这些方法都返回一个布尔值，表示是否找到了该字符串。让我们详细查看这些这些方法。\n\n## startsWith 和 endsWith 方法\n\
  \n`startsWith` 方法确定调用对象的字符串是否以指定的子字符串开头。\n\n**示例 19.6**: 确定字符串 \"Four Score and\
  \ Sever Years Ago\" 是否以 \"four\" 开头。如果字符串以指定的子字符串开头，方法返回 true，否则返回 false。\n\n```java\n\
  01 String str = \"Four Score and Severn Year Ago.\";\n02 if (str.startsWith(\"Four\"\
  ))\n03 System.out.println(\"The string starts with four.\");\n04 else\n05 System.out.println(\"\
  The string does not start with four\");\n```\n\n**解释**\n- 方法调用 `str.startsWith(\"\
  Four\")` 返回 true，因为字符串确实是以 \"Four\" 开头的。\n- `startsWith` 方法执行区分大小写的比较，所以方法调用 `str.startsWith(\"\
  four\")` 将返回 false。\n\n**示例 19.7**: 确定字符串 \"Four score and seven years ago\" 是否以\
  \ \"go\" 结尾。如果字符串确实以指定的子字符串结尾，方法返回 true，否则返回 false。\n\n```java\n01 String str =\
  \ \"Four Score and Severn Year Ago.\";\n02 if (str.endsWith(\"Ago\"))\n03 System.out.println(\"\
  The string starts with Ago.\");\n04 else\n05 System.out.println(\"The string does\
  \ not start with Ago\");\n```\n\n`endsWith` 方法同样执行区分大小写的比较，所以方法 `str.endsWith(\"\
  Ago\")` 返回 true，因为字符串确实是以 Ago 结尾。\n\n**示例 19.8**: PersonSearch.java - 显示所有以用户输入的字符串头的名称\n\
  \n```java\n01 package ch19;\n02\n03 import java.util.Scanner;\n04 public class PersonSearch\n\
  05 {\n06 public static void main(String[] args)\n07 {\n08 String lookUp; // 用于存储查找字符串\n\
  09\n10 // 创建名称数组\n11 String[] people = {\n12 \"Mohammed, Mansour\",\n13 \"Davis,\
  \ George\",\n14 \"Osman, Ahmed\",\n15 \"Russert, Phil\",\n16 \"Russell, Cindy\"\
  ,\n17 \"Setzer, Charles\",\n18 \"Smathers, Holly\",\n19 \"Smith, Chris\",\n20 \"\
  Smith, Brad\",\n21 \"Williams, Jean\"\n22 };\n23\n24 // 创建用于键盘输入的 Scanner 对象。\n\
  25 Scanner keyboard = new Scanner(System.in);\n26\n27 // 获取用于搜索的部分名称。\n28 System.out.print(\"\
  Enter the first few characters of \" +\n29 \"the last name to look up: \");\n30\
  \ lookUp = keyboard.nextLine();\n31\n32 // 显示所有以用户输入的\n33 字符串头的名称。\n34 System.out.println(\"\
  Here are the names that match:\");\n35 for (String person : people)\n36 {\n37 if\
