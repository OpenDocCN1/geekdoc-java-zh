  }\n```\n\n#### handlerDecimal 方法\n```java\n@FXML\npublic void handlerDecimal (ActionEvent\
  \ event){\n    if (decimalClick == 0) {\n        String decimalObject = ((Button)event.getSource()).getText();\n\
  \        String oldText = txtDisplay.getText();\n        System.out.println(oldText);\n\
