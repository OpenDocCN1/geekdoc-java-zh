  \ Markdown 格式。)\n\n\n\n\n## 类成员的布局\n\n每个类的实例（或对象）都有其自己的一组字段，这些字段被称为实例字段（instance\
  \ fields）。你可以创建一个类的多个实例，并并在每个实例的字段中存储不同的值。对类实例的操作的方法称为实例方法（instance methods）。\n\n\
