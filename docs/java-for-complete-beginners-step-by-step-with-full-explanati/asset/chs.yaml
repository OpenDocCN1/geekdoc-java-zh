  \ 和 lastIndexOf 方法查找字符\n\n`indexOf` 和 `lastIndexOf` 方法可以在调用的字符串中搜索字符或子字符串。如果找到了要搜索的项，则返回其位置。否则，返回\
  \ -1。\n\n### 示例 19.11：FindChar.java - 使用两种方法搜索一个字符\n```java\nString str = \"Four\
  \ Score and Seven Year ago\";\nint first, last;\nfirst = str.indexOf('r');\nlast\
  \ = str.lastIndexOf('r');\nSystem.out.println(\"The letter r first appears at \"\
  \ +\n\"position \" + first);\nSystem.out.println(\"The letter r last appears at\
  \ \" +\n\"position \" + last);\n```\n**输出：**\nThe letter r first appears at position\
  \ 3\nThe letter r last appears at position 24\n\n### 示例 19.12：FindChar2.java - 使用循环显示字符串中每个字母\
  \ ‘r’的位置\n```java\nString str = \"Four Score and Seven Year ago\";\nint position;\n\
  System.out.println(\"The letter r appears at the following locations:\");\nposition\
  \ = str.indexOf('r');\nwhile (position != -1)\n{\n    System.out.println(position);\n\
  \    position = str.indexOf('r', position + 1);\n}\n```\n**输出：**\nThe letter r appears\
