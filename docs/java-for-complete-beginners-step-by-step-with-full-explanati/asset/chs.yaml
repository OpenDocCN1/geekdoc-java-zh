  \ 方法会抛出 `IndexOutOfBoundsException` – 如果指定的索引超出了 `ArrayList` 的范围（`fromIndex < 0\
  \ || toIndex > size`）。\n- `IllegalArgumentException` – 如果起始索引大于结束点索引（`fromIndex\
  \ > toIndex`）。\n\n### 获取 ArrayList 中元素最后一次出现的索引\n`lastIndexOf(Object obj)` 方法返回指定元素在\
  \ `ArrayList` 中最后一次出现的索引。如果指定元素不存在于列表中，则返回 `-1`。\n\n**语法**\n```java\npublic int\
