  \n## 浮点数字面量\n\nJava 有两种浮点数：`float` 和 `double`。如果浮点数字面量以字母 `F` 或 `f` 结尾，则它是 `float`\
  \ 类型；否则它的类型是 `double`，并且可以选择以字母 `D` 或 `d` 结尾。例如：\n\n`float fl = 12.6f;`\n\n我们还可以使用科学计数法（短写\
  \ `E`）指定浮点数字面量。`F` 或 `f`（32 位 float 字面量）以及 `D` 或 `d`（64 位 double 字面量；这是默认）。这里是一个使用这些字面量的简单示例。\n\
  \n示例 3.26：DoubleFloat.java\n```java\ndouble d1 = 123.4;\ndouble d2 = 1.234e2; //\
  \ 与 d1 值相同，但使用科学计数法\nfloat f1 = 123.4f;\ndouble d3 = 3.4d;\n```\n\n示例 3.27：FloatingPointLiteral.java\n\
  ```java\npackage ch03;\n\npublic class FloatPointLiteral {\n    public static void\
  \ main(String[] args){\n        double d1 = 123.4;\n        System.out.println(\"\
  d1 : \" + d1);\n\n        double d2 = 1.234e2;\n        System.out.println(\"d2\
  \ : \" + d2);\n\n        float f1 = 123.4f;\n        System.out.println(\"f1 : \"\
  \ + f1);\n\n        double d3 = 3.4d;\n        System.out.println(\"d3 : \" + d3);\n\
  \n        double no = 1_587_3_82.0;\n        System.out.println(\"no : \" + no);\n\
  \    }\n}\n```\nOutput:\n```\nd1 : 123.4\nd2 : 123.4\nf1 : 123.4\nd3 : 3.4\nno :\
  \ 1587382.0\n```\n\n## 字符字面量\n\n字符字面量用一对单引号括起的单个字符表示。例如：`'b'`、`'*'` 和 `'7'`。Java\
  \ 通过 16 位 Unicode 标准支持数千个额外字符。下表显示了这些特殊字符的集合。\n\n表 3.6 | 字符字面量\n| Char | 十进制 | 二进制\
  \ | 十六进制 | 八进制 |\n| :--- | :--- | :--- | :--- | :--- |\n| \" | 34 | 1000010 | 21\
  \ | 41 |\n| 1 | 49 | 110001 | 31 | 61 |\n| A | 65 | 1000001 | 41 | 101 |\n| B |\
  \ 66 | 1000010 | 42 | 102 |\n\n如果你想将单引号、空斜杠或不可打印字符作为字符字面量，请使用转义序列。转义序列使用特殊的语法来表示字符。该语法以单个反斜杠字符开始。\n\
  \n表 3.7 | 字符转义码\n| Escape | 含义 |\n| :--- | :--- |\n| `\\n` | 换行 |\n| `\\t` | 制表符\
  \ |\n| `\\b` | 退格 |\n| `\\r` | 回车 |\n| `\\f` | 换页 |\n| `\\\\` | 反斜杠 |\n| `\\'` |\
  \ 单引号 |\n| `\\\"` | 双引号 |\n| `\\d` | 八进制 |\n| `\\rd` | 十六进制 |\n\n下表查看使用 Unicode\
  \ 转义序列表示可打印和不可打印字符的字符字面量。\n\n表 3.8 | Unicode 转义序列与可打印/不可打印字符\n| Unicode Escape Sequence\
  \ | 可打印和不可打印字符 |\n| :--- | :--- |\n| `\\u0041` | 大写字母 A |\n| `\\u0030` | 数字 0 |\n\
  | `\\u0022` | 双引号 |\n| `\\u003b` | 标点符号 |\n| `\\u0020` | 空格 |\n| `\\u0009` | 水平制表符\
  \ |\n| `\\u004D` | 大写字母 M |\n\n下面是一个说明转义序列使用的 Java 程序。\n\n示例 3.28：ChEscape.java\n\
