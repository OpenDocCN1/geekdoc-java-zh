- "# Java 初学者指南：针对 Java 初学者的分步详细讲解\n\n\n\n![](img/Image00000.jpg)\n\n\n\n\n\n\n***\n\
  \n## 前言\nJava 是开发者最青睐的语言之一，涵盖了游戏、超级计算机甚至家电的各个领域。本 Java 编程书籍旨在让读者理解面向对象的编程方法，并在此过程中培养一些实用技能。书中将解释的概念和培养的技能在许多使用现代面向对象语言的程序员中是通用的，因此可以在不同语言之间迁移。然而，出于实际考虑，这些概念将使用\
  \ Java 编程语言进行探索和演示。\n\nJava 编程语言被用于强调和演示基础对象的应用（包括循环的使用、选择语句、计算、数组、数据类型以及对文件处理的基本理解），以及\
  \ JavaFX 的基本概念。\n\n本书具有实用目的，因此首要目标是展示“如何做”。当然，书中也有更具理论性的解释，但我尽量减少理论材料，以便让你快速达到编写程序所需的内容。大部分内容通过大量的示例以及相关的说明来呈现。\n\
  \n本书是编程和 Java 语言的入门。它对读者没有特殊假设，适用于任何想或需要学习编程的人。因此，读者不需要具备编程知识，前提是读者对编程感兴趣，并且电脑上安装了\
  \ `IntelliJ IDEA`。\n\n当你读完本书后，将熟练掌握 Java 语言基础，并能够在日常 Java 编程工作中使用它们。\n\nMohammed\
