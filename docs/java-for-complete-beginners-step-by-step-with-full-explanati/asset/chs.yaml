  Index of 'D':3\nIndex of 'E':4\n```\n\n### 检查元素是否存在于 ArrayList\nArrayList `contains()`\
  \ 方法用于检查列表中是否存在指定的元素。\n\n**语法**\n```java\npublic boolean contains(Object element)\n\
