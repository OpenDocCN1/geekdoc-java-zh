  \ following positions:\n20\n28\n\n*** 提取子字符串\n\n`String` 类提供了几种方法允许你从字符串中提取子字符串。\n\
  \n### 表 19.5 | 提取子字符串的方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `String substring(int\
  \ start)` | 返回从 `start` 开始到对象末尾的子字符串拷贝。 |\n| `String substring(int start, int end)`\
  \ | 返回子字符串的拷贝。传入 `start` 是子字符串的起始位置，传入 `end` 是子字符串的结束位置。包含起始位置的字符，但不包含结束位置的字符。 |\n\
  | `void getChars(int start, int end, char[] array, int arrayStart)` | 该方法从调用对象提取子字符串并存储在\
  \ `char` 数组中。传入 `start` 是子字符串的起始位置，传入 `end` 是子字符串的结束位置（子字符串的最后一个字符位于 `end - 1`）。`arrayStart`\
  \ 参数指定要存储字符在数组中的起始位置。 |\n| `char[] toCharArray()` | 将调用对象中的所有字符作为 `char` 数组返回。 |\n\
  \n`substring` 方法返回调用对象的子字符串拷贝。该方法有两个重载版本。\n\n* 第一个版本接受 `int` 参数，即子字符串的起始位置。\n* 该方法返回包含从起始位置到字符串末尾字符的\
  \ `String` 对象引用。\n* 起始位置的字符是子字符串的一部分。\n\n考虑下面的示例。\n\n### 示例 19.16：FindSubStr3.java\n\
  ```java\nString fullName = \"Mohammed Abdelmoniem\";\nString lastName = fullName.substring(8);\n\
