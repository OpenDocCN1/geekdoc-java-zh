  ***\n\n## 三元运算符 (`? :)`)\n\n它与 `if…else` 语句密切相关。它是 Java 中唯一的三元运算符。该运算符的目标是决定将哪个值赋值给变量。\n\
  \n#### 三元运算符\n它是唯一一个接受三个操作数的条件运算符（`3 操作数 + 条件运算符 = 条件表达式`）。\n\n#### 语法\n```java\n\
  variable x = (expression) ? value if true : value if false;\n```\n\n#### 解释\n* 第一个操作数是条件\
  \ `(expression)`。\n* 第二个操作数是当条件为真时整个条件表达式的值。\n* 第三个操作数是当条件为假时整个条件表达式的值。\n\n让我们在一个简单的\
  \ Java 程序中看看 Java 三元运算符的示例。\n示例 5.11：`Ternary1.java`\n```java\n01 package ch05;\n\
  \n02 public class Ternary1 {\n03 public static void main(String[] args) {\n04 int\
  \ x = 10;\n05 System.out.println(x >= 10 ? \"OK\" : \"Failed\");\n06 }\n07 }\n```\n\
  输出：\n```\nOK\n```\n解释：\n* 第 04 行：`x >= 10` 是条件（第一个操作数）。\n* 第 05 行：如果条件为真，则显示 `\"\
  OK\"`（第二个操作数）。\n* 第 05 行：如果条件为假，则显示 `\"Failed\"`（第三个操作数）。\n* 第 05 行：`println()`\
  \ 方法在屏幕上显示 \"OK\" 消息。\n\n条件表达式可以是一个简单的布尔值，也可以是要待执行的动作（求值为布尔值的语句），例如 `(a < 0)` 语句。这里有另一个非常清晰地演示这一点的示例。\n\
  示例 5.12：`Ternary2.java`\n```java\n01 package ch05;\n\n02 public class Ternary2 {\n\
  03 public static void main(String[] args) {\n04 int x = 60;\n05 x = (x > 100) ?\
  \ 20 : 30;\n06 System.out.println(x);\n07 }\n08 }\n```\n输出：\n```\n30\n```\n解释（第\
  \ 05 行）：\n* `x > 100` 是条件（第一个操作数）。\n* `20` 在条件为真时显示（第二个操作数）。\n* `30` 在条件为假时显示（第三个操作数）。\n\
  \n如你所见，我们正在使用 Java 三元运算符来避免 `if-else` 和 `switch case` 语句。通过这种方式，我们减少了 Java 程序中的代码行数。这就是\
  \ Java 三元运算符的简要总结。\n\n***\n\n### 嵌套 if…else 语句\n\n通过将 `if…else` 语句放置在 `if…else`\
  \ 语句内部来测试多种情况。这个程序演示了外部和内部 `if` 语句的概念。\n示例 5.13：`OuterInnerIf.java`\n```java\n01\
  \ package ch05;\n\n02 public class OuterInnerIf {\n03 public static void main(String[]\
  \ args) {\n04 int x = 50;\n05 if (x > 0) // 外部 if\n06 {\n07 if (x < 100) // 内部 if\n\
  08 {\n09 System.out.println(\"X is between 0 and 100\");\n10 }\n11 }\n12 }\n```\n\
  输出：\n```\nX is between 0 and 100\n```\n解释（Java 运行这段代码时做了什么）：\n* 评估外部 `if` 条件。如果它为假，就不运行其\
  \ `if` 体（即内部 `if`）。\n* 评估外部 `if` 条件。如果它为真，运行其 `if` 体（`println()` 语句）。\n\n你也可以在外部\
  \ `if` 语句的 `if` 体中包含一个内部 `if` 语句。\n示例 5.14：`IfElse.java`\n```java\n01 package ch05;\n\
  \n02 public class IfElse {\n03 public static void main(String[] args) {\n04 int\
  \ x = 90;\n05 if (x > 0)  // 外部 if\n06 {\n07 System.out.println(\"Outer If\");\n\
  08 if (x < 100)  // 内部 if\n09 {\n10 System.out.println(\"X is between 0 and 100\"\
  );\n11 }\n12 }\n13 }\n```\n输出：\n```\nOuter If\nX is between 0 and 100\n```\n解释：\n\
  * 在这种情况下，外部 `if` 的 `if` 体包含一个 `println()` 语句和一个内部 `if`。\n* 内部 `if` 的 `if` 体包含一个\
  \ `println()` 语句。\n\n## 逻辑运算符\n\n逻辑运算符用于在 `if` 体中组合布尔表达式。逻辑运算符有 `&&`、`||` 和 `!`。\n\
  \n#### `&&` 运算符\n`&&` 运算符被称为逻辑与。它接受两个表达式，只有当两个子条件都为真时，布尔表达式为真。\n\n#### 语法\n```java\n\
  if (firstExpression && secondExpression ){\n    // 语句\n}\n```\n\n示例 5.15：`LogicalAnd.java`\n\
  ```java\n01 package ch05;\n\n02 public class LogicalAnd {\n03 public static void\
  \ main(String[] args) {\n04 int temp = 10;\n05 int minutes = 15;\n06 if (temp >\
  \ 20 && minutes < 12){\n07 System.out.println(\"The Temperature is in the danger\
  \ zone\");\n08 }\n09 }\n```\n输出：\n```\nNothing\n```\n解释：\n* 第 06 行：两个布尔表达式组合为一个表达式。\n\
  * 第一个表达式 `temp > 20` 为假。\n* 第二个表达式 `minutes < 12` 为假。\n* 因此，布尔表达式的结果为假（TRUE && FALSE\
  \ = FALSE）。\n* 因此，整个表达式为假，不显示消息。\n\n表 5.4 | `&&` 运算符的真值表\n| 表达式 | 表达式的值 |\n| :---\
  \ | :--- |\n| `T && T` | `T` | `&&` 运算符的两侧都为真时，运算符返回真值。 |\n| `F && F` | `F` | |\n\
  | `F && T` | `F` | |\n| `F && F` | `F` | |\n\n`&&` 运算符执行短路求值（它是如何工作的？）：\n如果 `&&`\
  \ 运算符左侧的表达式为假，则不会检查右侧表达式。因为只要有一个子表达式为假，整个表达式为假，检查剩余表达式将浪费 CPU 时间。因此，当 `&&` 运算符发现左侧表达式为假时，它会短路且不评估右侧表达式。\n\
  \n#### `||` 运算符\n`||` 运算符被称为逻辑或。它接受两个布尔表达式，当其中任一子表达式为真时，布尔表达式为真。让我们来看一个示例。\n示例 5.16：`LogicalOr.java`\n\
  ```java\n01 package ch05;\n\n02 public class LogicalOr {\n03 public static void\
  \ main(String[] args) {\n04 int temp = 10;\n05 int minutes = 15;\n06 if (temp >\
  \ 20 || minutes < 12){\n07 System.out.println(\"The Temperature is in the danger\
  \ zone\");\n08 }\n09 }\n10 }\n```\n\n\n\n\n\n```java\n05 int temp = 101;\n06 if\
  \ (temp < 20 || temp > 100) {\n08 System.out.println(\"The Temperature is in the\
  \ danger zone\");\n10 }\n```\n**输出：**\nThe Temperature is in the danger zone\n\n\
  #### 解释\n* 如果温度小于 20 或者温度大于 100，将显示该消息。\n* 如果其中任何一个关系测试为真，整个表达式即为真。\n\n#### 表 5.5\
  \ | `||` 运算符的真值表\n| 表达式 | 值 |\n| :--- | :--- |\n| `T \\| F` | T |\n| `F \\| T` |\
  \ T |\n| `F \\| F` | F |\n| `T \\| T` | T |\n\n### `!` 运算符\n`!` 运算符执行逻辑非操作。它是一个一元运算符，接收一个\
  \ `Boolean` 表达式并反转其逻辑值。这意味着如果表达式为真，`!` 运算符返回 `false`；如果表达式为假，它返回 `true`。这里是一个简单的示例。\n\
  \n#### 示例 5.17：LogicalNot.java\n```java\n01 package ch05;\n02 public class LogicalNot\
  \ {\n03 public static void main(String[] args) {\n04 int temp = 90;\n05 if (!(temp\
  \ > 100)) {\n07 System.out.println(\"This is below the maximum temperature\");\n\
  09 }\n10 }\n}\n```\n**输出：**\nThis is below the maximum temperature\n\n#### 解释\n\
  * 首先，测试表达式 `( temp > 100 )`，结果为 `true` 或 `false`。\n* 其次，将 `!` 运算符应用于该值。\n* 如果表达式\
  \ `( temp > 100 )` 为真，`!` 运算符返回 `false`。\n* 如果表达式 `( temp > 100 )` 为假，`!` 运算符返回\
  \ `true`。\n\n#### 表 5.6 | `!` 运算符的真值表\n| 表达式 | 值 |\n| :--- | :--- |\n| `!true` |\
  \ 0 |\n| `!false` | 1 |\n\n## 逻辑运算符的优先级和结合性\n与其他运算符一样，逻辑运算符也有优先级顺序和结合性。\n\n####\
  \ 按优先级排序的逻辑运算符\n| 运算符 | 优先级 |\n| :--- | :--- |\n| `!` | 优先级较高 |\n| `&&` | |\n| `||`\
  \ | 优先级较低 |\n\n**注意：** `!` 总是将它的操作数括在括号内，除非你打算将其应用于变量或没有其他运算符的简单表达式。\n\n#### 示例：LogicalNot2.java\
  \ - 错误写法\n```java\n01 package ch05;\n02 public class LogicalNot2 {\n03 public static\
  \ void main(String[] args) {\n04 int x = 20;\n05 if !(x > 2) // 错误写法\n07 System.out.println(\"\
  Hi\");\n09 }\n10 }\n}\n```\n**输出：**\n`C:\\MyProjects\\JavaPro1\\src\\chapter5\\\
  LogicalNot2.java`\n`Error:(6, 11) java: '(' expected`\n`Error:(6, 20) java: ')'\
  \ expected`\n\n#### 解释\n* 第 05 行：将 `!` 运算符应用于表达式 `x` 大于 2。\n* 第 05 行：尝试仅将 `!` 运算符应用于\
  \ `x`。它在询问“`x` 的逻辑补码大于 2 吗？”\n* 因为 `!` 运算符只能应用于布尔表达式，此语句会导致编译器错误。\n\n#### 正确的写法是（修改第\
  \ 05 行）：`!(x > 2))` 始终使用括号\n* `(a > b) && (x < y)` 等同于：`a > b && x < y`\n* `(x ==\
  \ y) || (b > a)` 等同于：`x==y || b > a`\n\n逻辑运算符从左到右计算表达式。例如：\n`a < b || y == 2; //\
  \ 先计算 y == 2`\n`a < b || y == 2 && m > j;` \n`// 该表达式的计算结果为：`\n`// (a < b) || (y\
  \ == 2) && (m > j))`\n\n#### 示例 5.18：NotOp.java\n```java\n01 public class NotOp\
  \ {\n02 public static void main(String[] args){\n03 int x = 10;\n04 if (!(x > 2)){\n\
  05 System.out.println(\"True\");\n06 }\n07 System.out.println(\"False\");\n08 }\n\
  09 }\n```\n\n#### 表 5.7 | 所有运算符的优先级\n| 优先级顺序 | 运算符 | 描述 |\n| :--- | :--- | :---\
  \ |\n| 1 | `-` (一元运算符) | 一元负，逻辑非 |\n| 2 | `* / %` | 乘法、除、取模 |\n| 3 | `+ -` | 加法、减法\
  \ |\n| 4 | `< > <= >=` | 小于、大于、小于等于、大于等于 |\n| 5 | `== !=` | 等于、不等于 |\n| 6 | `&&`\
  \ | 逻辑与 |\n| 7 | `||` | 逻辑或 |\n| 8 | `= += -= *= /= %=` | 赋值 |\n\n\n\n\n\n```java\n\
  09 System.out.println(\"Enter the letter grades\");\n10 int grade = input.nextInt();\n\
  11 switch (grade){\n12 case 'A':\n13 case 'a': ++aCount; break;\n14 case 'B':\n\
  15 case 'b': ++bCount; break;\n16 case 'C':\n17 case 'c': ++cCount; break;\n18 case\
  \ '\\n':\n19 case '\\t':\n20 case ' ' : break;\n21 default:\n22 System.out.println(\"\
  Incorrect letter grade entered\");\n23 System.out.println(\"Enter a new grade.\"\
  );\n24 }\n25 System.out.println(\"Totals for each grade are: \\n\");\n26 System.out.println(\"\
  A: \" + aCount);\n27 System.out.println(\"B: \" + bCount);\n28 System.out.println(\"\
  C: \" + cCount);\n29 input.close();\n30 }\n31 }\n```\n\n#### 解释\n\n- `break` 语句是可选的。如果我们省略了\
  \ `break`，执行将继续到下一个 `case`。\n- 有时在多个 `case` 之间不使用 `break` 语句是有用的。例如，考虑上面的程序，无论 `grade`\
  \ 的值为 `A` 还是 `a`，它都会增加变量 `aCount` 的值。当 `grade` 值为 `B` 或 `b` 时，它也会增加 `bCount` 的值，以此此类推。\n\
  \n### 示例 5.24: Switch3.java\n考虑以下 Java 程序，它声明了一个名为 `month` 的 `int` 变量，其值代表一个月份（1\
  \ 到 12）。该代码使用 `switch` 语句根据 `month` 的值显示月份名称。01 package ch05;\n02 public class Switch3\
  \ {\n03 public static void main(String[] args){\n04 int month = 5;\n05 String monthString;\n\
  06\n07 switch (month)\n08 {\n09 case 1: monthString = \"January\"; break;\n10 case\
  \ 2: monthString = \"February\"; break;\n11 case 3: monthString = \"March\"; break;\n\
  12 case 4: monthString = \"April\"; break;\n13 case 5: monthString = \"May\"; break;\n\
  14 case 6: monthString = \"June\"; break;\n15 case 7: monthString = \"July\"; break;\n\
  16 case 8: monthString = \"August\"; break;\n17 case 9: monthString = \"September\"\
  ; break;\n18 case 10: monthString = \"October\"; break;\n19 case 11: monthString\
  \ = \"November\"; break;\n20 case 12: monthString = \"December\";break;\n21 default:\
  \ monthString = \"Invalid Month\"; break;\n22 }\n23 System.out.println(monthString);\n\
  24 }\n25 }\n```\n\n**输出**\nMay\n\n### switch 语句的重要规则\n\n- 不允许重复的 `case` 值。\n- 每次执行\
  \ `switch` 语句只会选择一个 `case`。\n- 表达式的值决定了选择哪个 `case`。\n- `case` 的值必须与 `switch` 中变量的数据类型相同。\n\
  - `case` 的值必须是常量或字面量。不允许使用变量。\n- `break` 语句用于 `switch` 内部终止语句序列。\n- `break` 语句是可选的。如果省略，执行将继续到下一个\
  \ `case`。\n- `default` 语句是可选的，并且它必须出现在 `switch` 的最后。\n- 当遇到 `break` 语句时，`switch`\
  \ 终止，控制流跳转到 `switch` 语句之后的下一行。\n- 并不是每个 `case` 都需要 `break`。如果没有出现 `break`，控制流将向下渗透到后续的\
  \ `case`，直到遇到 `break` 为止。\n- `switch` 适用于 `byte`、`short`、`char` 和 `int` 原始数据类型。它适用于枚举类型、`String`\
  \ 类以及包装某些原始类型的特殊类，如 `Character`、`Byte`、`Short` 和 `Integer`。\n\n## 总结\n\n- 当程序运行时，计算机从上到下逐行读取代码。\n\
  - 程序是一系列指令。语句按照它们编写的顺序一个接一个执行。这是默认的执行过程。\n- 选择语句（又称为条件结构）根据条件是否为真或假，导致程序控制转移到特定的流。选择结构使用关系运算符来测试条件。\n\
  - `if` 语句仅在条件为真时才执行一个或多个语句。\n- 运算符 `==` 和 `!=` 可用于比较布尔值。\n- `if…else` 语句允许你指定在条件为真和为假时执行不同的动作。它被称为双重选择语句，因为它在两个不同的动作之间进行选择。\n\
  - 条件运算符与 `if ...else` 语句紧密相关。它是 Java 唯一的三元运算符。它决定了应该将哪个值赋值给变量。\n- Java 提供了 `switch`\
  \ 语句来处理一系列决策，对变量或表达式可能假设的每个常量整数值进行单独测试，并采取不同的操作。\n\n***\n\n## 第 6 章：数组\n\n### 引言\n\
  回想上一章，变量是内存位置的名称。数组是相同类型的变量集合。通过在类型后加上方括号 `[]` 来声明数组。例如，`int[] numbers;` 声明了一个名为\
  \ `numbers` 的变量，它是指向 `int` 数组的引用。\n\n要创建数组，必须使用 `new` 运算符分配内存。例如，`numbers = new\
  \ int[6];` 创建了一个可以容纳 6 个整数值的数组。数组的每个元素通过索引访问，索引从 0 开始。例如，`numbers[0]` 访问第一个元素。\n\
  \n数组可以在声明时使用数组字面量进行初始化。例如，`int[] numbers = {10, 20, 30, 40, 50, 60};` 创建了一个数组并对其进行了初始化。\n\
  \n数组的大小可以使用 `length` 属性来确定。例如，`numbers.length` 将返回数组中的元素数量。\n\n#### 示例 6.1: Array1.java\n\
  ```java\npackage ch06;\n\npublic class Array1 {\n    public static void main(String[]\
  \ args){\n        int[] numbers = new int[6];\n        float[] temp = new float[100];\n\
  \        char[] letters = new char[41];\n        long[] units = new long[50];\n\
  \        double[] sizes = new double[1200];\n    }\n}\n```\n**解释**\n- `int[] numbers\
  \ = new int[6];` 创建了一个包含 6 个 `int` 值的数组。\n- `float[] temp = new float[100];` 创建了一个包含\
  \ 100 个 `float` 值的数组。\n- `char[] letters = new char[41];` 创建了一个包含 41 个 `char` 值的数组。\n\
  - `long[] units = new long[50];` 创建了一个包含 50 个 `long` 值的数组。\n- `double[] sizes =\
  \ new double[1200];` 创建了一个包含 1200 个 `double` 值的数组。\n\n数组的大小声明符必须是非负整数表达式。它可以是一个字面值，也可以是一个变量。使用\
  \ `final` 变量作为大小声明符是一种常见做法。例如：`final NUM_ELEMENTS = 6;`。\n\n\n\n\n\n```java\nint[]\
  \ numbers = new int[NUM_ELEMENTS];\n```\n这种做法可以使程序更易维护。当我们把数组的大小存储在变量中时，在引用数组大小时，可以使用该变量而不是字面量数字。如果我们以后需要更改数组的大小，只需要更改变量的值即可。该变量应该是\
  \ `final` 的，这样它的内容在程序执行期间就不会能被更改。\n\n注意：一旦创建了数组，其大小就无法更改。\n\n***\n\n## 访问数组元素\n\n\
  数组只有一个名称，但数组中的元素可以像单独变量一样被访问和使用。这是因为每个元素都被分配了一个被称为“下标”（subscript）的数字。\n\n下标用作索引来精确定位数组中的特定元素。第一个元素的下标分配为\
  \ `0`。第二个元素的下标分配为 `1`，依此类推。`numbers` 数组中的 6 个元素将拥有下标（从 `0` 到 `5`）。\n\n![](img/Image00082.jpg)\n\
  图 6.3 | `numbers` 数组\n\n下标编号始终从零开始。数组最后一个元素的下标比数组中元素的总数少 1。这意味着拥有 6 个元素的 `numbers`\
  \ 数组，`5` 是最后一个元素的下标。`numbers` 数组中的每个元素通过其下标访问时，都可以作为 `int` 变量使用。例如：\n\n```java\n\
  01 numbers[0] = 20;\n02 numbers[3] = 30;\n```\n\n### 解析\n* 第 `01` 行：在数组的第一个元素（元素\
  \ 1 - 下标 `0`）中存储 `20`。\n* 第 `02` 行：在第四个元素（元素 4 - 下标 `3`）中存储 `30`。\n\n注意：表达式 `numbers[0]`\
  \ 读作“numbers sub zero”。将这些赋值语句读作“numbers sub zero 被赋值为二十”以及“numbers sub three 被赋值为三十”。\n\
  \n![](img/Image00083.jpg)\n图 6.4 | `numbers` 数组的内容\n\n* 默认情况下，Java 用 `0` 初始化数组元素。在之前的图中，元素\
  \ 1、2、4 和 5 没有存储值，因此它们显示为 `0s`。\n\n记住：当你使用 `new` 关键字创建数组对象时，括号内的数字是大小声明符。它表示数组中元素的数量。赋值语句或任何处理数组内容的语句中，括号内的数字是下标。它被用于访问数组中的特定元素。\n\
  \n***\n\n## 在数组内部存储数据\n\n在 Java 中创建数组后，你可以将值存储到数组元素中。\n\n#### 语法\n`ArrayName [index]\
  \ = value;`\n\n例如：\n```java\n// 创建一个数组\nint a [] = new int[5]; // 长度: 5 , 索引: 0\
