  \ 对 ArrayList<Object> 进行排序\n\n可比较对象（Comparable object）能够与另一个对象进行比较。类本身必须实现 `Comparable`\
  \ 接口来比较其实例。实现方法如下：\n\n- 第一步：实现 `Comparable` 接口。可比较对象用于将自身与其他对象进行比较。实现了 `Comparable`\
  \ 接口的类对象是可以排序的。换句话说，实现了 `Comparable` 接口的类包含可以以某种意义方式进行比较的对象。\n- 第二步：重写 `Comparable`\
  \ 接口的 `compareTo()` 方法。`compareTo()` 方法用于将当前对象与指定的对象进行比较。\n\n假设我们需要根据出版属性对 `ArrayList<Book>`\
  \ 进行排序——首先实现 `Comparable` 接口，然后重写 `compareTo` 方法，如 `Book2.java` 文件所示。\n\n**示例 14.16\
  \ : Book2.java**\n```java\npackage ch14;\n\npublic class Book2 implements Comparable<Book2>{\n\
  \    private String bookName;\n    private int pageNo;\n    private int pubYear;\n\
  \n    public Book2(String bookName, int pageNo, int pubYear){\n        this.bookName\
  \ = bookName;\n        this.pageNo = pageNo;\n        this.pubYear = pubYear;\n\
  \    }\n    public String getBookName(){\n        return bookName;\n    }\n    public\
  \ void setBookName(String bookName){\n        this.bookName = bookName;\n    }\n\
  \    public int getPageNo(){\n        return pageNo;\n    }\n    public void setPageNo(int\
  \ pageNo){\n        this.pageNo = pageNo;\n    }\n    public int getPubYear(){\n\
  \        return pubYear;\n    }\n    public void setPubYear(int pubYear){\n    \
  \    this.pubYear = pubYear;\n    }\n\n    @Override\n    public String toString(){\n\
  \        return (\"Book Name = \" + bookName + \", Page No = \" + pageNo + \", Publish\
  \ Year = \" + pubYear);\n    }\n\n    @Override\n    public int compareTo(Book2\
  \ compareto){\n        int comparepub;\n        comparepub = compareto.getPubYear();\n\
  \        // 升序排序\n        return this.pubYear - comparepub;\n    }\n}\n```\n\n现在我们可以很好地在\
  \ `ArrayList` 上调用 `Collections.sort`。\n\n**示例 14.17 : BookDemo2.java**\n```java\n\
  package ch14;\n\nimport java.util.*;\n\npublic class BookDemo2 {\n    public static\
  \ void main(String[] args) {\n        ArrayList<Book2> list = new ArrayList<Book2>();\n\
  \        list.add(new Book2(\"C Programming\", 552, 2007));\n        list.add(new\
  \ Book2(\"How to Design Classes\", 666, 2012));\n        list.add(new Book2(\"Modern\
  \ C\", 222, 2015));\n\n        Collections.sort(list);\n        for (Book2 str1:\
  \ list) {\n            System.out.println(str1);\n        }\n    }\n}\n```\n输出：\n\
  `Book Name = C Programming, Page No = 552, Publish Year = 2007`\n`Book Name = How\
  \ to Design Classes, Page No = 666, Publish Year = 2012`\n`Book Name = Modern C,\
  \ Page No = 222, Publish Year = 2015`\n你可以看到 `Book2` 是按出版年份升序排序的。如果我们想按名称排序，必须修改\
  \ `Book2` 类：\n\n**示例 14.18 : Book2.java（重版）**\n```java\npackage ch14;\n\npublic\
  \ class Book2 implements Comparable<Book2>{\n    private String bookName;\n    private\
  \ int pageNo;\n    private int pubYear;\n\n    public Book2(String bookName, int\
  \ pageNo, int pubYear){\n        this.bookName = bookName;\n        this.pageNo\
  \ = pageNo;\n        this.pubYear = pubYear;\n    }\n    // ... 省省略 getter 和 setter\
  \ 以保持简洁性 ...\n\n    @Override\n    public int compareTo(Book2 compareto){\n    \
  \    // 按名称排序\n        return this.bookName.compareTo(compareto.getBookName());\n\
  \    }\n}\n```\n\n**示例 14.19 : Demo2.java（重版）**\n```java\npackage ch14;\n\nimport\
  \ java.util.*;\n\npublic class BookDemo2 {\n    public static void main(String[]\
  \ args) {\n        ArrayList<Book2> list = new ArrayList<Book2>();\n        list.add(new\
  \ Book2(\"C Programming\", 552, 2007));\n        list.add(new Book2(\"How to Design\
  \ Classes\", 666, 2012));\n        list.add(new Book2(\"Modern C\", 222, 2015));\n\
  \n        // 升序排序\n        Collections.sort(list);\n        for (Book2 str1: list)\
  \ {\n            System.out.println(str1);\n        }\n\n        // 降序排序\n     \
  \   Collections.reverse(list);\n        for (Book2 str1: list) {\n            System.out.println(str1);\n\
  \        }\n    }\n}\n```\n\n现在，假设我们还根据出版年份和页码对书籍进行排序。如果你需要对类对象有多种排序方式，你应该使用 `Comparator`。\n\
  \n### 使用 Comparator 对多属性属性进行排序（方法 1）\n\n`Comparator` 接口包含两个方法：`compare` 和 `equals`。`compare`\
  \ 方法比较两个输入参数并对它们施加顺序。我们如下所示重写 `compare` 方法：\n\n**示例 14.20 : Book3.java**\n```java\n\
  package ch14;\n\nimport java.util.Comparator;\n\npublic class Book3{\n    private\
  \ String bookName;\n    private int pageNo;\n    private int pubYear;\n\n    public\
  \ Book3(String bookName, int pageNo, int pubYear){\n        this.bookName = bookName;\n\
  \        this.pageNo = pageNo;\n        this.pubYear = pubYear;\n    }\n    // ...\
  \ 省略 getter 和 setter ...\n}\n\n// 比较器类实现\nclass BookComparator implements Comparator<Book3>\
  \ {\n    @Override\n    public int compare(Book3 b1, Book3 b2) {\n        // 首先按年份排序\n\
  \        int yearCompare = b1.getPubYear() - b2.getPubYear();\n        if (yearCompare\
  \ != 0) {\n            return yearCompare;\n        }\n        // 如果年份相同，则按页码排序\n\
  \        return b1.getPageNo() - b2.getPageNo();\n    }\n}\n```\n\n\n\n\n```java\n\
  \    this.pubYear = pubYear;\n}\n\n/* 用于按年份排序列表的比较器 */\npublic static Comparator<Book3>\
  \ PubYearComparator=\n    new Comparator<Book3>() {\n        @Override\n       \
  \ public int compare(Book3 o1, Book3 o2) {\n            int pubYear1 = o1.getPubYear();\n\
  \            int pubYear2 = o2.getPubYear();\n\n            // 升序\n            return\
  \ pubYear1-pubYear2;\n            // 降序\n            //return pubYear2-pubYear1;\n\
  \        }\n};\n\n/* 用于按页码排序列表的比较器 */\npublic static Comparator<Book3>\n    PageNoComparator\
  \ = new Comparator<Book3>(){\n    @Override\n    public int compare(Book3 o1, Book3\
  \ o2){\n        int pageNo1 = o1.getPageNo();\n        int pageNo2 = o2.getPageNo();\n\
  \n        // 升序\n        return pageNo1-pageNo2;\n    }\n};\n@Override\npublic String\
  \ toString(){\n    return (\"Book Name = \" + bookName + \", Page No = \" +\n  \
  \  pageNo + \", Publish Year = \" + pubYear);\n}\n```\n\n现在我们可以像在 `BookDemo3.java`\
  \ 程序所示，在 `ArrayList` 上调用 `Collections.sort`。\n\n### 示例 14.21 BookDemo3.java\n```java\n\
  package ch14;\n\nimport java.util.ArrayList;\nimport java.util.Collections;\n\n\
  public class BookDemo3 {\n    public static void main(String[] args) {\n       \
  \ ArrayList<Book3> list =\n            new ArrayList<Book3>();\n        list.add(new\
  \ Book3(\"C Programming\", 552, 2007));\n        list.add(new Book3(\"How to Design\
  \ Classes\", 666, 2012));\n        list.add(new Book3(\"Modern C\", 222, 2015));\n\
  \n        /* 根据书籍出版年份排序 */\n        System.out.println(\"Book Publish Year Sorting:\
  \ \");\n        Collections.sort(list, Book3.PubYearComparator);\n        for (Book3\
  \ str1: list) {\n            System.out.println(str1);\n        }\n\n        /*\
  \ 根据书籍页数排序 */\n        System.out.println(\"PageNo Sorting: \");\n        Collections.sort(list,\
