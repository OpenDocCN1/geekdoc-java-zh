  trans: "\n\n在《初学者 Django 编程：Web 开发实用指南》的第 2 章中，我们将探索 Django 中模型（models）和数据库的核心概念。模型是\
    \ Django 应用程序骨干，代表了存储在数据库的数据结构和行为。\n\n## 2.1 模型简介\n\n在 Django 中，模型是一个定义特定数据实体结构和属性的\
    \ Python 类。每个模型都对应数据库中的一张表，每个属性都代表该表中的一个字段。模型允许你使用高层 Python 代码定义数据模式（schema）并与数据库交互。\n\
    \n让我们通过一个例子来说明模型的概念。假设我们正在构建一个博客应用程序，想要存储关于博客文章的信息。我们可以创建一个名为 `Post` 的模型来表示博客文章：\n\
    \n```python\nfrom django.db import models\n\nclass Post(models.Model):\n    title\
    \ = models.CharField(max_length=200)\n    content = models.TextField()\n    pub_date\
    \ = models.DateTimeField(auto_now_add=True)\n```\n\n在这个示例中，`Post` 模型有三个字段：`title`、`content`\
    \ 和 `pub_date`。`title` 字段被定义为字符字段（`CharField`），最大长度为 200 个字符。`content` 字段是一个文本字段（`TextField`），用于存储博客内容。`pub_date`\
    \ 字段是一个日期时间字段（`DateTimeField`），会自动记录文章发布的日期。\n\n## 2.2 创建数据库表\n\n一旦定义了模型，我们需要创建相应的数据库表。Django\
    \ 提供了一个强大的迁移系统（migration），可以自动化创建、修改和管理数据库模式更改的过程。\n\n要根据模型创建所需的数据库表，请在命令行提示符或终端中运行以下命令：\n\
    \n```shell\npython manage.py makemigrations\n```\n\n此命令分析项目中的模型，并生成代表模式更改所需的迁移文件。每个迁移文件都包含创建或修改数据库表的指令。\n\
    \n创建迁移文件后，我们需要将它们应用到数据库。运行以下命令：\n\n```shell\npython manage.py migrate\n```\n\n\
    此命令执行迁移并在数据库中创建相应的表。\n\n## 2.3 与数据库交互\n\n表创建完成后，我们就可以使用 Django 的对象关系映射（ORM）功能开始与数据库交互。ORM\
    \ 允许我们使用 Python 代码执行数据库操作，抽象掉了底层的 SQL 查询。\n\n让我们使用我们的 `Post` 模型探索一些常见的数据库操作：\n\
    \n### 2.3.1 创建对象\n\n要创建一个新的博客文章，我们可以实例化 `Post` 模型并设置其属性。这是一个示例：\n\n```python\n\
    post = Post(title='First Blog Post', content='Lorem ipsum dolor sit amet...')\n\
    post.save()\n```\n\n`save()` 方法将对象持久化到数据库中。\n\n### 2.3.2 查询对象\n\n我们可以使用各种查询技术从数据库检索对象。例如，要检索所有的博客文章，可以使用以下代码：\n\
    \n```python\nposts = Post.objects.all()\n```\n\n此查询检索了 `Post` 模型中的所有对象。\n\n###\
    \ 2.3.3 过滤对象\n\n我们可以根据特定条件过滤对象。例如，要检索某日期之后发布的所有博客文章，可以使用以下代码：\n\n```python\nfrom\
    \ datetime import datetime\nposts = Post.objects.filter(pub_date__gt=datetime(2022,\
    \ 1, 1))\n```\n\n此查询根据 `pub_date` 字段大于 2022 年 1 月 1 日来过滤对象。\n\n## 2.4 总结\n\n在本章中，我们探索了\
    \ Django 中模型和数据库的概念。我们学习了如何定义模型来表示数据实体，如何使用迁移创建数据库表，以及如何使用 Django ORM 执行常见的数据库操作。\n\
    \n在下一章中，我们将深入构建 Django 的视图（views）和模板（templates），为我们的 Web 应用程序创建用户界面。\n\n# 第 3\
    \ 章：构建视图与模板\n\n在《初学者 Django 编程：Web 开发实用指南》的第 3 章中，我们将专注于构建 Django 的视图和模板。视图处理网页背后的逻辑，而模板定义了显示给用户的内容的结构和呈现方式。\n\
    \n## 3.1 理解视图\n\n在 Django 中，视图是一个接收 HTTP 请求并返回 HTTP 响应的 Python 函数或类。视图负责处理用户输入、与模型和数据库交互，并渲染相应的模板以显示响应。\n\
    \n让我们为博客应用程序创建一个简单的视图。在应用程序目录下的 `views.py` 文件中，定义以下函数：\n\n```python\nfrom django.shortcuts\
    \ import render\nfrom .models import Post\n\ndef blog_posts(request):\n    posts\
    \ = Post.objects.all()\n    return render(request, 'blog/posts.html', {'posts':\
    \ posts})\n```\n\n在这个示例中，`blog_posts` 视图使用 `Post` 模型从数据库检索所有博客文章。然后它将检索到的文章传递给\
    \ `render` 函数，该函数使用 `posts` 变量渲染 `posts.html` 模板。\n\n## 3.2 创建模板\n\nDjango 模板定义了\
    \ HTML 内容的结构和呈现。它们允许我们将设计和布局与视图中的 Python 代码分离，提供了一种清晰且易于维护的用户界面构建方法。\n\n要创建 `posts.html`\
    \ 模板，导航到应用程序目录并创建一个名为 `templates` 的新目录。在 `templates` 目录内部创建一个名为 `blog` 的目录。最后，在\
    \ `blog` 目录中创建一个名为 `posts.html` 文件。目录结构如下：\n\n```\ntemplates/\n└── blog/\n   \
    \ └── posts.html\n```\n\n打开 `posts.html` 文件并定义显示文章的 HTML 结构。示例：\n\n```html\n{%\
    \ for post in posts %}\n<div class=\"post\">\n    <h2>{{ post.title }}</h2>\n\
    \    <p>{{ post.content }}</p>\n    <p>发布日期: {{ post.pub_date }}</p>\n</div>\n\
    {% endfor %}\n```\n\n在此模板中，我们使用 Django 模板语言（由 `{% %}` 和 `{{ }}` 标签表示）来动态显示来自 `posts`\
    \ 变量的数据。\n\n## 3.3 URL 映射视图\n\n为了通过 URL 访问视图，我们需要在项目的 `urls.py` 文件中定义 URL 模式。打开项目下的\
    \ `urls.py` 文件并添加以下代码：\n\n```python\nfrom django.urls import path\nfrom blog.views\
    \ import blog_posts\n\nurlpatterns = [\n    path('posts/', blog_posts, name='blog_posts'),\n\
    ]\n```\n\n在这个示例中，我们将 URL 模式 `/posts/` 映射到 `blog_posts` 视图。当用户在浏览器访问 `/posts/`\
    \ 时，Django 将调用 `blog_posts` 视图处理请求并返回相应的响应。\n\n## 3.4 测试应用程序\n\n视图、模板和 URL 模式完成后，现在就可以测试应用程序了。运行以下命令启动\
    \ Django 开发服务器：\n\n```shell\npython manage.py runserver\n```\n\n在浏览器访问 `http://localhost:8000/posts/`，你应该能看到根据从数据库检索的数据渲染出来的博客文章列表。\n\
    \n## 3.5 总结\n\n在本章中，我们探索了 Django 中视图和模板的概念。我们学习了如何定义视图来处理用户请求，如何创建模板来构建 HTML 内容以及如何使用\
    \ URL 模式将 URL 映射到视图。\n\n"
- fmt: "\nIn Chapter 4 of \"Django Programming for Beginners: A Practical Guide to\
    \ Web Development,\" we will focus on handling forms and user input in Django.\
    \ Forms play a crucial role in web applications by allowing users to input data,\
    \ submit it to the server, and perform various operations.\n\n## 4.1 Creating\
    \ a Form\n\nIn Django, forms are created using Python classes that inherit from\
    \ the `django.forms.Form` or `django.forms.ModelForm` class. These classes define\
    \ the fields and validation rules for the form.\n\nLet's create a form to allow\
    \ users to submit new blog posts. In your application directory, create a file\
    \ called `forms.py`. Inside the file, define the following code:\n\n```python\n\
    from django import forms\nfrom .models import Post\n\nclass PostForm(forms.ModelForm):\n\
    \    class Meta:\n        model = Post\n        fields = ['title', 'content']\n\
    ```\n\nIn this example, we create a form called `PostForm` based on the `Post`\
    \ model. The `Meta` class specifies the model and the fields we want to include\
    \ in the form.\n\n## 4.2 Rendering the Form\n\nTo display the form in a web page,\
    \ we need to render it in a template. Open the `posts.html` template we created\
    \ in the previous chapter (`Chapter 3`) and update it as follows:\n\n```html\n\
    <div class=\"post-form\">\n    <h2>Create a New Blog Post</h2>\n    <form method=\"\
    POST\" action=\"{% url 'create_post' %}\">\n        {% csrf_token %}\n       \
    \ {{ form.as_p }}\n        <button type=\"submit\">Submit</button>\n    </form>\n\
    </div>\n```\n\nIn this updated template, we added an HTML form that submits data\
    \ to the URL named `'create_post'`. We use the `{% csrf_token %}` template tag\
    \ to include a security token that protects against Cross-Site Request Forgery\
    \ attacks. The `{{ form.as_p }}` template variable renders the form fields as\
    \ paragraphs (`<p>` tags) for simplicity.\n\n## 4.3 Handling Form Submissions\n\
    \nNow that we have the form rendered in the template, we need to handle form submissions\
    \ in the view. Update the `blog_posts` view in your `views.py` file as follows:\n\
    \n```python\nfrom django.shortcuts import render, redirect\nfrom .forms import\
    \ PostForm\n\ndef blog_posts(request):\n    if request.method == 'POST':\n   \
    \     form = PostForm(request.POST)\n        if form.is_valid():\n           \
    \ form.save()\n            return redirect('blog_posts')\n    else:\n        form\
    \ = PostForm()\n        posts = Post.objects.all()\n    return render(request,\
    \ 'blog/posts.html', {'posts': posts, 'form': form})\n```\n\nIn this updated view,\
    \ we check if the request method is `'POST'`. If it is, we create an instance\
    \ of the `PostForm` form using the data from the request. We then validate the\
    \ form using the `is_valid()` method. If the form is valid, we save it to the\
    \ database using `form.save()` and redirect the user back to the `'blog_posts'`\
    \ URL.\n\nIf the request method is not `'POST'`, we create a new instance of the\
    \ form to be rendered in the template.\n\n## 4.4 Testing the Form\n\nStart the\
    \ Django development server by running the following command:\n\n```shell\npython\
    \ manage.py runserver\n```\n\nVisit `http://localhost:8000/posts/` in your web\
    \ browser. You should see the form to create a new blog post. Fill in the fields\
    \ and click the \"Submit\" button. The form data will be submitted to the server,\
    \ saved in the database, and you will be redirected back to the blog posts page.\n\
    \n## 4.5 Summary\n\nIn this chapter, we explored the process of handling forms\
    \ and user input in Django. We learned how to create a form using a form class,\
    \ render the form in a template, and handle form submissions in a view.\n\nIn\
    \ the next chapter, we will discuss authentication and user management in Django,\
    \ allowing us to implement user registration, login, and logout functionality.\n\
    \n# Chapter 5: Authentication and User Management\n\nIn Chapter 5 of \"Django\
    \ Programming for Beginners: A Practical Guide to Web Development,\" we will focus\
    \ on authentication and user management in Django. Authentication is an essential\
    \ part of web applications, enabling users to register, log in, and access personalized\
    \ features.\n\n## 5.1 User Registration\n\nTo allow users to register an account,\
    \ we need to create a registration form and handle the registration process. Let's\
    \ start by creating a registration form.\n\nIn your application directory, create\
    \ a file called `forms.py` (if it doesn't already exist). Inside the file, define\
    \ the following code:\n\n```python\nfrom django import forms\nfrom django.contrib.auth.forms\
    \ import UserCreationForm\n\nclass RegistrationForm(UserCreationForm):\n    email\
    \ = forms.EmailField()\n    class Meta:\n        model = User\n        fields\
    \ = ['username', 'email', 'password1', 'password2']\n```\n\nIn this example, we\
    \ inherit from Django's `UserCreationForm`, which provides the necessary fields\
    \ and validation for user registration. We add an additional field for the email\
    \ address.\n\n## 5.2 User Registration View\n\nNext, we need to create a view\
