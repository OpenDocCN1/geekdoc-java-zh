    \n# 14.1 模型简介\n\n在 Django 中，模型（model）是一个表示数据库表的 Python 类。模型类的每个属性都对应表中的一个字段。通过定义模型，我们可以轻松地创建、检索、更新和删除数据库中的数据。\n\
