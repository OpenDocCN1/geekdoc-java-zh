    \n示例（类定义）：\n```java\npublic class Car {\n    String brand;\n    String color;\n\
    \n    void startEngine() {\n        System.out.println(\"引擎启动\");\n    }\n}\n\
    ```\n\n示例（对象实例化和方法调用）：\n```java\nCar myCar = new Car();\nmyCar.startEngine();\n\
    ```\n\n"
