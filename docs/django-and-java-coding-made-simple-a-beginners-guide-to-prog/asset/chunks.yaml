    \n# 14.1.2 创建数据库表\n\n为我们的模型创建相应的数据库表，我们需要运行迁移（migrations）。在终端中，导航到项目根目录并运行以下命令：\n\
    \n```shell\npython manage.py makemigrations\n```\n\n该命令根据我们的模型定义生成创建表所需的 SQL 语句。接下来，运行以下命令应用迁移：\n\
