    \ age = 25; // 编译器推断数据类型为 int\nvar price = 9.99; // 编译器推断数据类型为 double\n```\n\n\
    # 2.5 变量命名\n\n命名变量时，遵循某些命名规范对于提高代码可读性非常重要。变量名应该是且且描述性的，并以小写字母开头。对于多个单词名称，使用驼峰命名法。\n\
