    \ vote.”。\n\n# 3.2 Switch 语句\n\n`switch` 语句提供了一种表达式的值执行多种条件检查的替代方法。它允许为可能的值指定不同的操作。\n\
    \n`switch` 的语法如下：\n\n```java\nswitch (expression) {\n    case value1:\n      \
