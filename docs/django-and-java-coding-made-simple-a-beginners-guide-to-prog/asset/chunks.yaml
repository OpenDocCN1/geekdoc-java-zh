    \ enclosed between `/*` and `*/`. They can span multiple lines.\n\n```\n/*\nThis\
    \ is a\nmulti-line comment\n*/\n```\n\n### 1.4.2 Variables and Data Types\n\n\
    Variables are used to store and manipulate data in a program. Before using a variable,\
    \ you must declare its data type. Java supports various data types, including:\n\
    \n- Primitive data types: `int`, `float`, `double`, `boolean`, `char`, etc.\n\
    - Reference data types: `String`, `arrays`, `objects`, etc.\n\nExample:\n```java\n\
    int age = 25;\nfloat price = 9.99f;\nString name = \"John\";\n```\n\n### 1.4.3\
    \ Control Flow Statements\n\nControl flow statements allow you to control the\
    \ execution flow of your program. They include:\n\n- Conditional statements: `if-else`\
    \ and `switch-case`.\n- Looping statements: `for`, `while`, and `do-while`.\n\n\
    Example (if-else):\n```java\nint age = 18;\nif (age >= 18) {\n    System.out.println(\"\
    You are an adult.\");\n} else {\n    System.out.println(\"You are a minor.\");\n\
    }\n```\n\nExample (for loop):\n```java\nfor (int i = 1; i <= 5; i++) {\n    System.out.println(i);\n\
    }\n```\n\n### 1.4.4 Classes and Objects\n\nJava is an object-oriented language,\
    \ which means it revolves around the concept of classes and objects. A class is\
    \ a blueprint for creating objects, while an object is an instance of a class.\
    \ Classes define the properties (attributes) and behaviors (methods) of objects.\n\
    \nExample (Class definition):\n```java\npublic class Car {\n    String brand;\n\
    \    String color;\n\n    void startEngine() {\n        System.out.println(\"\
    Engine started.\");\n    }\n}\n```\n\nExample (Object instantiation and method\
    \ invocation):\n```java\nCar myCar = new Car();\nmyCar.startEngine();\n```\n"
