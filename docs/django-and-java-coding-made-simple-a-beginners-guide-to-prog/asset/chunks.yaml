    int i = 1;\ndo {\n    System.out.println(\"Count: \" + i);\n    i++;\n} while\
    \ (i <= 5);\n```\n\n在上面的示例中，循环将至少执行一次，打印从 1 到 5 的计数。\n\n## 3.4 Control Flow Statements:\
    \ Summary\n\n在本章中，我们探索了 Java 中的控制流语句，这些语句使我们能够控制程序的执行流。我们讨论了两种条件语句：`if-else` 和\
    \ `switch`。`if-else` 语句允许我们根据条件执行代码，而 `switch` 语句提供了一种根据表达式的值进行多次检查的方法。\n\n我们还涵盖了三类型的循环语句：`for`、`while`\
    \ 和 `do-while`。`for` 循环用于预先知道迭代次数的情况，`while` 循环用于未知迭代次数的情况，而 `do-while` 循环则确保代码块至少执行一次。\n\
    \n通过掌握控制流语句，你可以创建更具动态性和交互性的程序，让这些程序可以做出决策、重复操作并对不同的场景做出响应。这些语句是你的编程工具箱中必不可少的工具，允许你编写更灵活、更高效的代码。\n\
    \n在下一章中，我们将探索方法的概念，方法是执行特定任务的可重用代码块。准备好学习如何封装功能并创建模块化且组织良好的程序。\n\n# Chapter 4:\
    \ Methods\n\n在之前的章节中，我们学习了变量、数据类型和控制流语句。现在，在第 4 章中，我们将深入研究方法的概念。方法是执行特定任务的可重用代码块，允许我们在程序中封装功能。它们实现了代码的模块化、可重用和组织性。\n\
    \n## 4.1 Introduction to Methods\n\n方法是一组组合在一起以执行特定任务的语句。它定义在类中，并可以从程序的其他部分调用以执行其功能。方法有助于将复杂问题分解为更小、易管理的任务，使代码更具可读性和维护性。\n\
    \n## 4.2 Method Signature and Syntax\n\n方法由两个主要部分组成：方法签名和方法体。\n\n方法签名包含以下元素：\n\
    \n- 返回类型：指定方法返回的值类型。如果方法不返回值，则使用关键字 `void`。\n- 方法名：方法的唯一唯一标识符。\n- 参数：方法的输入。它们是可选的，并封装在括号内。多个参数之间用逗号分隔。\n\
    - 访问修饰符：决定方法的可见性（例如 `public`、`private`、`protected`）。\n\n方法声明的语法如下：\n\n```java\n\
    accessModifier returnType methodName(parameters) {\n    // 方法体\n}\n```\n\n示例：\n\
    \n```java\npublic void greetUser(String name) {\n    System.out.println(\"Hello,\
    \ \" + name + \"!\");\n}\n```\n\n在上面的示例中，我们有一个名为 `greetUser` 的方法，返回类型为 `void`（无返回值）。它接受一个\
    \ `String` 类型的参数 `name`。方法体由一个打印问候信息的语句组成。\n\n## 4.3 Calling a Method\n\n要执行方法内部的代码，我们需要调用或触发该方法。方法调用允许我们在程序的特定点使用方法提供的功能。\n\
    \n要调用方法，我们使用以下语法：\n\n```java\nmethodName(arguments);\n```\n\n示例：\n\n```java\n\
    greetUser(\"John\");\n```\n\n在上面的示例中，使用参数 `\"John\"` 调用了 `greetUser` 方法。这将执行方法代码并在控制台上打印消息\
    \ \"Hello, John!\"。\n\n## 4.4 Method Overloading\n\n方法重载允许我们定义多个同名但参数列表不同的方法。它使我们能够创建执行相似任务但接受不同类型或数量参数的方法。\n\
    \nJava 根据方法调用期间传递的参数来确定执行哪个方法。该决定是在编译时做出的，考虑了参数的数量、类型和顺序。\n\n示例：\n\n```java\n\
    public int sum(int a, int b) {\n    return a + b;\n}\npublic double sum(double\
    \ a, double b) {\n    return a + b;\n}\n```\n\n在上面的示例中，我们有两个 `sum` 方法——一个接受两个\
    \ `int` 参数，另一个接受两个 `double` 参数。Java 根据方法调用期间提供的参数类型调用相应的方法。\n\n## 4.5 Returning\
    \ Values from Methods\n\n方法可以使用 `return` 语句返回值。方法签名中指定的返回类型指示方法应返回的值类型。\n\n要从方法返回值，使用以下语法：\n\
    \n```java\nreturn expression;\n```\n\n示例：\n\n```java\npublic int square(int num)\
    \ {\n    return num * num;\n}\n```\n\n在上面的示例中，`square` 方法接受一个 `int` 参数并返回其平方\n\
    \n## 4.6 Summary\n\n在本章中，我们探索了 Java 中方法的概念。我们了解到方法是执行特定任务的可重用代码块，提供了模块化和可重用性。我们讨论了如何通过使用方法名以及括号并传递所需的参数来调用或触发方法。我们还探索了方法重载，它允许我们定义多个同名但参数列表不同的方法，增加了方法使用的灵活性。\n\
    \n此外，我们学习了使用 `return` 语句从方法返回值。方法签名中指定的返回类型决定方法应返回的值类型。通过返回值，方法可以为程序的其他部分提供有输出和结果。\n\
    \n方法在组织程序方面起着至关重要的作用。它们有助于将复杂问题分解为更小、易管理的任务，并增强代码的可读性、维护性和组织性。\n\n在下一章中，我们将深入研究数组，数组是允许我们存储和操作集合的基础数据结构。准备好探索\
    \ Java 编程中数组的多功能和强大。\n\n# Chapter 5: Arrays\n\n## 5.1 Introduction to Arrays\n\
    \n数组是一个存储固定数量相同值的容器对象。数组中的每个值被称为一个元素，每个元素通过其索引访问。数组提供了一种方便的方法在单个变量中存储和访问多个相关值。\n\
    \n## 5.2 Declaring and Initializing Arrays\n\n"
- fmt: "\nTo use an array, we need to declare and initialize it. The declaration specifies\
    \ the type of elements the array will hold, and the initialization assigns actual\
    \ values to the array elements.\n\nThe syntax for declaring an array is as follows:\n\
    \n```java\ntype[] arrayName;\n```\n\nExample:\n\n```java\nint[] numbers;\n```\n\
    \nIn the example above, we declare an array named `numbers` that will hold elements\
    \ of type `int`. However, at this point, the array is uninitialized and doesn't\
    \ hold any values.\n\nTo initialize an array, we can use one of the following\
    \ methods:\n\n### 5.2.1 Inline Initialization\n\nWe can initialize an array with\
    \ values directly at the time of declaration using curly braces `{}`.\n\n```java\n\
    type[] arrayName = {value1, value2, value3, ...};\n```\n\nExample:\n\n```java\n\
    int[] numbers = {1, 2, 3, 4, 5};\n```\n\nIn the example above, we declare and\
    \ initialize an array named `numbers` with the values 1, 2, 3, 4, and 5.\n\n###\
    \ 5.2.2 Initializing with the new Operator\n\nWe can also initialize an array\
    \ using the `new` operator. This method allows us to specify the size of the array.\n\
    \n```java\ntype[] arrayName = new type[size];\n```\n\nExample:\n\n```java\nint[]\
    \ numbers = new int[5];\n```\n\nIn the example above, we declare and initialize\
    \ an array named `numbers` with a size of 5. The array is initially filled with\
    \ default values (`0` for `int`).\n\n### 5.3 Accessing Array Elements\n\nArray\
    \ elements can be accessed using their index, which starts from 0 and goes up\
    \ to `length - 1`, where `length` represents the number of elements in the array.\n\
    \nThe syntax to access an array element is as follows:\n\n```java\narrayName[index]\n\
    ```\n\nExample:\n\n```java\nint[] numbers = {10, 20, 30};\nint firstElement =\
    \ numbers[0]; // Accessing the first element (10)\nint secondElement = numbers[1];\
    \ // Accessing the second element (20)\n```\n\nIn the example above, we access\
    \ the first and second elements of the `numbers` array using the respective indices.\n\
    \n### 5.4 Array Length\n\nThe `length` property of an array returns the number\
    \ of elements it can hold. It is a final variable, so it cannot be modified.\n\
    \nThe syntax to get the length of an array is as follows:\n\n```java\narrayName.length\n\
    ```\n\nExample:\n\n```java\nint[] numbers = {1, 2, 3, 4, 5};\nint arrayLength\
    \ = numbers.length; // Length of the array (5)\n```\n\nIn the example above, we\
    \ get the length of the `numbers` array and store it in the variable `arrayLength`.\n\
    \n### 5.5 Modifying Array Elements\n\nArray elements can be modified by assigning\
    \ new values to them using their indices and the assignment operator (`=`).\n\n\
    Example:\n\n```java\nint[] numbers = {1, 2, 3, 4, 5};\nnumbers[2] = 10; // Modifying\
    \ the third element to 10\n```\n\nIn the example above, we modify the third element\
    \ of the `numbers` array by assigning it a new value of 10.\n\n### 5.6 Iterating\
    \ Over Arrays\n\nTo access and process all the elements of an array, we can use\
    \ loops, such as the `for` loop.\n\nExample:\n\n```java\nint[] numbers = {1, 2,\
    \ 3, 4, 5};\nfor (int i = 0; i < numbers.length; i++) {\n    System.out.println(numbers[i]);\n\
    }\n```\n\nIn the example above, we use a `for` loop to iterate over each element\
    \ of the `numbers` array. The loop starts from index 0 and goes up to `numbers.length\
    \ - 1`, printing each element to the console.\n\n### 5.7 Multidimensional Arrays\n\
    \nIn Java, we can also have multidimensional arrays, which are arrays of arrays.\
    \ They allow us to store elements in a matrix-like structure.\n\nExample:\n\n\
    ```java\nint[][] matrix = {\n    {1, 2, 3},\n    {4, 5, 6},\n    {7, 8, 9}\n};\n\
    ```\n\nIn the example above, we declare and initialize a 2-dimensional array named\
    \ `matrix`. It contains three rows and three columns.\n\nTo access elements in\
    \ a multidimensional array, we use nested loops.\n\nExample:\n\n```java\nfor (int\
    \ i = 0; i < matrix.length; i++) {\n    for (int j = 0; j < matrix[i].length;\
    \ j++) {\n        System.out.print(matrix[i][j] + \" \");\n    }\n    System.out.println();\n\
    }\n```\n\nIn the example above, we use nested `for` loops to iterate over each\
    \ element of the `matrix` array and print them row by row.\n\n### 5.8 Summary\n\
    \nIn this chapter, we explored the concept of arrays in Java. Arrays are powerful\
    \ data structures that allow us to store and manipulate collections of elements.\
    \ We learned how to declare and initialize arrays, access and modify array elements,\
    \ retrieve the length of an array, and iterate over arrays using loops. We also\
    \ briefly touched upon multidimensional arrays.\n\nArrays provide a convenient\
    \ way to work with multiple values of the same type and offer flexibility in organizing\
    \ and processing data. They are widely used in various programming scenarios,\
    \ such as storing a list of numbers, managing sets of objects.\n"
  raw: 'To use an array, we need to declare and initialize it. The declaration specifies
    the type of elements the array will hold, and the initialization assigns actual
    values to the array elements.


    The syntax for declaring an array is as follows:


    ```java


    type[] arrayName;


    ```


    Example:


    ```java


    int[] numbers;


    ```


    In the example above, we declare an array named `numbers` that will hold elements
    of type `int`. However, at this point, the array is uninitialized and doesn''t
    hold any values.


    To initialize an array, we can use one of the following methods:


    # 5.2.1 Inline Initialization


    We can initialize an array with values directly at the time of declaration using
    curly braces `{}`.


    ```java


    type[] arrayName = {value1, value2, value3, ...};


    ```


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    ```


    In the example above, we declare and initialize an array named `numbers` with
    the values 1, 2, 3, 4, and 5.


    # 5.2.2 Initializing with the new Operator


    We can also initialize an array using the `new` operator. This method allows us
    to specify the size of the array.


    ```java


    type[] arrayName = new type[size];


    ```


    Example:


    ```java


    int[] numbers = new int[5];


    ```


    In the example above, we declare and initialize an array named `numbers` with
    a size of 5\. The array is initially filled with default values (`0` for `int`).


    # 5.3 Accessing Array Elements


    Array elements can be accessed using their index, which starts from 0 and goes
    up to `length - 1`, where `length` represents the number of elements in the array.


    The syntax to access an array element is as follows:


    ```java


    arrayName[index]


    ```


    Example:


    ```java


    int[] numbers = {10, 20, 30};


    int firstElement = numbers[0]; // Accessing the first element (10)


    int secondElement = numbers[1]; // Accessing the second element (20)


    ```


    In the example above, we access the first and second elements of the `numbers`
    array using the respective indices.


    # 5.4 Array Length


    The `length` property of an array returns the number of elements it can hold.
    It is a final variable, so it cannot be modified.


    The syntax to get the length of an array is as follows:


    ```java


    arrayName.length


    ```


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    int arrayLength = numbers.length; // Length of the array (5)


    ```


    In the example above, we get the length of the `numbers` array and store it in
    the variable `arrayLength`.


    # 5.5 Modifying Array Elements


    Array elements can be modified by assigning new values to them using their indices
    and the assignment operator (`=`).


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    numbers[2] = 10; // Modifying the third element to 10


    ```


    In the example above, we modify the third element of the `numbers` array by assigning
    it a new value of 10.


    # 5.6 Iterating Over Arrays


    To access and process all the elements of an array, we can use loops, such as
    the `for` loop.


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    for (int i = 0; i < numbers.length; i++) {


    System.out.println(numbers[i]);


    }


    ```


    In the example above, we use a `for` loop to iterate over each element of the
    `numbers` array. The loop starts from index 0 and goes up to `numbers.length -
    1`, printing each element to the console.


    # 5.7 Multidimensional Arrays


    In Java, we can also have multidimensional arrays, which are arrays of arrays.
    They allow us to store elements in a matrix-like structure.


    Example:


    ```java


    int[][] matrix = {


    {1, 2, 3},


    {4, 5, 6},


    {7, 8, 9}


    };


    ```


    In the example above, we declare and initialize a 2-dimensional array named `matrix`.
    It contains three rows and three columns.


    To access elements in a multidimensional array, we use nested loops.


    Example:


    ```java


    for (int i = 0; i < matrix.length; i++) {


    for (int j = 0; j < matrix[i].length; j++) {


    System.out.print(matrix[i][j] + " ");


    }


    System.out.println();


    }


    ```


    In the example above, we use nested `for` loops to iterate over each element of
    the `matrix` array and print them row by row.


    5.8 Summary


    In this chapter, we explored the concept of arrays in Java. Arrays are powerful
    data structures that allow us to store and manipulate collections of elements.
    We learned how to declare and initialize arrays, access and modify array elements,
    retrieve the length of an array, and iterate over arrays using loops. We also
    briefly touched upon multidimensional arrays.


    Arrays provide a convenient way to work with multiple values of the same type
    and offer flexibility in organizing and processing data. They are widely used
    in various programming scenarios, such as storing a list of numbers, managing
    sets of objects, or representing matrices.


    In the next chapter, we will delve into the world of object-oriented programming
    (OOP) and explore classes and objects, which form the foundation of OOP. Get ready
    to learn about encapsulation, abstraction, and the principles of object-oriented
    design.


    # Chapter 6: Object-Oriented Programming (OOP)


    In the previous chapters, we covered the basics of Java programming, including
    variables, control flow, methods, and arrays. Now, in Chapter 6, we will delve
    into the world of Object-Oriented Programming (OOP). Object-Oriented Programming
    is a programming paradigm that focuses on modeling real-world objects and their
    interactions within a program.


    # 6.1 Introduction to Object-Oriented Programming


    Object-Oriented Programming (OOP) is a programming paradigm that organizes code
    into objects, which are instances of classes. It emphasizes the concepts of encapsulation,
    inheritance, polymorphism, and abstraction. OOP allows us to create modular, reusable,
    and maintainable code by representing real-world entities as objects with properties
    (attributes) and behaviors (methods).


    # 6.2 Classes and Objects


    In OOP, a class is a blueprint or template that defines the structure and behavior
    of objects. It describes the attributes and methods that objects of that class
    will possess. Objects, on the other hand, are instances of classes. They represent
    specific entities and can interact with each other.


    To create a class, we use the following syntax:


    ```java


    public class ClassName {


    // class members (fields, constructors, methods)


    }


    ```


    Example:


    ```java


    public class Car {


    // class members


    }


    ```


    In the example above, we define a class named `Car`. It serves as a blueprint
    for creating car objects.


    To create an object (instance) of a class, we use the `new` keyword:


    ```java


    ClassName objectName = new ClassName();


    ```


    Example:


    ```java


    Car myCar = new Car();


    ```


    In the example above, we create an object `myCar` of the `Car` class.


    6.3 Class Members: Fields and Methods


    A class consists of two types of members: fields (variables) and methods.


    Fields represent the attributes or properties of an object. They store the state
    or data associated with an object. Fields can be of different types, such as `int`,
    `double`, `String`, or even other objects.


    Methods, on the other hand, define the behavior or actions that objects can perform.
    They encapsulate the operations or functionalities related to the object. Methods
    can have parameters and may return values.


    Example:


    ```java


    public class Car {


    // Fields


    String brand;


    String color;


    int year;


    // Methods


    public void startEngine() {


    System.out.println("Engine started!");


    }


    public void drive(int distance) {


    System.out.println("Driving " + distance + " kilometers.");


    }


    }


    ```


    In the example above, the `Car` class has fields `brand`, `color`, and `year`,
    representing the attributes of a car. It also has methods `startEngine()` and
    `drive(int distance)` that define the behaviors of a car.


    # 6.4 Encapsulation and Access Modifiers


    Encapsulation is an important concept in OOP that involves bundling data (fields)
    and methods together within a class and controlling their access. It helps in
    hiding the internal implementation details of a class and provides data protection
    and security.'
