    # Chapter 9: Multithreading


    In the previous chapters, we covered a wide range of Java topics, including variables,
    control flow, OOP, exception handling, file I/O, and generics. Now, in Chapter
    9, we will explore the fascinating world of multithreading in Java.


    # 9.1 Introduction to Multithreading


    Multithreading is the ability of a program to execute multiple threads concurrently.
    A thread is a lightweight unit of execution that represents a separate path of
    execution within a program. Multithreading allows programs to perform multiple
    tasks simultaneously, making them more efficient and responsive.


    # 9.2 Creating Threads


    In Java, there are two ways to create threads: by extending the `Thread` class
    or by implementing the `Runnable` interface.


    # 9.2.1 Extending the Thread Class


    To create a thread by extending the `Thread` class, we need to override the `run()`
    method, which is the entry point for the thread''s execution. The `run()` method
    contains the code that will be executed in a separate thread.


    Example:


    ```java


    public class MyThread extends Thread {


    @Override


    public void run() {


    // Code to be executed in the thread


    }


    }


    ```


    To start the thread, we create an instance of the `MyThread` class and call the
    `start()` method.


    Example:


    ```java


    MyThread thread = new MyThread();


    thread.start();


    ```


    # 9.2.2 Implementing the Runnable Interface


    An alternative way to create a thread is by implementing the `Runnable` interface.
    The `Runnable` interface represents a task that can be executed concurrently.


    Example:


    ```java


    public class MyRunnable implements Runnable {


    @Override


    public void run() {


    // Code to be executed in the thread


    }


    }


    ```


    To start the thread, we create an instance of the `MyRunnable` class and pass
    it as a parameter to a `Thread` object. Then we call the `start()` method on the
    `Thread` object.


    Example:


    ```java


    MyRunnable runnable = new MyRunnable();


    Thread thread = new Thread(runnable);


    thread.start();'
