    allows users to securely log out of the application and terminate their session.


    # 7.1 Logout View


    To handle the user logout process, we need to create a view that performs the
    necessary operations. Open your `views.py` file and add the following code:


    ```python


    from django.shortcuts import redirect


    from django.contrib.auth import logout


    def user_logout(request):


    logout(request)


    return redirect(''login'')


    ```


    In this view, we call the `logout()` function provided by Django, passing in the
    `request` object. This function removes the user''s session data and logs them
    out. Finally, we redirect the user to the login page.


    # 7.2 Mapping URLs


    To access the logout functionality, we need to map a URL to the logout view. Open
    your project''s `urls.py` file and add the following code:


    ```python


    from django.urls import path


    from .views import user_logout


    urlpatterns = [


    path(''logout/'', user_logout, name=''user_logout''),


    ]


    ```


    In this example, we associate the URL pattern `/logout/` with the `user_logout`
    view. Users can access the logout functionality by visiting this URL.


    # 7.3 Adding Logout Link


    To provide a way for users to log out, we can add a logout link to our templates.
    Open your `dashboard.html` template (or any relevant template where you want to
    include the logout link) and add the following code:


    ```html


    <a href="{% url ''user_logout'' %}">Logout</a>


    ```


    This link will redirect the user to the logout URL when clicked, triggering the
    logout process.


    # 7.4 Testing User Logout


    Start the Django development server by running the following command:


    ```shell


    python manage.py runserver


    ```


    Visit your application and log in with a user account. Once logged in, you should
    see the logout link in the navigation menu or wherever you placed it. Clicking
    the logout link will log out the user and redirect them to the login page.


    7.5 Summary


    In this chapter, we implemented user logout functionality in Django. We learned
    how to create a logout view, map a URL to the view, and add a logout link in our
    templates.


