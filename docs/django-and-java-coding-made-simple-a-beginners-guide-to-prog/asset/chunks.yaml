    # Chapter 14: Working with Models and Databases


    In Chapter 14 of "Django Programming for Beginners: A Practical Guide to Web Development,"
    we will explore the fundamental concepts of working with models and databases
    in Django. Models define the structure and behavior of our application''s data,
    while databases store and manage that data.


    # 14.1 Introduction to Models


    In Django, a model is a Python class that represents a database table. Each attribute
    of the model class corresponds to a field in the table. By defining models, we
    can easily create, retrieve, update, and delete data in the database.


    # 14.1.1 Creating a Model


    To create a model, we define a class that inherits from Django''s `models.Model`
    class. Each attribute in the model class represents a field in the database table.
    Let''s create a simple model for a blog post. Open your app''s `models.py` file
    and add the following code:


    ```python


    from django.db import models


    class BlogPost(models.Model):


    title = models.CharField(max_length=100)


    content = models.TextField()


    created_at = models.DateTimeField(auto_now_add=True)


    ```


    In this example, we define a `BlogPost` model with three fields: `title`, `content`,
    and `created_at`. The `title` field is a `CharField` that can store a string of
    up to 100 characters. The `content` field is a `TextField` for longer text content.
    The `created_at` field is a `DateTimeField` that automatically sets the current
    timestamp when a new blog post is created.


    # 14.1.2 Creating Database Tables


    To create the corresponding database table for our model, we need to run migrations.
    In your terminal, navigate to your project''s root directory and run the following
    command:


    ```shell


    python manage.py makemigrations


    ```


    This command generates the necessary SQL statements to create the table based
    on our model definition. Next, apply the migrations by running:


    ```shell


    python manage.py migrate


    ```


    This command executes the SQL statements and creates the table in the database.


    # 14.2 Querying and Manipulating Data


    Once the model and database table are set up, we can perform various operations
    on the data, such as creating, retrieving, updating, and deleting records.


    # 14.2.1 Creating Records


    To create a new record in the database, we instantiate a model object and call
    its `save()` method. Let''s create a new blog post:


    ```python


    post = BlogPost(title=''First Post'', content=''This is my first blog post.'')


    post.save()


    ```


    In this example, we create a new `BlogPost` instance, set its attributes, and
    save it to the database.


    # 14.2.2 Retrieving Records


    To retrieve records from the database, we use Django''s query API. We can retrieve
    all blog posts, filter them based on certain criteria, or retrieve a single record
    by its primary key.


    To retrieve all blog posts, we use the following code:


    ```python


    all_posts = BlogPost.objects.all()


    ```


    This query returns a queryset containing all blog posts.


    To filter blog posts based on specific criteria, we use the `filter()` method.
    For example, to retrieve all posts with the word "Django" in the title, we can
    do:


    ```python


    django_posts = BlogPost.objects.filter(title__contains=''Django'')


    ```


    This query returns a queryset containing all blog posts that meet the specified
    criteria.


    To retrieve a single blog post by its primary key, we use the `get()` method.
    For example, to retrieve the blog post with the primary key of 1:


    ```python


    post = BlogPost.objects.get(pk=1)


    ```


    # 14.2.3 Updating and Deleting Records


    To update a record, we retrieve it from the database, modify its attributes, and
    call the `save()` method. For example, to update the content of a blog post:


    ```python


    post = BlogPost.objects.get(pk=1)


    post.content = ''Updated content.''


    post.save()


    ```


    To delete a record, we call its `delete()` method. For example, to delete a blog
    post:


    ```python


    post = BlogPost.objects.get(pk=1)


    post.delete()


    ```


    14.3 Summary


    In this chapter, we explored the concept of models in Django and how they represent
    database tables. We learned how to define models, create database tables through
    migrations, and perform various operations on the data, including creating, retrieving,
    updating, and deleting records.


    In the next chapter, we will delve into working with Django''s template system,
    which allows us to create dynamic and reusable HTML templates for our web application.


    # Chapter 15: Django Template System


    In Chapter 15 of "Django Programming for Beginners: A Practical Guide to Web Development,"
    we will explore the Django template system. The template system allows us to create
    dynamic and reusable HTML templates for our web application, separating the presentation
    logic from the underlying Python code.


    # 15.1 Introduction to Templates


    Templates in Django are HTML files that contain placeholders for dynamic content.
    These placeholders, known as template tags and filters, allow us to inject data,
    perform logic, and format the content before rendering it to the user.


    # 15.2 Creating Templates


    To create a template, we need to define an HTML file with the necessary placeholders
    and logic. Django uses a templating language that provides syntax and constructs
    for working with dynamic content.


    # 15.2.1 Template Tags


    Template tags are enclosed in `{% %}` and allow us to execute logic and control
    the flow of the template. Let''s look at some common template tags:


    - `{% if %}`: Allows conditional rendering based on a condition. For example:


    ```html


    {% if user.is_authenticated %}


    <p>Welcome, {{ user.username }}!</p>


    {% else %}


    <p>Please log in to continue.</p>


    {% endif %}


    ```


    - `{% for %}`: Enables iteration over a collection of objects. For example:


    ```html


    <ul>


    {% for post in posts %}


    <li>{{ post.title }}</li>


    {% endfor %}


    </ul>


    ```


    - `{% url %}`: Generates a URL based on a named URL pattern. For example:


    ```html


    <a href="{% url ''blog:post_detail'' post.id %}">Read More</a>


    ```


    # 15.2.2 Template Filters


    Template filters are enclosed in `{{ }}` and allow us to modify the output or
    format the data. Let''s see some examples:


    - `{{ variable|lower }}`: Converts the variable to lowercase.


    - `{{ variable|date:"F d, Y" }}`: Formats a date variable.


    - `{{ variable|truncatewords:10 }}`: Truncates a string variable to a specified
    number of words.


