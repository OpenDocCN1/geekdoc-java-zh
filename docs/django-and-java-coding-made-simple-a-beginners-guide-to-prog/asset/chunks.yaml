    在上面的示例中，我们声明并初始化了一个名为 `matrix` 的二维数组。它包含三行三列。\n\n要访问多维数组中的元素，我们使用嵌套循环。\n\n示例：\n\
    \n```java\nfor (int i = 0; i < matrix.length; i++) {\n    for (int j = 0; j <\
    \ matrix[i].length; j++) {\n        System.out.print(matrix[i][j] + \" \");\n\
    \    }\n    System.out.println();\n}\n```\n\n在上面的示例中，我们使用嵌套的 `for` 循环来遍历 `matrix`\
    \ 数组的每个元素并逐行打印。\n\n### 5.8 总结\n\n在本章中，我们探讨了 Java 中数组的概念。数组是强大的数据结构，允许我们存储和操作元素集合。我们学习了如何声明和初始化数组、访问和修改数组元素、获取数组长度以及使用循环遍历数组。我们还简要提到了多维数组。\n\
    \n数组为处理相同类型的多个值提供了一种方便的方法，并在组织和处理数据方面提供了灵活性。它们被广泛应用于各种编程场景，例如存储数字列表、管理对象集合等。\n"
- fmt: "\nJava provides access modifiers to control the visibility and accessibility\
    \ of class members. The four access modifiers are:\n\n- `public`: The member is\
    \ accessible from anywhere.\n- `private`: The member is only accessible within\
    \ the same class.\n- `protected`: The member is accessible within the same class,\
    \ subclasses, and same package.\n- Default (no modifier): The member is accessible\
    \ within the same package.\n\nBy default, fields should be declared as `private`,\
    \ and access to them should be provided through methods (`getters` and `setters`)\
    \ to maintain encapsulation and ensure data integrity.\n\nExample:\n\n```java\n\
    public class Car {\n    // Private fields\n    private String brand;\n    private\
    \ String color;\n    private int year;\n\n    // Getters and setters\n    public\
    \ String getBrand() {\n        return brand;\n    }\n\n    public void setBrand(String\
    \ brand) {\n        this.brand = brand;\n    }\n\n    public String getColor()\
    \ {\n        return color;\n    }\n\n    public void setColor(String color) {\n\
    \        this.color = color;\n    }\n\n    public int getYear() {\n        return\
    \ year;\n    }\n\n    public void setYear(int year) {\n        this.year = year;\n\
    \    }\n\n    // Methods\n    public void startEngine() {\n        System.out.println(\"\
    Engine started!\");\n    }\n\n    public void drive(int distance) {\n        System.out.println(\"\
    Driving \" + distance + \" kilometers.\");\n    }\n}\n```\n\nIn the example above,\
    \ we have modified the `Car` class to encapsulate the fields by making them `private`.\
    \ We provide `public` `getter` and `setter` methods to access and modify the `private`\
    \ fields. This way, we can control the access to the internal state of the `Car`\
    \ objects while maintaining data integrity.\n\n# 6.5 Constructors\n\nA constructor\
    \ is a special method that is used to initialize the objects of a class. It is\
    \ called when an object is created using the `new` keyword. Constructors have\
    \ the same name as the class and do not have a return type.\n\nExample:\n\n```java\n\
    public class Car {\n    private String brand;\n    private String color;\n   \
    \ private int year;\n\n    // Default constructor\n    public Car() {\n      \
    \  brand = \"Unknown\";\n        color = \"Unknown\";\n        year = 0;\n   \
    \ }\n\n    // Parameterized constructor\n    public Car(String brand, String color,\
    \ int year) {\n        this.brand = brand;\n        this.color = color;\n    \
    \    this.year = year;\n    }\n    // ...\n}\n```\n\nIn the example above, we\
    \ have added two constructors to the `Car` class. The default constructor sets\
    \ the initial values of the fields to default values. The parameterized constructor\
    \ takes arguments to initialize the fields with specific values.\n\n# 6.6 Inheritance\n\
    \nInheritance is a mechanism in OOP that allows a class (subclass) to inherit\
    \ the properties and behaviors of another class (superclass). The subclass `extends`\
    \ the superclass, inheriting its fields, methods, and constructors. It promotes\
    \ code reuse and supports the concept of hierarchical relationships between classes.\n\
    \nTo create a subclass, we use the `extends` keyword:\n\n```java\npublic class\
    \ SubclassName extends SuperclassName {\n    // Subclass members\n}\n```\n\nExample:\n\
    \n```java\npublic class SportsCar extends Car {\n    // Additional members and\
    \ methods specific to SportsCar\n    // ...\n}\n```\n\nIn the example above, we\
    \ define a `SportsCar` class that `extends` the `Car` class. The `SportsCar` class\
    \ inherits the fields and methods of the `Car` class and can also define additional\
    \ members and methods specific to sports cars.\n\n# 6.7 Polymorphism\n\nPolymorphism\
    \ is another important concept in OOP that allows objects of different classes\
    \ to be treated as objects of a common superclass. It enables methods to be overridden\
    \ in subclasses, providing different implementations while retaining a common\
    \ interface.\n\nExample:\n\n```java\npublic class Car {\n    // ...\n    public\
    \ void drive() {\n        System.out.println(\"Driving a car.\");\n    }\n}\n\n\
    public class SportsCar extends Car {\n    // ...\n    @Override\n    public void\
    \ drive() {\n        System.out.println(\"Driving a sports car at high speed!\"\
    );\n    }\n}\n\npublic class SedanCar extends Car {\n    // ...\n    @Override\n\
    \    public void drive() {\n        System.out.println(\"Driving a sedan car smoothly.\"\
    );\n    }\n}\n```\n\nIn the example above, the `SportsCar` and `SedanCar` classes\
    \ both `extends` the `Car` class and override the `drive()` method with their\
    \ specific implementations. When we call the `drive()` method on objects of these\
    \ classes, the appropriate implementation based on the actual object type will\
    \ be executed.\n\n```java\nCar car1 = new Car();\ncar1.drive();              //\
    \ Output: \"Driving a car.\"\n\nCar car2 = new SportsCar();\ncar2.drive();   \
    \           // Output: \"Driving a sports car at high speed!\"\n\nCar car3 = new\
    \ SedanCar();\ncar3.drive();              // Output: \"Driving a sedan car smoothly.\"\
    \n```\n\nIn the example above, the `drive()` method behaves differently based\
    \ on the actual object type, demonstrating polymorphism.\n\n# 6.8 Abstraction\n\
    \nAbstraction is the process of simplifying complex systems by representing only\
    \ essential details and hiding unnecessary complexities. In Java, abstraction\
    \ is achieved through abstract classes and interfaces.\n\nAn abstract class is\
    \ a class that cannot be instantiated and is meant to be extended by subclasses.\
    \ It can have abstract methods (methods without an implementation) and concrete\
    \ methods (methods with an implementation).\n\nExample:\n\n```java\npublic abstract\
    \ class Vehicle {\n    // Abstract method\n    public abstract void start();\n\
    \    // Concrete method\n    public void stop() {\n        System.out.println(\"\
    Vehicle stopped.\");\n    }\n}\n```\n\nIn the example above, the `Vehicle` class\
    \ is declared as abstract and contains an abstract method `start()` that must\
    \ be implemented by subclasses. It also has a concrete method `stop()`.\n\nInterfaces,\
    \ on the other, define a contract of methods that implementing classes must adhere\
    \ to. An interface can have constant fields and abstract methods but cannot have\
    \ instance fields or concrete methods.\n\nExample:\n\n```java\npublic interface\
    \ Driveable {\n    // Constant field\n    public static final int MAX_SPEED =\
    \ 100;\n    // Abstract method\n    public void drive();\n}\n```\n\nIn the example\
    \ above, the `Driveable` interface defines a constant field `MAX_SPEED` and an\
    \ abstract method `drive()`.\n\nClasses can implement multiple interfaces but\
    \ can only extend one class. By using abstraction, we can define common behaviors\
    \ and enforce a consistent structure.\n\n 6.9 Summary\n\nIn this chapter, we explored\
    \ the concept of Object-Oriented Programming (OOP). We learned about classes and\
    \ objects, encapsulation, access modifiers, constructors, inheritance, polymorphism,\
    \ and abstraction. OOP allows us to create modular, reusable, and maintainable\
    \ code by modeling real-world entities as objects with properties and behaviors.\n\
    \nBy using OOP principles, we can design programs that are easier to understand,\
    \ extend, and maintain. Classes and objects provide a way to organize and structure\
    \ our code, while encapsulation and access modifiers ensure data protection and\
    \ control. Inheritance and polymorphism promote code reuse and enable flexibility,\
    \ and abstraction helps in simplifying complex systems.\n\nIn the next chapter,\
    \ we will explore more advanced topics in Java, including exception handling,\
    \ file I/O, and generics. These concepts will further enhance your understanding\
    \ of the Java programming language and expand your programming capabilities.\n\
    \n# 7. Exception Handling and File I/O\n\nIn the previous chapters, we covered\
    \ the basics of Java programming, including variables, control flow, methods,\
    \ arrays, Object-Oriented Programming (OOP), and more. Now, in Chapter 7, we will\
    \ explore two important topics: Exception Handling and File Input/Output (I/O).\n\
    \n# 7.1 Introduction to Exception Handling\n\nException handling is a mechanism\
    \ in Java that allows us to handle runtime errors or exceptional conditions that\
    \ may occur during the execution of a program. These exceptions can be caused\
    \ by various factors, such as invalid input, divide-by-zero errors, file not found,\
    \ and more.\n"
  raw: 'Java provides access modifiers to control the visibility and accessibility
    of class members. The four access modifiers are:


    - `public`: The member is accessible from anywhere.


    - `private`: The member is only accessible within the same class.


    - `protected`: The member is accessible within the same class, subclasses, and
    same package.


    - Default (no modifier): The member is accessible within the same package.


    By default, fields should be declared as private, and access to them should be
    provided through methods (getters and setters) to maintain encapsulation and ensure
    data integrity.


    Example:


    ```java


    public class Car {


    // Private fields


    private String brand;


    private String color;


    private int year;


    // Getters and setters


    public String getBrand() {


    return brand;


    }


    public void setBrand(String brand) {


    this.brand = brand;


    }


    public String getColor() {


    return color;


    }


    public void setColor(String color) {


    this.color = color;


    }


    public int getYear() {


    return year;


    }


    public void setYear(int year) {


    this.year = year;


    }


    // Methods


    public void startEngine() {


    System.out.println("Engine started!");


    }


    public void drive(int distance) {


    System.out.println("Driving " + distance + " kilometers.");


    }


    }


    ```


    In the example above, we have modified the `Car` class to encapsulate the fields
    by making them private. We provide public getter and setter methods to access
    and modify the private fields. This way, we can control the access to the internal
    state of the `Car` objects while maintaining data integrity.


    # 6.5 Constructors


    A constructor is a special method that is used to initialize the objects of a
    class. It is called when an object is created using the `new` keyword. Constructors
    have the same name as the class and do not have a return type.


    Example:


    ```java


    public class Car {


    private String brand;


    private String color;


    private int year;


    // Default constructor


    public Car() {


    brand = "Unknown";


    color = "Unknown";


    year = 0;


    }


    // Parameterized constructor


    public Car(String brand, String color, int year) {


    this.brand = brand;


    this.color = color;


    this.year = year;


    }


    // ...


    }


    ```


    In the example above, we have added two constructors to the `Car` class. The default
    constructor sets the initial values of the fields to default values. The parameterized
    constructor takes arguments to initialize the fields with specific values.


    # 6.6 Inheritance


    Inheritance is a mechanism in OOP that allows a class (subclass) to inherit the
    properties and behaviors of another class (superclass). The subclass extends the
    superclass, inheriting its fields, methods, and constructors. It promotes code
    reuse and supports the concept of hierarchical relationships between classes.


    To create a subclass, we use the `extends` keyword:


    ```java


    public class SubclassName extends SuperclassName {


    // Subclass members


    }


    ```


    Example:


    ```java


    public class SportsCar extends Car {


    // Additional members and methods specific to SportsCar


    // ...


    }


    ```


    In the example above, we define a `SportsCar` class that extends the `Car` class.
    The `SportsCar` class inherits the fields and methods of the `Car` class and can
    also define additional members and methods specific to sports cars.


    # 6.7 Polymorphism


    Polymorphism is another important concept in OOP that allows objects of different
    classes to be treated as objects of a common superclass. It enables methods to
    be overridden in subclasses, providing different implementations while retaining
    a common interface.


    Example:


    ```java


    public class Car {


    // ...


    public void drive() {


    System.out.println("Driving a car.");


    }


    }


    public class SportsCar extends Car {


    // ...


    @Override


    public void drive() {


    System.out.println("Driving a sports car at high speed!");


    }


    }


    public class SedanCar extends Car {


    // ...


    @Override


    public void drive() {


    System.out.println("Driving a sedan car smoothly.");


    }


    }


    ```


    In the example above, the ` SportsCar` and `SedanCar` classes both extend the
    `Car` class and override the `drive()` method with their specific implementations.
    When we call the `drive()` method on objects of these classes, the appropriate
    implementation based on the actual object type will be executed.


    ```java


    Car car1 = new Car();


    car1.drive();           // Output: "Driving a car."


    Car car2 = new SportsCar();


    car2.drive();           // Output: "Driving a sports car at high speed!"


    Car car3 = new SedanCar();


    car3.drive();           // Output: "Driving a sedan car smoothly."


    ```


    In the example above, the `drive()` method behaves differently based on the actual
    object type, demonstrating polymorphism.


    # 6.8 Abstraction


    Abstraction is the process of simplifying complex systems by representing only
    essential details and hiding unnecessary complexities. In Java, abstraction is
    achieved through abstract classes and interfaces.


    An abstract class is a class that cannot be instantiated and is meant to be extended
    by subclasses. It can have abstract methods (methods without an implementation)
    and concrete methods (methods with an implementation).


    Example:


    ```java


    public abstract class Vehicle {


    // Abstract method


    public abstract void start();


    // Concrete method


    public void stop() {


    System.out.println("Vehicle stopped.");


    }


    }


    ```


    In the example above, the `Vehicle` class is declared as abstract and contains
    an abstract method `start()` that must be implemented by its subclasses. It also
    has a concrete method `stop()` with a default implementation.


    Interfaces, on the other hand, define a contract of methods that implementing
    classes must adhere to. An interface can have constant fields and abstract methods
    but cannot have instance fields or concrete methods.


    Example:


    ```java


    public interface Driveable {


    // Constant field


    public static final int MAX_SPEED = 100;


    // Abstract method


    public void drive();


    }


    ```


    In the example above, the `Driveable` interface defines a constant field `MAX_SPEED`
    and an abstract method `drive()`.


    Classes can implement multiple interfaces but can only extend one class. By using
    abstraction, we can define common behaviors and enforce a consistent structure
    in our code.


    6.9 Summary


    In this chapter, we explored the concept of Object-Oriented Programming (OOP).
    We learned about classes and objects, encapsulation, access modifiers, constructors,
    inheritance, polymorphism, and abstraction. OOP allows us to create modular, reusable,
    and maintainable code by modeling real-world entities as objects with properties
    and behaviors.


    By using OOP principles, we can design programs that are easier to understand,
    extend, and maintain. Classes and objects provide a way to organize and structure
    our code, while encapsulation and access modifiers ensure data protection and
    control. Inheritance and polymorphism promote code reuse and enable flexibility,
    and abstraction helps in simplifying complex systems.


    In the next chapter, we will explore more advanced topics in Java, including exception
    handling, file I/O, and generics. These concepts will further enhance your understanding
    of the Java programming language and expand your programming capabilities.


    # Chapter 7: Exception Handling and File I/O


    In the previous chapters, we covered the basics of Java programming, including
    variables, control flow, methods, arrays, Object-Oriented Programming (OOP), and
    more. Now, in Chapter 7, we will explore two important topics: Exception Handling
    and File Input/Output (I/O).


    # 7.1 Introduction to Exception Handling


    Exception handling is a mechanism in Java that allows us to handle runtime errors
    or exceptional conditions that may occur during the execution of a program. These
    exceptions can be caused by various factors, such as invalid input, divide-by-zero
    errors, file not found, and more.'
