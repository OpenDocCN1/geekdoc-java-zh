    \ `MyBatis`，为 Java 中的数据库交互提供了更高层次的抽象。ORM 框架将 Java 对象映射到数据库表，抽象了 `SQL` 查询和特定于数据库的操作的复杂性。\n\
    \nORM 框架提供了自动映射、查询生成、缓存和事务管理等功能，简化了数据库驱动型应用程序的开发。\n\n使用 Hibernate 的示例：\n\n```java\n\
    @Entity\n@Table(name = \"users\")\npublic class User {\n    @Id\n    @GeneratedValue(strategy\
    \ = GenerationType.IDENTITY)\n    private Long id;\n    @Column(name = \"name\"\
    )\n    private String name;\n    // Getters and setters\n}\n\n// Usage\nSession\
    \ session = HibernateUtil.getSessionFactory().openSession();\nTransaction transaction\
    \ = session.beginTransaction();\nUser user = new User();\nuser.setName(\"John\
    \ Doe\");\nsession.save(user);\ntransaction.commit();\nsession.close();\n```\n\
    \n在这个示例中，我们定义了一个带有 Hibernate 注解的 `User` 实体类。我们创建了 `User` 的新实例，设置其属性并使用 Hibernate\
    \ 的会 API 将其保存到数据库。\n\nORM 框架提供了一种方便且面向对象的数据库交互方式，抽象了 `JDBC` 和 `SQL` 的底层细节。\n\n\
    # 10.4 事务管理\n\n事务管理是数据库交互的一个至重要方面。事务是一个逻辑工作单元，由多个数据库操作组成，如插入、更新和删除。事务通过将相关的数据库操作分组并强制\
    \ `ACID`（原子性、一致性、隔离性、持久性）属性来确保数据的完整性和一致性。\n\n在 Java 中，我们可以使用 JDBC 的 `Connection`\
    \ 接口或借助 `Hibernate` 等 ORM 框架来管理事务，这些框架为事务管理提供了更高层次的抽象。\n\n使用 JDBC 的示例：\n\n```java\n\
    Connection connection = DriverManager.getConnection(url, username, password);\n\
    connection.setAutoCommit(false);\ntry {\n    // Perform database operations\n\
    \    // ...\n    // Commit the transaction\n    connection.commit();\n} catch\
    \ (SQLException e) {\n    // 在发生错误时回滚事务\n    connection.rollback();\n    e.printStackTrace();\n\
    } finally {\n    // 关闭连接\n    connection.close();\n}\n```\n\n在这个示例中，我们禁用了自动提交模式并手动管理事务。如果在数据库操作期间发生异常，我们将回滚事务以撤销任何已更改并确保数据一致性。\n\
    \n# 10.5 数据访问模式\n\n在与数据库交互时，遵循良好的数据访问模式对于优化性能和维护代码的可维护性至关重要。常见的数据访问模式包括：\n\n-\
    \ 数据访问对象 (DAO)：`DAO` 模式将数据访问逻辑与应用程序的业务逻辑分离。它为对特定实体执行 `CRUD`（创建、读取、更新、删除）操作提供了统一的接口。\n\
    - 仓库 (Repository)：`repository` 模式抽象了特定领域实体的存储存储和检索操作。它提供了一个更高层次的 API 来查询和操作数据，而不暴露底层的数据库细节。\n\
    - 查询生成器 (Query Builder)：`query builder` 模式提供了一种流式且编程的方式来构建 `SQL` 查询。它允许根据运行时条件动态生成查询，并有助于代码的重用。\n\
    \n通过遵循这些模式，我们可以编写出更整洁、更易维护的数据库代码。\n\n在本章中，我们探索了使用 Java 与数据库交互的基础知识。我们学习了提供底层数据库访问\
    \ API 的 `JDBC`，以及提供高级抽象的 `Hibernate` 等 ORM 框架。我们还讨论了事务管理常见的数据访问模式。\n\n在下一章中，我们将深入研究\
    \ Java Web 开发，并探索如何使用流行的框架和技术构建 Web 应用程序。\n\n# 第 11 章：Java Web 开发\n\n在当今数字时代，Web\
    \ 开发是构建交互式动态应用程序的关键技能。Java 为 Web 开发提供了健壮的生态系统，提供了各种简化开发过程的框架和技术。在本章中，我们将探索 Java\
    \ Web 开发的世界。\n\n# 11.1 Web 开发简介\n\nWeb 开发是指创建在网络浏览器上并与用户交互的 Web 应用程序。它涉及网站和 Web\
    \ 系统的设计、构建和维护。Web 开发涵盖了 Web 应用程序的客户端（前端）和服务端（后端）组件。\n\n客户端技术包括 `HTML`、`CSS` 和\
    \ `JavaScript`，它们决定了应用程序的用户界面和交互性。服务端技术处理 Web 应用程序的处理、逻辑和数据管理。\n\n# 11.2 Java\
    \ Web 技术\n\nJava 为 Web 开发提供了一系列技术和框架。让我们探索一些关键组件：\n\n## 11.2.1 Java Servlets\n\
    \nJava Servlets 提供了一种在 Java 中构建 Web 应用程序的平台无关的方法。Servlet 是扩展了 `javax.servlet.HttpServlet`\
    \ 类的 Java 类，处理 HTTP 请求和响应。它们是 Java 服务端 Web 开发的基础。\n\nServlet 接收请求、执行业务逻辑并生成发送回客户端的动态内容。它们可以处理各种\
    \ HTTP 方法，如 `GET`、`POST`、`PUT` 和 `DELETE`，使其在构建 `RESTful` API 时非常灵活。\n\n示例 Servlet：\n\
    \n```java\n@WebServlet(\"/hello\")\npublic class HelloServlet extends HttpServlet\
    \ {\n    protected void doGet(HttpServletRequest request, HttpServletResponse\
    \ response) throws ServletException, IOException {\n        response.setContentType(\"\
    text/html\");\n        PrintWriter out = response.getWriter();\n        out.println(\"\
    <html><body>\");\n        out.println(\"<h2>Hello, Servlet!</h2>\");\n       \
    \ out.println(\"</body></html>\");\n        out.close();\n    }\n}\n```\n\n在这个示例中，我们创建了一个简单的\
    \ Servlet，它响应一个显示“Hello, Servlet!”消息的 HTML 页面。\n\n## 11.2.2 JavaServer Pages (JSP)\n\
    \nJavaServer Pages (JSP) 是一种使用 HTML 和 Java 代码结合创建动态 Web 页的技术。JSP 页面被编译成 Servlet\
    \ 并在服务器执行，生成发送到客户端的动态内容。\n\nJSP 提供了一种方便的方法将表示层（HTML）与业务逻辑（Java 代码）分离。它允许在 HTML\
    \ 模板中嵌入 Java 代码，从而轻松地生成动态内容。\n\n示例 JSP：\n\n```jsp\n<html>\n<body>\n<h2>Hello,\
    \ JSP!</h2>\n<p>Today is <%= new java.util.Date() %></p>\n</body>\n</html>\n```\n\
    \n"
