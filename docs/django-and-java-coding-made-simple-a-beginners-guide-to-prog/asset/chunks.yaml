    easy access, storage, and retrieval. Databases play a crucial role in applications
    by providing a centralized and efficient way to store and manage data.


    There are different types of databases, including relational databases (such as
    MySQL, PostgreSQL, and Oracle), NoSQL databases (such as MongoDB and Cassandra),
    and in-memory databases (such as Redis and Apache Ignite). Each type has its own
    strengths and use cases.


    # 12.2 JDBC: Java Database Connectivity


    Java Database Connectivity (JDBC) is a standard API for connecting Java applications
    to databases. It provides a set of classes and interfaces that allow developers
    to interact with databases using SQL queries.


    JDBC enables Java applications to perform essential database operations, such
    as establishing connections, executing queries, processing result sets, and managing
    transactions. It acts as a bridge between the Java application and the database,
    providing a standardized way to access and manipulate data.


    # 12.3 Connecting to a Database


