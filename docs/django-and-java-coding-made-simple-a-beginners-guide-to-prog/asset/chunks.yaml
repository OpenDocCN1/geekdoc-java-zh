    \n### 1.3.3 编写你的第一个 Java 程序\n\n一旦环境搭建完成，你就可以编写第一个 Java 程序了。使用你选择的 IDE，创建一个新项目和一个新的\
    \ Java `class`。在类文件中，编写一个简单的“Hello, World!”程序，这是初学者的传统起点。编译并运行程序以查看输出。\n\n恭喜！你已经迈向成为\
    \ Java 程序员的第一步。在下一章中，我们将更详细地探索 Java 语法和结构，深入研究变量、数据类型和控制流语句。准备好扩展你的知识并解锁 Java\
