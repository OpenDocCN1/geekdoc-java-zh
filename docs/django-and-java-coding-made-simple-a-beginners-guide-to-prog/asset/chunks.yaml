    \ 等。\n- 引用数据类型：`String`、`arrays`、`objects` 等。\n\n示例：\n```java\nint age = 25;\n\
    float price = 9.99f;\nString name = \"John\";\n```\n\n### 1.4.3 控制流语句\n\n控制流语句允许你控制程序的执行流。它们包括：\n\
