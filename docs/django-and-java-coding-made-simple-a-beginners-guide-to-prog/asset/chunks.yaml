  raw: 'In Chapter 4 of "Django Programming for Beginners: A Practical Guide to Web
    Development," we will focus on handling forms and user input in Django. Forms
    play a crucial role in web applications by allowing users to input data, submit
    it to the server, and perform various operations.


    # 4.1 Creating a Form


    In Django, forms are created using Python classes that inherit from the `django.forms.Form`
    or `django.forms.ModelForm` class. These classes define the fields and validation
    rules for the form.


    Let''s create a form to allow users to submit new blog posts. In your application
    directory, create a file called `forms.py`. Inside the file, define the following
    code:


    ```python


    from django import forms


    from .models import Post


    class PostForm(forms.ModelForm):


    class Meta:


    model = Post


    fields = [''title'', ''content'']


    ```


    In this example, we create a form called `PostForm` based on the `Post` model.
    The `Meta` class specifies the model and the fields we want to include in the
    form.


    # 4.2 Rendering the Form


    To display the form in a web page, we need to render it in a template. Open the
    `posts.html` template we created in the previous chapter (`Chapter 3`) and update
    it as follows:


    ```html


    <div class="post-form">


    <h2>Create a New Blog Post</h2>


    <form method="POST" action="{% url ''create_post'' %}">


    {% csrf_token %}


    {{ form.as_p }}


    <button type="submit">Submit</button>


    </form>


    </div>


    ```


    In this updated template, we added an HTML form that submits data to the URL named
    `''create_post''`. We use the `{% csrf_token %}` template tag to include a security
    token that protects against Cross-Site Request Forgery attacks. The `{{ form.as_p
    }}` template variable renders the form fields as paragraphs (`<p>` tags) for simplicity.


    # 4.3 Handling Form Submissions


    Now that we have the form rendered in the template, we need to handle form submissions
    in the view. Update the `blog_posts` view in your `views.py` file as follows:


    ```python


    from django.shortcuts import render, redirect


    from .forms import PostForm


    def blog_posts(request):


    if request.method == ''POST'':


    form = PostForm(request.POST)


    if form.is_valid():


    form.save()


    return redirect(''blog_posts'')


    else:


    form = PostForm()


    posts = Post.objects.all()


    return render(request, ''blog/posts.html'', {''posts'': posts, ''form'': form})


    ```


    In this updated view, we check if the request method is `''POST''`. If it is,
    we create an instance of the `PostForm` form using the data from the request.
    We then validate the form using the `is_valid()` method. If the form is valid,
    we save it to the database using `form.save()` and redirect the user back to the
    `''blog_posts''` URL.


    If the request method is not `''POST''`, we create a new instance of the form
    to be rendered in the template.


    # 4.4 Testing the Form


    Start the Django development server by running the following command:


    ```shell


    python manage.py runserver


    ```


    Visit `http://localhost:8000/posts/` in your web browser. You should see the form
    to create a new blog post. Fill in the fields and click the "Submit" button. The
    form data will be submitted to the server, saved in the database, and you will
    be redirected back to the blog posts page.


    4.5 Summary


    In this chapter, we explored the process of handling forms and user input in Django.
    We learned how to create a form using a form class, render the form in a template,
    and handle form submissions in a view.


    In the next chapter, we will discuss authentication and user management in Django,
    allowing us to implement user registration, login, and logout functionality.


    # Chapter 5: Authentication and User Management


    In Chapter 5 of "Django Programming for Beginners: A Practical Guide to Web Development,"
    we will focus on authentication and user management in Django. Authentication
    is an essential part of web applications, enabling users to register, log in,
    and access personalized features.


    # 5.1 User Registration


    To allow users to register an account, we need to create a registration form and
    handle the registration process. Let''s start by creating a registration form.


    In your application directory, create a file called `forms.py` (if it doesn''t
    already exist). Inside the file, define the following code:


    ```python


    from django import forms


    from django.contrib.auth.forms import UserCreationForm


    class RegistrationForm(UserCreationForm):


    email = forms.EmailField()


    class Meta:


    model = User


    fields = [''username'', ''email'', ''password1'', ''password2'']


    ```


    In this example, we inherit from Django''s `UserCreationForm`, which provides
    the necessary fields and validation for user registration. We add an additional
    field for the email address.


    # 5.2 User Registration View


    Next, we need to create a view to handle the user registration process. Open your
    `views.py` file and add the following code:


    ```python


    from django.shortcuts import render, redirect


    from .forms import RegistrationForm


    def register(request):


    if request.method == ''POST'':


    form = RegistrationForm(request.POST)


    if form.is_valid():


    form.save()


    return redirect(''login'')


    else:


    form = RegistrationForm()


    return render(request, ''registration/register.html'', {''form'': form})


    ```


    In this view, if the request method is `''POST''`, we create an instance of the
    `RegistrationForm` form using the data from the request. We validate the form
    and, if it is valid, save the user registration and redirect them to the login
    page.


    If the request method is not `''POST''`, we create a new instance of the form
    to be rendered in the template.


    # 5.3 Registration Template


    To display the registration form, we need to create a template. Create a directory
    called `registration` inside your `templates` directory. Inside the `registration`
    directory, create a file named `register.html`. Open the `register.html` file
    and define the following code:


    ```html


    <h2>Register</h2>


    <form method="POST" action="{% url ''register'' %}">


    {% csrf_token %}


    {{ form.as_p }}


    <button type="submit">Register</button>


    </form>


    ```


    In this template, we display the registration form using the `{{ form.as_p }}`
    template variable, which renders the form fields as paragraphs for simplicity.


    # 5.4 Mapping URLs


    To access the registration form, we need to map a URL to the registration view.
    Open your project''s `urls.py` file and add the following code:


    ```python


    from django.urls import path


    from .views import register


    urlpatterns = [


    path(''register/'', register, name=''register''),


    ]


    ```


    In this example, we associate the URL pattern `/register/` with the `register`
    view. Users can access the registration form by visiting this URL.


    # 5.5 Testing User Registration


    Start the Django development server by running the following command:


    ```shell


    python manage.py runserver


    ```


    Visit `http://localhost:8000/register/` in your web browser. You should see the
    registration form. Fill in the required fields and click the "Register" button.
    If the form data is valid, the user will be registered, and they will be redirected
    to the login page.


    5.6 Summary


    In this chapter, we explored user registration in Django. We


    learned how to create a registration form, handle the registration process in
    a view, and map a URL to the registration view.


    In the next chapter, we will discuss user authentication, allowing users to log
    in and log out of our web application.


