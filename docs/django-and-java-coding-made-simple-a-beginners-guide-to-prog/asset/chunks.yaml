  trans: "\n在上面的示例中，我们定义了一个泛型方法 `printArray`，它接受一个类型为 `T` 的数组作为参数。该方法遍历数组元素并将每个元素打印到控制台。\n\
    \n# 8.4 边界类型参数\n\n我们可以通过边界类型参数（bounded type parameters）进一步限制可以用作类型参数的类型。边界类型参数允许我们指定类型参数必须是特定类的子类或实现特定的接口。\n\
    \n语法：\n\n```java\npublic class ClassName<T extends BoundType> {\n    // 类成员和方法\n\
    }\n```\n\n示例：\n\n```java\npublic class Box<T extends Number> {\n  private T item;\n\
    \  public void setItem(T item) {\n    this.item = item;\n  }\n  public T getItem()\
    \ {\n    return item;\n  }\n}\n```\n\n在上面的示例中，我们定义了一个泛型类 `Box`，它带有边界类型参数 `T`，该参数必须是\
    \ `Number` 的子类。这限制了用于 `Box` 类的类型只能为数值类型。\n\n# 8.5 泛型中的通配符\n\n泛型中的通配符允许我们表示未知类型或类型范围。Java\
    \ 泛型中的两种通配符类型是 `?` 通配符（无界通配符）和 `? extends Type` 通配符（边界通配符）。\n\n语法：\n\n```java\n\
    public void methodName(List<?> list) {\n    // 方法体\n}\n```\n\n示例：\n\n```java\n\
    import java.util.List;\npublic void processList(List<?> list) {\n  for (Object\
    \ element : list) {\n    System.out.println(element);\n  }\n}\n```\n\n在上面的示例中，我们定义了一个方法\
    \ `processList`，接受带有无界通配符 `?` 的 `List` 作为参数。该方法可以接受任何类型的列表。它遍历列表元素并将每个元素打印到控制台。\n\
    \n# 8.6 泛型的类型推断\n\n在 Java 7 及更高版本中，编译器可以根据方法参数推断泛型方法调用的类型参数。这一特性被称为类型推断。\n\n示例：\n\
    \n```java\nList<String> stringList = new ArrayList<>();\nstringList.add(\"Hello\"\
    );\nstringList.add(\"World\");\nprintList(stringList); // 类型推断正在生效\npublic static\
    \ void printList(List<?> list) {\n  for (Object element : list) {\n    System.out.println(element);\n\
    \  }\n}\n```\n\n在上面的示例中，我们创建了一个 `String` 对象的 `List`。当我们用 `stringList` 作为参数调用 `printList`\
    \ 方法时，编译器根据参数的类型自动推断出类型参数 `String`。因此，我们不需要显式地指定类型参数。\n\n# 8.7 类型擦除与类型边界\n\nJava\
    \ 使用类型擦除（type erasure）来实现泛型，这意味着类型参数在运行时会被擦除。编译器会将类型参数替换为它们的边界类型，或者在未指定边界时替换为\
    \ `Object` 类型。\n\n示例：\n\n```java\npublic class Box<T extends Number> {\n  private\
    \ T item;\n  public void setItem(T item) {\n    this.item = item;\n  }\n  public\
    \ T getItem() {\n    return item;\n  }\n}\n```\n\n在上面的示例中，尽管我们使用了类型参数 `T`，但在运行时，实际类型会被擦除为其边界类型\
    \ `Number`。这允许编译器在确保类型安全的同时保持灵活性。\n\n# 8.8 泛型使用指南\n\n在使用泛型时，请考虑以下指南：\n\n- 当你需要创建可以处理不同数据类型的复用代码时，使用泛型。\n\
    - 使用边界类型参数来限制可以作为类型参数的类型。\n- 利用类型推断来避免显式指定类型参数。\n- 注意类型擦除，并理解类型参数会在运行时被擦除。\n-\
    \ 当你需要表示未知类型或类型范围时，使用通配符。\n\n通过有效理解并应用泛型，你可以在 Java 中编写更灵活、类型安全且可重用的代码。\n\n在下一章，我们将深入另一个重要主题：多线程。多线程允许程序并发执行多个任务，提高效率和响应能力。\n\
    \n# 第 9 章：多线程\n\n在之前的章节中，我们涵盖了广泛的 Java 主题，包括变量、控制流、OOP、异常处理、文件 I/O 和泛型。现在，在第 9\
    \ 章中，我们将探索 Java 多线程的迷人世界。\n\n# 9.1 多线程简介\n\n多线程是程序并发执行多个线程的能力。线程是轻量级的执行单元，代表程序内部的独立执行路径。多线程允许程序同时执行多个任务，使其更高效、响应更迅速。\n\
    \n# 9.2 创建线程\n\n在 Java 中，创建线程有两种方式：通过扩展 `Thread` 类或实现 `Runnable` 接口。\n\n## 9.2.1\
    \ 扩展 Thread 类\n\n要通过扩展 `Thread` 类创建线程，我们需要重写 `run()` 方法，它是线程执行的入口点。`run()` 方法包含将在独立线程中执行的代码。\n\
    \n示例：\n\n```java\npublic class MyThread extends Thread {\n  @Override\n  public\
    \ void run() {\n    // 在线程中执行的代码\n  }\n}\n```\n\n要启动线程，我们创建 `MyThread` 类的实例并调用\
    \ `start()` 方法。\n\n示例：\n\n```java\nMyThread thread = new MyThread();\nthread.start();\n\
    ```\n\n## 9.2.2 实现 Runnable 接口\n\n创建线程的另一种方法是实现 `Runnable` 接口。`Runnable` 接口表示可以并发执行的任务。\n\
    \n示例：\n\n```java\npublic class MyRunnable implements Runnable {\n  @Override\n\
    \  public void run() {\n    // 在线程中执行的代码\n  }\n}\n```\n\n要启动线程，我们创建 `MyRunnable`get\
    \ 实例并将其作为参数传递给 `Thread` 对象。然后我们调用 `Thread` 对象的 `start()` 方法。\n\n示例：\n\n```java\n\
    MyRunnable runnable = new MyRunnable();\nThread thread = new Thread(runnable);\n\
    thread.start();\n```\n"
- fmt: "\n# 9.3 Thread Synchronization\n\nIn multithreaded environments, it is common\
    \ to encounter situations where multiple threads access shared resources simultaneously.\
    \ This can lead to data inconsistencies and race conditions. Thread synchronization\
    \ allows us to control the access to shared resources and ensure that only one\
    \ thread can access them at a time.\n\nIn Java, we can achieve thread synchronization\
    \ using the `synchronized` keyword or by using locks from the `java.util.concurrent.locks`\
    \ package.\n\n# 9.4 Thread Communication\n\nThread communication is important\
    \ when threads need to cooperate or exchange information. Java provides several\
    \ methods for thread communication, such as `wait()`, `notify()`, and `notifyAll()`,\
    \ which are available in the `Object` class.\n\nBy using these methods, threads\
    \ can communicate and coordinate their activities, preventing deadlocks and improving\
    \ the overall efficiency of multithreaded programs.\n\n# 9.5 Thread Safety\n\n\
    Thread safety is a critical aspect of multithreaded programming. It refers to\
    \ the property of a program or code that ensures correct behavior when accessed\
    \ by multiple threads simultaneously. Thread-safe code eliminates race conditions\
    \ and guarantees consistent and predictable results.\n\nTo achieve thread safety,\
    \ we can use techniques such as synchronization, atomic operations, and immutable\
    \ objects.\n\n# 9.6 Thread Pooling\n\nCreating a new thread for every task in\
    \ a multithreaded program can be expensive and inefficient. Thread pooling provides\
    \ a solution by reusing threads from a pool of pre-created threads, reducing the\
    \ overhead of thread creation.\n\nJava provides the `ExecutorService` framework,\
    \ which allows us to create and manage thread pools. By utilizing thread pooling,\
    \ we can improve the performance and scalability of our multithreaded applications.\n\
    \n# 9.7 Thread Interference and Memory Consistency\n\nIn multithreaded programming,\
    \ thread interference can occur when two or more threads access shared data concurrently,\
    \ leading to unexpected and incorrect results. To prevent thread interference,\
    \ we need to ensure proper synchronization and access to shared data.\n\nAdditionally,\
    \ memory consistency is an important consideration in multithreaded environments.\
    \ The Java Memory Model (JMM) defines the rules and guarantees for how threads\
    \ interact with memory. Understanding the JMM and its memory consistency effects\
    \ is crucial for writing correct and reliable multithreaded code.\n\n# 9.8 Thread\
    \ Priorities and Thread States\n\nJava provides thread priorities to assign different\
    \ levels of importance to threads. Thread priorities range from 1 to 10, with\
    \ 1 being the lowest priority and 10 being the highest. However, thread priorities\
    \ should be used with caution as they are platform-dependent and may not have\
    \ consistent behavior across different operating systems.\n\nThreads in Java can\
    \ exist in different states, such as `NEW`, `RUNNABLE`, `BLOCKED`, `WAITING`,\
    \ `TIMED_WAITING`, and `TERMINATED`. Understanding these thread states is essential\
    \ for managing and controlling the execution of threads.\n\n# 9.9 Thread Deadlock\
    \ and Avoiding Deadlock\n\nDeadlock occurs when two or more threads are blocked\
    \ indefinitely, waiting for each other to release the resources they hold. Deadlocks\
    \ can cause programs to hang or become unresponsive. Avoiding deadlock requires\
    \ careful design and synchronization of threads to prevent circular dependencies\
    \ and resource conflicts.\n\nTo prevent deadlock, it is essential to follow best\
    \ practices such as acquiring locks in a consistent order and using timeouts for\
    \ resource acquisition.\n\n# 9.10 Thread Safety in GUI Applications\n\nIn graphical\
    \ user interface (GUI) applications, multithreading plays a crucial role in providing\
    \ a responsive and interactive user experience. However, updating the GUI from\
    \ multiple threads can lead to synchronization issues and unpredictable behavior.\n\
    \nTo ensure thread safety in GUI applications, Java provides the `Event Dispatch\
    \ Thread` (EDT), which is responsible for handling UI events. All UI updates should\
    \ be performed on the EDT to avoid concurrency issues and maintain the responsiveness\
    \ of the application.\n\n# 9.11 Java Concurrency Utilities\n\nJava provides a\
    \ comprehensive set of concurrency utilities in the `java.util.concurrent` package,\
    \ which simplify the development of concurrent and multithreaded applications.\
    \ These utilities include thread pools, concurrent collections, locks, barriers,\
    \ semaphores, and atomic variables.\n\nBy utilizing the Java concurrency utilities,\
    \ we can write efficient, scalable, and thread-safe code, reducing the complexities\
    \ associated with multithreaded programming.\n\nIn this chapter, we explored the\
    \ fundamentals of multithreading in Java. We learned how to create threads, synchronize\
    \ access to shared resources, communicate between threads, ensure thread safety,\
    \ and manage thread execution. Understanding and effectively utilizing multithreading\
    \ concepts is crucial for developing robust and high-performance Java applications.\n\
    \nIn the next chapter, we will delve into the world of databases and explore how\
    \ to interact with them using Java.\n\n# Chapter 10: Database Interaction with\
    \ Java\n\nIn today's world, data is a critical component of most applications.\
    \ Whether it's storing user information, managing product inventory, or analyzing\
    \ customer behavior, databases play a vital role in handling and organizing data.\
    \ In this chapter, we will explore how to interact with databases using Java.\n\
    \n# 10.1 Introduction to Databases\n\nA database is a structured collection of\
    \ data that is organized and stored in a way that allows for efficient retrieval,\
    \ management, and manipulation of data. Databases provide a reliable and centralized\
    \ storage solution for applications to store and retrieve information.\n\nCommon\
    \ types of databases include relational databases (such as `MySQL`, `Oracle`,\
    \ and `PostgreSQL`), NoSQL databases (such as `MongoDB` and `Cassandra`), and\
    \ in-memory databases (such as `Redis`).\n\n# 10.2 Java Database Connectivity\
    \ (JDBC)\n\nJava Database Connectivity (JDBC) is a Java API that provides a standard\
    \ way to interact with databases. JDBC enables Java applications to connect to\
    \ a database, execute SQL queries, and perform various database operations.\n\n\
    To use JDBC, we need to follow these steps:\n\n1. Load the JDBC driver: We need\
    \ to load the appropriate JDBC driver for the database we want to connect to.\n\
    2. Establish a connection: We establish a connection to the database by providing\
    \ the necessary connection parameters, such as the database URL, username, and\
