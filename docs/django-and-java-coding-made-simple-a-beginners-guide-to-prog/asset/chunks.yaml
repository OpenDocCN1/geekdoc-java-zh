    \n## 1.3 入门 Java\n\n要开始你的 Java 之旅，你需要设置开发环境。以下是基本步骤：\n\n### 1.3.1 安装 Java 开发工具包\
    \ (JDK)\n\n`JDK` 是一个软件包，包含了编译、运行和调试 Java 程序所需的各种工具。访问 Oracle 官方网站并下载与你的操作系统兼容的最新版本\
    \ `JDK`。按照提供的安装说明完成设置。\n\n### 1.3.2 选择集成开发环境 (IDE)\n\n`IDE` 是一个为编写、调试和测试你的 Java\
