    create a file named `forms.py` in your app directory (if it doesn''t exist already).
    Add the following code to define a basic registration form:


    ```python


    from django import forms


    class RegistrationForm(forms.Form):


    username = forms.CharField(label=''Username'', max_length=100)


    email = forms.EmailField(label=''Email'')


    password = forms.CharField(label=''Password'', widget=forms.PasswordInput)


    ```


    In this example, we use the `forms.Form` class from Django to define our form.
    We add three fields: `username`, `email`, and `password`. Each field is represented
    by a form field class (e.g., `CharField`, `EmailField`) and can have optional
    parameters like `label` and `widget`.


    # 10.2 Displaying the Form


    Now that we have our form defined, let''s display it in a template. Create a file
    named `registration.html` in your app''s templates directory and add the following
    code:


    ```html


