    Finally, locate the `TEMPLATES` list and ensure that `''django.contrib.auth.context_processors.auth''`
    is included in the `''context_processors''` option.


    With these configurations, Django is ready to handle user authentication.


    # 12.2 User Registration


    Let''s start by creating a user registration form. In your app''s `forms.py` file,
    add the following code:


    ```python


    from django import forms


    from django.contrib.auth.forms import UserCreationForm


    class RegistrationForm(UserCreationForm):


    email = forms.EmailField()


    class Meta:


    model = User


    fields = [''username'', ''email'', ''password1'', ''password2'']


    ```


    In this example, we subclass `UserCreationForm` provided by Django, which includes
    fields for username and password. We add an additional `email` field and specify
    the `User` model.


    # 12.3 Displaying the Registration Form


    To display the user registration form, we need to create a template. Create a
    file named `registration.html` in your app''s templates directory and add the
    following code:


    ```html


    <form method="post">


    {% csrf_token %}


    {{ form.as_p }}


    <button type="submit">Register</button>


    </form>


    ```


    # 12.4 Handling User Registration


    To handle user registration, we need to modify our view. Open your app''s `views.py`
    file and add the following code:


    ```python


    from django.shortcuts import render, redirect


    from .forms import RegistrationForm


    def registration_view(request):


    if request.method == ''POST'':


    form = RegistrationForm(request.POST)


    if form.is_valid():


    form.save()


    return redirect(''registration_success'')


    else:


    form = RegistrationForm()


    return render(request, ''registration.html'', {''form'': form})


    def registration_success(request):


    return render(request, ''registration_success.html'')


    ```


    In this view, if the request method is POST, we validate the form and save the
    user if it is valid. Upon successful registration, we redirect the user to a success
    page.


    If the request method is GET or the form is not valid, we create a new instance
    of the form and render the template with the form.


    # 12.5 Mapping URLs


    To access the user registration form, we need to map a URL to the registration
    view. Open your project''s `urls.py` file and add the following code:


    ```python


    from django.urls import path


    from .views import registration_view, registration_success


    urlpatterns = [


    path(''register/'', registration_view, name=''registration_view''),


    path(''register/success/'', registration_success, name=''registration_success''),


    ]


    ```


    In this example, we associate the URL pattern `/register/` with the `registration_view`
    view and `/register/success/` with the `registration_success` view.


