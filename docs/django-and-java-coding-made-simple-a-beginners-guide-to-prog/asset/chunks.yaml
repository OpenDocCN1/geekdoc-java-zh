  trans: "\nJava 提供了访问修饰符来控制类成员可见性和可访问性。四种访问修饰符分别是：\n\n- `public`：成员可以从任何地方访问。\n-\
    \ `private`：成员仅在同一个类内可访问。\n- `protected`：成员可以在同一个类、子类以及同一个包内被访问。\n- 默认（无修饰符）：成员可以在同一个包内被访问。\n\
    \n默认情况下，字段应该声明为 `private`，并通过方法（`getters` 和 `setters`）提供对它们的访问，以维护封装性并确保数据完整性。\n\
    \n示例：\n\n```java\npublic class Car {\n    // Private fields\n    private String\
    \ brand;\n    private String color;\n    private int year;\n\n    // Getters and\
    \ setters\n    public String getBrand() {\n        return brand;\n    }\n\n  \
    \  public void setBrand(String brand) {\n        this.brand = brand;\n    }\n\n\
    \    public String getColor() {\n        return color;\n    }\n\n    public void\
    \ setColor(String color) {\n        this.color = color;\n    }\n\n    public int\
    \ getYear() {\n        return year;\n    }\n\n    public void setYear(int year)\
    \ {\n        this.year = year;\n    }\n\n    // Methods\n    public void startEngine()\
    \ {\n        System.out.println(\"Engine started!\");\n    }\n\n    public void\
    \ drive(int distance) {\n        System.out.println(\"Driving \" + distance +\
    \ \" kilometers.\");\n    }\n}\n```\n\n在上面的示例中，我们修改了 `Car` 类，通过将字段设置为 `private`\
    \ 来封装它们。我们提供了 `public` 的 `getter` 和 `setter` 方法来访问和修改这些 `private` 字段。这样，我们可以在维护数据完整性的同时控制对\
    \ `Car` 对象内部的访问。\n\n# 6.5 构造函数\n\n构造函数是一种特殊的方法，用于初始化类的对象。它在使用 `new` 关键字创建对象时被调用。构造函数的名称与类名相同，且没有返回类型。\n\
    \n示例：\n\n```java\npublic class Car {\n    private String brand;\n    private String\
    \ color;\n    private int year;\n\n    // Default constructor\n    public Car()\
    \ {\n        brand = \"Unknown\";\n        color = \"Unknown\";\n        year\
    \ = 0;\n    }\n\n    // Parameterized constructor\n    public Car(String brand,\
    \ String color, int year) {\n        this.brand = brand;\n        this.color =\
    \ color;\n        this.year = year;\n    }\n    // ...\n}\n```\n\n在上面的示例中，我们为\
    \ `Car` 类添加了两个构造函数。默认构造函数将字段的初始值设置为默认值。参数化构造函数接受参数用特定值初始化字段。\n\n# 6.6 继承\n\n继承是面向对象编程（OOP）中的机制，允许类（子类）继承另一个类（父类）的属性和行为。子类\
    \ `extends` 父类，继承它的字段、方法和构造函数。它促进了代码复用，并支持类之间层级关系的概念。\n\n要创建一个子类，我们使用 `extends`\
    \ 关键字：\n\n```java\npublic class SubclassName extends SuperclassName {\n    //\
    \ Subclass members\n}\n```\n\n示例：\n\n```java\npublic class SportsCar extends Car\
    \ {\n    // Additional members and methods specific to SportsCar\n    // ...\n\
    }\n```\n\n在上面的示例中，我们定义了一个 `extends` `Car` 类的 `SportsCar` 类。`SportsCar` 类继承了 `Car`类的字段和方法，还可以定义特定跑车的额外成员和方法。\n\
    \n# 6.7 多态\n\n多态是 OOP 中的另一个重要概念，允许不同类的对象被视为共同父类的对象。它允许在子类中重写方法，在保留共同接口的同时提供不同的实现。\n\
    \n示例：\n\n```java\npublic class Car {\n    // ...\n    public void drive() {\n\
    \        System.out.println(\"Driving a car.\");\n    }\n}\n\npublic class SportsCar\
    \ extends Car {\n    // ...\n    @Override\n    public void drive() {\n      \
    \  System.out.println(\"Driving a sports car at high speed!\");\n    }\n}\n\n\
    public class SedanCar extends Car {\n    // ...\n    @Override\n    public void\
    \ drive() {\n        System.out.println(\"Driving a sedan car smoothly.\");\n\
    \    }\n}\n```\n\n在上面的示例中，`SportsCar` 和 `SedanCar` 类都 `extends` `Car` 类，并用它们特定的实现重写了\
    \ `drive()` 方法。当我们调用这些类对象的 `drive()` 方法时，将根据实际对象类型执行相应的实现。\n\n```java\nCar car1\
    \ = new Car();\ncar1.drive();              // 输出: \"Driving a car.\"\n\nCar car2\
    \ = new SportsCar();\ncar2.drive();              // 输出: \"Driving a sports car\
    \ at high speed!\"\n\nCar car3 = new SedanCar();\ncar3.drive();              //\
    \ 输出: \"Driving a sedan car smoothly.\"\n```\n\n在上面的示例中，`drive()` 方法根据实际对象类型表现得不同，展示了多态性。\n\
    \n# 6.8 抽象\n\n抽象是一个通过只表示基本细节并隐藏不必要的复杂性来简化复杂系统的过程。在 Java 中，抽象通过抽象类和接口实现。\n\n抽象类是一种无法实例化的类，旨在供子类扩展。它可以拥有抽象方法（没有实现的方法）和具体方法（具有实现体的方法）。\n\
    \n示例：\n\n```java\npublic abstract class Vehicle {\n    // Abstract method\n  \
    \  public abstract void start();\n    // Concrete method\n    public void stop()\
    \ {\n        System.out.println(\"Vehicle stopped.\");\n    }\n}\n```\n\n在上面的示例中，`Vehicle`\
    \ 类被声明为抽象类，并包含一个必须由子类实现的抽象方法 `start()`。它还有一个具体方法 `stop()`。\n\n另一方面，接口定义了实现类必须遵守的方法合约。接口可以有常量字段和抽象方法，但不能有实例字段或具体方法。\n\
    \n示例：\n\n```java\npublic interface Driveable {\n    // Constant field\n    public\
    \ static final int MAX_SPEED = 100;\n    // Abstract method\n    public void drive();\n\
    }\n```\n\n在上面的示例中，`Driveable` 接口定义了一个常量字段 `MAX_SPEED` 和一个抽象方法 `drive()`。\n\n类可以实现多个接口，但只能扩展一个类。通过使用抽象，我们可以定义共同行为并强制一致的结构。\n\
    \n 6.9 总结\n\n在本章中，我们探索了面向对象编程（OOP）的概念。我们学习了类和对象、封装、访问修饰符、构造函数、继承、多态和抽象。OOP 允许我们通过将现实实体建模为具有属性和行为的对象来创建模块化、可复用且易于维护的代码。\n\
    \n通过使用 OOP 原则，我们可以设计出更容易理解、扩展和维护的程序。类和对象提供了组织和构建代码的方法，而封装和访问修饰符确保了数据保护和控制。继承和多态促进了代码复用并提供了灵活性，抽象有助于简化复杂系统。\n\
    \n在下一章中，我们将探索 Java 的高级主题，包括异常处理、文件 IO 和泛型。这些概念将进一步加强你对 Java 编程语言的理解并扩展你的编程能力。\n\
    \n# 7. 异常处理与文件 IO\n\n在之前的章节中，我们涵盖了 Java 编程的基础，包括变量、控制流、方法、数组、面向对象编程（OOP）等。现在，在第\
