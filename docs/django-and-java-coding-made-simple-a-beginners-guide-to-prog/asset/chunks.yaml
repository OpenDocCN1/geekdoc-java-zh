    return render(request, ''registration.html'', {''form'': form})


    def registration_success(request):


    return render(request, ''registration_success.html'')


    ```


    In this view, we check the request method. If it''s a POST request, we instantiate
    the `RegistrationForm` with the submitted data and check if it''s valid using
