    }\n```\n\n示例：\n\n```java\nint dayOfWeek = 3;\nswitch (dayOfWeek) {\n    case 1:\n\
    \        System.out.println(\"Today is Monday.\");\n        break;\n    case 2:\n\
    \        System.out.println(\"Today is Tuesday.\");\n        break;\n    case\
    \ 3:\n        System.out.println(\"Today is Wednesday.\");\n        break;\n \
    \   default:\n        System.out.println(\"Invalid day of the week.\");\n}\n```\n\
    \n在上面的示例中，如果 `dayOfWeek` 的值为 3，将显示“Today is Wednesday.”。如果没有匹配的 case，将执行 `default`\
    \ 情况并显示“Invalid day of the week.”。\n\n# 3.3 循环语句：for, while, do-while\n\n循环语句允许我们多次执行某个代码块。Java\
    \ 提供了三种循环语句：`for`、`while` 和 `do-while`。\n\n# 3.3.1 for 循环\n\n`for` 循环用于预先知道迭代次数。它由三部分组成：初始化、条件和递增/递减。\n\
    \n`for` 循环的语法如下：\n\n```java\nfor (initialization; condition; increment/decrement)\
    \ {\n    // 需要重复的代码\n}\n```\n\n示例：\n\n```java\nfor (int i = 1; i <= 5; i++) {\n\
    \    System.out.println(\"Count: \" + i);\n}\n```\n\n在上面的示例中，循环将执行五次，打印从 1 到 5\
    \ 的计数。\n\n"
