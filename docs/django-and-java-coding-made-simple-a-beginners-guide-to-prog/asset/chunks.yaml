    \ 块的内置异常处理机制。\n\n## 7.2 try-catch-finally 块\n\n`try-catch-finally` 块用于处理 Java\
    \ 中的异常。`try` 块包含可能抛出异常的代码。`catch` 块用于捕获并处理异常，提供备选方案。`finally` 块是可选的，用于执行无论是否发生异常都应该运行的代码。\n\
    \n语法：\n\n```java\ntry {\n    // 可能抛出异常的代码\n} catch (ExceptionType1 exception1)\
    \ {\n    // 对 ExceptionType1 的异常处理\n} catch (ExceptionType2 exception2) {\n  \
    \  // 对 ExceptionType2 的异常处理\n} finally {\n    // 始终运行的代码\n}\n```\n\n示例：\n\n```java\n\
    try {\n    // 可能抛出异常的代码\n    int result = divide(10, 0); // 除以零错误示例\n} catch (ArithmeticException\
    \ ex) {\n    // 对 ArithmeticException 的异常处理\n    System.out.println(\"An arithmetic\
    \ exception occurred: \" + ex.getMessage());\n} finally {\n    // 始终运行的代码\n  \
    \  System.out.println(\"Inside the finally block.\");\n}\n```\n\n在上面的示例中，`try`\
    \ 块尝试将 `10` 除以 `0`，这将抛出一个 `ArithmeticException`。`catch` 块捕获该异常并通过打印错误消息来处理它。`finally`\
    \ 块无论是否发生异常都会执行。\n\n## 7.3 检查异常与未检查异常\n\n在 Java 中，异常分为两类：检查异常（checked exceptions）和未检查异常（unchecked\
    \ exceptions）。\n\n检查异常是必须在方法签名中使用 `throws` 关键字声明，或使用 `try-catch` 块处理的异常。检查异常的示例包括\
