    {% csrf_token %}


    {{ form.as_p }}


    <button type="submit">Register</button>


    </form>


    ```


    In this template, we use the `form` variable to render the form fields. The `{{
    form.as_p }}` template tag renders the form fields as paragraphs, making it easy
    to display the fields vertically.


    Note the `{% csrf_token %}` template tag, which adds a Cross-Site Request Forgery
    (CSRF) token to the form for security purposes.


