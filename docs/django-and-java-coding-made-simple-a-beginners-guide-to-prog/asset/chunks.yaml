    \n### 1.4.1 注释\n\n注释用于在代码中添加解释性说明，编译器不会执行这些内容。它们有助于其他程序员更好地理解你的代码，并作为你自己的提醒。在\
    \ Java 中，注释分为两种类型：\n\n- 单行注释：用双斜杠（`//`）表示。`//` 后同一行内的内容被视为注释。\n\n```\n// 这是一个单行注释\n\
