    # ARE THERE NATURALLY OCCURING INEQUALITIES?

    ## THE LONG MARCH TOWARD EQUALITY


    Inegalitarian systems—that is, their evolution over time—are extraordinarily diverse.
    We can make sense of the phenomenon only if we take into account the central role
    of history.


    Sweden, considered one of the most egalitarian countries, provides an instructive
    example. Some have attributed its egalitarianism to the country’s ingrained characteristics,
    in fact, Sweden was one of the most stratified countries in Europe. This situation
    changed rapidly in the second third of the twentieth century, in response to a
    concerted social and political effort, after the Social Democratic Party came
    to power in 1930s. This party, which governed continuously for the next half century,
    put Sweden in place.


    But looking beyond this great diversity of egalitarian systems, we can recognize
    a basic movement over the past centuries: a tendency toward greater equality.
    This trend started at a particular point in history and not, for instance, Neolithic
    times or in the Middle Ages. It is part of the historical development that had
    its origins in 1789—call it part of the eighteenth century—and it has led toward
    increasing political and socioeconomic equality.


    Limited in extent, this gradual movement toward equality has been a halting, chaotic
    process in which social conflict has played an extremely important role. And it
    has called for various forms of collective learning. In my book Capital and Ideology
    (2019; English translation 2020), I laid out the theme of collective learning
    specifically around the question of borders: What are the outlines of the community
    one belongs to? How are political power and the political system organized within
    this community? The same goes for property: What are the limited collective rules
    that define the limits and extent of property rights? What do you have the right
    to own? What does it mean to be an owner?


    These two central questions—borders and property—are sources of conflict and directional
    change, with each country trying to learn from its own trajectory and all too
    often forfeiting the trajectories of other countries. Each country follows its
    apprenticeship trajectory, which in the long term tends toward greater equality,
    if the motion is hesitant and punctuated by retrograde phases.


    Finally, overarching the diversity of egalitarian systems and the limited trend
    toward equality, there exists another type of relationship between nature, culture,
    and inequality that I''d like to examine here and that I''ll address in the last
    part of this text: global warming, CO₂ emissions, and the destruction of nature
