    Our metric for income inequality gives even starker results when we look at the
    lower end of the economic spectrum: What share of the total national income goes
    to the poorest 50 percent (fig. 2)? Again, you have to keep proportionality in
    mind. In a perfectly egalitarian society, the poorest 50 percent would receive
    50 percent of total income. Conversely, in a totally inequitarian society, they
    would receive nothing at all. In fact, the number stands at 5 or 6 percent of
    total income in the most inequitarian countries (South Africa, for instance),
    and 20 or 25 percent in the most egalitarian (again, Northern Europe). Nowhere
    does it reach 50 percent. When we say that this portion of the population receives
    25 percent of total income, it means that the average income of the poorest 50
    percent is approximately half the national average. This certainly reflects a
    fair degree of inequality, but less than where the bottom 50 percent are getting
    5 percent of total income, meaning that the average income of the poorest group
    is a tenth of the average national income.


    It’s important to keep in mind the great diversity of situations. If we take stock
    only of a country’s gross national product (GNP) or its average national income,
    we may completely overlook very real factors that affect the living conditions
    of sizable groups within that society, since in two countries with the same average
    income, the share distributed among the poorest 50 percent may vary by a factor
    of one to five according to the income distribution model (it’s roughly 5 percent
    of total income in South Africa and roughly 25 percent in Sweden). Consequently,
    when we look at how poverty develops, we miss a great deal if we only look at
    average income as a whole.


    It would be impossible to account for this variation in inequality on the basis
    of “natural” factors. The disparities cannot be attributed to differences in personal
    talent, native endowment, or natural temperament—and it would be very surprising
    for these talents to be distributed so unevenly between countries. Natural resources—there
    is oil in the Middle East and oil in Norway, yet their income distribution is
    entirely different. All the evidence suggests that it’s the institutions chosen
    by these different societies, which are themselves the product of different social,
    cultural, political, and ideological histories, that lead to the wide disparity
    in levels of inequality.


    # INEQUALITY OF WEALTH


    What we''ve observed for the distribution of income also applies to the distribution
    of wealth, with one important difference: wealth—meaning property, real estate,
    and business or financial assets—is always much more concentrated in a small segment
    of the population revenue. In the case of revenue, the share going to the richest
    10 percent varies from 25 to 70 percent, depending on whether we''re looking at
    Sweden or South Africa. In the case of wealth, the share of the richest 10 percent
    is between 60 and 90 percent no matter where we look. At the other end of the
    spectrum, the poorest 50 percent, who received from 5 to 25 percent of income,
    do not own more than 5 percent of total wealth in any country on earth (fig. 3).


    ![](img/2eee13f5b3a02cc0e902e1a717403242_17_0.png)


    FIG. 3 The extreme concentration of capital—global wealth inequality by region,
    2021


    In Latin America, the richest 10 percent own 77 percent of household wealth, while
    the poorest 50 percent own just 1 percent. Household wealth equals the sum of
    all financial assets (e.g., stocks and bonds) and nonfinancial assets (e.g., housing
    stock and land) owned by individuals, minus any debts. See: wir2022.wid.world/methodology.


    Basically, the poorest 50 percent never owned anything, or just about. In Europe,
    and specifically in France, they own only 4 percent of total wealth.


    That is certainly better than in Latin America, where the figure is only 2 percent,
    but it is still a very low number considering that it is divided between half
    the population.


    It’s important to keep these figures in mind. When drawing up a global picture
    of inequality, we Europeans tend to rhapsize (the French particularly) over how
    egalitarian our countries are. These figures help us keep things in perspective.
    Yes, there has historically been a stronger movement toward equality in France
    and Europe than in other parts of the world, but first, first, it didn’t happen
    by itself—the movement was the result of hard-fought social and political battles;
    and, second, it mainly affects the distribution of income, which has certainly
    been equalized somewhat in the past century. When it comes to the distribution
    of wealth, however, things have changed very little. In France a century ago,
    the share owned by the poorest 50 percent was 2 percent, the same as in Latin
    America today. It has risen to 4 percent today, which is certainly an improvement,
    but a trivial one that doesn’t change the basic reality: property as a whole (financial,
    business, and real estate) is concentrated among an extreme few. If we look only
    at business capital, at the means of production, the picture is even more extreme.
    The share of the top 10 percent stands at 80 to 90 percent or more, and the share
    of the bottom 50 percent at practically zero. The welfare state itself has always
    been marked by an extreme concentration of economic power. The “great redistribution”
    of property that occurred largely between 1914 and 1980 has had a significant
    impact on reducing the disparity between the richest 10 percent and the next 40
    percent.


    # GENDER INEQUALITY


    In developing our methods and sources at the World Inequality Database, we generally
    aim as much as possible compiling data that is comparable across parts of the
    world. We first looked at income inequality, then wealth inequality; we subsequently
    developed a fairly simple metric for gender inequality: women’s share of income
    from work (salaries and income from unsaried activity). If there were perfect
    equality, that number should be 50 percent. In actual fact, if you look at time
    spent working, which includes household work, women always account for more than
    50 percent. Ideally, their share of total income should be more than 50 percent.
    What we see in practice, however, is that their share falls below that number
    (fig. 4). And while there has been some progress (in Europe, for example, women’s
    share of income has increased from 30 to 36 percent in the past decades, still
    leaving 64 percent for men), there are countries moving in the opposite direction:
    China, whose communist legacy originally left women a slightly higher share of
    income than other countries, has been trending lower in recent decades, largely
    because of the huge increase in very high earnings, which mostly go to men, in
    China as elsewhere.


    ![](img/2eee13f5b3a02cc0e902e1a717403242_20_0.png)


    Fig. 4 Share of income from work received by women in different regions of the
    world, 1990–2020


    From 1990 to 2020, the share of income from work that went to women in North America
    rose from 34 percent to 38 percent. See: wir2022.wid.world/methodology; and Theresa
    Neef and Anne-Sophie Robillard, "Half the Sky? The Female Labor Share in a Global
    Perspective," World Inequality Lab—Working Paper No. 2021/22, December 2021.


    The metric we use have the advantage of giving a more accurate picture of the
    vast disparity between men and women than some others, which tend to sugar reality:
    too often, we look simply at the salary gap for a given position, when the problem
    is that men and women actually don’t have access to the same positions. What we
    measure here is women’s share of total income. Obviously, this brings together
    many different factors: the pay disparity for any given position, which is on
    the order of 10 to 20 percent, but also the disparity between the kinds of jobs
    men and women can attain, the amount of part-time work they receive, the dearth
    of women in better-paying jobs, the low rate of promotions for women, et catera.

