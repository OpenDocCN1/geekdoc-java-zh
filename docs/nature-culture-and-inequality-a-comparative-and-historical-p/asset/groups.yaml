    America, with Europe next highest, followed by China.


    The responsibility for carbon emissions is thus distributed across the globe very
    asymmetrically. It''s entirely imaginable that when the devastation from climate
    catastrophes becomes even greater than it is today, some countries will demand
    reparations from others and possibly revisit their trade arrangements with them.
    I don''t know what degree of'
