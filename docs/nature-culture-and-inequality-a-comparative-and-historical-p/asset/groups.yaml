    A system of progressive taxation was instituted in late 1792 and early 1793 to
    pay for the wars, but the experiment lasted fairly soon, and the tax regime adopted
    at the end of the French Revolution was an absolutely proportional, or fixed-rate,
    system of taxation. Similarly, inheritances were taxed in a strictly proportional
    way: all during the nineteenth century, property transfers from parent to child
    were taxed at 0.5 percent, whether the value was one thousand francs or one million.
    There was no attempt at redistribution.


    In 1901, the inheritance tax became progressive, with a tax of 2.5 percent for
    the top bracket. The rate would subsequently increase to 5 or 6 percent, specifically
    to fund the retirement law of 1910. Still, no dramatic shift toward progressive
    taxation largely occurred during World I (fig. 12 and 13). The highest income
