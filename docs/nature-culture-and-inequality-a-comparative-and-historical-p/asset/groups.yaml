    公共支出和税收占国民收入的比例必须绝对保持稳定。鉴于医疗保健和退休福利的份额一直在增加——尽管还不足以跟上公众的需求，但确实在增长——其他支出就必须削减，这从长远来看正是教育领域所发生的情况。扩大福利国家的规模可以解决这些矛盾，但这需要在国家和国际层面的税收正义和累进税制方面实现新的里程碑。


    尽管在公共教育投资的分配向更加公平的方向上确实取得了进展，但我们不应描绘一幅理想化的图景。让我们看看法国教育投资的不平等状况（图10）。这些数据适用于今天完成学业的这一代人，即在2020年满二十岁的青少年。在图中，所有出生于2000年的人都根据他们从幼儿园到高级学位所接受的教育总支出进行了排名。简而言之，那些获得最多公共教育资金的人（在整个教育生涯中每人约25万至30万欧元）是那些就读长期且资金充足的课程的人——通常是为学生进入竞争性高等院校做准备的课程，这些院校在法国被称为*grandes
    écoles*，以及*grandes écoles*本身。图中处于最低水平的是那些在十六岁或十七岁时辍学的青少年：他们只接受小学和中学教育的资助。而处于中间的是那些在大学就读了资金不足的课程的学生，例如人文科学学位。


