    That is certainly better than in Latin America, where the figure is only 2 percent,
    but it is still a very low number considering that it is divided between half
    the population.


    It’s important to keep these figures in mind. When drawing up a global picture
    of inequality, we Europeans tend to rhapsize (the French particularly) over how
    egalitarian our countries are. These figures help us keep things in perspective.
    Yes, there has historically been a stronger movement toward equality in France
    and Europe than in other parts of the world, but first, first, it didn’t happen
    by itself—the movement was the result of hard-fought social and political battles;
    and, second, it mainly affects the distribution of income, which has certainly
    been equalized somewhat in the past century. When it comes to the distribution
    of wealth, however, things have changed very little. In France a century ago,
    the share owned by the poorest 50 percent was 2 percent, the same as in Latin
    America today. It has risen to 4 percent today, which is certainly an improvement,
    but a trivial one that doesn’t change the basic reality: property as a whole (financial,
    business, and real estate) is concentrated among an extreme few. If we look only
    at business capital, at the means of production, the picture is even more extreme.
    The share of the top 10 percent stands at 80 to 90 percent or more, and the share
    of the bottom 50 percent at practically zero. The welfare state itself has always
    been marked by an extreme concentration of economic power. The “great redistribution”
    of property that occurred largely between 1914 and 1980 has had a significant
    impact on reducing the disparity between the richest 10 percent and the next 40
    percent, but it has had practically no effect on the bottom 50 percent.'
