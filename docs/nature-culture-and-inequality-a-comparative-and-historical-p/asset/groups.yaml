    在未来几十年中占据中心地位。它可能导致比我们最近看到的对平等的更大需求：如果不大幅减少不平等，如果不建立一套与当前资本主义体系根本不同的新经济体系，全球变暖危机将无法解决，人类与自然之间也不可能实现和解。在描述这一体系时，我指的是“一种参与式的、民主的、生态社会主义”，但显然也可以制定其他术语——而且无疑会这么做。无论如何，我认为重新开启改变经济体系和重新构想其长期发展的讨论是迫不缓的。


    ## 不平等的演变与反平等主义体系


    **我打算在此处展示的要素，部分源自我 2021 年在法国首次出版的著作《平等简史》（*A Brief History of Equality*），另一部分源自世界不平等数据库（该数据库发布了《2022
    年世界不平等报告》）。这个关于全球不平等的数据库是人类集体努力的成果，借鉴了百多名国际研究人员的工作。在它的支持下，收集了历史数据，使我们能够追踪长期以来收入和财富分配的变化——有时甚至跨越三个世纪。


    社会和经济不平等领域本身有着悠久的历史，我只是遵循了前人的努力。我的先辈包括费尔南·布罗德尔（Fernand Braudel）、埃内斯特·拉布鲁（Ernest
    Labrousse）、阿德琳·道马尔（Adeline Daumard）、弗朗索瓦·西芒（François Simiand）、克里斯蒂安·鲍德洛（Christian
    Baudelot）、吉尔·波斯泰尔维内（Gilles Postel-Vinay）等许多人。法国有一条优秀的传统，从 20 世纪初开始，历史学家、社会学家和经济学家致力于收集工资、收入、利润、土地和继承的数据。我很幸运在这个时代，数据的数字化使得获取知识变得容易得多。事实上，当重读拉布鲁或道马尔的作品时，令人惊讶的是，数据收集工作是手工完成的，往往是以牺牲其他事务为代价的。继承数据必须从巴黎及各省的档案中筛选，那里被存储在卡片上。这涉及大量工作，但留下的几乎没有可供后世研究人员使用的成果。所得的研究被标记为“序列”历史，几乎消失在视野中，部分原因是数据收集本身的组织和描述占据了研究人员的大部分精力；今天，显然，数据收集的任务简单得多，而且是在规模巨大的、直接累积的背景下进行的。


    此外，将 20 世纪明确纳入研究的长跨度中（第一波序列历史学家并未这样做，他们主要处理 18 和 19 世纪），这必然将历史，尤其是政治置于分析的核心。当你考虑
    18 世纪甚至 19 世纪时，你很容易被引导——这是错误的——相信存在独立于政治发展的命运性趋势。但对于 20 世纪，当你画出一条显示工资、收入和财富的曲线时，这些联系会立刻显现出来：第一次世界大战、第二次世界大战、法国解放、
    1968 年 5 月事件等。我们必须立即考虑政治历史，以解释你看到的转折点。我想立即强调的是，我谈论的是政治历史的建设性和集体性方面。与某些人的声称相反，平等并非战争本身的产物，也不是黑死病等灾难性事件的产物。在法国革命的情况下，战争甚至往往会抑制革命的发展。而一战和二战对许多国家平等的影响相对较小：这取决于之后实施的社会结构和结果。政治动员和工会压力在带来转变方面更为重要，例如在瑞典，两次世界大战的影响相对较小。在美国，导致建立福利政策的很大程度上是
    20 世纪 30 年代的经济危机而非第一次世界大战。变革的真正力量正如我们将看到的，源于协调的社会和政治压力，以及建立新制度结果的能力。


    我有幸运在开始工作时，数据的数字化使得获取知识变得容易得多，正如我提到的，这使我扩大了比较关注范围，并观察到不平等体系的巨大多样性。因此，为了对范围内的不平等体系提供一个初步感觉，我将从一个非常简单的标准开始：收入。之后，我将转向财富的分配。让我们快速定义这两个术语：收入是在一年内获得的，无论是通过工作报酬还是财富（利息、股息等）；财富是一个拥（住房、资产等），而且它的分布总是比收入更不平等。资本的拥有也决定了权力关系：对于拥有资产和生产资料显然如此，对于通过公共债务拥有的国家权力，以及私人和家庭生活的框架也是如此。


    ## 收入不平等


    那么，让我们从收入开始。我们使用一个相当简单的指标：前 10% 收入者占总收入的份额。根据定义，在一个完全平等的社会中，这一份额应该是总收入的 10%，因为这些人占人口的
    10%。在一个完全不平等的社会中，他们将获得所有收入，即 100%。当然，实际情况处于这两个极端之间。如图 1 所示，前 10% 收入者的份额在北欧最低（20-30%），在南非最高，达到
    70%。这应该让你对全球不平等的巨大差异性有一个初步了解。


    如果你尝试从高处俯瞰，判断哪些是世界上最平等和最不平等的部分，你首先注意到的是巨大的差异，有时甚至在一个区域内也是如此：例如，拉丁美洲，阿根廷比巴西或智利更平等，这与该国的社会政治历史以及胡安·佩隆为建立福利国家奠定的基础有关，这在那里比任何邻国实现得更充分。但某些地区表现出更高的整体不平等程度：南非及其种族隔离制度的遗产，以及整个南部非洲；拉丁美洲整体在财产不平等上程度较高，这与西班牙殖民扩张和随后的政权有关；而北美则带有特定种族不平等的痕迹。总的来说，殖民遗产对不平等结构留下了深刻而持久的印记。但也有一些地区，例如中东，那里剧烈的差异并非源于过去的种族或殖民不平等，而是源于一个现代事实，即石油收入，这些收入集中在极少数人手中。

