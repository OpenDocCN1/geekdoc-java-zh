    # INEQUALITY OF WEALTH


    What we''ve observed for the distribution of income also applies to the distribution
    of wealth, with one important difference: wealth—meaning property, real estate,
    and business or financial assets—is always much more concentrated in a small segment
    of the population revenue. In the case of revenue, the share going to the richest
    10 percent varies from 25 to 70 percent, depending on whether we''re looking at
    Sweden or South Africa. In the case of wealth, the share of the richest 10 percent
    is between 60 and 90 percent no matter where we look. At the other end of the
    spectrum, the poorest 50 percent, who received from 5 to 25 percent of income,
    do not own more than 5 percent of total wealth in any country on earth (fig. 3).


    ![](img/2eee13f5b3a02cc0e902e1a717403242_17_0.png)


    FIG. 3 The extreme concentration of capital—global wealth inequality by region,
    2021


    In Latin America, the richest 10 percent own 77 percent of household wealth, while
    the poorest 50 percent own just 1 percent. Household wealth equals the sum of
    all financial assets (e.g., stocks and bonds) and nonfinancial assets (e.g., housing
    stock and land) owned by individuals, minus any debts. See: wir2022.wid.world/methodology.


    Basically, the poorest 50 percent never owned anything, or just about. In Europe,
    and specifically in France, they own only 4 percent of total wealth.'
