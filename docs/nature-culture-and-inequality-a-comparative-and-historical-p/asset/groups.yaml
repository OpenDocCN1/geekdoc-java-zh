    catastrophe it will take to bring us to that point, the truth is that the current
    situation is highly asymmetrical.


    The second aspect concerns the disparities within given countries. This graph
    (fig. 18), drawn from the World Inequality Report 2022, shows carbon emission
    levels in tons per person, divided into the same groups used before graphing income
    and wealth, that is, comparing the bottom 50 percent (those who emit the least
