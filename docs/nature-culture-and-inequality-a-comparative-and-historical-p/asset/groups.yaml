    # ARE THERE NATURALLY OCCURING INEQUALITIES?

    THE LONG MARCH TOWARD EQUALITY


    Inegalitarian systems—that is, the structure and degree of socioeconomic inequality
    in different societies, and their evolution over time—are extraordinarily diverse.
    We can make sense of the phenomenon only if we take into account the central role
    of history and human culture. Inequality has, in fact, followed markedly different
    trajectories—political, socioeconomic, cultural, civilational, and religious.
    It is culture in the broadest sense—more particularly, collective political mobilization—that
    provides an explanation for the diversity, degree, and structure of the social
    inequalities we observe. In contrast, the importance of called natural factors
    (personal talents, reserves of natural resources, and other factors of this kind)
    is relatively limited.


    Sweden, considered one of the most egalitarian countries in the world, provides
    an instructive example here. Some have attributed its egalitarianism to the country’s
    ingrained characteristics, to a culture that has a “natural taste” for equality.
    In fact, Sweden was one of the most stratified countries in Europe, highly sophisticated
    in the political organization of its inequality. This situation changed rapidly
    in the second third of the twentieth century, in response to a concerted social
    and political effort, after the Social Democratic Party came to power in the 1930s.
    This party, which governed continuously for the next half century, put Sweden’s
    governmental capacities toward an entirely different political program than had
    existed before.


    Sweden provides an interesting case, one that should inoculate against any belief
    in long-term determinism, according to which certain natural or even cultural
    factors might make some societies forever egalitarian while making others (India,
    for example) forever in. Social and political forms can change, sometimes much
    more quickly than contemporary observers think. Those who benefit most from a
    system tend, for obvious reasons, to see inequalities as part of the natural order,
    and'
