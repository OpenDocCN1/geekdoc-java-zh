    考虑到个人观点和活动选择的差异，这种不平等是合理的，那么社会和经济组织需要什么程度的激励措施呢？从一到三、或从一到五的收入比例可能与这些目标相兼容。但正如任何历史实验所所示，一比五十的比例显然是毫无正当性的。


    我提到的这几个数量级在我看来代表了可以接受的不平等程度，但这显然是一个应该由民主程序和公共审议来决的问题。然而，这需要对政治局面具有平等的影响力，而我们离此还有很远的距离。


    ## 累进税制


    **我想**在结束时详细阐述一下与不平等相关的另外两点：一方面是累进税的问题，另一方面是对自然界的破坏。


    累进税的整个问题极其重要。首先，它是一个讨论了很久的话题。下表说明了 18 世纪法国讨论的两种理念的例子：一个源自约瑟夫·路易·格拉斯林（Joseph-Louis
    Graslin），一位来自南特的城市规划师和匿名经济学家；另一个则源自西拉科斯特先生（Sieur Lacoste），一位更具匿名的公民。他们都发表了小册，其中大部分关于征收所得税，格拉斯林建议征收遗产累进税，而拉科斯特建议征收遗产累进税，并称之为“国民继承权”。这些模型在当时并未被采用，但与许多国家在
    20 世纪建立的制度有很多共同点。从概念上说，这似乎很简单：对于低于平均水平的收入和财产，税率从 5% 或 6% 开始，但一旦达到平均水平 100 到 1000
    倍的收入和财产，税率就会上升到 60%、70% 或 80%。


    表 1 18 世纪法国的累进税建议


    | 格拉斯林*: | 拉科斯特**: |

    | --- | --- |

    | 所得累进税 | 遗产累进税 |

    | 平均收入有效税率的倍数 | 平均财产税率倍数 |

    | 0.5 5 % | 0.3 6 % |

    | 20 15 % | 8 14 % |

    | 200 50 % | 500 40 % |

    | 1 300 75 % | 1 500 67 % |


    * *Essai analytique sur la richesse et l''impôt*, 1767. **Du droit national d''hérédité*,
    1792.


    在格拉斯林于 1767 年提出的累进所得税计划中，有效税率从年收入 150 图尔瓦图尼（livres tournois，约当时成年人平均收入的一半）的 5%
    逐渐上升到收入 400,000 图尔瓦图尼（约平均收入的 1,300 倍）的 75%。拉科斯特在 1792 年也提了一个类似的累进遗产税税率表。参见：piketty.pse.ens/fr/egalite


    1792 年底和 1793 年初建立了累进税制以支付战争费用，但这项实验很快就结束了，法国大革命末期采用的税收制度是绝对比例的（或称固定税率）税收制度。同样，遗产税也是严格按比例征收的：在整个
    19 世纪，从父母到子女的财产转移税率均为 0.5%，无论价值是一千法郎还是一百万法郎。当时并没有尝试进行再分配。


    1901 年，遗产税变为累进制，最高档档的税率为 2.5%。此后，该税率会增加到 5% 或 6%，专门用于资助 1910 年的退休法。尽管如此，第一次世界大战期间并没有发生向累进税制的剧烈转变（图
    12 和 13）。法国最高的所得税税率（适用于最高收入者）在 1914 年之前为 0%，因为法国在整个战争期间没有所得税。第二次世界大战期间，情况变化非常快，特别是
    20 世纪 10 年代代的美国。这一过程非常复杂，因为需要通过宪法修正案，但当时美国对于公正税制存在着强大的支持浪潮。美国人决心不像旧欧洲那样变成平等主义的、寡头政治的和财阀政治的，旧欧洲被认为是极度精英主义的。相对保守的经济学家普遍持有的观点是，如果美国落入像欧洲一样精英主义的陷阱，将完全摧毁民主制度。


    ![](img/2eee13f5b3a02cc0e902e1a717403242_42_0.png)


    图 12 累进税的发明：最高税率，1900–2020


    美国最高收入的税率在 1900 年至 1932 年间平均为 23%，1932 年至 1980 年间为 81%，1980 年至 2020 年间为 39%。在相同时期，英国的最高税率分别为
    30%、89% 和 46%；日本为 26%、68% 和 53%；德国为 18%、58% 和 50%；法国为 23%、60% 和 57%。税收在 20 世纪中期最具累进性，特别是在美国和英国。参见：piketty.pse.ens/fr/egalite


    ![](img/2eee13f5b3a02cc0e902e1a717403242_43_0.png)


    图 13 累进税的发明：最高税率，1910–2020


    美国最高收入的税率在 1900 年至 1932 年间平均为 23%，1932 年至 1980 年间为 81%，1980 年至 2020 年间为 39%。在相同时期，英国的最高税率分别为
    30%、89% 和 46%；日本为 26%、68% 和 53%；德国为 18%、58% 和 50%；法国为 23%、60% 和 57%。税收在 20 世纪中期最具累进性，特别是在美国。

