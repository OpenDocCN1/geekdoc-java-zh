    首先，从根本上说，其次，庄园地产在1913年已不再具有太大意义。虽然英国的土地所有权确实更加集中，但这一点的意义次要于这样一个事实：对于当时遍布于世界各地的工业资本或金融组合而言，无论你是共和国还是君主制国家，对财富的积累和集中几乎没有本质区别。法国和英国的财富集中程度同样之高。因此，在事件发生一个世纪后，这些事实才揭示了那个时代许多政治演说的虚伪性，其中包括像保罗·勒鲁瓦-巴伊伊（Paul
    Leroy-Baillie）等当代经济学家的言论，他们曾大声主张法国是一个由小土地主组成的国家。


    事实上，这些数据在当时就已经开始投入使用了，因为在1901年一项法律出台后，遗产税变得略微具有进步性。这说明制度和财政体系的改变可以释放信息，并提供一种可以被充分利用的知识。例如，约瑟夫·卡约（Joseph
    Caillaux）能够利用遗产税统计数据来支持他的主张，宣布法国实际上并不是一个小土地主国家。这些数据也被用于在1914年建立所得税，尽管考虑到该国面临的新挑战，其效果微乎其微。法国实际上是最后一个最后一个实行所得税的西方国家。通过1914年7月15日法律的参议院和众议院多数派并非为了投资教育，而是为了资助反对德国的战争。在许多北欧国家以及日本、英国和美国已经存在累进所得税的那个时代，这是打破僵局的唯一因素。法国之所以加入这一进程进展缓慢，部分源于其基于法国革命这一事实对自身平等主义的盲目自信。


    # 瑞典的案例


    现在，我想再花一点时间研究另一个有趣的案例：瑞典，瑞典在今天通常被认为是一个极其平等的国家。然而，在20世纪初，情况并非如此。欧洲所有国家都极度不平等，瑞典在法国和英国之间的光谱中处于中间位置。但在瑞典的案例中，这种不平等具有非常特定的结构。对于法国和英国来说，它们的殖民帝国发挥了很大作用：殖民资产，即位于世界其他地区的资产；而在瑞典，这种情况显然少得多，那里与政治体系相关的其他因素才是导致高度不平等的的主要原因。


    从1865年至1910年，瑞典有一套非常复杂的系统，根据财产所有和纳税状况来筛选选民。以财产为限制的投票一直持续到第一次世界大战，而包括英国在内的其他国家在19世纪扩大了投票权。在瑞典，只有最富有的20%的男性才能投票。然而，该系统甚至更具限制性，因为这最富20%的人中的选民根据其财富程度，可能拥有从一票到一百票等的等的。你越富有，拥有的票数越多。更好的是，虽然普通选举有百张票的上限，但市政选举却没有上限！因此，瑞典有几十个城镇，一个选民的票数就超过了总票数的50%，这使其成为一个拥有完全民主合法性的独裁者。事实上，该国的总理几乎总是一个拥有其选区50%以上选票贵族。


    公司和法律实体直到第一次世界大战都有权在地方选举中投票，票数取决于它们在社区投入的资本量及其收入水平。这是当今跨国公司非常非常想要拥有的特权，有时它们会找到实现类似结果的方法，但它们并不太敢要求的这一事实标志着一种重要的变化已经发生。


    瑞典直到第一次世界大战一直保留这种政治体系，这展示了人类社会——特别是其主导群体——所运用的创造力。

