    certain goods and services out of the marketplace. The growth of certain sectors
    such as education, healthcare, pensions, housing, and infrastructure demonstrates
    that some areas of the economy can be organized to function outside of the logic
    of the market and capitalism. It may seem trivial, but a sector like healthcare
    represents 10 percent of the national income. That''s a lot more than the automobile
    industry, for example, and it''s a sector that in most countries is mainly structured
    around public spending. Outside of government, this sector brings together a large
    number of for-profit and not-profit actors, associations, et cetera. It may not
    be the most imaginable configuration, by any comparison between the United States''
    system—based largely on a for-profit structure—and the European system almost
    always shows the former to disadvantage. As we all know, the U.S. system costs
    more, and its public health results are disastrous when compared to Europe''s.


    What happens is that system of public funding and public organizations develops
    around these goods and services, managed according to criteria that aren''t profit-driven.
    Clearly, this has occurred in the education sector, for example. In Chile, however,
    Pinochet''s regime went to great lengths to establish a for-profit educational
    system, but it was a great failure. There have also been joint-stock companies,
    such as Trump University in the United States, which have worked at all. Private
    educational institutions in the United States do not generate or distribute profits.
    That doesn''t mean they''re perfect, as large donors acquire power and arrange
    for their children to gain admission, among other unfortunate developments. All
    the same, when you donate a chunk of money to Stanford or Harvard, it doesn''t
    give you a 50 percent voting share in perpetuity. The power relations are a little
    different than in a joint-stock company. And in the education and healthcare sectors,
    no wants to return to, or develop, a purely for-profit system. Why? Because as
    people have collectively realized, and as history has amply illustrated, the pursuit
    of profit can in many sectors destroy the intrinsic incentives that lead one to
    teach, provide healthcare, and perform other activities of that kind.


    This important lesson applies not only to education and healthcare but to culture
    and the media, where profit-seeking and the private ownership of stock create
    many problems. That''s why many structures for nonprofits (trusts and foundations,
    for instance) have been developed over time—the British newspaper *The Guardian*
    and the French daily France-Ouest, for instance, are both nonprofits. None of
    these experiments has been perfect, but people started thinking about structures
    of this kind a long time ago in such diverse fields as transportation, power distribution,
    local administration, and water management.


    In the long run, I think that this process of taking goods and services out of
    the marketplace should be pursued, that it should be extended to larger and larger
    sectors, and that it could potentially represent the near totality of a country’s
    economic activity. It would take decentralization, as well as the participation
    of organizations and communities, a reliance on public funding through progressive
    taxation of income and wealth, and a better distribution of power in corporations
    and the residual: for-profit sector, as I outlined earlier. Much still needs to
    be invented, but the important point is that it’s not simply a question of redistributing
    money. It goes well beyond that. The trend to remove whole sectors of the economy
    from the marketplace is one there''s no going back on.


    # NATURE AND INEQUALITY


    I''d like to end this text with an examination of the interplay between nature,
    culture, and inequality in the context of the destruction of nature, the capital
    tied up in nature. I''m going to discuss data relating to climate change and carbon
    emissions; but we could focus on data of equal interest relating to other aspects
    of man''s impact on nature. The important point I''d like to make is that the
    challenges posed by climate and the environment are intimately linked to inequality.


    No credible solution to the challenge of global warming is imaginable without
    a drastic reduction in inequality and without new progress toward a greater level
    of equality—first, because of the substantial disparities in carbon emissions
    between the countries of the Global North and South, and without because of the
    carbon emissions inequalities within countries.


    ![](img/2eee13f5b3a02cc0e902e1a717403242_53_0.png)


    FIG. 17 Carbon emissions worldwide, 2010–18


    From 2010 to 2018, North America''s share of total carbon emissions (direct and
    indirect) was 21 percent on average. The United States and Canada also accounted
    for 36 percent of individual emissions above the global average (which is 6.2
    tons of CO2 per year), 46 percent of emissions greater than 2.3 times the global
    average (that is, the top 10 percent of individual emissions worldwide, responsible
    for 45 percent of total emissions, as against 13 percent for the bottom 50 percent
    of emitters), and 57 percent of emissions greater than 9.1 times the average (that
    is, the top 1 percent of individual emissions worldwide, responsible for 14 percent
    of total emissions). See: piketty.pse.ens/fr/regalte


    The graph above (fig. 17), which focuses on disparities between countries, is
    based on research conducted by Lucas Chancel in our research lab on world inequality.
    The distribution of total carbon emissions, in the aggregate, is shown in purple:
    we can see that North America, Europe, and China emit carbon at roughly comparable
    levels. Their populations are very different in size and very different in their
    emission levels. I should point out that this data has been corrected for the
    emissions embedded in imports: all too often, we account only for the emissions
    generated domestically, ignoring emissions that are subcontracted for outside.
    By incorporating this factor, the graph above gives a more balanced account.


    But let''s turn our particular attention to the other colors. The green bar, for
    example, represents not the country''s share of total emissions but its share
    of very large emitters, those whose emissions are more than nine times the average.
    The global average for the seven billion humans on the planet is approximately
    six tons of carbon per year. The top 1 percent of individual emissions—that 1
    percent itself has higher emissions than the 50 percent of the population who
    produce the least. More than 55 percent of these high emissions come from North
    America, with Europe next highest, followed by China. The responsibility for carbon
    emissions is thus distributed across the globe very asymmetrically. It is entirely
    imaginable that when the devastation from climate catastrophes becomes even greater
    than it is today, some countries will demand reparations from others and possibly
    revisit their trade arrangements with them. I don''t know what degree of catastrophe
    it will take to bring us to that point, the truth is that the current situation
    is highly asymmetrical.


    The second aspect concerns the disparities within countries. This graph (fig.
    18), drawn from the World Inequality Report 2022, shows carbon emission levels
    in tons per person, divided into the same groups used before graphing income and
    wealth, that is, comparing the bottom 50 percent (those who emit the least carbon),
