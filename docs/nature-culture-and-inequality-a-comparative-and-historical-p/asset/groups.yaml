    Our metric for income inequality gives even starker results when we look at the
    lower end of the economic spectrum: What share of the total national income goes
    to the poorest 50 percent (fig. 2)? Again, you have to keep proportionality in
    mind. In a perfectly egalitarian society, the poorest 50 percent would receive
    50 percent of total income. Conversely, in a totally inequitarian society, they
    would receive nothing at all. In fact, the number stands at 5 or 6 percent of
    total income in the most inequitarian countries (South Africa, for instance),
    and 20 or 25 percent in the most egalitarian (again, Northern Europe). Nowhere
    does it reach 50 percent. When we say that this portion of the population receives
    25 percent of total income, it means that the average income of the poorest 50
    percent is approximately half the national average. This certainly reflects a
    fair degree of inequality, but less than where the bottom 50 percent are getting
    5 percent of total income, meaning that the average income of the poorest group
    is a tenth of the average national income.


    It’s important to keep in mind the great diversity of situations. If we take stock
    only of a country’s gross national product (GNP) or its average national income,
    we may completely overlook very real factors that affect the living conditions
    of sizable groups within that society, since in two countries with the same average
    income, the share distributed among the poorest 50 percent may vary by a factor
    of one to five according to the income distribution model (it’s roughly 5 percent
    of total income in South Africa and roughly 25 percent in Sweden). Consequently,
    when we look at how poverty develops, we miss a great deal if we only look at
    average income as a whole.


    It would be impossible to account for this variation in inequality on the basis
    of “natural” factors. The disparities cannot be attributed to differences in personal
    talent, native endowment, or natural temperament—and it would be very surprising
    for these talents to be distributed so unevenly between countries. Natural resources—there
    is oil in the Middle East and oil in Norway, yet their income distribution is
    entirely different. All the evidence suggests that it’s the institutions chosen
    by these different societies, which are themselves'
  - '[PAGE 16]


    the product of different social, cultural, political, and ideological histories,
    that lead to the wide disparity in levels of inequality.'
