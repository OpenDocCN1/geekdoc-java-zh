    central place in the decades ahead. It may lead to a greater demand for equality
    than we’ve recently seen: there can be no resolution to the global warming crisis,
    no possible reconciliation between man and nature, without a drastic reduction
    in inequality and without a new economic system that is radically different from
    the current capitalist one. In describing this system, I refer to “a participatory,
    democratic, and ecological socialism,” but other terms could clearly be devised—and
    no doubt will be. At all events, I consider it imperative to reopen the discussion
    on changing the economic system and reimagining its long-term development.


    ## THE EVOLUTION OF INEQUALITY AND INEGALITARIAN SYSTEMS


    **The elements I intend to present here in part from my book A Brief History of
    Equality, first published in France in 2021, and in part from the World Inequality
    Database (which issued the World Inequality Report 2022). This database on global
    inequality is the product of a collective effort and draws on the work of more
    than a hundred international researchers. Under its aegis, historical data has
    been collected that allows us to track changes in the distribution of income and
    wealth over long periods—sometimes more than three centuries.


    The field of social and economic inequality itself has a long history, and I''ve
    simply followed by earlier efforts. Among my predecessors Fernand Braudel, Ernest
    Labrousse, Adeline Daumard, François Simiand, Christian Baudelot, Gilles Postel-Vinay,
    and many others. There is a great tradition in France, starting in the early twentieth
    century, of historians, sociologists, and economists engaging in the task of collecting
    data on salaries, income, profits, plots of land, and inheritances. I had the
    good fortune to start working at a time when the digitization of this data made
    gathering knowledge much easier. In fact, what''s striking when one rereads the
    works of Labrousse or Daumard is that the labor of collecting data was done by
    hand, often at the expense of anything else. Inheritance data had to be culled
    from archives in Paris and the provinces, where it was stored on file cards. This
    involved considerable work but left little in its wake that could be used by later
    researchers. The resulting studies, labeled “serial” history, have all but disappeared
    from view, partly because the organization and description of the data collection
    itself took up a large part of the researcher’s energy; Today, obviously, the
    task of data collection is much simpler and is performed on a comparatively vast
    scale, in a directly cumulative context.


    Furthermore, the fact of explicitly integrating the twentieth century into the
    long timeframe studied (which was not the case with the first wave of serial historians,
    who mainly dealt with the eighteenth and nineteenth centuries) necessarily puts
    history, and especially politics, at the very center of the analysis. When you
    consider the eighteenth century, or even the nineteenth, you can easily be led
    to believe—wrongly, I would say—in fateful trends that operate independently of
    political developments. But with the twentieth century, the connections jump out
    at the moment you draw a curve showing salaries, income, and wealth: World War
    I, World War II, the liberation of France, the events of May 1968, et cetera.
    We immediately have to factor in political history to explain the inflection points
    you’re seeing. I want to emphasize right away that I’m talking about the constructive
    and collective aspects of political history. Contrary to what some have claimed,
    equality has not been the product of wars per se, nor of catastrophic events such
    as the Black Death. In the case of the French Revolution, war even tended to stifle
    revolutionary developments. And World Wars I and II had relatively little effect
    on equality in many countries: it all depended on the societal structures and
    outcomes that were implemented afterward. Political mobilization and union pressure
    were more important in bringing about a shift, for instance, in Sweden, where
    the two world wars had relatively little impact. In the United States, it was
    largely the economic crisis of the 1930s and not World War I that led to instituting
    social welfare policies. The real force for change derives, as we’ll see, from
    concerted social and political pressure, as well as the ability to build new institutional
    outcomes.


    I had the good fortune, as I mentioned, to start my career as a researcher in
    this intellectual context, along with an international network of researchers
    like those who have contributed to the World Inequality Database. It allowed me
    to enlarge my comparative and historical focus and to observe the great diversity
    of egalitarian systems and the halting progress toward equality that I spoke of.
    So as to give a preliminary sense of the systems of inequality around the world,
    I’ll start by presenting results relating to a very simple criterion: income distribution.
    After, I’ll go on to look at the distribution of wealth. Let’s quickly define
    the difference between these two terms: income is what is earned in the course
    of a year, either as remuneration for one’s work or from one’s wealth (in the
    form of rent, interest, dividends, et cetera); wealth is what one owns (housing,
    business assets, securities, et cetera), and it is always distributed much more
    unequally than income. The possession of capital also determines the structure
    of power relations: this is obviously true for the ownership of business assets
    and the means of production, and it is also true for the possession of housing
    and the framework for reproducing private and family life, as well as the ownership
    of the state and public power through public debt, which can take different forms.


    ## INEQUALITY OF INCOME


    Let’s start, then, with income. We use a fairly simple metric for this: the share
    of total income going to the top 10 percent of earners. By definition, in a perfectly
    egalitarian society that share would equal 10 percent of total income, since those
    earners represent 10 percent of the population. In a perfectly inequitarian society,
    they would take all the income, a share of 100 percent. What actually happens,
    of course, lies somewhere between the extremes. As shown in figure 1, the share
    going to the top 10 percent is lowest in Northern Europe (20-30 percent), and
    highest in South Africa, where that share reaches 70 percent. This should give
    you a first glimpse of the considerable variation in inequality across the globe.


    If you were to try, looking down from a great height, to decide which were the
    most egalitarian and inequitarian parts of the world, the first thing you’d notice
    is a great deal of variation, sometimes even within a single region: Latin America,
    for instance, Argentina is more egalitarian than Brazil or Chile, in keeping with
    the country’s sociopolitical history and the groundwork laid by Juan Perón to
    build a welfare state, which was realized more fully there than any of the neighboring
    countries. But some regions show a higher degree of overall inequality: South
    Africa, with its legacy of apartheid, and southern Africa generally; and Latin
    America as a whole has a high degree of inequality of property, tied to Spanish
    colonization and the political regimes that followed; North America, for its part,
    bears traces of specific racial inequalities. Generally speaking, colonial legacies
    have left a strong and lasting mark on the structures of inequality. But there
    are also areas, like the Middle East, where the sharp disparities are not due
    to a past history of racial or colonial inequality but to a modern fact, namely
    oil revenues, which have turned into financial revenues, concentrated among an
    extremely small share of the population. In the current map of inequality, we
    therefore see a mix of old and new, with different interlocking rationales.

