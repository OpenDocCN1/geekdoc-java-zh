    从财产利益的角度来看，这些 1914 年之前的殖民和外国资产在三十年后（即 1945 年）变成了公共债务。这笔债务达到了国民收入的 200% 或 300%，这意味着比今天的希腊债务还要多——这些债务属于德国、法国和英国这些大得多的经济体。这里的教训是，这些债务很快被处理掉了，而且从未被偿还。有几种方法被用来消除这些债务，包括取消和通胀。德国提供了几个最显著的例子（图
    16）。


    ![](img/2eee13f5b3a02cc0e902e1a717403242_49_0.png)


    图 16 公共债务：积累与取消的交替


    公共债务在两次大战后大幅增加，占德国国民收入的 150% 到 300%，在英国和美国则增长得较缓。在 2008 年金融危机和 2020 年疫情后，公共债务再次激增，在德国和法国达到
    300%，在美国则超过 300%，且从未开始偿还。参见：pikety.pse.ens.fr/egalite


