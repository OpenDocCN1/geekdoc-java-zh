    和 Chancel (2021)。


    因此，一项建议对全人口进行固定比例削减的减排政策不可避免会遇到困难。要说服那些每年排放四五吨碳的人，让他们与排放三十或七十吨的人以相同比例减少排放，是非常困难的。一种以相同速率增加能源成本的策略，在未来几年甚至几十年内不可避免会引发反税运动，类似于近期*黄背甲*（gilets
