    examples of two ideas discussed in France in the eighteenth century: one comes
    from Joseph-Louis Graslin, a town planner and anonymous economist from Nantes,
    while the other is from Sieur Lacoste, a more anonymous citizen. Both published
    pamphlets, of which a great number tax on income, while Graslin proposed a progressive
    tax on inheritance, while Lacoste proposed a progressive tax on inheritance calling
    it a “national right to inherit.” These models, which were not adopted at the
    time, have many points in common with the systems that a number of countries put
    in place in the twentieth century. Conceptually, it seems simple enough: the tax
    rate starts at 5 or 6 percent for incomes and estates falling below the general
    average but rises to 60, 70, or 80 percent once you reach incomes and estates
    worth 100 to 1,000 times the average.


