    fall to two or three tons. This group is therefore almost in sight of the official
    goals for 2030 or 2040. By contrast, the top 10 percent are at twenty-nine tons,
    thirty, and even thirty-five tons per person. And if we were to look only at the
    top 1 percent in Europe, we would find them emitting at rates of sixty to seventy
    tons. In the United States, the top 10 percent are already emitting at a rate
