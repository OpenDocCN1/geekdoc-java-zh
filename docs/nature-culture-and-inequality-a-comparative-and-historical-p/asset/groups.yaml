    of Deputies that passed the law of July 15, 1914, did not invest in education
    but to finance the war against Germany. It was the one factor that could break
    the logjam, at a time when a progressive income tax had existed in many Northern
    European countries, as well as in Japan, the United Kingdom, and the United States.
