    # MAKING RIGHTS MORE EQUAL


    **For my** part, I am trying to develop an approach based on an equal right of
    access to fundamental goods: education, healthcare, and participation in politics.
    I have mentioned the example of the right to vote in Sweden, but it obviously
    doesn''t end with equal suffrage: when it comes to funding for political campaigns
    and the media, we can imagine more egalitarian systems. I''m also very much thinking
    about all that pertains to economic democracy, that is, equal participation in
    the decision-making within businesses. I''ve taken an interest in the system of
    codetermination or shared management that we see in Germany and Northern Europe,
    where up to 50 percent of the vote is allotted to representatives of the salaried
    workers. This is not enough, because voting is evenly split, the shareholders
    always get the deciding vote, but all the same means that it can tip decisions
    in its favor, even when a shareholder owning 80 or 90 percent of the capital stands
    in opposition. This is a significant development, that one arose in Germany and
    Sweden in the wake of World War II. Shareholders in France, Britain, or the United
    States would heartily dislike this system.


    Yet it would be possible to push things even further. I support the idea, for
    instance, that the 50 percent of votes assigned to shareholders, no single shareholder
    could control more than 10 percent. Such a system would come closer to providing
    equality of power, while preserving the possibility, in very small businesses,
    that a person who had brought a certain amount of capital toward a personal project
    might yield a slightly larger share of votes than someone who hadn''t provided
    any capital but might be trying to get his or her own project approved.


    This is the kind of thinking I''m trying to develop on the subject of equality
    in the face of economic clout. It doesn''t call for a complete equality of results,
    because people have diverse aspirations: individuals will develop different plans,
    and absolute equality doesn''t exist, neither when it comes to people''s professions
    nor their incomes. What level of income'
