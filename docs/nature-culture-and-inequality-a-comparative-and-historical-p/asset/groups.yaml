    1792.


    In the plan for a progressive income tax proposed by Graslin in 1767, the effective
    tax rate rises gradually from 5 percent for an annual income of 150 livres tournois
    (about half the average adult income at the time) to 75 percent for an income
    of 400,000 livres tournois (about 1,300 times the average income). A similarly
    progressive schedule for taxing inheritance was proposed by Lacoste in 1792. See:
