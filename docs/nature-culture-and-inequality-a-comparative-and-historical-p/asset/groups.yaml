    are apt to characterize disparities as permanent and inevitable, warning against
    any change that might threaten the existing harmony. In fact, reality is highly
    changeable and always being rebuilt: it is the product of power relations, institutional
    compromises, and partially explored forks for the road.


    But looking beyond this great diversity of egalitarian systems, we can recognize
    a basic movement over the course of the past centuries: a tendency toward greater
    social equality. This trend started at a particular point in history and not,
    for instance, in Neolithic times or in the Middle Ages. It is part of the historical
    development that had its origins in 1789—call it part of the eighteenth century—and
    it has led toward increasing political and socioeconomic equality.


    Limited in extent, this gradual movement toward equality has been a halting, chaotic
    process in which social conflict has played an extremely important role. And it
    has called for various forms of collective learning. In my book Capital and Ideology
    (2019; English translation 2020), I laid out the theme of collective learning
    about just institutions, specifically around the question of borders: What are
    the outlines of the community one belongs to? How are political power and the
    political system organized within this community? The same goes for property:
    What are the limited collective rules that define the limits and extent of property
    rights? What do you have the right to own? What does it mean to be an owner?


    These two central questions—borders and property—are sources of conflict and directional
    change, with each country trying to learn from its own trajectory and all too
    often forfeiting the trajectories of other countries. Each country follows its
    apprenticeship trajectory, which in the long term tends toward greater equality,
    if the motion is hesitant and punctuated by retrograde phases.


    Finally, overarching the diversity of egalitarian systems and the limited trend
    toward equality, there exists another type of relationship between nature, culture,
    and inequality that I''d like to examine here and that I''ll address in the last
    part of this text: global warming, CO₂ emissions, and the destruction of nature
    and biodiversity. This issue will occupy an ever-more'
