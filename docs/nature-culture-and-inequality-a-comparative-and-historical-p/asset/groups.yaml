    In France, approximately 35 percent of total income currently goes to women and
    65 percent to men. To put things in perspective, the share that went to women
    in 1970 was 20 percent, which is close to the level women receive today in India,
    South Asia, and the Middle East. In 1970, women were almost totally excluded from
    the monetary system and had very little buying power. There has definitely been
    some progress in this area, though we shouldn''t exaggerate its extent. The patriarchal
    economy is intimately bound to the development of capitalism, and our emergence
    from this system is still in its early stages, though it''s striking once again
    to see how great the variations are between different countries and parts of the
    world, and how closely tied they are to different sociopolitical and historical
    processes.


    ## AN UNEVEN MARCH TOWARD EQUALITY IN EUROPE


    I’d like to return to the question of the historical development of inequality.
    France is one of the countries for which we have the most reliable historical
    data on income and, more particularly, on wealth and property ownership. This
    is owing to the system for recording inheritances and estates established at the
    time of the French Revolution, which has resulted in inheritance archives with
    unusually rich data going back to the late eighteenth century (fig. 5 and 6).


    ![](img/2eee13f5b3a02cc0e902e1a717403242_22_0.png)


    FIG. 5 Distribution of income in France, 1800–2020: The start of a long-term movement
    toward equality?


    Share of total income going to the top 10 percent of earners, including income
    from work (salaries and wages, income from nonsalaried activities, retirement
    pensions, unemployment compensation) and income from capital (profits, dividends,
    interest, rent, capital gains, etc.) stood around 50 percent from 1800 to 1910.
    After the two world wars, the income gap lessened, benefiting both the working
    class (the poorest 50 percent) and the middle class (the middle 40 percent), to
    the detriment of the upper class (the richest 10 percent). See: piketty.pse.ens.fr/egalite


    ![](img/2eee13f5b3a02cc0e902e1a717403242_23_0.png)


    FIG. 6 The distribution of property in France, 1780–2020: The gradual emergence
    of the propertied middle class


    The share of total private property going to the richest 10 percent (including
    real estate, business assets, and financial assets, net of debt) hovered at 80
    to 90 percent in France from 1870 to 1910. Property ownership became more widespread
    in the wake of World War I, a trend that started in the early 1980s and primarily
    benefited the “propertied middle class,” defined here as the group between the
    disadvantaged classes (the poorest 50 percent) and the well to (the richest 10
    percent). See: piketty.pse.ens.fr/egalite


    Thus, when it comes to income, we see a movement toward greater equality in the
    last two centuries, especially in the twentieth. The share of income going to
    the richest declined from 50 percent to 30 or 35 percent, while the share going
    to the poorest 50 percent rose from 10 or 15 percent to 20 or 25 percent. The
    size of this change should be kept in perspective. The share going to the poorest
    50 percent, as we’ve seen, is still well below the share to the richest 10 percent,
    even though the poorest 50 percent are by definition five times as numerous.


    The level of inequality is much greater when we look at the distribution of property,
    and the movement toward equality is much limited. We observe a significant reduction
    in the share of total property belonging to the richest 10 percent, which drops
    from 80 or 90 percent on the eve of World War I to 50 or 60 percent today, but
    that share has started to rise again since the 1980s. So while it''s important
    to recognize the long-term drop, shouldn''t exaggerate its size. Furthermore,
    this reduction basically benefited the next 40 percent, falling between the richest
    10 percent and the poorest 50 percent. But the poorest 50 percent have hardly
    benefited from the redistribution of property in the past two centuries at all.


    In Western Europe (Germany, the United Kingdom, France, and Sweden), the overall
    trends have been similar: between 1913 and 1920, there was a shift toward a less
    extreme concentration of wealth (fig. 7 and 8). The novel development was the
    emergence of what I have called the property-owning middle class. These 40 percent,
    who are neither the richest 10 percent nor the poorest 50 percent, owned practically
    nothing until 1913 and were thus as poor as the poorest 50 percent. Today, this
    group owns 40 percent of the total wealth of Western Europe and represents 40
    percent of the population: its average wealth is on the order of 400,000 euros
    per adult, but the median in these households is 100,000, 200,000, or 300,000
    euros. These are people who are not enormously wealthy but are far from being
    poor and resent being treated as such. The emergence of this group is a considerable
    event—economically, socially, and politically—even if access to wealth remains
    nil for the poorest 50 percent.


    ![](img/2eee13f5b3a02cc0e902e1a717403242_25_0.png)


    FIG. 7 The persistence of highly concentrated property ownership


    The share of total private property owned by the richest 10 percent in 1913 (averaged
    for France, the United Kingdom, and Sweden) came to 89 percent (with the poorest
    50 percent owning just 1 percent); 56 percent in Europe in 2020 (with the poorest
    50 percent owning 6 percent); and 72 percent in the United States in 2020 (with
    the poorest 50 percent owning 2 percent). See: piketty.pse.ens.fr/egalite


    ![](img/2eee13f5b3a02cc0e902e1a717403242_25_1.png)


    ## FIG. 8 Extreme inequality of wealth: European property-owner societies in the
    Belle Epoque (1880–1914)


    The share going to the wealthiest 10 percent (counting real estate, business assets,
    and financial assets, minus any debt) averaged 84 percent in France from 1880
    to 1914 (as against 14 percent to the middle 40 percent, and 2 percent to the
    poorest 50 percent); 91 percent in the United Kingdom (as against 8 percent and
    1 percent); 88 percent in Sweden (as against 11 percent and 1 percent). See: piketty.pse.ens.fr/egalite


    In Europe, the main characteristics are a persistent high concentration of property
    and the emergence of a property-owning middle class. What we see in the United
    States today is intermediate between the present state in Europe and its situation
    before World War I. The properied middle class in the United States is, and whereas
    it reached the European levels of 30 to 40 years ago, it is starting to drop closer
    to Europe’s pre-World War I levels.


    In a general way, the history of inequality in the countries of Europe before
    World War I is full of useful instruction. The period was a very rich in comparison
    with the present period, and it has had a profound effect on my trajectory as
    a researcher. My friends and colleagues Gilles Post-Vinay and Jean-Laurent Rosenthal
    and I were able to show that the degree of property concentration in France differed
    little from its concentration in the United Kingdom. This is significant, because
    political speeches made during the French Third Republic constantly contrasted
    France and the United Kingdom. A major theme of France’s central elites—whether
    in politics, finance, or the republican movement—was the contention that “We are
    utterly different from the United Kingdom. Owing to the French Revolution, we
    are an egalitarian nation, and therefore we don’t have to create progressive income
    or inheritance taxes. That’s all very useful for a country as monarchical and
    highly unequal as the United Kingdom, or as authoritarian as Prussia, but we French,
    who invented liberty and equality, are already a country of small landowners and
    have divided up our ended estates.” Certainly, except that property had not divided
    much.

