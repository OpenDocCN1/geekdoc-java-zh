    ……至少和他们一样少。从这个角度来看，日益进步的累进税制是建立福利国家的决定性因素，它为税收提供了一个合约基础，使得不断上升的税收负担变得可以接受。


    另一方面，今天税收制度是问题的巨大根源。中低层阶级可能会有这样印象——而且这不仅仅是印象——富人正在避税，因为尽管有理论上的税率，但富人仍有许多漏洞和策略来降低他们的纳税额度。


    遗产税也遵循了类似的轨迹（图 13）。令人震惊的是，20 世纪中期，美国、英国和日本的最高税率攀升得如此快。这与法国和德国形成了对比——部分原因是这两个国家的财富再分配是战争、破坏和通胀的结果。有趣的是，德国唯一一次对遗产征收高税率（以及所得税）是在
    1945 年 1948 年间，当时税率飙升至 90%。这对应于德国税收政策由美国设计的时期，因为盟军管制委员会负责制定德国的税率。美国人并没有特别地意图惩罚德国精英，因为他们自己在国内也在做同样的事情。美国当时认为这都是“文明包”的一部分：他们将向德国引入民主制度，并辅以一套税收结构，以防止民主变成富豪精英政治。这在今天听起来是多么奇特！这并不是很久以前的事，回顾这段历史是非常重要的，仅仅是为了意识到我们的观点发生了多大的变化。


    关于 20 世纪不平等的历史性减少，我还有一个花时间说明的一个重要点：国际资产的崩溃，特别是殖民资产的崩溃（图 15）。这种现象在法国和英国尤为突出：直到
    1913 年，这两个国家在全球范围内积累了大量的资产。这些资产的形式包括苏伊士运河的股份、俄罗斯和阿根廷的铁路，以及政府对海地、摩洛哥、中国和奥斯曼帝国征收的款项，这些款项相当于真正的军事贡金。总之，法英拥有的债务相当于法国一年的财政收入和英国两年的财政收入。这些债务收益（以利息、股息和租金的形式）占法国财政收入的
    5% 和英国的 10%。仅对法国而言，这就等同于该国整个东北部的工业产值，并允许了持续的结构性贸易逆字的融资。在 1880 年到 1914 年间，贸易逆差上升到
    2% 或 3%，同时国民收入的 5% 到 10% 作为收入和资本来自世界其他地区。这些资金不仅涵盖了贸易逆差，还让“购买世界其他地区”的做法得以继续。这相当于你付给房东的租金让他买下了剩下的整栋楼。


    ![](img/2eee13f5b3a02cc0e902e1a717403242_47_0.png)


    图 15 历史视角下的外国资产：法国和英国殖民所有权的巅峰


    净外国资产——居住在特定国家的所有者持有的资产（包括政府拥有的资产）减去世界其他地区所有者在该国持有的资产——在 1914 年占英国国民收入的 191%，占法国国民收入的
    125%。2020 年，净外国资产分别占日本财政收入的 82%，德国的 61% 和中国的 19%。参见：pikety.pse.ens.fr/egalite


    这些是高度紧张且不稳定的局势，仅得于殖民政府和军事力量才维持稳定。体系随着第一次世界大战的爆发而崩溃。新的国际形势负有部分责任：公开没收、布尔什维克夺权后对俄国国债的否认、苏伊士运河的国有化等等。部分责任还来自于战争成本：法英财产所有者被迫出售大部分外债，以向他们的政府提供资金来进行战争——这些战争正在摧毁他们国家剩余的工业资本。这是从
    1914 年到 1945 年欧洲历史中心的一段略显荒谬的自我毁灭过程。


