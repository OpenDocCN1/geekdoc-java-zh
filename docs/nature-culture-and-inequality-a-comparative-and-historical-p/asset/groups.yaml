    An individual carbon footprint is composed of emissions from domestic consumption,
    public and private investments, and the net import of goods and services from
    other parts of the world. These estimates are based on a combination of tax data,
    household studies, and import-export tables. Emissions are divided equally among
    household members. See: wr2022.wid.world/methodology and Chancel (2021).


    An emission-reduction policy, therefore, that proposed a fixed cut across the
    entire population would inevitably run into difficulties. It would be hard to
    convince people who are emitting four or five tons per year that they should reduce
    their emissions by the same proportion as people emitting thirty or seventy tons.
    A strategy that increased energy costs at the same rate would inevitably provoke,
    in the years and decades ahead, a tax revolt of the kind that the *gilets jaunes*
    (yellow vests) recently spearheaded often spare the energy consumed by the richest
    group—jet fuel in particular.


    It''s hard to see how else to meet these challenges than by asking those whose
    carbon emissions are highest to make reductions that are proportionally higher.
    This would call for putting a whole system in place that would include such tools
    as a progressive carbon card. It would also call for quite a drastic reduction
    in the income and wealth gaps.


    ## CONCLUSION


    Working from historical data, I find it difficult to predict how the present situation
    will develop and what form the future will take. But I''ll offer two hypotheses
    all the same.


    First, once the consequences of climate change have a more concrete effect on
    the lives of individuals, it''s not impossible that attitudes toward the economic
    system may shift very quickly, Europe as in the rest of the world.


    Second, I hope I''ve convinced you that the history of inequality is not a long,
    Many battles have been fought on its behalf; many have been won. Over the long
    haul, there has been a general trend toward equality, a real if limited one. Questions
    about the economy, about finance, government debt, and wealth distribution are
    too important to be left in the hands of a small group of economists and experts,
    many of them very conservative. Instead of widening the historical and comparative
    perspective, they often look through the wrong end of the telescope to find narrow
    solutions. We need other social science researchers—historians, sociologists,
    political scientists, anthropologists, ethnologists—to sink their teeth into these
    questions, grapple with their technical aspects, and take a stand. These issues
    shouldn''t be left to others. The democratization of economic and historical knowledge
    may, should, and ought to become an important part of a movement whose aim is
    to democratize society as a whole and better apportion power.


