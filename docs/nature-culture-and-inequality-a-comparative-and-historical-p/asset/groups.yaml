    # GENDER INEQUALITY


    In developing our methods and sources at the World Inequality Database, we generally
    aim as much as possible at compiling data that is comparable across different
    parts of the world. We first looked at income inequality, then wealth inequality;
    we subsequently developed a fairly simple metric for gender inequality: women’s
    share of total income from work (salaries and income from unsalaried activity).
    If there were perfect equality, that number should be 50 percent. In actual fact,
    if you look at studies of the time spent working, which course includes household
    work, women always account for more than 50 percent of hours worked. Ideally,
    their share of total income should therefore be more than 50 percent as well.
    What we see in practice, however, is that their share falls far below that number
    (fig. 4). And while there has been some progress (in Europe, for example, women’s
    share of income has increased from 30 to 36 percent in the past few decades, still
    leaving 64 percent for men), there are countries moving in the opposite direction:
    China, whose communist legacy originally left women a slightly higher share of
    total income than in other countries, has been trending lower in recent decades,
    largely because of the huge increase in very high earnings, which mostly go to
    men, in China as elsewhere.'
  - '[PAGE 20]


    ![](img/2eee13f5b3a02cc0e902e1a717403242_20_0.png)


    Fig. 4 Share of income from work received by women in different regions of the
    world, 1990–2020


    From 1990 to 2020, the share of income from work that went to women in North America
    rose from 34 percent to 38 percent. See: wir2022.wid.world/methodology; and Theresa
    Neef and Anne-Sophie Robillard, "Half the Sky? The Female Labor Income Share in
    a Global Perspective," World Inequality Lab—Working Paper No. 2021/22, December
    2021.


    The metric we use have the advantage of giving a more accurate picture of the
    vast economic disparity between men and women than some others, which tend to
    sugar reality: too often, we look simply at the salary gap for a given position,
    when the problem is that men and women actually don’t have access to the same
    positions. What we measure here is women’s share of total income. Obviously, this
    brings together many different factors: the pay disparity for any given position,
    which is on the order of 10 to 20 percent, but also the disparity between the
    kinds of jobs men and women can attain, the amount of part-time work they receive,
    the dearth of women in better-paying jobs, the low rate of promotions for women,
    et catera.'
