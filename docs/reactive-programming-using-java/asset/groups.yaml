  mdcn: "\n\n# 第 6 章\n\n## RxJava 与 Android\n\n在真实的移动驱动世界中，谈论 Java 也意味着谈论 Android。\n\
    RxJava 库可以在不满足任何其他要求的情况下在 Android 开发中使用。这意味着你到目前为止看到的所有代码示例都可以包含在 Android 项目中；你只需要在你的\
    \ `build.gradle` 文件中添加 RxJava 的依赖即可。\n有一些库为在 Android 环境中应用 RxJava 概念提供了额外支持。基础库包括：\n\
    \n- RxAndroid\n- RxBindings\n- RxLifecycle\n\n## RxAndroid\n\nRxAndroid 是你需要的第一个\
    \ Android 开源库。事实上，它提供了一个非常实用的 `Scheduler` 实例，可以在主线程（或给定的 looper）上进行调度。\n要安装该依赖，你只需要在\
    \ `build.gradle` 文件中添加两个依赖声明：\n\n```\napply plugin: 'com.android.application'\n\
    \nandroid {\n    compileSdkVersion 24\n    buildToolsVersion \"24.0.1\"\n\n  \
    \  defaultConfig {\n        applicationId \"com.example\"\n        minSdkVersion\
    \ 24\n        targetSdkVersion 24\n        versionCode 1\n        versionName\
    \ \"1.0\"\n    }\n}\n```\n\n```\nbuildTypes {\n    release {\n        minifyEnabled\
    \ true\n        shrinkResources true\n        proguardFiles getDefaultProguardFile('proguard-android.txt',\n\
    \                        'proguard-rules.pro')\n    }\n}\n```\n\n```\ndependencies\
    \ {\n    compile 'com.android.support:compat-v7:24.1.1'\n    compile 'io.reactive:rxjava:1.2.0'\n\
    \    compile 'io.reactive:rxandroid:1.2.1'\n}\n```\n\nRxJava 需要 `minSdkVersion\
    \ 9`，但 RxAndroid 需要 `minSdkVersion 14`。\n请参考网站 (https://github.com/ReactiveX/RxAndroid)\
    \ 了解两者的最新版本。\n\n正如你所示，可以使用提供的 `AndroidSchedulers.mainThread()` 作为 `Observer` 的参数，让你的\
    \ `Subscriber` 在 UI 线程上接收 `onNext(T)/`onError(Throwable)``onComplete()` 事件通知：\n\
    \n```\nObservable.range(1, 10)\n    .subscribeOn(Schedulers.newThread())\n   \
    \ .observeOn(AndroidSchedulers.mainThread())\n    .subscribe(new Subscriber<Integer>()\
    \ {\n```\n\n```\n@Override\n    public void onCompleted() {\n        // 在 UI 线程上通知\n\
    }\n```\n\n```\n@Override\n    public void onError(Throwable e) {\n        // 在\
    \ UI 线程上通知\n}\n```\n\n```\n@Override\n    public void onNext(Integer item) {\n\
    \        // 在 UI 线程上通知\n}\n```\n\n```\n});\n```\n\n你也可以在另一个线程上订阅，相应的 `Scheduler`\
    \ 可以通过 `AndroidSchedulers.from(method)` 实例化：\n\n```\nBackgroundThread myThread\
    \ = new myThread();\nThread.start();\n```\n\n```\nObservable.range(3, 10)\n  .subscribeOn(AndroidSchedulers.from(myThread.getLooper()))\n\
    \  .observeOn(AndroidSchedulers.mainThread())\n  .subscribe(new Subscriber<Integer>()\
    \ {\n    @Override\n    public void onCompleted() {\n      // 在 UI 线程上通知\n   \
    \ }\n\n    @Override\n    public void onError(Throwable e) {\n      // 在 UI 线程上通知\n\
    \    }\n\n    @Override\n    public void onNext(Integer item) {\n      // 在 UI\
    \ 线程上通知\n    }\n  });\n```\n\n如果你想围绕你的 `Handler` 封装一个 `Scheduler`，请使用 `HandlerThreadScheduler`。\n\
    \n## RxBindings\n\nRxJava 也可以用响应式的方式与 UI 组件进行交互，而不是使用监听器。\n\n例如，要在 `View` 被点击时接收通知，你必须实现\
    \ `OnClickListener()`：\n\n```\nmyView.setOnClickListener(new OnClickListener()\
    \ {\n    @Override\n    public void onClick(final View v) {\n    }\n});\n```\n\
    \n如果你想监听 `EditText` 中输入文本的变化，你必须通过 `EditText.addTextChangedListener(TextWatcher)`\
    \ 方法添加 `TextWatcher`：\n\n```\neditText.addTextChangedListener(new TextWatcher()\
    \ {\n    @Override\n    public void onChange(CharSequence s, int start, int before,\
    \ int count) {\n    }\n});\n```\n\n```\n@Override\npublic void beforeTextChanged(CharSequence\
    \ s, int start, int count,\n    int after) {\n}\n\n@Override\npublic void afterTextChanged(Editable\
    \ s) {\n}\n};\n```\n\nRxBinding (https://github.com/jakewharton/RxBinding) 是一个开源库，提供了一些方法来避免使用这种回调机制，而是而应用响应式逻辑。\n\
    \n## 要将此库添加到你的 Android 项目，请将依赖添加到 app 的 `build.gradle` 文件中：\n\n```\napply plugin:\
    \ 'com.android.application'\n\nandroid {\n    compileSdkVersion 24\n    buildToolsVersion\
    \ \"24.0.1\"\n\n    defaultConfig {\n        applicationId \"com.example\"\n \
    \       minSdkVersion 14\n        targetSdkVersion 24\n        versionCode 1\n\
    \        versionName \"1.0\"\n    }\n\n    buildTypes {\n        shrinkEnabled\
    \ true\n        minifyResources true\n        proguardFiles getDefaultFile('proguard-android.txt'),\n\
    \            'proguard-rules.pro'\n    }\n}\n\ndependencies {\n    compile 'com.android.support:appcompat-v7:24.1.1'\n\
    \    compile 'io.reactive:rxjava:1.2.0'\n    compile 'io.reactive:rxandroid:1.2.1'\n\
    \    compile 'com.jakewharton.rxbinding:...'\n}\n```\n\n"
