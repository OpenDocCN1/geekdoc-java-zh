    \ 和 `filter()` 将在不同的线程执行。\n结果（onNext、onError 和 onCompleted）将在主线程进行通知。\n\n# 链式多次调用\n\
    \n链式多次调用通常意味着处理嵌套回调，这会让你的代码难以阅读和维护。此外，你必须在每个回调中处理错误，增加了代码的复杂性。\n\n根据你目前看到的，很容易理解如何使用\
    \ RxJava 通过可观察对象（observables）来代替回调链。\n在这个简单的场景中，你需要调用一个远程 API 来验证用户，然后调用另一个 API\
    \ 获取用户数据，再次调用另一个 API 获取用户的联系人。\n以下代码展示了带有回调的嵌套 API 调用：\n\n```java\nimport retrofit2.Callback;\n\
    import retrofit2.Call;\nimport retrofit2.Response;\n```\n\nUser user = null;\n\
    \nmyService.login(username, password,\n    new Callback<AccessToken>() {\n\n \
    \   @Override\n    public void success(User user, Response response) {\n\n   \
    \     storeCredentials(response.getAccessToken());\n\n        myService.getUser(accessToken,\
    \ new Callback<User>() {\n            @Override\n            public void onResponse(Call<User>\
    \ call,\n                Response<User> response) {\n\n                user =\
    \ response.getBody();\n            });\n        });\n    }\n\n```\n\nmyService.getUserContact(user.getId(),\n\
    \    new Callback<Contact>() {\n    @Override\n    public void onResponse(Call<Contact>\
    \ contact,\n        Response<Contact> response) {\n        user.setContact(response.getBody());\n\
    \    }\n\n    @Override\n    public void onFailure(RetrofitError error) {\n  \
    \      // 在此处处理错误...\n    }\n});\n\n@Override\npublic void onFailure(RetrofitError\
    \ error) {\n    // 在此处处理错误...\n    }\n});\n@Override\npublic void failure(RetrofitError\
    \ error) {\n    // 在此处处理错误...\n    }\n});\n```\n\n这就是你如何使用 RxJava 转换这段代码：\n```java\n\
    myService.login(\n    .doNext(accessToken -> storeCredentials(accessToken))\n\
    \    .flatMap(accessToken -> myService.getUser(accessToken))\n    .flatMap(user\
    \ -> myService.getUserContact(user.getId()))\n    .subscribe(new Subscriber<Contact>()\
    \ {\n    @Override\n    public void onCompleted() {\n    }\n\n    @Override\n\
    \    public void onError(Throwable e) {\n    }\n\n    @Override\n    public void\
    \ onNext(Contact contact) {\n    }\n});\n```\n\n# 第 5 章 使用 RXJAVA 和 RETROFIT 进行工作\n\
    \n其中\n\n- *myService.login(token)* 返回一个 `Observable<AccessToken>`\n- `doNext()`\
    \ 方法被应用于 `myService.login()` 的结果，每当发射一个 `AccessToken` 实例时都会调用 `storeCredentials()`\n\
    - 第一个 `flatMap` 算子使用同一个 `AccessToken` 实例来调用方法 `myService.getUser(accessToken)`，然后返回一个\
    \ `Observable<User>`。\n- 另一个 `flatMap` 算子被用于发射 `User` 实例以调用 `myService.getContact(user.get(id()))`。\n\
    \n代码变得更容易阅读和维护，因为它是使用可重用的代码块构建的。\n使用嵌套回调时，有三个地方需要处理错误，而在 RxJava 版本中，你只需要在一个地方处理错误，因为每个错误都会被传递并在\
    \ `onError` 方法中通知。\n\n# 缓存数据\n\n在处理网络时，一个重要的主题是缓存。缓存是一种保存网络响应本地副本的机制，以便在网络不可用时使用或避免频繁的网络调用。\n\
    Retrofit 使用 OkHttpClient 的缓存机制捕捉网络响应。在某些情况下，这是不够的，你需要通过应用自己的缓存逻辑来缓存数据。\n同样，RxJava\
    \ 可以帮助你用简单易读的代码构建复杂的缓存机制。以下代码展示了一个类的抽象实现，该类在磁盘和内存中缓存网络响应。注意，在此示例中你利用了 Lambda 表达式（Java\
    \ 8 提供）来让代码更简洁。\n\n```java\nabstract class CacheManager<T> {\n    private T memoryCache;\n\
    \n    public Observable<T> getData() {\n        return Observable.concat(fromMemory(),\
    \ fromDisk(), fromNetwork())\n            .first(response -> isValid(response))\n\
    \            .onErrorNext(t -> fallbackToDiskCache());\n    }\n\n    protected\
    \ Observable<T> fromNetwork() {\n        return doNetworkCall()\n            .doNext(response\
    \ -> {\n                cacheInMemory(response);\n                cacheOnDisk(response);\n\
    \            })\n            .compose(logSource(\"network\"));\n    }\n}\n```\n\
    \n# 第 5 章 使用 RXJAVA 和 RETROFIT 进行网络编程\n\n```java\nprivate Observable<T> fallbackToDiskCache()\
    \ {\n    System.out.println(\"fallback to disk cache\");\n    return fromDisk();\n\
    }\n\nprotected void cacheOnDisk(T response) {\n    System.out.println(\"saving\
    \ data on disk: \" + response);\n    persistOnDisk(response);\n}\n\nprotected\
    \ Observable<T> fromDisk() {\n    Observable<T> observable = Observable.create(subscriber\
    \ -> {\n        T response = readFromDisk();\n        if (response != null) {\n\
    \            subscriber.onNext(response);\n            cacheOnDisk(response);\n\
    \        }\n        subscriber.onComplete();\n    });\n    return observable.compose(logSource(\"\
    disk\"));\n}\n\nprotected void cacheInMemory(T response) {\n    memoryCache =\
    \ response;\n}\n\nprotected Observable<T> fromMemory() {\n    Observable<T> observable\
    \ = Observable.create(subscriber -> {\n        subscriber.onNext(memoryCache);\n\
    \        subscriber.onComplete();\n    });\n    return observable.compose(logSource(\"\
    memory\"));\n}\n\npublic void deleteAll() {\n    memoryCache = null;\n    deleteFromDisk();\n\
    }\n\nprivate Observable.Transformer<T, T> logSource(final String source) {\n \
    \   return dataObservable -> dataObservable.doNext(data -> {\n        if (data\
    \ == null) {\n            System.out.println(source + \" 没有任何数据.\");\n       \
    \ } else if (!isValid(data)) {\n            System.out.println(source + \" 有过时的数据.\"\
    );\n        } else {\n            System.out.println(source + \" 有你正在寻找的数据！\"\
    );\n        }\n    });\n}\n```\n\nabstract boolean isValid(T data);\nabstract\
    \ Observable<T> doNetworkCall();\nabstract void persistOnDisk(T response);\nabstract\
    \ T readFromDisk();\nabstract void deleteFromDisk();\n\n"
