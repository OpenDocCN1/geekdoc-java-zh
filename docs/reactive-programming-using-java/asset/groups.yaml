    on an instance of Person? What will be the sequence emitted by the observables?\n\
    Unfortunately, the output will be\n\nage: 0\nname: null\n\nThis is not what you\
    \ wanted. The problem here is that Observable.just() is evaluated as soon as it\
    \ is invoked, it will create a sequence using the exact value that name and reference\
    \ when the observable is created. In the example, when the observable is created,\
    \ age is 0 and name is null.\n\nYou'd like to have a different behavior here:\
    \ you want the values to be evaluated when you subscribe to the observables, and\
    \ you can do this using Observable.defer().\n\nObservable.defer() accepts an interface\
    \ of Func<Observable<T>> as parameter. Func<R> is an interface that exposes just\
    \ one method that accepts zero arguments and returns a value of type R. There\
    \ is also a Func<T,R> interface that exposes just one method that accepts one\
    \ argument of type T and returns a value of type R. RxJava provides similar interfaces\
    \ for up to nine arguments (Func<T,R>) and a varags version (FuncN<R>).\n\n21"
  - "[PAGE 27]\n\n# CHAPTER 2 OBSERVABLES AND OBSERVERS\n\n```\nObservable<String>\
    \ nameObservable =\nObservable.defer(new\n    FuncObservable<String>()() {\n \
    \   @Override\n    public Observable<String> call() {\n        return Observable.just(person.getName());\n\
    \    }\n});\nObservable<Integer> ageObservable =\nObservable.defer(new FuncObservable<Integer>()()\
    \ {\n    @Override\n    public Observable<Integer> call() {\n        return Observable.just(person.getAge());\n\
    \    }\n\n```\n\nBy using these two observables, the output of the previous examples\
    \ becomes\n\nage: 35\nname: Bob\n\nAnd that's what you expected.\n\n# Composing\
    \ and Transforming Observables\n\nObservables are especially good at being composed\
    \ and transformed. With the usage of some operators defined in the library, you\
    \ can compose and transform sequences of data in a easy way that requires little\
    \ coding, so it's less prone to error.\n\nIn the following sections we use special\
    \ diagrams called marble diagrams that efficiently explain what operators do.\n\
    \n# map\n\nThe map operator is one of the most common operators in reactive programming.\
    \ It lets transform every item of the emitted sequence with a specific function.\n\
    \nIn the example shown in Figure 2-1, the input sequence is a series of integers\
    \ (1, 2, 3) and every item of the sequence is multiplied by 10. Applying the map\
    \ operator to an observable, a new observable will be created; this new observable\
    \ will emit x*10 every time the first observable emits."
