    # CHAPTER 5


    # # Networking with RxJava

    and Retrofit


    Network operations like calling the Restful API are an example of a scenario where
    you can apply RxJava.


    +   - You need to implement a callback mechanism to react to the response of the
    network call, which can terminate with a successful true or a failure.

    - Sometimes you need to chain different network calls sequentially.

    - Often these operations need to be executed in a separate thread.


    It''s trivial now to map the idea of a response with a successful or error state
    to the Subscriber''s next and onError methods, chaining operations to an Observable
    concatenation (or transformation), and the idea of using a separate thread for
    the application of a Scheduler.


    Java provides a basic support for network operations (look at packages java.net
    and java.util), but there are many other libraries that really-simplify working
    with a network, like


    +   - Netty (http://netty.io/)

    - AsyncHttp Client (https://github.com/AsyncHttpClient/AsyncHttp-client)

    - OkHttp (https://square.github.io/okhttp/)

    - Retrofit (https://square.github.io/retrofit/)


    This chapter covers Retrofit as it has an interesting feature: built-in support
    for RxJava lets you choose if you want the network response to be wrapped inside
    an Observable object.


    I''m assuming you know what RESTful APIs (https://en.wikipedia.org/wiki/Representational_state_transfer)
    are and that you have a basic knowledge of JSON (Google Gson will be used for
    JSON parsing - https://github.com/google/gson).'
