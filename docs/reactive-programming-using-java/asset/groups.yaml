    \ time, TimeUnit scheduler) lets you create a ReplaySubject that is both time-bounded\
    \ and size-bounded.\n\n## AsyncSubject\n\nAsyncSubject<T> (Figure 4-4) is an implementation\
    \ of Subject that emits only the last item from the source observable after it\
    \ completes, or notifies an error event if the source observable does not emit\
    \ any item.\n\n# AsyncSubject\n\n![](img/2ab15486b46859b709ebbac39262fbfa_74_0.png)\n\
    \n**Figure 4-4.** The marble diagram for AsyncSubject<T>\n\nLet's change the previous\
    \ example to use AsyncSubject instead of PublishSubject:\n\n```java\nAsyncSubject<Integer>\
    \ subject = AsyncSubject.create();\n\nObservable<Integer> subjectAsObservable\
