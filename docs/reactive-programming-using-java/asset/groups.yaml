    \ the item is even, add it to output list.\n- Continue with following programming\
    \ until the end of input list is reached.\n\nAn alternative to functional programming.\
    \ In functional programming, the result of the program derives from evaluation\
    \ of functions without changing the internal state. Each time f(x) is called,\
    \ passing the same argument, you always get the same result. This is similar to\
    \ static methods that do not depend on any of the Object's members. In simpler\
    \ terms, in functional programming blocks which build the program are not objects\
    \ but functions. So using functional programming, the example above can be rewritten\
    \ with the following pseudocode:\n\n```java\nvar output = input.filter(x -> x\
    \ % 2 == 0);\n```\n\nHere, the arrow (->) means \"apply function\" (right side)\
    \ to variable x (left side). The features of functional language are the following:\n\
    \n- Higher-order functions: Higher-order functions are functions that take other\
    \ functions as arguments.\n- Immutable data: Data is immutable by default; instead\
    \ of modifying values, functional languages often operate on copy of original\
    \ values (in Java, primitive types are already immutable but objects are not,\
    \ so its implementation must not allow change).\n- Concurrency: Concurrency is\
    \ supported and is safer to implement thanks to immutability by default.\n- Referential\
    \ transparency: This term defines the fact that computations can be performed\
    \ at any time, always producing the same result (similar to static methods in\
    \ Java).\n- Lazy evaluation: Values can be computed only when needed (lazily)\
    \ because functions can be evaluated at any time (these functions do not depend\
    \ on the program's internal state).\n\nThere are programming languages that are\
    \ defined as purely functional languages, like Haskell, Hope, and Mercury. Java\
    \ is not one of these languages, but we can get the advantages of functional programming\
    \ also in Java. With the release of Java 8, some constructs of functional programming\
    \ have been added, lambda functions and streams. But with the RxJava library we\
    \ can use concepts of functional programming with Java 7+.\n\n## Lambda Expressions\n\
    \nLambda expressions are anonymous functions; the lambda operator is indicated\
    \ using an arrow symbol pointing to the right (->). Inputs are placed at the left\
    \ of the operator, and the function body is placed at the right.\n\nIn Java, lambda\
    \ expressions can be used to replace anonymous inner classes that implement an\
    \ interface with just one method. For example, consider the following Button object:\n\
    \n```java\nclass Button {\n    void setOnClickListener(OnButtonClickClickListener\
    \ listener) {\n    }\n}\n\ninterface OnButtonClickClickListener {\n    void onButtonClick();\n\
    }\n```\n\nTo attach a listener to the Button, you can use an anonymous function:\n\
    \n```java\nButton button = ...\nbutton.setOnClickListener(new OnButtonClickClickListener()\
    \ {\n    public void onButtonClick() {\n        // do something on button clicked\n\
    \    }\n});\n```\n\nUsing lambda expressions, the code above becomes the:\n\n\
    ```java\nButton button = ...\nbutton.setOnClickListener(() -> // do something\
    \ on button clicked );\n```\n\nOn the right side of the lambda operator you can\
    \ include all of the code to be executed when the button is clicked; this code\
    \ has no input, as indicated by the empty brackets on the left side of the lambda\
    \ operator.\n\nIf the method onButtonClickListener accepts some parameters, the\
    \ example above becomes\n\n```java\ninterface OnButtonClickClickListener {\n \
    \ void buttonClicked(Object param);\n}\n```\n\n```java\nButton button = ...\n\
    button.setOnClickListener(param ->\n    // do something on button clicked\n  \
    \  // param can be used in this code block\n);\n```\n\nJava support for lambda\
    \ expressions was introduced in Java 8, but you can use them in previous Java\
    \ versions using the retrolambda library (https://github.com/evant/gradle-retrolambda).\n\
    \n## Imperative or Functional?\n\nSo, why should you choose functional programming\
    \ over imperative programming? Functional code is often shorter and easier to\
    \ understand than the corresponding imperative code. You can do the same work\
    \ with less code, and every programmer knows that less code leads to less bugs.\n\
    \nIn imperative programming, implementing abstraction requires you to define interfaces\
    \ and split code into components that implement those interfaces; functional languages\
    \ make it easier to create abstractions (just think about how lambda expressions\
    \ avoid the necessity of creating interfaces with implementations).\n"
  mdcn: "\n\n# 引言\n\n欢迎学习响应式 Java 编程（Reactive Java Programming）。通过这本书，你将学习如何以响应式的方式开发\
    \ Java Android 应用程序，从使用变量进行同步状态管理转向处理异步数据流。这意味着你将学习如何将函数式编程的元素应用于 Java 程序中，以及如何编写对事件产生“响应”的代码；你还能编写出更短、更易读、更易维护且更不容易出错的代码。为了实现这一点，你将学习\
    \ RxJava 库，它是最初由 Erikx 为 .NET 开发的响应式（Rx）库的 Java 实现。\n\n你将从学习什么是响应式函数式编程以及它与命令式编程的区别开始。\n\
    \n在第 2 章中，你将看到如何在项目中引入 RxJava 库，并探索该库提供的主要类和方法。\n\n第 3 和第 4 章涵盖了处理异步数据流的高级概念，如错误处理和线程。\n\
    \n在第 5 章中，你将之前章节中学到的知识应用于特定领域：网络。\n\n最后，在第 6 章中，你将查看一些为了扩展 RxJava 到 Android 开发而的库。\n\
    \n# 第 1 章\n\n## ReactiveX 和 RxJava\n\n### 简介\n\nJava 是一种面向对象的编程语言，已经存在多年（它于1995年正式引入）。今天，得益于它的成熟性、性和强大的社区支持，它是最受推崇和使用的语言之一。Java\
    \ 根植于其构建的基础概念：Java 是一种面向对象的语言。\n\n近年来，新的编程范式变得流行，例如函数式编程和响应式编程。Java 曾一度落后。然而，Java\
    \ 8 在 Lambda 表达式和流（Streams）的支持下了函数式编程，但 RxJava 库提供了实现函数式和响应式编程所需的类和方法。在本章中，我将介绍函数式编程、响应式编程和观察者模式的概念。然后我将向你展示什么是\
    \ ReactiveX 和 RxJava 以及它们如何帮助你编写更易读、更短、易维护且无错误的代码。在后续章节中，你将深入研究 RxJava，通过具体的示例学习常用的类和方法。我假设你已经具备\
    \ Java 编程的基础，尽管不需要高深的技能。\n\n## 命令式编程与函数式编程\n\n如你所知，Java 是一种命令式语言。程序由一系列指令组成。这些指令中的每一条都按照你编写的顺序执行，执行会导致程序状态的变化。例如，以下代码创建了一个偶数集合：\n\
    \n```java\nList<Integer> input = Arrays.asList(1, 2, 3, 4, 5);\nList<Integer>\
    \ output = new ArrayList<>();\nfor (Integer x : input) {\n    if (x % 2 == 0)\
    \ {\n        output.add(x);\n    }\n}\n```\n\n为了产生所需的输出，你定义了程序构建列表的每一个步骤，并顺序顺序定义步骤：\n\
    \n- 定义并创建输入列表。\n- 定义并创建空输出列表。\n- 取输入列表的每一项。\n- 如果项是偶数，则将其添加到输出列表。\n- 继续后续编程直到到达输入列表结束。\n\
    \n这是函数式编程的替代方案。在函数式编程中，程序的结果源于函数的求值而不改变内部状态。每当调用 f(x) 并传递相同的参数时，你总是得到相同的结果。这类似于不依赖于对象任何成员的静态方法。简单来说，在函数式编程中，构建程序的代码块不是对象而是函数。因此，使用函数式编程，上面的示例可以用以下伪代码重写：\n\
    \n```java\nvar output = input.filter(x -> x % 2 == 0);\n```\n\n在这里，箭头 (->) 表示“应用函数”（右侧）到变量\
    \ x（左侧）。函数式语言的特征如下：\n\n- **高阶函数**：高阶函数是将其他函数作为参数的函数。\n- **不可变数据**：数据默认是不可变的；与其修改值，函数式语言通常在原始值的副本上进行操作（在\
    \ Java 中，基本类型已经是不可变的，但对象不是，所以其实现不能允许更改）。\n- **并发**：支持并发，并且由于默认的不可变性，实现起来更安全。\n\
    - **引用透明性**：该术语定义了计算可以在任何时间执行且始终产生相同的结果（类似于 Java 中的静态方法）。\n- **惰性求值**：值仅在需要时（惰性地）才计算，因为函数可以随时求值（这些函数不依赖于程序的内部状态）。\n\
    \n存在被定义为纯函数式语言的编程语言，如 Haskell、Hope 和 Mercury。Java 并不是这些语言之一，但我们也可以在 Java 中获得函数式编程的优势。随着\
    \ Java 8 的发布，增加了一些函数式编程的构造，Lambda 函数和流。但通过 RxJava 库，我们可以在 Java 7+ 中使用函数式编程的概念。\n\
    \n## Lambda 表达式\n\nLambda 表达式是匿名函数；Lambda 运算符使用指向右侧的箭头符号 (->) 表示。输入放在运算符的左侧，函数体放在右侧。\n\
    \n在 Java 中，Lambda 表达式可以用来替换实现单个方法的接口的匿名内部类。例如，考虑以下 Button 对象：\n\n```java\nclass\
    \ Button {\n    void setOnClickListener(OnButtonClickClickListener listener) {\n\
    \    }\n}\n\ninterface OnButtonClickClickListener {\n    void onButtonClick();\n\
    }\n```\n\n要给 Button 绑定监听器，可以使用匿名函数：\n\n```java\nButton button = ...\nbutton.setOnClickListener(new\
    \ OnButtonClickClickListener() {\n    public void onButtonClick() {\n        //\
    \ 在按钮点击时做某些事情\n    }\n});\n```\n\n使用 Lambda 表达式，上面的代码变为：\n\n```java\nButton button\
    \ = ...\nbutton.setOnClickListener(() -> // 在按钮点击时做某些事情 );\n```\n\n在 Lambda 运算符的右侧，你可以包含点击按钮时要执行的所有代码；这段代码没有输入，如\
    \ Lambda 运算符左侧的空括号所示。\n\n如果 `ButtonClickListener` 上的方法接受某些参数，上面的示例变为：\n\n```java\n\
    interface OnButtonClickClickListener {\n  void buttonClicked(Object param);\n\
    }\n```\n\n```java\nButton button = ...\nbutton.setOnClickListener(param ->\n \
    \   // 在按钮点击时做某些事情\n    // param 可以在此代码块中使用\n);\n```\n\nJava 对 Lambda 表达式的支持是在\
    \ Java 8 中引入的，但你可以使用 retrolambda 库 (https://github.com/evant/gradle-retrolambda)\
    \ 在之前的 Java 版本中使用它们。\n\n## 命令式还是函数式？\n\n那么，为什么你应该选择函数式编程而不是命令式编程？函数式代码通常比对应的命令式代码更短、更容易理解。你可以用更少的代码完成相同的工作，每个程序员都知道代码越少\
    \ Bug 越少。\n\n在命令式编程中，实现抽象需要定义接口并将代码拆分为实现这些接口的组件；函数式语言让创建抽象变得更容易（只需想想 Lambda 表达式如何避免了创建带有实现的接口的必要）。\n\
    \n"
