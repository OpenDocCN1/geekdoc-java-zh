    \ observable，因此 observables 可能会交错出现。如果你需要 observables 不交错出现，则你必须使用 concatMap 操作符。\n\
    \n例如，假设你有一个整数列表作为输入，并想将其转换为格式为“Number x”的字符串序列，其中 x 是输入列表中的下一个整数。你可以如下结合 flatMap\
    \ 和 map：\n\n```java\nList<Integer> input = Arrays.asList(1, 2, 3, 4, 5);\nObservable.just(input)\n\
    .flatMap(new Func1<List<Integer>, Observable<Integer>>() {\n  @Override\n  public\
    \ Observable<Integer> call(List<Integer> item) {\n    return Observable.from(item);\n\
    \  }\n})\n.map(new Func1<Integer, String>()() {\n  @Override\n  public String\
