    \ is: Number 2\nnext item is: Number 3\nnext item is: Number 4\nnext item is:\
    \ Number 5\nsequence completed!\n\n# concatMap\n\nconcatMap 操作符（图 2-3）的行为类似于 flatMap，不同之处在于确保\
    \ observables 不是交错的，而是连接的，并保持它们的顺序。\n\n# zip\n\nzip 操作符（图 2-4）接受多个 observables\
    \ 作为输入，并通过指定的函数组合每次发射，并发射结果。\n\n![](img/2ab15486b46859b709ebbac39262fbfa_31_0.png)\n\
    \n图 2-4. zip 的大理图\n\n函数按严格顺序执行。如果有两个序列，zip 会等待第一个序列的第一个项目、第二个序列的第一个项目，对它们应用该函数，并发射结果。当最短的序列停止时它也会停止。\n\
