    \n在 `onCreate` 方法中订阅了一个定时器 observable；2 分钟后，TextView 将更新为消息“Timeout”。\n如果用户旋转屏幕会发生什么？在\
    \ 2 分钟通过之前 Activity 会被销毁并重建吗？\n当屏幕旋转时，Activity 会销毁并重建。这在你的情况下会导致两个问题：\n\n- observable\
    \ 将在 activity 旋转时继续执行，但当它完成时，它将尝试更新 TextView 的新实例。\n- observable 将保留对旧 Activity\
    \ 的引用，导致内存泄漏。\n\n这里的解决方案很简单：你必须根据生命周期进行取消订阅。例如，让我们保留订阅的引用，并在 Activity 销毁时取消它：\n\
    \n```java\nSubscription subscription = null;\n\n```\n\n```java\n@Override\nprotected\
    \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.activity_layout);\n    TextView textView = findViewById(R.id.text_view);\n\
    }\n\nsubscription = Observable.timer(2, TimeUnit.MINUTES)\n    .subscribeOn(Schedulers.newThread())\n\
    \    .observeOn(AndroidSchedulers.mainThread())\n    .subscribe(new Subscriber<Long>()\
    \ {\n    @Override\n    public void onCompleted() {\n```\n\n```java\n}\n@Override\n\
    public void onError(Throwable e) {\n}\n@Override\npublic void onNext(Long item)\
    \ {\n    textView.setText(\"Timeout!\");\n}\n}\n}\n}\n@Override\nprotected void\
    \ onDestroy() {\n    super.onDestroy();\n}\n```\n\n```java\nif (subscription !=\
    \ null && subscription.isSubscribed()) {\n    subscription.unsubscribe();\n}\n\
    ```\n\n你也可以创建一个 `CompositeSubscription` 对象并将所有的订阅添加到其中。然后你可以一次性取消它们的所有订阅：\n\n\
    ```java\nCompositeSubscription compositeSubscription = new CompositeSubscription();\n\
    ```\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
    \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_layout);\n\
    \    TextView textView = (TextView) findViewById(R.id.text_view);\n```\n\n```java\n\
    subscription = Observable.timer(2, TimeUnit.MINUTES)\n    .subscribeOn(Schedulers.newThread())\n\
    \    .observeOn(AndroidSchedulers.mainThread())\n    .subscribe(new Subscriber<Long>()\
    \ {\n```\n\n```java\n@Override\npublic void onCompleted() {\n}\n```\n\n```java\n\
    @Override\npublic void onError(Throwable e) {\n}\n```\n\n```java\n@Override\n\
    public void onNext(Long item) {\n    textView.setText(\"Timeout!\");\n}\n);\n\
    ```\n\n```java\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n\
    \    compositeSubscription.unsubscribe();\n    subscribe();\n}\n```\n\n请注意，一旦调用了\
    \ `CompositeSubscription.unsubscribe()`，该对象将变得不可用，因为它会自动取消之后之后添加的任何其他订阅。\n\nTrello\
    \ 开发了一个名为 RxLifecycle (https://github.com/trello/rxlifecycle) 的开源库，它简化了 Activity（或\
    \ Fragment）生命周期中的订阅/取消订阅。\n\n要将其包含在项目中，请向你的 app `build.gradle` 文件添加依赖项：\n\n```gradle\n\
    compile 'com.android.support:appcompat-compat-v7:24.1.1'\ncompile 'io.reactivex:rxjava:1.2.5'\n\
    compile 'com.jakewhartator:rxandroidbinding:0.4.0'\ncompile 'com.trello:rxlifecycle:0.7.0'\n\
    compile 'com.trello:rxlifecycle-android:0.7.0'\n```\n\n通过这个库，你可以使用 `compose()`\
    \ 操作符来指定何时从 Observable 订阅：\n\n```java\n.compose(RxLifecycle.bindUntilEvent(lifecycle,\
    \ ActivityEvent.DESTROY))\n.subscribe();\n```\n\n或者你也可以让库自动检测何时取消订阅：\n\n```java\n\
    .compose(RxLifecycle.bindUntil(lifecycle))\n.subscribe();\n```\n\n在后一种情况下，订阅是在生命周期中管理的，而不是订阅（例如，如果订阅发生在\
    \ Activity 的 `onCreate()` 方法中，则将在 `onStop()` 中发生）。使用 RxJava 进行 Android 开发是一个热点话题，涵盖了许多领域。其中库包括：\n\
