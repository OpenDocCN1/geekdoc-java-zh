    # Handling Backpressure During Emission: Buffering


    Another way to control backpressure is to collect items into buffers before notifying
    the subscriber. The subscriber''s onNext() method will not receive the single
    emitted item but a collection that contains the items collected in the buffer.


    To apply this technique, you can use the operators buffer() and window().


    # Buffer


    Observable.buffer() lets you collect items periodically at a specified interval
    of time.

    You choose to create buffers based on the number of items or on a time interval
    by passing a function that computes the necessary conditions to close each buffer
    (Figure 3-4). You can also specify an Observable that triggers the beginning of
    a buffer.


    ![](img/2ab15486b46859b709ebbac39262fbfa_61_0.png)


    Figure 3-4. The marble diagram of Observable.buffer()


    # Window


    Observable.window() is similar to buffer, but rather than emitting collections
    of items from the source Observable, it emits observables, and each one of these
    observables emits a subset of items from the source Observable and terminates
    with an onCompleted notification.


    You can choose to create "windows" based on a time interval (Figure 3-5), the
    number of items (Figure 3-6), or by passing a function that computes the necessary
    conditions to close each window.'
