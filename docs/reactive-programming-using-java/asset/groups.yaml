  mdcn: "\n\n## 第 2 章 可观测对象与观察者\n\n## 可观测对象（Observable）的定义\n\nObservable 是一个发射事件序列（或流）的对象。它代表了一个基于推送的集合，即在事件被创建时，就会推送到集合中。\n\
    \nObservable 发射的序列可以是空的、有限的或无限的。当序列是有限的时，在序列结束后会发射一个完成事件（complete event）。在发射过程中的任何时候（但结束后之后），都可能发射一个错误事件（error\
    \ event），这会停止发射并取消完成事件的发射。\n\n当序列为空时，只会发射完成事件，而不发射任何项。如果没有无限序列，则永远不会发射完成事件。\n\n\
    正如你稍后将看到的，发射可以被转换、过滤或与其他发射组合。\n\n## 观察者（Observer）的定义\n\nObserver 是一个订阅 Observable\
    \ 的对象。它监听并对 Observable 发射的任何项项序列做出反应。Observer 在等待新发射的项时不会被阻塞，因此在并发操作中，不会发生阻塞。当有新项被发射时，它会被唤醒。\n\
    \n这是响应式编程的核心原则之一，而不是一条一条地执行指令（始终等待指令完成）。Observable 提供了一种接收和转换数据的机制，而 Observer\
    \ 激活了这种机制，这一切都是以并发的方式完成的。\n\n下面的伪代码是 Observer 实现的方法示例，用于对 Observable 的项做出反应：\n\
    \n```\nonNext = { it -> doSomething };\n```\n\n在这里，定义了方法，但还没有调用它。要开始反应，你需要订阅 Observable：\n\
    \n```\nobservable.subscribe(onNext)\n```\n\n现在 Observer 正在监听项，并将对每个将要发射的新项做出反应。\n\
    \n让我们使用 Java API 用代码来编写这个示例：\n\n```java\npublic void subscribeObservable(Observable<T>\
    \ observer) {\n  observer.subscribe(nextItem -> {\n    // 当 Observer 发射一个项时被调用\n\
    \    // 通常你在这里处理 nextItem\n  });\n}\n```\n\n现在很清楚了，为了连接 observable 和 observer，你必须使用\
    \ `subscribe` 方法。\n\n## onNext, onCompleted, onError\n\nrx.Observer<T> 接口不仅定义了\
    \ `onNext(T)` 方法，还定义了以下方法：\n\n```java\npublic void subscribe(Observable<T> observable)\
    \ {\n    observable.subscribe(new Subscriber<T>() {\n        @Override\n     \
    \   public void onCompleted() {\n            // 当 Observable 停止发射项时调用\n      \
    \  }\n\n        @Override\n        public void onError(Throwable e) {\n      \
    \      // 当 Observable 在发射项时\n            // 抛出异常时调用\n        }\n\n        @Override\n\
    \        public void onNext(T nextItem) {\n            // 当 Observable 发射项时调用\n\
    \            // 通常你在这里处理 nextItem\n        }\n    });\n```\n\n等一下，为什么你在这里使用了 Rx.Subscriber<T>\
    \ 的实例？如果你查看 RxJava 文档，你会发现 `Subscriber<T>` 是一个实现了 `Observer<T>` 接口的对象，因此它可以作为\
    \ Observer 使用。我们使用 Subscriber 的原因是它还实现了 `Subscription` 接口，允许你检查是否已订阅（使用 `isSubscribed()`\
    \ 方法）并取消订阅（使用 `unsubscribe()` 方法）。\n\n为了简单起见，我使用 `Subscriber<T>` 而不是 `Observer<T>`，除非影响测试的可读性和理解。\n\
    从上一个示例中，注意 Observer 对三种类型的事件反应：\n\n- Observable 发射项：发生零次、一次或多次。如果序列正确完成，`onNext`\
    \ 方法被调用的次数与序列中项的数量相同。如果在某一点发生错误，`onNext` 方法将不再被调用。\n- 项的完成：只有当序列中的项都正确发射后，`onCompleted`\
    \ 方法才被调用。它只调用一次，且在最后一个项发射之后。如果你处理的是无限序列，这永远不会发生。\n- 错误可以在序列的任何时刻发生，序列将立即停止。在这种情况下，`onError`\
    \ 将被调用并传递 `Throwable` 对象。另外两个方法 `onNext` 和 `onCompleted` 将不会被调用。\n\nObservable\
    \ 可以通知 `onCompleted` 和 `onError` 方法，其中一个将是最后一个调用的。\n\n> 注意 如果你使用简写表达式 `observable.subscribe(nextItem)`，序列完成后完成后不会收到通知。更重要的是，如果发生错误，RxJava\
    \ 将抛出异常，因为找不到 `onError` 的实现，你的程序将会崩溃！\n\n通过 `subscribe()` 方法（称为订阅），你可以连接 Observable\
    \ 和 Observer，但如果你想断开连接呢？这个操作称为取消订阅，它看起来如下：\n\n```java\npublic void subscribeTo(Observable<T>\
    \ observable) {\n  Subscription subscription =\n  observable.subscribe(new Subscriber<>()\
    \ {\n    @Override\n    public void onCompleted() {\n      // 当 Observable 停止发射项时调用\n\
    \    }\n\n    @Override\n    public void onError(Throwable e) {\n      // 当 Observable\
    \ 在发射项时抛出异常时调用\n    }\n\n    @Override\n    public void onNext(T nextItem) {\n\
    \      // 当 Observable 发射项时调用\n    }\n  });\n}\n\n// 我们来看一个更具体的、简单的示例。创建一个从 1\
    \ 到 5 所有项的 Observable 并订阅它：\n\n```java\nObservable<Integer> observable =\n  Observable.from(new\
    \ Integer[] {1, 2, 3, 4, 5});\n\nobservable.subscribe(new Subscriber<Integer>()\
    \ {\n  @Override\n  public void onCompleted() {\n    System.out.println(\"Sequence\
    \ completed!\");\n  })\n\n  @Override\n  public void onError(Throwable e) {\n\
    \    System.err.println(\"Exception: \" + e.getMessage());\n  }\n\n  @Override\n\
    \  public void onNext(Integer integer) {\n    System.out.println(\"next item is:\
    \ \" + integer);\n  }\n};\n```\n\n预期输出是：\n\n- next item is: 1\n- next item is:\
    \ 2\n- next item is: 3\n- next item is: 4\n- next item is: 5\n\nSequence completed!\n\
    \n这是一个冷 Observable，因为它只有在订阅时才会开始发射项。observable 将生成包含五个项的序列，每个项代表一个整数对象（1 到 5），因此观察者的\
    \ `onNext` 方法会被调用五次。在序列结束时，会通知 `onCompleted` 方法。不会通知 `onError` 方法，因为这个序列没有产生任何错误或异常。\n\
    \n热 Observable 的例子是每次点击 UI 按钮都会发射事件的 observable。它不会在观察订阅时开始发射事件；即使没有 Subscriber\
    \ 订阅，也会发射事件。我将在专门介绍 Subjects 的部分讨论 observables。\n\n## 热观测对象与冷可观测对象\n\n在之前的示例中，我们假设\
    \ Observable 在观察订阅时开始发射项；它们被称为**冷观测对象**。\n\n另一方面，在连接之前就开始发射项的 Observable 称为**热观测对象**。\n\
    \n> 注意 还有一种可观测对象被称为**可连接观测对象**（connectable observable）。这种可观测对象在调用其 \"connect\"\
    \ 方法时开始发射项，无论是否有观察者订阅。\n\n## 创建可观测对象\n\n创建可观测对象简单的方法是使用 Rx 库中实现的工厂方法。你已经看到过如何使用\
    \ `Observable.from()` 方法创建 Observable，所以让我们看看其他可用方法。\n\n这不是创建可观测对象的唯一方法。\n\n##\
    \ Observable.just()\n\n`Observable.just()` 创建一个发射作为参数传入的对象或多个对象的 Observable：\n\
    \n```\nObservable.just(\"an item\")\n```\n\n"
