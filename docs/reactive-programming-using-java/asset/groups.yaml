    second sequence completed\");\n    }\n\n    @Override\n    public void onError(Throwable\
    \ e) {\n    }\n\n    @Override\n    public void onNext(Long item) {\n        System.out.println(\"\
    second sequence, \" + item);\n    }\n});\n```\n\nSubject 首先订阅 interval observable（它每秒发射一个递增值），然后每当从\
    \ interval observable 接收到项时，就会重新发射一个 Long 对象。这段代码的输出是：\n\nfirst sequence, item:\
    \ 0\nsecond sequence, item: 0\nfirst sequence, item: 1\nsecond sequence, item:\
