    \   public void onCompleted() {\n        System.out.println(\"first: sequence\
    \ completed\");\n    }\n\n    @Override\n    public void onError(Throwable e)\
    \ {\n    }\n\n    @Override\n    public void onNext(Integer item) {\n        System.out.println(\"\
    first: next item is \" + item);\n    }\n});\n\nsubject.onNext(1);\nsubject.onNext(2);\n\
    ```\n\n```java\n// subscribe the second Subscriber\nsubjectAsObservable.subscribe(new\
    \ Subscriber<Integer>()) {\n    @Override\n    public void onCompleted() {\n \
