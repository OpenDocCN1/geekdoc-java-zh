  - '[PAGE 11]


    In reactive programming, the value of x should be updated whenever the values
    of y or z

    change.


    So, if the initial values are y = 1 and z = 1, you''ll have


    x = y + z = 2.


    If (or or z) changes its value, this does not mean that x changes automatically,
    but you

    must implement a mechanism to update the values of x when values of y and z are
    changed.


    Functional reactive programming is a new programming paradigm; it was made

    popular Erik Muller (who created the Rx library for .NET when working at Microsoft)

    and it''s based on two concepts:


    +   - Code "reacts" to events.


    +   - Code handles values as they vary in time, propagating changes to

    every part of the code that uses those values.


    # ## Streams of Data


    The key to understand reactive programming is to think about it operating on a
    stream

    of data.


    But what do I mean by "stream of data"? I mean a sequence of events, where an

    event could be user input (like a tap on a button), a response from an API request
    (like a

    Facebook feed), data contained in a collection, or even a single variable.


    In reactive programming, there''s often a component that acts as the source, emitting

    a sequence of items (or a stream of data), and some other components that observe
    this

    flow of items and react to each emitted item (they "react" to item emission).


    # ## Observer Pattern


    The Observer pattern is a design pattern in which there are two kinds of objects:

    observers and subjects. a subject is an object that observes the changes of one
    or more

    subjects; a subject is an object that keeps a list of its observers and automatically
    notifies

    when it changes its state.


    The definition of the Observer pattern from the "Gang of Four" (Design

    Patterns: Elements of Reusable Object Software by Erik Gamma, Richard Helm,

    Ralph Johnson, and John Videsch, ISBN 978-0-201-63361-2) is


    > > Define a one-to-many dependency between objects so that when

    one object changes state


    This pattern is the core of reactive programming. It fits perfectly the concept
    of

    reactive programming by providing the structures to implement the produce/react

    mechanism.'
  - "[PAGE 12]\n\n# CHAPTER 1 REACTIVEX AND JAVA\n\nJava SDK implements the Observer\
    \ pattern with the class java.util.Observable and the interface java.util.Observer.\n\
    \nclass Subject extends java.util.Observable {\n\n```\npublic void doWorkAndNotify()\
    \ {\n    Object result = doWork();\n    notifyObservers(result);\n}\n```\n\nclass\
    \ MyObserver implements Observer {\n\n```\n@Override\npublic void update(Observable\
    \ obs, Object item) {\n    doSomethingWith(item);\n}\n```\n\nThe Subject class\
    \ extends java.util.Observable and is responsible for producing an object and\
    \ notifying the observer as soon as the item has been produced.\nMyObserver implements\
    \ Observer and is responsible for observing Subject and consuming every item that\
    \ Subject produces.\nPutting Subject and MyObserver together.\n\n```\nMyObserver\
    \ observer = new MyObserver();\nSubject subject = new Subject();\nsubject.addObserver(observer);\n\
    subject.doWorkAndNotify();\n```\n\nUnfortunately, this implementation reveals\
    \ itself to be too simple when you start to write more complex logic.\nYou'll\
    \ never use this implementation; instead you'll use the built-in RxJava implementation.\n\
    \n# What's ReactiveX?\n\nFrom http://reactive.io/ comes the following definition:\
    \ ReactiveX is a combination of the best ideas from Observer pattern, the Iterator\
    \ pattern, and functional programming.\nIt's a library that implements functional\
    \ reactive programming in many languages. It uses \"observables\" to represent\
    \ asynchronous data streams, and it abstracts all details related to threading,\
    \ concurrency, and synchronization. Thanks to ReactiveX, writing concurrent programs\
    \ becomes a lot easier because"
  - "[PAGE 13]\n\n+   - You don't have to deal with multithreading problems.\n\n+\
    \   - You can easily transform a data stream into another data stream (where the\
    \ data type can differ from the source stream's data type).\n\n+   - You can easily\
    \ combine different data streams (like merging two or more data streams into one\
    \ stream or concatenating streams).\n\n# # What's RxJava?\n\nReactiveX has been\
    \ implemented as a library for the most used programming languages: Java, JavaScript,\
    \ Cr, Scala, C++, Python, Groovy, JRuby, Kotlin, Swift, and more. (See the full\
    \ list at http://reactive.io/languages.html).\n\nRxJava is a library that implements\
    \ the concepts of ReactiveX in Java. As you will use in following chapters, you\
    \ can rewrite the imperative code that filters even numbers using RxJava:\n\n\
    List<Integer> input = Arrays.asList(1, 2, 3, 4, 5);\n\n```\nobservable.from(input)\n\
    \    .filter(new Func1() {\n        @Override\n        public Boolean call(Integer\
    \ x) {\n            return x % 2 == 0;\n        }\n    })\n```\n\nOr, using a\
    \ lambda expression:\n\n```\nobservable.from(input)\n    .filter(x -> x % 2 ==\
    \ 0);\n```\n\nThe resulting object (the instance of rx.Observable) will generate\
    \ a sequence of the even numbers contained in the input sequence: 2 and 4.\n\n\
    In RxJava\n\n+   - The producer can notify the consumer that there is no more\
    \ data available.\n\n+   - The producer can notify the consumer that an error\
    \ has occurred.\n\nNote The RxJava library provides a programming model that we\
    \ can work with events generated from UI or asynchronous calls in the same way\
    \ in which we operate with collections and streams in Java 8."
  - "[PAGE 14]\n\n# CHAPTER 1 REACTIVE AND RXJAVA\n\nThe RxJava library was created\
    \ at Netflix as a smarter alternative to Java Futures and callbacks. Both Futures\
    \ and callbacks are straightforward to use when there's just one level of asynchronous\
    \ execution, but they are hard to manage when they're nested. The following example\
    \ shows how the nested callbacks problem is handled in RxJava.\n\n# EXAMPLE: NESTED\
    \ API CALLS\n\nSuppose that you need to call a remote API to authenticate a user,\
    \ then another one to get the user's data, and another API to get a user's contacts.\
    \ Typically, you would have to nest API calls like this:\n\n```\nUser user = null;\n\
    serviceEndpoint.login(username, password, new CallbackAccessToken()) {\n  @Override\n\
    \  public void success(User user, Response response) {\n    // accessToken somewhere\n\
    \    serviceEndpoint.getUser(new Callback<User>()) {\n      @Override\n      public\
    \ void success(User userRepository, Response response) {\n        user = userRepository;\n\
    \        serviceEndpoint.getUserContact(user.getId(), new Callback<Contact>())\
    \ {\n          @Override\n          public void success(Contact contact, Response\
    \ response) {\n            user.setContact(contact);\n          }\n          @Override\n\
    \          public void failure(RetrofitError error) {\n            // handle error\
    \ here...\n          }\n        }\n      }\n    }\n  @Override\n  public void\
    \ failure(RetrofitError error) {\n    // handle error here...\n  }\n}\n```"
  - "[PAGE 15]\n\n```\n}\n@Override\npublic void failure(RetrofitError error) {\n\
    \    // handle error here...\n}\n));\n```\n\nWith RxJava, the nested callbacks\
    \ are replaced with more efficient, readable, and maintainable composed functions:\n\
    \n```\nserviceEndpoint.login(\n    .doNext(accessToken -> storeCredentials(accessToken))\n\
    \    .flatMap(accessToken -> serviceEndpoint.getUser())\n    .flatMap(user ->\
    \ serviceEndpoint.getUserContact(user.getId())))\n```\n\nAs you can see, this\
    \ piece of code has all the properties of functional programming, with the addition\
    \ of the reactive component (functions are executed as a reaction to the response\
    \ received from the login() method)."
  - "[PAGE 16]\n\n# CHAPTER 2\n\n# Observables and Observers\n\n# Introduction\n\n\
    In this chapter, you'll dive into the RxJava library. First, you'll learn how\
    \ to include RxJava in your Java project. Then, you will learn\n\n+   - About\
    \ the building blocks of RxJava (rx.Observable<T>, rx.Observer<T>, rx.Subscriber<T>)\n\
    - The type of events that can be emitted by rx.Observable<T> and received by rx.Observer<T>\n\
    - The operators that can be applied to observables\n\n# Adding RxJava to Your\
    \ Project\n\nThe RxJava library (https://github.com/Reactive/RxJava) can be included\
    \ by simply adding the corresponding dependency to your project (no other dependencies\
    \ are required). At the time of writing, the latest version is 1.1.10.\nYou include\
    \ it in a Maven project like so:\n\n```\n<dependency>\n  <groupId>io.reactive</groupId>\n\
    \  <artifactId>rxjava</artifactId>\n  <version>1.1.10</version>\n</dependency>\n\
    ```\n\nIf you're working with a gradle project, it looks like this:\ncompile 'io.reactive:rxjava:1.1.10'\n\
    \nRxJava supports all versions of JDK starting from Java 6. If you're working\
    \ with Java 8, you can take advantage of Java native support for lambda expressions;\
    \ otherwise, you can use lambda expression by adding retrolambda as a dependency\
    \ (https://github.com/evant/gradle-retrolambda)."
