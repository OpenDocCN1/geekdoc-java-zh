    # CHAPTER 4 SUBJECTS


    Are Subjects hot or cold observables? This example makes it easy to answer the
    question. Subjects are hot observables because they can produce items when no
    Observer is subscribed.


    Another interesting point is the usage of the Subject.asObservable() method. Subscribing
    to subject instead of asObservable will produce the same output, but the method
    Subject.asObservable() helps you by wrapping your Subject instance in an Observable
    instance. This means you can expose only the Observable interface to the subscribers
    and it also means that no one else can use the Subject instance to emit items
    or notify completed/error events.


    # BehaviorSubject


    BehaviorSubject<T> (Figure 4-2) is similar to PublishSubject, except that the
    subscriber will also receive the last item emitted before its subscription.


    ![](img/2ab15486b46859b709ebbac39262fbfa_69_0.png)


    Figure 4-2. The marble diagram for BehaviorSubject<T>


    Let''s take the previous example and change the PublishSubject instance to a BehaviorSubject
    instance:


    ```

    BehaviorSubject<Integer> subject = BehaviorSubject.create();

    Observable<Integer> subjectAsObservable =

    subject.asObservable();

    ```


