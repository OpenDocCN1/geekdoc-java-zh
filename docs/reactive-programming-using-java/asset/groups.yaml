    \ helps you by wrapping your Subject instance in an Observable instance. This\
    \ means you can expose only the Observable interface to the subscribers and it\
    \ also means that no one else can use the Subject instance to emit items or notify\
    \ completed/error events.\n\n## BehaviorSubject\n\nBehaviorSubject<T> (Figure\
    \ 4-2) is similar to PublishSubject, except that the subscriber will also receive\
    \ the last item emitted before its subscription.\n\n![](img/2ab15486b46859b709ebbac39262fbfa_69_0.png)\n\
    \nFigure 4-2. The marble diagram for BehaviorSubject<T>\n\nLet's take the previous\
    \ example and change the PublishSubject instance to a BehaviorSubject instance:\n\
