    \ (where the data type can differ from the source stream's data type).\n- You\
    \ can easily combine different data streams (like merging two or more data streams\
    \ into one stream or concatenating streams).\n\n# What's RxJava?\n\nReactiveX\
    \ has been implemented as a library for the most used programming languages: Java,\
    \ JavaScript, Kotlin, Scala, C++, Python, Groovy, JRuby, Kotlin, Swift, and more.\
    \ (See the full list at http://reactive.io/languages.html).\n\nRxJava is a library\
    \ for Java. It brings the power of ReactiveX to the Java ecosystem. It allows\
    \ you to compose asynchronous and event-based programs using observable operators.\n\
    \nRxJava is a library that allows you to handle asynchronous event streams in\
    \ a functional style. It provides a set of operators to transform, filter, and\
    \ combine data streams.\n\n```java\n// Example of RxJava\nObservable<String> source\
    \ = Observable.just(\"a\", \"b\", \"c\");\nsource.filter(item -> item.length()\
    \ > 1)\n      .map(item -> item.toUpperCase())\n      .subscribe(System.out::println);\n\
    ```\n"
  mdcn: "\n在响应式编程中，每当 y 或 z 的值发生变化时，x 的值都应该更新。\n\n所以，如果初始值为 y = 1 且 z = 1，你将得到\n\n\
    x = y + z = 2。\n\n如果 (y 或 z) 的值发生了变化，这并不意味着 x 会自动变化，你必须实现一种机制，在 y 和 z 的值改变时更新\
    \ x 的值。\n\n函数式响应式编程（Functional reactive programming）是一种新的编程范式；它由 Erik Muller 推广（他在微软工作期间创建了用于\
    \ .NET 的 Rx 库），并基于两个概念：\n\n- 代码对事件产生“反应”。\n- 代码处理随时间变化的值，并将更改传播到使用这些值的每个代码部分。\n\
    \n## 数据流 (Streams of Data)\n\n理解响应式编程的关键在于将其思考为在“数据流”上进行操作。\n\n但我说的“数据流”具体是指什么？我的指的是事件序列，其中事件可以是用户输入（如点击按钮）、来自\
    \ API 请求的响应（如 Facebook 馈送）、集合中包含的数据，甚至是单个变量。\n\n在响应式编程中，通常有一个组件作为源，发射一系列项（或数据流），以及另一些组件观察这些项的流并对每个发射的项做出反应（它们对项的发射产生“反应”）。\n\
    \n## 观察者模式 (Observer Pattern)\n\n观察者模式是一种设计模式，其中包含两种对象：观察者（observers）和主题（subjects）。主题是观察一个或多个其他主题变化的对象；主题是一个维护其观察者列表并在状态发生变化时自动通知它们的对象。\n\
    \n来自“四人机”（在《设计模式：可重用对象软件要素》，Design Patterns: Elements of Reusable Object Software，作者：Erik\
    \ Gamma, Richard Helm, Ralph Johnson, and John Videsch，ISBN 978-0-201-63361-2）对观察者模式的定义是：\n\
    \n> 定义对象之间的一对多的依赖关系，以便当一个对象的状态改变时。\n\n这种模式是响应式编程的核心。它通过提供实现产生/反应机制的结构，完美契合了响应式编程的概念。\n\
    \n# 第一章 REACTX 与 JAVA\n\nJava SDK 通过 `java.util.Observable` 类和 `java.util.Observer`\
    \ 接口实现了观察者模式。\n\nclass Subject extends java.util.Observable {\n\n```java\npublic\
    \ void doWorkAndNotify() {\n    Object result = doWork();\n    notifyObservers(result);\n\
    }\n```\n\nclass MyObserver implements Observer {\n\n```java\n@Override\npublic\
    \ void update(Observable obs, Object item) {\n    doSomethingWith(item);\n}\n\
    ```\n\n`Subject` 类继承自 `java.util.Observable`，负责产生对象并在项产生后立即通知观察者。`MyObserver`\
    \ 实现 `Observer`，负责观察 `Subject` 产生的每一个项。将 `Subject` 和 `MyObserver` 结合起来：\n\n```java\n\
    MyObserver observer = new MyObserver();\nSubject subject = new Subject();\nsubject.addObserver(observer);\n\
    subject.doWorkAndNotify();\n```\n\n遗憾的是，当你开始编写复杂的逻辑时，这种实现显得过于简单。你永远不会使用这种实现；而是使用内置的\
    \ RxJava 实现。\n\n# 什么是 ReactiveX？\n\n来自 http://reactive.io/ 的定义如下：ReactiveX 是观察者模式、迭代器模式和函数式编程优秀思想的结合。它是一个在许多语言中实现函数式响应式编程的库。它使用“可观测对象”（observables）表示异步数据流，并抽象了所有与线程、并发和同步相关的细节。得于\
    \ ReactiveX，编写并发程序变得简单得多，因为：\n\n- 你不需要处理线程问题。\n- 你可以轻松地将数据流转换为另一个数据流（数据类型可以与源流不同）。\n\
    - 你可以轻松地组合不同的数据流（例如将两个或多个数据流合并为一个数据流）。\n\n# 什么是 RxJava？\n\nReactiveX 已为最常用的编程语言实现了库：Java、JavaScript、Kotlin、Scala、C++、Python、Groovy、JRuby、Swift\
    \ 等。（完整列表请见 http://reactive.io/languages.html）。\n\nRxJava 是一个 Java 库。它将 ReactiveX\
    \ 的力量引入 Java 生态系统。它允许使用可观测操作符组合异步和基于事件的程序。\n\nRxJava 是一个允许你以函数式风格处理异步事件流的库。它提供了一组操作符来转换、过滤和组合数据流。\n\
    \n```java\n// RxJava 示例\nObservable<String> source = Observable.just(\"a\", \"\
    b\", \"c\");\nsource.filter(item -> item.length() > 1)\n      .map(item -> item.toUpperCase())\n\
    \      .subscribe(System.out::println);\n```\n"
