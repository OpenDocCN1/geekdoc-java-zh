    \n图 2-1 显示，当项目 1 的大理石发射时，项目 10 的大理石也会发射，因此转换在项目 1 射立即发生，在项目 2 射之前。当项目 2 射时，应用操作符并发射了项目\
    \ 20，依此类推。\n\n# flatMap\n\nflatMap 操作符（图 2-2）执行两种类型的操作：将发射的项目转换为 observables 的“map”（映射）操作，以及将这些\
    \ observables 转换为一个 observable 的“flatten”（展）操作。因此，你可以使用 flatMap 将输入 observable\
    \ 转换为任何其他 observable（换句话说，将输入流转换为不同的流）。\n\n![](img/2ab15486b46859b709ebbac39262fbfa_29_0.png)\n\
