  mdcn: "\n\n# 第 4 章 SUBJECT\n\nSubject 是热观察（hot observables）还是冷观察（cold observables）？这个例子很容易回答这个问题。Subject\
    \ 是热观察，因为在没有观察者（Observer）订阅时也能产生项。\n\n另一个有趣点是 `Subject.asObservable()` 方法的使用。订阅\
    \ subject 而不是 `asObservable()` 会产生相同的输出，但 `Subject.asObservable()` 方法通过将你的 Subject\
    \ 实例封装在 `Observable` 实例中来为你提供帮助。这意味着你可以只向订阅者暴露 `Observable` 接口，而且这意味着其他人无法使用该\
    \ Subject 实例来发射项或通知完成/错误事件。\n\n## BehaviorSubject\n\nBehaviorSubject<T>（图 4-2）与\
    \ `PublishSubject` 类似，区别在于订阅者还会接收在其订阅之前发射的最后一个项。\n\n![](img/2ab15486b46859b709ebbac39262fbfa_69_0.png)\n\
    \n图 4-2.BehaviorSubject<T> 的大理石图\n\n让我们采用之前的示例并将 `PublishSubject` 实例更改为 `BehaviorSubject`\
    \ 实例：\n\n```\nBehaviorSubject<Integer> subject = BehaviorSubject.create();\nObservable<Integer>\
    \ subjectAsObservable =\nsubject.asObservable();\n```\n\n```java\n// 订阅第一个 Subscriber\n\
    subjectAsObservable.subscribe(new Subscriber<Integer>()) {\n    @Override\n  \
    \  public void onCompleted() {\n        System.out.println(\"first: sequence completed\"\
    );\n    }\n    @Override\n    public void onError(Throwable e) {\n    }\n    @Override\n\
    \    public void onNext(Integer item) {\n        System.out.println(\"first: next\
    \ item is \" + item);\n    }\n}\nsubject.next(1);\nsubject.next(2);\n// 订阅第二个\
    \ Subscriber\nsubjectAsObservable.subscribe(new Subscriber<Integer>()) {\n   \
    \ @Override\n    public void onCompleted() {\n        System.out.println(\"second:\
    \ sequence completed\");\n    }\n    @Override\n    public void onError(Throwable\
    \ e) {\n    }\n    @Override\n    public void onNext(Integer item) {\n       \
    \ System.out.println(\"second: next item is \" + item);\n    }\n}\nsubject.next(3);\n\
    subject.next(4);\nsubject.next(5);\nsubject.onCompleted();\n```\n\n# 第 4 章 SUBJECT\n\
    \n此代码产生以下输出：\n\n```\nfirst: next item is 1\nfirst: next item is 2\nsecond: next\
    \ item is 2\nfirst: next item is 1\nsecond: next item is 3\nfirst: next item is\
    \ 4\nsecond: next item is 4\nfirst: next item is 5\nsecond: next item is 5\nfirst:\
    \ sequence completed\nsecond: sequence completed\n```\n\n在这里，订阅者从项 2 开始接收序列，而且\
    \ Java 还提供了静态工厂方法 `BehaviorSubject.create(T defaultValue)`；只要没有从源 Observable 接收到项，该方法返回的实例就会发射所提供的默认项。\n\
    \n```java\nBehaviorSubject<Integer> subject = \nBehaviorSubject.create(-1);\n\n\
    Observable<Integer> subjectAsObservable = \nsubject.asObservable();\n\n// 订阅第一个\
    \ Subscriber\nsubjectAsObservable.subscribe(new Subscriber<Integer>() {\n\n  \
    \  @Override\n    public void onCompleted() {\n        System.out.println(\"first:\
    \ sequence completed\");\n    }\n\n    @Override\n    public void onError(Throwable\
    \ e) {\n    }\n\n    @Override\n    public void onNext(Integer item) {\n     \
    \   System.out.println(\"first: next item is \" + item);\n    }\n});\n\nsubject.onNext(1);\n\
    subject.onNext(2);\n```\n\n```java\n// 订阅第二个 Subscriber\nsubjectAsObservable.subscribe(new\
    \ Subscriber<Integer>()) {\n    @Override\n    public void onCompleted() {\n \
    \       System.out.println(\"second: sequence completed\");\n    }\n\n    @Override\n\
    \    public void onError(Throwable e) {\n    }\n\n    @Override\n    public void\
    \ onNext(Integer item) {\n        System.out.println(\"second: next item is \"\
    \ + item);\n    }\n}\nsubject.onNext(3);\nsubject.onNext(4);\nsubject.onNext(5);\n\
    subject.onCompleted();\n```\n\n输出是\n\nfirst: next item is -1\nfirst: next item\
    \ is 1\nfirst: next item is 2\nsecond: next item is 2\nfirst: next item is 3\n\
    second: next item is 3\nfirst: next item is 4\nsecond: next item is 4\nfirst:\
    \ next item is 5\nsecond: next item is 5\nfirst: sequence completed\nsecond: sequence\
    \ completed\n\n如果你希望订阅者接收其订阅之前发射的所有项，而不仅仅是最后一个，怎么办？使用 `ReplaySubject`。\n\n## ReplaySubject\n\
    \nReplaySubject<T>（图 4-3）发射源 Observable 发出的所有项，无论观察者何时订阅，并保持发射项的缓冲区。\n\n# ReplaySubject\n\
    \n![](img/2ab15486b46859b709ebbac39262fbfa_73_0.png)\n\n图 4-3.ReplaySubject<T>\
    \ 的大理石图\n\n此缓冲区由 `ArrayList` 支持，默认情况下它的初始容量为 16 且没有上限。\n\nRxJava 提供了其他静态工厂方法来创建不同行为的\
    \ `ReplaySubject` 实例：\n\n- `ReplaySubject.create(int capacity)` 创建具有指定容量的 `ReplaySubject`\
    \ 实例。\n- `ReplaySubject.createWithSize(int size)` 创建具有指定大小的 `ReplaySubject` 实例：当缓冲区满时，旧项会被丢弃。\n\
    - `ReplaySubject.createTime(long time, TimeUnit scheduler)` 创建一个时间限制的 `ReplaySubject`。\n\
    - `ReplaySubject.createAndTimeSize(long time, TimeUnit scheduler)` 允许你创建一个既受时间限制又受大小限制的\
    \ `ReplaySubject`。\n\n## AsyncSubject\n\nAsyncSubject<T>（图 4-4）是 Subject 的实现，它在源\
    \ Observable 完成后只发射最后一个项，或者如果源 Observable 没有发射任何项，则通知错误事件。\n\n# AsyncSubject\n\
    \n![](img/2ab15486b46859b709ebbac39262fbfa_74_0.png)\n\n**图 4-4.**AsyncSubject<T>\
    \ 的大理石图\n\n让我们更改之前的示例使用 `AsyncSubject` 代替 `PublishSubject`：\n\n```java\nAsyncSubject<Integer>\
    \ subject = AsyncSubject.create();\n\nObservable<Integer> subjectAsObservable\
    \ =\nsubject.asObservable();\n\n// 订阅第一个 Subscriber\nsubjectAsObservable.subscribe(new\
    \ Subscriber<Integer>()) {\n    @Override\n    public void onCompleted() {\n \
    \       System.out.println(\"first: sequence completed\");\n    }\n    @Override\n\
    \    public void onError(Throwable e) {\n    }\n    @Override\n    public void\
    \ onNext(Integer item) {\n        System.out.println(\"first: next item is \"\
    \ + item);\n    }\n}\nsubject.onNext(1);\nsubject.onNext(2);\n\n// 订阅第二个 Subscriber\n\
    subjectAsObservable.subscribe(new Subscriber<Integer>()) {\n    @Override\n  \
    \  public void onCompleted() {\n        System.out.println(\"second: sequence\
    \ completed\");\n    }\n    @Override\n    public void onError(Throwable e) {\n\
    \    }\n    @Override\n    public void onNext(Integer item) {\n        System.out.println(\"\
    second: next item is \" + item);\n    }\n}\nsubject.onNext(3);\nsubject.onNext(4);\n\
    subject.onNext(5);\nsubject.onCompleted();\n```\n\n此代码产生以下输出：\n\nfirst: next item\
    \ is 5\nfirst: sequence completed\nsecond: next item is 5\nsecond: sequence completed\n\
    \n## 什么时候应该使用 Subject？\n\n关于 Subject 的用法存在着持续的争议。RxJava 之父之一 Erik Meijer 认为它们是\
    \ Rx 世界的可变变量，在大多数情况下你不需要它们。通常，使用 `Create` 或其他操作符的方案允许你在不添加额外状态的情况下接线后续操作。换句话，尽量减少订阅者持有的对象数量是一个良好的实践，你只需要进行透传。\n\
    \n# 示例：ArrayList 的响应式版本\n\n下面的示例展示了如何创建一个 ArrayList 的响应式版本。ArrayList 的实现暴露了两个额外的方法，以便在添加或删除项时获取通知：\n\
    \n```java\nclass ReactiveArrayList<T> extends ArrayList<T> {\n\n    private PublishSubject<T>\
    \ addSubject =\n        PublishSubject.create();\n    private PublishSubject<Object>\
    \ removeSubject =\n        PublishSubject.create();\n\n    @Override\n    public\
