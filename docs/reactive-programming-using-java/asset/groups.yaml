  mdcn: "\n\n# 在发射期间处理背压：缓冲（Buffering）\n\n另一种控制背压的方法是在通知订阅者之前将项收集到缓冲区中。订阅者的 `onNext()`\
    \ 方法将不会接收单个发射的项，而是接收一个包含缓冲区中收集的项的集合。\n\n要应用此技术，你可以使用 `buffer()` 和 `window()` 操作符。\n\
    \n## Buffer\n\nObservable.buffer() 允许你按照指定的时间间隔定期收集项。\n你可以通过传递一个计算关闭每个缓冲区所需条件的函数（图\
    \ 3-4），根据项的数量或时间间隔来选择创建缓冲区。你也可以指定一个触发缓冲区开始的 Observable。\n\n![](img/2ab15486b46859b709ebbac39262fbfa_61_0.png)\n\
    \n图 3-4。Observable.buffer() 的大理石图\n\n# Window\n\nObservable.window() 与 buffer\
    \ 类似，但它不是从源 Observable 发射项的集合，而是发射 Observable；其中每一个 Observable 都会发射源 Observable\
    \ 的项子集，并以 `onCompleted` 通知结束。\n\n你可以根据时间间隔（图 3-5）、项的数量（图 3-6）或通过传递一个计算关闭每个窗口所需条件的函数来创建“窗口”。\n\
    \n# 第 3 章 订阅周期\n\n![](img/2ab15486b46859b709ebbac39262fbfa_62_0.png)\n\n图 3-5。基于时间间隔的\
    \ Observable, window() 大理石图\n\n![](img/2ab15486b46859b709ebbac39262fbfa_62_1.png)\n\
    \n图 3-6。基于项数量的 Observable, window() 大理石图\n\n注意：如果发生错误，两个操作符都会通知 `onError` 方法并停止构建当前的缓冲区或窗口。未完成的缓冲区/窗口中的项将不会转发给订阅者。\n\
    \n# 在订阅者内部处理背压\n\n在订阅者内部，你可以要求 observable 慢发射速度。因此，在上面的 zip 示例中，你可以要求 B缓慢发射项，而不是应用节流（throttling）操作符。\n\
    \n在订阅者的 `start()` 方法中，你必须调用 `Subscriber.request(n)`，其中 `n` 是一个整数，代表在下一次 `request(n)`\
    \ 之前你想让 Observable 发射的最大项数。然后在 `next(n)` 中消耗项后，必须再次调用 `request()` 来告诉 observable\
    \ 继续发射后续项。\n\n在接下来的示例中，你设置了 `n=1`，因此你可以在下一个项发射之前消耗每个项：\n\n```\nobservable.subscribe(new\
    \ Subscriber<T>() {\n    @Override\n    public void start() {\n        request(1);\n\
    \    }\n\n    @Override\n    public void onCompleted() {\n    }\n\n    @Override\n\
    \    public void onError(Throwable e) {\n    }\n\n    @Override\n    public void\
    \ onNext(T item) {\n        consume(item)\n        request(1);\n    }\n});\n```\n\
    \n在这里，你在 `start()` 和 `onNext()` 中调用了 `request()` 方法，且使用了相同的参数 `1`，因为你假设在下一个项发射之前只能消耗一个项，但这些值是独立的，可以根据用例进行调整。\n\
    \n如果你省略了 `request()` 调用，observable 将像往一样发射项，而不会降低发射速度；调用 `request(0)` 可以实现相同的效果。\n\
    \n# 第 4 章\n\n# Subjects（主项）\n\n在之前的章节中，你学习了 `Observable<T>`、`Observer<T>` 和 `Subscriber<T>`\
    \ 以及它们在 RxJava 响应式编程中的作用：Observable 对象发射事件序列，Subscriber 对象充当观察者，对 Observable 发出的每个事件做出反应。\n\
    \nRxJava 库提供了一个既是 Observable 又是 Observer 的代理；它被称为 `Subject<T, R>`，其中 `T` 是输入值的类型，`R`\
    \ 是输出值的类型。Subject 可以：\n\n- 订阅一个或多个 Observables（作为 Subscriber）\n- 通过重新发射它观察到的项来透传这些项\n\
    - 发射新项\n\n让我们看看 Subject 如何作为 Observable 使用（PublishSubject 将稍后介绍）：\n\n```\nSubject<String,\
