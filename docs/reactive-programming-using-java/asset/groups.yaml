    \n## Other Operators\n\nThere are many other operators available to transform,\
    \ filter, or combine observables.\n\n### Operators for Transforming Observables\n\
    \n- buffer: Periodically gathers items from an Observable into bundles and emits\
    \ these bundles rather than emitting the items at a time.\n- groupby: Divides\
    \ an Observable into a set of observables that each emit a different group of\
    \ items from the original Observable, organized by key.\n- window: Periodically\
    \ subdivides items from an Observable into Observable windows and emits these\
    \ windows rather than emitting the items at a time.\n\n### Operators for Filtering\
    \ Observables\n\n- debounce: Only emits an item from an Observable if a particular\
    \ timespan has passed without emitting another item.\n- elementAt: Emits only\
    \ item n emitted by an Observable.\n- ignoreElements: Does not emit any items\
    \ from an Observable but mirrors its termination notification.\n- sample: Emits\
    \ the most recent item emitted by an Observable within periodic time intervals.\n\
    - skip: Suppresses the first n items emitted by an Observable.\n- skipLast: Suppresses\
    \ the last n items emitted by an Observable.\n- takeLast: Emits only the last\
    \ n items emitted by an Observable.\n\n### Operators for Combining Observables\n\
    \n- and/Then: Combines items emitted by two or more observables by means of pattern\
    \ and plan intermediaries; these operators are not part of the RxJava library\
    \ but can be found at https://github.com/reactivex/RxJavaJoins\n- combineLatest:\
    \ When an item is emitted by either of two observables it combines the latest\
    \ item emitted by each via a specified function and emits items based on the results\
    \ of this function.\n- join: Combines items emitted by two Observables whenever\
    \ an item from one Observable is emitted during a time window defined according\
    \ to an item emitted by the other Observable.\n- merge: Combines multiple Observables\
    \ into one by merging their emissions.\n- switchNext: Converts an Observable that\
    \ emits Observables into a single Observable that emits the items emitted by the\
    \ most-recently-emitted of those Observables.\n"
