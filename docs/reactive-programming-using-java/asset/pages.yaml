    \ data);\nababstract Observable<T> doNetworkCall();\nababstract void persistOnChange(T\
    \ response);\nababstract T readFromDisk();\nababstract void deleteFromDisk();\n\
    ```\n\nLet's break down this:\n\n+   - The main idea is to use the Observable.concat()\
    \ operator to concatenate three operations: getting data from memory, getting\
    \ data from the disk, and getting data from the network, in this exact order.\n\
    - Then you apply the first() operator with a filter that out data that is not\
    \ valid (i.e. it's not null or it's not too old). If the memory returns invalid\
    \ data, it will be forwarded to the subscriber and no data will be read from the\
    \ disk or the network. If the memory returns valid data, the data will be read\
    \ from the disk, checking if it's valid, and so on.\n- If some error occurs (for\
    \ example, no network connection or server unreachable), you fall back to disk\
    \ cache. This is done with the help of onError which makes the sourceObservable\
    \ emit items from the given Observable(fallbackToCache()) in case of an error.\n\
    - The fromNetwork() Observable retrieves data from the network and uses the next\
    \ operator to cache data on disk and in memory when the subscriber's next() method\
    \ is notified. Remember that fromNetwork() is called only if memory and the disk\
    \ contain invalid data."
