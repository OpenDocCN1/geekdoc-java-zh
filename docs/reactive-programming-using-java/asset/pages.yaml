    +   - next item is: 1

    - next item is: 2

    - retry #1

    - next item is: 1

    - next item is: 2

    - retry #2

    - next item is: 1

    - next item is: 2

    - retry #3

    - next item is: 1

    - next item is: 2

    - sequence completed!


    # Schedulers


    By default the chain of operations of an observable is executed in the same thread
    onnwhich the subscribe method is called. You can change this behavior using two
    operators:


    +   - Observable.subscribe(...) lets you specify a scheduler on

    which observable operates.

    - Observable.observeOn(...) lets you specify a scheduler on

    which observers will be notified.


    This means you can use a thread for the executions of all the chains of operations

    a a different thread to receive the execution of next(), onCompleted(), and onError()

    notifications. This is often used when your observable executes I/O operations
    (like

    network requests or reading/writing on):


    ```

    myNetworkObservable()

    .subscribe(background thread)

    .observeOn(ui thread)

    .subscribe(...)

    ```


    The two operators can be called from any point in the chain of operators, but
    their

    behavior is different:


    +   - subscribeOn() changes the thread on which the observable

    operates, regardless of where in the chain it is applied.

    - observeOn() changes the thread that Observable will use, starting

    from the point at which it is applied.


    Usually you don''t have to create or specify a thread directly; instead, you can
    choose

    among the schedulers that are built in the RxJava library:'
