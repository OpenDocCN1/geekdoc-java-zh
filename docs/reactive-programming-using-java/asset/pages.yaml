  md: "```\n}\n@Override\npublic void failure(RetrofitError error) {\n    // handle\
    \ error here...\n}\n));\n```\n\nWith RxJava, the nested callbacks are replaced\
    \ with more efficient, readable, and maintainable composed functions:\n\n```\n\
    serviceEndpoint.login(\n    .doNext(accessToken -> storeCredentials(accessToken))\n\
