  md: "```\npublic void onNext(String item) {\n    System.out.println(\"first: next\
    \ item is \" + item);\n}\n));\n```\n\n```\nobservable.subscribe(new Subscriber<String>()\
    \ {\n    @Override\n    public void onCompleted() {\n        System.out.println(\"\
    second: sequence completed\");\n    }\n    @Override\n    public void onError(Throwable\
    \ e) {\n}\n    @Override\n    public void onNext(String item) {\n        System.out.println(\"\
    second: next item is \" + item);\n    }\n});\n```\n\nIf you run this code, the\
    \ output is... nothing! This is because you are missing the call to the connect()\
    \ method:\n\n```\nobservable.connect();\n```\n\nBy adding this line, the observable\
    \ starts emitting items and the output becomes\n\n+   first: next item is 0\n\
    second: next item is 0\nfirst: next item is 1\nsecond: next item is 1\nfirst:\
    \ next item is 2\nsecond: next item is 2\nfirst: next item is 3\nsecond: next\
    \ item is 3\nfirst: next item is 4\nsecond: next item is 4\nfirst: sequence completed\n\
    second: sequence completed\n\nAs you can see, every event generated by the observable\
    \ is propagated to both subscribers, preserving the order of subscription (the\
    \ first subscriber is notified for each event)."
