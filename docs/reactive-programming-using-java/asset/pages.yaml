- pgno: 12
  md: "# CHAPTER 1 REACTIVEX AND JAVA\n\nJava SDK implements the Observer pattern\
    \ with the class java.util.Observable and the interface java.util.Observer.\n\n\
    class Subject extends java.util.Observable {\n\n```\npublic void doWorkAndNotify()\
    \ {\n    Object result = doWork();\n    notifyObservers(result);\n}\n```\n\nclass\
    \ MyObserver implements Observer {\n\n```\n@Override\npublic void update(Observable\
    \ obs, Object item) {\n    doSomethingWith(item);\n}\n```\n\nThe Subject class\
    \ extends java.util.Observable and is responsible for producing an object and\
    \ notifying the observer as soon as the item has been produced.\nMyObserver implements\
    \ Observer and is responsible for observing Subject and consuming every item that\
    \ Subject produces.\nPutting Subject and MyObserver together.\n\n```\nMyObserver\
    \ observer = new MyObserver();\nSubject subject = new Subject();\nsubject.addObserver(observer);\n\
    subject.doWorkAndNotify();\n```\n\nUnfortunately, this implementation reveals\
    \ itself to be too simple when you start to write more complex logic.\nYou'll\
    \ never use this implementation; instead you'll use the built-in RxJava implementation.\n\
    \n# What's ReactiveX?\n\nFrom http://reactive.io/ comes the following definition:\
    \ ReactiveX is a combination of the best ideas from Observer pattern, the Iterator\
    \ pattern, and functional programming.\nIt's a library that implements functional\
    \ reactive programming in many languages. It uses \"observables\" to represent\
    \ asynchronous data streams, and it abstracts all details related to threading,\
    \ concurrency, and synchronization. Thanks to ReactiveX, writing concurrent programs\
    \ becomes a lot easier because"
