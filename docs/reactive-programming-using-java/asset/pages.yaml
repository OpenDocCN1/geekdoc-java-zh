- pgno: 42
  md: '# CHAPTER 2 OBSERVABLES AND OBSERVERS


    +   - elementAt: Emits only item n emitted by an Observable.

    - ignoreElements: Does not emit any items from an Observable but mirrors its termination
    notification.

    - sample: Emits the most recent item emitted by an Observable within periodic
    time intervals.

    - skip: Suppresses the first n items emitted by an Observable.

    - skipLast: Suppresses the last n items emitted by an Observable.

    - takeLast: Emits only the last n items emitted by an Observable.


    # Operators for Combining Observables


    +   - And/Then: Combines items emitted by two or more observables by means of
    pattern and plan intermediaries; these operators are not part of the RxJava library
    but can be found at https://github.com/reactivex/RxJavaJoins

    - combineLatest: When an item is emitted by either of two observables it combines
    the latest item emitted by each via a specified function and emits items based
    on the results of this function.

    - join: Combines items emitted by two Observables whenever an item from one Observable
    is emitted during a time window defined according to an item emitted by the other
    Observable.

    - merge: Combines multiple Observables into one by merging their emissions.

    - switchNext: Converts an Observable that emits Observables into a single Observable
    that emits the items emitted by the most-recently-emitted of those Observables.


    # EXAMPLE: GENERATE A SEQUENCE OF ODD INTEGERS


    To create a sequence of odd numbers, you need to generate a sequence of integers
    and then filter the emitted items, removing even integers.


    You start with a finite sequence of integers, and this sequence can be created
    using just or range.


    Then you apply the filter operator, passing a function that returns true if the
    emitted item is odd.'
