  md: "# CHAPTER 5 NETWORKING WITH RXJAVA AND RETROFIT\n\n# Retrofit's Built-in Support\
    \ for RxJava\n\nRetrofit is a library that provides a type-safe HTTP client for\
    \ Java (and Android). The great point about Retrofit is that you just have to\
    \ define an interface that will act as a proxy for the HTTP API, and the library\
    \ will automatically generate the implementation of this interface for you.\n\n\
    All examples are based on version 2.1.0 of Retrofit. It supports Java 7 and 8,\
    \ but not Java 6.\n\n# Setting Up Retrofit in Your Java Project\n\nThe setup is\
    \ straightforward. If you're using maven, just add the following dependency declaration:\n\
    \n```\n<dependency>\n  <groupId>com.squareup.retrofit2</groupId>\n  <artifactId>retrofit</artifactId>\n\
    \  <version>2.1.0</version>\n</dependency>\n```\n\nIf you're using gradle:\n\n\
    ```\ncompile 'com.squareup.retrofit2:retrofit:2.1.0'\n```\n\nAlternatively, you\
    \ can download the jar from the web site.\n\n# Creating a Retrofit Service\n\n\
    Let's consider the APIs that are provided by GitHub (https://developer.github.com/v3/).\
    \ GitHub provides many APIs to access user's information, repositories, and gists,\
    \ but for now let's just consider the API to retrieve a user's list of public\
    \ repositories.\n\nFrom the GitHub API documentation, the URL of this API is\n\
    \n```\nhttps://api.github.com/users/{user}/repos\n```\n\nwhere [user] is the name\
    \ of the GitHub user.\n\nA Retrofit interface that maps the GitHub API will look\
    \ like this:\n\n```\nimport java.util.List;\nimport retrofit2.http.GET;\nimport\
    \ retrofit2.http.Path;\nimport rx.Observable.Observable;\n\npublic interface GitHubService\
    \ {\n  @GET(\"users/{user}/repos\")\n  Observable<List<Repo>> listRepos(@Path(\"\
    user\") String user);\n}\n```\n\n80"
