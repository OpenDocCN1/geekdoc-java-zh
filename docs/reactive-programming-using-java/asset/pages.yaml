  md: "# CHAPTER 2 | OBSERVABLES AND OBSERVERS\n\nObservable.interval(long, TimeUnit)\
    \ does exactly this: it creates an Observable that emits a sequence of integers\
    \ starting from 0 that are spaced by a given time interval.\nThe first argument\
    \ is the amount of time, and the second argument defines the time unit.\nThe following\
    \ observable emits an item every 1 second:\n\n```\nObservable.interval(1, TimeUnit.SECONDS)\n\
    ```\n\nThe sequence is an infinite sequence, with no natural end, so onCompleted\
    \ will never be notified. The sequence stops only when no more observers are connected\
    \ (subscribed) to the observable.\n\n# Observable.timer()\n\nObservable.timer(long,\
    \ TimeUnit) creates an Observable that emits just one item after a given delay.\
    \ It can be useful when combined with other observables to introduce a delay before\
    \ the beginning of another observable's sequence, as you will see later.\n\n#\
