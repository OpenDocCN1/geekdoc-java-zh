  md: "# CHAPTER 2\n\n# Observables and Observers\n\n# Introduction\n\nIn this chapter,\
    \ you'll dive into the RxJava library. First, you'll learn how to include RxJava\
    \ in your Java project. Then, you will learn\n\n+   - About the building blocks\
    \ of RxJava (rx.Observable<T>, rx.Observer<T>, rx.Subscriber<T>)\n- The type of\
    \ events that can be emitted by rx.Observable<T> and received by rx.Observer<T>\n\
    - The operators that can be applied to observables\n\n# Adding RxJava to Your\
    \ Project\n\nThe RxJava library (https://github.com/Reactive/RxJava) can be included\
    \ by simply adding the corresponding dependency to your project (no other dependencies\
    \ are required). At the time of writing, the latest version is 1.1.10.\nYou include\
