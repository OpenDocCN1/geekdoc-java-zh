    # Other Operators


    There are many other operators available to transform, filter, or combine observables.


    # Operators for Transforming Observables


    +   buffer: Periodically gathers items from an Observable into bundles and emits
    these bundles rather than emitting the items at a time.

    groupby: Divides an Observable into a set of observables that each emit a different
    group of items from the original Observable, organized by key.

    window: Periodically subdivides items from an Observable into Observable windows
    and emits these windows rather than emitting the items at a time.


    # Operators for Filtering Observables


    +   debounce: Only emits an item from an Observable if a particular timespan has
    passed without emitting another item.'
