    \ For input string: \"a\"\n\nIf you want to retry one more time after 5 seconds,\
    \ you can use retryWhen():\n\n```\n.retryWhen(new Func<Observable<? extends Throwable>,\
    \ Observable<? extends Long>>()() {\n  @Override\n  public Observable<? extends\
    \ Long> call(Observable<? extends Throwable> observable) {\n    return Observable.timer(5,\
    \ TimeUnit.SECONDS);\n  }\n})\n```\n\nAfter the specified timed out (5 seconds\
    \ in this example), the sequence will be retried. If an error occurs during the\
    \ retry, the error event will not be notified. Instead the complete event will\
