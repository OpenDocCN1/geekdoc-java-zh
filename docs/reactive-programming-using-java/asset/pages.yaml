  md: '# ReplaySubject


    ![](img/2ab15486b46859b709ebbac39262fbfa_73_0.png)


    Figure 4-3. The marble diagram for ReplaySubject<T>


    This buffer is backed up by an ArrayList, and by default it has an initial capacity
    of 16 and no upper bounds.


    RxJava provides other static factory methods to create an instance of ReplaySubject
    with different behaviors:


    +   * ReplaySubject.create(int capacity) creates an instance of ReplaySubject
    with the specified initial capacity.

    * ReplaySubject.createWithSize(int size) creates an instance that will keep a
    buffer with the specified size: when the buffer is full, older items are discarded.

    * ReplaySubject.createTime(long time, TimeUnit unit, Scheduler scheduler) creates
    a time-bounded ReplaySubject.

    * ReplaySubject.createTimeAndTimeSize(long time, TimeUnit unit, Scheduler scheduler)
    lets you create a ReplaySubject that is both time-bounded and size-bounded.


    # AsyncSubject


    AsyncSubject<T> (Figure 4-4) is an implementation of Subject that


    +   * Emits only the last emitted item from the source observable after that observable
    completes.'
