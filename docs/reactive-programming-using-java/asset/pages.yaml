  md: "# CHAPTER 4 ## SUBJECTS\n\nitem added: 4\nitem added: 5\nitem added: 6\nitem\
    \ removed: 5\n\n**Note** Subjects are not thread-safe by default. They do not\
    \ perform any synchronization across threads, you must not call the onNext()/onCompleted()/onError()\
    \ methods from multiple threads, as this could lead to non-serialized calls, which\
    \ violates the Observable contract and creates an ambiguity in the resulting Subject.\n\
    \nTo make the Subject thread-safe, convert it into a SerializedSubject<T,R> (a\
    \ subclass of Subject<T,R>) with code like the following:\n\n```\nnewSerializedSubject(mySubject);\n\
    ```\n\n# # Connectable Observables\n\nConnectable Observables are another alternative\
    \ to the usage of Subjects. A ConnectableObservable<T> behaves like an Observable,\
    \ but it begins emitting items only when its connect() method is called.\n\n```\n\
    ConnectableObservable<String> observable =\nObservable.range(0, 5)\n.map(new Func<Integer,\
    \ String>()() {\n    @Override\n    public String call(Integer t) {\n        return\
    \ String.valueOf(t);\n    }\n}).publish();\nbservable.subscribe(new Subscriber<String>()()\
    \ {\n```\n\n```\n@Override\npublic void onCompleted() {\n    System.out.println(\"\
    first: sequence completed\");\n}\n\n@Override\npublic void onError(Throwable e)\
    \ {\n}\n```\n\n76"
