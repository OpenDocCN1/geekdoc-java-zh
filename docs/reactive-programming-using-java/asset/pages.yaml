- pgno: 17
  md: "# CHAPTER 2 OBSERVABLES AND OBSERVERS\n\n# Definition of Observable\n\nAn observable\
    \ is an object that emits a sequence (or stream) of events. It represents a push-based\
    \ collection, which is a collection in which events are pushed when they are created.\n\
    \nAn observable emits a sequence that can be empty, finite, or infinite. When\
    \ the sequence is finite, a complete event is emitted after the end of the sequence.\
    \ At any time during the emission (but not after the end of) an error event can\
    \ be emitted, stopping the emission and cancelling the emission of the complete\
    \ event.\n\nWhen the sequence is empty, only the complete event is emitted, without\
    \ emitting any items. Without an infinite sequence, the complete event is never\
    \ emitted.\n\nAs you'll see later, the emission can be transformed, filtered,\
    \ or combined with other emissions.\n\n# Definition of Observer\n\nAn Observer\
    \ is an object that subscribes to an Observable. It listens and reacts to whatever\
    \ sequence of items is emitted by the Observable. The Observer is not blocked\
    \ while waiting for new emitted items, so in concurrent operations, no blocking\
    \ occurs. It wakes up when a new item is emitted.\n\nThis is one of the core principles\
    \ of reactive programming instead of executing instructions one at a time (always\
    \ waiting for the instruction to be completed), the observable provides a mechanism\
    \ to receive and transform data, and the Observer activates this mechanism, all\
    \ in a concurrent way.\n\nThe following pseudocode is an example of the method\
    \ that the Observer implements that reacts to the Observable's items:\n\n```\n\
    onNext = { it -> doSomething };\n```\n\nHere, the method is defined, but not invoked.\
    \ To start reacting, you need to subscribe to the Observable:\n\n```\nobservable.subscribe(onNext)\n\
    ```\n\nNow the Observer is listening for items and will react to every new item\
    \ that will be emitted.\n\nLet's write this example in code using Java APIs:\n\
    \n```\npublic void subscribeObservable(Observable<T> observer) {\n  observer.subscribe(nextItem\
    \ -> {\n    // invoked when Observer emits an item\n    // usually you will consume\
    \ the nextItem here\n  });\n}\n```\n\nNow it's clear that in order to connect\
    \ an observable with an observer, you must use the subscribe method."
  merge: -1
  img_proc: true
- pgno: 18
  md: "# onNext, onCompleted, onError\n\nThe rx.Observer<T> interface does not define\
    \ only the onNext(T) method, but also the following methods:\n\n```\npublic void\
    \ subscribe(Observable<T> observable) {\n    observable.subscribe(new Subscriber<T>()\
    \ {\n        @Override\n        public void onCompleted() {\n            // invoked\
    \ when Observable stops emitting items\n        }\n\n        @Override\n     \
    \   public void onError(Throwable e) {\n            // invoked when Observable\
    \ throws an exception\n            // while emitting items\n        }\n\n    \
    \    @Override\n        public void onNext(T nextItem) {\n            // invoked\
    \ when Observable emits an item\n            // usually you will consume the nextItem\
    \ here\n        }\n    });\n```\n\nBut wait, why are you using an instance of\
    \ Rx.Subscriber<T> here? If you take a look at the RxJava documentation, you will\
    \ see that Subscriber<T> is an object that implements the Observer<T> interface,\
    \ so it's legal to use it as an Observer. The reason why we use Subscriber is\
    \ it also implements Subscription interface, which allows you to check if it is\
    \ unsubscribed (using the isSubscribed() method) and to unsubscribe it (with the\
