  img_proc: true
- pgno: 46
  md: "# CHAPTER 3 SUBSCRIPTION LIFECYCLE\n\nThe observable itself does not throw\
    \ the exception; it notifies the subscriber calling the onError() method. If the\
    \ observable fails when calling the onError() method (i.e. an exception is thrown\
    \ when calling onError()), the onError() method won't be called anymore and another\
    \ exception will be thrown.\n\nThere are some exceptions that are not handled\
    \ as error events but they are thrown, causing JVM to stop:\n\n+   - rx.exceptions.OnErrorImplementedException\n\
    - rx.exceptions.OnErrorFailedException\n- rx.exceptions.CompletedFailedException\n\
    - Java.lang.StackOverflowError\n- Java.lang.VirtualMachineError\n- Java.lang.ThreadDeath\n\
    - Java.lang.LinkageError\n\nTypically, in java code, you catch exceptions using\
    \ the try/catch block. With observers, there's no try/catch block, you can choose\
    \ between different techniques to recover from errors.\n\n# Handling Errors in\
    \ the onError() Method\n\nThe common scenario is to handle errors in the onError()\
    \ method. The subscriber's onError() method is responsible for handling the error\
    \ state.\n\nIn the following example, you generate a sequence of strings in which\
    \ every string should represent an integer, and then you deliberately introduce\
    \ an invalid string in the middle of the sequence.\n\n```\nObservable.just(\"\
    1\", \"2\", \"a\", \"3\", \"4\")n  .map(new Func<String, Integer>(){\n    @Override\n\
    \    public Integer call(String s) {\n      return Integer.parseInt(s);\n    }\n\
    \  })\n  .subscribe(new Subscriber<Integer>(){\n    @Override\n    public void\
    \ onCompleted() {\n      System.out.println(\"sequence completed!\");\n    }\n\
    \n    @Override\n    public void onError(Throwable e) {\n      System.out.println(\"\
    error! \" + e.toString());\n    }\n  });\n@Override\n```"
