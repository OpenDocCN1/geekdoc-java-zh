  md: "# Filter Results\n\nNow that you've got the list of repositories, you want\
    \ to filter that list and show only the repositories with at most two open issues.\
    \ You can do this by applying the filter() operator.\n\nThe Observable returned\
    \ by the method listRepos() emits a sequence of only one type of List<Repo>. To\
    \ apply the filter() operator, you need to observe the Observable to emit an item\
    \ for each Repo object. The following code shows how you can transform the Observable\
    \ into another Observable and then apply a filter:\n\n```\nString use = ...\n\
    int maxOpenIssues = ...\nlistRepos(user)\n.flatMap(new Func1<List<Repo>, Observable<Repo>>()\
    \ {\n    @Override\n    public Observable<Repo> call(List<Repo> repos) {\n   \
    \     return Observable.from(repos);\n    }\n})\\.filter(new Func1<Repo, Boolean>()()\
    \ {\n    @Override\n    public Boolean call(Repo repo) {\n        return repo.getOpenIssueCount()\
    \ <= maxOpenIssues;\n    }\n}).subscribe(new Subscriber<Repo>()() {\n    @Override\n\
    \    public void onCompleted() {\n        System.out.println(\"sequence completed\"\
    );\n    }\n    @Override\n    public void onError(Throwable e) {\n        e.printStackTrace();\n\
    \    }\n    @Override\n    public void onNext(Repo repo) {\n        System.out.println(\"\
    Repo: \" + repo.getName());\n    }\n});\n```"
