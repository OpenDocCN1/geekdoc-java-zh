  md: "# CHAPTER 3 SUBSCRIPTION LIFECYCLE\n\n# Retry\n\nThe RxJava library also contains\
    \ two operators that .retry to let you recover from error implementing with a\
    \ retry mechanism.\n\n+   * The Observable.retry(...) operator does not notify\
    \ the error and resubscribes to the source observable.\n* The Observable.retryWhen(...)\
    \ operator passes the error event to another observable that becomes responsible\
    \ for determining whether to resubscribe to the source observable.\n\nLet's apply\
    \ the retry() operator to the previous examples instead of onErrorResumeNext():n\n\
    \n```\nObservable.just(\"1\", \"2\", \"a\", \"3\", \"4\")n  .map(new Func1<String,\
    \ Integer>() {\n    @Override\n    public Integer call(String s) {\n      return\
    \ Integer.parseInt(s);\n    }\n})\n  .retry()\n  .subscribe(new Subscriber<Integer>()\
    \ {\n    @Override\n    public void onCompleted() {\n      System.out.println(\"\
    sequence completed!\");\n    }\n\n    @Override\n    public void onError(Throwable\
    \ e) {\n      System.out.println(\"error! \" + e.toString());\n    }\n\n    @Override\n\
    \    public void onNext(Integer item) {\n      System.out.println(\"next item\
    \ is: \" + item);\n    }\n  });\n```\n\nWhenever an error occurs, retry() will\
    \ resubscribe to the source, restarting the emission and encountering the error\
    \ again and again. As you may have guessed, this code will run forever, emitting\
    \ the following output:\n\n```\nnext item is: 1\nnext item is: 2\nnext item is:\
    \ 1\nnext item is: 1\nnext item is: 2\nnext item is: 1\n```"
