  md: "# CHAPTER 5 ▩ WORKING WITH RXJAVA AND RETROFIT\n\nAnd here's the output:\n\
    Repo: hello-world\nRepo: test-repo1\nsequence completed\n\n# Choosing the Right\
    \ Scheduler\n\nIn the previous example, you didn't specify any Scheduler, so the\
    \ code is executed using\nt default Scheduler.\n\nSuppose that you're working\
    \ on an application with a UI and that the network\noperation is kicked off by\
    \ clicking on a button. You don't want the UI to be blocked\nwaiting for the response,\
    \ so you need to ensure all the network stuff on a separate\nthread. This can\
    \ be done by applying the subscribeOn() operator. A network operation is\nan IO\
    \ operation, so you also need to ensure that the result is marshaled on the UI\
    \ thread (if the result\nis to update the UI, so you also need to apply the observeOn()\
