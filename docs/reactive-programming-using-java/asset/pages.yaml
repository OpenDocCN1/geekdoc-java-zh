    \  public Integer call(String s) {\n      return Integer.parseInt(s);\n    }\n\
    \  })\n  .retry(1)\n  .subscribe(new Subscriber<Integer>()() {\n    @Override\n\
    \    public void onCompleted() {\n      System.out.println(\"sequence completed!\"\
    );\n    }\n\n    @Override\n    public void onError(Throwable e) {\n      System.out.println(\"\
    error! \" + e.toString());\n    }\n\n    @Override\n    public void onNext(Integer\
    \ item) {\n      System.out.println(\"next item: \" + item);\n    }\n  });\n```\n\
    \nIn this case, the emission will be retried once; after that, if the error condition\
    \ persists, the error event will be propagated. The output is\n\nnext item is:\
