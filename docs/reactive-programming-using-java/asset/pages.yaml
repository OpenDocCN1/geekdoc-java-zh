  md: "# CHAPTER 1 REACTIVE AND RXJAVA\n\nFor example, the following code creates\
    \ a collection of even numbers:\n\n```\nList<Integer> input = Arrays.asList(1,\
    \ 2, 3, 4, 5);\nList<Integer> output = new ArrayList<>();\nfor (Integer x : input)\
    \ {\n    if (x % 2 == 0) {\n        output.add(x);\n    }\n}\n```\n\nIn order\
    \ to produce the desired output, you define every step that the program has to\
    \ build the result list, and each step is defined sequentially.\n\n+   1. Define\
    \ and create an input list.\n2. Define and create an empty output list.\n3. Take\
    \ each item of the input list.\n4. If the item is even, add it to the output list.\n\
    5. Continue with the following programming until the end of the input list is\
    \ reached.\n\nOne alternative to functional programming. In functional programming,\
    \ the result of the program derives from evaluation of mathematical functions,\
    \ without changing the internal program state. In fact, for every function f(x),\
    \ the result of f depends on the arguments passed to the function. Each time f(x)\
    \ is called, passing the same argument x, you always get the same result. This\
    \ is similar to an Object's static method that does not depend on any of the Object's\
    \ members.\nin simpler terms, in functional programming the blocks with which\
    \ you build the program are not objects but functions and procedures.\nSo, using\
    \ functional programming, the example above can be rewritten with the following\
    \ pseudocode:\n\n```\nvar output = input.where(x -> x % 2 == 0);\n```\n\nHere,\
    \ you don't have a sequence of steps but just a function (x % 2 == 0) passed as\
    \ a parameter to another function (where) that is applied to an object (Input).\
    \ The arrow (->) means \"apply function f\" (right side of the expression) to\
    \ the variable x (left side of expression).\n\nThe features of functional language\
    \ are the following:\n\n+   * Higher-order functions: Higher-order functions are\
    \ functions that take other functions as arguments.\n* Immutable data: Data is\
    \ immutable by default; instead of modifying values, functional languages often\
    \ operate on a copy of original values to preserve them (in Java, primitive types\
    \ are already immutable but an object is not, so its implementation must not allow\
    \ the object's state to be changed after creation)."
  merge: -1
  img_proc: true
- pgno: 9
  md: "+   - Concurrency: Concurrency is supported and is safer to implement, thanks\
    \ also to the immutability by default.\n\n+   - Referential transparency: This\
    \ term defines the fact that computations can be performed at any time, always\
    \ producing the same result (similar to static methods in Java).\n\n+   - Lazy\
    \ evaluation: Values can be computed only when needed (lazily) because functions\
    \ can be evaluated at any time, giving the same result (these functions do not\
    \ depend on the program's internal state).\n\nThere are programming languages\
    \ that are defined as purely functional programming languages, like Haskell, Hope,\
    \ and Mercury. Java is not one of these languages, but we can get the advantages\
    \ of functional programming also in Java.\n\nWith the release of Java 8, some\
    \ constructs of functional programming have been added, lambda functions and streams.\
    \ But with the RxJava library we can use concepts of functional programming with\
    \ Java 1.7 and Java 1.8.\n\n#  Lambda Expressions\n\nLambda expressions are anonymous\
    \ functions; the lambda operator is indicated using an arrow symbol pointing to\
    \ the right (>). Inputs are placed at the left of the operator, and the function\
    \ body is placed at the right.\n\nIn Java, lambda expressions can be used to replace\
    \ anonymous inner classes that implement an interface with just one method. For\
    \ example, consider the following Button object:\n\n...\n\n```\nclass Button {\n\
    \    setOnClickListener(OnButtonClickClickListener listener) {\n    }\n}\n\ninterface\
    \ OnButtonClickClickListener {\n    void onButtonClick();\n}\n```\n\nTo attach\
    \ a listener to the Button, you can use an anonymous function:\n\n```\nButton\
    \ button = ...\nbutton.setOnClickListener(new OnButtonClickClickListener() {\n\
    \    public void onButtonClick() {\n        // do something on button clicked\n\
    \    }\n});\n```"
  merge: -1
  img_proc: true
- pgno: 10
  md: "# CHAPTER 1 REACTIVE AND RXJAVA\n\nUsing lambda expressions, the code above\
    \ becomes the:\n\n```\nButton button = ...nbutton.setOnClickListener( () -> //\
    \ do something on button clicked );\n```\n\nOn the right side of the lambda operator\
    \ you can include all of the code to be executed when the button is clicked; this\
    \ code has no input, as indicated by the two brackets on the left side of the\
    \ lambda operator.\n\nIf the method onButtonClickListener accepts some parameters,\
    \ the example above becomes\n\n```\nInterface OnButtonClickClickListener {\n \
    \ void buttonClicked(Object param);\n}\n```\n\n```\nButton button = ...nbutton.setOnClickListener(\
    \ param ->\n// do something on button clicked\n// param can be used in this code\
    \ block\n)\n```\n\nJava support for lambda expressions was introduced in Java\
    \ 8, but you can use them in previous Java versions using the retrolambda library\
    \ (https://github.com/evant/gradle-retrolambda).\n\n# Imperative or Functional?\n\
    \nSo, why should you choose functional programming over imperative programming?\
    \ Functional code is often shorter and easier to understand than the corresponding\
    \ imperative code. You can do the same work with less code, and every programmer\
    \ knows that less code leads to less bugs.\n\nIn imperative programming, implementing\
    \ abstraction requires you to define interfaces and split code into components\
    \ that implement those interfaces; functional languages make it easier to create\
    \ abstractions (just think about how lambda expressions avoid the necessity of\
    \ creating interfaces with implementations).\n\n# Reactive Programming\n\nReactive\
    \ programming takes functional programming a little bit further, by adding the\
    \ concept of data flows (the next section) and propagation of data changes. In\
    \ reactive programming, a value can be assigned to a variable in the following\
    \ way:\n\n```\nx = y + z\n```\n\nHere, the sum of y and z will be assigned to\
    \ variable x at the same time that the function is called; later, variables y\
    \ and z can change, but these changes will not automatically influence the value\
    \ of x."
  merge: -1
  img_proc: true
- pgno: 11
  md: 'In reactive programming, the value of x should be updated whenever the values
    of y or z

    change.


    So, if the initial values are y = 1 and z = 1, you''ll have


    x = y + z = 2.


    If (or or z) changes its value, this does not mean that x changes automatically,
    but you

    must implement a mechanism to update the values of x when values of y and z are
    changed.


    Functional reactive programming is a new programming paradigm; it was made

    popular Erik Muller (who created the Rx library for .NET when working at Microsoft)

    and it''s based on two concepts:


    +   - Code "reacts" to events.


    +   - Code handles values as they vary in time, propagating changes to

    every part of the code that uses those values.


    # ## Streams of Data


    The key to understand reactive programming is to think about it operating on a
    stream

    of data.


    But what do I mean by "stream of data"? I mean a sequence of events, where an

    event could be user input (like a tap on a button), a response from an API request
    (like a

    Facebook feed), data contained in a collection, or even a single variable.


    In reactive programming, there''s often a component that acts as the source, emitting

    a sequence of items (or a stream of data), and some other components that observe
    this

    flow of items and react to each emitted item (they "react" to item emission).


    # ## Observer Pattern


    The Observer pattern is a design pattern in which there are two kinds of objects:

    observers and subjects. a subject is an object that observes the changes of one
    or more

    subjects; a subject is an object that keeps a list of its observers and automatically
    notifies

    when it changes its state.


    The definition of the Observer pattern from the "Gang of Four" (Design

    Patterns: Elements of Reusable Object Software by Erik Gamma, Richard Helm,

    Ralph Johnson, and John Videsch, ISBN 978-0-201-63361-2) is


    > > Define a one-to-many dependency between objects so that when

    one object changes state


    This pattern is the core of reactive programming. It fits perfectly the concept
    of

    reactive programming by providing the structures to implement the produce/react

    mechanism.'
  merge: -1
