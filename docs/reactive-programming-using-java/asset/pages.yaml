    \ with item emission, the observer will not be notified about it.\n\n# Hot and\
    \ Cold Observables\n\nIn the examples so far we have assumed that an Observable\
    \ beginning a sequence of items when the Observable subscribes to it: they are\
    \ called *cold observables*. Cold observables always wait to have at least one\
    \ subscribed to start emitting items.\n\nOn the other hand, an Observable that\
    \ begins emitting items before being connected to an observer is called a *hot\
    \ observable*\n\nWith hot observables, an observer can subscribe and start receiving\
    \ items at any time during the emission. With hot observables, the observer may\
    \ receive the complete sequence of items starting from the beginning or not.\n\
    \n> Note There's another kind of observable called a *connectable observable*.\
    \ This kind of observable begins emitting items when its \"connect\" method is\
    \ called, whether or not any observers have subscribed to it.\n\nLet's go with\
