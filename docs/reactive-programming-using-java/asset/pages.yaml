    # flatMap


    The flatMap operator (Figure 2-2) performs two types of actions: the ''map'' action
    that transforms the emitted items into observables and a ''flatten'' action that
    converts those

    observables into one observable. So, you can use flatMap to convert the input
    observable into any other observable (or, in other words, to convert the input
    stream into a different stream).


    ![](img/2ab15486b46859b709ebbac39262fbfa_29_0.png)


    Figure 2-2. A marble diagram of the flatMap operator


    So, like the map operator, flatMap applies a function to each emitted item, but
    this

    function must return an observable. Then those items are merged into one observable,
    so

    observables may be interleaved. If you need your observables not to be interleaved,

    y must use the operator concatMap.

    For example, suppose that you have a list of integers as input and you want to

    convert it in a sequence of strings in the format "Number x" where x is the next
    integer in

    the input list. You can combine flatMap and map as follows:


    ```

    List<Integer> input = Arrays.asList(1, 2, 3, 4, 5);

    Observable.just(input)

    ```


