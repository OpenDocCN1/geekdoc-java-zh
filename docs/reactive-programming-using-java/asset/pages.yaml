  md: "# CHAPTER 4 = SUBJECTS\n\nThey are the mutable variables of the Rx world, and\
    \ in most cases you do not need them. Typically a solution with Create or the\
    \ other operators allows you to just wire up continuations without adding extra\
    \ state. Stated slightly differently, it is a good practice to minimize the number\
    \ of objects that held on subscribers, you just want to pass them through.\n\n\
    [https://social.msdn.microsoft.com/Forums/en-US/bb87eea-6a317-4920-96d7-2313e9a7a234/why-does-emitter-not-like-subjects]\n\
    \nAs a general rule, before using a Subject, ask yourself if the same purpose\
    \ can be achieved with Observable.create() (or any other operator that creates\
    \ observables). And, if you need to use a Subject, it's a good idea to expose\
    \ it wrapped inside an Observable with the method Subject.asObservable(), because\
    \ by doing so you will not expose the mutable component of the Subject.\n\n# EXAMPLE:\
    \ A REACTIVE VERSION OF ARRAYLIST\n\nThe following example shows how to create\
    \ a reactive version of ArrayList. The implementation of ArrayList exposes two\
    \ additional methods to get notified when an item is added or removed:\n\n```\n\
    class ReactiveArrayList<T> extends ArrayList<T> {\n\n    private PublishSubject<T>\
    \ addSubject =\n        PublishSubject.create();\n    private PublishSubject<Object>\
    \ removeSubject =\n        PublishSubject.create();\n\n    @Override\n    public\
    \ boolean add(T item) {\n        boolean result = super.add(item);\n        if\
    \ (result) {\n            addSubject.next(item);\n        }\n        return result;\n\
    \    }\n\n    @Override\n    public void add(int index, T item) {\n        super.add(index,\
    \ item);\n        addSubject.next(item);\n    }\n\n    @Override\n```"
