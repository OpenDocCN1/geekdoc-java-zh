  md: '# CHAPTER 3 SUBSCRIPTION LIFECYCLE


    Looking at the diagram in Figure 3-1, you can see that at the end of each period
    only the emitted item (from the source observable) is emitted by the resulting
    observable, and the other items are discarded.


    # throttleFirst


    Observable,throttleFirst() behaves like sample, but it emits the first item of
    each sample (Figure 3-2).


    ![](img/2ab15486b46859b709ebbac39262fbfa_60_0.png)


