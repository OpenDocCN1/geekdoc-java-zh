    \ in the Activity (or Fragment) life cycle.\n\nTo include this in your project,\
    \ add the dependency to your app build.gradle file:\n\n+   compile 'com.android.support:appcompat-compat-v7:24.1.1'\n\
    compile 'io.reactivex:rxjava:1.2.5'\ncompile 'com.jakewhartator:rxandroidbinding:0.4.0'\n\
    compile 'com.trello:rxlifecycle:0.7.0'\ncompile 'com.trello:rxlifecycle-android:0.7.0'\n\
    \nWith this library, you can use the compose() operator to specify when to subscribe\
    \ from Observable:\n\n```\n.compose(RxLifecycle.bindUntilEvent(lifecycle, ActivityEvent.DESTROY))\n\
    .subscribe();\n```\n\nOr you can let the library auto-detect when to unsubscribe:\n\
    \n```\n.compose(RxLifecycle.bindActivity(lifecycle))\n.subscribe();\n```\n\nIn\
    \ the latter case, the subscription is managed in the life cycle event opposed\
    \ to the subscription (for example, if subscription occurs in the Activity's onCreate()\
    \ method, the subscription will happen in onStop().\n\n104"
