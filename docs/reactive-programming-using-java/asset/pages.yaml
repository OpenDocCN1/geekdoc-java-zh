    # distinct


    The distinct operator (Figure 2-7) applies a filter to the source sequence. If
    an item is emitted more than once, only the first occurrence will be emitted.


    ![](img/2ab15486b46859b709ebbac39262fbfa_35_0.png)


    Figure 2-7. A marble diagram of the distinct operator


