  md: "# Handling Backpressure Inside the Subscriber\n\nInside the subscriber you\
    \ can ask the observable to slow down the emission. So, in the zip example above,\
    \ you can ask B to emit items slowly instead of applying a throttling operator.\n\
    \nInside the subscriber's start() method you must call the Subscriber.request(n)\
    \ where n is an integer representing the maximum of items you want the Observable\
    \ to emit before the next request(n). Then, after consuming the item in the next(n),\
    \ you must call request() again to tell the observable to continue with the emission\
    \ of the following items.\n\nIn the following example, you set n=1, so you can\
    \ consume each item before the next one is emitted:\n\n```\nobservable.subscribe(new\
    \ Subscriber<T>() {\n    @Override\n    public void start() {\n        request(1);\n\
    \    }\n\n    @Override\n    public void onCompleted() {\n    }\n\n    @Override\n\
    \    public void onError(Throwable e) {\n    }\n\n    @Override\n    public void\
    \ onNext(T item) {\n        consume(item)\n        request(1);\n    }\n});\n```\n\
    \nHere you called the request() method in start() and onNext() with the same parameter\
    \ of 1, because you supposed that you can consume only one item before the next\
    \ one is emitted, but these values are independent and can be tuned based on the\
    \ use case.\n\nIf you omit the request() call, the observable emits items as it\
    \ would normally, without slowing down the emission; the same effect can be achieved\
    \ calling request(0)."
