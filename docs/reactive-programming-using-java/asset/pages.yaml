    # debounce


    Observable,debounce() emits only items that are not followed by any other item
    within a specified interval, as shown in Figure 3-3.


    ![](img/2ab15486b46859b709ebbac39262fbfa_60_1.png)


    Figure 3-3. The marble diagram of Observable.debounce()


