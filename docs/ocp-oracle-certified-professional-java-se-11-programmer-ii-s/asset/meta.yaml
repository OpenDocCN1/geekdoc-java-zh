- - '###'
  - 5. 执行以下应用程序的结果是什么？
- - '###'
  - 6. 类中的 `serialPersistentFields` 字段必须使用哪些修饰符？（选择所有适用项。）
- - '###'
  - 7. 以下代码的输出是什么？
- - '###'
  - 8. 执行以下代码段可能的结果是什么？（选择所有适用项。）
- - '###'
  - 9. 假设你为服务提供接口、服务提供者、服务定位器和消费者分别准备了独立的模块。如果你在服务提供接口中添加了一个新的 `abstract` 方法并在消费者模块中调用它，你需要重新编译这些模块中的几个？
- - '###'
  - 10. 以下哪个语句可以填充空白以使代码成功编译？（选择所有适用项。）
- - '###'
  - 11. 假设我们有以下属性文件和代码。第 8 行和第 9 行分别使用了哪个包（bundle）？
- - '###'
  - 12. 给定以下程序，空白处可以插入什么使其编译并打印 `Poof!`？（选择所有适用项。）
- - '###'
  - 13. 假设 `birds.dat` 存在、可访问且包含 `Bird` 对象的数据。执行以下代码的结果是什么？（选择所有适用项。）
- - '###'
  - 14. 以下哪些说法是正确的？（选择所有适用项。）
- - '###'
  - 15. 假设文件系统中存在文件 `/gorilla/signs.txt`。关于以下代码段的哪些描述是正确的？（选择所有适用项。）
- - '##'
  - 评估答案
- - '###'
  - 8. B, D. 如果控制台不可用，`System.console()` 返回 `null`，因此选项 D 正确。另一方面，如果控制台可用，它将读取用户输入并打印结果，因此选项
    B 正确。更多信息，请参阅第 8 章。
- - '###'
  - 9. D. 由于你更改了服务提供者接口，你必须重新编译它。同样，你需要重新编译服务提供者，因为它现在需要实现新方法。消费者模块也需要重新编译，因为代码已经更改以调用新方法。因此，有三个模块需要重新编译，选项
    D 正确。服务定位器不需要重新编译，因为它仅仅是查找接口。更多信息，请参阅第 6 章。
- - '###'
  - 10. C, D. `mySet` 的声明定义了类型为 `RuntimeException` 的上界。这意味着类可以指定 `RuntimeException`
    或任何子类。选项 B 是错误的，因为 `RuntimeException` 是父类。选项 A 是错误的，因为通配符不能赋值的右侧。选项 C 和 D 可以编译。
- - '###'
  - 11. C. Java 在第 8 行找到匹配的默认项。第 7 行使用 `Dolphins_en.properties` 作为匹配的资源。由于没有匹配，第 9
    行没有找到。更多信息，请参阅第 5 章。
- - '###'
  - 12. B, D, F. `Magicand` 类是一个内部类，需要外部类 `Wizard` 的实例化。选项 A 是错误的，选项 B 和 F 正确。
- - '###'
  - 13. D, E. 第 10 行包含未处理的 `IOException`，第 12 行包含未处理的 `FileNotFoundException`。选项 D
    正确。
- - '###'
  - 14. B, F. 在空的 `Optional` 上调用 `get()` 会抛出异常，选项 B 正确。选项 F 也是正确的，因为 `filter()` 在调用
    `get()` 之前让 `Optional` 为空。
- - '###'
  - 15. D, E, G. `Files.find()` 的第二个参数接收的是 `int` 而不是 `double`。
- - '###'
  - 16. B. `CallableStatement` 用于运行存储过程。
- - '###'
  - 17. E. 该类是泛型的正确用法。
- - '###'
  - 18. A, B, C, E. 选项 A 和 E 将数据类改为安全的并保证打印 100。
- - '###'
  - 19. E. `@Deprecated` 注解可以标记方法或类在未来版本中移除。
- - '###'
  - 20. D. 虽然源是一个无限流，但代码并没有终止。
- - '###'
  - 21. D. 选项 E 是错误的，因为 `PreparedStatement` 在 `try-with-resources` 块中关闭。
