  \ 类型接口\n#### 使用 UnaryOperator 接口\n### 使用 BinaryOperator 接口\n## 总结\n\nJava 8 添加 Lambda\
  \ 表达式是向在 Java 应用中使用函数式编程技术的一步。函数式编程导向强调在各种语文中使用简单函数。在许多情况下，使用函数式编程可以产生更好且不易出错的代码。这种编程风格已经与\
  \ Java 的面向对象特性集成在一起。它也反映在核心库的组织方式中。\n\nLambda 结构出现在许多其他编程语言中。人们认为 Java 通过在语言中添加函数式编程方面也能从中益，从而能够使用简洁且优雅的表达式。Lambda\
  \ 表达式还允许将函数作为方法的参数使用。这把代码视为数据。\n\nLambda 表达式消除了在许多情况下使用匿名内部类的需求。使用匿名内部类需要大量的样板代码。久而久之，它们看起来都非常相似，而且通常它们只有一个方法被重写。使用\
  \ Lambda 表达式意味着可以使用更紧凑的代码。此外，它们的使用还避免了在使用 `this` 关键字时可能出现的混淆以及访问非 final 变量的问题。\n\
  \n\n\n\n在本章中，我们将展示如何在各种上下文中创建和使用 lambda 表达式。我们将充分探索 lambda 表达式的语法变体，以便人们完全理解它们是如何编写的。我们将讨论闭包的概念及其与\
  \ lambda 表达式之间的关系。我们还将如何将方法引用和构造函数引用作为 lambda 表达式使用。\n\n本章的最后一节探索了 `java.util.function`\
  \ 包。该包包含了许多与 lambda 表达式一起使用的函数式接口。当这些接口与 `Stream` 接口配合使用时，理解这些接口尤为重要。\n\n注意：数学家阿隆索·丘奇（Alonzo\
  \ Church）作为计算模型的一部分开发了 lambda 表达式的概念。他使用希腊字母 lambda 来表示这种抽象。这个名称流传了下来。\n\n## 理解\
  \ Lambda 表达式\n\nLambda 表达式可以被认为是匿名函数。当我们思考函数时，脑海中可能会出现平方根函数的形象。我们向它传递一个数字，它返回一个数字。\n\
  \nlambda 表达式背后的驱动力是让这些表达式尽可能易用。函数最简单的形式是什么？下面是一个简单的平方函数版本：\n\n```java\nint square(int\
  \ num) {\n    return num*num;\n}\n```\n\n![](img/image64.jpg)\n\n如果我们忽略数据类型并省略名称，理论上可以将其写为：\n\
  \n```java\nnum {return num*num;}\n```\n\n![](img/image65.jpg)\n\n由于我们知道函数将返回一个值，因此不需要\
  \ `return` 关键字，至少对于这个函数是如此。此外，由于只使用了一条语句，也不需要块语句。我们仍然需要将参数与函数体分开。这可以使用 lambda 运算符（`->`），有时称为箭头标记（arrow\
  \ token），如下：\n\n```java\nnum -> num*num\n```\n\n![](img/image66.jpg)\n\n这就是我们的 lambda\
  \ 表达式。它代表了编写函数的简单方法。这里是另一个简单的 lambda 表达式。它接收一个单一值进行显示，不返回任何内容：\n\n```java\nx ->\
  \ System.out.println(x)\n```\n\n![](img/image67.jpg)\n\n我们在哪里使用 lambda 表达式？在任何期望函数式接口的地方都可以使用\
  \ lambda 表达式。函数式接口是一个有且仅有一个抽象方法的接口。该方法被称为函数方法。这些概念在第 1 章中讨论过。\n\n为了说明，我们将使用 lambda\
  \ 表达式作为 `forEach` 方法的参数。该方法期望 `java.util.function.Consumer` 函数式接口的实例。它的抽象方法是 `accept`\
  \ 方法，它接受一个对象并返回 `void`。\n\n`forEach` 方法已添加到 Java 8 的许多接口中，包括 `Iterable` 接口。`Iterable`\
  \ 接口的任何子接口或实现类都拥有此方法。这包括许多接口和类，如：`List`、`HashSet` 和 `LinkedList`。\n\n在下面的示例中，根据一组数字创建一个\
  \ `List`：\n\n```java\nList<Integer> list = Arrays.asList(5,3,4);\n```\n\n![](img/image68.jpg)\n\
  \n下面使用 lambda 表达式显示列表的每个元素：\n\n```java\nlist.forEach((Integer element)->System.out.println(element));\n\
  ```\n\n![](img/image69.jpg)\n\n该代码序列的输出如下：\n发生了什么？当编译器检查该语句时，它期望一个 `Iterable` 实例。然而，它找到的是\
  \ lambda 表达式。然后它尝试将 lambda 表达式转换为所需的对象。由于只传递了单个参数且没有返回任何内容，它决定可以这样做。这匹配了 `accept`\
  \ 方法的签名。由于 `list` 是一个整数集合，它决定参数类型应该是 `Integer`。这个过程被称为 `target typing`（目标类型推断），将在节中进行深入讨论。\n\
  \n你可以想象编译器为上一个示例生成一个匿名内部类的实现，类似于：\n\n```java\nlist.forEach(new Consumer() {\n  \
  \  @Override\n    public void accept(Object element) {\n        System.out.println(element);\n\
  \    }\n});\n```\n\n![](img/image70.jpg)\n\n然而，更简洁且最终更高效的方法是如下使用 lambda 表达式：\n\n\
  ```java\nlist.forEach((element)->System.out.println(element));\n```\n\n![](img/image71.jpg)\n\
  \n这意味着创建了一个对象。这是否真的发生是一个实现问题。将 lambda 表达式视为匿名函数会更有用。\n\n虽然函数和方法相似，但函数并不绑定到类上。lambda\
  \ 表达式在概念上是一个简单的概念。然而，在完全理解之前，它们的语法可能是晦涩的。它们代表了开发 Java 应用程序的强大新工具。\n\n# 推断目标类型\n\n\
  `target typing`（目标类型推断）是根据对象使用的上下文推断其类型的过程。我们在上一个示例中看到了这种情况。`Type referencing`（类型引用）发生在系统确定\
  \ lambda 表达式类型时。类型是从表达式中推断出来的。之所以可能，是因为 Java 知道函数式接口抽象方法预期的参数类型。\n\nlambda 表达式不包含关于它正在实现哪个函数式接口的信息。lambda\
  \ 表达式的上下文决定了它代表哪个函数式接口。例如，下面的 lambda 表达式接受一个单一值并返回它的平方：\n\n```java\nx -> x * x\n\
  ```\n\n![](img/image72.jpg)\n\n下面的函数式接口定义都有一个单一抽象方法，接受一个单一值并返回一个值：\n\n```java\n\
  interface IntegerSquare {\n    int square(int x);\n}\n\ninterface DoubleSquare {\n\
  \    double square(double x);\n}\n```\n\n![](img/image73.jpg)\n\n然而，两个赋值都是有效的。我们将\
  \ lambda 表达式赋值给函数式接口变量，这匹配了抽象方法的签名。\n\n```java\nIntegerSquare intSquare = x * x;\n\
  DoubleSquare doubleSquare = x * x;\n```\n\n![](img/image74.jpg)\n\n这里有一个完整的示例：\n\
  \n```java\npublic class LambdaExamples {\n    public static void main(String[] args)\
  \ {\n        IntegerSquare intSquare = x * x;\n        DoubleSquare doubleSquare\
  \ = x * x;\n        System.out.println(intSquare.square(5));\n        System.out.println(doubleSquare.square(5));\n\
  \    }\n}\n```\n\n![](img/image75.jpg)\n\n该序列的输出如下：\n```\n25\n25.0\n```\n\n让我们重新检查语句：\n\
  \n```java\nIntegerSquare intSquare = x * x;\n```\n\n![](img/image76.jpg)\n\n此表达式的左侧是\
  \ `IntegerSquare`，被称为 lambda 表达式的 `target type`（目标类型）。目标类型是在给定上下期望的数据类型。lambda 表达式的目标类型必须是：\n\
  \n- 函数式接口\n- 与接口描述符兼容的参数类型\n- 与描述符返回类型兼容的返回类型\n- 只抛出描述符允许的异常\n\n提醒一下，描述符是函数方法的类型。它由参数类型、返回类型以及方法抛出的任何异常组成。\n\
  \n我们还可以使用泛型函数式接口定义。为了说明这一点，我们将使用这里所示的 `ComputableType` 接口：\n\n```java\ninterface\
  \ ComputableType<T> {\n    T compute(T x);\n}\n```\n\n![](img/image77.jpg)\n\n在下一个示例中，我们根据此接口声明两个变量。第一个是\
  \ `Integer` 类型，第二个是 `Double` 类型。示例展示了使用隐式和显式参数声明为每个变量赋值 lambda 表达式。\n\n```java\n\
  ComputableType<Integer> computableInteger;\ncomputableInteger = (Integer x) -> x\
  \ * x;\ncomputableInteger = (x) -> x * x;\n\nComputableType<Double> computableDouble;\n\
  computableDouble = (Double x) -> x * x;\ncomputableDouble = (x) -> x * x;\n```\n\
  \n![](img/image78.jpg)\n\n\n\n每组中的最后一条语句与赋值目标变量除外，都是相同的。在这些情况下，编译器能够确定使用的类型。该表达式被赋值给两个不同的目标。这是目标类型（target\
  \ typing）的另一个示例。\n\n虽然 lambda 表达式可以被视为对象，但它们并不一定分配唯一的标识符。这是一个设计决定，为 Java 架构师在未来\
  \ Java 版本中扩展 lambda 表达式提供了灵活性。因此，相等运算符和 `equals` 方法（继承自 `Object`）可能并不总是按照预期方式执行。考虑以下声明：\n\
  \n```\nComputableType<Integer> ci1;\n```\n\n![](img/image79.jpg)\n\n以下两个比较都会产生语法错误：\n\
  \n```java\nif(ci1 == (x) -> x * x) { }\nif(ci1 == ((x) -> x * x)) { }\n```\n\n![](img/image80.jpg)\n\
  \n生成的信息如下：\n\n```\nlambda expression not expected here\nbad operand types for binary\
  \ operator '=='\nfirst type:  ComputableType<Integer>\nsecond type: <none>\n```\n\
  \n我们可以通过使用 `ComputableType<Integer>` 强制转换 lambda 表达式来消除此语法错误，如下所示。在示例中，我们还对两个 `ComputableType`\
  \ 变量进行了比较，以确定它们的行为。\n\n```java\nComputableType<Integer> ci1;\nComputableType<Integer>\
  \ ci2;\n\nci1 = (x) -> x * x;\nci2 = (x) -> x * x;\n\nSystem.out.println(ci1 ==\
  \ (ComputableType<Integer>)(x) -> x * x);\nSystem.out.println(ci1.equals((ComputableType<Integer>)(x)\
  \ -> x * x));\nSystem.out.println(ci1 == ci2);\nSystem.out.println(ci1.equals(ci2));\n\
  \nci2 = ci1;\nSystem.out.println(ci1 == ci2);\nSystem.out.println(ci1.equals(ci2));\n\
  ```\n\n![](img/image81.jpg)\n\n输出如下：\n\n```\nfalse\nfalse\nfalse\nfalse\ntrue\n\
  true\n```\n\nlambda 表达式的比较并不总是像人们预期的那样工作。\n\n### 创建 Lambda 表达式\n\n在本节中，我们将看到如何创建\
  \ lambda 表达式，并检查 lambda 表达式的语法问题。lambda 表达式的基本语法如下：\n\n```\n(parameter) -> expression\n\
  (parameters) -> { statements;}\n```\n\n![](img/image82.jpg)\n\n一个 lambda 表达式由以下元素序列组成：\n\
  \n- 参数列表\n- lambda 运算符 (`->`)\n- 主体，可以是单个语句或语句块\n\n参数列表通常是括在括号内的用逗号分隔的形式形式参数列表。参数列表并不一定需要：\n\
  \n- 数据类型，或\n- 一组括号\n\n参数类型可以显式声明，也可以从其上下文中推断。lambda 表达式可以采用多种形式。表 1：Lambda 表达式形式展示了输入和返回值的各种组合。\n\
  \n*表 1：Lambda 表达式形式*\n\n| 参数数量 | 返回值数量 | 示例 |\n| :--- | :--- | :--- |\n| **0** |\
  \ 0 | `() -> System.out.println(\"\")` |\n| **0** | 1 | `() -> 45` |\n| **1** |\
  \ 0 | `(x) -> System.out.println(x)` |\n| **1** | 1 | `(x) -> x * x` |\n| **多个**\
  \ | 0 | `(x, y) -> System.out.println(x + y)` |\n| **多个** | 1 | `(x, y) -> x + y`\
  \ |\n\n![](img/image83.jpg)\n\n#### Lambda 表达式语法规则\n\n以下规则总结了如何编写 lambda 表达式：\n\n\
  - 参数类型可以显式或隐式地声明\n- 当使用单个隐式声明的参数时，可以省略括号\n  - 然而，它们不能在同一个表达式中混合使用\n- 单值不必包含在块语句中\n\
  - lambda 表达式中的多个语句必须包含在块语句中\n- 块主体可以返回一个值，也可以不返回\n- 使用 `return` 关键字的规则与方法相同\n\n\
  我们将检查这些规则的细节并说明它们的许多变化。\n\n## 声明参数类型\n\n在第一个表达式中，参数 `x` 是显式声明的。在第二个表达式中，它的类型是隐式的。\n\
  \n```java\n(Integer x) -> System.out.println(x)\n(x) -> System.out.println(x)\n\
  ```\n\n![](img/image84.jpg)\n\n在隐式声明变量的情况下，目标类型起了作用。\n\n## 混合参数声明\n\n让我们从一个函数接口定义开始：\n\
  \n```java\ninterface IntegerMathType<T> {\n    T compute(T x, T y);\n}\n```\n\n\
  ![](img/image85.jpg)\n\n接下来两个表达式展示了显式参数声明的使用。第一个表达式使用了两个声明的参数，是合法的。第二个表达式是非合法的，因为一个参数是显式声明的，而另一个是隐式声明的。\n\
  \n```java\nIntegerMathType<Integer> addition = (Integer a, Integer b) -> {return\
  \ a + b;};\nIntegerMathType<Integer> addition = (Integer a, b) -> {return a + b;};\
  \ // 非法\n```\n\n![](img/image86.jpg)\n\n第二个表达式生成的错误信息如下：\n\n```\n<identifier> expected\n\
  incompatible types: incompatible parameter types in lambda expression\n```\n\n##\
  \ 省略括号\n\n在某些情况下可以省略括号。考虑以下 `ComputableType` 接口：\n\n```java\ninterface ComputableType<T>\
  \ {\n    T compute(T x);\n}\n```\n\n![](img/image87.jpg)\n\n考虑以下声明：\n\n```java\n\
  ComputableType<Integer> computable;\n```\n\n![](img/image88.jpg)\n\n带有显式参数的简单 lambda\
  \ 表达式如下。\n\n```java\ncomputable = (Integer x) -> x * x;\n```\n\n![](img/image89.jpg)\n\
  \n我们可以如下进行简化。省略了类型和括号。\n\n```java\nComputableType<Integer> computable;\ncomputable\
  \ = x -> x * x;\n```\n\n![](img/image90.jpg)\n\n如果 lambda 表达式有一个单参数，则可以省略括号。Java\
  \ 会推断其类型。但你不能省略括号而保留类型，如下所示：\n\n```java\nComputableType<Integer> computable;\ncomputable\
  \ = Integer x -> x * x; // 非法\n```\n\n![](img/image91.jpg)\n\n生成的错误信息如下：\n\n```\n\
  ';' expected\nnot a statement\n```\n\n在下一个示例中，两个 lambda 表达式显式和隐式地声明了参数。然而，第三个表达式声明了类型但没有使用括号，因此是非法的。\n\
  \n```java\n(int x, int y) -> x*y\n(x, y) -> x*y\nint x, y -> x*y // 非法\n```\n\n\
  ![](img/image92.jpg)\n\n生成的错误信息如下：\n\n```\n';' expected\nnot a statement\n```\n\n\
  ## 省略块语句\n\n块语句并不总是必要的。在以下示例中，第一个 lambda 表达式使用单个输入参数并返回一个值（参数的平方）。第二个 lambda 表达式返回两个参数的和。这两个表达式都没有使用块语句。\n\
  \n```java\n(x) -> x * x\n(x, y) -> x + y\n```\n\n![](img/image93.jpg)\n\n此外，返回 `void`\
  \ 的单行 lambda 表达式不需要包含在块语句中。\n\n## 在 Lambda 主体中使用多个语句\n\nlambda 表达式可以使用多个语句。为了说明这样做，我们将使用之前定义的\
  \ `ComputableType` 接口：\n\n```java\ncomputable = (x) -> {\n    int y = x * x;\n \
  \   y += x + x;\n    return y;\n};\n```\n\n![](img/image94.jpg)\n\n## 使用返回值\n\n\
  块主体可以返回值，也可以不返回。返回值时，不一定需要使用 `return` 关键字。在大多数情况下它是隐式的。以下 lambda 表达式不返回内容，因此不能使用\
  \ `return` 关键字：\n\n```\n(x) -> System.out.println(x)\n```\n\n![](img/image95.jpg)\n\
  \n下一个 lambda 表达式返回单个值。当返回值且存在块语句时，必须使用 `return` 关键字。\n\n```\ncomputable = (x) ->\
  \ {return x * x;};\n```\n\n![](img/image96.jpg)\n\n在这个示例中省略了 `return` 关键字：\n\n```java\n\
  addition = (a, b) -> {a + b;};\n```\n\n![](img/image97.jpg)\n\n它将生成以下错误信息：\n\n```\n\
  not a statement\nincompatible types: bad return type in lambda expression\nmissing\
  \ return value\n```\n\n#### 编写简洁的 Lambda 表达式\n\n创建短易写的 lambda 表达式是一个理想的目标，只要它不会变得过于晦涩。以下是关于编写简洁表达式的一些指南：\n\
  \n\n\n\n\n-   当使用单个参数时，不要使用括号\n-   尽可能不要使用参数类型\n-   避免使用块语句（block statement）\n\n\
  下面展示了一个有效但冗余的表达式：\n\n```\n(Integer x) -> {System.out.println(x);}\n```\n\n![](img/image98.jpg)\n\
  \n后面是一个等效但更简单的表达式：\n\n```java\nx -> System.out.println(x)\n```\n\n![](img/image99.jpg)\n\
  \n通过移除参数类型和括号，我们简化了 lambda 表达式的第一部分。由于不需要块语句，因此也将其删除了。\n\n然而，某些 IDE 可能会建议在 lambda\
  \ 晶体中使用块语句，或者在接口是泛型时使用显式参数。例如，让我们从如下的 `ComputableType` 接口定义开始：\n\n```java\ninterface\
  \ ComputableType<T> {\n    T compute(T x);\n}\n```\n\n![](img/image100.jpg)\n\n\
  下方声明了该类型的变量，并为其赋值了一个 lambda 表达式：\n\n```java\nComputableType<Integer> computableType\
  \ ;\ncomputableType = (x) -> x * x;\n```\n\n![](img/image101.jpg)\n\nIDE 可能会提供建议来提高其可读性。下面展示了使用体以及显式参数来满足\
  \ IDE 建议的等效声明：\n\n```java\nComputableType<Integer> computable;\n// 使用块作为 lambda\
  \ 表达式\ncomputable = (x) -> {\n    return x * x;\n};\n\n// 使用显式参数\ncomputable = (Integer\
  \ x) -> x * x;\n```\n\n![](img/image102.jpg)\n\n如果我们使用了下文声明的非泛型 `Computable` 接口，就不会有这些建议：\n\
  \n```java\ninterface Computable {\n    int compute(int x);\n}\n\nComputable computable;\n\
  computable = (x) -> x * x;\n```\n\n![](img/image103.jpg)\n\n然而，由于该接口不是泛型的，在此 lambda\
  \ 表达式中使用参数是非合法的。下面的图说明了使用 `Integer` 类型的尝试：\n\n```java\ncomputable = (Integer x)\
  \ -> x * x;  // 非法\n```\n\n![](img/image104.jpg)\n\n将生成类似下面的错误信息：\n\n```\nincompatible\
  \ types: incompatible parameter types in lambda expression\ncomputable = (Integer\
  \ x) -> x * x;  // 非法\n```\n\n## Lambda 表达式中的变量捕获\n\n在本节中，我们将研究用于访问 lambda 表达式内部变量的技术。在定义环境中中使用变量被称为“变量捕获”（variable\
  \ capture）。lambda 表达式只能访问其定义环境中的 `final` 变量或“有效 final”（effectively final）变量。所谓“有效\
  \ final”，意味着，如果将该变量声明为 `final`，代码编译时不会报错。\n\nlambda 表达式可以引用未声明为 `final` 但从未修改过的局部变量。但是它们不能重新定义这些变量。这解决了匿名内部类的一个局限性，即匿名内部类使用的局部变量必须声明为\
  \ `final`。此外，允许使用 `this` 和 `super` 关键字。\n\n总结规则，lambda 表达式可以：\n- 使用 `final` 变量\n\
  - 使用有效 final 变量\n- 不能修改局部变量或参数变量\n- 不能重新定义局部或参数变量\n- 可以使用 `this` 和 `super` 关键字\n\
  \n我们将使用以下类来演示如何在 lambda 表达式中捕获变量。首先定义 `IntegerMath` 函数式接口，然后在测试方法中使用。测试方法创建并返回了一个\
  \ lambda 表达式，该表达式使用一系列变量来计算和。该 lambda 表达式随后在另一个线程中执行。\n\n```java\ninterface IntegerMath\
  \ {\n    int operation(int a, int b);\n}\n\npublic class VariableCapture implements\
  \ Runnable {\n    private int instanceVariable = 5;\n    static IntegerMath le;\n\
  \n    public static void main(String args[]) {\n        VariableCapture vc = new\
  \ VariableCapture();\n        le = vc.test(15);\n        Thread thread = new Thread(vc);\n\
  \        thread.start();\n    }\n\n    public IntegerMath test(int parameter) {\n\
  \        int localVariable = 10;\n        final int finalVariable = 30;\n      \
  \  IntegerMath testExpression = (x, y) -> {\n            return x + y\n        \
  \    + instanceVariable\n            + parameter\n            + localVariable\n\
  \            + finalVariable;\n        };\n        return testExpression;\n    }\n\
  \n    @Override\n    public void run() {\n        System.out.println(le.operation(25,\
  \ 5));\n    }\n}\n```\n\n![](img/image105.jpg)\n\n该程序的输出将是 90。\n\nlambda 表达式能够访问其环境中的变量。然而，如果修改了\
  \ `localVariable` 或 `parameter` 变量，它们将不再是有效 final，并产生语法错误。这两种修改生成的错误信息如下：\n\n```\n\
  local variables referenced from a lambda expression must be final or effectively\
  \ final\n```\n\n无论在何处修改变量都不重要。它们不能被更改。如果需要，可以修改 `instanceVariable`。\n\n我们可以如下所示在\
  \ lambda 表达式中使用 `this` 关键字。它的使用没有限制：\n\n```java\n+ this.instanceVariable\n```\n\n\
  ![](img/image106.jpg)\n\n`super` 关键字也可以访问基类成员。\n\n在 lambda 表达式内部尝试重新定义 `localVariable`\
  \ 或 `parameter` 将导致错误信息：\n\n```\nvariable index is already defined in method testCapture\
  \ ()\n```\n\n使用有效 final 变量可以消除某些涉及局部变量的类型多线程错误。由于 lambda 表达式是独立的，使用有效 final 变量消除了多线程同步的问题。\n\
  \n## 区分 Lambda 表达式与闭包（Closure）\n\n闭包和 lambda 表达式在 Java 中本质上是相同的。lambda 表达式是一个匿名函数。闭包是一个捕获环境的环境。捕获环境意味着它可以访问不在参数列表中的变量。在\
  \ Java 中，这两个术语可以互换。\n\n当评估 lambda 表达式时，它使用的是定义所在的环境，而不是使用所在的环境。如果 lambda 表达式是在特定栈中定义的，即使在另一个栈中使用，它也会在该栈的上下文中执行。在执行上下文（线程）之间传递闭包允许在其定义环境中评估表达式。\n\
  \n虽然对象是类的实例，但闭包是 lambda 表达式的实现。当 lambda 表达式编译时，会在运行时创建一个表示该 lambda 表达式类型的对象。\n\n\
  \n\n\n将 `println` 方法作为方法引用可以节省创建 lambda 表达式所需的工作，如下所示。此示例将显示列表中的每个元素，每行一个数字。\n\n\
  ```java\nList<Integer> list = Arrays.asList(-5, -3, 4);\nlist.forEach(System.out::println);\n\
  ```\n\n![](img/image108.jpg)\n\n这等同于以下代码：\n\n```java\nlist.forEach(s -> System.out.println(s));\n\
  ```\n\n![](img/image109.jpg)\n\n方法引用有四种基本类型：\n\n-   静态方法引用\n-   实例方法引用（特定对象）\n-\
  \   实例方法引用（特定类型的任意对象）\n-   构造方法引用\n\n在方法方法引用时，与 lambda 表达式一样，函数的签名必须与函数式方法的签名匹配。引用的类型取决于它的上下文。\n\
  \n让我们检查以下方法引用：\n\n```\nMath::sin // 等同于 x->Math.sin(x)\n```\n\n![](img/image110.jpg)\n\
  \n虽然 `Math` 类并不构成函数式接口，但在 lambda 表达式接受 `double` 并返回 `double` 的地方，可以使用 `sin` 方法。`sin`\
  \ 方法可以应用于此类函数式接口实例。该方法本身被视为一个函数。\n\n### 使用静态方法引用\n\n静态引用方法的一个特征是，它们不能捕获实例变量，原因与静态方法无法访问实例变量相同。为了演示静态引用的使用，我们将创建一个静态显示方法，该方法对每个元素执行操作，然后显示该操作的结果。方法引用使用了一个静态的\
  \ `square` 方法。\n\n```java\ninterface Computable {\n    int compute(int x);\n}\n\n\
  public class MethodReferenceExample {\n    public static void main(String[] args)\
  \ {\n        List<Integer> list = Arrays.asList(-5, -3, 4);\n        display(list,\
  \ MethodReferenceExample::square);\n    }\n\n    public static int square(int num)\
  \ {\n        return num*num;\n    }\n\n    private static void display(List<Integer>\
  \ list, Computable operation) {\n        for(Integer element : list) {\n       \
  \     System.out.println(operation.compute(element));\n        }\n    }\n}\n```\n\
  \n![](img/image111.jpg)\n\n输出将如下所示：\n\n```\n25\n9\n16\n```\n\n在此示例中，我们正在使用静态方法 `square`\
  \ 的引用。我们可以同样很容易地使用以下语句，它使用了 `Math` 类的静态方法 `abs`：\n\n```java\ndisplay(list, Math::abs);\n\
  ```\n\n![](img/image112.jpg)\n\n输出如下：\n\n```\n5\n3\n4\n```\n\n### 使用实例方法引用\n\n实例方法引用可以使用特定实例的方法或任意类对象的方法。让我们检查一个特定实例。以下是名为\
  \ `StringConversion` 的函数式接口的定义。它使用 `convert` 方法对字符串进行某种类型转换。\n\n```java\ninterface\
  \ StringConversion {\n    String convert(String input);\n}\n```\n\n![](img/image113.jpg)\n\
  \n以下是 `MethodReferenceExample` 类的定义，我们将在其中演示方法引用的使用。`main` 方法创建 `MethodReferenceExample`\
  \ 类的实例，使用方法引用符号将 `toUpperCase` 方法赋值给转换变量。然后使用 `convert` 方法将示例字符串转换为大写。`toUpperCase`\
  \ 方法定义在类的末尾。\n\n```java\npublic class MethodReferenceExample {\n    public static\
  \ void main(String[] args) {\n        MethodReferenceExample mre = new MethodReferenceExample();\n\
  \        StringConversion conversion;\n        conversion = mre::toUpperCase;\n\
  \        System.out.println(conversion.convert(\"sample string\"));\n    }\n\n \
  \   public String toUpperCase(String input) {\n        return input.toUpperCase();\n\
  \    }\n}\n```\n\n![](img/image114.jpg)\n\n输出如下：\n\n```\nSAMPLE STRING\n```\n\n\
  接下来的序列说明了如何使用类名使用方法引用。创建了一个字符串列表，然后使用 `Collections` 类的 `sort` 方法进行排序。第二次使用方法引用是作为\
  \ `forEach` 方法的参数。\n\n```java\nList<String> names = Arrays.asList(\"Sam\",\"Betty\"\
  ,\"Sue\",\"Bob\");\nCollections.sort(names, String::compareTo);\nnames.forEach(System.out::println);\n\
  ```\n\n![](img/image115.jpg)\n\n排序后的输出所示：\n\n```\nBetty\nBob\nSam\nSue\n```\n\n\
  ### 使用构造方法引用\n\n构造方法引用提供了一种创建对象的方便方法。构造方法引用的目标类型始终是一个函数式接口。构造方法引用的语法由类名、双冒号、然后关键字\
  \ `new` 组成。\n\n下面展示了构造方法引用的简单用法，其中我们创建一个 `ArrayList` 对象。`Supplier` 是 `java.util.function`\
  \ 包中的函数式接口。它的函数方法传递 `void` 并返回一个对象。我们能够将构造方法引用赋值给 `names` 变量，因为它期望一个 lambda 表达式。`names`\
  \ 数据类型是一个函数式接口。\n\n```java\nSupplier<List<String>> names = ArrayList::new;\n```\n\
  \n![](img/image116.jpg)\n\n以下是不合法的。因为在此上下不期望 lambda 表达式。它在寻找一个对象。`roster` 的数据类型是一个类。\n\
  \n```java\nArrayList<Employee> roster = ArrayList<Employee>::new;\n```\n\n![](img/image17.jpg)\n\
  \n更复杂的构造方法引用是可能的。为了演示这种用法，我们从一个简单的函数式接口开始：\n\n```java\ninterface SimpleInterface<T>\
  \ {\n    T create();\n}\n```\n\n![](img/image18.jpg)\n\n我们将使用以下类配合该接口：\n\n```java\n\
  class SomeClass {\n    private String message;\n    public SomeClass() {\n     \
  \   this.message = \"Default Constructor\";\n        System.out.println(\"+++SomeClass\
  \ Default Constructor\");\n    }\n    public String getMessage() {\n        return\
  \ message;\n    }\n}\n```\n\n![](img/image19.jpg)\n\n让我们从接口和类的声明开始：\n\n```\nSomeClass\
  \ sc;\nSimpleInterface<SomeClass> sci;\n```\n\n![](img/image20.jpg)\n\n我们可以使用构造方法引用创建一个\
  \ `SimpleInterface` 的实例，如下：\n\n```java\nsci = SomeClass::new;\n```\n\n![](img/image21.jpg)\n\
  \n当创建实例时，它将使用 `SomeClass` 的默认构造方法来支持 `create` 方法。默认构造方法的签名与 `create` 方法匹配。也就是说，它不传递参数并返回一个对象。记住构造方法会返回一个值，一个对象。\n\
  \n```示\n此代码序列产生以下输出。构造方法已被调用，消息已按预期设置。我们还可以使用默认构造方法以外的构造方法。以下接口将匹配一个返回 `T` 类型对象并接收某个对象\
  \ `U` 作为参数的构造方法：\n\n```java\ninterface ConstructorArgumentInterface<T, U> {\n  \
  \  T create(U arg);\n}\n```\n\n![](img/image22.jpg)\n\n如果我们在 `SomeClass` 中所示所示一个新的构造方法，我们将能够使用此接口：\n\
  \n```java\nclass SomeClass {\n    private String message;\n    public SomeClass(String\
  \ message) {\n        this.message = message;\n        System.out.println(\"+++SomeClass\
  \ String Constructor\");\n    }\n    public String getMessage() {\n        return\
  \ message;\n    }\n}\n```\n\n![](img/image23.jpg)\n\n以下说明了它的用法。构造方法引用创建 `ConstructorArgumentInterface`\
  \ 的实例。然后使用 `create` 方法创建 `SomeClass` 的实例。\n\n```java\nConstructorArgumentInterface<SomeClass,\
  \ String> cai;\ncai = SomeClass::new;\nsc = cai.create(\"ConstructorArgumentInterface\"\
  );\nSystem.out.println(sc.getMessage());\n```\n\n![](img/image24.jpg)\n\n此序列的输出遵循如下：\n\
  \n```\n+++SomeClass String Constructor\nConstructorArgumentInterface\n```\n\n一个使用\
  \ `List` 的更复杂的示例基于以下接口：\n\n```java\ninterface ConstructorListArgumentInterface<T,\
  \ U> {\n    T create(List<U> arg);\n}\n```\n\n![](img/image25.jpg)\n\n在 `SomeClass`\
  \ 中添加一个新的实例变量和构造方法以支持此接口：\n\n```java\nclass SomeClass {\n```\n\n\n\n\n```java\n\
  private String message;\n\nprivate List<String> list;\n\n…\n\npublic SomeClass(List<String>\
  \ list) {\n    this.list = list;\n    System.out.println(\"+++SomeClass List Constructor\"\
  );\n}\n\n…\n\n}\n```\n\n![](img/image127.jpg)\n\n这些新增内容的用法下所示。新的构造函数被用于支持 `ConstructorListArgumentInterface`\
  \ 的方法 `create`。一旦 `SomeClass` 对象被创建，将返回一个列表并向其中添加一个字符串。\n\n```java\nConstructorListArgumentInterface<SomeClass,\
  \ String> clai;\nclai = SomeClass::<String>new; \nsc = clai.create(new ArrayList<String>());\
  \        \n\nList<String> list;\nlist = sc.getList();\nSystem.out.println(list.size());\n\
  list.add(\"First String\");\nSystem.out.println(list.size());\n```\n\n![](img/image128.jpg)\n\
  \n输出如下：\n\n```\n+++SomeClass List Constructor\n0\n1\n```\n\n### 使用 Lambda 表达式\n\n\
  Lambda 表达式可以在多种上下文中使用，包括：\n\n- 将 Lambda 表达式赋值给变量\n- 将 Lambda 表达式作为参数传递给方法或构造函数\n\
  - 从方法返回 Lambda 表达式\n- 在三元运算符中使用 Lambda 表达式\n- 使用 Lambda 表达式初始化数组\n- 在 Lambda 表达式中抛出异常\n\
  - 强制转换 Lambda 表达式\n- 使用 Lambda 表达式实现递归\n\n我们已经在某些情况中看到过 Lambda 表达式的使用。在本节中，我们将重点关注特殊用法，例如它们与三元运算符配合使用，并解释它们如何抛出异常。\n\
  \n#### 在变量声明中使用 Lambda 表达式\n\n如果变量声明为与 Lambda 表达式兼容的类型，我们就可以将 Lambda 表达式赋值给变量。在下面的示例中，一个\
  \ Lambda 表达式被赋值给 `java.util.Comparator` 类型变量。该 Lambda 表达式被赋值给 `comparator` 变量。\n\
  \n```java\nList<Integer> list = Arrays.asList(-5, -3, 4);\nComparator<Integer> comparator\
  \ =\n(x, y) -> (x < y) ? -1 : ((x > y) ? 1 : 0);\nlist.sort(comparator);\nlist.forEach(e->System.out.println(e));\n\
  ```\n\n![](img/image129.jpg)\n\n当执行代码时，我们得到以下输出：\n\n```\n-5\n-3\n4\n```\n\n`Comparator`\
  \ 是一个函数接口，其函数描述符接受两个值，然后根据比较结果返回一个负整数、零或正整数。使用变量有助于明确表达式，并允许 Lambda 表达式在同一个程序的多个上下文中使用。在变量声明中使用\
  \ Lambda 表达式时，通过将声明与使用分离开来，也可以让 Lambda 表达式更易于读。\n\n## 将 Lambda 表达式作为返回值\n\n有时，返回一个可以在其他情况下使用的\
  \ Lambda 表达式是方便的。下面所示的 `getTest` 方法接收一个表示国家某个区域的字符串。它返回一个匹配 `Predicate` 函数型方法的 Lambda\
  \ 表达式。此 `Predicate` 的意图是判断重量是否超过该地区的限制。`Predicate` 接口将在“使用 Predicate 接口”章节中讨论。\n\
  \n```java\npublic static Predicate<Integer> getTest(String area) {\n    switch (area)\
  \ {\n        case \"north\":\n            return (Integer weight)->weight<200;\n\
  \        case \"south\":\n            return (Integer weight)->weight<150;\n   \
  \     case \"east\":\n            return (Integer weight)->weight<100;\n       \
  \ case \"west\":\n            return (Integer weight)->weight<250;\n        default:\n\
  \            return (Integer weight)->weight<200;\n    }\n}\n```\n\n![](img/image130.jpg)\n\
  \n下一个语句使用了权重为 320 的 Lambda 表达式：\n\n```java\nSystem.out.println(getTest(\"east\"\
  ).test(320));\n```\n\n![](img/image131.jpg)\n\n测试结果应返回 false。\n\n## 在 Lambda 表达式中使用异常\n\
  \nLambda 表达式不能抛出函数接口方法中指定的异常以外的异常。在下面的示例中，定义了一个 `TimeService` 接口，随后是一个使用 Lambda\
  \ 表达式实现该接口的类。\n\n```java\ninterface TimeService {\n    String getTime();\n}\n\n\
  public class ExceptionExamples {\n    public static void main(String arg[]) {\n\
  \        TimeService ts = ()-> {\n            if(*someCondition*) {\n          \
  \      throw new Exception();\n            }\n            return \"Time\";\n   \
  \     };\n        System.out.println(ts.getTime());\n    }\n}\n```\n\n![](img/image132.jpg)\n\
  \n然而，Lambda 表达式抛出了未在 `getTime` 方法中声明的异常。结果是在编译时将生成以下错误消息：\n\n`unreported exception\
  \ Exception; must be caught or declared to be thrown`\n\n可以通过在 `getTime` 方法中添加 `throws`\
  \ 子句来解决此问题，如下：\n\n```java\ninterface TimeService {\n    String getTime() throws\
  \ Exception;\n}\n```\n\n![](img/image133.jpg)\n\n由于 `getTime` 方法现在抛出一个未处理的异常，我们得到了以下错误消息：\n\
  \n`unreported exception Exception; must be caught or declared to be thrown`\n\n\
  我们可以通过将语句封装在 `try-catch` 块中，或者让 `main` 方法抛出异常来解决这个问题。\n\n#### 在三元运算符中使用 Lambda 表达式\n\
  \n为了演示在三元运算符内部使用 Lambda 表达式，我们将使用 `IntBinaryOperator` 接口，它位于 `java.util.function`\
  \ 包中。该包引入了许多函数式接口。`IntBinaryOperator` 的函数描述符是 `applyInt` 方法，它接受两个整数参数并返回整数结果。我们在下面使用三元运算符的\
  \ Lambda 表达式来选择不同的整数操作：\n\n```java\nString operation = \"add\";\nIntBinaryOperator\
  \ operationExpression =\n(\"sub\".equals(operation))? (x,y)->x-y : (x,y)->x+y;\n\
  System.out.println(operationExpression.applyInt(5, 4));\n```\n\n![](img/image134.jpg)\n\
  \n输出将为 9。\n\n## Lambda 表达式强制转换\n\n某些情况下需要强制转换 Lambda 表达式。考虑以下函数接口。它们都声明了接受字符串并返回\
  \ void 的抽象方法。\n\n```java\ninterface RectangleShape {\n    void draw(String s);\n\
  }\n\ninterface CircleShape {\n    void display(String s);\n}\n```\n\n![](img/image135.jpg)\n\
  \n在下面的类中，重载了 `doSomething` 方法。在 `main` 方法中，为 `doSomething` 方法传递了一个 Lambda 表达式。然而，由于\
  \ Lambda 表达式匹配两个接口的抽象方法，这是一个歧义情况。\n\n```java\npublic class CastingExample {\n  \
  \  public static void main(String ars[]) {\n        CastingExample ce = new CastingExample();\n\
  \        ce.doSomething((String s)->System.out.println(s));\n    }\n\n    public\
  \ void doSomething(RectangleShape shape) {\n    }\n\n    public void doSomething(CircleShape\
  \ shape) {\n    }\n}\n```\n\n![](img/image136.jpg)\n\n生成了以下错误消息：\n\n`reference to\
  \ doSomething is ambiguous`\n`both method doSomething(RectangleShape) in CastingExample\
  \ and method doSomething(CircleShape) in CastingExample match`\n\n可以使用强制转换运算符如下解决：\n\
  \n```java\nce.doSomething((RectangleShape)(String s)->System.out.println(s));\n\
  ```\n\n![](img/image137.jpg)\n\n## 使用 Lambda 表达式初始化数组\n\nLambda 表达式可以作为数组的元素。在下面我们创建一个\
  \ `Predicate` 数组。然后将每个元素初始化为表示特定重量范围的 Lambda 表达式。\n\n```java\nPredicate<Integer>[]\
  \ tests;\ntests = new Predicate[3];\ntests[0] = weight->weight>=0 && weight<100;\n\
  tests[1] = weight->weight>=100 && weight<200;\ntests[2] = weight->weight>=200 &&\
  \ weight<300;\nSystem.out.println(tests[1].test(125));\n```\n\n![](img/image138.jpg)\n\
  \n当代码执行时，输出将为 true。\n\n## 编写递归 Lambda 表达式\n\n可以创建递归 Lambda 表达式。然而，Lambda 表达式变量必须声明为实例或静态变量。它不能是局部变量。在下面的程序中，使用\
  \ `UnaryOperator` 接口定义了一个递归的斐波那契 Lambda 表达式。该接口位于 `java.util.function` 包。它的函数方法是\
  \ `apply` 方法，它接受单个参数并返回一个值。\n\n\n\n\n\n```java\npublic class RecursionExamples {\n\
  \    private static UnaryOperator<Integer> fibonacci;\n\n    public static void\
  \ main(String args[]) {\n        fibonacci = (Integer n) -> {\n            if (n\
  \ == 0 || n == 1) {\n                return 1;\n            } else {\n         \
  \       return fibonacci.apply(n - 1) + fibonacci.apply(n - 2);\n            }\n\
  \        };\n        System.out.println(fibonacci.apply(5));\n    }\n}\n```\n\n\
  ![](img/image139.jpg)\n\n输出结果为 8。\n\n### 使用 java.util.function 函数式接口\n\n为了方便使用 表达式，增加了\
  \ `java.util.function` 包。它包含了许多为解决常见计算操作设计的函数式接口。使用这些函数式接口让程序员无需自己声明等效的接口。此外，它有助于术语的标准化。在本节中，我们将检查其中的几个接口及其用途。\n\
  \n函数式接口经常表示抽象操作。表 3：函数类型总结了 `java.util.function` 包中的函数式接口及其预期用法。这些接口中的许多都具有默认方法，在函数方法之外增加了额外功能。例如，我们将在“使用\
  \ Consumer 接口”部分中看到 `andThen` 方法。\n\n本节中的几个示例使用了一个 `Employee` 类。该类拥有三个实例变量：`name`、`age`\
  \ 和 `payGrade`。第一个变量是 `String`，后两个是整数。该类为这些变量设置了 set 和 get 方法以及相应的构造函数。为了节省空间，仅列出了类的\
  \ `toString` 方法，如下所示：\n\n```java\npublic class Employee {\n    ...\n    public String\
  \ toString() {\n        return \"Name: \" + this.name + \" Age: \" + this.age +\
  \ \" Pay grade: \" + this.payGrade;\n    }\n}\n```\n\n![](img/image140.jpg)\n\n\
  **表 3：函数类型**\n\n| 函数式接口类型 | 用途 |\n| :--- | :--- |\n| **Predicate** | 这些接口执行测试并返回布尔值\
  \ |\n| **Function** | 此类型的接口对对其参数进行某种转换。函数方法不返回结果 |\n| **Consumer** | 这些接口接受输入但不返回任何内容。正如其名所示，它消耗其参数\
  \ |\n| **Supplier** | 供应商 类型的接口接收 void 并返回一个值 |\n| **Operator** | 通常用于归约类型操作 |\n\
  \n![](img/image141.jpg)\n\n### 使用 Predicate 接口\n\n该接口用于测试某些类型的情况，即评估某个函数并返回 true\
  \ 或 false 结果。它的函数描述符是 `test` 方法。向 `test` 函数传递一个参数并返回一个布尔值。\n\n```java\nboolean test(T\
  \ t)\n```\n\n![](img/image142.jpg)\n\n**表 4：Predicate 类型函数式接口**\n\n| 函数式接口 | 函数方法\
  \ |\n| :--- | :--- |\n| `Predicate<T>` | `boolean test(T t)` |\n| `BiPredicate<T,U>`\
  \ | `boolean test(T t, U u)` |\n| `DoublePredicate` | `boolean test(double value)`\
  \ |\n| `IntPredicate` | `boolean test(int value)` |\n| `LongPredicate` | `boolean\
  \ test(long value)` |\n\n![](img/image143.jpg)\n\n在许多需要简单测试的情况下。例如，我们可能想根据一个人的年龄判断其是否有资格参加某些活动。我们可以像下面这样这样一个测试：\n\
  \n```java\npublic boolean evaluate(int age) {\n    if (age > 18) {\n        return\
  \ true;\n    } else {\n        return false;\n    }\n}\n```\n\n![](img/image144.jpg)\n\
  \n我们可以通过如下方式调用 `evaluate` 方法来确定个人是否符合：\n\n```java\nSystem.out.println(\"Person is\
  \ eligible: \" + evaluate(19));\n```\n\n![](img/image145.jpg)\n\n输出将如下：\nPerson\
  \ is eligible: true\n\n如果我们需要更改条件，就需要重写 `evaluate` 函数。不同情况可能还需要需要不同的标准集。例如，我们可能想根据一个人的年龄和体重测试其是否符合兵役条件。在另一种情况下，我们可能想测试某人是否符合社会福利。这些示例暗示需要两个或多个类似\
  \ evaluate 的方法。我们可以通过使用 `Predicate` 函数式接口来简化这一过程。\n\n在下面的代码序列中，声明了一个 `Predicate`\
  \ 并分配了一个 lambda 表达式，该表达式执行与上一个示例相同的测试。这里我们使用了 `Predicate` 函数式接口。\n\n```java\nPredicate<Integer>\
  \ tester = age -> age > 18;\nSystem.out.println(\"Person is eligible: \" + tester.test(19));\n\
  ```\n\n![](img/image146.jpg)\n\n结果将与之前的示例相同。下面显示了一个等效版本，它显式地创建了 `Predicate` 变量：\n\
  \n```java\nPredicate<Integer> tester = age -> age > 18;\nSystem.out.println(\"Person\
  \ is eligible: \" + tester.test(19));\n```\n\n![](img/image147.jpg)\n\n我们现在对列表使用\
  \ `Predicate`。在下面的示例中，创建了一个列表并用 `Employee` 实例初始化它。\n\n```java\nList<Employee> list\
  \ = Arrays.asList(\n    new Employee(\"Mary\", 23, 12),\n    new Employee(\"Tom\"\
  , 32, 12),\n    new Employee(\"Sam\", 19, 5),\n    new Employee(\"Sue\", 43, 2)\n\
  );\nPredicate<Integer> tester = age -> age >= 21 && age <= 35;\nfor (Employee element\
  \ : list) {\n    if (tester.test(element.getAge())) {\n        System.out.println(element.getName()\
  \ + \" is eligible\");\n    }\n}\n```\n\n![](img/image149.jpg)\n\n该序列的输出如下：\nMary\
  \ is eligible\nTom is eligible\n\n接下来的示例说明如何将 `Predicate` 作为函数的参数。该函数计算列表中符合选择标准的元素之和。\n\
  \n```java\npublic int sumElements(List<Employee> numList, Predicate<Integer> predicate)\
  \ {\n    int sum = 0;\n    for (Employee number : numList) {\n        if (predicate.test(number.getAge()))\
  \ {\n            sum += number.getAge();\n        }\n    }\n    return sum;\n}\n\
  ```\n\n我们使用以下语句测试该方法：\n\n```java\nSystem.out.println(sumElements(list, age >= 21));\n\
  ```\n\n![](img/image151.jpg)\n\n答案将是 98。\n\n基于此模式，我们可以轻松地使用 lambda 表达式进行其他测试。下面展示了如何根据不同的标准显示员工列表。`displayList`\
  \ 方法接收一个 `List` 和一个用于员工选择的 `Predicate`。只有通过测试的员工会被显示。\n\n```java\npublic void displayList(List<Employee>\
  \ list, Predicate<Employee> function) {\n    for (Employee employee : list) {\n\
  \        if (function.test(employee)) {\n            System.out.println(employee);\n\
  \        }\n    }\n}\n```\n\n此代码序列说明了该方法的用法：\n\n```java\nPredicate<Employee> condition\
  \ = (Employee e) -> e.getAge() >= 21;\ndisplayList(list, condition);\n```\n\n![](img/image153.jpg)\n\
  \n该序列的输出如下：\nName: Mary  Age: 23  Pay grade: 12\nName: Tom  Age: 32  Pay grade:\
  \ 12\nName: Sue  Age: 43  Pay grade: 2\n\n我们可以通过使用不同的选择标准轻松地显示不同的列表：\n\n```java\n\
  displayList(list, (Employee e) -> e.getPayGrade() < 13 && e.getAge() >= 30);\ndisplayList(list,\
  \ (Employee e) -> e.getName().contains(\"Sue\"));\n```\n\n`Collection` 接口在 Java\
  \ 8 中增加了一个方法。该方法将移除集合中所有满足其 `Predicate` 参数的元素。如果删除了元素，则返回 true，否则返回 false。如果集合的迭代器无法移除元素，则抛出\
  \ `UnsupportedOperationException` 异常。\n\n\n\n\n在下面的示例中，创建了一个 `List`，然后对其应用了 `removeIf`\
  \ 方法。它将移除任何年龄大于 30 的员工。\n\n```java\nList<Employee> list = new ArrayList();\n\nlist.add(new\
  \ Employee(\"Mary\", 23, 12));\n\nlist.add(new Employee(\"Tom\", 32, 12));\n\nlist.add(new\
  \ Employee(\"Sam\", 19, 5));\n\nlist.add(new Employee(\"Sue\", 43, 2));\n\nlist.removeIf((e)->e.getAge()>30);\n\
  \nlist.forEach((e)->System.out.println(e));\n```\n\n![](img/image155.jpg)\n\n输出所示：\n\
  \nName: Mary  Age: 23  Pay grade: 12\nName: Sam  Age: 19  Pay grade: 5\n\n`Predicate`\
  \ 接口仅限于单个参数。如果我们想使用两个参数进行测试，可以使用 `BiPredicate` 函数式接口。\n\n### 使用函数式接口\n\n`Function`\
  \ 接口使用泛型 `T` 作为输入值并返回 `R`。这本质上是一个执行某种转换的函数。它的函数式方法是 `apply` 方法：\n\n```java\nR apply(T\
  \ t)\n```\n\n![](img/image156.jpg)\n\n表 5：函数类型函数式接口列出了函数类型的函数式接口及其函数式方法。\n\n***表\
  \ 5：函数类型函数式接口***\n\n| 函数式接口 | 函数式方法 |\n| :--- | :--- |\n| `Function<T,R>` | `R apply(T\
  \ t)` |\n| `BiFunction<T,U,R>` | `R apply(T t, U u)` |\n| `DoubleFunction<R>` |\
  \ `R apply(double value)` |\n| `DoubleToIntFunction` | `int applyAsInt(double value)`\
  \ |\n| `DoubleToLongFunction` | `long applyAsLong(double value)` |\n| `IntFunction<R>`\
  \ | `R apply(int value)` |\n| `IntToDoubleFunction` | `double applyAsDouble(int\
  \ value)` |\n| `IntToLongFunction` | `long applyAsLong(int value)` |\n| `LongFunction<R>`\
  \ | `R apply(long value)` |\n| `LongToDoubleFunction` | `double applyAsDouble(long\
  \ value)` |\n| `LongToIntFunction` | `int applyAsInt(long value)` |\n| `ToDoubleBiFunction<T,U>`\
  \ | `double applyAsDouble(T t, U u)` |\n| `ToDoubleFunction<T>` | `double applyAsDouble(T\
  \ value)` |\n| `ToIntBiFunction<T,U>` | `int applyAsInt(T t, U u)` |\n| `ToIntFunction<T>`\
  \ | `int applyAsInt(T value)` |\n| `ToLongBiFunction<T,U>` | `long applyAsLong(T\
  \ t, U u)` |\n| `ToLongFunction<T>` | `long applyAsLong(T value)` |\n\n![](img/image157.jpg)\n\
  \n下例说明了如何使用此接口将数字的大小翻倍。声明了一个类型为 `Function` 的变量 `doubleValue`，该表达式接受一个整数并返回一个整数。然后使用\
  \ 4 执行了 `apply` 方法。\n\n```java\nFunction<Integer, Integer> doubleValue = x -> 2\
  \ * x;\n\nSystem.out.println(doubleValue.apply(4));\n```\n\n![](img/image158.jpg)\n\
  \n下例将一个整数转换为布尔值。如果数字大于 100，则返回 true，否则返回 false。在这种情况下返回了 true。\n\n```java\nFunction<Integer,\
  \ Boolean> booleanValue = x -> x > 100;\n\nSystem.out.println(booleanValue.apply(150));\n\
  ```\n\n![](img/image159.jpg)\n\n一个更复杂的示例获取 `Employees` 列表并返回它们的年龄加一的列表。`getAgeList`\
  \ 方法使用了 `Employees` 的 `List` 和一个执行实际转换的 `Function` 表达式。\n\n```java\npublic List<Integer>\
  \ getAgeList(\nList<Employee> list,\nFunction<Employee, Integer> function) {\n \
  \   List<Integer> ageList = new ArrayList<>();\n    for (Employee employee : list)\
  \ {\n    ageList.add(function.apply(employee));\n    }\n    return ageList;\n}\n\
  ```\n\n![](img/image160.jpg)\n\n使用以下代码序列创建一个列表：\n\n```java\nList<Employee> list\
  \ = Arrays.asList(\nnew Employee(\"Mary\", 23, 12),\nnew Employee(\"Tom\", 32, 12),\n\
  new Employee(\"Sam\", 19, 5),\nnew Employee(\"Sue\", 43, 2));\n```\n\n![](img/image161.jpg)\n\
  \n然后使用简单的 lambda 表达式执行 `getAgeList` 方法，该表达式在员工年龄上加 1：\n\n```java\nList<Integer>\
  \ ageList =\ngetAgeList(list, e -> e.getAge() + 1);\n\nageList.forEach(x -> System.out.println(x));\n\
  ```\n\n![](img/image162.jpg)\n\n输出如下：\n\n24\n33\n20\n44\n\n为了使函数更灵活，以下版本使用了泛型：\n\
  \n```java\npublic <T, U> List<U> getAgeListType(List<T> list,\nFunction<T, U> function)\
  \ {\n    List<U> newList = new ArrayList<>();\n    for (T element : list) {\n  \
  \  newList.add(function.apply(element));\n    }\n    return newList;\n}\n```\n（注：后续重复的段落已按要求省略）\n\
  \n\n\n\n`forEach` 方法也可以在 `ArrayList` 实例上执行。下面的示例说明了这种用法。\n\n```java\nArrayList<Employee>\
  \ employeeList = new ArrayList<Employee>();\nemployeeList.add(new Employee(\"Mary\"\
  , 23, 12));\nemployeeList.add(new Employee(\"Tom\", 32, 12));\nemployeeList.add(new\
  \ Employee(\"Sam\", 19, 5));\nemployeeList.add(new Employee(\"Sue\", 43, 2));\n\
  employeeList.forEach((e) -> System.out.println(e));\n```\n\n![](img/image177.jpg)\n\
  \n输出如下：\n\nName: Mary  Age: 23  Pay grade: 12 \nName: Tom  Age: 32  Pay grade: 12\n\
  Name: Sam  Age: 19  Pay grade: 5\nName: Sue  Age: 43  Pay grade: 2\n\nJava 8 在 `Iterator`\
  \ 接口中增加了一个 `forEachRemaining` 方法。它的参数是一个 `Consumer`，该方法会将该 `Consumer` 应用于集合的剩余元素。在下面的示例中演示了该方法，前两个员工被完整显示。然而，一旦员工的年龄超过\
  \ 30，则只显示其年龄。\n\n```java\nIterator<Employee> iterator = employeeList.iterator();\n\
  while(iterator.hasNext()) {\n    Employee employee = iterator.next();\n    System.out.println(employee);\n\
  \    if(employee.getAge()>30) {\n        iterator.forEachRemaining((e)->System.out.println(e.getAge()));\n\
  \    }\n}\n```\n\n![](img/image178.jpg)\n\n输出如下：\n\nName: Mary  Age: 23  Pay grade:\
  \ 12\nName: Tom  Age: 32  Pay grade: 12\n19\n43\n\n### 使用 Supplier 接口\n\n在需要产生对象且\
  \ Lambda 表达式有助于支持创建时，该接口非常有用。该函数返回一个新对象或现有对象。接口的功能方法是 `get` 方法。\n\n```java\nT get()\n\
  ```\n\n![](img/image179.jpg)\n\n表 7：函数类型函数式接口列出了 `Supplier` 类型函数式接口及其功能方法。\n\n|\
  \ 函数式接口 | 功能方法 |\n| :--- | :--- |\n| `Supplier<T>` | `T get()` |\n| `BooleanSupplier`\
  \ | `boolean getAsBoolean()` |\n| `DoubleSupplier` | `double getAsDouble()` |\n\
  | `IntSupplier<R>` | `R apply(int value)` |\n| `LongSupplier` | `long getAsLong()`\
  \ |\n\n![](img/image180.jpg)\n\n在最简单的形式，我们可以定义一个可以返回新 `Employee` 的 `Supplier`，如下所示。第一个赋值语句使用了\
  \ Lambda 表达式，而第二个使用了构造方法引用。\n\n```java\nSupplier<Employee> employeeSupplier;\nemployeeSupplier\
  \ = () -> new Employee();\nemployeeSupplier = Employee::new;\n```\n\n![](img/image181.jpg)\n\
  \n并没有创建 `Employee` 对象，只创建了 `Supplier` 函数式接口的实例。要创建 `Employee` 对象，我们需要使用 `get` 方法，如下所示：\n\
  \n```java\nEmployee employee = employeeSupplier.get();\n```\n\n![](img/image182.jpg)\n\
  \n下面展示了一个更复杂的示例，它将根据 `Employees` 列表创建一组随机的 `Employee` 对象。创建了一个 `Random` 类实例，用于从列表中随机选择员工。Lambda\
  \ 表达式使用 `nextInt` 方法从列表中随机选择一个员工。\n\n```java\nRandom r = new Random();\nList<Employee>\
  \ employeeList = Arrays.asList(\n    new Employee(\"Mary\", 23, 12),\n    new Employee(\"\
  Tom\", 32, 12),\n    new Employee(\"Sam\", 19, 5),\n    new Employee(\"Sue\", 43,\
  \ 2));\n\nSupplier<Employee> randomEmployee;\nrandomEmployee = () -> {\n    int\
  \ index = r.nextInt(employeeList.size());\n    return employeeList.get(index);\n\
  };\n\nfor(int i=0; i<5; i++) {\n    System.out.println(randomEmployee.get());\n\
  }\n```\n\n![](img/image183.jpg)\n\n一种可能的输出如下：\n\nName: Mary  Age: 23  Pay grade:\
  \ 12\nName: Mary  Age: 23  Pay grade: 12\nName: Sam  Age: 19  Pay grade: 5\nName:\
  \ Mary  Age: 23  Pay grade: 12\nName: Sam  Age: 19  Pay grade: 5\n\nLambda 表达式可以同样地随机生成\
  \ `Employee` 对象，这对于测试目的很有用。测试完成后，可以使用真实的生成器来替代它。\n\n这里有一个将 `Supplier` 对象传递给方法的示例。其目的是生成一个随机员工并将其薪资等级增加一。使用\
  \ `Consumer` 函数式接口来执行实际的转换。此操作的 Lambda 表达式如下所示：\n\n```java\nConsumer<Employee> consumer\
  \ = (Employee e) -> {\n    e.setPayGrade(e.getPayGrade() + 1);\n};\n```\n\n![](img/image184.jpg)\n\
  \n使用 `convert` 方法将生产者和消费者连接起来：\n\n```java\npublic static Employee convert(\n   \
  \ Consumer<Employee> consumer,\n    Supplier<Employee> supplier) {\n    Employee\
  \ e = supplier.get();\n    consumer.accept(e);\n    return e;\n}\n```\n\n![](img/image185.jpg)\n\
  \n下面的语句说明了该方法的使用：\n\n```java\nSystem.out.println(convert(consumer,randomEmployee));\n\
  ```\n\n![](img/image186.jpg)\n\n一种可能的输出如下：\n\nName: Mary  Age: 23  Pay grade: 12\n\
  \n### 使用运算符接口\n\n运算符接口关注于对一个或两个操作数应用操作。对于二元运算符，它并不是特定的类型，而是一系列接口。表 8：运算符类型函数式接口列出了运算符类型函数式接口及其功能方法。\n\
  \n| 函数式接口 | 功能方法 |\n| :--- | :--- |\n| `BinaryOperator<T>` | `T apply(T t, T u)`\
  \ (BiFunction) |\n| `DoubleBinaryOperator` | `double applyAsDouble(double left,\
  \ double right)` |\n| `DoubleUnaryOperator` | `double applyAsDouble(double operand)`\
  \ |\n| `IntBinaryOperator` | `int applyAsInt(int left, int right)` |\n| `IntUnaryOperator`\
  \ | `int applyAsInt(int operand)` |\n| `LongBinaryOperator` | `long applyAsLong(long\
  \ left, long right)` |\n| `LongUnaryOperator` | `long applyAsLong(long operand)`\
  \ |\n\n![](img/image187.jpg)\n\n`UnaryOperator` 接口扩展了 `Function` 接口并继承了 `apply`\
  \ 方法。在下面的示例中，创建了一个 Lambda 表达式，接收字符串并返回指示字符串中字符数量的格式化字符串：\n\n```java\nUnaryOperator<String>\
  \ stringCount = (String x) -> \"\\\"\" + x + \"\\\" has \" + x.length() + \" characters\"\
  ;\nSystem.out.println(stringCount.apply(\"Simple String\"));\n```\n\nJava 8 在 `List`\
  \ 接口中增加了一个 `replaceAll` 方法。它通过对列表每个元素应用 `UnaryOperator`。为了演示该方法，让我们从以下声明开始：\n\n\
  ```java\nList<Employee> list = new ArrayList();\nlist.add(new Employee(\"  Mary\"\
  , 23, 12));\nlist.add(new Employee(\"Tom  \", 32, 12));\nlist.add(new Employee(\"\
  \  Sam  \", 19, 5));\nlist.add(new Employee(\"  Sue\", 43, 2));\n\nUnaryOperator<Employee>\
  \ trimNames = (Employee e) -> {\n    Employee emp = new Employee(e);\n    emp.setName(e.getName().trim());\n\
  \    return emp;\n};\n```\n\n![](img/image189.jpg)\n\n以前，需要使用迭代器来替换列表中的元素，类似于：\n\
  \n```java\nfinal ListIterator<Employee> listIterator = list.listIterator();\nwhile\
  \ (listIterator.hasNext()) {\n    listIterator.set(trimNames.apply(listIterator.next()));\n\
  }\nlist.forEach((e) -> System.out.println(e));\n```\n\n![](img/image190.jpg)\n\n\
  该序列的输出如下：\n\nName: Mary  Age: 23  Pay grade: 12\nName: Tom  Age: 32  Pay grade:\
  \ 12\nName: Sam  Age: 19  Pay grade: 5\nName: Sue  Age: 43  Pay grade: 2\n\n现在我们可以使用\
  \ `replaceAll` 方法更简洁地执行相同的操作，如下所示：\n\n```java\nlist.replaceAll(trimNames);\nlist.forEach((e)\
  \ -> System.out.println(e));\n```\n\n![](img/image191.jpg)\n\n### 使用 BinaryOperator\
  \ 接口\n\n此函数式接口本质上与 `BiFunction` 相同，只是所有参数的类型相同。它派自 `BiFunction`。如下所示，它接收两个 T 并返回单个\
  \ T。它适用于归约类型操作。\n\n```java\nR apply(T t, T u)\n```\n\n![](img/image192.jpg)\n\n\n\
  \n\n以下序列为 `BinaryOperator` 创建了两个 lambda 表达式。第一个 lambda 表达式用于加法，第二个用于减法。\n\n```java\n\
  BinaryOperator<Integer> addition = (a, b) -> a + b;\nBinaryOperator<Integer> subtraction\
  \ = (a, b) -> a - b;\n```\n\n![](img/image193.jpg)\n\n`operateBinary` 接收 lambda\
  \ 表达式并对参数进行操作：\n\n```java\npublic int operateBinary(int a, int b, BinaryOperator<Integer>\
  \ op) {\n    return op.apply(a, b);\n}\n```\n\n![](img/image194.jpg)\n\n然后如下所示，使用每个\
  \ lambda 表达式执行函数：\n\n```java\nSystem.out.println(\"40 + 2 = \" + operateBinary(40,\
  \ 2, addition));\nSystem.out.println(\"20 - 10 = \" + operateBinary(20, 10, subtraction));\n\
  ```\n\n![](img/image195.jpg)\n\n输出如下：\n40 + 2 = 42\n20 - 10 = 10\n\n### 结论\n\n在本章中，我们看到了如何使用\
  \ lambda 表达式来支持 Java 中的函数式编程。Lambda 表达式本质上是匿名函数，与函数式接口配合使用。\n\nLambda 可以在许多不同的上下文中使用。它们可以作为方法的参数传递或返回。它们可以赋值给变量或数组，以便复用。Lambda\
  \ 表达式还可以被编写以支持递归算法。\n\n在 Java 8 中，添加了一个新包 `java.util.function`。该包包含了大量的函数式接口，支持转换和谓词类型操作等常用操作。我们将在后续章节中看到更多关于\
  \ lambda 表达式使用的示例。\n\n***\n\n# 第 3 章 – 流 (Streams)\n\n## 流 (Streams)\n### 流的特性\n\
  - 流不存储元素\n- 流可以是无界的\n- 流不修改原始源\n- 流可以是有序的\n- 自动并行化\n\n#### 流方法概述\n## 创建流\n- 使用 `Stream`\
  \ 接口的 `of` 方法\n- 使用 `Collection` 类的 `stream` 方法\n- 使用 `Stream.Builder` 接口\n- 使用\
  \ `builder` 方法\n### 生成无限流\n- 使用 `iterate` 方法\n### 合并流\n### 生成空流\n##### 使用流方法\n-\
  \ `Part` 示例类\n- 使用 `forEach` 方法\n- 使用 `forEachOrdered` 方法\n- 使用 `map` 方法\n- 使用其他\
  \ `Map` 方法\n- 使用 `flatMap` 方法\n- 使用 `filter` 方法\n- 使用 `Match` 类型方法\n- 使用 `findFirst`\
  \ 方法\n- 使用 `findAny` 方法\n- 使用 `Optional` 类\n- 使用 `reduce` 方法\n- 使用 `Collector` 接口和\
  \ `collect` 方法\n- 使用 `Collects` 类\n- 使用 `iterator` 方法\n- 使用 `sorted` 方法\n- 使用 `distinct`\
  \ 方法\n- 使用 `limit` 方法\n- 使用 `skip` 方法\n- 使用 `max`, `min` 和 `count` 方法\n##### 原始类型的流\n\
  - 使用 `IntStream` 接口\n##### 理解惰性计算与 eager 求值\n- 使用短路方法\n##### 使用并行流操作\n### 结论\n\n\
  ## 流 (Streams)\n流可以被视为元素的序列，可以逐个元素进行处理。流的元素可以是任何数据类型。流与数组或集合的区别在于它们不是数据结构。它们不占用永久内存，而且是瞬态的。\n\
  \n流中元素的处理是通过对流元素执行方法完成的。流将这些方法调用链在一起。一个流方法的输出被馈或链到另一个方法。这有时被称为`流式链` (`fluent chaining`)。这些方法会在流上执行某些操作，例如从流中删除某些元素或将一种元素类型转换为另一种类型。流本质上是对象集合的包装器。许多流操作使用了第\
  \ 2 章介绍的 lambda 表达式。\n\n不要将流的概念与 `java.io` 包中的输入输出流（IO streams）混淆。它们是不同的概念。IO 流通常被视为字节序列。\n\
  \nJava 8 添加了 `java.util.stream` 包。该包主要由接口组成`Stream` 接口以及实现该接口的对象为流的实现提供了支持。\n\n\
  使用流有两个主要优势：\n- 它们比等集合实现更简洁\n- 它们具有通过利用多处理器提高性能的潜力\n\n流使用的代码比使用如 `iterator` 方法等旧技术的代码更简洁。以下展示了列出价格超过\
  \ 0.15 的部分的两种方法。第一种使用迭代器，第二种方法使用流。流的方法更短且更容易理解。`filter` 方法将移除那些不符合 `predicate`（谓词）指定的元素。谓词在第\
  \ 2 章中讨论过。`forEach` 方法会对每个元素应用 `println` 方法。\n\n```java\n// 迭代器方法\nList<Part> partsList\
  \ = ...\nIterator<Part> partsIterator = partsList.iterator();\nwhile(partsIterator.hasNext())\
  \ {\n    Part part = partsIterator.next();\n    if(part.getPrice() >= 0.15f) {\n\
  \        System.out.println(part);\n    }\n}\n\n// 流方法\nStream<Part> partsStream\
  \ = partsList.stream();\nPredicate<Part> pricePredicate = p -> p.getPrice() > 0.15f;\n\
  partsStream.filter(pricePredicate).forEach(System::out::println);\n```\n\n![](img/image196.jpg)\n\
  \n使用流而不是集合意味着：\n- 无需显式声明中间变量或存储\n- 惰性计算的潜力\n- 设计上具灵活性\n- 自动并行化的潜力\n\n\n\n流（Streams）不存储元素。由于流不是数据结构，因此没有需要存储数据。这与存储数据的集合（collections）形成对比。流的元素是从某个源获取并进行处理的。处理完成后，流就会消失。除非元素被移动到与流独立的数组或集合中，否则它们也将随之消失。\n\
  \n当流被处理后，无法再通过该流获取其元素。该流无法被重用。然而，在大多数情况下，它可以重新生成。\n\n## 流可以是无界的\n\n集合的大小是有限的，而流是无界的。一个流可以包含从零到无限数量的元素。正如我们在“生成无限流”中看到的那样，可以使用几种技术生成无限流。虽然不是真正的无限，但根据需要，流可以运行很长的一段时间。\n\
  \n流作用在值的序列上。一个生成器（generator）可以创建这些值，并将它们输入流中进行处理。流的长度可以是任意长度，并被认为是无界的。\n\n## 流不会修改原始源\n\
  \n流的元素源通常源于列表或数组等数据结构。因此，针对流及其元素的操作不会在原始数据结构的元素上执行。此外，流不会修改原始源。\n\n## 流可以是有序的\n\n\
  流是有序的或无序的。当从数组、`List` 或某些生成器函数创建流时，该流是有序流。相比之下，从 `Set` 产生的流是非序的。这并不意味着流是按照字母顺序等标准排序的。相反，它像一个队列，先进入的元素先处理。\n\
  \n对于有序流，大多数操作将保留原始顺序。`sorted` 方法不保留原始顺序，而是强制实施一种新顺序。`unordered` 方法也会移除流的顺序。出于性能考虑，在与某些并行操作配合时，无序流是有吸引的。\n\
  \n## 自动并行化\n\n流有两种模式：顺序（sequential）和并行（parallel）。当指定为并行时，流的处理将根据可用处理器的数量自动并发执行。程序员不需要显式地设置多个线程。这将在“使用并行流操作”中讨论。\n\
  \n## 流方法概览\n\n流的方法可以分为中间方法（intermediary）或终端方法（terminal）。对于中间方法，该方法的输出被传递给另一个方法。也就是说，它们返回另一个流。对于终端方法，流结束并产生结果。它代表了管道（pipeline）的结束。管道由一个源、零或多个中间操作和一个终端操作组成。一旦管道终止，就无法再次使用。中间方法通常是惰求的（lazily）。这一概念在“理解惰性与急求评估”中被进一步探讨。\n\
  \n中间方法可以进一步分类为无状态（stateless）或状态（stateful）。无状态方法将简单将其结果传递给管道中的下一个元素。有状态方法将捕获某些数据并在继续之前可能等待更多数据。\n\
  \n表 1 - Select 定流方法总结列了一组 `Stream` 接口方法。这些将在后面的子节中讨论。\n\n### 表 1 - Select 定流方法总结\n\
  \n#### 中间方法\n\n| 方法 | 目的 | 返回值 |\n| :--- | :--- | :--- |\n| `filter` | 返回包含匹配 `Predicate`元素的流\
  \ | `Stream<T>` |\n| `map` | 对流中的每个元素应用操作，可能对其转换 | `Stream<U>` |\n| `flatMap` |\
  \ 扁平化流 | `Stream<R>` |\n| `sorted` | 对流的元素进行排序 | `Stream<T>` |\n| `distinct` | 返回一个不包含重复元素的流\
  \ | `Stream<T>` |\n| `limit` | 限制返回流中的元素数量 | `Stream<T>` |\n| `skip` | 跳过流中指定数量的元素\
  \ | `Stream<T>` |\n\n#### 终端方法\n\n| 方法 | 目的 | 返回值 |\n| :--- | :--- | :--- |\n| `forEach`\
  \ | 对流的每个元素执行某些操作并终止流 | `void` |\n| `reduce` | 使用 `BinaryOperator` 组合流元素 | `T` |\n\
  | `collect` | 将流的元素放入容器（如 `Collection`）中 | `R` |\n| `min` | 找到由 `Comparator` 指定的最小元素\
  \ | `Optional<T>` |\n| `max` | 找到由 `Comparator` 指定的最大元素 | `Optional<T>` |\n| `count`\
  \ | 确定流中的元素数量 | `long` |\n| `anyMatch` | 确定流中是否至少有一个元素匹配 `Predicate` | `boolean`\
  \ |\n| `allMatch` | 确定流中的每个元素是否都匹配 `Predicate` | `boolean` |\n| `noneMatch` | 确定流中是否没有元素匹配\
  \ `Predicate` | `boolean` |\n| `findFirst` | 返回流的第一个元素 | `T` |\n| `findAny` | 返回流的任意一个元素\
  \ | `T` |\n| `iterator` | 返回流的 `Iterator` | `Iterator` |\n| `toArray` | 根据流的元素创建数组\
  \ | `A[]` |\n\n![](img/image197.jpg)\n\n## 创建流\n\n在使用流之前，必须先创建它。有多种创建流的方法，包括从列表或数组等数据结构创建。`Stream`\
  \ 接口的许多方法返回 `Stream` 对象。这是一项重要功能，并允许 `Stream` 方法的“链式调用”。\n\n\n\n在下一个示例中，创建了一个 `Parts`\
  \ 列表。然后对此列表应用 `stream` 方法，并显示生成的流。\n\n```java\nList<Part> partsList = Arrays.asList(\n\
  \    new Part(\"Pencil\", 100, 5, 0.15f, 500),\n    new Part(\"Eraser\", 200, 3,\
  \ 0.25f, 250),\n    new Part(\"Paper\", 2000, 1, 0.03f, 1200)\n);\n\nStream<Part>\
  \ partsStream = partsList.stream();\npartsStream.forEach(p -> System.out.println(p));\n\
  ```\n\n![](img/image203.jpg)\n\n输出如下：\n\nName: Pencil   Weight:   5  Part Number:\
  \  100 Price: 0.15\nName: Eraser   Weight:   3  Part Number:  200 Price: 0.25\n\
  Name: Paper    Weight:   1  Part Number:  2000 Price: 0.03\n\n`stream` 方法也可以应用于\
  \ `Arrays` 类，如下所示：\n\n```java\nint[] nums = {2, 4, 6, 8};\nIntStream intStream =\
  \ Arrays.stream(nums);\nintStream.forEach(x -> System.out.print(x));\n```\n\n![](img/image204.jpg)\n\
  \n该序列的输出如下：\n\n2 4 6 8\n\n### 使用 Stream.Builder 接口\n\n流也可以使用 `Stream.Builder` 接口的实例来创建。该接口使用\
  \ `accept` 方法向流中添加元素。`build` 方法返回该流。\n\n在下面的示例中，声明了一个实现 `Stream.Builder` 接口的类 `SampleStreamBuilder`。该类使用一个列表来维护要添加到流中的项集合。`accept`\
  \ 方法将新元素添加到列表中。`build` 方法使用 `Collection` 接口的 `stream` 方法来创建实际流。\n\n```java\nclass\
  \ SampleStreamBuilder implements Stream.Builder<String> {\n    List<String> list\
  \ = new ArrayList<String>();\n\n    @Override\n    public void accept(String t)\
  \ {\n        list.add(t);\n    }\n\n    @Override\n    public Stream<String> build()\
  \ {\n        return list.stream();\n    }\n}\n```\n\n![](img/image205.jpg)\n\n接下来的代码序列创建了\
  \ `SampleStreamBuilder` 的实例，并使用 `accept` 方法将字符串添加到内部列表中。然后调用 `build` 方法返回该流。使用 `forEach`\
  \ 方法显示流的内容。\n\n```java\nSampleStreamBuilder streamBuilder = new SampleStreamBuilder();\n\
  streamBuilder.accept(\"Bob\");\nstreamBuilder.accept(\"Sue\");\nstreamBuilder.accept(\"\
  Mary\");\nStream<String> stream = streamBuilder.build();\nstream.forEach((s)->System.out.println(s));\n\
  ```\n\n![](img/image206.jpg)\n\n输出如下：\n\nBob\nSue\nMary\n\n### 使用 builder 方法\n\n\
  `Stream` 接口还有一个静态方法 `builder`，它返回一个 `Stream.Builder` 实例。这个方便方法在下文中用于复制之前的示例：\n\n\
  ```java\nStream.Builder streamBuilder = Stream.builder();\nstreamBuilder.accept(\"\
  Bob\");\nstreamBuilder.accept(\"Sue\");\nstreamBuilder.accept(\"Mary\");\nStream<String>\
  \ stream = streamBuilder.build();\nstream.forEach((s) -> System.out.println(s));\n\
  ```\n\n![](img/image207.jpg)\n\n执行此序列时的输出将与之前的示例相同。\n\n### 生成无限流\n\n无限流是指理论上至少会产生无限数量元素的流。生成无限流的一种方法是基于键盘输入，如下所示。这种方法使用了\
  \ `Stream` 接口的 `generate` 方法。该方法使用一个 `Supplier` 函数式接口的实现作为参数。输入行中的每个单词都用反斜杠分隔显示。\n\
  \n```java\nScanner scanner = new Scanner(System.in);\nSupplier<String> cliSupplier\
  \ = () -> {\n    return scanner.next();\n};\n\nStream.generate(cliSupplier).\n \
  \   forEach((c) -> System.out.print(c+\"\\\\\"));\n```\n\n![](img/image208.jpg)\n\
  \n`supplier` 是输入源。在这种情况下，它是键盘。用户将逐行输入数据。一种可能的输入/输出序列如下：\n\nOnce upon a time\nOnce\\\
  upon\\a\\time\\\nThere was a giant tree\nThere\\was\\a\\giant\\tree\\\n\n### 使用\
  \ iterate 方法\n\n`Stream` 接口的静态 `iterate` 方法可以用于生成无限流。该方法使用两个参数：初始种子（seed）和一个用于生成下一个元素的\
  \ `UnaryOperator` 函数。下面的示例显示了字母表的大写和小写字母。在这个示例中，种子是一个 `char`，操作符将其递增 1。在“使用 map\
  \ 方法”中讨论的 `map` 方法将 `char` 转换为包含大小小写字母的字符串。`limit` 方法将输出限制为 26 个元素。\n\n```java\n\
  Stream.iterate('a', c -> c++).\n    map(c -> c.toString() + \" \" + c.toString().toUpperCase()).\n\
  \    limit(26).\n    forEach(c -> System.out.print(c + \" \"));\n```\n\n![](img/209.jpg)\n\
  \n该序列的输出如下：\n\na A b B c C d D e E f F g G h H i I j J k L l M n N o O P q Q R s\
  \ S t T\n\n### 合并流\n\n`Stream` 接口有许多方法可以合并流。这些方法通常用于将多个流组合在一起，或者将一个流与另一个流合并。这些方法包括\
  \ `concat`、`reduce` 等。如下所示：\n\n```java\nStream<Integer> s1 = Stream.of(1, 2, 3);\n\
  Stream<Integer> s2 = Stream.of(4, 5, 6);\nStream<Integer> combined = Stream.concat(s1,\
  \ s2);\ncombined.forEach(System.out::println);\n```\n\n输出如下：\n\n1\n2\n3\n4\n5\n\
  6\n\n### 生成空流\n\n空流是一个不包含任何元素的流。你可以通过 `empty` 方法创建它。\n\n```java\nStream<String>\
  \ emptyStream = Stream.empty();\nemptyStream.forEach(System.out::println);\n```\n\
  \n### 使用 Stream 方法\n\n`Stream` 接口有许多方法可以应用于流。这些方法通常用于过滤、转换、聚合等操作。在下面的示例中，我们将展示如何如何使用这些方法。\n\
  \n| `Name` | `Weight` | `Part Number` | `Price` |\n| :--- | :--- | :--- | :--- |\n\
  | Pencil | 5 | 100 | 0.15 |\n| Eraser | 3 | 200 | 0.25 |\n| Paper | 1 | 2000 | 0.03\
  \ |\n\n### 使用 filter 方法\n\n`filter` 方法允许根据给定的谓词（Predicate）过滤流中的元素。\n\n```java\n\
  List<Part> filteredParts = partsList.stream()\n    .filter(p -> p.getWeight() >\
  \ 2)\n    .collect(Collectors.toList());\n```\n\n在这个示例中，我们过滤出重量大于 2 的 `Part`。\n\n\
  ### 使用 map 方法\n\n`map` 方法用于将流中的每个元素转换为另一种形式。\n\n```java\nList<String> names = partsList.stream()\n\
  \    .map(p -> p.getName())\n    .collect(Collectors.toList());\n```\n\n### 使用 reduce\
  \ 方法\n\n`reduce` 方法用于将流中的元素规约为单个值。\n\n```java\nint totalWeight = partsList.stream()\n\
  \    .mapToInt(Part::getWeight)\n    .reduce(0, (a, b) -> a + b);\n```\n\n### 使用\
  \ collect 方法\n\n`collect` 方法用于将流转换为不同的形式，如列表、集合或映射。\n\n```java\nList<Part> list\
  \ = partsList.stream()\n    .collect(Collectors.toList());\n```\n\n### Part 示例类\n\
  \n在本章中，我们将使用 `Part` 类。该类如下：\n\n```java\npublic class Part {\n    private String\
  \ name;\n    private int partNumber;\n    private int weight;\n    private float\
  \ price;\n    private int quantity;\n\n    public Part(String name, int partNumber,\
  \ int weight, float price, int quantity) {\n        this.name = name;\n        this.partNumber\
  \ = partNumber;\n        this.weight = weight;\n        this.price = price;\n  \
  \      this.quantity = quantity;\n    }\n\n    public Part(Part part) {\n      \
  \  this(part.name, part.partNumber, part.weight, part.price, part.quantity);\n \
  \   }\n\n    public Part() {\n        this(\"Default\",12345,10,10.0f,0);\n    }\n\
  \n    public String getName() { return name; }\n    public void setName(String name)\
  \ { this.name = name; }\n    public int getPartNumber() { return partNumber; }\n\
  \    public void setPartNumber(int partNumber) { this.partNumber = partNumber; }\n\
  \    public int getWeight() { return weight; }\n    public void setWeight(int weight)\
  \ { this.weight = weight; }\n    public float getPrice() { return price; }\n   \
  \ public void setPrice(float price) { this.price = price; }\n    public int getQuantity()\
  \ { return quantity; }\n    public void setQuantity(int quantity) { this.quantity\
  \ = quantity; }\n\n    public boolean equals(Part part) {\n        return this.name.equals(part.name);\n\
  \    }\n\n    public int comparator(Part part) {\n        return this.name.compareTo(part.name);\n\
  \    }\n\n    public String toString() {\n        return String.format(\n      \
  \      \"Name: %-8s Weight: %3d  Part Number: %5d Price: %.2f Quantity: %5d\",\n\
  \            name, weight, partNumber, price, quantity\n        );\n    }\n}\n```\n\
  \n\n\n\n```java\nthis.name, this.weight, this.partNumber, this.price, this.quantity);\n\
  \n}\n\n}\n```\n\n![](img/image212.jpg)\n\n![](img/image213.jpg)\n\n![](img/image214.jpg)\n\
  \n我们还将创建一个下面定义的零件的 `List` 列表：\n\n```java\nList<Part> partsList = Arrays.asList(\n\
  \    new Part(\"Pencil\", 100, 5, 0.15f, 500),\n    new Part(\"Eraser\", 200, 3,\
  \ 0.25f, 250),\n    new Part(\"Paper\", 2000, 1, 0.03f, 1200)\n);\n```\n\n![](img/image215.jpg)\n\
  \n此 `partsList` 将作为本章中若干示例的基础。在某些示例中，当这三个零件不足以演示某种技术时，会添加更多的元素。\n\n### 使用 forEach\
  \ 方法\n\n该方法用于处理 `stream` 的每个元素。它的参数必须与 `Consumer` 接口的 `accept` 方法兼容。下面的代码序列说明了如何显示流的每个元素：\n\
  \n```java\nStream<Part> partsStream = partsList.stream();\npartsStream.forEach(System.out::println);\n\
  ```\n\n![](img/image216.jpg)\n\n该序列的输出如下：\n\nName: Pencil   Weight:  5  Part Number:\
  \  100 Price: 0.15 Quantity:  500\nName: Eraser   Weight:  3  Part Number:  200\
  \ Price: 0.25 Quantity:  250\nName: Paper    Weight:  1  Part Number: 2000 Price:\
  \ 0.03 Quantity: 1200\n\n或者，我们可以使用以下 lambda 表达式将每个零件的价格增加 5%：\n\n```java\npartsStream.forEach(x\
  \ -> x.setPrice(x.getPrice()*1.05f));\n```\n\n![](img/image217.jpg)\n\n然而，如下面所示，这并没有修改原始列表：\n\
  \n```java\nStream<Part> partsStream = partsList.stream();\npartsStream.forEach(x\
  \ -> x.setPrice(x.getPrice()*1.05f));\n\nfor (Part part : partsList) {\n    System.out.println(part);\n\
  }\n```\n\n![](img/image218.jpg)\n\n`partsList` 的内容如下。它没有被改变。\n\nName: Pencil   Weight:\
  \  5  Part Number:  100 Price: 0.16 Quantity:  500\nName: Eraser   Weight:  3  Part\
  \ Number:  200 Price: 0.26 Quantity:  250\nName: Paper    Weight:  1  Part Number:\
  \ 2000 Price: 0.03 Quantity: 1200\n\n然而，我们可以使用 `map` 方法通过创建原始流元素的副本来创建一个新流。这在“使用\
  \ map 方法”部分会有详细说明。\n\n`forEach` 方法的缺点是，你无法像在普通的 `forEach` 语句那样跳出循环。与所有流一样，流只能使用一次。\n\
  \n### 使用 forEachOrdered 方法\n\n当对流使用 `forEach` 语句时，它可以并发执行。但是，该流必须是一个并行流。创建并行流的一种方法是使用下面所示的\
  \ `parallelStream` 方法：\n\n```java\npartsList.parallelStream().\n    forEach(x ->System.out.println(x));\n\
  ```\n\n![](img/image219.jpg)\n\n`forEach` 方法处理流元素的顺序是不确定的。也就是说，无法提前进行预测。这在并行流中尤为明显，因为并行流被拆分成多个子流、逐个处理，然后进行合并。\n\
  \n`forEachOrdered` 方法的目的是保证顺序会被遵守。否则，这两种方法的使用是完全相同的。下面的序列说明了该方法的使用：\n\n```java\n\
  partsStream = partsList.stream();\npartsStream.forEachOrdered(System.out::println);\n\
  ```\n\n![](img/image220.jpg)\n\n输出如下：\n\nName: Pencil   Weight:  5  Part Number:\
  \  100 Price: 0.16 Quantity:  500\nName: Eraser   Weight:  3  Part Number:  200\
  \ Price: 0.26 Quantity:  250\nName: Paper    Weight:  1  Part Number: 2000 Price:\
  \ 0.03 Quantity: 1200\n\n### 使用 map 方法\n\n`map` 方法接受一个 `Function` 接口参数。该接口将流中的一个元素转换为新元素。为了演示\
  \ `map` 方法，我们首先声明了一个名为 `mapper` 的 `Function` 接口变量。该定义使用 lambda 表达式，它根据现有零件创建一个新的\
  \ `Part`，将每个零件的价格提高 5%，然后返回新零件。\n\n```java\nFunction<Part, Part> mapper = (Part\
  \ part) -> {\n    Part newPart = new Part(part.getName(), part.getWeight(), part.getPartNumber(),\
  \ part.getPrice(), part.getQuantity());\n    newPart.setPrice(part.getPrice() *\
  \ 1.05f);\n    return newPart;\n};\n```\n\n\n\n\n```java\nnew Part(\"Pencil\", 100,\
  \ 5, 0.15f, 500).getPrice(),\nnew Part(\"Eraser\", 200, 3, 0.25f, 250).getPrice(),\n\
  new Part(\"Paper\", 2000, 1, 0.03f, 1200).getPrice()\n);\n\nList<List<Float>> mappedParts\
  \ =\npartsList.stream().\n  map(p -> Arrays.asList(p-=p*0.10f, p, p+=p*0.10f)).\n\
  \  collect(Collectors.toList());\n\nSystem.out.println(mappedParts);\n```\n![](img/image228.jpg)\n\
  \n该序列的输出如下：\n`[[0.135, 0.135, 0.14850001], [0.225, 0.225, 0.24749999], [0.026999999,\
  \ 0.026999999, 0.029699998]]`\n\n在接下来的代码序列中，使用了 `flatMap` 方法代替了 `map` 方法。此外，`stream`\
  \ 方法应用于由 `asList` 方法产生的列表。这允许 `flatMap` 方法将子流扁化为单个流。\n\n```java\nList<Float> flatParts\
  \ = partsList.stream().\n  flatMap(p -> Arrays.asList(p-=p*0.10f, p, p+=p*0.10f).\n\
  \  stream()).\n  collect(Collectors.toList());\n\nSystem.out.println(flatParts);\n\
  ```\n![](img/image229.jpg)\n\n输出如下：\n`[0.135, 0.135, 0.14850001, 0.225, 0.225, 0.24749999,\
  \ 0.026999999, 0.026999999, 0.029699998]`\n\n它与之前的技术不同，在于它使用了不同的返回类型，使用了 `flatMap`\
  \ 方法而不是 `map` 方法，并且使用 `stream` 方法代替了 `asList` 方法。\n\n### 使用 filter 方法\n\n`filter`\
  \ 方法顾如其名，它根据一组标准过滤掉或移除流中的元素。该方法的参数是一个谓词 lambda 表达式。在这个示例中，定义了一个谓词来判断零件的重量是否大于或等于\
  \ 3。然后使用 `forEach` 方法显示选定的元素。\n\n```java\nPredicate<Part> weightPredicate = p ->\
  \ p.getWeight() >= 3; \n\npartsStream.filter(weightPredicate).\n  forEach(System.out::println);\n\
  ```\n![](img/image230.jpg)\n\n该序列的输出如下所示：\nName: Pencil Weight: 5 Part Number: 100\
  \ Price: 0.15 Quantity: 500\nName: Eraser Weight: 3 Part Number: 200 Price: 0.25\
  \ Quantity: 250\n\n这种方法的进一步增强是：在零件增加 5% 之后，过滤掉那些价格大于或等于 0.15 的元素。这如下简洁的方式表示。`mapper`\
  \ 变量之前在“使用 map 方法”中已经声明过。\n\n```java\nPredicate<Part> pricePredicate = p -> p.getPrice()\
  \ > 0.15f;\n\npartsStream.map(mapper).filter(pricePredicate).\n  forEach(System.out::println);\n\
  ```\n![](img/image231.jpg)\n\n如下所示，可以结合使用多个过滤器。在这里，只会选择价格大于或等于 0.15 且重量超过 2 的零件。\n\
  \n```java\npartsStream.map(mapper).\n  filter(pricePredicate).\n  filter(weightPredicate).\n\
  \  forEach(System.out::println);\n```\n![](img/image232.jpg)\n\n输出如下：\nName: Pencil\
  \ Weight: 5 Part Number: 100 Price: 0.16 Quantity: 500\nName: Eraser Weight: 3 Part\
  \ Number: 200 Price: 0.26 Quantity: 250\n\n### 使用 Match 类型方法\n\n有三种 match 类型方法可以有效地对流执行过滤操作。这些方法每个都接受一个谓词，该谓词应用于流的每个元素，并返回一个反映谓词执行结果的布尔值。它们包括：\n\
  \n- `allMatch` – 如果所有元素都满足谓词或流为空，则返回 true。否则返回 false。\n- `anyMatch` – 如果流中的任意元素匹配谓词，则返回\
  \ true。如果流为空或未找到匹配谓词的元素，返回 false。\n- `noneMatch` – 返回一个布尔值，指示流中是否有任何元素匹配谓词。\n\n\
  下面，根据 `partsList` 创建了一个流，并结合多个谓词 lambda 表达式使用它。虽然示例看起来是一个接一个地执行这些方法，但请记住流是不能重用的。为了让这个示例正常工作，必须在每次执行\
  \ match 方法之前重新创建流。\n\n```java\nStream<Part> partsStream = partsList.stream();\n\
  System.out.println(partsStream.allMatch(p -> p.getQuantity() < 50));\nSystem.out.println(partsStream.anyMatch(p\
  \ -> p.getQuantity() < 50));\nSystem.out.println(partsStream.noneMatch(p -> p.getQuantity()\
  \ < 50));\nSystem.out.println(partsStream.allMatch(p -> p.getPrice() > 0.3));\n\
  System.out.println(partsStream.anyMatch(p -> p.getPrice() > 0.3));\n```\n![](img/image233.jpg)\n\
  \n该序列的输出：\n`false`\n`true`\n`false`\n`true`\n\n### 使用 findFirst 方法\n\n`findFirst`\
  \ 方法将返回流的第一个元素。然而，它可能是空的。为了处理这种情况，`findFirst` 返回一个可能值的 `Optional` 对象。使用 `isPresent`\
  \ 方法判断它是否包含值。如果存在，`get` 方法返回该值。\n\n```java\npricePredicate = p -> p.getPrice() >\
  \ 0.15;\nOptional<Part> firstPart = partsStream.stream().\n  filter(pricePredicate).\n\
  \  findFirst();\n\nif (firstPart.isPresent()) {\n  System.out.println(firstPart.get());\n\
  } else {\n  System.out.println(\"No part meets the criteria\");\n}\n```\n![](img/image234.jpg)\n\
  \n输出如下：\nName: Pencil Weight: 5 Part Number: 100 Price: 0.16 Quantity: 500\n\n###\
  \ 使用 findAny 方法\n\n`findAny` 方法也返回一个 `Optional` 值。该值可能是空的，也可能是流中的任意元素。所选的元素是不确定的，意味着无法预测。\n\
  \n```java\nPart anyPart = partsStream.stream().\n  filter(pricePredicate).\n  findAny().\n\
  \  get();\nSystem.out.println(anyPart);\n```\n![](img/image235.jpg)\n\n输出可能为：\n\
  Name: Eraser Weight: 3 Part Number: 200 Price: 0.25\n\n### 使用 Optional 类\n\n之前的示例假设\
  \ `Optional` 类有多个方法。其中一个方法 `orElse` 方法为空时返回一个特定对象。在这个示例中，`pricePredicate` 被更改为过滤掉价格小于等于\
  \ 0.3 的零件。对于 `partsStream`，这消除了所有零件。由于 `firstPart` 为空，创建了一个替换零件。\n\n```java\npricePredicate\
  \ = p -> p.getPrice() > 0.3;\nOptional<Part> firstPart = partsStream.stream().\n\
  \  map(mapper).\n  filter(pricePredicate).\n  findFirst();\nPart part = firstPart.\n\
  \  orElse(new Part(\"Substitute\", 99999, 10, 1.5f, 50));\nSystem.out.println(part);\n\
  ```\n![](img/image236.jpg)\n\n输出将是替换零件：\nName: Substitute Weight: 10 Part Number:\
  \ 99999 Price: 1.50 Quantity: 50\n\nOptional 类还有一个 `orElseGet` 方法，当 Optional 值为空时返回一个对象。该方法的参数是一个\
  \ `Supplier` 实现。下一个示例使用随机数来返回 `partsList` 中的元素之一。\n\n```java\npricePredicate = p\
  \ -> p.getPrice() > 0.3;\nSupplier<Part> supplier = () -> {\n  Random random = new\
  \ Random();\n  return partsList.get(random.nextInt(partsList.size()));\n};\nPart\
  \ part = firstPart.orElseGet(supplier);\nSystem.out.println(part);\n```\n![](img/image237.jpg)\n\
  \n一种可能的输出如下：\nName: Pencil Weight: 5 Part Number: 100 Price: 0.16 Quantity: 500\n\
  \n\n\n\n另一个可能有用的 `Optional` 类方法是 `orElseThrow` 方法。顾顾名，如果 `Optional` 值为 `null`，它将抛出一个异常。该方法的参数应该是要抛出的异常对象。\n\
  \n下面的示例说明了该方法，其中抛出了 `PartException`。`nextInt` 的参数被设置为 `200`，以增加抛出异常的概率。当 `partsList`\
  \ 的索引过大时，会抛出异常。\n\n```java\nclass PartException extends Exception {\n\n}\n\nSupplier<Part>\
  \ supplier = () -> {\n    Random random = new Random();\n    return partsList.get(random.nextInt(200));\n\
  };\n\ntry {\n    Part part = firstPart.orElseThrow(PartException::new);\n    System.out.println(part);\n\
  } catch (PartException ex) {\n    ex.printStackTrace();\n}\n```\n\n![](img/image239.jpg)\n\
  \n如果 `get` 方法的参数超过了 `partsList` 的大小，将抛出 `PartException`。\n\n## 使用 reduce 方法\n\n\
  `reduce` 方法正如其名，将一个流（stream）规约为单个值，并将其作为 `Optional` 返回。共有三个重载的 `reduce` 方法。我们在这里演示其中两种。\n\
  \n接下来的示例使用 `BinaryOperator` 来执行规约操作。从一个整数列表创建一个流。`reduce` 方法将两个参数规约为它们的和。此操作被连续应用于流的每个元素。返回值是一个\
  \ `Optional`。使用它的 `get` 方法来返回流中元素的有效和。\n\n```java\nList<Integer> list = Arrays.asList(1,\
  \ 2, 3, 4);\nOptional<Integer> result = list.stream().\n    reduce((n1, n2) -> n1\
  \ + n2);\n\nSystem.out.println(result.get());\n```\n\n![](img/image240.jpg)\n\n\
  该序列的输出将是 `10`。\n\n下一个示例说明了将相同的技术应用于字符串。其效果是将元素用连字符（dash）连接在一起。\n\n```java\nList<String>\
  \ nameList =\nArrays.asList(\"Bob\", \"Carol\", \"Ted\", \"Alice\");\nOptional<String>\
  \ name = nameList.stream().\n    reduce((n1, n2) -> n1 + \"-\" + n2);\n\nSystem.out.println(name.get());\n\
  ```\n\n![](img/image241.jpg)\n\n该示例的输出如下：\nBob-Carol-Ted-Alice\n\n接下来的 `reduce`\
  \ 方法执行类似的求和操作，但以一个初始累加值作为方法的第一个参数。第二个参数是一个 `BinaryOperator`，它应用于流的元素。此示例的效果是计算元素的乘积。\n\
  \n```java\nList<Integer> productList = Arrays.asList(1, 2, 3, 4);\nInteger productResult\
  \ = productList.\n    stream().\n    reduce(1, (n1, n2) -> n1 * n2);\n\nSystem.out.println(productResult);\n\
  ```\n\n![](img/image242.jpg)\n\n它的输出将是 `24`。\n\n## 使用 Collector 接口和 collect 方法\n\
  \n`Collector` 接口是 `reduce` 类型操作的抽象版本。规约操作产生一个可变的结果。这可以通过顺序或并行方式进行。然而，创建一个 `Collector`\
  \ 可能是困难的。`java.util.stream.Collectors` 类使得这一任务变得更容易。这是一个工具类，其方法返回 `Collector` 对象，并支持许多规约类型操作。\n\
  \n`Stream` 接口的 `collect` 方法在需要将流的元素放入 `Collection`、`Map` 或 `String` 时非常有用。它频繁使用\
  \ `Collector` 接口的实例来收集流的元素。\n\n有两个重载的 `collect` 方法可用。第一个接受一个 `Collector`，第二个接受三个参数：一个\
  \ `Supplier` 和两个 `BiConsumer` 对象。让我们先检查 `Collector` 的用法。\n\n在这个示例中，创建了一个 `Parts`\
  \ 的流。使用 `map` 方法获取每个部分的名字。接着使用 `Collectors` 工具类的 `toList` 方法创建实际列表。然后将该列表赋值给 `partList`\
  \ 变量。\n\n```java\nList<Part> partsList = Arrays.asList(\n    new Part(\"Pencil\"\
  , 100, 5, 0.15f, 500),\n    new Part(\"Eraser\", 200, 3, 0.25f, 250),\n    new Part(\"\
  Pen\", 500, 3, 0.35f, 350),\n    new Part(\"Paper\", 2000, 1, 0.03f, 1200)\n);\n\
  \nStream<Part> partsStream = partsList.stream();\nList<String> partList =\npartsStream.\n\
  \    map(Part::getName).\n    collect(Collectors.toList());\n\nfor (String element\
  \ : partList) {\n    System.out.println(element);\n}\n```\n\n![](img/image243.jpg)\n\
  \n该序列的输出将所示：\nPencil\nEraser\nPen\nPaper\n\n`Collectors` 类的另一个用途是生成一个值集合。在下面的示例中，根据部分的名字创建了一个字符串的\
  \ `TreeSet`。\n\n```java\npartsStream = partsList.stream();\nTreeSet<String> partTree\
  \ =\npartsStream.\n    map(Part::getName).\n    collect(Collectors.toCollection(TreeSet::new));\n\
  \npartTree.stream().forEach(p -> System.out.println(p));\n```\n\n![](img/image244.jpg)\n\
  \n该序列的输出如下：\nEraser\nPaper\nPen\nPencil\n\n下面显示了 `Map` 的创建和使用。创建了一个按重量分组的列表列表映射。\n\
  \n```java\npartsStream = partList.stream();\nMap<Integer,List<Part>> partMap = partsStream.\n\
  \    collect(Collectors.groupingBy(Part::getWeight));\n\nif(partMap.containsKey(3))\
  \ {\n    partMap.get(3).forEach(p->System.out.println(p));\n}\n```\n![](img/image245.jpg)\n\
  \n## 使用 Collectors 类\n\n`Collectors` 类拥有许多创建 `Collector` 对象的有用方法。操作类型包括：\n- 基本类型求平均值\n\
  - 统计流中元素的数量\n- 将元素连接成字符串\n- 映射流的元素\n- 分区流\n- 规约流的元素\n- 求和流元素\n\n## 使用 iterator 方法\n\
  \n`iterator` 方法位于 `Stream` 接口的 `BaseStream` 中。其目的是提供一个 `Iterator` 对象，用于遍历流。这通常不需要，因为\
  \ `Stream` 接口的方法提供了更好的支持。\n\n接下来的示例说明了如何在整数流中使用该方法。第一部分显示了使用 `iterator` 方法并在 `while`\
  \ 循环中显示列表的元素。最后的语句演示了使用 `forEach` 方法实现相同结果简单得多。\n\n```java\nList<Integer> numbers\
  \ = Arrays.asList(10,20,30,40);\nStream<Integer> numberStream = numbers.stream();\n\
  Iterator iterator = numberStream.iterator();\n\nwhile(iterator.hasNext()) {\n  \
  \  System.out.println(iterator.next());\n}\n\nnumberStream = numbers.stream();\n\
  numberStream.forEach(n -> System.out.print(n + \" \"));\n```\n\n![](img/image246.jpg)\n\
  \n两种技术的输出是相同的，如下：\n10 20 30 40\n\n## 使用 sorted 方法\n\n`sorted` 方法将返回一个排序后的流。有两个重载的\
  \ `sorted` 方法。如果流流元素类型支持自然顺序，可以使用不带参数的 `sorted` 方法。例如如下所示，创建一个数字列表，进行排序然后显示：\n\n\
  ```java\nList<Integer> numberList = Arrays.asList(23, 54, 12, 5, 24);\nnumberList.stream().\n\
  \    sorted().\n    forEach(n -> System.out.print(n + \" \"));\n```\n\n![](img/image247.jpg)\n\
  \n输出如下：\n5 12 23 24 54\n\n然而，如果元素没有自然顺序，或者想要不同的比较技术，则像像所示可以使用第二个重载的 `sorted` 方法。该方法接受一个\
  \ `Comparator` 作为参数。在这个示例中，部分按名称升序排序。\n\n```java\nStream<Part> partsStream = partList.stream();\n\
  Comparator<Part> partComparator = Comparator.comparing(Part::getName);\n```\n\n\n\
  \n\n\n```java\n(p1, p2) -> p1.getName().compareTo(p2.getName());\n\npartsStream.sorted(partComparator).\n\
  \nforEach(System.out::println);\n```\n\n![](img/image248.jpg)\n\n该序列的输出如下：\n\nName:\
  \ Eraser Weight: 3 Part Number: 200 Price: 0.25 Quantity: 250\nName: Paper Weight:\
  \ 1 Part Number: 2000 Price: 0.03 Quantity: 1200\nName: Pencil Weight: 5 Part Number:\
  \ 100 Price: 0.15 Quantity: 500\n\n### 使用 distinct 方法\n\n`distinct` 方法用于返回一个流，其中原始流中的任何重复元素都会被移除。重复元素通过对元素应用\
  \ `equals` 方法来确定。以下是使用该方法的代码序列：\n\n```java\nList<Integer> numbers = Arrays.asList(19,\
  \ 12, 23, 31, 12, 4, 23, 31);\nnumbers.stream().\n  distinct().\n  forEach(n ->\
  \ System.out.print(n + \" \"));\n```\n\n![](img/image249.jpg)\n\n输出所示：\n19 12 23\
  \ 31 4\n\n### 使用 limit 方法\n\n有时，需要限制流中处理的元素数量。`limit` 方法即用于此目的。它的 `long` 参数决定了将返回多少元素。\n\
  \n以下示例将输出限制为列表中的前 5 个数字。使用 Lambda 表达式对数字进行从高到低进行排序，然后显示前五个数字。\n\n```java\nList<Integer>\
  \ numberList = Arrays.asList(23, 54, 12, 5, 24, 32, 89, 21, 83);\nnumberList.stream().\n\
  \  sorted((n1, n2) -> (n1>n2)?-1:1).\n  limit(5).\n  forEach(n -> System.out.print(n\
  \ + \" \"));\n```\n\n![](img/image250.jpg)\n\n输出如下：\n89 83 54 32 24\n\n接下来的示例将返回一个数字列表，其中移除了最大的三个和最小的三个数字。此列表将按降序排列。创建流\
  \ `tmpStream`——首先对数字进行升序排序，然后使用 `limit` 方法移除最后三个元素。然后使用 `tmpStream` 创建一个降序的流，并再次使用\
  \ `limit` 方法截断流的最后三个元素。\n\n```java\nList<Integer> numberList = Arrays.asList(23,\
  \ 54, 12, 5, 24, 32, 89, 21, 83);\nStream<Integer> tmpStream = numberList.stream().\n\
  \  sorted((n1, n2) -> (n1>n2)?1:-1).\n  limit(numberList.size() - 3);\ntmpStream.\n\
  \  sorted((n1, n2) -> (n1>n2)?-1:1).\n  limit(numberList.size() - 6).\n  forEach(n\
  \ -> System.out.print(n + \" \"));\n```\n\n![](img/image251.jpg)\n\n输出如下：\n32 24\
  \ 23\n\n### 使用 skip 方法\n\n`skip` 方法将跳过流开头的元素。跳过的元素数量由其 `long` 参数指定。\n\n以下示例将复制上一个示例，但使用了\
  \ `skip` 方法。它将返回一个数字列表，其中移除了最大的三个和最小的三个数字。此列表将按降序排列。首先创建流 `tmpStream` 并对数字进行升序排序，然后使用\
  \ `skip` 方法移除前三个元素。然后使用 `tmpStream` 创建一个降序流，并再次使用 `skip` 方法移除流中的三个元素。\n\n```java\n\
  List<Integer> numberList = Arrays.asList(23, 54, 12, 5, 24, 32, 89, 21, 83);\nStream<Integer>\
  \ tmpStream = numberList.stream().\n  sorted((n1, n2) -> (n1>n2)?1:-1).\n  skip(3);\n\
  tmpStream.\n  sorted((n1, n2) -> (n1>n2)?-1:1).\n  skip(3).\n  forEach(n -> System.out.print(n\
  \ + \" \"));\n```\n\n![](img/image252.jpg)\n\n输出如下：\n32 24 23\n\n### 使用 max, min,\
  \ 和 count 方法\n\n`max` 和 `min` 方法将根据其 `Comparator` 参数分别从流中返回最大和最小的元素。可以使用下面所示的整数列表轻松演示这些方法。使用\
  \ Lambda 表达式作为 `Comparator` 来确定整数的相对排名。这些方法返回一个 `Optional`，因此使用 `get` 方法返回整数值。\n\
  \n```java\nList<Integer> numberList = Arrays.asList(23, 54, 12, 5, 24, 32, 89, 21,\
  \ 83);\nSystem.out.println(numberList.stream().\n  max((n1, n2) -> (n1>n2)?-1:1).get());\n\
  System.out.println(numberList.stream().\n  min((n1, n2) -> (n1>n2)?-1:1).get());\n\
  ```\n\n![](img/image253.jpg)\n\n第一个 `println` 语句将返回 89，而第二个返回 5。\n\n`count` 方法将返回一个\
  \ `long` 值，反映流中的元素数量。一个简单的示例如下：\n\n```java\nList<Integer> numberList = Arrays.asList(23,\
  \ 54, 12, 5, 24, 32, 89, 21, 83);\nSystem.out.println(numberList.stream().count());\n\
  ```\n\n![](img/image254.jpg)\n\n将显示 9。\n\n### 针对原始类型的流\n\n`Stream` 接口是一个泛型类型接口，适用于许多类型的问题。当流需要与原始类型一起使用时，需要大量的装箱（boxing）和拆箱（unboxing）。因此，当需要处理大量数据时，会产生此问题。\n\
  \n当流需要与原始类型配合使用时，需要大量的装箱和拆箱。因此，当需要处理大量数据时，会产生此问题。为了解决这个问题，提供了如 `IntStream`、`LongStream`\
  \ 和 `DoubleStream` 等原始流接口。这些流操作包括：\n- count\n- sum\n- min\n- max\n\n`IntSummaryStatistics`\
  \ 类提供了对整数流的统计数据。此外，还有对应的 `DoubleSummaryStatistics` 和 `LongSummaryStatistics`。\n\n\
  ### 使用 IntStream 接口\n\n`IntStream` 接口支持整数操作并具有许多有用方法。以下演示了 `IntStream` 的用法。创建一个流并应用\
  \ `mapToInt` 方法，这将返回一个 `IntStream` 对象。然后对该原始流应用 `sum` 方法，返回流中所有部分的和。\n\n```java\n\
  Stream<Part> partsStream = partsList.stream();\nint sumOfWeights = partsStream.mapToInt(\n\
  \  (Part p) -> p.getWeight()).sum();\nSystem.out.println(\"Sum: \" + sumOfWeights);\n\
  ```\n\n![](img/image255.jpg)\n\n输出如下：\n\n以下代码显式使用 `IntStream` 实现了相同的结果：\n\n```java\n\
  IntStream tmpStream = partsStream.mapToInt(\n  (Part p) -> p.getWeight());\nSystem.out.println(\"\
  Sum: \" + tmpStream.sum());\n```\n\n![](img/image256.jpg)\n\n### 理解惰性和求值评估\n\n流以惰性的方式执行。这意味着大多数针对流的操作会被推迟，直到真正需要结果为止。如果没有惰性评估，流将无法无限存在。\n\
  \n例如，考虑下面重复的 `findFirst` 示例。`map` 和 `filter` 操作一次处理一个元素，直到出现第一个匹配项。整个流并没有被处理。中间方法在调用某些终结方法之前不会执行。\n\
  \n```java\nOptional<Part> firstPart = partsStream.map(mapper).\n  filter(pricePredicate).findFirst();\n\
  ```\n\n![](img/image257.jpg)\n\n求值评估发生在对流中的每个元素执行操作时。有时这是必要的。例如，`forEach` 方法会处理流中的每个元素。\n\
  \n有些时候最好以惰性的方式处理流，而有些时候需要求值处理。通过将循环操作移动到流和某些集合内部，系统能够优化这些操作，并根据情况应用求值或惰性。\n\n\n\n\
  \n\n# 使用并行流操作\n\n使用流（streams）的优势之一是它们可能支持流操作的并发执行。传统的集合方法并不总是线程安全的。通常，必须使用显式的线程同步机制来解决潜在的数据损坏问题。使用同步可能会引入线程争用问题。如果所操作的集合没有被修改，并行流操作可以避免这些问题。\n\
  \n请记住，流操作的并发执行并不意味着应用程序的运行速度会更快。对于较小的集合，支持并行执行所产生的开销可能比按顺序执行相同组操作所需的时间更大。\n\n当一个流被并行化时，运行时环境将流拆分成多个部分，在单独的处理器上执行每个部分，然后合并结果。默认情况下，流上的操作是按顺序执行的。要影响并行执行，需要使用\
  \ `Collection` 接口的 `parallelStream` 方法或 `BaseStream` 接口的 `parallel` 方法。\n\n让我们从以下列表和流的声明开始：\n\
  \n```java\nList<Part> partsList = Arrays.asList(\n    new Part(\"Pencil\", 100,\
  \ 5, 0.15f),\n    new Part(\"Eraser\", 200, 3, 0.25f),\n    new Part(\"Paper\",\
  \ 2000, 1, 0.03f),\n    new Part(\"Pen\", 200, 3, 0.25f),\n    new Part(\"Staple\"\
  , 3000, 1, 0.01f)\n);\n\nStream<Part> partsStream = partsList.stream();\n```\n\n\
  ![](img/image258.jpg)\n\n下面是一个过滤掉重量小于 3 的部分的顺序流：\n\n```java\npartsStream.filter(\n\
  \  (p)->p.getWeight()>=3).\n  forEach(p -> System.out.println(p));\n```\n\n![](img/image259.jpg)\n\
  \n使用并行流执行相同的操作，如下所示，使用了 `parallel` 方法：\n\n```java\npartsStream.parallel().\n  filter((p)->p.getWeight()>=3).\n\
  \  forEach(p -> System.out.println(p));\n```\n\n![](img/image260.jpg)\n\n这两个序列的输出如下，并且对于每个示例来说都是相同的：\n\
  \nName: Eraser  Weight:   3  Part Number:  200 Price: 0.25\nName: Pencil  Weight:\
  \   5  Part Number:  100 Price: 0.15\n\n然而，将顺序流转换为并行流并不总是这么简单。归约操作（Reduction type\
  \ operations）需要更仔细地处理。在下面的示例中，创建一个 `Map`，其键是整数重量。`groupingBy` 方法将返回一个具有相同重量成员的列表。这些列表会被赋值给\
  \ map。\n\n```java\nMap<Integer, List<Part>> groupByWeight =\n  partsStream.collect(\n\
  \    Collectors.groupingBy(Part::getWeight));\n\nfor(Part part : groupByWeight.get(3))\
  \ {\n  System.out.println(part);\n}\n```\n\n![](img/image261.jpg)\n\n输出如下：\n\nName:\
  \ Eraser  Weight:   3  Part Number:  200 Price: 0.25\nName: Pen      Weight:   3\
  \  Part Number:  200 Price: 0.25\n\n使用并行流达到相同的结果需要像下面所示进行一些修改。为了提高操作性能，需要一个 `ConcurrentMap`\
  \ 并应该使用 `groupingByConcurrent` 方法。\n\n```java\nConcurrentMap<Integer, List<Part>>\
  \ groupByWeight =\n  partsStream.parallel().collect(\n    Collectors.groupingByConcurrent(Part::getWeight));\n\
  \nfor (Part part : groupByWeight.get(3)) {\n  System.out.println(part);\n}\n```\n\
  \n![](img/image262.jpg)\n\n要影响并发归约，需要考虑以下规则：\n\n- 流是一个并行流\n- 使用的收集器具有特性：`CONCURRENT`\n\
  - 流应该是无序的\n\n为了让流能够利用多个处理器，需要使用并行流。然而，在使用并行流时：\n\n- 注意不利的副作用\n- 避免使用有状态的 lambda\
  \ 表达式\n\n当流的某一个操作修改了应用程序的状态时，流可能会发生副作用。诸如 `println` 方法和可变归约等操作具有副作用。大多数副作用都在流内部处理。然而，当流操作修改了流的源时，就会出现问题。这被称为干扰（interference）。\n\
  \n在下面的示例中，尝试使用 `add` 方法作为谓词操作的一部分来修改原始的 `partsList`：\n\n```java\npartsList.stream().\n\
  \  filter((p)->{\n    partsList.add(p);\n    return p.getWeight()>=3;\n  }).\n \
  \ forEach(p -> System.out.println(p));\n```\n\n![](img/image263.jpg)\n\n当执行该语句时，将产生\
  \ `java.lang.UnsupportedOperationException` 异常。修改另一个列表不会导致异常。\n\n有状态的 lambda 表达式是指其结果依赖于在\
  \ lambda 表达式执行期间可能会改变的状态。例如，以下过滤操作返回的值取决于某些外部条件：\n\n```java\nboolean someCondition\
  \ = …;\n\npartsStream.parallel().\n  filter(p -> {\n    if (someCondition) {\n \
  \     return true;\n    }\n  }).\n  forEach(p -> System.out.println(p));\n```\n\n\
  ![](img/image64.jpg)\n\n### 结论\n\n流的元素依赖于一个在 lambda 表达式执行期间可能会改变的状态。例如，以下过滤操作返回的值取决于某些外部条件。流可以以链式方式进行操作。这可以得到一个更自然、简洁的解决方案。当流并行化时，必须确保它能够正常工作。\n\
  \n一个流可以从数组和列表创建。流的长度是无界的。流可以以链式方式进行操作。此外，使用 lambda 表达式可以增强流的表达性。\n\n流的元素可以执行多种操作，包括转换元素、过滤元素、归约元素以及限制流的大小。大多数副作用都在流内部处理。然而，当流操作修改了流的源时，就会出现问题。这被称为干扰。\n\
  \n为了让流能够利用多个处理器，需要使用并行流。然而，在使用并行流时：\n\n- 注意不利的副作用\n- 避免使用有状态的 lambda 表达式\n\n流的元素依赖于一个在\
  \ lambda 表达式执行期间可能会改变的状态。\n\n\n\n\n\nJava 8 的一个重要新增是引入了新的日期时间 API，旨在取代现有的 `java.util.Date`\
  \ 和 `java.util.Calendar` 类。它基于 Joda (http://joda-time.sourceforge.net/) 的成果，是一个庞大且丰富的\
  \ API。该 API 的完整文档可以在 http://download.java.net/jdk8/docs/api/ 找到。\n\n日期和时间 API 基于\
  \ ISO-8601 标准（[`www.iso.org/iso/home/standards/iso8601.htm`](http://www.iso.org/iso/home/standards/iso8601.htm)），该标准使用格列日历，这是全球通的事实日期标准。该标准提供了一种表示日期的方法并能够处理闰年。然而，使用它来表示历史日期是不恰的。`java.time.chrono`\
  \ 包中支持其他日历系统。\n\n协调世界时 (UTC) 是目前正在使用的主要时间标准。它结合了时区，并使用距离经度零度线的 `UTC` 时间偏移量。“基于时间的”（temporal-based）一词是指诸如\
  \ `LocalDate` 和 `ZonedDateTime` 等类，它们反映了表示时间的不同方式。\n\n组织对 API 的讨论有多种方法。时间可以从人类的角度，通过月份和秒等测量单位来理解。也可以从计算机的角度来理解。这种测量通常是指从\
  \ `epoch`（1970 年 1 月 1 日）开始，以毫秒或纳秒等单位计算时间。该 API 同时支持这两种视角，为开发者提供了根据问题背景选择最合适方法的选择。这两种类型可以被称为人类时间机器机器时间。\n\
  \n在处理日历中的天数时，通常倾向于使用人类时间。在处理时间持续时间（例如两个事件之间的毫秒数）时，通常倾向于使用机器时间。然而，它也可以用人类时间表示，例如两天之间的差异。\n\
  \n`instant` 是时间轴上的瞬时点。你可以用它来表示事件，或者至少表示事件发生的时间。它可以被看作事件的时间戳。\n\n我们还根据活动持续多长时间来讨论时间。Java\
  \ 8 使用 `Duration` 类来指定以分钟或秒等单位衡量的间隔。`Duration` 可用于范围，例如打开阀所需的时间或动画循环的长度。还有一个 `Period`\
  \ 类用于处理以天和月衡量的间隔。\n\n本章中使用的许多示例依赖于当前的日期和时间。因此，这些示例的输出可能无法反映今天的日期或时间。然而，它们在执行时应该反映当前的当前的日期和时间。\n\
  \n## 为什么需要新 API？\n\nJava 8 之前可用的日期时间类存在许多问题。例如，它们是可变的，这使得它们在跨线程工作时变得困难。它们通常不是类型安全的，并且用于表示单位（如月份）的内部数字使得它们难以处理。此外，在旧的\
  \ Java 日期时间类中支持国际化也非常困难。\n\n## 简单示例\n\n让我们从一个判断某个人当前是否正在上班的示例开始。该工人位于玻利维亚的拉巴斯（La\
  \ Paz Bolivia），早上 8:00 开始工作，工作 6 小时。我们想从其他地方拨打该个人，但在拨打之前，我们想确保他们安排了工作时间。\n\n首先，我们需要确定当前时间。我们可以使用\
  \ `DateTime` 类，但该类不包含时区信息。因此，我们使用 `ZonedDateTime` 类。它拥有一个 `now` 方法，返回一个代表我们所在地当前日期和时间的类实例。接下来的代码序列说明了如何实现，然后显示此日期和时间：\n\
  \n```\nZonedDateTime present = ZonedDateTime.now();\nSystem.out.println(present);\n\
  ```\n\n![](img/image265.jpg)\n\n后续输出使用了 ISO 8601 日期时间表示方案：\n\n`2014-03-05T19:50:14.613-06:00[America/Chicago]`\n\
  \n输出字符串以日期开始：2014 年 3 月 3 日。“T” 标记了时间表达式的开始。在这种情况下，它代表下午 7:50 加上 14 分钟 0.613 秒。接下来的序列\
  \ `-06:00` 显示了与 `UTC` 的偏移量。表达式的最后部分列出了括号括起来的时区。\n\n我们需要表示拉巴斯工人的开始时间和持续时间。为了获得这种表示，我们首先创建一个代表时区的\
  \ `ZoneId` 对象。接着使用 `LocalTime` 对象表示开始时间，并使用 `Duration` 对象表示员工班次的长度。这些对象的创建方式如下：\n\
  \n```\nZoneId timeZone = ZoneId.of(\"America/La_Paz\");\nLocalTime startWorkDay\
  \ = LocalTime.of(8,0);\nDuration dailyTime = Duration.ofHours(6);\n```\n\n![](img/image266.jpg)\n\
  \n为了确定员工是否在上班，我们需要一个基于其时区的开始时间和结束时间。创建这两个时间有多种方法。在接下来的代码序列中，我们首先创建一个名为 `employeeDate`\
  \ 的 `LocalDate`，用于表示日、月、年值。然后将其与 `startWorkDay` 和 `timeZone` 变量一起使用，创建一个 `ZonedDateTime`\
  \ 类型的开始时间。该日期和时间使用 `DateTimeFormatter.ofLocalizedDateTime` 进行显示。\n\n```\nLocalDate\
  \ employeeDate = ...; // 初始化\nZonedDateTime startTime = ZonedDateTime.of(employeeDate,\
  \ startWorkDay, timeZone);\nSystem.out.println(startTime.format(DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG)));\n\
  ```\n\n![](img/image267.jpg)\n\n输出：2014 年 3 月 5 日上午 8:00\n\n结束时间是通过在开始时间上加上 `dailyTime`\
  \ 计算出的。\n\n```\nZonedDateTime endTime = startTime.plus(dailyTime.toHours());\nSystem.out.println(\"\
  End: \" + endTime.format(DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG)));\n\
  ```\n\n![](img/image268.jpg)\n\n输出：2014 年 3 月 5 日下午 2:00\n\n最后一步是使用 `compareTo`\
  \ 方法结合开始时间、结束时间和当前时间来判断员工是否在上班。如果指定的时间在目标时间之前，该方法返回负值；如果在目标时间之后，则返回正值。根据这些日期，以下表达式将返回\
  \ false：\n\n```\nSystem.out.println((startTime.compareTo(present) <= 0) && (endTime.compareTo(present)\
  \ >= 0));\n```\n\n![](img/image269.jpg)\n\n## ISO-8601 字符串格式\n\n该格式用于 API 的多个方法。其格式所示：\n\
  \n`PnDTnHMn.nS`\n\n字母对应于周期、天、小时、分钟和秒。`n` 代表单位的数量并位于相应符号之前。`T` 必须在使用小时、分钟或秒字段之前。字母不区分大小写。字段可以省略，但必须按照上述顺序出现。分隔秒和字符串第一部分的点可以使用\
  \ 0 到 9 位数字。可选的正号或负号可以影响加减。天恰好为 24 小时。表 1 - 周期示例提供了它们如何使用的几个示例。\n\n***表 1 - 周期示例***\n\
  \n| 格式化字符串 | 含义 |\n| :--- | :--- |\n| \"P3DT13H5M\" | 3 天 13 小时 5 分 |\n| \"PT8H\"\
  \ | 8 小时 |\n| \"P24D\" | 24 天 |\n| \"PT15.012S\" | 15 秒 12000000 纳秒 |\n| \"-P-3H+42M\"\
  \ | +3 小时和 -42 分钟 |\n\n![](img/image270.jpg)\n\n设计考虑\n\n日期和时间 API 基于四个设计考虑：\n\n\n\
  \n\n\n# API 原则\n\n1. 方法应该易于理解\n2. 应支持流式编程风格\n3. 对象应该是不可不可的\n4. API 应该是可扩展的\n\nAPI\
  \ 方法的设计旨在让用户易于理解且清晰。它们在不同类之间应尽可能保持一致。这些名称本身已尽可能地标准化，并列于 2 - 方法命名规范摘要表中。\n\nAPI 支持流式编程风格以使其更易用。流式设计通过链式调用易于理解的方法来实现，使其变得易于学习。\n\
  \n使用 API 类创建的大多数对象都是不可变的。这一决策的主要优势是它们是线程安全的。构造函数通常不可用，这意味着经常使用静态工厂类型方法。不可变对象易于构建，且非常适合作为哈希键。\n\
  \n大多数 API 类都拥有似乎会修改日期或时间对象的方法。然而，这些方法使用它们正在执行的对象，对该日期或时间进行任何调整，然后返回一个新对象。原始对象由于是不可变的，不会被修改。\n\
  \nAPI 为开发者提供了在需要时扩展和创建唯一日历系统的能力。这允许扩展 API 以应对随之出现的独特需求。\n\n## 理解标准方法名\n\n本节的目的是提供\
  \ API 所用方法的高级概述。理解这些名称的意图将使它们更易使用。在特定情况下应该使用哪些方法将变得更加明显。\n\nAPI 类和接口拥有许多相似（即使相同）的方法。这样做是为了提高其可读性和易用性。表\
  \ 2 - 方法命名规范摘要总结了这些方法。\n\n`of`、`from` 和 `parse` 类型的方法是静态工厂方法，提供了创建日期和时间对象的主要工具。其他方法是实例方法，提供了格式化、获取字段、返回修改后的对象或将一个对象转换为不同类型的技术。\n\
  \n许多这些方法都经过重载或使用相同的前缀。为了帮助你直观理解这些方法，附录 A 中提供了各种表格，按类型组织了这些方法。\n\n### 表 2 - 方法命名规范摘要\n\
  \n| 类型 | 前缀 | 用途 |\n| :--- | :--- | :--- |\n| 创建 | `of` | 根据参数创建实例 |\n| 创建 | `from`\
  \ | 创建可能会丢失某些信息的实例 |\n| 创建 | `parse` | 通过解析输入字符串创建实例 |\n| 格式化 | `format` | 返回格式化后的字符串\
  \ |\n| 状态信息 | `get` | 返回目标对象的状态 |\n| 状态信息 | `is` | 返回与对象状态相关的布尔值 |\n| 修改 | `with`\
  \ | 返回一个元素不同的新对象 |\n| 修改 | `plus` | 返回一个增加了一个时间单位的新对象 |\n| 修改 | `minus` | 返回一个减去了一个时间单位的新对象\
  \ |\n| 修改 | `to` | 将目标对象转换为不同的类型 |\n| 修改 | `at` | 将对象与另一个结合以产生新对象 |\n\n![](img/image271.jpg)\n\
  \n### 理解 `of` 类型方法\n\n`of` 类型方法在用法上相似。它们的区别在于参数和返回类型。它们都是静态的，并返回该类的实例。附录 A 中的 `of`\
  \ 类型方法部分提供了可用类型方法的列表。以下代码序列说明了如何使用此方法创建 `LocalDate` 类的实例。整数参数对应年、月、日。\n\n```\nLocalDate\
  \ localDate = LocalDate.of(2014, 3, 6);\n```\n\n![](img/image272.jpg)\n\n### 理解\
  \ `from` 方法\n\n`from` 方法的签名在各个类之间非常一致，`Duration` 类除外。每个 `from` 方法都是静态方法，返回其执行所对应的类的实例。每个\
  \ `from` 方法都接受一个 `TemporalAccessor` 对象作为参数，`Duration` 类除外，它使用 `TemporalAmount` 对象。附录\
  \ A 中的 `from` 方法部分提供了可用类型方法的列表。\n\n以下序列从 `LocalDateTime` 创建了一个 `LocalDate`：\n\n\
  ```java\nLocalDateTime ldt = LocalDateTime.now();\nLocalDate localDate = LocalDate.from(ldt);\n\
  ```\n\n![](img/image273.jpg)\n\n### 理解 `parse` 方法\n\n静态的 `parse` 方法在实现类之间是非常一致的。它使用一个或两个参数。第一个参数始终是\
  \ `CharSequence`。当第二个参数存在时，它是一个 `DateTimeFormatter` 实例。附录 A 中的 `parse` 方法部分提供了可用的解析方法列表。\n\
  \n在此示例中，针对 `Instant` 执行 `parse` 方法，以创建一个 2010 年 1 月 1 日午夜的日期。\n\n```java\nInstant\
  \ instant = Instant.parse(\"2010-01-01T00:00:00.000Z\");\n```\n\n![](img/image274.jpg)\n\
  \n### 理解 `format` 方法\n\n`format` 方法被支持人类可读日期和时间的类使用。它使用 `DateTimeFormatter` 实例来控制日期的格式化。在下面的示例中，使用了\
  \ `ISO_DATE` 格式：\n\n```java\nLocalDate localDate = LocalDate.of(2014, 3, 6);\nSystem.out.println(localDate.format(DateTimeFormatter.ISO_DATE));\n\
  ```\n\n![](img/image275.jpg)\n\n输出如下：\n2014-03-06\n\n以下类拥有此方法：`LocalDate`、`LocalDateTime`、`LocalTime`、`MonthDay`、`OffsetDateTime`、`OffsetTime`、`Year`、`YearMonth`、`ZonedDateTime`。\n\
  \n### 理解 `get` 类型方法\n\n`get` 类型方法返回关于对象的信息。支持的方法取决于类。附录 A 中的 `get` 类型方法部分提供了方法列表。\n\
  \n在以下示例中，基于 `LocalDate` 对象返回一年中的第：\n\n```java\nLocalDate localDate = LocalDate.of(2014,\
  \ 3, 6);\nint dayOfYear = localDate.getDayOfYear();\nSystem.out.println(dayOfYear);\n\
  ```\n\n![](img/image276.jpg)\n\n输出将是 66。特定的 `get` 方法在各自的类讨论中。\n\n### 理解 `is` 类型方法\n\
  \n`is` 类型方法都返回一个布尔值。类支持的实际方法取决于类的需求。附录 A 中的 `is` 类型方法提供了列表。\n\n为了演示 `isAfter` 方法，我们创建一个代表当前日期和时间的\
  \ `Instant`，如下所示。将其与 epoch 进行比较。\n\n```java\nInstant now = Instant.now();\nSystem.out.println(now.isAfter(Instant.EPOCH));\n\
  ```\n\n![](img/image277.jpg)\n\n输出将是 true。\n\n### 理解 `with` 类型方法\n\n这些方法总是返回它们执行的类的实例。支持的方法随类而异。通常情况下，它们返回原始类的修改版本。在以下代码序列中，使用\
  \ `TemporalAdjusters` 确定月的最后一天。该类提供了许多将日期调整为不同值的有趣方法。\n\n```java\nLocalDate localDate\
  \ = LocalDate.of(2014, 3, 6);\nLocalDate endOfMonth = localDate.with(TemporalAdjusters.lastDayOfMonth());\n\
  System.out.println(endOfMonth.toString());\n```\n\n![](img/image278.jpg)\n\n输出将是：\n\
  2014-03-31\n\n### 理解 `plus` 类型方法\n\n这些方法在向现有对象添加时间单位后返回一个新对象。返回的对象与执行该方法的对象类型相同。支持的方法取决于类。附录\
  \ A 中的 `plus` 类型方法部分提供了列表。\n\n在此示例中，为 `localDate` 增加了一天：\n\n```java\nLocalDate localDate\
  \ = LocalDate.of(2014, 3, 6);\nLocalDate nextDay = localDate.plusDays(1);\n```\n\
  \n![](img/image279.jpg)\n\n\n\n\n\n具体的示例将在相应的类章节中提供。\n\n### 理解 `minus` 类型方法\n\n\
  `minus` 类型方法都返回与它们执行的类相同的类型。返回的对象是一个新对象，该对象基于原始对象，但从基础上减去了一个时间单位。所支持的方法取决于具体的类。附录\
  \ A 中的 `minus` 类型方法章节节出了所有可用的 `minus` 类型方法列表。\n\n在此示例中，从 `localDate` 减去了一天：\n\n\
  ```java\nLocalDate localDate = LocalDate.of(2014, 3, 6);\nLocalDate previousDay\
  \ = localDate.minusDays(1);\n```\n\n![](img/image280.jpg)\n\n### 理解 `to` 类型方法\n\n\
  这类方法在本质上是转换性的。它们根据用途返回不同的类型。附录 A 中的 `to` 类型方法章节节出了所有可用的 `to` 类型方法列表。\n\n在此示例中，根据\
  \ `localDate` 计算自纪元以来的天数：\n\n```java\nLocalDate localDate = LocalDate.of(2014, 3,\
  \ 6);\nSystem.out.println(localDate.toEpochDay());\n```\n\n![](img/image281.jpg)\n\
  \n输出将是 `16135`。这意味着该日期发生在纪元之后的 `16135` 天。\n\n### 理解 `at` 类型方法\n\n`at` 类型方法使用提供的参数将一种类型转换为另一种类型。这些方法特定于类。附录\
  \ A 中的 `at` 类型方法章节节出了所有可用的 `at` 类型方法列表。\n\n在以下代码序列中，计算并返回了一天的开始时间：\n\n```java\n\
  LocalDate localDate = LocalDate.of(2014, 3, 6);\nSystem.out.println(localDate.atStartOfDay());\n\
  ```\n\n![](img/image282.jpg)\n\n下方显示的输出表示午夜（“T00:00”）：\n\n`2014-03-06T00:00`\n\n\
  # 日期和时间包概述\n\n表 3 - 日期和时间包概述总结了 Java 8 中引入的日期和时间包。API 的类在表 4 - 日期和时间类概述中总结。它们按类型组织，以提供可用内容以及如何使用类实例的概述。\n\
  \n**表 3 - 日期和时间包概述**\n\n| 包 | 描述 |\n| :--- | :--- |\n| `java.time` | 包含许多常用的日期和时间类。它们都是不可变的。\
  \ |\n| `java.time.chrono` | 该包支持非格里哥历和用户设计的日历系统 |\n| `java.time.format` | 该包支持日期时间信息的格式化和解析\
  \ |\n| `java.time.temporal` | 旨在供框架和库编写者使用 |\n| `java.time.zone` | 处理时区 |\n\n![](img/image283.jpg)\n\
  \n**表 4 - 日期和时间类概述**\n\n| 类别 | 类 | 用 |\n| :--- | :--- | :--- |\n| 通用 | `Clock` |\
  \ 提供对当前日期、时间和时区的访问 |\n| 通用 | `Instant` | 以毫秒表示的时间点 |\n| 日期和时间 | `LocalDate` | 提供不带时间的日期访问\
  \ |\n| 日期和时间 | `LocalDateTime` | 提供日期和时间的访问 |\n| 日期和时间 | `LocalTime` | 提供不带日期的时间访问\
  \ |\n| 日期和时间 | `OffsetDateTime` | 使用日期和时间单位偏移 |\n| 日期和时间 | `OffsetTime` | 使用时间单位偏移\
  \ |\n| 日期和时间 | `Year` | 代表年份 |\n| 日期和时间 | `YearMonth` | 代表年月份 |\n| 持续时间和间隔 | `Duration`\
  \ | 以纳秒计的时间跨度测量 |\n| 持续时间和间隔 | `Period` | 以更易用的单位计的时间跨度测量 |\n| 时区相关 | `ZonedDateTime`\
  \ | 带时区的日期和时间 |\n| 时区相关 | `ZoneId` | 代表时区 |\n| 时区相关 | `ZoneOffset` | 表示相对于 UTC 偏移的时区\
  \ |\n| 枚举 | `Month` | 代表一年的月份：一月到十二二月 |\n| 枚举 | `DayOfWeek` | 代表一周的七天：周一到周日 |\n\n\
  ![](img/image284.jpg)\n\n### 获取当前时间\n\n当前时间由 `Clock` 类的实例表示。该类用于根据时区创建时间或日期。它是一个抽象类，允许使用备用时钟代替系统时钟。许多日期时间类拥有一个\
  \ `now` 方法，该方法使用系统时钟和当前时区创建一个瞬时。\n\n此类可以用于获取未来的日期或时间。这在测试应用程序时非常有用。可以使用特定日期对应用程序进行测试，以便更好地确定在应用时间敏感的变化时程序的行为。\n\
  \n`Clock` 类的 `systemDefaultZone` 方法将返回一个基于当前系统时钟的 `Clock` 实例。它将使用默认时区的日期时间。在下面的示例中，创建了一个\
  \ `Clock` 实例：\n\n```java\nClock clock = Clock.systemDefaultZone();\nSystem.out.println(clock);\n\
  ```\n\n![](img/image285.jpg)\n\n该序列将输出以下内容，指示它是系统时钟和当前时区：\n\n`SystemClock[America/Chicago]`\n\
  \n下一个示例使用 `millis` 方法返回自日期和时间指定的纪元以来经过的毫秒数。这个数字本身通常没有直接用途。该示例还使用了 `instant` 方法，它返回一个表示时钟时间的\
  \ `Instant` 对象。`Instant` 类将在“Instant 类”中进行讨论。\n\n```java\nSystem.out.println(clock.millis());\n\
  System.out.println(clock.instant());\n```\n\n![](img/image286.jpg)\n\n输出如下：\n\n\
  `1393774319282`\n`2014-03-02T15:31:59.282Z`\n\n如果我们想指定时区，我们使用带有 `ZoneId` 的 `system`\
  \ 方法。`ZoneId` 类在“获取 Zone ID”中会有更深入的介绍。在下面的示例中，为 `system` 方法提供了表示时区的的人可读字符串。\n\n\
  ```java\nclock = Clock.system(ZoneId.of(\"Asia/Jakarta\"));\nSystem.out.println(clock);\n\
  System.out.println(clock.getZone());\nSystem.out.println(clock.instant());\n```\n\
  \n![](img/image287.jpg)\n\n输出如下：\n\n`SystemClock[Asia/Jakarta]`\n`Asia/Jakarta`\n\
  `2014-03-02T16:15:45.830Z`\n\n另一种技术使用了 `withZone` 方法。在以下代码序列中，该方法被应用于相同的时区。`withZone`\
  \ 方法根据它所作用的对象创建一个新对象。使用了相同的日期和时间，但将其调整到了新的时区。\n\n```java\nClock clock = Clock.systemDefaultZone();\n\
  clock = clock.withZone(ZoneId.of(\"Asia/Jakarta\"));\nSystem.out.println(clock);\n\
  System.out.println(clock.getZone());\nSystem.out.println(clock.instant());\n```\n\
  \n![](img/image288.jpg)\n\n它的输出将与之前的示例相同。\n\n我们还可以根据整分钟或秒创建一个瞬时。下面的示例说明了使用 `tickMinutes`\
  \ 方法创建一个瞬时，其中时间以整分钟表示：\n\n```java\nclock = clock.tickMinutes(ZoneId.of(\"Asia/Jakarta\"\
  ));\nSystem.out.println(clock);\nSystem.out.println(clock.instant());\n```\n\n![](img/image289.jpg)\n\
  \n输出显示整分钟且秒零：\n\n`TickClock[SystemClock[Asia/Jakarta],PT1M]`\n`2014-03-02T16:15:00Z`\n\
  \n### 使用 Instant 类\n\n瞬时是自纪元以来经过的纳秒数表示的时间点。负值表示纪元之前的时间，正值表示纪元之后的时间。`Instant` 类支持这种概念，并提供使用机器时间线创建时间事件的方法。\n\
  \n表 5 - Instant 常量列出了三个 `Instant` 常量。\n\n**表 5 - Instant 常量**\n\n| 常量 | 含义 |\n|\
  \ :--- | :--- |\n| `EPOCH` | 代表纪元的 Instant (1970-01-01T00:00:00Z) |\n| `MAX` | 代表未来最大的可能的\
  \ Instant (1000000000-12-31T23:59:59.999999999Z) |\n| `MIN` | 代表过去最小可能的 Instant\
  \ (-1000000000-01-01T00:00Z) |\n\n\n\n\n\n创建 `Instant` 的方法有很多种。其中许多是 `Instant` 类中的静态方法。`Instant`\
  \ 所表示的时间具有纳秒级精度，并在内部通过两个 `long` 值来支持。\n\n我们可以使用 `Clock` 的 `instant` 方法来创建一个 `Instant`\
  \ 对象：\n\n```java\nClock clock = Clock.systemDefaultZone();\nSystem.out.println(clock.instant());\n\
  ```\n\n![](img/image291.jpg)\n\n输出如下：\n\n```\n2014-03-10T17:48:38.307Z\n```\n\n\
  我们还可以使用 `Instant` 类的静态方法 `now()`，根据系统时钟确定的当前 UTC 时区创建一个 `Instant`。下文所示：\n\n```java\n\
  Instant now = Instant.now();\nSystem.out.println(now);\n```\n\n![](img/image292.jpg)\n\
  \n该序列的输出可能如下所示：\n\n```\n2014-03-02T16:00:14.929Z\n```\n\n### 基于时间纪（Epoch）创建 Instant\n\
  \n我们可能需要从时间纪创建一个 `Instant`，以标记机器时间线上的某个事件。有三种方法可以根据从时间纪开始经过的时间产生 `Instant`。它们的区别在于参数以及所生成的\
  \ `Instant` 对象的精度。\n\n***表 6 – 基于时间纪的 Instant***\n\n| 方法 | 参数 | 参数的含义 |\n| :---\
  \ | :--- | :--- |\n| ofEpochSecond | `long epochSecond` | 从时间纪开始的秒数 |\n| ofEpochSecond\
  \ | `long epochSecond, long nanoAdjustment` | 从时间纪开始的秒数带有纳秒调整 |\n| ofEpochMilli\
  \ | `long epochMilli` | 从时间纪开始的毫秒数 |\n\n![](img/image293.jpg)\n\n以下说明了如何创建一个在时间纪之后\
  \ 500,000,000 毫秒的 `Instant`：\n\n```java\nInstant instant = Instant.ofEpochMilli(500000000);\n\
  System.out.println(instant);\n```\n\n![](img/image294.jpg)\n\n输出如下：\n\n```\n1970-01-06T18:53:20Z\n\
  ```\n\n### 基于解析 UTC 字符串创建 Instant\n\n还有一个 `parse` 方法，它接受一个代表时间点的 UTC 字符串作为参数。如果字符串无效，则会抛出异常（`DateTimeParseException`）。这个便利方法对人类友好。\n\
  \n以下说明了如何使用该方法根据 2010 年 1 月 1 日的日期和时间创建一个瞬：\n\n```java\ninstant = Instant.parse(\"\
  2010-01-01T00:00:00.000Z\");\nSystem.out.println(instant);\n```\n\n![](img/image295.jpg)\n\
  \n输出将是：\n\n```\n2010-01-01T00:00:00Z\n```\n\n### 通过对 Instant 增加或减少时间创建 Instant\n\
  \n有一系列针对 `Instant` 对象的 `plus` 和 `minus` 类型方法。这些方法通过 `Instant` 增加或减去一个增量，然后返回反映此时间的新\
  \ `Instant` 对象。增加或减去的的单位可以是秒、毫秒、纳秒或 `TemporalAmount`。`TemporalAmount` 正如其名，是秒等时间单位的数量。\n\
  \n以下代码序列说明了增加 3600 秒（1 小时），然后从该时间减去 500 毫秒。示例还展示了如何支持流式编程。链式方法易于阅读和理解。\n\n```java\n\
  instant = Instant.now()\n  .plusSeconds(3600)\n  .minusMillis(500);\n\nSystem.out.println(instant);\n\
  ```\n\n![](img/image296.jpg)\n\n输出如下：\n\n```\n2014-03-02T17:57:57.758Z\n```\n\n\
  ### 使用 Instant 类的 get 方法\n\n`Instant` 类有几个 getter 方法。这些方法返回各种类型的信息，例如相对于时间纪的秒数，或者一个瞬是发生在时间纪之前还是之后。这些方法总结在表\
  \ 7 - Instant Getter 方法中。\n\n以下说明了这些方法：\n\n```java\nInstant now = Instant.now();\n\
  System.out.println(now.getEpochSecond());\nSystem.out.println(now.getNano());\n\
  System.out.println(now.isAfter(Instant.EPOCH));\nSystem.out.println(now.isBefore(Instant.EPOCH));\n\
  ```\n\n![](img/image297.jpg)\n\n一个可能的输出如下。`getNano` 方法返回的值是自上一秒开始的纳秒数，而不是从时间纪开始。\n\
  \n```\n1393776014\n929000000\ntrue\nfalse\n```\n\n表 7 - Instant Getter 方法\n\n| 返回类型\
  \ | 方法 | 含义 |\n| :--- | :--- | :--- |\n| `long` | `getEpochSecond()` | 相对于时间纪的秒数，正负均可\
  \ |\n| `int` | `getNano()` | 自上一秒的纳秒数。 |\n| `boolean` | `isAfter(Instant otherInstant)`\
  \ | 如果所应用的 `Instant` 发生在 `otherInstant` 之后，则返回 true |\n| `boolean` | `isBefore(Instant\
  \ otherInstant)` | 如果所应用的 `Instant` 发生在 `otherInstant` 之前，则返回 true |\n\n![](img/image298.jpg)\n\
