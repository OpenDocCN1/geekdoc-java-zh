  \n\n\n\n\n# 使用 Nashorn JavaScript 引擎\n\nJavaScript 引擎是解释 JavaScript 代码的软件。Nashorn\
  \ JavaScript 引擎用 Java 编写，允许将 JavaScript 代码嵌入到 Javaget 中。它是 `Rhino` JavaScript 引擎的继任者，具有更好的内存利用率和性能。\n\
  \n该引擎支持许多操作，包括：\n\n- 评估孤立的脚本或完整的 JavaScript 文件\n- 调度脚本函数\n- 从 JavaScript 执行 Java\
  \ 代码\n- 使用脚本实现 Java 接口\n\nNashorn 引擎是一个复杂的 API。在这里，我们仅提供其功能的概述。关于该引擎的更多详细信息，可以在\
  \ [`download.java.net/jdk8/docs/technotes/guides/scripting/nashorn/toc.html`](http://download.java.net/jdk8/docs/technotes/guides/scripting/nashorn/toc.html)\
  \ 找到。\n\n## 访问 Nashorn 引擎\n\n为了使用该引擎，需要创建一个 JavaScript 引擎的实例。这是通过两个类实现的：`ScriptEngineManager`\
  \ 和 `ScriptEngine`。`ScriptEngineManager` 类用于管理 Java JVM 可用的脚本引擎。`ScriptEngine` 类的实例代表\
  \ JavaScript 引擎。\n\n在下面的序列中，创建了一个 JavaScript 引擎的实例。`getEngineByName` 方法返回引擎实例，而\
  \ `eval` 方法将执行任意 JavaScript 代码。在这个示例中，它确定了字符串的长度。`eval` 方法被封装在 `try` 块中，因为必须处理 `ScriptException`\
  \ 异常。\n\n```\nScriptEngineManager manager = new ScriptEngineManager();\n\nScriptEngine\
  \ engine = manager.getEngineByName(\"nashorn\");\n\ntry {\n    Object result = engine.eval(\n\
  \    \"'Nashorn JavaScript Engine'.length\");\n    System.out.println(result);\n\
  \n} catch (ScriptException ex) {…);\n```\n\n![](img/image351.jpg)\n\n此示例的输出将是 25。\n\
  \n## 执行 JavaScript 代码\n\n除了使用带有简单字符串参数的 `eval` 方法外，还有其他几种方法。以下定义了一个 JavaScript 函数\
  \ `sumOfSquares`，它返回两个数字平方的和。然后我们使用 `eval` 方法执行该函数。\n\n```\nengine.eval(\"function\
  \ sumOfSquares(a, b) {\nreturn a*a + b*b;}\");\n\nSystem.out.println(engine.eval(\n\
  \"sumOfSquares(1, 2);\"));\n```\n\n![](img/image352.jpg)\n\n输出将是 5.0。\n\n另一种方法使用了\
  \ `javax.script.Invocable` 接口。`engine` 变量可以强制转换为此接口，这允许我们使用接口的 `invokeFunction`\
  \ 方法执行脚本代码，如下所示。它产生的输出与上一个示例相同。\n\n```\nInvocable invocable = (Invocable) engine;\n\
  \nSystem.out.println(\ninvocable.invokeFunction(\n\"sumOfSquares\", 1, 2));\n```\n\
  \n![](img/image353.jpg)\n\n我们也可以评估文件中的脚本代码。以下是名为 `maximum.js` 的文件内容。该函数返回传递它的最大数字。\n\
  \n```javascript\nfunction max() {\n  var largest = arguments[0];\n  for(var index\
  \ = 1; index < arguments.length; index++)\n  if (arguments[index] > largest) {\n\
  \    largest = arguments[index];\n  }\n  return largest;\n}\n```\n\n![](img/image354.jpg)\n\
  \n使用此文件创建一个 `FileReader` 对象，然后使用 `max` 函数和传递给函数的参数列表执行 `invokeFunction`：\n\n```\n\
  engine.eval(new FileReader(\"maximum.js\"));\n\nSystem.out.println(invocable.invokeFunction(\n\
  \"max\", 23, 21, 43, -36, 2, 51));\n```\n\n![](img/image355.jpg)\n\n输出将是 51。\n\n\
  ## 从 JavaScript 执行 Java 代码\n\n通过使用类和接口支持在 JavaScript 中嵌入 Java 代码。对 Java 类型的引用通常必须完全限定的。在下面的\
  \ JavaScript 序列中，使用了 `LocalDateTime` 类实例来获取并显示当前日期和时间。\n\n```javascript\nvar today\
  \ = java.time.LocalDateTime.now();\n\nprint(today);\n```\n\n![](img/image356.jpg)\n\
  \n我们可以通过将此代码序列放入名为 `UsingJava.js` 的文件中，然后使用以下语句从 Java 调用它来演示这一点：\n\n```\nengine.eval(new\
  \ FileReader(\"UsingJava.js\"));\n```\n\n![](img/image357.jpg)\n\n可能的输出如下：\n\n2014-03-15T14:14:38.410\n\
  \nNashorn 提供了一个名为 `Java` 的对象，它拥有 `to` 和 `from` 方法。该对象用于支持 Java 和 JavaScript 之间的转换。由于\
  \ `toArray` 方法返回的对象是 Java 数组而不是 JavaScript 数组，因此在转换为正确的 JavaScript 对象之前，它无法被正确显示。这是通过\
  \ `from` 方法实现的。\n\n在下面的序列中，创建了一个列表。从列表中创建了一个 `Stream` 对象，并以流式方式对其应用了 `filter`、`sort`\
  \ 和 `toArray` 方法。`filterNumber` 函数被用作 `filter` 方法的参数，以消除大于 10 的数字的进一步处理。使用 `from`\
  \ 方法将 Java 数组转换为 JavaScript 数组。\n\n```javascript\nfunction filterNumber (n) { return\
  \ n>10};\n\nvar list = java.util.Arrays.asList(23,29);\n\nvar result = list.stream().filter(filterNumber).sorted().toArray();\n\
  \nvar array = Java.from(result);\n\nprint(array);\n```\n\n![](img/image358.jpg)\n\
  \n代码的输出如下：\n\n23,29\n\n## 实现 Java 接口\n\n可以使用 JavaScript 实现 Java 接口。如有必要也可以扩展 Java\
  \ 类。在这里我们演示使用 `List` 的基本方法。\n\n在下面的示例中，声明了一个 JavaScript 变量并赋值 `List` 的实现。实现通过使用\
  \ `new` 关键字和完全限定的接口名称开始。随后是块语句中的实现体。在这个实现中，支持两个变量和两个方法。\n\n```javascript\nvar list\
  \ = new java.util.List() {\n  list: \"\",\n  count: 0,\n  add: function(item) {\n\
  \    this.list += item + \" \";\n    this.count++;\n  },\n  size: function() {\n\
  \    print(this.count);\n  }\n};\n```\n\n![](img/image360.jpg)\n\n使用以下代码序列测试此实现：\n\
  \n```\nlist.size();\nlist.add(\"cat\");\nlist.size();\n```\n\n![](img/image361.jpg)\n\
  \n输出如下：\n\n0\n\n1\n\n除了接口定义的方法外，无法向实现添加其他方法。\n\n## IO 增强\n\nLambda 表达式的引入和 IO 能力特定增强使得处理文件变得更容易。我们将首先调查使用\
  \ Lambda 表达式配合 `FileFilter` 接口，然后后续介绍其他方法。Lambda 表达式将在第二章中讨论。\n\n为了说明许多这些技术，我们将使用两个辅助方法：`getFileName`\
  \ 和 `getExtension`。`getFileName` 方法接收一个 `Path` 对象并返回文件名。`getExtension` 返回传递给它的文件名的扩展名。\n\
  \n```java\npublic static String getFileName(Path path) {\n  return path.getName(\n\
  \  path.getNameCount() - 1).toString();\n}\n\npublic static String getExtension(String\
  \ fileName) {\n  String extension = null;\n  int index = fileName.lastIndexOf('.');\n\
  \  if (index > 0 && index < fileName.length() - 1) {\n```\n\n\n\n\n\n```java\nextension\
  \ = fileName.substring(index + 1);\n\n}\n\nreturn extension;\n\n}\n```\n\n![](img/image362.jpg)\n\
  \n# 使用 FileFilter 接口\n\n`FileFilter` 接口自 Java 1.2 版本起就是 Java 的，用于确定目录中的哪些文件应该被返回。它有一个抽象方法\
  \ `accept`，该方法接收一个 `File` 对象并返回一个布尔值，表示该文件是否应该返回。这符合函数式接口的定义，可以与 lambda 表达式配合使用。这是一个一直一直是函数式接口但未被显式称为此的接口示例。\n\
  \n以下示例说明了我们如何将 lambda 表达式用于接口。首先，我们使用 lambda 表达式定义了一个 `fileFilter` 变量，该表达式用于测试文件是否以“java”扩展结尾且大小大于\
  \ 1024 字节。然后创建一个文件并使用 `fileFilter` 变量对其进行测试。\n\n```java\nFileFilter fileFilter =\
  \ file -> {\n    String fileName = file.getName();\n    String extension = getExtension(fileName);\n\
  \    if (\"java\".equalsIgnoreCase(extension)\n    && file.length() > 1024) {\n\
  \        return true;\n    } else {\n        return false;\n    }\n};\n\nFile file\
  \ = new File(\"C:/SomeDirectory/SomeFile.java\");\nSystem.out.println(\n    file\
  \ + \" is a \" +\n    getExtension(file.getName()) +\n    \" file whose size is\
  \ at least 1024 bytes: \" +\n    fileFilter.accept(file));\n```\n\n![](img/image363.jpg)\n\
  \n一种可能的输出如下：\nC:\\SomeDirectory\\SomeFile.java is a java file whose size is at least\
  \ 1024 bytes: false\n\n# 使用 PathMatcher 接口\n\n`PathMatcher` 接口是另一个适用于 lambda 表达式的接口。该接口有一个抽象方法\
  \ `matches`，它接收一个 `Path` 对象并返回一个布尔值。在以下示例中，测试 `Path` 对象的名称是否以“.java”结尾。如果是，则返回 true。\n\
  \n```java\nPathMatcher matcher = p -> {\n    return p.toString().endsWith(\".java\"\
  );\n};\n\nPath filename = FileSystems.getDefault().getPath(\n    \"C:/SomeDirectory/SomeFile.java\"\
  );\n\nSystem.out.println(\"We have a match: \" +\n    matcher.matches(filename));\n\
  ```\n\n![](img/image364.jpg)\n\n执行此序列的结果如下：\nWe have a match: true\n\n# 使用 Files\
  \ 类的 list 方法\n\n`list` 方法返回一个 `Stream` 对象，我们可以用它来过滤或执行类似的操作。该方法封装了一个 `DirectoryStream<Path>`\
  \ 流。我们将通过一系列示例演示该方法，所有示例都可能抛出 `IOException` 异常。第一个示例使用当前目录显示目录和文件。\n\n```java\n\
  Files.list(new File(\".\").toPath())\n    .forEach(System.out::println);\n```\n\n\
  ![](img/image365.jpg)\n\n输出如下所示，但实际结果取决于你的当前目录：\n.\\build\n.\\build.xml\n.\\manifest.mf\n\
  .\\nbproject\n.\\src\n.\\test\n\n下一个示例使用 `filter` 方法只列出 XML 文件：\n\n```java\nFiles.list(new\
  \ File(\".\").toPath())\n    .filter(p -> \"xml\".equalsIgnoreCase(\n    getExtension(getFileName(p))))\n\
  \    .forEach(p -> System.out.println(getFileName(p)));\n```\n\n![](img/image366.jpg)\n\
  \n一种可能的输出是：\nbuild.xml\n\n我们可以像下面所示使用 `newDirectoryStream` 方法来实现相同的结果：\n\n```java\n\
  Path files = new File(\".\").toPath();\ntry (DirectoryStream<Path> directories =\n\
  \    Files.newDirectoryStream(files);) {\n    directories.forEach(System.out::println);\n\
  }\n```\n\n![](img/image367.jpg)\n\n# 使用 Files 类的 walk 方法\n\n`walk` 方法允许我们处理目录及其子目录中的文件。在这个示例中，我们只列出当前目录或其子目录中的\
  \ XML 文件：\n\n```java\nFiles.walk(new File(\".\").toPath())\n    .filter(p -> \"\
  xml\".equalsIgnoreCase(\n    getExtension(getFileName(p))))\n    .forEach(System.out::println);\n\
  ```\n\n![](img/image368.jpg)\n\n一种可能的输出如下：\n.\\build.xml\n.\\nbproject\\build-impl.xml\n\
  .\\nbproject\\private\\private.xml\n.\\nbproject\\project.xml\n\n# 使用 Path 类的 lines\
  \ 方法\n\n`Path` 类的静态方法 `lines` 将根据文件内容返回一个字符串流。文件的每一行都作为单个字符串返回并添加到流中。让我们从一个名为 `data.txt`\
  \ 的文件开始，其中包含以下数据：\n\nThe old stream flowed\nfrom the mountain maintaining\nits ever\
  \ meandering course\n\n以下代码序列说明了如何对该文件使用 `lines` 方法。创建一个表示该文件的 `Path` 对象。`lines`\
  \ 方法使用此路径并返回一个输入行的流。然后显示这些行。\n\n```java\ntry {\n    Path path = FileSystems.getDefault().getPath(\"\
  data.txt\");\n    Stream<String> input = Files.lines(path);\n    input.forEach(System.out::println);\n\
  } catch (IOException ex) {\n    ex.printStackTrace();\n}\n```\n\n![](img/image369.jpg)\n\
  \n输出为：\nThe old stream flowed\nfrom the mountain maintaining\nits meandering course\n\
  \n## 并发增强\n\nJava 8 引入了许多并发增强。最显著的是支持并行流（在第 3 章中讨论）。`java.util.Arrays` 类也引入了对数组元素的并行操作。对于并行流，许多方法被引入。\n\
  \n# 使用 Arrays 类的 parallelSort 方法\n\n`parallelSort` 方法以并发方式对数组元素排序。对于所有原始数据类型和泛型对象都有这种重载方法。`parallelSort`\
  \ 会将数组划分为子数组，然后在专用处理器上进行排序。然后排序后的子数组将重新组合。取决于数组的大小，并行排序可能比顺序排序更快。如果数组未达到特定阈值，它将回退到顺序排序。\n\
  \n```java\nint[] largeArray = new int[10000];\nRandom random = new Random();\nfor\
  \ (int i = 0; i < 10000; i++) {\n    largeArray[i] = random.nextInt(1000);\n}\n\
  Arrays.parallelSort(largeArray);\nfor (int i = 0; i < 10; i++) {\n    System.out.println(largeArray[i]);\n\
  }\n```\n\n![](img/image370.jpg)\n\n假设生成了至少 10 个零，代码序列的输出应该是前 10 个零。\n\n# 使用 Arrays\
  \ 类的 parallelSetAll 方法\n\n多个静态 `parallelSetAll` 方法对数组的每个元素应用操作。**表 1 - parallelSetAll\
  \ 方法** 列出了这些方法。\n\n***表 1 - parallelSetAll 方法***\n\nparallelSetAll 方法\n`void parallelSetAll(double[]\
  \ array IntToDoubleFunction generator)`\n`void parallelSetAll(int[] array IntUnaryOperator\
  \ generator)`\n`void parallelSetAll(long[] array IntToLongFunction generator)`\n\
  `<T> void parallelSetAll(T[] array IntFunction<? extends T> generator)`\n\n![](img/image371.jpg)\n\
  \n在以下示例中，数组的每个元素都被设置为 1。第一个参数是数组。第二个参数是实现 `IntUnaryOperator` 接口的 lambda 表达式。返回值分配给数组的该元素。\n\
  \n```java\nint[] numbers = new int[25000];\nArrays.parallelSetAll(numbers, p ->\
  \ 1);\n```\n\n![](img/image372.jpg)\n\n在这个示例中，每个元素被设置为索引的二倍：\n\n```java\nArrays.parallelSetAll(numbers,\
  \ p -> 2 * p);\n```\n\n![](img/image373.jpg)\n\n# 使用 Arrays 类的 parallelPrefix 方法\n\
  \n重载的 `parallelPrefix` 方法通过对元素应用二元运算符来处理每个元素，执行累积操作。这些方法列在表 2 - parallelPrefix 方法中。\n\
  \n***表 2 - parallelPrefix 方法***\n\nparallelPrefix 方法\n`void parallelPrefix(double[]\
  \ array DoubleBinaryOperator op)`\n\n\n\n\n\n```java\nvoid parallelPrefix(double[]\
  \ array int fromIndex int toIndex DoubleBinaryOperator op)\n\nvoid parallelPrefix(int[]\
  \ array IntBinaryOperator op)\n\nvoid parallelPrefix(int[] array int fromIndex int\
  \ toIndex IntBinaryOperator op)\n\nvoid parallelPrefix(long[] array int fromIndex\
  \ int toIndex LongBinaryOperator op)\n\nvoid parallelPrefix(long[] array LongBinaryOperator\
  \ op)\n\n<T> void parallelPrefix(T[] array BinaryOperator<T> op)\n\n<T> void parallelPrefix(T[]\
  \ array int fromIndex int toIndex BinaryOperator<T> op)\n```\n\n![](img/image374.jpg)\n\
  \n该方法使用两个参数：数组和一个二元运算符。在这种情况下，二元运算符使用两个值，作为数组的索引。第一个索引应用于一个元素，第二个索引应用于第一个元素之后的元素。这些索引处的元素将按照二元操作指定的，应用到第二个索引指定的数组元素上。\n\
  \n在接下来的示例中，`numbers` 数组的每个元素都被赋值为 2。二元运算符将相邻元素相加。\n\n```java\nint[] numbers = new\
  \ int[25];\nArrays.parallelSetAll(numbers, p -> 2);\nArrays.parallelPrefix(numbers,\
  \ (n, m) -> n + m);\nfor (int i = 0; i < 25; i++) {\n    System.out.println(numbers[i]);\n\
  }\n```\n\n![](img/image375.jpg)\n\n这将输出以 2 为步进的 2 到 50 的序列。每个元素都是前一个元素和当前元素的和。接下来的调用将计算\
  \ 2 的幂：\n\n```java\nArrays.parallelPrefix(numbers, (n, m) -> n * m);\n```\n\n![](img/image376.jpg)\n\
  \n## Collections 框架增强\n\nCollections 框架增加了许多新方法。这些新增内容的变部分列表列在**表 3 - Collections\
  \ 框架新增**中。`java.util` 包的更改和删除的更完整列表可以在此处 [`cr.openjdk.java.net/~mr/se/8/java-se-8-pr-spec/apidiffs/java/util/package-summary-stat.html`](http://cr.openjdk.java.net/~mr/se/8/java-se-8-pr-spec/apidiffs/java/util/package-summary-stat.html)找到。其中某些方法，例如\
  \ `stream` 和 `forEach` 方法已经在之前的章节中讨论过。在本节中，我们将探索其他一些方法。\n\nJava 7 增加了一种替代 String\
  \ 哈希函数。Java 8 删除了该函数以及 `jdk.map.althashing.threshold` 系统属性。取而使用的是平衡树而不是链表。树的每个节点都将包含用于存放冲突的桶。此更改仅适用于\
