  - 尽可能使用 x86 AES 指令以提高开箱即用的 AES 加密性能\n- 通过添加 MS-SFU 扩展改进 Kerberos 5 的实现\n- 添加对 TLS\
  \ 服务器名称指示 (SNI 扩展的支持\n- 添加对 AEAD/GCM 密码套件的支持\n- 改进对调用者敏感（caller-sensitive）方法的处理方式\n\
  \n调用者敏感方法会根据其直接调用者的类改变自己的行为。它通过调用 `sun.reflect.Reflection.getCallerClass()` 方法来发现调用者的类。调用者敏感方法可以通过反射调用。当发生这种情况时，将对手动维护的调用者敏感列表使用模式匹配技术。相反，所有调用者敏感方法将被标记为\
  \ `@sun.reflect.CallerSensitive` 注解。这将有助于确保方法是针对实际调用者类调用的。\n\n此外，添加了各种算法实现：NSA Suite\
  \ B 加密算法、SHA-224 消息摘要算法，以及用于 64 位 Windows 的 SunPKCS11 提供程序。\n\n对基于密码的加密 (PBE) 算法、证书吊销检查\
  \ API 以及 KeyStore API 的各个方面进行了改进。此外，在生成安全随机数时添加了配置限制。\n\n## VM 相关增强\n\n有若干项与 VM\
  \ 的改进，其中大多数对典型用户是透明的。下面列出了这些改进，以便读者了解相关工作：\n\n- 减少了在核心之间访问对象字段时的缓存竞争\n- 删除了永久代（permanent\
  \ generation），以消除调整永久代大小的需求\n- 删除了三个很少使用的垃圾回收器组合\n- 提供了有关验证错误的更多信息\n- 减少了类元数据的占用\n\
  - 减少了 HotSpot 的类元数据内存占用以提高性能\n- 支持创建小型 VM\n- 在 `sun.misc.Unsafe` 类中添加了三个内存排序内联函数\n\
  \n## Java 核心增强\n\n还进行了许多其他更改。这些包括对 `javac` 编译器的增强以提高其性能，并改进核心库类的动态内存使用。改进了 `Charset`\
  \ 类和 `java.text.DecimalFormat.format()` 方法的实现。\n\nAPI 的部分内容已升级。平台现在支持 Unicode 标准的\
  \ 6.2 版本。此外，JAXP 已升级到 1.5 版本。添加了 Base64 编码和解码的标准 API，该 API 位于 `java.util.Base64`\
  \ 类中。\n\n对注解进行了改进，允许将相同类型的多个注解应用于单个程序元素。删除了注解处理工具 (APT)、API 和文档。使用该工具无法对 Java 5\
  \ 之后添加许多语言特性进行建模。删除是为了过渡到 JSR 269（可插式注解处理 API）。该 API 允许在 `javac` 中使用自定义注解处理器。\n\n\
  核心反射在多个方面得到了改进。访问参数名称变得更加简单和可靠。`javax.lang.model.*` API 使用了核心反射而不是使用 `javac`。\n\n\
  ## 总结\n\n本章检查了 Java 8 的许多新特性。我们从检查 Nashorn JavaScript 引擎开始。该功能允许从 Java 应用程序执行 JavaScript\
  \ 代码。此外，可以从 JavaScript 访问 Java 代码。我们看到了几个文件 IO 类和方法如何轻松地支持 lambda 表达式。Collections\
  \ 框架中添加了一些方法，包括 `forEachRemaining` 和几个替换类型方法。这些扩展了 Collections 框架的能力。我们还查看了 Java\
  \ 8 中提供的其他并发增强。\n\n***\n\n## 附录 - 日期和时间类\n\n本附录的目的是提供一种简单的方法来确定某个类是否支持特定类型的方法。例如，假设你想知道\
