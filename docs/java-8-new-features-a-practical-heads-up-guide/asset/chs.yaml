  \ Java 平台的部分内容，以便 Java 能够在资源极少的平台上运行。例如，某些平台不需要 GUI API，消除它们可以节省空间。\n\n### 紧凑配置\
  \ (The Compact Profiles)\n\n共有三个紧凑配置：`compact1`、`compact2` 和 `compact3`。每个紧凑配置都由一组类组成。`compact1`\
  \ 最小。`compact2` 包含 `compact1` 的所有包加上额外的包。`compact3` 包含 `compact1` 和 `compact2` 的所有类加上另一组包。每个紧凑配置中包含的包列在**表\
