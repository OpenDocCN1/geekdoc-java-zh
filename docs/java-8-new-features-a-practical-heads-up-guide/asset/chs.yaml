  \ `[www.P8tech.com/java702](http://www.P8tech.com/java702)`\n\n# 第 1 章 – Java 8\
  \ 与接口增强\n\n### Java 8 简介\n\n- 默认方法与函数式接口\n- 创建默认方法\n- 理解默认方法的重要性\n- 定义默认方法\n   \
