  - 使用默认方法\n    - 扩展现有接口\n    - 使用默认方法补充适配器类\n    - 在核心 Java 类中使用默认方法\n    - 使用类来支持默认方法\n\
  - 理解抽象类与接口之间的区别\n- 使用静态接口方法\n- 函数式接口\n    - 创建函数式接口\n    - 使用 `@FunctionalInterface`\
  \ 注解\n    - 在函数式接口中重写 `Object` 类方法\n    - 在核心库中使用函数式接口\n- 总结\n\n### Java 8 简介\n\n\
  为了让 Java 保持竞争力，它必须进化。Java 8 的增强引入了许多新的语言特性和包。在本书中，我们将检查这些新增内容，从解释默认方法和函数接口开始。这些新特性本身很有用，同时也支持其他\
  \ Java 8 特性，如 lambda 表达式和流（Stream）。接口是第一章重点。\n\nJava 8 的目标之一是支持并鼓励使用函数式编程。虽然这尚未完全实现，但\
  \ `lambda expressions` 的添加无疑鼓励了这种风格。Lambda 表达式本质上是匿名函数。随着 Java 8 的出现，出现了许多新的类函数库，旨在与\
  \ lambda 表达式配合工作。第 2 章将探索如何创建和使用这些表达式。\n\nJava 8 的另一个目标是为并发处理提供更好的支持。早期的技术虽然可行，但容易出错且难以实现。Java\
  \ 8 引入的 `Streams` 将并发编程的一些概念性困难从程序员中移开，并将其嵌入流中。流可以被看作是待按顺序或并发处理的元素集合。程序员可以指定需要做什么，而无需担心如何去实现。此外，随着\
  \ `forEach` 方法的添加，集合框架内部支持了内部迭代。我们将在第 3 章中看到流的许多应用。\n\n在 Java 中，处理日期和时间从未像现在这样简洁。Java\
  \ 8 通过引入 `java.time` 包和支持时间相关任务的新类纠正了这个问题。引入的改进有助于使这些任务的执行更具可读性和可靠性。时间的格式化也得到了改进。这些增强将在第\
  \ 4 章介绍。\n\nJava 还有许多其他新增。这些将在第 5 章中讨论。其范围从虚拟机的增强（这些对于普通程序员来说并不总是可见）到 Java 应用注解和文档方面的增强。此外，还有一些并发和字符编码的更新。此外，Nashorn\
  \ JavaScript 引擎已整合到 Java 中，允许在 Java 内部执行 JavaScript 代码。\n\n### 默认方法与函数式接口\n\n本章重点关注接口所做的各种更改以及如何定义和使用它们。它从讨论默认方法开始。这类方法是\
  \ Java 8 的重要方面，因为它们为 lambda 表达式和流等其他增强奠定了基础。我们涵盖了在旧应用程序和新应用程序中如何创建和使用默认表达式。\n\n\
  默认方法是具有实现的接口方法。这意味着实现此类接口的类不需要实现默认方法。默认方法已添加到现有接口中，例如在许多集合类中找到接口。由于实现此类接口的类不需要重写这些方法，使用这些接口的现有代码仍能正常工作。\n\
  \n与早期的 Java 版本一样，支持接口之间的继承。然而，默认方法为继承增加了一个维度，并在单继承和多重继承情况下提供了重写方法的机会。\n\n`Functional\
  \ interfaces`（函数式接口）是一个且只有一个抽象方法的接口。这类接口也被称为单一抽象方法（SAM）。虽然接口可以拥有默认方法，但它只能有一个抽象方法。如第\
  \ 2 章所示，这种接口为 lambda 表达式提供了基础。\n\n### 创建默认方法\n\n默认方法是具有实现的接口方法。它们使用 `default` 关键字声明。下面是一个默认方法的示例，带有一个\
  \ `Drawable` 接口定义，它包含一个默认方法和一个抽象方法：\n\n```java\ninterface Drawable {\n    public\
  \ default void draw() {\n        System.out.println(\n        \"The Drawable interface's\
  \ draw method\");\n    }\n    public boolean hasBeenDrawn();\n}\n```\n\n![](img/image1.jpg)\n\
  \n为了说明该接口的使用，我们将下面定义的 `Person` 类。`draw` 方法不需要实现，但 `hasBeenDrawn` 方法需要，因为它是抽象的：\n\
  \n```java\nclass Person implements Drawable {\n    public boolean hasBeenDrawn()\
  \ {\n        return true;\n    }\n}\n```\n\n![](img/image2.jpg)\n\n从主方法我们创建一个 `Person`\
  \ 类的实例并执行 `draw` 方法：\n\n```java\npublic static void main(String[] args) {\n    Person\
  \ person = new Person();\n    person.draw();\n}\n```\n\n![](img/image3.jpg)\n\n\
  执行时，我们得到如下输出：\n\nThe Drawable interface's draw method\n\n实现类为了使用默认方法而不需要实现该方法。\n\
  \n默认方法可以添加到现有接口中。这些方法有时被称为虚拟扩展方法。这个术语源于扩展现有接口使其能够获取新方法而不破坏现有代码的想法。该接口被认为已经扩展了。虚拟扩展方法也被称为\
  \ **defender methods**。\n\n\n\n\n\n注意：我将使用 `default methods` 术语，因为我们使用 `default`\
  \ 关键字来表示默认方法（类似于我们使用 `static` 关键字来表示静态方法）。有人认为，在接口中添加默认方法破坏了接口概念所隐含的契约。在某种意义上，接口不再是“纯”的。这种变化是否是更好尚待争议。无论如何，默认方法的使用为开发者提供了一种额外的技术。\n\
  \n## 理解默认方法的重要性\n\n引入默认方法有以下几个原因：\n\n-   现有代码不需要更新即可实现新方法。这允许接口进行向增长或扩展。\n-   在继承层次结构的设计中提供额外的灵活性，例如：\n\
  \    - 在接口层次结构中放置功能的位置时提供额外的选项\n    - 支持模拟适配器类类型功能的接口\n-   支持 lambda 表达式\n\n接口中仍然不允许私有变量。在上一个例子中，抽象方法\
  \ `hasBeenDrawn()` 暗示了可能使用类状态的变量。然而，对状态信息的任何支持都由接口的实现者提供。\n\n## 定义默认方法\n\n让我们查看创建和使用默认方法的细节。`default`\
  \ 关键字始终用于声明默认方法。从技术上讲，该关键字似乎并不是必要的。毕竟，从方法体的存在可以明显看出它不是抽象的。它的主要理由是为了明显看出该方法已实现。\n\
  \n这类似于使用 `abstract` 关键字来声明抽象方法和抽象类。虽然抽象方法由于缺少方法体而显而易见，抽象类也由于存在抽象方法而显而易见，但这些关键字的使用明确了意图。例如，在接口中声明抽象方法并不需要\
  \ `abstract` 关键字。我们可以按照如下方式声明之前的抽象方法：\n\n```java\npublic interface Drawable {\n\
  //…\npublic boolean hasBeenDrawn();\n}\n```\n\n![](img/image4.jpg)\n\n然而，我们将显式地使用\
  \ `abstract` 关键字来清楚地表达意图。\n\n`default` 关键字可以用方法声明中的两个位置。将关键字放在任何作用域修饰符之前或之后。作用域修饰符通常是理想的，但不是要求的。`default`\
  \ 关键字的可能放置位置所示：\n\n```java\npublic default void draw(){…}\ndefault public void draw(){…}\n\
  default void draw(){…}\n```\n\n![](img/image5.jpg)\n\n“默认方法”一词不应被误认为如果没有提供其他方法，它将被默认执行。事实上，一个接口可以有多个默认方法，如下：\n\
  \n```java\ninterface Drawable {\n    default void draw() {\n        System.out.println(\"\
  The Drawable interface's draw method\");\n    }\n    default void drawInQuotes()\
  \ {\n        System.out.println(\"\\\"The Drawable interface's drawInQuotes method\\\
  \"\");\n    }\n    public abstract boolean hasBeenDrawn();\n}\n```\n\n![](img/image6.jpg)\n\
  \n这两个方法都可以从实现类中使用，如下所示：\n\n```java\nPerson person = new Person();\nperson.draw();\n\
  person.drawInQuotes();\n```\n\n![](img/image7.jpg)\n\n输出如下：\n\n```\nThe Drawable\
  \ interface's draw method\n\"The Drawable interface's drawInQuotes method\"\n```\n\
  \n## 重写默认方法\n\n类必须重写抽象方法以避免变成抽象类，但默认方法不需要重写。可以根据需要重写以提供另一种实现。在以下 `Person` 类的实现中，提供了一个被重写的\
  \ `draw` 方法：\n\n```java\ninterface Drawable {\n    public default void draw() {\n\
  \        System.out.println(\"The Drawable interface's draw method\");\n    }\n\
  }\n\nclass Person implements Drawable {\n    @Override\n    public void draw() {\n\
  \        System.out.println(\"The Person's draw method\");\n    }\n}\n```\n\n![](img/image8.jpg)\n\
  \n虽然 `@Override` 注解不是必须的，但包含它是良好的编程习惯。当现在调用 `draw` 方法时，将执行 `Person` 类的实现，如下所示：\n\
  \n```java\nPerson person = new Person();\nperson.draw();\n```\n\n![](img/image9.jpg)\n\
  \n输出如下：\n\n```\nThe Person's draw method\n```\n\n如果我们想从实现接口的类使用默认方法的实现，我们使用接口名称，后跟\
  \ `super` 关键字，然后是方法名——所有部分用点隔开。对于 `draw` 方法，实现如下所示：\n\n```java\nclass Person implements\
  \ Drawable {\n    @Override\n    public void draw() {\n        Drawable.super.draw();\n\
  \        System.out.println(\"The Person's draw method\");\n    }\n}\n```\n\n![](img/image10.jpg)\n\
  \n所示的输出是基于之前对 `Person` 实例调用 `draw` 方法的结果：\n\n```\nThe Drawable interface's draw\
  \ method\nThe Person's draw method\n```\n\n在实现类中重写默认方法时不能使用 `default` 关键字。例如，以下代码将无法正常编译：\n\
  \n```java\nclass Person implements Drawable {\n    @Override\n    public default\
  \ void draw() {\n        System.out.println(\"The Person's draw method\");\n   \
  \ }\n}\n```\n\n![](img/image11.jpg)\n\n将生成类似下面的错误信息：\n\n```\nmodifier default not\
  \ allowed here\n```\n\n## 在默认方法中使用继承\n\n接口可以相互继承。复杂的层次结构是可能的，包括使用多继承的情况。结果是默认方法可以在层次结构被重写。在本节中，我们将说明各种方案并解释运行时系统如何确定使用的方法。\n\
  \n### 使用单继承\n\n与早期的 Java 版本一样，接口可以派自另一个接口。如下所示，`Displayable` 接口派自 `Drawable` 接口。在初始版本中，`Displayable`\
  \ 接口没有添加方法。\n\n```java\ninterface Drawable {\n    public default void draw() {\n\
  \        System.out.println(\"The Drawable interface's draw method\");\n    }\n\
  }\n\npublic interface Displayable extends Drawable {\n}\n```\n\n![](img/image12.jpg)\n\
  \n`Person` 类实现了 `Displayable` 接口，如下：\n\n```java\npublic class Person implements\
  \ Displayable {\n}\n```\n\n![](img/image13.jpg)\n\n这些关系如图 1：继承与实现。实线表示继承，虚线显示 `Person`\
  \ 类实现了 `Displayable` 接口。\n\n![](img/image14.jpg)\n\n图 1：继承与实现\n\n当对没有重写 `draw` 方法的\
  \ `Person` 实例执行 `draw` 方法时，将执行 `Drawable` 的 draw 方法，如下：\n\n```java\nPerson person\
  \ = new Person();\nperson.draw();\n```\n\n![](img/image15.jpg)\n\n输出：\n\n```\nThe\
  \ Drawable interface's draw method\n```\n\n我们可以如下所示在 `Displayable` 接口中重写 `draw`\
  \ 方法。注意 `default` 关键字。我们在接口中重写默认方法时是要求的。\n\n```java\ninterface Displayable extends\
  \ Drawable {\n    public default void draw() {\n        System.out.println(\"The\
  \ Displayable interface's draw method\");\n    }\n}\n```\n\n![](img/image16.jpg)\n\
  \n如果漏掉 `default` 关键字，我们将得到以下错误消息：\n\n```\ninterface abstract methods cannot have\
  \ body\n```\n\n`draw` 方法的输出现在反映如下：\n\n```\nThe Displayable interface's draw method\n\
  ```\n\n在层次链中可以将默认方法变为抽象。考虑如下所示的名为 `MoreDisplayable` 的第三方接口。`draw` 方法被重写为抽象方法。\n\n\
  ```java\ninterface MoreDisplayable extends Displayable {\n    @Override\n    public\
  \ abstract void draw();\n}\n```\n\n![](img/image17.jpg)\n\n当 `Person` 类实现 `MoreDisplayable`\
  \ 接口时，它必须实现 `draw` 方法。如果没有，则该类必须声明为抽象类。\n\n\n\n\n\n```java\npublic class Person\
  \ implements MoreDisplayable {\n\n}\n```\n\n![](img/image18.jpg)\n\n如果类没有声明为抽象类，将生成以下错误信息：\n\
  \n`Person is not abstract and does not override abstract method draw() in MoreDisplayable`\n\
  \n## 使用多重继承\n\nJava 中接口的多重继承一直是可能的。这种类型的继承属于行为的继承。然而，Java 仍然不支持类之间的多重继承。那种类型的继承通常被称为状态的继承。\n\
  \n接口可以继承自多个一个接口。但是，如果两个或多个基接口具有相同的默认方法（default method），就会引入歧义，需要解决这个问题。为了演示如何处理这种情况，我们将探索一个继承层次结构，其中\
  \ `MoreDisplayable` 接口派生自 `Displayable` 和 `Colorable` 接口，如图 2：接口之间的多重继承所示。\n\n![](img/image19.jpg)\n\
  \n图 2：接口之间的多重继承\n\n前两个接口所示：\n\n```java\npublic interface Displayable extends Drawable\
  \ {\n    @Override\n    default void draw(){\n        System.out.println(\n    \
  \        \"The Displayable interface's draw method\"\n        );\n    }\n}\n\npublic\
  \ interface Colorable {\n    public default void draw(){\n        System.out.println(\n\
  \            \"The Colorable interface's draw method\"\n        );\n    }    \n\
  }\n```\n\n![](img/image20.jpg)\n\n下面是扩展了 `Displayable` 和 `Colorable` 接口的 `MoreDisplayable`\
  \ 接口定义。然而，没有为 `draw` 方法提供实现。\n\n```java\npublic interface MoreDisplayable extends\
  \ Displayable, Colorable {\n\n}\n```\n\n![](img/image21.jpg)\n\n这产生了一个模糊的情况，因为编译器无法确定使用两个基接口中的哪一个\
  \ `draw` 方法。这会导致以下错误信息：\n\n`interface MoreDisplayable inherits unrelated defaults\
  \ for draw() from types Displayable and Colorable`\n\n解决这个问题有几种方法。一种方法是为 `draw`\
  \ 方法提供抽象声明，所示。这强制实现类实现该抽象方法。\n\n```java\npublic interface MoreDisplayable extends\
  \ Displayable, Colorable {\n    @Override\n    public abstract void draw();\n}\n\
  ```\n\n![](img/image22.jpg)\n\n另一种方法是使用具体的 `draw` 方法：\n\n```java\npublic interface\
  \ MoreDisplayable extends Displayable, Colorable {\n    @Override\n    public default\
  \ void draw() {\n        System.out.println(\n            \"The MoreDisplayable\
  \ interface's draw method\"\n        );\n    }\n}\n```\n\n![](img/image23.jpg)\n\
  \n如果我们想使用基类的其中一个 `draw` 方法，可以显式地调用它，如下：\n\n```java\npublic interface MoreDisplayable\
  \ extends Displayable, Colorable {\n    @Override\n    public default void draw()\
  \ {\n        Displayable.super.draw();\n    }\n}\n```\n\n![](img/image24.jpg)\n\n\
  实际上，如果需要，两种方法都可以被调用：\n\n```java\npublic interface MoreDisplayable extends Displayable,\
  \ Colorable {\n    @Override\n    public default void draw() {\n        Displayable.super.draw();\n\
  \        Colorable.super.draw();\n    }\n}\n```\n\n![](img/image25.jpg)\n\n最佳解决方案取决于应用的需求。\n\
  \n## 理解菱形继承的工作原理\n\n当一个接口是另外两个接口的基接口，并且第四个接口又派生自这两个接口时，就会发生菱形继承。图 3：菱形继承说明了这种情况：`Drawable`\
  \ 接口作为 `Displayable` 和 `Colorable` 接口的基接口，而 `MoreDisplayable` 接口派生自 `Displayable`\
  \ 和 `Colorable` 接口。\n\n![](img/image26.jpg)\n\n图 3：菱形继承\n\n`draw` 方法可以在多个地方进行声明。在接下来的一组声明中，它只在\
  \ `Drawable` 接口中声明了：\n\n```java\npublic interface Drawable {\n    default void draw(){\n\
  \        System.out.println(\n            \"The Drawable interface's draw method\"\
  \n        );\n    }\n}\n\npublic interface Displayable extends Drawable { }\npublic\
  \ interface Colorable extends Drawable { }\npublic interface MoreDisplayable extends\
  \ Displayable, Colorable { }\n```\n\n![](img/image27.jpg)\n\n这可以通过编译而没有错误。如果一个类同时实现了\
  \ `Displayable` 和 `Colorable` 接口，也会发生类似的情况：\n\n```java\npublic class Busy implements\
  \ Displayable, Colorable {\n\n}\n```\n\n![](img/image28.jpg)\n\n当创建 `Busy` 的实例并对该实例执行\
  \ `draw` 方法时，将执行 `Drawable` 的 `draw` 方法，因为它是唯一可用的。如果 `Displayable` 接口也实现了 `draw`\
  \ 方法，那么 `Busy` 类将使用它的方法。\n\n```java\npublic interface Displayable extends Drawable\
  \ {\n    @Override\n    default void draw(){\n        System.out.println(\n    \
  \        \"The Displayable interface's draw method\"\n        );\n    }\n}\n```\n\
  \n![](img/image29.jpg)\n\n如果 `Displayable` 和 `Colorable` 接口都实现了 `draw` 方法，那么我们就面临与前一节中相同的歧义情况。编译器无法确定应该使用哪一个\
  \ `draw` 方法。`Busy` 类通常通过提供 `draw` 实现来解决这个问题。下面显示了其中可能的实现：\n\n```java\npublic interface\
  \ Colorable extends Drawable {\n    public default void draw(){\n        System.out.println(\n\
  \            \"The Colorable interface's draw method\"\n        );\n    }    \n\
  }\n\npublic class Busy implements Displayable, Colorable {\n    @Override\n    public\
  \ void draw() {\n        Displayable.super.draw();\n        Colorable.super.draw();\n\
  \    }\n}\n```\n\n![](img/image30.jpg)\n\n如果 `Displayable` 和 `Colorable` 接口都实现了\
  \ `draw` 方法，对 `draw` 方法的调用可能不会按预期工作。在下面的示例中，一个 `Busy` 实例被赋值给 `Colorable` 接口变量：\n\
  \n```java\nColorable colorable = new Busy();\ncolorable.draw();\n```\n\n![](img/image31.jpg)\n\
  \n可能会预期调用 `Drawable` 的 `draw` 方法，但输出显示并非如此：\n\n`The Displayable interface's draw\
  \ method`\n\n`colorable` 变量引用的是一个 `Busy` 对象，由于 `Busy` 类最直接的 `draw` 实现来自 `Displayable`\
  \ 接口，因此使用了该实现。\n\n\n\n\n\n| `Displayable` | 任何类且不是 MoreDisplayable 或 Colorable |\
  \ `Displayable` |\n| `Colorable` | 任何类且不是 MoreDisplayable 或 Displayable | `Colorable`\
  \ |\n| `Drawable` | 其他任何类或接口 | `Drawable` |\n\n![](img/image34.jpg)\n\n如果该方法在 `Person`\
  \ 类中实现，则该实现将始终被使用。如果该方法在该类没有实现，它将查找其基类以寻找。如果 `Entity` 类中存在该方法，它将使用它。由于 `Object`\
  \ 类没有实现 `draw` 方法，因此它不会在那里找到实现。\n\n如果类层级中没有该方法可用，则它将在接口层级中进行搜索。它将使用找到的第一个实现，从最派生的接口开始查找。在这种情况下，它将检查\
  \ `MoreDisplayable` 接口是否实现了该方法。如果没有，它将使用在 `Displayable` 或 `Colorable` 接口中找到的任一个实现。如果这两个类都拥有实现，且\
  \ `MoreDisplayable` 接口没有指定使用哪一个，则会导致编译错误。这种情况在上一节中讨论过。如果只有 `Drawable` 接口实现了 `draw`\
  \ 方法，则将使用该实现。\n\n如前所示，如果重写的方法调用了其直接所属类或接口的实现，则可以使用 `draw` 方法的多个实现。\n\n此选择过程可以总结为：\n\
  \n- 类的优先级高于接口，且\n- 更具体的接口（最派生的）的优先级高于不那么具体的接口。\n\n## 使用默认方法\n\n默认方法可以在许多情况下使用。本节识别并阐明了许多此类可能的用法。这些包括扩展现有接口和补充适配器类。\n\
  \n## 扩展现有接口\n\n当向现有接口添加新的抽象方法时，已经实现该接口的类将会发生破坏，因为它们不再实现新方法。然而，添加默认方法将允许在不破坏之前的实现的情况下添加新方法。传统上，定义接口时它被视为一份合约，预计不会发生更改。\n\
  \n但是，如果接口需要更改，那么默认方法的可用意味着接口可以更改，且该更改不会影响现有代码。这允许在添加新的默认方法时，现有接口继续保持可用。旧的、现接口用法不会破坏。\n\
  \n考虑以下具有单个抽象方法 `draw` 的接口：\n\n```java\ninterface Drawable {\n    public void draw();\n\
  }\n```\n\n![](img/image35.jpg)\n\n当 `Person` 等类实现该接口时，它只需要实现 `draw` 方法：\n\n```java\n\
  class Person implements Drawable {\n    public void draw() {\n        System.out.println(\"\
  The Person's draw method\");\n    }\n}\n```\n\n![](img/image36.jpg)\n\n然而，如果我们在\
  \ `Drawable` 接口中添加另一个抽象方法，如下所示的 `drawWithQuotes` 方法，我们将在 `Person` 类中引入错误：\n\n```java\n\
  interface Drawable {\n    public void draw();\n    public void drawWithQuotes();\n\
  }\n```\n\n![](img/image37.jpg)\n\n错误信息将是：\n\n`Person is not abstract and does not\
  \ override abstract method drawWithQuotes() in Drawable`\n\n我们无法在不破坏 Java 8 之前编写的旧代码的情况下轻松添加新方法。相反，如果我们在\
  \ `Drawable` 接口中使用所示默认方法，错误就会消失。我们的代码将正确编译并执行。\n\n```java\ninterface Drawable {\n\
  \    public void draw();\n    public default void drawWithQuotes() { }\n}\n```\n\
  \n![](img/image38.jpg)\n\n## 使用默认方法补充适配器类\n\n虽然像 `MouseMotionAdapter` 类尚未被默认方法接口实现取代，但可以使用默认方法提供类似的功能。例如，考虑一个等于\
  \ `MouseMotionAdapter` 的接口。Java 8 中找到的 `MouseMotionAdapter` 源码简化版本所示：\n\n```java\n\
  public abstract class MouseMotionAdapter implements MouseMotionListener {\n    public\
  \ void mouseDragged(MouseEvent e) {};\n    public void mouseMoved(MouseEvent e)\
  \ {};\n}\n```\n\n![](img/image39.jpg)\n\n一个“等效”接口可能如下：\n\n```java\npublic interface\
  \ MouseMotionAdapterInterface extends MouseMotionListener {\n    public default\
  \ void mouseDragged(MouseEvent e) { };\n    public default void mouseMoved(MouseEvent\
  \ e) { };\n}\n```\n\n![](img/image40.jpg)\n\n使用 `MouseMotionAdapter` 的示例所示。此代码将在鼠标跨越窗口时打印鼠标当前的\
  \ x 坐标。\n\n```java\npublic static void main(String[] args) {\n    JFrame frame =\
  \ new JFrame();\n    frame.addMouseMotionListener(new MouseMotionAdapter() {\n \
  \       public void mouseMoved(MouseEvent e) {\n            System.out.println(e.getX());\n\
  \        }\n    });\n    frame.setBounds(100, 100, 500, 300);\n    frame.setVisible(true);\n\
  }\n```\n\n![](img/image41.jpg)\n\n为了演示 `MouseMotionAdapterInterface` 的用法，我们将使用以下代码。该代码与之前的示例等效，只是使用了\
  \ `MouseMotionAdapterInterface` 接口的实例而不是 `MouseMotionAdapter`。其他代码的行为相同。\n\n```java\n\
  public static void main(String[] args) {\n    JFrame frame = new JFrame();\n   \
  \ frame.addMouseMotionListener(\n        new MouseMotionAdapterInterface() {\n \
  \           public void mouseMoved(MouseEvent e) {\n                System.out.println(e.getX());\n\
  \            }\n        });\n    frame.setBounds(100, 100, 500, 300);\n    frame.setVisible(true);\n\
  }\n```\n\n![](img/image42.jpg)\n\n## 在核心类中使用默认方法\n\n默认方法的引入是 Java 8 的一个重大变化。对于开发者利用\
  \ Java 8 这一特性并继续使用接口（如集合的接口），使用默认方法是理想的。如所示，`forEach` 方法已添加到 `java.lang.Iterable`\
  \ 接口。`forEach` 方法将遍历列表的每个元素并应用 `Consumer` 类的 `accept` 方法。\n\n```java\npublic interface\
  \ Iterable<T> {\n    Iterator<T>iterator();\n    default void forEach(Consumer<?\
  \ super T> action) {\n        Objects.requireNonNull(action);\n        for (T t\
  \ : this) {\n            action.accept(t);\n        }\n    }\n}\n```\n\n现在可以在不破坏现有代码中使用\
  \ `accept` 方法。在下面的示例中，`Person` 类通过添加 name 字段和支持方法进行了修改：\n\n```java\npublic class\
  \ Person {\n    String name;\n    int age;\n    public Person(String name, int age)\
  \ {\n        this.name = name;\n        this.age = age;\n    }\n    @Override\n\
  \    public String toString() {\n        return \"Person{\" + \"name=\" + name +\n\
  \        \", age=\" + age + '}';\n    }\n}\n```\n\n![](img/image44.jpg)\n\n实现 `Iterable`\
  \ 接口的 `ArrayList` 可以使用 `forEach` 方法遍历列表，如下所示。创建了一个 person 列表。然后对列表执行 `forEach` 方法。此示例使用\
  \ lambda 表达式作为 `forEach` 方法的参数。虽然这里不解释 lambda 表达式，但它的效果是通过调用 `toString` 方法显示列表中的每个\
  \ person。\n\n```java\nArrayList<Person> roster = new ArrayList();\nroster.add(new\
  \ Person(\"Ralph\", 45));\nroster.add(new Person(\"Tom\", 22));\nroster.add(new\
  \ Person(\"Mary\", 31));\n\nroster.forEach(person -> System.out.println(person));\n\
  ```\n\n![](img/image45.jpg)\n\n此序列的输出如下：\n\nPerson{name=Ralph, age=45}\n\nPerson{name=Tom,\
  \ age=22}\n\nPerson{name=Mary, age=31}\n\n这比使用 for each 语句更简单。\n\n\n\n\n`Collection`\
  \ 接口的 `parallelStream` 方法是另一个默认方法的示例，如下所示。流（Streams）的概念将在第 3 章中详细讨论。\n\n```java\n\
  public interface Collection<E> extends Iterable<E> {\n    ...\n    default Stream<E>parallelStream()\
  \ {\n        return StreamSupport.stream(spliterator(), true);\n    }\n}\n```\n\n\
  ![](img/image46.jpg)\n\n程序员可以利用这些新增的默认方法，而无需修改现有代码。在流的情况下，它具有在多核机器上增强性能的潜在优势。\n\n\
  ## 使用类来支持默认方法\n\n在这里，我们将说明类和接口如何协同工作以支持某种状态。此版本的 `Drawable` 接口使用了两个抽象方法和两个默认方法：`draw`\
  \ 和 `isNotDrawable`。默认方法依赖于实现类中抽象方法的实现。`getString` 方法应该返回 `draw` 方法所使用的字符串。`isDrawable`\
  \ 和 `isNotDrawable` 方法用于判断主体实际上是否是可绘制的。\n\n```java\ninterface Drawable {\n    public\
  \ abstract String getString();\n    default void draw() {\n        System.out.println(getString());\n\
  \    }\n    abstract boolean isDrawable();\n    default boolean isNotDrawable()\
  \ {\n        return !isDrawable();\n    }\n}\n```\n\n![](img/image47.jpg)\n\n以下展示了\
  \ `Person` 类的实现，其中两个抽象方法已经实现：\n\n```java\nclass Person implements Drawable {\n \
  \   public String getString() {\n        return \"Person\";\n    }\n    public boolean\
  \ isDrawable() {\n        return true;\n    }\n}\n```\n\n![](img/image48.jpg)\n\n\
  为了测试此实现，我们使用以下代码：\n\n```java\nPerson person = new Person();\nperson.draw();\nSystem.out.println(person.isNotDrawable());\n\
  ```\n\n![](img/image49.jpg)\n\n输出如下：\n```\nPerson\nfalse\n```\n\n## 理解抽象类与接口之间的区别\n\
  \n抽象类和带有默认方法的接口看起来可能相同，但它们之间存在若干差异。这些差异总结在表 2：抽象类与接口。一个类只能继承一个类，而接口之间支持多重继承。状态信息包含在实例变量中，而接口是不允许的。虽然我们还没有详细讨论\
  \ Lambda 表达式，但函数接口的实例可以与 Lambda 表达式一起使用。这在抽象类中是不可能的。\n\n使用抽象类还是接口取决于你应用程序的需求。\n\n\
  ***表 2：抽象类与接口***\n\n| 特性 | 抽象类 | 接口 |\n| :--- | :--- | :--- |\n| **支持多重继承** | 否\
  \ | **是** |\n| **可以有构造函数** | 是 | **否** |\n| **可以拥有状态** | 是 | **否** |\n| **可以使用 lambda\
  \ 表达式** | 否 | **是** |\n\n![](img/image50.jpg)\n\n## 使用静态接口方法\n\nJava 8 可以在接口中添加静态方法。以下展示了\
  \ `Drawable` 接口中静态方法的使用。在这个例子中，`getStandardUnit` 方法旨在返回标准单位。\n\n```java\nenum Unit\
  \ {pixel, inch, millimeter};\ninterface Drawable {\n    public default void draw(){\n\
  \        System.out.println(\n            \"The Drawable interface's draw method\"\
  \n        );\n    }\n    public static Unit getStandardUnit() {\n        return\
  \ Unit.pixel;\n    }\n}\n```\n\n![](img/image51.jpg)\n\n以下展示了该接口的使用，其中 `Shape` 类实现了\
  \ `Drawable` 接口：\n\n```java\nclass Shape implements Drawable {\n    // 实现细节省略\n\
  }\n```\n\n\n\n\n## Drawable 不是函数式接口\n\n在接口 `Drawable` 中未找到抽象方法\n\n在此声明中，该接口包含多个一个抽象方法：\n\
  \n```java\n@FunctionalInterface\ninterface Drawable {\n    public abstract String\
  \ getValue();\n    public abstract boolean hasBeenDrawn ();\n}\n```\n\n![](img/image60.jpg)\n\
  \n生成的错误信息所示：\n\n```\nUnexpected @FunctionalInterface annotation\nDrawable is not\
  \ a functional interface\nmultiple non-overriding abstract methods found in interface\
  \ Drawable\n```\n\n`@FunctionalInterface` 注解不是必须的。如果一个函数式式接口没有使用该注解，编译器仍然会将其视为函数式接口。\n\
  \n## 在函数式接口中重写 Object 类的方法\n\n所有接口都隐式地声明了 `Object` 类方法的抽象方法。在接口中也可以显式地声明来自 `Object`\
  \ 类的抽象方法。这些方法不会计入接口中抽象方法的数量。\n\n例如，尽管 `java.util` 包中的 `Comparator` 接口是一个函数式接口，但它有两个抽象方法：一个\
  \ `compare` 方法以及一个 `equals` 抽象方法。`equals` 方法实际上重写了 `Object` 类的 `equals` 方法。\n\n\
  下面的示例了如何使用 `equals` 方法为 `Drawable` 接口添加第二个抽象方法：\n\n```java\n@FunctionalInterface\n\
  public interface Drawable {\n    public abstract boolean hasBeenDrawn();\n    @Override\n\
  \    public abstract boolean equals(Object obj);\n}\n```\n\n![](img/image61.jpg)\n\
  \n接口不能作为默认方法（default method）声明 `Object` 类的任何方法。这包括常用的 `equals`、`hashCode` 和 `toString`\
  \ 方法。通常情况下，重写 `Object` 类的方法并不总是好主意，也并非必要。\n\n## 在核心库中使用函数式接口\n\n函数式接口一直是 Java 的一部分，但一直没有显式地称为函数式接口。例如，下面所示\
  \ `ActionListener` 和 `Runnable` 等接口就是函数式接口：\n\n```java\npublic interface ActionListener\
  \ extends EventListener {\n    public void actionPerformed(ActionEvent e);\n}\n\n\
  public interface Runnable {\n    public abstract void run();\n}\n```\n\n![](img/image62.jpg)\n\
  \nJava 8 添加了许多新的函数式接口。其中几个接口被添加到了新的 `java.util.function` 包中，以满足程序员的常见需求。例如，`Predicate`\
  \ 接口用于支持评估为真或否的测试用例。它的函数方法是 `test`。它有一个泛型参数并返回一个布尔值。\n\n```java\nboolean test(T\
  \ t);\n```\n\n![](img/image63.jpg)\n\n关于这些函数式接口的更详细讨论见第 2 章。\n\n## 总结\n\n在本章中，我们关注了默认方法和函数式接口的使用。默认方法是接口中具有实现的方法。引入此特性是为了允许接口随着时间的推移而增长，而不会破坏接口的现有使用。`default`\
  \ 关键字用于声明此类方法。\n\n随着默认方法的添加，我们必须考虑在单继承和多继承情况下如何处理被重写的默认方法。类的实现优于接口的实现。最派生方法的默认方法优于基础接口的默认实现。\n\
  \n函数式接口是指拥有且仅有一个抽象方法的接口。这些接口用于支持 Lambda 表达式。函数式接口的抽象方法被称为函数方法。该方法关联有一个函数描述，该描述提供了一个与\
  \ Lambda 表达式使用的目标签名。\n\n`@FunctionalInterface` 注解在 Java 8 中添加，用于指示一个接口意图是一个函数式接口。然而，函数式接口并不要求此注解。\n\
  \n在下一章中，我们将检查函数式接口的使用及其与 Lambda 表达式的使用。我们还将探索新的 `java.util.function` 包，该包引入了许多函数式接口。\n\
