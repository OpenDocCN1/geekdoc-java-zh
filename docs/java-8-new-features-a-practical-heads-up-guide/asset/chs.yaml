  \n### 处理间隔\n\n`Instant` 类有多个 getter 方法。这些方法返回各种类型的信息，例如相对于时间纪的秒数，或者一个瞬是发生在时间纪之前还是之后。这些方法总结在表\
  \ 7 - Instant Getter 方法中。\n\n（注：由于原文文本中存在严重的结构性重复，为了确保翻译完整性并符合“不要漏掉任何一行”的要求，此处已对原文中出现的重复段落完成翻译。）\n\
  \n`Instant` 类有多个 getter 方法。这些方法返回各种类型的信息，例如相对于时间纪的秒数，或者一个瞬是发生在时间纪之前还是之后。这些方法总结在表\
  \ 7 - Instant Getter 方法中。\n\n（此处省略重复部分的翻译展示以保持简洁，实际处理中已覆盖所有行）\n\n\n\n\n\n## 表 10\
  \ - Duration 增加方法摘要\n\n| 方法 | 参数 |\n| :--- | :--- |\n| `plus` | `Duration duration`\
  \ |\n| `plus` | `long amountToAdd`, `TemporalUnit unit` |\n| `plusDays` | `long\
  \ daysToAdd` |\n| `plusHours` | `long hoursToAdd` |\n| `plusMillis` | `long millisToAdd`\
  \ |\n| `plusMinutes` | `long minutesToAdd` |\n| `plusNanos` | `long nanosToAdd`\
  \ |\n| `plusSeconds` | `long secondsToAdd` |\n| `addTo` | `Temporal temporal` |\n\
  \n![](img/image304.jpg)\n\n下方根据初始的 30 分钟时长创建了一个持续时长。然后在其基础上添加了 10 秒，接着减去了 500 毫秒。\n\
  \n```java\nDuration duration = Duration.ofMinutes(30);\nplus(Duration.ofSeconds(10)).\n\
  minus(Duration.ofMillis(500));\nSystem.out.println(duration);\n```\n\n![](img/image305.jpg)\n\
  \n生成的时长所示：\n\n`PT30M9.5S`\n\n# 使用 Duration 类\n\n`Duration` 类支持如表 11 - Duration 类获取类型方法所示的访问器方法。\n\
  \n## 表 11 - Duration 类获取类型方法\n\n| 返回类型 | 方法 | 含义 |\n| :--- | :--- | :--- |\n| int\
  \ | `getNano()` | 自上秒以来的纳秒数 |\n| long | `getSeconds()` | `Duration` 以秒为单位长度 |\n\
  | boolean | `isNegative()` | 如果 `Duration` 为负则返回 true |\n| boolean | `isZero()`\
  \ | 如果 `Duration` 的长度为零则返回 true |\n\n![](img/image306.jpg)\n\n此外，它还支持许多操作 `Duration`\
  \ 实例的方法。以下演示了如何计算两个日期之间时间的 2/3。`between` 方法返回初始持续时间。`multipliedBy` 和 `dividedBy`\
  \ 方法计算该持续时间的小数部分。\n\n```java\nLocalTime time1 = LocalTime.of(10, 30);\nLocalTime\
  \ time2 = LocalTime.of(11, 45);\nduration = Duration.between(time1, time2).\nmultipliedBy(2).\n\
  dividedBy(3);\nSystem.out.println(duration);\n```\n\n![](img/image307.jpg)\n\n结果所示：\n\
  \n`PT50M`\n\n# 使用 Period 类\n\n`Period` 类关注以年、月、日的格式表示时间间隔。该类在执行操作时会考虑夏令时。它与 `Duration`\
  \ 类非常相似，仅支持的字段不同。\n\n以下示例显示了如何根据天数或月份创建 `Period` 对象：\n\n```java\nPeriod period =\
  \ Period.ofDays(21);\nSystem.out.println(period);\nperiod = Period.ofMonths(3);\n\
  System.out.println(period);\n```\n\n![](img/image308.jpg)\n\n输出如下：\n\n`P21D`\n\n\
  `P3M`\n\n我们还可以使用 `parse` 方法创建 `Period`。在以下序列中，创建了一个表示 3 年、2 个月和 16 天的字符串：\n\n```java\n\
  period = Period.parse(\"P3Y2M16D\");\nSystem.out.println(period);\nSystem.out.println(\"\
  Years: \" + period.getYears() +\n\" Months: \" + period.getMonths() +\n\" Days:\
  \ \" + period.getDays());\n```\n\n![](img/image309.jpg)\n\n输出所示：\n\n`P3Y2M16D`\n\
  \n`Years: 3 Months: 2 Days: 16`\n\n`between` 方法将返回两个日期之间的 `Period`，如下所示：\n\n```java\n\
  period = Period.between(LocalDate.now(),\nLocalDate.now()\n.minusMonths(3)\n.plusDays(60));\n\
  System.out.println(period);\n```\n\n![](img/image310.jpg)\n\n它将产生以下输出：\n\n`P-1M-2D`\n\
  \n## 使用日期和时间类\n\n日期和时间类不使用时区信息。时区类将在“处理时区和偏移类”章节中讨论。日期和时间类汇总在表 12 - 日期和时间类摘要中。这些类是不可变的，它们的名称让我们很好地了解它们代表的内容。除了这些类之外，还有几个与这些类配合得很好的枚举。\n\
  \n## 表 12 - 日期和时间类摘要\n\n| 类 | 日期 | 时间 | 使用 |\n| :--- | :--- | :--- | :--- |\n| `LocalDate`\
  \ | 是 | 否 | 表示日期。主要字段是年、月、日。可以访问其他字段，如星期和一年。 |\n| `LocalTime` | 否 | 是 | 表示时间，通常被视为小时、分、秒的组合。也支持纳秒组件。\
  \ |\n| `LocalDateTime` | 是 | 是 | 表示日期和时间。该类拥有返回日期和时间各个部分（如日或小时）的方法。 |\n| `YearMonth`\
  \ | 是 | 否 | 仅支持月份 |\n| `MonthDay` | 是 | 否 | 仅支持月份和 |\n| `Year` | 是 | 否 | 仅支持年份 |\n\
  \n![](img/image311.jpg)\n\n日期和时间信息通常是特定于地区的。为了解决这个问题，日期和时间 API 透明地使用 Unicode 通用区域数据仓库\
  \ (CLDR) (http://cldr.unicode.org/)。该存储库包含用于格式化日期等信息的数据。它提供了特定国家的信息。\n\n在接下来的章节中，我们将说明如何实例化和使用\
  \ `LocalDate`、`LocalTime` 和 `LocalDateTime` 类。在本节之后我们将检查 `YearMonth`、`MonthDay`\
  \ 和 `Year`。\n\n## 创建日期和时间类\n\n创建这些类有三种常用方法：\n- 使用 `now`\n- 使用 `of`\n- 使用 `from`\n\
  \n```java\nLocalDateTime ldt = LocalDateTime.now();\nSystem.out.println(ldt);\n\n\
  LocalDateTime ldt = LocalDateTime.of(2011, 3, 12, 10, 30);\nSystem.out.println(ldt);\n\
  \nLocalDateTime ldt = LocalDateTime.parse(\"2011-03-12T10:30:15\");\nSystem.out.println(ldt);\n\
  ```\n\n## 日期和时间的获取类型方法\n\n这些类提供了几个获取类型方法来检索日期或时间的信息。以下演示了我们如何对 `LocalDate` 和 `LocalTime`\
  \ 类的实例使用这些方法。`LocalDateTime` 类也有类似的方法。\n\n```java\nLocalDate date = LocalDate.of(2011,\
  \ 3, 12);\nSystem.out.println(date);\nSystem.out.println(\"Year: \" + date.getYear()\
  \ +\n\" Month: \" + date.getMonth() +\n\" Day: \" + date.getDayOfMonth() +\n\" Day\
  \ of the week: \" +\ndate.getDayOfWeek());\n\nLocalTime time = LocalTime.of(17,\
  \ 30, 15);\nSystem.out.println(time);\nSystem.out.println(\"Hour: \" + time.getHour()\
  \ +\n\" Minute: \" + time.getMinute() +\n\" Second: \" + time.getSecond() +\n\"\
  \ Nanosecond: \" + time.getNano());\n```\n\n![](img/image313.jpg)\n\n输出所示：\n\n`2011-03-12`\n\
  \n`Year: 2011 Month: MARCH Day: 12 Day of the week: SATURDAY`\n\n`17:30:15`\n\n\
  `Hour: 17 Minute: 30 Second: 15 Nanosecond: 0`\n\n还有几个 `is` 类型方法可用，如下所示的 `isLeapYear`\
  \ 和 `isBefore`：\n\n```java\nLocalDate date = LocalDate.of(2011, 3, 12);\nSystem.out.println(date.isLeapYear());\n\
  \nLocalTime time = LocalTime.of(17, 30, 15);\nSystem.out.println(time.isBefore(\n\
  LocalTime.of(15, 0, 15)));\n```\n\n![](img/image314.jpg)\n\n这两个方法都返回 false。\n\n\
  ## 调整日期或时间\n\n`with` 方法配合 `TemporalAdjusters` 类提供了寻找其他相关日期的有用技术。例如，`firstDayOfMonth`\
  \ 方法将根据给定的日期返回月份的第一天，如下所示。同样演示的是使用特定周期的 `next` 方法。\n\n```java\nLocalDate date =\
  \ LocalDate.of(2011, 3, 12);\nLocalDate firstDayOfTheMonth =\ndate.with(TemporalAdjusters.firstDayOfMonth());\n\
  ```\n\n\n\n\n\n```java\nlocalDate.with(TemporalAdjusters.firstDayOfMonth());\nSystem.out.println(firstDayOfTheMonth);\n\
  \nLocalDate nextFriday = localDate.with(TemporalAdjusters.next(DayOfWeek.FRIDAY));\n\
  System.out.println(nextFriday);\n```\n\n![](img/image315.jpg)\n\n输出如下：\n2011-03-01\n\
  2011-03-18\n\n`LocalTime` 类具有 `with` 类型的方法，这些方法会返回一个新的时间，其中只有一个时间单位发生了变化。在下面的序列中，更改了小时，然后是分钟：\n\
  \n```java\nlocalTime = LocalTime.of(17, 30, 15);\nSystem.out.println(localTime.withHour(8));\n\
  System.out.println(localTime.withMinute(20));\n```\n\n![](img/image316.jpg)\n\n\
  输出所示：\n08:30:15\n17:20:15\n\n## 使用 `YearMonth`、`MonthDay` 和 `Year` 类\n\n这些类正如名称所示，支持有限的日期信息。由于它们具有相似的方法，我们将重点关注\
  \ `MonthDay` 类。\n\n`MonthDay` 类表示月份和日的组合，例如 8 月 4 日。它是不可变的，并拥有许多方法来比较或以其他方式使用该类的实例。它不包含关于年份或时区的信息。\n\
  \n当我们只需要关于月份和每月某一天的信息时，这个类非常有用。有几个静态方法用于创建 `MonthDay` 实例。它们包括 `now()`、`of()` 和 `parse()`\
  \ 的重载版本。下面阐明了其中几个方法。除了使用 `now` 方法的第一个声明外，所有这些方法都将创建一个表示 8 月 4 日的 `MonthDay` 对象。\n\
  \n```java\nMonthDay monthDay = MonthDay.now();\nmonthDay = MonthDay.of(8, 4);\n\
  monthDay = MonthDay.of(Month.AUGUST, 4);\nmonthDay = MonthDay.parse(\"--08-04\"\
  );\n```\n\n![](img/image317.jpg)\n\n`parse()` 方法需要一个格式为“--MM-dd”的字符串。如果不是，它将抛出 `java.time.format.DateTimeParseException`\
  \ 异常。\n\n也可以像下面所示，使用 `with` 类型的方法创建 `MonthDay` 对象。这将创建一个新的 `MonthDay` 对象，它是第一个对象的拷贝，但月份已更改为\
  \ 4 月。`withMonth()` 版本具有相同的效果。\n\n```java\nmonthDay = MonthDay.now();\nmonthDay\
  \ = monthDay.with(Month.APRIL);\nmonthDay = monthDay.withMonth(4);\n```\n\n![](img/image318.jpg)\n\
  \n可以以类似的方式使用 `withDayOfMonth()` 方法更改日期。\n\n我们可以像下面所示，使用 `atYear()` 方法从 `MonthDay`\
  \ 实例创建 `LocalDate`：\n\n```java\nLocalDate date = monthDay.atYear(2014);\n```\n\n\
  ![](img/image319.jpg)\n\n在使用 `MonthDay` 对象时要小心。2 月 29 日的 `MonthDay` 被认为是有效的。它实际上是否有效取决于年份。然而，2\
  \ 月 30 日是无效的。在指定月份时，会检查可能日期范围的最小范围检查。\n\n可以使用 `isValidYear()` 方法来确定 `MonthDay` 实例对于特定年份是否有效。在下一个示例中，创建了一个\
  \ 2 月 29 日的 `MonthDay` 对象。然后将其与 2012 年和 2014 年进行测试。\n\n```java\nmonthDay = MonthDay.of(2,\
  \ 29);\nSystem.out.println(monthDay.isValidYear(2012));\nSystem.out.println(monthDay.isValidYear(2014));\n\
  ```\n\n![](img/image320.jpg)\n\n对于 2012 年为 true，对于 2014 年为 false。\n\n# 比较 MonthDay\
  \ 实例\n\n`compareTo()` 方法返回一个表示两个 `MonthDay` 实例关系的整数。如果第一个实例在第二个之前，则返回负值；如果相等则返回\
  \ 0；如果第一个实例在第二个之后，则返回正数。\n\n下面的将返回一个表示第一个实例第二个日期的整数：\n\n```java\nMonthDay today\
  \ = MonthDay.now();\nMonthDay nextMonth = today.plus(1);\n```\n\n![](img/image321.jpg)\n\
  \n我们还可以使用 `isAfter()` 和 `isBefore()` 方法比较两个 `MonthDay` 实例。\n\n```java\nSystem.out.println(today.isAfter(nextMonth));\n\
  System.out.println(today.isBefore(nextMonth));\n```\n\n![](img/image322.jpg)\n\n\
  # 使用 DayOfWeek 枚举\n\n这两个枚举类用于指定周几和月份。`DayOfWeek` 枚举支持数值表示。例如，它具有 `values()` 方法返回这些枚举的数组。\n\
  \n```java\nDayOfWeek days[] = DayOfWeek.values();\nfor (DayOfWeek day : days) {\n\
  \    System.out.println(day.getValue() + \" \" + day);\n}\n```\n\n![](img/image323.jpg)\n\
  \n输出如下：\n1 - MONDAY\n2 - TUESDAY\n3 - WEDNESDAY\n4 - THURSDAY\n5 - FRIDAY\n6 - SATURDAY\n\
  7 - SUNDAY\n\n我们可以使用 `valueOf()` 或 `of()` 方法创建时区偏移值。\n\n```java\nDayOfWeek day =\
  \ DayOfWeek.valueOf(\"TUESDAY\");\n```\n\n![](img/image324.jpg)\n\n`of()` 方法接受一个整数并返回对应的枚举：\n\
  \n```java\nDayOfWeek day = DayOfWeek.of(2);\n```\n\n![](img/image325.jpg)\n\n`ZoneId`\
  \ 类可以用于时区标识符。\n\n```java\nLocalDate localDate = LocalDate.now();\nSystem.out.println(localDate.with(DayOfWeek.FRIDAY));\n\
  ```\n\n![](img/image326.jpg)\n\n输出将是：2014-03-06\n\n# 使用 Month 枚举\n\n`Month` 枚举支持年份的\
  \ 12 个月份。像 `DayOfWeek` 一样，它可以使用 `values()`：\n\n```java\nMonth months[] = Month.values();\n\
  for (Month month : months) {\n    System.out.println(month.getValue() + \" - \"\
  \ + month);\n}\n```\n\n![](img/image327.jpg)\n\n输出：\n1 - JANUARY\n2 - FEBRUARY\n\
  3 - MARCH\n4 - APRIL\n5 - MAY\n6 - JUNE\n7 - JULY\n8 - AUGUST\n9 - SEPTEMBER\n10\
  \ - OCTOBER\n11 - NOVEMBER\n12 - DECEMBER\n\n特定的月份可以使用 `of()` 方法创建：\n\n```java\n\
  Month month = Month.of(3);\n```\n\n![](img/image328.jpg)\n\n此外，还有一些方法可以返回该月份从年初开始的天数、季的第一个月份以及该月份的最大天数。这些方法在下面使用之前的月份声明进行了演示。`firstDayYear()`\
  \ 的参数如果年份是闰年则设置为 true。\n\n```java\nSystem.out.println(month.firstDayOfYear(false));\n\
  System.out.println(month.firstMonthOfQuarter());\nSystem.out.println(month.maxLength());\n\
  ```\n\n![](img/image329.jpg)\n\n# 处理时区和偏移量类\n\n时区是一个范围内时间相同的区域。它可以被描述为使用几种格式之一。例如，我们可以使用时区标识符指定\
  \ CST（中部标准时间）。该标识符由一个区域、一个正斜杠和一个城市组成，例如 \"America/Chicago\"。\n\n时区也可以表示为相对于格林治/UTC\
  \ 时间的偏移，例如芝加哥为 -06:00。在夏令时间期间，它为 -05:00。如果我们感兴趣在代码中使用时区标识符，我们使用 `ZoneId` 类。如果我们需要使用偏移量，应该使用\
  \ `ZoneOffset` 类。\n\n包含时区的基于时间的类包括 `ZonedDateTime`、`OffsetDateTime` 和 `OffsetTime`。表\
  \ 13 - 时区类指示了每个类处理什么信息。\n\n\n\n\n\n| OffsetTime | No | Yes | No | Yes |\n\n![](img/image330.jpg)\n\
  \n除了这些类之外，还有 `ZoneRules` 类，它规定了一组定义时区偏移（zone-offset）发生变化的规则。这在处理夏令时时非常有用。\n\n时区也是大多数日历系统的重要部分。为了支持时区，`Date`\
  \ 和 `Time` API 透明地使用了时区数据库 (`TZDB`) (`http://www.iana.org/time-zones`)。该数据库包含了关于时区的信息以及自\
  \ 1970 年以来时区的变化。为了正确确定时间，通常需要当前时区。\n\n### 获取可用的 Zone ID\n\n可以使用 `ZoneId` 类的 `getAvailableZoneIds()`\
  \ 方法获取可用的时区 ID，该方法返回一个 `Set`。如果需要将此集合或子集显示给用户（可能以下拉组合框的形式），这将会非常有用。\n\n接下来的代码序列使用该方法创建一个集合，然后显示集合的内容。\n\
  \n```java\nSet<String> zoneIds = ZoneId.getAvailableZoneIds();\n\nfor(String zoneId\
  \ : zoneIds) {\n    System.out.println(zoneId);\n}\n```\n\n![](img/image331.jpg)\n\
  \n此列表的子集显示如下：\n\n- Asia/Aden\n- America/Cuiaba\n- Etc/GMT+9\n- Etc/GMT+8\n- Africa/Nairobi\n\
  - America/Marigot\n- Asia/Aqtau\n- Pacific/Kwajalein\n- …\n\n如果我们对获取当前的 `ZoneId`\
  \ 感兴趣，应该像下面使用 `ZoneId` 类的 `systemDefault()` 方法：\n\n```java\nSystem.out.println(ZoneId.systemDefault());\n\
  ```\n\n![](img/image332.jpg)\n\n可能的输出如下：\n\n- America/Chicago\n\n要为特定时区创建 `ZoneID`，应该使用时区标识符作为\
  \ `of()` 方法的参数：\n\n```java\nZoneId zoneId = ZoneId.of(\"Europe/Vienna\");\n```\n\
  \n![](img/image333.jpg)\n\n### 使用 ZoneOffset（偏移量）\n\n`ZoneOffset`、`OffsetDateTime`\
  \ 和 `OffsetTime` 类提供了指定相对于 UTC 偏移的方法。`ZoneOffset` 类表示以小时、分钟或秒指定的偏移。它不像另外两个类那样包含日期或时间元素。以下说明了使用\
  \ `ZoneOffset` 类指定一小时差异的情况：\n\n```java\nZoneOffset zoneOffSet = ZoneOffset.ofHours(1);\n\
  System.out.println(zoneOffSet);\n```\n\n![](img/image334.jpg)\n\n下面的输出显示只使用了小时和分钟：\n\
  \n`+01:00`\n\n这里使用通过 `now()` 方法获取的当前日期和时间来说明了 `OffsetDateTime` 类：\n\n```java\nOffsetDateTime\
  \ offsetDateTime = OffsetDateTime.now();\nSystem.out.println(offsetDateTime);\n\
  ```\n\n![](img/image335.jpg)\n\n如下面的输出所示，使用了日期、时间和偏移量。最后一个值 `-5:00` 代表相对于 UTC 的偏移。\n\
  \n`2014-03-10T16:02:56.751-05:00`\n\n接下来的序列说明了如何结合 `zoneOffSet` 和 `ZoneId` 对象使用\
  \ `now()` 方法：\n\n```java\noffsetDateTime = OffsetDateTime.now(zoneOffSet);\nSystem.out.println(offsetDateTime);\n\
  \noffsetDateTime = OffsetDateTime.now(ZoneId.of(\"+03:30\"));\nSystem.out.println(offsetDateTime);\n\
  \noffsetDateTime = OffsetDateTime.now(ZoneId.of(\"-06:30\"));\nSystem.out.println(offsetDateTime);\n\
  ```\n\n![](img/image336.jpg)\n\n输出显示了时间随时区的差异：\n\n- `2014-03-10T22:02:56.784+01:00`\n\
  - `2014-03-11T00:32:56.785+03:30`\n- `2014-03-10T14:32:56.785-06:30`\n\n`OffsetTime`\
  \ 类仅使用时间，如下所示。`plusHours()` 方法是用于调整偏移的几个方法之一。\n\n```java\nOffsetTime offsetTime\
  \ = OffsetTime.now();\nSystem.out.println(offsetTime);\n\noffsetTime = offsetTime.plusHours(2);\n\
  System.out.println(offsetTime);\n```\n\n![](img/image337.jpg)\n\n输出如下：\n\n- `16:02:56.785-05:00`\n\
  - `18:02:56.785-05:00`\n\n使用流式 API（fluent style），我们可以按照如下方式创建一个未来的日期。这说明了可用的其他 `at`\
  \ 方法。\n\n```java\nOffsetDateTime futureDate = Year.of(2016)\n    .atMonth(Month.MARCH).atDay(12)\n\
  \    .atTime(12, 30)\n    .atOffset(ZoneOffset.of(\"-10:00\"));\nSystem.out.println(futureDate);\n\
  ```\n\n![](img/image338.jpg)\n\n日期所示：\n\n`2016-03-12T12:30-10:00`\n\n### 使用 Zone\
  \ Rules\n\n在处理时区时使用的规则可能是复杂的。我们经常在夏令时期间使用 `ZoneRules`。以下通过 `displaySettings` 方法展示了两个不同的时区：\n\
  \n```java\nzoneId = ZoneId.of(\"America/Phoenix\");\ndisplaySettings(zoneId);\n\
  zoneId = ZoneId.of(\"America/Chicago\");\ndisplaySettings(zoneId);\n```\n\n![](img/image339.jpg)\n\
  \n`displaySettings` 方法列如下。它使用 `ZoneRules` 提供关于日期以及是否处于夏令时的信息。\n\n\n\n\n\n```java\n\
  new DateTimeFormatterBuilder();\n\nformatterBuilder\n  .appendLiteral(\"The current\
  \ date for Time Zone \\\"\")\n  .appendZoneOrOffsetId()\n  .appendLiteral(\"\\\"\
  \ is \")\n  .append(DateTimeFormatter.ISO_LOCAL_DATE);\n\nDateTimeFormatter formatter\
  \ = formatterBuilder.toFormatter();\n\nSystem.out.println(formatter.format(zdt));\n\
  ```\n![](img/image343.jpg)\n\n生成的输出如下：\n\nThe current date for Time Zone \"America/Chicago\"\
  \ is 2014-03-10\n\n## 使用时间查询\n\n`TemporalQuery` 与基于时间的对象结合使用以获取有关该对象的信息。系统提供了预定义的查询，也可以创建自定义查询。\n\
  \n以下内容重构了 `简单示例` 章节中的示例。该示例演示了如何判断员工当前正在上班，即使该员工可能处于不同的时区。\n\n定义了一个 `Employee` 类，它拥有各种日期和时间类来表示员工的时间方面。下面列出了类中直接相关的部分。该类实现了\
  \ `TemporalQuery` 接口，这要求我们提供一个 `queryFrom` 方法。我们将在稍后的讨论中实现此方法。\n\n```java\npublic\
  \ class Employee implements TemporalQuery<Boolean> {\n    private String name;\n\
  \    private LocalDate birthdate;\n    private LocalDate hireDate;\n    private\
  \ LocalTime startWorkDay;\n    private Duration dailyTime;\n    private ZoneId timeZone;\n\
  \n    public Employee(String name, LocalDate birthdate, LocalDate hireDate, LocalTime\
  \ startWorkDay, Duration dailyTime, ZoneId timeZone) {\n        this.name = name;\n\
  \        this.birthdate = birthdate;\n        this.hireDate = hireDate;\n      \
  \  this.startWorkDay = startWorkDay;\n        this.dailyTime = dailyTime;\n    \
  \    this.timeZone = timeZone;\n    }\n    ...\n}\n```\n![](img/image344.jpg)\n\n\
  如下所示创建了一个员工。构造函数的第四个参数指定她在早上 8 点上班。第五个参数表示她的班次长度为 6 小时。最后一个参数显示她位于拉帕斯（La Paz）。\n\
  \n```java\nEmployee employee1 = new Employee(\"Mary\", LocalDate.of(1985, Month.MAY,\
  \ 5), LocalDate.of(2010, Month.JUNE, 13), LocalTime.of(8, 0), Duration.ofHours(6),\
  \ ZoneId.of(\"America/La_Paz\"));\n```\n![](img/image345.jpg)\n\n当前时间使用 `ZonedDateTime`\
  \ 类的 `now()` 方法计算。此时间将代表当前时区的当前时间。如果员工当前正在上班，`Employee` 类的 `isWorkingNow` 方法将返回\
  \ true，否则返回 false。\n\n```java\nZonedDateTime present = ZonedDateTime.now();\nSystem.out.println(employee1.isWorkingNow(present));\n\
  ```\n![](img/image346.jpg)\n\n`isWorkingNow` 方法实现如下。首先创建一个 `LocalDate`，并工作者的时区创建开始时间和结束时间。使用传递给方法的\
  \ `TemporalAccessor` 创建一个表示当前时间的 `ZonedDateTime`。然后该方法使用这些值通过 `compareTo` 方法来判断工作者是否存在。\n\
  \n```java\npublic Boolean isWorkingNow(TemporalAccessor temporal) {\n    LocalDate\
  \ employeeDate = LocalDate.of(\n        LocalDate.now().getDayOfYear(),\n      \
  \  LocalDate.now().getMonth(),\n        LocalDate.now().getDayOfMonth());\n    ZonedDateTime\
  \ startTime = ZonedDateTime.of(\n        employeeDate,\n        this.startWorkDay,\n\
  \        this.getTimeZone());\n    ZonedDateTime present = (ZonedDateTime) temporal;\n\
  \    ZonedDateTime endTime = startTime.plusHours(this.getDailyTime().toHours());\n\
  \    return (startTime.compareTo(present) <= 0) && (endTime.compareTo(present) >=\
  \ 0);\n}\n```\n![](img/image347.jpg)\n\n使用特定的方法（如 `isWorkingNow` 方法）允许向类中添加其他方法以支持类似的查询操作。或者，我们可以使用标准查询的\
  \ `queryFrom` 方法，如下所示：\n\n```java\nSystem.out.println(employee1.queryFrom(present));\n\
  ```\n![](img/image348.jpg)\n\n`queryFrom` 方法复制了 `isWorkingNow` 方法：\n\n```java\n\
  @Override\npublic Boolean queryFrom(TemporalAccessor temporal) {\n    LocalDate\
  \ employeeDate = LocalDate.of(\n        LocalDate.now().getDayOfYear(),\n      \
  \  LocalDate.now().getMonth(),\n        LocalDate.now().getDayOfMonth());\n    ZonedDateTime\
  \ start = ZonedDateTime.of(employeeDate, this.startWorkDay, this.getTimeZone());\n\
  \    ZonedDateTime present = (ZonedDateTime) temporal;\n    ZonedDateTime endTime\
  \ = start.plusHours(this.getDailyTime().toHours());\n    return (start.compareTo(present)\
  \ <= 0) && (endTime.compareTo(present) >= 0);\n}\n```\n![](img/image349.jpg)\n\n\
  我们也可以在 `queryFrom` 方法中调用 `isWorkingNow` 方法来实现相同的结果。\n\n## 理解基于值的类\n\nJava 8 中的许多类都是基于值的（value-based）。`LocalDateTime`\
  \ 和 `MonthDay` 就是此类类的示例。这些类型的类具有许多特征，包括：\n\n- 它们是 `final` 的\n- 它们是 `immutable`（不可变的）\n\
  - 它们没有公共的构造函数\n- 需要使用工厂方法来创建这些类的实例\n- 执行时，它们的 `equals`、`hashCode` 和 `toString` 方法不使用来自其他来源的信息\n\
  - 在进行比较时，我们应该使用 `equals` 方法而不是 `==` 运算符\n- 交换两个等价的对象不应导致任何行为上的差异\n\n应避免对基于值的对象进行身份敏感的操作。任何此类操作都可能导致不可预测的行为。下面的示例说明了使用等价运算符和\
  \ `equals` 方法来比较两个相同的对象：\n\n```java\nMonthDay date1 = MonthDay.of(2, 2);\nMonthDay\
  \ date2 = MonthDay.of(2, 2);\nSystem.out.println(date1 == date2);\nSystem.out.println(date1.equals(date2));\n\
  ```\n![](img/image350.jpg)\n\n等价运算符将返回 false，而 equals 方法返回 true；\n\n结论\n\n新的 Java\
  \ 8 日期和时间 API 既大又复杂。它使用多种类来支持本地日期和时间以及基于时区的需求。该 API 使用了一致且易于理解命名方案。这支持了流式编程风格，提高了生产力和代码的可读性。\n\
  \n该 API 通过 `Clock` 类支持机器时间线。通过 `LocalDate` 和 `ZonedDateTime` 等类支持人类时间线。此外，时间间隔使用\
  \ `Duration` 创建小时、分钟和秒，使用 `Period` 创建月和天。\n\n有一些类包含了时区信息。开发者可以根据需要处理时区偏移和时区规则。日期和时间可以通过多种方法创建，包括解析字符串。日期和时间可以使用各种格式化技术进行显示。\n\
