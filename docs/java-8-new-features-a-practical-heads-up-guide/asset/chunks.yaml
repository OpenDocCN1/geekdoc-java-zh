    \n![](img/image18.jpg)\n\n如果类没有声明为抽象类，将生成以下错误信息：\n\n`Person is not abstract and\
    \ does not override abstract method draw() in MoreDisplayable`\n\n# 使用多重继承\n\n\
    Java 中接口的多重继承一直是可能的。这种类型的继承属于行为的继承。然而，Java 仍然不支持类之间的多重继承。那种类型的继承通常被称为状态的继承。\n\n\
    接口可以继承自多个一个接口。但是，如果两个或多个基接口具有相同的默认方法（default method），就会引入歧义，需要解决这个问题。为了演示如何处理这种情况，我们将探索一个继承层次结构，其中\
    \ `MoreDisplayable` 接口派生自 `Displayable` 和 `Colorable` 接口，如图 2：接口之间的多重继承所示。\n\n\
    ![](img/image19.jpg)\n\n图 2：接口之间的多重继承\n\n前两个接口所示：\n\n```java\npublic interface\
    \ Displayable extends Drawable {\n    @Override\n    default void draw(){\n  \
    \      System.out.println(\n            \"The Displayable interface's draw method\"\
    \n        );\n    }\n}\n\npublic interface Colorable {\n    public default void\
    \ draw(){\n        System.out.println(\n            \"The Colorable interface's\
    \ draw method\"\n        );\n    }    \n}\n```\n\n![](img/image20.jpg)\n\n下面是扩展了\
    \ `Displayable` 和 `Colorable` 接口的 `MoreDisplayable` 接口定义。然而，没有为 `draw` 方法提供实现。\n\
    \n```java\npublic interface MoreDisplayable extends Displayable, Colorable {\n\
    \n}\n```\n\n![](img/image21.jpg)\n\n这产生了一个模糊的情况，因为编译器无法确定使用两个基接口中的哪一个 `draw` 方法。这会导致以下错误信息：\n\
    \n`interface MoreDisplayable inherits unrelated defaults for draw() from types\
    \ Displayable and Colorable`\n\n解决这个问题有几种方法。一种方法是为 `draw` 方法提供抽象声明，所示。这强制实现类实现该抽象方法。\n\
    \n```java\npublic interface MoreDisplayable extends Displayable, Colorable {\n\
    \    @Override\n    public abstract void draw();\n}\n```\n\n![](img/image22.jpg)\n\
    \n另一种方法是使用具体的 `draw` 方法：\n\n```java\npublic interface MoreDisplayable extends\
    \ Displayable, Colorable {\n    @Override\n    public default void draw() {\n\
    \        System.out.println(\n            \"The MoreDisplayable interface's draw\
    \ method\"\n        );\n    }\n}\n```\n\n![](img/image23.jpg)\n\n如果我们想使用基类的其中一个\
    \ `draw` 方法，可以显式地调用它，如下：\n\n```java\npublic interface MoreDisplayable extends\
    \ Displayable, Colorable {\n    @Override\n    public default void draw() {\n\
    \        Displayable.super.draw();\n    }\n}\n```\n\n![](img/image24.jpg)\n\n\
    实际上，如果需要，两种方法都可以被调用：\n\n```java\npublic interface MoreDisplayable extends Displayable,\
    \ Colorable {\n    @Override\n    public default void draw() {\n        Displayable.super.draw();\n\
    \        Colorable.super.draw();\n    }\n}\n```\n\n![](img/image25.jpg)\n\n最佳解决方案取决于应用的需求。\n\
    \n# 理解菱形继承的工作原理\n\n当一个接口是另外两个接口的基接口，并且第四个接口又派生自这两个接口时，就会发生菱形继承。图 3：菱形继承说明了这种情况：`Drawable`\
    \ 接口作为 `Displayable` 和 `Colorable` 接口的基接口，而 `MoreDisplayable` 接口派生自 `Displayable`\
    \ 和 `Colorable` 接口。\n\n![](img/image26.jpg)\n\n图 3：菱形继承\n\n`draw` 方法可以在多个地方进行声明。在接下来的一组声明中，它只在\
    \ `Drawable` 接口中声明了：\n\n```java\npublic interface Drawable {\n    default void\
    \ draw(){\n        System.out.println(\n            \"The Drawable interface's\
    \ draw method\"\n        );\n    }\n}\n\npublic interface Displayable extends\
    \ Drawable { }\npublic interface Colorable extends Drawable { }\npublic interface\
    \ MoreDisplayable extends Displayable, Colorable { }\n```\n\n![](img/image27.jpg)\n\
    \n这可以通过编译而没有错误。如果一个类同时实现了 `Displayable` 和 `Colorable` 接口，也会发生类似的情况：\n\n```java\n\
    public class Busy implements Displayable, Colorable {\n\n}\n```\n\n![](img/image28.jpg)\n\
    \n当创建 `Busy` 的实例并对该实例执行 `draw` 方法时，将执行 `Drawable` 的 `draw` 方法，因为它是唯一可用的。如果 `Displayable`\
    \ 接口也实现了 `draw` 方法，那么 `Busy` 类将使用它的方法。\n\n```java\npublic interface Displayable\
    \ extends Drawable {\n    @Override\n    default void draw(){\n        System.out.println(\n\
    \            \"The Displayable interface's draw method\"\n        );\n    }\n\
    }\n```\n\n![](img/image29.jpg)\n\n如果 `Displayable` 和 `Colorable` 接口都实现了 `draw`\
    \ 方法，那么我们就面临与前一节中相同的歧义情况。编译器无法确定应该使用哪一个 `draw` 方法。`Busy` 类通常通过提供 `draw` 实现来解决这个问题。下面显示了其中可能的实现：\n\
    \n```java\npublic interface Colorable extends Drawable {\n    public default void\
    \ draw(){\n        System.out.println(\n            \"The Colorable interface's\
    \ draw method\"\n        );\n    }    \n}\n\npublic class Busy implements Displayable,\
    \ Colorable {\n    @Override\n    public void draw() {\n        Displayable.super.draw();\n\
    \        Colorable.super.draw();\n    }\n}\n```\n\n![](img/image30.jpg)\n\n如果\
    \ `Displayable` 和 `Colorable` 接口都实现了 `draw` 方法，对 `draw` 方法的调用可能不会按预期工作。在下面的示例中，一个\
    \ `Busy` 实例被赋值给 `Colorable` 接口变量：\n\n```java\nColorable colorable = new Busy();\n\
    colorable.draw();\n```\n\n![](img/image31.jpg)\n\n可能会预期调用 `Drawable` 的 `draw`\
    \ 方法，但输出显示并非如此：\n\n`The Displayable interface's draw method`\n\n`colorable` 变量引用的是一个\
    \ `Busy` 对象，由于 `Busy` 类最直接的 `draw` 实现来自 `Displayable` 接口，因此使用了该实现。\n\n"
- fmt: "\n| `Displayable` | Any class and not MoreDisplayable or Colorable | `Displayable`\
    \ |\n| `Colorable` | Any class and not MoreDisplayable or Displayable | `Colorable`\
    \ |\n| `Drawable` | Any other class or interface | `Drawable` |\n\n![](image34.jpg)\n\
    \nIf the method is implemented in the `Person` class, then that implementation\
    \ will always be used. If the method is not implemented there, then it will look\
    \ to its base classes to find it. It will use the one in the `Entity` class if\
    \ present. Since the `Object` class does not implement the `draw` method it will\
    \ not find an implementation there.\n\nIf the method is not available in the class\
    \ hierarchy, then it searches through the interface hierarchy. It will use the\
    \ first implementation it finds, starting with the most derived interface first.\
    \ In this case it will check to see if the MoreDisplayable` interface has implemented\
    \ it. If not then it will use either implementation found in the `Displayable`\
    \ or `Colorable` interfaces. If both of these classes possess an implementation,\
    \ then a compile error will result if the `MoreDisplayable` interface does not\
    \ specify which one to use. This situation was discussed in the previous section.\
    \ If only the `Drawable` interface implements the `draw` method, then this implementation\
    \ will be used.\n\nAs demonstrated earlier, multiple implementations of the `draw`\
    \ method can be used if an overridden method calls its immediate class or interface\
    \ implementation.\n\nThis selection process can be summarized as:\n\n- Classes\
    \ take precedence over interfaces, and\n- More specific interfaces (most derived)\
    \ take precedence over less specific interfaces.\n\n# Using Default Methods\n\n\
    Default methods can be used in many situations. This section identifies and illustrates\
    \ many of these possible uses. These include extending existing interfaces and\
    \ supplementing adapter classes.\n\n## Extending Existing Interfaces\n\nWhen adding\
    \ a new abstract method to an existing interface, classes that have already implemented\
    \ the interface will break since they no longer implement the new method. However,\
    \ adding a default method will allow new methods to be added without breaking\
    \ previous implementations. Traditionally, when an interface is defined it is\
    \ treated as a contract and is not expected to change.\n\nHowever, should the\
    \ interface need to change, then the availability of default methods means that\
    \ the interface can change and that change will not affect existing code. This\
    \ permits existing interfaces to continue to be useable when new default methods\
    \ are added. Older, existing usage of the interfaces does not break.\n\nConsider\
    \ the following interface that has a single abstract method `draw`:\n\n```java\n\
    interface Drawable {\n    public void draw();\n}\n```\n\n![](image35.jpg)\n\n\
    When a class such as `Person` implements that interface it only needs to implement\
    \ the `draw` method:\n\n```java\nclass Person implements Drawable {\n    public\
    \ void draw() {\n        System.out.println(\"The Person's draw method\");\n \
    \   }\n}\n```\n\n![](image36.jpg)\n\nHowever, if we add another abstract method\
    \ to the `Drawable` interface, such as a `drawWithQuotes` method as shown below,\
    \ we will introduce errors into the `Person` class:\n\n```java\ninterface Drawable\
    \ {\n    public void draw();\n    public void drawWithQuotes();\n}\n```\n\n![](image37.jpg)\n\
    \nThe error message will be:\n\n`Person is not abstract and does not override\
    \ abstract method drawWithQuotes() in Drawable`\n\nWe are not able to easily add\
    \ new methods without breaking old code written prior to Java 8. If, instead,\
    \ we use a default method in the `Drawable` interface as follows, the error goes\
    \ away. Our code will compile and execute correctly.\n\n```java\ninterface Drawable\
    \ {\n    public void draw();\n    public default void drawWithQuotes() { }\n}\n\
    ```\n\n![](image38.jpg)\n\n## Using Default Methods to Supplement Adapter Classes\n\
    \nWhile classes such as the `MouseMotionAdapter` class have not been replaced\
    \ with default method interface implementations, it is possible to provide similar\
    \ functionality using default methods. As an example, consider a `MouseMotionAdapter`\
    \ interface equivalent. A simplified version of the `MouseMotionAdapter` source\
    \ code, as found in Java 8, is shown below:\n\n```java\npublic abstract class\
    \ MouseMotionAdapter implements MouseMotionListener {\n    public void mouseDragged(MouseEvent\
    \ e) {};\n    public void mouseMoved(MouseEvent e) {};\n}\n```\n\n![](image39.jpg)\n\
    \nAn “equivalent” interface could appear as follows:\n\n```java\npublic interface\
    \ MouseMotionAdapterInterface extends MouseMotionListener {\n    public default\
    \ void mouseDragged(MouseEvent e) { };\n    public default void mouseMoved(MouseEvent\
    \ e) { };\n}\n```\n\n![](image40.jpg)\n\nAs example of using the `MouseMotionAdapter`\
    \ follows. This code will print the current x coordinate of the mouse as the mouse\
    \ moves across the window.\n\n```java\npublic static void main(String[] args)\
    \ {\n    JFrame frame = new JFrame();\n    frame.addMouseMotionListener(new MouseMotionAdapter()\
    \ {\n        public void mouseMoved(MouseEvent e) {\n            System.out.println(e.getX());\n\
    \        }\n    });\n    frame.setBounds(100, 100, 500, 300);\n    frame.setVisible(true);\n\
    }\n```\n\n![](image41.jpg)\n\nTo demonstrate the use of the `MouseMotionAdapterInterface`\
    \ we will use the following code. The code is equivalent to the previous example\
    \ except that an instance of the `MouseMotionAdapterInterface` interface is used\
    \ instead of `MouseMotionAdapter`. Otherwise, the code behaves in the same way.\n\
    \n```java\npublic static void main(String[] args) {\n    JFrame frame = new JFrame();\n\
    \    frame.addMouseMotionListener(\n        new MouseMotionAdapterInterface()\
    \ {\n            public void mouseMoved(MouseEvent e) {\n                System.out.println(e.getX());\n\
    \            }\n        });\n    frame.setBounds(100, 100, 500, 300);\n    frame.setVisible(true);\
    \    \n}\n```\n\n![](image42.jpg)\n\nThe major difference is found in any implementation\
    \ provided by the default method. If needed, we can add default behavior to default\
    \ methods such as code to support logging.\n\n## Using Default Methods in Core\
    \ Java Classes\n\nThe addition of lambda expressions is a major change to Java\
    \ 8. For the developer to take advantage of this feature and still use interfaces,\
    \ such as those of the collection, it is desirable to use default methods to extend\
    \ the interfaces.\n\nAs an example, the default `forEach` method has been added\
    \ to the `java.lang.Iterable` interface as shown below. This method accepts an\
    \ object that implements the `Consumer` interface. The `forEach` method will iterate\
    \ through each element of the list and apply the `Consumer` instance’s `accept`\
    \ method against each element. The `Objects` class’ `requireNonNull` method, added\
    \ with Java 7, validates that the action object is not null.\n\n```java\npublic\
    \ interface Iterable<T> {\n    Iterator<T>iterator();\n    default void forEach(Consumer<?\
    \ super T> action) {\n        Objects.requireNonNull(action);\n        for (T\
    \ t : this) {\n            action.accept(t);\n        }\n    }\n}\n```\n\n![](image43.jpg)\n\
    \nWe can now use the `accept` method with new code without breaking existing code.\
    \ In the following example the `Person` class has been modified with the addition\
    \ of a name field and supporting methods:\n\n```java\npublic class Person {\n\
    \    String name;\n    int age;\n    public Person(String name, int age) {\n \
    \       this.name = name;\n        this.age = age;\n    }\n    @Override\n   \
    \ public String toString() {\n        return \"Person{\" + \"name=\" + name +\n\
    \        \", age=\" + age + '}';\n    }\n}\n```\n\n![](image44.jpg)\n\nAn `ArrayList`,\
    \ which implements the `Iterable` interface, can use the `forEach` method to iterate\
    \ through the list as shown below. A list of persons is created. The `forEach`\
    \ method is then executed against the list. This example uses a lambda expression\
    \ for the argument of the `forEach` method. While the lambda expression is not\
    \ explained here, the effect is that each person in the list will be displayed\
    \ by calling its `toString` method.\n\n```java\nArrayList<Person> roster = new\
    \ ArrayList();\nroster.add(new Person(\"Ralph\", 45));\nroster.add(new Person(\"\
    Tom\", 22));\nroster.add(new Person(\"Mary\", 31));\n\nroster.forEach(person ->\
    \ System.out.println(person));\n```\n\n![](image45.jpg)\n\nThe output of this\
    \ sequence follows:\n\nPerson{name=Ralph, age=45}\n\nPerson{name=Tom, age=22}\n\
    \nPerson{name=Mary, age=31}\n\nThis is easier than using the for each statement.\n"
