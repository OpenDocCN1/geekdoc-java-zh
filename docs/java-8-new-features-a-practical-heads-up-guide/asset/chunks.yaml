    \ lambda 表达式之间的关系。我们还将如何将方法引用和构造函数引用作为 lambda 表达式使用。\n\n本章的最后一节探索了 `java.util.function`\
    \ 包。该包包含了许多与 lambda 表达式一起使用的函数式接口。当这些接口与 `Stream` 接口配合使用时，理解这些接口尤为重要。\n\n注意：数学家阿隆索·丘奇（Alonzo\
    \ Church）作为计算模型的一部分开发了 lambda 表达式的概念。他使用希腊字母 lambda 来表示这种抽象。这个名称流传了下来。\n\n# 理解\
    \ Lambda 表达式\n\nLambda 表达式可以被认为是匿名函数。当我们思考函数时，脑海中可能会出现平方根函数的形象。我们向它传递一个数字，它返回一个数字。\n\
    \nlambda 表达式背后的驱动力是让这些表达式尽可能易用。函数最简单的形式是什么？下面是一个简单的平方函数版本：\n\n```java\nint square(int\
    \ num) {\n    return num*num;\n}\n```\n\n![](img/image64.jpg)\n\n如果我们忽略数据类型并省略名称，理论上可以将其写为：\n\
    \n```java\nnum {return num*num;}\n```\n\n![](img/image65.jpg)\n\n由于我们知道函数将返回一个值，因此不需要\
    \ `return` 关键字，至少对于这个函数是如此。此外，由于只使用了一条语句，也不需要块语句。我们仍然需要将参数与函数体分开。这可以使用 lambda\
    \ 运算符（`->`），有时称为箭头标记（arrow token），如下：\n\n```java\nnum -> num*num\n```\n\n![](img/image66.jpg)\n\
    \n这就是我们的 lambda 表达式。它代表了编写函数的简单方法。这里是另一个简单的 lambda 表达式。它接收一个单一值进行显示，不返回任何内容：\n\
    \n```java\nx -> System.out.println(x)\n```\n\n![](img/image67.jpg)\n\n我们在哪里使用\
    \ lambda 表达式？在任何期望函数式接口的地方都可以使用 lambda 表达式。函数式接口是一个有且仅有一个抽象方法的接口。该方法被称为函数方法。这些概念在第\
    \ 1 章中讨论过。\n\n为了说明，我们将使用 lambda 表达式作为 `forEach` 方法的参数。该方法期望 `java.util.function.Consumer`\
    \ 函数式接口的实例。它的抽象方法是 `accept` 方法，它接受一个对象并返回 `void`。\n\n`forEach` 方法已添加到 Java 8 的许多接口中，包括\
    \ `Iterable` 接口。`Iterable` 接口的任何子接口或实现类都拥有此方法。这包括许多接口和类，如：`List`、`HashSet` 和 `LinkedList`。\n\
    \n在下面的示例中，根据一组数字创建一个 `List`：\n\n```java\nList<Integer> list = Arrays.asList(5,3,4);\n\
    ```\n\n![](img/image68.jpg)\n\n下面使用 lambda 表达式显示列表的每个元素：\n\n```java\nlist.forEach((Integer\
    \ element)->System.out.println(element));\n```\n\n![](img/image69.jpg)\n\n该代码序列的输出如下：\n\
    发生了什么？当编译器检查该语句时，它期望一个 `Iterable` 实例。然而，它找到的是 lambda 表达式。然后它尝试将 lambda 表达式转换为所需的对象。由于只传递了单个参数且没有返回任何内容，它决定可以这样做。这匹配了\
    \ `accept` 方法的签名。由于 `list` 是一个整数集合，它决定参数类型应该是 `Integer`。这个过程被称为 `target typing`（目标类型推断），将在节中进行深入讨论。\n\
    \n你可以想象编译器为上一个示例生成一个匿名内部类的实现，类似于：\n\n```java\nlist.forEach(new Consumer() {\n\
    \    @Override\n    public void accept(Object element) {\n        System.out.println(element);\n\
    \    }\n});\n```\n\n![](img/image70.jpg)\n\n然而，更简洁且最终更高效的方法是如下使用 lambda 表达式：\n\
    \n```java\nlist.forEach((element)->System.out.println(element));\n```\n\n![](img/image71.jpg)\n\
    \n这意味着创建了一个对象。这是否真的发生是一个实现问题。将 lambda 表达式视为匿名函数会更有用。\n\n虽然函数和方法相似，但函数并不绑定到类上。lambda\
    \ 表达式在概念上是一个简单的概念。然而，在完全理解之前，它们的语法可能是晦涩的。它们代表了开发 Java 应用程序的强大新工具。\n\n# 推断目标类型\n\
    \n`target typing`（目标类型推断）是根据对象使用的上下文推断其类型的过程。我们在上一个示例中看到了这种情况。`Type referencing`（类型引用）发生在系统确定\
    \ lambda 表达式类型时。类型是从表达式中推断出来的。之所以可能，是因为 Java 知道函数式接口抽象方法预期的参数类型。\n\nlambda 表达式不包含关于它正在实现哪个函数式接口的信息。lambda\
    \ 表达式的上下文决定了它代表哪个函数式接口。例如，下面的 lambda 表达式接受一个单一值并返回它的平方：\n\n```java\nx -> x * x\n\
    ```\n\n![](img/image72.jpg)\n\n下面的函数式接口定义都有一个单一抽象方法，接受一个单一值并返回一个值：\n\n```java\n\
    interface IntegerSquare {\n    int square(int x);\n}\n\ninterface DoubleSquare\
    \ {\n    double square(double x);\n}\n```\n\n![](img/image73.jpg)\n\n然而，两个赋值都是有效的。我们将\
    \ lambda 表达式赋值给函数式接口变量，这匹配了抽象方法的签名。\n\n```java\nIntegerSquare intSquare = x *\
    \ x;\nDoubleSquare doubleSquare = x * x;\n```\n\n![](img/image74.jpg)\n\n这里有一个完整的示例：\n\
    \n```java\npublic class LambdaExamples {\n    public static void main(String[]\
    \ args) {\n        IntegerSquare intSquare = x * x;\n        DoubleSquare doubleSquare\
    \ = x * x;\n        System.out.println(intSquare.square(5));\n        System.out.println(doubleSquare.square(5));\n\
    \    }\n}\n```\n\n![](img/image75.jpg)\n\n该序列的输出如下：\n```\n25\n25.0\n```\n\n让我们重新检查语句：\n\
    \n```java\nIntegerSquare intSquare = x * x;\n```\n\n![](img/image76.jpg)\n\n此表达式的左侧是\
    \ `IntegerSquare`，被称为 lambda 表达式的 `target type`（目标类型）。目标类型是在给定上下期望的数据类型。lambda\
    \ 表达式的目标类型必须是：\n\n- 函数式接口\n- 与接口描述符兼容的参数类型\n- 与描述符返回类型兼容的返回类型\n- 只抛出描述符允许的异常\n\
    \n提醒一下，描述符是函数方法的类型。它由参数类型、返回类型以及方法抛出的任何异常组成。\n\n我们还可以使用泛型函数式接口定义。为了说明这一点，我们将使用这里所示的\
    \ `ComputableType` 接口：\n\n```java\ninterface ComputableType<T> {\n    T compute(T\
    \ x);\n}\n```\n\n![](img/image77.jpg)\n\n在下一个示例中，我们根据此接口声明两个变量。第一个是 `Integer`\
    \ 类型，第二个是 `Double` 类型。示例展示了使用隐式和显式参数声明为每个变量赋值 lambda 表达式。\n\n```java\nComputableType<Integer>\
    \ computableInteger;\ncomputableInteger = (Integer x) -> x * x;\ncomputableInteger\
    \ = (x) -> x * x;\n\nComputableType<Double> computableDouble;\ncomputableDouble\
    \ = (Double x) -> x * x;\ncomputableDouble = (x) -> x * x;\n```\n\n![](img/image78.jpg)\n"
