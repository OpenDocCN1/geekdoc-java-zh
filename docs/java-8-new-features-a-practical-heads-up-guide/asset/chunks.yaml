    \ == (ComputableType<Integer>)(x) -> x * x);\nSystem.out.println(ci1.equals((ComputableType<Integer>)(x)\
    \ -> x * x));\nSystem.out.println(ci1 == ci2);\nSystem.out.println(ci1.equals(ci2));\n\
    \nci2 = ci1;\nSystem.out.println(ci1 == ci2);\nSystem.out.println(ci1.equals(ci2));\n\
    ```\n\n![](img/image81.jpg)\n\n输出如下：\n\n```\nfalse\nfalse\nfalse\nfalse\ntrue\n\
    true\n```\n\nlambda 表达式的比较并不总是像人们预期的那样工作。\n\n# 创建 Lambda 表达式\n\n在本节中，我们将看到如何创建\
    \ lambda 表达式，并检查 lambda 表达式的语法问题。lambda 表达式的基本语法如下：\n\n```\n(parameter) -> expression\n\
    (parameters) -> { statements;}\n```\n\n![](img/image82.jpg)\n\n一个 lambda 表达式由以下元素序列组成：\n\
    \n- 参数列表\n- lambda 运算符 (`->`)\n- 主体，可以是单个语句或语句块\n\n参数列表通常是括在括号内的用逗号分隔的形式形式参数列表。参数列表并不一定需要：\n\
    \n- 数据类型，或\n- 一组括号\n\n参数类型可以显式声明，也可以从其上下文中推断。lambda 表达式可以采用多种形式。表 1：Lambda 表达式形式展示了输入和返回值的各种组合。\n\
    \n*表 1：Lambda 表达式形式*\n\n| 参数数量 | 返回值数量 | 示例 |\n| :--- | :--- | :--- |\n| **0**\
    \ | 0 | `() -> System.out.println(\"\")` |\n| **0** | 1 | `() -> 45` |\n| **1**\
    \ | 0 | `(x) -> System.out.println(x)` |\n| **1** | 1 | `(x) -> x * x` |\n| **多个**\
    \ | 0 | `(x, y) -> System.out.println(x + y)` |\n| **多个** | 1 | `(x, y) -> x +\
    \ y` |\n\n![](img/image83.jpg)\n\n# Lambda 表达式语法规则\n\n以下规则总结了如何编写 lambda 表达式：\n\
    \n- 参数类型可以显式或隐式地声明\n- 当使用单个隐式声明的参数时，可以省略括号\n  - 然而，它们不能在同一个表达式中混合使用\n- 单值不必包含在块语句中\n\
    - lambda 表达式中的多个语句必须包含在块语句中\n- 块主体可以返回一个值，也可以不返回\n- 使用 `return` 关键字的规则与方法相同\n\n\
    我们将检查这些规则的细节并说明它们的许多变化。\n\n## 声明参数类型\n\n在第一个表达式中，参数 `x` 是显式声明的。在第二个表达式中，它的类型是隐式的。\n\
    \n```java\n(Integer x) -> System.out.println(x)\n(x) -> System.out.println(x)\n\
    ```\n\n![](img/image84.jpg)\n\n在隐式声明变量的情况下，目标类型起了作用。\n\n## 混合参数声明\n\n让我们从一个函数接口定义开始：\n\
    \n```java\ninterface IntegerMathType<T> {\n    T compute(T x, T y);\n}\n```\n\n\
    ![](img/image85.jpg)\n\n接下来两个表达式展示了显式参数声明的使用。第一个表达式使用了两个声明的参数，是合法的。第二个表达式是非合法的，因为一个参数是显式声明的，而另一个是隐式声明的。\n\
    \n```java\nIntegerMathType<Integer> addition = (Integer a, Integer b) -> {return\
    \ a + b;};\nIntegerMathType<Integer> addition = (Integer a, b) -> {return a +\
    \ b;}; // 非法\n```\n\n![](img/image86.jpg)\n\n第二个表达式生成的错误信息如下：\n\n```\n<identifier>\
    \ expected\nincompatible types: incompatible parameter types in lambda expression\n\
    ```\n\n## 省略括号\n\n在某些情况下可以省略括号。考虑以下 `ComputableType` 接口：\n\n```java\ninterface\
    \ ComputableType<T> {\n    T compute(T x);\n}\n```\n\n![](img/image87.jpg)\n\n\
    考虑以下声明：\n\n```java\nComputableType<Integer> computable;\n```\n\n![](img/image88.jpg)\n\
    \n带有显式参数的简单 lambda 表达式如下。\n\n```java\ncomputable = (Integer x) -> x * x;\n```\n\
    \n![](img/image89.jpg)\n\n我们可以如下进行简化。省略了类型和括号。\n\n```java\nComputableType<Integer>\
    \ computable;\ncomputable = x -> x * x;\n```\n\n![](img/image90.jpg)\n\n如果 lambda\
    \ 表达式有一个单参数，则可以省略括号。Java 会推断其类型。但你不能省略括号而保留类型，如下所示：\n\n```java\nComputableType<Integer>\
    \ computable;\ncomputable = Integer x -> x * x; // 非法\n```\n\n![](img/image91.jpg)\n\
    \n生成的错误信息如下：\n\n```\n';' expected\nnot a statement\n```\n\n在下一个示例中，两个 lambda 表达式显式和隐式地声明了参数。然而，第三个表达式声明了类型但没有使用括号，因此是非法的。\n\
    \n```java\n(int x, int y) -> x*y\n(x, y) -> x*y\nint x, y -> x*y // 非法\n```\n\n\
    ![](img/image92.jpg)\n\n生成的错误信息如下：\n\n```\n';' expected\nnot a statement\n```\n\
    \n## 省略块语句\n\n块语句并不总是必要的。在以下示例中，第一个 lambda 表达式使用单个输入参数并返回一个值（参数的平方）。第二个 lambda\
    \ 表达式返回两个参数的和。这两个表达式都没有使用块语句。\n\n```java\n(x) -> x * x\n(x, y) -> x + y\n```\n\
    \n![](img/image93.jpg)\n\n此外，返回 `void` 的单行 lambda 表达式不需要包含在块语句中。\n\n## 在 Lambda\
    \ 主体中使用多个语句\n\nlambda 表达式可以使用多个语句。为了说明这样做，我们将使用之前定义的 `ComputableType` 接口：\n\n\
    ```java\ncomputable = (x) -> {\n    int y = x * x;\n    y += x + x;\n    return\
    \ y;\n};\n```\n\n![](img/image94.jpg)\n\n## 使用返回值\n\n块主体可以返回值，也可以不返回。返回值时，不一定需要使用\
    \ `return` 关键字。在大多数情况下它是隐式的。以下 lambda 表达式不返回内容，因此不能使用 `return` 关键字：\n\n```\n(x)\
    \ -> System.out.println(x)\n```\n\n![](img/image95.jpg)\n\n下一个 lambda 表达式返回单个值。当返回值且存在块语句时，必须使用\
    \ `return` 关键字。\n\n```\ncomputable = (x) -> {return x * x;};\n```\n\n![](img/image96.jpg)\n\
    \n在这个示例中省略了 `return` 关键字：\n\n```java\naddition = (a, b) -> {a + b;};\n```\n\n\
    ![](img/image97.jpg)\n\n它将生成以下错误信息：\n\n```\nnot a statement\nincompatible types:\
    \ bad return type in lambda expression\nmissing return value\n```\n\n## 编写简洁的\
    \ Lambda 表达式\n\n创建短易写的 lambda 表达式是一个理想的目标，只要它不会变得过于晦涩。以下是关于编写简洁表达式的一些指南：\n\n"
- fmt: "\n- When a single parameter is used, do not use parentheses\n- Do not use\
    \ parameter types if possible\n- Avoid using a block statement\n\nA valid but\
    \ verbose expression is shown below:\n\n```\n(Integer x) -> {System.out.println(x);}\n\
    ```\n\n![](image98.jpg)\n\nAn equivalent but simpler expression follows:\n\n```java\n\
    x -> System.out.println(x)\n```\n\n![](image99.jpg)\n\nBy removing the parameter\
    \ type and the parentheses, we simplify the first part of the lambda expression.\
    \ The block statement is not required so it was also removed.\n\nHowever, some\
    \ IDEs may suggest that a block be used with a lambda body or to use explicit\
    \ parameters if the interface is generic. For example, let’s start with the definition\
    \ of a `ComputableType` interface as follows:\n\n```java\ninterface ComputableType<T>\
    \ {\n    T compute(T x);\n}\n```\n\n![](image100.jpg)\n\nA variable of this type\
    \ is declared below and then assigned a lambda expression:\n\n```java\nComputableType<Integer>\
    \ computableType ;\ncomputableType = (x) -> x * x;\n```\n\n![](image101.jpg)\n\
    \nAn IDE may offer suggestions to make this more readable. The equivalent declaration\
    \ using a body and then explicit parameters to satisfy an IDE suggestion are shown\
    \ below:\n\n```java\nComputableType<Integer> computable;\n// Using a block as\
    \ a lambda body\ncomputable = (x) -> {\n    return x * x;\n};\n\n// Using explicit\
    \ parameters\ncomputable = (Integer x) -> x * x;\n```\n\n![](image102.jpg)\n\n\
    If we had used the non-generic `Computable` interface as declared below, we would\
    \ not have been presented with these suggestions:\n\n```java\ninterface Computable\
    \ {\n    int compute(int x);\n}\n\nComputable computable;\ncomputable = (x) ->\
    \ x * x;\n```\n\n![](image103.jpg)\n\nHowever, it is illegal to use parameters\
    \ with this lambda expression since the interface is not generic. The following\
    \ illustrates an attempt to use an `Integer` type:\n\n```java\ncomputable = (Integer\
    \ x) -> x * x;  // illegal\n```\n\n![](image104.jpg)\n\nAn error message similar\
    \ to the following will be generated:\n\n```\nincompatible types: incompatible\
    \ parameter types in lambda expression\ncomputable = (Integer x) -> x * x;  //\
    \ illegal\n```\n\n## Capturing Variables in a Lambda Expression\n\nIn this section,\
    \ we will examine the techniques that are used to access variables within a lambda\
    \ expression. Using variables in the defining context is called variable capture.\
    \ A lambda expression can only access final or effectively final variables in\
    \ its defining context. Effectively final means that declaring the variable as\
    \ `final` would not cause an error if the code is compiled.\n\nLambda expressions\
    \ can refer to local variables that are not declared as `final` but are never\
    \ modified. However, they cannot redefine them. This addresses a limitation of\
    \ anonymous inner classes that requires local variables it uses to be declared\
    \ as final. Also, the use of the `this` and `super` keywords are permitted.\n\n\
    To summarize the rules, lambda expressions can:\n- Use final variables\n- Use\
    \ effectively final variables\n- Cannot modify local or parameters variables\n\
    - Cannot redefine local or parameter variables\n- Can use `this` and the `super`\
    \ keywords\n\nWe will use the following class to demonstrate how variables can\
    \ be captured in a lambda expression. The `IntegerMath` functional interface is\
    \ defined and then used in the test method. The test method creates and returns\
    \ a lambda expression that uses a series of variables to calculate a sum. The\
    \ lambda expression is later executed in a separate thread.\n\n```java\ninterface\
    \ IntegerMath {\n    int operation(int a, int b);\n}\n\npublic class VariableCapture\
    \ implements Runnable {\n    private int instanceVariable = 5;\n    static IntegerMath\
    \ le;\n\n    public static void main(String args[]) {\n        VariableCapture\
    \ vc = new VariableCapture();\n        le = vc.test(15);\n        Thread thread\
    \ = new Thread(vc);\n        thread.start();\n    }\n\n    public IntegerMath\
    \ test(int parameter) {\n        int localVariable = 10;\n        final int finalVariable\
    \ = 30;\n        IntegerMath testExpression = (x, y) -> {\n            return\
    \ x + y\n            + instanceVariable\n            + parameter\n           \
    \ + localVariable\n            + finalVariable;\n        };\n        return testExpression;\n\
    \    }\n\n    @Override\n    public void run() {\n        System.out.println(le.operation(25,\
    \ 5));\n    }\n}\n```\n\n![](image105.jpg)\n\nThe output of this program will\
    \ be 90.\n\nThe lambda expression is able to access the variables in its context.\
    \ However, if the `localVariable` or `parameter` variables are modified they are\
    \ no longer effectively final and a syntax error is generated. The error message\
    \ generated for both of these modifications follows:\n\n```\nlocal variables referenced\
    \ from a lambda expression must be final or effectively final\n```\n\nIt doesn’t\
    \ matter where the variables are modified. They simply cannot be changed. The\
    \ `instanceVariable` can be modified if needed.\n\nWe could have used the `this`\
    \ keyword in the lambda expression as follows. There are no restrictions on its\
    \ use:\n\n```java\n+ this.instanceVariable\n```\n\n![](image106.jpg)\n\nThe `super`\
    \ keyword can also be used to access base class members.\n\nAn attempt to redefine\
    \ `localVariable` or `parameter` within the lambda expression will result in an\
    \ error message:\n\n```\nvariable index is already defined in method testCapture\
    \ ()\n```\n\nUsing effectively final variables eliminates certain types of multithreading\
    \ errors which involve local variables. Since a lambda expression may be defined\
    \ in one context, but executed in a different context (thread), using effectively\
    \ final variables eliminates problems that can occur with mutable variables shared\
    \ between threads.\n\nIf a mutable variable was used, and if the computation were\
    \ distributed across multiple threads, such as with the `forEach` method, these\
    \ variables would need to be synchronized with its associated overhead. The intent\
    \ of restricting access to effectively final variables is to force the programmer\
    \ to focus on easily parallelizable and thread-safe techniques.\n\n## Differentiating\
    \ between a Lambda Expression and a Closure\n\nA closure and a lambda expression\
    \ are essentially the same thing in Java. A lambda expression is an anonymous\
    \ function. A closure is a function that closes over its environment. Closing\
    \ over its environment means that it is able to access variables which are not\
    \ in its parameter list. A closure consists of code bound to a set of variables.\
    \ In Java, lambda expressions are implemented using closure which implies we can\
    \ treat the two terms interchangeably.\n\nWhen a lambda expression is evaluated,\
    \ it uses the context in which it was defined, not where it is being used. If\
    \ a lambda expression is defined in the context of a specific stack, it will be\
    \ executed in the context of that stack even if it is being used within another\
    \ stack. Passing a closure between execution contexts (threads) permits the evaluation\
    \ of the expression in the environment it was defined in.\n\nWhile an object is\
    \ an instance of a class, a closure is an implementation of a lambda expression.\
    \ When a lambda expression is compiled, an object representing that lambda expression\
    \ type is created at run-time. While lambda expressions can be viewed as objects,\
    \ they are better thought of as functions.\n\n## Method and Constructor References\n\
    \nThere are times when it is useful to treat a class method as a lambda expression.\
    \ If the functionality needed is already implemented by a method, why not use\
    \ the method instead of creating a new lambda expression? Method references provide\
    \ a compact way of identifying and using existing methods of a class. In other\
    \ words, a method reference is a technique to identify and reference lambda expressions\
    \ that happen to have a name.\n\nA method reference consists of a class name followed\
    \ by two colons and then by the name of a method or the keyword `new` for constructor\
    \ references. Table 2: Examples of Method/Constructor References illustrates simple\
    \ examples of method references. The last example is a constructor reference.\n\
    \n***Table 2: Examples of Method/Constructor References***\n\n| Method Reference\
    \ | Equivalent Lambda Expression |\n| :--- | :--- |\n| `System.out::println` |\
    \ `(s) -> System.out.println(s)` |\n| `Person::toString` | `s->s.toString()` |\n\
    | `String::indexOf` | `x->String.indexOf(x)` |\n| `Math::sin` | `x->Math.sin(x)`\
    \ |\n| `ArrayList::new` | `() -> new ArrayList<>()` |\n\n![](image107.jpg)\n"
  raw: '- When a single parameter is used, do not use parentheses


    - Do not use parameter types if possible


    - Avoid using a block statement


    A valid but verbose expression is shown below:


    (Integer x) -> {System.out.println(x);}


    ![](image98.jpg)


    An equivalent but simpler expression follows:


    x -> System.out.println(x)


    ![](image99.jpg)


    By removing the parameter type and the parentheses, we simplify the first part
    of the lambda expression. The block statement is not required so it was also removed.


    However, some IDEs may suggest that a block be used with a lambda body or to use
    explicit parameters if the interface is generic. For example, let’s start with
    the definition of a ComputableType interface as follows:


    interface ComputableType<T> {


    T compute(T x);


    }


    ![](image100.jpg)


    A variable of this type is declared below and then assigned a lambda expression:


    ComputableType<Integer> computableType ;


    computableType = (x) -> x * x;


    ![](image101.jpg)


    An IDE may offer suggestions to make this more readable. The equivalent declaration
    using a body and then explicit parameters to satisfy an IDE suggestion are shown
    below:


    ComputableType<Integer> computable;


    // Using a block as a lambda body


    computable = (x) -> {


    return x * x;


    };


    // Using explicit parameters


    computable = (Integer x) -> x * x;


    ![](image102.jpg)


    If we had used the non-generic Computable interface as declared below, we would
    not have been presented with these suggestions.


    interface Computable {


    int compute(int x);


    }


    Computable computable;


    computable = (x) -> x * x;


    ![](image103.jpg)


    However, it is illegal to use parameters with this lambda expression since the
    interface is not generic. The following illustrates an attempt to use an Integer
    type:


    computable = (Integer x) -> x * x;  // illegal


    ![](image104.jpg)


    An error message similar to the following will be generated:


    incompatible types: incompatible parameter types in lambda expression


    computable = (Integer x) -> x * x;  // illegal


    Capturing Variables in a Lambda Expression


    In this section, we will examine the techniques that are used to access variables
    within a lambda expression. Using variables in the defining context is called
    variable capture. A lambda expression can only access final or effectively final
    variables in its defining context. Effectively final means that declaring the
    variable as final would not cause an error if the code is compiled.


    Lambda expressions can refer to local variables that are not declared as final
    but are never modified. However, they cannot redefine them. This addresses a limitation
    of anonymous inner classes that requires local variables it uses to be declared
    as final. Also, the use of the this and super keywords are permitted.


    To summarize the rules, lambda expressions can:


    - Use final variables


    - Use effectively final variables


    - Cannot modify local or parameters variables


    - Cannot redefine local or parameter variables


    - Can use this and the super keywords


    We will use the following class to demonstrate how variables can be captured in
    a lambda expression. The IntegerMath functional interface is defined and then
    used in the test method. The test method creates and returns a lambda expression
    that uses a series of variables to calculate a sum. The lambda expression is later
    executed in a separate thread.


    interface IntegerMath {


    int operation(int a, int b);


    }


    public class VariableCapture implements Runnable {


    private int instanceVariable = 5;


    static IntegerMath le;


    public static void main(String args[]) {


    VariableCapture vc = new VariableCapture();


    le = vc.test(15);


    Thread thread = new Thread(vc);


    thread.start();


    }


    public IntegerMath test(int parameter) {


    int localVariable = 10;


    final int finalVariable = 30;


    IntegerMath testExpression = (x, y) -> {


    return x + y


    + instanceVariable


    + parameter


    + localVariable


    + finalVariable;


    };


    return testExpression;


    }


    @Override


    public void run() {


    System.out.println(le.operation(25, 5));


    }


    }


    ![](image105.jpg)


    The output of this program will be 90.


    The lambda expression is able to access the variables in its context. However,
    if the localVariable or parameter variables are modified they are no longer effectively
    final and a syntax error is generated. The error message generated for both of
    these modifications follows:


    local variables referenced from a lambda expression must be final or effectively
    final


    It doesn’t matter where the variables are modified. They simply cannot be changed.
    The instanceVariable can be modified if needed.


    We could have used the this keyword in the lambda expression as follows. There
    are no restrictions on its use.


    + this.instanceVariable


    ![](image106.jpg)


    The super keyword can also be used to access base class members.


    An attempt to redefine localVariable or parameter within the lambda expression
    will result in an error message:


    variable index is already defined in method testCapture ()


    Using effectively final variables eliminates certain types of multithreading errors
    which involve local variables. Since a lambda expression may be defined in one
    context, but executed in a different context (thread), using effectively final
    variables eliminates problems that can occur with mutable variables shared between
    threads.


    If a mutable variable was used, and if the computation were distributed across
    multiple threads, such as with the forEach method, these variables would need
    to be synchronized with its associated overhead. The intent of restricting access
    to effectively final variables is to force the programmer to focus on easily parallelizable
    and thread-safe techniques.


    Differentiating between a Lambda Expression and a Closure


    A closure and a lambda expression are essentially the same thing in Java. A lambda
    expression is an anonymous function. A closure is a function that closes over
    its environment. Closing over its environment means that it is able to access
    variables which are not in its parameter list. A closure consists of code bound
    to a set of variables. In Java, lambda expressions are implemented using closure
    which implies we can treat the two terms interchangeably.


    When a lambda expression is evaluated, it uses the context in which it was defined,
    not where it is being used. If a lambda expression is defined in the context of
    a specific stack, it will be executed in the context of that stack even if it
    is being used within another stack. Passing a closure between execution contexts
    (threads) permits the evaluation of the expression in the environment it was defined
    in.


    While an object is an instance of a class, a closure is an implementation of a
    lambda expression. When a lambda expression is compiled, an object representing
    that lambda expression type is created at run-time. While lambda expressions can
    be viewed as objects, they are better thought of as functions.


    Method and Constructor References


    There are times when it is useful to treat a class method as a lambda expression.
    If the functionality needed is already implemented by a method, why not use the
    method instead of creating a new lambda expression? Method references provide
    a compact way of identifying and using existing methods of a class.  In other
    words, a method reference is a technique to identify and reference lambda expressions
    that happen to have a name.


    A method reference consists of a class name followed by two colons and then by
    the name of a method or the keyword **new** for constructor references. Table
    2: Examples of Method/Constructor References illustrates simple examples of method
    references. The last example is a constructor reference.


    ***Table 2: Examples of Method/Constructor References***


    **Method Reference** | Equivalent Lambda Expression


    **System.out::println** | (s) -> System.out.println(s)


    **Person::toString** | s->s.toString()


    **String::indexOf** | x->String.indexOf(x)


    **Math::sin** | x->Math.sin(x)


    **ArrayList::new** | () -> new ArrayList<>()


