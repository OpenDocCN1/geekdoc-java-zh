    Java 8 introduces the concept of a Compact Profile. The intent is to use only
    parts of the Java platform so as to allow Java to be utilized on platforms with
    minimal resources. For example, some platforms do not require GUI APIs and eliminating
    them will save space.


    The Compact Profiles


    There are three compact profiles: compact1, compact2, and compact3. Each of these
    compacts consists of a set of classes. Compact1 is the smallest. Compact2 consists
    of all of the packages of compact1 plus additional packages. Compact3 consists
    of all of the classes of compact1 and compact2 plus an additional set of packages.
    The packages included in each compact are listed in **Table 4 - Compact Profile
    Listing**. The entire JDK is not considered to be a compact.


    Javadoc includes the names of the compact a class belongs to, if any. For example,
    The Clock class is found in all of the compacts. This is reflected in the documentation
    found at [http://download.java.net/jdk8/docs/api/](http://download.java.net/jdk8/docs/api/).
    The first part of the documentation is  shown below:


    compact1, compact2, compact3


