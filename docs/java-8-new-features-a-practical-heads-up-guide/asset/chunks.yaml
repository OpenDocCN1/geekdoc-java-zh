    | 持续时间和间隔 | `Duration` | 以纳秒计的时间跨度测量 |

    | 持续时间和间隔 | `Period` | 以更易用的单位计的时间跨度测量 |

    | 时区相关 | `ZonedDateTime` | 带时区的日期和时间 |

