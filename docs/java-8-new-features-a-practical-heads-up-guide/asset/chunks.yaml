    Using Temporal Queries


    A TemporalQuery is used in conjunction with a temporal-based object to obtain
    information about that object. Predefined queries are available and custom queries
    can be created.


    The following reworks the example found in the A Simple Example section. That
    example demonstrated how to determine whether an employee was currently working
    even though the employee may be in a different time zone.


    An Employee class is defined that possesses various date and time classes to represent
    time related aspects of an employee. The immediate relevant parts of the class
    are listed below. The class implements the TemporalQuery interface which requires
    that we provide a queryFrom method. We will implement this method later in this
    discussion.


    public class Employee implements TemporalQuery<Boolean> {


    private String name;


    private LocalDate birthdate;


    private LocalDate hireDate;


    private LocalTime startWorkDay;


    private Duration dailyTime;


    private ZoneId timeZone;


    public Employee(String name, LocalDate birthdate,


    LocalDate hireDate, LocalTime startWorkDay,


    Duration dailyTime, ZoneId timeZone) {


    this.name = name;


    this.birthdate = birthdate;


    this.hireDate = hireDate;


    this.startWorkDay = startWorkDay;


    this.dailyTime = dailyTime;


    this.timeZone = timeZone;


    }


    ...


    }


    ![](image344.jpg)


    An employee is created as shown below. The fourth argument of the constructor
    specifies that she starts work at 8 in the morning. The fifth argument indicates
    that her shift is 6 hours in length. The last argument shows that she is located
    in La Paz.


    Employee employee1 = new Employee("Mary",


    LocalDate.of(1985, Month.MAY, 5),


    LocalDate.of(2010, Month.JUNE, 13),


    LocalTime.of(8, 0),


    Duration.ofHours(6),


    ZoneId.of("America/La_Paz"));


    ![](image345.jpg)


    The present time is calculated using the ZonedDateTime class’ now method. This
    time will represent the current time in the current time zone. The Employee class’
    isWorkingNow method will return true if the employee is currently working or false
    otherwise.


    ZonedDateTime present = ZonedDateTime.now();


    System.out.println(employee1.isWorkingNow(present));


    ![](image346.jpg)


    The isWorkingNow method’s implementation follows. A LocalDate is created first
    and is used to create a start and end time based on the worker’s time zone. A
    ZonedDateTime presenting the present is created using the TemporalAccessor passed
    to the method. The method then uses these values with the compareTo method to
    determine if the worker is present.


    public Boolean isWorkingNow(TemporalAccessor temporal) {


    LocalDate employeeDate =


    LocalDate.of(LocalDate.now().getDayOfYear(),


    LocalDate.now().getMonth(),


    LocalDate.now().getDayOfMonth());


    ZonedDateTime startTime = ZonedDateTime.of(


    employeeDate,


    this.startWorkDay,


    this.getTimeZone());


    ZonedDateTime present = (ZonedDateTime) temporal;


    ZonedDateTime endTime = startTime.plusHours(


    this.getDailyTime().toHours());


    return (startTime.compareTo(present) <= 0) &&


     (endTime.compareTo(present) >= 0);


    }


    ![](image347.jpg)


    Using a specific method such as the isWorkingNow method allows other methods to
    be added to the class to support similar query operations. Alternatively, we could
    have used the queryFrom method from a standard query as follows:


    System.out.println(employee1.queryFrom(present));


    ![](image348.jpg)


    The queryFrom method duplicates the isWorkingNow method:


    @Override


    public Boolean queryFrom(TemporalAccessor temporal) {


    LocalDate employeeDate =


    LocalDate.of(


    LocalDate.now().getDayOfYear(),


    LocalDate.now().getMonth(),


    LocalDate.now().getDayOfMonth());


    ZonedDateTime start = ZonedDateTime.of(employeeDate,


    this.startWorkDay, this.getTimeZone());


    ZonedDateTime present = (ZonedDateTime) temporal;


    ZonedDateTime endTime =


    start.plusHours(this.getDailyTime().toHours());


    return (start.compareTo(present) <= 0) &&


    (endTime.compareTo(present) >= 0);


    }


    ![](image349.jpg)


    We could have also called the isWorkingNow method from the queryFrom method to
    achieve the same results.


    Understanding Value-Based Classes


    Many classes in Java 8 are value-based. The LocalDateTime and MonthDay are examples
    of such classes. These types of classes possess a number of characteristics including:


    - They are final


    - They are immutable


    - They have no public constructors


    - Factory methods are needed to create instances of these classes


    - Their equals, hashCode and toString methods do not use information from other
    sources when executed


    - We should use the equals method instead of the == operator when performing comparisons


    - Interchanging two equivalent objects should not result in any difference in
    behavior


    Identity-sensitive operations on value-based objects should be avoided. Any such
    operations may result in unpredictable behavior. This is illustrated below where
    the equality operator and equals methods are used to compare two identical objects:


    MonthDay date1 = MonthDay.of(2, 2);


    MonthDay date2 = MonthDay.of(2, 2);


    System.out.println(date1 == date2);


    System.out.println(date1.equals(date2));


    ![](image350.jpg)


    The equality operator will return false while the equals method returns true;


    Conclusion


    The new Java 8 date and time API is large and complex. It uses a variety of classes
    to support local dates and times along with time zone based needs. The API uses
    a consistent and easy to understand method naming scheme. This supports a fluent
    style of programming which improves productivity and the code’s readability.


    The API supports a machine timeline through the Clock class. Human timelines are
    supported through classes like LocalDate and ZonedTimeDate. In addition, time
    intervals are created using the Duration class for hours, minutes, and seconds
    and the Period class for units such as months and days.


    There are several classes that include time zone related information. The developer
    can work with zone offsets and zone rules as needed. Dates and time can be created
    through several methods including parsing strings. Dates and times can be displayed
    using a variety of formatting techniques.


