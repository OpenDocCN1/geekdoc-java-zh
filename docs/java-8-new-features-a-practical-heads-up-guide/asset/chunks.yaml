    # Using Date and Time Classes


    The date and time classes do not use time zone information. Time zone classes
    are discussed in the Working with the Time Zone and Offset Classes section. Date
    and time classes are summarized in Table 12 - Date and Time Class Summary. These
    classes are immutable and their names give a good idea of what they represent.
