    \ op)\n```\n\n![](img/image374.jpg)\n\n该方法使用两个参数：数组和一个二元运算符。在这种情况下，二元运算符使用两个值，作为数组的索引。第一个索引应用于一个元素，第二个索引应用于第一个元素之后的元素。这些索引处的元素将按照二元操作指定的，应用到第二个索引指定的数组元素上。\n\
    \n在接下来的示例中，`numbers` 数组的每个元素都被赋值为 2。二元运算符将相邻元素相加。\n\n```java\nint[] numbers =\
    \ new int[25];\nArrays.parallelSetAll(numbers, p -> 2);\nArrays.parallelPrefix(numbers,\
    \ (n, m) -> n + m);\nfor (int i = 0; i < 25; i++) {\n    System.out.println(numbers[i]);\n\
    }\n```\n\n![](img/image375.jpg)\n\n这将输出以 2 为步进的 2 到 50 的序列。每个元素都是前一个元素和当前元素的和。接下来的调用将计算\
    \ 2 的幂：\n\n```java\nArrays.parallelPrefix(numbers, (n, m) -> n * m);\n```\n\n\
    ![](img/image376.jpg)\n\n# Collections 框架增强\n\nCollections 框架增加了许多新方法。这些新增内容的变部分列表列在**表\
    \ 3 - Collections 框架新增**中。`java.util` 包的更改和删除的更完整列表可以在此处 [`cr.openjdk.java.net/~mr/se/8/java-se-8-pr-spec/apidiffs/java/util/package-summary-stat.html`](http://cr.openjdk.java.net/~mr/se/8/java-se-8-pr-spec/apidiffs/java/util/package-summary-stat.html)找到。其中某些方法，例如\
    \ `stream` 和 `forEach` 方法已经在之前的章节中讨论过。在本节中，我们将探索其他一些方法。\n\nJava 7 增加了一种替代 String\
    \ 哈希函数。Java 8 删除了该函数以及 `jdk.map.althashing.threshold` 系统属性。取而使用的是平衡树而不是链表。树的每个节点都将包含用于存放冲突的桶。此更改仅适用于\
    \ `HashMap`、`LinkedHashMap` 和 `ConcurrentHashMap`。\n\n### 表 3 - Collections 框架新增\n\
