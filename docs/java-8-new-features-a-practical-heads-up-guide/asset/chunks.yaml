    ![](image339.jpg)


    The displaySettings method is listed below. This method uses the isDaylightSavings
    and getDaylightSavings methods on the time zone passed to it based on the current
    date and a date 8 months later. These methods indicate whether daylight savings
    time is in effect and the length of the daylight savings respectively.


    public static void displaySettings(ZoneId zoneId) {


    ZoneRules rules = zoneId.getRules();


    System.out.println("Today");


    System.out.println(zoneId + ": " +


    rules.isDaylightSavings(Instant.now()));


    System.out.println(zoneId + ": " +


    rules.getDaylightSavings(Instant.now()));


    System.out.println("In Eight Months");


    System.out.println(zoneId + ": " +


    rules.isDaylightSavings(


    Instant.now().plus(8 * 30, ChronoUnit.DAYS)));


    System.out.println(zoneId + ": " +


    rules.getDaylightSavings(


    Instant.now().plus(8 * 30, ChronoUnit.DAYS)));


    }


