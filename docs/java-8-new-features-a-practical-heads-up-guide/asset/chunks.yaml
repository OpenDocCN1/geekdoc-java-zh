    \ Drawable { }\npublic interface Colorable extends Drawable { }\npublic interface\
    \ MoreDisplayable extends Displayable, Colorable { }\n```\n\n![](image27.jpg)\n\
    \nThis will compile without errors. A similar situation occurs if a class implements\
    \ both the `Displayable` and `Colorable` interfaces:\n\n```java\npublic class\
    \ Busy implements Displayable, Colorable {\n\n}\n```\n\n![](image28.jpg)\n\nWhen\
    \ an instance of `Busy` is created and the `draw` method is executed against this\
