  trans: "\n\n注意：我将使用 `default methods` 术语，因为我们使用 `default` 关键字来表示默认方法（类似于我们使用 `static`\
    \ 关键字来表示静态方法）。有人认为，在接口中添加默认方法破坏了接口概念所隐含的契约。在某种意义上，接口不再是“纯”的。这种变化是否是更好尚待争议。无论如何，默认方法的使用为开发者提供了一种额外的技术。\n\
    \n## 理解默认方法的重要性\n\n引入默认方法有以下几个原因：\n\n-   现有代码不需要更新即可实现新方法。这允许接口进行向增长或扩展。\n-  \
    \ 在继承层次结构的设计中提供额外的灵活性，例如：\n    - 在接口层次结构中放置功能的位置时提供额外的选项\n    - 支持模拟适配器类类型功能的接口\n\
    -   支持 lambda 表达式\n\n接口中仍然不允许私有变量。在上一个例子中，抽象方法 `hasBeenDrawn()` 暗示了可能使用类状态的变量。然而，对状态信息的任何支持都由接口的实现者提供。\n\
    \n## 定义默认方法\n\n让我们查看创建和使用默认方法的细节。`default` 关键字始终用于声明默认方法。从技术上讲，该关键字似乎并不是必要的。毕竟，从方法体的存在可以明显看出它不是抽象的。它的主要理由是为了明显看出该方法已实现。\n\
    \n这类似于使用 `abstract` 关键字来声明抽象方法和抽象类。虽然抽象方法由于缺少方法体而显而易见，抽象类也由于存在抽象方法而显而易见，但这些关键字的使用明确了意图。例如，在接口中声明抽象方法并不需要\
    \ `abstract` 关键字。我们可以按照如下方式声明之前的抽象方法：\n\n```java\npublic interface Drawable {\n\
    //…\npublic boolean hasBeenDrawn();\n}\n```\n\n![](img/image4.jpg)\n\n然而，我们将显式地使用\
    \ `abstract` 关键字来清楚地表达意图。\n\n`default` 关键字可以用方法声明中的两个位置。将关键字放在任何作用域修饰符之前或之后。作用域修饰符通常是理想的，但不是要求的。`default`\
    \ 关键字的可能放置位置所示：\n\n```java\npublic default void draw(){…}\ndefault public void\
    \ draw(){…}\ndefault void draw(){…}\n```\n\n![](img/image5.jpg)\n\n“默认方法”一词不应被误认为如果没有提供其他方法，它将被默认执行。事实上，一个接口可以有多个默认方法，如下：\n\
    \n```java\ninterface Drawable {\n    default void draw() {\n        System.out.println(\"\
    The Drawable interface's draw method\");\n    }\n    default void drawInQuotes()\
    \ {\n        System.out.println(\"\\\"The Drawable interface's drawInQuotes method\\\
    \"\");\n    }\n    public abstract boolean hasBeenDrawn();\n}\n```\n\n![](img/image6.jpg)\n\
    \n这两个方法都可以从实现类中使用，如下所示：\n\n```java\nPerson person = new Person();\nperson.draw();\n\
    person.drawInQuotes();\n```\n\n![](img/image7.jpg)\n\n输出如下：\n\n```\nThe Drawable\
    \ interface's draw method\n\"The Drawable interface's drawInQuotes method\"\n\
    ```\n\n## 重写默认方法\n\n类必须重写抽象方法以避免变成抽象类，但默认方法不需要重写。可以根据需要重写以提供另一种实现。在以下 `Person`\
    \ 类的实现中，提供了一个被重写的 `draw` 方法：\n\n```java\ninterface Drawable {\n    public default\
    \ void draw() {\n        System.out.println(\"The Drawable interface's draw method\"\
    );\n    }\n}\n\nclass Person implements Drawable {\n    @Override\n    public\
    \ void draw() {\n        System.out.println(\"The Person's draw method\");\n \
    \   }\n}\n```\n\n![](img/image8.jpg)\n\n虽然 `@Override` 注解不是必须的，但包含它是良好的编程习惯。当现在调用\
    \ `draw` 方法时，将执行 `Person` 类的实现，如下所示：\n\n```java\nPerson person = new Person();\n\
    person.draw();\n```\n\n![](img/image9.jpg)\n\n输出如下：\n\n```\nThe Person's draw\
    \ method\n```\n\n如果我们想从实现接口的类使用默认方法的实现，我们使用接口名称，后跟 `super` 关键字，然后是方法名——所有部分用点隔开。对于\
    \ `draw` 方法，实现如下所示：\n\n```java\nclass Person implements Drawable {\n    @Override\n\
    \    public void draw() {\n        Drawable.super.draw();\n        System.out.println(\"\
    The Person's draw method\");\n    }\n}\n```\n\n![](img/image10.jpg)\n\n所示的输出是基于之前对\
    \ `Person` 实例调用 `draw` 方法的结果：\n\n```\nThe Drawable interface's draw method\nThe\
    \ Person's draw method\n```\n\n在实现类中重写默认方法时不能使用 `default` 关键字。例如，以下代码将无法正常编译：\n\
    \n```java\nclass Person implements Drawable {\n    @Override\n    public default\
    \ void draw() {\n        System.out.println(\"The Person's draw method\");\n \
    \   }\n}\n```\n\n![](img/image11.jpg)\n\n将生成类似下面的错误信息：\n\n```\nmodifier default\
    \ not allowed here\n```\n\n## 在默认方法中使用继承\n\n接口可以相互继承。复杂的层次结构是可能的，包括使用多继承的情况。结果是默认方法可以在层次结构被重写。在本节中，我们将说明各种方案并解释运行时系统如何确定使用的方法。\n\
    \n### 使用单继承\n\n与早期的 Java 版本一样，接口可以派自另一个接口。如下所示，`Displayable` 接口派自 `Drawable` 接口。在初始版本中，`Displayable`\
    \ 接口没有添加方法。\n\n```java\ninterface Drawable {\n    public default void draw() {\n\
    \        System.out.println(\"The Drawable interface's draw method\");\n    }\n\
    }\n\npublic interface Displayable extends Drawable {\n}\n```\n\n![](img/image12.jpg)\n\
    \n`Person` 类实现了 `Displayable` 接口，如下：\n\n```java\npublic class Person implements\
    \ Displayable {\n}\n```\n\n![](img/image13.jpg)\n\n这些关系如图 1：继承与实现。实线表示继承，虚线显示\
    \ `Person` 类实现了 `Displayable` 接口。\n\n![](img/image14.jpg)\n\n图 1：继承与实现\n\n当对没有重写\
    \ `draw` 方法的 `Person` 实例执行 `draw` 方法时，将执行 `Drawable` 的 draw 方法，如下：\n\n```java\n\
    Person person = new Person();\nperson.draw();\n```\n\n![](img/image15.jpg)\n\n\
    输出：\n\n```\nThe Drawable interface's draw method\n```\n\n我们可以如下所示在 `Displayable`\
    \ 接口中重写 `draw` 方法。注意 `default` 关键字。我们在接口中重写默认方法时是要求的。\n\n```java\ninterface Displayable\
    \ extends Drawable {\n    public default void draw() {\n        System.out.println(\"\
    The Displayable interface's draw method\");\n    }\n}\n```\n\n![](img/image16.jpg)\n\
    \n如果漏掉 `default` 关键字，我们将得到以下错误消息：\n\n```\ninterface abstract methods cannot have\
    \ body\n```\n\n`draw` 方法的输出现在反映如下：\n\n```\nThe Displayable interface's draw method\n\
    ```\n\n在层次链中可以将默认方法变为抽象。考虑如下所示的名为 `MoreDisplayable` 的第三方接口。`draw` 方法被重写为抽象方法。\n\
    \n```java\ninterface MoreDisplayable extends Displayable {\n    @Override\n  \
    \  public abstract void draw();\n}\n```\n\n![](img/image17.jpg)\n\n当 `Person`\
    \ 类实现 `MoreDisplayable` 接口时，它必须实现 `draw` 方法。如果没有，则该类必须声明为抽象类。\n\n"
