    ```\n\n![](image321.jpg)\n\nWe can also use the `isAfter()` and `isBefore()` methods\
    \ which compares two `MonthDay` instances.\n\n```java\nSystem.out.println(today.isBefore(nextMonth));\n\
    System.out.println(nextMonth.isAfter(today));\n```\n\n![](image322.jpg)\n\nBoth\
    \ statements will display true.\n\n# Using the Enumerations `DayOfWeek` and `Month`\n\
    \nThese two enumeration classes are used to specify the days of the week and months\
    \ of the year from a human perspective. They are typically used in conjunction\
    \ with other classes.\n\n## Using the `DayOfWeek` Enumeration\n\nThis enumeration\
    \ is a convenient way of representing the days of the week. For example, the expression\
    \ `DayOfWeek.FRIDAY` represents Friday. The `values()` method returns an array\
    \ of these enumerations as shown below. It also possesses a `getValue()` method\
    \ that returns the numeric representation for that enumeration.\n\n```java\nDayOfWeek\
    \ days[] = DayOfWeek.values();\nfor (DayOfWeek day : days) {\n    System.out.println(day.getValue()\
    \ + \" - \" + day);\n}\n```\n\n![](image323.jpg)\n\nThe output of this sequence\
    \ follows:\n1 - MONDAY\n2 - TUESDAY\n3 - WEDNESDAY\n4 - THURSDAY\n5 - FRIDAY\n\
    6 - SATURDAY\n7 – SUNDAY\n\nWe can create a `DayOfWeek` value using either the\
    \ `valueOf()` or `of()` methods.\n\n```java\nDayOfWeek day = DayOfWeek.valueOf(\"\
    TUESDAY\");\n```\n\n![](image324.jpg)\n\nThe `of()` method accepts an integer\
    \ and returns the corresponding enumeration:\n\n```java\nDayOfWeek day = DayOfWeek.of(2);\n\
    ```\n\n![](image325.jpg)\n\nThe `ZoneId` class can be used for time zone identifiers.\n\
    \n```java\nLocalDate localDate = LocalDate.now();\nSystem.out.println(localDate.with(DayOfWeek.FRIDAY));\n\
    ```\n\n![](image326.jpg)\n\nThe output will be:\n2014-03-06\n\n# Using the `Month`\
    \ Enumeration\n\nThe `Month` enumeration supports the 12 months of the year. Like\
    \ `DayOfWeek`, it has `values()` which we can use:\n\n```java\nMonth months[]\
    \ = Month.values();\nfor (Month month : months) {\n    System.out.println(month.getValue()\
    \ + \" - \" + month);\n}\n```\n\n![](image327.jpg)\n\nThe output follows:\n1 -\
