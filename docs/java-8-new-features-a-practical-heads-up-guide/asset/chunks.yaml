  trans: "\n\n# 使用并行流操作\n\n使用流（streams）的优势之一是它们可能支持流操作的并发执行。传统的集合方法并不总是线程安全的。通常，必须使用显式的线程同步机制来解决潜在的数据损坏问题。使用同步可能会引入线程争用问题。如果所操作的集合没有被修改，并行流操作可以避免这些问题。\n\
    \n请记住，流操作的并发执行并不意味着应用程序的运行速度会更快。对于较小的集合，支持并行执行所产生的开销可能比按顺序执行相同组操作所需的时间更大。\n\n\
    当一个流被并行化时，运行时环境将流拆分成多个部分，在单独的处理器上执行每个部分，然后合并结果。默认情况下，流上的操作是按顺序执行的。要影响并行执行，需要使用\
    \ `Collection` 接口的 `parallelStream` 方法或 `BaseStream` 接口的 `parallel` 方法。\n\n让我们从以下列表和流的声明开始：\n\
    \n```java\nList<Part> partsList = Arrays.asList(\n    new Part(\"Pencil\", 100,\
    \ 5, 0.15f),\n    new Part(\"Eraser\", 200, 3, 0.25f),\n    new Part(\"Paper\"\
    , 2000, 1, 0.03f),\n    new Part(\"Pen\", 200, 3, 0.25f),\n    new Part(\"Staple\"\
    , 3000, 1, 0.01f)\n);\n\nStream<Part> partsStream = partsList.stream();\n```\n\
    \n![](img/image258.jpg)\n\n下面是一个过滤掉重量小于 3 的部分的顺序流：\n\n```java\npartsStream.filter(\n\
    \  (p)->p.getWeight()>=3).\n  forEach(p -> System.out.println(p));\n```\n\n![](img/image259.jpg)\n\
    \n使用并行流执行相同的操作，如下所示，使用了 `parallel` 方法：\n\n```java\npartsStream.parallel().\n \
    \ filter((p)->p.getWeight()>=3).\n  forEach(p -> System.out.println(p));\n```\n\
    \n![](img/image260.jpg)\n\n这两个序列的输出如下，并且对于每个示例来说都是相同的：\n\nName: Eraser  Weight:\
    \   3  Part Number:  200 Price: 0.25\nName: Pencil  Weight:   5  Part Number:\
    \  100 Price: 0.15\n\n然而，将顺序流转换为并行流并不总是这么简单。归约操作（Reduction type operations）需要更仔细地处理。在下面的示例中，创建一个\
    \ `Map`，其键是整数重量。`groupingBy` 方法将返回一个具有相同重量成员的列表。这些列表会被赋值给 map。\n\n```java\nMap<Integer,\
    \ List<Part>> groupByWeight =\n  partsStream.collect(\n    Collectors.groupingBy(Part::getWeight));\n\
    \nfor(Part part : groupByWeight.get(3)) {\n  System.out.println(part);\n}\n```\n\
    \n![](img/image261.jpg)\n\n输出如下：\n\nName: Eraser  Weight:   3  Part Number:  200\
    \ Price: 0.25\nName: Pen      Weight:   3  Part Number:  200 Price: 0.25\n\n使用并行流达到相同的结果需要像下面所示进行一些修改。为了提高操作性能，需要一个\
    \ `ConcurrentMap` 并应该使用 `groupingByConcurrent` 方法。\n\n```java\nConcurrentMap<Integer,\
    \ List<Part>> groupByWeight =\n  partsStream.parallel().collect(\n    Collectors.groupingByConcurrent(Part::getWeight));\n\
    \nfor (Part part : groupByWeight.get(3)) {\n  System.out.println(part);\n}\n```\n\
    \n![](img/image262.jpg)\n\n要影响并发归约，需要考虑以下规则：\n\n- 流是一个并行流\n- 使用的收集器具有特性：`CONCURRENT`\n\
    - 流应该是无序的\n\n为了让流能够利用多个处理器，需要使用并行流。然而，在使用并行流时：\n\n- 注意不利的副作用\n- 避免使用有状态的 lambda\
    \ 表达式\n\n当流的某一个操作修改了应用程序的状态时，流可能会发生副作用。诸如 `println` 方法和可变归约等操作具有副作用。大多数副作用都在流内部处理。然而，当流操作修改了流的源时，就会出现问题。这被称为干扰（interference）。\n\
    \n在下面的示例中，尝试使用 `add` 方法作为谓词操作的一部分来修改原始的 `partsList`：\n\n```java\npartsList.stream().\n\
    \  filter((p)->{\n    partsList.add(p);\n    return p.getWeight()>=3;\n  }).\n\
    \  forEach(p -> System.out.println(p));\n```\n\n![](img/image263.jpg)\n\n当执行该语句时，将产生\
    \ `java.lang.UnsupportedOperationException` 异常。修改另一个列表不会导致异常。\n\n有状态的 lambda 表达式是指其结果依赖于在\
    \ lambda 表达式执行期间可能会改变的状态。例如，以下过滤操作返回的值取决于某些外部条件：\n\n```java\nboolean someCondition\
    \ = …;\n\npartsStream.parallel().\n  filter(p -> {\n    if (someCondition) {\n\
    \      return true;\n    }\n  }).\n  forEach(p -> System.out.println(p));\n```\n\
    \n![](img/image64.jpg)\n\n# 结论\n\n流的元素依赖于一个在 lambda 表达式执行期间可能会改变的状态。例如，以下过滤操作返回的值取决于某些外部条件。流可以以链式方式进行操作。这可以得到一个更自然、简洁的解决方案。当流并行化时，必须确保它能够正常工作。\n\
