    \ in the list.\n\n```java\nList<Integer> list = Arrays.asList(4, 54, 72, 68, 3);\n\
    list.replaceAll(n -> n * 2);\nlist.forEach(n -> System.out.print(n + \" \"));\n\
    ```\n\n![](image380.jpg)\n\nThe new elements are shown:\n8 108 144 136 6\n\nThere\
    \ are two overloaded `replace` methods. The first is `replace(K, V)`.\n\n```java\n\
    replace(K, V)\n```\n\n![](image381.jpg)\n\nThe second is `replace(K, V, V)`. This\
    \ will only replace the mapped element if it already exists. The following illustrates\
    \ how the first version works. A `HashMap` is created and three entries are added.\
    \ The first one misspells the word: *transportation*. The `replace` method is\
