  raw: 'Using the Nashorn JavaScript Engine


    A JavaScript engine is software that interprets JavaScript code. The Nashorn JavaScript
    engine is written in Java and allows JavaScript code to be embedded into Java
    applications. It is the successor to the Rhino JavaScript engine and has better
    memory utilization and performance.


    Many operations are supported by the engine including:


    - Evaluating isolated scripts or complete JavaScript files


    - Invoking script functions


    - Executing Java code from JavaScript


    - Implementing a Java interface with script


    The Nashorn engine is a complex API. Here we will only be providing an overview
    of its capabilities. More detail about the engine can be found at [http://download.java.net/jdk8/docs/technotes/guides/scripting/nashorn/toc.html](http://download.java.net/jdk8/docs/technotes/guides/scripting/nashorn/toc.html).


    Accessing the Nashorn Engine


    In order to use the engine, an instance of the JavaScript engine needs to be created.
    This is accomplished using two classes: ScriptEngineManager and ScriptEngine.
    The ScriptEngineManager class is used to manage the script engines available to
    the Java JVM. An instance of the ScriptEngine class represents the JavaScript
    engine.


    In the following sequence an instance of the JavaScript engine is created. The
    getEngineByName method returns an instance of the engine and the eval method will
    execute an arbitrary JavaScript code. In this example, it determines the length
    of a string. The eval method is enclosed in a try block because a ScriptException
    exception must be handled.


    ScriptEngineManager manager = new ScriptEngineManager();


    ScriptEngine engine = manager.getEngineByName("nashorn");


    try {


    Object result = engine.eval(


    "''Nashorn JavaScript Engine''.length");


    System.out.println(result);


    } catch (ScriptException ex) {…);


    ![](image351.jpg)


    The output of this example will be 25.


    Executing JavaScript Code


    There are several ways of executing JavaScript code in addition to using the eval
    method with a simple string argument. The following defines a JavaScript function,
    sumOfSquares, that returns the sum of the squares of two numbers. We then execute
    the function using the eval method.


    engine.eval("function sumOfSquares(a, b) {


    return a*a + b*b;}");


    System.out.println(engine.eval(


    "sumOfSquares(1, 2);"));


    ![](image352.jpg)


    The output will be 5.0.


    Another approach uses the javax.script.Invocable interface. The engine variable
    can be cast to this interface which allows us to use the interface''s invokeFunction
    method to execute script code as shown below. It produces the same output as the
    previous example.


    Invocable invocable = (Invocable) engine;


    System.out.println(


    invocable.invokeFunction(


    "sumOfSquares", 1, 2));


    ![](image353.jpg)


    We can also evaluate script code found in a file. The following is the contents
    of a file named maximum.js. The function returns the largest number passed to
    it.


    function max() {


    var largest = arguments[0];


    for(var index = 1; index < arguments.length; index++)


    if (arguments[index] > largest) {


    largest = arguments[index];


    }


    return largest;


    }


    ![](image354.jpg)


    A FileReader object is created using this file and then the invokeFunction is
    executed using the max function and a list of parameters passed to the function:


    engine.eval(new FileReader("maximum.js"));


    System.out.println(invocable.invokeFunction(


    "max", 23, 21, 43, -36, 2, 51));


    ![](image355.jpg)


    The output will be 51.


    Executing Java Code from JavaScript


    Embedding Java code within JavaScript is supported through the use of classes
    and interfaces. All references to Java types must normally be fully qualified.
    In the following JavaScript sequence, an instance of the LocalDateTime class is
    used to get and display the current date and time.


    var today = java.time.LocalDateTime.now();


    print(today);


    ![](image356.jpg)


    We can demonstrate this by placing this code sequence into a file called UsingJava.js
    and then invoking it from Java using the following statement:


    engine.eval(new FileReader("UsingJava.js"));


    ![](image357.jpg)


    One possible output follows:


    2014-03-15T14:14:38.410


    Nashorn provides an object called Java that possesses to and from methods. This
    object is used to support conversions between Java and JavaScript. Since the object
    returned by the toArray method is a Java array and not a JavaScript array, it
    *cannot* be displayed properly until it is converted to the correct JavaScript
    object. This is done using the from method.


    In the following sequence a list is created. A Stream object is created from the
    list and the filter, sort, and toArray methods are applied to it in a fluent fashion.
    The filternumber function is used as an argument to the filter method to eliminate
    numbers greater than 10 from being processed further. The Java array is converted
    to a JavaScript array using the from method.


    function filterNumber (n) { return n>10};


    var list = java.util.Arrays.asList(2, 43, 23, 87, 29);


    var result =


    list.stream().filter(filterNumber).sorted().toArray();


    var array = Java.from(result);


    print(array);


    ![](image358.jpg)


    The output of the code sequence follows:


    23,29,43,87


    Nashorn does not automatically import the Java packages because there would be
    a conflict between the Object and String classes found in both languages. However,
    the javaImporter can be used in conjunction with the with statement to simplify
    class references. In the following example, the functionality of the previous
    example is duplicated by creating a variable called ImportedClasses using JavaImporter.
    It is then used in the with statement. This avoids having to provide explicit
    package names for all of the classes.


    var ImportedClasses = new JavaImporter(


    java.time,


    java.util);


    with (ImportedClasses) {


