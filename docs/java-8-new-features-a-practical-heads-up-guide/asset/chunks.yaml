  trans: "\n\n# Drawable 不是函数式接口\n\n在接口 `Drawable` 中未找到抽象方法\n\n在此声明中，该接口包含多个一个抽象方法：\n\
    \n```java\n@FunctionalInterface\ninterface Drawable {\n    public abstract String\
    \ getValue();\n    public abstract boolean hasBeenDrawn ();\n}\n```\n\n![](img/image60.jpg)\n\
    \n生成的错误信息所示：\n\n```\nUnexpected @FunctionalInterface annotation\nDrawable is not\
    \ a functional interface\nmultiple non-overriding abstract methods found in interface\
    \ Drawable\n```\n\n`@FunctionalInterface` 注解不是必须的。如果一个函数式式接口没有使用该注解，编译器仍然会将其视为函数式接口。\n\
    \n# 在函数式接口中重写 Object 类的方法\n\n所有接口都隐式地声明了 `Object` 类方法的抽象方法。在接口中也可以显式地声明来自 `Object`\
    \ 类的抽象方法。这些方法不会计入接口中抽象方法的数量。\n\n例如，尽管 `java.util` 包中的 `Comparator` 接口是一个函数式接口，但它有两个抽象方法：一个\
    \ `compare` 方法以及一个 `equals` 抽象方法。`equals` 方法实际上重写了 `Object` 类的 `equals` 方法。\n\n\
    下面的示例了如何使用 `equals` 方法为 `Drawable` 接口添加第二个抽象方法：\n\n```java\n@FunctionalInterface\n\
    public interface Drawable {\n    public abstract boolean hasBeenDrawn();\n   \
    \ @Override\n    public abstract boolean equals(Object obj);\n}\n```\n\n![](img/image61.jpg)\n\
    \n接口不能作为默认方法（default method）声明 `Object` 类的任何方法。这包括常用的 `equals`、`hashCode` 和 `toString`\
    \ 方法。通常情况下，重写 `Object` 类的方法并不总是好主意，也并非必要。\n\n# 在核心库中使用函数式接口\n\n函数式接口一直是 Java 的一部分，但一直没有显式地称为函数式接口。例如，下面所示\
    \ `ActionListener` 和 `Runnable` 等接口就是函数式接口：\n\n```java\npublic interface ActionListener\
    \ extends EventListener {\n    public void actionPerformed(ActionEvent e);\n}\n\
    \npublic interface Runnable {\n    public abstract void run();\n}\n```\n\n![](img/image62.jpg)\n\
    \nJava 8 添加了许多新的函数式接口。其中几个接口被添加到了新的 `java.util.function` 包中，以满足程序员的常见需求。例如，`Predicate`\
    \ 接口用于支持评估为真或否的测试用例。它的函数方法是 `test`。它有一个泛型参数并返回一个布尔值。\n\n```java\nboolean test(T\
    \ t);\n```\n\n![](img/image63.jpg)\n\n关于这些函数式接口的更详细讨论见第 2 章。\n\n# 总结\n\n在本章中，我们关注了默认方法和函数式接口的使用。默认方法是接口中具有实现的方法。引入此特性是为了允许接口随着时间的推移而增长，而不会破坏接口的现有使用。`default`\
    \ 关键字用于声明此类方法。\n\n随着默认方法的添加，我们必须考虑在单继承和多继承情况下如何处理被重写的默认方法。类的实现优于接口的实现。最派生方法的默认方法优于基础接口的默认实现。\n\
    \n函数式接口是指拥有且仅有一个抽象方法的接口。这些接口用于支持 Lambda 表达式。函数式接口的抽象方法被称为函数方法。该方法关联有一个函数描述，该描述提供了一个与\
    \ Lambda 表达式使用的目标签名。\n\n`@FunctionalInterface` 注解在 Java 8 中添加，用于指示一个接口意图是一个函数式接口。然而，函数式接口并不要求此注解。\n\
    \n在下一章中，我们将检查函数式接口的使用及其与 Lambda 表达式的使用。我们还将探索新的 `java.util.function` 包，该包引入了许多函数式接口。\n\
    \n* * *\n\n# 第 2 章 – Lambda 表达式\n\n## 理解 Lambda 表达式\n### 推断目标的类型\n### 创建 Lambda\
    \ 表达式\n#### Lambda 表达式语法规则\n##### 声明参数类型\n##### 混合参数声明\n##### 省略括号\n##### 消除块语句\n\
    ##### 在 Lambda 表达式体内多语句\n##### 使用返回值\n#### 编写简洁的 Lambda 表达式\n#### 在 Lambda 表达式中捕捉变量\n\
    #### 区分 Lambda 表达式与闭包\n#### 方法和构造方法引用\n##### 使用静态方法引用\n##### 使用实例方法引用\n##### 使用构造方法引用\n\
    ### 使用 Lambda 表达式\n#### 在变量声明中使用 Lambda 表达式\n#### 将 Lambda 表达式作为返回值\n#### 在 Lambda\
    \ 表达式中使用异常\n#### 在三元运算符中使用 Lambda 表达式\n#### 强制转换 Lambda 表达式\n#### 使用 Lambda 表达式初始化数组\n\
    #### 编写递归 Lambda 表达式\n### 使用 java.util.function 函数式接口\n#### 使用 Predicate 接口\n\
    #### 使用 Function 接口\n#### 使用 BiFunction 接口\n#### 使用 Consumer 接口\n#### 使用 Supplier\
    \ 接口\n#### 使用 Operator 类型接口\n#### 使用 UnaryOperator 接口\n#### 使用 BinaryOperator\
    \ 接口\n### 总结\n\nJava 8 添加 Lambda 表达式是向在 Java 应用中使用函数式编程技术的一步。函数式编程导向强调在各种语文中使用简单函数。在许多情况下，使用函数式编程可以产生更好且不易出错的代码。这种编程风格已经与\
    \ Java 的面向对象特性集成在一起。它也反映在核心库的组织方式中。\n\nLambda 结构出现在许多其他编程语言中。人们认为 Java 通过在语言中添加函数式编程方面也能从中益，从而能够使用简洁且优雅的表达式。Lambda\
    \ 表达式还允许将函数作为方法的参数使用。这把代码视为数据。\n\nLambda 表达式消除了在许多情况下使用匿名内部类的需求。使用匿名内部类需要大量的样板代码。久而久之，它们看起来都非常相似，而且通常它们只有一个方法被重写。使用\
    \ Lambda 表达式意味着可以使用更紧凑的代码。此外，它们的使用还避免了在使用 `this` 关键字时可能出现的混淆以及访问非 final 变量的问题。\n\
    \n"
- fmt: "\nIn this chapter, we will show how lambda expressions can be created and\
    \ used in a variety of contexts. Lambda expression syntax variations are fully\
    \ explored so that one can fully understand how they can be written. The concept\
    \ of closure and its relationship to lambda expressions will be discussed. We\
    \ will also see how method and constructor references can be used as lambda expressions.\n\
    \nThe last section of the chapter explores the `java.util.function` package. This\
    \ package contains a number of useful functional interfaces that are used with\
    \ lambda expressions. Understanding these interfaces is especially important when\
    \ they are used with the `Stream` interface.\n\nNote: The mathematician Alonzo\
    \ Church developed the concept of lambda expressions as part of a model of computation.\
    \ He used the Greek letter lambda to represent this abstraction. The name has\
    \ stuck.\n\n# Understanding Lambda Expressions\n\nA lambda expression can be thought\
    \ of as an anonymous function. When we think of a function, a common image of\
    \ a square root function might come to mind. We pass it a number and it returns\
    \ a number.\n\nA guiding force behind lambda expressions is to make these expressions\
    \ as simple to use as possible. What is the simplest form of a function? Well,\
    \ one version of a simple square function follows:\n\n```java\nint square(int\
    \ num) {\n    return num*num;\n}\n```\n\n![](image64.jpg)\n\nIf we ignore the\
    \ data types and leave off the name, we can conceivably write it as:\n\n```java\n\
    num {return num*num;}\n```\n\n![](image65.jpg)\n\nSince we know the function will\
    \ return a value, there is no need for the `return` keyword, at least with this\
    \ function. Also there is no need for a block statement since there is only one\
    \ statement being used. We still need to separate the parameter from the function’s\
    \ body. This can be done using the lambda operator (`->`), sometimes called the\
    \ arrow token, as shown below:\n\n```java\nnum -> num*num\n```\n\n![](image66.jpg)\n\
    \nThis is our lambda expression. It represents a simple way of writing a function.\
    \ Here is another simple lambda expression. This one is passed a single value\
    \ to be displayed and nothing is returned:\n\n```java\nx -> System.out.println(x)\n\
    ```\n\n![](image67.jpg)\n\nWhere do we use a lambda expression? You can use a\
    \ lambda expression anywhere a functional interface is expected. A functional\
    \ interface is an interface that has one and only one abstract method. This method\
    \ is called the functional method. These concepts were discussed in Chapter 1.\n\
    \nTo illustrate, we will use a lambda expression as the argument of the `forEach`\
    \ method. This method expects an instance of the `java.util.function.Consumer`\
    \ functional interface. Its abstract method is the `accept` method which accepts\
    \ an object and returns `void`.\n\nThe `forEach` method has been added to a number\
    \ of interfaces in Java 8 including the `Iterable` interface. Any sub-interfaces\
    \ or implementing classes of the `Iterable` interface will possess this method.\
    \ This includes quite a few interfaces and classes including: `List`, `HashSet`,\
    \ and `Linkedlist`.\n\nIn the following example, a `List` is created based on\
    \ a series of numbers:\n\n```java\nList<Integer> list = Arrays.asList(5,3,4);\n\
    ```\n\n![](image68.jpg)\n\nThe lambda expression is used below to display each\
    \ element of the list:\n\n```java\nlist.forEach((Integer element)->System.out.println(element));\n\
    ```\n\n![](image69.jpg)\n\nThe output of this code sequence follows:\n```\n5\n\
    3\n4\n```\n\nWhat is happening here? When the compiler examines the statement\
    \ it expects an instance of an `Iterable`. However, what it finds is the lambda\
    \ expression. It then tries to convert the lambda expression into the needed object.\
    \ It decides it can do this since only a single argument is passed and nothing\
    \ is returned. It matches the signature of the `accept` method. Since `list` is\
    \ a set of integers, it decides the parameter type should be `Integer`. This process\
    \ is called `target typing` and is discussed in depth in the next section.\n\n\
    You can envision the compiler generating an anonymous inner class implementation\
    \ for the previous example similar to the following:\n\n```java\nlist.forEach(new\
    \ Consumer() {\n    @Override\n    public void accept(Object element) {\n    \
    \    System.out.println(element);\n    }\n});\n```\n\n![](image70.jpg)\n\nHowever,\
    \ a more concise and ultimately more efficient approach uses a lambda expression\
    \ as follows:\n\n```java\nlist.forEach((element)->System.out.println(element));\n\
    ```\n\n![](image71.jpg)\n\nThis implies an object is created. Whether or not this\
    \ actually happens is an implementation issue. It is more useful to think of lambda\
    \ expressions as anonymous functions.\n\nWhile functions and methods are similar,\
    \ a function is not tied to a class. Lambda expressions are conceptually a simple\
    \ concept. However, their syntax can be cryptic until fully understood. They represent\
    \ a powerful new tool to develop Java applications.\n\n# Inferring the Type of\
    \ the Target\n\n`target typing` is the process of inferring the type of an object\
    \ based on the context in which it is being used. We saw this occur in the previous\
    \ example. `Type referencing` occurs when the system determines the type of the\
    \ lambda expression. The type is inferred from the expression. This is possible\
    \ because Java knows the expected parameter type for the functional interface’s\
    \ abstract method.\n\nA lambda expression does not contain information about which\
    \ functional interface it is implementing. The context of the lambda expression\
    \ determines which functional interface it represents. For example, the following\
    \ lambda expression accepts a single value and returns its square:\n\n```java\n\
    x -> x * x\n```\n\n![](image72.jpg)\n\nThe following functional interface definitions\
    \ both have a single abstract method that accepts a single value and returns a\
    \ value:\n\n```java\ninterface IntegerSquare {\n    int square(int x);\n}\n\n\
    interface DoubleSquare {\n    double square(double x);\n}\n```\n\n![](image73.jpg)\n\
    \nHowever, either of the next two assignments will work. We are assigning a lambda\
    \ expression to a functional interface variable, which matches both of the abstract\
    \ method’s signature.\n\n```java\nIntegerSquare intSquare = x -> x * x;\nDoubleSquare\
    \ doubleSquare = x -> x * x;\n```\n\n![](image74.jpg)\n\nHere is a complete example:\n\
    \n```java\npublic class LambdaExamples {\n    public static void main(String[]\
    \ args) {\n        IntegerSquare intSquare = x -> x * x;\n        DoubleSquare\
    \ doubleSquare = x -> x * x;\n        System.out.println(intSquare.square(5));\n\
    \        System.out.println(doubleSquare.square(5));\n    }\n}\n```\n\n![](image75.jpg)\n\
    \nThe output of this sequence follows:\n```\n25\n25.0\n```\n\nLet’s reexamine\
    \ the following statement:\n\n```java\nIntegerSquare intSquare = x -> x * x;\n\
    ```\n\n![](image76.jpg)\n\nThe left-hand side of this expression is an `IntegerSquare`\
    \ and is referred to as the lambda expression’s `target type`. The target type\
    \ is the data type expected in a given context. The target type for a lambda expression\
    \ must be:\n\n- A functional interface\n- Have compatible parameter types as the\
    \ interface’s function descriptor\n- Have a return type compatible with the return\
    \ type of the interface’s function descriptor\n- Throw only those exceptions permitted\
    \ by the function descriptor\n\nAs a reminder, a function descriptor is the method\
    \ type of the functional method. It consists of the parameter types, return type,\
    \ and any exceptions thrown by the method.\n\nWe can also use generic definitions\
    \ of functional interfaces. To illustrate this we will use the `ComputableType`\
    \ interface as shown here:\n\n```java\ninterface ComputableType<T> {\n    T compute(T\
    \ x);\n}\n```\n\n![](image77.jpg)\n\nIn the next example, we declare two variables\
    \ based on this interface. The first is of type `Integer` while the second is\
    \ of type `Double`. The examples illustrate assigning lambda expressions to each\
    \ variable using both implicit and explicit parameter declarations.\n\n```java\n\
    ComputableType<Integer> computableInteger;\ncomputableInteger = (Integer x) ->\
    \ x * x;\ncomputableInteger = (x) -> x * x;\n\nComputableType<Double> computableDouble;\n\
    computableDouble = (Double x) -> x * x;\ncomputableDouble = (x) -> x * x;\n```\n\
    \n![](image78.jpg)\n"
  raw: 'In this chapter, we will show how lambda expressions can be created and used
    in a variety of contexts. Lambda expression syntax variations are fully explored
    so that one can fully understand how they can be written. The concept of closure
    and its relationship to lambda expressions will be discussed. We will also see
    how method and constructor references can be used as lambda expressions.


    The last section of the chapter explores the java.util.function package. This
    package contains a number of useful functional interfaces that are used with lambda
    expressions. Understanding these interfaces is especially important when they
    are used with the Stream interface.


    Note: The mathematician Alonzo Church developed the concept of lambda expressions
    as part of a model of computation. He used the Greek letter lambda to represent
    this abstraction. The name has stuck.


    Understanding Lambda Expressions


    A lambda expression can be thought of as an anonymous function. When we think
    of a function, a common image of a square root function might come to mind. We
    pass it a number and it returns a number.


    A guiding force behind lambda expressions is to make these expressions as simple
    to use as possible. What is the simplest form of a function? Well, one version
    of a simple square function follows:


    int square(int num) {


    return num*num;


    }


    ![](image64.jpg)


    If we ignore the data types and leave off the name, we can conceivably write it
    as:


    num {return num*num;}


    ![](image65.jpg)


    Since we know the function will return a value, there is no need for the return
    keyword, at least with this function. Also there is no need for a block statement
    since there is only one statement being used. We still need to separate the parameter
    from the function’s body. This can be done using the lambda operator (->), sometimes
    called the arrow token, as shown below:


    num -> num*num


    ![](image66.jpg)


    This is our lambda expression. It represents a simple way of writing a function.
    Here is another simple lambda expression. This one is passed a single value to
    be displayed and nothing is returned.


    x -> System.out.println(x)


    ![](image67.jpg)


    Where do we use a lambda expression? You can use a lambda expression anywhere
    a functional interface is expected. A functional interface is an interface that
    has one and only one abstract method. This method is called the functional method.
    These concepts were discussed in Chapter 1.


    To illustrate, we will use a lambda expression as the argument of the forEach
    method. This method expects an instance of the java.util.function.Consumer functional
    interface. Its abstract method is the accept method which accepts an object and
    returns void.


    The forEach method has been added to a number of interfaces in Java 8 including
    the Iterable interface.  Any sub-interfaces or implementing classes of the Iterable
    interface will possess this method. This includes quite a few interfaces and classes
    including: List, HashSet, and Linkedlist.


    In the following example, a List is created based on a series of numbers:


    List<Integer> list = Arrays.asList(5,3,4);


    ![](image68.jpg)


    The lambda expression is used below to display each element of the list:


     list.forEach((Integer element)->System.out.println(element));


    ![](image69.jpg)


    The output of this code sequence follows:


    5


    3


    4


    What is happening here? When the compiler examines the statement it expects an
    instance of an Iterable. However, what it finds is the lambda expression. It then
    tries to convert the lambda expression into the needed object. It decides it can
    do this since only a single argument is passed and nothing is returned. It matches
    the signature of the accept method. Since list is a set of integers, it decides
    the parameter type should be Integer. This process is called target typing and
    is discussed in depth in the next section.


    You can envision the compiler generating an anonymous inner class implementation
    for the previous example similar to the following:


    list.forEach(new Consumer() {


    @Override


    public void accept(Object element) {


    System.out.println(element);


    }


    });


    ![](image70.jpg)


    However, a more concise and ultimately more efficient approach uses a lambda expression
    as follows:


    list.forEach((element)->System.out.println(element));


    ![](image71.jpg)


    This implies an object is created. Whether or not this actually happens is an
    implementation issue. It is more useful to think of lambda expressions as anonymous
    functions.


    While functions and methods are similar, a function is not tied to a class.  Lambda
    expressions are conceptually a simple concept. However, their syntax can be cryptic
    until fully understood. They represent a powerful new tool to develop Java applications.


    Inferring the Type of the Target


    Target typing is the process of inferring the type of an object based on the context
    in which it is being used. We saw this occur in the previous example. Type referencing
    occurs when the system determines the type of the lambda expression. The type
    is inferred from the expression. This is possible because Java knows the expected
    parameter type for the functional interface’s abstract method.


    A lambda expression does not contain information about which functional interface
    it is implementing. The context of the lambda expression determines which functional
    interface it represents. For example, the following lambda expression accepts
    a single value and returns its square:


    x -> x * x


    ![](image72.jpg)


    The following functional interface definitions both have a single abstract method
    that accepts a single value and returns a value:


    interface IntegerSquare {


    int square(int x);


    }


    interface DoubleSquare {


    double square(double x);


    }


    ![](image73.jpg)


    However, either of the next two assignments will work. We are assigning a lambda
    expression to a functional interface variable, which matches both of the abstract
    method’s signature.


    IntegerSquare intSquare = x -> x * x;


    DoubleSquare doubleSquare = x -> x * x;       


    ![](image74.jpg)


    Here is a complete example:


    public class LambdaExpressionExamples {


    public static void main(String[] args) {


    IntegerSquare intSquare = x -> x * x;


    DoubleSquare doubleSquare = x -> x * x;


    System.out.println(intSquare.square(5));


    System.out.println(doubleSquare.square(5));


    }   


    }


    ![](image75.jpg)


    The output of this sequence follows:


    25


    25.0   


    Let’s reexamine the following statement:


    IntegerSquare intSquare = x -> x * x;


    ![](image76.jpg)


    The left-hand side of this expression is an IntegerSquare and is referred to as
    the lambda expression’s target type. The target type is the data type expected
    in a given context. The target type for a lambda expression must be:


    - A functional interface


    - Have compatible parameter types as the interface’s function descriptor


    - Have a return type compatible with the return type of the interface’s function
    descriptor


    - Throw only those exceptions permitted by the function descriptor


    As a reminder, a function descriptor is the method type of the functional method.
    It consists of the parameter types, return type, and any exceptions thrown by
    the method.


    We can also use generic definitions of functional interfaces. To illustrate this
    we will use the ComputableType interface as shown here:


    interface ComputableType<T> {


    T compute(T x);


    }


    ![](image77.jpg)


    In the next example, we declare two variables based on this interface. The first
    is of type Integer while the second is of type Double. The examples illustrate
    assigning lambda expressions to each variable using both implicit and explicit
    parameter declarations.


    ComputableType<Integer> computableInteger;


    computableInteger = (Integer x) -> x * x;


    computableInteger = (x) -> x * x;


    ComputableType<Double> computableDouble;


    computableDouble = (Double x) -> x * x;


    computableDouble = (x) -> x * x;


    ![](image78.jpg)'
