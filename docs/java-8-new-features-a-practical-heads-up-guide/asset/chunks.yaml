    and Person. The Person class implements the MoreDisplayable interface which inherits
    from both the Displayable and the Colorable interfaces. The Displayable and Colorable
    interfaces both inherit from the Drawable interface.


    When the run-time system tries to determine which method to execute, it will choose
    the method in the following order:


    - The immediate class’ method


    - Methods of the base classes (including those of the **Object** class)


    - The most immediate default method of a possible hierarchy of interfaces


    To illustrate these rules we will show various places where the display method
    could be implemented (and the effect the implementation has) when used against
    an instance of the Person class. This is based on the draw method being executed
    against an instance of Person as shown below:


    Person p = new Person();


