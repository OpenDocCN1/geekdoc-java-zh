  raw: 'The following sequence creates two lambda expressions for a BinaryOperator.
    The first lambda expression is for addition and the second one is for subtraction.


    BinaryOperator<Integer> addition = (a, b) -> a + b;


    BinaryOperator<Integer> subtraction = (a, b) -> a - b;


    ![](image193.jpg)


    The operateBinary is passed the lambda expression and acts on the arguments:


    public int operateBinary(int a, int b,


    BinaryOperator<Integer> op) {


    return op.apply(a, b);


    }


    ![](image194.jpg)


    The function is then executed using each lambda expression as shown below:


    System.out.println("40 + 2 = "


    + operateBinary(40, 2, addition));


    System.out.println("20 - 10 = "


    + operateBinary(20, 10, subtraction));


    ![](image195.jpg)


    The output will be as follows:


    40 + 2 = 42


    20 - 10 = 10


    Conclusion


    In this chapter, we have seen how lambda expressions can be used to support a
    functional programming style in Java. Lambda expressions are essentially anonymous
    functions which are used in conjunction with functional interfaces.


    Lambda expressions can be used in a number of different contexts. They can be
    passed and returned from methods. They can be assigned to a variable or an array
    so as to allow them to be reused. Lambda expressions can also be written to support
    recursive algorithms.


    In Java 8, a new package, java.util.function, has been added. This package contains
    a large number of functional interfaces that support common operations such as
    transformations and predicate type operations. We will see further examples of
    the use of lambda expression in subsequent chapters.


    * * * * *


