    Java 8 的一个重要新增是引入了新的日期时间 API，旨在取代现有的 `java.util.Date` 和 `java.util.Calendar` 类。它基于
    Joda (http://joda-time.sourceforge.net/) 的成果，是一个庞大且丰富的 API。该 API 的完整文档可以在 http://download.java.net/jdk8/docs/api/
    找到。


    日期和时间 API 基于 ISO-8601 标准（[`www.iso.org/iso/home/standards/iso8601.htm`](http://www.iso.org/iso/home/standards/iso8601.htm)），该标准使用格列日历，这是全球通的事实日期标准。该标准提供了一种表示日期的方法并能够处理闰年。然而，使用它来表示历史日期是不恰的。`java.time.chrono`
    包中支持其他日历系统。


    协调世界时 (UTC) 是目前正在使用的主要时间标准。它结合了时区，并使用距离经度零度线的 `UTC` 时间偏移量。“基于时间的”（temporal-based）一词是指诸如
    `LocalDate` 和 `ZonedDateTime` 等类，它们反映了表示时间的不同方式。


    组织对 API 的讨论有多种方法。时间可以从人类的角度，通过月份和秒等测量单位来理解。也可以从计算机的角度来理解。这种测量通常是指从 `epoch`（1970
    年 1 月 1 日）开始，以毫秒或纳秒等单位计算时间。该 API 同时支持这两种视角，为开发者提供了根据问题背景选择最合适方法的选择。这两种类型可以被称为人类时间机器机器时间。


    在处理日历中的天数时，通常倾向于使用人类时间。在处理时间持续时间（例如两个事件之间的毫秒数）时，通常倾向于使用机器时间。然而，它也可以用人类时间表示，例如两天之间的差异。


    `instant` 是时间轴上的瞬时点。你可以用它来表示事件，或者至少表示事件发生的时间。它可以被看作事件的时间戳。


    我们还根据活动持续多长时间来讨论时间。Java 8 使用 `Duration` 类来指定以分钟或秒等单位衡量的间隔。`Duration` 可用于范围，例如打开阀所需的时间或动画循环的长度。还有一个
    `Period` 类用于处理以天和月衡量的间隔。


    本章中使用的许多示例依赖于当前的日期和时间。因此，这些示例的输出可能无法反映今天的日期或时间。然而，它们在执行时应该反映当前的当前的日期和时间。


    ## 为什么需要新 API？


    Java 8 之前可用的日期时间类存在许多问题。例如，它们是可变的，这使得它们在跨线程工作时变得困难。它们通常不是类型安全的，并且用于表示单位（如月份）的内部数字使得它们难以处理。此外，在旧的
    Java 日期时间类中支持国际化也非常困难。


    ## 简单示例


    让我们从一个判断某个人当前是否正在上班的示例开始。该工人位于玻利维亚的拉巴斯（La Paz Bolivia），早上 8:00 开始工作，工作 6 小时。我们想从其他地方拨打该个人，但在拨打之前，我们想确保他们安排了工作时间。


    首先，我们需要确定当前时间。我们可以使用 `DateTime` 类，但该类不包含时区信息。因此，我们使用 `ZonedDateTime` 类。它拥有一个 `now`
    方法，返回一个代表我们所在地当前日期和时间的类实例。接下来的代码序列说明了如何实现，然后显示此日期和时间：


    ```

    ZonedDateTime present = ZonedDateTime.now();

    System.out.println(present);

    ```


    ![](img/image265.jpg)


    后续输出使用了 ISO 8601 日期时间表示方案：


    `2014-03-05T19:50:14.613-06:00[America/Chicago]`


    输出字符串以日期开始：2014 年 3 月 3 日。“T” 标记了时间表达式的开始。在这种情况下，它代表下午 7:50 加上 14 分钟 0.613 秒。接下来的序列
    `-06:00` 显示了与 `UTC` 的偏移量。表达式的最后部分列出了括号括起来的时区。


    我们需要表示拉巴斯工人的开始时间和持续时间。为了获得这种表示，我们首先创建一个代表时区的 `ZoneId` 对象。接着使用 `LocalTime` 对象表示开始时间，并使用
    `Duration` 对象表示员工班次的长度。这些对象的创建方式如下：


    ```

    ZoneId timeZone = ZoneId.of("America/La_Paz");

    LocalTime startWorkDay = LocalTime.of(8,0);

    Duration dailyTime = Duration.ofHours(6);

    ```


    ![](img/image266.jpg)


    为了确定员工是否在上班，我们需要一个基于其时区的开始时间和结束时间。创建这两个时间有多种方法。在接下来的代码序列中，我们首先创建一个名为 `employeeDate`
    的 `LocalDate`，用于表示日、月、年值。然后将其与 `startWorkDay` 和 `timeZone` 变量一起使用，创建一个 `ZonedDateTime`
    类型的开始时间。该日期和时间使用 `DateTimeFormatter.ofLocalizedDateTime` 进行显示。


    ```

    LocalDate employeeDate = ...; // 初始化

    ZonedDateTime startTime = ZonedDateTime.of(employeeDate, startWorkDay, timeZone);

    System.out.println(startTime.format(DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG)));

    ```


    ![](img/image267.jpg)


    输出：2014 年 3 月 5 日上午 8:00


    结束时间是通过在开始时间上加上 `dailyTime` 计算出的。


    ```

    ZonedDateTime endTime = startTime.plus(dailyTime.toHours());

    System.out.println("End: " + endTime.format(DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG)));

    ```


    ![](img/image268.jpg)


    输出：2014 年 3 月 5 日下午 2:00


    最后一步是使用 `compareTo` 方法结合开始时间、结束时间和当前时间来判断员工是否在上班。如果指定的时间在目标时间之前，该方法返回负值；如果在目标时间之后，则返回正值。根据这些日期，以下表达式将返回
    false：


    ```

    System.out.println((startTime.compareTo(present) <= 0) && (endTime.compareTo(present)
    >= 0));

    ```


    ![](img/image269.jpg)


    ## ISO-8601 字符串格式


    该格式用于 API 的多个方法。其格式所示：


    `PnDTnHMn.nS`


    字母对应于周期、天、小时、分钟和秒。`n` 代表单位的数量并位于相应符号之前。`T` 必须在使用小时、分钟或秒字段之前。字母不区分大小写。字段可以省略，但必须按照上述顺序出现。分隔秒和字符串第一部分的点可以使用
    0 到 9 位数字。可选的正号或负号可以影响加减。天恰好为 24 小时。表 1 - 周期示例提供了它们如何使用的几个示例。


    ***表 1 - 周期示例***


    | 格式化字符串 | 含义 |

    | :--- | :--- |

    | "P3DT13H5M" | 3 天 13 小时 5 分 |

    | "PT8H" | 8 小时 |

    | "P24D" | 24 天 |

    | "PT15.012S" | 15 秒 12000000 纳秒 |

    | "-P-3H+42M" | +3 小时和 -42 分钟 |


    ![](img/image270.jpg)


