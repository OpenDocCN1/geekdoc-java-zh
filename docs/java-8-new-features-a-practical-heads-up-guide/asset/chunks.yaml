    (x, y) -> x + y


    ![](image93.jpg)


    Also, a single line lambda expression that returns void does not have to be enclosed
    in a block statement.


    Using Multiple Statements in a Lambda Expression Body


    Multiple statements can be used in the body of a lambda expression. To illustrate
    how this is done, we will use the ComputableType interface we declared earlier:


    computable = (x) -> {


    int y = x * x;


    y += x + x;


    return y;


    };


    ![](image94.jpg)


    Using a Return Value


    A block body may return a value or nothing. When a value is returned, the return
