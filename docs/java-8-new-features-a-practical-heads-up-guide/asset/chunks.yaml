    Using the flatmap Method


    The flatMap method is similar to the map method. The map method uses a function
    passed to it, applies that function to each element, and then returns a stream
    of the new elements. Sometimes the returned stream consists of sub-streams. The
    flatMap method performs similarly to the map method except it will “flatten” the
    sub-streams into a single stream.


    The flatMap method will accept a function that is applied to each element generating
    a sub-stream. It will then combine these sub-streams into a single stream.


