    \n![](img/image141.jpg)\n\n### 使用 Predicate 接口\n\n该接口用于测试某些类型的情况，即评估某个函数并返回 true\
    \ 或 false 结果。它的函数描述符是 `test` 方法。向 `test` 函数传递一个参数并返回一个布尔值。\n\n```java\nboolean\
    \ test(T t)\n```\n\n![](img/image142.jpg)\n\n**表 4：Predicate 类型函数式接口**\n\n| 函数式接口\
    \ | 函数方法 |\n| :--- | :--- |\n| `Predicate<T>` | `boolean test(T t)` |\n| `BiPredicate<T,U>`\
    \ | `boolean test(T t, U u)` |\n| `DoublePredicate` | `boolean test(double value)`\
    \ |\n| `IntPredicate` | `boolean test(int value)` |\n| `LongPredicate` | `boolean\
    \ test(long value)` |\n\n![](img/image143.jpg)\n\n在许多需要简单测试的情况下。例如，我们可能想根据一个人的年龄判断其是否有资格参加某些活动。我们可以像下面这样这样一个测试：\n\
    \n```java\npublic boolean evaluate(int age) {\n    if (age > 18) {\n        return\
    \ true;\n    } else {\n        return false;\n    }\n}\n```\n\n![](img/image144.jpg)\n\
    \n我们可以通过如下方式调用 `evaluate` 方法来确定个人是否符合：\n\n```java\nSystem.out.println(\"Person\
    \ is eligible: \" + evaluate(19));\n```\n\n![](img/image145.jpg)\n\n输出将如下：\nPerson\
    \ is eligible: true\n\n如果我们需要更改条件，就需要重写 `evaluate` 函数。不同情况可能还需要需要不同的标准集。例如，我们可能想根据一个人的年龄和体重测试其是否符合兵役条件。在另一种情况下，我们可能想测试某人是否符合社会福利。这些示例暗示需要两个或多个类似\
    \ evaluate 的方法。我们可以通过使用 `Predicate` 函数式接口来简化这一过程。\n\n在下面的代码序列中，声明了一个 `Predicate`\
    \ 并分配了一个 lambda 表达式，该表达式执行与上一个示例相同的测试。这里我们使用了 `Predicate` 函数式接口。\n\n```java\n\
    Predicate<Integer> tester = age -> age > 18;\nSystem.out.println(\"Person is eligible:\
    \ \" + tester.test(19));\n```\n\n![](img/image146.jpg)\n\n结果将与之前的示例相同。下面显示了一个等效版本，它显式地创建了\
    \ `Predicate` 变量：\n\n```java\nPredicate<Integer> tester = age -> age > 18;\nSystem.out.println(\"\
    Person is eligible: \" + tester.test(19));\n```\n\n![](img/image147.jpg)\n\n我们现在对列表使用\
    \ `Predicate`。在下面的示例中，创建了一个列表并用 `Employee` 实例初始化它。\n\n```java\nList<Employee>\
    \ list = Arrays.asList(\n    new Employee(\"Mary\", 23, 12),\n    new Employee(\"\
    Tom\", 32, 12),\n    new Employee(\"Sam\", 19, 5),\n    new Employee(\"Sue\",\
    \ 43, 2)\n);\nPredicate<Integer> tester = age -> age >= 21 && age <= 35;\nfor\
    \ (Employee element : list) {\n    if (tester.test(element.getAge())) {\n    \
    \    System.out.println(element.getName() + \" is eligible\");\n    }\n}\n```\n\
    \n![](img/image149.jpg)\n\n该序列的输出如下：\nMary is eligible\nTom is eligible\n\n接下来的示例说明如何将\
    \ `Predicate` 作为函数的参数。该函数计算列表中符合选择标准的元素之和。\n\n```java\npublic int sumElements(List<Employee>\
    \ numList, Predicate<Integer> predicate) {\n    int sum = 0;\n    for (Employee\
    \ number : numList) {\n        if (predicate.test(number.getAge())) {\n      \
    \      sum += number.getAge();\n        }\n    }\n    return sum;\n}\n```\n\n\
    我们使用以下语句测试该方法：\n\n```java\nSystem.out.println(sumElements(list, age >= 21));\n\
    ```\n\n![](img/image151.jpg)\n\n答案将是 98。\n\n基于此模式，我们可以轻松地使用 lambda 表达式进行其他测试。下面展示了如何根据不同的标准显示员工列表。`displayList`\
    \ 方法接收一个 `List` 和一个用于员工选择的 `Predicate`。只有通过测试的员工会被显示。\n\n```java\npublic void\
    \ displayList(List<Employee> list, Predicate<Employee> function) {\n    for (Employee\
    \ employee : list) {\n        if (function.test(employee)) {\n            System.out.println(employee);\n\
    \        }\n    }\n}\n```\n\n此代码序列说明了该方法的用法：\n\n```java\nPredicate<Employee> condition\
    \ = (Employee e) -> e.getAge() >= 21;\ndisplayList(list, condition);\n```\n\n\
    ![](img/image153.jpg)\n\n该序列的输出如下：\nName: Mary  Age: 23  Pay grade: 12\nName:\
    \ Tom  Age: 32  Pay grade: 12\nName: Sue  Age: 43  Pay grade: 2\n\n我们可以通过使用不同的选择标准轻松地显示不同的列表：\n\
    \n```java\ndisplayList(list, (Employee e) -> e.getPayGrade() < 13 && e.getAge()\
    \ >= 30);\ndisplayList(list, (Employee e) -> e.getName().contains(\"Sue\"));\n\
    ```\n\n`Collection` 接口在 Java 8 中增加了一个方法。该方法将移除集合中所有满足其 `Predicate` 参数的元素。如果删除了元素，则返回\
    \ true，否则返回 false。如果集合的迭代器无法移除元素，则抛出 `UnsupportedOperationException` 异常。\n\n"
