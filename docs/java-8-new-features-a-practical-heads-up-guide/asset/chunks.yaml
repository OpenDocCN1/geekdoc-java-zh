    -Conclusion


    Streams


    A stream can be thought of as a sequence of elements that can be processed on
    an element by element basis. The elements of a stream can be any data type. Streams
    are different from an array or collection in that they are not a data structure.
    They do not occupy permanent memory and are transient in nature.


    The processing of the elements in a stream occurs by executing methods against
    the elements of a stream. A stream chains these method calls together. The output
    of one stream method is fed, or chained, to another method. This is sometimes
    referred to as *fluent chaining*. These methods will perform some operation on
    the stream such as removing some elements from the stream or converting one element
    type to another element type. A stream is essentially a wrapper around a collection
    of objects. Many stream operations use lambda expressions as covered in Chapter
    2.


    Do not confuse the concept of streams with that of input and output streams found
    in the java.io package. These are different concepts. An IO stream is generally
    considered to be a sequence of bytes.


    The java.util.stream package has been added to Java 8\. This package consists
    primarily of interfaces. The Stream interface and the objects implementing this
    interface provide the support for the implementation of streams.


    There are two primary benefits to using streams:


    - They are more succinct than an equivalent collection implementation


    - They have the potential to improve performance by taking advantage of multiple
    processors


    The code used by streams is more succinct than those using older techniques such
    as the iterator approach. The following shows two ways of listing only those parts
    whose price exceeds 0.15\. The first approach uses an iterator and the second
    approach uses a stream. The stream approach is shorter and easier to follow. The
    filter method will remove those elements which do not meet the criteria specified
    by the predicate. Predicates were discussed in Chapter 2\. The forEach method
    will apply the println method against each element.


    // Iterator approach


    List<Part> partsList = ...


    Iterator<Part> partsIterator = partsList.iterator();


    while(partsIterator.hasNext()) {


    Part part = partsIterator.next();


    if(part.getPrice() >= 0.15f) {


    System.out.println(part);


    }


    }


    // Stream approach


    Stream<Part> partsStream = partsList.stream();


    Predicate<Part> pricePredicate = p -> p.getPrice() > 0.15f;


    partsStream.filter(pricePredicate).


    forEach(System.out::println);


    ![](image196.jpg)


    Using a stream instead of a collection means:


    - No need for an explicit declaration of intermediate variables or storage


    - Potential for lazy evaluation


    - More flexibility in design using a more natural style (pipeline)


    - Potential for automatic parallelization


    In the previous example, the iterator approach required declaring temporary variables
    to hold intermediate values. This is not the case for the stream implementation.
    Lazy evaluation will be covered in more depth in Understanding Lazy and Eager
    Evaluation, but it essentially means that a stream is not necessarily forced to
    perform an operation against an element until it needs to.


    In future examples we will see how multiple methods can be applied to the same
    stream in an easy to follow chain of invocations. This approach conforms more
    closely to how solutions to many problems are conceptualized. These types of solutions
    involve a series of operations applied successively to elements of a collection.


    Performance gains are achieved using a parallel stream. This stream will split
    the problem into multiple instances based on the problem and the number of processors
    available. The old iterator approach and sequential streams give about the same
    performance. Parallel streams are normally much faster.


    However, a parallel stream should not be used for small lists as the overhead
    of parallelism will negate any performance gains. Also, it is not always possible
    to simply switch from a sequential stream to a parallel stream. Often factors,
    such as the order the elements are processed in, or whether state information
    is maintained between operations, need to be considered.


    A stream does not support the storage of data. It is a pipeline type of operation
    where data is passed from one operation to the next. They flow as a stream. However,
    it is easy to create arrays or lists from a stream.


    Once a stream processed, it cannot be used again. The stream is said to be consumed.
    Since a stream is not an actual data structure, when we have processed it there
    is nothing left. Any temporary memory that may have been used by a stream is gone.


    Stream Characteristics


    There are several aspects of streams that need to be kept in mind during their
    use. These include:


    - Streams do not store elements


    - Streams can be unbounded


    - Streams do not modify the original source


    - Streams may be ordered


    - Automatic parallelization is possible


    Streams Do Not Store Elements'
