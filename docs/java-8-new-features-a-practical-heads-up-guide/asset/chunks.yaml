    # Using the Duration Class


    The `Duration` class supports getter methods as listed in Table 11 - Duration
    Class get Type Methods.


    ## Table 11 - Duration Class get Type Methods


    | Return Type | Method | Meaning |

    | :--- | :--- | :--- |

    | int | `getNano()` | The number of nanoseconds since the last second |

    | long | `getSeconds()` | The length of the `Duration` in seconds |

    | boolean | `isNegative()` | Returns true if the `Duration` is negative |

    | boolean | `isZero()` | Returns true if the `Duration`’s length is zero |


    ![](image306.jpg)


    In addition, it supports a number of methods that manipulate a `Duration` instance.
    The following demonstrates calculating 2/3 of the time between two dates. The
    `between` method returns the initial duration. The `multipliedBy` and `dividedBy`
    methods compute the fractional part of this duration.


    ```java

    LocalTime time1 = LocalTime.of(10, 30);

    LocalTime time2 = LocalTime.of(11, 45);

    duration = Duration.between(time1, time2).

    multipliedBy(2).

    dividedBy(3);

    System.out.println(duration);

    ```


    ![](image307.jpg)


    The result is shown below:


    `PT50M`


    # Using the Period Class


    The `Period` class is concerned with representing an interval of time in terms
    of years, months, and days. The class takes into account daylight savings time
    when performing operations. It is very similar to the `Duration` class except
    in terms of the fields that it supports.


    The following example shows how to create a `Period` object based on the number
    of days or months:


    ```java

    Period period = Period.ofDays(21);

    System.out.println(period);

    period = Period.ofMonths(3);

    System.out.println(period);

    ```


    ![](image308.jpg)


    The output follows:


    `P21D`


