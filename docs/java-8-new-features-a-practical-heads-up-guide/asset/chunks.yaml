    | `Instant` | `OffsetDateTime atOffset(ZoneOffset offset)`<br>``ZonedDateTime
    atZone(ZoneId zone)` |

    | `LocalDate` | `LocalDateTime atStartOfDay()`<br>``ZonedDateTime atStartOfDay(ZoneId
    zone)`<br>``LocalDateTime atTime(int hour, int minute)`<br>``LocalDateTime atTime(int
    hour, int minute, int second)`<br>``LocalDateTime atTime(int hour, int minute,
    int second, int nanoOfSecond)`<br>``LocalDateTime atTime(LocalTime time)`<br>``OffsetDateTime
    atTime(OffsetTime time)` |

    | `LocalDateTime` | `OffsetDateTime atOffset(ZoneOffset offset)`<br>``ZonedDateTime
    atZone(ZoneId zone)` |

    | `LocalTime` | `LocalDateTime atDate(LocalDate date)`<br>``OffsetTime atOffset(ZoneOffset
    offset)` |

    | `MonthDay` | `LocalDate atYear(int year)` |

    | `OffsetDateTime` | `ZonedDateTime atZoneSameInstant(ZoneId zone)`<br>``ZonedDateTime
    atZoneSimilarLocal(ZoneId zone)` |

    | `OffsetTime` | `OffsetDateTime atDate(LocalDate date)` |

    | `Year` | `LocalDate atDay(int dayOfYear)` |

