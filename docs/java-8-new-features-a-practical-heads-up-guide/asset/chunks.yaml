    \nFunctional interfaces are interfaces that have one, and only one, abstract method.\
    \ These are used to support lambda expressions. The abstract method of a functional\
    \ interface is called the functional method. This method has a function description\
    \ associated with it that provides a target signature used with lambda expression.\n\
    \nThe `@FunctionalInterface` annotation has been added to Java 8 to indicate that\
    \ an interface is intended to be a functional interface. However, a functional\
    \ interface does not require this annotation.\n\nIn the next chapter we examine\
    \ the use of functional interfaces and their use with lambda expressions. We will\
    \ also explore the new `java.util.function` package that introduces a number of\
    \ functional interfaces.\n\n* * * *\n\n# Chapter 2 – Lambda Expressions\n\n##\
    \ Understanding Lambda Expressions\n### Inferring the Type of the Target\n###\
    \ Creating Lambda Expressions\n#### Lambda Expression Syntax Rules\n##### Declaring\
    \ Parameter Types\n##### Mixing Parameter Declarations\n##### Omitting Parentheses\n\
    ##### Eliminating the Block Statement\n##### Using Multiple Statements in a Lambda\
    \ Expression Body\n##### Using a Return Value\n#### Writing Succinct Lambda Expressions\n\
    #### Capturing Variables in a Lambda Expression\n#### Differentiating between\
    \ a Lambda Expression and a Closure\n#### Method and Constructor References\n\
    ##### Using Static Method References\n##### Using Instance Method References\n\
    ##### Using Constructor References\n### Working with Lambda Expressions\n####\
    \ Using Lambda Expressions with Variable Declarations\n#### Using Lambda Expressions\
    \ as a Return Value\n#### Using Exceptions with a Lambda Expression\n#### Using\
    \ Lambda Expressions with the Tertiary Operator\n#### Casting Lambda Expressions\n\
    #### Using Lambda Expressions to Initialize an Array\n#### Writing Recursive Lambda\
    \ Expressions\n### Using the java.util.function Functional Interfaces\n#### Using\
    \ the Predicate Interface\n#### Using the Function Interface\n#### Using the BiFunction\
    \ Interface\n#### Using the Consumer Interface\n#### Using the Supplier Interface\n\
    #### Using Operator Type Interfaces\n#### Using the UnaryOperator Interface\n\
    #### Using the BinaryOperator Interface\n### Conclusion\n\nThe addition of lambda\
    \ expressions to Java 8 is a step toward encouraging the use of function programming\
    \ techniques in Java applications. A functional style programming orientation\
    \ places emphasis on using simple functions in various contexts. The use of function\
    \ programming can result in better and less error prone code in many situations.\
    \ This style of programming has been integrated with the object oriented nature\
    \ of Java. It is also reflected in how core libraries are organized.\n\nLambda\
    \ constructs are found in a number of other programming languages. It was felt\
    \ that Java could also benefit by adding a functional programming aspect to the\
    \ language which enables the use of concise and elegant expressions. Lambda expressions\
    \ also allow a function to be used as a method argument. This treats code as data.\n\
    \nLambda expressions eliminate the need to use anonymous inner classes in many\
    \ situations. There is a lot of boiler plate code used with anonymous inner classes.\
    \ After a while they all seem to look a lot alike, and, typically, they have a\
    \ single method that is being overridden. Using lambda expressions means that\
    \ more compact code can be used. In addition, their use also avoids the confusion\
    \ that can occur when using the `this` keyword and the problems of accessing non-final\
    \ variables.\n\nThe use of lambda expressions helps distinguish between *what*\
    \ should be done versus *how* it is done. The *what* is expressed in the expression\
    \ proper. The *how* is determined in the implementation. This is typified by the\
    \ use of lambda expressions with streams, which can be used to implement the functionality\
    \ in a sequential or concurrent manner. Streams are discussed in Chapter 3.\n\n\
    Multiple core systems are supported by allowing elements of a collection to be\
    \ processed by functions without the developer needing to worry about how to explicitly\
    \ implement concurrent behavior. The `Stream` interface along with the use of\
    \ the `forEach` method, in conjunction with lambda expressions, can take advantage\
    \ of multiple cores.\n\nWhen lambda expressions are compiled, they use the `invokedynamic`\
    \ JVM instruction added to Java 7. As a result, the compiler is able to generate\
    \ shorter byte code sequences. This translates to better performance than equivalent\
    \ code which did not use lambda expressions.\n"
