- fmt: "\n| OffsetTime | No | Yes | No | Yes |\n\n![](image330.jpg)\n\nIn addition\
    \ to these classes, there is also the `ZoneRules` class that specifies a set of\
    \ rules for defining when zone-offset changes occur. This is useful when working\
    \ with daylight savings times.\n\nTime zones are also an important part of most\
    \ calendar systems. To support time zones, the `Date` and `Time` API transparently\
    \ uses the Time-Zone Database (`TZDB`) (`http://www.iana.org/time-zones`). This\
    \ database contains-information about time zones and changes to time zones since\
    \ 1970\\. To correctly determine the time, the current time zone in often needed.\n\
    \n### Obtaining Available Zone IDs\n\nThe zone ids available can be obtained using\
    \ the `ZoneId` class’s `getAvailableZoneIds()` method which returns a `Set`. This\
    \ can be useful if this set, or a subset, needs to be displayed to the user, possibly\
    \ in the form of a drop down combo box.\n\nThe following code sequence uses the\
    \ method to create a set. The contents of the set are then displayed.\n\n```java\n\
    Set<String> zoneIds = ZoneId.getAvailableZoneIds();\n\nfor(String zoneId : zoneIds)\
    \ {\n    System.out.println(zoneId);\n}\n```\n\n![](image331.jpg)\n\nA subset\
    \ of this list is shown below:\n\n- Asia/Aden\n- America/Cuiaba\n- Etc/GMT+9\n\
    - Etc/GMT+8\n- Africa/Nairobi\n- America/Marigot\n- Asia/Aqtau\n- Pacific/Kwajalein\n\
    - …\n\nIf we are interested in obtaining the current `ZoneId`, we should use the\
    \ `ZoneId` class’s `systemDefault()` method as shown below:\n\n```java\nSystem.out.println(ZoneId.systemDefault());\n\
    ```\n\n![](image332.jpg)\n\nOne possible output follows:\n\n- America/Chicago\n\
    \nTo create a `ZoneID` for a specific time zone, we should use the time zone identifier\
    \ as the argument of the `of()` method:\n\n```java\nZoneId zoneId = ZoneId.of(\"\
    Europe/Vienna\");\n```\n\n![](image333.jpg)\n\n### Working with ZoneOffsets\n\n\
    The `ZoneOffset`, `OffsetDateTime`, and `OffsetTime` classes provide a means of\
    \ specifying an offset from the UTC. The `ZoneOffset` class represents an offset\
    \ specified in hours, minutes, or seconds. It does not incorporate a date or time\
    \ element as do the other two classes. The following illustrates, using the `ZoneOffset`\
    \ class, to specify a difference of one hour:\n\n```java\nZoneOffset zoneOffSet\
    \ = ZoneOffset.ofHours(1);\nSystem.out.println(zoneOffSet);\n```\n\n![](image334.jpg)\n\
    \nThe output below shows that only the hour and minutes are used:\n\n`+01:00`\n\
    \nTheThe `OffsetDateTime` class is illustrated here using the current date and\
    \ time obtained using the `now()` method:\n\n```java\nOffsetDateTime offsetDateTime\
    \ = OffsetDateTime.now();\nSystem.out.println(offsetDateTime);\n```\n\n![](image335.jpg)\n\
    \nAs the output below indicates, the date, time, and offset are used. The last\
    \ value, `-5:00`, represents the offset from UTC.\n\n`2014-03-10T16:02:56.751-05:00`\n\
    \nThe next sequence illustrates using the `now()` method with `zoneOffSet` and\
    \ `ZoneId` objects:\n\n```java\noffsetDateTime = OffsetDateTime.now(zoneOffSet);\n\
    System.out.println(offsetDateTime);\n\noffsetDateTime = OffsetDateTime.now(ZoneId.of(\"\
    +03:30\"));\nSystem.out.println(offsetDateTime);\n\noffsetDateTime = OffsetDateTime.now(ZoneId.of(\"\
    -06:30\"));\nSystem.out.println(offsetDateTime);\n```\n\n![](image336.jpg)\n\n\
    The output shows how the time differs by time zone:\n\n- `2014-03-10T22:02:56.784+01:00`\n\
    - `2014-03-11T00:32:56.785+03:30`\n- `2014-03-10T14:32:56.785-06:30`\n\nThe `OffsetTime`\
    \ class uses only time as illustrated below. The `plusHours()` method is one of\
