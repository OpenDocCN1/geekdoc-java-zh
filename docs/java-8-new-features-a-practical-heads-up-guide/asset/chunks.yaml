    Understanding the Importance of Default Methods


    Default methods were introduced for several reasons:


    - Existing code does not have to be updated to implement a new method. This allows
    for interfaces to grow or be extended.


    - To provide additional flexibility in the design of an inheritance hierarchy
    such as:


