    `false`\n`true`\n\n### 使用 findFirst 方法\n\n`findFirst` 方法将返回流的第一个元素。然而，它可能是空的。为了处理这种情况，`findFirst`\
    \ 返回一个可能值的 `Optional` 对象。使用 `isPresent` 方法判断它是否包含值。如果存在，`get` 方法返回该值。\n\n```java\n\
    pricePredicate = p -> p.getPrice() > 0.15;\nOptional<Part> firstPart = partsStream.stream().\n\
    \  filter(pricePredicate).\n  findFirst();\n\nif (firstPart.isPresent()) {\n \
    \ System.out.println(firstPart.get());\n} else {\n  System.out.println(\"No part\
    \ meets the criteria\");\n}\n```\n![](img/image234.jpg)\n\n输出如下：\nName: Pencil\
    \ Weight: 5 Part Number: 100 Price: 0.16 Quantity: 500\n\n### 使用 findAny 方法\n\n\
    `findAny` 方法也返回一个 `Optional` 值。该值可能是空的，也可能是流中的任意元素。所选的元素是不确定的，意味着无法预测。\n\n```java\n\
    Part anyPart = partsStream.stream().\n  filter(pricePredicate).\n  findAny().\n\
    \  get();\nSystem.out.println(anyPart);\n```\n![](img/image235.jpg)\n\n输出可能为：\n\
    Name: Eraser Weight: 3 Part Number: 200 Price: 0.25\n\n### 使用 Optional 类\n\n之前的示例假设\
    \ `Optional` 类有多个方法。其中一个方法 `orElse` 方法为空时返回一个特定对象。在这个示例中，`pricePredicate` 被更改为过滤掉价格小于等于\
    \ 0.3 的零件。对于 `partsStream`，这消除了所有零件。由于 `firstPart` 为空，创建了一个替换零件。\n\n```java\n\
    pricePredicate = p -> p.getPrice() > 0.3;\nOptional<Part> firstPart = partsStream.stream().\n\
    \  map(mapper).\n  filter(pricePredicate).\n  findFirst();\nPart part = firstPart.\n\
    \  orElse(new Part(\"Substitute\", 99999, 10, 1.5f, 50));\nSystem.out.println(part);\n\
    ```\n![](img/image236.jpg)\n\n输出将是替换零件：\nName: Substitute Weight: 10 Part Number:\
    \ 99999 Price: 1.50 Quantity: 50\n\nOptional 类还有一个 `orElseGet` 方法，当 Optional 值为空时返回一个对象。该方法的参数是一个\
    \ `Supplier` 实现。下一个示例使用随机数来返回 `partsList` 中的元素之一。\n\n```java\npricePredicate =\
    \ p -> p.getPrice() > 0.3;\nSupplier<Part> supplier = () -> {\n  Random random\
    \ = new Random();\n  return partsList.get(random.nextInt(partsList.size()));\n\
    };\nPart part = firstPart.orElseGet(supplier);\nSystem.out.println(part);\n```\n\
    ![](img/image237.jpg)\n\n一种可能的输出如下：\nName: Pencil Weight: 5 Part Number: 100 Price:\
    \ 0.16 Quantity: 500\n"
- fmt: "\nAnother potentially useful `Optional` class method is the `orElseThrow`\
    \ method. As the name implies, it will throw an exception if the `Optional` value\
    \ is `null`. The argument of the method should be the exception to throw.\n\n\
    The following illustrates this method where a `PartException` is thrown. The `nextInt`’s\
    \ argument has been set to `200` to increase the likelihood that an exception\
    \ will be thrown. The exception is thrown when the index into `partsList` is too\
    \ large.\n\n```java\nclass PartException extends Exception {\n\n}\n\nSupplier<Part>\
    \ supplier = () -> {\n    Random random = new Random();\n    return partsList.get(random.nextInt(200));\n\
    };\n\ntry {\n    Part part = firstPart.orElseThrow(PartException::new);\n    System.out.println(part);\n\
    } catch (PartException ex) {\n    ex.printStackTrace();\n}\n```\n\n![](image239.jpg)\n\
    \nIf the `get` method’s argument exceeds the size of the `partsList`, the `PartException`\
    \ will be thrown.\n\n## Using the reduce Method\n\nThe `reduce` method, as its\
    \ name implies, will reduce a stream to a single value and returns it as `Optional`.\
    \ There are three overloaded `reduce` methods. We will demonstrate two of these\
    \ methods here.\n\nThe following example uses a `BinaryOperator` to perform the\
    \ reduction. A stream is created from a list of integers. The `reduce` method\
    \ reduces two arguments to their sum. This operation is applied consecutively\
    \ to each element of the stream. The return value is an `Optional`. Its `get`\
    \ method is used to return the effective sum of the elements of the stream.\n\n\
    ```java\nList<Integer> list = Arrays.asList(1, 2, 3, 4);\nOptional<Integer> result\
    \ = list.stream().\n    reduce((n1, n2) -> n1 + n2);\n\nSystem.out.println(result.get());\n\
    ```\n\n![](image240.jpg)\n\nThe output of this sequence will be a `10`.\n\nThe\
    \ next example illustrates the same technique applied to strings. The effect is\
    \ to concatenate the elements together separated by a dash.\n\n```java\nList<String>\
    \ nameList =\nArrays.asList(\"Bob\", \"Carol\", \"Ted\", \"Alice\");\nOptional<String>\
    \ name = nameList.stream().\n    reduce((n1, n2) -> n1 + \"-\" + n2);\n\nSystem.out.println(name.get());\n\
    ```\n\n![](image241.jpg)\n\nThe output of this example follows:\nBob-Carol-Ted-Alice\n\
    \nThe following `reduce` method performs a similar summation operation but is\
    \ based on an initial accumulator value as the first argument of the method. The\
    \ second argument is a `BinaryOperator` that is applied to the elements of the\
    \ stream. The effect of this example is to compute the product of the elements.\n\
    \n```java\nList<Integer> productList = Arrays.asList(1, 2, 3, 4);\nInteger productResult\
    \ = productList.\n    stream().\n    reduce(1, (n1, n2) -> n1 * n2);\n\nSystem.out.println(productResult);\n\
    ```\n\n![](image242.jpg)\n\nIts output will be `24`.\n\n## Using the Collector\
    \ Interface and the collect Method\n\nThe `Collector` interface is an abstract\
    \ version of a `reduce` type operation. The reduction operation results in a mutable\
    \ result. This can be performed in either a sequential or parallel manner. However,\
    \ creating a `Collector` can be difficult. This task is made easier by the `java.util.stream.Collectors`\
    \ class. It is a utility class whose methods return `Collector` objects and supports\
    \ a number of reduction type operations.\n\nThe `Stream` interface’s `collect`\
    \ method is useful when the elements of a stream need to be placed into a `Collection`,\
    \ `Map`, or `String`. It frequently uses an instance of the `Collector` interface\
    \ to gather elements of a stream.\n\nThere are two overloaded `collect` methods\
    \ available. The first accepts a `Collector` and the second accepts three arguments:\
    \ a `Supplier` and two `BiConsumer` objects. Let’s examine the use of a `Collector`\
    \ first.\n\nIn this example, a stream of `Parts` is created. The `map` method\
    \ is used to obtain the name of each part. This is followed by the use of the\
    \ `Collectors` utility class’s `toList` method to create the actual list. The\
    \ list is then assigned to the `partList` variable.\n\n```java\nList<Part> partsList\
    \ = Arrays.asList(\n    new Part(\"Pencil\", 100, 5, 0.15f, 500),\n    new Part(\"\
    Eraser\", 200, 3, 0.25f, 250),\n    new Part(\"Pen\", 500, 3, 0.35f, 350),\n \
    \   new Part(\"Paper\", 2000, 1, 0.03f, 1200)\n);\n\nStream<Part> partsStream\
    \ = partsList.stream();\nList<String> partList =\npartsStream.\n    map(Part::getName).\n\
    \    collect(Collectors.toList());\n\nfor (String element : partList) {\n    System.out.println(element);\n\
    }\n```\n\n![](image243.jpg)\n\nThe output of this sequence will appear as shown\
    \ below:\nPencil\nEraser\nPen\nPaper\n\nAnother use of the `Collectors` class\
    \ is to generate a set of values. In the following example a `TreeSet` of strings\
    \ are created based on the name of the part.\n\n```java\npartsStream = partsList.stream();\n\
    TreeSet<String> partTree =\npartsStream.\n    map(Part::getName).\n    collect(Collectors.toCollection(TreeSet::new));\n\
    \npartTree.stream().forEach(p -> System.out.println(p));\n```\n\n![](image244.jpg)\n\
    \nThe output of this sequence follows:\nEraser\nPaper\nPen\nPencil\n\nThe creation\
    \ and use of a `Map` is shown below. A map of a list of parts grouped by their\
    \ weights is created.\n\n```java\npartsStream = partsList.stream();\nMap<Integer,List<Part>>\
    \ partMap = partsStream.\n    collect(Collectors.groupingBy(Part::getWeight));\n\
    \nif(partMap.containsKey(3)) {\n    partMap.get(3).forEach(p->System.out.println(p));\n\
    }\n```\n![](image245.jpg)\n\n## Using the Collectors Class\n\nThe `Collectors`\
    \ class possesses a number of useful methods for creating `Collector` objects.\
    \ The types of operations include:\n- Averaging primitives\n- Counting the number\
    \ of elements in a stream\n- Joining elements into a string\n- Mapping the element\
    \ of a stream\n- Partitioning a stream into map\n- Reducing elements of a stream\n\
    - Summing the elements of a stream\n\n## Using the iterator Method\n\nThe `iterator`\
    \ method is found in `Stream` interface’s `BaseStream`. Its intent is to provide\
    \ a way of obtaining an `Iterator` object that can be used to iterate through\
    \ the stream. This should not normally be needed as `Stream` interface’s methods\
    \ provide better support than the older approach.\n\nThe following example illustrates\
    \ how the method can be used with a stream of integers. The first part shows the\
    \ use of the `iterator` method and uses it to display the elements of the list\
    \ in a `while` loop. The last statements demonstrate how much easier it is to\
    \ use `forEach` method to achieve the same result.\n\n```java\nList<Integer> numbers\
    \ = Arrays.asList(10,20,30,40);\nStream<Integer> numberStream = numbers.stream();\n\
    Iterator iterator = numberStream.iterator();\n\nwhile(iterator.hasNext()) {\n\
    \    System.out.println(iterator.next());\n}\n\nnumberStream = numbers.stream();\n\
    numberStream.forEach(n -> System.out.print(n + \" \"));\n```\n\n![](image246.jpg)\n\
    \nThe output of both techniques is identical and is shown below:\n10 20 30 40\n\
    \n## Using the sorted Method\n\nThe `sorted` method will return a stream that\
    \ is sorted. There are two overloaded `sorted` methods. If the stream executed\
    \ against the element type supports a natural order, the `sorted` method with\
    \ no arguments can be used. For example, as shown below, a list of numbers is\
    \ created, sorted, and then displayed:\n\n```java\nList<Integer> numberList =\
    \ Arrays.asList(23, 54, 12, 5, 24);\nnumberList.stream().\n    sorted().\n   \
    \ forEach(n -> System.out.print(n + \" \"));\n```\n\n![](image247.jpg)\n\nThe\
    \ output is as follows:\n5 12 23 24 54\n\nIf, however, the element does not have\
    \ a natural order, or a different comparison technique is desired, then the second\
    \ overloaded `sorted` method can be used as shown below. This method takes a `Comparator`\
    \ as its argument. In this example the parts are sorted by name in ascending order.\n\
    \n```java\nStream<Part> partsStream = partsList.stream();\nComparator<Part> partComparator\
    \ = Comparator.comparing(Part::getName);\n```\n"
