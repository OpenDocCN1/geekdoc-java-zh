    Resolving Overridden Default Methods


    When a default method is overridden in multiple places in a hierarchy, the run-time
    system needs to determine which method to use. A set of rules are used to resolve
    which method to use. To illustrate these rules we will use Figure 4: Resolving
    Overridden Default Methods that demonstrates single and multiple inheritance between
    interfaces and single inheritance between classes:


    ![](image32.jpg)


