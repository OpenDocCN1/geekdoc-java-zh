  raw: 'There are numerous methods for creating an Instant. Many of these are static
    methods found in the Instant class. The time represented by an instant has nanosecond
    precision and is supported internally with two long values.


    We can use the Clock’s instant method to create an Instant object:


    Clock clock = Clock.systemDefaultZone();


    System.out.println(clock.instant());


    ![](image291.jpg)


    The output follows:


    2014-03-10T17:48:38.307Z


    We can also use the Instant class’ static now method to create an instant based
    on the current UTC time zone as determined by the system clock. This is illustrated
    below:


    Instant now = Instant.now();


    System.out.println(now);


    ![](image292.jpg)


    The output of this sequence may appear as follows:


    2014-03-02T16:00:14.929Z


    Creating an Instant Based on the Epoch


    We may need to create an Instant from the epoch to mark an event along the machine
    timeline. There are three methods that produce an Instant based on the time elapsed
    from the epoch. They differ in their arguments and the resulting accuracy of the
    Instant object produced.


    ***Table 6 – An Instant based on the Epoch***


    Method | **Arguments** | Meaning of Argument


    ofEpochSecond | **long epochSecond** | Number of seconds from epoch


    ofEpochSecond | **long epochSecond, long nanoAdjustment** | Number of seconds
    from epoch with a nanosecond adjustment


    ofEpochMilli | **long** **epochMilli** | Number of milliseconds from epoch


    ![](image293.jpg)


    The following illustrates creating an instant that is 500,000,000 milliseconds
    after the epoch


    Instant instant = Instant.ofEpochMilli(500000000);


    System.out.println(instant);


    ![](image294.jpg)


    The output follows:


    1970-01-06T18:53:20Z


    Creating an Instant Based on Parsing a UTC String


    There is also a parse method which takes a UTC string argument representing a
    point in time. An exception is thrown if the string is not valid (DateTimeParseException).
    This convenience method is human friendly.


    The following illustrates how this method is used to create an instant based on
    the date and time of January 1, 2010:


    instant = Instant.parse("2010-01-01T00:00:00.000Z");


    System.out.println(instant);


    ![](image295.jpg)


    The output will be:


    2010-01-01T00:00:00Z


    Creating an Instant by Adding or Subtracting a Time from an Instant


    There are a series of plus and minus type methods that execute against an Instant
    object. These either add or subtract an increment using the Instant and then return
    a new Instant object reflecting this time. The unit added or subtracted can be
    a second, millisecond, nanosecond or a TemporalAmount. A TemporalAmount, as its
    name implies, is the number of time units such as seconds.


    The following code sequence illustrates adding 3600 seconds (1 hour) and then
    subtracting 500 milliseconds from that time. The example also shows how fluent
    programming is supported. The chained methods are easy to read and understand.


    instant = Instant.now()


    .plusSeconds(3600)


    .minusMillis(500);


    System.out.println(instant);


    ![](image296.jpg)


    The output follows:


    2014-03-02T17:57:57.758Z


    Using the Instant Class’ get Type Methods


    The Instant class has several getter methods. These methods return various types
    of information such as the number of seconds relative to the epoch or whether
    an instant occurs before or after the epoch. These methods are summarized in Table
    7 - Instant Getter Methods.


    The following illustrates these methods:


    Instant now = Instant.now();


    System.out.println(now.getEpochSecond());


    System.out.println(now.getNano());


    System.out.println(now.isAfter(Instant.EPOCH));


    System.out.println(now.isBefore(Instant.EPOCH));


    ![](image297.jpg)


    One possible output follows. The value returned by the getNano method returns
    the number of nanoseconds from the last second and not from the epoch.


    1393776014


    929000000


    true


    false


    Table 7 - Instant Getter Methods


    **Return Type |** Method **| Meaning**


    **long |** getEpochSecond() **| The number of seconds, positive or negative, relative
    to the epoch**


    **int |** getNano() **| The number of nanoseconds since the last second.**


    **boolean |** isAfter(Instant otherInstant) **| Returns true if the Instant it
    is applied against comes after other Instant**


    **boolean |** isBefore(Instant otherInstant) **| Returns true if the Instant it
    is applied against comes before other Instant**


    ![](image298.jpg)


    Working with Time Intervals


    The Duration class represents an amount of time in terms of days, hours, minutes,
    seconds and nanoseconds. It possesses static methods to return a Duration object
    specified in days and hours. However, days are always considered to be exactly
    24 hours in length. This may not be adequate when dealing with durations where
    daylight savings time is important. In this case, the Period class is a better
    choice.


    The Period class provides a more human oriented way of expressing a time interval.
    The Period class represents time in terms of years, months, and days. This class
    takes into account daylight savings time when performing operations.


    Creating Offsets Using the of Type Methods


    A series of overloaded of type methods provides a convenient way of creating durations.
    They use different units of time as listed in Table 8 - Duration of Methods Summary.
    The Duration class has one constant, ZERO. It represents a duration of zero.


    ***Table 8 - Duration of Methods Summary***


    **Method |** Arguments **| Units**


    **of |** long amount, TemporalUnit unit **| The specified unit**


    **ofDays |** long days **| Days**


    **ofHours |** long hours **| Hours**


    **ofMillis |** long millis **| Milliseconds**


    **ofMinutes |** long minutes **| Minutes**


    **ofNanos  |** long nanos **| Nanoseconds**


    **ofSeconds |** long seconds **| Seconds**


    **ofSeconds |** long seconds, long nanoAdjustment **| Seconds adjustment with
    nanoseconds**


    ![](image299.jpg)


    The following illustrates the creation of several different Duration objects using
    these methods:


    duration = Duration.ofSeconds(120);


    System.out.println(duration);


    duration = Duration.ofMinutes(30);


    System.out.println(duration);


    duration = Duration.ofHours(5);


    System.out.println(duration);


    ![](image300.jpg)


    The output is shown below and uses the ISO-8601 formatted string representation
    of the duration as discussed in The ISO-8601 String Format section. The letters
    correspond to Period, Time, Minutes, and Hours.


    PT2M


    PT30M


    PT5H


    Creating Offsets Using the with Type Methods


    A duration can also be created using either of two with type methods: withNanos
    and withSeconds. The following illustrates the creation of a duration of 35 seconds:


    duration = Duration.ofMinutes(30).withSeconds(35);


    System.out.println(duration);


    ![](image301.jpg)


    The resulting duration is as follows:


    PT35S


    Creating a Duration Using the parse Method


    The parse method is passed an ISO-8601 formatted string. The following illustrates
    the method using a duration of 3 days, 13 hours and 5 minutes:


    duration = Duration.parse("P3DT13H5M");


    System.out.println(duration);


    System.out.println(duration.getSeconds());


    ![](image302.jpg)


    The output shown below echoes the parse string and uses the getSeconds method
    to return the duration in seconds:


    PT85H5M


    306300


    Creating a Duration by Adding or Subtracting a Unit


    There are a series of methods that add or subtract a unit from a duration. Since
    the Duration object is immutable, the return value is a new Duration object. Table
    9 - Duration minus Method Summary and Table 10 - Duration add Method Summary summarizes
    these methods.


    ***Table 9 - Duration minus Method Summary***


    **Method |** Argument


    **minus |** Duration duration


    **minus |** long amountToSubtract, TemporalUnit unit


    **minusDays |** long daysToSubtract


    **minusHours |** long hoursToSubtract


    **minusMillis |** long millisToSubtract


    **minusMinutes |** long minutesToSubtract


    **minusNanos |** long nanosToSubtract


    **minusSeconds |** long secondsToSubtract


    **subtractFrom |** Temporal temporal


