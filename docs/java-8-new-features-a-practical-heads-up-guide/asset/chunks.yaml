    \ the number of nanoseconds from the last second and not from the epoch.\n\n```\n\
    1393776014\n929000000\ntrue\nfalse\n```\n\nTable 7 - Instant Getter Methods\n\n\
    | Return Type | Method | Meaning |\n| :--- | :--- | :--- |\n| `long` | `getEpochSecond()`\
    \ | The number of seconds, positive or negative, relative to the epoch |\n| `int`\
    \ | `getNano()` | The number of nanoseconds since the last second. |\n| `boolean`\
    \ | `isAfter(Instant otherInstant)` | Returns true if the `Instant` it is applied\
    \ against comes after `otherInstant` |\n| `boolean` | `isBefore(Instant otherInstant)`\
    \ | Returns true if the `Instant` it is applied against comes before `otherInstant`\
    \ |\n\n![](image298.jpg)\n\n### Working with Time Intervals\n\nThe `Duration`\
    \ class represents an amount of time in terms of days, hours, minutes, seconds\
    \ and nanoseconds. It possesses static methods to return a `Duration` object specified\
    \ in days and hours. However, days are always considered to be exactly 24 hours\
