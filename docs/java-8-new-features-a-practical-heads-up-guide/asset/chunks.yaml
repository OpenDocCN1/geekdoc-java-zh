    and classes. While an abstract method is obvious from its lack of a body, and
    an abstract class is obvious from the presence of abstract methods, the use of
    these keywords clarifies the intent. For example, the abstract keyword is not
    required to declare an abstract method in an interface. We could have declared
    the previous abstract method as follows:


    public interface Drawable {


