    }\n```\n\n![](img/image367.jpg)\n\n# 使用 Files 类的 walk 方法\n\n`walk` 方法允许我们处理目录及其子目录中的文件。在这个示例中，我们只列出当前目录或其子目录中的\
    \ XML 文件：\n\n```java\nFiles.walk(new File(\".\").toPath())\n    .filter(p -> \"\
    xml\".equalsIgnoreCase(\n    getExtension(getFileName(p))))\n    .forEach(System.out::println);\n\
    ```\n\n![](img/image368.jpg)\n\n一种可能的输出如下：\n.\\build.xml\n.\\nbproject\\build-impl.xml\n\
    .\\nbproject\\private\\private.xml\n.\\nbproject\\project.xml\n\n# 使用 Path 类的\
    \ lines 方法\n\n`Path` 类的静态方法 `lines` 将根据文件内容返回一个字符串流。文件的每一行都作为单个字符串返回并添加到流中。让我们从一个名为\
    \ `data.txt` 的文件开始，其中包含以下数据：\n\nThe old stream flowed\nfrom the mountain maintaining\n\
    its ever meandering course\n\n以下代码序列说明了如何对该文件使用 `lines` 方法。创建一个表示该文件的 `Path` 对象。`lines`\
    \ 方法使用此路径并返回一个输入行的流。然后显示这些行。\n\n```java\ntry {\n    Path path = FileSystems.getDefault().getPath(\"\
    data.txt\");\n    Stream<String> input = Files.lines(path);\n    input.forEach(System.out::println);\n\
    } catch (IOException ex) {\n    ex.printStackTrace();\n}\n```\n\n![](img/image369.jpg)\n\
    \n输出为：\nThe old stream flowed\nfrom the mountain maintaining\nits meandering course\n\
    \n# 并发增强\n\nJava 8 引入了许多并发增强。最显著的是支持并行流（在第 3 章中讨论）。`java.util.Arrays` 类也引入了对数组元素的并行操作。对于并行流，许多方法被引入。\n\
    \n# 使用 Arrays 类的 parallelSort 方法\n\n`parallelSort` 方法以并发方式对数组元素排序。对于所有原始数据类型和泛型对象都有这种重载方法。`parallelSort`\
    \ 会将数组划分为子数组，然后在专用处理器上进行排序。然后排序后的子数组将重新组合。取决于数组的大小，并行排序可能比顺序排序更快。如果数组未达到特定阈值，它将回退到顺序排序。\n\
    \n```java\nint[] largeArray = new int[10000];\nRandom random = new Random();\n\
    for (int i = 0; i < 10000; i++) {\n    largeArray[i] = random.nextInt(1000);\n\
    }\nArrays.parallelSort(largeArray);\nfor (int i = 0; i < 10; i++) {\n    System.out.println(largeArray[i]);\n\
    }\n```\n\n![](img/image370.jpg)\n\n假设生成了至少 10 个零，代码序列的输出应该是前 10 个零。\n\n# 使用 Arrays\
    \ 类的 parallelSetAll 方法\n\n多个静态 `parallelSetAll` 方法对数组的每个元素应用操作。**表 1 - parallelSetAll\
    \ 方法** 列出了这些方法。\n\n***表 1 - parallelSetAll 方法***\n\nparallelSetAll 方法\n`void parallelSetAll(double[]\
    \ array IntToDoubleFunction generator)`\n`void parallelSetAll(int[] array IntUnaryOperator\
    \ generator)`\n`void parallelSetAll(long[] array IntToLongFunction generator)`\n\
    `<T> void parallelSetAll(T[] array IntFunction<? extends T> generator)`\n\n![](img/image371.jpg)\n\
    \n在以下示例中，数组的每个元素都被设置为 1。第一个参数是数组。第二个参数是实现 `IntUnaryOperator` 接口的 lambda 表达式。返回值分配给数组的该元素。\n\
    \n```java\nint[] numbers = new int[25000];\nArrays.parallelSetAll(numbers, p ->\
    \ 1);\n```\n\n![](img/image372.jpg)\n\n在这个示例中，每个元素被设置为索引的二倍：\n\n```java\nArrays.parallelSetAll(numbers,\
    \ p -> 2 * p);\n```\n\n![](img/image373.jpg)\n\n# 使用 Arrays 类的 parallelPrefix\
    \ 方法\n\n重载的 `parallelPrefix` 方法通过对元素应用二元运算符来处理每个元素，执行累积操作。这些方法列在表 2 - parallelPrefix\
    \ 方法中。\n\n***表 2 - parallelPrefix 方法***\n\nparallelPrefix 方法\n`void parallelPrefix(double[]\
    \ array DoubleBinaryOperator op)`\n\n"
