    | Class | Date | Time | Usage |

    | :--- | :--- | :--- | :--- |

    | `LocalDate` | Yes | No | Represents a date. The primary fields are year, month,
    and day. Other fields can be accessed such as day-of-week and day-of-year. |

    | `LocalTime` | No | Yes | Represents time and typically viewed as a combination
    of an hour, minute and second. A nanosecond component is also supported. |

    | `LocalDateTime` | Yes | Yes | Represents a date and time. The class possesses
    methods to return individual parts of the date and time such as the day or hour.
    |

    | `YearMonth` | Yes | No | Supports only a month and a year field |

    | `MonthDay` | Yes | No | Supports only a month and a day |

