    \ {\n    @Override\n    public default void draw() {\n        Displayable.super.draw();\n\
    \        Colorable.super.draw();\n    }\n}\n```\n\n![](image25.jpg)\n\nThe best\
    \ solution is dependent on the needs of the application.\n\n# Understanding Diamond\
    \ Inheritance Works\n\nDiamond inheritance occurs when one interface is the base\
    \ interface for two other interfaces and a fourth interface is then derived from\
    \ these two interfaces. Figure 3: Diamond Inheritance illustrates this situation\
    \ where the `Drawable` interface serves as the base interface for the `Displayable`\
