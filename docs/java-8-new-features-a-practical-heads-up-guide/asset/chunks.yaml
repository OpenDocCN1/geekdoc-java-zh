    \nFigure 2: Multiple Inheritance between Interfaces\n\nThe first two interfaces\
    \ are shown below:\n\n```java\npublic interface Displayable extends Drawable {\n\
    \    @Override\n    default void draw(){\n        System.out.println(\n      \
    \      \"The Displayable interface's draw method\"\n        );\n    }\n}\n\npublic\
    \ interface Colorable {\n    public default void draw(){\n        System.out.println(\n\
    \            \"The Colorable interface's draw method\"\n        );\n    }    \n\
    }\n```\n\n![](image20.jpg)\n\nA definition of the `MoreDisplayable` interface\
    \ that extends both the `Displayable` and the `Colorable` interface is shown below.\
