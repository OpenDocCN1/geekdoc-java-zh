    # Using the `YearMonth`, `MonthDay`, and `Year` Classes\n\nThese classes support\
    \ limited date information as their names imply. Since they have similar methods\
    \ we will focus on the `MonthDay` class.\n\nThe `MonthDay` class represents a\
    \ month and day combination such as August 4. It is immutable and possesses a\
    \ number of methods to compare or otherwise use instances of this class. It does\
    \ not contain information regarding the year or time zone.\n\nThis class is useful\
    \ when we only need information about a month and day of the month. There are\
    \ several static methods used to create instances of `MonthDay`. They include\
    \ overloaded versions of `now()`, `of()`, and `parse()`. Several of these are\
    \ illustrated below. With the exception of the first declaration using the `now`\
    \ method, these will all create a `MonthDay` object that represents August 4.\n\
    \n```java\nMonthDay monthDay = MonthDay.now();\nmonthDay = MonthDay.of(8, 4);\n\
    monthDay = MonthDay.of(Month.AUGUST, 4);\nmonthDay = MonthDay.parse(\"--08-04\"\
    );\n```\n\n![](image317.jpg)\n\nThe `parse()` method requires a string formatted\
    \ as “--MM-dd”. If not, it will throw a `java.time.format.DateTimeParseException`\
    \ exception.\n\nA `MonthDay` object can also be created using `with` type methods\
    \ as illustrated below. This will create a new `MonthDay` object that is the copy\
    \ of the first one but the month has been changed to April. The `withMonth()`\
    \ version has the same effect.\n\n```java\nmonthDay = MonthDay.now();\nmonthDay\
    \ = monthDay.with(Month.APRIL);\nmonthDay = monthDay.withMonth(4);\n```\n\n![](image318.jpg)\n\
    \nThe day can be altered using the `withDayOfMonth()` method in a similar fashion.\n\
    \nWe can create a `LocalDate` from a `MonthDay` instance using the `atYear()`\
    \ method as shown below:\n\n```java\nLocalDate date = monthDay.atYear(2014);\n\
    ```\n\n![](image319.jpg)\n\nBe careful when using `MonthDay` objects. A `MonthDay`\
    \ of February 29 is considered to be valid. Whether it is actually valid is dependent\
    \ on the year. However, a date of February 30 is invalid. A minimum check of possible\
    \ date ranges is checked when specifying the month.\n\nThe `isValidYear()` method\
    \ can be used to determine if a `MonthDay` instance is valid for a specific year.\
    \ In the next example, a `MonthDay` object is created for February 29. It is then\
    \ tested against the years 2012 and 2014.\n\n```java\nmonthDay = MonthDay.of(2,\
    \ 29);\nSystem.out.println(monthDay.isValidYear(2012));\nSystem.out.println(monthDay.isValidYear(2014));\n\
    ```\n\n![](image320.jpg)\n\nThe results will be true for 2012 but false for 2014.\n\
    \n# Comparing `MonthDay` Instances\n\nThe `compareTo()` method returns an integer\
    \ indicating the relationship between two `MonthDay` instances. A negative value\
    \ is returned if the date the method is executing against precedes its date argument,\
    \ a zero if they are equal, and a positive number if its argument follows the\
