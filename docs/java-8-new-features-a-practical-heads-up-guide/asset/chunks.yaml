    ### Understanding minus Type Methods


    The `minus` type methods all return the same type of class that they execute against.
    The object returned is a new object that is based on the original object where
    a unit of time has been subtracted. The methods supported are dependent on the
    class. The `minus` Type Methods section in Appendix A provides a list of `minus`
    type methods that are available.


    In this example, one day is subtracted from `localDate`:


    ```java

    LocalDate localDate = LocalDate.of(2014, 3, 6);

    LocalDate previousDay = localDate.minusDays(1);

    ```


    ![](image280.jpg)


    ### Understanding the to Type Methods


    These types of methods are transformational in nature. They return different types
    depending on their purpose. The `to` Type Methods section in Appendix A provides
    a list of `to` type methods that are available.


    In this example, the number of days from the epoch is calculated based on the
    `localDate`:


    ```java

    LocalDate localDate = LocalDate.of(2014, 3, 6);

    System.out.println(localDate.toEpochDay());

    ```


    ![](image281.jpg)


    The output will be `16135`. This means that the date occurs `16135` days after
    the epoch.


    ### Understanding the at Type Methods


    The `at` type methods perform a transformation of one type to another using the
    provided arguments. The methods are specific to the class. The `at` Type Methods
    section in Appendix A provides a list of `at` type methods that are available.


    In the following code sequence the start of the day is calculated and returned:


    ```java

    LocalDate localDate = LocalDate.of(2014, 3, 6);

    System.out.println(localDate.atStartOfDay());

    ```


    ![](image282.jpg)


    The output shown below indicates a time of midnight (“T00:00”):


    `2014-03-06T00:00`


    # Overview of the Date and Time Packages


    Table 3 - Date and Time Packages Overview summarizes the date and time packages
    introduced to Java 8. The classes of the API are summarized in Table 4 - Date
    and Time Class Overview. They are organized by their type to provide an overview
    of what is available and how instances of the class can be used.


    **Table 3 - Date and Time Packages Overview**


    | Package | Description |

    | :--- | :--- |

    | `java.time` | Many of the commonly used classes for date and time are found
    here. They are all immutable. |

    | `java.time.chrono` | This package supports non-Gregorian and user-designed calendar
    systems |

    | `java.time.format` | This package support the formatting and parsing of date
    and time information |

    | `java.time.temporal` | Intended to be used by framework and library writers
    |

    | `java.time.zone` | Deals with time zones |


    ![](image283.jpg)


    **Table 4 - Date and Time Class Overview**


    | Category | Class | Use |

    | :--- | :--- | :--- |

    | General | `Clock` | Provides access to the current date, time, and time zone
    |

    | General | `Instant` | A point in time in terms of milliseconds |

    | Dates and Time | `LocalDate` | Provides access to a date without time |

    | Dates and Time | `LocalDateTime` | Provides access to a date and time |

    | Dates and Time | `LocalTime` | Provides access to a time without a date |

    | Dates and Time | `OffsetDateTime` | Offsets using date and time units |

    | Dates and Time | `OffsetTime` | Offset using time units |

    | Dates and Time | `Year` | Represents a year |

    | Dates and Time | `YearMonth` | Represents a year and month |

    | Duration and Periods | `Duration` | Measurement of a period of time in nanoseconds
    |

    | Duration and Periods | `Period` | Measurement of a period of time in easier
    to use units |

    | Time Zone Related | `ZonedDateTime` | Date and time with a time zone |

    | Time Zone Related | `ZoneId` | Represents a time zone |

    | Time Zone Related | `ZoneOffset` | Represents a time zone as an offset from
    UTC |

    | Enumerations | `Month` | Represents the months of the year: January through
    December |

    | Enumerations | `DayOfWeek` | Represents the 7 days of the week: Monday through
    Sunday |


    ![](image284.jpg)


    ### Getting the Current Time


    The current time is represented by an instance of the `Clock` class. This class
    is used to create a time or date based on a time zone. It is an abstract class
    that allows alternative clocks to be used instead of the system clock. Many date
    and time classes possess a `now` method that uses the system clock along with
    the current time zone to create an instant.


    This class can be used to get a date or time in the future. This can be useful
    when testing an application. An application can be tested with a specific date
    to better determine how the application will behave when time sensitive changes
    are applied.


    The `Clock` class’s `systemDefaultZone` method will return an instance of a `Clock`
    based on the current system clock. It will use a date and time based on the default
    time zone. In the following example an instance of `Clock` is created:


    ```java

    Clock clock = Clock.systemDefaultZone();

    System.out.println(clock);

    ```


    ![](image285.jpg)


    This sequence will output the following indicating that it is a system clock and
    the current time zone:


    `SystemClock[America/Chicago]`


    The next example uses the `millis` method to return the number of milliseconds
    that has elapsed from the epoch as specified by the date and time. This number
    by itself is normally not of immediate use. The example also uses the `instant`
    method that returns an `Instant` object representing the clock time. The `Instant`
    class is discussed in the Instant Class.


    ```java

    System.out.println(clock.millis());

    System.out.println(clock.instant());

    ```


    ![](image286.jpg)


    The output follows:


    `1393774319282`

    `2014-03-02T15:31:59.282Z`


    If we want to specify a time zone, we use the `system` method with a `ZoneId`.
    The `ZoneId` class is covered in more depth in Obtaining Zone IDs. In the following
    example, the `system` method is supplied a human readable string representing
    a time zone.


    ```java

    clock = Clock.system(ZoneId.of("Asia/Jakarta"));

    System.out.println(clock);

    System.out.println(clock.getZone());

    System.out.println(clock.instant());

    ```


    ![](image287.jpg)


    The output follows:


    `SystemClock[Asia/Jakarta]`

    `Asia/Jakarta`

    `2014-03-02T16:15:45.830Z`


    An alternative technique uses the `withZone` method. In the following code sequence,
    this method is applied the same time zone. The `withZone` method creates a new
    object based on the object it is applied against. The same date and time are used
    but are adjusted to the new time zone.


    ```java

    Clock clock = Clock.systemDefaultZone();

    clock = clock.withZone(ZoneId.of("Asia/Jakarta"));

    System.out.println(clock);

    System.out.println(clock.getZone());

    System.out.println(clock.instant());

    ```


    ![](image288.jpg)


    Its output will be identical to the previous example.


    We can also create an instant based on whole minutes or seconds. The following
    example illustrates creating an instant using the `tickMinutes` method where the
    time is expressed in whole minutes:


    ```java

    clock = clock.tickMinutes(ZoneId.of("Asia/Jakarta"));

    System.out.println(clock);

    System.out.println(clock.instant());

    ```


    ![](image289.jpg)


    The output follows showing whole minutes with zeroes for seconds:


    `TickClock[SystemClock[Asia/Jakarta],PT1M]`

    `2014-03-02T16:15:00Z`


    ### Working with the Instant Class


    An instant is a point in time measured in the number of nanoseconds that have
    elapsed since the epoch. Negative values represent instants before the epoch and
    positive values represent time after the epoch. The `Instant` class supports this
    concept and provides a way of creating a time event using the machine timeline.


    There are three `Instant` constants as listed in Table 5 - Instant Constants.


    **Table 5 - Instant Constants**


    | Constant | Meaning |

    | :--- | :--- |

    | `EPOCH` | An Instant representing the epoch (1970-01-01T00:00:00Z) |

    | `MAX` | An Instant representing the largest possible instant in the future(1000000000-12-31T23:59:59.999999999Z)
    |

    | `MIN` | An Instant representing the smallest possible instant in the past (-1000000000-01-01T00:00Z)
    |


    ![](image290.jpg)

