    Using Operator Type Interfaces


    Operator type interfaces are concerned with applying operations against one or
    two operands. For binary operators it is a reduction type of operation. There
    is not a specific operator interface, but rather a series of functional interfaces
    that act on objects. Table 8: Operator Type Functional Interfaces lists the Operator
    type functional interfaces and their functional methods.


    ***Table 8: Operator Type Functional Interfaces***


    **Functional Interface** | Functional Method


    **BinaryOperator<T>** | R apply(T t1, T t2) (Inherited from BiFunction)


    **DoubleBinaryOperator** | double applyAsDouble(double left, double right)


    **DoubleUnaryOperator** | double applyAsDouble(double operand)


    **IntBinaryOperator** | int applyAsInt(int left, int right)


    **IntUnaryOperator** | int applyAsInt(int operand)


    **LongBinaryOperator** | long applyAsLong(long left, long right)


    **LongUnaryOperator** | long applyAsLong(long operand)


    **UnaryOperator<T>** | R apply(T t) (Inherited from Function)


    ![](image187.jpg)


    In this section, we will illustrate several of these types of interfaces.


    Using the UnaryOperator Interface


    The UnaryOperator interface extends the Function interface and inherits the apply
    functional method. In the following example, a lambda expression is created for
    the interface that accepts a string and returns a formatted string indicating
    the number of characters present in the string:


    UnaryOperator<String> stringCount = (String x) ->


    "\"" + x + "\" has " + x.length() + " characters";


    System.out.println(stringCount.apply("Simple String"));


    ![](image188.jpg)


    The output follows:


    "Simple String" has 13 characters


    A replaceAll method has been added to the List interface in Java 8\. It will modify
    each element of a List by applying a UnaryOperator against each element. To demonstrate
    this method, let’s start with the following declarations:


    List<Employee> list = new ArrayList();


    list.add(new Employee("   Mary", 23, 12));


    list.add(new Employee("Tom   ", 32, 12));


    list.add(new Employee("   Sam   ", 19, 5));


    list.add(new Employee("  Sue", 43, 2));


    UnaryOperator<Employee> trimNames = (Employee e) -> {


    Employee emp = new Employee(e);


    emp.setName(e.getName().trim());


    return emp;


    };


    ![](image189.jpg)


    Previously, it was necessary to use an iterator to replace elements of the list
    similar to the following:


    final ListIterator<Employee> listIterator =


    list.listIterator();


    while (listIterator.hasNext()) {


    listIterator.set(trimNames.apply(listIterator.next()));


    }


    list.forEach((e) -> System.out.println(e));


    ![](image190.jpg)


    The output of this sequence is shown below:


    Name: Mary  Age: 23  Pay grade: 12


