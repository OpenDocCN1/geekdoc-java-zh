    Working with Lambda Expressions


    Lambda expression can be used in a variety of contexts including:


    - Assigning a lambda expression to a variable


    - Passing a lambda expression as a parameter to a method or constructor


    - Returning a lambda expression from a method


    - Using lambda expressions with the tertiary operator


    - Initializing an array with lambda expressions


    - Throwing exceptions from a lambda expression


    - Casting lambda expressions


    - Implementing recursion with lambda expressions


    We have already seen lambda expressions used in some of these situations. In this
    section, we will focus on special usage such as their use with the tertiary operator
    and explain how they can throw exceptions.


    Using Lambda Expressions with Variable Declarations


    We can assign a lambda expression to a variable if the variable is declared as
    a type compatible with the lambda expression. In the following example, a lambda
    expression is assigned to a java.util.Comparator type variable. The lambda expression
    is assigned to the comparator variable.


    List<Integer> list = Arrays.asList(-5, -3, 4);


    Comparator<Integer> comparator =


    (x, y) -> (x < y) ? -1 : ((x > y) ? 1 : 0);


    list.sort(comparator);


    list.forEach(e->System.out.println(e));


    ![](image129.jpg)


    When the code is executed we get the following output:


    -5


    -3


    4


    The Comparator is a functional interface whose function descriptor accepts two
    values and then returns a negative integer, zero, or a positive integer depending
    on the result of the comparison. Using a variable is useful to clarify the expression
    and to allow the lambda expression to be used in more than one context in the
    same program. Using a lambda expression with a variable declaration can also make
    the lambda expression easier to read when we separate the declaration from its
    use.


    Using Lambda Expressions as a Return Value


    Sometimes it is convenient to return a lambda expression that can be used in other
    situations. The getTest method shown below is passed a string representing a region
    of a country. A lambda expression matching the Predicate functional method is
    returned. The intent of this Predicate is to determine if a weight exceeds the
    limit for that region. The Predicate functional interface is discussed in the
    Using the Predicate Interface section.


    public static Predicate<Integer> getTest(String area) {


    switch (area) {


    case "north":


    return (Integer weight)->weight<200;


    case "south":


    return (Integer weight)->weight<150;


    case "east":


    return (Integer weight)->weight<100;


    case "west":


    return (Integer weight)->weight<250;


    default:


    return (Integer weight)->weight<200;


    }


    }


    ![](image130.jpg)


    The next statement uses the lambda expression with a weight of 320:


    System.out.println(getTest("east").test(320));


    ![](image131.jpg)


    The test should return false.


    Using Exceptions with a Lambda Expression


    A lambda expression must not throw exceptions except for those specified in the
    functional interface’s method. In the following example, a TimeService interface
    is defined, followed by a class that uses a lambda expression to implement the
    interface.


    interface TimeService {


    String getTime();


    }


    public class ExceptionExamples {


    public static void main(String arg[]) {


    TimeService ts = ()-> {


    if(*someCondition*) {


    throw new Exception();


    }


    return "Time";


    };


    System.out.println(ts.getTime());


    }


    }


