    \ IDE 建议的等效声明：\n\n```java\nComputableType<Integer> computable;\n// 使用块作为 lambda\
    \ 表达式\ncomputable = (x) -> {\n    return x * x;\n};\n\n// 使用显式参数\ncomputable =\
    \ (Integer x) -> x * x;\n```\n\n![](img/image102.jpg)\n\n如果我们使用了下文声明的非泛型 `Computable`\
    \ 接口，就不会有这些建议：\n\n```java\ninterface Computable {\n    int compute(int x);\n}\n\
    \nComputable computable;\ncomputable = (x) -> x * x;\n```\n\n![](img/image103.jpg)\n\
    \n然而，由于该接口不是泛型的，在此 lambda 表达式中使用参数是非合法的。下面的图说明了使用 `Integer` 类型的尝试：\n\n```java\n\
    computable = (Integer x) -> x * x;  // 非法\n```\n\n![](img/image104.jpg)\n\n将生成类似下面的错误信息：\n\
    \n```\nincompatible types: incompatible parameter types in lambda expression\n\
    computable = (Integer x) -> x * x;  // 非法\n```\n\n## Lambda 表达式中的变量捕获\n\n在本节中，我们将研究用于访问\
    \ lambda 表达式内部变量的技术。在定义环境中中使用变量被称为“变量捕获”（variable capture）。lambda 表达式只能访问其定义环境中的\
    \ `final` 变量或“有效 final”（effectively final）变量。所谓“有效 final”，意味着，如果将该变量声明为 `final`，代码编译时不会报错。\n\
    \nlambda 表达式可以引用未声明为 `final` 但从未修改过的局部变量。但是它们不能重新定义这些变量。这解决了匿名内部类的一个局限性，即匿名内部类使用的局部变量必须声明为\
    \ `final`。此外，允许使用 `this` 和 `super` 关键字。\n\n总结规则，lambda 表达式可以：\n- 使用 `final` 变量\n\
    - 使用有效 final 变量\n- 不能修改局部变量或参数变量\n- 不能重新定义局部或参数变量\n- 可以使用 `this` 和 `super` 关键字\n\
    \n我们将使用以下类来演示如何在 lambda 表达式中捕获变量。首先定义 `IntegerMath` 函数式接口，然后在测试方法中使用。测试方法创建并返回了一个\
    \ lambda 表达式，该表达式使用一系列变量来计算和。该 lambda 表达式随后在另一个线程中执行。\n\n```java\ninterface IntegerMath\
    \ {\n    int operation(int a, int b);\n}\n\npublic class VariableCapture implements\
    \ Runnable {\n    private int instanceVariable = 5;\n    static IntegerMath le;\n\
    \n    public static void main(String args[]) {\n        VariableCapture vc = new\
    \ VariableCapture();\n        le = vc.test(15);\n        Thread thread = new Thread(vc);\n\
    \        thread.start();\n    }\n\n    public IntegerMath test(int parameter)\
    \ {\n        int localVariable = 10;\n        final int finalVariable = 30;\n\
    \        IntegerMath testExpression = (x, y) -> {\n            return x + y\n\
    \            + instanceVariable\n            + parameter\n            + localVariable\n\
    \            + finalVariable;\n        };\n        return testExpression;\n  \
    \  }\n\n    @Override\n    public void run() {\n        System.out.println(le.operation(25,\
    \ 5));\n    }\n}\n```\n\n![](img/image105.jpg)\n\n该程序的输出将是 90。\n\nlambda 表达式能够访问其环境中的变量。然而，如果修改了\
    \ `localVariable` 或 `parameter` 变量，它们将不再是有效 final，并产生语法错误。这两种修改生成的错误信息如下：\n\n\
    ```\nlocal variables referenced from a lambda expression must be final or effectively\
    \ final\n```\n\n无论在何处修改变量都不重要。它们不能被更改。如果需要，可以修改 `instanceVariable`。\n\n我们可以如下所示在\
    \ lambda 表达式中使用 `this` 关键字。它的使用没有限制：\n\n```java\n+ this.instanceVariable\n```\n\
    \n![](img/image106.jpg)\n\n`super` 关键字也可以访问基类成员。\n\n在 lambda 表达式内部尝试重新定义 `localVariable`\
    \ 或 `parameter` 将导致错误信息：\n\n```\nvariable index is already defined in method testCapture\
    \ ()\n```\n\n使用有效 final 变量可以消除某些涉及局部变量的类型多线程错误。由于 lambda 表达式是独立的，使用有效 final 变量消除了多线程同步的问题。\n\
    \n## 区分 Lambda 表达式与闭包（Closure）\n\n闭包和 lambda 表达式在 Java 中本质上是相同的。lambda 表达式是一个匿名函数。闭包是一个捕获环境的环境。捕获环境意味着它可以访问不在参数列表中的变量。在\
    \ Java 中，这两个术语可以互换。\n\n当评估 lambda 表达式时，它使用的是定义所在的环境，而不是使用所在的环境。如果 lambda 表达式是在特定栈中定义的，即使在另一个栈中使用，它也会在该栈的上下文中执行。在执行上下文（线程）之间传递闭包允许在其定义环境中评估表达式。\n\
    \n虽然对象是类的实例，但闭包是 lambda 表达式的实现。当 lambda 表达式编译时，会在运行时创建一个表示该 lambda 表达式类型的对象。\n\
    \n"
- fmt: "\nUsing the `println` method as a method reference can save the effort required\
    \ to create a lambda expression as shown below. This example will display each\
    \ element of the list one number per line.\n\n```java\nList<Integer> list = Arrays.asList(-5,\
    \ -3, 4);\nlist.forEach(System.out::println);\n```\n\n![](image108.jpg)\n\nThis\
    \ is equivalent to the following:\n\n```java\nlist.forEach(s -> System.out.println(s));\n\
    ```\n\n![](image109.jpg)\n\nThere are four basic types of method references:\n\
    \n- Static method references\n- Instance method references (specific object)\n\
    - Instance method references (arbitrary object of a specific type)\n- Constructor\
    \ references\n\nWhen using method references, as with lambda expressions, the\
    \ function must match the signature of the functional method. The type of the\
    \ reference is dependent on its context.\n\nLet’s examine the following method\
    \ reference:\n\n```\nMath::sin // Equivalent to x->Math.sin(x)\n```\n\n![](image110.jpg)\n\
    \nWhile the `Math` class does not constitute a functional interface, the `sin`\
    \ method can be used where a lambda expression accepts a double and returns a\
    \ double. The `sin` method can be applied against such a functional interface\
    \ instance. The method itself is treated as a function.\n\n### Using Static Method\
    \ References\n\nOne characteristic of static reference methods is that they cannot\
    \ capture instance variables for the same reason a static method cannot access\
    \ an instance variable. To demonstrate the use of a static reference we will create\
    \ a static display method that applies an operation against each element and then\
    \ displays the result of this operation. A static `square` method is used for\
    \ the method reference.\n\n```java\ninterface Computable {\n    int compute(int\
    \ x);\n}\n\npublic class MethodReferenceExample {\n    public static void main(String[]\
    \ args) {\n        List<Integer> list = Arrays.asList(-5, -3, 4);\n        display(list,\
    \ MethodReferenceExample::square);\n    }\n\n    public static int square(int\
    \ num) {\n        return num*num;\n    }\n\n    private static void display(List<Integer>\
    \ list, Computable operation) {\n        for(Integer element : list) {\n     \
    \       System.out.println(operation.compute(element));\n        }\n    }\n}\n\
    ```\n\n![](image111.jpg)\n\nThe output will appear as follows:\n\n```\n25\n9\n\
    16\n```\n\nIn this example, we are using a reference to the static method `square`.\
    \ We could, as easily, use the following statement which uses the `Math` class’\
    \ static method `abs`:\n\n```java\ndisplay(list, Math::abs);\n```\n\n![](image112.jpg)\n\
    \nThe output follows:\n\n```\n5\n3\n4\n```\n\n### Using Instance Method References\n\
    \nInstance method references can use either a method of a specific instance or\
    \ one from an arbitrary class object. Let’s examine a specific instance first.\
    \ The following is the definition of a functional interface called `StringConversion`.\
    \ It uses a `convert` method to perform some type of conversion on a string.\n\
    \n```java\ninterface StringConversion {\n    String convert(String input);\n}\n\
    ```\n\n![](image113.jpg)\n\nThe following is the definition of the `MethodReferenceExample`\
    \ class where we will demonstrate the use of a method reference. The `main` method\
    \ creates an instance of the `MethodReferenceExample` class where the `toUpperCase`\
    \ method is assigned to the conversion variable using the method reference notation.\
    \ The `convert` method is then used to transform a sample string to upper case.\
    \ The `toUpperCase` method is defined at the end of the class.\n\n```java\npublic\
    \ class MethodReferenceExample {\n    public static void main(String[] args) {\n\
    \        MethodReferenceExample mre = new MethodReferenceExample();\n        StringConversion\
    \ conversion;\n        conversion = mre::toUpperCase;\n        System.out.println(conversion.convert(\"\
    sample string\"));\n    }\n\n    public String toUpperCase(String input) {\n \
    \       return input.toUpperCase();\n    }\n}\n```\n\n![](image114.jpg)\n\nThe\
    \ output is as follows:\n\n```\nSAMPLE STRING\n```\n\nThe next sequence illustrates\
    \ how to use a method reference using the class name. A list of string is created\
    \ and then sorted using the `Collections` class `sort` method. A second use of\
    \ a method reference is used as the argument to the `forEach` method.\n\n```java\n\
    List<String> names = Arrays.asList(\"Sam\",\"Betty\",\"Sue\",\"Bob\");\nCollections.sort(names,\
    \ String::compareTo);\nnames.forEach(System.out::println);\n```\n\n![](image115.jpg)\n\
    \nThe sorted output is shown below:\n\n```\nBetty\nBob\nSam\nSue\n```\n\n### Using\
    \ Constructor References\n\nConstructor references provide a convenient way of\
    \ creating objects. The target type of a constructor reference will always be\
    \ a functional interface. The syntax of a constructor reference consists of the\
    \ class name followed by double colons and then the keyword `new`.\n\nA simple\
    \ use of a constructor reference is shown below where we create an `ArrayList`\
    \ object. The `Supplier` is a functional interface found in the `java.util.function`\
    \ package. Its functional method is passed `void` and returns an object. We are\
    \ able to assign the constructor reference to the `names` variable because it\
    \ is expecting a lambda expression. The `names` data type is a functional interface.\n\
    \n```java\nSupplier<List<String>> names = ArrayList::new;\n```\n\n![](image116.jpg)\n\
    \nThe following is not legal. This is because a lambda expression is not expected\
    \ in this context. It is looking for an object. The roster’s data type is a class.\n\
    \n```java\nArrayList<Employee> roster = ArrayList<Employee>::new;\n```\n\n![](image117.jpg)\n\
    \nMore sophisticated uses of constructor references are possible. To demonstrate\
    \ one such use, we will start with a simple functional interface as shown below:\n\
    \n```java\ninterface SimpleConstructorInterface<T> {\n    T create();\n}\n```\n\
    \n![](image118.jpg)\n\nWe will use this interface with the following class:\n\n\
    ```java\nclass SomeClass {\n    private String message;\n    public SomeClass()\
    \ {\n        this.message = \"Default Constructor\";\n        System.out.println(\"\
    +++SomeClass Default Constructor\");\n    }\n    public String getMessage() {\n\
    \        return message;\n    }\n}\n```\n\n![](image119.jpg)\n\nLet’s start with\
    \ two variable declarations for the interface and the class:\n\n```\nSomeClass\
    \ sc;\nSimpleConstructorInterface<SomeClass> sci;\n```\n\n![](image120.jpg)\n\n\
    We can use a constructor reference to create an instance of the `SimpleConstructorInterface`\
    \ as follows. This is an instance that implements the `create` method.\n\n```java\n\
    sci = SomeClass::new;\n```\n\n![](image121.jpg)\n\nWhen the instance is created,\
    \ it will use the `SomeClass` default constructor in support of the `create` method.\
    \ The default constructor’s signature matches that of the `create` method. That\
    \ is, it is passed nothing and returns an object. Remember that constructors do\
    \ return a value, an object.\n\n```java\nsc = sci.create();\nSystem.out.println(sc.getMessage());\n\
    ```\n\n![](image122.jpg)\n\nThis code sequence produces the following output.\
    \ The constructor has been called and the message has been set as anticipated.\n\
    \n```\n+++SomeClass Default Constructor\nDefault Constructor\n```\n\nWe can also\
    \ use constructors other than the default constructor. The following interface\
    \ will match a constructor that returns an object of type `T`, and takes some\
    \ object `U` as a parameter:\n\n```java\ninterface ConstructorArgumentInterface<T,\
    \ U> {\n    T create(U arg);\n}\n```\n\n![](image123.jpg)\n\nIf we add a new constructor\
    \ to `SomeClass` as shown below, we will be able to use this interface:\n\n```java\n\
    class SomeClass {\n    private String message;\n    public SomeClass(String message)\
    \ {\n        this.message = message;\n        System.out.println(\"+++SomeClass\
    \ String Constructor\");\n    }\n    public String getMessage() {\n        return\
    \ message;\n    }\n}\n```\n\n![](image124.jpg)\n\nThe following illustrates its\
    \ use. The constructor reference creates an instance of the `ConstructorArgumentInterface`.\
    \ The `create` method is then used to create an instance of `SomeClass`.\n\n```java\n\
    ConstructorArgumentInterface<SomeClass, String> cai;\ncai = SomeClass::new;\n\
    sc = cai.create(\"ConstructorArgumentInterface\");\nSystem.out.println(sc.getMessage());\n\
    ```\n\n![](image125.jpg)\n\nThe output of this sequence follows:\n\n```\n+++SomeClass\
    \ String Constructor\nConstructorArgumentInterface\n```\n\nA more sophisticated\
    \ example using a `List` is based on the following interface:\n\n```java\ninterface\
    \ ConstructorListArgumentInterface<T, U> {\n    T create(List<U> arg);\n}\n```\n\
    \n![](image126.jpg)\n\nA new instance variable and constructor are added to the\
    \ `SomeClass` to support this interface:\n\n```java\nclass SomeClass {\n```\n"
