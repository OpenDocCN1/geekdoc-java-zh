    \ `ScriptException` 异常。\n\n```\nScriptEngineManager manager = new ScriptEngineManager();\n\
    \nScriptEngine engine = manager.getEngineByName(\"nashorn\");\n\ntry {\n    Object\
    \ result = engine.eval(\n    \"'Nashorn JavaScript Engine'.length\");\n    System.out.println(result);\n\
    \n} catch (ScriptException ex) {…);\n```\n\n![](img/image351.jpg)\n\n此示例的输出将是\
    \ 25。\n\n## 执行 JavaScript 代码\n\n除了使用带有简单字符串参数的 `eval` 方法外，还有其他几种方法。以下定义了一个 JavaScript\
    \ 函数 `sumOfSquares`，它返回两个数字平方的和。然后我们使用 `eval` 方法执行该函数。\n\n```\nengine.eval(\"\
    function sumOfSquares(a, b) {\nreturn a*a + b*b;}\");\n\nSystem.out.println(engine.eval(\n\
    \"sumOfSquares(1, 2);\"));\n```\n\n![](img/image352.jpg)\n\n输出将是 5.0。\n\n另一种方法使用了\
