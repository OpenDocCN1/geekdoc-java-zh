    algorithms, SHA-224 message-digest algorithm, and SunPKCS11 provider for 64-bit
    Windows.


    Improvements were made to the implementation of the Password-Based-Encryption
    (PBE) algorithm, the certificate revocation-checking API, and various aspects
    of the KeyStore API. Also, configuration constraints have been added when generating
    secure random-numbers.


    VM Related Enhancements


    There are several VM related improvements most of which are transparent to the
    typical user. These are listed below to give the reader a feel for what has been
    done:


    - Reduced cache contention when fields of an object are accessed between cores


    - Removed the permanent generation to eliminate the need to tune the size of the
    permanent generation


    - Removed three garbage collector combinations that are rarely used


    - Provided additional information about verification errors


    - Reduced class metadata footprints


    - Reduced HotSpot’s class metadata memory footprint to improve performance


    - Supported the creation of a small VM


    - Added three memory-ordering intrinsics to the sun.misc.Unsafe class


    Core Java Enhancements


    A number of other changes have been made. These include enhancements to the javac
    compiler to improve its performance and to improve dynamic memory usage by core-library
    classes. The Charset class and java.text.DecimalFormat.format method implementations
    have been improved.


    Parts of the API have been upgraded. The platform now supports version 6.2 of
    the Unicode Standard. Also, JAXP has been upgraded to version 1.5\. A standard
    API for Base64 encoding and decoding has been added which is found in the java.util.Base64
    class.


    Annotation improvements have been made to allow multiple annotations of the same
    type to be applied to a single program element. The Annotation Processing Tool
    (APT), API, and documentation were removed. It is not possible to model many of
    the language features added after Java 5 using this tool. The removal was done
    to transit to JSR 269 (Pluggable Annotation Processing API). This API permits
    using custom annotation processors with javac.


    Core reflection has been improved in several ways. Access to parameter names has
    been made easier and more reliable. The javax.lang.model.* API uses core reflection
    instead of using javac.


    Conclusion


    This chapter examined many new features of Java 8\. We started with an examination
    of the Nashorn JavaScript engine. This feature allows for the execution of JavaScript
    code from a Java application. In addition, Java code can be accessed from JavaScript.
    We saw how several file IO classes and methods can easily support lambda expressions.
    Methods have been added to the Collections framework including the forEachRemaining
    and several replace type methods. These expand the capabilities of the Collections
    Framework. We also looked at additional concurrency enhancements available in
    Java 8.


