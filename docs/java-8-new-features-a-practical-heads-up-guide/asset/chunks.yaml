    \ static methods found in the `Instant` class. The time represented by an instant\
    \ has nanosecond precision and is supported internally with two long values.\n\
    \nWe can use the `Clock`’s `instant` method to create an `Instant` object:\n\n\
    ```java\nClock clock = Clock.systemDefaultZone();\nSystem.out.println(clock.instant());\n\
    ```\n\n![](image291.jpg)\n\nThe output follows:\n\n```\n2014-03-10T17:48:38.307Z\n\
    ```\n\nWe can also use the `Instant` class’ static `now()` method to create an\
    \ instant based on the current UTC time zone as determined by the system clock.\
    \ This is illustrated below:\n\n```java\nInstant now = Instant.now();\nSystem.out.println(now);\n\
    ```\n\n![](image292.jpg)\n\nThe output of this sequence may appear as follows:\n\
    \n```\n2014-03-02T16:00:14.929Z\n```\n\n### Creating an Instant Based on the Epoch\n\
    \nWe may need to create an `Instant` from the epoch to mark an event along the\
    \ machine timeline. There are three methods that produce an `Instant` based on\
    \ the time elapsed from the epoch. They differ in their arguments and the resulting\
    \ accuracy of the `Instant` object produced.\n\n***Table 6 – An Instant based\
    \ on the Epoch***\n\n| Method | Arguments | Meaning of Argument |\n| :--- | :---\
    \ | :--- |\n| ofEpochSecond | `long epochSecond` | Number of seconds from epoch\
    \ |\n| ofEpochSecond | `long epochSecond, long nanoAdjustment` | Number of seconds\
    \ from epoch with a nanosecond adjustment |\n| ofEpochMilli | `long epochMilli`\
    \ | Number of milliseconds from epoch |\n\n![](image293.jpg)\n\nThe following\
    \ illustrates creating an instant that is 500,000,000 milliseconds after the epoch:\n\
    \n```java\nInstant instant = Instant.ofEpochMilli(500000000);\nSystem.out.println(instant);\n\
    ```\n\n![](image294.jpg)\n\nThe output follows:\n\n```\n1970-01-06T18:53:20Z\n\
    ```\n\n### Creating an Instant Based on Parsing a UTC String\n\nThere is also\
    \ a `parse` method which takes a UTC string argument representing a point in time.\
    \ An exception is thrown if the string is not valid (`DateTimeParseException`).\
    \ This convenience method is human friendly.\n\nThe following illustrates how\
    \ this method is used to create an instant based on the date and time of January\
    \ 1, 2010:\n\n```java\ninstant = Instant.parse(\"2010-01-01T00:00:00.000Z\");\n\
    System.out.println(instant);\n```\n\n![](image295.jpg)\n\nThe output will be:\n\
    \n```\n2010-01-01T00:00:00Z\n```\n\n### Creating an Instant by Adding or Subtracting\
    \ a Time from an Instant\n\nThere are a series of `plus` and `minus` type methods\
    \ that execute against an `Instant` object. These either add or subtract an increment\
    \ using the `Instant` and then return a new `Instant` object reflecting this time.\
    \ The unit added or subtracted can be a second, millisecond, nanosecond or a `TemporalAmount`.\
    \ A `TemporalAmount`, as its name implies, is the number of time units such as\
    \ seconds.\n\nThe following code sequence illustrates adding 3600 seconds (1 hour)\
    \ and then subtracting 500 milliseconds from that time. The example also shows\
    \ how fluent programming is supported. The chained methods are easy to read and\
    \ understand.\n\n```java\ninstant = Instant.now()\n  .plusSeconds(3600)\n  .minusMillis(500);\n\
    \nSystem.out.println(instant);\n```\n\n![](image296.jpg)\n\nThe output follows:\n\
    \n```\n2014-03-02T17:57:57.758Z\n```\n\n### Using the Instant Class’ get Type\
    \ Methods\n\nThe `Instant` class has several getter methods. These methods return\
    \ various types of information such as the number of seconds relative to the epoch\
    \ or whether an instant occurs before or after the epoch. These methods are summarized\
    \ in Table 7 - Instant Getter Methods.\n\nThe following illustrates these methods:\n\
    \n```java\nInstant now = Instant.now();\nSystem.out.println(now.getEpochSecond());\n\
    System.out.println(now.getNano());\nSystem.out.println(now.isAfter(Instant.EPOCH));\n\
    System.out.println(now.isBefore(Instant.EPOCH));\n```\n\n![](image297.jpg)\n\n\
