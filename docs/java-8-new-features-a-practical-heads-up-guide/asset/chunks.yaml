  raw: 'Streams do not store elements. Since streams are not data structures there
    is no need to store data. This is in contrast to collections which do store data.
    The elements of a stream are obtained from some source and are processed. When
    the processing is complete, the stream goes away. Its elements will go away unless
    moved to an array or collection separate from the stream.


    When the stream has been processed, its elements are no longer available through
    the stream. The stream cannot be reused. However, it can be regenerated in most
    cases.


    Streams Can Be Unbounded


    Collections are of finite size, streams are unbounded. A stream can contain zero
    to an infinite number of elements. As we will see in Generating Infinite Streams,
    an infinite stream can be generated using several techniques. Though not truly
    infinite, a stream can run for a very long time if needed.


    A stream works on a sequence of values. A generator can create these values which
    are fed into the stream and processed. The stream can be of any length and is
    considered to be unbounded.


    Streams Do Not Modify the Original Source


    The source of the elements for a stream frequently originates from a data structure
    such as a list or array. As such, the operations against the stream and its elements
    are not performed against the elements in the original data structure. Also, streams
    do not modify the original source.


    A Stream May Be Ordered


    A stream may be ordered or unordered. When a stream is created from an array,
    List, or some generator function, the stream is an ordered stream. In contrast,
    streams that are produced from a Set are unordered. This does not imply that a
    stream is ordered by some criteria such as being alphabetical. Rather, it is like
    a queue where elements that enter first are served first.


    With ordered streams, most operations will preserve the original order. The sorted
    method does not preserve the original order but imposes a new order instead. The
    unordered method also removes order from a stream. An unordered stream is desirable
    for performance reasons when used with some parallel operations.


    Automatic Parallelization


    Streams have two modes: sequential and parallel. When specified to be parallel,
    the processing of the stream is automatically executed concurrently based on the
    number of processors available. The programmer does not need to explicitly setup
    multiple threads. This is discussed in Using Parallel Stream Operations.


    An Overview of Stream Methods


    The methods of a stream can be classified as either intermediary or terminal.
    With intermediary methods, the output of the method is fed to another method.
    That is, they return another stream. With terminal methods, the stream ends and
    a result is produced. It represents the end of a pipeline. A pipeline consists
    of a source, zero or more intermediate operations, and a terminal operation. Once
    a pipeline is terminated, it cannot be used again. Intermediary methods are typically
    evaluated lazily. This concept is further explored in Understanding Lazy and Eager
    Evaluation.


    Intermediate methods can further be classified as either stateless or stateful.
    A stateless method will simply forward its result to the next element in the pipeline.
    A stateful method will capture some data and possibly wait for more data before
    proceeding.


    **Table 1 - Summary of Selected Stream Methods** lists a set of Stream interface
    methods. These will be discussed in the subsections that follow.


    ***Table 1 - Summary of Selected Stream Methods***


    *Intermediate*:


    Method | **Purpose** | Return Value


    filter | **Return stream containing elements matching a Predicate** | Stream<T>


    map | **Applies an operation against each element in the stream, possibly transforming
    it** | Stream<U>


    flatMap | **Flattens out a stream** | Stream<R>


    sorted | **Sorts the elements of a stream** | Stream<T>


    distinct | **Returns a stream which contains no duplicate elements** | Stream<T>


    limit | **Restricts the number of element in the returned stream** | Stream<T>


    skip | **Skips over a specific number of elements in a stream** | Stream<T>


    *Terminal*:


    **Method** | Purpose | **Return Value**


    **forEach** | Performs some operation on each element of the stream and terminates
    the stream | **void**


    **reduce** | Combines stream elements together using a BinaryOperator | **T**


    **collect** | Puts the stream’s elements into a container such as a Collection
    | **R**


    **min** | Finds the smallest element as determined by a Comparator | **Optional<T>**


    **max** | Finds the largest element as determined by a Comparator | **Optional<T>**


    **count** | Determines the number of elements in a stream | **long**


    **anyMatch** | Determines whether at least one element of the stream matches a
    Predicate | **boolean**


    **allMatch** | Determines whether every element of the stream matches a Predicate
    | **boolean**


    **noneMatch** | Determines whether there are no elements of the stream matches
    a Predicate | **boolean**


    **findFirst** | Returns the first element of a stream | **T**


    **findAny** | Returns any element of a stream | **T**


    **iterator** | Returns an Iterator for the stream | **Iterator**


    **toArray** | Creates an array based on the elements of the stream | **A[]**


    ![](image197.jpg)


    Creating a Stream


    Before a stream can be used, it must be created. There are several ways of creating
    a stream including from data structures such as a list or an array. Many of the
    Stream interface’s methods return Stream objects. This is an important capability
    and permits the “chaining” of Stream methods. Here, we are more concerned with
    how a stream can be created from an ultimate “source” such as a list.


    Using the Stream Interface’s of Method


    The Stream interface’s static of method provides a convenient technique for creating
    streams from a list. In the following example, a stream of strings is created.
    The forEach method will display the elements of the stream.


    Stream<String> stringStream =


    Stream.of("alpha", "beta", "gamma", "delta");


    stringStream.forEach((s)->System.out.print(s + " "));


    ![](image198.jpg)


    The output of this sequence follows:


    alpha beta gamma delta


    Creating a stream of strings from a string literal can be accomplished using the
    String class’ split method as shown below:


    stringStream


    = Stream.of("drop the sword here".split(" "));


    stringStream.forEach((s) -> System.out.println(s));


    ![](image199.jpg)


    The following is printed:


    drop


    the


    sword


    here


    We can easily create a stream of Parts using this method as follows. The Part
    class will be discussed in The Part Example Class.


    Stream<Part> partStream = Stream.of(


    new Part("Pencil", 100, 5, 0.15f, 500),


    new Part("Eraser", 200, 3, 0.25f, 250),


    new Part("Paper", 2000, 1, 0.03f, 1200));


    partStream.forEach((p) -> System.out.println(p));


    ![](image200.jpg)


    The output follows:


    Name: Pencil   Weight:   5  Part Number:   100 Price: 0.15 Quantity:   500


    Name: Eraser   Weight:   3  Part Number:   200 Price: 0.25 Quantity:   250


    Name: Paper    Weight:   1  Part Number:  2000 Price: 0.03 Quantity:  1200


    We can also use the of method with an array as illustrated below:


    Part[] parts = {


    new Part("Pencil", 100, 5, 0.15f, 500),


    new Part("Eraser", 200, 3, 0.25f, 250),


    new Part("Paper", 2000, 1, 0.03f, 1200));


    };


    partStream = Stream.of(parts);


    partStream.forEach((p) -> System.out.println(p));


    ![](image201.jpg)


    The output is the same as the previous example.


    Using the Collection Class’ stream Method


    The stream method can be applied to those classes that implement the Collection
    interface including the List class. In the following example, a list of numbers
    is created and the stream method is then applied to it. The contents of the stream
    are then displayed.


    List list = Arrays.asList(1, 2, 3, 4, 5);


    Stream stream = list.stream();


    stream.forEach(x -> System.out.print(x + " "));


    ![](image202.jpg)


    The output of this sequence follows:


    1 2 3 4 5'
