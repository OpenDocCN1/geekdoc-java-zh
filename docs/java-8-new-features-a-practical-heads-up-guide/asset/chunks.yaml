    \ |\n| `Colorable` | 任何类且不是 MoreDisplayable 或 Displayable | `Colorable` |\n| `Drawable`\
    \ | 其他任何类或接口 | `Drawable` |\n\n![](img/image34.jpg)\n\n如果该方法在 `Person` 类中实现，则该实现将始终被使用。如果该方法在该类没有实现，它将查找其基类以寻找。如果\
    \ `Entity` 类中存在该方法，它将使用它。由于 `Object` 类没有实现 `draw` 方法，因此它不会在那里找到实现。\n\n如果类层级中没有该方法可用，则它将在接口层级中进行搜索。它将使用找到的第一个实现，从最派生的接口开始查找。在这种情况下，它将检查\
    \ `MoreDisplayable` 接口是否实现了该方法。如果没有，它将使用在 `Displayable` 或 `Colorable` 接口中找到的任一个实现。如果这两个类都拥有实现，且\
    \ `MoreDisplayable` 接口没有指定使用哪一个，则会导致编译错误。这种情况在上一节中讨论过。如果只有 `Drawable` 接口实现了 `draw`\
    \ 方法，则将使用该实现。\n\n如前所示，如果重写的方法调用了其直接所属类或接口的实现，则可以使用 `draw` 方法的多个实现。\n\n此选择过程可以总结为：\n\
    \n- 类的优先级高于接口，且\n- 更具体的接口（最派生的）的优先级高于不那么具体的接口。\n\n# 使用默认方法\n\n默认方法可以在许多情况下使用。本节识别并阐明了许多此类可能的用法。这些包括扩展现有接口和补充适配器类。\n\
    \n## 扩展现有接口\n\n当向现有接口添加新的抽象方法时，已经实现该接口的类将会发生破坏，因为它们不再实现新方法。然而，添加默认方法将允许在不破坏之前的实现的情况下添加新方法。传统上，定义接口时它被视为一份合约，预计不会发生更改。\n\
    \n但是，如果接口需要更改，那么默认方法的可用意味着接口可以更改，且该更改不会影响现有代码。这允许在添加新的默认方法时，现有接口继续保持可用。旧的、现接口用法不会破坏。\n\
    \n考虑以下具有单个抽象方法 `draw` 的接口：\n\n```java\ninterface Drawable {\n    public void draw();\n\
    }\n```\n\n![](img/image35.jpg)\n\n当 `Person` 等类实现该接口时，它只需要实现 `draw` 方法：\n\n```java\n\
    class Person implements Drawable {\n    public void draw() {\n        System.out.println(\"\
    The Person's draw method\");\n    }\n}\n```\n\n![](img/image36.jpg)\n\n然而，如果我们在\
    \ `Drawable` 接口中添加另一个抽象方法，如下所示的 `drawWithQuotes` 方法，我们将在 `Person` 类中引入错误：\n\n\
    ```java\ninterface Drawable {\n    public void draw();\n    public void drawWithQuotes();\n\
    }\n```\n\n![](img/image37.jpg)\n\n错误信息将是：\n\n`Person is not abstract and does\
    \ not override abstract method drawWithQuotes() in Drawable`\n\n我们无法在不破坏 Java\
    \ 8 之前编写的旧代码的情况下轻松添加新方法。相反，如果我们在 `Drawable` 接口中使用所示默认方法，错误就会消失。我们的代码将正确编译并执行。\n\
    \n```java\ninterface Drawable {\n    public void draw();\n    public default void\
    \ drawWithQuotes() { }\n}\n```\n\n![](img/image38.jpg)\n\n## 使用默认方法补充适配器类\n\n\
    虽然像 `MouseMotionAdapter` 类尚未被默认方法接口实现取代，但可以使用默认方法提供类似的功能。例如，考虑一个等于 `MouseMotionAdapter`\
    \ 的接口。Java 8 中找到的 `MouseMotionAdapter` 源码简化版本所示：\n\n```java\npublic abstract class\
    \ MouseMotionAdapter implements MouseMotionListener {\n    public void mouseDragged(MouseEvent\
    \ e) {};\n    public void mouseMoved(MouseEvent e) {};\n}\n```\n\n![](img/image39.jpg)\n\
    \n一个“等效”接口可能如下：\n\n```java\npublic interface MouseMotionAdapterInterface extends\
    \ MouseMotionListener {\n    public default void mouseDragged(MouseEvent e) {\
    \ };\n    public default void mouseMoved(MouseEvent e) { };\n}\n```\n\n![](img/image40.jpg)\n\
    \n使用 `MouseMotionAdapter` 的示例所示。此代码将在鼠标跨越窗口时打印鼠标当前的 x 坐标。\n\n```java\npublic static\
    \ void main(String[] args) {\n    JFrame frame = new JFrame();\n    frame.addMouseMotionListener(new\
    \ MouseMotionAdapter() {\n        public void mouseMoved(MouseEvent e) {\n   \
    \         System.out.println(e.getX());\n        }\n    });\n    frame.setBounds(100,\
    \ 100, 500, 300);\n    frame.setVisible(true);\n}\n```\n\n![](img/image41.jpg)\n\
    \n为了演示 `MouseMotionAdapterInterface` 的用法，我们将使用以下代码。该代码与之前的示例等效，只是使用了 `MouseMotionAdapterInterface`\
    \ 接口的实例而不是 `MouseMotionAdapter`。其他代码的行为相同。\n\n```java\npublic static void main(String[]\
    \ args) {\n    JFrame frame = new JFrame();\n    frame.addMouseMotionListener(\n\
    \        new MouseMotionAdapterInterface() {\n            public void mouseMoved(MouseEvent\
    \ e) {\n                System.out.println(e.getX());\n            }\n       \
    \ });\n    frame.setBounds(100, 100, 500, 300);\n    frame.setVisible(true);\n\
    }\n```\n\n![](img/image42.jpg)\n\n## 在核心类中使用默认方法\n\n默认方法的引入是 Java 8 的一个重大变化。对于开发者利用\
    \ Java 8 这一特性并继续使用接口（如集合的接口），使用默认方法是理想的。如所示，`forEach` 方法已添加到 `java.lang.Iterable`\
    \ 接口。`forEach` 方法将遍历列表的每个元素并应用 `Consumer` 类的 `accept` 方法。\n\n```java\npublic interface\
    \ Iterable<T> {\n    Iterator<T>iterator();\n    default void forEach(Consumer<?\
    \ super T> action) {\n        Objects.requireNonNull(action);\n        for (T\
    \ t : this) {\n            action.accept(t);\n        }\n    }\n}\n```\n\n现在可以在不破坏现有代码中使用\
    \ `accept` 方法。在下面的示例中，`Person` 类通过添加 name 字段和支持方法进行了修改：\n\n```java\npublic class\
    \ Person {\n    String name;\n    int age;\n    public Person(String name, int\
    \ age) {\n        this.name = name;\n        this.age = age;\n    }\n    @Override\n\
    \    public String toString() {\n        return \"Person{\" + \"name=\" + name\
    \ +\n        \", age=\" + age + '}';\n    }\n}\n```\n\n![](img/image44.jpg)\n\n\
    实现 `Iterable` 接口的 `ArrayList` 可以使用 `forEach` 方法遍历列表，如下所示。创建了一个 person 列表。然后对列表执行\
    \ `forEach` 方法。此示例使用 lambda 表达式作为 `forEach` 方法的参数。虽然这里不解释 lambda 表达式，但它的效果是通过调用\
    \ `toString` 方法显示列表中的每个 person。\n\n```java\nArrayList<Person> roster = new ArrayList();\n\
    roster.add(new Person(\"Ralph\", 45));\nroster.add(new Person(\"Tom\", 22));\n\
    roster.add(new Person(\"Mary\", 31));\n\nroster.forEach(person -> System.out.println(person));\n\
    ```\n\n![](img/image45.jpg)\n\n此序列的输出如下：\n\nPerson{name=Ralph, age=45}\n\nPerson{name=Tom,\
    \ age=22}\n\nPerson{name=Mary, age=31}\n\n这比使用 for each 语句更简单。\n\n"
