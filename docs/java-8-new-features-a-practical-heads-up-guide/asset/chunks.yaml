- fmt: "\n- Using `java.util.ServiceLoader` instead of specific provider's implementations\n\
    - Deprecating certain change listeners and APIs that impede modularization\n-\
    \ Adding a class analyzer tool to detail application dependencies (`jdeps`)\n\
    - Removing references to files in `$JAVA_HOME` to facilitate future changes in\
    \ location\n\nJava 8 introduces the concept of a Compact Profile. The intent is\
    \ to use only parts of the Java platform so as to allow Java to be utilized on\
    \ platforms with minimal resources. For example, some platforms do not require\
    \ GUI APIs and eliminating them will save space.\n\n### The Compact Profiles\n\
    \nThere are three compact profiles: `compact1`, `compact2`, and `compact3`. Each\
    \ of these compacts consists of a set of classes. `compact1` is the smallest.\
    \ `compact2` consists of all of the packages of `compact1` plus additional packages.\
    \ `compact3` consists of all of the classes of `compact1` and `compact2` plus\
    \ an additional set of packages. The packages included in each compact are listed\
    \ in **Table 4 - Compact Profile Listing**. The entire `JDK` is not considered\
    \ to be a compact.\n\nJavadoc includes the names of the compact a class belongs\
    \ to, if any. For example, The `Clock` class is found in all of the compacts.\
    \ This is reflected in the documentation found at [http://download.java.net/jdk8/docs/api/](http://download.java.net/jdk8/docs/api/).\
    \ The first part of the documentation is shown below:\n\n```\ncompact1, compact2,\
    \ compact3\n\njava.time\n\nClass Clock\n\njava.lang.Object\n\njava.time.Clock\n\
    \n…\n```\n\n**Table 4 - Compact Profile Listing**\n\n| compact1 | compact2 | compact3\
    \ |\n| :--- | :--- | :--- |\n| `java.io` | `java.rmi` | `java.lang.instrument`\
    \ |\n| `java.lang` | `java.rmi.activation` | `java.lang.management` |\n| `java.lang.annotation`\
    \ | `java.rmi.dgc` | `java.security.acl` |\n| `java.lang.invoke` | `java.rmi.registry`\
    \ | `java.util.prefs` |\n| `java.lang.ref` | `java.rmi.server` | `javax.annotation.processing`\
    \ |\n| `java.lang.reflect` | `java.sql` | `javax.lang.model` |\n| `java.math`\
    \ | `javax.rmi.ssl` | `java.lang.model.element` |\n| `java.net` | `javax.sql`\
    \ | `java.lang.model.type` |\n| `java.nio` | `javax.transaction` | `javax.lang.model.util`\
    \ |\n| `java.nio.channels` | `javax.transaction.xa` | `javax.management` |\n|\
    \ `java.nio.channels.spi` | `javax.xml` | `javax.management.loading` |\n| `java.nio.charset`\
    \ | `javax.xml.datatype` | `javax.management.modelmbean` |\n| `java.nio.charset.spi`\
    \ | `javax.xml.namespace` | `javax.management.monitor` |\n| `java.nio.file` |\
    \ `javax.xml.parsers` | `javax.management.openmbean` |\n| `java.nio.file.attribute`\
    \ | `javax.xml.stream` | `javax.management.relation` |\n| `java.nio.file.spi`\
    \ | `javax.xml.stream.events` | `javax.management.remote` |\n| `java.security`\
    \ | `javax.xml.stream.util` | `javax.management.remote.rmi` |\n| `java.security.cert`\
    \ | `javax.xml.transform` | `javax.management.timer` |\n| `java.security.interfaces`\
    \ | `javax.xml.transform.dom` | `javax.naming` |\n| `java.security.spec` | `javax.xml.transform.sax`\
    \ | `javax.naming.directory` |\n| `java.text` | `javax.xml.transform.stax` | `javax.naming.event`\
    \ |\n| `java.text.spi` | `javax.xml.transform.stream` | `javax.naming.ldap` |\n\
    | `java.time` | `javax.xml.validation` | `javax.naming.spi` |\n| `java.time.chrono`\
    \ | `javax.xml.xpath` | `javax.security.auth.kerberos` |\n| `java.time.format`\
    \ | `org.w3c.dom` | `javax.security.sasl` |\n| `java.time.temporal` | `org.w3c.dom.bootstrap`\
    \ | `javax.sql.rowset` |\n| `java.time.zone` | `org.w3c.dom.events` | `javax.sql.rowset.serial`\
    \ |\n| `java.util` | `org.w3c.dom.ls` | `javax.sql.rowset.spi` |\n| `java.util.concurrent`\
    \ | `org.xml.sax` | `javax.tools` |\n| `java.util.concurrent.atomic` | `org.xml.sax.ext`\
    \ | `javax.xml.crypto` |\n| `java.util.concurrent.locks` | `org.xml.sax.helpers`\
    \ | `javax.xml.crypto.dom` |\n| `java.util.function` | | `javax.xml.crypto.dsig`\
    \ |\n| `java.util.jar` | | `javax.xml.crypto.dsig.dom` |\n| `java.util.logging`\
    \ | | `javax.xml.crypto.dsig.keyinfo` |\n| `java.util.regex` | | `javax.xml.crypto.dsig.spec`\
    \ |\n| `java.util.spi` | | `org.ietf.jgss` |\n| `java.util.stream` | | |\n| `java.util.zip`\
    \ | | |\n| `javax.crypto` | | |\n| `javax.crypto.interfaces` | | |\n| `javax.crypto.spec`\
    \ | | |\n| `javax.net` | | |\n| `javax.net.ssl` | | |\n| `javax.script` | | |\n\
    | `javax.security.auth` | | |\n| `javax.security.auth.callback` | | |\n| `javax.security.auth.login`\
    \ | | |\n| `javax.security.auth.spi` | | |\n| `javax.security.auth.x500` | | |\n\
    | `javax.security.cert` | | |\n\n### Using Compact Profiles\n\nYou can use the\
    \ `javac` compiler command with the `-profile` command line option to determine\
    \ if an application uses an element not present in a profile. This command is\
    \ documented at [http://download.java.net/jdk8/docs/technotes/tools/windows/javac.html](http://download.java.net/jdk8/docs/technotes/tools/windows/javac.html).\
    \ For example, the Java program that follows includes an import statement and\
    \ a declaration for a `ResultSet` variable:\n\n```java\nimport java.sql.ResultSet;\n\
