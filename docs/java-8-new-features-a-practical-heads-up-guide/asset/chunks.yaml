    ```\n\nThe `@FunctionalInterface` annotation is not required. If it is not used\
    \ with an interface that is a functional interface, the compiler will still treat\
    \ it as a functional interface.\n\n# Overriding Object Class Methods in a Functional\
    \ Interface\n\nAll interfaces implicitly declare abstract methods of `Object`\
    \ class methods. It is also possible to explicitly declare an abstract method\
    \ from the `Object` class in an interface. These methods do not count toward the\
    \ number of abstract methods in an interface.\n\nFor example, although the `java.util`\
    \ package’s `Comparator` interface is a functional interface, it has two abstract\
    \ methods: a `compare` and an `equals` abstract method. The `equals` method effectively\
    \ overrides the `Object` class's `equals` method.\n\nThe following illustrates\
    \ how the `equals` method is used to add a second abstract method to the `Drawable`\
    \ interface:\n\n```java\n@FunctionalInterface\npublic interface Drawable {\n \
    \   public abstract boolean hasBeenDrawn();\n    @Override\n    public abstract\
    \ boolean equals(Object obj);\n}\n```\n\n![](image61.jpg)\n\nAn interface cannot\
    \ declare, as a default method, any of the methods of the `Object` class. This\
    \ includes the commonly used `equals`, `hashCode`, and `toString` methods. In\
    \ general, overriding a method of the `Object` class is not always a good idea\
    \ nor is necessary.\n\n# Using Functional Interfaces in the Core Libraries\n\n\
    Functional interfaces have always been part of Java but have not been explicitly\
    \ called functional interfaces. For example, interfaces such as `ActionListener`\
    \ and `Runnable`, shown below, are functional interfaces:\n\n```java\npublic interface\
    \ ActionListener extends EventListener {\n    public void actionPerformed(ActionEvent\
    \ e);\n}\n\npublic interface Runnable {\n    public abstract void run();\n}\n\
    ```\n\n![](image62.jpg)\n\nIn Java 8 many new functional interfaces have been\
    \ added. Several have been added to the new `java.util.function` package to address\
    \ common programmer needs. For example, the `Predicate` interface is used to support\
    \ test cases that evaluate to true or false. Its functional method is `test`.\
    \ It has a single generic argument and returns a boolean value.\n\n```java\nboolean\
    \ test(T t);\n```\n\n![](image63.jpg)\n\nA more detailed discussion of these functional\
    \ interfaces is found in Chapter 2.\n\n# Conclusion\n\nIn this chapter, we have\
    \ focused on the use of default methods and functional interfaces. Default methods\
    \ are methods of an interface that have an implementation. This feature has been\
    \ added to allow interfaces to grow over time without breaking existing uses of\
    \ the interface. The keyword `default` is used to declare such a method.\n\nWith\
    \ the addition of default methods, we have to consider how overridden default\
