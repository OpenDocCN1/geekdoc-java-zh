    Date and time information is often locale specific. To address this concern, the
    Date and Time API transparently uses the Unicode Common Locale Data Repository
    (CLDR) (http://cldr.unicode.org/). This repository consists of data used to format
    information such as dates. It provides country specific information.


    In the next sections we will illustrate how the `LocalDate`, `LocalTime`, and
    `LocalDateTime` classes can be instantiated and used. Following this section we
    will examine `YearMonth`, `MonthDay`, and `Year`.


