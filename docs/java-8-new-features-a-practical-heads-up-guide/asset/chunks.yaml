    Other Enhancements


    This section highlights many of the other enhancements made to Java 8 that do
    not warrant larger sections.


    Javadoc Enhancements


    The most visible immediate change is to the Javadoc generated HTML files. These
    now support a method summary section where tabs have been added to select between
    types of methods: static, instance, abstract, concrete, or deprecated. The existence
    of these tabs depends on the methods in the class or interface.


    A new DocTree API ([http://download.java.net/jdk8/docs/jdk/api/javac/tree/com/sun/source/doctree/package-summary.html](http://download.java.net/jdk8/docs/jdk/api/javac/tree/com/sun/source/doctree/package-summary.html))
    has been added. The API extends the Compiler Tree API and allows for better access
    to Javadoc contents.


    The Javadoc Access API ([http://download.java.net/jdk8/docs/api/javax/tools/package-summary.html](http://download.java.net/jdk8/docs/api/javax/tools/package-summary.html))
    provides access to the Javadoc tools from a Java application. In addition, the
    javadoc tool now checks for invalid HTML code. This check can be turned off using
    the –Xdoclint option.


    Security Enhancements


    Various security enhancements have been made to Java 8\. Many of these are not
    visible to the developer. These include:'
