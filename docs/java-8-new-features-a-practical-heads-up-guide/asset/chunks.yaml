    Concurrency Enhancements


    Several concurrency enhancements were introduced in Java 8\. The most significant
    one is supported using parallel streams as discussed in Chapter 3\. In addition
    to streams, other enhancements have been made to the java.util.Arrays class. The
    new methods support parallel sorting and other operations against each element
    of an array in a concurrent manner.


    Using the Arrays Class’ parallelSort Method


    The overloaded parallelSort method will sort the elements of an array concurrently.
    Methods exist for all of the primitive data types and for generic objects using
    a Comparator interface.


    The methods may not actually perform the sort operation concurrently if the array
    does not meet a certain size threshold. In that case it will revert back to a
    sequential sort. Sometimes a sequential sort will execute faster when the overhead
    of the parallel sort outweighs the speedup achieved using multiple processors.


    The parallel sort will divide the array into sub-arrays and then sort the sub-array
    on a dedicated processor. The sorted sub-arrays will then be recombined. The sub-division
    may occur multiple times depending on the size of the array.


    In the following example a large array of integers is initialized with random
    numbers and then the paralleSort method is used to sort it. Each number assigned
    to the array is between 0 (inclusive) and 1000 (exclusive).


    int[] largeArray = new int[10000];


    Random random = new Random();


    for (int i = 0; i < 10000; i++) {


    largeArray[i] = random.nextInt(1000);


    }


    Arrays.parallelSort(largeArray);


    for (int i = 0; i < 10; i++) {


    System.out.println(largeArray[i]);


    }


