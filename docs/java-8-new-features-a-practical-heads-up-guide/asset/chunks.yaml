    the keyword either before, or after, any scope modifier. A scope modifier, while
    normally desirable, is not required. Possible placements of the keyword default
    are illustrated below:


    public default void draw(){…}


    default public void draw(){…}


    default void draw(){…}


    ![](image5.jpg)


