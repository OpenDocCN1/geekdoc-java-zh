    }


    ![](image16.jpg)


    If the default keyword is left out, we get the following error message:


    interface abstract methods cannot have body


    The output of the draw method now reflects the overridden method as shown below:


    The Displayable interface''s draw method


    It is possible to make a default method abstract in a hierarchy chain. Consider
    a third interface called MoreDisplayable as declared below. The draw method is
    overridden as an abstract method.


    interface MoreDisplayable extends Displayable {


    @Override


    public abstract void draw();


    }


    ![](image17.jpg)


    When the Person class implements the MoreDisplayable interface it must implement
    the draw method. If it doesn’t, then the class must be declared as abstract.'
