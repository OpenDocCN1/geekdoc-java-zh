    2.


    To illustrate many of these techniques, we will use two helper methods: getFileName
    and getExtension. The getFileName method is passed a Path object and returns the
    name of the file. The getExtension returns the extension of the file name passed
    to it as a string.


    public static String getFileName(Path path) {


    return path.getName(


    path.getNameCount() - 1).toString();


    }


    public static String getExtension(String fileName) {


    String extension = null;


    int index = fileName.lastIndexOf(''.'');


