    of the implementation contained in a block statement. In this implementation,
    two variables and two methods are supported.


    var list = new java.util.List() {


    list: "",


    count: 0,


    add: function(item) {


    this.list += item + " ";


    this.count++;


    },


    size: function() {


    print(this.count);


    }


    };


    ![](image360.jpg)


    This implementation is tested with the following code sequence:


    list.size();


    list.add("cat");


    list.size();


    ![](image361.jpg)


    The output follows:


    0


    1


    No methods, other than those defined by the interface, can be added to the implementation.


