    Using the YearMonth, MonthDay, and Year Classes


    These classes support limited date information as their names imply. Since they
    have similar methods we will focus on the MonthDay class. 


    The MonthDay class represents a month and day combination such as August 4\. It
    is immutable and possesses a number of methods to compare or otherwise use instances
    of this class. It does not contain information regarding the year or time zone.


    This class is useful when we only need information about a month and day of the
    month. There are several static methods used to create instances of MonthDay.
    They include overloaded versions of now, of, and parse. Several of these are illustrated
    below. With the exception of the first declaration using the now method, these
    will all create a MonthDay object that represents August 4.


    MonthDay monthDay = MonthDay.now();


    monthDay = MonthDay.of(8, 4);


    monthDay = MonthDay.of(Month.AUGUST, 4);


    monthDay = MonthDay.parse("--08-04");


    ![](image317.jpg)


    The parse method requires a string formatted as “--MM-dd”. If not, it will throw
    a java.time.format.DateTimeParseException exception.


    A MonthDay object can also be created using with type methods as illustrated below.
    This will create a new MonthDay object that is the copy of the first one but the
    month has been changed to April. The withMonth version has the same effect.


    monthDay = MonthDay.now();


    monthDay = monthDay.with(Month.APRIL);


    monthDay = monthDay.withMonth(4);


    ![](image318.jpg)


    The day can be altered using the withDayOfMonth method in a similar fashion.


    We can create a LocalDate from a MonthDay instance using the atYear method as
    shown below:


    LocalDate date = monthDay.atYear(2014);


    ![](image319.jpg)


    Be careful when using MonthDay objects. A MonthDay of February 29 is considered
    to be valid. Whether it is actually valid is dependent on the year. However, a
    date of February 30 is invalid. A minimum check of possible date ranges is checked
    when specifying the month.


    The isValidYear method can be used to determine if a MonthDay instance is valid
    for a specific year. In the next example, a MonthDay object is created for February
    29\. It is then tested against the years 2012 and 2014.


    monthDay = MonthDay.of(2, 29);


    System.out.println(monthDay.isValidYear(2012));


    System.out.println(monthDay.isValidYear(2014));


    ![](image320.jpg)


    The results will be true for 2012 but false for 2014.


    Comparing MonthDay Instances


    The compareTo method returns an integer indicating the relationship between two
    MonthDay instances. A negative value is returned if the date the method is executing
    against precedes its date argument, a zero if they are equal, and a positive number
    if its argument follows the first date.


    The following will return a -1 indicating that the first instance precedes the
    second instance:


    MonthDay today = MonthDay.now();


    MonthDay nextMonth =


    today.with(today.getMonth().plus(1));


    System.out.println(today.compareTo(nextMonth));


    ![](image321.jpg)


    We can also use the isAfter and isBefore methods which compares two MonthDay instances.


    System.out.println(today.isBefore(nextMonth));


    System.out.println(nextMonth.isAfter(today));


    ![](image322.jpg)


    Both statements will display true.


    Using the Enumerations DayOfWeek and Month


    These two enumeration classes are used to specify the days of the week and months
    of the year from a human perspective. They are typically used in conjunction with
    other classes.


    Using the DayOfWeek Enumeration


    This enumeration is a convenient way of representing the days of the week. For
    example, the expression, DayOfWeek.FRIDAY, represents Friday. The values method
    returns an array of these enumerations as shown below. It also possesses a getValue
    method that returns the numeric representation for that enumeration.


    DayOfWeek days[] = DayOfWeek.values();


    for (DayOfWeek day : days) {


    System.out.println(day.getValue() + " - " + day);


    }


    ![](image323.jpg)


    The output of this sequence follows:


    1 - MONDAY


    2 - TUESDAY


    3 - WEDNESDAY


    4 - THURSDAY


    5 - FRIDAY


    6 - SATURDAY


    7 – SUNDAY


    We can create a DayOfWeek value using either the valueOf or of methods. The valueOf
    method returns an instance of the enumeration. Its string argument must be all
    uppercase to be recognized properly.


    DayOfWeek day = DayOfWeek.valueOf("TUESDAY");


    ![](image324.jpg)


    The of method accepts an integer and returns the corresponding enumeration as
    shown below:


    DayOfWeek day = DayOfWeek.of(2);


    System.out.println(day);


    ![](image325.jpg)


    The following will be displayed:


    TUESDAY


    This enumeration can be used with other classes such as the LocalDate class. In
    the following example, the current day is obtained using the now method. The with
    method is then applied to it. The result will be a LocalDate for the Tuesday of
    that week.


    LocalDate localDate = LocalDate.now();


    System.out.println(localDate.with(DayOfWeek.TUESDAY));


    ![](image326.jpg)


    Assuming that today is March 6, 2014, the output of this sequence will be as follows:


    2014-03-06


    Using the Month Enumeration


    The Month enumeration supports the 12 months of the year. Like the DayOfWeek enumeration,
    it has a values and a getValues method that we can use to display this enumeration:


    Month months[] = Month.values();


    for (Month month : months) {


    System.out.println(month.getValue() +


    " - " + month);


    }


    ![](image327.jpg)


    The output follows:


    1 - JANUARY


    2 - FEBRUARY


    3 - MARCH


    4 - APRIL


    5 - MAY


    6 - JUNE


    7 - JULY


    8 - AUGUST


    9 - SEPTEMBER


    10 - OCTOBER


    11 - NOVEMBER


    12 – DECEMBER


    A specific month can be created using the of method which takes an integer value
    corresponding to the month:


    Month month = Month.of(3);


    ![](image328.jpg)


    In addition, several methods exist that return that month’s number of days from
    the first of the year, the first month of the current quarter, and the maximum
    number of days in the month. These methods are demonstrated below using the previous
    month declaration. The argument to the firstDayOfYear method is set to true if
    the year is to be considered a leap year.


    System.out.println(month.firstDayOfYear(false));


    System.out.println(month.firstMonthOfQuarter());


    System.out.println(month.maxLength());


    ![](image329.jpg)


    The output of this sequence follows:


    60


    JANUARY


    31


    Working with the Time Zone and Offset Classes


    A time zone is a region where the time is the same within that area. It can be
    described as using one of several formats. For example, we can specify CST (Central
    Standard Time) using a time zone identifier. This identifier consists of a region
    followed by a forward slash and then a city such as "America/Chicago".


    A time zone can also be represented as an offset from Greenwich/UTC time such
    as -06:00 for Chicago. It will be -05:00 if daylight savings time is in effect.
    If we are interested in using a time zone identifier in code we use the ZoneId
    class. If we need to use an offset, the ZoneOffset class should be used.


    Temporal based classes that include the time zone include ZonedDateTime, OffsetDateTime,
    and OffsetTime. Table 13 - Time Zone Classes indicates what information is handled
    by each class.


    ***Table 13 - Time Zone Classes***


    **Class |** Date **| Time |** Time Zone ID **| Offset**


    **ZonedDateTime |** Yes **| Yes |** Yes **| Yes**


    **OffsetDateTime |** Yes **| Yes |** No **| Yes**'
