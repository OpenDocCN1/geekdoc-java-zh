    ```\n\n![](img/image254.jpg)\n\n将显示 9。\n\n### 针对原始类型的流\n\n`Stream` 接口是一个泛型类型接口，适用于许多类型的问题。当流需要与原始类型一起使用时，需要大量的装箱（boxing）和拆箱（unboxing）。因此，当需要处理大量数据时，会产生此问题。\n\
    \n当流需要与原始类型配合使用时，需要大量的装箱和拆箱。因此，当需要处理大量数据时，会产生此问题。为了解决这个问题，提供了如 `IntStream`、`LongStream`\
    \ 和 `DoubleStream` 等原始流接口。这些流操作包括：\n- count\n- sum\n- min\n- max\n\n`IntSummaryStatistics`\
    \ 类提供了对整数流的统计数据。此外，还有对应的 `DoubleSummaryStatistics` 和 `LongSummaryStatistics`。\n\
    \n### 使用 IntStream 接口\n\n`IntStream` 接口支持整数操作并具有许多有用方法。以下演示了 `IntStream` 的用法。创建一个流并应用\
    \ `mapToInt` 方法，这将返回一个 `IntStream` 对象。然后对该原始流应用 `sum` 方法，返回流中所有部分的和。\n\n```java\n\
    Stream<Part> partsStream = partsList.stream();\nint sumOfWeights = partsStream.mapToInt(\n\
    \  (Part p) -> p.getWeight()).sum();\nSystem.out.println(\"Sum: \" + sumOfWeights);\n\
    ```\n\n![](img/image255.jpg)\n\n输出如下：\n\n以下代码显式使用 `IntStream` 实现了相同的结果：\n\n```java\n\
    IntStream tmpStream = partsStream.mapToInt(\n  (Part p) -> p.getWeight());\nSystem.out.println(\"\
    Sum: \" + tmpStream.sum());\n```\n\n![](img/image256.jpg)\n\n### 理解惰性和求值评估\n\n\
    流以惰性的方式执行。这意味着大多数针对流的操作会被推迟，直到真正需要结果为止。如果没有惰性评估，流将无法无限存在。\n\n例如，考虑下面重复的 `findFirst`\
    \ 示例。`map` 和 `filter` 操作一次处理一个元素，直到出现第一个匹配项。整个流并没有被处理。中间方法在调用某些终结方法之前不会执行。\n\n\
    ```java\nOptional<Part> firstPart = partsStream.map(mapper).\n  filter(pricePredicate).findFirst();\n\
    ```\n\n![](img/image257.jpg)\n\n求值评估发生在对流中的每个元素执行操作时。有时这是必要的。例如，`forEach` 方法会处理流中的每个元素。\n\
    \n有些时候最好以惰性的方式处理流，而有些时候需要求值处理。通过将循环操作移动到流和某些集合内部，系统能够优化这些操作，并根据情况应用求值或惰性。\n\n"
- fmt: "\n# Using Parallel Stream Operations\n\nOne of the benefits of using streams\
    \ is their potential support of the concurrent execution of stream operations.\
    \ Traditional collection methods are not always thread-safe. Often explicit thread\
    \ synchronization mechanisms must be used to address the potential corruption\
    \ of data. The use of synchronization can introduce thread contention issues.\
    \ Parallel stream operations can avoid these issues if the collection being acted\
    \ on is not modified.\n\nBear in mind that the concurrent execution of stream\
    \ operations does not necessarily mean that an application will run faster. For\
    \ small collections, the overhead involved in supporting parallel execution may\
    \ be larger than the time required to perform the same set of operations in a\
    \ sequential manner.\n\nWhen a stream is parallelized, the run-time environment\
    \ will split the stream into multiple parts, execute each part on a separate processor,\
    \ and then combine the results. Operations on a stream are performed sequentially\
    \ by default. To affect parallel execution either the `Collection` interface’s\
    \ `parallelStream` method or the `BaseStream` interface’s `parallel` method needs\
    \ to be used.\n\nLet’s start with the following declarations of a list and stream:\n\
    \n```java\nList<Part> partsList = Arrays.asList(\n    new Part(\"Pencil\", 100,\
    \ 5, 0.15f),\n    new Part(\"Eraser\", 200, 3, 0.25f),\n    new Part(\"Paper\"\
    , 2000, 1, 0.03f),\n    new Part(\"Pen\", 200, 3, 0.25f),\n    new Part(\"Staple\"\
    , 3000, 1, 0.01f)\n);\n\nStream<Part> partsStream = partsList.stream();\n```\n\
    \n![](image258.jpg)\n\nA sequential stream that filters out those parts whose\
    \ weight is less than 3 is shown below:\n\n```java\npartsStream.filter(\n  (p)->p.getWeight()>=3).\n\
    \  forEach(p -> System.out.println(p));\n```\n\n![](image259.jpg)\n\nThe same\
    \ operation performed, using a parallel stream, uses the `parallel` method as\
    \ seen here:\n\n```java\npartsStream.parallel().\n  filter((p)->p.getWeight()>=3).\n\
    \  forEach(p -> System.out.println(p));\n```\n\n![](image260.jpg)\n\nThe output\
    \ of both of these sequences follows and is identical for each example:\n\nName:\
    \ Eraser  Weight:   3  Part Number:  200 Price: 0.25\nName: Pencil  Weight:  \
    \ 5  Part Number:  100 Price: 0.15\n\nHowever, converting a sequential stream\
    \ to a parallel stream is not always this simple. Reduction type operations need\
    \ to be handled more carefully. In the following example a `Map` is created whose\
    \ key is an integer weight. The `groupingBy` method will return a list whose members\
    \ have the same weight. These lists are then assigned to the map.\n\n```java\n\
    Map<Integer, List<Part>> groupByWeight =\n  partsStream.collect(\n    Collectors.groupingBy(Part::getWeight));\n\
    \nfor(Part part : groupByWeight.get(3)) {\n  System.out.println(part);\n}\n```\n\
    \n![](image261.jpg)\n\nThe output follows:\n\nName: Eraser  Weight:   3  Part\
    \ Number:  200 Price: 0.25\nName: Pen      Weight:   3  Part Number:  200 Price:\
    \ 0.25\n\nTo achieve the same results using a parallel stream requires a couple\
    \ of modifications as shown below. To improve the performance of the operation,\
    \ a `ConcurrentMap` is needed and the `groupingByConcurrent` method should be\
    \ used.\n\n```java\nConcurrentMap<Integer, List<Part>> groupByWeight =\n  partsStream.parallel().collect(\n\
    \    Collectors.groupingByConcurrent(Part::getWeight));\n\nfor (Part part : groupByWeight.get(3))\
    \ {\n  System.out.println(part);\n}\n```\n\n![](image262.jpg)\n\nTo affect concurrent\
    \ reduction, the following rules need to be considered:\n\n- The stream is a parallel\
    \ stream\n- The collector used has the characteristic: `CONCURRENT`\n- The stream\
    \ should be unordered\n\nFor a stream to take advantage of multiple processors,\
    \ a parallel stream needs to be used. However, when using a parallel stream:\n\
    \n- Be aware of adverse side effects\n- Avoid stateful lambda expressions\n\n\
    A side effect can occur in a stream when one of its operations modifies the state\
    \ of the application. Operations such as the `println` method and mutable reductions\
    \ have side effects. Most side effects are handled within a stream. However, problems\
    \ can occur when a stream operation modifies the source of the stream. This is\
    \ called interference.\n\nIn the following example, an attempt is made to modify\
    \ the original `partsList`, using the `add` method as part of the predicate operation:\n\
    \n```java\npartsList.stream().\n  filter((p)->{\n    partsList.add(p);\n    return\
    \ p.getWeight()>=3;\n  }).\n  forEach(p -> System.out.println(p));\n```\n\n![](image263.jpg)\n\
    \nThis will generate a `java.lang.UnsupportedOperationException` exception when\
    \ the statement is executed. Modifying a different list will not result in an\
    \ exception.\n\nA stateful lambda expression is one where the results are dependent\
    \ on a state that might change during the execution of the lambda expressions.\
    \ For example, the value returned by the following filter operation depends on\
    \ some external condition:\n\n```java\nboolean someCondition = …;\n\npartsStream.parallel().\n\
    \  filter(p -> {\n    if (someCondition) {\n      return true;\n    } else {\n\
    \      return false;\n    }\n  }).\n  forEach(p -> System.out.println(p));\n```\n\
    \n![](image264.jpg)\n\n# Conclusion\n\nA stream is a collection of elements. The\
    \ elements of a stream can be of any type. Operations are performed on its elements\
    \ in a pipeline fashion. This can result in a more natural and concise solution\
    \ to a problem. In addition, when executed as a parallel stream it will execute\
    \ faster.\n\nA stream must first be created. A stream can be created from multiple\
    \ sources including arrays and lists. The length of a stream can be unbounded\
    \ but once a stream has been processed it cannot be reused.\n\nThere are numerous\
    \ operations that can be applied against the elements of a stream. These include\
    \ operations such as transforming an element, filtering elements, reducing elements,\
    \ or limiting the size of the stream. Operations can be chained together to create\
    \ a pipeline. In addition, lambda expressions are frequently used with streams\
    \ to improve the flexibility and expressiveness of streams.\n\nWhen a stream is\
    \ parallelized, care must be taken to ensure that it will function as intended.\
    \ Any collectors used must be concurrent and the stream should be unordered. In\
    \ the next chapter we will examine the improvements to how date and time are handled.\n\
    \n* * * * *\n\n# Chapter 4 – Date and Time\n\n## Introduction\n\n- Why a New API?\n\
    - A Simple Example\n- The ISO-8601 String Format\n- Design Considerations\n- Understanding\
    \ the Standard Method Names\n    - Understanding the `of` Type Methods\n    -\
    \ Understanding the `from` Method\n    - Understanding the `parse` Method\n  \
    \  - Understanding the `format` Method\n    - Understanding the `get` Type Method\n\
    \    - Understanding the `is` Type Methods\n    - Understanding the `with` Type\
    \ Methods\n    - Understanding the `plus` Type Methods\n    - Understanding the\
    \ `minus` Type Methods\n    - Understanding the `to` Type Methods\n    - Understanding\
    \ the `at` Type Methods\n- Overview of the Date and Time Packages\n\n## Getting\
    \ the Current Time\n\n- Working with the `Instant` Class\n    - Creating an `Instant`\n\
    \    - Creating an `Instant` Based on the Epoch\n    - Creating an `Instant` Based\
    \ on Parsing a UTC String\n    - Creating an `Instant` by Adding or Subtracting\
    \ a Time from an `Instant`\n    - Using the `Instant` Class’s `get` Type Methods\n\
    - Working with Time Intervals\n    - Creating Offsets Using the `of` Type Methods\n\
    \    - Creating Offsets Using the `with` Type Methods\n    - Creating a `Duration`\
    \ Using the `parse` Method\n    - Creating a `Duration` by Adding or Subtracting\
    \ a Unit\n    - Using the `Duration` Class\n- Using the `Period` Class\n\n## Using\
    \ Date and Time Classes\n\n- Creating Date and Time Classes\n    - Date and Time\
    \ `get` Type Methods\n    - Adjusting a Date or Time\n    - Using the `YearMonth`,\
    \ `MonthDay`, and `Year` Classes\n        - Comparing `MonthDay` Instances\n \
    \   - Using the Enumerations `DayOfWeek` and `Month`\n        - Using the `DayOfWeek`\
    \ Enumeration\n        - Using the `Month` Enumeration\n\n## Working with the\
    \ Time Zone and Offset Classes\n\n- Obtaining Available Zone Ids\n- Working with\
    \ `ZoneOffsets`\n- Working with `ZoneRules`\n\n## Formatting, Queries, and Value-Based\
    \ Classes\n\n- Formatting Dates and Times\n- Using Temporal Queries\n- Understanding\
    \ Value-Based Classes\n\n## Conclusion\n"
  raw: 'Using Parallel Stream Operations


    One of the benefits of using streams is their potential support of the concurrent
    execution of stream operations. Traditional collection methods are not always
    thread-safe. Often explicit thread synchronization mechanisms must be used to
    address the potential corruption of data. The use of synchronization can introduce
    thread contention issues. Parallel stream operations can avoid these issues if
    the collection being acted on is not modified.


    Bear in mind that the concurrent execution of stream operations does not necessarily
    mean that an application will run faster. For small collections, the overhead
    involved in supporting parallel execution may be larger than the time required
    to perform the same set of operations in a sequential manner.


    When a stream is parallelized, the run-time environment will split the stream
    into multiple parts, execute each part on a separate processor, and then combine
    the results. Operations on a stream are performed sequentially by default. To
    affect parallel execution either the Collection interface’s parallelStream method
    or the BaseStream interface’s parallel method needs to be used.


    Let’s start with the following declarations of a list and stream:


    List<Part> partsList = Arrays.asList(


    new Part("Pencil", 100, 5, 0.15f),


    new Part("Eraser", 200, 3, 0.25f),


    new Part("Paper", 2000, 1, 0.03f),


    new Part("Pen", 200, 3, 0.25f),


    new Part("Staple", 3000, 1, 0.01f)


    );


    Stream<Part> partsStream = partsList.stream();


    ![](image258.jpg)


    A sequential stream that filters out those parts whose weight is less than 3 is
    shown below:


    partsStream.filter(


     (p)->p.getWeight()>=3).


    forEach(p -> System.out.println(p));


    ![](image259.jpg)


    The same operation performed, using a parallel stream, uses the parallel method
    as seen here:


    partsStream.parallel().


    filter((p)->p.getWeight()>=3).


    forEach(p -> System.out.println(p));


    ![](image260.jpg)


    The output of both of these sequences follows and is identical for each example:


    Name: Eraser   Weight:   3  Part Number:   200 Price: 0.25


    Name: Pencil   Weight:   5  Part Number:   100 Price: 0.15


    However, converting a sequential stream to a parallel stream is not always this
    simple. Reduction type operations need to be handled more carefully. In the following
    example a Map is created whose key is an integer weight. The groupingBy method
    will return a list whose members have the same weight. These lists are then assigned
    to the map.


    Map<Integer, List<Part>> groupByWeight =


    partsStream.collect(


    Collectors.groupingBy(Part::getWeight));


    for(Part part : groupByWeight.get(3)) {


    System.out.println(part);


    }


    ![](image261.jpg)


    The output follows:


    Name: Eraser   Weight:   3  Part Number:   200 Price: 0.25


    Name: Pen      Weight:   3  Part Number:   200 Price: 0.25


    To achieve the same results using a parallel stream requires a couple of modifications
    as shown below. To improve the performance of the operation, a ConcurrentMap is
    needed and the groupingByConcurrent method should be used.


    ConcurrentMap<Integer, List<Part>> groupByWeight =


    partsStream.parallel().collect(


    Collectors.groupingByConcurrent(Part::getWeight));


    for (Part part : groupByWeight.get(3)) {


    System.out.println(part);


    }


    ![](image262.jpg)


    To affect concurrent reduction, the following rules need to be considered:


    - The stream is a parallel stream


    - The collector used has the characteristic: CONCURRENT


    - The stream should be unordered


    For a stream to take advantage of multiple processors, a parallel stream needs
    to be used. However, when using a parallel stream:


    - Be aware of adverse side effects


    - Avoid stateful lambda expressions


    A side effect can occur in a stream when one of its operations modifies the state
    of the application. Operations such as the println method and mutable reductions
    have side effects. Most side effects are handled within a stream. However, problems
    can occur when a stream operation modifies the source of the stream. This is called
    interference.


    In the following example, an attempt is made to modify the original partsList,
    using the add method as part of the predicate operation:


    partsList.stream().


    filter((p)->{


    partsList.add(p);


    return p.getWeight()>=3;}).


    forEach(p -> System.out.println(p));


    ![](image263.jpg)


    This will generate a java.lang.UnsupportedOperationException exception when the
    statement is executed. Modifying a different list will not result in an exception.


    A stateful lambda expression is one where the results are dependent on a state
    that might change during the execution of the lambda expressions. For example,
    the value returned by the following filter operation depends on some external
    condition:


    boolean someCondition = …;


    partsStream.parallel().


    filter(p -> {


    if (someCondition) {


    return true;


    } else {


    return false;


    }


    }).


    forEach(p -> System.out.println(p));


    ![](image264.jpg)


    Conclusion


    A stream is a collection of elements. The elements of a stream can be of any type.
    Operations are performed on its elements in a pipeline fashion. This can result
    in a more natural and concise solution to a problem. In addition, when executed
    as a parallel stream it will execute faster.


    A stream must first be created. A stream can be created from multiple sources
    including arrays and lists. The length of a stream can be unbounded but once a
    stream has been processed it cannot be reused.


    There are numerous operations that can be applied against the elements of a stream.
    These include operations such as transforming an element, filtering elements,
    reducing elements, or limiting the size of the stream. Operations can be chained
    together to create a pipeline. In addition, lambda expressions are frequently
    used with streams to improve the flexibility and expressiveness of streams.


    When a stream is parallelized, care must be taken to ensure that it will function
    as intended. Any collectors used must be concurrent and the stream should be unordered.
    In the next chapter we will examine the improvements to how date and time are
    handled.


    * * * * *


    Chapter 4 – Date and Time


