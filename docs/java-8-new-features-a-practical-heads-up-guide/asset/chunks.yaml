    The first expression uses two declared parameters and is legal. The second expression
    is illegal because one parameter is declared explicitly while the second is declared
    implicitly.


    IntegerMathType<Integer> addition =


     (Integer a, Integer b) -> {return a + b;};


    IntegerMathType<Integer> addition =


     (Integer a, b) -> {return a + b;}; // Illegal


    ![](image86.jpg)


    The error message generated for the second expression is as follows:


    <identifier> expected


    incompatible types: incompatible parameter types in lambda expression


    Omitting Parentheses


    Parentheses can be omitted in some situations. Consider the following declaration
    of the functional interface ComputableType:


    interface ComputableType<T> {


    T compute(T x);


    }


    ![](image87.jpg)


