    Using Default Methods


    Default methods can be used in many situations. This section identifies and illustrates
    many of these possible uses. These include extending existing interfaces and supplementing
    adapter classes.


    Extending Existing Interfaces


    When adding a new abstract method to an existing interface, classes that have
    already implemented the interface will break since they no longer implement the
    new method. However, adding a default method will allow new methods to be added
    without breaking previous implementations. Traditionally, when an interface is
    defined it is treated as a contract and is not expected to change.


    However, should the interface need to change, then the availability of default
    methods means that the interface can change and that change will not affect existing
    code. This permits existing interfaces to continue to be useable when new default
    methods are added. Older, existing usage of the interfaces does not break.


    Consider the following interface that has a single abstract method draw:


    interface Drawable {


    public void draw();


    }


    ![](image35.jpg)


    When a class such as Person implements that interface it only needs to implement
    the draw method:


    class Person implements Drawable {


    public void draw() {


    System.out.println("The Person''s draw method");


    }


    }


    ![](image36.jpg)


    However, if we add another abstract method to the Drawable interface, such as
    a drawWithQuotes method as shown below, we will introduce errors into the Person
    class:


    interface Drawable {


    public void draw();


    public void drawWithQuotes();


    }


    ![](image37.jpg)


    The error message will be:


    Person is not abstract and does not override abstract method drawWithQuotes()
    in Drawable


    We are not able to easily add new methods without breaking old code written prior
    to Java 8\. If, instead, we use a default method in the Drawable interface as
    follows, the error goes away. Our code will compile and execute correctly.


    interface Drawable {


    public void draw();


    public default void drawWithQuotes() { }


    }


    ![](image38.jpg)


    Using Default Methods to Supplement Adapter Classes


    While classes such as the MouseMotionAdapter class have not been replaced with
    default method interface implementations, it is possible to provide similar functionality
    using default methods. As an example, consider a MouseMotionAdapter interface
    equivalent. A simplified version of the MouseMotionAdapter source code, as found
    in Java 8, is shown below:


    public abstract class MouseMotionAdapter implements MouseMotionListener {


    public void mouseDragged(MouseEvent e) {};


    public void mouseMoved(MouseEvent e) {};


    }


    ![](image39.jpg)


    An “equivalent” interface could appear as follows:


    public interface MouseMotionAdapterInterface extends MouseMotionListener {


    public default void mouseDragged(MouseEvent e) { };


    public default void mouseMoved(MouseEvent e) { };


    }


    ![](image40.jpg)


    As example of using the MouseMotionAdapter follows. This code will print the current
    x coordinate of the mouse as the mouse moves across the window.


    public static void main(String[] args) {


    JFrame frame = new JFrame();


    frame.addMouseMotionListener(new MouseMotionAdapter() {


    public void mouseMoved(MouseEvent e) {


    System.out.println(e.getX());


    }


    });


    frame.setBounds(100, 100, 500, 300);


    frame.setVisible(true);


    }


    ![](image41.jpg)


    To demonstrate the use of the MouseMotionAdapterInterface we will use the following
    code. The code is equivalent to the previous example except that an instance of
    the MouseMotionAdapterInterface interface is used instead of MouseMotionAdapter.
    Otherwise, the code behaves in the same way.


    public static void main(String[] args) {


    JFrame frame = new JFrame();


    frame.addMouseMotionListener(


    new MouseMotionAdapterInterface() {


    public void mouseMoved(MouseEvent e) {


    System.out.println(e.getX());


    }


    });


    frame.setBounds(100, 100, 500, 300);


    frame.setVisible(true);   


    }


    ![](image42.jpg)


    The major difference is found in any implementation provided by the default method.
    If needed, we can add default behavior to default methods such as code to support
    logging.


    Using Default Methods in Core Java Classes


    The addition of lambda expressions is a major change to Java 8\. For the developer
    to take advantage of this feature and yet still use interfaces, such as those
    of the collection libraries, it is desirable to use default methods to extend
    the interfaces.


    As an example, the default forEach method has been added to the java.lang.Iterable
    interface as shown below. This method accepts an object that implements the Consumer
    functional interface. The forEach method will iterate through each element of
    the list and apply the Consumer instance’s accept method against each element.
    The Objects class’ requireNonNull method, added with Java 7, validates that the
    action object is not null.


    public interface Iterable<T> {


    Iterator<T>iterator();


    default void forEach(Consumer<? super T> action) {


    Objects.requireNonNull(action);


    for (T t : this) {


    action.accept(t);


    }


    }


    …


    }


    ![](image43.jpg)


    We can now use the accept method with new code without breaking existing code.
    In the following example the Person class has been modified with the addition
