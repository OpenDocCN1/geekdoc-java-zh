    # API Principles


    1. Methods should be easy to understand

    2. A fluent style of programming should be supported

    3. Objects should be immutable

    4. The API should be extendable


    The methods of the API are written to be easily understood and clear to a user.
    They should be as consistent between classes as possible. These names themselves
    have been standardized as much as possible and are shown in Table 2 - Method Naming
    Convention Summary.


    A fluent style of programming is supported to make it easier to use. Fluency is
    supported by chaining easy-to-understand methods together making them easy to
    learn.


    Most of the objects created using the classes of the API are immutable. The chief
    advantage of this design decision is that they are thread-safe. Constructors often
    are not available which means static factory type methods are frequently used.
    Immutable objects are easy to construct and are good for hash keys.


    Most of the API classes possess methods that appear to modify a date or time object.
    However, these methods use the object they are executing against, perform any
    adjustment to this date or time, and then return a new object. The original object,
    being immutable, is not modified.


    The API provides the developer with the ability to extend and create unique calendar
    systems when needed. This allows extension of the API to address unique needs
    as they arise.


    # Understanding the Standard Method Names


    The purpose of this section is to provide a high level overview of the methods
    used by the API. Understanding the intent of these names will make them easier
    to use. It will become more obvious which methods should be used in a given situation.


    The API classes and interfaces possess a number of methods with similar, if not
    identical, names. This is done to promote their readability and ease of use. Table
    2 - Method Naming Convention Summary summarizes these methods.


    The `of`, `from`, and `parse` type methods are static factory methods and provide
    the primary tool for the creation of date and time objects. The other methods
    are instance methods and provide techniques to format, get fields, return modified
    objects, or otherwise transform one object into a different type.


    Many of these methods are overloaded or use the same prefix. To assist you in
    putting these methods into perspective, various tables are found in Appendix A
    which have organized these methods by type.


    ### Table 2 - Method Naming Convention Summary


    | Type | Prefix | Use |

    | :--- | :--- | :--- |

    | Creation | `of` | Creates an instance based on its parameters |

    | Creation | `from` | Creates an instance where some information may be lost |

    | Creation | `parse` | Creates an instance by parsing an input string |

    | Formatting | `format` | Returns a formatted string |

    | State Information | `get` | Returns a state of the target object |

    | State Information | `is` | Returns a boolean value relating to the state of
    the object |

    | Modification | `with` | Returns a new object that differs by one element |

    | Modification | `plus` | Returns a new object with a time unit added |

    | Modification | `minus` | Returns a new object with a time unit subtracted |

    | Modification | `to` | Converts the target object to a different type |

    | Modification | `at` | Combine the object with another to produce a new object
    |


    ![](image271.jpg)


    # Understanding the `of` Type Methods


    The `of` type methods are similar in usage. They differ in their arguments and
    return types. They are all static and return an instance of that class. The `of`
    Type Methods section in Appendix A provides a list of type methods that are available.
    The following code sequence illustrates how an instance of the `LocalDate` class
    can be created using this method. The integer arguments correspond to year, month,
    and day.


    ```

    LocalDate localDate = LocalDate.of(2014, 3, 6);

    ```


    ![](image272.jpg)


    # Understanding the `from` Method


    The `from` method is very consistent in its signature from class to class with
    the exception of the `Duration` class. Each `from` method is a static method that
    returns an instance of the class it executes against. Each `from` method accepts
    a `TemporalAccessor` object as an argument with the exception of the `Duration`
    class which uses a `TemporalAmount` object. The `from` Method section in Appendix
    A provides a list from type methods that are available.


    The following sequence creates a `LocalDate` from a `LocalDateTime`:


    ```java

    LocalDateTime ldt = LocalDateTime.now();

    LocalDate localDate = LocalDate.from(ldt);

    ```


    ![](image273.jpg)


    # Understanding the `parse` Method


    The static `parse` method is fairly consistent between those implementing classes.
    It uses either one or two arguments. The first argument is always a `CharSequence`.
    When the second argument is present, it is a `DateTimeFormatter` instance. The
    `parse` Method section in Appendix A provides a list of parse methods that are
    available.


    In this example, the `parse` method is executed against an `Instant` to create
    a date at midnight January 1, 2010.


    ```java

    Instant instant = Instant.parse("2010-01-01T00:00:00.000Z");

    ```


    ![](image274.jpg)


    # Understanding the `format` Method


    The `format` method is used by classes which support human readable dates and
    time. It uses a `DateTimeFormatter` instance which controls how the date is formatted.
    In the following example, the `ISO_DATE` format is used:


    ```java

    LocalDate localDate = LocalDate.of(2014, 3, 6);

    System.out.println(localDate.format(DateTimeFormatter.ISO_DATE));

    ```


    ![](image275.jpg)


    The output appears as follows:

    2014-03-06


    The following classes possess this method: `LocalDate`, `LocalDateTime`, `LocalTime`,
    `MonthDay`, `OffsetDateTime`, `OffsetTime`, `Year`, `YearMonth`, `ZonedDateTime`.


    # Understanding the `get` Type Method


    The `get` type methods return information about an object. The methods supported
    depend on the needs of the class. The `get` Type Methods section in Appendix A
    provide a list of type methods that are available.


    In the following example, the day of the year is returned based on a `LocalDate`
    object:


    ```java

    LocalDate localDate = LocalDate.of(2014, 3, 6);

    int dayOfYear = localDate.getDayOfYear();

    System.out.println(dayOfYear);

    ```


    ![](image276.jpg)


    The output will be 65. Specific `get` methods are discussed in their respective
    class discussions.


    # Understanding the `is` Type Methods


    The `is` type methods all return a boolean value. The actual method supported
    by a class is dependent on the requirements of the class. The `is` Type Methods
    section in Appendix A provides a list of type methods that are available.


    To demonstrate the `isAfter` method, we create an `Instant` that represents the
    current date and time as shown below. This is then compared to the epoch.


    ```java

    Instant now = Instant.now();

    System.out.println(now.isAfter(Instant.EPOCH));

    ```


    ![](image277.jpg)


    The output will be true.


    # Understanding the `with` Type Methods


    These methods always return an instance of the class they execute against. The
    methods supported vary by class. In general, they return a modified version of
    the original class. The `with` Type Methods section in Appendix A provides a list
    of type methods that are available.


    In the following code sequence, the last day of the month is determined using
    a `TemporalAdjusters`. This class provides a number of interesting methods to
    adjust a date to a different value.


    ```java

    LocalDate localDate = LocalDate.of(2014, 3, 6);

    LocalDate endOfMonth = localDate.with(TemporalAdjusters.lastDayOfMonth());

    System.out.println(endOfMonth.toString());

    ```


    ![](image278.jpg)


    The output will be:

    2014-03-31


    # Understanding the `plus` Type Methods


    These methods return a new object after adding a time unit to an existing object.
    The object returned is of the same type as the object the method was executed
    against. The methods supported depend on the class. The `plus` Type Methods section
    in Appendix A provides a list of plus type methods that are available.


    In this example, one day is added to the `localDate`:


    ```java

    LocalDate localDate = LocalDate.of(2014, 3, 6);

    LocalDate nextDay = localDate.plusDays(1);

    ```


