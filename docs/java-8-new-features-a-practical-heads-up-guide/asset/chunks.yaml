  raw: 'The Collection interface’s parallelStream method is another example of a default
    method, as shown below. The concept of Streams will be discussed in detail in
    Chapter 3.


    public interface Collection<E> extends Iterable<E> {


    ...


    default Stream<E>parallelStream() {


    returnStreamSupport.stream(spliterator(), true);


    }


    }


    ![](image46.jpg)


    Programmers can take advantage of these default method additions without the need
    to modify existing code. In the case of streams, it has the potential advantage
    of enhanced performance on multi-core machines.


    Using a Class to Support Default Methods


    Here we will illustrate how a class and interface can work together to support
    a state. This version of the Drawable interface uses two abstract and two default
    methods: draw and isNotDrawable. The default methods are dependent on the implementation
    of the abstract methods of the implementing class. The getString method should
    return the string used by the draw method. The isDrawable and isNotDrawable methods
    are intended to determine if the subject is, in fact, drawable.


    interface Drawable {


    public abstract String getString();


    default void draw() {


    System.out.println(getString());


    }


    abstract boolean isDrawable();


    default boolean isNotDrawable() {


    return !isDrawable();


    }


    }


    ![](image47.jpg)


    The following illustrates an implementation of the Person class where two abstract
    methods have been implemented:


    class Person implements Drawable {


    public String getString() {


    return "Person";


    }


    public boolean isDrawable() {


    return true;


    }


    }


    ![](image48.jpg)


    To test this implementation we use the following:


    Person person = new Person();


    person.draw();


    System.out.println(person.isNotDrawable());


    ![](image49.jpg)


    The output follows:


    Person


    false


    Understanding the Difference between an Abstract Class and Interfaces


    Abstract classes and interfaces with default methods may appear to be the same
    but there are several differences between them. These are summarized in Table
    2: Abstract Class versus Interface. A class can only extend one class while multiple
    inheritance is supported between interfaces. State information is contained in
    instance variables. These are not allowed in interfaces. While we haven’t discussed
    lambda expressions in detail, yet, an instance of a functional interface can be
    used with lambda expressions. This is not possible with abstract classes.


    The decision to use an abstract class versus an interface is dependent on the
    needs of your application.


    ***Table 2: Abstract Class versus Interface***


    **Characteristic** | Abstract Class | **Interface**


    **Supports multiple inheritance** | No | **Yes**


    **Can have a constructor** | Yes | **No**


    **Can have a state** | Yes | **No**


    **Can be used with lambda expressions** | No | **Yes**


    ![](image50.jpg)


    Using Static Interface Methods


    Static methods can be added to interfaces in Java 8\. The following illustrates
    the use of a static method in the Drawable interface. In this example, the getStandardUnit
    method is intended to return the standard unit of measure.


    enum Unit {pixel, inch, millimeter};


    interface Drawable {


    public default void draw(){


    System.out.println(


    "The Drawable interface''s draw method");


    }


    public static Unit getStandardUnit() {


    return Unit.pixel;


    }


    }


    ![](image51.jpg)


    The following illustrates the use of this interface where the Shape class implements
    the Drawable interface:


    class Shape implements Drawable {}


    public class TestExample {   


    public TestExample() {


    Shape shape = new Shape();


    shape.draw();


    System.out.println(Drawable.getStandardUnit());


    }


    }


    ![](image52.jpg)


    The output follows:


    The Drawable interface''s draw method


    Pixel


    Though the Shape class implements the Drawable interface, it does not possess
    the static method getStandardUnit. The following illustrates an attempt to use
    it:


    System.out.println(Shape.getStandardUnit());


    ![](image53.jpg)


    This will result in the following syntax error message:


    cannot find symbol


    symbol:   method getStandardUnit()


    location: class Shape


    The addition of static methods to interfaces eliminates the need to create a helper
    class whose sole purpose is to provide static methods. They can now be integrated
    into the interface. The following illustrates the creation of the Drawable interface
    and a helper class that would be needed if default methods were not used:


    enum Unit {pixel, inch, millimeter};


    public interface Drawable {


    ... 


    }


    class DrawableHelper {


    public static Unit getStandardUnit() {


    return Unit.pixel;


    }


    }


    ![](image54.jpg)


    We can then use the class as follows:


    Shape shape = new Shape();


    shape.draw();


    System.out.println(DrawableHelper.getStandardUnit());


    ![](image55.jpg)


    While it takes the same number of statements to use the static method, we had
    to create an additional class with this approach.


    Functional Interfaces


    Functional interfaces are interfaces that have one, and only one, abstract method.
    However, these interfaces can have any number of default methods. Since there
    is only one abstract method, the compiler knows that that method will be the one
    used in certain situations. The existence of a single abstract method enables
    them to be used in interesting and powerful ways as exemplified by lambda expressions.
    As we will see, since a functional interface has only one abstract method, a lambda
    expression that matches the abstract method, can be used easily. This abstract
    method is referred to as the functional method.


    In this section, we will learn more about functional expressions including the
    use of the @FunctionalInterface notation and how they have been incorporated into
    the Java core libraries. Detailed discussion of lambda expressions is postponed
    until Chapter 2.


    Technically, a functional interface has one and only one non-Object method. As
    discussed in the Overriding Object Class Methods in a Functional Interface section,
    it is possible to override an Object method as abstract thus introducing more
    than one abstract method in a functional interface.


    Creating a Functional Interface


    The following illustrates a simple functional interface. It consists of a single
    abstract method.


    public interface Drawable {


    public abstract void draw();   


    }


    ![](image56.jpg)


    A functional interface can remain a functional interface and yet have one or more
    non-abstract methods as illustrated below:


    public interface Drawable {


    public abstract void draw();


    public default boolean hasBeenDrawn() {


    return true;


    }


    }


    ![](image57.jpg)


    The abstract method of a functional interface is called the functional method.
    In the previous example, the draw method is the functional method.


    A function descriptor is the method type of the functional method. It consists
    of the parameter types, return type, and any exceptions thrown by that functional
    method. In the previous example, its method type consists of a method with no
    parameters, no return type, and it does not throw an exception. It is about as
    simple as things get. As we will see in Chapter 2, a function descriptor is represented
    by a lambda expression. The lambda expression is then matched against a functional
    method.


    Using  the @FunctionalInterface Annotation


    The @FunctionalInterface annotation is available to inform the compiler that the
    interface should contain a single abstract function. The following illustrates
    its use:


    @FunctionalInterface


    public interface Drawable {


    public abstract  void draw();


    }


    ![](image58.jpg)


    The next three Drawable interface declarations illustrate invalid functional interfaces.
    In the first two declarations, the interfaces do not possess an abstract method:


    @FunctionalInterface


    interface Drawable {


    public default void draw() {


    System.out.println(


    "The Drawable interface''s draw method");


    }


    }


    @FunctionalInterface


    public interface Drawable {


    }


    ![](image59.jpg)


    The error message generated for both of these examples is the same:


    Unexpected @FunctionalInterface annotation'
