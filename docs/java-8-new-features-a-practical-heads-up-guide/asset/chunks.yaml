    Defining a Default Method


    Let’s examine the details of creating and using a default method. The default
    keyword is always used to declare a default method. Technically, the keyword would
    not seem to be necessary. After all, it is clear from the existence of the method’s
    body that it is not abstract. The main reason it is required is to make it obvious
    that the method is implemented.


