    A significant addition to Java 8 is the introduction of the new date and time
    API intended to replace the existing `java.util.Date` and `java.util.Calendar`
    classes. It is based on the Joda (http://joda-time.sourceforge.net/) effort and
    is a large and rich API. Complete documentation of the API can be found at http://download.java.net/jdk8/docs/api/.


    The date and time API is based on the ISO-8601 standard ([http://www.iso.org/iso/home/standards/iso8601.htm](http://www.iso.org/iso/home/standards/iso8601.htm))
    which uses the Gregorian calendar, the de facto date standard used throughout
    the world. The standard provides a way of expressing dates and handles leap years
    as well. However, it is not appropriate to use it to represent historical dates.
    Other calendar systems are supported in the `java.time.chrono` package.


    Coordinate Universal Time (UTC) is the primary time standard in use today. It
    incorporates time zones and uses a time offset from `UTC` which is found along
    zero degrees longitude. The term, temporal-based, refers to classes such as `LocalDate`
    and `ZonedDateTime` which reflect different ways of expressing time.


    There are several ways of organizing a discussion of the API. Time can be understood
    from a human perspective using measurements such as months and seconds. It can
    also be understood from the perspective of a computer. This measurement typically
    measures time from the `epoch` (January 1, 1970) in units such as milliseconds
    or nanoseconds. Both of these two perspectives are supported by the API giving
    the developer the option of using the most appropriate approach based on the context
    of the problem. These two types can be referred to as human time and machine time.


    Human time is generally preferred when working with days as found in a calendar.
    Machine time is often preferred when dealing with durations of time such as the
    number of milliseconds between two events. However, it could also be expressed
    in human time such as the difference between two days.


    An `instant` is an instantaneous point along a timeline. You can use this to represent
    events or at least the point in time the event occurs. It can be thought of as
    an event timestamp.


    We also talk about time in terms of how long an activity occurs. Java 8 uses a
    `Duration` class to designate intervals measured in units like minutes or seconds.
    `Duration` can be used for a range such as the time it takes to open a valve or
    the length of an animation cycle. There is also the `Period` class that deals
    with intervals measured in days and months.


    Many of the examples used in this chapter are dependent on the current date and
    time. As a result, the output of these examples may not reflect today’s date or
    time. However, they should reflect the current date and time when executed.


    ## Why a New API?


    The date and time classes available before Java 8 had a number of problems. For
    example, they were mutable which made them difficult to work with across threads.
    They were often not type safe and the internal numbers used to represent units
    such as months made them difficult to work with. It has also been difficult to
    support internationalization with the older Java date and time classes.


    ## A Simple Example


    Let’s start with an example that determines whether an individual is currently
    working. The worker is located in La Paz Bolivia, starts work at 8:00 in the morning
    and works for 6 hours. We want to call the individual from some other location,
    but before we call we want to make sure that they are scheduled to work.


    First we need to determine the current time. We could use the `DateTime` class
    but this class does not include time zone information. So we use the `ZonedDateTime`
    class. It possesses a `now` method that returns an instance of the class representing
    the current date and time at our location. The following code sequence illustrates
    how this is done and then displays this date and time:


    ```

    ZonedDateTime present = ZonedDateTime.now();

    System.out.println(present);

    ```


    ![](image265.jpg)


    The output that follows uses the ISO 8601 date and time representation scheme:


    `2014-03-05T19:50:14.613-06:00[America/Chicago]`


    The output string starts with date: March 3, 2014. The ''T'' demarks the beginning
    of the time expression. In this case it represents a time of 7:50 PM plus 14 minutes
    and 0.613 seconds. The next sequence, `-06:00`, shows the offset from `UTC`. The
    last part of the expression lists the time zone enclosed in brackets.


    We need to represent the start time and duration of the worker in La Paz. To get
    this representation we start by creating a `ZoneId` object that represents the
    time zone. This is followed by the start time using a `LocalTime` object, and
    the length of the employee’s shift using a `Duration` object. These objects are
    created as follows:


    ```

    ZoneId timeZone = ZoneId.of("America/La_Paz");

    LocalTime startWorkDay = LocalTime.of(8,0);

    Duration dailyTime = Duration.ofHours(6);

    ```


    ![](image266.jpg)


    To determine if the employee is working, we need a start time and an end time
    that is based on his time zone. There are several ways of creating these two times.
    In the following code sequence, we first create a `LocalDate` called `employeeDate`,
    used to represent a day, month, and year value. It is then used with the `startWorkDay`
    and `timeZone` variables to create a start time of type `ZonedDateTime`. This
    date and time is then displayed using the `DateFormatter` class. The `ofLocalizedDateTime`
    method is passed a format style of `LONG`. This class controls how the date and
    time is displayed.


    ```

    LocalDate employeeDate = ...; // initialized

    ZonedDateTime startTime = ZonedDateTime.of(employeeDate, startWorkDay, timeZone);

    System.out.println(startTime.format(DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG)));

    ```


    ![](image267.jpg)


    The output is shown below. The 064 field is the number of days from the start
    of the year.


    `Start: March 5, 2014 8:00 AM`


    The end time is calculated by adding `dailyTime` to the start time.


    ```

    ZonedDateTime endTime = startTime.plusHours(dailyTime.toHours());

    System.out.println("End: " + endTime.format(DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG)));

    ```


    ![](image268.jpg)


    The end time is shown below:


    `End: March 5, 2014 2:00 PM`


    The last step is to use `compareTo` method with the start, end, and present times
    to determine if the employee is working. This method returns a negative value
    if the time specified by its argument follows the start or end times. It returns
    a positive value if it follows the target time. The following expression will
    return false based upon these sets of dates:


    ```

    System.out.println((startTime.compareTo(present) <= 0) && (endTime.compareTo(present)
    >= 0));

    ```


    ![](image269.jpg)


    ## ISO-8601 String Format


    This format is used with several methods of the API. Its format is shown below:


    `PnDTnHMn.nS`


    The letters correspond to the following units: Period, Days, Hours, Minutes, and
    Seconds. The `n` represents the number of units and precedes the corresponding
    unit symbol. The `T` must be present before the use of an hour, minute, or second
    field. The letters are case-insensitive. Fields can be left out but must appear
    in the order listed above. The period separating the seconds from the first part
    of the string, may use 0 to 9 digits. An optional plus or minus can be used to
    affect an addition or subtraction. Days are exactly 24 hours in length. Table
    1 - Period Examples provides several examples of how they can be used.


    ***Table 1 - Period Examples***


    | Formatted String | Meaning |

    | :--- | :--- |

    | "P3DT13H5M" | 3 days, 13 hours and 5 minutes |

    | "PT8H" | 8 hours |

    | "P24D" | 24 days |

    | "PT15.012S" | 15 seconds and 12000000 nanoseconds |

    | "-P-3H+42M" | +3 hours and -42 minutes |


    ![](image270.jpg)


    Design Considerations


    The date and time API is based on four design considerations:

