    \ 类的 `now()` 方法计算。此时间将代表当前时区的当前时间。如果员工当前正在上班，`Employee` 类的 `isWorkingNow` 方法将返回\
    \ true，否则返回 false。\n\n```java\nZonedDateTime present = ZonedDateTime.now();\n\
    System.out.println(employee1.isWorkingNow(present));\n```\n![](img/image346.jpg)\n\
    \n`isWorkingNow` 方法实现如下。首先创建一个 `LocalDate`，并工作者的时区创建开始时间和结束时间。使用传递给方法的 `TemporalAccessor`\
    \ 创建一个表示当前时间的 `ZonedDateTime`。然后该方法使用这些值通过 `compareTo` 方法来判断工作者是否存在。\n\n```java\n\
    public Boolean isWorkingNow(TemporalAccessor temporal) {\n    LocalDate employeeDate\
    \ = LocalDate.of(\n        LocalDate.now().getDayOfYear(),\n        LocalDate.now().getMonth(),\n\
    \        LocalDate.now().getDayOfMonth());\n    ZonedDateTime startTime = ZonedDateTime.of(\n\
    \        employeeDate,\n        this.startWorkDay,\n        this.getTimeZone());\n\
    \    ZonedDateTime present = (ZonedDateTime) temporal;\n    ZonedDateTime endTime\
    \ = startTime.plusHours(this.getDailyTime().toHours());\n    return (startTime.compareTo(present)\
    \ <= 0) && (endTime.compareTo(present) >= 0);\n}\n```\n![](img/image347.jpg)\n\
    \n使用特定的方法（如 `isWorkingNow` 方法）允许向类中添加其他方法以支持类似的查询操作。或者，我们可以使用标准查询的 `queryFrom`\
    \ 方法，如下所示：\n\n```java\nSystem.out.println(employee1.queryFrom(present));\n```\n\
    ![](img/image348.jpg)\n\n`queryFrom` 方法复制了 `isWorkingNow` 方法：\n\n```java\n@Override\n\
    public Boolean queryFrom(TemporalAccessor temporal) {\n    LocalDate employeeDate\
    \ = LocalDate.of(\n        LocalDate.now().getDayOfYear(),\n        LocalDate.now().getMonth(),\n\
    \        LocalDate.now().getDayOfMonth());\n    ZonedDateTime start = ZonedDateTime.of(employeeDate,\
    \ this.startWorkDay, this.getTimeZone());\n    ZonedDateTime present = (ZonedDateTime)\
    \ temporal;\n    ZonedDateTime endTime = start.plusHours(this.getDailyTime().toHours());\n\
    \    return (start.compareTo(present) <= 0) && (endTime.compareTo(present) >=\
    \ 0);\n}\n```\n![](img/image349.jpg)\n\n我们也可以在 `queryFrom` 方法中调用 `isWorkingNow`\
    \ 方法来实现相同的结果。\n\n## 理解基于值的类\n\nJava 8 中的许多类都是基于值的（value-based）。`LocalDateTime`\
    \ 和 `MonthDay` 就是此类类的示例。这些类型的类具有许多特征，包括：\n\n- 它们是 `final` 的\n- 它们是 `immutable`（不可变的）\n\
    - 它们没有公共的构造函数\n- 需要使用工厂方法来创建这些类的实例\n- 执行时，它们的 `equals`、`hashCode` 和 `toString`\
    \ 方法不使用来自其他来源的信息\n- 在进行比较时，我们应该使用 `equals` 方法而不是 `==` 运算符\n- 交换两个等价的对象不应导致任何行为上的差异\n\
    \n应避免对基于值的对象进行身份敏感的操作。任何此类操作都可能导致不可预测的行为。下面的示例说明了使用等价运算符和 `equals` 方法来比较两个相同的对象：\n\
    \n```java\nMonthDay date1 = MonthDay.of(2, 2);\nMonthDay date2 = MonthDay.of(2,\
    \ 2);\nSystem.out.println(date1 == date2);\nSystem.out.println(date1.equals(date2));\n\
    ```\n![](img/image350.jpg)\n\n等价运算符将返回 false，而 equals 方法返回 true；\n\n结论\n\n新的 Java\
    \ 8 日期和时间 API 既大又复杂。它使用多种类来支持本地日期和时间以及基于时区的需求。该 API 使用了一致且易于理解命名方案。这支持了流式编程风格，提高了生产力和代码的可读性。\n\
    \n该 API 通过 `Clock` 类支持机器时间线。通过 `LocalDate` 和 `ZonedDateTime` 等类支持人类时间线。此外，时间间隔使用\
    \ `Duration` 创建小时、分钟和秒，使用 `Period` 创建月和天。\n\n有一些类包含了时区信息。开发者可以根据需要处理时区偏移和时区规则。日期和时间可以通过多种方法创建，包括解析字符串。日期和时间可以使用各种格式化技术进行显示。\n\
    \n* * * *\n\n# 第五 杂杂\n\n### 引言\n（内容见大纲）\n\n### 使用 Nashorn JavaScript 引擎\n- 访问\
    \ Nashorn 引擎\n- 执行 JavaScript 代码\n- 从 JavaScript 执行 Java 代码\n- 实现 Java 接口\n\n\
    ### 文件 IO 增强\n- 使用 `FileFilter` 接口\n- 使用 `PathMatcher` 接口\n- 使用 `Files` 类的 `list`\
    \ 方法\n- 使用 `Files` 类的 `walk` 方法\n- 使用 `Path` 类的 `lines` 方法\n\n### 并发增强\n- 使用 `Arrays`\
    \ 类的 `parallelSort` 方法\n- 使用 `Arrays` 类的 `parallelSetAll` 方法\n- 使用 `Arrays` 类的\
    \ `parallelPrefix` 方法\n\n### 集合增强\n- 使用 `forEachRemaining` 方法\n- 使用 `replace`\
    \ 类型方法\n- 使用 `compute` 类型方法\n\n### Project Jigsaw 和紧凑配置\n- 紧凑配置\n- 使用紧凑配置\n\n\
    ### 其他增强\n- Javadoc 增强\n- 安全增强\n- 虚拟机相关增强\n- 核心 Java 增强\n\n### 结论\n本章讨论了 Java\
    \ 8 中某些没有必要单独设立章节的特性。例如，引入了 Nashorn JavaScript 引擎，允许从 Java 应用程序执行 JavaScript 代码。一些文件\
    \ IO 类和方法得到了改进以支持 Lambda 表达式。相反，集合框架中增加了一些方法，值得进一步讨论。并发增强和其他功能也在此处进行了讨论。\n\n"
- fmt: "\n# Using the Nashorn JavaScript Engine\n\nA JavaScript engine is software\
    \ that interprets JavaScript code. The Nashorn JavaScript engine is written in\
    \ Java and allows JavaScript code to be embedded into Java applications. It is\
    \ the successor to the `Rhino` JavaScript engine and has better memory utilization\
    \ and performance.\n\nMany operations are supported by the engine including:\n\
    \n- Evaluating isolated scripts or complete JavaScript files\n- Invoking script\
    \ functions\n- Executing Java code from JavaScript\n- Implementing a Java interface\
    \ with script\n\nThe Nashorn engine is a complex API. Here we will only be providing\
    \ an overview of its capabilities. More detail about the engine can be found at\
    \ [http://download.java.net/jdk8/docs/technotes/guides/scripting/nashorn/toc.html](http://download.java.net/jdk8/docs/technotes/guides/scripting/nashorn/toc.html).\n\
    \n## Accessing the Nashorn Engine\n\nIn order to use the engine, an instance of\
    \ the JavaScript engine needs to be created. This is accomplished using two classes:\
    \ `ScriptEngineManager` and `ScriptEngine`. The `ScriptEngineManager` class is\
    \ used to manage the script engines available to the Java JVM. An instance of\
    \ the `ScriptEngine` class represents the JavaScript engine.\n\nIn the following\
    \ sequence an instance of the JavaScript engine is created. The `getEngineByName`\
    \ method returns an instance of the engine and the `eval` method will execute\
    \ an arbitrary JavaScript code. In this example, it determines the length of a\
    \ string. The `eval` method is enclosed in a try block because a `ScriptException`\
    \ exception must be handled.\n\n```\nScriptEngineManager manager = new ScriptEngineManager();\n\
    \nScriptEngine engine = manager.getEngineByName(\"nashorn\");\n\ntry {\n    Object\
    \ result = engine.eval(\n    \"'Nashorn JavaScript Engine'.length\");\n    System.out.println(result);\n\
    \n} catch (ScriptException ex) {…);\n```\n\n![](image351.jpg)\n\nThe output of\
    \ this example will be 25.\n\n## Executing JavaScript Code\n\nThere are several\
    \ ways of executing JavaScript code in addition to using the `eval` method with\
    \ a simple string argument. The following defines a JavaScript function, `sumOfSquares`,\
    \ that returns the sum of the squares of two numbers. We then execute the function\
    \ using the `eval` method.\n\n```\nengine.eval(\"function sumOfSquares(a, b) {\n\
    return a*a + b*b;}\");\n\nSystem.out.println(engine.eval(\n\"sumOfSquares(1, 2);\"\
    ));\n```\n\n![](image352.jpg)\n\nThe output will be 5.0.\n\nAnother approach uses\
    \ the `javax.script.Invocable` interface. The `engine` variable can be cast to\
    \ this interface which allows us to use the interface's `invokeFunction` method\
    \ to execute script code as shown below. It produces the same output as the previous\
    \ example.\n\n```\nInvocable invocable = (Invocable) engine;\n\nSystem.out.println(\n\
    invocable.invokeFunction(\n\"sumOfSquares\", 1, 2));\n```\n\n![](image353.jpg)\n\
    \nWe can also evaluate script code found in a file. The following is the contents\
    \ of a file named `maximum.js`. The function returns the largest number passed\
    \ to it.\n\n```javascript\nfunction max() {\n  var largest = arguments[0];\n \
    \ for(var index = 1; index < arguments.length; index++)\n  if (arguments[index]\
    \ > largest) {\n    largest = arguments[index];\n  }\n  return largest;\n}\n```\n\
    \n![](image354.jpg)\n\nA `FileReader` object is created using this file and then\
    \ the `invokeFunction` is executed using the `max` function and a list of parameters\
    \ passed to the function:\n\n```\nengine.eval(new FileReader(\"maximum.js\"));\n\
    \nSystem.out.println(invocable.invokeFunction(\n\"max\", 23, 21, 43, -36, 2, 51));\n\
    ```\n\n![](image355.jpg)\n\nThe output will be 51.\n\n## Executing Java Code from\
    \ JavaScript\n\nEmbedding Java code within JavaScript is supported through the\
    \ use of classes and interfaces. All references to Java types must normally be\
    \ fully qualified. In the following JavaScript sequence, an instance of the `LocalDateTime`\
    \ class is used to get and display the current date and time.\n\n```javascript\n\
    var today = java.time.LocalDateTime.now();\n\nprint(today);\n```\n\n![](image356.jpg)\n\
    \nWe can demonstrate this by placing this code sequence into a file called `UsingJava.js`\
    \ and then invoking it from Java using the following statement:\n\n```\nengine.eval(new\
    \ FileReader(\"UsingJava.js\"));\n```\n\n![](image357.jpg)\n\nOne possible output\
    \ follows:\n\n2014-03-15T14:14:38.410\n\nNashorn provides an object called `Java`\
    \ that possesses `to` and `from` methods. This object is used to support conversions\
    \ between Java and JavaScript. Since the object returned by the `toArray` method\
    \ is a Java array and not a JavaScript array, it cannot be displayed properly\
    \ until it is converted to the correct JavaScript object. This is done using the\
    \ `from` method.\n\nIn the following sequence a list is created. A `Stream` object\
    \ is created from the list and the `filter`, `sort`, and `toArray` methods are\
    \ applied to it in a fluent fashion. The `filterNumber` function is used as an\
    \ argument to the `filter` method to eliminate numbers greater than 10 from being\
    \ processed further. The Java array is converted to a JavaScript array using the\
    \ `from` method.\n\n```javascript\nfunction filterNumber (n) { return n>10};\n\
    \nvar list = java.util.Arrays.asList(2, 43, 23, 87, 29);\n\nvar result =\nlist.stream().filter(filterNumber).sorted().toArray();\n\
    \nvar array = Java.from(result);\n\nprint(array);\n```\n\n![](image358.jpg)\n\n\
    The output of the code sequence follows:\n\n23,29,43,87\n\n## Implementing a Java\
