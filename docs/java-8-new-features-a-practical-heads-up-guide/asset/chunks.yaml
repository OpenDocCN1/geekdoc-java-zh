    an alternative implementation. In the following implementation of the Person class,
    an overridden draw method is provided:


    interface Drawable {


    public default void draw() {


    System.out.println(


    "The Drawable interface''s draw method");


    }


    }


    class Person implements Drawable {


    @Override


    public void draw() {


    System.out.println("The Person''s draw method");


    }


    }


    ![](image8.jpg)


