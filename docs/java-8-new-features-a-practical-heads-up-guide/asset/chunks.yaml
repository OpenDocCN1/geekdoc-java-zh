    - 总结\n\n### Java 8 简介\n\n为了让 Java 保持竞争力，它必须进化。Java 8 的增强引入了许多新的语言特性和包。在本书中，我们将检查这些新增内容，从解释默认方法和函数接口开始。这些新特性本身很有用，同时也支持其他\
    \ Java 8 特性，如 lambda 表达式和流（Stream）。接口是第一章重点。\n\nJava 8 的目标之一是支持并鼓励使用函数式编程。虽然这尚未完全实现，但\
    \ `lambda expressions` 的添加无疑鼓励了这种风格。Lambda 表达式本质上是匿名函数。随着 Java 8 的出现，出现了许多新的类函数库，旨在与\
    \ lambda 表达式配合工作。第 2 章将探索如何创建和使用这些表达式。\n\nJava 8 的另一个目标是为并发处理提供更好的支持。早期的技术虽然可行，但容易出错且难以实现。Java\
    \ 8 引入的 `Streams` 将并发编程的一些概念性困难从程序员中移开，并将其嵌入流中。流可以被看作是待按顺序或并发处理的元素集合。程序员可以指定需要做什么，而无需担心如何去实现。此外，随着\
    \ `forEach` 方法的添加，集合框架内部支持了内部迭代。我们将在第 3 章中看到流的许多应用。\n\n在 Java 中，处理日期和时间从未像现在这样简洁。Java\
    \ 8 通过引入 `java.time` 包和支持时间相关任务的新类纠正了这个问题。引入的改进有助于使这些任务的执行更具可读性和可靠性。时间的格式化也得到了改进。这些增强将在第\
    \ 4 章介绍。\n\nJava 还有许多其他新增。这些将在第 5 章中讨论。其范围从虚拟机的增强（这些对于普通程序员来说并不总是可见）到 Java 应用注解和文档方面的增强。此外，还有一些并发和字符编码的更新。此外，Nashorn\
    \ JavaScript 引擎已整合到 Java 中，允许在 Java 内部执行 JavaScript 代码。\n\n### 默认方法与函数式接口\n\n\
    本章重点关注接口所做的各种更改以及如何定义和使用它们。它从讨论默认方法开始。这类方法是 Java 8 的重要方面，因为它们为 lambda 表达式和流等其他增强奠定了基础。我们涵盖了在旧应用程序和新应用程序中如何创建和使用默认表达式。\n\
    \n默认方法是具有实现的接口方法。这意味着实现此类接口的类不需要实现默认方法。默认方法已添加到现有接口中，例如在许多集合类中找到接口。由于实现此类接口的类不需要重写这些方法，使用这些接口的现有代码仍能正常工作。\n\
    \n与早期的 Java 版本一样，支持接口之间的继承。然而，默认方法为继承增加了一个维度，并在单继承和多重继承情况下提供了重写方法的机会。\n\n`Functional\
    \ interfaces`（函数式接口）是一个且只有一个抽象方法的接口。这类接口也被称为单一抽象方法（SAM）。虽然接口可以拥有默认方法，但它只能有一个抽象方法。如第\
    \ 2 章所示，这种接口为 lambda 表达式提供了基础。\n\n### 创建默认方法\n\n默认方法是具有实现的接口方法。它们使用 `default`\
    \ 关键字声明。下面是一个默认方法的示例，带有一个 `Drawable` 接口定义，它包含一个默认方法和一个抽象方法：\n\n```java\ninterface\
    \ Drawable {\n    public default void draw() {\n        System.out.println(\n\
    \        \"The Drawable interface's draw method\");\n    }\n    public boolean\
    \ hasBeenDrawn();\n}\n```\n\n![](img/image1.jpg)\n\n为了说明该接口的使用，我们将下面定义的 `Person`\
    \ 类。`draw` 方法不需要实现，但 `hasBeenDrawn` 方法需要，因为它是抽象的：\n\n```java\nclass Person implements\
    \ Drawable {\n    public boolean hasBeenDrawn() {\n        return true;\n    }\n\
    }\n```\n\n![](img/image2.jpg)\n\n从主方法我们创建一个 `Person` 类的实例并执行 `draw` 方法：\n\n```java\n\
    public static void main(String[] args) {\n    Person person = new Person();\n\
    \    person.draw();\n}\n```\n\n![](img/image3.jpg)\n\n执行时，我们得到如下输出：\n\nThe Drawable\
    \ interface's draw method\n\n实现类为了使用默认方法而不需要实现该方法。\n\n默认方法可以添加到现有接口中。这些方法有时被称为虚拟扩展方法。这个术语源于扩展现有接口使其能够获取新方法而不破坏现有代码的想法。该接口被认为已经扩展了。虚拟扩展方法也被称为\
    \ **defender methods**。\n\n"
- fmt: "\nNote: I will use the term, `default methods`, since we use the keyword `default`\
    \ for default methods (in a similar way to how we use the `static` keyword for\
    \ static methods). It can be argued that the addition of default methods to an\
    \ interface corrupts the contract implied by the interface concept. In some sense,\
    \ interfaces are no longer “pure”. Whether this change is for the better can be\
    \ debated. Regardless, the use of default methods provides an additional technique\
    \ that is available to developers.\n\n## Understanding the Importance of Default\
    \ Methods\n\nDefault methods were introduced for several reasons:\n\n- Existing\
    \ code does not have to be updated to implement a new method. This allows for\
    \ interfaces to grow or be extended.\n- To provide additional flexibility in the\
    \ design of an inheritance hierarchy such as:\n    - Providing additional options\
    \ in the placement of functionality within an interface hierarchy\n    - Supporting\
    \ interfaces that mimic adapter class type functionality\n- To support lambda\
    \ expressions\n\nPrivate variables are still not permitted in an interface. In\
    \ the previous example, the abstract method, `hasBeenDrawn()`, implies the potential\
    \ use of a state-like variable. However, any support for state information will\
    \ have to be provided by the implementer of the interface.\n\n## Defining a Default\
    \ Method\n\nLet’s examine the details of creating and using a default method.\
    \ The `default` keyword is always used to declare a default method. Technically,\
    \ the keyword would not seem to be necessary. After all, it is clear from the\
    \ existence of the method’s body that it is not abstract. The main reason it is\
    \ required is to make it obvious that the method is implemented.\n\nThis is analogous\
    \ to the use of the `abstract` keyword to declare abstract methods and classes.\
    \ While an abstract method is obvious from its lack of a body, and an abstract\
    \ class is obvious from the presence of abstract methods, the use of these keywords\
    \ clarifies the intent. For example, the `abstract` keyword is not required to\
    \ declare an abstract method in an interface. We could have declared the previous\
    \ abstract method as follows:\n\n```java\npublic interface Drawable {\n//…\npublic\
    \ boolean hasBeenDrawn();\n}\n```\n\n![](image4.jpg)\n\nHowever, we will use the\
    \ `abstract` keyword, explicitly, to state our intent clearly.\n\nThe keyword\
    \ `default` can be used in two places in the method’s declaration. Place the keyword\
    \ either before, or after, any scope modifier. A scope modifier, while normally\
    \ desirable, is not required. Possible placements of the keyword `default` are\
    \ illustrated below:\n\n```java\npublic default void draw(){…}\ndefault public\
    \ void draw(){…}\ndefault void draw(){…}\n```\n\n![](image5.jpg)\n\nThe term,\
    \ default method, should not be confused with the idea that it is executed by\
    \ default if no other methods are provided. In fact, an interface can have multiple\
    \ default methods as shown below:\n\n```java\ninterface Drawable {\n    default\
    \ void draw() {\n        System.out.println(\"The Drawable interface's draw method\"\
    );\n    }\n    default void drawInQuotes() {\n        System.out.println(\"\\\"\
    The Drawable interface's drawInQuotes method\\\"\");\n    }\n    public abstract\
    \ boolean hasBeenDrawn();\n}\n```\n\n![](image6.jpg)\n\nBoth of these methods\
    \ can be used from an implementing class as shown below:\n\n```java\nPerson person\
    \ = new Person();\nperson.draw();\nperson.drawInQuotes();\n```\n\n![](image7.jpg)\n\
    \nThe output is as follows:\n\n```\nThe Drawable interface's draw method\n\"The\
    \ Drawable interface's drawInQuotes method\"\n```\n\n## Overriding Default Methods\n\
    \nWhile a class must override abstract methods to avoid becoming abstract, default\
    \ methods do not have to be overridden. They can be overridden as needed to provide\
    \ an alternative implementation. In the following implementation of the `Person`\
    \ class, an overridden `draw` method is provided:\n\n```java\ninterface Drawable\
    \ {\n    public default void draw() {\n        System.out.println(\"The Drawable\
    \ interface's draw method\");\n    }\n}\n\nclass Person implements Drawable {\n\
    \    @Override\n    public void draw() {\n        System.out.println(\"The Person's\
    \ draw method\");\n    }\n}\n```\n\n![](image8.jpg)\n\nWhile the `@Override` annotation\
    \ is not required, it is a good programming practice to include it. When the `draw`\
    \ method is now invoked, the `Person` class’s implementation is executed as shown\
    \ below:\n\n```java\nPerson person = new Person();\nperson.draw();\n```\n\n![](image9.jpg)\n\
    \nThe output follows:\n\n```\nThe Person's draw method\n```\n\nIf we want to use\
    \ the default method’s implementation, from the class that implements the interface,\
    \ we use the name of the interface followed by the keyword `super` and then the\
    \ method name - all separated with periods. For the `draw` method, this is done\
    \ as illustrated below:\n\n```java\nclass Person implements Drawable {\n    @Override\n\
    \    public void draw() {\n        Drawable.super.draw();\n        System.out.println(\"\
    The Person's draw method\");\n    }\n}\n```\n\n![](image10.jpg)\n\nThe output\
    \ shown below is based on the previous invocation of the `draw` method against\
    \ the `Person` instance:\n\n```\nThe Drawable interface's draw method\nThe Person's\
    \ draw method\n```\n\nWhen overriding a default method in the implementing class,\
    \ the keyword `default` cannot be used. For example, the following will not compile\
    \ cleanly:\n\n```java\nclass Person implements Drawable {\n    @Override\n   \
    \ public default void draw() {\n        System.out.println(\"The Person's draw\
    \ method\");\n    }\n}\n```\n\n![](image11.jpg)\n\nAn error message similar to\
    \ the following will be generated:\n\n```\nmodifier default not allowed here\n\
    ```\n\n## Using Inheritance with Default Methods\n\nInterfaces can inherit from\
    \ each other. Extensive hierarchies are possible including those that use multiple\
    \ inheritance. As a result, default methods can be overridden in several places\
    \ in a hierarchy. In this section, we will illustrate various inheritance alternatives\
    \ and explain how the run-time system determines which overridden method to use.\n\
    \n### Working with Single Inheritance\n\nAs with earlier versions of Java, interfaces\
    \ can be derived from another interface. This is illustrated, below, where the\
    \ `Displayable` interface derives from the `Drawable` interface. In this initial\
    \ version, no methods have been added to the `Displayable` interface.\n\n```java\n\
    interface Drawable {\n    public default void draw() {\n        System.out.println(\"\
    The Drawable interface's draw method\");\n    }\n}\n\npublic interface Displayable\
    \ extends Drawable {\n}\n```\n\n![](image12.jpg)\n\nThe `Person` class implements\
    \ the `Displayable` interface as shown below:\n\n```java\npublic class Person\
    \ implements Displayable {\n}\n```\n\n![](image13.jpg)\n\nThese relationships\
    \ are shown in Figure 1: Inheritance and Implementation Example. The solid line\
    \ represents inheritance while the dashed line shows the `Person` class implementing\
    \ the `Displayable` interface.\n\n![](image14.jpg)\n\nFigure 1: Inheritance and\
    \ Implementation Example\n\nWhen the `draw` method is executed against a `Person`\
    \ instance, which does not override the `draw` method, the `Drawable`’s draw method\
    \ is executed as shown below:\n\n```java\nPerson person = new Person();\nperson.draw();\n\
    ```\n\n![](image15.jpg)\n\nThe output is shown here:\n\n```\nThe Drawable interface's\
    \ draw method\n```\n\nWe can override the `draw` method in the `Displayable` interface\
    \ as shown below. Notice the use of the `default` keyword. It is required when\
    \ we override a default method in interfaces.\n\n```java\ninterface Displayable\
    \ extends Drawable {\n    public default void draw() {\n        System.out.println(\"\
    The Displayable interface's draw method\");\n    }\n}\n```\n\n![](image16.jpg)\n\
    \nIf the `default` keyword is left out, we get the following error message:\n\n\
    ```\ninterface abstract methods cannot have body\n```\n\nThe output of the `draw`\
    \ method now reflects the overridden method as shown below:\n\n```\nThe Displayable\
    \ interface's draw method\n```\n\nIt is possible to make a default method abstract\
    \ in a hierarchy chain. Consider a third interface called `MoreDisplayable` as\
    \ declared below. The `draw` method is overridden as an abstract method.\n\n```java\n\
    interface MoreDisplayable extends Displayable {\n    @Override\n    public abstract\
    \ void draw();\n}\n```\n\n![](image17.jpg)\n\nWhen the `Person` class implements\
    \ the `MoreDisplayable` interface it must implement the `draw` method. If it doesn’t,\
    \ then the class must be declared as abstract.\n"
