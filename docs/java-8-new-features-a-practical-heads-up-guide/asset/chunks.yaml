    +++SomeClass Default Constructor


    Default Constructor


    We can also use constructors other than the default constructor. The following
    interface will match a constructor that returns an object of type T, and takes
    some object U as a parameter:


    interface ConstructorArgumentInterface<T, U> {


    T create(U arg);


