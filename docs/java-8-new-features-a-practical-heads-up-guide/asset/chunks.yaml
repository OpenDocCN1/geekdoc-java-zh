    }


    var result =


    list.stream().filter(filterNumber).sorted().toArray();


    var array = Java.from(result);


    print(array);


    ![](image359.jpg)


    The output will be identical to the previous implementations.


    Implementing a Java Interface


    A Java interface can be implemented in JavaScript. We can also extend Java classes
    if necessary. Here we will demonstrate the basic approach using the List interface.


    In the example that follows, a JavaScript variable is declared and assigned an
