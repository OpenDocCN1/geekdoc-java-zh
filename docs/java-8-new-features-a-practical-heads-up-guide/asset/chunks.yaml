    Using Compact Profiles


    You can use the javac compiler command with the -profile command line option to
    determine if an application uses an element not present in a profile. This command
    is documented at [http://download.java.net/jdk8/docs/technotes/tools/windows/javac.html](http://download.java.net/jdk8/docs/technotes/tools/windows/javac.html). 
    For example, the Java program that follows includes an import statement and a
    declaration for a ResultSet variable:


    import java.sql.ResultSet;


    public class CompactProfiles {


    public static void main(String[] args) {


    ResultSet rs;


    }


    }


    ![](image385.jpg)


    If we compile the program using the following command, we will get errors:


    javac -profile compact1 CompactProfiles.java


    Since the java.sql package is not part of compact1, we get two errors as shown
    below:


    CompactProfiles.java:3: error: ResultSet is not available in profile ''compact1''


    import java.sql.ResultSet;


    ^


    CompactProfiles.java:8: error: ResultSet is not available in profile ''compact1''


    ResultSet rs;


    ^


    2 errors


