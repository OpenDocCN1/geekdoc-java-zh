- fmt: "\nRichard Reese is an acclaimed author who has written several Java and C\
    \ books, bringing a focused and easy-to-follow approach to learning. He currently\
    \ teaches at Tarleton State University.\n\nRichard is currently working on a JMonkeyEngine\
    \ title.\n\n# Code Examples – Read Me\n\nYou are reading an electronic version\
    \ of this book. Some eReaders (and different screen widths) can do some quite\
    \ funky reformatting to text, including stripping out indentations. As such, the\
    \ code examples in this ebook are offered as text and image files, to (hopefully)\
    \ better illuminate the content at hand.\n\n**To get your hands on the code as\
    \ `.txt`**, it is available as a freely downloadable file.\n\nDownload the file\
    \ from the publisher page at: `[www.P8tech.com/java701](http://www.P8tech.com/java701)`\n\
    \n# Erratum\n\nDespite best efforts, mistakes can sometimes creep into books.\
    \ If you spot a mistake, please feel free to email us at errata@p8tech.com (with\
    \ the book title in the subject line). The errata page for the book is hosted\
    \ at `[www.P8tech.com/java702](http://www.P8tech.com/java702)`\n\n# Chapter 1\
    \ – Java 8 and Interface Enhancements\n\n## Introduction to Java 8\n\n- Default\
    \ Methods and Functional Interfaces\n- Creating Default Methods\n- Understanding\
    \ the Importance of Default Methods\n- Defining a Default Method\n    - Overriding\
    \ Default Methods\n- Using Inheritance with Default Methods\n    - Working with\
    \ Single Inheritance\n    - Working with Multiple Inheritance\n    - Understanding\
    \ how Diamond Inheritance Works\n- Resolving Overridden Default Methods\n- Using\
    \ Default Methods\n    - Extending Existing Interfaces\n    - Using Default Methods\
    \ to Supplement Adapter Classes\n    - Using Default Methods in Core Java Classes\n\
    \    - Using a Class to Support Default Methods\n- Understanding the Difference\
    \ between an Abstract Class and Interfaces\n- Using Static Interface Methods\n\
    - Functional Interfaces\n    - Creating a Functional Interface\n    - Using the\
    \ `@FunctionalInterface` Annotation\n    - Overriding `Object` Class Methods in\
    \ a Functional Interface\n    - Using Functional Interfaces in the Core Libraries\n\
    - Conclusion\n\n### Introduction to Java 8\n\nFor Java to remain competitive it\
    \ has to evolve. The enhancements to version 8 of Java introduce a number of new\
    \ language features and packages. In this book we will examine most of these additions\
    \ starting with an explanation of default methods and function interfaces. These\
    \ new features, whilst useful in themselves, support other Java 8 features such\
    \ as lambda expressions and stream. Interfaces are the focus of the first chapter.\n\
    \nOne of the goals for Java 8 was to support and encourage the use of a functional\
    \ style of programming. While this has not been completely achieved, the addition\
    \ of `lambda expressions` certainly encourages this style. Lambda expressions\
    \ are essentially anonymous functions. With Java 8 come a number of new function-like\
    \ libraries designed to work with lambda expressions. Chapter 2 explores how to\
    \ create and use these expressions.\n\nAnother goal of Java 8 is to provide better\
    \ support for concurrent processing. Earlier techniques, while workable, can be\
    \ error prone and hard to implement. The introduction of `Streams` to Java 8 moves\
    \ some of the conceptual difficulties of concurrent programming away from the\
    \ programmer and embeds them in streams. A stream can be thought of as a collection\
    \ of elements to be processed either sequentially or concurrently. The programmer\
    \ can specify what needs to be done and not worry about how it is done. In addition,\
    \ there is support for internal iteration within the collection framework with\
    \ the addition of the `forEach` method. We will see many applications of streams\
    \ in Chapter 3.\n\nHandling date and time has never been as clean as it could\
    \ be in Java. This is rectified in Java 8 with the introduction of the `java.time`\
    \ package and new classes to support time related tasks. The improvements introduced\
    \ help make the execution of these tasks more readable and reliable. The formatting\
    \ of time has also been improved. These enhancements are presented in Chapter\
    \ 4.\n\nThere have been numerous other additions to Java. These will be discussed\
    \ in Chapter 5. They range from virtual machine enhancements, which are not always\
    \ readily visible to the typical programmer, to enhancements in how Java applications\
    \ are annotated and documented. In addition, there are a few concurrency and character\
    \ encoding updates. Also, the Nashorn JavaScript engine has been incorporated\
    \ into Java which enables execution of JavaScript code from within a Java application.\n\
    \n### Default Methods and Functional Interfaces\n\nThis chapter focuses on the\
    \ various changes that have been made to interfaces and how they can be defined\
    \ and used. It starts out with a discussion of default methods. These types of\
    \ methods are an important aspect of Java 8 as they lay the groundwork for other\
    \ enhancements such as lambda expressions and streams. We cover how default expressions\
    \ are created and used both in old applications and in new ones.\n\nDefault methods\
    \ are methods of an interface that have implementations. This means that classes\
    \ that implement these types of interfaces do not have to implement default methods.\
    \ Default methods have been added to existing interfaces such as those found in\
    \ many collection classes. Since classes that implement such interfaces do not\
    \ need to override those methods, existing code that uses these interfaces will\
    \ still work properly.\n\nAs with earlier versions of Java, inheritance between\
    \ interfaces is supported. However, default methods add a new dimension to inheritance\
    \ and offer opportunities for overriding methods in both single and multiple inheritance\
    \ situations.\n\n`Functional interfaces` are interfaces that possess one, and\
    \ only one, abstract method. These types of interfaces are also called Single\
    \ Abstract Methods (SAM). While an interface can possess default methods, it can\
    \ have only one abstract method. As demonstrated in Chapter 2, this type of interface\
    \ provides the foundation for lambda expressions.\n\n### Creating Default Methods\n\
    \nDefault methods are interface methods that have an implementation. They are\
    \ declared using the `default` keyword. An example of a default method follows\
    \ with a `Drawable` interface definition consisting of one default method and\
    \ one abstract method:\n\n```java\ninterface Drawable {\n    public default void\
    \ draw() {\n        System.out.println(\n        \"The Drawable interface's draw\
    \ method\");\n    }\n    public abstract boolean hasBeenDrawn();\n}\n```\n\n![](image1.jpg)\n\
    \nTo illustrate the use of this interface we will use a `Person` class as defined\
    \ below. The `draw` method does not need to be implemented but the `hasBeenDrawn`\
    \ method does since it is abstract:\n\n```java\nclass Person implements Drawable\
    \ {\n    public boolean hasBeenDrawn() {\n        return true;\n    }\n}\n```\n\
    \n![](image2.jpg)\n\nFrom a main method we create an instance of the `Person`\
    \ class and execute the `draw` method:\n\n```java\npublic static void main(String[]\
    \ args) {\n    Person person = new Person();\n    person.draw();\n}\n```\n\n![](image3.jpg)\n\
    \nWhen executed we get an output as follows:\n\nThe Drawable interface's draw\
    \ method\n\nThe implementing class did not have to implement the default method\
    \ in order to use it.\n\nA default method can be added to an existing interface.\
    \ These methods are sometimes called virtual extension methods. This term arises\
    \ from the idea of extending an existing interface so that it can acquire new\
    \ methods without breaking existing code. The interface is said to have been extended.\
    \ Virtual extension methods are also called **defender methods**.\n"
