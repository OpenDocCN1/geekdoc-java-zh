    | `Period` | `boolean isNegative()`, `boolean isZero()` |

    | `Year` | `boolean isAfter(Year other)`, `boolean isBefore(Year other)`, `boolean
    isLeap()`, `static boolean isLeap(long year)`, `boolean isSupported(TemporalField
    field)`, `boolean isSupported(TemporalUnit unit)`, `boolean isValidMonthDay(MonthDay
    monthDay)` |

    | `YearMonth` | `boolean isAfter(YearMonth other)`, `boolean isBefore(YearMonth
    other)`, `boolean isLeapYear()`, `boolean isSupported(TemporalField field)`, `boolean
    isSupported(TemporalUnit unit)`, `boolean isValidDay(int dayOfMonth)` |

    | `ZonedDateTime` | `boolean isSupported(TemporalField field)`, `boolean isSupported(TemporalUnit
    unit)` |


    ### With Type Methods


    These methods always return an instance of the class they execute against. The
    methods supported vary by class. In general, they return a modified version of
    the original class. Table 6 - With Type Methods lists the classes that support
    with type methods.


    ### Table 6 - With Type Methods


    | Class | Method |

    | :--- | :--- |

    | `Clock` | `Clock withZone(ZoneId zone)` |

