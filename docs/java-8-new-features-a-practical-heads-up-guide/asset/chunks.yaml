    The static `from` method is very consistent in its signature from class to class
    with the exception of the `Duration` class. The method returns an instance of
    the class it executes against. Each `from` method accepts a `TemporalAccessor`
    object as an argument with the exception of the `Duration` class which uses a
    `TemporalAmount` object. Table 2 lists the classes that support the `from` method.


    ### Table 2 - From Methods


    | Class | Method |

    | :--- | :--- |

    | `Duration` | `from(TemporalAmount amount)` |

    | `Instant` | `from(TemporalAccessor temporal)` |

    | `LocalDate` | `from(TemporalAccessor temporal)` |

    | `LocalDateTime` | `from(TemporalAccessor temporal)` |

    | `LocalTime` | `from(TemporalAccessor temporal)` |

    | `MonthDay` | `from(TemporalAccessor temporal)` |

    | `OffsetDateTime` | `from(TemporalAccessor temporal)` |

    | `OffsetTime` | `from(TemporalAccessor temporal)` |

    | `Period` | `from(TemporalAmount amount)` |

    | `Year` | `from(TemporalAccessor temporal)` |

    | `YearMonth` | `from(TemporalAccessor temporal)` |

    | `ZonedDateTime` | `from(TemporalAccessor temporal)` |

    | `ZoneId` | `from(TemporalAccessor temporal)` |

    | `ZoneOffset` | `from(TemporalAccessor temporal)` |


    ### The parse Method


    The static `parse` method is consistent between those classes that implement it.
    The method returns an instance of the class it executes against. The overloaded
    method uses either one or two arguments. The first argument is always a `CharSequence`.
    When the second argument is present, it is a `DateTimeFormatter` instance. Table
    3 - Parse Methods lists the classes that support the `parse` method.


    ### Table 3 - Parse Methods


    | Class | Methods Supported |

    | :--- | :--- |

    | `Duration` | `Instant` | `LocalDate` | `LocalDateTime` | `LocalTime` | `MonthDay`
    | `Period` | `parse(CharSequence text)` |

    | `OffsetDateTime` | `OffsetTime` | `Year` | `YearMonth` | `ZonedDateTime` | `parse(CharSequence
    text)` \| `parse(CharSequence text, DateTimeFormatter formatter)` |


    **Class** Methods Supported

    `Duration` | `Instant` | `LocalDate` | `LocalDateTime` | `LocalTime` | `MonthDay`
    | `Period` `parse(CharSequence text)`

    `OffsetDateTime` | `OffsetTime` | `Year` | `YearMonth` | `ZonedDateTime` `parse(CharSequence
    text)` \| `parse(CharSequence text, DateTimeFormatter formatter)`


    ### Get Type Methods


    The `get` method returns information about an object. The information is usually
    of type integer but a class or enumeration may also be returned. The methods supported
    by a class depend on the needs of the class. Table 4 - Get Type Methods lists
    the classes that support get type methods.


