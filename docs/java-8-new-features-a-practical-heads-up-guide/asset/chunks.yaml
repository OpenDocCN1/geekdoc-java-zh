    There are four basic types of method references:


    - Static method references


    - Instance method references (specific object)


    - Instance method references (arbitrary object of a specific type)


    - Constructor references


    When using method references, as with lambda expressions, the function must match
    the signature of the functional method. The type of the reference is dependent
    on its context.


    Let’s examine the following method reference:


    Math::sin              // Equivalent to  x->Math.sin(x)


    ![](image110.jpg)


    While the Math class does not constitute a functional interface, the sin method
    can be used where a lambda expression accepts a double and returns a double. The
    sin method can be applied against such a functional interface instance. The method
    itself is treated as a function.


    Using Static Method References


    One characteristic of static reference methods is that they cannot capture instance
    variables for the same reason a static method cannot access an instance variable.
    To demonstrate the use of a static reference we will create a static display method
    that applies an operation against each element and then displays the result of
    this operation. A static square method is used for the method reference.


    interface Computable {


    int compute(int x);


    }


    public class MethodReferenceExample {


    public static void main(String[] args) {


    List<Integer> list = Arrays.asList(-5, -3, 4);      


    display(list, MethodReferenceExample::square);


    }


    public static int square(int num) {


    return num*num;


    }


    private static void display(List<Integer> list,


    Computable operation) {


    for(Integer element : list) {


    System.out.println(operation.compute(element));


    }


    }


    }


    ![](image111.jpg)


    The output will appear as follows:


    25


    9


    16


    In this example, we are using a reference to the static method square. We could,
    as easily, use the following statement which uses the Math class’ static method
    abs:


    display(list, Math::abs);


    ![](image112.jpg)


    The output follows:


    5


    3


    4


    Using Instance Method References


    Instance method references can use either a method of a specific instance or one
    from an arbitrary class object. Let’s examine a specific instance first. The following
    is the definition of a functional interface called StringConversion. It uses a
    convert method to perform some type of conversion on a string.


    interface StringConversion {


    String convert(String input);


    }


    ![](image113.jpg)


    The following is the definition of the MethodReferenceExample class where we will
    demonstrate the use of a method reference. The main method creates an instance
    of the MethodReferenceExample class where the toUpperCase method is assigned to
    the conversion variable using the method reference notation. The convert method
    is then used to transform a sample string to upper case. The toUpperCase method
    is defined at the end of the class.


    public class MethodReferenceExample {


    public static void main(String[] args) {


    MethodReferenceExample mre = new


    MethodReferenceExample();


    StringConversion conversion;


    conversion = mre::toUpperCase;


    System.out.println(conversion.convert(


    "sample string"));


    }


    public String toUpperCase(String input) {


    return input.toUpperCase();


    }


    }


    ![](image114.jpg)


    The output is as follows:


    SAMPLE STRING


    The next sequence illustrates how to use a method reference using the class name.
    A list of string is created and then sorted using the Collections class’ sort
    method. A second use of a method reference is used as the argument to the forEach
    method.


    List<String> names =


    Arrays.asList("Sam","Betty","Sue","Bob");


    Collections.sort(names, String::compareTo);


    names.forEach(System.out::println);


    ![](image115.jpg)


    The sorted output is shown below:


    Betty


    Bob


    Sam


    Sue


    Using Constructor References


    Constructor references provide a convenient way of creating objects. The target
    type of a constructor reference will always be a functional interface. The syntax
    of a constructor reference consists of the class name followed by double colons
    and then the keyword new.


    A simple use of a constructor reference is shown below where we create an ArrayList
    object. The Supplier is a functional interface found in the java.util.function
    package. Its functional method is passed void and returns an object. We are able
    to assign the constructor reference to the names variable because it is expecting
    a lambda expression. The names’ data type is a functional interface.


    Supplier<List<String>> names = ArrayList::new;


