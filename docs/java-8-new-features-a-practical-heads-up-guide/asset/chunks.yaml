  trans: "\n在下面的示例中，创建了一个 `List`，然后对其应用了 `removeIf` 方法。它将移除任何年龄大于 30 的员工。\n\n```java\n\
    List<Employee> list = new ArrayList();\n\nlist.add(new Employee(\"Mary\", 23,\
    \ 12));\n\nlist.add(new Employee(\"Tom\", 32, 12));\n\nlist.add(new Employee(\"\
    Sam\", 19, 5));\n\nlist.add(new Employee(\"Sue\", 43, 2));\n\nlist.removeIf((e)->e.getAge()>30);\n\
    \nlist.forEach((e)->System.out.println(e));\n```\n\n![](img/image155.jpg)\n\n\
    输出所示：\n\nName: Mary  Age: 23  Pay grade: 12\nName: Sam  Age: 19  Pay grade: 5\n\
    \n`Predicate` 接口仅限于单个参数。如果我们想使用两个参数进行测试，可以使用 `BiPredicate` 函数式接口。\n\n### 使用函数式接口\n\
    \n`Function` 接口使用泛型 `T` 作为输入值并返回 `R`。这本质上是一个执行某种转换的函数。它的函数式方法是 `apply` 方法：\n\n\
    ```java\nR apply(T t)\n```\n\n![](img/image156.jpg)\n\n表 5：函数类型函数式接口列出了函数类型的函数式接口及其函数式方法。\n\
    \n***表 5：函数类型函数式接口***\n\n| 函数式接口 | 函数式方法 |\n| :--- | :--- |\n| `Function<T,R>`\
    \ | `R apply(T t)` |\n| `BiFunction<T,U,R>` | `R apply(T t, U u)` |\n| `DoubleFunction<R>`\
    \ | `R apply(double value)` |\n| `DoubleToIntFunction` | `int applyAsInt(double\
    \ value)` |\n| `DoubleToLongFunction` | `long applyAsLong(double value)` |\n|\
    \ `IntFunction<R>` | `R apply(int value)` |\n| `IntToDoubleFunction` | `double\
    \ applyAsDouble(int value)` |\n| `IntToLongFunction` | `long applyAsLong(int value)`\
    \ |\n| `LongFunction<R>` | `R apply(long value)` |\n| `LongToDoubleFunction` |\
    \ `double applyAsDouble(long value)` |\n| `LongToIntFunction` | `int applyAsInt(long\
    \ value)` |\n| `ToDoubleBiFunction<T,U>` | `double applyAsDouble(T t, U u)` |\n\
    | `ToDoubleFunction<T>` | `double applyAsDouble(T value)` |\n| `ToIntBiFunction<T,U>`\
    \ | `int applyAsInt(T t, U u)` |\n| `ToIntFunction<T>` | `int applyAsInt(T value)`\
    \ |\n| `ToLongBiFunction<T,U>` | `long applyAsLong(T t, U u)` |\n| `ToLongFunction<T>`\
    \ | `long applyAsLong(T value)` |\n\n![](img/image157.jpg)\n\n下例说明了如何使用此接口将数字的大小翻倍。声明了一个类型为\
    \ `Function` 的变量 `doubleValue`，该表达式接受一个整数并返回一个整数。然后使用 4 执行了 `apply` 方法。\n\n```java\n\
    Function<Integer, Integer> doubleValue = x -> 2 * x;\n\nSystem.out.println(doubleValue.apply(4));\n\
    ```\n\n![](img/image158.jpg)\n\n下例将一个整数转换为布尔值。如果数字大于 100，则返回 true，否则返回 false。在这种情况下返回了\
    \ true。\n\n```java\nFunction<Integer, Boolean> booleanValue = x -> x > 100;\n\n\
    System.out.println(booleanValue.apply(150));\n```\n\n![](img/image159.jpg)\n\n\
    一个更复杂的示例获取 `Employees` 列表并返回它们的年龄加一的列表。`getAgeList` 方法使用了 `Employees` 的 `List`\
    \ 和一个执行实际转换的 `Function` 表达式。\n\n```java\npublic List<Integer> getAgeList(\nList<Employee>\
    \ list,\nFunction<Employee, Integer> function) {\n    List<Integer> ageList =\
    \ new ArrayList<>();\n    for (Employee employee : list) {\n    ageList.add(function.apply(employee));\n\
    \    }\n    return ageList;\n}\n```\n\n![](img/image160.jpg)\n\n使用以下代码序列创建一个列表：\n\
    \n```java\nList<Employee> list = Arrays.asList(\nnew Employee(\"Mary\", 23, 12),\n\
    new Employee(\"Tom\", 32, 12),\nnew Employee(\"Sam\", 19, 5),\nnew Employee(\"\
    Sue\", 43, 2));\n```\n\n![](img/image161.jpg)\n\n然后使用简单的 lambda 表达式执行 `getAgeList`\
    \ 方法，该表达式在员工年龄上加 1：\n\n```java\nList<Integer> ageList =\ngetAgeList(list, e ->\
    \ e.getAge() + 1);\n\nageList.forEach(x -> System.out.println(x));\n```\n\n![](img/image162.jpg)\n\
    \n输出如下：\n\n24\n33\n20\n44\n\n为了使函数更灵活，以下版本使用了泛型：\n\n```java\npublic <T, U> List<U>\
    \ getAgeListType(List<T> list,\nFunction<T, U> function) {\n    List<U> newList\
    \ = new ArrayList<>();\n    for (T element : list) {\n    newList.add(function.apply(element));\n\
    \    }\n    return newList;\n}\n```\n（注：后续重复的段落已按要求省略）\n"
- fmt: "\nThe `forEach` method can also be executed against an instance of an `ArrayList`.\
    \ The following example illustrates this.\n\n```java\nArrayList<Employee> employeeList\
    \ = new ArrayList<Employee>();\nemployeeList.add(new Employee(\"Mary\", 23, 12));\n\
    employeeList.add(new Employee(\"Tom\", 32, 12));\nemployeeList.add(new Employee(\"\
    Sam\", 19, 5));\nemployeeList.add(new Employee(\"Sue\", 43, 2));\nemployeeList.forEach((e)\
    \ -> System.out.println(e));\n```\n\n![](image177.jpg)\n\nThe output follows:\n\
    \nName: Mary  Age: 23  Pay grade: 12 \nName: Tom  Age: 32  Pay grade: 12\nName:\
    \ Sam  Age: 19  Pay grade: 5\nName: Sue  Age: 43  Pay grade: 2\n\nA `forEachRemaining`\
    \ method has been added to the `Iterator` interface in Java 8. Its argument is\
    \ a `Consumer` and the method will apply that `Consumer` to the remaining elements\
    \ of the collection. The method is demonstrated below where the first two employees\
    \ are displayed in their entirety. However, once an employee’s age exceeds 30,\
    \ then only their age is displayed.\n\n```java\nIterator<Employee> iterator =\
    \ employeeList.iterator();\nwhile(iterator.hasNext()) {\n    Employee employee\
    \ = iterator.next();\n    System.out.println(employee);\n    if(employee.getAge()>30)\
    \ {\n        iterator.forEachRemaining((e)->System.out.println(e.getAge()));\n\
    \    }\n}\n```\n\n![](image178.jpg)\n\nThe output follows:\n\nName: Mary  Age:\
    \ 23  Pay grade: 12\nName: Tom  Age: 32  Pay grade: 12\n19\n43\n\n### Using the\
    \ Supplier Interface\n\nThe interface is useful in situations where objects need\
    \ to be produced and lambda expressions are useful to support the creation. The\
    \ function returns a new or existing object. The interface’s functional method\
    \ is the `get` method.\n\n```java\nT get()\n```\n\n![](image179.jpg)\n\nTable\
    \ 7: Function Type Functional Interfaces list the `Supplier` type functional interfaces\
    \ and their functional methods.\n\n| Functional Interface | Functional Method\
    \ |\n| :--- | :--- |\n| `Supplier<T>` | `T get()` |\n| `BooleanSupplier` | `boolean\
    \ getAsBoolean()` |\n| `DoubleSupplier` | `double getAsDouble()` |\n| `IntSupplier<R>`\
    \ | `R apply(int value)` |\n| `LongSupplier` | `long getAsLong()` |\n\n![](image180.jpg)\n\
    \nIn its simplest form we can define a `Supplier` that can return a new `Employee`\
    \ as shown below. The first assignment statement uses a lambda expression while\
    \ the second uses a constructor reference.\n\n```java\nSupplier<Employee> employeeSupplier;\n\
    employeeSupplier = () -> new Employee();\nemployeeSupplier = Employee::new;\n\
    ```\n\n![](image181.jpg)\n\nAn `Employee` object is not created, only an instance\
    \ of the `Supplier` functional interface. To create an `Employee` object we need\
    \ to use the `get` method as shown below:\n\n```java\nEmployee employee = employeeSupplier.get();\n\
    ```\n\n![](image182.jpg)\n\nA more sophisticated example is shown below which\
    \ will create a random set of `Employee` objects based on a list of `Employees`.\
    \ An instance of the `Random` class is created that is used to randomly select\
    \ employees from the list. The lambda expression uses the `nextInt` method to\
    \ select a random employee from the list.\n\n```java\nRandom r = new Random();\n\
    List<Employee> employeeList = Arrays.asList(\n    new Employee(\"Mary\", 23, 12),\n\
    \    new Employee(\"Tom\", 32, 12),\n    new Employee(\"Sam\", 19, 5),\n    new\
    \ Employee(\"Sue\", 43, 2));\n\nSupplier<Employee> randomEmployee;\nrandomEmployee\
    \ = () -> {\n    int index = r.nextInt(employeeList.size());\n    return employeeList.get(index);\n\
    };\n\nfor(int i=0; i<5; i++) {\n    System.out.println(randomEmployee.get());\n\
    }\n```\n\n![](image183.jpg)\n\nOne possible output follows:\n\nName: Mary  Age:\
    \ 23  Pay grade: 12\nName: Mary  Age: 23  Pay grade: 12\nName: Sam  Age: 19  Pay\
    \ grade: 5\nName: Mary  Age: 23  Pay grade: 12\nName: Sam  Age: 19  Pay grade:\
    \ 5\n\nThe lambda expression could have as easily generated `Employee` objects\
    \ randomly, which can be useful for testing purposes. When testing is complete,\
    \ a real supplier can be substituted in its place.\n\nHere is an example of passing\
    \ a `Supplier` object to a method. Its purpose is to generate a random employee\
    \ and increment his pay grade by one. A `Consumer` functional interface is used\
    \ to perform the actual conversion. The lambda expression for this operation is\
    \ shown below:\n\n```java\nConsumer<Employee> consumer = (Employee e) -> {\n \
    \   e.setPayGrade(e.getPayGrade() + 1);\n};\n```\n\n![](image184.jpg)\n\nA `convert`\
    \ method is used to link the supplier and consumer together:\n\n```java\npublic\
    \ static Employee convert(\n    Consumer<Employee> consumer,\n    Supplier<Employee>\
    \ supplier) {\n    Employee e = supplier.get();\n    consumer.accept(e);\n   \
    \ return e;\n}\n```\n\n![](image185.jpg)\n\nThe following statement illustrates\
    \ the use of the method:\n\n```java\nSystem.out.println(convert(consumer,randomEmployee));\n\
    ```\n\n![](image186.jpg)\n\nOne possible output follows:\n\nName: Mary  Age: 23\
    \  Pay grade: 12\n\n### Using Operator Interfaces\n\nOperator interfaces are concerned\
    \ with applying operations against one or two operands. For binary operators it\
    \ is not a specific type, but rather a series of interfaces. Table 8: Operator\
    \ Type Functional Interfaces lists the Operator type functional interfaces and\
    \ their functional methods.\n\n| Functional Interface | Functional Method |\n\
    | :--- | :--- |\n| `BinaryOperator<T>` | `T apply(T t, T u)` (BiFunction) |\n\
    | `DoubleBinaryOperator` | `double applyAsDouble(double left, double right)` |\n\
    | `DoubleUnaryOperator` | `double applyAsDouble(double operand)` |\n| `IntBinaryOperator`\
    \ | `int applyAsInt(int left, int right)` |\n| `IntUnaryOperator` | `int applyAsInt(int\
    \ operand)` |\n| `LongBinaryOperator` | `long applyAsLong(long left, long right)`\
    \ |\n| `LongUnaryOperator` | `long applyAsLong(long operand)` |\n\n![](image187.jpg)\n\
    \nThe `UnaryOperator` interface extends the `Function` interface and inherits\
    \ the `apply` method. In the following example, a lambda expression is created\
    \ for the interface that accepts a string and returns a formatted string indicating\
    \ the number of characters present in the string:\n\n```java\nUnaryOperator<String>\
    \ stringCount = (String x) -> \"\\\"\" + x + \"\\\" has \" + x.length() + \" characters\"\
    ;\nSystem.out.println(stringCount.apply(\"Simple String\"));\n```\n\n![](image188.jpg)\n\
    \nThe output follows: \"Simple String\" has 13 characters\n\nA `replaceAll` method\
    \ has been added to the `List` interface in Java 8. It will modify each element\
    \ of a List by applying a `UnaryOperator` against each element. To demonstrate\
    \ this method, let’s start with the following declarations:\n\n```java\nList<Employee>\
    \ list = new ArrayList();\nlist.add(new Employee(\"  Mary\", 23, 12));\nlist.add(new\
    \ Employee(\"Tom  \", 32, 12));\nlist.add(new Employee(\"  Sam  \", 19, 5));\n\
    list.add(new Employee(\"  Sue\", 43, 2));\n\nUnaryOperator<Employee> trimNames\
    \ = (Employee e) -> {\n    Employee emp = new Employee(e);\n    emp.setName(e.getName().trim());\n\
    \    return emp;\n};\n```\n\n![](image189.jpg)\n\nPreviously, it was necessary\
    \ to use an iterator to replace elements of the list similar to the following:\n\
    \n```java\nfinal ListIterator<Employee> listIterator = list.listIterator();\n\
    while (listIterator.hasNext()) {\n    listIterator.set(trimNames.apply(listIterator.next()));\n\
    }\nlist.forEach((e) -> System.out.println(e));\n```\n\n![](image190.jpg)\n\nThe\
    \ output of this sequence is shown below:\n\nName: Mary  Age: 23  Pay grade: 12\n\
    Name: Tom  Age: 32  Pay grade: 12\nName: Sam  Age: 19  Pay grade: 5\nName: Sue\
    \  Age: 43  Pay grade: 2\n\nWe can now perform the same operation more succinctly\
    \ using the `replaceAll` method as illustrated below:\n\n```java\nlist.replaceAll(trimNames);\n\
    list.forEach((e) -> System.out.println(e));\n```\n\n![](image191.jpg)\n\n### Using\
    \ the BinaryOperator Interface\n\nThis functional interface is essentially the\
    \ same as `BiFunction` except all of the arguments are of the same type. It is\
    \ derived from `BiFunction`. It accepts two Ts and returns a single T, as shown\
    \ below. It is useful for reduction type operations.\n\n```java\nR apply(T t,\
    \ T u)\n```\n\n![](image192.jpg)\n"
