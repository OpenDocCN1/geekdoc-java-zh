    - 从 JavaScript 执行 Java 代码\n- 使用脚本实现 Java 接口\n\nNashorn 引擎是一个复杂的 API。在这里，我们仅提供其功能的概述。关于该引擎的更多详细信息，可以在\
    \ [`download.java.net/jdk8/docs/technotes/guides/scripting/nashorn/toc.html`](http://download.java.net/jdk8/docs/technotes/guides/scripting/nashorn/toc.html)\
    \ 找到。\n\n## 访问 Nashorn 引擎\n\n为了使用该引擎，需要创建一个 JavaScript 引擎的实例。这是通过两个类实现的：`ScriptEngineManager`\
