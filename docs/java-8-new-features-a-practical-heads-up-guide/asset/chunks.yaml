    out.


    computable = x -> x * x;


    ![](image90.jpg)


    If the lambda expression has a single parameter, then the parentheses can be omitted.
    The type can also be omitted as Java will infer its type. However, you cannot
    leave off parentheses and keep the data type as illustrated below:


    computable = (Integer x) -> x * x;


    computable = Integer x -> x * x;    // Invalid


