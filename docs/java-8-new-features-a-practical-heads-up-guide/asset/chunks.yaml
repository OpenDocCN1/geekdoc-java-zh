    Working with Multiple Inheritance


    The multiple inheritance of interfaces has always been possible in Java. This
    type of inheritance is one of behavior. However, Java still does not support multiple
    inheritance between classes. That type of inheritance is often referred to as
    inheritance of state.


    Interfaces can inherit from more than one interface. However, if two or more of
    the base interfaces have the same default method, then ambiguity is introduced
    which needs to be addressed. To demonstrate how this is handled, we will explore
    an inheritance hierarchy where a MoreDisplayable interface is derived from both
    a Displayable and a Colorable interface as illustrated in Figure 2: Multiple Inheritance
    between Interfaces.


    ![](image19.jpg)


    Figure 2: Multiple Inheritance between Interfaces


    The first two interfaces are shown below:


    public interface Displayable extends Drawable {


    @Override


    default void draw(){


    System.out.println(


    "The Displayable interface''s draw method");


    }


    }


    public interface Colorable {


    public default void draw(){


    System.out.println(


    "The Colorable interface''s draw method");


    }   


    }


    ![](image20.jpg)


    A definition of the MoreDisplayable interface that extends both the Displayable
    and the Colorable interface is shown below. However, no implementation is provided
    for the draw method.


    public interface MoreDisplayable extends Displayable,


    Colorable {


    }


    ![](image21.jpg)


    This creates an ambiguous situation because the compiler is unable to determine
    which of the two base interfaces’ draw methods to use. This results in the following
    error message:


    interface MoreDisplayable inherits unrelated defaults for draw() from types Displayable
    and Colorable


    There are several ways of resolving this problem. One way is by providing an abstract
    declaration for the draw method as follows. This forces the implementing class
    to implement the abstract method.


    public interface MoreDisplayable extends Displayable,


    Colorable {


    @Override


    public abstract void draw();


    }


    ![](image22.jpg)


    Another approach is to use a concrete draw method:


    public interface MoreDisplayable extends Displayable,


    Colorable {


    @Override


    public default void draw() {


    System.out.println(


    "The MoreDisplayable interface''s draw method");


    }


    }


    ![](image23.jpg)


    If we want to use one of the base class’s draw methods we can explicitly call
    it as shown below:


    public interface MoreDisplayable extends Displayable,


    Colorable {


    @Override


    public default void draw() {


    Displayable.super.draw();


    }


    }


    ![](image24.jpg)


    Actually, both methods can be called if needed:


    public interface MoreDisplayable extends Displayable,


    Colorable {


    @Override


    public default void draw() {


    Displayable.super.draw();


    Colorable.super.draw();


    }


    }


    ![](image25.jpg)


    The best solution is dependent on the needs of the application.


    Understanding how Diamond Inheritance Works


    Diamond inheritance occurs when one interface is the base interface for two other
    interfaces and a fourth interface is then derived from these two interfaces. Figure
    3: Diamond Inheritance illustrates this situation where the Drawable interface
    serves as the base interface for the Displayable and the Colorable interfaces
    and the MoreDisplayable interface is derived from both the Displayable and the
    Colorable interfaces.


    ![](image26.jpg)


    Figure 3: Diamond Inheritance


    There are several places where the draw method can be declared. In the following
    set of declarations it is declared only in the Drawable interface:


    public interface Drawable {


    default void draw(){


    System.out.println(


    "The Drawable interface''s draw method");


    }


    }


    public interface Displayable extends Drawable { }


    public interface Colorable extends Drawable { }


    public interface MoreDisplayable extends Displayable,


    Colorable { }


    ![](image27.jpg)


    This will compile without errors. A similar situation occurs if a class implements
    both the Displayable and Colorable interfaces:


    public class Busy implements Displayable, Colorable {


    }


    ![](image28.jpg)


    When an instance of Busy is created and the draw method is executed against this
    instance, the Drawable''s draw method will be executed since it is the only one
    available. If the Displayable interface also implements the draw method, then
    its method will be used by the Busy class.


    public interface Displayable extends Drawable {


    @Override


    default void draw(){


    System.out.println(


    "The Displayable interface''s draw method");


    }


    }


    ![](image29.jpg)


    If both the Displayable and Colorable interfaces implement the draw method, then
    we have the same ambiguous situation we had in the previous section. The compiler
