  `5`\n`Lq`\n`10`\n`µ = Ls / W = 5`\n`W s`\n`0.* 1`\n`W q`\n`0.* 2`\n\n# 图 3.8：利特尔定律队列\n\
  \nJDBC 连接管理\n\n25\n\n对于恒定的吞吐量，入队连接数 (`Lq`) 与连接获取时间 (`Wq`) 成正比。任何给定突发流量的总请求数计算如下：\n\
  \n`Lspike = λspike × W spike`\n\n处理所需的总时间由以下公式给出：\n\n`W = Lspike / µ = Lspike /\
  \ λ`\n`Lspike`\n`λspike × W spike`\n`µ`\n`λ`\n\n入队连接数及其所需的时间由以下方程表示：\n\n`Lq = Lspike\
  \ - Ls`\n`Wq = W - 1`\n\n假设每秒 `250` 个请求的流量突发持续 `3` 秒。\n\n`requests`\n`λspike = 250`\n\
  `s`\n`W spike = 3 s`\n\n`750` 个请求的突发需要 `15` 秒才能完全处理。\n\n`requests`\n`Lspike = 250\
