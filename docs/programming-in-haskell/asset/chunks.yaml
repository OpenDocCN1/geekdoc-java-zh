    \n本入门教程非常适合初学者：它不需要任何编程经验，所有概念都在精心挑选的示例帮助下从第一性原理进行解释。每一章都包含一系列练习，范围从基础练习到扩展项目不等，并提供了关于更高级主题的进一步阅读建议。其内容清晰明了，并受益于多年来的完善和课堂测试。\n\
    \n## 特性\n\n- 书籍网站为讲师和学生免费提供每个章节的 Powerpoint 幻灯片\n- 讲师可以获得练习题答案以及考试题（附答案）\n- 书中的所有代码均完全符合\
