    # chapter 3: Types and classes


    In this chapter we introduce types and classes, two of the most fundamental concepts
    in Haskell. We start by explaining what types are and how they are used, then
    present a number of basic types and ways to build larger types by combining types,
    discuss function types in more detail, and conclude with the concepts of polymorphic
    types and type classes.


    ![](images/line.jpg)


    ## 3.1 Basic concepts


    A *type* is a collection of related values. For example, the type `Bool` contains
    the two values `False` and `True`, while the type `Bool -> Bool` contains all
    functions that map arguments from `Bool` to results from `Bool`, such as the logical
    negation function `¬`. We use the notation `υ :: T` to mean that `υ` is a value
    in the type `T`, and say that `υ` “has type” `T`. For example:


    ![image](images/table29_00.jpg)


    More generally, the symbol :: can also be used with expressions that have not
    yet been evaluated, in which case `e :: T` means that evaluation of the expression
    `e` will produce a value of type `T`. For example:


    ![image](images/table29_01.jpg)


    In Haskell, every expression must have a type, which is calculated prior to evaluating
    by a process called *type inference*. The key to this process is a typing rule
    for function application, which states that if `f` is a function that maps arguments
    of type `A` to results of type `B`, and `e` is an expression of type `A`, then
    the application `f e` has type `B`:


    ![image](images/image30_00.jpg)


    For example, the typing `¬ False :: Bool` can be inferred from this rule using
    the fact that `¬ :: Bool -> Bool` and `False :: Bool`. On the other hand, the
    expression `¬ 3` does not have a type under the above rule for function application,
    because this would require that `3 :: Bool`, which is not valid because `3` is
    not a logical value. Expressions such as `¬ 3` that do not have a type are said
    to contain a type error, and are deemed to be invalid expressions.


    Because type inference precedes evaluation, Haskell programs are *type safe*,
    in the sense that type errors can never occur during evaluation. In practice,
    type inference detects a very large class of program errors, and is one of the
    most useful features of Haskell. Note, however, that the use of type inference
    does not eliminate the possibility that other kinds of error may occur during
    evaluation. For example, the expression `1 div 0` is free from type errors, but
    produces an error when evaluated because division by zero is undefined.

