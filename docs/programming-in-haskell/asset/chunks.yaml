    A type that contains one or more class constraints is called *overloaded*, as
    is an expression with such a type. Hence, `Num a ⇒ a → a → a` is an overloaded
    type and `(+)` is an overloaded function. More generally, most of the numeric
    functions provided in the standard prelude are overloaded. For example:


    ![image](images/image36_00.jpg)


    Moreover, numbers themselves are also overloaded. For example, `3 :: Num a ⇒ a`
    means that for any numeric type `a`, the number 3 has type `a`.


