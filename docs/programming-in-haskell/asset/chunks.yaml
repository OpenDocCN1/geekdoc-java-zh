  raw: 'Using this idea, we now see that under lazy evaluation *ones* is not an infinite
    list as such, but rather a potentially infinite list, which is only evaluated
    as much as required by the context. This idea is not restricted to lists, but
    applies equally to any form of data structure in Haskell. For example, the last
    exercise for this chapter involves potentially infinite trees.


    ![](images/line.jpg)


    12.6 Modular programming


    Lazy evaluation also allows us to separate control from data in our computations.
    For example, a list of three ones can be produced by selecting the first three
    elements (control) of the infinite list of ones (data):


    ![image](images/image146_01.jpg)


    Using the definition of *take* from the standard prelude


    ![image](images/image144_00.jpg)


    this behaviour arises using lazy evaluation as follows:


    ![image](images/image144_01.jpg)


    That is, the data is only evaluated as much as required by the control, and these
    two parts take it in turn to perform reductions. Without lazy evaluation, the
    control and data parts would need to be combined in the form of a single function
    that produces a list of *n* identical elements, such as:


    ![image](images/image145_00.jpg)


    Being able to modularise programs by separating them into logically distinct parts
    is an important goal in programming, and being able to separate control from data
    is one of the most important benefits of lazy evaluation.


    Note that care is still required when programming with infinite lists, to avoid
    non-termination. For example, the expression


    ![image](images/image147_04.jpg)


    (where [*n* . .] produces the infinite list of integers beginning with *n*) will
    produce the integers 1, 2, 3, 4, 5 and then loop forever, because the function
    *filter* (≤ 5) keeps testing elements of the infinite list in a vain attempt to
    find another that is less than or equal to five. In contrast, the expression


    ![image](images/image147_05.jpg)


    will produce the same integers and then terminate, because *takeWhile* (≤ 5) stops
    as soon as it finds an element of the list that is greater than five.


    We conclude this section with an example concerning prime numbers. In [chapter
    5](#12_chapter_title_5.html) we wrote a function to generate prime numbers up
    to a given limit. Here is a simple procedure for generating the infinite sequence
    of all prime numbers, as opposed to some finite prefix of this sequence:


    •  write down the infinite sequence 2, 3, 4, 5, 6, · · ·;


    •  mark the first number, *p*, in the sequence as prime;


    •  delete all multiples of *p* from the sequence;


    •  return to the second step.


    Note that the first and third steps require an infinite amount of work, and hence
    in practice the steps must be interleaved. The first few iterations of this procedure
    can be illustrated as follows:


    ![image](images/image145_01.jpg)


    Each row corresponds to one iteration, with the first row being the initial sequence
    (step one), the first number in each row being written in bold to indicate its
    primality (step two), and all multiples of this number being underlined to indicate
    their deletion (step three) prior to the next iteration. In this manner, we can
    imagine the initial sequence of numbers falling downwards, with certain numbers
    being sieved out at each stage by the underlining, and the bold numbers forming
    the infinite sequence of primes:


    ![image](images/image148_03.jpg)


    The above procedure for generating prime numbers is known as the *sieve of Eratosthenes*,
    after the Greek mathematician who first described it. This procedure can be translated
    directly into Haskell:


    ![image](images/image146_00.jpg)


    That is, starting with the infinite list [2 *. .*] (step one), we apply the function
    *sieve* that retains the first number *p* as being prime (step two), and then
    calls itself recursively with a new list obtained by filtering all multiples of
    *p* from this list (steps three and four). Lazy evaluation ensures that this program
    does indeed produce the infinite list of all prime numbers:


    ![image](images/image148_04.jpg)


    By freeing the generation of prime numbers from the constraint of finiteness,
    we have obtained a modular program on which different control parts can be used
    in different situations. For example, the first ten prime numbers, and the prime
    numbers less than ten, can be produced as follows:


    ![image](images/image148_05.jpg)


    ![](images/line.jpg)


    12.7 Strict application


    Haskell uses lazy evaluation by default, but also provides a special *strict*
    version of function application, written as $!, which can sometimes be useful.
    Informally, an expression of the form *f* $! *x* behaves in the same way as the
    normal application *f x*, except that the top-level of evaluation of the argument
    expression *x* is forced before the function *f* is applied.


    For example, if the argument has a basic type, such as *Int* or *Bool*, then top-level
    evaluation is simply complete evaluation. On the other hand, for a pair type such
    as (*Int*, *Bool*), evaluation is performed until a pair of expressions is obtained,
    but no further. Similarly, for a list type, evaluation is performed until the
    empty list or the cons of two expressions is obtained.


    More formally, an expression of the form *f* $! *x* is only a redex once evaluation
    of the argument *x*, using lazy evaluation as normal, has reached the point where
    it is known that the result is not an undefined value, at which point the expression
    can be reduced to the normal application *f x*. For example, using the definition
    *square n* = *n* * *n*, evaluation of *square* $! (1 + 2) proceeds in a call-by-value
    manner, by first evaluating the argument expression 1 + 2 to give the value 3,
    and then applying the function *square*:


    ![image](images/image147_00.jpg)


    When used with a curried function with multiple arguments, strict application
    can be used to force top-level evaluation of any combination of arguments. For
    example, if *f* is a curried function with two arguments, an application of the
    form *f x y* can be modified to have three different behaviours:


    ![image](images/image147_01.jpg)


    In Haskell, strict application is mainly used to improve the space performance
    of programs. For example, consider a function *sumwith* that calculates the sum
    of a list of integers using an accumulator value:


    ![image](images/image147_02.jpg)


    Then using lazy evaluation, we have:


    ![image](images/image147_03.jpg)


    Note that the entire summation ((0 + 1) + 2) + 3 is constructed before any additions
    are actually performed. More generally, *sumwith* will construct a summation whose
    size is proportional to the number of integers in the original list. For example,
    evaluating *sumwith* 0 [1 *. .* 10000] using Hugs will quickly exhaust the available
    memory and produce an error message. In practice, it would be preferable to perform
    each addition as soon as it is introduced, in order to avoid running out of memory
    in this way.


    This behaviour can be achieved by redefining *sumwith* using strict application,
    to force evaluation of its accumulator value:


    ![image](images/image148_00.jpg)


    For example, we now have:


    ![image](images/image148_01.jpg)


    This evaluation requires more steps than previously, due to the additional overhead
    of using strict application, but now performs each addition as soon as it is introduced,
    rather than constructing a large summation. For example, evaluating *sumwith*
    0 [1 *. .* 10000] using Hugs now gives the correct result, as opposed to producing
    an error as previously.


    Generalising from the above example, one may wish to define a strict version of
    the higher-order library function *foldl* that forces evaluation of its accumulator
    prior to processing the tail of the list:


    ![image](images/image148_02.jpg)'
