  trans: "\n利用这个思想，我们现在可以看到在惰性求值下，`ones` 并不是一个意义上的无限列表，而是一个潜在的无限列表，它仅根据上下文的需要进行求值。这个思想并不局限于列表，同样适用于\
    \ Haskell 中的任何形式的数据结构。例如，本章的最后一个练习涉及潜在的无限树。\n\n![](img/line.jpg)\n\n## 12.6 模块化编程\n\
    \n惰性求值允许我们在计算中将控制与数据分离。例如，通过选择无限列表 `ones`（数据）的前三个元素（控制），可以可以产生一个包含三个 `1` 的列表：\n\
    \n![image](img/image146_01.jpg)\n\n使用标准预定义 prelude 中 `take` 的定义：\n\n![image](img/image144_00.jpg)\n\
    \n这种行为通过如下惰性求值产生：\n\n![image](img/image144_01.jpg)\n\n也就是说，数据只根据控制部分的需要进行求值，这两部分交替执行归约。如果没有惰性求值，控制部分和数据部分需要合并成单个函数来生成一个包含\
    \ `n` 个相同元素的列表，例如：\n\n![image](img/image145_00.jpg)\n\n通过将程序拆分为逻辑上不同的部分来实现模块化是编程中的一个重要目标，而将控制与数据分离是惰性求值最重要的优点之一。\n\
    \n注意，在使用无限列表进行编程时仍需小心，以避免非终止。例如，表达式\n\n![image](img/image147_04.jpg)\n\n（其中 `[n\
    \ . ..]` 生成从 `n` 开始的无限整数列表）将产生整数 1, 2, 3, 4, 5，然后无限循环，因为函数 `filter (≤ 5)` 会不断测试无限列表中的元素，徒劳地寻找另一个小于或等于五的元素。相比之下，表达式\n\
    \n![image](img/image147_05.jpg)\n\n将产生相同的整数然后终止，因为 `takeWhile (≤ 5)` 在发现列表中第一个大于五的元素时就会停止。\n\
    \n我们用一个关于质数的示例来结束本节。在第 5 章 中，我们写了一个函数来生成到给定限制的质数。这里有一个生成所有质数无限序列的简单步骤，而不是该序列的某个有限前缀：\n\
    \n* 写下无限序列 2, 3, 4, 5, 6, · · ·；\n* 将序列中的第一个数 `p` 标记为质数；\n* 从序列中删除所有 `p` 的倍数；\n\
    * 返回第二步。\n\n注意，第一步和第三步需要无限的工作量，因此在实践中，这些步骤必须是交替进行的。该过程的前几次迭代如下所示：\n\n![image](img/image145_01.jpg)\n\
    \n每一行对应一次迭代，第一行是初始序列（第一步），每行的第一个数字用**加粗**表示以指示其质性（第二步），该数的所有倍数都带有<u>下划线</u>，以表示在下一次迭代之前它们被删除（第三步）。通过这种方式，我们可以想象数字序列向下掉落，某些数字在每个阶段通过下划线被筛掉，而加粗数字构成了质数的无限序列：\n\
    \n![image](img/image148_03.jpg)\n\n上述生成质数的方法被称为“埃拉托尼筛法”，命名源于第一个描述它的希腊数学家。这个过程可以直接翻译为\
    \ Haskell：\n\n![image](img/image146_00.jpg)\n\n也就是说，从无限列表 `[2 .. ..]` 开始（第一步），我们应用\
    \ `sieve` 函数，该函数将第一个数 `p` 保留为质数（第二步），然后递归调用自身，并传入通过从列表中过滤掉所有 `p` 的倍数而获得的新列表（第三步和第四步）。惰性求值确保了该程序确实生成了所有质数的无限列表：\n\
    \n![image](img/image148_04.jpg)\n\n通过将质数的生成从有限性的限制中解放出来，我们获得了一个模块化的程序，可以在不同情况下使用不同的控制部分。例如，前十个质数以及小于十的质数可以如下所示生成：\n\
    \n![image](img/image148_05.jpg)\n\n![](img/line.jpg)\n\n## 12.7 严格应用\n\nHaskell\
    \ 默认使用惰性求值，但也提供了一种特殊的 `strict` 版本函数应用，写做 `$!`，这有时是有用的。通俗地说，形式为 `f $! x` 的表达式行为与普通应用\
    \ `f x` 相同，不同是在应用函数 `f` 之前强制对参数表达式 `x` 进行顶层求值。\n\n例如，如果参数具有基本类型，如 `Int` 或 `Bool`，那么顶层求值就是完全求值。另一方面，对于如\
    \ `(Int, Bool)` 这样的对类型，求值将执行到获得一对表达式为止，不再继续。同样，对于列表类型，求值将执行到获得空列表或两个表达式的构造（cons）为止。\n\
    \n更正式地说，形式为 `f $! x` 的表达式只有在使用标准惰性求值对参数 `x` 的求值达到结果不是未定义的点时，才是一个归约式（redex）。\n\n\
