    足以通过归纳证明 `reverse′ xs ys = reverse xs ++ ys`。注意，`reverse′` 的定义并没有引用原始的 `reverse`
    函数或连接操作。因此，`reverse` 本身现在可以重新定义如下：


    ![image](img/image160_02.jpg)


    例如，我们有：


