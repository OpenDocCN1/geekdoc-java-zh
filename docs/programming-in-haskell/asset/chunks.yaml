    ## 12.3 终止


    考虑以下递归定义：


    ![image](img/image140_01.jpg)


    也就是说，整数 `inf`（“infinity”的缩写）被定义为自身的后继。无论使用何种求值策略，求值 `inf` 都会产生越来越大的表达式，因此不会终止：


    ![image](img/image140_02.jpg)


    实践中，使用 Hugs 求值 `inf` 会迅速耗尽可用内存并产生错误。现在考虑表达式 `fst (0, inf)`，其中 `fst` 是选择二元组第一个组件的库函数，定义为
    `fst (x, y) = x`。对该表达式使用按值调用求值也会类似地导致不终止：


    ![image](img/image140_03.jpg)


    相比之下，使用按名调用求值只需一步即可终止，因为它通过立即应用 `fst` 的定义，从而避免了对非终止表达式 `inf` 的求值：


    ![image](img/image141_01.jpg)


    这个简单的例子说明，当按值调用评估无法终止时，按名调用评估可能会产生结果。更通地说，我们有以下重要属性：如果对于给表达式存在任何可以终止的求值序列，那么按名调用评估对该表达式也会终止，并产生相同的最终结果。


    总结，为了尽可能确保求值终止，按名调用评估比按值调用求值更好。


    ![](img/line.jpg)


    ## 12.4 归约次数


    现在考虑以下定义：


    ![image](img/image141_02.jpg)


    例如，使用按值调用求值，我们有：


    ![image](img/image141_03.jpg)


    相比之下，对同一表达式使用按名调用求值需要额外的一个归约步骤，这是因为在应用函数 `square` 时，`1 + 2` 被复制了，因此必须求值两次：


    ![image](img/image141_04.jpg)


    这个例子说明，按名调用求值可能比按值调用求值需要更多步骤，特别是当参数在函数体内被使用多次时。更通地说，我们有以下属性：参数在按值调用求值时精确地求值一次，但在按名调用时可能会求值多次。


    幸运的是，上述按名调用评估的效率问题可以通过使用指针来指示求值过程中表达式的共享（sharing）轻松解决。如果一个参数在函数体内被多次使用，我们不必物理上复制参数，而是只保留参数的一个拷贝并创建指向它的多个指针。通过这种方式，对参数进行的任何归约都在指向该参数的每个指针之间共享。例如，使用这种策略，我们有：


    ![image](img/image142_01.jpg)


    也就是说，在第一步应用定义 `square n = n * n` 时，我们保留参数 `1 + 2` 的单个拷贝，并向它创建了两个指针。这样，当表达式 `1
    + 2` 在第二步中归约时，两个指针都共享该结果。


    结合共享使用的按名调用评估被称为*惰性求值*（lazy evaluation）。这是 Haskell 使用的求值策略，结果 Haskell 被称为惰性语言。基于按名调用评估，惰性求值具有确保求值尽可能终止的属性。此外，使用共享确保了惰性求值的步骤永远不会多于按值调用。“惰性”一词的使用稍后会解释。


