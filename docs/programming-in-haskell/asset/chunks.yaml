    As we have seen in previous chapters, functions with multiple arguments are usually
    defined in Haskell using the notion of currying. That is, the arguments are taken
    one at a time by exploiting the fact that functions can return functions as results.
    For example, the definition


    ![image](images/image73_00.jpg)


    means


    ![image](images/image75_04.jpg)


    and states that `add` is a function that takes an integer `x` and returns a function,
    which in turn takes another integer `y` and returns their sum `x + y`. In Haskell,
    it is also permissible to define functions that take functions as arguments. For
    example, a function that takes a function and a value, and returns the result
    of applying the function twice to the value, can be defined as follows:


    ![image](images/image73_01.jpg)


    For example:


    ![image](images/image76_02.jpg)


    Moreover, because `twice` is a curried function, it can be partially applied with
    just one argument to build other useful functions. For example, a function that
    quadruples a number is given by `twice (2)`, and the fact that reversing a (finite)
    list twice has no effect is captured by the equation `twice reverse = id`, where
    `id` is the identity function defined by `id x = x`.


    Formally speaking, a function that takes a function as an argument or returns
    a function as a result is called `higher-order`. In practice, however, because
    the term curried already exists for returning functions as results, the term higher-order
    is often just used for taking functions as arguments. It is this latter interpretation
    that is the subject of this chapter.


    Using higher-order functions considerably increases the power of Haskell, by allowing
    common programming patterns to be encapsulated as functions within the language
    itself. More generally, higher-order functions can be used to define “domain-specific”
    languages within Haskell. For example, in this chapter we present a simple language
    for processing lists, and in [chapters 8](#15_chapter_title_8.html) and [9](#16_chapter_title_9.html)
    we do the same for building parsers and interactive programs.


    ![](images/line.jpg)


    ## 7.2 Processing lists


    The standard prelude defines a number of useful higher-order functions for processing
    lists. For example, the function `map` applies a function to all elements of a
    list, and can be defined using a list comprehension as follows:


    ![image](images/image74_00.jpg)


    That is, `map f xs` returns the list of all values `f x` such that `x` is an element
    of the list `xs`. For example, we have:


    ![image](images/image76_03.jpg)


    There are three further points to note about `map`. First of all, it is a polymorphic
    function that can be applied to lists of any type, as are most higher-order functions
    on lists. Secondly, it can be applied to itself to process nested lists. For example,
    the function `map (map (+1))` increments each number in a list of lists of numbers,
    as shown in the following calculation:


    ![image](images/image74_01.jpg)


    And, finally, the function `map` can also be defined using recursion:


    ![image](images/image75_00.jpg)


    That is, applying a function to all elements of the empty list gives the empty
    list, while for a non-empty list the function is simply applied to the head of
    the list, and we then proceed to apply the function to all elements of the tail.
    The original definition for `map` using a list comprehension is simpler, but the
    recursive definition is preferable for reasoning purposes (see [chapter 13](#20_chapter_title_13.html).)


    Another useful library function is `filter`, which selects all elements of a list
    that satisfy a predicate, where a `predicate` (or property) is a function that
    returns a logical value. As with `map`, the function `filter` also has a simple
    definition using a list comprehension:


    ![image](images/image75_01.jpg)


    That is, `filter p xs` returns the list of all values `x` such that `x` is an
    element of the list `xs` and the value of `p x` is `True`. For example:


    ![image](images/image77_03.jpg)


    As with `map`, the function `filter` can be applied to lists of any type, and
    can be defined using recursion for the purposes of reasoning:


    ![image](images/image75_02.jpg)


    That is, selecting all elements that satisfy a predicate from the empty list gives
    the empty list, while for a non-empty list the result depends upon whether the
    head satisfies the predicate. If it does then the head is retained and we then
    proceed to filter elements from the tail of the list, otherwise the head is discarded
    and we simply filter elements from the tail.


    The functions `map` and `filter` are often used together in programs, with `filter`
