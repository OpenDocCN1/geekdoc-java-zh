    # 13.4 Induction on numbers


    Most interesting functional programs involve some form of recursion. Reasoning
    about such programs normally proceeds using the simple but powerful technique
    of *induction*. Let us begin by recalling the simplest example of a recursive
    type, namely the type of natural numbers:


    ![image](images/image156_03.jpg)


    This declaration states that `Zero` is a value of type `Nat` (the base case),
    and that if `n` is a value of type `Nat`, then so is `Succ n` (the recursive case).
    Implicit in the declaration is the fact that `Zero` and `Succ` are the only constructors
    for the type `Nat`. Hence, the values of `Nat` can be enumerated as follows:


    ![image](images/image154_01.jpg)


