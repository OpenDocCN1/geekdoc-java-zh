    For example:


    ![image](images/image79_00.jpg)


    The bracketing in this calculation specifies that addition is now assumed to associate
    to the left. In practice, however, the order of association does not affect the
    value of the result in this case, because addition is *associative*. That is,
    *x* + (*y* + *z*) = (*x* + *y*) + *z* for any numbers *x*, *y*, and *z*.


    Generalising from the *sum* example, many functions on lists can be defined using
    the following simple pattern of recursion:


    ![image](images/image79_01.jpg)


