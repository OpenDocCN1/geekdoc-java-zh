    ## 5.5 The Caesar cipher


    We conclude this chapter with an extended example. Consider the problem of encoding
    a string in order to disguise its contents from unintended readers. A well-known
    encoding method is the `Caesar cipher`, named after its use by Julius Caesar.
    To encode a string, Caesar simply replaced each letter in the string by the letter
    three places further down in the alphabet, wrapping around at the end of the alphabet.
    For example, the string


    ![image](images/image56_06.jpg)


    would be encoded as


    ![image](images/image56_07.jpg)


    More generally, the shift factor of three used by Caesar can be replaced by any
    integer between one and twenty-five, thereby giving twenty-five different ways
    of encoding a string. For example, with a shift factor of ten, the original string
    above would be encoded as


    ![image](images/image57_04.jpg)


    In the remainder of this section we show how Haskell can be used to implement
    the Caesar cipher, and how the cipher itself can easily be “cracked” by exploiting
    information about letter frequencies.


    ### Encoding and decoding


    For simplicity, we will only encode the lower-case letters within a string, leaving
    other characters such as upper-case letters and punctuation unchanged. We begin
    by defining a function `let2int` that converts a lower-case letter between ’a’
    and ’z’ into the corresponding integer between 0 and 25, together with a function
    `int2let` that performs the opposite conversion:


    ![image](images/image55_00.jpg)


    (The library functions `ord` :: `Char` → `Int` and `chr` :: `Int` → `Char` convert
    between characters and their Unicode representation as integers.) For example:


    ![image](images/image57_05.jpg)


    Using these two functions, we can define a function `shift` that applies a shift
    factor to a lower-case letter by converting the letter into the corresponding
    integer, adding on the shift factor and taking the remainder when divided by twenty-six
    (thereby wrapping around at the end of the alphabet), and converting the resulting
    integer back into a lower-case letter:


    ![image](images/image55_01.jpg)


    Note that this function accepts both positive and negative shift factors, and
    that only lower-case letters are changed. For example:


    ![image](images/image57_06.jpg)


    Using `shift` within a string comprehension, it is now easy to define a function
    that encodes a string using a given shift factor:


    ![image](images/image56_00.jpg)


    A separate function to decode a string is not required, because this can be achieved
    by simply using a negative shift factor. For example:


    ![image](images/image58_00.jpg)


    ### Frequency tables


    The key to cracking the Caesar cipher is the observation that some letters are
    used more frequently than others in English text. By analysing a large volume
    of text, one can derive the following table of approximate frequencies of the
    twenty-six letters:


    ![image](images/image56_01.jpg)


    For example, the letter ‘e’ occurs most often, with a frequency of 12.7%, while
    ’q’ and ’z’ occur least often, with a frequency of 0.1%. It is also useful to
    produce frequency tables for individual strings. To this end, we first define
    a function that calculates the percentage of one integer with respect to another,
    returning the result as a floating-point number:


    ![image](images/image56_02.jpg)


    (The library function `fromIntegral` :: `Int` → `Float` converts an integer into
    the corresponding floating-point number.) Using `percent` within a string comprehension,
    together with the functions `lowers` and `count` from the previous section, we
    can define a function that returns a frequency table for any string:


    ![image](images/image56_03.jpg)


    For example:


    ![image](images/image58_01.jpg)


    That is, the letter ‘a’ occurs with a frequency of 6.7%, the letter ‘b’ with a
    frequency of 13.3%, and so on. The use of the local definition `n = lowers xs`
    within `freqs` ensures that the number of lower-case letters in the argument string
    is calculated once, rather than each of the twenty-six times that number is used
    within the string comprehension.


    ### Cracking the cipher


    A standard method for comparing a list of observed frequencies `os` with a list
    of expected frequencies `es` is the `chi-square` statistic, defined by the following
    summation in which `n` denotes the length of the two lists, and `xs[i]` denotes
    the *i*th element of a list `xs` counting from zero:


    ![image](images/image57_00.jpg)


    The details of the chi-square statistic need not concern us here, only the fact
    that the smaller the value it produces the better the match between the two frequency
    lists. Using the library function `zip` and a list comprehension, it is easy to
    translate the above formula into a function definition:


    ![image](images/image57_01.jpg)


    In turn, we define a function that rotates the elements of a list `n` places to
    the left, wrapping around at the start of the list, and assuming that `n` is between
    zero and the length of the list:


    ![image](images/image57_02.jpg)


    For example:


    ![image](images/image59_01.jpg)

