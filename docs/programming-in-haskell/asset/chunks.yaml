    ### 2.1 The Hugs system


    As we saw in the previous chapter, small Haskell programs can be executed by hand.
    In practice, however, we usually require a system that can execute programs automatically.
    In this book we use an interactive system called `Hugs`, which is the most widely
    used implementation of Haskell.


    The interactive nature of Hugs makes it well suited for teaching and prototyping,
    and its performance is sufficient for most applications. However, if greater performance
    or a stand-alone executable version of a program is required, a number of compilers
    for Haskell are also available, of which the most widely used is the Glasgow Haskell
    Compiler. This compiler also has an interactive version that operates in a similar
    manner to Hugs, and can readily be used in its place for the purposes of this
    book.


    ![](images/line.jpg)


    ### 2.2 The standard prelude


    When the Hugs system is started it first loads a library file called `Prelude.hs`,
    and then displays a > prompt to indicate that the system is waiting for the user
    to enter an expression to be evaluated. For example, the library file defines
    many familiar functions that operate on integers, including the five main arithmetic
    operations of addition, subtraction, multiplication, division, and exponentiation,
    as illustrated below:


    ![image](images/image25_00.jpg)


