    **List comprehensions**


    In this chapter we introduce list comprehensions, which allow many functions on
    lists to be defined in simple manner. We start by explaining generators and guards,
    then introduce the function *zip* and the idea of string comprehensions, and conclude
    by developing a program to crack the Caesar cipher.


