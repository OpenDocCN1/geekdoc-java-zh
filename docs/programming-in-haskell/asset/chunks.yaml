    ## 5 列表导式


    在本章中，我们引入列表导式（list comprehensions），它允许以简单的方式定义许多列表函数。我们首先解释生成器（generators）和守卫（guards），然后引入函数
    `*zip*` 和字符串导式的概念，最后通过开发一个破解密码的程序结束。


    ![](img/line.jpg)


    ## 5.1 生成器


    在数学中，`*comprehension*`（导式）符号可以从现有集合构造新集合。例如，导式 `{x² | x ∈ {1 .* 5}}` 产生集合 `{1,
    4, 9, 16, 25}`，其中所有数字 `*x²` 满足 `*x` 是集合 `{1 .* 5}` 中的元素。在 Haskell 中，可以使用类似的导式符号从现有列表构造新列表。例如：


    ![image](img/image52_03.jpg)


    符号 `|` 和 `←` 分别读作“使得”和“源自”，表达式 `x ← [1 .* 5]` 被称为生成器。列表导式可以有多个生成器，连续的生成器之间用逗号分隔。例如，列表
    `[1, 2, 3]` 中的元素与列表 `[4, 5]` 中的元素的所有可能组合可以按如下方式产生：


    ![image](img/image52_04.jpg)


    更改此示例中两个生成器的顺序会产生相同的对集合，但排列顺序不同：


    ![image](img/image52_05.jpg)


    特别地，在这种情况下，对中的 `*x` 分量的变化比 `*y` 分量更频繁（1,2,3,1,2,3 对 4,4,4,5,5），而在上一个情况下，`*y` 分量的变化比
    `*x` 分量更频繁（4,5,4,5）。这些行为可以通过将后期生成器理解为嵌套的来说，因此它们改变值比早期生成器更频繁。


    后期生成器也可以依赖于早期生成器的值。例如，来自列表 `[1 .* 3]` 的所有配对列表可以如下所示产生：


    ![image](img/image53_03.jpg)


    作为这种思想的另一个示例，连接列表的库函数 `*concat*` 可以通过使用一个生成器选择每个列表，另一个选择每个元素来定义：


    ![image](img/image51_00.jpg)


    通配模式 `_` 有时在生成器中用于丢弃某些元素。例如，选择列表中所有部分的可以如下定义：


    ![image](img/image51_01.jpg)


    同样，计算列表 `*length*` 的库函数可以通过将每个元素替换为 1 并求和来定义：


    ![image](img/image51_02.jpg)


    在这种情况下，生成器 `_ ← xs` 仅作为产生相应数量 1 的计数器。


    ![](img/line.jpg)


    ## 5.2 守卫


    列表导式还可以使用被称为守卫（guards）的逻辑表达式来过滤早期生成器产生的值。如果守卫为 `True` 则保留当前值，否则丢弃。例如，导式 `[x |
