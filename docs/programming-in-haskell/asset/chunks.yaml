    请注意，赋予新类型和构造函数的名称对 Hugs 系统本身没有固有意义。例如，上述声明也可以同样写成 `data` `A` = `B | C`，因为名称的精确细节并不重要，只要它们之前没有被使用过。`Bool`、`False`
    和 `True` 等名称的意义是由程序员通过他们在新类型上定义的函数来赋值的。


    新类型的值的使用方式与内置类型完全相同。特别是，它们可以自由地作为参数传递给函数、作为函数的返回结果、存储在列表等数据结构中，并用于模式匹配。例如，给定声明：


