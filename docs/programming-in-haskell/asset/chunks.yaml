    ## 3.2 Basic types


    Haskell provides a number of basic types that are built-in to the language, of
    which the most commonly used are described below.


    * `Bool` – **logical values**

    This type contains the two logical values `False` and `True`.


    * `Char` – **single characters**

    This type contains all single characters that are available from a normal keyboard,
    such as ’a’, ’A’, ’3’ and ’_’, as well as a number of control characters that
    have a special effect, such as ’\n’ (move to a new line) and ’\t’ (move to the
    next tab stop). As is standard in most programming languages, single characters
    must be enclosed in single forward quotes ’ ''’.


    * `String` – **strings of characters**

    This type contains all sequences of characters, such as "abc", "1+2=3", and the
    empty string "". Again, as is standard in most programming languages, strings
    of characters must be enclosed in double quotes " ".


    * `Int` – **fixed-precision integers**

    This type contains integers such as −100, 0, and 999, with a fixed amount of computer
    memory being used for their storage. For example, the Hugs system has values of
    type `Int` in the range −2^(31) to 2^(31) − 1\. Going outside this range can give
    unexpected results. For example, evaluating `2 ↑ 31 :: Int` using Hugs (the use
    of `::` forces the result to an `Int` rather than some other numeric type) gives
    a negative number as the result, which is incorrect.


    * `Integer` – **arbitrary-precision integers**

    This type contains all integers, with as much memory as necessary being used for
    their storage, thus avoiding the imposition of lower and upper limits on the range
    of numbers. For example, evaluating `2 ↑ 31 :: Integer` using any Haskell system
    will produce the correct result.


    Apart from the different memory requirements and precision for numbers of type
    `Int` and `Integer`, the choice between these two types is also one of performance.
    In particular, most computers have built-in hardware for processing fixed-precision
    integers, whereas arbitrary-precision integers must usually be processed using
    the slower medium of software, as sequences of digits.


    * `Float` – **single-precision floating-point numbers**

    This type contains numbers with a decimal point, such as −12.34, 1.0, and 3.14159,
    with a fixed amount of memory being used for their storage. The term *floating-point*
    comes from the fact that the number of digits permitted after the decimal point
    depends upon the magnitude of the number. For example, evaluating `sqrt 2 :: Float`
    using Hugs gives the result 1.41421 (the library function `sqrt` calculates the
    square root of a number), which has five digits after the point, whereas `sqrt
    99999 :: Float` gives 316.226, which only has three digits after the point. Programming
    with floating-point numbers is a specialist topic that requires a careful treatment
    of rounding errors, and we say little more about such numbers in this introductory
    text.


    We conclude this section by noting a single number may have more than one numeric
    type. For example, `3 :: Int`, `3 :: Integer`, and `3 :: Float` are all valid
    typings for the number 3\. This raises the interesting question of what type such
    numbers should be assigned during type inference, which will be answered later
    in this chapter when we consider type classes.


    ![](images/line.jpg)


    ## 3.3 List types


    A *list* is a sequence of *elements* of the same type, with the elements being
    enclosed in square parentheses and separated by commas. We write `[T]` for the
    type of all lists whose elements have type `T`. For example:


    ![image](images/image32_00.jpg)


    The number of elements in a list is called its *length*. The list `[]` of length
    zero is called the empty list, while lists of length one, such as `[False]` and
    `[''a’]`, are called singleton lists. Note that `[[]]` and `[]` are different
    lists, the former being a singleton list comprising the empty list as its only
    element, and the latter being simply the empty list.


    There are three further points to note about list types. First of all, the type
    of a list conveys no information about its length. For example, the lists `[False,
    True]` and `[False, True, False]` both have type `[Bool]`, even though they have
    different lengths. Secondly, there are no restrictions on the type of the elements
    of a list. At present we are limited in the range of examples that we can give
    because the only non-basic type that we have introduced at this point is list
    types, but we can have lists of lists, such as:


    ![image](images/image34_02.jpg)


    Finally, there is no restriction that a list must have a finite length. In particular,
    due to lazy evaluation, lists with infinite length are both natural and practical,
    as we shall see in chapter 2.


    ![](images/line.jpg)


    ## 3.4 Tuple types


    A *tuple* is a finite sequence of *components* of possibly different types, with
    the components being enclosed in round parentheses and separated by commas. We
    write `(T[1], T[2], ..., T[n])` for the type of all tuples whose *i*th components
    have type `T[i]` for any *i* in the range 1 to *n*. For example:


    ![image](images/image32_01.jpg)


    The number of components in a tuple is called its *arity*. The tuple `()` of arity
    zero is called the empty tuple, tuples of arity two are called pairs, tuples of
    arity three are called triples, and so on. Tuples of arity one, such as `(False)`,
    are not permitted because they would conflict with the use of parentheses to make
    the evaluation order explicit, such as `(1 + 2) * 3`.


    As with list types, there are three further points to note about tuple types.
    First of all, the type of a tuple conveys its arity. For example, the type `(Bool,
    Char)` contains all pairs comprising a first component of type `Bool` and a second
    component of `Char`. Secondly, there are no restrictions on the types of the components
    of a tuple. For example, we can now have tuples of tuples, tuples of lists, and
    lists of tuples:


    ![image](images/image33_00.jpg)


    Finally, note that tuples must have a finite arity, in order to ensure that tuple
    types can always be calculated prior to evaluation.


    ![](images/line.jpg)


