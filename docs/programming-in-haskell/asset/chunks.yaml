    ## Lambda 表达式


    现在让我们定义一个 `mult` 的柯里化版本，它一次接受一个参数，并使用 Lambda 表达式使柯里化的使用更加显式：


    ![image](img/image139_01.jpg)


    然后使用最内层求值（innermost evaluation），例如我们有：


    ![image](img/image139_02.jpg)


    这意味着两个参数现在被逐个替换到函数 `mult` 的体内，正如我们在使用柯里化时预期的那样，而不是像上一节那样同时替换。这种行为是因为在表达式 `mult
    3 (2 + 3)` 中，`mult 3` 是左侧的最内层归约式（redex），而不是表达式 `mult (3, 2 + 3)` 中的 `2 + 3`。在上述计算的第二步中对
    `mult 3` 执行归约得到了 Lambda 表达式 `(λy → 3 * y)`，它等待第二个参数的求值结果。


    需要注意的是，在 Haskell 中，禁止在 Lambda 表达式内部选择归约式。不“在 Lambda 之下进行归约”的原因是，函数被视为黑盒，我们不允许查看其内部。更正式地说，对函数可以执行的唯一操作将其应用于一个参数。因此，只有在函数被应用后，才允许在函数体内进行归约。例如，Lambda
    表达式 `λx → 1 + 2` 被认为已经完全求值了，尽管它的体内包含归约式 `1 + 2`，但一旦此函数应用到参数上，该归约式的求值就可以进行：


    ![image](img/image140_00.jpg)


    使用最内层求值和最外层求值但不在 Lambda 内部进行，通常分别被称为*按值调用*（call-by-value）和*按名调用*（call-by-name）求值。在接下来的两个节中，我们将探讨这两种求值策略在两个重要属性上的比较，即它们的终止行为和所需的归约步骤。


