    ## 10.5 抽象机器


    作为第二个扩展示例，考虑一种使用加法运算符从整数构建的简单算术表达式类型，并带有一个将此类表达式求值为整数结果的函数：


    ![image](img/image121_00.jpg)


    例如，表达式 `(2 + 3) + 4` 的求值如下：


    ![image](img/image121_01.jpg)


    注意，`value`函数的定义并没有规定加法的左参数应该在右参数之前求值，或者更通俗地说，在任何一点求值的下一步应该是什么。相反地，求值顺序是由 Haskell
    决定的。然而，如果需要，可以通过为表达式定义一个`抽象机器`来使这种控制信息显式化，该机器指定了它们求值的逐步处理过程。


    为此，我们首先为抽象机器声明一种`控制栈`类型，它包含了一系列机器在完成当前求值后需要执行的操作列表：


    ![image](img/image121_02.jpg)


    这两个操作的含义稍后会解释。我们现在定义一个在控制栈上下文中求值表达式的函数：


    ![image](img/image122_00.jpg)


    也就是说，如果表达式是一个整数，则它已经完全完全求值了，我们开始执行控制栈。如果表达式是一个加法，我们求值第一个参数 `x`，并将操作 `EVAL y` 置于控制栈顶部，表示在第一个参数的求值完成后，应该求值第二个参数
    `y`。相应地，我们定义了在整数参数上下文中执行控制栈的函数：


    ![image](img/image122_01.jpg)


    也就是说，如果栈为空，我们返回整数参数作为执行的结果。如果栈顶是一个操作 `EVAL y`，我们求值表达式 `y`，并将指令 `ADD n` 置于剩余栈的顶部，表示在完成此操作后，将当前的整数参数
    `n` 与求值 `y` 的结果相加。最后，如果栈顶是一个操作 `ADD n`，则加法的两个参数的求值现在完成，我们在两个结果整数值之和的上下文中执行剩余的控制栈。


    最后，我们通过使用给定表达式和空控制栈调用 `eval`，定义了一个将表达式求值为整数的函数：


    ![image](img/image122_02.jpg)


    我们的抽象机器使用了两个互递归的函数 `eval` 和 `exec`，这一事实反映了它有两个状态，取决于它是由表达式的结构还是控制栈驱动的。为了说明这台机器，这里是它如何求值
    `(2 + 3) + 4` 的：


    ![image](img/image123_00.jpg)


    注意 `eval` 如何向下处理表达式中最左侧的整数，并在控制栈上维持一条待处理的右侧表达式的轨迹。随后，`exec` 沿着该轨迹向上移动，将控制权交还给
    `eval` 并并在的情况下执行加法。


    ![](img/line.jpg)


