    ## 5 List comprehensions


    In this chapter we introduce list comprehensions, which allow many functions on
    lists to be defined in simple manner. We start by explaining generators and guards,
    then introduce the function `*zip*` and the idea of string comprehensions, and
    conclude by developing a program to crack cipher.


    ![](images/line.jpg)


    ## 5.1 Generators


    In mathematics, the `*comprehension*` notation can be used to construct new sets
    from existing sets. For example, the comprehension `{x² | x ∈ {1 .* 5}}` produces
    the set `{1, 4, 9, 16, 25}` of all numbers `*x²` such that `*x` is an element
    of the set `{1 .* 5}`. In Haskell, a similar comprehension notation can be used
    to construct new lists from existing lists. For example:


    ![image](images/image52_03.jpg)


    The symbols `|` and `←` are read as “such that” and “is drawn from” respectively,
    and the expression `x ← [1 .* 5]` is called a generator. A list comprehension
    can have more than one generator, with successive generators separated by commas.
    For example, the list of all possible pairings of an element from the list `[1,
    2, 3]` with an element from `[4, 5]` can be produced as follows:


    ![image](images/image52_04.jpg)


    Changing the order of the two generators in this example produces the same set
    of pairs, but arranged in a different order:


    ![image](images/image52_05.jpg)


    In particular, whereas in this case the `*x` components of the pairs change more
    frequently than the `*y` components (1,2,3,1,2,3 vs 4,4,4,5,5), in the previous
    case the `*y` components change more frequently than the `*x` components (4,5,4,5
    vs 1,1,2,2,3,3). These behaviours can be understood by thinking of later generators
    as being deeply nested, and hence changing the values of their variables more
    frequently than earlier generators.


    Later generators can also depend upon the values from earlier generators. For
    example, the list of all possible pairings of elements from the list `[1 .* 3]`
    can be produced as follows:


    ![image](images/image53_03.jpg)


    As another example of this idea, the library function `*concat*` that concatenates
    a list of lists can be defined by using one generator to select each list in turn,
    and another to select each element from each list:


    ![image](images/image51_00.jpg)


    The wildcard pattern `_` is sometimes useful in generators to discard certain
    elements from a list. For example, a function that selects all the first components
    from a list of pairs can be defined as follows:


    ![image](images/image51_01.jpg)


    Similarly, the library function that calculates the `*length*` of a list can be
    defined by replacing each element by one and summing the resulting list:


    ![image](images/image51_02.jpg)


    In this case, the generator `_ ← xs` simply serves as a counter to govern the
    production of the appropriate number of ones.


    ![](images/line.jpg)


    ## 5.2 Guards


    List comprehensions can also use logical expressions called `guards` to filter
    the values produced by earlier generators. If a guard is `True`, then the current
    values are retained, and, if it is `False`, then they are discarded. For example,
    the comprehension `[x | x ← [1 .* 10], even x]` produces the list `[2, 4, 6, 8,
    10]` of all even numbers from the list `[1 .* 10]`. Similarly, a function that
    maps a positive integer to its list of positive `*factors*` can be defined as
    follows:


    ![image](images/image51_03.jpg)


    For example:


    ![image](images/image53_04.jpg)


    Recall that an integer greater than one is `*prime` if its only positive factors
    are one and the number itself. Hence, by using `*factors*`, a simple function
    that decides if an integer is prime can be defined as follows:


    ![image](images/image52_00.jpg)


    For example:


    ![image](images/image54_01.jpg)


    Note that deciding that a number such as 15 is not prime does not require the
    function `*prime` to produce all of its factors, because under lazy evaluation
    the result `False` is returned as soon as any factor other than one or the number
    itself is produced, which for this example is given by the factor 3.


    Returning to list comprehensions, using `*prime` we can now define a function
    that produces the list of all prime numbers up to a given limit:


    ![image](images/image52_01.jpg)


    For example:


    ![image](images/image54_02.jpg)


    In [chapter 12](#19_chapter_title_12.html) we will present a more efficient program
    to generate prime numbers using the famous “sieve of Eratosthenes”, which has
    a particularly clear and concise implementation in Haskell.

