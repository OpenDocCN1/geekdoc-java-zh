    chapter 8


    **Functional parsers**


    In this chapter we show how Haskell can be used to program simple parsers. We
    start by explaining what parsers are and why they are useful, show how parsers
    can naturally be viewed as functions, define a number of basic parsers and higher-order
    functions for combining parsers in various ways, and conclude by developing a
    parser for arithmetic expressions.


    ![](images/line.jpg)


    8.1 Parsers


    A *parser* is a program that takes a string of characters, and produces some form
    of tree that makes the syntactic structure of the string explicit. For example,
    given the string 2 * 3 + 4, a parser for arithmetic expressions might produce
    a tree of the following form, in which the numbers appear at the leaves of the
    tree, and the operators appear at the branches:


    ![image](images/image86_00.jpg)


    The structure of this tree makes explicit that + and * are operators with two
    arguments, and that * has higher priority than +.'
