    在 Haskell 中，`function`（函数）是一种接受一个或多个参数并产生单个结果的映射。它通过一个等式定义，该等式为函数命名，为它的每个参数命名，并提供了一个指定如何根据参数计算结果的主体。


    例如，一个接受数字 `x` 作为参数并产生结果 `x + x` 的函数 `double`，可以通过以下等式定义：


    ![image](img/image15_01.jpg)


    当函数被应用于实际参数时，结果通过将这些参数替换到函数体中的参数名来获得。这个过程可能会立即产生一个无法进一步简化的结果（例如一个数字）。然而，更常见的情况是，结果将是一个包含其他函数调用的表达式，这些表达式必须以相同的方式进行处理以产生最终结果。


    例如，将函数 `double` 应用于数字 `3` 的结果 `double 3`，可以通过以下计算确定，其中每一步都通过大括号中的短注释进行了解释：


    ![image](img/image13_00.jpg)


    同样，嵌套应用 `double` (`double` `2`)（即两次应用函数 `double`）的结果可以按如下方式计算：


    ![image](img/image14_00.jpg)


    或者，也可以从函数 `double` 的外部应用而不是内部应用开始来计算相同的结果：


    ![image](img/image14_01.jpg)


    然而，这种计算比我们的原始版本多了两步，因为表达式 `double 2` 在第一步中被复制了，因此被简化了两次。通常，在计算中应用函数的顺序不会影响最终结果的值，但它可能会影响所需的步骤数，并可能影响计算过程是否终止。这些问题在第
    12 章中有更详细的探讨。


    ![](img/line.jpg)


    ## 1.2 函数式编程


    什么是函数式编程？人们观点不一，很难给出一个精确的定义。总的来说，函数式编程可以被视为一种编程的`style`，其中计算的基本方法是将函数应用于参数。反之，函数式编程语言是一种`支持`并`鼓励`函数式风格的语言。


    为了说明这些思想，让我们考虑计算 1 到某个较大数字 `n` 之间整数（整数）之和的任务。在大多数目前的编程语言中，这通常通过两个存储可以随时间改变值的变量来实现，其中一个变量用于计数到
    `n`，另一个用于累加总和。


    例如，如果我们使用赋值符号 `:=` 来改变变量的值，并使用关键字 `repeat` 和 `until` 重复执行一系列指令直到满足某个条件，那么接下面的指令序列就计算了所需的总和：


    ![image](img/image15_00.jpg)


    也就是说，我们首先将计数器和总和都初始化为零，然后不断增加计数器并将此值加到总和，直到计数器达到 `n`，此时计算停止。


    在上面的程序中，计算的基本方法是改变存储的值，从这个意义来说执行程序会导致一系列赋值。例如，`n = 5` 的情况给出了以下序列，其中赋值给变量 `total`
    的最终值为所需的总和：


    ![image](img/table15_01.jpg)


    通常，将计算的基本方法作为改变存储的值的编程语言被称为`imperative`（命令式）语言，因为此类语言中的程序是由命令指令构建的，这些指令精确地指定了计算应该如何进行。


    现在，让我们考虑使用 Haskell 计算 1 到 `n` 之间的数字之和。这通常通过两个库函数实现，一个称为 `[1..n]`，用于生成 1 到 `n`
    之间的数字列表，另一个称为 `sum`，用于生成该列表之和：


    ![image](img/image17_00.jpg)


    在这个程序中，计算的基本方法是将函数应用于参数，从这个意义来说执行程序会导致一系列应用。例如，`n = 5` 的情况给出了以下序列，最终结果为所需的总和：


    ![image](img/image15_02.jpg)


    大多数命令式语言都支持某种形式的函数编程，因此 Haskell 程序 `sum [1..n]` 可以翻译成此类语言。然而，大多数命令式语言并不`鼓励`函数式风格编程。例如，许多语言不鼓励或禁止将函数存储在列表等数据结构中，禁止构建中间结构（如上例中的数字列表），禁止将函数作为参数传递或产生函数作为结果，或者禁止以自身定义函数。相比之下，Haskell
    对函数的使用方式没有施加此类限制，并提供了一系列特性使得使用函数编程既简单又强大。


    ![](img/line.jpg)


    ## 1.3 Haskell 的特性


    供参考，Haskell 的主要特性列在下方，并附书中给出更多细节的章节。


    - **简洁的程序** (第 2 章 和 第 4 章)


    由于函数式风格的高级，用 Haskell 编写的程序通常比其他语言`concise`得多，正如上一节的示例所示。此外，Haskell 的语法设计时考虑了简洁的程序，特别是通过少量的关键字以及允许使用缩进来指示程序的结构。虽然很难进行客观比较，但
    Haskell 程序通常比其他语言短两到十倍。


    - **强大的类型系统** (第 3 章 和 10 章)


    大多数现代编程语言都包含某种形式的`type system`来检测不兼容错误，例如尝试将数字和字符相加。Haskell 的类型系统对程序员要求的类型信息很少，但它通过一种称为类型推断的复杂过程，在程序执行之前自动检测出大类不兼容错误。Haskell
    的类型系统也比目前的语言更强大，允许函数是“多态”和“重载”。


    - **列表推导式** (第 5 章)


    计算中构建和处理数据的常用方法之一是使用列表。为此，Haskell 将列表作为语言的基本概念，并提供了一种简单但强大的`comprehension`表示法，通过从一个或多个列表中选择和过滤元素来构建新列表。使用推导式可以以清晰简洁的方式定义许多常用的列表函数，而不需要显式的递归。


    - **递归函数** (第 6 章)


    大多数非平凡程序都涉及某种形式的重复或循环。在 Haskell 中，实现循环的基本机制是使用以自身定义的`recursive`函数。许多计算在递归函数方面有简单且自然的定义，特别是当使用“模式匹配”和“守卫”将不同情况分离到不同的等式中时。


