    # Chapter 11


    ## The countdown problem


    In this chapter we show how Haskell can be used to solve the countdown problem,
    a numbers game in which the aim is to construct numeric expressions satisfying
    certain constraints. We start by formalising the rules of the problem in Haskell,
    and then present a simple but inefficient program that solves the problem, whose
    efficiency is then improved in two stages.


    ![](images/line.jpg)


    ## 11.1 Introduction


    Countdown is a popular quiz programme that has been running on British television
    since 1982, and includes a numbers game that we shall refer to as the *countdown
    problem*. The essence of the problem is as follows:


    Given a sequence of numbers and a target number, attempt to construct an expression
    whose value is the target, by combining one or more numbers from the sequence
    using addition, subtraction, multiplication, division and parentheses.


    Each number in the sequence can only be used at most once in the expression, and
    all of the numbers involved, including intermediate values, must be positive natural
    numbers (1, 2, 3*, . . .*). In particular, the use of negative numbers, zero,
    and proper fractions such as 2 ÷ 3, is not permitted.


    For example, suppose that we are given the sequence 1, 3, 7, 10, 25, 50, and the
    target 765\. Then one possible solution is given by the expression (1 + 50) *
    (25 − 10), as shown by the following simple calculation:


    ![image](images/image128_00.jpg)


    In fact, for this example it can be shown that there are 780 different solutions.
    On the other hand, keeping the same sequence but changing the target to 831 gives
    an example that can be shown to have no solutions.


    In the television version of the countdown problem, a number of additional rules
    are adopted to make the problem suitable for human players on a quiz programme.
    In particular, there are always six numbers selected from the sequence 1 *. .
    .* 10, 1 *. . .* 10, 25, 50, 75, 100, the target is always in the range 999, and
    there is a time limit of 30 seconds. It is natural to abstract from such constraints
    when developing a computer player, so none of the programs that we develop depends
    upon these extra rules. Note, however, we abstract from positive naturals to a
    richer domain such as the integers or rationals, as this would fundamentally change
    the computational complexity of the problem.


    ![](images/line.jpg)


    ## 11.2 Formalising the problem


    We start by defining a type for the four operators:


    ![image](images/image131_03.jpg)


    Using this type, we define a function `valid` that decides if the application
    of an operator to two naturals gives another positive natural, and a function
    `apply` that actually performs such application:


    ![image](images/image129_00.jpg)


    For example, the application `Sub` 2 3 is invalid because 2 − 3 is negative, while
    `Div` 2 3 is invalid because 2 ÷ 3 is rational. In turn, we define a type for
    numeric expressions, which can either be an integer value or the application of
    an operator to two argument expressions:


    ![image](images/image131_04.jpg)


    Using this type, we define a function that returns the list of `values` in an
    expression, and a function `eval` that returns the overall value of an expression,
    provided that this value is a positive natural number:


    ![image](images/image130_00.jpg)


    Note that the possibility of failure within `eval` is handled by returning a list
    of results, with the convention that a singleton list denotes success, and the
    empty list denotes failure. For example, for 2 + 3 and 2 − 3, we have:


    ![image](images/image132_03.jpg)


    Failure within `eval` could also be handled by using the *Maybe* type, but we
    prefer to use the list type in this case because the comprehension notation then
    provides a convenient way to define the `eval` function.


    We now define a number of useful combinatorial functions that return all lists
    satisfying certain properties. The function `subs` returns all subsequences of
    a list, which are given by all possible combinations of excluding or including
    each element, `interleave` returns all possible ways of inserting a new element
    into a list, and `perms` returns all permutations of a list, which are given by
    all possible reorderings of the elements:


    ![image](images/image130_01.jpg)


    For example:


    ![image](images/image132_04.jpg)


    In turn, a function that returns all `choices` from a list, which are given by
    all possible ways of selecting zero or more elements in any order, can then be
    defined simply by considering all permutations of all subsequences:


    ![image](images/image131_00.jpg)


    For example:


    ![image](images/image133_03.jpg)


    Finally, we can now define a function `solution` that formalises what it means
    to solve an instance of the countdown problem:


    ![image](images/image131_01.jpg)

