    注意，当 `s = c = [ ]` 时，这个新结果简化为 `exec (comp e) [] = [eval e]`，即我们原始的正确性陈述。除了避免正确性证明中的栈溢问题，累加器版本的编译器还有两个优点。首先，它避免了使用
    `++`，因此效率更高。其次，新证明的长度小于之前两个证明总长度的一半。正如形式化推理中常见的情况一样，以适当的方式推广结果可以显著简化其证明。数学是引导开发具有简单证明的高效程序的极佳工具！


