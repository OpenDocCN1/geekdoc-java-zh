    7.5 The composition operator


    The higher-order library operator ![](images/sm.jpg) returns the *composition*
    of two functions as a single function, and can be defined as follows:


    ![image](images/image80_01.jpg)


    That is, *f* ![](images/sm.jpg) *g* (read as “*f* composed with *g*”) is the function
    that takes an argument *x*, applies the function *g* to this argument, and applies
    the function *f* to the result. This operator could also be defined by (*f* ![](images/sm.jpg)
    *g*) *x* = *f* (*g x*). However, we prefer the above definition in which the *x*
    argument is shunted to the body of the definition using a lambda expression, because
    it makes explicit the idea that composition returns a function as its result.


    Composition can be used to simplify nested function applications, by reducing
    parentheses and avoiding the need to explicitly refer to the initial argument.
    For example, using composition the definitions


    ![image](images/image80_02.jpg)


    can be rewritten more simply:


    ![image](images/image80_03.jpg)


    The last definition exploits the fact that composition is associative. That is,
    *f* ![](images/sm.jpg) (*g* ![](images/sm.jpg) *h*) = (*f* ![](images/sm.jpg)
    *g*) ![](images/sm.jpg) *h* for any functions *f*, *g*, and *h* of the appropriate
    types. Hence, in a composition of three of more functions, as in *sumsqreven*,
    there is no need to include parentheses to indicate the order of association,
    because associativity ensures that this does not affect the result.


    Composition also has an identity, given by the *identity function*:


    ![image](images/image81_00.jpg)


    That is, *id* is the function that simply returns its argument unchanged, and
    has the property that *id* ![](images/sm.jpg) *f* = *f* and *f* ![](images/sm.jpg)
    *id* = *f* for any function *f*. The identity function is often useful when reasoning
    about programs, and also provides a suitable starting point for a sequence of
    compositions. For example, the composition of a list of functions can be defined
    as follows:


