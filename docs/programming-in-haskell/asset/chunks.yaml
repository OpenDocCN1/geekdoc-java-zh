    ### 二进制数


    由于有十根手指，人们通常认为使用十进制（*decimal*）表示法的数字最为方便。十进制是 0 到 9 之间的数字序列，其中最右侧的数字权重为 1，随着数字向左移动，其权重按十倍增加。例如，十进制数
    2345 可以从这些角度这样理解：


