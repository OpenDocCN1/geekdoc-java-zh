    If desired, however, a valid version of this definition can be obtained by using
    a guard to decide if the two arguments are equal:


    ![image](images/image45_01.jpg)


    So far, we have only considered basic patterns that are either values, variables,
    or the wildcard pattern. In the remainder of this section we introduce three useful
    ways to build larger patterns by combining smaller patterns.


    Tuple patterns


    A tuple of patterns is itself a pattern, which matches any tuple of the same arity
    whose components all match the corresponding patterns in order. For example, the
    library functions *fst* and *snd* that select the first and second components
    of a pair are defined as follows:


    ![image](images/image45_02.jpg)


    List patterns


    Similarly, a list of patterns is itself a pattern, which matches any list of the
    same length whose elements all match the corresponding patterns in order. For
    example, a function *test* that decides if a list contains precisely three characters
    beginning with ’a’ can be defined as follows:


    ![image](images/image45_03.jpg)


    Up to this point we have viewed lists as a primitive notion in Haskell. In fact
    they are not primitive as such, but are actually constructed one element at a
    time starting from the empty list [ ] using an operator : called *cons* that *cons*tructs
    a new list by prepending a new element to the start of an existing list. For example,
    the list [1, 2, 3] can be decomposed as follows:


    ![image](images/image45_04.jpg)


    That is, [1, 2, 3] is just an abbreviation for 1 : (2 : (3 : [ ])). To avoid excess
    parentheses when working with such lists, the cons operator is assumed to associate
    to the right. For example, 1 : 2 : 3 : [ ] means 1 : (2 : (3 : [ ])).


    As well as being used to construct lists, the cons operator can also be used to
    construct patterns, which match any non-empty list whose first and remaining elements
    match the corresponding patterns in order. For example, we can now define a more
    general version of the function *test* that decides if a list containing any number
    of characters begins with ’a’:


    ![image](images/image46_00.jpg)


    Similarly, the library functions *null*, *head* and *tail* that decide if a list
    is empty, select the first element of a non-empty list, and remove the first element
    of a non-empty list are defined as follows:


    ![image](images/image46_01.jpg)


    Note that cons patterns must be parenthesised, because function application has
    higher priority than all other operators. For example, the definition *tail* _
    : *xs* = *xs* without parentheses means (*tail* _) : *xs* = *xs*, which is both
    the incorrect meaning and an invalid definition.


    Integer patterns


    As a special case that is sometimes useful, Haskell also allows integer patterns
    of the form *n* + *k*, where *n* is an integer variable and *k* > 0 is an integer
    constant. For example, a function *pred* that maps zero to itself and any strictly
    positive integer to its predecessor can be defined as follows:


    ![image](images/image46_02.jpg)


    There are two points to note about *n* + *k* patterns. First of all, they only
    match integers ≥ *k*. For example, evaluating *pred* (−1) produces an error, because
    neither of the two patterns in the definition for *pred* matches negative integers.
    Secondly, for the same reason as cons patterns, integer patterns must be parenthesised.
    For example, the definition *pred n* + 1 = *n* without parentheses means (*pred
    n*) + 1 = *n*, which is an invalid definition.


    ![](images/line.jpg)


    4.5 Lambda expressions


    As an alternative to defining functions using equations, functions can also be
    constructed using *lambda expressions*, which comprise a pattern for each of the
    arguments, a body that specifies how the result can be calculated in terms of
    the arguments, but do not give a name for the function itself. In other words,
    lambda expressions are nameless functions.


    For example, a nameless function that takes a single number *x* as its argument,
    and produces the result *x* + *x*, can be constructed as follows:


    ![image](images/image49_01.jpg)


    The symbol *λ* is the lower-case Greek letter “lambda”. Despite the fact that
    they have no names, functions constructed using lambda expressions can be used
    in the same way as any other functions. For example:


    ![image](images/image49_02.jpg)


    As well as being interesting in their own right, lambda expressions have a number
    of practical applications. First of all, they can be used to formalise the meaning
    of curried function definitions. For example, the definition


    ![image](images/image49_03.jpg)


    can be understood as meaning


    ![image](images/image49_04.jpg)


    which makes precise that *add* is a function that takes a number *x* and returns
    a function, which in turn takes a number *y* and returns the result *x* + *y*.


    Secondly, lambda expressions are also useful when defining functions that return
    functions as results by their very nature, rather than as a consequence of currying.
    For example, the library function *const* that returns a constant function that
    always produces a given value can be defined as follows:


    ![image](images/image47_00.jpg)


    However, it is more appealing to define *const* in a way that makes explicit that
    it returns a function as its result, by including parentheses in the type and
    using a lambda expression in the definition itself:


    ![image](images/image47_01.jpg)


    Finally, lambda expressions can be used to avoid having to name a function that
