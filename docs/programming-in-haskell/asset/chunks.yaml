    `otherwise` 并不是必要的，但它为处理“所有其他情况”提供了方便的方法，并清晰地避免了没有任何守卫为 `True` 的可能，这会导致错误。


    守卫方程相比条件表达式的主要优势是具有多个守卫的定义更易读。例如，`signum` 库函数定义如下时更容易理解：


