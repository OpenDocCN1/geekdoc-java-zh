    ## 3.2 基础类型


    Haskell 提供了若干内置于语言中的基础类型，其中最常用的类型描述如下所示。


    * `Bool` – **逻辑值**

    该类型包含两个逻辑值 `False` 和 `True`。


    * `Char` – **单字符**

    该类型包含普通键盘上可用的所有单字符，如 ’a’、’A’、’3’ 和 ’_’，以及若干具有特殊效果的控制字符，如 ’\n’（换行）和 ’\t’（移动到下一个制表位）。与大多数编程语言的标准一样，单字符必须包含在单引号
    ’ '''' 之间。


    * `String` – **字符字符串**

    该类型包含所有字符序列，例如 "abc"、"1+2=3" 和空字符串 ""。同样，按照大多数编程语言的标准，字符字符串必须包含在双引号 " " 之间。


    * `Int` – **固定精度整数**

    该类型包含如 −100、0 和 999 等整数，并使用固定量的计算机内存进行存储。例如，Hugs 系统中的 `Int` 类型取值范围在 −2³¹ 到 2³¹
    − 1 之间。超出此范围可能会导致意料之外的结果。例如，使用 Hugs 求值 `2 ↑ 31 :: Int`（使用 `::` 强制结果类型为 `Int` 而非其他数值类型）会得到负数作为结果，这是错误的。


    * `Integer` – **任意精度整数**

    该类型包含所有整数，根据需要使用大量的内存进行存储，从而避免了对数值范围设置上下限。例如，使用任何 Haskell 系统求值 `2 ↑ 31 :: Integer`
    将产生正确的结果。


    除了 `Int` 和 `Integer` 类型在内存需求和精度上的差异外，这两种类型之间的选择还涉及性能问题。特别是，大多数计算机都有处理固定精度整数的内置硬件，而任意精度整数通常必须使用较慢的软件媒介（数字序列）进行处理。


    * `Float` – **单精度浮点数**

    该类型包含带有小数点的数字，如 −12.34、1.0 和 3.14159，使用固定量的内存进行存储。*浮点*一词源于小数点后允许的数字个数取决于数字的大小。例如，使用
    Hugs 求值 `sqrt 2 :: Float` 得到结果 1.41421（库函数 `sqrt` 计算数字的平方根），其小数点后有五位，而 `sqrt 99999
    :: Float` 得到 316.226，其小数点后只有三位。使用浮点数进行编程是一项专家级课题，需要仔细处理舍入误差，我们在本介绍性文本中不再讨论此类数字。


    我们在本节最后提到，一个数字可能有多个数值类型。例如，`3 :: Int`、`3 :: Integer` 和 `3 :: Float` 都是数字 3 的有效类型。这引发了一个有趣的问题：在类型推导过程中应该给这些数字分配什么类型，这将在本书后面考虑类型类时给出答案。


