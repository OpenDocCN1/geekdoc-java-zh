    ## 9.6 Calculator


    At the end of the previous chapter we developed a parser for arithmetic expressions.
    We now extend this example to produce a simple calculator, which allows the user
    to enter arithmetic expressions interactively using the keyboard, and displays
    the value of such expressions on the screen.


    Our calculator will handle expressions built up from integers using addition,
    subtraction, multiplication, division, and parentheses. As the subject of this
    chapter is interactive programs, we do not concern ourselves with the details
    of parsing and evaluating expressions, assuming that we are given a suitable parser
    `expr :: Parser Int` for this purpose. Such a parser can be obtained by solving
    some of the exercises from the previous chapter.


    We begin by considering the user interface of the calculator. First of all, we
    define the box of the calculator as a list of strings:


    ![image](images/image104_00.jpg)


    The first four buttons on the calculator, `q, c, d, and `=`, allow the user to
    quit, clear the display, delete a character, and evaluate an expression, while
    the remaining sixteen buttons allow the user to enter expressions.


    We also define the buttons on the calculator as a list of characters, comprising
    both the twenty standard buttons that appear on the box itself, together with
    a number of extra characters that will be allowed for flexibility, namely `Q,
    C, D, space, escape, backspace, delete, and newline`:


    ![image](images/image104_01.jpg)


    Using a list comprehension, we can define an action that displays the calculator
    box in the top-left corner of the screen:


    ![image](images/image104_02.jpg)


    The last part of the user interface is to define a function that shows a string
    in the display of the calculator, by first clearing the display and then showing
    the last thirteen characters of the string. In this manner, if the user deletes
    characters from the string, they will automatically be removed from the display,
    and if the user types more than thirteen characters, the display will appear to
    scroll to the left.


    ![image](images/image105_00.jpg)


    The calculator itself is controlled by a function `calc` that displays the current
    string, and then reads a character from the keyboard without echoing it. If this
    character is a valid button, then it is processed, otherwise we sound a beep to
    indicate an error and continue with the same string:


    ![image](images/image105_01.jpg)


    The function `process` takes a valid character and the current string, and performs
    the appropriate action depending upon the character:


    ![image](images/image105_02.jpg)


    We now consider each of the five possible actions in turn.


    - Quitting moves the cursor below the calculator box and terminates:

    ![image](images/image105_03.jpg)

    - Deleting has no effect if the current string is empty, and otherwise removes
    the last character from this string:

    ![image](images/image105_04.jpg)

    - Evaluation displays the result of parsing and evaluating the current string,
    sounding a beep if this process is unsuccessful:

    ![image](images/image105_05.jpg)

    - Clearing the display resets the current string to empty:

    ![image](images/image106_00.jpg)

    - Any other character is appended to the end of the current string:

    ![image](images/image106_01.jpg)


    Finally, we define a function that runs the calculator, by clearing the screen,
    displaying the box, and starting with an empty display:


    ![image](images/image106_02.jpg)


