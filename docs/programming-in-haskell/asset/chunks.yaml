    In these examples we have followed the Haskell convention of preceding function
    definitions by their types, which serves as useful documentation. Any such types
    provided manually by the user are checked for consistency with the types calculated
    automatically using type inference.


    Note that there is no restriction that functions must be *total* on their argument
