    ![image](images/image153_02.jpg)


    Hence any expression of the form `reverse [x]` in a program can freely be replaced
    by `[x]` without change in meaning, but with a change in efficiency by avoiding
    the need to apply the `reverse` function.


    Equational reasoning is often combined with some form of case analysis. For example,
    consider the logical negation function:


