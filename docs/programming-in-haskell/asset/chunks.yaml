    ## 8.6 派生原语


    使用三个基础解析器结合排序和选择，我们现在可以定义许多其他实用的原语。首先，我们定义了一个满足谓词 `p` 的单个字符解析器 `sat p`：


    ![image](img/image90_01.jpg)


    使用 `sat` 和标准库中适当的谓词，我们可以定义用于单个数字、小写字母、大写字母、任意字母、字母数字以及特定字符的解析器：


    ![image](img/image91_00.jpg)


    例如：


    ![image](img/image93_03.jpg)


    反之，使用 `char` 我们可以定义一个用于字符串 `xs` 的解析器 `string xs`，并将字符串本身作为结果值返回：


    ![image](img/image91_01.jpg)

