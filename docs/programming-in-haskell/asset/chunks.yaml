    using *guarded equations*, in which a sequence of logical expressions called *guards*
    is used to choose between a sequence of results. If the first guard is `True`,
    then the first result is chosen; otherwise, if the second is `True`, then the
    second result is chosen, and so on. For example, the library function `abs` can
