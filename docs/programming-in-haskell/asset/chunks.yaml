    我们通过第二个扩展示例来结束本章，该示例涉及`生命游戏`（game of life）。这个游戏模拟了一个简单的进化系统，并在二维棋盘上进行。棋盘上的每个方格要么是空的，要么包含一个活细胞，如下所示：


    ![image](img/image106_03.jpg)


    棋盘上的每个内部方格都有八个相邻邻居：


    ![image](img/image106_04.jpg)


    为了统一，棋盘边缘的每个方格也被视为具有八个邻居，假设棋盘是从上到下、从左到右环绕的。也就是说，我们可以将棋盘看作是一个环面，它可以被看作是一个三维甜甜圈形状对象的表面。


    给定棋盘的初始配置，通过对所有方格同时应用以下规则来得到下一代`generation`（代）：


    • 如果一个活细胞恰好有两个或三个相邻方格包含活细胞，则它存活；否则死亡（变为空格）；


    • 如果一个空方格恰好有三个邻居包含活细胞，则它产生一个活细胞；否则保持为空。


    例如，将上述规则应用于上方棋盘可以得到：


    ![image](img/image107_01.jpg)


    通过对新棋盘重复此过程，可以产生无限的代序列。通过对初始配置的仔细设计，可以在序列中观察到许多有趣的行为模式。例如，上述细胞排列被称为`glider`（滑翔者），它会在连续的代中沿棋盘对角线移动。


    尽管生命游戏非常简单，但它在计算上实际上是完备的，这意味着任何计算过程都可以通过适当编码在其中进行模拟。在本节的剩余部分中，我们将展示如何在 Haskell
    中实现生命游戏。


    为了能够方便地修改棋盘的大小，我们定义两个整数值来确定棋盘在方格数上的宽度和高度：


