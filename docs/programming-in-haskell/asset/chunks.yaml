    Note, however, that many built-in functions require their arguments to be evaluated
    before being applied, even when using outermost evaluation. For example, as illustrated
    in the calculation above, built-in arithmetic operators such as `*` and `+` cannot
    be applied until their two arguments have been evaluated to numbers. Functions
    with this property are called strict, and will be discussed in further detail
    at the end of this chapter.


    ## Lambda expressions


    Let us now define a curried version of `mult` that takes its arguments one at
    a time, using a lambda expression to make the use of currying explicit:


    ![image](images/image139_01.jpg)


    Then using innermost evaluation, for example, we have:


    ![image](images/image139_02.jpg)


    That is, the two arguments are now substituted into the body of the function `mult`
    one at a time, as we would expect using currying, rather than at the same time
    as in the previous section. This behaviour arises because `mult 3` is the leftmost
    innermost redex in the expression `mult 3 (2 + 3)`, as opposed to `2 + 3` in the
    expression `mult (3, 2 + 3)`. Performing a reduction on `mult 3` in the second
    step of the calculation above gives the lambda expression `(λy → 3 * y)`, which
    awaits the result of evaluating the second argument.


    Note that in Haskell, the selection of redexes within lambda expressions is prohibited.
    The rational for not “reducing under lambdas” is that functions are viewed as
    black boxes that we are not permitted to look inside. More formally, the only
    operation that can be performed on a function is that of applying it to an argument.
    As such, reduction within the body of a function is only permitted once the function
    has been applied. For example, the lambda expression `λx → 1 + 2` is deemed to
    be fully evaluated, even though its body contains the redex `1 + 2`, but once
    this function has been applied to an argument, evaluation of this redex can then
    proceed:


    ![image](images/image140_00.jpg)


    Using innermost and outermost evaluation, but not under lambdas, is normally referred
    to as *call-by-value* and *call-by-name* evaluation, respectively. In the next
    two sections we explore how these two evaluation strategies compare in terms of
    two important properties, namely their termination behaviour and the number of
    reduction steps that they require.


    ![](images/line.jpg)


    ## 12.3 Termination


    Consider the following recursive definition:


    ![image](images/image140_01.jpg)


    That is, the integer `inf` (abbreviating “infinity”) is defined as the successor
    of itself. Evaluating `inf` produces a larger and larger expression, regardless
    of the evaluation strategy, and hence does not terminate:


    ![image](images/image140_02.jpg)


    In practice, evaluating `inf` using Hugs will quickly exhaust the available memory
    and produce an error message. Now consider the expression `fst (0, inf)`, where
    `fst` is the library function that selects the first component of a pair, defined
    by `fst (x, y) = x`. Using call-by-value evaluation with this expression also
    results in non-termination in a similar manner:


    ![image](images/image140_03.jpg)


    In contrast, using call-by-name evaluation results in termination in just one
    step, by immediately applying the definition of `fst` and hence avoiding the evaluation
    of the non-terminating expression `inf` :


    ![image](images/image141_01.jpg)


    This simple example shows that call-by-name evaluation may produce a result when
    call-by-value evaluation fails to terminate. More generally, we have the following
    important property: if there exists any evaluation sequence that terminates for
    a given expression, then call-by-name evaluation will also terminate for this
    expression, and produce the same final result.


    In summary, call-by-name evaluation is preferable to call-by-value for the purpose
    of ensuring that evaluation terminates as often as possible.


    ![](images/line.jpg)


    ## 12.4 Number of reductions


    Now consider the following definition:


    ![image](images/image141_02.jpg)


    For example, using call-by-value evaluation, we have:


    ![image](images/image141_03.jpg)


    In contrast, using call-by-name evaluation with the same expression requires one
    extra reduction step, due to the fact that `1 + 2` is duplicated when the function
    `square` is applied, and hence must be evaluated twice:


    ![image](images/image141_04.jpg)


    This example shows that call-by-name evaluation may require more steps than call-by-value
    evaluation, in particular when an argument is used more than once in the body
    of a function. More generally, we have the following property: arguments are evaluated
    precisely once using call-by-value evaluation, but may be evaluated many times
    using call-by-name.


    Fortunately, the above efficiency problem with call-by-name evaluation can be
    easily solved, by using pointers to indicate sharing of expressions during evaluation.
    Rather than physically copying an argument if it is used many times in the body
    of a function, we simply keep one copy of the argument and make many pointers
    to it. In this manner, any reductions that are performed on the argument are automatically
    shared between each of the pointers to that argument. For example, using this
    strategy we have:


    ![image](images/image142_01.jpg)


    That is, when applying the definition `square n = n * n` in the first step, we
    keep a single copy of the argument `1 + 2`, and make two pointers to it. In this
    manner, when the expression `1 + 2` is reduced in the second step, both pointers
    share the result.


    The use of call-by-name evaluation in conjunction with sharing is called *lazy
    evaluation*. This is the evaluation strategy that is used in Haskell, as a result
    of which Haskell is called a lazy language. Being based upon call-by-name evaluation,
    lazy evaluation has the property that it ensures that evaluation terminates as
    often as possible. Moreover, using sharing ensures that lazy evaluation never
    requires more steps than call-by-value. The use of the term “lazy” will be explained
    shortly.


    ![](images/line.jpg)


    ## 12.5 Infinite structures


    An additional property of call-by-name evaluation, and hence lazy evaluation,
    is that it allows what at first sight may seem impossible: programming with infinite
    structures. We have already seen a simple example of this earlier in this chapter,
    in the form of the evaluation of `fst (0, inf)` avoiding the production of infinite
    structure `1 + (1 + (1 + · ·))` defined by `inf`.


    More interesting forms of behaviour occur when we consider infinite lists. For
    example, consider the following recursive definition:


    ![image](images/image143_00.jpg)


    That is, the list `ones` is defined as a single one followed by itself. As with
    `inf`, evaluating `ones` does not terminate, regardless of the strategy used:


    ![image](images/image143_01.jpg)


    In practice, evaluating `ones` using Hugs will produce a never-ending list of
    ones, until the user eventually decides to terminate this process:


    ![image](images/image145_02.jpg)


    Now consider the expression `head ones`, which attempts to select the first element
    of this infinite list of ones. Using call-by-value evaluation with this expression
    also results in non-termination:


    ![image](images/image143_02.jpg)


    In contrast, using lazy evaluation (or call-by-name evaluation, as sharing is
    not required in this example) results in termination in two steps:


    ![image](images/image143_03.jpg)


    This behaviour arises because lazy evaluation proceeds in a lazy manner as its
    name suggests, only evaluating arguments as and when strictly necessary to produce
    results. For example, when selecting the first element of a list, the remainder
    of the list is not required, and hence in `head (1 : ones)` the further evaluation
    of the infinite list `ones` is avoided. More generally, we have the following
    property: using lazy evaluation, expressions are only evaluated as much as required
    by the context in which they are used.

