    definition using pattern matching requires just one case:


    ![image](images/image72_01.jpg)


    ## Step 3: define the simple cases


    Whereas in the previous two examples this step was straightforward, a little more
    thought is required for the function `init`. By definition, however, removing
    the last element from a list with one element gives the empty list, so we can
    introduce a guard to handle this simple case:


    ![image](images/image70_02.jpg)


    Recall that the library function `null` decides if a list is empty or not.


    ## Step 4: define the other cases


    How can we remove the last element from a list with at least two elements? By
    simply retaining the head and removing the last element from the tail:


    ![image](images/image71_00.jpg)


    ## Step 5: generalise and simplify


    The type for `init` is already as general as possible, but the definition itself
    can now be simplified by using pattern matching rather than guards, and by using
    a wildcard pattern in the first equation rather than a variable:


    ![image](images/image71_01.jpg)


