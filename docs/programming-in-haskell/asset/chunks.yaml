    与解析器一样，组合两个操作的自然方式是顺序执行它们，其中第一个操作返回的修改后的世界成为第二个操作的当前世界，通过序列化运算符 `>>=`（读作“then”）实现，其定义如下：


    ![image](img/image101_03.jpg)


    也就是说，我们将操作 `f` 应用于当前世界，然后将函数 `g` 应用于结果值以得到第二个操作，然后将该操作应用于修改后的世界以得到最终结果。在实践中，与上一章的解析器一样，通常使用
    `do` 记法以更具吸引力的形式表达使用 `>>=` 定义的操作。


