    Now let us consider computing the sum of the numbers between one and *n* using
    Haskell. This would normally be achieved using two library functions, one called
    [*. .*] used to produce the list of numbers between one and *n*, and the other
    called *sum* used to produce the sum of this list:


    ![image](images/image17_00.jpg)


    In this program, the basic method of computation is applying functions to arguments,
    in the sense that executing the program results in a sequence of applications.
    For example, the case of *n* = 5 gives the following sequence, in which the final
    result is the required sum:


    ![image](images/image15_02.jpg)


    Most imperative languages support some form of programming with functions, so
    the Haskell program *sum* [1 *. .* *n*] could be translated into such languages.
    However, most imperative languages do not *encourage* programming in the functional
    style. For example, many languages discourage or prohibit functions from being
    stored in data structures such as lists, from constructing intermediate structures
    such as the list of numbers in the above example, from taking functions as arguments
    or producing functions as results, or from being defined in terms of themselves.
    In contrast, Haskell imposes no such restrictions on how functions can be used,
    and provides a range of features to make programming with functions both simple
    and powerful.


    ![](images/line.jpg)


    1.3 Features of Haskell


    For reference, the main features of Haskell are listed below, along with the particular
    chapters of this book that give further details.


    •  **Concise programs** ([chapters 2](#09_chapter_title_2.html) and [4](#11_chapter_title_4.html))


    Due to the high-level nature of the functional style, programs written in Haskell
    are often much more *concise* than in other languages, as illustrated by the example
    in the previous section. Moreover, the syntax of Haskell has been designed with
    concise programs in mind, in particular by having few keywords, and by allowing
    indentation to be used to indicate the structure of programs. Although it is difficult
    to make an objective comparison, Haskell programs are often between two and ten
    times shorter than programs written in other current languages.


    •  **Powerful type system** ([chapters 3](#10_chapter_title_3.html) and [10](#17_chapter_title_10.html))


    Most modern programming languages include some form of *type system* to detect
    incompatibility errors, such as attempting to add a number and a character. Haskell
    has a type system that requires little type information from the programmer, but
    allows a large class of incompatibility errors in programs to be automatically
    detected prior to their execution, using a sophisticated process called type inference.
    The Haskell type system is also more powerful than most current languages, by
    allowing functions to be “polymorphic” and “overloaded”.


    •  **List comprehensions** ([chapter 5](#12_chapter_title_5.html))


    One of the most common ways to structure and manipulate data in computing is using
    lists. To this end, Haskell provides lists as a basic concept in the language,
    together with a simple but powerful *comprehension* notation that constructs new
    lists by selecting and filtering elements from one or more existing lists. Using
    the comprehension notation allows many common functions on lists to be defined
    in a clear and concise manner, without the need for explicit recursion.


    •  **Recursive functions** ([chapter 6](#13_chapter_title_6.html))


    Most non-trivial programs involve some form of repetition or looping. In Haskell,
    the basic mechanism by which looping is achieved is by using *recursive* functions
    that are defined in terms of themselves. Many computations have a simple and natural
    definition in terms of recursive functions, particularly when “pattern matching”
    and “guards” are used to separate different cases into different equations.


    •  **Higher-order functions** ([chapter 7](#14_chapter_title_7.html))'
