    \ evaluation），它始终选择一个最内层的 redex，即它不包含其他 redex。如果存在多个内层 redex，根据惯例选择从左侧开始的那个。\n\
    \n例如，`1 + 2` 和 `2 + 3` 都不包含其他 redex，因此在表达式 `mult (1 + 2, 2 + 3)` 中都是内层的，其中 `1\
    \ + 2` 从左侧开始。更通用地说，我们的示例表达式使用内层求求值如下：\n\n![image](img/image138_01.jpg)\n\n内层求还可以根据参数如何传递给函数来描述。特别是，使用这种策略确保函数的参数在应用本身之前总是被求值。也就是说，参数按值传递（by\
    \ value）。例如，如所示，使用内层求处理 `mult (1 + 2, 2 + 3)` 是先求参数表达式 `1 + 2` 和 `2 + 3`，然后应用函数\
    \ `mult`。始终选择最左侧内层 redex 的事实确保了第一个参数在第二个参数之前求值。\n\n另一种常见的表达式求策略（与内层求对立）是始终选择一个最外层的\
    \ redex（outermost），即不包含在任何其他 redex 中。如果存在多个此类 redex，我们之前之前选择从左侧开始的那个。并不意外，这种求策略被称为外层求（outermost\
    \ evaluation）。\n\n例如，表达式 `mult (1 + 2, 2 + 3)` 不在任何其他 redex 中，因此在其内部是最外层的。更通用地说，使用外层求处理该表达式如下：\n\
    \n![image](img/image138_02.jpg)\n\n从参数如何传递给函数来看，使用外层求允许在求值参数之前应用函数。出于此原因，我们说参数按名传递（by\
    \ name）。例如，如所示，使用外层求处理 `mult (1 + 2, 2 + 3)` 是先将函数 `mult` 应用于两个未求值的参数 `1 + 2`\
    \ 和 `2 + 3`，然后轮流求值这两个表达式。\n"
