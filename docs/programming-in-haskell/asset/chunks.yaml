    *类型*是相关值的集合。例如，`Bool` 类型包含 `False` 和 `True` 两个值，而 `Bool -> Bool` 类型包含所有从 `Bool`
    映射到 `Bool` 的函数，例如逻辑取反函数 `¬`。我们使用符号 `υ :: T` 表示 `υ` 是类型 `T` 中的值，并说 `υ` “类型” `T`。例如：


    ![image](img/table29_00.jpg)


    更通用地说，:: 也可以用于尚未求值的表达式，在这种情况下 `e :: T` 意味着表达式 `e` 的求值将产生一个类型为 `T` 的值。例如：


    ![image](img/table29_01.jpg)


    在 Haskell 中，每个表达式都必须有一个类型，该类型在求值之前通过称为*类型推导*的过程进行计算。该过程的关键是函数应用类型规则，如果 `f` 是一个从类型
    A 映射到类型 B 的函数，且 `e` 是类型 A 的表达式，则应用 `f e` 的类型为 `B`：


    ![image](img/image30_00.jpg)


    例如，利用 `¬ :: Bool -> Bool` 和 `False :: Bool` 的事实，可以从该规则推导出 `¬ False :: Bool`。相反，表达式
    `¬ 3` 在上述应用规则下没有类型，因为这要求 `3 :: Bool`，而这是无效的，因为 `3` 不是逻辑值。像 `¬ 3` 这样没有类型的表达式被认为包含类型错误，并被视为无效表达式。


    由于类型推导发生在求值之前，Haskell 程序是*类型安全*的，这意味着在求值过程中永远发生类型错误。在实践中，类型推导可以检测到一大类程序错误，是 Haskell
    最有用的特性之一。但注意，使用类型推导并不能消除求值过程中发生其他种类错误的可能性。例如，表达式 `1 div 0` 没有类型错误，但在求值时会产生错误，因为除以零未定义。

