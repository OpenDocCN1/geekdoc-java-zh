    The dual action, `putChar c`, writes the character `c` to the screen, and returns
    no result value, represented by the empty tuple:


    ![image](images/image101_01.jpg)


    Our final basic action is `return v`, which simply returns the result value `v`
    without performing any interaction:


    ![image](images/image101_02.jpg)


    The function `return` provides a bridge from the setting of pure expressions without
    side effects to that of impure actions with side effects. Crucially, however,
    there is no bridge back — once we are impure we are impure for ever, with no possibility
    for redemption! As a result, we may suspect that impurity quickly permeates entire
    programs, but in practice this is usually not the case. For most Haskell programs,
    the vast majority of functions do not involve interaction, with this being handled
    by a relatively small number of interactive functions at the outermost level.


    We conclude this section by noting that evaluating an action using Hugs performs
    its side effects, and discards the resulting value. For example, evaluating `putChar
    ’a’` writes the character ’a’ to the screen, discards the result value from this
    action, and then terminates:


    ![image](images/image103_04.jpg)


    ![](images/line.jpg)


    ## 9.4 Sequencing


    As with parsers, the natural way of combining two actions is to perform one after
    the other in sequence, with the modified world returned by the first action becoming
    the current world for the second, by means of a sequencing operator `>>=` (read
    as “then”) defined as follows:


    ![image](images/image101_03.jpg)


    That is, we apply the action `f` to the current world, then apply the function
    `g` to the result value to give a second action, which is then applied to the
    modified world to give the final result. In practice, however, as with parsers
    in the previous chapter, the `do` notation is normally used to express actions
    defined using `>>=` in a more appealing form.


    For example, using the `do` notation the primitive `getChar` could be decomposed
    into the actions of reading a character from the keyboard, echoing it to the screen,
    and returning the character as the result:


    ![image](images/image102_00.jpg)


    The action `getCh` that reads a character without echoing is not part of the standard
    prelude, but is provided as an extension by Hugs and can be made available in
    any script by including the following special line:


    ![image](images/image104_03.jpg)


    ![](images/line.jpg)


