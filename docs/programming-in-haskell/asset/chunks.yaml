    ## 4.2 条件表达式


    Haskell 提供了多种定义函数的方法。最简单的是*条件表达式*，它使用一个称为*条件*的逻辑表达式在结果之间进行选择。如果条件为 `True`，则选择第一个结果，如果为
    `False`，则选择第二个结果。例如，返回整数绝对值的库函数 `abs` 可以定义如下：


    ```

    ![image](img/image43_00.jpg)

    ```


    条件表达式可以是嵌套的，这意味着它们包含其他表达式。例如，返回整数符号的库函数 `signum` 可以定义如下：


    ```

    ![image](img/image43_01.jpg)

    ```


    注意，与某些语言不同，条件表达式必须有一个 **else** 分支，这避免了著名的“悬空 else”问题。例如，如果 **else** 分支是可选的，那么
    `if True then if False then 1 else 2` 可能会返回结果 2 也可能产生错误，取决于单个 **else** 分支被认为是内部还是外部条件表达式的一部分。


    ## 4.3 守卫方程


    作为条件表达式的替代方案，函数也可以使用*守卫方程*定义，其中使用一组称为*守卫*的逻辑表达式在结果序列之间进行选择。如果第一个守卫为 `True`，则选择第一个结果；否则，如果第二个真……以此类推。例如，库函数
