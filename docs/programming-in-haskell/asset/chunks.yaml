    也就是说，如果一个表达式中的值列表是从给定的数字列表中选择的，并且该表达式成功求值为目标值，那么该表达式就是给定数字列表和目标的一个解。例如，如果 `e`
    :: `Expr` 代表表达式 (1 + 50) * (25 − 10)，那么我们有：


    ![image](img/image133_04.jpg)


    通过使用函数 `isChoice` 可以提高 `solution` 的效率，该函数可以直接判断一个列表是否是从另一个列表中选择的，而不是使用返回从列表中所有可能选择的
    `choices` 函数来间接地进行判断。然而，在现阶段，效率并不重要，而且 `choices` 本身也被用于定义本章中的许多其他函数。


    ![](img/line.jpg)


    ### 11.3 暴力破解法


    我们解决倒计时问题（countdown problem）的第一种方法是暴力破解，使用对给定数字列表生成所有可能的表达式的想法。我们首先定义一个函数 `split`，它返回将列表分为两个非空列表的所有可能方式，这两个列表拼接后恰得到原始列表：


    ![image](img/image131_02.jpg)


    例如：


    ![image](img/image133_05.jpg)


    使用 `split`，我们就可以定义关键函数 `exprs`，它返回所有值列表恰好为给定列表的所有可能表达式：


    ![image](img/image132_00.jpg)


    也就是说，对于空数字列表，没有可能的表达式；而对于单个数字，则有一个由该数字组成的单个表达式。否则，对于两个或多个数字的列表，我们首先产生该列表的所有拆分，然后递归地计算这些每个列表的所有可能表达式，最后使用四种数值运算符中的每一种来对每对表达式进行组合，并使用如下文所示的辅助函数：


    ![image](img/image132_01.jpg)


    最后，我们现在定义一个函数 `solutions`，它返回所有解决倒计时问题实例的可能表达式，其方法是首先对给定数字列表的每种选择生成所有表达式，然后选择那些成功求值得到目标值的表达式：


    ![image](img/image132_02.jpg)


    为了在这一章中测试我们的程序，Hugs 的性能有些有限，因此我们改用格拉斯哥 Haskell 编译器（GHC）。例如，在频率为 1.2GHz 的 Pentium
    M 笔记本电脑上使用 GHC 6.4.1 版本，`solutions [1, 3, 7, 10, 25, 50] 765` 在 0.36 秒内返回第一个解，并在
    43.98 秒内返回所有 780 个解；而如果目标改为 831，则会在 44.42 秒内返回空列表。


    ![](img/line.jpg)


    ### 11.4 结合生成与求值


    函数 `solutions` 生成了给定数字的所有可能表达式，但在实践中，许多这些表达式将无法求值，因为减法和除法对于正整数并不总是有效的。例如，可以证明对于数字
    1, 3, 7, 10, 25, 50 共有 33,665, 406 种可能的表达式，但其中只有 4,672, 540 个表达式成功求值，这仅低于 14%。


    基于这一观察，我们解决倒计时问题的第二种方法是通过结合表达式的生成与其求值来改进我们的暴力破解程序，使得两项任务同时执行。这样一来，无法求值的表达式会在更早的阶段被拒绝，更重要的是，它们不会被用于生成后续的此类表达式。我们首先声明一个类型
    `Result`，它表示成功求值的表达式及其总值的配对：


    ![image](img/image135_00.jpg)


    使用该类型，我们接着定义一个函数 `results`，它返回所有由值列表恰好为给定列表的表达式组成的可能结果：


    ![image](img/image133_00.jpg)


    也就是说，对于空列表，没有可能的结果；而对于单个数字，只要该数字本身是正整数，就有一个由该数字构成的单个结果。否则，对于两个或多个数字，我们首先产生该列表的所有拆分，然后递归地计算这些每个列表的所有可能结果，最后使用有效的四种数值运算符中的每一种来对每对结果进行组合：


    ![image](img/image133_01.jpg)


    使用 `results`，我们现在可以定义一个新函数 `solutions''`，它返回所有解决倒计时问题实例的可能表达式，其方法是首先对给定数字的每种选择生成所有结果，然后选择那些值为目标值的表达式：


    ![image](img/image133_02.jpg)


    在性能方面，`solutions'' [1, 3, 7, 10, 25, 50] 765` 在 0.04 秒内返回第一个解（比 `solutions` 快
    9 倍），并在 3.47 秒内返回所有解（快 12 倍），而如果目标改为 831，则会在 3.28 秒内返回空列表（快 13 倍）。


    ![](img/line.jpg)


    ### 11.5 利用代数性质


    函数 `solutions''` 生成了给定数字上所有求值成功的可能表达式，但在实践中，许多这些表达式在本质上是相同的，因为数值运算符具有代数性质。例如，表达式
    2 + 3 和 3 + 2 本质上是相同的，因为加法结果取决于参数顺序；而 2 ÷ 1 和 2 本质上也是相同的，因为任何数字除以 1 对该数字没有影响。


    基于这一观察，我们解决倒计时问题的最后一种方法是通过利用此类性质来改进第二个程序，以减少表达式的数量。特别是，我们利用了以下交换律单位律：


    ![image](img/image134_00.jpg)


    我们首先回顾函数 `valid`，它判断两个正整数应用运算符是否得到了另一个整数：


    ![image](img/image134_01.jpg)


    该定义可以修改为利用加法和乘法的交换律，只需要求参数顺序（x <= y），以及乘法和除法的单位律，只需要求相应的参数非单位元（!= 1）：


    ![image](img/image134_02.jpg)


    例如，使用这种新定义，`Add 3 2` 现在是无效的，因为它在加法交换律下与 `Add 2 3` 相同；而 `Div 2 1` 现在是无效的，因为它在本质上与数字
    2 相同。


    使用新版本的 `valid` 得到了 `solutions''` 函数的新版本，我们将其写为 `solutions''''`。使用这个新函数可以显著减少表达式的数量和解的数量。例如，`solutions''''
    [1, 3, 7, 10, 25, 50] 765` 仅生成了 245,644 个表达式，其中仅有 49 个是解，这分别略高于 `solutions''`
    使用数字的 5% 和 6%。


    至于性能，`solutions'''' [1, 3, 7, 10, 25, 50] 765` 现在在 0.02 秒内返回第一个解（比 `solutions''`
    快一倍），并在 0.44 秒内返回所有解（快 7 倍），而对于目标数字 831，空列表也会在 0.44 秒内返回。更通地说，对于来自电视版倒计时问题的任何数字，我们的最终程序
    `solutions''''` 通常在一秒钟内返回所有解。


    ![](img/line.jpg)


