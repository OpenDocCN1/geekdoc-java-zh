    Haskell provides a range of different ways to define functions. The simplest are
    *conditional expressions*, which use a logical expression called a *condition*
    to choose between results. If the condition is `True`, then the first result is
    chosen, and if it is `False`, then the second result is chosen. For example, the
    library function `abs` that returns the absolute value of an integer can be defined
    as follows:


    ```

    ![image](images/image43_00.jpg)

    ```


    Conditional expressions may be nested, in the sense that they can contain other
    expressions. For example, the library function `signum` that returns the sign
    of an integer can be defined as follows:


    ```

    ![image](images/image43_01.jpg)

    ```


    Note that unlike in some languages, conditional expressions must always have an
    **else** branch, which avoids the well-known “dangling else” problem. For example,
    if **else** branches were optional, then `if True then if False then 1 else 2`
    could either return the result 2 or produce an error, depending upon whether the
    single **else** branch was assumed to be part of the inner or outer conditional
    expression.


    ## 4.3 Guarded equations


