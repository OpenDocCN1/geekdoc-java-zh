    ## 12.7 Strict application


    Haskell uses lazy evaluation by default, but also provides a special `strict`
    version of function application, written as `$!`, which can sometimes be useful.
    Informally, an expression of the form `f $! x` behaves in the same way as the
    normal application `f x`, except that the top-level of evaluation of the argument
    expression `x` is forced before the function `f` is applied.


    For example, if the argument has a basic type, such as `Int` or `Bool`, then top-level
    evaluation is simply complete evaluation. On the other hand, for a pair type such
    as `(Int, Bool)`, evaluation is performed until a pair of expressions is obtained,
    but no further. Similarly, for a list type, evaluation is performed until the
    empty list or the cons of two expressions is obtained.


    More formally, an expression of the form `f $! x` is only a redex once evaluation
    of the argument `x`, using lazy evaluation as normal, has reached the point where
    the result is not undefined value, at which point the expression can be reduced
    to the normal application `f x`. For example, using the definition `square n =
    n`, evaluation of `square $! (1 + 2)` proceeds in a call-by-value manner, by first
    evaluating the argument `1 + 2` to give the value 3, and then applying the function
    `square`:


    ```

    ![image](images/image147_00.jpg)

    ```


    When used with a curried function with multiple arguments, strict application
    can be used to force top-level evaluation of any combination of arguments. For
    example, if `f` is a curried function with two arguments, an application of the
    form `f x y` can be modified to have three different behaviours:


    ```

    ![image](images/image147_01.jpg)

    ```


    In Haskell, strict application is mainly used to improve the space performance
    of programs. For example, consider a function `sumwith` that calculates the sum
    of a list using an accumulator value:


    ```

    ![image](images/image147_02.jpg)

    ```


    Then using lazy evaluation, we have:


    ```

    ![image](images/image147_03.jpg)

    ```


    Note that the entire summation `((0 + 1) + 2) + 3` is constructed before any additions
    are performed. More generally, `sumwith` will construct a summation whose size
    is proportional to the number of integers in the original list. For example, evaluating
    `sumwith 0 [1 .. 10000]` using Hugs will quickly exhaust the available memory
    and produce an error message. In practice, it would be preferable to perform each
    addition as soon as it is introduced, in order to avoid running out of memory
    in this way.


    This behaviour can be achieved by redefining `sumwith` using strict application,
    to force evaluation of its accumulator value:


    ```

    ![image](images/image148_00.jpg)

    ```


    For example, we now have:


    ```

    ![image](images/image148_01.jpg)

    ```


    This evaluation requires more steps than previously, due to the additional overhead
    of using strict application, but now performs each addition as soon as it is introduced,
    rather than constructing a large summation. For example, evaluating `sumwith 0
    [1 .. 10000]` using Hugs now gives the correct result, as opposed to producing
    an error as previously.


    Generalising from the above example, one may wish to define a strict version of
    the higher-order library function `foldl` that forces evaluation of its accumulator
    prior to processing the tail of the list:


