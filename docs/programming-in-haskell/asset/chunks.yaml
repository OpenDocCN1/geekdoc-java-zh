    ## 12.6 Modular programming


    Lazy evaluation also allows us to separate control from data in our computations.
    For example, a list of three ones can be produced by selecting the first three
    elements (control) of the infinite list of ones (data):


    ![image](images/image146_01.jpg)


    Using the definition of `take` from the standard prelude


    ![image](images/image144_00.jpg)


    this behaviour arises using lazy evaluation as follows:


    ![image](images/image144_01.jpg)


    That is, the data is only evaluated as much as required by the control, and these
    two parts take it in turn to perform reductions. Without lazy evaluation, the
    control and data parts would need to be combined in the form of a single function
    that produces a list of `n` identical elements, such as:


    ![image](images/image145_00.jpg)


    Being able to modularise programs by separating them into logically distinct parts
    is an important goal in programming, and being able to separate control from data
    is one of the most important benefits of lazy evaluation.


    Note that care is still required when programming with infinite lists, to avoid
    non-termination. For example, the expression


    ![image](images/image147_04.jpg)


    (where `[n . ..]` produces the infinite list of integers beginning with `n`) will
    produce the integers 1, 2, 3, 4, 5 and then loop forever, because the function
    `filter` (≤ 5) keeps testing elements of the infinite list in a vain attempt to
    find another that is less than or equal to five. In contrast, the expression


    ![image](images/image147_05.jpg)


    will produce the same integers and then terminate, because `takeWhile` (≤ 5) stops
    as soon as it finds an element of the list that is greater than five.


    We conclude this section with an example concerning prime numbers. In [chapter
    5](#12_chapter_title_5.html) we wrote a function to generate prime numbers up
    to a given limit. Here is a simple procedure for generating the infinite sequence
    of all prime numbers, as opposed to some finite prefix of this sequence:


    * write down the infinite sequence 2, 3, 4, 5, 6, · · ·;

    * mark the first number, `p`, in the sequence as prime;

    * delete all multiples of `p` from the sequence;

    * return to the second step.


    Note that the first and third steps require an infinite amount of work, and hence
    in practice the steps must be interleaved. The first few iterations of this procedure
    can be illustrated as follows:


    ![image](images/image145_01.jpg)


    Each row corresponds to one iteration, with the first row being the initial sequence
    (step one), the first number in each row being written in bold to indicate its
    primality (step two), and all multiples of this number being underlined to indicate
    their deletion (step three) prior to the next iteration. In this manner, we can
    imagine the initial sequence of numbers falling downwards, with certain numbers
    being sieved out at each stage by the underlining, and the bold numbers forming
    the infinite sequence of primes:


    ![image](images/image148_03.jpg)


    The above procedure for generating prime numbers is known as the `sieve of Eratosthenes`,
    after the Greek mathematician who first described it. This procedure can be translated
    directly into Haskell:


    ![image](images/image146_00.jpg)


    That is, starting with the infinite list `[2 .. ..]` (step one), we apply the
    function `sieve` that retains the first number `p` as being prime (step two),
    and then calls itself recursively with a new list obtained by filtering all multiples
    of `p` from this list (steps three and four). Lazy evaluation ensures that this
    program does indeed produce the infinite list of all prime numbers:


    ![image](images/image148_04.jpg)


    By freeing the generation of prime numbers from the constraint of finiteness,
    we have obtained a modular program on which different control parts can be used
    in different situations. For example, the first ten prime numbers, and the prime
    numbers less than ten, can be produced as follows:


    ![image](images/image148_05.jpg)


