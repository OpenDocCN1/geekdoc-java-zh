    13.6 Making append vanish


    Many recursive functions are naturally defined using the append operator ++ on
    lists, but this operator carries a considerable efficiency cost when used recursively.
    In this section, we show how induction can be used to eliminate such uses of append,
    and hence make functions more efficient. As a first example, consider again the
    following definition:


    ![image](images/image159_00.jpg)


    How efficient is *reverse*? First of all, it is easy to show that the number of
    reduction steps required to evaluate *xs* ++ *ys* is one greater than the length
    of *xs*, assuming for simplicity that both *xs* and *ys* are already fully evaluated.
    As a result, we say that ++ takes linear time in the length of its first argument.
    In turn, the number of steps required by *reverse xs* for a list of length *n*
    can be shown to be the sum of the integers from 1 to *n* + 1, which is (*n* +
    1)(*n* + 2)*/*2. Multiplying out the brackets using the equation verified at the
    start of this chapter gives (*n*² + 3*n* + 2)*/*2, as a result of which we say
    that *reverse* takes quadratic time in the length of its argument.


    Quadratic time is bad. For example, reversing a list with ten thousand elements
    will take approximately fifty million reduction steps. Fortunately, however, through
    the use of induction it is easy to eliminate the use of append in the definition
    of *reverse*, and hence improve its efficiency.


    The trick is to attempt to define a more general function, which combines the
    behaviours of *reverse* and ++. In particular, we seek to define a recursive function
    *reverse*′ that satisfies the following equation:


    ![image](images/image161_04.jpg)


    That is, applying *reverse*′ to two lists should give the result of reversing
    the first list, appended together with the second list. If we can define such
    a function, then *reverse* itself can be redefined by *reverse xs* = *reverse*′
    *xs* [ ], using the fact that the empty list is the identity for append.


    Rather the giving the definition for *reverse*′, and then showing that it satisfies
    the above equation, we can in fact use this equation as the driving force for
    constructing the definition itself. In particular, we simply attempt to verify
    this equation by induction on *xs*. The base case results in an equation that
    gives the definition for *reverse*′ [ ] *ys*, while the inductive case results
    in an equation that gives the definition for *reverse*′ (*x* : *xs*) *ys*.


