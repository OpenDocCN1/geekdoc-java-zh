    7.6 String transmitter


    We conclude this chapter with an extended example. Consider the problem of simulating
    the transmission of a string using zeros and ones. More precisely, we seek to
    define a function that converts a string into a list of zeros and ones, together
    with a function that performs the opposite conversion.


    Binary numbers


    As a consequence of having ten fingers, people normally find it most convenient
    to use numbers written in base-ten or *decimal* notation. A decimal number is
    sequence of digits in the range zero to nine, in which the rightmost digit has
    a weight of one, and successive digits as we move to the left in the number increase
    in weight by a factor of ten. For example, the decimal number 2345 can be understood
    in these terms as follows:


    ![image](images/image83_05.jpg)


    That is, 2345 represents the sum of the products of the weights 1000,100,10,1
    with the digits 2,3,4,5, which evaluates to the integer 2345.


    In contrast, computers normally find it more convenient to use numbers written
    in the more primitive base-two or *binary* notation. A binary number is a sequence
    of zeros and ones, called binary digits or *bits*, in which successive bits as
    we move to the left increase in weight by a factor of two. For example, the binary
    number 1101 can be understood as follows:


    ![image](images/image83_06.jpg)


    That is, 1101 represents the sum of the products of the weights 8,4,2,1 with the
    bits 1,1,0,1, which evaluates to the integer 13.'
