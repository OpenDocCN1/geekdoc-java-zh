    The use of `::` in these examples resolves the type of the result. In practice,
    however, the necessary type information can usually be inferred automatically
    from the context. For example, the expression `¬ (read "False")` requires no explicit
    type information, because the application of the logical negation function `¬`
    implies that `read "False"` must have type `Bool`.


    Note that the result of `read` is undefined if its argument is not syntactically
    valid. For example, the expression `¬ (read "hello")` produces an error when evaluated,
    because `"hello"` cannot be read as a logical value.


    ### `Num` – numeric types


    This class contains types that are instances of the equality class `Eq` and showable
    class `Show`, but in addition whose values are numeric, and as such can be processed
    using the following six methods:


