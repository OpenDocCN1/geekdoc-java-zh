    # 第 11 章


    ## 倒计时问题


    在本章中，我们将展示如何使用 Haskell 解决倒计时问题（countdown），这是一个数字游戏，目标是构造满足特定约束的数值表达式。我们首先在 Haskell
    中形式化该问题的规则，然后给出一个简单但低的程序来解决问题，随后通过两个阶段提高其效率。


    ![](img/line.jpg)


    ## 11.1 引言


    Countdown 是一个受欢迎的问答节目，自 1982 年以来一直在英国电视上播出，包含一个我们将称之为*倒计时问题*的数字游戏。问题的本质如下：


    给定一个数字序列和一个目标数字，尝试通过加法、减法、乘法、除法和括号组合序列中的一个或多个数字，构造出一个数值等于目标的表达式。


    序列中的每个数字在表达式中只能使用一次，且涉及的所有数字（包括中间值）必须是正自然数（1, 2, 3*, . . .*）。特别，不允许使用负数、零以及如 2
    ÷ 3 这样的真分数。


    例如，假设我们给定序列 1, 3, 7, 10, 25, 50 和目标值 765。那么一种可能的解是表达式 (1 + 50) * (25 − 10)，如下所示的简单计算所示：


    ![image](img/image128_00.jpg)


    事实上，对于这个例子，可以证明有 780 种不同的解。另一方面，保持相同序列但将目标改为 831，则可以证明没有解。


    在倒计时问题的电视节目中，采用了一些额外的规则，以使问题适用于问答节目中的人类玩家。特别是，总是从序列 1 *. . .* 10, 1 *. . .* 10,
    25, 50, 75, 100 中选择六个数字，目标始终在 999 范围内，并且有 30 秒的时间限制。在开发计算机程序时，从这些约束中进行抽象是自然的。然而，如果我们从正自然数扩展到更丰富的领域（如整数或有理数），将从根本上改变问题的复杂性。


    ![](img/line.jpg)


    ## 11.2 问题的形式化


    我们首先为四个运算符定义一个类型：


    ![image](img/image131_03.jpg)


    使用该类型，我们定义一个函数 `valid` 来判断运算符应用于两个自然数是否得到另一个正自然数，以及一个实际执行该应用的函数 `apply`：


    ![image](img/image129_00.jpg)


    例如，Sub 2 3 是无效的，因为 2 − 3 是负数；而 Div 2 3 是无效的，因为 2 ÷ 3 是有理数。随后，我们定义一个表达式类型，它可以是一个整数值，或者是运算符应用于两个表达式：


    ![image](img/image131_04.jpg)


    使用该类型，我们定义一个返回表达式中 `values` 列表的函数，以及一个返回表达式整体值的 `eval` 函数，前提该值为正自然数：


    ![image](img/image130_00.jpg)


    注意，`eval` 的失败可以通过返回列表来处理，约定单元列表表示成功，空列表表示失败。例如，对于 2 + 3 和 2 − 3，我们有：


    ![image](img/image132_03.jpg)


    `eval` 的失败也可以通过使用 *Maybe* 类型来处理，但在这种情况下我们倾向于使用列表类型，因为推导式符号为定义 `eval` 函数提供了一种方便的方法。


    我们现在定义了一些返回满足特定属性的组合函数。`subs` 返回列表的所有子序列，由对每个元素排除或包含的所有组合给出；`interleave` 返回将新元素插入列表的所有可能方式；而
    `perms` 返回列表的所有排列，由元素的所有可能的重新排序给出：


    ![image](img/image130_01.jpg)


    例如：


    ![image](img/image132_04.jpg)


    反之，一个返回列表所有 `choices` 的函数（即以任何顺序选择零或多个元素的所有可能方式）可以简单地通过考虑所有子序列的排列来定义：


    ![image](img/image131_00.jpg)


    例如：


    ![image](img/image133_03.jpg)


    最后，我们现在可以定义一个函数 `solution` 来形式化解决倒计时问题实例的含义：


