    ### 3.8 Overloaded types


    The arithmetic operator `+` calculates the sum of any two numbers of the same
    numeric type. For example, it can be used to calculate the sum of two integers,
    or the sum of two floating-point numbers:


    ![image](images/image37_03.jpg)


    The idea that `+` can be applied to numbers of any numeric type is made precise
    in its type by the inclusion of a *class constraint*. Class constraints are written
    in the form `C a`, where `C` is the name of a class and `a` is a type variable.
    For example, the type of `+` is as follows:


