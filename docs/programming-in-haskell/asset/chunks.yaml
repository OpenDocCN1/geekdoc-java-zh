    7.4 The *foldl* function


    It is also possible to define recursive functions on lists using an operator that
    is assumed to associate to the left. For example, the function *sum* can be redefined
    in this manner by using an auxiliary function *sum*′ that takes an extra argument
    *v* that is used to accumulate the final result:


