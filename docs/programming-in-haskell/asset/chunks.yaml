    # 示例 – `drop`


    作为一个更具体的例子，我们现在展示如何使用这五步法来构建之前为库函数 `drop` 的定义，该函数是从列表开头删除指定数量的元素。


    ## 第 1 步：定义类型


    让我们从一个类型开始，该类型表示 `drop` 接收一个整数和一个某种类型 `a` 的值列表，并产生另一个包含此类值的列表：


    ![image](img/image70_05.jpg)


    注意，我们在定义该类型时做出了四个决定：为了简单化，使用了整数而不是更通用的数值类型；为了灵活性，使用了柯里化而不是将参数作为元组（参见第 3.6 节）；为了可读性，将整数参数放在列表参数之前（`drop
    n xs` 可以读作“从 `xs` 中删除 `n` 个元素”）；以及最后，为了通用性，使函数在列表元素类型上是多化的。


    ## 第 2 步：列举情况


    由于整数参数有两种标准情况（0 和 `n` + 1），列表参数有两种情况（`[]` 和 `x` : `xs`），使用模式匹配编写骨架定义总共需要四种情况：


    ![image](img/image69_00.jpg)


    ## 第 3 步：定义简单情况


    根据定义，从任何列表开头删除零元素将得到相同的列表，因此定义前两种情况是非常直接的：


    ![image](img/image69_01.jpg)


    尝试从空列表删除一个或多个元素是无效的，因此可以省略第三种情况，如果发生这种情况，将产生一个错误。但在实践中，我们选择通过在这种情况下返回空列表来避免错误的产生：


    ![image](img/image69_02.jpg)


    ## 第 4 步：定义其他情况


    我们如何从非空列表中删除一个或多个元素呢？只需从列表尾部少删除一个元素即可：


    ![image](img/image69_03.jpg)


    ## 第 5 步：泛化和简化


    由于函数 `drop` 不依赖于所适用的精确整数类型，其类型可以泛化为任何整数类型，其中 `Int` 和 `Integer` 是标准实例：


    ![image](img/image71_02.jpg)


    然而，出于效率考虑，这种泛化实际上并没有在标准 prelude 中实现，如第 3.9 节 所示。在简化方面，`drop` 的前两个方程可以合并为一个方程，表示从任何列表删除零元素将得到相同的列表：


    ![image](img/image69_04.jpg)


    此外，最后一个方程中的变量 `x` 可以被通配符模式 `_` 替换，因为该变量在方程体中没有被使用：


    ![image](img/image70_00.jpg)


    我们可能同样期望第二个方程中的 `n` 被替换为 `_`，但这将使定义失效，因为形式为 `n` + `k` 的模式要求 `n` 必须是一个变量。这种约束可以通过将第二个方程中的整个模式
