    That is, an expression is a solution for a given list of numbers and a target
    if the list of values in the expression is chosen from the list of numbers, and
    the expression successfully evaluates to give the target. For example, if `e`
    :: `Expr` represents the expression (1 + 50) * (25 − 10), then we have:


    ![image](images/image133_04.jpg)


    The efficiency of `solution` could be improved by using a function `isChoice`
    that decides directly if one list is chosen from another, rather than doing so
    indirectly using the function `choices` that returns all possible choices from
    a list. However, efficiency is not important at this stage, and `choices` itself
    is used to define a number of other functions in this chapter.


    ![](images/line.jpg)


    ### 11.3 Brute force solution


    Our first approach to solving the countdown problem is by brute force, using the
    idea of generating all possible expressions over the given list of numbers. We
    start by defining a function `split` that returns all possible ways of splitting
    a list into two non-empty lists that append to give the original list:


    ![image](images/image131_02.jpg)


    For example:


    ![image](images/image133_05.jpg)


    Using `split` we can then define the key function, `exprs`, which returns all
    possible expressions whose list of values is precisely a given list:


    ![image](images/image132_00.jpg)


    That is, for the empty list of numbers there are no possible expressions, while
    for a single number there is a single expression comprising that number. Otherwise,
    for a list of two or more numbers we first produce all splittings of the list,
    then recursively calculate all possible expressions for each of these lists, and,
    finally, combine each pair of expressions using each of the four numeric operators,
    using an auxiliary function defined as follows:


    ![image](images/image132_01.jpg)


    Finally, we can now define a function `solutions` that returns all possible expressions
    that solve an instance of the countdown problem, by first generating all expressions
    over each choice from the given list of numbers, and then selecting those expressions
    that successfully evaluate to give the target:


    ![image](images/image132_02.jpg)


    For the purposes of testing our programs in this chapter, the performance of Hugs
    is somewhat limited, so instead we use the Glasgow Haskell Compiler. For example,
    using GHC version 6.4.1 on a 1.2GHz Pentium M laptop, `solutions` [1, 3, 7, 10,
    25, 50] 765 returns the first solution in 0.36 seconds, and all 780 solutions
    in 43.98 seconds, while if the target is changed to 831, then the empty list of
    solutions is returned in 44.42 seconds.


    ![](images/line.jpg)


    ### 11.4 Combining generation and evaluation


    The function `solutions` generates all possible expressions over the given numbers,
    but in practice many of these expressions will fail to evaluate, due to the fact
    that subtraction and division are not always valid for positive naturals. For
    example, it can be shown that there are 33, 665, 406 possible expressions over
    the numbers 1, 3, 7, 10, 25, 50, but only 4, 672, 540 of these expressions evaluate
    successfully, which is just under 14%.


    Based upon this observation, our second approach to solving the countdown problem
    is to improve our brute force program by combining the generation of expressions
    with their evaluation, such that both tasks are performed simultaneously. In this
    way, expressions that fail to evaluate are rejected at an earlier stage, and,
    more importantly, are not used to generate further such expressions. We start
    by declaring a type `Result` of expressions that evaluate successfully paired
    with their overall values:


    ![image](images/image135_00.jpg)


    Using this type, we then define a function `results` that returns all possible
    results comprising expressions whose list of values is precisely a given list:


    ![image](images/image133_00.jpg)


    That is, for the empty list there are no possible results, while for a single
    number there is a single result formed from that number, provided that the number
    itself is a positive natural. Otherwise, for two or more numbers we first produce
    all splittings of the list, then recursively calculate all possible results for
    each of these lists, and, finally, combine each pair of results using each of
    the four numeric operators that are valid:


    ![image](images/image133_01.jpg)


    Using `results` we can now define a new function `solutions''` that returns all
    possible expressions that solve an instance of the countdown problem, by first
    generating all results over each choice from the given numbers, and then selecting
    those expressions whose value is the target:


    ![image](images/image133_02.jpg)


    In terms of performance, `solutions''` [1, 3, 7, 10, 25, 50] 765 returns the first
    solution in 0.04 seconds (9 times faster than `solutions`) and all solutions in
    3.47 seconds (12 times faster), while if the target is changed to 831, the empty
    list is returned in 3.28 seconds (13 times faster).


    ![](images/line.jpg)


    ### 11.5 Exploiting algebraic properties


    The function `solutions''` generates all possible expressions over the given numbers
    whose evaluation is successful, but in practice many of these expressions will
    be essentially the same due to the fact that numeric operators have algebraic
    properties. For example, the expressions 2 + 3 and 3 + 2 are essentially the same
    because the result of an addition does not depend upon the order of the arguments,
    while 2 ÷ 1 and 2 are essentially the same because dividing any number by one
    has no effect on that number.


    Based upon this observation, our final approach to solving the countdown problem
    is to improve our second program by exploiting such properties to reduce the number
    of generated expressions. In particular, we exploit the following commutativity
    and identity properties:


    ![image](images/image134_00.jpg)


    We start by recalling the function `valid` that decides if the application of
    an operator to two positive naturals gives another:


    ![image](images/image134_01.jpg)


    This definition can be modified to exploit the commutativity of addition and multiplication
    simply by requiring that their arguments are in numeric order (`x <= y`), and
    the identity properties of multiplication and division simply by requiring that
    the appropriate arguments are non-unitary (`!= 1`):


    ![image](images/image134_02.jpg)


    For example, using this new definition, `Add 3 2` is now invalid because it is
    essentially the same as `Add 2 3` using the commutativity of addition, while `Div
    2 1` is now invalid because it is essentially the same as the number 2.


    Using the new version of `valid` gives a new version of our function `solutions''`
    that solves the countdown problem, which we write as `solutions''''`. Using this
    new function can considerably reduce the number of generated expressions and the
    number of solutions. For example, `solutions''''` [1, 3, 7, 10, 25, 50] 765 only
    generates 245, 644 expressions, of which just 49 are solutions, which is just
    over 5% and 6% respectively of the numbers using `solutions''`.


    As regards performance, `solutions''''` [1, 3, 7, 10, 25, 50] 765 now returns
    the first solution in 0.02 seconds (twice as fast as `solutions''`) and all solutions
    in 0.44 seconds (7 times faster), while for the target number 831 the empty list
    is also returned in 0.44 seconds (7 times faster). More generally, given any numbers
    from the television version of the countdown problem, our final program `solutions''''`
    typically returns all solutions in under one second.


    ![](images/line.jpg)


