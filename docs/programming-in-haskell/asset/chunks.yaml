    chapter 12


    **Lazy evaluation**


    In this chapter we introduce lazy evaluation, the mechanism used to evaluate expressions
    in Haskell. We start by reviewing the notion of evaluation, then consider evaluation
    strategies and their properties, discuss infinite structures and modular programming,
    and conclude with a special form of function application that can improve the
    space performance of programs.


    ![](images/line.jpg)


    12.1 Introduction


    As we have seen throughout this book, the basic method of computation in Haskell
    is the application of functions to arguments. For example, suppose that we define
    a function that increments an integer:


    ![image](images/image136_00.jpg)


    Then the expression *inc* (2 * 3) can be evaluated as follows:


    ![image](images/image136_01.jpg)


    Alternatively, the same result can also be obtained by performing the first two
    function applications in the opposite order:


    ![image](images/image136_02.jpg)


    The fact that changing the order in which functions are applied does not affect
    the final result is not specific to such simple examples, but is an important
    general property of function application in Haskell. More formally, in Haskell
    any two different ways of evaluating the same expression will always produce the
    same final value, provided that they both terminate. We will return to the issue
    of termination later on in this chapter.


    Note that the above property does not hold for most imperative programming languages,
    in which the basic method of computation is changing stored values. For example,
    consider the imperative expression *n* + (*n* := 1) that adds the current value
    of the variable *n* to the result of changing its value to one, assuming that
    *n* initially has the value zero. This expression can be evaluated by first performing
    the left-hand side of the addition


    ![image](images/image137_00.jpg)


    or alternatively, by first performing the right-hand side:


    ![image](images/image137_01.jpg)


    The final value is different in each case. The general problem illustrated by
    this example is that the precise time at which an assignment is performed in an
    imperative language may affect the value that results from a computation. In contrast,
    the time at which a function is applied to an argument in Haskell never affects
    the value that results from a computation. Nonetheless, as we shall see in the
    remainder of this chapter, there are important practical issues concerning the
    order and nature of evaluation.


    ![](images/line.jpg)


    12.2 Evaluation strategies


    An expression that has the form of a function applied to one or more arguments
    that can be “reduced” by performing the application is called a reducible expression,
    or *redex* for short. As indicated by the use of quotations marks in the preceding
    sentence, such reductions do not necessarily decrease the size of an expression,
    although in practice this is often the case.


    By way of example, suppose that we define a function *mult* that takes a pair
    of integers and returns their product:


    ![image](images/image138_00.jpg)


    Now consider the expression *mult* (1 + 2, 2 + 3). This expression contains three
    redexes, namely the sub-expressions 1 + 2 and 2 + 3, which have the form of the
    function + applied to two arguments, and the entire expression *mult* (1 + 2,
    2 + 3) itself, which has the form of the function *mult* applied to a pair of
    arguments. Performing the corresponding reductions gives the expressions *mult*
    (3, 2 + 3), *mult* (1 + 2, 5), and (1 + 2) * (2 + 3).


    When evaluating an expression, in what order should reductions be performed? One
    common strategy, called *innermost* evaluation, is to always choose a redex that
    is innermost, in the sense that it contains no other redex. If there is more than
    one innermost redex, by convention we choose that which begins at the leftmost
    position in the expression.


    For example, both 1 + 2 and 2 + 3 contain no other redexes and are hence innermost
    within the expression *mult* (1 + 2, 2 + 3), with the redex 1 + 2 beginning at
    the leftmost position. More generally, our example expression is evaluated using
    innermost evaluation as follows:


    ![image](images/image138_01.jpg)


    Innermost evaluation can also be characterised in terms of how arguments are passed
    to functions. In particular, using this strategy ensures that the argument of
    a function is always fully evaluated before the function itself is applied. That
    is, arguments are passed *by value*. For example, as shown above, evaluating *mult*
    (1 + 2, 2 + 3) using innermost evaluation proceeds by first evaluating the argument
    expressions 1 + 2 and 2 + 3, and then applying the function *mult*. The fact that
    we always choose the leftmost innermost redex ensures that the first argument
    is evaluated before the second.


    Another common strategy for evaluating an expression, dual to innermost evaluation,
    is to always choose a redex that is outermost, in the sense that it is contained
    in no other redex. If there is more than one such redex then as previously we
    choose that which begins at the leftmost position. Not surprisingly, this evaluation
    strategy is called *outermost* evaluation.


    For example, the expression *mult* (1 + 2, 2 + 3) is contained in no other redex
    and is hence outermost within itself. More generally, evaluating this expression
    using outermost evaluation proceeds as follows:


    ![image](images/image138_02.jpg)


    In terms of how arguments are passed to functions, using outermost evaluation
    allows functions to be applied before their arguments are evaluated. For this
    reason, we say that arguments are passed *by name*. For example, as shown above,
    evaluating *mult* (1 + 2, 2 + 3) using outermost evaluation proceeds by first
    applying the function *mult* to the two unevaluated arguments 1 + 2 and 2 + 3,
    and then evaluating these two expressions in turn.'
