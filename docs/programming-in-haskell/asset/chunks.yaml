    ### 3.6 Curried functions


    Functions with multiple arguments can also be handled in another, perhaps less
    obvious way, by exploiting the fact that functions are free to return functions
    as results. For example, consider the following definition:


    ![image](images/image33_03.jpg)


    The type states that `add′` is a function that takes an argument of type `Int`,
    and returns a result that is a function of type `Int` → `Int`. The definition
    itself states that `add′` takes an integer `x` followed by an integer `y`, and
    returns the result `x + y`. More precisely, `add′` takes an integer `x` and returns
    a function, which in turn takes an integer `y` and returns the result `x + y`.


    Note that the function `add′` produces the same final result as the function `add`
    from the previous section, but whereas `add` takes its two arguments at the same
    time packaged as a pair, `add′` takes its two arguments one at a time, as reflected
    in the different types of the two functions:


