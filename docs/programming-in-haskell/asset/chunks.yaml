    ## 8.8 算术表达式


    我们用一个扩展示例来结束本章。考虑一种由自然数通过加法、乘法和括号构建的简单算术表达式。我们假设加法和乘法是右结合的，并且乘法的优先级高于加法。例如，`2
    + 3 + 4` 意味着 `2 + (3 + 4)`，而 `2 * 3 + 4` 意味着 `(2 * 3) + 4`。


    语言的语法结构可以使用数学概念 `grammar`（语法）来形式化，它是一组描述如何构造语言字符串的规则。例如，我们算术表达式语言的语法可以通过以下两条规则定义：


    ![image](img/image94_00.jpg)


    第一条规则规定，表达式可以是两个表达式的加法或乘法、一个带括号的表达式，或者一个自然数。相应的，第二条规则规定自然数可以是零、一、二等。例如，使用该语法，表达式
    `2 * 3 + 4` 的构建可以用下面的 `parse tree`（解析树）表示，其中表达式中的标记出现在叶子节点上，而用于构造表达式的语法规则产生了分支结构：


    ![image](img/image94_01.jpg)


    该树的结构显式地表明 `2 * 3 + 4` 可以由两个表达式的加法构建，第一个由另外两个表达式的乘法给出（这两个表达式又由数字二和三给出），第二个表达式由数字四给出。然而，语法也允许该示例有另一种可能的解析树，这对应于将表达式错误解释为
    `2 * (3 + 4)`：


    ![image](img/image94_02.jpg)


    问题在于，我们的表达式语法没有考虑到乘法的优先级高于加法这一事实。然而，可以通过修改语法为每个优先级级别设置单独的规则来轻松修复，其中加法处于最低优先级级别，乘法处于中间级别，括号和数字处于最高级别：


    ![image](img/image95_00.jpg)


    使用这个新语法，`2 * 3 + 4` 确实只有一个解析树，它对应于表达式的正确解释 `(2 * 3) + 4`：


    ![image](img/image95_01.jpg)


    我们现在处理了优先级问题，但我们的语法还没有考虑到加法和乘法是右结合的。例如，表达式 `2 + 3 + 4` 目前有两种可能的解析树，分别对应于 `(2 +
    3) + 4` 和 `2 + (3 + 4)`。然而，这可以通过修改加法和乘法的语法使其在右参数上递归来轻松修复：


    ![image](img/image95_02.jpg)


    使用这些新规则，`2 + 3 + 4` 现在只有一个解析树，对应于对表达式的正确解释 `2 + (3 + 4)`：


    ![image](img/image95_03.jpg)


    事实上，我们的表达式语法现在是无歧义的，意味着每个良好的表达式都有仅一个解析树。


    我们对语法的最后一次修改是简化。例如，考虑规则 `expr ::= term + expr | term`，它规定表达式可以是 term 和表达式的加法，或者是
    term。换句话说，表达式总是从 term 开始，然后可以跟表达式的加法或为空。因此，表达式的规则可以简化为 `expr ::= term (+ expr
    | ![](img/images.jpg)))`，其中符号 `![](img/images.jpg)` 表示空字符串。以类似的方式简化 term 的规则得到了我们最终的算术表达式语法：


    ![image](img/image96_00.jpg)


    现在可以将此语法翻译为表达式的解析器，只需使用我们的解析原语重写规则即可。事实上，我们选择让解析器本身对被解析的表达式求整数值，而不是返回某种形式的树：


    ![image](img/image96_01.jpg)


    例如，解析器 `expr` 首先解析值为 `t` 的 term，然后解析一个加号和值为 `e` 的表达式并返回值 `t + e`，否则不再继续解析并直接返回值
    `t`。`term` 和 `factor` 解析器可以类似地读取。


    最后，使用 `expr` 我们定义了一个函数 `eval :: String -> Int`，将算术表达式求值为整数值。为了处理未消耗和无效输入的情况，我们使用库函数
    `error :: String -> a`，它会显示错误消息然后终止程序：


    ![image](img/image97_00.jpg)


    例如：


    ![image](img/image99_00.jpg)


