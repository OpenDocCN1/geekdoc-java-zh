    ## chapter 13


    ### Reasoning about programs


    In this final chapter we introduce the idea of reasoning about Haskell programs.
    We start by reviewing the notion of equational reasoning, then consider how it
    can be applied in Haskell, introduce the important technique of induction, show
    how induction can be used to eliminate uses of the append operator, and conclude
    by proving the correctness of a simple compiler.


    ![](images/line.jpg)


    ### 13.1 Equational reasoning


    At school we learn basic algebraic properties of numbers, such as the fact that
    multiplication is commutative, addition is associative, and multiplication distributes
    over addition on both the left- and right-hand sides:


    ![image](images/image151_00.jpg)


    For example, using these properties we can show that a product of the form `(x
    + a) (x + b)` can be expanded to a summation `x² + (a + b) x + a b`:


    ![image](images/image151_01.jpg)


    Note that in this calculation we follow the common practice of implicitly exploiting
    associativity properties, in this case the associativity of addition by omitting
    parentheses when more than one addition is used in sequence.


    As well as being interesting in their their own right, algebraic properties can
    also have a computational significance. For example, the expression `x (y + z)`
    requires two operations (one multiplication and one addition), whereas the equivalent
    expression `x y + x z` requires three (two multiplications and one addition).
    Hence even though these two expressions are algebraically equal, in terms of efficiency
    the former is preferable to the latter.


    ![](images/line.jpg)


    ### 13.2 Reasoning about Haskell


    The same style of equational reasoning can also be used in Haskell. For example,
    in this context the equation `x * y = y * x` means that for any expressions `x`
    and `y` of the same numeric types, evaluation of `x * y` and `y * x` will always
    produce the same numeric value. Note that the equality operator `==` provided
    within Haskell itself is not used when stating such properties, as in `x * y ==
    y * x`, because we are aiming to use mathematics as a language to reason about
    Haskell, rather than using Haskell as a language to reason about itself, which
    would be somewhat circular.


    When reasoning about Haskell, we do not just use properties of built-in operations
    of the language such as addition and multiplication, but also use the equations
    from which user-defined functions are constructed. For example, consider the following
    function that doubles an integer:


    ![image](images/image152_00.jpg)


    As well as being viewed as the definition of a function, this equation can also
    be viewed as a property that can be used when reasoning about this function. In
    particular, as a logical property the above equation states that for any integer
    expression `x`, the expression `double x` can freely be replaced by `x + x`, and,
    conversely, that the expression `x + x` can freely be replaced by `double x`.
    In this manner, when reasoning about programs, function definitions can be both
    applied from left-to-right and unapplied from right-to-left.


    However, some care is required when reasoning about functions that are defined
    using multiple equations. For example, consider a function that decides if an
    integer is zero, defined using two equations:


    ![image](images/image152_01.jpg)


    The first equation, `isZero 0 = True`, can freely be viewed as a logical property
    that can be applied in both directions. However, this is not the case for the
    second equation, `isZero n = False`. In particular, because the order in which
    the equations are written is significant, an expression of the form `isZero n`
    can only be replaced by `False` provided that `n ≠ 0`, as in the case when `n
    = 0` the first equation applies. Dually, it is only valid to unapply the equation
    `isZero n = False` and replace `False` by an expression of the form `isZero n`
    in the case when `n ≠ 0`, for the same reason.


    More generally, when a function is defined using multiple equations, the equations
    cannot be viewed as logical properties in isolation, but need to be interpreted
    in light of the order in which patterns are matched. For this reason, it is preferable
    to define functions in a manner that does not rely on the order in which they
    are written. For example, if we rewrite the above definition using a guard


    ![image](images/image153_00.jpg)


    then it is now explicitly clear that `isZero n` can only be replaced by `False`,
    and conversely that `False` can only be replaced by `isZero n`, when the guard
    `n ≠ 0` is satisfied. Patterns that do not rely on the order in which they are
    matched are called *disjoint* or *non-overlapping*. In order to simplify the process
    of reasoning about programs, it is good practice to use non-overlapping patterns
    whenever possible. For example, most of the functions in the standard library
    given in appendix A are defined in this manner.


