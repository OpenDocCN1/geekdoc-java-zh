    that removes the last element from a non-empty list can be constructed.


    ## Step 1: define the type


    We begin with a type that states that `init` takes a list of values of some type
    `a`, and produces another list of such values:


    ![image](images/image72_00.jpg)


    ## Step 2: enumerate the cases


