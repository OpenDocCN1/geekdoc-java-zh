    the nearest integer if the result is a proper fraction.


    Following normal mathematical convention, exponentiation has higher priority than
    multiplication and division, which in turn have higher priority than addition
    and subtraction. For example, 2 * 3 ↑ 4 means 2 * (3 ↑ 4), while 2 + 3 * 4 means
    2 + (3 * 4). Moreover, exponentiation associates (brackets) to the right, while
    the other four arithmetic operators associate to the left. For example, 2 ↑ 3
