    # 第 9 章


    ## 交互式程序


    在本章中，我们将展示如何使用 Haskell 编写交互式程序。我们首先开始解释什么是交互式程序，展示此类程序如何自然地被视为函数，定义了一些基础交互式程序以及用于组合交互式程序的高阶函数，并通过开发一个计算器和生命游戏作为结束。


    ![](img/line.jpg)


    ### 9.1 交互


    `batch`（批处理）程序是指在运行时不与用户交互的程序。在计算机早期，大多数程序都是批处理程序，它们独立于用户运行，以最大限度地增加计算机执行有用工作的时间。例如，一个路线规划程序可能接受起点和终点作为输入，静地执行大量计算，然后生成推荐的路线作为输出。


    到本书为止，我们已经考虑了如何使用 Haskell 编写批处理程序。在 Haskell 中，此类程序（更广泛地说是所有程序）被建模为`pure`（纯）函数，接受所有输入作为显式参数并将所有输出产生显式结果。例如，路线规划器可以被建模为一个类型为
    `(Point, Point) → Route` 的函数，接受一对点并产生它们之间的路线。


    此相反，`interactive`（交互式）程序是在程序运行时可以从用户获取额外的输入，并为用户产生额外的输出。在现代计算时代，大多数程序都是交互式程序，通过与用户对话的方式运行，以提供更大的灵活性。例如，计算器程序可能允许用户使用键盘交互式地输入数值表达式，并立即在屏幕上显示这些表达式的值。


    初一看，将交互式程序建模为纯函数似乎是不可行的，因为此类程序从本质上要求在程序运行时获取额外输入和产生额外输出的 `side effects`（副作用）。例如，上述计算器程序如何被视为一个从参数到结果的纯函数呢？


    多年来，针对将纯函数概念与副作用概念相结合的问题已经有了许多解决方案。在本章的剩余部分，我们将介绍 Haskell 采用的解决方案，该方案基于一种新类型结合少量原语的使用。正如我们将看到的，这种方法与上一章介绍的解析器方法有很多共同之处。


    ![](img/line.jpg)


    ### 9.2 输入/输出类型


    在 Haskell 中，交互式程序被视为一个纯函数，它将当前的“世界状态”作为参数，产生一个修改后的世界作为结果，其中修改后的世界反映了程序执行的任何副作用。因此，给定一个合适的类型
    `World`，其值代表世界的当前状态，交互式程序的概念可以用一个类型为 `World → World` 的函数表示，我们简写为 `IO`（“input/output”的缩写），如下：


    ![image](img/102_04.jpg)


    然而，通常交互式程序在执行副作用之外还可以返回一个结果值。例如，一个从键盘读取字符的程序可能会返回所读取的字符。因此，我们将交互式程序的类型泛化为也返回结果值，这些值的类型是
    `IO` 的参数：


    ![image](img/102_05.jpg)


    类型为 `IO a` 的表达式被称为 `actions`（动作）。例如，`IO Char` 是返回字符的动作类型，而 `IO ()` 是返回空元组 `()`
    作为虚拟结果值的动作类型。后者的动作可以被认为是不返回结果值的纯副作用动作，在编写交互式程序时经常使用。


    除了返回结果值，交互式程序可能还需要参数值。然而，没有必要将动作类型泛化以考虑这一点，因为这种行为可以通过柯里化（currying）来实现。例如，一个接受字符并返回整数的交互式程序类型为
    `Char → IO Int`，它是柯里化函数类型 `Char → World → (Int, World)` 的简写。


    此时，读者可能会担心在使用动作编程时传递整个世界状态的可行性。实际上，Haskell 系统（如 Hugs）实现动作的方式比描述的更高效，但为了理解动作的行为，这种抽象视图就足够了。


    ### 9.3 基础动作


    我们现在引入构建交互式程序的三个基础动作。首先，动作 `getChar` 从键盘读取一个字符，将其回显到屏幕上，并将该字符作为结果值返回：


    ![image](img/101_00.jpg)


    `getChar` 的实际定义是内置在 Hugs 系统中的，无法在 Haskell 内部定义。如果键盘上没有等待读取的字符，`getChar` 将等待用户输入。

