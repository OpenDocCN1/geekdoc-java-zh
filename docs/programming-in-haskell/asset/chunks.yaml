    ### 2.3 Function application


    In mathematics, the application of a function to its arguments is usually denoted
    by enclosing the arguments in parentheses, while the multiplication of two values
    is often denoted silently, by writing the two values next to another. For example,
    in mathematics the expression


    ![image](images/image26_06.jpg)


    means apply the function `f` to two arguments `a` and `b`, and add the result
    to the product of `c` and `d`. Reflecting its primary status in the language,
    function application in Haskell is denoted silently using spacing, while the multiplication
    of two values is denoted explicitly using the operator *. For example, the expression
    above would be written in Haskell as follows:


    ![image](images/image27_03.jpg)


    Moreover, function application has higher priority than all other operators. For
    example, `f a + b` means `(f a) + b`. The following table gives a few further
    examples to illustrate the differences between the notation for function application
    in mathematics and in Haskell:


    ![image](images/table25_00.jpg)


    Note that parentheses are still required in the Haskell expression `f (g x)` above,
    because `f g x` on its own would be interpreted as the application of the function
    `f` to two arguments `g` and `x`, whereas the intention is that `f` is applied
    to one argument, namely the result of applying the function `g` to an argument
    `x`. A similar remark holds for the expression `f x (g y)`.


