    ## 第 13 章


    ### 程序推理


    在最后这一章中，我们引入了对 Haskell 程序进行推理的观点。我们首先回顾等式推理（equational reasoning）的概念，然后考虑如何在 Haskell
    中应用它，引入重要的归纳法技术，展示如何使用归纳法来消除对 append 运算符的使用，并以证明一个简单编译器的正确性作为结束。


    ![](img/line.jpg)


    ### 13.1 等式推理


    在学校里，我们学习了数的的基本代数性质，例如乘法交换律、加法结合律，以及乘法在左右两边对加法的分配律：


    ![image](img/image151_00.jpg)


    例如，利用这些性质，我们可以证明形式为 `(x + a) (x + b)` 的积可以展开为和 `x² + (a + b) x + a b`：


    ![image](img/image151_01.jpg)


    注意，在这一计算中，我们遵循了通常的做法，即隐式地利用结合律属性——在这种情况下，当连续使用多个加法时，通过省略括号来利用加法的结合律。


    代数性质本身很有趣，它们也具有计算意义。例如，表达式 `x (y + z)` 需要两个操作（一次乘法和一次加法），而等价的表达式 `x y + x z` 需要三个操作（两次乘法和一次加法）。因此，尽管这两个表达式在代数上是相等的，从效率角度来看，前者优于后者。


    ![](img/line.jpg)


    ### 13.2 Haskell 的推理


    同样的等式推理风格也可以用于 Haskell。例如，在这种背景下，方程 `x * y = y * x` 意味着对于任何相同数值类型的表达式 `x` 和 `y`，`x
    * y` 和 `y * x` 的评估将始终产生相同的数值。注意，在陈述此类属性时，并不使用 Haskell 内部提供的相等运算符 `==`（如 `x * y
    == y * x` 中），因为我们的目标是使用数学作为一种语言来对 Haskell 进行推理，而不是使用 Haskell 作为一种语言对其自身进行推理，那样将是循环论证。


    在推理 Haskell 时，我们不仅使用语言内置操作（如加法和乘法）的属性，还使用构建用户定义函数的方程。例如，考虑以下这个将整数翻倍的函数：


    ![image](img/image152_00.jpg)


    除了被视为函数的定义外，该方程也可以被看作推理该函数时可以使用的属性。特别是，作为一种逻辑属性，上述方程表示对于任何整数表达式 `x`，表达式 `double
    x` 可以自由替换为 `x + x`，反之，表达式 `x + x` 也可以自由替换为 `double x`。这种方式，在推理程序时，函数定义可以从左到右应用，也可以从右到左取消应用。


    然而，在推理使用多个方程定义的函数时，需要小心。例如，考虑一个判断整数是否为零的函数，它使用两个方程定义：


    ![image](img/image152_01.jpg)


    第一个方程 `isZero 0 = True` 可以自由地视为可以双向应用的逻辑属性。然而，第二个方程 `isZero n = False` 并非如此。特别是，由于方程的编写顺序很重要，形式为
    `isZero n` 的表达式只有在 `n ≠ 0` 时才能替换为 `False`，因为当 `n = 0` 时，第一个方程生效。同样，只有在 `n ≠ 0`
    时，取消方程 `isZero n = False` 并将 `False` 替换为形式为 `isZero n` 的表达式才是有效的。


    更通地说，当函数使用多个方程定义时，这些方程不能孤立地视为逻辑属性，而需要根据模式匹配的顺序来解释。因此，最好以不依赖于编写顺序的方式来定义函数。例如，如果我们使用守卫（guard）重写上面的定义：


    ![image](img/image153_00.jpg)


    那么现在明确了，只有在满足守卫 `n ≠ 0` 时，`isZero n` 才能替换为 `False`，反之，`False` 才能替换为 `isZero n`。不依赖于匹配顺序的模式被称为*不交的*（disjoint）或*非重叠的*（non-overlapping）。为了简化程序推理过程，尽可能使用非重叠模式是一种良好的做法。例如，附录
    A 给出的标准库中的大多数函数都是这种方式定义的。


