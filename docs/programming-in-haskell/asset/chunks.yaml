    解析器是计算领域中一个重要课题，因为大多数现实程序都会使用解析器来对其输入进行预处理。例如，计算器程序在评估数值表达式之前会对其进行解析，Hugs 系统在执行
    Haskell 程序之前会对其解析，而网页浏览器在显示超文本文档之前会对其解析。在每种情况下，将输入的结构显式化都能极地简化后续的处理。例如，一旦数值表达式被解析为树结构（如上例所示），评估该表达式就变得非常简单。


    ![](img/line.jpg)


    ## 8.2 解析器类型


    在 Haskell 中，解析器可以自然地直接视为一个接受字符串并产生树的函数。因此，给定一个合适的树类型 `Tree`，解析器的概念可以表示为类型为 `String`
    → `Tree` 的函数，我们通过以下声明将其简写为 `Parser`：


    ![image](img/image89_03.jpg)


    然而，通常情况下，解析器并不总是消耗其整个参数字符串。例如，数字解析器可能会被应用于一个由数字后面跟着单词组成的字符串。因此，我们泛化了解析器的类型，使其也返回参数字符串中任何未被消耗的部分：


    ![image](img/image89_04.jpg)


    同样地，解析器并不总是成功的。例如，数字解析器可能会被应用于一个由单词组成的字符串。为了处理这种情况，我们进一步泛化了解析器的类型，使其返回一个结果列表，按照约定，空列表表示失败，单元素列表表示成功：


    ![image](img/image89_05.jpg)


    返回列表也开启了返回多个结果的可能性，如果参数字符串可以以多种一种方式被解析。然而，为了简单起 way，我们只考虑最多返回一个结果的解析器。


    最后，不同的解析器可能会返回不同类型的树，或者更通地说，返回任何类型的值。例如，数字解析器可能会返回一个整数值。因此，从结果值的特定类型 `Tree` 中抽象出来并将其作为
    `Parser` 类型的一个参数是有用的：


    ![image](img/image89_06.jpg)


    总结，该声明说明类型为 `a` 的解析器是一个接受输入字符串并产生结果列表的函数，每个结果都是由一个类型为 `a` 的结果值和一个输出字符串组成的对对。或者，解析器类型也可以读作苏斯风格的韵律诗！


    *一个用于事物的解析器*


    *是从字符串到函数*


    *到对列表*


    *包含事物和字符串*


    ![](img/line.jpg)


    ## 8.3 基本解析器


    我们现在定义三个基础解析器，它们将作为所有其他解析器的构建模块。首先，解析器 `return v` 总是以结果值 `v` 成功，而不消耗输入字符串的任何部分：


    ![image](img/image89_07.jpg)


    该函数同样可以用 `return v inp` = [`(`v`, `inp`)`] 来定义。然而，我们更倾向于上面的定义，其中第二个参数 `inp` 使用
    lambda 表达式移动到定义体中，因为这显式地表明 `return` 是一个接受单个参数并返回解析器的函数，正如类型 `a` → `Parser a` 所表示的那样。


    虽然 `return v` 总是成功的，对立的解析器 `failure` 无论输入字符串的内容总是失败的：


    ![image](img/image88_00.jpg)


    我们最后一个基础解析器是 `item`，它如果输入字符串为空则失败，否则以第一个字符作为结果值成功：


    ![image](img/image88_01.jpg)


    此定义中使用的 Haskell 的 `case` 机制允许在定义体中使用模式匹配，在本例中，通过将字符串 `inp` 与两个模式进行匹配来在两个可能的结果之间选择。`case`
    机制在书中并不经常使用，但有时是有有用的。


    因为解析器是函数，它们可以使用普通的函数应用应用于字符串，但我们更倾向于通过定义自己的应用函数来抽象解析器的表示：


    ![image](img/image88_02.jpg)


    使用 `parse`，我们通过一些示例结束本节，这些示例说明了上面三个基础解析器的行为：


    ![image](img/image90_02.jpg)


    ![](img/line.jpg)


    ## 8.4 排序


    组合两个解析器最简单的方法可能是顺序应用它们，其中第一个解析器返回的输出字符串成为第二个解析器的输入字符串。但应该如何处理来自两个解析器的结果值？一种方法是使用解析器的序列运算符将两个值组合为一个对，其类型如下：


    ![image](img/image91_02.jpg)


    但在实践中，事实证明通过如下定义的序列运算符 `>>=`（读作“然后”）将解析器的排序与其结果值的处理结合起来被证明更加方便：


    ![image](img/image89_00.jpg)


    也就是说，如果解析器 `p` 应用于输入字符串失败，则 `p`>>=` `f` 失败；否则将函数 `f` 应用于结果值得到第二个解析器，然后将该解析器应用于输出字符串以得到最终结果。通过这种方式，第一个解析器产生的结果值可以直接供第二个解析器处理。


    使用 `>>=` 构建的典型解析器具有以下结构：


    ![image](img/image91_03.jpg)


    即，应用解析器 `p1` 并调用其结果值 `v1`；然后应用解析器 `p2` 并调用其结果值 `v2`；应用解析器 `pn` 并调用其结果值 `vn`；最后，通过函数
    `f` 将所有结果合并为一个单一值。


    与列表推导式一样，表达式 `vi` ← `pi` 被称为生成器。Haskell 为此类解析器提供了特殊语法，允许它们以以下更吸引人的形式表示：


    ![image](img/image89_01.jpg)


    同样注意，布局规则也适用于排序解析器的 **do** 记法，即序列中的每个解析器都必须在同一列开始。


    例如，一个消耗三个字符、丢弃第二个并将第一个和第三个作为对的解析器现在可以定义如下：


    ![image](img/image89_02.jpg)


    注意 `p` 只有当定义序列中的每个解析器都成功时才成功，这要求输入字符串至少有三个字符：


    ![image](img/image92_02.jpg)


    ![](img/line.jpg)


