    我们将棋盘表示为包含活细胞的 (*x*, *y*) 位置的列表，使用与屏幕相同的坐标表示法：


    ![image](img/image109_02.jpg)


    例如，上面的初始示例棋盘将表示为：


    ![image](img/image107_02.jpg)


    使用这种棋盘表示法，很容易在屏幕上显示活细胞，并判断给定位置是活着的还是空的：


    ![image](img/image107_03.jpg)


    接下来，我们定义一个返回位置之邻居的函数：


    ![image](img/image107_04.jpg)


    辅助函数`wrap`考虑了棋盘边缘的环绕，它通过从给定位置的每个分量减一，除以棋盘的宽度和高度取余，然后再次为每个分量加一：


    ![image](img/image108_00.jpg)


    使用函数组合，我们现在可以定义一个计算给定位置活邻居数量的函数，其方法是产生其邻居列表，保留活的邻居并计数：


    ![image](img/image108_01.jpg)


    使用该函数，可以很容易地产生棋盘中恰好有两个或三个活邻居的活位置列表，因此它们能生存到下一代：


    ![image](img/image108_02.jpg)


    反之，也可以如下所示产生棋盘中恰好有三个活邻居的空位置列表，因此它们会产生新细胞：


