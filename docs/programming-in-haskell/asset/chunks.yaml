    Haskell 是一种`higher-order`（高阶）函数语言，这意味着函数可以自由地接受函数作为参数，并将函数作为结果。使用高阶函数允许常见的编程模式（例如组合两个函数）在语言内部定义为函数。更通地说，高阶函数可以用于在
    Haskell 中定义“领域特定语言”，例如用于列表处理、解析和交互式编程。


    - **单子效应** (第 8 章 和 第 9 章）


    Haskell 中的函数是纯函数，它们接受所有输入作为参数，并将所有输出作为结果。然而，许多程序需要某种形式的`side effect`（副作用），这似乎与纯洁性背道而驰，例如在程序运行时从键盘读取输入或向屏幕写入输出。Haskell
    提供了一个统一的框架，基于数学概念 `monad`（单子），在不损害函数纯性的性的处理效应。


    - **惰性求值** (第 12 章）


    Haskell 程序的执行使用一种称为`lazy evaluation`（惰性求值）的技术，该技术基于这样观点：在实际需要结果之前，不执行任何计算。除了避免不必要的计算外，惰性求值还确保程序能够尽可能地终止，鼓励使用中间数据结构进行模块化编程，甚至允许具有无限数量元素的数据结构，例如无限数字列表。


    - **程序的推理** (第 13 章）


    由于 Haskell 中的程序是纯函数，因此可以使用简单的`equational reasoning`（等式推理）来执行程序、转换程序、证明程序的属性，甚至直接从程序行为的规范中推导出程序。当将等式推理与使用“归纳法”结合以对使用递归定义的函数进行推理时，其威力变得尤为强大。


    ![](img/line.jpg)


    ## 1.4 历史背景


    Haskell 的许多特征并不是新颖，而是最初由其他语言引入的。为了帮助理解 Haskell 的背景，下面简要概述了该语言相关的一些主要历史发展：


    - 20 世纪 30 年代，Alonzo Church 开发了 `lambda calculus`（λ 演算），这是一种简单但强大的函数数学理论。

    - 20 世纪 50 年代，John McCarthy 开发了 `Lisp`（“LISt Processor”），它被认为认为第一种函数编程语言。Lisp
    受到 `lambda calculus` 的影响，但仍将变量赋值作为语言的核心特征。

    - 20 世纪 60 年代，Peter Landin 开发了 `ISWIM`（“If you See What I Mean”），这是第一种纯函数编程语言，它高度基于
    `lambda calculus` 且没有变量赋值。

    - 20 世纪 70 年代，John Backus 开发了 `FP`（“Functional Programming”），这是一种函数编程语言，特别强调高阶函数的概念和对程序的推理。

    - 同样在 20 世纪 70 年代，Robin Milner 等人开发了 `ML`（“Meta-Language”），这是现代函数编程语言的第一个，它引入了多态类型和类型推导的概念。

    - 20 世纪 70 年代和 80 年代，David Turner 开发了若干惰性函数编程语言，最终了商业化的语言 `Miranda`（意为“令人赞叹的”）。

    - 1987 年，一个国际研究小组启动了 `Haskell` 的开发（以逻辑学家 Haskell Curry 命名），这是一种标准的惰性函数编程语言。

    - 2003 年，委员会发布了`Haskell Report`，它定义了期待已久的 Haskell 稳定版本，是其设计者十五年来在该语言工作的结晶。


    值得注意的是，上述三位研究人员——McCarthy、Backus 和 Milner——分别获得了 ACM 图灵奖，该奖通常被认为是计算机领域的诺贝尔奖。


    ![](img/line.jpg)


