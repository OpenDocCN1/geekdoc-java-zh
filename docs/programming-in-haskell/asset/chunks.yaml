    Note that `string` is defined using recursion, and only succeeds if the entire
    target string is consumed. The base case states that the empty string can always
    be parsed. The recursive case states that a non-empty string can be parsed by
    parsing the first character, parsing the remaining characters, and returning the
    entire string as the result value. For example:


    ![image](images/image93_04.jpg)


    Our next two parsers, `many p` and `many1 p`, apply a parser `p` as many times
    as possible until it fails, with the result values from each successful application
    of `p` being combined as a list. The difference between these two repetition primitives
    is that `many` permits zero or more applications of `p`, whereas `many1` requires
    at least one successful application:


    ![image](images/image92_00.jpg)


    Note that `many` and `many1` are defined using mutual recursion. In particular,
    the definition for `many p` states that `p` can either be applied at least once
    or not at all, while the definition for `many1 p` states that `p` can be applied
    once and then zero or more times. For example:


    ![image](images/image94_03.jpg)


    Using `many` and `many1`, we can define parsers for `identifiers` (variable names)
    comprising a lower-case letter followed by zero or more alphanumeric characters,
    natural numbers comprising one or more digits, and spacing comprising zero or
    more space, tab, and newline characters:


    ![image](images/image92_01.jpg)


    For example:


    ![image](images/image94_04.jpg)


    Note that `space` returns the empty tuple `()` as a dummy result value, reflecting
    the fact that the details of spacing are not usually important.


    ![](images/line.jpg)


    ## 8.7 Handling spacing


    Most real-life parsers allow spacing to be freely used around the basic `tokens`
    in their input string. For example, the strings `1+2` and `1 + 2` are both parsed
    in the same way by Hugs. To handle such spacing, we define a new primitive that
    ignores any space before and after applying a parser for a token:


    ![image](images/image93_00.jpg)


    Using `token`, it is now easy to define parsers that ignore spacing around identifiers,
    natural numbers, and special symbols:


    ![image](images/image93_01.jpg)


    For example, a parser for a non-empty list of natural numbers that ignores spacing
    around tokens can be defined as follows:


    ![image](images/image93_02.jpg)


    This definition states that such a list begins with an opening square bracket
    and a natural number, followed by zero or more commas and natural numbers, and
    concludes with a closing square bracket. Note that `p` only succeeds if a complete
    list in precisely this format is consumed:


    ![image](images/image95_04.jpg)


    ![](images/line.jpg)


    ## 8.8 Arithmetic expressions


    We conclude this chapter with an extended example. Consider a simple form of arithmetic
    expressions built up from natural numbers using addition, multiplication, and
    parentheses. We assume that addition and multiplication associate to the right,
    and that multiplication has higher priority than addition. For example, `2 + 3
    + 4` means `2 + (3 + 4)`, while `2 * 3 + 4` means `(2 * 3) + 4`.


    The syntactic structure of a language can be formalised using the mathematical
    notion of a `grammar`, which is a set of rules that describes how strings of the
    language can be constructed. For example, a grammar for our language of arithmetic
    expressions can be defined by the following two rules:


    ![image](images/image94_00.jpg)


    The first rule states that an expression is either the addition or multiplication
    of two expressions, a parenthesised expression, or a natural number. In turn,
    the second rule states that a natural number is either zero, one, two, etc. For
    example, using this grammar the construction of the expression `2 * 3 + 4` can
    be represented by the following `parse tree`, in which the tokens in the expression
    appear at the leaves, and the grammatical rules applied to construct the expression
    give rise to the branching structure:


    ![image](images/image94_01.jpg)


    The structure of this tree makes explicit that `2 * 3 + 4` can be constructed
    from the addition of two expressions, the first given by the multiplication of
    two further expressions which are in turn given by the numbers two and three,
    and the second expression given by the number four. However, the grammar also
    permits another possible parse tree for this example, which corresponds to the
    erroneous interpretation of the expression as `2 * (3 + 4)`:


    ![image](images/image94_02.jpg)


    The problem is that our grammar for expressions does not take account of the fact
    that multiplication has higher priority than addition. However, this can easily
    be fixed by modifying the grammar to have a separate rule for each level of priority,
    with addition at the lowest level of priority, multiplication at the middle level,
    and parentheses and numbers at the highest level:


    ![image](images/image95_00.jpg)


    Using this new grammar, `2 * 3 + 4` indeed has a single parse tree, which corresponds
    to the correct interpretation of the expression as `(2 * 3) + 4`:


    ![image](images/image95_01.jpg)


    We have now dealt with the issue of priority, but our grammar does not yet take
    account of the fact that addition and multiplication associate to the right. For
    example, the expression `2 + 3 + 4` currently has two possible parse trees, corresponding
    to `(2 + 3) + 4` and `2 + (3 + 4)`. However, this can also easily be fixed by
    modifying the grammar for addition and multiplication to be recursive in their
    right argument, rather than both:


    ![image](images/image95_02.jpg)


    Using these new rules, `2 + 3 + 4` now has a single parse tree, which corresponds
    to the correct interpretation of the expression as `2 + (3 + 4)`:


    ![image](images/image95_03.jpg)


    In fact, our grammar for expressions is now unambiguous, in the sense that every
    well-formed expression has precisely one parse tree.


    Our final modification to the grammar is one of simplification. For example, consider
    the rule `expr ::= term + expr | term`, which states that an expression is either
    the addition of a term and an expression, or is a term. In other words, an expression
    always begins with a term, which can then be followed by the addition of an expression
    or by nothing. Hence, the rule for expressions can be simplified to `expr ::=
    term (+ expr | ![](images/e.jpg))`, in which the symbol `![](images/e.jpg)` denotes
    the empty string. Simplifying the rule for terms in a similar manner gives our
    final grammar for arithmetic expressions:


    ![image](images/image96_00.jpg)


    It is now straightforward to translate this grammar into a parser for expressions,
    by simply rewriting the rules using our parsing primitives. In fact, we choose
    to have the parser itself evaluate the expression being parsed to its integer
    value, rather than returning some form of tree:


    ![image](images/image96_01.jpg)


    For example, the parser `expr` first parses a term with value `t`, then parses
    a plus symbol followed by an expression with value `e` and returns the value `t
    + e`, or else parses nothing further and simply returns the value `t`. The parsers
    `term` and `factor` can be read in a similar manner.


    Finally, using `expr` we define a function `eval :: String -> Int` that evaluates
    an arithmetic expression to its integer value. To handle the cases of unconsumed
    and invalid input, we use the library function `error :: String -> a` that displays
    an error message and then terminates the program:


    ![image](images/image97_00.jpg)


    For example:


    ![image](images/image99_00.jpg)

