    substitutions for a proposition by extracting its variables, removing duplicates
    from this list (using the function *rmdups* from [chapter 9](#16_chapter_title_9.html)),
    generating all possible lists of logical values for this many variables, and then
    zipping the list of variables with each of the resulting lists:


    ![image](images/image120_02.jpg)


