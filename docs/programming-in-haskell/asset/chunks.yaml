    Functions such as `+` that are written between their two arguments are called
    `operators`. As we have already seen, any function with two arguments can be converted
    into an operator by enclosing the name of the function in single back quotes,
    as in 7 ‘*div*‘ 2\. However, the converse is also possible. In particular, any
    operator can be converted into a curried function that is written before its arguments
    by enclosing the name of the operator in parentheses, as in `(+)` 1 2\. Moreover,
    this convention also allows one of the arguments to be included in the parentheses
    if desired, as in `(1+)` 2 and `(+2)` 1.


    In general, if `⊕` is an operator, then expressions of the form `(⊕)`, `(*x* ⊕)`,
    and `(⊕ *y*)` for arguments `*x` and `y` are called `sections`, whose meaning
    as functions can be formalised using lambda expressions as follows:


    ![image](images/image48_00.jpg)


    Sections have three main applications. First of all, they can be used to construct
    a number of simple but useful functions in a particularly compact way, as shown
    in the following examples:


    ![image](images/image48_01.jpg)


    Secondly, sections are necessary when stating the type of operators, because an
    operator itself is not a valid expression in Haskell. For example, the type of
    the logical conjunction operator `∧` is stated as follows:


