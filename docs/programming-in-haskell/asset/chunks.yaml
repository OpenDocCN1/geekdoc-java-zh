    也就是说，2345 代表权重 1000,100,10,1 与数字 2,3,4,5 的积之和，其结果为整数 2345。


    相比之下，计算机通常认为使用更原始的二进制（*binary*）表示法的数字更为方便。二进制数是 0 和 1 的序列，称为二进制位或*位*（bits），随着这些位向左移动，其权重按两倍增加。例如，二进制数
    1101 可以这样理解：


    ![image](img/image83_06.jpg)


    也就是说，1101 代表权重 8,4,2,1 与位 1,1,0,1 的积之和，其结果为整数 13。


