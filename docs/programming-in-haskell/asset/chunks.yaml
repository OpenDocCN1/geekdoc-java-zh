    In Haskell, a `function` is a mapping that takes one or more arguments and produces
    a single result, and is defined using an equation that gives a name for the function,
    a name for each of its arguments, and a body that specifies how the result can
    be calculated in terms of the arguments.


    For example, a function `double` that takes a number `x` as its argument, and
    produces the result `x + x`, can be defined by the following equation:


    ![image](images/image15_01.jpg)


    When a function is applied to actual arguments, the result is obtained by substituting
    these arguments into the body of the function in place of the argument names.
    This process may immediately produce a result that cannot be further simplified,
    such as a number. More commonly, however, the result will be an expression containing
    other function applications, which must then be processed in the same way to produce
    the final result.


    For example, the result of the application `double` `3` of the function `double`
    to the number `3` can be determined by the following calculation, in which each
    step is explained by a short comment in curly parentheses:


    ![image](images/image13_00.jpg)


    Similarly, the result of the nested application `double` (`double` `2`) in which
    the function `double` is applied twice can be calculated as follows:


    ![image](images/image14_00.jpg)


    Alternatively, the same result could also be calculated by starting with the outer
    application of the function `double` rather than the inner:


    ![image](images/image14_01.jpg)


    However, this calculation requires two more steps than our original version, because
    the expression `double` `2` is duplicated in the first step and hence simplified
    twice. In general, the order in which functions are applied in a calculation does
    not affect the value of the final result, but it may affect the number of steps
    required, and may affect whether the calculation process terminates. These issues
    are explored in more detail in [chapter 12](#19_chapter_title_12.html).


    ![](images/line.jpg)


    ## 1.2 Functional programming


    What is functional programming? Opinions differ, and it is difficult to give a
    precise definition. Generally speaking, however, functional programming can be
    viewed as a `style` of programming in which the basic method of computation is
    the application of functions to arguments. In turn, a functional programming language
    is one that `supports` and `encourages` the functional style.


    To illustrate these ideas, let us consider the task of computing the sum of the
    integers (whole numbers) between one and some larger number `n`. In most current
    programming languages, this would normally be achieved using two variables that
    store values that can be changed over time, one such variable used to count up
    to `n`, and the other used to accumulate the total.


    For example, if we use the assignment symbol `:=` to change the value of a variable,
    and the keywords `repeat` and `until` to repeatedly execute a sequence of instructions
    until a condition is satisfied, then the following sequence of instructions computes
    the required sum:


    ![image](images/image15_00.jpg)


    That is, we first initialise both the counter and the total to zero, and then
    repeatedly increment the counter and add this value to the total until the counter
    reaches `n`, at which point the computation stops.


    In the above program, the basic method of computation is changing stored values,
    in the sense that executing the program results in a sequence of assignments.
    For example, the case of `n = 5` gives the following sequence, in which the final
    value assigned to the variable `total` is the required sum:


    ![image](images/table15_01.jpg)


    In general, programming languages in which the basic method of computation is
    changing stored values are called `imperative` languages, because programs in
    such languages are constructed from imperative instructions that specify precisely
    how the computation should proceed.


    Now let us consider computing the sum of the numbers between one and `n` using
    Haskell. This would normally be achieved using two library functions, one called
    `[1..n]` used to produce the list of numbers between one and `n`, and the other
    called `sum` used to produce the sum of this list:


    ![image](images/image17_00.jpg)


    In this program, the basic method of computation is applying functions to arguments,
    in the sense that executing the program results in a sequence of applications.
    For example, the case of `n = 5` gives the following sequence, in which the final
    result is the required sum:


    ![image](images/image15_02.jpg)


    Most imperative languages support some form of programming with functions, so
    the Haskell program `sum [1..n]` could be translated into such languages. However,
    most imperative languages do not `encourage` programming in the functional style.
    For example, many languages discourage or prohibit functions from being stored
    in data structures such as lists, from constructing intermediate structures such
    as the list of numbers in the above example, from taking functions as arguments
    or producing functions as results, or from being defined in terms of themselves.
    In contrast, Haskell imposes no such restrictions on how functions can be used,
    and provides a range of features to make programming with functions both simple
    and powerful.


    ![](images/line.jpg)


    ## 1.3 Features of Haskell


    For reference, the main features of Haskell are listed below, along with the particular
    chapters of this book that give further details.


    - **Concise programs** ([chapters 2](#09_chapter_title_2.html) and [4](#11_chapter_title_4.html))


    Due to the high-level nature of the functional style, programs written in Haskell
    are often much more `concise` than in other languages, as illustrated by the example
    in the previous section. Moreover, the syntax of Haskell has been designed with
    concise programs in mind, in particular by having few keywords, and by allowing
    indentation to be used to indicate the structure of programs. Although it is difficult
    to make an objective comparison, Haskell programs are often two and ten times
    shorter than programs written in other languages.


    - **Powerful type system** ([chapters 3](#10_chapter_title_3.html) and [10](#17_chapter_title_10.html))


    Most modern programming languages include some form of `type system` to detect
    incompatibility errors, such as attempting to add a number and a character. Haskell
    has a type system that requires little type information from the programmer, but
    allows a large class of incompatibility errors in programs to be automatically
    detected prior to their execution, using a sophisticated process called type inference.
    The Haskell type system is also more powerful than current languages, by allowing
    functions to be “polymorphic” and “overloaded”.


    - **List comprehensions** ([chapter 5](#12_chapter_title_5.html))


    One of the most common ways to structure and manipulate data in computing is using
    lists. To this end, Haskell provides lists as a basic concept in the language,
    together with a simple but powerful `comprehension` notation that constructs new
    lists by selecting and filtering elements from one or more lists. Using the comprehension
    notation allows many common functions on lists to be defined in a clear and concise
    manner, without the need for explicit recursion.


    - **Recursive functions** ([chapter 6](#13_chapter_title_6.html))


    Most non-trivial programs involve some form of repetition or looping. In Haskell,
    the basic mechanism by which looping is achieved is by using `recursive` functions
    that are defined in terms of themselves. Many computations have a simple and natural
    definition in terms of recursive functions, particularly when “pattern matching”
    and “guards” are used to separate different cases into different equations.


    - **Higher-order functions** ([chapter 7](#14_chapter_title_7.html))

