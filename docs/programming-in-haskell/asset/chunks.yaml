    ## 第 2 章


    ### 第一步


    在本章中，我们将开始学习 Haskell 的正式第一步。我们首先介绍 Hugs 系统和标准预定义（prelude），然后解释函数应用的符号法，编写我们的第一个
    Haskell 脚本，并通过讨论关于脚本的若干语法约定作为结束。


    ![](img/line.jpg)


    ### 2.1 Hugs 系统


    正如我们在上一章看到的，小型 Haskell 程序可以手动执行。但在实践中，我们通常需要一个能够自动执行程序的系统。在本书中使用一个名为 `Hugs` 的交互式系统，它是最广泛使用的
    Haskell 实现。


    Hugs 的交互特性使其非常教学和原型设计，其性能也足以大多数应用程序。然而，如果需要更高的性能或程序的独立执行版本，也有许多 Haskell 编译器可用，其中最广泛使用的是
    Glasgow Haskell Compiler (GHC)。该编译器也有一个交互版本，其运行方式与 Hugs 类似，可以在本书中方便地替代它。


