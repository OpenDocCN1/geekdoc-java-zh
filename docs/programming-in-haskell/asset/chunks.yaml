    \n![](img/line.jpg)\n\n### 12.1 引言\n\n正如我们在本书中所看到的，Haskell 的基本计算方法是将函数应用于参数。例如，假设我们定义了一个增加整数的函数：\n\
    \n![image](img/image136_00.jpg)\n\n那么表达式 `inc (2 * 3)` 可以按如下方式进行求值：\n\n![image](img/image136_01.jpg)\n\
    \n或者，也可以通过相反 own 执行前两次函数应用得到相同的结果：\n\n![image](img/image136_02.jpg)\n\n改变函数应用的顺序不会影响最终结果，这一事实并非此类简单示例所有，而是\
    \ Haskell 中函数应用的一个重要通用属性。更正式地说，在 Haskell 中，只要任何求值相同表达式的两种不同方式都能终止，它们将始终产生相同的最终值。我们将在章的稍后部分讨论终止问题。\n\
    \n请注意，上述属性并不适用于大多数命令式编程语言，在这些语言中，基本的计算方法是改变存储的值。例如，考虑命令式表达式 `n + (n := 1)`，它将变量\
