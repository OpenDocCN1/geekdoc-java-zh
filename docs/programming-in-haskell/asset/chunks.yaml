    For example, the truth table for conjunction states that *A* ∧ *B* returns *True*
    if both *A* and *B* are *True*, and *False* otherwise. (To save space in such
    tables, we abbreviate the basic values by *F* and *T*.) Using these definitions,
    the truth table for any proposition can then be constructed. In the case of our
    four example propositions, the resulting tables are as follows:


    ![image](images/image117_02.jpg)


    These tables show that the second and fourth propositions are tautologies, because
    their result value is always *True*, while the first and third are not tautologies,
    because their result is *False* in at least one case.


    The first step towards defining a function that decides if a proposition is a
    tautology is to declare a type for propositions, with one constructor for each
    of the five possible forms that a proposition can have:


    ![image](images/image118_00.jpg)


    Note that an explicit constructor for parentheses is not required, as parentheses
    within Haskell itself can be used to indicate grouping. For example, the four
    propositions above can be represented as follows:


    ![image](images/image118_01.jpg)


    In order to evaluate a proposition to a logical value, we need to know the value
    of each of its variables. For this purpose, we declare a *substitution* as a lookup
    table that associates variable names to logical values, using the *Assoc* type
    that was introduced at the start of this chapter:


    ![image](images/image120_05.jpg)


    For example, the substitution [(’A’, *False*), (’B’, *True*)] assigns the variable
    *A* to *False*, and *B* to *True*. A function that evaluates a proposition given
    a substitution for its variables can now be defined by pattern matching on the
    five possible forms that the proposition can have:


    ![image](images/image118_02.jpg)


    For example, the value of a constant proposition is simply the constant itself,
    the value of a variable is obtained by looking up its value in the substitution,
    and the value of a conjunction is given by taking the conjunction of the values
    of the two argument propositions. Note that logical implication ⇒ is implemented
    by the ≤ operator on logical values.


    To decide if a proposition is a tautology, we will consider all possible substitutions
    for the variables that it contains. First of all, we define a function that returns
    the variables in a proposition:


    ![image](images/image119_00.jpg)


    For example, *vars p2* = [’A’, ’B’, ’A’]. Note that this function does not remove
    duplicates, which will be done separately later on.


    The key to generating substitutions is generating lists of logical values of a
    given length. To this end, we seek to define a function *bools* :: *Int* → [[*Bool*]]
    which, for example, will return all eight lists of three logical values:


    ![image](images/image119_01.jpg)


    The order in which the lists are produced is not important. One way to achieve
    this behaviour is to observe that each list corresponds to a binary number, by
    interpreting *False* and *True* as the binary digits 0 and 1\. For example, the
    list [*True*, *False*, *True*] corresponds to the binary number 101. Given this
    interpretation, we can think of the function *bools* as simply counting in binary,
    starting from zero and proceeding upwards to the appropriate limit.


    This idea leads to the following definition for *bools*, in terms of the function
    *int2bin* :: *Int* → [*Bit*] from [chapter 7](#14_chapter_title_7.html), which
    converts a non-negative integer into a binary number represented as a list of
    bits:


    ![image](images/image119_02.jpg)


    There is, however, a simpler way to define *bools*, which can be revealed by thinking
    about the structure of the resulting lists. For example, we can observe that *bools*
    3 contains two copies of *bools* 2, the first preceded by *False* in each case,
    and the second preceded by *True* in each case:


    ![image](images/image120_00.jpg)


    This observation naturally leads to a recursive definition for *bools*. In the
    base case, *bools* 0, we return all lists of zero logical values, of which the
    empty list is the only one. In the recursive case, *bools* (*n* + 1), we take
    two copies of the lists produced by *bools n*, place *False* in front of each
    list in the first copy, *True* in front of each list in the second, and append
    the results:


    ![image](images/image120_01.jpg)


