    \ Haskell 中将函数应用于参数的时间永远不会影响计算结果。尽管如此，正如我们在本章的剩余部分将看到的，关于求的顺序和性质存在重要的实际问题。\n\n\
    ![](img/line.jpg)\n\n### 12.2 求策略\n\n一个形式为函数应用于一个或多个参数、且可以通过执行该应用来“归约”的表达式被称为归约表达式（reducible\
    \ expression），简称为 `redex`。正如前句中使用引号所示，此类归约并不一定会减小表达式的大小，尽管在实践中通常如此。\n\n举例，假设我们定义了一个函数\
