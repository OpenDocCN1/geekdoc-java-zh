    The downside of type safety is that some expressions that evaluate successfully
    will be rejected on type grounds. For example, the conditional expression `if`
    `True` `then` 1 `else` `False` evaluates to the number 1, but contains a type
    error and is hence deemed invalid. In particular, the typing rule for a conditional
    expression requires that both possible results have the same type, whereas in
    this case the first such result, 1, is a number and the second, `False`, is a
    logical value. In practice, however, programmers quickly learn how to work within
    the limits of the type system and avoid such problems.


    In Hugs, the type of any expression can be displayed by preceding the expression
    by the command `:type`. For example:


    ![image](images/image30_01.jpg)


