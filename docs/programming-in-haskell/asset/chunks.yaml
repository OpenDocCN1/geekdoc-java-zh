- fmt: '

    We conclude this chapter with a second extended example, concerning the `game
    of life`. The game models a simple evolutionary system, and is played on a two-dimentional
    board. Each square on the board is either empty, or contains a single living cell,
    as shown in the following example:


    ![image](images/image106_03.jpg)


    Each internal square on the board has eight immediate neighbours:


    ![image](images/image106_04.jpg)


    For uniformity, each square on the edge of the board is also viewed as having
    eight neighbours, by assuming that the board wraps around from top-to-bottom and
    from left-to-right. That is, we can think of the board as really being a torus,
    which can be viewed as the surface of a three-dimensional doughnut shaped object.


    Given an initial configuration of the board, the next `generation` is given by
    simultaneously applying the following rules to all squares:


    • a living cell survives if it has precisely two or three neighbouring squares
    that contain living cells, and dies (becomes empty) otherwise;


    • an empty square gives birth to a living cell if it has precisely three neighbours
    that contain living cells, and remains empty otherwise.


    For example, applying these rules to the above board gives:


    ![image](images/image107_01.jpg)


    By repeating this procedure with the new board, an infinite sequence of generations
    can be produced. By careful design of the initial configuration, many interesting
    patterns of behaviour can be observed in this sequence. For example, the above
    arrangement of cells is called a `glider`, and over successive generations will
    move diagonally down the board.


    Despite its simplicity, the game of life is in fact computationally complete,
    in the sense that any computational process can be simulated within it by means
    of a suitable encoding. In the remainder of this section we show how the game
    of life can be implemented in Haskell.


    To allow the size of the board to be easily modified, we define two integer values
    that determine the width and height of the board in squares:


    ![image](images/image107_00.jpg)


    We represent a board as a list of the (*x*, *y*) positions at which there is a
    living cell, using the same coordinate convention as the screen:


    ![image](images/image109_02.jpg)


    For example, the initial example board above would be represented by:


    ![image](images/image107_02.jpg)


    Using this representation of a board, it is easy to display the living cells on
    the screen, and to decide if a given position is alive or empty:


    ![image](images/image107_03.jpg)


    Next, we define a function that returns the neighbours of a position:


    ![image](images/image107_04.jpg)


    The auxiliary function `wrap` takes account of the wrapping around at the edges
    of the board, by subtracting one from each component of the given position, taking
    the remainder when divided by the width and height of the board, and then adding
    one to each component again:


    ![image](images/image108_00.jpg)


    Using function composition, we can now define a function that calculates the number
    of live neighbours for a given position by producing the list of its neighbours,
    retaining those that are alive, and counting their number:


    ![image](images/image108_01.jpg)


    Using this function, it is then straightforward to produce the list of living
    positions in a board that have precisely two or three living neighbours, and hence
    survive to the next generation:


    ![image](images/image108_02.jpg)


    In turn, the list of empty positions in a board that have precisely three living
