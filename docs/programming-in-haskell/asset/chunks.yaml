    我们用两个小示例来结束本章，让大家领略 Haskell 编程的韵味。首先，回本章之前使用的函数 `sum`，它产生一个数字列表之和。在 Haskell 中，该函数可以使用以下两个方程来定义：


    ![image](img/image21_00.jpg)


    第一个方程表示空列表之和为零，而第二个方程表示任何由第一个数字 `x` 和剩余数字列表 `xs` 组成的非空列表之和，通过将 `x` 与 `xs` 的和相加。例如，`sum`
    [1, 2, 3] 的结果计算如下：


    ![image](img/image19_00.jpg)


    注意，尽管函数 `sum` 是根据自身定义的，因此是递归的，但它不会无限循环。特别地，每次应用 `sum` 都会将参数列表的长度减一，直到列表最终为空，此时递归停止。返回零作为空列表的和是合适的，因为零是加法的
    `identity`（单位元）。即对于任何数字 `x`，`0 + x = x` 且 `x + 0 = x`。


    在 Haskell 中，每个函数都有一个 `type`（类型），指定其参数和结果的性质，该类型是从函数定义中自动推出的。例如，函数 `sum` 具有以下类型：


