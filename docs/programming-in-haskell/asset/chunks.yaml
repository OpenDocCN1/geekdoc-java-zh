    # 第 8 章


    在本章中，我们展示如何使用 Haskell 编写简单的解析器。我们首先解释什么是解析器以及它们为什么有用，展示解析器如何自然地被视为函数，定义一系列基本解析器以及各种方式组合解析器的高阶函数，并最后开发一个算术表达式的解析器。


    ## 8.1 解析器


    *解析器*是一个接收字符字符串并产生某种形式的树的程序，该树显了字符串的语法结构。例如，对于字符串 2 * 3 + 4，表达式解析器可能会产生如下形式的树，其中数字出现在树的叶子上，运算符出现在分支上：


    ![image](img/image86_00.jpg)


    该树的结构显了 + 和 * 是具有两个参数的运算符，并且 * 的优先级比 + 高。

