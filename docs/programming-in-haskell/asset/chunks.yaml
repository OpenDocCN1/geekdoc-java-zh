    *列表*是相同类型*元素*的序列，元素包含在方括号中并用逗号分隔。我们用 `[T]` 表示所有元素类型为 `T` 的列表类型。例如：


    ![image](img/image32_00.jpg)


    列表中的元素个数被称为其*长度*。长度为零的列表 `[]` 称为空列表，而长度为一的列表如 `[False]` 和 `[''a]` 称为单元列表。注意 `[[]]`
    和 `[]` 是不同的列表，前者是一个包含空列表作为唯一元素的单元列表，后者仅仅是空列表。


    关于列表类型还有三点需要注意。首先，列表的类型不传递任何关于其长度的信息。例如，列表 `[False, True]` 和 `[False, True, False]`
    的类型都是 `[Bool]`，尽管它们的长度不同。其次，列表元素的类型没有限制。目前我们能给出的示例范围受到限制，因为到目前为止引入的唯一非基础类型是列表类型，但我们可以拥有列表的列表，例如：


