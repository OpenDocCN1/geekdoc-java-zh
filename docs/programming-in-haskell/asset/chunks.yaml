    recursive. If required, recursive types can be declared using the more powerful
    **data** mechanism, which will be introduced shortly.


    Type declarations can also be parameterised by other types. For example, in the
    previous two chapters we declared the following types for parsers and interactive
    programs in terms of a type parameter:


    ![image](images/image112_00.jpg)


    Declarations with more than one type parameter are also permitted. For example,
    a type of lookup tables that associate keys of one type to values of another type
    can be declared as a list of (key, value) pairs:


    ![image](images/image114_03.jpg)


    Using this type, a function that returns the first value that is associated with
    a given key in a table can then be defined as follows:


    ![image](images/image112_01.jpg)


    ![](images/line.jpg)


    10.2 Data declarations


    A completely new type, as opposed to a synonym for an existing type, can be declared
    by specifying its values using the **data** mechanism of Haskell. For example,
    the following declaration from the standard library states that the type *Bool*
    comprises two new values, named *False* and *True*:


    ![image](images/image114_04.jpg)


    In such declarations, the symbol | is read as “or”, and the new values of the
    type are called *constructors*. As with new types themselves, the names of new
    constructors must begin with a capital letter. Moreover, the same constructor
    name cannot be used in more than one type.


    Note that the names given to new types and constructors have no inherent meaning
    to the Hugs system. For example, the above declaration could equally well be written
    as **data** *A* = *B* | *C*, because the precise details of the names are not
    relevant, other than the fact that they have not been used before. The meaning
    of names such as *Bool*, *False*, and *True* is assigned by the programmer, via
    the functions that they define on new types.


    Values of new types can be used in precisely the same way as those of built-in
    types. In particular, they can freely be passed as arguments to functions, returned
    as results from functions, stored in data structures such as lists, and used in
    patterns. For example, given the declaration


    ![image](images/image114_05.jpg)


    functions that apply a move to a position (recalling that positions are relative
    to the top-left corner of the screen), apply a list of moves to a position, and
    flip the direction of a move, can be defined as follows:


    ![image](images/image113_00.jpg)


    The constructors in a data declaration can also have arguments. For example, a
    type of shapes that comprise circles with a given radius, and rectangles with
    given dimensions can be declared by:


    ![image](images/image115_05.jpg)


    That is, the type *Shape* has values of the form *Circle r*, where *r* is a floating-point
    number, and *Rect x y*, where *x* and *y* are floating-point numbers. These constructors
    can then be used to define functions on shapes, such as to produce a square of
    a given size, and to calculate the area of a shape:


    ![image](images/image113_01.jpg)


    Because of their use of arguments, the constructors *Circle* and *Rect* are actually
    constructor functions, which produce results of type *Shape* from arguments of
    type *Float*, as can be demonstrated using Hugs:


    ![image](images/image115_06.jpg)


    The difference between normal functions and constructor functions is that the
    latter have no defining equations, and exist solely for the purpose of building
    pieces of data. For example, whereas the expression *negate* 1.0 can be evaluated
    to −1.0 by applying the definition of *negate*, the expression *Circle* 1.0 is
    already fully evaluated, and hence cannot be further simplified, because there
    are no defining equations for *Circle*. Rather, the expression *Circle* 1.0 is
    just a piece of data, in the same way that 1.0 itself is just data.


    Not surprisingly, data declarations themselves can also be parameterised. For
    example, the standard library declares the following type:


    ![image](images/image115_07.jpg)


    That is, a value of type *Maybe a* is either *Nothing*, or of the form *Just x*
    for some value *x* of type *a*. We can think of values of type *Maybe a* as being
    values of type *a* that may fail, with *Nothing* representing failure, and *Just*
    representing success. For example, using this type we can define safe versions
    of the library functions *div* and *head*, which return *Nothing* in the case
    of invalid arguments, rather than producing an error:


    ![image](images/image114_00.jpg)


    ![](images/line.jpg)


    10.3 Recursive types


    Types declared using the data mechanism can also be recursive. By way of a simple
    first example, consider the following recursive type:


    ![image](images/image116_05.jpg)


    That is, a value of type *Nat* is either *Zero*, or of the form *Succ n* for some
    value *n* of type *Nat*. Hence, this declaration gives rise to an infinite sequence
    of values, starting with the value *Zero*, and continuing by applying the constructor
    function *Succ* to the previous value in the sequence:


    ![image](images/image114_01.jpg)


    As suggested by the choice of names, values of type *Nat* can be thought of as
    natural numbers (non-negative integers), with *Zero* representing the natural
    number 0 and *Succ* representing the successor function 1+ on such numbers. For
    example, *Succ* (*Succ* (*Succ Zero*)) represents 1 + (1 + (1 + 0)) = 3\. More
    formally, we can define the following conversion functions:


    ![image](images/image114_02.jpg)


    For example, using these functions, two natural numbers can be added together
    by first converting them into integers, adding these integers, and then converting
    the result back into a natural number:


    ![image](images/image115_00.jpg)


    However, using recursion the function *add* can be redefined without the need
    for such conversions, and hence more efficiently:


    ![image](images/image115_01.jpg)


    This definition formalises the idea that two natural numbers can be added by copying
    *Succ* constructors from the first number until they are exhausted, at which point
    the *Zero* at the end is replaced by the second number. For example, showing that
    2 + 1 = 3 proceeds as follows:


    ![image](images/image115_02.jpg)


    As another example, the data mechanism can be used to declare our own version
    of the built-in type of lists, parameterised by an arbitrary type:


    ![image](images/image117_03.jpg)


    That is, a value of type *List a* is either *Nil*, representing the empty list,
    or of the form *Cons x xs* for some values *x* :: *a* and *xs* :: *List a*, representing
    a non-empty list. Using this type, we can then also define our own versions of
    library functions on lists, such as to calculate the length of a list:


    ![image](images/image115_03.jpg)


    While lists are perhaps the most commonly used data structure in computing, it
    is often useful to store data in a two-way branching structure, or *binary tree*,
    as depicted in the following example:


    ![image](images/image115_04.jpg)


    In this example, the numbers 1, 4, 6, 9 appear at the external *leaves* of the
    tree, and the numbers 5, 3, 7 appear at the internal *nodes*. Using recursion,
    a suitable type for representing such trees can be declared by:


    ![image](images/image117_04.jpg)'
