    As in this example, the name of a new type must begin with a capital letter. Type
    declarations can be nested, in the sense that one such type can be declared in
    terms of another. For example, in the previous chapter a type for boards was declared
    in terms of a type for positions:


    ![image](images/image111_00.jpg)


    For technical reasons, however, type declarations cannot be recursive. For example,
    consider the following erroneous declaration:


    ![image](images/image113_03.jpg)


    That is, a tree is a pair comprising an integer and a list of subtrees. While
    this declaration is perfectly reasonable, with the empty list of subtrees forming
    the base case for the recursion, it is not permitted in Haskell because it is
    recursive. If required, recursive types can be declared using the more powerful
    `data` mechanism, which will be introduced shortly.


    Type declarations can also be parameterised by other types. For example, in the
    previous two chapters we declared the following types for parsers and interactive
    programs in terms of a type parameter:


    ![image](images/image112_00.jpg)


    Declarations with more than one type parameter are also permitted. For example,
    a type of lookup tables that associate keys of one type to values of another type
    can be declared as a list of (key, value) pairs:


    ![image](images/image114_03.jpg)


    Using this type, a function that returns the first value that is associated with
    a given key in a table can then be defined as follows:


    ![image](images/image112_01.jpg)


