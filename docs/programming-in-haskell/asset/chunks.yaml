    ## 13.6 使连接消失


    许多递归函数自然地使用列表的连接操作符 `++` 定义，但该操作符在递归使用时会带来巨大的效率代价。在本节中，我们将展示如何利用归纳法来消除此类对连接的使用，从而使函数更高效。作为第一个例子，再次考虑以下定义：


    ![image](img/image159_00.jpg)


    `reverse` 的效率如何？首先，很容易证明评估 `xs ++ ys` 所需的归约步骤比 `xs` 的长度多一（假设 `xs` 和 `ys` 已经经过完全求值）。因此，我们说
    `++` 消耗的时间与其第一个参数的长度呈线性关系。相应，对于长度为 `n` 的列表，`reverse xs` 所需的步骤数可以是从 1 到 `n + 1`
    的整数之和，即 `(n + 1)(n + 2)/2`。使用在本章开头验证的方程展开括号，得到 `(n² + 3n + 2)/2`，根据结果，我们说 `reverse`
    消耗的时间与其参数的长度呈平方关系。


    平方级时间是非常糟糕的。例如，反转一个包含一万个元素的列表大约需要五千万次归约步骤。幸运的是，通过使用归纳法，很容易消除 `reverse` 定义中对连接的使用，从而提高其效率。


    诀窍在于尝试定义一个更通用的函数，该函数结合了 `reverse` 和 `++` 的行为。特别是，我们寻求定义一个满足以下方程的递归函数 `reverse′`：


    ![image](img/image161_04.jpg)


    也就是说，对两个列表应用 `reverse′` 应该得到第一个列表反转后与第二个列表连接在一起的结果。如果我们能定义这样的函数，就可以利用空列表是连接的恒元的这一事实，将
    `reverse` 重新定义为 `reverse xs = reverse′ xs []`。


    与其给出 `reverse′` 的定义然后证明它满足上述方程，我们实际上可以使用该方程作为构建定义本身的驱动力。特别是，我们只需尝试通过对 `xs` 进行归纳来验证这个方程。基础情况产生一个给出
    `reverse′ [] ys` 定义的方程，而归纳情况产生一个给出 `reverse′ (x : xs) ys` 定义的方程。


    ### 基础情况


    ![image](img/image159_01.jpg)


    ### 归纳情况


