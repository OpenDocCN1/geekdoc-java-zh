    定义的无穷。类似的注释也适用于在本章中考虑的所有其他递归类型。


    现在假设我们想要证明某个属性（假设为 `p`）适用于所有（有限）自然数。那么归纳原理规定，证明 `p` 对于 `Zero` 成立（称为*基准情况*），并且
    `p` 被 `Succ` 保持（称为*归纳情况*）就足够了。更准确地说，在归纳情况中，需要证明如果属性 `p` 对于任何自然数 `n`（称为*归纳假设*）成立，那么它对于
    `Succ n` 也成立。


    为什么归纳法足以证明 `p` 对于所有自然数都成立？例如，这如何推导出 `p` 对于 `Succ (Succ Zero)` 成立呢？从 `p` 对于 `Zero`
    成立的基准情况开始，我们可以应用一次归纳情况，通过取 `n = Zero` 结论 `p` 对于 `Succ Zero` 成立，然后再次应用归纳情况，通过取
    `n = Succ Zero` 结论 `p` 对于 `Succ (Succ Zero)` 成立。类似地，可以建立 `p` 对于任何自然数都成立。


