    (The symbol `''\n’` represents a newline character.) Dually, we define actions
    `putStr` and `putStrLn` that write a string to the screen, with the latter action
    also moving on to a new line afterwards:


    ![image](images/image102_02.jpg)


    For example, using these primitives we can now define an action that prompts for
    a string to be entered from the keyboard, and then displays its length:


    ![image](images/image102_03.jpg)


    For example:


    ![image](images/image105_06.jpg)


    In addition to the library primitives defined above, for the purposes of examples
    in the remainder of this chapter it is also useful to define a number of other
    primitives. First of all, we define actions that sound a beep and clear the screen,
    by displaying the appropriate control characters:


    ![image](images/image103_00.jpg)


    By convention, the position of each character on the screen is given by a pair
    `(x, y)` of positive integers, with (1, 1) being the top-left corner. The notion
    of such a position can be represented by the following type:


    ![image](images/image105_07.jpg)


    Using the appropriate control characters, we can now define a function that moves
