    Finally, sections are also necessary when using operators as arguments to other
    functions. For example, the library function `*and*` that decides if all logical
    values in a list are `True` is defined by using the operator `∧` as an argument
    to the library function `foldr`, which is itself discussed in [chapter 7](#14_chapter_title_7.html):


