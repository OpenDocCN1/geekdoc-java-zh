    ## 5.4 String comprehensions


    Up to this point we have viewed strings as a primitive notion in Haskell. In fact
    they are not primitive as such, but are actually constructed as lists of characters.
    For example, "abc" :: `String` is just an abbreviation for [’a’, ’b’, ’c’] ::
    [*Char`]. Because strings are just special kinds of lists, any polymorphic function
    on lists can also be used with strings. For example:


    ![image](images/image56_04.jpg)


    For the same reason, list comprehensions can also be used to define functions
    on strings, such as functions that return the number of lower-case letters and
    particular characters that occur in a string, respectively:


    ![image](images/image54_00.jpg)


    For example:


