    ## 10.5 Abstract machine


    As a second extended example, consider a type of simple arithmetic expressions
    built up from integers using an addition operator, together with a function that
    evaluates such an expression to an integer value:


    ![image](images/image121_00.jpg)


    For example, the expression `(2 + 3) + 4` is evaluated as follows:


    ![image](images/image121_01.jpg)


    Note that the definition of the `value` function does not specify that the left
    argument of an addition should be evaluated before the right, or, more generally,
    what the next step of evaluation should be at any point. Rather, the order of
    evaluation is determined by Haskell. If desired, however, such control information
    can be made explicit by defining an `abstract machine` for expressions, which
    specifies the step-by-step process of their evaluation.


    To this end, we first declare a type of `control stacks` for the abstract machine,
    which comprise a list of operations to be performed by the machine after the current
    evaluation has been completed:


    ![image](images/image121_02.jpg)


    The meaning of the two operations will be explained shortly. We now define a function
    that evaluates an expression in the context of a control stack:


    ![image](images/image122_00.jpg)


    That is, if the expression is an integer, it is already fully evaluated, and we
    begin executing the control stack. If the expression is an addition, we evaluate
    the first argument, `x`, placing the operation `EVAL y` on top of the control
    stack to indicate that the second argument, `y`, should be evaluated once that
    of the first argument is completed. In turn, we define the function that executes
    a control stack in the context of an integer argument:


    ![image](images/image122_01.jpg)


    That is, if the stack is empty, we return the integer argument as the result of
    the execution. If the top of the stack is an operation `EVAL y`, we evaluate the
    expression `y`, placing the instruction `ADD n` on top of the remaining stack
    to indicate that the current integer argument, `n`, should be added together with
    the result of evaluating `y` once this is completed. And, finally, if the top
    of the stack is an operation `ADD n`, evaluation of the two arguments of an addition
    is now complete, and we execute the remaining control stack in the context of
    the sum of the two resulting integer values.


    Finally, we define a function that evaluates an expression to an integer, by invoking
    `eval` with the given expression and the empty control stack:


    ![image](images/image122_02.jpg)


    The fact that our abstract machine uses two mutually recursive functions, `eval`
    and `exec`, reflects the fact that it has two states, depending upon upon it is
    being driven by the structure of the expression or the control stack. To illustrate
    the machine, here is how it evaluates `(2 + 3) + 4`:


    ![image](images/image123_00.jpg)


    Note how `eval` proceeds downwards to the leftmost integer in the expression,
    maintaining a trail of the pending right-hand expressions on the control stack.
    In turn, `exec` then proceeds upwards through the trail, transferring control
    back to `eval` and performing additions as appropriate.


    ![](images/line.jpg)


    ## 10.6 Class and instance declarations


    We now turn our attention from types to classes. In Haskell, a new class can be
    declared using the `class` mechanism. For example, the class `Eq` of equality
    types is declared in the standard library as follows:


    ![image](images/image123_01.jpg)


    This declaration states that for a type `a` to be an instance of the class `Eq`,
    it must support equality and inequality operators of the specified types. In fact,
    because a `default definition` has already been included for `≠`, declaring an
    instance of this class only requires a definition for `==`. For example, the type
    `Bool` can be made into an equality type as follows:


    ![image](images/image123_02.jpg)


    For technical reasons, only types declared using the `data` mechanism can be made
    into instances of classes. Note also that default definitions can be overridden
    in instance declarations if desired. For example, for some equality types there
    may be a more efficient or appropriate way to decide if two values are different
    than simply checking if they are not equal.


    Classes can also be extended to form new classes. For example, the class `Ord`
    of types whose values are totally ordered is declared in the standard library
    as an extension of the class `Eq` as follows:


    ![image](images/image124_00.jpg)


    That is, for a type to be an instance of `Ord` it must be an instance of `Eq`,
    and support six additional operators. Because default definitions have already
    been included for `min` and `max`, declaring an equality type (such as `Bool`)
    as an ordered type only requires defining the four comparison operators:


    ![image](images/image124_01.jpg)


    ### Derived instances


    When new types are declared, it is usually appropriate to make them into instances
    of a number of built-in classes. Haskell provides a simple facility for automatically
    making new types into instances of the classes `Eq`, `Ord`, `Show`, and `Read`,
    in the form of the `deriving` mechanism. For example, the type `Bool` is actually
    declared in the standard library as follows:


    ![image](images/image124_02.jpg)


    As a result, all the member functions from the derived classes can then be used
    with logical values. For example:


    ![image](images/image126_03.jpg)


    The use of `::` in the last example is required to resolve the type, which cannot
    be inferred from the context.


    In the case of constructors with arguments, the types of these arguments must
    also be instances of any derived classes. For example, recall the following declarations
    from earlier in this chapter:


    ![image](images/image125_00.jpg)


    To derive `Shape` as an equality type requires that the type `Float` is also an
    equality type, which is indeed the case. Similarly, to derive `Maybe a` as an
    equality type requires that the type `a` is also such a type, which then becomes
    a class constraint on this parameter. In the same manner as lists and tuples,
    values built using constructors are ordered lexicographically. For example, if
    `Shape` is derived as an ordered type, then we have:


    ![image](images/image127_00.jpg)


    ### Monadic types


    We conclude this chapter by returning once again to parsers and interactive programs,
    the subjects of the previous two chapters. As the reader may recall, the functions
    `return` and `>>=` were defined for both parsers,


    ![image](images/image125_01.jpg)


    and interactive programs:


    ![image](images/image125_02.jpg)


    The use of the same function names and analogous types is not coincidental. In
    particular, generalising from the specific cases of `Parser` and `IO` to an arbitrary
    parameterised type gives the notion of a `monad`, which in Haskell is captured
    by the following class declaration:


    ![image](images/image125_03.jpg)


    That is, a monad is a parameterised type `m` that supports `return` and `>>=`
    functions of the specified types. The fact that `m` must be a parameterised type,
    rather than just a type, is inferred from its use in the types for the two functions.
    Using this declaration, parsers and interactive programs can then be made into
    instances of the class of monadic types, by defining the two member functions
    in the appropriate manner:


    ![image](images/image126_00.jpg)

