    ![image](img/image115_05.jpg)


    也就是说，类型 `Shape` 具有形式为 `Circle r` 的值（其中 `r` 是浮点数）和 `Rect x y` 的值（其中 `x` 和 `y` 是浮点数）。这些构造函数可以被用于定义关于形状的函数，例如生成给定尺寸的正方形，以及计算形状的面积：


    ![image](img/image113_01.jpg)


