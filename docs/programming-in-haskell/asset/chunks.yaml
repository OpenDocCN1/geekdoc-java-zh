    ## Recursive functions


    In this chapter we introduce recursion, the basic mechanism for looping in Haskell.
    We start with recursion on integers, then extend the idea to recursion on lists,
    consider multiple arguments, multiple recursion, and mutual recursion, and conclude
    with some advice on defining recursive functions.


    ![](images/line.jpg)


    ### 6.1 Basic concepts


    As we have seen in previous chapters, many functions can naturally be defined
    in terms of other functions. For example, a function that returns the `factorial`
    of a non-negative integer can be defined by using library functions to calculate
    the product of the integers between one and the number itself:


    ![image](images/image60_00.jpg)


    In Haskell, it is also permissible to define functions in terms of themselves,
    in which case the functions are called `recursive`. For example, the `factorial`
    function can be defined in this manner as follows:


    ![image](images/image60_01.jpg)


    The first equation states that the factorial of zero is one, and is called a `base
    case`. The second equation states that the factorial of any strictly positive
    integer is the product of that number and the factorial of its predecessor, and
    is called a `recursive case`. For example, the following calculation shows how
    the factorial of three is computed using this definition:


    ![image](images/image60_02.jpg)


    Note that even though the `factorial` function is defined in terms of itself,
    it does not loop forever. In particular, each application of `factorial` reduces
    the integer argument by one, until it eventually reaches zero at which point the
    recursion stops and the multiplications are performed. Returning one as the factorial
    of zero is appropriate because one is the identity for multiplication. That is,
    `1 * x = x` and `x * 1 = x` for any integer `x`.


    For the case of the `factorial` function, the original definition using library
    functions is simpler than the definition using recursion. However, as we shall
    see in the remainder of this book, many functions have a simple and natural definition
    using recursion. For example, many of the library functions in Haskell are defined
    in this way. Moreover, as we shall see in [chapter 13](#20_chapter_title_13.html),
    defining functions using recursion also allows properties of those functions to
    be proved using the powerful technique of induction.


    As another example of recursion on integers, consider the multiplication operator
    `*` used above. For efficiency reasons, this operator is provided as a primitive
    in Haskell. However, for non-negative integers it can also be defined using recursion
    on either of its arguments, such as the second:


    ![image](images/image61_01.jpg)


    For example:


    ![image](images/image61_02.jpg)


    That is, the recursive definition for the `*` operator formalises the idea that
    multiplication can be reduced to repeated addition.


