    3.14159 这样的“浮点”数字。因此，例如 `sum` 可以应用于整数列表，也可以应用于浮点列表。


    类型提供了关于函数性质的有用信息，更重要的是，它们的使用可以在执行程序之前自动检测程序中的许多错误。特别是对于程序中的每次函数应用，都会检查参数的类型是否与函数类型兼容。例如，尝试将
