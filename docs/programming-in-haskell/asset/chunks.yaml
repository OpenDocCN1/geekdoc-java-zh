    # Example – `drop`


    As a more substantial example, we now show how the definition given earlier for
    the library function `drop` that removes a given number of elements from the start
    of a list can be constructed using the five-step process.


    ## Step 1: define the type


    Let us begin with a type that states that `drop` takes an integer and a list of
    values of some type `a`, and produces another list of such values:


    ![image](images/image70_05.jpg)


    Note that we have made four decisions in defining this type: using integers rather
    than a more general numeric type, for simplicity; using currying rather than taking
    the arguments as a pair, for flexibility (see [section 3.6](#10_chapter_title_3.html_pg-33-56));
    supplying the integer argument before the list argument, for readability (`drop
    n xs` can be read as “drop `n` elements from `xs`”); and, finally, making the
    function polymorphic in the type of the list elements, for generality.


    ## Step 2: enumerate the cases


    As there are two standard cases for the integer argument (0 and `n` + 1) and two
    for the list argument (`[]` and `x` : `xs`), writing down a skeleton definition
    using pattern matching requires four cases in total:


    ![image](images/image69_00.jpg)


    ## Step 3: define the simple cases


    By definition, removing zero elements from the start of any list gives the same
    list, so it is straightforward to define the first two cases:


    ![image](images/image69_01.jpg)


    Attempting to removing one or more elements from the empty list is invalid, so
    the third case could be omitted, which would result in an error being produced
    if this situation arises. In practice, however, we choose to avoid the production
    of an error by returning the empty list in this case:


    ![image](images/image69_02.jpg)


    ## Step 4: define the other cases


    How can we remove one or more elements from a non-empty list? By simply removing
    one less element from the tail of the list:


    ![image](images/image69_03.jpg)


    ## Step 5: generalise and simplify


    Because the function `drop` does not depend on the precise kind of integers to
    which it is applied, its type can be generalised to any integral type, of which
    `Int` and `Integer` are the standard instances:


    ![image](images/image71_02.jpg)


    For efficiency reasons, however, this generalisation is not in fact made in the
    standard prelude, as noted in [section 3.9](#10_chapter_title_3.html_pg-36-70).
    In terms of simplification, the first two equations for `drop` can be combined
    into a single equation that states that removing zero elements from any list gives
    the same list:


    ![image](images/image69_04.jpg)


    Moreover, the variable `x` in the last equation can be replaced by the wildcard
    pattern `_`, because this variable is not used in the body of the equation:


    ![image](images/image70_00.jpg)


    We might similarly expect `n` in the second equation to be replaced by `_`, but
    this would make the definition invalid, because patterns of the form `n` + `k`
    require that `n` is a variable. This constraint could be avoided by replacing
    the entire pattern `n` + 1 in the second equation by `_`, but this would change
    the behaviour of the function. For example, evaluating `drop (-1) []` would then
    produce the empty list whereas it currently produces an error, because `_` can
    match any integer whereas `n` + 1 only matches integers ≥ 1.


    In conclusion, our final definition for `drop` is as follows, which is precisely
    the definition from the standard prelude in [appendix A](#21_appendix_title.html):


    ![image](images/image70_01.jpg)


