    然而，这种定义考虑了棋盘上的所有可能位置。一种更精细的方法（对于较大的棋盘可能更高）是只考虑棋盘上活细胞的邻居，因为只有这些位置才可能产生新的生命。使用这种方法，函数`births`可以重写为如下：


    ![image](img/image108_04.jpg)


    辅助函数`rmdups`删除列表中的重复项，在上面被用于确保每个潜在的新细胞只被考虑一次：


    ![image](img/image108_05.jpg)


    现在只需简单地附加幸存者列表和新出生细胞列表，即可产生棋盘的下一代：


    ![image](img/image108_06.jpg)


    最后，我们定义了一个`life`函数来实现生命游戏本身，其过程为：清除屏幕、显示当前棋盘中的活细胞、等待片，然后继续下一代：


    ![image](img/image109_00.jpg)


    `wait`函数用于将游戏减慢到合理的速度，可以通过执行给定数量的虚假动作来实现：


    ![image](img/image109_01.jpg)


