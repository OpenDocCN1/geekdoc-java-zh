    # Chapter 9


    ## Interactive programs


    In this chapter we show how Haskell can be used to write interactive programs.
    We start by explaining what interactive programs are, show how such programs can
    naturally be viewed as functions, define a number of basic interactive programs
    and higher-order functions for combining interactive programs, and conclude by
    developing a calculator and the game of life.


    ![](images/line.jpg)


    ### 9.1 Interaction


    A `batch` program is one that does not interact with the user while it is running.
    In the early days of computing, most programs were batch programs, run in isolation
    from their users in order to maximise the amount of time that the computer was
    performing useful work. For example, a route-planning program may take start and
    finish points as its input, silently perform a large number of calculations, and
    then produce a recommended route as its output.


    Up to this point in the book we have considered how Haskell can be used to write
    batch programs. In Haskell such programs, and more generally all programs, are
    modelled as `pure` functions that take all their input as explicit arguments,
    and produce all their output as explicit results. For example, a route planner
    may be modelled as a function of type `(Point, Point) → Route` that takes a pair
    of points and produces a route between them.


    In contrast, an `interactive` program is one that may take additional input from
    the user, and produce additional output for the user, while the program is running.
    In the modern era of computing, most programs are interactive programs, run as
    a dialogue with their users in order to provide increased flexibility. For example,
    a calculator program may allow the user to enter numeric expressions interactively
    using the keyboard, and immediately display the value of such expressions on the
    screen.


    At first sight, modelling interactive programs as pure functions may seem infeasible,
    because such programs by their very nature require the `side effects` of taking
    additional input and producing additional output while the program is running.
    For example, how can the calculator program described above be viewed as a pure
    function from arguments to results?


    Over the years there have been many proposed solutions to the problem of combining
    the notion of pure functions with that of side effects. In the remainder of this
    chapter we present the solution that is adopted in Haskell, which is based upon
    the use of a new type in conjunction with a small number of primitives. As we
    shall see, this approach shares much in common with the approach to parsers presented
    in the previous chapter.


    ![](images/line.jpg)


    ### 9.2 The input/output type


    In Haskell, an interactive program is viewed as a pure function that takes the
    current “state of the world” as its argument, and produces a modified world as
    its result, in which the modified world reflects any side effects performed by
    the program. Hence, given a suitable type `World` whose values represent the current
    state of the world, the notion of an interactive program can be represented by
    a function of type `World → World`, which we abbreviate as `IO` (short for “input/output”)
    as follows:


    ![image](images/102_04.jpg)


    In general, however, an interactive program may return a result value in addition
    to performing side effects. For example, a program for reading a character from
    the keyboard may return the character that was. For this reason, we generalise
    our type for interactive programs to also return a result value, with the type
    of such values being a parameter of the `IO` type:


    ![image](images/102_05.jpg)


    Expressions of type `IO a` are called `actions`. For example, `IO Char` is the
    type of actions that return a character, while `IO ()` is the type of actions
    that return the empty tuple `()` as a dummy result value. Actions of the latter
    type can be thought of as purely-effecting actions that return no result value,
    and are frequently used when writing interactive programs.


    In addition to returning a result value, interactive programs may also require
    argument values. However, there is no need to generalise the type of actions to
    take account of this, because this behaviour can already be achieved by exploiting
    currying. For example, an interactive program that takes a character and returns
    an integer would have type `Char → IO Int`, which abbreviates the curried function
    type `Char → World → (Int, World)`.


    At this point the reader may, quite understandably, be concerned about the feasibility
    of passing around the entire state of the world when programming with actions.
    In reality, Haskell systems such as Hugs implement actions in a more efficient
    manner than described above, but, for the purposes of understanding the behaviour
    of actions, this abstract view will suffice.


    ![](images/line.jpg)


    ### 9.3 Basic actions


    We now introduce three basic actions for building interactive programs. First
    of all, the action `getChar` reads a character from the keyboard, echoes it to
    the screen, and returns the character as its result value:


    ![image](images/101_00.jpg)


    The actual definition for `getChar` is built-in to the Hugs system, and cannot
    be defined within Haskell itself. If there are no characters waiting to be read
    from the keyboard, `getChar` waits until one is typed.

