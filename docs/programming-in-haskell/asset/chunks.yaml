    Parsers are an important topic in computing, because most real-life programs use
    a parser to pre-process their input. For example, a calculator program parses
    numeric expressions prior to evaluating them, the Hugs system parses Haskell programs
    prior to executing them, and a web browser parses hypertext documents prior to
    displaying them. In each case, making the structure of the input explicit considerably
    simplifies its further processing. For example, once a numeric expression has
    been parsed into a tree structure such as in the example above, evaluating the
    expression is straightforward.


    ![](images/line.jpg)


    ## 8.2 The parser type


    In Haskell, a parser can naturally be viewed directly as a function that takes
    a string and produces a tree. Hence, given a suitable type `Tree` of trees, the
    notion of a parser can be represented as a function of type `String` → `Tree`,
    which we abbreviate as `Parser` using the following declaration:


    ![image](images/image89_03.jpg)


    In general, however, a parser might not always consume its entire argument string.
    For example, a parser for numbers might be applied to a string comprising a number
    followed by a word. For this reason, we general general our type for parsers to
    also return any unconsumed part of the argument string:


    ![image](images/image89_04.jpg)


    Similarly, a parser might not always succeed. For example, a parser for numbers
    might be applied to a string comprising a word. To handle this, we further generalise
    our type for parsers to return a list of results, with the convention that the
    empty list denotes failure, and a singleton list denotes success:


    ![image](images/image89_05.jpg)


    Returning a list also opens up the possibility of returning more than one result
    if the argument string can be parsed in more than one way. For simplicity, however,
    we only consider parsers that return at most one result.


    Finally, different parsers will likely return different kinds of trees, or more
    generally, any kind of value. For example, a parser for numbers might return an
    integer value. Hence, it is useful to abstract from the specific type `Tree` of
    result values, and make this into a parameter of the `Parser` type:


    ![image](images/image89_06.jpg)


    In summary, this declaration states that a parser of type `a` is a function that
    takes an input string and produces a list of results, each of which is a pair
    comprising a result value of type `a` and an output string. Alternatively, the
    parser type can also be read as a rhyme in the style of Dr Seuss!


    *A parser for things


    Is a function from strings


    To lists of pairs


    Of things and strings*


    ![](images/line.jpg)


    ## 8.3 Basic parsers


    We now define three basic parsers that will be used as the building blocks for
    all other parsers. First of all, the parser `return v` always succeeds with the
    result value `v`, without consuming any of the input string:


    ![image](images/image89_07.jpg)


    This function could equally well be defined by `return v inp` = [`(`v`, `inp`)`].
    However, we prefer the above definition in which the second argument `inp` is
    shunted to the body of the definition using a lambda expression, because it makes
    explicit that `return` is a function that takes a single argument and returns
    a parser, as expressed by the type `a` → `Parser a`.


    Whereas `return v` always succeeds, the dual parser `failure` always fails, regardless
    of the contents of the input string:


    ![image](images/image88_00.jpg)


    Our final basic parser is `item`, which fails if the input string is empty, and
    succeeds with the first character as the result value otherwise:


    ![image](images/image88_01.jpg)


    The `case` mechanism of Haskell used in this definition allows pattern matching
    to be used in the body of a definition, in this example by matching the string
    `inp` against two patterns to choose between two possible results. The `case`
    mechanism is not used much in this book, but can sometimes be useful.


    Because parsers are functions, they could be applied to a string using normal
    function application, but we prefer to abstract from the representation of parsers
    by defining our own application function:


    ![image](images/image88_02.jpg)


    Using `parse`, we conclude this section with some examples that illustrate the
    behaviour of the three basic parsers defined above:


    ![image](images/image90_02.jpg)


    ![](images/line.jpg)


    ## 8.4 Sequencing


    Perhaps the simplest way of combining two parsers is to apply one after the other
    in sequence, with the output string returned by the first parser becoming the
    input string to the second. But how should the result values from the two parsers
    be handled? One approach would be to combine the two values as a pair, using a
    sequencing operator for parsers with the following type:


    ![image](images/image91_02.jpg)


    In practice, however, it turns out to be more convenient to combine the sequencing
    of parsers with the processing of their result values, by means of a sequencing
    operator `>>=` (read as “then”) defined as follows:


    ![image](images/image89_00.jpg)


    That is, the parser `p`>>=` `f` fails if the application of the parser `p` to
    the input string fails, and otherwise applies the function `f` to the result value
    to give a second parser, which is then applied to the output string to give the
    final result. In this manner, the result value produced by the first parser is
    made directly available for processing by the second.


    A typical parser built using `>>=` has the following structure:


    ![image](images/image91_03.jpg)


    That is, apply the parser `p1` and call its result value `v1`; then apply the
    parser `p2` and call its result value `v2`; . .*; apply the parser `pn` and call
    its result value `vn`; and, finally, combine all the results into a single value
    by applying the function `f`. Haskell provides a special syntax for such parsers,
    allowing them to be expressed in the following, more appealing, form:


    ![image](images/image89_01.jpg)


    As with list comprehensions, the expressions `vi` ← `pi` are called generators.
    If the result value produced by a generator `vi` ← `pi` is not required, the generator
    can be abbreviated simply by `pi`. Note also that the layout rule applies to **do**
    notation for sequencing parsers, in the sense that each parser in the sequence
    must begin in the same column.


    For example, a parser that consumes three characters, discards the second, and
    returns the first and third as a pair can now be defined as follows:


    ![image](images/image89_02.jpg)


    Note that `p` only succeeds if every parser in its defining sequence succeeds,
    which requires at least three characters in the input string:


    ![image](images/image92_02.jpg)


    ![](images/line.jpg)


    ## 8.5 Choice


    Another natural way of combining two parsers is to apply the first parser to the
    input string, and if this fails to apply the second instead. Such a choice operator
    `+++` (read as “or else”) can be defined as follows:


    ![image](images/image90_00.jpg)


    For example:


    ![image](images/image92_03.jpg)


    ![](images/line.jpg)


    ## 8.6 Derived primitives


    Using the three basic parsers together with sequencing and choice, we can now
    define a number of other useful primitives. First of all, we define a parser `sat
    p` for single characters that satisfy the predicate `p`:


    ![image](images/image90_01.jpg)


    Using `sat` and appropriate predicates from the standard prelude, we can define
    parsers for single digits, lower-case letters, upper-case letters, arbitrary letters,
    alphanumeric characters, and specific characters:


    ![image](images/image91_00.jpg)


    For example:


    ![image](images/image93_03.jpg)


    In turn, using `char` we can define a parser `string xs` for the string of characters
    `xs`, with the string itself returned as the result value:


    ![image](images/image91_01.jpg)

