    # 前言


    …… 构建软件设计有两种方法：一种是让它极其简单，以至于`显然`没有缺陷；另一种是让它极其复杂，以至于有`显而易见`的缺陷。第一种困难得多。


    `Tony Hoare, 1980 ACM Turing 演讲`


    本书介绍的是一种编程方法，其中简单、清晰和优雅是核心目标。更具体地说，这是一本关于函数式编程风格的介绍，使用了 `Haskell` 语言。


    函数式风格与目前大多数语言（如 `Java`、`C++` 和 `Visual Basic`）所推崇的风格非常不同。特别是，大多数目前的语言与底层硬件紧密结合，体现在编程是基于改变存储值的想法。与此相反，`Haskell`
    推广了一种更抽象的编程风格，基于将函数应用于参数的想法。正如我们所看到的，转向这种更高层次可以使程序变得简单得多，并支持许多结构化和推理程序的强大新方法。


    本书主要面向在大学水平上学习计算机科学的学生，但也适合想要学习 `Haskell` 编程的更广泛的读者。不需要也不假设读者具有任何之前的编程经验，所有概念都将从原理开始，并以精心挑选的示例进行解释。


    书中使用的 `Haskell` 版本是 `Haskell 98`，这是该语言的标准版本，其最新定义是设计者十五年工作的结晶。由于这是一本教材，我们并不尝试涵盖
    `Haskell` 及其相关库的所有方面。书中大部分内容介绍了语言的主要特征，另一部分由 `Haskell` 编程的示例和案例研究组成。每章都包含一系列练习题，以及关于更高级和更专门主题的阅读建议。


    本书基于诺丁汉大学多年来完善和课堂测试的课程材料。书中的大部分内容可以通过二十小时的讲座涵盖，并辅以约四十小时的自学、受监督实验室的实践课程以及课后编程课程作业。然而，要更详细地涵盖后面的章节以及后期的一些编程示例，还需要额外的时间。


    本书的网站提供了系列支持材料，包括每章的 PowerPoint 幻灯片以及每个扩展示例的 `Haskell` 代码。教师还可以发送邮件到 `solutions@cambridge.org`
    获取每章练习题的标准答案，以及大量的考试题及其标准答案。


