    也就是说，列表是通过使用一个额外的参数来累积最终结果来实现反转的。`reverse` 的新定义可能比原始版本不清晰，但效率高得多。特别是，使用新定义对于长度为
    `n` 的列表，评估 `reverse xs` 所需的归约步骤仅为 `n + 2`，因此 `reverse` 现在消耗的时间与其参数的长度呈线性关系。例如，反转一个包含一万个元素的列表现在大约需要一万步，而原始定义则需要大约五千万步——这是一个巨大的改进！


