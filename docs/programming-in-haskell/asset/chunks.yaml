    any non-empty list to the result of recursively processing the tail using a new
    accumulator value obtained by applying an operator ⊕ to the current value and
    the head of the list. The higher-order library function *foldl* (abbreviating
    “fold left”) encapsulates this pattern of recursion, with the operator ⊕ and the
    accumulator *v* as arguments. For example, using *foldl* the above definition
    for *sum* can be rewritten more compactly as follows:


    ![image](images/image81_02.jpg)


