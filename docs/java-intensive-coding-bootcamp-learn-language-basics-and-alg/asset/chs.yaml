  \ 8 位。在 Java 语言中，我们获得了对整数类型执行位与和位位移的运算符，尽管它们并不常用。在下一个问题中，我们将构建一个方法，将任何十进制值转换为其等效二进制。\n\
  \n```java\n1 // problem 60\n2 //code 60\n3 package fun.sanjibsinha;\n4\n5 /*\n6\
  \ 将十进制值转换为二进制\n7 */\nclass DecimalToBinary{\n9\n10     public Integer Decimal2Binary(Integer\
  \ myDecimalNumber) {\n11\n12     if (myDecimalNumber == 0) {\n13         return\
  \ myDecimalNumber;\n14     }\n15\n16     StringBuilder myBinaryNumber = new StringBuilder();\n\
  17     Integer quotient = myDecimalNumber;\n18\n19     // 直 quotient 变为 0\n20  \
  \   while (quotient > 0) {\n21         int remainder = quotient % 2;\n22       \
  \  myBinaryNumber.append(remainder);\n23         quotient /= 2;\n24     }\n25\n\
  26     myBinaryNumber = myBinaryNumber.reverse();\n27     return Integer.valueOf(myBinaryNumber.toString());\n\
  28     }\n29 }\n30\n31 public class ProblemSixty {\n32\n33     public static void\
