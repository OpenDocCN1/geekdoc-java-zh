  \ :1\nThe speed of car: 20 when gear is :2\nThe speed of car: 0 when gear is :1\n\
  ```\n\n我们学习了关于对象的几点知识。当我们创建一个对象时，是这样编写代码的：\n\n```java\nAnotherCar car1 = new AnotherCar();\n\
  ```\n\n你可能注意到 `AnotherCar` 类没有 `main()` 方法。这是因为它是汽车对象的蓝图。它不是一个完整的应用程序。我们将在应用类中使用这个蓝图或类。包含\
  \ `main()` 方法的应用类负责创建对象。这正是上面代码（问题九）中所发生的。\n\n我们使用了 `new` 关键字来创建一个新对象，它背后有一个蓝图。在那个蓝图或类内部，我们说明了它应该拥有什么类型的状态。我们还有方法来改变这些状态。\n\
  \n汽车对象的名称最终是 `car1`；它也可以是 `jaguar`。无论你使用什么名字，只要记住上下文，名称就应该是有意义且具有表达力的，这样你以后才能阅读并理解这段代码。在这里，名称\
  \ `car1` 也被称为存储在 `Stack`（栈）内存中的引用变量。然而，新创建的汽车对象存储在内存的 `Heap`（堆）区域。`Stack` 中的这个引用变量\
  \ `car1` 指向 `Heap` 中那个新创建的对象。我们将在第五章通过示例详细讨论这个主题，届时我们将看到不同类型变量之间的区别，以及用于描述对象 `state`（状态）的数据类型的本质。\n\
  \n面向对象编程有一些优点。它是模块化的。对象的源代码可以分开编写和维护。一旦创建对象，就可以将其传递到系统中。\n\n第二个重要点是，信息隐藏。外部世界不知道内部发生了什么。内部实现被保持隐藏。\n\
  \n一个对象可以拥有巨大的力量。它内部可能包含成千上万的其他对象。这意味着开发者创建的对象可以被其他开发者复用。代码复用是另一个优势。\n### Java 中的变量或字段（Fields）\n\
  \n在问题九中，我们在 `AnotherCar` 类中看到了两个字段。它们是 `speed` 和 `gear`。我们也学习了它们是汽车对象的状态。汽车对象在字段中存储它的状态。在\
  \ Java 中，`field` 和 `variable` 术语都被使用。事实上，`variable` 术语更常用。由于我们在变量中存储对象的状态，我们需要对它们倍小心。它们应该是有意义的。这也是一种良好的做法。如果我们想在变量中存储任何对象的速度状态，变量的名称应该是\
  \ `speed`。写 `s` 而不是 `speed` 并不能表达任何意思。现在，我们是写 speed 的：\n\n```java\nint speed = 0;\n\
  ```\n\n这意味着什么？通常理解为速度应该是一个整数值。它不应该是文本。因此，我们在变量名之前写了 `int`。之后，我们用值 0 初始化了变量。这是必要的吗？我们将在接下来的章节中讨论它们，并将讨论像\
  \ `byte`、`short` 等原始类型。在此之前，我们需要更多地讨论变量的命名规范。我将给出两个问题供你学习——第十和十一，在那里你会发现我们可以以不同的方式来命名变量。\n\
  \n```java\n//problem 10\npackage fun.sanjibsinha;\n\n/*\nrules and conventions for\
