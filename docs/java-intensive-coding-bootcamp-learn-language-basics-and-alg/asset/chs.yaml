  \        objOne.givingOutput();\n    }\n}\n```\n\n\n\n在本章中，我们将详细讨论不同类型的变量和数据类型。它将包括作为新创建对象句柄的引用变量。在设计和编写对象状态时，我们应该遵循一些规则和约定。除了\
  \ `int` 或 `boolean` 之外，还有其他数据类型；此外，我们应该对变量的赋值有一个清晰的思路。如果我们不显式地初始化它们，它们会被赋予默认值吗？让我们通过问题来了解所有的技巧。\n\
  \n## 变量的区别\n\n让我们从第 18 题开始。这个问题处理了 Java 的核心概念。我们知道局部变量将其值存储在 `Stack`（栈）中，而新创建的对象存储在\
  \ `Heap`（堆）中。然而，作为对象句柄的引用变量存储在 `Stack` 中。它只指向新对象。让我们先看这个问题，然后我们将讨论实际上发生了什么。\n\n\
  ```java\n//problem 18\n// code 18\npackage fun.sanjibsinha;\n\nclass ReferenceVariable\
  \ {\n}\n\npublic class ProblemEighteen {\n    public static void main(String[] args)\
  \ {\n        int i = 10;\n        int j = 5;\n        System.out.println(i + \"\
  \ \" + j);\n        i = j;\n        System.out.println(i + \" \" + j);\n       \
  \ j++;\n        System.out.println(i + \" \" + j);\n\n        ReferenceVariable\
  \ numOne = new ReferenceVariable();\n        ReferenceVariable numTwo = new ReferenceVariable();\n\
  \        numOne = numTwo;\n        numOne.num = 10;\n        System.out.println(numOne.num\
  \ + \" \" + numTwo.num);\n        numTwo.num++;\n        System.out.println(numOne.num\
  \ + \" \" + numTwo.num);\n    }\n}\n```\n\n如你在上面的代码所示，有两个局部变量 `int i` 和 `int j`。我们首先显示了两个值。之后我们写了\
  \ `i=j`，并将 `j` 的值增加了 1。事实上，这个值的增加应该反映在 `i` 的值上。然而，`j` 值的改变并没有影响 `i` 的值。你将在几后的输出中发现这一点。\n\
  \n在程序的第二部分，我们处理了两个对象。请观察代码中的这些行：\n\n```java\nReferenceVariable numOne = new ReferenceVariable();\n\
  ReferenceVariable numTwo = new ReferenceVariable();\nnumOne = numTwo;\n```\n\n在上面的行中，`numOne`\
  \ 和 `numTwo` 是两个引用变量，它们指向存储在 `Heap` 中的两个新创建的对象。而这两个引用变量存储在 `Stack` 中。一旦我们将它们相等，第一个引用变量即\
  \ `numOne` 现在指向了第二个对象。它不再反映第一个对象的值。\n\n仔细观察输出，你将理解“按值传递（call by value）”和“引用传递（call\
  \ by reference）”的区别。\n\n```text\n//output of problem 18\n10 5\n5 5\n5 6\n10 10\n\
  11 11\n```\n\n在第一种情况下，变量 `i` 没有获取 `j` 的值。但在第二种情况下，`numOne` 获取了 `numTwo` 的值。因为在第二种情况下，引用变量\
  \ `numOne` 作为第一个对象的句柄，它只是撤回并了第二个对象。\n\n接下来的两个问题中，我们将看到不同类型的变量。我们应该如何使用局部变量？\n\n\
  ```java\n//problem 19\n// code 19\npackage fun.sanjibsinha;\n\npublic class ProblemNineteen\
  \ {\n    //local variable\n    public void WeightOfFatherBear() {\n        int weight\
  \ = 0;\n        weight = 180;\n        System.out.println(\"The weight of father\
  \ bear is: \" + weight);\n    }\n\n    public static void main(String[] args) {\n\
  \        ProblemNineteen fatherWeight = new ProblemNineteen();\n        fatherWeight.WeightOfFatherBear();\n\
  \    }\n}\n```\n\n这是第 19 题的输出：`The weight of father bear is: 180`。非常简单的程序。但它提醒了我们一个因素：我们不能在作用域之外使用局部变量。看问题\
  \ 20。\n\n```java\n//problem 20\n// code 20\npackage fun.sanjibsinha;\n\npublic class\
  \ ProblemTwenty {\n    //using local variable out scope\n    public void WeightOfChildBear()\
  \ {\n        int weight = 0;\n        weight = 80;\n    }\n\n    public static void\
  \ main(String[] args) {\n        //it will give us errors\n        System.out.println(\"\
  The weight of child bear is: \" + weight);\n    }\n}\n```\n\n它将产生错误。看下面的输出。\n\n\
  ```text\n//output of problem 20\nError:(12, 6) java: cannot find symbol\nsymbol:\
  \ weight\nlocation: class fun.sanjibsinha.ProblemTwenty\n```\n\n当局部变量在方法内部声明时，它应该只在该方法在使用。我们可以稍后调用该方法。在下一个问题中，我们将发现另一个关键因素：局部变量应该被初始化。否则它会给我们报错。\n\
  \n```java\n//problem 21\n// code 21\npackage fun.sanjibsinha;\n\n/*\nLocal variables\
  \ must be initialized\n*/\npublic class ProblemTwentyOne {\n    //local variable\n\
  \    public void WeightOfMotherBear() {\n        int weight;\n        System.out.println(\"\
  The weight of mother bear is: \" + weight);\n    }\n\n    public static void main(String[]\
  \ args) {\n        ProblemTwentyOne motherBear = new ProblemTwentyOne();\n     \
  \   //you cannot initialize local variable here\n        //it will give us errors\n\
  \        motherBear.weight = 150;\n        motherBear.WeightOfMotherBear();\n  \
  \  }\n}\n```\n\n我们本应该早地初始化它。相反，我们尝试通过对象赋值。这行不通。\n\n```text\n//output of problem\
  \ 21\nError:(19, 19) java: cannot find symbol\nsymbol: weight\nlocation: variable\
  \ motherBear of type fun.sanjibsinha.\n```\n\n另一方面，类级别的实例变量不需要初始化。这是因为实例变量有默认值 null。看下一个问题。\n\
  \n```java\n//problem 22\n// code 22\npackage fun.sanjibsinha;\n\nimport java.io.*;\n\
  \n//these are instance variables\n//you need not initialize them like local variables\n\
  class StudentClasses {\n    int className;\n    //we could have added more states\
  \ and methods to change the states\n}\n\npublic class ProblemTwentyTwo {\n    public\
  \ static void main(String args[]) {\n        //here john is the reference variable\n\
  \        //it'll act as a handle to the new object\n        //john is stored in\
  \ stack, and the new object is stored in heap\n        StudentClasses john = new\
  \ StudentClasses();\n        //now john can access the instance variable\n     \
  \   john.className = 1;\n        System.out.println(\"The new student john studies\
  \ at class: \" + john.className);\n\n        StudentClasses mary = new StudentClasses();\n\
  \        mary.className = 2;\n        System.out.println(\"The new student mary\
  \ studies at class: \" + mary.className);\n\n        john.className = mary.className;\n\
  \    }\n}\n```\n\n正如我们之前猜测的，它不会产生错误。\n\n```text\n//output of problem 22\nThe new\
  \ student john studies at class: 1\nThe new student mary studies at class: 2\nAfter\
  \ one year john passed the exam and now he studies at: 2\n```\n\n## 引用变量\n\n现在我们可以对变量的一些关键规则进行总结。到为止我们发现了三种类型的变量：引用变量、局部变量和实例变量。引用变量与对象的作用域直接相关。我们已经看到了一些问题，并通过这些问题研究了它们的本质。\n\
  \n\n\n局部变量具有一些特殊特性。它们定义在块、方法或构造函数内部（我们将在下一章中讨论构造函数）。当方法被调用或进入代码块时，这些局部变量会被创建；当我们离开该块或从方法返回时，它们会被销毁。我们无法在该代码块之外访问这些变量。此外，我们必须初始化局部变量。\n\
  \n因此，我们需要记住关于局部变量的几个关键因素，最终可以将它的位置与之前讨论过的对象状态或字段进行比较。\n\n就像对象将其字段存储在实例变量中一样，方法将其临时状态存储在局部变量中。声明的语法是相同的。我们不需要为此使用任何\
  \ `local` 关键字。根据其所在的位置，我们可以假设变量的角色是否是局部的。它始终位于方法的左括号和右括号之间。此外，它只在方法内部可见。\n\n## 实例变量\n\
  \n实例变量的特殊之处与类和对象直接相关。我们可以在任何块、方法或构造函数之外、但在类内部声明它。我们并不强制要求必须初始化实例变量。它的默认值是 `0`。对象将状态存储在字段或变量中，该值对于每个实例或对象来说是唯一的。\n\
  \n此外，它的生命周期完全取决于该类的对象。创建和销毁过程由对象控制。由于它们不是 `static` 变量，根据访问修饰符的声明，只有对象可以访问它们。我们将在接下来的章节中详细讨论访问修饰符。然而，在本章中，我们将对其进行一个介绍性的说明。\n\
  \n## 类变量（静态字段）\n\n当一个字段用 `static` 修饰符声明时，我们称该变量为类变量。`static` 意味着你可以通过类名直接访问该变量。你不再需要创建一个对象来这样做。它还告诉编译器，内存中该变量恰有一个副本。无论你实例化类多少次，创建了多少个对象，该变量只有一个副本，且只有类可以访问它。我们可以把字段比作人的眼睛。理想情况下，它可以被标记为静态的。为什么呢？\n\
  \n因为从概念上讲，我们可以为所有人类实例应用相同数量的眼睛。此外我们可以添加 `final` 关键字来断言眼睛的数量永远改变。\n\n下一个问题将向你展示一个示例。\n\
  \n```java\n//problem 23\n//code 23\npackage fun.sanjibsinha;\n\nclass StudentClassesAndNames\
  \ {\n    public static int className;\n    public static String studentName;\n}\n\
  \npublic class ProblemTwentyThree {\n    public static void main(String args[])\
  \ {\n        StudentClassesAndNames.studentName = \"John\";\n        StudentClassesAndNames.className\
  \ = 1;\n        System.out.println(StudentClassesAndNames.studentName + \" studies\
  \ at class \" \\+ StudentClassesAndNames.className);\n    }\n}\n```\n\n在上面的代码中，我们看到了一个带有\
  \ `static` 修饰符的类变量示例。输出非常简单：\n\n`John studies at class 1`\n\n我们将看到更多带有 `static`\
  \ 修饰符的类变量问题。然而，在下一个问题中，我们将对访问修饰符进行快速介绍，这在构建可适用的软件时起着非常重要的作用。在下一个问题中，我们看到了访问修饰符之间的区别。阅读代码内部编写的文档。这将消除关于这些面向对象编程核心概念的许多疑问。\n\
  \n```java\n//problem 24\n//code 24\npackage fun.sanjibsinha;\n\n/*\n成员变量可以声明在类内部，但在任何方法之外\n\
  这里有四种访问修饰符\n1) public = 在包、子类和外部世界中可用\n2) protected = 在包、子类中可用，但在外部世界不可用\n3) private\
  \ = 在包、子类和外部世界均不可用\n4) default (无修饰符) = 仅在包内可用\n*/\n/*\n在这个程序中，我们将分别检查访问修饰符\n*/\n\
  \nclass FatherPanda {\n    public boolean isPredator;\n    protected int weight;\n\
  \    private int age;\n    public void eat() {\n        System.out.println(\"After\
  \ each meal Father Panda gains weight : \" + weight + \". And his age is : \" +\
  \ age);\n    }\n}\n\npublic class ProblemTwentyFour {\n    public static void main(String\
  \ args[]) {\n        FatherPanda father = new FatherPanda();\n        System.out.println(\"\
  Is father predator ? \" + father.isPredator);\n        father.weight = 5;\n    \
  \    //下一行将报错\n        //我们不能像这样修改成员变量\n        //father.age = 10;\n        father.eat();\n\
  \    }\n}\n```\n\n在上面的代码中，我们注释掉了行：`father.age = 10;`。否则它会产生此错误：`Error:(32,15) age\
  \ has private access in fun.sanjibsinha.FatherPanda`。上面的输出清楚地显示了我们犯了什么样的错误。我们尝试访问私有字段或变量。当实例变量是\
  \ `public` 时，程序的每个部分都可以访问它。当它是 `protected` 时，允许部分区域访问。当它是 `private` 时，除非通过公共方法更改它，否则它是不可用的。这里的情况一样。当那一行被注释掉时，输出变为：\n\
  \n`Is father predator ? false`\n`After meal Father Panda gains weight : 5. And his\
  \ age is : 0`\n\n我们注意到了实例变量的另一个属性，即基本类型 `int`。如果没有初始化，它的默认值为 `0`。对于 `boolean` 类型，它是\
  \ `false`。通过 `get` 和 `set` 方法，我们可以修改任何保护和私有字段的状态。下一个问题将涉及这个问题。让我们来看看。\n\n```java\n\
  //problem 25\n//code 25\npackage fun.sanjibsinha;\n\n/*\n理解成员变量和访问修饰符\n*/\nclass\
  \ MotherPanda {\n    public boolean isPredator;\n    protected int weight;\n   \
  \ private int age;\n\n    public void setWeight(int weight) {\n        this.weight\
  \ = weight;\n\n    public int getWeight() {\n        return weight;\n    }\n\n \
  \   public void setAge(int age) {\n        this.age = age;\n    }\n\n    public\
  \ int getAge() {\n        return age;\n    }\n\n    public void eat() {\n      \
  \  System.out.println(\"After each meal Mother Panda gains weight : \" + getWeight()\
  \ + \". And her age is : \" + getAge());\n    }\n}\n\npublic class ProblemTwentyFive\
  \ {\n    public static void main(String args[]) {\n        MotherPanda mother =\
  \ new MotherPanda();\n        mother.setWeight(2);\n        mother.setAge(7);\n\
  \        mother.eat();\n        FatherPanda father = new FatherPanda();\n      \
  \  //包内可见保护成员变量\n        father.weight = 200;\n        //包内可见公共成员变量\n        System.out.println(\"\
  Is father predator? \" + father.isPredator);\n        //随处可见的公共方法\n        father.eat();\n\
  \    }\n}\n```\n\n这个问题相对容易理解。以下是输出结果：\n\n`After each meal Mother Panda gains weight\
  \ : 2. And her age is : 7`\n`Is father predator? false`\n`After meal Father Panda\
  \ gains weight : 200. And his age is : 0`\n\n\n\n\n\n在下一个问题中，我们将回顾局部变量的方法级作用域。正如我们之前所说的，局部变量仅在类的方法内部可见。你应该将其视为方法的典型属性，因为方法在这些局部变量中存储其临时状态。\n\
  \n请看下一个问题，其中我们尝试在方法级作用域之外访问局部变量。\n\n### 问题 26\n\n```java\npackage fun.sanjibsinha;\n\
  \n/*\n局部变量的方法级作用域\n*/\n\nclass ChildPanda {\n    public void eat() {\n        int\
  \ weight = 3;\n        System.out.println(\"After each meal child panda gains weight\
  \ : \" + weight);\n    }\n}\n\npublic class ProblemTwentySix {\n    public static\
  \ void main(String args[]) {\n        ChildPanda child = new ChildPanda();\n   \
  \     //我们无法访问变量 weight\n        // 因为它是在方法内部声明的，它具有方法级作用域\n        // weight 无法在方法外部访问\n\
  \        // 下面这一行将导致错误\n        child.weight = 4;\n        child.eat();\n    }\n\
  }\n```\n\n`eat()` 方法将其状态存储在局部变量 `weight` 中，其数据类型为 `int`。然而，引用变量 `child` 想要直接访问它并尝试更改它的状态。查看输出：\n\
  \n```text\n//问题 26 的输出\nError:(17, 14) java: cannot find symbol\nsymbol:  variable\
  \ weight\nlocation: variable child of type fun.sanjibsinha.ChildPanda\n```\n\n一旦我们注释掉那一行特定的代码，程序就能完美运行。\n\
  \n```text\n//问题 26 的输出\nAfter each meal child panda gains weight : 3\n```\n\n我们已经见过不同类型的变量，在某些情况下，我们还见过一种被称为“参数”的变量类型。\n\
  \n### 参数，另一种类型的变量\n\n我们需要记住关于参数的一个关键点。它们不被归类为字段，而是被归类为变量。始终。在接下来的两个问题中，我们将看到参数是如何工作的。Java\
  \ 中 `main()` 方法的签名也使用了参数。\n### 问题 27\n\n```java\npackage fun.sanjibsinha;\n\n/*\n\
  类变量只有一个副本，无论该类被实例化多少次。\n*/\n\nclass ExerciseSchedule {\n    static int weightGain\
  \ = 0;\n    static int weightLoss = 0;\n    public void eat(int weightGain){\n \
  \       ExerciseSchedule exerciseOne = new ExerciseSchedule();\n        this.weightGain\
  \ = 2;\n        System.out.println(\"After each meal the weight gain is : \" + exerciseOne.weightGain);\n\
