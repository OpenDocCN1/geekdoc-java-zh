  ### 问题 30\n\n```java\npackage fun.sanjibsinha;\n\npublic class ProblemThirty {\n\
  \    public static void main(String args[]){\n        {\n            int anyNumber\
  \ = 10;\n            System.out.println(anyNumber);\n        }\n        //这会导致错误\n\
  \        // System.out.println(anyNumber);\n    }\n}\n```\n\n\n\n\n我们在 `main()`\
  \ 方法内部使用了大括号来区分局部变量的位置。在花括号之外调用它将导致错误。\n\n1. 输出是：10。\n\n接下来的两个问题将使用循环结构，我们还没有涵盖过这部分。我们将在接下来的章节中详细讨论它们。然而，这两个问题将让你理解关于变量命名的核心概念。\n\
  \n```java\n1 //problem 31\n2 //code 31\n3 package fun.sanjibsinha;\n\npublic class\
  \ ProblemThirtyOne {\n    public static void main(String args[]){\n        int anyNumber\
  \ = 10;\n        for (anyNumber = 0; anyNumber <=5; anyNumber++){\n            System.out.println(anyNumber);\n\
  \        }\n        System.out.println(anyNumber);\n    }\n}\n```\n\n由于我们已经定义过变量\
  \ `anyNumber`，所以我们不能再次声明它。尽管我们在外层循环部分中声明了它，但内部循环获取了相同的值，最终在循环完成后，它改变了外层循环的值。\n\n\
  ```text\n1 //output of problem 31\n0\n1\n2\n3\n4\n5\n6\n```\n\n在本章的最后一个问题中，我们检查了相同的变量命名规范，其中内部循环是单独声明的。此后，它无法改变外层循环的值。\n\
  \n```java\n1 //problem 32\n2 //code 32\npackage fun.sanjibsinha;\n\npublic class\
  \ ProblemThirtyTwo {\n    public static void main(String args[]){\n        //variable\
  \ name of outer loop\n        int anyNumber = 10;\n        //we cannot define the\
  \ variable twice\n        //it has already been defined as int\n        //the following\
  \ is not a continuation of outer loop, it's an inner loop\n        //hence the variable\
  \ name is changed\n        for (int myNumber = 0; myNumber <=5; myNumber++){\n \
  \           System.out.println(\"Output of inner loop : \" + myNumber);\n      \
  \  }\n        System.out.println(\"Output of outer loop : \" + anyNumber);\n   \
  \ }\n}\n```\n\n看这里的输出。外层循环的值不再是 6 了。\n\n```text\n1 //output of problem 32\nOutput\
  \ of inner loop : 0\nOutput of inner loop : 1\nOutput of inner loop : 2\nOutput\
  \ of inner loop : 3\nOutput of inner loop : 4\nOutput of inner loop : 5\nOutput\
  \ of outer loop : 10\n```\n\nJava 的命名规范与其他编程语言没有区别。它有自己你必须遵循的规则。虽然你可以像这样写变量：`int\
  \ $anyNumber` 或 `int anyNumber`，但认为在任何变量名前之前使用 `$` 或空格符号是不良好的做法。以字母开始你的变量名。也不允许使用空格。如果你想存储一个常量：\n\
  \n```java\nstatic final int NUM_OF_EYES = 2;\n```\n\n命名规范是可以更改的。这些是可以使用 `_` 的特殊情况。否则不建议这样做。变量名是大小写敏感的，且你不能声明两次相同的变量名。我们在上面已经见过此类问题。最后，你不能使用关键字或保留字作为你选择的变量名。\n\
  \n\n在本章中，我们将学习数组（Array）。我们之前见过，变量是内存中的一个位置，它有一个包含值的名称。这个值可以是任何数据类型，例如 `int`。数组也是另一种变量或容器对象，它持有固定数量的单一类型的值。因此，数组可以是任何数据类型，例如\
  \ `int` 或 `String`。在之前的程序中，我们曾无意中使用过数组。看下面的代码片段：\n\n```java\npublic static void\
  \ main(String[] args){}\n```\n\n在每个程序中，这都是入口，即 `main` 方法带有一个参数，该参数是一个 `String` 类型的数组。\n\
  \n## 乱序的数组\n\n在许多 Java 程序中，你会看到两种类型的 main 方法：\n\n1) `public static void main(String[]\
  \ args)`\n2) `public static void main(String args[])`\n\n\n\n我们将类型写为 `int[]` 或 `String[]`。当我们提到该类型时，我们实际上指的是所包含的元素的数据类型。为什么要使用括号呢？仅仅是为了告诉编译器该变量持有一个数组。当我们声明数组时，在括号内部不需要指定大小或长度。这会在后面的部分完成。\n\
  \n同样，我们可以声明并创建一个对象数组。它的创建方式与原始数据类型的数组一样。\n\n```java\nPerson[] persons = new Person[3];\n\
  ```\n\n在上一个问题（问题 53）中，我们已经详细讨论了这个话题。\n\n同样，我们可以以这种方式声明其他类型的数组：\n\n```java\nbyte[]\
  \ anyName;\nshort[] anyName;\nlong[] anyName;\nfloat[] anyName;\ndouble[] anyName;\n\
  boolean[] anyName;\nchar[] anyName;\nString[] anyName;\n```\n\n下一个问题将向你展示如何为不同类型的变量声明、初始化并分配内存。请阅读问题\
  \ 33 编写的注释。\n\n```java\n// problem33\n// code 33\npackage fun.sanjibsinha;\n\n/*\n\
  数组对象简介\n原始数据类型不是从类创建的对象。它们是语言内置的特殊数据类型。\n为了构建数组对象，我们需要借助原始数据类型的帮助。\n唯一的例外是 String\n\
  什么特征会将数组与原始数据类型区分开？\n让我们来看这个问题\n*/\n\npublic class ProblemThirtyThree {\n    public\
  \ static void main(String[] args) {\n        // 原始数据类型的一个示例\n        // 变量是一个包含值或原始数据类型的容器\n\
  \        int myAge = 54;\n        System.out.println(\"An example of primitive data\
  \ type : \" + myAge);\n        // 对于数组，我们使用 new 关键字进行声明和内存分配\n        // 下面的数组容器持有固定数量的\
  \ int 类型数据值\n        // 数组的长度已经建立\n        // 在这里长度为 2，这个容器有 2 个元素\n        int[]\
  \ myBasket = new int[2];\n        // 每个项目或元素都有一个从 0 开始的对应数值索引\n        myBasket[0]\
  \ = 2;\n        myBasket[1] = 3;\n        // 每个元素都可以通过其对应的数值索引访问\n        System.out.println(\"\
  The first element of my basket : \" + myBasket[0]);\n        System.out.println(\"\
  The second element of my basket : \" + myBasket[1]);\n    }\n}\n```\n\n输出给了我们关于如何以不同方式处理这些变量的思路。\n\
  \n```text\n// output of problem 33\nAn example of primitive data type : 54\nThe\
  \ first element of my basket : 2\nThe second element of my basket : 3\n```\n\n初始化和创建数组总是涉及到提到数据类型。通过索引初始化数组元素时，如果我们选择了错误的数据类型，它会产生类型不兼容错误。\n\
  \n\n```java\n// problem 34\n// code 34\npackage fun.sanjibsinha;\n\n/*\n如何声明一个变量来引用数组\n\
  */\n\npublic class ProblemThirtyFour {\n    public static void main(String[] args)\
  \ {\n        // 声明并创建一个整数类型的数组\n        int[] studentClasses = new int[2];\n   \
  \     // 声明一个 String 数组，一种非原始数据类型\n        String[] studentNames = new String[4];\n\
  \        // 数据类型后面的括号表示它是一个数组\n        // 数组有两个部分：数据类型和名称\n        // 数据类型也指明了数组将包含什么元素\n\
  \        // 下一行将产生类型不兼容错误\n        /*\n        studentNames[0] = 12;\n        */\n\
  \        studentNames[0] = \"John\"; // 这对编译器来说是好的\n        System.out.println(\"\
  The name of the student who come out first : \" + studentNames[0]);\n    }\n}\n\
  ```\n\n在上述代码中，和通常一样你需要遵循注释部分。`String` 数组不能初始化为 `int`。\n\n```text\n// output of problem\
  \ 34\nThe name of the student who come out first : John\n```\n\n正如我们之前所说的，正确的初始化是必要的。在下一个问题中我们将看到相同的内容。\n\
  \n```java\n// problem 35\n// code 35\npackage fun.sanjibsinha;\n\n/*\n数组的正确初始化\n\
  */\n\npublic class ProblemThirtyFive {\n    public static void main(String[] args)\
  \ {\n        // 我们也可以这样创建和初始化数组\n        int schoolSections[] = new int[4];\n  \
  \      schoolSections[0] = 1;\n        schoolSections[1] = 2;\n        schoolSections[2]\
  \ = 3;\n        schoolSections[3] = 4;\n        System.out.println(\"We want section\
  \ 1 : \" + schoolSections[0]);\n        /*\n        然而，上面的初始化类型是非常不建议的\n       \
  \ */\n        int[] schoolSection = new int[4]; // 好的\n    }\n}\n```\n\nJava 允许这两种初始化。然而，我们将遵循这种：`int[]\
  \ schoolSection = new int[4];`。任何数组的创建和初始化的快捷语法也节省了大量时间。在多维数组的情况下（稍后我们会讨论这个话题），我们需要使用快捷语法或数组字面量。接下来的问题将向你展示如何这样做。\n\
  \n```java\n// problem 36\n// code 36\npackage fun.sanjibsinha;\n\n/*\n创建和初始化数组的快捷语法\n\
  */\n\npublic class ProblemThirtySix {\n    public static void main(String[] args)\
  \ {\n        String[] nameCollection = {\n            \"John Smith\", \"Chicago\"\
  , \"good gunner.\"\n        };\n        System.out.println(\"He is \" + nameCollection[0]\
