  由于在上面的代码中使用了多维数组，我们可以验证其中任何一个的长度。外层数组内部包含另一个内部数组。输出将向我们展示它是如何工作的。\n\n### 问题 38 的输出\n\
  ```text\nThe length of the first array is : 4\nThe length of the index 2 of the\
  \ first array is : 2\n```\n\n在下一个问题中，我们将看到如何将一个数组的一部分复制到另一个数组。\n\n### 题目 39\n```java\n\
  package fun.sanjibsinha;\n\n/*\nSystem 类有一个名为 'arraycopy()' 的方法，它有五个参数\narraycopy(Object\
  \ source, int source-position, Object destination, int destination-position, int\
  \ length)\n*/\nimport java.util.Arrays;\n\npublic class ProblemThirtyNine {\n  \
  \  public static void main(String[] args){\n        String[] notAMeaningfulSentence\
  \ = {\"My \", \"I \", \"am \", \"not \", \"a \", \"Robot\"};\n        String[] aMeaningfulSentence\
  \ = new String[5];\n        System.arraycopy(notAMeaningfulSentence, 1, aMeaningfulSentence,\
  \ 0, 5);\n        System.out.println(aMeaningfulSentence[0] + aMeaningfulSentence[1]\
  \ + aMeaningfulSentence[2] + aMeaningfulSentence[3] + aMeaningfulSentence[4]);\n\
  \    }\n}\n```\n\n属于 `System` 类的 `arraycopy()` 方法可以将数据从目标位置复制到源位置。\n\n### 问题 39\
  \ 的输出\n```text\nI am not a Robot\n```\n\n在上面的代码中，其中一个参数是新目标数组的长度。因此我们可以使用 for 循环解决相同的问题。\n\
  \n### 题目 40\n```java\npackage fun.sanjibsinha;\n\npublic class ProblemForty {\n\
  \        String[] notAMeaningfulSentence = {\"My \", \"I \", \"am \", \"not \",\
  \ \"a \", \"Robot\"};\n        String[] aMeaningfulSentence = new String[5];\n \
  \       System.arraycopy(notAMeaningfulSentence, 1, aMeaningfulSentence, 0, 5);\n\
  \        for (int i = 0; i<=4; i++){\n            System.out.print(aMeaningfulSentence[i]);\n\
  \        }\n    }\n}\n```\n\n### 40 的输出\n```text\nI am not a Robot\n```\n\n由于一个问题可以用许多方法解决，我们可以使用\
  \ `length` 属性来获取输出。在这个解决方案中，两个因素起着至关重要的作用：源位置和长度。\n\n### 题目 41\n```java\npackage\
  \ fun.sanjibsinha;\n\n/*\n我们可以执行一些与数组相关的最常见操作\n*/\npublic class ProblemFortyOne\
  \ {\n    public static void main(String[] args){\n        String[] notAMeaningfulSentence\
  \ = {\"My \", \"I \", \"am \", \"not \", \"a \", \"Robot\"};\n        String[] aMeaningfulSentence\
  \ = java.util.Arrays.copyOfRange(notAMeaningfulSentence, 1, 6);\n        for (int\
  \ i = 0; i <= (aMeaningfulSentence.length - 1); i++){\n            System.out.print(aMeaningfulSentence[i]);\n\
  \        }\n    }\n}\n```\n你得到了相同的输出：I am not a Robot。到目前为止，我们学习了关于数组的一个关键点：索引和值之间存在非常紧密的关系。这是一个优点（或优势端）。缺点是我们无法改变数组的长度。在声明、初始化和内存分配期间，它是固定的。下一个问题将取决于相同的原理。\n\
  \n### 题目 42\n```java\npackage fun.sanjibsinha;\n\n/*\n数组如何工作：索引=>元素\n*/\npublic\
  \ class ProblemFortyTwo {\n    public static void main (String[] args) {\n     \
  \   //声明某种类型的数组，选择 int\n        int[] ageCollection;\n        //下一步是分配内存，选择 5\n\
  \        ageCollection = new int[5];\n        //在循环中动态创建元素\n        for (int i =\
  \ 0; i <= 4; i++){\n            int j = 18;\n            ageCollection[i] = j++;\n\
  \            System.out.println(\"Element at index \" + i + \" => \" + j);\n   \
  \     }\n    }\n}\n```\n我们在循环内部创建了元素。\n\n### 问题 42 的输出\n```text\nElement at index\
  \ 0 => 18\nElement at index 1 => 19\nElement at index 2 => 20\nElement at index\
  \ 3 => 21\nElement at index 4 => 22\n```\n\n我们已经看到了如何创建多维数组。在下一个问题中，我们将看到如何使用 for\
  \ 循环操作多维数组。\n\n### 题目 43\n```java\npackage fun.sanjibsinha;\n\n/*\n使用 for 循环的多维数组\n\
