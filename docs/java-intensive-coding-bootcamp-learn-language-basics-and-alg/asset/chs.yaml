  \ //sumOfTwoNumbers = (byte)(numOne + numTwo);\n        System.out.println(\"The\
  \ sum of two byte values inside int data type: \" + sum\n        OfTwoNumbers);\n\
  \    }\n}\n```\n\n我们把两个 `byte` 数据类型都设为了 `final`。这解决了“字面量（literals）”问题。我们将在下一章详细介绍字面量。让我们看看输出：\n\
  \n```output\n1 // 问题 16 的输出\n2 The sum of two byte values inside int data type:\
  \ 2\n```\n\n我们也可以对值进行强制转换。作为初学者，如果你感到困，不要担心。我们将在下一章讨论这些话题。在进入下一章之前，我们将看到本章的最后一个问题，问题\
  \ 17。\n\n```code\n1 // 问题 17\n2 // 代码 17\npackage fun.sanjsinha;\n\nimport java.sql.PseudoColumn;\n\
  \nclass PrimitiveType {\n    byte age;\n    byte height;\n    void printState()\
