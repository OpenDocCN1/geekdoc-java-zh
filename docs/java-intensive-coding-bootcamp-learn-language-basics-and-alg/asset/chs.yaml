  \ //问题 11 的输出\n2 机器人的速度是 5。它在行走。\n\n命名约定是，你的变量名应该始终以字母开头。不建议使用 `$` 或 `_`。正如我们之前所说的，变量名应该是有意义的，因此使用令人费解的缩写没有任何意义。在编写代码时，请尽量保持清晰且具有表现力。在适当的地方添加注释也是一个好习惯。对于注释，你可以同时使用两种形式：\n\
  \n```java\n1 /*\n2 在这里写你的长注释\n3 /*\n4 // 使用它来写短注释\n```\n\n命名规范包含两个主要部分：我们写类时是这样的\
  \ —— “NewClass”，特别是当类名包含两个以上单词时。变量也是如此，只有第一个单词应该小写字母开头。如果有两个单词，像这样写：‘twoWords’。\n\
  \n当我们进一步讨论类和对象时，将会再次回到这个话题。你可以将这一节视为对变量的简短介绍。还有更多内容，我们将在下一章中讨论。\n\n## 原始数据类型\n\n\
  到为止，我们已经看到了 11 种不同的问题，其中大多数我们见过整数值。在声明变量时，我们也注意到一个关键点。我们这样写一个变量：`int speed = 0;`。\n\
  \n这意味着我们需要指定它是什么类型的变量。声明变量的类型和名称是关重要的，因为 Java 是静态类型的。这意味着在使用所有变量之前，必须先声明它们。\n\n\
  通过命名和声明变量，我们实际上是在声明对象的状态。在 `Car` 类中，当我们声明变量 `speed` 时，程序知道存在一个字段，并且该字段持有数值数据。它还有一个任何初始值，例如\
  \ 0 或 1。这解释了为什么我们需要数据类型。\n\n变量的数据类型告诉我们它是什么类型的值。因为它代表了对象的状态，我们需要知道它包含了什么类型的值。否则，我们无法通过方法来改变该状态。基本上，在方法中，我们通过某些操作来改变该对象的状态。\n\
  \nJava 总共支持 8 种原始数据类型。\n\n考虑以下行：\n\n```java\n1 int speed = 0;\n```\n\n在这里，原始数据类型\
