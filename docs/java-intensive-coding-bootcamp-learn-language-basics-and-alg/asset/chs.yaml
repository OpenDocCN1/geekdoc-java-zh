  System.out.println(\"The sum of only odd numbers: \" + sum);\n```\n\n当你将一个小数除以 2\
  \ 且没有余数时，它是一个偶数。如果该条件不成立，就是奇数。\n\n**代码 70 的输出：**\n```\nEnter any 5 number:\n12\n\
  10\n5\n3\n7\nThe sum of only odd numbers: 15\n```\n\n我们可以获取用户的输入并测试该数字是偶数还是奇数。要终止程序，用户必须输入\
  \ 0。下一个问题将向我们展示如何利用无限循环的概念来解决特定问题示例。\n\n### 问题 71\n\n```java\npackage fun.sanjibsinha;\n\
  \nimport java.util.Scanner;\n\n/*\n输入一个数字检查是奇数还是偶数，输入 0 终止程序\n*/\npublic class ProblemSeventyOne\
