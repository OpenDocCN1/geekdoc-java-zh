  \n### 题目 38\n```java\npackage fun.sanjibsinha;\n\n/*\n内置的 length 属性帮助我们确定任何数组的大小\n\
  */\npublic class ProblemThirtyEight {\n    public static void main(String[] args){\n\
  \        String[][] nameCollections = {\n            {\"Name\", \"Location\", \"\
  Occupation\"}, //0][0] => Name\n            {\"John Smith\", \"Chicago\", \"Gunner\"\
  }, //1][0] => John ...\n            {\"Ernest Hemingway\", \"Writer\"}, //2][0]\
  \ => Ernest...\n            {\"Don Juan\", \"Paris\", \"Artist\"} //3][0] => Don...\n\
  \        };\n        System.out.println(\"The length of the first array is : \"\
  \ + nameCollections.length);\n        System.out.println(\"The length of the index\
