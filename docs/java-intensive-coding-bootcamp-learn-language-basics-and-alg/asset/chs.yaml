- "# Java 强化编码训练营：学习语言基础与算法：百余道难题及详解 - 逐步讲解，专为初学者设计\n\n\n\n![](img/cover1.jpeg)\n\n\
  \n\n\n\n\n高级语言更接近人类语言。它在某种程度上独立于机器或计算机。Java 正契合了这一特征，因为它满足了高级语言的所有条件。由于`Java Virtual\
  \ Machine` (`JVM`)，它是机器无关的。在 Java 创建时，口号是——编写一次，处运行。初学者可能会觉得这很难理解；我们稍后会详细讨论。\n\n\
  当你沿着语言树继续向下探索时，你会发现在任何高级语言的下方都是汇编语言。在下面的一层是机器语言，它更接近硬件。\n\n机器语言非常不同。它只有计算机才能理解。它是二进制数字或位（bits）的集合，只有计算机可以识别。计算机可以读取并解释\
  \ `0` 和 `1`。因此，每种高级语言都应该被翻译成机器语言，以便它最终能够与硬件通信。\n\n能够与硬件通信是每种高级语言追求的终极目标。\n\n从 `Fortran`、`C`、`Pascal`、`C++`\
  \ 开始，我们可以列出除 Java 之外许多流行的高级语言，如 `PHP`、`Python`、`Dart` 等。\n\n我们也可以将编程语言树与英语等人类语言进行比较。根据约翰·科林森·内斯菲尔（John\
  \ Collinson Nesfield）的《英语语法：过去与现在；附韵律、同义词及其他课题》，英语属于雅言语系。英语的直接祖先是日耳曼语。从日耳曼语演化出了低地德语（包括英语）和高地德语。\n\
  \n现在考虑一个既不会说话也听不见见的人。在这种情况下，我们使用手语来创建一些图像。通信活动通过这些图像完成。字母是字母表的视觉表示。\n\n自然语言从字母或文字开始，单词由字母组成；请记住，字母（letters）和字母表（alphabets）之间是有的，尽管人们认为它们本质上是相同的。无论如何，让我们继续学习单词。通过单词的帮助，我们构建句子；句子构成段落、文章、故事、诗歌、戏剧等。\n\
  \n单词不能随机放置来组成句子。那样没有任何意义。因此，在单词和句子之间存在语法。\n\n什么是语法？一组排列单词以使句子语义的规则。没有这些规则，我们就无法构建有意义的句子。没有有意义的句子，我们就无法创建有意义的段落、故事、诗等。我们甚至无法与他人进行有意义的交流。\n\
  \n我们可以得出结论，每种自然语言都有目的，要么你想写有意义的内容，要么你想与人进行有意义的交流。\n\n对任何编程语言都是如此。每种编程语言都有目的。在某些情况下，它的目的是执行某些特定任务，例如在创建时，`PHP`\
  \ 是为了让网站动态化。现在 `PHP` 是一种通用语言；通过它的帮助，我们不仅能让小型网站动态化，还能创建更健壮、复杂的 Web 应用。\n\nJava 也是如此。学习\
  \ Java 的历史。你会发现它是如何演变成一种运行在数十亿不同设备上的通用面向对象编程语言的。你发现在智能电视、卫星、烹饪设备、人工智能物体、健壮且复杂的软件（如桌面和\
  \ Web 应用程序）、Android 移动应用等；；列表是无尽的。\n\n就像自然语言一样，如果不知道 Java 的语法或基础，我们就无法制作此类软件或应用程序。因此，我们学习\
  \ Java 有目的。而且，Java 是一种可以创建不同类型应用的通用语言。\n\n\n这本书将赋予计算机科学和编程专业的学生学习 Java 语言基础的能力；以便他们用\
  \ Java 构建应用程序。这是第一次采用“直接教学法”使用“问题-解决方案-讲解”方法的书籍；它像一个强化型的编码训练营，参与者将积极参与开发他们的逻辑和分析思维，以便解决交互性问题。由于原因，我们还将掌握\
  \ `Data Structures` 和 `Algorithm` 的基础。\n\n我们将共同学习 Java 的语言基础，首先解决许多类型的问题。这将帮助我们构建在下一个\
  \ Java 训练营系列中讨论的应用程序，在那个系列我们将开发应用。在第一个训练营中，我们将开始编写代码。如果你不能在池里游一小会，你就不会游泳。因此，我们将通过解决问题来学习\
  \ `objects`（对象）、`classes`（类）、`primitive data types`（基本数据类型）、`arrays`（数组）、逻辑 `if-else`、`switch-case`、`loop\
  \ constructs`（循环结构）等。\n\n让我们从小程序开始，结果随之而来；由于它们是由某些现象引起的，我们将在之后学习理论。我们将先研究问题，然后解决它并练习更多相关问题。之后我们再讨论理论。\n\
  \n毕竟，我们想通过 Java 的帮助构建许多应用程序，这是我们学习 Java 的主要目的。尽管 `Abstraction`（抽象）隐藏在幕后，但我们将通过解决问题来学习它们。\n\
  \n随着学习的进行，通过解决从简单到复杂的 100 多道问题，我们将学习 Java 语言基础及其相关的核心概念。\n\n\n让我们看一个简单的 Java 程序，它接收用户输入并给出输出，例如“Hello\
  \ World”。\n\n```java\n1 //Problem 1\n2 //code 1\n3 package fun.sanjibsinha;\n4\n\
  5 import java.util.*;\n6 import java.util.Scanner;\n7 import java.lang.String;\n\
  8 public class Main {\n9\n10     public static void main(String[] args) {\n11  \
  \    //在此处编写你的代码\n12         String s;\n13         Scanner in = new Scanner(System.in);\n\
  14         System.out.println(\"Enter a string\");\n15         s = in.nextLine();\n\
  16         System.out.println(\"You entered string \" + s);\n17\n18     }\n19 }\n\
  ```\n\n这里是输出：\n```\n1 Enter a string\n2 Hello World\n3 You entered string Hello\
  \ World\n4\n5 Process finished with exit code 0\n```\n\n然而，文本“Hello World”在机器语言中看起来完全不同。它的输出如下：\n\
  ```\n1 01001000 01100101 01101100 01101100 01101111 00100000 01010111 01101111 01110010\
  \ 01110014 00100000\n2 01100 0110101\n```\n\n\n\n\n我们还学习了另一个重要的教训：在机器语言（二进制）中给出相同的输出是非常的。因此，我们需要像\
  \ `Java` 这样的高级语言来编写代码，以便构建软件或应用程序；无论是网页还是移动端。\n\n此外，我们也看到当我们用高级语言编写代码时，它最终会被翻译成二进制代码。硬件除了二进制之外，什么都不懂。\n\
  \n\n作为一个初学者，你需要对幕后发生了什么有一个基本的概念，特别是当我们编写并执行代码时。\n\n到为止，我们学到了一个重要的教训：我们的代码最终是通过二进制代码与硬件通信的。我们在\
  \ `Java` 中写的任何内容都会被转换为 `0` 和 `1`。但它们存储在哪里呢？这就引入了内存的概念。在计算中，内存是指用于存储信息以供立即使用的设备。因此，我们可以说内存实际上主存储器。\n\
  \n同时，内存管理也非常重要。当我们编写并执行代码时，计算机会为程序动态分配一些内存，并在不再需要时将其释放以便重复。\n\n随着学习的深入，你会发现在 `Java`\
  \ 编程中，我们会编写许多类并创建对象。每个类都有一个执行程序的 `main()` 线程。由于内存管理本质上处理的是空间，我们会在 `Java` 编程中经常遇到两个术语。一个是“堆（heap）”，另一个是“栈（stack）”。\n\
  \n当我们写一个类并创建一个对象时，它总是在堆空间中创建的。然而，`Java` 使用它的 `Stack` 内存来执行所有线程，例如属性和方法；这意味着这个空间不仅分配给\
  \ `main()` 方法，还分配给了我们在任何类内部创建的所有属性和方法。考虑问题 1 或代码 1。\n\n在第一个问题中，我们从用户那里获取了字符串输入并输出了该字符串。我们没有创建任何额外的类或对象。现在，我们将创建两个额外的类和相关对象，最后将给出该对象的字符串输出。对于初学者来说，这段代码看起来有点奇怪且困难。但请耐心等待，我们将在接下来的章节中通过简单的问题和解决方案来解释类、对象以及其他所有基本数据类型。现在，我们手头第二个问题，代码如下：\n\
  \n```\n1 //Problem 2\n2 //code 2\n3 package fun.sanjibsinha;\n4\n5 import java.util.*;\n\
  6 import java.util.Scanner;\n7 import java.lang.String;\n8\n9 class MyObject{};\n\
  10 class MyMemory{\n11\n12     void myMethod(MyObject myParam) {\n13         String\
  \ str = myParam.toString();\n14         System.out.println(str);\n15     }\n16 };\n\
  17\n18 public class Main {\n19\n20     public static void main(String[] args) {\n\
  21         // write your code here\n22         String s;\n23         Scanner in\
  \ = new Scanner(System.in);\n24         System.out.println(\"Enter a string\");\n\
  25         s = in.nextLine();\n26         System.out.println(\"You entered string\
  \ \" + s);\n27         MyObject myObj = new MyObject();\n28         MyMemory myMem\
  \ = new MyMemory();\n29         myMem.myMethod(myObj);\n30     }\n31 }\n```\n\n\
  对应的输出如下：\n\n```\n1 //output of problem 1\n2\n3 Enter a string\n4 sanjib\n5 You entered\
  \ string sanjib\n6 fun.sanjibsinha.MyObject@573f2bb1\n7\n8 Process finished with\
  \ exit code 0\n```\n\n让我先解释一下代码。我们创建了类。在其中一个类内部，我们创建了一个方法，并将另一个类对象作为参数传递。我们将该对象转换为字符串并输出。\n\
  \n在 `main()` 方法中，我们创建了这些类的两个新对象，并通过一个对象调用了该方法。\n\n问题是，计算机是如何为这些新创建的对象以及 `main()`\
  \ 在内的所有属性和方法分配内存的。\n\n分配过程如下：\n\n在 `Stack` 内存中存储了所有的属性（如 `String myStr`）以及方法部分（如\
  \ `myMethod(MyObject myParam)` 和 `main()`）。\n\n相反，`Heap` 内存只存储类和新创建的对象。`Heap` 部分还负责垃圾回收，这无非就是释放内存空间。\n\
  \n作为一个初学者，你需要非常清楚地理解一点：这些内存分配是同时进行的。你不需要担心这一点。然而，你需要知道幕后是如何发生的。\n\n如果出现这种情况，我们将在接下来的章节中讨论。\n\
  \n## 什么是对象，为什么它们很重要\n\n\n\n\n```java\npublic void questionWiseMen(WiseMen wise){\n\
  \    this.wise = wise;\n    System.out.println(this.name + \" questioned the wisdom\
  \ of \" + wise.name);\n}\n\npublic void sayToWiseMen(WiseMen wise){\n    this.wise\
  \ = wise;\n    System.out.println(this.name + \" said to the \" + wise.name + \"\
  \ hearing\" +\n    \" his death sentence, 'an unexamined life is not worth living'.\"\
  );\n}\n\npublic void dieByDrinking(Hemlock hemlock){\n    this.hemlock = hemlock;\n\
  \    System.out.println(this.name + \" died drinking \" + hemlock.nature);\n}\n\
  ```\n\n之后，我们需要一个 `Plato` 类，同样地，包含一些状态和方法。\n\n```java\n// class Plato\n// blueprint\
  \ of Plato object\npackage fun.sanjibsinha.object;\n\nclass Plato {\n    public\
  \ String name = \"Plato\";\n    Socrates socrates;\n\n    public void hasARelationWith(Socrates\
  \ socrates){\n        this.socrates = socrates;\n        System.out.println(this.name\
  \ + \" had a friendship with \" + socrates.name);\n    }\n    public void writesAbout(Socrates\
  \ socrates){\n        this.socrates = socrates;\n        System.out.println(this.name\
  \ + \" had written about his friend and teacher \"\n        + socrates.name);\n\
  \    }\n}\n```\n\n接下来，我们需要雅典智者们，他们决定了苏格拉底的命运并判处他死刑。\n\n```java\n// class WiseMen\n\
  // blueprint of WiseMen object\npackage fun.sanjibsinha.object;\n\nclass WiseMen\
  \ {\n    public String name = \"Wise men of Athens\";\n    Socrates socrates;\n\n\
  \    public void giveDeathSentenceTo(Socrates socrates){\n        this.socrates\
  \ = socrates;\n        System.out.println(this.name + \" had given death sentence\
  \ to \"\n        + socrates.name);\n    }\n}\n```\n\n`Hemlock` 对象定义在一个小类中，它的状态被声明为毒药。\n\
  \n```java\n// class Hemlock\n// blueprint of Hemlock object\npackage fun.sanjibsinha.object;\n\
  \nclass Hemlock {\n    public String nature = \"Poison\";\n}\n```\n\n通过阅读上面的蓝图或类，我们可以说它们是基于真实故事的。我们编写每个类的方式，使得它们拥有一些状态和行为，例如\
  \ `Socrates` 具有如下状态：\n\n`public String name = \"Socrates\";`\n\n`Socrates` 类还具有类似这样的行为：\n\
  \n```java\npublic void questionWiseMen(WiseMen wise){\n    this.wise = wise;\n \
  \   System.out.println(this.name + \" questioned the wisdom of \" + wise.name);\n\
  }\n```\n\n很明显看出，行为也被称为函数或方法。通过任何方法，我们都可以传递一个或多个参数，例如，在这里我们传递了一个‘WiseMen’对象。我们还给它起了一个名字\
  \ `wise`。现在，不要担心我们使用的关键字，如 `public`，或者结束表达式的语法 `;`。我们稍后会学习它们。你可能已经注意到，我们总是遵循一套规则来编写一个类，以后可以从从中创建一个或多个对象。\n\
  \n我们还注意到，类总是清晰地定义“状态”和“行为”，这样以后就不会产生歧义。计算机不喜欢歧义。它想要清晰的指令；一步步的指令。\n\n从上面的代码中可见，一个或多个对象可以是另一个对象的“状态”。看\
  \ `Socrates` 类：\n\n`public String name = \"Socrates\";`\n`WiseMen wise;`\n`Hemlock\
  \ hemlock;`\n\n这些都是在 `Socrates` 类中定义的“状态”。在三个状态中，两个是“对象”，它们有自己的类。\n\n最后，我们想要通过创建对象来运行应用程序，并根据它们之间的关系来构建我们的算法。\n\
  \n```java\n// code of main() method\npackage fun.sanjibsinha.object;\n\npublic class\
  \ PhilosopherDemo {\n\n    public static void main(String[] args) {\n        Socrates\
  \ socrates = new Socrates();\n        WiseMen wiseMenOfAthens = new WiseMen();\n\
  \        Plato plato = new Plato();\n        Hemlock hemlock = new Hemlock();\n\
  \        socrates.questionWiseMen(wiseMenOfAthens);\n        wiseMenOfAthens.giveDeathSentenceTo(socrates);\n\
  \        socrates.sayToWiseMen(wiseMenOfAthens);\n        socrates.dieByDrinking(hemlock);\n\
  \        plato.hasARelationWith(socrates);\n        plato.writesAbout(socrates);\n\
  \    }\n}\n```\n\n当我们运行应用程序时，我们得到了以下输出：\n\n```\nSocrates questioned the wisdom of\
  \ Wise men of Athens\nWise men of Athens had given death sentence to Socrates\n\
  Socrates said to the Wise men of Athens hearing his death sentence, 'an unexamined\
  \ life is not worth living'.\nSocrates died drinking Poison\nPlato had a friendship\
  \ with Socrates\nPlato had written about his friend and teacher Socrates\n```\n\n\
  我希望这个例子将帮助你理解对象如何包含其他对象并相互通信。被称为“包含关系”（has-a-relationship）。当我们从另一个类继承一个类时，那被称为“是关系”（is-a-relationship）。\n\
  \n我们稍后会详细讨论它们。\n\n\n本章将很短，因为我们在这里只讨论两个关键点。\n\n为了编写并运行 Java 代码，我们特别需要两个东西。第一个是 Java\
  \ 标准版开发包（JDK），第二个东西是一个良好的代码编辑器。\n\n## Java SE 开发包\n\n在网上搜索 Java SE 开发包 11 会带你进入网页：`https://www.oracle.com/technetwork/java/javase/downloads/jdk11-downloads-5066655.html`，你可以在那里下载并安装该包。适用于\
  \ Linux、Windows、Solaris SPARC 和 macOS 的四种包。请记住，对于本书，我使用的是 Java 11 版本，它是稳定的，并且是 Java\
  \ 8 之后的第二个长期支持版本。对于你的个人用途它是免费的，但如果你想将其用于商业用途，则需要付费。\n\n\n\n\n我们将该项目命名为“HundredProblemsInJava”。IntelliJ\
  \ IDEA 2018.2.4 社区版将创建保存此项目的路径。因此，你不需要担心这个问题。\n\n作为基础包，它会要求你输入一个域名。目前，我有一个域名 `https://sanjibsinha.fun`，因此基础包名将是“fun.sanjibsinha”。如果你已经预订了域名，可以使用它。\n\
  \n在接下来的图片（图 2.5）中，我们看到如何编写代码并使用 IntelliJ IDEA 2018.2.4 社区版执行它。\n\n![Figure 2.5 –\
  \ The main() method and the execution](img/Image00005.jpg)\n\n图 2.5 – `main()` 方法与执行\n\
  \nIntelliJ IDEA 2018.2.4 社区版的优势在于，作为一个良好的代码编辑器，它会在你编码时提供大量的提示。我们将随着学习进度共同学习它。\n\n\
  \n在本章中，我们将讨论过程化编程（POP）和面向对象编程（OOP）之间的区别。通过问题，我们还将看到 Java 编程如何在类内部编写的。在问题的背景下，我们还将学习编译器和解释器在处理\
  \ Java 代码中的作用。\n\n\nJava 是一种面向对象编程语言。Java 编程是在类内部编写的。我们稍后就会看到。在此之前，我们想知道过程化编程和面向对象编程之间的关键区别是什么。\n\
  \n过程化编程（POP）由一组指令分步控制和执行。因此，它始终维护一个过程。在这里，数据从顶部流向底部，并将优先级留给函数。\n\n相反，对象是面向对象编程（OOP）的关注焦点。对象封装了类中编写的所有过程，而类是对象的实际蓝图。由于存在访问修饰符，OOP\
  \ 更安全。它也更具读性，因为我们可以为不同的任务编写不同的类，并使它们松耦合。它还有许多更多特性，例如方法和运算符的重载或重写，这些在 POP 中是不存在的。随着你学习的深入，你将了解到更多相关知识。\n\
  \n## Java 程序是在类内部编写的\n\n现在我们来看问题 3，代码 3，我们将尝试理解 Java 程序是如何在类内部编写的。\n\n考虑问题 3，这是一个非常简单的程序，输出“Hello\
  \ World”。\n\n```java\n1 //Problem 3\n2 //code 3\n3 public class Main {\n4     public\
  \ static void main(String[] args) {\n5         System.out.println(\"Hello World\"\
  );\n6     }\n7 }\n```\n\n在上面的代码中，我们看到程序是写在类“Main”内部的。在 `Main` 类内部，我们找到了一个 `public`\
  \ 方法 `main()`。这个 `main()` 方法也是 `static` 和 `void` 的。我们稍后会讨论 `static` 术语。`void` 的意思是不会返回任何值。\n\
  \n在 `main()` 方法内部，我们看到了这一行：\n\n```java\n1 System.out.println(\"Hello World\");\n\
  ```\n\n当你在 IntelliJ 代码编辑器中输入单词 `System` 时，它会自动在左侧显示一个“c”图标。这意味着 `System` 代表 Java\
  \ 中的一个类。在 `System` 之后，如果你使用点符号 `.`，它会显示许多提示，其中我们选择 `out`。当你选择 `out` 时，左侧图标将显示一个“f”符号。这意味着\
  \ `out` 是 `System` 类的字段。在使用 `out` 之后，如果我们再次使用 `.` 符号，它会再次给我们许多提示。在这些许多提示中，我们选择 `println()`。现在在\
