  \n输出是 101。\n\n有四种位运算运算符：AND `&`、OR `|`、XOR `^` 和位取反 `~`。AND `&` 运算符如果两个位都为 1，则为\
  \ 1，否则为 0。OR `|` 运算符如果任意一个位为 1，则为 1，否则为 0。XOR `^` 运算符如果对应的位不同，则为 1，否则为 0。位取反 `~`\
  \ 运算符会将所有位反转。考虑如果你将该运算符应用于一个位模式为“00000000”的字节，它将其变为“11111111”。下一个问题将向你展示如何使用十进制使用这些运算符。当我们在十进制值使用这些运算符时，它是按位检查的。\n\
  \n```java\n1 // problem 61\n2 //code 61\n3 package fun.sanjibsinha;\n4\n5 /*\n6\
  \ 位运算符的简单介绍\n7 10 的二进制是 1010，\n8 11 的二进制是 1011\n9\n10\n11 class ProblemSixty {\n\
  12\n13     public static void main(String[] args) {\n14         int x = 10; // 1010\n\
  15         int y = 11; // 1011\n16\n17         // AND (&) 运算符如果两个位都为 1，则为 1，否则为\
  \ 0\n18         System.out.println((x & y)); // 1010，那是 10\n19         // OR (|)\
  \ 运算符如果任意一个位为 1，则为 1，否则为 0\n20         System.out.println((x | y)); // 1011，那是 11\n\
  21         // XOR (^) 运算符如果对应的位不同，则为 1，否则为 0\n22         System.out.println((x ^\
  \ y)); // 0001，那是 1\n23         // 位取反 (~) 运算符会将所有位反转，意味着它将\n24 0 变为 1，并将 1 变为 0\n\
  25         System.out.println(~x); // 0101，那是 5，5 的补码是 -11\n26     }\n27 }\n```\n\
  \n这里是输出：\n\n```\n1 //output of code 61\n2 10\n3 11\n4 1\n5 -11\n```\n\n### 控制流 –\
  \ 第一部分\n\n源代码通常从上到下执行。通过控制流语句的帮助，我们可以打破执行流的限制。在本节中，我们将看到“决策制定”如何影响控制流语句。\n\n```java\n\
  1 // problem 62\n2 //code 62\n3 package fun.sanjibsinha;\n4\n5 class HumanBehaviour{\n\
  6     boolean isTrustWorthy = false;\n7     int dependenceCounter = 0;\n8 }\n```\n\
  \n\n\n```java\npublic static void main(String[] args) {\n    HumanBehaviour john\
  \ = new HumanBehaviour();\n    john.isTrustWorthy = true;\n    if(john.isTrustWorthy\
  \ == true){\n        //only if the above condition is true, this block will work\n\
  \        john.dependenceCounter++;\n        System.out.println(\"We could depend\
  \ on John because the dependence counter is positive : \" + john.dependenceCounter);\n\
  \    } else {\n        john.dependenceCounter--;\n        System.out.println(\"\
  We could not depend on John because the dependence counter is negative : \" + john.dependenceCounter);\n\
  \    }\n    HumanBehaviour hobgoblin = new HumanBehaviour();\n    if(hobgoblin.isTrustWorthy\
  \ == true){\n        //only if the above condition is true, this block will work\n\
  \        System.out.println(\"We could depend on Hobgoblin because the dependence\
  \ counter is positive : \" + hobgoblin.dependenceCounter);\n    } else {\n     \
  \   //since the above condition is not true, this block will work\n        hobgoblin.dependenceCounter--;\n\
  \        System.out.println(\"We could not depend on Hobgoblin because the dependence\
  \ counter is negative : \" + hobgoblin.dependenceCounter);\n    }\n}\n```\n\n你可能已经知道了输出结果，因为\
  \ `if` 块只有在布尔表达式为时才会执行。\n\n```\n//output of code 62\nWe could depend on John because\
  \ the dependence counter is positive : 1\nWe could not depend on Hobgoblin because\
  \ the dependence counter is negative : -1\n```\n\n使用决策语句（如 `switch`）则有些不同。`switch`\
  \ 语句仅根据单个整数、枚举值或 `String` 对象对表达式进行测试。相反，`if-then-else` 可以根据取值范围或条件对表达式进行测试。\n\n\
  下一个问题将向你展示 `switch` 的工作。\n\n```\n// problem 63\n//code 63\npackage fun.sanjibsinha;\n\
  \n/*\nBased on ranges of values or conditions, if-the-else can test expressions.\n\
  A switch statement tests expressions based only on a single integer, enumerated\
  \ value, or String object\n*/\n\nclass Human{\n    int age;\n    String name;\n\
  \    public void display(int displayAge, String displayName){\n        this.age\
  \ = displayAge;\n        this.name = displayName;\n        System.out.println(\"\
  Age of the person : \" + displayAge + \". Name of the person : \" + displayName);\n\
  \    }\n}\n\npublic class SixtyThree {\n    public static void main(String[] args){\n\
  \        Human personOne = new Human();\n        Human personTwo = new Human();\n\
  \        Human personThree = new Human();\n\n        Human[] persons = new Human[2];\n\
  \        persons[0] = personOne;\n        Human[] personCollection = {personOne,\
  \ personTwo, personThree};\n        for (int i = 0; i < 3; i++){\n            switch\
  \ (i){\n                case(0):\n                    personCollection[i].display(10,\
  \ \"Sanjib\");\n                    break;\n                case(1):\n         \
  \           personCollection[i].display(20, \"John\");\n                    break;\n\
  \                case(2):\n                    personCollection[i].display(30, \"\
  Robert\");\n                    break;\n            }\n        }\n    }\n}\n```\n\
  \n在上面的代码中，我们使用了一个包含两个状态的类——`age` 和 `name`。我们通过将它们作为参数传递的方法来更改状态。在 `main()` 方法中，我们初始化了一个包含该类对象的数组容器对象。我们提到了数组对象中应该有三个元素。其余部分非常简单。\n\
  \n```\n// output of code 63\nAge of the person : 10. Name of the person : Sanjib\n\
  Age of the person : 20. Name of the person : John\nAge of the person : 30. Name\
  \ of the person : Robert\n```\n\n在本章中，我们学习了如何使用不同类型的运算符，还看到了 `if-then-else` 和 `switch`\
  \ 语句是如何工作的。\n\n# 第八章：迭代结构、入口控制和出口控制循环\n\n正如我们之前看到的，在许多代码段中，源文件内部的语句通常从上到下执行。循环语句也不例外。在本章中，我们将尝试理解包含\
  \ `for`、`while` 和 `do-while` 的循环语句是如何工作的。我们还将学习分支语句，如 `break`、`continue` 和 `return`。\n\
  \n在循环中，一个语句或一组语句会重复执行，直到条件满足。正如我们刚刚看到的，Java 编程支持三种类型的循环。它们是：\n\n1. `for 循环`\n2.\
  \ `while 循环`\n3. `do-while 循环`\n\n我们可以将这些循环大致分类为入口控制和出口控制。\n\n## 入口控制循环：固定和固定迭代\n\
  \n在入口控制循环中，首先检查条件。如果不满足，意味着条件不成立，进程停止，不进入循环体。`for 循环`和 `while 循环`都属于这一类。然而，这两种入口控制循环结构之间存在巨大差异。\n\
  \n在 `For 循环` 中，迭代次数是固定的。循环从控制变量的给定值开始。根据条件更新变量的值。一旦条件变为假，就会跳出循环。\n\n为什么它是入口控制的？在进程进入体之后，它首先检查条件。\n\
  \n### 固定迭代\n为了理解固定迭代，让我们阅读下面的代码。\n\n```\n// problem 64\n//code 64\npackage fun.sanjibsinha;\n\
  \npublic class SixtyFour {\n    public static void main(String[] args) {\n     \
  \   int[] myNumbers = {10, 20, 30, 40};\n        for (int i = 0; i < myNumbers.length;\
  \ i++){\n            System.out.println(myNumbers[i]);\n        }\n    }\n}\n```\n\
  \n阅读代码段中的注释。我们正在通过索引值的迭代来读取数组元素。条件检查数组的长度。当到达末尾时，它跳出循环体。\n\n```\n//output of code\
  \ 64\n10\n20\n30\n40\n```\n\n在上面的代码段中，我们看到了三个表达式。我们可以这样写：\n\n- `for 循环语句` 使用初始化表达式进行初始化。我们进入循环体。接下来我们检查条件，我们可以称之为终止表达式。一旦条件为真，循环开始。\n\
  - 当条件为假时，终止表达式也评估为假，循环停止。\n- 在整个循环表达式中，第三部分是递增或递减表达式。\n\n\n\n\n下一个问题涉及代码语句的另一个有趣部分。它被称为分支语句。通过使用\
  \ `continue` 和 `break` 关键字，我们可以控制循环的移动。首先来看这个问题。\n\n### 问题 65：Continue 和 Break\n\
  \n```java\n// problem 65\n//code 65\npackage fun.sanjibsinha;\n\npublic class ProblemSixtyFive\
  \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
  Continue statement: \");\n        //continue 语句告诉控制跳过当前语句\n        //循环执行剩余的语句\n\
  \        for(int i = 0; i < 5; i++){\n            if(i == 2){\n                continue;\n\
  \            }\n            System.out.println(i);\n        }\n        System.out.println(\"\
  Break statement: \");\n        for(int i = 0; i < 5; i++){\n            if(i ==\
  \ 2){\n                break;\n                //当此条件为真时，循环终止\n            }\n \
  \           System.out.println(i);\n        }\n    }\n}\n```\n\n在第一种情况下，`continue`\
  \ 关键字跳过了某个值并且循环继续。在第二种情况下，当迭代匹配到精确的值时，它将不再移动。循环在该特定点终止。观察输出，你就能理解这个逻辑。\n\n```text\n\
  //output of code 65\nContinue statement:\n0\n1\n3\n4\nBreak statement:\n0\n1\n```\n\
  \n我们可以通过这种方式创建一个无限循环：\n\n```java\n// infinite loop\nfor ( ; ; ) {   \n    // some\
  \ code\n}\n```\n\n我们可以使用 `for` 循环解决各种类型的问题。下一个问题将显示两个正数之和的 4 次迭代结果。如果和为负数，则循环结束。\n\
  \n### 问题 66：数字相加\n\n```java\n// problem 66\n//code 66\npackage fun.sanjibsinha;\n\
