  \        car1.stateOfCar();\n        car2.changeGear(2);\n        car2.speedUp(20);\n\
  \        car2.stateOfCar();\n        car2.changeGear(1);\n        car2.stopCar(0);\n\
  \        car2.stateOfCar();\n    }\n}\n```\n\n如你上面的代码所示，我们创建了两个汽车对象。我们还提供了方法 `stopCar`\
