  \ ReferenceType {\n    String nameOne = \"John\";\n    String nameTwo;\n    AnotherClass\
  \ anotherClass;\n    void givingOutput() {\n        System.out.println(\"The first\
  \ name is : \" + nameOne + \". The second name is\n        : + nameTwo + \". \"\
  Here is another class: \" + anotherClass);\n    }\n}\n\npublic class ProblemSeventeen\
  \ {\n    public static void main(String[] args){\n        byte firstNumber;\n  \
  \      byte secondNumber = 1;\n        firstNumber = secondNumber;\n        System.out.println(\"\
  The value of first number : \" + firstNumber);\n        System.out.println(\"The\
  \ value of second number : \" + secondNumber);\n        secondNumber = 2;\n    \
  \    System.out.println(\"The value of first number : \" + firstNumber);\n     \
  \   System.out.println(\"The value of second number : \" + secondNumber);\n\n  \
  \      PrimitiveType objectOne = new PrimitiveType();\n        objectOne.height\
  \ = objectOne.age;\n        objectOne.printState();\n        objectOne.height =\
  \ 2;\n        objectOne.printState();\n\n        WrapperClassExample objectTwo =\
  \ new WrapperClass();\n        objectTwo.printingState();\n        objectTwo.numberOne\
  \ = 1;\n        objectTwo.numberTwo = objectTwo.numberOne;\n        objectTwo.printState();\n\
