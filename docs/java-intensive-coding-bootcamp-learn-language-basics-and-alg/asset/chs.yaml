  \ 等）以及字符串的输入。这是从键盘读取用户输入的最简单方法。\n\n下一个问题向我们展示了 `Scanner` 类如何获取输入并产生输出。输出之后我们将我们将讨论其底层机制。\n\
  \n### 问题 92\n\n#### 代码 92\n```java\npackage fun.sanjibsinha;\n\nimport java.util.Scanner;\n\
  \npublic class ProblemNinetyTwo {\n    /*\n    我们可以将它声明为 main() 方法之外的静态变量并在类内部使用\n\
  \    */\n    // static Scanner userInput = new Scanner(System.in);\n\n    public\
  \ static void main(String[] args)\n    {\n        Scanner sc = new Scanner(System.in);\n\
  \        System.out.print(\"Your favorite number: \");\n\n        if (sc.hasNextInt())\n\
  \        {\n            int numEntered = sc.nextInt();\n            System.out.println(\"\
  You entered \" + numEntered);\n\n            // 你可以进行每一个基础数学运算\n            int\
  \ addTheNumberEntered = numEntered + numEntered;\n            System.out.println(\"\
  Adding together: \" + addTheNumberEntered);\n            numEntered += 1;\n    \
  \        System.out.println(\"1 increment: \" + numEntered);\n            numEntered\
  \ -= 2;\n            System.out.println(\"2 decrement: \" + numEntered);\n\n   \
  \         numEntered++;\n            System.out.println(\"One increment: \" + numEntered);\n\
  \            numEntered--;\n            System.out.println(\"One decrement: \" +\
  \ numEntered);\n\n        } else {\n            System.out.println(\"Sorry you have\
  \ not entered an integer\");\n        }\n    }\n}\n```\n\n这里是输出结果，我们可以看到如何对用户输入进行所有的数学运算。\n\
  \n```\noutput of 92\nYour favorite number: 563\nYou entered 563\nAdding together:\
  \ 1126\n1 increment: 564\n2 decrement: 562\nOne increment: 563\nOne decrement: 562\n\
  ```\n\n正如你在上面的代码中所看到的，我们把预定义的对象 `System.in` 作为参数传递到 `Scanner` 构造函数内部。`System.in`\
  \ 对象代表标准输入流。如果我们想从读取输入，可以传递任何其他对象，例如 `File` 类的对象。\n\n如果我们想读取特定的原始数据类型（如 `int`），我们使用\
  \ `nextInt()` 方法。对于 `float`，我们使用 `nextFloat()`；对于 `double`，使用 `nextDouble()`；对于字符串，使用\
  \ `nextLine()`。正如你所推测的，还有针对 `Boolean`、`Byte`、`Long` 和 `Short` 的其他方法。然而，并不是所有我们需要的方法都会用到。\n\
  \n根据惯例，我们还可以检查用户输入是否真的是一个整数。当我们构建软件或任何应用程序时，用户输入起着至关重要的作用。但我们不能信任所有的用户。我们想要整数输入，但他们可能会尝试一些奇奇怪的值。我们需要为此做好准备。为了检查输入是否为整数，我们有\
  \ `hasNextInt()` 方法。如果下一个输入的值是整数，它将返回 true。其他类型也同样适用。在上面的代码中，我们类似地检查了用户输入。下一个问题将向你展示相同的方法，其中我们检查字符串输入是否为\
  \ true。\n\n### 问题 93\n\n#### 代码 93\n```java\npackage fun.sanjibsinha;\n\nimport\
  \ java.util.Scanner;\n\npublic class ProblemNinetyThree {\n    static String name\
  \ = \"sanjib\";\n\n    public static void main(String[] args) {\n        System.out.println(\"\
  Enter your name: \");\n        Scanner sc = new Scanner(System.in);\n        if(sc.hasNext()){\n\
  \            String yourName = sc.next();\n            if(yourName.equals(name)){\n\
  \                System.out.println(\"Your name is: \" + yourName);\n          \
  \      int i = 0;\n                while (i <= yourName.length()){\n           \
  \         i++;\n                }\n                System.out.print(\"There are\
  \ \" + (i - 1) + \" characters in your name.\");\n            } else {\n       \
  \         System.out.println(\"You have not entered proper name.\");\n         \
  \   }\n        } else {\n            System.out.println(\"Next time ...\");\n  \
  \      }\n    }\n}\n```\n\n```\noutput of code 93\nEnter your name:\nsanjib\nYour\
  \ name is: sanjib\nThere are 6 characters in your name.\n---------------\nEnter\
  \ your name:\njohn smith\nYou have not entered proper name.\n```\n\n对于第一情况，我们输入了正确的值，而下一次我们输入了错误的值。要读取单个字符，我们使用这种方法：`next().charAt(0)`。\n\
