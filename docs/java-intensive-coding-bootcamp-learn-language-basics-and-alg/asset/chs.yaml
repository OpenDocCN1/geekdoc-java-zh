  3 10\n4 -2\n5 -5\n6 -3\n7 45\n8 负数的和为：-10\n```\n\n同样的方法，我们可以获取输入并打印奇数数的和。\n\n```java\n\
  1 // 问题 70\n2 // 代码 70\npackage fun.sanjibsinha;\n\n/*\n接受任意 5 个数字并打印奇数数的和\n */\n\
