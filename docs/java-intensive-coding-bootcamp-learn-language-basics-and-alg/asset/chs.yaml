  \n无论如何，理解面向对象编程的概念是极其重要的。特别是理解面向对象编程中的抽象思想是强制性的。\n\n下一章将展示异常处理的案例。\n\n# 第十二章：异常处理\n\
  \n正如章节标题所示，这一章也会非常短，它的目的是让你对 Java 如何处理错误有一个基本的了解。\n\n## 关于异常处理的简要说明\n\n当错误发生时，会创建一个异常对象。这个异常对象会告诉我们所发生的错误。在编程过程中，会创建许多类型的异常对象。其中之一就是\
  \ `java.lang.Exception`。Java 编译器会检查这些异常。\n\n在 Java 虚拟机 (`JVM`) 正常运行期间可能会抛出异常。作为程序员，捕获它们是我们的责任。\n\
  \n在下一个问题中，我们将学习处理常见的 Java 异常之一——`ArithmeticException`。你不能将一个数字除以零。\n\n```java\n\
  1 // 问题 99\n2 // 代码 99\npackage fun.sanjibsinha;\n\nclass CheckingDivision {\n \
  \   public int num;\n\n    public void restrictDivisionByZero(int num) {\n     \
  \   try {\n            this.num = num;\n            System.out.println(num/0);\n\
  \        } catch (ArithmeticException e) {\n            //你的自定义消息\n            System.out.println(\"\
  You can't divide by 0\");\n            // java 的错误消息\n            System.out.println(e.getMessage());\n\
  \            // 异常名称和错误消息\n            System.out.println(e.toString());\n     \
  \       // 你也可以打印标准的错误堆栈轨迹\n            e.printStackTrace();\n        }\n    }\n\
  }\n\npublic class ProblemNinetyNine {\n    public static void main(String[] args)\
  \ {\n        CheckingDivision checkDivision = new CheckingDivision();\n        checkDivision.restrictDivisionByZero(10);\n\
  \    }\n}\n```\n\n在输出中，我们首先看到自定义消息。之后我们得到了 Java 的错误消息。接着显示异常名称和错误消息。最后，我们得到了标准的错误堆栈轨迹。\n\
  \n```\n1 //代码 99 的输出\nYou can't divide by 0\njava.lang.ArithmeticException: / zero\n\
  java.lang.ArithmeticException: / zero\nat fun.sanjibsinha.CheckingDivision.restrictDivisionByZero(ProblemNinetyNine.java:10)\n\
  at fun.sanjibsinha.ProblemNinetyNine.main(ProblemNinetyNine.java:33)\n```\n\n随着学习的进行，你还会遇到几个在\
  \ Java 编程中常见的其他异常。有时，我们会忘记传递参数，这会产生 `IllegalArgumentException`。在处理数组时，你可能会遇到 `IndexOutOfBoundsException`。这些异常非常详尽，所以你可以理解发生了哪些类型的异常。可能会调用一个不存在的类，随后你会得到\
  \ `ClassNotFoundException`。还有一些我们没有讨论过的异常。然而，我希望这一个问题能对这个主题提供一些启发。\n\n# 第十三章：数据结构，简要介绍\n\
  \n书的最后一个问题，一百个问题敲开了一个非常大领域的大门——数据结构和算法。在我看来，它值得单独写一本书，或许可以让你对它们有一个公平的了解。我们针对中级学习者的下一个训练营将从数据结构和时间复杂度开始。不要忘记查看它。\n\
  \n这是一个非常大的领域，意味着随着学习的深入，数据量呈几何倍数增长。我们需要知道如何使用数据进行存储、搜索和许多多样的操作。这不是一项简单的任务。这就是为什么“大数据”一词会出现的原因。数据结构和算法现在受到了更多关注。\n\
  \n我们将如何管理这组数据？你已经见过数组 `array`。然而，数组有很多局限性，例如它持有固定数量的单一类型值。你不能改变它。为了克服这些局限性，Java\
  \ 引入了核心接口。它们封装了不同类型的集合。你已经学习了接口的作用，它实际上是一份契约。因此它允许集合被独立操作。Java 集合框架的基础由这些核心接口组成：`Set`、`List`、`Deque`\
  \ 和 `Map`。在最后一个问题中，我们看到了 `LinkedList` 类的示例，它是一个基于链表的集合。正如名称所示，它是一个持有数据的容器，每个容器都有一个链接标识符，连接到下一个或上一个。最后一个链接标识符总是\
  \ `null`，因为它不指向任何地方。现在情况是：`A` 连接到 `B`，`B` 连接到 `C`，`C` 连接到 `D`，依此类推。如果你想在 `C` 和 `D`\
  \ 之间添加一个对象（假设为 `E`），Java 会为每个人设置新的链接标识符，链条不会中断。它会像以前一样自动维护。当你想要对集合进行许多添加和删除操作时，它们非常好。你可以在任何地方添加。下一个问题将向你展示\
