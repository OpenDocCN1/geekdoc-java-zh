  \ sum = 0;\n    static int controllingNumber = 1;\n\n    public static void main(String[]\
  \ args) {\n```\n\n\n\n\n\n```java\nScanner sc = new Scanner(System.in);\nSystem.out.println(\"\
  Enter any 5 number: \");\nwhile (controllingNumber <= 5){\n    num = sc.nextInt();\n\
