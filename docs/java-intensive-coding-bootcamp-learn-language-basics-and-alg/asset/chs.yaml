  \ `speedOfCar`。第一个是 `byte`，另一个是 `int`。\n\n这里是输出：\n\n```output\n1 // 第十四题的输出\n2 Error:(23,\
  \ 26) java: incompatible types: possible lossy conversion from int to byte\n```\n\
  \n发生这种情况是因为 `byte` 数据类型是一个 8 位有符号补码整数。它可以存储 -128 到 127 之间的值。但 `int` 数据类型是 32 位有符号补码整数。虽然它们都表示数值，但当你将\
  \ `byte` 数据类型与 `int` 数据类型相等时，它无法正确转换值。\n\n让我们来看问题 15，理解这个问题。\n\n```code\n1 // 问题\
  \ 15\n2 // 代码 15\npackage fun.sanjibsinha;\n\nclass StatesOfAnObject {\n\n    byte\
  \ age = 10;\n    byte length = 100;\n    int speedOfCar = 1_00_000;\n\n    void\
  \ printState() {\n        System.out.println(\"The age is : \" + age + \". The distance\
  \ is : \" + length +\n               \". The speed of car is : \" + speedOfCar);\n\
  \    }\n}\n\npublic class ProblemFifteen {\n    public static void main(String[]\
  \ args){\n        StatesOfAnObject state = new StatesOfAnObject();\n        state.speedOfCar\
  \ = state.age + state.length;\n        state.printState();\n    }\n}\n```\n\n在这里，汽车速度的状态\
  \ `speedOfCar` 代表 `int` 数据类型。另外两个状态（`age` 和 `length`）代表 `byte` 数据类型。\n\n看输出：\n\n\
  ```output\n1 // 问题 15 的输出\n2 The age is : 10. The distance is : 100. The speed of\
  \ car is : 110\n```\n\n类型不兼容的问题在这里没有出现。我们将看到更多例子。让我们来看问题 16，我们在那里使用了局部变量并出现了相同的问题。\n\
  \n我们仍然可以用不同的方式解决此问题：\n\n```code\n1 // 问题 16\n2 // 代码 16\npackage fun.sanjibsinha;\n\
  \n/*\n涵盖问题 5 到 7\n */\npublic class ProblemSixteen {\n    public static void main(String[]\
