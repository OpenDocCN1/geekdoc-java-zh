  \n\n# 错误: (8, 34) java: incompatible types: possible lossy conversion from int to\
  \ byte\n\n我们需要找到为什么发生这种情况？如你所知，`byte` 是最小的整数数据类型。你可以为 `byte` 变量赋值 `(-128)` 到 `127`\
  \ 之间的整数范围。然而，`byte` 没有像 `int` 或 `long` 那样的字面量或常量。这意味着你不能将整数常量表达式赋值给 `byte` 变量。我脑想到的另一个解释是，在\
  \ Java 中，`int` 类型使用 32 位进行编码，而 `byte` 类型使用 8 位。如果你将一个 `int` 转换为 `byte`，可能会丢失信息。然而，我们可以使用引用变量执行相同的操作。我们将在第五章讨论该话题。\n\
  \n在上面的程序中，当我们把两个 `byte` 变量相加时，它会变成一个 `int` 字面量表达式。你不能再将其等一个 `byte` 变量。我们现在无法将 `int`\
  \ 常量转换为 `byte`。\n\n我们可以通过两种方法解决这个问题。第一种解决方案在这里。\n\n### 问题 6\n\n```java\n//code 6\n\
