  \ 代码 52 的输出\n```\nThe age of three Persons : 10, 20, 30\n```\n\n下一个问题将向你展示一段稍微复杂的代码片段，其中我们使用了对象数组，并通过方法来改变类中定义的对象状态。\n\
  \n#### 问题 53\n```java\npackage fun.sanjibsinha;\n\nclass Mobile {\n    int modelNumber;\n\
  \    String modelName;\n    public void displayModels(int model, String name) {\n\
  \        this.modelName = name;\n        this.modelNumber = model;\n        System.out.println(\"\
  The model number : \" + model + \". The model name : \" + name);\n    }\n}\npublic\
  \ class ProblemFiftyThree {\n    public static void main(String[] args) {\n    \
  \    // 在堆中创建了三个手机对象\n        // 栈中的三个引用变量指向堆\n        Mobile sam = new Mobile();\n\
  \        Mobile red = new Mobile();\n        Mobile zen = new Mobile();\n      \
  \  // 对象数组可以像任何基本数据类型一样被创建\n        Mobile[] mobiles = {sam, red, zen};\n      \
  \  for (int i = 0; i < mobiles.length; i++) {\n            // 我们希望型号数字从 10 开始\n\
  \            int j = 10;\n            j += i;\n            if (i == 0) {\n     \
  \           mobiles[i].displayModels(j, \"Sam\");\n            } else if (i == 1)\
  \ {\n                mobiles[i].displayModels(j, \"Red\");\n            } else {\n\
  \                mobiles[i].displayModels(j, \"Zen\");\n            }\n        }\n\
  \    }\n}\n```\n\n在输出中，我们得到了不同的型号数字和名称。\n\n#### 代码 53 的输出\n```\nThe model number\
  \ : 10. The model name : Sam\nThe model number : 11. The model name : Red\nThe model\
  \ number : 12. The model name : Zen\n```\n\n我们将用“增强循环”（enhanced loop）这一概念来结束数组这个章节。Java\
  \ 允许我们直接从任何数组中获取元素。我们之前使用相应的索引来获取数组元素。但这次使用 `for` 循环，我们可以直接获取元素。\n\n#### 问题 54\n\
  ```java\npackage fun.sanjibsinha;\n\npublic class ProblemFiftyFour {\n    public\
  \ static void main(String[] args) {\n        int[] myNumbers = {12, 18, 6, 24};\n\
  \        // 增强 for 循环\n        // 它直接从数组中取值\n        for (int i : myNumbers) {\n\
  \            System.out.println(i);\n        }\n    }\n}\n```\n\n输出是完全预期的。它将显示属于对应数组的元素。\n\
  \n#### 代码 54 的输出\n```\n12\n18\n6\n24\n```\n\n尽管 Java 中的数组有一些限制性，但它也有一些用处。为了解释数组，我们使用了条件结构、`if-else`、`for`\
  \ 循环等。我们应该尽可能地学习并掌握它们，以便学习 Java 语言核心及相关概念。在接下来的三个章节（7、8 和 9 章）中，我们将通过更多的问题来讨论它们。我的建议是，在掌握条件结构之后，你应该再次回顾数组，我希望这些算法看起来会比以前更容易。\n\
  \n# 第七章：运算符和条件语句\n\n我们已经学习了一些重要的概念，例如如何将对象存储在字段中，如何通过调用这些变量来命名字段。我们还看到了如何使用数组，即一种存储许多元素或数据类型的容器对象。现在的问题在于如何对它们进行操作。在很多情况下，我们使用赋值运算符\
  \ `=` 分配值或初始化值。在给两个操作数赋值后，我们可以使用 `+` 符号将它们相加。我们可以使用此类符号在在一个或多个操作数上执行许多类型的操作。这些符号被称为运算符。在本章中，我们将使用运算符探索许多此类操作。我们还会发现这些运算符在许多方面有所不同。\n\
  \n## 算术运算符和一元运算符\n\n算术运算符执行加、减、乘、除。在基础数学中，我们经常见到它们。唯一新的是模运算 `%`。通过使用这个符号，我们将一个操作数除以另一个，并返回余数作为结果。在下一个问题中，我们将看到算术运算符和一元运算符是如何工作的。阅读问题中的注释，你将理解这些运算符是如何工作的。\n\
  \n### 问题 55\n```java\npackage fun.sanjibsinha;\n\npublic class ProblemFiftyFive\
  \ {\n    public static void main(String[] args) {\n        // 赋值运算符从右到左求值\n    \
  \    // 数据类型的声明分配内存\n        // 变量 x 存储值 10\n        int x = 10;\n        int y\
  \ = 20;\n        // 算术运算符 +, -, *, /, %\n        int result = x + y;\n        System.out.println(result);\n\
  \        result = result - x;\n        System.out.println(result);\n        result\
  \ = x * y;\n        System.out.println(result);\n        result = y / x;\n     \
  \   System.out.println(result);\n        y = y - 1;\n        // 现在 y = 19\n    \
  \    result = y % x;\n        // 余数是 9\n        System.out.println(result);\n  \
  \      // 算术运算符可以拼接字符串\n        String firstName = \"John\";\n        System.out.println(firstName\
  \ + \" \" + lastName);\n        // 一元运算符需要一个操作数\n        int a = 12;\n        //\
  \ a 是正数\n        System.out.println(a);\n        a = -a;\n        // a 是负数\n   \
  \     System.out.println(a);\n        a--;\n        // -12 = -13\n        System.out.println(a);\n\
  \        a++;\n        // -13 + 1 = -12\n        System.out.println(a);\n    }\n\
  }\n```\n\n#### 代码 55 的输出\n```\n30\n20\n200\n2\n9\nJohn Rambo\n12\n-12\n-13\n-12\n\
  ```\n\n### 一元运算符的特殊性\n\n一元运算符只需要一个操作数。它可以增加或减少操作数的值，使变量变为负值，最后它可以反转布尔值。在下一个问题中，我们有了各种使用一元运算符的操作。\n\
