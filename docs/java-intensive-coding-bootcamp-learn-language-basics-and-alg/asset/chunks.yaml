    \ `main()` method and the execution\n\nThe advantage of IntelliJ IDEA 2018.2.4\
    \ Community Edition is as a good code editor, it will give you plenty of tips\
    \ at the time of coding. We will learn it together, as we progress.\n\n# Chapter\
    \ Three: How Java Programming Works\n\nIn this chapter we will discuss the difference\
    \ between Procedural (POP) and Object Oriented Programming (OOP). Using problems,\
    \ we will also see how Java programming is written within a class. In the context\
    \ of a problem, we will also learn the role of compiler and interpreter in processing\
    \ Java code.\n\n## Difference between POP and OOP\n\nJava is an object-oriented-programming.\
    \ Java programming is written within a class. We will see it in a minute. Before\
    \ that, we would like to know what is the key difference between procedural and\
    \ object-oriented-programming.\n\nA procedural programming (POP) is governed and\
    \ executed step-by-step by a set of instruction. So it always maintains a procedure.\
    \ Here data flows down from the top to the bottom and the priority is given to\
    \ the functions.\n\nOn the contrary, objects are the main focus in the object-oriented-programming\
    \ (OOP). Objects encapsulate all the procedures written in the class, which is\
    \ the actual blueprint of the objects. OOP is more secured as there are access\
    \ specifiers. It is also more readable, because we can write different classes\
    \ for doing different tasks and make them loosely coupled. There are many more\
    \ features like method and operator overloading or overriding that are not present\
    \ in the POP. As you progress, you’ll learn more about this.\n\n## Java program\
    \ is written within a class\n\nNow we come to the problem three, code three, where\
    \ we will try to understand how a Java program is written within a class.\n\n\
    Consider the problem three, which is a very simple program that gives an output\
    \ of “Hello World”.\n\n```java\n1 //Problem 3\n2 //code 3\n3 public class Main\
    \ {\n4     public static void main(String[] args) {\n5         System.out.println(\"\
    Hello World\");\n6     }\n7 }\n```\n\nIn the above code, we have seen that the\
    \ program is written within a class “Main”. Inside that `Main` class we find a\
    \ `public` method `main()`. This `main()` method is also `static` and `void`.\
    \ We will discuss about the term `static` later. The meaning of `void` is it will\
    \ not return any value.\n\nInside that `main()` method, we see this line:\n\n\
    ```java\n1 System.out.println(\"Hello World\");\n```\n\nWhen you type the word\
