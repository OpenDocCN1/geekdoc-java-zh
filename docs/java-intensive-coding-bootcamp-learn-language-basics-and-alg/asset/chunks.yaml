    There are four types of bitwise operators. AND – `&`, OR – `|`, XOR – `^`, and
    Complement – `~`. For AND (`&`) operator if both bits are 1, it gives 1, else
    it gives 0. For OR (`|`) operator if either of the bits is 1, it gives 1, else
    it gives 0. For XOR (`^`) operator if corresponding bits are different, it gives
    1, else it gives 0. For Complement (`~`) operator with all bits are inversed.
    It makes every 0 to 1, and every 1 to 0.


