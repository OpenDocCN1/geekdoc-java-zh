  trans: "\n我们将类型写为 `int[]` 或 `String[]`。当我们提到该类型时，我们实际上指的是所包含的元素的数据类型。为什么要使用括号呢？仅仅是为了告诉编译器该变量持有一个数组。当我们声明数组时，在括号内部不需要指定大小或长度。这会在后面的部分完成。\n\
    \n同样，我们可以声明并创建一个对象数组。它的创建方式与原始数据类型的数组一样。\n\n```java\nPerson[] persons = new Person[3];\n\
    ```\n\n在上一个问题（问题 53）中，我们已经详细讨论了这个话题。\n\n同样，我们可以以这种方式声明其他类型的数组：\n\n```java\nbyte[]\
    \ anyName;\nshort[] anyName;\nlong[] anyName;\nfloat[] anyName;\ndouble[] anyName;\n\
    boolean[] anyName;\nchar[] anyName;\nString[] anyName;\n```\n\n下一个问题将向你展示如何为不同类型的变量声明、初始化并分配内存。请阅读问题\
    \ 33 编写的注释。\n\n```java\n// problem33\n// code 33\npackage fun.sanjibsinha;\n\n\
    /*\n数组对象简介\n原始数据类型不是从类创建的对象。它们是语言内置的特殊数据类型。\n为了构建数组对象，我们需要借助原始数据类型的帮助。\n唯一的例外是\
    \ String\n什么特征会将数组与原始数据类型区分开？\n让我们来看这个问题\n*/\n\npublic class ProblemThirtyThree\
    \ {\n    public static void main(String[] args) {\n        // 原始数据类型的一个示例\n  \
    \      // 变量是一个包含值或原始数据类型的容器\n        int myAge = 54;\n        System.out.println(\"\
    An example of primitive data type : \" + myAge);\n        // 对于数组，我们使用 new 关键字进行声明和内存分配\n\
    \        // 下面的数组容器持有固定数量的 int 类型数据值\n        // 数组的长度已经建立\n        // 在这里长度为\
    \ 2，这个容器有 2 个元素\n        int[] myBasket = new int[2];\n        // 每个项目或元素都有一个从\
    \ 0 开始的对应数值索引\n        myBasket[0] = 2;\n        myBasket[1] = 3;\n        //\
    \ 每个元素都可以通过其对应的数值索引访问\n        System.out.println(\"The first element of my basket\
    \ : \" + myBasket[0]);\n        System.out.println(\"The second element of my\
    \ basket : \" + myBasket[1]);\n    }\n}\n```\n\n输出给了我们关于如何以不同方式处理这些变量的思路。\n\n\
    ```text\n// output of problem 33\nAn example of primitive data type : 54\nThe\
    \ first element of my basket : 2\nThe second element of my basket : 3\n```\n\n\
