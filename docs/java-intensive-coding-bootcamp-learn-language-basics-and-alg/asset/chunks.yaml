    \n    static int reverseNumber(int num){\n        while (num > 0){\n         \
    \   remain = num % 10;\n            temp = temp * 10 + remain;\n            num\
    \ /= 10;\n        }\n        return temp;\n    }\n\n    static boolean isPrime(int\
    \ num){\n        if (num <= 1) return false;\n        if (num <= 3) return true;\n\
    \        if (num % 2 == 0 || num % 3 == 0) return false;\n        for (int i =\
    \ 5; i * i <= num; i = i + 6)\n            if (num % i == 0 || num % (i + 2) ==\
    \ 0)\n                return false;\n        return true;\n    }\n\n    static\
    \ boolean isTwistedPrime(int num){\n        if (isPrime(num) == false) return\
    \ false;\n        return isPrime(reverseNumber(num));\n    }\n}\n\npublic class\
    \ ProblemEightySeven {\n    static int num = 0;\n\n    public static void main(String[]\
