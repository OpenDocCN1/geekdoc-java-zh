    Chapter Eleven: Interface and Abstraction


    Using Interface in object-oriented-programming is really tricky. The concept demands
    more attention than it appears. We have already seen some examples of abstraction
    or encapsulation. A class is a good example of abstraction. It encapsulates every
    detail from the users.


    Users do things with objects without knowing what is happening behind, how it
    was designed in a blueprint. Interface takes that concepts of abstraction to a
    higher level. Let us give a concrete example to understand how it works.


    Suppose a school wants to measure the weight of every student for medical purpose.
    The school authority hires a contractor and gives the contract. The school authority
    does not care about how the work has been done. They want records and the contract
    is implemented. The students also don’t know why their weights are taken. Now
    this contract can be implemented in other spheres. A book company might want to
    compare the number of pages of the books they have published. They can also implement
    this.


    Since the objects are nouns, we treat interfaces as adjectives that tells us something
    about the objects. In the above scenario, the student objects are comparable.
    The book objects are also comparable.


    Another advantage of interface is we can implement multiple interfaces. Just like
    a noun that may have multiple adjectives. A person is good as well as honest.


    A class can be extended and at the same time, it may implement multiple interfaces.
    The next problem is a showcase for the same example.


