    \n## 第七章：运算符和条件语句\n\n我们已经学习了一些重要的概念，例如如何将对象存储在字段中，如何通过调用这些变量来命名字段。我们还看到了如何使用数组，即一种存储许多元素或数据类型的容器对象。现在的问题在于如何对它们进行操作。在很多情况下，我们使用赋值运算符\
    \ `=` 分配值或初始化值。在给两个操作数赋值后，我们可以使用 `+` 符号将它们相加。我们可以使用此类符号在在一个或多个操作数上执行许多类型的操作。这些符号被称为运算符。在本章中，我们将使用运算符探索许多此类操作。我们还会发现这些运算符在许多方面有所不同。\n\
    \n### 算术运算符和一元运算符\n\n算术运算符执行加、减、乘、除。在基础数学中，我们经常见到它们。唯一新的是模运算 `%`。通过使用这个符号，我们将一个操作数除以另一个，并返回余数作为结果。在下一个问题中，我们将看到算术运算符和一元运算符是如何工作的。阅读问题中的注释，你将理解这些运算符是如何工作的。\n\
    \n#### 问题 55\n```java\npackage fun.sanjibsinha;\n\npublic class ProblemFiftyFive\
    \ {\n    public static void main(String[] args) {\n        // 赋值运算符从右到左求值\n  \
    \      // 数据类型的声明分配内存\n        // 变量 x 存储值 10\n        int x = 10;\n        int\
    \ y = 20;\n        // 算术运算符 +, -, *, /, %\n        int result = x + y;\n     \
    \   System.out.println(result);\n        result = result - x;\n        System.out.println(result);\n\
    \        result = x * y;\n        System.out.println(result);\n        result\
    \ = y / x;\n        System.out.println(result);\n        y = y - 1;\n        //\
    \ 现在 y = 19\n        result = y % x;\n        // 余数是 9\n        System.out.println(result);\n\
    \        // 算术运算符可以拼接字符串\n        String firstName = \"John\";\n        String\
    \ lastName = \"Rambo\";\n        System.out.println(firstName + \" \" + lastName);\n\
    \        // 一元运算符需要一个操作数\n        int a = 12;\n        // a 是正数\n        System.out.println(a);\n\
    \        a = -a;\n        // a 是负数\n        System.out.println(a);\n        a--;\n\
