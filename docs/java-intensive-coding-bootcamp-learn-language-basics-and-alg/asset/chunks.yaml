    \        } catch (ArithmeticException e) {\n            //your custom message\n\
    \            System.out.println(\"You can't divide by 0\");\n            //java's\
    \ error message\n            System.out.println(e.getMessage());\n           \
    \ //the exception name and error message\n            System.out.println(e.toString());\n\
    \            //you can also print the standard error stack trace\n           \
    \ e.printStackTrace();\n        }\n    }\n}\n\npublic class ProblemNinetyNine\
    \ {\n    public static void main(String[] args) {\n        CheckingDivision checkDivision\
    \ = new CheckingDivision();\n        checkDivision.restrictDivisionByZero(10);\n\
    \    }\n}\n```\n\nIn the output, we have the custom message first. After that\
    \ we get the java’s error message. The the exception name and error message are\
