    \ 5\n        ageCollection = new int[5];\n        //在循环中动态创建元素\n        for (int\
    \ i = 0; i <= 4; i++){\n            int j = 18;\n            ageCollection[i]\
    \ = j++;\n            System.out.println(\"Element at index \" + i + \" => \"\
