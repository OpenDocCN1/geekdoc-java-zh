    null


    16 The another name of AnotherClass : Alina


    17 The another name of AnotherClass takes the value of another object : SS


    18 The first name is : SS. The second name is : John. Here is another class object:
    null


    From the above code, we have learned a key concept. Every primitive data type
    has a default value, such as byte, short, int data types all have default value
    0.


    Furthermore, the instance variables that are declared at the class level, have
    a default value “null”. Our output gives us the same value. On the hand, local
    variables that are declared within a method, do not have any default value. They
    should be initialized. In the above code, we have also used wrapper class, such
    as “Byte numberOne”. Each primitive type has a corresponding wrapper like this:


    1 byte, short, int, long, float, double, boolean, char


    2 Byte, Short, Integer, Long, Float, Double, Boolean,    Character


    The default value of wrapper objects are null. On the other hand, primitive types
    can never be null, as we have seen before.


    In the next chapter, we will dig deep into these topics.


