    I hope, this example will help you to understand how objects contain other objects,
    communicating with each other. It is also known as ‘has-a-relationship’. When
    we inherit one class from another, that is called ‘is-a-relationship’.


    We will discuss them later in detail.


    Chapter Two: Java Standard Edition Development Kit and IDE


    This chapter will be short as we will discuss only two key points here.


    To write Java code and run it as well, we need two things in particular. The first
    one is Java Standard Edition Development kit and the second thing is a good code
    editor.


    Java SE Development kit


    Searching Java SE Development kit 11 on web will take you to the web page, https://www.oracle.com/technetwork/java/javase/downloads/jdk11-downloads-5066655.html,
    where you can download and install the kit. There are four types of kits available
    for Linux, Windows, Solaris SPARC, and macOS. Please remember, for this book,
    I have used Java version 11, which is stable and it is the second long term support
    release after Java 8\. For your personal purpose it is free, but if you want to
    use it in commercial purpose, you have to pay.


    Another great thing of Java 11 is its compatibility with the code editor IntelliJ
    IDEA 2018.2.4 Community Edition, which we are going to write and execute our code.


    The following image (Figure 2.1) will show you the web page.


    ![Figure 2.1 – The web page from where you can download Java SE Development kit](OEBPS/Image00001.jpg)


    Figure 2.1 – The web page from where you can download Java SE Development kit


    According to your operating system, please download and install it so that in
    your code editor IntelliJ IDEA 2018.2.4 Community Edition will find the path,
    where you’ve saved the kit. The advantage is plenty. As you progress by solving
    the problems, you’ll find it. In the next section I’ll give you a few screenshots
    of IntelliJ IDEA 2018.2.4 Community Edition, which I’ve used for this book projects.
    Besides, this code editor, there are two great code editors you can always use
    for your Java application development. They are NetBeans and Eclipse.


    IntelliJ IDEA 2018.2.4 Community Edition


    Whatever your computer operating system is, you can easily install this code editor.
    The following image (Figure 2.2) shows you how to choose the path where you’ve
    installed the Java SE Development kit in your machine.


    My operating system is Ubuntu 18\. If you have a different operating system, that
    path may differ(Figure 2.2).


    ![Figure 2.2 – Selecting the home directory for the Project SDK](OEBPS/Image00002.jpg)


    Figure 2.2 – Selecting the home directory for the Project SDK


    Usually, it automatically chooses a home directory by default. However, in most
    cases, it is wrong. Therefore, you click the “new” button on the right hand side
    and select the correct path.


    The next image (Figure 2.3) will show you what type of application we’re going
    to make with this code editor.


    ![Figure 2.3 – We are going to select the Command Line App](OEBPS/Image00003.jpg)


    Figure 2.3 – We are going to select the Command Line App


    Because we’re going to learn how to code using Java by solving problems, the Command
    Line App will work fine for us.


    The next image (Figure 2.4) will show you how to name the project and where it
    will be saved.


    ![Figure 2.4 – Creating the project by giving it a name](OEBPS/Image00004.jpg)


