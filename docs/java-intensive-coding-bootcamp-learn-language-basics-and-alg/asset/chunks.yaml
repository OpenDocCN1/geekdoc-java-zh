    \ (Armstrong Number)\n\n下一个问题似乎在 Java 社区中经常出现。在给定范围内寻找阿斯特斯特姆数是一项相当依赖代码的体验。在此之前，我们应该知道它在数论中到底意味着什么。它也被称为自恋数（narcissistic\
    \ number），因为它是每个数字位等于其位数幂之和。\n\n考虑数字 `153`。数字的位数是 `3`。现在，如果将该数字的每个位都进行 `3` 次幂，它们的和等于\
    \ `153`。\n\n记住这个逻辑，从 `0` 到 `9`，所有的数字都是阿斯特斯特姆数或自恋数。\n\n### 问题 84\n\n#### 代码 84\n\
    ```java\npackage fun.sanjibsinha;\n\n// 根据用户输入寻找阿斯特斯特姆数\nimport java.util.Scanner;\n\
