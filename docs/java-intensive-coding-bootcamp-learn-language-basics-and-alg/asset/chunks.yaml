    # Java 强化编码训练营：学习语言基础与算法


    包含百多道带解决方案的难题题 - 逐步详解，专为完全初学者设计


    Sanjib Sinha


    © 2020-21 Sanjib Sinha


    ## 第一章：Java，一种有目的的高级语言


    高级语言更接近人类语言。它在某种程度上独立于机器或计算机。Java 正契合了这一特征，因为它满足了高级语言的所有条件。由于`Java Virtual Machine`
    (`JVM`)，它是机器无关的。在 Java 创建时，口号是——编写一次，处运行。初学者可能会觉得这很难理解；我们稍后会详细讨论。


    当你沿着语言树继续向下探索时，你会发现在任何高级语言的下方都是汇编语言。在下面的一层是机器语言，它更接近硬件。


    机器语言非常不同。它只有计算机才能理解。它是二进制数字或位（bits）的集合，只有计算机可以识别。计算机可以读取并解释 `0` 和 `1`。因此，每种高级语言都应该被翻译成机器语言，以便它最终能够与硬件通信。


    能够与硬件通信是每种高级语言追求的终极目标。


    从 `Fortran`、`C`、`Pascal`、`C++` 开始，我们可以列出除 Java 之外许多流行的高级语言，如 `PHP`、`Python`、`Dart`
    等。


    我们也可以将编程语言树与英语等人类语言进行比较。根据约翰·科林森·内斯菲尔（John Collinson Nesfield）的《英语语法：过去与现在；附韵律、同义词及其他课题》，英语属于雅言语系。英语的直接祖先是日耳曼语。从日耳曼语演化出了低地德语（包括英语）和高地德语。


    现在考虑一个既不会说话也听不见见的人。在这种情况下，我们使用手语来创建一些图像。通信活动通过这些图像完成。字母是字母表的视觉表示。


    自然语言从字母或文字开始，单词由字母组成；请记住，字母（letters）和字母表（alphabets）之间是有的，尽管人们认为它们本质上是相同的。无论如何，让我们继续学习单词。通过单词的帮助，我们构建句子；句子构成段落、文章、故事、诗歌、戏剧等。


    单词不能随机放置来组成句子。那样没有任何意义。因此，在单词和句子之间存在语法。


    什么是语法？一组排列单词以使句子语义的规则。没有这些规则，我们就无法构建有意义的句子。没有有意义的句子，我们就无法创建有意义的段落、故事、诗等。我们甚至无法与他人进行有意义的交流。


    我们可以得出结论，每种自然语言都有目的，要么你想写有意义的内容，要么你想与人进行有意义的交流。


    对任何编程语言都是如此。每种编程语言都有目的。在某些情况下，它的目的是执行某些特定任务，例如在创建时，`PHP` 是为了让网站动态化。现在 `PHP` 是一种通用语言；通过它的帮助，我们不仅能让小型网站动态化，还能创建更健壮、复杂的
    Web 应用。


    Java 也是如此。学习 Java 的历史。你会发现它是如何演变成一种运行在数十亿不同设备上的通用面向对象编程语言的。你发现在智能电视、卫星、烹饪设备、人工智能物体、健壮且复杂的软件（如桌面和
    Web 应用程序）、Android 移动应用等；；列表是无尽的。


    就像自然语言一样，如果不知道 Java 的语法或基础，我们就无法制作此类软件或应用程序。因此，我们学习 Java 有目的。而且，Java 是一种可以创建不同类型应用的通用语言。


    ## 谁应该读这本书以及关于下一次训练营


    这本书将赋予计算机科学和编程专业的学生学习 Java 语言基础的能力；以便他们用 Java 构建应用程序。这是第一次采用“直接教学法”使用“问题-解决方案-讲解”方法的书籍；它像一个强化型的编码训练营，参与者将积极参与开发他们的逻辑和分析思维，以便解决交互性问题。由于原因，我们还将掌握
    `Data Structures` 和 `Algorithm` 的基础。


    我们将共同学习 Java 的语言基础，首先解决许多类型的问题。这将帮助我们构建在下一个 Java 训练营系列中讨论的应用程序，在那个系列我们将开发应用。在第一个训练营中，我们将开始编写代码。如果你不能在池里游一小会，你就不会游泳。因此，我们将通过解决问题来学习
    `objects`（对象）、`classes`（类）、`primitive data types`（基本数据类型）、`arrays`（数组）、逻辑 `if-else`、`switch-case`、`loop
    constructs`（循环结构）等。


    让我们从小程序开始，结果随之而来；由于它们是由某些现象引起的，我们将在之后学习理论。我们将先研究问题，然后解决它并练习更多相关问题。之后我们再讨论理论。


    毕竟，我们想通过 Java 的帮助构建许多应用程序，这是我们学习 Java 的主要目的。尽管 `Abstraction`（抽象）隐藏在幕后，但我们将通过解决问题来学习它们。


    随着学习的进行，通过解决从简单到复杂的 100 多道问题，我们将学习 Java 语言基础及其相关的核心概念。


    ## 从高级语言到机器语言


    让我们看一个简单的 Java 程序，它接收用户输入并给出输出，例如“Hello World”。


    ```java

    1 //Problem 1

    2 //code 1

    3 package fun.sanjibsinha;

    4

    5 import java.util.*;

    6 import java.util.Scanner;

    7 import java.lang.String;

    8 public class Main {

    9

    10     public static void main(String[] args) {

    11      //在此处编写你的代码

    12         String s;

    13         Scanner in = new Scanner(System.in);

    14         System.out.println("Enter a string");

    15         s = in.nextLine();

    16         System.out.println("You entered string " + s);

    17

    18     }

    19 }

    ```


    这里是输出：

    ```

    1 Enter a string

    2 Hello World

    3 You entered string Hello World

    4

    5 Process finished with exit code 0

    ```


    然而，文本“Hello World”在机器语言中看起来完全不同。它的输出如下：

    ```

    1 01001000 01100101 01101100 01101100 01101111 00100000 01010111 01101111 01110010
    01110014 00100000

    2 01100 0110101

    ```


