    As a beginner, it may seem a little bit difficult for you to understand how these
    data types work. So, in the next chapter, we will discuss this topic along with
    object-oriented-programming concepts , so that after finishing chapter four you
    can start writing some simple code snippets on your own.


    Chapter Four: Objects and Data Types


    In the first part of this chapter we will discuss object-oriented-programming
    concepts. In the second part we will dig deep into the concepts of primitive and
    non-primitive types. This discussion will not be a dry potato-fry. We will add
    some sauce, of course. Our source of spice and sauce is problems-solutions-explanations
    resources.


    We have so far discussed seven different problems. Through those problems, we
    have tried to understand various basic concepts. From now on, we will identify
    each problem with an individual class committed to that problem, such as the next
    problem, that is “Problem eight” will be written as a class “ProblemEight”, “Problem
    nine” will be written as a class “ProblemNine”, and so on.


    Objects Share Two Characteristics


    To understand object-oriented-programming technology, we need to understand objects
    first. We have reproduced real world objects’ behavior and state in the programming
    world. Looking around us helps us find how the real world objects are moving around
    us. Humans, dogs, computers, cars, and many many more.


    Taking a deep-down-look will give us more insights about objects. We find that
    real world objects share two characteristics. They all have state and behavior.
    Humans have state, such as name, height, anger, etc. And they have behaviors,
    like shouting, walking, running, etc. One thing is pretty sure that each object
    has its own complexities. It varies. The complexities of a human cannot be the
    same as a dog. A human can smile. A dog cannot. Instead, they wag their tails.
    The performance of their behaviors are different. In some cases, comparing the
    similarities, it seems they may have a parent class. Some objects may contain
    other objects.


    However, we are not going to discuss those topics here. Because this is an introductory
    chapter to objects and classes, we try to keep it as simple as possible. To start
    with all we need to know that there is a relation between an object and a class.
    To create an object, we need to write its states and behaviors inside a class.
    You may think it as a blueprint.


    The problem eight deals with one car object. To make it simple, we keep two states:
    gear and speed. When gear is up, the speed is increasing. Reducing of the speed
    is also related to gear. In that case, gear is down. Those are behaviors. The
    action part of the object. Since we are attributing states (latest speed or gear),
    we can also call them as attributes of an object. When we change that state or
    attribute, we need to provide some methods. So a car has a state called speed,
    and it also has a method called “speedUp” to change that current speed.


    Therefore, in a class we need to design and write them separately. Moreover, in
    some cases, we need some whole numbers; in some cases, we need decimal point values.
    In many cases, we also need texts, which are actually a sequence of characters.
    That is why, after a brief introduction to object-oriented-programming, we will
    discuss primitive data types, such as integers, floating point values, etc.


    We need to write a Car class first. After that, we will create a car object inside
    the main() method.


