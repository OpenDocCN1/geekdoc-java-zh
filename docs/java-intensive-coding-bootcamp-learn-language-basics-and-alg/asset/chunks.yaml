    The advantage of ANT is IDE, like NetBeans or Eclipse ships with ANT. Another
    great advantage is while creating a Java ANT application, you can mention the
    libraries path, where you can place the Apache Commons Lang JAR file. After that
    you can easily import the external Lang utilities in your projects. ANT also supplies
    many built-in tasks allowing you to compile, assemble, test, and run your applications.
    For further reading please visit this link: https://ant.apache.org/.


