    10


    11         //entry controlled loop


    12         // fixed iteration


    13         // loop starts with the given value


    14         // next it checks the condition


    15         // unless the given condition is false, it executes


    16         for (int i = 0; i < myNumbers.length; i++){


    17             System.out.println(myNumbers[i]);


    18         }


    19


    20     }


    21 }


    Read the comments written inside the code snippets. We are reading the elements
    of an array by iteration of the index value. The condition checks the length of
    the array. When it reaches the end, it comes out from the loop body.


    Before that it gives us all the values.


    Let us see the output.


    1 //output of code 64


    2 10


    3 20


    4 30


    5 40


    In the above code snippet, we have seen three expressions. We can write it this
    way:


    1 • The ‘for loop statement’ is initialized with an initialization expression.
    We ente\


    2 r the body of loop. Next we check the condition, we can call it the termination
    expr\


    3 ession. Once the condition is true, the loop begins.


    4 • When the condition is false, the termination expression also evaluates to
    false, a\


    5 nd the loop stops.


    6 • In the whole loop expression, the third part is the increment or decrement
    express\


    7 ion. After each iteration, it is invoked depending upon the condition or the
    termina\


    8 tion expression given.


    We can imagine this iteration as the act of hopping, jumping either forward or
    backward. Furthermore, this ‘hop’ or ‘iteration’ is fixed. We can control this
    by increment or decrement.


    We can also suddenly stop the loop statement by applying ‘break’. We can skip
    one value midway and then starts looping again from the next value. We will see
    that in a minute.


