    ## 原始数据类型


    到为止，我们已经看到了 11 种不同的问题，其中大多数我们见过整数值。在声明变量时，我们也注意到一个关键点。我们这样写一个变量：`int speed = 0;`。


    这意味着我们需要指定它是什么类型的变量。声明变量的类型和名称是关重要的，因为 Java 是静态类型的。这意味着在使用所有变量之前，必须先声明它们。


    通过命名和声明变量，我们实际上是在声明对象的状态。在 `Car` 类中，当我们声明变量 `speed` 时，程序知道存在一个字段，并且该字段持有数值数据。它还有一个任何初始值，例如
    0 或 1。这解释了为什么我们需要数据类型。


    变量的数据类型告诉我们它是什么类型的值。因为它代表了对象的状态，我们需要知道它包含了什么类型的值。否则，我们无法通过方法来改变该状态。基本上，在方法中，我们通过某些操作来改变该对象的状态。


    Java 总共支持 8 种原始数据类型。


