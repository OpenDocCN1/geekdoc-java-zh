    Chapter Eight: Iterative Constructs, Entry and Exit Controlled Loops


    As we have seen earlier, in many code snippets, the statements inside our source
    files are generally executed from top to bottom. The looping statements are no
    exception. In this chapter, we will try to understand how looping statements that
    include ‘for, while and do-while’, work. We will also learn about the branching
    statements, such as break, continue, return.


    In loop, a statement or a set of statements are repeatedly execute till the condition
    is satisfied. As we just saw, there are three types of loops supported by Java
    programming. They are:


    1 1\. for loop


    2 2\. while loop


    3 3\. do-while loop


    We can broadly categorize these loops as Entry controlled and Exit controlled.


    Entry Controlled loop: Fixed and Unfixed Iteration


    In entry controlled loop, the condition is checked first. If it is not satisfied,
    that means the condition is not true, the process stops, it does not enter the
    loop body. The ‘for loop’ and the ‘while loop’, both belong to this category.
    However, there is a big difference between these two entry controlled looping
    constructs.


    In case of ‘For loop’ the number of iterations is fixed. Here the loop starts
    with a given value of a control variable. According to the condition the value
    of the variable gets updated. Once the condition becomes false, it comes out from
    the loop.


    Why it is entry controlled? After the process enters the body of loop, it first
    checks the condition. If it is true,only then it goes back to the starting point
    of the loop and gets updated. Let us learn by solving the problem, as usual.


    Fixed Iteration


    To understand the fixed iteration, let us read the code below.


     1 // problem64


    2 //code 64


    3 package fun.sanjibsinha;


