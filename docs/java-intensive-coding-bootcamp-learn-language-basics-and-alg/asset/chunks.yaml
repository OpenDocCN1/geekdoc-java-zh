    ‘for loop’ statement, once the initialization expression initializes the loop
    (int i = 0),it is executed once, as the loop begins. That is why the output of
    ‘for loop’ starts with 0, and the output of ‘while loop’ starts with 1.


    In the next section we will see how exit controlled loop works.


    Exit Controlled loop


    In this case, there is no restriction on the control to enter the loop. The decision,
    whether the process will repeat or terminate, will be made at the exit point of
    the loop. Since the condition or termination expression evaluates at the exit
