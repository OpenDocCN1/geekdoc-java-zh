    Chapter Seven: Operators and Conditional Statements


    We have learned a few important concepts, such as how to store an object in the
    fields, how to name a field, by calling them variables. We have also seen how
    we can use array, the container object that stores many elements or data types.


    Now, question is, how to do something with them. In lots of cases, we have assigned
    a value or initialize the value by using an assignment operator (=). After assigning
    a value to two operands, we can add them by using a ‘+’ symbol. We can perform
    many types of operations on one or more than one operands by using such symbols.
    These symbols are called operators. In this chapter we will explore many such
    operations, using operators. We will also find how these operators differ in many
    respects.


    Arithmetic and Unary Operators


    Arithmetic operators perform addition, subtraction, multiplication, and division.
    In basic mathematics, we have seen them quite often. The only new one is mod,
    ‘%’ symbol. By using this symbol, we divide one operand by another and return
    the remainder as the result.


