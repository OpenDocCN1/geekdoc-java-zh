    16 }


    It will produce errors. Watch the output below.


    1 //output of problem 20


    2 Error:(12, 62) java: cannot find symbol


    3 symbol:   variable weight


    4 location: class fun.sanjibsinha.ProblemTwenty


    When local variables are declared inside a method, it should be used in that method
    only. We can call that method later.


    In the next problem, we will find another key factor. Local variables should be
    initialized. Otherwise, it gives us errors.


     1 //problem 21


