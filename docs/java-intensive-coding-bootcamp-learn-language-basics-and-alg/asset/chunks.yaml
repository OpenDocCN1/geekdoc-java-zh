    \n此外，子类还可以根据情况添加它自己的功能。\n\n我们没有在子类中重复 `MobileClass` 的任何功能。那是代码冗余。我们不希望这样做。我们为什么要这样做呢？我们已经扩展了父类的所有功能。\n\
