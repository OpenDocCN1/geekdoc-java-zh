    ![](cover1.jpeg)


    # JAVA INTENSIVE CODING BOOTCAMP: LEARN LANGUAGE BASICS AND ALGORITHM


    More than Hundred Difficult Problems with Solutions - Explained Step by Step,
    Designed for Absolute Beginners


    Sanjib Sinha


    © 2020-21 Sanjib Sinha


    ## Chapter One: Java, a High Level Language with a Purpose


    A high level language is closer to human language. It is more or less machine
    or computer independent. Java fits into this puzzle because it satisfies every
    condition of a high level language. Because of `Java Virtual Machine` (`JVM`),
    it is machine independent. When Java was created, the slogan had been – code once,
    run everywhere. A beginner might find this difficult to understand; we will talk
    about them later, in detail.


    As you go further down in the language tree, you will find assembly language just
    below any high level language. On a floor below there is machine language, which
    is closer to the hardware.


    Machine language is really different. It is only understood by the computer. It
    is a collection of binary digits or bits that only computer can understand. Computer
    can read and interpret that `0` and `1`. Therefore, every high level language
    should be translated to machine language so that it can finally talk to the hardware.


    Being able to talk to the hardware is the final target where every high level
    language shoots at.


    Starting with `Fortran`, `C`, `Pascal`, `C++`, we can name many more popular high
    level languages besides Java, such as `PHP`, `Python`, `Dart`, etc.


    We can also compare this programming language tree with human language like English.
    According to John Collinson Nesfield’s “English Grammar, Past and Present; With
    Appendices on Prosody, Synonyms, and Other Outlying Subjects”, the language English
    belongs to the Aryan family of Languages. The immediate ancestor of English is
    Teutonic. From Teutonic, comes Low German (including English) and High German.


    Now consider a human being who is neither able to speak, nor he can hear. In that
    case, we use sign languages to create some images. The activity of communication
    is done by those images. Letters are visual representation of alphabets.


    A natural language starts with alphabets or letters, and words are built with
    letters; remember, there is a difference between letters and alphabets, although
    people think they are essentially same. Anyway, let us move ahead with words.
    With the help of words, we make sentences; and, sentences make paragraphs, essays,
    stories, poems, plays, etc.


    Words cannot be placed randomly to make sentences. That does not make any sense.
    Therefore, between words and sentences, comes in grammar.


    What is grammar? A set of rules that arranges words to make sentences meaningful.
    Without those rules we cannot make meaningful sentences. Without meaningful sentences
    we cannot create meaningful paragraphs, stories, poems, etc. Even we cannot communicate
    meaningfully with another person.


    We can conclude that every natural language has a purpose, either you want to
    write something meaningful, or speak to somebody meaningfully.


    That is true for any programming language. Every programming language has a purpose.
    In some cases, it is targeted to do some specific tasks, such as, at the time
    of its creation, `PHP` was meant to make a website dynamic. Now `PHP` is a general
    purpose language; with its help we not only make a small website dynamic, but
    also we create more robust and complex web applications.


    The same is true for Java. Study the history of Java. You will find how it has
    evolved to be a general purpose object-oriented-programming language that runs
    billions of disparate devices. You will find Java in smart TV, satellite, cooking
    devices, artificially intelligent objects, robust and complex software, like desktop
    and web applications, Android mobile applications, etc; the list is endless.


    Just like natural languages, without knowing the grammar or the language basics
    of Java, we cannot make such software or applications. Therefore, we have a purpose
    to learn Java. And, Java is a general purpose language that could create different
    types of applications.


    ## Who Should Read this Book and What about the Next Bootcamp


    This book will empower computer science and programming students to learn the
    language basics of Java; so that, they could build applications in Java. It is
    for the first time that a book with a “problems-solutions-explanations” approach
    using “Direct Method”; it is like an intensive coding bootcamp where participants
    will take active part to develop their logical and analytical thinking so that
    they could solve interactive problems. For that reason, we will get our head around
    the basics of `Data Structures` and `Algorithm` also.


    We are learning the language basics of Java together to solve many types of problems
    first. It will help us to build applications that are discussed in the next Java
    bootcamp series, where we will develop applications. Here, in this first bootcamp,
    we will start writing code first. If you cannot take a short swim in the pool,
    you cannot learn swimming. Therefore, we will learn about `objects` and `classes`,
    `primitive data types`, `arrays`, logical `if-else`, `switch-case`, `loop constructs`,
    etc. by solving problems.


    Let us start with small programs, the result follows; since it is caused by some
    phenomenon, we will learn the theory thereafter. We will study the problem first,
    then we solve it and practice some more relevant problems. After that we will
    discuss theory.


    After all, we want to build many applications with the help of Java, that is our
    main purpose of learning Java. Although the `Abstraction` stays behind the curtain,
    we will learn them with the help of our problems.


    As we progress, by solving more than 100 problems from simple to complex, we will
    learn the Java language basics and its related core concepts.


    ## High Level to Machine Language


    Let us see a simple Java program that takes input from a user and gives an output,
    such as “Hello World”.


    ```java

    1 //Problem 1

    2 //code 1

    3 package fun.sanjibsinha;

    4

    5 import java.util.*;

    6 import java.util.Scanner;

    7 import java.lang.String;

    8 public class Main {

    9

    10     public static void main(String[] args) {

    11      // write your code here

    12         String s;

    13         Scanner in = new Scanner(System.in);

    14         System.out.println("Enter a string");

    15         s = in.nextLine();

    16         System.out.println("You entered string " + s);

    17

    18     }

    19 }

    ```


    And here is the output:

    ```

    1 Enter a string

    2 Hello World

    3 You entered string Hello World

    4

    5 Process finished with exit code 0

    ```


    However, the text “Hello World” looks completely different in machine language.
    Here is the output:

    ```

    1 01001000 01100101 01101100 01101100 01101111 00100000 01010111 01101111 01110010
    01110014 00100000

    2 01100 0110101

    ```

