    An Array in Disarray


    In many Java programs you will see tow types of main method.


    1 1) public static void main(String[] args){}


    2 2) public static void main(String args[]){}


    In fact, in our last 32 problems, we have used the second type. From now on we
    will keep using the first one. Why? Any particular reason?


    No. Java allows both. Java makes no difference between this two statement. However,
    in Array chapter we will find that declaration of an array by using the second
    one, is discouraged in their official documentation.


    Logically, from now on we will stick around with the first one.


    What is an Array


    As we have seen earlier, an array is a container object or a type of variable
    that holds a fixed number of values.


    These values should be of a same type. We should also mention the length when
    create an array. When the array is created, that length is established. A variable
    could also be container that holds one value of single type. An array is a container
    that holds many value. So an array is just another kind of variable.


    Let us first try to have an image of an array in our mind. A variable is a box;
    an array is also a box with many compartments. Inside each compartment, we keep
    one value. Enhancing the capacity of our container has been increased drastically.


    The following figure (figure 6.1) shows you how values can be stored inside an
    array container object.


    ![Figure 6.1 – An array of 5 elements with the index starting from 0](OEBPS/Image00009.gif)


    Figure 6.1 – An array of 5 elements with the index starting from 0


    In the above array-figure we have not mentioned any value of the elements. However,
    it is clear that the fifth element is related to the index 4.


    As you progress, you will find that an array plays a key role in building any
    complex software. Understanding data structures is a key component in any programming
    language. Learning array is the first step towards it.


    Creating many compartments inside a box, is not difficult. Nevertheless, they
    should be ordered. They should be indexed properly and each index should point
    to an element. It looks like this:


    1 INDICES => index 0->index 1->index 2->index 3->...index n


    2 ELEMENTS => element 1->element 2->element 3->element 4->....element n+1


    Don’t get confused with the letter ‘n’. That indicates the last index and element.
    It could be of any numerical value. Suppose an array has ten elements or items.
    They are kept separately in the compartment. Now each compartment has a numerical
    index, through which we can access the value or element kept in those compartments.
    As a rule of thumb, this index begins with 0.


    For that reason, if there are 10 compartments in the array container box, there
    will be 10 indices but it will start from 0, and ends at 9\. The index 0 points
    to the element 1,and it goes on like this.


    We declare array many ways:


    1 1.


    2 int[] myNumberCollection = new int[5];


    3 2.


    4 int[] myNumberCollection;


    5 myNumberCollection = new int[5];


    6 3.


    7 int[] myNumberCollection = {1, 2, 56, 57, 23};


    In the first two cases, we need to add elements to the array container manually.
    Like this:


    1     // initializing first element


    2         myNumberCollection[0] = 1;


    3         // initializing second element


    4         myNumberCollection[1] = 2;


    In the third case, we have shown above, we have added the elements while declaring
    the array.


    Accessing those elements is also very easy.


    1 System.out.println("Element at index 0 : " + myNumberCollection[0]);


    2


    3 It will give an output : 1.


    As we have found so far, there are many characteristics in an array. We can simply
    have a declaration, like this: “int[] myNumbers;”. The declaration does not create
    an array. It just tells the compiler, ‘Get ready, this variable will hold an array
    of specified type. This variable box will have many compartments.’.


    As you see, the declaration of an array is similar to declaration of any variables
    of other types. Primarily, it involves two components: the data type and the name.'
