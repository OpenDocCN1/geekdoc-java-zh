    \n由于对象是名词，我们将接口视为形容词，它们告诉我们关于对象的某些信息。在上面的场景中，学生对象是可比较的。书籍对象也是可比较的。\n\n接口的另一个优势是我们可以实现多个接口。就像一个名词可能有多个形容词一样。一个人可以既善良又诚实。\n\
