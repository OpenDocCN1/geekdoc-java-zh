    ```\n1 //output of code 99\nYou can't divide by 0\njava.lang.ArithmeticException:\
    \ / zero\njava.lang.ArithmeticException: / zero\nat fun.sanjibsinha.CheckingDivision.restrictDivisionByZero(ProblemNinetyNine.java:10)\n\
    at fun.sanjibsinha.ProblemNinetyNine.main(ProblemNinetyNine.java:33)\n```\n\n\
    As you will progress, you will encounter a few more common exceptions that occur\
    \ in Java programming. Sometimes, we forget to pass the parameters. It gives us\
    \ `IllegalArgumentException`. While handling an array you may encounter this `IndexOutOfBoundsException`.\
    \ These exceptions are very verbose, so you can understand what types of exceptions\
    \ occur. You may call a class that does not exist, thereafter you get `ClassNotFoundException`.\
    \ There are several exceptions that we have not discussed. However, I hope this\
    \ single problem has thrown some light on the topic.\n\n# Chapter Thirteen: Data\
    \ Structure, A Brief Introduction\n\nThe last problem of the book, the hundredth\
    \ problem knocks on the door of a very big topic – data structures and algorithm.\
    \ In my opinion, it deserves a separate book that might give you a fair idea of\
    \ what they are. Our next bootcamp for Intermediate Learners will start with Data\
    \ Structures and Time Complexity. Do not forget to check that out.\n\nIt is a\
    \ very big topic, in the sense, as we progress the volume of data is multiplying.\
    \ We need to know how to store, search and do many varied operations using data.\
    \ This is not a easy task. That is why the term ‘Big Data’ has popped up. Data\
    \ structures and algorithm gets more attention now.\n\nHow will we manage this\
    \ collection of data? You have already seen `array`. However, array has many limitations,\
    \ such as it holds fixed number values of a single type. You cannot change it.\
    \ To overcome such limitations, Java introduces core interfaces. They encapsulate\
    \ different type of collections. You have learned the role of an interface, it\
    \ is actually a contract. So it allows collections to be manipulated independently.\
    \ The foundation of Java Collections Framework consists of such Core Interfaces:\
    \ `Set`, `List`, `Deque`, and `Map`. In the last problem, we have seen an example\
