  trans: "\n我们在 `main()` 方法内部使用了大括号来区分局部变量的位置。在花括号之外调用它将导致错误。\n\n1. 输出是：10。\n\n接下来的两个问题将使用循环结构，我们还没有涵盖过这部分。我们将在接下来的章节中详细讨论它们。然而，这两个问题将让你理解关于变量命名的核心概念。\n\
    \n```java\n1 //problem 31\n2 //code 31\n3 package fun.sanjibsinha;\n\npublic class\
    \ ProblemThirtyOne {\n    public static void main(String args[]){\n        int\
    \ anyNumber = 10;\n        for (anyNumber = 0; anyNumber <=5; anyNumber++){\n\
    \            System.out.println(anyNumber);\n        }\n        System.out.println(anyNumber);\n\
    \    }\n}\n```\n\n由于我们已经定义过变量 `anyNumber`，所以我们不能再次声明它。尽管我们在外层循环部分中声明了它，但内部循环获取了相同的值，最终在循环完成后，它改变了外层循环的值。\n\
    \n```text\n1 //output of problem 31\n0\n1\n2\n3\n4\n5\n6\n```\n\n在本章的最后一个问题中，我们检查了相同的变量命名规范，其中内部循环是单独声明的。此后，它无法改变外层循环的值。\n\
    \n```java\n1 //problem 32\n2 //code 32\npackage fun.sanjibsinha;\n\npublic class\
    \ ProblemThirtyTwo {\n    public static void main(String args[]){\n        //variable\
    \ name of outer loop\n        int anyNumber = 10;\n        //we cannot define\
    \ the variable twice\n        //it has already been defined as int\n        //the\
    \ following is not a continuation of outer loop, it's an inner loop\n        //hence\
    \ the variable name is changed\n        for (int myNumber = 0; myNumber <=5; myNumber++){\n\
    \            System.out.println(\"Output of inner loop : \" + myNumber);\n   \
    \     }\n        System.out.println(\"Output of outer loop : \" + anyNumber);\n\
    \    }\n}\n```\n\n看这里的输出。外层循环的值不再是 6 了。\n\n```text\n1 //output of problem 32\n\
    Output of inner loop : 0\nOutput of inner loop : 1\nOutput of inner loop : 2\n\
    Output of inner loop : 3\nOutput of inner loop : 4\nOutput of inner loop : 5\n\
    Output of outer loop : 10\n```\n\nJava 的命名规范与其他编程语言没有区别。它有自己你必须遵循的规则。虽然你可以像这样写变量：`int\
    \ $anyNumber` 或 `int anyNumber`，但认为在任何变量名前之前使用 `$` 或空格符号是不良好的做法。以字母开始你的变量名。也不允许使用空格。如果你想存储一个常量：\n\
    \n```java\nstatic final int NUM_OF_EYES = 2;\n```\n\n命名规范是可以更改的。这些是可以使用 `_` 的特殊情况。否则不建议这样做。变量名是大小写敏感的，且你不能声明两次相同的变量名。我们在上面已经见过此类问题。最后，你不能使用关键字或保留字作为你选择的变量名。\n\
    \n# 第六章：数组——容器对象\n\n在本章中，我们将学习数组（Array）。我们之前见过，变量是内存中的一个位置，它有一个包含值的名称。这个值可以是任何数据类型，例如\
    \ `int`。数组也是另一种变量或容器对象，它持有固定数量的单一类型的值。因此，数组可以是任何数据类型，例如 `int` 或 `String`。在之前的程序中，我们曾无意中使用过数组。看下面的代码片段：\n\
    \n```java\npublic static void main(String[] args){}\n```\n\n在每个程序中，这都是入口，即 `main`\
    \ 方法带有一个参数，该参数是一个 `String` 类型的数组。\n\n## 乱序的数组\n\n在许多 Java 程序中，你会看到两种类型的 main 方法：\n\
    \n1) `public static void main(String[] args)`\n2) `public static void main(String\
    \ args[])`\n"
- fmt: "\nWe write the type as `int[]`, or `String[]`. When we mention the type, we\
    \ actually mention the data type of the contained elements. Why we use the brackets?\
    \ Just to let the compiler know that the variable holds an array. When we declare\
    \ the array, inside the brackets, we don’t mention the size or length. It is done\
    \ in the later part.\n\nThe same way, we can declare and create an array of objects.\
    \ It is created just like an array of primitive data types.\n\n```java\nPerson[]\
    \ persons = new Person[3];\n```\n\nIn the last problem (problem 53) we have discussed\
    \ this topic in great detail.\n\nSimilarly we can declare arrays of other types,\
    \ this way:\n\n```java\nbyte[] anyName;\nshort[] anyName;\nlong[] anyName;\nfloat[]\
    \ anyName;\ndouble[] anyName;\nboolean[] anyName;\nchar[] anyName;\nString[] anyName;\n\
    ```\n\nThe next problem will display you how we can declare, initialize and allocate\
    \ memory for different types of variables. Read the comments written inside the\
    \ problem 33.\n\n```java\n// problem33\n// code 33\npackage fun.sanjibsinha;\n\
    \n/*\nIntroduction to array object\nPrimitive data types are not objects created\
    \ from a class. They are special data types built into the language.\nTo build\
    \ an array object we need to take help from primitive data types.\nThe only exception\
    \ is String\nWhat features will distinguish array from primitive data types?\n\
    Let us see to that problem\n*/\n\npublic class ProblemThirtyThree {\n    public\
    \ static void main(String[] args) {\n        // an example of primitive data type\n\
    \        // a variable is a container that contains a value or a primitive data\
    \ types\n        int myAge = 54;\n        System.out.println(\"An example of primitive\
    \ data type : \" + myAge);\n        // in case of array we declare and allocate\
    \ memory with a new keyword\n        // the following array container holds a\
    \ fixed number of value of data type int\n        // the length of the array is\
    \ established\n        // here the length is 2, this container has 2 elements\n\
    \        int[] myBasket = new int[2];\n        // each item or element has a corresponding\
    \ numerical index that starts with 0\n        myBasket[0] = 2;\n        myBasket[1]\
    \ = 3;\n        // each element can be accessed by its corresponding numerical\
    \ index\n        System.out.println(\"The first element of my basket : \" + myBasket[0]);\n\
    \        System.out.println(\"The second element of my basket : \" + myBasket[1]);\n\
    \    }\n}\n```\n\nThe output gives us an idea about how we can treat these variables\
    \ in different way.\n\n```text\n// output of problem 33\nAn example of primitive\
    \ data type : 54\nThe first element of my basket : 2\nThe second element of my\
    \ basket : 3\n```\n\nInitializing and creating an array always involves mentioning\
    \ the data type. While initializing an array element through the index, if we\
    \ choose a wrong data type it gives us an error of incompatible type.\n\nThe next\
    \ problem shows us the same situation.\n\n```java\n// problem 34\n// code 34\n\
    package fun.sanjibsinha;\n\n/*\nHow to declare a variable to refer to an array\n\
    */\n\npublic class ProblemThirtyFour {\n    public static void main(String[] args)\
    \ {\n        // to declare and create an array of integer type\n        int[]\
    \ studentClasses = new int[2];\n        // to declare an array of String, a non-primitive\
    \ data type\n        String[] studentNames = new String[4];\n        // the brackets\
    \ after the data type indicate it's an array\n        // an array has two parts\
    \ : data type and name\n        // the data type also indicates what of elements\
    \ the array will contain\n        // the next line will give an error of incompatible\
    \ type\n        /*\n        studentNames[0] = 12;\n        */\n        studentNames[0]\
    \ = \"John\"; // this is OK with the compiler\n        System.out.println(\"The\
    \ name of the student who come out first : \" + studentNames[0]);\n    }\n}\n\
    ```\n\nIn the above code, as usual you need to follow the commented sections.\
    \ A `String` array cannot be initialized as `int`.\n\n```text\n// output of problem\
    \ 34\nThe name of the student who come out first : John\n```\n\nAs we have said\
    \ earlier, the proper initialization is necessary. In the next problem we will\
    \ see the same thing.\n\n```java\n// problem 35\n// code 35\npackage fun.sanjibsinha;\n\
    \n/*\nThe proper initialization of an array\n*/\n\npublic class ProblemThirtyFive\
    \ {\n    public static void main(String[] args) {\n        // we can also create\
    \ and initialize an array like this\n        int schoolSections[] = new int[4];\n\
    \        schoolSections[0] = 1;\n        schoolSections[1] = 2;\n        schoolSections[2]\
    \ = 3;\n        schoolSections[3] = 4;\n        System.out.println(\"We want section\
    \ 1 : \" + schoolSections[0]);\n        /*\n        However above type of initialization\
    \ is highly discouraged\n        */\n        int[] schoolSection = new int[4];\
    \ // it is OK\n    }\n}\n```\n\nJava allows both type of initialization. However,\
    \ we will follow this one: `int[] schoolSection = new int[4];`. The shortcut syntax\
    \ to creation and initialization of any array also saves a lot of time. In cases\
    \ of multidimensional arrays (we will come to that topic in a minute), we need\
    \ to use the shortcut syntax or array literals. The following problem will show\
    \ you how we can do that.\n\n```java\n// problem 36\n// code 36\npackage fun.sanjibsinha;\n\
    \n/*\nThe shortcut syntax to create and initialize an array\n*/\n\npublic class\
    \ ProblemThirtySix {\n    public static void main(String[] args) {\n        String[]\
    \ nameCollection = {\n            \"John Smith\", \"Chicago\", \"good gunner.\"\
    \n        };\n        System.out.println(\"He is \" + nameCollection[0] + \",\
    \ from \" + nameCollection[1] + \". And he is a \" + nameCollection[2]);\n   \
    \ }\n}\n```\n\nAnd here is the output:\n\n```text\n// output of problem 36\nHe\
    \ is John Smith, from Chicago. And he is a good gunner.\n```\n\nSo far we have\
    \ seen how we can declare, initialize and create an array. Furthermore, we can\
    \ take advantage of Java Standard Edition that provides many utilities to manipulate\
    \ the arrays. Through those manipulations arrays turn to be very powerful and\
    \ useful concept in programming.\n\nYou may consider a situation where we can\
    \ put arrays inside any array. It may become complex, however, accessing multidimensional\
    \ array elements is not very difficult. The next problem shows us the declaration,\
    \ initialization and creation of a multidimensional array.\n\n```java\n// problem\
    \ 37\n// code 37\npackage fun.sanjibsinha;\n\n/*\nIn multidimensional array components\
    \ are themselves arrays\nThe rows can vary in length\n*/\npublic class ProblemThirtySeven\
    \ {\n    public static void main(String[] args) {\n        // you may imagine\
    \ it as columns and rows\n        String[][] nameCollections = {\n           \
    \ {\"Name\", \"Location\", \"Occupation\"},\n            {\"John Smith\", \"Chicago\"\
    , \"Gunner\"},\n            {\"Ernest Hemingway\", \"Writer\"},\n            {\"\
    Don Juan\", \"Paris\", \"Artist\"}\n        };\n        // the first column name\
    \ represents the first index as [0][0], and moves on\n        System.out.println(nameCollections[0][0]\
    \ + \" : \" + nameCollections[1][0]);\n        System.out.println(nameCollections[0][1]\
    \ + \" : \" + nameCollections[1][1]);\n        System.out.println(nameCollections[0][2]\
    \ + \" : \" + nameCollections[1][2]);\n        System.out.println(\"+++++++++++++++\"\
    );\n        System.out.println(nameCollections[0][0] + \" : \" + nameCollections[2][0]);\n\
    \    }\n}\n```\n"
