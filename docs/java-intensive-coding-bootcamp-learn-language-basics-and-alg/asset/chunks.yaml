    The output is quite expected. Before taking a look at the output I would like
    to discuss a key point of using array here.


    Watch the array `myNumber[]`. We have declared `length` as `5`, but added `3`
    elements. Since we cannot add elements once the `length` has been declared, we
    need to keep the memory location open for further addition. That is a con side
    of Java array. Wasting memory is not a sign of enlightenment. When you build a
    software, keep planning it beforehand so that you should not waste the memory
    unnecessarily.


    ```

    1 //output of problem 44

    2 [50, 60, 70, 0, 0]

    3 [1, 2, 3]

    ```


    There are a few basic rules that we should remember while handling and manipulating
    any array. An array is a container object. Therefore, it has states and we can
    change the states with the help of built-in methods. Since an array is a container
    object it has a reference value associated with it. In the next problem, we will
    see how it is displayed when you give an output.


    ### Problem 45


