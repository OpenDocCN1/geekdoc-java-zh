    types. It will include reference variable that acts as a handle to the newly created
    object. There are a few rules and conventions that we should follow when we design
    and write the state of an object. Besides ‘int’ or ‘boolean’, there are other
    data types; moreover, we should have a clear idea about assigning values to the
    variables. If we do not explicitly initialize them, are they assigned default
    values? Let us know all the technique through problems.


    Difference between Variables


    Let us start with the problem eighteen. This problem handles a core concept of
    Java. We know that local variables store their values in the ‘Stack’, whereas,
    the newly created objects are stored in ‘Heap’. However, the reference variable
    that acts as a handle to the object, is stored in ‘Stack’. It only points to the
    new object. Let us see the problem first, and after that we will discuss what
    has happened actually.


     1 //problem 18


    2 //code 18


    3 package fun.sanjibsinha;


    4


    5 class ReferenceVariable {


    6     int num;


    7 }


    8


    9 public class ProblemEighteen {


    10     public static void main(String[] args) {


    11         int i = 10;


    12         int j = 5;


    13         System.out.println(i + " " + j);


    14         i = j;


    15         System.out.println(i + " " + j);


    16         j++;


    17         System.out.println(i + " " + j);


    18


    19         ReferenceVariable numOne = new ReferenceVariable();


    20         ReferenceVariable numTwo = new ReferenceVariable();


    21         numOne = numTwo;


    22         numOne.num = 10;


    23         System.out.println(numOne.num + " " + numTwo.num);


    24         numTwo.num++;


    25         System.out.println(numOne.num + " " + numTwo.num);


    26     }


    27 }


    As you see in the above code, there are two local variables ‘int i, and int j’.
    We have displayed two values first. After that we write ‘i=j’, and raises the
    value of ‘j’ by 1\. As a matter of fact, this increase in value should reflect
    on the value of ‘i’. Yet, the change in the value of ‘j’ does not affect the value
    of ‘i’. You will find it in the output in a minute.


    In the second part of the program, we have dealt with two objects. You watch these
    lines in the code:


    1 ReferenceVariable numOne = new ReferenceVariable();


    2         ReferenceVariable numTwo = new ReferenceVariable();


    3         numOne = numTwo;


    In the above lines, ‘numOne’ and ‘numTwo’ are two reference variables which point
    to the newly created two objects that are stored in the ‘Heap’. Whereas these
    two reference variables are stored in ‘Stack’. Once we equate them, the first
    reference variable, that is ‘numOne’, now points to the second object. It no longer
    reflects the value of the first object.


    You watch the output carefully, you will understand the difference between ‘call
    by value’ and ‘call by reference’.


    1 //output of problem 18


    2 10 5


    3 5 5


    4 5 6


    5 10 10


    6 11 11


    In the first case, the variable ‘i’ does not take up the value of ‘j’. But in
    the second case, ‘numOne’ takes up the value of ‘numTwo’. Because in the second
    case, the reference variable ‘numOne’ acts as a handle to the first object, it
    just withdraws and points to the second object.


    In the next two problems, we will see a different types of variables. How we should
    use local variables?


     1 //problem 19


    2 //code 19


    3 package fun.sanjibsinha;


    4


