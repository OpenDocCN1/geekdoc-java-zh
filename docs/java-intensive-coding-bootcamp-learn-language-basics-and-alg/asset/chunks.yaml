    \ try again!\n9 -45\n10 That is impossible; try again!\n11 120\n12 Your are 120\
    \ years old.\n```\n\nBy this time, we have seen how judiciously we could use `while`\
    \ loop to solve different type problems. But, in some cases, `do-while` construct\
