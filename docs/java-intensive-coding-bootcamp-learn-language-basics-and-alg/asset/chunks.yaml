- fmt: "\nIn this chapter, we will talk more about different type of variables and\
    \ data types. It will include reference variable that acts as a handle to the\
    \ newly created object. There are a few rules and conventions that we should follow\
    \ when we design and write the state of an object. Besides `int` or `boolean`,\
    \ there are other data types; moreover, we should have a clear idea about assigning\
    \ values to the variables. If we do not explicitly initialize them, are they assigned\
    \ default values? Let us know all the technique through problems.\n\n## Difference\
    \ between Variables\n\nLet us start with the problem eighteen. This problem handles\
    \ a core concept of Java. We know that local variables store their values in the\
    \ `Stack`, whereas, the newly created objects are stored in `Heap`. However, the\
    \ reference variable that acts as a handle to the object, is stored in `Stack`.\
    \ It only points to the new object. Let us see the problem first, and after that\
    \ we will discuss what has happened actually.\n\n```java\n//problem 18\n// code\
    \ 18\npackage fun.sanjibsinha;\n\nclass ReferenceVariable {\n    int num;\n}\n\
    \npublic class ProblemEighteen {\n    public static void main(String[] args) {\n\
    \        int i = 10;\n        int j = 5;\n        System.out.println(i + \" \"\
    \ + j);\n        i = j;\n        System.out.println(i + \" \" + j);\n        j++;\n\
    \        System.out.println(i + \" \" + j);\n\n        ReferenceVariable numOne\
    \ = new ReferenceVariable();\n        ReferenceVariable numTwo = new ReferenceVariable();\n\
    \        numOne = numTwo;\n        numOne.num = 10;\n        System.out.println(numOne.num\
    \ + \" \" + numTwo.num);\n        numTwo.num++;\n        System.out.println(numOne.num\
    \ + \" \" + numTwo.num);\n    }\n}\n```\n\nAs you see in the above code, there\
    \ are two local variables `int i`, and `int j`. We have displayed two values first.\
    \ After that we write `i=j`, and raises the value of `j` by 1. As a matter of\
    \ fact, this increase in value should reflect on the value of `i`. Yet, the change\
    \ in the value of `j` does not affect the value of `i`. You will find it in the\
    \ output in a minute.\n\nIn the second part of the program, we have dealt with\
    \ two objects. You watch these lines in the code:\n\n```java\nReferenceVariable\
    \ numOne = new ReferenceVariable();\nReferenceVariable numTwo = new ReferenceVariable();\n\
    numOne = numTwo;\n```\n\nIn the above lines, `numOne` and `numTwo` are two reference\
    \ variables which point to the newly created two objects that are stored in the\
    \ `Heap`. Whereas these two reference variables are stored in `Stack`. Once we\
    \ equate them, the first reference variable, that is `numOne`, now points to the\
    \ second object. It no longer reflects the value of the first object.\n\nYou watch\
    \ the output carefully, you will understand the difference between `call by value`\
    \ and `call by reference`.\n\n```text\n//output of problem 18\n10 5\n5 5\n5 6\n\
    10 10\n11 11\n```\n\nIn the first case, the variable `i` does not take up the\
    \ value of `j`. But in the second case, `numOne` takes up the value of `numTwo`.\
    \ Because in the second case, the reference variable `numOne` acts as a handle\
    \ to the first object, it just withdraws and points to the second object.\n\n\
    In the next two problems, we will see a different types of variables. How we should\
    \ use local variables?\n\n```java\n//problem 19\n// code 19\npackage fun.sanjibsinha;\n\
    \npublic class ProblemNineteen {\n    //local variable\n    public void WeightOfFatherBear()\
    \ {\n        int weight = 0;\n        weight = 180;\n        System.out.println(\"\
    The weight of father bear is: \" + weight);\n    }\n\n    public static void main(String[]\
    \ args) {\n        ProblemNineteen fatherWeight = new ProblemNineteen();\n   \
    \     fatherWeight.WeightOfFatherBear();\n    }\n}\n```\n\nHere is the output\
    \ of problem 19: `The weight of father bear is: 180`. Quite simple program. But\
    \ it reminds us one factor. We must not use local variable out scope. Watch the\
    \ problem 20.\n\n```java\n//problem 20\n// code 20\npackage fun.sanjibsinha;\n\
    \npublic class ProblemTwenty {\n    //using local variable out scope\n    public\
    \ void WeightOfChildBear() {\n        int weight = 0;\n        weight = 80;\n\
    \    }\n\n    public static void main(String[] args) {\n        //it will give\
    \ us errors\n        System.out.println(\"The weight of child bear is: \" + weight);\n\
    \    }\n}\n```\n\nIt will produce errors. Watch the output below.\n\n```text\n\
    //output of problem 20\nError:(12, 6) java: cannot find symbol\nsymbol: weight\n\
    location: class fun.sanjibsinha.ProblemTwenty\n```\n\nWhen local variables are\
    \ declared inside a method, it should be used in that method only. We can call\
    \ that method later. In the next problem, we will find another key factor. Local\
    \ variables should be initialized. Otherwise, it gives us errors.\n\n```java\n\
    //problem 21\n// code 21\npackage fun.sanjibsinha;\n\n/*\nLocal variables must\
    \ be initialized\n*/\npublic class ProblemTwentyOne {\n    //local variable\n\
    \    public void WeightOfMotherBear() {\n        int weight;\n        System.out.println(\"\
    The weight of mother bear is: \" + weight);\n    }\n\n    public static void main(String[]\
    \ args) {\n        ProblemTwentyOne motherBear = new ProblemTwentyOne();\n   \
    \     //you cannot initialize local variable here\n        //it will give us errors\n\
    \        motherBear.weight = 150;\n        motherBear.WeightOfMotherBear();\n\
    \    }\n}\n```\n\nWe should have initialized it earlier. Instead, we tried to\
    \ assign a value through the object reference. It does not work.\n\n```text\n\
    //output of problem 21\nError:(19, 19) java: cannot find symbol\nsymbol: weight\n\
    location: variable motherBear of type fun.sanjibsinha.ProblemTwentyOne\n```\n\n\
    On the other hand, the class level instance variable should not be initialized.\
    \ It is because the instance variable has a default value of null. Watch the next\
    \ problem.\n\n```java\n//problem 22\n// code 22\npackage fun.sanjibsinha;\n\n\
    import java.io.*;\n\n//these are instance variables\n//you need not initialize\
    \ them like local variables\nclass StudentClasses {\n    int className;\n    //we\
    \ could have added more states and methods to change the states\n}\n\npublic class\
    \ ProblemTwentyTwo {\n    public static void main(String args[]) {\n        //here\
    \ john is the reference variable\n        //it'll act as a handle to the new object\n\
    \        //john is stored in stack, and the new object is stored in heap\n   \
    \     StudentClasses john = new StudentClasses();\n        //now john can access\
    \ the instance variable\n        john.className = 1;\n        System.out.println(\"\
    The new student john studies at class: \" + john.className);\n\n        StudentClasses\
    \ mary = new StudentClasses();\n        mary.className = 2;\n        System.out.println(\"\
    The new student mary studies at class: \" + mary.className);\n\n        john.className\
    \ = mary.className;\n        System.out.println(\"After one year john passed the\
    \ exam and now he studies at: \" + john.className);\n    }\n}\n```\n\nIt will\
    \ not produce errors as we have guessed earlier.\n\n```text\n//output of problem\
    \ 21\nThe new student john studies at class: 1\nThe new student mary studies at\
    \ class: 2\nAfter one year john passed the exam and now he studies at: 2\n```\n\
    \n## Reference Variables\n\nNow, we can give a summary of a few key rules about\
    \ variables. We have found three types of variables, so far. Reference variable,\
    \ local variable, and instance variable. The reference variables are directly\
    \ related to the object scope. We have seen some problems and studied their nature\
    \ through those problems.\n"
