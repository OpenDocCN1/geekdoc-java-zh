    As the chapter headline tells you, this chapter will also be very short and it\
    \ is written to give you an idea about how Java handles errors.\n\n## A Brief\
    \ Note on Exception Handling\n\nAs an error occurs, an exception object is created.\
    \ This exception object tells us about the error that occurred. There are many\
    \ types of exception objects that are created during the programming. One of them\
    \ is `java.lang.Exception`. The Java compiler checks for these exceptions.\n\n\
    Exceptions can be thrown during the normal operation of the Java Virtual Machine\
    \ (`JVM`). As programmers, it is our responsibility to catch them.\n\nHere, in\
    \ the next problem we will learn to handle one of the most common Java exceptions\
    \ – the `ArithmeticException`. You cannot divide a number by zero.\n\n```java\n\
