    \ Hardware does not understand anything but binary.\n\n## Memory allocation, heap\
    \ and stack\n\nAs a beginner, you need to have an idea about what is going on\
    \ behind the curtain, especially when we write a code and execute it.\n\nSo far,\
    \ we have learned one important lesson: our code ultimately talks to the hardware\
    \ in binary code. Whatever we write in `Java` is translated to `0` and `1`. But\
    \ where it is stored? Here comes the idea of memory. In computing, memory refers\
    \ to a device that is used to store information for immediate use. Therefore,\
    \ we can say that memory is actually a primary storage.\n\nAt the same time, memory\
    \ management is also very important. When we write a code and execute it, computer\
    \ dynamically allocates some memory to the program and free it for reuse, when\
    \ it is no longer needed.\n\nAs you progress, you’ll find that in `Java` programming,\
    \ we will write many classes and create objects. Every class has a `main()` thread\
    \ where the program is executed. As memory management essentially deals with space,\
    \ we will find two terms quite regularly in `Java` programming. One is “heap”\
    \ and the other is “stack”.\n\nWhen we write a class, and create an object, it\
    \ is created always in the heap space. However, `Java` uses its `Stack` memory\
    \ to execute all the threads, such as attributes and methods; that is, this space\
    \ is allocated not only for the `main()` method, but also all the attributes and\
    \ methods we create inside any class. Consider the problem one or code one.\n\n\
