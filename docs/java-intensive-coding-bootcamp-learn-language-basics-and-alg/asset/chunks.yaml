  trans: "\n在本章中，我们将详细讨论不同类型的变量和数据类型。它将包括作为新创建对象句柄的引用变量。在设计和编写对象状态时，我们应该遵循一些规则和约定。除了\
    \ `int` 或 `boolean` 之外，还有其他数据类型；此外，我们应该对变量的赋值有一个清晰的思路。如果我们不显式地初始化它们，它们会被赋予默认值吗？让我们通过问题来了解所有的技巧。\n\
    \n## 变量的区别\n\n让我们从第 18 题开始。这个问题处理了 Java 的核心概念。我们知道局部变量将其值存储在 `Stack`（栈）中，而新创建的对象存储在\
    \ `Heap`（堆）中。然而，作为对象句柄的引用变量存储在 `Stack` 中。它只指向新对象。让我们先看这个问题，然后我们将讨论实际上发生了什么。\n\n\
    ```java\n//problem 18\n// code 18\npackage fun.sanjibsinha;\n\nclass ReferenceVariable\
    \ {\n    int num;\n}\n\npublic class ProblemEighteen {\n    public static void\
    \ main(String[] args) {\n        int i = 10;\n        int j = 5;\n        System.out.println(i\
    \ + \" \" + j);\n        i = j;\n        System.out.println(i + \" \" + j);\n\
    \        j++;\n        System.out.println(i + \" \" + j);\n\n        ReferenceVariable\
    \ numOne = new ReferenceVariable();\n        ReferenceVariable numTwo = new ReferenceVariable();\n\
    \        numOne = numTwo;\n        numOne.num = 10;\n        System.out.println(numOne.num\
    \ + \" \" + numTwo.num);\n        numTwo.num++;\n        System.out.println(numOne.num\
    \ + \" \" + numTwo.num);\n    }\n}\n```\n\n如你在上面的代码所示，有两个局部变量 `int i` 和 `int j`。我们首先显示了两个值。之后我们写了\
    \ `i=j`，并将 `j` 的值增加了 1。事实上，这个值的增加应该反映在 `i` 的值上。然而，`j` 值的改变并没有影响 `i` 的值。你将在几后的输出中发现这一点。\n\
    \n在程序的第二部分，我们处理了两个对象。请观察代码中的这些行：\n\n```java\nReferenceVariable numOne = new ReferenceVariable();\n\
    ReferenceVariable numTwo = new ReferenceVariable();\nnumOne = numTwo;\n```\n\n\
    在上面的行中，`numOne` 和 `numTwo` 是两个引用变量，它们指向存储在 `Heap` 中的两个新创建的对象。而这两个引用变量存储在 `Stack`\
    \ 中。一旦我们将它们相等，第一个引用变量即 `numOne` 现在指向了第二个对象。它不再反映第一个对象的值。\n\n仔细观察输出，你将理解“按值传递（call\
    \ by value）”和“引用传递（call by reference）”的区别。\n\n```text\n//output of problem 18\n\
    10 5\n5 5\n5 6\n10 10\n11 11\n```\n\n在第一种情况下，变量 `i` 没有获取 `j` 的值。但在第二种情况下，`numOne`\
    \ 获取了 `numTwo` 的值。因为在第二种情况下，引用变量 `numOne` 作为第一个对象的句柄，它只是撤回并了第二个对象。\n\n接下来的两个问题中，我们将看到不同类型的变量。我们应该如何使用局部变量？\n\
    \n```java\n//problem 19\n// code 19\npackage fun.sanjibsinha;\n\npublic class\
    \ ProblemNineteen {\n    //local variable\n    public void WeightOfFatherBear()\
    \ {\n        int weight = 0;\n        weight = 180;\n        System.out.println(\"\
    The weight of father bear is: \" + weight);\n    }\n\n    public static void main(String[]\
    \ args) {\n        ProblemNineteen fatherWeight = new ProblemNineteen();\n   \
    \     fatherWeight.WeightOfFatherBear();\n    }\n}\n```\n\n这是第 19 题的输出：`The weight\
    \ of father bear is: 180`。非常简单的程序。但它提醒了我们一个因素：我们不能在作用域之外使用局部变量。看问题 20。\n\n```java\n\
    //problem 20\n// code 20\npackage fun.sanjibsinha;\n\npublic class ProblemTwenty\
    \ {\n    //using local variable out scope\n    public void WeightOfChildBear()\
    \ {\n        int weight = 0;\n        weight = 80;\n    }\n\n    public static\
    \ void main(String[] args) {\n        //it will give us errors\n        System.out.println(\"\
    The weight of child bear is: \" + weight);\n    }\n}\n```\n\n它将产生错误。看下面的输出。\n\n\
    ```text\n//output of problem 20\nError:(12, 6) java: cannot find symbol\nsymbol:\
    \ weight\nlocation: class fun.sanjibsinha.ProblemTwenty\n```\n\n当局部变量在方法内部声明时，它应该只在该方法在使用。我们可以稍后调用该方法。在下一个问题中，我们将发现另一个关键因素：局部变量应该被初始化。否则它会给我们报错。\n\
    \n```java\n//problem 21\n// code 21\npackage fun.sanjibsinha;\n\n/*\nLocal variables\
    \ must be initialized\n*/\npublic class ProblemTwentyOne {\n    //local variable\n\
    \    public void WeightOfMotherBear() {\n        int weight;\n        System.out.println(\"\
    The weight of mother bear is: \" + weight);\n    }\n\n    public static void main(String[]\
    \ args) {\n        ProblemTwentyOne motherBear = new ProblemTwentyOne();\n   \
    \     //you cannot initialize local variable here\n        //it will give us errors\n\
    \        motherBear.weight = 150;\n        motherBear.WeightOfMotherBear();\n\
    \    }\n}\n```\n\n我们本应该早地初始化它。相反，我们尝试通过对象赋值。这行不通。\n\n```text\n//output of problem\
    \ 21\nError:(19, 19) java: cannot find symbol\nsymbol: weight\nlocation: variable\
    \ motherBear of type fun.sanjibsinha.\n```\n\n另一方面，类级别的实例变量不需要初始化。这是因为实例变量有默认值\
    \ null。看下一个问题。\n\n```java\n//problem 22\n// code 22\npackage fun.sanjibsinha;\n\
    \nimport java.io.*;\n\n//these are instance variables\n//you need not initialize\
    \ them like local variables\nclass StudentClasses {\n    int className;\n    //we\
    \ could have added more states and methods to change the states\n}\n\npublic class\
    \ ProblemTwentyTwo {\n    public static void main(String args[]) {\n        //here\
    \ john is the reference variable\n        //it'll act as a handle to the new object\n\
    \        //john is stored in stack, and the new object is stored in heap\n   \
    \     StudentClasses john = new StudentClasses();\n        //now john can access\
    \ the instance variable\n        john.className = 1;\n        System.out.println(\"\
    The new student john studies at class: \" + john.className);\n\n        StudentClasses\
    \ mary = new StudentClasses();\n        mary.className = 2;\n        System.out.println(\"\
    The new student mary studies at class: \" + mary.className);\n\n        john.className\
    \ = mary.className;\n        System.out.println(\"After one year john passed the\
    \ exam and now he studies at: \" + john.className);\n    }\n}\n```\n\n正如我们之前猜测的，它不会产生错误。\n\
    \n```text\n//output of problem 22\nThe new student john studies at class: 1\n\
    The new student mary studies at class: 2\nAfter one year john passed the exam\
    \ and now he studies at: 2\n```\n\n## 引用变量\n\n现在我们可以对变量的一些关键规则进行总结。到为止我们发现了三种类型的变量：引用变量、局部变量和实例变量。引用变量与对象的作用域直接相关。我们已经看到了一些问题，并通过这些问题研究了它们的本质。\n"
- fmt: "\nLocal variables have some special characteristics. They are declared within\
    \ a block, or method, or constructor (we are yet to discuss constructor in the\
    \ next chapter). When the method is called, or the block is entered, these local\
    \ variables are created and destroyed when we leave the block or the call is returned\
    \ from the method. We cannot access these variables outside this block of code.\
    \ Furthermore, we have to initialize local variables.\n\nTherefore we need to\
    \ remember a few key factors about local variables and eventually we can compare\
    \ its position with the object state or field, of which we have discussed earlier.\n\
    \nJust like objects store their fields in instance variables, a method stores\
    \ its temporary states in local variables. The syntax for declaration is the same.\
    \ We don’t use any ‘local’ keyword for that. According to its location, we can\
    \ assume whether the role of the variable is local or not. It is always between\
    \ the opening and closing braces of a method. Moreover, it is visible only inside\
    \ the method.\n\n## Instance Variables\n\nThe specialty of instance variables\
    \ is directly related to the classes and objects. We can declare it outside any\
    \ block, method or constructor; but inside a class. It is not mandatory that we\
    \ should initialize instance variable. Its default value is `0`. Objects store\
    \ their states inside the fields or variables and that value is unique to each\
    \ instance or object.\n\nFurthermore, it life cycle is totally dependent on the\
    \ objects of the class. The creation and the destruction process is controlled\
    \ by objects. Since they are not ‘static’ variables, only objects can access them\
    \ depending on the declaration of the access modifiers. We will talk about access\
    \ modifiers in great detail, later in the coming chapters. However, in this chapter,\
    \ we will have an introductory note about it.\n\n## Class Variables (Static Fields)\n\
    \nWe call a variable class variable, when its field is declared with the ‘static’\
    \ modifier. The word ‘static’ means you can access the variable directly through\
    \ the class name. You don’t have to create an object to do that anymore. It also\
    \ tells the compiler that there is exactly one copy of this variable in existence.\
    \ It does not matter how many times you instantiate a class, how many objects\
    \ you create, there is only one copy of this variable and only the class can access\
    \ it. We can think of a field like human eyes. It can ideally be marked as static.\
    \ Why?\n\nBecause conceptually, we can apply the same number of eyes to all instances\
    \ of human beings. Additionally we can add the keyword ‘final’ to assert that\
    \ the number of eyes will never change.\n\nThe next problem will show you an example.\n\
    \n```java\n//problem 23\n//code 23\npackage fun.sanjibsinha;\n\nclass StudentClassesAndNames\
    \ {\n    public static int className;\n    public static String studentName;\n\
    }\n\npublic class ProblemTwentyThree {\n    public static void main(String args[])\
    \ {\n        StudentClassesAndNames.studentName = \"John\";\n        StudentClassesAndNames.className\
    \ = 1;\n        System.out.println(StudentClassesAndNames.studentName + \" studies\
    \ at class \" \\+ StudentClassesAndNames.className);\n    }\n}\n```\n\nIn the\
    \ above code, we have seen an example of class variable with static modifier.\
    \ The output is quite simple:\n\n`John studies at class 1`\n\nWe will see some\
    \ more problems that will have class variables with static modifier. However,\
    \ in the next problem we will have a quick introduction to the access modifiers,\
    \ which will play a very important role in building applicable software. In the\
    \ next problem, we have seen difference between access modifiers. Read the documentation\
    \ written inside the code. That will clear many ambiguities regarding these core\
    \ concepts of object-oriented-programming.\n\n```java\n//problem 24\n//code 24\n\
    package fun.sanjibsinha;\n\n/*\nMember variables can be declared inside class,\
    \ but outside any method\nThere are four types of access modifiers\n1) public\
    \ = it is available in package, subclass, and outer world\n2) protected = it is\
    \ available in package, subclass, and not in the outer world\n3) private = it\
    \ is not available in package, subclass, and outer world\n4) default (no modifier)\
    \ = it is only available in package\n*/\n/*\nIn this program we will check the\
    \ access modifiers individually\n*/\n\nclass FatherPanda {\n    public boolean\
    \ isPredator;\n    protected int weight;\n    private int age;\n    public void\
    \ eat() {\n        System.out.println(\"After each meal Father Panda gains weight\
    \ : \" + weight + \". And his age is : \" + age);\n    }\n}\n\npublic class ProblemTwentyFour\
    \ {\n    public static void main(String args[]) {\n        FatherPanda father\
    \ = new FatherPanda();\n        System.out.println(\"Is father predator ? \" +\
    \ father.isPredator);\n        father.weight = 5;\n        //the next line will\
    \ give error\n        //we cannot modify member variable this way\n        //father.age\
    \ = 10;\n        father.eat();\n    }\n}\n```\n\nIn the above code, we have commented\
    \ out line: `father.age = 10;`. Otherwise it produces this error: `Error:(32,15)\
    \ age has private access in fun.sanjibsinha.FatherPanda`. The above output clearly\
    \ shows what kind of mistake we have done. We tried to access a private field\
    \ or variable. When an instance variable is `public`, every part of the program\
    \ can access it. When it is `protected` a section is allowed to access it. When\
    \ it is `private`, it is unavailable unless we change that through a public method.\
    \ The same thing happens here. When that particular line is commented out, the\
    \ output changes to this:\n\n`Is father predator ? false`\n`After meal Father\
    \ Panda gains weight : 5. And his age is : 0`\n\nWe have noticed another property\
    \ of instance variable that has primitive type `int`. If it is not initialized,\
    \ the default value is `0`. In case of `boolean`, it is `false`. Using `get` and\
    \ `set` method, we can modify the state of any protected and private field. The\
    \ next problem deals with this. Let’s have a look.\n\n```java\n//problem 25\n\
    //code 25\npackage fun.sanjibsinha;\n\n/*\nUnderstanding member variables and\
    \ access modifier\n*/\nclass MotherPanda {\n    public boolean isPredator;\n \
    \   protected int weight;\n    private int age;\n\n    public void setWeight(int\
    \ weight) {\n        this.weight = weight;\n    }\n\n    public int getWeight()\
    \ {\n        return weight;\n    }\n\n    public void setAge(int age) {\n    \
    \    this.age = age;\n    }\n\n    public int getAge() {\n        return age;\n\
    \    }\n\n    public void eat() {\n        System.out.println(\"After each meal\
    \ Mother Panda gains weight : \" + getWeight() + \". And her age is : \" + getAge());\n\
    \    }\n}\n\npublic class ProblemTwentyFive {\n    public static void main(String\
    \ args[]) {\n        MotherPanda mother = new MotherPanda();\n        mother.setWeight(2);\n\
    \        mother.setAge(7);\n        mother.eat();\n        FatherPanda father\
    \ = new FatherPanda();\n        //protected member variable available in package\n\
    \        father.weight = 200;\n        //public member variable available in package\n\
    \        System.out.println(\"Is father panda predator? \" + father.isPredator);\n\
    \        //public method available in everywhere\n        father.eat();\n    }\n\
    }\n```\n\nThis problem is fairly simple to understand. Here is the output.\n\n\
    `After each meal Mother Panda gains weight : 2. And her age is : 7`\n`Is father\
    \ panda predator? false`\n`After meal Father Panda gains weight : 200. And his\
    \ age is : 0`\n"
  raw: 'Local variables have some special characteristics. They are declared within
    a block, or method, or constructor (we are yet to discuss constructor in the next
    chapter). When the method is called, or the block is entered, these local variables
    are created and destroyed when we leave the block or the call is returned from
    the method. We cannot access these variables outside this block of code. Furthermore,
    we have to initialize local variables.


    Therefore we need to remember a few key factors about local variables and eventually
    we can compare its position with the object state or field, of which we have discussed
    earlier.


    Just like objects store their fields in instance variables,a method stores its
    temporary states in local variables. The syntax for declaration is the same. We
    don’t use any ‘local’ keyword for that. According to its location, we can assume
    whether the role of the variable is local or not. It is always between the opening
    and closing braces of a method. Moreover, it is visible only inside the method.


    Instance Variables


    The specialty of instance variables is directly related to the classes and objects.
    We can declare it outside any block, method or constructor; but inside a class.
    It is not mandatory that we should initialize instance variable. Its default value
    is 0\. Objects store their states inside the fields or variables and that value
    is unique to each instance or object.


    Furthermore, it life cycle is totally dependent on the objects of the class. The
    creation and the destruction process is controlled by objects. Since they are
    not ‘static’ variables, only objects can access them depending on the declaration
    of the access modifiers. We will talk about access modifiers in great detail,
    later in the coming chapters. However, in this chapter, we will have an introductory
    note about it.


    Class Variables (Static Fields)


    We call a variable class variable, when its field is declared with the ‘static’
    modifier. The word ‘static’ means you can access the variable directly through
    the class name. You don’t have to create an object to do that anymore. It also
    tells the compiler that there is exactly one copy of this variable in existence.
    It does not matter how many times you instantiate a class, how many objects you
    create, there is only one copy of this variable and only the class can access
    it. We can think of a field like human eyes. It can ideally be marked as static.
    Why?


    Because conceptually, we can apply the same number of eyes to all instances of
    human beings. Additionally we can add the keyword ‘final’ to assert that the number
    of eyes will never change.


    The next problem will show you an example.


