    Chapter Nine: Basic Input and Output in Java


    We have seen before how to take input from the users. How to use Scanner class
    is not completely new to us. However, we need to make further investigation regarding
    this matter for one reason.


    Our goal is to create a software that is interactive. In that regard, Scanner
    class is the latest development that helps us to write less code. Before that,
    we used ‘InputStreamReader’. It reads bytes and turns them to characters. The
    ‘read()’ method of InputStreamReader invokes the reading of bytes from the underlying
    byte-input stream.


    We increase the efficiency of InputStreamReader by wrapping the new InputStreamReader
    object within a BufferedReader object. The constructor of


    InputStreamReader passes one ‘System.in’ object that reads the input from the
    keyboard.


    Consequently the process becomes complex. To avoid that complexities Java has
    introduced Scanner class through which we can easily take the user’s input.


    The next problem shows us that complexities.


