    Enter a number to check whether that is twisted prime number or not: \");\n  \
    \      num = in.nextInt();\n        if(TwistedPrime.isTwistedPrime(num)){\n  \
    \          System.out.println(\"The number \" + num + \" is a twisted prime number.\"\
    );\n        }\n    }\n}\n```\n\n"
