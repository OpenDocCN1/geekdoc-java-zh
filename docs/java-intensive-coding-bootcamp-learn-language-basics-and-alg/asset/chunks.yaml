    exception ‘IndexOutOfBoundsException’. These exceptions are very verbose, so you
    can understand what types of exceptions occur. You may call a class that does
    not exist, thereafter you get the ‘ClassNotFoundException’.


    There are several more exceptions that we have not discussed here. However, I
    hope, a single problem has thrown some light on the topic.


    Chapter Thirteen: Data Structure, A Brief Introduction


    The last problem of the book, that is the hundredth problem knocks on the door
    of a very big topic – data structures and algorithm. In my opinion, it deserves
    a separate book that might give you a fair idea of what they actually are. Our
    next Java bootcamp for Intermediate Learners will start with Data Structures,
    Algorithm and Time Complexity. Do not forget to check that out.


    It is a very big topic, in the sense, as we progress the volume of data is multiplying.
    We need to know how to store, sort, search and do many and varied operations using
    that data. This is not a easy task. That is why the term ‘Big Data’ has popped
    up. Learning data structures and algorithm gets more attention now.


    How will we manage this collection of data? You have already seen array. However,
    array has many limitations, such as it holds fixed number of values of a single
    type. You cannot change it.


    To overcome such limitations, Java introduces core collection interfaces. They
    encapsulate different type of collections. You have learned the role of an interface,
    it is actually a contract. So it allows collections to be manipulated independently.
    The foundation of Java Collections Framework consists of such Core Collection
    Interfaces.


    They are ‘Set’, ‘List’, ‘Queue’, ‘Deque’, and ‘Map’. In the last problem, we have
    seen an example of ‘LinkedList’ class, which is a collection based on a Linked
    List. As the name suggests, it is a collection of container that holds data and
    each container has a link identifier that links it either to the next one or the
    previous one. The last link identifier is always ‘null’, because it points to
    nothing.


    Now it goes on like this: A links to B, B links to C, C links to D and so on.
    If you want to add an object (suppose E) in between C and D, Java sets new link
    identifiers for everyone and the chain is not broken. It is automatically maintained
    as before. Only a new data structure emerges.


    They are particularly good when you wan to perform many additions and deletions
    with a collection. You can add anywhere, delete any value anywhere.


    The next problem will show you how a LinkedList works. However, I would not go
    any further. You will find the detail in my ‘Data Structures and Algorithm’ book.


