    Chapter Three: How Java Programming Works


    In this chapter we will discuss the difference between Procedural (POP) and Object
    Oriented Programming (OOP). Using problems, we will also see how Java programming
    is written within a class. In the context of a problem, we will also learn the
    role of compiler and interpreter in processing Java code.


    Difference between POP and OOP


    Java is an object-oriented-programming. Java programming is written within a class.
    We will see it in a minute. Before that, we would like to know what is the key
    difference between procedural and object-oriented-programming.


    A procedural programming (POP) is governed and executed step-by-step by a set
    of instruction. So it always maintains a procedure. Here data flows down from
    the top to the bottom and the priority is given to the functions.


    On the contrary, objects are the main focus in the object-oriented-programming
    (OOP). Objects encapsulate all the procedures written in the class, which is the
    actual blueprint of the objects. OOP is more secured as there are access specifiers.
    It is also more readable, because we can write different classes for doing different
    tasks and make them loosely coupled. There are many more features like method
    and operator overloading or overriding that are not present in the POP. As you
    progress, you’ll learn more about this.


    Java program is written within a class


    Now we come to the problem three, code three, where we will try to understand
    how a Java program is written within a class.


    Consider the problem three, which is a very simple program that gives an output
    of “Hello World”.


    1 //Problem 3


    2 //code 3


    3 public class Main {


    4     public static void main(String[] args) {


    5         System.out.println("Hello World");


    6     }


    7 }


    In the above code, we have seen that the program is written within a class “Main”.
    Inside that Main class we find a “public” method “main()”. This main() method
    is also “static” and “void”. We will discuss about the term “static” later. The
    meaning of “void” is it will not return any value.


    Inside that main() method, we see this line:


    1 System.out.println("Hello World");


    When you type the word “System” on your IntelliJ code editor, it will automatically
    show a “c” icon on the left side. It means, “System” represents a class in Java.
    After “System”, if you use a DOT “.” notation it will show many hints, of which,
    we would pick up “out”. When you pick up “out”, the left icon will show a sign
    of “f”. It means “out” is a field of the class “System”. After using “out”, if
    we again use a “.” notation, it will again give us many hints. Out of those many
    hints, we will pick up “println()”. Now on IntelliJ, on the left side of “println()”,
    it will show an icon of “m”; it means this is a method.


    Inside the “println()”, we write “Hello World”, a string value. A string is a
    sequence of characters. We will discuss about them in detail, very soon.


    As we see so far, we have seen that our Main class is stored in the file “Main.java”.
    Whatever class we build for this project, from now on, the file will have the
    same extension “.java”. Is there something else behind the curtain?


    Yes, there is. The byte code of this Java file is stored inside “Main.class”.
    In the following image (Figure 3.1) we will find that class. See at the left side
    of your IntelliJ code editor, you will find a folder called “out/production”.
    You will find the “Main.class” file inside it.


    ![Figure 3.1 – The “Main.class” file inside “out/production” folder](OEBPS/Image00006.jpg)


    Figure 3.1 – The “Main.class” file inside “out/production” folder


    Our problem four consists of this “Main.class” file. Let us see what is inside.


    1 //problem 4


    2 //code 4


    3 package fun.sanjibsinha;


    4


    5 public class Main {


    6     public Main() { /* compiled code */ }


    7


    8     public static void main(java.lang.String[] args) { /* compiled code */ }


    9 }


    This is the completion of code, which is also called Java byte code. This byte
    code of Java is completely platform independent. It can run on Linux, Windows,
    and macOS, if that computer system has Java Runtime Environment (JRE). JRE released
    by Oracle is a freely available software for personal use. The recent licensing
    agreement bars it from using for any commercial purpose.


    The following image (Figure 3.2) will show you the web page from where you can
    download the JRE for your computer. And here is the link: https://www.java.com/en/download/


    ![Figure 3.2 – The Java Runtime Environment (JRE) download page](OEBPS/Image00007.jpg)


    Figure 3.2 – The Java Runtime Environment (JRE) download page


    This JRE contains the stand-alone Java Virtual Machine (JVM), which is a virtual
    machine that enables a computer to run any Java programs as well as other programs
    written in other languages, which are also compiled to Java Byte Code.


    So we have learned many important facts about how a Java source code is compiled
    to a byte code (Main.class). This byte code goes to Java Virtual Machine (JVM),
    which is also called Interpreter. It actually interprets the Byte Code into the
    Native Code that can be run in any operating system.


    In the following diagram (Figure 3.3) we have shown how it works.


    ![Figure 3.3 – How Java source code works as a platform independent Native Code](OEBPS/Image00008.jpg)


    Figure 3.3 – How Java source code works as a platform independent Native Code


    As the above image shows, we can conclude that Java has some specialty to convert
    the high level language to machine level language (MLL) . It uses compiler and
    interpreter, both.


    Basically, any high level language either uses compiler or interpreter. A software
    that accepts the whole program written in high level language and converts it
    into its equivalent machine language is known as compiler. Each high level language
    requires separate compiler to convert the source code to machine language. Since
    a compiler uses the compilation technique as a whole, at once, it is comparatively
    faster than the interpreter. Although it is slightly difficult to find the errors,
    because it gives errors as a whole. It cannot indicate logical errors, it only
    finds syntax errors.


    Besides, interpreter conversions are done line by line. Therefore, it is slower
    than compiler, but finding errors is much easier. If an error is found on any
    line, the execution stops.


    In case of Java, the compiler converts the high level source code into an intermediate
    Byte Code, which is then converted to Native Code by the interpreter or Java Virtual
    Machine (JVM). Now, any computer, that has Java Runtime Environment or JRE, can
    run that Java program.


