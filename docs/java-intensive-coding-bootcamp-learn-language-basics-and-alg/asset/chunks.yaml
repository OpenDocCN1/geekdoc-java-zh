  trans: "\n\n```java\nScanner sc = new Scanner(System.in);\nSystem.out.println(\"\
    Enter any 5 number: \");\nwhile (controllingNumber <= 5){\n    num = sc.nextInt();\n\
    \    if(num % 2 != 0){\n        sum += num;\n    }\n    controllingNumber++;\n\
    }\nSystem.out.println(\"The sum of only odd numbers: \" + sum);\n```\n\n当你将一个小数除以\
    \ 2 且没有余数时，它是一个偶数。如果该条件不成立，就是奇数。\n\n**代码 70 的输出：**\n```\nEnter any 5 number:\n\
    12\n10\n5\n3\n7\nThe sum of only odd numbers: 15\n```\n\n我们可以获取用户的输入并测试该数字是偶数还是奇数。要终止程序，用户必须输入\
    \ 0。下一个问题将向我们展示如何利用无限循环的概念来解决特定问题示例。\n\n### 问题 71\n\n```java\npackage fun.sanjibsinha;\n\
    \nimport java.util.Scanner;\n\n/*\n输入一个数字检查是奇数还是偶数，输入 0 终止程序\n*/\npublic class\
    \ ProblemSeventyOne {\n    static int num = 1;\n\n    public static void main(String[]\
    \ args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.println(\"\
    Enter a number to check whether odd or even\\n\" +\n                         \
    \  \"and enter 0 to terminate the program\");\n        while (num != 0){\n   \
    \         num = sc.nextInt();\n            if(num == 0){\n                break;\n\
    \            }\n            if(num % 2 == 0){\n                System.out.println(num\
    \ + \" is an even number\");\n            } else {\n                System.out.println(num\
    \ + \" is an odd number\");\n            }\n        }\n    }\n}\n```\n\n**代码 71\
    \ 的输出：**\n```\nEnter a number to check whether odd or even and enter 0 to terminate\
    \ the program\n2\n2 is an even number\n3\n3 is an odd number\n789456\n789456 is\
    \ an even number\n533333\n533333 is an odd number\n0\n```\n\n我们能使用 `continue`\
    \ 关键字只选取奇数数值吗？是的，我们可以做到的。下一个问题将向我们展示如何这样做。\n\n### 问题 72\n\n```java\npackage fun.sanjibsinha;\n\
    \n/*\n1 到 9 之间的奇奇数，continue\n*/\npublic class ProblemSeventyTwo {\n    public\
    \ static void main(String[] args) {\n        int controllingNumber = 0;\n    \
    \    while (controllingNumber <= 9){\n            controllingNumber += 1;\n  \
    \          if(controllingNumber % 2 == 0){\n                continue;\n      \
    \      }\n            System.out.println(\"The odd numbers: \" + controllingNumber);\n\
    \        }\n    }\n}\n```\n\n**代码 72 的输出：**\n```\nThe odd numbers: 1\nThe odd\
    \ numbers: 3\nThe odd numbers: 5\nThe odd numbers: 7\nThe odd numbers: 9\n```\n\
    \n在下一个问题中，我们可以尝试检查用户的输入是否为特殊数字。顺便说一下，特殊数字是指各位数字之和加上各位数字之积等于原数字的数字，例如 59。\n\n###\
    \ 问题 73\n\n```java\npackage fun.sanjibsinha;\n\n/*\n检查特殊数字\n*/\nimport java.util.*;\n\
    \npublic class ProblemSeventyThree {\n    public static void main(String[] args)\
    \ {\n        System.out.println(\"Enter any number : \");\n        Scanner scan\
    \ = new Scanner(System.in);\n        int inputNumber = scan.nextInt();\n     \
    \   boolean result = specialnumber(inputNumber);\n        if (result == true)\n\
    \            System.out.println(inputNumber + \" is a Special number\");\n   \
    \     if (result == false)\n            System.out.println(inputNumber + \" is\
    \ NOT a Special number\");\n    }\n\n    public static boolean specialnumber(int\
    \ inputNumber) {\n        // 创建 inputNumber 的拷贝\n        int temp = inputNumber;\n\
    \        // 初始化 inputNumber 的数字之和\n        int sumOfDigits = 0;\n\n        /*\
    \ 计算数字阶乘的和 */\n        while (temp != 0) {\n            // 获取最后一位数字\n        \
    \    int currentDigit = temp % 10;\n            sumOfDigits = sumOfDigits + factorial(currentDigit);\n\
    \            temp = temp/10;\n        }\n\n        /* 如果 sumOfDigits 等于 inputNumber\
    \ 则\n        该数字是特殊数字，否则不是 */\n        return (sumOfDigits == inputNumber);\n\
    \    }\n\n    public static int factorial(int number) {\n        if (number ==\
    \ 1 || number == 0)\n            return 1;\n        else\n            return (number\
    \ * factorial(number - 1));\n    }\n}\n```\n\n**代码 73 的输出：**\n```\nEnter any number\
    \ : \n456\n456 is NOT a Special number\n```\n\n理解算法，最好的方法是在笔记本上写下步骤。我们可以检查一个数字是否为回文。\n\
    \n### 问题 74\n\n```java\npackage fun.anjibha;\n\n/*\n显示数字是否为回文。\n*/\npublic class\
    \ ProblemSeventyFour {\n    public static void main(String[] args) {\n       \
    \ int num = 121, reversedInteger = 0, remainder, originalInteger;\n        originalInteger\
    \ = num;\n        // 反转整数存储在变量中\n        while( num != 0 ) {\n            remainder\
    \ = num % 10;\n            reversedInteger = reversedInteger * 10 + remainder;\n\
    \            num /= 10;\n        }\n        // 如果 originalInteger 和 reversedInteger\
    \ 相等则是回文\n        if (originalInteger == reversedInteger)\n            System.out.println(originalInteger\
    \ + \" is a palindrome.\");\n        else\n            System.out.println(originalInteger\
    \ + \" is not a palindrome.\");\n    }\n}\n```\n\n正如我们所说，我们输入了 121，这是一个回文。所以输出得到\
    \ 121 是回文。下一个问题将求一个数列的和，我们从用户处获取一个值，如下：(2 / 3) - (4 / 5) + (6 / 7) - (8 / 9) +\
    \ .. 直到 `n` 项。在我们的问题中，`n` 的值为 7。\n\n### 问题 75\n\n```java\npackage fun.sanjibsinha;\n\
    \n/*\n编写一个程序求 2/3 之和\n*/\npublic class ProblemSeventyFive {\n    // 计算前 n 项数列和的函数\n\
    \    static double seriesSum(int n) {\n        int i = 1;\n        // 计算结果的变量\n\
    \        double res = 0.0;\n        boolean sign = true;\n\n        // while 循环直到达到第\
    \ n 项\n        while (n > 0) {\n            n--;\n            // 布尔类型\n      \
    \      // 用于验证\n            if (sign) {\n                sign = !sign;\n     \
    \           res = res + (double)++i / ++i;\n            } else {\n           \
    \     sign = !sign;\n                res = res - (double)++i / ++i;\n        \
    \    }\n        }\n        return res;\n    }\n\n    public static void main (String[]\
    \ args) {\n        int n = 7;\n        System.out.print(seriesSum(n));\n    }\n\
    }\n```\n\n输出结果为：0.7542679542679541。\n\n在 Java 交互式编程测试或 Java 面试中，雇主会要求查找给定数字中某个数字出现的频率。\n\
    \n算法简要介绍\n\n"
- fmt: "\nWe have already been introduced to Algorithm. We solve any problem by breaking\
    \ it in sequence of steps. Before writing the final code we could write the sequence\
    \ of steps in our natural language.\n\nIn the following part we will compute the\
    \ number of molecules in a hydrocarbon.\n\nNotice the algorithm. That is same\
    \ for any other language, we can write the same program in `C++`, or `C#`, although\
    \ syntactically there will be differences. So the steps of algorithm varies. Let\
    \ us see the algorithm in our natural language first.\n\nThe algorithm will be\
    \ like this:\n\n1. Step 1: take input and store the mass of hydrocarbon, the number\
    \ of carbon, and the number of hydrogen atoms.\n2. Step 2: find and store the\
    \ formula weight of one mole.\n3. Step 3: find the number of molecules in given\
    \ mass of hydrocarbon using the above formula.\n4. Step 4: output the stored input\
    \ values and the result.\n\nConsidering that the algorithm is the same, let us\
    \ suppose for any other programming language other `Java`, its value is `1`. However,\
    \ the syntactical difference makes the second value change. If we consider that\
    \ algorithm is the `X` axis, and the syntactical difference as `Y` axis, then\
    \ the hypothetical value might be `(1, 2)` and `(1, 5)`. Moreover, they are discrete,\
    \ distinct and separated.\n\nLet us see the Java program first.\n\n### Java Program:\
    \ Hydrocarbon Molecule\n\n```java\n//code to find the number of molecules in a\
    \ hydrocarbon\n//Java\npackage fun.sanjibsinha.languagebasics;\n\n/**\n * we will\
    \ compute number of molecules in a hydrocarbon\n * a mole of any substance contains\
    \ 6.02 * 10^23 molecules\n * this is called Avogadro's number\n * relationship\
    \ of a mass of a substance and the number of molecules is:\n * molecules = mass\
    \ * 1mole/FormulaWeight * (6.02 * 10^23 molecules)/i mole\n */\nimport java.util.Scanner;\n\
    \npublic class HydroCarbonMolecule {\n\n    static float massOfHydrocarbon = 0.00f;\n\
    \    static int numberOfCarbonAtoms = 0;\n    static int numberOfHydrogenAtoms\
    \ = 0;\n\n    public static void main(String[] args) {\n        System.out.println(\"\
    Enter mass of HydroCarbon in a floating point: \");\n        Scanner mh = new\
    \ Scanner(System.in);\n        massOfHydrocarbon = mh.nextFloat();\n        System.out.println(\"\
    Enter the number of carbon atoms: \");\n        Scanner nc = new Scanner(System.in);\n\
    \        numberOfCarbonAtoms = nc.nextInt();\n        System.out.println(\"Enter\
    \ the number of hydrogen atoms: \");\n        Scanner nh = new Scanner(System.in);\n\
    \        numberOfHydrogenAtoms = nh.nextInt();\n        final int CarbonAMU =\
    \ 12;\n        final int HydrogenAMU = 1;\n        long formulaWeightOfOneMole\
    \ = 111111111111L;\n        formulaWeightOfOneMole = (numberOfCarbonAtoms * CarbonAMU)\n\
    \                + (numberOfHydrogenAtoms * HydrogenAMU);\n        double AvogadroNumber\
    \ = 6.02 * Math.pow(10, 23);\n        double molecules = (massOfHydrocarbon/formulaWeightOfOneMole)\
    \ * AvogadroNumber;\n        System.out.println(massOfHydrocarbon + \" grams of\
    \ hydrocarbon with \" + numberOfCarbonAtoms\n                + \" carbon atoms\
    \ and \" + numberOfHydrogenAtoms + \" hydrogen atoms contain \"\n            \
    \    + molecules + \" molecules.\");\n    }\n}\n```\n\n**Output of the above code:**\n\
    ```\nEnter mass of HydroCarbon in a floating point: 16.0\nEnter the number of\
    \ carbon atoms: 1\nEnter the number of hydrogen atoms: 4\n16.0 grams of hydrocarbon\
    \ with 1 carbon atoms and 4 hydrogen atoms contain 6.01999999999999E23 molecules.\n\
    ```\n\nI would like to write the Avogadro’s number using scientific notation `double\
    \ AvogadroNumber = 6.02e23;`. The output changes from `6.01999999999999E23` to\
    \ `6.02E23`, although should not have mattered how you have written the Avogadro’s\
    \ number. In the first case, I used `pow()` method. In the second case, I have\
    \ the scientific notation. However, the outputs are discrete.\n\nIn the next problem,\
    \ we will have an input like `122322`, and we will try to find how many times\
    \ `2` appears.\n\n### Problem 76: Frequency of Digits\n\n```java\n//code 76\n\
    package fun.sanjibsinha;\n\npublic class ProblemSeventy {\n    static int frequencyDigits(int\
    \ n, int d) {\n        int c = 0;\n        while (n > 0) {\n            // check\
    \ for equality\n            if (n % 10 == d)\n                c++;\n         \
    \   // reduce the number\n            n = n / 10;\n        }\n        return c;\n\
    \    }\n\n    public static void main(String[] args) {\n        int myNumber =\
    \ 122322;\n        int findDigit = 2;\n        System.out.println(\"Frequency\
    \ of digit 2 in the number \" + myNumber + \" : \" + frequencyDigits(myNumber,\
    \ findDigit));\n    }\n}\n```\n\n**Output:**\n```\nFrequency of digit 2 in the\
    \ number 122322 is : 4\n```\n\nThe next problem is comparatively easier than before.\
    \ We will raise the value of `1` by adding `3`. And this iteration will stop when\
    \ the number of steps is less than `5`.\n\n### Problem 77: Series Sum\n\n```java\n\
    //code 77\npackage fun.sanjibsinha;\n\n/**\n * SumOfSeries 1+4+7+10.\n */\npublic\
    \ class ProblrmSeventy {\n    static int sum = 0;\n    static int num = 0;\n\n\
    \    public static void main (String[] args) {\n        sum = 1;\n        while\
    \ (num < 5) {\n            num++;\n            System.out.println(sum);\n    \
    \        sum += 3;\n        }\n    }\n}\n```\n\nThe loop starts from `1`, as usual.\
    \ After that it starts increment the value by `3`.\n\n**Output of code 77:**\n\
    ```\n1\n4\n7\n10\n13\n```\n\nLet us do some kind of things like taking an array\
    \ of values from user, and sort them in ascending order.\n\n### Problem 78: Array\
    \ Sorting\n\n```java\n//code 78\npackage fun.sanjibsinha;\n\n/**\n * Enter any\
    \ number of array elements and get them in ascending order\n */\nimport java.util.Scanner;\n\
    \npublic class ProblemSeventyEight {\n    public static void main(String[] args)\
    \ {\n        int count, temp;\n        // inputs the size\n        Scanner scan\
    \ = new Scanner(System.in);\n        System.out.print(\"Enter number of elements\
    \ you want in the array: \");\n        count = scan.nextInt();\n        int num[]\
    \ = new int[count];\n        System.out.println(\"Enter elements:\");\n      \
    \  for (int i = 0; i < count; i++) {\n            num[i] = scan.nextInt();\n \
    \       }\n        scan.close();\n        for (int i = 0; i < count; i++) {\n\
    \            for (int j = i + 1; j < count; j++) {\n                if (num[i]\
    \ > num[j]) {\n                    temp = num[i];\n                    num[i]\
    \ = num[j];\n                    num[j] = temp;\n                }\n         \
    \   }\n        }\n        System.out.print(\"Array Elements in Ascending Order:\
    \ \");\n        for (int i = 0; i < count - 1; i++) {\n            System.out.print(num[i]\
    \ + \", \");\n        }\n        System.out.print(num[count - 1]);\n    }\n}\n\
    ```\n\nRun the code in your favorite IDE, and you will get the same output as\
    \ the following. You can download the code repository from the GitHub. At the\
    \ end of the book, I have given the link. However, my suggestion is try to read\
    \ the code and write from your memory and while doing this, follow the logical\
    \ steps that we have maintained in the code.\n\n**Output of the sorting program:**\n\
    ```\nEnter number of elements you want in the array: 12\nEnter elements:\n45\n\
    56\n89\n7456\n23564\n897456\n12356\n456123\n25\n45\n457896\n321456\nArray Elements\
