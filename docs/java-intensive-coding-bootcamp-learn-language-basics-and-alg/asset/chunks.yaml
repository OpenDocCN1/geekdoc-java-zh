  trans: "\n\n我们已经介绍了算法。我们通过将问题分解为一系列步骤来解决任何问题。在编写最终代码之前，我们可以用自然语言写出这些步骤序列。\n\n在后续部分，我们将计算碳烃中的分子数量。\n\
    \n请注意这个算法。它对于任何其他语言都是相同的，我们可以用 `C++` 或 `C#` 编写相同的程序，尽管语法上会有差异。因此，算法的步骤会有所不同。让我们先用自然语言来看看这个算法。\n\
    \n算法如下：\n\n1. 步骤 1：获取输入并存储碳烃的质量、碳原子个数和氢原子个数。\n2. 步骤 2：找到并存储一摩尔的分子量。\n3. 步骤 3：使用上述公式找到给定质量碳烃中的分子数量。\n\
    4. 步骤 4：输出存储的输入值和结果。\n\n考虑到算法是相同的，假设对于任何 `Java` 以外的其它编程语言，其值为 `1`。然而，语法差异会导致第二个值发生变化。如果我们认为算法是\
    \ `X` 轴，将语法差异视为 `Y` 轴，那么假设的值可能是 `(1, 2)` 和 `(1, 5)`。此外，它们是离散、独特且分离的。\n\n让我们先看看\
    \ Java 程序。\n\n### Java 程序：碳烃分子\n\n```java\n//code 用于查找碳烃中分子数量的代码\n//Java\npackage\
    \ fun.sanjibsinha.languagebasics;\n\n/**\n * 我们将计算碳烃中的分子数量\n * 任何物质的一摩尔都包含 6.02\
    \ * 10²³ 个分子\n * 这被称为阿福伽德常数\n * 物质质量与分子数量之间的关系是：\n * 分子 = mass * 1mole/FormulaWeight\
    \ * (6.02 * 10²³ molecules)/i mole\n */\nimport java.util.Scanner;\n\npublic class\
    \ HydroCarbonMolecule {\n\n    static float massOfHydrocarbon = 0.00f;\n    static\
    \ int numberOfCarbonAtoms = 0;\n    static int numberOfHydrogenAtoms = 0;\n\n\
    \    public static void main(String[] args) {\n        System.out.println(\"输入浮点形式的碳烃质量:\
    \ \");\n        Scanner mh = new Scanner(System.in);\n        massOfHydrocarbon\
    \ = mh.nextFloat();\n        System.out.println(\"输入碳原子个数: \");\n        Scanner\
    \ nc = new Scanner(System.in);\n        numberOfCarbonAtoms = nc.nextInt();\n\
    \        System.out.println(\"输入氢原子个数: \");\n        Scanner nh = new Scanner(System.in);\n\
    \        numberOfHydrogenAtoms = nh.nextInt();\n        final int CarbonAMU =\
    \ 12;\n        final int HydrogenAMU = 1;\n        long formulaWeightOfOneMole\
    \ = 111111111111L;\n        formulaWeightOfOneMole = (numberOfCarbonAtoms * CarbonAMU)\n\
    \                + (numberOfHydrogenAtoms * HydrogenAMU);\n        double AvogadroNumber\
    \ = 6.02 * Math.pow(10, 23);\n        double molecules = (massOfHydrocarbon/formulaWeightOfOneMole)\
    \ * AvogadroNumber;\n        System.out.println(massOfHydrocarbon + 克的碳烃含有 \"\
    \ + numberOfCarbonAtoms\n                + \" 个碳原子和 \" + numberOfHydrogenAtoms\
    \ + \" 个氢原子，包含 \"\n                + molecules + \" 个分子。\");\n    }\n}\n```\n\n\
    **上述代码的输出：**\n```\n输入浮点形式的碳烃质量: 16.0\n输入碳原子个数: 1\n输入氢原子个数: 4\n16.0 克的碳烃含有 1 个碳原子和\
    \ 4 个氢原子，包含 6.01999999999999E23 个分子。\n```\n\n我想使用科学计数法写阿福伽德常数 `double AvogadroNumber\
    \ = 6.02e23;`。输出从 `6.01999999999999E23` 变为 `6.02E23`，尽管无论如何写阿福伽德常数应该影响。在第一情况下，我使用了\
    \ `pow()` 方法。在第二情况下，我使用了科学计数法。然而，输出是离散的。\n\n在下一个问题中，我们将得到类似 `122322` 的输入，并尝试找到\
    \ `2` 出现了几次。\n\n### 问题 76：数字频率\n\n```java\n//code 76\npackage fun.sanjibsinha;\n\
    \npublic class ProblemSeventy {\n    static int frequencyDigits(int n, int d)\
    \ {\n        int c = 0;\n        while (n > 0) {\n            // 检查相等\n      \
    \      if (n % 10 == d)\n                c++;\n            // 减少数字\n         \
    \   n = n / 10;\n        }\n        return c;\n    }\n\n    public static void\
    \ main(String[] args) {\n        int myNumber = 122322;\n        int findDigit\
    \ = 2;\n        System.out.println(\"数字 \" + myNumber + \" 中数字 2 的频率: \" + frequencyDigits(myNumber,\
    \ findDigit));\n    }\n}\n```\n\n**输出：**\n```\n数字 122322 中数字 2 的频率: 4\n```\n数字\
    \ 122322 中数字 2 的频率是 4。下一个问题比之前的容易。我们将 `1` 的值增加 `3`。\n\n问题 77：序列\n\n```java\n//\
    \ 77\npackage fun.sanjibsinha;\n\n/**\n * 1+4+7.\n */\npublic class ProblemSeventy\
    \ {\n    static int sum = 0;\n    static int num = 0;\n\n    public static void\
    \ main (String[] args) {\n        sum = 1;\n        while (num < 5) {\n      \
    \      num++;\n            System.out.println(sum);\n            sum += 3;\n \
    \       }\n    }\n}\n```\n\n循环从 `1` 开始。之后我们将值增加 `3`。\n\n**代码 77 的输出：**\n```\n\
    4\n7\n10\n```\n\n让我们从用户那里获取数组值并按升序排列。\n\n### 问题 78：数组排序\n\n```java\n//code 78\n\
    package fun.sanjibsinha;\n\n/**\n * 输入任何数组元素并升序排列\n */\nimport java.util.Scanner;\n\
    \npublic class ProblemSeventyEight {\n    public static void main(String[] args)\
    \ {\n        int count, temp;\n        // 输入大小\n        Scanner scan = new Scanner(System.in);\n\
    \        System.out.print(\"想要在数组中的元素数量: \");\n        count = scan.nextInt();\n\
    \        int num[] = new int[count];\n        System.out.println(\"输入元素:\");\n\
    \        for (int i = 0; i < count; i++) {\n            num[i] = scan.nextInt();\n\
    \        }\n        scan.close();\n        for (int i = 0; i < count; i++) {\n\
    \            for (int j = i + 1; j < count; j++) {\n                if (num[i]\
    \ > num[j]) {\n                    temp = num[i];\n                    num[i]\
    \ = num[j];\n                    num[j] = temp;\n                }\n         \
    \   }\n        }\n        System.out.print(\"升序排列元素: \");\n        for (int i\
    \ = 0; i < count - 1; i++) {\n            System.out.print(num[i] + \", \");\n\
    \        }\n        System.out.print(num[count - 1]);\n    }\n}\n```\n\n在你喜好的\
    \ IDE 中运行该代码，你将获得与以下相同的输出。你可以从 GitHub 下载代码库。我在书末提供了链接。然而，我的建议是记忆编写代码，并遵循我们在代码中维护的逻辑步骤。\n\
    \n**排序程序的输出：**\n```\n想要在数组中的元素数量: 12\n输入元素:\n45\n56\n89\n7456\n23564\n897456\n\
    12356\n456123\n25\n45\n457896\n321456\n升序排列元素: 25, 45, 45, 56, 89, 7456, 12356,\
    \ 23564, 321456, 456123, 457896, 897456\n```\n\n"
- fmt: "\nIn the next problem we will try to find the sum of prime divisors. Now,\
    \ question is what does this mean? What is the sum of prime divisors?\n\nWhen\
    \ we have the prime factorization of any number, then to calculate the the sum\
    \ of its divisors, we take each different prime factor and add together all its\
    \ powers up to the one that appears in the above process of factorization. Then\
    \ we multiply all these sums together.\n\nI admit, this type of problem is a little\
    \ bit tricky and seems weird. However, my opinion is try to push the barrier of\
    \ learning and task yourself with something that you don’t understand at the first\
    \ hand. Only then you can learn something new. Everything takes time, it will\
    \ take too.\n\n### Problem 79\n\n```java\npackage fun.sanjibsinha;\n\nimport java.util.Scanner;\n\
    \npublic class ProblemSeventyNine {\n    static int myNUmber = 0;\n\n    //checking\
    \ whether the number is prime or not\n    static boolean isPrime(int num) {\n\
    \        if (num <= 1)\n            return false;\n        if (num <= 3)\n   \
    \         return true;\n\n        if (num % 2 == 0 || num % 3 == 0)\n        \
    \    return false;\n\n        for (int i = 5; i * i <= num; i = i + 6)\n     \
    \       if (num % i == 0 || num % (i + 2) == 0)\n                return false;\n\
    \        return true;\n    }\n\n    static int SumOfPrimeDivisors(int num) {\n\
    \        int sum = 0;\n        for (int i = 1; i <= num; i++) {\n            if\
    \ (num % i == 0) {\n                if (isPrime(i))\n                    sum +=\
    \ i;\n            }\n        }\n        return sum;\n    }\n\n    public static\
    \ void main(String[] args) {\n        Scanner in = new Scanner(System.in);\n \
    \       System.out.println(\"Enter any number: \");\n        myNUmber = in.nextInt();\n\
    \        System.out.print(\"Sum of prime divisors of \" + myNUmber + \" is \"\
    \ + SumOfPrimeDivisors(myNUmber) + \"\\n\");\n    }\n}\n```\n\nWe have tested\
    \ a prime number like `11` and the output is quite expected. But for the next\
    \ time, we have entered a different value. See the output.\n\nOutput of code 79:\n\
    ```\nEnter any number: 11\nSum of prime divisors of 11 is 11\n---\nEnter any number:\
    \ 456\nSum of prime divisors of 456 is 24\n```\n\nIt is because `456` is divisible\
    \ by prime numbers `2`, `3`, `19`. If you add them, you get `24`. The next problem\
    \ is much easier than before. Let us take 4 numbers and more to get Sum of even\
    \ and odd.\n\n### Problem 80\n\n```java\npackage fun.sanjibsinha;\n\n/**\n * input\
    \ 4 numbers and more to get Sum of Even And Odd\n */\nimport java.util.*;\n\n\
    public class Eighty {\n    static int num = 1, sumOfEven = 0, sumOOdd = 0;\n\n\
    \    public static void main(String[] args) {\n        Scanner in = new Scanner(System.in);\n\
    \        while (num != 0) {\n            System.out.println(\"Enter zero to end\"\
    );\n            num = in.nextInt();\n            if (num != 0) {\n           \
    \     if (num > 0 && num % 2 == 0)\n                    sumOfEven = sumOfEven\
    \ + num;\n                if (num > 0 && num % 2 != 0)\n                    sumOOdd\
    \ = sumOOdd + num;\n            }\n            if (num == 0)\n               \
    \ break;\n        }\n        System.out.println(\"The sum of positive even numbers\
    \ = \" + sumOfEven);\n        System.out.println(\"The sum of positive odd numbers\
    \ = \" + sumOOdd);\n    }\n}\n```\n\nHere goes the output.\n\nOutput of code 80:\n\
    ```\nEnter zero to end\n2\nEnter zero to end\n4\nEnter zero to end\n3\nEnter zero\
    \ to end\n5\nEnter zero to end\n6\nEnter zero to end\n9\nEnter zero to end\n0\n\
    The sum of positive even numbers = 12\nThe sum of positive odd numbers = 17\n\
    ```\n\nIn the next problem, we will deal with Fibonacci number. In Mathematics\
    \ the Fibonacci sequence or series is defined as a series of numbers in which\
    \ each number ( Fibonacci number ) is the sum of the two preceding numbers. The\
    \ simplest is the series `1, 1, 2, 3, 5, 8`, etc. It could be complex. We will\
    \ find the sum of first ten Fibonacci numbers.\n\n### Problem 81\n\n```java\n\
    package fun.sanjibsinha;\n\n//find the sum of first ten Fibonacci numbers\nclass\
    \ SumOfFirstFibonacciNumbers {\n    //we need a method that will return the sum\n\
    \    public int findTheSum(int n) {\n        if (n <= 0)\n            return 0;\n\
    \n        int fibo[] = new int[n + 1];\n        fibo[0] = 0; fibo[1] = 1;\n\n\
    \        int sum = fibo[0] + fibo[1];\n        for (int i = 2; i <= n; i++) {\n\
    \            fibo[i] = fibo[i - 1] + fibo[i - 2];\n            sum += fibo[i];\n\
    \        }\n        return sum;\n    }\n}\n\npublic class EightyOne {\n    static\
    \ int num = 0;\n\n    public static void main(String args[]) {\n        num =\
    \ 10;\n        SumOfFirstFibonacciNumbers fiboObject = new SumOfFirstFibonacciNumbers();\n\
    \        System.out.println(\"Sum of ten Fibonacci numbers is : \" + fiboObject.findTheSum(num));\n\
    \    }\n}\n```\n\nThe output reflects the sum of first Fibonacci numbers.\n\n\
    Output of code 81:\n```\nSum of ten Fibonacci numbers is : 143\n```\n\nThe next\
    \ problem will examine whether the number is ‘Duck’ or not. In Mathematics, the\
    \ Duck number is defined as a number which has zeroes in it. However, not in the\
    \ beginning of the number. For example `3210`, `7056` are Duck numbers. But not\
    \ `0321`, or `0756`.\n\n### Problem 82\n\n```java\npackage fun.sanjibsinha;\n\n\
    //check a number is Duck Number or not.\nimport java.util.Scanner;\n\nclass DuckNumber\
    \ {\n    public int checkingDuck(String num) {\n        int len = num.length();\n\
    \        int countZero = 0;\n        char myChar;\n\n        for (int i = 1; i\
    \ < len; i++) {\n            myChar = num.charAt(i);\n            if (myChar ==\
    \ '0')\n                countZero++;\n        }\n        return countZero;\n \
    \   }\n}\n\npublic class ProblemEightyTwo {\n    static int num = 0;\n    static\
    \ String str;\n    static char digitZero;\n\n    public static void main(String[]\
    \ args) {\n        DuckNumber myDuck = new DuckNumber();\n        Scanner sc =\
    \ new Scanner(System.in);\n        System.out.println(\"Enter a number to check\
    \ whether the number is a Duck number or not: \");\n        num = sc.nextInt();\n\
    \        String num1 = Integer.toString(num);\n        str = Integer.toString(num);\n\
    \        digitZero = str.charAt(0);\n        if (myDuck.checkingDuck(str) > 0\
    \ && digitZero != '0')\n            System.out.println(\"It is a number\");\n\
    \        else\n            System.out.println(\"It is not a number\");\n    }\n\
    }\n```\n\nWe are taking inputs from the users to examine the nature of the number.\n\
