    14          System.out.print(newArray[i] + " ");

    15          }

    16    }

    17

    18    public static int[] returningArrayMethod(){

    19          //returning any array from a method

    20          return new int[] {111,222,3333, 456897};

    21    }

    22 }

    ```


    The output is quite expected.


    ```

    1 //output of problem 48

    2 111 222 3333 456897

    ```


    We have covered a few things about Array in Java. As you have found array has
    its pros and cons. In standard java libraries we have found some methods that
    can manipulate the elements. However, there are some limitations that we can overcome
    with the help of some external libraries. The next section will talk about it.


    ### Apache Commons Lang


    Apache Commons Lang provides many methods for manipulation of Java Arrays. This
    external libraries provide these extra methods. We need to add the libraries to
    our project to manipulate arrays.


    Apache Commons Lang provides many helper utilities that will help you, not only
    arrays, but also string and numerical values. In this section, we will only talk
    about array methods. Maybe in future, in some other books we will have a more
    close look about these external helper utilities.


    The first step will guide you how to add these external utilities to your NetBeans
    IDE. The subsequent steps will guide you to add them to IntelliJ IDE.

