    \ wise;\n    System.out.println(this.name + \" questioned the wisdom of \" + wise.name);\n\
    }\n\npublic void sayToWiseMen(WiseMen wise){\n    this.wise = wise;\n    System.out.println(this.name\
    \ + \" said to the \" + wise.name + \" hearing\" +\n    \" his death sentence,\
    \ 'an unexamined life is not worth living'.\");\n}\n\npublic void dieByDrinking(Hemlock\
    \ hemlock){\n    this.hemlock = hemlock;\n    System.out.println(this.name + \"\
    \ died drinking \" + hemlock.nature);\n}\n```\n\n之后，我们需要一个 `Plato` 类，同样地，包含一些状态和方法。\n\
    \n```java\n// class Plato\n// blueprint of Plato object\npackage fun.sanjibsinha.object;\n\
    \nclass Plato {\n    public String name = \"Plato\";\n    Socrates socrates;\n\
    \n    public void hasARelationWith(Socrates socrates){\n        this.socrates\
    \ = socrates;\n        System.out.println(this.name + \" had a friendship with\
    \ \" + socrates.name);\n    }\n    public void writesAbout(Socrates socrates){\n\
    \        this.socrates = socrates;\n        System.out.println(this.name + \"\
    \ had written about his friend and teacher \"\n        + socrates.name);\n   \
    \ }\n}\n```\n\n接下来，我们需要雅典智者们，他们决定了苏格拉底的命运并判处他死刑。\n\n```java\n// class WiseMen\n\
    // blueprint of WiseMen object\npackage fun.sanjibsinha.object;\n\nclass WiseMen\
    \ {\n    public String name = \"Wise men of Athens\";\n    Socrates socrates;\n\
    \n    public void giveDeathSentenceTo(Socrates socrates){\n        this.socrates\
    \ = socrates;\n        System.out.println(this.name + \" had given death sentence\
    \ to \"\n        + socrates.name);\n    }\n}\n```\n\n`Hemlock` 对象定义在一个小类中，它的状态被声明为毒药。\n\
    \n```java\n// class Hemlock\n// blueprint of Hemlock object\npackage fun.sanjibsinha.object;\n\
    \nclass Hemlock {\n    public String nature = \"Poison\";\n}\n```\n\n通过阅读上面的蓝图或类，我们可以说它们是基于真实故事的。我们编写每个类的方式，使得它们拥有一些状态和行为，例如\
    \ `Socrates` 具有如下状态：\n\n`public String name = \"Socrates\";`\n\n`Socrates` 类还具有类似这样的行为：\n\
    \n```java\npublic void questionWiseMen(WiseMen wise){\n    this.wise = wise;\n\
    \    System.out.println(this.name + \" questioned the wisdom of \" + wise.name);\n\
    }\n```\n\n很明显看出，行为也被称为函数或方法。通过任何方法，我们都可以传递一个或多个参数，例如，在这里我们传递了一个‘WiseMen’对象。我们还给它起了一个名字\
    \ `wise`。现在，不要担心我们使用的关键字，如 `public`，或者结束表达式的语法 `;`。我们稍后会学习它们。你可能已经注意到，我们总是遵循一套规则来编写一个类，以后可以从从中创建一个或多个对象。\n\
    \n我们还注意到，类总是清晰地定义“状态”和“行为”，这样以后就不会产生歧义。计算机不喜欢歧义。它想要清晰的指令；一步步的指令。\n\n从上面的代码中可见，一个或多个对象可以是另一个对象的“状态”。看\
    \ `Socrates` 类：\n\n`public String name = \"Socrates\";`\n`WiseMen wise;`\n`Hemlock\
    \ hemlock;`\n\n这些都是在 `Socrates` 类中定义的“状态”。在三个状态中，两个是“对象”，它们有自己的类。\n\n最后，我们想要通过创建对象来运行应用程序，并根据它们之间的关系来构建我们的算法。\n\
    \n```java\n// code of main() method\npackage fun.sanjibsinha.object;\n\npublic\
    \ class PhilosopherDemo {\n\n    public static void main(String[] args) {\n  \
    \      Socrates socrates = new Socrates();\n        WiseMen wiseMenOfAthens =\
    \ new WiseMen();\n        Plato plato = new Plato();\n        Hemlock hemlock\
    \ = new Hemlock();\n        socrates.questionWiseMen(wiseMenOfAthens);\n     \
    \   wiseMenOfAthens.giveDeathSentenceTo(socrates);\n        socrates.sayToWiseMen(wiseMenOfAthens);\n\
    \        socrates.dieByDrinking(hemlock);\n        plato.hasARelationWith(socrates);\n\
    \        plato.writesAbout(socrates);\n    }\n}\n```\n\n当我们运行应用程序时，我们得到了以下输出：\n\
    \n```\nSocrates questioned the wisdom of Wise men of Athens\nWise men of Athens\
    \ had given death sentence to Socrates\nSocrates said to the Wise men of Athens\
    \ hearing his death sentence, 'an unexamined life is not worth living'.\nSocrates\
    \ died drinking Poison\nPlato had a friendship with Socrates\nPlato had written\
    \ about his friend and teacher Socrates\n```\n\n我希望这个例子将帮助你理解对象如何包含其他对象并相互通信。被称为“包含关系”（has-a-relationship）。当我们从另一个类继承一个类时，那被称为“是关系”（is-a-relationship）。\n\
    \n我们稍后会详细讨论它们。\n\n# 第二章：Java 标准版开发包和 IDE\n\n本章将很短，因为我们在这里只讨论两个关键点。\n\n为了编写并运行\
    \ Java 代码，我们特别需要两个东西。第一个是 Java 标准版开发包（JDK），第二个东西是一个良好的代码编辑器。\n\n## Java SE 开发包\n\
    \n在网上搜索 Java SE 开发包 11 会带你进入网页：`https://www.oracle.com/technetwork/java/javase/downloads/jdk11-downloads-5066655.html`，你可以在那里下载并安装该包。适用于\
    \ Linux、Windows、Solaris SPARC 和 macOS 的四种包。请记住，对于本书，我使用的是 Java 11 版本，它是稳定的，并且是\
    \ Java 8 之后的第二个长期支持版本。对于你的个人用途它是免费的，但如果你想将其用于商业用途，则需要付费。\n\n"
- fmt: "\nWe’ve named this project as “HundredProblemsInJava”. The IntelliJ IDEA 2018.2.4\
    \ Community Edition will create the path, where this project will be saved. So\
    \ you don’t have to worry about it.\n\nAs a base package, it will ask for a domain\
    \ name. Currently, I have a domain `https://sanjibsinha.fun`, so the base package\
    \ name will be “fun.sanjibsinha”. If you have a domain booked already, you can\
    \ use that.\n\nIn the next image (Figure 2.5), we see how we can write a code\
