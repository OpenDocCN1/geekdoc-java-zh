    ## Primitive Data Types


    So far we have seen eleven different types of problems, of which we have seen
    mostly integer values. We have also noticed one key thing at the time of declaring
    a variable. We write a variable like this: `int speed = 0;`.


    It means we need to specify what type of variable it is. Stating the variable’s
    type and name is essential, because Java is statically-typed. It means all variables
    should be declared first before you can use it.


    By naming and declaring a variable we actually declare the state of an object.
    In a `Car` class, when we declare a variable `speed`, our program knows that a
    field exists and that field holds a numerical data. It has also any initial value,
    such as 0 or 1. It explains why we need data types.


    The data type of a variable tells us what type of value it is. Because it represents
    the state of an object, we need to know what type of value it contains. Otherwise,
    we cannot change that state through a method. Basically, in a method, we do some
    kind of operations to change that state of the object.


    In total Java supports eight primitive data types.


    Consider the following line:


    ```java

    1 int speed = 0;

    ```


    Here, the primitive data type `int` is predefined by the language. The name of
    the primitive data type `int` is a reserved keyword. In the next problem twelve,
    we will have a look at the other primitive data types.


