    It is clearly seen that behaviors are also called functions or methods. Through
    any method we can pass one or more than one parameters, such as, here we have
    passed an ‘WiseMen’ object. We have also given it a name ‘wise’. Now, do not worry
    about the keywords we have used, like ‘public’, or syntax like ‘;’ that ends an
    expression. We will learn them later. We have probably noticed that we always
