  trans: "\n局部变量具有一些特殊特性。它们定义在块、方法或构造函数内部（我们将在下一章中讨论构造函数）。当方法被调用或进入代码块时，这些局部变量会被创建；当我们离开该块或从方法返回时，它们会被销毁。我们无法在该代码块之外访问这些变量。此外，我们必须初始化局部变量。\n\
    \n因此，我们需要记住关于局部变量的几个关键因素，最终可以将它的位置与之前讨论过的对象状态或字段进行比较。\n\n就像对象将其字段存储在实例变量中一样，方法将其临时状态存储在局部变量中。声明的语法是相同的。我们不需要为此使用任何\
    \ `local` 关键字。根据其所在的位置，我们可以假设变量的角色是否是局部的。它始终位于方法的左括号和右括号之间。此外，它只在方法内部可见。\n\n##\
    \ 实例变量\n\n实例变量的特殊之处与类和对象直接相关。我们可以在任何块、方法或构造函数之外、但在类内部声明它。我们并不强制要求必须初始化实例变量。它的默认值是\
    \ `0`。对象将状态存储在字段或变量中，该值对于每个实例或对象来说是唯一的。\n\n此外，它的生命周期完全取决于该类的对象。创建和销毁过程由对象控制。由于它们不是\
    \ `static` 变量，根据访问修饰符的声明，只有对象可以访问它们。我们将在接下来的章节中详细讨论访问修饰符。然而，在本章中，我们将对其进行一个介绍性的说明。\n\
    \n## 类变量（静态字段）\n\n当一个字段用 `static` 修饰符声明时，我们称该变量为类变量。`static` 意味着你可以通过类名直接访问该变量。你不再需要创建一个对象来这样做。它还告诉编译器，内存中该变量恰有一个副本。无论你实例化类多少次，创建了多少个对象，该变量只有一个副本，且只有类可以访问它。我们可以把字段比作人的眼睛。理想情况下，它可以被标记为静态的。为什么呢？\n\
    \n因为从概念上讲，我们可以为所有人类实例应用相同数量的眼睛。此外我们可以添加 `final` 关键字来断言眼睛的数量永远改变。\n\n下一个问题将向你展示一个示例。\n\
    \n```java\n//problem 23\n//code 23\npackage fun.sanjibsinha;\n\nclass StudentClassesAndNames\
    \ {\n    public static int className;\n    public static String studentName;\n\
    }\n\npublic class ProblemTwentyThree {\n    public static void main(String args[])\
    \ {\n        StudentClassesAndNames.studentName = \"John\";\n        StudentClassesAndNames.className\
    \ = 1;\n        System.out.println(StudentClassesAndNames.studentName + \" studies\
    \ at class \" \\+ StudentClassesAndNames.className);\n    }\n}\n```\n\n在上面的代码中，我们看到了一个带有\
    \ `static` 修饰符的类变量示例。输出非常简单：\n\n`John studies at class 1`\n\n我们将看到更多带有 `static`\
    \ 修饰符的类变量问题。然而，在下一个问题中，我们将对访问修饰符进行快速介绍，这在构建可适用的软件时起着非常重要的作用。在下一个问题中，我们看到了访问修饰符之间的区别。阅读代码内部编写的文档。这将消除关于这些面向对象编程核心概念的许多疑问。\n\
    \n```java\n//problem 24\n//code 24\npackage fun.sanjibsinha;\n\n/*\n成员变量可以声明在类内部，但在任何方法之外\n\
    这里有四种访问修饰符\n1) public = 在包、子类和外部世界中可用\n2) protected = 在包、子类中可用，但在外部世界不可用\n3) private\
    \ = 在包、子类和外部世界均不可用\n4) default (无修饰符) = 仅在包内可用\n*/\n/*\n在这个程序中，我们将分别检查访问修饰符\n\
    */\n\nclass FatherPanda {\n    public boolean isPredator;\n    protected int weight;\n\
    \    private int age;\n    public void eat() {\n        System.out.println(\"\
    After each meal Father Panda gains weight : \" + weight + \". And his age is :\
    \ \" + age);\n    }\n}\n\npublic class ProblemTwentyFour {\n    public static\
    \ void main(String args[]) {\n        FatherPanda father = new FatherPanda();\n\
    \        System.out.println(\"Is father predator ? \" + father.isPredator);\n\
    \        father.weight = 5;\n        //下一行将报错\n        //我们不能像这样修改成员变量\n     \
    \   //father.age = 10;\n        father.eat();\n    }\n}\n```\n\n在上面的代码中，我们注释掉了行：`father.age\
    \ = 10;`。否则它会产生此错误：`Error:(32,15) age has private access in fun.sanjibsinha.FatherPanda`。上面的输出清楚地显示了我们犯了什么样的错误。我们尝试访问私有字段或变量。当实例变量是\
    \ `public` 时，程序的每个部分都可以访问它。当它是 `protected` 时，允许部分区域访问。当它是 `private` 时，除非通过公共方法更改它，否则它是不可用的。这里的情况一样。当那一行被注释掉时，输出变为：\n\
    \n`Is father predator ? false`\n`After meal Father Panda gains weight : 5. And\
    \ his age is : 0`\n\n我们注意到了实例变量的另一个属性，即基本类型 `int`。如果没有初始化，它的默认值为 `0`。对于 `boolean`\
    \ 类型，它是 `false`。通过 `get` 和 `set` 方法，我们可以修改任何保护和私有字段的状态。下一个问题将涉及这个问题。让我们来看看。\n\n\
    ```java\n//problem 25\n//code 25\npackage fun.sanjibsinha;\n\n/*\n理解成员变量和访问修饰符\n\
    */\nclass MotherPanda {\n    public boolean isPredator;\n    protected int weight;\n\
    \    private int age;\n\n    public void setWeight(int weight) {\n        this.weight\
    \ = weight;\n    }\n\n    public int getWeight() {\n        return weight;\n \
    \   }\n\n    public void setAge(int age) {\n        this.age = age;\n    }\n\n\
    \    public int getAge() {\n        return age;\n    }\n\n    public void eat()\
    \ {\n        System.out.println(\"After each meal Mother Panda gains weight :\
    \ \" + getWeight() + \". And her age is : \" + getAge());\n    }\n}\n\npublic\
    \ class ProblemTwentyFive {\n    public static void main(String args[]) {\n  \
    \      MotherPanda mother = new MotherPanda();\n        mother.setWeight(2);\n\
    \        mother.setAge(7);\n        mother.eat();\n        FatherPanda father\
    \ = new FatherPanda();\n        //包内可见保护成员变量\n        father.weight = 200;\n \
    \       //包内可见公共成员变量\n        System.out.println(\"Is father predator? \" + father.isPredator);\n\
    \        //随处可见的公共方法\n        father.eat();\n    }\n}\n```\n\n这个问题相对容易理解。以下是输出结果：\n\
    \n`After each meal Mother Panda gains weight : 2. And her age is : 7`\n`Is father\
    \ predator? false`\n`After meal Father Panda gains weight : 200. And his age is\
    \ : 0`\n\n"
- fmt: "\nIn the next problem, we will recapitulate the method level scope of a local\
    \ variable. As we have said earlier, a local variable is only visible inside the\
    \ method of a class. You should treat it as a typical property of a method, because\
    \ a method stores its temporary state in those local variables.\n\nWatch the next\
    \ problem, where we tried to access a local variable outside the method level\
    \ scope.\n\n### Problem 26\n\n```java\npackage fun.sanjibsinha;\n\n/*\nmethod\
    \ level scope of a local variable\n*/\n\nclass ChildPanda {\n    public void eat()\
    \ {\n        int weight = 3;\n        System.out.println(\"After each meal child\
    \ panda gains weight : \" + weight);\n    }\n}\n\npublic class ProblemTwentySix\
    \ {\n    public static void main(String args[]) {\n        ChildPanda child =\
    \ new ChildPanda();\n        //we cannot access the variable weight\n        //since\
    \ it is declared inside method, it has a method level scope\n        //weight\
    \ cannot be accessed out the method\n        //the following line will give us\
    \ error\n        child.weight = 4;\n        child.eat();\n    }\n}\n```\n\nThe\
    \ method `eat()` stores its state inside the local variable `weight` whose data\
    \ type is `int`. However, the reference variable `child` wants to access it directly\
    \ and tries to change its state. Watch the output:\n\n```text\n//output of problem\
    \ 26\nError:(17, 14) java: cannot find symbol\nsymbol:  variable weight\nlocation:\
    \ variable child of type fun.sanjibsinha.ChildPanda\n```\n\nOnce we have commented\
    \ out that particular line, the program runs perfectly well.\n\n```text\n//output\
    \ of problem 26\nAfter each meal child panda gains weight : 3\n```\n\nWe have\
    \ seen different types of variables, and in some cases, we have seen a type of\
    \ variable called ‘parameters’.\n\n### Parameters, another type of Variable\n\n\
    We need to remember one key thing about parameters. They are not classified as\
    \ fields, but classified as variables. Always. In the next two problems, we will\
    \ see how parameters work. The signature for the `main()` method in Java also\
    \ uses parameters.\n\n### Problem 27\n\n```java\npackage fun.sanjibsinha;\n\n\
    /*\nthere is exactly one copy of a class variable, regardless of how many times\
    \ the class\nhas been instantiated.\n*/\n\nclass ExerciseSchedule {\n    static\
    \ int weightGain = 0;\n    static int weightLoss = 0;\n    public void eat(int\
    \ weightGain){\n        ExerciseSchedule exerciseOne = new ExerciseSchedule();\n\
    \        this.weightGain = 2;\n        System.out.println(\"After each meal the\
    \ weight gain is : \" + exerciseOne.weightGain);\n    }\n    public void run(int\
    \ weightLoss){\n        ExerciseSchedule exerciseTwo = new ExerciseSchedule();\n\
    \        this.weightLoss = 2;\n        System.out.println(\"After running two\
    \ miles the weight gain is: \" +\n                    ( exerciseTwo.weightGain\
    \ - exerciseTwo.weightLoss ));\n    }\n}\n\npublic class ProblemTwentySeven {\n\
    \    public static void main(String args[]){\n        ExerciseSchedule newScheduleOne\
    \ = new ExerciseSchedule();\n        newScheduleOne.eat(2);\n        newScheduleOne.run(2);\n\
    \        ExerciseSchedule newScheduleTwo = new ExerciseSchedule();\n        newScheduleTwo.eat(3);\n\
    \        newScheduleTwo.run(3);\n    }\n}\n```\n\nHere is the output:\n\n```text\n\
    //output of problem 27\nAfter each meal the weight gain is : 2\nAfter running\
    \ two miles the weight gain is: 0\nAfter each meal the weight gain is : 2\nAfter\
    \ running two miles the weight gain is: 0\n```\n\nThe next code deals with the\
    \ same problem using parameters. Along with it we also used class variables with\
    \ static modifiers.\n\n### Problem 28\n\n```java\npackage fun.sanjibsinha;\n\n\
    class NewExerciseSchedule {\n    static int weightGain = 5;\n    static int weightLoss\
    \ = 4;\n    int rateOfPulse;\n\n    public int eat(int weightGain){\n        return\
    \ weightGain;\n    }\n    public int run(int weightLoss){\n        return weightLoss;\n\
    \    }\n}\n\npublic class ProblemTwentyEight {\n    public static void main(String\
    \ args[]){\n        NewExerciseSchedule scheduleOne = new NewExerciseSchedule();\n\
    \        //first reference variable\n        scheduleOne.rateOfPulse = 50;\n \
    \       System.out.println(\"Total weight loss for the first object : \" + (scheduleOne.eat(2)\
    \ - scheduleOne.run(2)) + \". And the rate of pulse is : \" + scheduleOne.rateOfPulse);\n\
    \        NewExerciseSchedule scheduleTwo = new NewExerciseSchedule();\n      \
    \  //second reference variable\n        scheduleTwo.rateOfPulse = 60;\n      \
    \  System.out.println(\"Total weight loss for the second object : \" + (scheduleTwo.eat(3)\
    \ - scheduleTwo.run(1)) + \". And the rate of pulse is : \" + scheduleTwo.rateOfPulse);\n\
    \        //first reference variable points to the second object and takes the\
    \ new value\n        scheduleOne.rateOfPulse = scheduleTwo.rateOfPulse;\n    \
    \    System.out.println(\"Total weight loss for the first object : \" + (scheduleOne.eat(10)\
    \ - scheduleOne.run(2)) + \". And the rate of pulse is : \" + scheduleOne.rateOfPulse);\n\
    \        //since a class variable has been declared with a static modifier\n \
    \       //we can access it with a class name\n        //we need not instantiate\n\
    \        NewExerciseSchedule.weightLoss = 1;\n        System.out.println(NewExerciseSchedule.weightGain\
    \ - NewExerciseSchedule.weightLoss);\n    }\n}\n```\n\nThe last line of output\
    \ gives us the subtracted value of two class variables.\n\n```text\n//output of\
    \ problem 28\nTotal weight loss for the first object : 0. And the rate of pulse\
    \ is : 50\nTotal weight loss for the second object : 2. And the rate of pulse\
    \ is : 60\nTotal weight loss for the first object : 8. And the rate of pulse is\
    \ : 60\n4\n```\n\n### Problem 29\n\n```java\npackage fun.sanjibsinha;\n\nclass\
    \ ProblemTwentyNine {\n    private int mySecretNumber = 10;\n    public void displaySecret(){\n\
    \        mySecretNumber = 45;\n        ProblemTwentyNine secret = new ProblemTwentyNine();\n\
    \        System.out.println(\"Reference variable accessing instance variable :\
    \ \" + secret.mySecretNumber);\n        System.out.println(\"Local Variable :\
    \ \" + mySecretNumber);\n    }\n    public static void main(String args[]){\n\
    \        ProblemTwentyNine notPrivate = new ProblemTwentyNine();\n        notPrivate.displaySecret();\n\
    \    }\n}\n```\n\nThe output is quite expected. We can get the local variable’s\
    \ value separately. Still we can have instance variable’s value using the reference\
    \ variable in the first line.\n\n```text\n//output of problem 29\nReference variable\
    \ accessing instance variable : 10\nLocal Variable : 45\nReference variable accessing\
    \ instance variable that points to the local variable : 45\n```\n\nYou need to\
    \ be careful about the usage of local variable. The scope is always inside the\
    \ curly braces. Whatever method we use, it is visible only inside that method.\
    \ The next problem will give you an idea. A small but meaningful program.\n\n\
    ### Problem 30\n\n```java\npackage fun.sanjibsinha;\n\npublic class ProblemThirty\
    \ {\n    public static void main(String args[]){\n        {\n            int anyNumber\
    \ = 10;\n            System.out.println(anyNumber);\n        }\n        //it will\
    \ give error\n        // System.out.println(anyNumber);\n    }\n}\n```\n"
