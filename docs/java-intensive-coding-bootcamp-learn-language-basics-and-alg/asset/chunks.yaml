    17          //etc

    18          int[] anotherNumber = {1, 2, 3};

    19          String[] nameColection = {"John", "Bob", "Mary"};

    20

    21          System.out.println("Does arrayCollection contains this element? "

    22          + Arrays.asList(nameColection).contains(2));

    23          System.out.println("Does arrayCollection contains this element? "

    24          + Arrays.asList(nameColection).contains("John"));

    25

    26    }

    27 }

    ```


    In the first case, we passed a numerical value. It is quite expected, the answer
    will be `false` because the array was `String` type. The next one is `true`.


    ```

    1 //output of problem 46

    2 Does arrayCollection contains this element? false

    3 Does arrayCollection contains this element? True

    ```


    A problem can be solved in many ways. Doing any arithmetic operations on any number
    is quite easy. However, when we want to add a range of numbers, array is to use.
    We can pass a range of value as an array and add them on fly.


    ### Problem 47


    ```java

    1 // problem 47

    2 //code 47

    3 package fun.sanjibsinha;

    4 /*

    5 We can pass array as parameter and we can manipulate that feature in many ways

    6 In this problem we have solved how to add collection of numbers

    7 */

    8

    9 import java.util.*;

    10

    11 import java.util.Arrays;

    12

    13 public class ProblemFortySeven {

    14

    15    public static void main(String[] args){

    16

    17          int[] anotherNumber = {10, 25, 300};

    18          addingAColeOfNUmbers(anotherNumber);

    19    }

    20    public static void addingAColeOfNUmbers(int[] aCollectionOfNumbers){

    21          int sum = 0;

    22          for (int i = 0; i < aCollectionOfNumbers.length; i++){

    23          sum += aCollectionOfNumbers[i];

    24          }

    25          System.out.println(sum);

    26    }

    27 }

    ```


    Using the shortcut syntax, we can pass as many numbers as possible, to get the
    result of addition. Here we pass three numbers: `10`, `25`, and `300`. And here
    is the output - `335`.


    We can also return any array value, using a method.


    ### Problem 48


    ```java

    1 // problem 48

    2 //code 48

    3 package fun.sanjibsinha;

    4 /*

    5 we can return any array value using a method

    6 */

    7

    8 public class ProblemFortyEight {

    9

