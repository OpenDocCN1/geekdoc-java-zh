    The ZenyModified mobile object has unique identifier: \"\n             + anotherMobile.hashCode());\n\
    ```\n\nBefore taking a look at the output, let us examine this line of code in\
    \ particular.\n\n```java\nMobileClass anotherMobile = new ZenyClass(\"Another\
    \ Zeny\", \"Blue\", 65.00, 5);\n```\n\nHere the reference variable `anotherMobile`\
    \ should have pointed to the `MobileClass` object, right? That would have been\
    \ the usual scenario. Instead, it points to a subclass object and acts differently.\
    \ If we had written it in the usual manner, creating a `MobileClass` object, it\
    \ would have acted in a different way.\n\nLet us see the output and it will be\
    \ clear how similar objects get the same message but do different things.\n\n\
    ```\n//output of code 96\nMob is not equal to A Mobile\nAnother Zeny has color:\
    \ Blue\nAnother Zeny's price: 65.0 Euro.\nThe ZenyModified mobile object has unique\
    \ identifier: 1684106402\n```\n\nIn a very short space, we have discussed a few\
    \ important object-oriented-programming concepts; although the code snippets are\
    \ very basic one. In the next chapter, we will discuss another important concept:\
    \ interface and abstract methods.\n\n# Chapter Eleven: Interface and Abstraction\n\
    \nUsing Interface in object-oriented-programming is really tricky. The concept\
    \ demands more attention than it appears. We have already seen some examples of\
    \ abstraction or encapsulation. A class is a good example of abstraction. It encapsulates\
    \ every detail from the users.\n\nUsers do things with objects without knowing\
    \ what is happening behind, how it was designed in a blueprint. Interface takes\
    \ that concepts of abstraction to a higher level. Let us give a concrete example\
    \ to understand how it works.\n\nSuppose a school wants to measure the weight\
    \ of every student for medical purpose. The school authority hires a contractor\
    \ and gives the contract. The school authority does not care about how the work\
    \ has been done. They want records and the contract is implemented. The students\
    \ also don’t know why their weights are taken. Now this contract can be implemented\
    \ in other spheres. A book company might want to compare the number of pages of\
    \ the books they have published. They can also implement this.\n\nSince the objects\
    \ are nouns, we treat interfaces as adjectives that tells us something about the\
    \ objects. In the above scenario, the student objects are comparable. The book\
    \ objects are also comparable.\n\nAnother advantage of interface is we can implement\
    \ multiple interfaces. Just like a noun that may have multiple adjectives. A person\
    \ is good as well as honest.\n\nA class can be extended and at the same time,\
    \ it may implement multiple interfaces. The next problem is a showcase for the\
    \ same example.\n\n### Problem 97\n\n```java\n// problem 97\n//code 97\npackage\
    \ fun.sanjibsinha;\n\n/*\nclass cannot extend multiple classes\nso we cannot write\
    \ like this: public class CatyClass extends MobileClass, MobileFeatures\n*/\n\
    public class CatyClass extends MobileClass implements MobileUpgradable {\n\n \
    \   private double batteryStrength = 0.0;\n    private int pixel = 10;\n    private\
    \ double mins = 60.0;\n    private int days = 0;\n    public double version =\
    \ 1.0;\n\n    public double getVersion() {\n        return version;\n    }\n\n\
    \    public void setVersion(double version) {\n        this.version = version;\n\
    \    }\n\n    public double getBatteryStrength() {\n        return batteryStrength;\n\
