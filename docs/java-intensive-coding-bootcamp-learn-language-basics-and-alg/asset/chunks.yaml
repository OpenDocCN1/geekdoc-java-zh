    Unfixed Iteration


    In the next problem, we will see two types of loops one after another. The first
    snippet examines how unfixed iteration takes place in while loop. The subsequent
    for loop gives us a different set of value. In case of ‘for’ loop, we know how
    many iterations are going to take place. In case of ‘while’ loop, we do not know
    the number of iterations. That is why, it always checks whether the condition
    is true or false. When the ‘while’ loop finds the condition is ‘true’, it goes
    on until the condition turns ‘false’.


