- fmt: "\n```java\npublic void questionWiseMen(WiseMen wise){\n    this.wise = wise;\n\
    \    System.out.println(this.name + \" questioned the wisdom of \" + wise.name);\n\
    }\n\npublic void sayToWiseMen(WiseMen wise){\n    this.wise = wise;\n    System.out.println(this.name\
    \ + \" said to the \" + wise.name + \" hearing\" +\n    \" his death sentence,\
    \ 'an unexamined life is not worth living'.\");\n}\n\npublic void dieByDrinking(Hemlock\
    \ hemlock){\n    this.hemlock = hemlock;\n    System.out.println(this.name + \"\
    \ died drinking \" + hemlock.nature);\n}\n```\n\nAfter that we need a `Plato`\
    \ class, similarly, with some states and methods.\n\n```java\n// class Plato\n\
    // blueprint of Plato object\npackage fun.sanjibsinha.object;\n\nclass Plato {\n\
    \    public String name = \"Plato\";\n    Socrates socrates;\n\n    public void\
    \ hasARelationWith(Socrates socrates){\n        this.socrates = socrates;\n  \
    \      System.out.println(this.name + \" had a friendship with \" + socrates.name);\n\
    \    }\n    public void writesAbout(Socrates socrates){\n        this.socrates\
    \ = socrates;\n        System.out.println(this.name + \" had written about his\
    \ friend and teacher \"\n        + socrates.name);\n    }\n}\n```\n\nNext, we\
    \ want the wise men of Athens, who had decided Socrates’ fate, and gave him death\
    \ sentence.\n\n```java\n// class WiseMen\n// blueprint of WiseMen object\npackage\
    \ fun.sanjibsinha.object;\n\nclass WiseMen {\n    public String name = \"Wise\
    \ men of Athens\";\n    Socrates socrates;\n\n    public void giveDeathSentenceTo(Socrates\
    \ socrates){\n        this.socrates = socrates;\n        System.out.println(this.name\
    \ + \" had given death sentence to \"\n        + socrates.name);\n    }\n}\n```\n\
    \nThe `Hemlock` object is defined in a small class, where its state has been declared\
    \ as poison.\n\n```java\n// class Hemlock\n// blueprint of Hemlock object\npackage\
    \ fun.sanjibsinha.object;\n\nclass Hemlock {\n    public String nature = \"Poison\"\
    ;\n}\n```\n\nBy reading the above blueprints or classes we can say that they are\
    \ based on real life story. We have written each class in a way, so that they\
    \ have some states and behaviors, such as `Socrates` has states like:\n\n`public\
    \ String name = \"Socrates\";`\n\nThe `Socrates` class also has some behaviors\
    \ like this:\n\n```java\npublic void questionWiseMen(WiseMen wise){\n    this.wise\
    \ = wise;\n    System.out.println(this.name + \" questioned the wisdom of \" +\
    \ wise.name);\n}\n```\n\nIt is clearly seen that behaviors are also called functions\
    \ or methods. Through any method we can pass one or more than one parameters,\
    \ such as, here we have passed an ‘WiseMen’ object. We have also given it a name\
    \ `wise` . Now, do not worry about the keywords we have used, like `public`, or\
    \ syntax like `;` that ends an expression. We will learn them later. We have probably\
    \ noticed that we always follow a sets of rules to write one class from which\
    \ one or more objects could be created later.\n\nWe have also noticed that a class\
    \ always clearly defines the ‘state’ and ‘behavior’, so that later no disambiguation\
    \ is formed. Computer does not like ambiguities. It wants clear instructions;\
    \ a step-by-step instruction.\n\nFrom the above code it is visible that one or\
    \ more objects could be ‘state’ of another object. Look at the `Socrates` class:\n\
    \n`public String name = \"Socrates\";`\n`WiseMen wise;`\n`Hemlock hemlock;`\n\n\
    These are all ‘states’ that are defined in `Socrates` class. Of three states,\
    \ two are ‘objects’, which have their own classes.\n\nFinally, we want to run\
    \ the application by creating the objects, and based on the relationship they\
    \ have, we build our algorithm.\n\n```java\n// code of main() method\npackage\
    \ fun.sanjibsinha.object;\n\npublic class PhilosopherDemo {\n\n    public static\
    \ void main(String[] args) {\n        Socrates socrates = new Socrates();\n  \
    \      WiseMen wiseMenOfAthens = new WiseMen();\n        Plato plato = new Plato();\n\
    \        Hemlock hemlock = new Hemlock();\n        socrates.questionWiseMen(wiseMenOfAthens);\n\
    \        wiseMenOfAthens.giveDeathSentenceTo(socrates);\n        socrates.sayToWiseMen(wiseMenOfAthens);\n\
    \        socrates.dieByDrinking(hemlock);\n        plato.hasARelationWith(socrates);\n\
    \        plato.writesAbout(socrates);\n    }\n}\n```\n\nWhile we run our application,\
    \ we get this output:\n\n```\nSocrates questioned the wisdom of Wise men of Athens\n\
    Wise men of Athens had given death sentence to Socrates\nSocrates said to the\
    \ Wise men of Athens hearing his death sentence, 'an unexamined life is not worth\
    \ living'.\nSocrates died drinking Poison\nPlato had a friendship with Socrates\n\
    Plato had written about his friend and teacher Socrates\n```\n\nI hope, this example\
    \ will help you to understand how objects contain other objects, communicating\
    \ with each other. It is also known as ‘has-a-relationship’. When we inherit one\
    \ class from another, that is called ‘is-a-relationship’.\n\nWe will discuss them\
    \ later in detail.\n\n# Chapter Two: Java Standard Edition Development Kit and\
    \ IDE\n\nThis chapter will be short as we will discuss only two key points here.\n\
    \nTo write Java code and run it as well, we need two things in particular. The\
