    ‘Oh, that,’ I muttered.


    ‘Looks like it got infected again. You have to be careful with nasty cuts like
    that, Gyle, like I said last time.’


    He smiled and I was supposed to take it as a caring reproach.


    I said, ‘I’ve been too busy. Look, Cunny, if everyone else has already got the
    story, we might as well sod off, right?’


    He sighed: ‘Not me, I have to stay. Editor insists.’


    ‘All night?’


    He glanced at his watch, as if it made a difference.


    ‘As long as it takes. I know it’s pointless.’


    ‘Where’s your cameraman?’


    ‘He’s taking a piss inside.’


