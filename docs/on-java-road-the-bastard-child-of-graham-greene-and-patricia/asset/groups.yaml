    献给娜塔莉·王

    她曾与我一起走过山前往石湾

    并引发了一个故事


    一个绅士总是按照良心行事，正如李东医生所言


    # 第一章


    在那些绝望的日子里，我总会想起在学校读过的一部小说里的那段话，叙述者坚持认为自己更希望被称为“报道员”而非“记者”，后者这个谦卑的词汇描述了他所做的工作，即记录他所看到的一切。如今的职业描述甚至更不那么光彩。当然，我认识香港所有的记者，但也认识许多报道员——那些追踪城市流动区域的公民，他们经常像我一样独自拿着手机相机，随着时间的推移，我发现自己在他们中间变得更加自在，却并没有意识地知道为什么。但，我们在描述的是什么？又是为谁而描述？我也不确定。对我自己来说，也许还有像我想象的那样散落在世界各地的少数人，这取决于你想多深地进入内心。其中一些报道员变得异常出名。在这方面他们和我不同。尽管我在香港呆了二十多年，作为一个事事包办的报道员苦干工作，坚持进入受人尊敬的更高阶层，但我在这座定居的城市里从未闯出过名堂。人们模糊地知道我是一个写过某些东西的作家，还是一个名声不佳的饕客，但仅此而已。我年轻时来到那里的，被伦敦及其前景冷得刺骨，无法预见自己能在那座坟墓中获得成功。我在回归后不久就抵达香港，除了大学好友老唐外一无所知，仅带着行李箱和五千英镑积蓄。考虑到这些开端，我过得不错，但从未成为过明星作家。在某种程度上，我并不在意。我曾在各种报纸工作，当过美食评论家，结婚后离婚，积累了一间小公寓，并完善了大学期间的中文。换句话说，我是一个优秀的平庸之。


    事实上，那个夏天初，动荡最初爆发时，我感到自己仿佛从一场深沉且毫无意义的睡眠中醒来。我所习惯的那个城市——舒适、愤世、充斥着晚宴和白松露活动——在看到我的邻居之一在深夜穿着白色无袖衫、手持菜刀出现在爪牙路时，彻底破碎了。我不认识他的名字，但我我每隔一天就会在顺顺见到他，那是爪牙路上的一家餐厅，我大部分时间都在那里喝茶吃云饺、编辑我的报道。我想他也认出了我，但在深夜街头那一刻，他对我来说是隐形的，因为他在那里是为了寻找可以恐吓的抗议者，而一场中国的内战并不会包括欧洲流浪者。


    后来，确实，某些外籍流人在那个席卷城市的冲突中确实成为了当地的英雄，就像那个没腿的法国人站在摇摇欲坠的假肢上，慷慨激昂地发表对学生的支持。我从未得知他的名字，尽管我决定如果能在廉价餐厅看到他独自用餐，就请他喝一杯。他仅仅被称为“那个没腿的法国人”。至于顺顺那个拿刀的食客，我同样不知道他的名字，但他会像民间故事里的鬼魂一样再次出现，从未失去过令人不安的力量。


