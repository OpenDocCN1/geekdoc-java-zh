    人们可能会猜到，大宅里的大富居民早已离开了世界的其他地方。资金正向外流失，这股不可阻挡的潮流是由对这座城市正在发生之变的绝望驱动的。然而，当大门打开时，有一个女仆在那里迎接来者。她认出了我，打招呼道：“你好，盖尔先生？”当我们走向那些比我们更有钱的人时，她我交换了同一种忧郁的眼神。


    这是一场大约十五人的聚会，与其说是派对，不如说是晚餐。但唐家不喜欢围坐在桌旁，所以客人们坐在哪里，就在哪里享用。我也喜欢这种方式。他们是老练的主人，在家招待方面没有出过错。梅莎·唐（Melissa
    Tang）开了门；显然，门卫已经通知过我。她穿着一件黑色羊绒开衫和丝绒长裤，对她来说这很休闲，因为颜色相同，我唯一注意到的细节是她颈上的珍珠项链。那既戏剧又时髦；她总是那样。这里还是她父亲——古怪万富翁罗德尼·周（Rodney
    Chow）的旧公寓，那些铺了地毯的房间和从中国收藏的明代陶器让她感到舒适。周家和唐家一样富有，尽管他们的钱是从制造业和电视站里赚来的。罗德尼是个脾气古怪的老头，喜欢雅卡花织烟睡袍和瑞典女孩，他经常出现在唐家的聚会上或出没于街头，但我很少与他互动，因为我畏惧并厌恶他。罗德尼那夸张的品味无处不在。在那些无价的陶器中，有一尊是等身马，它的脖子上挂着泥土色的铃铛，像守护神一样站在门厅里。每当梅莎走过它时，她都会轻地抚摸过它的侧腹，现在也是如此。“我很很高你你来了，”她一边领着我进去，一边没有回头，“吉米（Jimmy）整天心情都很糟糕。”


    “噢？”


    “家里希望他对香港局势发表一个表态，这样当局就知道我们的立场——希望是和他们站在一起。”


    “表态？”


    “他们希望他宣布对国家和共产党的忠诚。嗯，措辞不会那么直接。”

    “那会怎么说呢？”


    她在内心犹豫不决，我看得出来，她咬紧牙关，嘴角紧绷，调动了所有的外交手段。


    “措辞会写成一种信仰的宣言——对香港未来的信仰。我必须说得那么直白吗？”


    多年来，我一直认为他们的家是香港最优雅的，尽管它很老旧，走起来咯吱作响，而且剥离了现代科技。它是刻意采用维多利亚风格的，因为那是梅莎父亲更西化的品味，但渐渐，她自己那种更中式的感性开始占据主导地位。吊灯显得静止而不详，墙上的挂毯展示着故宫的场景，我无法从风格上界定它们，悬浮在东方主义和真实的东方之间；而陶器现在无处不在，被安置在底座或壁龛的架子上，博物馆级的品质，且带着一丝过分的自傲。它们散落在几幅来自20世纪60年代末精致的陈大华（Luis
    Chan）迷幻水彩中，这些画描绘了梦幻的岛屿和幽灵，旁边还有奇异的恐龙和奇特的鸟类；还有一件由吉米强迫妻子接受的、当代新写实风格的更具争议的周振辉（Chow
    Chun Fai）的作品。我知道振辉画的是几十年前经典香港电影的剧照，他的反建制政治不受梅莎这种背景的人待见——尽管如此，那件作品仍挂在他们的客厅里，几乎未被注意到，带着一种不安的妥协精神。一群穿着坎心背的男人坐在桌旁，在1970年代某个被遗忘的年份玩着牌，散发着寂静的威胁。


    这个房间对着一个阳台，阳台沐浴在永不熄灭的大楼光芒中，这些大楼向维多利亚港延伸。大海显现出来，尖沙咀的霓虹灯在黑色的海面上闪烁，渡轮穿过倒影。那里已经有一群人坐在藤椅上，用公用水壶喝着曼哈顿冰茶。我认识其中的好几个人。唐家有两个交叠得尴尬的圈子：一边是高薪对冲基金人和银行家，另一边是记者和学者，他们来到半山山的异域世界与这些金融领主相社交，而这些领主反过来几乎注意不到他们。我对这两个圈子都很熟悉，尽管从某种意义上说，我更喜欢银行家。他们不虚伪，那种友善的法西斯主义是直率的。


    但与此同时还有第二个阳台，吉米把它变成了一座热带花园，从另一个房间进入，梅莎带我去那里，是因为她想和我单独谈谈，如果我不介意的话。景色是一样的，但独自坐在微缩丛林中的单沙发上。一个女仆为我们送来了饮料。我和梅莎的关系并不特别亲近，尽管显然我们通过吉米认识了多年。我觉得她很有同情心，而且在某种意义上，有一种脆弱的尊贵。她尊贵的不是对吉米幼稚和自私的隐忍，而是她为了某种崇高目标而假装在思考某些事情的能力。

