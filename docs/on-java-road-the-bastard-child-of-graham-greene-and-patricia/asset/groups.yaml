    # THREE


    TWO NIGHTS LATER, AS I TOOK THE LIFT UP TO Dudley’s, that discretely elegant restaurant
    housed in an office building on the steep lane of the same name, and around the
    corner from Foxglove it happened, I felt wet chills moving down my spine and the
    backs of my legs as the throbbing in my cheek grew worse. The wound had got infected
    in the bacterial heat. Yet the streets were clear. In the cab we had passed a
    lone tear-gas canister sitting in the road spouting a plume of smoke like a little
    geyser. Nothing around it, just broken glass and pieces of fried rubber. It had
    strayed onto an irrelevant street by accident and no one had even noticed. Yet
    it had stung my eyes, and now as I reached the third floor and the club-like reception
    area of the restaurant my vision blurred and I had to ask the staff to find the
    table for me.


    Jimmy and his guest were already there and, in a place famous for its wine, they
    had a a bottle already in place that was worthy of Jimmy’s exacting tastes. The
    woman glanced up and saw me first but without knowing who I was; a slightly quizzical
    disappointment crossed her face, but with a'
  - '[PAGE 57]


    certainty that I was the one they were waiting for. She was self-contained in
    a way, neat long hair, and an asymmetrical face that would age in an interesting
    way. She was dressed in T-shirt and jeans but quietly on point; you would notice
    even in passing. She said something to Jimmy and he half turned towards me. Dressed
    in a W. Bill summer suit and a white linen Calabrese scarf with paisley patterns,
    he had his back to the blind-dimmed windows, and as always he was a little too
    conspicuous. Obviously his guest was letting her-self be plied with André Beaufort
    champagne.


    ‘Oh, there you are,’ Jimmy said in Cantonese, confirming that impression. I saw
    that my place was already set, and as I moved to sit down a waiter materialised
    to fill my glass.


    I said, ‘I definitely need that.’


    ‘Adrian, this is Rebecca. Rebecca, this is Adrian. Now we’ll-move to English because
    Adrian’s Chinese is a bit iffy.’


    He was right, but it wasn''t as if I couldn''t hold a pretty decent conversation
    at speed. I shrugged at her and she seemed to understand that I was the shy sort
    and that she could me some slack.


    ‘I thought you said he reads Chinese poetry.’


    As Jimmy winked at her eyes fell upon me and-thing inside gave way, stepping backwards
    into the wings and ceding territory. Her gaze had a shimmering heat. And so we
    switched to English, which was a shame, I thought in the moment, since Chinese
    might have suited our threesome better.


    ‘Pleased to meet you,’ Rebecca said, shaking my hand. Her English appeared to
    be perfect.


    From a good family, I thought to myself, and I knew the type. But which family?
    Jimmy used the city as his oyster'
  - '[PAGE 58]


    without ever drawing attention to the fact. She went on,

    ‘What is that gash on your cheek?’

    ‘Attacked by a bottle.’

    ‘A bottle? With a human attached to it?’

    I told the story, wearily. Myself, bottle, lout – the whole sorry interaction.
    Jimmy found it coldly amusing.

    ‘Sorry to hear it, comrade. Was there a war of words first?’

    ‘None.’ I really didn’t want to get into it, so I glossed over the exchange.

    ‘Straight out of the blue, eh? If you want me to have him rubbed out, just say
    the word.’

    ‘You’d never find him.’

    ‘Likely not.’ He grinned. ‘La vie en merde, but what can we do? Bear your scar
    like a warrior and make it a talking point with women, that’s my advice.’

    For a moment, though, he looked concerned despite his flippant tone. It was on
    me, to put him back at ease.

    ‘I’ll live. Let’s lose ourselves in food instead.’

    nThe great pastime of the empty-headed. Which includes me, I’m happy to say.’

    ‘Order for me.’ I could always trust Jimmy’s taste.

    ‘Cod with peppercorn?’ Whether with silky fowl and alone?’ His face was mildly
    flushed with anticipation. ‘What do you say, we’re good for that, aren’t we? Crispy
    suckling pig?’

    He ordered in Cantonese. Rebecca slowly took me in with those eyes that tracked
    small things as a matter of course. A stranger, not very attractive but full of
    empty words. The reverse of herself. The room was only half full'
  - '[PAGE 59]


    and she seemed to fill it even with her subdued luminosity. She was one of those
    people who gives the impression of a physical stillness that is an accurate transcription
    of the international kind.


    I lifted the glass for a toast of some sort.


    ‘Yum sing.’


    We drank together and Jimmy’s eyes, bright and hard above the glass, found me
    and dared me to question his taste.


    ‘Jimmy tells me you’re a student,’ I began. It was a clumsy opener but someone
    had to start the ball rolling. She looked at him playfully.


    ‘Is that what he said?’


    ‘He’s a terrible liar. Feel free to give me the truth.’


    ‘No, he’s not lying – not now anyway.’


    ‘Calumnies,’ Jimmy protested. ‘She’s a student at the university. We all were
    once. I don’t hold it against her.’


    ‘I’m studying American literature.’


    ‘So how did you meet the great Jimmy Tang?’ I said.


    ‘On Tinder, obviously.’


    ‘Another lie,’ Jimmy protested again, but chuckling mostly for himself. ‘One should
    never divulge that kind of anything. If you really want to know—’


    ‘No,’ I said, ‘not at all. Like you say.’


    – if you want to know,,’ he persisted, ‘she’s been pursuing me for years. I had
    to fend her off – but to no avail, as you can see.’


    I turned to her. ‘Is this true?’


    She nodded, and right on cue, a plate of crispy suckling pig arrived looking as
    if it had just been flayed alive, with a side of jam and the cod alongside it.
    I understood something'
  - '[PAGE 60]


    then, just as Jimmy had said: that their families were connected, sharing habits
    of class and privilege. They were poles apart on many levels, but at the same
    time literature, money and a shared social class in a small environment had brought
    them together sufficiently to give life to a nascent sexual spark.


    Confirming this, she was soon describing her old school in Switzerland. It was
    the École Chantemerle near Montreux. Her father was a banker, a philanthropist
    well known in the art world. A not-so-subtle hint was dropped that he and Jimmy
    went way back.


    That he had waylaid the daughter of one of his social peers, if that was indeed
    what had happened, was not for Jimmy the most salubrious decision. She spoke more
    slowly than either of us, and once the school had been mentioned she didn’t seem
    keen to talk about herself much more. Nevertheless I could see ambition of a kind,
    a scepticism about her own class that might have extended to Jimmy. Yet they were
    playful and comfortable with each other. They had shared a bed, I thought with
    annoyance. A reaction that was surprising even to me. He had won her over in some
    way: the liquid intelligence, the ability to quote Chinese poetry from memory.
    To a young woman who shared those interests it appeared to be a combustible chemistry.
    And perhaps very unusual, in Jimmy’s case it was fused with glamour of a material
    kind. I could see it now. Few men had those qualities nowadays.


    ‘What about you?'' she said to me.


    ‘I’m a recovering hack. I’ve been recovering for a few months – I probably won’t
    recover at all—’'
  - '[PAGE 61]


    Years, in fact,’ Jimmy interjected.

    ‘ – but now I seem to be healing. I write online dispatches for a news organisation.
    It’s owned by a billionaire in the States. It’s nothing very serious. You know
    these billionaires.’


    She ignored that dig and when I mentioned the name she nodded but without much
    respect.


    ‘You must be busy right now,’ she said.

    ‘To tell you the truth, I’m running out of energy. I’m probably too cynical for
    this game. Running away from Raptors and all that. They can run faster than me
    anyway.’


    ‘They’re getting faster, too.’nRaptors, as the police arrest units were fondly
    called by their prey, were certainly quick. They must have been hired from amateur
    athletics teams. Jimmy made a quick face at me and – over a third pour of the
    Beaufort – I had to admit I was reaching the time when one puts oneself out to
    pasture simply out of exasperation.


    ‘You’re twenty years too late, Adriano. But I admire you for going out anyway
    and fighting the good fight.’ He addressed his lover: ‘Our Adrian here thinks
    your generation are rather fine. He was a bit of an anarchist himself back when
    we were students, so I’m not entirely surprised. Not Kropotkin, but close. There
    was much talk of revolution on the lawns of the Cam.’


    ‘Is that true?’ She turned to me with a sudden pulse of interest.

    Kropotkin on the Cam, that had been me but only for about a year.'
