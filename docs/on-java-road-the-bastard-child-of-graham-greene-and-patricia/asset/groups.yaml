    它们在我看来似乎比平时还要荒唐。那些凌乱的月牙，被无休止的忧虑毁了。


    “不。我失去了处理那种事的触感。我有时觉得，这是因为我失去了享受简单快乐的窍门。‘快乐’是我最讨厌的词。”


    “吉米没告诉你吗，在一切陷入黑暗之前，人得先找点乐子？我本以为你是个玩乐专家。不是吗？”


    “完全不是，不。我是一个忧郁的人眼中的忧郁者。”


    但我们付笑着随带过去了，她对我说的话一个字也不信。


    “吉米和我对此持不同意见。对我来说，这是一种选择。我喜欢表现得忧郁一点，这样可以赶走苍蝇。”


    “噢。当然，我之前曾严重怀疑这一点。”


    “我想我可能得得走了，”她说，压着一个哈欠，“我其实挺累的。我刚才吸入了太多催泪瓦。”


    “吉米呢？”


    “他会回家回到妻子身边，喝一杯热白兰。今天是周中。”


    “就这么简单？”


    她的眼神松弛了一些，那抹心不在意的笑容与神情相合。


    “我们分道扬扬。我们并不是日夜形绑在一起，如果你没注意到的话。已婚男人。我管他们叫‘部落’。”


    这向坦白方向迈进了一大步，我看出她立刻后悔了。


    *这是你们的游戏，我想。规则是你们的规则。*


    她说：“你和吉米可以留下来喝酒，或者做你们喜欢做的任何事。真可惜已经没有鸦片馆了。”


    “留下来，”我想说，“夜晚还值年。”


    接着我低头看向她那双与我呈角度交叉的双腿，注意到她的小腿上有蓝色染料的斑点。警察在水水炮中使用那种染料，这样任何被喷洒过的人以后都能被识别出来。


    “你去哪儿了？”我问，语气让我们都明白了我的意思。


    “没什么特别的——我在街上闲逛。谁想知道？”


    “吉米没告诉你别去吗？”


    “他说了，但那不是他的决定。他不能去但我可以。既然我必须去，我就去。”她停顿了一下，“你也一样。”


    “那么也许有一天我会在那里见到你。别害羞。你会看到我的，因为我从不戴头盔。”


    “我们这些蟑虫不害羞——我们很合群。我也不戴。”


    我接下来的话几乎是认真的：


    “如果我们那样碰面，我保证你不会告诉我们共同的朋友。如果你愿意，甚至可以把我介绍给你的朋友。我对他们很好奇。”


    “你是指‘年轻人’，用你对他们的称呼吗？我们没什么特别的。我们只是没有经验的你们。你们在我们那个年纪时并没有区别。”


    我在想这是否真的。在那一瞬间，受这种评论的触动，过去的碎片回到了我的脑海。我在那个年纪真的和她、她那代人一样吗？我无法回答这个问题。我说，有时我觉得自己从未年轻过，因为我越来越记不起来了。感觉就像我很久以前表演的一场哑剧。但我丢失了剧本，现在完全没有剧本了。老去从不是你预想中的样子。划着桨，被不断地推回过去。”


    “剧本？”她说，“你们是感性的一代，如果你不知道的话。我们是受宠坏的孩子，但不是感性的受宠坏孩子。”


    “感性一点也没什么不好。你怎么能不呢？”


    “但你，”她继续道，“你年轻时有些可以期待的东西。你有未来。这就是区别。”


    这种平庸之事中简单的沉重感让我感到意外。西方的年轻人总是这样说话，而且已经这样说了几个世纪。而最后，在现实世界里，他们总是会有一个相当舒适的未来。性手乐队的成员除了偶尔过量外，都过得体堂。“没有未来”被证明是一个空洞的调调。我们的反叛者最终都在科罗拉多买了牧场，或在哥斯达黎卡买了海别墅。他们从未处于危险之中。但香港这一代面临着一个没有未来的真实未来，一种由银行、电子战以及拿着机关枪和望远镜的男人所强制的真实遗忘。他们就像魏玛最后的苍白的花。那时我想，如果一个人承担了她所处的所有环境，也是那个环境让她们变得美丽。


    吉米再次出现，依然对着手机说话。总有一些没人知道的交易在进行——机会、商机、在他人脉中赚钱的方法。他结束了通话，装出一副兴致勃勃的样子，大概会持续一整晚。


    但当瑞贝卡宣布她离开时，他似乎很恼火。“噢？”他说，“阿德里安说了什么伤人的话吗？”


    “完全没有。他表现得很温柔。”


    他给了我一个意味深眼神。“他确实很甜。如果你打算当个废物的话，我就跟他去喝一杯。”


    “我厌倦喝酒了，”瑞贝卡说道，细心地将餐巾折回原来的正方形，“带阿德里安去Ron吧。”


    “等一下，”我想说，“夜晚还值年。”接着我低头看向她那双与我呈角度交叉的双腿，注意到她的小腿上有蓝色染料的斑点。警察在水水炮中使用那种染料，这样任何被喷洒过的人以后都能被识别出来。


