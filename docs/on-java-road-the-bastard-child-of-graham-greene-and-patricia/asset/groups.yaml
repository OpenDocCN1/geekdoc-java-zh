  - '[PAGE 115]


    102


    left and then approach Strick with an explanation for my abence. I had felt sick
    and decided to go home. I slipped the boy a tip, in the old-fashioned way.


    We went down alone in the lift, awkward for the first time, and onto Des Voux
    between the Bank of China''s two stone lions. The road with its curving tram lines
    lay empty under the overwhelming presence of the HSBC Building and on the far
    side of Chater Garden''s sum-summer trees basked in orange light. We crossed over
    to the neoclassical court buildings and dived into the gardens fringed with Chinese
    fan palms.


    The long L-shaped pool there was covered with dried leaves, as if it hadn''t swept
    clean in years, and the paths were bathed in the massive light displays of the
    towers around it. The other, newer Bank of China building, with zigzagging white
    neons alternating rhythmically, and the HSBC Building nearby projecting immense
    red and white graphics of bamboo leaves into the surrounding darkness. I didn''t
    know why I had asked her for a walk in the gardens, the decision had not been
    entirely conscious. A small park which would probably be quiet while the cop vans
    were spread out along Chater Road. I had seen their flashing lights earlier and
    sure, enough, they were still there when we came down. On Des Voux Road, in fact,
    curious impromptu barricades of uprooted potted palms lay unmanned among rubbish
    bags and sundry debris designed to deter traffic – succeeding almost completely.
    Only a few teenagers in gas masks, holding their signature umbrellas, slipped
    by in the quiet. In the gardens the rubber trees brought in by the Brit'
  - '[PAGE 116]


    103


    ish long ago dripped with a multitude of aerial roots and in the middle of the
    paths Chinese holly trees cast a sticky gloom onto our heads as we passed underneath
    them.

    Rebecca explained that she and Jimmy would sometimes go to a house that her family
    owned on the Peak, a small mansion that her father had built in the 1980s for
    his own use, but which he had given to her to use as a pied-à-terre. A place above
    the city in the green hills to find a little peace. Her father, she told me, had
    used it for secretive poker parties before the Handover. After that he had gradually
    abandoned the place to his mistresses, and when they faded away he had given it
    to her. Now she and Jimmy sometimes met there to be alone. But somehow I couldn''t
    quite imagine it. I was probably just touch jealous. We walked on the flagged
    paths at a slow pace, a few inches apart, and I could detect the perspiration
    on the back of her neck. There was something about it that reminded me of a pleasure
    that was now faded and lives only in memory. Meanwhile she had launched into a
    description of her family and their anxious disapproval of her political activities.
    It would have been surprising if they had not disapproved, being an old and respectable
    family. The risks to both Rebecca and them were enormous and the outcome was bound
    to be ignominious for the family. She said that her father lectured her about
    it; her mother had sunk into exasperated resignation. They understood the issues
    abstractly, of course, but they could not accept her course of action. And so
    parents and child had reached an impasse.

    ‘Personally, I don’t care that much,’ Rebecca said. ‘The'
  - '[PAGE 117]


    city is over and done with if you ask me. It’s disappearing around us. In ten
    years’ time it will be unrecognisable. Just another anonymous Chinese city.’


    I said it was bound to be so.

    ‘I’ll be a janitor by then.’


    She shot me an unconvinced look, then smiled. ‘You’d make a fine janitor. Me,
    I’ll be in Canada, or somewhere equally safe and bland.’


    I said that was the saddest part about it: the departure of her generation. A
    new wandering diaspora would be created.

    ‘It would be ironic if you left and I stayed,’ I said.


    She seemed not to hear me, her shoulders now moving through spots of shadow and
    light, her sweat made even more noticeable by the heat. Her arm slung by her side
    glittered with a lone watchstrap.


    But maybe this city was just a hallucination after all.’ She made a quick survey
    of the towering neons around us as if to make a gestural point. ‘It was never
    meant to last. I wonder if I’ll come back when I’m old and remember you and Jimmy.

    Light joss sticks for you both.’


    ‘Please do. As. spirits, we’ll appreciate it.’

    ‘You’d do the same for me, wouldn’t you?’


    ‘I’ve got at least twenty-five years on you. It’s not going to happen.’


    You never know, her face seemed to say. We let the matter drop and continued walking,
    in that way people have when they know that the unspoken is far more interesting
    than the inverse. Yet it was a small park and soon, if you weren’t careful, you’d
    find yourself doing laps. We came to the end of the promenade, and the issue arose
    of going our separate ways.'
  - '[PAGE 118]


    ‘I’m going up to the Peak now,’ she said. ‘I suppose you must be busy, too. Jimmy’s
    staying in town tonight. He has some messy engagement with his family. So I’ll
    spend a night up on the mountain. I like it much better up there.’


    I said, quite spontaneously, if she liked I could take her back in a car and then
    have it drive me home afterwards. It was a small detour.


    ‘You don’t have to do that.’


    ‘It’s a gentleman’s duty.’


    She seemed to be made pensive by the idea of gentlemen and their duties.


    In the end it was a short drive at night and there was no reason for her to say
