    from me personally, how should I report and describe them? This question made
    me want to eat at Fung Shing every single night. Besides, the very name in English,
    Phoenix City, now seemed more apposite than it had before. Another phoenix, another
    riddle.


    Every time I climbed up the staircase to the second-floor eatery, which was level
    with its red-and-blue street sign, past a regal gold image of the bird equipped
    with a blue eye, I wondered if all eyes would be upon me as I entered the main
    room alone, dazzled by the overhead interrogation lights the Chinese seem to love
    in their restaurants, and which made me even more aware than usual of my unforableness.
