    ‘So you came from the hospital?’ Moyers said to Cunningham directly, his eyes
    narrowing on a target inside the other man''s emotions.


    ‘Editor''s orders.’


    ‘I told Sonny it wasn''t worth going – it served that ankle-biter right and everyone
    knows it. It''s time we stopped glorifying protesters with coverage. I know Gyle
    here will disagree but I''ve seen the footage. That kid was throwing bricks,,
    for Christ''s sake.’'
