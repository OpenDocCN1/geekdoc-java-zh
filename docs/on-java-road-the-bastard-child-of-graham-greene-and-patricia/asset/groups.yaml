    was a man who, deep down, believed that words came dearly to most people and so
    constituted a de-based coinage. To him, ‘revolution’, *gak ming*, was the cheapest
    of the cheap especially in English, a word worthy of John Lennon and Patty Hearst.
    But just because it was being shouted from a high-rise at midnight by teenagers
    didn’t mean that it was entirely debased – or that it was even used at all by
    people like Rebecca.


    ‘By the way,’ I asked, ‘what is her Chinese name?’

    Luan Feng. You know what it means?’

    Phoenix.’


    It was a traditional name with a strong whiff of nobility. Li Bai himself used
    it, since for him the phoenix itself was a time-honoured symbol of integrity just
    as it had been for Zhuangzi and the early Taoists. He admired the bird’s freedom-unrestricted
    movement. A few images came back to me, the phoenix of Li Bai dwelling near the
    edge of a waterfall at dawn.


    ‘As for me, I am *Ah di le an*, as your people call me, and that means nothing
    to anyone. It doesn’t even sound like Adri-an. And you are? I never found out.’


    ‘I’m not telling you, I’m superstitious about it. But *Ah di le an* suits you
    quite well. I’m not sure if Phoenix really suits Rebecca.’ So, I thought for a
    moment, the association with our shared poet had not even occurred to him. It
    was surprising since the bird was a symbol of liberation. ‘Besides, having an
    English name is useful times. It’s an alter ego. You can slip into it or hide
    behind it.’'
