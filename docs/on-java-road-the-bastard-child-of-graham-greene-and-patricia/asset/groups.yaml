    in the heat in a pale-grey swimsuit with a small backpack hoisted onto her back.
    She must have changed at the radio transmitter and then descended, ready for a
    short swim. I saw her first and for a few moments I kept it to myself so that
    I could take her in; I was sure that she had not seen me doing so, though of course
    she had spotted the motor launch at once. I later found out that it was illegal
    to anchor there, so either Jimmy had found a way to get around the rules as he
    usually did or he had simply taken his chances of being detected, prepared as
    he probably was to claim ignorance of the law while administering a hefty bribe
    on the spot. But as it happened, no one had noticed us; Rebecca had come down
    quickly to the rocks and raised a hand to greet us. She ventured onto the rough
    little grey beach just as Jimmy snapped to attention with a burst of laughter
    and she waded out until she was up to her waist. From there she kicked off and
    swam towards us, reaching the boat with a few elegant strokes. The ladder was
    up and she climbed onto the deck, decomposed by the salt, and shook her hair.
    She pulled out a towel from her bag and began to dry herself. She looked at the
    boat, then at us, and then at the water.


    ‘The water is freezing,’ she said, her voice carrying over the waves. ‘But it’s
    beautiful.’


    ‘Come in,’ Jimmy said. ‘The water’s fine.’


    She laughed and dove in with a splash. We watched her for a moment, a dark shape
    in the blue, before we followed her. The water was cold, a shock, but it soon
    became refreshing. We swam for a while, talking and laughing, lost in the waves.

