    当我被穿着唐氏制服的司机载往雅华路时，他转对我用粤语说：“整座城都是一个大塞车。”悬挂在道路上方的绿色箭头闪烁着，没有警报声，我猜他是对的，因为广播里也说——堵车一直延伸到城市的远方。当我们停下时，他伸手打开了车内灯，这样如果我想读书就可以读了。吉米随手准备了一些报纸，还有一瓶山崎（Yamazaki）单麦芽威士忌。显然，时报广场附近发生了动荡，交通向各个方向回堵了。


    这是一个让我品味事实的机会：我以前从未被困在吉米的任何一辆轿车里。当我正读着纸质版的《华尔街日报》时，一辆车停在我们旁边，我意识到反方向没有交通流过来。


    我抬起头，看到一对衣着得体的夫妇，他们可能也来自杜德尔餐厅（Duddells）。我只看到女人的后颈，颈上挂着一串珍珠，男人的手搭在上面。她透过窗户向我瞥一眼，带着一丝古怪而愤俗的微笑。那一刻，我感到呼吸困难、闷热，仿佛有一股毒气横扫了拥挤的车流，我问司机是否可以调高空调。但这解决不了每秒都有数千辆汽车向封闭空间内排放废气的问题。十五分钟后，堵车才再次移动。我们回到了室外。直升机穿过夜空，搜照灯向下剧烈射，每隔几秒，光束就会扫过汽车，照亮被困在里面的人脸。我们现在都在舞台上，被灯光定住，被悬浮在高空的一小群观众观察。因此，当我们出现在隧道另一侧时，内心的恐慌仍在继续，我希望那个戴珍珠的女人和抚摸她脖子的男人能在我们面前移动。但要说些什么呢？我满头大汗，脸上的伤口不知为何又流血了。我脑子里只有一件事：逃离，回家洗个热水澡。回到私密和隐形。“真是一团糟，”司机说着，仿佛只是自言自语，并不知道我的他的语言说得有多好。在摩天大楼间缓慢穿行，直达北点，建筑上披挂着如今显得忧郁的路易·威登（Louis
    Vuitton）在发呆，我们可以听到周围峡谷中传来的诵文和击鼓声，看不见却在主宰。我现在唯一感到慰藉的是那些永恒衰败的、追溯到英国时期的旧公寓，它们有垂直排列的空调外机和晾衣绳。需要一场海啸才能推倒它们。当然，是因为我自己就住在其中一栋——嘉兰大厦（Garland
    House），1965年建于雅华路，我已经住在那里久了，以至于那个地方对我来说就像某种古老的洞穴一样永恒。


    司机现在把我留在那里，在我的建筑屹于快乐足疗中心（Joy Foot Spa）和一家廉价时尚店街角。街道安静冷清，不像往常。我建筑那引眼的黄色外墙（不知为何只涂到四层是这种颜色）看起来同样安静地被遗弃，仿佛所有住户都离开了一周，或者正躲在锁好的门吃罐金枪鱼生存。横跨建筑正面的黄色管道和阀门里满了静止的鸟类，它们似乎在足疗店的红色霓虹汉字中找到了慰藉，还有覆盖着睡美人图案的陈旧百叶帘，它们的头部像往常一样枕在伸开的手臂上。二楼那个红光照着小脚的图像一直是我家的标志。于是，我踏着惯常疲惫的脚步，上到五楼，让自己进入了在没有空调四小时后已变成单一热源的狭宫般的房间。由于我多年没抽出精力更换那些单调的墙纸，房间显得阴暗潮湿。


    然而，它们的图案里布满了小鸟和藤蔓，我已经习惯了它们，就像我习惯了在它们陪伴下度过的由常规驱动的孤独一样。我给自己调了一杯加了很多冰的金金汤，并开了电视。我的手似乎并不在抖。


    我像每晚一样，出于一种病态的好奇心听着新闻，一个字也不信。亲北京报纸对当天骚乱的报道像前一天一样无趣，不断地淡化事件的严重性，并最小化它们的意义。这是意料之中的。然而，这场持续的戏法总是引人入胜。半小时后，我回到电脑前获取真实的新。我继续喝着，缓慢且带着某种对自己的体贴，我能听到上方赖太太在楼层间走动的脚步声，她正对着早已去世的丈夫大叫。一只孤独的夏蛾飞进了公寓，在灯罩周围盘旋，但我没有精力去捕捉它。


    现在，我在推特上关注了数十名同行记者，其中许多是带着自己相机的当地人，他们每天走上街头追踪事件到凌晨。他们的用户名色彩斑斓：香港隐士、W.B. 耶律、喷火器。在我带着自己的相机流荡街头的几周里，我从未遇到过一个我认出的公民记者。这就像是一个流动的秘密社，利用手机摄像头首次记录着地面上缓慢发生的革命。我早已意识到，我的运作模式和我所工作的出版物无法提供任何比这些公民记者更好的东西。我们被落下了。像昏睡的大象追逐着早已在其他地方以三倍速度公布的新闻。我们唯一的作用，是为我们认为值得铭刻在纸面上的任何信息赋予一种合法性，即使那只是数字打印。但这已变成某种骗局。我们喜欢其他所有人。但我们绝对确定自己没有撒谎，并鄙视那些我们认为撒谎的人。


    中国共产党至少非常清楚这一点。因此，他们对新闻充满蔑视。我永远无法向他们解释其中的魅力何在。他们从未见过《周五情人》（Girl Friday）。即使他们见过，又怎么能理解其中的意义呢？但对于我们这这一代的恐龙来说，我们中谁不想成为在《晨报》（The
    Morning Post）的敲击声中穿梭的沃尔特·伯恩呢？正如吉米所暗示的那样，曾经伟大的魅力因现在的堕落而变得令人幻灭。例如，当我被迫向吉米的朋友们辩护同样的报刊时，我发现自己的主张听起来模糊且不确定。“拉切尔·麦道和布莱恩·斯特尔特是滑稽的疯子，”他们会说，眨着眼睛看着我，平静地等待我给出某种反驳，而他们当然不知道凯瑞·格兰特是谁。而我该说什么呢？“不，他们不是，共和国一切安好？”事实上，我从远处观察着美国媒体奇异的衰败和堕落。令我震惊的是，尤其是电视记者不再传递任何正直的内容。但纸质记者正坐在权势者的桌下，遵循同样的下行轨迹。

