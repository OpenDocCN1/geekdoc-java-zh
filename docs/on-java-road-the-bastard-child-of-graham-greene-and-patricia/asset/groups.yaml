    华盛顿在捡拾着残渣，捡拾着那些真正操纵局面的情报报机构抛给他们的来自“匿名人士”的泄露。这就是他们现在变现产品的方式。我数不清有多少退休特工坐守在 CNN、MSNBC
    和 NBC 的讲台前，代替记者发言，制定着话语的准则，直到这两群人变得奇诡地无法区分。极少有人对国家安全机器表现出不尊重。没有人流露出一丝真正的勇气。我们与共产主义者的差距已经缩小，而记者在经历了一段浪漫英雄时期后，变了他一直以来的样子：一个写手、一个投机者和一个宣传员。当然，正如我非常清楚的，沃尔特·伯恩曾具备所有这些身份。


    当几十场抗议活动在城范围内同时爆发时，只有自由记者才能同时出现在所有现场，以自己的方式报道不同的场景。这是一种每日的拼贴，那些笨拙的新闻机构无法模仿，而且当人们需要每小时甚至每分钟地了解发生了什么时，这让它们在很大程度上毫无用处。那二十多名记者现在成了浪漫英雄，而他们的精力在我脑海中将我归置到了一个相当边缘的位置。你可以认为这是不可避免的。事实上，这正是我要论证的。但如果是那样，我很快就得找一个新的理由来继续做我正在做的事。正如约翰逊·约翰逊博士曾说的，很多新闻业无非是“在广告背上写字”。


    奇怪的是，这些沉思一点也没有动摇于我。城市的整体氛围有一种种麻醉作用。外面仍然接近华百摄氏度。空气中因仇恨而变得酸臭，远处警报声此起彼伏。在路对岸巨大公寓楼的高墙窗户里，我能看到玻璃后被催泪瓦斯喷过的脸，随着人道空旷，他们试探性地向外窥视。我注意到，记忆中的多年来第一次，那些窗户外的晾衣绳现在空了。它们不像被路过的龙卷风剥去叶子的树枝。声音在高楼之间空旷的峡谷中传得更远，警报声从远处传来，无休止地回响，仿佛刺穿了巨大的真空，而周围电波中震荡着波纹般的电流；群畜被尚未出现的狼的逼近所惊扰，而狼那巨大而异样的气味正随风飘。


    ## 第四章


    “你看起来像好几天没睡了，”三天后我们在阿伯丁的码头相遇时，吉米说道。那是他存放他的两艘游艇中较小一艘的地方，一艘继承自叔叔的 Tecnomar 动力艇，名为“甜甜台风”。是这样吗，同志？”


    “自从上次见到你以后，我一直在不停地睡觉。”


    “听你这么说我放心了。你看起来睡眠不足。而我呢，睡得太多了。”他停顿了一下，“我们路上接上丽贝卡。我的船长已经准备好了。他叫汤姆。嗯，显然那不是他的真名，但我叫他汤姆。家里每个人都叫他汤姆。”


    “去哪儿？”


    我们已经在炎热的阳光下走向登船梯，Tecnomar 雅致的白色船体和穿着全白、戴着锦花帽的中国汤姆站在那里观察着新来者。


    “汤姆！能给这个傻瓜来杯螺丝撞吗？”


    “好的，先生。”


    船长移出光，进入了有胡桃木和黄铜装饰的内部，那里是吧台。


    “你什么意思是，去哪儿？”吉米没看我问道。


    当我们爬上船时，他说这种出游不需要所谓的“去哪儿”，必须留有即兴发挥的空间。


    “我们要去赤灯角接丽贝卡，然后驶向未知。岛屿这么多，时间如此少。我们准备了龙虾和粤语流行音乐。这是一种令人陶醉又略微作呕的混合物。”


    无人岛：这非常他的风格。当我们坐在后部，在遮阳篷下，拿着钓鱼竿时，螺丝撞送到了，冰箱也已经打开了。里面装满了玻璃罐装鱼酱和罐装酸奶油。汤姆在音响上播放了陈国辉，我们离开了海洋，远离陆地的热浪和水泥。我喝了三杯螺丝撞，配着鱼子酱饼干。很快，我们掠过喇蹄岛的绿色边缘，进入一片温和浅浅的海域，那里布满了我们谁都不记得名字的小岛。然而，我知道波士岛，以及对面的大滩头角。我们在音乐的轰响中在它们之间移动，朝着赤灯角和海浪扰动的狂野岩石驶去。它的山坡覆盖着金属色的丛林，沐浴在海雾中，顶部的灯塔在阳光下闪光。在一个名为蚝咀湾的小海湾，我们下锚等待丽贝卡。


    晒着太阳，以适宜的速度喝着酒，低头看着寂静的鱼群中闪烁的斑点鰥，同时将饮料换成了烈性的马天尼鸡。现在是吉米亲自守着吧台，他调制的酒劲大得离谱。他一边调酒一边跳舞，仿佛他的心在别处。这一天海湾避了风，我能听到树上的蝉鸣。那一刻的满足感足以充实我；我不需要去想吉米脑子里在想什么。正如菲茨杰拉曾写过的，“没有比那样的混乱了，”这完美地描述了我。


    当我看向海湾时，太阳是十一点。没有人经过这里，因为整个赤灯角都是属于和德集团的海洋保护区。那里只有一座供科学家的建筑，尽管理论上允许游客进入。在刺眼的阳光下，那里一片荒芜，扭曲的植被纹丝。为了打发时间，吉米扔下熏三文鱼，在他沉浸于这项幼稚的小任务时，他问我是否考虑过离开新闻业转行其他行业。我说如果可以，我可能就会退休。他放弃了鱼，慢慢转过身，让阳光洒在他油光亮的脸上，“我可以带你进入房地产，同志。那里没有灵魂，但相对容易。如果你需要新职业，我仍然可以。我在石澳有一些海景房，可以快速获利。人们正试图出售搬往美国，但我们只需要等几年，市场就会回来。我的岳父有那些工程项目。”

