  - '[PAGE 22]


    when he was fourteen. Therein was the observation, well known to anglers over
    the centuries, about the sadistic use of frogs as bait: ''Use him as though you
    loved him, that is, harm him as little as you may possibly, that he may live the
    longer.''


    You could see why a ruthless billionaire father would give such a book to his
    son, and why Jimmy would carry it around with him as he went to study among England’s
    lazy elite. At the time, however, he simply said that it was the wisest book he
    could imagine for learning how to live, since life really was like fishing. It
    required patience, cunning and an ability to sit still for long periods, paying
    attention to unmoving waters. It encouraged a taste for quiet killing. The Compleat
    Angler’s other advantage was that no one else in Hong Kong had ever read it. It
    was secret knowledge, a manual of guile and persuasion. Latterly, I never mentioned
    that book to him because it felt like a slightly precarious affection on the part
    of Tang father and son. I wondered if he still thumbed through it at critical
    moments.


    When you look back on who you were when you were eighteen, just before the corruption
    sets in, you’re bound to make a small and unconvincing monument out of that shines
    only during restless nights when you cannot sleep. You need to slightly falsify
    your vanished self, to varnish him. But at the same time it’s eighteen-year-old
    self, cast off an old skin, by whom you should be judged whenever you look in
    the mirror. He is the only judge who matters. Do you continue to disappoint him?
    Can there be any other outcome? What would he say to you?'
  - '[PAGE 23]


    When I looked back it was obvious why we had become friends at Clare. Neither
    of us belonged in that environment. The trappings of the English upper classes
    were not ours. Jimmy already had his position in the wider world because, although
    he came from a colony, it was a rich and vital one. It was I who was the peasant.
    A peasant who had learned to turn verbs in Chinese, but a peasant nonetheless.


    I like to think he felt sorry for me; maybe he did. Or else I was the frog with
    a hook in his mouth and he was the one harming me as little as possible. I would
    see him every day at lectures and in Mandarin classes, and, as is the way with
    students, it only took a couple of weeks before we were on nodding and then speaking
    terms. By Christmas of our first year we were going to the Eagle every evening,
    or Waffles on Fitzroy Street, or the Indian next to New Hall, and he had assumed
    over me the senior position – better clothes, better hair, more spending power
    and more literary candle-power. It was the head start that the rich always enjoy.
    Fast out of the blocks, they can be outpaced only later in life, when it’s usually
    too late. I calculate that it gives them a fifteen-year advantage, which is the
    span of time needed to at least draw level with them. By contrast, they often
    burn out early. If you surpass them later in life they will always complain that
    their early advantage was, in reality, a handicap. Jimmy, however, would never
    suffer from disillusion. Although his father already had his future mapped out
    to the last detail, Jimmy told me that he’d declared to the patriarch even before
    he had left for Cambridge that he had decided to become a scholar of Tang poetry
    – and there was nothing vile clan could do to stop him. ‘They’re all psychopaths
    and spendthrifts anyway,’'
  - '[PAGE 24]


    he said to me, as if I were the only person to whom he ever say such things, though
    he later repeated them obses- sively in Hong Kong. ‘I have an uncle who has a
    different car for every day of the week. Colour-coded. My grandfather made his
    money in the gambling dens in the ’40s. They were racketeers from Shanghai, that’s
    all. It’s what I am, too, if you look hard enough.’


    He was fond of reminding me that the first British came- teries in Hong Kong specifically
    excluded the Chinese dead. ‘But you let us in eventually – as corpses.’ His English,
    ac- qu at the Diocesan Boys’ School on Argyle Street in Hong Kong, was faultless
    and almost without accent. He never talked about his years at Millfield school
    later on, and I learned never to ask about them. He was more interested in my
    school, a secondary modern in the English country- side. That was true exoticism
    for him. He was fascinated by the class machinery behind such an establishment.
    When I told him that I had passed much of my teenage years being groomed to be
    a qualified mechanic, he nodded and said, ‘Yes, that might have been better. Now
    you’ll have nothing but a useless Chinese Studies degree. And who among West-
    ern literates reads Chinese poetry these days?’ It was possible that he didn’t
    believe this other hypothetical future. But one look at my disgusting clothes
    – the eyebrow rose – and he understood that there might be some truth to it. Clothes.
    It was why we first began going to London. Clothes were never trivial to him,
    as they were to serious people. When talking about Maoism, for example, he would
    just grimace and say, ‘Yes, yes, I understand, but the clothes, comrade, the clothes.’'
  - '[PAGE 25]


    He got fitted at Dege & Skinner and bought me hats Lock & Co. that were, I thought
    at the time, too old for me but which he gave me the confidence to wear. I was
    the only person in my year to own a panama hat who had the gall to actually wear.
    I found that I didn''t know my own capital city at all, but Jimmy knew it intimately
    from a thousand Tang family expeditions. I didn''t know anything about anything.
    I had never been to a restaurant there. Never spent a night in a hotel, never
    drunk wine, never taken a black cab, never been to a nightclub or a theatre and
    had never been to any site of note except for the British Museum and Karl Marx’s
    grave in Highgate Cemetery, taken to them by my grandfather: the high-minded pilgrages
    of the working class. It would have been difficult to describe to Jimmy the scene
    with the old man, a retired bus driver from Bevenendance, standing before the
    Zardoz-like head of Marx in the rain. He, eyes filled with tears, arms piled with
    votive flowers; me, shivering and unmoved behind him. Jimmy Tang, scion of a family
    who had fled the Communists in China, would have quipped that at least Jewish
    Marxists got to be buried there.


    For Jimmy, my ‘re-education’ was a Pygmalion game, which he played with an inbuilt
    skill. It kept me in my place, though in a subtle and often unnoticeable way.
    And yet it also let him – perversely – into the English social game to which Millfield
    never opened the doors. But then again, there was Chinese poetry, that cathedral
    in the landscape of words. It was with Jimmy that I learned to recite correctly
    and to sink into its rhythms. The poem about seeing off Meng Haoran at Yellow
    Crane Tower was the first Li Bai taught me to recite, making me similar to a billion
    Chinese school-'
