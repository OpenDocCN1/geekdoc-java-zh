    # EIGHT


    HAD ASKED BAWA TO MEET ME AT FUNG SHING, WITH an air of urgency that would make
    him react the way I wanted before he had time to up the stakes and bargain with
    me. As Napoleon once said, ‘Vitesse, vitesse, vitesse.’ In the event, he was there
    before me dressed exactly as he had been that night at Spring Deer. The satisfying
    thought came to me that on his hack wages he possessed only one suit, which he
    wore on every occasion after ironing it himself under a newspaper. He was ensconced
    at the table I always took myself; the servers must have directed him knowing
    that he was there to meet me. Made cognate by despicable foreignness, *gwailo*
    always hang with *gwailo*.


    I knew youd come round, his smug expression said, and in a way he was right. I
    had not bitten his bait the first time but now he could see I had got hungrier.
    I ordered my usual dim sum and some pu’er tea.


    ‘Is this your local?’ he asked.


    ‘Before you say it, yes, it’s a Communist hangout. I come here for the soupy dumplings,
    not the politics.’


    ‘All the same, they must notice you. If I had your politics I wouldn’t live around
    here.’'
  - '[PAGE 169]


    I said I wasn’t aware of having any politics. ‘But I know what you mean. You know
    I can switch to Mandarin when-ever I feel like it. I speak it better than Cantonese.’


    Bawa, who spoke neither, grimaced at the barb. But it wouldn’t get in the way
    of his winning both a free lunch and some information from me.


    ‘We’re in the same business, Gyle. I know you know things that you keep to yourself.
    So do I, so I think we can trade. I trust you to keep it to yourself.’


    ‘Likewise.’


    ‘We aim to be of service. By the way, you looked rather dashing in those pictures
    in the Apple Datly.’


    ‘So you noticed, then?’


    ‘Well, I am one of the five people in the city who know who you are.’


    The restaurant was in one of its lulls and therefore empty. A perfect place to
    share secrets. He didn’t waste time asking what I needed or wanted. He was often
    fond of quot-ing the Rolling Stones song about needs and wants, to wit, you can’t
    always get what you want, but you can usually get what you need. I think that
    it was his operational motto.


    All right, I thought, let’s jump right into it. I asked him bluntly if he knew
    a girl called Rebecca To. Or even for that matter the To family. He looked up,
    mildly surprised.


    ‘They’re rather for voting rights, aren’t they?’


    ‘I’m not sure they are. But even if they are, they keep it to themselves and they
    certainly don’t approve of violence.’


    ‘What about the daughter? I don’t know her if that’s what you’re asking.’


    ‘But do you know of her?’'
