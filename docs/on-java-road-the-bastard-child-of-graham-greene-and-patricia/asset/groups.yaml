  mdcn: '

    一点一点一点一点，吉米送我回到大堂，我之前见过的那个门卫正对着显示器熟睡睡着。我们并肩站在凉爽的林荫中，等他的司机，同时抽完了那支曾经名贵的雪茄茄烟蒂。吉米穿着他的杜格代尔（Dugdale）西装，只是因为晚上的狂欢而略显褶皱，他看起来就像是波瑞特大厦建造的那个年代的人物。他像一个突然出现在电光时代的幽灵，一个不完全算得上格不时代的产物。正那时，我想起在我们还是学生时代，他总是让我想起“领带男”（Arrow
    Collar Man），那是美国插画师J.C.莱恩德克（J. C. Leyendecker）在2世纪20年代为《周六晚报》创作的头发油亮的男性美学符号。他是Interwoven织袜、Cluett衬衫和著名的Arrow领设计的优雅而理想的模特。这些从远处闪烁着光的“转瞬即逝”，在常识的暗淡光线下并不完全真实，却比照片要真实得多。


    他抽完烟蒂，并没有把它扔进旁边的榕树根部，而是冲回门口，将其按在旁边的沙质烟缸里。


    他的司机带我们结束了告别的握手，那只是欢迎式的。我坐车到了肯尼迪路，然后心不在神地向着湾仔公园深邃的阴影、皇后伊莎白体育馆和多尔塞酒店驶去，这些都是我一天经过的地方。街道上满了小石头，就像火山爆发后的残骸。出于某种原因，我们走上了余华街：其他地方有必须避开的冲突。维多利亚公园周围，闷的人群开始散去走各自自己的路，在一面墙上，我看到新的中文涂鸦，写着：“这辈子只嫁前线。”这是一个绝妙的征兆，说明凤凰永远不会和唐吉米在一起，反正永远都不可能。


    第二天晚上，当我坐在中环一家名为“老头”（The Old Man）的酒吧时，这一切都在我的脑海中闪过。在过去的二十四小时里，我感到越来越焦虑，意识到自己在这座城市里变得越来越难以隐形，因为我作为一个外国人——作为一个欧洲人——的外表已开始产生新的、危险的含义。


    喝完六杯白兰地后来到街上，我看到一个地痞站在士丹森街对面的发财仔街角，他靠在坡度很陡的阿伯律街墙上，他穿着典型的亲北京街头帮派那种白色衬衫和翡母绿缎面短裤。在我等车时，他也看我我。他手里拿着一个空的杰克丹士瓶，似乎不知道该拿它怎么办，就横跨马路朝我和我那件褪色的鲨鱼皮西装扔过来。瓶子撞在路缘石上，细小的玻璃碎片落在我的袖子和裤子的面料上。街角上没人，但你能看出有一群人刚刚经过，人们被打伤了；他自己鼻子在流血。他看起来像是自己喝了整瓶杰克丹士。由于某种原因，瓶颈没有碎，顺着阿伯律路滚远，越滚越快，而那个男人举起拳头，冲我叫我是“gaat
    zaat”（蟑螂）。我没有穿任何通常与抗议者相关的衣服，比如黑色衬衫，我想，这一定是一个醉酒后的无差别概括，随口吐出来的。


    “Gaat zaat”在粤语在那些炎热的夏周里有了特定的语境，但我从未想过它会被用来对我，即使不是那些此前对穿西装的外国人还很害羞的白衫反抗者们。他们恨我们，有时我走过时他们会喊“CIA”，但那是我穿着战斗服时。“CIA”在普通话里听起来几乎很有诗意：zhzhong
    qingbaoju。这是为了索更多血，他来猎捕我，穿过路口朝向啤酒鱼附近的一条小路走来。他踉跄着，眼睛布满血丝，再次叫我蟑螂并向地上吐了口水，而在士丹森街的尽头，我看到我的出租车来救我了。他已经带着某种韵律咆哮着：“Diu
    lao mu——


    在车到达我之前，他挥出一记重拳，击中我的右脸颊，但力道不足以将我击倒。“没没事，”我艰难地说道。

