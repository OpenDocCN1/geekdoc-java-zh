    but instead simmered (as I thought) with resistance to everything around her.
    I looked around for her mother and father, and after a moment had passed I felt
    sure that they had in in fact left the club altogether. If they had, I was alone
    with her.


    I walked down alongside the bar. Past the bulbous backs of the businessmen in
    their black suits, past the foreigners slouched in the green armchairs with ornamental
    lace coverings, until I was level with her left shoulder and she was forced into
    awareness of a stranger at hand. She turned and at first didn’t recognise me,
    or at least I thought she didn’t. She had been reading a small book that I I now
    saw was splayed on the bar in front of her. The interruption might have been unwelcome,
    I couldn’t say. Two seconds separated my ‘Hi’ and her formulaic smile. What a
    coincidence, she said. This was somewhere I came frequently?


    > ‘Only on full moons. Are your parents members?’


    > ‘Since the old days. But Jimmy said you were a member here, too?’


    > ‘I’m here on a platonic date.’


    > ‘Oh?’


    I was quick to describe Strick.


    > ‘Is he waiting for you downstairs?’


    I waved a hand. ‘He knows how to amuse himself.’


    I asked if she was alone and she shrugged, as if to say, What of it? But then:
    ‘No, I was having dinner with my parents.’


    > ‘Mind if I sit here?’


