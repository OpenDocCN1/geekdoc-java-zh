    newsrooms. It was a mood I was long familiar with. The gathering of our guild
    in a single place in search of a story we all wanted, the rivalries mellowed by
    a shared futility. The wisecacking camaraderie getting drier, more cynical as
    we got older. And of course I had known many of them for years. It’s a small city
    in the end. By virtue of Hong Kong’s constricted topography everybody is bound
    to know every-body, and if I went to the FCC the following night the same faces
    would almost certainly be there at the bar. But now un-familiar countences dashed
    through the mob.


    I saw a photographer coming down the steps with his equipment over his shoulder
    and for a moment our eyes met with a mutual recognition that startled me. He passed
