    as she moved between parked trucks but unmistakably her.


    I crossed the street quickly and pushed through the other pedestrians to get a
    better look at her. However, she had melted away. Either she had stepped into
    the condo building or she had crossed the street herself but in the opposite direction.
    I called her name, sharply so that heads turned. There were so small trucks loading
    and unloading that if she had been there she could easily have slipped away without
    her even noticing me. Getting no reply from anyone, I went back to where I had
    been standing originally and, not knowing what to do with, asked some of the workers
    if they had seen someone adhering to her description. I drew nothing but blank
    looks. I ran up to Harbour Plaza and frantically began looking through the columned
    arcade that gave onto King’s Road where the tram lines curve around. I followed
    them just as a tram rolled up, and I was seized by the idea that she might have
    gone to the Healthy Street East stop in order to take the tram. When I got there
    the tram had stopped and people were getting on and off. For a moment I saw her
    again, getting into the car, and I was fast enough to catch the tram before it
    moved off towards North Point.


