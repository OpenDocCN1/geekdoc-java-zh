    sible that this person had written it, too. It could be someone who knew what
    had happened and who wanted me to get it out to the wider world, sending the email
    as a prompt. There was an implicit permission for me to use this narrative and
    publish it as insider information, not unlike the techniques of underground propaganda
    in wartime occupations. The back-bone of the piece I was considering had formed
    itself instantly: I could send it on and have published it without embellishing
    at all. It would be fictional in the eyes of readers, but it would also be read
    as factual -- it would be my version of ‘The Melon of Huangtai’. This, in the
    end, what I proposed to Strickland. I sent him the email in its entirety, asking
    him what he thought of it, and he responded by pointing out something quite obvious:
    that a shadowy unnamed male lover depicted in the email as being complicit in
    the girl''s death was possibly, even probably, Jimmy Tang. If he had jumped to
    that conclusion, so everyone else.


    To this I replied that I could write a piece that would imply an unnatural death
    in which Jimmy had been complicit, just as the email suggested, though obviously
    I could not know how or why and I would leave it to the reader to make that connection.
    It wouldn’t exactly be what Strickland had been expecting. But it would be a political
    statement. I would be explicitly ratting an old friend with an accusation that
    all was hearsay and suspicion -- precisely the mode of thought that the new order
    made dominant. There would be no evidence behind it because we no longer lived
    in a world of evidence. It would be *samizdat* -- underground resistance literature
    from Soviet times -- a word meaning ‘self-published’.'
