    螺旋式的大理石楼梯直通向俱乐部的大堂。空气中弥漫着维多利亚时代的尘埃，墙上的油画已染上一层夜色般的苍白，与一楼格莱斯顿及其同僚的彩色玻璃头像像交相辉映。那是那个已消逝文明的图腾。楼梯如此陡峭，很难看清下方的上升或下降情况，但当我俯身在光滑的扶手上时，我看到一个穿着千鸟格纹西装的男人正步履踉跄，进行着一场仓促的撤退。我确定他是从餐厅溜出去的，我跟在他后面走下去，准备在那片葬礼般的寂静中呼唤吉米（Jimmy）的名字。一个满脸伤疤、一个被这座城市所伤的残疾人。但在下层地板，他并没有等我。直到在挤满成员的一楼大厅附近，他才停了片刻，动了恻心，用他好的一只脚转身面对我。他的脸老了，失去了以前那份欢快的臀部姿态。然而，那种漫不经心的道德缺失依然留存在眼神中，因为他知道在最后一刻我并不会胆量去追他。这样更好。相反，他笑了，用右手两指抵住右太阳穴行了一个军礼，仿佛在说：“讲得好，同志。”
    随后，他消失了，穿过人群走入白白厅街（Whitehall）的暮色中，那里钟声敲响，当然不是为他而响。


    penguin.co.uk/vintage


    # “氛围感极佳……他最令人痴迷的作品”

    《周日泰报》


    在香港做了二十年外派记者后，艾德里安·盖尔（Adrian Gyle）几乎一无所获。但现在，街道上满了要求民主自由的学生，旧世界正开始崩塌。


    艾德里安的老友吉米·唐（Jimmy Tang）是一个香港富豪家族的后，他与领先的民主抗议活动人士瑞贝卡（Rebecca）开始了一段鲁莽的情缘。但当瑞贝卡消失、吉米隐匿时，艾德里安挖掘出了内心那股熟悉的调查冲动。追着瑞贝卡的幽灵来到爪哇路（Java
    Road）——那是城市死者聚集之地——艾德里安重构了她的最后几个小时，同时他也在幻觉与现实之间痛苦挣扎。


    > “一幅关于特定地点与时间的氛围感肖像，也是关于一段友谊的创造与毁灭。极力推荐”

    《卫卫报》


    > “感官的、挑衅的且引人入胜”

    《华盛顿邮报》


    > “大师级的笔触……这个关于道德沦败和极权主义过度的故事既令人不安，又不可抗拒”

    《独立报》


