  - '[PAGE 151]


    the suit. While I was being measured in the mirror room, which lies behind the
    main sales room, he called ahead to Mott 32 in the Standard Chartered Bank Building
    and procured a lunch table for us. I came out into the room and we chose Bemberg
    linings and horn buttons for our coats and mulled the question of monograms and
    cigar pockets. The mood between us was relaxed. His body language did not seem
    in any way abnormal. We discussed the barchetta-pocket issue, patch pockets or
    flapped, lapel depth and angle, notched or peak, single- or double-breasted, pleats
    or not, cuffs or not, high or medium rise in the trousers, adjusts over belts
    and the break of the trousers. It took half an hour and Jimmy drew it out as long
    as he could. He had not noticed, he said quietly to me when the others were busy
    elsewhere, that Chan had turned in recent years to a softer, more Neapolitan cut
    and away from the former house style rooted in British norms. They were doing
    fewer roped shoulders and more spalla camicia sleeveheads with a delicate puckering
    and a less-structured silhouette. It was what younger men wanted and so it had
    become what some older men wanted as well. He prattled about it with his casual
    expertise: how much he loved Caccioppoli fabrics from Naples with their summery
    patterns and subtle colours, how much he loved the mohairs from Standeven, especially
    their monochrome puppytooth and their formal Blackstorm range, and how recently
    he had been converted by the wise men of W. W. Chan to the glories of tweed and
    W. W. Bill linen.


    ‘A tobacco suit is all the rage,’ he said as we were reaching the lifts again
    and the staff from Chan had held open the'
  - '[PAGE 152]


    doors for us. ‘I should have got you a Bill tobacco number. Very useful in our
    unsortarial climate. Next time. There will be a next time, Adrian – I hope you
    know, don’t you?’


    ‘I’ll never wear these suits, as I’m sure you know.’


    ‘Yes, but they’ll be hanging like ghosts in your wordrobe, filling you with guilt.
    You’ll feel ashamed when you put on your normal junk. And you can wear them to
    my parties.’


    ‘Your wife would notice at once.’


    He made a face, his swinging, entirely unconcerned by anything as far as I could
    tell.


    ‘That she would, comrade. But you’d just tell her you got a windfall from a dead
    uncle. We all have windfall uncles. Even broke bastards like you.’


    ‘You mean she would bawl you out over three thousand dollars?’


    ‘She wouldn’t – she’d get her mother to bawl me out.’


    We stepped onto the street only to find that it had been transformed by the arrival
    of clouds, which had in turn blot-ted out the sun. The whole mood had changed.
    A dash of typhoon rain was coming in on a hot wind. Nevertheless, as we walked
    to Mott 32, our bodies tensed against the rising wind. The great, oddball buildings
    had become sombre and satanic as the edge of the typhoon touched. At the Stan-dard
    Chartered we went up the steep flight of steps hounded by the first drops of rain.
    The long escalator ride down to the restaurant returned us to sheltered security.
    To my surprise the place was bustling. Escapism in times of crisis: restaurants
    do well. The flower arrangements, the splashes of calligraphy on the walls, the
    industrial ceilings, and the dim dark-gold lighting were instantly refreshing.'
  - '[PAGE 153]


    Thankfully I forgot the heavy atmosphere at W. W. Chan,

    getting measured for a suit I didn''t even want. Now instead

    was the hour of dim sum, of lo bak gao and black truffle xiao

    long bao and pu''er tea. The glutton in me leaped to attention.

    This far deep into the earth we wouldn''t hear a thing even if

    the storm hit Standard Chartered directly. It was a bunker

    for those who could pay. Jimmy was feeling talking, too,

    and that helped me forget the previous few hours. I devoured

    the radishes rolled in oily chilli sauce and listened to him

    describe how his father-in-law had given him a stern lecture

    about falling into line with what he called the new regime

    inown: the Communist Party. It was ironic that since the

    protests had begun many members of their sprawling fam-

    ily were buying houses in London and Vancouver, seeking

    out British or American passports and spiriting their capital

    away into empty condos in Bangkok. Your left hand need

    not acknowledge what your right hand is doing behind your

    own back. But all the same, the family had to show a united

    front.


    ‘Tacitus.’


    ‘Yeah, Tacitus – exactly.’ His eyes lit up and he smiled

    with delight. ‘Julius Caesar. So Xi is your Julius Caesar and

    my family are the Gauls who submit. Brilliant.’'
  - '[PAGE 154]


    Pleased with this scholarly memory, he beamed at me with a dumpling suspended
    between his chopsticks, where it disintegrated in slow motion.


    ‘There’s a scramble for the exit,’ he went on, ‘and soon we’re all going to be
    living like rats in California. Like rats. Everyone in California lives like a
    rat. Not everyone. But me – I will certainly be living like a rat over there.
    An escaped rat. A rat of the ancien régime.’


    ‘And Melissa is all right with exile in California?’ I said, not sure how serious
    he was being.


    ‘God no, of course she’s not OK with it. She has no reason to leave. She swears
    she’ll stay here. She doesn’t mind the Chinese system one bit. She admires it.
    It seems we are headed for a bust-up.’


    ‘You could stay, too.’


    ‘Could is not would.’


    ‘All the same, you could.’


    ‘But I’m not going to live under those cretins. On the bended knee and all that.
    Not a chance.’


    On the bended knee with a fat silver spoon rammed down one’s throat: it wasn’t
    the end of the world. More than that, it was in many ways attractive. What will
    people endure simply to obtain a bit of security and stability? Almost anything.
    It depends on what their greatest fears are. But in any case the bended knee was
    hardly a uniquely Chinese phenomenon. Who did not bend the knee in the West? With
    a bit more fuss and noise, but ultimately bending the knee to capitalism in exchange
    for health, safety and a long life. In fact, millions dreamed of having a silver
    spoon rammed down their throat'
  - '[PAGE 155]


    while bending the knee. It was their Utopia! Jimmy got worked up, managing to
    snarl as he talked, like a Punch puppet.


    ‘I don’t have to tell you that my father-in-law, and my father, too, for that
    matter, went all lunatic on me about those pictures in the Apple Daily. And everywhere
    else, they knew exactly how to get at me. It was a blow aimed with real precision,
    I’ll give them that. Can you imagine how Chow had to say to me? It was a ritual
    humiliation. He called me into his office and gave me dressing down for an hour.
    He threw a glass of whisky in my face and I had to stand there and take it. Nothing
    I could do. He called me punk. That was the actual word he used. Coming from a
    punk supreme, that was a bit rich, but I had to take it. How do you think that
    felt?’


    ‘I think you’ll live clever on me, Gyle.’


    ‘Don’t get clever as well. He threatened cutting off the money as well. You know
    how it is. Dishonoured his daughter and all that. Well, he has a point, I suppose.’
    He slumped back in his chair.


    ‘But you have your own money, don’t you?’


    ‘Yes, but not – how can I put it?’ – on the same scale?’


    ‘Thank you. It’s not a small thing to be sniffed at. It’s hundreds of millions.
    I have shares. It’s complicated. In any case, then he calmed down a bit.’


    ‘Did he ask you who took the pictures?’


    ‘Of course he did. But how do I know? He even suggested that it was you – that
    you set it up. Can you imagine?’


    There was a moment of dull astonishment inside my mind'
  - '[PAGE 156]


    that I tried to keep control, yet I was unable to stop my mouth opening. I saw
    at once that it gave Jimmy a quiet pleasure. ‘Don’t worry, I talked him out of
    that one. But he asked me about you and I had to tell him. Even though you’ve
    already met him at my parties, he doesn’t remember anyone who isn’t important.
    I told him adamantly that it had nothing to do with you. That said, I do have
    to ask if you think that anyone you know might have got the idea into his head—even
    if it’s someone you know only slightly—’


    I said it was so ridiculous I wouldn’t even entertain the idea.


    ‘I thought so, too. But he was right about one thing, namely that there is a possibility
    of blackmail, isn’t there?’


    I said, ‘A blackmailer would have shot his bolt by now, I would have thought.
    The pictures are already out there.’


    ‘But he might know more. How do I know what other pictures he might have held
    back? Think about it.’ His voice had lowered. ‘How do we know? We don’t know anything
    about him.’


    ‘Paparazzi.’


    He leaned back a little and a terrible smile got the better of him.


    ‘Spoken like one! But none of us really know. My father-in-law thinks it’s something
    else.’


    ‘Such as?’


    ‘I don’t know. Political associations – I mean, the associations of the girl I’ve
    been with the last few weeks.’


    ‘You’re not an enemy of the state, Jimmy. None of us are.’


    ‘But she is,’ he sighed. ‘She very much is.’’'
