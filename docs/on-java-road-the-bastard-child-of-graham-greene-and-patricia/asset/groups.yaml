    这非常不寻常。这里可没有什么好说的犯罪行为。


    那个白痴な拿着一瓶杰克丹尼在外面等我。也许他刚跟老婆吵了架吧。


    “或者是局势很紧张——对于那些家伙来说，白人就是敌人。”


    也许吧。


    “喝一杯吧，可怜的孩子。”


    “我要一杯支线酒（sling）。我想回去把他揍一顿。”


    “别那样。是三合会在搞我们，而不是我们去搞他们。来，快坐下，让血结痂吧。”


    “我本应该还手手的。”


    “每个人在挨了一拳后都会这么想。但你没动手，是因为你害怕。正如迈克·泰森常说的——”


    “我才没鬼。他朝我扔了一个该死的瓶子。”


    ——在脸被打了一拳之前，每个人都有计划。”


    支线酒送到了，汉宁在礼貌地等待后，向受伤的记者们敬酒，我也向通文（Tong Boon）敬酒，他是新加坡来酒店调酒师，他在第一次世界大战之前发明了支线酒。


    “那真是美好的时光，”我尽力夸张地说道，我的手因为屈辱的愤怒仍在微微颤抖，“而且它们再也不会回来了。干杯（Yam sing）。”我干了整杯酒，把杯子重摔在吧台上。“吧台，再来一杯冰（mgoi
    sai）。”


    “你手松了吗，盖尔（Gyle）？”


    ## 38


    “手松？我凭什么会手松？”


    “你看起来很有钱。表现得很有钱。”


    “不完全是钱，但《乌鸦》终于付了我那篇关于赛道的稿费。都四个月了。反正喝酒也多了一千块钱。我得手松才能跟你混。这感觉就像是跟一个吃钱的垂直风洞做朋友。”


    “好吧，听你这么说。吧台，再来一个，麻烦（mgoi）。”


    我这么说是因为据我观察，这个地方到处都是“蝗虫”——这是我们对那些从世界各地飞报道我们城市动荡的记者和博客主的称呼，他们根本不知道自己在哪里，更不在乎。这也是粤语中对大陆人的称呼。这两个物种都坐在黑暗中，身边带着从哪儿找来的女孩。西方物种穿着俗气得要命记者服：香蕉共和国衬衫和矫形鞋，就像我们自己对过去辉煌的沉迷一样。大陆人则穿着在山姆会员店买的西装。


    “他们在机场就让他们进来了，”汉宁说，“我们对此无能为力。这是竞争，盖尔。”


    “是的，没关系。需要你们的时候，警察国家去哪儿了？这就是我们交税买到的？”


    “他们像伞兵一样降临带走了所有的女孩。”他环顾四周。“这是海盗行为。”


    我把手放在伤口上，感觉到硬化的结痂勒着颧骨上的皮肤。这家哥子瞄得真准，像个专业人士。众周知，三合会从业余拳击手手中招募，就像当局在需要冲击部队来殴打不听话分子时，也会从他们中招募一样。所以，这次胆怯确实战胜了勇气，这也许是真的。然而，金酒渐渐麻醉了我，我三小时前还好的心情又回来了。我之前一直和路透社的希拉·吴（Sheila
    Ng）在一起，一度我觉得我可能和她取得一些进展——但她抓住第一个机会消失得无影无踪，而老头并没有提供替补。我明显变得变老了。光靠魅力和机智已经不够了。尽管如此，这一天并没有完全虚度。我下午大部分时间都在采访一位立法者，他几乎无法控制自己对即将到来的打击行动的渴望。我问汉宁他去哪儿了。


    “我请了一天假去了龙脊（Dragon’s Back）。我一路打车去那里，等到了山顶时想起我太胖了没法登山。你看，缺乏锻炼终于开始影响我的身体了——”


    “你应该练练普拉提（Pilates）。”


    他的眼睛陷入了僵直。

    “噢，哪种？我听说庞提斯（Pontius）的版本最好。”


    “严厉且带有审判性。那是你需要的。”


    只有我在笑。他的口吻像个喜剧演员。庞提斯·普拉提。


    他问我最近在忙什么。


    “没做什么，”我说，“只是努力让自己不沉水。”


    “你呢？”


    “我正在找一个新故事。一个大新闻。”


    “好吧，如果你找到了就告诉我。”


    他起身离开。我独自留那里，陷入了自己的和吧台渐弱的喧嚣中。

    '
