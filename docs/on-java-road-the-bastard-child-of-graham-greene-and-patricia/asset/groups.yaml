    # 劳伦斯·奥斯伯恩


    劳伦斯·奥斯伯恩出生于英国，是多部广受小说的作者，包括《被宽恕者》(The Forgiven)、《小角歌谣》(The Ballad of a Small Player)、《黑暗中的猎手》(Hunters
    in the Dark)、《美丽的动物》(Beautiful Animals)、《唯有睡眠》(Only to Sleep，一部受雷蒙德·钱德勒遗产委员会委托的菲利普·马洛小说)以及《玻璃王国》(The
    Glass Kingdom)。他的非虚构作品涵盖从回忆录、游记到随文，包括《曼谷岁月》(Bangkok Days)、《赤裸的游客》(The Naked Tourist)和《干湿》(The
    Wet and the Dry)。他的短篇《火山》入选《2012年美国最佳短篇集》。


    由拉夫·菲尼克斯、马特·史密斯和杰西卡·查斯汀主演的《被宽恕者》于2022年上映。奥斯伯恩居住在曼谷。


