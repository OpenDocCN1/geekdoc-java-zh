    因此，他们极力维持着表面的体面。吉米从未像他假装的那样自由。在我造访停验室后不久，实际上仅一天后，同一个圈子就发现了吉米起初躲起来的原因。头条新闻通常充满了指控性，我很快看到一条总结了这一切的标题：“社交宠儿‘可怕唐’与美女‘朋友’同乘游艇。出轨了？”吉米和丽贝卡在一起的照片开始随处可见。


    这个故事是由小报《苹果》爆出的，它的所有者是反政府服装业大亨李嘉诚。难道没人记得李嘉之所以给报纸起这个名字吗？据说他曾表示：“如果亚当和夏娃没有吃掉禁忌的苹果，还会邪恶和新闻吗？”在他们的网站上，关于唐森的八闻点燃了整座城市。即使在那些常见的名人丑闻、黑帮故事、赌博新闻、关于轰动自杀的半虚构故事、惨惨的交通事故和金融犯罪中，这个消息也像一颗华丽的彗星，划过这座城市的意识。


    但还有其他东西。我一眼就认出了照片中的背景。那是我们在吉米游艇上共同停靠的岛屿。在某些照片中，我还能看到自己——一个无名的无奇撰稿人，只有少数人会认出或评论，其中一人可能就是吉米的妻子梅丽莎。这意味着在她眼里，我现在被指控为轻微出轨的帮凶，正如她在几周前对我预期的的一样。


    那么，这就是我无法再次跨越门的一个家庭。诚然，这令人失望，但同时也为吉米的失踪提供了一个简单的解释。他陷入了一场失德之中，仅此而已。一段时间内，这种认知让我冷静下来。这只是一场外情的风波。他很尴尬，仅此如此。我想丽贝卡也是。两个不满的家庭。并不是世界末日，他们圈子里的人会窃笑一两周然后忘记。这种事情屡见不鲜。


    我让吉米和丽贝卡按照他们的意愿消失，回到自己的生活中，随着日子一天一天，我的生活变得更加无根无。仿佛我的雇主很乐意让我闲置，无论他当面说了什么。一周过去了，正如我预料的那样，丑闻稍微淡化了，被其他的所掩盖。毕竟，丑闻在座城市城市是廉价廉值的；它们源源不断。最近的一个事件会瞬间抹掉前一个。然而，吉米的暂时耻辱并没有完全消失。人们议论着，仿佛他们的舌头有自己的生命。我有时在记者酒吧、在深夜撰稿人聚集的FCC、在“老地方”（尽管我对比那里感到焦虑，但我还是回了那里）听到周围有人关于此事的私语。“可怕的唐”和他的情妇。可奇的是，还没有人问过我为什么那天会出现在游艇上。起初，我假设他们即使知道是我，也不想当我的面说什么，但同样可能是我根本没有得罪过任何人，因为我在那张暧骨照片中的存在并不容易察觉。别人机器里的一个幽灵。他们看到了我，但我并没有被记录为一个值得调查其身份的人。在某种程度上，这让我脱了身。然而，吉米从未回过电话。他躲起来了，甚至对他来说，我现在也不存在了。在他的脑海里，我已经滑入了另一个维度。


    # 七


    **你必须佩服一座城市，其最富有的人**被称为嘉诚。当我一听到他的名字，就想起在最近抗议活动开始时，他曾发表公开声明，引用了唐代作家李仙的一首诗。“黄台桃，”嘉诚带着极其隐晦的意图写道，“不忍再次被采摘。”


    在微博上引起巨大动动后，这份声明在中国被禁止，因为它被理解为：一个受到过攻击的东西，如果再次受到攻击，就会失去所有的价值。这指的是香港本身吗？嘉诚的发言人回答说，他引用的是《法华》，一种共产党并不完全适应的教义。《法华》是一系列略带幻想色彩的戏剧和类比，被中日许多人认为是佛陀教义最后且最重要的启示。一个名为“妙音”的菩萨从遥远的星球访问，镶满宝石的佛塔在空中像飞船一样漂浮，而佛祖本人在数千年里拯救了数十亿灵魂。当然，我知道李仙的那首诗。他这位皇太子在684年被他的母亲武天后迫自杀。在自杀之前，他写下了《黄台桃》，作为对国家迫害的控诉：


    -    黄台下长桃，

    -   沉沉挂枝，许多已熟，

    -   采摘一个，余者尚无妨

    -   采摘两个，藤上剩下的更少……

    -   若有任何收割

    -   你终将只剩空藤。


    很容易想象李嘉诚和吉米坐在他的阳台上，一边抽雪茄，一边一起引用这首诗。他们真的认识彼此吗？无论如何，在那些指控性照片（很快从《苹果》传开）发表后的几天几周里，我这样看待嘉诚和那些桃子。


