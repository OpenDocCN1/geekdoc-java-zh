    angler was a master of feints and manoeuvres. Through the grapevine I heard that
    he was still throwing his weekend parties at Borret Mansions and that the journalists
    who had once attended them had gradually been weeded out. This included myself,
    though I was in fact grateful for the exclusion. It was Cunningham who told me.
    But why, I asked myself, did I have to hear it from him? I could just as easily
    go to Borret Mansions myself and force the issue. Rather than call in advance
    and be turned away politely, I drove up there one night in a taxi and asked the
    driver to wait for me in the driveway outside the same doors where Jimmy and I
    had stood with our cigars just a few weeks before.


    The old concierge was still there, but with a blanket thrown over his shoulders.
    I recognised me so felt no need to call up to the Tang apartment, therefore I
    went up unannounced. It was a dangerous move, but I could always say that I was
    passing by and had wanted to see them. Nevertheless I hovered outside the walnut
    door and strained to hear anything from inside. It was quiet. I stepped to one
    side so that that anyone peering through the viewer would not see me, and rang
    the bell.


