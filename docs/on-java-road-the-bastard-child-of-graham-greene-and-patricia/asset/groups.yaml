    # SIX


    WHEN I GOT BACK TO NORTH POINT THE STAIRWELL at the Garland was filled with an
    aroma of steaming sea bass and chives, and the walls were clammy as if they had
    turned into something organic and begun to sweat. From inside the units came bursts
    of martial music mixed with Mandarin variety TV shows. It was as if they had all
    turned up the volume of their sets to block out the exterior world. As I fumbled
    for my keys I sensed an eye tracking me from inside one of those doors. The gwailo,
    the white ghost, as they called me, was home and he had not been home all evening.
    Instinctively I locked the door from within with both security chains, which I
    never normally did, and took a bath with the help of a bottle of rum.


    Even in my bath, however, I could still hear the demented TV sets. Something had
    set them off, in the way that crows or dogs are set off. The tenants were stirred.
    I found to my surprise that it was the first time I had ever noticed. I didn''t
    know them and obviously they didn''t know me. We all knew that we might be spied
    on tenants hired by the security services. The walls were little more than paper;
    any ear pressed to them would be as effective as a bug. After all, I'
  - '[PAGE 123]


    myself could hear the strains of the TV series Wo de shi nian in the room next
    to mine, and I had no idea who was in that unit. I was half sure that I had seen
    an old lady standing- by its door one day with her keys. But it had been long
    ago. Yes, it was certainly Forty Years We Walked. I had watched it after once
    on a flight to Xi’an. It made me smile to hear it through a wall now. But at the
    same time it did not feel as coincidental as it should have felt. It felt as if
    it were directed at me specifically.


    Still in the bath, I called my jilted editor at his hotel and apologised for my
    disappearance. A sudden attack of nausea, I explained, coupled with an inexplicable
    weakness in the legs – all the recent stress had been getting to me.


    “You’re full of shit,’ Strick said. I saw you with a girl. But we’ll let it go
    this time. I was just about to call you, actually: I need you to go to the hospital
    where they’re holding the kid who was shot tonight.”


    I’d heard nothing about a kid being shot, but then I had heard nothing anything
    since the afternoon.


    “You know which one?” Strick asked.


    “I’ll get on it right now, maestro.”


    “Good lad. And try and get him to be distraught on camera.”


    “What?”


    “Distraught, Adrian, distraught. I don’t mean make him distraught. I mean can
    catch it for the world to see.”


    I looked up the incident on Twitter and found the hospital in Mong Kok. A sixteen-year-old
    had been shot by a Raptor on a main street in view of dozens of journalists only
    four hours earlier. The story was already out. But I was not being'
  - '[PAGE 124]


    dispatched to the hospital in order to obtain a scoop. I was going there to provide
    a segment of emotion for our readers. Drowsy from the rum and the hot bath, I
    decided to wait until the following evening, however much the delay would annoy
    Strick. Still, I made my own hours.


    The next night, I walked over Fung Shing first and burned through a plate of steamed
    bean-curd rolls. The place was crowded with now-boisterous – perhaps emboldened
    – men with fresh haircuts, and I got a few stares as if they had mentally formed
    a mob, though I was too starved to care much. In any case, from there I taxied
    across Kwong Wah Hospital in Mong Kok, that replica of a Knights Hospitaller fortress
    that rises up on Dundas Street. There was a crowd in the foyer and out on the
    street so I had to flash my press card several times to get inside. The injured
    boy was in a private room and visitors were almost completely excluded. It had
    been an unusual incident, since weapons were not readily used on either side.
    I gathered that a cop had lost his temper during a brawl and let off three shots
    at his antagonists, of which one was this boy. It wouldn''t make headlines but
    all the same few policemen without their gear were there to gently push us back
    and, I assume, quiet us down. They seemed to have been ordered to calm the situation
    down rather than the reverse. Hong Kong was a city where shootings were largely
    confined to the underworld realm of gangsters. Now it was happening to students.


    On the steps outside, in the sordid melee of the frustrated press, I ran into
    Cunningham, who was there for an Australian channel. He was dressed in a seersucker
    jacket that had wilted around him. He pulled me aside from the fray and told'
  - '[PAGE 125]


    me that the kid wasn’t going to die but that his family had put out a statement
    that they were going to sue the cops. It wouldn’t go anywhere, of course. Suing
    the police had become an improbable venture under the new dispensation.


    ‘Did Strick send you down here?’


    ‘There’s not much of a story for you now, old boy. You’re too late.’ He gave me
