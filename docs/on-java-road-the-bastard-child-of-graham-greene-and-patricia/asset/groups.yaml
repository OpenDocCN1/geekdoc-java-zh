    Strangely, these meditations didn’t unnerve me at all. The overall mood of the
    city had an anaesthetising effect. Outside it was still almost a hundred degrees.
    The air sour with hatred, the scream of far-off sirens multiplying. In the great
    walls of tenement windows on the far side of the road I could see faces maced
    behind the glass peering out tentatively as the pavements emptied. I noticed that,
    for the first time in the many years that I could remember, the clothes lines
    stung outside those windows were now bare. They were not unlike trees whose branches
    have been stripped of leaves by a passing tornado. Voices carried farther in the
    unoccupied canyons between the high buildings, sirens could be heard from great
    distances, echoing endlessly, as if stabbing through a tremendous vacuum, and
    all around there was a rippling electricity in the airwaves; the herd spooked
    by the approach of wolves who have not yet been seen but whose tremendous and
    alien scent is on the wind.


    ## FOUR


    ‘YOU LOOK AS IF YOU HAVEN’T SLEPT IN DAYS,’ JIMMY said when we met three days
    later at the marina in Aberdeen. It was where he kept the smaller of his two yachts,
    a Tecnomar motor launch inherited from his uncle called Sweet Typhoon. ‘Is that
    the case, comrade?’


    ‘I’ve been sleeping non-stop since I last saw you.’


    ‘I’m relieved to hear it. You look like you don’t get enough sleep. I, on the
    other hand, get too much.’ He paused. ‘We’ll pick Rebecca up on the way. My skipper
    is ready. His name is Tom. Well, it’s not his actual name obviously but I call
    him Tom. Everyone in the family calls him Tom.’


    ‘On the way where?’


    We were already walking in hot sunshine towards the gangplank, the elegant white
    hull of the Tecnomar and the Chinese Tom all in whites with a brocade cap, standing
    there watching the newcomer.


    ‘Tom! Can we get this fool a screwdriver?’


    ‘Yes, sir.’


    The skipper moved out of the light and into the interior of walnut and brass where
    the bar was kept.


    ''What do you mean, where?'' Jimmy said without looking at me.


    As we climbed aboard he said that there didn’t have to be a where on an outing
    like this, there had to be room for improvisation.


    ''We’re going to pick up Rebecca on Cape D’Aguilar and then head out into the
    unknown. So many islands, so little time. We have lobster and Cantopop. It’s a
    heady and slightly nauseating mixture.


    Uninhabited islands: it was very much his style. The screwdrivers came when we
    were seated at the back with the fishing rods, shaded by an awning, and the iceboxes
    had been opened. They were filled with glass jars of black caviar and pots of
    crème fraîche. Tom put Wong Ka Kui on the sound system and we went out to sea
    away from the terrestrial heat and cement. I got through three screwrivers and
    crackers with caviar. Soon we were skimming past the green fringes of Llama and
    into a mild and pale sea populated with little islands whose names neither of
    us could remember. I knew Beaufort Island, however, and the Tai Tam Tau headland
    opposite it. We moved between them with the music blaring, turning towards Cape
    D’Aguilar and wild rocks agitated with surf. Its hillsides were carpeted with
    metallic jungle and bathed in sea mist, with the lighthouse at its summit lit
    by the sun. At a small bay called Hok Tsui Wan we threw anchor and waited for
    Rebecca.


    Sunbathing, drinking at a good pace, we looked down at pearl-spot chromis glittering
    in silent gangs while changing our drinks to hard martinis. It was Jimmy himself
    who now manned the bar, and he made his drinks recklessly strong. He danced as
    he mixed, moving from one espadrille to the other, as if his mind were elsewhere
    in place and time. The cove sheltered from the wind that day and I could hear
    the cicadas rasping in the trees above us. It was enough at that moment to fill
    me with contentment; I didn''t need to wonder what was inside Jimmy''s mind. My
    own mind was confused enough. ‘There is no confusion like that,’ as Fitzgerald
    once wrote, and that seemed to describe me perfectly.


    The sun was at eleven''clock as I looked out the bay. No one passed here because
    the entire Aguilar headland was a marine reserve owned by the Swire Group. There
    was a building for scientists and nothing else, though visitors were in theory
    allowed. It was bare under a blinding sun and its twisted vegetation did not move.
    To amuse himself, Jimmy threw down scraps of cured salmon to make, and while he
    was absorbed in this boyish task he asked me if I ever thought about retiring
    from journalism and taking another profession. I said I would probably retire
    the following day if I could. He gave up on the fish, turned slowly on his back
    and let the sun strike his oiled face, ‘I could have got you into the real estate
    business, comrade. It’s soulless but relatively easy. I still could if you need
    a new career. I have some beach houses in Shek O we could turn for a quick profit.
    People are trying to sell and move to the US but all we have to do is wait a couple
    of years and the market will return. My father-in-law has the constructions.’


    ‘Perhaps. It’s tempting, even if I’m resigned to scribbling the rest of my days
    away.’


    ‘Are you? I d say it was a shame, if you asked me. There’s a million things you
    can do with your life other than that bullshit career.’


    I grimaced. ‘I’m well aware.’


    ‘But you don’t dare to try something else. You’re smarter than that, Adrian. You
    always had an A-one mind. Frankly, I was surprised you went into the media. It’s
    a circus of minor talents.’


    ‘I had my reasons.’


    ‘Once, of course. But who am I to talk? I’m even more of a fuck-up than you are.
    And of more of a prisoner.’


    But his tone was level, studiously carefree, as if it didn’t matter that much
    to him now. Yet he still felt the need to talk about it.


    ‘I doubt it,’ I assured him. ‘In some ways neither of us is a prisoner. We’ve
    done quite well for ourselves. We didn’t become translators, at least..’

