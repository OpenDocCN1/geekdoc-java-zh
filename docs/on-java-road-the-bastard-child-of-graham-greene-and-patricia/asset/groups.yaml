  - '[PAGE 97]


    no idea how to perform the necessary operation. But since the showing of the body
    would only be for two weeks he thought that it might be possible.


    In a panic, nevertheless, he retreated to the medical libraries in search of some
    guidance. If he failed to perform the operation successfully he would probably
    be shot. Finally stumbled upon a formaldehyde procedure that he thought might
    work. It involved massive injections of the chemical into the Chairman’s body,
    which they proceeded to perform. The cadaver immediately bloated to up to an enormous
    size and the doctors were faced with a new dilemma. How could they make the body
    presentable to the public? Just at that nerve-racking moment the Politburo summoned
    Dr Li a second time and told him that they had changed their minds. They didn’t
    need Mao’s body to be preserved for two weeks. No, they needed it preserved for
    all time. He was to proceed accordingly.


    In the end a medical team was dispatched to Hanoi to study the mummy of Ho Chi
    Minh’s nose had fallen off and been replaced privately with a wax one. It was
    useful information. The same fate had befallen the mummies of Lenin and Stalin.
    Dr Li returned anxiously to Beijing and set about making Mao materially indestructible.
    Dr Li, that cultured and gentle man educated in the West, succeeded to the satisfaction
    of the Politburo and to the satisfaction of the millions of tourists who file
    past the crystal coffin between eight in the morning and midnight every day.


    ‘But why,’ Jimmy went on, ‘do socialists have this obses-'
  - '[PAGE 98]


    sion with mummifying their leaders? I can understand the Egyptians or the Incas.
    But Communists? It’s disappearance anxiety. They destroy the past and its culture
    and yet they can’t bring themselves to destroy their own cadavers. I can’t understand
    it.


    ‘Yes, you can,’ Rebecca said. ‘It’s a result of hierarchy. These are societies
    with emperors – it’s all they know. Not having an emperor is what is traumatic
    to them. Mao is just a Napoleon. Similar height as that.’ She smiled into the
    sun.


    ‘Everyone has emperors,’ I said. ‘From time to time anywhere. I wonder if they’ll
    mummify one of ours.’


    ‘If you think you have emperors... .’ Jimmy sighed, pulling a mocking face. ‘You
    people – you have no idea. Our emperors are actual emperors. When you write a
    tweet that they don’t like, you disappear.’


    ‘And you stay disappeared,’ Rebecca added grimly.


    At about three the waves became choppy, signalling in some meteorological way
    that our day was perhaps drawing to a close and that we should think about returning
    to the main island. The day was still clear, however. The delicate skies of the
    early hours had not tarnished. Jimmy was in no hurry either. We hauled anchor
    and motored across the open waters towards Shek O, thinking to cast down there
    and maybe go and eat in one of the beach restaurants. That secluded village was
    a place where many of the Hong Kong rich liked to hide out for a few days and
    nights when they were tired of the metropolis, and that included me.


    Between forested capes there lay a small beach with a semi-commercialised village
    behind it. Its alleys were'
  - '[PAGE 99]


    crowded with designer toy houses and old temples. There was a sloping headland
    immaculate with bare patches of granite while offshore dozed the pale shapes of
    islands.


    Moored in the shallows I saw that the curious lifeguard towers on the beach were
    unoccupied. The lights of a restaurant called the Cococabang flickered into life.
    Whatever crowds had been there during the day melted away and there was only a
    single man sitting on the sand playing a guitar. On a lone pole a digital clock
    displayed the time for nobody.


    The plan was for Tom to drive the launch back to Aberdeen by himself while we
    swam ashore and then dried off in the dusky sun. The water came only to our chests
    in the event.


    We sat on the sand for a while watching the sun and the launch turning as its
    motors revved. At this farthest outpost the city seemed to come to a standstill
    within an amphitheatre of subtropical hills. A coolness sweeping down from the
    Dragon’s Back mountain pass seemed to remind us of hunger. We dried in minutes
    and walked up to Cococabana. It was a modern cement affair with bossa nova playing
    through the speakers. There were a few upper-class bohemian customers from the
    village sitting at the outside tables. We sat there as well, shadowed partially
    by a tree wondrous taller than the restaurant, and the unspoken understandings
    among us slipped and slid until they finally became something new, an emotion
    triangular, three-sided, with myself as the shortest side and, otherwise put,
    Jimmy and Rebecca as the main stars on their little stage and myself as the audience.'
  - '[PAGE 100]


    WE HAD OUR APEROL SPRITZES while black kites circled the headland and then gradually
    faded from sight. Raw sea bream and marinated tuna on the plates, the candles
    guttering. Jimmy complained about the wine: ‘A French restaurant with the lowest
    alcohol taxes in the world and they can’t even—’ But I found I in the middle of
    the brightest day of the decade, asking Rebecca questions that were, precisely
    because of their banality, a pleasure to ask.


    I’ll go to grad school somewhere,’ she told me when I asked if she was thinking
    of pursuing an academic career. ‘Maybe the States, like everyone else. Do people
    here go anywhere else?’ said I didn’t know. It was an escape from Hong Kong in
    any case. I watched her carve out an oyster with a little fork and I thought how
    remarkably adaptable she was, relative to the man next to her. His minds came
    and went so fast that it was largely impossible to keep pace with them. She had
    evidently learned not to even try to keep up with his ever-changing states of
    mind. The cutting bitterness that sometimes surfaced in his speech was so alien
    to her that it ran off without effect. Could she even feel it, or know what it
    was? It was a coldness of the past, a disappointment in himself, of course. We
    were a curious generation. Lucky in so many ways because born into the prosperity
    of the 1960s but not spoiled as the generations that had come after us; soft but
    not as soft as our successors. Our grandfathers found us ridiculous. But beyond
    all this, it was Jimmy’s doubtless inherited class that made him both sensitive'
  - '[PAGE 101]


    callous. Even as he teased her he was solicitous around her. You could tell that
    he respected her: when she spoke she listened carefully, limiting his own words.
    She was talking about her future career in the States. At one point Jimmy pointed
    out, ‘She’s a wunderkind. But she won’t boast about it because wunderkinds don’t
    need to.’


    ‘I’m not a wunderkind. I don’t even know what that is.’


    ‘It’s a child who is kind and full of wonder. That’s you. Adrian, I want to dance
    down there in the sand with the wunderkind. Would you be so kind as to hold the
    fort?’


    Although it felt like mere minutes, an hour later I found myself looking down
    at Jimmy and Rebecca dancing barefoot in the sand. It was a ragged waltz set to
    the same bossa nova, and the other couples watched them with an envy tinged by
    their own regrets. I could tell that it was not the first time they had danced
    together. It might have been the hundredth time for all I knew. They danced like
    lovers attuned to each other’s body. The wind whipped the loose sand around them
    and inspired by Aperol they moved back and forth, talking so quietly that I couldn’t
    hear the words. It was like a movement that would never end of its own accord,
    something that would have to be stopped from the outside, bringing them back to
    earth.'
  - '[PAGE 102]


    # FIVE


    EVERY AFTERNOON THEREAFTER, FEELING SHAMED BY Rebecca’s resolution, I ventured
    out with both a yellow helmet and an anti-gas mask which I hung from the back
    of my electric bike. Being cautious by nature I covered myself with press tags,
    though these talismans only served, in the end, to attract abuse and aggression
    from a constabulary bristling with stun grenades and body armour. But for the
    moment, in the dog days of fetid summer, I still held on the illusion that they
    would protect me in the way of talismans or Thai Buddhist sak yant tattoos. No
    rubber bullet would sail my way; no lachrymatory would be directed at me personally.
    I could move like a sacred person among the flayed and the flayers.


    Initially at least, I thought that my tags gave me invisibility and I moved accordingly,
    with completely unearned confidence, through makeshift barricades and fires set
    by Molotov cocktails thrown outside police stations. It was a period of sacred
    madness. But soon it would come to an end. The order must have come from high
    up to give the scribblers a bit of rough stuff. Still, that the streets still
