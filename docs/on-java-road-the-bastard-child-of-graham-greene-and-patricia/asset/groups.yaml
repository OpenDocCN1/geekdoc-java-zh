    boy from a small town no one has ever heard of. But being at university together
    had made us equals. Now, more or less a quarter of a century later, we'
  - '[PAGE 21]


    were friends again in the very different environment of Hong Kong, and the gap,
    of course, had reappeared. He was a millionaire socialite, I was a struggling
    – and one could fairly say declining – reporter. Even when we were undergraduates
    I had sensed that he was someone who might slip between your fingers and disappear,
    even though he had always appeared so radiantly solid, so armed with life’s gifts.
    Even then, among only a handful of people studying Chinese in medieval university,
    we had shared some kind of mental territory that was invisible to other people.
    Tenuously, we still did.


    I recall a morning in October when we had just started our first term: I caught
    sight of him crossing the college court. Only eighteen, a little younger than
    myself, he was walking in cricket whites with a Chinese girl towards the river,
    his shoulders draped in a cable sweater, leaving behind him strange trail of water
    drops on the paving. They looked as if they were drenched from head to foot, as
    if they had been for a swim in the very river they were now walking towards. Alone
    in a little cell, I was the friendless provincial state-school boy studying Chinese
    because it was exquisitely unfashionable but, to at least, also a seductively
    unattainable-subject. And it wouldn’t be an exaggeration to say that this couple
    trailing drops and holding hands in the shadows of the Clare court were unlike
    anyone else that I had ever encountered.


