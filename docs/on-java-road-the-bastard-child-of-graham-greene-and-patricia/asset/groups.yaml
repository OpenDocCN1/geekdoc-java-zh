    have been. She was self-conscious, I thought, but the same was as true of myself.
    I told her that we''d be with Jimmy again within a week and until then maybe it
    would be a good idea if she stayed up there on the Peak among the Livstonas and
    out of trouble.


    I could say the same to you, Adrian. You should go back to restaurant reviews.’


    ‘I was a terrible food critic.’


    ‘Thank God for that. Now that you mention it, staying up here is not such a bad
    idea, after all. Don’t you love the smell up here?


    ‘Jungle,’ I breathed.


    ‘How could one live in a place without jungle?’


    It would be like being dead, I thought.

    And it was then that I noticed something jarring. The lamps cast my own shadow
    around me, throwing it up against a wall for a moment and along the pavement.
    One notices such things on a lonely walk. Within a tunnel of shadows, I thought,
    your own becomes more noticeable. But when I glanced down at this moving shadow-show
    set in motion by my walking, I thought for a moment that I did not see her. Even
    when the lamps were almost above us and a sharp shadow flowed out from my feet,
    I saw none emanating from hers. It was as if the light bounced off her in a different
    way or passed right through her with no effect, or else it could easily have been
    the interplay of light and shadow at that hour of the evening. In any case it
    was time for farewells. She turned and buzzed herself in the lamps went off, moving
    into the darkness. A rectangle of lunar light flashed across her back and I wanted
    to say something light and witty yet somehow true that could be tossed after her.
    But the words didn’t come to me. Such moments come out of nowhere, fast as curveballs,
    and usually they aren’t seized. I turned.


    On the way back down from the Peak in the same car, the driver peering at me in
    the mirror as if I had failed some erotic assignment, I thought over how even
    now I had still not even remotely tackled the riddle of Rebecca To something had
    been held out to me – an offer of some kind – but that at the same time it was
    nothing at all, just a passing mood late at night. In reality she had probably
    not even noticed the alterations going on in my mind because they had nothing
    to do with her, strobe-like as they passed through me, and afterwards I was not
    sure whether anything about them was real at all.


    # SIX


    WHEN I GOT BACK TO NORTH POINT THE STAIRWELL at the Garland was filled with an
    aroma of steaming sea bass and chives, and the walls were clammy as if they had
    turned into something organic and begun to sweat. From inside the units came bursts
    of martial music mixed with Mandarin variety TV shows. It was as if they had all
    turned up the volume of their sets to block out the exterior world. As I fumbled
    for my keys I sensed an eye tracking me from inside one of those doors. The gwailo,
    the white ghost, as they called me, was home and he had not been home all evening.
    Instinctively I locked the door from within with both security chains, which I
    never normally did, and took a bath with the help of a bottle of rum.


    Even in my bath, however, I could still hear the demented TV sets. Something had
    set them off, in the way that crows or dogs are set off. The tenants were stirred.
    I found to my surprise that it was the first time I had ever noticed. I didn''t
    know them and obviously they didn''t know me. We all knew that we might be spied
    on tenants hired by the security services. The walls were little more than paper;
    any ear pressed to them would be as effective as a bug. After all, I myself could
    hear the strains of the TV series Wo de shi nian in the room next to mine, and
    I had no idea who was in that unit. I was half sure that I had seen an old lady
    standing by its door one day with her keys. But it had been long ago. Yes, it
    was certainly Forty Years We Walked. I had watched it after once on a flight to
    Xi’an. It made me smile to hear it through a wall now. But at the same time it
    did not feel as coincidental as it should have felt. It felt as if it were directed
    at me specifically.


