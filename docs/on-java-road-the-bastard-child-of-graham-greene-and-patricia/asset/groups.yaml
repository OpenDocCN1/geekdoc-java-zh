    help identify this girl. It won’t be easy but I think you could find out.’


    He leaned forward a little, momentarily agitated by all the facts he wasn’t going
    to tell me just yet.


    ‘They’re going to cover this one. I mean, the Tangs are going to cover it up –
    that I can guarantee.’


    ‘But what about the police?’


    ‘They will want to do the same. It’s always how they deal with society suicides.’


    ‘So you think it’s a society girl?’


    A calm smile had spread across his face and he tapped the table with an emphatic
    little finger, on which he wore a gold ring that gave his whole person an appealing
    vulgarity. I noticed as if for the first time his garish cheap sand-coloured suit
    and light rose shirt with a flashy diamond-motif pattern. I didn''t like him,
    or his taste in clothes. The antagonism among him, Moyers and myself had a whiff
    of old-time colonial resentment. We all came from Commonwealth nations and we
    all had our suspicions about one another. For them, it was the future that would
    offer revenge. They weren''t exactly wumao, regime trolls, but they were far off.
    The dead girl in the Victoria mortuary was just a bargaining chip to get something
    on Jimmy—a scandal he could use in one of his columns, a tip to the secret police,
    a lever he could use to lift off the ground a power greater than himself. It wasn''t
    clear what he wanted. But every hack wants something, always casting his line
    to catch a fish of one kind or another. And it was true that now I wanted to know
    who the girl in the morgue was and why Jimmy had gone down there to identify her.
    I did indeed want to talk to him and find out what had happened. Even though I
    wasn''t entitled to know, I felt that I should try. But it was not that I could,
    or even that I was particularly inclined to. It was just hard to let it go.


    Bawa looked at me, his eyes unreadable. ‘You''ll find out,’ he said quietly. ‘Just
    be careful.’

