    ‘We know her family socially, Jimmy and I. That what was so shocking. An affair
    with her, of all people? My father wanted to have him arrested.’


    ‘What for?’


    Her eyes narrowed. ‘How old is she? Twenty-three or something? What a fool Jimmy
    is. And you for going along with it and then having the gall to show your face
    here.’


    She was speaking her mind but I could see her anger tinged with possible forgiveness
    down the line. She knew I was not as bad as her husband.


    I said, ‘He invited me to go on the yacht for the day. It was after you and I
    had spoken. I didn’t know she would be be


    ‘Didn’t you?’


    ‘He didn’t say anything beforehand.’


    ‘You were never a very good liar, Adrian. You’re one of those men who lie because
    they think it’s honourable, and then do badly. Which is dishonourable.’


    ‘I promise you—’


    ‘Don’t promise anything. I don’t want to hear it. You’re a prick, Adrian. But
    since you’re here, I suppose I have to offer you a drink.’ Her manners were as
    rigid and impeccable as she was.


