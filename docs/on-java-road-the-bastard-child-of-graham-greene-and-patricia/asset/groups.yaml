    # ''Superbly atmospheric...

    his most compulsive yet''

    Sunday Times


    After twenty years as an ex-pat reporter in Hong Kong, Adrian Gyle has almost
    nothing to show for it. But now the streets are choked with students demanding
    democratic freedoms, and the old world is beginning to fall apart.


    Adrian''s old friend Jimmy Tang, the scion of a wealthy Hong Kong family, has
    begun a reckless affair with Rebecca, a leading pro-democracy protestor. But when
    Rebecca disappears and Jimmy goes to ground, Adrian unearths the familiar old
    urge to investigate. Pursuing Rebecca''s ghost to Java Road, where the city''s
    dead congregate, Adrian reassembles her final hours – as he struggles to distinguish
    between delusion and reality.


    > ''An atmospheric portrait both of a particular place and time, and of the creation
    and destruction of a friendship. Highly recommended''\nGuardian


    > ''Sensual, provocative and riveting''

    Washington Post


    > ''Masterly... This story of moral failings and totalitarian excess is as disturbing
    as it is irresistible''

    Independent


