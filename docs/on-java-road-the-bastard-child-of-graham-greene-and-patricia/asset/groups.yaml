  - '[PAGE 138]


    To an observer that was exactly how I had come to think of it: a form of enchantment.
    But we are all prey to enigmatic enchantment in one form or another. I was, therefore,
    reluctant to moralise too severely. It all depends on what you want to be enchanted
    by or what you want to be disenchanted with. The kind of people who were in love
    with the idea of a rising China tended to be the kinds who relished the idea of
    a declining America and who consequently loved to pronounce upon the latter’s
    problems. China’s problems they tended not to know so much about. What you don’t
    know can still enchant you.


    nover, I still wanted to know from Bawa what the girl in the morgue had died from.
    If it was suicide, had she drowned herself in the harbour as the police were claiming?


    ‘Let’s leave aside the conspiracy theories, shall we?’ Moyers put in suddenly,
    as if to sweep this conversation away and put it in the rubbish where it belonged.
    ‘All this lugubrious gossip about bodies in the harbour. I remember them ten years
    ago and they can’t all have been murdered by the state. Jesus. I’d worry about
    the Americans more than dead girls in Victoria Harbour if you were. Some things
    are real.’


    ‘It’s not a binary choice,’ Cunningham retorted, but avoiding Moyers’ eye because
    it wasn’t worth a full-blown row.


    ‘At least you could tell me which morgue it was,’ I said. ‘Every person dead on-site
    goes to the public mortuary. Was it Victoria?’ It was, Bawa said. I knew that
    shabby bend in the road where the Victoria Public Mortuary stood near the pier
    in Kennedy Town, right above the water and circled by'
  - '[PAGE 139]


    gulls. I had passed within its dirty white walls on two occasions, covering society
    suicides myself, and recalled its air of distance from the city’s life, like the
    abattoirs no one wants to see, not even in passing. That was where all the alleged
    suicides went, all the unknown deaths. The Sai See refuse centre was next to it,
    an unfortunate symbol for those inclined to notice, and it was hard to imagine
    Jimmy rolling out of his limousine in such a setting.


    ‘I don’t suppose,’ I ventured, ‘that they would consider letting me go down there?’


    ‘Not a chance, gwaila. Even if you knew the girl they’d never let you in there.’


    Only then did I begin to feel a chill descend from the dark cobwebs of the dining
    room and touch my upper back.


    ‘In fact,’ Bawa countered, ‘I was going to ask you a favour. I was wondering if
    you could talk to the esteemed Mr Tang about this yourself? You know, just as
    a friend. Just to see how he reacts. Any information you can get out of him will
    help identify this girl. It won’t be easy but I think you could find out.’


    He leaned forward a little, momentarily agitated by all the facts he wasn’t going
    to tell me just yet.


    ‘They’re going to cover this one. I mean, the Tangs are going to cover it up –
    that I can guarantee.’


    ‘But what about the police?’


    ‘They will want to do the same. It’s always how they deal with society suicides.’


    ‘So you think it’s a society girl?’


    A calm smile had spread across his face and he tapped the table with an emphatic
    little finger, on which he wore a gold'
  - '[PAGE 140]


    ring that gave his whole person an appealing vulgarity. noticed as if for the
    first time his garish cheap sand-coloured suit and light rose shirt with a flashy
    diamond-motif pattern. I didn''t like him, or his taste in clothes. The antagonism
    among him, Moyers and myself had a whiff of old-time colonial resentment. We all
    came from Commonwealth nations and we all had our suspicions about one another.
    For them, it was the future that would offer revenge. They weren''t exactly wumao,
    regime trolls, but they weren far off. The dead girl in the Victoria mortuary
    was just a bargaining chip to get something on Jimmy. a scandal he could use in
    one of his columns, a tip to the secret police, a lever he could use to lift off
    the ground a power greater than himself. It wasn''t clear what he wanted. But
    every hack wants something, always casting his line to catch a fish of one kind
    or another. And it was true that now I wanted to know who the girl in the morgue
    was and why Jimmy had gone down there to identify her. I did indeed want to talk
    to him and find out what had happened. Even as his friend I wasn''t entitled to
    know, but I felt offence at the idea that I might be denied it from his own lips.
    At the same time I felt confident that he would tell me the truth - in his own
    elliptical way, of course. He would tell me long before Bawa ever found out. With
    that, in any case, dinner concluded and inevitably paid, even though I was probably
    no more in the money than any of them. Noblesse oblige.


    ONCE WE WERE BACK on the island side I decided on the spur of the moment to ignore
    the Sri Lankan''s advice and Teimah'
  - '[PAGE 141]


    diverted the taxi to Kennedy Town. It was a long ride out west to the quieter
    shore just beyond the last of the blocks, whose lights were going off by one as
    we passed below them, past the faded white walls of the Jockey Club Clinic and
    the little park in Sai Ning Street. Opposite it lay the modest mortuary, but I
    asked the driver to drop me off instead inside the bus station next door, which
    was part of the China Merchants Wharf development.


    I asked him to wait for me for a good tip, and walked slowly back to the mortuary
    on the same road. At the door were two po-po, or police, who I knew were not usually
    stationed. When I appeared, a snooping foreigner and therefore an unwelcome vision,
    they tensed visibly and made a fuss about my ID. My ID would not have made much
    difference, however. Seeing that I had a press badge, they categorically refused
    to let me enter the premises. A far-flung question in English was not going to
    be answered but I spoke to them in Putonghua and one of them spoke fluently. I
    was still a little buzzed from the bad wine and I felt my insolence rising. I
    persisted in throwing a few awkward questions at them right there on the steps,
    saying that I knew a girl had arrived at the mortuary some time before and that
    I had an interest in seeing her. The two men called in a senior officer, who pushed
    open the glass doors and barked at me to step back down onto the street. He, too,
    demanded to see my ID and it was then that I realised had perhaps made a small
    mistake: my name would now be remembered. Who was I, he wanted to know, and what
    was it to me? To which I couldn''t make much of a reply.'
  - '[PAGE 142]


    ''Then fuck off,'' he shouted in English, waving a fist like a mace on a medieval
    battlefield.

    I walked back to the wharf and went through the unmanned gate onto the jetty,
    thinking that I had indeed made an error but not an immense one. Yet I was uneasy,
    uncertain. The sea was calm under moonlight and as ever the scattered islands
    shone in their haze. I sat on the wharf and wore down a Hint of Mint cigarette,
    thinking over the manners of the three policemen whose duty was to prevent entry
    to a public facility with such bad language. The way they had reacted made Bawa''s
    tale about Jimmy more likely than not, though there was hardly any proof one way
    or the other. As the Chinese say, he was certainly zau san ngai, in the shit,
    but literally ''crawling from head to toe with ants''. Beyond that I couldn''t
    say what he had done or how he was involved. Men with money move in ways very
    different from the ways available to someone like myself. In the great coral reef
    of the city they moved like octopuses, knowing caves and niches that I could only
    guess at. Nevertheless, you always assume that you can ask a friend anything if
    it''s important enough.


    FOR SEVERAL DAYS, with that in mind, I called Jimmy at regular intervals, only
    to find his voicemail was perpetually activated and was being used to screen his
    whereabouts. It seemed to corroborate Bawa''s insinuations. As for Rebecca, she
    had never given me her number and there was no way of reaching her. Jimmy himself
    seemed to have'
  - '[PAGE 143]


    gone to ground up in the Mid-Levels, sequestered by his family perhaps. It was
    not like him, and it was unusual for him not to return a call. And yet three days
    later I got word of a party that he had thrown on the night after my dinner at
    Spring Deer. It was said that Hong Kong’s richest man, the superbly named Li Ka-Shing,
    had been there, as well as Jimmy’s formidable father-in-law, Rodney Chow. Once
    again, it was only gossip and I had a feeling that it was not true. It even have
    been information emanating from Bawa himself to needle me. Nevertheless, it made
    me want to go looking for Jimmy’s innumerable friends and associates to see if
    they would slip a hint or two. In the event, they had apparently been sworn to
    omertà. Nor did I find any mention of Rebecca herself. Around them, out of nowhere,
    an almost complete silence had descended. It was as if, for a brief and glamorous
    period, they had monopolised the dance floor and then walked off without anyone
    myself noticing. I thought that perhaps it was due to an agreement between themselves.
    I could well understand the societal pressures they were both continually under.
    But then I wondered just how fully I understood the tight-knit warp and weave
    of a society like Hong Kong: incestuous, gossipy, given to rumours and back-stabbing,
    its money all wrapped up in few clans, always ready to flee to foreign parts if
    the going got rough. Insecurity and a nervous fight-or-flight mentality plague
    the collective subconscious of the wealthy classes. ‘How long have we got?’ they
    seem to be perpetually asking themselves in their nightmares. ‘How long will our
    happiness last?’ There were no answers to either question'
