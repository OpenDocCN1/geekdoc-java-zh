    term for journalists and bloggers who had flown in all over the world to cover
    the troubles in our city but who otherwise had little idea where they were and
    cared even less. It was also a Cantonese word for mainlanders. Both species were
    seated in the dark with girls who had picked up somewhere. The Western species
    in their garishly bad journalist clothes: Banana Republic shirts and orthopaedic
    shoes, as much the drugs of former glories as we were ourselves. The mainlanders
    in suits they had bought at Sam’s.


    ‘They let them in at the airport,’ Cunningham said, ‘and there’s nothing we can
    do about it. It’s competition, Gyle.’


    ‘Yes, it’s all right. Where is the police state when you need it? This is what
    we pay taxes for?’


    ‘They parachute in and take all the girls.’ He glanced around. ‘It’s piracy.’


    I raised a hand to my wound and felt the hardening scab tighten the skin over
    my cheekbone. This man had aimed well, like a professional. It was well known
    that triads recruited from the ranks of amateur boxers, in much the same way that
    the authorities recruited from among them when'
  - '[PAGE 52]


    they needed shock troops to beat up the ununlike rebels. So it was probably true
    that cowardice on this occasion had been the better part of valour. Gradually,
    however, the gin sedated me and the good mood I had been in three hours earlier
    returned. I had been with Sheila Ng from Reuters and at one point it had seemed
    that I might have some success with her — but she had taken the first opportunity
    to vanish into thin air and the Old Man had not yielded a replacement. I was getting
    noticeably older. Charm and wit rapier alone were no longer enough. Nevertheless
    the day had not been entirely wasted. I had spent most of the afternoon interviewing
    a lawmaker who could barely control his eagerness for an imminent crackdown. I
    asked Cunningham where he had been.


    ‘I took the day off and went to Dragon’s Back. I took the taxi all the way there
    and when I got to the top of the mountain I remembered that I can’t hike because
    I’m too fat. You see, my lack of fitness is finally taking its toll on me—’


    ‘You should take up Pilates.’


    His eyes went into tonic immobility.

    ‘Oh, what kind? I’ve heard Pontius is the best version of it.’


    ‘Stern and judgemental. That’s what you need.’nOnly I laughed, though. He had
    a comedian’s delivery. Pontius Pilates.


    He asked me what I was up to these days. Who was I seeing?


    ‘No one really. Though I’m meeting Jimmy Tang on Thursday.’


    ‘Tang? Don’t you know him from university?’'
  - '[PAGE 53]


    40


    ‘Decades ago. It’s only because of him that I’m here at all. Did you ever meet
    him?’


    ‘Too beautiful people” for me. I just follow him in the gossip rags.’


    I said, ‘He can never get himself out of those gossip columns. The fact that he’s
    widely hated is what makes me trust him. We’ll have dinner with him one day and
    you can make your mind up for yourself.’


    ‘Well, better hope your face gets better by tomorrow. It’s starting to swell up.’


    From one moment to the next his face tensed with concern and he peered at the
    wound as if it had worsened second by second before his eyes.


    ‘You should go to the hospital and have that cleaned up. What if it’s infected?’


    All because of a drunk triad, I thought.


    I looked at my watch, as if it mattered.


    ‘I could take a car up to Canossa and have it looked at.’


    ‘Let’s have another round and you can tell them it’s normal for you -- you’re
    an alcoholic.’


    ‘I was probably tipsy when he hit me.’


    Cunning told me that Time magazine might pull him out at the end of the year and
    sending him to Jakarta. His twelve years of enjoying life in Hong Kong, playing
    the Great White Correspondent, were perhaps coming to an end and he would descend
    back into Purgatory either in Jakarta or eventually a suburb in Surrey. The latter
    was where most of us went to die. He hadn’t saved a dime during his time in Hong
    Kong because no one did or could. But he had his'
  - '[PAGE 54]


    little house on Lamma Island that he had bought early on but which he now hardly
    ever used. Perhaps he would die there, in sight of the South China Sea.


    Twelve years ago the city had been a very different place, sheltered as it felt
    then from the storms of history. But the storm had returned and the long-established
    security in our hearts had vanished. Cunningham would continue writing stories
    about follies and outrages that even his own readers didn''t care about, and I,
    if I was lucky, would carry on living here doing reports for websites and occasionally
    magazines since I, too, had bought a little place for myself when the going had
    been good back in 2006. As long as you''re not paying rent you can get by doing
    what you want — that had long been my philosophy.


    One round later, willy-nilly, I paid for the drinks and went back outside to find
    a cab to take me up to the Mid-Levels and the Canossa Hospital, where I was well
    known for my minor accidents at parties and my mishaps at home caused by especially
    severe hangovers. That night, however, as I was slumped in the back seat looking
    out at the freeways turning turning circles within circles and the wet trees in
    the parks, inhaling traces of tear gas through an open window, it seemed to me
    that something had quietly come to an end. I had been assaulted by a local who
    had decided that I was the new enemy. In two decades of living there that had
    never happened before. The chemistry had changed, as it eventually does, and I
    was no longer invulnerable. We climbed above the city and were not far from where
    Jimmy kept his palatial apartment. The hospital was deserted and I was treated
    on the spot. A'
  - '[PAGE 55]


    vicious wound, la – how did it happen? I lied because I thought it better to lie
    about what I now realised had been an ideological or even racial attack.


    I walked down the hill afterwards and heard chants and cries going up from the
    apartment complexes on all sides, they did every night at the same time. Protestors
    not on the streets but in their own apartments, standing in the dark on their
    balconies and shouting encouragement to one another the chorus of some enormous
    improvised Greek tragedy. Sometimes the playful English words ''Add oil!'', which
    had come to mean something like ''Keep at it''. I supposed that the Tang family,
    playing backgammon on their terrace every night, would hear these operatic cries
    as well and that Jimmy would like them more than his wife. But he would keep his
    mouth shut, even as he smiled inwardly. He was fond of quoting a piece of graffiti
    that had begun to appear on Hong Kong''s walls: In the future, everyone will want
    to be anonymous for fifteen minutes.'
