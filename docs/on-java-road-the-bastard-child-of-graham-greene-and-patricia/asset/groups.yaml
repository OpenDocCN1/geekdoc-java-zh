    FOR NATALIE WANG

    Who walked with me over the mountain to Shek Wan

    And gave rise to a story


    A GENTLEMAN ALWAYS ACTS ACCORDING TO HIS CONSCIENCE, as reported by his physician
    Dr Li Tung


    # ONE


    THOUGHT, IN THOSE DESPERATE days, of that passage in a novel I had read in school
    where the narrator insists he prefers to be known as a reporter than as a journalist,
    the humble word denoting what he does, namely transcribing what he sees. Today’s
    an even less dishonourable job description. I knew all the journalists in Hong
    Kong, of course, but I also knew a fair number of the reporters – the citizens
    trailing the city’s movable zones, often like me all alone with a phone camera,
    and over time I had become more comfortable among them without consciously knowing
    why. But then what were we describing and for whom? I wasn’t sure about that either.
    For myself, perhaps, and a few others scattered across the globe, as I liked to
    imagine, it would depend on how deep you wanted to go into yourself. Some of these
    reporters had become strangely famous. They were unlike me in that respect. Although
    I had been in Hong Kong for more than twenty years, slaving away as a reporter
    factotum persevering his way into higher echelons of respectability, I had never
    made a name for myself in my adopted city. People knew me vaguely as a writer
    of something or other, and a fairly infamous glutton, but little more than that.
    I had gone there still a young man, chilled to the marrow by London and its prospects,
    unable to see myself succeeding in that tomb of a city. I had arrived in Hong
    Kong just after the Handover, knowing nobody except my old university friend Jimmy
    Tang, and equipped only with a single suitcase and savings of five thousand sterling.
    I had done well given those auspicious beginnings, but I had never become a star
    writer. And in a way I didn’t mind at all. I had worked for a variety of newspapers,
    enjoyed a stint as a restaurant critic, married and divorced, accumulated a small
    apartment and perfected the Chinese I had studied at university. In other words,
    I was an excellent nonentity.


    IN FACT, AT the beginning of that summer, when the disturbances had first erupted,
    I felt as though I were being woken from a deep and meaningless sleep. The city
    I had grown so used to – comfortable, cynical, overflowing with wine dinners and
    white-truffle events – was shattered the first moment I saw one of my neighbours
    wander onto Java Road at midnight in a white sleeveless shirt wielding a butcher’s
    knife. I knew the man by face if not by name because I saw him every other day
    at Fung Shing, the restaurant on that same Java Road where I spent much of my
    time drinking tea with wont jiao soup dumplings and editing my reports. I think
    he recognised me, too, but I was invisible to him in that moment on the street
    at midnight because he was there looking for protestors to intimidate, and a Chinese
    civil war doesn’t automatically include European drifters.


    Later, it was true, certain expatriated foreigners would indeed become local heroes
    in the conflict that consumed the city that summer, like the Frenchman with no
    legs declared his solidarity with the students while standing precariously on
    his prostheses and orating to thrilling effect. I never found out his name, though
    I was resolved to buy him a drink if I saw him eating alone in a cheap restaurant.
    He was known merely as the Frenchman with No Legs. As for the fellow knife-wielding
    diner at Fung Shing, I never knew his name either, but he would reappear like
    the ghost in a folktale, never losing his power to disquiet.

