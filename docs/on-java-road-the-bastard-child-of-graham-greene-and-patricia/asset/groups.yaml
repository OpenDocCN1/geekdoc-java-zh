    “每个人都有皇帝，”我说，“随地地，随处可见。我在想他们是否也会把我们这里的某一个做成木乃伊。”


    “如果你觉得你们有皇帝……”吉米叹了口气，做出一脸嘲讽的表情。“你们这些人——你们根本不知道。我们的皇帝是真正的皇帝。当你发一条他们不喜欢的推特时，你就消失了。”


    “而且你再也没有回来，”瑞贝卡冷冷地补充道。”


