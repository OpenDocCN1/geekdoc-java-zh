    or indifference had them in its grip, it was hard to to which which.


    As I from from floor to floor, from wake to wake, I realised that I was alone
    in pursuing a chimera. The dead woman’s ghost was watching me from afar. I believed
    in it. She, too, was now a gwai. As such, I felt her in the environment around
    me, a spirit in its discontent, vocal and tangible only inside my own mind but
    challenging me directly. Through sheer misfortune, I was seemingly the only witness
    to her disappearance willing or able to do something about it, the only one apart
    from my source who did not have a vested interest in minimising it.


    In Chinese mythology ghosts who have not received justice return to earth seek
    vengeance. They are either ''hungry'' or ''wandering'' ghosts. Offerings are made
    to them. They have to be appeased, laid to rest. At the Festival of Hungry Ghosts
    on the fifteenth night of the seventh month offerings are made to them. There
    are nine kinds of hungry ghosts, but I could only guess as to which category she
    might belong. But then, what about the living? Rebecca might have had friends
    who wondered about her, who had gone looking for her, but I knew none of them.
    Nor did any of them contact me. We moved in different circles. And so we were
