    The meeting with them that I had been dread finally came about, though not because
    of any initiative on my part. It was just a normal afternoon as I was walking
    down Java Road when I felt over my shoulder a car shadowing me at a crawl and
    I realised the To clan had finally found me. It all happened as smoothly and unremarkably
    as a random encounter in the street, which it was not. My only surprise was not
    that they had tried to find me, and succeeded, but that they had taken so long
    to do so.


    ## ELEVEN


    HE CAR STOPPED JUST AHEAD OF ME AND A DRIVER IN full uniform jumped out with surprising
    friendliness and announced his master''s name. "Would I mind taking a short drive
    with Mr To, since he would greatly appreciate a conversation with me, if I didn''t
    mind?" After a moment''s alarm, I consented. Despite my shock I was in fact eager
    to talk to him. He was enthroned in the back seat of his ancient black Daimler
    with tinted windows, dressed in a plum corduroy suit and matching suede loafers
    with long black Bresciani socks. He apologised for having followed me, then shook
    my hand with a strange withered smile and asked the driver to lock the doors.
    For our security, his tone seemed to imply.


    "Shall we drive around, Mr Gyle? I can let you out whenever you like. I have some
    whisky in the car," he said, pointing to a small walnut cabinet set into the partition
    before us. Its door was spring-loaded and formed a tray with tumbler holders when
    opened. "What happened to your face?"


    By now I had almost forgotten my wound, as if it had happened long ago, in another
    century. Reflexively, I reached up to touch it, assuring myself that it was still
    there and had not healed.


    "Oh, this. I hit a door."


    "Good for you. At least you don’t get into fights like some people I know. Do
    you take ice in your poison?"


    "One cube."


    We drove out towards the Chai Wan Gap and To asked me tell him a bit about myself.
    I seemed to know a lot of well-connected people in Hong Kong. Was it a scheme
    of mine?


    "To do what?"


    "You journalists – you get around. I suppose you know all about the To family."
    We were in sight of the moonlit sea and he pointed at the shadowy land mass on
    the far side, the mountains, which always look improbably unattainable and distant,
    and I wondered if he actually remembered we had almost met that night at the China
    Club. The night I had walked through the park with his daughter.


    "We came from over there, like everyone. My grandfather was a black marketeer.
    It wasn’t so long ago. We were friends with the British, though. Are you a homesick
    type or a lifetime expat type?"


    "I’m an immigrant, so the latter."


    "So we’re both immigrants in a way. Immigrants or emigrants. You strike me as
    more of an exile. The voluntary kind. It’s a happy destiny in some ways. I always
    say it could have been worse. One could have been left behind."


    I asked him if he wanted to talk to me about Rebecca since, I added, he must have
    seen the photographs of me with her and Jimmy.


    "Photos?"


    "Am I wrong to say that?"


    He looked cold and stricken but he did not seem hostile to me. On the contrary,
    it seemed he had persuaded himself that I had nothing to do with her death. No,
    he admitted, it was not wrong.


    I said I was sorry, more sorry than I could say over a tumbler of whisky in a
    moving car.


    "She might," I said, "have been in the wrong place at the wrong time."


    My words were rational enough but his face had become tortured and dark, the lips
    running away with themselves a little, as if they couldn''t catch up with the
    thoughts moving through his mind.


    "Isn''t that what they always say? But it was a curious day, the day that she
    disappeared. The thunderstorm."


    "What day was that?"


    "I think," he said, "that you remember that as well as I do. We both know."


    It was a curious thing to say, I thought.


    "The night I saw you all together at the China Club?" I suggested, as delicately
    as I could, that it was possible that I had seen her with them at the China Club
    on the night in question. Was I mistaken?


    "The China Club?"


    He was genuinely taken aback, and denied being there with Rebecca.


    "But," I said, "you were at the China Club?"


    "What do you mean? We go there almost every night."


    "Ah, I see. But when were you last there with Rebecca?"


    His look grew more perplexed.


    "We’ve never eaten there with her. She detests the place." By now I had almost
    forgotten my wound, as if it had happened long ago, in another century. Reflexively,
    I reached up to touch it, assuring myself that it was still there and had not
    healed.


