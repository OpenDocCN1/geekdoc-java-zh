    it. At about six, momentum was gathering around the tale of the shot student inside
    Kwong Wah Hospital, the officials at the morgue had made calls for relatives to
    come and identify the body. They must have found some clue to her identity in
    the jacket pockets. Bawa himself had not been allowed to see her. He had been
    obliged to wait outside while an officer quietly filled him in on the details
    as if the information was understood to be confidential. It was, without question,
    a suicide, the officer had said, and Bawa repeated it to me with a grimly straight
    face that revealed not the slightest doubt of the official story. Of course, the
    police never lied or even exaggerated to their friends in the media, and here
    Bawa was certainly a friend.


    ‘But as I was waiting at the morgue, writing in my notebook, I noticed a limousine
    drawing up outside and a man getting out. I thought I recognised him from the
    gossip rags. I think Jimmy Tang is a friend of yours, isn’t he, Adrian?’


    I had to dampen down the immediate surprise and pressed my lips together for a
    moment before speaking.


    ‘Jimmy?’'
