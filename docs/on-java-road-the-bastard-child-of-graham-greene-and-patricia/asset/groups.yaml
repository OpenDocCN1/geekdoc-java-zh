    passing mutineers, the crowds parting for ambulances, all the things that made
    their way into the international media and which set up an expectation of a mere
    family feud that would soon blow over. But the people far away in their democracies
    had little idea who they were dealing with and nor, for that matter, did I. That
    week I began to notice a hysteria creeping into the police as midnight approached
    on the weekend nights, the banging of batons against their shields like a Spartan
    phalanx, the surprise of tear-gas canisters launched from the upper floors of
    tall buildings and overpasses, streaking towards us with plumes of smoke like
    failed fireworks and spinning with an antic malice towards our feet when they
    hit the ground.


    Something in me turned but it must have happened more gradually than my conscious
    mind understood. It was like the nails of a steadfast building popping out one
    by one. The timbers move and shift, the beams quiver. On some weekend evenings
    there was a haze of fire and smoke in the wider streets of Central, which helped
    the crowds there to feel the potency of their own numbers, the power of a formless
    mass directed against a single target. Everyone knew that slogan was ‘Be water’,
    a charming piece of advice from Bruce Lee concerning the evasion of an enemy’s
    blows. But water can also be a punishing wave. Those human waves crashed against
    mainland banks, MTR stations, police stations, small deployments of cops which
    broke and retreated under a hail of missiles and then subsequently against water-cannon
    trucks and sometimes against defiant taxi drivers who – a rare thing – detested
    them and ploughed into them only to be stopped farther down the road, dragged
    out of the vehicle and beaten with staves.


    Everything was caught on cameras. The acts of everyone everyone carried – a symbol
    of earlier protests – served many purposes as they were hung over cameras and
    used to shield faces from being identified later. The great bristling machine
    of security state had been roused, and it was often foiled by the humble umbrella.


    AT THE END of the week I dressed up once again went to dinner at the China Club
    with my roving editor of, Simon Strick, who was based in Singapore but came over
    once a month to keep an eye on his contributors and stringers. He was an American
    of about sixty who had worked at The Washington Post in his younger years and
    was serving out managing a widely read English-language news site that he was
    weary unable to love, despite having hundreds of readers and having been a staple
    of the industry for close to a decade. Something in him longed for the days of
    clacking typewriters and tumblers of scotch. He had grown fat in Singapore drinking
    his way nightly at Odette. His clothes rarely fit him. Yet both got our suits
    at W. in Hong Kong, which I would go to meet him at the China Club would always
    find him alone by the atmosphere of men who are looking in life’s rear-view mirror
    while trying to keep their looks, which can only be done with attention. Even
    though gleaming and well cut, were not flattering; his eyes explored every room
    for this dismal equation was not clear to him, as in the end his fall from favour
    was a mystery. It was anything but.


    Adrian, I’m glad you’re still breathing. He got up for a moment, a little unsteady
    from a few drinks, and shook my hand. Lovely to see you, my lad. How are your
    lungs? Ah yes, I can hear – you’ve gone downhill. And what on earth is on your
    face? Is it infectious? Oh, that I reached up to it reflexively as I always seemed
    to do whenever it got mentioned. I was stung by an insect on hike. Were you, now?
    My God, the insects they have here. He was earnest as he patted my shoulder. Peking
    duck all right? Why not. He went on, I’m staying at the Icon. It’s a hell of a
    place, completely empty. You can see all the riots from there. Maybe we should
    run a piece about occupancy rates? Don’t ask me to write that one.


    He grinned and the teeth were off-white but uniform all the same. It was sincere
    to say the least. We do have to capture the whole picture in some way, Adrian.
    Not that we didn’t appreciate your street coverage. It’s exceptional. But it did
    occur to me that down the line you might be putting yourself at risk and we have
    to think about medical costs if you get properly fucked up. There are bigger out
    there, I’m sure. On the other hand, I personally would like to see some stories
    about the hospitals. Can’t you get inside one? No interest in that, sorry.


    The thing is, everyone else is covering the protests. You’ve done some sterling
    work, of course, and it’s the story of the moment, but is it entirely ours? I’m
    trying. But I never seem to quite catch it. I didn’t want to be the one who said
    it. I know what you mean. It’s like running to the scene of a crime and catching
    a pair of coat-tails whipping around the corner just ahead of you.


    I laughed. You’ve nailed me there. I’m not fast enough anymore. Better to do something
    deeper and at a slower pace. Don’t you agree? I could feel his grip tightening.
    I’ve nothing against it. A moment later I found myself looking across the room
    in expectation of encountering someone I knew, the half-forgotten faces that sometimes
    come back to you in a restaurant’s rush hour. At the club it was not unlikely.
    Under the black lacquer fans everyone looked slightly familiar, as if I had met
    all of them at least once before remembering any of them consciously. But at the
    far end of the room, beside a wall covered with Chinese calligraphy, that same
    eye caught sight of Rebecca eating with what looked like her parents at a table
    by themselves. They were all three dressed in white like people at a garden party—or
    a religious ceremony—even though it was then past nine. While her parents, if
    that''s who they were, had their backs to me, Rebecca was facing me. I seemed
    to recall something Jimmy said about her parents being members of the club.


    This apparition served as an improvised inspiration and I said, not taking my
    eyes off her, that maybe I should write something about upper-class families and
    their children who were taking to the streets.


    That’s a splendid idea, he cried.


    Could we do it? Of course we could do it. I think it would be immensely interesting.
    Gripping. Involving. I mean, what is going on with them?


    He knew perfectly well that I had a foot in that world and had done well for himself.
    Backed by a shady billionaire, The Raven paid far more than The Washington Post.
    He was on his phone when I came in and yet the jazz playing in that room made
    his conversation impossible.

