    near the ground-floor lobby, filled with a party of members, that he paused for
    a moment, relented and turned on his good foot to face me. His face had aged and
    he had lost the gladsome tilt of his hips. Yet the offhanded amorality was still
    in the eyes, with the knowledge that at the very last moment I would not have
    the guts to hunt him down. It was better that way. Instead he smiled and flicked
    a salute with two fingers against his right temple as if to say ''Nice lecture,
    comrade.'' And then he was gone, slipped away through the crowd and out into the
    dusk of Whitehall, where the bells were ringing, though of course not for him.


