    I’m assuming, Adrian, you had nothing to do with those pictures coming out in
    the press?


    ‘You have my word.’


    ‘For what it’s worth, I believe you. My father is smoothing it over behind the
    scenes. She is apparently some kind of activist in the protest movement. Did you
    know that?


    ‘I doubt it’s true.’


    ‘She is a jung mou, a frontline fighter. My father is aplectic. It is a threat
    to the whole family’s relationship with the Chinese state. I can’t believe you
    didn’t realise that, getting on that yacht with them,’


    I said nothing to that.


    ‘I’m curious as to what you’re going to do next. You’re not in a British outpost
    any more. And you know Jimmy is counting on your loyalty from now on, don’t you?
    I’ve always counted on your discretion and you’ve always delivered. You lied to
    me about that girl, but it was for Jimmy, so I understand. Well, I try to.’


    She took a large gulp of her whisky soda and looked around the living room. I
    asked her when they were leaving.


    ‘We’re still deciding it. I want to go to Italy for a month first. I feel like
    he owes me that, at least. I intend to clean out his bank account.’


    But, I thought, you’ll return to Hong Kong soon enough. You’re tied to this city
    by the heartstrings.


    Then I said, ‘Did Jimmy never say anything to you about where Rebecca is now?
    You must be curious yourself,’


    ‘Why should I care about that little whore? I hope they tear-gas her every day
    for the rest of her life.’


    ‘Jimmy didn’t say?’


    No. Naturally, I’ve asked him. But he said he has no idea. For once I believe
    him. And you don’t know either?’


    I shook my head, and I had the sense that she was not being entirely truthful.
    And so in those moments our regrets moved below us, water under the bridge, then
    quickly passing out of sight, and I was left wondering whether I really knew her
    at all, even if I had always known she wore a mask with me. Exasperated, I got
    up with a frivolous show of formality and said I’d better be on my way, but she
    herself remained seated, still glacial and coldly furious.


    ‘Tell me, what is she like?’


    I had to think while I pulled together a quote that would serve.


    ‘She’s – lively.’


    ‘Lively?’


    She sneered and looked at me as if I were joking at her expense.


    ‘Is that all you can come up with?’


    ‘I don’t know – she’s a cockroach, as you would say. A gaatat. A beautiful cockroach.
    I think Jimmy was a little in love with her.’


    It was the cruelest thing I could say to her but it made her relent and the sneer
    left her eyes because it rang true. The sudden deadness in her face released me
    and I quietly said my goodbye and went out alone, back to the landing and the
    Art Deco lift. Yet again I was reminded why they call foreigners ghosts, gwai.
    We have no substance in their social order. I had never had that word gwailo –
    the word lo, or man, simply added to it – tossed in my face up till then but I
    often wondered when it would happen. Even as an insult it might have some truth
    to it. On my longest nights, I had often dreamed of dying in a hospital here then
    waking up and walking back to my prior life, not realising that I was no longer
    real. A common nightmare among the ageing. You walk down a sunlit street at noon
    and suddenly you perceive that you cast no shadow on the pavement.


    # TEN


    NEVER FOUND OUT IF JIMMY HAD REALLY GONE TO Los Angeles on his business trip or
    whether he had in fact been listening to us from one of his closed-off bedrooms.
    Everything about the Tangs became more obscure by the day. Despite what Melissa
    had said, it was now impossible to be friends with them since, as far as she was
    concerned, I was an accomplice to their scandal, however much she had hinted that
    she might forgive me. That said, his little scandal came and went, and as if the
    fickleness of the collective mind were at play, Rebecca To''s name also came and
    went, brushed off into the shadows where many people felt it belonged. Aside from
    her parents and friends, it was I who was left with the question of her disappearance
    as something experienced night and day, an emptiness that felt like a great slow-motion
    decay in the heart. Guilt played its part. We had not known each other very long,
    or very deeply, I felt that my silence had helped cover up her erasure, and again
    I had willingly played my role of accomplice.


    It was the cleanliness of this erasure that surprised me the most, though I couldn''t
    say why I should have been surprised. No formal announcement of her death appeared,
    the family made no grieving proclamation. The reason for this, I theorised, was
    that they had elected to keep things quiet and not draw unwanted attention to
    themselves. They had kept their grief private as well. It must have been an extraordinarily
    difficult thing for a Hong Kong family to do, and it would have been against all
    their ingrained social conventions. But the times were no longer ordinary and
    people had changed their behaviours accordingly. People have endured more extreme
    distortions of their customs in more violent societies and so their secrecy did
    not seem entirely impossible to understand.


    But the effect was as if she had never existed. This calamitous idea grew within
