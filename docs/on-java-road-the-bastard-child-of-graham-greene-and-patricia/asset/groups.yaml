    from a tall building – no one could assume that they knew what had really happened.
    If it was a genuine suicide, no one believed it; if it wasn’t, much of the population
    did believe it. Insinations and gossip sprang to life around the event. It was
    impossible to know who was telling the truth. Whether it was the police or the
    tabloids, we all told stories to explain the event. No one knew what was solid
    and what was air. Suspicion was the only governing law of the new age. How could
    it have been otherwise when the entire state was now built on secrecy and dissipation?
    So a society melts away, like something solid, as I had also thought before in
    the bathroom at Mott 32, vanishing into thin air.


    In any case, Wong went on, after these odd events with Jimmy Tang neither he nor
    the other doctor had been allowed back into the lab for a few hours, and when
    they had returned to work the following day the body was gone. The disappearance
    was as complete as it was enigmatic. He looked at me and there was a faint, slightly
    cruel smile. For a while, then, he and I drank our coffee without talking further.
    I felt exhausted and I suspected he as well.


    I told him I would leave first and that since we should not be seen together he
    should remain with his coffee for at least fifteen minutes. I gave him one last
    eye-to-eye and went out into the street as if in need of moral fresh air. Think
    about a man who needs to be paid to divulge what he knows to be criminal. On one
    level, it wasn’t his fault – he was in an ambiguous position. the rebels called
    them gong zu, timid ‘pigs’ who prized the everyday lives over anything else, but
    I couldn’t blame them, given that they had their own families to feed. I think
    often of those middle-class professionals living under Mao in the Jiangxi Soviet
    of the 1930s who were assassinated to cow the population and whose wives and children
    afterwards had to roam the streets for years as beggars. No one ever knew what
    became of them. Wong was in the same position as those men had been, and it was
    better for his children if he talked only to me and preferably for a sum of money.
    It was easy to despise him, but as I walked back to Java Road I realised I didn''t
    feel superior to him at all. There was, after all, something vaguely noble in
    his corruption.


