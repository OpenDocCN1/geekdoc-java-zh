    then stilled itself. I rang again. Curiosity always wins out. Socked footfalls
    approached, very quietly, and I could sense the eye behind the peephole staring
    into the landing. Then the door opened and Melissa’s voice came onto the landing
    and asked who was there. I stepped out, as nonchalantly as possible, and made
    the grin sheepish. ‘You!’ she gasped, and not hesitating too much, slid off the
