    they seemed even more ridiculous to me than they usually did. Untidy crescents,
    ruined by constant worrying.


    ’No. I’ve lost the touch for that sort of thing. I sometimes think it’s because
    I’ve lost the knack for simple fun. Fun is the word I hate the most.’


    ‘Didn’t Jimmy tell you one has to have fun before it all goes dark? I would have
    thought you were a fun expert. Aren’t you?’


    ‘Not at all, no. I’m a dreary person’s dreary person.’


    But we were laughing it off, and she didn’t believe a word of it.


    ‘Jimmy and I beg to differ. With me it’s a choice. I like coming over a bit dreary.
    It keeps the flies away.’


    ‘Ah. Of course I seriously doubted it.’


    ‘I think I might have to go soon,’ she said, stifling a yawn. I’m actually quite
    tired. I inhaled too much tear gas earlier.’


    ‘What about Jimmy?’


    ‘He’ll go home to his wife and a hot toddy. It’s a weekday.’


    ‘Simple as that?’


    The eyes slackened a little, her uncommitted smile matched them.


    ‘We go our separate ways. We’re not tied to each other night and day, in case
    you hadn’t noticed. Married men. I call them “the tribe.”.’


    It was a step too far in the direction of confession and I could see that she
    instantly regretted it.


    It’s your game, I thought. Your rules.


    She said, ‘You and Jimmy can stay out drinking, or what-'
  - '[PAGE 69]


    ever it is you like to do. What a shame there aren’t any opium houses left.’


    ‘Stay,’ I wanted to say. ‘The night is still middle-aged.’


    I then glanced down at her legs crossed at an angle to mine and noticed that there
    were spots of blue dye on her shins. The police used that dye in their water cannons
    so that anyone touched by their spray could be identified later.


    ‘Where did you go?” I asked, in such a way that we both understood what I meant.


    ‘Nowhere special – I wandered the streets. Who wants to know?”


    “Didn’t Jimmy tell you not to go?”


    “He did but it’s not his call. He can’t go but I can. And since I must go, I do.”
    She paused. “Same as you.’


    “Then I might see you out there one day. Don’t be shy. You’ll see me because I
    never wore a helmet.”


    “We cockroaches aren’t shy – we’re gregarious. I don’t wear one either.”


    What I said next was almost serious:


    “If we meet up like that, I promise you won’t tell our mutual friend. You could
    even introduce me to your friends, if you felt like it. I’m curious about them.”


    “You mean “the young”, as you call them? We’re nothing special. We’re just you
    without the experience. You weren’t any different at our age.


    I wondered if this was really true. In a single moment, provoked by such a comment,
    flashes of my past came back to me. Had I been no different from her, her generation,
    at that age? I couldn’t answer the question. I said that sometimes I feel I was
    never young because increasingly I couldn’t'
  - '[PAGE 70]


    remember it. It felt like pantomime I was acting in long ago. But I had lost the
    plot of it and now there was no plot at all. Growing old is never what you expect
    it to be. Beating one’s oars, borne back ceaselessly into the past.


    ‘Plot?’ she said. ‘You’re a sentimental generation, if you didn’t know that. We’re
    spoiled brats but not sentimental spoiled brats.’


    ‘There’s little wrong with being a bit sentimental. How can you not be?''


    ‘But you,’ she went on, ‘had something to look forward to when you were young.
    You had a future. That’s the difference.’


    It was the simple gravity of this commonplace that took me by surprise. Young
    people in the West were always talking like this, and they had been talking like
    this for centuries. Whereas in the end, in the real world, they always turned
    out to have a reasonably comfortable future. The Sex Pistols all made good for
    themselves, apart from the odd overdose. ‘No future’ turned out to be an empty
    refrain. Our rebels always eventually bought a ranch in Colorado or a beach house
    in Costa Rica. They were never in danger. But her generation in Hong Kong were
    facing a real future with no future, an actual oblivion enforced by banks, electronic
    warfare and men with machine guns and telescopic sights. They were like the last
    pale flowers of Weimar. I thought then that if a human being takes on all the
    context in which she lives, it’s also that context which makes them beautiful.


    Jimmy reappeared then, still talking into his phone. There were always deals going
    on that no one else knew about – openings, business opportunities, ways to make
    money'
  - '[PAGE 71]


    among his networks. He ended his conversation and affected

    gaiety that presumably would last the whole night.


    But he seemed annoyed when Rebecca announced that

    she was leaving. ‘Oh?’ he said. ‘Did Adrian say something

    uupsetting?’


    ‘Not at all. He’s behaving very sweetly.’


    He gave me an arch glance.

    ‘He’s white sugar, all right. And I’m going for a drink

    with him if you’re going to be a dud.’


    ‘I’m tired of drinking,’ Rebecca said, meticulously folding

    her napkin back to its original square. ‘Take Adrian to Rōnin.

    You have a driver.’


    ‘The streets are blocked,’ I said, hoping it would extin-

    gish the idea since I, too, was growing tired of the endless

    drink in darkened rooms.


    Jimmy threw both hands in disgust.

    ‘So now I have to go home?’ he said petulantly.


    ‘You can play Solitaire in your kitchen,’ I said. It’s larger

    than my apartment. And the house I grew up in.’


    But in the end she stayed, I don’t know why. She must

    have been enjoying toying with us. Generations are usually

    at war but at the same time they often have a morbid curios-

    ty about one another. We lay on the outdoor sofas while the

    stars seemed to be getting smaller night by night.

    It was the effect of lachrymator and smoke rising into the

    atosphere and forming a permanent shroud. Stellar insig-

    nificance. Crumpled and limp, their bodies had drifted to-\gether perceptibly
    and now their intimacy revealed itself.

    I felt a curious resentment about it. Jimmy meanwhile com-

    plain about his in-laws, as Hong Kongers do, and falsely'
  - '[PAGE 72]


    lamented his lack of acumen with money. Lucre. It slipped

    bween his fingers, he said, and there was no helping him.

    He would end up one fine day in the Garland, just like me.

    Yet for myself I was thinking how, even now in our middle

    age, I couldn''t compete with him, as I had known for a long

    time, and between him and Rebecca there lay the warm

    exclusivity of Cantonese itself, that supple and mocking lan-

    ganguage which I loved to imitate from the outside, like a mon-

    key doing simple problems, but which I couldn''t enter

    myself. So in another man''s ancestral garden plays the\outsider, the half-idiot
    observer. In course, however,

    distracted by my own sidelined condition, I found myself

    looking once again at the blue spots on Rebecca''s legs and

    found that I could no longer recall when the police had

    started using that particular chemical. It was a new develop-

    ment, but it had arrived furtively. The strangeness in the way

    that ordinary day-to-day things became forgotten as if time\itself had sped up.
    It made me think of a scene in the Chinese

    novel The Three-Body Problem in which an adult and a child

    staring at the body of a slaughtered Red Guard and the

    child asks the adult if it''s the corpse of an enemy or a hero.

    ''Neither,'' the adult says. ''It''s history.''


    As we lay there mentally preparing to leave, a woman of

    Rebecca''s age passed us, turned for a moment and recognised

    Jimmy and Rebecca. There was a fussy greeting among the

    three of them and the newcomer, Kerry Hui, sat with us for a

    minute. She shook my hand and gave me an examining look.

    She was one of their circle, I assumed, student like Rebecca

    in her final year, and they talked together in English as if I

    wasn''t there, but as a courtesy to my presumed inability to'
  - '[PAGE 73]


    understand Chinese. It was small talk, but there was a subtle tension underlying
    it, as if driven by matters mutually understood but not openly mentioned. Rebecca
    leaned to me eventually and said that her friend was an aspiring journalist and
    that perhaps I might be interested in sharing some advice with her.


    The friend also moved closer and said, ‘I’ve read some of your pieces in The Raven.
    I think you have such a good style.’ ‘Is that right?’ I said.


    ‘Yes. Can I give you my card? We could meet up if you don’t mind.’ I’d be grateful.


    I took the card, feeling excessively flattered, and Kerry got up almost in the
    same instant and announced that she had to leave. It was hard to get taxis home
    these days.


    Let’s all go,’ Jimmy said and gave me a sly look, as if I had found or made a
    fan. We went as a group to the lifts and the staff bowed to Jimmy more than to
    us. Rebecca and he were tipsily intimate.


    Even as we were deposited on the street by the lift, their banter in Cantonese
    had started up again. They were arm-in-arm already and I could see that they would
    not be going their separate ways after all. On Duddell Street there were dozens
    of small CCP red flags strewn over the wet pavements but only I seemed to notice
    them. Kerry kissed Rebecca, shook me and Jimmy’s hands disappeared into the night.
    But as his car appeared, Jimmy asked me if I wanted to come on a yacht trip with
    them the coming Sunday. It would be a tour of the islands with his own crew.


    It’ll just be us three and the skipper. He doubles as bartender. Makes a mean
    Bargirl. What do you say?”'
