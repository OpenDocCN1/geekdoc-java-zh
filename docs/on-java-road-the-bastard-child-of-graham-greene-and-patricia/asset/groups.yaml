    ''What do you mean, where?'' Jimmy said without looking at me.


    As we climbed aboard he said that there didn’t have to be a where on an outing
    like this, there had to be room for improvisation.


    ''We’re going to pick up Rebecca on Cape D’Aguilar and then head out into the
    unknown. So many islands, so little time. We have lobster and Cantopop. It’s a
    heady and slightly nauseating mixture.


    Uninhabited islands: it was very much his style. The screwdrivers came when we
    were seated at the back with the fishing rods, shaded by an awning, and the iceboxes
    had been opened. They were filled with glass jars of black caviar and pots of
    crème fraîche. Tom put Wong Ka Kui on the sound system and we went out to sea
    away from the terrestrial heat and cement. I got through three screwrivers and
    crackers with caviar. Soon we were skimming past the green fringes of Llama and
    into a mild and pale sea populated with little islands whose names neither of
    us could remember. I knew Beaufort Island, however, and the Tai Tam Tau headland
    opposite it. We moved between them with the music blaring, turning towards Cape
    D’Aguilar and wild rocks agitated with surf. Its hillsides were carpeted with
    metallic jungle and bathed in sea mist, with the lighthouse at its summit lit
    by the sun. At a small bay called Hok Tsui Wan we threw anchor and waited for
    Rebecca.


    Sunbathing, drinking at a good pace, we looked down at pearl-spot chromis glittering
    in silent gangs while changing our drinks to hard martinis. It was Jimmy himself
