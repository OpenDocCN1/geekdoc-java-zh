    \ tracked small things as a matter of course. A stranger, not very attractive\
    \ but full of empty words. The reverse of herself. The room was only half full\
    \ and she seemed to fill it even with her subdued luminosity. She was one of those\
    \ people who gives the impression of a physical stillness that is an accurate\
    \ transcription of the international kind.\n\nI lifted the glass for a toast of\
    \ some sort.\n\n‘Yum sing.’\n\nWe drank together and Jimmy’s eyes, bright and\
    \ hard above the glass, found me and dared me to question his taste.\n\n‘Jimmy\
    \ tells me you’re a student,’ I began. It was a clumsy opener but someone had\
