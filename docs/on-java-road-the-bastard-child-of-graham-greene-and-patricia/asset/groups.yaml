    WITHOUT DEATH,’ MAO USED TO SAY, ‘HUMAN LIFE could not exist.’ As an aphorism
    justifying the 35 million deaths during the Great Famine I’ve always thought this
    saying possessed a remarkable, no doubt psychopathic coolness of touch. But many
    of the Chairman’s sayings, it meant nothing at all when you mulled it over for
    a few seconds. The same was true of his sayings about cities, of ways of life;
    about books, culture and for that matter whole civilisations. They were worthless.
    When intellectuals, that hopeless tribe, objected to his destruction of irreplaceable
    ancient sites across his country he cleverly made part of the demolition crews.
    There was nothing he hated more than Chinese architecture. However, he seemed
    to love poetry, which he wrote himself. Inevitably, then, into those ensuing weeks
    of limbo, I thought about the Chairman and Rebecca cremated out of sight and poured
    as ashes into a plastic container.

    I heard some days later that the Tos had boarded up their house in Repulse Bay
    and decamped to London in time for Christmas. The Tangs had gone to ground. Jimmy
    never called me once after the anonymous ‘Death of Rebecca To’ hit the Hong Kong
