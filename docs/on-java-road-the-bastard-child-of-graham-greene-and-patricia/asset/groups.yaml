    beaten with staves. Everything was caught on cameras. The acts of everyone everyone
    carried – a symbol of earlier protests – served many practical purposes as they
    were hung over security cameras and used to shield faces from being identified
    later. The great bristling machine of the Chinese security state had been roused,
    and it was often foiled by the humble umbrella.


    AT THE END of the week I dressed up once again went to dinner at the China Club
    with my roving editor of The Raven, Simon Strick, who was based in Singapore but
    came over once a month to keep an eye on his contributors and stringers. He was
    an American of about sixty who had worked at The Washington Post in his younger
    years and was serving out his crepuscular ones managing The Raven, a widely read
    English-language online news site that he was wearily unable to love, despite
    it having hundreds of thousands of readers and having been a staple of the online
    news environment for close to a decade. Something in him longed for the days of
    clacking typewriters and tumblers of scotch. He had grown fat in Singapore drinking
    his way through upper-echelon whisky bars of the connoisseur variety (he could
    rarely be dragged from the Auld Alliance) and eating almost nightly at Odette.
    His clothes now rarely fit him. Yet we both got our suits at W. W. Chan in Hong
    Kong, which was how he also knew Jimmy, and he swore by the exact fittings at
    Kevin Seah in Singapore. When I would go to meet him at the China Club I would
    always find him alone by the restaurant’s top-floor windows with that disconsolate'
  - '[PAGE 105]


    atmosphere of men who are looking in life’s rear-view mirror while trying hard
    to keep their looks, which can only be done with clothes. But his suits, even
    though gleaming and well cut, were not flattering; his eyes explored every room
    for female attention but in return women looked right through him. Yet this dismal
    equation was not clear to him, as if in the end his fall from favour was a mystery.
    It was anything but.


    At the same time he had done well for himself financially. Backed by a shady Singapore
    billionaire, The Raven paid far more than The Washington Post. He was on his phone
    when I came in and yet the jazz quartet playing in that Shanghai 1930s room must
    have made his conversation impossible. Maybe he was pretending.


    ‘Adrian, I’m glad you’re still breathing.’ He got up for a moment, a little unsteady
    from a few drinks, and shook my hand. ‘Lovely to see you, my lad. How are your
    lungs?’ ‘Broken.’


    ‘Ah yes, I can hear – you’ve gone downhill. And what on earth is that on your
    face? Is it infectious?


    ‘Oh, that.’ I reached up to it reflexively as I always seemed to do whenever it
    got mentioned. ‘I was stung by an insect on a hike.’


    ‘Were you, now? My God, the insects they have here.’ He was earnest as he patted
    my shoulder. ‘Peking duck all right?’


    ‘Why not.’ He went on, ‘I’m staying at the Icon. It’s a hell of a place, completely
    empty. You can see all the riots from there. Maybe we should run a piece about
    hotel occupancy rates?’


    ‘Don’t ask me to write that one.’'
