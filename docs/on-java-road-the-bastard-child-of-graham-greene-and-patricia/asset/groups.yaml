    neglected to see a doctor. ‘It looks quite distinguished. An honourable wound.’
    She glanced over to see Jimmy still dancing hand-in-hand with Tom. He seemed indifferent
    to him. Instead of going back into the water we climbed a short way into the trees
    and into the din of insects, away from the boat and music. From a higher vantage
    point we were able to see Jimmy swimming around the anchor if we didn’t exist.
    This physical distance between him and us was novel, and I wondered if she liked
    it. It must have been accidental, even only unconsciously. We stood still in the
    heat for a while as the salt water evaporated off our skin. She looked away from
    me resolutely, and this gesture of evasion, determined by shyness, felt like its
    opposite. Vanity on my part, but I lapped it up in the moment. My skin began to
    prickle. I felt the air between us move with a quiet energy, sympathy on my part;
    curiosity on her. If only it was ten years ago and she was older, I thought I
    was better suited to her than Jimmy, I carried on thinking. We both saw through
    him, but couldn''t see through each other. She said, ‘He looks like a small child,
    doesn’t he? Lost among the friends.’


    ‘What else are they? I think we’re friends, too.’ ‘Well,’ I said, ‘that’s because
    we like friends.’ She admitted that this was true. ‘Except that I’m not,’ she
    went on. ‘I’ve always wondered about myself. I can’t say. If you’re someone’s
    friend do you consciously know it? He only thinks you’re a friend. But you aren’t
    really. That’s what I like about you: you’re not as sad as your friends think
    you are. You stand up for yourself without anyone noticing.’ Was that even possible?
    I thought. I said, ‘That’s a wild compliment.’


    When she finally did turn back to me, I thought that her eyes contained a glimmer
    of the thought I had about things being different if we had met earlier. An impossibility.
    Not for the imagination. Either way, it was some time before we felt any necessity
    to go back down, and during that twenty-minute interval I felt heady with that
    possibility which wouldn’t leave me alone. Isn’t uncommon, I suppose, that a person
    meets the one they should have met years before, precisely when it is too late.
    We talked about her political activities at long last, though I didn’t want to
    press on them. The last thing she needed was an inquisition. She hated communism
    even though in her own way she was on the left. She had thrown herself into it
    impetuously but coldly, as many of her friends at university had. They were galvanised
    by the Umbrella Movement back in 2014, which many of them felt had failed because
    they had been too polite and well-behaved. Now there was massive graffiti that
    proclaimed, addressing the Communist Party: ‘It was you who taught us that peaceful
    protest doesn’t work.’ That was her worldview in a sentence. Violence was coming
    either way, and they would be the victims of it. To say ‘If we burn, you burn’
    was thrilling for the moment but it probably wasn’t going to be true. They were
    going to burn and the government would not burn at all. They would thrive.


    When we went back down, the water was darker and more tumultuous. A wind had picked
    up from the south. Back on the boat we resumed the daylong cocktail hour and lay
    around the comatose state necessitated by the sun until Jimmy felt restless again
    and wanted to pull up anchor. He said he wanted ‘roam about a bit’ and sail around
    Waglan Lighthouse on the next island over. It must have been about three miles
    away. We didn’t have any thoughts about it either way and so we decided for it.
    On the way we threw baited lines from the deck, failing to catch anything, and
    I sensed Rebecca growing more distracted, just as she had at the meal at Duddell''s.
    My questions had likely nettled her and then had driven her to reflect upon what
    she had said to me by way of answers. Was I an interloper from the wrong generation
    who shouldn''t be trusted, even though she had said that she liked me?


