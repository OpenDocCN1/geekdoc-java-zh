    It was enough for them to keep an eye on him, to bring him under control with
    a bit of subtle blackmail, if that was what it was. Did I not see? That was always
    how they worked. The smear, discrediting of a reputation. It was a warning shot
    across his bows.


    ‘How has Melissa been taking it?’


    Shiftily, he glanced down at his nails as he always did when he felt that he was
    in a tightening spot.


    ‘Oh, it was a scene straight out of Gone With the Wind. Barns burning and all
    that. I just had to bear it and apologise and grovel. It was ghastly.’


    ‘Did she forgive you eventually?’


    ‘She degenerated into a frigid calm.’


    ‘It must have been a shock. Don’t tell me you were surprised?’


    ‘Surprised, no. Furious, yes.’


    ‘With you yourself?’


    ‘No. With that goddamn photographer! I was thinking, Adrian – I am sure you could
    find him if you looked hard enough. I mean, not just as a favour to me but as
    a favour to yourself. I’m surprised you haven’t taken some flak for it-ready.’


    ‘What do you mean?’


    ‘Your editor hasn’t mentioned it to you at all?’


    I shook my head as slowly as I could while wondering about that myself. It was
    a good point; Strick had not mentioned it thus far. For that matter Strick had
    been uncomcommonly silent with me of late, more silent than he had ever been in
    the past.'
  - '[PAGE 158]


    145


    I said, ‘As for the photographer, I suppose I could ask around. Someone might
    have heard something.’


    Then I wondered if I should tell him about the man I had seen that day and indeed
    afterwards at the hospital. I knew it would set Jimmy off on a paranoid toot but
    at least I would be coming clean with about what I knew. There would be a figure
    – a villain – he could fixate on. In the end, without much compunction, I told
    him that I had seen the man from the island outside the hospital where I was investigating
    the '' shot boy, and that I chased him through the streets around the hospital.
    Jimmy fixed me with wide-open eyes as I recounted the pursuit among the birdcages
    of Tung Choi. He was gripped. I related how I had followed the man until I had
    lost him among the crowds but that he had certainly been taking pictures at the
    hospital. It could be deduced, therefore, that he was part of the press corps
    in some way. But couldn’t I track him down by his face?


    > ‘Among hundreds of journalists?’


    > ‘You’ll see him again somewhere.’


    > ‘Perhaps yes, but who knows when.’


    His face tensed, and as I had seen once or twice before, a vein or nerve within
    it seemed to bulge to his right ear. He wanted to curse aloud but we were seated
    next to two hawkish old ladies whom he was convinced would recognise him from
    the papers.


    ‘You know what this means,’ he went on, his voice lowered, his cheeks reddening.
    ‘Not only do I have a family crisis but now I have the threat of blackmail potentially
    hanging over me.’'
  - '[PAGE 159]


    ‘Don’t tell me you have other women?’


    ‘Not really. But either way, that person is obviously stalking me. Don’t you think?
    How did he know to be on the island? You have to admit it’s a pretty towering
    coincidence. In fact, Adrian, I’ve been wondering something else. I know it sounds
    paranoid on my part, but what if Rebecca is in on it? It would explain a lot.
    I know it’s far-fetched, but what if?’


    ‘To what end?’


    He seemed flustered and a light sweat crystallised on his forehead.


    ‘Oh, I don’t know. It’s a stab in the dark. But what if she wanted to get back
    at me. You know?’


    I could see where he was coming from. Take down a high-society figure who is sleeping
    with a protest leader and make a political point by exposing his hypocrisy. Surprisingly,
    it was not nearly as illogical as I had first assumed. Yet that did not make it
    probable.


    ‘Get back at you for what?’ I asked, innocently.


    ‘I didn’t tell you, but she and I had a . . . well, I broke it off. I had to.
    It was before all this, obviously. But I could see it coming. There was no way
    we could keep it secret. She took it badly – worse than I thought she would. I
    didn’t think she would take it hard at all, to be honest. Think how young she
    is. Why would she take it hard? It’s *me* who should be taking it hard. And I
    am. But she made a scene.’


    ‘Where?’


    ‘It’s too stupid. At Soho House.’


    ‘You could at least have picked a tactful spot.’


    Jimmy grimaced.'
  - '[PAGE 160]


    147


    ‘And when was this?''

    I wanted to calculate at what point she had been verifiably alive, and Jimmy was
    deliberately vague, as if he didn’t want to say. All he admitted that they had
    gone to Soho House for dinner and he hadn’t planned to do it then. But the pressure
    got too much for him, he said. They were in the restaurant area. A lot of people
    noticed. ‘It was a royal fuck-up,’ he admitted.


    I said, ‘But they wouldn’t have known who you were necessarily.’


    ‘I’m sure some did. You never know in this town. The waiters came over and asked
    us if everything was all right. That’s never happened to me before.’ He was seething,
    reliving it all again.


    ‘I don’t believe a word of it.’

    ‘You know,’ he went on, as if what I said couldn’t possibly matter, you spend
    all this time with a woman and you think know who she is and what she is and why
    she is with you. But in the end you know nothing. Absolutely nothing.’


    He had looked into her eyes at that moment, he said, and saw nothing recognisable
    at all. Just a hostile emptiness. Naturally he understood it as the shock of an
    unpleasant moment. He could hardly have expected the scene to go entirely to plan.
    She had launched into recriminations, accusations, and the violence of the reaction
    had blindsided her. She told him that he was only doing it because he was afraid
    of his wife’s family. Which was true. But they were unwelcome observations nonetheless.
    She hadn’t tried at all to see it from'
  - '[PAGE 161]


    his point of view, Jimmy said pathetically. Yet he had remained quiet, and had
    tried to calm her. She wouldn’t have it it, though.


    ‘That’s an unfortunate scene for Soho House,’ I said.

    ‘It was a farce.’


    Something in his eye seemed to brighten for a moment.

    ‘So afterwards, when the pictures surfaced, I admit I did think it might be her.
    She might have planned it long before our break-up. But maybe it was for another
    reason altogether, I don’t know. I have to admit to you, if I’m being frank, that
    I think she’s capable of it. She could well have been filled with rage at me.
    I wouldn’t blame her, ever.’


    I didn’t buy it, but Jimmy seemed utterly convinced. He said that when they spent
    the night together she never slept. Messages kept lighting her phone up all night.
    He had a hunch that it was her fellow conspirators down in the streets. Maybe
    they wanted something from her, maybe she was even sleeping with him for an ulterior
    reason, as he had just suggested to me. Then, along these lines, something more
    had occurred to him. She was there with him purely to get money out of him for
    the cause, or to create a scandal that would make him amenable to them. Was it
    possible? he asked me directly, and I replied that I had no idea. In fact, as
    far as I was concerned, it was not true. His feverish ramblings about this theory
    felt put-on, as if he were carefully deflecting and leading me astray. And so,
    little by little, we began to enter new territory in our friendship. I could feel
    that it was a small game to Jimmy, and that he was sounding out my reactions by
    testing me and not divulging to what he really thought. He was lying, in other
    words, in order to play this game, and'
