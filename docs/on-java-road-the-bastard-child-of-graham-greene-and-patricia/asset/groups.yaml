    Mansions the air cleared and we went down Mody at a more relaxed pace. Spring
    Deer, supposedly a haunt of gangsters back in the day, was at the top of a narrow
    flight of stairs, and at one of its humdrum tables, surrounded by lush floral
    wall-paper, the physical majesty of the Australian was startlingly paired with
    the severe thinness of the bespectacled Bawa. Only ideology, the admiration for
    Mao''s state, I thought, could have brought them together so intimately and so
    ridiculously.


    One of the staff in a funereal black waistcoat had already brought the first bottle
    of red and the heat of the packed room seemed to draw me back to happier times
    – of all the lost-to-memory nights I had got drunk by myself at Spring Deer among
    the old-timers.


    WE ORDERED THREE PEKING DUCKS because the Australian insisted, and extra bulletins
