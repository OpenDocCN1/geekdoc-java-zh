    ‘YOU LOOK AS IF YOU HAVEN’T SLEPT IN DAYS,’ JIMMY said when we met three days
    later at the marina in Aberdeen. It was where he kept the smaller of his two yachts,
    a Tecnomar motor launch inherited from his uncle called Sweet Typhoon. ‘Is that
    the case, comrade?’


    ‘I’ve been sleeping non-stop since I last saw you.’


    ‘I’m relieved to hear it. You look like you don’t get enough sleep. I, on the
    other hand, get too much.’ He paused. ‘We’ll pick Rebecca up on the way. My skipper
    is ready. His name is Tom. Well, it’s not his actual name obviously but I call
    him Tom. Everyone in the family calls him Tom.’


    ‘On the way where?’


    We were already walking in hot sunshine towards the gangplank, the elegant white
    hull of the Tecnomar and the Chinese Tom all in whites with a brocade cap, standing
    there watching the newcomer.


    ‘Tom! Can we get this fool a screwdriver?’


    ‘Yes, sir.’


    The skipper moved out of the light and into the interior of walnut and brass where
    the bar was kept.'
