    ''I was sure it was him and so was the officer. He might have been lying, of course.
    But why would he lie to me?''


    I looked at Cunningham as if it was I who had been caught out and it must have
    been comical because Moyers couldn''t help a smile. Not knowing what to say, I
    blurted out something heavily predictable:


    ''Tang was there?''


    ''As I said,'' Bawa went on calmly, with an effect of ice in his voice. ''He came
    in and greeted the officers and seemed wrapped up in the situation that he didn''t
    see me.''


    ''Do you know him?'' Moyers asked.


    We were at university together. I''ve known him for over a quarter of a century.''


    Bawa nodded, indicating that he knew this already.


    ''Then maybe you know why he came down there,'' he said. ''I certainly don''t
    know. Do you think it''s possible that he might have known the dead girl?''


    ''That''s preposterous. Why would he?''


    ''I can''t say. He was there and they let him in. He seemed pretty tense.'' He
    paused. ''I don''t want to write a story about it, that''s what you''re thinking.
    Not at all. But it''s pretty interesting, don''t you think?''


    My first instinct was to protect Jimmy, so all I said was that it couldn''t have
    been him.


    ''But I''m sure it was.''


    My mind was racing ahead. How many women did Jimmy have in his orbit? Lovers,
    acolytes, favour-seekers, distant or proximate admirers, friends of the family.
    But Bawa then said that there had been no great scene of grief. Jimmy had spent'
  - '[PAGE 135]


    a minute inside the room and then exited calmly enough. His innate reserve must
    have come in useful if she had truly been an intimate of his.


    I said, ‘It’s odd more than anything. Did you find out the girl’s name?''


    ‘They wouldn’t say. I don’t think she was some poor local student. The fact that
    the Tangs were involved—’


    But not necessarily in the plural, I wanted to say.


    ‘Isn’t that the Jimmy Tang who races yachts?’ Moyers put in casually, although
    he knew exactly who it was and how many yachts he had raced. ‘Don’t call him Terrible
    Tang? And he came down to the morgue’


    I said I really had no idea. Terrible Tang. It was a name I’d heard applied to
    him, created in order to evoke his notorious womanising. Terrible Tang turns up
    to identify the body of a young woman – the soap opera wrote itself. But it could
    have been any number of girls now, that I thought about it more carefully, I had
    met only a handful of them. I filed through them mentally now, but rejecting at
    once the idea that it might be Rebecca. I had been with her the previous night
    and there had been no sign that anything was amiss. And surely there is always
    a sign. As for the others, I had seen a few of them at parties over the previous
    three or four years, invariably young and avid for advancement in the city’s suffocating
    social hierarchy. Now that I thought about them more carefully, scenes from the
    past resurfaced while I held my tongue. A face that flashed out of the dark one
    night at Pierre as Jimmy and his consort-of-the-night waved good night across
    a packed room in paper party hats; a gallery'
  - '[PAGE 136]


    opening somewhere in Central on a hot summer night, a woman introduced briefly
    by a name I couldn''t now recall, her face covered in glitter, seen again by chance
    a week later at a charity function at Belon, even more striking under the globe-shaped
    lamps.


    But who had she been? I didn''t follow Jimmy’s liaisons if they were breaking
    news and I rarely asked him about his private life. Bawa, however, didn''t know
    this and it was clear he was expecting a juicy tip from me, even one tossed out
    unknowingly by the unconscious.


    But I said, watching my every word, ‘I''m afraid I can''t give you a suggestion
    as to who the girl might be. Maybe it''s a high-society thing.


    By this I meant that people in that elevated and, to Bawa, enigmatic world had
    their own rules and made their own discreet arrangements with the authorities.


    He said, ‘Yes, it''s a high-society thing, all right. That much is obvious. You
    know that world much better than I do.’


    ‘Tang''s been up to no good,’ Moyers sighed as the Peking ducks arrived, borne
    out on castored carts by the ancient waiters. ‘That''s sure.’


    The showmanship carving was upon us. The opening of the bamboo baskets of steaming
    pancakes and the distribution of spring onions. Within a few seconds his remark
    had been left to one side and I was grateful not to have to make anything more
    of it. I could also sense a gloating desire to provoke me into saying something
    rash, which would be remembered for a long time and without benevolence.'
  - '[PAGE 137]


    124


    For among us there was always a nagging tension about larger things. I was seen
    to be pro-Western in my sympathies, whereas they had a much greater respect for
    China than say, for the United States. It was a matter of temperament. They believed
    in China as a superior idea whose time had come.


    They never told me what this idea really was, beyond a sentimental and intimidating
    idea of China herself: the beautiful suspension bridges, the majestic airports,
    the 65 million empty apartments, the electric taxis, the steel-production statistics,
    the salvation from poverty of 300 million souls, none of whom our intrepid journalists
    had ever met. You would have heard the same arguments for Germany at dinner parties
    in Surrey in 1938. The autobahns, the production figures, the workers'' holidays
    and free childcare, the generalised health care and the low crime rates: a nation
    speeding ahead of us on gleaming rails. I remembered reading about D. H. Lawrence
    walking through a German city in the late 1920s and tasting the strange electricity
    in the air, a palpable change of ions. But such an observation would never convince
    anyone of anything. And so against the Bawas and the Moyers and their belief in
    China''s supremacy there was no counter-argument I could make that they would
    ever accept. If you mentioned a mendacious Chinese trade practice they would cry,
    ''Confessions of an Economic Hitman!'' If you mentioned Xinjiang camps they would
    smirk, wave a hand and talk about Wounded Knee. The endless false equivalences,
    the shifting sands, the curious and obstinate state of self-enchanting.'
