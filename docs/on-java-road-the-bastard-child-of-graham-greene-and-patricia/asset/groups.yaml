  mdcn: '

    ……知道。否则，国家情报一直在监视我们。写这份文档的人描述了瑞贝卡死亡的经过：被围捕、带走审问、遭到袭击、下药、然后带到海口处理。这与我所怀疑的并不相似，但这里所有的细节无一遗全。作者描述了太平尸间的医生，这本是不可能的，我认出了王医生，那个曾慷慨收下我钱的人。接着是岛屿另一侧To家的内部，尽管我从未去过那里，但在这段描述中显得如此真实。那里有吉米，也有我。有石塘滩的Cococabana餐厅和赤角角的灯塔、Duddell''s楼上的房间、在岩石区游泳，以及吉米游艇的船长汤姆。瑞贝卡可能向某个信赖者透露了这一切，尽管内容异常完整，完整得令人难以置信。我想起了我们在乘船途中在岩石上时的谈话。吉米叫道：“你们长得像海豹——长了脑子还晒了太阳的海豹。”一个不在现场的人怎么可能记得这种细节？尽管如此，我还是回想起：那天晚上Duddell''s里的那个女孩，尽管我不记得她的名字。是Kerry某人。接着那个名字浮现在我脑海中，Kerry慧。瑞贝卡向她讲述这一切并非不可能，甚至包括吉米那些愚蠢的笑话。


    有人在场边、在阴影中静静观察，这十页纸可能是我发出的一封瓶中信。它们对我个人也是一份礼物。然而，还有另一种可能：她的某个同伴匿名发给我的。就此而言，这个人也可能是写作者。这可能是某个知道发生了什么，并希望我将其传给更广泛的世界，通过发送邮件来催促。这隐含地许可我使用这段叙述并作为内幕消息发表，类似于战时占领期间的地下宣传技巧。我所考虑的这篇文章骨架瞬间成型：我可以直接发送并发表，无需任何修饰。在读者眼里它是虚构的，但它也会被视为事实——这将我版本的《黄台瓜》。这最终是我向斯特兰克德提出的提议。我将邮件原封不动发给了他，问他的意见，他的回复指出了一个显而易见的问题：邮件中被描述为与女孩死亡同谋的阴暗无名男性情人，很可能是，甚至很有可能就是吉米唐。如果他得出了这个结论，那么其他人也是如此。


    对此，我回复说，我可以写一篇暗示非自然死亡的文章，其中吉米参与了同谋，正正如邮件所暗示的那样，尽管显然我不知道具体如何以及为什么，我会把这种联系留给读者去建立。这并不完全是斯特兰克德所预期的。但它将是一个政治声明。我将通过一个指控显言易色地出卖一个老朋友，指控一切都是道言和怀疑——这正是新秩序所主导的思维模式。背后没有任何证据，因为我们不再生活在一个有证据的世界里。它将是
    *samizdat*——苏联时期的地下抵抗文学——一个意为“自出版”的词。


    （注：后续重复内容已根据文档工程原则进行去重处理）

