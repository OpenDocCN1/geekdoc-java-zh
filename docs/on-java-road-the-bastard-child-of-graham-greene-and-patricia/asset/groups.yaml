    A LITTLE BEFORE ONE O''CLOCK Jimmy walked me back down to the lobby where the
    doorman I had seen before was fast asleep in front of his monitor. We stood together
    in the cool of the forest waiting for his driver and finishing the damp stubs
    of the once-noble Cohibas. In his Dugdale suit, still only slightly rumpled from
    the evening''s frivolities, Jimmy looked like a figure from the very decade in
    which the Borrett Mansions had been built. A ghost suddenly emerging into the
    age of electrical light, an anachronism that was not quite an anachronism. It
    was then that I remembered how, when we were students, he had always reminded
    me of the Arrow Collar Man, that slick-of-hair icon of male beauty invented by
    the American illustrator J. C. Leyendecker for The Saturday Evening Post in the
    1920s. Elegant and idealised models for Interwoven socks, Cluett shirts and course
    of the famous Arrow Collars. ‘Ephemera’ that glowed from a distance, not quite
    real in the drab light of common sense and yet far more real than photographs.


    He finished his stub and instead of tossing it into the nearby ficus roots darted
    back to the door and crushed it into the sand ashtray standing next to it.

    His driver swept us out of the farewell handshake, only the welcome kind. I rode
    down to Kennedy Road and then was borne mindlessly towards the deep-set gloom
    of Wan Chai Park, the Queen Elizabeth Stadium and the Dorset, which I had passed
    the previous day. The streets were filled with little stones like the aftermath
    of a volcanic eruption. For some reason we went down Yee Wo Wo'
  - '[PAGE 46]


    Street: elsewhere were events that had to be avoided. Around Victoria Park morose
    crowds were beginning to part and go their own ways, and along a wall I saw new
    graffiti in Chinese that read, ‘In this life only marry a front-liner.’ It was
    a delicious sign that Phoenix would never stay with Jimmy Tang, not for ever in
    in any case.


    ALL THIS WAS RUNNING through my mind the following night as I was seated at a
    bar called the Old Man in Central. All the previous twenty-four hours I had been
    feeling increasingly anxious, aware that I was becoming less and less invisible
    in the city as my outward appearance as a foreigner – as a European – began to
    take on new and dangerous meanings.


    As I came down onto the street after six brandies I saw a lout standing at the
    corner of Staunton across from Fat Choy, holding himself up against the wall of
    steeply pitched Aberdeen Street, a man in the telltale white shirt of pro-Beijing
    street-gang types and emerald satin knickerbockers. He in turn caught sight of
    me as I waited for my car. He was holding an empty bottle of Jack Daniel’s and,
    as not knowing what else to do with it, lobbed it across the street at both me
    and my fading sharkskin suit. It smashed against the kerb and tiny particles of
    glass landed upon the fabric of my sleeves and trousers. There was no one on the
    corner, but you could tell a crowd had just passed and people had been battered;
    he himself had a bloody nose. He looked as if he had drunk that bottle of Jack
    Daniel’s all by himself. The neck didn’t smash for some reason and rolled away
    down'
  - '[PAGE 47]


    Aberdeen, gathering speed while the man raised a fist and called me gaat zaat,
    a cockroach. I wasn''t wearing any items of clothing normally associated with
    the protestors, such as a black shirt, so it must have been a drunken generalisation,
    I thought, spat out indiscriminately.


    Gaat zaat in Cantonese had acquired a particular context during those sweltering
    summer weeks but I Hadn''t thought it would ever be used against me, not even
    by the counterprotestors in white shirts who until then had seemed shy with suited
    foreigners. They hated us and sometimes cried ''CIA'' as I walked by, but only
    when I was in combat gear. ''CIA'' in Mandarin sounded almost poetic: zhongyang
    qingbaoju. This was one out for more blood and he came hunting me, crossing the
    junction towards a small roadway near Beer Fish. Staggering a little, his eyes
    bloodshot, he called me a cockroach again and spat on the ground while at the
    far end of Staunton I saw my taxi coming to save me. He was already snarling with
    a certain amount of melody: Diu lao mu—


    Before the car reached me, he had swung a wide punch and caught me on the right
    cheek, but not with enough force to knock me over. It was a weakling''s punch.
    ''Easy, easy,'' was all I managed to say, and swore at him in French in a desperate
    attempt to put him off. I believe I called him a lover of prostitutes. He came
    at me again, displeased with a foreign expression, and it was the opened door
    of the taxi rescued me from a second attempt on his part. I dived in and slammed
    the door behind me, more astonished than anything else. I wasn''t hurt, but I
    was insulted. And worse than being insulted, I had been taken unawares and by
    surprise.


    In the back seat I noticed the driver looking me over in his'
  - '[PAGE 48]


    rear-view mirror, mildly entertained, as a pinprick of blood had landed on the
    white front of my shirt and sat there like a mortified ladybird. I wondered if
    it was his blood or mine, and so I raised a finger to my cheek and discovered
    that it was indeed split and bleeding. I had to use my Tie Your Tie pocket square
    to staunch it, thus staining it translucent yellow butterflies.


    I swore out loud and for a while forgot where I was going. The stunned feeling
    of being jumped, however incompetently, obliterated all else for a good ten minutes.


    ‘Gaat zaat,’ the driver said to me, grinning knowingly in the mirror. ‘Him, not
    you. Too short ride this time, but I’ll take you away.’


    He had saved me. Foxglove was on the ground floor of an apartment block off Queen’s
    Road Central and had a secret door marked by a basket filled with umbrellas. It
    was an overnight place with jazz, which only a man as tedious as Cunningham could
    have suggested, a typical journalist’s idea of a raff spot. Who wants jazz after
    a scrap with a thug? I thought glumly. Somewhere along Queen’s Road Central, in
    case, I got the driver to stop and decided to walk up to Foxglove. By the time
    I had found the building on Ice House Street with its low display windows at street
    level, filled with gold and silver cane handles in the shapes of duck and cat
    heads, my cheek had dried out from another age. Established 1868. Handmade. Repairs.


    I looked at myself in the glass displays of the cryptic vestibule – yet more silver
    cane heads – and saw in the compromised reflection that I now had an ugly wound
    and that it didn’t give my face much extra character. That foul triad'
  - '[PAGE 49]


    member, if indeed he was one, had ruined my week and not just my evening. I should
    have told him that yes, I was CIA and that I carried legal firepower. Nonetheless
    I calmed myself and strode to the basket of umbrellas. I knew already that one
    had to play a little game with them. You had to push the handles down until you
    got the right one; having tried four of them, then, the fifth one caused something
    to click behind the wall of mirrors and the whole wall sprang to life and moved
    sideways. I stepped into a pitch-dark bar with a bandstand and a quartet playing
    Brubeck numbers.


    One move inside and the wall slid back into place. The place was full and at the
    bar Charles Cunningham was installed with his sickly Cointreau among women too
    young to notice him. He was in the custom-made safari jacket that he always wore
    throughout the unbearable summers, probably some piece of garbage from Sam’s Tailor,
    where he had gone because he had seen Anthony Bourdain get a suit made there.
    The pockets filled with quinine pills and the sweat clinging to his face had not
    dried because the rolls of fat that covered his neck were ample defence against
    the strongest air-conditioning.


    ‘There you are,’ he said, barely raising a hand to shake mine. ‘I thought you
    were coming from the Old Man.’


    His hand was clammy and I dropped it as soon as I could.

    ‘I was, Cunningham, but I got attacked. A triad member threw a punch at me outside
    Fat Choy.’


    ‘Oh? Was there any particular reason?’

    ‘Who knows. Maybe he was just drunk and in a bad mood.’'
