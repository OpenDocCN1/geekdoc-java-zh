    # TWO


    THE TANGS LIVING BELOW MAGAZINE GAP ROAD IN THE Mid-Levels in a building called
    Borrett Mansions. These fortress-like luxury tower blocks stood at the end of
    a narrow lane called Bowen Road, which burrowed through tropical forest crowded
    with creeper vines and ficus roots as it rose towards the rusticated walls of
    the Mansions. Here, on the ground floor of which were surprisingly modest Art
    Decystyle lobbies, it felt as if time had stood still since about 1970. Raised
    high above the city, the air around the Mansions smelled of moss and wet bark,
    and a mountain chill touched my face as soon as I got out of the car. It had rained
    just an hour before. The hillside of ferns and creepers around me dripped quietly
    as I walked across the back entrance lane to the lobby that served their apartment
    on the fifteenth floor.


