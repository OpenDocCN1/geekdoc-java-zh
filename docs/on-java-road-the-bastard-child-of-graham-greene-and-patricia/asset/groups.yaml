    \ already in place that was worthy of Jimmy’s exacting tastes. The woman glanced\
    \ up and saw me first but without knowing who I was; a slightly quizzical disappointment\
    \ crossed her face, but with a certainty that I was the one they were waiting\
    \ for. She was self-contained in a way, neat long hair, and an asymmetrical face\
    \ that would age in an interesting way. She was dressed in T-shirt and jeans but\
    \ quietly on point; you would notice even in passing. She said something to Jimmy\
    \ and he half turned towards me. Dressed in a W. Bill summer suit and a white\
    \ linen Calabrese scarf with paisley patterns, he had his back to the blind-dimmed\
    \ windows, and as always he was a little too conspicuous. Obviously his guest\
    \ was letting-herself be plied with André Beaufort champagne.\n\n‘Oh, there you\
    \ are,’ Jimmy said in Cantonese, confirming that impression. I saw that my place\
    \ was already set, and as I moved to sit down a waiter materialised to fill my\
    \ glass.\n\nI said, ‘I definitely need that.’\n\n‘Adrian, this is Rebecca. Rebecca,\
    \ this is Adrian. Now we’ll-move to English because Adrian’s Chinese is a bit\
    \ iffy.’\n\nHe was right, but it wasn't as if I couldn't hold a pretty decent\
    \ conversation at speed. I shrugged at her and she seemed to understand that I\
    \ was the shy sort and that she could give me some slack.\n\n‘I thought you said\
    \ he reads Chinese poetry.’\n\nAs Jimmy winked at her eyes fell upon me and-something\
    \ inside gave way, stepping backwards into the wings and ceding territory. Her\
    \ gaze had a shimmering heat. And so we switched to English, which was a shame,\
    \ I thought in the moment, since Chinese might have suited our threesome better.\n\
    \n‘Pleased to meet you,’ Rebecca said, shaking my hand. Her English appeared to\
    \ be perfect.\n\nFrom a good family, I thought to myself, and I knew the type.\
    \ But which family? Jimmy used the city as his oyster without ever drawing attention\
    \ to the fact. She went on, \n‘What is that gash on your cheek?’\n‘Attacked by\
    \ a bottle.’\n‘A bottle? With a human attached to it?’\nI told the story, wearily.\
    \ Myself, bottle, lout – the whole sorry interaction. Jimmy found it coldly amusing.\n\
    ‘Sorry to hear it, comrade. Was there a war of words first?’\n‘None.’ I really\
    \ didn’t want to get into it, so I glossed over the exchange.\n‘Straight out of\
    \ the blue, eh? If you want me to have him rubbed out, just say the word.’\n‘You’d\
    \ never find him.’\n‘Likely not.’ He grinned. ‘La vie en merde, but what can we\
