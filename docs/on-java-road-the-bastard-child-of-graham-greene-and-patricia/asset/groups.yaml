    It’s cruel to say but I suppose it’s hard to deny the truth. Everyone’s abroad.
    Soon it’ll just be us.’ He puffed on his cigar. ‘It wouldn’t be so bad. I wouldn’t
    mind it at all, as a matter of fact. Shall we finish the Montille – I kept some
    of it aside from the Visigoths.’


    He asked one of the maids to bring two new glasses and we finished the cigars
    before dipping in. It was wine heresy, the smoke ruining the mouth, but he wanted
    to finish the bottle that night. During the course of the evening something had
    got to him. Sometimes, in the course of our long friendship, I was the person
    he would come to when he wanted to get something off his chest, and this was occasionally
    true of matters concerning his tortuous love life. Such was the case now.


    ‘There’s a wonderful woman I want you to meet.’ His tone shifted and I could tell
    him he was tiptoing towards a delicate subject. ‘Her name is Rebecca Tso. She’s
    a student, and yes, I know you’ll judge me about that, but sometimes that’s the
    way things turn out. Don’t be judgemental. Anyway, I invited her out on the yacht
    and she came along. Seems she’s some sort of literature student, though course
    now they’re all on strike. At first I thought we’d have nothing in common – she’s
    much more political than me and a bit fierce with the student movement. But I
    got past that. When I met her I was struck by the famous lightning stroke of the
    heart, the pure electricity smacking you in the chest. You know how that is. You
    feel like you’re about to have a stroke. Anyway, I’d like you to meet her. There’s
    something about her.’


    So, I thought, Melissa’s hunch had been unerringly correct.


    I said, ‘How old is she? Twenty-one or something?’


    ‘Twenty-three, actually. She’s a year or two behind.’ He glanced down at his nails
    for a moment. ‘I didn’t say anything dramatic happened. I just had her out to
    dinner. I’m supposed to meet her on Thursday night – I think you should come with
    us. Melissa will be at a charity ball in Macao.’


    ‘This Thursday night?’


    ‘Don’t be stiff about it, Adriano.’ That’s what he always called me when he wanted
    something. ‘Don’t tell me you’re going to be at home writing your memoirs. You’re
    just going to waste your time propping up a bar and sitting in front of your TV.
    Come with us to Duddell’s.’


    ‘You want a second opinion, is that it?’


    Sheepishly, he avoided eye for a moment.


    ‘Maybe I’m infatuated. It happens at our age. Pathetic, I know. But not entirely
    pathetic.’


    ‘Delusional, perhaps?’


    ‘Yes, a bit of that. I don’t mind being delusional rather than pathetic. There
    are worse things to be. It depends on what you are delusional about, don’t you
    think?’


    ‘Delusions serving some noble end, you mean? Like chasing after students?’


    He smiled grimly. ‘You’ve got me there. But all the same – so what? So what if
    we delude ourselves with girls who are too young to love us back? They’re just
    as cruel as we are. Everyone is selfish, and if you think about it, we can’t be
    otherwise. Why make a fuss about it? We’re all going to die a few years from now
    – and you and I will. I’m philosophical about it, they say. Besides, I’m not going
    to lose my head over her.’


    Isn’t being infatuated losing your head? I was irritating him and enjoying the
    effect.


    Yes, but there are different ways of losing one’s head. Anyway, we don’t have
    any control over these things. Coups de foudre and all that. If I’m smitten, I’m
    smitten. I have been smote. I just want you to throw some cold water in my face
    if it’s needed. I didn’t get the impression that she’s the gold-digger sort.


    Then I asked him offhandedly about her name. Wasn’t Rebecca rather unusual as
    a first name? But then I remembered another Rebecca in Hong Kong society, a friend
    of the Cantopop singer and actor Leslie Cheung whose last name I couldn’t recall.
    I remembered Cheung, that great gay icon of my youth, the androgynous star of
    Days of Wild because after committed suicide by jumping off the twenty-fourth
    floor of the Mandarin Oriental in 2003 his wake taken at the eastern end of Java
    Road, where, as I say, all the parlours lay. A curious chain of associations.
    All right, I said, ‘I’ll be there. Thursday night. But my brutal honesty will
    cost you dinner and whatever bottle I want. Deal! You know, Adrian, life is unbearable
    not because it’s a tragedy but because it’s a romance – who said that? I couldn’t
    remember. And this is a romance. Though I have to admit that far it’s anything
    but unbearable.


    There was one other thing, however. She’s going out every night to the protests.
    We meet afterwards, and she smells of tear gas. I admit rather like it. It’s as
    close as I’ll ever get to the front line.’ I blew out my mouthful of smoke and
    told him that was a pretty stupid thing to say, but I didn’t repeat it. ‘It may
    be stupid, Adrian, but it’s certainly true.’


    At that very moment, I had to admit, what it was like to be in bed drenched in
    phenophenone, the chemical used in tear gas. That odour was ubiquitous during
    those days and nights; it rolled down the large avenues from the late afternoon
    onwards, set a faint and sour aroma in my own apartment, where it penetrated the
    permanently closed windows. ‘Tell me,’ he said, ‘do you think she’s on a suicide
    mission? It’s what I tell her. It’s like a collective frenzy, an ecstasy. I’ve
    become more and more interested in it. I’d never go myself, obviously, but I’m
    fascinated by the anarchy. I felt the same, though there was no need to say. It
    was a phenomenon of youth, and both of us knew it because in some way were both
    excluded from it by our age. We could sympathise but couldn’t go down into the
    streets and throw rocks. Or perhaps that’s what we told ourselves to justify our
    inertia. I said, ‘There’s a kind of madness in the air which no one understands.
    It’s generational, isn’t it?’


    Isn’t it always? Like the late ‘60s. Overnight, everything disintegrates for the
    middle-aged.’ There was something else, he went on. He had lied about meeting
    her. She was from old money and their families knew each other. ''There,’ he groaned,
    ''it’s all out in the open.'' I laughed and told him how ridiculous he was. As
    if that could have hidden. The maids had by now melted away and we were alone
    at the edge of a vast urban landscape filled with electrical ghosts, the light
    show of Hong Kong night. From down in the city came the persistent cries from
    the high-rises of people shouting choruses of defiance as they had for an hour,
    a sound that had become more animal despite the words we could clearly hear. It
    echoed from building to building in a chain that might have encompassed the whole
    city in a few minutes. Jimmy was seemingly unmoved. He was merely curious as to
    why they were doing it. This must be a form of auditory semaphore bearing coded
    messages aimed at them, the rich and lofty in their hillside castles. Even I told
    him that this was not the case, he refused to believe me and continued to catch
    the words that echoed across the ether. One of those words, undoubtedly, was liberate,
    as in liberate Hong Kong. Gwong fuk heung gong. It was a phrase invented by the
    activist Edward Leung. He had also coined the phrase ‘innovation for our generation,’
    and later ‘revolution of our time.’ Si doi gak ming. But in fact it was the first
    time that summer I had heard ‘revolution of our time’. For Jimmy, needless to
    say, it was proof that they were delusional and had no sense of material realities,
    since a revolution was never going to happen in a thousand years. He offered me
    the end of the magnum and said as much we finished it, though I had to guess whether
    his new lover was included in the generalization. He was a man who, deep down,
    believed that words came dearly to most people and so constituted a deadly coinage.
    To him, ‘revolution’, *gak ming*, was the cheapest of the cheap especially in
    English, a word worthy of John Lennon and Patty Hearst. But just because it was
    being shouted from a high-rise at midnight by teenagers didn’t mean that it was
    entirely debased – or that it was even used at all by people like Rebecca.


    ‘By the way,’ I asked, ‘what is her Chinese name?’ Luan Feng. You know what it
    means?’ ‘Phoenix.’ It was a traditional name with a strong whiff of nobility.
    Li Bai himself used it, since for him the phoenix itself was a time-honoured symbol
    of integrity just as it had been for Zhuangzi and the early Taoists. He admired
    the bird’s freedom-unrestricted movement. A few images came back to me, the phoenix
    of Li Bai dwelling near the edge of a waterfall at dawn. ‘As for me, I am *Ah
    di le an*, as your people call me, and that means nothing to anyone. It doesn’t
    even sound like Adrian. And you are? I never found out.’ ‘I’m not telling you,
