  - '[PAGE 205]


    The meeting with them that I had been dread finally came about, though not because
    of any initiative on my part. It was just a normal afternoon as I was walking
    down Java Road when I felt over my shoulder a car shadowing me at a crawl and
    I realised the To clan had finally found me. It all happened as smoothly and unremarkably
    as a random encounter in the street, which it was not. My only surprise was not
    that they had tried to find me, and succeeded, but that they had taken so long
    to do so.'
  - '[PAGE 206]


    # ELEVEN


    HE CAR STOPPED JUST AHEAD OF ME AND A DRIVER IN full uniform jumped out with surprising
    friendliness and announced his master''s name. Would I mind taking a short drive
    with Mr To, since he would greatly appreciate a conversation with me, if I didn''t
    mind? After a moment''s alarm, I consented. Despite my shock I was in fact eager
    to talk to him. He was enthroned in the back seat of his ancient black Daimler
    with tinted windows, dressed in a plum corduroy suit and matching suede loafers
    with long black Bresciani socks. He apologised for having followed me, then shook
    my hand with a strange withered smile and asked the driver to lock the doors.
    For our security, his tone seemed to imply.


    ‘Shall we drive around, Mr Gyle? I can let you out whenever you like. I have some
    whisky in the car,’ he said, pointing to a small walnut cabinet set into the partition
    before us. Its door was spring-loaded and formed a tray with tumbler holders when
    opened. ‘What happened to your face?’


    By now I had almost forgotten my wound, as if it had happened long ago, in another
    century. Reflexively, I reached up'
  - '[PAGE 207]


    194


    to touch it, assuring myself that it was still there and had not

    healed.


    ‘Oh, this. I hit a door.’


    ‘Good for you. At least you don’t get into fights like some

    people I know. Do you take ice in your poison?’


    ‘One cube.’


    We drove out towards the Chai Wan Gap and To asked me

    tell him a bit about myself. I seemed to know a lot of well-

    connected people in Hong Kong. Was it a scheme of mine?


    ‘To do what?’


    ‘You journalists – you get around. I suppose you know all

    about the To family.’ We were in sight of the moonlit sea and

    he pointed at the shadowy land mass on the far side, the

    mountains, which always look improbably unattainable and

    distant, and I wondered if he actually remembered we

    had almost met that night at the China Club. The night I had

    walked through the park with his daughter.


    ‘We came from over there, like everyone. My grandfather

    was a black marketeer. It wasn’t so long ago. We were friends

    with the British, though. Are you a homesick type or a life-

    time expat type?’


    ‘I’m an immigrant, so the latter.’


    ‘So we’re both immigrants in a way. Immigrants or em-

    grants. You strike me as more of an exile. The voluntary

    kind. It’s a happy destiny in some ways. I always say it could

    have been worse. One could have been left behind.’


    I asked him if he wanted to talk to me about Rebecca

    since, I added, he must have seen the photographs of me with

    her and Jimmy.


    ‘Photos?’'
  - '[PAGE 208]


    ''Am I wrong to say that?''


    He looked cold and stricken but he did not seem hostile to me. On the contrary,
    it seemed he had persuaded himself that I had nothing to do with her death. No,
    he admitted, it was not wrong.


    I said I was sorry, more sorry than I could say over a tumbler of whisky in a
    moving car.


    ''She might,'' I said, ''have been in the wrong place at the wrong time.''


    My words were rational enough but his face had become tortured and dark, the lips
    running away with themselves a little, as if they couldn''t catch up with the
    thoughts moving through his mind.


    ''Isn''t that what they always say? But it was a curious day, the day that she
    disappeared. The thunderstorm.''


    ''What day was that?''


    ''I think,'' he said, ''that you remember that as well as I do. We both know.''


    It was a curious thing to say, I thought.


    The night I saw you all together at the China Club? I suggested, as delicately
    as I could, that it was possible that I had seen her with them at the China Club
    on the night in question. Was I mistaken?


    ''The China Club?''


    He was genuinely taken aback, and denied being there with Rebecca.


    ''But,'' I said, ''you were at the China Club?''


    ''What do you mean? We go there almost every night.''


    ''Ah, I see. But when were you last there with Rebecca?''


    His look grew more perplexed.'
  - '[PAGE 209]


    ‘We’ve never eaten there with her. She detests the place.’

    I stayed calm and tried to jog his memory.


    ‘It must have been an occasion that’s slipped your mind,’

    I tried. ‘You can recall it if you try—’


    I recall everything, Mr Gyle. My wife and I eat there to be

    alone. We don’t dine with friends. Rebecca, not at all.

    As I say, we’ve never once eaten with her there except a

    Christmas dinner three years ago. Now, that I do remember.’


    ‘I-I must have been mistaken,’ I stammered.

    ‘You were there?’


    ‘I go there often enough. I’m a member.

    I’ve never seen you there. But may I ask, how did you

    know it was us in the dining room? We’ve never been intro-

    duced.’


    Yet my mind was racing backwards in time, to the gimlets,

    the shine of her skin, her lipstick left no mark on the

    rim of her glass. I had seen them all together, I was certain of

    it. I had taken Rebecca’s hand for a moment as we stood up

    the bar and it had been as real as nightmares ever are.

    Everything had seemed solid and brilliant – enlivening,

    even – and yet all those physical things might not have been

    real at all. Had I even there the way that I thought I

    been? How real had the walk in the park been, the taxi

    ride up the mountain in the dark?


    ‘In any case,’ To went on, to move the conversation

    away from the China Club, ‘I’ve been meaning to have this

    talk with you, Gyle. I know very well that you and Rebecca

    were friends, and the three of you were on yacht to-

    gether. I found out, too, that Jimmy Tang is an old friend of

    yours. In the light of that, I wondered – we wondered, my'
  - '[PAGE 210]


    wife and I – if you had anything to tell us about our dau-ter’s death. Or else
    if you know they were having an affair.’


    ‘I know that Jimmy Tang went to the morgue. And yes, they were having an affair.’


    ‘Are you sure about both of those things?''


    I said as sure as I could be. His hands tensed as if they were were pulling at
    a mental rope and his eyes turned venomous.


    ‘That vermin. That leper.’


    He seemed to be responding to both pieces of information at the same time. I pressed
    me about their relationship and I told him what I knew, which was a fair amount.


    ‘Rebecca and I were not close friends. Still – I feel I ought to tell you that.
    In case you thought I was holding it back.’


    ‘We have the gravest suspicions about Mr Tang, I must tell you. And he has been
    behaving strangely. He hasn’t come to see us. He won’t even admit he was involved
    with her. He’s a coward, isn’t he?’


    Aren’t we all? I thought.


    ‘He’s running from something,’ I said. ‘He’s afraid.’ To then relaxed his hands
    and a more resigned mood appeared to come over him. It was useless to keep talking
    about the slippery Jimmy. He said he had been feeling the presence of his daughter
    over the preceding nights; he could not sleep and the great trees around their
    house seemed unusually disturbed by winds. The security lights kept coming on
    for no reason, the chains at the gate rattled. His wife told him that Rebecca’s
    spirit was near them, she could feel it, too, and was certain of it. She was stalking
    the house and letting them know that she was there.'
  - '[PAGE 211]


    Did I believe in ghosts, he asked. I said I wasn’t sure how much I believed in
    them.’ ‘Ah,’ he sighed, ‘you’re not Chinese.’ For them, he said, it was quite
    otherwise. Then he asked me if I thought his wife was well advised to seek out
    the medium she liked to visit in order to talk to her ancestors. I said that I
    couldn’t offer an opinion on that either or perhaps it had an alleviating effect
    on her emotionally.


    ‘Do you believe in it?’ he said.


    ‘In mediums? Not at all. Do you?’


    He was already looking placidly through his tinted window.


    ‘Of course I do. What do you think?’


    He meant that for him such things were not a matter of conjecture. They were as
    real as cement walls. But I wonder if Jimmy does? I thought to myself.


    ‘Where do you stand on that, Mr Gyle?’


    I said I stood on the side of science, of course, but that science didn’t know
    everything.


    ‘But in any case,’ he said, ‘who thinks about science when they’re mourning?’


