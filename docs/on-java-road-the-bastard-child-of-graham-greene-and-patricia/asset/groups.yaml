    when we had studied together at Clare College, Cambridge, and, among other things,
    had worked together in our spare time on a translation of Li Po’s ‘The Exile’s
    Letter’. It was one of the most famous Chinese poems of the Tang period, perhaps
    the most famous, erratically translated by Ezra Pound, and our desire to embark
    on a new version was inspired by the fact that Pound himself had not been able
    to speak a word of Chinese. We found this amusing, if not preposterous. He had
    merely used the notes of the American scholar Fenollosa. And yet, Jimmy used to
    say, his interpretations were almost as haunting as the original. Beyond that,
    his translations of Li Po had introduced Chinese poetry to Western readers for
    the first time. How could it be? Pound, however, invented the title for English-readers,
    as well as turning the poet’s correct name – Li Bai into ‘Li Po’. The original
    was ‘Remembering Our Excursion in the Past: A Letter Sent to Commissary Yen of
    Ch’ao County’.


