    as free as he pretended to be. And shortly after my visit to the morgue, indeed
    only a day later, that same society discovered why Jimmy had gone to ground in
    the first place. The headlines were typically incriminating, and I quickly came
    across one that summed them up: ‘Society Darling Known as Terrible Tang Seen on
    Yacht with Beautiful “friend”. An Affair?’ Photographs began to appear everywhere
    of Jimmy and Rebecca together.


    The story was broken by the tabloid Apple Daily, which was owned by the anti-government
    garment industry magnate Jimmy Lai. Did not all remember why Lai had named his
    paper thus? “If Adam and Eve, he is said to have stated, did not eat of the forbidden
    apple, would there be any evil and any news?” On its news site, the gossip about
    Jimmy Tang lit up the city. Even among the usual buffet of celebrity scandals,
    gangster tales, gambling news, semi-fabrications about sensational suicides, grisly
    traffic accidents and financial crimes flared like a garish comet across the city’s
    consciousness.


    But there was something else. I instantly recognised the setting of the images.
    It was the island where we had moored together on Jimmy’s yacht. And in some of
    those shots I could also see myself, the obscure unnamed hack whom only a few
    people would recognise or comment upon, one of whom might certainly include Jimmy’s
    wife, Melissa. It meant that in her eyes I was now fingered as an accomplice to
    a bit of light-hearted adultery, just as she had expected of me only a few weeks
    before.


    That, then, was one family whose threshold I could no longer cross. It was a disappointment,
    admittedly, but at the same time it provided a simple explanation for Jimmy’s
    disappearance. He had been caught in the midst of an indiscretion and there was
    no more to it that. For a while, the realisation calmed me. It was a mere flap
    over an affair. He was embarrassed, that was all. Rebecca, too, I imagined. Two
    displeased families. It wasn’t the end of the world, and people in their society
    would snigger for a week or two and then forget about it. Such things came and
    went all the time.


    I let Jimmy and Rebecca disappear as they wished and returned to my own life,
    which had become more ungrounded as the days went by. It was as if my employer
    was quite happy to put me out to pasture for a while, regardless of what he had
    said to my face. A week went by, then, and as I had expected, the scandal faded
    a little, eclipsed by others. Scandals, after all, are ten a penny in this city;
    they come in a constant flow. The most recent one instantly effaces the one preceding
    it. Yet Jimmy’s momentary disgrace didn’t vanish altogether. People talk, as if
    their tongues had a life of their own. I heard whispers of it around me sometimes
    at the journalists’ bars, at the FCC among the scribes of the night, at the Old
    Man, where I had returned in spite of my anxiety about the place. Terrible Tang
    and his fling. It was remarkable that no one had yet asked me why I had been on
    the yacht that day. I assumed at first that they didn’t want to say anything to
    my face even if they had known it was me, but it was equally possible that I simply
    never crossed anyone for my existence in a compromising photograph was not difficult
    to discern. A ghost in other people’s machines. They had seen me and I had not
    registered as anyone whose identity was worth investigating. In its way it let
    me off the hook. Yet Jimmy never called me back. He had gone to ground and even
    for him I was now non-existent. I had slipped, in his mind, into a different dimension.


