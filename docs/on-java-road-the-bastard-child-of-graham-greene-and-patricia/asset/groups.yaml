    他们设设法潜入了各个太平尸房的机密冷冻室。这种对影像的买卖每天都在进行。警方方面对此沉默不发；很少有调查。于是，坊言巷中对此议论纷纷。据传闻，那些女孩因为暴乱在街上被抓走，被强奸后被处决。没人能说这是否属实，方面的证据都没有。但也有数百名中年男子在废弃空地、空空车库和单间公寓里被发现，肉体破损，断腿扭曲。那些没有人相信是“自杀”。这就是为什么巴瓦（Bawa）用他那独特的方式，在尸房里搜寻尸体。并不是因为想公开它们，而是因为他想把它们解释为无辜死亡。他这么做的动机是双刃剑：从情感上来说，他站在政府一边，但他作为记者的职业让他与他们建立联系是有利可图的。他是他们的朋友，并相信他们的荣誉。


    我想，当他听到成百上千的人对着他崇仰的警察高喊“强奸犯”——食龙（sik long）——时，而这些警察现在看起来更像占领军而非警察时，他在想什么。坊言巷闻再次证明战胜了主流媒体。巴瓦是那种对混乱有着祖传恐惧的人之一。即使是北京的威权统治也比混乱好。如果这种统治意味着在警察可能引发了某种非故意的暴力后，将几个暴乱者扔进海里，从长远来看，也比另一种选择——本土民主要好，因为后者意味着混乱、垃圾和收入下降。


    在这种一种扭曲的、近乎爱国主义的精神下，根据个人的政见不同，巴瓦在尸房里搜寻。当天早些时候，他收到了一位警察联系人的线报，称一艘路过的拖轮船在海里发现了另一个年轻女孩，警方已在情况允许范围内秘密地去接尸体。媒体被其他事情分散了注意力，错过了这件事，女孩被带到了岸。巴瓦在约两个小时后去了尸房。尸体只穿着部分衣服，她还穿着一件短夹克。警察对此似乎很焦躁。大约六点钟，关于光华医院内一名中枪学生的传闻正愈演愈烈，尸房的工作人员已联系亲属来认领尸体。他们一定在夹克口袋里发现了她身份的线索。巴瓦本人未被允许看她。他被迫在外面等，一名官员悄悄地向他告知了细节，仿佛这些信息被认为是机密的。这无疑是一起自杀，那个官员说，巴瓦用严肃而笔直的脸对我重复了一遍，脸上没有显出对官方说法的一丝怀疑。当然，警察绝不会对他们在媒体界的朋友撒谎，甚至不会夸大，而巴瓦无疑是他们的朋友。


    “但当我在尸房等候，在笔记本上写字时，我注意到一辆轿车停在外面，一个男人出来出来。我想我在那些八卦杂志上见过他。我想阿强（Jimmy Tang）是你的朋友吧，艾德里安（Adrian）？”


    我必须压住内心的惊讶，抿了嘴片刻才开口。


    “阿强？”


    “我很确定是他，那个警察也是如此。当然，他可能撒了谎。但他为什么要对我撒谎？”


    我看向汉宁（Cunningham），仿佛是我被抓了现行一样，这一定很滑稽，因为莫耶（Moyers）不禁露出了微笑。不知道该说什么，我脱口而出了一句极易预料的话：


    “阿强在那儿？”


    “正如我所说，”巴瓦平静地继续，语气中透着冰冷，“他进来向警察们打了招呼，似乎沉浸在情势中以至于没有看到我。”


    “你认识他吗？”莫耶问。


    “我们一起上过大学。我认识他超过二十五年了。”


    巴瓦点头，表示他知道了。


    “正如我所说，”巴瓦平静地继续，语气冰冷，“他进来问候了警察，似乎完全陷入了那种境地，没看到我。”


    “你认识他吗？”莫耶问。


    “我们一起上过大学。我认识他超过二十五年了。”


    巴瓦点头，表示他已经知道了。


    “那么也许你知道为什么他来了，”他说，“我是不知道的。”


    “如果这种统治意味着在警察可能引发了某种非故意的暴力后，将几个暴乱者扔进海里，从长远来看，也比另一种选择——本土民主要好，因为后者意味着混乱、垃圾和收入下降。”


