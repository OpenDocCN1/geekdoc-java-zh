    61


    I smiled. ‘There’s no such drink as a Bargirl.’

    ‘Well spotted, comrade.’


    I couldn''t think quickly enough to invent an excuse so I accepted on the spot
    and he nodded: a small triumph.


    Rebecca shook my hand. The flash of friendliness from earlier in the evening reappeared
    and was just as indecipherable- as it had been then.


    There is a saying often quoted in Chinese poetry, of which I was only ever a second-rate
    scholar, to the effect that a woman’s beauty makes fish dive deeper and geese
    drop to the ground in shame. Like everything Chinese, it must have been based
    on centuries of empirical observation.


    A moment later Jimmy announced that he had called a separate car for me as well,
    one of his three drivers always on hand.


    ‘We’ll see you on Sunday. Hopefully in a sailor outfit? If not – lederhosen?’


    AS I WAS DRIVEN over to Java Road the chauffeur, in the Tang family livery, turned
    to me and said in Cantonese, ‘The city’s one big traffic jam.’ The green arrow
    suspended above the roads glowed and there was no sound of sirens, I assumed he
    was correct because the radio was also saying- that the jams extended far ahead
    in the city. As we rolled to a stop he reached up and flicked on the car’s interior
    light so that I could read if I wished to. There was a selection of newspapers
    that Jimmy kept at hand, as well as a bottle of Yamazaki single malt. Apparently
    there was a disturbance by Times Square and the traffic had backed up in all directions.'
  - '[PAGE 75]


    It was an opportunity to relish the fact that I had never been trapped in one
    of Jimmy''s limousines before. As I was reading a paper version of The Wall Street
    Journal, a car pulled up next to us and I realised there was no traffic coming
    in the opposite direction.


    I looked up and saw a well-dressed couple who might also have come from Duddells.
    All I saw was the nape of the woman''s neck draped with a string of pearls and
    the man''s hand laid across it. She glanced through the window at me and the smile
    was whimsically cynical. At that moment I felt airless and overheated, as if a
    toxic gas had swept across the congestion of cars, and I asked the driver if he
    could turn up the air-conditioning. But that wouldn''t solve the problem of a
    thousand cars spewing their fumes into an enclosed space every passing second.
    It was fifteen minutes before the jam moved again. We came back out into the open
    air. Helicopters crossed the night sky, their searchlights blazing downwards,
    and every few seconds the beams swept across the cars and lit up the faces caught
    inside them. All of us were now on stage, paralysed by the lights, observed by
    a small audience suspended high in the air above us. Accordingly the panic went
    on inside even as we emerged on the far side of the tunnel, and I wanted motion
    to the woman in the pearls and the man caressing her neck as they moved ahead
    of us. Though to say what? I was sweating and the wound on my cheek was somehow
    bleeding again. I thought only of one thing: escape and a hot shower at home.
    Return to privacy and invisibility. It''s a mess, the driver was saying, as if
    only to himself and not knowing how well I spoke his language. Winding slowly
    through the skyscrapers all the way'
  - '[PAGE 76]


    to North Point, the buildings draped with now-sad Louis Vuitton staring into space,
    we could hear chanting and drumming in the canyons around us, unseen by dominant.
    The only thing I now found comforting were the eternally decaying tenements harking
    back to the British days, with their vertical lines of air-conditioning units
    and laundry lines. It would take a tsunami to bring those down. It was, of course,
    because I lived in one of these myself, Garland House, built on Java Road in 1965,
    and I had lived there so long that the place felt as permanent to me as some ancient
    cave dwelling.


    The driver left me there now, at the corner where my building rose above the Joy
    Foot Spa and a cut-price fashion store. The street was silent and deserted, as
    it never usually. My building''s striking yellow façade, only painted that colour
    up to the fourth floor for some reason, looked quietly abandoned in the same way,
    as if all the tenants had left for the week or were surviving on canned tuna behind
    locked doors. The yellow pipes and valves that criss-crossed the building''s front
    were filled with motionless birds that appeared to find comfort in the foot spa''s
    red neon Chinese characters and the time-worn window blinds covered with images
    of sleeping beauties, their heads resting as they always do, on outstretched arms.
    That little image of a red-lit foot on the second floor had always been the sign
    that I was home. And so, tracing my usual exhausted steps, I went up to the fifth
    floor and let myself into the tiny warren of rooms now a single pocket of heat
    after four hours without air-conditioning. They were dark and musty by virtue
    of the drab wallpaper I had not roused myself to change in years.'
  - '[PAGE 77]


    Yet their patterns were filled with images of little birds and vines and I had
    grown used to them in the same way that I had got used to my routine-driven solitude
    passed in their company. I made myself a gin and tonic with piles of ice and turned
    on the TV. My hand never appeared to be shaking.


    I listened to the news as I did every night out of morbid curiosity, not believing
    a word of it. The pro-Beijing papers'' coverage of that day''s insurrections were
    as uninteresting as the previous day''s, constantly downplaying the severity of
    events and minimising their significance. It was to be expected. The ongoing charade,
    though, was always fascinating. And after a half hour I retired to the laptop
    to get the real news. I continued drinking, slowly and with a certain consideration
    for myself, and I could hear above me the feet of Mrs Lai traversing her floors
    in slippers while she shouted at her long-dead husband. A lone summer moth had
    found its way into the apartment and careened around the lampshades, yet I didn''t
    have the energy to hunt it down.


    By now I followed dozens of fellow reporters on Twitter, many of them locals armed
    with their own cameras who descended into the streets every day and followed events
    until the early hours of the morning. They had colourful handles: Hong Kong Hermit,
    W. B. Yeats, Flamethrower. During my weeks of wandering the streets with my own
    camera I had never run into a citizen journalist that I recognised. It was like
    a roving secret society using their phone cameras to document for the first time
    a slow-burn revolution on the ground. I had long realised that my modus operandi
    and the publications I worked for had nothing to offer that could be better these
    citizen reporters. We had been left behind. Like'
  - '[PAGE 78]


    drowsy elephants plodded after news that had long been divulged elsewhere at three
    times the speed. The only purpose we served was to bestow a sense of legitimacy
    to whatever items of information we saw fit to enshrine in print, even if it was
    only ever digital print. But it had become something of a con. We liked everyone
    else. But we were absolutely certain that we didn''t lie and we despised those
    whom we thought did.


    The Chinese Communists at least understood that very clearly. Hence their contempt
    for journalism. I could never explain to them what the romance of it was. They
    had never seen His Girl Friday. Even if they had seen it, what sense would they
    ever make of it? But for us, the dinosaurs of my generation, who among us didn''t
    want to be Walter Burns buzzing amid the clacking machines of The Morning Post?
    As Jimmy had suggested, the once-great romance of it was made its current degradation
    so disillusioning. When I was forced to defend that same press to Jimmy''s Beijing
    friends, for example, I found myself sounding vague and uncertain about my own
    claims. ''Rachel Maddow and Brian Stelter are comical lunatics,'' they would say,
    looking at me with merry eyes and waiting calmly for some sort of rebuttal on
    my part, having of course no idea who Cary Grant had been. And what was I supposed
    to say? No, they aren''t, and all is well with the Republic? From afar, in fact,
    I had watched the strange deterioration and debauching of the American media.
    It struck me that television journalists in particular no longer relayed anything
    of integrity. But print journalists were following the same downward trajectory
    as they sat under the tables of the powerful in'
