    that her face was an older version of her daughter’s, except that her nose had
    a more imperious rise. They had finished their meal and made their way with satisfaction
    to the door. Seizing the moment, I made my call-of-nature excuse to Strick and
    threaded through the maze of tables to the same door. Within five steps my heart
    was beating out of sync with my mind, and when I went to the door and asked casually
    where Mr and Mrs To had gone, since it was a certainty that the staff knew them,
    they said the family had retired to the bar upstairs. I looked back at Strick,
    now returned to the intrigues of his Galaxy phone, and decided to make a quick
    dash to the bar to see if I could find Rebecca and her parents.


    The Long March Bar was as full as the restaurant, as if the China Club served
    as a collective memory of better times. The bar itself was a homage to the 1930s,
    with its velvet armchairs covered with what looked like lace antimacassars and
    its poster-art celebrating the Long March. Communist heroes standing on prows,
    gazing into future horizons that never came closer. Its iconography always reminded
    me of the artist who was beaten up by the Red Guards for depicting Mao standing
    at the edge of a cliff, unintentionally suggesting that the Chairman had lost
    his way. Steel ice buckets and stained-glass windows, images of Mao’s missile
    force and old-fashioned silver ashtrays. Long and narrow, a little tongue-in-cheek,
    it was lit by gold-coloured lampsades. And it was only at the last moment before
    giving up that I spotted Rebecca seated alone at the bar’s far end, overburdened
    of her parents. She was not slumped in a sullen and resigned way,'
