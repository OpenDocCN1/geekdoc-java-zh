    136


    and the voice at the other end surprised me. There Jimmy was at last, resurrected
    from the dead. Chipper and innocent, apologetic and cajoling, pleading work and
    family as the chronically evasive always do. In the event I found that I didn’t
    mind his silence. I was pretty sure that my enquiries to his friends had got back
    to him. He must have heard all my messages as well and turned them over in his
    mind. In those messages I had mentioned the photographs and that I wanted to ask
    him what he was going to do about them.


    ‘I’m sorry about the radio silence, comrade,’ he declared, breezily. ‘Now, what
    are you doing today? Shall we go to Chan and get suits? It’s my treat.’


    I laughed. ‘A suit is your idea of a treat?’


    ‘I thought it might be a fun way to say sorry for being so rude. Besides, my father-in-law
    has been pouring money over my head. I think they’re trying to keep me quiet.’


    ‘It’s a pretty strange thing to offer, Jimmy.’

    ‘Is it? I don’t see why. We can talk about the serious stuff afterwards. I’ll
    take you to Mott 32 for lunch.’


    ‘I’d like more than the suit.’


    ‘It’ll probably cost more. Then we can talk about the press.’


    Ah, I thought, so you do need me after all.


    ‘I heard from someone that you had dinner with Li Ka-Shing,’ I said, more irritably
    than I intended.


    ‘Where did you hear that? I don’t even know the man. Do you?’


    ‘Of course I don’t.’


    ‘Then how could you know such a thing?’


    ‘Some idiotic journalist mentioned it to me.’'
