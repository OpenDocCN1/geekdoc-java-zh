    bar, and had made a pre-emptive move towards it when I saw her eyes object. It
    was as if her mother might show up at any moment.


    ‘They’ll be fine without you,’ I reassured her with a wink.


    ‘My mother and father? I’m not worried about them.’


    Then I thought that perhaps it had been a reflex in regard to our absent mutual
    friend.


    ‘They looked quite content,’ I went on.


    I suppose they’re not much older than me, I thought grimly. The same disconsolate
    niche.


    ‘Let me get the drinks. Gimlets?”


    ‘Oh God, no.’


    ‘Yee loeng bu gimlet,’ I said to the barman.


    ‘I’m doomed.’


    She groaned and swayed, conceding.


    I asked if her parents would smell her breath after she’d been out at night.


    ‘They would if I let them.’


    I glanced at my watch and realised that I had by now left Strick alone for the
    better part of a quarter hour. He must have made enquiries about me. But if I
    went back down to the restaurant to look for him I would almost certainly lose
    my interval of solitude with Rebecca. I decided against it.


    I would leave a message for him later explaining that I had felt ill and had gone
    home without telling him. I hoped that he wouldn’t take the initiative and come
    up to the bar to look for me. It was perilous since I depended on him for my monthly
    pay cheques, but there are times when practicalities don’t matter. Rebecca and
    I drank our gimlets and ordered'
