    ‘Your days won’t last long, comrade,’ Jimmy intoned. ‘When they bring a curfew
    in, which they will, you’ll all go home.’


    ‘Just wait and see,’ she said. ‘I think Jimmy will leave, too.’


    ‘Not me,’ Jimmy said. ‘I’ve got nowhere to go.’


    ‘What do you know about the curfew?’ Rebecca asked Jimmy.


    ‘I heard about it last night at a poker table. True story. The government minions
    are leaking it everywhere. Beijing gave the order, they say.’


    ‘When did they not give the orders?’ Rebecca said.


    Jimmy said, ‘They might not do it. After all, a curfew would be an incredibly
    stupid thing to do. And that,’ he sighed, ‘is why they will do it.’


    It seemed to me that something deflated in Rebecca. Her mood became listless,
    or just disinterested. We went upstairs afterwards to the second-floor bar, which
    was more crowded than the restaurant. It was a hangout for the groomed and the
    rich: people with much to lose. There was an outdoor terrace filled to capacity
    with young locals in Armoury suits and drenched in humidity. I used to look at
    them with a measured envy, these beauties of the terrace, but now I just felt
    sorry for them. What future did they have in the new order that was coalescing
    around them? They’d still be rich, but they would be marooned as far as their
    other liberties went. They showed no signs of anxiety, however. It was a stifling
    night the small-production gin flowed. We couldn’t hear anything from the streets
    nearby. Queen’s Road Central was silent, the Landmark was closed. The lanes that
    ran upwards from Queen’s Road were no longer thronged. The previous age had seemingly
    ended, and its more obvious street-level levels had finally dispersed. We went
    outside and Jimmy excused himself to go to the bathroom. When I was alone with
    Rebecca, she turned to me and asked if it was true she had once married.

