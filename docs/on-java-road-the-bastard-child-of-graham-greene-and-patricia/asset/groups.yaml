    He grinned and the teeth were an artificial off-white but uniform all the same.
    It was insincere dentistry to say the least.


    “We do have to capture the whole picture in some way, Adrian. Not that we didn’t
    appreciate your street coverage. It’s exceptional. But it did occur to me that
    down the line you might be putting yourself at risk there and we have to think
    about medical costs if you get properly fucked up. There are bigger insects out
    there, I’m sure. On the other hand, I personally would like to see some stories
    about the hospitals. Can’t you get inside one?”


    “No interest in that, sorry.”


    “The thing is, everyone else is covering the protests. You’ve done some sterling
    work, of course, and it’s the story of the moment, but is it entirely ours?”


    “I’m trying. But I never seem to quite catch it.”


    “I didn’t want to be the one who said it. I know what you mean. It’s like running
    to the scene of a crime and catching-a pair of coat-tails whipping around the
    corner just ahead of you.”


    I laughed. “You’ve nailed me there. I’m not fast enough any more.”


    “Better to do something deeper and at a slower pace. Don’t you agree?”


    I could feel his grip tightening. ‘I’ve nothing against it.’ A moment later I
    found myself looking across the room in expectation of encountering someone I
    knew, the half-forgotten faces that sometimes come back to you in a restaurant’s
    rush hour. At the club it was not unlikely. Under the black lacquer fans everyone
    looked slightly familiar, as if I'
  - '[PAGE 107]


    had met all of them at least once before without remembering any of them consciously.
    But at the far end of the room, beside a wall covered with Chinese calligraphy,
    that same eye caught sight of Rebecca eating with what looked like her parents
    at a table by themselves. They were all three dressed in white like people at
    a garden party—or a religious ceremony—even though it was then past nine. While
    her parents, if that''s who they were, had their backs to me, Rebecca was facing
    me. I seemed to recall something Jimmy said about her parents being members of
    the club.


    This apparition served as an improvised inspiration and I said, not taking my
    eyes off her, that maybe I should write something about upper-class families and
    their children who were taking to the streets.


    ‘That’s a splendid idea,’ he cried.


    ‘Could we do it?’

    ‘Of course we could do it. I think it would be immensely interesting. Gripping.
    Involving. I mean, what is going on them?’


    He knew perfectly well that I had a foot in that world and could likely write
    about it with some confidence. But discretion would be another matter.


    ‘Would you consider it?’ he asked.


    I said I would think about it, that I didn’t want to ruin people just for the
    sake of journalistic voyeurism.


    ‘Would it ruin anyone?’ he asked, eyes opened to express his full incredulity.


    ‘You know perfectly well it might.’

    ‘I didn’t say expose their secrets. I would just ask them their opinions. On the
    record. They wouldn’t do that?’'
  - '[PAGE 108]


    ‘To be honest, I have no idea.’


    ‘Well, we wouldn’t be trying to humiliate anyone. I don’t want any lawsuits. But
    on the other hand we all know how it works. It’s our job to get to the bottom
    of things. We can’t do that without offending anyone.’


    ‘But we must offend my friends?’


    He chuckled and his eyes revealed just how much he was enjoying needing me.


    ‘But we’re always trying to do that, aren’t we? Offend your friends. Who are your
    real friends anyway? Let’s be honest. We both know that the story counts for more
    than loyalties. Personally, I would love a piece on of your friend Jimmy Tang.
    You’ll never write it, of course. Because you’re loyal to him and you know what
    it involves… But seriously, think of what a succulent piece it would be. Think
    of the hits we’d get inside Hong Kong. But go deep, can you? Dredge up some outrageous
    stuff. Then we can talk.’


    At this moment I looked up again at Rebecca and her parents and almost immediately
    lost interest in what Strick was saying. I considered getting up with a good excuse
    and walking to their table. I wanted to know what her parents were like, the people
    who had produced her. Her father turned his face towards the rest of the room
    and I got a good look at him: a grave-looking and handsome man with facial furrows
    that indicated not anxiety but a relaxed ease with the conditions of his world,
    or even a mastery of them. But Strick was talking money and I couldn’t extract
    myself. I nodded, barely listening, and immersed myself in the far-off table.
    Soon, as if attuned to my distraction, Rebecca got up and her parents slowly did
    the same. The mother turned and I saw'
