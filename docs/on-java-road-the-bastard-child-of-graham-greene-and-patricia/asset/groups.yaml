    among the market stalls just as he passed a small Thai place I knew called Tom
    Yum. I had to half run to keep within range of him.


    Soon, throwing a glance over one shoulder, his pace re-lent and he strolled more
    leisurely under the whirring air-conditioning units set into the façades and the
    vertical stacks of laundry lines, his camera swinging under his left armpit. He
    was not lingering for the moment, and if he did linger I had nothing planned to
    say to him. Soon we were threading our way through the goldfish market, and there,
    for a minute or so, he paused. Under the lights that illuminated wall after wall
    of goldfish suspended in plastic bags of water and cages of twittering songbirds,
    I saw his face a little better. He was a man of about fifty, a little too ostentatiously
    dressed to be inconspicuous, in black sneakers and an indigo cotton jacket.


    He stepped into one of the fish shops with their tanks lit red and purple and
    examined some of the specimens, gazing up at them as if he was considering a purchase.
    Then, exiting a little tentatively, he looked both ways and resumed his progress
    down Tung Choi until he reached a crossing filled with yet more stores brimming
    with puppies and baby rabbits and yet more helpless goldfish. There he swung off
    into the streets of Mong Kok and I followed at a distance of a block.


    We fell into the crowds of Argyle Street and it was not long before I was struggling
    to keep up with him. Step by step he slipped away among the bodies, and I felt
    that he was being followed and had avoided me skillfully. Yet it had surely not
    me who had interested him out on Kau Pei Chau.


    Reluctantly, and feeling out of breath, I gave up and stopped by a stall to get
    an ice cream. Eating it, I retraced my steps back to the hospital, where Cunningham
    was still loitering by the doors waiting for his break. He looked as if he had
    been impaled by his own disappointment. Still, he had enough tact not to ask me
    where I had gone and suggested instead that we give up on the wounded student
    and go to Spring Deer for Peking duck with two friends of his, a Sri Lankan journalist
    called Sonny Bawa and an Australian businesswoman, Dan Moyers, who often gave
    Cunningham leads and contacts inside the government.


    I knew the two gentlemen a little and detested them unequivocally, but at the
    same time it was a necessary part of the job to sometimes hang out with the detestables
    in order to keep one''s ear to the ground in feverish times. Both of them wereiduous
    gossipmongers, eavesdroppers, conspiracy enthusiasts and orchestrators of spy
    networks: dinner with them I could endure for an hour and Cunningham would buy
    me dinner.


    We set off along Nathan Road, therefore, where the daily disturbances were under
    way, and as we skirted around it wearing our press badges the air crackled with
    the sound of glass breaking, though I couldn''t see by whom. In passing, Cunningham
    pointed out that it was the police smashing bottles from a stockpile they had
    found so that they couldn''t be used as missiles. Behind us and farther up the
    same road the first tear-gas round had been fired from another police line and
    the wind blew it down at our heels. Miniature Stonehenges of bricks had begun
    to appear on the roads by then and around the young black-clads stood with their
    woks ready to smother the gas canisters, in their scuba masks and ad hoc body
    armour, not yet tested by an imminent confrontation. Gas smoke wafted over us,
    and as we hurried to get away from it I noticed how calm they appeared, almost
    diffident. I thought of them as Rebecca''s comrades, which only endeared me to
    them even more. By Chungking Mansions the air cleared and we went down Mody at
    a more relaxed pace. Spring Deer, supposedly a haunt of gangsters back in the
    day, was at the top of a narrow flight of stairs, and at one of its humdrum tables,
    surrounded by lush floral wall-paper, the physical majesty of the Australian was
    startlingly paired with the severe thinness of the bespectacled Bawa. Only ideology,
    the admiration for Mao''s state, I thought, could have brought them together so
    intimately and so ridiculously.


