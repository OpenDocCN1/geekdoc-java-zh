    and hugging the pink wall. For a moment I was sure that it was Rebecca, glimpsed
    as she moved between parked trucks but unmistakably her.


    I crossed the street quickly and pushed through the other pedestrians to get a
    better look at her. However, she had melted away. Either she had stepped into
    the condo building or she had crossed the street herself but in the opposite direction.
