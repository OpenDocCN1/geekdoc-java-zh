    从高楼上坠下——没有人能假设他们知道到底发生了什么。如果是真正的自杀，没有人相信；但如果不是，大部分人却信了。关于这一事件，影射和流言蜚语四处可见。无法知道是谁在说真话。无论是警察还是小报记者，我们都在编造故事来解释这一事件。没有人知道什么是实实的，什么是虚幻的。怀疑是新时代唯一的主宰法则。当整个国家现在建立在秘密和挥霍之上时，情况又怎么可能不同呢？因此，一个社会就像某种固体物质一样融化了，正如我之前在莫特
    32 号的浴室里想过的那样，消失于无形。


    无论如何，王继续说道，在经历了与金米·唐在一起的这些怪异事件后，他和另一位医生都没有被允许回到实验室几个小时，当第二天他们回到工作时，尸体消失了。这种消失既彻底又神秘。他看着我，露出了一个微弱、略带残忍的微笑。有一段时间，他我和我喝着咖啡，不再不再交谈。我感到精疲力竭，我怀疑他也是如此。


    我告诉他我会先离开，由于我们不应该被看到在一起，他应该留在那里至少喝十五分钟咖啡。我与他最后进行了一次眼神，然后走上街，仿佛需要一些道德上的新鲜空气。想想一个需要付钱才泄露他所知犯罪行为的男人。从某种层面上说，这不是他的错——他处于一个模糊的境地。反叛军称他们为“工子”，是胆怯的“猪”，他们认为日常生活比任何事情都重要，但我不能怪他们，考虑到他们有自己的家庭要养。我经常想起
    20 世纪 30 年代生活在江西苏联的那些中产阶级专业人士，他们被暗杀以震慑民众，他们的妻子和孩子此后在街上乞讨了多年。没有人知道他们后来变成了什么样。王所处的的境地和那些男人当年一样，如果他只跟我谈，最好是为了一笔钱，这对他的孩子来说比较好。鄙视他很容易，但当我走回爪华路时，我意识到我并不觉得比他优越。毕竟，他的腐败中蕴含着某种模糊的崇高。


    ## 九


    正如金米本人在大学里通过艾萨克·沃尔顿教过我那样，一个完美的钓鱼者是伪装和策略的大师。通过传闻，我听说他仍在波雷特大厦举办周末派对，而那些参加过派对的记者已逐渐被清理出去。这包括我在内，尽管我实际上对这种排除表示感激。是康宁汉告诉我的。但我问自己，为什么我非要从他口中听到？我完全可以自己去波雷特大厦强行解决问题。而不是提前打电话然后被礼貌地拒绝，我一天晚上打出租车去那里，让司机在在大门外的车道上等我，就在几周前我和金米还抽着雪茄站在那扇门前。


    老门卫还在那里，但肩上披着一条毯子。我认出了他，所以没必要给唐家公寓打电话，因此我没打招呼就上楼了。这是一个危险的举动，但我可以说我是路过，想看看他们。尽管如此，我在胡桃木门外徘徊，努力想偷听里面的动静。那里很安静。我向侧移了步，让透过观察孔的人看不到我，然后按了门铃。


    某种沉默是恐慌的信号。有什么东西动了一下，然后静止了。我又按了门铃。好奇心总是占据上风。穿着袜的脚步声安静地走近，我能感觉到猫孔后的眼睛正盯着走廊。然后门开了，梅莉莎的声音传到走廊，问是谁在那里。我走出来，尽可能自然，露出了一个局促的微笑。“你！”她喘了口气，没有怎么犹豫，滑开链扣跟我一起走到走廊上。她穿着拖鞋、运动裤和一件羊绒开衫，外套没能盖住她冻得起鸡皮疙瘩的手臂。她说的第一句话是金米不在，他去美国出差了，几天内不会回来。


    “我是路过的，”我带着请求语气说道，“我想——”


    “你没想过打电话？”


    “我打了，但金米没接——事实上，他从不接。真奇怪。”


    “那么，你想进来吗？”

    这个提议并没热情，但如果她直接拒绝让我进去，对体面来说会更糟。


    “呆一会儿就好，”我说，“既然我在这儿了。”


    “是的，既然你在这儿了。我想你也欠我一个解释。不是吗？”


    “我欠，是的。”


    这个承认似乎让她满意了。我立刻看出公寓以某种方式封存了。家具盖着防尘罩，地毯被卷了起来，其中一个穆拉诺水晶灯被拆卸下来，降到地板并包裹起来。


    “季末结束了？”我想开个玩笑，知道那里没有季节之分，如果他们在收水晶灯，说明他们要搬到其他地方去。看起来金米履行了他把他们搬到美国的提议。梅莉莎为我们泡茶时，我环顾四周。

