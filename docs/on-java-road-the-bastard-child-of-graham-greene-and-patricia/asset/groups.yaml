    就我个人而言，我该如何报告和描述他们呢？这个问题让我每晚都想去“凤兴”吃饭。此外，这个地方的英文名“凤凰城”（Phoenix City），现在看来似乎比以前更贴切了。另一只凤凰，又一个谜团。


    每当我爬上楼梯进入二楼的食肆时，那里与红蓝相间的街头招牌齐平，路过一尊庄严的、嵌着蓝色眼睛的金色鸟神像，我总在想，当我独自一人进入大厅时，是否所有的目光都会汇聚在我身上。我被头顶那种中国人似乎很喜欢的餐厅里的审讯灯照得眼花缭乱，这让我比平时更加地察觉到自己的格格不入。我决定把那位“神秘肉菜刀男”称为“李先生”，因为那是大陆最常见的姓氏之一。如果以后在那个地区的某条阴暗巷子里再次遇到他，我的刺客至少得有个名字……然后被李先生劈成两半。在那个充满暴行与混乱的热夜晚之后，我很少在凤兴看到他了。那时，穿着黑衣、拿着竹杖的男人们追逐着男孩女孩，当局势反转时，他们又被原路追回，像一场失控的剧场演出。


    但并不仅如此。作为一个外地人，我与在凤兴用餐的人之间的关系几乎在一夜之间发生了变化。整个城市的氛围变了。我周围语言的语调变得尖锐，那是一种无论如何我都从未掌握过的语言。然而，我察觉到了这些变化，就像电波中的磁场波动。


    我知道如何说“屌你妈”（diao ni lao mu），但现在我听到它被用成一句针对武装警察的句子：“屌你妈高滚”（diao ni lao mu gao gun），其中最后两个字可以译为“狗官”。“哈警”（hak
    ging）这个词随处可见——黑警、眼警。警察很快开始向他们的讽刺者回骂脏话。其中一些人用普通话说说：“操你毛”（Cao ni mao）。随着温暖月份的推移，最初因反对北京实施的引渡法而引发的紧张局势不断升级并螺旋失控。现在，随着事情变得愈不理性、愈原始，人们可以看到仇恨通过文字流泄，正如通过毒打和催泪气一样。文字是承载暴力种子最高效的容器。正如阿拉伯人所说，舌头无骨，却能断骨。内心深处的一切都毫不费力地流过那些碎骨的文字。当一个警察对一个十六岁的女孩说“死仆”（sei
    po）——“死吧，婊娘”，暴力已经完成了。动词不是行为，但它就是行为，是违规者通过说出脏话而赋予自己的许可。在有一次对峙中，警察使用了正式警告，前线的女孩们回道：“过来啊，我们把你的蛋抠掉。”对此，没有回应。至少在那一刻，言语的侮辱抵消了一连波橡胶弹。


    在接下来的几天里，我没有去每日的街头抗议。我照常去凤凰城，因为我迷恋那里极地般的空调气，以及它带给客人的常态感。这是一种解脱。我坐在一根镜柱旁，吃着咸鸭黄和汤饺，直到街道凉快了一些，我才能带着清醒的心智下楼，在从雅华路延伸出来的斜坡街道上走走，寻找暴动者、抗议者——随你们怎么称呼都可以。但没有人出现。一种沉静降临了，仿佛那些把遗书遗嘱缝在外套里的学生们，决定休息几天以恢复体力，让街道恢复为消费主义的安逸之地。或者，在雅华路的情况下，那里是一个满是殡堂的地方，挂着黑白带和单色横幅，被那些糖大亨的幽魂萦绕，他们曾通过与爪哇的海上贸易积累财富，而他们宏伟的办公室曾屹立在这里，作为殖民大慈的象征。


    热浪升腾，到了中午，城市的居民们撑着报纸和遮阳伞忍着暑。他们穿着简陋的衣物，显得忧郁而克制。


