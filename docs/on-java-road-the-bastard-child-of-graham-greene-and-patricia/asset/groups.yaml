    mood changed. It then occurred to him that someone on the other end of the line
    may have spoken to her after all. He watched her face for signs that this might
    have been the case. She had grown cold and nervous. ‘It seems odd that people
    are playing pranks,’ he had said. As she looked away he felt certain that someone
    had indeed spoken to her and she did not want to reveal it.


    ‘I kept thinking all night that the caller had exposed my affair to Melissa and
    that she was keeping it to herself. But there was no way to prove it.’


    It was possible, I supposed, that Rebecca had been feeling vengeful and prone
    to reckless behaviour. It would not be in keeping with the individual I thought
    I knew, but when it came down to it, how well did I know either of them?


    ‘You should call her,’ I said.


    But suddenly, for the first time, I had the feeling that there was no one to call.
    Rebecca had gone, but I didn’t know where. I can’t say why I suspected it either.
    A slow build-up of unease arose within me, and I thought of Bawa then. He had
    not lied at all – Jimmy had been at the morgue.


    ‘No,’ he said smoothly, ‘that would be a terrible idea. I’m sure she hates me.
    Either way, I’m not calling her. For all I know, she’s gone abroad.’


    ‘Abroad?’


    He made a small gesture of resignation and caught the eye of a waiter.


    ‘Shall we have another bottle? Come on.’


    We sailed on, bound to get more incoherent. It was a relief in a way. The skin
    along my back grew moist, my temples flushed with blood. The wound on my cheek,
    which by now felt like some sort of old battle scar, grew feverishly hot as well
    and I feared it would supprate visibly.


    I excused myself and went to the bathrooms, which at Mott 32 are buried inside
    a small dark-walled labyrinth. I found them empty. Dampening a paper tissue, I
    tended to the wound, which had indeed flared up, as if it were psychologically
    connected to my moods. An irrational fear gripped me. All that is solid, as Marx
    said, melts into air. Not only that, it does so from one moment to the next. Between
    leaving the table and staring into my own image everything that I thought I knew
    about Jimmy and his city evaporated. Around me now was empty space, noise and
    madness. I gripped the edge of the basin and watched as perspiration rolled down
    my cheek into the fabric of my collar. Yet the bathroom was cold, as cold as I
    was. I thought back to his account of the mysterious phone call to his house.
    Had it been after Bawa had seen him at the morgue, or before? I hadn’t asked him
    the date. Confused, I calmed myself and went back to the table, where Jimmy carried
    on as if he had noticed nothing unusual about me.


    ‘A toast!’ he cried, raising his glass. ‘Who’s better than us?’


    It was an old toast from college and I echoed it. Pretty much everyone in this
    room, I thought to myself, bitterly.


    ‘So what are you going to do now?’ I asked, taking a sip of wine and relaxing
    into my seat.


    ‘I’ll stay home and have dinner with Melissa and endure it until she forgives
    me. It’s rather a classic move, but no more parties for me. I’m going to keep
    my face out of those magazines for a bit. Maybe I’ll grow up, as her family keep
    asking me to do.


    ‘And about Rebecca, you really don’t know where she is?’


    ‘You’ll have to take my word for it. Maybe you can find her herself. Why the sudden
    interest, Adrian?’


    His eyes sharpened and I was forced to take a quick step back.


    ‘To be honest, I’m just worried about her.’


    He took this in his stride, revealing nothing. It was not the moment to confront
    him with my suspicions and I could hardly throw Bawa’s testimony in his face.


    He said, ‘If she hasn’t decamped to foreign parts by now, she’s probably out there
    on the streets fighting the revolution I wouldn’t worry about her if I were you.
    She’s not our responsibility. The revolution is bigger than us, remember. It’s
    bigger than her, too. You should be worried about yourself, just as I worried
    about myself. Apart from anything else, Adrian, her political engagements are
    dangerous to me as well. Don’t you see that? The whole charade was fucking stupid
    on my part. sooner or later they will come for us simply because we associated
    with her. Maybe not this year. But next year or the year after that. These people
    have long, long memories.


    I said that that was a trifle cowardly cowardly coming from us.


    ‘Cowardly?’ he guffawed.


    ‘Should’t we be sticking by her?’


    ‘I’m not sure I know what you mean.’


    I repeated what I had said, and this time around he became exasperated with me.


    ‘She is a charming woman, Adrian. Yes: normally we would, as you put it, be sticking
    by her. But these are not normal times and the fact is I won’t be seeing her again.
    I’d suggest you do the same, comrade. I can’t help it if you disapprove.’


    Eventually a dessert came which must’ve ordered while I was in the bathroom. It
    was an off-menu special, a pyramid of durian ice cream with lychees stuck into
    it.


    ‘They bring us dessert,’ he sighed, spearing a lychee with his fork, and ‘and
    they call it peace.’


    WHEN WE CAME BACK up to the street the typhoon had started and umbrellas swirled
    down the empty streets. It did not put the slightest dent in Jimmy’s good humour,
    however. He offered me a lift in his limo, but I refused, making the excuse that
    I had an appointment nearby. In reality I wanted to walk home in the rain and
    let our conversation sink in and settle down. All along I had the subtle feeling
