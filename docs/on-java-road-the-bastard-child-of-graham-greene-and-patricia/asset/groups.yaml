    and so they tried hard to maintain their outward respectability Jimmy was never
    as free as he pretended to be. And shortly after my visit to the morgue, indeed
    only a day later, that same society discovered why Jimmy had gone to ground in
    the first place. The headlines were typically incriminating, and I quickly came
    across one that summed them up: ‘Society Darling Known as Terrible Tang Seen on
    Yacht with Beautiful “friend’. An Affair?’ Photographs began to appear everywhere
    of Jimmy and Rebecca together.


    The story was broken by the tabloid Apple Daily, which was owned by the anti-government
    garment industry magnate Jimmy Lai. Did not all remember why Lai had named his
    paper thus? If Adam and Eve, he is said to have stated, did not eat of the forbidden
    apple, would there be any evil and any news? On its news site, the gossip about
    Jimmy Tang lit up the city. Even among the usual buffet of celebrity scandals,
    gangster tales, gambling news, semi-fabrications about sensational suicides, grisly
    traffic accidents and financial crimes flared like a garish comet across the city’s
    consciousness.


    But there was something else. I instantly recognised the setting of the images.
    It was the island where we had moored together on Jimmy’s yacht. And in some of
