    其他故事更为紧迫，占据了他们所有的时间。他们无法顾及所有，因此对此完全不感兴趣。于是，这一件事就从他们身边溜过，而他们并没有觉得有义务去深究。当然，也可能是他们不惜一切代价避开了它。是恐惧还是冷漠抓住了他们，这很难说是哪一种。


    当我从一层楼走到一层楼，从一次醒来到下一次醒来，我意识到自己正独自追逐一个幻象。那个死女人的幽灵在远处看着我。我相信这一点。她现在也成了一个“鬼”（gwai）。正如此，我在周围的环境中感受到了她，一个心怀不满的灵魂，只在我的脑海中有声且可感，却在直接向我发出挑战。由于纯粹的不幸，我似乎是她失踪后唯一愿意或能够采取行动的见证者，也是除了消息来源之外，唯一没有利益去将这件事降至最低的人。


    在中国神话中，没有得到公道的鬼魂会回到人间寻求复仇。它们要么是“饿鬼”，或是“游魂”。人们会向它们提供祭品。它们必须得到安抚和安葬。在农历七月十五的中元节，人们会向它们供奉。饿鬼有九种，但我只能猜她可能属于哪一类。但是，活人呢？瑞贝卡（Rebecca）可能有些挂念她的朋友，有些去找过她的人，但我不认识其中任何一个。他们也没有人联系过我。我们处于不同的圈子。因此，我们是一个异类，我和瑞贝卡的幽灵，形单影只。在华江路（Java
    Road），在各大殡馆之间，这一点变得非常清晰。当我经过人行道上成排的花丛和黑带时，我知道我正被人跟踪。随着我沿着华江路走越远，这种感觉越持续，很快我开始停下、回头看向向我走来的脸群，那些脸对我来说变得越来越陌生，正如我对他们来说一样。


    好一段时间，我发现自己穿行在混凝土和玻璃构成的墙壁之间，小企业的装货口对着街道，托板散落在人行道上。我想，那里离科技广场（Technology Plaza）不远。我因突然的疲惫而停下，肺部排空了空气，停顿让腿上的汗水干掉。我已经忘记了现在几点。在闷热陈腐的午后晚晚，光线逐渐没入黄昏。我向后看，看向街道对面的一栋高层淡粉色公寓，在那里，在几个男人正在装货的卡车投下的阴影中，我看到一个女人正平静地独自走着，贴着粉红色的墙。那一刻，我确定那是瑞贝卡，在停放的卡车之间移动时瞥见了一眼，无疑是她。


    我快速地穿过街道，挤开其他行人以便更好地看清她。然而，她已经消失了。要么她进了公寓楼，要么她自己穿过了马路，但方向相反。我大声叫她的名字，声音很尖锐，引得人们转过头。有那么多小卡车在装卸货物，如果她在那儿，她完全可以在我没有察觉到我的情况下溜溜离开。没有得到任何人的回应，我回到最初站立的地方，不知该怎么办，便问了一些工人是否看到过符合她描述的人。我只换来迷茫的目光。我跑向港湾广场（Harbour
    Plaza），疯狂地在通往皇后大道（King’s Road）的柱廊走廊里寻找，电车线路在那里弯曲。正当一辆电车驶来，我跟了上去，产生了一个念头：她可能去了健康街东站（Healthy
    Street East）为了乘电车。当我到达那里时，电车已经停了，人们正在上下。那一刻我再次看到她上车，我动作足够快，在它驶向北（North Point）之前赶上了车。


    我在车内挤寻找她，但当我们到达下一站健康街西（Healthy Street West）时，我还没有找到她。人群太拥挤，不愿为我让路。


    因此，我站在窗边等待。天照街（Tin Chiu Street）经过而去。然后，在树菊站（Shu Kuk stop），她下车，沿着皇后大道走，直到她钻入光华剧场（Sunbeam
    Theatre）周围聚集着买当晚粤剧票的人群中。


    当然，是光华剧场。正如我们那天晚上在中国会所（China Club）讨论的那样，光华剧场是老香港的最后一个角落之一；那晚的戏曲无疑充满了飞天的鬼魂，如果我们能在其他情况下彼此认识，我本该带她去的——或者反之亦然。但我是在那里丢了她，没能看到她是进了剧院，还是仅仅穿过人群从另一侧离开。我在剧院外的票机旁逗留，那是一台亮红色的装置，像一台旧式的秤，有一个五元硬币投口。金属上刻着的中文写着：“轮停时即可投币。”人们在称重，机器会吐出门票，我想她可能也这样做了，然后进去了。我犹豫了，想自己是否也应该称重并付五块钱，但最后我做了。我流着汗上楼梯，穿过一墙墙60年代波波头明星照片的墙，被头顶巨大的灯泡晃得睁不开眼，走进了剧院内部窒息的黑暗中，那里演出已经开始了。在那里是不可能看到她的，但我等中场休息——一个布满鬼魂的舞台。（*注：原文此处存在大量OCR重复及乱码，译文已按逻辑进行清理*）

