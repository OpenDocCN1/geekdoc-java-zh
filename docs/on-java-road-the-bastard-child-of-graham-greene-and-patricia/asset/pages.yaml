- pgno: 17
  md: 'from me personally, how should I report and describe them? This question made
    me want to eat at Fung Shing every single night. Besides, the very name in English,
    Phoenix City, now seemed more apposite than it had before. Another phoenix, another
    riddle.


    Every time I climbed up the staircase to the second-floor eatery, which was level
    with its red-and-blue street sign, past a regal gold image of the bird equipped
    with a blue eye, I wondered if all eyes would be upon me as I entered the main
    room alone, dazzled by the overhead interrogation lights the Chinese seem to love
    in their restaurants, and which made me even more aware than usual of my unforableness.
    I decided to call the Unknown Meat Cleaver Man Mr Li, since that is one of the
    most common surnames on the mainland. If I were to ever meet him again in a dark
    street in those parts my assassin to have a name. Cloven in twain by Mr Li. I
    rarely saw him at Fung Shing after that hot night of bastinados and disorder,
    men running after boys and girls in black with bamboo canes, then being chased
    back the same way when the momentum swung, like a theatrical production that had
    lost control of itself.


    But it wasn''t only that. As a foreigner my relation to the people eating at Fung
    Shing had changed almost overnight. The entire atmosphere of the city had shifted.
    The cadences of the language around me sharpened, a language that I had never
    mastered in any case. Yet I detected these changes like magnetic alterations in
    the airwaves.


    I knew how to say ‘fuck your mother’, diao ni lao mu, but now I heard it made
    into a sentence directed at the armoured cops: diao ni lao mu gao gun, where the
    last two words could'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'be rendered as ''dog officer''. The phrase hak ging was everywhere – dirty
    cops, black cops. The cops were soon shouting obscenities back at their satirists.
    Some of them said it in Mandarin. Cao ni mao. Over the warmer months the tensions
    that had begun with protests against an extradition law imposed by Beijing had
    escalated and spiraled out of control. Now, as it became more irrational, more
    primal, one could see a hatred operating through words as much as through beatings
    and tear gas. Words are the most efficient vessel for carrying the seeds of violence.
    The tongue contains no bones, as the Arabs say, yet it breaks bones. Everything
    in the depths of the mind flows effortlessly through bone-shattering words. When
    a cop says to a sixteen-year-old girl sei po – ''die, bitch'' – the violence is
    already performed. A verb is not an act, but it is it, the permission the violator
    has granted to himself by uttering the obscenity. Once during a stand-off the
    police used a formal warning and the girls on the front line cried back, ''Come
    here and we''ll scratch your balls off.'' To which there was no answer. In that
    moment at least, the verbal insult nullified even a barrage of rubber bullets.


    For the next few days I did not go to the daily street protests. I went to Phoenix
    City as usual because I relished the arctic air-conditioning and the feeling of
    normalcy it bestowed on its patrons. It was a relief. I sat there by one of the
    mirrored columns and ate salted duck yolks and soupy dumplings until the street
    had cooled a little, and I could go down again of sane mind and walk around the
    sloped streets that run up from Java Road in search of rioters, protesters – call
    them what you will. But none appeared. A lull had descended,'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'as if the students, with their last wills and testaments sewn inside their
    jackets, had decided to take a few days off to recuperate, allowing the streets
    to return to being places of consumerist ease. Or, in the case of Java Road, a
    place of funeral homes filled with black bunting and monochrome banners haunted
    by the ghosts of the sugar magnates who had once made their fortunes on the maritime
    trade with Java, and whose imposing offices once stood here as a symbol of colonial
    magnanimity.


    The heat rose and by midday the inhabitants of the city bore it with raised newspapers
    and parasols. They were glum and stoic in their minimal clothes, and I wandered
    down to the ferry terminal behind the Vic Hotel to soak up the coolness of the
    ocean. From there, the interval of ordinariness was impressive in its potency.
    The junks with their mulberry sails, the lights of the Kerry Hotel across the
    water coming at dusk, the ferries packed with miserable perspirers bearing fans,
    and the edges of the mountains a colour of old tea at the end of daylight. It
    was around this time that bodies had begun to appear in those same waters, quietly
    retrieved by police boats that reporters were not permitted to approach, the first
    intimations of a new form of intimidation, a new configuration of the chessboard.


    I sometimes retreated into the Vic, which was popular with middle-class landers
    and since renamed, and went up to the somnambular bar on the roof to watch the
    sunsets. I even brought my trunks on occasion and took an illegal dip in the hotel
    pool among the slightly nervous couples from the other side of the border. I suppose
    it was a matter of any-'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'where but stifling little apartment at the Garland. Yet I was never lonelier
    than when I was in my own neighbour-hood and nowhere was more lonely than the
    top of the Vic Hotel as night came down.


    IT WAS THERE THAT I used to think of Jimmy Tang and the days many years before
    when we had studied together at Clare College, Cambridge, and, among other things,
    had worked together in our spare time on a translation of Li Po’s ‘The Exile’s
    Letter’. It was one of the most famous Chinese poems of the Tang period, perhaps
    the most famous, erratically translated by Ezra Pound, and our desire to embark
    on a new version was inspired by the fact that Pound himself had not been able
    to speak a word of Chinese. We found this amusing, if not preposterous. He had
    merely used the notes of the American scholar Fenollosa. And yet, Jimmy used to
    say, his interpretations were almost as haunting as the original. Beyond that,
    his translations of Li Po had introduced Chinese poetry to Western readers for
    the first time. How could it be? Pound, however, invented the title for English-readers,
    as well as turning the poet’s correct name – Li Bai into ‘Li Po’. The original
    was ‘Remembering Our Excursion in the Past: A Letter Sent to Commissary Yen of
    Ch’ao County’.


    Jimmy was a scion of one of Hong Kong’s wealthiest families, and I was a scholarship
    boy from a small town no one has ever heard of. But being at university together
    had made us equals. Now, more or less a quarter of a century later, we'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'were friends again in the very different environment of Hong Kong, and the
    gap, of course, had reappeared. He was a millionaire socialite, I was a struggling
    – and one could fairly say declining – reporter. Even when we were undergraduates
    I had sensed that he was someone who might slip between your fingers and disappear,
    even though he had always appeared so radiantly solid, so armed with life’s gifts.
    Even then, among only a handful of people studying Chinese in medieval university,
    we had shared some kind of mental territory that was invisible to other people.
    Tenuously, we still did.


    I recall a morning in October when we had just started our first term: I caught
    sight of him crossing the college court. Only eighteen, a little younger than
    myself, he was walking in cricket whites with a Chinese girl towards the river,
    his shoulders draped in a cable sweater, leaving behind him strange trail of water
    drops on the paving. They looked as if they were drenched from head to foot, as
    if they had been for a swim in the very river they were now walking towards. Alone
    in a little cell, I was the friendless provincial state-school boy studying Chinese
    because it was exquisitely unfashionable but, to at least, also a seductively
    unattainable-subject. And it wouldn’t be an exaggeration to say that this couple
    trailing drops and holding hands in the shadows of the Clare court were unlike
    anyone else that I had ever encountered.


    Later that term, after we had become acquaintances, Jimmy gave me a copy of Izaak
    Walton’s The Compleat An-Angler, which his father in Hong Kong had in turn given
    to him'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'when he was fourteen. Therein was the observation, well known to anglers over
    the centuries, about the sadistic use of frogs as bait: ''Use him as though you
    loved him, that is, harm him as little as you may possibly, that he may live the
    longer.''


    You could see why a ruthless billionaire father would give such a book to his
    son, and why Jimmy would carry it around with him as he went to study among England’s
    lazy elite. At the time, however, he simply said that it was the wisest book he
    could imagine for learning how to live, since life really was like fishing. It
    required patience, cunning and an ability to sit still for long periods, paying
    attention to unmoving waters. It encouraged a taste for quiet killing. The Compleat
    Angler’s other advantage was that no one else in Hong Kong had ever read it. It
    was secret knowledge, a manual of guile and persuasion. Latterly, I never mentioned
    that book to him because it felt like a slightly precarious affection on the part
    of Tang father and son. I wondered if he still thumbed through it at critical
    moments.


    When you look back on who you were when you were eighteen, just before the corruption
    sets in, you’re bound to make a small and unconvincing monument out of that shines
    only during restless nights when you cannot sleep. You need to slightly falsify
    your vanished self, to varnish him. But at the same time it’s eighteen-year-old
    self, cast off an old skin, by whom you should be judged whenever you look in
    the mirror. He is the only judge who matters. Do you continue to disappoint him?
    Can there be any other outcome? What would he say to you?'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'When I looked back it was obvious why we had become friends at Clare. Neither
    of us belonged in that environment. The trappings of the English upper classes
    were not ours. Jimmy already had his position in the wider world because, although
    he came from a colony, it was a rich and vital one. It was I who was the peasant.
    A peasant who had learned to turn verbs in Chinese, but a peasant nonetheless.


    I like to think he felt sorry for me; maybe he did. Or else I was the frog with
    a hook in his mouth and he was the one harming me as little as possible. I would
    see him every day at lectures and in Mandarin classes, and, as is the way with
    students, it only took a couple of weeks before we were on nodding and then speaking
    terms. By Christmas of our first year we were going to the Eagle every evening,
    or Waffles on Fitzroy Street, or the Indian next to New Hall, and he had assumed
    over me the senior position – better clothes, better hair, more spending power
    and more literary candle-power. It was the head start that the rich always enjoy.
    Fast out of the blocks, they can be outpaced only later in life, when it’s usually
    too late. I calculate that it gives them a fifteen-year advantage, which is the
    span of time needed to at least draw level with them. By contrast, they often
    burn out early. If you surpass them later in life they will always complain that
    their early advantage was, in reality, a handicap. Jimmy, however, would never
    suffer from disillusion. Although his father already had his future mapped out
    to the last detail, Jimmy told me that he’d declared to the patriarch even before
    he had left for Cambridge that he had decided to become a scholar of Tang poetry
    – and there was nothing vile clan could do to stop him. ‘They’re all psychopaths
    and spendthrifts anyway,’'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'he said to me, as if I were the only person to whom he ever say such things,
    though he later repeated them obses- sively in Hong Kong. ‘I have an uncle who
    has a different car for every day of the week. Colour-coded. My grandfather made
    his money in the gambling dens in the ’40s. They were racketeers from Shanghai,
    that’s all. It’s what I am, too, if you look hard enough.’


    He was fond of reminding me that the first British came- teries in Hong Kong specifically
    excluded the Chinese dead. ‘But you let us in eventually – as corpses.’ His English,
    ac- qu at the Diocesan Boys’ School on Argyle Street in Hong Kong, was faultless
    and almost without accent. He never talked about his years at Millfield school
    later on, and I learned never to ask about them. He was more interested in my
    school, a secondary modern in the English country- side. That was true exoticism
    for him. He was fascinated by the class machinery behind such an establishment.
    When I told him that I had passed much of my teenage years being groomed to be
    a qualified mechanic, he nodded and said, ‘Yes, that might have been better. Now
    you’ll have nothing but a useless Chinese Studies degree. And who among West-
    ern literates reads Chinese poetry these days?’ It was possible that he didn’t
    believe this other hypothetical future. But one look at my disgusting clothes
    – the eyebrow rose – and he understood that there might be some truth to it. Clothes.
    It was why we first began going to London. Clothes were never trivial to him,
    as they were to serious people. When talking about Maoism, for example, he would
    just grimace and say, ‘Yes, yes, I understand, but the clothes, comrade, the clothes.’'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'He got fitted at Dege & Skinner and bought me hats Lock & Co. that were, I
    thought at the time, too old for me but which he gave me the confidence to wear.
    I was the only person in my year to own a panama hat who had the gall to actually
    wear. I found that I didn''t know my own capital city at all, but Jimmy knew it
    intimately from a thousand Tang family expeditions. I didn''t know anything about
    anything. I had never been to a restaurant there. Never spent a night in a hotel,
    never drunk wine, never taken a black cab, never been to a nightclub or a theatre
    and had never been to any site of note except for the British Museum and Karl
    Marx’s grave in Highgate Cemetery, taken to them by my grandfather: the high-minded
    pilgrages of the working class. It would have been difficult to describe to Jimmy
    the scene with the old man, a retired bus driver from Bevenendance, standing before
    the Zardoz-like head of Marx in the rain. He, eyes filled with tears, arms piled
    with votive flowers; me, shivering and unmoved behind him. Jimmy Tang, scion of
    a family who had fled the Communists in China, would have quipped that at least
    Jewish Marxists got to be buried there.


    For Jimmy, my ‘re-education’ was a Pygmalion game, which he played with an inbuilt
    skill. It kept me in my place, though in a subtle and often unnoticeable way.
    And yet it also let him – perversely – into the English social game to which Millfield
    never opened the doors. But then again, there was Chinese poetry, that cathedral
    in the landscape of words. It was with Jimmy that I learned to recite correctly
    and to sink into its rhythms. The poem about seeing off Meng Haoran at Yellow
    Crane Tower was the first Li Bai taught me to recite, making me similar to a billion
    Chinese school-'
