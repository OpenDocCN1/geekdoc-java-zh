  md: '# ONE


    THOUGHT, IN THOSE DESPERATE AND FORGOTTEN days, of that passage in a novel I had
    read in school where the narrator insists that he prefers to be known as a reporter
    rather than as a journalist, the humble word better denoting what he does, namely
    transcribing what he sees. Today it’s an even less dishonourable job description.
    I knew all the journalists in Hong Kong, of course, but I also knew a fair number
    of the reporters – the citizens trailing the city’s movable war zones, often like
    me all alone with a phone camera, and over time I had become more comfortable
    among them without consciously knowing why. But then what were we describing and
    for whom? I wasn’t sure about that either. For myself, perhaps, and a few others
    scattered across the globe, such as I liked to imagine it, it would depend on
    how deep you wanted to go into yourself. Some of these reporters had become strangely
    famous.


    They were unlike me in that respect. Although I had been in Hong Kong for more
    than twenty years, slaving away as a reporter factotum gradually persevering his
    way into higher echelons of respectability, I had never made a name for'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'myself in my adopted city. People knew me vaguely as a writer of something
    or other, and a fairly infamous glutton, but little more than that. I had gone
    there when still a young man, chilled to the marrow by London and its prospects,
    more important, unable to see myself succeeding in that tomb of a city. I had
    arrived in Hong Kong just after the Handover, knowing nobody except my old university
    friend Jimmy Tang, and equipped only with a single suitcase and savings of five
    thousand sterling. I had done well given those inausicious beginnings, but I had
    never become a star writer. And in a way I didn’t mind at all. I had worked for
    a variety of newspapers, enjoyed a stint as a restaurant critic, married and divorced,
    accumulated a small apartment and perfected the Chinese I had studied at university.
    In other words, I was an excellent nonentity.


    IN FACT, AT THE beginning of that summer, when the disturbances had first erupted,
    I felt as though I were being woken from a deep and meaningless sleep. The city
    I had grown so used to – comfortable, cynical, overflowing with wine dinners and
    white-truffle events – was shattered the first moment I saw one of my neighbours
    wander onto Java Road at midnight in a white sleeveless shirt wielding a butcher’s
    knife. I knew the man by face if not by name because I saw him every other day
    at Fung Shing, the restaurant on that same Java Road where I spent much of my
    time drinking tea with guan tang jiao soupy dumplings and editing my reports.
    I think he recognised me, too, but I was invisible to'
  merge: -1
  img_proc: true
- pgno: 16
  md: "him in that moment on the street at midnight because he was\nthere looking\
    \ for protestors to intimidate, and a Chinese civil\nwar doesn’t automatically\
    \ include European drifters.\n\nLater, it was true, certain expatriated foreigners\
    \ would in-\ndeed become local heroes in the conflict that consumed the\ncity\
    \ that summer, like the Frenchman with no legs de-\nclaimed his solidarity with\
    \ the students while standing precari-\nnously on his prostheses and orating to\
    \ thrilling effect. I never\nfound out his name, though I was resolved to buy\
    \ him a drink\nif I saw him eating alone in a cheap restaurant. He was\nknown\
    \ merely as the Frenchman with No Legs. As for the\fellow knife-wielding diner\
    \ at Fung Shing, I never knew his\nname either, but he would reappear like the\
    \ ghost in a folk-\ntale, never losing his power to disquiet.\n\nHe was one of\
    \ the countless Fujianese immigrants con-\nrated in North Point, the neighbourhood\
    \ where I lived,\nwhich had long been a bastion of pro-Beijing nationalist sen-\n\
    timent. Still speaking Mandarin instead of Cantonese, they\nwere an island among\
    \ the sea of Hong Kongers who other-\nwise barely noticed them. Their moment of\
    \ vindicating the\nMotherland had come, and when they achieved critical\nmass\
    \ — for example at Fung Shing at about 9 p.m – they\nacquired a belligerent confidence\
    \ even as they were huddled\naround pots of tea and after-dinner doughnuts, a\
    \ delicacy\ncarried from table to table on sugary trays after the main\ncourses\
    \ had been served. Since they regarded foreigners with\nsuspicion at the best\
    \ of times and now associated us with the\ndemonic prospect of democracy, I wondered\
    \ if they, and he,\nwere now my enemy. And even if they had drawn no blood"
