  md: '# TWO


    THE TANGS LIVING BELOW MAGAZINE GAP ROAD IN THE Mid-Levels in a building called
    Borrett Mansions. These fortress-like luxury tower blocks stood at the end of
    a narrow lane called Bowen Road, which burrowed through tropical forest crowded
    with creeper vines and ficus roots as it rose towards the rusticated walls of
    the Mansions. Here, on the ground floor of which were surprisingly modest Art
    Decystyle lobbies, it felt as if time had stood still since about 1970. Raised
    high above the city, the air around the Mansions smelled of moss and wet bark,
    and a mountain chill touched my face as soon as I got out of the car. It had rained
    just an hour before. The hillside of ferns and creepers around me dripped quietly
    as I walked across the back entrance lane to the lobby that served their apartment
    on the fifteenth floor.


    A doorman was already there ahead with the door held open. He knew me and skipped
    to the lift, knowing already which ivory button to press. But I had never learned
    his name. As I stood by the metal frame of the lift, in tune with its 1930s British
    style, he looked me up and down as if deciding whether my shoes were good enough.
    A weekend night on the Mid-Levels and in politically uncertain times. I'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'would have guessed most of the wealthy inhabitants of the Mansions were already
    elsewhere in the world. The money was flowing outwards, an unstoppable tide driven
    by despair at what was unfolding in their city. When the doors opened, however,
    a maid was there to greet arrivals. Recalling me, she said, ‘How are you, Mr Gyle?’
    as we travelled up to the people richer than we were, exchanging a look of shared
    melancholy.


    It was a gathering of about fifteen people, a dinner more than a party. But the
    Tang didn’t like sitting around a table and so guests were served anywhere they
    happened to be seated. I, too, liked that way. They were knowing hosts and made
    no missteps when it came entertaining at home. Melissa Tang opened the door; clearly,
    the doorman had announced me. She was in a black cashmere cardigan and velvet
    trousers, casual for her, and because they were the same colour the only thing
    eye noticed was her collar of pearls. It was dramatic and chic; she was always
    like that. It was also the old apartment of her father, the eccentric millionaire
    Rodney Chow, and his carpeted rooms and Ming terracottas collected from China
    made her comfortable. The Chows were as wealthy as the Tangs, though they had
    made their money in manufacturing and television stations. Rodney, a cantankerous
    old-timer fond of jacquard smoking jackets and Swedish girls, was often to be
    seen both at the Tang’ soirée and about town, though I rarely interacted with
    him since I feared and disliked him. Rodney’s outsize taste was everywhere apparent.
    One of those priceless terracottas was a life-size horse, its neck garlanded with
    earthy bells, standing like a guardian deity in the vestibule. Whenever Melissa'
