  md: '# LAWRENCE OSBORNE


    Born in England, Lawrence Osborne is the author of the critically acclaimed novels
    The Forgiven, The Ballad of a Small Player, Hunters in the Dark, Beautiful Animals,
    Only to Sleep (a Philip Marlowe novel, commissioned by the Raymond Chandler estate)
    and The Glass Kingdom. His non-fiction ranges from memoir through travelogue to
    essays, including Bangkok Days, The Naked Tourist and The Wet and the Dry. His
    short story ''Volcano'' was selected for Best American Short Stories 2012.


    The Forgiven, starring Ralph Fiennes, Matt Smith and Jessica Chastain was released
    in 2022. Osborne lives in Bangkok.'
