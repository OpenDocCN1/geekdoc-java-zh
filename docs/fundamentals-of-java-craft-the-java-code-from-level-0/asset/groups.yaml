    - collect(..) enables you to collect the elements of a stream into various types
    of collections, such as lists, sets, maps, or even custom collectors.

    - The strategy for this reduction operation is provided via the Collector interface
    implementation class.


    To understand the collect(..) method , we have to understand Collector Interface
    first.


    A mutable reduction operation accumulates input elements into a mutable result
    container.


    If it''s parallel then it will transform the accumulated result into a final result
    after all input elements have been processed.


    Reduction operations can be performed either sequentially or in parallel.


    Examples of mutable reduction operations include:


    +   1. accumulating elements into a Collection

    2. concatenating strings using a StringBuilder

    3. computing summary information about elements such as sum, min, max, or average'
  - '[PAGE 372]


    4. computing "pivot table" summaries such as "maximum valued transaction by seller",
    etc.


    The class Collectors provides implementations of many common mutable reductions.


    A Collector is specified by four functions that work together to accumulate entries
    into a mutable result container, and optionally perform a final transform on the
    result(in case of parallel reduction operation).


    +   1. **supplier**: this function creates a new mutable result container.this
    function may be called multiple times if you are using parallel Stream.it will
    return a fresh value each time.

    2. **accumulator**: its stateless by nature.it used to fold an element into a
    result container

    3. **combiner**: combining two result containers into one

    4. **finisher**: it''s stateless by nature.it accepts two partial result containers
    and merges them together to get the final result.


    +   - Reduction operation can be parallel or sequential.

    - A sequential implementation of a reduction using a collector would create a
    single result container using the supplier function, and invoke the accumulator
    once for each input element.

    - A parallel implementation would partition the input, create a result container
    for each partition, accumulate the contents of each partition into a sub-result
    for that partition, and then use the combiner to merge the subresults into a combined
    result.


    To ensure that sequential and parallel executions produce equivalent results,
    the collector functions must satisfy an identity and an associativity constraints.


    # What is associativity constraint


    The associativity constraint states that the grouping of operations should not
    affect the final result. In mathematical terms, for any values a, b, and c'
  - '[PAGE 373]


    The importance of this to parallel evaluation can be seen if we expand this to
    four terms:


    ```

    a op b op c op d == (a op b) op (c op d)

    ```


    We can evaluate (a op b) in parallel with (c op d), and then invoke op on the
    results.


    Examples of associative operations include numeric addition, min, and max, and
    string concatenation.


    +   - In Streams, associativity constraint is important when performing parallel
    reductions

    - Parallel streams split the data into multiple chunks and process them concurrently.

    - binary operation must be associative for correct result.


    # What is identity constraint


    The identity constraint states that, there must be an identity element (also known
    as an identity value or neutral element), when combined with any other element,
    does not change the value of that other element.


    In mathematical terms, for any value a:


    ```

    identityElement op a = a op identityElement = a

    ```


    # Collector


    ```

    <R,A> R collect(Collector<? super T,A,R> collector

    Performs a mutable reduction operation on the elements of this stream.

    It is useful when we are utilizing the Collectors class to provide built-in Collector
    implementation.

    ```'
  - '[PAGE 374]


    ```

    String names[]={"Ram","Shyam","Mohan","BhanuPratap"};

    Set<String> collectNames=Arrays.stream(names)

    .collect(Collectors.toSet());

    System.out.println(collectNames);

    ```


    # Let''s look into another overloaded method:


    collect(Supplier<R> supplier, BiConsumer<R,? super T> accumulator, BiConsumer<R,R>
    combiner)

    Performs a mutable reduction operation on the elements of this stream.


    Here you can pass any Collector instance , we will have a walkthrough on Callector
    later.


    # How does the collect method work?


    Let''s consider a use-case: convert array elements to comma separated values.


    Input: [a,e,i,o,u]


    Output: a,e,i,o,u OR aeiou'
  - '[PAGE 375]


    +   - The supplier function is returning a new StringBuilder object in every call.


    +   - The accumulator function is appending the list string element to the StringBuilder
    instance.


    +   - The combiner function is merging the StringBuilder instances. The instances
    are merged with each other with a comma between them.


    +   - In the first case, we have a sequential stream of elements. So they are
    processed one by one and there is only one instance of StringBuilder. There is
    no use of the combiner function. That''s why the output produced is "abcde".


    +   - In the second case, we have a parallel stream of strings. So, the elements
    are processed in parallel and there are multiple instances of StringBuilder that
    are being merged by the combiner function. Hence, the output produced is "a,b,c,d,e".


    Lets understand the terms supplier,accumulator and combiner with code.'
