    \ variable.\n\nElements of an array are stored in a contiguous memory location.\n\
    \nThey are objects that can hold a fixed number of elements, and each element\
    \ has an index used to access it.\n\nWe used to provide the array size during\
    \ its declaration only.\n\nIndexing in an array starts from 0, so the 1st element\
    \ of the array is stored at the 0th index, the 2nd element is stored on the 1st\
    \ index and so on.\n\n| 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | ... |\n|---|---|---|---|---|---|---|---|---|\n\
    \n## Syntax:\n\n```\ndata_type arrayName[ ];\ndata_type[ ] arrayName;\n```\n\n\
    ## Example:\n\n```java\nint numbers[];\nString names[];\nint[] pinCode;\nInteger\
    \ dates [];\n```\n\n```java\n// thus it is of type 'int'\n// it will accept only\
    \ 'int' type elements\nint numbers[];\nString names[];\n```\n\n## Array Initialization\n\
    \nOnce Array is declared we can simply initialize them OR we can directly initialize\
    \ with declaration.\n\n```java\nint arr[]=new int[5];\nint numbers[]={1,2,3,4,5,6};\n\
    String names[]={\"Raj\",\"Heera\"};\n\nFloat arrFloat[]=new Float[4];\n```\n\n\
    ```java\nint[] anArray = new int[] {1, 2, 3, 4, 5}; //it will have 5 elements\
    \ starting from index 0\n```\n\n## How to access value from an Array:\n\nAs we\
    \ know, Array is a collection of similar data type elements, so elements of an\
    \ array can be accessed through index. Index starts from 0 in the array.\n\n```java\n\
    int numbers[]={1,2,3,4,5,6};\n```\n\nHere we have 6 elements in this array, index\
    \ will start from 0 so element 1 will be at 0th position.\n\nWe can simply access\
    \ this element using index.\n\nNumbers[0] WILL be 1\n\n1st element=0th position\
    \ i.e value= 1\n2nd element=1st position i.e value= 2\n3rd element=2nd position\
    \ i.e value= 3\n\n## Example:\n\n```java\npackage org.example.arrayDemo;\n\npublic\
    \ class ArrayTestDemo {\n    public static void main(String[] args) {\n\n    \
    \    int numbers[]={1,2,3,4,5,6};\n\n        int num1=numbers[0]; //0th index\n\
    \        int num2=numbers[1]; //1st index\n\n        System.out.println(\" # num1\
