    # Wrapper Class


    As the name suggests, wrapper class used to wrap primitive data type to Object
    type.


    Java has provided wrapper classes for each primitive data type.


    Primitive data types like int, char, and float are simple and efficient for basic
    data storage, but they NOT best to work with objects and perform certain operations.
    To bridge this gap between primitive types and objects, Java provides a set of
    wrapper classes. Wrapper classes are a group of classes that encapsulate primitive
    data types, allowing them to be treated as objects.


    Below are the primitive data type available in java:


    # Primitive Data Types


    ![](img/199017295e77c8cc572552acdaf8f7fc_234_0.png)


    Java is object oriented programming language where we mostly do our operation
    using objects only so it it is always recommended to use object data type for
    our requirement.so it''s always best practice to use wrapper classes instead of
    using primitive data types.


    You can simply convert primitive data types to corresponding wrapper classes in
    java.


    Each Wrapper class in java has a constructor that takes a single argument of the
    corresponding primitive data type. For example, you can use the Integer class
    to convert an int value into an Integer object:


    ```

    int number = 100;

    ```

