  mdcn: "\n\n## 使用 finally 块的 try-catch\n\nfinally 块与 try、catch 块配合使用。\n\n无论是否抛出异常，它都会执行。\n\
    \nfinally 块用于执行重要的语句，例如关闭语句、释放资源、释放内存或任何你想要执行的代码段。\nfinally 块可以配合 try 块使用，也可以不带\
    \ catch 块。\n\n如果你在代码中有 finally 块，那么一旦发生异常，控制权将进入 finally，然后进入 catch 块。\n\n\"finally\"\
    \ 块用于执行程序的必要代码。无论异常是否被处理，它都会执行。\n\n```java\ntry {\n  // 可能会抛出异常的代码\n}\ncatch(Exception\
    \ e)\n{\n  // 任何消息或异常的替代方案\n}\nfinally\n{\n  // 关闭资源\n}\n```\n\n```java\npackage\
    \ org.example.exception.exception;\n\npublic class ExceptionDemo {\n    public\
    \ static void main(String[] args) {\n\n    int num=10;\n    try {\n        int\
    \ result = num / 0;\n    }\n    catch (Exception e){\n        System.out.println(\"\
    ### Number cant be divided by ZERO\");\n    }\n    finally {\n        System.out.println(\"\
    ### This is finally block\");\n    }\n  }\n}\n```\n\n## 结果:\n\n/Users/aray/Library/Java/JavaVirtualMachines/openjdk-21/Contents/Home/bin/java\
