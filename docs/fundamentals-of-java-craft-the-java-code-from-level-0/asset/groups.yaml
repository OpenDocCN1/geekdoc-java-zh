    安全性：Java 具有内置的安全功能，有助于保护系统免受有害活动。Java 运行环境（JRE）使用安全管理器控制对资源的访问并确保 Java 应用程序的安全。


    Java 广泛应用于各个领域，包括 Web 开发、移动应用开发（Android 应用通常用 Java 编写）、企业级应用以及大型分布式系统。由于其可移植性、可靠性和广泛的社区支持，几十年来一直是一种受欢迎的编程语言。


    ## Java 历史


    Java 的历史始于 20 世纪 90 年代初，当时由 James Gosling、Mike Sheridan 和 Patrick Naughton 领导的
    Sun 微系统（Sun Microsystems）工程师团队启动了一个名为“Green”的项目。Green 项目的目标是为消费电子开发软件，包括交互式电视。然而，随着项目的演进，团队意识到他们的工作在消费电子领域之外的潜力。


    以下是 Java 历史关键事件的时间线：


    - 1991 年：Green 项目在 Sun 微系统启动。这个被称为“Green Team”的团队为嵌入式系统构思了一种新的编程语言。

    - 1992 年：由于 Gosling 办公室外的一棵橡树，项目被更名为“Oak”。Oak 的设计侧重于可移植性和在各种设备上运行的能力。

    - 1995 年：Oak 正式更名为“Java”。更名是因为商标问题，当时已经有一家名为 Oak 的计算机公司。Java 编程语言发布，口号是“编写一次，到处运行”（Write
    Once, Run Anywhere, WORA），强调了它的平台无关性。

    - 1996 年：Java 1.0 发布，标志着该语言第一个正式版本的诞生。它包含了关键特性，如 applet（可以嵌入网页的小型、可下载程序）和 Java
    虚拟机（JVM）。

    - 1997 年：Sun 微系统发布 Java 1.1，引入了内部类、JavaBeans 和 JDBC（Java 数据库连接）API。

    - 1998 年：Java 2（也称为 J2SE 1.2）发布。该版本带来了重大增强，包括 Swing GUI 工具包、集合框架（Collections framework）以及
    Java 命名和目录接口（JNDI）。

    - 2004 年：随着 Java 5（J2SE 5.0，代号为“Tiger.”）的发布，Java 经历了重大重构。该版本引入了泛型、元数据注解、枚举类型和增强循环。


