    # Open-Closed Principle (OCP)


    **Idea:** Software entities(classes, modules, functions) should be open for extension
    but closed for modification.


    **Example:** Instead of modifying existing code, you should be able to add new
    features through extensions. Think of it as adding new layers to a cake without
    changing the existing layers.


    **Example:** Imagine a shape drawing application. You can add new shapes without
    changing how existing shapes are drawn. For instance, you can add a new "Triangle"
    class without modifying the existing "Circle" or "Square" classes.


    The open/closed principle states that classes should be open for extension but
    closed to change.

    A class is considered "closed" to editing once it has:


    +   - Been tested to be functioning properly. The class should behave as expected.

    - All the attributes and behaviors are encapsulated,

    - Been proven to be stable within your system. The class or any instance of the
    class should not stop your system from running or do it harm.


    Although the principle is called "closed", it does not mean that changes cannot
    be made to a class during development. Things should change during the design
    and analysis phase of your development cycle. A "closed" class occurs when a point
    has been reached in development when most of the design decisions have been finalized
    and once you have implemented most of your system.'
