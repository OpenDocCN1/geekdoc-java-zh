    \ {\n    return OrganizationsService.super.getOrgName();\n}\n```\n\n# 访问修饰符\n\n\
    访问修饰符是定义程序中类、方法和字段可见性或可访问性的关键字。这些修饰符控制其他类或程序的哪些部分可以访问所声明的元素。\n\nJava 有四种主要的访问修饰符：\n\
    \npublic\n\npublic 修饰符使类、方法或字段可以从任何其他类访问。它具有最广泛的范围，并允许无限制的访问。\n\n```java\npublic\
    \ class MyClass {\n    public int publicVariable;\n    public void publicMethod()\
    \ {\n        // 此处编写代码\n    }\n}\n```\n\n在上面的示例中，publicVariable 和 publicMethod\
    \ 可以从任何其他类访问。\n\nPrivate (private):\n\nprivate 修饰符将类成员的可见性限制在在其所属类内部。它提供了最严格的访问限制。\n\
    \n```java\npublic class MyClass {\n    private int privateVariable;\n    private\
    \ void privateMethod() {\n        // 此处编写代码\n    }\n}\n```\n\n在这里，privateVariable\
    \ 和 privateMethod 只能在 MyClass 内部访问。\n\nProtected (protected):\n\nprotected 修饰符允许访问同包内的成员以及子类（即使子类在不同的包中）。\n\
    \n```java\npublic class MyClass {\n    protected int protectedVariable;\n    protected\
    \ void protectedMethod() {\n        // 此处编写代码\n    }\n}\n```\n\nprotected Variable\
    \ 和 protectedMethod 可以被同一个包中的类以及子类访问，无论是在同一个包中还是不同的包中。\n\n# Default（包私有，无修饰符）：\n\
    \n如果没有指定访问修饰符（默认或包私有），该元素在同包内可访问，但不能从包外部访问。\n\n```java\nclass MyClass {\n    int\
    \ defaultVariable;\n    void defaultMethod() {\n\n// 此处编写代码\n}\n}\n```\n\n在这里，defaultVariable\
    \ 和 defaultMethod 可以被同一个包内的类访问，但不能被不同包的类访问。\n\n根据程序所需的封装和安全性选择合适的访问修饰符是非常重要的。使用访问修饰符有助于强制封装、提高代码重用性，并防止对代码某些部分的未经授权的访问。\n\
    \n# OOP 概念：\n\n面向对象编程 (OOP) 是一种使用对象——类的实例来组织和结构代码的编程范式。Java 是一种面向对象的编程语言，它支持的\
    \ OOP 概念。\n\n以下是 Java 中主要的 OOP 概念：\n\n# 类和对象\n\nclass : 类是创建对象的蓝图或模板。它定义了类对象将具有属性（字段）和行为（方法）。\n\
    \n```java\npublic class CarDemo {\n    // 类属性（字段）\n    String model;\n    int\
    \ year;\n\n    // 类方法\n    void startEngine() {\n        // 启动引擎的代码\n    }\n}\n\
    ```\n\nObject: 对象是类的实例。它代表一个真实的实体，并可以自己独特的状态和行为。\n\n假设我们有一个 Student 类，其中包含 model\
    \ 和 year 属性。\n\n```java\npackage org.example;\n\npublic class Student {\n    String\
    \ name;\n    int roll;\n\n    public String getName() {\n        return name;\n\
    \    }\n\n    public void setName(String name) {\n        this.name = name;\n\
    \    }\n\n    public int getRoll() {\n        return roll;\n    }\n\n    public\
    \ void setRoll(int roll) {\n        this.roll = roll;\n    }\n\n    Student(String\
    \ name, int roll) {\n        this.name = name;\n        this.roll = roll;\n  \
    \  }\n\n    public static void main(String[] args) {\n        //创建 name=\"Raj\"\
    \ 和 123 的 Student 对象\n        Student student = new Student(\"Raj\", 123);\n \
    \       System.out.println(\"student data:\"+student);\n    }\n}\n```\n\n# 封装\n\
    \n封装是将（属性）和操作数据的方法封装在一个单元（类）中。\n\n封装是将变量和方法包装成一个类的方式。\n\n如图像所示，这个胶囊包含了多种成分，这些成分帮助我们从疾病中康复。\n\
    \n在 java 中，类也包含不同的属性和方法，帮助我们执行某些任务。这里整个类像胶囊一样工作。\n\n封装只是将属性和方法封装在类中的方式。\n\n![](img/199017295e77c8cc572552acdaff7fc_76_0.png)\n\
    \n```java\npublic class BankAccount {\n    private double balance; // 封装的属性\n\n\
    \    // 访问余额的公共方法\n    public double getBalance() {\nreturn balance;\n    }\n\
    \    // 存款的公共方法\n    public void deposit(double amount) {\n        balance +=\
    \ amount;\n    }\n}\n```\n\n# 继承\n\n继承是一种允许类（子类/派生类）继承另一个类（父类/基类）属性和行为的机制。\n\n\
    继承是一种类获取另一个类属性的机制。\n\n例如，孩子继承父母的特质。\n\n通过继承，我们可以重用现有类的字段和方法。因此，继承促进了重用，是 OOP 的重要概念。\n\
    \n它促进了代码重用并建立了类与类的关系。\n\n在设计软件时，关注点分离是最重要的方面之一。我们通常将公共的属性和方法放在父类中，其他类只需继承这些共同行为。这就是继承。在\
    \ Java 中，子类使用 extends 关键字来继承父类的特征。\n\n"
