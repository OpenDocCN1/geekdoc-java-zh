    # Why can''t we create objects of an abstract class ?


    In Java, you cannot create an object of an abstract class directly because abstract
    classes may have abstract methods without implementations. An abstract class is
    meant to be a base class or a blueprint for other classes, and it often contains
    incomplete or abstract methods that need to be implemented by its subclasses.


    # Incomplete Implementation:


    Abstract classes may have one or more abstract methods, which are methods declared
    without a body.

    Since abstract lack an implementation in the abstract class itself, it would be
    inappropriate to create an object of the abstract class because the object would
    be incomplete or lack certain functionalities.


    # Enforcing Subclass Implementation:


    Abstract classes are designed to be extended by other classes.

    The abstract class provides a common structure, including abstract methods, and
    expects its subclasses to provide the specific implementations for those abstract
    methods.

    Creating an instance of an abstract class without concrete implementations for
    its abstract methods would violate the contract defined by the abstract class.


    # Abstract Classes as Blueprints:


    Abstract classes often serve as blueprints or templates for other classes.

    They encapsulate common functionality and provide a basis for customization in
    subclasses.

    Since abstract classes may lack complete implementations, they are not suitable
    for direct instantiation.'
