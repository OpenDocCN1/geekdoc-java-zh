    # Abstract Methods:


    Abstract methods are declared in abstract classes or interfaces and do not provide
    an implementation in the declaring class or interface.


    They define a contract that concrete subclasses or implementing classes must fulfill
    by providing their own implementations.


    # Interfaces:


    Interfaces are another way to achieve abstraction in Java. They consist of abstract
    methods (and, starting from Java 8, default and static methods).


    A class can implement multiple interfaces, allowing it to inherit multiple sets
    of abstract methods.'
