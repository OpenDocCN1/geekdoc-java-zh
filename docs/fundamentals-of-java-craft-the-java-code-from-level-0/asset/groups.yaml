    \   }\n}\n```\n\nResult:\n\n| XYZ pvt ltd |\n| Raj |\n| 10000.0 |\n\n## Abstraction\n\
    \nIn Java, abstraction is a fundamental concept of object-oriented programming\
    \ (OOP) that involves simplifying complex systems by modeling classes based on\
    \ their essential properties and behaviors. Abstraction allows you to focus on\
    \ the relevant details of an object while ignoring unnecessary complexities. In\
    \ Java, abstraction is achieved through abstract classes, interfaces, and abstract\
    \ methods.\n\nHere are key aspects of abstraction in Java:\n\n### Abstract Classes:\n\
    \nAn abstract class is a class that cannot be instantiated on its own and is meant\
    \ to be subclassed by other classes.\n\nWe have already discussed it in detail\
    \ earlier in this section.\n\nExample:\n\n```java\npublic abstract class Shape\
    \ {\n    // Abstract method (to be implemented by subclasses)\n    public abstract\
    \ double calculateArea();\n\n    // Concrete method\n    public void display()\
    \ {\n        System.out.println(\"This is a shape.\");\n    }\n}\n```\n\n## Abstract\
    \ Methods:\n\nAbstract methods are declared in abstract classes or interfaces\
    \ and do not provide an implementation in the declaring class or interface.\n\n\
    They define a contract that concrete subclasses or implementing classes must fulfill\
    \ by providing their own implementations.\n\n## Interfaces:\n\nInterfaces are\
    \ another way to achieve abstraction in Java. They consist of abstract methods\
    \ (and, starting from Java 8, default and static methods).\n\nA class can implement\
    \ multiple interfaces, allowing it to inherit multiple sets of abstract methods.\n\
    \n## Example:\n\n```java\npublic interface Sound {\n  // Abstract method\n  void\
    \ makeSound();\n}\n```\n\n## Hiding Implementation Details:\n\nAbstraction helps\
    \ in hiding the internal details of how a class or method achieves its functionality.\n\
    \nIt allows users of a class or interface to interact with the essential features\
    \ without needing to know the intricacies of the implementation.\n\n## Focus on\
    \ Relevant Details:\n\nAbstraction enables developers to focus on the relevant\
    \ details of a class or order.\n\n## Polymorphism:\n\nAbstraction is closely tied\
    \ to polymorphism, allowing objects to be treated as their abstract types.\n\n\
    ## Example of using:\n\n```java\npublic class Circle extends Shape implements\
    \ Sound {\n  // Implementing abstract methods from Shape and Sound\n  @Override\n\
    \  public double calculateArea() {\n    // Implementation for calculating the\
    \ area of a circle\n    return Math.PI * Math.pow(radius, 2);\n  }\n\n  @Override\n\
    \  public void makeSound() {\n    // Implementation for Sound\n    System.out.println(\"\
    Circles don't make a sound.\");\n  }\n}\n```\n\n## Method Signature\n\nMethod\
    \ signatures consist of method name and argument type.\n\n```\npublic static void\
    \ m1(int number1, float number2)\n```\n\n![](img/199017295e77c8cc572552acdaf8f7fc_91_0.png)\n\
    \n- return type is NOT a part of method signature.\n- Two methods with the same\
    \ signature will NOT be allowed in the same class.\n\n```java\npackage org.example.basic;\n\
    \npublic class MethodSignatureDemo {\n    public void m1() {\n        System.out.println(\"\
    This is method m1..\");\n    }\n\n    public int m1() {\n        System.out.println(\"\
    'm1()' is already defined in 'org.example.basic.MethodSignatureDemo'\");\n   \
    \     return 18;\n    }\n}\n```\n\n## Polymorphism\n\nThe derivation of the word\
    \ Polymorphism from two different Greek Polymorphisms is derived from 2 Greek\
    \ words: poly and morphs. The word \"poly\" means many and \"morphs\" means forms.\
    \ So polymorphism means many forms.\n\nPolymorphism in Java is a concept by which\
    \ we can perform a single action in different ways.\n\nIt refers to the ability\
    \ of a class to take on multiple forms.\n\nThere are two types of polymorphism\
    \ in Java: compile-time (or static) polymorphism and runtime (or dynamic) polymorphism.\n\
    \n### Compile-time Polymorphism (Method Overloading):\n\nMethod overloading allows\
    \ a class to have multiple methods with the same name but different parameters\
    \ (different types or a different number of parameters).\n\nThe compiler determines\
    \ which method to call based on the method signature during compile-time.\n\n\
    If a class has multiple methods having the same name but different in parameters,\
    \ it is known as Method Overloading.\n\nIf we have to perform only one operation,\
    \ having the same name of the methods increases the readability of the program.\n"
  mdcn: "\n\n# 医生\n\n外科医生继承医生的属性。\nIS-A 关系\n\n# 外科医生\n\n## 继承类型：\n\n**单继承：** 一个类继承另一个类（只有一个类）\n\
    \n![](img/199017295e77c8cc572552acdaf8f7fc_81_0.png)\n\n如上所示，类 B 仅继承一个类 A。\n类\
    \ A 是父类，类 B 是子类。\n\n这里类 B 正在从它的父类 A 继承行为。\n\n## 多重继承：\n\n一个类继承多个类。\n\n注意：Java\
    \ 不支持多重继承。\n\n![](img/199017295e77c8cc572552acdaf8f7fc_82_0.png)\n\n如上所示，类 C 从两个类类\
    \ A 和类 B 继承行为，这在 Java 中是不被支持的。一个类只能继承一个类，但它可以实现任意数量的继承（接口）。我们将在本节稍后的部分详细介绍。\n\n\
    ## 多级继承：\n\n一个类可以从一个派生类继承。因此，派生类成为新类的基类。\n\n如此处所示，一个类可以从不同层级的类继承行为。当我们寻找类的层次结构时，曾使用过这种继承关系，其中一个类只继承一个类。\n\
    \n![](img/199017295e77c8cc572552acdaf8f7fc_83_0.png)\n\n如此处所示，类 B 从类 A 继承行为，类\
    \ C 从类 B 继承行为，你还可以根据需要添加更多。我们将在不同级别上不断添加不同的行为，子类将拥有所有父类中所有可用的行为。\n\n在上面的示例中，类\
    \ B 将从类 A 继承行为，类 C 将从类 B 和类 A 继承行为。\n\n## 层次结构继承：\n\n一个类被许多其他子类继承。\n\n![](img/199017295e77c8cc572552acdaf8f7fc_84_0.png)\n\
    \n如此处所示，Shape 是此处的父类，它有 3 个子类：Triangle、Circle 和 Rectangle。\n\n## 通过示例理解继承。\n\n\
    ```java\npublic interface OrganizationService {\n\n    public abstract String\
    \ getEmployeeData(int employeeID);\n    public double getEmployeesSalary(int employeeId);\n\
    \n    //默认方法，如果你想为你的方法添加一些默认实现\n    default String getOrgName(){\n        return\
    \ \"XYZ pvt ltd\";\n    }\n\n    //添加静态方法\n    public static int getOrgId(){\n\
    \        return 234;\n    }\n\n    //添加私有方法，供内部使用\n    private String getOrgKey(){\n\
    \        return \"secret-abc\";\n    }\n}\n```\n\n创建一个 OrganizationServiceImpl\
    \ 的对象并调用方法。\n\n```java\npublic class OrganizationDemo {\n    public static void\
    \ main(String[] args) {\n        OrganizationService organizationService=new OrganizationServiceImpl();\n\
    \n        String orgName=organizationService.getOrgName();\n        String empData=organizationService.getEmployeeData(1);\n\
    \        double salary=organizationService.getEmployeeSalary(2);\n\n        System.out.println(orgName);\n\
    \        System.out.println(empData);\n        System.out.println(salary);\n \
    \   }\n}\n```\n\n结果：\n\n| XYZ pvt ltd |\n| Raj |\n| 10000.0 |\n\n## 抽象\n\n在 Java\
    \ 中，抽象是面向对象编程（OOP）的一个基本概念，它通过根据类的本质属性和行为对类进行建模来简化复杂系统。抽象允许你关注对象的相关细节，而忽略不必要的复杂性。在\
    \ Java 中，抽象通过抽象类、接口和抽象方法实现。\n\n以下是 Java 中抽象的关键方面：\n\n### 抽象类：\n\n抽象类是类不能独立实例化的类，旨在供其他类作为子类使用。\n\
    \n我们在本节稍些时候已经详细讨论过它。\n\n示例：\n\n```java\npublic abstract class Shape {\n    //\
    \ 抽象方法（由子类实现）\n    public abstract double calculateArea();\n\n    // 具体方法\n  \
    \  public void display() {\n        System.out.println(\"This is a shape.\");\n\
    \    }\n}\n```\n\n## 抽象方法：\n\n抽象方法声明在抽象类或接口中，但在声明它的类或接口中不提供实现。\n\n它们定义了一个合约，具体的子类或实现类必须通过提供自己的实现来履行该合约。\n\
    \n## 接口：\n\n接口是 Java 中实现抽象的另一种方式。它们由抽象方法（以及从 Java 8 开始的默认方法和静态方法）组成。\n\n一个类可以实现多个接口，允许它继承多组抽象方法。\n\
    \n## 示例：\n\n```java\npublic interface Sound {\n  // 抽象方法\n  void makeSound();\n\
    }\n```\n\n## 隐藏实现细节：\n\n抽象有助于隐藏类或方法实现其功能的的内部细节。\n\n它允许类或接口的用户与其基本特征进行交互，而无需知道实现的复杂性。\n\
    \n## 关注相关细节：\n\n抽象允许开发者关注类或对象的相关细节。\n\n## 多态：\n\n抽象与多态紧密相连，它允许对象被视为它们的抽象类型。\n\n\
    ## 使用示例：\n\n```java\npublic class Circle extends Shape implements Sound {\n  //\
    \ 实现来自 Shape 和 Sound 的抽象方法\n  @Override\n  public double calculateArea() {\n \
    \   // 计算圆面积的实现\n    return Math.PI * Math.pow(radius, 2);\n  }\n\n  @Override\n\
    \  public void makeSound() {\n    // Sound 的实现\n    System.out.println(\"Circles\
    \ don't make a sound.\");\n  }\n}\n```\n\n## 方法签名\n\n方法签名由方法名和参数类型组成。\n\n```\n\
    public static void m1(int number1, float number2)\n```\n\n![](img/199017295e77c8cc572552acdaf8f7fc_91_0.png)\n\
    \n- 返回类型不是方法签名的一部分。\n- 在同一个类中不允许两个签名相同的方法。\n\n```java\npackage org.example.basic;\n\
    \npublic class MethodSignatureDemo {\n    public void m1() {\n        System.out.println(\"\
    This is method m1..\");\n    }\n\n    public int m1() {\n        System.out.println(\"\
    'm1()' is already defined in 'org.example.basic.MethodSignatureDemo'\");\n   \
    \     return 18;\n    }\n}\n```\n\n## 多态\n\n多态一词（Polymorphism）派源于两个不同的希腊词：poly\
    \ 和 morphs。“poly” 意味着“多”，“morphs” 意味着“形式”。因此，多态意味着多种形式。\n\nJava 中的多态是一种允许我们以不同方式执行单一操作的概念。\n\
    \n它指的是一个类呈现多种形式的能力。\n\nJava 中有两种多态：编译时多态（或静态多态）和运行时多态（或动态多态）。\n\n### 编译时多态（方法重载）：\n\
    \n方法重载允许一个类具有多个同相同但参数不同（类型不同或数量不同）的方法。\n\n编译器在编译期间根据方法签名确定调用哪个方法。\n\n"
