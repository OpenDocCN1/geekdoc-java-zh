    \            .filter(x -> (x%2==0))\n            .forEach(System.out::println);\n\
    \    }\n}\n```\n\n## 结果：\n\n2\n4\n6\n8\n10\n\n考虑一个用例：你有一个包含 1 万名员工的列表，你想过滤出所有名字以\
    \ \"A\" 开头的员工。\n\n### 使用自定义类的 Stream 过滤\n\n让我们先不使用 Stream 来解决这个问题：\n\n```java\n\
