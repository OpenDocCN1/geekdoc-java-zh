    ## Map Stream 数据\n\n- map(Function f) 将每个元素映射为另一种。\n- 来说，我们可以说 map(..) 用于将数据转换为另一种格式。\n\
    - map 方法是一个中间操作，用于转换流的每个元素。\n- 它将给定的函数应用于流的每个元素并返回一个包含转换后元素的流。原始流保持不变。\n\n```java\n\
    class Employee {\n  String name;\n  String email;\n  String city;\n  Double salary;\n\
    }\n```\n\n### 为什么要映射 Stream 数据？\n\n在这里可以看到 Employee 对象有四个属性：name、email、city 和\
    \ salary。假设你有一个员工列表，因此每个员工实例都拥有这 4 个属性，我的需求是获取列表的名字。\n\n所以我们可以简单地将员工实例映射为员工名字，因此结果只包含一个属性（name）。这就是我们使用\
    \ map(..) 方法的地方。\n\n我们可以看到方法声明，它接受一个 Function，Function 是一个函数接口，将接受一个输入并提供一个输出。我们将在后面的部分详细介绍。\n\
    \n```java\nString a[] = {\"Ram\", \"Shyam\", \"Mohan\", \"BhanuPratap\"};\nArrays.stream(a)\
