    **One Reason to Change:** Each class should have only one responsibility or reason
    to change. If there is more than one reason for a class to change, it becomes
    more error-prone and harder to maintain.


    **Cohesion:** The principle encourages high cohesion within classes, meaning that
    the class should contain members (methods and attributes) that are closely related
    and work together to achieve a single responsibility.


    **Separation of Concerns:** It helps in separating different concerns or aspects
    of the software system into distinct classes. This separation makes the system
    more modular and easier to understand, modify, and maintain.


    **Reability:** Classes that adhere to the SRP are often more reusable, as they
    are specialized in a single responsibility and can be used in various contexts.


