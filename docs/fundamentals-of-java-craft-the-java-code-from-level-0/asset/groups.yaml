    \ C is inheriting the behavior from TWO classes Class A and Class B, This is NOT\
    \ supported in Java. One class can extend only one class but it can implement\
    \ any number of Inheritance. We will look into it in detail later in this section.\n\
    \n## Multilevel Inheritance:\n\none class can inherit from a derived class. Hence,\
    \ the derived class becomes the base class for the new class.\n\nAs you can see\
    \ here, A class can inherit behavior from other classes at different levels. we\
    \ used to have such inheritance when we were looking for hierarchy in our classes\
    \ where one class will extend only one class.\n\n![](img/199017295e77c8cc572552acdaf8f7fc_83_0.png)\n\
