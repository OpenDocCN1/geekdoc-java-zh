    # Now what if the compiler didn''t get a method with the same provided type?


    # Automatic promotion in overloading:


    In overloading,method resolution is always taken care by compiler based on reference
    type hence overloading also considered as compile time polymorphism or static
    binding or early binding.


    While resolving overloaded methods, if an exact match is NOT found we won''t get
    any compile time error immediately.first compiler promotes the method argument
    to next level and checks for the method match and it will keep checking to the
    highest level possible.


    If method match found then compiler will consider it and it will make the call
    to this method otherwise compiler promotes the method argument(s) to next level
    this process will be continue until the possible promotion and if match is still
    not found then it will throw compile time error.this is called automatic promotion
    in overloading.


