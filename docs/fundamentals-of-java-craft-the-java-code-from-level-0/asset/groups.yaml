- md: "\n# Result:\n\n```\n### sum 13\n### difference 7\n### product 30\n### quotient\
    \ 3\n### remainder 1\n```\n\n# Relational Operators:\n\n- Equal to (==): Checks\
    \ if two values are equal.\n- Not equal to (!=): Checks if two values are not\
    \ equal.\n- Greater than (>): Checks if the left operand is greater than the right\
    \ operand.\n- Less than (<): Checks if the left operand is less than the right\
    \ operand.\n- Greater than or equal to (>=): Checks if the left operand is greater\
    \ than or equal to the right operand.\n- Less than or equal to (<=): Checks if\
    \ the left operand is less than or equal to the right operand.\n\n```java\nint\
    \ x = 5, y = 8;\nboolean isEqual = (x == y); // false\nboolean isNotEqual = (x\
    \ != y); // true\nboolean isGreater = (x > y); // false\nboolean isLess = (x <\
    \ y); // true\n```\n\n```java\nboolean isGreaterEqual = (x >= y); // false\nboolean\
    \ isLessEqual = (x <= y); // true\n```\n\n# Logical Operators:\n\n- Logical AND\
    \ (&&): Returns true if both conditions are true.\n- Logical OR (||): Returns\
    \ true if at least one condition is true.\n- Logical NOT (!): Returns true if\
    \ the condition is false, and vice versa.\n\n```java\nboolean condition1 = true,\
    \ condition2 = false;\nboolean resultAnd = (condition1 && condition2); // false\n\
    boolean resultOr = (condition1 || condition2); // true\nboolean resultNot = !condition1;\
    \ // false\n```\n\n# Assignment Operators:\n\n- Assignment (=): Assigns a value\
    \ to a variable.\n- Addition assignment (+=): Adds the right operand to the left\
    \ operand and assigns the result to the left operand.\n\n```java\nint num = 10;\n\
    num += 5; // Equivalent to num = num + 5; (num is now 15)\n```\n\n# Unary Operator:\n\
    \nUnary operators are used with only one operand.\n\nFor example, ++ is a unary\
    \ operator that increases the value of a variable by 1.\n\nExample:\n\n```java\n\
    int a=10;\na++;\n// THEN a=11;\n```\n\nDifferent types of unary operators are:\n\
    \n| Operator | Meaning |\n| --- | --- |\n| + | Unary plus: not necessary to use\
