    , \"data.txt\");\n        List<String> lines = Files.readAllLines(filePath);\n\
    \    }\n\n    public static void main(String[] args) {\n        try {\n      \
    \      List<String> data=readFile();\n        } catch (IOException e) {\n    \
    \        throw new RuntimeException(e);\n        }\n    }\n}\n```\n\n如上面的示例代码所示，我们在发生任何错误时抛出异常。在这里我们可以带上适当错误消息抛出适当异常。\n\
