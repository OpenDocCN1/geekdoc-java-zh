    \n- The supplier function is returning a new StringBuilder object in every call.\n\
    - The accumulator function is appending the list string element to the StringBuilder\
    \ instance.\n- The combiner function is merging the StringBuilder instances. The\
    \ instances are merged with each other with a comma between them.\n- In the first\
    \ case, we have a sequential stream of elements. So they are processed one by\
    \ one and there is only one instance of StringBuilder. There is no use of the\
    \ combiner function. That's why the output produced is \"abcde\".\n- In the second\
    \ case, we have a parallel stream of strings. So the elements are processed in\
    \ parallel and there are multiple instances of StringBuilder that are being merged\
    \ by the combiner function. Hence, the output produced is \"a,b,c,d,e\".\n\nLets\
    \ understand the terms supplier,accumulator and combiner with code.\n"
