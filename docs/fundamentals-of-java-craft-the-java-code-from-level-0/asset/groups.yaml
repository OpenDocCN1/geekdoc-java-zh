    \ 作为结果。\n2. Stream 本质上是惰性的。\n3. 在被终端操作调用之前，中间操作不会执行。\n4. 中间操作可以链式调用构建流水线。\n5.\
    \ 中间操作主要用于数据转换和处理。\n6. 可以根据需要将多个中间操作链在一起。\n\n以下是一些中间操作：\n\n- filter()\n- map()\n\
    - flatMap()\n- distinct()\n- sorted()\n- peek()\n- limit()\n- skip()\n\n## 终端操作：\n\
    \n- 1. 终端操作返回一个单一值作为结果。从名称本身就可以想到它只是为了完成 Stream 操作。\n2. 它返回一个单一值作为结果，而不是 Stream。\n\
    3. 它不能与其他任何终端操作链式调用。\n4. 一旦在任何 Stream 上触发了终端操作，你就无法再对该 Stream 执行任何其他操作，作为副作用，它将产生一个值作为结果。\n\
    \n以下是一些 Stream 终端操作：\n\n- anyMatch()\n- allMatch()\n- noneMatch()\n- collect()\n\
    - count()\n- findAny()\n- findFirst()\n- forEach()\n- min()\n- max()\n- reduce()\n\
    - toArray()\n\n通过上面的解释，很清楚 Stream 中间操作用于数据处理和转换，而终端操作用于最终结果收集。\n\n# Stream 方法详解\n\
    \n### 过滤 Stream 数据\n\n`Stream<T> filter(Predicate<? super T>)`\n\n- 如我们所知，filter(..)\
    \ 是中间操作，因此它将返回一个过滤后的数据的 Stream。\n- 返回包含此流中匹配给定谓词元素的流。\n- Predicate 本质上是一个返回布尔值的条件操作。\n\
    - Predicate 接受任何类型的一个输入并返回一个 Boolean 类型的输出。\n- 它用于根据给定条件过滤数据。\n- Predicate 是函数接口（Functional\
    \ Interface），更多信息请参访函数接口章节。\n\n我们可以简单地在任何 Stream 上应用此 filter，以获取给定条件的过滤数据。\n\n\
    Predicate 接收一个输入<T> 并提供一个布尔值。\n\n## 简化代码：\n\n```java\npublic class FunctionalInterfaceDemo\
    \ {\n    public static void main(String[] args) {\n        //创建谓词\n        Predicate<Integer>\
