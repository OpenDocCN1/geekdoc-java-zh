    # Inheritance


    Inheritance is a mechanism that allows a class (subclass/derived class) to inherit
    the properties and behaviors of another class (superclass/base class).


    Inheritance is a mechanism where one class acquires the property of another class.


    For example, a child inherits the traits of his/her parents.


    With inheritance, we can reuse the fields and methods of the existing class. Hence,
    inheritance facilitates Reusability and is an important concept of OOPs.


    It promotes code reusability and establishes a relationship between classes.


    While designing software,separation of concern is one of the most important aspects.
    We used to keep common attributes and methods in the parent class and other classes
    will just inherit that common behavior.This is nothing but an inheritance.


    In Java, when an "Is-A" relationship exists between two classes, we use Inheritance.
    The parent class is called a super class and the inherited class is called a subclass.
    The keyword extends is used by the sub class to inherit the features of super
    class.'
