    \ to fold an element into a result container\n3. **combiner**: combining two result\
    \ containers into one\n4. **finisher**: it's stateless by nature.it accepts two\
    \ partial result containers and merges them together to get the final result.\n\
    \n- Reduction operation can be parallel or sequential.\n- A sequential implementation\
    \ of a reduction using a collector would create a single result container using\
    \ the supplier function, and invoke the accumulator once for each input element.\n\
    - A parallel implementation would partition the input, create a result container\
    \ for each partition, accumulate the contents of each partition into a sub-result\
    \ for that partition, and then use the combiner to merge the subresults into a\
    \ combined result.\n\nTo ensure that sequential and parallel executions produce\
    \ equivalent results, the collector functions must satisfy an identity and an\
    \ associativity constraints.\n\n## What is associativity constraint\n\nThe associativity\
    \ constraint states that the grouping of operations should not affect the final\
    \ result. In mathematical terms, for any values a, b, and c\n\nThe importance\
    \ of this to parallel evaluation can be seen if we expand this to four terms:\n\
    \n```\na op b op c op d == (a op b) op (c op d)\n```\n\nWe can evaluate (a op\
    \ b) in parallel with (c op d), and then invoke op on the results.\n\nExamples\
    \ of associative operations include numeric addition, min, and max, and string\
    \ concatenation.\n\n- In Streams, associativity constraint is important when performing\
    \ parallel reductions\n- Parallel streams split the data into multiple chunks\
    \ and process them concurrently.\n- binary operation must be associative for correct\
    \ result.\n\n## What is identity constraint\n\nThe identity constraint states\
    \ that, there must be an identity element (also known as an identity value or\
    \ neutral element), when combined with any other element, does not change the\
    \ value of that other element.\n\nIn mathematical terms, for any value a:\n\n\
    ```\nidentityElement op a = a op identityElement = a\n```\n\n## Collector\n\n\
    ```\n<R,A> R collect(Collector<? super T,A,R> collector\nPerforms a mutable reduction\
    \ operation on the elements of this stream.\nIt is useful when we are utilizing\
