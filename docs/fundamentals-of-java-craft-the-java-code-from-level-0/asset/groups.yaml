    \ 链式调用多次操作\n\n```java\nimport java.util.List;\nimport java.util.stream.Collectors;\n\
    \npublic class StreamDemo {\n    public static void main(String[] args) {\n  \
    \      List<EmployeeBean> empData = EmployeeUtil.getAllEmployeeList();\n     \
