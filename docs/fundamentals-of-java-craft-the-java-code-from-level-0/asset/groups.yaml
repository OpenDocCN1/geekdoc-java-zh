  mdcn: "\n\n```java\n}\n}\n```\n\nNotDefinedException 指用户根据其需求创建的任何异常。\n\n假设你正在根据某个关键词搜索数据，并且如果你在没有找到该关键词的数据时，你想抛出一个异常。如果没有找到数据，你只是想抛出一个类似于\
    \ `DataNotAvailableForKeyException` 的异常，或者你可以创建一个带有任何意义名称的异常。\n\n# throw new DatanotAvailableForKeyException(\"\
    \ error message\");\n\n这就是你抛出异常的方式。\n\n## throw vs throws\n\n如你所见，这两个名字看起来很相似，所以对新开发者来说有些困惑。\n\
    \n简单来说，我们可以说 throwing（抛出）意味着将异常处理权委托给调用者，意味着你**不再**继续处理该异常了。\n\n`throw` 意味着根据你要求的某些给定逻辑，你可以抛出任何合适的异常。正如我们之前看到的，如果你在验证用户名并发现用户名**不是**有效的，那么你可以简单地创建一个如\
    \ `UserNameNotValid` 的自定义异常并直接将其抛出。\n\n| throw | throws |\n| :--- | :--- |\n|\
    \ 用于在程序中的任何代码块中显式地抛出异常。 | 用于函数签名，声明方法在执行过程中可能抛出的异常。 |\n| `throw` 用于方法内部。你一次只能抛出一个异常。\
    \ | `throws` 用于方法签名内部。可以在声明中添加任意数量的异常。 |\n| `throw` 关键字可以用于抛出检查异常（checked）和未检查异常（unchecked）。\
    \ | `throws` 关键字只能用于检查异常。 |\n\n```java\nthrow new AnyException(\"error message\"\
    ); void methodName() throws\nArithmeticException,FileNotFoundException,AnyUserDefinedException\n\
    ```\n\n如果你在任何方法内部使用 `throw` 关键字抛出异常，那么你**必须**使用 `try-catch` 来处理它，或者使用 `throws`\
    \ 关键字将其委托给方法的调用者。\n\n```java\npublic static boolean validateUserName(String userName)\
    \ throws InvalidUserNameException {\n\n    if(userName.equalsIgnoreCase(\"Raj\"\
    )){\n        throw new InvalidUserNameException(400,\"User Name is not valid\"\
    );\n    }\n    return true;\n}\n```\n\n## 创建异常 或 自定义异常 或 用户定义异常\n\n正如我们已经讨论过的，如果你在真实环境中工作，那么异常处理是你需要非常小心且聪明地对待的最概念之一。\n\
    \n它确实让你的应用程序对用户更加友好，而且如果发生了错误，开发者将更容易找到确切的问题。\n\n假设，作为一名开发者，你正在开发某个功能，一段时间后客户遇到了问题。这些问题可能是任何问题，可能是数据问题，也可能是某些功能问题，或者是由于代码其他部分引起的任何其他问题，最关键的一点是，它可能是任何类型的问题，甚至是不可预测的。因此，作为开发者，你需要以这种方式添加异常处理代码，使其能够简单地处理任何类型的异常，并在发生故障时提供适当的错误信息，这样你或其他开发者就能轻松找到根源并尽快修复它，以避免任何形式的升级。\n\
    \n诚实地说，这在日常开发环境中是非常直接且常见的现象。\n\n假设你正在方法中验证“用户名（user name）”，你需要验证哪些基本内容？它可能是用户模式、空检查或任何你针对用户名需要验证的规则。现在你已经写了验证输入数据的逻辑，一旦数据通过验证并发现任何问题，你就**需要**抛出一个带有适当错误信息的正确异常，以便最终用户能够理解。此错误信息应该是清晰的，即使是开发者也能理解根源，这将有助于开发者轻松修复它。\n\
    \n我们可以通过扩展属于 `java.lang` 包的 `Exception` 类来根据需求创建异常。\n\n这些是与业务逻辑相关的异常，开发者希望用户按照要求的格式提供输入，如果用户未能这样做，就会抛出异常，用户将获得关于问题是什么以及如何解决的说明。这对应用程序用户或开发者理解准确的问题非常有帮助。\n\
    \n示例：如果用户想要设置年龄（Age）限制，我们可以使用自定义异常并提供所需的注释作为输出。\n\n现在我们将看到作为开发者的如何创建一些自定义异常。\n\
    \n### 语法：\n\n```java\nclass YourExceptionName extends Exception\"/Any Predefined\
    \ Exception\" {\n\n    // 添加你的属性，如错误消息、错误代码等\n    // 添加构造函数以初始化异常对象\n\n}\n```\n\
    \n如上所示，我们只是在创建一个 `YourExceptionName` 类，它继承自 Java 的 `Exception` 类或其他其他 `Exception`\
    \ 类。\n\n这无非我们正尝试通过继承将 `Exception` 类的行为继承到我们的类中。\n\n到目前为止，我们清楚了如果一个类继承另一个类，那么子类将自动继承父类的行为。在上面的示例中，`Exception`\
    \ 类是父类，所以我们的类 `YourExceptionName` 将拥有异常类的行为。\n\n这就是你如何根据需求在 Java 中创建自定义异常类。\n\n\
    示例：\n\n```java\nclass UserNameNotValidException extends Exception {\n    public\
    \ UserNameNotValidException(String userName) {\n        // 调用父类 Exception 的构造函数\n\
    \        super(userName);\n    }\n}\n```\n\n示例 2：\n\n```java\npublic class DuplicateEntityException\
    \ extends RuntimeException {\n    private static final long serialVersionUID =\
    \ 1L;\n\n    private int code;\n\n    public DuplicateEntityException(int code,\
    \ String msg) {\n        super(msg);\n        this.code = code;\n    }\n\n   \
    \ public int getCode() {\n        return code;\n    }\n\n    public void setCode(int\
    \ code) {\n        this.code = code;\n    }\n}\n```\n\n### InvalidUserName 异常\n\
    \n```java\npackage org.example.exception;\npublic class InvalidUserNameException\
    \ extends Exception{\n\n    private static final long serialVersionUID = 1L;\n\
    \    private int code;\n\n    public InvalidUserNameException(int code, String\
    \ msg) {\n        super(msg);\n        this.code = code;\n    }\n\n    public\
    \ int getCode() {\n        return code;\n    }\n\n    public void setCode(int\
    \ code) {\n        this.code = code;\n    }\n}\n```\n\n## 让我们创建一个方法并在代码中抛出 InvalidUserName\
    \ 异常\n\n```java\npackage org.example.exception;\npublic class FileDemo {\n\n \
    \   public static boolean validateUserName(String username) throws InvalidUserNameException\
    \ {\n\n        if(username.equalsIgnoreCase(\"Raj\")){\n            throw new\
    \ InvalidUserNameException(400,\"User Name is not valid\");\n        }\n     \
    \   return true;\n    }\n    public static void main(String[] args) throws InvalidUserNameException\
    \ {\n\n        String yourUsername=\"Mahesh\";\n        Boolean isUsernameValid=validateUserName(yourUsername);\n\
    \        System.out.println(\" ### isUsernameValid :\"+isUsernameValid);\n   \
    \ }\n}\n```\n\n如上面的代码所示，我们使用 `validateUserName(..)` 方法验证用户：\n\n`Boolean isUsernameValid=validateUserName(yourUsername);`\n\
    \n如果你查看这个方法的声明，你可以看到根据我们的需求，如果用户名不是有效的，我们会抛出 `InvalidUserNameException`。\n\n```java\n\
    throw new InvalidUserNameException(400,\"User Name is not valid\");\n```\n\n##\
    \ Java 异常处理：最佳实践\n\n- 最佳实践是只捕获可以处理的异常。\n- 在 `catch` 块中不要返回空值而不是处理异常，这会消耗异常导致错误永久失败且程序崩溃。\n\
    - 不要获取异常类，而是捕获特定的子类。\n- 永远不要在 `finally` 块中抛出异常，因为即使 `try` 块没有产生任何异常，`finally`\
    \ 块在执行 `try-catch` 块后也会抛出异常。\n- 如果你不处理异常，请使用 `finally` 块代替 `catch` 块。\n- 始终使用\
    \ `finally` 块关闭使用的资源。\n- 最佳实践始终在使用后关闭/终止资源，如果可能，使用 `try-with-resources`，这样 JVM\
    \ 会自动关闭未使用的资源。\n\n"
