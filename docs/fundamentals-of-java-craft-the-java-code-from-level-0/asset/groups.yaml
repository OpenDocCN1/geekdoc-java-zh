    # SOLID principle:


    In this book, we are mostly focusing on basic concepts and fundamentals of java
    programming, SOLID is one of the most key aspects that we must consider while
    writing code in realtime.


    While creating classes , Interfaces or doing any code refactoring we must consider
    SOLID design to make our code more efficient ,flexible and reusable.


    The SOLID principles are a set of five design principles that help software developers
    create more maintainable, flexible, and robust object-oriented software. Each
    principle addresses a specific aspect of software design and, when applied together,
    promotes good software design practices.


    Here''s an very high level overview of each of the SOLID principles


    +   * Single Responsibility Principle (SRP)

    * Open-Closed Principle (OCP)

    * Liskov Substitution Principle (LSP)

    * Interface Segregation Principle (ISP)

    * Dependency Inversion Principle (DIP)'
- md: "\n## Single Responsibility Principle (SRP)\n\n- Idea: A class should have only\
    \ one job or responsibility.\n\n- Example: Think of a remote control. It has a\
    \ single responsibility: to send commands to a device. If you add more responsibilities,\
    \ like handling power, volume, and channels, it becomes less focused.\n\n- Example:\
    \ If you have a class for handling user authentication, it shouldn't also be responsible\
    \ for sending emails. Each class should focus on doing one thing well.\n\nHere\
    \ are the key points of the Single Responsibility Principle in OOAD\n\n**One Reason\
    \ to Change:** Each class should have only one responsibility or reason to change.\
    \ If there is more than one reason for a class to change, it becomes more error-prone\
    \ and harder to maintain.\n\n**Cohesion:** The principle encourages high cohesion\
    \ within classes, meaning that the class should contain members (methods and attributes)\
    \ that are closely related and work together to achieve a single responsibility.\n\
    \n**Separation of Concerns:** It helps in separating different concerns or aspects\
    \ of the software system into distinct classes. This separation makes the system\
    \ more modular and easier to understand, modify, and maintain.\n\n**Reusability:**\
    \ Classes that adhere to the SRP are often more reusable, as they are specialized\
    \ in a single responsibility and can be used in various contexts.\n\nHere's an\
    \ example to illustrate the Single Responsibility Principle\n\nSuppose you're\
    \ designing a banking software system. You might have a BankAccount class. According\
    \ to SRP, this class should have only one responsibility, which is managing the\
    \ bank account balance.\n\n```java\npublic class BankAccount {\n    public double\
    \ getAccountBalance(){\n        // ADD your code to fetch Bank account\n     \
    \   return Math.random();\n    }\n    public void createBankAccount(){\n     \
    \   //LOGIC to create bank Account\n    }\n    public boolean validateUser(UserData\
    \ request){\n        //Validate User\n        return Boolean.TRUE;\n    }\n  \
    \  public void sendEmail(String emailId){\n        //send email to User\n    }\n\
    }\n```\n\nIt should not be responsible for handling user authentication, sending\
    \ emails, or other unrelated tasks, so, user authentication and email sending\
    \ should be handled by separate classes with their own single responsibilities.\
    \ This separation allows for easier maintenance, testing, and future changes without\
    \ affecting unrelated parts of the system.\n\nIn summary, the Single Responsibility\
    \ Principle in OOAD promotes the idea that each class should have a clear, single,\
    \ and well-defined responsibility, which contributes to more maintainable and\
    \ robust software systems.\n\n```java\npublic class EmployeeData {\n    private\
    \ int id;\n    private String name;\n    private double salary;\n\n    public\
    \ EmployeeData(int id, String name, double salary) {\n        this.id = id;\n\
    \        this.name = name;\n        this.salary = salary;\n    }\n\n    // Methods\
    \ for accessing and modifying employee data\n    public int getId() { return id;\
    \ }\n    public String getName() { return name; }\n    public double getSalary()\
    \ { return salary; }\n\n    // Method to save an employee to the database\n  \
    \  public void saveToDatabase() {\n        // Code to save the employee data to\
    \ a database\n    }\n}\n```\n\nIn this design, the Employee class has two responsibilities:\n\
    \n1. Managing employee data (storing and retrieving employee attributes)\n2. Saving\
    \ employee data to a database.\n\n## Revised Design (Adhering to SRP)\n\nTo adhere\
    \ to the Single Responsibility Principle, we separate the responsibilities into\
    \ different classes. We create an Employee class for managing employee data and\
    \ an EmployeeRepository class for database operations.\n\n```java\npublic class\
    \ EmployeeData {\n    private int id;\n    private String name;\n    private double\
    \ salary;\n\n    public EmployeeData(int id, String name, double salary) {\n \
    \       this.id = id;\n        this.name = name;\n        this.salary = salary;\n\
    \    }\n\n    // Methods for accessing and modifying employee data\n    public\
    \ int getId() { return id; }\n    public String getName() { return name; }\n \
    \   public double getSalary() { return salary; }\n}\n\npublic class EmployeeRepository\
    \ {\n    public void saveToDatabase(EmployeeData employee) {\n        // Code\
    \ to save the employee data to a database\n    }\n}\n```\n\nAs you can see above:\n\
    \n1. The EmployeeData class is responsible for managing employee data (attributes\
    \ and methods related to employee information). \n\n2. The EmployeeRepository\
    \ class is responsible for saving and retrieving employee data from the database.\n\
    \nBy separating these responsibilities into different classes, we adhere to the\
    \ Single Responsibility Principle. This design promotes code maintainability and\
    \ flexibility because changes to the way employee data is persisted (e.g., switching\
    \ from a database to a file system) won't impact the core employee data management\
    \ logic in the Employee class.\n\nIn any real-time applications, you need to design\
    \ your code in such a way that it will somehow use the SOLID principle to make\
    \ it more flexible, readable and robust.\n\n## Summary\n\n1. Whenever you are\
    \ creating any class, ensure that class has a single responsibility.\n2. You can\
    \ split your requirements into different classes based on category, type, nature\
    \ and based on other applicable parameters.\n3. Name of the class should tell\
    \ the functionality.\n\n## Open-Closed Principle (OCP)\n\n**Idea:** Software entities\
    \ (classes, modules, functions) should be open for extension but closed for modification.\n\
    \n**Example:** Instead of modifying existing code, you should be able to add new\
    \ features through extensions. Think of it as adding new layers to a cake without\
    \ changing the existing layers.\n\n**Example:** Imagine a shape drawing application.\
    \ You can add new shapes, like a \"Triangle\", without modifying the existing\
    \ \"Circle\" or \"Square\" classes.\n\nThe open/closed principle states that classes\
    \ should be open for extension but closed to change. A class is considered \"\
    closed\" once it has:\n\n- Been tested to functioning properly. The class should\
    \ behave as expected.\n- All the attributes and behaviors are encapsulated.\n\
    - Been proven to be stable within your system. The class should not stop your\
    \ system from running or do harm.\n\nAlthough the principle is called \"closed\"\
    , it does not mean that changes cannot be made to a class during development.\
    \ Things should change during the design and analysis phase of your development\
    \ cycle. A \"closed\" class occurs when a point has been reached in development\
    \ when most of the design decisions have been finalized.\n\nDuring the lifecycle\
    \ of your software, certain classes should be closed to further changes to avoid\
    \ introducing side effects. A “closed” class should still be fixed if any bugs\
    \ or unexpected behaviors occur.\n\nIf a system needs to be extended or have more\
    \ features added, then the “open” side of the principle comes into play. An “open”\
    \ class is one that can still be built upon. There are two different ways to extend\
    \ a system with the open principle.\n\nThe first way is through the inheritance\
    \ of a superclass. Inheritance can be used to simply extend a class that is considered\
    \ closed when you want to add more attributes and behaviors. The subclasses will\
    \ have the original functions of the superclass, but extra features can be added\
    \ in the subclasses. This helps preserve the integrity of the superclass, so if\
    \ the extra features of the subclasses are not needed, the original remains intact.\n\
    \n## Example\n\nAssume you have a system that calculates the areas of different\
    \ shapes, and you want to extend it to support new shapes without modifying the\
    \ existing code. This is how you can do it.\n\n```java\n// Shape class (Base class)\n\
    public abstract class Shape {\n    public abstract double calculateArea();\n}\n\
    \n// Rectangle class (Extends Shape)\npublic class Rectangle extends Shape {\n\
    \    private double width;\n    private double height;\n\n    public Rectangle(double\
    \ width, double height) {\n        this.width = width;\n        this.height =\
    \ height;\n    }\n\n    @Override\n    public double calculateArea() {\n     \
    \   return width * height;\n    }\n}\n```\n"
  mdcn: "\n\n## 单一职责原则 (SRP)\n\n- 核心思想：一个类应该只有一个职责或任务。\n\n- 示例：想象一个遥控器。它有一个单一的职责：向设备发送命令。如果你添加了更多职责，比如处理电源、音量和频道，它就会变得不再那么专注。\n\
    \n- 示例：如果你有一个处理用户身份验证的类，它不应该同时也负责发送电子邮件。每个类都应该专注于良好地做好一件事。\n\n以下是面向对象分析与设计（OOAD）中单一职责原则的关键点：\n\
    \n\n\n**单一变更原因：** 每个类应该只有一个职责或一个变更原因。如果一个类有多个变更原因，它将变得更易出错且更难维护。\n\n**内聚性：** 该原则鼓励类内部的高内聚性，这意味着类应该包含紧密相关并共同工作以实现单一职责的成员（方法和属性）。\n\
    \n**关注点分离：** 它帮助将软件系统不同的关注点或方面分离到不同的类中。这种分离使得系统变得更具模块化，并且更容易理解、修改和维护。\n\n**可重用性：**\
    \ 遵循 SRP 的类通常具有更高的可重用性，因为它们专注于单一职责，并可以在各种场景下使用。\n\n这里有一个说明单一职责原则的示例：\n\n假设你正在设计一个银行软件系统。你可能有一个\
    \ `BankAccount`（银行账户类）。根据 SRP，这个类应该只有一个职责，即管理账户余额。\n\n```java\npublic class BankAccount\
    \ {\n    public double getAccountBalance(){\n        // 添加你的代码来获取银行账户余额\n    \
    \    return Math.random();\n    }\n    public void createBankAccount(){\n    \
    \    // 创建银行账户的逻辑\n    }\n    public boolean validateUser(UserData request){\n\
    \        // 验证用户\n        return Boolean.TRUE;\n    }\n    public void sendEmail(String\
    \ emailId){\n        // 向用户发送邮件\n    }\n}\n```\n\n它不应该负责处理用户身份验证、发送电子邮件或其他不相关的任务，因此，用户身份验证和电子邮件发送应该由具有其自身单一职责的独立类来处理。这种分离允许更易于维护、测试和未来的更改，而不会影响系统的其他无关部分。\n\
    \n总结来说，OOAD 中的单一职责原则促进了这样一个观点：每个类都应该有一个清晰、单一且定义良好的职责，这有助于构建更具维护性和更健壮的软件系统。\n\n\
    ```java\npublic class EmployeeData {\n    private int id;\n    private String\
    \ name;\n    private double salary;\n\n    public EmployeeData(int id, String\
    \ name, double salary) {\n        this.id = id;\n        this.name = name;\n \
    \       this.salary = salary;\n    }\n\n    // 访问和修改员工数据的方法\n    public int getId()\
    \ { return id; }\n    public String getName() { return name; }\n    public double\
    \ getSalary() { return salary; }\n\n    // 保存员工到数据库的方法\n    public void saveToDatabase()\
    \ {\n        // 将员工数据保存到数据库的代码\n    }\n}\n```\n\n在这个设计中，`EmployeeData` 类有两个职责：\n\
    \n1. 管理员工数据（存储和检索员工属性）\n2. 将员工数据保存到数据库。\n\n## 修改后的设计（遵循 SRP）\n\n为了遵循单一职责原则，我们将职责分离到不同的类中。我们创建了一个\
    \ `EmployeeData` 类来管理员工数据，以及了一个 `EmployeeRepository` 类来处理数据库操作。\n\n```java\npublic\
    \ class EmployeeData {\n    private int id;\n    private String name;\n    private\
    \ double salary;\n\n    public EmployeeData(int id, String name, double salary)\
    \ {\n        this.id = id;\n        this.name = name;\n        this.salary = salary;\n\
    \    }\n\n    // 访问和修改员工数据的方法\n    public int getId() { return id; }\n    public\
    \ String getName() { return name; }\n    public double getSalary() { return salary;\
    \ }\n}\n\npublic class EmployeeRepository {\n    public void saveToDatabase(EmployeeData\
    \ employee) {\n        // 将员工数据保存到数据库的代码\n    }\n}\n```\n\n如上所示：\n\n1. `EmployeeData`\
    \ 类负责管理员工数据（与员工信息相关的属性和方法）。 \n\n2. `EmployeeRepository` 类负责从数据库中保存和检索员工数据。\n\n\
    通过将这些职责分离到不同的类中，我们遵循了单一职责原则。这种设计提高了代码的可维护性和灵活性，因为对员工数据持久化方式的更改（例如从数据库切换到文件系统）不会影响\
    \ `Employee` 类中的核心员工数据管理逻辑。\n\n在任何实时应用中，你都需要以某种方式设计代码，使其能够利用 SOLID 原则使其变得更加灵活、易读和健壮。\n\
    \n## 总结\n\n1. 每当你创建任何类时，确保该类具有单一的职责。\n2. 你可以根据类别、类型、性质和其他适用参数将你的需求拆分为不同的类。\n3.\
    \ 类的名称应该体现其功能。\n\n## 开闭原则 (OCP)\n\n** 核心思想：** 软件实体（类、模块、函数）应该对扩展开放，但对修改关闭。\n\n\
    ** 示例：** 与其修改现有代码，你应该能够通过扩展来添加新功能。将其想象为在不改变现有层的情况下给蛋糕添加新层。\n\n** 示例：** 想象一个形状绘制应用程序。你可以添加新的形状（如“三角形”），而无需修改现有的“圆形”或“正方形”类。\n\
    \n开闭原则规定，类应该对扩展开放，但对更改关闭。当一个类满足以下条件时，它被认为是“关闭”的：\n\n- 已通过测试且运行正常。\n- 所有的属性已封装。\n\
    - 已证明在系统内是稳定的。\n\n尽管该原则被称为“关闭”，但并不意味着在开发期间不能对类进行更改。更改应该在开发周期的设计和分析阶段进行。当开发达到大部分设计决策已确定时，类就处于“关闭”。\n\
    \n在软件生命周期中，某些类应该关闭进一步更改以避免引入副作用。如果出现错误或意外行为，“关闭”的类仍然应该修复。\n\n如果系统需要扩展或添加更多功能，那么该原则的“开放”侧就会发挥作用。“开放”的类是可以在其基础上构建的类。扩展系统有两种不同的方法。\n\
