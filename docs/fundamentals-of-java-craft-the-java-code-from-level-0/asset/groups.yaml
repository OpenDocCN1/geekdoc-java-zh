    \ 子类型不应改变或违反基类型的行为预期。这意味着它们应该至少提供与基类型相同的接口，并且它们的方法应该遵循相同的预期。\n\n- **继承是“是一个”的关系（Is-a\
    \ Relationship）：** 当你创建一个子类型时，它应该真实地代表与基类型之间的“是一个”的关系。也就是说，派生类应该是基类的更专门的版本。\n\n\
    - **多态性：** LSP 实现了多态，允许不同类的对象通过它们的共同基类型被统一处理。这简化了代码并提高了灵活性和可重用性。\n\n- **健壮性：**\
    \ 遵循 LSP 有助于软件的健壮性，因为它确保了派生类在替代基类使用时不会引入意外的行为或错误。\n\n未能遵循里基夫替换原则可能会导致程序行为出现错误，使软件更容易出错且更难维护。在实践中，仔细设计和实现继承层次结构以确保满足\
    \ LSP 至关重要，并确保派生类是基类真正的替代品，从而在使用多态时提供一致且可预测的体验。\n\n# 示例\n\n你有一个名为 Shape 的基类，表示各种几何形状。它有一个方法\
    \ `calculateArea()` 用于计算形状的面积。\n\n```java\npublic class Shape {\n    public double\
    \ calculateArea() {\n        return 0;\n    }\n}\n```\n现在，你创建了两个派生类，Rectangle\
    \ 和 Circle，它们是它们是专门的形状。这些派生类应该遵循里基夫替换原则，这意味着它们应该是基类的替换，并在提供 `calculateArea()`\
    \ 自己的实现的同时不违反基类的约定。\n\n以下是如何实现 Rectangle 和 Circle 类：\n\n```java\npublic class\
    \ Rectangle extends Shape {\n    private double width;\n    private double height;\n\
