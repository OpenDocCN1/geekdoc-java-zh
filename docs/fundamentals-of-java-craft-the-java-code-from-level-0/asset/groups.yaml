    # 包装类


    如所示，包装类用于将原始类型封装为对象类型。


    Java 为每个原始类型提供了包装类。


    原始数据类型如 int、char 和 float 在基础数据存储方面简单高效，但对于处理对象和执行某些操作并不是最好的。为了弥补原始类型和对象之间的差距，Java
    提供了一组包装类。包装类是封装原始数据类型的类，使其能够作为对象处理。


    下面是 Java 中提供的原始数据类型：


    # 原始数据类型


    ![](img/199017295e77c8cc572552acdaf8f7fc_234_0.png)


    你可以简单地将原始数据类型转换为 Java 中对应的包装类。


    Java 中的每个包装类都有一个接收对应原始数据类型作为参数的构造函数。例如，你可以使用 Integer 类将 int 值转换为 Integer 对象：


    ```

    int number = 100;

    ```


