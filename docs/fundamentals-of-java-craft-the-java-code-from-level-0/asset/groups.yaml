    \nStatic method cant be overridden, because method overriding depends on objects\
    \ BUT static method does not affect objects at class level. When a subclass defines\
    \ a static method with the same signature as its superclass, it is considered\
    \ hiding, not overriding.\n\n# Here are the key reasons why static methods cannot\
    \ be overridden:\n\n# Inheritance vs. Hiding:\n\nInheritance involves creating\
    \ a new class that is a modified version of an existing class, and overriding\
    \ allows a subclass to provide a specific implementation for a method that is\
    \ already defined in its superclass. Static methods, on the other hand, are associated\
    \ with the class itself, not with instances of the class. When a subclass declares\
    \ a static method with the same signature as its superclass, it is considered\
    \ hiding the superclass method, not overriding it.\n\n# Class vs. Instance Context:\n\
    \nStatic methods belong to the class rather than to instances of the class. They\
    \ are invoked using the class name, not through an instance of the class. Instance\
    \ methods, which can be overridden, are associated with instances of a class and\
    \ are called on an object.\n\n# Resolution at Compile-Time:\n\nThe resolution\
    \ of static methods is done at compile-time, not runtime. This means that the\
    \ method to be called is determined based on the declared type of the reference\
    \ variable, not the actual type of the object during runtime. In contrast, instance\
    \ methods are resolved at runtime, allowing for dynamic method dispatch.\n\n#\
