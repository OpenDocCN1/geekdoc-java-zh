    \n# 解释\n\n它是面向对象编程和软件设计的 SOLID 原则之一。它由 Barbara Liskov 在 1987 年引入，强调了继承和多态在面向对象系统中的重要性。\n\
    \n# LSP 规定\n\n> “子类型必须能够替换其基类型。”\n\n简单来说，LSP 意味着派生类的对象应该替换基类的对象而不影响程序的正确性。\n\n\
