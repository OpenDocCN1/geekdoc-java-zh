    \ mutable reductions.\n\nA Collector is specified by four functions that work\
    \ together to accumulate entries into a mutable result container, and optionally\
    \ perform a final transform on the result(in case of parallel reduction operation).\n\
    \n1. **supplier**: this function creates a new mutable result container.this function\
