    \ lines = Files.readAllLines(filePath);\n    }\n\n    public static void main(String[]\
    \ args) {\n        List<String> data=readFile();\n    \n        // 未处理的异常: java.io.IOException\n\
    \        // 为方法签名添加异常 更多操作...\n        org.example.exception.FileDemo\n      \
    \  public static List<String> readFile() throws IOException\n\n        // 抛出:\
    \ IOException\n        JavaFundamentals\n    }\n}\n```\n\n如上面的示例代码所示，在我们尝试读取文件时，我们正在进行文件操作，那里有抛出\
    \ IOException 的可能，由于它是受检异常，我们必须处理它，或者将其委托给方法的调用者。\n\n```java\nimport java.io.IOException;\n\
    import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    import java.util.List;\n\npublic class FileDemo { no usages\n\n    public static\
    \ List<String> readFile() throws IOException { // 1处用法\n        Path filePath\
    \ = Paths.get(first:\"c:/temp/files\", ...more:\"data.txt\");\n        List<String>\
