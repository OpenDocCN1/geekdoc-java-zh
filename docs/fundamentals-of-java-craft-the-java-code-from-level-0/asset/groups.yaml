    # # The Liskov Substitution Principle (LSP)


    **Idea:** Subtypes must be substitutable for their base types.


    Subtypes must be substitutable for their base types without altering the correctness
    of the program.


    **Example:** If you have a base class representing shapes, any subclass (like
    a specific type of shape) should be able to replace the base class without causing
    issues.


    **Example:** In a zoo program, if you have a base class "Bird," you should be
    able to substitute it with any specific bird type like "Penguin" or "Eagle" without
    breaking the program.


    # Explanation


    It is one of the SOLID principles of object-oriented programming and software
    design. It was introduced by Barbara Liskov in 1987 and emphasizes the importance
    of inheritance and polymorphism in object-oriented systems.


    # The LSP states


    > "Subtypes must be substitutable for their base types."


    In simpler terms, the LSP implies that objects of derived classes should be able
    to replace objects of the base class without affecting the correctness of the
    program.


    In other words, if a class is designed to be a subtype (a derived or child class)
    of another class (the base or parent class), it should conform to the contract
    or behavior of the base class in a way that it can be used interchangeably.'
  - '[PAGE 134]


    # The key ideas behind the LSP include


    Behavioral Compatibility: Subtypes should not change or violate the behavioral
    expectations of the base type. This means that they should provide at least the
    same interface as the base type, and their methods should adhere to the same expectations.


    Inheritance Is-a Relationship: When you create a subtype, it should genuinely
    represent an "is-a" relationship with the base type. In other words, a derived
    class should be a more specialized version of the base class.


    Polymorphism: The LSP enables polymorphism, allowing objects of different classes
    to be treated uniformly through their common base type. This simplifies code and
    promotes flexibility and reuse.


    Robustness: Adhering to the LSP contributes to the robustness of the software
    because it ensures that derived classes won''t introduce unexpected behavior or
    errors when used in place of their base classes.


    Failure to adhere to the Liskov Substitution Principle can lead to incorrect program
    behavior, making the software more error-prone and harder to maintain. In practice,
    it’s crucial to carefully design and implement inheritance hierarchies to ensure
    that the LSP is satisfied, and derived classes are true substitutes for their
    base classes, providing a consistent and predictable experience when using polymorphism.


    # Example


    you have a base class called Shape, representing various geometric shapes. It
    has a method calculateArea() for calculating the area of the shape.'
