  mdcn: "\n## 数组：Java 中的数组是什么？\n\n它包含具有相似数据类型的元素。\n\nJava 中的数组在单个变量中存储多个相同类型的值。\n\n\
    数组的元素存储在连续的内存位置中。\n\n它们是能够包含固定数量元素的对象，每个元素都有一个索引用于访问它。\n\n我们以前只在声明时提供数组的大小。\n\n\
    数组的索引从 0 开始，因此数组的第 1 个元素存储在第 0 个索引，第 2 个元素存储在第 1 个索引，以此此类推。\n\n| 0 | 1 | 2 | 3\
    \ | 4 | 5 | 6 | 7 | ... |\n|---|---|---|---|---|---|---|---|---|\n\n## 语法：\n\n\
    ```\ndata_type arrayName[ ];\ndata_type[ ] arrayName;\n```\n\n## 示例：\n\n```java\n\
    int numbers[];\nString names[];\nint[] pinCode;\nInteger dates [];\n```\n\n```java\n\
    // 因此它的类型是 'int'\n// 它只接受 'int' 类型的元素\nint numbers[];\nString names[];\n```\n\n\
    ## 数组初始化\n\n一旦声明了数组，我们就可以简单地初始化它们，或者可以在声明时直接初始化。\n\n```java\nint arr[]=new int[5];\n\
    int numbers[]={1,2,3,4,5,6};\nString names[]={\"Raj\",\"Heera\"};\n\nFloat arrFloat[]=new\
    \ Float[4];\n```\n\n```java\nint[] anArray = new int[] {1, 2, 3, 4, 5}; //它将拥有从索引\
    \ 0开始的5个元素\n```\n\n## 如何从数组访问值：\n\n众所周知，数组是相似数据类型元素的集合，因此数组的元素可以通过索引访问。数组的索引从\
    \ 0 开始。\n\n```java\nint numbers[]={1,2,3,4,5,6};\n```\n\n这里这个数组中有 6 个元素，索引从 0\
    \ 开始，因此元素 1 将位于第 0 个位置。\n\n我们可以直接使用索引访问此元素。\n\nNumbers[0] 将是 1\n\n第 1 个元素=第 0\
    \ 个位置，即值= 1\n第 2 个元素=第 1 个位置，即值= 2\n第 3 个元素=第 2 个位置，即值= 3\n\n## 示例：\n\n```java\n\
    package org.example.arrayDemo;\n\npublic class ArrayTestDemo {\n    public static\
    \ void main(String[] args) {\n\n        int numbers[]={1,2,3,4,5,6};\n\n     \
    \   int num1=numbers[0]; //第 0 个索引\n        int num2=numbers[1]; //第 1 个索引\n\n\
    \        System.out.println(\" # num1 \"+num1);\n        System.out.println(\"\
    \ # num2 \"+num2);\n\n    }\n}\n```\n\n结果：\n\n## num1 1\n## num2 2\n\n注意：\n\n\
    括号之间的数字是我们访问的数组特定位置。\n\n访问数组元素时，如果传递的索引为负数或超出最后一个单元格，Java 将抛出 `ArrayIndexOutOfBoundsException`。\n\
    \n```java\nint numbers[]={1,2,3,4,5,6};\n```\n\n这里有 6 个元素，所以索引从 0 开始到 5 结束。\n\n\
    numbers[0]=1\n\nnumbers[5]=6\n\n但如果你尝试 numbers[6] 或任何更大的索引，你将得到异常 `ArrayIndexOutOfBoundsException`。\n\
    \n因此我们应该注意不要使用负索引，或大于或等于数组大小的索引。\n\n## 遍历数组元素\n\n可以使用索引访问数组元素。\n\n```java\npackage\
    \ org.example.arrayDemo;\n\npublic class ArrayTestDemo {\n    public static void\
    \ main(String[] args) {\n        int numbers[]={1,2,3,4,5,6};\n\n        for (int\
    \ i=0;i<(numbers.length);i++) {\n            System.out.println(numbers[i]);\n\
    \        }\n    }\n}\n```\n\n结果：\n1\n2\n3\n4\n5\n6\n\n## 更简化的方法：\n\n```java\n\
    package org.example.arrayDemo;\n\npublic class ArrayTestDemo {\n    public static\
    \ void main(String[] args) {\n\n        int numbers[]={1,2,3,4,5,6};\n       \
    \ for(int num:numbers){\n            System.out.println(num);\n        }\n   \
    \ }\n}\n```\n\n结果：\n\n- 1\n2\n3\n4\n5\n6\n\nJava 提供了内置类来处理数组操作。\n你可以使用 `java.util`\
    \ 包中的 `Arrays` 类。\n\n该类包含了各种处理数组的方法（例如排序和搜索）。该类还包含一个静态工厂，允许数组被视为列表。\n\n让我们看看 `Arrays`\
    \ 类如何简化数组操作的示例。\n\n```java\npackage org.example.arrayDemo;\nimport java.util.Arrays;\n\
    public class ArrayTestDemo {\n    public static void main(String[] args) {\n \
    \       int numbers[]={1,2,3,4,5,6};\n        Arrays.sort(numbers);\n        for(int\
