    ![](img/199017295e77c8cc572552acdaf8f7fc_370_7.png)\n\n每当你处理 Stream 时，请记住你必须调用终端操作才能从给定的\
    \ Stream 获取结果，该结果将是值而不是 Stream。\n\nStream API 提供了终端操作 collect(..) 从给定的 Stream\
    \ 中收集数据。\n\n## 从 Stream 收集数据\n\n```\ncollect(Collector<? super T,A,R> collector)\n\
    collect(Supplier<R> supplier, BiConsumer<R,? super T> accumulator, BiConsumer<R,R>\
    \ combiner)\n```\n\n数据如何在 Stream 中收集的？\n\n- 它允许我们执行多次折叠操作（将元素封装到某些数据结构并应用一些额外的逻辑、累加它们等）。\n\
    - collect(..) 允许你将流的元素收集到各种类型的集合中，例如列表、集合、映射，甚至自定义收集器。\n- 这种归约操作的策略通过 Collector\
    \ 接口实现类提供。\n\n要理解 collect(..) 方法，我们必须先理解 Collector 接口。\n\n可变归约操作将输入元素累加到一个可变的结果容器中。\n\
    \n如果是并行的，则在处理所有输入元素后，它将把累加的结果转换为最终结果。\n\n归约操作可以按顺序或并行执行。\n\n可变归约操作的示例包括：\n\n1.\
    \ 将元素累加到集合（Collection）中\n2. 使用 StringBuilder 拼接字符串\n3. 计算元素的摘要信息，如和、最小值、最大值或平均值\n\
    4. 计算“透视表”摘要，例如“卖者的最大价值交易”等。\n\nCollectors 类提供了许多常见可变归约的实现。\n\nCollector 由四个共同工作的函数指定，这些函数将条累加到可变结果容器中，并可选对结果执行最后的转换（针对并行归约操作）。\n\
    \n1. **supplier**：此函数创建一个新的可变结果容器。如果你使用并行 Stream，此函数可能会被多次调用。它每次都会返回一个新值。\n2.\
    \ **accumulator**：它本质上是无状态的。它用于将元素折叠到结果容器中。\n3. **combiner**：将两个结果容器合并为一个。\n4.\
    \ **finisher**：它本质上是无状态的。它接受两个部分结果容器并将它们合并以获得最终结果。\n\n- 归约操作可以是并行的或顺序的。\n- 使用\
    \ collector 实现的归约的顺序实现将使用 supplier 函数创建一个单个结果容器，并为每个输入元素调用一次 accumulator。\n- 并行实现将对进行分区，为每个分区创建一个结果容器，将每个分区的内容累加到该分区的子结果中，然后使用\
    \ combiner 将子结果合并为组合结果。\n\n为了确保顺序和并行执行产生等的结果，collector 函数必须满足等价（identity）和结合律（associativity）约束。\n\
    \n## 什么是结合律约束\n\n结合律约束规定操作的分组不应影响最终结果。在数学术语中，对于任意值 a、b 和 c\n\n这种约束对并行评估的重要性可以通过将其扩展到四个项来看出来：\n\
    \n```\na op b op c op d == (a op b) op (c op d)\n```\n\n我们可以并行评估 (a op b) 和 (c\
    \ op d)，然后在结果上调用 op。\n\n满足结合律的操作示例包括数值相加、最小值、最大值以及字符串拼接。\n\n- 在 Streams 中，当执行并行归约时，结合律约束很重要。\n\
    - 并行流将数据拆分成多个块并并发处理它们。\n- 二元操作必须满足结合律以获得正确结果。\n\n## 什么是等元约束\n\n等元约束规定，必须有一个等元元素（也称为等元值或中性元素），它与任何其他元素结合时不会改变该元素的值。\n\
    \n在数学术语中，对于任意值 a：\n\n```\nidentityElement op a = a\n```\n\n## Collector\n\n```\n\
    <R,A> R collect(Collector<? super T,A,R> collector)\n对流的元素执行可变归约操作。\n当利用 Collectors\
    \ 类提供内置 Collector 实现时，它是非常有用的。\n```\n\n```java\nString names[]={\"Ram\",\"Shyam\"\
    ,\"Mohan\",\"BhanuPratap\"};\nSet<String> collectNames=Arrays.stream(names)\n\
    \  .collect(Collectors.toSet());\nSystem.out.println(collectNames);\n```\n\n##\
    \ 看看另一个重载方法：\n\n```\ncollect(Supplier<R> supplier, BiConsumer<R,? super T> accumulator,\
    \ BiConsumer<R,R> combiner)\n对流的元素执行可变归约操作。\n\n在这里你可以传递任何 Collector 实例，我们稍后会详细介绍\
    \ Collector。\n\n## collect 方法是如何工作的？\n\n让我们考虑这样一个用例：将数组元素转换为逗号分隔的值。\n\n输入：[a,e,i,o,u]\n\
    \n输出：a,e,i,o,u 或 aeiou\n\n- supplier 函数每次调用都会返回一个新的 StringBuilder 对象。\n- accumulator\
    \ 函数将列表字符串元素追加到 StringBuilder 实例。\n- combiner 函数合并 StringBuilder 实例。实例之间相互合并，并在它们之间加上逗号。\n\
    - 在第一情况下，我们有一个顺序元素流。因此它们一个接一个处理，只有一个 StringBuilder 实例。没有使用 combiner 函数。这就是为什么产生的输出是\
    \ \"abcde\"。\n- 在第二种情况下，我们有一个并行字符串流。因此元素被并行处理，有多个 StringBuilder 实例被 combiner 函数合并。因此，产生的输出是\
    \ \"a,b,c,d,e\"。\n\n让我们通过代码来理解 supplier、accumulator 和 combiner 这些术语。\n\n"
