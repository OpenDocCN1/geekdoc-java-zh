    # ArrayList


    ArrayList is the implementation of List Interface where the elements can be dynamically
    added or removed from the list. Also, the size of the list is increased dynamically
    if the elements are added more than the initial size.


    The ArrayList class allows us to create resizable arrays. The class implements
    the List interface (which is a subinterface of the Collection interface).


    ArrayList is initialized by size. However, the size is increased automatically
    if the collection grows or shrinks if the objects are removed from the collection.


    It accepts duplicate data.


    Java ArrayList allows us to randomly access the list so it is the best option
    where you want to access data.its most suitable collection for data access operation
    since it implements RandomAccess interface.


    ArrayList cannot be used for primitive types, like int, char, etc. We need a wrapper
    class for such cases.


    # ArrayList Constructors


    | Constructor | Description |

    |--- |--- |

    | ArrayList() | Constructs an empty list with an initial capacity of ten. |

    | ArrayList(int initialCapacity) | Constructs an empty list with the specified
    initial capacity. |

    | ArrayList(Collection<? extends E> c) | Constructs a list containing the elements
    of the specified collection, in the order they are returned by the collection''s
    iterator. |'
