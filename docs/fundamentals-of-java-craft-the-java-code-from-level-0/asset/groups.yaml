    # Surgeon\n\n## Type of inheritance :\n\n**Single Inheritance:** one class extends\
    \ another class (one class only)\n\n![](img/199017295e77c8cc572552acdaf8f7fc_81_0.png)\n\
    \nAs you can see above, Class B extends only one Class A.\nClass A is a super\
