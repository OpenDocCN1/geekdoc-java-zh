    public void forEach(java.util.function.Consumer<? super T> action) \n\nPerforms\
    \ the given action for each element of the Iterable until all elements have been\
    \ processed or the action throws an exception. Actions are performed in the order\
    \ of iteration, if that order is specified. Exceptions thrown by the action are\
    \ relayed to the caller.\nThe behavior of this method is unspecified if the action\
    \ performs side-effects that modify the underlying source of elements, unless\
    \ an overriding class has a concurrent modification policy.\n\nParams: action\
    \ - The action to be performed for each element\nThrows: NullPointerException\
    \ - if the specified action is null\nImplementation: The default implementation\
    \ behaves as if:\nRequirements: for (T t : this)\naction.accept(t);\n\nSince:\
