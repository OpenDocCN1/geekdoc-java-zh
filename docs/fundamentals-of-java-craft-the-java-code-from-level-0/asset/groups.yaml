    \ 类的子类。 |\n| 例：IOException、ClassNotFoundException、SQLException 是常见的检查异常。 | 例：ArithmeticException、NullPointerException、NumberFormatException、StringIndexOutOfBoundsException、ArrayIndexOutOfBoundException\
