    # Polymorphism


    The derivation of the word Polymorphism from two different Greek Polymorphisms
    is derived from 2 Greek words: poly and morphs. The word "poly" means many and
    "morphs" means forms. So polymorphism means many forms.


    Polymorphism in Java is a concept by which we can perform a single action in different
    ways.


    It refers to the ability of a class to take on multiple forms.


    There are two types of polymorphism in Java: compile-time (or static) polymorphism
    and runtime (or dynamic) polymorphism.


    # Compile-time Polymorphism (Method Overloading):


    Method overloading allows a class to have multiple methods with the same name
    but different parameters (different types or a different number of parameters).


    The compiler determines which method to call based on the method signature during
    compile-time.


    If a class has multiple methods having the same name but different in parameters,
    it is known as Method Overloading.


    If we have to perform only one operation, having the same name of the methods
    increases the readability of the program.'
- md: "\nIn java, multiple methods can have the same name and return type with different\
    \ numbers OR different type of method arguments.\n\nLet's assume, you want to\
    \ perform addition of numbers, so you can have some sample methods as below.\n\
    \n# Some example of method overloading:\n\nWith different type of parameters:\n\
    \n```\npublic int printNumbers(int number1)\npublic int printNumbers(float number1)\n\
    public int printNumbers(double number1)\npublic int printNumbers(long number1)\n\
    ```\n\n```\npublic int addNumbers(int number1,int number2)\npublic int addNumbers(float\
    \ number1,int number2)\npublic int addNumbers(float number1,float number2)\npublic\
    \ int addNumbers(long number1,long number2)\npublic int addNumbers(double number1,double\
    \ number2)\n```\n\nWith different number of parameters:\n\n```\npublic int addNumbers(int\
    \ number1,int number2,int number3)\npublic int addNumbers(int number1,int number2,int\
    \ number3,int number4)\n```\n\nExample:\n\n```java\npublic class NumbersCalculatorDemo\
    \ {\n    public long addNumbers(int number1,int number2){\n        int sum=number1+number2;\n\
    \        return sum;\n    }\n```\n\n```java\npublic long addNumbers(long number1,long\
    \ number2){\n    long sum=number1+number2;\n    return sum;\n}\n```\n\n```java\n\
    public long addNumbers(long number1,long number2,long number3){\n    long sum=number1+number2+number3;\n\
    \    return sum;\n}\n```\n\n```java\npublic static void main(String[] args) {\n\
    \    NumbersCalculatorDemo calculatorDemo=new NumbersCalculatorDemo();\n\n   \
    \ long sum1 = calculatorDemo.addNumbers(10,20);\n    long sum2 = calculatorDemo.addNumbers(101,201);\n\
    \    long sum3 = calculatorDemo.addNumbers(10,20,30);\n\n    System.out.println(\"\
    # Sum 1:\"+sum1);\n    System.out.println(\"# Sum 2:\"+sum2);\n    System.out.println(\"\
    # Sum 3:\"+sum3);\n}\n```\n\nResult:\n\n```\n## Sum 1:30\n## Sum 2:30\n## Sum\
    \ 3:60\n```\n\n# Example 2:\n\nMain purpose of method overloading is to make your\
    \ services more flexible so that clients can use your services/methods with different\
    \ possible method arguments.\n\nSame method will be called by clients using different\
    \ possible method arguments. it will help clients to have better experience.\n\
    \nWhen we are going to expose our services to any third party clients, we used\
    \ to provide overloaded methods to the client for better experience.\n\nEven Java\
    \ also uses this feature for inbuilt methods.\n\nAs we can see here, println(..)\
    \ is a method in the PrintStream class in java that is used to print values to\
    \ the console.\n\nWe can see that this method, is overloaded method and it is\
    \ expecting different type of method arguments.\n\n# Overloads\n\n| Method | Description\
    \ |\n|---|---|\n| println(String) | Prints a String and then terminate the line.\
    \ |\n| println(float) | Prints a float and then terminate the line. |\n| println(int)\
    \ | Prints an integer and then terminate the line. |\n| println(double) | Prints\
    \ a double and then terminate the line. |\n| println(long) | Prints a long and\
    \ then terminate the line. |\n| println(char) | Prints a character and then terminate\
    \ the line. |\n| println(boolean) | Prints a boolean and then terminate the line.\
    \ |\n| println(Object) | Prints an Object and then terminate the line. |\n| println()\
    \ | Terminates the current line by writing the line separator string. |\n| println(char[])\
    \ | Prints an array of characters and then terminate the line. |\n\nFor more info,\
    \ please look into the code below.\n\nWe have a method method1(...) which is an\
    \ overloaded method and accepts arguments like int, float, double and long.\n\n\
    When some will call this method, based on the provided value data type it will\
    \ call the method.\n\nIn overloadingDemo.method1(11f), we are providing float\
    \ value while calling this method, compiler will detect it and it will call the\
    \ method with the same argument type.\n\n```java\npublic void method1(float number1){\n\
    \    System.out.println(\"#### method1 with arg type : float\");\n}\n```\n\n```java\n\
    public class MethodOverloadingDemo {\n    public void method1(int number1){\n\
    \        System.out.println(\"#### method1 with arg type : int\");\n    }\n  \
    \  public void method1(float number1){\n        System.out.println(\"#### method1\
    \ with arg type : float\");\n    }\n    public void method1(double number1){\n\
