- md: "\n```java\npublic abstract void makeSound();\n```\n\nAs you can see, the method\
    \ makeSound() does not have any implementation.\nMain purpose of abstract methods\
    \ is to create a method with signature and make it available for the users/client\
    \ so that client can provide the implementation of these methods as per their\
    \ requirements.\n\nWhile exposing abstract methods to clients we expect them to\
    \ provide the implementation where the access modifier and return type of the\
    \ method will be applicable to the implemented method.\n\n```java\npublic abstract\
    \ int addTwoNumbers(int number1,int number2);\n```\n\nAs we have the method, addTwoNumbers(int\
    \ number1,int number2) which will simply ADD Two numbers-number1 and number2 which\
    \ are of type integer.\n\n```java\npublic abstract class CalculatorDemo {\n  //\
    \ Abstract method declaration\n  public abstract int addTwoNumbers(int number1,int\
    \ number2)\n}\n```\n\nAs you can see, in the above code we have abstract class\
    \ CalculatorDemo and it has one abstract method addTwoNumbers(int number1,int\
    \ number2) which has 2 arguments of type integer. This method does not have any\
    \ implementation for this method. means we have NOT added any logic to ADD Two\
    \ numbers in this method, we have just defined the rule that this method will\
    \ ADD Two numbers and will return the result of type integer.\n\nAs we have created\
    \ this method for the client and we expect them to provide its implementation\
    \ as per their requirements and method should return the result of type integer\
    \ BUT we are NOT putting any restriction on -how to write the logic to ADD Two\
    \ numbers.\n\nIf any class will extend this class CalculatorDemo, then this class\
    \ needs to provide the implementation for the method addTwoNumbers(int number1,int\
    \ number2) OR this class should be declared as an “abstract class\".\n\nIf you\
    \ are new to Java, then you might have a question like, if we are NOT providing\
    \ implementation then what is the meaning of creating this method?\n\nIn Simple\
    \ words we can say that I want someone to provide this implementation as per their\
    \ requirement. Here I am just a Authority who is exposing this service to client\
    \ and setting some rules like how this method will be accessible and what value\
    \ it should return. it really help to make your code flexible and reusable.\n\n\
    # Some key info about Abstract class\n\n- 1. If a class has any abstract method\
    \ then the class must be an abstract class BUT if a class is an abstract class\
    \ then it's NOT necessary that the class will have an abstract method.\n\n- 2.\
    \ Abstract class can not be instantiated. means Object cant be created for that\
    \ class.\n\n- 3. If we don't want someone to create an object for your class BUt\
    \ you just wanted to expose your services/methods to client THEN its good practice\
    \ to declare that class as abstract.\n\n- 4. If you extend some abstract class\
    \ THEN it's not necessary that you have to implement its abstract method. if you\
    \ don't want to implement some method then just declare your class as abstract.\n\
    \nLet's create one abstract class EmployeeService and add some abstract method\
    \ to it as below.\n\n```java\npublic abstract class EmployeeService { 3 usages\
    \ 1 inheritor 1 related problem\n    public abstract double getEmployeeSalary(int\
    \ employeeId); no usages 1 implementation\n    public abstract String getEmployeeAddress(int\
    \ employeeId); no usages 1 implementation\n}\n```\n\nUse-case 1: extend above\
    \ abstract class EmployeeService and don't provide implementation for abstract\
    \ method.\n\n```java\npublic class EmployeeServiceHelper extends EmployeeService\
    \ {\n// Class 'EmployeeServiceHelper' must either be declared abstract or implement\
    \ abstract method 'getEmployeeSalary(int)' in 'EmployeeService'\n// Implement\
    \ methods: Mix abstract... ...\n// org.example.basic\npublic abstract class EmployeeService\n\
    // By Javafundamentals\n}\n```\n\nAs we have already seen that we need to provide\
    \ implementation for abstract methods OR we need to declare the class as abstract.\n\
    \nHere We have declared the class as abstract.\n\n- 3 public abstract class EmployeeServiceHelper\
    \ extends EmployeeService{\n\n# Use-case 2: extend the abstract class by child\
    \ class and implement its abstract methods.\n\n```java\npublic class EmployeeServiceHelper\
    \ extends EmployeeService{\n    @Override\n    public double getEmployeeSalary(int\
    \ employeeId) {\n        //You can ADD your own implementation\n        if(employeeId==1){\n\
    \            return 10000;\n        }\n        if(employeeId==2){\n          \
    \  return 20000;\n        }\n        else {\n            return 30000;\n     \
    \   }\n    }\n\n    @Override\n    public String getEmployeeAddress(int employeeId)\
    \ {\n        //You can ADD your own implementation\n        if(employeeId==1){\n\
    \            return \"Raj\";\n        }\n        if(employeeId==2){\n        \
    \    return \"Syam\";\n        }\n        else {\n            return \"Rohan\"\
    ;\n        }\n    }\n}\n```\n\n**Use-case 3:** try to create instance/object of\
    \ abstract class\n\n```java\npublic class EmployeeDemo {\n    public static void\
    \ main(String[] args) {\n        EmployeeService employeeService=new EmployeeService();\
    \ // 'EmployeeService' is abstract; cannot be instantiated\n        // Implement\
    \ methods More actions...\n    }\n}\n```\n\n# Why can't we create objects of an\
    \ abstract class ?\n\nIn Java, you cannot create an object of an abstract class\
    \ directly because abstract classes may have abstract methods without implementations.\
    \ An abstract class is meant to be a base class or a blueprint for other classes,\
    \ and it often contains incomplete or abstract methods that need to be implemented\
    \ by its subclasses.\n\n# Incomplete Implementation:\n\nAbstract classes may have\
    \ one or more abstract methods, which are methods declared without a body.\nSince\
    \ abstract lack an implementation in the abstract class itself, it would be inappropriate\
    \ to create an object of the abstract class because the object would be incomplete\
    \ or lack certain functionalities.\n\n# Enforcing Subclass Implementation:\n\n\
    Abstract classes are designed to be extended by other classes.\nThe abstract class\
    \ provides a common structure, including abstract methods, and expects its subclasses\
    \ to provide the specific implementations for those abstract methods.\nCreating\
    \ an instance of an abstract class without concrete implementations for its abstract\
    \ methods would violate the contract defined by the abstract class.\n\n# Abstract\
    \ Classes as Blueprints:\n\nAbstract classes often serve as blueprints or templates\
    \ for other classes.\nThey encapsulate common functionality and provide a basis\
    \ for customization in subclasses.\nSince abstract classes may lack complete implementations,\
    \ they are not suitable for direct instantiation.\n\n```java\npublic abstract\
    \ class Animal {\n    // Abstract method\n    public abstract void makesSound();\n\
    \n    // Concrete method\n    public void sleep() {\n        System.out.println(\"\
    ### sleep now.\");\n    }\n}\n\npublic class Dog extends Animal {\n    // Implementation\
    \ of the abstract method\n    @Override\n    public void makesSound() {\n    \
    \    System.out.println(\"#### bhou bhou ...\");\n    }\n}\n\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        // Cannot create an\
    \ object of abstract class\n        // Animal animal = new Animal(); // This line\
    \ would result in a compilation error\n        // Create an object of concrete\
    \ subclass\n        Animal dog = new Dog();\n        dog.makeSound(); // Calls\
    \ the overridden method in the Dog class\n        dog.sleep(); // Calls the method\
    \ from the abstract class\n    }\n}\n```\n\nIn this example, **Animal** is an\
    \ abstract class with an abstract method **makeSound()**. You can create an object\
    \ of the concrete subclass Dog and use it polymorphically through the Animal type.\
    \ This ensures that the abstract method is implemented in the subclass.\n\n# Interface\n\
    \nIn java, Interface is a way to enable us to design multiple inheritance.As we\
