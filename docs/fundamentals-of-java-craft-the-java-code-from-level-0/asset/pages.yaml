  md: '# Naming convention


    Variable


    +   - The choice of a variable name should be mnemonic- that is, designed to indicate
    the intent of its use.


    +   - Variables should be named using camelCasing,which means it should always
    start with a lowercase letter and then capitalize the first letter of every subsequent
    word.


    +   - Variable names should always start with a lowercase letter.


    +   - variables in Java are not allowed to contain white space, so variables made
    from compound words are to be written with a lower camel case syntax.


    +   - It should begin with a letter (A to Z or a to z), currency character ($)
    or an underscore (_)


    Here are three examples of variables that follow the standard Java naming convention:


    +   - firstName


    +   - timeToFirstLoad


    +   - index


    +   - ROLL_NUMBER=10


    class


    Classes should be named using PascalCasing, with the first letter of each word
    capitalized.


    A class name should be a noun or a word representative of an object.'
