  md: '# Wrapper Class


    As the name suggests,wrapper class used to wrap the primitive data type to Object
    type.


    Java has provided wrapper classes for each primitive data type.


    Primitive data types tie like int, char, and float are simple and efficient for
    basic data storage, but they NOT best to work with objects and perform certain
    operations. To bridge this gap between primitive types and objects, Java provides
    a set of wrapper classes. Wrapper classes are a group of classes that encapsulate
    primitive data types, allowing them to be treated as objects.'
