  md: '# Polymorphism


    The derivation of the word Polymorphism from two different Greek Polymorphisms
    is derived from 2 Greek words: poly and morphs. The word "poly" means many and
    "morphs" means forms. So polymorphism means many forms.


    Polymorphism in Java is a concept by which we can perform a single action in different
    ways.


    It refers to the ability of a class to take on multiple forms.


    There are two types of polymorphism in Java: compile-time (or static) polymorphism
    and runtime (or dynamic) polymorphism.


    # Compile-time Polymorphism (Method Overloading):


    Method overloading allows a class to have multiple methods with the same name
    but different parameters (different types or a different number of parameters).


    The compiler determines which method to call based on the method signature during
    compile-time.


    If a class has multiple methods having the same name but different in parameters,
    it is known as Method Overloading.


    If we have to perform only one operation, having the same name of the methods
    increases the readability of the program.'
