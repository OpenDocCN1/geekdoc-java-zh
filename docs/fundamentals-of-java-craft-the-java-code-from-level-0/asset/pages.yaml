  md: '# Exception Handling in Java: Best Practices


    It''s best practice to catch only those exceptions that can be handled.


    Null values should not be returned in the catch block rather than handling an
    exception, it consumes the exception and the error fails permanently and programs
    crashes.


    Don''t get the exception class instead catch particular subclasses.


    Never throw an exception from the finally block, because even if any exception
    is not raised in the try block, the finally block will throw the exception, after
    execution of try-catch blocks.


    Use finally blocks instead of catch blocks if you are not going to handle the
    exception.


    Always use the finally block to close the used resources.


    It''s always best practice to close/terminate the resources after use, if possible
    try with resources so that JVM will kill the unused resources.'
