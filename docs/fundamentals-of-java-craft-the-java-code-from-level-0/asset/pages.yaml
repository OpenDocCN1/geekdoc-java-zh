    In Java, a Map is a part of the Java Collections Framework and represents a collection
    of key-value pairs. Each key is associated with exactly one value, and the keys
    in a map must be unique. The Java Map interface provides methods for adding, retrieving,
    and removing key-value pairs, making it a versatile and widely used data structure.


    Characteristics of a Map:


    +   Key-Value Pairs: Each element in a map is a key-value pair, where the key
    is used to uniquely identify the associated value.


    +   Uniqueness of Keys: The keys in a map must be unique. If you attempt to add
    a key-value pair with a key that already exists in the map, the new value will
    overwrite the existing value.


    Common Map Implementations:


    HashMap:


    Implements a map using a hash table.


    Offers constant-time performance for basic operations (get, put, remove) on average.


    Does not guarantee any specific order of key-value pairs.


