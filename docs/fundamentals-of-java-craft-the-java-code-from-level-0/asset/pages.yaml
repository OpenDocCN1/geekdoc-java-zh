  md: '# # The Interface Segregation Principle (ISP)


    Idea: A class should not be forced to implement interfaces it does not use.


    **Example:** If an interface has multiple methods and a class only needs to use
    a few of them, it should not be obligated to implement the unnecessary methods.


    **Example:** Think of a machine interface. If you have a simple machine that only
    starts and stops, it shouldn''t be forced to implement a method for maintenance.
    Different machines can implement different interfaces based on their capabilities.


    # # Explanation


    It is one of the SOLID principles of object-oriented design. It emphasizes that
    classes should not be forced to implement interfaces that contain methods they
    don''t need. In other words, clients (classes or modules that use interfaces)
    should not be dependent on methods they don''t use. Instead, interfaces should
    be designed to be small, focused, and tailored to specific use cases.


    Here''s a detailed explanation of the Interface Segregation Principle in the context
    of Java.


    # # Problem Without ISP


    Suppose you''re designing an interface for a generic machine.


    The interface includes methods like start(), stop(), and performMaintenance().'
