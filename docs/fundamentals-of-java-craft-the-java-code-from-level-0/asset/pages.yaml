  md: '# History of Java


    The history of Java begins in the early 1990s when a team of engineers at Sun
    Microsystems, led by James Gosling, Mike Sheridan, and Patrick Naughton, started
    working on a project known as "Green." The goal of the Green project was to develop
    software for consumer electronics, including interactive television. However,
    as the project evolved, the team recognized the potential of their work beyond
    consumer electronics.


    Here''s a timeline of key events in the history of Java:


    +   1991: The Green project begins at Sun Microsystems. The team, known as the
    "Green Team," envisions a new programming language for embedded systems.


    +   1992: The project is renamed "Oak" after the oak tree outside Gosling''s office.
    Oak is designed with a focus on portability and the ability to run on a variety
    of devices.


    +   1995: Oak is officially renamed "Java." The name change was prompted by trademark
    issues, as there was already a computer company named Oak. The Java programming
    language is publicly released with the tagline "Write Once, Run Anywhere" (WORA),
    emphasizing its platform independence.


    +   1996: Java 1.0 is released, marking the first official version of the language.
    It includes key features such as applets (small, downloadable programs that could
    be embedded in web pages) and the Java Virtual Machine (JVM).


    +   1997: Sun Microsystems releases Java 1.1, which introduces inner classes,
    JavaBeans, and the JDBC (Java Database Connectivity) API.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '1998: Java 2, also known as J2SE 1.2, is released. This version brings significant
    enhancements, including the Swing GUI toolkit, the Collections framework, and
    the Java Naming and Directory Interface (JNDI).


    2004: Java undergoes a major overhaul with the release of Java 5 (J2SE 5.0), codename
    "Tiger.". This version introduces generics, metadata annotations, enumerated types,
    and the enhanced loop.'
