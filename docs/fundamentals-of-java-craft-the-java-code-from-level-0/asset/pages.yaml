  md: "# Collect data with additional downstream collector\n\n```\ncollectingAndThen(Collector<T,A,R>\
    \ downstream, Function<R,RR> finisher\n```\n\nThis method allows you to perform\
    \ a finishing transformation on the result of a collector.\n\nIt takes two arguments:\
    \ the first argument is the collector that collects elements, and the second argument\
    \ is a function that performs the finishing transformation on the result of the\
    \ collector.\n\nThe result of this transformation is the final result of the collectingAndThen\
    \ collector.\n\n```\n// Create a list of integers\nList<Integer> numbers = Stream.of(10,20,30,40)\n\
    .collect(Collectors.toList());\n```\n\n```\n// Use collectingAndThen to get the\
    \ sum of all integers in the list\nint sum = numbers.stream()\n.collect(Collectors.collectingAndThen(\n\
    \    Collectors.summingInt(x->x.intValue()),\n    result -> {\n        System.out.println(\"\
    Transforming result Data: \" + result);\n        return result * result;\n   \
    \ }\n));\nSystem.out.println(\"Final result Data: \" + sum);\n```"
