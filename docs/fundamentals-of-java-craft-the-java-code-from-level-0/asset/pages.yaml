  md: "# For loop\n\nif you know exactly how many times you want to execute the block\
    \ code, you should use the for loop instead of a while/do-while loop.\n\nLet's\
    \ consider a use-case where you want to print five consecutive numbers starting\
    \ from 3.\n\nHere you should use for loop, you can do the same using while loop\
