  md: '# Stream


    Stream is a sequence of elements that can be pipelined.


    +   - It supports sequential as well as parallel operation.

    - It was introduced in Java 8 as part of the Java Streams API under java.util.stream
    package

    - Streams are used for processing sequences of data, such as collections (e.g.,
    lists, sets, maps) or other data sources, in a functional and declarative manner.


    Note that java.util.stream has NO relation with java.io.stream,java.io.stream
    is dedicated to file I/O operation java.util.stream is related to processing of
    data through stream pipelines in sequential or parallel way.


    # Characteristics and features of Java Streams


    +   1. Functional Programming: Streams promote a functional programming approach
    in Java starting from java 8.Stream provides a very simple way to process data
    ,transforming data,filtering data and collecting in required collection objects.
    You can use a series of high-level operations to process data, such as map, filter,
    reduce, and collect, rather than explicitly writing loops. We will look into detail
    later in the section.


    +   2. Laziness: Streams are lazy by nature, meaning that they only process elements
    as needed. Operations on a Stream are not executed until a terminal operation
    is invoked. This can improve performance and reduce memory consumption,we will
    look into detail about intermediate and terminal operation.


    +   3. Chaining: chaining the multiple operations, performing data transformation
    on a given dataset is a common operation is Stream. You can chain multiple operations
    together to create a pipeline for data processing. This allows you to express
    complex data transformations in a concise and readable way.'
