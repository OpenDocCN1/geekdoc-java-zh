  md: '# Key facts:


    In overriding,method resolution is always taken care by JVM based on Runtime objects
    hence overriding is also called Runtime polymorphism OR dynamic Polymorphism OR
    Late binding.


    Overriding method resolution is also known as Dynamic method dispatch.


    In Overloading,method resolution is based on reference type BUT not based on Runtime
    object where in method overriding method resolution is always taken care by JVM
    based on Runtime object.


    In method overriding,method name and arguments must be matched.means method signature
    must be the same.


    Private methods will NOT be visible in child class,the overriding concept is NOT
    applicable for private methods.


    In overriding, we can''t reduce the scope of the access modifier.


    If the child class method throws any checked Exception,then the parent class method
    should throw the same Exception or its parent otherwise we will get a compile
    time Exception.'
