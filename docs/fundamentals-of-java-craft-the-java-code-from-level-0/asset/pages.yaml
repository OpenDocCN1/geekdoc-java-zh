  md: '+   - map(Function f) used to map the data to the required dataset.


    +   - Consider a use-case that you have an Employee List, you want to get the
    Name of all the Employee.


    +   - Or you want to get the CITY name of all the employees.


    +   - We can achieve using map(..),we will simply map Employee objects to Employee
    Name.


    +   - In simple words, we can say that map(..) is used to map data from one format
    to another format.


    +   - The map operation is useful for modifying the elements of a stream or extracting
    specific data from them.


    +   - map method is an intermediate operation used to transform each element of
    a stream into another element. It applies a given function to each element of
    the stream and returns a new stream containing the transformed elements. The original
    stream remains unchanged.


