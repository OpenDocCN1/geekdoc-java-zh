  md: '# Stream Methods Walkthrough


    Filter Stream data


    Stream<T> filter(Predicate<? super T>)


    +   - As we know, filter(..) is an intermediate operation so it will return a
    Stream of filtered data.

    - Returns a stream consisting of the elements of this stream that match the given
    predicate.

    - Predicate is nothing but a conditional operation that returns a boolean value.

    - Predicate will accept one input of any type and returns aa out of Boolean type.

    - it used to filter data based on some given condition.

    - Predicate is Functional Interface, for more info, visit Function Interface section.


    We can simply apply this filter on any Stream to get filter data for the given
    condition.


    Predicate takes an input<T> and provides a boolean value.'
