  md: "# Dependency Inversion Principle (DIP)\n\n**Idea:** High-level modules should\
    \ not depend on low-level modules; both should depend on abstractions.\n\n**Example:**\
    \ Instead of a higher-level module relying directly on a lower-level module, both\
    \ should depend on an abstract interface. This promotes flexibility and makes\
    \ the system less tightly coupled.\n\n**Example:** Consider a light switch. It\
    \ depends on electricity (low-level), but the switch and the bulb depend on the\
    \ abstraction of a \"Switchable\" interface. This way, you can change the bulb\
    \ or the switch independently without affecting each other.\n\nThe **Dependency\
    \ Inversion Principle (DIP)** is one of the SOLID principles of object-oriented\
