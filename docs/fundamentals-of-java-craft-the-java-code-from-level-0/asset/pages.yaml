  md: '# What is Java ?


    Java is a high-level, versatile, object-oriented programming language that was
    developed by Sun Microsystems (acquired Oracle Corporation) in the mid-1990s.
    It is designed to be platform-independent, which means that Java programs can
    run on any device or operating system that has a Java Virtual Machine (JVM) installed.


    # Key features of Java include


    Platform Independence: Java code can be written once and run anywhere. The "Write
    Once, Run Anywhere" (WORA) principle is achieved by compiling Java code into an
    intermediate form called bytecode, which can be executed on any device with a
    compatible JVM.


    Object-Oriented: Java is an object-oriented programming language, which means
    it uses a modular structure called objects to organize code. This promotes code
    reuse, flexibility, and maintainability.


    Automatic Memory Management: Java uses a garbage collector to automatically manage
    memory. This helps developers avoid common programming errors related to memory
    leaks and makes Java programs more robust.


    Multi-threading: Java supports concurrent programming by providing built-in features
    for creating and managing threads. This allows developers to write programs that
    can perform multiple tasks simultaneously.


    Rich Standard Library: Java comes with a comprehensive set of libraries that provide
    support for tasks such as networking, file I/O, database connectivity, and more.
    This helps developers to write powerful and efficient programs without having
    to build everything from scratch.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Security: Java has built-in security features that help protect systems from
    harmful activities. The Java Runtime Environment (JRE) uses a security manager
    to control access to resources and ensure the safety of Java applications.


    Java is widely used in various domains, including web development, mobile app
    development (Android apps are often written in Java), enterprise applications,
    and large-scale distributed systems. It has remained a popular programming language
    for decades due to its portability, reliability, and extensive community support.'
