  md: '# Throw keyword


    throw keyword used to throw an exception explicitly.


    We can throw checked as well as unchecked exceptions using it.


    We specify the class of the exception object which is to be thrown. The exception
    has some error message with it that provides the error description.


    We can also define our own set of conditions for which we can throw an exception
    explicitly using the throw keyword.


    In simple words,we can say that based on some given condition or use-case you
    can simply throw some defined exception OR any user defined exception which is
    a child of a java defined exception.


    The flow of execution of the program stops immediately after the throw statement
    is executed and the nearest try block is checked to see if it has a catch statement
    that matches the type of exception.


    It tries to find all the catch blocks until it finds the respective handler, else
    it transfers the control to the default handler which will halt the program.


    ```

    package org.example.exception;


    import java.io.IOException;


    import java.nio.file.Files;


    import java.nio.file.Path;

    ```'
