  md: '# Interface


    In java, Interface is a way to enable us to design multiple inheritance.As we
    know multiple inheritance is NOT supported in Java but the same is possible using
    interface.


    Interface is one of the best ways to expose your service to clients,it provides
    one level of abstraction in java.


    It cant be instantiated like an abstract method.


    Before java 8 , we can have only abstract methods in interface BUT in later versions
    of java after java 8 , you can have default methods and static methods also.


    In simple words , -you can say that an interface is a way to expose your services
    without showing background details.


    Interfaces provide a level of abstraction by defining a set of methods without
    specifying their implementations.


    Classes implementing the interface must provide concrete implementations for all
    the abstract methods.


    Naming Convention for Interface:


    +   - Interfaces should be named using PascalCasing, with the first letter of
    each word capitalized.


    +   - It should be meaningful, instead of acronyms


    +   - It should be an adjective such as Runnable, Remote, ActionListener.'
