    take advantage of multiple CPU cores to process data concurrently. Parallel streams
    are created using methods like parallelStream().creating a parallel Stream which
    consume available no of CPU but we can override this behavior also.it uses work
    stealing algorithm where job automatically pick the available pending tasks once
    the current task is done , it will also keep combining the result using combiner


    5. Immutability: Streams are immutable by nature so it does not modify the underlying
    data source. Instead, they create a new Stream with the transformed data, leaving
    the original data unchanged.


