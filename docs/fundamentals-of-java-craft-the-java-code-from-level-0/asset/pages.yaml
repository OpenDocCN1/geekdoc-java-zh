  md: 'By applying DIP, the high-level module (NotificationService) is no longer tightly
    coupled to the low-level module (EmailService), and both depend on abstractions,
    providing a more flexible and maintainable design.


    In other words, the Dependency Inversion Principle encourages loose coupling between
    different parts of a software system. This loose coupling makes the system more
    flexible, maintainable, and adaptable to changes.


    Software dependency, or coupling, is a common problem that needs to be addressed
    in system design. Coupling defines how much reliance there is between different
    components of your software. High coupling indicates a high degree of reliance.
    Low coupling indicates low dependency. Dependency determines how easily changes
    can be made to a system.


    If parts of a system are dependent on each other, then substituting a class or
    resource for another is not easily done, or even impossible.


    The dependency inversion principle addresses dependency, to help make systems
    more robust and flexible. The principle states that high-level modules should
    depend on high-level generalizations, and not on low-level details. This keeps
    client classes independent of low-level functionality.


    This suggests that client classes should depend on an interface or abstract class,
    rather than a concrete resource. Further, concrete resources should have their
    behaviors generalized into an interface or abstract class. Interfaces and abstract
    classes are high-level resources. They define a general set of behaviors. Concrete
    classes are low-level resources. They provide the implementation for behaviors.


    All the design patterns covered in this course are built on this dependency inversion
    principle.'
  merge: -1
