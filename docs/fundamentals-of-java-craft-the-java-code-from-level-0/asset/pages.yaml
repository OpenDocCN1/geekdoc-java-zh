  md: '# throw vs throws


    As you can see , the names look similar so it''s a bit confusing for new developers.


    In simple words , we can say that throwing means delegating the exception handling
    to the caller, means you are NOT going to handle the exception anymore.


    throw means, based on some given set of logic as per your requirements you can
    throw any appropriate exception. As we have seen earlier , if you are validating
    username and you find that username is NOT valid THEN you can simply create one
    user defined exception like UserNameNotValid and you can simply throw it.


    | throw | throws |

    |---|---|

    | It is used to throw an exception explicitly in the program,from any block of
    code | It is used with function signatures to declare an exception that the method
    may throw while execution of code. |

    | throw is used within the method.you can throw only one exception at a time.
    | throws is used within the method signature.any number of exceptions can be added
    with declaration. |

    | throw keyword can be used to throw both checked and unchecked exceptions. |
    throws keyword can be used only with checked exceptions |'
