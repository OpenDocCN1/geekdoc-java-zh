- img_proc: true
  md: '# Difference Between Checked and Unchecked Exceptions


    | Checked Exception | Unchecked Exception |

    |---|---|n| Occur at compile time. | Occur at runtime. |

    | The compiler checks for checked exceptions. | The compiler does not check for
    unchecked exceptions. |

    | If checked exceptions are not handled we get a compile-time error. | If unchecked
    exceptions are not handled we get a run time error. |

    | Can be handled at compile time. | Can not be caught/handled at runtime. |

    | They are direct subclasses of exception class but do not inherit Runtime Exception
    Class. | They are subclasses of the Runtime Exception class. |

    | Eg: IOException, ClassNotFoundException, SQLException are common checked exceptions.
    | Eg: ArithmeticException, NullPointerException, NumberFormatException, StringIndexOutOfBoundsException,
    ArrayIndexOutOfBoundException are common unchecked exceptions. |'
