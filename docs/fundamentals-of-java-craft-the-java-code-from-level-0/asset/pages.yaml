  md: '# Benefits of Wrapper class


    Below are some major benefits of java Wrapper classes.


    # Representing primitive data types as objects:


    Wrapper classes provide a way to use primitive data types as objects, which is
    necessary in certain situations where only objects are accepted, such as in collections
    like ArrayList and HashMap.its always good practice of using Wrapper classes instead
    of primitive data type.


    # Storing null values:


    Primitive data types in Java cannot store null values, but wrapper classes can
    be set to null, which can be useful in representing missing or unknown values.


    # Autoboxing and unboxing:


    Wrapper classes provide automatic conversions between primitive data types and
    their corresponding wrapper objects through a feature called autoboxing and unboxing.


    Autoboxing in Java refers to the automatic conversion of primitive data types
    to their corresponding wrapper classes.


    Prior to Java 5, converting a primitive value to its corresponding wrapper class
    in Java required manual conversion, using the constructor of the wrapper class.after
    Java 5 ,JVM will take care of auto-conversion.


    ```

    import java.util.*;;

    import java.lang.*;

    import java.io.*;

    ```'
