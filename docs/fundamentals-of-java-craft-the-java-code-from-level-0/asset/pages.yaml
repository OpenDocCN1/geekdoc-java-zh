  md: '# Stream Operations


    There are two types of operation that Stream supports.


    +   1. Intermediate Operation:

    2. Terminal Operation


    # Intermediate Operation:


    +   1. Intermediate Operation returns another Stream as result.

    2. Streams are lazy by nature.

    3. Intermediate Operation dont get executed until it''s invoked by terminal operation.

    4. Intermediate operations can be chained together to build pipelines.

    5. Intermediate operation mainly used for data transformation and manipulation.

    6. Multiple Intermediate operations can be chained together as required.


    Below are some intermediate operation:


    +   * filter()

    * map()

    * flatMap()

    * distinct()

    * sorted()

    * peek()

    * limit()

    * skip()'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Terminal Operation:


    +   1. Terminal operation returns a single value as result.from Name itself you
    can think that it''s just to finish the Stream Operation

    2. Instead of Stream it returns a single value as Result.

    3. It can''t be chained with any other terminal operation.

    4. Once terminal operation is triggered on any Stream,you can no longer perform
    any other operation on that given Stream and as a side effect it will just produce
    a value as result.


    Below are some Stream terminal operation:


    +   * anyMatch()

    * allMatch()

    * noneMatch()

    * collect()

    * count()

    * findAny()

    * findFirst()

    * forEach()

    * min()

    * max()

    * reduce()

    * toArray()


    Now from the above explanation,it''s clear that Stream Intermediate operation
    is for data manipulation and transformation and Terminal operation for final result
    collection.'
