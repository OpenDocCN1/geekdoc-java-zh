  md: '# Collection


    The Collection in Java is a framework that provides an architecture to store and
    manipulate the group of objects.


    Java Collections can achieve all the operations that you perform on data such
    as searching, sorting, insertion, manipulation, and deletion.


    Collections and arrays are similar in that they both hold references to objects
    and they can be managed as a group. However, unlike arrays, Collections do not
    need to be assigned a certain capacity when instantiated. Collections can grow
    and shrink in size automatically when objects are added or removed.


    Collections cannot hold primitive data types such as int, long, or double.Instead,
    Collections can hold wrapper classes such as Integer, Long, or Double.


    Array can hold only given data as you declared BUT collection can hold any kind
    of data in it.


