  md: "# Abstract Class\n\nAn abstract class is a class that cannot be instantiated\
    \ on its own and is meant to be subclassed by other classes. Abstract class is\
    \ a class that may contain abstract methods as well as concrete methods.\n\nConcrete\
    \ method is just a simple method with implementation.implementation may be default\
    \ or empty.\n\nAbstract method : it's a method without implementation.\n\nAn abstract\
    \ method is a method that is declared in an abstract class or interface but does\
    \ not have any implementation in that class or interface.\n\nAbstract methods\
    \ are meant to be implemented by the subclasses or classes that implement the\
    \ interface.\n\nAbstract methods are declared using the abstract keyword.\n\n\
    They don't have a body (implementation).\n\n```\npublic abstract class Animal\
    \ {\n    // Abstract method declaration\n    public abstract void makeSound();\n\
    }\n```\n\nAbstract methods do not provide any implementation in the abstract class\
    \ or interface that declares them.\n\nThe purpose is to provide a common method\
    \ signature that must be implemented by concrete subclasses or implementing classes."
