  md: '# Array :what is an array in Java ?


    It contains elements of a similar data type.


    Arrays in Java store multiple values of the same type in a single variable.


    Elements of an array are stored in a contiguous memory location.


    They are objects that can hold a fixed number of elements, and each element has
    an index used to access it.


    We used to provide the array size during its decoration only.


    Indexing in an array starts from 0, so the 1st element of the array is stored
    at the 0th index, the 2nd element is stored on the 1st index and so on.


    | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | ... |

    |---|---|---|---|---|---|---|---|---|'
