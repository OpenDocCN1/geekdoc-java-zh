  md: '# Low Level Dependency


    In order to better understand the dependency inversion principle, let us examine
    low-level dependency. In a low-level dependency, the client classes name and make
    direct references to a concrete class. Subsystems are directly dependent on each
    other, so the client class will directly reference some concrete class in the
    enterprise subsystem, which will directly reference some concrete class in your
    backend.


    ![](img/199017295e77c8cc572552acdaf8f7fc_150_0.png)


    Let us examine this as code.


    This has a low-level dependency. There is direct naming and referencing to the
    concrete class, QuickSorting, which is used in this example to sort a list sent
    to the system by a user. However, if a different sorting class called MergeSort*'
