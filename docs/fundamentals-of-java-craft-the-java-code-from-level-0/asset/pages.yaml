  md: '# Exception Handling


    # What is an Exception ?


    An exception is an unwanted or unexpected event that occurs during the execution
    of the program ,it disrupts the flow of the program.


    Let''s assume some use-case where some exception will occur.


    if you want to divide an integer by 0 then it is an exception, as it is not possible
    mathematically.


    You are trying to open some file BUT that file is NOT available on the expected
    path.


    You have some java object and you are trying to access data from that object which
    is already run.


    In simple words, you can say that an exception is something that breaks the flow
    of execution.


    # How to handle Exceptions ?


    In-order to handle exceptions we have to put some code which will prevent any
    kind of error in execution.


    Exception handling in Java is the process of responding to the occurrence of exceptions.


    Exceptional handling helps to identify exceptional conditions and maintain the
    flow of the program as expected, by handling/avoiding the errors if occurred.
    In some cases, it is used to make the program user-friendly.'
