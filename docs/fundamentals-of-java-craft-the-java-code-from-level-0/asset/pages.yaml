  md: '# Type of Exception


    There are mainly two types of exceptions: checked and unchecked.


    +   1.Checked Exception

    2.Unchecked Exception


    # Checked Exception


    Checked exceptions are those exceptions that are checked at compile time by the
    compiler.


    The program will not compile if they are not handled.


    These exceptions are child classes of the Exception class.


    Checked exceptions are exceptions that the Java compiler requires us to handle.
    We have to either declaratively throw the exception up the call stack, or we have
    to handle it ourselves.


    # Unchecked Exceptions


    Unchecked exceptions are those exceptions that are checked at run time by JVM,
    as the compiler cannot check unchecked exceptions,


    The programs with unchecked exceptions get compiled successfully so you will NOt
    get any compilation error but you will get runtime errors if not handled.'
