  md: '# Set


    Set is a collection that cannot contain duplicate elements. This interface models
    the mathematical set abstraction and is used to represent sets, such as the deck
    of cards.


    The Java platform contains three general-purpose Set implementations: HashSet,
    TreeSet, and LinkedHashSet. Set interface doesn''t allow random-access to an element
    in the Collection. You can use an iterator or foreach loop to traverse the elements
    of a Set.


    # HashSet


    Java HashSet is the basic implementation of the Set interface that is backed by
    a HashMap.


    It makes no guarantees for iteration order of the set and permits the null element.


    This class offers constant time performance for basic operations (add, remove,
    contains and size), assuming the hash function disperses the elements properly
    among the buckets.


    We can set the initial capacity and load factor for this collection. The load
    factor is a measure of how full the hash map is allowed to get before its capacity
    is automatically increased.


    The Set interface is implemented by several classes in Java, with HashSet, LinkedHashSet,
    and TreeSet being the primary implementations.'
