  Python 代码\n```python\nfrom itertools import groupby\ndef compress(l_nums):\n   \
  \ return [key for key, group in groupby(l_nums)]\n\nn_list = [0, 0, 1, 2, 3, 4,\
  \ 4, 5, 6, 6, 6, 7, 8, 9, 4, 4]\nprint(\"Original list:\")\nprint(n_list)\nprint(\"\
