    ^\nfirst type: int\nsecond type: boolean\n1 error\n```\n\n# Logical Operators\n\
    \nJava provides three logical operators, These are `&&` (AND), `||` (OR), and\
    \ `!` (NOT).\n\nLogical AND is also called Conditional AND.\nLogical OR is also\
    \ called Conditional OR.\nLogical AND, OR are called Short circuit operators,\
    \ will see why these are called short circuit soon.\n\n### Logical AND Operator\n\
    \n| Operand1 | Operand2 | Evaluates To |\n| :--- | :--- | :--- |\n| TRUE | TRUE\
    \ | TRUE |\n| TRUE | FALSE | FALSE |\n| FALSE | TRUE | FALSE |\n| FALSE | FALSE\
    \ | FALSE |\n\nAs shown in the above table, `&&` operator returns true if both\
    \ the operands evaluates to true, otherwise returns false.\n\n#### Example\n```java\n\
    class AndEx{\n    public static void main(String args[]){\n      boolean operand1\
    \ = true;\n      boolean operand2 = true;\n      System.out.println((operand1\
    \ && operand2));\n      operand1 = true;\n      operand2 = false;\n      System.out.println((operand1\
    \ && operand2));\n      operand1 = false;\n      operand2 = true;\n      System.out.println((operand1\
    \ && operand2));\n      operand1 = false;\n      operand2 = false;\n      System.out.println((operand1\
    \ && operand2));\n    }\n}\n```\nOutput\n```\ntrue\nfalse\nfalse\nfalse\n```\n\
    \n#### Why Logical AND is called short circuit operator\nSince if the first statement\
    \ in the expression evaluates to false, then java won't evaluates the entire expression.\
    \ So Logical AND is called short circuit AND.\n\n#### Example\n```java\nclass\
    \ ShortCircuitAnd{\n    public static void main(String args[]){\n      int a =\
    \ 10, b=21;\n      if( (a>b) && (a++ > b) ){\n        System.out.println(\"This\
    \ statement not evaluated\");\n      }\n      System.out.println(\"a is not incremented\
    \ \" + a);\n      if( (a<b) && (a++ < b) ){\n        System.out.println(\"This\
    \ statement is evaluated\");\n      }\n      System.out.println(\"a is not incremented\
    \ \" + a);\n    }\n}\n```\nOutput\n```\na is not incremented 10\nThis statement\
    \ is evaluated\na is not incremented 11\n```\n#### Observation\nIn the expression\
    \ `(a>b) && (a++ > b)`, `a>b` is false, so `&&` operator won't evaluates second\
    \ statement in the expression, so `a` is not incremented.\n\n### Logical OR Operator\n\
    \n| Operand1 | Operand2 | Evaluates To |\n| :--- | :--- | :--- |\n| TRUE | TRUE\
    \ | TRUE |\n| TRUE | FALSE | TRUE |\n| FALSE | TRUE | TRUE |\n| FALSE | FALSE\
    \ | FALSE |\n\nAs shown in the above table, `||` operator returns true if any\
    \ of the operand evaluates to true, otherwise returns false.\n\n#### Example\n\
    ```java\nclass OrEx{\n    public static void main(String args[]){\n      boolean\
    \ operand1 = true;\n      boolean operand2 = true;\n      System.out.println((operand1\
    \ || operand2));\n      operand1 = true;\n      operand2 = false;\n      System.out.println((operand1\
    \ || operand2));\n      operand1 = false;\n      operand2 = true;\n      System.out.println((operand1\
    \ || operand2));\n      operand1 = false;\n      operand2 = false;\n      System.out.println((operand1\
    \ || operand2));\n    }\n}\n```\nOutput\n```\ntrue\ntrue\ntrue\nfalse\n```\n\n\
    #### Why Logical OR is called short circuit operator\nSince if the first statement\
    \ evaluates to true, then java won't evaluates the entire expression. So Logial\
    \ OR is called short circuit OR.\n\n#### Example\n```java\nclass ShortCircuitOr{\n\
    \    public static void main(String args[]){\n      int a = 10, b=21;\n      if(\
    \ (a<b) || (a++ < b) ){\n        System.out.println(\"This statement evaluated\"\
    );\n      }\n      System.out.println(\"a is not incremented \" + a);\n      if\
    \ (a>b) || (a++ > b) ){\n        System.out.println(\"This statement is evaluated\"\
    );\n      }\n      System.out.println(\"a is incremented \" + a);\n    }\n}\n\
    ```\nOutput\n```\nThis statement evaluated\na is not incremented 10\na is incremented\
    \ 11\n```\n\n### Logical (!) operator\n\n| Operand | Executes To |\n| :--- | :---\
    \ |\n| FALSE | TRUE |\n| TRUE | FALSE |\n\nIf the operand is FALSE, `!` Operator\
    \ evaluates it to TRUE. If the operand is TRUE, `!` Operator evaluates it to FALSE.\n\
    \n#### Example\n```java\nclass LogicalNot{\n    public static void main(String\
    \ args[]){\n      boolean a = true;\n      System.out.println((!a));\n      a\
    \ = false;\n      System.out.println((!a));\n    }\n}\n```\nOutput\n```\nfalse\n\
    true\n```\n\n# Bit Wise Operators\n\nThe Java language provides operators that\
    \ perform bit wise and shift operations on integral types.\n\n| Operator | Description\
    \ |\n| :--- | :--- |\n| `~` | Inverts bit pattern |\n| `<<` | Perform Left shift\
    \ |\n| `>>` | Perform Right Shift |\n| `>>>` | Perform unsigned right shift |\n\
    | `&` | Bit wise AND |\n| `|` | Bit wise OR |\n| `^` | Bit wise Exclusive OR |\n\
    \nBefore discuss the Bit wise operators, will discuss Binary representations of\
    \ a number\n\n### 1's Complement\n1's complement simply inverts the bits, if the\
    \ bit is set to zero, it sets the bit to 1 and if the bit is set to 1 it sets\
    \ the bit to zero.\nEx: `8` in binary = `0000 1000`\n`1's complement(8)` = `1111\
    \ 0111`\n\n### 2's complement\nNegative numbers are stored in 2's complement form.\
    \ i.e., `-8` is 2's complement of `8`.\n2's complement is sum of `(1's complement\
    \ of number + 1)`.\nEx: `8` in binary = `0000 1000`\n`1's complement(8)` = `1111\
    \ 0111`\n`2's complement(8)` = `1111 0000`\ntherefore `-8` in 2's complement form\
    \ is `11111000`.\n\n### Inversion (~)\nInversion operator change the bit value\
    \ to zero, it is one and change the bit value to one if it is zero.\nEx: `byte\
    \ a = 7;` `a` in binary format is `0000 0111`.\n`~(a)` in binary format is `1111\
    \ 1000`.\n`~(a)` represents `-8` in binary format.\n\n#### Example\n```java\n\
    class BitWiseEx{\n    public static void main(String args[]){\n      byte byteVar\
    \ = 7;\n      System.out.println(\"Value of Byte variable is \" + byteVar);\n\
    \      System.out.println(\"Value of Byte variable after inversion is \" + ~(byteVar));\n\
    \    }\n}\n```\nOutput\n```\nValue of Byte variable is 7\nValue of Byte variable\
    \ after inversion is -8\n```\n\n### Bit Wise Left Shift(<<)\nLeft shift operator\
    \ simply shifts all the bits to one bit left, i.e, it simply doubles the value.\n\
    Syntax: `variable << n`\nleft shift the variable by `'n'` number of times.\n`Variable\
    \ << n` is equals to `variable = variable * 2 power n`.\nEx: `int var = 2;`\n\
    `var << 1 = 2 * 2 power 1 = 4`\n`var << 2 = 2 * 2 power 2 = 8`\n`var << 9 = 2\
    \ * 2 power 9 = 1024`\n\n#### Example\n```java\nclass BitWiseEx{\n    public static\
    \ void main(String args[]){\n      byte byteVar = 7;\n      System.out.println(\"\
    Value of Byte variable is \" + byteVar);\n      System.out.println(\"After shifting\
    \ 1 bit left \" + (byteVar<<1));\n      System.out.println(\"After shifting 2\
    \ bits left \" + (byteVar<<2));\n      System.out.println(\"After shifting 3 bits\
