    | FALSE | TRUE | FALSE |


    | FALSE | FALSE | FALSE |


    As shown in the above table, && operator returns true if both the operands evaluates
    to true, otherwise returns false.


    Example


    class AndEx{


    public static void main(String args[]){


      boolean operand1 = true;


      boolean operand2 = true;


      System.out.println((operand1 && operand2));


      operand1 = true;


      operand2 = false;


      System.out.println((operand1 && operand2));


      operand1 = false;


      operand2 = true;


      System.out.println((operand1 && operand2));


      operand1 = false;


      operand2 = false;


      System.out.println((operand1 && operand2));


    }


    }


    Output


    true


    false


    false


    false


    Why Logical AND is called short circuit operator


    Since if the first statement in the expression evaluates to false, then java won''t
    evaluates the entire expression. So Logical AND is called short circuit AND


    Example


    class ShortCircuitAnd{


    public static void main(String args[]){


      int a = 10, b=21;


      if( (a>b) && (a++ > b) ){


       System.out.println("This statement not evaluated");


      }


      System.out.println("a is not incremented " + a);


      if( (a<b) && (a++ < b) ){


       System.out.println("This statement is evaluated");


      }


      System.out.println("a is not incremented " + a);


    }


    }


    Output


    a is not incremented 10


    This statement is evaluated


    a is not incremented 11


    Observation


    In the expression (a>b) && (a++ > b), a>b is false, so && operator won''t evaluates
    second statement in the expression, so a is not incremented.


    Logical OR Operator


    | Operand1 | Operand2 | Evaluates To |


    | TRUE | TRUE | TRUE |


    | TRUE | FALSE | TRUE |


    | FALSE | TRUE | TRUE |


    | FALSE | FALSE | FALSE |


    As shown in the above table, || operator returns true if any of the operand evaluates
    to true, otherwise returns false.


    Example


    class OrEx{


    public static void main(String args[]){


      boolean operand1 = true;


      boolean operand2 = true;


      System.out.println((operand1 || operand2));


      operand1 = true;


      operand2 = false;


      System.out.println((operand1 || operand2));


      operand1 = false;


      operand2 = true;


      System.out.println((operand1 || operand2));


      operand1 = false;


      operand2 = false;


      System.out.println((operand1 || operand2));


    }


    }


    Output


    true


    true


    true


    false


    Why Logical OR is called short circuit operator


    Since if the first statement evaluates to true, then java won''t evaluates the
    entire expression. So Logial OR is called short circuit OR


    Example


    class ShortCircuitOr{


    public static void main(String args[]){


      int a = 10, b=21;


      if( (a<b) || (a++ < b) ){


       System.out.println("This statement evaluated");


      }


      System.out.println("a is not incremented " + a);


      if( (a>b) || (a++ > b) ){


       System.out.println("This statement is evaluated");


      }


      System.out.println("a is incremented " + a);


    }


    }


    Output


    This statement evaluated


    a is not incremented 10


    a is incremented 11


    Logical (!)NOT operator


    | Operand | Evalutes To |


    | FALSE | TRUE |


    | TRUE | FALSE |


    If the operand is FALSE, ! Operator evaluates it to TRUE


    If the operand is TRUE, ! Operator evaluates it to FALSE


    Example


    class LogicalNot{


    public static void main(String args[]){


      boolean a = true;


      System.out.println((!a));


      a = false;


      System.out.println((!a));


    }


    }


    Output


    false


    true


    # Bit Wise Operators


    The Java programming language provides operators that perform bit wise and bit
    shift operations on integral types.


    | Operator | Description |


    | ~ | Inverts a bit pattern |


    | << | Perform Left shift |


    | >> | Perform Right Shift |


    | >>> | Perform unsigned right shift |


    | & | Bit wise AND |


    | &#124; | Bit wise OR |


    | ^ | Bit wise Exclusive OR |


    Before discuss about the Bit wise operators, will discuss about Binary representations
    of a number


    1''s Complement


    1''s complement simply inverts the bits, if the bit is set to zero, it sets the
    bit to 1 and if the bit is set to 1 it sets the bit to zero.


    Ex:


    8 in binary            = 0 0 0 0 1 0 0 0


    1''s complement(8) = 1 1 1 1 0 1 1 1


    2''s complement


    Negative numbers are stored in 2''s complement form. i.e., -8 is 2''s complement
    of 8.


    2''s complement is sum of (1''s complement of a number + 1)


    Ex:


    8 in binary            = 0 0 0 0 1 0 0 0


    1''s complement(8) = 1 1 1 1 0 1 1 1


    2''s complement(8) =               (+) 1


                                                 -----------------


                                                 1 1 1 1 1 0 0 0


                                                  ----------------


    there for -8 in 2''s complement form is 11111000


    Inversion (~)


    Inversion operator change the bit value to zero, if it is one and change the bit
    value to one if it is zero.


    Example


    byte a = 7;


    a in binary format is       0 0 0 0 0 1 1 1


    ~(a) in binary format is  1 1 1 1 1 0 0 0


    ~(a) represents -8 in binary format.


    Example


    class BitWiseEx{


    public static void main(String args[]){


      byte byteVar = 7;


      System.out.println("Value of Byte variable is " + byteVar);


      System.out.println("Value of Byte variable after inversion is " + ~(byteVar));


    }


    }


    Output


    Value of Byte variable is 7


    Value of Byte variable after inversion is -8


    Bit Wise Left Shift(<<)


    Left shift operator simply shifts all the bits to one bit left, i.e, it simply
    doubles the value.


    Syntax:


        variable << n


        left shift the variable by ''n'' number of times.


        Variable << n is equals to variable = variable * 2 power n


            int var = 2;


            var << 1 = 2 * 2 power 1 = 4


            var << 2 = 2 * 2 power 2 = 8


            var << 9 = 2 * 2 power 9 = 1024


    Example


    class BitWiseEx{


    public static void main(String args[]){


      byte byteVar = 7;


      System.out.println("Value of Byte variable is " + byteVar);


      System.out.println("After shifting 1 bit left " + (byteVar<<1));


      System.out.println("After shifting 2 bits left " + (byteVar<<2));


      System.out.println("After shifting 3 bits left " + (byteVar<<3));


      System.out.println("After shifting 4 bits left " + (byteVar<<4));


      System.out.println("After shifting 5 bits left " + (byteVar<<5));


      System.out.println("After shifting 6 bits left " + (byteVar<<6));


      System.out.println("Value of Byte variable is " + byteVar);


    }


    }


    Output


    Value of Byte variable is 7


    After shifting 1 bit left 14


    After shifting 2 bits left 28


    After shifting 3 bits left 56


    After shifting 4 bits left 112


    After shifting 5 bits left 224


    After shifting 6 bits left 448


    Value of Byte variable is 7


    Bit Wise Right Shift(>>)'
