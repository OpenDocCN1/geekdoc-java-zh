  trans: "\n\n## 4. 如果你尝试将一种类型的数据赋值给另一个不兼容的类型，编译器将抛出错误。\n\n示例\n\n```java\nclass Compatible{\n\
    \  public static void main(String args[]){\n  int intVar = 10;\n  boolean a =\
    \ intVar;\n  }\n}\n```\n\n编译时，你将得到下面的错误：\n\n```\nCompatible.java:6: error: incompatible\
    \ types\n  boolean a = floatVar;\n^\nrequired: boolean\nfound: float\n1 error\n\
    ```\n\n## 5. 如果你想将高数据类型的值赋值给兼容的低数据类型，那么你应该对其进行外部强制类型转换，否则编译器将抛出提示为“可能会丢失精度”的错误。\n\
    \n语法：\n`dataType value1 = (dataType) value2;`\n\n```java\nclass Compatible{\n\
    \  public static void main(String args[]){\n  double doubleVar = 109.05;\n  char\
    \ ch = doubleVar;\n  System.out.println(doubleVar);\n  System.out.println(ch);\n\
    \  }\n}\n```\n\n编译时，你将得到下面的错误。\n```\nCompatible.java:5: error: possible loss of\
    \ precision\nchar ch = doubleVar;\n^\nrequired: char\nfound: double\n1 error\n\
    ```\n\n为了解决上述错误，我们需要像下面一样显式转换：\n\n```java\nclass Compatible{\n  public static\
    \ void main(String args[]){\n  double doubleVar = 109.05;\n  char ch = (char)doubleVar;\n\
    \  System.out.println(doubleVar);\n  System.out.println(ch);\n  }\n}\n```\n\n\
    ## 6. 始终通过在 float 变量后面添加“f”来给其赋值，如下所示：\n\n`float floatVar = 10.09f` \n否则编译器将抛出错误。\n\
    \n```java\nclass Compatible{\n  public static void main(String args[]){\n  float\
    \ floatVar = 10.09;\n  System.out.println(floatVar);\n  }\n}\n```\n\n编译时，你将得到下面的错误：\n\
    ```\nCompatible.java:3: error: possible loss of precision\nfloat floatVar = 10.09;\n\
    ^\nrequired: float\nfound: double\n1 error\n```\n\n要解决上述错误，请如下定义 float 变量：\n`float\
    \ floatVar = 10.09f;`\n\n# Java 中的运算符\n\n运算符是执行操作的符号。\n\n如果运算符对单个操作数执行操作，则称为 `一元运算符`\
    \ (unary)。\n例如：\n```java\nint a = 10;\na++;\n```\n\n如果运算符对两个操作数执行操作，则称为 `二元运算符`\
    \ (binary)。\n例如：\n```java\nint a=10, b=20;\nint c = a-b;\n```\n\n如果运算符对三个操作数执行操作，则称为\
    \ `三元运算符` (ternary)。\n例如：\n```java\nint a = 10, b=20, c;\nc= (a>b) ? a : b;\n\
    ```\n\nJava 中的运算符分为四大大类：\n- 算术运算符\n- 条件运算符\n- 逻辑运算符\n- 位运算符\n- 其他运算符（如赋值、逗号等）\n\
    \n# 算术运算符\n\n| 运算符 | 执行的操作 |\n| :--- | :--- |\n| `+` | 加法（也用于字符串拼接） |\n| `-` |\
    \ 减法 |\n| `/` | 除法 |\n| `*` | 乘法 |\n| `%` | 取余数 |\n| `++` | 前置或后自增 |\n| `--` |\
    \ 前置或后自减 |\n\n```java\nclass ArithmeticOperation{\n  public static void main(String\
    \ args[]){\n  int operand1 = 30;\n  int operand2 = 10;\n  System.out.println(\"\
    Addition of operand1 and operand2 is \" + (operand1 + operand2));\n  System.out.println(\"\
    Subtraction of operand1 and operand2 is \" + (operand1 - operand2));\n  System.out.println(\"\
    Multiplication of operand1 and operand2 is \" + (operand1 * operand2));\n  System.out.println(\"\
    Division of operand1 and operand2 is \" + (operand1 / operand2));\n  System.out.println(\"\
    Remainder of operand1 and operand2 is \" + (operand1 % operand2));\n  }\n}\n```\n\
    \n输出\n```\nAddition of operand1 and operand2 is 40\nSubtraction of operand1 and\
    \ operand2 is 20\nMultiplication of operand1 and operand2 is 300\nDivision of\
    \ operand1 and operand2 is 3\nRemainder of operand1 and operand2 is 0\n```\n\n\
    ### 需要注意的点\n\n1. 乘法、除法和取余运算符的优先级高于加法和减法运算符。\n\n示例\n```java\nclass ArithmeticPriority{\n\
    \  public static void main(String args[]){\n  int var1 = 10, var2 = 20;\n  int\
    \ result = var1+var2*var1;\n  System.out.println(result);\n  result = var1-var2/var1;\n\
    \  System.out.println(result);\n  result = var1+var2%var1;\n  System.out.println(result);\n\
    \  }\n}\n```\n\n输出\n```\n210\n8\n10\n```\n\n### 解析\n对于表达式 `result = var1+var2*var1`：\n\
    - `10 + 20*10`\n- `10 + 200`\n- `210`\n\n对于表达式 `result = var1-var2/var1`：\n- `10\
    \ - 20/10`\n- `10 - 2`\n- `8`\n\n对于表达式 `result = var1+var2%var1`：\n- `10 + 20%10`\n\
    - `10 + 0`\n- `10`\n\n2. 取余运算符总是返回分子。\n例如：\n`5 % 2 = 1`\n\n```java\nclass RemainderEx{\n\
    \  public static void main(String args[]){\n  int var1 = 25, var2 = 10;\n  System.out.println(var1%var2);\n\
    \  var1= 25;\n  System.out.println(var1%var2);\n  }\n```\n\n#算术运算符：++, --\n\n\
    `++` 自增运算符将值加 1\n`--` 自减运算符将值减 1\n\n### 前置自增\n语法：`++variable`\n前置自增立即将变量值加 1。\n\
    示例：\n```java\nclass PreIncrement{\n  public static void main(String args[]){\n\
    \  int var = 10;\n  System.out.println(++var);\n  }\n}\n```\n输出：`11`\n\n### 后置自增\n\
    语法：`variable++`\n后置自增在执行当前语句后将变量值加 1。\n示例：\n```java\nclass PostIncrement{\n  public\
    \ static void main(String args[]){\n  int var = 10;\n  System.out.println(var++);\n\
    \  System.out.println(var);\n  }\n}\n```\n输出：\n```\n10\n11\n```\n\n### 前置自减\n\
    语法：`--variable`\n前置自减立即将变量值减 1。\n示例：\n```java\nclass PreDecrement{\n  public static\
    \ void main(String args[]){\n  int var = 10;\n  System.out.println(--var);\n \
    \ }\n}\n```\n输出：`9`\n\n### 后置自减\n语法：`variable--`\n后置自减在执行当前语句后将变量值减 1。\n示例：\n\
    ```java\nclass PostDecrement{\n  public static void main(String args[]){\n  int\
    \ var = 10;\n  System.out.println(var--);\n  System.out.println(var);\n  }\n}\n\
    ```\n输出：\n```\n10\n9\n```\n\n### 更多示例\n```java\nclass ArithmeticEx{\n  public\
    \ static void main(String args[]){\n  int var = 10;\n  int result = var++ + var++;\n\
    \  System.out.println(\"value of variable is \" + var);\n  System.out.println(\"\
    Result is \" + result);\n  result = var++ + ++var;\n  System.out.println(\"value\
    \ of variable is \" + var);\n  System.out.println(\"Result is \" +result);\n \
    \ result = var++ + var--;\n  System.out.println(\"value of variable is \" + var);\n\
    \  System.out.println(\"Result is \" + result);\n  result = --var + var--;\n \
    \ System.out.println(\"value of variable is \" + var);\n  System.out.println(\"\
    Result is \" + result);\n  }\n}\n```\n输出\n```\nvalue of variable is 12\nResult\
    \ is 21\nvalue of variable is 14\nResult is 26\nvalue of variable is 14\nResult\
    \ is 29\nvalue of variable is 12\nResult is 26\n```\n\n# 条件运算符\n\n条件运算符判断一个操作数是否大于、小于、等于或不等于另一个操作数。\n\
    \n| 运算符 |  |\n| :--- | :--- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `>` | 大于 |\n|\
    \ `>=` | 大于 |\n| `<` | 小于 |\n| `<=` 小于 |\n\n条件运算符接收两个操作数，如果条件为真则返回 `true`，否则返回\
    \ `false`。\n\n示例\n```java\nclass ConditionalEx{\n  public static void main(String\
    \ args[]){\n  int a = 10, b=11;\n  System.out.println(\"is a equals to a \" +\
    \ (a==a));\n  System.out.println(\"is a equals to b \" + (a==b));\n  System.out.println(\"\
    is a not equals to a \" + (a!=a));\n  System.out.println(\"is a not equals to\
    \ b \" + (a!=b));\n  System.out.println(\"is a less than a \" + (a<a));\n  System.out.println(\"\
    is a less than b \" + (a<b));\n  System.out.println(\"is a less than or equal\
    \ to a \" + (a<=a));\n  System.out.println(\"is a less than or equal b \" + (a<=b));\n\
    \  System.out.println(\"is a greater than a \" + (a>a));\n  System.out.println(\"\
    is a greater than b \" + (a>b));\n  System.out.println(\"is a greater than or\
    \ equal to a \" + (a>=a));\n  System.out.println(\"is a greater than or equal\
    \ to b \" + (a>=b));\n  }\n}\n```\n\n输出\n```\nis a equals to a true\nis a equals\
    \ to b false\nis a not equals to a true\nis a not equals to b true\nis a less\
    \ than a false\nis a less than b true\nis a less than or equal to a false\nis\
    \ a less than or equal b true\nis a greater than a false\nis a greater than b\
    \ false\nis a greater than or equal to a true\nis a greater than or equal to b\
    \ false\n```\n"
