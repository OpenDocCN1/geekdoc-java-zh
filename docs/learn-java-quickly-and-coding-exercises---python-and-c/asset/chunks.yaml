    \ J J TAM 编写\n\n## 目录\n- 学习 Java\n- Java 简介\n- 在 Java 中运行简单的 Hello World 程序\n\
    - Java 中的数据类型\n- 更多关于基本类型\n- Java 中的运算符\n- 算术运算符\n- 算术运算符：++, --\n- 条件运算符\n- 逻辑运算符\n\
    - 位运算符\n- Java 中的其他运算符\n- 控制流语句：决策：if-then, if-else, if-else if-else\n- 控制流语句：决策：switch\n\
    - 控制流语句：循环：while, do-while\n- 控制流语句：循环：for\n- 分支语句：break\n- PYTHON 编程练习\n- 获取\
    \ Python 版本\n- 显示当前日期和时间\n- 打印日历\n- 计算三角形面积 和 java 启动器 (`java`) 将出现在\n`C:\\Program\
    \ Files\\Java\\jdk1.7.0_13\\bin`\n\n我们需要将 `C:\\Program Files\\Java\\jdk1.7.0_13\\\
    bin` 添加到系统路径，然后我们可以从任何地方运行 java 程序。按照以下步骤操作：\n\n步骤 1：右键点击计算机图标，打开属性窗口。\n![`2.bp.blogspot.com/-2eDkOF8rUJY/UvBxH2Fb7FI/AAAAAAAAAHI/gDMzQZsX0g/s1600/1.png`](img/image00155)\n\
    \n步骤 2：点击所示的高级设置选项卡。这将打开系统属性窗口。\n![`1.bp.blogspot.com/-V36tJIqKE/UvSiRcKLI/AAAAAAAAAJs/ylgetPwy3k/s1600/set.png`](img/image0156)\n\
    \n步骤 3：打开系统属性并选择“高级”。点击“环境变量”按钮。\n![`3.bp.blogspot.com/-mZPcjy2Kg/Uv0fRTRbAI/AAAAAAAAAIQ/tp0X-qpo4Y/s1600/3.bmp`](img/image00157)\n\
    \n步骤 4：你将得到下面的窗口。它包含两个部分：用户变量和系统变量。\n![`1.bp.blogspot.com/-gVC3iM6ik/Uv0nqSLNNI/AAAAAAAAAIY/qVt-qN-sFE/s1600/4.bmp`](img/image0158)\n\
    \n从系统变量部分编辑路径\n将 java bin 路径添加到系统变量 `path` 的值字段。\n在添加之前，像这样添加分号：\n`;C:\\Program\
    \ Files\\Java\\jdk1.7.0_13\\bin`\n\n![`1.bp.blogspot.com/-irgAHkSs7cM/Uv0vO8_gWI/AAAAAAAAAIg/yzZ7diKRlc/s1600/5.bmp/image0159)###\
    \ 如何检查路径是否设置正确点击确定。打开命令提示符并输入 `javac`。![https://4.bp.blogspot.com/-qAVfAmcL8dc/Uv1dv8NydI/AAAAAAAAAIs/4Y5LAk3g_0U/s1600/6.bmp`](img/image0160)\n\
    \n### 关于和\n假设你将 java 安装在以下目录：\n`C:\\Program Files\\Java`\n\n那么 java 编译器 (`javac`)\
    \ 和 java 启动器 (`java`) 将出现在\n`C:\\Program Files\\Java\\jdk1.7.0_13\\bin`\n\n我们需要将\
