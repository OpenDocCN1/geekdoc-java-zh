- fmt: "\n```java\nSystem.out.println(\"Hello World\");\n}\n\n}\n```\n\nJava is `Object`\
    \ Orienteded language. So Everything you write must be enclosed in the class declaration.\n\
    \nBasic Syntax of class is:\n\n```java\nclass Class_Name{\n    //Statements\n\
    }\n```\n\nBy convention, a class `Name` always starts with Capital letter followed\
    \ by small letters like `Abc`, `Hello`, and each subsequent word in the class\
    \ declaration also starts with capital letter like `ThreadExample`.\n\n## 2. The\
    \ Main Method\n\n```java\nclass Hello{\n    public static void main(String args[]){\n\
    \        System.out.println(\"Hello World\");\n    }\n}\n```\n\nIn the Java programming\
    \ language, every application must contain a `main` method whose signature is:\n\
    `public static void main(String[] args)`\n\nDon't bother about the signature of\
    \ the `main` method, you will learn later. Now remember, Program execution always\
    \ starts from `main` method.\n\n## 3. `println` method\n\nit simply prints the\
    \ information whatever you given to it, to the terminal or console.\n\n# Data\
    \ Types in Java\n\nJava supports mainly two categories of Data Types:\n\n1. Primitive\
    \ Types\n2. Reference Types\n\n### 1. Primitive Types\n\nJava language supports\
    \ 8 primitive types of data. Those are:\n- `byte`, `short`, `int`, `long`\n- `float`,\
    \ `double`\n- `boolean`\n- `char`\n\n- `byte`, `short`, `int` and `long` used\
    \ to store integer values.\n- `float` and `double` used to store real values.\n\
    - `Boolean` used to store true or false values.\n- `char` is used to store single\
    \ character.\n\n#### How to define variable\n\nSyntax:\n`dataType variableName\
    \ = value;`\n\nExample:\n`int intVariable = 10;`\n\nHere:\n- `dataType` is `int`\n\
    - `variableName` is `intVariable`\n- `value` is `10`\n\nA variable is a named\
    \ memory location, which holds a value.\n\n#### Naming convention to define a\
    \ variable\n\n1. A variable name must start with a character or underscore.\n\
    2. Variable name can contain alpha numeric characters.\n3. `varibale` names shouldn't\
    \ be a reserverd or keyword of java.\n4. By convention a variable name starts\
    \ with small letter, abd each sub sequent word starts with capital letter.\nEx:\
    \ `noOfChar`, `mySalary` etc.,\n\n#### Java Keywords\n\nKeyword is a reserved\
    \ word, which has special meaning defined for it.\n\n| abstract | continue | for\
    \ | New | switch |\n\nNote: All keywords are in lower case only.\n\n```java\n\
    /* Simple Program to Print the variable values */\nclass DataTypes{\n    public\
    \ static void main(String args[]){\n        byte byteVariable = 10;\n        short\
    \ shortVariable = 20;\n        int intVariable = 30;\n        long longVariable\
    \ = 40;\n        float floatVariable = 10;\n        double doubleVariable = 20.123;\n\
    \        boolean booleanVariable = false;\n        char charVariable ='A';\n \
    \       System.out.println(\"******************************************\");\n\
    \        System.out.println(\"Value Of byte Variable is \" + byteVariable);\n\
    \        System.out.println(\"Value Of short Variable is \" + shortVariable);\n\
    \        System.out.println(\"Value Of int Variable is \" + intVariable);\n  \
    \      System.out.println(\"Value Of long Variable is \" + longVariable);\n  \
    \      System.out.println(\"Value Of float Variable is \" + floatVariable);\n\
    \        System.out.println(\"Value Of double Variable is \" + doubleVariable);\n\
    \        System.out.println(\"Value Of boolean Variable is \" + booleanVariable);\n\
    \        System.out.println(\"Value Of char Variable is \" + charVariable);\n\
    \        System.out.println(\"******************************************\");\n\
    \    }\n}\n```\n**Output:**\n```\n******************************************\n\
    Value Of byte Variable is 10\nValue Of short Variable is 20\nValue Of int Variable\
    \ is 30\nValue Of long Variable is 40\nValue Of float Variable is 10\nValue Of\
    \ double Variable is 20.123\nValue Of boolean Variable is false\nValue Of char\
    \ Variable is A\n******************************************\n```\n\n### Reference\
    \ Types\n\nIn java `Strings`, `Arrays` and `Objects` are considered to be reference\
    \ types. Will discuss more about these later.\n\n#### Some Points to Remember\n\
    \n1. Like many languages Java doesn't support unsigned numbers. There is no unsigned\
    \ specifier in Java.\n```java\nclass UnsignedEx{\nunsigned int a;\n}\n```\nWhen\
    \ you try to compile the above class, below error is thrown:\n```\nUnsignedEx.java:2:\
    \ error: <identifier> expected\nunsigned int a;\nUnsignedEx.java:2: error: <identifier>\
    \ expected\nunsigned int a;\n2 errors\n```\n\n2. In java all the `bytes`, `shorts`\
    \ are promoted to `int` before operations on them, So we need explicitly cast\
    \ them.\n```java\nclass ConversionEx{\n    public static void main(String args[]){\n\
    \        byte b1 = 1;\n        byte b2 = 2;\n        byte b = (b1 + b2);\n   \
    \     System.out.println(b);\n        short s1 = 1;\n        short s2 = 2;\n \
    \       short s = (s1 + s2);\n        System.out.println(s);\n    }\n}\n```\n\
    When you tries to compile the above program, compiler throws the below error:\n\
    ```\nConversionEx.java:6: error: possible loss of precision\nbyte b = (b1 + b2);\n\
    ^\nrequired: byte\nfound: int\nConversionEx.java:10: error: possible loss of precision\n\
    short s = (s1 + s2);\n^\nrequired: short\nfound: int\n2 errors\n```\nTo make the\
    \ program fine, we need to explicitly cast, after the operation:\n```java\nclass\
    \ ConversionEx{\n    public static void main(String args[]){\n        byte b1\
    \ = 1;\n        byte b2 = 2;\n        byte b = (byte)(b1 + b2);\n        System.out.println(b);\n\
    \        short s1 = 1;\n        short s2 = 2;\n        short s = (short)(s1 +\
    \ s2);\n        System.out.println(s);\n    }\n}\n```\n**Output:**\n```\n3\n3\n\
    ```\n\n3. In Java, if one of the operand is `double`, then other promoted as `double`,\
    \ and the final result will be `double`.\n```java\nclass ConversionEx{\n    public\
    \ static void main(String args[]){\n        float f1 = 1.1f;\n        double f2\
    \ = 1.2f;\n        float f = (f1 + f2);\n        System.out.println(f);\n    }\n\
    }\n```\nWhen you tries to compile the above program, compiler throws the below\
    \ error:\n```\nConversionEx.java:6: error: possible loss of precision\nfloat f\
    \ = (f1 + f2);\n^\nrequired: float\nfound: double\n1 error\n```\nTo make the program\
    \ run, cast the result to float:\n```java\nclass ConversionEx{\n    public static\
    \ void main(String args[]){\n        float f1 = 1.1f;\n        double f2 = 1.2f;\n\
    \        float f = (float)(f1 + f2);\n        System.out.println(f);\n    }\n\
    }\n```\n**Output:**\n```\n2.300002\n```\n\n# More About primitive types\n\n1.\
    \ sizes Of primitive data types\n\nData Type-in bytes:\n- `byte`: 1\n- `short`:\
    \ 2\n- `int`: 4\n- `long`: 8\n- `float`: 4\n- `double`: 8\n- `boolean`: The boolean\
    \ data type has only two possible values: `true` and `false`. This data type represents\
    \ one bit of information, but its \"size\" isn't precisely defined.\n\n2. If you\
    \ are using primitive data types as local variables, then you must initialize\
    \ the variable before using. Other wise compiler will throw error.\n```java\n\
    class PrimitiveDeclaration{\npublic static void main(String args[]){\n    int\
    \ var1;\n    System.out.println(var1);\n}\n}\n```\nWhen you tries to compile the\
    \ above program below error:\n```\nPrimitiveDeclaration.java:5: error: variable\
    \ var1 might not have been initialized\nSystem.out.println(var1);\n^\n1 error\n\
    ```\n\n3. Assigning data to compatibility types\n\nJava permits to assign a value\
    \ of one data type to the value of other if types are compatible. I.e, we can\
    \ assign a data of `float` to `double`, `byte` to `int`, `char` to `int` etc.,\n\
    \nWhen you assign a character variable to `int` variable, then `int` variables\
    \ store the `Uni code` of the variable.\n```java\nclass Compatible{\npublic static\
    \ void main(String args[]){\n    char charVar = 'a';\n    int intCharVar = charVar;\n\
    \    byte byteVar = 100;\n    short shortVar = byteVar;\n    int intVar = shortVar;\n\
    \    long longVar = intVar;\n    float floatVar = longVar;\n    double doubleVar\
    \ = floatVar;\n    System.out.println(charVar);\n    System.out.println(intCharVar);\n\
    \    System.out.println(byteVar);\n    System.out.println(shortVar);\n    System.out.println(intVar);\n\
    \    System.out.println(longVar);\n    System.out.println(floatVar);\n    System.out.println(doubleVar);\n\
    }\n\n}\n```\n**Output:**\n```\na\n97\n100\n100\n100\n100\n100.0\n100.0\n```\n"
