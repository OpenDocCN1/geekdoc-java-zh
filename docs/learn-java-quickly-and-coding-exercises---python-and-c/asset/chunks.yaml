    \n1. 变量名必须以字符或下划线开头。\n2. 变量名可以包含字母和数字。\n3. `variable` 名称不应该是 Java 的保留字或关键字。\n\
    4. 按照习惯，变量名以小字母开头，每个后续单词以大字母开头。\n   例如：`noOfChar`、`mySalary` 等。\n\n#### Java 关键字\n\
    \n关键字是一个保留字，具有为其定义的特殊含义。\n\n| abstract | continue | for | New | switch |\n\n注意：所有关键字均为小写。\n\
