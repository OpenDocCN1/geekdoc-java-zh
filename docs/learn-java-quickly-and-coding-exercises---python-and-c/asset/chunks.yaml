    \n- `byte`、`short`、`int` 和 `long` 用于存储整数。\n- `float` 和 `double` 用于存储实数值。\n- `boolean`\
    \ 用于存储真或假值。\n- `char` 用于存储单个字符。\n\n#### 如何定义变量\n\n语法：\n`dataType variableName\
