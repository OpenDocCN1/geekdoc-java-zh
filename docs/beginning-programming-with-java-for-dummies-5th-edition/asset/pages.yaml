  md: "```\nSystem.out.print(\". \");\nSystem.out.println(\"Enjoy the show!\");\n\n\
    keyboard.close();\n```\n\n# Nested if statements\n\nA run of the code in Listing\
    \ 10-5 looks identical to a run for Listing 10-4. You can see several runs in\
    \ Figure 10-6. The main idea in Listing 10-5 is to put an if statement inside\
    \ another if statement. After all, Chapter 9 says that an if statement can take\
    \ the following form:\n\n```\nif (Condition) {\n    SomeStatements\n} else {\n\
    \    OtherStatements\n}\n```\n\nWho says SomeStatements cannot contain an if statement?\
    \ For that matter, OtherStatements can also contain an if statement. And, yes,\
    \ you can create an if statement within an if statement within an if statement.\
    \ There's no predefined limit on the number of if statements you can have.\n\n\
    ```\nif (age >= 12 && age < 65) {\n    price = 9.25;\n    if (reply == 'Y' ||\
    \ reply == 'y') {\n        if (isSpecialFeature) {\n            price = 1.00;\n\
    \        } else {\n            price = 2.00;\n        }\n    }\n} else {\n   \
    \ price = 5.25;\n}\n```\n\nWhen you put one statement inside another, you create\
    \ nested statements. Nested statements aren't difficult to write, as long as you\
    \ take things slowly and keep a clear picture of the code's flow in your mind.\
    \ If it helps, draw yourself a diagram like the one shown in Figure 10-10."
