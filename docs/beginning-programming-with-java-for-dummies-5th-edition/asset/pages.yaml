  md: 'and payee. Each object has one method (a print method). You can see all of
    this in Figure 18-7.


    | number | amount | payee | print |

    |---|---|---|---||

    | 1705 | $25.09 | The Butcher | (method to cut the check) |

    | 1699 | $31.27 | The Baker | (method to cut the check) |

    | 1702 | $12.35 | The Candlestick Maker | (method to cut the check) |


    FIGURE 18-7: The Check class sort some check objects.


    You''d like to print the checks in numerical order. So you need a method to sort
    the checks. If the checks in Figure 18-7 were sorted, the check with number 1699
    would come first, and the check with number 1705 would come last.


    The big question is, should each check have its own sort method? Does the check
    with number 1699 need to sort itself? And the answer is no. Some methods shouldn''t
    belong to the objects in a class.


    Where do such methods belong? How can you have a sort method without creating
    a separate sort for each check?


    Here''s the answer: You make the sort method be static. Anything that is static
    belongs to a whole class, not to any particular instance of the class. If the
    sort method is static, the entire Check class has just one copy of the sort method.
    This copy stays with the entire Check class. No matter how many instances of the
    class you create — three, ten, or none — you have one sort method.


    For an illustration of this, refer to Figure 18-7. The whole class has one sort
    method. So the sort is static. No matter how you call the sort method, that method
    uses the same values to do its work.


    Of course, each individual check (each object, each row of the table in Figure
    18-7) still has its number, its own amount, its payee, and its own print method.
    When you print the first check, you get one amount, and when you print the second
    check, you get another. Because there''s a number, an amount, a payee, and a print
    method for each object, I call these things non-static. I call them non-static...well...
    because they''re not static.'
