  md: '# THOSE PESKY FILENAME EXTENSIONS


    The filenames displayed in Windows File Explorer or in a Finder can be misleading.
    You may browse one of your directories and see the name Mort.gage. The file''s
    real name might be Mort.gage.java, Mortgage.class, Mortgage.somethingElse, or
    in old Mort.gage. Filename ending like .zip, .java, and .class are called extensions.


    The ugly truth is that, by default, Windows and Macs hide many filename extensions.
    This awful feature tends to confuse programmers. So, if you don''t want to be
    confused, change your computer''s system-wide settings. Here''s how you do:


    +   **In Windows 10:** In the taskbar''s search box, type File Explorer Options.
    On the list of choices that appear, choose File Explorer Options. Then follow
    the instructions in In All Versions of window


    +   **In Windows 8:** On the Start screen, hold down the Windows key while pressing
    Q. In the searching box, type Folder Options and then press Enter. Then follow
    the instructions in In All Versions of window


    +   **In Windows 7:** Start -> Control Panel -> Appearance and Personalization
    -> Folder Options. Then follow the instructions in the In All Versions of window.


    +   **In all versions (7 and newer):** Follow the instructions in one of the preceding
    bullets. Then, in the Folder Options (or File Explorer) dialog box, click the
    View tab. Look for the Hide File Extensions for Known File Types option. Make
    sure that this box is selected.


    +   **In Mac OS X:** On the Finder''s application, select Preferences. In the
    resulting dialog box, select the Advanced tab and look for the Show All File Extensions
    option. Make sure that this box is selected.


    +   **In Linux:** Linux distributions tend not to hide file extensions. So, if
    you use Linux, you probably don''t have to worry about this. But I have checked
    all Linux distributions. So, if your files are named Mort.gage.java or Mortgage.class,
    check the documentation specific to your Linux distribution.


