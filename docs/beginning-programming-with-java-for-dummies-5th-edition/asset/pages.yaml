    Open Windows File Explorer or Macintosh Finder and poke around for a file with
    that name.


    The filenames displayed in File Explorer and Finder can be misleading. You may
    see the name rawData, even though the file''s real name is rawData.txt. To fix
    this problem once and for all, refer to the "Those pesky file extensions" sidebar
    in Chapter 2.


    +   Check the spelling of the file''s name.


    Make sure that the name in your program is exactly the same as the name of the
    file on your hard drive. One just misplaced letter can keep the computer from
    finding a file.


    +   If you use Linux (or flavor of UNIX other than Mac OS X), check the capitalization
    of the file''s name.


