    # Chapter 17

    Programming with Objects and Classes


    Chapters 6, 7, and 8 introduce Java''s primitive types — things like int, double,
    char, and boolean. That''s great, but how often does a real-world problem deal
    exclusively with such simple values? Consider an exchange between a merchant and
    a customer. The customer makes a purchase, which can involve item names, model
    numbers, credit card info, sales tax rates, and lots of other stuff. A purchase
    is more complicated than an int value. It''s more complicated than a double value.
    How do you represent an entire purchase in a Java program?


    In older computer languages, you treat an entire purchase like a big pile of unbound
    laundry. Imagine a mound of socks, shirts, and other pieces of clothing. You have
    no basket, so you grab as much as you can handle. As you walk to the washer, you
    drop a few things — a sock and a waistcoat there. is like the old way of storing
    values in a purchase. In older languages, there''s no purchase. There are only
    double values, and other loose items. You put the purchase amount in one variable,
    the customer''s name in another, and the sales tax data somewhere else. But that''s
    awful. You need to drop things on your way to the compiler. With small errors
    in a program, you can easily drop an amount here and a customer''s name there.


    CHAPTER 17 Programming with Objects and Classes 383'
