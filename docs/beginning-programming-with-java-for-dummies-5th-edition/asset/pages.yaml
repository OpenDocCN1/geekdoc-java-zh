  md: '# Using a Conditional Operator


    Java has a neat feat that I can''t resist writing about. Using this feature, you
    can think about alternatives in a natural way.


    And do I mean by "a natural way"? If I think loud as I imitate the statement near
    the end of Listing 11-3, I come up with this:


    ```

    //The thinking in Listing 11-3:

    What should I do next?

    If this is a leap year,

    I''ll make the numberOfDays be 29;

    Otherwise,

    I''ll make the numberOfDays be 28.

    ```


    I''m wandering into an if statement without a clue about what I''m doing next.
    That seems silly. It''s February, and everybody knows what you do in February.
    You ask how many days the month has.


    In my opinion, the code in Listing 11-3 doesn''t reflect the most natural way
    to think about February. Here''s a more natural way:


    ```

    //A natural way to think about the problem:

    The value of numberOfDays is...

    Wait! If this is a leap year?

    If yes, 29

    If no, 28

    ```


    In this second, more natural way of thinking, I know from the start that I''m
    picking a number of days. So by the time I reach a fork in the road (Is this a
    leap year?), the only remaining task is to choose between 29 and 28.


    I can make the choice with fininesse:


    ```

    case 2:

    System.out.print("Leap year (true/false)? ");

    isLeapYear = keyboard.nextBoolean();

    numberOfDays = isLeapYear ? 29 : 28;

    ```


    The ? combination is called a conditional operator. In Figure 11-6, I show you
    how my thinking about February can morph into the conditional operator''s format.'
