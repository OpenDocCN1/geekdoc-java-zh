    in Listing 10-2


    Listing 10-2 has two if statements whose involve characters:


    +   > In this first statement, the computer checks to see whether the reply variables
    stores the letter Y or the y. If either is, it subtract 2.00 from the price. (For
    information on operators like =, see Chapter 7).

    > The second statement has a hefty condition. The condition tests to see whether
    the reply variables any reasonable value at all. If the reply isn''Y, and isn''t
    Y, and isn''t N, and isn''t n, the computer expresses its concern by displaying,
    "Huh? (As a paying customer, the word How? on the automated ticket seller'' screen
    will certainly get your attention.)


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_244_1.png)


    When you create a multipart condition, you always have several ways to think about
    the condition. For example, you can rewrite the last condition in Listing 10-2
    as if ((reply == ''Y'' || reply == ''y'' || reply == ''n'')). "If it''s not the
    case that the reply is either Y, y, N, or n, then display ''Huh!'' So which way
    of writing the condition is better — the way I do in Listing 10-2 or the way you
    do in it? It depends on your taste. Whichever makes the logic easier for you to
    understand is the better way.


    # Using boolean variables


