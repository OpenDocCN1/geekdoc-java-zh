- img_proc: true
  md: 'To generate numbers in a truly random fashion, you need a big tub of ping-pong
    balls, like the kind they use in state lottery drawings. The problem is, most
    computers don''t come with tubs of ping-pong balls among their peripherals. Strictly
    speaking, the numbers generated by Java''s Random class aren''t random. Instead,
    scientists call these pseudorandom.


    +   - It surprises us all, but knowing one randomly generated value is of no help
    in predicting the next generated value.


    For example, if you toss a coin, and you get both heads, are you more likely to
    get tails on the third flip? It''s still 50-50.


    If you have three sons, and you''re expecting a fourth child, the fourth child
    is more likely to be a girl? No. A child''s gender has nothing to do with the
    genders of the older children. (I''m ignoring any biological effects, which I
    know absolutely nothing about. Wait! I know some biological trivia: A newborn
    is more likely to be a boy than a girl. For every 21 newborn boys, there are only
    20 newborn girls. Boys are weaker, so we die off faster. That''s why nature makes
    more of us at birth)


    # # Indenting if statements in your code


    Notice how, in Listing 9-2, the println calls inside the if statement are indented.
    Strictly speaking, you don''t have to indent the statements that are inside an
    statement. For all the compiler cares, you can write your whole program on a single
    line or place all your statements in an awful, missshape zigzag. The problem is,
    if you don''t indent your statements in some logical fashion, neither you nor
    else can make sense of your code. In Listing 9-2, indenting of the println helps
    your eyes (and brain) see quickly that these statements are subordinate to the
    overall ifelse flow.


    In a small program, unind or poorly indented code is barely tolerable. But in
    a complicated program, indentation that doesn''t follow a neat, logical pattern
    is a big, ugly nightmare.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_226_0.png)


    Always indent your code to make the program''s flow apparent at a glance.


    You don''t have to think about indenting your code, because Eclipse can indent
    your code automatically. For details, see Chapter 4.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_226_1.png)'
