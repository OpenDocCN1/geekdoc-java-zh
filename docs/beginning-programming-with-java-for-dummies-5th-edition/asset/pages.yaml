  md: 'If you change the dollar amounts in Listing 10-1, you can get into trouble.
    For example, with the statement price = 5.00, the program displays Please pay
    $5.00. Enjoy the show! This happens Java doesn''t store the two zeros to the right
    of the decimal point (and Java doesn''t know or care that 5.00 is a dollar amount).
    To fix this kind of thing, see the discussion of NumberFormat.getCurrencyInstance
    in Chapter 18.


    # When to initialize?


    Take a look at Listing 10-1 and notice the price variable''s initialization:


    ```

    double price = 0.00;

    ```


    This line declares the price variable and sets the variable''s starting value
    to 0.00. When I omit this initialization, I get an error message:


    ```

    The local variable price may not have been initialized

    ```


    What''s the deal here? I don''t initialize the age variable, but the compiler
    doesn''t complain about that. Why is the compiler fussing over the price variable?


    The answer is in the placement of the code''s assignment statements. Consider
    the following two facts:


    +   **The statement that assigns a value to the age variable (age = keyboard.nextInt())
    Isn''t inside an if statement.**


    That assignment statement always gets executed, and (as long as nothing extraordinary
    happens) the age is sure to be assigned a value.


    +   **Both statements that assign a value to the price variable (price = 9.25
    and price = 5.25) are inside if statements.**


    If you look at Figure 10-3, you will see that every age group is covered. No one
    shows up at the ticket counter with an age that forces conditions to be false.
    So, when you run the Ticket program, either the first or the second price assignment
    is executed.


    The problem is the compiler isnt smart enough to check all of this. The compiler
    just sees the structure in Figure 10-4 and becomes scared that the compiler won''t
    take either of the true detours.


    If (some unforeseen reason) both of the if statements'' conditions are false,
    then the price variable isn''t assigned a value. Without an initialization, price
    has no value. (More precisely, price has no value that''s intention-all to give
    it in the code.)'
