    ![](img/8e09247dec29cb1986bf1f8d64f5812d_374_0.png)


    In Listing 16-3, I want to know whether the occupancy file contains any more data
    (any data that I haven’t read yet). So I call the Scanner class’s hasNext method.
    The hasNext method looks also to see whether I can read any kind of data — an
    int value, a double, a word, a boolean, or whatever. That’s for this section’s
    example, but in some situations, you need to pick about your input data. For example,
    you may want to know whether you can call nextInt (as opposed to nextDouble or
    next). Frequently, Java has methods for your pickiest input needs. A method like
    (diskScanner.hasNext()) tests to see you can read an int value from the disk file.
    Java also has nextLine, hasDouble, and so on. For more information on the plain
    old hasNext method, see Chapter 14.


    Listing 16-3 has a big, fat condition to keep the for loop:


    ```

    for (int roomNum=0; roomNum < roomNum && diskScanner.hasNext(); roomNum++) {

    ```


    Many for loop conditions are simple “less-than” tests, for there’s no rule saying
    that all for loop conditions have to be so simple. In fact, an expression can
    be a for loop’s condition, as long as the expression has value true or false.
    The condition in Listing 16-3 combines a “less than” with a call to the Scanner
    class’s hasNext.


