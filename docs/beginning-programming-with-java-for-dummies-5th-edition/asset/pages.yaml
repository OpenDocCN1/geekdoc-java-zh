    # A QUICK LOOK AT JAVA''S DISK ACCESS FACILITIES


    Templates the ones in the Listings 13-3 and 13-4 look very nice. But knowing how
    the works is even better. Here are a few tidbits describing the inner workings
    of Java''s disk access code:


    +   * PrintStream is something you can use for writing output.


    A PrintStream is like a Scanner. The big difference is that Scanner is for reading
    input and a PrintStream is for writing output. To see what I mean, look at Listing
    13-2. Notice the similarity between the statements that use Scanner and the statements
    that use PrintStream.


    The word PrintStream is defined in the Java API.


    +   * In Listing 13-2, the expression new File("rawData.txt") plays the same role
    as System.in in many other programs.


    As System.in stands for the computer''s keyboard, the expression new File("rawData.txt")
    stands for a file on your computer''s hard drive. When the computer calls new
    File("rawData.txt"), the computer creates something like System.in — something
    you can stuff inside the new Scanner () parentheses.


    The word File is defined in the Java API.


    +   * FileNotFoundException is something that may go wrong during an attempt to
    read input from a disk file (or an attempt to write to a disk file).


    Disk access is loaded with pitfalls. Even the best programs run into disk access
    trouble occasionally. To brace against such pitfalls, Java insists on your adding
    some extra words to your code.


    294 PART 3 Controlling the Flow'
