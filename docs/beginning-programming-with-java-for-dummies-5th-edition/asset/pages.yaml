    # The cases in a switch statement


    Figure 11-1 shows three runs of the program in Listing 11-1. Here’s what happens
    during one of these runs:


    +   >> The user types a heavy question, and the variable randomNumber gets a value.
    In the second run of Figure 11-1, this value is 2.


    +   >> Execution of the code in Listing 11-1 reaches the top of the switch statement,
    so the computer starts checking this statement’s case clauses. The value 2 doesn''t
    match the topmost case clause (the case 1 clause), so the computer moves to the
    next case clause.


    +   >> The value in the next case clause (the number 2) matches the value of the
    randomNumber variable, so the computer executes the statements in this case clause.
    These two statements are


    ```

    out.println("No, and don’t ask again.");

    break;

    ```


    The first of the two statements displays No, and don’t ask again on the screen.
    The second statement is called a break statement (What a surprise!). When the
    computer encounters a break statement, the computer jumps out of whatever switch
    it is. So, in Listing 11-1, the computer skips right past case 3, case 4, and
    so on. The computer jumps to the statement just after the end of the switch statement.


    +   >> The computer displays Goodbye because that’s what the statement after the
    switch statement tells the computer to do.'
