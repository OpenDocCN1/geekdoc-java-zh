    5, 6, 7, 8, 9 ... are all greater than 4. Among these numbers, only 5, 6, and
    7 are less than 8. So only the numbers, 5, and 6 satisfy this combined condition.


    +   age < 4 || age < 8


    The value of the age variable is less than 4 or is greater than 8. To create the
    condition, you use two pipe symbols. On many U.S. English keyboards, you can find
    the pipe symbol immediately after the Enter key (the same key as the backslash,
    but shifted).


    In this combined condition, the value of the age variable is either less than
    4 or greater than 8. For example, if a number is less than 4, the number satisfies
    the condition. Numbers 1, 2, and 3 are all less than 4, so these numbers satisfy
    the combined condition.


    Also, if a number is greater than 8, the number satisfies the combined condition.
    Numbers like 9, 10, and 11 are all greater than 8, so these numbers satisfy the
    condition.


    +   !eachGetTen


    If I weren''t experienced with programming languages, I''d be confused by the
    exclamation point. I''d think that !eachGetTen means, "Yes, each does get ten."
    That''s not what this means. This expression says, "The variable eachGetTen does
    not have the value true." In Java and other programming languages, an exclamation
    point stands for negative, no way, or for now.


    Listing 8-4 (refer to Chapter 8) has a boolean variable named eachGetTen. A boolean
    variable''s value is either true or false. Because means not, the expressions
    eachGetTen and !eachGetTen have opposite values. When eachGetTen is true, !eachGetTen
    is false (and vice versa).


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_238_0.png)


    Java''s || is inclusive. This means that you get true whenever the left side is
    true, the thing on the right side is true, or both things are true. For example,
    the condition 2 < 10 || 20 < 30 is true.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_238_1.png)


    In Java, you can''t combine comparisons the way you do in ordinary English. In
    English, you might say, "We''ll have between three and ten people at the dinner
    table." But in Java, you get an error message if you write 3 <= people <= 10.
    To do this comparison, you need something like 3 <= people && people <= 10.


