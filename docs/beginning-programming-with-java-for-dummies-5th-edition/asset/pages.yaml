- img_proc: true
  md: "Mom and Dad thought the whole Fletcher business was silly, but they respected\
    \ Aunt Edna and felt that people her age should be humored, not defied. As for\
    \ me, I thought I'd explode from the monotony. Each meal lasted forever. Each\
    \ mouthful was an ordinal. I can still remember my mantra — the words I'd say\
    \ to myself without needing to do:\n\n```\nI've chewed 0 times so far.\nHave I\
    \ chewed 100 times yet? If not, then\nChew!\nAdd 1 to the number of times that\
    \ I've chewed.\nGo back to \"Have I chewed\" to find out if I'm done yet.\n```\n\
    \n# Repeating Statements a Certain Number of Times (Java for Statements)\n\nLife\
    \ is filled with examples of counting loops. And computer programming mirrors\
    \ life (... or is it the other around?). When you tell a computer to do what,\
    \ you're often telling the computer to print three lines, process ten counts,\
    \ dial a million numbers, or whatever. Because counting loops are common in programming,\
    \ the people who create programming languages have developed statements just for\
    \ loops of this kind. In Java, the statement that repeats a certain number of\
    \ times is called a for statement. An example of this is in Listing 15-1.\n\n\
    > LISTING 15-1: Horace Fletcher's Revenge\n\n```\nimport static java.lang.System.out;\n\
    \nclass AuntEdnaSettlesForTen {\n\n  public static void main(String args[]) {\n\
    \n    for (int count = 0; count < 10; count++) {\n      out.println(\"I've chewed\
    \ \" + count);\n      out.println(count);\n      out.println(\" \" + time(s)\"\
    );\n    }\n\n    out.println(\"10 times! Hooray!\");\n    out.println(\"I can\
    \ swallow!\");\n  }\n}\n```\n```"
