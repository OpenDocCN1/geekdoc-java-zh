  md: '# AUTOMATED DEBUGGING


    If your program isn''t working correctly, you can try something called a debugger.
    A debugger automatically adds invisible print and println calls to your suspicious
    code. In fact, debuggers have all kinds of features to help you diagnose problems.
    For example, a debugger can pause a run of your program and accept special commands
    to display variables. With some debuggers, you can pause and change a variable''s
    value (just to see what goes better when you do).


    An Eclipse perspective is a collection of views intended to help you with a certain
    aspect of program development. By default, Eclipse starts in the Java perspective
    — the arrangement of views to help you create Java programs. Another perspective
    — the Debug perspective — helps diagnose errors in code.


    In this book, I don''t promote the use of an automated debugger. But for any large
    programming project, automated debugging is an essential tool. If you want to
    write bigger and better programs, please give Eclipse''s Debug perspective a try.
    For a small sample of the Debug perspective''s capabilities, the following:


    +   1. In the editor (where you see your Java code), double-click in the margin
    to the left of a line of code.


    A little dot appears in the margin. (See the first sidebar figure.) This indicates
    a breakpoint in the code. In the steps that follow, you will make the run of the
    program pause at this breakpoint. I click the last line of code from Listing 8-5.


    ```

    System.out.print("Room temperature?");

    System.out.println(fahrenheit == 69.8);

    ```


    +   2. On Eclipse''s main menu, click Window ⧞ Open Perspective ⧞ Debug.


    As a result, Eclipse displays a new layout. The new layout contains some familiar
    views, such as the Console view and the Outline view. The layout also contains
    some new views, such as the Debug view, the Variables view, and the Breakpoints
    view. (See the next sidebar figure.)'
