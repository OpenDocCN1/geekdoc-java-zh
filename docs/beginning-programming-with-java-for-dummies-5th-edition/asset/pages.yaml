- img_proc: true
  md: 'And why are these words important? They''re important because, object-oriented
    programming, chunks of data take responsibility for themselves. With object-oriented
    programming, everything you know about a string is located in the file String.java.
    So, if people have problems with the string, they know just where to look for
    all the code. That''s great!


    This is the deal: Objects contain methods. Chapter 18 shows you how to use an
    object''s methods, and this chapter shows you how to create an object''s methods.


    # # Making a method


    Imagine a table containing the information about accounts. (If you have trouble
    imagining a thing, just look at Figure 19-1.) In the figure, account has a last
    name, an identification number, and a balance. In addition (and here''s the important
    part), account knows how to display itself on the screen. Each row of table has
    its own copy of a display method.


    | Account | id | balance |

    |---|---|---||

    | Aju | 9936 | $8,734.00 (method to display account info) |

    | Iap | 3492 | $6,718.00 (method to display account info) |

    | Ngp | 2151 | $1,008.00 (method to display account info) |


    Figure 19-1: A table of accounts.


    The last names in Figure 19-1 may seem strange to you. That''s because I generated
    the haphazard combination of three letters: one uppercase letter followed by two
    lowercase letters.


    Though it may strange, generating accounts at random is common practice. When
    you write new code, you want to test the code to find out whether it runs correctly.
    You can make up data (with values like "Smith", 0000, and 1000). But to give a
    challenging workout, you should use unexpected values. If you have values from
    real-life case studies, you should use them. But if you don''t have real data,
    randomly generated values are easy to create.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_447_0.png)


    To find out how I randomly generate three-letter names, see this chapter''s "Gen-ernerating
    words randomly" sidebar.


    I need some code to implement the ideas in Figure 19-1. Fortunately, I have some
    code in Listing 19-1.'
