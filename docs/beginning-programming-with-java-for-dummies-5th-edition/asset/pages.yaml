    \ 2 1 4 1 9 8 2 7 7 2 5 1 |\n| 1 2 3 10 0 2 9 7 7 7 6 2 3 9 4 6 10 2 |\n\nThe\
    \ Java Virtual Machine jumps through hoops to maintain these trends. That's why\
    \ cranking out in a random fashion is a tricky business. Here are some interest-facts\
    \ about the process:\n\n+   - Scientists and nonscientists use the term random.\
    \ But in reality, there's no such thing as a single random number. After all,\
    \ how is random a number like 9?\n A number is random only when it's in a disorderly\
    \ collection of numbers. More precisely, a number is random if the process used\
    \ to generate the number follows the two preceding trends. When they're careful,\
    \ scientists avoid the trick random number and use the term randomly generated\
    \ number instead.\n- It's hard to generate numbers randomly. Computer programs\
    \ do the best they can, but ultimately, today's computer programs follow a pattern,\
    \ and that pattern isn't truly random."
