  md: '# Understanding (or ignoring)

    the subtleties


    Sometimes, when you refer to a particular object, you want to emphasize which

    class the object came from. Well, subtle differences in emphasis call for big
    differ-

    ences in terminology. So here''s how Java programmers use the terminology:


    +   In Listing 17-3, the statement Purchase onePurchase = new Purchase()

    creates a new object.


    +   In Listing 17-3, the statement Purchase onePurchase = new Purchase()

    creates a new instance of the Purchase class.


    The words object and instance are almost synonymous, but Java programmers

    never say "object of the Purchase class" (or if they do, they feel funny).


    By the way, if you miss this terminology and say "object of the

    Purchase class," no one jumps down your throat. Everyone understands what you

    mean, and life goes on as usual. In fact, I often use a phrase like "Purchase
    object"

    to describe an instance of the Purchase class. The difference between object and

    instance isn''t terribly important. But it''s important to remember that the words

    object and instance have the same meaning. (Okay! They have nearly the same\meaning.)


    # Making reference to an object''s parts


    In the Purchase code of Listing 17-2, I declare three variables: a unitPrice

    variable, a quantity variable, and a taxable variable. In real-life, you might
    say

    each purchase has three parts: the unitPrice of an item being purchased, the

    quantity of items purchased, and the fact that the purchase is isn taxable.


    When you create a Java class, each of these variables is called a field. The Purchase

    class has three fields — namely, the unitPrice field, the quantity field, and
    the

    tax field.


    After you''ve created an object, you use dots to refer to the object''s fields.
    For

    example, in Listing 17-3, I put a value into the onePurchase object''s unitPrice

    field with the following:


    ```

    onePurchase.unitPrice = keyboard.nextDouble();

