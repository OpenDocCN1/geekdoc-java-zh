  md: "# Combining conditions: An example\n\nHere’s a handy example of the use of\
    \ logical operators. A movie theater posts its prices for admission:\n\n+   -\
    \ Regular price: $9.25\n- Kids under 12: $5.25\n- Seniors (65 and older): $5.25\n\
    \nBecause the kids’ and seniors’ prices are the same, you can combine these prices\
    \ into one category. (That’s not always the best programming strategy, but do\
    \ it anyway for this example.) To find a particular moviegoer’s ticket price,\
    \ you need one or more if statements. You can structure the conditions in many\
    \ ways, and I chose one of these ways for the code in Listing 10–1.\n\n# LISTING\
    \ 10-1: Are You Paying Too Much?\n\n```\nimport java.util.Scanner;\n\nclass TicketPrice\
    \ {\n\n    public static void main(String args[]) (\n        Scanner keyboard\
    \ = new Scanner(System.in);\n        int age;\n        double price = 0.00;\n\n\
    \        System.out.print(\"How old are you?\");\n        age = keyboard.nextInt();\n\
    \n        if (age >= 12 && age < 65) {\n            price = 9.25;\n        }\n\
    \        if (age < 12 || age >= 65) {\n            price = 5.25;\n        }\n\n\
    \        System.out.print(\"Please pay $\");\n        System.out.print(price);\n\
    \        System.out.print(\" \");\n        System.out.println(\"Enjoy the show!\"\
    );\n\n        keyboard.close();\n\n}\n```"
