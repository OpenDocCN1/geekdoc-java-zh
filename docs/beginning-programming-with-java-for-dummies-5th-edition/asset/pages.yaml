  md: '# Chapter 22

    Ten Useful Classes in the Java API


    > I''m proud of myself. I''ve written around 400 pages about Java using fewer
    than 30 classes from the Java API. The standard API has thousands of classes,
    so I think I''m doing very well.


    Anyway, to acquaint you with some of my favorite Java API classes, this chapter
    contains a brief list. Some of the classes in this list appear in examples throughout
    this book. Others are so darn useful that I can''t finish the book with-including
    them.


    For more information on the classes in this chapter, check Java''s online API
    documentation at http://docs.oracle.com/java/8/docs/api.


    # ArrayList


    Chapter 16 introduces arrays. This is good stuff, but in any programming language,
    arrays have their limitations. For example, an array of size 100. If you suddenly
    need to store a 101st value, you''re plain out of luck. You can''t change an array''s
    size without rewriting some code. Inserting a value into an array is another'
  merge: -1
  pgno: 508
- img_proc: true
  md: 'problem. To squeeze ''Tim'' alphabetically between ''Thom'' and ''Tom'', you
    may have to make room by moving thousands of ''Tyler'', ''Uriah'', and ''Victor''
    names.


    But Java has an ArrayList class. An ArrayList is like an array, except that ArrayList
    objects grow and shrink as needed. You can also insert new values without using
    the ArrayList class''s add method. ArrayList objects are very useful because they
    do all kind of things that can''t


    # # File


    Talk about your useful Java classes! The File class does a bunch of things that
    aren''t included in this book''s examples. Method canRead tells you whether you
    can read from a file. Method canWrite tells you you can write to a file. Method
    setReadOnly ensures that you can''t accidentally write to a file. Method deleteOnExit
    checks to whether you have a particular file. Methods isHidden, lastModified,
    and length give you more information about a file. You can even create a new directory
    by calling the mkdir method. Face it: This File class is powerful!


    # # Integer


    Chapter 18 describes the Integer class and its parseInt method. The Integer class
    has lots of other features that come in handy when you work with int values. For
    example, Integer.MAX_VALUE stands for the number 2147483647. That''s the largest
    value that an int variable can store.(Refer to Chapter 7.) The expression Integer.MIN_VALUE
    stands for the number -2147483648 (the smallest value that an int variable can
    store). A call to Integer.toBinaryString takes an int and returns its base 2 (binary)
    representation. And what Integer.toBinaryString does for base 2, Integer.toHexString
    does for base 16 (hexadecimal).


    # # JFrame


    Chapter 20 has a JFrame example. A JFrame can be the starting point for an app''s
    appearance on the screen. A JFrame is like a window, so you can put buttons, that'
  merge: -1
  pgno: 509
- img_proc: true
  md: 'fields, and other useful widgets on a JFrame. In Chapter 20, I put an image
    on a JFrame.


    A JFrame has one of several different layouts. For example, a border layout divides
    the JFrame into five regions: NORTH, SOUTH, EAST, WEST, and CENTER regions An
    item in the CENTER region is usually the largest. It''s the centerpiece of the
    JFrame. Items in the other border layout regions live on the four edges of the
    JFrame.


    With a grid layout, you put items into table cells, and with a flow layout, you
    place items after another in a row.


    # JOptionPane


    For a quick and easy graphical user interface, use a JJOptionPane. Here''s some
    code:


    ```

    String word = JOptionPane.showInputDialog("Enter a word");

    JOptionPane.showMessageDialog(null, word);

    String string = JOptionPane.showInputDialog("Enter an int value");

    int number = Integer.parseInt(string);

    number++;

    JOptionPane.showMessageDialog(null, "One more is " + number\);

    ```


    When you run this code, you see the dialog boxes in Figures 22-1 to 22-4.


