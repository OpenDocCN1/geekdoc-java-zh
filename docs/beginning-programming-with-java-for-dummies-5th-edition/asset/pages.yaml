    # # Math


    Do you have any numbers to crunch? Do you use your computer to exotic calculations?
    If so, try Java''s Math class. (It''s a piece of code, not a place to sit down
    and listen to lectures about algebra.) The Math class deals with uc, e, logarithms,
    trig functions, square roots, and all other mathematical things that give most
    people the creeps.


    # # NumberFormat


    Chapter 18 has a section about the NumberFormat.getCurrencyInstance method. With
    this method, you can turn 20.3385000000003 into $20.34. If the United States isn''t
    your home, or if your company sells products worldwide, you can enhance your currency
    instance with a Java Locale. For example, with euro = NumberFormat.getCurrencyInstance(Locale.FRANCE),
    a call to euro.format(3) returns 3,00 € instead of $3.00.


    The NumberFormat class also has methods for displaying things that aren''t currency
    amounts. For example, you can display a number with or without commas, or without
    leading zeros, and with as many digits beyond the decimal point as you care to
    include.'
