    # Chapter 3


    # Running Programs


    > f you''re a programming newbie, for running a program probably means clicking
    a mouse. You want to run Microsoft Word, so you double-click the Microsoft Word
    icon. That''s all there is to it.


    When you create your own programs, the situation is a bit different. With a new
    program, the programmer (or someone from a programmer''s company) creates the
    program''s icon. Before that process, a perfectly good program may not even have
    an icon. So what do you do with a brand-new Java program? How do you get the program
    to run? This chapter tells you what you need to know.


    # Running a Canned Java Program


    The best way to know Java is to Java. When you''re doing Java, you''re writing,
    testing, and running your own Java programs. This section prepares you by describing
    how you run and test a program. Instead of writing your own program, you run a
    program that I''ve already written for you. The program calculates your monthly
    payments on a home mortgage loan.


    The mortgage-calculating program doesn''t open its window. Instead, the program
    runs in Eclipse''s Console view. The Console view is one of the tabs in the lower-right
    part of the Eclipse workbench. (See Figure 3–1.) A program that operates completely
    in this Console view is called a text-based program.'
