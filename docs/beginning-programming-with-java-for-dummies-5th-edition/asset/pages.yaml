    I can describe this line of code in at least two ways:


    +   **It''s a statement.** In Java, a direct instruction tells the computer to
    do something is called a statement. The statement in Listing 4-1 tells the computer
    to display some text. The statements in other programs may tell the computer to
    put 7 in a certain memory location or make a window appear on the screen. The
    statements in computer programs do all kinds of things.


    +   **It''s a method call.** Earlier in this chapter, I describe naming a method
    call.


    ```

    fixTheAlternator(junkyOldFord);

    ```


    is an example of a method call, and so is


    ```

    System.out.println("Chocolate, royalties, sleep");

    ```


    Java has many different kinds of statements. A method call is just one kind.


    # Ending a statement with a semicolon


    In Java, each statement ends with a semicolon. The code in Listing 4-1 has only
    one statement in it, so only one line in Listing 4-1 has a semicolon.


    Take any other line in Listing 4-1 — the method header, for example. The method
    header (the line with the main method in it) doesn''t directly tell the computer
    to do anything. Instead, the method header describes some action for future reference.
    The header announces “Just in case someone ever calls the main method, the next
    few lines of code tell you what to do in response to that call."'
