  md: 'In Listing 13-2, the added words throws FileNotFoundException form a throws
    clause. A throws clause is a kind of disclaimer. Putting a throws clause in your
    code is like saying, "I realize that this code can run into trouble."


    Of course, in the legal realm, you often have no choice about signing disclaimers.
    "If you don''t sign this disclaimer, the surgeon won''t operate on you." Okay
    then, I''ll sign it. The same is true with a Java clause. If you put things like
    PrintStream("cookedData.txt") in your code and you don''t add anything like throws
    FileNotFoundException, the Java compiler refuses to compile your code.


    So do we need this throws: FileNotFoundException clause, and when should you do
    without it? Well, having certain things in your code — things like new PrintStream("cookedData.txt")
    forces you to create a throws clause. You can spend some time learning all the
    kinds of things that throw clauses. At this point, it''s better to concentrate
    on other programming issues. Because you''re a beginning Java programmer, the
    safest thing to do is to follow the templates in Listings 13-3 and 13-4.


    The word FileNotFoundException is — guessed defined in the Java API.


    +   * To create this chapter''s code, I make up the names scanner and diskwriter.


    The words scanner and diskwriter don''t come from the Java API. In place of scanner
    and diskwriter, you don''t use any names you want. All have to use the names consistently
    within each of your Java programs.


    +   * A call to the close method ends the connection between your program and
    the file.


    In many of these books, you see the connection between your program and the computer
    keyboard by calling keyboard.close(). The same is true when you call the close
    method for a disk file''s scanner or a disk file''s PrintWriter instance. Calling
    the close method reminds Java to finish all pending read or write operations and
    to break the program''s connection to the disk file, the keyboard, or to otherwise
    else data for the program.


    This book''s examples are pretty simple. If you omit a close method in one of
    these examples, you might get a warning message from Eclipse, but the world doesn''t
    end. (That is, your program still runs correctly.) However, in a serious, makeitor-break-it
    application, the proper placement of close calls is important. Close calls ensure
    the proper completion of the program''s input and output actions and help free
    disk resources for use by other running programs.'
