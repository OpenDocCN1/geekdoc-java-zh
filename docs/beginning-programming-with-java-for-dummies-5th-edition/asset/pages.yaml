  md: '# Reading writing strings


    To read a String value from the keyboard, you can call either next or nextLine:


    +   The method next reads up to the next blank space.


    For example, with the input A. Burd, the statements


    ```

    String firstName = keyboard.next();

    String middleInit = keyboard.next();

    String lastName = keyboard.next();

    ```


    assign Barry to firstName, A. to middleInit, and to lastName.


    +   The method nextLine reads up to the end of the current line.


    For example, with input A. Burd, the statement


    ```

    String fullName = keyboard.nextLine();

    ```


    assigns A. Burd. to the variable fullName. (Hey, being an author has

    some hidden perks.)


