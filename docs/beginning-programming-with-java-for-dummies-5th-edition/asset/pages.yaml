  md: "# How you choose to do things\n\nA program is like a fingerprint. No two programs\
    \ look much alike. Say that I discuss a programming problem with a colleague.\
    \ Then we go our separate ways and write our own programs to solve the problem.\
    \ Sure, we're duplicating the effort. But will we create the exact same code?\
    \ Absolutely not. Everyone has his own style, and everyone's style is unique.\n\
    \nI asked fellow programmer David Herbst to write his own EchoLine program without\
    \ showing him code from Listing 5-1. Here's what he wrote:\n\n```\nimport java.io.BufferedReader;\n\
    import java.io.InputStream;\nimport java.io.IOException;\n\npublic class EchoLine\
    \ {\n    public static void main(String[] args) throws IOException {\n       \
    \ InputStream isr = new InputStream(System.in);\n        BufferedReader br = new\
    \ BufferedReader(isr);\n        String input = br.readLine();\n        System.out.println(input);\n\
    \    }\n}\n```\n\nDon't worry about BufferedReader, InputStream, or things like\
    \ that. Notice that, like snowflakes, no programs are written exactly alike, even\
    \ if they accomplish the same task. That's nice. It means that your code, however\
    \ different, can be as good as the next person's. That's encouraging.\n\n# COMPILE-TIME\
    \ ERRORS\n\nThe MCV vaccine helps you build an immunity to measles by giving you\
    \ a mild case of measles. In the same way, you can enhance your immunity against\
