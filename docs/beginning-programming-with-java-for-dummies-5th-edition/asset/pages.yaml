  md: '# Variations on the Theme


    I don''t like to skin cats. But I''ve heard that, if I ever need to skin one,
    I have a choice of several techniques. I''ll keep that in mind the next time my
    cat Histamine mistakes the carrier for a litter box.


    Anyway, whether you''re skinning catfish, skinning kitties, or writing computer
    programs, the same principle holds true. You always have alternatives. Listing
    9–2 shows you one way to write an if statement. The rest of this chapter (and
    all of Chapter 10) shows you other ways to create if statements.


    # ... Or else?


    You can create an if statement without an else. For example, imagine a web page
    on one in ten randomly visitors receives a special offer. To keep visitors guessing,
    I call the Random class''s nextInt method and make the offer to anyone whose name
    is lucky 7:


    +   >> ifRandom.nextInt(10) + 1 generates the 7, display a special message

    >> ifRandom.nextInt(10) + 1 generates any number other than 7, do nothing. Don''t
    display a special offer message and don''t display a discouraging,“Sorry, no offer
    for you,” message.


    > * Rick Ross, wrote about skinning cats in one of my other books, sent me this
    via email: “... you refer to ‘skinning the cat’ and on to discuss boxes and whatnot.
    Please note that the phrase ‘more than one way to skin a cat’ refers to the difficulty
    in removing the inedible skin from catfish, and that there is more than one way
    to do same. These range from nailing the critic''s tail to a board and taking
    a pair of pliers to peel it down, learning the furry kind of cat have the darn
    thing and not just worrying about it. I grew up on The River (the big one running
    north/south the U.S. that begins with M and so many repeated loops), so it’s integral
    to our experience.” Another reader, Alan Wilson, added his cents to this discussion:
    “... ‘Skinning a Cat’... actually has an older but equally interesting British
    Naval origin. It refers to the activity of attaching the nine ropes to the whip
    used to punish recalcitrant sailors up to a couple of hundred years ago. The ‘Cat-O’–Tails’
    was the name of the whip and there was more than one way to attach the ropes or
    ‘skin’ the whip.” One way or another, it’s time for me to apologize to my little
    house pet.


    212 PART 3 Controlling the Flow'
