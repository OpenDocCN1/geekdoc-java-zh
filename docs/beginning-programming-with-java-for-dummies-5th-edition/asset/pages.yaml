  md: "# VERSATILE LOOPING STATEMENTS\n\nIf you were stuck on a desert island with\
    \ only one kind of loop, what kind would you want to have? The answer is, you\
    \ can get along with any kind of loop. The choice between a while loop and a for\
    \ loop is about the code's style and efficiency. It's not about necessity.\n\n\
    Anything you can do with a for loop, you can do with a while loop as well. Consider,\
    \ for example, the for loop in Listing 15-1. Here's how you can achieve the same\
    \ effect with a while loop:\n\n```\nint count = 0;\nwhile (count < 10) {\n   \
    \ out.print(\"Ive chewed \");\n    out.print(count);\n    out.println(\" time(s).\"\
    );\n    count++;\n}\n```\n\nIn the while loop, you have explicit statements to\
    \ declare, initialize, and increment the counter variable.\n\nThe kind of trick\
    \ works in reverse. Anything that you can do with a while loop, you can do with\
    \ a for loop as well. But turning while loops into loops seems strained and unnatural.\
    \ Consider a while loop from Listing 15-2 in Chapter 12:\n\n```\nwhile (total\
    \ < 21) {\n    card = myRandom.nextInt(10) + 1;\n    total += card;\n    System.out.print(card);\n\
    \    System.out.print(\" - \");\n    System.out.println(total);\n}\n```\n\nTurning\
    \ this loop into a for loop means most of the stuff inside the for loop's parentheses:\n\
    \n```\nfor (; total < 21; ) {\n    card = myRandom.nextInt(10) + 1;\n    total\
    \ += card;\n    System.out.print(card);\n    System.out.print(\" - \");\n    System.out.println(total);\n\
    }\n```\n\n(continued)\n\nCHAPTER 15 The Old Runaround 331"
