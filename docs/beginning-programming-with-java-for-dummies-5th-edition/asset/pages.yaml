    # Chapter 15


    # The Old Runaround


    > remember it distinctly — the sense of dread I would feel on the way to Aunt
    Edna''s house. She was a kind old woman, and her intentions were good. But visits
    to her house were always agonizing.


    First, we''d sit in the living room and talk about other relatives. That was okay,
    as long as I understood what people were talking about. Sometimes, the gossip
    was about adult topics, and I''d become bored.


    After all the chatter, my father would help Aunt Edna with her bills. It was fun
    to watch because Aunt Edna had a genetically inherited family ailment: Like me
    and many of my ancestors, Aunt Edna couldn''t keep track of paperwork to save
    her life. It was as if the paper had allergens that made Aunt Edna a mistake,
    an improper tally, or something else in the ledger that needed attention. After
    ten minutes of useful bill paying, my father would find it needed attention. He''d
    ask Aunt Edna about it, and she''d shrug her shoulders. He''d become agitated
    trying to track down the problem, while Aunt Edna ruled her eyes and smiled with
    ignored satisfaction. That was great entertainment.


    Then, when the bill paying was done, we''d sit down to eat. That''s when I would
    remember why I dreaded these visits. Aunt Edna believed in Fletcherism — a health
    movement whose followers chewed each mouthful of food 100 times. The more devoted
    followers used a chart, with a different number for the mastication of each kind
    of food. The minimum number of chews for any food was 32 — one chop for each in
    your mouth. People who did said they were “Fletcherizing.",'
  merge: -1
