    \ of\nfor loop in\nListing 15-1.\n\n# # The anatomy of a for statement\n\nA typical\
    \ for a statement looks like this:\n\n```\nfor (Initialization; Condition; Update)\
    \ (\n  Statements\n)\n```\n\nAfter the word for, you put three things in parentheses:\
    \ an initialization, a condition, and an update.\n\nEach of the three items in\
    \ parentheses plays its own, distinct role:\n\n+   - **Initialization**: The initialization\
    \ is executed once, when the run of the program first reaches the for statement.\n\
    - **Condition**: The condition is tested several times (at the start of each iteration).\n\
    - **Update**: The update is also evaluated several times (at the end of each iteration).\n\
