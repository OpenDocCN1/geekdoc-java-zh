    # Running a Disk-Oriented Program


    To deal with volumes of data, you need tools for reading from (and writing to)
    disk files. At the mere mention of disk files, some people''s hearts start to
    vibrate with fear. After all, a disk file is elusive and invisible. It''s hearts
    somewhere inside your computer, with some magic magnetic process.


    The truth is, getting data from a disk is much like getting data from the keyboard.
    And printing data to a disk is like printing data to the screen.


    In this book, displaying a program''s text output "on the computer screen" means
    displaying text in its Console view. If you Eclipse in favor of a different IDE
    (such as NetBeans or IntelliJ IDEA) or you all IDEs in favor of your system-command
    window, then, for you, "on the screen" means-slightly different. Please read between
    the lines as necessary. Also, I''m well aware that computers have SSD drives with
    no honest-to-goodness disks inside them. So terms like disk-oriented and disk
    files are showing signs of age. But let''s face facts: A "record store" no longer
    focuses on vinyl records, and in U.S. measurement units, 12 inches is no longer
    the length of the king''s foot. Today''s LCD screens no longer need saving. And,
    unlike the old mechanical car radios, a web page''s buttons don''t mark your favorites
    stations.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_303_0.png)


