    # What''s the point?


    More important than the humongous range of the double keyword''s numbers is that
    a double value can have digits to the right of the decimal. After you declare
    amount to be of type double, you can store all sorts of numbers in amount. You
    can store 5.95, 0.0238479, or -3.0. In Listing 6-1, if I hadn''t declared amount
    to be of type double, I wouldn''t have been able to store 5.95. Instead, I would
    have had to store plain old 5 or dreary 6, without any digits beyond the decimal.


    For more info on numbers decimal points, see Chapter 7.


    This paragraph deals with a really picky point, so skip it if you''re not in the
    mood. People often use the phrase decimal to describe a number with digits to
    the right of the decimal. The problem is, scalable "dec" stands for the number
    10, so word decimal implies a base-10 representation. Because computers store
    base-2 (not base-10) representations, word decimal to describe such a number is
    a misnomer. But in this book, I can''t help myself. I''m calling them decimal
    numbers, whether the techies it or not.


