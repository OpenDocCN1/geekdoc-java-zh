    ![](img/8e09247dec29cb1986bf1f8d64f5812d_85_0.png)


    Logic errors are the most challenging errors to find and fix. And worst of all,
    logic errors often go unnoticed. In March 1985, I got a monthly home heating bill
    for $1,328,932.21. Clearly, some computer had printed the incorrect amount. When
    I called the gas company to complain about it, the telephone representative said,
    "Don''t be upset. Pay only what you afford."


    +   **Compile-time warnings:** A warning is not as severe as an error message.
    So, when Eclipse detects something suspicious in your program, the editor displays
    a yellow underline, a tiny yellow icon containing an explanation, and other non-intrusive
    clues.


    For example, in the sidebar figure, I added something about amount = 10 to the
    code from Listing 3-1. (It''s bit late on line 8). The problem is, Never make
    use of amount, or of the number 10 in anywhere. With its yellow marks, Eclipse
    effectively tells me "Your amount = 10 code isn''t bad enough to be a stopper.
    Eclipse can still manage to run your program. But are you sure your amount = -10
    (the shift that seems to serve no purpose) in your program?


    ```

    MyMyFirstClass.java

    1

    2 public class MyFirstClass {

    3

    4    public static void main(String[] args) {

    5        int amount = 10;

    6        System.out.println("Chocolate, royalties, sleep");

    7

    8

    9}

    10

    11

    ```


    Imagine being told to "turn when you reach the intersection." The direction may
    be just fine. But if you''re suspicious, you, "Which way should I turn? Left or
    right?


    When you''re sure that you know what you''re doing, you can ignore warnings and
    worry about them at some later time. But a warning can be an indicator that something
    serious is wrong with your code. My sweeping recommendation is this: Pay attention
    to warnings. But, if you can''t figure out why you''re getting a particular warning,
    don''t let the warning prevent you from moving forward.


    70 PART 1 Getting Started with Java Programming *'
