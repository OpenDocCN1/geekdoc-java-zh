    \ a double value, a boolean value, and maybe other kinds of values to create something\
    \ that you call a Purchase. Because your purchase info is all in one big bundle,\
    \ keeping track of the purchase's pieces is easier. That's the start of an important\
    \ computer programming concept: the notion of object-oriented programming.\n\n\
