    # FORGET WHAT YOU''VE SEEN


    In Listing 6-1, and in other examples throughout this book, I do something experienced
    programmers avoid: I put actual numbers, such as 5.95 and 25.0 in my Java code.
    This is called hard-coding the values. The hard-coded values to keep these introductory-programming
    examples as simple as possible.


    But in most real-life applications, hard-coding is bad. Imagine when Snit raises
    its shipping and handling fee from $25.00 to $35.00. Then the program in Listing
    6-1 no works correctly. Someone has to launch Eclipse, look over the code, test
    the new code, and distribute the new code to the people who run it. What a pain!
    For the ten-line program in Listing 6-1, this process takes minutes. For a 10,000-line
    program in a real-life setting, this process might take days, weeks or months.


    Instead of hardcoding, you should type values on the keyboard during the run of
    the program. If that''s not practical, your program can read values from a computer''s
    hard disk. (Chapter 13 has the scoop of reading from disk files). One way or another,
    you should design your program to work with all values, not only with specific
    values such as 5.95 and 25.00.


    Keep reading this book''s examples. When you see my hard-coded values, remember
    that I use hard-coded values to keep you from being distracted by input and output
    problems. I keep you focused on whatever new ideas each example has to offer.
    I do not hard to convince you that hard-coding is good programming practice. In
    fact, it''s not.


