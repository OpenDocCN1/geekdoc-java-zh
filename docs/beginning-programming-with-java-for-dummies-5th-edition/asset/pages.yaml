  md: "When you compare two things with a double equal sign, reference types and primitive\
    \ types do not behave the same way. Consider, for example, int versus String:\n\
    \n+   You can compare two int values with a double equal sign. When you do, things\
    \ work exactly as you would expect. For example, the condition in the following\
    \ code is true:\n\n```\nint apples = 7;\nint oranges = 7;\n\nif (apples == oranges)\
    \ {\n    System.out.println(\"They're equal.\");\n}\n```\n\n+   When you compare\
    \ two String values with the double equal sign, things do not work the way you\
    \ expect. The computer does not check to see if the two String values contain\
    \ the same letters. Instead, the computer checks some esoteric property of the\
    \ variables stored in memory.\n\nFor your purposes, the term reference type is\
    \ just a fancy name for a class. Because String is defined as a class in the Java\
    \ API, I call String a reference type. This terminology highlights the parallel\
    \ between primitive types (such as int) and classes (that are, reference types,\
    \ such as String).\n\n![](img/8e09247dec29cb1986bf1f8d64f5812d_424_0.png)\n\n\
