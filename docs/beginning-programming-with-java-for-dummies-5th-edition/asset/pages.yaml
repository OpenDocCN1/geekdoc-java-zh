    # The method named System.out.println


    The statement in the middle of Listing 4-1 calls a method named System.out.println.
    This method is defined in the Java API. Whenever you call the System.out.println
    method, the console displays it on its screen.


    Think about names. Believe it or not, I know two people named Pauline Ott. One
    of them is a nun; the other is a physicist. Of course, there are plenty of Paulines
    in the English-speaking world, as there are several things named println in the
    Java API. To distinguish the physicist Pauline Ott from the film critic Pauline
    Kael, I write her name Pauline. And to distinguish the nun from the physicist,
    I write “Sister Pauline Ott”. In the same way, I write System.out.println or DriverManager.println.
    The first (which you often use) writes text on the computer’s screen. The second
    (which you don''t use in this book) writes to a database log file.


    Just as Pauline and Ott are names in their own, so System.out and println are
    names in the Java API. To use println, you must write the method’s full name.
    You never write println alone. It’s always System.out.println or another combination
    of API names.


    Java programming language is CASE–SEnTiVe. If you change a lowercase letter to
    an uppercase letter (or vice versa), you change a word’s meaning. You can’t replace
    System.out.println with system.out.println. If you do, your program won’t work.


