  md: '# WHAT CAN POSSIBLY WRONG?


    Ridding the editor of jagged underlines is cause for celebration. Eclipse likes
    the look of your code, so from that point on, it''s smooth sailing, Right?


    Well, it isn''t necessarily so. In addition to some conspicuous compile-time errors,
    your code can have other, less obvious errors.


    Imagine someone telling you to "go to the intersection, and then *right*. And
    you respond with a polite "Huh?" The nonsensical right phrase is a compile-time
    error. Your "Huh?" is like the jagged underlines in Eclipse''s editor. As a listening
    human being, you may be able to guess what *right* means, but Eclipse''s editor
    never dares to fix your code.


    In addition to compile-time errors, some other kinds of gremlins hide inside a
    Java program:


    +   **Checked runtime exceptions:** You have no compile-time errors, but when
    you run your program, the run ends prematurely. Somewhere in the middle of the
    run, your instructions tell Java to do something that can''t be done. For example,
    you''re running the Mortgage program in the "Running a Canned Java Program" section,
    you type 1,000,000.00 instead of 100,000.00. Java doesn''t like the commas in
    the number, your program crashes and displays a nasty-looking message, as shown:


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_84_0.png)


    This is an example of an *unchecked runtime exception*—the equivalent of someone
    telling you to right at the intersection when the only thing to the right is a
    big wall. Eclipse''s editor doesn''t warn you about an unchecked runtime exception
    because, until you run the program, the computer can''t predict that it will occur.


    +   **Logic errors:** You see no error markers in Eclipse''s editor, and when
    you run your code, the program runs to completion. But the answer isn''t correct.
    Instead of $552,200,000.00 in the figure, the program wrongly tells you to pay
    thousands of times what your house is worth and tells you to pay this amount each
    month! It''s the equivalent of being told to turn right instead of turning left.
    You can drive in the wrong direction for a very long time.


    (continued)


    CHAPTER 3 Running Programs 69'
