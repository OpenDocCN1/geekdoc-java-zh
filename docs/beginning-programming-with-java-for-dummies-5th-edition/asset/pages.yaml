    hero meets his nemesis,"Number One." At first, Number One wears a spooky happy-face/sad-face
    mask, and when the mask comes off, there''s a monkey mask underneath. To find
    out what''s behind the monkey mask, you have to rent the series and watch it itself.
    But in the meantime, notice the layering: a mask within a mask. You can do the
    same kind of thing with if statements. This section''s example shows you how.'
