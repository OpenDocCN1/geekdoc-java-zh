  md: '# WHAT''S BEHIND ALL THIS

    findWithinHorizon NONSENSE?


    Without wallowing in too much detail, here''s how the findWithinHorizon

    ("", 0).charAt() technique works:


    Java''s findWithinHorizon method looks for things in the input. The things

    method depends on the stuff you put in parentheses. For example, a call to

    findWithinHorizon("\\d\\d", 0) looks for a group consisting of three digits.

    With the following line of code


    ```

    System.out.println(keyboard.findWithinHorizon("\\d\\d", 0));

    ```


    I can


    Testing 123 Testing Testing


    and the computer responds by displaying


    123


    In the call findWithinHorizon("\\d\\d", 0), each \d stands for a single digit.

    This business is one of many abbreviations in special code called regular expressions.


    Now here''s strange. In the world of regular expressions, a dot stands for any

    character at all. (That is a dot stands for "any character, not necessarily a
    dot.) So

    findWithinHorizon("", 0) tells the computer to find the next character of any

    kind that the users type on the keyboard. When you''re trying to input a single
    character,

    findWithinHorizon("", 0) is mighty useful.


    In the call findWithinHorizon("\\d\\d", 0), the \d tells findWithinHorizon

    to keep searching until the end of the input. This value 0 is a special case because-

    other than 0 limits the search to a certain number of characters. (That''s why
    the

    method name contains the word horizon. The horizon is as far as the method sees.)

    Here are a few examples:


    +   * With the same inputTesting123 Testing, the call findWithin

    Horizon("\\d\\d", 9) returns null. It returns null because the first nine

    characters of the input (the characters Testing 1—seven letters, a blank space,

    and a digit) don''t contain three consecutive digits. These nine characters don''t

    match the pattern \\d\\d.


