    Wednesday, Thursday, or Friday.


    Life is filled with small sets of possibilities, and Java has a feature that that
    can reflect

    these possibilities. The feature is called an enum type. It''s available from
    Java

    version 5.0 onward.


    # # Creating an enum type


    The story in Listing 10–6 has three possible endings — the Hankees win, the

    ocks win, or the game is tied. You can represent the possibilities with the follow-

    line of Java code:


    ```

    enum WhoWins{home, visitor, neither}

    ```


    This week''s game is played at Hankeeville''s SnitSoft Stadium, so the value home

    represents a win for the Hankees, and the value visitor represents a win for the

    Socks.


    One of the goals in computer programming is for each program''s structure to

    mirror whatever problem the program solves. When a program reminds you of its

    underlying problem, the program is easy to understand and inexpensive to main-

    tain. For example, a program to table customer accounts should use names like

    customer and account. A program that deals with three possible outcomes

    home wins, visitor wins, and tie) should have a variable with three possible

    values. The line enum WhoWins(home, visitor, neither) creates a type to store

    three values.


    The WhoWins type is called an enum type. Think of the new WhoWins type as a

    boolean on steroids. Instead of two values (true and false), the type has

    threeree values (home, visitor, and neither). You can create a variable of type

    WhoWins:


    ```

    WhoWins who;

    ```


    and then assign a value to the new variable:


    ```

    who = WhoWins.home;

    ```


    In the next section, I put the WhoWins type to good use.


    # # Using an enum type


    Listing 10–7 shows you how to use the brand-new WhoWins type.'
