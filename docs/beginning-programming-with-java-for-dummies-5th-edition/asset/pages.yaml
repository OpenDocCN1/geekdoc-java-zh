    \nHere's the strategy: Take the statements in Listing 14-1 and enclose them in\
    \ a larger loop:\n\n```\nwhile (not at the end of the email.txt file) {\n    Execute\
    \ the statements in Listing 14-1\n}\n```\n\nLooking back at the code in Listing\
    \ 14-1, you see that the statements in that code have a loop of their own. So\
    \ this strategy involves putting one loop inside another:\n\n```\nwhile (not at\
