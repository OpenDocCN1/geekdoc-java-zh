    In spite of this silly twoPlusTwo example, the while statement turns out to be
    the most useful of Java''s looping constructs. In particular, the while loop is
    good for situations in which you must look before you leap. For example: "Money
    is in my account, we receive a mortgage check every month." When you first encounter
    this statement, if your account has a zero balance, you don''t want to write a
    mortgage check — not even one check.


    But at times (not many), you want to wait before you leap. In a situation you''re
    asking the user for a response, maybe the user''s response makes sense, but maybe
    it doesn''t. Maybe the user''s finger slipped, or perhaps the user didn''t understand
    the question. In many situations, it''s important to correctly interpret the user''s
    response. If the user''s response doesn''t make sense, you must ask again.


    # Getting a trustworthy response


    Consider a program that deletes a file. Before deleting the file, the program
    asks for confirmation from the user. If the user types Y, delete; if the user
    types N, don''t delete. Of course, deleting a file is serious. Mistaking a keystroke
    for a "yes" answer can delete the company''s records. (And mistaking a keystroke
    for a "no" can preserve the company''s incriminating evidence.) If there''s any
    doubt about the user''s response, the program should ask the user to respond.


    Pause a moment to think about the flow of actions — what should and shouldn''t
    happen when the computer executes the loop. A loop of this kind doesn''t need
    to check anything before getting the user''s first response. Indeed, before the
    user gives the first response, the loop has nothing to check. The loop shouldn''t
    start with "as as the user''s response is invalid, get another response from the
    user, and then check the response to see whether it made sense. The code to do
    all of this is in Listing 15–4.


