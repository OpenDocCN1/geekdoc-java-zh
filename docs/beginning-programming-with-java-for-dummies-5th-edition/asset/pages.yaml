  md: 'At this point, I use a popular programmer''s trick. I add statements to display
    the value of fahrenheit:


    ```

    fahrenheit = 9.0 / 5.0 * celsius + 32.0;

    System.out.print("fahrenheit: "); //Added

    System.out.println(fahrenheit); //Added

    ```


    A run of the enhanced code is shown in Figure 8-12. As you can see, the computer
    misses its mark. Instead of the expected value 69.8, the computer''s value for
    9.0 / 5.0 * 21 + 32.0 is 69.800000000001. That''s just the way it crumbles. The
    computer does all its arithmetic with zeros and ones, the computer''s answer doesn''t
    look like the base-10 arithmetic in Figure 8-11. The computer''s answer isn''t
    wrong. The answer is just slightly inaccurate.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_207_0.png)


    In an example in Chapter 7, Java''s remainder operator (*) gives you 0.12999999999999
    instead of 0.13. The strange kind of things happens in this section. But this
    section''s code doesn''t use an exotic remainder operator. This code uses your
    old friends: division, multiplication, and addition.


    Be careful when you compare two numbers for equality (==) or for inequality (!=).
    Little inaccuracies creep in almost anywhere where you work with Java''s double
    type or float type and build up on another to become very large inaccuracies.
    When you compare double values or two float values, the values are almost never-equal
    to one another.


    If your program isn''t doing what you think it should, check your suspicions about
    the values of variables. Add print in statements to your code.


    When you compare double values, give yourself some leeway. Instead of comparing
    for exact, ask whether a particular value is relatively close to the expected
    value. For example, use a condition like fahrenheit >= 69.8 - 0.01 && fahrenheit
    <= 69.8 + 0.01 to find out fahrenheit is within 0.01 of the value 69.8. To read
    more about conditions containing Java''s && operator, see Chapter 10.


    192 PART 2 Writing Your Own Java Programs'
