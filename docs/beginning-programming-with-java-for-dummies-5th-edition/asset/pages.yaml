  md: 'If you ever have to decide what a view is as opposed to an editor, here''s
    what you need to know:


    +   **View:** A part of the Eclipse workbench that displays information for you
    to browse. In the simplest case, a view fills up an area in the workbench. For
    example, in Figure 3-15 the Package Explorer fills up the leftmost area.


    Many views display information as lists or trees. For example, in Figure 3-10
    the Package Explorer view contains a tree.


    You can use a view to make changes to things. For example, to delete the 03–01
    project on the left side in Figure 3-15, right-click the 03–01 branch in the Package
    Explorer view. (On a Mac, control-click the 03–01 branch.) Then, on the resulting
    context menu, choose Delete.


    When you use a view to change something, the change takes place immediately. For
    example, when you choose Delete on the Package Explorer''s menu, whatever item
    you''ve selected is deleted immediately. In a way, this behavior is nothing. The
    same kind of thing happens when you recycle a file using Windows Explorer or a
    file using the Macintosh Finder.


    +   **Editor:** A part of the Eclipse workbench that displays information for
    you to modify. An editor displays information in the form of text. This text can
    be the contents of a file. For example, an editor in Figure 3-11 displays the
    contents of the MyFirstClass.java file.


    When you editor change something, the change doesn''t take place immediately.
    For example, look at the editor in Figure 3-11. This editor displays the contents
    of the MyFirstClass.java file. You can type all kinds of things in the editor.
    Nothing happens to MyFirstClass.java file until you choose File: Save from editor''s
    menu bar. Of course, this behavior is nothing. The same kind of thing happens
    when you work in Microsoft Word or in any other word processing.


    Like others, I occasionally become lazy and use the word when I really mean view
    or editor. When you catch me doing this, just shake your head and move onward.
    When I''m being careful, I use the official Eclipse terminology. I refer to views
    and editors as parts of the Eclipse workbench. Unfortunately, this “parts” terminology
    doesn''t stick in people''s minds well.


    An area of the Eclipse workbench might contain several overlapping views or overlapping
    editors. To bring one view or editor to the forefront, click a tab. Most Eclipse
    users get along without giving this “several views” business a second thought
    (or even a first thought). But if you care about the terminology surrounding tabs
    and active views, here''s the scoop:


