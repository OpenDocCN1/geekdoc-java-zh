  md: '# GRABBING INPUT HERE AND THERE


    Listing 16-2 illustrates some pith issues surrounding the input of data. For one
    thing, the program gets input from both the keyboard and a disk file. (The program
    gets a room number from the keyboard. The program gets the number of guests in
    room from the occupancy file.) To make this happen, Listing 16-2 sports two Scanner
    declarations: one to declare keyboard and a second to declare diskScanner.


    Later in the program, call the keyboard.nextInt. reads from the keyboard, and
    diskScanner..nextInt reads from the file. Within the program, you can read from
    the keyboard or the disk as many times as you want. You can even interming the
    calls — reading from the keyboard, and three times from the disk, and twice from
    the keyboard, and all you have to do is remember to use keyboard whenever you
    read from the keyboard and use diskScanner whenever you read from the disk.


    Another tid tid in Listing 16-2 concerns the occupancy file. Many of this chapter''s
    examples read from an occupancy file, and I use the same data in each of the examples.
    (I use the data shown in Figure 16-1.) To run an example, I copy the occupancy
    file from Eclipse project to another. (Before running the code in Listing 16-2,
    I go to my old 16-01 project and select Copy from Eclipse''s Package Explorer.
    Right-click the occupancy file in the 16-02 project branch and select Copy from
    the context menu. Then I right-click Mac users Control-click instead of right-click).


    In real life, having several copies of a file can be dangerous. You might accidentally
    read out-of-date data from a different copy. Sure, you should have backup copies,
    but you should have only one "master" — the copy from which all programs get the
    same input.


    In a real-life program, you don''t copy the occupancy file from one project to
    another. What do you do instead? You put an occupancy file in one place on your
    hard drive and then have each program refer to the file using the names of the
    file''s directories. For example, if your occupancy file is in the c:\Oct\22 directory,
    you write


    ```

    Scanner diskScanner = new File("c:\oct\22\occupancy");

    ```


    The "Name that file" sidebar in Chapter 13 has more details about filenames and
    double backslashes.


