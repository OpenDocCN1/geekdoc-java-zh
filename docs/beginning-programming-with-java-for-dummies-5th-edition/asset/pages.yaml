  md: '# Creating New Values by Applying Operators


    What could be more comforting than your old friend, the plus sign? It was the
    first thing you learned about elementary school math. Almost everybody knows how
    to add two to two. In fact, in English usage, adding two and two is a metaphor
    for something that''s easy to do. Whenever you see a plus sign, one of your brain
    cells says "Thank goodness, it could be something more complicated."


    So Java has a plus sign. You can use the plus sign to add two numbers:


    ```

    int apples, oranges, fruit;

    apples = 5;

    oranges = 16;

    fruit = apples + oranges;

    ```


    Of the old min sign is available, too:


    ```

    apples = fruit - oranges;

    ```


    Use an asterisk for multiplication and a forward slash for division:


    ```

    rate, pay, withholding;

    int hours;

    rate = 6.25;

    hours = 35;

    pay = rate + hours;

    withholding = pay / 3.0;

    ```


    > When you add an int value by another int, you get an int value. The computer
    doesn''t round. Instead, the computer chops off any remainder. If you put System.out.println(11
    / 4) in your program, the computer prints 2, not 2.75. If you put a decimal answer,
    either (or both) of the numbers you''re dividing divides values. For example,
    if you put System.out.println(11.0 / 4) in your program, the computer divides
    a double value, 11.0, by an int value, 4. Because at least one of the two is double,
    the computer prints 2.75.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_171_0.png)


    # Finding a remainder


    A useful arithmetic operator called the remainder operator. The symbol for the
    remainder operator is the percent (%). When you put System.out.println(11 % 4)
    in your program, the computer prints 3. It does because it goes into 11 who-cares-how-many
    times, with a remainder of 3.'
