    \ In Listing 11-1, the last break (the break that's part of the default clause)\
    \ is just for the sake of overall tididness.\n\n# Picky details about the switch\
    \ statement\n\nA switch statement can take the following form:\n\n```\nswitch\
    \ (Expression) {\n  case FirstValue:\n    Statements\n\n  case SecondValue:\n\
    \    MoreStatements\n\n  // ... more cases ...\n\n  default:\n    EvenMoreStatements\n\
    }\n```\n\nHere are some tidbits about switch statements:\n\n+   The Expression\
    \ doesn't have to have an int value. It can be char, byte,\nshort, or int.\n\n\
    For example, the following code works in Java 5 and later:\n\n```\nchar letterGrade;\n\
    letterGrade = keyboard.findWithin(\".\", 0).charAt(0);\n\nwitch (letterGrade)\
    \ {\n  case 'A':\n    System.out.println(\"Excellent\");\n    break;\n\n  case\
    \ 'B':\n    System.out.println(\"Good\");\n    break;\n\n  case 'C':\n    System.out.println(\"\
    Average\");\n    break;\n}\n```"
