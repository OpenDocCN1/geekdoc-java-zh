  md: 'documentation at the Oracle website and revisit the site whenever you need
    to look up something, or you can save time by downloading your own copy of the
    API docs using the links found at www.oracle.com/technetwork/java/javase/downloads/index.html.


    # Your Java Programming Toolset


    To write Java programs, you need the tools described previously in this chapter:


    +   **You need a java compiler.** (Refer to the section "Translating your code.")

    **You need a JVM.** (Refer to the section "Running code.")

    **You need the Java API.** (Refer to the section "Code you can use.")

    **You need access to the Java API documentation.** (Again, refer to the "Code
    you can use" section.)


    You also need some exotic editors:


    +   **You need an editor to compose your Java programs.** Listing 1-1 contains
    part of a computer program. When you come right down to it, a computer program
    is a big chunk of text. So, to write a computer program, you may need an editor
    — a tool for creating text documents.


    An editor is like Microsoft Word, or like other word processor program. The big
    difference is that an editor adds formatting to your text — no bold, italic, or
    distinctions among fonts. Computer programs have no formatting whatsoever. They
    have nothing except plain old letters, numbers, and other character codes.


    When you edit a program, you may see bold text, italic, and text in several colors.
    But your program contains none of this formatting. If you see that looks like
    highlighting, it''s because the editor you''re using does syntax highlighting.
    an editor makes the text appear to be formatted in order to help you understand
    the structure of your program. Believe me, syntax highlighting is very helpful.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_36_0.png)


    +   **You need a way to issue commands.** You need a way to say things like "compile
    this program" and "run the JVM." Every computer provides ways of issuing commands.
    (You can double-click icons or type commands in a Run dialog box.) But when you
    use your computer''s facilities, you jump from one window to another. You open
    one window to read Java documentation, another window to edit a Java program,
    and a third window to start up the Java compiler. The process can be tedious.'
