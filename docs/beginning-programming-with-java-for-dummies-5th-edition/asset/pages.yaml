    # Icons Used in This Book


    If you could watch this book, you''d see me sitting at my computer, talking to
    myself. I say each sentence several times in my head. When I have an extra thought,
    a side comment, or something that doesn''t belong in the regular stream, I twist
    my head a little bit. That way, whoever''s listening to me (usually nobody) knows
    that I''m off on a momentary tangent.


    Of course, in print, you''ll see me twisting my head. I need some other way of
    setting a side thought in a corner by itself. I do it with icons. When you see
    a Tip icon or a Reminder icon, you know that I''m taking a quick detour.


    Here''s a list of icons that I use in this book:


    +   TIP A tip is an extra piece of information — something helpful that the other
    books may forget to tell you.


