    # Chapter 7

    Numbers and Types


    N so long ago, people thought computers did nothing but big, number-crunching
    calculations. Computers solved arithmetic problems, and that was the end of the
    story.


    In the 1980s, with the widespread use of word processing programs, the myth of
    the big math brain went by the wayside. But even then, computers made great calculators.
    After all, computers are very fast and accurate. Computers never need to count
    on their fingers. Best of all, computers don''t feel burdened when they do arithmetic.
    I hate ending a meal in a good restaurant by worrying about the tax and tip, but
    computers don''t mind that stuff at all. (Even so, computers seldom go out to
    eat.)


    # Using Whole Numbers


