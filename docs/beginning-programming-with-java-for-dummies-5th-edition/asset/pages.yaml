    # What is a method?


    You''re working as an auto mechanic in an upscale garage. Your boss, says, “You''re
    always in a hurry and has a habit of running words together, "fixTheAlternator
    on junkyOldFord.\ Mentally, you run through a list of tasks. "Drive the car into
    the bay, lift the hood, get wrench, loosen the alternator belt," and so on.


    +   **You have a name for the thing you''re supposed to do.** The name is fixTheAlternator.


    +   **In your mind, you have a list of tasks associated with the name fixTheAlternator.**
    The list includes "Drive the car into the bay, lift the hood, get wrench, loosen
    the alternator belt," and so on.


    +   **You have a grumpy boss who is telling you to do this work.** Your boss gets
    you working by saying, "fixTheAlternator." In other words, your boss gets you
    working by saying the name of the thing you''re supposed to.


    In this scenario, using the word method wouldn''t be a big stretch. You have a
    method for doing something with an alternator. Your boss calls that method into
    action, and you respond by doing all the things in the list of instructions you''ve
    associated with the method.


    # Java methods


    If you believe all that in the preceding section, you''re ready to read about
    Java methods. In Java, a method is a list of things to do. Every method has a
    name, and you tell the computer to do the things in the list by using the method''s
    name in your program.'
