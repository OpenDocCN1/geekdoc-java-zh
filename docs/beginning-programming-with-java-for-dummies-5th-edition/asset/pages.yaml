    # # Part 2: Writing Your Own Java Programs


    This part covers the basic building blocks — the elements in any Java program
    and in any program using a Java-like language. In this part, you discover how
    to represent data and how to get new values from existing values. The program
    examples are short, but cute.


    # # Part 3: Controlling the Flow


    Part 3 has some of my favorite chapters. In these chapters, you make the computer
    navigate from one part of your program to another. Think of your program as a
    big mansion, with the computer moving from room to room. Sometimes the computer
    chooses between two or more hallways, and sometimes the computer revisits rooms.
    As a programmer, your job is to plan the computer''s routes through the mansion.
    It''s great fun.


    # # Part 4: Using Program Units


    Have you ever solved a big problem by breaking it into smaller, more manageable
    pieces? That''s exactly what you do in Part 4 of this book. You will discover
    the best ways to break programming problems into pieces and to create solutions
    for the newly found pieces. You also find out how to use other people'' solutions.
    It feels like stealing, but it''s not.


    This part also contains a chapter about programming with windows, buttons, and
    other graphical items. If your mouse feels ignored by the examples in this book,
    read Chapter 20.'
