    \ Java are cast in stone. If you change class to Class or Public, you get something\
    \ new — something the compiler probably can't understand. That's why the compiler\
    \ chokes on improper keyword capitalizations. It's the compiler's job to make\
    \ sure that all the keywords are used properly.\n\nOn the other hand, the identifiers\
    \ can bounce all over the place. Since, there's an identifier named main, but\
    \ you can make up a new identifier named Main, it shouldn't. It's too confusing\
    \ to people who know Java's usual meaning for main. When the compiler sees a mistyped\
    \ line, like public static void Main, the compiler assumes you're making a brand-new\
    \ name. So the compiler lets the line pass. You get complaints from your friend,\
    \ the compiler.\n\nBut then, when you try to run the code, the compiler goes ballistic.\
    \ The Java Virtual Machine (JVM) runs your code.(For details, see Chapter 1).\
    \ The JVM needs to find a place to start executing statements in your code, the\
