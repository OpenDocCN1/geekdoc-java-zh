    # Chapter 1


    # Getting Started


    Computer programming? What''s that? Is it technical? Does it hurt? Is it politically
    correct? Does Google control it? Why would anyone want to do it? And what about
    me? Can I learn to do it?


    # What''s It All About?


    You''ve probably used a computer to do word processing. Type a letter, print it,
    and send the print to someone you love. If you have easy access to a computer,
    you''ve probably surfed the web. Visit a page, click a link, and see another page.
    It''s easy, right?


    Well, it''s easy only because someone told the computer exactly what to do. If
    you take a computer directly from the factory and give no instructions to this
    computer, the computer can''t do word processing, it can''t surf the web, and
    it can''t do anything. All a computer can do is instructions that people give
    to.


    Now imagine you''re using Microsoft Word to write the great American novel, and
    you come to the end of a line. (You''re not at the end of a sentence; just the
    end of a line.) As you type the next word, the computer''s cursor jumps automatically
    to the next line of type. What''s going on here?'
