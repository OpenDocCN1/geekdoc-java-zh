  md: '# NAME THAT FILE


    What if a file contains data isn''t in your program''s project folder? If that''s
    the case, when you call it new File, the file''s name must include folder names.
    For example, in Windows, your TallyBudget.java program might be in your c:\Users\MyUserName\workspace\13-09
    folder, and a file name totals might be in a folder c:\advertisements. (See the
    following figure.)


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_320_0.png)


    Then, to refer to that file, you include the folder name, the filename, and to
    be (on the right side) the driver letter:


    ```

    Scanner diskScanner = new Scanner(File("c:\advertisements"));

    ```


    Notice we use double backslashes to separate the drive letter, the folder name,
    and the filename. To find out why, look at the "Escism" sidebar in Chapter 12.
    The string "totals" with a single backslash stands for tab, followed by totals.
    But in this example, the file''s name is totals, not totals. With a single backslash,
    the name ... \advertisements\totals\ would not work correctly.


    Inside quotation marks, you use the double backslash to indicate what would usually
    be a single backslash. The string "c:\advertisements\totals" stands for c:\advertisements\totals.
    That''s good because c:\ is what you normally refer to a file in Windows.


    If you want to sidestep this backslash confusion, you can use forward slashes
    to specify each file''s location. Windows responds exactly the same way to new
    File("c:/advertisements/totals") and to new File("c:/advertisements/totals/").
    And if you use UNIX, Linux, or a Macintosh, the double backslash nonsense doesn''t
    apply to you.


    ```

    Scanner diskScanner = new Scanner (File("/Users/me/advertisements/totals/"));

    ```


    or something that reflects your system''s directory structure.'
