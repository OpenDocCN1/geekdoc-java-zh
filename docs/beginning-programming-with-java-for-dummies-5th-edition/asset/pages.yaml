  md: '# Running the sample program


    Testing the code in Listing 13-2 is a three-step process. Here''s an outline of
    the three steps:


    +   1. Create the rawData.txt file.


    +   2. Run the code in Listing 13-2.


    +   3. View the contents of the cookedData.txt file.


    The next few sections cover each step in detail.


    # Creating an input file


    You can use any plain old text editor to create an input file for the code in
    Listing 13-2. In this section, I show you how to use Eclipse''s built-in editor.


    To create an input file:


    +   1. Select a project in Eclipse''s Package Explorer.


    In this example, select the 13-02 project (the project containing the code from
    Listing 13-2).


    In the Package Explorer, select a branch whose label is the name of a project.
    (Select the 13-02 branch to run the code in Listing 13-2.) Don''t select an item
    within a project. (For example, don''t select the src branch or the (default package)
    branch).


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_311_0.png)


    +   2. On Eclipse''s menu bar, choose File -> New->.


    Eclipse''s New dialog opens.


    +   3. In the File Name field, type the name of your new data file.


    You can type any name that your computer considers to be a valid filename. For
    this section''s example, I used the name rawData.txt, but other names, such as
    rawData.dat, rawData, and raw123.datafile are fine. I try to avoid troublesome
    names (including short, uninformative names and names containing spaces), but
    the name you choose is entirely up to you (and your computer''s operating system,
    and your boss''s whims, and your custom-specifications).


    +   4. Click Finish.


    The file name appears in Eclipse''s Package Explorer. An empty editor (with the
    new file''s name on its tab) appears in Eclipse''s editor area.'
