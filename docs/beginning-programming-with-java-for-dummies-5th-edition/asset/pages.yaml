  md: '# About the Author


    Dr. Barry Burd received a Master of Science degree in computer science at Rutgers
    University and a PhD in mathematics at the University of Illinois. As a teaching
    assistant in Champaign–Urbanana, Illinois, he was elected five times to the university–wide
    List of Teachers Ranked as Excellent by Their Students.


    Since 1980, Dr. Burd has been a professor in the department of Mathematics and
    Computer Science at Drew University in Madison, New Jersey. He has lectured at
    conferences in the United States, Europe, Australia, and Asia. He hosts podcasts
    and videos about software and other technology topics. He is the author of many
    articles and books, including Java For Dummies, Java Programming for Android Developers
    For Dummies, and Android Application All-in-One For Dummies, all from Wiley.


    Dr. Burd lives in Madison, New Jersey, with his wife of n years, where n > 35.
    As an avid indoor enthusiast, Dr. Burd enjoys sleeping, talking, and eating.'
