  md: '# COPY TEXT TO A LABEL


    In JavaFX, a label is similar to a text field. Like a text field, a label may
    display text. In fact, a label control has a setText method, like the setText
    method used in Listing 20-4.


    But a label looks different. A label''s appearance doesn''t invite the user to
    change the label''s text. A label looks like text has been planted permanently
    on the frame. Of course, the text isn''t permanent, because your code can change
    a label''s text.


    Use(fx)clip and Scene Builder to create a frame with a button, a text field, and
    a label. When the user clicks the button, Java copies text from the text field
    to the label.


    **Hint:** When you declare more than one type of control, each declaration requires
    its own @FXML annotation.


    ```

    @FXML

    private TextField textField;

    @FXML

    private Label label;

    ```


    # CREATE SMALL CALCULATOR


    Use(fx):clip and Scene Builder to create a frame with two text fields, a button,
    and a label. The user types a number in one of the text fields and another number
    in the other text field. When the user clicks the button, Java displays the sum
    of the two numbers in the label.


    **Hint:** Whatever Java gets from a text field''s getText method has String type.
    When you put a plus sign between String values, Java simply parses the values
    together — for example, "42" + "98" = "4298". Before you can add these values
    together, you have to convert them to numbers. You do this with Java''s Integer.parseInt
    method.(Refer to Chapter 18).


    When you call a label''s setText method, the call''s parameter must have the String
    type. To get a String value from an int value, use the Integer.toString method
    — for example, Integer.toString(86) is "86".'
