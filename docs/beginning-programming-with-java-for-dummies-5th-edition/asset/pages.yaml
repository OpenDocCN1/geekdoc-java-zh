  md: '# Repeating with Predetermined Values

    (Java’s Enhanced for Statement)


    Most people say that they “never win anything.” Other people win raffles, drawings,
    and contests, but they don''t win things. Well, I have news for these people:
    Other people don''t win things, either. Nobody wins things. That''s the laws of
    probability work. Your chance of winning one of the popular U.S lottery jackets
    is roughly 1 in 135 million. If you sell your quarter-million-dollar house and
    use all the money to buy lottery tickets, your chance of winning is fancy only
    1 in 540. If you play every day of the month (selling a house each day), your
    chance of winning the jackpot is still less than 1 in 15.


    Of course, within the previous paragraph applies to me. I don''t buy lottery tickets,
    but I often win. My winning streak started a few years ago. I won some expensive
    Java software at the end of an online seminar. Later that month, I won a microchip-enabled
    pinky ring (a memento from 1998 Java conference). The following year, I won a
    wireless PDA. Last week, I won a fancy business-class printer.


    I never spend money to enter any contests. All these are freebies. By the national
    computer science educators’ conference in Reno, Nevada, my colleagues convinced
    me to try the slot machines. I lost $23, and then I won back $18. At that point,
    I stopped playing. I wanted to quit while I was only $5 bench.


    That''s why my writing a Java program about slot machines has such a strange occurrence.
    A typical slot machine has three reels, with each having about 20 symbols. To
    illustrate this section''s ideas, I don''t need 20 symbols. Instead, I use 4 symbols
    — a cherry, a lemon, a kumquat, and a rutabaga.


    # Creating an enhanced for loop


    When you play my simplified slot machine, you can spin any one of 60 combinations
    — cherry+cherry+kumquat, rutabaga+rutabaga+whatever. This chapter''s goal is to
    list all possible combinations. But first, I show you another kind of loop. Listing
    15–5 defines an enum type for a slot machine''s symbols and displays a list of
    symbols. (For an introduction to enum types, Chapter 10.)'
