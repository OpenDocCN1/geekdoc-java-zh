    # Getting a Value from a Method


    Say that you''re sending a friend to buy groceries. You make requests for groceries

    in the form of method calls. You issue calls such as


    ```

    gotoTheSupermarketAndBuySome(bread);

    toTheSupermarketAndBuySome(bananas);

