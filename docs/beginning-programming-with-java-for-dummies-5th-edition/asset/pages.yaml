    and whole numbers are more accurate than other kinds of numbers. In fact, without
    those remainders, the remainder value of .1 .38 % .25 is .1299999999999. All those
    nine are tough to work with. Imagine reading your credit card statement and seeing
    that you owe $0.12999999999999. You probably pay $0.13 and let the credit card
    company keep the change. After years of rounding numbers, the credit card company
    would make a fortune!! Chapter 8 describes, in a bit more detail, inaccuracies
    that may come from using double values.


