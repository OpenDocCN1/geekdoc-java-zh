    # Returning to the big picture


    The next twos deal with Eclipse''s overall look and feel:


    +   **Layout:** An arrangement of certain views. The layout in Figure 3-3 has
    seven views, of which four are easily visible:

    - At the far left, you see the Package Explorer view.

    - On the far right, you have the Task List view and the Outline view.

    - Near the bottom, you get the Problems, Javadoc, Declaration, and Console views.


    Along with these views, the layout contains a single editor area. Any and all
    open editors appear inside this area.


    +   **Perspective:** A very useful layout, which is useful if someone gives you
    a name. And if a layout has a name, you can use the layout whenever you want.
    By default, the workbench of Figure 3-3 displays Eclipse''s Java perspective.
    Specifically, the Java perspective contains six views in an arrangement very much
    like the arrangement shown in Figure 3-3.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_91_1.png)


    The Console view appears in Figure 3-3, but the Console view doesn''t appear as
    part of the Java perspective. Normally, the Console view appears automatically
    when you run a text-based Java program. If you want to force the Console view
    to appear, choose Window: Show View: Other. In the resulting Show View dialog
    box, expand the General branch. Finally, with that General branch, double-click
    the Console item.


    Along with these views, the Java perspective contains an editor area. The editor
    area has several tabs, but the number of tabs has nothing to do with the Java
    perspective.


    You can switch among perspectives by choosing Window: Open Perspective in Eclipse''s
    main menu bar. This book focuses exclusively on Eclipse''s Java perspective. But
    if you like poking around, visit some of the other perspectives to get a glimpse
    of Eclipse''s power and versatility.'
