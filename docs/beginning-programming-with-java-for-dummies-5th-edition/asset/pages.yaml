    # AN APOLOGY OF SORTS (ALONG WITH AN EXCUSE!)


    As far as most professional programmers are concerned, the code in Listings 17-2
    and 17-3 is quite simple. It''s too simple. Java programmers don''t like expressions
    as onePurchase.unitPrice and they hate declarations as double unitPrice. Instead,
    they prefer double unitPrice with expressions as onePurchase.getPrice(). These
    programmers will tell you that the code in Burd''s examples isn''t safe. "Burd''s
    examples promote programming practices," and in the Summertime, Burd wears clothes
    that don''t match." In fact, these programmers are absolutely correct.


    In my opinion, you learn walk before you learn to run. Classes and objects are
    difficult concepts, I present them in as simple a form as I possibly can. Object-oriented
    programming is an art as well as a science. A way of thinking — away whose mastery
    requires time and patience. I have students at the university (some very good
    students) who spend months wrestling with the fundamentals of classes and objects.


    In this book, I don''t present the most time-honored, expert-approved way of dealing
    with classes and objects. Instead, I follow the simplest path to help you get
    classes and objects into your consciousness. You can learn the better way of doing
    things after you''ve become comfortable dividing problems into their object-oriented
    paths.


    And besides, for all the nasty things someone might say about this chapter''s
    simple examples, the examples aren''t fake. They run, they produce output, and
    they illustrate the separating of a class from the main program''s code. At the
    core, that''s what object-oriented programming is all about.


    So there!'
