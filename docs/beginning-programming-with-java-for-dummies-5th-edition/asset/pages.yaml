  md: 'When you run JShell, the dialogue goes something like this:


    ```

    jshell> You type a statement

    JShell responds

    ```


    For example, in Figure 6-9, I type double amount and then press Enter. JShell
    responds by displaying


    ```

    amount => 0.0

    ```


    Then I type amount = 5.95, and JShell responds with


    ```

    amount => 5.95

    ```


    And then, when I type amount = amount + 25.00, JShell comes back with a friendly


    ```

    amount => 30.95

    ```


    Here are a few things to notice about JShell:


    +   **You don''t have to type an entire Java program.**


    Typing a few statements such as


    ```

    double amount

    amount = 5.95

    amount = amount + 25.00

    ```


    does the trick. It''s like running the code snippet in Listing 4-1 (except that
    Listing 4-1 doesn''t declare InAccount.to be a double).


    +   **In JShell, semicolons are (to some extent) optional.**


    In Figure 6-9, I don''t bother to end any lines with semicolons.


    +   **JShell responds immediately after you type each line.**


    After I declare amount to be double, JShell responds by telling me that the amount
    variable has the value 0. After I type amount = amount + 25.00, JShell tells me
    that the new value of amount is 30.95.'
