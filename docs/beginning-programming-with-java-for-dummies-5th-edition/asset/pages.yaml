  md: '![](img/8e09247dec29cb1986bf1f8d64f5812d_378_0.png)


    Figure 16-6:

    An abstract snapshot of rooms in the Java Motel.


    Using an array saves you from having to declare separate variables: guestsIn0,
    guestsIn1, guestsIn2, and so on. To declare an array with ten variables in it,
    you can write two short lines of code:


    ```

    int guestsIn[];

    guestIn = new int[10];

    ```


    You can even squash these lines into one longer line:


    ```

    int guestsIn[] = new int[10];

    ```


    In either of these snippets, notice the use of the number 10. This number tells
    the computer to make the guestsIn array ten components. Each component of the
    array has a name of its own. The starting component is named guestsIn[0], the
    next is guestsIn[1], and so on. The last of the components is named guestsIn[9].


    In creating an array, you always specify the number of components. The array''s
    indices starts with 0 and with the number that''s fewer than the total number
    of components. For example, if your array has ten components (and you declare
    it with new int[10]), the array''s indices goes from 0 to 9.


    When you create an array variable, you can put square brackets after either the
    type name or the variable name. In other words, you can write


    ```

    int guestsIn[];

    ```


