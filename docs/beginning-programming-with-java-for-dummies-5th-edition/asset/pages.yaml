  md: '# WHO DOES WHAT, AND HOW?


    When you write a program, you''re called a programmer, but when you run a program,
    you''re called a user. So when you test your code, you''re both the program-mer
    and the user.


    Suppose that your program contains a keyboard.nextSomething() call, like the calls
    in Listings 5-1 (Chapter 5) and 6-2. Then your program gets input from the user.
    But, when the program runs, how does the user know to type something on the keyboard?
    If the user and the programmer are the same person, and the program is fairly
    simple, knowing what to type is no big deal. For example, when you start running
    the code in Listing 5-1, you have this book in front of you, and the book says
    "The computer is wait-ing for you to type something... One line of text.... So
    you type the text and press Enter. Everything is fine.


    But few programs come with their own hooks. In many instances, when a program
    starts running, the user has to start at the screen to figure out what to do next.
    The code in Listing 6-2 works in this stare-at-the-screen scenario. In Listing
    6-2, the first call to print puts an informative message "What''s the price of
    a flash drive?" on the user''s screen. A message of this kind is called a prompt.


    When you start writing programs, you can easily confuse the readers of the prompt
    and the user''s input. Remember: No predefined relationship exists between the
    prompt and the subsequent input. To create a program, you can call print or println.
    Then to read the user''s input, you call nextLine, nextDouble, or one of the Scanner
    class'' other next methods. Use print and next calls in two separate statements.
    Java has no commonly used, single statement that does both the prompting and the
    "next-ing."


    As the programmer, your job is to combine the prompting and the next-in. You can
    combine prompting and next-in in all kinds of ways. Some ways are helpful to the
    user, and some ways are aren, as described in this:


    +   * If you have a call to print or println then no prompt. A blink-ing cursor
    sits quietly and waits for the user to type something. The user has to guess what
    kind of input to type. Occasionally that''s okay, but usually it isn''t.

    * If you call print or println but don''t call a keyboard.nextSomething method,
    the computer doesn''t wait for the user to type anything. The program proceeds
    to execute whatever statement comes immediately after the prompt or println.

    * If your prompt displays a misleading message, you misled the user. Java has
    no built-in feature that checks the appropriateness of a prompt. That''s not surpr-ing.
    Most computer languages have no prompt-checking feature.


    Be careful with your programs. Be nice to your user. Remember that you were once
    a humble computer user, too.'
