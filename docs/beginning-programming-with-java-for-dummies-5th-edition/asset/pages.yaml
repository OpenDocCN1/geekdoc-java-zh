    Keep reading for some "frinstances".


    # # Case sensitivity


    Java is case-sensitive. Among other things, case-sensitive means that, in a Java
    program, the letter P isn''t the same as the letter p. If you send me some fail
    and start with "Dear barr" instead of "Dear Barry," I still know what you mean.
    Java doesn''t work that way.


    Change one character in a Java program and, instead of an uneventful compilation,
    you get a bit headache! Change p to P like so:


    ```

    //The following line is incorrect:

    System.out.println(keyboard.nextLine());

    ```


    When you type the program in Eclipse''s editor, you get the ugliness shown in
    Figure 5-6.'
