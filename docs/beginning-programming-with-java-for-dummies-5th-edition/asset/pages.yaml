  md: '+   Java, you can use a plus sign to add a char value to a string. When you
    do, the result is a string:


    So, " + (char)(myRandom.nextInt(26) + ''A'') is a string containing one randomly
    generated uppercase character. And when you add (char)

    myRandom.nextInt(26) + ''a'') to the end of that string, you get another

    string — a string containing two randomly generated characters. Finally, when
    you

    add another (char)(myRandom.nextInt(26) + ''a'') to the end of that string,

    You get string containing three randomly generated characters. So you can assign

    that string to anAccount.lastName. That''s how the statement in Listing 19-3

    works.


    When you write a program like the one in Listing 19-3, you have to be careful
    with

    numbers, char values, and strings. I do not do this kind of programming every
    day of the

    week — before I got this section''s example to work, I had many false starts.
    That''s okay,

    ''m very persistent.


    Onto the empty string and the uppercase letter, the program concatenates a

    thing. This third thing is the value of the expression (char) (myRandom.

    extInt(26) + ''a''). This expression represents a lowercase letter (any lower-

    case letter, generated randomly).


    Onto all this stuff, the program concatenates another lowercase letter. So altogether,
    you have a randomly generated three-letter name. For more details, see

    the upcoming sidebar.


    In Listing 19-3, the statement anAccount.balance = myRandom.nextInt(10000)

    asigns an int value to balance. But balance is a double variable, not an int

    variable. In a rare case of permissiveness, Java allows you to assign

    an int value to a double variable. The result of the assignment is no big surprise.

    If you assign the value 8734 to the double variable balance, the value of

    balance becomes 8734.0. The result is shown on the first line of Figure 19-3.


    Using the double type to store an amount of money is generally a bad idea. In
    this

    book, I use double to keep the examples as simple as possible. But the int type
    is

    better for money values, and the BigDecimal type is even better. For more details,

    see Chapter 7.


