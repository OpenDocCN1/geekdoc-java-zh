    # Using JavaFX and Scene Builder


    GUI programs have two interesting characteristics:


    +   ** GUI programs typically contain lots of code.

    Much of this differs little from one GUI program to another.


    +   ** GUI programs involve visual elements.

    The best way to describe visual elements is "draw" them. Describing them with
    code can be slow and unintuitive.


    To make your GUI life easier, you can use JavaFX and Scene Builder. With Scene
    Builder, you describe your program visually. Scene Builder automatically translates
    your visual description into Java source code and XML.


    # Installing Scene Builder


    Installing Scene Builder is like installing most software. Here''s how you do
    it:


    +   1. Visit `http://gluonhq.com/products/scene-builder.`


    +   2. Click the Download button.

    When you do, a list of download options appears.


    +   3. Click the button corresponding to your computer''s operating system (Windows,
    Mac, or Linux).

    As a result, the download begins. On a Windows computer, you get an .exe file.
    Double-click the file to begin the installation.'
