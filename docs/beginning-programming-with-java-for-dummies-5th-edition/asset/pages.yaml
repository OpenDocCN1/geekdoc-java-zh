  md: '# Decisions, Decisions!


    Picture yourself walking along a quiet country road. You''re enjoying a pleasant
    summer day. It''s not too hot, and a gentle breeze from the north makes you feel
    fresh and alert. You''re holding a copy of this book, opened to Chapter 9. You
    read the paragraph about storing words or sentences, and then to look up.


    You see a fork in the road. You see two signs — one pointing to the right and
    the other pointing to the left. One sign reads, "Storing words or sentences? True."
    The other sign reads, "Storing words or sentences? False." You evaluate the words-sentences
    situation and march on, veering right or left depending on your software situation.
    A diagram of this story is shown in Figure 9-1.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_217_0.png)


    Figure 9-1: Use something called a String.


    Life is filled with forks in the road. Take an ordinary set of directions for
    heating up a frozen snack:


    +   Microwave cooking directions:


    Place on microwave-safe plate.

    Microwave on high for 2 minutes.

    Turn product.

    Microwave on high for 2 more minutes.'
