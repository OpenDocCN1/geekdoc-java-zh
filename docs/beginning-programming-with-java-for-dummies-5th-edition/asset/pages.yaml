  md: 'Then there''s French. In France, there''s a candy bar named "Gift":


    He came for the holidays, and all he gave me a bar of Gift.


    What do the letters g-l-f-t really mean? Well, they don''t mean anything until
    you decide on a way to interpret them. The same is true of the zeros and ones
    inside a computer''s circuitry.


    Take, for example, the sequence 01001010. This sequence can stand for the letter
    J, but it can also stand for the number 74. That sequence of zeros and ones can
    stand for 1.036960863003646×10⁻⁴¹. And when interpreted as screen pixels, the
    same sequence can represent the dots shown in Figure 6-6. The meaning of 01001010
    depends entirely on how the software interprets this sequence.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_150_0.png)


    # Types and declarations


    How do you tell the computer 01001010 stands for? The answer is in the concept
    called type. The type of a variable describes the kinds of values that the variable
    is permitted to store.


    In Listing 6–1, look at the first line in the body of the main method:


    ```

    double amount;

    ```


    This is called a variable declaration. Putting this line in your program is like
    saying, "I’m declaring my intention to have a variable named amount in my program."
    This line reserves the name amount for your use in the program.


    In this variable declaration, the word double is a Java keyword. This double tells
    the computer what kind of values you intend to store in amount. In particular,
    the word double stands for numbers between -1.8×10³⁰⁸ and 1.8×10³⁰⁸. That''s'
