  md: '# WHY CAN’T THE COMPUTER FIX IT?


    How often do you get to finish someone else’s sentence? “Please,” says your supervisor,
    “go over there and connect the ...”


    Wires,” you say. “I’ll connect the wires.” If you know someone means to say, why
    wait for it to say it?


    This same question comes up in connection with computer error messages. Take a
    look at the message in Figure 5-7. The computer expects a semicolon after the
    statement on line 8. Well, Mr. Computer, if you know where you want a semicolon,
    just add the semicolon and be done with it. Why are you bothering it?


    The answer is simple. The computer is not interested in taking any chances. What
    if you don’t really want a semicolon after the statement on line 8? What if the
    missing semicolon represents a more profound problem? If the computer added the
    extra semicolon, it could do do harm than good.


    Returning to you and your supervisor....


    Boom! A big explosion. “Not the wires, you Dummy. The dots. I wanted you to connect
    the dots.


    “Sorry,”you say.


    It’s the same way in a Java program. You can get carried away with punctuation.
    Consider, for example, the main method header in Listing 5-1. This line is a dangerous
