  md: "In the expression new JFrame(), Java's new keyword signals a call to a constructor.\
    \ A constructor is like a method, except that a constructor's name is the same\
    \ as the name of a Java class. Java's standard API contains classes named JFrame,\
    \ ImageIcon, and JLabel, and the code in Listing 20-1 calls the JFrame, ImageIcon,\
    \ and JLabel constructors.\n\nAs the terminology suggests, a constructor is a\
    \ piece of code that constructs an object. So, in Listing 20-1, when you call\n\
    \n```\nJFrame frame = new JFrame();\n```\n\nyou make a JFrame variable refer to\
    \ a newly constructed object (an object from the JFrame class).\n\nConstructors\
    \ and methods have a lot in common with one another. You can't call a method without\
    \ having a corresponding method declaration somewhere in the code. (In the case\
    \ of Java's nextime, the method declaration lives where inside Java's enormous\
    \ bunch of API classes.) The same is true of constructors. You can call new JFrame()\
    \ without having a constructor for the class somewhere in your code. And, sure\
    \ enough, inside the Java API class, you can find a declaration for the JFrame()\
    \ constructor. The code looks something like this:\n\n```\npublic class JFrame\
    \ {\n    int height;\n    int width;\n    public Component add()...\n    public\
    \ void setDefaultCloseOperation()...\n    public void pack()...\n    public void\
