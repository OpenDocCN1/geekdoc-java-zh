  md: '# Calling static and non-static methods


    In this book, my first use of the word static is in Listing 3-1. I use static
    as part of every main method (and this book''s listings have lots of main methods).
    In Java, your main method has to be static. That''s just how it goes.


    To call a static method, you use a class name with a dot. This is slightly different
    from the way you call a non-static method:


    +   To call an ordinary (non-static) method, you follow an object with a dot.


    For example, a program to process the checks in Figure 18-7 may contain the code
    of the following:


    ```

    firstCheck;

    firstCheck.number = 1705;

    firstCheck.amount = 25.09;

    firstCheck.payee = "The Butcher";

    firstCheck.print();

    ```


    +   To call a static method, you follow the class name with a dot.


    For example, to sort the checks in Figure 18-7, you may call


    ```

    Check.sort();

    ```


