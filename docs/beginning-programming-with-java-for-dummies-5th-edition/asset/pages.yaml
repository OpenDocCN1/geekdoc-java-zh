  md: "The Java programming language has three kinds of comments:\n\n+   Traditional\
    \ comments: The comment in Listing 4-1 is a traditional comment. The comment begins\
    \ with /* and ends with */. Everything between the opening /* and the closing\
    \ */ is for human eyes only. Nothing between /* and */ / gets translated by the\
    \ compiler.\n\nThe third, and fourth lines in Listing 4-1 have extra asterisks.\
    \ I call them \"extra\" because these asterisks aren't required when you create\
    \ a comment. They just make the comment look pretty. I include them in Listing\
    \ 4-1 because, for some reason that I don't entirely understand, most Java programmers\
    \ add these extra asterisks.\n\n+   End-of-line comments: Here's some code with\
    \ end-of-line comments:\n\n```\nclass ThingsLike {\n    // Two things are missing\n\
    \    public static void main(String args[]) {\n        System.out.println(\"sleep\"\
    ); // Missing from here\n    }\n}\n```\n\nAn end-of-line comment starts with two\
    \ slashes and extends to the end of a line of type.\n\nYou may have programmers\
    \ talk commenting out certain parts of the code. When you're writing a program\
    \ and something's not working correctly, it often helps to remove some of the\
    \ code. If nothing else, you find out what happens when suspicious code is removed.\
    \ Of course, you may not like what happens when the code is removed, so you don't\
    \ want to delete the code. Instead, you turn your ordinary statements into comments.\
    \ For example, System.out.println(\"Sleep\"); // /*. This keeps the Java compiler\
    \ from seeing the code while you try to figure out what's wrong with your program.\n\
    \n+   Javadoc comments: A special Javadoc comment is any traditional comment that\
    \ begins with an extra asterisk:\n\n```\n/**\n * Print a String and then terminate\
    \ the line.\n */\n```\n\nThis is a cool Java feature. The Java SE software that\
    \ you download from Oracle's website includes a little program called javadoc.\
