    # Computers Are Stupid


    Handy as they are, all computers do the same damn thing. They do exactly what
    you tell them to do, and that''s very unfortunate. For example, in 1962, a Mariner
    spacecraft to Venus was destroyed just four minutes after its launch. Why? It
    was destroyed because of a missing keystroke in a FORTRAN program. Around the
    time, NASA scientists caught an error that could have crashed the Mercury space
    flights. (Oops! These were flights with people on board!) The error was a line
    with a period instead of comma. (A computer programmer wrote DO 10 I=1 instead
    of DO 10 I=1,).


    With all respect to my buddy Robojeves, he and his computer cousins are all incredibly
    stupid. Sometimes they look like they''re second-guessing us humans, but they''re
    just doing what others tell them to do. They can total viruses and use elaborate
    schemes to mimic creative behavior, that they never really think on their own.
    If you say, "jump," they do what they''re programmed to do in response to the
    letters J-u-p.


    When you write a computer program, you have to imagine that a genie has granted
    you three wishes. Don''t ask for eternal love if you do, the genie will give you
    a slobdering, adoring mate — someone you don''t like at all. And don''t ask for
    a million dollars unless you want the genie to turn you into a bank robber.


    Everything you write in a computer program has to be precise. Take a look at an
    example. . . .'
