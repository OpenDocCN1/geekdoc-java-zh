    The Eclipse Workspace Launcher.


    A workspace is a folder on your computer''s hard drive. Eclipse explores your
    Java programs in one or more workspace folders. With these each workspace contains
    some Eclipse settings. These settings store things like the version of Java that
    you are using, the colors when you prefer for words in the editor, and the size
    of the editor area when you draw the edges. You can have several workspaces with
    different programs and different settings in each workspace.


    By default, the Workspace Launcher offers to open whatever workspace you opened
    the last time you ran Eclipse. To open the workspace that you used in Chapter
    2, so do not modify the stuff in the Launcher''s Workspace field.


    # 3. In the Workspace Launcher dialog box, click OK.


    The big Eclipse workbench starts at from your computer. (See Figure 3-3).


    In Figure 3-3, the leftmost part of the workbench is Eclipse''s Package Explorer,
    which contains numbers like 03-01, 04-01, and so on. Each number is actually the
    name of an Eclipse project. Formally, a *project* is a collection of files and
    folders inside a workspace. Intuitively, a *project* is a basic work unit. For
    example, a self-contained collection of Java program files to manage your CD collection
    (with the files containing the data) may constitute a single Eclipse project.


    Looking at the Package Explorer in Figure 3-3, you see projects named 03-01, 04-01,
    and so on. My project 03-01 shows the code for Listing 1-3 (the first and only
    listing in this chapter, Chapter 3). Project 06-02 contains the Java program in
    Listing 6-2 (the second code listing in Chapter 6 of this book). Project names
    can include letters, digits, blank spaces, and other characters; for the names
    of this book''s examples, I stick with digits and dashes.


