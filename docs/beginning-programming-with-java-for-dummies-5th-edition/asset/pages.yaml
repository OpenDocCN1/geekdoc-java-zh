  md: '# Expecting the Unexpected


    Not long ago, I met an instructor with an interesting policy. He said, "Sometimes
    when I''m lecturing, I compose a program from scratch on the computer. I do it
    right in front of my students. If the program compiles and runs correctly the
    first try, I expect the students to give me a big round of applause."


    At first, you might think this guy has an enormous ego, but you have to put things
    in perspective. It''s unusual for a program to compile and run correctly the first
    time. There''s always a typo or another error of kind.


    So section deals with the normal, expected errors that you see when you compile
    and run a program for the first time. Everyone makes these mistakes, even the
    most seasoned travelers. The key is keeping a cool head. Here''s my general advice:


    +   **Don''t expect a program that you compile to the first time.


    +   Be prepared to return to your editor and fix some mistakes.


    +   **Don''t expect a program that compiles flawlessly to run correctly.


    Even with no error markers in Eclipse''s editor, your program might still contain
    flaws. After Eclipse compiles your program, you still have to run it successfully.
    That is, your program finish its run and display the correct output.


    You compile and then run. Getting a program to compile without errors is the easier
    of the two tasks.


    +   **Read what''s in the Eclipse editor, not what you assume are in the Eclipse
    editor.**


    Don''t assume that you''ve typed words correctly, that you''ve capitalized words
    correctly, or that you''ve matched braces or parentheses correctly. Compare the
    code you typed with any sample code that you have. Make sure that every detail
    is in order.


    +   **Be patient.**


    Every programming effort takes a long time to get right. If you don''t understand
    something right away, be persistent. Stick with it (or put it away for a while
    and come back to it). There''s nothing you can''t understand if you put in enough
    time.


    +   **Don''t become frustrated.**


    Don''t worry your pie crust. Frustration (not lack of knowledge) is your enemy.
    If you''re frustrated, you can''t accomplish anything.'
