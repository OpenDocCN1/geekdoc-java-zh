  md: 'The code in Listing 16-3 isn’t earth-shattering. To get this code, you take
    the code in Listing 16-2 and add a few tests for the end of the occupancy file.
    You perform the diskScanner.hasNext test before calling nextInt. That way, if
    the call to nextInt is doomed to failure, you catch the failure before happens.
    A few test runs of the code in Listing 16-3 are shown in Figure 16-4.


    ```

