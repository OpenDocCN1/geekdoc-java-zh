  md: '# Understanding the Big Picture


    In this section, I answer some of the burning questions that I raise throughout
    this book: "What does java.util stand for?” "Why do I need the word static in
    certain points in the code?” "How can a degree in Horticultural Studies help you
    sort canceled checks?",


    I also explain "static" in some unique and interesting ways. After all, static
    fields and methods aren''t easy to understand. It helps to read about Java''s
    static fields from several points of view.


    # Packages and import declarations


    In Java, you can group a bunch of classes into something called a package. In
    fact, the classes in Java''s standard API are divided into over 200 packages.
    This book''s examples make heavy use of three packages: the packages named java.util,
    java.lang, and java.io.


    # The class java.util.Scanner


    The package java.util contains about 75 classes, including the very useful Scanner
    class. Like most others, this Scanner has two names: a fully qualified name and
    an abbreviated simple name. The class''s fully qualified name is java.util.Scanner,
    and the class''s simple name is Scanner. You get the fully qualified name by adding
    the package name java.util to the simple name. (That is, you add the package name
    java.util to simple Scanner.)


    An import declaration lets you abbreviate a class''s name. With the declaration


    ```

    import java.util.Scanner;

    ```


    The java compiler figures out where to look for the Scanner class. So instead
    of writing java.util.Scanner throughout your code, you can just write Scanner.


    # The class java.lang.System


    The package java.lang contains about 35 classes, including the ever-popular System
    class. (The class''s fully qualified name is java.lang.System, and the class''s
    simple name is System.) Instead of writing java.lang.System throughout your code,
    you can just write System. You don''t even need an import declaration.'
  merge: -1
  pgno: 436
- img_proc: true
  md: 'Among all of Java''s packages, the java.lang package is special. With without
    an import declaration, the compiler imports everything in the java.lang package.
    You can start your program with import java.lang.System. But if you don''t, the
    compiler adds this declaration automatically.


    # The static System.out variable


    What kind of importing must you do in order to abbreviate System.out.println?
    How can you shorten it to out.println? An import declaration lets you abbreviate
    a class''name. In the expression System.out, the word out isn''t a class. The
    word out is a variable. (The out refers to the place where a Java program sends
    text output.) So you can''t


    ```

    ```//This code is bogus. Don''t use it:

    import java.lang.System.out;```

    ```


    What do you do instead? You write


    ```

    ```import static java.lang.System.out;```

    ```


    To find out more about the out variable''s being a static variable, read the next
    section.


    In this chapter, I refer to out as a static variable. That''s okay. But a more
    descrip-

    terive way to refer to out is to call it a static field of Java''s class.


    # ALL YE NEED TO KNOW


    I can summarize much of Java''s complexity in only a few sentences:


    +   * The Java API contains many packages.

    * A package contains classes.

    * From a class, you can create objects. Each such object is an instance of the
    class.

    * An object has its own copy of each of the class''s fields and methods (each
    of the

    class''s members).

    * A class has the one and only copy of each of the class''s static fields and
    static

    methods (the class''s static members).'
