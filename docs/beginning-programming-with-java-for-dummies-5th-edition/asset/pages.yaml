  md: '# Installing Eclipse


    Precisely how you install Eclipse depends on your operating system and on what
    kind of file you get when you download Eclipse. Here''s a brief summary:


    +   If you run Windows and the download is an .exe file:

    - Double-click the .exe file''s icon.


    +   If you run Windows and the download is a .zip file:

    - Extract the file''s contents to the directory of your choice.

    - In other words, find the .zip file icon in File Explorer. Then double-click
    the .zip file icon. (As a result, Explorer displays the contents of the .zip file,
    which consists of only one folder — a folder eclipse). Drag the eclipse folder
    to a convenient place on your computer''s hard drive.


    For more information about .zip file, see the "Compressed archive files" sidebar,
    in this chapter.


    My favorite part to drag the eclipse folder is directly onto the C: drive. So
    my C: drive has folders named Program Files, Windows, eclipse, and others. I avoid
    making the eclipse folder a subfolder of Program Files because time to time, I''ve
    had problems dealing with the blank space in the name Program Files.


    If you run Mac OS X:


    +   When you download Eclipse, you get either a .tar.gz or a .dmg file.

    - A .tar.gz file is a compressed archive file. When you download the file, your
    web browser might automatically do some uncompressing for you. If so, you won''t
    find a .tar file in your Downloads folder. Instead, you''ll find a .tar.gz file


    or an eclipse folder (because your web browser uncompressed the .gz part) or and
    parts.


    +   If you find a new .tar file or .tar.gz in your Downloads folder, double-click
    the file until you see the eclipse folder. Drag this new folder to your Applications
    folder, and you''re all set.


    +   If you download a .dmg file, your web browser may open the file for you. If
    not, find the .dmg file in your Downloads folder and double-click the file. Follow
    any instructions that appear after this double-click. You''re expected to drag
    Eclipse into your Applications folder, do so.'
