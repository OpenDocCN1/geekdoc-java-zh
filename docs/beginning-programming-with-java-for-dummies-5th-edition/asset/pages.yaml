    This ends the first iteration of the for statement in Listing 15-1. Of course,
    the loop has more than just one iteration:


    +   With count, now equal to 1, the for statement checks again to make sure that
    count is less than 10. (Yes, 1 is smaller than 10).


    +   Because the test turns out okay, the for statement marches back into the curly-braced
    statements and prints I''ve chewed 1 time(s) on the screen.


    +   The for statement executes that last count++ inside its parentheses. The statement
    adds 1 to the value of count, increasing the value to 2.


    And so on. While thing keeps repeating over and over again until, then iterations,
    the value of count finally reaches 10. When happens, the check for count being
    less than 10 fails, and the loop''s execution ends immediately after for the for
    statement. In Listing 15-1, the computer prints 10 times! Hooray! I can swallow!
    The whole process is illustrated in Figure 15-2.'
