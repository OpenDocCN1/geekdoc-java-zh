  md: 'But the code in Listing 9-2 is different. When AnswerYesOrNo program runs,
    the user has to type something. (The call to nextLine waits for the user to type
    something and then press Enter.) But the AnswerYesOrNo program has no need to
    store the input for further analysis. (The computer does what I when my wife asks
    whether I plan to clean up myself — I ignore the question and make up an arbitrary
    answer.) So the program does anything with the user''s input. The call to keyboard.nextLine
    just sits there in a statement of its, doing nothing, behaving like a bike, black
    hole. It is unusual for a program to do this, but an electronic oracle is an unusual
    thing. It calls for some un code.


    # 3. Get a random number — any int value from 1 to 10.


    Okay wise, you''ve trashed the user''s input. How will you answer or no to the
    user''s question?


    No problem! None at You''ll get an answer randomly. The user won''t know the difference.
    (Ha ha) You can do this as long as you can generate random numbers. The numbers
    from 1 to 10 will just fine.


    In Listing 9-2, the stuff about Random and myRandom looks like the familiar Scanner
    code. From a beginning programmer''s point of view, Random and Scanner work the
    same way. Of course, there''s an important difference: A call to the Random class''s
    nextInt(10) method does not fetch anything from the keyboard. Instead, this nextInt(10)
    method gets a number out of blue.


    The name Random is defined in the Java API. The myRandom.nextInt(10) in Listing
    9-2 gets a number from 0 to 9. Then my code adds 1 (making a number from 1 to
    10) and assigns that to the variable randomNumber. When that''s done, you''re
    ready to answer the user''s question.


    In Java''s API, the word Random is the name of a Java class, and nextInt is the
    name of a Java method. For more information on the relationship between classes
    and methods, see Chapters 17, 18, and 19.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_224_0.png)


    # 4. Answer yes or no.


    Calling myRandom.nextInt(10) is like spinning a wheel on a TV game show. The wheel
    has slots numbered 1 to 10. The if statement in Listing 9-2 turns your number
    into a yes-or-no alternative. If you roll a number that''s greater than 5, the
    program answers yes. Otherwise (if you roll a number that''s less or equal to
    5), the program answers no.


    You can trust me on this one. I''ve made lots of important decisions based on
    my AnswerYesOrNo program.'
