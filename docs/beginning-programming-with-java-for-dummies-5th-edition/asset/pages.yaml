  md: '# Foolish Assumptions


    In this book, I make a few assumptions about you, the reader. If one of the assumptions
    is incorrect, you''re probably okay. If all these assumptions are incorrect ...
    well, buy the book anyway.


    +   **I assume that you have access to a computer.** Here''s good news. You can
    run the code in this book on almost any computer. The only computers you can''t
    use to run this code are ancient things that are more than eight years old (give
    or a few years). You can run the latest version of Java on Windows, Macintosh,
    and Linux computers.


    +   **I assume that you can navigate your computer''s common menus and dialog
    boxes.** You don''t have to be a Windows, Linux, or Macintosh user, but you should
    be able to start a program, find a file, put a file into a certain directory —
    that of thing. Most of the time, you''ll practice the stuff in this book, you''re
    typing on your keyboard, not pointing and clicking the mouse.


    On rare occasions when you need to drag and drop, cut and paste, or plug and play,
    I guide you through the steps. But your computer can be configured in any billions
    of ways, and my instructions may not fit your special situation. When you reach
    one of these platform-specific tasks, trying the steps in this book. If the steps
    don''t fit you, send me an email or consult a book with instructions tailored
    to your system.


    +   **I assume that you can think logically.** That''s all there is to computer
    programming — thinking logically. If you can think logically, you''ve got it.
    If you don''t believe that you can think logically, read on. You may be pleasantly
    surprised.


    +   **I assume that you know little or nothing about programming.** This isn''t
    one of "all things to all people" books. I don''t please the novice while I tease
    the expert. I aim this book specifically toward the novice — the person who has
    never programmed a computer or has never felt comfortable programming a computer.
    If you''re one of these people, you''re reading the right book.


