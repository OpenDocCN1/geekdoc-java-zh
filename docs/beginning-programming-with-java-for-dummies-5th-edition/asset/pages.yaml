  md: '# A tool for creating code


    In the best of all possible worlds, you do all your program editing, documentation
    reading, and command issuing through one nice interface. This interface is called
    an integrated development environment (IDE).


    A typical IDE divides your screen''s work area into several panes — one for editing
    programs, another pane for listing the names of programs, a third pane for issuing
    commands, and other panes to help you compile and test programs. You can arrange
    the panes for quick access. Better yet, if you change the information in one pane,
    the IDE automatically updates the information in all the other panes.


    An IDE helps you move seamlessly from one part of the programming endeavor to
    another. With an IDE, you don''t have to worry about the mechanics of editing,
    compiling, and running a JVM. Instead, you can worry about the logic of writing
    programs. (Wouldn''t you know it? One way or another, you always have to worry
    about!)


    In the chapters that follow I describe basic features of the Eclipse IDE. Eclipse
    has many bells and whistles, but you can ignore most of them and learn to repeat
    a few routine steps. After using Eclipse in part, your brain automatically performs
    the routine steps. From then on, you can stop worrying about Eclipse and concentrate
    on Java programming.


    As you read my paragraphs about Eclipse, remember that Java and Eclipse aren''t
    wedded to one another. The programs in this book work with any IDE that can run
    Java. Instead of using Eclipse, you can use IntelliJ IDEA, NetBeans, BlueJ, or
    any other Java IDE. In fact, if you enjoy it, you can write and run this book''s
    programs without an IDE. You can use Notepad, TextEdit or vi, along with your
    operating system''s command prompt or Terminal. It''s all up to you.


    # What''s already on your hard drive?


    You may already have some of the tools you need for creating Java programs. On
    an older computer, your tools may be obsolete. Most of this book''s examples run
    on all versions of Java. But some examples don''t run on versions earlier than
    Java 5.0. Other examples run only on Java 6, Java 7, Java 8, or later.


    The safest bet is to download tools afresh. To get detailed instructions on doing
    downloads, see Chapter 2.'
