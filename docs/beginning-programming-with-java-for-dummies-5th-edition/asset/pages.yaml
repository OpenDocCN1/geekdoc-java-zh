    in my living room. They''re all staring at me because I have a big bag of gumballs
    in my hand. With 30 gumballs in the bag, the kids are all thinking, “Who''s the
    best? Who gets more gumballs than the others? And who is getting treated unfairly?”
    They insist on a complete, official gumball count, with each kid getting exactly
    the same number of tasty treats. I must be careful. If I''m not, I''ll never hear
    the end of it.'
