    \ of the enhanced for loop:\n\n```\nfor (TypeName variableName : RangeValues)\
    \ {\n    Statements\n}\n```\n\nHere's how the loop in Listing 15-5 follows the\
    \ format:\n\n> In Listing 15-5, the word Symbol is the name of the type.\nThe\
