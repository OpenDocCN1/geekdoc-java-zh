    TABLE 8-1


    | Operator Symbol | Meaning | Example |

    |---|---|--|

    | == | equal to | myGuess == winningNumber |

    | != | not equal to | 5 != numberOfCows |

    | < | is less than | strikes < 3 |

    | > | greater than | numberOfBoxtops > 1000 |

    | <= | less than or equal to | lowNumber + highNumber <= 25 |

    | >= | greater than or equal to | gumballsPerKid >= 10 |


    # Comparison Operators


    With the operators in Table 8-1, you can compare both numbers and characters.


