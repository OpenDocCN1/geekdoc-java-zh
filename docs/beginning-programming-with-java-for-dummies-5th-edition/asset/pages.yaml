    # Running code that straddles two separate files


    From Eclipse''s point of view, a project that contains two Java source files is
    no big deal. You create two classes in the same project, and you choose Run-As:
    Java Application. Everything works the way you expect it to work.


    The only times things become tricky when you have two main methods in the project.
    This section''s example (refer to Listings 17-2 and 17-3) doesn''t suffer from
    that malad. But as you experiment with your code, you can easily add classes with
    additional main methods. You may also create a large application with several
    starting points.


    When a project has more than one main method, Eclipse prompts you class main method
    you want to run. But sometimes Eclipse doesn''t prompt you. Instead, Eclipse arbitrarily
    picks one main method and ignores the others. This can be confusing. You add a
    println call to the wrong main method, and nothing appears in the Console view.
    Hey, what gives?


    You can fix the problem by following these steps:


    +   1. Expand the project''s branch in the Package Explorer.

    2. Expand the src folder within the project''s branch.

    3. Expand the (default package) branch within the src branch.


    The (default package) branch contains .java files.'
