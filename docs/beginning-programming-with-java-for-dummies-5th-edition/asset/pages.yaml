    # Views, editors, and other stuff


    The next bunch of editors deals with things called views, editors, and tabs.


    You may have difficulty understanding the difference between views and editors.
    (A view is like an editor, which is like a view, or something like that.) If views
    and editors seem the same to you and you''re not sure that you can tell which
    is which, don''t be upset. As an ordinary Eclipse user, the distinction between
    views and editors comes naturally as you gain experience using the workbench.
    You rarely have to decide whether the thing you''re using is a view or an editor.


    > TIP


