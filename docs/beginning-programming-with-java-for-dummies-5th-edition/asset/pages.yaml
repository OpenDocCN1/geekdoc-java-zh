  md: 'Window: A copy of the Eclipse workbench. With Eclipse, you can have several
    copies of the workbench open at once. Each copy appears in its own window.


    Action: A choice that''s offered to you - typically, when you click something.
    For example, when you click File: New Project on Eclipse''s main menu bar, you
    see a list of new things that you can create. The list usually includes Project,
    Folder, File, and Other, but it may also include things like Package, Class, and
    Interface. Each of these (item on the menu) is an action.


    ![](img/8e09247dec29cb1986bf1f8d64f5812d_87_0.png)


