  uxxxx` | 十六进制 Unicode 字符 (xxxx) |\n\n# 第 7 章：变量\n\n当声明一个变量时，它为用户提供了一个命名的存储空间，程序可以对其进行操作。在\
  \ Java 中，每个变量都有特定的类型，类型反过来决定了该变量内存的布局和大小、可以在该变量上执行的操作，以及其中可以存储的最大和最小值。\n\n始终记住，在使用变量之前应该对其声明。基本的变量声明形式如下：\n\
  \n`数据类型 变量 [ = 值][, 变量 [= 值] ...] ;`\n\n在上面的示例中，`data type` 是 Java 的数据类型，变量名是 `variable`。如果你想声明多个相同数据类型的变量，可以使用逗号（`,`）来分隔列表。\n\
  \n以下是关于变量声明和变量初始化的示例。\n\n```java\nint a, b, c;        // 声明了三个 int：a, b 和 c。\nint\
  \ a = 10, b = 10;  // 初始化示例\nbyte B = 22;        // 初始化一个字节类型的变量 B。\ndouble pi =\
  \ 3.14159; // 声明并分配 PI 的值。\nchar a = 'a';        // char 变量 a 初始化为 'a'\n```\n\n\
  在本主题中，我们将查看 Java 中可用的各种变量。在 Java 中，有三种类型的变量。\n\n* 局部变量\n* 实例变量\n* 类/静态变量\n\n## 局部变量\n\
  \n* 局部变量是在块、方法或构造函数内部声明的变量。\n* 局部变量仅在其所在的块、方法或构造函数存在时才有效。一旦离开块、方法或构造函数，局部变量将被销。\n\
  * 我们不能在局部变量上使用访问修符。\n* 局部变量只能在声明它的块或方法或构造函数内部可见。\n* 在内部，局部变量的实现是在栈级别完成的。\n* 由于局部变量没有默认值，因此在使用它们之前应该通过声明来为其赋值。\n\
  \n以下是一个使用局部变量的示例。\n\n示例：\n在这里，`age` 是局部变量。它在 `pupAge()` 方法内部定义，其作用域仅限于该方法。\n\n```java\n\
  public class Test{\n  public void pupAge(){\n    int age = 0;\n    age = age + 7;\n\
  \    System.out.println(\"Puppy age is : \" + age);\n  }\n  public static void main(String\
  \ args[]){\n    Test test = new Test();\n    test.pupAge();\n  }\n}\n```\n\n上述代码将产生以下输出：\n\
  `Puppy age is: 7`\n\n示例：\n在下面的示例中，我们在没有进行初始化的情况下使用了 `age` 变量。因此在编译期间会导致错误。\n\n```java\n\
  public class Test{\n  public void pupAge(){\n    int age;\n    age = age + 7;\n\
  \    System.out.println(\"Puppy age is : \" + age);\n  }\n  public static void main(String\
  \ args[]){\n    Test test = new Test();\n    test.pupAge();\n  }\n}\n```\n上述代码将产生错误：\n\
  `Test.java: variable age might not been initialized`\n\n## 实例变量\n\n* 实例变量是在类内部但在任何方法之外声明的变量。\n\
  * 可以从实例变量创建任意数量的对象，但每个对象只有一个实例变量。\n* 实例变量在分配对象内存时创建。\n* 实例变量的可见性与静态变量相似。然而，静态变量定义在整个类中。\n\
  * 数字类型的默认值为 0，布尔类型为 false，对象引用的默认值为 NULL。\n* 值只能在声明期间或构造函数内部赋值给实例变量。\n\n这是一个示例。\n\
  \n示例：\n```java\nimport java.io.*;\n\npublic class Employee{\n  public String name;\n\
  \  private double salary;\n\n  public Employee (String empName){\n    name = empName;\n\
  \  }\n\n  public void setSalary(double empSal){\n    salary = empSal;\n  }\n\n \
  \ public void printEmp(){\n    System.out.println(\"name : \" + name );\n    System.out.println(\"\
  salary :\" + salary);\n  }\n\n  public static void main(String args[]){\n    Employee\
  \ empOne = new Employee(\"Ransika\");\n    empOne.setSalary(1000);\n    empOne.printEmp();\n\
  \  }\n}\n```\n\n程序将产生以下输出：\n`name : Ransika`\n`salary :1000.0`\n\n## 类/静态变量\n\n\
  * 类变量也称为静态变量。这些变量在类内部使用 `static` 关键字声明，但在任何块、构造函数或方法之外。\n* 可以从类变量创建任意数量的对象，但每个类只有一个类变量。\n\
  * 类变量在程序启动期间创建，并在程序结束时销毁。\n* 类变量的可见性与实例变量相似。然而，静态变量通常声明为 public，以便该类的其他用户可以使用它们。\n\
  * 数字类型的默认值为 0，布尔类型为 false，对象引用的默认值为 NULL。\n* 值只能在声明期间或构造函数内部赋值给静态变量。如果你想添加更多值，可以使用特殊的静态初始化块进行赋值。\n\
  \n\n\n\n\n*   通过类名调用静态变量来访问它们。语法：`ClassName.VariableName`。\n\n这是一个使用静态变量的示例。\n\n\
  ```java\nimport java.io.*;\n\npublic class Employee{\n\n  // salary 变量是一个私有静态变量\n\
  \  private static double salary;\n\n  // DEPARTMENT 是一个常量\n  public static final\
  \ String DEPARTMENT = \"Development \";\n\n  public static void main(String args[]){\n\
  \    salary = 1000;\n    System.out.println(DEPARTMENT+\"average salary:\"+salary);\n\
  \  }\n}\n```\n\n该程序将产生以下输出。\n\nDevelopment average salary:1000\n\n## 修饰符 (Modifiers)\n\
  \n在某些情况下，你可能需要更改某些定义的含义。在这种情况下，你可以使用修饰符。修饰符本身是指用于更改定义含义的关键字。在 Java 中，有很多修饰符，包括以下两种。\n\
  \n*   [Java 访问修饰符](http://www.tutorialspoint.com/java/java_access_modifiers.htm)\n\
  *   [非访问修饰符](http://www.tutorialspoint.com/java/java_nonaccess_modifiers.htm)\n\n\
  要使用修饰符，你应该在变量、方法或类的定义中包含关键字。修饰符应该像下面示例所示，放在语句的开头。它们以斜体形式给出。\n\n```java\npublic class\
  \ className {\n  // ...\n}\n\nprivate boolean myFlag;\n\nstatic final double weeks\
  \ = 9.5;\n\nprotected static final int BOXWIDTH = 42;\n\npublic static void main(String[]\
  \ arguments) {\n  // 方法体\n}\n```\n\n### 访问控制修饰符 (Access Control Modifiers)\n\n为了给构造函数、变量、类和方法设置访问级别，Java\
  \ 为用户提供了一组访问修饰符。Java 中四种访问级别。它们是：\n\n*   对包可见，默认级别。不需要修饰符。\n*   仅对类可见（`private`）。\n\
  *   所有人可见（`public`）。\n*   对包和所有子类可见（`protected`）。\n\n### 非访问修饰符 (Non Access Modifiers)\n\
  \n在 Java 中有很多非访问修饰符。\n\n*   `static` 修饰符用于创建类变量和方法。\n*   为了确定变量、类和方法的最终实现，我们使用 `final`\
  \ 修饰符。\n*   你可以通过 `abstract` 修饰符创建抽象类和抽象方法。\n*   为了处理线程，我们使用 `volatile` 和 `synchronized`\
  \ 修饰符。\n\n# 第 8 章：运算符 (Operators)\n\n在编程过程中，你可能不断需要操作变量，为此，Java 为用户提供了一组运算符。所有运算符可以分为以下几组。\n\
  \n*   算术运算符\n*   关系运算符\n*   位运算符\n*   逻辑运算符\n*   赋值运算符\n\n## 算术运算符 (The Arithmetic\
  \ Operators)\n\n算术运算符用于处理数学表达式。所有的算术运算符都列在下表中。\n\n在这里，我们假设变量 `A` 的值为 5，变量 `B` 的值为\
  \ 10。那么以下表达式的结果如下：\n\n| Operator | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `+` | 加法\
  \ - 将运算符两侧的值相加 | `A + B` 将得到 15 |\n| `-` | 减法 - 从左侧操作数中减去右侧操作数 | `A - B` 将得到 -5\
  \ |\n| `*` | 乘法 - 将运算符两侧的值相乘 | `A * B` 将得到 50 |\n| `/` | 除法 - 将左侧操作数除以右侧操作数 | `B\
  \ / A` 将得到 2 |\n| `%` | 取模 - 将左侧操作数除以右侧操作数并返回余数 | `B % A` 将得到 0 |\n| `++` | 自增 -\
  \ 将操作数的值加 1 | `B++` 得到 11 |\n| `--` | 自减 - 将操作数的值减 1 | `B--` 得到 9 |\n\n## 关系运算符\
  \ (The Relational Operators)\n\nJava 支持以下关系运算符。\n\n假设变量 `A` 的值为 1，变量 `B` 的值为 2，那么：\n\
  \n| Operator | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `==` | 此运算符将比较两个操作数并检查它们是否相等。如果它们相等，则返回真值。\
  \ | |\n| `!=` | 此运算符将比较两个操作数并检查它们是否相等。如果它们不相等，则返回真值。 | |\n| `>` | 此运算符将比较两个操作数并检查它们是否相等。如果前者大于后者，则返回真值。\
  \ | |\n| `<` | 此运算符将比较两个操作数并检查它们是否相等。如果前者小于后者，则返回真值。 | |\n| `>=` | 此运算符将比较两个操作数并检查它们是否相等。如果前者大于或等于后者，则返回真值。\
  \ | |\n| `<=` | 此运算符将比较两个操作数并检查它们是否相等。如果前者小于或等于后者，则返回真值。 | |\n\n## 位运算符 (The Bitwise\
  \ Operators)\n\n在 Java 中有很多非访问修饰符。位运算符在 `byte`、`short`、`int`、`long` 和 `char` 上运行。\n\
  \n| Operator | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `&` | 二与运算符，如果位在两者中存在，则复制该位。\
  \ | |\n| `\\|` | 二或运算符，如果位在其中任一个存在，则复制该位。 | |\n| `^` | 二异异运算符，如果位在其中一个中存在，则复制该位。\
  \ | |\n| `~` | 二取反运算符，单目运算符，效果是翻转位。 | |\n| `<<` | 二左移运算符。左侧操作数的值向左移动位数。 | |\n| `>>`\
  \ | 二右移运算符。左侧操作数的值向右移动位数。 | |\n| `>>>` | 无符号右移运算符。左侧操作数的值向右移动位数，并填充零。 | |\n\n##\
  \ 逻辑运算符 (The Logical Operators)\n\n这里是 Java 中所有逻辑运算符的列表。假设 `A` 和 `B` 是 `Boolean`\
  \ 变量。`A` 持有 `true`，B` 持有 `false`。那么：\n\n| Operator | 描述 | 示例 |\n| :--- | :--- |\
  \ :--- |\n| `&&` | 此称为与运算符，如果两个操作数都持有非零值，则返回真。 | `A && B` 为假。 |\n| `\\|\\|` | 此称为或运算符，如果两个操作数中任一持有非零值，则返回真。\
  \ | `A \\|\\| B` 为真。 |\n| `!` | 此称为逻辑非运算符，用于反转其所用操作数的当前逻辑状态。 | `!(A && B)` 为真。 |\n\
  \n## 赋值运算符 (The Assignment Operators)\n\nJava 支持的所有赋值运算符列表如下表所示。\n\n| Operator |\
  \ 描述 | 示例 |\n| :--- | :--- | :--- |\n| `=` | 这是一个简单的赋值运算符，将右操作数的值赋值给左侧操作数。 | `C\
  \ = A + B` 将 `A + B` 的值赋值给 `C` |\n| `+=` | 这是加赋值运算符。此运算符将两个操作数相加并将结果赋值给左侧操作数。 |\
  \ `C += A` 等同于 `C = C + A` |\n| `-=` | 这是减赋值运算符。此运算符从左侧操作数中减去右侧值并将结果赋值给左侧操作数。 |\
  \ `C -= A` 等同于 `C = C - A` |\n\n\n\n\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :---\
  \ |\n| `*=` | 这是乘法赋值运算符。它将两个操作数相乘，并将结果赋值给左操作数。 | `C *= A` 等同于 `C = C * A` |\n| `/=`\
  \ | 这是除赋值运算符。该运算符将左操作数除以右操作数。得到的结果将赋值给左操作数。 | `C /= A` 等同于 `C = C / A` |\n| `%=`\
  \ | 这是取模赋值运算符。该运算符取两个操作数的模并将结果赋值给左操作数。 | `C %= A` 等同于 `C = C % A` |\n| `<<=` | 左移赋值运算符\
  \ | `C <<= 2` 等于 `C = C << 2` |\n| `>>=` | 右移赋值运算符 | `C >>= 2` 等于 `C = C >> 2` |\n\
  | `&=` | 位与赋值运算符 | `C &= 2` 等于 `C = C & 2` |\n| `^=` | 位异或赋值运算符 | `C ^= 2` 等于 `C\
  \ = C ^ 2` |\n| `|=` | 位或赋值运算符 | `C |= 2` 等于 `C = C | 2` |\n\n### Java 运算符的优先级\n\
  \n给定表达式中项的分组将由运算符优先级决定。某些运算符的优先级高于其他运算符。例如，与加法运算符相比，乘法运算符的优先级总是更高的。优先级高的运算符将先执行。\n\
  \n下面列出了按照优先级排序的所有运算符列表。优先级较高的运算符位于顶部，并按递减顺序向下排列。\n\n| 类别 | 运算符 | 结合性 |\n| :--- |\
  \ :--- | :--- |\n| 后置 | `() []` `.` (点运算符) | 从左到右 |\n| 一元 | `++ - - ! ~` | 从右到左\
  \ |\n| 乘法 | `* / %` | 从左到右 |\n| 加法 | `+ -` | 从左到右 |\n| 移位 | `>> >>> <<` | 从左到右 |\n\
  | 关系 | `> >= < <=` | 从左到右 |\n| 等于 | `== !=` | 从左到右 |\n| 位与 | `&` | 从左到右 |\n| 位异异\
  \ | `^` | 从左到右 |\n| 位或 | `|` | 从左到右 |\n| 逻辑与 | `&&` | 从左到右 |\n| 逻辑或 | `||` | 从左到右\
  \ |\n| 条件 | `?:` | 从右到左 |\n| 赋值 | `= += -= *= /= %= >>= <<= &= ^= \\||` | 从右到左 |\n\
  | 逗号 | `,` | 从左到右 |\n\n# 第 9 章：条件语句\n\nJava 为用户提供了两种类型的决策语句。它们是：\n\n- `if` 语句\n\
  - `switch` 语句\n\n### if 语句\n\nJava 中的 `if` 语句由一个布尔语句组成。布尔语句将包含一个或多个语句。如果满足条件，这些语句将执行执行。\n\
  \n这里是 `if` 语句的语法。\n\n语法：\n\n```\nif(Boolean_expression)\n{\n  // 如果布尔表达式为真，则执行这些语句\n\
  }\n```\n\n`if` 语句内部的代码块只有在布尔表达式返回真时才会执行。如果返回假，控制流将跳转到 `if` 语句之后的代码。这里有一个示例：\n\n\
  示例：\n\n```java\npublic class Test {\n  public static void main(String args[]){\n\
  \    int x = 10;\n    if( x < 20 ){\n      System.out.print(\"This is if statement\"\
  );\n    }\n  }\n}\n```\n\n程序将给出以下输出。\n\nThis is if statement\n\n### if...else 语句\n\
  \n在 `if` 语句之后，你可以添加一个可选的 `else` 语句。如果 `if` 语句不满足，则执行 `else` 语句中的代码。所以简单来说，如果 `if`\
  \ 语句返回假，将执行 `else` 语句中的代码。\n\n语法：\n\n这里是 `if...else` 语句的语法。\n\n```java\nif(Boolean_expression){\n\
  \  // 当布尔表达式为真时执行\n}else{\n  // 当布尔表达式为假时执行\n}\n```\n\n示例：\n\n```java\npublic class\
  \ Test {\n  public static void main(String args[]){\n    int x = 30;\n    if( x\
  \ < 20 ){\n      System.out.print(\"This is if statement\");\n    }else{\n     \
  \ System.out.print(\"This is else statement\");\n    }\n  }\n}\n```\n\n这段代码将给出以下输出。\n\
  \nThis is else statement\n\n### if...else if...else 语句\n\n在 `if` 语句之后，可以添加可选的 `else\
  \ if`.... else` 语句。这种语句在需要测试各种条件的情况下被证明非常有用。\n\n在使用 `if`、`else if` 和 `else` 语句时，有几点需要记住：\n\
  \n- `if` 条件可以有任意数量的 `else` 条件，且 `else` 条件应该始终放在最后。\n- `if` 语句后面可以跟接任意数量的 `else if`\
  \ 语句。\n- 一旦 `else if` 语句满足条件，则在 `else` 语句之前。\n\n语法：\n\n`if...else` 的语法如下：\n\n```java\n\
  if(condition_1){\n  // 当条件 1 为真时执行\n}else if(condition_2){\n  // 当条件 2 为真时执行\n}else\
  \ if(condition_3){\n  // 当条件 3 为真时执行\n}else{\n  // 当以上都不满足时执行\n}\n```\n\n示例：\n\n\
  ```java\npublic class Test {\n  public static void main(String args[]){\n    int\
  \ x = 30;\n    if( x < 20 ){\n      System.out.print(\"This is if statement\");\n\
  \    }else if( x == 20 ){\n      System.out.print(\"This is else statement\");\n\
  \    }else if( x == 30 ){\n      System.out.print(\"Value of 30\");\n    }else{\n\
  \      System.out.print(\"This is else\");\n    }\n  }\n}\n```\n\n上面的代码将产生：\nValue\
  \ of 30\n\n### 嵌套 if...else 语句\n\n嵌套 `if...else` 是另一个 `if` 语句内部。如果一个语句包含了另一个 `if`\
  \ 语句，则它是嵌套的。\n\n语法：\n\n```java\nif(condition_1){\n  if(condition_2){\n    // 嵌套代码\n\
  \  }\n}\n```\n\n示例：\n\n```java\npublic class Test {\n  public static void main(String\
  \ args[]){\n    int x = 30;\n    int y = 10;\n    if( x == 30 ){\n      if( y ==\
  \ 10 ){\n        System.out.print(\"X = 30 and Y = 10\");\n      }\n    }\n  }\n\
  }\n```\n\n### switch 语句\n\nSwitch 语句用于与给值列表进行等性测试。这些值每一个被称为 `case`。变量将与每个 `case`\
  \ 进行比较并测试。\n\n这里有一个示例。\n\n```java\nswitch(expression){\n  case value :\n    // 语句\n\
  \    break; // 可选\n  case value :\n    // 语句\n    break; // 可选\n  default : // 可选\n\
  \    // 语句\n}\n```\n\n以下规则适用于 switch 语句：\n\n- `byte`、`short`、`int` 和 `char` 是可以用于\
  \ `switch` 语句的唯一变量类型。\n- `switch` 语句的 `case` 语句数量不限于一个。它可以有多个 `case` 语句，且没有限制。每个\
  \ `case` 都有一个与其进行比较的值并在末尾有一个冒号。\n- switch 变量和 `case` 的值应该是相同的数据类型。\n- switch 变量和\
  \ `case` 的数据类型应该是字面量或常量。\n- 如果 switch 变量和 `case` 相等，则 `case` 之后的语句将继续执行，直到控制流找到\
  \ `break` 语句。\n- 控制流到达 `break` 语句后，switch 终止。现在控制流将跳转到 switch 语句之后的后续行。\n\n\n\n\n\
  \n-   `case` 并不强制包含 `break`。如果没有提供 `break`，控制将继续执行后续的 case，直到遇到 `break` 为止。\n- \
  \  你可以为给定的 `switch` 语句添加一个可选的 `default` case。这个 `case` 选项 应该是 `switch` 的最后一行。如果上述任一\
  \ case 都不满足条件，将执行此 `default` case。当使用 `default` case 时，不需要添加 `break`。\n\n这里是一个示例。\n\
  \n示例：\n\n```java\npublic class Test {\n\n  public static void main(String args[]){\n\
  \    //char grade = args[0].charAt(0);\n    char grade = 'C';\n    switch(grade)\n\
  \    {\n        case 'A' :\n            System.out.println(\"Excellent!\");\n  \
  \          break;\n        case 'B' :\n        case 'C' :\n              System.out.println(\"\
  Well done\");\n              break;\n        case 'D' :\n              System.out.println(\"\
  You passed\");\n        case 'F' :\n              System.out.println(\"Better try\
  \ again\");\n              break;\n        default :\n              System.out.println(\"\
  Invalid grade\");\n    }\n    System.out.println(\"Your grade is \" + grade);\n\
  \  }\n}\n```\n\n使用各种命令行参数编译并运行程序将得到以下输出。\n\n```\n$ java Test\nWell done\nYour grade\
  \ is a C\n$\n```\n\n# 第 10 章：异常\n\n异常可以定义为中断正常执行流的问题。简单来说，它可以被定义为程序执行期间发生的问题。导致异常发生的原因有很多，其中一些包括：\n\
  \n*   传递了非法数据。\n*   Java 虚拟机内存耗尽。\n*   通信期间网络连接终止。\n*   找不到所需的文件。\n\n某些异常是由人为错误引起的，另一些是由程序员错误引起的，其余的由于物理资源的故障。\n\
  \n在 Java 中，异常分为三类。为了让你理解异常处理的概念，你应该了解异常的类型。不同类别的异常如下：\n\n*   **检查型异常 (Checked exceptions)**：如果一个异常无法被程序员预见，或者它是典型的用户错误，则可以定义为检查型异常。检查异常在编译期间不能被忽略。\n\
  *   **运行时异常 (Runtime exceptions)**：运行时异常可以定义为程序员可能解决的异常。与检查型异常不同，运行时异常在编译期间会被忽略。\n\
  *   **错误 (Errors)**：错误可以定义为用户或程序员无法控制的问题。这些不能被视为异常。错误通常会被忽略，因为它们无法被解决。例如，在栈溢出的情况下会抛出一个错误。该错误在程序编译期间会被忽略。\n\
  \n下面是最常见的检查型和未检查型异常列表。所有这些异常都是 [Java 内置异常](http://www.tutorialspoint.com/java/java_builtin_exceptions.htm)\
  \ 的子集。\n\n## 异常方法\n\n下面是从 `throwable` 类提供的所有重要方法的列表。\n\n| SN | 方法描述 |\n| :--- |\
  \ :--- |\n| 1 | `public String getMessage()` 此方法将返回关于所发生异常的详细信息，并在构造函数 `Throwable`\
  \ 内部初始化。 |\n| 2 | `public Throwable getCause()` 此方法将返回导致异常的原因，这由一个 `Throwable` 对象表示。\
  \ |\n| 3 | `public String toString()` 此方法将返回类名与 `getMessage()` 结果的拼接字符串。 |\n| 4\
  \ | `public void printStackTrace()` 此方法将 `toString()` 的结果结合堆栈树打印到错误输出流 `System.err`。\
  \ |\n| 5 | `public StackTraceElement [] getStackTrace()` 此方法将返回一个包含给定栈跟踪上每个元素的数组。索引\
  \ 0 处的元素代表给定调用栈顶部的起始，而索引 0 处的方法... |\n| 6 | `public Throwable fillStackTrace()`\
  \ 使用此方法可以用当前信息填充栈跟踪。 |\n\n## 捕获异常\n\n在 Java 中，可以使用 `try` 和 `catch` 关键字捕获异常。如果 `try`\
  \ 块中出现异常，它将传递给 `catch` 块。\n\n语法：\n\n```java\ntry {\n    // code\n} catch (Exception\
  \ e) {\n    // catch block\n}\n```\n\n示例：\n\n```java\nimport java.io.*;\n\npublic\
  \ class Test {\n  public static void main(String args[]) {\n    try {\n      int\
  \ a[] = new int[2];\n      System.out.println(a[3]);\n    } catch (ArrayIndexException\
  \ e) {\n      System.out.println(\"Exception: \" + e);\n    }\n  }\n}\n```\n输出：\n\
  ```\nException: java.lang.ArrayIndexException: 3\n```\n\n### 多个块\n\n`try` 块后的 `catch`\
  \ 块数量不限于 1。你可以有任意数量的 `catch` 块。在实际情况下，你将不得不编写多个 `catch` 块。\n\n语法：\n\n```java\ntry\
  \ {\n    // code\n} catch (ExceptionType1 e1) {\n    // catch block\n} catch (ExceptionType2\
  \ e2) {\n    // catch block\n} catch (ExceptionType3 e3) {\n    // catch block\n\
  }\n```\n\n如果抛出的异常匹配 `ExceptionType1`，它将在那里被捕获。如果异常类型不匹配，它将传递给下一个 `catch` 块。这一过程一直持续到抛出的异常被捕获或所有\
  \ `catch` 块结束。\n\n示例：\n\n在代码段中，我们将查看多个 `try/catch` 块。\n\n```java\ntry {\n    file\
  \ = new FileInputStream(fileName);\n    x = (byte) file.read();\n} catch (IOException\
  \ i) {\n    i.printStackTrace();\n    return -1;\n} catch (FileNotFoundException\
  \ f) //无效！\n{\n    f.printStackTrace();\n    return -1;\n}\n```\n\n示例 2：\n\n```java\n\
  package com.myjava.exceptions;\n\nimport java.net.MalformedURLException;\nimport\
  \ java.net.URL;\n\npublic class MyCatchBlocks {\n  public static void main(String\
  \ a[]) {\n    MyCatchBlocks mmcb = new MyCatchBlocks();\n    mmcb.execute(1);\n\
  \    mmcb.execute(2);\n  }\n\n  public void execute(int i) {\n    try {\n      if\
  \ (i == 1) {\n        getIntValue(\"7u\");\n      } else {\n        getUrlObj(\"\
  www.junksite.com\");\n      }\n    } catch (NumberFormatException nfe) {\n     \
  \ System.out.println(\"Inside NumberFormatException... \" + nfe.getMessage());\n\
  \    } catch (MalformedURLException mue) {\n  }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(\"\
  Inside MalformedURLException... \"+mue.getMessage());\n} catch (Exception ex) {\n\
  \    System.out.println(\"Inside Exception... \"+ex.getMessage());\n}\n}\n\npublic\
  \ int getIntValue(String num) {\n    return Integer.parseInt(num);\n}\n\npublic\
  \ URL getUrlObj(String urlStr) throws MalformedURLException {\n    return new URL(urlStr);\n\
  }\n```\n\n### throw/throws 关键字\n\n如果给定的方法没有处理指定的检查异常（checked exception），则必须使用 `throws`\
  \ 关键字进行声明。该关键字用于方法签名的末尾。\n\n使用 `throw` 关键字可以处理新实例化的异常或刚刚捕获的异常。`throw` 和 `throws`\
  \ 关键字之间存在区别。\n\n在下面的示例中，方法将抛出 `RemoteException`。\n\n```java\nimport java.io.*;\n\
  \npublic class className {\n    public void deposit(double amount) throws RemoteException\
  \ {\n        // 方法实现\n        throw new RemoteException();\n    }\n    // 类定义的剩余部分\n\
  }\n```\n\n一个方法可以声明抛出多个异常，在这种情况下，异常在用逗号分隔的列表中声明。例如，下面的方法声明它会抛出一个 `RemoteException`\
  \ 和一个 `InsufficientFundsException`：\n\n```java\nimport java.io.*;\n\npublic class\
  \ className {\n    public void withdraw(double amount) throws RemoteException, InsufficientFundsException\
  \ {\n        // 方法实现\n    }\n    // 类定义的剩余部分\n}\n```\n\n### finally 关键字\n\n`finally`\
  \ 关键字用于创建一个跟在 `try` 块之后的代码块。无论是否发生异常，`finally` 块的代码始终会被执行。\n\n使用 `finally` 块允许你运行任何想要执行的清理类型语句，无论受保护的代码发生了什么情况。\n\
  \n`finally` 块出现在 `catch` 块的末尾，其语法如下：\n\n```java\ntry {\n    // 受保护的代码\n} catch(ExceptionType1\
  \ e1) {\n    // 捕获块\n} catch(ExceptionType2 e2) {\n    // 捕获块\n} catch(ExceptionType3\
  \ e3) {\n    // 捕获块\n} finally {\n    // finally 块始终执行。\n}\n```\n\n示例：\n\n```java\n\
  public class ExcepTest{\n    public static void main(String args[]) {\n        int\
  \ a[] = new int[2];\n        try {\n            System.out.println(\"Access element\
  \ three :\" + a[3]);\n        } catch(ArrayIndexOutOfBoundsException e) {\n    \
  \        System.out.println(\"Exception thrown :\" + e);\n        } finally {\n\
  \            a[0] = 6;\n            System.out.println(\"First element value: \"\
  \ +a[0]);\n            System.out.println(\"The finally statement is executed\"\
  );\n        }\n    }\n}\n```\n\n这将会产生以下结果：\nException thrown :java.lang.ArrayIndexOutOfBoundsException:\
  \ 3\nFirst element value: 6\nThe finally statement is executed\n\n注意以下几点：\n- 没有\
  \ `try` 语句就不会有 `catch` 子句。\n- 当存在 `try/catch` 块时，并不强制要求有 `finally` 子句。\n- 没有 `catch`\
  \ 子句或 `finally` 子句，就没有 `try` 块。\n- `try`、`catch`、`finally` 块之间不能存在任何代码。\n\n这里是更多关于异常处理的示例。\n\
  \n**示例 1：Try- Catch 块**\n\n```java\npackage com.myjava.exceptions;\n\npublic class\
  \ MyExceptionHandle {\n    public static void main(String a[]) {\n        try {\n\
  \            for(int i=5;i>=0;i--) {\n                System.out.println(10/i);\n\
  \            }\n        } catch(Exception ex) {\n            System.out.println(\"\
  Exception Message: \"+ex.getMessage());\n            ex.printStackTrace();\n   \
  \     }\n        System.out.println(\"After for loop...\");\n    }\n}\n```\n\n输出：\n\
  ```\n2\n2\n3\n5\n10\nException Message: / by zero\njava.lang.ArithmeticException:\
  \ / by zero\n    at com.myjava.exceptions.MyExceptionHandle.main(MyExceptionHandle.java:12)\n\
  After for loop…\n```\n\n**示例 2：Throws 子句**\n\n```java\npackage com.myjava.exceptions;\n\
  \npublic class MyThrowsClause {\n    public static void main(String a[]) {\n   \
  \     MyThrowsClause mytc = new MyThrowsClause();\n        try {\n            for(int\
  \ i=0; i<5; i++) {\n                mytc.getJunk();\n                System.out.println(i);\n\
  \            }\n        } catch (InterruptedException iex) {\n            iex.printStackTrace();\n\
  \        }\n    }\n    public void getJunk() throws InterruptedException {\n   \
  \     Thread.sleep(1000);\n    }\n}\n```\n\n**示例 3：Throw 子句**\n\n```java\npackage\
  \ com.myjava.exceptions;\n\npublic class ExplicitThrow {\n    public static void\
  \ main(String a[]) {\n        try {\n            ExplicitThrow met = new ExplicitThrow();\n\
  \            System.out.println(\"length is \"+met.getStringSize(null));\n     \
  \   } catch (Exception ex) {\n            System.out.println(\"Exception: \"+ex.getMessage());\n\
  \        }\n    }\n    public int getStringSize(String str) throws Exception {\n\
  \        if(str == null) {\n            throw new Exception(\"String is null\");\n\
  \        }\n        return str;\n    }\n}\n```\n\n### 自定义异常\n\n你可以在 Java 中创建自己的异常。记住以下几点：\n\
  - 所有异常必须是 `Throwable` 的子类。\n- 如果你想写检查异常，继承 `Exception`。\n- 如果你想写运行时异常，继承 `RuntimeException`。\n\
  \n示例：\n\n```java\nclass InsufficientFunds extends Exception {\n    private double\
  \ amount;\n    InsufficientFunds(double amount) {\n        amount = amount;\n  \
  \  }\n    public double getAmount() {\n        return amount;\n    }\n}\n```\n\n\
  为了演示使用自定义异常，下面的 `CheckingAccount` 类包含一个抛出 `InsufficientFunds` 的 `withdraw` 方法。\n\
  \n```java\nimport java.io.*;\n\npublic class CheckingAccount {\n    private double\
  \ balance;\n    private int number;\n    CheckingAccount(int number) {\n       \
  \ this.number = number;\n    }\n    public void deposit(double amount) {\n     \
  \   balance += amount;\n    }\n    public void withdraw(double amount) throws InsufficientFunds\
  \ {\n        if(amount <= balance) {\n            balance -= amount;\n        }\
  \ else {\n            double needs = amount - balance;\n            throw new InsufficientFunds(needs);\n\
  \        }\n    }\n    public double getBalance() {\n        return balance;\n \
  \   }\n    public int getNumber() {\n        return number;\n    }\n}\n```\n\n在下面的程序\
  \ `BankDemo` 中，`deposit()` 和 `withdraw()` 方法将被调用。它们属于 `CheckingAccount`。\n\n```java\n\
  public class BankDemo {\n    public static void main(String args) {\n        CheckingAccount\
  \ c = new CheckingAccount(101);\n        System.out.println(\"Depositing $500...\"\
  );\n        c.deposit(500.00);\n        try {\n            System.out.println(\"\
  \\nWithdrawing $100...\");\n            c.withdraw(100.00);\n            System.out.println(\"\
  \\nWithdrawing $600...\");\n            c.withdraw(600.00);\n        } catch(InsufficientFunds\
  \ e) {\n            System.out.println(\"Sorry, but you are short $\" + e.getAmount());\n\
  \            e.printStackTrace();\n        }\n    }\n}\n```\n\n\n\n\n编译上述文件并运行 `BankDemo`\
  \ 将得到如下输出。\n\n```\nDepositing $500...\nWithdrawing $100...\nWithdrawing $600...\n\
  Sorry, but you are short $200.0\nInsufficientFundsException\n       at CheckingAccount.withdraw(CheckingAccount.java:25)\n\
  \       at BankDemo.main(BankDemo.java:13)\n```\n\n## 常见异常\n\n在 Java 中有两种类型的错误和异常。它们是：\n\
  \n- JVM 异常：JVM 异常本质上是由 Java 虚拟机逻辑上或排他性抛出的异常错误。例如：`ArrayIndexOutOfBoundsException`、`NullPointerException`、`ClassCastException`\
  \ 等。\n- 程序异常：程序化异常可以定义为由 API 或应用程序抛出的异常。例如：`IllegalStateException`、`IllegalArgumentException`\
  \ 等。\n\n# 第 11 章：如何安装 Java\n\n现在你已经了解了 Java 的组成部分，是时候在你的电脑上安装它并查看如何实际使用它了。你需要一台运行\
  \ Windows、Linux、OS X 或 Solaris 的电脑或笔记本电脑。\n\n## 如何在 Windows 上安装 Java\n\n在 Windows\
  \ 上，你可以通过在线或离线方式下载并安装 Java。\n\n### 在线\n\n在线下载 Java 将下载一个“从网络安装”（IFTW）的可执行文件，这需要你进行最少的干预。运行此程序将允许从网络获取所有所需文件，因此在整个安装过程中保持网络连接非常重要。\n\
  \n- 你需要管理员权限才能将 Java 安装到 Microsoft Windows 上\n- 如果在使用此方法遇到任何问题，请尝试离线方法，我将在稍后详细介绍。\n\
  \n### 安装\n\n- 适用于 Windows 2008 Server、7、8/8.1、XP、Server 2012、Vista、Windows 10\n\n\
  在开始安装之前，请禁用防火墙。某些设置会拒绝任何在线或自动安装（如 Java），如果防火墙开启或配置不正确，它可能会阻塞下载或完全停止下载。\n\n- 打开[手动下载](https://java.com/en/download/manual.jsp)\
  \ 页面\n- 点击 Windows Online\n- 将弹出的窗口，提供运行或保存文件的选项——如果你想现在继续安装，点击“运行”——如果你喜欢稍后话做，点击“保存”并记录保存位置\n\
  - 如果你现在点击“运行”，安装过程将立即开始\n- 点击“安装”以接受许可条款并继续过程\n- 在 Java 安装期间，你可能会看到安装各种程序的优惠——这是由于\
  \ Oracle 与其他几家公司之间的合作伙伴关系。如果你想安装其中任何程序，请确保它们已勾选并点击“下一步”\n- 按照屏幕上的指示完成安装，并在最后一个对话框上点击“关闭”。这将完成安装\n\
  \n安装程序中集成了一个卸载程序。该程序的意图是检测并移除可能在你的电脑上安装的旧版本 Java。这在 Windows 32 位和 64 位系统上均有效。\n\n\
  安装程序还会 true 你的网络浏览器是否已禁用 Java 内容，并提供遵循的说明以启用它。如果你选择了隐藏 Java Web Start 应用程序和 Applet\
  \ 的提示，你也将收到有关如何恢复这些提示的说明。如果你在要求重启浏览器时没有这样做，你可能需要重启电脑。\n\n### 离线\n\n此方法涉及下载一个可执行文件，该文件包含了你所需的所有文件，因此你可以在自己的时间安装\
  \ Java。安装时不需要连接网络，只有初始下载时需要。你也可以复制该文件，然后在未连接网络的另一台电脑上安装。\n\n同样，执行此操作仍然需要管理员权限。\n\
  \n- 打开[手动下载](https://java.com/en/download/manual.jsp) 页面\n- 点击 Windows Offline\n\
  - 弹出对话框，点击“保存”\n- 确保你将文件保存在容易找到的地方，例如桌面\n- 关闭浏览器和其他任何可能运行的应用程序\n- 当你准备好安装时，双击文件\n\
  - 过程将开始，点击“安装”以接受条款并继续安装\n- 再次，你可能会被提供安装各种其他程序的选项；选择你需要的程序（如果有），并点击“下一步”\n- 按照屏幕上的指示完成，在最后一个窗口上点击“关闭”以完成安装。\n\
  \n与在线方法一样，卸载工具将检测并移除旧版本的 Java，如果 Java 内容之前被禁用，它还将向你提供在浏览器中启用 Java 内容的说明。还将提供启用 applet\
  \ 和 Java Web Start 应用程序提示的说明。\n\n## 如何在 Mac OS X 上安装 Java\n\nJava 可以安装在任何运行 OS X\
  \ 10.7.3 且带有 64 位浏览器（例如 Firefox 或 Safari）的 Mac 上。不支持 32 位浏览器。你需要管理员权限。\n\n- 下载此文件——[`jre-8u60-macosx-x64.dmg`](http://www.oracle.com/technetwork/java/javase/downloads/jre8-downloads-2133155.html)——不要忘记先接受许可条款\n\
  - 双击文件开始过程\n- 启动安装向导\n- 在欢迎屏幕上，点击“下一步”\n- 选择提供给你的可选程序的任何一个、全部或无，然后点击“下一步”\n- 按照屏幕上的指示完成安装\n\
  - 在最后一个窗口上点击“关闭”完成安装\n\nMac 的情况与 Windows 相同——如果你在浏览器中禁用了 Java 内容或 applet 和 Java\
  \ Web Start 应用程序提示，将提供如何启用它们的说明。\n\n## 如何在 Linux 上下载 Java\n\n有两种包可供选择：\n\n- Linux\
  \ 平台——任何人都可以下载的存档二进制文件，位于任何可写位置。但只有用户才能下载到系统位置\n- 基于 RPM 的 Linux 平台——对于 32 位基于 RPM\
  \ 的 Linux 平台，系统位置有一个 RPM 文件——这只能由用户执行\n\n确保你选择与你的系统和权限匹配的包。这适用于 Linux Red Hat、SUSE、Oracle\
  \ Enterprise 和 SLES\n\n- 打开 [`java.com`](http://java.com)\n- 点击 Download\n- 选择适合你要求的包\n\
  - 下载前记录文件大小，下载完成后检查包是否完整下载。\n\n### Linux 平台\n\n就本文目的而言，我们使用的是 v7——确保在输入命令时使用与下载内容对应的版本号。\n\
  \n打开终端并切换到你想安装 Java 的相关目录，输入：\n\n- `cd <directory path name>`\n- 找到 `.tar.gz` 存档二进制文件并移动到新目录\n\
  - 解压并安装 Java `tar zxvf jre-7u7-linux-1586.tar.gz`\n\n你将在名为 `jre1.7._.07` 的目录中找到\
  \ Java 文件，它位于当前目录\n\n- 如果你需要更多磁盘空间，删除 `.tar.gz` 文件\n\n### 基于 RPM 的 Linux 平台\n\n\
  再次，我使用的是 v7，所以确保在输入命令时使用适用于特定版本的正确数字\n\n- 通过在命令行运行 `su` 成为 root 用户，然后输入超级用户密码\n\
  - 从你的电脑上移除旧版本的 Java `rpm -e <package name>`\n- 切换到你安装 Java 的目录 `cd <directory path\
  \ name>`\n\n\n\n\n\n*   输入 `rpm -jvh jre-7u7-linux-1586.rpm` 安装 java 软件包。\n*   如果你想节省一些磁盘空间，可以删除\
  \ `.rpm` 文件。\n*   退出 Shell 启动 – 你不需要重启电脑。\n\n安装已完成，现在你需要前往“启用与配置”部分。\n\n## 启用与配置\n\
  \n### Firefox 浏览器\n\n*   如果 Firefox 浏览器正在打开并运行，请将其关闭。\n*   移除任何之前的 Java 插件版本 – 你一次只能运行一个版本。如果你想运行不同的版本或不同的插件，必须删除指向其他版本的符号链接，并为新版本创建一个新的链接。\n\
  *   为 `libnpjp2.so` 创建符号链接 – 你可以在浏览器插件目录中找到它。\n*   通过输入 `cd <firefox installation\
  \ directory>/plugins` 查找安装目录下的子目录（输入正确的目录名称）。\n*   创建符号链接 - `ln -s <Java installation\
  \ directory>/lib/i386/libnpjp2.so`。\n\n如果你是从旧版本的 Java 升级，在创建新链接之前必须移除现有的符号链接：\n\n\
  *   输入 `cd <Firefox installation directory>/plugins`\n    `rm libjavaplugin_oji.so`\n\
  \n例如：\n\n*   如果 Firefox 安装在 `usr/lib/<Firefox installation directory>`\n*   并且 Java\
  \ 位于 `/usr/java/<Java installation directory>`\n*   那么你将在终端窗口输入 `/usr/lib/<Firefox\
  \ installation directory>/plugins` 进入浏览器插件目录。\n*   要创建指向 Firefox Java 插件的符号链接，输入\
  \ `ln -s /usr/java/<Java installation directory>/lib/i386/libnpjp2.so`。\n\n重启你的\
  \ Firefox 浏览器，并在地址栏中输入 `about: plugins` – 这将确认 Java 插件已加载。点击“工具”菜单确保 Java 控制台在其中。\n\
  \n## 如何在 Solaris 上安装 Java\n\n有两种方法可以将 Java 下载到 Solaris 系统上：\n\n*   适用于 32 位系统的 Solaris\
  \ SPARC 版本\n*   适用于 64 位系统的 Solaris SPARC 版本\n\nJava 是一个自解压二进制文件，因此请确保你下载了适用于你系统的正确包。\n\
  \n与之前的教程一样，我在此使用了 `v7`，因此请确保在输入的任何命令中使用正确的版本号。\n\nJRE 存档二进制文件可以下载到任何你有写入权限的位置，它不会取代\
  \ Oracle Solaris OS 提供的版本。\n\n如果你在允许使用 32 位 JVM 的 64 位系统上安装，该过程有两个步骤。首先，你必须安装 32\
  \ 位版本，然后是支持 64 位操作。文件名如下：\n\n在 SPARC 处理器上：\n\n*   `jre-7u7-solaris-sparc.tar.gz`\
  \ (32 位)\n*   `jre-7u7-solaris-sparcv9.tar.gz` (64 位)\n\n在 x64/EM64T 处理器上：\n\n*\
  \   `jre-7u7-solaris-i586.tar.gz` (32 位)\n*   `jre-7u7-solaris-x64.tar.gz` (64 位)\n\
  \n如果你使用的是 32 位 Solaris，你只需要下载 32 位版本即可。\n\n*   打开 `http://java.com`\n*   点击“Free\
  \ Java Download”（免费下载 Java）\n*   你将看到一个带有“Manual downloads”（手动下载）的页面 – 下载相关的压缩包。\n\
  \n如果你运行的是 32  Oracle Solaris，你只需要下载并安装 32 位版本。\n\n注意 – `.tar.gz` 文件也称为 tarball，可以一次性解压缩并提取。\n\
  \n*   切换目录到 JRE 将要安装的位置：`cd <directory path name>`\n*   将以 `.tar.gz` 结尾的存档二进制文件移动到当前目录。\n\
  *   解压 tarball 并安装 Java：\n\n在 SPARC 处理器上：\n\n*   `gzip -dc jre-7u7-solaris-sparc.tar.gz\
  \ | tar xf -`\n*   `gzip -dc jre-7u7-solaris-sparcv9.tar.gz | tar xf -`\n\n在 x64/EM64T\
  \ 处理器上：\n\n*   `gzip -dc jre-7u7-solaris-i586.tar.gz | tar xf -`\n*   `gzip -dc\
  \ jre-7u7-solaris-x64.tar.gz | tar xf -`\n\nJava 将安装在当前目录下的名为 `jre1.7.0_<version>`\
  \ 的目录中，辅助的 64 位文件将安装在与机器架构模型对应的目录中。这些文件位于版本目录内的多个位置，例如：\n\nSPARC 处理器 – `libjvm.so`\
  \ 文件（64 位 Java VM 库文件）。Java 安装在当前目录下的名为 `jre1.7.0_<version>` 的目录中。\n\n## 启用与配置\n\
  \n一旦安装了 Java，现在是确保它已配置为可以在浏览器中运行 applet 了：\n\n*   查找 Firefox 安装目录下的插件子目录。通过 `cd\
  \ <Firefox installation directory>/plugins` 查找插件子目录。\n*   Java 安装在当前目录下的名为 `jre1.7.0_<version>`\
  \ 的目录。\n\n# 第 12 章：编写你的第一个程序\n\n现在既然你已经了解了 Java 并知道如何安装它，是时候开始编写程序了。记住，在 Java 中，所有工作都在编辑器中完成的，而不是在命令行中。打开编辑器并输入：\n\
  \n```java\nclass Pythagorean {\n    public static void main(String[] args){\n  \
  \  }\n}\n```\n\n让我解释一下你刚刚所做的：\n\n每个类都打开了一个新的。把类比为一组指令，或者说是一份食谱。有些食谱需要额外的食谱才能完成，而像你刚刚写的这种则可以独立运行。让我们假设你想制作酱料；你的食谱将包含如何制作的指令。现在你有两种选择\
  \ – 写一个包含制作饼和酱料指令的食谱，或者写饼的食谱并添加对酱料食谱的引用。这就是 Java 的。你可以让一个类引用另一个类，也可以写一个包含所有内容的类。所以，让我们拆解一下你刚刚输入的代码：\n\
  \n*   在这种情况下，类名是 `Pythagorean`。所有 Java 文件都必须以类名命名，并以 `.java` 结尾。\n*   类由第一个 `{`\
  \ 打开。\n*   下一行 `public static void main(String[] args){` 是在调用类的 main 方法。虽然这有点高级，但你应该记住它，因为你会经常使用它。\n\
  *   `}` 括号关闭了类。编写每个程序时必须做的一件事就是确保每个左括号都有对应的右括号。\n\n在这一阶段，你的应用程序不会执行任何操作，但我们仍然需要保存它。所有的\
  \ Java 应用程序应该以纯文本格式保存。\n\n接下来，我们想要运行这个应用程序，尽管它无所事。这样做的目的是让你养成这种操作的习惯。你在每个阶段都运行应用程序以进行测试。例如：\n\
  \nWindows：\n\n*   打开命令行\n*   找到你保存应用程序的位置\n*   现在在命令行中输入类似以下的内容：\n\n```\nC:/java/samples>javac\
  \ Pythagorean.java\n```\n\n\n\n\n\n`/java/samples` 是你正在工作的目录。在计算机语言中，`/name` 表示一个文件夹。最后部分是你保存应用程序的地方。例如，如果你将其保存到桌面上，你需要输入\
  \ `/desktop>javac Pythagorean.java`。\n\n`javac` 意味着 `java compile`（Java 编译），这是一个将应用程序从可读的单词转换为计算机语言的过程。如果有任何错误（如果有的话），也会在这里出现。这些错误可以在原始应用程序中轻松修正。\n\
  \n好了，如果什么都没有发生，那么你知道你的应用程序运行正常了，因为它原本就没打算执行任何操作。找到你保存应用程序的文件夹；你现在应该能看到一个名为 `Pythagorean.class`\
  \ 的第二个文件。如果它在那里，那就太好了。如果它不在，你需要检查应用程序中的文本以及命令行上的内容，以确保你的所有操作都是正确的。\n\n## Mac\n\n\
  这与 Windows 的过程类似：\n\n*   打开 `terminal.app`\n*   找到你保存应用程序的位置\n*   在终端中输入 `cd <目录名称>`\n\
  *   现在输入与你在 Windows 版本类似的内容—— `C:/java/samples>javac Pythagorean.java`\n\n下一步是让你的应用程序执行某些操作。在你的文字处理器窗口中，输入以下内容（我是从零开始写的，但你可以在之前输入之后继续，从正确的地方开始）：\n\
  \n```java\nclass Pythagorean {\n    public static void main(String[] args){\n  \
  \      String greeting = \"Hello. Welcome to the Pythagorean Theorem Application.\
  \ Today we will be computing the Pythagorean Theorem for you.\";\n        String\
  \ prompt = \"Please enter a number for the first leg of a right triangle, followed\
  \ by pressing ENTER or RETURN, followed by the remaining leg. Then hit ENTER or\
  \ RETURN one more time.\";\n        System.out.println(greeting);\n        System.out.println(prompt);\n\
  \    }\n}\n```\n\n分解如下：\n\n*   `string` 是一行文本，被称为变量，这意味着它可以发生变化。\n*   `prompt` 和\
  \ `greeting` 是字符串名称，因此在以 `String greeting` 开头的那行中，你正在创建一个名为 `greeting` 的字符串。注意，该行以分号结尾——这非常重要——所有的\
  \ JAVA 语句必须以分号结束，否则你将得到错误。\n*   `=` 用于给变量赋值，方法如下：`String greeting = \"Hello. Welcome\
  \ to the Pythagorean Theorem Application. Today we will be computing the Pythagorean\
  \ Theorem for you.\";`，或者这样：`String greeting; greeting = \"Hello. Welcome to the\
  \ Pythagorean Theorem Application. Today we will be computing the Pythagorean Theorem\
  \ for you.\";`。\n\n在后一种的情况下，你分两个步骤对变量进行了声明和赋值，而在前者的情况下，你只使用了一步。两者的工作方式是相同的。记住，进入变量的所有文本必须包含在引号\
  \ `\"\"` 中。\n\n在 `System.out.println` 这一行中，你调用系统输出来打印变量行。如果你调用 `System.out.println(\"\
  HI\")`，单词 `\"HI\"` 将打印到你的终端上。注意这里的引号——它们表示引号之间的内容是文本，而不是变量名。如果你在不加引号的情况下调用 `System.out.println(HI)`，将得到错误消息，因为程序将尝试打印一个名为\
  \ `HI` 的变量的值——而并没有这个变量。请记住这个命令；这是你将经常使用的另一个命令。\n\n现在我们要进行一些变动，让它变得稍微复杂一点。将你目前编写的代码修改为如下：\n\
  \n```java\nimport java.util.Scanner;\nclass Pythagorean {\n    public static void\
  \ main(String[] args){\n        String greeting = \"Hello. Welcome to the Pythagorean\
  \ Theorem Application. Today we will be computing the Pythagorean Theorem for you.\"\
  ;\n        String prompt = \"Please enter a number for the first leg of a right\
  \ triangle, followed by pressing ENTER or RETURN, followed by the remaining leg.\
  \ Then hit ENTER or RETURN one more time.\";\n        System.out.println(greeting);\n\
  \        System.out.println(prompt);\n        float a;\n        float b;\n     \
  \   Scanner myScanner = new Scanner(System.in);\n        a = myScanner.nextFloat();\n\
  \        b = myScanner.nextFloat();\n        float a2 = a * a;\n        float b2\
  \ = b * b;\n        double c2 = a2 + b2;\n        double c = Math.sqrt(c2);\n  \
  \      System.out.println(\"The square of a is: \" + a2 + \" The square of b is:\
  \ \" + b2 + \" The square of c is: \" + c2 + \" C is: \" + c);\n    }\n}\n```\n\n\
  现在，你可能正睁大眼睛盯着这一行代码，疑惑它到底是怎么回事，所以让我们分解一下。\n\n第一行与原始代码不同——我们在这里做的是告诉你的程序导入 `SCANNER`，这是一个工具类。正如你所知，`scanner`\
  \ 用于扫描内容，它在这里的作用是扫描你在命令行输入的内容。到这里明白了吗？\n\n`float a;` 和 `float b;` 都是声明变量。`Scanner\
  \ myScanner = new Scanner(System.in)` 意味着你创建了一个扫描器并命名为 `myScanner`。`a = myScanner.nextFloat();`\
  \ 表示将扫描器读取的第一个浮点数赋值给 `a`。`b = myScanner.nextFloat();` 同样，针对下一个数字。\n\n`float a2 =\
  \ a * a;` 声明了一个名为 `a2` 的变量，并将其赋值为 `a` 乘以 `a` 的和。`float b2 = b * b;` 针对 `b` 也是如此。`double\
  \ c2 = a2 + b2;` 声明了一个双精度数字并将其赋值为 `a2` 加上 `b2` 的值。`double c = Math.sqrt(c2);` 取\
  \ `c2` 的平方根并放入 `c` 中。\n\n`System.out.println(\"The square of a is: \" + a2 + \"\
  \ The square of b is: \" + b2 + \" The square of c is: \" + c2 + \" C is: \" + c);`\
  \ 代码的最后一行简单地输出所有内容。引号内的任何内容都将作为文本打印，而 `+` 用于组合输出。任何不在引号内的内容将打印变量的值。\n\n\n\n\n\n\
  ## 循环控制语句\n\n循环控制语句会改变其正常的执行顺序。一旦执行离开作用域，在该作用域中创建的所有自动对象都将被销毁。Java 支持以下循环控制语句：\n\
  \n- `break` 语句 – 将终止 `switch` 或循环语句，执行将移动到紧随其后的语句。\n- `continue` 语句 - 使循环跳过主体的剩余部分，并在重新开始之前测试条件。\n\
  \n## 增强型 for 循环 (Enhanced for loop)\n\n增强型 for 循环随 Java 5 引入，通常用于遍历包含数组的元素组。增强型\
  \ for 循环使用的语法如下：\n\n```java\nfor(declaration : expression)\n{\n    //Statements\n\
  }\n```\n\n`Declaration`（声明）是一个新定义的块变量，其类型与你正在访问的数组中的所有元素完全兼容。该变量位于 `for` 块中，它的值将与数组中当前元素的值相同。\n\
  \n`Expression`（表达式）的求值结果应该是你想要遍历的数组，它可以是一个返回数组的方法调用，也可以是一个是一个数组变量。\n\n### 示例\n\n\
  ```java\npublic class Test {\n    public static void main(String args[]){\n    \
  \    int [] numbers = {10, 20, 30, 40, 50};\n        for(int x : numbers ){\n  \
  \          System.out.print( x );\n            System.out.print(\",\");\n      \
  \  }\n        System.out.print(\"\\n\");\n        String [] names ={\"James\", \"\
  Larry\", \"Tom\", \"Lacy\"};\n        for( String name : names ) {\n           \
  \ System.out.print( name );\n            System.out.print(\",\");\n        }\n \
  \   }\n}\n```\n\n执行此代码将得到以下结果：\n- 10,20,30,40,50,\n- James,Larry,Tom,Lacy\n\n##\
  \ 数字 类 (Numbers Class)\n\n在 Java 中，当我们处理数字时，通常使用原始数据类型，如 `double`、`int`、`byte`、`long`\
  \ 等，例如：\n\n```java\nint i = 5000;\nfloat gpa = 13.65;\nbyte mask = 0xaf;\n```\n\n\
  然而，在开发过程中，你可能会遇到需要使用对象的情况。为了实现这一点，Java 有一种称为包装类（wrapper classes）机制。包装类如下：\n\n- `Integer`\n\
  - `Long`\n- `Byte`\n- `Double`\n- `Float`\n- `Short`\n\n它们都是主抽象类 `number` 类的子类。\n\
  \n包装类包含了原始数据类型，与其名称对应，例如，`Long` 包装类将包含 `long` 数据类型。将这些原始类型转换为对象被称为 `装箱`（boxing），编译器会自动为你完成这一操作。因此，如果你正在使用包装类，你只需要将其内部数据类型的值传递给包装类的构造函数即可。包装对象转换回原始数据类型，这一过程被称为\
  \ `拆箱`（unboxing）。\n\n装箱和拆箱的示例如下：\n\n```java\npublic class Test{\n    public static\
  \ void main(String args[]){\n        Integer x = 5; // 将 int 装箱为 Integer 对象\n  \
  \      x = x + 10;  // 将 Integer 拆箱为 int\n        System.out.println(x);\n    }\n\
  }\n```\n\n执行此代码将得到此结果：\n- 15\n\n在 `x` 被赋值为整数值的情况下，编译器会将该整数装箱，因为它是一个对象。稍后，`x` 将被拆箱，以便作为整数进行加法。\n\
  \n## 数字方法 (Number Methods)\n\n以下是所有 `Number` 类子类都实现的实例方法列表：\n\n- `xxxValue()` –\
  \ 将数字对象的值转换为数据类型 `xxx` 并返回 `i`\n- `compareTo()` – 将数字对象与参数进行比较\n- `equals()` - 确定数字对象实际上是否与参数相等\n\
  - `valueOf()` – 返回一个持有指定原始类型值的整数对象\n- `toString()` – 返回一个表示指定的 `int` 或整数值的 `String`\
  \ 对象\n- `parseInt()` - 用于获取指定 `String` 的原始数据类型\n- `abs()` – 返回指定参数的绝对值\n- `ceil()`\
  \ – 返回大于或等于参数的最小 `int`，并以 `double` 类型返回\n- `floor()` – 返回小于或等于参数的最大 `int`，并以 `double`\
  \ 类型返回\n- `rint()` – 返回与参数值最接近的 `int`，同样以 `double` 类型返回\n- `round()` – 返回与参数最接近的\
  \ `int` 或 `long`（由方法的返回类型决定）\n- `min()` – 返回一对参数中的最小值\n- `max()` – 返回一对参数中的最大值\n\
  - `exp()` – 返回自然对数的底，例如，参数的幂\n- `log()` – 返回指定参数的自然对数\n- `pow()` – 返回第一个参数的以第二个参数为幂\n\
  - `sqrt()` – 返回指定参数的平方根\n- `sin()` – 返回指定参数的正弦值\n- `cos()` – 返回指定参数的余弦值\n- `tan()`\
  \ – 返回指定参数的正切值\n- `asin()` – 返回指定参数的反正弦\n- `acos()` – 返回指定参数的反余弦\n- `atan()` – 返回指定参数的反切\n\
  - `atan2()` – 将直角转换为极坐标\n- `toDegrees()` – 将转换为角度\n- `toRadians()` – 将转换为弧度\n- `random()`\
  \ – 返回随机\n\n## 字符类 (Character Class)\n\n我们在 Java 中处理字符时，倾向于使用原始数据类型 `char`，例如：\n\
  \n```java\nchar ch = 'a';\n// 字符数组\nchar[] charArray ={a', 'b', 'c', 'd', 'e'};\n\
  // Unicode 大写字母 Omega\nchar uniChar = '\\u39A';\n```\n\n正如我们讨论数字的方式一样，还有一个名为 `Character`\
  \ 的包装类，允许使用对象代替原始数据类型 `char`。`Character` 类中有一些有用的方法可以操作字符，你可以使用 `Character` 构造函数创建一个\
  \ `Character` 对象，例如：\n\n```java\nCharacter ch = new Character('a');\n```\n\n在某些情况下，编译器会自动为你创建\
  \ `Character` 对象，例如，如果你将原始 `char` 传递给需要对象的方法，编译器将转换 `char`。如果 `Character` 被转换为 `char`，则被称为拆箱。\n\
  \n例如：\n\n```java\n// 这里原始 char 'a' 装箱为 Character 对象\nCharacter ch = 'a';\n// 这里原始\
  \ 'x' 装箱用于方法 test，\n// 返回拆箱为 char 'c'\nchar c = test('x');\n```\n\n### 转义序列 (Escape\
  \ Sequences)\n\n如果字符前面有一个 `\\` 斜杠，它被称为转义序列，并对编译器具有特殊含义。你可能在某些程序中也见过这个 `\\n`。这是一个换行符，主要用于\
  \ `System.out.println()` 语句在打印字符串后移动到下一行。以下是 Java 中的转义序列：\n\n- `\\t` – 在文本处插入一个制表符\n\
  - `\\b` – 在文本处插入一个退格\n- `\\n` – 在文本处插入换行\n- `\\r` – 在文本处插入一个回车\n- `\\f` – 在文本处插入一个分页符\n\
  - `\\'` – 在文本处插入一个单引号\n- `\\\"` – 在文本处插入一个双引号\n- `\\\\` – 在文本处插入一个反斜杠\n\n当编译器在 `rint`\
  \ 语句遇到转义序列时，它将按照其写的形式进行解释。\n\n\n\n\n\n例如，如果你想在引号内部放入引号，则需要对内部的引号使用 `\\\"` 转义序列：\n\
  \n```java\npublic class Test {\n    public static void main(String args[]) {\n \
  \       System.out.println(\"She said \\\"Hello!\\\" to me.\");\n    }\n}\n```\n\
  \n执行此代码将产生以下结果：\nShe said \"Hello!\" to me.\n\n## 字符类方法\n\n以下是 `Character` 类子类实现的所有重要实例方法的列表：\n\
  \n* `isLetter()` – 确定指定的 char 值是否为字母\n* `isDigit()` – 确定指定的 char 值是否为数字\n* `isWhitespace()`\
  \ – 确定指定的 char 值是否为空字符\n* `isUpperCase()` – 确定指定的 char 值是否为大写字母\n* `isLowerCase()`\
  \ - 确定指定的 char 值是否为小写字母\n* `toUpperCase()` - 返回指定的 char 值的大写形式\n* `toLowerCase()`\
  \ - 返回指定的 char 值的小写形式\n* `toString()` – 返回一个 `String` 对象，该 `String` 是一个单字符字符串，表示指定的字符值\n\
  \n## String 类\n\n字符串在 Java 中被广泛使用，它们简单来说就是字符序列。在 Java 编程中，字符串被称为对象，平台提供了 `String`\
  \ 类允许你创建并操纵字符串。\n\n创建字符串最简单的方法如下：\n\n```java\nString greeting = \"Hello world!\"\
  ;\n```\n\n每当编译器遇到代码中写的字符串字面量时，它都会创建一个 `String` 对象。在上面的用例中，值为“Hello, World!”像任何其他对象一样，`String`\
  \ 对象可以使用构造函数和 `new` 关键字创建。`String` 类中有 11 个构造函数，它们都允许你通过不同的方式（例如字符数组）提供字符串的起始值。例如：\n\
  \n```java\npublic class StringDemo{\n    public static void main(String args[]){\n\
  \        char[] helloArray = { 'h', 'e', 'l', 'l', 'o', '.'};\n        String helloString\
  \ = new String(helloArray); \n        System.out.println( helloString );\n    }\n\
  }\n```\n\n执行此代码将得到以下结果：\nhello.\n\n请注意 `String` 类是不可变的。这意味着一旦创建了它，你就无法更改 `String`\
  \ 对象。如果你发现需要修改字符串，则需要使用 `StringBuffer` 和 `StringBuilder` 类。\n\n### 字符串长度\n\n当你使用方法来获取有关对象的信息时，该方法被称为访问器方法。你可以使用的其中之一是\
  \ `length()` 方法，它将返回字符串对象内部字符的数量。例如：\n\n```java\npublic class StringDemo {\n   \
  \ public static void main(String args[]) {\n        String palindrome = \"Dot saw\
  \ I was Tod\";\n        int len = palindrome.length();\n        System.out.println(\
  \ \"String Length is : \" + len );\n    }\n}\n```\n\n执行此代码将产生以下结果：\nString Length\
  \ is : 17\n\n### 字符串拼接\n\n`String` 类中有一个方法用于拼接两个字符串：\n\n```java\nstring1.concat(string2);\n\
  ```\n\n这将返回一个字符串，其为 `string1` 末尾添加了 `string2`。`concat()` 方法也可以用于字符串字面量，例如：\n\n```java\n\
  \"My name is \".concat(\"Zara\");\n```\n\n通常，我们使用 `+` 运算符来拼接两个字符串：\n\n```java\n\"\
  Hello,\" + \" world\" + \"!\"\n```\n\n其结果将为：\n\"Hello, world!\"\n\n例如：\n\n```java\n\
  public class StringDemo {\n    public static void main(String args[]) {\n      \
  \  String string1 = \"saw I was \";\n        System.out.println(\"Dot \" + string1\
  \ + \"Tod\");\n    }\n}\n```\n\n执行此代码将得到以下结果：\nDot saw I was Tod\n\n### 创建格式化字符串\n\
  \n要打印格式化数字的输出，你可以使用 `printf()` 和 `format()` 方法。在字符串类中的等价方法是 `format()`，它会返回一个 `String`\
  \ 对象而不是 `PrintStream` 对象。通过 `format()` 方法，你可以创建一个可重用的格式化字符串，而不是一次性的。\n\n例如，你可以这样写：\n\
  \n```java\nSystem.out.printf(\"The value of the float variable is \" +\n    \"%f,\
  \ while the value of the integer \" +\n    \"variable is %d, and the string \" +\n\
  \    \"is %s\", floatVar, intVar, stringVar);\n```\n\n但是，你可以这样写：\n\n```java\nString\
  \ fs;\nfs = String.format(\"The value of the float variable is \" +\n    \"%f, while\
  \ the value of the integer \" +\n    \"variable is %d, and the string \" +\n   \
  \ \"is %s\", floatVar, intVar, stringVar);\nSystem.out.println(fs);\n```\n\n###\
  \ 字符串方法\n\n以下是 `String` 类支持的所有方法的列表：\n\n* `char charAt(int index)` – 返回指定索引处的字符\n\
