  \ a = \"\\u0001\";\n```\n\nJava 还为 `char` 和字符串字面量支持一些特殊的转义序列。它们如下：\n\n| 符号 | 表示的字符\
  \ |\n| :--- | :--- |\n| `\\n` | 新行 (0x0a) |\n| `\\r` | 回车 (0x0d) |\n| `\\f` | 换页\
