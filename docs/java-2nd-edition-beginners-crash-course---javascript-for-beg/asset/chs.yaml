  \ field)` – 返回指定字段的最小值。\n* `int hashCode()` – 覆盖哈希码。\n* `boolean isLeapYear(int\
  \ year)` – 判断年份是否为闰年。\n* `void roll(int field, boolean up)` – 在不改变字段的情况下增加或减少单个时间单位。\n\
  * `void set(int field, int value)` – 设置指定字段的值。\n* `void set(int year, int month,\
  \ int date)` – 设置年份、月份和日期。\n* `void set(int year, int month, int date, int hour,\
  \ int minute)` – 设置年份、月份、日期、小时和分钟。\n* `void set(int year, int month, int date, int\
  \ hour, int minute, int second)` – 设置年份、月份、日期、小时、分钟和秒。\n* `void setGregorianChange(Date\
  \ date)` – 使用日期更改 `GregorianCalendar`。\n* `void setTime(Date date)` – 使用日期设置当前时间。\n\
  * `void setInMillis(long millis)` – 使用指定的毫秒值设置当前时间。\n* `void setTimeZone(TimeZone\
  \ zone)` – 使用指定的时区设置时间。\n* `String toString()` – 返回日历的字符串表示。\n\n以下是 `GregorianCalendar`\
  \ 类的一些用法：\n\n### 示例：\n\n```java\nimport java.util.*;\n\npublic class GregorianCalendarDemo\
  \ {\n    public static void main(String args[]) {\n        String months[] = {\n\
  \            \"Jan\", \"Feb\", \"Mar\", \"Apr\",\n            \"May\", \"Jun\",\
  \ \"Jul\", \"Aug\",\n            \"Sep\", \"Oct\", \"Nov\", \"Dec\"};\n        int\
  \ year;\n        // 使用默认区域语言和时区的当前日期\n        // 初始化格列哥日历。\n        GregorianCalendar\
  \ gcalendar = new GregorianCalendar();\n        // 显示当前时间和日期信息。\n        System.out.print(\"\
  Date: \");\n        System.out.print(months[gcalendar.get(Calendar.MONTH)]);\n \
  \       System.out.print(\" \" + gcalendar.get(Calendar.DATE) + \" \");\n      \
  \  System.out.println(year = gcalendar.get(Calendar.YEAR));\n        System.out.print(\"\
  Time: \");\n        System.out.print(gcalendar.get(Calendar.HOUR) + \":\");\n  \
  \      System.out.print(gcalendar.get(Calendar.MINUTE) + \":\");\n        System.out.println(gcalendar.get(Calendar.SECOND));\n\
  \        // 测试当前年份是否为闰年\n        if(gcalendar.isLeapYear(year)) {\n            System.out.println(\"\
  The current year is a leap year\");\n        } else {\n            System.out.println(\"\
  The current year is not a leap year\");\n        }\n    }\n}\n```\n\n如果你运行这个程序，将得到如下输出：\n\
  \n```\nDate: Apr 22 2009\nTime: 11:25:27\nThe current year is not a leap year\n\
