  \ `0x` 表示十六进制值。以下是一个示例。\n\n```java\nint decimal = 100;\nint octal = 0144;\nint hexa\
  \ = 0x64;\n```\n\nJava 中的字符串字面量定义方式与其他编程语言相似。这是通过在一对双引号内包含一组字符来实现的。以下是一些字符串字面量的示例。\n\
