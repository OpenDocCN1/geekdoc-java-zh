  \ – 按字典顺序与字符串进行比较\n* `int compareToIgnoreCase(String str)` – 与上述相同，但会忽略任何大小写差异\n\
  * `String concat(String str)` – 连接字符串\n* `boolean contentEquals(StringBuffer sb)`\
  \ – 如果字符串与 `StringBuffer` 字符序列相同则返回 true\n* `static String copyValueOf(char[] data)`\
  \ – 返回表示字符数组序列的字符串\n* `static String copyValueOf(char[] data, int offset, int count)`\
  \ – 与上述方法相同\n* `boolean endsWith(String suffix)` – 测试字符串是否以指定的后缀结尾\n* `boolean equals(Object\
  \ anObject)` – 将此字符串与对象进行比较\n* `boolean equalsIgnoreCase(String anotherString)`\
  \ – 与另一个字符串比较，但忽略大小写\n* `byte[] getBytes()` – 使用默认字符集将字符串编码为字节序列并将结果存储在新数组中\n* `byte[]\
  \ getBytes(String charsetName)` – 与上述方法相同\n* `void getChars(int srcBegin, int srcEnd,\
  \ char[] dst, int dstBegin)` – 将字符拷贝到目标数组\n* `int hashCode()` – 返回哈希值\n* `int indexOf(int\
  \ ch)` – 返回指定字符首次出现的索引\n* `int indexOf(int ch, int fromIndex)` – 与上述相同，但从指定的索引开始搜索\n\
  * `int indexOf(String str)` – 返回指定子字符串首次出现的索引\n* `int indexOf(String str, int fromIndex)`\
  \ – 与上述相同，但从指定的索引开始搜索\n* `String intern()` – 返回规范表示\n* `int lastIndexOf(int ch)`\
  \ – 返回指定字符最后一次出现的索引\n* `int lastIndexOf(int ch, int fromIndex)` – 与上述相同，但从指定的索引开始向后搜索\n\
  * `int lastIndexOf(String str)` – 返回指定子字符串最后一次出现的索引\n* `int lastIndexOf(String str,\
  \ int fromIndex)` – 在字符串中返回指定子字符串最后一次出现的索引，从指定的索引开始向后搜索\n* `int length()` – 返回字符串长度\n\
  * `boolean matches(String regex)` – 告知字符串是否匹配指定的正则表达式\n* `boolean regionMatches(boolean\
  \ ignoreCase, int toffset, String other, int ooffset, int len)` – 测试两个字符串区域是否相等\n\
  * `boolean regionMatches(int toffset, String other, int ooffset, int len)` – 与上述方法相同\n\
  * `String replace(char oldChar, char newChar)` – 返回替换了所有 `oldChar` 为 `newChar` 的新字符串\n\
  \n\n\n\n\n*   `String replaceAll(String regex, String replacement)` – 将字符串中匹配指定正则表达式的每个子字符串替换为指定的替换字符串\n\
  *   `String replaceFirst(String regex, String replacement)` – 将索引第一个匹配指定正则表达式的子字符串替换为指定的替换字符串\n\
  *   `String[] split(String regex)` – 根据指定正则表达式的任何匹配项将字符串分割\n*   `String[] split(String\
  \ regex, int limit)` – 与上述方法相同\n*   `boolean startsWith(String prefix)` – 测试字符串是否以指定的前缀开头\n\
  *   `boolean startsWith(String prefix, int toffset)` – 与上述相同，但测试前缀是否从指定的索引开始\n*\
  \   `CharSequence subSequence(int beginIndex, int endIndex)` – 返回一个作为该序列的子序列的字符序列\n\
  *   `String substring(int beginIndex)` – 返回字符串的子字符串的新字符串\n*   `String substring(int\
  \ beginIndex, int endIndex)` – 与上述方法相同\n*   `char[] toCharArray()` – 将字符串转换为字符数组\n\
  *   `String toLowerCase()` – 使用默认语言区域规则将字符串中的字符转换为小写\n*   `String toLowerCase(Locale\
  \ locale)` – 与上述相同，使用指定的语言区域规则\n*   `String toString()` – 返回字符串本身\n*   `String toUpperCase()`\
  \ – 使用默认语言区域规则将此字符串中的字符转换为大写\n*   `String toUpperCase(Locale locale)` – 与上述相同，但使用指定的语言区域规则\n\
  *   `String trim()` – 返回字符串的副本，省略前导和尾部空白字符\n*   `static String valueOf(primitive\
  \ data type x)` – 返回传递的数据类型参数的表示\n\n## 数组\n\n数组在 Java 中也被广泛使用，它们存储了一系列固定大小的元素，且所有元素的类型都相同。数组存储数据集合，但更多地是将数组视为一组相同类型变量的集合。\n\
  \n与其使用单个变量，你可以声明一个数组变量，并在内部用单个变量来表示。\n\n### 声明数组变量\n\n如果你想使用数组，首先必须声明一个变量。这是为了引用数组，你必须指定该变量能够引用的数组类型。要声明数组变量，你可以使用以下语法：\n\
  \n*   `dataType[] arrayRefVar;` // 优先的写法。\n*   或者\n*   `dataType arrayRefVar[];`\
  \ // 可以用，但不是推荐写法。\n\n例如：\n\n*   `double[] myList;` // 优先的写法。\n*   或者\n*   `double\
  \ myList[];` // 可以用，但不是推荐写法。\n\n### 创建数组\n\n使用 `new` 操作符创建数组，请使用以下语法：\n\n*   `arrayRefVar\
  \ = new dataType[arraySize];`\n\n该语句执行了两件事：\n\n*   它使用 `dataType[arraySize]` 创建了一个数组\n\
  *   将数组的引用赋值给变量 `arrayRefVar`\n\n你可以仅通过一条语句声明数组变量、创建一个新数组并将引用赋值给变量，如下：\n\n*   `dataType[]\
  \ arrayRefVar = new dataType[arraySize];`\n\n或者你可以这样做：\n\n*   `dataType[] arrayRefVar\
  \ = {value0, value1, ..., valuek};`\n\n索引用于访问数组元素，且索引是从 0 开始的，这意味着它们从 0 到 `arrayRefVar.length-1`。\n\
  \n例如：\n\n该语句声明了一个名为 `myList` 的数组变量，创建了一个包含 10 个元素的数组，全部为 `double` 类型，并将引用赋值给 `myList`：\n\
  \n*   `double[] myList = new double[10];`\n\n### 处理数组\n\n当我们处理数组元素时，我们倾向于使用 `for`\
  \ 循环或 `foreach` 循环，仅仅是因为所有元素都是相同类型，并且我们知道数组的大小。下面的示例展示了如何创建一个数组、初始化它然后处理它：\n\n```java\n\
  public class TestArray {\n    public static void main(String[] args) {\n       \
  \ double[] myList = {1.9, 2.9, 3.4, 3.5};\n        // 打印所有数组元素\n        for (int\
  \ i = 0; i < myList.length; i++) {\n            System.out.println(myList[i] + \"\
  \ \");\n        }\n        // 求加所有元素\n        double total = 0;\n        for (int\
  \ i = 0; i < myList.length; i++) {\n            total += myList[i];\n        }\n\
  \        System.out.println(\"Total is \" + total);\n        // 寻找最大元素\n       \
  \ double max = myList[0];\n        for (int i = 1; i < myList.length; i++) {\n \
  \           if (myList[i] > max) max = myList[i];\n        }\n        System.out.println(\"\
  Max is \" + max);\n    }\n}\n```\n\n执行此代码将得到此结果：\n\n*   1.9\n*   2.9\n*   3.4\n\
  *   3.5\n*   Total is 11.7\n*   ax is 3.5\n\n### foreach 循环\n\n`foreach` 循环随 JDK\
  \ 1.5 引入。这允许你顺序遍历整个数组，而不需要诉诸使用索引。例如：\n\n这段代码显示了所有的 `array`：\n\n```java\npublic class\
  \ TestArray {\n    public static void main(String[] args) {\n        double[] myList\
  \ = {1.9, 2.9, 3.4, 3.5};\n        // 打印所有数组元素\n        for (double element : myList)\
  \ {\n            System.out.println(element);\n        }\n    }\n}\n```\n\n执行此代码将得到此结果：\n\
  \n*   1.9\n*   2.9\n*   3.4\n*   3.5\n\n### 将数组传递给方法\n\n与我们将基本类型值传递给方法一样，我们可以传递数组。下面的示例展示了数组：\n\
  \n```java\npublic static void printArray(int[] array) {\n    for (int i = 0; i <\
  \ array.length; i++) {\n        System.out.println(array[i]);\n    }\n}\n```\n\n\
  调用它时我们需要传递数组，例如下面的语句：\n\n`printArray(new int[]{3, 1, 2});`\n\n### 从方法返回数组\n\n方法也可以返回数组，在所示示例中，它返回另一个数组的反转：\n\
  \n```java\npublic static int[] reverse(int[] list) {\n    int[] result = new int[list.length];\n\
  \    for (int i = 0, j = result.length - 1; i < list.length; i++, j--) {\n     \
  \   result[j] = list[i];\n    }\n    return result;\n}\n```\n\n### Arrays 类\n\n\
  在 `java.util.Arrays` 类中，有许多静态方法允许你搜索和排序数组、比较它们并填充元素。以下是方法列表：\n\n*   `public static\
  \ int binarySearch(Object[] a, Object key)` – 使用二分查找在指定的对象数组中搜索指定的值。在调用此方法之前，必须进行排序。如果搜索键在列表中，将返回其索引，否则返回\
  \ `-(插入点 +1)`\n*   `public static boolean equals(long[] a, long[] a2)` – 如果两个指定的数组相等，则返回\
  \ true。如果两个数组元素数量相同且数组中对应的元素对相等，则它们相等。如果两个数组相等，将返回 true。\n*   `public static void\
  \ fill(int[] a, int val)` – 将指定的 int 值赋值给指定的 int 数组。\n*   `public static void sort(Object[]\
  \ a)` – 将指定的数组按照元素的顺序进行升序排序。\n\n## 日期和时间\n\n`java.util` 包包含了 `Date` 类，它封装了日期和时间。该类支持两个构造函数：\n\
  \n*   `Date()` – 使用日期和时间初始化对象\n*   `Date(long millisec)` – 接受一个参数，该参数等于自 1970 年\
  \ 1 月 1 日午夜以来经过的毫秒数。\n\n下列表列出了 `Date` 类支持的方法：\n\n\n\n\n\n*   `boolean after(Date\
  \ date)` – 如果调用的 `Date` 对象比指定的日期更晚，则返回 `true`。否则，返回 `False`。\n\n*   `boolean before(Date\
  \ date)` – 与上述方法相同。\n\n*   `Object clone()` – 复制调用的 `Date` 对象。\n\n*   `int compareTo(Date\
  \ date)` – 比较调用的对象的值与 `Date` 对象的值。如果值相等，则返回 `0.`。如果调用的对象在 `Date` 对象之前，则返回 `False`；如果较晚，则返回\
  \ `True`。\n\n*   `int compareTo(Object obj)` – 与上述方法完全相同，前提是 `obj` 是 `Date` 类。如果不是，将抛出\
  \ `ClassCastException`。\n\n*   `boolean equals(Object date)` – 如果调用的 `Date` 对象与指定的日期和时间相同，则返回\
  \ `true`，否则返回 `false`。\n\n*   `long getTime()` – 返回自 1970 年 1 月 1 日午夜以来经过的毫秒数。\n\
  \n*   `int hashCode()` – 为调用的对象返回哈希码。\n\n*   `void setTime(long time)` – 将日期和时间设置为由\
  \ `time` 指定，表示自 1970 年 1 月 1 日午夜以来经过的毫秒数。\n\n*   `String toString()` – 将调用的对象转换为字符串并返回结果。\n\
  \n### 获取当前日期和时间\n\n这非常简单；你只需要一个简单的 `date` 对象，配合 `toString()` 方法，如示例所示：\n\n```java\n\
  import java.util.Date;\n\npublic class DateDemo {\n    public static void main(String\
  \ args[]) {\n        // 实例化 Date 对象\n        Date date = new Date();\n        //\
  \ 使用 toString() 显示时间和和日期\n        System.out.println(date.toString());\n    }\n\
  }\n```\n\n这将得到如下结果：\n\n*   on May 04 09:51:52 CDT 2009\n\n### 日期比较\n\n在 Java 中有三种比较日期的方法：\n\
  \n*   使用 `getTime()` 获取自 1970 年 1 月 1 日午夜以来经过的毫秒数。对两个对象都执行此操作，然后比较值。\n\n*   使用 `before()`、`after()`\
  \ 和 `equals()` 方法。例如，因为某月的 12 号在 18 号之前，`newDate(99, 2, 12).before(newDate (99,\
  \ 2, 18))` 将返回 `true`。\n\n*   使用 `compareTo()` 方法。\n\n### 使用 SimpleDateFormat 进行日期格式化\n\
  \n`SimpleDateFormat` 是用于格式化和解析日期的具体类。它允许你选择任何用户定义的模式进行日期和时间格式化，例如：\n\n```java\n\
  import java.util.*;\nimport java.text.*;\n\npublic class DateDemo {\n    public\
  \ static void main(String args[]) {\n        Date dNow = new Date( );\n        SimpleDateFormat\
  \ ft = new SimpleDateFormat (\"E yyyy.MM.dd 'at' hh:mm:ss a zzz\");\n        System.out.println(\"\
  Current Date: \" + ft.format(dNow));\n    }\n}\n```\n\n执行此代码将得到如下结果：\n\n*   Current\
  \ Date: Sun 2004.07.18 at 04:14:09 PM PDT\n\n### SimpleDateFormat 格式代码\n\n为了指定时间格式，你将使用一个时间模式字符串。所有的\
  \ ASCII 字母在此字符串中都被保留为模式字母，其定义如下：\n\n| 字符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n|\
  \ G | 纪元标识符 | AD |\n| Y | 四位数的年份 | 2000 |\n| M | 年中的月份 | May or 05 |\n| d | 月中的日期\
  \ | 11 |\n| h | 上午或下午的小时 (1-12) | 12 |\n| H | 一天中的小时 (0-23) | 21 |\n| m | 小时内的分钟\
  \ | 30 |\n| s | 分钟内的秒 | 53 |\n| S | 毫秒 | 258 |\n| E | 星期 | Wednesday |\n| D | 年中的天数\
  \ | 342 |\n| F | 月中的星期几 | 2 (五 月的第二个星期四) |\n| w | 年周数 | 25 |\n| W | 月中的周数 | 2 |\n\
  | a | 上午或下午标记 | AM |\n| k | 一天中的小时 (1-24) | 22 |\n| K | 上午或下午的小时 (0-11) | 9 |\n\
  | z | 时区 | GMT |\n| ‘ | 文本转义 | Delimiter |\n| “ | 单引号 | ‘ |\n\n### 使用 printf 进行日期格式化\n\
  \n使用 `printf` 方法格式化日期和时间非常简单。你只需要使用以 `t` 开头并以上述字母之一结尾的格式化符。例如：\n\n```java\nimport\
  \ java.util.Date;\n\npublic class DateDemo {\n    public static void main(String\
  \ args[]) {\n        // 实例化 Date 对象\n        Date date = new Date();\n        //\
  \ 使用 toString() 显示时间和和日期\n        String str = String.format(\"Current Date/Time\
  \ : %tc\", date );\n        System.out.printf(str);\n    }\n}\n```\n\n执行此代码将得到如下结果：\n\
  \nCurrent Date/Time : Sat 15 16:37:57 MST\n\n为了避免必须提供这些，你可以使用标志。例如：\n\n```java\n\
  import java.util.Date;\n\npublic class DateDemo {\n    public static void main(String\
  \ args[]) {\n        // 实例化 Date 对象\n        Date date = new Date();\n        //\
  \ 使用 toString() 显示时间和和日期\n        String str = String.format(\"Current Date/Time\
  \ : %tc\", date );\n        System.out.printf(str);\n    }\n}\n```\n\n执行此代码将得到如下结果：\n\
  \nCurrent Date/Time : Sat 15 16:37:57 MST\n\n\n\n\n\n`GregorianCalendar` 被认为是实现熟悉的格列哥日历类的具体实现。使用\
  \ `Calendar` 类中的 `getInstance()` 方法将返回 `GregorianCalendar`，该对象使用特定时区和默认区域语言的日期时间进行初始化。`GregorianCalendar`\
  \ 中定义了两个字段——`AD` 和 `BC`。这些代表了 `GregorianCalendar` 定义的纪元。`GregorianCalendar` 对象支持许多构造函数：\n\
  \n* `GregorianCalendar()` – 构造一个使用默认时区默认区域语言的当前时间的格列哥日历。\n* `GregorianCalendar(int\
  \ year, int month, int date)` – 使用默认区域语言和时区的指定日期。\n* `GregorianCalendar(int year,\
  \ int month, int date, int hour, int minute)` – 与上述相同。\n* `GregorianCalendar(int\
  \ year, int month, int date, int hour, int minute, int second)` – 与上述相同。\n* `GregorianCalendar(Locale\
  \ aLocale)` – 在默认时区使用指定区域语言的当前时间。\n* `GregorianCalendar(TimeZone zone)` – 使用指定时区和默认区域语言的当前时间。\n\
  * `GregorianCalendar(TimeZone zone, Locale aLocale)` – 使用指定时区和指定区域语言的当前时间。\n\n以下是\
  \ `GregorianCalendar` 类提供的一些更有用的支持方法的列表：\n\n* `void add(int field, int amount)`\
  \ – 使用日历规则将指定的时间加到指定的字段上。\n* `protected void computeFields()` – 将 UTC 从毫秒转换为时间字段值。\n\
  * `protected void computeTime()` – 覆盖 `Calendar` 并将 UTC 从时间字段值转换为毫秒。\n* `boolean\
  \ equals(Object obj)` – 在 `GregorianCalendar` 和指定的对象引用之间进行比较。\n* `int get(int field)`\
  \ – 获取指定时间字段的值。\n* `int getActualMaximum(int field)` – 返回在指定日期上该字段可能的最最大值。\n* `int\
  \ getActualMinimum(int field)` – 返回使用当前日期时该字段可能的最小值。\n* `int getGreatestMinimum(int\
  \ field)` – 如果指定字段发生变化，则返回该字段的最大最小值。\n* `Date getGregorianChange()` – 获取用于更改日期的\
  \ `GregorianCalendar`。\n* `int getLeastMaximum(int field)` – 如果指定字段发生变化，则返回该字段的最大最小值。\n\
  * `int getMaximum(int field)` – 返回指定字段可能的最大值。\n* `Date getTime()` – 获取当前时间。\n* `long\
