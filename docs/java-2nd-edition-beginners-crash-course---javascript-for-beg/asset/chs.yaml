- "# JAVA：第二版！初学者速成课程 - Javascript 初学者指南：程序 Java、jQuery 及 Java 编程 (Java 初学者、学习 Java、...\
  \ 编程语言、编码书籍 1)\n\n\n\n![](img/cover.jpeg)\n\n\n# 引言\n\n1995 年，Sun Microsystems（太阳系统公司）开发了一种名为\
  \ Java 的高级编程语言。James Gosling 发起了 Java 项目，并将其作为 Sun 公司 Java 平台的核心组件发布。这是 Java 的第一个版本，称为\
  \ Java 1.0。\n\nJava 代码可以在任何带有 Java 虚拟机的设备上运行。Java 为用户提供了“一次编写，到处运行”（Write Once,\
  \ Run Anywhere）的概念。\n\nJava 编程语言非常灵活，其面向对象的概念易于使用。与许多其他过时的编程语言不同，Java 是一种不断进化的语言，每个新版本都会添加额外的功能。\n\
  \n在本教程中，我们将讨论 Java 的核心概念和特征，任何具有编程语言基础知识的人都可以学习 Java。我们将通过示例逐步讨论这些主题，使其易于理解和吸收。\n\
  \n我希望这本书对你有所帮助。\n\n阅读愉快！！\n\n# 第 1 章：Java 概述\n\n让 Java 与其他编程语言脱颖出的主要特征有：\n\n- **面向对象**：Java\
  \ 中的一切都被视为一个对象。由于其对象模型，它很容易进行扩展。\n- **平台无关**：当 Java 代码被编译时，它将是平台无关的字节码（Byte code），这是其他编程语言不具备的。这些字节码将由运行平台上的\
  \ Java 虚拟机解释。\n- **简单**：Java 的设计易于运行。如果你了解面向对象编程的基本概念，就可以轻松掌握 Java。\n- **安全**：得益于\
  \ Java 的特性，可以开发防篡改和无病毒的系统。Java 使用密钥加密技术。\n- **架构中立且可移植**：Java 编译器生成的文件是架构中立的对象格式。这些文件可以在任何运行\
  \ Java 虚拟机的处理器上执行。这使得 Java 成为一种可移植的语言。\n- **健壮**：通过运行时检查和编译时检查，可以消除错误情况，使 Java 成为一种健壮的语言。\n\
  - **多线程**：Java 支持多线程。通过多个线程，程序可以同时运行不同的任务。这有助于开发者构建交互式。\n- **解释型**：Java 字节码可以转换为机器语言。这不需要存储在任何地方。Java\
  \ 的链接过程是轻量级且增量的，使得开发过程更加高效和快速。\n- **高性能**：Java 通过其即时编译器确保用户的高性能。\n- **分布式**：Java\
  \ 的设计适用于互联网分布式环境。\n- **动态**：Java 程序能够在运行时携带大量信息，反过来用于验证和解析对象的访问。这是一种动态编程语言。\n\n\
  # 第 2 章：Java 基础语法\n\n在本章中，我们将学习方法、类、对象等的各种语法。我们知道 Java 是一种面向对象的编程语言，Java 程序无非对象的集合。这些对象通过调用其他对象的方法进行通信。现在，我们将查看对象、类、实例和方法的含义。\n\
  \n## 对象\n对象具有状态和行为。例如：汽车具有状态——颜色、名称、型号，以及行为——加速、制动、巡航。对象可以定义为类的实例。\n\n## 类\n计算机中的类可以定义为蓝图或模板，描述了对象支持的状态或行为。\n\
  \n## 方法\n方法基本上可以定义为一种行为。逻辑写在方法内部。一个类可以包含任意数量的方法。所有的操作和数据处理都在方法内部执行。\n\n\n\n\n\n\
  ## 实例变量\n\n每个对象都拥有自己的一组唯一变量。这些变量被称为实例变量。这些 `instance variables` 会被赋予值，并用于定义对象的状态。\n\
  \n## 基础语法\n\n在 Java 中进行编程时，应始终遵循以下几点。\n\n- 大小写敏感 - Java 语言对大小写敏感。因此，在编写 Java 程序时必须小心。`Phoenix`\
  \ 和 `phoenix` 并不是同一个词，它们在 Java 中的含义也不同。\n- 类名 - 在编写类名时，第一个字母应该始终为大写字母。例如 `Car`、`Bike`、`Laptop`\
  \ 等。如果使用多个单词组合成类名，其中每个单词的首字母都应该大写。例如类名 `JavaExampleClass`。\n- 方法名 - 在调用方法时，方法的名称应该以小写字母开头。如果使用多个单词来命名该方法，方法的第一个字母将是小写字母，而内部单词的第一个字母应该大写。例如：`public\
  \ void exampleJavaMethodName()`\n- 程序文件名 - 类名和程序文件名必须完全相同。\n- 始终记住使用类名保存文件，并在名称末尾添加\
  \ `.java`。例如，如果类名是 `BananaNutellaPancake`，则文件名应该是 `BananaNutellaPancake.java`。\n\
  - `public static void main (String args[])` - 编译器将从 `main()` 方法开始处理程序。因此，没有 `main()`\
  \ 方法就无法在 Java 中编写程序。\n\n# 第 3 章：对象与类\n\n在各种类型的语言中，Java 被归类为面向对象的语言。所有面向对象的语言都支持以下基本概念：\n\
  \n- 多态：一个对象可以采取多种形式的情况。例如，`+` 既可以用于加法，也可以用于字符串的拼接。\n- 继承：子对象获得其父类属性的情况。\n- 封装：数据受到保护的情况。\n\
  - 抽象：类的声明已完全完成，但可以使用抽象类中存在的变量和方法以不同的方式编写功能的情况。\n- 类：对象是使用类创建的。类由成员变量和成员函数组成。它可以被视为一个蓝图。\n\
  - 对象：在面向对象编程中，对象起着至关重要的作用。对象执行所有功能。它们拥有状态（变量所在的地方）和行为（变量在放入特定方法时以特定方式运行）。\n- 实例：实例可以被视为声明在类内部但在类方法之外的变量。\n\
  - 方法：方法可以被视为用于执行特定任务的语句集合。\n\n## 更多关于 Java 中的对象\n\n你周围看到的任何具有物理特征的物理实体都可以被视为对象。所有这些都有可以观察到的状态和行为。\n\
  \n这些对象都有状态和行为。这些是现实世界的对象，现在让我们考虑软件对象，它们具有由变量显示的相似状态以及通过方法显示的行为。\n\nJava 类的示例：\n\n\
  ```java\npublic class Dog{\n    String breed;\n    int age;\n    String color;\n\
  \    void barking(){\n    }\n    void hungry(){\n    }\n    void sleeping(){\n \
  \   }\n}\n```\n\n有多种类型的变量，如局部变量、全局变量、类变量、实例变量。根据变量的作用范围，变量可以分为局部变量和全局变量。\n\n- 局部变量定义在函数内部，只能在函数内部使用。换句话说，局部变量在函数完成后就会销毁。\n\
  - 全局变量定义在外部，其作用范围贯穿整个程序。\n- 实例变量：实例变量声明在类内部但在方法之外。它们只能被该特定类的所有方法使用。\n- 实例变量：实例变量是类内部但在任何方法之外的变量。这些变量在类加载时被实例化。\n\
  - 类变量是与实例变量类似的变量。唯一的区别是它们是用 `static` 关键字声明的。\n\n一个类可以有多个变量和方法。\n\n# 第 4 章：构造函数\n\
  \n构造函数在涉及类时起着至关重要的作用。在创建类时可以显式创建构造函数，否则 Java 编译器会自动创建一个构造函数。每创建一个对象时，至少会调用一次构造函数。一个类可以有多个构造函数。构造函数的名称必须与类相同。每个构造函数都必须有一个析构函数。\n\
  \n构造函数的示例：\n\n```java\npublic class Puppy{\n    public Puppy(){\n    }\n    public\
  \ Puppy(String name) {\n        // 这个构造函数有一个参数，name。\n    }\n}\n```\n\n## 创建对象\n\
  \n如前所述，类为对象提供了蓝图。所以基本上对象是从类中创建的。在 Java 中，使用 `new` 关键字来创建新对象。\n\n从类创建对象有三个步骤：\n1.\
  \ 声明：带有对象类型和变量名称的变量声明。\n2. 实例化：使用 `new` 关键字创建对象。\n3. 初始化：`new` 关键字后紧跟对构造函数的调用。此调用初始化了新对象。\n\
  \n创建对象的示例所示：\n\n```java\npublic class Puppy{\n    public Puppy(String name) {\n\
  \        // 这个构造函数有一个参数，name。\n        System.out.println(\"Passed Name is :\" +\
  \ name );\n    }\n    public static void main(String args){\n        // 下述语句创建一个对象\
  \ myPuppy\n        Puppy myPuppy = new Puppy( \"jimmy\" );\n    }\n}\n```\n\n编译并运行上面的程序，将产生以下结果：\n\
  Passed Name is :jimmy\n\n## 访问实例变量和方法\n\n实例变量和方法通过创建的对象来访问。访问实例变量的完全限定路径如下：\n/*\
  \ 首先创建一个对象 */\n`ObjectReference = new Constructor();`\n/* 现在调用变量 */\n`ObjectReference.variableName;`\n\
  /* 现在你可以调用类方法 */\n`ObjectReference.MethodName();`\n\n示例：\n此示例解释了如何访问类的实例变量和方法：\n\
  \n```java\npublic class Puppy{\n    int puppyAge;\n    public Puppy(String name)\
  \ {\n        // 这个构造函数有一个参数，name。\n        System.out.println(\"Passed Name is :\"\
  \ + name );\n    }\n    public void setAge( int age ) {\n        puppyAge = age;\n\
  \    }\n    public int getAge( ) {\n        System.out.println(\"Puppy's age is\
  \ :\" + puppyAge );\n        return puppyAge;\n    }\n    public static void main(String\
  \ []args){\n        /* 对象创建 */\n        Puppy myPuppy = new Puppy( \"jimmy\" );\n\
  \        /* 调用类方法设置狗的年龄 */\n        myPuppy.setAge( 2 );\n        /* 调用另一个类方法获取狗的年龄\
  \ */\n        myPuppy.getAge( );\n        /* 你也可以这样访问实例变量 */\n        System.out.println(\"\
  Variable Value :\" + myPuppy.puppyAge );\n    }\n}\n```\n\n\n\n\n在此示例中，此行将告诉编译器加载存在\
  \ `java_installation/java/io` 目录中的类。\n\n```java\nimport java.io.*;\n```\n\n## 一个简单的案例研究\n\
  \n在这里，我们将创建两个类 `Employee` 和 `EmployeeTest` 进行案例研究。\n\n*   打开记事本并编写下方的代码。你应该记住这是\
  \ `Employee` 类，并且它是一个公共类（public class）。\n*   将此文件保存为 `Employee.java`。\n\n`Employee`\
  \ 类中存在四个实例变量，分别为 `name`、`age`、`designation` 和 `salary`。该类还有一个显式定义的构造方法。该构造方法接受一个参数。\n\
  \n### 示例：\n\n```java\nimport java.io.*;\n\npublic class Employee{\n\n  String name;\n\
  \  int age;\n  String designation;\n  double salary;\n\n  // 这是 Employee 类的构造方法\n\
  \n  public Employee(String name){\n    this.name = name;\n  }\n\n  // 将 Employee\
  \ 的年龄龄赋值给变量 age。\n\n  public void empAge(int empAge){\n    age =  empAge;\n  }\n\
  \n  /* 将职位赋值给变量 designation.*/\n  public void empDesignation(String empDesig){\n\
  \    designation = empDesig;\n  }\n\n  /* 将工资赋值给变量             salary.*/\n  public\
  \ void empSalary(double empSalary){\n    salary = empSalary;\n  }\n\n  /* 打印 Employee\
  \ 详情 */\n  public void printEmployee(){\n    System.out.println(\"Name:\"+ name\
  \ );\n    System.out.println(\"Age:\" + age );\n    System.out.println(\"Designation:\"\
  \ + designation );\n    System.out.println(\"Salary:\" + salary);\n  }\n\n}\n```\n\
  \n如之前提到的，程序的运行只有在 `main()` 方法之后才开始。因此，为了让这个 `Employee` 类运行，应该有一个 `main` 方法以及几个对象。对于这些任务，将单独创建一个类。\n\
  \n下面是 `EmployeeTest` 类，它创建了两个属于 `Employee` 类的实例。这些对象调用每个对象的方法，并为所有变量分配值。\n\n将给定的代码保存到\
  \ `EmployeeTest.java` 文件中。\n\n```java\nimport java.io.*;\n\npublic class EmployeeTest{\n\
  \n  public static void main(String args[]){\n    /* 使用构造方法创建两个对象 */\n    Employee\
  \ empOne = new Employee(\"James Smith\");\n    Employee empTwo = new Employee(\"\
  Mary Anne\");\n\n    // 为每个创建的对象调用方法\n    empOne.empAge(26);\n    empOne.empDesignation(\"\
  Senior Software Engineer\");\n    empOne.empSalary(1000);\n    empOne.printEmployee();\n\
  \n    empTwo.empAge(21);\n    empTwo.empDesignation(\"Software Engineer\");\n  \
  \  empTwo.empSalary(500);\n    empTwo.printEmployee();\n  }\n}\n```\n\n编译这两个类并运行\
  \ `EmployeeTest`，它将给出以下输出。\n\n```bash\nC :> javac Employee.java\nC :> vi EmployeeTest.java\n\
  C :> javac  EmployeeTest.java\nC :> java EmployeeTest\nName:James Smith\nAge:26\n\
  Designation:Senior Software Engineer\nSalary:1000.0\nName:Mary Anne\nAge:21\nDesignation:Software\
  \ Engineer\nSalary:500.0\n```\n\n# 第 6 章：Java 数据类型\n\n变量可以定义为用于存储值的内存位置的结果。当你创建一个变量时，你实际上是在系统上预留了内存空间。\n\
  \n操作系统将根据变量的数据类型分配内存。然后操作系统将决定在预留的内存中可以存储什么。不同的数据类型可以分配给变量，允许你在这些预留的空间或变量中存储字符、整数。\n\
  \n在 Java 中，有两种可用的数据类型。它们是：\n\n*   基本数据类型\n*   引用/对象数据类型\n\n## 基本数据类型：\n\nJava 支持八种基本数据类型。这些基本数据类型由关键字命名，并且是预定义的。现在我们来看\
  \ Java 中的这 8 种基本数据类型。\n\n### byte:\n\n*   `Byte` 数据类型是 8 位有符号补码整数。\n*   `byte` 的最小值为\
  \ `-128`（`-2⁷`）。\n*   `byte` 的最大值为 `127`（包含）（`2⁷ -1`）。\n*   `byte` 的默认值为 `0`。\n\
  *   使用 `byte` 数据类型可以为大数组节省空间，因为它是 `int` 的四分之一。\n*   示例：`byte x= 20, y= -4`\n\n###\
  \ short:\n\n*   `Short` 数据类型是 16 位有符号补码整数。\n*   `short` 可以存储的最小值为 `-32768`。\n* \
  \  `short` 可以存储的最大值为 `32767`（包含）（`2¹⁵ -1`）。*注：原文公式有误，应为 2¹⁵-1*。\n*   `short` 的默认值为\
  \ `0`。\n*   `short` 的大小是 `int` 的一半。\n*   `short` 默认 `0`。\n\n### int:\n\n*   `int`\
  \ 是 32 位有符号补码整数。\n*   `int` 可以存储的最小值为 `-2147483648`。\n*   `int` 可以存储的最大值为 `2147483647`（包含）（`2³¹\
  \ -1`）。\n*   `int` 的默认值为 `0`。\n*   `int` 是 `short` 的两倍。\n*   `int` 默认 `0`。\n*  \
  \ 示例：`int x= 10, y= -20`\n\n### long:\n\n*   `long` 是 64 位有符号补码整数。\n*   `long` 可以存储的最小值为\
  \ `-9223372036854775808`。\n*   `long` 可以存储的最大值为 `9223372036854775807`（包含）（`2⁶³ -1`）。\n\
  *   `long` 的默认值为 `0`。\n*   `long` 是 `int` 的两倍。\n*   `long` 默认 `0`。\n*   示例：`long\
  \ x= 100, y= -200`\n\n### float:\n\n*   `float` 数据类型是 32 位单精度 IEEE 754 浮点数。\n* \
  \  `float` 的最小值为约为 `-1.40128E-45`。\n*   `float` 的最大值为约为 `3.40282E+38`。\n*   `float`\
  \ 的默认值为 `0.0f`。\n*   `float` 是 `double` 的一半。\n*   示例：`float x= 10.5f, y= -20.2f`\n\
  \n### double:\n\n*   `double` 数据类型是 64 位双精度 IEEE 754 浮点数。\n*   `double` 的最小值为约为\
  \ `-4.9407E-324`。\n*   `double` 的最大值为约为 `1.79769E+308`。\n*   `double` 的默认值为 `0.0`。\n\
  *   `double` 是 `float` 的两倍。\n*   示例：`double x= 10.5, y= -20.2`\n\n### boolean:\n\
  \n*   `boolean` 数据类型表示一个位信息。\n*   `boolean` 数据类型只有两个值：真或假。\n*   该数据类型用于真假条件。\n*\
  \   `boolean` 的默认值为 `false`。\n*   示例：`boolean one = false;`\n\n### char:\n\n*  \
  \ `char` 数据类型是单个 16 位 Unicode 字符。\n*   `char` 的最小值为 `\\u0000`（或 0）。\n*   `char`\
  \ 的最大值为 `\\uffff`（或 65535）。\n*   `char` 的默认值为 `'\\u0000'`。\n*   示例：`char letterA='A'`\n\
