  md: "Run the program to get the following result.\n\n```\nException in thread \"\
    main\" java.lang.NullPointerException\nat\n  at com.google.common.base.Preconditions.checkNull(Preconditions.java:210)\n\
    \  at com.google.common.base.Optional.of(Optional.java:85)\n  at GuavaTester.main(GuavaTester.java:8)\n\
    ```\n\nLet's understand the important concepts of the above program.\n\n+   **Optional**\
    \ - A utility class, to make the code use null properly.\n* **Optional.of** -\
    \ It returns the instance of Optional class to be used as a parameter. It checks\
    \ the value passed, not to be 'null'.\n* **Optional.get** - It gets the value\
    \ of the input stored in the Optional class.\n\nUsing the Optional class, you\
    \ can check whether the caller method is passing a proper parameter or not."
