  md: '# 4. PRECONDITIONS CLASS


    Preconditions provide static methods to check that a method or a constructor is
    invoked with proper parameter or not. It checks the pre-conditions. Its methods
    throw IllegalArgumentException on failure.


    # Class Declaration


    Following is the declaration for com.google.common.base.Preconditions class:


    ```

    @GwtCompatible

    public final class Preconditions

    extends Object

    ```


    | S.N. | Method & Description |

    |---|---|n| 1 | **static void checkArgument(boolean expression)**

    ures the truth of an expression involving one or more parameters to the calling
    method. |

    | 2 | **static void checkArgument(boolean expression, Object errorMessage)**

    ures the truth of an expression involving one or more parameters to the calling
    method. |

    | 3 | **static void checkArgument(boolean expression, String errorMessageTemplate,
    Object. errorMessageArgs)**

    ures the truth of an expression involving one or more parameters to the calling
    method. |

    | 4 | **static int checkElementIndex(int index, int size)**

    ures that index specifies a valid element in an array, list or string of size.
    |

    | 5 | **static int checkElementIndex(int index, int size, String desc)**

    ures that index specifies a valid element in an array, list, or a string of size.
    |


