  md: "# 1. OVERVIEW\n\n# What is Guava?\n\nGuava is an open source, Java-based library\
    \ and contains many core libraries of Google, which are being used in many of\
    \ their projects. It facilitates best coding practices and helps reducing coding\
    \ errors. It provides utility methods for collections, caching, primitives support,\
    \ concurrency, common annotations, string processing, I/O, and validations.\n\n\
    # Benefits of Guava\n\n+   - Standardized - The Guava library is managed by Google.\n\
    - Efficient - It is a reliable, fast, and efficient extension to the Java library.\n\
    - Optimized - The library is highly optimized.\n- Functional Programming - It\
    \ adds functional processing capability to Java.\n- Utilities - It provides many\
    \ utility classes which are regularly required in programming application development.\n\
    - Validation - It provides a standard failsafe validation mechanism.\n- Best Practices\
    \ - It emphasizes on best practices.\n\nConsider the following code snippet.\n\
    \n```\npublic class GuavaTester {\n    public static void main(String args[]){\n\
    \        GuavaTester guavaTester = new GuavaTester();\n        Integer a = null;\n\
    \        Integer b = new Integer(10);\n        System.out.println(guavaTester.sum(a,b));\n\
    \    }\n\n    public Integer sum(Integer a, Integer b) {\n        return a + b;\n\
    \    }\n```"
  merge: -1
  pgno: 6
- img_proc: true
  md: "# Guava\n\nRun the program to get the following result.\n\n```\nException in\
    \ thread \"main\" java.lang.NullPointerException\natat GuavaTester.sum(GuavaTester.java:13)\n\
    atat GuavaTester.main(GuavaTester.java:9)\n```\n\nHere are the problems with the\
    \ code.\n\n+   - sum() is not taking care of any of the parameters to be passed\
    \ as null.\n- caller function is also not worried about passing a null to the\
    \ sum method accidentally.\n- When the program runs, NullPointerException occurs.\n\
    \nIn order to avoid the above problems, null check is to be made in each and every\
    \ place where such problems are present.\n\nLet's see the use of Optional, a Guava\
    \ provided Utility class, to solve the above problems in a standardized way.\n\
    \n```\nimport com.google.common.base.Optional;\n\npublic class GuavaTester {\n\
    \    public static void main(String args[]){\n        GuavaTester guavaTester\
    \ = new GuavaTester();\n\n        Integer invalidInput = null;\n        Optional<Integer>\
    \ a = Optional.of(invalidInput);\n        Optional<Integer> b = Optional.of(new\
    \ Integer(10));\n        System.out.println(guavaTester.sum(a,b));\n    }\n\n\
    \    public Integer sum(Optional<Integer> a, Optional<Integer> b){\n        return\
    \ a.get() + b.get();\n    }\n}\n```"
  merge: -1
