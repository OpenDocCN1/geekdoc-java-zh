    \ class GuavaTester {\n    public static void main(String args[]){\n        GuavaTester\
    \ guavaTester = new GuavaTester();\n\n        Integer value1 = null;\n       \
    \ Integer value2 = new Integer(10);\n        //Optional.fromNullable - allows\
