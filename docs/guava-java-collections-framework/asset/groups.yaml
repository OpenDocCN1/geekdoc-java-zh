    \ -1\nfalse Vs false: 0\ntrue Vs false: 1\ntrue Vs true: 0\n```\n\n# 13. 数学工具\n\
    \nGuava 提供了处理 int、long 和 BigInteger 的二项式数学相关工具类。以下是实用工具类列表：\n\n| 序号. | 工具类名称与描述\
