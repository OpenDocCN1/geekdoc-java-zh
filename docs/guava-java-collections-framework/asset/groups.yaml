  - "[PAGE 12]\n\n# 3. OPTIONAL CLASS\n\nOptional is an immutable object used to contain\
    \ a not-null object. Optional object is used to represent null with absent value.\
    \ This class has various utility methods to facilitate the code to handle values\
    \ as available or not available instead of checking null values.\n\n# Class Declaration\n\
    \nFollowing is the declaration for com.google.common.base.Optional<T> class:\n\
    \n```\n@GwtCompatible(serializable=true)\npublic abstract class Optional<T>\n\
    \    extends Object\nimplements Serializable\n```\n\n# Class Methods\n\n| S.N.\
    \ | Method & Description |\n|---|--|\n| 1 | static <T> Optional<T> absent()\n\
    Returns an Optional instance with no contained reference. |\n| 2 | abstract Set<T>\
    \ asSet()\nReturns an immutable Set where only element is the contained if it\
    \ is present; an empty immutable Set otherwise. |\n| 3 | abstract boolean equals(Object\
    \ object)\nReturns true if is an Optional instance, and either the contained references\
    \ are equal to each other or are absent. |\n| 4 | static <T> Optional<T> fromNullable(T\
    \ nullableReference)\nIf nullableReference is non-null, returns an Optional instance\
    \ containing that reference; otherwise returns absent(). |\n| 5 | abstract T get()\n\
    Returns the contained instance, which must be present. |\n| 6 | abstract int hashCode()\n\
    Returns a hash code for this instance. |\n\n![](img/4935a2238ac80b2a11ee9e7e607ee959_12_0.png)"
- md: "\n## Guava\n\n| | |\n|---|-|\n| 7 | abstract boolean isPresent()\n Returns\
    \ true if this holder contains a (non-null) instance. |\n| 8 | static <T> Optional<T>\
    \ of(T reference)\n Returns an Optional instance containing the given non-null\
    \ reference. |\n| 9 | abstract Optional<T> or(Optional<? extends T> secondChoice)\n\
    \ Returns this Optional if it has a value; secondChoice otherwise. |\n| 10 | abstract\
    \ T or(Supplier<? extends T> supplier)\n Returns the contained instance if it\
    \ is present; supplier.get() otherwise. |\n| 11 | abstract T or(T defaultValue)\n\
    \ Returns the contained instance if it is present; defaultValue otherwise. |\n\
    | 12 | abstract T orNull()\n Returns the contained instance if it is present;\
    \ null otherwise. |\n| 13 | static <T> Iterable<T> presentInstances(Iterable<?\
    \ extends T>> optionals)\n Returns the value of each present instance from the\
    \ supplied optionals, in\n order, skipping over occurrences of absent(). |\n|\
    \ 14 | abstract String toString()\n Returns a string representation for this instance.\
    \ |\n| 15 | abstract <V> Optional<V> transform(Function<? super T,V> function)\n\
    \ If the instance is present, it is transformed with the given Function;\n otherwise,\
    \ absent() is returned. |\n\n## Methods Inherited\n\nThis class inherits methods\
    \ from the following class:\n\n- java.lang.Object\n\n## Example of Optional Class\n\
    \nCreate the following java program using any editor of your choice in say C:/>\
    \ Guava.\n\n8\n\n![](img/4935a2238ac80b2a11ee9e7e607ee959_13_0.png)\n\n## GuavaTester.java\n\
    \n```java\nimport com.google.common.base.Optional;\n\npublic class GuavaTester\
    \ {\n    public static void main(String args[]){\n        GuavaTester guavaTester\
    \ = new GuavaTester();\n\n        Integer value1 = null;\n        Integer value2\
    \ = new Integer(10);\n        //Optional.fromNullable - allows passed parameter\
    \ to be null.\n        Optional<Integer> a = Optional.fromNullable(value1);\n\
    \        //Optional.of - throws NullPointerException if passed parameter is null\n\
    \        Optional<Integer> b = Optional.of(value2);\n\n        System.out.println(guavaTester.sum(a,b));\n\
    \    }\n\n    public Integer sum(Optional<Integer> a, Optional<Integer> b){\n\
    \        //Optional.isPresent - checks the value is present or not\n        System.out.println(\"\
    First parameter is present: \" + a.isPresent());\n\n        System.out.println(\"\
    Second parameter is present: \" + b.isPresent());\n\n        //Optional.or - returns\
    \ the value if present otherwise passed.\n        ///the default value passed.\n\
    \        Integer value1 = a.or(new Integer(0));\n\n        //Optional.get - gets\
    \ the value, value should be present\n        Integer value2 = b.get();\n\n  \
    \      return value1 + value2;\n    }\n}\n```\n\n## Guava\n\n## Verify the Result\n\
    \nCompile the class using javac compiler as follows:\n\n```\nC:\\Guava>javac GuavaTester.java\n\
    ```\n\nNow run the GuavaTester to see the result.\n\n```\nC:\\Guava>java GuavaTester\n\
    ```\n\nSee the result.\n\n```\nFirst parameter is present: false\nSecond parameter\
    \ is present: true\n10\n```\n\n## 4. PRECONDITIONS CLASS\n\nPreconditions provide\
    \ static methods to check that a method or a constructor is invoked with proper\
    \ parameter or not. It checks the pre-conditions. Its methods throw IllegalArgumentException\
    \ on failure.\n\n## Class Declaration\n\nFollowing is the declaration for com.google.common.base.Preconditions\
    \ class:\n\n```\n@GwtCompatible\npublic final class Preconditions\nextends Object\n\
    ```\n\n| S.N. | Method & Description |\n|---|---|\n| 1 | **static void checkArgument(boolean\
    \ expression)**\nEnsures the truth of an expression involving one or more parameters\
    \ to the calling method. |\n| 2 | **static void checkArgument(boolean expression,\
    \ Object errorMessage)**\nEnsures the truth of an expression involving one or\
    \ more parameters to the calling method. |\n| 3 | **static void checkArgument(boolean\
