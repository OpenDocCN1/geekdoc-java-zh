    \ into pieces of the given length. |\n| 2 | **Splitter limit(int limit)**<br>Returns\
    \ a splitter that behaves equivalently to this splitter but stops after it reaches\
    \ the limit. |\n| 3 | **Splitter omitEmptyStrings()**<br>Returns a splitter that\
    \ behaves equivalently to this splitter, but automatically omits empty strings\
    \ from the results. |\n| 4 | **static Splitter on(char separator)**<br>Returns\
    \ a splitter that uses the given single-character separator. |\n| 5 | **static\
    \ Splitter on(CharMatcher separatorMatcher)**<br>Returns a splitter that considers\
    \ any single character matched by the given CharMatcher to be a separator. |\n\
    | 6 | **static Splitter on(Pattern separatorPattern)**<br>Returns a splitter that\
    \ considers any subsequence pattern to be a separator. |\n| 7 | **static Splitter\
    \ on(String separator)**<br>Returns a splitter that uses the given fixed string\
    \ as a separator. |\n| 8 | **static Splitter onPattern(String separatorPattern)**<br>Returns\
    \ a splitter that considers any subsequence matching a given pattern (regular\
    \ expression) to be a separator. |\n| 9 | **Iterable<String> split(CharSequence\
    \ sequence)**<br>Splits sequence into string components and makes them available\
    \ through an Iterator, which may be lazily evaluated. |\n| 10 | **List<String>\
    \ splitToList(CharSequence sequence)**<br>Splits sequence into string components\
    \ and returns them as an immutable list. |\n| 11 | **Splitter trimResults()**<br>Returns\
    \ a splitter that behaves equivalently to this splitter, but automatically removes\
    \ leading and trailing whitespace from each substring; equivalent to trimResults(CharMatcher.WHITESPACE).\
    \ |\n| 12 | **Splitter.trimResults(CharMatcher trimmer)** Returns a splitter that\
    \ behaves equivalently to this splitter, but removes all leading or trailing characters\
    \ matching the CharMatcher from each returned substring. |\n| 13 | **Splitter.MapSplitterwithKeyValueSeparator(char\
    \ separator)** Returns a MapSplitter that splits entries based on this splitter,\
    \ and splits entries into keys and values using the specified separator. |\n|\
    \ 14 | **Splitter.MapSplitterwithKeyValueSeparator(Splitter keyValueSplitter)**\
    \ Returns a MapSplitter that splits entries based on this splitter, and splits\
    \ entries into keys and values using the specified key-value splitter. |\n| 15\
    \ | **Splitter.MapSplitterwithKeyValueSeparator(String separator)** Returns a\
    \ MapSplitter that splits entries based on this splitter, and splits entries into\
    \ keys and values using the specified separator. |\n\n# Methods Inherited\n\n\
    This class inherits methods from the following class:\n\n- java.lang.Object\n\n\
    # Example of Splitter Class\n\nCreate the following java program using any editor\
    \ of your choice in say C:\\Guava.\n\nGuavaTester.java\n\n```java\nimport com.google.common.base.Splitter;\n\
    \npublic class GuavaTester {\n    public static void main(String args[]){\n  \
    \      GuavaTester tester = new GuavaTester();\n        tester.testSplitter();\n\
    \    }\n\n    private void testSplitter(){\n    }\n}\n```\n\n```java\nSystem.out.println(Splitter.on(',')\n\
    \    .trimResults()\n    .omitEmptyStrings()\n    .split(\"the,quick, , brown\
    \ , fox, jumps,\nover, the, lazy, little dog.\")\n);\n```\n\n# Verify the Result\n\
    \nCompile the class using **javac compiler** as follows:\n\n```bash\nC:\\Guava>javac\
    \ GuavaTester.java\n```\n\nNow run the GuavaTester to see the result.\n\n```bash\n\
    C:\\Guava>java GuavaTester\n```\n\nSee the result.\n\n```\n[the, quick, brown,\
    \ fox, jumps, over, the, lazy, little dog.]\n```\n\n# CharMatcher Class\n\nCharMatcher\
    \ provides various methods to handle JAVA types for char values.\n\n# Class Declaration\n\
    \nFollowing is the declaration for **com.google.common.base.CharMatcher** class:\n\
    \n```java\n@GwtCompatible(emulated=true)\npublic final class CharMatcher\n   \
    \ extends Object\n```\n\n# Fields\n\n| S.N. | Field & Description |\n|---|---|\n\
    | 1 | static CharMatcher ANY <br> Matches any character. |\n| 2 | **static CharMatcher\
    \ ASCII** | Determines whether a character is ASCII, meaning that its code point\
    \ is less than 128. |\n| 3 | **static CharMatcher BREAKING_WHITESPACE** | Determines\
    \ whether a character is a breaking whitespace (that is, a whitespace which can\
    \ be interpreted as a break between words for formatting purposes). |\n| 4 | **static\
    \ CharMatcher DIGIT** | Determines whether a character is a digit according to\
    \ Unicode. |\n| 5 | **static CharMatcher INVISIBLE** | Determines whether a character\
    \ is invisible; that is, its Unicode category is any of SPACE_SEPARATOR, LINE_SEPARATOR,\
    \ PARAGRAPH_SEPARATOR, CONTROL, FORMAT, SURROGATE, and PRIVATE_USE using ICU4.\
    \ |\n| 6 | **static CharMatcher JAVA_DIGIT** | Determines whether a character\
    \ is a digit according to Java's definition. |\n| 7 | **static CharMatcher JAVA_ISO_CONTROL**\
    \ | Determines whether a character is an ISO control character as specified by\
    \ Char.isControl(char). |\n| 8 | **static CharMatcher JAVA_LETTER** | Determines\
    \ whether a character is a letter according to Java's definition. |\n| 9 | **static\
    \ CharMatcher JAVA_LETTER_OR_DIGIT** | Determines whether a character is a letter\
    \ or digit according to Java's definition. |\n| 10 | **static CharMatcher JAVA_LOWER_CASE**\
    \ | Determines whether a character is a lower case according to Java's definition.\
    \ |\n| 11 | **static CharMatcher JAVA_UPPER_CASE** | Determines whether a character\
    \ is an upper case according to Java's definition. |\n| 12 | **static CharMatcher\
    \ NONE** | Matches no characters. |\n| 13 | **static CharMatcher SINGLE_WIDTH**\
    \ | Determines whether a character is a single-width (not double-width). |\n|\
    \ 14 | **static CharMatcher WHITESPACE** | Determines whether a character is a\
    \ whitespace according to the latest Unicode standard, as illustrated here. |\n\
    \n# Constructor(s)\n\n| S.N. | Constructor & Description |\n|---|---|\n| 1 | **protected\
    \ CharMatcher()** Constructor for use by subclasses. |\n\n# Class Methods\n\n\
    | S.N. | Methods & Description |\n|---|---|\n| 1 | **CharMatcher and(CharMatcher\
    \ other)** Returns a matcher that matches any character matched by both matcher\
    \ and other. |\n| 2 | **static CharMatcher anyOf(CharSequence sequence)** Returns\
    \ a matcher that matches any character present in the given character sequence.\
    \ |\n| 3 | **boolean apply(Character character)** Deprecated. Provided only to\
    \ satisfy the Predicate interface; use matches(char) instead. |\n| 4 | **String\
    \ collapseFrom(CharSequence sequence, char replacement)** Returns a copy of the\
    \ input character sequence, with each group of consecutive characters that match\
    \ this matcher replaced by a single replacement character. |\n| 5 | **int countIn(CharSequence\
    \ sequence)** Returns the number of matching characters found in a sequence. |\n\
    | 6 | **static CharMatcher forPredicate(Predicate<? super Character> predicate)**\
    \ Returns a matcher with identical behavior to the Character-based predicate,\
    \ but operates on primitive char instead. |\n| 7 | **int indexIn(CharSequence\
    \ sequence)** Returns the index of the first matching character in a character\
    \ sequence, or -1 if no character is present. |\n| 8 | **int indexIn(CharSequence\
    \ sequence, int start)** Returns the index of the first matching character in\
    \ a character sequence, starting from a given position, or -1 if no character\
    \ matches after that position. |\n| 9 | **static CharMatcher inRange(char startInclusive,\
    \ char endInclusive)** Returns a matcher that matches any character in a range\
    \ (both endpoints are inclusive). |\n| 10 | **static CharMatcher is(char match)**\
    \ Returns a matcher that matches only one specified character. |\n| 11 | **static\
    \ CharMatcher isNot(char match)** Returns a matcher that matches any character\
    \ except the one specified. |\n| 12 | **int lastIndexOf(CharSequence sequence)**\
    \ Returns the index of the last matching character in a character sequence, or\
    \ -1 if no matching character is present. |\n| 13 | **abstract boolean matches(char\
    \ c)** Determines a true or false for the given character. |\n| 14 | **boolean\
    \ matchesAllOf(CharSequence sequence)** Returns true if a character sequence contains\
    \ only matching characters. |\n| 15 | **boolean matchesAnyOf(CharSequence sequence)**\
    \ Returns true if a character sequence contains at least one matching character.\
    \ |\n| 16 | **boolean matchesNoneOf(CharSequence sequence)** Returns true if a\
    \ character sequence contains no matching characters. |\n| 17 | **CharMatcher\
    \ negate()** Returns a matcher that matches any character not matched by this\
    \ matcher. |\n| 18 | **static CharMatcher noneOf(CharSequence sequence)** Returns\
    \ a matcher that matches any character not present in the sequence. |\n"
  mdcn: "\n\n# 类方法\n\n| S.N. | 方法与描述 |\n|---|---|\n| 1 | **static Splitter fixedLength(int\
    \ length)**<br>返回一个将字符串划分为给定长度片段分割器。 |\n| 2 | **Splitter limit(int limit)**<br>返回一个分割器，其行为与此分割器等效，但在达到限制后停止。\
    \ |\n| 3 | **Splitter omitEmptyStrings()**<br>返回一个分割器，其行为与此分割器等效，但会自动忽略结果中的空字符串。\
    \ |\n| 4 | **static Splitter on(char separator)**<br>返回一个使用单个字符分隔符的分割器。 |\n| 5\
    \ | **static Splitter on(CharMatcher separatorMatcher)**<br>返回一个分割器，它将任何被给定 CharMatcher\
    \ 匹配的单字符视为分隔符。 |\n| 6 | **static Splitter on(Pattern separatorPattern)**<br>返回一个分割器，它将任何子序列模式视为分隔符。\
    \ |\n| 7 | **static Splitter on(String separator)**<br>返回一个使用给定固定字符串作为分隔符的分割器。\
    \ |\n| 8 | **static Splitter onPattern(String separatorPattern)**<br>返回一个分割器，它将任何匹配给定模式（正则表达式）的子序列视为分隔符。\
    \ |\n| 9 | **Iterable<String> split(CharSequence sequence)**<br>将序列拆分为字符串组件，并通过\
    \ Iterator 提供支持，该 Iterator 可能是惰性求值的。 |\n| 10 | **List<String> splitToList(CharSequence\
    \ sequence)**<br>将序列拆分为字符串组件并以不可变列表的形式返回。 |\n| 11 | **Splitter trimResults()**<br>返回一个分割器，其行为与此分割器等效，但会自动移除每个子字符串前后的空白；等同于\
    \ trimResults(CharMatcher.WHITESPACE)。 |\n| 12 | **Splitter.trimResults(CharMatcher\
    \ trimmer)** 返回一个分割器，其行为与此分割器等效，但从每个返回的子字符串中移除匹配 CharMatcher 的所有前导或字符。 |\n| 13\
    \ | **Splitter.MapSplitterwithKeyValueSeparator(char separator)** 返回一个 MapSplitter，它根据此分割器拆分条目，并使用指定的分隔符将条目拆分为键值。\
    \ |\n| 14 | **Splitter.MapSplitterwithKeyValueSeparator(Splitter keyValueSplitter)**\
    \ 返回一个 MapSplitter，它根据此分割器拆分条目，并使用指定的键值分割器将条目拆分为键值。 |\n| 15 | **Splitter.MapSplitterwithKeyValueSeparator(String\
    \ separator)** 返回一个 MapSplitter，它根据此分割器拆分条目，并使用指定的分隔符将条目拆分为键值。 |\n\n# 继承的方法\n\n\
    该类继承自以下类的方法：\n\n- java.lang.Object\n\n# Splitter 类示例\n\n使用任任的编辑器在 C:\\Guava 中创建以下\
    \ Java 程序。\n\nGuavaTester.java\n\n```java\nimport com.google.common.base.Splitter;\n\
    \npublic class GuavaTester {\n    public static void main(String args[]){\n  \
    \      GuavaTester tester = new GuavaTester();\n        tester.testSplitter();\n\
    \    }\n\n    private void testSplitter(){\n    }\n}\n```\n\n```java\nSystem.out.println(Splitter.on(',')\n\
    \    .trimResults()\n    .omitEmptyStrings()\n    .split(\"the,quick, , brown\
    \ , fox, jumps,\nover, the, lazy, little dog.\")\n);\n```\n\n# 验证结果\n\n使用 **javac\
    \ 编译器** 如下编译类：\n\n```bash\nC:\\Guava>javac GuavaTester.java\n```\n\n现在运行 GuavaTester\
    \ 查看结果。\n\n```bash\nC:\\Guava>java GuavaTester\n```\n\n查看结果。\n\n```\n[the, quick,\
    \ brown, fox, jumps, over, the, lazy, little dog.]\n```\n\n# CharMatcher 类\n\n\
    CharMatcher 提供了各种方法来处理 char 值的 JAVA 类型。\n\n# 类声明\n\n以下是 **com.google.common.base.CharMatcher**\
    \ 类的声明：\n\n```java\n@GwtCompatible(emulated=true)\npublic final class CharMatcher\n\
    \    extends Object\n```\n\n# 字段\n\n| S.N. | 字段与描述 |\n|---|---|\n| 1 | static\
    \ CharMatcher ANY <br> 匹配任何字符。 |\n| 2 | **static CharMatcher ASCII** | 确定字符是否为\
    \ ASCII，意味着其代码点小于 128。 |\n| 3 | **static CharMatcher BREAKING_WHITESPACE** | 确定字符是否为换行空格（即可以为了格式化目的被解释为单词间断开的空白）。\
    \ |\n| 4 | **static CharMatcher DIGIT** | 根据 Unicode 确定字符是否为数字。 |\n| 5 | **static\
    \ CharMatcher INVISIBLE** | 确定字符是否不可见；即使用 ICU4 时，其 Unicode 类别为 SPACE_SEPARATOR,\
    \ LINE_SEPARATOR, PARAGRAPH_SEPARATOR, CONTROL, FORMAT, SURROGATE 和 PRIVATE_USE\
    \ 之一。 |\n| 6 | **static CharMatcher JAVA_DIGIT** | 根据 Java 的定义确定字符是否为数字。 |\n|\
    \ 7 | **static CharMatcher JAVA_ISO_CONTROL** | 确定字符是否为 Char.isControl(char) 指定的\
    \ ISO 控制字符。 |\n| 8 | **static CharMatcher JAVA_LETTER** | 根据 Java 的定义确定字符是否为字母。\
    \ |\n| 9 | **static CharMatcher JAVA_LETTER_OR_DIGIT** | 根据 Java 的定义确定字符是否为字母或数字。\
    \ |\n| 10 | **static CharMatcher JAVA_LOWER_CASE** | 根据 Java 的定义确定字符是否为小写。 |\n\
    | 11 | **static CharMatcher JAVA_UPPER_CASE** | 根据 Java 的定义确定字符是否为大写。 |\n| 12\
    \ | **static CharMatcher NONE** | 不匹配任何字符。 |\n| 13 | **static CharMatcher SINGLE_WIDTH**\
    \ | 确定字符是否为单宽（非双宽）。 |\n| 14 | **static CharMatcher WHITESPACE** | 根据最新的 Unicode\
    \ 标准（此处所示）确定字符是否为空白字符。 |\n\n# 构造函数\n\n| S.N. | 构造函数与描述 |\n|---|---|\n| 1 | **protected\
    \ CharMatcher()** 用于子类使用的构造函数。 |\n\n# 类方法\n\n| S.N. | 方法与描述 |\n|---|---|\n| 1\
    \ | **CharMatcher and(CharMatcher other)** 返回一个匹配此匹配器和 other 同时匹配的任何字符的匹配器。 |\n\
    | 2 | **static CharMatcher anyOf(CharSequence sequence)** 返回一个匹配序列中存在的任何字符的匹配器。\
    \ |\n| 3 | **boolean apply(Character character)** 已弃用。仅为了满足 Predicate 接口；请使用 matches(char)。\
    \ |\n| 4 | **String collapseFrom(CharSequence sequence, char replacement)** 返回输入序列的副本，其中每个匹配此匹配器的连续字符组都被替换为替换字符。\
    \ |\n| 5 | **int countIn(CharSequence sequence)** 返回序列中匹配字符的数量。 |\n| 6 | **static\
    \ CharMatcher forPredicate(Predicate<? super Character> predicate)** 返回一个与 Character\
    \ 行为相同的匹配器，但操作的是原始 char。 |\n| 7 | **int indexIn(CharSequence sequence)** 返回序列中第一个匹配字符的索引，如果不存在字符则返回\
    \ -1。 |\n| 8 | **int indexIn(CharSequence sequence, int start)** 返回从给定位置开始序列中第一个匹配字符的索引，如果该位置后没有匹配字符则返回\
    \ -1。 |\n| 9 | **static CharMatcher inRange(char startInclusive, char endInclusive)**\
    \ 返回一个匹配范围内任何字符的匹配器（包含两个端点）。 |\n| 10 | **static CharMatcher is(char match)** 返回一个仅匹配指定字符的匹配器。\
    \ |\n| 11 | **static CharMatcher isNot(char match)** 返回一个匹配指定字符之外任何字符的匹配器。 |\n\
    | 12 | **int lastIndexOf(CharSequence sequence)** 返回序列中最后一个匹配字符的索引，如果不存在匹配字符则返回\
    \ -1。 |\n| 13 | **abstract boolean matches(char c)** 对给定的字符判断真或假。 |\n| 14 | **boolean\
    \ matchesAllOf(CharSequence sequence)** 如果序列仅包含匹配字符，则返回 true。 |\n| 15 | **boolean\
    \ matchesAnyOf(CharSequence sequence)** 如果序列包含至少一个匹配字符，则返回 true。 |\n| 16 | **boolean\
    \ matchesNoneOf(CharSequence sequence)** 如果序列不包含任何匹配字符，则返回 true。 |\n| 17 | **CharMatcher\
    \ negate()** 返回一个匹配此匹配器未匹配的字符的匹配器。 |\n| 18 | **static CharMatcher noneOf(CharSequence\
    \ sequence)** 返回一个匹配序列中不存在的任何字符的匹配器。 |\n\n"
