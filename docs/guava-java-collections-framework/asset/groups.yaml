    \n## 7. RANGE 类\n\nRange 表示一个区间或序列。它用于获取位于特定范围内的数字/字符串集合。\n\n## 类声明\n\n以下是 com.google.common.collect.Range<C>\
    \ 类的声明：\n\n```java\n@GwtCompatible\npublic final class Range<C> extends Comparable<Object>\n\
    implements Predicate<C>, Serializable\n```\n\n## 方法\n\n| 序号 | 方法 & 描述 |\n|---|---|\n\
    | 1 | static <C extends Comparable<?>> Range<C> all() 返回一个包含类型 C 的所有值的范围。 |\n\
    | 2 | boolean apply(C input) 已弃用。仅为了满足 Predicate 接口；请改用 contains(C)。 |\n| 3 |\
    \ static <C extends Comparable<?>> Range<C> atLeast(endpoint) 返回一个包含所有大于或等于 endpoint\
    \ 值的范围。 |\n| 4 | static <C extends Comparable<?>> Range<C> atMost(endpoint) 返回一个包含所有小于或等于\
    \ endpoint 值的范围。 |\n| 5 | Range<C> canonical(DiscreteDomain<C> domain) 返回此范围在给定定义域中的规范形式。\
    \ |\n| 6 | static <C extends Comparable<?>> Range<C> closed(C lower, C upper)\
    \ 返回一个包含所有大于 lower 且小于等于 upper 的值的范围。 |\n| 7 | static <C extends Comparable<?>>\
    \ Range<C> closedOpen(C lower, C upper) 返回一个包含所有大于 lower 且小于 upper 的值的范围。 |\n\
    | 8 | boolean contains(C value) 如果 value 在此范围边界内则返回 true。 |\n| 9 | boolean containsAll(Iterable<?\
    \ extends C> values) 如果每个元素都包含在此范围内，则返回 true。 |\n| 10 | static <C extends Comparable<?>>\
    \ Range<C> downTo(C endpoint, BoundType endpoint) 返回一个从给定 endpoint 开始的范围，该端可以是包含（闭合）或不包含（开区间），且无上界。\
    \ |\n| 11 | static <C extends Comparable<?>> Range<C> encloseAll(Iterable<? extends\
    \ C> values) 返回包含所有给定值的最小范围。 |\n| 12 | boolean encloses(Range<C> other) 如果其他范围的边界没有扩展到此范围边界之外，则返回\
    \ true。 |\n| 13 | boolean equals(Object object) 如果 object 是一个与此范围具有相同端点和边界类型的范围，则返回\
    \ true。 |\n| 14 | static <C extends Comparable<?>> Range<C> greaterThan(C endpoint)\
    \ 返回一个包含所有严格大于 endpoint 值的范围。 |\n| 15 | int hashCode() 返回范围的哈希码值（hash code）。 |\n\
    | 16 | boolean hasLowerBound() 如果范围具有下端点，则返回 true。 |\n| 17 | boolean hasUpperBound()\
    \ 如果范围具有上端点，则返回 true。 |\n| 18 | boolean isConnected(Range<C> other) 如果存在由两者连接的（可能的）范围则返回\
    \ true。 |\n| 19 | boolean isEmpty() 如果范围为空，则返回 true。 |\n| 20 | static <C extends\
    \ Comparable<?>> Range<C> lessThan(C endpoint) 返回一个包含所有小于 endpoint 值的范围。 |\n|\
    \ 21 | C lowerEndpoint() 返回范围的下端点 |\n| 22 | static <C extends Comparable<?>> Range<C>\
    \ open(C lower, C upper) 返回一个包含所有大于 lower 且严格小于 upper 的值的范围。 |\n| 23 | static\
    \ <C extends Comparable<?>> Range<C> openClosed(C lower, C upper) 返回一个包含所有大于 lower\
    \ 且小于等于 upper 的值的范围。 |\n| 24 | static <C extends Comparable<?>> Range<C> range(C\
    \ lower, BoundType lowerType, C upper, BoundType upperType) 返回从 lower 到 upper\
    \ 的范围，每个端点可以是包含（闭合）或不包含（开区间）。 |\n| 25 | static <C extends Comparable<?>> Range<C>\
    \ singleton(C value) 返回包含给定值的范围。 |\n| 26 | Range<C> span(Range<C> other) 返回包含此范围和另一个范围的最小范围。\
    \ |\n| 27 | String toString() 返回范围的字符串表示，例如 \"[3..)\"（其他示例列在类文档）。 |\n| 28 | BoundType\
    \ lowerType() 如果包含下端点，则返回 CLOSED；否则返回 OPEN。 |\n| 29 | BoundType upperBoundType()\
    \ 如果包含上端点，则返回 CLOSED；否则返回 OPEN。 |\n| 30 | static <C extends Comparable<?>> Range<C>\
    \ upTo(C endpoint, BoundType boundType) 返回一个没有下界且直到给定端点 的范围，该端点可以是包含（闭合）或不包含（开区间）。\
