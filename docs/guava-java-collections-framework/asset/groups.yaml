- md: "\nLongMath Class....................................................................................\
    \ 112\nBigIntegerMath Class...............................................................................\
    \ 116\n\n## 1. OVERVIEW\n\n### What is Guava?\n\nGuava is an open source, Java-based\
    \ library and contains many core libraries of Google, which are being used in\
    \ many of their projects. It facilitates best coding practices and helps reducing\
    \ coding errors. It provides utility methods for collections, caching, primitives\
    \ support, concurrency, common annotations, string processing, I/O, and validations.\n\
    \n### Benefits of Guava\n\n- Standardized - The Guava library is managed by Google.\n\
    - Efficient - It is a reliable, fast, and efficient extension to the Java library.\n\
    - Optimized - The library is highly optimized.\n- Functional Programming - It\
    \ adds functional processing capability to Java.\n- Utilities - It provides many\
    \ utility classes which are regularly required in programming application development.\n\
    - Validation - It provides a standard failsafe validation mechanism.\n- Best Practices\
    \ - It emphasizes on best practices.\n\nConsider the following code snippet.\n\
    \n```java\npublic class GuavaTester {\n    public static void main(String args[]){\n\
    \        GuavaTester guavaTester = new GuavaTester();\n        Integer a = null;\n\
    \        Integer b = new Integer(10);\n        System.out.println(guavaTester.sum(a,b));\n\
    \    }\n\n    public Integer sum(Integer a, Integer b) {\n        return a + b;\n\
    \    }\n}\n```\n\n### Guava\n\nRun the program to get the following result.\n\n\
    ```\nException in thread \"main\" java.lang.NullPointerException\nat GuavaTester.sum(GuavaTester.java:13)\n\
    at GuavaTester.main(GuavaTester.java:9)\n```\n\nHere are the problems with the\
    \ code.\n\n- sum() is not taking care of any of the parameters to be passed as\
    \ null.\n- caller function is also not worried about passing a null to the sum\
    \ method accidentally.\n- When the program runs, NullPointerException occurs.\n\
    \nIn order to avoid the above problems, a null check is to be made in each and\
    \ every place where such problems are present.\n\nLet's see the use of Optional,\
    \ a Guava provided Utility class, to solve the above problems in a standardized\
    \ way.\n\n```java\nimport com.google.common.base.Optional;\n\npublic class GuavaTester\
    \ {\n    public static void main(String args[]){\n        GuavaTester guavaTester\
    \ = new GuavaTester();\n\n        Integer invalidInput = null;\n        Optional<Integer>\
    \ a = Optional.of(invalidInput);\n        Optional<Integer> b = Optional.of(new\
    \ Integer(10));\n        System.out.println(guavaTester.sum(a,b));\n    }\n\n\
    \    public Integer sum(Optional<Integer> a, Optional<Integer> b){\n        return\
    \ a.get() + b.get();\n    }\n}\n```\n\nRun the program to get the following result.\n\
    \n```\nException in thread \"main\" java.lang.NullPointerException\nat\n  at com.google.common.base.Preconditions.checkNull(Preconditions.java:210)\n\
    \  at com.google.common.base.Optional.of(Optional.java:85)\n  at GuavaTester.main(GuavaTester.java:8)\n\
    ```\n\nLet's understand the important concepts of the above program.\n\n- **Optional**\
    \ - A utility class, to make the code use null properly.\n- **Optional.of** -\
    \ It returns the instance of Optional class to be used as a parameter. It checks\
    \ the value passed, not to be 'null'.\n- **Optional.get** - It gets the value\
    \ of the input stored in the Optional class.\n\nUsing the Optional class, you\
    \ can check whether the caller method is passing a proper parameter or not.\n\n\
    ## 2. ENVIRONMENT SETUP\n\n### Try it Option Online\n\nWe have setup a Java Programming\
    \ environment online, so that you can compile and execute all the available examples\
    \ online at the same time when you are doing your theory work. This gives you\
    \ confidence in what you are reading and to check the result with different options.\
    \ Feel free to modify any example and execute it.\n\nTry following example using\
    \ the Try it (http://compileonline.com/) option available at the top right corner\
    \ of the code boxes in our website:\n\n```java\npublic class MyFirstJavaProgram\
    \ {\n    public static void main(String [args]) {\n        System.out.println(\"\
    Hello World\");\n    }\n}\n```\n\nFor most of the examples given in this tutorial,\
    \ you will find a Try it option, provided with the sole intention to make your\
    \ learning more enjoyable.\n\n### Local Environment Setup\n\nIf you are still\
    \ willing to set up your environment for Java programming language, this section\
    \ guides you on how to download and set Java on your machine. Please follow the\
    \ steps mentioned below to set up the environment.\n\nJava SE is freely available\
    \ from the link http://www.oracle.com/technet/java/javase/downloads/index-jdk5-jsp-142662.html.\
    \ So you download a version based on your operating system.\n\nFollow the instructions\
    \ to download Java and run the .exe to install Java on your machine. Once you\
    \ have installed Java on your machine, you would need to set environment variables\
    \ to correct installation directories:\n\n#### Setting up the Path for Windows\
    \ 2000/XP\n\nWe are assuming that you have installed Java in c:\\Program Files\\\
    java\\jdk directory:\n\n![](img/4935a2238ac80b2a11ee9e7e607ee955_9_0.png)\n\n\
    - Right-click on 'My Computer' and select 'Properties'.\n- Click on the 'Environment\
    \ variables' button under the 'Advanced' tab.\n- Now, alter the 'Path' variable\
    \ so that it also contains the path to the Java executable. Example, if the path\
    \ is currently set to `C:\\WINDOWS\\SYSTEM32`, then change your path to read `C:\\\
    WINDOWS\\SYSTEM32;c:\\Program Files\\java\\jdk`.\n\n#### Setting up the Path for\
    \ Windows 95/98/ME\n\nWe are assuming that you have installed Java in c:\\Program\
    \ Files\\jdk directory:\n\n- Edit the 'C:\\autoexec.bat file and add the following\
    \ line at the end: `SET PATH=%PATH%%;c:\\Program Files\\java\\jdk\\bin`\n\n####\
    \ Setting up the Path for Linux, UNIX, Solaris, FreeBSD\n\nEnvironment variable\
    \ PATH should be set to point to where the Java binaries have been installed.\
    \ Refer to your shell documentation if you have trouble doing this.\n\nExample,\
    \ if you use bash as your shell, then you would add the following line to the\
    \ end of your .bashrc: `export PATH=/path/to`\n\n### Popular Editors\n\nTo write\
    \ Java programs, you need an editor. There are many editors:\n\n- Notepad: On\
    \ Windows, simple text editor.\n- Netbeans: It is a Java IDE.\n- Eclipse: It is\
    \ also a Java IDE.\n\n### Download Guava Archive\n\nDownload the latest version\
    \ of guava-18.jar. At the time of writing, we have copied it into C:\\Guava.\n\
    \n![](img/4935a2238ac80b2a11ee9e7e607ee959_10_0)\n\n## 3. OPTIONAL CLASS\n\nOptional\
    \ is an immutable object used to contain a not-null object. Optional object is\
    \ used to represent null with absent value. This class has various utility methods\
    \ to facilitate the code to handle values as available or not instead of checking\
    \ null values.\n\n### Class Declaration\n\nFollowing is the declaration for com.google.common.base.Optional<T>\
    \ class:\n\n```java\n@GwtCompatible(serializable=true)\npublic abstract class\
    \ Optional<T>\n    extends Object\nimplements Serializable\n```\n\n### Class Methods\n\
    \n| S.N. | Method & Description |\n|---|--|\n| 1 | static <T> Optional<T> absent()\n\
    Returns an Optional instance with no contained reference. |\n| 2 | abstract Set<T>\
    \ asSet()\nReturns an immutable Set where only element is the contained if it\
    \ is present; an empty immutable Set otherwise. |\n| 3 | abstract boolean equals(Object\
    \ object)\nReturns true if is an Optional instance, and either the contained references\
