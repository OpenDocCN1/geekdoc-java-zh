    \ java.lang.NullPointerException\nat GuavaTester.sum(GuavaTester.java:13)\nat\
    \ GuavaTester.main(GuavaTester.java:9)\n```\n\n以下是代码中的问题。\n\n- sum() 没有考虑可能作为\
