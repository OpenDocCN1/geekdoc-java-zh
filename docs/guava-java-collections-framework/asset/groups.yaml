    \ Returns the canonical form of this range in the given domain. |\n| 6 | static\
    \ <C extends Comparable<?>> Range<C> closed(C lower, C upper) Returns a range\
    \ that contains all values greater than or equal to lower and less than or equal\
    \ to upper. |\n| 7 | static <C extends Comparable<?>> Range<C> closedOpen(C lower,\
    \ C upper) Returns a range that contains all values greater than or equal to lower\
    \ and strictly less than upper. |\n| 8 | boolean contains(C value) Returns true\
    \ if value is within the bounds of this range. |\n| 9 | boolean containsAll(Iterable<?\
    \ extends C> values) Returns true if every element is contained in this range.\
