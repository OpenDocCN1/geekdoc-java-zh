    # 12. PRIMITIVE UTILITIES


    As primitive types of Java cannot be used to pass in generics or in collections
    as input, Guava provided a lot of Wrapper Utilities classes to handle primitive
    types as Objects. Following is the list of useful primitive processing utilities:


    | S.N. | Utility name & Description |

    | --- | --- |

    | 1 | **Bytes**

    Utility for primitive byte. |

    | 2 | **Shorts**

    Utility for primitive short. |

    | 3 | **Ints**

    Utility for primitive int. |

    | 4 | **Longs**

    Utility for primitive long. |

    | 5 | **Floats**

    Utility for primitive float. |

    | 6 | **Doubles**

    Utility for primitive double. |

    | 7 | **Chars**

    Utility for primitive char. |

    | 8 | **Booleans**

    Utility for primitive boolean. |


