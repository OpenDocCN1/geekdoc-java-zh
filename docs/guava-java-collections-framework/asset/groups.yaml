    \n为了避免上述问题，必须在出现此类问题的每个地方都进行 null 检查。\n\n让我们看看使用 Guava 提供的工具类 `Optional` 来以标准化的方式解决上述问题。\n\
    \n```java\nimport com.google.common.base.Optional;\n\npublic class GuavaTester\
