    # 10. CACHING UTILITIES


    Guava provides a very powerful memory based caching mechanism by an interface
    LoadingCache<K,V>. Values are automatically loaded in the cache and it provides
    many utility methods useful for caching needs.


    # Interface Declaration


    Following is the declaration for com.google.common.cache.LoadingCache<K,V> interface:


    ```

    @Beta

    @GwtCompatible

    public interface LoadingCache<K,V>

    extends Cache<K,V>, Function<K,V>>

    ```


    # Interface Methods


    | S.N. | Method & Description |

    |---|--|

    | 1 | **V apply(K key)**

    >Deprecated. Provided to satisfy the Function interface; use get(K) or getUnchecked(K)
    instead. |

    | 2 | **ConcurrentMap<K,V> asMap()**

    >Returns a view of the entries stored in this cache as a thread-safe map. |

    | 3 | **V get(K key)**

    >Returns the value associated with key in this cache, first loading that value
    if necessary. |

    | 4 | **ImmutableMap<K,V> getAll(Iterable<? extends K> keys)**

    >Returns a map of the values associated with keys, creating or retrieving those
    values if necessary. |

    | 5 | **V getUnchecked(K key)**

    >Returns the value associated with key in this cache, first loading that value
    if necessary. |

    | 6 | void refresh(K key) |'
