    \ (closed) or exclusive (open), with no upper bound. |\n| 11 | static <C extends\
    \ Comparable<?>> Range<C> encloseAll(Iterable<? extends C> values) Returns the\
    \ minimal range that contains all of the given values. |\n| 12 | boolean encloses(Range<C>\
    \ other) Returns true if the bounds of other do not extend outside the bounds\
    \ of this range. |\n| 13 | boolean equals(Object object) Returns true if object\
    \ is a range having the same endpoints and bound types as this range. |\n| 14\
    \ | static <C extends Comparable<?>> Range<C> greaterThan(C endpoint) Returns\
    \ a range that contains all values strictly greater than endpoint. |\n| 15 | int\
    \ hashCode() Returns a hash code for range. |\n| 16 | boolean hasLowerBound()\
    \ Returns true if range has a lower endpoint. |\n| 17 | boolean hasUpperBound()\
    \ Returns true if range has an upper endpoint. |\n| 18 | boolean isConnected(Range<C>\
    \ other) Returns true if there exists a (possibly empty) range connected by both.\
    \ |\n| 19 | boolean isEmpty() Returns true if range is empty. |\n| 20 | static\
