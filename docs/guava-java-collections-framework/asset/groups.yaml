    \ greater than lower and strictly less than upper. |\n| 23 | static <C extends\
    \ Comparable<?>> Range<C> openClosed(C lower, C upper) Returns a range that contains\
    \ all values strictly greater than lower and less or equal to upper. |\n| 24 |\
    \ static <C extends Comparable<?>> Range<C> range(C lower, BoundType lowerType,\
    \ C upper, BoundType upperType) Returns range from lower to upper, where each\
    \ endpoint may be inclusive (closed) or exclusive (open). |\n| 25 | static <C\
