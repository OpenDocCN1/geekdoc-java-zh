    # 关于教程


    Guava 是由 Google 开发的一款基于 Java 的开源库。它有助于遵循最佳编码实践并减少编码错误。它为集合、缓存、基本类型支持、并发、常用注解、字符串处理、I/O
    和校验提供了实用方法。


    本教程采用简单直观的方式描述 Guava 从基础到高级的概念以及如何使用其 API。


    # 读者群


    本教程对于大多数 Java 开发人员（从入门到专家）都有帮助。完成本教程后，我们有信心你发现可以在程序中轻松使用 Guava。


