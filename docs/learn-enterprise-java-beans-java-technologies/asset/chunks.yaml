    ## EJBTester (EJB Client)


    ### jndi.properties


    java.naming.factory.initial=org.jnp.interfaces.NamingContextFactory


    java.naming.factory.url.pkgs=org.jboss.naming:org.jnp.interfaces


    java.naming.provider.url=localhost


    *   These properties are used to initialize the InitialContext object of java
    naming service.


    *   InitialContext object will be used to lookup stateless session bean.


    ### EJBTester.java


    package com.tutorialspoint.test;


    import com.tutorialspoint.stateful.LibraryBeanRemote;


    import java.io.BufferedReader;


    import java.io.FileInputStream;


    import java.io.IOException;


    import java.io.InputStreamReader;


    import java.util.List;


    import java.util.Properties;


    import javax.naming.InitialContext;


    import javax.naming.NamingException;


    public  class  EJBTester  {


    BufferedReader brConsoleReader =  null;


    Properties props;


    InitialContext ctx;


    {


    props =  new  Properties();


    try  {


    props.load(new  FileInputStream("jndi.properties"));


    }  catch  (IOException ex)  {


    ex.printStackTrace();


    }


    try  {


    ctx =  new  InitialContext(props);


    }  catch  (NamingException ex)  {


    ex.printStackTrace();


    }


    brConsoleReader =


    new  BufferedReader(new  InputStreamReader(System.in));


    }


    public  static  void main(String[] args)  {


    EJBTester ejbTester =  new  EJBTester();


    ejbTester.testInterceptedEjb();


    }


    private  void showGUI()  {


    System.out.println("**********************");


    System.out.println("Welcome to Book Store");


    System.out.println("**********************");


    System.out.print("Options \n1\. Add Book\n2\. Exit \nEnter Choice: ");


    }


    private  void testInterceptedEjb()  {


    try  {


    int choice =  1;


    LibraryBeanRemote libraryBean =


    LibraryBeanRemote)ctx.lookup("LibraryBean/remote");


    while  (choice !=  2)  {


    String bookName;


    showGUI();


    String strChoice = brConsoleReader.readLine();


    choice =  Integer.parseInt(strChoice);


    if  (choice ==  1)  {


    System.out.print("Enter book name: ");


    bookName = brConsoleReader.readLine();


    Book book =  new  Book();


    book.setName(bookName);


    libraryBean.addBook(book);


    }  else  if  (choice ==  2)  {


    break;


    }


    }


    List<Book> booksList = libraryBean.getBooks();


    System.out.println("Book(s) entered so far: "  + booksList.size());


    int i =  0;


    for  (Book book:booksList)  {


    System.out.println((i+1)+". "  + book.getName());


    i++;


    }


    }  catch  (Exception e)  {


    System.out.println(e.getMessage());


    e.printStackTrace();


    }finally  {


    try  {


    if(brConsoleReader !=null)  {


    brConsoleReader.close();


    }


    }  catch  (IOException ex)  {


    System.out.println(ex.getMessage());


    }


    }


    }


    }


    EJBTester performs the following tasks −


    *   Load properties from jndi.properties and initialize the InitialContext object.


    *   In testInterceptedEjb() method, jndi lookup is done with the name - "LibraryBean/remote"
    to obtain the remote business object (stateless EJB).


    *   Then user is shown a library store User Interface and he/she is asked to enter
    a choice.


    *   If the user enters 1, the system asks for book name and saves the book using
    stateless session bean addBook() method. Session Bean is storing the book in its
    instance variable.


    *   If the user enters 2, the system retrieves books using stateless session bean
    getBooks() method and exits.


    ## Run Client to Access EJB


    Locate EJBTester.java in project explorer. Right click on EJBTester class and
    select **run file**.


    Verify the following output in Netbeans console.


    run:


    **********************


    Welcome to Book Store


    **********************


    Options


    1\. Add Book


    2\. Exit


    Enter Choice: 1


    Enter book name: Learn Java


    **********************


    Welcome to Book Store


    **********************


    Options


    1\. Add Book


    2\. Exit


    Enter Choice: 2


    Book(s) entered so far: 1


    1\. Learn Java


    BUILD SUCCESSFUL (total time: 13 seconds)'
