  trans: "\n\n* `name` — 用于指定会话豆（session bean）的名称。\n* `mappedName` — 用于指定会话豆的 JNDI\
    \ 名称。\n* `description` — 用于提供会话豆的描述。\n\n| ID | Class | Description |\n| :--- |\
    \ :--- | :--- |\n| 2 | `javax.ejb.Stateful` | 指定指定的 EJB 类是有状态的会话豆（stateful session\
