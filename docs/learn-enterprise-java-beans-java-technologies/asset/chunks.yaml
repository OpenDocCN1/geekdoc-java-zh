    \ = new InitialContext(props);\n        } catch (NamingException ex) {\n     \
    \       ex.printStackTrace();\n        }\n        brConsoleReader = new BufferedReader(new\
    \ InputStreamReader(System.in));\n    }\n\n    public static void main(String[]\
    \ args) {\n        EJBTester ejbTester = new EJBTester();\n        ejbTester.testEntityEjb();\n\
    \    }\n\n    private void showGUI() {\n        System.out.println(\"**********************\"\
    );\n        System.out.println(\"Welcome to Book Store\");\n        System.out.println(\"\
    **********************\");\n        System.out.print(\"Options \\n1\\. Add Book\\\
    n2\\. Exit \\nEnter Choice: \");\n    }\n\n    private void testEntityEjb() {\n\
    \        try {\n            int choice = 1;\n            LibraryPersistentBeanRemote\
    \ libraryBean = (LibraryPersistentBeanRemote)ctx.lookup(\"LibraryPersistentBean/remote\"\
    );\n            while (choice != 2) {\n                String bookName;\n    \
    \            showGUI();\n                String strChoice = brConsoleReader.readLine();\n\
    \                choice = Integer.parseInt(strChoice);\n                if (choice\
    \ == 1) {\n                    System.out.print(\"Enter book name: \");\n    \
    \                bookName = brConsoleReader.readLine();\n                    Book\
    \ book = new Book();\n                    book.setName(bookName);\n          \
    \          libraryBean.addBook(book);\n                } else if (choice == 2)\
    \ {\n                    break;\n                }\n            }\n          \
    \  List<Book> booksList = libraryBean.getBooks();\n            System.out.println(\"\
    Book(s) entered so far: \" + booksList.size());\n            int i = 0;\n    \
    \        for (Book book:booksList) {\n                System.out.println((i+1)+\"\
    . \" + book.getName());\n                i++;\n            }\n        } catch\
    \ (Exception e) {\n            System.out.println(e.getMessage());\n         \
    \   e.printStackTrace();\n        } finally {\n            try {\n           \
    \     if(brConsoleReader !=null) {\n                    brConsoleReader.close();\n\
    \                }\n            } catch (IOException ex) {\n                System.out.println(ex.getMessage());\n\
    \            }\n        }\n    }\n}\n```\n\n`EJBTester` 执行了以下任务。\n\n*   从 `jndi.properties`\
    \ 加载属性并初始化 `InitialContext` 对象。\n*   在 `testStatefulEjb()` 方法中，使用名称 `\"LibraryStatefulSessionBean/remote\"\
    ` 进行 jndi 查找，以获取远程业务对象（有状态 ejb）。\n*   然后向用户显示书店用户界面，并要求其输入选择。\n*   如果用户输入 1，系统会提示书名并使用无状态会话豆的\
    \ `addBook()` 方法保存书籍。Session Bean 通过调用 `EntityManager` 在数据库中持久化书籍。\n*   如果用户输入\
    \ 2，系统使用有状态会话豆的 `getBooks()` 方法检索书籍并退出。\n*   然后再次使用名称 `\"LibraryStatelessSessionBean/remote\"\
    ` 进行另一个 jndi 查找，以再次获取远程业务对象（无状态 EJB）并列出书籍。\n\n## 运行客户端以访问 EJB\n\n在项目管理器中找到 `EJBTester.java`。右键点击\
    \ `EJBTester` 类并选择 `run file`。\n\n在 Netbeans 控制台中核实以下输出：\n\n```\nrun:\n**********************\n\
    Welcome to Book Store\n**********************\nOptions\n1\\. Add Book\n2\\. Exit\n\
    Enter Choice: 1\nEnter book name: Learn Java\n**********************\nWelcome\
    \ to Book Store\n**********************\nOptions\n1\\. Add Book\n2\\. Exit\nEnter\
    \ Choice: 2\nBook(s) entered so far: 1\n1\\. learn java\nBUILD SUCCESSFUL (total\
    \ time: 15 seconds)\n```\n\n## 再次运行客户端以访问 EJB\n\n在访问 EJB 之前重启 JBoss。\n\n在项目管理器中找到\
    \ `EJBTester.java`。右键点击 `EJBTester` 类并选择 `run file`。\n\n在 Netbeans 控制台中核实以下输出。\n\
    \n```\nrun:\n**********************\nWelcome to Book Store\n**********************\n\
    Options\n1\\. Add Book\n2\\. Exit\nEnter Choice: 1\nEnter book name: Learn Spring\n\
    **********************\nWelcome to Book Store\n**********************\nOptions\n\
    1\\. Add Book\n2\\. Exit\nEnter Choice: 2\nBook(s) entered so far: 1\n1\\. learn\
    \ java\nBUILD SUCCESSFUL (total time: 15 seconds)\n```\n"
- fmt: "\n## Project Steps\n\n1. Create a project with a name `EjbComponent` under\
    \ a package `com.tutorialspoint.entity` as explained in the `EJB - Create Application`\
    \ chapter. You can also use the project created in `EJB - Create Application`\
    \ chapter as such for this chapter to understand EJB persistence concepts.\n\n\
    2. Create `Book.java` under package `com.tutorialspoint.entity` as created in\
    \ `EJB-Persistence` chapter.\n\n3. Create `LibraryPersistentBean.java` and `LibraryPersistentBeanRemote`\
    \ as created in `EJB-Persistence` chapter.\n\n4. Create `jboss-ds.xml` in `EjbComponent\
    \ > setup` folder and `persistence.xml` in `EjbComponent > src > conf` folder.\
    \ These folders can be seen in files tab in Netbeans as created in `EJB-Persistence`\
    \ chapter.\n\n5. Create `LibraryMessageBean.java` under a package `com.tutorialspoint.messagebean`\
    \ and modify it as shown below.\n\n6. Create `BookQueue` queue in Jboss as described\
    \ above.\n\n7. Clean and Build the application to make sure business logic is\
    \ working as per the requirements.\n\n8. Finally, deploy the application in the\
    \ form of jar file on JBoss Application Server. JBoss Application server will\
    \ get started automatically if it is not started yet.\n\n9. Now create the EJB\
    \ client, a console based application in the same way as explained in the `EJB\
    \ - Create Application` chapter under topic `Create Client to access EJB`. Modify\
    \ it as shown below.\n\n## EJBComponent (EJB Module)\n\n### LibraryMessageBean.java\n\
    \n```java\npackage com.tutorialspoint.messagebean;\n\nimport com.tutorialspoint.entity.Book;\n\
    \nimport com.tutorialspoint.stateless.LibraryPersistentBeanRemote;\n\nimport javax.annotation.Resource;\n\
    \nimport javax.ejb.ActivationConfigProperty;\nimport javax.ejb.EJB;\nimport javax.ejb.MessageDriven;\n\
    import javax.ejb.MessageDrivenContext;\nimport javax.jms.JMSException;\nimport\
    \ javax.jms.Message;\nimport javax.jms.MessageListener;\nimport javax.jms.ObjectMessage;\n\
    \n@MessageDriven(\nname =  \"BookMessageHandler\",\nactivationConfig =  {\n@ActivationConfigProperty(\
    \ propertyName =  \"destinationType\",\npropertyValue =  \"javax.jms.Queue\"),\n\
    @ActivationConfigProperty( propertyName =  \"destination\",\npropertyValue =\"\
    /queue/BookQueue\")\n}\n)\npublic  class  LibraryMessageBean  implements  MessageListener\
    \ {\n@Resource\nprivate  MessageDrivenContext mdctx;\n\n@EJB\nLibraryPersistentBeanRemote\
    \ libraryBean;\n\npublic  LibraryMessageBean()  {\n}\n\npublic  void onMessage(Message\
    \ message)  {\nObjectMessage objectMessage =  null;\ntry  {\nobjectMessage = \
    \ (ObjectMessage) message;\nBook book =  (Book) objectMessage.getObject();\nlibraryBean.addBook(book);\n\
    }  catch  (JMSException ex)  {\nmdctx.setRollbackOnly();\n}\n}\n}\n```\n\n## EJBTester\
    \ (EJB Client)\n\n### EJBTester.java\n\n```java\npackage com.tutorialspoint.test;\n\
    \nimport com.tutorialspoint.entity.Book;\nimport com.tutorialspoint.stateless.LibraryPersistentBeanRemote;\n\
    import java.io.BufferedReader;\nimport java.io.FileInputStream;\nimport java.io.IOException;\n\
    import java.io.InputStreamReader;\nimport java.util.List;\nimport java.util.Properties;\n\
    import javax.jms.ObjectMessage;\nimport javax.jms.Queue;\nimport javax.jms.QueueConnection;\n\
    import javax.jms.QueueConnectionFactory;\nimport javax.jms.QueueSender;\nimport\
    \ javax.jms.QueueSession;\nimport javax.naming.InitialContext;\nimport javax.naming.NamingException;\n\
    \npublic  class  EJBTester  \nBufferedReader brConsoleReader =  null;\nProperties\
    \ props;\nInitialContext ctx;\n{\nprops =  new  Properties();\ntry  {\nprops.load(new\
    \  FileInputStream(\"jndi.properties\"));\n}  catch  (IOException ex)  {\nex.printStackTrace();\n\
    }\ntry  {\nctx =  new  InitialContext(props);\n}  catch  (NamingException ex)\
    \  {\nex.printStackTrace();\n}\nbrConsoleReader =\nnew  BufferedReader(new  InputStreamReader(System.in));\n\
    }\n\npublic  static  void main(String[] args)  {\nEJBTester ejbTester =  new \
    \ EJBTester();\nejbTester.testMessageBeanEjb();\n}\n\nprivate  void showGUI()\
    \  {\nSystem.out.println(\"**********************\");\nSystem.out.println(\"Welcome\
    \ to Book Store\");\nSystem.out.println(\"**********************\");\nSystem.out.print(\"\
    Options \\n1\\. Add Book\\n2\\. Exit \\nEnter Choice: \");\n}\n\nprivate  void\
    \ testMessageBeanEjb()  {\ntry  {\nint choice =  1;\nQueue queue =  (Queue) ctx.lookup(\"\
    /queue/BookQueue\");\nQueueConnectionFactory factory =\n(QueueConnectionFactory)\
    \ ctx.lookup(\"ConnectionFactory\");\nQueueConnection connection = factory.createConnection();\n\
    QueueSession session = connection.createSession(false, QueueSession.AUTO_ACKNOWLEDGE);\n\
    QueueSender sender = session.createSender(queue);\nwhile (choice != 2)  {\nshowGUI();\n\
    String strChoice = brConsoleReader.readLine();\nchoice =  Integer.parseInt(strChoice);\n\
    if (choice == 1)  {\nSystem.out.print(\"Enter book name: \");\nbookName = brConsoleReader.readLine();\n\
    Book book = new  Book();\nbook.setName(bookName);\nObjectMessage objectMessage\
    \ = session.createObjectMessage(book);\nsender.send(objectMessage);\n}  else if\
    \ (choice == 2)  {\nbreak;\n}\n}\nLibraryPersistentBeanRemote libraryBean = (LibraryPersistentBeanRemote)\
    \ ctx.lookup(\"LibraryPersistentBeanRemote\");\nList<Book> booksList = libraryBean.getBooks();\n\
    System.out.println(\"Book(s) entered so far: \" + booksList.size());\nint i =\
    \ 0;\nfor (Book book:booksList)  {\nSystem.out.println((i+1)+\". \" + book.getName());\n\
    i++;\n}\n}  catch (Exception e)  {\nSystem.out.println(e.getMessage());\ne.printStackTrace();\n\
    }\nfinally  {\ntry  {\nif(brConsoleReader !=null)  {\nbrConsoleReader.close();\n\
    }\n}  catch (IOException ex)  {\nSystem.out.println(ex.getMessage());\n}\n}\n\
    }\n}\n```\n\n## Run Client to Access EJB\n\nLocate `EJBTester.java` in project\
    \ explorer. Right click on `EJBTester` class and select `run file`.\n\nVerify\
    \ the following output in Netbeans console:\n\n```\nrun:\n**********************\n\
    Welcome to Book Store\n**********************\nOptions \n1. Add Book\n2. Exit\n\
    Enter Choice: 1\nEnter book name: Learn EJB\n**********************\nWelcome to\
    \ Book Store\n**********************\nOptions \n1. Add Book\n2. Exit\nEnter Choice:\
    \ 2\nBook(s) entered so far: 2\n1. learn java\n1. learn EJB\nBUILD SUCCESSFUL\
    \ (total time: 15 seconds)\n```\n\nThe output shown above states that our Message\
    \ driven bean is receiving the message and storing the book in persistent storage\
    \ and books are retrieved from the database.\n\n# Annotations\n\nAnnotations were\
    \ introduced in Java 5.0. The purpose of having annotations is to attach additional\
    \ information in the class or a meta-data of a class within its source code. In\
    \ EJB 3.0, annotations are used to describe configuration meta-data in EJB classes.\
    \ By this way, EJB 3.0 eliminates the need to describe configuration data in configuration\
    \ XML files.\n\nEJB container uses compiler tool to generate required artifacts\
    \ like interfaces, deployment descriptors by reading those annotations. Following\
    \ is the list of commonly used annotations.\n\n| Sr.no | Name | Description |\n\
    | :--- | :--- | :--- |\n| 1 | `javax.ejb.Stateless` | Specifies that a given EJB\
    \ class is a stateless session bean. |\n"
