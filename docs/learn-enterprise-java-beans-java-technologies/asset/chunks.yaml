    \ Book created with book id: 1\n16:39:09,900 INFO [STDOUT] BookCallbackListener.postLoad::\
    \ Loaded Book: 1\n...\n```\n\n# 定时服务 (Timer Service)\n\n定时服务是构建调度应用程序的机制。例如，在每月\
    \ 1 号生成工资单。EJB 3.0 规范规定了 `@Timeout` 注解，它有助于在无状态豆或消息驱动豆中编写 EJB 服务。EJB 容器会调用被 `@Timeout`\
    \ 注解标记的方法。\n\nEJB 定时服务是由 EJB 容器提供的服务，有助于创建定时器并在定时器过期时调度回调。\n\n## 创建定时器的步骤\n\n\
    使用 `@Resource` 注解在豆中注入 `SessionContext` −\n\n```java\n@Stateless\npublic class\
    \ TimerSessionBean {\n    @Resource\n    private SessionContext context;\n   \
    \ ...\n}\n```\n\n使用 `SessionContext` 对象获取 `TimerService` 并创建定时器。传递毫秒级时间和消息。\n\n\
    ```java\npublic void createTimer(long duration) {\n    context.getTimerService().createTimer(duration,\
    \ \"Hello World!\");\n}\n```\n\n## 使用定时器的步骤\n\n对方法使用 `@Timeout` 注解。返回类型应为 `void`\
    \ 并传递一个类型为 `Timer` 的参数。我们在第一次执行后取消定时器，否则它将在固定间隔后继续运行。\n\n```java\n@Timeout\npublic\
    \ void timeOutHandler(Timer timer) {\n    System.out.println(\"timeoutHandler\
    \ : \" + timer.getInfo());\n    timer.cancel();\n}\n```\n\n## 示例应用程序\n\n让我们创建一个测试\
    \ EJB 应用程序来测试 EJB 中的定时服务。\n\n| 步骤 |  |\n| :--- | :--- |\n| 1 | 如 `EJB - Create\
    \ Application` 章节所示，在包 `com.tutorialspoint.timer` 下创建一个名为为 `EjbComponent` 的项目。\
    \ |\n| 2 | 如 `EJB - Create Application` 章节所示，创建 `TimerSessionBean.java` 和 `TimerSessionBeanRemote`。保持其他文件不变。\
    \ |\n| 3 | 清理并构建应用程序，确保业务逻辑符合要求。 |\n| 4 | 最后，以 jar 文件的形式在 JBoss 服务器上部署应用程序。如果\
    \ JBoss 服务器尚未启动，它将自动启动。 |\n| 5 | 现在，按照 `EJB - Create Application` 章节中 `Create\
    \ Client to access EJB` 主题所述的方法，创建一个 EJB 客户端（基于控制台的应用程序）。 |\n\n## EJBComponent\
    \ (EJB 模块)\n\n### TimerSessionBean.java\n\n```java\npackage com.tutorialspoint.timer;\n\
    \nimport javax.annotation.Resource;\nimport javax.ejb.SessionContext;\nimport\
    \ javax.ejb.Timer;\nimport javax.ejb.Stateless;\nimport javax.ejb.Timeout;\n\n\
    @Stateless\npublic class TimerSessionBean implements TimerSessionBeanRemote {\n\
    \    @Resource\n    private SessionContext context;\n\n    public void createTimer(long\
    \ duration) {\n        context.getTimerService().createTimer(duration, \"Hello\
    \ World!\");\n    }\n\n    @Timeout\n    public void timeOutHandler(Timer timer)\
    \ {\n        System.out.println(\"timeoutHandler : \" + timer.getInfo());\n  \
    \      timer.cancel();\n    }\n}\n```\n\n### TimerSessionBeanRemote.java\n\n```java\n\
    package com.tutorialspoint.timer;\n\nimport javax.ejb.Remote;\n\n@Remote\npublic\
