    \ Server**. Click **Finish** button. You will see the following project created\
    \ by NetBeans.\n\n![Image](Images/image00321.jpeg)\n\n## Create a Sample EJB\n\
    \nTo create a simple EJB, we will use NetBeans \"New\" wizard. In the example\
    \ given below, We will create a stateless EJB class named `librarySessionBean`\
    \ under `EjbComponent` project.\n\nSelect project `EjbComponent` in project explorer\
    \ window and right click on it. Select, **New > Session Bean**. You will see the\
    \ **New Session Bean** wizard.\n\n![Image](Images/image00322.jpeg)\n\nEnter session\
    \ bean name and package name. Click **Finish** button. You will see the following\
    \ EJB classes created by NetBeans.\n\n*   `LibrarySessionBean` — stateless session\
    \ bean\n*   `LibrarySessionBeanLocal` — local interface for session bean\n\nI\
    \ am changing local interface to remote interface as we are going to access our\
    \ EJB in a console based application. Remote/Local interface is used to expose\
    \ business methods that an EJB has to implement.\n\n`LibrarySessionBeanLocal`\
    \ is renamed to `LibrarySessionBeanRemote` and `LibrarySessionBean` implements\
    \ `LibrarySessionBeanRemote` interface.\n\n### LibrarySessionBeanRemote\n\n```java\n\
    package com.tutorialspoint.stateless;\n\nimport java.util.List;\n\nimport javax.ejb.Remote;\n\
    \n@Remote\n\npublic  interface LibrarySessionBeanRemote  \n\nvoid addBook(String\
    \ bookName);\n\nList getBooks();\n\n}\n```\n\n### LibrarySessionBean\n\n```java\n\
    package com.tutorialspoint.stateless;\n\nimport java.util.ArrayList;\n\nimport\
    \ java.util.List;\n\nimport javax.ejb.Stateless;\n\n@Stateless\n\npublic  class\
    \ LibrarySessionBean  implements LibrarySessionBeanRemote {\n\nList<String> bookShelf;\n\
    \npublic  LibrarySessionBean()  {\n\nbookShelf =  new ArrayList<String>();\n\n\
    }\n\npublic  void addBook(String bookName)  {\n\nbookShelf.add(bookName);\n\n\
    }\n\npublic  List<String> getBooks()  {\n\nreturn bookShelf;\n\n}\n\n}\n```\n\n\
    ## Build the Project\n\n*   Select `EjbComponent` project in Project Explorer\
