    ` to obtain remote object (stateless EJB).\n* Then the user is shown library Interface\
    \ and asked to enter choice.\n* If the user enters 1, the system asks for book\
    \ name and saves the book using stateless bean `addBook()`. Session Bean is storing\
    \ the book in database.\n* If the user enters 2, the system retrieves books using\
    \ stateless bean `getBooks()` and exits.\n\n## Run Client to Access EJB\n\nLocate\
    \ `EJBTester.java` in project explorer. Right click on `EJBTester` class and select\
    \ **run**. Verify the following output in Netbeans console.\n\n```\nrun:\n**********************\n\
    Welcome to Book Store\n**********************\nOptions\n1. Add Book\n2. Exit\n\
    Enter Choice: 1\nEnter book name: learn testing\n**********************\nWelcome\
    \ to Book Store\n**********************\nOptions\n1. Add Book\n2. Exit\nEnter\
    \ Choice: 2\nBook(s) entered so far: 1\n1. learn testing\nimage bytes: [0x32 0x32\
    \ 0x32 0x32 0x32 0x32 0x32 0x32 0x32 0x32 0x32 0x32 0x32 0x32 0x32 0x32 0x32 0x32\
    \ 0x32 0x32 0x32 0x32 ]\n<book><name>learn testing</name></book>\nBUILD SUCCESSFUL\
    \ (total time: 20 seconds)\n```\n\n# Transactions\n\nA transaction is a single\
    \ unit of work items, which follows the ACID properties. ACID stands for Atomic,\
    \ Consistent, Isolated, and Durable.\n\n* **Atomic**: If any of the work item\
    \ fails, the whole unit will be considered failed. Success meant, all items execute\
    \ successfully.\n* **Consistent**: A transaction must keep the system in consistent\
    \ state.\n* **Isolated**: Each transaction executes independent of any other transaction.\n\
    * **Durable**: Transaction should survive system failure if it has been executed\
    \ or committed.\n\nEJB Container/Servers are transaction servers and handles transactions\
    \ context propagation and distributed transactions. Transactions can be managed\
    \ by the container or by custom code handling in bean's code.\n\n* **Container\
    \ Managed Transactions**: In this type, the container manages the transaction\
    \ states.\n* **Bean Managed Transactions**: In this type, the developer manages\
    \ the life cycle of transaction states.\n\n## Container Managed Transactions\n\
    \nEJB 3.0 has specified following attributes of transactions, which EJB containers\
    \ implement\n\n* **REQUIRED**: Indicates that business method has to be executed\
    \ within transaction, otherwise a new transaction will be started for that method.\n\
    * **REQUIRES_NEW**: Indicates that a new transaction, is to be started for the\
    \ business method.\n* **SUPPORTS**: Indicates that business method will execute\
    \ as part of transaction.\n* **NOT_SUPPORTED**: Indicates that business method\
    \ should not be executed as part of transaction.\n* **MANDATORY**: Indicates that\
    \ business method will execute as part of transaction, otherwise exception will\
    \ be thrown.\n* **NEVER**: Indicates if business method executes as part of transaction,\
    \ then an exception will be thrown.\n\n## Example\n\n```java\npackage com.tutorialspoint.txn.required;\n\
    \nimport javax.ejb.*\n\n@Stateless\n@TransactionManagement(TransactionManagementType.CONTAINER)\n\
    public class UserDetailBean implements UserDetailRemote {\n    private UserDetail;\n\
    \n    @TransactionAttribute(TransactionAttributeType.REQUIRED)\n    public void\
    \ createUserDetail() {\n        //create user details object\n    }\n}\n```\n\n\
    `createUserDetail()` business method is made Required using `Required` annotation.\n\
    \n```java\npackage com.tutorialspoint.txn.required;\n\nimport javax.ejb.*\n\n\
    @Stateless\npublic class UserSessionBean implements UserRemote {\n    private\
    \ User;\n\n    @EJB\n    private UserDetailRemote userDetail;\n\n    public void\
    \ createUser() {\n        //create user\n        //...\n        //create user\
    \ details\n        userDetail.createUserDetail();\n    }\n}\n```\n\n`createUser()`\
    \ business method is using `createUserDetail()`. If exception occurred during\
    \ `createUser()` call and `User` object is not created then `UserDetail` object\
    \ will also not be created.\n\n## Bean Managed Transactions\n\nIn Bean Managed\
    \ Transactions, Transactions can be managed by handling exceptions at application\
    \ level.\n\nFollowing are the key points to be considered\n\n* **Start**: When\
    \ to start a transaction in a business method.\n* **Sucess**: Identify success\
    \ scenario when a transaction is to be committed.\n* **Failed**: Identify failure\
    \ scenario when a transaction is to be rollback.\n\n### Example\n\n```java\npackage\
    \ com.tutorialspoint.txn.bmt;\n\nimport javax.annotation.Resource;\nimport javax.ejb.Stateless;\n\
    ```\n"
