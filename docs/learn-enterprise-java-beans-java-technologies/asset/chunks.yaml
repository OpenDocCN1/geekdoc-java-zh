    \ 章节中创建所示。\n\n3.  按照 `EJB-Persistence` 章节创建 `LibraryPersistentBean.java` 和 `LibraryPersistentBeanRemote`。\n\
    \n4.  在 `EjbComponent > setup` 文件夹下创建 `jboss-ds.xml`，并在 `EjbComponent > src >\
    \ conf` 文件夹下创建 `persistence.xml`。在 Netbeans 的文件标签中可以看到这些文件夹，如在 `EJB-Persistence`\
    \ 章节中创建所示。\n\n5.  在 `com.tutorialspoint.messagebean` 包下创建 `LibraryMessageBean.java`\
    \ 并按如下所示进行修改。\n\n6.  如上所述，在 Jboss 中创建 `BookQueue` 队列。\n\n7.  清理并构建（Clean and Build）应用程序，确保业务逻辑按照要求运行。\n\
    \n8.  最后，以 jar 文件形式将应用程序部署到 JBoss 应用服务器。如果 JBoss 应用服务器尚未启动，它会自动启动。\n\n9.  现在，按照\
    \ `EJB - Create Application` 章节中 `Create Client to access EJB` 主题下的说明，创建一个 EJB\
    \ 客户端（基于控制台的应用程序）。按如下所示进行修改。\n\n## EJBComponent (EJB 模块)\n\n### LibraryMessageBean.java\n\
    \n```java\npackage com.tutorialspoint.messagebean;\n\nimport com.tutorialspoint.entity.Book;\n\
    \nimport com.tutorialspoint.stateless.LibraryPersistentBeanRemote;\n\nimport javax.annotation.Resource;\n\
    \nimport javax.ejb.ActivationConfigProperty;\nimport javax.ejb.EJB;\nimport javax.ejb.MessageDriven;\n\
    import javax.ejb.MessageDrivenContext;\nimport javax.jms.JMSException;\nimport\
    \ javax.jms.Message;\nimport javax.jms.MessageListener;\nimport javax.jms.ObjectMessage;\n\
    \n@MessageDriven(\nname =  \"BookMessageHandler\",\nactivationConfig =  {\n@ActivationConfigProperty(\
    \ propertyName =  \"destinationType\",\npropertyValue =  \"javax.jms.Queue\"),\n\
    @ActivationConfigProperty( propertyName =  \"destination\",\npropertyValue =\"\
    /queue/BookQueue\")\n}\n)\npublic  class  LibraryMessageBean  implements  MessageListener\
    \ {\n@Resource\nprivate  MessageDrivenContext mdctx;\n\n@EJB\nLibraryPersistentBeanRemote\
    \ libraryBean;\n\npublic  LibraryMessageBean()  {\n}\n\npublic  void onMessage(Message\
    \ message)  {\nObjectMessage objectMessage =  null;\ntry  {\nobjectMessage = \
    \ (ObjectMessage) message;\nBook book =  (Book) objectMessage.getObject();\nlibraryBean.addBook(book);\n\
    }  catch  (JMSException ex)  {\nmdctx.setRollbackOnly();\n}\n}\n}\n```\n\n## EJBTester\
    \ (EJB 客户端)\n\n### EJBTester.java\n\n```java\npackage com.tutorialspoint.test;\n\
    \nimport com.tutorialspoint.entity.Book;\nimport com.tutorialspoint.stateless.LibraryPersistentBeanRemote;\n\
    import java.io.BufferedReader;\nimport java.io.FileInputStream;\nimport java.io.IOException;\n\
    import java.io.InputStreamReader;\nimport java.util.List;\nimport java.util.Properties;\n\
    import javax.jms.ObjectMessage;\nimport javax.jms.Queue;\nimport javax.jms.QueueConnection;\n\
    import javax.jms.QueueConnectionFactory;\nimport javax.jms.QueueSender;\nimport\
    \ javax.jms.QueueSession;\nimport javax.naming.InitialContext;\nimport javax.naming.NamingException;\n\
    \npublic  class  EJBTester  \nBufferedReader brConsoleReader =  null;\nProperties\
    \ props;\nInitialContext ctx;\n{\nprops =  new  Properties();\ntry  {\nprops.load(new\
    \  FileInputStream(\"jndi.properties\"));\n}  catch  (IOException ex)  {\nex.printStackTrace();\n\
    }\ntry  {\nctx =  new  InitialContext(props);\n}  catch  (NamingException ex)\
    \  {\nex.printStackTrace();\n}\nbrConsoleReader =\nnew  BufferedReader(new  InputStreamReader(System.in));\n\
    }\n\npublic  static  void main(String[] args)  {\nEJBTester ejbTester =  new \
    \ EJBTester();\nejbTester.testMessageBeanEjb();\n}\n\nprivate  void showGUI()\
    \  {\nSystem.out.println(\"**********************\");\nSystem.out.println(\"Welcome\
    \ to Book Store\");\nSystem.out.println(\"**********************\");\nSystem.out.print(\"\
    Options \\n1\\. Add Book\\n2\\. Exit \\nEnter Choice: \");\n}\n\nprivate  void\
    \ testMessageBeanEjb()  {\ntry  {\nint choice =  1;\nQueue queue =  (Queue) ctx.lookup(\"\
    /queue/BookQueue\");\nQueueConnectionFactory factory =\n(QueueConnectionFactory)\
    \ ctx.lookup(\"ConnectionFactory\");\nQueueConnection connection = factory.createConnection();\n\
    QueueSession session = connection.createSession(false, QueueSession.AUTO_ACKNOWLEDGE);\n\
    QueueSender sender = session.createSender(queue);\nwhile (choice != 2)  {\nshowGUI();\n\
    String strChoice = brConsoleReader.readLine();\nchoice =  Integer.parseInt(strChoice);\n\
    if (choice == 1)  {\nSystem.out.print(\"Enter book name: \");\nbookName = brConsoleReader.readLine();\n\
    Book book = new  Book();\nbook.setName(bookName);\nObjectMessage objectMessage\
    \ = session.createObjectMessage(book);\nsender.send(objectMessage);\n}  else if\
    \ (choice == 2)  {\nbreak;\n}\n}\nLibraryPersistentBeanRemote libraryBean = (LibraryPersistentBeanRemote)\
    \ ctx.lookup(\"LibraryPersistentBeanRemote\");\nList<Book> booksList = libraryBean.getBooks();\n\
    System.out.println(\"Book(s) entered so far: \" + booksList.size());\nint i =\
    \ 0;\nfor (Book book:booksList)  {\nSystem.out.println((i+1)+\". \" + book.getName());\n\
    i++;\n}\n}  catch (Exception e)  {\nSystem.out.println(e.getMessage());\ne.printStackTrace();\n\
    }\nfinally  {\ntry  {\nif(brConsoleReader !=null)  {\nbrConsoleReader.close();\n\
    }\n}  catch (IOException ex)  {\nSystem.out.println(ex.getMessage());\n}\n}\n\
    }\n}\n```\n\n## 运行客户端以访问 EJB\n\n在项目资源管理器中找到 `EJBTester.java`。右键点击 `EJBTester`\
    \ 类并选择 `run file`。\n\n在 Netbeans 控制台中验证以下输出：\n\n```\nrun:\n**********************\n\
    Welcome to Book Store\n**********************\nOptions \n1. Add Book\n2. Exit\n\
    Enter Choice: 1\nEnter book name: Learn EJB\n**********************\nWelcome to\
    \ Book Store\n**********************\nOptions \n1. Add Book\n2. Exit\nEnter Choice:\
    \ 2\nBook(s) entered so far: 2\n1. learn java\n1. learn EJB\nBUILD SUCCESSFUL\
    \ (total time: 15 seconds)\n```\n\n上述输出表明消息驱动 Bean（Message driven bean）正在接收消息并存储在持久化存储中，并且从数据库中检索书籍。\n\
    \n# 注解 (Annotations)\n\n注解是在 Java 5.0 中引入的。注解的作用是在代码中的类或类的元数据中附加信息。在 EJB 3.0 中，注解用于描述\
    \ EJB 类的配置元数据。通过这种方式，EJB 3.0 消除了在配置 XML 文件中描述数据的需要。\n\nEJB 容器使用编译器工具通过读取注解来生成所需的制品（如接口、部署描述）。以下是常用的注解列表。\n\
    \n| 序号 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| 1 | `javax.ejb.Stateless` | 指定给定的\
    \ EJB 类为无状态会话豆（stateless session bean）。 |\n\n"
- fmt: "\n* `name` — Used to specify name of the session bean.\n* `mappedName` — Used\
    \ to specify the JNDI name of the session bean.\n* `description` — Used to provide\
    \ description of the session bean.\n\n| ID | Class | Description |\n| :--- | :---\
    \ | :--- |\n| 2 | `javax.ejb.Stateful` | Specifies that a given EJB class is a\
    \ stateful session bean. Attributes: |\n\n* `name` — Used to specify name of the\
    \ session bean.\n* `mappedName` — Used to specify the JNDI name of the session\
    \ bean.\n* `description` — Used to provide description of the session bean.\n\n\
    | 3 | `javax.ejb.MessageDrivenBean` | Specifies that a given EJB class is a message\
    \ driven bean. Attributes: |\n\n* `name` — Used to specify name of the message\
    \ driven bean.\n* `messageListenerInterface` — Used to specify message listener\
    \ interface for the message driven bean.\n* `activationConfig` — Used to specify\
    \ the configuration details of the message-driven bean in an operational environment\
    \ of the message driven bean.\n* `mappedName` — Used to specify the JNDI name\
    \ of the session bean.\n* `description` — Used to provide description of the session\
    \ bean.\n\n| 4 | `javax.ejb.EJB` | Used to specify or inject a dependency as EJB\
    \ instance into another EJB. Attributes: |\n\n* `name` — Used to specify name,\
    \ which will be used to locate the referenced bean in the environment.\n* `beanInterface`\
    \ — Used to specify the interface type of the referenced bean.\n* `beanName` —\
    \ Used to provide name of the referenced bean.\n* `mappedName` — Used to specify\
    \ the JNDI name of the referenced bean.\n* `description` — Used to provide description\
    \ of the referenced bean.\n\n| 5 | `javax.ejb.Local` | Used to specify Local interface(s)\
    \ of a session bean. This local interface states the business methods of the session\
    \ bean (which can be stateless or stateful). This interface is used to expose\
    \ the business methods to local clients, which are running in the same deployment/application\
    \ as EJB. Attributes: |\n\n* `value` — Used to specify the list of local interfaces\
    \ as an array of interfaces.\n\n| 6 | `javax.ejb.Remote` | Used to specify Remote\
    \ interface(s) of a session bean. This remote interface states the business methods\
    \ of the session bean (which can be stateless or stateful). This interface is\
    \ used to expose the business methods to remote clients, which are running in\
    \ different deployment/application as EJB. Attributes: |\n\n* `value` — Used to\
    \ specify the list of remote interfaces as an array of interfaces.\n\n| 7 | `javax.ejb.ActivationConfigProperty`\
    \ | Used to specify properties required for a message driven bean. For example,\
    \ end point, destination, message selector etc. This annotation is passed as a\
    \ parameter to `activationConfig` attribute of `javax.ejb.MessageDrivenBean` annotation.\
    \ Attributes: |\n\n* `propertyName` — name of the property.\n* `propertyValue`\
    \ — value of the property.\n\n| 8 | `javax.ejb.PostActivate` | Used to specify\
    \ callback method of EJB lifecycle. This method will be called when EJB container\
    \ just activated/reactivated the bean instance. This interface is used to expose\
    \ the business methods to local clients, which are running in same deployment/application\
    \ as EJB. |\n\n# Callbacks\n\nCallback is a mechanism by which the life cycle\
    \ of an enterprise bean can be intercepted. EJB 3.0 specification has specified\
    \ callbacks for which callback handler methods are created. EJB Container calls\
    \ these callbacks. We can define callback methods in the EJB class itself or in\
    \ a separate class. EJB 3.0 has provided many annotations for callbacks.\n\nFollowing\
    \ is the list of callback annotations for stateless bean —\n\n| Annotation | Description\
    \ |\n| :--- | :--- |\n| `@PostConstruct` | Invoked when a bean is created for\
    \ the first time. |\n| `@PreDestroy` | Invoked when a bean is removed from the\
    \ bean pool or is destroyed. |\n\nFollowing is the list of callback annotations\
    \ for stateful bean —\n\n| Annotation | Description |\n| :--- | :--- |\n| `@PostConstruct`\
    \ | Invoked when a bean is created for the first time. |\n| `@PreDestroy` | Invoked\
    \ when a bean is removed from the bean pool or is destroyed. |\n| `@PostActivate`\
    \ | Invoked when a bean is loaded to be used. |\n| `@PrePassivate` | Invoked when\
    \ a bean is put back to bean pool. |\n\nFollowing is the list of callback annotations\
    \ for message driven bean —\n\n| Annotation | Description |\n| :--- | :--- |\n\
    | `@PostConstruct` | Invoked when a bean is created for the first time. |\n| `@PreDestroy`\
    \ | Invoked when a bean is removed from the bean pool or is destroyed. |\n\nFollowing\
    \ is the list of callback annotations for entity bean —\n\n| Annotation | Description\
    \ |\n| :--- | :--- |\n| `@PrePersist` | Invoked when an entity is created in database.\
    \ |\n| `@PostPersist` | Invoked after an entity is created in database. |\n| `@PreRemove`\
    \ | Invoked when an entity is deleted from the database. |\n| `@PostRemove` |\
    \ Invoked after an entity is deleted from the database. |\n| `@PreUpdate` | Invoked\
    \ before an entity is to be updated in the database. |\n| `@PostLoad` | Invoked\
    \ when a record is fetched from database and loaded into the entity. |\n\n## Example\
    \ Application\n\nLet us create a test EJB application to test various callbacks\
    \ in EJB.\n\n| Step | Description |\n| :--- | :--- |\n| 1 | Create a project with\
    \ a name `EjbComponent`. |\n| 2 | Create `LibrarySessionBean.java` under `com.tutorialspoint.stateless`.\
    \ |\n| 3 | Use `LibrarySessionBean.java` as shown. |\n| 4 | Create `CallbackListener.java`\
    \ under `com.tutorialspoint.callback`. |\n| 5 | Clean and Build the application.\
    \ |\n| 6 | Finally, deploy the application in the form of jar on JBoss Application\
    \ Server. |\n| 7 | Now create the EJB client to access. |\n\n## EJBComponent (EJB\
    \ Module)\n\n### CallbackListener.java\n\n```java\npackage com.tutorialspoint.callback;\n\
    \nimport javax.persistence.PrePersist;\nimport javax.persistence.PostLoad;\nimport\
    \ javax.persistence.PostPersist;\nimport javax.persistence.PostRemove;\nimport\
    \ javax.persistence.PostUpdate;\nimport javax.persistence.PreRemove;\nimport javax.persistence.PreUpdate;\n\
    import com.tutorialspoint.entity.Book;\n\npublic class CallbackListener {\n\n\
    \    @PrePersist\n    public void prePersist(Book book) {\n        System.out.println(\"\
    CallbackListener.prePersist:\"\n            + \" be created with book id: \" +\
    \ book.getId());\n    }\n\n    @PostPersist\n    public void postPersist(Object\
    \ book) {\n        System.out.println(\"CallbackListener.postPersist:\"\n    \
    \        + \" created with book id: \" + ((Book)book).getId());\n    }\n\n   \
    \ @PreRemove\n    public void preRemove(Book book) {\n        System.out.println(\"\
    CallbackListener.preRemove:\"\n            + \" About to delete Book: \" + book.getId());\n\
    \    }\n\n    @PostRemove\n    public void postRemove(Book book) {\n        System.out.println(\"\
    CallbackListener.postRemove:\"\n            + \" Deleted Book: \" + book.getId());\n\
    \    }\n\n    @PreUpdate\n    public void preUpdate(Book book) {\n        System.out.println(\"\
    CallbackListener.preUpdate:\"\n            + \" About to update Book: \" + book.getId());\n\
    \    }\n\n    @PostUpdate\n    public void postUpdate(Book book) {\n        System.out.println(\"\
    CallbackListener.postUpdate:\"\n            + \" Updated Book: \" + book.getId());\n\
    \    }\n\n    @PostLoad\n    public void postLoad(Book book) {\n        System.out.println(\"\
    CallbackListener.postLoad:\"\n            + \" Loaded Book: \" + book.getId());\n\
    \    }\n}\n```\n\n### Book.java\n\n```java\npackage com.tutorialspoint.entity;\n\
    \nimport java.io.Serializable;\nimport javax.persistence.Column;\nimport javax.persistence.Entity;\n\
    ```\n"
