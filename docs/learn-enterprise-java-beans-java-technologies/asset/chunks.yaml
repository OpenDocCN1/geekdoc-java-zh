    \ 方法回滚整个事务。\n\n# 安全性\n\n安全性是任何企业级应用的主要关注点。它包括对访问应用程序的用户或系统进行标识。根据标识，它允许或拒绝对应用程序内资源的访问。EJB\
    \ 容器管理标准的安全问题，或者也可以进行自定义以处理任何特定的安全问题。\n\n## 安全核心术语\n\n- **身份验证 (Authentication)**\
    \ − 确保访问系统或应用程序的用户身份真实的过程。\n- **授权 (Authorization)** − 确保经过验证的用户具有相应权限级别访问系统资源的过程。\n\
    - **用户 (User)** − 用户代表访问应用程序的客户端或系统。\n- **用户组 (User Groups)** − 用户可能是具有特定权限的组的一部分，例如管理员组。\n\
    - **用户角色 (User Roles)** − 角色定义了用户拥有的权限级别或访问系统资源的权限。\n\n## 容器管理的安全性 (Container\
    \ Managed Security)\n\nEJB 3.0 指定了以下安全属性/注解，由 EJB 容器实现。\n\n- **DeclareRoles**\
    \ − 指明该类将接受声明的角色。注解应用于类级别。\n- **RolesAllowed** − 指明该方法可以被指定角色的用户访问。它可以应用于类级别，导致类中的所有方法都可以被指定角色的用户访问。\n\
    - **PermitAll** − 指明业务方法对所有人可见。它可以可以应用于类级别，也可以应用于方法级别。\n- **DenyAll** − 指明业务方法无法被类级别或方法级别指定的任何用户访问。\n\
    \n### 示例\n\n```java\npackage com.tutorialspoint.security.required;\n\nimport javax.ejb.*\n\
    \n@Stateless\n@DeclareRoles({\"student\" \"librarian\"})\npublic class LibraryBean\
    \ implements LibraryRemote {\n\n    @RolesAllowed({\"librarian\"})\n    public\
    \ void delete(Book book) {\n        //delete book\n    }\n\n    @PermitAll\n \
    \   public void viewBook(Book book) {\n        //view book\n    }\n\n    @DenyAll\n\
    \    public void deleteAll() {\n        //delete all books\n    }\n}\n```\n\n\
    ## 安全配置\n\n在配置文件中映射角色和用户组。\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<!DOCTYPE sun-ejb-jar PUBLIC \"-//Sun Microsystems, Inc.//DTD Application\
    \ Server 9.0 EJB 3.0//EN\" \"http://www.sun.com/software/appserver/dtds/sun-ejb-jar_3_0-0.dtd\"\
    >\n<ejb-jar>\n    <security-role-mapping>\n        <role-name>student</role-name>\n\
    \        <group-name>student-group</group-name>\n    </security-role-mapping>\n\
    \    <security-role-mapping>\n        <role-name>librarian</role-name>\n     \
    \   <group-name>librarian-group</group-name>\n    </security-role-mapping>\n \
    \   <enterprise-beans/>\n</ejb-jar>\n```\n\n# JNDI 绑定\n\nJNDI 代表 Java Naming and\
    \ Directory Interface（Java 命名和目录接口）。它是一组 API 和服务接口。Java 应用程序使用 JNDI 进行命名和目录服务。在\
    \ EJB 语文中，有两个术语。\n\n- **绑定 (Binding)** − 指给 EJB 对象分配一个名称，以便以后使用。\n- **查找 (Lookup)**\
    \ − 指查找并获取 EJB 对象。\n\n在 Jboss 中，session beans 默认以以下格式绑定到 JNDI 中：\n\n- **local**\
    \ − `EJB-name/local`\n- **remote** − `EJB-name/remote`\n\n如果 EJB 封封装在 `<application-name>.ear`\
    \ 文件中，则默认格式如下：\n\n- **local** − `application-name/ejb-name/local`\n- **remote**\
    \ − `application-name/ejb-name/remote`\n\n## 默认绑定示例\n\n请参考 `Default Binding`。\n\
    \n"
- fmt: "\nWe will demonstrate use of ManyToMany mapping here. To represent ManyToMany\
    \ relationship, three following tables are required −\n\n* `Book` — Book table,\
    \ having records of books.\n* `Author` — Author table, having records of author.\n\
    * `Book_Author` — Book Author table, having linkage of above mentioned Book and\
    \ Author table.\n\n## Create Tables\n\nCreate a table `book`, `author`, `book_author`\
    \ in default database `postgres`.\n\n```sql\nCREATE TABLE book (\nbook_id integer,\n\
    name varchar(50)\n);\n\nCREATE TABLE author (\nauthor_id integer,\nname varchar(50)\n\
    );\n\nCREATE TABLE book_author (\nbook_id integer,\nauthor_id integer\n);\n```\n\
    \n## Create Entity Classes\n\n```java\n@Entity\n@Table(name=\"author\")\npublic\
    \ class Author implements Serializable{\n    private int id;\n    private String\
    \ name;\n    ...\n}\n\n@Entity\n@Table(name=\"book\")\npublic class Book implements\
    \ Serializable{\n    private int id;\n    private String title;\n    private Set<Author>\
    \ authors;\n    ...\n}\n```\n\nUse ManyToMany annotation in Book Entity.\n\n```java\n\
    @Entity\npublic class Book implements Serializable{\n    ...\n    @ManyToMany(cascade\
    \ = {CascadeType.PERSIST, CascadeType.MERGE}, fetch = FetchType.EAGER)\n    @JoinTable(table\
    \ = @Table(name = \"book_author\"),\n        joinColumns = {@JoinColumn(name =\
    \ \"book_id\")},\n        inverseJoinColumns = {@JoinColumn(name = \"author_id\"\
    )})\n    public Set<Author> getAuthors() {\n        return authors;\n    }\n \
    \   ...\n}\n```\n\n## Example Application\n\nLet us create a test EJB application\
    \ to test entity relationships objects in EJB 3.0.\n\n| Step | Description |\n\
    | :--- | :--- |\n| 1 | Create a project with a name `EjbComponent` under a package\
    \ `com.tutorialspoint.entity` as explained in the `EJB - Create Application` chapter.\
    \ Please use the project created in `EJB - Persistence` chapter as such for this\
    \ chapter to understand embedded objects in EJB concepts. |\n| 2 | Create `Author.java`\
    \ under package `com.tutorialspoint.entity` as explained in the `EJB - Create\
    \ Application` chapter. Keep rest of the files unchanged. |\n| 3 | Create `Book.java`\
    \ under package `com.tutorialspoint.entity`. Use `EJB - Persistence` chapter as\
    \ reference. Keep rest of the files unchanged. |\n| 4 | Clean and Build the application\
    \ to make sure business logic is working as per the requirements. |\n| 5 | Finally,\
    \ deploy the application in the form of jar file on JBoss Application Server.\
    \ JBoss Application server will get started automatically if it is not started\
    \ yet. |\n| 6 | Now create the EJB client, a console based application in the\
    \ same way as explained in the `EJB - Create Application` chapter under topic\
    \ **Create Client to access EJB**. |\n\n## EJBComponent (EJB Module)\n\n### Author.java\n\
    \n```java\npackage com.tutorialspoint.entity;\n\nimport java.io.Serializable;\n\
    import javax.persistence.Column;\nimport javax.persistence.Entity;\nimport javax.persistence.GeneratedValue;\n\
    import javax.persistence.GenerationType;\nimport javax.persistence.Id;\nimport\
    \ javax.persistence.Table;\n\n@Entity\n@Table(name=\"author\")\npublic class Author\
    \ implements Serializable{\n    private int id;\n    private String name;\n\n\
    \    public Author() {}\n\n    public Author(int id, String name) {\n        this.id\
    \ = id;\n        this.name = name;\n    }\n\n    @Id\n    @GeneratedValue(strategy=\
    \ GenerationType.IDENTITY)\n    @Column(name=\"author_id\")\n    public int getId()\
    \ {\n        return id;\n    }\n\n    public void setId(int id) {\n        this.id\
    \ = id;\n    }\n\n    public String getName() {\n        return name;\n    }\n\
    \n    public void setName(String name) {\n        this.name = name;\n    }\n\n\
    \    public String toString() {\n        return id + name;\n    }\n}\n```\n\n\
    ### Book.java\n\n```java\npackage com.tutorialspoint.entity;\n\nimport java.io.Serializable;\n\
    import javax.persistence.Column;\nimport javax.persistence.Entity;\nimport javax.persistence.GeneratedValue;\n\
    import javax.persistence.GenerationType;\nimport javax.persistence.Id;\nimport\
    \ javax.persistence.Table;\n\n@Entity\n@Table(name=\"book\")\npublic class Book\
    \ implements Serializable{\n    private int id;\n    private String title;\n \
    \   private Set<Author> authors;\n\n    public Book() {}\n\n    @Id\n    @GeneratedValue(strategy=\
    \ GenerationType.IDENTITY)\n    @Column(name=\"book_id\")\n    public int getId()\
    \ {\n        return id;\n    }\n\n    public void setId(int id) {\n        this.id\
    \ = id;\n    }\n\n    public String getName() {\n        return title;\n    }\n\
    \n    public void setTitle(String title) {\n        this.title = title;\n    }\n\
    \n    @ManyToMany(cascade = {CascadeType.PERSIST, CascadeType.MERGE}, fetch =\
    \ FetchType.EAGER)\n    @JoinTable(table = @Table(name = \"book_author\"),\n \
    \       joinColumns = {@JoinColumn(name = \"book_id\")},\n        inverseJoinColumns\
    \ = {@JoinColumn(name = \"author_id\")})\n    public Set<Author> getAuthors()\
    \ {\n        return authors;\n    }\n}\n```\n\n### LibraryBeanRemote.java\n\n\
    ```java\npackage com.tutorialspoint.stateful;\n\nimport com.tutorialspoint.entity.Book;\n\
    import java.util.List;\nimport javax.ejb.Remote;\n\n@Remote\npublic interface\
    \ LibraryBeanRemote {\n    void addBook(Book book);\n    List<Book> getBooks();\n\
    }\n```\n\n### LibraryPersistentBean.java\n\n```java\npackage com.tutorialspoint.stateful;\n\
    \nimport com.tutorialspoint.entity.Book;\nimport java.util.List;\nimport javax.ejb.Stateless;\n\
    import javax.persistence.EntityManager;\nimport javax.persistence.PersistenceContext;\n\
    \n@Stateless\npublic class LibraryPersistentBean implements LibraryBeanRemote\
    \ {\n\n    @PersistenceContext\n    private EntityManager entityManager;\n\n \
    \   public void addBook(Book book) {\n        entityManager.persist(book);\n \
    \   }\n\n    public List<Book> getBooks() {\n        return entityManager.createQuery(\"\
    from Book\").getResultList();\n    }\n}\n```\n\nAs soon as you deploy the `EjbComponent`\
    \ on JOSS, notice the log.\n\n```text\n16:30:01,401 INFO [JndiRegistrar] Binding\
    \ the following Entries in JNDI:\nLibraryPersistentBean/remote - EJB3.x Default\
    \ Remote Interface\nLibraryPersistentBean/remote-com.tutorialspoint.stateful.LibraryBeanRemote\
    \ - EJB3.x Remote Interface\n16:30:02,723 INFO [SessionSpecContainer] Starting\
    \ jboss.j2ee:jar=EjbComponent.jar,name=LibraryPersistentBean,service=EJB3\n16:30:02,731\
    \ INFO [EJBContainer] STARTED EJB: com.tutorialspoint.stateful.LibraryPersistentBean\n\
    ```\n\n## EJBTester (EJB Client)\n\n### jndi.properties\n\n```properties\njava.naming.factory.initial=org.jnp.interfaces.NamingContextFactory\n\
    java.naming.factory.url.pkgs=org.jboss.naming:org.jnp.interfaces\njava.naming.provider.url=localhost\n\
    ```\n\n* These properties are used to initialize the `InitialContext` object of\
    \ java naming service.\n* `InitialContext` object will be used to lookup stateless\
    \ session bean.\n\n### EJBTester.java\n\n```java\npackage com.tutorialspoint.test;\n\
    \nimport com.tutorialspoint.stateful.LibraryBeanRemote;\nimport java.io.BufferedReader;\n\
    import java.io.FileInputStream;\nimport java.io.IOException;\nimport java.io.InputStreamReader;\n\
    import java.util.*;\nimport javax.naming.InitialContext;\nimport javax.naming.NamingException;\n\
    \npublic class EJBTester {\n\n    BufferedReader brConsoleReader = null;\n   \
    \ Properties props;\n    InitialContext ctx;\n\n    {\n        props = new Properties();\n\
    \        try {\n            props.load(new FileInputStream(\"jndi.properties\"\
    ));\n        } catch (IOException ex) {\n            ex.printStackTrace();\n \
    \       }\n        try {\n            ctx = new InitialContext(props);\n     \
    \   } catch (NamingException ex) {\n            ex.printStackTrace();\n      \
    \  }\n        brConsoleReader = new BufferedReader(new InputStreamReader(System.in));\n\
    \    }\n\n    public static void main(String[] args) {\n        EJBTester ejbTester\
    \ = new EJBTester();\n    }\n}\n```\n"
