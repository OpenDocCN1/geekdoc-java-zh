    4. Finally, deploy the application in the form of jar file on `JBoss Application
    Server`. `JBoss Application server` will get started automatically if it is not
    started yet.


    5. Now create the `EJB` client, a console based application in the same way as
    explained in the `EJB - Create Application` chapter under topic `Create Client
    to access EJB`.


    ## EJBComponent (EJB Module)


    ### `LibraryStatefulSessionBeanRemote.java`


    ```java

    package com.tutorialspoint.stateful;


    import java.util.List;


    import javax.ejb.Remote;


    @Remote


    public interface LibraryStatefulSessionBeanRemote {

    void addBook(String bookName);


    List getBooks();

    }

    ```


    ### `LibraryStatefulSessionBean.java`


    ```java

    package com.tutorialspoint.stateful;


    import java.util.ArrayList;


    import java.util.List;


    import javax.ejb.Stateful;


    @Stateful


    public class LibraryStatefulSessionBean implements LibraryStatefulSessionBeanRemote
    {

    List<String> bookShelf;


    public LibraryStatefulSessionBean() {

    bookShelf = new ArrayList<String>();

    }


    public void addBook(String bookName) {

    bookShelf.add(bookName);

    }


    public List<String> getBooks() {

    return bookShelf;

    }

    }

    ```


    * As soon as you deploy the `EjbComponent` project on `JBOSS`, notice the `jboss
    log`.

    * `JBoss` has automatically created a `JNDI` entry for our session bean − `LibraryStatefulSessionBean/remote`.

    * We will be using this lookup string to get remote business object of type −
    `com.tutorialspoint.stateful.LibraryStatefulSessionBeanRemote`.


