    Let''s verify the output for all the operating systems −


    | OS | Output |


    | Windows | java version "1.6.0_21"Java(TM) SE Runtime Environment (build 1.6.0_21-b11)Java
    HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |


    | Linux | java version "1.6.0_21"Java(TM) SE Runtime Environment (build 1.6.0_21-b11)Java
    HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |


    | Mac | java version "1.6.0_21"Java(TM) SE Runtime Environment (build 1.6.0_21-b11)Java
    HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |


