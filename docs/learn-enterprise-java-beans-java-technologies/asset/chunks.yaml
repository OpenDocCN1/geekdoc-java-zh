    \ - EJB3.x Default Remote Business Interface\nLibraryPersistentBean/remote-com.tutorialspoint.stateless.LibraryPersistentBeanRemote\
    \ - EJB3.x Remote Business Interface\n10:51:37,349 INFO [EJBContainer] STARTED\
    \ EJB: com.tuturialspoint.messagebean.LibraryMessageBean ejbName: BookMessageHandler\n\
    10:51:37,443 INFO [DefaultEndpointRegistry] register: jboss.ws:context=EjbComponent,endpoint=LibraryPersistentBean\n\
    10:51:38,191 INFO [WSDLFilePublisher] WSDL published to: file:/D:/Jboss-5.0.1/server/default/data/wsdl/EjbComponent.jar/\n\
    LibraryService3853081455302946642.wsdl\n```\n\n## Create Client to Access EJB\
    \ as Web Service\n\nIn NetBeans IDE, select `File > New Project >`. Select project\
