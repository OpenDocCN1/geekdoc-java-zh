    \ method: getBooks\n```\n\n# 可嵌入对象\n\n`EJB` `3.0` 提供了将 `JAVA POJO`（普通 Java 对象）嵌入到实体豆（entity\
    \ bean）中的选项，并允许将列名映射到嵌入 POJO 类的方法。要嵌入的 Java POJO 必须标记为 `@Embeddable`。\n\n```java\n\
    @Embeddable\npublic class Publisher implements Serializable {\n    private String\
    \ name;\n    private String address;\n    ...\n}\n```\n\n可以使用 `@Embedded` 注解来嵌入上述类。\n\
    \n```java\n@Entity\npublic class Book implements Serializable {\n    private int\
    \ id;\n    private String name;\n    private Publisher publisher;\n    ...\n \
    \   @Embedded\n    @AttributeOverrides({\n        @AttributeOverride(name = \"\
    name\", column = @Column(name = \"PUBLISHER\")),\n        @AttributeOverride(name\
    \ = \"address\", column = @Column(name = \"PUBLISHER_ADDRESS\"))\n    })\n   \
    \ public Publisher getPublisher() {\n        return publisher;\n    }\n    ...\n\
    }\n```\n\n## 示例应用程序\n\n让我们创建一个测试 EJB 应用程序来测试 `EJB` `3.0` 中的嵌入对象。\n\n| 步骤 | 描述\
