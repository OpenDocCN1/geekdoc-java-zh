  trans: "\n\n# 1. 学习 Java\n\n构建成功（总耗时: 13 秒）\n\n### JBoss 服务器日志输出\n\n你可以在 JBoss 日志中找到以下回调项\n\
    \n```\n14:08:34,293 INFO [STDOUT] postConstruct:: LibraryPersistentBean session\
