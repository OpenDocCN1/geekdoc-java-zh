    In the following chapters, we will cover multiple aspects of this complete EJB
    application.


    # Stateless Bean


    A stateless session bean is a type of enterprise bean, which is normally used
    to perform independent operations. A stateless session bean as per its name does
    not have any associated client state, but it may preserve its instance state.
    EJB Container normally creates a pool of few stateless bean''s objects and use
    these objects to process client''s request. Because of pool, instance variable
    values are not guaranteed to be same across lookups/method calls.


    ## Steps to Create a Stateless EJB


    Following are the steps required to create a stateless EJB −


    *   Create a remote/local interface exposing the business methods.


    *   This interface will be used by the EJB client application.


    *   Use @Local annotation, if EJB client is in same environment where EJB session
    bean is to be deployed.


    *   Use @Remote annotation, if EJB client is in different environment where EJB
    session bean is to be deployed.


    *   Create a stateless session bean, implementing the above interface.


    *   Use @Stateless annotation to signify it a stateless bean. EJB Container automatically
    creates the relevant configurations or interfaces required by reading this annotation
    during deployment.


    ### Remote Interface


    import javax.ejb.Remote;


    @Remote


    public  interface  LibrarySessionBeanRemote  {


    //add business method declarations


    }


    ### Stateless EJB


    @Stateless


    public  class  LibrarySessionBean  implements  LibrarySessionBeanRemote  {


    //implement business method


    }


    ## Example Application


    Let us create a test EJB application to test stateless EJB.


    | Step | Description |


    | 1 | Create a project with a name *EjbComponent* under a package *com.tutorialspoint.stateless* as
    explained in the *EJB - Create Application* chapter. You can also use the project
    created in *EJB - Create Application* chapter as such for this chapter to understand
    stateless EJB concepts. |


    | 2 | Create *LibrarySessionBean.java* and *LibrarySessionBeanRemote* as explained
    in the *EJB - Create Application* chapter. Keep rest of the files unchanged. |


    | 3 | Clean and Build the application to make sure business logic is working as
    per the requirements. |


    | 4 | Finally, deploy the application in the form of jar file on JBoss Application
    Server. JBoss Application server will get started automatically if it is not started
    yet. |


    | 5 | Now create the EJB client, a console based application in the same way as
    explained in the *EJB - Create Application* chapter under topic **Create Client
    to access EJB**. |


    ## EJBComponent (EJB Module)


    ### LibrarySessionBeanRemote.java


    package com.tutorialspoint.stateless;


    import java.util.List;


    import javax.ejb.Remote;


    @Remote


    public  interface  LibrarySessionBeanRemote  {


    void addBook(String bookName);


    List getBooks();


    }


    ### LibrarySessionBean.java


    package com.tutorialspoint.stateless;


    import java.util.ArrayList;


    import java.util.List;


    import javax.ejb.Stateless;


    @Stateless


    public  class  LibrarySessionBean  implements  LibrarySessionBeanRemote  {


    List<String> bookShelf;


    public  LibrarySessionBean()  {


    bookShelf =  new  ArrayList<String>();


    }


    public  void addBook(String bookName)  {


    bookShelf.add(bookName);


    }


    public  List<String> getBooks()  {


    return bookShelf;


    }


    }


    *   As soon as you deploy the EjbComponent project on JBOSS, notice the jboss
    log.


    *   JBoss has automatically created a JNDI entry for our session bean - **LibrarySessionBean/remote**.


    *   We will be using this lookup string to get remote business object of type
    - **com.tutorialspoint.stateless.LibrarySessionBeanRemote**


    ### JBoss Application Server Log Output


