    \ unchanged. |\n\n| 3 | Use Beans created in the *EJB - Persistence* chapter.\
    \ Add callback methods as shown below. Keep rest of the files unchanged. |\n\n\
    | 4 | Create a java class *BookCallbackListener* under package *com.tutorialspoint.callback*.\
