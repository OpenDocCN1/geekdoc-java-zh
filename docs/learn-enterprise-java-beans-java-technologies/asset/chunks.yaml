    Requirement of Packaging applications using EJB 3.0 are similar to that of J2EE
    platform. EJB components are packaged into modules as `jar` files and are packaged
    into application enterprise archive as `ear` file.


    There are majorly three components of any enterprise application −


    - `jar` — Java Application aRchive, containing EJB modules, EJB client modules
    and utility modules.

    - `war` — Web Application aRchive, containing web modules.

    - `ear` — Enterprise Application aRchive, containing `jars` and `war` module.


    ![Image](Images/image00328.jpeg)


    In NetBeans, it is very easy to create, develop, package, and deploy the J2EE
    applications.


    In NetBeans IDE, select `File > New Project >`.Select project type under category,
    `Java EE`, Project type as `Enterprise Application`. Click `Next >` button. Enter
    project name and location. Click `Finish >` button. We''ve chosen name as `EnterpriseApplicaton`.


    Select Server and Settings. Keep `Create EJB Module` and `Create Web Application
    Module` checked with default names provided. Click finish button. NetBeans will
    create the following structure in project window.


    ![Image](Images/image00329.jpeg)


    Right click on the Project `Enterprise Application` in project explorer and select
    Build.


    ```

    ant -f D:\SVN\EnterpriseApplication dist


