    \        try {\n            props.load(new FileInputStream(\"jndi.properties\"\
    ));\n            InitialContext ctx = new InitialContext(props);\n           \
    \ LibraryBeanRemote libraryBean = (LibraryBeanRemote) ctx.lookup(\"LibraryBean/remote\"\
    );\n            int choice = 1;\n            while (choice != 2) {\n         \
    \       showGUI();\n                String strChoice = brConsoleReader.readLine();\n\
    \                choice = Integer.parseInt(strChoice);\n                if (choice\
    \ == 1) {\n                    System.out.print(\"Enter book name: \");\n    \
    \                String bookName = brConsoleReader.readLine();\n             \
    \       Book book = new Book();\n                    book.setName(bookName);\n\
    \                    libraryBean.addBook(book);\n                } else if (choice\
    \ == 2) {\n                    break;\n                }\n            }\n    \
    \        List<String> booksList = libraryBean.getBooks();\n            System.out.println(\"\
    Book(s) entered so far: \" + booksList.size());\n            int i = 0;\n    \
    \        for (String b : booksList) {\n                System.out.println((i +\
    \ 1) + \". \" + b);\n                i++;\n            }\n        } catch (Exception\
    \ e) {\n            System.out.println(e.getMessage());\n            e.printStackTrace();\n\
    \        } finally {\n            try {\n                if (brConsoleReader !=\
    \ null) {\n                    brConsoleReader.close();\n                }\n \
    \           } catch (IOException ex) {\n                System.out.println(ex.getMessage());\n\
    \            }\n        }\n    }\n\n    private static void showGUI() {\n    \
    \    System.out.println(\"**********************\");\n        System.out.println(\"\
    Welcome to library store\");\n        System.out.println(\"**********************\"\
    );\n        System.out.println(\"Options\");\n        System.out.println(\"1.\
    \ Add Book\");\n        System.out.println(\"2. Exit\");\n        System.out.print(\"\
    Enter Choice: \");\n        // Note: brConsoleReader initialization would be here\
    \ in real implementation\n    }\n}\n\n// Simple helper class for example\nclass\
    \ Book {\n    private String name;\n    public void setName(String name) { this.name\
    \ = name; }\n    public String getName() { return name; }\n}\n```\n\n`EJBTester`\
    \ performs the following tasks:\n- Load properties from `jndi.properties` and\
    \ initialize the `InitialContext` object.\n- In `testInterceptedEjb()` method,\
    \ jndi lookup is done with the name `LibraryBean/remote` to obtain the remote\
    \ business object (stateless EJB).\n- Then user is shown a library store User\
    \ Interface and he/she is asked to enter a choice.\n- If the user enters 1, the\
    \ system asks for book name and saves the book using stateless session bean `addBook()`\
    \ method. Session Bean is storing the book in its instance variable.\n- If the\
    \ user enters 2, the system retrieves books using stateless session bean `getBooks()`\
    \ method and exits.\n\n## Run Client to Access EJB\n\nLocate `EJBTester.java`\
    \ in project explorer. Right click on `EJBTester` class and select **run file**.\n\
    \nVerify the following output in Netbeans console.\n\n```\nrun:\n**********************\n\
    Welcome to library store\n**********************\nOptions\n1. Add Book\n2. Exit\n\
    Enter Choice: 1\nEnter book name: Learn Java\n**********************\nWelcome\
    \ to library store\n**********************\nOptions\n1. Add Book\n2. Exit\nEnter\
    \ Choice: 2\nBook(s) entered so far: 1\n1. Learn Java\n\nBUILD SUCCESSFUL (total\
    \ time: 13 seconds)\n```\n"
