    \            }\n        }\n    }\n}\n```\n\n`EJBTester` 执行以下任务：\n* 从 `jndi.properties`\
    \ 加属性并初始化 `InitialContext` 对象。\n* 在 `testEntityEjb()` 方法中，通过名称 `\"LibraryPersistentBean/remote\"\
    ` 查找获取远程业务对象（会话）。\n* 然后向用户显示书商店界面，并要求其输入一个选择。\n* 如果用户输入 `1`，系统询问书名并使用无会话 bean\
    \ `addBook()` 方法保存书籍。\n* 如果用户输入 `2`，系统使用无会话 bean `getBooks()` 方法检索书籍并退出。\n* 然后再次通过名称\
    \ `\"LibraryPersistentBean/remote\"` 查找获取远程业务对象（会话 EJB）并列出书籍。\n\n## 运行客户端访问 EJB\n\
    \n在项目资源管理器找到 `EJBTester.java`。右键点击 `EJBTester` 类并选择运行文件。\n\n在 Netbeans 控制台中验证以下输出。\n\
    \n```\nrun:\n**********************\nWelcome to Book Store\n**********************\n\
    Options\n1. Add Book\n2. Exit\nEnter Choice: 1\nEnter book name: Learn Testing\n\
    **********************\nWelcome to Book Store\n**********************\nOptions\n\
    1. Add Book\n2. Exit\nEnter Choice: 2\nBook(s) entered so far: 1\n1. learn Testing\n\
    \nBUILD SUCCESSFUL (total time: 15 seconds)\n```\n\n# 异常处理\n\nEJB 是企业级应用程序的一部分，通常基于分布式环境。因此，除了可能发生的异常外，还可能出现通信故障、安全权限、服务器宕机等异常。\n\
    \nEJB 容器以两种方式考虑异常：\n\n* **应用异常** —— 如果违反了业务规则或在执行业务逻辑时发生异常。\n* **系统异常** —— 任何不是由业务逻辑或业务代码引起的异常。`RuntimeException`、`RemoteException`\
    \ 都是系统异常。例如，查找 EJB 期间错误。`RuntimeException`、`RemoteException` 都是系统异常。\n\n"
- fmt: "\nWhen `Application Exception` occurs, EJB container intercepts the exception,\
    \ but returns the same to the client as it is. It does not roll back the transaction\
    \ unless it is specified in the code by `EJBContext.setRollBackOnly()` method.\
    \ EJB Container does not wrap the exception in case of `Application Exception`.\n\
    \nWhen `System Exception` occurs, EJB container intercepts the exception, rollbacks\
    \ the transaction and start the clean up tasks. It wraps the exception into `RemoteException`\
    \ and throws it to the client.\n\n## Handling Application Exception\n\nApplication\
    \ exceptions are generally thrown in Session EJB methods as these are the methods\
    \ responsible to execute business logic. Application exception should be declared\
    \ in `throws` clause of business method and should be thrown in case business\
    \ logic fails.\n\n```java\n@Stateless\npublic class LibraryPersistentBean implements\
    \ LibraryPersistentBeanRemote {\n    ...\n    public List<Book> getBooks() throws\
    \ NoBookAvailableException {\n        List<Book> books =\n            entityManager.createQuery(\"\
    From Books\").getResultList();\n        if(books.size == 0)\n            throw\
    \ NoBookAvailableException(\"No Book available in library.\");\n        return\
    \ books;\n    }\n    ...\n}\n```\n\n## Handling System Exception\n\nSystem exception\
    \ can occur at any time like naming lookup fails, sql error occurs while fetching\
    \ data. In such a case, such exception should be wrapped under `EJBException`\
    \ and thrown back to the client.\n\n```java\n@Stateless\npublic class LibraryPersistentBean\
    \ implements LibraryPersistentBeanRemote {\n    ...\n    public List<Book> getBooks()\
    \ {\n        try {\n            List<Book> books =\n                entityManager.createQuery(\"\
    From Books\").getResultList();\n        } catch (CreateException ce) {\n     \
    \       throw (EJBException) new EJBException(ce).initCause(ce);\n        } catch\
    \ (SqlException se) {\n            throw (EJBException) new EJBException(se).initCause(se);\n\
    \        }\n        return books;\n    }\n    ...\n}\n```\n\nAt client side, handle\
    \ the `EJBException`.\n\n```java\npublic class EJBTester {\n    private void testEntityEjb()\
    \ {\n        ...\n        try {\n            LibraryPersistentBeanRemote libraryBean\
    \ =\n                (LibraryPersistentBeanRemote)ctx.lookup(\"LibraryPersistentBean/remote\"\
    );\n            List<Book> booksList = libraryBean.getBooks();\n        } catch(EJBException\
    \ e) {\n            Exception ne = (Exception) e.getCause();\n            if(ne.getClass().getName().equals(\"\
    SqlException\")) {\n                System.out.println(\"Database error: \"+ e.getMessage());\n\
    \            }\n        }\n        ...\n    }\n}\n```\n\n# Web Services\n\nEJB\
    \ 3.0 provides an option to expose session EJB as a webservice. `@WebService`\
    \ annotation is used to mark a class as a web service end point and `@WebMethod`\
    \ is used to expose a method as web method to client.\n\n```java\n@Stateless\n\
    @WebService(serviceName=\"LibraryService\")\npublic class LibraryPersistentBean\
    \ implements LibraryPersistentBeanRemote {\n    ...\n    @WebMethod(operationName=\"\
    getBooks\")\n    public List<Book> getBooks() {\n        return entityManager.createQuery(\"\
    From Books\").getResultList();\n    }\n    ...\n}\n```\n\n## Example Application\n\
    \nLet us create a test EJB application to test blob/clob support in EJB 3.0.\n\
    \n| Step | Description |\n| :--- | :--- |\n| 1 | Create a project with a name\
    \ `EjbComponent` under a package `com.tutorialspoint.entity` as explained in the\
    \ EJB - Create Application chapter. Please use the project created in EJB - Persistence\
    \ chapter as such for this chapter to understand clob/blob objects in EJB concepts.\
    \ |\n| 2 | Create `LibraryPersistentBean.java` under package `com.tutorialspoint.stateless`.\
    \ Use EJB - Persistence chapter as reference. Keep rest of the files unchanged.\
    \ |\n| 3 | Clean and Build the application to make sure business logic is working\
    \ as per the requirements. |\n| 4 | Finally, deploy the application in the form\
    \ of jar file on JBoss Application Server. JBoss Application server will get started\
    \ automatically if it is not started yet. |\n\n### LibraryPersistentBean.java\n\
    \n```java\npackage com.tutorialspoint.stateless;\n\nimport com.tutorialspoint.entity.Book;\n\
    import java.util.List;\nimport javax.ejb.Stateless;\nimport javax.jws.WebMethod;\n\
    import javax.jws.WebService;\nimport javax.persistence.EntityManager;\nimport\
    \ javax.persistence.PersistenceContext;\n\n@Stateless\n@WebService(serviceName=\"\
    LibraryService\")\npublic class LibraryPersistentBean implements LibraryPersistentBeanRemote\
    \ {\n    public LibraryPersistentBean() {\n    }\n\n    @PersistenceContext(unitName=\"\
    EjbComponentPU\")\n    private EntityManager entityManager;\n\n    public void\
    \ addBook(Book book) {\n        entityManager.persist(book);\n    }\n\n    @WebMethod(operationName=\"\
    getBooks\")\n    public List <Book> getBooks() {\n        return entityManager.createQuery(\"\
    From Book\").getResultList();\n    }\n}\n```\n\n### JBoss Application Server Log\
    \ Output\n\n```text\n10:51:37,271 INFO [EJBContainer] STARTED EJB: com.tutorialspoint.stateless.LibraryPersistentBean\
    \ ejbName: LibraryPersistentBean\n10:51:37,287 INFO [JndiSessionRegistrarBase]\
