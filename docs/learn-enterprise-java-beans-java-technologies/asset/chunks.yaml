  trans: "\n\n![Image](img/image00320.jpeg)\n\n选择 Server 为 **JBoss Application Server**。点击\
    \ **Finish** 按钮。你将看到 NetBeans 创建了以下项目。\n\n![Image](img/image00321.jpeg)\n\n##\
    \ 创建示例 EJB\n\n要创建一个简单的 EJB，我们将使用 NetBeans 的“New”（新建）向导。在下例示例中，我们将在 `EjbComponent`\
    \ 项目下创建一个名为 `librarySessionBean` 的无状态 EJB 类。\n\n在项目资源管理器窗口中选择 `EjbComponent` 项目并右键点击它。选择\
    \ **New > Session Bean**。你将看到 **New Session Bean**（新建会话豆）向导。\n\n![Image](img/image00322.jpeg)\n\
    \n输入会话豆名称和包名。点击 **Finish** 按钮。你将看到 NetBeans 创建了以下 EJB 类。\n\n*   `LibrarySessionBean`\
    \ — 无状态会话豆\n*   `LibrarySessionBeanLocal` — 会话豆的本地接口\n\n我正在将本地接口改为远程接口，因为我们将在基于控制台的应用程序中访问\
    \ EJB。远程/本地接口用于暴露 EJB 必须实现的业务方法。\n\n`LibrarySessionBeanLocal` 被重命名为 `LibrarySessionBeanRemote`，且\
    \ `LibrarySessionBean` 实现了 `LibrarySessionBeanRemote` 接口。\n\n### LibrarySessionBeanRemote\n\
    \n```java\npackage com.tutorialspoint.stateless;\n\nimport java.util.List;\n\n\
    import javax.ejb.Remote;\n\n@Remote\n\npublic  interface LibrarySessionBeanRemote\
    \  \n\nvoid addBook(String bookName);\n\nList getBooks();\n\n}\n```\n\n### LibrarySessionBean\n\
    \n```java\npackage com.tutorialspoint.stateless;\n\nimport java.util.ArrayList;\n\
    \nimport java.util.List;\n\nimport javax.ejb.Stateless;\n\n@Stateless\n\npublic\
    \  class LibrarySessionBean  implements LibrarySessionBeanRemote {\n\nList<String>\
    \ bookShelf;\n\npublic  LibrarySessionBean()  {\n\nbookShelf =  new ArrayList<String>();\n\
    \n}\n\npublic  void addBook(String bookName)  {\n\nbookShelf.add(bookName);\n\n\
    }\n\npublic  List<String> getBooks()  {\n\nreturn bookShelf;\n\n}\n\n}\n```\n\n\
    ## 构建项目\n\n*   在 Project Explorer 窗口中选择 `EjbComponent` 项目。\n*   右键点击它打开右键菜单。\n\
    *   选择 clean and build（清理并构建）。\n\n你将在 NetBeans 控制台输出看到以下输出。\n\n```\nant -f C:\\\
    \\EJB\\\\EjbComponent clean dist\n\ninit:\n\nundeploy-clean:\n\ndeps-clean:\n\n\
    Deleting directory C:\\EJB\\EjbComponent\\build\nDeleting directory C:\\EJB\\\
    EjbComponent\\dist\n\nclean:\n\ninit:\n\ndeps-jar:\n\nCreated dir: C:\\EJB\\EjbComponent\\\
    build\\classes\nCopying 3 files to C:\\EJB\\EjbComponent\\build\\classes\\META-INF\n\
    Created dir: C:\\EJB\\EjbComponent\\build\\empty\nCreated dir: C:\\EJB\\EjbComponent\\\
    build\\generated-sources\\ap-source-output\nCompiling 2 source files to C:\\EJB\\\
    EjbComponent\\build\\classes\nwarning: [options] bootstrap class path not set\
    \ in conjunction with -source 1.6\n\nNote: C:\\EJB\\EjbComponent\\src\\java\\\
    com\\tutorialspoint\\stateless\n\\LibraryPersistentBean.java uses unchecked or\
    \ unsafe operations.\nNote: Recompile with -Xlint:unchecked for details.\n1 warning\n\
    \ncompile:\n\nlibrary-inclusion-in-archive:\n\nCreated dir: C:\\EJB\\EjbComponent\\\
    dist\nBuilding jar: C:\\EJB\\EjbComponent\\dist\\EjbComponent.jar\n\ndist:\n\n\
    BUILD SUCCESSFUL (total time: 3 seconds)\n```\n\n## 启动应用程序服务器\n\n*   在 Services\
    \ 窗口的 Servers 下选择 JBoss application server。\n*   右键点击它打开右键菜单。\n*   选择 start（启动）。\n\
    \n你将在 NetBeans 的 JBoss Application Server 输出下看到以下输出。\n\n```\nCalling C:\\jboss-5.1.0.GA\\\
    bin\\run.conf.bat\n\n=========================================================================\n\
    JBoss Bootstrap Environment\nJBOSS_HOME: C:\\jboss-5.1.0.GA\nJAVA: C:\\Program\
    \ Files (x86)\\Java\\jdk1.6.0_21\\bin\\java\nJAVA_OPTS: -Dprogram.name=run.bat\
    \ -Xms128m -Xmx512m -server\nCLASSPATH: C:\\jboss-5.1.0.GA\\bin\\run.jar\n=========================================================================\n\
    16:25:50,062 INFO [ServerImpl] Starting JBoss (Microcontainer)...\n16:25:50,062\
    \ INFO [ServerImpl] Release ID: JBoss\n[The Oracle] 5.1.0.GA (build: SVNTag=JBoss_5_1_0_GA\
    \ date=200905221634)\n...\n16:26:40,420 INFO [TomcatDeployment] deploy, ctxPath=/admin-console\n\
    16:26:40,485 INFO [config] Initializing Mojarra (1.2_12-b01-FCS) for context '/admin-console'\n\
    16:26:42,362 INFO [TomcatDeployment] deploy, ctxPath=/\n16:26:42,406 INFO [TomcatDeployment]\
    \ deploy, ctxPath=/jmx-console\n16:26:42,471 INFO [Http11Protocol] Starting Coyote\
    \ HTTP/1.1 on http-127.0.0.1-8080\n16:26:42,487 INFO [AjpProtocol] Starting Coyote\
    \ AJP/1.3 on ajp-127.0.0.1-8009\n16:26:42,493 INFO [ServerImpl] JBoss (Microcontainer)\n\
    [5.1.0.GA (build: SVNTag=JBoss_5_1_0_GA date=200905221634)] Started in 52s:427ms\n\
    ```\n\n## 部署项目\n\n*   在 Project Explorer 窗口中选择 `EjbComponent` 项目。\n*   右键点击它打开右键菜单。\n\
    *   选择 Deploy（部署）。\n\n你将在 NetBeans 控制台看到以下输出。\n\n```\nant -f C:\\\\EJB\\\\EjbComponent\
    \ -DforceRedeploy=true -Ddirectory.deployment.supported=false -Dnb.wait.for.caches=true\
    \ run\n\ninit:\n\ndeps-clean:\n\nlibrary-inclusion-in-archive:\n\nCreated dir:\
    \ C:\\EJB\\EjbComponent\\dist\nBuilding jar: C:\\EJB\\EjbComponent\\dist\\EjbComponent.jar\n\
    \ndist:\n\nBUILD SUCCESSFUL\n```\n\n## 创建访问 EJB 的客户端\n\n*   在 NetBeans IDE 中，选择\
    \ **File > New Project >**。\n*   在类别 **Java** 下选择项目类型，项目类型选择 **Java Application**。点击\
    \ Next > 按钮\n\n"
- fmt: "\n* Enter project name and location. Click `Finish >` button. We have chosen\
    \ name as `EjbTester`.\n\n* Right click on project name in Project explorer window.\
    \ Select `properties`.\n\n* Add EJB component project created earlier under libraries\
    \ using `Add Project` button in `compile` tab.\n\n* Add jboss libraries using\
    \ `Add jar/folder` button in `compile` tab. Jboss libraries can be located at\
    \ `<jboss installation folder>> client folder`.\n\nCreate `jndi.properties` under\
    \ project say `EjbTester`.\n\n### jndi.properties\n\n```properties\njava.naming.factory.initial=org.jnp.interfaces.NamingContextFactory\n\
    java.naming.factory.url.pkgs=org.jboss.naming:org.jnp.interfaces\njava.naming.provider.url=localhost\n\
    ```\n\nCreate package `com.tutorialspoint.test` and `EJBTester.java` class under\
    \ it.\n\n### EJBTester.java\n\n```java\npackage com.tutorialspoint.test;\n\nimport\
    \ com.tutorialspoint.stateless.LibrarySessionBeanRemote;\n\nimport java.io.BufferedReader;\n\
    import java.io.FileInputStream;\nimport java.io.IOException;\nimport java.io.InputStreamReader;\n\
    import java.util.List;\nimport java.util.Properties;\nimport javax.naming.InitialContext;\n\
    import javax.naming.NamingException;\n\npublic class EJBTester {\n    BufferedReader\
    \ brConsoleReader = null;\n    Properties props;\n    InitialContext ctx;\n\n\
    \    {\n        props = new Properties();\n        try {\n            props.load(new\
    \ FileInputStream(\"jndi.properties\"));\n        } catch (IOException ex) {\n\
    \            ex.printStackTrace();\n        }\n        try {\n            ctx\
    \ = new InitialContext(props);\n        } catch (NamingException ex) {\n     \
    \       ex.printStackTrace();\n        }\n        brConsoleReader = new BufferedReader(new\
    \ InputStreamReader(System.in));\n    }\n\n    public static void main(String[]\
    \ args) {\n        EJBTester ejbTester = new EJBTester();\n        ejbTester.testStatelessEjb();\n\
    \    }\n\n    private void showGUI() {\n        System.out.println(\"**********************\"\
    );\n        System.out.println(\"Welcome to Book Store\");\n        System.out.println(\"\
    **********************\");\n        System.out.print(\"Options \\n1\\. Add Book\\\
    n2\\. Exit \\nEnter Choice: \");\n    }\n\n    private void testStatelessEjb()\
    \ {\n        try {\n            int choice = 1;\n            LibrarySessionBeanRemote\
    \ libraryBean = (LibrarySessionBeanRemote)ctx.lookup(\"LibrarySessionBean/remote\"\
    );\n            while (choice != 2) {\n                String bookName;\n    \
    \            showGUI();\n                String strChoice = brConsoleReader.readLine();\n\
    \                choice = Integer.parseInt(strChoice);\n                if (choice\
    \ == 1) {\n                    System.out.print(\"Enter book name: \");\n    \
    \                bookName = brConsoleReader.readLine();\n                    libraryBean.addBook(bookName);\n\
    \                } else if (choice == 2) {\n                    break;\n     \
    \           }\n            }\n            List<String> booksList = libraryBean.getBooks();\n\
    \            System.out.println(\"Book(s) entered so far: \" + booksList.size());\n\
    \            for (int i = 0; i < booksList.size(); ++i) {\n                System.out.println((i+1)+\"\
    . \" + booksList.get(i));\n            }\n            LibrarySessionBeanRemote\
    \ libraryBean1 = (LibrarySessionBeanRemote)ctx.lookup(\"LibrarySessionBean/remote\"\
    );\n            List<String> booksList1 = libraryBean1.getBooks();\n         \
    \   System.out.println(\"***Using second lookup to get library stateless object***\"\
    );\n            System.out.println(\"Book(s) entered so far: \" + booksList1.size());\n\
    \            for (int i = 0; i < booksList1.size(); ++i) {\n                System.out.println((i+1)+\"\
    . \" + booksList1.get(i));\n            }\n        } catch (Exception e) {\n \
    \           System.out.println(e.getMessage());\n            e.printStackTrace();\n\
    \        } finally {\n            try {\n                if (brConsoleReader !=\
    \ null) {\n                    brConsoleReader.close();\n                }\n \
    \           } catch (IOException ex) {\n                System.out.println(ex.getMessage());\n\
    \            }\n        }\n    }\n}\n```\n\n### Run Client to Access EJB\n\nLocate\
    \ `EJBTester.java` in project explorer. Right click on `EJBTester` class and select\
    \ `run file`.\n\nVerify the following output in Netbeans console.\n\n```text\n\
    run:\n**********************\nWelcome to Book Store\n**********************\n\
    Options\n1\\. Add Book\n2\\. Exit\nEnter Choice: 1\nEnter book name: Learn Java\n\
    **********************\nWelcome to Book Store\n**********************\nOptions\n\
    1\\. Add Book\n2\\. Exit\nEnter Choice: 2\nBook(s) entered so far: 1\n1\\. Learn\
    \ Java\n***Using second lookup to get library stateless object***\nBook(s) entered\
