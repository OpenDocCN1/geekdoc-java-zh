    # Overview


    EJB stands for **Enterprise Java Beans**. EJB is an essential part of a J2EE platform.
    J2EE platform has component based architecture to provide multi-tiered, distributed
    and highly transactional features to enterprise level applications.


    EJB provides an architecture to develop and deploy component based enterprise
    applications considering robustness, high scalability, and high performance. An
    EJB application can be deployed on any of the application server compliant with
    the J2EE 1.3 standard specification.


    We''ll be discussing EJB 3.0 in detail in this tutorial.


    ## Types


    EJB is primarily divided into three categories; following table lists their names
    with brief descriptions :


    | S.No | Type & Description |

    | :--- | :--- |

    | 1 | Session Bean | Session bean stores data of a particular user for a single
    session. It can be `stateful` or `stateless`. It is less resource intensive as
    compared to entity bean. Session bean gets destroyed as soon as user session terminates.
    |

    | 2 | Entity Bean | **Entity beans** represent persistent data storage. User data
    can be saved to database via entity beans and later on can be retrieved from the
    database in the entity bean. |

    | 3 | Message Driven Bean | **Message driven beans** are used in context of JMS
    (Java Messaging Service). Message Driven Beans can consumes JMS messages from
    external entities and act accordingly. |


    ## Benefits


    Following are the important benefits of EJB :


    - Simplified development of large-scale enterprise level application.

    - Application Server/EJB container provides most of the system level services
    like transaction handling, logging, load balancing, persistence mechanism, exception
    handling, and so on. Developer has to focus only on business logic of the application.

    - EJB container manages life cycle of EJB instances, thus developer needs not
    to worry about when to create/delete EJB objects.


    # Environment Setup


    EJB is a framework for Java, so the very first requirement is to have a **Java
    Development Kit** (JDK) installed in your machine.


    ## System Requirement


    | Item | Value |

    | :--- | :--- |

    | JDK | 1.5 or above. |

    | Memory | no minimum requirement. |

    | Disk Space | no minimum requirement. |

    | Operating System | no minimum requirement. |


    ### Step 1 - Verify Java Installation in Your System


    Now open console and execute the following `java` command.


    | OS | Task | Command |

    | :--- | :--- | :--- |

    | Windows | Open Command Console | `c:\> java -version` |

    | Linux | Open Command Terminal | `$ java -version` |

    | Mac | Open Terminal | `machine:~ joseph$ java -version` |


    Let''s verify the output for all the operating systems :


    | OS | Output |

    | :--- | :--- |

    | Windows | java version "1.6.0_21"Java(TM) SE Runtime Environment (build 1.6.0_21-b11)Java
    HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |

    | Linux | java version "1.6.0_21"Java(TM) SE Runtime Environment (build 1.6.0_21-b11)Java
    HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |

    | Mac | java version "1.6.0_21"Java(TM) SE Runtime Environment (build 1.6.0_21-b11)Java
    HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |


    If you do not have Java installed, install the Java Software Development Kit (SDK)
    from **www.oracle.com**.


    ### Step 2 - Set JAVA Environment


    Set the `JAVA_HOME` environment variable to the directory where Java is installed.


    | OS | Path |

    | :--- | :--- |

    | Windows | `C:\Program Files\Java\jdk1.6.0_21` |

    | Linux | `/usr/lib/jvm/jdk1.6.0_21` |

    | Mac | `/Library/Java/JavaVirtualMachines/jdk1.6.0_21.jdk/Contents/Home` |


    Append the `bin` directory of `JAVA_HOME` to the system `PATH` variable.


    ### Step 3 - Download and Install NetBeans


    Download the latest version of NetBeans from **www.oracle.com**. We are using
    7.3 for this tutorial.


    ### Step 4 - Setup JBoss Application Server


    You can download the latest version of JBoss Server from **www.jboss.org**. Extract
    the archive to any location on your machine.


    ### Step 5 - Configure JEE Plugins to NetBeans


    Open Plugin window using `Tools > Plugins`. Open "Available Plugin" tab and select
    "Java EE Base" and "EJB and EAR" under "Java Web" category. Click install button.
    Netbeans will download and install the respective plugins. Verify plugins using
    "Installed" tab.


    ### Step 6 - Configure JBoss Server in Netbeans


    Go to Services tab and right click on servers to add a new server. Add Server
    Instance wizard will open. Select JBoss and in next step enter the relevant details
    to configure server in netbeans.


    ### Step 7 - Install Database Server (PostGreSql)


    Download latest version of PostGreSql database server from **www.postgresql.org**.


    # Create Application


    To create a simple EJB module, we will use NetBeans, "New project" wizard. In
    the example given below, We will create an EJB module project named Component.


    ## Create Project


    In NetBeans IDE, select `File > New Project >`. Select project type under category
    `Java EE`, Project type as `EJB Module`. Click `Next >`.

