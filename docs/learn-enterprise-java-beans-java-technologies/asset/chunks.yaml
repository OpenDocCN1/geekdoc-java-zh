    1\\. learn html5\nPublication: SAMS,DELHI\nBUILD SUCCESSFUL (total time: 21 seconds)\n\
    ```\n\n## Blobs/Clobs\n\nEJB 3.0 通过 `@Lob` 注解支持 `Blob` 和 `Clob` 类型。以下 Java 类型可以使用\
    \ `@Lob` 注解进行映射：\n\n- `java.sql.Blob`\n- `java.sql.Clob`\n- `byte[]`\n- `String`\n\
    - `Serializable Object`\n\n```java\n@Entity\n@Table(name=\"books\")\n@EntityListeners(BookCallbackListener.class)\n\
    public class Book implements Serializable {\n    ...\n    private byte[] image;\n\
    \    @Lob @Basic(fetch=FetchType.EAGER)\n    public byte[] getImage() {\n    \
    \    return image;\n    }\n    ...\n}\n```\n\n## 示例应用程序\n\n让我们创建一个测试 EJB 应用程序来测试\
    \ EJB 3.0 对 blob/clob 的支持。\n\n| 步骤 | 描述 |\n| :--- | :--- |\n| 1 | 如 *EJB - Create\
    \ Application* 章节解释的那样，在包 *com.tutorialspoint.entity* 下创建一个名为 *EjbComponent* 的项目。本章节中请使用\
    \ *EJB - Persistence* 章节中创建的项目，以便在本章节中理解 ejb 概念中的 clob/blob 对象。 |\n| 2 | 在包 *com.tutorialspoint.entity*\
    \ 下创建 *Book.java*。请以 *EJB - Persistence* 章节为参考。保持其他文件不变。 |\n| 3 | 清理并构建应用程序，以确保业务逻辑符合要求。\
    \ |\n| 4 | 最后，以 jar 格式将应用程序部署到 JBoss 应用服务器上。如果 JBoss 应用服务器尚未启动，它将自动启动。 |\n| 5\
    \ | 现在按照 **EJB - Create Application** 章节中 **Create Client to access EJB**（创建客户端以访问\
    \ EJB）主题下的说明，创建一个 EJB 客户端（一个基于控制台的应用程序）。 |\n\n### 创建/修改书籍表\n\n```sql\nCREATE TABLE\n\
    \  id integer PRIMARY KEY,\n  name varchar(50),\n  image bytea,\n  xml text\n\
    ```\n\n### EJB Component\n\n#### `Book.java`\n\n```java\npackage com.tutorialspoint.entity;\n\
    \nimport java.io.Serializable;\nimport javax.persistence.*;\n\n@Entity\n@Table(name=\"\
    books\")\npublic class Book implements Serializable {\n    @Id\n    @GeneratedValue(strategy=GenerationType.IDENTITY)\n\
    \    private int id;\n\n    private String name;\n\n    @Lob\n    @Basic(fetch=FetchType.EAGER)\n\
    \    private byte[] image;\n\n    @Lob\n    @Basic(fetch=FetchType.EAGER)\n  \
    \  private String xml;\n\n    public int getId() { return id; }\n    public void\
    \ setId(int id) { this.id = id; }\n    public String getName() { return name;\
    \ }\n    public void setName(String name) { this.name = name; }\n    public byte[]\
    \ getImage() { return image; }\n    public void setImage(byte[] image) { this.image\
    \ = image; }\n    public String getXml() { return xml; }\n    public void setXml(String\
    \ xml) { this.xml = xml; }\n}\n```\n\n#### `PersistenceRemote.java`\n\n```java\n\
    package com.tutorialspoint.stateless;\n\nimport com.tutorialspoint.entity.Book;\n\
    import java.util.List;\nimport javax.ejb.Remote;\n\n@Remote\npublic interface\
    \ PersistenceBeanRemote {\n    void addBook(Book bookName);\n    List<Book> getBooks();\n\
    }\n```\n\n#### `PersistenceBean.java`\n\n```java\npackage com.tutorialspoint.stateless;\n\
    \nimport com.tutorialspoint.entity.Book;\nimport java.util.List;\nimport javax.ejb.Stateless;\n\
    import javax.persistence.EntityManager;\nimport javax.persistence.PersistenceContext;\n\
    \n@Stateless\npublic class PersistenceBean implements PersistenceBeanRemote {\n\
    \n    @PersistenceContext(unitName=\"EjbComponentPU\")\n    private EntityManager\
    \ entityManager;\n\n    public void addBook(Book book) {\n        entityManager.persist(book);\n\
    \    }\n\n    public List<Book> getBooks() {\n        return entityManager.createQuery(\"\
    From Book\").getResultList();\n    }\n}\n```\n\n- 一旦你在 JBOSS 上部署了 EjbComponent\
    \ 项目，请注意 jboss 日志。\n- JBoss 已自动为我们的会话 bean 创建了 JNDI 目 - `PersistenceBean/remote`。\n\
    - 我们将使用此查找字符串来获取类型为 `com.tutorialspoint.stateless.PersistenceBeanRemote` 的远程业务对象。\n\
    \n### JBoss 应用服务器日志\n\n```\n...\n16:30:01,401 INFO [JndiSessionRegistrarBase]\
    \ Binding the following Entries in Global JNDI:\n\nPersistenceBean/remote - EJB3.x\
    \ Default Remote Business Interface\n\nPersistenceBean/remote-com.tutorialspoint.stateless.PersistenceBeanRemote\
    \ - EJB3.x Remote Business Interface\n\n16:30:02,723 INFO [SessionSpecContainer]\
