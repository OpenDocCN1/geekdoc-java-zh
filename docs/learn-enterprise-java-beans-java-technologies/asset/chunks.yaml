- fmt: "\n- **Default** — Default interceptor is invoked for every bean within deployment.Default\
    \ interceptor can be applied only via xml(`ejb-jar.xml`).\n- **Class** — Class\
    \ level interceptor is invoked for every method of the bean. Class level interceptor\
    \ can be applied both by annotation of via xml(`ejb-jar.xml`).\n- **Method** —\
    \ Method level interceptor is invoked for a particular method of the bean. Method\
    \ level interceptor can be applied both by annotation of via xml(`ejb-jar.xml`).\n\
    \nWe are discussing Class level interceptor here.\n\n### Interceptor Class\n\n\
    ```java\npackage com.tutorialspoint.interceptor;\n\nimport javax.interceptor.AroundInvoke;\n\
    import javax.interceptor.InvocationContext;\n\npublic class BusinessInterceptor\
    \ {\n\n    @AroundInvoke\n    public Object methodInterceptor(InvocationContext\
    \ ctx) throws Exception {\n        System.out.println(\"*** Intercepting call\
    \ to LibraryBean method: \"\n        + ctx.getMethod().getName());\n        return\
    \ ctx.proceed();\n    }\n}\n```\n\n### Remote Interface\n\n```java\nimport javax.ejb.Remote;\n\
    \n@Remote\npublic interface LibraryBeanRemote {\n    //add business method declarations\n\
    }\n```\n\n### Intercepted Stateless EJB\n\n```java\n@Interceptors ({BusinessInterceptor.class})\n\
    @Stateless\npublic class LibraryBean implements LibraryBeanRemote {\n    //implement\
    \ business method\n}\n```\n\n## Example Application\n\nLet us create a test EJB\
    \ application to test intercepted stateless EJB.\n\n| Step | Description |\n|\
    \ :--- | :--- |\n| 1 | Create a project with a name `EjbComponent` under a package\
    \ `com.tutorialspoint.interceptor` as explained in the *EJB - Create Application*\
    \ chapter. You can also use the project created in *EJB - Create Application*\
    \ chapter as such for this chapter to understand intercepted EJB concepts. |\n\
    | 2 | Create `LibraryBean.java` and `LibraryBeanRemote` under package `com.tutorialspoint.interceptor`\
    \ as explained in the *EJB - Create Application* chapter. Keep rest of the files\
    \ unchanged. |\n| 3 | Clean and Build the application to make sure business logic\
    \ is working as per the requirements. |\n| 4 | Finally, deploy the application\
    \ in the form of jar file on JBoss Application Server. JBoss Application server\
    \ will get started automatically if it is not started yet. |\n| 5 | Now create\
    \ the ejb client, a console based application in the same way as explained in\
    \ the *EJB - Create Application* chapter under topic **Create Client to access\
    \ EJB**. |\n\n## EJBComponent (EJB Module)\n\n### LibraryBeanRemote.java\n\n```java\n\
    package com.tutorialspoint.interceptor;\n\nimport java.util.List;\nimport javax.ejb.Remote;\n\
    \n@Remote\npublic interface LibraryBeanRemote {\n    void addBook(String bookName);\n\
    \    List<String> getBooks();\n}\n```\n\n### LibraryBean.java\n\n```java\npackage\
    \ com.tutorialspoint.interceptor;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\
    import javax.ejb.Stateless;\nimport javax.interceptor.Interceptors;\n\n@Interceptors\
    \ ({BusinessInterceptor.class})\n@Stateless\npublic class LibraryBean implements\
    \ LibraryBeanRemote {\n    List<String> bookShelf;\n\n    public LibraryBean()\
    \ {\n        bookShelf = new ArrayList<String>();\n    }\n\n    public void addBook(String\
    \ bookName) {\n        bookShelf.add(bookName);\n    }\n\n    public List<String>\
    \ getBooks() {\n        return bookShelf;\n    }\n}\n```\n\n- As soon as you deploy\
    \ the `EjbComponent` project on JBOSS, notice the jboss log.\n- JBoss has automatically\
    \ created a JNDI entry for our session bean — `LibraryBean/remote`.\n- We will\
    \ using this lookup string to get remote business object of type — `com.tutorialspoint.interceptor.LibraryBeanRemote`.\n\
    \n### JBoss Application Server Log Output\n\n```\n...\n16:30:01,401 INFO [JndiSessionRegistrarBase]\
    \ Binding the following Entries in Global JNDI:\nLibraryBean/remote - EJB3.x Default\
    \ Remote Business Interface\nLibraryBean/remote-com.tutorialspoint.interceptor.LibraryBeanRemote\
    \ - EJB3.x Remote Business Interface\n16:30:02,723 INFO [SessionSpecContainer]\
    \ Starting jboss.j2ee:jar=EjbComponent.jar,name=LibraryBean,service=EJB3\n16:30:02,723\
    \ INFO [EJBContainer] STARTED EJB: com.tutorialspoint.interceptor.LibraryBeanRemote\
    \ ejbName: LibraryBean\n16:30:02,731 INFO [JndiSessionRegistrarBase] Binding the\
    \ following Entries in Global JNDI:\nLibraryBean/remote - EJB3.x Default Remote\
    \ Business Interface\nLibraryBean/remote-com.tutorialspoint.interceptor.LibraryBeanRemote\
    \ - EJB3.x Remote Business Interface\n...\n```\n\n### EJBTester (EJB Client)\n\
    \n### jndi.properties\n\n```properties\njava.naming.factory.initial=org.jnp.interfaces.NamingContextFactory\n\
    java.naming.factory.url.pkgs=org.jboss.naming:org.jnp.interfaces\njava.naming.provider.url=localhost\n\
    ```\n\n- These properties are used to initialize the `InitialContext` object of\
    \ java naming service.\n- `InitialContext` object will be used to lookup.\n\n\
    ### EJBTester.java\n\n```java\npackage com.tutorialspoint.test;\n\nimport org.jnp.interfaces.NamingContextFactory;\n\
    import org.jboss.naming.NamingContext;\nimport javax.naming.InitialContext;\n\
    import javax.naming.Context;\nimport java.io.BufferedReader;\nimport java.io.FileInputStream;\n\
    import java.io.IOException;\nimport java.util.List;\nimport java.util.Properties;\n\
