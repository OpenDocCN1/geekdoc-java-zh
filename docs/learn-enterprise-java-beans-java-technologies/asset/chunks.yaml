  trans: "\n\n## 项目步骤\n\n1.  按照 `EJB - Create Application` 章节中的说明，在包 `com.tutorialspoint.entity`\
    \ 下创建一个名为 `EjbComponent` 的项目。你也可以直接使用 `EJB - Create Application` 章节中创建的项目作为本章节的示例，以理解\
