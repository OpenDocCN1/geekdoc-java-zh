    EJBTester performs the following tasks −


    *   Load properties from jndi.properties and initialize the InitialContext object.


    *   In testStatefulEjb() method, jndi lookup is done with name - "LibraryStatefulSessionBean/remote"
    to obtain the remote business object (stateful ejb).


    *   Then the user is shown a library store User Interface and he/she is asked
    to enter a choice.


    *   If user enters 1, system asks for book name and saves the book using stateful
    session bean addBook() method. Session Bean is storing the book in its instance
    variable.


    *   If user enters 2, system retrieves books using stateful session bean getBooks()
    method and exits.


    *   Then another jndi lookup is done with the name - "LibraryStatefulSessionBean/remote"
    to obtain the remote business object (stateful EJB) again and listing of books
    is done.


