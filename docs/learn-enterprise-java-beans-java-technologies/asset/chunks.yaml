    \n`EJB` `3.0` provides option to embed `JAVA POJO` (Plain Old Java Object) into\
    \ an entity bean and allows to map column names with the methods of the embedded\
    \ POJO class. A java POJO to be embedded must be annotated as `@Embeddable`.\n\
    \n```java\n@Embeddable\npublic class Publisher implements Serializable {\n   \
    \ private String name;\n    private String address;\n    ...\n}\n```\n\nThe above\
    \ class can be embedded using `@Embedded` annotation.\n\n```java\n@Entity\npublic\
    \ class Book implements Serializable {\n    private int id;\n    private String\
    \ name;\n    private Publisher publisher;\n    ...\n    @Embedded\n    @AttributeOverrides({\n\
    \        @AttributeOverride(name = \"name\", column = @Column(name = \"PUBLISHER\"\
    )),\n        @AttributeOverride(name = \"address\", column = @Column(name = \"\
    PUBLISHER_ADDRESS\"))\n    })\n    public Publisher getPublisher() {\n       \
    \ return publisher;\n    }\n    ...\n}\n```\n\n## Example Application\n\nLet us\
    \ create a test EJB application to test embedded objects in `EJB` `3.0`.\n\n|\
