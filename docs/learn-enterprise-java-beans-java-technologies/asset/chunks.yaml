    # Message Driven Beans


    A message driven bean is a type of enterprise bean, which is invoked by EJB container
    when it receives a message from queue or topic. Message driven bean is a stateless
    bean and is used to do task asynchronously.


    To demonstrate use of message driven bean, we will make use of EJB-persistence
    chapter and we need to do the following tasks −


    *   **Step 1** − Create table in database (Refer to *EJB-Persistence* chapter).


    *   **Step 2** − Create Entity class corresponding to table (Refer to *EJB-Persistence* chapter).


    *   **Step 3** − Create DataSource and Persistence Unit (Refer to *EJB-Persistence* chapter).


    *   **Step 4** − Create a stateless EJB having EntityManager instance (Refer to *EJB-Persistence* chapter).


    *   **Step 5** − Update stateless ejb.Add methods to add records and get records
    from database via entity manager (Refer to *EJB-Persistence* chapter).


    *   **Step 6** − Create a Queue named **BookQueue** in JBoss **default** application
    directory.


    *   **Step 7** − A console based application client will send message to this
    queue.


    *   **Step 8** − Create a Message driven bean, which will use the stateless bean
    to persist the client data.


    *   **Step 9** − EJB Container of jboss will call the above message driven bean
    and pass it the message that client will be sending to.


    ## Create Queue


    Create a file named jbossmq-destinations-service.xml if not exists in **<JBoss
    Installation Folder> > server > default > deploy **folder.


    Here we are creating a queue named BookQueue −


    jbossmq-destinations-service.xml


    <mbean  code="org.jboss.mq.server.jmx.Queue"


    name="jboss.mq.destination:service=Queue,name=BookQueue">


    <depends  optional-attribute-name="DestinationManager">


    jboss.mq:service=DestinationManager


    </depends>


    </mbean>


    When you start the JBoss, you will see a similar entry in jboss log.


    ...


    10:37:06,167 INFO [QueueService]  Queue[/queue/BookQueue] started, fullSize=200000,
    pageSize=2000, downCacheSize=2000


    ...


    ## Create Message Driven Bean


    @MessageDriven(


    name =  "BookMessageHandler",


    activationConfig =  {


    @ActivationConfigProperty( propertyName =  "destinationType",


    propertyValue =  "javax.jms.Queue"),


    @ActivationConfigProperty( propertyName =  "destination",


    propertyValue ="/queue/BookQueue")


    }


    )


    public  class  LibraryMessageBean  implements  MessageListener  {


    @Resource


    private  MessageDrivenContext mdctx;


    @EJB


    LibraryPersistentBeanRemote libraryBean;


    public  LibraryMessageBean()  {


    }


    public  void onMessage(Message message)  {


    }


    }


    *   LibraryMessageBean is annotated with @MessageDriven annotation to mark it
    as message driven bean.


    *   Its properties are defined as destinationType - Queue and destination - /queue/BookQueue.


    *   It implements MessageListener interface, which exposes onMessage method.


    *   It has MessgeDrivenContext as a resource.


    *   LibraryPersistentBeanRemote stateless bean is injected in this bean for persistence
    purpose.


    Build the EjbComponent project and deploy it on JBoss. After building and deploying
    the EJB module, we need a client to send a message to jboss queue.


    ## Example Application


    Let us create a test EJB application to test Message Driven Bean.


