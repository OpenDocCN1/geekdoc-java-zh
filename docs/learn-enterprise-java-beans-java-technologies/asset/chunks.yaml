    \    userTransaction.begin();\n            confirmAccountDetail(fromAccount);\n\
    \            withdrawAmount(fromAccount, fund);\n            confirmAccountDetail(toAccount);\n\
    \            depositAmount(toAccount, fund);\n            userTransaction.commit();\n\
    \        } catch (InvalidAccountException exception) {\n            userTransaction.rollback();\n\
    \        } catch (InsufficientFundException exception) {\n            userTransaction.rollback();\n\
    \        } catch (PaymentException exception) {\n            userTransaction.rollback();\n\
    \        }\n    }\n\n    private void confirmAccountDetail(Account account) throws\
    \ InvalidAccountException {\n    }\n\n    private void withdrawAmount() throws\
    \ InsufficientFundException {\n    }\n\n    private void depositAmount() throws\
    \ PaymentException {\n    }\n}\n```\n\nIn this example, we made use of `UserTransaction`\
    \ interface to mark the beginning of transaction using `userTransaction.begin()`\
    \ method call. We mark the completion of transaction, by using `userTransaction.commit()`\
    \ method and if any exception occured during transaction then we rollback the\
    \ complete transaction using `userTransaction.rollback()` method call.\n\n# Security\n\
    \nSecurity is a major concern of any enterprise level application. It includes\
    \ identification of user(s) or system accessing the application. Based on identification,\
    \ it allows or denies the access to resources within the application. An EJB container\
    \ manages standard security concerns or it can be customized to handle any specific\
    \ security concerns.\n\n## Important Terms of Security\n\n- **Authentication**\
    \ − This is the process ensuring that user accessing the system or application\
    \ is verified to be authentic.\n- **Authorization** − This is the process ensuring\
    \ that authentic user has right level of authority to access system resources.\n\
    - **User** − User represents the client or system, which accesses the application.\n\
    - **User Groups** − Users may be part of the group having certain authorities\
    \ For example administrator's group.\n- **User Roles** − Roles define the level\
    \ of authority, a user have or permissions to access a system resource.\n\n##\
    \ Container Managed Security\n\nEJB 3.0 has specified following attributes/annotations\
    \ of security, which EJB containers implement.\n\n- **DeclareRoles** − Indicates\
    \ that class will accept the declared roles. Annotations are applied at class\
    \ level.\n- **RolesAllowed** − Indicates that a method can be accessed by user\
    \ of role specified. Can be applied at class level resulting which all methods\
    \ of class can be accessed buy user of role specified.\n- **PermitAll** − Indicates\
    \ that a business method is accessible to all. It can be applied at class as well\
    \ as at method level.\n- **DenyAll** − Indicates that a business method is not\
    \ accessible to any of the user specified at class or at method level.\n\n###\
    \ Example\n\n```java\npackage com.tutorialspoint.security.required;\n\nimport\
    \ javax.ejb.*\n\n@Stateless\n@DeclareRoles({\"student\" \"librarian\"})\npublic\
    \ class LibraryBean implements LibraryRemote {\n\n    @RolesAllowed({\"librarian\"\
    })\n    public void delete(Book book) {\n        //delete book\n    }\n\n    @PermitAll\n\
    \    public void viewBook(Book book) {\n        //view book\n    }\n\n    @DenyAll\n\
    \    public void deleteAll() {\n        //delete all books\n    }\n}\n```\n\n\
    ## Security Configuration\n\nMap roles and user groupd in configuration file.\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE sun-ejb-jar PUBLIC\
    \ \"-//Sun Microsystems, Inc.//DTD Application Server 9.0 EJB 3.0//EN\" \"http://www.sun.com/software/appserver/dtds/sun-ejb-jar_3_0-0.dtd\"\
    >\n<ejb-jar>\n    <security-role-mapping>\n        <role-name>student</role-name>\n\
    \        <group-name>student-group</group-name>\n    </security-role-mapping>\n\
    \    <security-role-mapping>\n        <role-name>librarian</role-name>\n     \
    \   <group-name>librarian-group</group-name>\n    </security-role-mapping>\n \
    \   <enterprise-beans/>\n</ejb-jar>\n```\n\n# JNDI Bindings\n\nJNDI stands for\
    \ Java Naming and Directory Interface. It is a set of API and service interfaces.\
    \ Java based applications use JNDI for naming and directory services. In context\
    \ of EJB, there are two terms.\n\n- **Binding** − This refers to assigning a name\
    \ to an EJB object, which can be used later.\n- **Lookup** − This refers to looking\
    \ up and getting an object of EJB.\n\nIn Jboss, session beans are bound in JNDI\
    \ in the following format by default.\n\n- **local** − `EJB-name/local`\n- **remote**\
    \ − `EJB-name/remote`\n\nIn case, EJB are bundled with `<application-name>.ear`\
    \ file, then default format is as following −\n\n- **local** − `application-name/ejb-name/local`\n\
    - **remote** − `application-name/ejb-name/remote`\n\n## Example of Default Binding\n\
    \nRefer to `Default Binding`.\n"
