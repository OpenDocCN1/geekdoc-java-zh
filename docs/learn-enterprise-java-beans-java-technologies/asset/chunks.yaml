  raw: '![Image](Images/image00320.jpeg)


    Select Server as **JBoss Application Server**. Click **Finish** button. You will
    see the following project created by NetBeans.


    ![Image](Images/image00321.jpeg)


    ## Create a Sample EJB


    To create a simple EJB, we will use NetBeans "New" wizard. In the example given
    below, We will create a stateless EJB class named librarySessionBean under EjbComponent
    project.


    Select project EjbComponent in project explorer window and right click on it.
    Select, **New > Session Bean**. You will see the **New Session Bean** wizard.


    ![Image](Images/image00322.jpeg)


    Enter session bean name and package name. Click **Finish** button. You will see
    the following EJB classes created by NetBeans.


    *   **LibrarySessionBean** − stateless session bean


    *   **LibrarySessionBeanLocal** − local interface for session bean


    I am changing local interface to remote interface as we are going to access our
    EJB in a console based application. Remote/Local interface is used to expose business
    methods that an EJB has to implement.


    LibrarySessionBeanLocal is renamed to LibrarySessionBeanRemote and LibrarySessionBean
    implements LibrarySessionBeanRemote interface.


    ### LibrarySessionBeanRemote


    package com.tutorialspoint.stateless;


    import java.util.List;


    import javax.ejb.Remote;


    @Remote


    public  interface  LibrarySessionBeanRemote  {


    void addBook(String bookName);


    List getBooks();


    }


    ### LibrarySessionBean


    package com.tutorialspoint.stateless;


    import java.util.ArrayList;


    import java.util.List;


    import javax.ejb.Stateless;


    @Stateless


    public  class  LibrarySessionBean  implements  LibrarySessionBeanRemote  {


    List<String> bookShelf;


    public  LibrarySessionBean()  {


    bookShelf =  new  ArrayList<String>();


    }


    public  void addBook(String bookName)  {


    bookShelf.add(bookName);


    }


    public  List<String> getBooks()  {


    return bookShelf;


    }


    }


    ## Build the Project


    *   Select EjbComponent project in Project Explorer window.


    *   Right click on it to open context menu.


    *   Select clean and build.


