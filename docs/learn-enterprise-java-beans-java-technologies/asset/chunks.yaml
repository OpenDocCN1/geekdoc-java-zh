  trans: "\n\n- **Default（默认）** — 部署中的每个 bean 都会被默认拦截器调用。默认拦截器只能通过 xml（`ejb-jar.xml`）应用。\n\
    - **Class（类）** — 类级拦截器会为 bean 的每个方法被调用。类级拦截器既可以通过注解也可以通过 xml（`ejb-jar.xml`）应用。\n\
    - **Method（方法）** — 方法级拦截器为 bean 的特定方法被调用。方法级拦截器既可以通过注解也可以通过 xml（`ejb-jar.xml`）应用。\n\
    \n在这里我们讨论类级拦截器。\n\n### 拦截器类 (Interceptor Class)\n\n```java\npackage com.tutorialspoint.interceptor;\n\
    \nimport javax.interceptor.AroundInvoke;\nimport javax.interceptor.InvocationContext;\n\
    \npublic class BusinessInterceptor {\n\n    @AroundInvoke\n    public Object methodInterceptor(InvocationContext\
    \ ctx) throws Exception {\n        System.out.println(\"*** Intercepting call\
    \ to LibraryBean method: \"\n        + ctx.getMethod().getName());\n        return\
    \ ctx.proceed();\n    }\n}\n```\n\n### 远程接口 (Remote Interface)\n\n```java\nimport\
    \ javax.ejb.Remote;\n\n@Remote\npublic interface LibraryBeanRemote {\n    //添加业务方法声明\n\
    }\n```\n\n### 被拦截的无状态 EJB (Intercepted Stateless EJB)\n\n```java\n@Interceptors\
    \ ({BusinessInterceptor.class})\n@Stateless\npublic class LibraryBean implements\
    \ LibraryBeanRemote {\n    //实现业务方法\n}\n```\n\n## 示例应用程序 (Example Application)\n\
    \n让我们创建一个测试 EJB 应用程序来测试被拦截的无状态 EJB。\n\n| 步骤 | 描述 |\n| :--- | :--- |\n| 1 |按照 *EJB\
    \ - Create Application* 章节中的说明，在包 `com.tutorialspoint.interceptor` 下创建一个名为 `EjbComponent`\
    \ 的项目。你也可以直接使用 *EJB - Create Application* 章节中创建的项目用于本章节，以理解被拦截 EJB 的概念。 |\n| 2\
    \ |按照 *EJB - Create Application* 章节中的说明，在 `com.tutorialspoint.interceptor` 包下创建\
    \ `LibraryBean.java` 和 `LibraryBeanRemote`。保持其他文件不变。 |\n| 3 | 清理并构建应用程序，以确保业务逻辑符合要求。\
    \ |\n| 4 | 最后，将应用程序以 jar 文件的形式部署在 JBoss 应用服务器上。如果 JBoss 应用服务器尚未启动，它会自动启动。 |\n\
    | 5 | 现在，按照 *EJB - Create Application* 章节中 **Create Client to access EJB** 主题下的说明，同样创建一个\
    \ ejb 客户端（一个基于控制台的应用程序）。 |\n\n## EJBComponent (EJB 模块)\n\n### LibraryBeanRemote.java\n\
    \n```java\npackage com.tutorialspoint.interceptor;\n\nimport java.util.List;\n\
    import javax.ejb.Remote;\n\n@Remote\npublic interface LibraryBeanRemote {\n  \
    \  void addBook(String bookName);\n    List<String> getBooks();\n}\n```\n\n###\
    \ LibraryBean.java\n\n```java\npackage com.tutorialspoint.interceptor;\n\nimport\
    \ java.util.ArrayList;\nimport java.util.List;\nimport javax.ejb.Stateless;\n\
    import javax.interceptor.Interceptors;\n\n@Interceptors ({BusinessInterceptor.class})\n\
    @Stateless\npublic class LibraryBean implements LibraryBeanRemote {\n    List<String>\
    \ bookShelf;\n\n    public LibraryBean() {\n        bookShelf = new ArrayList<String>();\n\
    \    }\n\n    public void addBook(String bookName) {\n        bookShelf.add(bookName);\n\
    \    }\n\n    public List<String> getBooks() {\n        return bookShelf;\n  \
    \  }\n}\n```\n\n- 一旦你在 JBOSS 上部署了 `EjbComponent` 项目，请注意 jboss 日志。\n- JBoss 已自动为我们的会\
    \ bean 创建了一个 JNDI 条目——`LibraryBean/remote`。\n- 我们使用此查找字符串来获取类型为 `com.tutorialspoint.interceptor.LibraryBeanRemote`\
    \ 的远程业务对象。\n\n### JBoss 应用服务器日志输出\n\n```\n...\n16:30:01,401 INFO [JndiSessionRegistrarBase]\
    \ Binding the following Entries in Global JNDI:\nLibraryBean/remote - EJB3.x Default\
    \ Remote Business Interface\nLibraryBean/remote-com.tutorialspoint.interceptor.LibraryBeanRemote\
    \ - EJB3.x Remote Business Interface\n16:30:02,723 INFO [SessionSpecContainer]\
    \ Starting jboss.j2ee:jar=EjbComponent.jar,name=LibraryBean,service=EJB3\n16:30:02,723\
    \ INFO [EJBContainer] STARTED EJB: com.tutorialspoint.interceptor.LibraryBeanRemote\
    \ ejbName: LibraryBean\n16:30:02,731 INFO [JndiSessionRegistrarBase] Binding the\
    \ following Entries in Global JNDI:\nLibraryBean/remote - EJB3.x Default Remote\
    \ Business Interface\nLibraryBean/remote-com.tutorialspoint.interceptor.LibraryBeanRemote\
    \ - EJB3.x Remote Business Interface\n...\n```\n\n### EJBTester (EJB 客户端)\n\n\
    ### jndi.properties\n\n```properties\njava.naming.factory.initial=org.jnp.interfaces.NamingContextFactory\n\
    java.naming.factory.url.pkgs=org.jboss.naming:org.jnp.interfaces\njava.naming.provider.url=localhost\n\
    ```\n\n- 这些属性用于初始化 java 命名服务的 `InitialContext` 对象。\n- `InitialContext` 对象将用于查找。\n\
    \n### EJBTester.java\n\n```java\npackage com.tutorialspoint.test;\n\nimport org.jnp.interfaces.NamingContextFactory;\n\
