  trans: "\n\n当 `Application Exception` 发生时，EJB 容器会拦截该异常，但将其原样返回给客户端。除非在代码中通过 `EJBContext.setRollBackOnly()`\
    \ 方法明确指定，否则不会回滚事务。在发生 `Application Exception` 的情况下，EJB 容器不会对异常进行封装。\n\n当 `System\
    \ Exception` 发生时，EJB 容器会拦截该异常、回滚事务并启动清理任务。它会将异常封装进 `RemoteException` 并抛抛给客户端。\n\
    \n## 处理应用程序异常\n\n应用程序异常通常在 Session EJB 方法中抛出，因为这些方法负责执行业务逻辑。应用程序异常应该在业务方法的 `throws`\
    \ 子句中声明，并在业务逻辑失败时被抛出。\n\n```java\n@Stateless\npublic class LibraryPersistentBean\
    \ implements LibraryPersistentBeanRemote {\n    ...\n    public List<Book> getBooks()\
    \ throws NoBookAvailableException {\n        List<Book> books =\n            entityManager.createQuery(\"\
    From Books\").getResultList();\n        if(books.size == 0)\n            throw\
    \ NoBookAvailableException(\"No Book available in library.\");\n        return\
    \ books;\n    }\n    ...\n}\n```\n\n## 处理系统异常\n\n系统异常可能发生在任何时候，例如命名查找失败、获取数据时发生\
    \ SQL 错误。在这种情况下，此类异常应该封装在 `EJBException` 下并返回给客户端。\n\n```java\n@Stateless\npublic\
    \ class LibraryPersistentBean implements LibraryPersistentBeanRemote {\n    ...\n\
    \    public List<Book> getBooks() {\n        try {\n            List<Book> books\
    \ =\n                entityManager.createQuery(\"From Books\").getResultList();\n\
    \        } catch (CreateException ce) {\n            throw (EJBException) new\
    \ EJBException(ce).initCause(ce);\n        } catch (SqlException se) {\n     \
    \       throw (EJBException) new EJBException(se).initCause(se);\n        }\n\
    \        return books;\n    }\n    ...\n}\n```\n\n在客户端，处理 `EJBException`。\n\n\
    ```java\npublic class EJBTester {\n    private void testEntityEjb() {\n      \
    \  ...\n        try {\n            LibraryPersistentBeanRemote libraryBean =\n\
    \                (LibraryPersistentBeanRemote)ctx.lookup(\"LibraryPersistentBean/remote\"\
    );\n            List<Book> booksList = libraryBean.getBooks();\n        } catch(EJBException\
    \ e) {\n            Exception ne = (Exception) e.getCause();\n            if(ne.getClass().getName().equals(\"\
    SqlException\")) {\n                System.out.println(\"Database error: \"+ e.getMessage());\n\
    \            }\n        }\n        ...\n    }\n}\n```\n\n# Web Services\n\nEJB\
    \ 3.0 提供了一个将 Session EJB 暴露为 Web 选项。使用 `@WebService` 注解标记类为 Web 服务端点，并使用 `@WebMethod`\
    \ 将方法暴露为给客户端的 Web 方法。\n\n```java\n@Stateless\n@WebService(serviceName=\"LibraryService\"\
    )\npublic class LibraryPersistentBean implements LibraryPersistentBeanRemote {\n\
    \    ...\n    @WebMethod(operationName=\"getBooks\")\n    public List<Book> getBooks()\
    \ {\n        return entityManager.createQuery(\"From Books\").getResultList();\n\
    \    }\n    ...\n}\n```\n\n## 示例应用程序\n\n让我们创建一个测试 EJB 应用程序来测试 EJB 3.0 对 blob/clob\
    \ 的支持。\n\n| 步骤 | 描述 |\n| :--- | :--- |\n| 1 | 在包 `com.tutorialspoint.entity` 下创建一个名为\
    \ `EjbComponent` 的项目，如 EJB - Create Application 章节所示。请使用 EJB - Persistence 章节中创建的项目，以便在本章节中理解\
    \ EJB 概念中的 clob/blob 对象。 |\n| 2 | 在包 `com.tutorialspoint.stateless` 下创建 `LibraryPersistentBean.java`。参考\
    \ EJB - Persistence 章节。保持其他文件不变。 |\n| 3 | 清理并构建应用程序，确保业务逻辑按照要求运行。 |\n| 4 | 最后，以\
    \ jar 文件的形式将应用程序部署到 JBoss 应用服务器上。如果 JBoss 应用服务器尚未启动，它将自动启动。 |\n\n### LibraryPersistentBean.java\n\
    \n```java\npackage com.tutorialspoint.stateless;\n\nimport com.tutorialspoint.entity.Book;\n\
    import java.util.List;\nimport javax.ejb.Stateless;\nimport javax.jws.WebMethod;\n\
    import javax.jws.WebService;\nimport javax.persistence.EntityManager;\nimport\
    \ javax.persistence.PersistenceContext;\n\n@Stateless\n@WebService(serviceName=\"\
    LibraryService\")\npublic class LibraryPersistentBean implements LibraryPersistentBeanRemote\
    \ {\n    public LibraryPersistentBean() {\n    }\n\n    @PersistenceContext(unitName=\"\
    EjbComponentPU\")\n    private EntityManager entityManager;\n\n    public void\
    \ addBook(Book book) {\n        entityManager.persist(book);\n    }\n\n    @WebMethod(operationName=\"\
    getBooks\")\n    public List <Book> getBooks() {\n        return entityManager.createQuery(\"\
