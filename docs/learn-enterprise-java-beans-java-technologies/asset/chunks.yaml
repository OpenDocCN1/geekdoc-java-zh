    # 概述


    EJB 代表 **Enterprise Java Beans**（企业级 Java Bean）。EJB 是 J2EE 平台不可或缺的一部分。J2EE 平台具有基于组件的架构，用于为企业级应用提供多层、分布式和高事务的特性。


    EJB 提供了一种架构，用于开发和部署考虑了健壮性、高扩展性和高性能的基于组件的企业级应用。EJB 应用可以部署在任何符合 J2EE 1.3 标准规范的应用程序服务器上。


    我们将在本教程中详细讨论 EJB 3.0。


    ## 类型


    EJB 主要分为三类；下表列出了它们的名称及简要描述：


    | 序号 | 类型与描述 |

    | :--- | :--- |

    | 1 | 会话 Bean (Session Bean)。会话 Bean 为单个会话存储特定用户的数据。它可以是 `stateful`（有状态）或 `stateless`（无状态）。与实体
    Bean 相比，它的资源消耗较低。会话 Bean 在用户会话结束时立即销毁。 |

    | 2 | 实体 Bean (Entity Bean)。**实体 Bean**代表持久数据存储。用户数据可以通过实体 Bean 保存到数据库，稍后可以通过实体
    Bean 从数据库中检索。 |

    | 3 | 消息驱动 Bean (Message Driven Bean)。**消息驱动 Bean** 用于 JMS（Java 服务）上下文。消息驱动 Bean
    可以从外部实体消费 JMS 消息并采取相应的行动。 |


    ## 优势


    以下是 EJB 的重要优势：


    - 简化了大型企业级应用的开发。

    - 应用程序服务器/EJB 容器提供了大多数系统级服务，如事务处理、日志记录、负载均衡、持久化机制、异常处理等。开发者只需关注应用的业务逻辑。

    - EJB 容器管理 EJB 实例的生命周期，因此开发者无需担心何时创建/删除 EJB 对象。


    # 环境配置


    EJB 是一个 Java 框架，因此首要要求是在你的机器上安装了 **Java 开发工具包** (JDK)。


    ## 系统要求


    | 项目 | 值 |

    | :--- | :--- |

    | JDK | 1.5 或更高版本。 |

    | 内存 | 无最低要求。 |

    | 磁盘空间 | 无最低要求。 |

    | 操作系统 | 无最低要求。 |


    ### 步骤 1 - 验证系统中的 Java 安装


    现在打开控制并执行以下 `java` 命令。


    | 操作系统 | 任务 | 命令 |

    | :--- | :--- | :--- |

    | Windows | 打开命令控制台 | `c:\> java -version` |

    | Linux | 打开命令行终端 | `$ java -version` |

    | Mac | 打开终端 | `machine:~ joseph$ java -version` |


    让我们验证所有操作系统的输出结果：


    | 操作系统 | 输出 |

    | :--- | :--- |

    | Windows | java version "1.6.0_21"Java(TM) SE Runtime Environment (build 1.6.0_21-b11)Java
    HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |

    | Linux | java version "1.6.0_21"Java(TM) SE Runtime Environment (build 1.6.0_21-b11)Java
    HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |

    | Mac | java version "1.6.0_21"Java(TM) SE Runtime Environment (build 1.6.0_21-b11)Java
    HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |


    如果尚未安装 Java，请从 **oracle.com** 安装 Java。


    ### 步骤 2 - 设置 Java 环境


    将 `JAVA_HOME` 环境变量指向 Java 安装的目录。


    | 操作系统 | 路径 |

    | :--- | :--- |

    | Windows | `C:\Program Files\Java\jdk1.6.0_21` |

    | Linux | `/usr/lib/jvm/jdk1.6.0_21` |

    | Mac | `/Library/Java/JavaVirtualMachines/jdk1.6.0_21.jdk/Contents/Home` |


    将 `JAVA_HOME` 的 `bin` 目录添加到系统的 `PATH` 变量中。


    ### 步骤 3 - 下载并安装 NetBeans


    从 **oracle.com** 下载最新版本的 NetBeans。本教程使用的是 7.3 版本。


    ### 步骤 4 - 设置 JBoss 应用程序


    你可以从 **jboss.org** 下载最新版本的 JBoss 服务器。将压缩包解压到机器上的任何位置。


    ### 步骤 5 - 为 NetBeans 配置 JEE 插件


    使用 `Tools > Plugins` 打开插件窗口。打开 "Available Plugin" 标签卡，并在 "Java Web" 分类下选择 "Java
    EE Base" 和 "EJB and EAR"。点击安装按钮。NetBeans 将下载并安装相应的插件。使用 "Installed" 标签卡验证插件。


    ### 步骤 6 - 在 NetBeans 中配置 JBoss 服务器


    进入 Services 标签并右键点击 servers 添加服务器。打开 Add Server Instance 向导。选择 JBoss 并在下一步输入相关信息以在
    netbeans 中配置服务器。


    ### 步骤 7 - 安装数据库服务器 (PostGreSql)


    从 **postgresql.org** 下载最新版本的 PostGreSql 数据库服务器。


    # 创建应用


    创建一个简单的 EJB 模块，我们将使用 NetBeans 的 "New project" 向导。在下例示例中，我们将创建一个名为 Component 的
    EJB 模块项目。


    ## 创建项目


    在 NetBeans IDE 中，选择 `File > New Project >`。在类别 `Java EE` 下选择项目类型，项目类型选择 `EJB Module`。点击
    `Next >`。


