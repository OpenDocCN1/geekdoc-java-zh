    import javax.naming.NamingException;\n\npublic class EJBTester {\n    BufferedReader\
    \ brConsoleReader = null;\n    Properties props;\n    InitialContext ctx;\n\n\
    \    {\n        props = new Properties();\n        try {\n            props.load(new\
    \ FileInputStream(\"jndi.properties\"));\n        } catch (IOException ex) {\n\
