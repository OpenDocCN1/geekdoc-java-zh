  trans: "\n\n我们将在这里演示多对多（ManyToMany）映射的使用。为了表示多对多关系，需要以下三张表——\n\n* `Book` — 书籍表，存储书籍记录。\n\
    * `Author` — 作者表，存储作者记录。\n* `Book_Author` — 书籍作者表，存储上述书籍表和作者表之间的关联。\n\n## 创建表\n\
    \n在默认数据库 `postgres` 中创建表 `book`、`author``book_author`。\n\n```sql\nCREATE TABLE\
    \ book (\nbook_id integer,\nname varchar(50)\n);\n\nCREATE TABLE author (\nauthor_id\
    \ integer,\nname varchar(50)\n);\n\nCREATE TABLE book_author (\nbook_id integer,\n\
    author_id integer\n);\n```\n\n## 创建实体类\n\n```java\n@Entity\n@Table(name=\"author\"\
    )\npublic class Author implements Serializable{\n    private int id;\n    private\
    \ String name;\n    ...\n}\n\n@Entity\n@Table(name=\"book\")\npublic class Book\
    \ implements Serializable{\n    private int id;\n    private String title;\n \
    \   private Set<Author> authors;\n    ...\n}\n```\n\n在 `Book` 实体中使用 `@ManyToMany`\
    \ 注解。\n\n```java\n@Entity\npublic class Book implements Serializable{\n    ...\n\
    \    @ManyToMany(cascade = {CascadeType.PERSIST, CascadeType.MERGE}, fetch = FetchType.EAGER)\n\
    \    @JoinTable(table = @Table(name = \"book_author\"),\n        joinColumns =\
    \ {@JoinColumn(name = \"book_id\")},\n        inverseJoinColumns = {@JoinColumn(name\
    \ = \"author_id\")})\n    public Set<Author> getAuthors() {\n        return authors;\n\
    \    }\n    ...\n}\n```\n\n## 示例应用程序\n\n让我们创建一个测试 EJB 应用程序来测试 EJB 3.0 中的实体关系对象。\n\
    \n| 步骤 | 说明 |\n| :--- | :--- |\n| 1 | 如 `EJB - Create Application` 章节所述，在包 `com.tutorialspoint.entity`\
    \ 下创建一个名为 `EjbComponent` 的项目。请在本章节中使用 `EJB - Persistence` 章节中创建的项目，以便理解 EJB 概念中的嵌入对象。\
    \ |\n| 2 | 如 `EJB - Create Application` 章节所述，在包 `com.tutorialspoint.entity` 下创建\
