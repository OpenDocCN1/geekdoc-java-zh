    \ as per the requirements. |\n| 5 | Finally, deploy the application in the form\
    \ of a `jar` file on JBoss Application Server. JBoss Application server will get\
    \ started automatically if it is not started yet. |\n| 6 | Now create the EJB\
    \ client, a console based application in the same way as explained in the `EJB\
    \ - Create Application` chapter under topic `Create Client to access EJB`. |\n\
    \n### Create/Alter Book Table\n\n```sql\nCREATE TABLE book (\n    id integer PRIMARY\
    \ KEY,\n    name varchar(50)\n);\n\nAlter table book add publisher varchar(100);\n\
    Alter table book add publisher_address varchar(200);\n```\n\n## EJBComponent (EJB\
