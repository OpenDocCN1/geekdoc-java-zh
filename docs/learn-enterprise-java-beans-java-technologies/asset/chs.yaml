  \ 概念。 |\n| 2 | 根据 *EJB – Create Application* 章节创建 `LibraryStatefulSessionBean.java`\
  \ 和 `LibraryStatefulSessionBean`。保持其他文件不变。 |\n| 3 | 清理并构建应用程序，确保业务逻辑符合要求。 |\n\n\n\
  \n\n\n4. 最后，将应用程序以 jar 文件的形式部署在 `JBoss Application Server` 上。如果 `JBoss Application\
  \ server` 尚未启动，它将自动启动。\n\n5. 现在创建 `EJB` 客户端，其创建方式与 `EJB - Create Application` 章节下\
  \ `Create Client to access EJB` 题目的解释方式相同，这是一个控制台应用程序。\n\n## EJBComponent (EJB Module)\n\
  \n### `LibraryStatefulSessionBeanRemote.java`\n\n```java\npackage com.tutorialspoint.stateful;\n\
  \nimport java.util.List;\n\nimport javax.ejb.Remote;\n\n@Remote\n\npublic interface\
  \ LibraryStatefulSessionBeanRemote {\nvoid addBook(String bookName);\n\nList getBooks();\n\
  }\n```\n\n### `LibraryStatefulSessionBean.java`\n\n```java\npackage com.tutorialspoint.stateful;\n\
  \nimport java.util.ArrayList;\n\nimport java.util.List;\n\nimport javax.ejb.Stateful;\n\
