  \ 方法。\n\n## 运行访问 EJB\n\n在项目管理器中找到 `EJBTester.java`。右键点击 `EJBTester` 类并选择**运行文件**。\n\
  \n在 Netbeans 控制台中验证以下输出。\n\n```\nrun:\n[Wed Jun 19 11:35:47 2013]timer created.\n\
  构建成功（总耗时: 0 秒）\n```\n\n# 依赖注入 (Dependency Injection)\n\nEJB 3.0 规范提供了注解，可以字段或 setter\
  \ 方法以注入依赖。EJB 容器使用全局 JNDI 注册表来定位依赖。EJB 3.0 中用于依赖注入的注解有：\n\n* `@EJB` — 用于注入其他 EJB\
  \ 引用。\n* `@Resource` — 用于注入数据源或单例服务，如 `sessionContext`、`timerService` 等。\n\n## 使用\
  \ @EJB 的步骤\n\n`@EJB` 可以如下应用于字段或方法：\n\n```java\npublic class LibraryMessageBean implements\
  \ MessageListener {\n    //在字段上注入\n    @EJB\n    LibraryPersistentBeanRemote libraryBean;\n\
  \    ...\n}\n```\n\n```java\npublic class LibraryMessageBean implements MessageListener\
  \ {\n    LibraryPersistentBeanRemote libraryBean;\n    //在方法上注入\n    @EJB\n    public\
  \ void setLibraryBean(LibraryPersistentBeanRemote libraryBean) {\n        this.libraryBean\
  \ = libraryBean;\n    }\n}\n```\n\n\n\n\n\n```java\n@EJB(beanName=\"com.tutorialspoint.stateless.LibraryPersistentBean\"\
  )\npublic void setLibraryPersistentBean(LibraryPersistentBeanRemote libraryBean)\
  \ {\n    this.libraryBean = libraryBean;\n}\n...\n}\n```\n\n## 使用 @Resource 的步骤\n\
  \n`@Resource` 通常用于注入 EJB 容器提供的单例。\n\n```java\npublic class LibraryMessageBean implements\
  \ MessageListener {\n    @Resource\n    private MessageDrivenContext mdctx;\n  \
  \  ...\n}\n```\n\n## 示例应用程序\n\n让我们创建一个测试 EJB 应用程序，以测试 EJB 中的依赖注入服务（Dependency Injection\
  \ Service）。\n\n| 步骤 | 描述 |\n| :--- | :--- |\n| 1 | 在 `com.tutorialspoint.timer`\
  \ 包下创建一个名为 `EjbComponent` 的项目，如 `EJB - Create Application` 章节中解释的。 |\n| 2 | 使用 `EJB\
  \ - Message Driven Bean`（消息驱动会豆）章节中创建的 Beans。保持其他文件不变。 |\n| 3 | 清理并构建应用程序，以确保业务逻辑符合要求。\
  \ |\n| 4 | 最后，将应用程序以 jar 文件格式部署在 JBoss 服务器上。如果 JBoss 服务器尚未启动，它将自动启动。 |\n| 5 | 现在按照\
  \ `EJB - Create Application` 章节中 `Create Client to access EJB` 主题下的解释，创建 EJB 客户端（一个基于控制台的应用程序）。\
  \ |\n\n## EJBComponent (EJB 模块)\n\n### LibraryMessageBean.java\n\n```java\npackage\
  \ com.tuturialspoint.messagebean;\n\nimport com.tutorialspoint.entity.Book;\nimport\
  \ com.tutorialspoint.stateless.LibraryPersistentBeanRemote;\nimport javax.annotation.Resource;\n\
  import javax.ejb.ActivationConfigProperty;\nimport javax.ejb.EJB;\nimport javax.ejb.MessageDriven;\n\
  import javax.ejb.MessageDrivenContext;\nimport javax.jms.JMSException;\nimport javax.jms.Message;\n\
  import javax.jms.MessageListener;\nimport javax.jms.ObjectMessage;\n\n@MessageDriven(\n\
  \    name = \"BookMessageHandler\",\n    activationConfig = {\n        @ActivationConfigProperty(propertyName\
  \ = \"destinationType\", propertyValue = \"javax.jms.Queue\"),\n        @ActivationConfigProperty(propertyName\
  \ = \"destination\", propertyValue = \"/queue/BookQueue\")\n    }\n)\npublic class\
  \ LibraryMessageBean implements MessageListener {\n    @Resource\n    private MessageDrivenContext\
  \ mdctx;\n\n    @EJB\n    LibraryPersistentBeanRemote libraryBean;\n\n    public\
  \ LibraryMessageBean() {\n    }\n\n    public void onMessage(Message message) {\n\
  \        ObjectMessage objectMessage = null;\n        try {\n            objectMessage\
  \ = (ObjectMessage) message;\n            Book book = (Book) objectMessage.getObject();\n\
  \            libraryBean.addBook(book);\n        } catch (JMSException ex) {\n \
  \           mdctx.setRollbackOnly();\n        }\n    }\n}\n```\n\n## EJBTester (EJB\
  \ 客户端)\n\n### EJBTester.java\n\n```java\npackage com.tutorialspoint.test;\n\nimport\
  \ com.tutorialspoint.entity.Book;\nimport com.tutorialspoint.stateless.LibraryPersistentBeanRemote;\n\
  import java.io.BufferedReader;\nimport java.io.FileInputStream;\nimport java.io.IOException;\n\
  import java.io.InputStreamReader;\nimport java.util.List;\nimport java.util.Properties;\n\
  import javax.jms.ObjectMessage;\nimport javax.jms.Queue;\nimport javax.jms.QueueConnection;\n\
  import javax.jms.QueueConnectionFactory;\nimport javax.jms.QueueSender;\nimport\
  \ javax.jms.QueueSession;\nimport javax.naming.InitialContext;\nimport javax.naming.NamingException;\n\
  \npublic class EJBTester {\n    BufferedReader brConsoleReader = null;\n    Properties\
  \ props;\n    InitialContext ctx;\n\n    {\n        props = new Properties();\n\
  \        try {\n            props.load(new FileInputStream(\"jndi.properties\"));\n\
  \        } catch (IOException ex) {\n            ex.printStackTrace();\n       \
  \ }\n        try {\n            ctx = new InitialContext(props);\n        } catch\
  \ (NamingException ex) {\n            ex.printStackTrace();\n        }\n       \
  \ brConsoleReader = new BufferedReader(new InputStreamReader(System.in));\n    }\n\
  \n    public static void main(String[] args) {\n        EJBTester ejbTester = new\
  \ EJBTester();\n        ejbTester.testMessageBeanEjb();\n    }\n\n    private void\
  \ showGUI() {\n        System.out.println(\"**********************\");\n       \
  \ System.out.println(\"Welcome to Book Store\");\n        System.out.println(\"\
  **********************\");\n        System.out.print(\"Options \\n1\\. Add Book\\\
  n2\\. Exit \\nEnter Choice: \");\n    }\n\n    private void testMessageBeanEjb()\
  \ {\n        try {\n            int choice = 1;\n            Queue queue = (Queue)\
  \ ctx.lookup(\"/queue/BookQueue\");\n            QueueConnectionFactory factory\
  \ = (QueueConnectionFactory) ctx.lookup(\"ConnectionFactory\");\n            QueueConnection\
  \ connection = factory.createQueueConnection();\n            QueueSession session\
  \ = connection.createQueueSession(false, QueueSession.AUTO_ACKNOWLEDGE);\n     \
  \       QueueSender sender = session.createSender(queue);\n            while (choice\
  \ != 2) {\n                String bookName;\n                showGUI();\n      \
  \          String strChoice = brConsoleReader.readLine();\n                choice\
  \ = Integer.parseInt(strChoice);\n                if (choice == 1) {\n         \
  \           System.out.print(\"Enter book name: \");\n                    bookName\
  \ = brConsoleReader.readLine();\n                    Book book = new Book();\n \
  \                   book.setName(bookName);\n                    ObjectMessage objectMessage\
  \ = session.createObjectMessage(book);\n                    sender.send(objectMessage);\n\
  \                } else if (choice == 2) {\n                    break;\n       \
  \         }\n            }\n            LibraryPersistentBeanRemote libraryBean\
  \ = (LibraryPersistentBeanRemote) ctx.lookup(\"StatefulSessionBean/remote\");\n\
  \            List<Book> booksList = libraryBean.getBooks();\n            System.out.println(\"\
  Book(s) entered so far: \" + booksList.size());\n            int i = 0;\n      \
  \      for (Book book : booksList) {\n                System.out.println((i + 1)\
  \ + \". \" + book.getName());\n                i++;\n            }\n        } catch\
  \ (Exception e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n\
  `EJBTester` 执行以下任务：\n* 从 `jndi.properties` 加载属性并初始化 `InitialContext`。\n* 在 `testMessageBeanEjb()`\
  \ 中，通过 JNDI 查找 `/queue/BookQueue` 获取 JBoss 中可用的队列。然后使用 `queue session` 创建 `sender`。\n\
  * 然后向用户显示书商店界面并要求输入选择。\n* 如果用户输入 `1`，系统请求书名并通过 `sender` 将书发送到队列。当 JBoss 容器接收到队列中的此消息时，会调用消息驱动豆的\
  \ `onMessage` 方法。我们的消息驱动豆随后使用状态豆的 `addBook()` 方法保存书籍。状态豆通过 `EntityManager` 调用将书籍持久化到数据库。\n\
  * 如果用户输入 `2`，则再次通过 JNDI 查找 `StatefulSessionBean/remote` 获取远程业务对象（状态豆 EJB）并列出书籍。\n\
  \n## 运行客户端以访问 EJB\n\n在项目管理器中找到 `EJBTester.java`。右键点击 `EJBTester` 类并选择 **run file**。\n\
  \n在 Netbeans 控制台中验证以下输出。\n\n```\nrun:\n**********************\nWelcome to Book Store\n\
  **********************\nOptions\n1\\. Add Book\n2\\. Exit\nEnter Choice: 1\nEnter\
  \ book name: Learn EJB\n**********************\nWelcome to Book Store\n**********************\n\
  Options\n1\\. Add Book\n2\\. Exit\nEnter Choice: 2\nBook(s) entered so far: 1\n\
  1\\. Learn EJB\nBUILD SUCCESSFUL (total time: 15 seconds)\n```\n\n上述输出表明，我们的消息驱动豆正在接收消息并将其存储在持久化存储存储器中，并且从数据库中检索书籍。\n\
  \n我们的消息驱动豆使用 `@EJB` 注解注入的 `LibraryPersistentBean`，并在异常情况下使用 `MessageDrivenContext`\
  \ 对象回滚事务。\n\n# 拦截器 (Interceptors)\n\nEJB 3.0 提供了使用带有 `@AroundInvoke` 注解的方法拦截业务方法调用的规范。拦截器方法在\
  \ `ejbContainer` 调用被拦截的业务方法之前执行。以下是拦截器方法的示例签名\n\n```java\n@AroundInvoke\npublic\
  \ Object methodInterceptor(InvocationContext ctx) throws Exception {\n    System.out.println(\"\
  *** Intercepting call to LibraryBean method: \" + ctx.getMethod().getName());\n\
  \    return ctx.proceed();\n}\n```\n\n拦截器方法可以在三个级别上应用或绑定。\n\n\n\n\n\n- **Default（默认）**\
  \ — 部署中的每个 bean 都会被默认拦截器调用。默认拦截器只能通过 xml（`ejb-jar.xml`）应用。\n- **Class（类）** — 类级拦截器会为\
  \ bean 的每个方法被调用。类级拦截器既可以通过注解也可以通过 xml（`ejb-jar.xml`）应用。\n- **Method（方法）** — 方法级拦截器为\
  \ bean 的特定方法被调用。方法级拦截器既可以通过注解也可以通过 xml（`ejb-jar.xml`）应用。\n\n在这里我们讨论类级拦截器。\n\n###\
  \ 拦截器类 (Interceptor Class)\n\n```java\npackage com.tutorialspoint.interceptor;\n\
  \nimport javax.interceptor.AroundInvoke;\nimport javax.interceptor.InvocationContext;\n\
  \npublic class BusinessInterceptor {\n\n    @AroundInvoke\n    public Object methodInterceptor(InvocationContext\
  \ ctx) throws Exception {\n        System.out.println(\"*** Intercepting call to\
  \ LibraryBean method: \"\n        + ctx.getMethod().getName());\n        return\
  \ ctx.proceed();\n    }\n}\n```\n\n### 远程接口 (Remote Interface)\n\n```java\nimport\
  \ javax.ejb.Remote;\n\n@Remote\npublic interface LibraryBeanRemote {\n    //添加业务方法声明\n\
  }\n```\n\n### 被拦截的无状态 EJB (Intercepted Stateless EJB)\n\n```java\n@Interceptors\
  \ ({BusinessInterceptor.class})\n@Stateless\npublic class LibraryBean implements\
  \ LibraryBeanRemote {\n    //实现业务方法\n}\n```\n\n## 示例应用程序 (Example Application)\n\
  \n让我们创建一个测试 EJB 应用程序来测试被拦截的无状态 EJB。\n\n| 步骤 | 描述 |\n| :--- | :--- |\n| 1 |按照 *EJB\
  \ - Create Application* 章节中的说明，在包 `com.tutorialspoint.interceptor` 下创建一个名为 `EjbComponent`\
