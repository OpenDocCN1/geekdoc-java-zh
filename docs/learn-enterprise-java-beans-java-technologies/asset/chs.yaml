- "# Enterprise Java Beans 入门指南 [Java 技术]\n\n\n\n![](img/cover00330.jpeg)\n\n版权 ©\
  \ 版权所有\n\n未经出版者明确书面许可，本书的任何部分不得复制、存储在检索系统中，或以任何形式或手段（电子、机械、复印、录音或其他）进行传输。\n\n我我想将此本书献给将使用它的学生们。祝愿你们未来职业成功，并希望你们永停止学习。\n\
  \n# 目录\n\n- 概述\n- 环境配置\n- 创建应用\n- 无状态 Bean\n- 有状态 Bean\n- 持久化\n- 消息驱动 Bean\n- 注解\n\
  - 回调函数\n- 定时器服务\n- 依赖注入\n- 拦截器\n- 嵌入对象\n- 大二进制对象/大字符对象\n- 事务\n- 安全\n- JNDI 绑定\n\
  - 实体关系\n- 访问数据库\n- 查询语言\n- 异常处理\n- Web 服务\n- 应用打包\n\n# 概述\n\nEJB 代表 **Enterprise\
  \ Java Beans**（企业级 Java Bean）。EJB 是 J2EE 平台不可或缺的一部分。J2EE 平台具有基于组件的架构，用于为企业级应用提供多层、分布式和高事务的特性。\n\
  \nEJB 提供了一种架构，用于开发和部署考虑了健壮性、高扩展性和高性能的基于组件的企业级应用。EJB 应用可以部署在任何符合 J2EE 1.3 标准规范的应用程序服务器上。\n\
  \n我们将在本教程中详细讨论 EJB 3.0。\n\n## 类型\n\nEJB 主要分为三类；下表列出了它们的名称及简要描述：\n\n| 序号 | 类型与描述\
  \ |\n| :--- | :--- |\n| 1 | 会话 Bean (Session Bean)。会话 Bean 为单个会话存储特定用户的数据。它可以是 `stateful`（有状态）或\
  \ `stateless`（无状态）。与实体 Bean 相比，它的资源消耗较低。会话 Bean 在用户会话结束时立即销毁。 |\n| 2 | 实体 Bean (Entity\
  \ Bean)。**实体 Bean**代表持久数据存储。用户数据可以通过实体 Bean 保存到数据库，稍后可以通过实体 Bean 从数据库中检索。 |\n| 3\
  \ | 消息驱动 Bean (Message Driven Bean)。**消息驱动 Bean** 用于 JMS（Java 服务）上下文。消息驱动 Bean 可以从外部实体消费\
  \ JMS 消息并采取相应的行动。 |\n\n## 优势\n\n以下是 EJB 的重要优势：\n\n- 简化了大型企业级应用的开发。\n- 应用程序服务器/EJB\
  \ 容器提供了大多数系统级服务，如事务处理、日志记录、负载均衡、持久化机制、异常处理等。开发者只需关注应用的业务逻辑。\n- EJB 容器管理 EJB 实例的生命周期，因此开发者无需担心何时创建/删除\
  \ EJB 对象。\n\n# 环境配置\n\nEJB 是一个 Java 框架，因此首要要求是在你的机器上安装了 **Java 开发工具包** (JDK)。\n\n\
  ## 系统要求\n\n| 项目 | 值 |\n| :--- | :--- |\n| JDK | 1.5 或更高版本。 |\n| 内存 | 无最低要求。 |\n\
  | 磁盘空间 | 无最低要求。 |\n| 操作系统 | 无最低要求。 |\n\n### 步骤 1 - 验证系统中的 Java 安装\n\n现在打开控制并执行以下\
  \ `java` 命令。\n\n| 操作系统 | 任务 | 命令 |\n| :--- | :--- | :--- |\n| Windows | 打开命令控制台\
  \ | `c:\\> java -version` |\n| Linux | 打开命令行终端 | `$ java -version` |\n| Mac | 打开终端\
  \ | `machine:~ joseph$ java -version` |\n\n让我们验证所有操作系统的输出结果：\n\n| 操作系统 | 输出 |\n\
  | :--- | :--- |\n| Windows | java version \"1.6.0_21\"Java(TM) SE Runtime Environment\
  \ (build 1.6.0_21-b11)Java HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed\
  \ mode) |\n| Linux | java version \"1.6.0_21\"Java(TM) SE Runtime Environment (build\
  \ 1.6.0_21-b11)Java HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |\n\
  | Mac | java version \"1.6.0_21\"Java(TM) SE Runtime Environment (build 1.6.0_21-b11)Java\
  \ HotSpot(TM) 64-Bit Server VM (build 23.21-b01, mixed mode) |\n\n如果尚未安装 Java，请从\
  \ **oracle.com** 安装 Java。\n\n### 步骤 2 - 设置 Java 环境\n\n将 `JAVA_HOME` 环境变量指向 Java\
  \ 安装的目录。\n\n| 操作系统 | 路径 |\n| :--- | :--- |\n| Windows | `C:\\Program Files\\Java\\\
  jdk1.6.0_21` |\n| Linux | `/usr/lib/jvm/jdk1.6.0_21` |\n| Mac | `/Library/Java/JavaVirtualMachines/jdk1.6.0_21.jdk/Contents/Home`\
  \ |\n\n将 `JAVA_HOME` 的 `bin` 目录添加到系统的 `PATH` 变量中。\n\n### 步骤 3 - 下载并安装 NetBeans\n\
  \n从 **oracle.com** 下载最新版本的 NetBeans。本教程使用的是 7.3 版本。\n\n### 步骤 4 - 设置 JBoss 应用程序\n\
  \n你可以从 **jboss.org** 下载最新版本的 JBoss 服务器。将压缩包解压到机器上的任何位置。\n\n### 步骤 5 - 为 NetBeans\
  \ 配置 JEE 插件\n\n使用 `Tools > Plugins` 打开插件窗口。打开 \"Available Plugin\" 标签卡，并在 \"Java\
  \ Web\" 分类下选择 \"Java EE Base\" 和 \"EJB and EAR\"。点击安装按钮。NetBeans 将下载并安装相应的插件。使用\
  \ \"Installed\" 标签卡验证插件。\n\n### 步骤 6 - 在 NetBeans 中配置 JBoss 服务器\n\n进入 Services 标签并右键点击\
  \ servers 添加服务器。打开 Add Server Instance 向导。选择 JBoss 并在下一步输入相关信息以在 netbeans 中配置服务器。\n\
  \n### 步骤 7 - 安装数据库服务器 (PostGreSql)\n\n从 **postgresql.org** 下载最新版本的 PostGreSql 数据库服务器。\n\
  \n# 创建应用\n\n创建一个简单的 EJB 模块，我们将使用 NetBeans 的 \"New project\" 向导。在下例示例中，我们将创建一个名为\
  \ Component 的 EJB 模块项目。\n\n## 创建项目\n\n在 NetBeans IDE 中，选择 `File > New Project >`。在类别\
  \ `Java EE` 下选择项目类型，项目类型选择 `EJB Module`。点击 `Next >`。\n\n\n\n\n\n![Image](img/image00320.jpeg)\n\
  \n选择 Server 为 **JBoss Application Server**。点击 **Finish** 按钮。你将看到 NetBeans 创建了以下项目。\n\
  \n![Image](img/image00321.jpeg)\n\n## 创建示例 EJB\n\n要创建一个简单的 EJB，我们将使用 NetBeans 的“New”（新建）向导。在下例示例中，我们将在\
  \ `EjbComponent` 项目下创建一个名为 `librarySessionBean` 的无状态 EJB 类。\n\n在项目资源管理器窗口中选择 `EjbComponent`\
  \ 项目并右键点击它。选择 **New > Session Bean**。你将看到 **New Session Bean**（新建会话豆）向导。\n\n![Image](img/image00322.jpeg)\n\
  \n输入会话豆名称和包名。点击 **Finish** 按钮。你将看到 NetBeans 创建了以下 EJB 类。\n\n*   `LibrarySessionBean`\
  \ — 无状态会话豆\n*   `LibrarySessionBeanLocal` — 会话豆的本地接口\n\n我正在将本地接口改为远程接口，因为我们将在基于控制台的应用程序中访问\
  \ EJB。远程/本地接口用于暴露 EJB 必须实现的业务方法。\n\n`LibrarySessionBeanLocal` 被重命名为 `LibrarySessionBeanRemote`，且\
  \ `LibrarySessionBean` 实现了 `LibrarySessionBeanRemote` 接口。\n\n### LibrarySessionBeanRemote\n\
  \n```java\npackage com.tutorialspoint.stateless;\n\nimport java.util.List;\n\nimport\
  \ javax.ejb.Remote;\n\n@Remote\n\npublic  interface LibrarySessionBeanRemote  \n\
  \nvoid addBook(String bookName);\n\nList getBooks();\n\n}\n```\n\n### LibrarySessionBean\n\
  \n```java\npackage com.tutorialspoint.stateless;\n\nimport java.util.ArrayList;\n\
  \nimport java.util.List;\n\nimport javax.ejb.Stateless;\n\n@Stateless\n\npublic\
  \  class LibrarySessionBean  implements LibrarySessionBeanRemote {\n\nList<String>\
  \ bookShelf;\n\npublic  LibrarySessionBean()  {\n\nbookShelf =  new ArrayList<String>();\n\
  \n}\n\npublic  void addBook(String bookName)  {\n\nbookShelf.add(bookName);\n\n\
  }\n\npublic  List<String> getBooks()  {\n\nreturn bookShelf;\n\n}\n\n}\n```\n\n\
