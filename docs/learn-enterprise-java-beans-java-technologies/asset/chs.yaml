  \n无状态会话豆是企业豆的一种，通常用于执行独立操作。无状态会话豆正如其名，没有关联的客户端状态，但它可以保留其实例状态。EJB 容器通常会创建一个池。\n\n\
  ## 创建无状态豆的步骤\n\n创建无状态豆的步骤如下：\n\n*   在 `compile` 标签页下，使用 `Add Project` 按钮将早先创建的 EJB\
  \ 组件项目添加到 libraries。\n*   在 `compile` 标签页下，使用 `Add jar/folder` 按钮添加 jboss 库。Jboss\
  \ 库位于 `<jboss installation folder>> client folder`。\n\n### 示例豆 (Bean)\n\n创建无状态豆的步骤如下：\n\
  \n*   在 `com.tutorialspoint.stateless` 包下创建一个名为 `EjbComponent` 的无状态豆。\n*   使用 `@Stateless`\
  \ 注解来标识它。\n*   为会话豆创建一个远程接口（Remote Interface）。在 `com.tutorialspoint.stateless` 包下使用\
  \ `@Remote` 注解，如果客户端在不同的环境中。\n\n### 远程接口 (Remote Interface)\n\n```java\npackage\
  \ com.tutorialspoint.stateless;\n\nimport java.util.List;\n\n@Remote\npublic interface\
  \ LibrarySessionBean {\n    void addBook(String bookName);\n    List getBooks();\n\
  }\n```\n\n### 无状态豆 (Stateless Bean)\n\n```java\npackage com.tutorialspoint.stateless;\n\
  \nimport java.util.ArrayList;\nimport java.util.List;\nimport javax.ejb.Stateless;\n\
  \n@Stateless\npublic class LibrarySessionBean {\n    List<String> bookShelf;\n\n\
  \    public LibrarySessionBean() {\n        bookShelf = new ArrayList<>();\n   \
  \ }\n\n    public void addBook(String bookName) {\n        bookShelf.add(bookName);\n\
  \    }\n\n    public List<String> getBooks() {\n        return bookShelf;\n    }\n\
  }\n```\n\n## 示例应用 (Example Application)\n\n让我们为无状态豆创建一个示例应用。\n\n| 步骤 | 描述 |\n| :---\
