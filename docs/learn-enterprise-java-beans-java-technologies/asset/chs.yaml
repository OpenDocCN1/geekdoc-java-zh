  \ book) {\n        entityManager.persist(book);\n    }\n\n    public List<Book>\
  \ getBooks() {\n        //create an ejbql expression\n        String ejbQL = \"\
  From Book b where b.name like ?1\";\n        //create query\n        Query query\
  \ = entityManager.createQuery(ejbQL);\n        //substitute parameter.\n       \
  \ query.setParameter(1, \"%test%\");\n        //execute the query\n        return\
  \ query.getResultList();\n    }\n}\n```\n\n* 一旦你将 `EjbComponent` 项目部署到 `JBOSS` 上，请注意\
