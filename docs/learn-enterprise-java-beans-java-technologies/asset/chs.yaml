  for (Book book:booksList) {\nSystem.out.println((i+1)+\". \" + book.getName());\n\
  i++;\n}\nLibraryStatefulSessionBeanRemote libraryBean1 =\n(LibraryStatefulSessionBeanRemote)ctx.lookup(\"\
  LibraryStatefulSessionBean/remote\");\nList<String> booksList1 = libraryBean1.getBooks();\n\
  System.out.println(\n***Using second lookup to get library stateful object***\"\
  );\nSystem.out.println(\n\"Book(s) entered so far: \" + booksList1.size());\nfor\
  \ (int i = 0; i < booksList1.size(); ++i) {\nSystem.out.println((i+1)+\". \" + booksList1);\n\
  }\n} catch (Exception e) {\nSystem.out.println(e.getMessage());\ne.printStackTrace();\n\
  }\nfinally {\nif(brConsoleReader !=null) {\nbrConsoleReader.close();\n}\n}\n}\n\
  } catch (IOException ex) {\nSystem.out.println(ex.getMessage());\nex.printStackTrace();\n\
  }\n}\n}\n```\n\n\n\n\n\n*   `EntityManager` - 持久化接口，用于对持久化对象（实体）执行添加/删除/更新/查找数据操作。它还可以帮助使用\
  \ `Query` 接口执行查询。\n*   `Persistence unit (persistence.xml)` - 持久单元描述持久化机制的属性。\n\
  *   `Data Source (*ds.xml)` - 数据源描述与数据存储相关的属性，如连接 URL、用户名、密码等。\n\n为了演示 EJB 持久化机制，我们需要完成以下任务：\n\
  \n*   `Step 1` - 在数据库中创建表。\n*   `Step 2` - 创建与表对应的实体类（Entity class）。\n*   `Step\
  \ 3` - 创建数据源（Data Source）和持久化单元（Persistence Unit）。\n*   `Step 4` - 创建一个拥有 `EntityManager`\
  \ 实例的无状态 EJB。\n*   `Step 5` - 更新无状态 EJB。添加通过 entity manager 从数据库添加和获取记录的方法。\n* \
  \  `Step 6` - 创建一个控制台应用程序客户端访问无状态 EJB 以将数据持久化到数据库中。\n\n## Create Table\n\n在默认数据库\
  \ `postgres` 中创建一个名为 `books` 表。\n\n```sql\nCREATE TABLE books (\nid integer PRIMARY\
  \ KEY,\nname varchar(50)\n);\n```\n\n## Create Entity class\n\n```java\n// 使用 `Entity`\
  \ 注解将其标记为实体\n// 使用 `Table` 注解映射表名\n@Entity\n@Table(name=\"books\")\npublic  class\
  \  Book  implements  Serializable{\n    private  int id;\n    private  String name;\n\
  \    public  Book()  {\n    }\n    // 将 id 标记为具有自动生成值的主键\n    // 将数据库列 id 映射到 id\
  \ 字段\n    @Id\n    @GeneratedValue(strategy=  GenerationType.IDENTITY)\n    @Column(name=\"\
  id\")\n    public  int getId()  {\n        return id;\n    }\n...\n}\n```\n\n##\
  \ CreateDataSource and Persistence Unit\n\n### DataSource (jboss-ds.xml)\n\n```xml\n\
  <?xml version =  \"1.0\" encoding =  \"UTF-8\"?>\n<datasources>\n<local-tx-datasource>\n\
  <jndi-name>PostgresDS</jndi-name>\n<connection-url>jdbc:postgresql://localhost:5432/postgres</connection-url>\n\
  <driver-class>org.postgresql.driver</driver-class>\n<user-name>sa</user-name>\n\
  <password>sa</password>\n<min-pool-size>5</min-pool-size>\n<max-pool-size>20</max-pool-size>\n\
  <idle-timeout-minutes>5</idle-timeout-minutes>\n</local-tx-datasource>\n</datasources>\n\
  ```\n\n### Persistence Unit (persistence.xml)\n\n```xml\n<persistence  version \
  \ =  \"1.0\" xmlns  =  \"http://java.sun.com/xml/ns/persistence\"  xmlns:xsi  =\
  \  \"http://www.w3.org/2001/XMLSchema-instance\"  xsi:schemaLocation=\"http://java.sun.com/xml/ns/persistence\
  \ http://java.sun.com/xml/ns/persistence/persistence_1_0.xsd\">\n<persistence-unit\
  \  name  =  \"EjbComponentPU\"  transaction-type  =  \"JTA\">\n<jta-data-source>java:/PostgresDS</jta-data-source>\n\
  <exclude-unlisted-classes>false</exclude-unlisted-classes>\n<properties/>\n</persistence-unit>\n\
  <persistence-unit  name  =  \"EjbComponentPU2\"  transaction-type  =  \"JTA\">\n\
  <provider>org.hibernate.ejb.HibernatePersistence</provider>\n<jta-data-source>java:/PostgresDS</jta-data-source>\n\
  <exclude-unlisted-classes>false</exclude-unlisted-classes>\n<properties>\n<property\
  \  name=\"hibernate.hbm2ddl.auto\"  value=\"update\"/>\n</properties>\n</persistence-unit>\n\
  </persistence>\n```\n\n## Create Stateless EJB Having EntityManager Instance\n\n\
  ```java\n@Stateless\npublic  class  LibraryPersistentBean  implements  LibraryPersistentBeanRemote\
  \  {\n    // 将持久化单元传递给 entityManager。\n    @PersistenceContext(unitName=\"EjbComponentPU\"\
  )\n    private  EntityManager entityManager;\n    public  void addBook(Book book)\
  \  {\n        entityManager.persist(book);\n    }\n    public  List<Book> getBooks()\
  \  {\n        return entityManager.createQuery(\"From Books\").getResultList();\n\
  \    }\n...\n}\n```\n\n构建 EJB 模块后，我们需要一个客户端来访问无状态豆，我们将在下一节中创建它。\n\n## Example Application\n\
