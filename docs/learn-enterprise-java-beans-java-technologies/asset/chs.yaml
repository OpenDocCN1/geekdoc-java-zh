  }\n```\n\n在这个示例中，我们使用了 `UserTransaction` 接口通过调用 `userTransaction.begin()` 方法来标记事务的开始。我们通过使用\
  \ `userTransaction.commit()` 方法标记事务的完成，如果在事务期间发生任何异常，则通过调用 `userTransaction.rollback()`\
  \ 方法回滚整个事务。\n\n# 安全性\n\n安全性是任何企业级应用的主要关注点。它包括对访问应用程序的用户或系统进行标识。根据标识，它允许或拒绝对应用程序内资源的访问。EJB\
  \ 容器管理标准的安全问题，或者也可以进行自定义以处理任何特定的安全问题。\n\n## 安全核心术语\n\n- **身份验证 (Authentication)**\
  \ − 确保访问系统或应用程序的用户身份真实的过程。\n- **授权 (Authorization)** − 确保经过验证的用户具有相应权限级别访问系统资源的过程。\n\
  - **用户 (User)** − 用户代表访问应用程序的客户端或系统。\n- **用户组 (User Groups)** − 用户可能是具有特定权限的组的一部分，例如管理员组。\n\
  - **用户角色 (User Roles)** − 角色定义了用户拥有的权限级别或访问系统资源的权限。\n\n## 容器管理的安全性 (Container Managed\
  \ Security)\n\nEJB 3.0 指定了以下安全属性/注解，由 EJB 容器实现。\n\n- **DeclareRoles** − 指明该类将接受声明的角色。注解应用于类级别。\n\
  - **RolesAllowed** − 指明该方法可以被指定角色的用户访问。它可以应用于类级别，导致类中的所有方法都可以被指定角色的用户访问。\n- **PermitAll**\
  \ − 指明业务方法对所有人可见。它可以可以应用于类级别，也可以应用于方法级别。\n- **DenyAll** − 指明业务方法无法被类级别或方法级别指定的任何用户访问。\n\
  \n### 示例\n\n```java\npackage com.tutorialspoint.security.required;\n\nimport javax.ejb.*\n\
  \n@Stateless\n@DeclareRoles({\"student\" \"librarian\"})\npublic class LibraryBean\
  \ implements LibraryRemote {\n\n    @RolesAllowed({\"librarian\"})\n    public void\
  \ delete(Book book) {\n        //delete book\n    }\n\n    @PermitAll\n    public\
  \ void viewBook(Book book) {\n        //view book\n    }\n\n    @DenyAll\n    public\
  \ void deleteAll() {\n        //delete all books\n    }\n}\n```\n\n## 安全配置\n\n在配置文件中映射角色和用户组。\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE sun-ejb-jar PUBLIC\
  \ \"-//Sun Microsystems, Inc.//DTD Application Server 9.0 EJB 3.0//EN\" \"http://www.sun.com/software/appserver/dtds/sun-ejb-jar_3_0-0.dtd\"\
  >\n<ejb-jar>\n    <security-role-mapping>\n        <role-name>student</role-name>\n\
  \        <group-name>student-group</group-name>\n    </security-role-mapping>\n\
  \    <security-role-mapping>\n        <role-name>librarian</role-name>\n       \
  \ <group-name>librarian-group</group-name>\n    </security-role-mapping>\n    <enterprise-beans/>\n\
  </ejb-jar>\n```\n\n# JNDI 绑定\n\nJNDI 代表 Java Naming and Directory Interface（Java\
  \ 命名和目录接口）。它是一组 API 和服务接口。Java 应用程序使用 JNDI 进行命名和目录服务。在 EJB 语文中，有两个术语。\n\n- **绑定\
  \ (Binding)** − 指给 EJB 对象分配一个名称，以便以后使用。\n- **查找 (Lookup)** − 指查找并获取 EJB 对象。\n\n\
  在 Jboss 中，session beans 默认以以下格式绑定到 JNDI 中：\n\n- **local** − `EJB-name/local`\n-\
  \ **remote** − `EJB-name/remote`\n\n如果 EJB 封封装在 `<application-name>.ear` 文件中，则默认格式如下：\n\
  \n- **local** − `application-name/ejb-name/local`\n- **remote** − `application-name/ejb-name/remote`\n\
  \n## 默认绑定示例\n\n请参考 `Default Binding`。\n\n\n\n\n\n我们将在这里演示多对多（ManyToMany）映射的使用。为了表示多对多关系，需要以下三张表——\n\
  \n* `Book` — 书籍表，存储书籍记录。\n* `Author` — 作者表，存储作者记录。\n* `Book_Author` — 书籍作者表，存储上述书籍表和作者表之间的关联。\n\
  \n## 创建表\n\n在默认数据库 `postgres` 中创建表 `book`、`author``book_author`。\n\n```sql\nCREATE\
