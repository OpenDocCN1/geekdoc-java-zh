  \ - EJB3.x Remote Business Interface\n...\n```\n\n## EJBTester (EJB 客户端)\n\n###\
  \ jndi.properties\n\n```properties\njava.naming.factory.initial=org.jnp.interfaces.NamingContextFactory\n\
  java.naming.factory.url.pkgs=org.jboss.naming:org.jnp.interfaces\njava.naming.provider.url=localhost\n\
  ```\n\n* 这些属性用于初始化 `java` 命名服务的 `InitialContext` 对象。\n* `InitialContext` 对象将被用于查找无会话\
  \ bean。\n\n### EJBTester.java\n\n```java\npackage com.tutorialspoint.test;\n\nimport\
  \ com.tutorialspoint.stateless.LibraryPersistentBeanRemote;\nimport java.io.BufferedReader;\n\
  import java.io.FileInputStream;\nimport java.io.IOException;\nimport java.io.InputStreamReader;\n\
  import java.util.List;\nimport java.util.Properties;\nimport javax.naming.InitialContext;\n\
  import javax.naming.NamingException;\n\npublic class EJBTester {\n    BufferedReader\
  \ brConsoleReader = null;\n    Properties props;\n    InitialContext ctx;\n\n  \
  \  {\n        props = new Properties();\n        try {\n            props.load(new\
  \ FileInputStream(\"jndi.properties\"));\n        } catch (IOException ex) {\n \
  \           ex.printStackTrace();\n        }\n        try {\n            ctx = new\
  \ InitialContext(props);\n        } catch (NamingException ex) {\n            ex.printStackTrace();\n\
  \        }\n        brConsoleReader = new BufferedReader(new InputStreamReader(System.in));\n\
  \    }\n\n    public static void main(String[] args) {\n        EJBTester ejbTester\
  \ = new EJBTester();\n        ejbTester.testEntityEjb();\n    }\n\n    private void\
  \ showGUI() {\n        System.out.println(\"**********************\");\n       \
  \ System.out.println(\"Welcome to Book Store\");\n        System.out.println(\"\
  **********************\");\n    }\n\n    private void testEntityEjb() {\n      \
  \  try {\n            int choice = 1;\n            LibraryPersistentBeanRemote libraryBean\
  \ = (LibraryPersistentBeanRemote) ctx.lookup(\"LibraryPersistentBean/remote\");\n\
  \            while (choice != 2) {\n                String bookName;\n         \
  \       showGUI();\n                String strChoice = brConsoleReader.readLine();\n\
  \                choice = Integer.parseInt(strChoice);\n                if (choice\
  \ == 1) {\n                    System.out.println(\"Enter book name: \");\n    \
  \                bookName = brConsoleReader.readLine();\n                    Book\
  \ book = new Book();\n                    book.setName(bookName);\n            \
  \        libraryBean.addBook(book);\n                } else if (choice == 2) {\n\
  \                    break;\n                }\n            }\n            List<Book>\
  \ booksList = libraryBean.getBooks();\n            System.out.println(\"Book(s)\
  \ entered so far: \" + booksList.size());\n            int i = 0;\n            for\
  \ (Book book : booksList) {\n                System.out.println((i+1) + \". \" +\
  \ book.getName());\n                i++;\n            }\n        } catch (Exception\
  \ e) {\n            System.out.println(e.getMessage());\n            e.printStackTrace();\n\
  \        } finally {\n            try {\n                if (brConsoleReader !=\
  \ null) {\n                    brConsoleReader.close();\n                }\n   \
  \         } catch (IOException ex) {\n                System.out.println(ex.getMessage());\n\
  \            }\n        }\n    }\n}\n```\n\n`EJBTester` 执行以下任务：\n* 从 `jndi.properties`\
  \ 加属性并初始化 `InitialContext` 对象。\n* 在 `testEntityEjb()` 方法中，通过名称 `\"LibraryPersistentBean/remote\"\
  ` 查找获取远程业务对象（会话）。\n* 然后向用户显示书商店界面，并要求其输入一个选择。\n* 如果用户输入 `1`，系统询问书名并使用无会话 bean `addBook()`\
  \ 方法保存书籍。\n* 如果用户输入 `2`，系统使用无会话 bean `getBooks()` 方法检索书籍并退出。\n* 然后再次通过名称 `\"LibraryPersistentBean/remote\"\
  ` 查找获取远程业务对象（会话 EJB）并列出书籍。\n\n## 运行客户端访问 EJB\n\n在项目资源管理器找到 `EJBTester.java`。右键点击\
  \ `EJBTester` 类并选择运行文件。\n\n在 Netbeans 控制台中验证以下输出。\n\n```\nrun:\n**********************\n\
  Welcome to Book Store\n**********************\nOptions\n1. Add Book\n2. Exit\nEnter\
  \ Choice: 1\nEnter book name: Learn Testing\n**********************\nWelcome to\
  \ Book Store\n**********************\nOptions\n1. Add Book\n2. Exit\nEnter Choice:\
  \ 2\nBook(s) entered so far: 1\n1. learn Testing\n\nBUILD SUCCESSFUL (total time:\
  \ 15 seconds)\n```\n\n# 异常处理\n\nEJB 是企业级应用程序的一部分，通常基于分布式环境。因此，除了可能发生的异常外，还可能出现通信故障、安全权限、服务器宕机等异常。\n\
  \nEJB 容器以两种方式考虑异常：\n\n* **应用异常** —— 如果违反了业务规则或在执行业务逻辑时发生异常。\n* **系统异常** —— 任何不是由业务逻辑或业务代码引起的异常。`RuntimeException`、`RemoteException`\
  \ 都是系统异常。例如，查找 EJB 期间错误。`RuntimeException`、`RemoteException` 都是系统异常。\n\n\n\n\n\n\
  当 `Application Exception` 发生时，EJB 容器会拦截该异常，但将其原样返回给客户端。除非在代码中通过 `EJBContext.setRollBackOnly()`\
  \ 方法明确指定，否则不会回滚事务。在发生 `Application Exception` 的情况下，EJB 容器不会对异常进行封装。\n\n当 `System\
  \ Exception` 发生时，EJB 容器会拦截该异常、回滚事务并启动清理任务。它会将异常封装进 `RemoteException` 并抛抛给客户端。\n\n\
  ## 处理应用程序异常\n\n应用程序异常通常在 Session EJB 方法中抛出，因为这些方法负责执行业务逻辑。应用程序异常应该在业务方法的 `throws`\
  \ 子句中声明，并在业务逻辑失败时被抛出。\n\n```java\n@Stateless\npublic class LibraryPersistentBean\
  \ implements LibraryPersistentBeanRemote {\n    ...\n    public List<Book> getBooks()\
  \ throws NoBookAvailableException {\n        List<Book> books =\n            entityManager.createQuery(\"\
  From Books\").getResultList();\n        if(books.size == 0)\n            throw NoBookAvailableException(\"\
  No Book available in library.\");\n        return books;\n    }\n    ...\n}\n```\n\
  \n## 处理系统异常\n\n系统异常可能发生在任何时候，例如命名查找失败、获取数据时发生 SQL 错误。在这种情况下，此类异常应该封装在 `EJBException`\
  \ 下并返回给客户端。\n\n```java\n@Stateless\npublic class LibraryPersistentBean implements\
  \ LibraryPersistentBeanRemote {\n    ...\n    public List<Book> getBooks() {\n \
  \       try {\n            List<Book> books =\n                entityManager.createQuery(\"\
  From Books\").getResultList();\n        } catch (CreateException ce) {\n       \
  \     throw (EJBException) new EJBException(ce).initCause(ce);\n        } catch\
  \ (SqlException se) {\n            throw (EJBException) new EJBException(se).initCause(se);\n\
  \        }\n        return books;\n    }\n    ...\n}\n```\n\n在客户端，处理 `EJBException`。\n\
  \n```java\npublic class EJBTester {\n    private void testEntityEjb() {\n      \
  \  ...\n        try {\n            LibraryPersistentBeanRemote libraryBean =\n \
  \               (LibraryPersistentBeanRemote)ctx.lookup(\"LibraryPersistentBean/remote\"\
  );\n            List<Book> booksList = libraryBean.getBooks();\n        } catch(EJBException\
  \ e) {\n            Exception ne = (Exception) e.getCause();\n            if(ne.getClass().getName().equals(\"\
  SqlException\")) {\n                System.out.println(\"Database error: \"+ e.getMessage());\n\
  \            }\n        }\n        ...\n    }\n}\n```\n\n# Web Services\n\nEJB 3.0\
  \ 提供了一个将 Session EJB 暴露为 Web 选项。使用 `@WebService` 注解标记类为 Web 服务端点，并使用 `@WebMethod`\
  \ 将方法暴露为给客户端的 Web 方法。\n\n```java\n@Stateless\n@WebService(serviceName=\"LibraryService\"\
  )\npublic class LibraryPersistentBean implements LibraryPersistentBeanRemote {\n\
  \    ...\n    @WebMethod(operationName=\"getBooks\")\n    public List<Book> getBooks()\
  \ {\n        return entityManager.createQuery(\"From Books\").getResultList();\n\
  \    }\n    ...\n}\n```\n\n## 示例应用程序\n\n让我们创建一个测试 EJB 应用程序来测试 EJB 3.0 对 blob/clob\
  \ 的支持。\n\n| 步骤 | 描述 |\n| :--- | :--- |\n| 1 | 在包 `com.tutorialspoint.entity` 下创建一个名为\
  \ `EjbComponent` 的项目，如 EJB - Create Application 章节所示。请使用 EJB - Persistence 章节中创建的项目，以便在本章节中理解\
  \ EJB 概念中的 clob/blob 对象。 |\n| 2 | 在包 `com.tutorialspoint.stateless` 下创建 `LibraryPersistentBean.java`。参考\
  \ EJB - Persistence 章节。保持其他文件不变。 |\n| 3 | 清理并构建应用程序，确保业务逻辑按照要求运行。 |\n| 4 | 最后，以\
  \ jar 文件的形式将应用程序部署到 JBoss 应用服务器上。如果 JBoss 应用服务器尚未启动，它将自动启动。 |\n\n### LibraryPersistentBean.java\n\
  \n```java\npackage com.tutorialspoint.stateless;\n\nimport com.tutorialspoint.entity.Book;\n\
  import java.util.List;\nimport javax.ejb.Stateless;\nimport javax.jws.WebMethod;\n\
  import javax.jws.WebService;\nimport javax.persistence.EntityManager;\nimport javax.persistence.PersistenceContext;\n\
  \n@Stateless\n@WebService(serviceName=\"LibraryService\")\npublic class LibraryPersistentBean\
  \ implements LibraryPersistentBeanRemote {\n    public LibraryPersistentBean() {\n\
  \    }\n\n    @PersistenceContext(unitName=\"EjbComponentPU\")\n    private EntityManager\
  \ entityManager;\n\n    public void addBook(Book book) {\n        entityManager.persist(book);\n\
  \    }\n\n    @WebMethod(operationName=\"getBooks\")\n    public List <Book> getBooks()\
  \ {\n        return entityManager.createQuery(\"From Book\").getResultList();\n\
  \    }\n}\n```\n\n### JBoss 应用服务器日志输出\n\n```text\n10:51:37,271 INFO [EJBContainer]\
