  \ 方法中，通过名称 `\"LibrarySessionBean/remote\"` 进行 jndi 查找以获取远程业务对象（无状态 ejb）。\n* 随后向用户显示书商店用户界面并要求其输入选择。\n\
  * 如果用户输入 1，系统会提示书名并使用无状态会 Bean 的 `addBook()` 方法保存书籍。会 Bean 将书籍存储在其实例变量中。\n* 如果用户输入\
  \ 2，系统使用无状态会 Bean 的 `getBooks()` 方法检索书籍并退出。\n\n* 上述输出可能取决于 JBoss 维护的无状态对象数量。\n*\
  \ 在维护单个无状态对象的情况下，每次查找后都会看到相同的列表。\n* EJB 容器每次查找都会返回相同的无状态对象。\n\n# 有状态 Bean\n\n有状态\
  \ Bean 是企业 Bean 类型，与客户端保持会话状态。有状态 Bean 将关联的状态保存在其实例变量中。EJB 容器创建一个有状态 Bean 来处理客户端请求。一旦请求范围结束，有状态\
  \ Bean 就会被销毁。\n\n## 创建有状态 Bean 的步骤\n\n所需的步骤如下：\n\n* 创建暴露业务方法的远程/本地接口。\n* 该接口将供 EJB\
  \ 客户端使用。\n* 如果 EJB 客户端与 Bean 位于同一环境，请使用 `@Local`。\n* 如果 EJB 客户端与 Bean 位于不同环境，请使用\
  \ `@Remote`。\n* 实现上述接口的有状态 Bean。\n* 使用 `@Stateful` 注解标记为有状态 Bean。EJB 容器在部署期间通过读取该注解自动创建所需的配置或接口。\n\
  \n### 远程接口\n\n```java\nimport javax.ejb.Remote;\n\n@Remote\npublic interface LibraryStatefulSessionBeanRemote\
  \ {\n    //添加业务方法声明\n}\n```\n\n### 有状态 EJB\n\n```java\nimport javax.ejb.Stateful;\n\
  \n@Stateful\npublic class LibraryStatefulSessionBean implements LibraryStatefulSessionBeanRemote\
  \ {\n    //实现业务方法\n}\n```\n\n## 示例应用程序\n\n让我们创建一个应用程序来测试有状态 EJB。\n\n| 步骤 | 描述 |\n\
