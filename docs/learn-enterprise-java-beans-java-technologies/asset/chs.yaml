  ## 运行客户端以访问 EJB\n\n在项目资源管理器中找到 `EJBTester.java`。右键点击 `EJBTester` 类并选择 `run file`。\n\
  \n在 Netbeans 控制台中验证以下输出：\n\n```\nrun:\n**********************\nWelcome to Book Store\n\
