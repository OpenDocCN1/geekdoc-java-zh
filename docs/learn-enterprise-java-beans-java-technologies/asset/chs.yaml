  - `Serializable Object`\n\n```java\n@Entity\n@Table(name=\"books\")\n@EntityListeners(BookCallbackListener.class)\n\
  public class Book implements Serializable {\n    ...\n    private byte[] image;\n\
  \    @Lob @Basic(fetch=FetchType.EAGER)\n    public byte[] getImage() {\n      \
  \  return image;\n    }\n    ...\n}\n```\n\n## 示例应用程序\n\n让我们创建一个测试 EJB 应用程序来测试 EJB\
