  \ Loaded Book: 1\n...\n```\n\n# 定时服务 (Timer Service)\n\n定时服务是构建调度应用程序的机制。例如，在每月\
  \ 1 号生成工资单。EJB 3.0 规范规定了 `@Timeout` 注解，它有助于在无状态豆或消息驱动豆中编写 EJB 服务。EJB 容器会调用被 `@Timeout`\
  \ 注解标记的方法。\n\nEJB 定时服务是由 EJB 容器提供的服务，有助于创建定时器并在定时器过期时调度回调。\n\n## 创建定时器的步骤\n\n使用\
  \ `@Resource` 注解在豆中注入 `SessionContext` −\n\n```java\n@Stateless\npublic class TimerSessionBean\
  \ {\n    @Resource\n    private SessionContext context;\n    ...\n}\n```\n\n使用 `SessionContext`\
  \ 对象获取 `TimerService` 并创建定时器。传递毫秒级时间和消息。\n\n```java\npublic void createTimer(long\
  \ duration) {\n    context.getTimerService().createTimer(duration, \"Hello World!\"\
  );\n}\n```\n\n## 使用定时器的步骤\n\n对方法使用 `@Timeout` 注解。返回类型应为 `void` 并传递一个类型为 `Timer`\
  \ 的参数。我们在第一次执行后取消定时器，否则它将在固定间隔后继续运行。\n\n```java\n@Timeout\npublic void timeOutHandler(Timer\
  \ timer) {\n    System.out.println(\"timeoutHandler : \" + timer.getInfo());\n \
  \   timer.cancel();\n}\n```\n\n## 示例应用程序\n\n让我们创建一个测试 EJB 应用程序来测试 EJB 中的定时服务。\n\n\
