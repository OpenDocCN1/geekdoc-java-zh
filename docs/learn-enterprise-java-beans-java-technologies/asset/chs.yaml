  \ *EJB - Create Application* 章节中的说明，在 `com.tutorialspoint.interceptor` 包下创建 `LibraryBean.java`\
  \ 和 `LibraryBeanRemote`。保持其他文件不变。 |\n| 3 | 清理并构建应用程序，以确保业务逻辑符合要求。 |\n| 4 | 最后，将应用程序以\
  \ jar 文件的形式部署在 JBoss 应用服务器上。如果 JBoss 应用服务器尚未启动，它会自动启动。 |\n| 5 | 现在，按照 *EJB - Create\
  \ Application* 章节中 **Create Client to access EJB** 主题下的说明，同样创建一个 ejb 客户端（一个基于控制台的应用程序）。\
  \ |\n\n## EJBComponent (EJB 模块)\n\n### LibraryBeanRemote.java\n\n```java\npackage\
  \ com.tutorialspoint.interceptor;\n\nimport java.util.List;\nimport javax.ejb.Remote;\n\
  \n@Remote\npublic interface LibraryBeanRemote {\n    void addBook(String bookName);\n\
