  \ Intercepting call to LibraryBean method: addBook\n\n09:55:43,661 INFO [STDOUT]\
  \ *** Intercepting call to LibraryBean method: getBooks\n```\n\n# 可嵌入对象\n\n`EJB`\
  \ `3.0` 提供了将 `JAVA POJO`（普通 Java 对象）嵌入到实体豆（entity bean）中的选项，并允许将列名映射到嵌入 POJO 类的方法。要嵌入的\
  \ Java POJO 必须标记为 `@Embeddable`。\n\n```java\n@Embeddable\npublic class Publisher\
  \ implements Serializable {\n    private String name;\n    private String address;\n\
  \    ...\n}\n```\n\n可以使用 `@Embedded` 注解来嵌入上述类。\n\n```java\n@Entity\npublic class\
