  \            }\n        }\n    }\n}\n```\n\n## 运行客户端以访问 EJB\n\n在项目资源管理器中找到 `EJBTester.java`。右键点击\
  \ `EJBTester` 类并选择 `run file`。\n\n在 Netbeans 控制台中核实以下输出。\n\n```text\nrun:\n**********************\n\
  Welcome to Book Store\n**********************\nOptions\n1\\. Add Book\n2\\. Exit\n\
  Enter Choice: 1\nEnter book name: Learn Java\n**********************\nWelcome to\
  \ Book Store\n**********************\nOptions\n1\\. Add Book\n2\\. Exit\nEnter Choice:\
  \ 2\nBook(s) entered so far: 1\n1\\. Learn Java\n***Using second lookup to get library\
  \ stateless object***\nBook(s) entered so far: 0\nBUILD SUCCESSFUL (total time:\
  \ 13 seconds)\n```\n\n在接下来的章节中，我们将涵盖此完整 EJB 应用的多个方面。\n\n## 无状态 Bean (Stateless Bean)\n\
  \n无状态会话豆（Stateless session bean）是企业豆的一种，通常用于执行独立操作。正如其名，无状态会话豆没有关联的客户端状态，但它可以保留其实例状态。EJB\
  \ 容器通常会创建一个池。\n\n## 创建无状态豆的步骤\n\n创建无状态豆的步骤如下：\n\n*   在 `compile` 标签页下，使用 `Add Project`\
  \ 按钮将早先创建的 EJB 组件添加到 libraries。\n*   在 `compile` 标签页下，使用 `Add jar/folder` 按钮添加 jboss\
  \ 库。Jboss 库位于 `<jboss installation folder>> client folder`。\n\n在项目 `EjbTester` 下创建\
  \ `jndi.properties`。\n\n```properties\njava.naming.factory.initial=org.jnp.interfaces.NamingContextFactory\n\
  java.naming.factory.url.pkgs=org.jboss.naming:org.jnp.interfaces\njava.naming.provider.url=localhost\n\
  ```\n\n创建包 `com.tutorialspoint.test` 并在其下创建 `EJBTester.java` 类。\n\n### EJBTester.java\n\
  \n```java\npackage com.tutorialspoint.test;\n\nimport com.tutorialspoint.stateless.LibrarySessionBeanRemote;\n\
  \nimport java.io.BufferedReader;\nimport java.io.FileInputStream;\nimport java.io.IOException;\n\
  import java.io.InputStreamReader;\nimport java.util.List;\nimport java.util.Properties;\n\
  import javax.naming.InitialContext;\nimport javax.naming.NamingException;\n\npublic\
  \ class EJBTester {\n    BufferedReader brConsoleReader = null;\n    Properties\
  \ props;\n    InitialContext ctx;\n\n    {\n        props = new Properties();\n\
  \        try {\n            props.load(new FileInputStream(\"jndi.properties\"));\n\
  \        } catch (IOException ex) {\n            ex.printStackTrace();\n       \
  \ }\n        try {\n            ctx = new InitialContext(props);\n        } catch\
  \ (NamingException ex) {\n            ex.printStackTrace();\n        }\n       \
  \ brConsoleReader = new BufferedReader(new InputStreamReader(System.in));\n    }\n\
  \n    public static void main(String[] args) {\n        EJBTester ejbTester = new\
  \ EJBTester();\n        ejbTester.testStatelessEjb();\n    }\n\n    private void\
  \ showGUI() {\n        System.out.println(\"**********************\");\n       \
  \ System.out.println(\"Welcome to Book Store\");\n        System.out.println(\"\
  **********************\");\n        System.out.print(\"Options \\n1\\. Add Book\\\
  n2\\. Exit \\nEnter Choice: \");\n    }\n\n    private void testStatelessEjb() {\n\
  \        try {\n            int choice = 1;\n            LibrarySessionBeanRemote\
  \ libraryBean = (LibrarySessionBeanRemote)ctx.lookup(\"LibrarySessionBean/remote\"\
  );\n            while (choice != 2) {\n                String bookName;\n      \
  \          showGUI();\n                String strChoice = brConsoleReader.readLine();\n\
  \                choice = Integer.parseInt(strChoice);\n                if (choice\
  \ == 1) {\n                    System.out.print(\"Enter book name: \");\n      \
  \              bookName = brConsoleReader.readLine();\n                    libraryBean.addBook(bookName);\n\
  \                } else if (choice == 2) {\n                    break;\n       \
  \         }\n            }\n            List<String> booksList = libraryBean.getBooks();\n\
  \            System.out.println(\"Book(s) entered so far: \" + booksList.size());\n\
  \            for (int i = 0; i < booksList.size(); ++i) {\n                System.out.println((i+1)+\"\
