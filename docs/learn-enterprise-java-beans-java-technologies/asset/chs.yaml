  \ Bean（Message driven bean）正在接收消息并存储在持久化存储中，并且从数据库中检索书籍。\n\n# 注解 (Annotations)\n\
  \n注解是在 Java 5.0 中引入的。注解的作用是在代码中的类或类的元数据中附加信息。在 EJB 3.0 中，注解用于描述 EJB 类的配置元数据。通过这种方式，EJB\
  \ 3.0 消除了在配置 XML 文件中描述数据的需要。\n\nEJB 容器使用编译器工具通过读取注解来生成所需的制品（如接口、部署描述）。以下是常用的注解列表。\n\
  \n| 序号 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| 1 | `javax.ejb.Stateless` | 指定给定的\
  \ EJB 类为无状态会话豆（stateless session bean）。 |\n\n\n\n\n\n* `name` — 用于指定会话豆（session\
  \ bean）的名称。\n* `mappedName` — 用于指定会话豆的 JNDI 名称。\n* `description` — 用于提供会话豆的描述。\n\
  \n| ID | Class | Description |\n| :--- | :--- | :--- |\n| 2 | `javax.ejb.Stateful`\
  \ | 指定指定的 EJB 类是有状态的会话豆（stateful session bean）。属性： |\n\n* `name` — 用于指定会话豆的名称。\n\
  * `mappedName` — 用于指定会话豆的 JNDI 名称。\n* `description` — 用于提供会话豆的描述。\n\n| 3 | `javax.ejb.MessageDrivenBean`\
  \ | 指定指定的 EJB 类是消息驱动豆（message driven bean）。属性： |\n\n* `name` — 用于指定消息驱动豆的名称。\n*\
  \ `messageListenerInterface` — 用于指定消息驱动豆的消息监听接口。\n* `activationConfig` — 用于指定消息驱动豆在运行环境中的配置细节。\n\
  * `mappedName` — 用于指定会话豆的 JNDI 名称。\n* `description` — 用于提供会话豆的描述。\n\n| 4 | `javax.ejb.EJB`\
  \ | 用于将依赖作为 EJB 实例指定或注入另一个 EJB 中。属性： |\n\n* `name` — 用于指定名称，该名称将用于在环境中定位被引豆。\n*\
  \ `beanInterface` — 用于指定被引用豆的接口类型。\n* `beanName` — 用于提供被引用豆的名称。\n* `mappedName`\
  \ — 用于指定被引用豆的 JNDI 名称。\n* `description` — 用于提供被引用豆的描述。\n\n| 5 | `javax.ejb.Local`\
  \ | 用于指定会话豆的本地接口。此本地接口声明了会话豆的业务方法（豆可以是无状态的或有状态的）。此接口用于将业务方法暴露给运行在与 EJB 相同部署/应用程序中的本地客户端。属性：\
  \ |\n\n* `value` — 以接口数组的形式指定本地接口列表。\n\n| 6 | `javax.ejb.Remote` | 用于指定会话豆的远程接口。此远程接口声明了会话豆的业务方法（豆可以是无状态的或有状态的）。此接口用于将业务方法暴露给运行在与\
  \ EJB 不同部署/应用程序中的远程客户端。属性： |\n\n* `value` — 以接口数组的形式指定远程接口列表。\n\n| 7 | `javax.ejb.ActivationConfigProperty`\
  \ | 用于指定消息驱动豆所需的属性。例如，端点、目标地、消息选择器等。此注解作为参数传递给 `javax.ejb.MessageDrivenBean` 注解的\
  \ `activationConfig` 属性。属性： |\n\n* `propertyName` — 属性名称。\n* `propertyValue` — 属性值。\n\
  \n| 8 | `javax.ejb.PostActivate` | 用于指定 EJB 生命期的回调方法。当 EJB 容器刚刚激活/重新激活豆实例时，该方法会被调用。此接口用于将业务方法暴露给运行在与\
  \ EJB 相同部署/应用程序中的本地客户端。 |\n\n# 回调\n\n回调是一种可以拦截企业级豆（enterprise bean）生命机的机制。EJB 3.0\
  \ 规范规定了回调，并为这些回调创建了回调处理方法。EJB 容器会调用这些回调。我们可以在 EJB 类本身或单独的类中定义回调方法。EJB 3.0 为回调提供了许多注解。\n\
  \n以下是无状态豆（stateless bean）的回调注解列表：\n\n| Annotation | Description |\n| :--- | :---\
  \ |\n| `@PostConstruct` | 在豆第一次创建时调用。 |\n| `@PreDestroy` | 在豆从豆池中移除或被销毁时调用。 |\n\n\
  以下是有状态豆（stateful bean）的回调注解列表：\n\n| Annotation | Description |\n| :--- | :--- |\n\
  | `@PostConstruct` | 在豆第一次创建时调用。 |\n| `@PreDestroy` | 在豆从豆池中移除或被销毁时调用。 |\n| `@PostActivate`\
  \ | 在豆被加载使用时调用。 |\n| `@PrePassivate` | 在豆被放回豆池时调用。 |\n\n以下是消息驱动豆（message driven\
  \ bean）的回调注解列表：\n\n| Annotation | Description |\n| :--- | :--- |\n| `@PostConstruct`\
  \ | 在豆第一次创建时调用。 |\n| `@PreDestroy` | 在豆从豆池中移除或被销毁时调用。 |\n\n以下是实体豆（entity bean）的回调注解列表：\n\
  \n| Annotation | Description |\n| :--- | :--- |\n| `@PrePersist` | 在实体在数据库中创建时调用。\
  \ |\n| `@PostPersist` | 在实体在数据库中创建后调用。 |\n| `@PreRemove` | 在实体从数据库中删除时调用。 |\n| `@PostRemove`\
  \ | 在实体从数据库中删除后调用。 |\n| `@PreUpdate` | 在实体要在数据库中更新之前调用。 |\n| `@PostLoad` | 当从数据库获取记录并加载到实体中时调用。\
  \ |\n\n## 示例应用程序\n\n让我们创建一个测试 EJB 应用来测试 EJB 中的各种回调。\n\n| Step | Description |\n\
