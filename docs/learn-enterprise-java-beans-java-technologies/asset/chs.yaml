  author_id integer,\nname varchar(50)\n);\n\nCREATE TABLE book_author (\nbook_id\
  \ integer,\nauthor_id integer\n);\n```\n\n## 创建实体类\n\n```java\n@Entity\n@Table(name=\"\
  author\")\npublic class Author implements Serializable{\n    private int id;\n \
