  *   选择 Deploy（部署）。\n\n你将在 NetBeans 控制台看到以下输出。\n\n```\nant -f C:\\\\EJB\\\\EjbComponent\
  \ -DforceRedeploy=true -Ddirectory.deployment.supported=false -Dnb.wait.for.caches=true\
  \ run\n\ninit:\n\ndeps-clean:\n\nlibrary-inclusion-in-archive:\n\nCreated dir: C:\\\
  EJB\\EjbComponent\\dist\nBuilding jar: C:\\EJB\\EjbComponent\\dist\\EjbComponent.jar\n\
  \ndist:\n\nBUILD SUCCESSFUL\n```\n\n## 创建访问 EJB 的客户端\n\n*   在 NetBeans IDE 中，选择\
  \ **File > New Project >**。\n*   在类别 **Java** 下选择项目类型，项目类型选择 **Java Application**。点击\
  \ Next > 按钮\n\n\n\n\n\n* 输入项目名称和位置。点击 `Finish >` 按钮。我们选择名称为 `EjbTester`。\n\n* 在项目资源管理器（Project\
  \ explorer）窗口中右键点击项目名称。选择 `properties`。\n\n* 在 `compile` 标签页下，使用 `Add Project` 按钮将早先创建的\
  \ EJB 组件项目添加到 libraries。\n\n* 在 `compile` 标签页下，使用 `Add jar/folder` 按钮添加 jboss 库。Jboss\
  \ 库位于 `<jboss installation folder>> client folder`。\n\n在名为 `EjbTester` 的项目下创建 `jndi.properties`。\n\
  \n### jndi.properties\n\n```properties\njava.naming.factory.initial=org.jnp.interfaces.NamingContextFactory\n\
  java.naming.factory.url.pkgs=org.jboss.naming:org.jnp.interfaces\njava.naming.provider.url=localhost\n\
  ```\n\n创建包 `com.tutorialspoint.test` 并在其下创建 `EJBTester.java` 类。\n\n### EJBTester.java\n\
  \n```java\npackage com.tutorialspoint.test;\n\nimport com.tutorialspoint.stateless.LibrarySessionBeanRemote;\n\
  \nimport java.io.BufferedReader;\nimport java.io.FileInputStream;\nimport java.io.IOException;\n\
  import java.io.InputStreamReader;\nimport java.util.List;\nimport java.util.Properties;\n\
  import javax.naming.InitialContext;\nimport javax.naming.NamingException;\n\npublic\
  \ class EJBTester {\n    BufferedReader brConsoleReader = null;\n    Properties\
  \ props;\n    InitialContext ctx;\n\n    {\n        props = new Properties();\n\
  \        try {\n            props.load(new FileInputStream(\"jndi.properties\"));\n\
  \        } catch (IOException ex) {\n            ex.printStackTrace();\n       \
  \ }\n        try {\n            ctx = new InitialContext(props);\n        } catch\
  \ (NamingException ex) {\n            ex.printStackTrace();\n        }\n       \
  \ brConsoleReader = new BufferedReader(new InputStreamReader(System.in));\n    }\n\
  \n    public static void main(String[] args) {\n        EJBTester ejbTester = new\
  \ EJBTester();\n        ejbTester.testStatelessEjb();\n    }\n\n    private void\
