  md: '# SUMMARY


    +   * A Java exception is an object that describes an exceptional (that is, error)
    condition that has occurred in a piece of code.

    * Java exception handling is managed via five keywords: try, catch, throw, throws,
    and finally.

    * A checked exception is an exception that occurs at the compile time, these are
    also called as compile exceptions.

    * An Unchecked exception is an exception that occurs at the time of execution,
    these are also called as Runtime Exceptions, and these include programming bugs,
    such as logic errors or improper use of an API.

    * All exception classes are subtypes of the java.lang. Exception class. The exception
    class is a subclass of the Throwable class. Other than the exception class there
    is another subclass called Error which is derived from the Throwable class.

    * A method catches an exception using a combination of the try and catch keywords.
    A try/catch block is placed around the code that might generate an exception.

    * A multithreaded program contains two or more parts that can run concurrently.
    Each part of such a program is called a thread, and each thread defines a separate
    path of execution.'
