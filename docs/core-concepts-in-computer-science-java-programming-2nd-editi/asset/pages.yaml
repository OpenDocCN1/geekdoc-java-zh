  md: '# SUMMARY


    +   * Multithreading is a programming concept in which the application can create
    a small unit of tasks to execute in parallel.

    * In Java, threads provide a lightweight mechanism for implementing multiple concurrent
    execution paths within an application.

    * Java''s creators have graciously designed two ways of creating threads: implementing
    an interface and extending a class.

    * Once a thread is stopped, it cannot be restarted with the start() command, since
    stop() will terminate the execution of a thread.

    * Java has a Thread Scheduler that monitors all running threads in all programs
    and decides which threads should be running and which are in line to be executed.

    * A multi-threaded program allocates a fixed amount of time to each individual
    thread. Each and every thread runs for a short while then pauses and relinquishes
    the CPU to another thread, so that other threads can get a chance to run.

    * Synchronization in java is the capability to control the access of multiple
    threads to any shared resource.

    * Inter-thread communication refers to the mechanisms and techniques used to coordinate
    the activities of multiple threads in a multithreaded program.

    * Daemon threads are sometimes called "service" threads that normally run at a
    low priority and provide a basic service to a program or programs when activity
    on a machine is reduced.

    * Java provides a convenient way to group multiple threads in a single object.
    In such way, we can suspend, resume or interrupt group of threads by a single
    method call.'
