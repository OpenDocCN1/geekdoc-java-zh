  md: 'Object-oriented programming (OOPs) is a methodology that simplifies software
    development and maintenance by providing some rules.


    Basic concepts of OOPs are:


    +   - Object

    - Class

    - Inheritance

    - Polymorphism

    - Abstraction

    - Encapsulation


    Object-oriented programming (OOPs) is a programming paradigm based on the concept
    of "objects", which may contain data, in the form of fields, as attributes; and
    in the form of procedures, often known as methods.


    # # Portable


    Java is portable because it facilitates you to carry the java bytecode to any
    platform. It doesn''t require any type of implementation.


    # # Platform Independent


    Java is platform independent because it is different from other languages like
    C, C++ which are compiled into platform specific machines while Java is a write
    once, run anywhere language. A platform is the hardware or software environment
    in which a program runs.


    There are two types of platforms software-based and hardware-based. Java provides
    software-based platform.


    The Java platform differs from other platforms in the sense that it is a software-based
    platform that runs on the top of other hardware-based platforms. It has two components:


    +   - Runtime Environment

    - API(Application Programming Interface)


    Java code can be run on multiple platforms e.g. Windows, Linux, Sun Solaris, Mac/OS
    etc. Java code is compiled by the compiler and converted into bytecode. This bytecode
    is a platform-independent code because it can be run on multiple platforms i.e.
    Write Once and Run Anywhere(WORA).'
