    # Thread Priority


    In Java, all the threads the developer created have the same priority, which the
    process will schedule firstly without worrying about the order. It is important
    for different threads to have different priorities. Important threads should always
    have higher priority than less important ones, while threads need to run quickly
    as a Daemon may only need the lowest priority. For example, the garbage collector
    thread needs the lowest priority to execute, which means it will not be executed
    before all other threads are scheduled to run. It is possible to control the priority
    of the threads by using Java APIs. The Thread.setPriority(...) method serves this
    purpose. The Thread class provides 3 constants for the priority:


    ```

    MIN_PRIORITY = 1, NORM_PRIORITY = 5, MAX_PRIORITY = 10

    ```'
