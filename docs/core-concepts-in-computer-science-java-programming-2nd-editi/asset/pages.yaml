    # Scheduling


    Java has a Thread Scheduler that monitors all running threads in all programs
    and decides which threads should be running and which are in line to be executed.
    There are two characteristics of a thread that the scheduler identifies in its
    decision process. One, the most important, is the priority of the thread, and
    the other is the daemon flag. The scheduler''s basic rule is if there are only
    daemon threads running, the Java Virtual Machine (JVM) will exit. New threads
    inherit the priority and daemon flag from the thread that created it. The scheduler
    determines which thread should be executed by analyzing the priorities of all.
    Those with the highest priority are allowed execution before any lower priority
    threads.


    > One thread is running at the lowest priority and at the highest priority. The
    threads will count until the faster thread''s counter catches up to the slower
    threads counter.


    The scheduler can have two flavors, preemptive or non-preemptive. Preemptive schedulers
    give a certain time-slice to all running threads on the system. The scheduler
    decides which thread is next to run and resume() that thread for some constant
    period of time. When the thread has executed for that time it will be suspended()
    and the next thread scheduled will be resumed(). Non-preemptive schedulers decide
    which thread should run and run until the thread is complete. The thread has full
    control of the system for as long as it likes. The yield() method is a way for
    a thread to force the scheduler to start executing another wait. Depending on
    the system Java is running, the scheduler can be either preemptive or non-preemptive.


    # Priorities


    The scheduler determines which thread should be running based on a priority number
    assigned to each thread. The range of priorities is from 1 to 10. The default
    priority of a thread is Thread.NORM_PRIORITY, which is assigned the value of 5.
    Two other static variables are made available, they Thread.MIN_PRIORITY, which
    is set to 1, and Thread.MAX_PRIORITY, which is set to 10. The getPriority() method
    can be used to find the current value of the priority of a thread.


    Using threads in Java will enable greater flexibility to programmers looking for
    that extra edge in their programs. The simplicity of configuring and running threads
    lets Java programmers devise portable and powerful applets/applications that cannot
    be made in other third-generation languages. Threads allow any program to perform
    multiple tasks at once.


