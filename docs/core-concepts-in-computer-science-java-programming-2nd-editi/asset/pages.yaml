  md: '# String Array Declaration with Initial Size


    Arrays are usually used when we know how many objects are needed. Hence, arrays
    are usually declared with an initial size. Here is an example:


    ```

    String[] thisArray = new String[5];

    ```


    This will declare a String Array with 5 elements. Each element can be accessed
    using index that starts with 0. The first element is "thisAsStringArray[0]", the
    second element is "thisAsStringArray[1]", and so on. Here is an example of declaring
    a String Array with size 5 and assigning values to each element:


    ```

    String[] thisAsStringArray = new String[5];

    thisAsStringArray[0] = "AAA";

    thisAsStringArray[1] = "BBB";

    thisAsStringArray[2] = "CCC";

    thisAsStringArray[3] = "DDD";

    thisAsStringArray[4] = "EEE";

    ```


    Note, since there are only 5 elements and index started from 0, the last index
    will be 4. Or we could use the formula (array length - 1). This means we access
    the index greater than 4, an Exception will be raised. Example:


    ```

    String[] thisAsStringArray = new String[5];

    thisAsStringArray[5] = "FFF";

    ```


    The code will throw a java.lang.OutOfBoundsException.


    # String Array Initialization on Declaration


    There are multiple ways to initialize a String Array. Initialization can be done
    at the same time as the declaration. Here is an example:


    ```

    String[] thisAsStringArray = {"AAA", "BBB", "CCC", "DDD", "EEE"};

    ```


    This will create a String Array of length 5. Element at index 0 will have the
    value "AAA", element at index 1 will have the value "BBB", and so on. Here when
    we run this code:


    ```

    System.out.println(thisAsStringArray[0]);

    System.out.println(thisAsStringArray[1]);

    System.out.println(thisAsStringArray[2]);

    System.out.println(thisAsStringArray[3]);

    System.out.println(thisAsStringArray[4]);

    ```'
