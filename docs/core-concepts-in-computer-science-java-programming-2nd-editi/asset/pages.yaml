  md: 'For a byte to be most effective, it flows through a dedicated and reliable
    path sometimes referred to as a pipe, or pipeline. Such a path has to be reliable
    to ensure the output is accurate. In one respect, considering computer programming,
    the pipe is the path that connects the various aspects of a program so as data
    is processed from input, it can be passed to another part of the program, onto
    another, and so, until it reaches output.


    Another type of pipelineline can be used by certain operating systems to take
    data, such as the contents of a file, and run it through multiple different programs
    to produce some output. This is useful with text processing applications, made
    effective by way of a character stream to pass the data along. One of the most
    common uses of a byte stream, then, is for computer''s operating system when it
    is accessing data in a file.


    Octet is a unit of digital information in computing and telecommunications that
    consists of eight bits.


    In early computing networking, some systems made a distinction between a byte
    and what''s called an octet. Since an octet is a computing unit comprised of eight
    bits, the terms are sometimes used interchangeably, though on older systems, they
    are not the same thing. As a result, however, the octet stream is a term also
    used when speaking of a byte stream, though primarily with regards to computer
    networking. One example,"application/octet-stream," is the multipurpose Internet
    mail extensions (MIME) type for delivering any sort of binary data over a network.


    When it comes to sending a byte stream over a computer network, a reliable bi-directional
    transport layer protocol, such as the transmission control protocol (TCP) used
    on the Internet, is required.


    These are referred as a byte stream protocol. Other serial data protocols used
    with certain types of hardware components, such as the universal asynchronous
    receiver/transmitter (UART) technique, is a serial data channel that also uses
    a byte stream for communication.


    In this case, the byte, or character, is packed up in a frame on the transmitting
    end, where an extra starting bit and some optional checking bits are attached
    and then separated out of the frame on the receiving end. This technique is sometimes
    referred to as a byte-oriented protocol.'
