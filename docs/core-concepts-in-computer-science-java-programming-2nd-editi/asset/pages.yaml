  md: '# INTRODUCTION


    Operators are special symbols that perform specific operations on one, two, or
    three operands, and then return a result. As we explore the operators of the Java
    programming language, it may be helpful for you to know ahead which operators
    have the highest precedence.


    Java operators are symbols that are used to perform operations on variables and
    manipulate the values of the operands. Each operator performs specific operations.
    Let us consider an expression 5 + 1 = 6; here, 5 and 1 are operands, and the symbol
    + (plus) is called the operator. We will also learn about operator precedence
    and operator associativity.


    A control statement in java is a statement that determines whether the other statements
    will be executed or not. It controls the flow of a program. An ''if'' statement
    in java determines the sequence of execution between a set of two statements.


    Using operators and control statements, you can create complex logic, implement
    decision-making processes, and design iterative algorithms in your Java programs.
    These elements are fundamental for building dynamic and interactive applications.


    ![](img/e91a3f91eaacb03bb53843166396b235_67_0.png)


    # CORE CONCEPT: JAVA OPERATORS


    > They are used to manipulate primitive data types. Java operators can be classified
    as unary, binary, or ternary—meaning taking one, two, or three arguments, respectively.
    A unary operator may appear before (prefix) its argument or after (postfix) its
    argument. A binary or ternary operator appears between its arguments.


    An operator, in Java, is a special symbols performing specific operations on one
    or two operands and then returning a result. The operators are classified and
    listed according to precedence order. Java operators are generally used to manipulate
    primitive data types. The Java operators are classified into eight different categories:
    assignment, arithmetic, relational, logical, bitwise, compound assignment, conditional
    and type comparison operators.'
