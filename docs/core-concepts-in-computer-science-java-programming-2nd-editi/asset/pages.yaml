  md: '![](img/e91a3f91eaacb03bb53843166396b235_83_0.png)


    Java Control statements control the order of execution in a java program, based
    on data values and conditional logic. There are three main categories of control
    flow statements:


    +   * Selection statements: if, if-else and switch.

    * Loop statements: while, do-while and for.

    * Transfer statements: break, continue, return, try-catch-finally and assert.


    We use control statements when we want to change the default sequential order
    of execution.


    All programs we have written till now had a sequential flow of control i.e. the
    statements executed by line from the top to bottom in an order. Nowhere were statements
    skipped or a statement executed more than once. We will now look into how this
    can be achieved using control structures. Decision making statements, repetition
    and branching statements. Decision making statements are used to decide whether
    not a particular statement or a group of statements should be executed. Repetition
    statements are used to execute a statement or a group of statements more than
    once. Branching statements are used to transfer control to another line in the
    code. We shall look into the syntaxes of these structures first and then see how
    we formulate algorithms using these statements.


    # Decision Making in Java (if, if-else, switch, break, continue, jump)


    Decision making structures have one or more conditions to be evaluated or tested
    by the program, with a statement or statements that to be executed if the condition
    is determined to be true, and optionally, other statements to be executed if the
    condition is determined to be false. Following is the general form of a typical
    decision making structure found in most of the programming languages.'
