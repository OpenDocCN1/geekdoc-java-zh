  md: '# SSL/TLS


    The Java platform provides APIs and an implementation of the SSL and TLS protocols
    that includes functionality for data encryption, message integrity, server authentication,
    and optional client authentication. Applications can use SSL/TLS to provide for
    the secure passage of data between peers over any protocol, such as HTTP on top
    of TCP/IP.


    The javax.net.ssl.SSLSocket represents a network socket that encapsulates SSL/TLS
    support on top of a normal stream socket (java.net.Socket). Some applications
    might want to use alternate data transport abstractions (e.g., New-IO); the java.net.ssl.SSLEngine
    class is available to produce and consume SSL/TLS packages.


    The Java platform also includes APIs that support the notion of pluggable (provider-based)
    managers and trust managers. A key manager is encapsulated by the javax.net.ssl.KeyManager
    class, and the keys used to perform authentication. A trust manager is encapsulated
    by the TrustManager class (in the same package), and makes decisions about who
    to trust based on certificates in the key it stores.


    The Java platform includes a built-in provider that implements the SSL/TLS protocols:


    +   - SSLv3

    - TLSv1

    - TLSv1.1

    - TLSv1.2


