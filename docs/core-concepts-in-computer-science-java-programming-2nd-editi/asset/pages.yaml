  md: "# A CONCEPT OF OVERRIDING IN JAVA\n\nOverriding is when a child class has its\
    \ method implementation for the method already present in the parent class.\n\
    Technically, overriding is a function that requires a subclass or child class\
    \ to provide a variety of method implementations, that are already provided by\
    \ one of its superclasses or parent classes, in any object-oriented programming\
    \ language.\nWhen a method in a subclass has the same name and signature as its\
    \ super-class, the subclass is originated from the super-class.\n\n# Overriding\
    \ in Java\n\n![](img/e91a3f91eaacb03bb53843166396b235_326_0.png)\n\nOne of the\
    \ ways that Java manages Run Time Polymorphism is by overriding.\nThe object that\
    \ is used to trigger a method specifies the variant of the process that is executed.\
    \ If it implements a method with an object from a parent class, the parent class's\
    \ version will be used. But if the method is triggered with an object from a subclass,\
    \ the child class's version will be used.\n\n# Example 1\n\n```\n// here we declare\
    \ vehicle as a parent class\nclass Vehicle {\n// here we create a method as vehicle\
    \ has engine\n// but changing the output as vehicle engine\nvoid engine() {\n\
    \    System.out.println(\"this is vehicle engine\");\n}\n}\n\n// here we declare\
    \ child class\n// bike is based on vehicle category so its child class\n```"
