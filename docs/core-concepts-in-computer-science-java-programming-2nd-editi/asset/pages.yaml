    All the numeric wrapper classes are subclasses of the class java.lang.Number as
    shown in the Wrapper Class Hierarchy diagram. There are four other subclasses
    of Number that are not high. BigDecimal and BigInteger are used for high-precision
    calculations. AtomicInteger and AtomicLong are used forthreaded applications.
    The remaining two wrapper classes Character and Boolean are direct subclasses
    of java.lang.Object.


    # Examples of Java Wrapper Classes


    To describe the application of wrapper classes in java, let us create an Integer
    wrapper class object with primitive int value and get back the primitive value
    from the wrapper object.


    ```

    int i = 26; // Primitive data type ''int''

    // Wrapper class instantiation

    Integer i_Obj = new Integer(i);

    // Unwrapping primitive data ''int'' from wrapper object

    int i12 = i_Obj.intValue();

    ```


    # List of all Wrapper Classes in java


    The following table shows list of different types of wrapper classes in java:


    | Primitive data type | Wrapper class |

    |---|---|n| byte | Byte |

    | short | Short |

    | int | Integer |

    | long | Long |

    | float | Float |

    | double | Double |

    | char | Character |

    | boolean | Boolean |'
