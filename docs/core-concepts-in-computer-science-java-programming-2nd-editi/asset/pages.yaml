    no array actually exists. In fact, value of month_days is set to null, which represents
    an array with no value. To linkmonth with an actual, physical array of integers,
    you must allocate one new and assign it to month_days. new is a special operator
    that allocates memory.


    The general form of new as it applies to one-dimensional arrays appears as follows:


    ```

    array-var = new type[size];

    ```


    Here, type specifies the type of data to be allocated, size specifies the number
    of elements in the array, and array-var is the array variable that is linked to
    the array. That is, to use new to allocate an array, you must specify the type
    and number of elements to allocate. The elements in the array by new will automatically
    be initialized to zero. This example allocates a 12-element array of integers
    and links them to month_days.


    ```

    month_days = new int[12];

    ```


    After this statement executes, month_days will refer to an array of 12 integers.
    Further, all elements in the array will be initialized to zero.


    Obtaining an array is a two-step process.


    +   First, you must declare a variable of the desired array type.

    Second, you must allocate the memory that will hold the array, using new, and
    assign it to the array variable.


