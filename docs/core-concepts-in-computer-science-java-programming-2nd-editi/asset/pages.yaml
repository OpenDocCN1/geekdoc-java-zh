    This operator evaluates that the left operand is not equal to the right side.
    If the values on both sides of operator are not equal to each other, the not equal
    operator returns true.


    The above six comparison operators provide the foundation for comparing data in
    Java. Each operator is always a combination of two constants, variables, expressions,
    or a mix of these.'
