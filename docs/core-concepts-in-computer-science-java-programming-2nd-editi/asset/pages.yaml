    Simple Authentication and Security Layer (SASL) is an Internet standard that specifies
    a protocol for authentication and optional establishment of a security layer between
    client and server applications. SASL defines how authentication data is to be
    exchanged, but does not itself specify the contents of that data. It is a framework
    within which specific authentication mechanisms specify the contents and semantics
    of the authentication data can fit. A number of SASL mechanisms are defined by
    the Internet community for various security levels and deployment scenarios.


