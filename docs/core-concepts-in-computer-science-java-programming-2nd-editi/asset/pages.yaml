    # ## Important Methods of StringBuffer Class


    There are some important methods of stringbuffer class, as as:


    +   * public synchronized StringBuffer append(String s): is used to append the
    specified string with this string. The append(char), append(boolean), append(int),
    append(float), append(double) etc.

    * public synchronized StringBuffer insert(int offset, String s): is used to insert
    the specified string with this string at the specified position. The insert()
    method is overloaded like insert(int, char), insert(int, boolean), insert(int,
    int), insert(int, float), insert(int, double) etc.

    * public synchronized StringBuffer replace(int startIndex, int endIndex, String
    str): is used to replace the string from specified startIndex and endIndex.

    * public synchronized StringBuffer delete(int startIndex, int endIndex): is used
    to delete the string from specified startIndex and endIndex.

    * public synchronized StringBuffer reverse(): is used to reverse the string.

    * public int capacity(): is used to return the current capacity.

    * public void ensureCapacity(int minimumCapacity): is used to ensure the capacity
    at least to the given minimum.

    * public char charAt(int index): is used to return the character at the specified
    position.

    * public int length(): is used to return the length of the string that is of total
    number of characters.

    * public String substring(int beginIndex): is used to return the substring from
    the specified beginIndex.

    * public String substring(int beginIndex, int endIndex): is used to return the
    substring from the specified beginIndex and endIndex.


    # ## Wrapper Class


    In Java, a wrapper class is defined as a class in which a primitive value is wrapped
    up. These primitive wrapper classes are used to represent primitive data types
    as objects. The Java platform provides wrapper classes for each of the primitive
    data types. For example, Integer wrapper class holds primitive ''int'' data type
    value. Similarly, Float wrapper class contain ''float'' primitive values,Character
    wrapper class holds a ''char'' type value, and wrapper class represents ''boolean''
    value.'
