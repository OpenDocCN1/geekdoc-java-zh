    to the key (that is, it would not contain the actual key material). Such a Key
    object can only be used to perform cryptographic operations on the device where
    the actual key re-stored.


    The Java platform also includes an LDAP certificate store (for accessing certificates
    stored in an LDAP directory), as well as an in-memory Collection certificate store
