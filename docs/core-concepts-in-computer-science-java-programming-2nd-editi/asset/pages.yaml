    system (e.g., a local application). The location from which the code was represented
    by a URL, the code signer represented by the signer''s certificate, and default
    permissions are represented by java.security.Permission objects.


    The default permissions automatically granted to downloaded code include the ability
    to make network connections back to the host from which it originated. The default
    permissions automatically granted to code loaded from the local file system include
    the ability to read files from the directory it came from, and also from subdirectories
    of directory.


