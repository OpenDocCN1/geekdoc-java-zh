  md: '# A CONCEPT OF BUFFEREDINPUTSTREAM


    Java BufferedInputStream is a mechanism where the Input buffer has the capability
    to assign some bytes as part of the stream internally. Whenever a BufferedInputStream
    is invoked or created, an internal array will get created and then it will perform
    any kind of functionality of adding bytes into the stream. The buffer mechanism
    in the Buffered class provides flexibility and enhances the overall performance
    of the buffer. If some information gets missed from the stream, it refills and
    fills the evacuated position by assigning them.


