  md: '# CORE CONCEPT: THREAD LIFECYCLE


    The lifecycle of a thread in Java refers to the various stages that a thread goes
    through during its execution. Understanding the thread lifecycle is crucial for
    managing threads effectively and ensuring proper synchronization. A thread can
    exist in several states, and it transitions from one state to another based on
    its execution and interactions with the operating system and other threads.


    A thread in Java at any point of time exists in any one of the following states.
    A thread lies only in one of the shown states at any instant:


    +   1) New

    2) Runnable

    3) Blocked

    4) Waiting

    5) Timed Waiting

    6) Terminated


    The following figure represents various states of a thread at any instant of time:


    ![](img/e91a3f91eaacb03bb53843166396b235_289_0.png)


    # 1. New Thread:


    +   * When a new thread is created, it is in the new state.

    * The thread has not yet started to run when thread is in this state.

    * When a thread lies in the new state, it''s code is yet to be run and hasn’t
    started to execute.'
