    # # Daemon Thread


    Daemon threads are sometimes called "service" threads that normally run at a low
    priority and provide a basic service to a program or programs when activity on
    a machine is reduced. An example of a daemon thread that is continuously running
    is the garbage collector thread. This thread, provided by the JVM, will scan programs
    for variables that will never be accessed again and free up their resources back
    to the system. A thread can set the daemon flag by passing a true boolean value
    to the setDaemon())method. However, if a false boolean value is passed, the thread
    will become a user thread.


    Daemon is a low priority thread that runs in background to perform tasks such
    as garbage collection. Daemon thread in java is a service provider thread that
    provides services to the user thread. Its life depend on the mercy of user threads
    i.e. when all the user threads die, JVM terminates this thread automatically.


    +   There are many java daemon threads running automatically e.g. gc, finalizar
    etc.

    * It provides services to user threads for background supporting tasks. It has
    no role in life to serve user threads.

    * Its life depends on user threads.

    * It is a low priority thread.


    The command jconsole typed in the command prompt provides information about the
    loaded classes, memory usage, running threads etc.'
