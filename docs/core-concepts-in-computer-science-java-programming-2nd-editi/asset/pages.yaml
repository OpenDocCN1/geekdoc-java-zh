  md: '# Errors


    These are not exceptions at all, but problems that arise beyond the control of
    the user or the programmer. Errors are typically ignored in your code because
    you rarely do anything about an error. For example, if a stack overflow occurs,
    an error will arise. They are also ignored at the time of compilation.


    # Exception Hierarchy


    All exception classes are subtypes of the java.lang.Exception class. The exception
    class is a subclass of the Throwable class. Other than the exception class there
    is another subclass called Error which is derived from the Throwable class.


    Errors are abnormal conditions that happen in case of severe failures, these are
    not handled by the Java programs. Errors are generated to indicate errors by the
    runtime environment. Example: JVM is out of Memory. Normally programs cannot recover
    from errors.


    The Exception class has two main subclasses: IOException and RuntimeException.


    ![](img/e91a3f91eaacb03bb53843166396b235_201_0.png)


    Here is a list of most common checked and unchecked Java''s Built-in Exceptions.


    # Java''s Built-in Exceptions


    Java defines several exception classes inside the standard package java.lang.
    The most general of these exceptions are subclasses of the standard type RuntimeException.
    Since java.lang is implicitly imported into all Java programs, exceptions derived
    from RuntimeException are automatically available. Java defines several other
    types of exceptions that relate to its various class libraries. Following is the
    list of Java Unchecked RuntimeException.'
