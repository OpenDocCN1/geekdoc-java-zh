    # Advantage of Java Array


    There are some advantage of java array, such as:


    +   - **Code Optimization**: It makes the code optimized, we can retrieve or sort
    the data easily.

    - **Random access**: We can get any data located at any index position.


    # Disadvantage of Java Array


    +   - **Size Limit**: We can store only fixed size of elements in the array. It
    does not grow its size at runtime. To solve this problem, collection framework
    is used in java.


    # Types of Array in java


    There are two types of array.


    +   - One Dimensional Array

    - Multidimensional Arrays


    Variable is a value that can change, depending on conditions or information passed
