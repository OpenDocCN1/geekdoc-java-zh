    Inter-thread communication or Co-operation is all about allowing synchronized
    threads to communicate with each other. Interthread communication is important
    when you develop an application where two or more threads exchange some information.


    Cooperation (Inter-thread communication) is a mechanism in which a thread is paused
    running in its critical section and another thread is allowed to enter (or lock)
    in the same critical section to be executed. It is implemented by following methods
    of Object class:


    +   * wait()

    * notify()

    * notifyAll()


    All these methods belong to object class final so that all classes have them.
    They must be used within a synchronized block only.


