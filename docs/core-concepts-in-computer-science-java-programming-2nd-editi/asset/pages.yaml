  md: '# # History of Java


    At first glance, it may appear that Java was developed specifically for the World
    Web. However, interestingly, Java was developed independently of the web, and
    went through several stages of metamorphosis before reaching its current status
    of programming language for the World Web.


    Oak: According to Java FAQ, Bill Joy, a vice president at Sun Microsystems, is
    widely believed to have been the person to conceive of the idea of a programming
    language that became Java. In late 1970ss Java wanted to design a language that
    combined the best features of MESA and C.


    In an attempt to retire the UNIX operating system in 1980s, Joy decided that C++
    was inadequate for the job. A better tool was needed to write short and effective
    programs. This was his desire to invent a better programming tool that swayed
    Sun’s “Stealth Project” - as named by Scott McNally, Sun’s president.


    In 1991, Bill Joy, James Gosling, Mike Sheradin, Patrick Naughton (formerly the
    leader of Sun’s Open windows environment), and several other individuals in Aspen,
    Colorado for the first time to discuss the ideas for the Stealth Project. The
    goal of the Stealth Project was to do research in the area of computers in the
    consumer electronics market. The project was also named “Green” and it was started
    to make microprocessors on different machines (i.e. different platforms). Firstly,
    it was called “Greentalk” by James Gosling and file extension .gt.


    Initially, they started to develop the project in C++, but they faced many problems
    as they tried to extend the C++ compiler. During time, James Gosling started working
    on a new language called Oak which was later in 1995 renamed as Java. Oak is a
    symbol of strength and chosen as a national tree of many countries like U.S.A,
    Germany germany.


    The vision of the project was to develop “smart” consumer electronic devices that
    could be entirely controlled and programmed from a handheld-remote control- like
    device. According to Gosling, “the goal was to build a system that would let us
    do a large, distributed, heterogeneous network of consumer electronic devices
    all talking to each other.” With this goal in mind, the stealth project began
    work.


    Programming language is a computer language programming language used to develop
    software programs, scripts, or other sets of instructions for computers to execute.


    5


    # Java Basics


