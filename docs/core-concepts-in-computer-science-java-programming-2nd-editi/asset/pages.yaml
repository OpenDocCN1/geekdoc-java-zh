  md: '# I/O Streams


    A flow of data is often referred to as a data stream. A stream is an ordered sequence
    of bytes that has a SOURCE (input stream) or a DESTINATION (output stream). In
    simple terms, a stream can be defined as follows.


    A stream is a logical device that represents the flow of a sequence of characters.
    Programs can get inputs from a data source by reading a sequence of characters
    from the input stream. Similarly, programs can produce outputs by writing a sequence
    of characters to an output stream. A stream can be associated with a file, an
    Internet Resource (For example, a socket), to a pipe or a memory buffer. Streams
    can be chained together so that each type of stream adds its own processing to
    the bytes as they pass through the stream. For the purpose of letting information
    flow, a program opens a stream on an information source (whether it be a file,
    memory, a network socket or other source) and reads the information sequentially
    and uses it in the program. All streams behave in the same way though the physical
    device connected to them differ. A program can send information to an external
    destination by opening a stream to a destination and writing the information out
    sequentially. In previous chapters, we used the following two methods for taking
    inputs and giving outputs:


    ```

    System.in.read()

    ```


    ```

    System.out.println();

    ```


    These two form the basic input and output streams, which are managed by the Stream
    class; they use the standard input and standard output streams, respectively.


    # Byte Stream Classes


    A byte stream is a term used to represent a computing technique that allows for
    sending data along a particular path. Here, instead of the individual ones and
    zeros, known as binary digits or bits, units that are the size of eight bits,
    known as a byte, are sent along the pathway. It is sometimes referred to as a
    character stream, since most of the characters that make up a natural language
    alphabet, numbers and so far are represented by such 8-bit units. The path, or
    entities involved in the transfer of data, are somewhat abstract, as they may
    represent a file being accessed by a program, data being processed within a program,
    or data traveling over a network.


    Network socket is an internal endpoint for sending or receiving data within a
    node on a computer network.


    Streams in Java


