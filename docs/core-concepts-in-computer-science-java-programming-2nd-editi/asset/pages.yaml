  md: '# A CONCEPT OF JAVA RELATIONAL OPERATORS


    Relational operators in Java are those operators that are used to perform the
    comparison between two numeric values or two quantities.


    These operators determine the relationship between them by comparing operands.
    Therefore, relational operators are also called comparison operators.


    For example, to know which is a bigger number, comparing the age of two persons,
    comparing the price of two items, etc.


    We can perform these comparisons with the help of relational operators in Java.
    Relational operators require two operands.


    Java supports six types of relational operators. The list of relational operators
    is in the below table.


    ![](img/e91a3f91eaacb03bb53843166396b235_107_0.png)


    Java Six Relational Operators

    Meaning

    Description


    +   1. <

    Less than

    This operator checks whether the value of the left operand is less than the right
    operand. If the value on the left side of operator is less than the right side,
    the result becomes true.


    +   2. <=

    Less than equal to

    This operator evaluates that the value of the left operand is less than equal
    to the value of the right operand. If it is the case, the operator returns true.'
