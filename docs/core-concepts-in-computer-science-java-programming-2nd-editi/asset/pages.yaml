  md: '![](img/e91a3f91eaacb03bb53843166396b235_20_0.png)


    # # Secured


    Java is best known for its security. With Java, we can develop virus-free systems.
    Java is secured because:


    +   - No explicit pointer

    - Java Programs run inside virtual machine sandbox


    ![](img/e91a3f91eaacb03bb53843166396b235_20_1.png)


    Classloader: Classloader in Java is a part of the Runtime Environment(JRE) which
    is used to dynamically load Java classes into the Java Virtual Machine. It adds
    security by separating the package for the classes of the local file system from
    those that are imported from network sources.


    **Bytecode Verifier:** It checks the code fragments for illegal code that can
    violate access right to objects.


    **Security Manager:** It determines what resources a class can access such as
    reading and writing to the local disk.'
  merge: -1
