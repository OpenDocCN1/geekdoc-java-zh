  md: 'But we use String Literals because it is more memory efficient.


    # Using new keyword


    We know String is a class in Java so we can create the object of the class. To
    overcome the problem with Java Literals we can use the new keyword to create the
    String objects.


    ```

    String msg = new String("Hello, friend");

    ```


    # Java String Pool


    Java String pool refers to collection of Strings which are stored in heap memory.
    however, whenever a new object is created, String pool checks whether the object
    is already present in the pool or not. If it is, then same reference is returned
    to the variable else object will be created in the String pool and the respective
    reference will be returned.


    Two Strings are created using literal i.e "Apple" and "Mango". Now, when third
    String is created with the value "Apple", instead of creating a new object, the
    already present object reference is returned.


    Before we go ahead, One key point you would like to add unlike other data types
    in Java, Strings are immutable. By immutable, we mean Strings are constant, their
    values cannot be changed after they are created. Because String objects are immutable,
    they can be shared. For example:


    ```

    String str=''abc";

    ```


    is equal to:


    ```

    char data[] = {''a'', ''b'', ''c''};

    ```


    ```

    String str = new String(data);

    ```


    # How String Objects Stored in the Memory


    When you create a string object using string literal that string literal is added
    to the string pool, if it is not present there already


    ```

    String msg = "Hello, Friend";

    ```


