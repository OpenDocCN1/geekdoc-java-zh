  md: '![](img/e91a3f91eaacb03bb53843166396b235_216_0.png)


    **Figure 2:** A program with master thread and children threads.


    Threads are typically spawned for a short-term benefit that is usually visualized
    as a serial task, which does not have to be performed in a linear manner (as performing
    a complex mathematical computation using parallelism, or initializing a large
    matrix), and then are absorbed when no longer required. The scope of a thread
    is within a specific code module—which is why we can bolt on threading without
    affecting the broader application.


    Threads are objects in the Java language. They can be created using two different
    mechanisms as illustrated in Figure 3:


    +   * Create a class that extends the standard Thread class.

    * Create a class that implements the Runnable interface.


    That is, a class can be defined by extending the java.lang.Thread class (see Figure
    3a) or by implementing the java.lang.Runnable interface (see Figure 3b). The run()
    method should be overridden by the new thread and should contain the code that
    will be executed by the new thread. This method must be public with a void return
    type and should not take any arguments. Both threads and processes are abstractions
    for parallelizing an application. However, processes are independent execution
    units that contain their own state information, using their address spaces, and
    only interact with each other via interprocess communication mechanisms (generally
    managed by the operating system).


    > Operating system (OS) is system software that manages computer hardware and
    provides common services for computer programs.'
