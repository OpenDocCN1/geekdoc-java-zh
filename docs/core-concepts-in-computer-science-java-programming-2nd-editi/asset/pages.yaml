    The Java platform provides for long-term persistent storage of cryptographic keys
    and certificates via key and certificate stores. Specifically, the java.security.KeyStore
    class represents a key store, a secure repository of cryptographic keys and/or
    certificates (to be used, for example, during certification path), and the java.security.cert.CertStore
    class represents a certificate store, a public and potentially vast repository
    of unrelated and typically untrusted certificates. A CertStore may also store
    CRLs.


    KeyStore and CertStore implementations are distinguished by types. The Java platform
    includes standard PKCS11 and PKCS12 key stores (whose implementations are compliant
    with the corresponding PKCS specifications from RSA Security), as well as a proprietary
