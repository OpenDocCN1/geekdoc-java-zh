    # CORE CONCEPT: JAVA CONTROL FLOW STATEMENTS


    A program executes from top to bottom except when we use control statements, we
    can control the order of execution of the program, based on logic and values.


    The control flow statements in Java allow you to run or skip blocks of code when
    special conditions are met. You will use control statements a lot in your programs
    and this section will explain how to do this.


    The control statements, as the name suggests controls the flow of the program.
    Depending upon the state (values of variables, user input etc.) the appropriate
    code is executed. These help in executing or by passing certain parts of the code,
    or executing them multiple times or skipping some lines of code...'
