    # Networking Basics


    It will be useful to review some key networking concepts and terms. At the core
    of Java’s networking support is the concept of a socket. A socket identifies an
    endpoint in a network. The socket paradigm was part of the 4.2BSD Berkeley UNIX
    release in the early 1980s. Because of this, the term socket is also used. Sockets
    are at the foundation of modern networking because a socket allows a single computer
    to serve many different clients at once, as well to serve many different types
    of information. This is accomplished through the use of a port, which is a numbered
    socket to “listen” until a client connects to it. A server is allowed to accept
    multiple clients to the same port number, although each session is unique. To
    manage client connections, a server process must be multithreaded or have some
    other methods of multiplexing the simultaneous I/O.


    Berkeley sockets is an application programming interface (API) for sockets and
    Unix domain sockets, used for inter-process communication (IPC).


    Socket communication takes place via a protocol, Internet Protocol (IP) is a low-level
    routing protocol that breaks data into small packets and sends them to an address
    across a network, which does not guarantee to deliver packets to the destination.
    Transmission Control Protocol (TCP) is a higher-level protocol that manages to
    robustly string these packets, retransmitting them as necessary to reliably transmit
    data. A third protocol, User Datagram Protocol (UDP), sits next to TCP and can
    be used directly for fast, connectionless, unreliable transport of packets.


    Once a connection has been established, a higher-level protocol ensues, which
    is dependent on which port you are using. TCP/IP reserves the lower 1,024 ports
    for specific protocols. Many of these will seem familiar to you if you have spent
    time surfing the Internet. Port number 21 is for FTP; 23 is for Telnet; 25 is
    for e-mail; 43 is for whos; 79 is for finger; 80 is for HTTP; 119 is for netnews—and
    the list goes on. It is to each protocol to determine how a client should interact
    with the port.'
