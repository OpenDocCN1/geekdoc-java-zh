  md: "# 2. Runnable State:\n\n+   - A thread that is ready to run is moved to runnable\
    \ state.\n- In this state, a thread might actually be running or it might be ready\
    \ run at any instant of time.\n- It is the responsibility of the thread scheduler\
    \ to give the thread, time to run.\n- A multi-threaded program allocates a fixed\
    \ amount of time to each individual thread. Each and every thread runs for a while\
    \ and then pauses and relinquishes the CPU to another thread, so that other threads\
    \ get a chance to run. When this happens, all threads that are ready to run, waiting\
    \ for the CPU and the currently running thread lies in runnable state.\n\nRunnable\
    \ state is executing in the Java virtual machine it may be waiting for other resources\
    \ from the operating system such as processor.\n\n# 3. Blocked/Waiting State:\n\
    \n+   - When a thread is temporarily inactive, it's in one of the following states:\n\
    \  - Blocked\n  - Waiting\n- For example, when a thread is waiting for I/O to\
    \ complete, it lies in the blocked state. It's the responsibility of the thread\
    \ scheduler to reactivate and schedule a blocked/ waiting thread.\n- A thread\
    \ in this state cannot continue its execution any further until it is moved to\
    \ runnable state. Any thread in these states do not consume any CPU cycle.\n-\
    \ A thread is in the blocked state when it tries to access a protected section\
    \ of code that is currently locked by some other thread. When the protected section\
    \ is unlocked, the scheduler picks one of the threads which is locked for that\
    \ section and moves it to the runnable state. A thread is in the waiting state\
    \ when it waits for another thread on a condition. When this condition is fulfilled,\
    \ the scheduler is notified and the waiting thread is moved to runnable state.\n\
    - If a currently running thread is moved to blocked/waiting state, another thread\
    \ in the runnable state is scheduled by the thread scheduler to run. It is the\
    \ responsibility of thread scheduler to determine which thread to run."
