    +   Key to synchronization is the concept of the monitor (also called a semaphore).


    +   A monitor is an object that is used as a mutually exclusive lock, or mutex.
    Only one thread can own a monitor at a given time. When a thread acquires a lock,
    it is said to have entered the monitor. All threads attempting to enter the locked
    monitor will be suspended until the first thread exits the monitor.


    +   These threads are said to be waiting for the monitor. A thread that owns a
    monitor can reenter the same monitor if it desires.


