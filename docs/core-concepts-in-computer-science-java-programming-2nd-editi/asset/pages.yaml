    A class named BufferedInputStream will be used to get all the methods and their
    input parameters related to the class to be extended using the FilterInputStream.


    # Constructors


    There are two types of constructors that the Java BufferedInputStream Class, namely
    support:


    ```

    BufferedInputStream(InputStream in)

    This helps in creating a BufferedInputStream and saves its argument into that
    buffer as the input stream in, and further, this argument is used later at some
    point of time for input stream.

    BufferedInputStream(InputStream in, int size)

    ```


    This constructor creates a bufferedInputStream with some specific buffer size
    and saves its arguments for inserting into the stream later at some point of time
    with respect to time and size.


