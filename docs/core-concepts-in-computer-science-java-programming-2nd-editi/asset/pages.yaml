  md: '# INTRODUCTION


    An exception is an error event that can happen during the execution of a program
    and disrupts its normal flow. Java provides a robust and object-oriented way to
    handle exception scenarios as Java Exception Handling.


    Exceptions in Java can arise from different kinds of situations such as wrong
    data entered by the user, hardware failure, network connection failure, or a database
    server that is down. The code that specifies what to do in specific exception
    scenarios is called exception handling.


    Exception handling in Java is the process of responding to the occurrence of exceptions(Exceptions
    are unwanted conditions that disturb the program execution), it occurred.


    Exceptional handling in Java is a very powerful mechanism as it helps to identify
    exceptional conditions and maintain the flow of the program as expected, by handling/avoiding
    the errors if it occurs. In some cases, it is used to make the program user-friendly.


    When we write a program, we describe step-by-step what the computer must do (at
    least in imperative programming; in the functional programming things look a bit
    different) and in most of the cases we rely that the program will execute normally.
    Indeed, most of the time, programs are following this normal pattern, but there
    are some exceptions. Let''s say when the file is located on a remote server and
    during the process of reading it, the connection goes down. The file will then
    be only partially loaded. The program will not be able to execute normally and
    show file''s contents on the screen. In this case, we have an exception from the
    normal (and correct) program execution and this exception will be reported to
    the user and/or the administrator.


    Exception is a notification that something interrupts the normal program execution.
    Exceptions provide a programming paradigm for detecting and reacting to unexpected
    events. When an exception arises, the state of the program is saved, the normal
    flow is interrupted and the control is passed to an exception handler (if such
    exists in the current context).


    Exceptions are raised or thrown by programming code that must send a signal to
    the executing program about an error or an unusual situation. For example, if
    we try to open a file, which does not exist, the code responsible for opening
    the file will detect this and will throw an exception with a proper error message.


    Exceptions are one of the main paradigms of object-oriented programming (OOP),
    which is described in details in the chapter “Object-Oriented Programming Principles”.'
