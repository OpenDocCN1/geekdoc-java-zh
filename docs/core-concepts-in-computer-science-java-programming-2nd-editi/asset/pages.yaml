  md: 'difference between the two. For most readers, process-based multitasking is
    the more familiar form. A process is, in essence, a program that is executing.
    Thus, process-based multitasking is the feature that allows your computer to run
    two or more processes concurrently. For example, process-based multitasking enables
    you to run the Java compiler at the same time you are using a text editor. In
    process based multitasking, a program is the smallest unit of code that can be
    dispatched by the scheduler.


    In a thread-based multitasking environment, the thread is the smallest unit of
    dispatchable code. This means that a program can perform two or more tasks simultaneously.
    For instance, a text editor can format text the same time that it is printing,
    as long as these two actions are being performed by two separate threads.


    Multitasking threads require less overhead than multitasking processes. Processes
    are heavyweight tasks that require their own separate address spaces. Interprocess
    communication is expensive and limited. Context switching from one to another
    is also costly. Threads, on the other hand, are lightweight. They share the same
    address space and cooperatively share the same heavyweight process. Interthread
    communication is inexpensive, and context switching from one thread to the next
    is low cost. While Java programs use of process-based multitasking environments,
    process-based multitasking is not under the control of Java. However, multithreaded
    multitasking is.


    # Defining Threads


    To understand multithreading, the concepts process and thread must be understood.
    A process is a program in execution. A process may be divided into a number of
    independent units known as threads. A thread is a dispatchable unit of work. Threads
    are light-weight processes within a process. A process is a collection of one
    or more threads and associated system resources. The difference between a process
    and a thread is shown in Figure 1. A process may have a number of threads in it.
    A thread may be assumed as a subset of a process.


    Java compiler is a compiler for the programming language Java.


