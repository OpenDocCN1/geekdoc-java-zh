  md: '# CORE CONCEPT:

    EXCEPTION-HANDLING

    FUNDAMENTALS


    Exception handling is the process of responding to the occurrence, during computation,
    of anomalous or exceptional conditions requiring special processing – often changing
    the normal flow of program execution. It is provided by specialized programming
    language constructs, computer hardware mechanisms like interrupts or operating
    system IPC facilities like signals.


    A Java exception is an object that describes an exceptional (that is, error) condition
    that has occurred in a piece of code. When an exceptional condition arises, an
    object representing that exception is created and thrown in the method that caused
    the error. That method may choose to handle the exception itself, or pass it on.
    Either, at some point, the exception is caught and processed. Exceptions can be
    generated by the Java runtime-system, or they can be manually generated by your
    code. Exceptions by Java relate to fundamental errors that violate the rules of
    the Java language or the constraints of the Java execution environment. Manually
    generated exceptions are typically used to report some error to the caller of
    a method.


    Exception is an event, which occurs during the execution of a program that disrupts
    the normal flow of the program''s instructions.


    Java exception handling is managed via five keywords: try, catch, throw, and finally.
    Program statements that you want to monitor are contained within a try block.
    If an exception occurs within the try block, it is thrown. Your code can catch
    this exception (using catch) and handle it in some reasonable manner. System-generated
    exceptions are automatically thrown by the Java run-time system. To manually throw
    an exception, use the keyword throw. Any exception that is thrown out of a method
    must be specified such by a throws clause. Any code that absolutely must be executed
    after a try block completes is put in a finally block.


    This is the general form of an exception-handling block:

    try {


