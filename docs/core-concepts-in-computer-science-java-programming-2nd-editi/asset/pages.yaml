  md: '# CORE CONCEPT: STRING IN JAVA


    A Java string is a sequence of characters that exists as an object of the class
    java.Lang. Java strings are created and manipulated through the string class.
    Once created, a string is immutable its value cannot be changed.


    ![](img/e91a3f91eaacb03bb53843166396b235_147_0.png)


    String is a sequence of characters. But in Java, a string is an object that represents
    a sequence of characters. The java.lang. String class used to create string object.


    There are two ways to create a String object:


    +   - Using String literal

    - Using new keyword


    # Using String Literal


    Java has the shortest way to create String. We can create the string by assigning
    a string literal to the string object. Like this -\nString msg = "Hello, Friend";


    As we knows String is an object in Java. When we use String literal compiler creates
    a string object having the string literal and assigns it to the provided string
    instances. Suppose you are doing this –


    String msg = "Hello, Friend";


    String msg1 = "Hello, Friend";


    In the above case compiler will create the object for the string literal "Hello,
    Friend" and assign the msg reference to this object. As switch to next line you
    will find the same string literal the object already exists for the String so
    compiler does not create a new Object it assigns the same old object to the new
    instance, that even though we have two string instances above(msg and msg1) compiler
    only created on string object (having the value "Hello, friend") and assigned
    the same to both the instances.


    If you want to have two different objects with the same string then you would
    need to create strings using the new keyword.'
