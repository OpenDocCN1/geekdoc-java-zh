    Java is the first language which is neither truly interpreted nor compiled; instead,
    a combination of the two forms is used. This method has advantages that were not
    present in earlier languages.


    # Platform-Independence


    To understand the primary advantage of Java, you''ll have to learn about platforms.
    In most programming languages, a compiler (or interpreter) generates code that
    execute on a specific target machine. For example, if you compile a C++ program
    on a Windows machine, the executable file can be copied to any other machine but
    it will only run on other Windows machines but never another machine (e.g., a
    Mac or Linux machine). A platform is determined by the target machine (along with
    its operating system). For earlier languages, Java designers need to create a
    specialized version of the compiler (or interpreter) for every platform. If you
    write a program that you wanted to make available on multiple platforms, as the
    programmer, would have to do a bit of additional work. You would have to create
    multiple versions of your source code for each.


    Java succeeded in eliminating the platform issue for high-level programmers (such
    as you) because it has reorganized the compile-link-execute sequence at an underlying
    level of the compiler. Details are complicated but, essentially, the designers
    of Java isolated programming issues which are dependent on the platform and developed
    low-level means to abstract refer to these issues. Consequently, the Java compiler
    doesn''t create an object file, but it creates a bytecode file which is, essentially,
    an object file for a virtual machine. In fact, the Java compiler is often called
    the Java compiler (for Java Virtual Machine).


    Consequently, you can write a Java program (on any platform) and use the JVM compiler
    (called javac) to generate a bytecode file (bytecode files use the extension'
