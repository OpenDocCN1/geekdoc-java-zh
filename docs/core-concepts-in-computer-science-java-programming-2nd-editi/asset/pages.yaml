  md: '# Why do we need wrapper classes in java?


    Do we really need wrapper classes or wrapper data types in java? Cannot use primitive
    data types directly instead of wrapper classes? Actually we can use primitive
    types in many places not all. In some cases we cannot use primitive values as
    is, so wrapper classes are needed/required.


    For example, if we need to store numbers in a collection, we cannot use primitives
    because collections such as List, Set, and Map need objects as their elements.
    In such cases you must use wrapper classes.


    # What is the difference between primitive data types and wrapper classes in java?


    The main difference between primitive data types and wrapper classes (wrapper
    types) in java is that the primitive types can be used as raw data for operations
    such as arithmetic, logical, etc. and wrapper classes acts as data holders for
    primitive data types. Important note: The primitive type values are stored in
    Stack Memory whereas wrapper class objects (like any other java objects) are stored
    in Heap Memory.


    # Use of Wrapper Class in Java


    Although, the primary purpose/use of wrapper classes in java is to wrap primitive
    values, there are other uses/advantages of wrapper classes. One feature is to
    use constants defined by the wrapper class, such as MIN_VALUE and MAX_VALUE, that
    provide the upper and lower bounds of the data type, and the other application
    is to use wrapper class methods for converting values to and from other primitive
    data types, for converting to and from strings, and for converting between number
    systems (decimal, octal, hexadecimal, binary).


    # Wrapper Classes Mutable in Java


    A big “No”. Like Strings, wrapper classes in java such as Integer, Float, Long,
    and Double are also “immutable”. Once created, the wrapped within the objects
    of wrapper classes in java.lang package cannot be changed.


    # Importance of Wrapper Classes


    There are many uses with simple data types into objects, that is, to give object
    form to a data type; here constructors are used.


    +   - To convert simple data types into objects, that is, to give object form
    to a data type; here constructors are used.

    - To convert strings into data types (known as parsing operations), here methods
    of type parseXXX() are used.'
