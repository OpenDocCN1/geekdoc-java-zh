    transfer between processes. One of IPC is based on Control Architecture (TCA).
    It is a flexible technique that can send and receive variable length arrays, data
    structures, and lists. It has the capability of publish/subscribe and client/server
    data-transfer paradigms with a wide range of operating systems and languages.


