    # CORE CONCEPT:

    MULTITHREADED

    PROGRAMMING


    Java is a multi-threaded programming language which means we can develop multi-threaded
    program using Java. A multi-threaded program contains two or more parts that can
    run concurrently and each part can handle a different task at the same time making
    optimal use of the available resources specially when your computer has multiple
    CPUs.


    ![](img/e91a3f91eaacb03bb53843166396b235_213_0.png)


    Unlike many other computer languages, Java provides built-in support for multithreaded
    programming. A multithreaded program contains two or more parts that can run concurrently.
    Each part of such a program is called a thread, and each thread defines a separate
    path of execution. Thus, multithreading is a specialized form of multitasking.


    ![](img/e91a3f91eaacb03bb53843166396b235_213_1.png)


    You are almost certainly acquainted with multitasking, because it is supported
    by virtually all modern operating systems. However, there are two distinct types
    of multitasking: process and thread-based. It is important to understand'
