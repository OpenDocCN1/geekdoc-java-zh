    Package naming conventions: Packages are named in reverse order of domain names,
    i.e., org.geeksforgeeks.practice. For example, in a college, the recommended convention
    is college.tech.cse, college.tech.ee, college.art.history, etc.


    Adding a class to a Package: We can add more classes to a created package by using
    package name at the top of the program and saving it in the package directory.
    We need a new java file to define a public class, otherwise we can add the new
    class to existing .java file and compile it.


    Subpackages: Packages that are inside another package are the subpackages. These
    are not imported by default, they have to be imported explicitly. Also, members
