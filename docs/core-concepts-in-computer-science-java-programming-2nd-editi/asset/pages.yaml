    # Using Synchronized Methods


    Synchronization is easy in Java, because all objects have their implicit monitor
    associated with them.


    To enter an object''s monitor, just call a method that has been modified with
    the synchronized keyword.


    While a thread is inside a synchronized method, all other threads that try to
    call it (or any other synchronized method) on the same instance have to wait.


    To exit the monitor and relinquish control of the object to the next waiting thread,
    the owner of the monitor simply returns from the synchronized method.


