  md: '# Float Data Type


    The float data type is a single-precision 32-bit IEEE 754 floating point. Its
    value range is unlimited. It is recommended to use a float (instead of double)
    if you need to save memory in large arrays of floating point numbers. The float
    data type should never be used for precise values, such as currency. It is generally
    used as the default data type for decimal values. Its default value is 0.0d.


    Example: float f1 = 234.5f


    # Double Data Type


    The double data type is a double-precision 64-bit IEEE 754 floating point. Its
    value range is unlimited. The double data type is generally used for decimal values
    just like float. The double data type also should never be used for precise values,
    such as currency. Its default value is 0.0.


    Example: double d1 = 12.3


    # Char Data Type


    The char data type is a single 16-bit Unicode character. Its value-range lies
    between ''\u0000'' (or 0) to ''\ffff'' (or 65,535 inclusive).The char data type
    is used to store characters.


    Example: char letterA = ''A''


