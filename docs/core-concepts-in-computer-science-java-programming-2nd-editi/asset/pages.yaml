- img_proc: true
  md: 'There were several criteria that Oak had to meet in order to satisfy the project
    objective given the consumer electronics target market. Given the wide array of
    manufacturers in the market, Oak would have to be completely platform independent,
    and function seamlessly regardless of the type of CPU in the device.


    For this reason, Oak was designed to be an interpreted language, which would be
    practically impossible for a compiled version to run on all available platforms.
    To facilitate the job of the interpreter, Oak had to be converted to an intermediate
    "byte-code" format which is then passed across the network, and executed dynamically.


    Today, with technology such a part of our lives, we took for granted that we can
    connect and access applications and content anywhere, anytime. Because of Java,
    we expected digital devices to be smarter, more functional and entertaining.


    In the early 90s, extending the power of network computing to the activities of
    everyday life was a radical vision. In 1991, a small group of Sun engineers called
    the Green Team believed that the next wave in computing was the union of digital
    consumer devices and computers. Led by James Gosling, the team worked around the
    clock and created the programming language that would revolutionize our world
    – Java.


    The Green Team demonstrated their new language with an interactive, handheld home-entertainment
    controller that was originally targeted at them at the cable television industry.
    Unfortunately, the concept was too advanced for them at the. But it was just right
    for the Internet, which was just starting to take off. In 1995, the team announced
    that the Netscape Navigator Internet browser would incorporate Java technology.
    Java not only permeates the Internet, but is also the invisible force behind many
    of the applications and devices that power our day-to-day lives. From mobile phones
    to handheld devices, and navigation systems to e business solutions, Java is everywhere.


    There have been significant changes to Java since the first version, called JDK
    1.0, was released. Newer versions of Java include 1.5 and 1.6 (also known as Java
    5 and Java 6, respectively). Many features in the original version are no longer
    used. The language has grown much as new features have been introduced in subsequent
    versions. Examples include the Swing and Java 2D graphical toolkits introduced
    in Java 2, and the generics framework introduced in Java 5.


    # Features of Java


    The main objective of Java programming language creation was to make it portable,
    simple and secure programming language. Apart from this, there are also awesome
    features which play important role in the popularity of this language. The features
    of Java are also known as:


    +   1. Simple


    +   2. Object-Oriented'
