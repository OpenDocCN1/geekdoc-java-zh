    # # Simple


    Java is very easy to learn and its syntax is simple, clean and easy to understand.
    According to Sun, Java language is a simple programming language because:


    +   - Java syntax is based on C++ (so much easier for programmers to learn it
    after C++).

    n- Java has removed many confusing and rarely-used features e.g. explicit pointers,
    operator overloading etc.

    - There is no need to remove unreferenced objects because there is Automatic Garbage
    Collection in java.


    # # Object-oriented


    Java is object-oriented programming language. Everything in Java is an object.
    Object-oriented means we organize our software as a combination of different types
    of objects that incorporates both data and behavior.'
