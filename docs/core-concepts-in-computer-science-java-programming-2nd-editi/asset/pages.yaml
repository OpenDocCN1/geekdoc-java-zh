  md: '# Convert String Array to List


    One dis-advantage of arrays is that the size is fixed. If we need the size of
    the array to grow, it is better to use List. Unfortunately, this is simple - again
    by using java.util Arrays. Here is an example code:


    ```

    String[] thisIsAnArray = { "Apple", "Banana", "Orange" };

    ```


    ```

    List<String> stringList = Arrays.asList(thisIsAnArray);

    ```


    A fixed-size list backed by the changed array. Changes to the returned list "write
    through to the array.) This method acts as bridge between array-based and collection-backed
    APIs, in combination with Collection.toArray. The returned list is serializable
    and implements RandomAccess.


    This means that you cannot add items to the List returned by Arrays.asList method.
    Hence, this code will raise an Exception:


    ```

    String[] thisIsAnArray = { "Apple", "Banana", "Orange" };

    ```


    ```

    List<String> stringList = Arrays.asList(thisIsAnArray);

    ```


    ```

    stringList.add("Watermelon");

    ```


    When you run this, you will encounter a java.lang.UnsupportedOperationException
    on the line where "Watermelon" was being added to the list.


    To avoid this problem, we can specifically convert the String Array to an ArrayList.
    Here is a sample code on how to do:


    ```

    String[] thisIsAnArray = { "Apple", "Banana", "Orange" };

    ```


    ```

    List<String> fixedList = Arrays.asList(thisIsAnArray);

    ```


    ```

    List<String> stringList = new ArrayList<>(fixedList);

    ```


    ```

    stringList.add("Watermelon");

    ```


    The code will construct a new ArrayList based on the returned value of Arrays.asList.
    All items from fixedList will be added to the stringList. And the ArrayList instance
    has no limitation of fixed size. Hence, the code that adds "Watermelon" will not
    throw any exception.


    ![](img/e91a3f91eaacb03bb53843166396b235_146_0.png)'
