- img_proc: true
  md: 'These security are provided by java language. Some security can also be provided
    by application developer through SSL, JAAS, Cryptography etc.


    # Robust


    Robust simply means strong. Java is robust because:


    +   * It uses some memory management.

    * There are lack of pointers that avoids security problems.

