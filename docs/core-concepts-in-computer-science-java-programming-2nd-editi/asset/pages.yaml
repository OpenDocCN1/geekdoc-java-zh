    # # CORE CONCEPT:

    INHERITANCE


    Inheritance is a mechanism wherein a new class is derived from an existing class.
    In Java, a class may inherit or acquire the properties and methods of other classes.
    A class derived from another class is called a subclass, whereas the class from
    which a subclass is derived is called a superclass. A subclass can have only one
    superclass, whereas a superclass may have one or more subclasses.


    Inheritance is a key feature of Object Oriented Programming. Deriving a new class
    from existing class inheritance. Here the main advantage of deriving a class from
    existing class is: the newly created (derived) class acquires all the features
    of exiting class from where it is derived.


    Inheritance makes a relationship between the two classes: Parent and Child.

    The class which inherits the properties of other is known as subclass (derived
    class, child class) and the whose properties are inherited is known as superclass
    (base class, parent class).


    Derived class is a class created or derived from another class. The existing class
    from which the derived class is created through the process of inheritance is
    known as a base class or superclass.


