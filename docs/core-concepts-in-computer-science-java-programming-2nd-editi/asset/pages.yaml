  md: '# Single-threaded Process


    # Multiplethreaded


    ![](img/e91a3f91eaacb03bb53843166396b235_215_0.png)


    Threads of Execution


    Single instruction stream


    Multiple instruction stream


    Common


    Figure 1: A process containing single and multiple threads.


    If applications are run on a computer (MS Word, MS Access), two processes are
    created. Multitasking of two or more processes is known as process-based multitasking.
    Multitasking of two or more threads is known as thread-based multitasking. Context
    of multithreading in a programming language refers to thread-based multitasking.
    Process-based multitasking is totally controlled by the operating system. But
    thread-based multitasking can be controlled by the programmer to some extent in
    a process.


    The concept of context switching is integral to threading. A hardware timer is
    used by the processor to determine the timeslice for each thread. The timer signals
    at the end of the timeslice and in turn the processor saves all information for
    the current thread onto a stack. Then the processor moves this information from
    the stack into a predefined data structure called a context structure. When the
    processor wants to switch back to a previously executing thread, it transfers
    all the information from the context structure associated with the thread to the
    stack. The entire procedure is known as context switching.


    Java supports thread-based multitasking. The advantages of thread-based multitasking
    as compared to process-based multitasking are given here:


    +   * Threads share the same address space.

    * Context-switching between threads is normally inexpensive.

    * Communication between threads is normally inexpensive.


    # Threads in Java


    Applications are typically divided into processes during the design phase, and
    a master process explicitly spawns processes when it makes sense to logically
    separate application functionalities. Processes, in other words, are an architectural
    construct. By contrast, a thread is a coding construct that does not affect the
    architecture of an application. A single process might contain multiple threads
    (see Figure 2). All threads within a process share the same state and same memory
    space, and can communicate with each other directly, because they share the same
    variables.'
