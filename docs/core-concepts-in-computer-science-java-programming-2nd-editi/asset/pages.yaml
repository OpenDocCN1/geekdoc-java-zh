  md: 'TERMINATED (dead): A thread that has exited is in this state.


    ![](img/e91a3f91eaacb03bb53843166396b235_220_0.png)


    **Figure 4:** Life cycle of Java threads.


    At any time, a thread can be in only one state. These states are JVM states as
    they are not linked to operating system threads.


    When the object of a user Thread class is created, the thread moves to the NEW
    state. After invocation of the start() method, the thread shifts from the NEW
    to the ready (RUNNABLE) state and is then dispatched to running by the JVM thread
    scheduler. After gaining a chance to execute, the run() method is invoked. It
    should be noted that when the run() method is invoked directly (explicitly in
    the program), the code it is executed by the current thread and not the new thread
    (as the thread is not assigned to the virtual machine scheduler). Depending on
    I/O operation, the thread moves to the WAITING, SLEEPING, and BLOCKED states respectively.
    It should be noted that the thread is still alive. After the completion of an
    operation that blocked it (I/O or sleep) or receiving an external signal that
    wakes it, the moves to ready. The JVM thread scheduler moves it to running state
    in order to continue the execution of remaining operations. When the thread completes
    its execution, it will be moved to TERMINATED state. A dead thread can never enter
    any other state, even if the start() method is invoked on it.


