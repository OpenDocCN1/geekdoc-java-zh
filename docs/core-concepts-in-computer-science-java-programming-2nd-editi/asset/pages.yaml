    like a hard throw from a well-trained but blindfolded catcher to the baseline.
    Once the datagram has been released to its intended target, there is no assurance
    that it will arrive or that someone will be there to catch it. Likewise, when
    the datagram is received, there is no assurance that it hasn''t been damaged in
    transit or that whatever is still there to receive a response.


