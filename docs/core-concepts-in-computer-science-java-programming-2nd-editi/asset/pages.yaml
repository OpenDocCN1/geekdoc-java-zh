  md: '# SUMMARY


    +   - To use an array in a program, you must declare a variable to reference the
    array, and you must specify the type of array variable can reference.

    - A one-dimensional array is, essentially, a list of like-typed variables. To
    create an array, you must first create an array variable of the desired type.

    - Multidimensional arrays are arrays of arrays with each element of the array
    holding the reference of other array.

    - Arrays in Java are dynamically created objects; therefore Java arrays are quite
    different from C and C++ the way they are created.

    - A Java String Array is an object that holds a fixed number of String values.
    Arrays in general is a very useful and important data structure that can help
    solve many types of problems.

    - Java String pool refers to collection of Strings which are stored in heap memory.
    In this, whenever a new object is created, String pool first checks whether the
    object is already present in the pool or not.

    - In Java, a wrapper class is defined as a class in which a primitive value is
    wrapped up. These primitive wrapper classes are used to represent primitive data
    type values as objects.'
