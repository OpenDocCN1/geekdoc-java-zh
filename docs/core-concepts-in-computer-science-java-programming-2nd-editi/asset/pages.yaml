  md: '# CORE CONCEPT: OVERVIEW OF JAVA


    JAVA is a general purpose, high-level programming language developed by Sun Microsystems.
    The Java programming language was developed by a small team of engineers, known
    as the Green Team, who initiated the language in 1991. The Java language was originally
    OAK, and at the time it was designed for handheld devices and set-top boxes. Oak
    was unsuccessful and in 1995 Sun changed the name to Java and modified the language
    to take advantage of the burgeoning World Web.


    ![](img/e91a3f91eaacb03bb53843166396b235_14_0.png)


    Java programming language was originally developed by Sun Microsystems which was
    initiated by James Gosling and released in 1995 as core component of Sun Microsystems’
    Java platform 1.0 (J2SE1).


    The latest release of the Java Standard Edition is Java SE 8. With the advancement
    of Java and its widespread popularity, multiple configurations were built to suit
    various types of platforms. For example: J2EE for Enterprise Applications, J2ME
    for Mobile Applications.


    Java has emerged as the object-oriented programming language of choice. Some of
    the important concepts of Java include:


    +   * A virtual machine (JVM), which provides the fundamental basis for platform
    independence

    * Automated storage management techniques, such as garbage collection

    * Java syntax that is similar to that of the C language


    # Evolution of Java


    Java was initially launched as Java 1.0 but soon after its initial release, Java
    1.1 was launched. Java 1.1 redefined event handling, new library elements were
    added.


    In Java 1.2 Swing and Collection framework was added and suspend(), resume() and
    stop() methods were deprecated from Thread class.


    No major changes were made into Java 1.3 but the next release that was Java 1.4
    contained several important changes. Keyword assert, chained exceptions and channel
    based I/O System was introduced.


    Java 1.5 was J2SE 5, it added following major new features:


    +   * Generics

    * Annotations

    * Autoboxing and unboxing'
