- img_proc: true
  md: '# Bytecode Verifier


    After the bytecode of a class is loaded by the class loader, it has to be inspected
    by the bytecode verifier, whose job is to check that the instructions don''t perform
    damaging actions. The following are some of the checks carried out:


    +   * Variables are initialized before they are used.

    * Method calls match the types of object references.

    * Rules for accessing private data and methods are not violated.

    * Local variable accesses fall within the runtime stack.

    * The run stack time does not overflow.

    * If any of the above checks fails, the verifier doesn''t allow the class to be
    loaded.


    # Just-In-Time Compiler


    This is the final stage executed by the java program, and its job is to convert
    the loaded bytecode into machine code. When using JIT compiler, the hardware can
    execute the native code, as opposed to having the JVM interpret the same sequence
    of bytecode repeatedly and incurring the penalty of a relatively lengthy translation
    process. This can lead to performance gains in the execution speed, unless methods
    are executed less frequently.


    The process can be well-illustrated by the following diagram:


    ![](img/e91a3f91eaacb03bb53843166396b235_57_0.png)


    Due to the two-step execution process a java program is independent of the target
    operating system. However, because of the same, the execution time is way more
    than a similar program written in a compiled platform-dependent program.'
