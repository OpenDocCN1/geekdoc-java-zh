  md: '# Boolean Data Type


    The Boolean data type is used to store only two possible values: true and false.
    This data type is used for simple flags that track true/false conditions.


    The Boolean data type specifies one of bit, but its “size” can’t be defined precisely.


    Example: Boolean one = false


    # Byte Data Type


    The byte data type is an example of primitive data type. It is an 8-bit signed
    two’s complement integer. Its value-range lies between -128 to 127 (inclusive).
    Its minimum value is -128 and maximum value is 127. Its default value is 0.


    The byte data type is used to save memory in large arrays where the memory savings
    is required. It saves space because a byte is 4 times smaller than an integer.
    It can also be used in place of “int” data type.


    Example: byte a = 10, b = -20


    # Short Data Type


    The short data type is a 16-bit signed two’s complement integer. Its value-range
    lies between -32,768 to 32,767 (inclusive). Its minimum value is -32,768 and maximum
    value is 32,767. Its default value is 0.


    The short data type can also be used to save memory just like byte data type.
    A short data type is 2 times smaller than an integer.


    Example: short s = 10000, r = -5000


    # Int Data Type


    The int data type is a 32-bit signed two’s complement integer. Its value-range
    lies between -2,147,483,648 (2^-31) to 2,147,483,647 (2^31-1). Its minimum value
    is -2,147,483,648 and maximum value is 2,147,483,647. Its default value is 0.


    The int data type is generally used as a default data type for integer values
    unless there is no problem about memory.


    Example: int a = 10000, b = -200000


    # Long Data Type


    The long data type is a 64-bit two’s complement integer. Its value-range lies
    between -9,223,372,036,854,775,808(2^-63) to 9,223,372,036,854,775,807(2^63 -1)
    (inclusive). Its minimum value is -9,223,372,036,854,775,808and maximum value
    is 9,223,372,036,854,775,807. Its default value is 0. The long data type is used
    when you need a range of values more than provided by int.


    Example: long a = 1000000L, long b = -2000000L


    ![](img/e91a3f91eaacb03bb53843166396b235_46_0.png)'
