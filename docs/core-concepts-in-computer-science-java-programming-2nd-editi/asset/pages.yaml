  md: 'of each class contained in the source file is stored in a separate ‘class’
    file. While converting the source code into the bytecode, the compiler follows
    the following steps:


    Parse: Reads a set of *.java source files and maps the resulting token sequence
    into AST (Abstract Syntax Tree)-Nodes.


    Enter: Enters symbols for the definitions into the symbol table.


    Process annotations: If Requested, processes annotations found in the specified
    compilation units.


    Attribute: Attributes the Syntax trees. This step includes name resolution, type-checking
    and constant folding.


    Flow: Performs dataflow analysis on the trees from the step. This includes checks
    for assignments and readability


    Desugar: Rewrites the AST and translates away some syntactic sugar.


    Generate: Generates ‘class’ files.


    # Execution


    The class files generated by the compiler are independent of the machine or the
    OS, which allows them to run on any system. To run, the main class file (the class
    that contains the method main) is passed to the JVM, and then goes through three
    main stages before the final machine code is executed. These stages are:


    Class Loader


    The main class is loaded into the memory by passing its ‘class’ file to the JVM,
    through invoking the latter. All the other classes referenced in the program are
    loaded through the class loader.


    A class loader, itself an object, creates a flat name space of class bodies that
    are referenced by a string name. The method definition is:


    ```

    // loadClass function prototype

    ```


    ```

    Class r = loadClass(String className, boolean resolve());

    ```


    ```

    // className: name of the class to be loaded

    ```


    ```

    // resolve(): flag to decide whether any referenced class should be loaded or
    not.

    ```


    There are two types of class loaders: primordial, and non-primordial. Primordial
    class loader is embedded into all the JVMs, and is the default class loader. A
    non-primordial class loader is a user-defined class loader, which can be coded
    in order to customize class-loading process. Non-primordial class loader, if defined,
    is preferred over the default, to load classes.


    ![](img/e91a3f91eaacb03bb53843166396b235_56_0.png)'
