  md: '# INTRODUCTION


    Inheritance is a key feature of OOP that allows a new class (subclass or derived
    class) to inherit properties and behaviors from an existing class (superclass
    or base class). This promotes code reuse and the creation of a hierarchical structure.
    Key points include:


    +   * Superclass and Subclass: The superclass is the existing class from which
    properties and behaviors are inherited. The subclass is the new class that inherits
    from the superclass.

    * Keywords: In Java, a subclass is defined using the extends keyword. For example,
    class subclass extends Superclass { ... }.

    * Method Overriding: Subclasses can provide their own implementations for superclasses
    using method overriding.

    * Access Modifiers: Inherited members (fields and methods) can have different
    modifiers in the subclass.


    Packages are a way to organize and group related classes and interfaces. They
    provide a hierarchical structure for better code management, reusability, and
    access control. Key points include:


    +   * Package Declaration: At the beginning of a Java source file, you can specify
    the package to which the class belongs using the package keyword.

    * Import Statement: To use classes from other packages, you can use the import
    statement to make them accessible in your code.

    * Access Control: Packages allow you to control the visibility of classes and
    members through access modifiers (public, protected, private, and default access
    package).


    Interfaces define a contract that classes must adhere to. They declare signatures
    without providing implementations. Classes can implement multiple interfaces,
    allowing for multiple inheritance of behavior. Key points include:


    +   * Interface Declaration: An interface is defined using the interface keyword.
    For example, MyInterface { ... }.

    * implements: To use an interface, a class must implement it using the implements
    keyword. For example, classClass implements MyInterface {...}.

    * Default Methods: Java 8 introduced default methods in interfaces, allowing them
    to provide method implementations. These methods can be overridden by implementing
    classes.

    * Static Methods: Interfaces can also have static methods, which are called using
    the interface name.


    Understanding and effectively using inheritance, packages, and interfaces can
    greatly enhance your ability to design and develop robust and maintainable Java
    applications. These concepts are foundational to building complex software systems
    and collaborating on large-scale projects.'
