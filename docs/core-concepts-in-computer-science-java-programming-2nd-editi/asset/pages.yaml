  md: '# CORE CONCEPT: SERIALIZATION


    Serialization is a mechanism of writing the state of an object into a byte stream.
    It is mainly used in Hibernate, RMI, JPA, EJB and JMS technologies. The reverse
    operation of serialization is called deserialization. Serialization is mainly
    used to travel object’s state on the network (known as marshaling).


    ![](img/e91a3f91eaacb03bb53843166396b235_270_0.png)


    Serialization is the technique most commonly used for network applications and
    persistent storage of objects, in order to maintain the reference of a remote
    object.


    Storing the state of the object into a file is often referred to as serialization.
    Whereas, the object state from a stored file is referred to as deserialization.


    The streams Object OutputStream and the Object Input Stream are used for object
    serialization and deserialization, respectively. These classes allow us to read/write
    objects from stream converting from internal to external 8-bit representation.
    These two classes throw the exceptions IOException and StreamCorruptedException.


    Deserialization is where the byte stream is used to recreate the actual Java object
    in memory. This mechanism is used to persist the object.


    The methods that are useful for object serialization are readObject() on ObjectInputStream
    and writeObject(Object obj). To make any object serializable, the object of the
    class must implement the serializable interface of the java java.io package. That
    is, we have to specify implements Serializable in the definition of the class,
    the objects which we would like to read/write from files.


    Any variable in a class having a transient modifier will not be saved in the file
    (that is, variable is not serializable). Similarly static variables are not serializable.
    There is an interface called Externalizable, which is used to control the serialization
    process of the object.


    Program implementing the Serialization Example class illustrates the use of the
    object serialization, which stores the object state in a file called object.txt
    and deserializes it.'
