    \n# Creating Threads\n\nJava's creators have graciously designed two ways of creating\
    \ threads: implementing an interface and extending a class. Extending a class\
    \ is the way Java inherits methods and variables from a parent class. In this\
    \ case, one can only extend or inherit from a single parent class. This limitation\
    \ within Java can be overcome by implementing interfaces, which is the most common\
    \ way to create threads. (Note that the act of merely allows the class to be run\
    \ as a thread. It is up to the class to start()execution, etc.)\n\nInterfaces\
    \ provide a way for programmers to lay the groundwork of a class. They are used\
    \ to design the requirements for a set of classes. The interface sets everything\
    \ up, and the class or classes that implement the interface do all the work. The\
    \ different set of classes that implement the interface have to follow the same\
    \ rules.\n\nThere are a few differences between class and an interface. First,\
    \ an interface can only contain abstract methods and/or static final variables\
    \ (constants). Classes, on the other hand, can implement methods and contain variables\
    \ that are not constants. A class that implements an interface must implement\
    \ all methods defined in that interface. An interface has the ability to extend\
    \ from other interfaces, and (unlike classes) can extend from multiple interfaces.\
    \ Furthermore, an interface cannot be instantiated with the new operator; for\
    \ example, Runnable a=new Runnable(); is not allowed.\n\nThe first method of creating\
    \ a thread is to simply extend from the Thread class. Do this only if the class\
    \ you need created does not ever need to be extended from another class. The Thread\
    \ class is defined in the package lang, which needs to be imported so that our\
    \ classes are aware of its definition.\n\n```\nimport java.lang.*;\npublic class\
    \ Counter extends Thread\n{\n  public void run()\n}\n```"
