  md: '# IS-A Relationship


    IS-A is a way of saying: This object is a type of object. Let us see how the extends
    keyword is used to achieve inheritance.


    ```

    public class Animal {

    }

    public class Mammal extends Animal {

    }

    public class Reptile extends Animal {

    }

    public class Dog extends Mammal {

    }

    ```


    Now, based on the above example, in Object-Oriented terms, the following are true
    –


    +   * Animal is thesuperclass of Mammal class.

    * Animal is the superclass of Reptile class.

    * Mammal and Reptile are subclasses of Animal class.

    * Dog is the subclass of both Mammal and Animal classes.


    Now, if we consider the IS-A relationship, we can say –


    +   * Mammal IS-A Animal

    * Reptile IS-A Animal

    * Dog IS-A Mammal

    * Hence: Dog IS-A Animal as well


    With the use of extends keyword, the subclasses will be able to inherit all the
    properties of the superclass except for the private properties of the superclass.


    # The instanceof Keyword


    Let us use the instanceof operator to check whether Mammal is actually an Animal,
    and dog is actually an Animal.'
