- fmt: 'Before diving into the screenshot functionality, ensure your Selenium environment
    is properly configured. This involves setting up `Selenium WebDriver` and ensuring
    your chosen programming environment, such as `Java`, is ready.


    ## Prerequisites


    - Java Development Kit (JDK)

    - `Selenium WebDriver`

    - Appropriate WebDriver for the chosen browser (e.g., `ChromeDriver` for Chrome)


    ## Capturing Screenshots with Selenium WebDriver


    ### Basic Screenshot Capture


    The primary class used for screenshot capture in Selenium is `TakesScreenshot`.
    Here''s a basic example in Java:


    ```java

    WebDriver driver = new ChromeDriver();

    driver.get("https://www.example.com");

    // Cast driver to TakesScreenshot

    TakesScreenshot scrShot =((TakesScreenshot)driver);

    // Call getScreenshotAs method to create an image file

    File SrcFile=scrShot.getScreenshotAs(OutputType.FILE);

    // Move image file to new destination

    File DestFile=new File("path/to/screenshot.png");

    // Copy file at destination

    FileUtils.copyFile(SrcFile, DestFile);

    driver.quit();

    ```


    ### Explanation


    - `TakesScreenshot`: An interface in `Selenium WebDriver`, providing the `getScreenshotAs`
    method.

    - `OutputType.FILE`: Specifies the output type of the screenshot. Other types
    include `BYTES` and `BASE64`.

    - `FileUtils`: Apache Commons IO utility used for file operations.


    ## Advanced Usage


    ### Capturing Element-specific Screenshots


    Instead of capturing the entire screen, you may want to capture only a specific
    web element.


    ```java

    WebElement element = driver.findElement(By.id("elementId"));

    File screenshot = ((TakesScreenshot)element).getScreenshotAs(OutputType.FILE);

    FileUtils.copyFile(screenshot, new File("path/to/element_screenshot.png"));

    ```


    ### Handling Full Page Screenshots


    Capturing the full content of a page that extends beyond the visible screen requires
    additional handling. Libraries like `AShot` can be helpful for this.


    ## Real-world Examples


    ### E-commerce Site


    Consider a scenario where you are testing an e-commerce website, and you need
    to verify that product images load correctly. A screenshot can serve as proof.


    ### Dynamic Content


    For a website with dynamic content, screenshots can help in verifying the dynamic
    elements, like a popup or a modal, at different stages.


    ## Best Practices


    ### Filename Conventions


    Use clear, descriptive names for screenshot files, possibly incorporating timestamps
    to avoid overwriting.


    ### Storage and Cleanup


    Store screenshots in a designated directory and implement a cleanup routine to
    prevent disk space issues.


    ### Integration with Test Reports


    Automatically integrate screenshots into your test reports for a more comprehensive
    overview.


    ## Troubleshooting Common Issues


    ### Black Screenshots


    Occur due to timing issues. Ensure the page or element has fully loaded before
    capturing the screenshot.


    ### Incomplete Screenshots


    Ensure the browser window size is appropriately set or use full-page capture methods.


    ### File Path Issues


    Invalid file paths can cause exceptions. Validate paths and ensure the necessary
    directories exist.


    ## Conclusion


    Capturing screenshots in `Selenium WebDriver` is an essential skill for any tester.
    By following the methods and best practices outlined in this chapter, you can
    effectively integrate screenshot capabilities into your automated testing suite.
    Remember, screenshots not only aid in debugging but also serve as a visual record
    of your test scenarios, adding substantial value to your testing process.


    ## Additional Resources


    For more detailed information on `Selenium WebDriver` and capturing screenshots,
    consider the following resources:


    1. Selenium Documentation: [Selenium Official Website](https://www.selenium.dev/documentation/en/)

    2. Apache Commons IO: [Apache Commons IO Library](https://commons.apache.org/proper/commons-io/)

    3. AShot GitHub Repository: [AShot on GitHub](https://github.com/pazone/ashot)


    ## 8 Selenium WebDriver TestNG Integration


    ### 8.1 Introduction to TestNG Framework


    #### 8.1.1 What is TestNG?


    TestNG, where `NG` stands for "Next Generation," is an open-source testing framework
    inspired by `JUnit` and `NUnit` but introducing new functionalities that make
    it more powerful and easier to use. It is designed to cover all categories of
    tests: unit, functional, end-to-end, integration, etc.


    #### 8.1.2 Why TestNG for Selenium WebDriver?


    TestNG is particularly popular among `Selenium WebDriver` users for several reasons:


    - Annotation Support: Simplifies test code structure.

    - Test Management: Offers the ability to group, sequence, and prioritize tests.

    - Parameterization: Allows data-driven testing.

    - Parallel Execution: Supports running tests in parallel, reducing test execution
    time.

    - Reporting: Generates detailed test execution reports.


    ### 8.1.3 Features of TestNG


    TestNG offers a variety of features:


    - Annotations like `@Test`, `@BeforeSuite`, etc.

    - Support for parameterized and data-driven testing (`@DataProvider`).

    - Test configuration flexibility with XML.

    - Dependencies management in tests.

    - Integration with build tools like `Maven` and `Gradle`


    ### 8.2 Setting Up TestNG


    #### 8.2.1 Installation


    TestNG can be easily installed via `Maven` or `Gradle`. Here’s an example of a
    `Maven` dependency:


    ```xml

    <dependency>

    <groupId>org.testng</groupId>

    <artifactId>testng</artifactId>

    <version>[Latest Version]</version>

    <scope>test</scope>

    </dependency>

    ```


    #### 8.2.2 Configuration


    Once installed, you need to configure your test suite in a TestNG XML file. This
    file lets you manage test run configurations and include or exclude specific tests.


    ## 8.3 Writing Your First TestNG Test


    ### 8.3.1 Basic Structure


    A basic TestNG test includes:


    - Import statements: To import TestNG annotations.

    - Test methods: Annotated with `@Test`.

    - Setup and Teardown methods: Annotated with `@BeforeMethod` and `@AfterMethod`.


    Here’s a simple example:


    ```java

    import org.testng.annotations.*;

    public class FirstTest {


    @BeforeMethod

    public void setUp() {

    // Code to set up environment

    }


    @Test

    public void testMethod() {

    // Test code

    }


    @AfterMethod

    public void cleanUp() {

    // Code to clean up after test

    }


    }

    ```


    #### 8.3.2 Running a TestNG Test


    Tests can be run using TestNG suite XML files, directly from IDE, or through build
    tools like `Maven`.


    ## 8.4 Advanced Concepts in TestNG


    ### 8.4.1 Data-Driven Testing with @DataProvider


    Data-driven testing involves running the same test multiple times with different
    data sets. `@DataProvider` in TestNG helps achieve this:


    ```java

    @DataProvider(name = "data-provider")

    public Object[][] dpMethod() {

    return new Object[][] {{"First-Value"}, {"Second-Value"}};

    }


    @Test(dataProvider = "data-provider")

    public void myTest(String val) {

    System.out.println("Passed Parameter Is : " + val);

    }

    ```


    ### 8.4.2 Grouping Tests


    TestNG allows grouping of test methods. You can define groups in test methods
    and then include or exclude these groups in the TestNG XML file.


    ```java

    @Test(groups = {"group1"})

    public void testMethod1() {

    // Test code

    }

    ```


    ### 8.4.3 Dependency Management


    TestNG allows specifying dependencies between test methods, ensuring that certain
    tests run only after specified methods have completed.


    ```java

    @Test(dependsOnMethods = {"testMethod1"})

    public void testMethod2() {

    // Test code

    }

    ```


    ### 8.4.4 Parallel Execution


    Parallel test execution is a feature in TestNG that allows multiple tests to run
    simultaneously, reducing total execution time. This is configurable in the TestNG
    XML file.


