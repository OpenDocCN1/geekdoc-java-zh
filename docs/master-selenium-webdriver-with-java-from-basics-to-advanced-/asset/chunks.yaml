    WebElement element = driver.findElement(By.name("q"));


    element.sendKeys("Selenium");


    element.submit();


    System.out.println("Title is: " + driver.getTitle());


    driver.quit();


    }


    }


    ```


    This script demonstrates basic actions such as launching a browser, navigating
    to a URL, interacting with web elements, and closing the browser.


    * * *


    Real-World Example: Automating a Login Process


    Let''s apply our Java knowledge in a practical Selenium WebDriver scenario: automating
    a login process for a website.


    ```java


    public class LoginTest {


    public static void main(String[] args) {


    WebDriver driver = new ChromeDriver();


    driver.get("https://www.example-login-page.com");


    // Finding username and password fields


    WebElement usernameField = driver.findElement(By.id("username"));


    WebElement passwordField = driver.findElement(By.id("password"));


    // Typing in credentials


    usernameField.sendKeys("testuser");


    passwordField.sendKeys("password123");


    // Clicking the login button


    WebElement loginButton = driver.findElement(By.id("loginButton"));


    loginButton.click();


    // Verifying successful login


    String expectedUrl = "https://www.dashboard-page.com";


    if (driver.getCurrentUrl().equals(expectedUrl)) {


    System.out.println("Login successful");


    } else {


    System.out.println("Login failed");


    }


    driver.quit();


    }


    }


    ```


    This example demonstrates navigating to a login page, entering credentials, clicking
    a button, and verifying the result, showcasing the integration of Java fundamentals
    in a Selenium context.


    * * *


    Best Practices and Common Pitfalls


    1\. Code Organization: Keep your code clean and organized. Use meaningful variable
    and method names, and separate concerns using different methods and classes.


    2\. Error Handling: Pay attention to error handling in Java. Properly handling
    exceptions in your Selenium scripts can prevent crashes and provide more informative
    test results.


    3\. Avoid Hardcoding: In test automation, avoid hardcoding values like URLs, credentials,
    or element locators. Use properties files or environment variables instead.


    4\. Use Page Object Model: For larger projects, use the Page Object Model (POM)
    design pattern. This approach enhances test maintenance and reduces code duplication.


    5\. Logging: Implement logging to track the execution flow and errors. Tools like
    Log4j can be instrumental in debugging and maintaining test scripts.


    * * *


    Conclusion


    This chapter has covered the essentials of Java programming, tailored to the needs
    of Selenium WebDriver automation. Understanding these basics provides a strong
    foundation for building effective and maintainable automated tests. Remember,
    programming and test automation are skills honed over time through practice and
    continuous learning.


