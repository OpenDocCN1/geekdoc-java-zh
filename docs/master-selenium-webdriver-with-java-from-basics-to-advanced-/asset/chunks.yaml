    9.3 Writing Tests in Extent Reports


    Extent Reports have become a cornerstone in the world of automated testing with
    Selenium WebDriver. They provide a comprehensive and interactive reporting solution,
    vital for understanding the health of web application tests. In this chapter,
    we dive into the specifics of writing tests in Extent Reports, focusing on practical
    implementation and real-world scenarios.


    * * *


    Understanding Extent Reports


    Before delving into writing tests, it''s important to understand what Extent Reports
    are. They are advanced HTML reports that offer rich and interactive documentation
    of your test execution. They display various details such as logs, test steps,
    and screenshots, making it easier to analyze test results.


    * * *


    Setting Up Extent Reports


    To start using Extent Reports in your Selenium WebDriver tests, you first need
    to set them up. Assuming you have already installed Selenium WebDriver and a test
    framework like TestNG, follow these steps:


    1\. Add Extent Reports Dependency: Include the Extent Reports library in your
    project. For Maven, add the following dependency to your `pom.xml` file:


    ```xml


    <dependency>


    <groupId>com.aventstack</groupId>


    <artifactId>extentreports</artifactId>


    <version>[Latest Version]</version>


    </dependency>


    ```


    2\. Initialize ExtentReports Object: In your test code, create and initialize
    an `ExtentReports` object. This object will be responsible for creating and storing
    your test reports.


    ```java


    ExtentReports extent = new ExtentReports();


    extent.attachReporter(new ExtentHtmlReporter("path_to_report.html"));


    ```


    * * *


    Writing Tests with Extent Reports


    With Extent Reports set up, let''s dive into writing tests.


    1\. Creating a Test Instance: For each test, create an `ExtentTest` instance.
    This instance represents your test and will be used to log details to your report.


    ```java


    ExtentTest test = extent.createTest("TestName", "TestDescription");


    ```


    2\. Logging Test Steps: During test execution, use the `ExtentTest` instance to
    log steps. This can include information about what the test is doing, any checkpoints,
    or validations.


    ```java


    test.log(Status.INFO, "Step Description");


    ```


    3\. Adding Screenshots: Screenshots can be a crucial part of understanding why
    a test failed. To add a screenshot to your report:


    ```java


    test.addScreenCaptureFromPath("path_to_screenshot");


    ```


    4\. Marking Test Status: At the end of your test, mark it as passed, failed, or
    skipped based on the outcome.


    ```java


    test.pass("Test Passed");


    test.fail("Test Failed");


    test.skip("Test Skipped");


    ```


    5\. Completing the Report: After all tests are executed, ensure you flush the
    `ExtentReports` instance to write the report to the file.


    ```java


    extent.flush();


    ```


    * * *


    Practical Example: Writing an E-commerce Site Test


    Let''s apply what we''ve learned to a real-world scenario. Imagine we are testing
    an e-commerce website.


    1\. Test Setup: Initialize WebDriver and Extent Reports.


    2\. Writing the Test: Create a test for checking product search functionality.


    3\. Logging Steps: Log each step, like opening the website, entering search terms,
    and clicking the search button.


    4\. Verifications: Add assertions to check if the search results are as expected.


    5\. Screenshots on Failure: Use a try-catch block to capture screenshots in case
    of test failure.


    6\. Test Completion: Mark the test status and complete the report.


    * * *


    Advanced Topics in Extent Reports


    1\. Dynamic Report Generation: Learn how to dynamically generate reports based
    on different test inputs or environments. This is particularly useful in large-scale
    testing scenarios where tests might differ across environments.


    2\. Custom Log Messages: Customize the log messages to include specific formats
    or data, which can be crucial for debugging complex tests.


    3\. Integrating with Other Tools: Explore how Extent Reports can be integrated
    with other tools like JIRA for bug tracking, or Slack for real-time notifications.


    * * *


    Real-World Case Study: E-commerce Site


    Let''s delve deeper into our e-commerce site testing scenario:


    - Objective: Validate the product search functionality.


    - Test Setup: Launch the website, initialize Extent Reports.


    - Test Execution:


    • Navigate to the search bar and enter a product name.


    • Click the search button.


    • Log each step with relevant descriptions in Extent Reports.


    • Verify the search results page for the correct products.


    • Use `try-catch` blocks to handle exceptions and log failures.


    • Capture screenshots for failed steps.


    - Test Closure:


    • Mark the test as passed or failed based on the assertions.


    • Generate the final report.


    * * *


