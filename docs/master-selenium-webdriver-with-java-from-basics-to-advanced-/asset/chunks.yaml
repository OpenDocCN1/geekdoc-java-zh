    \    } else if(status.equalsIgnoreCase(\"FAIL\")) {\n        test.fail(details,\
    \ MediaEntityBuilder.createScreenCaptureFromPath(path).build());\n    }\n}\n```\n\
    \nThis method takes the `ExtentTest` object, `WebDriver` instance, test status,\
    \ and additional details to create an entry in the `Extent Report` with the screenshot.\n\
    \n### Practical Example: Including Screenshots in a Test Case\n\nLet's see how\
    \ this works in a real-world scenario. Consider a test case where we validate\
    \ the login functionality of a web application:\n\n```java\n@Test\npublic void\
    \ testLoginFunctionality() {\n    ExtentTest test = extent.createTest(\"Login\
    \ Test\", \"Test to validate login functionality\");\n    WebDriver driver = new\
    \ ChromeDriver();\n    try {\n        driver.get(\"https://example.com/login\"\
    );\n        // Assume login steps here\n        test.pass(\"Login test passed\"\
    );\n    } catch(Exception e) {\n        reportWithScreenshot(test, driver, \"\
    FAIL\", \"Login test failed\", \"loginTestFailure\");\n        Assert.fail(\"\
    Login test failed\");\n    } finally {\n        driver.quit();\n    }\n}\n```\n\
    \nIn this example, if the login test fails, the `reportWithScreenshot` method\
    \ is called, capturing the current state of the browser and including it in the\
    \ report.\n\n### Best Practices\n\n1. **Descriptive Screenshot Names**: Use clear,\
    \ descriptive names for screenshots to easily identify them.\n2. **Efficient Storage\
    \ Management**: Screenshots can consume significant disk space. Implement a mechanism\
    \ to periodically clean up old screenshots.\n3. **Selective Screenshot Capturing**:\
    \ Capture screenshots selectively, particularly on test failure, to optimize performance\
    \ and storage.\n\n### Troubleshooting Common Issues\n\n- **Screenshot not Captured**:\
    \ Ensure the `WebDriver` instance is active and the file path for saving screenshots\
    \ is correct.\n- **Screenshots not Displaying in Reports**: Check the path provided\
    \ to the `Extent Reports` and ensure it is accessible.\n\n### Conclusion\n\nIncorporating\
    \ screenshots into `Extent Reports` enhances the comprehensiveness and effectiveness\
