    9.4 Including Screenshots in Extent Reports


    In the world of software testing, especially when utilizing Selenium WebDriver,
    the ability to capture and include screenshots in reports is invaluable. Screenshots
    provide visual evidence of test steps, making it easier to understand what happened
    during a test, particularly when a test fails. This chapter delves into the integration
    of screenshot capabilities into Extent Reports within Selenium WebDriver tests.
    We''ll explore practical steps, best practices, and real-world examples.


    * * *


    Understanding the Need for Screenshots in Reports


    Before we dive into the technical aspects, it''s important to understand why screenshots
    are crucial in testing reports:


    1\. Visual Proof: Screenshots act as a visual record, especially useful in debugging
    and analyzing test failures.


    2\. Improved Communication: They help in communicating issues to developers and
    stakeholders who might not have a deep understanding of the code.


    3\. Comprehensive Reporting: Screenshots make reports more informative and comprehensive.


    * * *


    Setting Up Extent Reports with Selenium WebDriver


    First, ensure you have Extent Reports set up with your Selenium WebDriver project.
    If you''re new to this, refer to Chapter 9.2 for a detailed guide on setting up
    Extent Reports.


    * * *


    Capturing Screenshots in Selenium


    To include screenshots in reports, you must first capture them during test execution.
    Here''s how you can do this in Selenium WebDriver using Java:


    ```java


    public String captureScreenshot(WebDriver driver, String screenshotName) {


    TakesScreenshot ts = (TakesScreenshot) driver;


    File source = ts.getScreenshotAs(OutputType.FILE);


    String dest = "./Screenshots/" + screenshotName + ".png";


    File destination = new File(dest);


    FileUtils.copyFile(source, destination);


    return dest;


    }


    ```


    This method captures the current browser window''s screenshot and saves it to
    the specified location.


    * * *


    Integrating Screenshots into Extent Reports


    After capturing screenshots, the next step is to integrate them into the Extent
    Reports. Modify the above method to attach screenshots to the Extent Report:


    ```java


    public void reportWithScreenshot(ExtentTest test, WebDriver driver, String status,
    String details, String screenshotName) {


    String path = captureScreenshot(driver, screenshotName);


    if(status.equalsIgnoreCase("PASS")) {


    test.pass(details, MediaEntityBuilder.createScreenCaptureFromPath(path).build());


    } else if(status.equalsIgnoreCase("FAIL")) {


    test.fail(details, MediaEntityBuilder.createScreenCaptureFromPath(path).build());


    }


    }


    ```


    This method takes the ExtentTest object, WebDriver instance, test status, and
    additional details to create an entry in the Extent Report with the screenshot.


    * * *


    Practical Example: Including Screenshots in a Test Case


    Let''s see how this works in a real-world scenario. Consider a test case where
    we validate the login functionality of a web application:


    ```java


    @Test


    public void testLoginFunctionality() {


    ExtentTest test = extent.createTest("Login Test", "Test to validate login functionality");


    WebDriver driver = new ChromeDriver();


    try {


    driver.get("https://example.com/login");


    // Assume login steps here


    test.pass("Login test passed");


    } catch(Exception e) {


    reportWithScreenshot(test, driver, "FAIL", "Login test failed", "loginTestFailure");


    Assert.fail("Login test failed");


    } finally {


    driver.quit();


    }


    }


    ```


    In this example, if the login test fails, the `reportWithScreenshot` method is
    called, capturing the current state of the browser and including it in the report.


    * * *


    Best Practices


    1\. Descriptive Screenshot Names: Use clear, descriptive names for screenshots
    to easily identify them.


    2\. Efficient Storage Management: Screenshots can consume significant disk space.
    Implement a mechanism to periodically clean up old screenshots.


    3\. Selective Screenshot Capturing: Capture screenshots selectively, particularly
    on test failure, to optimize performance and storage.


    * * *


    Troubleshooting Common Issues


    - Screenshot not Captured: Ensure the WebDriver instance is active and the file
    path for saving screenshots is correct.


    - Screenshots not Displaying in Reports: Check the path provided to the Extent
    Reports and ensure it is accessible.


    * * *


    Conclusion


    Incorporating screenshots into Extent Reports enhances the comprehensiveness and
    effectiveness of automated testing reports. By following the steps and best practices
    outlined in this chapter, you can effectively integrate this capability into your
    Selenium WebDriver tests.


    * * *


    Additional Resources


    For further learning, refer to the following resources:


    1\. Extent Reports Documentation: [Extent Reports Official Documentation]([https://extentreports.com/docs/versions/4/java/](https://extentreports.com/docs/versions/4/java/))


    2\. Selenium WebDriver API: [Selenium WebDriver API Docs]([https://www.selenium.dev/documentation/en/](https://www.selenium.dev/documentation/en/))'
