    \ 属性选择器\n根据元素的属性定位元素。\n- `[attribute=value]` – 选择具有指定属性和值的元素。\n\n## 3. 组合选择器\n\
    组合多个选择器。\n\n- `A B` – 后代组合器（例如，`div input` 选择 `div` 内部的所有 `input` 元素）。\n- `A >\
