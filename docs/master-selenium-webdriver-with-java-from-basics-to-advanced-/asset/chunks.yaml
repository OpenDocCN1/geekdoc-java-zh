    button.btn.btn-primary\"));\nloginButton.click();\n```\n\n### 示例 2：在表单查找输入框\n\
    HTML 代码段：\n\n```html\n<form id=\"loginForm\">\n<input type=\"text\" name=\"username\"\
    >\n</form>\n```\n\nSelenium 中的 CSS 选择器：\n\n```java\nWebElement usernameField =\
    \ driver.findElement(By.cssSelector(\"#loginForm input[name='username']\"));\n\
    usernameField.sendKeys(\"testUser\");\n```\n\n***\n\n## 最佳实践\n1. **保持选择器简单**：避免使用过度复杂的选择器；简单的选择器更具可维护性。\n\
    2. **使用 ID 和 Class**：尽可能使用 ID 和类名，因为它们的效率更高。\n3. **避免绝对路径**：它们是脆弱的，并且会随着 UI 的变化而失效。\n\
    4. **测试你的选择器**：确保它们选取的是预期的元素。\n\n***\n\n## 处理动态元素\n动态元素可能会改变其属性，导致它们难以定位。CSS 选择器可以有效地处理此类元素。例如，如果元素的类在用户交互后发生发生变化，你可以使用子字符串匹配属性，如\
    \ `[class^='partialClassName']`。\n\n***\n\n## 常见问题排查\n1. **未找到选择器**：验证选择器的准确性以及元素在\
    \ DOM 中是否存在。\n2. **元素不可交互**：确保元素在交互之前是可见且已启用的。\n\n***\n\n## 结论\nCSS 选择器是 Selenium\
    \ WebDriver 中定位元素的一种多功能且高效的方法。它们的简单性、速度和对浏览器的广泛支持使其成为 Web 自动化测试的首选。通过理解并有效使用 CSS\
    \ 选择器，你可以增强 Selenium 测试的可靠性和可维护性。\n\n***\n\n## 额外资源\n- [CSS 选择器参考](https://www.w3schools.com/cssref/css_selectors.asp)\n\
