    4.4 Running Your First WebDriver Script


    Welcome to the exciting journey of automating web testing with Selenium WebDriver.
    This chapter, "Running Your First WebDriver Script," is designed to transform
    your theoretical understanding into practical skills. We''ll start from the very
    basics and gradually move to executing your first script using Selenium WebDriver
    with Java.


    * * *


    Setting the Stage


    Before diving into the script, let''s ensure you have the necessary setup:


    - Java Development Kit (JDK): Installed and configured.


    - Eclipse IDE or any Java IDE: For writing and executing your Java code.


    - Selenium WebDriver: Downloaded and added to your project.


    * * *


    Your First WebDriver Script


    Step 1: Creating a New Project


    In your IDE, create a new Java project. Name it appropriately, for instance, `SeleniumFirstScript`.


    Step 2: Adding Selenium WebDriver


    Add Selenium WebDriver to your project. If you''re using Eclipse, you can do this
    by right-clicking on the project → Build Path → Configure Build Path → Libraries
    → Add External JARs, and then selecting the downloaded Selenium WebDriver JAR
    files.


    Step 3: Writing the Script


    Create a new Java class named `FirstWebDriverScript`.


    ```java


    import org.openqa.selenium.WebDriver;


    import org.openqa.selenium.chrome.ChromeDriver;


    public class FirstWebDriverScript {


    public static void main(String[] args) {


    // Set the path for the Chrome driver executable


    System.setProperty("webdriver.chrome.driver", "path/to/chromedriver");


    // Initialize a Chrome driver instance


    WebDriver driver = new ChromeDriver();


    // Navigate to a web page


    driver.get("https://www.example.com");


    // Perform your test steps here...


    // Close the browser


    driver.quit();


    }


    }


    ```


