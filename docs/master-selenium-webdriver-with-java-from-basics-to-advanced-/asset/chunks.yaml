    • Definition: An open-source web automation tool, part of the Selenium Suite,
    used for automating web applications for testing purposes.


    • Example: Used to automate tasks on a web browser like Chrome or Firefox, such
    as filling out forms and simulating mouse clicks.


    2\. Java


    • Definition: A high-level, class-based, object-oriented programming language
    widely used for web development, mobile applications, and large-scale enterprise
    systems.


    • Example: Writing Selenium WebDriver scripts for automating browser actions.


    3\. Automated Web Testing


    • Definition: The process of executing test cases and scenarios on a web application
    using automation tools like Selenium WebDriver to verify its functionality and
    performance.


    • Example: Automatically verifying the login process of a web application.


    4\. Object-Oriented Programming (OOP)


    • Definition: A programming paradigm based on the concept of "objects" which can
    contain data and code: data in the form of fields, and code in the form of procedures.


    • Example: Creating a ‘Browser’ class in Java that encapsulates properties like
    URL and methods like navigate().


    5\. Exception Handling


    • Definition: A programming construct used to handle errors and other exceptional
    conditions that occur during the execution of a program.


    • Example: Using try-catch blocks in Java to manage WebDriver exceptions.


    6\. CSS Selectors


    • Definition: Patterns used to select the elements based on their id, class, types,
    attributes, values of attributes, etc., in a web page.


    • Example: Selecting a button on a web page by its class name.


    7\. XPath Selectors


    • Definition: A language used for locating nodes in XML documents, which can be
    used to navigate through elements and attributes in an HTML document.


    • Example: Finding a specific link in a webpage using XPath query.


    8\. WebElement


    • Definition: An interface in Selenium WebDriver, representing an HTML element.


    • Example: Interacting with a text input box on a web page using WebDriver’s WebElement.


    9\. TestNG Framework


    • Definition: A testing framework inspired by JUnit and NUnit, which provides
    more advanced features like annotations, grouping, sequencing, and parameterization
    of tests.


    • Example: Using TestNG to run a suite of Selenium WebDriver tests.


    10\. Extent Reports


    • Definition: An open-source reporting library for test automation capable of
    producing rich and interactive reports.


    • Example: Generating detailed test execution reports using Extent Reports in
    a Selenium project.


    11\. Page Object Model (POM)


    • Definition: A design pattern in Selenium WebDriver for enhancing test maintenance
    and reducing code duplication.'
