    ## 12. Selenium Grid

    -   **定义**：Selenium 套件的一部分，允许你在不同的机器上针对不同的浏览器并行运行测试。

    -   **示例**：使用 Grid 在多个浏览器和操作系统上同时运行 Selenium 测试。


