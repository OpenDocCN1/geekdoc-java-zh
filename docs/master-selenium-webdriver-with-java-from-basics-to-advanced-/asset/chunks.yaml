    \    }\n\n    // 密码和点击登录的类似方法\n}\n```\n\n## 13.7 测试套件与分组\n\n在套件中对测试分组允许你一起运行一组测试。例如，你可能有一个冒烟测试套件和另一个回归测试套件。像\
    \ `TestNG` 等工具通过注解让这变得更容易。\n\n## 13.8 测试套件示例\n\n使用 `TestNG`，你可以在 XML 文件中定义套件：\n\
