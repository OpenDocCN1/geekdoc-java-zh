    \n### 4.1.2 Creating a Web service from an EJB\n\nIf the application logic is\
    \ implemented in an `EJB`, we can create a Web service whose methods redirect\
    \ calls to the `EJB`’s methods, therefore exposing the component logic of any\
    \ application. The first thing to do is to open an enterprise project within the\
    \ IDE in which we already defined the `EJB` module.\n\nSuppose, for example, that\
    \ we have a simple `EJB` module called `Calculator-ejb`, with a stateless session\
    \ EJB that exposes two methods, one that calculates the sum of two numbers and\
    \ one that multiplies them. The source code for the implementation component would\
    \ be follows:\n\n```java\npackage ejbs;\nimport javax.ejb.Stateless;\n\n@Stateless\n\
    public class Calculator implements CalculatorLocal {\n    public int add(int x,\
    \ int y) {\n        return x+y;\n    }\n\n    public long multiplication(int x,\
    \ int y) {\n        return x*y;\n    }\n}\n```\n\nTo create the Web service that\
    \ “wraps” the `EJB`’s methods, we create a Web application, either within the\
    \ same Enterprise application as the `EJB` module or as an independent application.\
    \ Next, we follow the same steps as in the previous case for creating a Web service,\
    \ although when we get to the `New Web Service` dialog box, we should choose the\
    \ `Create Web Service From Session Bean` option and click the `browse` button\
    \ to choose the session EJB (into the `Enterprise Bean` field) which implements\
    \ the application logic.\n\nThe code generated for the Web service class will\
    \ look as follows:\n\n```java\npackage services;\nimport ejbs.CalculatorLocal;\n\
    import javax.ejb.EJB;\nimport javax.jws.WebMethod;\nimport javax.jws.WebParam;\n\
    import javax.jws.WebService;\n\n@WebService()\npublic class CalculatorWS {\n \
    \   @EJB\n    private CalculatorLocal ejbRef;\n\n    @WebMethod(operationName\
    \ = \"add\")\n    public int add(@WebParam(name = \"x\") int x, @WebParam(name\
    \ = \"y\") int y) {\n        return ejbRef.add(x, y);\n    }\n\n    @WebMethod(operationName\
    \ = \"multiplication\")\n    public long multiplication(@WebParam(name = \"x\"\
    ) int x, @WebParam(name = \"y\") int y) {\n        return ejbRef.multiplication(x,\
    \ y);\n    }\n}\n```\n\n### 4.1.3 Creating a Web service from a WSDL document\n\
    \nAlthough a bottom-up development approach is more common, i.e. create a Web\
    \ service from a predefined set of methods, other times, what is know as top-down\
    \ development is required. In top-down development, the starting point is a `WSDL`\
    \ interface that describes the functionality of the Web service that we want to\
    \ implement, from which we develop the code for Web service’s methods and the\
    \ XML adaptor.\n\nWith NetBeans it’s very easy to build the implementation class\
    \ for a Web service from a `WSDL` interface. To do this, choose the `New -> Web\
    \ Service From WSDL` option from the project pop-up menu, which opens a dialog\
    \ box in which we should enter, in addition to the Web service name, the address\
    \ of the `WSDL` document that defines its methods.\n\nOn clicking `Finish`, a\
    \ class declared with the annotation `@WebService` is generated, containing the\
    \ methods that the Web service should expose according to the `WSDL` document\
    \ specifications:\n\n```java\n@WebService(serviceName = \"OperationsWS\",\nportName\
    \ = \"Operations\",\nendpointInterface = \"services.Operations\",\ntargetNamespace\
    \ = \"http://service\",\nwsdlLocation = \"WEB-INF/wsdl/service_from_wsdl/Operations.wsdl\"\
    )\n```\n"
