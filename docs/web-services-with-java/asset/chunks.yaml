  trans: "\n在调用 `ValidationsWS` 对象的 `loginClient()` 方法时会非常有用。换句话说，Web 服务返回的复杂数据由客户端代理映射为\
    \ **JavaBean 对象**。\n\n### 练习 3\n\n在练习中，我们将开发一个 Web 应用程序，利用一个外部 Web 服务来检查用户在文本框中输入的电子邮件地址是否有效。\n\
    \n我们将使用一个属于 CDYNE Corporation [(www.cdyne.com)](http://www.cdyne.com/) 的免费公共 Web\
    \ 服务，该服务是使用 .NET 实现的 Web 服务，我们可以从 Java 应用程序中访问它。描述其接口的 WSDL 文档地址为：\n\n`http://ws.cdyne.com/emailverify/Emailvernotestemail.asmx?wsdl`\n\
    \n在 [`www.xmethods.org/`](http://www.xmethods.org/) 网页上，我们可以找到关于提供常见功能的不同公共使用的\
    \ Web 服务信息。\n\n该电子邮件验证 Web 服务暴露了四个方法，其中我们将使用 `verifyEmail()`。该方法接收一个电子邮件地址和一个许可密钥（由于是免费的，你可以输入空字符串），并返回一个带有验证结果的复杂数据类型。在创建\
    \ Java 代理时，此数据类型被映射为类 `ReturnIndicator` 的 JavaBean，该类提供了以下返回验证信息的方法：\n\n*   `getResponseText()`：返回一个关于刚完成的验证信息的字符串。\n\
    *   `getResponseCode()`：返回一个验证结果代码。\n*   `isGoodEmail()`：指示电子邮件是否有效。\n\n按照已经讨论过的流程，我们从\
    \ NetBeans Web 应用程序生成代理类。在所有生成的类中，`EmailVerNoTestEmail` 和 `EmailVerNoTestEmailSoap`\
    \ 将是我们用于创建代理对象的。\n\n该 Web 应用程序由一个使用 JSP 实现的 Web 页面，包含一个文本框和一个提交按钮，要求用户输入要检查的电子邮件地址。该页面的代码所示：\n\
    \n```jsp\n<%@page contentType=\"text/html\" pageEncoding=\"UTF-8\"%>\n<!DOCTYPE\
    \ HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\"\
    >\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html;charset=UTF-8\"\
    >\n<title>JSP Page</title>\n</head>\n<body>\n<center>\n<form action=\"Verify\"\
    \ method=\"post\">\nEmail:<input type=\"text\" name=\"email\"/><br/>\n<input type=\"\
    submit\" value=\"Verify\"/>\n</form>\n</center>\n</body>\n</html>\n```\n\n`verify`\
    \ servlet 的作用是调用 `verifyEmail()` Web 服务方法并生成一个带有验证返回信息的页面。servlet 的代码如下：\n\n```java\n\
    package servlets;\n\nimport java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    import proxy.*;\n\npublic class Verify extends HttpServlet {\n    protected void\
    \ service(HttpServletRequest request, HttpServletResponse response)\n    throws\
    \ ServletException, IOException {\n        response.setContentType(\"text/html;charset=UTF-8\"\
    );\n        PrintWriter out = response.getWriter();\n        try {\n         \
    \   EmailVerNoTestEmail service = new EmailVerNoTestEmail();\n            EmailVerNoTestEmailSoap\
    \ port = service.getEmailVerNoTestEmailSoap();\n            String email = request.getParameter(\"\
    email\");\n            String licenseKey = \"\";\n            ReturnIndicator\
    \ result = port.verifyEmail(email, licenseKey);\n            out.println(\"<html><body>\"\
    );\n            out.println(\"<h1>Result = \" + result.getResponseText() + \"\
    </h1>\");\n            out.println(\"</body></html>\");\n        } catch (Exception\
    \ ex) {\n            ex.printStackTrace();\n        } finally {\n            out.close();\n\
    \        }\n    }\n}\n```\n\n### 4.3. 异步调用 Web 服务的方法\n\n自然地，当通过代理对象调用 Web 服务方法时，遵循已经概述的步骤，程序将阻塞在调用方法的指令处，等待\
    \ Web 服务生成的 HTTP 响应返回结果。这就是所知的同步模式。\n\n然而，在某些情况下，我们不需要方法返回的值就能继续执行客户端应用程序。在这种情况下，能够异步调用方法将很有趣，这意味着程序将调用方法并继续正常执行，而无需等待其返回结果。\n\
    \n为了实现这一点，客户端应用程序应该提供一个回调方法，该方法一旦从 Web 服务接收到响应值，就会由代理执行。\n\n#### 4.3.1. 代理对象配置\n\
    \n在开发 Web 服务以进行异步调用时不需要特殊步骤，但你必须恰当地配置代理以允许这种可能性。因此，一旦在客户端应用程序中创建了代理，为了能够进行异步方法调用，我们在“Web\
    \ Service References”文件夹中选择我们的 Web 服务引用，并在弹出菜单中点击“Edit Web Service Attributes”选项（图\
    \ 28）。\n\n**图 28。**\n\n在随后的对话框中，点击“WSDL Customization”选项卡，打开“Port Type Operations”文件夹，在我们想要异步调用的方法中，勾选“Enable\
    \ Asynchronous Client”选项（图 29）。\n\n**图 29。**\n\n点击“OK”后将出现信息对话框，告诉我们代理类将重新生成。\n\
    \n如果我们打开客户端中的“Service References”文件夹，可以看到除了同步方法版本外，还创建了两个新版本。其中一个方法用于回调函数（我们通常使用的），另一个使用轮询，定期检查响应是否到达。\n\
    \n**图 30。**\n\n#### 4.3.2. 异步调用方法\n\n要异步调用 Web 服务，我们将“Async Callback”元素拖到客户端类中，生成如图\
    \ 31 所示的应用程序：\n\n```java\npublic static void main(String[] args) {\n    try {\n\
    \        //调用 Web 服务(异步回调)\n        proxy.CalcSService service = new proxy.CalcSService();\n\
    \        //代理对象\n        proxy.CalcWSPort port = service.getWSPort();\n      \
    \  //在此处初始化 WS 参数\n        int num = 0;\n        javax.xml.ws.AsyncHandler<proxy.FactorialResponse>\
    \ asyncHandler =\n        new javax.xml.ws.AsyncHandler<proxy.FactorialResponse>(){\n\
    \            public void handleResponse(javax.xml.ws.Response<proxy.FactorialResponse>\
    \ response){\n                try {\n                    //在此处处理异步响应\n       \
    \             System.out.println(\"Result = \" + response.get());\n          \
    \      } catch (Exception ex) {\n                    //处理异常\n                }\n\
    \            }\n        };\n        //定义方法异步调用的匿名类\n        java.util.concurrent.Future<?\
    \ extends java.lang.Object> result =\n        port.factorialAsync(num, asyncHandler);\n\
    \        //检查是否存在结果\n        while (!result.isDone()) {\n            //做一些事情\n\
    \            Thread.sleep(100);\n        }\n    } catch (Exception ex) {\n   \
    \     //在此处处理自定义异常\n    }\n}\n```\n\n**图 31。**\n"
- fmt: "\nIn addition to the Web service’s own parameters, this method takes the object\
    \ that implements the `AsyncHandler` interface. The call to this method returns\
    \ a `Future` object that allows us to check, using the method `isDone()`, if the\
    \ result has been returned to the client.\n\nFor example, the following program\
    \ calculates the factorial of 7 using the `CalcWS` Web service, and while this\
    \ calculation is in progress, the client program displays a message “waiting”\
    \ message every tenth of a second:\n\n```java\npackage client;\n\nimport javax.xml.ws.*;\n\
    import proxy.*;\nimport java.uti.concurrent.*;\n\npublic class Test {\n    public\
    \ static void main(String[] args) {\n        try {\n            CalcWSService\
    \ service = new CalcWSService();\n            CalcWS port = service.getCalcWSPort();\n\
    \            int num = 7;\n            AsyncHandler<FactorialResponse> asyncHandler\
    \ =\n                new AsyncHandler<FactorialResponse>() {\n               \
    \     public void handleResponse(Response<FactorialResponse> response) {\n   \
    \                     try {\n                            System.out.println(\"\
    Result = \"+\n                            response.get().getReturn());\n     \
    \                   } catch(Exception ex) {}\n                    }\n        \
    \        };\n            Future<? extends Object> result =\n                port.factorialAsync(num,\
    \ asyncHandler);\n            while(!result.isDone()) {\n                System.out.println(\"\
    waiting\");\n                Thread.sleep(100);\n            }\n        } catch\
    \ (Exception ex) { }\n    }\n}\n```\n\n# 5. USING THE GOOGLE SEARCH WEB SERVICE\n\
    \nGoogle has a wide variety of Web services that can be used by developers to\
    \ integrate their powerful search engine within their applications.\n\nIn 2003\
    \ Google published their first Web service, the classic Google search. This Web\
    \ service exposes a WSDL interface that defines its functionality, however from\
    \ 2006 this became obsolete and from March 2009 Google no longer supports this\
    \ Web service.\n\nNowadays, the various Web services provided by Google should\
    \ be accessed using special APIs created by Google themselves, removing the need\
    \ to rely on proxy objects created by the many development environments.\n\nThese\
    \ are some of the main APIs available to access Google’s services:\n\n* **AJAX\
    \ API**: a set of JavaScript objects that provide access to the classic Google\
    \ search service from any Web page, also integrating AJAX functionality.\n* **Google\
    \ maps API**: Lets you integrate interactive maps in your Web site.\n* **Google\
    \ Web ToolKit**: Java API for integrating the search service in any application.\n\
    \nAs an example of how to use these Web services, we are going to analyse the\
    \ Google AJAX API with which we can implement a Google search engine within our\
    \ own Web pages.\n\n## 5.1. USING THE AJAX API\n\nIn order to use this service,\
    \ you need to get a licence key that is available without charge from the following\
    \ link: `http://code.google.com/intl/es/apis/ajaxsearch/signup.html`\n\nOnce you\
    \ have this key, it’s very easy to access Google’s JavaScript objects that we\
    \ will use to implement our own search page.\n\n### 5.1.1. Using Google’s search\
    \ control\n\nThe easiest way to implement a search page is by including Google’s\
    \ own search control. The first thing to do is to add the following script to\
    \ the header of the page that references Google’s AJAX API loader:\n\n```html\n\
    <script type=\"text/javascript\" src=\"http://www.google.com/jsapi?key=mykey\"\
    ></script>\n```\n\nHere `mykey` represents the key Google supplies us with in\
    \ URL above. This key can be used by all the pages in our applications where we\
    \ want to use the AJAX API.\n\nNext we load the search API using the `load` method\
    \ from the `google` object:\n\n```html\n<script type=\"text/javascript\">\ngoogle.load(\"\
    search\", \"1\");\n</script>\n```\n\nThe loader, which is actually the `google`\
    \ object, can load several different APIs. The search API is obviously loaded\
    \ by passing the string “search” as the first parameter, whereas if we wanted\
    \ to load the Google Maps API we would enter “maps” here.\n\nNext, we will create\
    \ an instance of `SearchControl`, the object that represents the Google search\
    \ control, i.e. the text field with the search button:\n\n```javascript\nvar searchControl\
    \ = new google.search.SearchControl();\n```\n\nIn order to carry out searches,\
    \ the control needs to know where to search, i.e. whether it’s a local search,\
    \ a Web search, searching a newsgroup, etc. To define where you want to search,\
    \ you have to instantiate the relevant search objects and add them to the search\
    \ collection using the `addSearcher()` method. For example, to do Web searches,\
    \ include the following instruction:\n\n```javascript\nsearchControl.addSearcher(new\
    \ google.search.WebSearch());\n```\n\nTo finish, all that remains is to indicate\
    \ where we want to show the Google search control. This would be a `<div>` element,\
    \ where apart from the control, the search results will be displayed. For example,\
    \ if the id of the `<div>` element is `search`, the following instruction should\
    \ be included:\n\n```javascript\nsearchControl.draw(document.getElementById(\"\
    search\"));\n```\n\nThis is all that is required to enhance our page with a search\
    \ control that, using Google’s Web service, displays search results on the same\
    \ page using AJAX technology. The following code is for the .html page in figure\
    \ 32, which includes Google’s search control:\n\n```html\n<!DOCTYPE html PUBLIC\
    \ \"-//W3C//DTD XHTML 1.0 Strict//EN\" \"http://www.w3.org/TR/xhtml1/DTD\">\n\
    <html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<meta http-equiv=\"content-type\"\
    \ content=\"text/html; charset=utf-8\"/>\n<title>Hello World - Search API Sample</title>\n\
    <style type=\"text/css\">#search { width: 400px; }</style>\n<script src=\"http://www.google.com/jsapi?key=mykey\"\
    ></script>\n<script type=\"text/javascript\">\ngoogle.load('search', '1');\nfunction\
    \ OnLoad() {\n    var searchControl = new google.search.SearchControl();\n   \
    \ searchControl.addSearcher(new google.search.WebSearch());\n    searchControl.draw(document.getElementById(\"\
    search\"));\n}\n</script>\n</head>\n<body onload=\"OnLoad()\">\n<center><h1>Using\
    \ the search control</h1></center>\n<br />\n<div id=\"search\">Loading</div>\n\
    </body>\n</html>\n```\n\n### 5.1.2. Personalized Search Control\n\nIf we would\
    \ like to use our own search control instead of using Google’s, we would need\
    \ to include, within the JavaScript code, the same instructions as those performed\
    \ by the searches. To carry out Web searches, we need an instance of the `google.search.WebSearch`\
    \ class, whose `execute()` method performs the search on the Web using the string\
    \ provided as a parameter.\n\nAs `execute()` is executed asynchronously, we should\
    \ use `WebSearch`’s `setSearchCompleteCallback()` method to specify the callback\
    \ function where the response will be processed once its been received by the\
    \ browser. Access to the response data is achieved using `WebSearch`’s `results()`\
    \ method, which contains an array of results of type `GSearchResult`. `SearchResult`\
    \ exposes a series of properties like `title` or `url` that provide us with the\
    \ title of the page found and its URL, respectively.\n\nThe following code is\
    \ for the page in figure 33, which implements a personalized search control that\
    \ uses simple HTML controls to interact with the user:\n\n```html\n<!DOCTYPE html\
    \ PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\" \"http://www.w3.org/TR/xhtml1/DTD\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<meta http-equiv=\"\
    content-type\" content=\"text/html; charset=utf-8\"/>\n<title>Search API Sample</title>\n\
    <style type=\"text/css\">#searchcontrol { width: 400px; }</style>\n<script src=\"\
    http://www.google.com/jsapi?key=mykey\"></script>\n<script type=\"text/javascript\"\
    >\ngoogle.load('search', '1');\nvar searchControl;\nfunction search() {\n    searchControl\
    \ = new google.search.WebSearch();\n    searchControl.setSearchCompleteCallback(this,\
    \ process);\n}\nfunction process(response) {\n    var results = searchControl.results();\n\
    \    for (var i = 0; i < results.length; i++) {\n        document.write(results[i].title\
    \ + \" - \" + results[i].url + \"<br>\");\n    }\n}\n</script>\n</head>\n<body>\n\
    <input type=\"text\" id=\"searchtext\" />\n<input type=\"button\" value=\"search\"\
    \ onclick=\"search()\" />\n<div id=\"searchcontrol\"></div>\n</body>\n</html>\n\
    ```\n"
