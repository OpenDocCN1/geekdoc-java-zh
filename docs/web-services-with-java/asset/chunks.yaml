    \ 4.3. INVOKING A WEB SERVICE’S METHODS ASYNCHRONOUSLY\n\nNaturally, when calling\
    \ a Web service’s methods via a proxy object, following the steps already outlined,\
    \ the program remains locked in the instruction that calls the method, waiting\
    \ for the result to be returned by the HTTP response generated by the Web service.\
    \ This is what is known as synchronous mode.\n\nHowever, there are times when\
    \ we don’t need the value returned by the method to be able to continue executing\
    \ the client application. It would be interesting in this case to be able to invoke\
    \ the methods asynchronously, which would mean that the program would call the\
    \ method and continue executing normally without waiting for it to return a result.\n\
    \nTo do this, the client application should provide a callback method that gets\
    \ executed by the proxy as soon as the response value is received from the Web\
    \ service.\n\n#### 4.3.1. Proxy object configuration\n\nThere are no special steps\
    \ when developing a Web service in order to asynchronously invoke it, but you\
    \ do have to suitably configure the proxy to allow this possibility. Therefore,\
    \ once the proxy has been created in the client application, in order to be able\
    \ to make asynchronous method calls, we select the reference to our Web service\
    \ within the “Web Service References” folder and in the pop-up menu click the\
    \ “Edit Web Service Attributes” option (figure 28).\n\n**Figure. 28.**\n\nIn the\
    \ dialog box that follows, click the “WSDL Customization” tab, open up the “Port\
    \ Type Operations” folder and within the method that we want to invoke asynchronously,\
    \ check the “Enable Asynchronous Client” option (figure 29).\n\n**Figure. 29.**\n\
    \nOn clicking “OK”, an informational dialog box wil appear, telling us that the\
    \ proxy classes will be regenerated.\n\nIf we open the “Web Service References”\
    \ folder in the client Project, notice that, apart from the synchronous version\
    \ of the method, two new versions have been created allowing asynchronous calls.\
    \ One of these methods is for use with a callback function, the one we would normally\
    \ use, and the other uses polling, which would periodically poll the proxy checking\
    \ if the response has arrived.\n\n**Figure. 30.**\n\n#### 4.3.2. Calling methods\
    \ asynchronously\n\nTo make an asynchronous call to a Web service, we drag the\
    \ “Async Callback” element to the client class within the Web service references,\
    \ generating the application skeleton shown in figure 31.\n\n```java\npublic static\
    \ void main(String[] args) {\n    try {\n        //Call Web Service Operation(async.callback)\n\
    \        proxy.CalcWSService service = new proxy.CalcWSService();\n        //object\
    \ proxy\n        proxy.CalcWSPort port = service.getCalcWSPort();\n        //TODO\
    \ initialize WS arguments here\n        int num = 0;\n        javax.xml.ws.AsyncHandler<proxy.FactorialResponse>\
    \ asyncHandler =\n        new javax.xml.ws.AsyncHandler<proxy.FactorialResponse>(){\n\
    \            public void handleResponse(javax.xml.ws.Response<proxy.FactorialResponse>\
    \ response){\n                try {\n                    //TODO process asynchronous\
    \ response here\n                    System.out.println(\"Result = \" + response.get());\n\
    \                } catch (Exception ex) {\n                    //TODO handle exception\n\
    \                }\n            }\n        };\n        //anonymous class that\
    \ defines the callback method asynchronous call to the method\n        java.util.concurrent.Future<?\
    \ extends java.lang.Object> result =\n        port.factorialAsync(num, asyncHandler);\n\
    \        //Checks if there is a result\n        while (!result.isDone()) {\n \
    \           //do something\n            Thread.sleep(100);\n        }\n    } catch\
