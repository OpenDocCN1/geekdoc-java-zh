  trans: "\n\n```xml\n<wsdl:part element=\"intf:loginResponse\" name=\"parameters\"\
    />\n</wsdl:message>\n```\n\n### 3.2.1.3. portType\n\n`portType` 元素描述了 Web 服务暴露出的操作。实际上，每个操作都由\
    \ `operation` 元素定义，并与一个输入消息和一个输出消息相关：\n\n```xml\n<wsdl:portType name=\"Operations\"\
    >\n  <wsdl:operation name=\"login\">\n    <wsdl:input message=\"intf:loginRequest\"\
    \ name=\"loginRequest\"/>\n    <wsdl:output message=\"intf:loginResponse\" name=\"\
    loginResponse\"/>\n  </wsdl:operation>\n</wsdl:portType>\n```\n\n### 3.2.1.4.\
    \ binding\n\n一旦定义了 Web 服务将执行的操作，就应该将它们绑定到特定的协议。这是通过 `binding` 元素实现的，在其中我们可以指定传输类型（SOAP\
    \ 或 JMS）、执行特定操作的网络访问点以及样式（document 或 RPC）：\n\n```xml\n<wsdl:binding name=\"OperationsSoapBinding\"\
    \ type=\"intf:Operations\">\n  <wsaw:UsingAddressing wsdl:required=\"false\" xmlns:wsaw=\"\
    http://www.w3.org/2006/05/addressing/wsdl\"/>\n  <wsdlsoap:binding style=\"document\"\
    \ transport=\"http://schemas.xmlsoap.org/soap/http\"/>\n  <wsdl:operation name=\"\
    login\">\n    <wsdlsoap:operation soapAction=\"login\"/>\n    <wsdl:input name=\"\
    loginRequest\">\n      <wsdlsoap:body use=\"literal\"/>\n    </wsdl:input>\n \
    \   <wsdl:output name=\"loginResponse\">\n      <wsdlsoap:body use=\"literal\"\
    />\n    </wsdl:output>\n  </wsdl:operation>\n</wsdl:binding>\n```\n\n### 3.2.1.5.\
    \ service\n\n最后，我们需要在 `service` 元素中指定 Web 服务的地址或入口。在 `port` 子元素中，指定了每个 `binding`\
    \ 元素的地址。在 SOAP 的情况下，`address` 元素中的 `location` 属性包含了实际地址。\n\n```xml\n<wsdl:service\
    \ name=\"OperationsService\">\n  <wsdl:port binding=\"intf:OperationsSoapBinding\"\
    \ name=\"Operations\">\n    <wsdlsoap:address location=\"http://localhost:9080/login_ws/services/Operations\"\
    />\n  </wsdl:port>\n</wsdl:service>\n```\n\n### 3.3. UDDI\n\nUDDI（通用描述、发现与集成项目）规范的目的是定义在与\
    \ UDDI 连接的服务注册表中发布和定位 Web 服务的标准。\n\nUDDI 注册表是一种“金页/黄页”风格的数据库，存储了与发布的 Web 服务相关的信息。这意味着两种类型的应用程序可以访问此类注册表：\n\
    \n*   **服务提供者**：发布服务。UDDI 提供了机制，使提供者能够注册其 Web  WSDL 描述和其他相关信息。\n*   **服务消费者**：使用注册表定位服务并使用该服务（服务绑定）。UDDI\
    \ 支持服务搜索机制。\n\n对于发布、编辑和搜索，使用 SOAP 消息来访问 UDDI 注册表。\n\n### 3.3.1. UDDI schema\n\n\
    识别构成 Web 服务注册条目的 XML 数据结构类型。UDDI XML 架构定义了四种基本数据类型，描述了存储在 UDDI 注册表中的信息。这些数据通过以下元素供所有人可见：\n\
    \n*   **businessEntity**：描述提供服务的实体的信息。这些信息包括实体的名称、描述、提供的服务列表、类别以及可用于搜索的标识列表（图\
    \ 6）。\n\n```xml\n<businessEntity businessKey=\"35AF7F00-1419-11D6-A0DC-000C0E00ACDD\"\
    \ authorizedName=\"0100002CAL\" operator=\"www-3.ibm.com/services/uddi\">\n  <name>Shop</name>\n\
    \  <description xml:lang=\"en\">All kind of product sales</description>\n  <contacts>\n\
    \    <contact>\n      <personName>Jhon Cook</personName>\n      <phone>918890234</phone>\n\
    \    </contact>\n  </contacts>\n  <businessServices>\n    …\n  </businessServices>\n\
    </businessEntity>\n```\n**图 6。**\n\n*   **businessService**：识别由实体提供的 Web 服务。由于一个实体可以提供多个\
    \ Web 服务，因此一个 `businessEntity` 可以包含多个 `businessService` 元素，所有这些元素都封装在 `businessServices`\
    \ 中。每个 `businessService` 条目都包含服务的描述，以及可选的所属所属的类别列表。`businessService` 的主子元素是 `bindingTemplates`，它提供了绑定到服务的技术信息。\n\
    \n```xml\n<businessServices>\n  <businessService serviceKey=\"2AB346C0-2282-43B0-756B-0003CC35CC1D\"\
    >\n    <name>Prices</name>\n    <description xml:lang=\"en\">Calculate product\
    \ prices</description>\n    <categoryBag>ntis-gov:naic</categoryBag>\n    <bindingTemplates>…</bindingTemplates>\n\
    \  </businessService>\n</businessServices>\n```\n**图 7。**\n\n*   **bindingTemplate**：每个\
    \ `bindingTemplates` 由一个或多个 `bindingTemplate` 元素组成。`bindingTemplate` 元素提供两种信息：\n\
    \    *   技术规范，例如用于与服务通信的协议。\n    *   访问点，即可以调用该服务的 URL。\n\n```xml\n<wsdl:portType\
    \ name=\"Operations\">\n  <wsdl:operation name=\"login\">\n    <wsdl:input message=\"\
    intf:loginRequest\" name=\"loginRequest\"/>\n    <wsdl:output message=\"intf:loginResponse\"\
    \ name=\"loginResponse\"/>\n  </wsdl:operation>\n</wsdl:portType>\n```\n**图 8。**\n\
    \n*   **tModel**：基本上，`tModel` 包含了 WSDL 文档地址。除了之外，`overviewDoc` 包含了服务。服务所属类别可以包含在\
    \ `categoryBag` 中。\n\n```xml\n<tModel businessKey=\"35AF7F00-1419-11D6-A0DC-000C0E00ACDD\"\
    \ authorizedName=\"0100002CAL\" operator=\"www-3.ibm.com/services/uddi\">\n  <name>Price\
    \ calculation</name>\n  <description xml:lang=\"en\">Calculate product prices</description>\n\
    \  <overviewDoc>\n    <description xml:lang=\"en\">Link to WSDL document</description>\n\
    \    <accessPoint>http://localhost:9080/login_ws/services/Operations</accessPoint>\n\
    \  </overviewDoc>\n  <categoryBag>\n    <keyedReference tModelKey=\"clacf26d-9672-4404-9d70-39b75e62ab4\"\
    \ keyName=\"uddi-org:types\" keyValue=\"wsdlSpec\" />\n  </categoryBag>\n</tModel>\n\
    ```\n**图 9。**\n\n可以看出 `businessEntity`、`businessService` 和 `tModel` 结构可以归类在 `categoryBag`\
    \ 指定列表中，结构所属的每个类别由子元素 `keyedReference` 定义。\n\n### 3.3.2. UDDI API\n\n为了让应用程序与\
    \ UDDI 注册表交互，后者应该以 SOAP Web 服务的形式暴露一系列函数。这些 Web 服务允许搜索操作并在注册表中发布其他 Web 服务。\n\n\
    根据所执行的操作类型，UDDI 函数被分为两类：查询函数和发布函数。图 10 显示了主要函数及其所属的类别。\n\n| 函数 | 类别 |\n| :---\
    \ | :--- |\n| find_business | Inquiry |\n| find_service | Inquiry |\n| find_binding\
    \ | Inquiry |\n| find_tModel | Inquiry |\n| get_businessDetail | Inquiry |\n|\
    \ get_serviceDetail | Inquiry |\n| get_bindingDetail | Inquiry |\n| get_tModelDetail\
    \ | Inquiry |\n| save_business | Publication |\n| save_service | Publication |\n\
    | save_binding | Publication |\n| save_tModel | Publication |\n| delete_business\
    \ | Publication |\n\n"
