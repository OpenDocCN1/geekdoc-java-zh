  trans: "\n\n在上述内容中我们可以看到 `body` 结构由一个根元素组成，通常称为 `service_nameResponse`，它包含一个持有返回值的子元素。与请求文档一样，响应正体中包含的元素也定义在应用程序的命名空间中。\n\
    \n### 3.1.2. SOAP 消息类型\n\n根据 Web 服务处理信息的方式，分为两种 SOAP 消息样式。\n\n#### 3.1.2.1. RPC\
    \ 消息\n\nRPC 消息基于一种名为**远程过程调用 (Remote Procedure Call, RPC)** 的交互类型，其中 Web 服务的请求\
    \ XML 文档代表对方法或过程调用以及相应的输入参数，而作为响应生成的 XML 文档则代表该方法的返回值。\n\n这是最简单且常见的 Web 服务类型，客户端和服务之间进行同步通信。\n\
    \n#### 3.1.2.2. 文档导型消息\n\n此类文档的 `body` 可以包含一个或多个子元素，根据其所代表的应用程序进行结构化。\n\n这些 XML\
    \ 文档完全由 Web 服务处理，这可能涉及对服务器不同内部方法的调用。处理此类文档的应用程序需要访问定义其结构和语法的架构（schema）。\n\n此类文档的一个示例可以用于处理订单的\
    \ Web 服务。在这种情况下，客户端向 Web 服务发送一个 XML 文档，其中包含购买的产品代码、银行详情和送货地址。一旦消息被解码，Web 服务就会开始执行各项任务，如检查客户端的银行详情、通知分销商等。最后，Web\
    \ 服务发送一个带有确认或拒绝购买订单的响应文档。\n\n### 3.1.3. 错误消息\n\n在处理 SOAP 请求时可能会发生错误，在这种情况下，应通过发送名为\
    \ SOAP 错误的特殊消息来通知客户端应用程序。\n\n此消息包含一个 `<fault>` 元素，通过一系列子元素来描述错误的特征，每个子元素都由 SOAP\
    \ 规范定义。\n\n以下是 `<fault>` 的子元素：\n\n- `faultcode`: 错误源。可以具有以下四个值之一：\n    - `mustUnderstand`:\
    \ 表示文档头中被标记为 `mustUnderstand` 的值无法被目标节点或某些中间节点解释。\n    - `versionmismatch`: 响应消息中指定的\
    \ SOAP 版本未被某些节点识别。\n    - `server`: 服务器在处理消息时发生了了错误。\n    - `client`: 由于客户端请求消息内部错误导致了错误。\n\
    - `faultstring`: 解释性错误消息。\n- `faultfactor`: 表示引起错误的角色。\n- `detail`: 特定于应用程序的错误信息。仅当错误发生在\
    \ `body` 而非 `header` 时，该元素存在。\n\n### 3.2 WSDL\n\nWSDL（Web 服务描述语言）是一种基于 XML 的语言，用于描述\
    \ Web 服务的接口。Web 服务提供者使用这种语言通过扩展名为 `.wsdl` 的 XML 文档来定义服务暴露的方法以及它们接收和返回的数据。\n\n\
    WSDL 文档包含以下关于 Web 服务的信息：\n\n- 服务提供的方法。\n- 每个方法的输入和输出参数。\n- 连接到服务应使用的协议及其 URL。\n\
    \n接下来的列表显示了一个名为 Operations 的示例 Web 服务的 WSDL 文档，它暴露了一个方法，通过通过 `user` 和 `password`\
    \ 执行验证用户凭据的过程：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<wsdl:definitions\
    \ targetNamespace=\"http://services\"\nxmlns:impl=\"http://services\" xmlns:intf=\"\
    http://services\"\nxmlns:wsdl=\"http://schemas.xmlsoap.org/wsdl/\"\nxmlns:wsdlsoap=\"\
    http://schemas.xmlsoap.org/wsdl/soap/\"\nxmlns:wsi=\"http://ws-i.org/profiles/basic/1.1/xsd\"\
    \nxmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n<wsdl:types>\n<schema targetNamespace=\"\
    http://services\"\nxmlns=\"http://www.w3.org/2001/XMLSchema\"\nxmlns:wsdl=\"http://schemas.xmlsoap.org/wsdl/\"\
    \nxmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n<wsdl:types>\n<targetNamespace=\"\
    http://services\"\n</schema>\n<schema targetNamespace=\"http://services\"\nxmlns=\"\
    http://www.w3.org/2001/XMLSchema\"\nxmlns:wsdl=\"http://schemas.xmlsoap.org/wsdl/\"\
    \nxmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n<wsdl:types>\n<targetNamespace=\"\
    http://services\"\n</schema>\n</wsdl:types>\n```\n*(注：源文件中提供的 XML 已被截断/不完整；根据指令保留了结构。)*\n\
    \n#### 3.2.1. WSDL 文档的结构\n\n每个 WSDL 文档由根元素 `definitions` 组成，其中声明了文档中使用的不同命名空间（图\
    \ 5）。\n\n为了完成服务的定义，*definitions* 中包含的其余子元素是 *types, message, portType, binding\
    \ and service*。\n\n#### 3.2.1.1. types\n\n此元素定义了服务将使用的数据类型，包括方法参数及其返回值。在定义 Web\
    \ 服务的数据类型时，使用了 XML 架构（XML Schema）：\n\n```xml\n<wsdl:types>\n<schema targetNamespace=\"\
    http://services\"\nxmlns=\"http://www.w3.org/2001/XMLSchema\"\nxmlns:wsdl=\"http://schemas.xmlsoap.org/wsdl/\"\
    \nxmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n...\n</schema>\n</wsdl:types>\n\
    ```\n\n#### 3.2.1.2. message\n\n每个 **message** 元素定义了 Web 服务与其客户端之间交换的信息消息，这些消息由\
    \ *types* 中定义的数据组成。事实上，每个消息都包含一个子元素 *part*，其中指定了它所包含的数据类型。\n\n```xml\n<wsdl:message\
    \ name=\"loginRequest\">\n<wsdl:part element=\"intf:login\" name=\"parameters\"\
    />\n</wsdl:message>\n\n<wsdl:message name=\"loginResponse\">\n</wsdl:message>\n\
    ```\n\n"
- fmt: "\n```xml\n<wsdl:part element=\"intf:loginResponse\" name=\"parameters\"/>\n\
    </wsdl:message>\n```\n\n### 3.2.1.3. portType\n\nThe `portType` element describes\
    \ the operations exposed by the Web service. In fact, each operation is defined\
    \ by the `operation` element and is associated with an input and an output message:\n\
    \n```xml\n<wsdl:portType name=\"Operations\">\n  <wsdl:operation name=\"login\"\
    >\n    <wsdl:input message=\"intf:loginRequest\" name=\"loginRequest\"/>\n   \
    \ <wsdl:output message=\"intf:loginResponse\" name=\"loginResponse\"/>\n  </wsdl:operation>\n\
    </wsdl:portType>\n```\n\n### 3.2.1.4. binding\n\nOnce the operations that the\
    \ Web service will perform have been defined, they should be bound to a specific\
    \ protocol. This is achieved by the `binding` element, in which we can specify\
    \ the type of transport (SOAP or JMS), the network access points for executing\
    \ a specific operation and the style (document or RPC):\n\n```xml\n<wsdl:binding\
    \ name=\"OperationsSoapBinding\" type=\"intf:Operations\">\n  <wsaw:UsingAddressing\
    \ wsdl:required=\"false\" xmlns:wsaw=\"http://www.w3.org/2006/05/addressing/wsdl\"\
    />\n  <wsdlsoap:binding style=\"document\" transport=\"http://schemas.xmlsoap.org/soap/http\"\
    />\n  <wsdl:operation name=\"login\">\n    <wsdlsoap:operation soapAction=\"login\"\
    />\n    <wsdl:input name=\"loginRequest\">\n      <wsdlsoap:body use=\"literal\"\
    />\n    </wsdl:input>\n    <wsdl:output name=\"loginResponse\">\n      <wsdlsoap:body\
    \ use=\"literal\"/>\n    </wsdl:output>\n  </wsdl:operation>\n</wsdl:binding>\n\
    ```\n\n### 3.2.1.5. service\n\nFinally, we need to specify the Web service’s address\
    \ or entry point within the `service` element. Within the `port` child element,\
    \ the address of each `binding` element is specified. In the case of SOAP, the\
    \ `location` attribute within the `address` element contains the actual address.\n\
    \n```xml\n<wsdl:service name=\"OperationsService\">\n  <wsdl:port binding=\"intf:OperationsSoapBinding\"\
    \ name=\"Operations\">\n    <wsdlsoap:address location=\"http://localhost:9080/login_ws/services/Operations\"\
    />\n  </wsdl:port>\n</wsdl:service>\n```\n\n### 3.3. UDDI\n\nThe purpose of the\
    \ UDDI (Universal Description Discovery and Integration project) specification\
    \ is to define the standard for publishing and locating a Web service in a services\
    \ registry compatible with UDDI.\n\nA UDDI registry is a kind of “Golden/Yellow\
    \ Pages” style database, which stores information pertinent to published Web services.\
    \ This means that two types of application can access this type of registry:\n\
    \n*   **Service providers**: Publish the services. UDDI provides mechanisms so\
    \ that providers can register their WSDL descriptions and other relevant information\
    \ for their Web services.\n*   **Service consumers**: Use the registry to locate\
    \ a service and to use it (service binding). UDDI supports service search mechanisms.\n\
    \nFor publishing, editing and searching, SOAP messages are used to access the\
    \ UDDI registry.\n\n### 3.3.1. UDDI schema\n\nIdentifies the type of XML data\
    \ structure that makes up a Web service’s registry entry. The UDDI XML schema\
    \ defines four basic data types that describe the information stored in the UDDI\
    \ registry. This data is represented by the following elements for all to see:\n\
    \n*   **businessEntity**: Describes information about an entity that provides\
    \ services. Among this information are the name of the entity, description, list\
    \ of services provided, categories and a list of identifiers that can be used\
    \ for searching (figure 6).\n\n```xml\n<businessEntity businessKey=\"35AF7F00-1419-11D6-A0DC-000C0E00ACDD\"\
    \ authorizedName=\"0100002CAL\" operator=\"www-3.ibm.com/services/uddi\">\n  <name>Shop</name>\n\
    \  <description xml:lang=\"en\">All kind of product sales</description>\n  <contacts>\n\
    \    <contact>\n      <personName>Jhon Cook</personName>\n      <phone>918890234</phone>\n\
    \    </contact>\n  </contacts>\n  <businessServices>\n    …\n  </businessServices>\n\
    </businessEntity>\n```\n**Figure. 6.**\n\n*   **businessService**: Identifies\
    \ a Web service provided by an entity. As an entity can provide more than one\
    \ Web service, a `businessEntity` can contain several `businessService` elements,\
    \ all of which are enclosed within `businessServices`. Each `businessService`\
    \ entry contains a description of the service and, optionally, a list of categories\
    \ to which the service belongs. The main child element of `businessService` is\
    \ `bindingTemplates`, which provides the technical information for binding to\
    \ the service.\n\n```xml\n<businessServices>\n  <businessService serviceKey=\"\
    2AB346C0-2282-43B0-756B-0003CC35CC1D\">\n    <name>Prices</name>\n    <description\
    \ xml:lang=\"en\">Calculate product prices</description>\n    <categoryBag>ntis-gov:naic</categoryBag>\n\
    \    <bindingTemplates>…</bindingTemplates>\n  </businessService>\n</businessServices>\n\
    ```\n**Figure. 7.**\n\n*   **bindingTemplate**: Each `bindingTemplates` is made\
    \ up of one or several `bindingTemplate` elements. The `bindingTemplate` element\
    \ provides two types of information:\n    *   Technical specifications, like protocols\
    \ used to communicate with the service.\n    *   Access point, which is the URL\
    \ at which the service can be invoked.\n\n```xml\n<wsdl:portType name=\"Operations\"\
    >\n  <wsdl:operation name=\"login\">\n    <wsdl:input message=\"intf:loginRequest\"\
    \ name=\"loginRequest\"/>\n    <wsdl:output message=\"intf:loginResponse\" name=\"\
    loginResponse\"/>\n  </wsdl:operation>\n</wsdl:portType>\n```\n**Figure. 8.**\n\
    \n*   **tModel**: Basically, `tModel` includes the WSDL document address. Apart\
    \ from this, `overviewDoc` contains the service. categories to which the service\
    \ belongs can be included in `categoryBag`.\n\n```xml\n<tModel businessKey=\"\
    35AF7F00-1419-11D6-A0DC-000C0E00ACDD\" authorizedName=\"0100002CAL\" operator=\"\
    www-3.ibm.com/services/uddi\">\n  <name>Price calculation</name>\n  <description\
    \ xml:lang=\"en\">Calculate product prices</description>\n  <overviewDoc>\n  \
    \  <description xml:lang=\"en\">Link to WSDL document</description>\n    <accessPoint>http://localhost:9080/login_ws/services/Operations</accessPoint>\n\
    \  </overviewDoc>\n  <categoryBag>\n    <keyedReference tModelKey=\"clacf26d-9672-4404-9d70-39b75e62ab4\"\
    \ keyName=\"uddi-org:types\" keyValue=\"wsdlSpec\" />\n  </categoryBag>\n</tModel>\n\
    ```\n**Figure. 9.**\n\nAs you can see the `businessEntity`, `businessService`\
    \ and `tModel` structures can be classified in a list of categories specified\
    \ in `categoryBag`, each category to which the structure belongs is defined in\
    \ the child element `keyedReference`.\n\n### 3.3.2. UDDI API\n\nFor applications\
    \ to interact with a UDDI registry, the latter should expose a series of functions\
    \ in the form of SOAP Web services. These Web services allow search operations\
    \ and the publication of other Web services within the registry.\n\nDepending\
    \ on the type of operation carried out, UDDI functions are grouped into two categories:\
    \ Inquiry functions and Publication functions. Figure 10 shows the main functions\
    \ and the category to which they belong.\n\n| Function | Category |\n| :--- |\
    \ :--- |\n| find_business | Inquiry |\n| find_service | Inquiry |\n| find_binding\
    \ | Inquiry |\n| find_tModel | Inquiry |\n| get_businessDetail | Inquiry |\n|\
    \ get_serviceDetail | Inquiry |\n| get_bindingDetail | Inquiry |\n| get_tModelDetail\
    \ | Inquiry |\n| save_business | Publication |\n| save_service | Publication |\n\
    | save_binding | Publication |\n| save_tModel | Publication |\n| delete_business\
    \ | Publication |\n"
