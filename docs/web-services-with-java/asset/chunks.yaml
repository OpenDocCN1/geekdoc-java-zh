  trans: "\n\n除了 Web 服务自身的参数外，该方法还接收一个实现了 `AsyncHandler` 接口的对象。调用此方法返回一个 `Future`\
    \ 对象，允许我们使用 `isDone()` 方法检查结果是否已返回给客户端。\n\n例如，以下程序使用 `CalcWS` Web 服务计算 7 的阶乘，在计算进行期间，客户端程序每隔十分之一秒显示一次“waiting（等待中）”消息：\n\
    \n```java\npackage client;\n\nimport javax.xml.ws.*;\nimport proxy.*;\nimport\
    \ java.uti.concurrent.*;\n\npublic class Test {\n    public static void main(String[]\
    \ args) {\n        try {\n            CalcWSService service = new CalcWSService();\n\
    \            CalcWS port = service.getCalcWSPort();\n            int num = 7;\n\
    \            AsyncHandler<FactorialResponse> asyncHandler =\n                new\
    \ AsyncHandler<FactorialResponse>() {\n                    public void handleResponse(Response<FactorialResponse>\
    \ response) {\n                        try {\n                            System.out.println(\"\
    Result = \"+\n                            response.get().getReturn());\n     \
    \                   } catch(Exception ex) {}\n                    }\n        \
    \        };\n            Future<? extends Object> result =\n                port.factorialAsync(num,\
    \ asyncHandler);\n            while(!result.isDone()) {\n                System.out.println(\"\
    waiting\");\n                Thread.sleep(100);\n            }\n        } catch\
    \ (Exception ex) { }\n    }\n}\n```\n\n# 5. 使用 GOOGLE 搜索 Web 服务\n\nGoogle 提供了多种\
    \ Web 服务，开发者可以使用这些服务将其强大的搜索引擎集成到自己的应用程序中。\n\n2003 年，Google 发布了他们的第一个 Web 服务——经典的\
    \ Google 搜索。该 Web 服务暴露了一个定义其功能的 WSDL 接口，但从 2006 年起该接口已过时，从 2009 年 3 月起 Google\
    \ 不再支持该 Web 服务。\n\n如今，Google 提供的各种 Web 服务应该通过 Google 自己创建的特殊 API 进行访问，从而不再需要依赖许多开发环境创建的代理对象。\n\
    \n以下是访问 Google 服务的一些主要 API：\n\n*   **AJAX API**：一组 JavaScript 对象，允许从任何  访问经典的\
    \ Google 搜索服务，并集成了 AJAX 功能。\n*   **Google maps API**：让您能够在 网站中集成交互式地图。\n*   **Google\
    \ Web ToolKit**：用于在任何应用程序中集成搜索服务的 Java API。\n\n作为使用这些 Web 服务的示例，我们将分析 Google AJAX\
    \ API，通过它，我们可以在自己的网页中实现一个 Google 搜索引擎。\n\n## 5.1. 使用 AJAX API\n\n为了使用此服务，您需要从以下链接免费获取许可密钥：`http://code.google.com/intl/es/apis/ajaxsearch/signup.html`\n\
    \n一旦拥有此密钥，就可以很容易地访问 Google 的 JavaScript 对象，我们将使用这些对象来实现自己的搜索页面。\n\n### 5.1.1.\
    \ 使用 Google 搜索控件\n\n实现搜索页面的简单方法是包含 Google 自己的搜索控件。第一步工作是在页面头部中添加以下引用 Google AJAX\
    \ API 加载器的脚本：\n\n```html\n<script type=\"text/javascript\" src=\"http://www.google.com/jsapi?key=mykey\"\
    ></script>\n```\n\n在这里，`mykey` 代表 Google 在上述 URL 中提供的密钥。该密钥可以用于应用程序中所有想要使用 AJAX\
    \ API 的页面。\n\n接下来，我们使用 `google` 对象的 `load` 方法来加载搜索 API：\n\n```html\n<script type=\"\
    text/javascript\">\ngoogle.load(\"search\", \"1\");\n</script>\n```\n\n加载器（实际上是\
    \ `google` 对象）可以加载多个不同的 API。通过将字符串“search”作为第一个参数显然加载了搜索 API，而如果我们想加载 Google Maps\
    \ API，则在这里输入“maps”。\n\n接下来，我们将创建一个 `SearchControl` 实例，该对象代表 Google 搜索控件，即带有搜索按钮的文本字段：\n\
    \n```javascript\nvar searchControl = new google.search.SearchControl();\n```\n\
    \n为了执行搜索，控件需要知道在哪里进行搜索，例如是本地搜索、Web 搜索、搜索新闻组等。要定义您想在哪里进行搜索，您必须实例化相关的搜索对象并使用 `addSearcher()`\
    \ 方法将它们添加到搜索集合中。例如，要执行 Web 搜索，请包含以下指令：\n\n```javascript\nsearchControl.addSearcher(new\
    \ google.search.WebSearch());\n```\n\n最后，剩下的就是指定我们想在哪里显示 Google 搜索控件。这是一个 `<div>`\
    \ 元素，除了控件外，搜索结果也将显示在这里。例如，如果 `<div>` 元素的 id 为 `search`，则应包含以下指令：\n\n```javascript\n\
    searchControl.draw(document.getElementById(\"search\"));\n```\n\n这就是增强我们的页面以搜索控件所需的所有内容，该控件利用\
    \ Google 的 Web 服务，通过 AJAX 技术在同一页面显示搜索结果。以下代码用于图 32 中的 .html 页面，该页面包含了 Google 的搜索控件：\n\
    \n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\" \"http://www.w3.org/TR/xhtml1/DTD\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<meta http-equiv=\"\
    content-type\" content=\"text/html; charset=utf-8\"/>\n<title>Hello World - Search\
    \ API Sample</title>\n<style type=\"text/css\">#search { width: 400px; }</style>\n\
    <script src=\"http://www.google.com/jsapi?key=mykey\"></script>\n<script type=\"\
    text/javascript\">\ngoogle.load('search', '1');\nfunction OnLoad() {\n    var\
    \ searchControl = new google.search.SearchControl();\n    searchControl.addSearcher(new\
    \ google.search.WebSearch());\n    searchControl.draw(document.getElementById(\"\
    search\"));\n}\n</script>\n</head>\n<body onload=\"OnLoad()\">\n<center><h1>Using\
    \ the search control</h1></center>\n<br />\n<div id=\"search\">Loading</div>\n\
    </body>\n</html>\n```\n\n###### 5.1.2. 个性化搜索控件\n\n如果我们想使用自己的搜索控件而不是 Google 的，我们需要在\
    \ JavaScript 代码中包含与执行搜索所执行的操作相同的指令。为了执行 Web 搜索，我们需要一个 `google.search.WebSearch`\
    \ 类的实例，其 `execute()` 方法使用提供的字符串在 Web 上执行搜索。\n\n由于 `execute()` 是异步执行的，我们应该使用 `WebSearch`\
    \ 的 `setSearchCompleteCallback()` 方法指定回调函数，在浏览器接收响应后进行处理。使用 `WebSearch` 的 `results()`\
    \ 方法访问响应数据，它包含一个 `SearchResult` 类型的结果数组。`SearchResult` 暴露了一系列属性如 `title` 或 `url`，分别为我们提供找到的页面标题及其\
    \ URL。\n\n以下代码用于图 33 中的页面，该页面实现了一个使用简单 HTML 控件与用户交互的个性化搜索控件：\n\n```html\n<!DOCTYPE\
    \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\" \"http://www.w3.org/TR/xhtml1/DTD\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<meta http-equiv=\"\
    content-type\" content=\"text/html; charset=utf-8\"/>\n<title>Search API Sample</title>\n\
    <style type=\"text/css\">#searchcontrol { width: 400px; }</style>\n<script src=\"\
    http://www.google.com/jsapi?key=mykey\"></script>\n<script type=\"text/javascript\"\
    >\ngoogle.load('search', '1');\nvar searchControl;\nfunction search() {\n    searchControl\
    \ = new google.search.WebSearch();\n    searchControl.setSearchCompleteCallback(this,\
    \ process);\n}\nfunction process(response) {\n    var results = searchControl.results();\n\
    \    for (var i = 0; i < results.length; i++) {\n        document.write(results[i].title\
    \ + \" - \" + results[i].url + \"<br>\");\n    }\n}\n</script>\n</head>\n<body>\n\
    <input type=\"text\" id=\"searchtext\" />\n<input type=\"button\" value=\"search\"\
    \ onclick=\"search()\" />\n<div id=\"searchcontrol\"></div>\n</body>\n</html>\n\
    ```\n\n"
