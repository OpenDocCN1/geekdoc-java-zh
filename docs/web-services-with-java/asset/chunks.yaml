    \ SOAP messages with the appropriate content within the body. For example, to\
    \ find a company called “Shop” you would have to include the XML block, shown\
    \ in figure 11, within the `body`.\n\n```xml\n<find_business generic=”2.0” xmlns=”urn:uddi-org:api_v2\"\
