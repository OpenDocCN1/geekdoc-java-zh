    \n# 4. IMPLEMENT APPLICATIONS BASED ON WEB SERVICES WITH JAVA / JAVA EE\n\nAs\
    \ mentioned earlier, the Java EE platform provides an API that facilitates the\
    \ construction of applications based on Web services, known as JAX-RPC. However,\
    \ the majority of recent development environments contain assistants that greatly\
    \ simplify the job of building a Web service, reducing the process to simply that\
    \ of implementing the application logic layer.\n\nThis is the case for NetBeans.\
    \ Using this IDE the programmer only needs to take care of implementing the EJB\
    \ or class with the required business methods, leaving NetBeans to dynamically\
    \ generate both the XML adaptor and the WSDL document that describe the interface.\n\
    \n## 4.1. CREATION AND DEPLOYMENT OF A WEB SERVICE USING NETBEANS\n\nWith the\
    \ help of NetBeans we can create and deploy a Web service in an application server.\
    \ How we go about doing this depends on what we already have or not, giving us\
    \ three starting points:\n\n- **Creating a Web service from scratch**: Doesn’t\
    \ use any existing application logic nor any type of specification and the Web\
    \ service is created from scratch.\n- **Creating a Web service from an existing\
    \ EJB**: The application logic is already implemented in an EJB and we want to\
    \ expose it as a Web service.\n- **Creating a Web service from a WSDL document**.\
    \ The description of the methods that the Web service should expose are already\
    \ defined in a WSDL interface.\n\n### 4.1.1. Creating a Web service from scratch\n\
    \nIn order to explain the process of creating a Web service with NetBeans, we\
    \ are going to develop a simple example Web service called `CalcWS`, which will\
    \ expose a method called `factorial`, whose function is to calculate the factorial\
    \ of a number passed as a parameter.\n\nFirst of all, as all Web services are\
    \ Web applications, we will create a Web Application type project that we will\
    \ call `ExampleProyectWS` (figure 13).\n\n## Figure. 13.\n\n![](index-23_1.jpg)\n\
    \nFor deployment purposes, we could use either Tomcat or GlassFish as application\
    \ servers.\n\nOnce the project is created, using the mouse, right-click within\
    \ the Project window and choose `New -> Web Service` from the pop-up menu. The\
    \ dialog box shown in figure 14 will appear.\n\n## Figure. 14.\n\nIn this dialog\
    \ box we should enter the Web service name and the package where it will be located,\
    \ also choosing whether to create the Web service from scratch (the default) or\
    \ from an existing session bean EJB.\n\nSupposing we create a Web service from\
    \ scratch, on clicking “Finish` we will see the `CalcWS` class (figure 15) in\
    \ the NetBeans editor. Here we implement the methods that we want to expose in\
    \ the Web service.\n\n```java\npackage services;\n\nimport javax.jws.WebService;\n\
    \n// Web Service class annotation\n@WebService()\npublic class CalcWS {\n}\n```\n\
    \n## Figure. 15.\n\n![](index-24_1.jpg) \n![](index-24_2.jpg)\n\nAs we can see,\
    \ the implementation class with its service methods is a normal Java class, with\
    \ the difference being that it has to be declared with the `@WebService` annotation\
    \ as defined by the `javax.jws.WebService` package. Using this annotation, the\
    \ runtime environment generates everything required so that the class methods\
    \ are exposed as Web service methods.\n\nJust at the top of the editor window\
    \ there is a button called `Design` that allows you to switch to the class Design\
    \ view (figure 16).\n\n## Figure. 16.\n\nUsing the button `Add Operation` we can\
    \ add the service’s methods graphically, entering the method names, parameters\
    \ and return types (figure 17).\n\n## Figure. 17.\n\n![](index-25_1.jpg)\n\nOn\
    \ clicking the OK button, returning to our class source view, we can see the declaration\
    \ of the factorial method, where we can confirm that both the method and parameters\
    \ have been labeled with `@WebMethod` and `@WebParam`.\n\n```java\npackage services;\n\
    \nimport javax.jws.WebMethod;\nimport javax.jws.WebParam;\nimport javax.jws.WebService;\n\
    \n@WebService()\npublic class CalculWS {\n    @WebMethod(operationName = \"factorial\"\
    )\n    public double factorial(@WebParam(name = \"num\") int num) {\n        double\
    \ result=1.0;\n        for(int i=1;i<=num;i++){\n            result*=i;\n    \
    \    }\n        return result;\n    }\n}\n```\n\nThis is all that is required\
    \ to implement a Web service with NetBeans. Next we proceed with the deployment\
    \ of the Web application in the application server using the `Deploy` pop-up menu.\
    \ Once the application is deployed, the Web service is ready to be used by client\
    \ applications. From NetBeans itself we can test that the Web service works. To\
    \ do this, inside the application’s Web service folder, we right-click on our\
    \ Web service and select `Test Web Service` from the pop-up menu (figure 18).\n\
    \nTo test the Web service, NetBeans opens an instance of a Web browser and launches\
    \ a request from this to the Web service, including the `tester` parameter in\
    \ the URL. Given this parameter, the application knows it’s a request from a browser\
    \ and generates a test page that allows you to choose the method to be executed\
    \ and input its parameters (figure 19).\n\n## Figure. 18.\n\n![](index-26_1.jpg)\n\
    ![](index-26_2.jpg)\n\n## Figure. 19.\n\nOn executing the method, the response\
    \ comes back in the form of a page containing both the return value and the SOAP\
    \ messages exchanged between the test page and the Web service (figure 20).\n\n\
    ## Figure. 20.\n\n# EXERCISE 1\n\nIn this exercise we are going to develop a Web\
    \ service that validates a user against a database, a Web service that could be\
    \ reutilized in many other applications that need to do the same.\n\nTo begin,\
    \ once we have created the Web application where the Web service will reside,\
    \ we will create a class encompassing the application’s data access logic. The\
    \ source code for this class, which we will call `Operations`, is shown below:\n\
    \n```java\npackage model;\n\nimport java.sql.*;\n\npublic class Operations {\n\
    \    //se establecen unos valores por defecto\n    //para la conexión con la BD\n\
    \    private String driver=\"com.mysql.jdbc.Driver\";\n    private String sCon=\"\
    jdbc:mysql://localhost:3306/books\";\n    private String user=\"root\";\n    private\
    \ String pwd=\"root\";\n\n    public Operations(){}\n\n    public Operations(String\
    \ driver, String sCon,\n    String user, String pwd){\n        this.driver=driver;\n\
    \        this.sCon=sCon;\n        this.user=user;\n        this.pwd=pwd;\n   \
    \ }\n\n    private Connection getConnection() throws SQLException{\n        Connection\
    \ cn=null;\n        try{\n            Class.forName(driver);\n            cn=DriverManager.getConnection(sCon,\
    \ user, pwd);\n        }\n        catch (ClassNotFoundException e) {\n       \
    \     throw new SQLException(e);\n        }\n        return cn;\n    }\n}\n```\n"
