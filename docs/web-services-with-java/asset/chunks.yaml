    ## INTRODUCTION


    When we think of a Web application, the first thing that springs to mind is a
    program that


    executes in an application server in response to a request sent from a browser,
    and whose


    ultimate aim is to create an HTML or XHTML page with information obtained from
    a data


    source, that is then delivered back to the client’s browser in the HTTP response.


    Despite being an accurate interpretation of what a Web application is, it’s also
    a


    somewhat limited model in that it restricts the only purpose of the response generated
    by the


    application to that of displaying information on screen.


    Web services represent a new kind of Web application, whose purpose isn’t to deliver


    HTML/XHTML pages to a screen, but to offer a service to other applications connected
    to the


    same network, providing these with a series of functions that carry out common
    tasks. This


    means that the response data generated by the Web service doesn’t adhere to any
    specific


    format or presentation language, but instead to an all-purpose “neutral” language.


    This new concept of service-oriented applications that can be consumed by other


    programs (or even other services), expands the capabilities of Web-based development
    to allow


    such wide-ranging possibilities from distributed task automation to business applications


    integration.


    In this unit we will analyze in detail the working principles and purpose of a
    Web service,


    as well as the different technologies and standards in which its architecture
    is based. From a


    practical point of view, we will study how to implement applications based on
    Web services


    using Java / Java EE.


