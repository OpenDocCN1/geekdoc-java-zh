    \ API] (19)\n- **4. 使用 JAVA / JAVA EE 实现基于 Web 服务的应用程序** (22)\n    - [4.1. 使用\
    \ NetBeans 创建和部署 Web 服务] (22)\n        - [4.1.1. 从零开始创建 Web 服务] (22)\n       \
    \     - [练习 1] (27)\n            - [4.1.1.1. 复杂返回类型] (29)\n        - [4.1.2. 从\
    \ EJB 创建 Web 服务] (31)\n        - [4.1.3. 从 WSDL 文档创建 Web 服务] (33)\n    - [4.2.\
    \ 开发 Web 服务客户端应用程序] (34)\n        - [4.2.1. 代理对象] (34)\n        - [4.2.2. 使用 NetBeans\
    \ 创建客户端应用] (35)\n        - [练习 2] (39)\n        - [练习 3] (41)\n    - [4.3. 异步调用\
    \ Web 服务方法] (43)\n        - [4.3.1. 代理对象配置] (43)\n        - [4.3.2. 异步调用方法] (45)\n\
    - **5. 使用 Google Search Web 服务** (47)\n    - [5.1. 使用 AJAX API] (47)\n       \
    \ - [5.1.1. 使用 Google 搜索控制] (47)\n        - [5.1.2. 个性化搜索控制] (50)\n\n## 1. 引言\n\
    \n当我们想到 Web 应用程序时，脑海中浮出的第一个通常是运行在应用程序服务器上的程序。该程序响应来自浏览器发送的请求，其最终目标是根据数据源获取的信息创建一个\
    \ HTML 或 XHTML 页面，然后通过 HTTP 响应将其送回客户端浏览器。\n\n尽管这是对 Web 应用程序的准确诠释，但它也是一个某种局限的模型，因为它将应用程序生成的响应的唯一目的限制在了屏幕上显示信息上。\n\
    \nWeb 服务代表了一种新类型的 Web 应用程序，其目的不是向屏幕传递 HTML/XHTML 页面，而是为连接到同一网络的其他应用程序提供服务，为这些程序提供执行常见任务的一系列功能。这意味着\
    \ Web 服务生成的响应数据并不遵循任何特定的格式或表示语言，而是遵循一种通用的“中立”语言。\n\n这种可以被其他程序（甚至其他服务）消费的面向服务型应用程序的新概念，扩展了基于\
    \ Web 的开发能力，使其能够实现从分布式任务自动化到业务应用程序集成的各种可能性。\n\n在本单元中，我们将详细分析 Web 服务的内部工作原理和目的，以及其架构所基于的不同技术和标准。从实践角度来看，我们将学习如何使用\
    \ Java / Java EE 实现基于 Web 服务的应用程序。\n\n"
- fmt: "\n# Service-oriented architecture (SOA) is a set of design principles for\
    \ building applications by integrating existing software modules (services).\n\
    \nThe result is a distributed application that integrates diverse programs, each\
    \ one with a different implementation responsible for adding a different feature\
    \ to the application.\n\nFor example, imagine you want to develop a banking application\
    \ that handles credit approvals using SOA architecture. We could have a module\
    \ or service responsible for receiving the user’s application, another which does\
    \ a credit check based on their personal details, another which adds their application\
    \ to an internal database, etc.\n\n**Figure. 1.**\n\nEssentially, building the\
    \ application simply entails organizing how to process calls to the services.\n\
    \n## 2.1 SERVICES\n\nA service can be defined as an application function, packaged\
    \ as a reusable autonomous component, that can then be used when building other\
    \ applications. In order for a service to be used in building SOA applications,\
    \ it must comply with the following requirements:\n\n- Well-defined interfaces:\
    \ SOA services expose their functionality through interfaces that describe the\
    \ operations provided by the service as well as the information that they should\
    \ receive and return, hiding the service implementation details.\n- Technology\
    \ independence: SOA services must be able to be consumed by any client application,\
    \ independently of the languages and technologies with which each are implemented\
    \ and of the platform on which they are running.\n\n![](index-7_1.jpg)\n![](index-7_2.jpg)\n\
    - Communication by messages: Clients communicate with the service by interchanging\
    \ messages containing information whose format should be described in the service’s\
    \ interface.\n\n## 2.2 WEB SERVICE\n\nA Web service is a special type of SOA service\
    \ deployed on an application server that client applications connect to through\
    \ the Web using XML and HTTP standards. More specifically, a Web service can be\
    \ defined as a software module that exposes its functionality on the Web in the\
    \ form of methods that client applications can call by sending XML documents in\
    \ an HTTP request (figure 2).\n\n**Figure. 2.**\n\nThe data generated by the Web\
    \ service, resulting from the execution of its methods, is then delivered to the\
    \ client in the HTTP response, also in XML format. The capability of Web services\
    \ to communicate with client applications using XML allows them to be completely\
    \ independent of each other. This means that a Web service could be implemented,\
    \ for example, in Java, whilst the application could be in C or VB. In this case\
    \ the XML document, generated by the Java service, could be interpreted correctly\
    \ by the C/VB application and vice versa.\n\n## 2.3 STRUCTURE OF A WEB SERVICE\n\
    \nFrom a technical point of view, a Web service is just a Web application deployed\
    \ on an Application Server.\n\n**Figure. 3.**\n\nThat application consists of\
    \ two well-defined layers, as shown in figure 3:\n\n- **Application Logic:** Contains\
    \ the implementation, in whatever language you choose, of the methods exposed\
    \ by the Web service. In the case of a Java/Java EE application this layer would\
    \ be implemented by `EJBs` or standard classes.\n- **XML Adaptor:** Responsible\
    \ for interpreting XML documents, received in the HTTP request, using the service’s\
    \ method call information. Once the documents have been deciphered and from these\
    \ the method name and arguments have been extracted for the service we want to\
    \ invoke, from this component the appropriate calls are made to the Application\
    \ Layer objects. Therefore, from the data returned by these objects the XML adaptor\
    \ constructs the XML response document that will be sent to the client in the\
    \ body of the HTTP message.\n\nThis layer would be implemented by `Servlets` and\
    \ `JSPs` in a Java/Java EE application. Although, to help build them, Java EE\
    \ includes an API for XML known as `JAX-RPC`, with which it is possible to create\
    \ simple mappings between Java objects and XML documents and vice versa, facilitating\
    \ their manipulation.\n\n![](index-9_1.jpg)\n\n## 3. WEB SERVICES ARCHITECTURE\
    \ STANDARDS\n\nApart from XML and HTTP that form the basic standards from which\
    \ all Web services architecture is derived, it was necessary for the international\
    \ community, governed by the W3C organization, to define additional standards\
    \ that address the issues that arise when implementing applications based on this\
    \ schema. For example, how to structure the XML documents that are used when interacting\
    \ with a Web service, or how a service should define its interface.\n\nThese standards\
    \ are:\n\n- SOAP\n- WSDL\n- UDDI\n\n## 3.1 SOAP\n\nSOAP, or the Simple Object\
    \ Access Protocol, is a protocol specification for the transport of XML messages\
    \ in computer networks. SOAP defines the format that XML documents should have\
    \ in order to Exchange information between Web services and client applications,\
    \ i.e. it establishes the structure of both the XML document used to call a service’s\
    \ methods and the one generated by the service containing the response (figure\
    \ 4).\n\n**Figure. 4.**\n\nAlthough SOAP is independent of the network transport\
    \ protocols used, the current specification (SOAP 1.2) concentrates on the use\
    \ of HTTP in a request/response scenario and JMS for the asynchronous invocation\
    \ of the service’s methods.\n\n### 3.1.1 SOAP messages\n\nThe request and response\
    \ XML documents defined by the SOAP standard are also known as SOAP messages.\
    \ A SOAP message consists of two parts:\n\n- **Header:** Includes optional control\
    \ information for intermediate applications.\n- **Body:** Contains the message\
    \ itself, i.e. the information to be transmitted from one application to another.\n\
    \nThe structure of an XML SOAP document is as follows:\n\n```xml\n<Envelope>\n\
    \  <Header>\n    <!-- control information-->\n  </Header>\n  <Body>\n    <!--message-->\n\
    \  </Body>\n</Envelope>\n```\n\nFrom this we can see that there are three main\
    \ elements in the namespace: `http://schemas.xmlsoap.org/envelope/`\n\n- **Envelope:**\
    \ Represents the root element of all SOAP documents.\n- **Header:** An optional\
    \ element, which includes header parameters.\n- **Body:** The compulsory `body`\
    \ element contains the contents of the message. This includes elements specific\
    \ to the actual application that describe the information exchanged between the\
    \ Web service and the client application.\n\nApart from these application elements,\
    \ the SOAP specification also allows for a `fault` element within the `body` that\
    \ is used for error management.\n\nThe following XML is an example of a request\
    \ SOAP document used to invoke a function called `login` provided by a Web service,\
    \ to which user credentials (user and password) are passed as parameters.\n\n\
    ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<soapenv:Envelope xmlns:soapenv=\"\
    http://schemas.xmlsoap.org/envelope/\" xmlns:serv=\"http://www.myservice.com/\"\
    >\n   <soapenv:Header>\n   </soapenv:Header>\n   <soapenv:Body>\n      <serv:login>\n\
    \         <serv:user>teacher</serv:user>\n         <serv:password>admin</serv:password>\n\
    \      </serv:login>\n   </soapenv:Body>\n</soapenv:Envelope>\n```\n\nAs you can\
    \ see, the `login` element included within the `body` represents the method to\
    \ be invoked, within which the values of the method’s parameters appear within\
    \ their respective parameter element. All these elements are defined in a specific\
    \ namespace belonging to the application.\n\nOnce the method has been invoked,\
    \ the following listing shows a possible SOAP response XML document generated\
    \ by the validation Web service:\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/envelope/\"\
    \ xmlns=\"http://www.myservice.com/\">\n   <soapenv:Header>\n   </soapenv:Header>\n\
    \   <soapenv:Body>\n      <loginResponse>\n         <result>true</result>\n  \
    \    </loginResponse>\n   </soapenv:Body>\n</soapenv:Envelope>\n```\n"
