    \ J. Martín & Ramón Egido\n\n## 目录\n\n- **1. 引言** (5)\n- **2. SOA 架构** (6)\n \
    \   - [2.1. 服务] (6)\n    - [2.2. Web 服务] (7)\n    - [2.3. Web 服务的结构] (7)\n- **3.\
    \ Web 服务架构标准** (9)\n    - [3.1. SOAP] (9)\n        - [3.1.1. SOAP 消息] (9)\n  \
    \      - [3.1.2. SOAP 消息类型] (11)\n            - [3.1.2.1. RPC 消息] (11)\n     \
    \       - [3.1.2.2. 文档型消息] (12)\n        - [3.1.3. 错误消息] (12)\n    - [3.2. WSDL]\
    \ (12)\n        - [3.2.1. WSDL 文档结构] (15)\n            - [3.2.1.1. types] (15)\n\
