  trans: "\n\n# 面向服务的架构（SOA）是一组通过集成现有软件模块（服务）来构建应用程序的设计原则。\n\n其结果是一个分布式应用程序，该程序集成了不同的程序，每个程序都有不同的实现方式，负责为应用程序添加不同的功能。\n\
    \n例如，假设你想要开发一个使用 SOA 架构来处理信贷审批的银行应用程序。我们可以有一个负责接收用户申请的模块或服务，另一个根据其个人详情进行信誉检查，另一个将他们的申请添加到内部数据库中等等。\n\
    \n**图 1。**\n\n从本质上说，构建应用程序简单地涉及组织如何处理对服务的调用。\n\n## 2.1 服务\n\n服务可以被定义为应用程序函数，它被封装成一个可重用的自治组件，该组件可以在构建其他应用程序时使用。为了让服务能够用于构建\
    \ SOA 应用程序，它必须满足以下要求：\n\n- 良好的定义接口：SOA 服务通过接口暴露其功能，接口描述了服务提供的操作以及它们应该接收和返回的信息，同时隐藏了服务的实现细节。\n\
    - 技术独立性：SOA 服务必须能够被任何客户端应用程序使用，而不受实现每个程序时使用的语言、技术以及它们运行平台的影响。\n\n![](img/index-7_1.jpg)\n\
    ![](img/index-7_2.jpg)\n- 消息通信：客户端通过交换包含信息的的消息与服务通信，这些信息的格式应该在服务的接口中描述。\n\n##\
    \ 2.2 Web 服务\n\nWeb 服务是一种部署在应用程序服务器上的特殊 SOA 服务，客户端应用程序通过 Web 使用 XML 和 HTTP 标准连接到它。具体来说，Web\
    \ 服务可以被定义为软件模块，它以方法的形式在 Web 上暴露其功能，客户端应用程序可以通过在 HTTP 请求中发送 XML 文档来调用这些方法（图 2）。\n\
    \n**图 2。**\n\nWeb 服务执行其方法后产生的数据将通过 HTTP 响应传递给客户端，同样采用 XML 格式。Web 服务使用 XML 与客户端应用程序通信的能力允许它们完全相互独立。这意味着\
    \ Web 服务可以用 Java 实现，而应用程序可以用 C 或 VB 语言编写。在这种情况下，由 Java 服务生成的 XML 文档可以被 C/VB 应用程序正确解释，反之亦然。\n\
    \n## 2.3 Web 服务的结构\n\n从技术角度来看，Web 服务只是部署在应用程序服务器上的 Web 应用程序。\n\n**图 3。**\n\n该应用程序由两个定义良好的层组成，如图\
    \ 3 所示：\n\n- **应用逻辑：** 包含用你选择的任何语言实现的 Web 服务所暴露的方法。在 Java/Java EE 应用程序的情况下，此层由\
    \ `EJBs` 或标准类实现。\n- **XML 适配器：** 负责使用服务的方法调用信息解释接收到的 HTTP 请求中的 XML 文档。一旦文档被解密，并从中提取出我们想要调用的服务的方法名和参数，该组件将对应用层对象执行相应的调用。因此，根据这些对象返回的数据，XML\
    \ 适配器构建出 XML 响应文档，该文档将通过 HTTP 消息的正文发送给客户端。\n\n在 Java/Java EE 应用程序中，此层将由 `Servlets`\
    \ 和 `JSPs` 实现。尽管，为了帮助构建它们，Java EE 包含一个名为 `JAX-RPC` 的 XML API，通过它可以在 Java 对象和 XML\
    \ 文档之间以及反之创建简单的映射，便于对其进行操作。\n\n![](img/index-9_1.jpg)\n\n## 3. Web 服务架构标准\n\n\
    除了构成所有 Web 服务架构的基础标准 XML 和 HTTP 之外，由 W3C 组织管理的国际社区也有必要定义额外的标准，以解决基于此类模式实现应用程序时出现的问题。例如，在与\
    \ Web 服务交互时使用的 XML 文档如何结构，或者服务应该如何定义其接口。\n\n这些标准是：\n\n- SOAP\n- WSDL\n- UDDI\n\
    \n## 3.1 SOAP\n\nSOAP（简单对象访问协议）是一种用于在计算机网络中传输 XML 消息的协议规范。SOAP 定义了 XML 文档应该具备的格式，以便在\
    \ Web 服务和客户端应用程序之间交换信息，即它建立了用于调用服务方法的 XML 文档结构，以及由服务生成的包含响应的文档结构（图 4）。\n\n**图\
    \ 4。**\n\n尽管 SOAP 独立于使用的网络传输协议，但当前的规范（SOAP 1.2）专注于在请求/响应场景中使用 HTTP，以及用于异步调用服务方法的\
    \ JMS。\n\n### 3.1.1 SOAP 消息\n\n由 SOAP 标准定义的请求和响应 XML 文档被称为 SOAP 消息。一个 SOAP 消息由两部分组成：\n\
    \n- **头部（Header）：** 包括用于中间应用程序的可控制信息。\n- **主体（Body）：** 包含消息本身，即从一个应用程序传输到另一个应用程序的信息。\n\
    \nXML SOAP 文档的结构如下：\n\n```xml\n<Envelope>\n  <Header>\n    <!-- control information-->\n\
    \  </Header>\n  <Body>\n    <!--message-->\n  </Body>\n</Envelope>\n```\n\n从这里我们可以看到命名空间中有三个主要元素：`http://schemas.xmlsoap.org/envelope/`\n\
    \n- **Envelope（节点）：** 代表所有 SOAP 文档的根元素。\n- **Header（头部）：** 一个可选元素，包含头部参数。\n- **Body（主体）：**\
    \ 强制性的 `body` 元素包含消息内容。这包括特定于应用程序元素，描述 Web 服务与客户端应用程序之间交换的信息。\n\n除了这些应用程序元素，SOAP\
    \ 规范还允许在 `body` 中使用 `fault` 元素用于错误管理。\n\n以下 XML 是一个用于调用 Web 服务提供的函数的请求 SOAP 文档示例，用户凭据（用户名和密码）作为参数传递。\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<soapenv:Envelope xmlns:soapenv=\"\
    http://schemas.xmlsoap.org/envelope/\" xmlns:serv=\"http://www.myservice.com/\"\
    >\n   <soapenv:Header>\n   </soapenv:Header>\n   <soapenv:Body>\n      <serv:login>\n\
    \         <serv:user>teacher</serv:user>\n         <serv:password>admin</serv:password>\n\
    \      </serv:login>\n   </soapenv:Body>\n</soapenv:Envelope>\n```\n\n如所示，包含在\
    \ `body` 中的 `login` 元素代表要调用的方法，参数的值出现在各自的参数元素中。所有这些元素都定义在特定的命名空间中。一旦方法被调用，下面的列表显示了验证\
    \ Web 服务生成的可能的 SOAP 响应 XML 文档：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/envelope/\" xmlns=\"\
    http://www.myservice.com/\">\n   <soapenv:Header>\n   </soapenv:Header>\n   <soapenv:Body>\n\
    \      <loginResponse>\n         <result>true</result>\n      </loginResponse>\n\
    \   </soapenv:Body>\n</soapenv:Envelope>\n```\n\n"
- fmt: "\nIn the above we can see how the `body` structure is made up of a root element,\
    \ typically called `service_nameResponse`, which contains a child element holding\
    \ the return value. Just like request documents, the elements included in the\
    \ body of a response are also defined in the namespace of the application.\n\n\
    ### 3.1.2. Types of SOAP messages\n\nAccording to how the information is going\
    \ to be processed by a Web service, there are two kinds of SOAP message style.\n\
    \n#### 3.1.2.1. RPC Messages\n\nRPC messages are based on a type of interaction\
    \ known as **Remote Procedure Call (RPC)**, where the Web service request XML\
    \ document represents the call to a method or procedure with its corresponding\
    \ input parameters, whilst the XML document generated as a response represents\
    \ the return value of this method.\n\nThis is the simplest and most common type\
    \ of Web service, where the client and service communicate synchronously.\n\n\
    #### 3.1.2.2. Document Oriented Messages\n\nThe `body` of this type of document\
    \ can contain one or more child elements structured according to whatever application\
    \ they represent.\n\nThese XML documents are processed entirely by the Web service,\
    \ which can involve calls to the server’s different internal methods. The applications\
    \ that process this type of document need to access a schema that defines their\
    \ structure and syntax.\n\nAn example of this type of document could be used in\
    \ a Web service for processing purchase orders. In this case the client sends\
    \ an XML document to the Web service with the product code to be bought, their\
    \ bank details and the delivery address. Once the message is decoded, the Web\
    \ service begins executing the various tasks, like checking the client’s bank\
    \ details, informing the distributor etc. Finally, the Web service sends a response\
    \ document with confirmation or rejection of the purchase order.\n\n### 3.1.3.\
    \ Error messages\n\nAn error may occur when processing a SOAP request, in which\
    \ case the client application should be informed by sending a special message\
    \ known as a SOAP error.\n\nThis message contains a `<fault>` element that describes\
    \ the characteristics of the error via a series of child elements, each of which\
    \ is defined by the SOAP specification.\n\nThe following are the child elements\
    \ of `<fault>`:\n\n- `faultcode`: The error source. Can have one of the following\
    \ four values:\n    - `mustUnderstand`: Indicates that a value flagged as `mustUnderstand`\
    \ in the document’s header wasn’t able to be interpreted by the target node or\
    \ some intermediate node.\n    - `versionmismatch`: The SOAP version specified\
    \ in the response message isn’t recognized by some of the nodes.\n    - `server`:\
    \ An error occurred in the server whilst processing the message.\n    - `client`:\
    \ An error occurred because of errors within the client request message.\n- `faultstring`:\
    \ Explanatory error message.\n- `faultfactor`: Indicates the role that caused\
    \ the error.\n- `detail`: Error information specific to the application. Only\
    \ present if the error occurred in the `body`, not in the `header`.\n\n### 3.2\
    \ WSDL\n\nWSDL (Web Service Description Language) is a language based on XML that\
    \ is used to describe a Web service’s interface. Web service providers use this\
    \ language to define, with an XML document with a `.wsdl` extension, the methods\
    \ exposed by the service and the data they receive and return.\n\nA WSDL document\
    \ contains the following information about a Web service:\n\n- Methods provided\
    \ by the service.\n- The input and output parameters for each method.\n- Protocol\
    \ that should be used to connect to the service and its URL.\n\nThe following\
    \ listing shows a WSDL document for an example Web service called Operations,\
    \ which exposes a method that, with `user` and `password`, carries out the process\
    \ of verifying user credentials:\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<wsdl:definitions targetNamespace=\"http://services\"\nxmlns:impl=\"\
    http://services\" xmlns:intf=\"http://services\"\nxmlns:wsdl=\"http://schemas.xmlsoap.org/wsdl/\"\
    \nxmlns:wsdlsoap=\"http://schemas.xmlsoap.org/wsdl/soap/\"\nxmlns:wsi=\"http://ws-i.org/profiles/basic/1.1/xsd\"\
    \nxmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n<wsdl:types>\n<schema targetNamespace=\"\
    http://services\"\nxmlns=\"http://www.w3.org/2001/XMLSchema\"\nxmlns:wsdl=\"http://schemas.xmlsoap.org/wsdl/\"\
    \nxmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n<wsdl:types>\n<targetNamespace=\"\
    http://services\"\n</schema>\n<schema targetNamespace=\"http://services\"\nxmlns=\"\
    http://www.w3.org/2001/XMLSchema\"\nxmlns:wsdl=\"http://schemas.xmlsoap.org/wsdl/\"\
    \nxmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n<wsdl:types>\n<targetNamespace=\"\
    http://services\"\n</schema>\n</wsdl:types>\n```\n*(Note: The provided XML in\
    \ the source was truncated/incomplete; the structure is preserved as per instructions.)*\n\
    \n#### 3.2.1. Structure of a WSDL document\n\nEvery WSDL document is made up of\
    \ a root element `definitions`, within which the different namespaces to be used\
    \ in the document are declared (figure 5).\n\nTo complete the definition of the\
    \ service, the rest of the child elements included in *definitions* are *types,\
    \ message, portType, binding and service.*\n\n#### 3.2.1.1. types\n\nThis element\
    \ defines the types of data that will be used by the service, both method arguments\
    \ and their return values. When defining a Web service’s data types, an XML Schema\
    \ is used:\n\n```xml\n<wsdl:types>\n<schema targetNamespace=\"http://services\"\
    \nxmlns=\"http://www.w3.org/2001/XMLSchema\"\nxmlns:wsdl=\"http://schemas.xmlsoap.org/wsdl/\"\
    \nxmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n...\n</schema>\n</wsdl:types>\n\
    ```\n\n#### 3.2.1.2. message\n\nEvery **message** element defines the information\
    \ messages that will be exchanged between the Web service and its clients, messages\
    \ that are made up of the data defined in *types*. In fact, every message consists\
    \ of a child element *part* in which the data types that it contains are specified.\n\
    \n```xml\n<wsdl:message name=\"loginRequest\">\n<wsdl:part element=\"intf:login\"\
    \ name=\"parameters\"/>\n</wsdl:message>\n\n<wsdl:message name=\"loginResponse\"\
    >\n</wsdl:message>\n```\n"
