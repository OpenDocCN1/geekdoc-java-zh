    </sequence>


    </complexType>


    </element>


    <element name="login">


    <complexType>


    <sequence>


    <element name="email" nillable="true" type="xsd:string"/>


    <element name="password" nillable="true"


    type="xsd:string"/>


    </sequence>


    </complexType>


    </element>


    </schema>


    </wsdl:types>


    *3.2.1.2\. message*


    Every ***message*** element defines the information messages that will be exchanged


    between the Web service and its clients, messages that are made up of the data
    defined in


    *types*. In fact, every message consists of a child element *part* in which the
    data types that it contains are specified.


    <wsdl:message name="loginRequest">


    <wsdl:part element="intf:login" name="parameters"/>


    </wsdl:message>


