    \n**Figure. 31.**\n\nAs you can see from the above code, the callback method `handleResponse()`\
    \ is defined in the `javax.xml.ws.AsyncHandler` interface. In this method you\
    \ should include the instructions that you want to execute when the result, returned\
    \ by calling the WS method, is available. This result can be retrieved through\
    \ the `Response` object received in the `handleResponse()` method.\n\nIn the code\
