    \n# 4. 使用 JAVA / JAVA EE 基于 Web 服务的应用程序实现\n\n如前所述，Java EE 平台提供了一个便于构建基于 Web 服务应用程序的\
    \ API，称为 JAX-RPC。然而，最近大多数开发环境都包含了助手，它们极大地简化了构建 Web 服务的工作，将过程简化为为实现应用程序逻辑层。\n\n\
    NetBeans 也是如此。使用此 IDE，程序员只需要负责实现带有所需业务方法的 EJB 或类，而让 NetBeans 动态生成描述接口的 XML 适配器和\
    \ WSDL 文档。\n\n## 4.1. 使用 NETBEANS 创建和部署 Web 服务\n\n借助 NetBeans 的帮助，我们可以在应用程序服务器中创建并部署\
    \ Web 服务。我们的操作方法取决于我们已经拥有什么，这为我们提供了三个起点：\n\n- **从零开始创建 Web 服务**：不使用任何现有的应用程序逻辑或任何类型的规范，而是从零开始创建\
    \ Web 服务。\n- **从现有的 EJB 创建 Web 服务**：应用程序逻辑已实现在 EJB 中，我们希望将其暴露为 Web 服务。\n- **从\
    \ WSDL 文档创建 Web 服务**：Web 服务应该暴露的方法描述已在 WSDL 接口中定义好。\n\n### 4.1.1. 从零开始创建 Web 服务\n\
    \n为了解释使用 NetBeans 创建 Web 服务的过程，我们将开发一个名为 `CalcWS` 的简单示例 Web 服务，它将暴露一个名为 `factorial`\
    \ 的方法，该方法的作用是计算传入参数的数字阶乘。\n\n首先，由于所有 Web 服务都是 Web 应用程序，我们将创建一个名为 `ExampleProyectWS`\
    \ 的 Web 应用程序类型项目（图 13）。\n\n## 图. 13.\n\n![](img/index-23_1.jpg)\n\n出于部署目的，我们可以使用\
    \ Tomcat 或 GlassFish 作为应用程序服务器。\n\n项目创建完成后，使用鼠标在项目（Project）窗口中右键点击，从弹出菜单中选择 `New\
    \ -> Web Service`。将出现图 14 所示的对话框。\n\n## 图. 14.\n\n在这个对话框中，我们应该输入 Web 服务名称和它将所在的包，同时选择是从零开始创建\
    \ Web 服务（默认）还是从现有的会话 bean EJB。\n\n假设我们从零开始创建 Web 服务，点击“Finish”（完成）后，我们将在 NetBeans\
    \ 编辑器中看到 `CalcWS` 类（图 15）。在这里，我们实现想要在 Web 服务中暴露的方法。\n\n```java\npackage services;\n\
    \nimport javax.jws.WebService;\n\n// Web Service class annotation\n@WebService()\n\
    public class CalcWS {\n}\n```\n\n## 图. 15.\n\n![](img/index-24_1.jpg) \n![](img/index-24_2.jpg)\n\
    \n正如我们所见，带有服务方法的实现类是一个普通的 Java 类，区别在于它必须按照 `javax.jws.WebService` 包定义的声明带有 `@WebService`\
    \ 注解。使用此注解，运行时环境将生成所有必要的内容，以便类方法被暴露为 Web 服务方法。\n\n在编辑器窗口的最上方有一个名为 `Design`设计）的按钮，允许你切换到类的设计视图（图\
    \ 16）。\n\n## 图. 16.\n\n使用 `Add Operation`添加操作）按钮，我们可以图形化地添加服务方法，输入方法名、参数和返回类型（图\
    \ 17）。\n\n## 图. 17.\n\n![](img/index-25_1.jpg)\n\n点击 OK 按钮返回到我们的类源码视图，我们可以看到阶乘方法的声明，在这里我们可以确认方法和参数都标记了\
    \ `@WebMethod` 和 `@WebParam`。\n\n```java\npackage services;\n\nimport javax.jws.WebMethod;\n\
    import javax.jws.WebParam;\nimport javax.jws.WebService;\n\n@WebService()\npublic\
    \ class CalcWS {\n    @WebMethod(operationName = \"factorial\")\n    public double\
    \ factorial(@WebParam(name = \"num\") int num) {\n        double result=1.0;\n\
    \        for(int i=1;i<=num;i++){\n            result*=i;\n        }\n       \
    \ return result;\n    }\n}\n```\n\n这就是使用 NetBeans 实现 Web 服务所需的所有操作。接下来我们通过 `Deploy`\
    \ 弹出菜单将应用程序部署到应用程序服务器。一旦部署完成，Web 服务即可供客户端使用。从 NetBeans 内部我们可以测试 Web 服务。要这样做，在\
    \ Web 服务文件夹内部，右键点击我们的 Web 服务并从弹出菜单中选择 `Test Web Service`（图 18）。\n\n测试 Web 服务时，NetBeans\
    \ 打开一个浏览器实例向 Web 服务发送请求，并在 URL 中包含 `tester` 参数。给定此参数，应用程序知道这是来自浏览器的请求，并生成一个允许选择要执行的方法并输入参数的测试页面（图\
