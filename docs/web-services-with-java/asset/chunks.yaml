    *keyName* attribute, while *keyValue* defines the category to which the structure
    belongs


    according to the classification scheme used.


    ***3.3.2\. UDDI API***


    For applications to interact with a UDDI registry, the latter should expose a
    series of


    functions in the form of SOAP Web services. These Web services allow search operations
    and


    the publication of other Web services within the registry.


    Depending on the type of operation carried out, UDDI functions are grouped into
    two


    categories: Inquiry functions and Publication functions. Figure 10 shows the main
    functions and


    the category to which they belong.


