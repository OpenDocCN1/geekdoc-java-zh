    ## 7.3 General trees


    In the rest of this chapter, I will look at the implementation of general trees,
    which were briefly mentioned in the previous book. In fact, it is not easy to
    write an abstract data type that represents a general tree, at least not so that
    it is effective, and can be used for something, but vice versa there are many
    examples where data is organized in a general tree (and just think of a file system
    for a disk or, for example, a `TreeView` control in `JavaFX`), so there are good
    reasons to be interested in writing a class that represents a general tree.


    In this section, I would like only to interfere with a tree where there are no
    requirements besides that the are elements organized in a hierarchy, where each
    element has a unique parent (except for the root that does not have any parent).
    The tree can be defined as follows:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_106.jpg)


    and here you should note that there are few methods that are primarily limited
    to inserting elements, deleting elements and using `find()` asking if an element
    exists in the tree. You should also note that the methods directly refer to the
    internal nodes and thus to the implementation of the tree, which is one of the
    problems of implementing a general tree. Data encapsulation is not as desired.
    Finally, you should note that the interface says that a tree should implement
    the iterator pattern.


    The tree is constructed as `TreeNode<T>` nodes, where `T` is the data type for
    the elements that the tree has to organize. The class is as follows:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_1061.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_107.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_108.jpg)


    The class has more references this time, where a node can refer to other nodes.
    Since the degree of a node can be arbitrary, a node has a list of references to
    child nodes and thus to the sub-trees. You should note that this list is always
    created, which is not necessary as all leaf nodes do not need the list. One could
    therefore achieve better efficiency by just creating the list for composite nodes,
    and when I always creates the lists, it is only to make the code a bit simpler.
    Also note that a node has a parent pointer, thus referring to its parent. The
    aim of these pointers is to make the implementation of some of the methods more
    effective. Finally, note that a node has a level, so you know at what level it
    is part of a tree. Note that the number of elements in the children list is the
    degree of the node.


    The class’s methods are somewhat trivial, but you must note the method `add()`,
    which creates a new node and puts it as a child to the current node. You should
    also note the method `remove()`, which deletes the current element. This is done
    by deleting the current element in the parent node’s child list. Note that this
    means deleting the sub-tree that has the current element as root. The method `remove()`
    starts by testing if the node’s parent is zero because it should not be possible
    to delete the root.


    The tree itself can then be implemented as follows:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_109.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_110.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_1111.jpg)


    Here the implementation of the methods is simple, and the only exception is the
    iterator implemented as an inner class. The first is to decide in what order the
    individual elements are to be visited, and I have chosen that it will take place
    in level order. The iterator can therefore be implemented using a queue in much
    the same way as in the previous book I implemented level order traversing a binary
    tree.


    If you consider the methods `add()` and `remove()`, they are actually extremely
    effective because they are implemented with constant time complexity, but it is
    only apparent because they require that you know the node in which the new element
    is to be inserted or the node to be deleted. Also note that when implementing
    remove with constant time complexity, it is because a node has a parent pointer.
    To find a node (which must deleted or be parent to a new node), use the method
    `find()`, and this is the problem, because it has a linear time complexity.


    Finally, note the method `getPath()`, which returns the path from the root to
    a node. When you can implement this method with reasonable efficiency, it is again
    due to the parent reference.


    The class has not implemented a method to return the height or a method to the
    degree of the tree. It is not so easy to do it in a good way as they typically
    will have linear complexity. One could try to maintain two instance variables
    for height and degree, respectively, which should be maintained in conjunction
    with `add()` and `remove()`. It is simple in connection with `add()`, but is not
    so easy in connection with `remove()`. With the current implementation you can
    therefore determine the height and the degree by traversing the tree.


