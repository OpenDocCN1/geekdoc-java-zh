    如果有 `n` 个点，那么就有 `n(n – 1) / 2` 组距离，一个简单的解决方案就是确定所有点对之间的距离，然后选择最小的一个。这种算法非常简单（而且容易实现），但很显然，它具有平方级的时间复杂度。因此，寻找更好的算法是显而易见的。


    假设你有一个包含这些点的数组，并且假设数组已经根据点的 x 坐标进行了排序。你可以立即将这些点分成两半。


    ![](img/Image2218.jpg)


    现在有三种选择：


    1. 最近的两个点在左半部分

    2. 最近的两个点在右半部分

    3. 最近的两个点分别在两个半部分中，即位于分割直线的两侧


    然后，可以通过从这三个子问题的解决方案中选择最佳的一个（通过点之间的距离来衡量）来确定结果。这里，前两个子问题很容易解决，因为它们通过对每个子问题重复上述分解方法（即通过递归）来解决。因此，问题在于解决第三个问题，如果你用线性时间复杂度来解决，它就像我为归并排序展示的那样，算法实现的时间复杂度为
    ![](img/Java_12.jpg)。因此，解决方案是将问题划分为两个递归子问题和一个通过迭代解决的第三个问题。这是一个分治算法。


    为了分析中间的问题，让 ![](img/Java__13.jpg) 和 ![](img/Java__14.jpg) 分别表示左两个子问题的解（点之间的最小距离），并设置为
    ![](img/Java__15.jpg)。让 ![](img/Java__16.jpg) 表示第三个子问题的解。只有当 ![](img/Java__16.jpg)
    小于 ![](img/Java__17.jpg)，即对于落在分割线附近带状内的点时才有关注价值：


    ![](img/Image2228.jpg)


    这减少了需要处理的点数。可以通过以下方式完成，其中 `a` 和 `b` 是带状内点的起始和结束索引：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_34.jpg)


    该算法仍然具有平方复杂度，但将点 `p[i]` 与带状内的点进行比较就足够，这些点的 y 值之差小于 ![](img/Java__17.jpg)（其他点不会提供更好的解决方案）。同时假设当前带状内的点已按
    y 值排序，如果你考虑一个特定的点 `p[i]`，由于对 ![](img/Java__17.jpg) 的选择（它小于或等于左右部分点之间的最短距离），在一个
    ![](img/Java__17.jpg) 正方形内可能不会超过 7 个点：


    ![](img/Image2235.jpg)


    因此算法可以如下所示进行改进，其中内层循环由于最多 7 个点可以被视为常数：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_35.jpg)


    结果是，第三个问题的问题的现在是线性的，完成后的算法复杂度为 ![](img/Java_12.jpg)。然而，有两并不显而易见。首先，点数组不能同时按 x
    值和 y 值排序。这个问题可以通过拥有两个副本并分别根据这两个标准进行排序来解决。另一点是，从开始就假设点数组已经过排序（按 x 值），但由于数组可以通过例如归并排序进行排序，其复杂度为
    ![](img/Java_121.jpg)，你可以从对数组排序开始，而不会改变算法的时间复杂度 ![](img/Java_12.jpg)。


