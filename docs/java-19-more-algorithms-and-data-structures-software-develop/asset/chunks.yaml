    当然，这个问题具有实际意义（即使在许多不同的情况下也是如此）。这个问题于 20 世纪 30 年代初提出，长期以来具有极大的理论价值，但当我在这里提到这个问题时，部分是将其作为一个非常复杂问题的例子，另一部分是将其作为一个目前未知解决方案的例子——至少没有通用解。然而，存在一些可以找到
    TSP（旅行商问题）局部解的算法，在下文中我将提到一个例子。需要说明的是，理论和算法的数量都非常详尽，以下内容并不比一个简短的介绍多少，但研究一下你在网上能找到的内容（包括许多算法示例）可能是一个很好的练习。


    ## 9.1 关于图的更多


    为了后续的内容以及 TSP，我想对图添加一些额外的定义/备注，在下文中 `G = (V, E)` 指代图。


    如果两个顶点之间存在一条边，则称这两个顶点是**相邻的**（`adjacent`）。一个顶点 `v` 的度是指与 `v` 相邻的顶点数量，通常使用符号 `deg(v)`。如果图有
    `n` 个顶点，那么顶点的度最大可以为 `n-1`（如果该顶点没有指向自己的边）。


    所谓**完全图**是指图中任意两个不同顶点都是相邻的图：


    ![](img/Image5756.jpg)


    在上一章中，我将两个顶点之间的路径定义为连接这两个顶点的边序列。在当时，允许同一个顶点出现多次，但在本章中，我希望路径除了第一个和最后一个顶点外，由不同的顶点组成。特别是，**环**除了起始顶点外没有重复，有时人们将环称为闭合路径。


    一条包含图中所有顶点的路径被称为**哈密顿顿路径**（Hamiltonian path），特别是，你谈论的是哈密顿环。


    在第 7 章中我提到了连通图（上面显示的所有例子都是连通图），但准确来说，如果对于每一对顶点 `A` 和 `B` 都存在从 `A` 到 `B` 的路径，则该图是连通的。如果一个图是不连通的，意味着它由几个子图组成，这里每个子图称为一个连通分支。如果你有一个连通图，并且有一条边，移除该边后图变成了不连通图，那么这条边被称为**桥**（bridge）。例如，下方的边
    `{B, G}` 就是一个桥：


    ![](img/Image5763.jpg)


    如果你有一个完全图，显然存在哈密顿环，因为每对顶点之间都有边，但如果图不是完全的，你就无法确定这一点。例如，如果图有一个桥，那么不存在哈密顿环，因为如果起始顶点在桥的一侧，不经过这条桥就无法到达另一侧，无法返回。


    显然，一个图是否具有哈密顿环，取决于图的密度。有几个陈述可以指示图何时具有哈密顿环，例如，我想提到其中一个。如果一个图有 `n` 个顶点，其中 `n >=
    3`，且


    ![](img/Java_144.jpg)


    则该图具有哈密顿环。该陈述在图论领域已得到证明。


    ## 9.2 关于复杂性的更多


    如果你考虑一个具有 `n` 个顶点和一个起始顶点的完全图中的哈密顿环，那么你可以从起始顶点去到 `n-1` 个其他顶点。从这里有 `n-2` 种选择进入下一个顶点，下一次有
    `n-3` 种选择，这意味着有 `(n-1)!` 种方案绕一圈。由于也有选择起始顶点的可能，图包含 `n!` 个哈密顿环。这并不完全错误，因为每个环都有一个相反的环，区别仅在于你向一个方向还是另一个方向走。可以得出，对于给定的起始顶点，哈密顿环的最大数量是


    ![](img/Java_145.jpg)


    这对应于顶点的排列。因此，你可以使用暴力算法解决 TSP，即对于给定的图和给定的起始顶点，确定所有的哈密顿环，然后确定路径长度最短的那一个。问题在于阶乘增长得极其惊人，因此，稍微大一点的
    TSP 问题就需要另一种算法。其思想是将 TSP 问题分解为子问题，并希望它们属于更简单的复杂度类。


    复杂度类涵盖了一系列复杂度相互相似的问题。如果一个问题可以用用多项式表示的时间复杂度来解决，则称该问题的复杂度类为 `P`，且它是一个 `P` 问题。请注意，这适用于我在本书和前一本书中展示的大部分问题，例如线性算法、平方算法等。


    **决策问题**是一个解为“是”或“否”的问题。可以通过确定性算法解决的决策问题族称为复杂度类 `NP`。TSP 就是这样的问题，因为该问题可以表述为：


    *给定一个无向图和所有顶点之间的距离，是否存在一个距离小于给定总距离 `c` 的哈密顿环？*


    这是一个“是”或“否”的问题，因此它是一个 NP 问题。


    设 `P1` 和 `P2` 为两个决策问题。如果一个算法可以在多项式时间内从 `P1` 归约为 `P2`，则称 `P1` 多项式时间归约 `P2`。如果一个问题可以被证明属于复杂度类
    `NP`，并且可以证明它可以多项式时间归约一个已知的 NP 完全问题，则该问题是 **NP 完全**的。


    如果一个问题当且仅当它与 NP 完全问题一样困难时，它就是 **NP 困难**的。TSP 就是这样一个问题，因为它的解决方案包括寻找所有的哈密顿环然后找到最短的一个。因此，旅行商问题被归类为
    NP 困难。

