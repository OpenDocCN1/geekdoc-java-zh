    ## 7.2 Red-black trees


    As mentioned above, you do not directly implement a 2-3-4 tree, among other things
    because there are several kinds of nodes, and both insertion and deletion results
    in many special cases. However, you can easily convert a 2-3-4 tree to a binary
    tree, which is called a `red-black tree`, and the result becomes a reasonably
    balanced tree. The idea is that all links between two nodes are assigned a color
    that is either red or black. It is said that a node is black if its parent’s link
    is black while a node is red if its parent link is red. A 2-3-4 tree can be transformed
    into a binary tree as follows:


    A 2-node is transformed into a usual binary node with two black children (which
    may be empty):


    ![](image/Image3137.jpg)


    A 3-node is mapped to two binary nodes, one being red (there are two options):


    ![](image/Image3144.jpg)


    Finally, a 4-node is mapped to three binary nodes, where both children are red:


    ![](image/Image3152.jpg)


    The result of this transformation is as follows, and is then the definition of
    a `red-black tree`:


    1. There can not be two red nodes next to each other (in the above figures, links
    whose successor are not shown are all black).

    2. As the black depth of a node, you understand the number of black links from
    the root to the appropriate node. In a red-black tree, all leaf nodes have the
    same black depth. This is because all red links correspond to 3-nodes and 4-nodes
    and therefore do not contribute to the height of the corresponding 2-3-4 tree.

    3. There is no link to the root, and it is assumed that it means that the root
    is black.


    Consider as example the 2-3-4 tree shown below:


    ![](image/Image3161.jpg)


    If you convert it into a red-black tree, the result is:


    ![](image/Image3175.jpg)


    Here you should note that there are now not two red nodes that are successors,
    and that all leaf nodes have the same black depth that is the height of the corresponding
    2-3-4 tree.


    A red-black tree is not balanced, but if you counting only black links it is.
    A 3-node and a 4-node may insert an additional depth in the tree, and therefore
    the height of a red-black tree is no more than double the corresponding 2-3-4
    tree and thus the tree is reasonably balanced.


    A red-black tree is especially a binary search tree and therefore, all that has
    been said in the previous book about binary search trees, including balanced search
    trees, are still validly understood that it is possible to implement insertion
    and deletion so that the requirements for a red-black tree is maintained. It is
    possible, but it’s not simple.


    I will start with insertion. Above I described insertion into a 2-3-4 tree as
    a search down in the tree to find where the new element is to be inserted and
    followed by a return to split any 4-nodes that are filled up. That is, there was
    both a top-down pass and a bottom-up pass (similar to the AVL tree). It is possible
    to perform this insertion in a single top-down pass by ensuring that the new element
    is not inserted into a full 4-node. This can be done by searching down the tree
    and split all the 4 nodes encountered in two 2-nodes. In a red-black tree, it
    is an extremely simple process, as a 4-node is known to have two red children,
    and the split consists of a simple color change:


    ![](image/Image3189.jpg)


    This preserves the black depth of all leaf nodes. Since `B` is now red, there
    is a problem if `B`’s parent is also red, as you have two subsequent red nodes.
    This problem is solved with rotations. If a 4-node is succeeding to a 2-node,
    there are two options:


    ![](image/Image3196.jpg)!(image/Image3204.jpg)


    None of these situations cause problems. If a 4-node instead follows a 3-node,
    there are three options, as the 4 node may be a left child, a right child or a
    middle child. As shown above, the conversion of a 3-node to a red-black tree can
    lead to two orientations, so there are actually 6 cases. Below are two situations
    where a 4-node is a right child and a left child for a 3-node but a 3-node with
    two different orientations:


    ![](image/Image3211.jpg)!(image/Image3220.jpg)


    ![](image/Image3227.jpg)


    ![](image/Image3235.jpg)


    ![](image/Image3242.jpg)


    ![](image/Image3259.jpg)


    ![](image/Image3270.jpg)


    ![](image/Image3283.jpg)


    ![](image/Image3290.jpg)


    The result of all these operations is that when you find the leaf where the new
    element is to be inserted, it may happen in a 4-node that should be split, but
    on the way to the leaf all 4 nodes are removed, and parent will have room for
    an additional element. This means that the insertion can be done with a single
    top-down pass and in such a way that the tree retains its black depth and is still
    nicely balanced.


    A red-black tree can, in the same way as an AVL tree, be implemented as a class
    that inherits `BinSearchTree<T extends Comparable<T>>` (see the previous book
    on binary trees). To implement the tree, it is necessary to add an additional
    attribute to a node that can control the color:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_105.jpg)


    Here, `TreeColor` is a simple enumeration that defines the two colors. After that,
    insertion of an element can be implemented as described above, but it requires
    some code lines, and it can be difficult to keep track of what happens. You are
    encouraged to study the code, and the easiest is always thinking of a 2-3-4 tree.


    Back there is removing a node, and it is implemented as described under 2-3-4
    tree. That is, searching down the tree for the element to be deleted. If you get
    to a 2-node, you do a fusion and a new 4-node will be created, which in a red-black
    tree will consist of a color change. This can lead to problems with two subsequent
    red nodes, and the balance must then be restored with rotations. There are several
    options, and I will not illustrate the many cases with examples here, but you
    may want to examine the completed code that is both long and complex.


    The finished class in the library `palib` and is called `RBTree`.


