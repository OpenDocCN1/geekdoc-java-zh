    在看代码之前，我想提到程序中有一个名为 `Options`（选项）的菜单项，用户可以在那里进行一些设置：


    ![](img/Image2911.jpg)


    *   你可以根据行数和列数选择迷宫的大小。

    *   你可以选择单个单元格的大小——即在屏幕上填充多少空间。

    *   你可以选择当前单元格的颜色，从而改变红方块的颜色。

    *   你可以选择用于绘制单元格之间墙壁的颜色。

    *   你可以指定在演示函数中，计算机移动方块之间的时间间隔（以毫秒为单位）。

    *   最后，可以选择两个难度级别（尽管差异不大），但具体含义将在下文中进行解释。


    我不想展示上述对话框的代码，但基本上该对话框维持了以下模型：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_68.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_69.jpg)


    前两个常量表示对话框中 `ComboBox` 的最小值和最大值，而颜色是一个 `Map<String, Color>`，表示应用程序可以使用的通过名称识别的颜色。


    迷宫的单元格由以下类定义：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_691.jpg)


    该类原则上是简单的，但由于属性很多，代码占据了一部分篇。前两个属性表示目标单元格的行和列。接下来的四个属性表示是否存在墙（从开始就有墙），然后它将成为创建迷宫的算法的一部分，用于移除其中一些墙。最后，是最后一个属性
    `state`，其含义如下：


    *   0，单元格未被访问

    *   1，单元格已访问

    *   2，单元格是当前单元格且包含红方块


    注意，该类继承自 `Canvas`，因此它是负责通过 `draw()` 方法绘制单个单元格的类。最后，该类可以抛出一个 `ActionEvent`，这会在点击单元格时发生；在当前情况下，这意味着主窗口将通知有一个单元格被点击，以及点击的是哪一个单元格。


    后面是 `Mazes` 类，它占据了部分篇幅，但重要的是上述两个算法的实现。


    要创建一个新迷宫，首先开始创建单元格并将它们放置在 `GridPane` 中。从开始所有的墙都存在，用户界面只显示一定数量的方块：


    ![](img/Image2919.jpg)


    现在的任务是随机移除墙壁直到迷宫制完成。现在你不能简单地随机移除墙，因为迷宫必须是连通的，即必须有一条路径。这时你可以使用 `DisjointSet` 类。如果迷宫像上面一样有
    10 行 20 列，就有 200 个单元格；如果你将这些单元格排列成数组并使用 `DisjointSet`，当第一个和最后一个属于同一个等价类时，迷宫中就会存在路径。因此，算法应该如下运行：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_70.jpg)


    原则上，该算法非常简单且运行良好，但它有一个问题，因为它可能会提供一些封闭的单元格组，你无法在其中移动红方块。这个问题可以通过将算法中的最后一条语句改为来解决：


    ```

    ![](img/Image2926.jpg)


    在这里，程序将尝试通过迷宫。程序使用了一种策略：如果可能，它尝试向右走，并且该地方是它之前没去过的。如果不可，它将按照相同的准则尝试向下，然后向左，最后是向上。如果它无法到达任何地方，就必须回溯，直到回到一个可以继续前进的单元格。原则上，它是通的（但并不特别有效），唯一的挑战是在回溯时跟踪应该去哪一个单元格。这可以用栈简单地解决。


    # 6 其他算法


    上面我提到了 4 种广为人知的算法模板，如果你想写算法且解决方案并不显而易见，你可以考虑是否可以使用上述范式之一。如果是，它可以为问题的解决方案提供指南，并对解决方案的复杂度提供指示。然而，并不是所有算法都能通过这些描述来表征，在本章中我将给出几个无法这样描述的算法示例。


    ## 6.1 暴力算法


    我之前提到过 `brute force algorithms`（暴力算法），它们简单地通过尝试所有可能的情况来解决问题。原则上，这类算法没有问题。作为一个例子，下面展示了一个确定整数因数的算法：


    ```

    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_72.jpg

    ```


    对于数字 `N`，算法尝试所有小于等于它的数。通常，暴力算法是简单的（在此情况下），但问题在于它的时间复杂度，且如果 `N` 很大，算法就会变得很慢。


    正如提到的，并不总是比应用暴力算法更好（考虑线性搜索），但如果你有一个暴力算法来解决问题，就有考虑是否有更好的算法。


    ## 6.2 随机算法


    作为另一类算法，我想提到复杂度取决于随机选取值的算法。这些算法的复杂度可能难以指定，只能以某种概率或其他概率指定复杂度，但它们也可以是在给定概率下确定正确结果的算法。也许很难想象那些可以确定结果的算法，但如果一个算法非常复杂且耗时很长，一个可能正确的结果可能比没有结果要好。


    在之前的书中，我将快速排序视为一种 `image/Java_122.jpg` 排序算法，至少在平均情况下如此，但在最坏情况下，复杂度可能是平方，这发生在数组已经排序或接近排序时。复杂度取决于你选择基准点的运气，有几种技术可以解决这个问题。当我检查快速排序时，我建议选择中位数作为基准点，但另一种方案是随机选择基准点，这同样提供了良好的解决方案。


