    and as an example, I have below shown the shortest path from A to H:


    ![](image/Image5464.jpg)


    That was the algorithm, and the next thing is to get it written in Java. The idea
    in the algorithm is that you have decided the shortest way to the first vertices.
    The rest has a shortest path that is either infinite or not yet decided. You then
    take the vertex from the vertices whose shortest path is not yet determined, and
    which has the best so far smallest shortest path and calls it for the current
    vertex. It is now the next vertex whose shortest path is determined, and then
    you may need to adjust the distance to the current vertex’s direct successors.
    The last is simple and the biggest challenge is to keep track of how far you have
    reached and which vertex should be the current vertex. For that a priority queue
    (or a heap) is used, where the vertices are inserted with a priority after the
    distance. Therefore, there is a need for a wrapper class that enclose a vertex
    and the distance, but such that the comparison is done only on the distance:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_168.jpg)


    The algorithm can be implemented in the same way as shown above using an iterator,
