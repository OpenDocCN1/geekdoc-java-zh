  raw: 'Write a program that can test the depth first and breadth first traversing
    of a graph. You can call the project for *GraphTester3*. The project must have
    the following method:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_155.jpg)


    Build the same graph as in the program *GraphTester1* (with 9 corners and 17 edges).
    Print the graph using the above method, where A should be the start vertex.


    Also build another graph, where the vertices are represented by letters, but where
    this time there should be the vertices A, B, …, Z but added to the graph in random
    order. Next, add random edges until the graph has 200 edges. Print the graph in
    the same way as above, but note that there may be vertices to which there is no
    path.


    ## 8.4 Shortest path


    It’s a whole family of algorithms, all of which aim are to find a path from one
    vertex to another vertex, but such that it is the shortest path. Usually, the
    algorithms are implemented so they from a starting vertex they finds the shortest
    path to all other vertices in the graph, where there is a path. In order for the
    algorithms to make sense, one has to measure something and it is here that the
    weights get into the picture. By the shortest path from one vertex to another
    vertex is meant a path so the sum of the weights of the edges that are part of
    the path is minimal. For example, if considering the graph below, is the shortest
    path from A to I is (A, C, G, I), which has the length (or cost) 9\. It is easy
    to figure out in this case, but with a more complex graph it is nevertheless easy.
    I’ve described the problem as finding the shortest path, but of course you can
    also look at the problem finding the longest path, and the difference will be
    primarily to reverse the inequalities. In the following, I will only focus on
    the shortest paths.


    ![](image/Image4811.jpg)


    #### MinPath


    Shortest path algorithms are naturally defined for weighted graphs. However, I
    want to start somewhere else and look at a non-weighted graph where the shortest
    path should measure the number of edges, and the task is to find a path from a
    starting vertex to any other vertex, but so that the path have as few edges as
    possible. The algorithm can be described as follows:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_156.jpg)


    The idea is that if you first found the shortest path (like the number of edges)
    to a vertex, you can not do better by going another way. If you consider the above
    graph (and ignore all weights) and if you start in A, it is clear that the shortest
    paths to the direct followers B and C are 1 and you can not do it better. If you
    continue with B (by taking it from the queue), you have already found a path to
    its successor C, and of course it is not better to count one edge more. Conversely,
    no path has been found to E, and the shortest path becomes the path to B plus
    1 and thus 2\. To continue, next time, C will be taken from the queue.


    A method that implements this algorithm, I have called *minPath()*. It must return
    an iterator, which iterates over all vertices, and returns for each vertex the
    shortest path to the starting vertex. For that I have defined the following class


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_157.jpg)


    which represents a path from one node to another, as well as the accompanying
    cost or weight by following the path. The class *GraphTools* is expanded with
    two new helper methods that can create a path to *node*:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_1571.jpg)


    They are used to construct a path (a *Path* object) to a *node*. These methods
    assume that an algorithm has previously been executed, which finds a shortest
    path stored in the *Node* object’s *distance* property, and that the *Node* object’s
    *prev* variable refers to the node’s predecessor. That is, knowing the distance
    to the node, you can go back to the start vertex via *prev* and thus get the path.


    With these remarks, the algorithm can be implemented as the following iterator:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_158.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_159.jpg)


    Basically, the algorithm works as the traversal algorithms, where a local map
    is created with *Node* objects, but otherwise the code corresponds exactly to
    the above algorithm. You should note how to test if a shortest path is found by
    comparing *distance* with *infinity*. The variable *distance* is initialized to
    this value in the class *Node*.


    Note that the algorithm that finds the shortest paths in a non-weighted graph
    really is just a special case of the next shortest path algorithm, where the weights
    at all edges are 1.


    #### Dijkstra‘s algorithm


    It is a well-known and classic algorithm to find the shortest paths in an oriented
    weighted graph. The algorithm assumes that all weights are not negative. The procedure
    is a bit the same as in *minPath()*, but you must keep in mind that the first
    path you determine is not necessarily the best:


    1.  Set the distance to all other vertices to infinity.


    2.  Select a starting vertex and set the distance to 0\. Mark the vertex as completed,
    as the distance 0 must be a shortest distance.


    3.  Set the distance to all direct successors to the starting vertex to the weight.


    4.  Choose from the vertices that have not completed the vertex with the smallest
    distance.


    5.  Mark this vertex as completed.


    6.  Set the distance to all direct successors that are not completed to the sum
    of the distance to the vertex and the weight of the edge if it is a better distance
    than that already determined.


    7.  Repeat steps 4–6 until all vertices are completed.


    Consider, for example, the following graph:


    ![](image/Image4818.jpg)


    The easiest is to visualize the algorithm with a table where there is a row for
    each vertex. The first column indicates the vertices, the next is used to keep
    track of which paths have been completed, the third indicates the distance, while
    the last indicates the predecessor on the shortest path up to that vertex:


    | A |  | ![](image/Java_141.jpg) |  |


    | B |  | ![](image/Java_141.jpg) |  |


    | C |  | ![](image/Java_141.jpg) |  |


    | D |  | ![](image/Java_141.jpg) |  |


    | E |  | ![](image/Java_141.jpg) |  |


    | F |  | ![](image/Java_141.jpg) |  |


    | G |  | ![](image/Java_141.jpg) |  |


    | H |  | ![](image/Java_141.jpg) |  |


    I will choose *A* as the starting vertex. The distance to A is 0 and there is
    no predecessor. I therefore mark *A* as completed and indicate the shortest paths
    to *A*’s immediate successors:


    | A | ok | 0 |  |


    | B |  | 2 | A |


    | C |  | 6 | A |


    | D |  | ![](image/Java_141.jpg) |  |


    | E |  | ![](image/Java_141.jpg) |  |


    | F |  | ![](image/Java_141.jpg) |  |


    | G |  | ![](image/Java_141.jpg) |  |


    | H |  | ![](image/Java_141.jpg) |  |


    So far, I’ve only found the shortest path to A. I’ve also found paths to B and
    C, but it’s not necessarily the shortest paths, but it’s the shortest for the
    time being. I now choose a vertex, among those where I have not already found
    the shortest path (here is B–H), but the vertex which has the shortest path. It
    is *B* that has the distance 2\. This is where it is important that the distances
    from the start are set to infinity. There is no better way to *B*, because if
    so, this path would already be found in a previous pass. I now look at those of
    *B*’s successors, where no shortest path has already been found, that is to say,
    the successors who have not been completed (it’s D and F) and investigate if I
    can get a cheaper way by going over B. In both cases I can (the routes found so
    far are infinite):


    | A | ok | 0 |  |


    | B | ok | 2 | A |


    | C |  | 6 | A |


    | D |  | 4 |  |


    | E |  | ![](image/Java_141.jpg) |  |


    | F |  | 9 |  |


    | G |  | ![](image/Java_141.jpg) |  |


    | H |  | ![](image/Java_141.jpg) |  |'
