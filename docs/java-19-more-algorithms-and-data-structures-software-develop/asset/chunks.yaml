    The class `Graph<T>` implements the interface `IGraph<T>` and thus represents
    a graph. You should note that the class alone supports building the graph with
    vertices and edges, but no graph operations – which I have not mentioned yet.
    There is some code, and you should primarily note the following.


    First, there is the data presentation where I have used a map for vertices and
    with the generic type `T` as a key. It requires that the type `T` should override
    both `equals()` and `hashCode()` with value semantics. Then note that a property
    has been defined for the graph type (oriented or non-oriented) and that the type
    is initialized in the constructor, which by default sets the type to be oriented.
    Assuming that a vertex has few edges (whatever it may be), for most operations,
    one must expect a time complexity that with approximation is constant. However,
    if the graph is dense (so that from every vertex there is an edge to all (many)
    other vertices), several of the methods will have linear complexity. It is difficult
    to estimate the complexities as they depend on the density of the graph, but since
    graphs in practice have more edges than vertices, and since these edges often
    are distributed evenly across the vertices, this complexity is often seen as `log
    (N)` where `N` is the number of vertices.


    One of the most important methods is the method `add()` that adds an edge. It
    starts by testing if there is already an edge between the two vertices, and if
    so, the operation is ignored (for a non-weighted graph) or the weight is updated.
    If the edge is not already there, find the corresponding vertex by “pick the corner
    up” into the map and if it is not there, it will be created. That is, the method
    `add()` will add new vertices if a vertex is not already in the graph. With the
    two vertices you can then add an edge to the one. If the graph is not oriented,
    then another edge will be added automatically. It’s a simple (and also a little
    expensive) solution that you can discuss and there are other and better ways,
    but I perceive non-oriented graphs as the exception and have therefore allowed
    to get rid of it by just adding yet an edge.


    Also note the implementation of the iterator, which consists simply in returning
    the map’s iterator. This means that you can not assume anything about the order
    of iteration over the vertices. The implementation of the methods `remove()` is
    not quite simple, and it is hard to remove a vertex. Should you remove a vertex,
    you must also delete all edges that this vertex is part of, and here it is especially
    the edges that have the vertex as a successor, that causing problems as you can
    not find them without searching all the edges, that is, run over all vertices
    and run over all the edges of each vertex.


    Then there is the method `getSuccessors()` that will return all successors for
    a particular vertex. It’s a simple method, as a vertex contains a list of its
    successors. On the other hand, the opposite method `getPredecessors()`, which
    will return all predecessors to a vertex is not quite as simple. Here you must
    iterate over all vertices and for every vertex check if it has an edge to the
