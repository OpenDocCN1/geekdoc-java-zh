    ## 2.2 Huffman codes


    As another example of a greedy algorithm, you can look at *Huffman encoding* of
    text that can be used to compress text files, and previously it was a widely used
    method, for example, if you were to transfer text over a communication line. If
    you look at text in the ASCII format, you have 256 different characters, each
