    A B tree is implemented slightly in the same way as a binary tree, and the biggest
    difference is that a node is defined differently, as it should accommodate multiple
    elements and be able to refer to multiple sub-trees. The class `BTree` implements
    a B tree with typical operations, but it is more for the example than it is for
    utility. The work consists primarily of implementing `insert()` and `remove()`
    to ensure that the tree is still a B tree after the operations has been completed.
    The class organizes memory objects in a B tree, meaning that with a large order
    (many elements in a node), the tree gets a low depth and thus the search path
    to a leaf node becomes short, but it is offset by the fact that you must search
    in the individual nodes. In this case, the nodes are searched linearly, and as
    a node is ordered, you could possibly improve the tree by instead searching binary.
    Especially with a tree of a large order one should consider to implements binary
    search in the individual nodes.


    For the reasons mentioned above, a B tree has not the great interest in organizing
    memory objects, and the goal of the B tree is also to organize keys and references
    to disk blocks in memory, thus enabling efficient search in a file and only load
    the disk blocks when they are required.


