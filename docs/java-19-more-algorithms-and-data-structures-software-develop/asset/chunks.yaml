    2. 通过在该子树的根节点进行搜索，你会发现该数字必须在 43 右侧的子树中，但那里是空的，因此没有找到 47。


    因此，这棵树在许多方面与二叉搜索树具有相同的特性。


    最坏的情况下，你必须向下到较低级别来确定一个元素是否存在（这与二叉搜索树相同）。假设树有 `t` 个元素，所有节点都已满且树是“良好”平衡的。如果你从根节点开始搜索，对应于选择一个包含
    ![](img/Java_125.jpg) 个元素的子树。在这里重复搜索，下次将选择一个包含 ![](img/Java_129.jpg) 个元素的子树。重复该操作
    `k` 次后，你将拥有包含 ![](img/Java_130.jpg) 个元素的子树。在最坏情况下，当满足时完成搜索：


    ![](img/Java_131.jpg)


    也就是说在一个阶为 `n` 的良好平衡搜索树中，深度为 ![](img/tekst19__2.jpg)，其中 `t` 是元素数量，因此你最坏情况下可以通过搜索
    ![](img/tekst19__2.jpg) 个节点来找到一个元素。注意，你可以在单个节点中使用二分查找。假设你有一个阶为 100 的搜索树且有 10000000
    个元素。在最坏情况下，你必须搜索：


    ![](img/Java_133.jpg)


    节点。示例告诉我们，平衡搜索树的深度非常小，这正是目标所在，因为搜索树通常用于存储在磁盘上的数据。此时一次加载一个磁盘块，由于读取一个磁盘块与相应的内存操作相比需要很长时间，因此减少磁盘操作是非常关重要的——尽管之后你必须搜索单个磁盘块，但那是在内存中进行的。


    可以实现上述描述的搜索树，但它并没有太大意义，因为它的效率完全取决于树在何处平衡，而且它还应该确保单个节点几乎不为空。因此，我想描述一种能够兼顾这两个条件的变体。它是一种实现了通用平衡树并确保良好搜索复杂度的数据结构，但正如提到的，这种数据结构主要对于永久存储在磁盘上的对象具有意义，因为搜索单个节点的时间可能非常长。


    ## 7.5 B 树


    阶为 `n` 的 `B tree` 是一种阶为 `n` 的搜索树，但其数据元素是形式为 `[K, Q]` 对，其中 `K` 是键，`Q` 是指向存储键 `K`
    数据位置的指针。例如 `Q` 可以（在实践中也是）磁盘块的地址。同样，`B tree` 中的节点可以如下所示：


    ![](img/Image3313.jpg)


    其中 `P` 指针与普通搜索树一样，而 `Q` 指针指向数据块。此外，树必须满足：


    1. 除了根节点和叶子节点外，所有节点至少有 `[n/2]` 个 `P` 指针（即至少 `[n/2]` 个子树）。

    2. 除非根节点是树中唯一的节点，否则根至少有两个 `P` 指针。

    3. 所有叶子节点都在同一层，且叶子节点的特征是所有 `P` 指针均为零。


    例如，所示是一个阶为 4 的 `B tree`（注意我没有显示 `Q` 指针）：


    ![](img/Image3320.jpg)


    这些要求确保了树是良好平衡的，挑战在于如何实现元素的插入和删除，以始终遵守上述要求。


    在 `B tree` 中插入元素可以非正式地描述如下：


    `B tree` 从单个根节点开始，只要有空间，元素就会被插入到这里。当根节点填满且你添加下一个元素时，根节点将分裂为第 1 层的两个节点。中间元素将留在根节点中，而剩余元素将分布在两个新节点之间。如果元素被插入到一个非根的满节点中，它将分裂为同一层级的两个节点，并将中间元素移动到父节点。如果父节点也填满了，则在此处重复该过程，并持续下去最终以创建一个新根节点结束。


    以下是向上述树中插入以下元素的结果：


    2, 3, 5, 7, 41, 53, 29, 31, 37, 63, 59


    当元素按所示顺序插入时。上述树的阶为 4，当你必须分裂节点时，会有 4 个元素，其中中间的元素必须移动到父节点，而其他的将分配到两个子节点上。由于技术原因，我不想显示单个节点中的指针空间，因此起始点是如下树：


    ![](img/Image3328.jpg)


    以下是随着 11 个数字的插入，树的变化。在插入 2 之后：


    ![](img/Image3335.jpg)


    插入 3 之后：


    ![](img/Image3343.jpg)


    插入 5 之后：


    ![](img/Image3352.jpg)


    插入 7 之后：


    ![](img/Image3363.jpg)


    插入 42 之后：


    ![](img/Image3376.jpg)


    插入 53 之后：


    ![](img/Image3383.jpg)


    插入 29 之后：


    ![](img/Image3391.jpg)


    插入 31 之后：


    ![](img/Image3398.jpg)


    插入 37 之后：


    ![](img/Image3406.jpg)


    插入 63 之后：


    ![](img/Image3413.jpg)


    插入 59 之后：


    ![](img/Image3421.jpg)


    在这种情况下，节点的元素个数是奇数。如果是偶数，则需要选择一个元素向上移动。


    在 B 树中删除时，节点可能会少于一半，此时与相邻节点的合并可能会向上传播，并导致树的深度减小。事实上，实现删除并不容易。策略大致如下：


    首先找到要删除元素的节点。接下来，类似于 2-4 树，找到该元素的后继节点，它是一个叶子节点。用后继元素替换要删除的元素，并在叶子节点中删除该后继。之后，可能发生叶子节点不再满半，结果不再是
    B 树，你必须调整树。如果节点有一个直接兄弟且其超过一半，可以通过旋转来解决问题，从该兄弟移动一个元素到父节点，同时从父节点移动一个元素到被删除元素的叶子节点。如果不是这种情况，则删除元素的叶子节点与相邻兄弟合并。


    以下是在上述树中删除元素的一些示例，但由于节点最多有 4 个子树，节点只有在为空时才会半，因此旋转和合并只有在叶子节点为空时才是必要的。


    删除 2 之后。执行了左旋转：


    ![](img/Image3428.jpg)


    删除 11 之后。包含 11 的节点不会为空，因此不需要进一步操作：


    ![](img/Image3436.jpg)


    删除 7 之后。结果是一个空节点，并与右兄弟合并且从父节点移动元素：


    ![](img/Image3445.jpg)


    删除 5 之后。只有替换后继的操作，可以立即删除而无需进一步调整树：


    ![](img/Image3456.jpg)


    删除 13 之后。13 被替换为 19，导致产生空节点。与左兄弟合并并从父节点移动 19 元素。然后父节点为空，与右兄弟合并并从父节点移动 23 元素：


    ![](img/Image3470.jpg)


