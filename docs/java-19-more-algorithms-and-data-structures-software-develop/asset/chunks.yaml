    ## 8.3 Traversing a graph


    As the above graph is implemented, it immediately supports traversing the graph
    and returns an iterator that can be used to iterate over all vertices. The problem
    with this iterator, however, is that it does not guarantee anything in which order
    you reach the individual vertices. Typically, you are interested in starting in
    a certain vertex and then moving forward along the edges of the graph according
    to one or another rule. Two ways are called respectively:


    1. depth first traversing

    2. breadth first traversing


    For both ways, you begin from a start vertex.


    ### Depth first


    At depth first, you will then go to the start vertex, and them followed by a successor
    to that vertex (if there is one that you have not already visited). This continues
    until you can not reach anymore vertices (you have reached as deep in the graph
    as you can). Then backtrack until you reach a vertex where you can go to a successor
    where you have not already been. Finally, you can not go any further either because
    you have visited all vertices or because there is a vertex for which there are
    no paths from the start vertex. Looking at the above graph, the result of a depth
    first traverse with start in A could be:


