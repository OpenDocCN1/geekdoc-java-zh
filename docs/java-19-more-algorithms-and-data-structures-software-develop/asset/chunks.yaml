    a HuffmanTree (and thus a leaf node) in a priority queue, where the priority is
    the frequency. The next *while* loop combines trees. as all times, take the first
    two trees in the queue, combine them and paste the results into the priority queue.
    Finally, they are only one tree, and with this code tree, the two maps are initialized
    with codes.


    After this constructor has been executed, for each byte in a file, you can return
    the corresponding *Bitmap*, which is its binary encoding, and subsequently save
    the result to a compressed file, but it must be possible to go the other way and
    decompress the content. Therefore, the frequencies (the array *code*) are stored
    along with the file’s content, and this is where the other constructor is used
    to restore the code tree.


    Finally, there is the actual program (the class *Huffman*), but I do not want
    to show the class here, as most of it has to do with reading and writing files,
    but basically the program has two methods *compress()* and *deCompress()*. In
    short, the methods works as follows.


    *compress()* starts by creating a *CodeTable* object for the current file. Next,
    it reads the file and creates a large bitmap consisting of all the file’s bytes
    converted to binary code corresponding to the current Huffman encoding. Next,
    the 256 codes, the bitmap length, and bitmap itself are saved in the output file.


    *deCompress()* begins by reading the code table and creates from that a *CodeTable*
    object, which is the same Huffman encoding as the original file was converted
    with. After that, the rest of the file is read and used to create a large bitmap
    with the file’s content. Using the encoding this bitmap is parsed to the files
    original bytes and is written to the output file.


    As mentioned above, the program can compress any file, and the question is how
    good the program is. First, note that when compressing a file, the output file
    starts with 256 codes for the encoding frequencies and an integer for the bitmap
    length and thus a total of 1028 bytes. One can thus conclude that the program
    can not compress small files, and even the opposite, as small files actually fills
    more than the original file (a file with one *int* will fill 1032 bytes instead
    of 4). If the file is large, the 1028 bytes do not mean much and are not decisive
    if you get a win. What matters is the frequency of individual bytes. If all 256
    bytes can occur and if they occur for the most part at high frequency, then the
    program will have no benefit. For example, if you test the program on an image
    (compresses and decompresses) you will see that the program works (the compressed
    file decompresses to the correct result), but the compressed file fills approximate
    the same (if not more) than the original file. If, on the other hand, the original
    file contains plain text, you will need to see a significant gain (maybe 30% or
    more), and the fewer characters that appear, the more the program will compress.


    # 3 Divide and conquer


    Another family of algorithms is *called divide and conquer*, and it is algorithms
    that are recursive, but not all recursive algorithms are divide and conquer algorithms.
    A divide and conquer algorithm consists of two parts:


    1.  *Divide*: The problem is divided into two or more disjunctive but simpler
    problems, which are resolved recursively if the basic case is not reached.


    2.  *Conquer* : The solution to the original problem is found by combining the
    solutions of the sub-problems.


    Classic examples of divide and conquer problems are merge sort and quick sort,
    but also to find the *k*th smallest element in a collection and thus the median
    is solved with a divide and conquer algorithm.


    Therefore, in order to use a divide and conquer algorithm, a problem must be divided
    into smaller sub-problems, each of which is solved recursively according to the
    same template. Here it is important to note that the division should result in
    sub-problems that are simpler than the original problem. It is also important
    to note that the division should result in at least two sub-problems, and for
    example, a recursive binary search is not a divide and conquer algorithm. Finally,
    it is important to note that the sub-problems must be disjunctive. For example,
    I have previously looked at a recursive method that returns the *n*th Fibonacci
    number:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_32.jpg)


    and that the algorithm is highly ineffective for just slightly larger values of
    *n*. Although the algorithm divides the problem into two recursive sub-problems,
    it is not a divide and conquer algorithm as the sub-problems are not disjunctive.


