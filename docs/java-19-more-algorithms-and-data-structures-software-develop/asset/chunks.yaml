    The problem, of course, has practical interest (even in many different situations).
    The problem has been formulated in the early ’30s and has since been of great
    theoretical interest, but when I want to mention the problem here, it is partly
    as an example of a very complex problem, and partly as an example of a problem
    in which not a solution is known – at least not a general solution. However, there
    are algorithms that find local solutions for TSP, and in the following I will
    mention an example. It should be added that both the theory and the number of
    algorithms are extensive and the following does not go much further than a short
    presentation, but it may be a good practice to investigate what you can find online,
    including the many examples of algorithms.


    ## 9.1 More on graphs


    For the sake of the following and TSP, I would like to add some additional definitions
    / remarks to graphs, and in the following `G = (V, E)` refers to a graph.


    Two vertices are said to be `adjacent` if there is an edge between the vertices.
    At the degree of a vertex `v` you understand the number of vertices that are adjacent
    to `v`, and one often use the notation `deg(v)`. If the graph has `n` vertices,
    the degree of a vertex can therefore be max `n-1` (if the vertex does not have
    an edge to itself).


    By a complete graph one understands a graph where two arbitrary different vertices
    are adjacent:


    ![](image/Image5756.jpg)


    In the previous chapter, I have defined a path between two vertices as a sequence
    of edges that connect the two vertices. At that point it was allowed that the
    same vertex could occur several times, but in this chapter I would like a path
    to consist of different vertices apart from the first and the last vertex. In
    particular, a cycle has no repetitions beyond the start vertex, and sometimes
    one calls a cycle for a closed path.


    A path that encompasses all vertices in the graph is called a Hamiltonian path,
    and in particular, you are talking about a Hamiltonian cycle.


    In chapter 7 I have mentioned connected graphs (what all the examples shown above
    have been), but exactly one can say that a graph is connected if there is a path
    from `A` to `B` for each pair of vertices `A` and `B`. If a graph is not connected,
    it means that it consists of several sub-graphs, and here each sub-graph is called
    for a component. If you have a connected graph and if you have an edge where the
    result of removing the edge is a non-connected graph, the edge is called a bridge.
    For example, the edge `{B, G}` below is a bridge:


    ![](image/Image5763.jpg)


    If you have a complete graph, it is clear that there is a Hamiltonian cycle, because
    there is an edge between all pair of vertices, but if the graph is non-complete
    you can not be sure about that. For example, if a graph has a bridge, there is
    not a Hamiltonian cycle, because if the start vertex is on the one side of the
    bridge, one can not cross to the other side without passing the bridge and the
    you can not get back again without visiting the same vertices.


    It is clear that where a graph has a Hamiltonian cycle or not, is determined by
    how dense the graph is. There are several statements that indicates when a graph
    has a Hamiltonian cycle and, for example, I would like to mention one. If a graph
    has `n` vertices, where `n` is greater than or equal to 3, and if


    ![](image/Java_144.jpg)


    the graph has a Hamiltonian cycle. The statement is proved in the field of graph
    theory.


    ## 9.2 More on complexities


    If you consider a Hamiltonian cycle in a complete graph with `n` vertices and
    a start vertex, then you from the start vertex can go to `n-1` other vertices.
    From here there are `n-2` options to go to the next vertex and next time there
    are `n-3` options, and that means there are `(n-1)!` options to go all the way
    around. Since there are also opportunities for starting the vertex, the graph
    contains `n!` Hamiltonian cycles. Now it’s not so wrong, because each cycle has
    an opposite cycle, where the difference is only if you go the one way or the another.
    One can conclude that for a given start vertex, the maximum number of Hamiltonian
    cycles is


    ![](image/Java_145.jpg)


    which corresponds to a permutation of the vertices. One can therefore solve TSP
    with a brute force algorithm, that for a given graph and at a given start vertex,
    determine all Hamiltonian cycles and then determine the one with the smallest
    path length. The problem is simply that the factorial grows incredibly fast, and
    therefore a just slightly larger TSP problems require another algorithm. The idea
    is to divide a TSP problem into sub-problems and hope that they are of a simpler
    complexity class.


    A complexity class covers a family of problems that have a complexity that resembles
    each other. If a problem can be solved with a time complexity expressed by means
    of a polynomial, it is said that the problem’s complexity class is `P`, and that
    it is a `P` problem. Note that it applies to most of the problems I’ve shown in
    this and the previous book, such as linear algorithms, square algorithms, and
    more.


    A decision problem is a problem whose solution is either a yes or no. A family
    of decision problems that can be solved by a deterministic algorithm is said to
    be in the complexity class `NP`. TSP is such a problem since the problem can be
    formulated as:


    *Given an non-directed graph and the distances between all vertices, does there
    exist a Hamiltonian cycle whose distance is less than `c`, for some given total
    distance `c`?*


    This is a yes or no question, and thus is it is a NP problem.


    Let `P1` and `P2` be two decision problems. If an algorithm can be reduced from
    `P1` to `P2` in polynomial time, it is said that `P1` is polynomial reducible
    to `P2`. A problem is NP-complete if it can be proven that it is in the complexity
    class `NP`, and it can be shown that it is polynomial reducible to a problem in
    polynomial time that is already known to be NP-complete.


    A problem is NP-hard if and only if it is at least as hard as an NP-complete problem.
    TSP is such a problem, since its solution includes to find all Hamiltonian cycles
    and then find the shortest one. Traveling Salesman Problem is thus classified
    as NP-Hard.


