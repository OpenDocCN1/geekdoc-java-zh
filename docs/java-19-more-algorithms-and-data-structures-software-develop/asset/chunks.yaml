- fmt: '

    As illustrated several times in the previous, many problems can be described using
    a recursive algorithm, perhaps because the problem is recursive by nature. Implementing
    recursive algorithms is easy, but as mentioned, it can lead to algorithms that
    are highly ineffective because the number of recursive calls explodes. The classic
    example of such an algorithm is a recursive method to determining the Fibonacci
    numbers, and here the solution instead was to write an iterative method. It is
    an example of dynamic programming. The idea is to state with a simple case that
    can be solved. You now save the solutions and proceed, but so that the next solution
    is determined by the solutions already decided. The iterative algorithm to determine
    the Fibonacci numbers starts by determining the first two (which is 0 and 1).
    Then you continue, but so that you always decide the next number as the sum of
    the two previous ones. That is, starting with the simple case and gradually moving
    forward. It is opposite recursion, where starting with the complex case and breaking
    up in minor problems until one reaches a simple case.


    In conjunction with greedy algorithms, I saw on the coin problem, where you has
    to exchange an amount with as few coins as possible, and in that context, I also
    showed that the coins may have such values that a greedy algorithm does not provide
    an optimal solution. However, the problem can be solved optimally with an algorithm
    that uses dynamic programming.


    If you have to exchange an amount `amount`, the strategy is to determine the minimum
    number of coins that will be used to exchange all amounts


    `1, 2, 3, …, amount`


    You start by deciding how many coins to use to exchange 1, which is 1\. Then you
    iterates all amounts from 1 through `amount`. For each value `a`, you iterates
    over all coins `c` (denoted as `c1`, …, `cn`), all the coins whose value is smaller
    or equal to `a`, and you determines


    `m = min { exhange(a* – c1), …, exchange(a* – cn) }`


    Then the minimum number of coins to be used to exchange `a` are equals `m + 1`.
    A little more formally, the method can be described as:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_39.jpg)


    You should note that it is precisely an algorithm based on dynamic programming
    by determining the result for all values less than or equal to the desired amount,
    and constantly applying solutions to minor problems that have already been solved.


    To implement the algorithm, I have started with a copy of the program `CoinProblem`,
    which I have called `CoinProblem1`. The two classes `Coin` and `Coins` are unchanged,
    and the same goes for the test program, except that instead of the class `Greedy`,
    a class `Dynamic` is used:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_391.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_40.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_41.jpg)


    and here it is only the method `exChange()` that has been changed. The method
    creates an array of `List<Coins>` objects, where the object at position `n` must
    contain the `Coin` object to be used to exchange the amount `n`. At position 0
    is added the empty list as it does not require coins to exchange the amount 0\.
    As next step iterates over all amounts `b` from 1 through `amount`. Each iteration
    starts by seting `min` to `b` and `val` to the coin with the value 1\. This corresponds
    to the use of `b` `val`-coins to exchange `b`. `n` is the index used to keep track
    of which coins are already is selected. For each amount there is an inner loop
    that iterates over all coins. If a coin has a value greater than `b`, it can of
    course not be used and you can proceed with the next coin. Otherwise, you test,
    if `b` minus the value of the coin can be exchanged with fewer coins than `min`,
    and if so, set `min` to that value and `val` to the current coin. After you have
    iterated over all coins, the array is updated with the result, you have found.


    Finally, the program must test if there are sufficient coins and if not raise
    an exception. Otherwise, the holding of coins is counted down and the method returns
    the result.


    If you consider the method, you can say that it consists of an outer loop that
    iterates `N` times (if the amount is `N` ) and an inner loop that iterates `K`
    times if there are `K` coins. It is followed by two loops each with `K` iterations.
    The algorithm therefore performs in round numbers:


    ![](image/Java_23.jpg)


    operations. Now `K` usually will be small in relation to `N` and of a fixed size
    (for Danish coins 5), and you can therefore perceive `K` as a constant. Doing
    so, the algorithm has linear complexity.


