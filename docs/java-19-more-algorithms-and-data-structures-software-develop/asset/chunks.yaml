    ## 8.6 最小生成树


    树可以被看作是一个具有起始元素的图，因为树由节点（顶点）组成，每个节点都有一个唯一的父节点（边）。由于每个节点恰好有一个父节点，因此它是一个无环图。通常情况下，图并不是树，但给定一个无向加权图，例如：


    ![](img/Image5648.jpg)


    你可以删除边使其成为一棵树：


    ![](img/Image5655.jpg)


    它是一棵树，这样的树被称为生成树，因为从根节点到任何其他顶点都有路径——所有顶点都被包含在内。在这种情况下，图是加权的，然后你可以尝试确定最小生成树，即一种从根到所有顶点的距离最小的生成树。


    有几种算法可以确定无向加权图的最小生成树，我将展示一种名为 `Prim’s algorithm` 的非常简单的算法。该步骤如下：


    1. 首先选择一个起始顶点并将其加入最小生成树。

    2. 只要所有顶点未加入树，就重复以下操作：从树到尚未加入树的顶点找到最小边，并将其加入树中。


    如果你使用上面的树作为示例并从 A 开始，它将作为根加入树中，同时你将后继节点标记为候选节点：


    ![](img/Image5663.jpg)


    现在你选择到候选节点的最路径，即到 C 的边，此时该顶点被添加到树中，同时选择它的后继节点为候选节点：


    ![](img/Image5670.jpg)


    这意味着树现在包含了 A 和 C 之间的边。下一步，现在选择离树距离最小的候选节点：


    ![](img/Image5678.jpg)


    这次有几个选项：


    [A, B], [C, E], [C, D]


    其中到树的距离均为 2，我选择了第一个。通过将 B 加入树中，它现在包含三个节点，并且有一个新的边作为候选节点（B 和 C 之间的边将不会是候选节点，因为
    C 已经是树中的节点了）。为了为树选择一个新顶点，我再次选择权重最小的候选节点，这次有两个选项。我选择了 E：


    ![](img/Image5687.jpg)


    同时，E 和 I 之间的边变成了一个候选节点。下一次只有一个选项，即 C 和 D 之间的边：


    ![](img/Image5698.jpg)


    以及 D 和 H 之间的边变成了候选节点。现在将顶点连接树的最小候选边是 E 和 I 之间的边，因此将其插入树中：


    ![](img/Image5711.jpg)


    同时有两个新的候选节点，这里 I 和 G 之间权重为 2 的边是最好的：


    ![](img/Image5718.jpg)


    下一条边变成 G 和 H 之间的边：


    ![](img/Image5726.jpg)


    最后是 H 和 F 之间的边：


    ![](img/Image5733.jpg)


    结果是一个如下所示的生成树：


    ![](img/Image5741.jpg)


