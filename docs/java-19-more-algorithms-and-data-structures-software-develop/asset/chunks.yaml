    very often used characters like `e` and `t` use 8 bits, which also applies to
    a characters that are not used so often. One can therefore consider an encoding
    where characters that are widely used are encoded with few bits while characters
    that are rarely used are encoded with more bits. That’s exactly the idea of a
    Huffman encoding.


