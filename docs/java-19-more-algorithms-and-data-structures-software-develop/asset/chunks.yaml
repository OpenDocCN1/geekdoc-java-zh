    编写一个程序，能够测试图的深度优先遍历和广度优先遍历。你可以调用 `GraphTester3` 项目。该项目必须包含以下方法：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_155.jpg)


    构建与 `GraphTester1` 程序中相同的图（具有 9 个顶点和 17 条边）。使用上述方法打印该图，其中 A 应该是起始顶点。


    此外，再构建另一个图，其顶点由字母表示，但这次应该包含 A、`B`、……`Z` 顶点，并按随机顺序添加到图中。接下来，添加随机边，直到图拥有 200 条边。以与上述相同的方式打印图，但请注意可能存在没有路径到达的顶点。


    ## 8.4 最短路径


    这是一整族算法，它们的目标都是找到从一个顶点到另一个顶点的路径，且该路径是最短的。通常，算法的实现方式是：从起始顶点开始找到图中所有其他可达顶点的最短路径。为了使算法具有意义，必须测量某些东西，而这正是权重引入场景的地方。从一个顶点到另一个顶点的“最短路径”是指路径上各边权重之和最小的路径。例如，考虑下面的图，从
    A 到 I 的最短路径是 (A, C, G, I)，其长度（或成本）为 9。在这种情况下很容易看出，但对于更复杂的图，这依然很容易。我将问题描述为寻找最短路径，但当然你也可以将其视为寻找最长路径的问题，区别主要在于反转不等式。在接下来，我将只关注最短路径。


    ![](img/Image4811.jpg)


    ### MinPath


    最短路径算法自然定义在加权图中。然而，我想从别的地方开始观察一个非加权图，其中最短路径应该衡量边的数量，任务是找到从起始顶点到任何其他顶点的路径，但路径包含的边尽可能少。算法可以描述如下：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_156.jpg)


    其思想是：如果你首先找到了到某个顶点的最短路径（如边数），你就无法通过其他方式获得更好的结果。如果你考虑上面的图（忽略所有权重）并从 A 开始，显然到直接后继者
    B 和 C 的最短路径长度为 1，你无法做得得更好。如果你继续处理 B（从队列中取出），你已经找到了通到其后继者 C 的路径，当然，多算一条边并不会更好。相反，还没有找到通往
    E 的路径，最短路径变为通到 B 的路径加 1，即为 2。为了继续进行，下一次将从队列中取出 C。


    我将实现此算法的方法命名为 `minPath()`。它必须返回一个迭代器，遍历所有顶点，并为每个顶点返回到起始顶点的最短路径。为了这一点，我定义了以下类：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_157.jpg)


    它代表了从一个节点到另一个节点的路径，以及沿着该路径的相应成本或权重。`GraphTools` 类扩展了两个新的辅助方法，可以创建通到 `node` 的路径：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-1571.jpg)


    它们用于构建通到 `node` 的路径（一个 `Path` 对象）。这些方法假设之前已经执行了一个算法，该算法找到最短路径存储在 `Node` 对象的 `distance`
    属性中，且 `Node` 对象的 `prev` 变量指向该节点的前驱。也就是说，知道到该顶点的距离，可以通过 `prev` 回到起始顶点并从而获取路径。


    基于这些说明，算法可以实现为如下迭代器：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_158.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_159.jpg)


    基本上，该算法的工作原理类似于遍历算法，会创建一个包含 `Node` 对象的局部映射，但其他部分代码与上述算法完全对应。你应该注意如何通过比较 `distance`
    与 `infinity` 来测试是否找到了最短路径。`distance` 变量在 `Node` 类中被初始化为此值。


    注意，在非加权图中寻找最短路径的算法实际上是下一个最短路径算法的特例，其中所有边的权重均为 1。


    ### Dijkstra 算法


    这是一种用于在有向加权图中寻找最短路径的已知且经典的算法。该算法假设所有权重不为负。过程与 `minPath()` 类似，但你必须记住你确定的第一个路径并不一定是最好的：


    1. 将所有顶点的距离设置为无穷大。

    2. 选择一个起始顶点并将距离设置为 0。

    3. 在未完成的顶点中选择一个已找到最短路径的顶点。

    4. 对于选定的顶点，查看其所有未完成的邻居并计算通过该顶点的距离。如果计算距离小于已知距离，则更新它并设置其前驱。

    5. 重复步骤 3–4，直到所有顶点都完成。


    例如，考虑以下图：


    ![](img/Image4818.jpg)


    最简单的方法是用表格来可视化算法，第一列表示顶点，第二列用于跟踪路径，第三列表示距离，最后一列表示前驱。


    | Vertex | Distance | Predecessor |

    | :--- | :--- | :--- |

    | A | 0 | - |

    | B | ∞ | - |

    | C | ∞ | - |

    | D | ∞ | - |

