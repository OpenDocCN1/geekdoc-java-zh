    ## 6.3 Sudoku


    Sudoku is a popular puzzle game where you have to fill a square with 81 numbers,
    which must have values 1 to 9\. An example could be as shown below, where a Sudoku
    has been defined, 36 of the fields are filled and thus the person who must solve
    the Sudoku has to fill the 45 other places when the following rules must be complied:


    1.  Each row must contain the numbers 1–9


    2.  Each column should contain the numbers 1–9


    3.  Each of the 9 3×3 squares must contain the numbers 1–9


    and the task is solved when all the places are filled. Obviously, the severity
    depends on how many places are pre-filled (by the one who has defined the Sudoku,
    which below is the computer), but it also depends on how the numbers are located.
    It is said that a Sudoku can be solved if it has a unique solution, and as far
    as I know, it is not possible to define a Sudoku in which less than 17 places
    are pre-filled.


    ![](image/Image2934.jpg)![](image/Image2941.jpg)


    In this section I will show a program that can play Sudoku and where it is the
    user’s task to solve the Sudoku. It is a program that has many versions, so it’s
    easy to download a solution that you can compare to. There are generally two challenges:


    1.  The user interface


    2.  Generate a Sudoku


    and in relation to the current book, it is of course the last one that is the
    most interesting.


    As for the user interface, the application opens a window, as shown below. At
    the top, there is a kind of toolbar that has a start button, so you can create
    a new Sudoku. There is a check box, and if you put a check mark here, the program
    will check if the value in a cell is conflicting with the rules (the same number
    twice in the same row and so on) and, if so, you can not fill a cell with the
    number. The combo boxes are used to indicate how many blank cells there should
    be, and thus the severity, and finally there is a label that indicates how many
    times you have changed the value of a cell. The toolbar has two more components,
    which are an entry field and a check box, respectively. The meaning of these components
    is explained below.


    ![](image/Image2949.jpg)


    To fill in a Sudoku you can either use the mouse or use the keyboard. If you click
    in a field (which is not filled in by the machine), the field is selected and
    you can either clear it or insert a number by clicking one of the buttons above
    the Sudoku. Alternatively, you can use the arrow keys and the numeric keypad.
    If you use the arrow keys and no cell is selected, the first cell is highlighted
    in the top row – the first cell that is not filled in by the computer and moving
    the selected cell using the arrow keys, skip the cells that the computer has filled.
    If you want to clear a filled cell, press the Delete key and you want to unselect
    a cell, press End.


