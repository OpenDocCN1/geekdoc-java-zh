    # 8 Graphs


    A graph is a collection of objects, such that there between two objects can be
    a relationship. For example, a graph can be illustrated as follows:


    ![](image/Image3500.jpg)


    where there are 8 objects, as indicated by a letter. The lines illustrates relationships,
    and there is, for example, a relationship between C and G. In a graph, all objects
    play the same role, and thus there are no objects that are root or start objects.
    A little with inspiration in the above figure, you call the objects for vertices,
    while the relationships are called edges, and you define a graph as a data structure
    *G* consisting of two sets *V* (for vertices) and *E* (for edges):


    *G = (V, E)*


    The graph shown in the above figure is thus defined by the following sets


    *V = {A, B, C, D, E, F, G, H}*


    *E = {{A, B}, {A, C}, {A, D}, {C, D}, {C, G}, {C, H}, {D, H}, {H, F}, {F, G},
    {B,C}, {B, E}, {E, G}}*


    In conjunction with a graph, you also define the concept of a *road* or *path*
    between two vertices as a sequence of edges that lead from one vertex to another.
    In the graph above are


    *(A, C, G)*


    *(A, B, C, H, F, G)*


    both paths from *A* to *G*. A bit more formally, a path in a graph *G* is a sequence
    of vertices ![](image/Java_137.jpg) with the property that for all i = 1, 2, …,
    n-1, there is an edge ![](image/Java_138.jpg). The same vertex may appear several
    times, but if all vertices are different, one talks about a simple path.'
