    ## 8.1 Implementing graphs


    In general, it is not easy to implement a graph as a data structure, especially
    because it is difficult to implement the graph’s operations so that they are general
    and with a reasonable time complexity. The implementation of the classic graph
    operations will often depend on the internal representation of a graph and thus
    becomes closely linked to the data presentation.


    One way is to implement a graph is using a 2-dimensional array. Consider again
    the graph:


    ![](image/Image3539.jpg)


    If you use a 2-dimensional array, which indexes are the vertices of the graph
    and you in elements in the array, writes the weights of the edges, you can represent
    the graph as follows:


    |  | A | B | C | D | E | F | G | H |


    | A |  | 2 | 7 | 3 |  |  |  |  |


    | B |  |  | 1 |  | 3 |  |  |  |


    | C |  |  |  | 1 |  |  | 4 | 1 |


    | D |  |  |  |  |  |  |  | 2 |


    | E |  |  |  |  |  |  | 5 |  |


    | F |  |  |  |  |  |  | 6 |  |


    | G |  |  |  |  |  |  |  |  |


    | H |  |  |  |  |  | 3 |  |  |


    The empty cells indicates that there is no edge between the two vertices. For
    example, there is an edge from *A* to *B* with weight 2, but there is no edge
    from *B* to *A*.


    Implementing a graph in this way is somehow natural, but the way has some major
    disadvantages. First, the way is best if the graph is dense (has many edges),
    as the matrix else will get many empty elements and thus a large amount of unused
    space, but the biggest problem is that it is difficult to implement graph algorithms
    effectively as many of the algorithms result in searches, and as another problem,
    it is difficult to expand the graph with new vertices, and even worse to delete
    vertices. For these reasons and because most graphs are sparse in practice, usually
    another implementation is used, where the graph is implemented as a list where
    each node consists of the vertex as well as a list of edges from that vertex.


    For example, I will look at the following graph:


    ![](image/Image4783.jpg)


    which is a weighted graph with 9 vertices and 17 edges. It is therefore a relatively
    thin graph with few edges (17 out of 81 possible). An implementation of the graph
    can be illustrated as follows:


    ![](image/Image4796.jpg)


    where you vertical to the left has a collection with vertices, and each vertex
    has a list of direct successors, that is, a list of the edges that originate from
    that vertex. For each element in this list, the weight of the edge is also attached.


    For example, as a collection for the vertices, you can use a hash table. This
    ensures that it is easy to add new vertices, but most importantly, you can find
    a vertex with constant time complexity. With regard to a collection for edges
    in each vertex, one can also use a hash table, but in most practical applications,
    the number of edges will be few, so you often select a list or perhaps a linked
    list instead. The search in the list for edges will probably be linear, but if
    the graph is sparse (and the lists are short), the linear time is outweighed by
    the overhead, by using a more complex collection like a hash set.


    With these considerations in place, I will address writing a class that can implement
    a graph. The first problem is to define which operations the class should have,
    and thus what you can do with a graph. As a step along the way, I have defined
    the following interface:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_139.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_140.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_141.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_142.jpg)


    where a single helper type is defined:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_1421.jpg)


    which indicates whether a graph is oriented or not. Finally, the following types
    are used, which represent the vertices and edges of the graph:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_1422.jpg)'
