    在这一问题中，你应该尝试实现上述描述的解决最近点问题的算法。一旦你实现了该算法，当然，你还应该对其进行测试，并尝试编写一个测试方法来支持时间复杂度为 ![](img/Java_121.jpg)
    的算法。


    ## 3.2 汉诺塔


    另一个经典问题是*汉诺塔*问题，示例中包含了该问题作为使用分治算法的良好例子。该问题通常描述如下：


    在 19 世纪末，一个名为*汉诺塔*的游戏作为新闻引入了欧洲。这个游戏的流行源于一个轶闻，据说*梵罗马神庙*的司祭正致力于解决一个问题，当这个问题被解决时，世界就会终结。司祭们处理的游戏由一个铜质板组成，上面有三根钻石形的“棒”，上面放着
    64 个直径不同的金色圆盘。最初，所有圆盘都放在左棒上，最大的在底部，其次大的在上，以此类推，即形成一个塔。现在必须将整个塔移动到右棒，但每次只能移动一个圆盘，且圆盘永远不能放置在直径较小的圆盘上。


    ![](img/Image2242.jpg)


    首先，并不完全清楚这个游戏是可以被解决的，其次，正如很多人观察到的，你必须移动很多圆盘——对于 64 个圆盘，真的很多。


    在这一节中，我想写一个程序来模拟这个游戏，用户可以通过拖拽移动圆盘，还有一个程序自动移动圆盘的选项，即演示功能。我不想展示代码，代码大部分关注用户界面，它实际上是演示功能的事件处理器，这是一个分治问题。


    如果你看上面的图（有 `n` 个圆盘），你可以将步骤描述为：


    1. 将 `n-1` 个点的塔移动到中间棒

    2. 将底部圆盘移动到右棒

    3. 将 `n-1` 个点的塔从中间棒移动到右棒


    这显然不是解决方案，但这意味着原始问题被分成了两个更简单的问题和一个平凡的问题——移动 `n-1` 个点的塔比移动 `n` 个点的塔要容易。解决方案因此是朝着正确方向的一，由于塔总可以移动到更大的圆盘上，显然可以通过递归算法解决这个问题。


    如果你有一个 2 个圆盘的塔，算法是：


    1. 将顶部圆盘移动到 2 号棒

    2. 将底部圆盘移动到 3 号棒

    3. 将中间棒上的圆盘移动到 3 号棒


    也就是说，塔可以通过 3 次移动或 ![](img/Java_18.jpg)。假设移动 `n-1` 个圆盘需要 ![](img/Java_19.jpg) 次移动。如果你现在有一个
    `n` 个圆盘塔，你可以按照上述步骤通过 ![](img/Java_20.jpg) 次移动移动塔，上述算法就是一个 ![](img/Java_21.jpg)
    算法。思考 ![](img/Java_22.jpg) 这样世界就不会因为汉诺塔问题而终结。用 Java 编写，该算法可以实现如下：


