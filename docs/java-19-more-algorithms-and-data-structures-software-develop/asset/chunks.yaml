    Note that the new distances are determined as the distance to `B` plus the weight
    of the edge from `B` to the successor. Now the process repeats and I find the
    vertex that has the smallest distance and which is not marked as completed. It
    is `D`, which has the length of the path that is 4. `D` has a single successor
    `E`, and since it is not marked as completed, I investigate if I can get a better
    way of crossing `D`. I can (the length is infinity), and if I go through `D`,
    the distance can be calculated to 6:


    | A | ok | 0 |  |

    | B | ok | 2 | A |

    | C |  | 6 | A |

    | D | ok | 4 | B |

