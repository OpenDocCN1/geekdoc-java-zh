    3. 最早开始

    4. 最早结束

    5. 最晚开始

    6. 最晚结束

    7. 总时差

    8. 自由时差

    9. 活动的直接后继任务


    对于整个项目：


    1. 项目的持续时间

    2. 关键路径


    只有在计划中没有循环的情况下才能进行时间和和时间留量的计算。如果是这种情况，必须打印一条消息。


