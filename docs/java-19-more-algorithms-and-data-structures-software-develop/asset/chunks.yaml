    # 3 Divide and conquer


    Another family of algorithms is *called divide and conquer*, and it is algorithms
    that are recursive, but not all recursive algorithms are divide and conquer. A
    divide and conquer algorithm consists of two parts:


    1. *Divide*: The problem is divided into two or more simpler problems, which are
    resolved recursively if the basic case is not reached.

    2. *Conquer*: The solution to the original problem is found by combining the solutions
    of the sub-problems.


    Classic examples of divide and conquer problems are merge sort and quick sort,
    but also to find the *k*th smallest element in a collection and thus the median
    is solved with a divide and conquer algorithm.


    Therefore, in order to use a divide and conquer algorithm, a problem must be divided
    into smaller sub-problems, each of which is solved according to the same template.
    Here it is important to note that the division should result in sub-problems are
    simpler than the original problem. It is also important to note that the division
    should result in at least two sub-problems, and for example, a recursive binary
    search is not a divide and conquer algorithm. Finally, it is important to note
    that the sub-problems must be disjunctive. For example, I have previously looked
    at a recursive method that returns the *n*th Fibonacci number:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_32.jpg)


    and that the algorithm is highly ineffective for just larger values of *n*. Although
    the algorithm divides the problem into two recursive sub-problems, it is not a
    divide and conquer algorithm as the sub-problems are not disjunctive.


