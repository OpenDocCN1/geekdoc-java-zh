    # 3 分治法


    另一类算法被称为*分治算法*，它们是递归算法，但并非所有的递归算法都是分治算法。分治算法包含两个部分：


    1. *分治（Divide）*：将问题分为两个或多个更简单的问题，如果未达到基本情况，则递归地解决。

    2. *解决（Conquer）*：通过结合子问题的解决方案找到原始问题的解决方案。


    分治问题的经典例子是归并排序和快速排序，但寻找集合中的第 *k* 小元素（即中位数）也是用分治算法解决的。


    因此，为了使用分治算法，必须将问题分解为更小的子问题，每个子问题都按照相同的模板进行解决。这里重要的是，这种分解应该产生比原始问题更简单的子问题。同样重要的是，分解应该至少产生两个子问题，例如，递归二分查找就不是分治算法。最后，重要的是子问题必须是互斥的。例如，我之前看过一个返回第
    *n* 个斐波那契数的递归方法：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_32.jpg)


    并且该算法对于较大的 *n* 值非常无效。虽然该算法将问题分为两个递归子问题，但由于子问题不互斥，它不是分治算法。


