    # 7 More about trees


    In the previous book I have treated binary trees, and especially binary search
    trees. As an example of a balanced binary search tree, I have shown an AVL tree.
    In this chapter I will look a bit more on trees, where I will partly show the
    implementation of another balanced binary search tree, called a `red-black tree`,
    and I will also give an introduction to general search trees.


    ## 7.1 2-3-4 trees


    Before looking at the implementation of a red-black tree, I will look at a tree,
    which is called a 2-3-4 tree, which is a tree of degree 4 and hence a tree where
    a node can have no more than 4 children. I do not want to implement the tree,
    but it can be used to explain another method of balancing binary trees.


    A node may have one, two or three values:


    ![](image/Image2964.jpg)


    It is a tree with a root, and (assuming that the same element must not occur twice)
    are the rules:


    1. A node has elements that are arranged in ascending order.

    2. A 2-node (one-value node) has two sub-trees, and the value is greater than
    all elements in the left sub-tree and less than all values in the right sub-tree.

    3. A 3-node (a two-value node) has three sub-trees, where the first element is
    larger than all elements in the left and less than all values in the middle sub-tree
    and the second element is greater than all the values in the middle sub-tree and
    less than all values in the right sub-tree.

    4. A 4-node (a three-value node) has four sub-trees (as numbered from the left,
    respectively, the first, second, third and fourth sub-trees), where the first
    element is greater than all values in the first sub-tree and less than all values
    in the second sub-tree, the middle element is greater than all values in the second
    sub-tree and less than all values in the third sub-tree and the last element is
    greater than all values in the third sub-tree and less than all values in the
    fourth sub-tree.


    If you want to insert an element, you search from the root and find the node where
    the element is to be inserted. If it is a 2-node or a 3-node, the element can
    be inserted directly. On the other hand, if it is a 4-node, the node is split
    into two 2-nodes, where the middle value is inserted in the parent. The new element
    can then be inserted into one of the two 2-nodes that results from the split.
    When the middle element is moved to the parent, the result can of course be that
    parent becomes full, and if so, the split must be repeated at this level.


    As an example, I have shown below what happens if you construct a 2-3-4 tree consisting
    of the elements A, T, B, N, C, L, G, J, I and inserted in this order:


    ![](image/2974.jpg)[](image/2985.jpg)[](image/2998.jpg)[](image/3005.jpg)[](image/3013.jpg)[](image/3020.jpg)[](image/3028.jpg)[](image/3035.jpg)[](image/3043.jpg)[](image/3050.jpg)[](image/3058.jpg)[](image/3067.jpg)
    Suppose that you then insert K. The insertion must take place in a 4-node, which
    is is to split again:


    [](image/3072.jpg) The result is that G becomes root, as shown below.


    ![](image/3075.jpg) Deleting an element is more difficult (there are several cases),
    and it is based on rotations and fusions. Deleting an element can be described
    as follows:


    *   Find the element to deleted.

    *   If the element is not a leaf node, it may be replaced by the successor in
    leaf node.

    *   If the element to be deleted is in a leaf node and it is not a 2-node, it
    can be deleted immediately.

    *   Perform the following if on the the from the root to the leaf node you meet
    a 2-node (but not for the root, which is specially treated):


    1. If parent is a 2-node and the sibling nodes also 2-node, all three nodes are
    combinedto a new 4 node. Then the parent’s current node will never be a 2-node.

    2. If there is a sibling on one of the sides that is not a 2-node, a rotation
    with this sibling is performed. As a result, elements from sibling are moved to
    parent, while an element from parent moves to the current node, which is then
    a 3-node.

    3. If there is no sibling with more than one value, a fusion is performed with
    the parent and a sibling. The result is a new 4-node.


    The procedure can best be illustrated by a few examples. Suppose that in the above
    you you want delete I. On the way to I, you will not meet 2-nodes (except for
    the root), so no adjustments will be made to the tree. You are in a 2-node and
    it has a sibling that is not a 2-node. Therefore, a rotation must be performed
    where K moves up one level while J moves down to the same node as I, which can
    then be deleted. The result is as shown below:


    ![](image/3078.jpg)


    Suppose then you want delete J. On the way down to J there are no 2-nodes, so
    there is no adjustment of the tree. J is in a 2-node, and its sibling is also
    a 2-node, and therefore there must be a fusion of the two nodes containing J and
    L and the element K from the parent node. The result is a 4 node from which J
    can be deleted:


    ![](image/3092.jpg)

