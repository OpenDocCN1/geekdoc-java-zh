    对象。在位置 0 处添加空列表，因为它不需要硬币兑换金额 0。


    问题在于你不知道要除以哪些数字（`primes`）。假设任务是写一个可以返回第 `n` 个质数的方法。使用上述第一个方法，你可以实现：


