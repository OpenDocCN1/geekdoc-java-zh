    ## 7.5 B trees


    A `B tree` of the order `n` is a search tree of the order `n`, but where the data
    elements instead are a pair of the form `[K, Q]`, where `K` is the key and `Q`
    is a pointer to the place where the data of the key `K` is stored. `Q` could for
    example (and in practice will be) the address of a disk block. Similarly, a node
    in a `B tree` can be illustrated as follows:


    ![](image/Image3313.jpg)


    where the `P` pointers are as in the ordinary search tree, while the `Q` pointers
    point to data blocks. In addition, the tree must meet:


    1. All nodes except the root and leaf nodes have at least `[n/2]` `P` pointers
    (that is at least `[n/2]` sub-trees).

    2. The root has at least two `P` pointers unless the root is the only node in
    the tree.

    3. All leaf nodes are on the same level, and a leaf node is characterized by that
    all `P` pointer being zero.


    For example, a `B tree` of the order 4 is shown below (note that I have not shown
    the `Q` pointers):


    ![](image/Image3320.jpg)


    These requirements ensures that the tree is reasonably balanced and the challenges
    are to implement insertion and deletion of elements in such a way that the above
    requirements are always respected.


    Inserting an element in `B tree` can be described informally as follows:


    A `B tree` starts with a single root node, and elements are insert here as long
    as space is available. When the root is filled up and you add the next element,
    the root is split into two node at level 1. The middle element will stay in the
    root while the remaining elements are split between the two new nodes. If an element
    is inserted into a filled node that is not the root, it is split into two nodes
    at the same level and the middle element is moved to the parent node. If it then
    is filled, the process is repeated here, and it continues and eventually ends
    with the creation of a new root.


    Below is the result of inserting the following elements into the above tree:


    2, 3, 5, 7, 41, 53, 29, 31, 37, 63, 59


    when the elements are inserted in the order shown. The above tree has the order
    4, and when you must split a node, there are 4 elements where the middle must
    be moved to the parent node, while the others are to be distributed on two child
    nodes. For technical reasons, I do not want to show room for the pointers in the
    individual nodes, and the starting point is thus the following tree:


    ![](image/Image3328.jpg)


    Below is what happens to the tree as the 11 numbers are inserted. Here after 2
    has been inserted:


    ![](image/Image3335.jpg)


    After 3 is inserted:


    ![](image/Image3343.jpg)


    After 5 is inserted:


    ![](image/Image3352.jpg)


    After 7 is inserted:


    ![](image/Image3363.jpg)


    After 42 is inserted:


    ![](image/Image3376.jpg)


    After 53 is inserted:


    ![](image/Image3383.jpg)


    After 29 is inserted:


    ![](image/Image3391.jpg)


    After 31 is inserted:


    ![](image/Image3398.jpg)


    After 37 is inserted:


    ![](image/Image3406.jpg)


    After 63 is inserted:


    ![](image/Image3413.jpg)


    After 59 is inserted:


    ![](image/Image3421.jpg)


    In this case, the number of elements in a full node is odd. If the number is even,
    it is necessary to choose a strategy for which element to move up – it does not
    matter if you choose one or the other.


    When you delete in a B tree, a node may become less than half full, and then a
    merge with a neighbor can propagate up through the tree and can result in a tree
    with smaller depth. In fact, it is not easy to implement deletion. The strategy
    is roughly as follows:


    You start by finding the node that contains the element to be deleted. Next, as
    in 2-4 tree, the node that contains the element’s successor, which is a leaf node,
    should be found. The element to be deleted is then replaced with its successor,
    and the successor is deleted in the leaf node. After that it may happen that the
    leaf node is no longer half full, and the result is no longer a B tree, and you
    must adjust the tree. If the node has a direct sibling, which is more than half
    full, the problem can be solved with a rotation, moving an element from this sibling
    to the parent, while moving an element from parent to the leaf where an element
    was deleted. If this is not the case, the leaf node where an element is deleted
    is merged with a neighbor sibling and an element from parent.


    Below are some examples where elements are deleted in the above tree, but since
    a node can only have 4 sub-trees, a node is only half full when it becomes empty
    so rotations and merging will only be necessary when a leaf is empty.


    After 2 is deleted. A left rotation has been performed:


    ![](image/Image3428.jpg)


    After 11 is deleted. The node containing 11 will not be empty, so no further operations
    need to be done:


    ![](image/Image3436.jpg)


    After 7 is deleted. The result is an empty node and a merge with the right sibling
    and an element from parent is performed:


    ![](image/Image3445.jpg)


    After 5 is deleted. There is only a replacement with the successor, that immediately
    can be deleted without further adjustments of the tree:


    ![](image/Image3456.jpg)


    After 13 is deleted. 13 is replaced with 19, resulting in an empty node. A merge
    with the left sibling and element 19 from parent is performed. Then parent is
    empty and a merge with the right sibling and the element 23 from parent is performed:


    ![](image/Image3470.jpg)

