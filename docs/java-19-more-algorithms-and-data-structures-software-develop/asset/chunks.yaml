    # 7 关于树的更多信息


    在之前的书中，我处理了二叉树，特别是二叉搜索树。作为平衡二叉搜索树的一个例子，我展示了 AVL 树。在本章，我将更多地讨论树，部分展示另一种名为`红黑树`的平衡二叉搜索树的实现，并将介绍通用搜索树。


    ## 7.1 2-3-4 树


    在查看红黑树的实现之前，我将查看一种被称为 2-3-4 树的树，这是一个为 4 的树，因此节点最多可以有 4 个孩子。我不想实现这种树，但它被用来解释另一种平衡二叉树的方法。


    一个节点可能包含一个、两个或三个值：


    ![](img/Image2964.jpg)


    它是一个带有根节点的树，（假设相同元素不会出现两次）规则如下：


    1. 节点中的元素按升序排列。

    2. 2-节点（单值节点）有两个子树，其值大于左子树中的所有元素，小于右子树中的所有值。

    3. 3-节点（双值节点）有三个子树，其中第一个元素大于左子树的所有元素并小于中间子树的所有值，而第二个元素大于中间子树的所有值，并小于右子树的所有值。

    4. 4-节点（三值节点）有四个子树（分别从左到右编号第一、第二、第三和第四个子树），其中第一个元素大于第一个子树的所有值并小于第二个子树的所有值；中间元素大于第二个子树的所有值并小于第三个子树的所有值；最后一个元素大于第三个子树的所有值并小于第四个子树的所有值。


    如果您想插入一个元素，可以从根节点开始搜索并找到要插入该元素的节点。如果是 2-节点或 3-节点，可以直接插入该元素。另一方面，如果是 4-节点，该节点将分为两个
    2-节点，并将中间值插入到父节点中。然后，新元素可以插入到分裂产生的两个 2-节点之一。当中间元素移动到父节点时，结果自然可能是父节点也变满了，如果是这样，则必须在该层级重复分裂。


    作为一个示例，我在下面展示了如果由元素 A, T, B, N, C, L, G, J, I 构造一个 2-3-4 树并按此顺序插入会发生什么：


    ![](img/2974.jpg)[](image/2985.jpg)[](image/2998.jpg)[](image/3005.jpg)[](image/3013.jpg)[](image/3028.jpg)[](image/3035.jpg)[](image/3043.jpg)[](image/3050.jpg)[](image/3058.jpg)[](image/3067.jpg)[](image/3071.jpg)
    假设然后插入 K。插入必须在一个 4-节点中进行，这会导致再次分裂：


    [](image/3072.jpg) 结果是 G 变成了根节点，如下所示。


    ![](img/3075.jpg) 删除元素要更困难一些（有几种情况），它基于旋转和合并。删除元素可以描述如下：


    *   找到要删除的元素。

    *   如果该元素不是叶子节点，则可以用后继节点替换它。

    *   如果要删除的元素位于叶子节点中且不是 2-节点，则可以直接删除。

    *   如果在从根节点到叶子节点的过程中遇到了 2-节点（根节点除外），则执行以下操作：


    1. 如果父节点是 2-节点且兄弟节点也是 2-节点，则将所有三个节点合并成一个新的 4 节点。这样父节点的当前节点就不会是 2-节点。

    2. 如果一侧的兄弟节点不是 2-节点，则与该兄弟节点执行旋转。结果是将兄弟节点的元素移动到父节点，而父节点的一个元素移动到当前节点，该节点随后变为 3-节点。

    3. 如果没有多个值的兄弟节点，则与父节点和节点执行合并。结果是一个新的 4 节点。


    通过几个示例最好地说明这一过程。假设在上面你想删除 I。在到达 I 的路径上，你不会遇到 2-节点（根除外），因此不对树进行任何调整。你处于一个 2-节点中，它有一个不是
    2-结的兄弟节点。因此，必须执行旋转，让 K 向上移动，同时 J 移动到与 I 相同的节点，然后就可以删除 I。结果所示：


    ![](img/3078.jpg)


    假设然后你想删除 J。在到达 J 的路径上没有 2-节点，因此没有树的调整。J 位于一个 2-节点中，它的兄弟节点也是 2-节点，因此必须将包含 J 和 L
    的两个节点以及父节点中的元素 K 进行合并。结果是一个 4 节点，可以从中删除 J：


    ![](img/3092.jpg)


