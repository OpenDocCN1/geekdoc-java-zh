    # 5 Backtracking


    Often the algorithm to solve a problem is obvious, but in other contexts it may
    be difficult to find an algorithm, and in particular it may be difficult to choose
    the correct algorithm. In this chapter, I will look at a family of algorithms,
    known as `backtracking`, and it is best characterized as a systematic way to search
    for a solution to a problem by reviewing all possible solutions. As an example,
    I will look at the so-called `Eight Queens Problem`:


    *A chessboard consists of 64 fields organized in a square with 8 rows and 8 columns.
    In a chess game, the queen can be moved horizontally in a row, vertically in a
    column and diagonally, thus striking another piece on one of the places to which
    the queen can be moved. The problem now is to place 8 queens on a chessboard so
    none of them can strike each other.*


    One solution to the problem could be to let a computer systematically review all
    of the options until a solution is found. A chessboard has 64 fields and placing
    8 queens on a chessboard consists in choosing 8 out of 64 fields and the number
    of ways to do it is the binomial coefficient , which is the number 4426165368
    so that even on a fast computer it is not a particularly passable road. However,
    the problem can be reduced by observing that each row can contain no more than
    one queen, and the same applies to each column. It significantly reduce the problem.
    For each of these options, check that none of the queens can hit each other diagonally.
    However, the solution method can be further improved by proceeding more systematically.
    You start by placing a queen in the first column of the top row. Next, place a
    queen in the second column by starting at the top of the column and continuing
    until you find a place where it can not strike the queen in the first column.
    Now continue with the third column where you start again at the top and go down
    until you find a place where it can not strike one of the first two queens. You
    then continue as long as possible. When placing a queen in the sixth column, it
    goes wrong. Whichever row you try, it will be able to strike one of the five queens
    that are located.


    ![](image/Image2746.jpg)


    You now skips the last queen that is located (the queen in the fifth column).
    You are backtracking and then try one of the places that have not been tried.
    It’s going well at the last place. You then tries again with the sixth column,
    but it is still not good.


    ![](image/Image2753.jpg)


    You must therefore skip the last queen, but as there are no more places in this
    column (the fifth column), you must backtrack once again and skip the queen in
    the fourth column and try with a new location. One tries again, and this time
    it is possible to place queens in the first seven columns, but in the eighth it
    goes wrong and you have to backtrack.


    ![](image/Image2761.jpg)


    You must continue until you find a solution. Here it is important that the problem
    has a solution as otherwise you will continue indefinitely. The idea is to systematically
    try to find a solution by going on until you have either found the solution or
    until you can find that you have ended up in a dead end. If that’s the case, you’ll
    get back and try again. Note that the problem has many solutions and that the
    method simply provides a single solution.


    ![](image/Image2768.jpg)


    If you are to write a program that can solve this problem, you must be able to
    represent the game, and you must keep track of which locations have been tried.
    Regarding the first, the game can simply be represented as a 2-dimensional array
    of `boolean` elements, which indicates whether a place contains a queen or not.
    To keep track of which locations have been tried, you can use on two counters
    for rows and columns. The following class shows a solution of the eight queen
    problem:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_54.jpg)!!(image/Java_19_–_More_algorithms_and_data_structures_15-11-18_55.jpg)


    Note that the class’s constructor has a parameter that indicates the size of a
    chess game. In relation to a real chess game (which always has a size of 8 × 8),
    of course it does not matter much, but the eight queens problem is actually general
    and applies to sizes other than 8, so this parameter for the constructor. The
    method `ok()` tests whether you can put a queen in the place `(row, col)`, while
    it is the method `nextQueen()` that uses backtracking. If `col` is equal to the
    square size, the problem is solved and the method returns `true`. If not you run
    over all rows in the column `col`, and for each row you try to set a queen. If
    you can do that, put a queen


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_56.jpg)


    and continue (recursively) with the next column, and if it is not possible, you
    must backtrack:


    ```

    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_561.jpg)

    ```


    Also note that if you start setting the first queen differently (not in row 1),
    you will find another solution, and the problem actually has many solutions.


    The following program used the class `Queens` to solve the eight queens problem,
    partly with 8 queens and partly with 15:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_562.jpg)!(image/Java_19_–_More_algorithms_and_data_structures_15-11-18_57.jpg)


    Backtracking is a solution technique that can be used in many contexts where you
    try to find a solution with a partial solution and where you try to get back and
    forth when you realize that you are building a solution which can not lead to
    a result. Backtracking is significantly better than just trying with all possibilities
    (a brute force algorithm), but it should be noted that backtracking typically
    does not have a good time complexity.


    ## Exercise 3: EightQueens, all solutions


    Create a copy of the program `EightQueens`. You must add another test method that
    solves the eight queens problem (with 8 queens) when the method must determine
    all solutions (there are 92).


    ## 5.1 Permutations


    As another example of a problem that can be solved with a backtracking algorithm,
    I will look at a problem that consists in determining all permutations of `n`,
    where `n` is a positive integer. By a permutation of a positive number `n`, one
    understand the `n` positive integers that are less or equal to `n` in one order
    or another. For example there are 6 permutations of 3:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_58.jpg)


    Note that in general there is `n!`* permutations of `n`. A strategy for determining
    all permutations of `n` could be:


    1.  Repeat for all `k` from 1 to `n` and an empty permutation.

    2.  Add `k` to the permutation.

    3.  If it results in a legal partial solution repeat step 2–4 recursively for
    all `j` from 1 to `n`.

    4.  Else `backtrack`


    that is to say, you try successively with all numbers until you find one that
    can be used. Of course, you should be careful that during the placement of a number
    you do not try the same number several times. It can be formulated in the following
    algorithm:


    ```

    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_581.jpg)!(image/Java_19_–_More_algorithms_and_data_structures_15-11-18_59.jpg)!(image/Java_19_–_More_algorithms_and_data_structures_15-11-18_60.jpg)

    ```

