  trans: '

    你必须编写一个与《Java 18》书籍中的 `AVLProgram`（练习 16）几乎相同的程序，唯一的区别是必须将所有的 `AVLTree` 替换为 `RBTree`。


    ## 7.3 通用树


    在本章的剩余部分，我将介绍通用树的实现，这种树在之前的书中简要提到过。事实上，编写一个表示通用树的抽象数据类型并不容易，至少要做到既有效又实用的很难；但相反，有很多例子显示数据被组织成通用树（只需想想磁盘的文件系统，或者例如
    `JavaFX` 中的 `TreeView` 控件），因此有兴趣编写一个表示通用树的类是有充分理由的。


    在本节中，我只想处理一种除了其他要求之外的树，即元素是按层次结构组织的，每个元素都有唯一的父节点（除没有父节点的根节点外）。该树可以定义如下：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_106.jpg)


    在这里你应该注意到，只有少数方法主要限于插入元素、删除元素以及使用 `find()` 查询元素是否存在于树中。你还应该注意到，这些方法直接引用了内部节点，从而引用了树的实现，这是实现通用树的问题之一。数据封装并没有那么理想。最后，你应该注意到接口规定了树应该实现迭代器模式。


    树是由 `TreeNode<T>` 节点构建的，其中 `T` 是树必须组织的元素的数据类型。该类如下：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1061.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_107.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_108.jpg)


    这一次该类有更多的引用，节点可以引用其他节点。由于节点的度可以是任意的，因此节点拥有一个指向子节点的引用列表，从而指向子树。你应该注意到这个列表总是被创建的，这并不是必要的，因为所有叶子节点都不需要这个列表。因此，只需为复合节点创建列表就可以获得更好的效率，而我总是创建这些列表是为了让代码更简单一点。另外注意，节点有一个父节点指针，因此引用其父节点。这些指针的目的是使某些方法的实现更有效。最后，注意节点有一个层级（level），所以你知道它处于树的哪一层。注意子节点列表中的元素数量就是该节点的度。


    类的方法相当显而易见，但你必须注意 `add()` 方法，它创建一个新节点并将其作为当前节点的子。你还应该注意 `remove()` 方法，它删除当前元素。这是通过在父节点的子列表中删除当前元素来实现的。注意，这意味着删除了以当前元素为根的子树。`remove()`
    方法首先测试节点的父是否为零，因为是不可能的删除根节点的。


    树本身可以这样实现：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_109.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_110.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1111.jpg)


    在这里方法的实现非常简单，唯一的异常是作为内部类实现的迭代器。首先要决定各个元素的访问顺序，我选择了按层序（level order）进行。因此，迭代器可以使用队列来实现，这与我在前一书中实现二叉树层序遍历的方式非常相似。


    如果你考虑 `add()` 和 `remove()` 方法，它们实际上极其高效，因为它们是以常数时间复杂度实现的，但这种高效显而易见是因为它们要求你知道要插入新元素的节点或要删除的节点。另外注意，以常数时间复杂度实现
    `remove`，是因为节点有一个父节点指针。要找到一个节点（必须被删除或作为新节点的父节点），请使用 `find()` 方法，这就是问题所在，因为它具有线性时间复杂度。


    最后，注意 `getPath()` 方法，它返回从根到节点的路径。当你能以合理的效率实现这个方法时，再次归功于父引用。


    该类没有实现返回树的高度或树度的方法。要很好地这样做并不容易，因为它们通常具有线性复杂度。可以尝试维护两个实例变量分别表示高度和度，它们应该在 `add()`
    和 `remove()` 的同时进行维护。在 `add()` 方面很简单，但在 `remove()` 方面就不那么容易。根据目前的实现，你可以通过遍历树来确定高度度和。


    ## 练习 5：测试通用树


    你必须编写一个程序，当调用 `TreeTester` 时测试上述 `GeneralTree`。程序可以概述如下：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1121.jpg)


    ## 7.4 搜索树


    在之前的书中以及上面的红黑树中，我看过二叉搜索树，可以在对数时间内找到元素。你也可以考虑通用搜索树，它是度为 `n` 的树，由节点组成，每个节点包含 `n-1`
    个搜索值和 `n` 个指向子树的指针：


    ![](img/Image3298.jpg)


    其中：


