    ## 8.5 拓扑排序


    现在我将查看一种执行所谓拓扑排序的算法。这与无环有向图（也称为无环图）相关的算法。拓扑排序对有向无环图中的顶点进行排序，使得如果从 U 到 V 有路径，那么
    V 出现在 U 之后。


    首先注意，无环图的要求是必要的，否则如果两个顶点 U 和 V 是一个环的顶点，那么既有从 U 到 V 的路径，也有从 V 到 U 的路径：


    ![](img/Image5479.jpg)


    如 [U, W, V] 和 [V, U]。注意拓扑排序对于无权图是有意义。最后，注意拓扑排序通常不是唯一的，通常会有多个解来构成一个拓扑排序。实现拓扑排序相对简单，最好通过示例来解释该算法。考虑以下图：


    ![](img/Image5487.jpg)


    很容易说服人们它是一个无环图。顶点的入度（fan-in）指的是前驱节点的数量。入度为 0 的顶点没有前驱节点。这适用于顶点 A，例如 D 的入度为 3。现在的方法是为每个顶点标记上其入度：


    ![](img/Image5497.jpg)


    你现在从入度为 0 的顶点开始（如果有多个，则选择其中一个）。这将是拓扑排序中的第一个顶点（见下文）。同时，你减小所选顶点的所有直接后继节点的入度。在这种情况下，有
    B、C 和 D。这些顶点中至少有一个顶点的入度为 0，因为否则图中存在环。该算法现在在每次迭代中选择一个入度为 0 的顶点（如果有多个，则选择哪一个并不重要），并将其添加到拓扑排序的顶点列表中。此外，所有直接后继节点的入度都减
    1。继续进行直到所有节点（如果可能的话）都被添加到拓扑排序列表中。下面是第一次迭代的结果：


    ![](img/Image5509.jpg)


    作为下一步，应该将 B 添加到列表中：


    ![](img/Image5523.jpg)


    以及后续步骤的结果：


    ![](img/Image5530.jpg)[](image/Image5538.jpg)[](image/Image5545.jpg)[](image/Image560.jpg)


    ### 算法细节与复杂度


    算法可以描述如下：遍历所有顶点，在每次迭代中选择一个入度为 0 的顶点，将其添加到结果中，并减少所有后继节点的入度。你必须“查看”所有的边，因此时间复杂度与边的数量成线性关系。


    实现该算法相对容易。每当你获得一个入度为 0 的顶点，就将其插入队列，直到队列为空。事实上，我实现了两个版本的算法：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_177.jpg)


    用于确定图中元素的拓扑排序并以列表形式返回，以及


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_178.jpg)


    用于测试图中是否存在环。


    ### 应用：最短路径


    拓扑排序的应用是确定最短路径。假设你有如下无环权图，出于技术原因，我在各个顶点中写了入度：


    ![](img/Image5568.jpg)


    我想从 A 开始并确定到所有其他顶点的最短路径。现在的想法按照拓扑排序遍历顶点并持续更新直接后继节点的距离。当你处于一个入度为 0 的顶点时，没有后继节点可以提供更好的结果（没有未访问的前驱节点），因此你找到了最短路径。从
    A（入度为 0）开始时，你确定了后继节点的初步最短路径（如图中蓝色所示），同时减少了后继节点（B、C 和 D）的入度：


    ![](img/Image5575.jpg)


    下一个处理的顶点是 B。由于 B 没有其他前驱节点，到 B 的最短路径为 4。接下来确定后继节点的最短路径，为 B 的距离加上边的权重。如果它比已经发现的路径更好（可能是无穷大），则更新距离，否则什么都不发生。在这种情况下，E
    的距离被设置为 6，而 D 的距离不改变（4 + 1 > 2）。更新距离后，后继节点的入度减 1：


    ![](img/Image5584.jpg)

