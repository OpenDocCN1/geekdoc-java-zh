  raw: 'A B tree is implemented slightly in the same way as a binary tree, and the
    biggest difference is that a node is defined differently, as it should accommodate
    multiple elements and be able to refer to multiple sub-trees. The class *BTree*
    implements a B tree with typical operations, but it is more for the example than
    it is for utility. The work consists primarily of implementing *insert()* and
    *remove()* to ensure that the tree is still a B tree after the operations has
    been completed. The class organizes memory objects in a B tree, meaning that with
    a large order (many elements in a node), the tree gets a low depth and thus the
    search path to a leaf node becomes short, but it is offset by the fact that you
    must search in the individual nodes. In this case, the nodes are searched linearly,
    and as a node is ordered, you could possibly improve the tree by instead searching
    binary. Especially with a tree of a large order one should consider to implements
    binary search in the individual nodes.


    For the reasons mentioned above, a B tree has not the great interest in organizing
    memory objects, and the goal of the B tree is also to organize keys and references
    to disk blocks in memory, thus enabling efficient search in a file and only load
    the disk blocks when they are required.


    ## Exercise 6: Test BTree


    You must write a program that you can call *BTreeTester*, which will test the
    class *BTree*. The program must have a method *test1()* that creates a *BTree*
    of the order 6 for *Integer* objects. You must then print the tree’s order, the
    number of elements and the height of the tree. The method must then insert the
    numbers from 10 to 99 in the tree, but in random order. Next, the method must
    print the same information as above, the smallest and the largest element, the
    elements of the tree on one line using an iterator, and finally the tree itself
    using the class’s *toString()* method.


    You must then write a method *test2()*, which creates a *BTree* for *Character*
    objects. Next, the method must insert the 26 letters A–Z in the tree when they
    must be inserted in random order. The method must then perform a loop, which for
    each iteration prints the same information as *test1()* and then deleting a random
    element in the tree. This iteration must be repeated until the tree is empty.


    The class *RBTreeTester* (exercise 5) has a method *test3()*. Copy this method
    to the current class *BTreeTester*. The method compares the performance of three
    trees (a *RBTree<Integer>*, a *BinSearchTree<Integer>* and a *java.util.TreeSet<Integer>*).
    Expand the method with another fourth tree, but this time of the type *BTree<Integer>*
    to perform the same operations on the tree. Try experimenting a little with the
    tree order (the tree faneout) and whether it is important for the performance.


    ## 7.6 B+ trees


    A B tree is characterized by a big faneout – or that’s what it’s all about: Big
    faneout and low depth = few disc operations. For all leaf nodes, it means that
    they contain many pointers for sub-trees, which are always *null*, and to avoid
    that, you usually implement a variant of the B tree, which is called a B+ tree.
    A B+ tree is a B tree with two kinds of nodes:


    1.  inner nodes


    2.  leaf nodes


    An inner node has the same format as a node in a general search tree:


    ![](image/Image3477.jpg)


    but there are no data pointers, but only search values and pointers to the sub-trees.
    In general, an inner node must meet the same criteria as for a B tree, but regarding
    sub-trees the following requirements are stated:


    1.  if *P* is the first pointer, all values *X* in the sub-tree that *P* point
    to must fulfill ![](image/Java_134.jpg)


    2.  if *P* is the last pointer, all values *X* in the sub-tree that *P* point
    to must fulfill ![](image/Java_135.jpg)


    3.  if P is the *i*th pointer where *1 < i < m*, all values *X* in the sub tree
    that *P* point to must fulfill ![](image/Java_136.jpg). That is that a search
    value *K* is the largest search value that occurs in the sub-tree that the previous
    pointers point to.


    A leaf node has the form


    ![](image/Image3485.jpg)


    where the *Q* pointers are data pointers for the object (data block) that has
    the key *K*. That is, a leaf node consists of pairs *[K, Q]*, which are arranged
    according to the key field.


    Next there is a pointer to the next leaf node, thus giving a simple possibility
    of traversing all the tree’s elements sorted according to the key.


    The class *BTree2* implements a B+ tree, but its implementation is different than
    the class *BTree*, as this time two types of nodes are defined as inner classes:


    ![](image/Image3492.jpg)


    *Node* is an abstract base class that contains the keys:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_126.jpg)


    while the two concrete nodes are defined as follows:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_127.jpg)


    The class itself is defined as:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_1271.jpg)


    The code consists primarily of programming the two node classes, but to facilitate
    the work, the class *Tools* is expanded with a new binary search method:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_1272.jpg)


    The method searches in a list instead of an array, but the important thing is
    the return value if the element is not found, which is the index that the element
    should have been but with negative sign. Java’s Collections classes implement
    binary search in the same way. The class *BTree2* uses binary search in the individual
    nodes, and the above implementation makes it easier to search down the tree.


    Also the class *ArrayList* (and the interface *IList*) has been changed so that
    the class is expanded with a new method that deletes all elements within an interval:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_128.jpg)


    Java’s *ArrayList* has a similar method and the purpose of implementing the method
    is performance.


