  trans: '

    如前多次所示，许多问题可以使用递归算法来描述，这可能是因为问题本身本质上具有递归性。实现递归算法很容易，但正如提到的，这可能导致算法效率极低，因为递归调用的次数呈爆炸式增长。这种算法的经典示例是确定斐波那契数的递归方法，而这里的解决方案是写成一个迭代方法。这是一个动态规划的示例。其思想是从一个可以解决的简单情况开始。你现在保存解决方案并继续，以便下一个方案由已经解决的方案决定。确定斐波那契数的迭代算法从前两个数（0
    和 1）开始，然后继续，使得下一个数始终是前两个数之和。这与递归相反，是从复杂情况开始并逐渐向前，直到达到简单情况。


    结合贪心算法，我曾见过硬币问题，即需要用最少的硬币兑换某个金额，在这种背景下，贪心算法可能提供最优解决方案。然而，问题可以通过使用动态规划的算法进行最优求解。如果你需要兑换金额
    `amount`，策略是确定兑换 `1, 2, 3, …, amount` 所有金额所需的硬币最小数。你通过决定兑换 1 需要多少硬币开始，然后遍历从 1
    到 `amount` 的所有金额。对于每个值 `a`，遍历所有硬币 `c`（标记为 `c1, …, cn`），其值小于或等于 `a`，并确定 `m = min
    { exchange(a – c1), …, exchange(a – cn) }`。然后兑换 `a` 的最小硬币数等于 `m + 1`。正式一点，该方法可以描述为：


    ![](img/Java_19_–More_algorithms_and_data_structures_15-11-18_39.jpg)


    你应该注意，这是一个基于动态规划的算法，通过确定小于等于所需金额的所有值来应用于已解决的子问题。为了实现该算法，我从 `CoinProblem` 程序的一个副本开始，类
    `Coin` 和 `Coins` 保持不变，位置 0 处添加一个空列表，因为不需要硬币兑换金额 0。下一步遍历从 1 到 `amount` 的所有金额 `b`。每次迭代将
    `min` 设置为 `b`，并将 `val` 设置为值为 1 的硬币。这对应于兑换 `b` 使用 `val` 硬币。`n` 是用于跟踪已选择硬币的索引。对于每个金额，有一个遍历所有硬币的内部循环。如果硬币的值大于
    `b`，显然在使用，你可以继续下一个硬币。否则，测试 `b` 去硬币的值是否可以用比 `min` 更少的硬币兑换，如果是，则将 `min` 设置为该值并将
    `val` 设置为当前硬币。遍历所有硬币后，数组更新为找到的结果。


    最后，程序必须测试是否有足够的硬币，如果没有则抛出异常。否则，计算硬币的数量并返回结果。


    如果你考虑该方法，可以说它由一个遍历 `N` 次的外层循环（如果金额为 `N`）和一个遍历 `K` 次的内部循环（如果有 `K` 种硬币）组成。后面跟着两个各有
    `K` 次迭代的循环。因此，算法执行次数大约为：


    ![](img/Java_23.jpg)


    操作。现在 `K` 通常相对于 `N` 较小，且具有固定大小（对于丹麦硬币为 5），因此你可以将 `K` 视为常数。这样做，算法具有线性复杂度。


    ## 4.1 质数


    通常的测试一个整数是否为质数的算法是关于检查该数是否有因子的的。这可以通过尝试用所有小于测试数的数字对其进行除法来实现。由于 2 是唯一的偶质数，你将通过只对奇数进行除法来优化算法，如果你发现除以所有小于或等于测试数平方根的数字就足够了，该算法可以写如下：


    ![](img/Java_19_–More_algorithms_and_data_structures_15-11-18_42.jpg)


    但注意，迭代次数为 ![](img/Java_24.jpg)，因此算法的时间复杂度为 ![](img/Java_25.jpg)，这是一个相当不错的时间复杂度，但对于大值，仍然需要执行大量除法，算法会变慢。


    如果你观察该算法，可以发现除以所有小于或等于 ![](img/Java_26.jpg) 平方根的质数就足够了。在其他相同的情况下，它将提供更少的除法并得到更高效的算法。如果
    `primes` 是所有小于或等于 ![](img/Java_26.jpg) 平方根的质数的列表，则该算法可以写如下：


