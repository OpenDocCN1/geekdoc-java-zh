    在这里你需要注意，`Vertex` 对象精确对应于上图中的元素，并包含一个顶点的集合；而 `Edge` 对象则精确对应于边集合中的一个元素。也就是说，`Vertex`
    和 `Edge` 这两个类定义了对应于上述图示的类型。与上述图相比，`Vertex` 类进一步拥有 4 个属性。对于图的实现来说，这 4 个属性没有用处，但它们被用作单个图算法的辅助变量。基本上，这些变量不应该是
    `Vertex` 类的属性，相反，你可以应用特化类（specialization）或包装类（wrapper class），但允许变量作为 `Vertex`
    类的属性的方案简化并优化了图算法的实现，因此选择了这种方法。


    `Graph<T>` 类实现了 `IGraph<T>` 接口，因此表示一个图。你应该注意，该类本身支持使用顶点和边构建图，但不支持任何图的操作——我目前还没有提到这些操作。这里有一些代码，你应该主要关注以下几点。


    首先是数据呈现部分，我使用了一个 map 来存储顶点，并用泛型 `T` 作为键。这要求类型 `T` 必须重写 `equals()` 和 `hashCode()`
    方法以实现值语义。然后注意，为图的类型（有向或无向）定义了一个属性，该类型在构造函数中初始化，默认将类型设置为有向。假设一个顶点只有少量边（无论这些边是什么），对于大多数操作，我们可以预期的时间复杂度在近似情况下是常数级的。然而，如果图是密集的（即从每个顶点都有条边通向所有（许多）其他顶点），那么其中几个方法将具有线性复杂度。估计复杂度非常困难，因为它们取决于图的密度，但由于实践中的图的边通常比顶点多，而且这些边通常均匀分布在各个顶点上，这种复杂度通常被视为
    `log (N)`，其中 `N` 是顶点的数量。


    最重要的方法之一是用于添加边的 `add()` 方法。它首先测试两个顶点之间是否已经存在边，如果存在，则忽略该操作（对于无权图）或更新权重。如果边不存在，则通过“在
    map 中查找（pick the corner up）”找到顶点，如果它不存在，则将创建它。也就是说，如果顶点不在图中，`add()` 方法将添加新顶点。然后你可以用这两个顶点向其中一个添加边。如果图是非向的，则会自动添加另一条边。这是一个简单（但也有些昂贵）的解决方案，你可以对其讨论，也有其他更好的方法，但我认为无向图是例外，因此允许通过再次添加一条边来简化它。


    还要注意迭代器的实现，它简单地返回了 map 的迭代器。这意味着你不能对顶点的迭代顺序做任何假设。`remove()` 方法的实现并不简单，删除顶点是非常困难的。如果你删除一个顶点，必须同时删除该顶点参与的所有边，在这里特别是那些该顶点作为后继节点的边会产生问题，因为你无法在不搜索所有边的情况下找到它们，即遍历所有顶点并遍历每个顶点的所有边。


    然后是 `getSuccessors()` 方法，它将返回特定顶点的所有后继节点。这是一个简单的方法，因为顶点包含其后继节点的列表。相反，返回顶点所有前驱节点的
    `getPredecessors()` 方法就没有那么简单。在这里，你必须遍历所有顶点，并对每个顶点检查它是否有指向目标顶点的边。如果你再次假设图是稀疏的，你会预期
    `getSuccessors()` 具有常数复杂度（你只需要检查顶点的边，这可以被设置为常数时间），而 `getPredecessors()` 具有线性复杂度，因为你必须遍历所有顶点。相反，对于密集图，两种复杂度将是
    `O(N)` 和 ![](img/Java_140.jpg)。


    最后，注意 `getVertices()` 方法，它返回一个遍历所有顶点的迭代器，该迭代器返回 `Vertex` 对象。这对于图算法的实现非常重要。


