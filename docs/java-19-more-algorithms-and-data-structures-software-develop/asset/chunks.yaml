    ## 7.2 红黑树


    如上述，你不会直接实现 2-3-4 树，部分原因是因为有多种类型的节点，而且插入和删除都会导致许多特殊情况。然而，你可以轻松地将 2-3-4 树转换为二叉树，这被称为
    `红黑树`，结果将得到一个平衡良好的树。其核心思想是两个节点之间所有的链接都被赋予红色或黑色。如果一个节点的父节点链接是黑色的，则该节点为黑色；如果父节点链接是红色的，则该节点为红色。2-3-4
    树可以如下转换为二叉树：


    2 节点被转换为一个带有两个黑色子节点的普通二叉节点（可以是空的）：


    ![](img/Image3137.jpg)


    3 节点映射到两个二叉节点，其中一个是红色的（有两种选择）：


    ![](img/Image3144.jpg)


    最后，4 节点被映射到三个二叉节点，其中两个孩子都是红色的：


    ![](img/Image3152.jpg)


    这种转换的结果如下，它构成了`红黑树`的定义：


    1. 不能有两个红色节点相相邻（在上面的图中，未显示的后继链接均为黑色）。

    2. 节点的深度（black depth）是指从根节点到相应节点的黑色链接的数量。在红黑树中，所有叶节点具有相同的黑色深度。这是因为所有红色链接都对应 3
    节点和 4 节点，因此它们不增加相应 2-3-4 树的高度。

    3. 没有指向根节点的链接，假设这意味着根节点是黑色的。


    考虑如下所示的 2-3-4 树：


    ![](img/Image3161.jpg)


    如果将其转换为红黑树，结果如下：


    ![](img/Image3175.jpg)


    在这里你应该注意，现在没有两个后继的红色节点，且所有叶节点具有相同的黑色深度，该深度等于相应 2-3-4 树的高度。


    红黑树并不是平衡的，但如果你只计算黑色链接，它就是平衡的。3 节点和 4 节点可能会在树中增加额外的深度，因此红黑树的高度不超过相应 2-3-4 树的两倍，从而使树是合理平衡的。


    红黑树本质上是一种二叉搜索树，因此，在前一书中关于二叉搜索树的所有内容（包括平衡二叉搜索树）仍然有效，即可以实现插入和删除以维持红黑树的要求。这是可行的，但不简单。


    我将从插入开始。上面我描述了向 2-3-4 树的插入，是在树中向下搜索以找到新元素的插入位置，然后返回并分裂任何满的 4 节点。这意味着既有自上而下的遍历过程，也有自底向上的遍历（类似于
    AVL 树）。可以通过单次自上而下的遍历完成这种插入，只需确保新元素不插入到满的 4 节点中。这可以通过向下搜索树并遇到的的所有所有 4 节点拆分为两个 2
    节点来实现。在红黑树中，这是一个极其简单的过程，因为已知 4 节点有两个红色孩子，而分裂仅涉及简单的颜色变化：


    ![](img/Image3189.jpg)


    这保持了所有叶节点的黑色深度。由于 `B` 现在是红色的，如果 `B` 的父节点也是红色的，就会出现问题，因为你有两个连续的红色节点。这个问题通过旋转来解决。如果一个
    4 节点的后继是 2 节点，有两种选择：


    ![](img/Image3196.jpg)!(image/Image3204.jpg)


    这些情况都不会导致问题。如果 4 节点后继的是 3 节点，则有三种选择，因为 4 节点可以是左孩子、右孩子或中间孩子。如所示，3 节点到红黑树的转换可能导致两种方向，因此实际上有
    6 种情况。下面是两种情况，4 节点作为 3 节点的右孩子和左孩子，但具有两种不同方向的 3 节点：


    ![](img/Image3211.jpg)!(image/Image3220.jpg)


    ![](img/Image3227.jpg)


    ![](img/Image3235.jpg)


    ![](img/Image3242.jpg)


    ![](img/Image3259.jpg)


    ![](img/Image3270.jpg)


    ![](img/Image3283.jpg)


    ![](img/Image3290.jpg)


    这些操作的结果是，当你找到插入新元素的叶节点时，可能遇到了需要分裂的 4 节点，但在通往叶节点的过程中所有的 4 节点都被移除了，父节点有了额外的空间。这意味着插入可以通过单次自上而下的遍历完成，并以保持树深度且良好平衡的方式进行。


    红黑树可以像 AVL 树一样，实现为继承自 `BinSearchTree<T extends Comparable<T>>` 的类（参见之前的二叉树书籍）。为了实现该树，需要在节点中添加一个控制颜色的额外属性：


    ![](img/Java_19_–More_algorithms_and_data_structures_15-11-18_105.jpg)


    在这里，`TreeColor` 是定义两种颜色的简单枚举。之后，元素的插入按上述描述实现，但需要一些代码行，很难追踪发生的过程。鼓励你研究代码，最简单的方法始终是思考
    2-3-4 树。


    回到删除节点，其实现方法如 2-3-4 树所示。遇到 2 节点时执行合并并创建一个新的 4 节点，这在红黑树中将涉及颜色变化。这可能导致两个连续红色节点的问题，然后必须通过旋转恢复平衡。有多种选择，我在这里不会用示例说明所有情况，但你可能想查看冗长且复杂的完整代码。


    在 `palib` 库中的完成类名为 `RBTree`。


