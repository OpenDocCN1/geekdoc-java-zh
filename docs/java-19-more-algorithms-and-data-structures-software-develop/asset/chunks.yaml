    ## 10 Final example: Activity


    To manage and follow the time spent in projects, time charts are often used as
    tools. The time chart consists of activities linked with arrows to show the interdependence
    of the activities, for example:


    ![](image/Image5826.jpg)


    The diagram is read as follows: Activity A must be completed before activities
    B and C can start. Activity D can not start until activity B is complete B is
    the direct predecessor of D and A is thus an indirect predecessor of D. There
    are several terms or values associated with an activity as shown in the following
    figure:


    ![](image/Image5834.jpg)


    and I will use the following abbreviations:


    *   An activity: A

    *   Duration: D

    *   Latest, direct predecessor: P

    *   Earliest, immediate successor: S

    *   Earliest start: Es

    *   Earliest end: Ee

    *   Latest start: Ls

    *   Latest end: Le

    *   Free slack: Fs

    *   Total slack: Ts


    The project’s start time is set to 0. It is applied as the earliest start time
    for all boxes representing the activities that can be started at the beginning
    of the project because they are without predecessors.


    Then, for each of these activities, the calculated earliest end time is determined
    and added to the boxes. Earliest end time of an activity is found by adding the
    earliest start time and the duration (`Ee = D + Es`).


    Earliest start time for other activities are determined by transferring the earliest
    end time of the most recent direct predecessor (`Es = Max (Ee, Ee, … | all predecessors)`).
    That is, all direct predecessors are expected to be completed before an activity
    can start. Then the earliest end time can be calculated as above.


    The duration of the project is the largest earliest end time. The calculated project
    duration is considered as the most recent acceptable end time of the activities
    that constitute the completion of the project, that is all activities that have
    no successors.


    The duration of the project is applied to all activities without successors as
    the last end time, after which the last start time for these activities can be
    calculated by subtracting the duration of the activity from the last end time
    (`Ls = Le-D`).


    Most recent start and end times for the other activities can now be calculated
    by scanning all activities from right to left. The last end of an activity is
    determined by transferring the most recent start time of the earliest direct successor
    (`Le = Min (Ls, Ls, … | all successors)`). The last start time of the other activities
    is found by subtracting the duration of the activity from the activity’s latest
    end time.


