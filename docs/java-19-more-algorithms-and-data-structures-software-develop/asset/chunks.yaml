    像上面的图被称为**无向图**（non-oriented graph），其中边被解释为对应双向关系的双向边。也就是说，既有从 `A` 到 `B` 的边，也有从
    `B` 到 `A` 的边。你也可以拥有边没有方向性的有向图：


    `E = { (A,B), (A,C ), (A ,D ), (C ,D), (C,G), (C,H), (D,H), (H,F), (F,G), (B,C),
    (B,E), (E,G)}`


    ![](img/Image3507.jpg)


    虽然如果图是有向的，则必须存在两个方向上的边——如果是这样，你通常用双箭头来表示，并且必须有一条从顶点到自身的边：


    ![](img/Image3515.jpg)


    在无向图中，你始终可以在两个方向上移动，因此你也可以将无向图刻画为每条边都是双箭头的有向图——即两个方向都有边。


    在有向图中，如果两个顶点相同，则两个顶点之间的路径称为**环**（cycle），即路径从一个顶点开始并结束于同一个顶点。在上面的示例中：


    `(C, B, C)`


    是一个环。没有环的有向图被称为**有向无环图**（oriented acyclic graph）。


    由于顶点可以指向自身，因此所有顶点都可以连接到任何其他顶点（包括顶点本身）。如果图有 `n` 个顶点，那么它最多可能有 ![](img/Java_139.jpg)
    条边。


    边很多的图被称为`稠密`（dense）图，而边较少的图被称为`稀疏`（sparse/thin）图。对于图是稠密还是稀疏没有精确的衡量标准，这仅仅取决于图可能更稀疏或更稠密。另一方面，这会影响如何实现图。


    上面的图都是无权图，但我们也可以拥有加权图，这意味着对于每条边，我们都有数字形式的权重：


    ![](img/Image3522.jpg)


    在实践中，权重可以代表距离或成本。


    图是一种数据结构，如上所述，图可以定义为两个集合 `G = {V, E}`，分别表示顶点和边。当然，操作也与该数据结构相关，对于给定的实现，必须有构建图以及删除边和顶点的操作。此外，还有以下操作：


    *   **遍历图**（Traverses the graph）：从一个顶点开始，通过遵循图的边到达可能的所有其他顶点。

    *   **最短路径**（The shortest way）：即找到从顶点到所有其他顶点的最短路径。“最短”的含义取决于图是否加权。

    *   **最小生成树**（The least spanning tree）：处理（如果可能）删除足够的边，使得结果是一棵树。

    *   **拓扑排序**（A topological sorting）：按照特定顺序排列图的顶点。


    关于图的最后一点，上面的图示说明了**连通图**（coherent graphs），但这并不是必要条件，下面的图示也展示了一个图：


    ![](img/Image3530.jpg)


    然而，在大多数情况下，你会对连通图感兴趣（因为非连通图只是连通图的一个族），在下文中除非另有说明，我假设图是连通的。


    图也被称为**网络**（network），许多应用与之相关，例如计算机网络或地理位置网络。


    ### 备注

    图论实际上是一个巨大的领域，包含许多复杂的算法，以下内容绝非详尽，仅是对该主题的介绍。图论是广泛的，并且基于严谨的数学证明，以涵盖算法的正确性和时间复杂度。以下方法侧重于实践，主要目标是在
    `Java` 中将图实现为数据结构，并且在说明不同算法时没有精确的证明，其有效性也是如此。


