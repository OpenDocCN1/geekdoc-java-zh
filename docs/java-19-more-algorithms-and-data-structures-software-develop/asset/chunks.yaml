    A graph like the above is called a non-oriented graph, in which an edge is interpreted
    as a double edge corresponding to the relationship is going both ways. That is
    there is both an edge from `A` to `B` and an edge from `B` to `A`. You can also
    have an orientated graph where the edges are not directional:


    `E = { (A,B), (A,C ), (A ,D ), (C ,D), (C,G), (C,H), (D,H), (H,F), (F,G), (B,C),
    (B,E), (E,G)}`


    ![](image/Image3507.jpg)


    Although if a graph is oriented, there must be edges in both directions – and
    if so, you usually illustrates it with a double arrow, and there must also be
    an edge from a vertex to itself:


    ![](image/Image3515.jpg)


    In an non-oriented graph you can always go in both directions, and you can therefore
    also characterize a non-oriented graph as an oriented graph where each edge is
    a double arrow – there is an edge in both directions.


    In an oriented graph one calls a path between two vertices for a cycle if the
    two vertices are the same, that is, if the path starts in a vertex and ends in
    the same vertex. With the above example is


    `(C, B, C)`


    a cycle. An oriented graph without cycles is called an oriented acyclic graph.


    Since a vertex can have an edge to itself, for all vertices there can be an edge
    to any other vertex (including the vertex itself). If the graph has `n` vertices,
    it may then highest have ![](image/Java_139.jpg) edges.


    A graph that has many edges is called a `dense` graph, while a graph with few
    edges is called a `sparse` (thin) graph. There is no exact measure of when a graph
    is dense or sparse, and it is solely a question that a graph may be more or less
    sparse. It, on the other hand, has an impact on how to implement a graph.


    The above graphs are all non-weighted graphs, but we can also have weighted graphs,
    which means that for each edge we have a weight in the form of a number:


    ![](image/Image3522.jpg)


    In practice, weights could represent distances or costs.


    A graph is a data structure, and as explained above, the graph can be defined
    as two sets `G = {V, E}` of respectively vertices and edges. Of course, operations
    are also associated with the data structure, and for a given implementation there
    must be operations that build the graph and remove edges and vertices. In addition,
    there are the following operations:


    *   Traverses the graph where you start at a vertex and from there go to all the
    other vertices that are possible to reach by following the graph’s edges.

    *   The shortest way, that is to find the shortest path from a vertex to all other
    vertices. What shortest means is interpreted differently depending on whether
    the graph is weighted or not.

    *   The least spanning tree that deals with (if possible) removing so many edges
    that the result is a tree.

    *   A topological sorting, which arrange the vertices of the graph in a certain
    order.


    As a last remark regarding graphs, the above drawings illustrate coherent graphs,
    but it is not a requirement, and the figures below also illustrates a graph:


    ![](image/Image3530.jpg)


    However, in most cases, you will be interested in coherent graphs (as a non-coherent
    graph just is a family of coherent graphs), and I will, in the following – unless
    otherwise stated – assume that a graph is coherent.


    A graph is also called a network, and many applications relate to, for example,
    computer networks or networks of geographical locations.


    ### Remark

    Graph theory is actually a large area with many complex algorithms, and the following
    is by no means exhaustive and is only an introduction to the subject. The graph
    theory is extensive and is based on stringent mathematical profs both for the
    correctness of the algorithms and their time complexities. The following approach
    is practical oriented and the primarily aims are to implement a graph as a data
    structure in `Java`, and the different algorithms are illustrated without precise
    profs, and the same applies to their effectiveness.


    ## 8.1 Implementing graphs


    In general, it is not easy to implement a graph as a data structure, especially
    because it is difficult to implement the graph’s operations so that they are general
    and with a reasonable time complexity. The implementation of the classic graph
    operations will often depend on the internal representation of a graph and thus
    becomes closely linked to the data presentation.


    One way is to implement a graph is using a 2-dimensional array. Consider again
