  raw: 'After the calculation of the most recent times, the diagram shows which activities
    can be temporarily postponed and what activities are fixed. The last category
    of activities that can be recognized by the fact that the earliest and most recent
    end times for each activity are the same, and they are also called critical activities
    as they constitute one or more critical paths through the network from start to
    finish. It is characteristic of a critical path that


    1.  it is measured by time the longest way in the network


    2.  if the duration of one or more of the activities on a critical path is extended,
    the duration of the project will be extended accordingly


    The maximum displacement option for each activity is called the total slack. All
    activities on a critical path therefore have a total slack = 0.


    The total slack is calculated on condition that all predecessors are completed
    as early as possible and all successors begin as soon as possible. The calculation
    of the total slack for an activity is done by subtracting the earliest end time
    from the latest end time (*Ts = Le* – *Ee*).


    A delay in a critical network activity causes a corresponding extension of the
    project’s duration, unless the duration of one or more of the subsequent critical
    activities is reduced correspondingly to their planned duration. Activities with
    a small total slack must therefore be monitored particularly carefully during
    the project time.


    In the same way as it is possible to calculate the displacement option of an activity,
    assuming that all predecessors are completed as early as possible and all successors
    begin as soon as possible, it is also possible to calculate the displacement option
    of an activity, provided that all successors begin as early as possible. This
    displacement option is called the free slack. The calculation of the free slack
    for an activity is done by subtracting the activity’s earliest end time from the
    earliest starting time of the earliest direct successor:


    *Fs = Min(Es, Es, … | all successors)* – *Ee.*


    The free slack is used in the monitoring of the project. As you usually use the
    earliest start and end times when completing a project, it may be nice to know
    which displacement options the activities also have under these assumptions.


    ## 10.1 Task description


    The task now is to write a program that can be used as a tool for calculating
    and printing information about a project and its activities. That is, for each
    activity


    1.  name


    2.  duration


    3.  earliest start


    4.  earliest end


    5.  latest start


    6.  latest end


    7.  total slack


    8.  free slack


    9.  the activity’s direct successors


    and for the whole project


    1.  the project’s duration


    2.  the critical roads


    Calculation of times and time reserves can only be done if there is no cycle in
    the schedule. If that is the case, a message must be printed.


