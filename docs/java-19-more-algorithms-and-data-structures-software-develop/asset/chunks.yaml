    `Permutation` 类用数组形式表示一个排列。该类有两个私有构造函数，因此只能通过类自身的方法进行实例化，这些方法发生在 `permutations()`
    和 `permute()` 方法中。除了构造函数外，该类还具有用于排列大小及其取值的属性。最重要的方法是 `permutations()`，它返回一个数字
    $n$ 的所有排列的列表。该方法创建列表，但排列是在递归方法 `permute()` 中创建并添加到列表中的，该算法通过回溯（backtracking）工作。该方法有
    3 个参数，其中第一个是排列列表，下一个是正在处理的排列，最后一个是方法当前到达的深度。


    该算法并不那么容易理解，但该方法如下：调用 `permute()` 方法时，传入一个形式为 ![](img/Java_108.jpg) 的平凡排列（trivial
    permutation），然后该方法必须通过系统地切换数字来创建排列。从开始时 `i` 等于 0，这等于没有数字被选择用于排列。每次调用该方法时，循环都会从
    `i` 运行到末尾（已选择的数字不变），然后你在未使用的数字中为排列选择一个新的数字。然后，该方法递归地调用自己，但 `i` 增加了 1，因为现在已经选择了一个数字。当所有数字都被选择且排列被添加到列表（创建一个副本）时，递归停止。当排列被添加到列表时，当前的
    `permute()` 方法终止，这意味着 `p` 中的最后一次交换被取消，这等同于回溯。


    ## 5.2 并集集合（A DisjointSet）


    我将提到一种简单的数据结构，通常被称为 `DisjointSet`（并集集合）。它与回溯没有关系，之所以在此处介绍这种数据结构，是因为我在接的示例中需要它。


    在数学中，等价关系（equivalence relation）起着至关的作用，它作为一种将集合划分为若干互不相交子集的关系。如果将该关系称为 `~`，那么在集合
    $S$ 上的等价关系是指满足以下条件的关系：


    ![](img/Java_109.jpg)


    所有通过该关系与元素 `a` 相关的元素都称为由 `a` 确定的等价类（equivalence class），有时被称为 `[a]`。根据上面的定义可以得出，同一等价类中的两个元素决定同一个等价类。这意味着：


    ![](img/Java_110.jpg)


    带有等价关系的集合有时也被称为集合的划分（class division）。我将描述一个可以用于创建数字 $0, 1, \dots, n-1$ 划分的类。起点是一个包含
    `n` 个元素的数组，所有元素从开始值都为 -1，对于 10 个元素，可以如下所示：


    ![](img/Image2776.jpg)


    必须将其解释为从 0 到 9 的每个数字各构成它们自己的等价类。你也可以将这种关系看作 10 棵树，每棵树单独由一个根组成：


    ![](img/Image2785.jpg)


    该类必须有一个方法 `union()` 来合并两个等价类，如果你想合并 4 和 5 的等价类，可以这样操作：


    ![](img/Image2796.jpg)


    4 的值为 -2，必须解释为该数字是负数，因为 4 是（决定了）一个深度为 2 的等价类的根。位置 5 上的值为 4，意味着 5 与位置 4 元素在同一个等价类中，因此
    4 和 5 现在处于同一个等价类中。用树来演示如下：


    ![](img/Image2811.jpg)


    如果你合并合并 6 和 7 的等价类，你会得到：


    ![](img/Image2818.jpg)


    写成树的形式：


    ![](img/Image2826.jpg)


    也就是说，10 个元素现在被划分为 8 个等价类。下一步，我想执行包含 5 和 6 的两个等价类的并集操作。这里 5 不是等价类中的根，而 `union`
    方法通过使用类的根来合并两个等价类工作。因此，需要一个 `find()` 方法，它可以找到包含特定元素的等价类的根。对于 5，`find()` 方法找到了元素
    4，而对于 6 则找到了元素本身。你必须合并根为 4 和 6 的两个等价类：


    ![](img/Image2833.jpg)


    在这里你应该注意，元素 7 指向 6，6 指向 4，4 是新等价类的根，而元素 5 也指向 4。因此，方法的实现必须使得从一个元素到其根的路径尽可能短，这正对应于以树形式组织的元素的感知：


    ![](img/Image2841.jpg)


    作为下一个操作，我想合并 0 和 9 的子树，这很简单，因为两个元素都是子树中的根：


    ![](img/Image2848.jpg)![](img/Image2856.jpg)


    如果你合并 2 和 3：


    ![](img/Image2863.jpg)![](img/Image2871.jpg)


    如果你合并合并 0 和 2 的等价类，你会得到：


    ![](img/Image2880.jpg)


    0 和 2 各自都是等价类的根，但 `union()` 方法确保从一个元素到根的路径尽可能短：![](img/Image2891.jpg)那么 10 个元素现在被划分为
    4 个等价类。如果你对 0 和 3 进行 `union()` 操作，什么都不会发生，因为这两个元素已经在同一个等价类中了。任务是编写一个如上述的 `DisjointSet`
    类，这实际上非常简单，但我会将其添加到我的 `palib` 中。该类除了构造函数外，只有两个方法 `find()` 和 `union()`：


    ```

    ![](img/Java_19_More_algorithms_and_data_structures_15-11-18_64.jpg)![](img/Java_19_More_algorithms_and_data_structures_15-11-18_65.jpg)find()
    方法返回元素等价类的根（负值）。该方法是递归的，并修改指向根的路径。`union()` 方法通过两个元素调用，并假设这些元素都是等价类的根。如果不是这样，或者两个元素相同，方法将中断。如果最后一个元素的值（负值）小于
    `a` 的值，则元素 `a` 指向 `b`（b 为根的等价类），否则 `b` 的值必须指向 `a`，但 `a` 的值减 1。


