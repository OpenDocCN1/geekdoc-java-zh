    编写一个程序来实现对应上述描述的 0/1 背包问题。最困难的部分实际上是确保所用数组的索引正确。


    # 5 回溯


    通常情况下，解决问题的算法是显而易见的，但在其他语境下，可能很难找到算法，特别是很难选择正确的算法。在本章中，我将介绍一组被称为`回溯`（backtracking）的算法，它最好的特征是通过检查所有可能的解决方案来系统地搜索问题的解。作为一个示例，我将介绍所谓的“八皇后问题”：


    *国际象棋盘由 64 个格子组成，排列成 8 行 8 列的正方形。在国际象棋游戏中，皇后可以水平、垂直和对角线移动，从而攻击它可以到达的某个位置上的另一个棋子。现在的问题是在棋盘上放置
    8 个皇后，使得它们之间互不能相互攻击。*


    解决该问题的一种方法是让计算机系统地检查所有选项，直到找到解决方案为止。棋盘有 64 个格子，在棋盘上放置 8 个皇后相当于从 64 个格子中选择 8 个，其方法数是二项式系数
    $\binom{64}{8}$，结果为 4426165368，因此即使在快速计算机上也不是一条特别可行的路径。然而，通过观察到每行最多包含一个皇后，每列也是如此，这可以显著减少问题规模。对于这些选项中的每一个，检查是否没有皇后会在对角线上相互攻击。然而，通过更加系统化的方法可以进一步改进求解方法。你首先在第一行的第一列放置一个皇后。接着，在第二列放置一个皇后，从该列的顶部开始，直到你找到一个不会攻击第一列皇子的位置。现在继续第三列，再次从顶部开始向下移动，直到找到一个不会攻击前两个皇后之一的位置。然后你尽可能地继续下去。当在第六列放置皇后时，出问题了。无论你尝试哪一行，它都能攻击已存在的五个皇后中的一个。


    ![](img/Image2746.jpg)


    你现在跳过最后一个已放置的皇后（第五列的皇后）。你正在进行回溯，然后尝试一个尚未尝试过的位置。在最后一个位置进展顺利。然后你再次尝试第六列，但仍然不理想。


    ![](img/Image2753.jpg)


    因此，你必须跳过最后一个皇后，但由于这一列没有更多位置（第五列），你必须再次回溯，跳过第四列的皇后并尝试一个新的位置。再次尝试，这次可以在前七列放置皇后，但在第八列出问题了，你必须进行回溯。


    ![](img/Image2761.jpg)


    你必须持续直到找到解决方案为止。在这里，重要的是问题必须有解，否则你将无限持续下去。其思想是系统地尝试寻找解决方案，直到你找到解决方案，或者直到你发现自己进入了死胡同。如果是那样，你将返回并重试。注意，该问题有许多解，而该方法仅提供单一的解。


    ![](img/Image2768.jpg)


    如果你要编写一个可以解决此问题的程序，你必须能够表示游戏，并且必须跟踪哪些位置已经被尝试过。对于前者，游戏可以简单地表示为`boolean` 元素的二维数组，用来说指示某个位置是否包含皇后。为了跟踪哪些位置已经被尝试过，你可以使用两个计数器，分别用于行和列。以下类展示了八皇后问题的解决方案：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_54.jpg)!!(image/Java_19_–_More_algorithms_and_data_structures_15-11-18_55.jpg)


    注意，类的构造函数有一个参数指示国际象棋游戏的大小。与真实的国际象棋游戏（大小始终为 8 × 8）相比，这并不重要，但八皇后问题实际上是通用的，适用于 8
    以外的尺寸，因此构造函数需要此参数。`ok()` 方法测试你是否可以在 `(row, col)` 位置放置皇后，而 `nextQueen()` 方法使用了回溯。如果
    `col` 等于广场大小，则问题解决，方法返回 `true`。如果不是，你遍历列 `col` 中的所有行，并对每一行尝试设置一个皇后。如果你可以这样做，就放置一个皇后


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_56.jpg)


    并继续（递归地）处理下一列，如果不可能，你必须回溯：


    ```

    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_561.jpg)

    ```


    同样注意，如果你开始以不同的方式设置第一个皇后（不在第 1 行），你将发现另一个解，该问题实际上有许多解。


    以下程序使用 `Queens` 类来解决八皇后问题，部分针对 8 个皇后，部分针对 15：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_562.jpg)!(image/Java_19_–_More_algorithms_and_data_structures_15-11-18_57.jpg)


    回溯是一种可以在许多语境下使用的求解技术，你尝试通过部分解决方案寻找解，并在发现所构建的解决方案无法导致结果时返回。回溯比仅仅尝试所有可能性（暴力破解算法）要好得多，但应该注意回溯通常没有良好的复杂度。


    ## 练习 3：八皇后，所有解


    创建 `EightQueens` 的副本。你必须添加另一个测试方法来解决八皇后问题（8 个皇后），该方法必须确定所有解（共有 92 个）。


    ## 5.1 排列


    作为另一个可用回溯算法解决问题的示例，我将介绍一个确定 `n` 的排列的问题，其中 `n` 是一个正整数。通过正数 `n` 的排列，人们理解以某种顺序小于或等于
    `n` 的 `n` 个正整数。例如，3 有 6 种排列：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_58.jpg)


    注意通常 `n` 有 `n!` 种排列。确定 `n` 的排列的策略可以是：


    1. 对于 1 到 `n` 的所有 `k` 和空排列重复。

    2. 将 `k` 添加到排列中。

    3. 如果它产生了合法的部分解，递归地对 1 到 `n` 的所有 `j` 重复步骤 2–4。

    4. 否则回溯


    也就是说，你连续尝试所有数字，直到找到可以使用的数字。当然，你应该在放置数字时注意多次尝试同一个数字。它可以通过以下算法表述：


    ```

    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_581.jpg)!(image/Java_19_–_More_algorithms_and_data_structures_15-11-18_59.jpg)!(image/Java_19_–_More_algorithms_and_data_structures_15-11-18_60.jpg)

    ```

