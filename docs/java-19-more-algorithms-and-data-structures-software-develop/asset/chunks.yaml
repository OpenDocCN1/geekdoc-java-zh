    The class `Permutation` represents a permutation as an array. The class has two
    private constructors, and therefore can only be instantiated by the class’s own
    methods, which occurs in the methods `permutations()` and `permute()`. In addition
    to the constructors, the class has properties for the permutation size and its
    values. The most important method is `permutations()`, which returns a list of
    all permutations of the number n. The method creates the list, but the permutations
    are created and added to the list in the recursive method `permute()`, which is
    an algorithm that works by backtracking. The method has 3 parameters, where the
    first is the list of permutations, the next is the permutation that is worked
    on, while the last one is how far the method is reached.


    The algorithm is not so easy to understand, but the method is as follows. The
    method `permute()` is called with the trivial permutation of the form ![](image/Java_108.jpg),
    and the method must then create permutations by systematically switching the numbers.
    From start is `i` equal to 0 that is equivalent to that none of the numbers are
    selected for the permutation. Each time the method is called, a loop is passed
    from `i` to the end (the numbers selected are not changed) and you select a new
    number for the permutation among the numbers that are not used. Then the method
    calls itself recursively, but with `i` 1 larger, since a number has now been chosen.
    Recursion stops when all numbers are selected and the permutation is added to
    the list (a copy is created). When the permutation is added to the list, the current
    `permute()` method terminates, which means that the last swap in `p` is canceled,
    which is equivalent to backtracking.


