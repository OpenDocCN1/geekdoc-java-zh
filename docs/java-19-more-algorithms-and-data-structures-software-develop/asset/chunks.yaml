    A requirement for Dijkstra’s algorithm is that all weights are non-negative. Although
    it may not happen so often, there is nothing that says that a graph may not have
    negative weights. If so, one can still be interested in the shortest paths, but
    it is difficult to determine the shortest paths, and Dijkstra’s algorithm can
    not be used immediately. The problem is that once you have found a shortest path
    to a vertex – the current vertex – a successor with a negative weight can lead
    to a shorter path to one of the vertices where you have already determined the
    shortest path. Another problem is that if a negative weight is included in a cycle,
    the cycle can lead to a shorter and shorter distance, and you can not decide a
    shortest path. It complicates the implementation of the algorithm and you are
    encouraged to study the code.


    Not only is the implementation of `Bellman Ford` more difficult to understand,
    it also has a poorer time complexity than Dijkstra. Dijkstra basically consists
    of an iteration over the vertices, and what must happen for each vertex depends
    on the number of direct successors. If the graph is thin (few edges), it means
    that the complexity of Dijkstra with good approximation is as shown above. In
    `Bellman Ford` you must at worst compare all paths with all edges (every time
    you try with an edge, you must at worst check what it means for all paths) and
    the result has therefore the worst complexity that is `O(EV)` where E is the number
    of edges and V is the number of vertices.


    ## Exercise 10: Shortest paths


    In this exercise you should write a program that can test the three shortest path
    algorithms. Start with a project that you can call `GraphTester4`. Start by adding
    a method


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_172.jpg)


    which builds and returns the following graph:


    ![](image/Image5306.jpg)


    You must then write a method `test1(IGraph<Character> graph)`, which for a graph
    determines and prints the shortest paths using the methods `minPath()`, `dijkstra()`
    and `bellmanFord()`. Test the method with a graph created with the method `build1()`.


    Write a corresponding method `test2(IGraph<Character> graph)` that does the same,
    but only using `bellmanFord()`. Write a method `build2()` that creates the same
    graph as above, but with the difference that the edge from G to H has the weight
    -6. Test the method `test2()` using a graph created by `build2()`.


    Write a method `build3(int n)`, which returns an `IGraph<Integer>`, which has
    `n` vertices with values from 1 to `n` when the vertices are to be added in random
    order. The method must also try to add `20n` random edges when the weight for
    each edge must be a random `double` between 0 and 1\. Then try the following test
    method:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_173.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_174.jpg)


    which you can use to test whether the above claims regarding complexities seem
    reasonable.


    ## 8.5 Topological sort


    I will now look at an algorithm that performs a so-called topological sorting.
    It is an algorithm that relates to oriented graphs without cycles – also called
    an acyclic graphs. A topological sorting arranges the vertices in an oriented
    acyclic graph in such a way that if there is a path from U to V then V appears
    after U.


    Note first that the requirement for an acyclic graph is necessary, for else if
    two vertices U and V are vertices of a cycle, there will be a path both from U
    to V and from V to U:


    ![](image/Image5479.jpg)


    as [U, W, V] and [V, U]. Also note that a topological sorting makes sense for
    an non-weighted graph. Finally, note that a topological sorting is usually not
    unambiguous and there will usually be more solutions that make up a topological
    sorting. It is relatively simple to implement a topological sorting, and the algorithm
    is best explained as an example. Consider the following graph:


    ![](image/Image5487.jpg)


    and it is easy to convince that it is an acyclic graph. At the fan-in for a vertex
    is meant the number of predecessors. A vertex with fan-in that is 0 has no predecessors.
    This applies to the vertex A, and for example D has fan-in 3\. The method is now
    to mark each vertex with its fan-in:


    ![](image/Image5497.jpg)


    You now start with the vertex that has fan-in 0 (and if there are more you choose
    one). This will be the first vertex in the topological sorting (see below). At
    the same time, you reduce the fan-in for all direct successors to the selected
    vertex. In this case, there are B, C and D. At least one of these vertices will
    then have a fan-in, which is 0, because if not, the graph has a cycle. The algorithm
    now goes on in each iteration to select a vertex which has a fan-in that is 0
    (and if there are more than one it does not matter which one you choose) and add
    it to the list of vertices for the topological sorting. In addition, the fan-in
    is reduced by 1 in all direct successors. Continue until all nodes (if possible)
    are added to the topologically sorted list. Below is the result of the first iteration:


    ![](image/Image5509.jpg)


    As next step, B should be added to the list:


    ![](image/Image5523.jpg)


    and below the result of the other steps:


    ![](image/Image5530.jpg)[](image/Image5538.jpg)[](image/Image5545.jpg)[](image/Image5553.jpg)[](image/Image5560.jpg)


    ### Algorithm Details and Complexity


    The algorithm can therefore be described as follows: Iterates over all vertices,
    where you in each iteration selects a vertex with a fan-in that is 0\. The processing
    consists of adding the vertex to the result and reducing the fan-in of all successors.
    You have to “look” on all edges, and the time complexity will therefore depend
    linearly on the number of edges.


    It is relatively easy to implement the algorithm. Each time you get a vertex with
    fan-in 0, it is inserted in a queue and you continue until the queue is empty.
    In fact, I have implemented two versions of the algorithm:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_177.jpg)


    that determines a topological sort of the elements in a graph and returns the
    result as a list, as well


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_178.jpg)


    that tests if a graph has cycles.


    ### Application: Shortest Paths


    An application of topological sorting is the determination of the shortest paths.
    Suppose you have the following acyclic weighted graph, for which I have written
    fan-in in the individual vertices for technical reasons:


    ![](image/Image5568.jpg)


    I want to start in A and determine the shortest paths to all other vertices. The
    idea is now to go through the vertices in a topological sorting and continuously
    update the distance to the direct successors. If you are at a vertex with fan-in
    0, there are no successors who can give a better result (there are no predecessors
    that have not been visited) and you have therefore found the shortest path. When
    starting in A (which has fan-in 0), you determine the preliminary shortest path
    to the successors (marked as blue in the figure), while decreasing the fan-in
    for the successors (B, C and D):


    ![](image/Image5575.jpg)


    The next vertex to be treated is B. Since B does not have other predecessors,
    the shortest path to B is 4\. Next, determine the shortest paths to the successors
    as the distance to B plus the weight of the edge. If it is better than the path
    that is already found (as may be infinite), the distance is updated and else nothing
    happens. In this case, the distance to E is set to 6, while distances to D are
    not changed (4 + 1 > 2). After the distances are updated, the fan-in in the successors
    is counted down by 1:


    ![](image/Image5584.jpg)

