    在贪心算法中讨论的负载问题是一个更通用的问题——`0/1 背包问题`的特例。它是算法理论中一个非常经典的问题，以下是对该问题的简要介绍，以及如何使用动态规划实现算法解决该问题的示例。该问题可以表述如下：


    最大化函数


    ![](img/Java_29.jpg)


    其中 ![](img/Java_31.jpg) 是不等式解中的二进制变量


    ![](img/Java_30.jpg)


    作为一个 0/1 背包问题的简单示例，当 `n = 3`，`c = 7` 且


    `w = { 3, 4, 3 }`


    `p = { 5, 2, 3 }`


    此时问题是在当 `x`, `y` 和 `z` 为二进制变量且


    ![](img/Java_33.jpg) 时，最大化函数


    ![](img/Java_32.jpg)


    在这种情况下，该问题很容易解决，因为每个变量只有 2 个取值（0 和 1）。只有 8 种可能的解，你可以在表格中列出所有组合：


    | x | y | z | 3x + 4y + 3z | 5x + 2y + 3z |

    | :--- | :--- | :--- | :--- | :--- |

    | 0 | 0 | 0 | 0 | 0 |

    | 0 | 0 | 1 | 3 | 3 |

    | 0 | 1 | 0 | 4 | 2 |

    | 0 | 1 | 1 | 7 | 5 |

    | 1 | 0 | 0 | 3 | 5 |

    | 1 | 0 | 1 | 6 | 8 |

    | 1 | 1 | 0 | 7 | 7 |

    | 1 | 1 | 1 | 10 | 10 |


    在这里你可以看到，最后一个选项不能使用，因为它不符合不等式，对于剩余的 7 种选项，最后一列显示最优解是 (1, 0, 1)。


    在这种情况下，该问题通过`暴力破解算法`解决，这简单意味着你系统地测试所有选项，并以此方式确定最佳结果。这显然是你总是可以使用的算法，但问题在于时间复杂度。如果你有一个具有
    `n` 个变量的 0/1 背包问题，那么结果将是一个时间复杂度为 ![](img/Java_34.jpg) 的算法，这是没有希望的。因此，有理由对更好的算法感兴趣。


    解决问题有多种策略，例如，你可以应用针对 `p` 值（利润）的贪心算法，并不断选择 `p` 值最大的元素。你可以对 `w` 值（重量）进行贪心，始终选择 `w`
    值最小的元素，或者你也可以对商值 `p / w` 进行贪心。在第 2 章表述的负载问题中，所有的 `p` 值都等于 1，算法是对重量是贪心的，但正如硬币问题所示，贪心算法并不一定提供最优解，相反，你可以考虑动态规划。


    当解可以描述为一系列决策的结果时，可以使用动态规划来解决问题。考虑第 `n` 个斐波那契数，它是通过确定第一个、第二个、第三个等等来实现的。这种策略可以用于解决
    0/1 背包问题。


