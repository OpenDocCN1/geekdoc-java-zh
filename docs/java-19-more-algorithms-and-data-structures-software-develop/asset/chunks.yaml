    The usual prime algorithm, which tests where an integer, is a prime, is about
    checking if the number has a divisor. This can be done by trying to divide with
    all numbers less than the number to be tested for prime number. Since 2 is the
    only equal prime, you will therefore optimize the algorithm by dividing only with
    the odd numbers and if you notice that it is enough to divide with all numbers
    less than or equal to the square root of the number to be tested, the algorithm
    can be written as follows:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_42.jpg)


    Note, however, that the number of iterations is ![](image/Java_24.jpg) and therefore
    the time complexity of the algorithm is ![](image/Java_25.jpg), which is a quite
    good time complexity, but for large values, many divisions still need to be performed
    and the algorithm becomes slow.


    If you look at the algorithm, you can notice that it is enough to divide with
    all primes less than or equal to the square root of ![](image/Java_26.jpg). All
    else being equal, it will give fewer divisions and thus a more efficient algorithm.
    If `primes` is a list of all primes less than or equal to the square root of ![](image/Java_26.jpg),
    the prime algorithm can be written as follows:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_43.jpg)


    The problem is just that you do not know the prime numbers to divide with (you
    do not know `primes`). Assume that the task is to write a method that can return
    the `n`th prime. Using the first of the above methods, you can implement a solution
    as follows:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_431.jpg)


    The method consists in determining the first `n` primes (where the prime number
    with index 0 is set to 2) and if you store these prime numbers in a list, you
    can use the other prime method and thus dynamic programming:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_432.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_44.jpg)


    The question is then whether there is any gain, and it is actually very limited,
    but there is a factor 4 different with the advantage to the last method. The last
    method is probably based on fewer divisions, but conversely, one must maintain
    the list, which also takes time. Below is a test program:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_441.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_45.jpg)


    and if you run the program you could get the result:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_451.jpg)


    The project is called `ThePrimes` and you should note that the project uses the
    class `Primes` in the class library `palib` from the book Java 18\. This project
    is also copied to the project files for this book as the current book will expand
    the library with new classes and also modify existing classes.


