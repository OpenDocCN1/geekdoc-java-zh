    贪心算法分阶段或步骤执行，在每个阶段中，它执行看起来是最好的操作，但不会考虑未来的后果。这意味着你总是能找到一个局部最优解，因此采用“现拿现有的”的策略，这也是该算法命名的由来。当算法停止时，人们希望局部最优解接近最优解。如果是这样，则算法是正确的；否则，它就是一个次优解。


    目前来看，虽然这类算法的应用场景并不显而易见，但通常它们是那些易于实现且有效的算法；在不一定需要最优解的情况下，贪心算法是非常合理的。


    虽然有一点抽象，但你可以将贪心算法的解决方案表述如下：


    *   `C`：解的候选者集合

    *   `S`：所选候选者的集合

    *   `solution()`：检查一组候选者是否为解

    *   `feasible()`：检查一组候选者是否能导出一个解

    *   `select()`：返回解的最优候选者


    贪心算法的一个经典示例是所谓的“找零问题”（或硬币问题），你必须用最少的硬币（货币单位）兑换出一个金额。可以将此问题与自动售货机联系起来：一个人投入的钱超过了商品的价格，售货机将退回多余金额，但要使用尽可能少的硬币。使用贪心算法描述该问题的解决方案（其中
    `b` 是要找回的金额），可能如下：


    *   `C`：持有的硬币

    *   `S`：要找回的硬币

    *   `solution()`：`S` 的值等于 `b`

    *   `feasible()`：如果机器中含有该硬币且可以使用

    *   `select()`：可以使用的最大硬币


    例如，如果你考虑丹麦的硬币：1 克朗、2 克朗、5 克朗、10 克朗和 20 克朗，且兑换的金额 `b` 总是整数克朗，那么策略也是如此：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_11.jpg)


    注意，在假设机器有足够硬币的情况下，算法会找到一个解（`b` 是整数克朗，因此可以用 1 克朗硬币兑换）。这是一种对硬币价值具有贪心的算法。它首先尝试尽可能取出所有的
    20 克朗硬币，然后尽可能取出所有的 10 克朗硬币，以此此类推，且每次都不考虑这是否是最佳选择。


    在 Java 中实现该算法（`CoinProblem` 项目），我首先为硬币写了一个模型类：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_111.jpg)


    这里唯一需要注意的是，`Coin` 对象是可比较的，因此它们根据硬币的价值降序排列。然后，我写了一个类，将硬币数量分配给 `Coin` 对象：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_112.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_12.jpg)


    没什么好解释的，但该类必须代表给定值的 `Coin`，并用于跟踪机器应该退回多少枚该值的硬币。接下来，是实现上述算法的 `Greedy` 类：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_121.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_13.jpg)


    类持有的硬币存储在 `Map<Coin, Integer>` 中。这是一个 `TreeMap`，确保硬币根据其值降序排序。该类有一个 `add()` 方法，用于向机器填充硬币。最重要的方法是
    `exChange()`，它用于兑换金额。该方法开始创建一个解决方案列表，初始为空，这与算法对应。`solution()` 方法表示如果列表不为空且金额为
    0，则存在解，因此整个金额已兑换；该方法持续迭代直到找到解或尝试了所有硬币仍未找到解。`feasible()` 测试硬币是否可以使用，如果硬币值小于金额且机器有该种硬币，则可以使用。`select()`
    通过减少机器持有量并将硬币添加到结果中选择硬币。特别要注意 `exChange()` 方法中的最后一个循环，用于在机器必须放弃兑换金额时取消已选择的硬币。


    最后，是一个尝试兑换金额 20 的程序或测试方法：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_14.jpg)


    在实践中，编写贪心算法必须同时对正确性和最优性进行论证。上面我论证了正确性。至于算法是否最优，这取决于是否假设金额小于。在本章的引言中，我提到过贪心算法通常是有效的，上述算法就是如此。如果你有金额
    N，需要 N 次操作来找到，最坏情况下是线性的。然而，你可以做得更好。如果你在 `Greedy` 类中将 `feasible()` 修改为


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_15.jpg)


    并将 `select()` 修改为


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_16.jpg)


    那么算法可以写成这样：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_161.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_17.jpg)


    基本上，这是同一个算法，但现在它在原则上与金额无关，且只有常数次操作，因此具有常数时间复杂度。


