    ## 9.4 最近邻算法


    一种非常简单的算法是从一个顶点开始，在这里你选择通往最近后继者的路径，然后到达另一个顶点。在这里重复该过程，并选择权重最小的顶点作为后继，如果有多个选项，必须选择其中一个。这是一个极其简单的算法，唯一需要注意的是你不应该去已经去过的顶点。如果图如上所示且你从
    A 开始，有 4 个选项，你必须前往权重为 6 的 D：


    ![](img/Image5780.jpg)


    然后有三个选项，你必须前往权重为 5 的 C：


    ![](img/Image5791.jpg)


    下一次只有 2 个选项，因为 A 和 D 已经添加到路径中，并且由于 B 和 E 的最小权重为 9，所以前往 E：


    ![](img/Image5804.jpg)


    然后只有一个选项，即前往 B：


    ![](img/Image5811.jpg)


    最后，通过返回 A 使路径关闭：


    ![](img/Image5819.jpg)


    因此，算法找到返回


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_199.jpg)


    这是一个贪心算法。当你站在一个顶点时，你选择从该处开始看起来是最佳解决方案的路径，而不考虑长期来看另一个选择是否可能更好。如果你将结果与暴力算法进行比较，你可以发现在这种情况下最近邻算法并没有决定最优解，但另一方面，它既是一个简单又有效的算法。该算法可以用
    Java 如下实现：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_200.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_201.jpg)


    这一次你可以指定起始顶点，如果将该方法应用于使用 `build2()` 方法创建的图，结果可能如下，但这次参数的值值为 26：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_2011.jpg)


    你应该注意，该方法在 26 个节点的图中找到了最短路径，并且没有花费很长时间，而且结果是正确的（否则路径的总长度至少为 260）。然而，无法确定算法是否找到了正确的解，正如第一个例子所示——这是它作为贪心算法的代价。


    按照该算法目前的写法，它也适用于非完全图。然而，即使图具有哈密顿环，也无法确定它是否找到了解决方案。考虑以下方法，它构造了一个具有 `n` 个顶点的图，因此每个顶点的度至少为
    `n / 2`：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_2012.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_202.jpg)


    该方法是有效的，因为它尝试添加随机边，直到所有顶点的度都足够大，但根据理论，之后图应该具有哈密顿环。测试方法 `test3()` 测试了 `nearestNeigbor()`，但对于每个图，都会尝试所有顶点作为起始顶点，直到找到解决方案——如果存在。尽管图具有哈密顿环，但不能确定
    `nearestNeigbor()` 能找到它。


    如果你发现该方法很慢，不是由于 `nearestNeigbor()`，而是由于 `build3()`。在这里你可以尝试将循环改为：


