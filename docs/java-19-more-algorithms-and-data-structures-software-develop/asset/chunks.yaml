    ## 10 最终示例：活动


    为了管理和跟踪项目花费的时间，通常使用时间图作为工具。时间图由用箭头连接的活动组成，以显示活动之间的相互依赖关系，例如：


    ![](img/Image5826.jpg)


    图的读取方式如下：活动 A 必须在活动 B 和 C 开始之前完成。在活动 B 完成之前，活动 D 不能开始，B 是 D 的直接前驱，因此 A 是 D 的间接前驱。与活动相关的有几个术语或值如下所示：


    ![](img/Image5834.jpg)


    我将使用以下缩写：


    *   活动：A

    *   持续时间：D

    *   最晚直接前驱：P

    *   最早直接后继：S

    *   最早开始：Es

    *   最早结束：Ee

    *   最晚开始：Ls

    *   最晚结束：Le

    *   自由松动：Fs

    *   总松动：Ts


    项目的开始时间设置为 0。它被用作所有可以在项目开始时开始的活动的最早开始时间，因为它们没有前驱。


    然后，对于这些活动，确定计算出的最早结束时间并将其添加到框中。活动的最早结束时间通过加上最早开始时间和持续时间得到 (`Ee = D + Es`）。


    其他活动的最早开始时间通过转移最近直接前驱的最早结束时间来确定 (`Es = Max (Ee, Ee, … | all predecessors)`）。也就是说所有直接前驱都预计在活动开始之前完成。然后按照上述方法计算最早结束时间。


    项目的持续时间是最大的最早结束时间。计算出的项目持续时间被认为是构成项目完成活动的最晚接受结束时间，即所有没有后继的活动。


    项目的持续时间被应用于所有没有后继的活动作为最晚结束时间，之后这些活动的最晚开始时间可以通过从最晚结束时间减去持续时间算出 (`Ls = Le-D`)。


    其他活动的最近开始结束时间现在可以通过从右到左扫描所有活动来计算。活动的最后结束通过转移最早直接后继的最早开始时间确定 (`Le = Min (Ls, Ls,
    … | all successors)`)。其他活动的最后开始时间通过从活动的最晚结束时间减去持续时间得到。


    #### 关键活动、关键路径和松动


