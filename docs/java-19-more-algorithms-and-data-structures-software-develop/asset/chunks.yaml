- fmt: "\n# Poul Klausen\n\n# Java 19: More algorithms and data structures\n\nSoftware\
    \ Development\n\nJava 19: More algorithms and data structures: Software Development\n\
    \n1st edition\n\n© 2018 Poul Klausen & [bookboon.com](http://bookboon.com)\n\n\
    ISBN 978-87-403-2619-2\n\nPeer review by Ove Thomsen, EA Dania\n\n# Foreword\n\
    \nThe current book is the nineteenth in this series of books on software development\
    \ in Java, and it is a continuation of the previous book. The book provides examples\
    \ of algorithm paradigms including classic algorithms. In addition, several other\
    \ data structures are described, including the implementation of a red-black binary\
    \ tree. General trees are also treated in the form of a B-tree and a B+ tree and\
    \ they are implemented as Java classes. A large part of the book is deals with\
    \ graphs, including how a graph can be implemented as a class in Java. In addition,\
    \ classic graph algorithms are described and implemented such as Dijkstra’s algorithm\
    \ and Prim’s algorithm. The book ends with a chapter that introduces the traveling\
    \ salesman problem, primarily as an example of an algorithm, where one does not\
    \ know any solution that can be used in practice.\n\nAs the title says this series\
    \ of books deals with software development, and the goal is to teach the reader\
    \ how to develop applications in Java. It can be learned by reading about the\
    \ subject and by studying complete sample programs, but most importantly by yourself\
    \ to do it and write your own programs from scratch. Therefore, an important part\
    \ of the books is exercises and problems, where the reader has to write programs\
    \ that correspond to the substance being treated in the books. All books in the\
    \ series is built around the same skeleton and will consist of text and examples\
    \ and exercises and problems that are placed in the text where they naturally\
    \ belongs. The difference between exercises and problems is that the exercises\
    \ largely deals with repetitions of the substance that is presented in the text,\
    \ and furthermore it is relatively accurately described what to do. Problems are\
    \ in turn more loosely described, and are typically a little bigger and there\
    \ is rarely any clear best solution. These are books to be read from start to\
    \ finish, but the many code examples, including exercises and problems plays a\
    \ central role, and it is important that the reader predict in detail studying\
    \ the code to the many examples and also solves the exercises and problems or\
    \ possibly just studying the recommended solutions.\n\nAll books ends with one\
    \ or two larger sample programs, which focus primarily is on process and an explanation\
    \ of how the program is written. On the other hand appears the code only to a\
    \ limited extent – if at all – and the reader should instead study the finished\
    \ program code perhaps while testing the program. In addition to show the development\
    \ of programs that are larger than the examples, which otherwise is presented,\
    \ the aim of the concluding examples also is to show program examples from varying\
    \ fields of application.\n\nMost books also ends with an appendix dealing with\
    \ a subject that would not be treated in the books. It may be issues on the installation\
    \ of software or other topics in computer technology, which are not about software\
    \ development, but where it is necessary to have an introductory knowledge. If\
    \ the reader already is familiar with the subject, the current appendix can be\
    \ skipped.\n\nThe programming language is, as mentioned Java, and besides the\
    \ books use the following products:\n\n*   NetBeans as IDE for application development\n\
    *   MySQL to the extent there is a need for a database server (from the book Java\
    \ 6 onwards)\n*   GlassFish as a web server and application server (from the book\
    \ Java 11 onwards)\n*   Android Studio, that is a tool to development of apps\
    \ to mobil phones\n\nIt is products that are free of charge and free to install,\
    \ and there is even talk about products, where the installation is progressing\
    \ all by itself and without major efforts and challenges. In addition, there are\
    \ on the web detailed installation instructions for all the three products. The\
    \ products are available on Windows and Linux, and it therefore plays no special\
    \ role if you use Linux or Windows.\n\nAll sample programs are developed and tested\
    \ on machines running Linux. In fact, it plays no major role, as both Java and\
    \ other products work in exactly the same way whether the platform is one or the\
    \ other. Some places will be in the books where you could see that the platform\
    \ is Linux, and this applies primarily commands that concerning the file system.\
    \ Otherwise it has no meaning to the reader that the programs are developed on\
    \ a Linux machine, and they can immediately also run under Windows unless a program\
    \ refers to the file system where it may be necessary to change the name of a\
    \ file.\n\nFinally a little about what the books are not. It is not “how to write”\
    \ or for that matter reference manuals in Java, but it is as the title says books\
    \ on software development. It is my hope that the reader when reading the books\
    \ and through the many examples can find inspiration for how to write good programs,\
    \ but also can be used as a source collection with a number of examples of solutions\
    \ to concrete everyday programming problems that you regularly face as a software\
    \ developer.\n\n# 1 Introduction\n\nThis book is an immediate continuation of\
    \ the previous book on algorithms and data structures and contains primarily topics\
    \ that were not available in the previous book. The book consists of two parts,\
    \ in which the first part deals with algorithm paradigms and expands what has\
    \ been said about algorithms in the previous book, while the other part deals\
    \ with several data structures, and especially graphs. The topics are as follows:\n\
    \n1.  `Greedy algorithms`, and as examples of greedy algorithms, the `load problem`\
    \ and `Huffman` encoding are used.\n2.  `Divide and conquer`, and as examples\
    \ of such algorithms, the `closest-points problem` and `The Tower of Hanoi` are\
    \ used.\n3.  `Dynamic programming`, and as examples of problem solving after this\
    \ template, the `coin problem` and the `0/1 Knapsack` problem are used.\n4.  `Backtracking`,\
    \ and as examples, `Eight Queens Problem` is used and the determination of all\
    \ permutations for a positive integer `n`.\n5.  The class `DisjointSet`, which\
    \ represents an equivalence relation. The class is used to implement an algorithm\
    \ that finds its way through a maze.\n6.  `Randomization algorithms`, which are\
    \ algorithms, where the next step in the algorithm is selected by a random generator.\
    \ As an example, an algorithm that creates a `Sudoku` is used.\n7.  Implementing\
    \ a binary tree as a `red-black` tree. Binary trees have been treated in the previous\
    \ book, but the algorithm has been postponed to this book for reasons of space.\n\
    8.  General trees, including general search trees. As an example, a B tree and\
    \ a B+ tree are implemented as Java classes.\n9.  As the last graphs are treated,\
    \ including an example of how to implement a graph as a data structure. In connection\
    \ with graphs typical graph algorithms are treated:\n\n    *   `Dijkstra’s algorithm`\n\
    \    *   `Bellman-Ford`\n    *   `Topological sort`\n    *   `Prim’s algorithm`\n\
    \    *   An overall introduction to `The Traveling Salesman Problem`.\n\nCode\
    \ to many of the examples fills a lot and is only shown to a lesser degree in\
    \ the book. Refer to the completed examples, which can be downloaded from the\
    \ book’s website, as well as the code for the final example showing an activity\
    \ planning program.\n\n# 2 Greedy algorithms\n\nThere is a family of algorithms\
    \ known as `greedy algorithms`, which try to construct an optimal solution to\
    \ a problem through a number of steps. In each step, based on given criteria,\
    \ a decision is chosen that deemed to be the best choice towards a final solution\
    \ to the problem.\n"
