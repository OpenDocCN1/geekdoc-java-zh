  trans: "\n\n# Poul Klausen\n\n# Java 19：更多算法与数据结构\n\n软件开发\n\nJava 19：更多算法与数据结构：软件开发\n\
    \n第 1 版\n\n© 2018 Poul Klausen & [bookboon.com](http://bookboon.com)\n\nISBN 978-87-403-2619-2\n\
    \n由 Ove Thomsen, EA Dania 同行评审\n\n# 前言\n\n本书是 Java 软件开发系列书籍中的第 19 本，它是前一本书的延续。书中提供了各种算法范式的示例，包括经典算法。此外，还描述了其他几种数据结构，包括红黑二叉树的实现。还以\
    \ B 树和 B+ 树的形式处理了通用树，并将它们实现为 Java 类。书中很大一部分涉及了图论，包括如何在 Java 中以类的形式实现图。此外，还描述并实现了经典的图算法，例如\
    \ Dijkstra 算法和 Prim 算法。书的最后以一个形式结束，该章节介绍了旅行商问题，主要将其作为算法的一个示例，在这一问题中，人们并不知道任何可以在实践中使用的解决方案。\n\
    \n正如标题所示，这一系列书籍涉及软件开发，目标是教读者如何用 Java 开发应用程序。可以通过阅读有关该主题的内容和学习完整的示例程序来学习，但最重要的是亲自动实践并从零开始编写自己的程序。因此，书中的一个重要部分是练习和问题，读者必须编写与书中处理的内容相对应的程序。该系列中的所有书籍都围绕同一个骨架构建，由文本、示例、练习和问题组成，这些内容被放在文中自然的位置。练习（exercises）和问题（problems）的区别在于，练习主要涉及对文中介绍内容的重复，并且对要做什么描述得相对准确。相比之下，问题的描述较为松散，通常规模更大，且很少有明确的最佳解。这些书是应该从头到尾读完的，但许多代码示例（包括练习和问题）起着核心作用，读者详细地研究许多示例的代码，并解决练习和问题，或者只是学习推荐的解决方案，这是非常重要的。\n\
    \n所有书籍都以一个或两个较大的示例程序结束，这些程序主要关注过程以及对程序如何编写的解释。另一方面，代码仅在有限范围内出现——如果有的话——读者应该通过在测试程序时来学习完成的程序代码。除了展示比文中呈现示例更大的程序开发外，总结示例的目的还在展示来自不同应用领域的程序示例。\n\
    \n大多数书籍还以一个附录结束，处理书中未涉及的主题。这可能是软件安装问题或其他计算机技术领域的课题，这些主题不关于软件开发，但是拥有必要的基础知识。如果读者已经熟悉该主题，可以跳过当前的附录。\n\
    \n编程语言如前所述为 Java，除了书籍外还使用了以下产品：\n\n*   NetBeans 作为应用程序开发的 IDE\n*   MySQL，在需要数据库服务器时（从\
    \ Java 6 版的书开始）\n*   GlassFish 作为 Web 服务器和应用服务器（从 Java 11 版的书开始）\n*   Android\
    \ Studio，即用于开发手机端 App 的工具\n\n这些产品都是免费且可免费安装的，甚至提到了某些产品可以自动完成安装，不需要费力的努力和应对挑战。此外，网络上为这三个产品提供了详细的安装说明。这些产品适用于\
    \ Windows 和 Linux，因此你使用 Linux 还是 Windows 并没有什么特殊影响。\n\n所有示例程序都是在运行 Linux 的机器上开发和测试的。事实上，这并没有主要影响，因为无论平台是哪一个，Java\
    \ 和其他产品的运行方式都完全相同。书中某些地方你会看到平台是 Linux，这主要适用于涉及文件系统的命令。其他情况下，对于读者来说，程序在 Linux 机器上开发并没有意义，它们也可以立即在\
    \ Windows 下运行，除非程序引用了文件系统，在该时可能需要更改文件名。\n\n最后，简单介绍一下这些书不是什么。它们不是关于“如何编写”的指南，或者说是\
    \ Java 的参考手册，而是正如标题所示，关于软件开发的书籍。我希望读者在阅读这些书籍并通过许多示例时，能够找到编写良好程序的灵感，也可以将其作为一个解决方案汇集，提供许多你作为软件开发人员经常面对的具体日常编程问题的解决方案示例。\n\
    \n# 1 引言\n\n本书是前一本关于算法和数据结构书籍的直接延续，主要包含了在前书中未出现的主题。本书由两部分组成，第一部分处理算法范式，并扩展了前一书中关于算法的内容，而另一部分处理若干数据结构，特别是图。主题如下：\n\
    \n1.  `贪心算法`，并以装载问题（`load problem）和 `Huffman` 编码作为贪心算法的示例。\n2.  `分治法`（`Divide\
    \ and conquer`），并以最近点问题（`closest-points problem`）和哈利诺塔（`The Tower of Hanoi`）作为此类算法的示例。\n\
    3.  `动态规划`（`Dynamic programming`），并以使用此模板解决问题的硬币问题（`coin problem`）和 0/1 背包问题（`0/1\
    \ Knapsack`）作为示例。\n4.  `回溯法`（`Backtracking`），并以皇后问题（`Eight Queens Problem`）以及正整数\
    \ `n` 的全排列作为示例。\n5.  `DisjointSet` 类，表示一种等价关系。该类用于实现一种寻找迷宫路径的算法。\n6.  `随机算法`（`Randomization\
    \ algorithms`），即通过随机生成器选择算法下一步的算法。以创建一个数独（`Sudoku`）的算法作为示例。\n7.  将二叉树实现为红-black\
    \ 树。二叉树在前书中讨论过，但该算法由于空间原因被推到了本书。\n8.  通用树，包括通用搜索树。作为示例，将 B 树和 B+ 树实现为 Java 类。\n\
    9.  最后处理图，包括一个将图实现为数据结构的示例。在图方面，讨论了典型的图算法：\n\n    *   `Dijkstra 算法`\n    *   `Bellman-Ford`\n\
    \    *   `拓扑排序`\n    *   `Prim 算法`\n    *   旅行商问题（`The Traveling Salesman Problem`）的总体介绍\n\
    \n许多示例的代码占据空间很大，在书中显示较少。请参考从书籍网站下载的完整示例，以及最后一个活动计划程序示例的代码。\n\n# 2 贪心算法\n\n有一种被称为贪心算法（`greedy\
    \ algorithms`）的算法族，它们通过一系列步骤尝试构造问题的最优解。在每一步中，根据给定的标准选择一个被认为是通向最终解决方案的最佳选择。\n\n"
- fmt: '

    A greedy algorithm is performed in phases or steps, which performs in each phase,
    what seems to be the best, but without interfering with future consequences. This
    means that you always find a local best solution and thus use a “take what you
    can get now” strategy and hence the name of the algorithms. When the algorithm
    stops, one hopes that the local best solution is close to the optimal solution.
    If so, the algorithm is correct, but otherwise it is a sub-optimal solution.


    Immediately, it is not obvious where such algorithms can be used, but typically
    it’s algorithms that are easy to implement and are also effective, and in situations
    where one does not necessarily need an optimal solution, a greedy algorithm can
    be quite reasonable.


    A little abstract, you can formulate the solution of a greedy algorithm as follows:


    *   `C`: a collection of candidates for a solution

    *   `S`: the collection of selected candidates

    *   `solution()` which checks whether a collection of candidates is a solution

    *   `feasible()` which checks whether a collection of candidates can lead to a
    solution

    *   `select()` which returns the best candidate for a solution


    One of the classic examples of a greedy algorithm is the so-called repayment problem
    (or coin problem), where you have to exchange an amount in as few coins (money
    units) as possible. One can think of the problem in relation to a vending machine
    where a person throws in more money than what the goods costs and the vending
    machine will then return the excess amount, but with as few coins as possible.
    To describe the solution of this problem by using a greedy algorithm, where `b`
    is the amount to be returned, it could be something like the following:


    *   `C` the holding of coins

    *   `S` the coins to be thrown back

    *   `solution()` the value of `S` is equal `b`

    *   `feasible()` if the machine contains the coin and it can be used

    *   `select()` the largest coin that can be used


    For example, if you think of Danish coins: 1-crown, 2-crown, 5-crown, 10-crown
    and 20-crown and the amount `b` to be exchanged is always in whole crowns, so
    is the strategy:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_11.jpg)


    Note that assuming the machine has enough coins, the algorithm finds a solution
    (`b` is an entire number of crowns and can therefore always be exchanged in 1-crown
    coins). It is an algorithm that is greedy about the value of the coin. It first
    tries to take all the 20-crowns coins as it can, then all the 10-crown coins as
    it can and so on, and every time without taking into account if that is the best
    choice.


    To implement the algorithm in Java (`CoinProblem` project) I have first written
    a model class for a coin:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_111.jpg)


    and the only thing here is to note is that `Coin` objects are comparable so they
    are arranged after falling value of the coin. I have then written a class that
    assign a number of coins to a `Coin` object:


