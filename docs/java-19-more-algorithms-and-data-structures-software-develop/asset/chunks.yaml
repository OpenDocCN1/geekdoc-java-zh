    ## 8.6 Minimum spanning tree


    A tree can be perceived as a graph with a starting element, because a tree consists
    of nodes (vertices) and each node has a unique parent (edge). Since each node
    has exactly one parent, it is an acyclic graph. Generally, a graph is not a tree,
    but given an non-oriented weighted graph, for example


    ![](image/Image5648.jpg)


    you can remove edges so that it becomes a tree:


    ![](image/Image5655.jpg)


    It is a tree, and such a tree is called for a spanning tree, as there is a path
    from the root to any other vertex – all vertices are included. In this case the
    graph is weighted and you can then try to determine the least spanning tree which
    is a spanning tree so the distance from the root to the vertices is minimal.


    There are several algorithms to determine the least spanning tree for a non-oriented
    weighted graph, and I will show a very simple algorithm called `Prim’s algorithm`.
    The procedure is:


    1. Begin by choosing a start vertex and add it to the least spanning tree.

    2. Repeat as long as all vertices are not added to the tree: Find the smallest
    edge from the tree to a vertex that has not already been added to the tree and
    add it to the tree.


    If you use the above tree as an example and starts in A, it is added to the tree
    as root, and at the same time you mark the successors as candidates:


    ![](image/Image5663.jpg)


    Now you choose the shortest path to a candidate, that is the edge to C, and this
    vertex is now added to the tree, while at the same time selecting its successors
    as candidates:


    ![](image/Image5670.jpg)


    That is that the tree now consists of the edge between A and C. As the next step,
    you now take the candidate who has the least distance to the tree:


    ![](image/Image5678.jpg)


    This time there were several options:


    [A, B], [C, E], [C, D]


    where the distance to the tree is all 2 and I have chosen the first one. By adding
    B to the tree, it now consists of three nodes and there is a single new edge as
    a candidate (the edge between B and C will not be candidate because C is already
    a node in the tree). To choose a new vertex for the tree, I will again choose
    the candidate with the least weight and there are two options this time. I choose
    E:


    ![](image/Image5687.jpg)


    At the same time, the edge between E and I becomes a candidate. Next time there
    is only one option, namely the edge between C and D:


    ![](image/Image5698.jpg)


    and the edge between D and H becomes candidate. The smallest candidate that now
    connects a vertex to the tree is the edge between E and I so that you insert it
    into the tree:


    ![](image/Image5711.jpg)


    At the same time there are two new candidates, and here is the edge between I
    and G with the weight 2 the best:


    ![](image/Image5718.jpg)


    The next edge becomes the edge between G and H:


    ![](image/Image5726.jpg)


    and finally there is the edge between H and F:


    ![](image/Image5733.jpg)


    The result is a spanning tree as shown below:


    ![](image/Image5741.jpg)


    The algorithm is relatively simple, but back, of course, there is also where the
    algorithm is solving the task, how good it is and how to implement it.


    Regarding the first, there are several things to consider. First, one should consider
    that a connected non-oriented graph generally has a spanning tree. With it in
    place and if the graph is weighted, you must explain that the above procedure
    leads to a smallest spanning tree. The above illustrates an algorithm, but does
    not prove it, and although it is beyond the scope of this book, I can state that
    it is possible to formally prove Prim’s algorithm.


    The class `GraphTools` implements the algorithm (the method `prim()`), where the
    comments should explain the procedure. The method returns the spanning tree as
    a data structure of the form:


    ![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_187.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_188.jpg)![](image/Java_19_–_More_algorithms_and_data_structures_15-11-18_189.jpg)


