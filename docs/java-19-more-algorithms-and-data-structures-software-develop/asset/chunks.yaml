    作为另一种方案，你也可以将所有图算法实现为 `Graph` 类中的实例方法，或者更好是实现在专门的类中。当我选择在特殊的工具类中将其作为静态方法实现时，这样做是为了更好地专注于算法本身；同时也是因为尽管存在上述的强耦合，但图的实现与算法的实现之间仍然存在某种形式的解耦，不过代价是拷贝顶点带来的开销。


    ## 8.3 遍历图


    按照上述图的实现方式，它立即支持遍历图，并返回一个可以用于遍历所有顶的迭代器。然而，这个迭代器的问题在于，它不保证你访问各个顶的顺序。通常，你感兴趣的是从某个顶点开始，然后根据某种规则沿着图的边移动。这两种方式分别被称为：


    1. 深度优先遍历 (DFS)

    2. 广度优先遍历 (BFS)


    对于这两种方式，你都从起始顶点开始。


    ### 深度优先


    在深度优先中，你会到达起始顶点，然后是该顶的后继顶点（如果存在你尚未访问过的顶点）。这会一直持续，直到你无法到达更多的顶点为止（你已经到达图中尽可能深的地方了）。然后回溯，直到你到达一个可以前往尚未访问过的后继顶点的顶点。最后，你无法无法继续，要么是因为你已经访问了所有顶点，要么是因为某个顶点从起始顶点没有路径。观察上图，从
    A 开始的深度优先遍历，结果可能是：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_148.jpg)


    注意，还有其他的序列，因为算法并没有告诉你当有更多选择时该怎么做，也就是说当你处于一个顶点，并且有多个未访问的后继顶点时。


    该过程可以描述得更精确一点：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1481.jpg)


    其中 `Print` 必须被解释为处理你所到达顶点的操作。例如，考虑以下具有 8 个顶角的简单图：


    ![](img/Image4803.jpg)


    下面是深度优先遍历的示例，以及当从 A 开始遍历时栈的变化情况。当我必须选择一个节点的后继节点时，我每次都选择未被使用且索引（值）最小的节点。注意，选择最小索引并不是算法的一部分，如果选择不同，序列将会是另一个。


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_150.jpg)


    在 Java 中实现该算法需要两个样东西：一个栈（Stack）和一种标记已处理顶点的方法。为了实现后者，在 `GraphTools` 类的文件中定义了一个扩展顶点并带有多个字段的类：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1501.jpg)


    在这种情况下，只使用了 `used` 字段，并用它来标记顶点为已访问。其他字段被其他图算法使用，我稍后会介绍。`GraphTools` 类有一个方法，可以将图的顶点封装在
    `Node` 对象中：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1502.jpg)


    在这里你应该注意，该方法使用了 `Graph` 类中定义的 `getVertices()` 迭代器。这是一个具有包级可见性的方法，因此可以在 `GraphTools`
    类中获取顶点。该方法很简单，但它被用于后续所有的图算法中——当然会有轻微的性能损失，因为创建了一个 map。


    所有图算法都使用起始顶点，因此 `GraphTools` 类也实现了一个简单的辅助方法来寻找起始顶点。如果顶点不存在，该方法返回 `null`：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1511.jpg)


    最后，还有一个辅助方法：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1512.jpg)


    如果存在未标记的节点后继节点，则它返回该节点的后继节点。如果不是如此，该方法返回 `null`。在有了这些条件后，深度优先遍历的算法可以写如下：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1513.jpg)


    其中


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_152.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_153.jpg)


    是一个静态内部类。与之前所说的相比，没有什么需要解释的。迭代器类中的构造函数首先创建一个带有角的新 map，但这次扩展到了带有图算法额外信息的节点。接下来是起始顶点——即具有该值的顶点。接下来创建一个栈，并将第一个元素放入栈中。然后迭代器指向该元素。只要栈不为空，循环就会运行，尝试寻找栈顶节点的后继节点。如果可能，你弹出栈，否则如果找到了后继节点，将其标记并放入栈中。然后迭代器指向该节点。当栈为空时，迭代器已经指向了所有从起始顶点到达的顶点。


    ### 广度优先


    广度优先看起来像深度优先。你从某个顶点开始，然后处理该顶点的所有后继。然后你处理这些后继顶点（如果它们尚未被处理）。这一直持续到处理所有顶点为止——可能除了从起始顶点到达的顶点。与深度优先一样，挑战在于跟踪哪些顶点已经处理过，哪些还需要继续。在深度优先中，任务是通过栈解决的，而在广度优先中，问题改为使用队列（Queue）：


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1531.jpg)![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_154.jpg)


    对于深度相同的简单图，广度优先遍历的结果（我在选择后继节点时再次选择了最小索引）如下所示。我也展示了队列的变化。左侧列显示了最后从队列中出的元素，即下一个要处理其后继的元素。


    ![](img/Java_19_–_More_algorithms_and_data_structures_15-11-18_1541.jpg)


    在 Java 中实现该算法与深度优先相似，该方法使用了相同的辅助方法。


    原则上，两种遍历算法的实现是相同的，它们都实现了迭代器模式。问题是移动迭代器到下一个节点的代价，这里的工作在辅助方法 `getSuccessor()` 中，它的复杂度取决于图的密度。如果图是稀疏的，实际复杂度将接近常数，但如果图是密密的，复杂度是线性的。


