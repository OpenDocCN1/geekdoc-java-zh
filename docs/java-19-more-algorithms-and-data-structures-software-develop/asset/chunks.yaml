    | H |  | ![](image/Java_141.jpg) |  |


    Next time there are two vertices to choose from. Both `C` and `E` have the distance
    6, which is the smallest distance. The algorithm does not tell me which vertex
    I should choose (it does not matter) and I choose the first `C`. There are two
