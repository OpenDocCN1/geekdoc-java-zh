    Dijkstra 算法的一个要求是所有权重都为非负。虽然这种情况并不经常发生，但并没有规定图不能包含负权重。如果是这样的话，人们仍然对最短路径感兴趣，但确定最短路径变得困难，且无法直接使用
    Dijkstra 算法。问题在于，一旦你找到到某个顶点（即当前顶点）的最短路径，一个带有负权重的后继节点可能会通向你已经确定了最短路径的某个顶点更短路径。另一个问题是，如果环中包含负权重，该环会导致距离变得越来越短，你将无法确定最短路径。这增加了算法实现的复杂性，鼓励你研究一下相关代码。


    `Bellman Ford` 的实现不仅更难理解，而且它的时间复杂度也比 Dijkstra 差。Dijkstra 基本上由对顶点进行迭代组成，对每个顶点必须执行的操作取决于其直接后继节点的数量。如果图是稀疏的（边较少），这意味着具有良好近似效果的
    Dijkstra 复杂度如上所示。在 `Bellman Ford` 中，你最坏情况下也必须将所有路径与所有边进行比较（每当你尝试一条边时，你最坏必须检查它对所有路径意味着什么），因此结果的最坏复杂度为
    `O(EV)`，其中 E 是边的数量，V 是顶点的数量。


