    \ `num` 变量中，并将其打印到控制台。\n\n### 检查文件末尾\n\n从文件中读取时，检查文件末尾是非常关重要的。你可以使用 `eof()` 函数检查是否已到达文件末尾。这里有一个示例：\n\
