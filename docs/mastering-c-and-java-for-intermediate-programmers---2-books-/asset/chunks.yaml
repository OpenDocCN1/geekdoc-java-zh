  trans: "\n\n在 C++ 中，函数通常在使用之前进行声明。这种声明被称为函数原型（prototype），为编译器提供了关于函数的返回类型、名称和参数列表的信息。函数原型允许你在代码中实际定义函数之前使用这些函数。\n\
    \n以下是声明函数原型的方法：\n\n```cpp\nreturn_type function_name(parameters);\n```\n\n例如：\n\
    \n```cpp\n#include <iostream>\n\n// 函数原型\nint square(int num);\n\nint main() {\n\
    \    int number = 5;\n    int squared = square(number);\n    std::cout << \"The\
    \ square of \" << number << \" is \" << squared << std::endl;\n    return 0;\n\
    }\n\n// 函数定义\nint square(int num) {\n    int result = num * num;\n    return result;\n\
    }\n```\n\n在这段代码中，我们在程序开头声明了 `square` 函数原型。这使得我们能够在程序末尾实际定义它之前，在 `main` 函数中使用 `square`\
    \ 函数。\n\n### 函数重载\n\nC++ 支持函数重载，这允许你定义多个具有相同名称但参数列表不同的函数。编译器根据传递的参数的数量或类型来决定调用哪个函数。\n\
    \n以下是函数重载的示例：\n\n```cpp\n#include <iostream>\n\n// 两个整数相加函数\nint add(int a, int\
    \ b) {\n    return a + b;\n}\n\n// 两个浮点数相加函数\ndouble add(double a, double b) {\n\
    \    return a + b;\n}\n\nint main() {\n    int sum_int = add(5, 10);\n    double\
    \ sum_double = add(3.5, 2.7);\n    std::cout << \"Sum of integers: \" << sum_int\
    \ << std::endl;\n    std::cout << \"Sum of doubles: \" << sum_double << std::endl;\n\
    \    return 0;\n}\n```\n\n在这个示例中，我们有两个不同参数类型（整数和浮点数）的 `add` 函数。当我们调用 `add` 时，编译器根据参数类型选择合适的函数版本。\n\
    \n### 默认参数\n\nC++ 允许你为函数参数指定默认值。这意味着如果调用者没有为特定参数提供值，则将使用默认值。默认参数使函数更灵活，并可以简化函数调用。\n\
    \n这里有一个示例：\n\n```cpp\n#include <iostream>\n\n// 带有默认参数的函数\nint power(int base,\
    \ int exponent = 2) {\n    int result = 1;\n    for (int i = 0; i < exponent;\
    \ i++) {\n        result *= base;\n    }\n    return result;\n}\n\nint main()\
    \ {\n    int square = power(5); // 使用默认指数值 2\n    int cube = power(3, 3); // 提供自定义的指数值\n\
    \    std::cout << \"Square: \" << square << std::endl;\n    std::cout << \"Cube:\
    \ \" << cube << std::endl;\n    return 0;\n}\n```\n\n在这段代码中，`power` 函数的 `exponent`\
    \ 参数有一个默认参数 `2`。当我们调用 `power(5)` 时，它使用默认值计算平方（因为我们没有提供指数）。当我们调用 `power(3, 3)`\
    \ 时，我们指定了自定义的指数值 `3`。\n\n### 变量作用域\n\n作用域是指变量定义并可以访问的区域或上下文。在 C++ 中，变量具有不同的作用域，它们的可见性和生命周期取决于它们声明的位置。\n\
    \n#### 局部作用域\n\n在函数内部定义的变量被称为具有局部作用域。它们只能在该函数内部被访问，对其他函数或函数外部的代码不可见。当函数退出时，其局部变量会被销毁。\n\
    \n```cpp\n#include <iostream>\n\nvoid myFunction() {\n    int x = 10; // 作用域限于\
    \ myFunction 的局部变量\n    std::cout << \"Inside myFunction: x = \" << x << std::endl;\n\
    }\n\nint main() {\n    myFunction();\n    // 取消下面行的注释将\n    // 导致错误\n    // std::cout\
    \ << \"Outside myFunction: x = \" << x << std::endl;\n    return 0;\n}\n```\n\n\
    在这个示例中，在 `myFunction` 内部定义的变量 `x` 是该函数的局部变量。它无法从 `main` 访问，因为尝试这样做会导致错误。\n\n####\
    \ 全局作用域\n\n在任何函数之外定义的变量（通常在程序开头）具有全局作用域。它们在整个程序（包括所有函数）中都是可见且可访问的。\n\n```cpp\n\
    #include <iostream>\n\nint globalVar = 20; // 具有程序范围的全局变量\nvoid myFunction() {\n\
    \    std::cout << \"Inside myFunction: globalVar = \" << globalVar << std::endl;\n\
    }\n\nint main() {\n    std::cout << \"In main: globalVar = \" << globalVar <<\
    \ std::endl;\n    myFunction();\n    return 0;\n}\n```\n\n在这段代码中，`globalVar` 在全局作用域声明，可以在\
    \ `main` 和 `myFunction` 中均可访问。\n\n#### 作用域解析运算符 (::)\n\n当局部变量与全局变量同名时，你可以使用作用域解析运算符\
    \ `::` 来指定你想要访问哪个变量。\n\n```cpp\n#include <iostream>\n\nint x = 10; // 全局变量\nvoid\
    \ myFunction() {\n    int x = 5; // 与全局变量同名的局部变量\n    std::cout << \"Local x:\
    \ \" << x << std::endl;\n    std::cout << \"Global x: \" << ::x << std::endl;\n\
    }\n\nint main() {\n    myFunction();\n    return 0;\n}\n```\n\n### 变量的生命周期\n\n\
    变量的生命周期是指它在内存中存在并持有有效值的时间。生命周期取决于其作用域和存储期。\n\n#### 自动存储期\n\n具有自动存储期的变量（局部变量的默认情况）其生命周期从程序进入定义它的块开始，到块结束结束。也就是说，它们在函数调用时创建，在函数退出时销毁。\n\
    \n```cpp\n#include <iostream>\n\nvoid myFunction() {\n    int x = 10; // 局部变量\n\
    \    std::cout << \"Inside myFunction: x = \" << x << std::endl;\n} // x 出作用域并在此销毁\n\
    \nint main() {\n    myFunction();\n    // 取消下面行的注释将\n    // 导致错误\n    // std::cout\
    \ << \"Outside myFunction: x = \" << x << std::endl;\n    return 0;\n}\n```\n\n\
    在这段代码中，变量 `x` 具有自动存储期，在调用 `myFunction` 时创建，并在函数退出时销毁。在函数外部访问 `x` 将导致错误。\n\n####\
    \ 静态存储期\n\n具有静态存储期的变量（全局变量或声明为 `static` 的局部变量）其生命周期贯穿整个程序执行。它们在程序启动时创建，在程序退出时销毁。\n\
    \n```cpp\n#include <iostream>\n\nvoid myFunction() {\n    static int x = 10; //\
    \ 具有静态存储期的静态局部变量\n    std::cout << \"Inside myFunction: x = \" << x << std::endl;\n\
    } // x 保留其值并持续整个程序\n\nint main() {\n    myFunction();\n    myFunction(); // x\
    \ 仍为 10（或其修改后的值）\n    return 0;\n}\n```\n\n在这个示例中，变量 `x` 是静态局部变量。它在第一次调用 `myFunction`\
    \ 时创建，在函数调用之间保留其值，并在程序退出时销毁。这允许我们在函数内部和外部访问 `x`。\n\n#### 动态存储期\n\n具有动态存储期的变量由程序员使用动态内存分配函数（如\
    \ `new` 和 `delete`，或 C 中的 `malloc` 和 `free`）显式创建和销毁。它们的生命周期由程序员决定。\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n    int* dynamicVar = new int; // 具有动态存储期的动态变量\n\
    \    *dynamicVar = 42;\n    std::cout << \"DynamicVar: \" << *dynamicVar << std::endl;\n\
    \    delete dynamicVar; // 销毁动态变量\n    return 0;\n}\n```\n\n"
- fmt: "\nIn this code, we allocate memory for a dynamic variable using `new`, assign\
    \ a value to it, and later free the memory using `delete`. The programmer has\
    \ full control over the lifetime of dynamic variables.\n\n### Function Scope\n\
    \nLocal variables declared within a function have function scope, meaning they\
    \ are only visible and accessible within that function. This concept is often\
    \ referred to as block scope because it extends to the block (curly braces `{}`)\
    \ in which the variable is defined.\n\n```cpp\n#include <iostream>\n\nvoid myFunction()\
    \ {\n    int localVar = 5; // Local variable with function scope\n    std::cout\
    \ << \"Inside myFunction: localVar = \" << localVar << std::endl;\n} // localVar\
    \ goes out of scope and is destroyed here\n\nint main() {\n    myFunction();\n\
    \    // Uncommenting the line below would result in an error\n    // std::cout\
    \ << \"Outside myFunction: localVar = \" << localVar << std::endl;\n    return\
    \ 0;\n}\n```\n\nIn this example, `localVar` has function scope and is accessible\
    \ only within the `myFunction` block.\n\n### Global Scope\n\nGlobal variables,\
    \ as mentioned earlier, have global scope, meaning they are accessible from any\
    \ part of the program, including within functions.\n\n```cpp\n#include <iostream>\n\
    \nint globalVar = 20; // Global variable with global scope\n\nvoid myFunction()\
    \ {\n    std::cout << \"Inside myFunction: globalVar = \" << globalVar << std::endl;\n\
    }\n\nint main() {\n    std::cout << \"In main: globalVar = \" << globalVar <<\
    \ std::endl;\n    myFunction();\n    return 0;\n}\n```\n\nIn this code, `globalVar`\
    \ has global scope and can be accessed both within `main` and `myFunction`.\n\n\
    ### Namespace Scope\n\nIn addition to global and function scope, C++ also provides\
    \ namespace scope. A namespace is a way to organize code into separate logical\
    \ groups, and variables declared within a namespace have namespace scope.\n\n\
    Here's a simplified example:\n\n```cpp\n#include <iostream>\n\nnamespace MyNamespace\
    \ {\n    int x = 5; // Variable with namespace scope\n}\n\nint main() {\n    std::cout\
    \ << \"Inside main: x = \" << MyNamespace::x << std::endl;\n    return 0;\n}\n\
    ```\n\nIn this code, `x` has namespace scope within the `MyNamespace` namespace.\
    \ We access it using the scope resolution operator `::` to specify the namespace.\n\
    \n### Lifetime and Scope Summary\n\n- **Lifetime** refers to how long a variable\
    \ exists in memory.\n- **Scope** defines where a variable is visible and can be\
    \ accessed.\n- **Automatic storage duration** applies to local variables, which\
    \ are created when a function is called and destroyed when it exits.\n- **Static\
    \ storage duration** applies to global variables and static local variables, which\
    \ persist for the entire program lifetime.\n- **Dynamic storage duration** involves\
    \ dynamic variables created and destroyed explicitly by the programmer.\n- **Function\
    \ scope** restricts the visibility of variables to the function in which they\
    \ are defined.\n- **Global scope** allows variables to be accessed from anywhere\
    \ in the program.\n- **Namespace scope** applies to variables declared within\
    \ namespaces, making them accessible within that namespace.\n\n## Function Prototypes\
    \ and Definitions\n\nWhen working with functions in C++, you often encounter scenarios\
    \ where you need to declare a function prototype before the actual function definition.\
    \ This is especially true when functions call each other or when their order of\
    \ definition matters.\n\n### Function Prototypes\n\nA function prototype is a\
    \ declaration that tells the compiler about the function's name, return type,\
    \ and parameter list. It provides the necessary information for the compiler to\
    \ understand how to call the function before its actual definition.\n\nHere's\
    \ the syntax for a function prototype:\n\n```cpp\nreturn_type function_name(parameters);\n\
    ```\n\nLet's illustrate this with an example:\n\n```cpp\n#include <iostream>\n\
    \n// Function prototype\nint add(int a, int b);\n\nint main() {\n    int result\
    \ = add(3, 4); // Function call\n    std::cout << \"Result: \" << result << std::endl;\n\
    \    return 0;\n}\n\n// Function definition\nint add(int a, int b) {\n    return\
    \ a + b;\n}\n```\n\nIn this code, we declare the function `add` using a prototype\
    \ before the `main` function. This allows us to call `add` within `main`, even\
    \ though the function definition appears later in the code.\n\n### Why Use Function\
    \ Prototypes?\n\nFunction prototypes serve several important purposes:\n\n1. **Enable\
    \ Forward References**: Prototypes allow you to call a function before its actual\
    \ definition, which is useful when functions call each other or are organized\
    \ in a way that requires forward references.\n2. **Catch Errors**: Prototypes\
    \ help catch errors early in the compilation process. If you mistype the function\
    \ name, return type, or parameter list in the prototype, the compiler will generate\
    \ an error.\n3. **Improve Code Organization**: Prototypes provide a clear overview\
    \ of the functions used in your program and their signatures, making the code\
    \ more organized and readable.\n4. **Facilitate Team Development**: In larger\
    \ projects involving multiple programmers, prototypes help define the interface\
    \ to functions, ensuring consistent usage.\n\n### Multiple Function Prototypes\n\
    \nYou can declare multiple function prototypes for the same function as long as\
    \ they have the same function name but different parameter lists. This is known\
    \ as function overloading.\n\n```cpp\n#include <iostream>\n\n// Function prototypes\
    \ with different parameter lists\nint add(int a, int b);\ndouble add(double a,\
    \ double b);\n\nint main() {\n    int result_int = add(3, 4);         // Calls\
    \ the int version\n    double result_double = add(1.5, 2.5); // Calls the double\
    \ version\n    std::cout << \"Result (int): \" << result_int << std::endl;\n \
    \   std::cout << \"Result (double): \" << result_double << std::endl;\n    return\
    \ 0;\n}\n\nint add(int a, int b) {\n    return a + b;\n}\n\ndouble add(double\
    \ a, double b) {\n    return a + b;\n}\n```\n\nIn this example, we have two versions\
    \ of the `add` function based on the argument types. The prototypes allow us to\
    \ call the appropriate version.\n\n### Function Definitions\n\nFunction definitions\
    \ provide the actual implementation of a function. They specify what the function\
    \ does when it called. A function can be defined only once, but it can be declared\
    \ multiple times using prototypes.\n\nHere's the structure of a function definition:\n\
    \n```cpp\nreturn_type function_name(parameters) {\n    // Function body\n    //\
    \ Code to perform a task\n    return result; // Optional return statement\n}\n\
    ```\n\nLet's revisit the earlier example with function definitions:\n\n```cpp\n\
    #include <iostream>\n\n// Function prototype\nint add(int a, int b);\n\nint main()\
    \ {\n    int result = add(3, 4); // Function call\n    std::cout << \"Result:\
    \ \" << result << std::endl;\n    return 0;\n}\n\n// Function definition\nint\
    \ add(int a, int b) {\n    return a + b;\n}\n```\n\nIn this code, we have both\
    \ a function prototype and a function definition for `add`. The function definition\
    \ appears after the `main` function and provides the actual implementation of\
    \ the addition operation.\n\n### Function Definitions and Declarations\n\nFunction\
    \ declarations, such as prototypes, provide information about a function's name,\
    \ return type, and parameter list. However, declarations don't provide the implementation\
    \ details of the function. Definitions, on the other hand, include the implementation\
    \ code.\n\nIn practice, you can use either a function prototype or a function\
    \ definition in your code. Prototypes are sufficient if you only need to declare\
    \ the function's signature and intend to define the function elsewhere. Definitions,\
    \ on the other hand, include the actual code to execute.\n\n# Chapter 7: Arrays\
    \ and Strings\n\nIn this chapter, we'll explore the essential concepts of arrays\
    \ and strings in C++. These data structures are fundamental for organizing and\
    \ manipulating collections of data, whether it's a list of numbers, characters,\
    \ or more complex information.\n\n## Arrays\n\n### What is an Array?\n"
  raw: 'In this code, we allocate memory for a dynamic variable using `new`, assign
    a value to it, and later free the memory using `delete`. The programmer has full
    control over the lifetime of dynamic variables.


    ### Function Scope


    Local variables declared within a function have function scope, meaning they are
    only visible and accessible within that function. This concept is often referred
    to as block scope because it extends to the block (curly braces `{}`) in which
    the variable is defined.


    ```cpp


    #include <iostream>


    void myFunction() {


    int localVar = 5; // Local variable with function scope


    std::cout << "Inside myFunction: localVar = " << localVar << std::endl;


    } // localVar goes out of scope and is destroyed here


    int main() {


    myFunction();


    // Uncommenting the line below would result in an error


    // std::cout << "Outside myFunction: localVar = " << localVar << std::endl;


    return 0;


    }


    ```


    In this example, `localVar` has function scope and is accessible only within the
    `myFunction` block.


    ### Global Scope


    Global variables, as mentioned earlier, have global scope, meaning they are accessible
    from any part of the program, including within functions.


    ```cpp


    #include <iostream>


    int globalVar = 20; // Global variable with global scope


    void myFunction() {


    std::cout << "Inside myFunction: globalVar = " << globalVar << std::endl;


    }


    int main() {


    std::cout << "In main: globalVar = " << globalVar << std::endl;


    myFunction();


    return 0;


    }


    ```


    In this code, `globalVar` has global scope and can be accessed both within `main`
    and `myFunction`.


    ### Namespace Scope


    In addition to global and function scope, C++ also provides namespace scope. A
    namespace is a way to organize code into separate logical groups, and variables
    declared within a namespace have namespace scope.


    Here''s a simplified example:


    ```cpp


    #include <iostream>


    namespace MyNamespace {


    int x = 5; // Variable with namespace scope


    }


    int main() {


    std::cout << "Inside main: x = " << MyNamespace::x << std::endl;


    return 0;


    }


    ```


    In this code, `x` has namespace scope within the `MyNamespace` namespace. We access
    it using the scope resolution operator `::` to specify the namespace.


    ### Lifetime and Scope Summary


    - **Lifetime** refers to how long a variable exists in memory.


    - **Scope** defines where a variable is visible and can be accessed.


    - **Automatic


    storage duration** applies to local variables, which are created when a function
    is called and destroyed when it exits.


    - **Static storage duration** applies to global variables and static local variables,
    which persist for the entire program lifetime.


    - **Dynamic storage duration** involves dynamic variables created and destroyed
    explicitly by the programmer.


    - **Function scope** restricts the visibility of variables to the function in
    which they are defined.


    - **Global scope** allows variables to be accessed from anywhere in the program.


    - **Namespace scope** applies to variables declared within namespaces, making
    them accessible within that namespace.


    ## Function Prototypes and Definitions


    When working with functions in C++, you often encounter scenarios where you need
    to declare a function prototype before the actual function definition. This is
    especially true when functions call each other or when their order of definition
    matters.


    ### Function Prototypes


    A function prototype is a declaration that tells the compiler about the function''s
    name, return type, and parameter list. It provides the necessary information for
    the compiler to understand how to call the function before its actual definition.


    Here''s the syntax for a function prototype:


    ```cpp


    return_type function_name(parameters);


    ```


    Let''s illustrate this with an example:


    ```cpp


    #include <iostream>


    // Function prototype


    int add(int a, int b);


    int main() {


    int result = add(3, 4); // Function call


    std::cout << "Result: " << result << std::endl;


    return 0;


    }


    // Function definition


    int add(int a, int b) {


    return a + b;


    }


    ```


    In this code, we declare the function `add` using a prototype before the `main`
    function. This allows us to call `add` within `main`, even though the function
    definition appears later in the code.


    ### Why Use Function Prototypes?


    Function prototypes serve several important purposes:


    1\. **Enable Forward References**: Prototypes allow you to call a function before
    its actual definition, which is useful when functions call each other or are organized
    in a way that requires forward references.


    2\. **Catch Errors**: Prototypes help catch errors early in the compilation process.
    If you mistype the function name, return type, or parameter list in the prototype,
    the compiler will generate an error.


    3\. **Improve Code Organization**: Prototypes provide a clear overview of the
    functions used in your program and their signatures, making the code more organized
    and readable.


    4\. **Facilitate Team Development**: In larger projects involving multiple programmers,
    prototypes help define the interface to functions, ensuring consistent usage.


    ### Multiple Function Prototypes


    You can declare multiple function prototypes for the same function as long as
    they have the same function name but different parameter lists. This is known
    as function overloading.


    ```cpp


    #include <iostream>


    // Function prototypes with different parameter lists


    int add(int a, int b);


    double add(double a, double b);


    int main() {


    int result_int = add(3, 4);       // Calls the int version


    double result_double = add(1.5, 2.5); // Calls the double version


    std::cout << "Result (int): " << result_int << std::endl;


    std::cout << "Result (double): " << result_double << std::endl;


    return 0;


    }


    // Function definitions


    int add(int a, int b) {


    return a + b;


    }


    double add(double a, double b) {


    return a + b;


    }


    ```


    In this example, we have two versions of the `add` function, one that takes two
    `int` parameters and another that takes two `double` parameters. The multiple
    prototypes allow us to call the appropriate version based on the argument types.


    ### Function Definitions


    Function definitions provide the actual implementation of a function. They specify
    what the function does when called. A function can be defined only once, but it
    can be declared multiple times using prototypes.


    Here''s the structure of a function definition:


    ```cpp


    return_type function_name(parameters) {


    // Function body


    // Code to perform a task


    return result; // Optional return statement


    }


    ```


    Let''s revisit the earlier example with function definitions:


    ```cpp


    #include <iostream>


    // Function prototype


    int add(int a, int b);


    int main() {


    int result = add(3, 4); // Function call


    std::cout << "Result: " << result << std::endl;


    return 0;


    }


    // Function definition


    int add(int a, int b) {


    return a + b;


    }


    ```


    In this code, we have both a function prototype and a function definition for
    `add`. The function definition appears after the `main` function and provides
    the actual implementation of the addition operation.


    ### Function Definitions and Declarations


    Function declarations, such as prototypes, provide information about a function''s
    name, return type, and parameter list. However, declarations don''t provide the
    implementation details of the function. Definitions, on the other hand, include
    the implementation code.


    In practice, you can use either a function prototype or a function definition
    in your code. Prototypes are sufficient if you only need to declare the function''s
    signature and intend to define the function elsewhere in your program. Definitions,
    on the other hand, include the actual code to execute when the function is called.


    # # Chapter 7: Arrays and Strings


    In this chapter, we''ll explore the essential concepts of arrays and strings in
    C++. These data structures are fundamental for organizing and manipulating collections
    of data, whether it''s a list of numbers, characters, or more complex information.


    ## Arrays


