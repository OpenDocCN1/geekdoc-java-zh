    ```\n\n在这段代码中，我们创建了一个整数变量 `number` 和一个整数指针 `ptrToNumber`。然后我们用 `number` 变量的地址初始化了\
    \ `ptrToNumber`。\n\n### 指针解引用\n\n要访问指针指向的内存位置上存储的值，你需要使用解引用运算符 `*`。解引用指针可以让你直接访问它所指向的值。这是一个示例：\n\
