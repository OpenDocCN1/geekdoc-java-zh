    ## Common Data Types


    C++ provides several built-in data types to represent different kinds of values.
    Choosing the appropriate data type is essential for efficient memory usage and
    accurate representation of data. Let''s explore some common data types:


    ### Integer Types


    #### `int`


    The `int` data type is used to represent integer values. It typically uses 4 bytes
    of memory on most systems and can store whole numbers within a certain range,
    such as -2,147,483,648 to 2,147,483,647 on a 32-bit system.


    ```cpp


    int count = 10; // An example of an integer variable.


    ```


    #### `long` and `long long`


    `long` and `long long` are used for representing larger integer values that may
    not fit within the range of an `int`. `long` typically uses 4 bytes, while `long
    long` uses 8 bytes.


    ```cpp


    long population = 7800000000;       // An example of a ''long'' variable.


    long long largeNumber = 1234567890; // An example of a ''long long'' variable.


    ```


    ### Floating-Point Types


    #### `float` and `double`


    The `float` and `double` data types are used to represent floating-point numbers,
    which include real numbers with decimal points. `float` typically uses 4 bytes
    of memory, while `double` uses 8 bytes, providing greater precision.


    ```cpp


    float pi = 3.14159f;    // An example of a ''float'' variable.


    double salary = 55000.5; // An example of a ''double'' variable.


    ```


    ### Character Types


    #### `char`


    The `char` data type represents individual characters. It uses 1 byte of memory
    to store a single character, such as a letter, digit, or symbol.


    ```cpp


    char grade = ''A''; // An example of a ''char'' variable.


    ```


    ### Boolean Type


    #### `bool`


    The `bool` data type represents boolean values, which can be either `true` or
    `false`. It is often used for conditions and decision-making in C++ programs.


    ```cpp


    bool isStudent = true; // An example of a ''bool'' variable.


    ```


    ### Custom Data Types


    In addition to the built-in data types, C++ allows you to create your custom data
    types using structures (structs) and classes. These custom types enable you to
    define complex data structures and objects, making your code more organized and
    maintainable.


    Custom data types are particularly useful when dealing with real-world entities,
    such as employees, students, or products, as you can encapsulate their attributes
    and behaviors within a structured format.


    ```cpp


    // Define a struct for representing a person.


    struct Person {


    std::string name;


    int age;


    };


    // Create instances of the ''Person'' struct.


    Person person1;


    person1.name = "Alice";


    person1.age = 30;


    Person person2;


    person2.name = "Bob";


    person2.age = 25;


    ```


    In this example, we''ve defined a custom data type `Person` using a struct. Each
    `Person` has a name and an age, allowing us to represent individuals in a structured
    way.


    ## Type Inference (auto)


    C++11 introduced the `auto` keyword, which allows the compiler to automatically
    deduce the data type of a variable based on its initializer. This feature simplifies
    variable declarations and makes code more concise and readable.


    Here''s how you can use `auto`:


    ```cpp


    auto x = 42;         // ''x'' is deduced as an ''int''.


    auto pi = 3.14159;   // ''pi'' is deduced as a ''double''.


    auto name = "Alice"; // ''name'' is deduced as a ''const char*''.


    ```


    By using `auto`, you let the compiler determine the appropriate data type, reducing
    the chances of type-related errors and making your code more flexible.


    ## Constants


    In addition to variables,


    C++ allows you to define constants. Constants are values that do not change during
    the execution of your program. They are useful for defining fixed values that
    should not be modified accidentally.


    ### `const` Keyword


    To declare a constant in C++, you can use the `const` keyword before the data
    type:


    ```cpp


    const int maxScore = 100; // Declares a constant ''maxScore'' with the value 100.


    ```


    Once you''ve declared a constant, its value cannot be changed throughout the program.
    Attempting to modify a constant will result in a compilation error.


    ### Benefits of Constants


    Using constants in your code has several advantages:


    - **Readability**: Constants make your code more readable by providing meaningful
    names for fixed values. For example, using `const int maxScore` is more informative
    than simply using the number `100` throughout your code.


    - **Safety**: Constants prevent accidental changes to important values. If a value
    should remain constant, declaring it as such ensures that it cannot be modified
    inadvertently.


    - **Maintenance**: When you need to update a fixed value used in multiple places,
    you can change it in one location (the constant declaration) rather than hunting
    for every occurrence of the value in your code.


    ## Type Modifiers


    C++ provides type modifiers that allow you to modify the characteristics of data
    types, such as their size or signedness. Let''s explore some common type modifiers:


    ### `unsigned`


    The `unsigned` modifier is used with integer data types (`int`, `long`, `short`,
    etc.) to indicate that the variable can only store non-negative values. In other
    words, it removes the sign bit, allowing the variable to represent a larger range
    of positive values.


    For example, an `unsigned int` can represent values from 0 to 4,294,967,295 (assuming
    a 32-bit system).


    ```cpp


    unsigned int distance = 500; // ''distance'' can only store non-negative values.


    ```


    ### `signed`


    The `signed` modifier is used to indicate that a variable can store both positive
    and negative values. It is the default for most integer data types, so you typically
    don''t need to explicitly use it.


    ```cpp


    int temperature = -10; // ''temperature'' can store positive and negative values.


    ```


    ### `short` and `long`


    The `short` and `long` modifiers are used with integer data types to specify their
    size. A `short int` typically uses 2 bytes of memory, while a `long int` uses
    4 bytes. These modifiers are often used when you need to optimize memory usage
    or work with specific hardware constraints.


    ```cpp


    short int smallNumber = 42; // ''smallNumber'' uses 2 bytes.


    long int bigNumber = 1234567890; // ''bigNumber'' uses 4 bytes.


    ```


    ## Type Casting


    Sometimes, you may need to convert a value from one data type to another. This
    process is known as type casting, and C++ provides two main methods for performing
    it: implicit and explicit type casting.


    ### Implicit Type Casting (Automatic Type Conversion)


    Implicit type casting occurs when the compiler automatically converts one data
    type to another without explicit instructions from the programmer. It''s also
    known as automatic type conversion.


    Here''s an example of implicit type casting:


    ```cpp


    int num1 = 42;


    double num2 = num1; // Implicitly converts ''num1'' (int) to ''num2'' (double).


    ```


    In this example, the integer value in `num1` is implicitly converted to a double-precision
    floating-point number in `num2`.


    ### Explicit Type Casting (Type Conversion)


    Explicit type casting requires the programmer to specify the type conversion explicitly.
    It''s also known as type conversion or type casting. You can use the C++ casting
    operators for this purpose.


    #### C-Style Cast


    The C-style cast operator allows you to perform explicit type casting. It has
    the following syntax:


    ```cpp


    new_type(expression)


    ```


    Here''s an example:


    ```cpp


    double price = 49.99;


    int discountedPrice = (int)price; // Explicitly converts ''price'' (double) to
    ''discountedPrice'' (int).


