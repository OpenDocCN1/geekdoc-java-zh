    \ std::cout << \"Odd: \" << i << std::endl;\n    }\n    i++;\n  }\n  return 0;\n\
    }\n```\n\n在这个示例中，我们使用 `while` 循环从 `0` 迭代到 `4`。在循环内部，我们使用 `if` 语句检查 `i` 的当前值是偶数还是奇数。根据条件，我们打印\
    \ \"Even\" 或 \"Odd\" 以及 `i` 的值。\n\n同样，你可以在 `for` 循环中加入条件逻辑，以实现程序所需的行为。\n\n## 总结\n\
    \n控制结构是编程中用于决策、循环和控制代码流的本质工具。在本章中，我们探索了 `if`、`else` 和 `else if` 的条件语句，允许你根据特定条件执行不同的代码块。我们还学习了\
    \ `while`、`do-while` 和 `for` 循环，它们使你能够在满足某些条件时重复代码。\n\n控制结构配合 `break` 和 `continue`\
    \ 等循环控制语句，可以对你的程序进行精确控制。\n\n# 6. 函数与作用域\n\n在本章中，我们将深入探讨函数和作用域。函数是 C++ 的基础。\n\n\
    ## 理解函数\n\n### 什么是函数？\n\nC++ 中的函数是执行特定任务的命名代码块。函数提供了将程序拆分为更易于管理的部分的方法。\n\n这是函数的基本结构：\n\
    \n```cpp\nreturn_type function_name(parameters) {\n    // 函数体\n    // 执行任务的代码\n\
    \    return result; // 可选的返回语句\n}\n```\n\n让我们拆解函数的组件：\n\n- **返回值（Return Type）**：指定函数完成后返回的值的数据类型。可以是任何有效的\
    \ C++ 数据类型。\n- **函数名（Function Name）**：你选择的用于表示函数的标识符。它应该具有意义并符合命名规范。\n- **参数（Parameters）**：在函数名后的括号内声明的变量。它们作为调用函数时传递给函数的值的占位符。\n\
    - **函数体（Function Body）**：函数体包含执行分配任务的代码。它被封装在大括号 `{}` 中。\n- **返回语句（Return Statement）**：用于向调用代码发送值。它是可选的，特别是对于返回类型为\
    \ `void` 的函数。当遇到 `return` 语句时，函数退出并将指定值传回调用者。\n\n### 函数示例\n\n让我们来看一个计算数字平方的简单示例：\n\
    \n```cpp\n#include <iostream>\n\n// 函数声明\nint square(int num) {\n  int result\
    \ = num * num;\n  return result;\n}\n\nint main() {\n  // 函数调用\n  int number =\
    \ 5;\n  int squared = square(number);\n  std::cout << \"The square of \" << number\
    \ << \" is \" << squared << std::endl;\n  return 0;\n}\n```\n\n在这个示例中，我们有一个名为\
    \ `square` 的函数，接受一个整数参数 `num`。在函数内部，我们计算 `num` 的平方并返回结果。在 `main` 函数中，我们调用 `square(5)`\
    \ 并传递 `5` 作为参数。结果存储在变量 `squared` 中并打印到控制台上。\n\n### 函数原型\n\n"
- fmt: "\nIn C++, functions are typically declared before they are used. This declaration\
    \ is called a function prototype and provides the compiler with information about\
    \ the function's return type, name, and parameter list. Function prototypes enable\
    \ you to use functions before their actual definitions in your code.\n\nHere's\
    \ how you declare a function prototype:\n\n```cpp\nreturn_type function_name(parameters);\n\
    ```\n\nFor example:\n\n```cpp\n#include <iostream>\n\n// Function prototype\n\
    int square(int num);\n\nint main() {\n    int number = 5;\n    int squared = square(number);\n\
    \    std::cout << \"The square of \" << number << \" is \" << squared << std::endl;\n\
    \    return 0;\n}\n\n// Function definition\nint square(int num) {\n    int result\
    \ = num * num;\n    return result;\n}\n```\n\nIn this code, we declare the `square`\
    \ function prototype at the beginning of the program. This allows us to use the\
    \ `square` function in the `main` function before its actual definition at the\
    \ end of the program.\n\n### Function Overloading\n\nC++ supports function overloading,\
    \ which allows you to define multiple functions with the same name but different\
    \ parameter lists. The compiler determines which function to call based on the\
    \ number or type of arguments passed.\n\nHere's an example of function overloading:\n\
    \n```cpp\n#include <iostream>\n\n// Function to add two integers\nint add(int\
    \ a, int b) {\n    return a + b;\n}\n\n// Function to add two doubles\ndouble\
    \ add(double a, double b) {\n    return a + b;\n}\n\nint main() {\n    int sum_int\
    \ = add(5, 10);\n    double sum_double = add(3.5, 2.7);\n    std::cout << \"Sum\
    \ of integers: \" << sum_int << std::endl;\n    std::cout << \"Sum of doubles:\
    \ \" << sum_double << std::endl;\n    return 0;\n}\n```\n\nIn this example, we\
    \ have two `add` functions with different parameter types (integers and doubles).\
    \ When we call `add`, the compiler selects the appropriate version of the function\
    \ based on the argument types.\n\n### Default Arguments\n\nC++ allows you to specify\
    \ default values for function parameters. This means that if a caller doesn't\
    \ provide a value for a particular parameter, the default value will be used.\
    \ Default arguments make functions more flexible and can simplify function calls.\n\
    \nHere's an example:\n\n```cpp\n#include <iostream>\n\n// Function with default\
    \ argument\nint power(int base, int exponent = 2) {\n    int result = 1;\n   \
    \ for (int i = 0; i < exponent; i++) {\n        result *= base;\n    }\n    return\
    \ result;\n}\n\nint main() {\n    int square = power(5); // Uses default exponent\
    \ value of 2\n    int cube = power(3, 3); // Provides custom exponent value\n\
    \    std::cout << \"Square: \" << square << std::endl;\n    std::cout << \"Cube:\
    \ \" << cube << std::endl;\n    return 0;\n}\n```\n\nIn this code, the `power`\
    \ function has a default argument of `2` for the `exponent` parameter. When we\
    \ call `power(5)`, it calculates the square (since we didn't provide an exponent)\
    \ using the default value. When we call `power(3, 3)`, we specify a custom exponent\
    \ value of `3`.\n\n### Scope of Variables\n\nScope refers to the region or context\
    \ in which a variable is defined and can be accessed. In C++, variables have different\
    \ scopes, and their visibility and lifetime depend on where they are declared.\n\
    \n#### Local Scope\n\nVariables declared within a function are said to have local\
    \ scope. They are accessible only within that function and are not visible to\
    \ other functions or code outside of the function. When a function exits, its\
    \ local variables are destroyed.\n\n```cpp\n#include <iostream>\n\nvoid myFunction()\
    \ {\n    int x = 10; // Local variable with scope limited to myFunction\n    std::cout\
    \ << \"Inside myFunction: x = \" << x << std::endl;\n}\n\nint main() {\n    myFunction();\n\
    \    // Uncommenting the line below would\n    // result in an error\n    // std::cout\
    \ << \"Outside myFunction: x = \" << x << std::endl;\n    return 0;\n}\n```\n\n\
    In this example, the variable `x` declared inside `myFunction` is local to that\
    \ function. It cannot be accessed from `main`, as attempting to do so would result\
    \ in an error.\n\n#### Global Scope\n\nVariables declared outside of any function,\
    \ typically at the beginning of a program, have global scope. They are visible\
    \ and accessible throughout the entire program, including all functions.\n\n```cpp\n\
    #include <iostream>\n\nint globalVar = 20; // Global variable with program-wide\
    \ scope\nvoid myFunction() {\n    std::cout << \"Inside myFunction: globalVar\
    \ = \" << globalVar << std::endl;\n}\n\nint main() {\n    std::cout << \"In main:\
    \ globalVar = \" << globalVar << std::endl;\n    myFunction();\n    return 0;\n\
    }\n```\n\nIn this code, `globalVar` is declared at the global scope and is accessible\
    \ both within `main` and `myFunction`.\n\n#### Scope Resolution Operator (::)\n\
    \nIn cases where there's a local variable with the same name as a global variable,\
    \ you can use the scope resolution operator `::` to specify which variable you\
    \ want to access.\n\n```cpp\n#include <iostream>\n\nint x = 10; // Global variable\n\
    void myFunction() {\n    int x = 5; // Local variable with the same name as the\
    \ global variable\n    std::cout << \"Local x: \" << x << std::endl;\n    std::cout\
    \ << \"Global x: \" << ::x << std::endl;\n}\n\nint main() {\n    myFunction();\n\
    \    return 0;\n}\n```\n\n### Lifetime of Variables\n\nThe lifetime of a variable\
    \ is the duration for which it exists in memory and holds a valid value. The lifetime\
    \ of a variable depends on its scope and storage duration. \n\n#### Automatic\
    \ Storage Duration\n\nVariables with automatic storage duration (the default for\
    \ local variables) have a lifetime that begins when the program execution enters\
    \ the block in which the variable is defined and ends when the block is exited.\
    \ In other words, they are created when the function is called and destroyed when\
    \ the function exits.\n\n```cpp\n#include <iostream>\n\nvoid myFunction() {\n\
    \    int x = 10; // Local variable\n    std::cout << \"Inside myFunction: x =\
    \ \" << x << std::endl;\n} // x goes out of scope and is destroyed here\n\nint\
    \ main() {\n    myFunction();\n    // Uncommenting the line below would result\
    \ in an error\n    // std::cout << \"Outside myFunction: x = \" << x << std::endl;\n\
    \    return 0;\n}\n```\n\nIn this code, the variable `x` has automatic storage\
    \ duration and is created when `myFunction` is called and destroyed when the function\
    \ exits. Attempting to access `x` outside of the function would result in an error.\n\
    \n#### Static Storage Duration\n\nVariables with static storage duration (global\
    \ variables or local variables declared as `static`) have a lifetime that extends\
    \ throughout the entire program execution. They are created when the program starts\
    \ and destroyed when the program exits.\n\n```cpp\n#include <iostream>\n\nvoid\
    \ myFunction() {\n    static int x = 10; // Static local variable with static\
    \ storage duration\n    std::cout << \"Inside myFunction: x = \" << x << std::endl;\n\
    } // x retains its value and persists for the entire program\n\nint main() {\n\
    \    myFunction();\n    myFunction(); // x will still be 10 (or its modified value\
    \ if it were changed)\n    return 0;\n}\n```\n\nIn this example, the variable\
    \ `x` is a static local variable. It is created when `myFunction` is first called,\
    \ retains its value between function calls, and is destroyed when the program\
    \ exits. This allows us to access `x` both inside and outside of the function.\n\
    \n#### Dynamic Storage Duration\n\nVariables with dynamic storage duration are\
    \ created and destroyed explicitly by the programmer using dynamic memory allocation\
    \ functions like `new` and `delete` (or `malloc` and `free` in C). They have a\
    \ lifetime determined by the programmer.\n\n```cpp\n#include <iostream>\n\nint\
    \ main() {\n    int* dynamicVar = new int; // Dynamic variable with dynamic storage\
    \ duration\n    *dynamicVar = 42;\n    std::cout << \"DynamicVar: \" << *dynamicVar\
    \ << std::endl;\n    delete dynamicVar; // Destroy the dynamic variable\n    return\
    \ 0;\n}\n```\n"
  raw: 'In C++, functions are typically declared before they are used. This declaration
    is called a function prototype and provides the compiler with information about
    the function''s return type, name, and parameter list. Function prototypes enable
    you to use functions before their actual definitions in your code.


    Here''s how you declare a function prototype:


    ```cpp


    return_type function_name(parameters);


    ```


    For example:


    ```cpp


    #include <iostream>


    // Function prototype


    int square(int num);


    int main() {


    int number = 5;


    int squared = square(number);


    std::cout << "The square of " << number << " is " << squared << std::endl;


    return 0;


    }


    // Function definition


    int square(int num) {


    int result = num * num;


    return result;


    }


    ```


    In this code, we declare the `square` function prototype at the beginning of the
    program. This allows us to use the `square` function in the `main` function before
    its actual definition at the end of the program.


    ### Function Overloading


    C++ supports function overloading, which allows you to define multiple functions
    with the same name but different parameter lists. The compiler determines which
    function to call based on the number or type of arguments passed.


    Here''s an example of function overloading:


    ```cpp


    #include <iostream>


    // Function to add two integers


    int add(int a, int b) {


    return a + b;


    }


    // Function to add two doubles


    double add(double a, double b) {


    return a + b;


    }


    int main() {


    int sum_int = add(5, 10);


    double sum_double = add(3.5, 2.7);


    std::cout << "Sum of integers: " << sum_int << std::endl;


    std::cout << "Sum of doubles: " << sum_double << std::endl;


    return 0;


    }


    ```


    In this example, we have two `add` functions with different parameter types (integers
    and doubles). When we call `add`, the compiler selects the appropriate version
    of the function based on the argument types.


    ### Default Arguments


    C++ allows you to specify default values for function parameters. This means that
    if a caller doesn''t provide a value for a particular parameter, the default value
    will be used. Default arguments make functions more flexible and can simplify
    function calls.


    Here''s an example:


    ```cpp


    #include <iostream>


    // Function with default argument


    int power(int base, int exponent = 2) {


    int result = 1;


    for (int i = 0; i < exponent; i++) {


    result *= base;


    }


    return result;


    }


    int main() {


    int square = power(5); // Uses default exponent value of 2


    int cube = power(3, 3); // Provides custom exponent value


    std::cout << "Square: " << square << std::endl;


    std::cout << "Cube: " << cube << std::endl;


    return 0;


    }


    ```


    In this code, the `power` function has a default argument of `2` for the `exponent`
    parameter. When we call `power(5)`, it calculates the square (since we didn''t
    provide an exponent) using the default value. When we call `power(3, 3)`, we specify
    a custom exponent value of `3`.


    ### Scope of Variables


    Scope refers to the region or context in which a variable is defined and can be
    accessed. In C++, variables have different scopes, and their visibility and lifetime
    depend on where they are declared.


    #### Local Scope


    Variables declared within a function are said to have local scope. They are accessible
    only within that function and are not visible to other functions or code outside
    of the function. When a function exits, its local variables are destroyed.


    ```cpp


    #include <iostream>


    void myFunction() {


    int x = 10; // Local variable with scope limited to myFunction


    std::cout << "Inside myFunction: x = " << x << std::endl;


    }


    int main() {


    myFunction();


    // Uncommenting the line below would


    result in an error


    // std::cout << "Outside myFunction: x = " << x << std::endl;


    return 0;


    }


    ```


    In this example, the variable `x` declared inside `myFunction` is local to that
    function. It cannot be accessed from `main`, as attempting to do so would result
    in an error.


    #### Global Scope


    Variables declared outside of any function, typically at the beginning of a program,
    have global scope. They are visible and accessible throughout the entire program,
    including all functions.


    ```cpp


    #include <iostream>


    int globalVar = 20; // Global variable with program-wide scope


    void myFunction() {


    std::cout << "Inside myFunction: globalVar = " << globalVar << std::endl;


    }


    int main() {


    std::cout << "In main: globalVar = " << globalVar << std::endl;


    myFunction();


    return 0;


    }


    ```


    In this code, `globalVar` is declared at the global scope and is accessible both
    within `main` and `myFunction`.


    ### Scope Resolution Operator (::)


    In cases where there''s a local variable with the same name as a global variable,
    you can use the scope resolution operator `::` to specify which variable you want
    to access.


    ```cpp


    #include <iostream>


    int x = 10; // Global variable


    void myFunction() {


    int x = 5; // Local variable with the same name as the global variable


    std::cout << "Local x: " << x << std::endl;


    std::cout << "Global x: " << ::x << std::endl; // Access the global x


    }


    int main() {


    myFunction();


    return 0;


    }


    ```


    In this example, `myFunction` has a local variable `x`, but we can still access
    the global `x` using `::x`.


    ### Lifetime of Variables


    The lifetime of a variable is the duration for which it exists in memory and holds
    a valid value. The lifetime of a variable depends on its scope and storage duration.


    #### Automatic Storage Duration


    Variables with automatic storage duration (the default for local variables) have
    a lifetime that begins when the program execution enters the block in which the
    variable is defined and ends when the block is exited. In other words, they are
    created when the function is called and destroyed when the function exits.


    ```cpp


    #include <iostream>


    void myFunction() {


    int x = 10; // Local variable with automatic storage duration


    std::cout << "Inside myFunction: x = " << x << std::endl;


    } // x goes out of scope and is destroyed here


    int main() {


    myFunction();


    // Uncommenting the line below would result in an error


    // std::cout << "Outside myFunction: x = " << x << std::endl;


    return 0;


    }


    ```


    In this code, the variable `x` has automatic storage duration and is created when
    `myFunction` is called and destroyed when the function exits. Attempting to access
    `x` outside of the function would result in an error.


    #### Static Storage Duration


    Variables with static storage duration (global variables or local variables declared
    as `static`) have a lifetime that extends throughout the entire program execution.
    They are created when the program starts and destroyed when the program exits.


    ```cpp


    #include <iostream>


    void myFunction() {


    static int x = 10; // Static local variable with static storage duration


    std::cout << "Inside myFunction: x = " << x << std::endl;


    } // x retains its value and persists for the entire program lifetime


    int main() {


    myFunction();


    std::cout << "Outside myFunction: x = " << x << std::endl; // Accessing static
    x


    return 0;


    }


    ```


    In this example, the variable `x` is a static local variable. It is created when
    `myFunction` is first called, retains its value between function calls, and is
    destroyed when the program exits. This allows us to access `x` both inside and
    outside of the function.


    #### Dynamic Storage Duration


    Variables with dynamic storage duration are created and destroyed explicitly by
    the programmer using dynamic memory allocation functions like `new` and `delete`
    (or `malloc` and `free` in C). They have a lifetime determined by the programmer.


    ```cpp


    #include <iostream>


    int main() {


    int* dynamicVar = new int; // Dynamic variable with dynamic storage duration


    *dynamicVar = 42;


    std::cout << "DynamicVar: " << *dynamicVar << std::endl;


    delete dynamicVar; // Destroy the dynamic variable


    return 0;


    }


    ```'
