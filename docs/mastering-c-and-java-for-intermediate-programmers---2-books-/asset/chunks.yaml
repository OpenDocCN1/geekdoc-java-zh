    # **Chapter 8: Collections and Generics**


    Collections and generics are powerful concepts in programming that enable the
    efficient storage and manipulation of groups of elements and provide type safety
    for data structures. Collections offer a wide range of data structures, such as
    lists, sets, maps, and queues, to accommodate different data storage and retrieval
    needs. Generics, on the other hand, ensure type safety by enabling the use of
    parameterized types in classes and methods. In this chapter, we will explore collections
    and generics in both Java and Python, along with practical examples to demonstrate
    their usage.


    ## Section 1: Collections in Java


    ### ArrayList


    ArrayList is a dynamic array-based implementation of the List interface that can
    grow and shrink dynamically as elements are added or removed.


    **Java Example:**


    ```java


    import java.util.ArrayList;


    public class ArrayListExample {


    public static void main(String[] args) {


    // Creating an ArrayList of integers


    ArrayList<Integer> numbers = new ArrayList<>();


    // Adding elements to the ArrayList


    numbers.add(10);


    numbers.add(20);


    numbers.add(30);


    // Accessing elements from the ArrayList


    System.out.println("First element: " + numbers.get(0));


    // Removing an element from the ArrayList


    numbers.remove(1);


    System.out.println("After removal: " + numbers);


    }


    }


    ```


    ### HashSet


    HashSet is an implementation of the Set interface that uses a hash table to store
    unique elements, ensuring that duplicates are not allowed.


    **Java Example:**


    ```java


    import java.util.HashSet;


    public class HashSetExample {


    public static void main(String[] args) {


    // Creating a HashSet of strings


    HashSet<String> names = new HashSet<>();


    // Adding elements to the HashSet


    names.add("Alice");


    names.add("Bob");


    names.add("Alice"); // Duplicate, not added


    // Accessing elements from the HashSet


    System.out.println("Set size: " + names.size());


    // Removing an element from the HashSet


    names.remove("Bob");


    System.out.println("After removal: " + names);


    }


    }


    ```


    ### HashMap


    HashMap is an implementation of the Map interface that stores key-value pairs
    and allows fast retrieval of values based on their keys.


    **Java Example:**


    ```java


    import java.util.HashMap;


    public class HashMapExample {


    public static void main(String[] args) {


    // Creating a HashMap of integers (ID -> Name)


    HashMap<Integer, String> students = new HashMap<>();


    // Adding key-value pairs to the HashMap


    students.put(1, "Alice");


    students.put(2, "Bob");


    students.put(3, "Charlie");


    // Accessing values from the HashMap using keys


    System.out.println("Name of student with ID 2: " + students.get(2));


    // Removing a key-value pair from the HashMap


    students.remove(1);


    System.out.println("After removal: " + students);


    }


    }


    ```


    ## Section 2: Collections in Python


    ### List


    List is a dynamic array-based data structure in Python that can hold elements
    of different types and can grow or shrink dynamically.


    **Python Example:**


    ```python


    # Creating a list of integers


    numbers = [10, 20, 30]


    # Accessing elements from the list


    print("First element:", numbers[0])


    # Adding elements to the list


    numbers.append(40)


    numbers.insert(1, 15)


    # Removing an element from the list


    numbers.remove(20)


    print("After removal:", numbers)


    ```


    ### Set


    Set is an unordered collection of unique elements in Python, and it is particularly
    useful for removing duplicates from a list.


    **Python Example:**


    ```python


    # Creating a set of strings


    names = {"Alice", "Bob", "Alice"} # Duplicate, not added


    # Accessing elements from the set


    print("Set size:", len(names))


    # Adding elements to the set


    names.add("Charlie")


    # Removing an element from the set


    names.remove("Bob")


    print("After removal:", names)


    ```


    ### Dictionary


    Dictionary is an associative data structure in Python that stores key-value pairs,
    allowing efficient retrieval of values based on their keys.


    **Python Example:**


    ```python


    # Creating a dictionary of integers (ID -> Name)


    students = {1: "Alice", 2: "Bob", 3: "Charlie"}


    # Accessing values from the dictionary using keys


    print("Name of student with ID 2:", students.get(2))


    # Adding a key-value pair to the dictionary


    students[4] = "Dave"


    # Removing a key-value pair from the dictionary


    del students[1]


    print("After removal:", students)


    ```


