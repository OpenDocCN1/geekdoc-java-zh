    # 第 2 章：理解面向对象编程\n\n面向对象编程（OOP）是一种以“对象”为核心的编程范式——对象是封装了数据和行为的自包含单元。OOP 允许开发者对现实世界的实体和关系进行建模，使其成为现代软件开发中强大且广泛的方法。在本章中，我们将探索\
    \ OOP 的基本原则，包括类、对象、继承、多态和封装，并结合 Java 和 Python 的实际示例。\n\n## 第 1 节：类和对象\n\n### 类\n\
    \n类是创建对象的蓝图或模板。它定义了从它实例化的对象的结构和行为。在 Java 中，使用 `class` 关键字定义类，而在 Python 中，也使用 `class`\
    \ 关键字。\n\n让我们考虑一个 Java 和 Python 中表示“汽车”（Car）的简单类示例：\n\nJava 示例：\n\n```java\npublic\
    \ class Car {\n    // 字段或实例变量\n    String make;\n    String model;\n    int year;\n\
    \n    // 构造函数\n    public Car(String make, String model, int year) {\n       \
    \ this.make = make;\n        this.model = model;\n        this.year = year;\n\
    \    }\n\n    // 显示汽车信息的方法\n    public void displayInfo() {\n        System.out.println(\"\
    Make: \" + make);\n        System.out.println(\"Model: \" + model);\n        System.out.println(\"\
    Year: \" + year);\n    }\n}\n```\n\nPython 示例：\n\n```python\nclass Car:\n    #\
    \ 构造函数\n    def __init__(self, make, model, year):\n        self.make = make\n\
    \        self.model = model\n        self.year = year\n\n    # 显示汽车信息的方法\n   \
    \ def display_info(self):\n        print(\"Make:\", self.make)\n        print(\"\
    Model:\", self.model)\n        print(\"Year:\", self.year)\n```\n\n### 对象\n\n\
    对象是类的实例，代表一个特定的实体。它有自己独特的状态（数据）和行为（方法）。在 Java 和 Python 中创建对象，我们使用类的构造函数。\n\nJava\
    \ 示例：\n\n```java\n// 创建一个 Car 对象\nCar car1 = new Car(\"Toyota\", \"Camry\", 2022);\n\
    ```\n\nPython 示例：\n\n```python\n# 创建一个 Car 对象\ncar1 = Car(\"Toyota\", \"Camry\"\
    , 2022)\n```\n\n## 第 2 节：继承\n\n继承是 OOP 的一个核心原则，允许一个类（称为“子类”或“派生类”）从另一个类（称为“父类”或“基类”）继承属性和方法。这促进了代码重用并促进了类之间的层次关系。\n\
    \n让我们考虑在 Java 和 Python 中使用基类“动物”（Animal）以及两个子类“狗”（Dog）和“猫”（Cat）的继承示例：\n\nJava\
    \ 示例：\n\n```java\nclass Animal {\n    void makeSound() {\n        System.out.println(\"\
    Animal makes a sound\");\n    }\n}\n\nclass Dog extends Animal {\n    @Override\n\
    \    void makeSound() {\n        System.out.println(\"Dog barks\");\n    }\n}\n\
    \nclass Cat extends Animal {\n    @Override\n    void makeSound() {\n        System.out.println(\"\
    Cat meows\");\n    }\n}\n```\n\nPython 示例：\n\n```python\nclass Animal:\n    def\
    \ make_sound(self):\n        print(\"Animal makes a sound\")\n\nclass Dog(Animal):\n\
    \    def make_sound(self):\n        print(\"Dog barks\")\n\nclass Cat(Animal):\n\
    \    def make_sound(self):\n        print(\"Cat meows\")\n```\n\n## 第 3 节：多态\n\
    \n多态允许不同类的对象被视为同一个公共父类的对象。它使得单个接口能够表示不同类型的实体，为代码提供了灵活性和扩展性。\n\n在上面的示例中，`Dog` 和\
    \ `Cat` 类都继承自 `Animal` 类。这意味着我们可以将 `Dog` 和 `Cat` 的对象视为 `Animal` 类的对象。\n\nJava\
    \ 示例：\n\n```java\npublic class Main {\n    public static void main(String[] args)\
    \ {\n        Animal animal1 = new Dog();\n        Animal animal2 = new Cat();\n\
    \        animal1.makeSound(); // 输出: Dog barks\n        animal2.makeSound(); //\
    \ 输出: Cat meows\n    }\n}\n```\n\nPython 示例：\n\n```python\n# Python 中的多态\nanimals\
    \ = [Dog(), Cat()]\nfor animal in animals:\n    animal.make_sound()\n# 输出:\n#\
    \ Dog barks\n# Cat meows\n```\n\n## 第 4 节：封装\n\n封装是隐藏类内部实现细节并通过方法（getter 和 setter）提供对类功能访问的原则。这确保了数据安全并防止了对类状态的未经授权访问。\n\
    \n在第一节的汽车示例中，我们可以使用 getter 和 setter 方法对字段进行封装。\n\nJava 示例：\n\n```java\npublic\
    \ class Car {\n    private String make;\n    private String model;\n    private\
    \ int year;\n\n    public String getMake() {\n        return make;\n    }\n\n\
    \    public void setMake(String make) {\n        this.make = make;\n    }\n  \
    \  // model 和 year 的类似方法\n}\n```\n\nPython 示例：\n\n```python\nclass Car:\n    def\
    \ __init__(self, make, model, year):\n        self._make = make\n        self._model\
    \ = model\n        self._year = year\n\n    def get_make(self):\n        return\
    \ self._make\n\n    def set_make(self, make):\n        self._make = make\n   \
    \ # model 和 year 的类似方法\n```\n\n"
- fmt: "\n- `double`: 64-bit floating-point number (approx. ±1.79769313486231570E+308)\n\
    - `char`: 16-bit Unicode character (0 to 65,535)\n- `boolean`: Represents true\
    \ or false\n\n## 2. Reference Data Types\nThese data types refer to objects created\
    \ from classes or interfaces. Examples include strings, arrays, and user-defined\
    \ classes.\n\n### Data Types in Python\n\nPython is a dynamically typed language,\
    \ meaning the data type of a variable is determined automatically based on the\
    \ assigned value. Python provides the following built-in data types:\n\n1. **Numeric\
    \ Types:** These include `int` (integers with unlimited precision), `float` (floating-point\
    \ numbers), and `complex` (complex numbers).\n2. **Sequence Types:** These represent\
    \ sequences of values. The main sequence types are `list`, `tuple`, and `range`.\n\
    3. **Text Type:** The `str` data type represents strings of characters.\n4. **Boolean\
    \ Type:** The `bool` data type represents the truth values `True` and `False`.\n\
    5. **Set Types:** These include `set` (unordered collection of unique elements)\
    \ and `frozenset` (immutable set).\n6. **Mapping Type:** The `dict` data type\
    \ represents key-value pairs.\n\n## Section 2: Variables\n\n### Declaring Variables\
    \ in Java\n\nIn Java, variables must be declared with an explicit data type before\
    \ they can be used. The syntax for declaring variables is as follows:\n\n```java\n\
    <dataType> <variableName>;\n```\n\nHere's an example of declaring and initializing\
    \ variables in Java:\n\n```java\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        int age;\n        double salary;\n        char grade;\n   \
