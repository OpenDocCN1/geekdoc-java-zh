    std::ofstream file("numbers.txt");


    if (!file.is_open()) {


    std::cerr << "Error opening the file." << std::endl;


    return 1;


    }


    int num1 = 42;


    double num2 = 3.14159;


    file << num1 << std::endl;


    file << num2 << std::endl;


    file.close();


    return 0;


    }


    ```


    In this example, we open the "numbers.txt" file for writing and then use the `<<`
    operator to write an integer (`num1`) and a double (`num2`) to the file. Each
    data item is followed by `std::endl` to insert a newline character.


    ## File Positions and Seeking


    When working with files, you might need to move the file position to read or write
    data at specific locations within the file. C++ provides functions for file seeking
    to accomplish this.


    ### `seekg()` and `tellg()` for Input


    - `seekg(pos)`: Moves the input file position to the specified absolute position
    `pos`.


    - `seekg(offset, direction)`: Moves the input file position by the specified `offset`
    bytes in the specified `direction`.'
