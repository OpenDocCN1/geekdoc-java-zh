  trans: "\n在这段代码中，我们使用 `new` 为动态变量分配内存，为其赋值，并在稍后使用 `delete` 释放内存。程序员完全控制动态变量的生命周期。\n\
    \n### 函数作用域\n\n在函数内部声明的局部变量具有函数作用域，这意味着它们仅在该函数内部可见并可访问。这个概念通常被称为块作用域，因为它扩展到了定义该变量的块（大括号\
    \ `{}`）。\n\n```cpp\n#include <iostream>\n\nvoid myFunction() {\n    int localVar\
    \ = 5; // 具有函数作用域的局部变量\n    std::cout << \"Inside myFunction: localVar = \" <<\
    \ localVar << std::endl;\n} // localVar 在此处离开作用域并被销毁\n\nint main() {\n    myFunction();\n\
    \    // 注消下面这一行将导致错误\n    // std::cout << \"Outside myFunction: localVar = \"\
    \ << localVar << std::endl;\n    return 0;\n}\n```\n\n在这个示例中，`localVar` 具有函数作用域，只能在\
    \ `myFunction` 块内访问。\n\n### 全局作用域\n\n如之前，全局变量具有全局作用域，这意味着它们可以从程序的任何部分访问，包括函数内部。\n\
    \n```cpp\n#include <iostream>\n\nint globalVar = 20; // 具有全局作用域的全局变量\n\nvoid myFunction()\
    \ {\n    std::cout << \"Inside myFunction: globalVar = \" << globalVar << std::endl;\n\
    }\n\nint main() {\n    std::cout << \"In main: globalVar = \" << globalVar <<\
    \ std::endl;\n    myFunction();\n    return 0;\n}\n```\n\n在这段代码中，`globalVar` 具有全局作用域，可以在\
    \ `main` 和 `myFunction` 中被访问。\n\n### 命名空间作用域\n\n除了全局和函数作用域，C++ 还提供了命名空间作用域。命名空间是将代码组织成独立逻辑组的方法，在命名空间内声明的变量具有命名空间作用域。\n\
    \n这里是一个简单的示例：\n\n```cpp\n#include <iostream>\n\nnamespace MyNamespace {\n    int\
    \ x = 5; // 具有命名空间作用域的变量\n}\n\nint main() {\n    std::cout << \"Inside main: x\
    \ = \" << MyNamespace::x << std::endl;\n    return 0;\n}\n```\n\n在这段代码中，`x` 在\
    \ `MyNamespace` 命名空间内具有命名空间作用域。我们使用作用域解析运算符 `::` 来指定命名空间。\n\n### 生命周期与作用域总结\n\n\
    - **生命**指的是变量在内存中存在的时间。\n- **作用域**定义了变量在何处可见并可以被访问。\n- **自动存储持续时间**适用于局部变量，它们在函数被调用时创建，在函数退出时销毁。\n\
    - **静态存储持续时间**适用于全局变量和静态局部变量，它们持续整个程序的生命周期。\n- **动态存储持续时间**涉及程序员显式创建和销毁的动态变量。\n\
    - **函数作用域**将变量的可见性限制在定义它的函数中。\n- **全局作用域**允许从程序的任何地方访问变量。\n- **命名空间作用域**适用于在命名空间内声明的变量，使得它们在该命名空间内可被访问。\n\
    \n## 函数原型与定义\n\n在 C++ 中处理函数时，你经常会遇到需要在实际函数定义之前声明函数原型的情况。当函数相互调用或者当它们的定义顺序很重要时，情况尤为如此。\n\
    \n### 函数原型\n\n函数原型是一种声明，它告诉编译器关于函数的名称、返回类型和参数列表。它为编译器在实际定义之前理解如何调用该函数提供了必要的信息。\n\
    \n函数原型的语法如下：\n\n```cpp\nreturn_type function_name(parameters);\n```\n\n让我们用一个示例来说说明：\n\
    \n```cpp\n#include <iostream>\n\n// 函数原型\nint add(int a, int b);\n\nint main()\
    \ {\n    int result = add(3, 4); // 函数调用\n    std::cout << \"Result: \" << result\
    \ << std::endl;\n    return 0;\n}\n\n// 函数定义\nint add(int a, int b) {\n    return\
    \ a + b;\n}\n```\n\n在这段代码中，我们在 `main` 函数之前使用原型声明了函数 `add`。这允许我们在 `main` 内部调用 `add`，即使函数的定义出现在代码的后部分。\n\
    \n### 为什么要使用函数原型？\n\n函数原型有几个重要用途：\n\n1. **启用前向引用**：原型允许你在实际定义之前调用函数，这在函数相互调用或组织方式需要前向引用的情况下非常有用。\n\
    2. **捕获错误**：原型有助于在编译过程早期捕获错误。如果你在原型中写错了函数名、返回类型或参数列表，编译器将生成错误。\n3. **改进代码组织**：原型提供了程序中使用的函数及其签名的清晰概览，使代码更有组织性且更易读。\n\
    4. **促进团队开发**：在涉及多个程序员的大型项目中，原型有助于定义函数的接口，确保使用的一致性。\n\n### 多个函数原型\n\n你可以为同一个函数声明多个函数原型，只要它们具有相同的名称但不同的参数列表。这被称为函数重载。\n\
    \n```cpp\n#include <iostream>\n\n// 不同参数列表的函数原型\nint add(int a, int b);\ndouble\
    \ add(double a, double b);\n\nint main() {\n    int result_int = add(3, 4);  \
    \       // 调用 int 版本\n    double result_double = add(1.5, 2.5); // 调用 double 版本\n\
    \    std::cout << \"Result (int): \" << result_int << std::endl;\n    std::cout\
    \ << \"Result (double): \" << result_double << std::endl;\n    return 0;\n}\n\n\
    int add(int a, int b) {\n    return a + b;\n}\n\ndouble add(double a, double b)\
    \ {\n    return a + b;\n}\n```\n\n在这个示例中，我们根据参数类型提供了两个版本的 `add` 函数。原型允许我们调用相应的版本。\n\
    \n### 函数定义\n\n函数定义提供了函数的实际实现。它们指定了函数在调用时做什么。一个函数只能定义一次，但可以通过原型声明多次。\n\n这里是函数定义的结构：\n\
    \n```cpp\nreturn_type function_name(parameters) {\n    // 函数体\n    // 执行任务的代码\n\
    \    return result; // 可选的返回语句\n}\n```\n\n让我们回顾之前的函数定义示例：\n\n```cpp\n#include\
    \ <iostream>\n\n// 函数原型\nint add(int a, int b);\n\nint main() {\n    int result\
    \ = add(3, 4); // 函数调用\n    std::cout << \"Result: \" << result << std::endl;\n\
    \    return 0;\n}\n\n// 函数定义\nint add(int a, int b) {\n    return a + b;\n}\n\
    ```\n\n在这段代码中，我们拥有 `add` 的函数原型和定义。函数定义出现在 `main` 函数之后，并提供了加法的实际实现。\n\n### 函数定义与声明\n\
    \n函数声明（如原型）提供了关于函数名称、返回类型和参数列表的信息。然而，声明并没有提供函数的实现细节。相反，定义则包含了要执行的代码。\n\n在实践中，你可以在程序中使用函数原型或函数定义。如果你只需要声明函数的签名并打算在其他地方定义它，原型就足够了。\n\
    \n# 第 7 章：数组与字符串\n\n在本章中，我们将探索 C++ 中数组和字符串的基本概念。这些数据结构对于组织和处理数据集合非常重要，无论是数字列表、字符还是更复杂的信息。\n\
    \n## 数组\n\n### 什么是数组？\n\n"
- fmt: "\nAn array is a data structure that allows you to store multiple values of\
    \ the same data type under a single variable name. Think of it as a collection\
    \ of related elements, all stored in contiguous memory locations. Arrays are widely\
    \ used in programming because they provide an efficient way to work with large\
    \ sets of data.\n\nHere's how you declare an array in C++:\n\n```cpp\ndata_type\
    \ array_name[array_size];\n```\n\n- `data_type`: Specifies the data type of the\
    \ elements in the array, such as `int`, `double`, or `char`.\n- `array_name`:\
    \ The name you choose for the array.\n- `array_size`: The number of elements the\
    \ array can hold. This size is fixed once the array is declared.\n\n### Initializing\
    \ Arrays\n\nYou can initialize an array when you declare it by providing a list\
    \ of values enclosed in curly braces `{}`. The number of values must match the\
    \ array's size.\n\n```cpp\nint numbers[5] = {1, 2, 3, 4, 5};\n```\n\nIn this example,\
    \ we declare an integer array `numbers` with a size of 5 and initialize it with\
    \ values 1 through 5. The array now contains `[1, 2, 3, 4, 5]`.\n\nIf you don't\
    \ specify the size of the array when declaring it, the compiler will infer the\
    \ size based on the number of values provided:\n\n```cpp\nint numbers[] = {1,\
    \ 2, 3, 4, 5}; // Compiler infers size as 5\n```\n\n### Accessing Array Elements\n\
    \nTo access individual elements within an array, you use an index, which is an\
    \ integer value that represents the position of the element in the array. Array\
    \ indices in C++ start at 0, meaning the first element is at index 0, the second\
    \ at index 1, and so on.\n\n```cpp\nint numbers[5] = {1, 2, 3, 4, 5};\nint firstNumber\
    \ = numbers[0]; // Access the first element (1)\nint secondNumber = numbers[1];\
    \ // Access the second element (2)\n```\n\nIn this code, we access the first and\
    \ second elements of the `numbers` array using indices 0 and 1, respectively.\n\
    \n### Modifying Array Elements\n\nYou can change the value of an element in an\
    \ array by assigning a new value to it using the assignment operator (`=`).\n\n\
    ```cpp\nint numbers[5] = {1, 2, 3, 4, 5};\nnumbers[2] = 10; // Change the value\
    \ of the third element to 10\n```\n\nIn this example, we modify the third element\
    \ of the `numbers` array (which has an index of 2) by assigning it the value 10.\n\
    \n### Array Size\n\nThe size of an array is fixed at the time of declaration,\
    \ and it cannot be changed during the program's execution. Attempting to access\
    \ or modify elements beyond the array's boundaries can lead to undefined behavior\
    \ and memory corruption. Therefore, it's crucial to be mindful of the array's\
    \ size when working with it.\n\n### Iterating Over Arrays\n\nOne common task when\
    \ working with arrays is to iterate through all the elements. You can use loops,\
    \ such as the `for` loop, to accomplish this. Here's an example that prints all\
    \ the elements of an array:\n\n```cpp\n#include <iostream>\n\nint main() {\n \
    \   int numbers[] = {1, 2, 3, 4, 5};\n    for (int i = 0; i < 5; i++) {\n    \
    \    std::cout << numbers[i] << \" \";\n    }\n    return 0;\n}\n```\n\nIn this\
    \ code, we use a `for` loop to iterate through the `numbers` array and print each\
    \ element. The loop runs from `i = 0` to `i = 4`, covering all the indices of\
    \ the array.\n\n### Multidimensional Arrays\n\nIn addition to one-dimensional\
    \ arrays, C++ also supports multidimensional arrays. These are arrays with more\
    \ than one dimension, effectively creating a grid or table of elements.\n\nA common\
    \ example is a two-dimensional array, often used to represent matrices or grids:\n\
    \n```cpp\nint matrix[3][3] = {\n    {1, 2, 3},\n    {4, 5, 6},\n    {7, 8, 9}\n\
    };\n```\n\nIn this example, we declare a 3x3 integer matrix and initialize it\
    \ with values. You can access individual elements using two indices, one for the\
    \ row and another for the column:\n\n```cpp\nint element = matrix[1][2]; // Accesses\
    \ the element in the second row and third column (value: 6)\n```\n\n### Arrays\
    \ and Functions\n\nArrays can be passed as arguments to functions in C++. When\
    \ an array is passed to a function, it is treated as a pointer to the array's\
    \ first element. This allows functions to operate on arrays without knowing their\
    \ size.\n\nHere's an example of passing an array to a function that calculates\
    \ the sum of its elements:\n\n```cpp\n#include <iostream>\n\n// Function to calculate\
    \ the sum of an array\nint sumArray(int arr[], int size) {\n    int sum = 0;\n\
    \    for (int i = 0; i < size; i++) {\n        sum += arr[i];\n    }\n    return\
    \ sum;\n}\n\nint main() {\n    int numbers[] = {1, 2, 3, 4, 5};\n    int total\
    \ = sumArray(numbers, 5);\n    std::cout << \"Sum of the numbers: \" << total\
    \ << std::endl;\n    return 0;\n}\n```\n\nIn this code, we use a `for` loop to\
    \ iterate through the `numbers` array and print each element. The loop runs from\
    \ `i = 0` to `i = 4`, covering all the indices of the array.\n\n### Arrays and\
    \ Pointers\n\nArrays and pointers are closely related in C++. In fact, an array\
    \ name can be treated as a pointer to its first element. This allows for powerful\
    \ programming techniques like efficient array manipulation.\n\n```cpp\nint numbers[]\
    \ = {1, 2, 3, 4, 5};\nint* ptr = numbers;\nint first = *ptr; // Access the first\
    \ element\nint second = *(ptr + 1); // Access the second element\n```\n\n### Strings\n\
    \nStrings are sequences of characters and are used to represent text. While strings\
    \ may seem like arrays of characters, they have some distinct characteristics\
    \ that make them more convenient.\n\n### C-Style Strings\n\nC++ supports C-style\
    \ strings, which are arrays of characters terminated by a null character (`'\\\
    0'`). C-style strings are created by declaring character arrays and initializing\
    \ them with a sequence of characters, like so:\n\n```cpp\nchar greeting[] = \"\
    Hello, world!\";\n```\n\nIn this example, `greeting` is a C-style string that\
    \ contains \"Hello, world!\" followed by the null character.\n\n### String Functions\n\
    \nC++ provides a rich set of functions for working with C-style strings. Some\
    \ of the commonly used string functions include:\n\n- `strlen`: Returns the length\
    \ of a string (excluding the null character).\n- `strcpy`: Copies one string to\
    \ another.\n- `strcat`: Concatenates (appends) one string to another.\n- `strcmp`:\
    \ Compares two strings lexicographically.\n\nHere's an example of using the `strlen`\
    \ and `strcpy` functions:\n\n```cpp\n#include <iostream>\n#include <cstring>\n\
    \nint main() {\n    char source[] = \"Hello, world!\";\n    char destination[20];\
    \ // Create a destination buffer\n\n    // Copy the contents of source to destination\n\
    \    strcpy(destination, source);\n\n    // Calculate and print the length of\
    \ the copied string\n    int length = strlen(destination);\n\n    std::cout <<\
    \ \"Copied string: \" << destination << std::endl;\n    std::cout << \"Length:\
    \ \" << length << std::endl;\n\n    return 0;\n}\n```\n\nIn this code, we copy\
    \ the contents of the `source` string to the `destination` buffer using `strcpy`.\
    \ We then calculate and print the length of the copied string using `strlen`.\n\
    \n### C++ String Class\n\nWhile C-style strings are widely used, C++ also provides\
    \ a more versatile and user-friendly `string` class in the Standard Library. The\
    \ `string` class is part of the `std` namespace and offers a wide range of string\
    \ manipulation functions.\n"
  raw: 'An array is a data structure that allows you to store multiple values of the
    same data type under a single variable name. Think of it as a collection of related
    elements, all stored in contiguous memory locations. Arrays are widely used in
    programming because they provide an efficient way to work with large sets of data.


    Here''s how you declare an array in C++:


    ```cpp


    data_type array_name[array_size];


    ```


    - `data_type`: Specifies the data type of the elements in the array, such as `int`,
    `double`, or `char`.


    - `array_name`: The name you choose for the array.


    - `array_size`: The number of elements the array can hold. This size is fixed
    once the array is declared.


    ### Initializing Arrays


    You can initialize an array when you declare it by providing a list of values
    enclosed in curly braces `{}`. The number of values must match the array''s size.


    ```cpp


    int numbers[5] = {1, 2, 3, 4, 5};


    ```


    In this example, we declare an integer array `numbers` with a size of 5 and initialize
    it with values 1 through 5\. The array now contains `[1, 2, 3, 4, 5]`.


    If you don''t specify the size of the array when declaring it, the compiler will
    infer the size based on the number of values provided:


    ```cpp


    int numbers[] = {1, 2, 3, 4, 5}; // Compiler infers size as 5


    ```


    ### Accessing Array Elements


    To access individual elements within an array, you use an index, which is an integer
    value that represents the position of the element in the array. Array indices
    in C++ start at 0, meaning the first element is at index 0, the second at index
    1, and so on.


    ```cpp


    int numbers[5] = {1, 2, 3, 4, 5};


    int firstNumber = numbers[0]; // Access the first element (1)


    int secondNumber = numbers[1]; // Access the second element (2)


    ```


    In this code, we access the first and second elements of the `numbers` array using
    indices 0 and 1, respectively.


    ### Modifying Array Elements


    You can change the value of an element in an array by assigning a new value to
    it using the assignment operator (`=`).


    ```cpp


    int numbers[5] = {1, 2, 3, 4, 5};


    numbers[2] = 10; // Change the value of the third element to 10


    ```


    In this example, we modify the third element of the `numbers` array (which has
    an index of 2) by assigning it the value 10.


    ### Array Size


    The size of an array is fixed at the time of declaration, and it cannot be changed
    during the program''s execution. Attempting to access or modify elements beyond
    the array''s boundaries can lead to undefined behavior and memory corruption.
    Therefore, it''s crucial to be mindful of the array''s size when working with
    it.


    ### Iterating Over Arrays


    One common task when working with arrays is to iterate through all the elements.
    You can use loops, such as the `for` loop, to accomplish this. Here''s an example
    that prints all the elements of an array:


    ```cpp


    #include <iostream>


    int main() {


    int numbers[] = {1, 2, 3, 4, 5};


    for (int i = 0; i < 5; i++) {


    std::cout << numbers[i] << " ";


    }


    return 0;


    }


    ```


    In this code, we use a `for` loop to iterate through the `numbers` array and print
    each element. The loop runs from `i = 0` to `i = 4`, covering all the indices
    of the array.


    ### Multidimensional Arrays


    In addition to one-dimensional arrays, C++ also supports multidimensional arrays.
    These are arrays with more than one dimension, effectively creating a grid or
    table of elements.


    A common example is a two-dimensional array, often used to represent matrices
    or grids:


    ```cpp


    int matrix[3][3] = {


    {1, 2, 3},


    {4, 5, 6},


    {7, 8, 9}


    };


    ```


    In this example, we declare a 3x3 integer matrix and initialize it with values.
    You can access individual elements using two indices, one for the row and another
    for the column:


    ```cpp


    int element = matrix[1][2]; // Accesses the element in the second row and third
    column (value: 6)


    ```


    ### Arrays and Functions


    Arrays can be passed as arguments to functions in C++. When an array is passed
    to a function, it is treated as a pointer to the array''s first element. This
    allows functions to operate on arrays without knowing their size.


    Here''s an example of passing an array to a function that calculates the sum of
    its elements:


    ```cpp


    #include <iostream>


    // Function to calculate the sum of an array


    int sumArray(int arr[], int size) {


    int sum = 0;


    for (int i = 0; i < size; i++) {


    sum += arr[i];


    }


    return sum;


    }


    int main() {


    int numbers[] = {1, 2, 3, 4, 5};


    int total = sumArray(numbers, 5);


    std::cout << "Sum of the numbers: " << total << std::endl;


    return 0;


    }


    ```


    In this code, we define a `sumArray` function that takes an array (`arr`) and
    its size (`size`) as arguments. The function iterates through the array and calculates
    the sum of its elements, which is returned to the `main` function.


    ### Arrays and Pointers


    Arrays and pointers are closely related concepts in C++. As mentioned earlier,
    when you pass an array to a function, it is treated as a pointer to the array''s
    first element. This connection between arrays and pointers allows for some powerful
    and flexible programming techniques.


    For example, you can use pointer arithmetic to navigate through array elements:


    ```cpp


    int numbers[] = {1, 2, 3, 4, 5};


    int* ptr = numbers; // Pointer to the first element


    int first = *ptr;   // Access the first element


    int second = *(ptr + 1); // Access the second element using pointer arithmetic


    ```


    In this code, we declare a pointer `ptr` that points to the first element of the
    `numbers` array. We can then use pointer dereferencing (`*ptr`) to access the
    element at the current pointer position or use pointer arithmetic to access other
    elements.


    ### Strings


    Strings are sequences of characters and are used to represent text in C++. While
    strings may seem like arrays of characters, they have some distinct characteristics
    that make them more convenient for working with text.


    ### C-


    Style Strings


    C++ supports C-style strings, which are arrays of characters terminated by a null
    character (`''\0''`). C-style strings are created by declaring character arrays
    and initializing them with a sequence of characters, like so:


    ```cpp


    char greeting[] = "Hello, world!";


    ```


    In this example, `greeting` is a C-style string that contains the characters "Hello,
    world!" followed by the null character.


    ### String Functions


    C++ provides a rich set of functions for working with C-style strings. Some of
    the commonly used string functions include:


    - `strlen`: Returns the length of a string (excluding the null character).


    - `strcpy`: Copies one string to another.


    - `strcat`: Concatenates (appends) one string to another.


    - `strcmp`: Compares two strings lexicographically.


    Here''s an example of using the `strlen` and `strcpy` functions:


    ```cpp


    #include <iostream>


    #include <cstring>


    int main() {


    char source[] = "Hello, world!";


    char destination[20]; // Create a destination buffer


    // Copy the contents of source to destination


    strcpy(destination, source);


    // Calculate and print the length of the copied string


    int length = strlen(destination);


    std::cout << "Copied string: " << destination << std::endl;


    std::cout << "Length: " << length << std::endl;


    return 0;


    }


    ```


    In this code, we copy the contents of the `source` string to the `destination`
    buffer using `strcpy`. We then calculate and print the length of the copied string
    using `strlen`.


    ### C++ String Class


    While C-style strings are widely used, C++ also provides a more versatile and
    user-friendly `string` class in the Standard Library. The `string` class is part
    of the `std` namespace and offers a wide range of string manipulation functions.


