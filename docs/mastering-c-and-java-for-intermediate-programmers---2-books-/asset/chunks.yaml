    \    }\n}\n```\n\n### 短路操作\n\n`limit()` 和 `findFirst()` 等短路操作允许提前终止无限流执行。\n\n\
    **示例：**\n\n```java\nimport java.util.stream.Stream;\n\npublic class StreamExample\
    \ {\n    public static void main(String[] args) {\n        // 创建一个自然数的无限流\n  \
    \      Stream<Integer> naturalNumbers = Stream.iterate(1, n -> n + 1);\n     \
    \   // 使用短路操作限制流的数量\n        naturalNumbers.limit(5).forEach(System.out::println);\n\
    \    }\n}\n```\n\n## 第 8 节：流的性能\n\n### 性能注意事项\n\n虽然流提供了简洁且表现良好的代码，但开发者在在使用流时应该注意性能考虑。\n\
    \n1. **针对大型数据集使用并行流：** 对于大型数据集，考虑使用并行流以利用多核处理器的优势并加速处理。\n2. **注意无限流：** 避免在没有适当短路操作的情况下使用无限流，因为它们可能导致过度的内存占用甚至死循环。\n\
    3. **选择正确的数据源：** 为你的流选择合适的数据源，以避免不转换或数据操作。\n\n## 总结\n\nJava Streams API 提供了一种强大且灵活的方式，以函数和声明的方式处理数据集合。通过对中间操作和终端操作的支持，开发者可以高效地过滤、映射和减少数据以执行复杂的数据处理任务。通过利用并行流，Java\
    \ 应用可以利用多核处理器的优势，在大型数据集上实现更好的性能。\n\n在本章中，我们探索了 Java Streams 的基础知识，包括如何创建流、执行中间和终端操作、处理无限流以及考虑性能因素。通过这些知识，你可以有效地使用\
    \ Java Streams 为你的 Java 应用程序中的数据处理任务编写简洁且高效的代码。\n\n# 第 10 章：Java 并发\n\n并发是系统同时执行多个任务的能力，使程序能够同时执行多个操作。在\
    \ Java 中，并发是通过线程实现的，线程是轻量级的子进程，可以独立运行并共享资源。Java 平台提供了强大的 API 和工具来高效地管理并发编程。在本章中，我们将探索\
    \ Java 并发的基础，讨论线程管理、同步和并发集合，并提供示例演示如何编写并发程序。\n\n## 第 1 节：并发简介\n\n### 什么是并发？\n\n\
    并发是指程序同时处理任务的能力。\n\n### 线程与多线程\n\n线程是进程中最小的执行单元。多线程允许程序并发运行线程，从而更有效地利用 CPU。\n\n\
    ### 并发的好处\n\n并发具有许多优势，包括提高性能、响应能力和资源利用率。对于涉及 I/O 操作的任务特别有利。\n\n## 第 2 节：创建线程\n\
    \n### 继承 Thread 类\n\n可以通过扩展 `Thread` 类并重写 `run()` 方法来创建线程。\n\n示例：\n\n```java\n\
    public class MyThread extends Thread {\n    @Override\n    public void run() {\n\
    \        System.out.println(\"Thread running\");\n    }\n    public static void\
    \ main(String[] args) {\n        MyThread thread = new MyThread();\n        thread.start();\n\
    \    }\n}\n```\n\n### 实现 Runnable 接口\n\n另一种创建线程的方法是实现 `Runnable` 接口并将其给 `Thread`\
    \ 对象。\n\n示例：\n\n```java\npublic class MyRunnable implements Runnable {\n    @Override\n\
    \    public void run() {\n        System.out.println(\"Thread running\");\n  \
    \  }\n    public static void main(String[] args) {\n        MyRunnable myRunnable\
    \ = new MyRunnable();\n        Thread thread = new Thread(myRunnable);\n     \
    \   thread.start();\n    }\n}\n```\n\n## 第 3 节：线程管理\n\n### 线程状态\n\nJava 中的线程可以处于不同的状态，如\
    \ `NEW`、`RUNNABLE`、`BLOCKED`、`WAITING`、`TIMED_WAITING` 和 `TERMINATED`，取决于它们的执行状态。\n\
    \n### 线程优先级\n\n可以使用 `setPriority()` 方法为线程分配不同的优先级，但它是取决于平台的，且用法受到限制。\n\n示例：\n\n\
    ```java\npublic class PriorityExample {\n    public static void main(String[]\
    \ args) {\n        Thread thread1 = new Thread(() -> {\n            for (int i\
    \ = 0; i < 5; i++) {\n                System.out.println(\"Thread 1 - Priority:\
    \ \" + Thread.currentThread().getPriority());\n            }\n        });\n  \
    \      Thread thread2 = new Thread(() -> {\n            for (int i = 0; i < 5;\
    \ i++) {\n                System.out.println(\"Thread 2 - Priority: \" + Thread.currentThread().getPriority());\n\
    \            }\n        });\n        thread1.setPriority(Thread.MAX_PRIORITY);\n\
    \        thread2.setPriority(Thread.MIN_PRIORITY);\n        thread1.start();\n\
    \        thread2.start();\n    }\n}\n```\n\n### 守护线程\n\n"
