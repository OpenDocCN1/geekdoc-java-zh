  trans: "\n\n## 使用 `if` 的条件语句\n\n`if` 语句是 C++ 中最基础的控制结构之一。它允许你根据指定条件的求值结果有条件地执行代码块。以下是\
    \ `if` 语句的基本语法：\n\n```cpp\nif (condition) {\n// 如果 'condition' 为真则执行的代码\n}\n```\n\
    \n让我们通过一个示例来分析 `if` 语句的工作原理：\n\n```cpp\n#include <iostream>\n\nint main() {\n\
    \  int x = 10;\n  if (x > 5) {\n    std::cout << \"x is greater than 5.\" << std::endl;\n\
    \  }\n  return 0;\n}\n```\n\n在这个示例中，我们声明了一个值为 `10` 的变量 `x`。`if` 语句检查 `x` 是否大于\
    \ `5`。如果条件（`x > 5`）为真，则执行大括号内部的代码，并在控制台打印 \"x is greater than 5.\"。\n\n### `else`\
    \ 子句\n\n你可以通过 `else` 子句扩展 `if` 语句，以指定当条件为假时执行哪些代码。语法如下：\n\n```cpp\nif (condition)\
    \ {\n// 如果 'condition' 为真则执行的代码\n} else {\n// 如果 'condition' 为假则执行的代码\n}\n```\n\
    \n这里是一个示例：\n\n```cpp\n#include <iostream>\n\nint main() {\n  int x = 3;\n  if\
    \ (x > 5) {\n    std::cout << \"x is greater than 5.\" << std::endl;\n  } else\
    \ {\n    std::cout << \"x is not greater than 5.\" << std::endl;\n  }\n  return\
    \ 0;\n}\n```\n\n在这种情况下，由于 `x` 不大于 `5`，执行了 `else` 块中的代码，并打印 \"x is not greater\
    \ than 5.\"。\n\n### `else if` 子句\n\n你可以使用 `else if` 子句按顺序测试多个条件，从而进一步完善你的条件逻辑。语法如下：\n\
    \n```cpp\nif (condition1) {\n// 如果 'condition1' 为真则执行的代码\n} else if (condition2)\
    \ {\n// 如果 'condition1' 为假且 'condition2' 为真则执行的代码\n} else {\n// 如果 'condition1'\
    \ 和 'condition2' 都为假则执行的代码\n}\n```\n\n让我们来看一个示例：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n  int x = 10;\n  if (x > 15) {\n    std::cout << \"x is greater\
    \ than 15.\" << std::endl;\n  } else if (x > 10) {\n    std::cout << \"x is greater\
    \ than 10 but not 15.\" << std::endl;\n  } else {\n    std::cout << \"x is not\
    \ greater than 10.\" << std::endl;\n  }\n  return 0;\n}\n```\n\n在这个示例中，`if` 语句按照指定的顺序检查条件。由于\
    \ `x` 不大于 `15`，它移动到下一个条件，该条件结果为真。因此，打印了 \"x is greater than 10 but not 15.\"。\n\
    \n### 嵌套 `if` 语句\n\n你还可以将 `if` 语句嵌套在一起，以创建更复杂的条件逻辑。每个 `if` 语句都会根据其条件独立进行求值。这是一个嵌套\
    \ `if` 语句的示例：\n\n```cpp\n#include <iostream>\n\nint main() {\n  int x = 10;\n\
    \  int y = 5;\n  if (x > 5) {\n    std::cout << \"x is greater than 5.\" << std::endl;\n\
    \    if (y > 3) {\n      std::cout << \"y is greater than 3.\" << std::endl;\n\
    \    }\n  }\n  return 0;\n}\n```\n\n在这个示例中，外层 `if` 语句检查 `x` 是否大于 `5`。如果该条件为真，它进入内层\
    \ `if` 语句并检查 `y` 是否大于 `3`。两个条件都为真，因此两条消息都打印到了控制台。\n\n### 短路求值\n\nC++ 在求值 `if`\
    \ 语句中的逻辑表达式时使用短路求值。这意味着一旦逻辑表达式的结果确定，如果没有必要，将停止进一步的求值。例如：\n\n```cpp\nif (x > 5\
    \ && y > 10) {\n// 代码\n}\n```\n\n在这种情况下，如果 `x` 不大于 `5`，`&&` 运算符就不会去评估条件的后半部分（`y\
    \ > 10`），因为如果第一部分为假，整个表达式就不可能为真。\n\n### `if` 语句中的三元运算符\n\n你可以在 `if` 语句中使用三元运算符来实现简洁的条件赋值。这里是一个示例：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n  int age = 18;\n  std::string\
    \ status = (age >= 18) ? \"Adult\" : \"Minor\";\n  std::cout << \"You are a \"\
    \ << status << \".\" << std::endl;\n  return 0;\n}\n```\n\n在这个示例中，三元运算符 `(age\
    \ >= 18) ? \"Adult\" : \"Minor\"` 检查 `age` 是否大于或等于 `18`。如果为真，赋值为 \"Adult\"，否则赋值为\
    \ \"Minor\"。\n\n### `while` 循环\n\n`while` 循环是 C++ 中最基础的控制结构之一。它允许你根据指定条件的求值结果有条件地执行代码块。以下是\
    \ `while` 语句的基本语法：\n\n```cpp\nwhile (condition) {\n// 如果条件为真则执行的代码\n}\n```\n\n\
    让我们通过一个示例来分析 `while` 语句的工作原理：\n\n```cpp\n#include <iostream>\n\nint main() {\n\
    \  int x = 10;\n  while (x > 5) {\n    std::cout << \"x is greater than 5.\" <<\
    \ std::endl;\n  }\n  return 0;\n}\n```\n\n在这个示例中，我们声明了一个值为 `10` 的变量 `x`。`while`\
    \ 语句检查 `x` 是否大于 `5`。如果条件（`x > 5`）为真，则执行大括号内部的代码，并在控制台打印 \"x is greater than 5.\"\
    。\n\n### `do-while` 循环\n\n你可以通过 `else` 子句扩展 `while` 语句（此处原文可能有误，通常此处指循环结构）。语法如下：\n\
    \n```cpp\ndo {\n// 至少执行一次的代码\n} while (condition);\n```\n\n这里是一个示例：\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n  int x = 3;\n  do {\n    std::cout << \"\
    x is greater than 5.\" << std::endl;\n  } while (x > 5);\n  return 0;\n}\n```\n\
    \n在这种情况下，由于 `x` 不大于 `5`，执行了 `do` 块中的代码，并打印了 \"x is greater than 5.\"。\n\n### `for`\
    \ 循环\n\n`for` 循环用于执行特定次数的代码块。语法如下：\n\n```cpp\nfor (initialization; condition;\
    \ increment) {\n// 执行的代码\n}\n```\n\n让我们通过一个示例来分析 `for` 循环的工作原理：\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n  for (int i = 0; i < 5; i++) {\n    std::cout <<\
    \ \"i = \" << i << std::endl;\n  }\n  return 0;\n}\n```\n\n在这个示例中，我们初始化一个变量 `i`\
    \ 值为 `0`。`for` 循环检查 `i < 5`。如果条件为真，则执行代码块，并在每次结束后对 `i` 加 1。\n\n### `break` 语句\n\
    \n你可以使用 `break` 语句提前跳出循环。语法如下：\n\n```cpp\nwhile (condition) {\n  if (condition)\
    \ {\n    break; // 跳出循环\n  }\n}\n```\n\n这里是一个示例：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n  for (int i = 0; i < 10; i++) {\n    if (i == 5) {\n      std::cout\
    \ << \"Break at i = 5\" << std::endl;\n      break;\n    }\n  }\n  return 0;\n\
    }\n```\n\n在这个示例中，当 `i` 等于 `5` 时，`break` 语句被触发，循环终止。\n\n### `continue` 语句\n\n你可以使用\
    \ `continue` 语句跳过当前的迭代并直接进入下一次迭代。语法如下：\n\n```cpp\nwhile (condition) {\n  if (condition)\
    \ {\n    continue; // 跳过剩余代码\n  }\n}\n```\n\n这里是一个示例：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n  for (int i = 0; i < 5; i++) {\n    if (i == 2) {\n      std::cout\
    \ << \"Skipping i = 2\" << std::endl;\n      continue;\n    }\n    std::cout <<\
    \ \"i = \" << i << std::endl;\n  }\n  return 0;\n}\n```\n\n在这个示例中，当 `i` 等于 `2`\
    \ 时，`continue` 语句被触发，跳过了循环体中剩余的语句。\n\n"
- fmt: "\nThe `for` loop is a versatile looping construct that allows you to specify\
    \ the initialization, condition, and iteration of a loop in a single line. Its\
    \ syntax is as follows:\n\n```cpp\nfor (initialization; condition; iteration)\
    \ {\n    // Code to execute while 'condition' is true\n}\n```\n\nLet's break down\
    \ the components of a `for` loop:\n\n- **Initialization**: This part is executed\
    \ once at the beginning of the loop and is typically used to initialize loop control\
    \ variables.\n- **Condition**: The loop continues to execute as long as this condition\
    \ is true. If it evaluates to false, the loop terminates.\n- **Iteration**: After\
    \ each iteration of the loop, this part is executed. It's often used to update\
    \ loop control variables.\n\nHere's an example:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n  for (int i = 0; i < 5; i++) {\n    std::cout << \"Iteration\
    \ \" << i << std::endl;\n  }\n  return 0;\n}\n```\n\nIn this example, the `for`\
    \ loop initializes `i` to `0`, continues executing as long as `i` is less than\
    \ `5`, and increments `i` by `1` after each iteration. The loop prints \"Iteration\
    \ 0\" through \"Iteration 4\" to the console.\n\n### Multiple Initialization and\
    \ Iteration\n\nYou can have multiple initialization and iteration expressions\
    \ in a `for` loop, separated by commas. This allows you to work with multiple\
    \ variables simultaneously. Here's an example:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n  for (int i = 0, j = 10; i < 5 && j > 5; i++, j--) {\n    std::cout\
    \ << \"i = \" << i << \", j = \" << j << std::endl;\n  }\n  return 0;\n}\n```\n\
    \nIn this example, we have two variables, `i` and `j`, initialized to `0` and\
    \ `10`, respectively. The loop continues as long as `i` is less than `5` and `j`\
    \ is greater than `5`. After each iteration, `i` is incremented, and `j` is decremented.\n\
    \n### Infinite `for` Loops\n\nJust like `while` loops, be cautious when using\
    \ `for` loops to avoid infinite loops. Make sure your loop's condition will eventually\
    \ become false.\n\n## Looping with `for-each`\n\nC++ offers a convenient way to\
    \ iterate over elements in a collection (e.g., arrays, vectors) using a `for-each`\
    \ loop. This loop is also known as a range-based `for` loop. It simplifies the\
    \ process of iterating over elements without needing explicit indices. Here's\
    \ the syntax:\n\n```cpp\nfor (element_type element : collection) {\n    // Code\
    \ to process 'element'\n}\n```\n\nLet's see an example using an array:\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n  int numbers[] = {1, 2, 3, 4, 5};\n  for\
    \ (int number : numbers) {\n    std::cout << \"Number: \" << number << std::endl;\n\
    \  }\n  return 0;\n}\n```\n\nIn this example, the `for-each` loop iterates over\
    \ each element in the `numbers` array, and the current element is stored in the\
    \ variable `number`. The loop prints each number to the console.\n\n### `auto`\
    \ Keyword with `for-each`\n\nYou can use the `auto` keyword to let the compiler\
    \ deduce the type of the elements in the collection. This is particularly useful\
    \ when working with complex data types. Here's an example:\n\n```cpp\n#include\
    \ <iostream>\n#include <vector>\n\nint main() {\n  std::vector<std::string> fruits\
    \ = {\"Apple\", \"Banana\", \"Cherry\"};\n  for (auto fruit : fruits) {\n    std::cout\
    \ << \"Fruit: \" << fruit << std::endl;\n  }\n  return 0;\n}\n```\n\nIn this example,\
    \ the `auto` keyword is used to iterate over a `std::vector` of strings, and the\
    \ type of `fruit` is deduced automatically by the compiler.\n\n## Conditional\
    \ Loops with `while` and `for`\n\nLoops often involve conditions, and you can\
    \ combine `while` or `for` loops with `if` statements to create more complex looping\
    \ logic. For example:\n\n```cpp\n#include <iostream>\n\nint main() {\n  int i\
    \ = 0;\n  while (i < 5) {\n    if (i % 2 == 0) {\n      std::cout << \"Even: \"\
    \ << i << std::endl;\n    } else {\n      std::cout << \"Odd: \" << i << std::endl;\n\
    \    }\n    i++;\n  }\n  return 0;\n}\n```\n\nIn this example, we use a `while`\
    \ loop to iterate from `0` to `4`. Inside the loop, we check if the current value\
    \ of `i` is even or odd using an `if` statement. Depending on the condition, we\
    \ print \"Even\" or \"Odd\" along with the value of `i`.\n\nSimilarly, you can\
    \ incorporate conditional logic within `for` loops to achieve the desired behavior\
    \ for your program.\n\n## Summary\n\nControl structures are essential tools in\
    \ programming for making decisions, looping, and controlling the flow of your\
    \ code. In this chapter, we explored conditional statements with `if`, `else`,\
    \ and `else if`, allowing you to execute different code blocks based on specific\
    \ conditions. We also learned about loops with `while`, `do-while`, and `for`,\
    \ which enable you to repeat code as long as certain conditions are met.\n\nThe\
    \ use of control structures, along with loop control statements like `break` and\
    \ `continue`, gives you precise control over your program.\n\n# 6. Functions and\
    \ Scope\n\nIn this chapter, we'll delve into functions and scope. Functions are\
    \ fundamental to any C++.\n\n## Understanding Functions\n\n### What Are Functions?\n\
    \nA function in C++ is a named block of code that performs a specific task. Functions\
    \ provide a way to break down your program into smaller, manageable pieces.\n\n\
    Here's the basic structure of a function:\n\n```cpp\nreturn_type function_name(parameters)\
    \ {\n    // Function body\n    // Code to perform a task\n    return result; //\
    \ Optional return statement\n}\n```\n\nLet's break down the components of a function:\n\
    \n- **Return Type**: The return type specifies the data type of the value that\
    \ the function returns upon completion. It can be any valid C++ data type.\n-\
    \ **Function Name**: The function name is a user-defined identifier you choose\
    \ to represent the function. It should be meaningful and follow naming conventions.\n\
    - **Parameters**: Parameters (also known as arguments) are variables that you\
    \ declare within the parentheses after the function name. They act as placeholders\
    \ for values that will be passed to the function when it's called.\n- **Function\
    \ Body**: The function body contains the actual code that performs the task assigned\
    \ to the function. It's enclosed within curly braces `{}`.\n- **Return Statement**:\
    \ The `return` statement is used to send a value back to the calling code. It's\
    \ optional, especially in functions with a `void` return type. When a `return`\
    \ statement is encountered, the function exits, and the specified value is sent\
    \ back to the caller.\n\n### Function Example\n\nLet's look at a simple example\
    \ of a function that calculates the square of a number:\n\n```cpp\n#include <iostream>\n\
    \n// Function declaration\nint square(int num) {\n  int result = num * num;\n\
    \  return result;\n}\n\nint main() {\n  // Function call\n  int number = 5;\n\
    \  int squared = square(number);\n  std::cout << \"The square of \" << number\
    \ << \" is \" << squared << std::endl;\n  return 0;\n}\n```\n\nIn this example,\
    \ we have a function named `square` that takes an integer parameter `num`. Inside\
    \ the function, we calculate the square of `num` and return the result. In the\
    \ `main` function, we call `square(5)`, passing `5` as the argument. The result\
    \ is stored in the variable `squared` and printed to the console.\n\n### Function\
    \ Prototypes\n"
  raw: 'The `for` loop is a versatile looping construct that allows you to specify
    the initialization, condition, and iteration of a loop in a single line. Its syntax
    is as follows:


    ```cpp


    for (initialization; condition; iteration) {


    // Code to execute while ''condition'' is true


    }


    ```


    Let''s break down the components of a `for` loop:


    - **Initialization**: This part is executed once at the beginning of the loop
    and is typically used to initialize loop control variables.


    - **Condition**: The loop continues to execute as long as this condition is true.
    If it evaluates to false, the loop terminates.


    - **Iteration**: After each iteration of the loop, this part is executed. It''s
    often used to update loop control variables.


    Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    for (int i = 0; i < 5; i++) {


    std::cout << "Iteration " << i << std::endl;


    }


    return 0;


    }


    ```


    In this example, the `for` loop initializes `i` to `0`, continues executing as
    long as `i` is less than `5`, and increments `i` by `1` after each iteration.
    The loop prints "Iteration 0" through "Iteration 4" to the console.


    ### Multiple Initialization and Iteration


    You can have multiple initialization and iteration expressions in a `for` loop,
    separated by commas. This allows you to work with multiple variables simultaneously.
    Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    for (int i = 0, j = 10; i < 5 && j > 5; i++, j--) {


    std::cout << "i = " << i << ", j = " << j << std::endl;


    }


    return 0;


    }


    ```


    In this example, we have two variables, `i` and `j`, initialized to `0` and `10`,
    respectively. The loop continues as long as `i` is less than `5` and `j` is greater
    than `5`. After each iteration, `i` is incremented, and `j` is decremented.


    ### Infinite `for` Loops


    Just like `while` loops, be cautious when using `for` loops to avoid infinite
    loops. Make sure your loop''s condition will eventually become false.


    ## Looping with `for-each`


    C++ offers a convenient way to iterate over elements in a collection (e.g., arrays,
    vectors) using a `


    for-each` loop. This loop is also known as a range-based `for` loop. It simplifies
    the process of iterating over elements without needing explicit indices. Here''s
    the syntax:


    ```cpp


    for (element_type element : collection) {


    // Code to process ''element''


    }


    ```


    Let''s see an example using an array:


    ```cpp


    #include <iostream>


    int main() {


    int numbers[] = {1, 2, 3, 4, 5};


    for (int number : numbers) {


    std::cout << "Number: " << number << std::endl;


    }


    return 0;


    }


    ```


    In this example, the `for-each` loop iterates over each element in the `numbers`
    array, and the current element is stored in the variable `number`. The loop prints
    each number to the console.


    ### `auto` Keyword with `for-each`


    You can use the `auto` keyword to let the compiler deduce the type of the elements
    in the collection. This is particularly useful when working with complex data
    types. Here''s an example:


    ```cpp


    #include <iostream>


    #include <vector>


    int main() {


    std::vector<std::string> fruits = {"Apple", "Banana", "Cherry"};


    for (auto fruit : fruits) {


    std::cout << "Fruit: " << fruit << std::endl;


    }


    return 0;


    }


    ```


    In this example, the `auto` keyword is used to iterate over a `std::vector` of
    strings, and the type of `fruit` is deduced automatically by the compiler.


    ## Conditional Loops with `while` and `for`


    Loops often involve conditions, and you can combine `while` or `for` loops with
    `if` statements to create more complex looping logic. For example:


    ```cpp


    #include <iostream>


    int main() {


    int i = 0;


    while (i < 5) {


    if (i % 2 == 0) {


    std::cout << "Even: " << i << std::endl;


    } else {


    std::cout << "Odd: " << i << std::endl;


    }


    i++;


    }


    return 0;


    }


    ```


    In this example, we use a `while` loop to iterate from `0` to `4`. Inside the
    loop, we check if the current value of `i` is even or odd using an `if` statement.
    Depending on the condition, we print "Even" or "Odd" along with the value of `i`.


    Similarly, you can incorporate conditional logic within `for` loops to achieve
    the desired behavior for your program.


    ## Summary


    Control structures are essential tools in programming for making decisions, looping,
    and controlling the flow of your code. In this chapter, we explored conditional
    statements with `if`, `else`, and `else if`, allowing you to execute different
    code blocks based on specific conditions. We also learned about loops with `while`,
    `do-while`, and `for`, which enable you to repeat code as long as certain conditions
    are met.


    The use of control structures, along with loop control statements like `break`
    and `continue`, gives you precise control over your program''s behavior. We also
    introduced the `for-each` loop for easy iteration over collections.


    Understanding and mastering control structures is fundamental to becoming a proficient
    C++ programmer. With these tools, you can create more dynamic and responsive programs,
    making your code more efficient and adaptable to different situations.


    # # Chapter 6: Functions and Scope


    In this chapter, we''ll delve into the world of functions and scope in C++. Functions
    are a fundamental building block of any C++ program, allowing you to organize
    your code, promote reusability, and improve maintainability. Additionally, we''ll
    explore the concept of scope, which dictates the visibility and lifetime of variables
    within your program.


    ## Understanding Functions


    ### What Are Functions?


    A function in C++ is a named block of code that performs a specific task or a
    set of tasks. Functions provide a way to break down a program into smaller, more
    manageable pieces, making it easier to develop, understand, and maintain. They
    also enable code reuse, as you can call a function multiple times from different
    parts of your program.


    Here''s the basic structure of a function in C++:


    ```cpp


    return_type function_name(parameters) {


    // Function body


    // Code to perform a task


    return result; // Optional return statement


    }


    ```


    Let''s break down the components of a function:


    - **Return Type**: The return type specifies the data type of the value that the
    function will return upon completion. It can be any valid C++ data type, such
    as `int`, `double`, `string`, or even `void` if the function doesn''t return any
    value.


    - **Function Name**: The function name is a user-defined identifier that you choose
    to represent the function. It should be meaningful and follow naming conventions.


    - **Parameters**: Parameters (also known as arguments) are variables that you
    declare within the parentheses after the function name. They act as placeholders
    for values that will be passed to the function when it''s called. Functions can
    have zero or more parameters.


    - **Function Body**: The function body contains the actual code that performs
    the task or tasks assigned to the function. It''s enclosed within curly braces
    `{}`.


    - **Return Statement**: The `return` statement is used to send a value back to
    the calling code. It''s optional, especially in functions with a `void` return
    type. When a `return` statement is encountered, the function exits, and the specified
    value is sent back to the caller.


    ### Function Example


    Let''s look at a simple example of a function that calculates the square of a
    number:


    ```cpp


    #include <iostream>


    // Function declaration


    int square(int num) {


    int result = num * num;


    return result;


    }


    int main() {


    // Function call


    int number = 5;


    int squared = square(number);


    std::cout << "The square of " << number << " is " << squared << std::endl;


    return 0;


    }


    ```


    In this example, we have a function named `square` that takes an integer parameter
    `num`. Inside the function, we calculate the square of `num` and return the result.
    In the `main` function, we call `square(5)`, passing `5` as the argument. The
    result is stored in the variable `squared` and printed to the console.


