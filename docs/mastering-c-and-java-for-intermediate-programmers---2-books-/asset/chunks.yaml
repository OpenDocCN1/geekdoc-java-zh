    \ 循环\n\n与 `while` 循环一样，在使用 `for` 循环时要小心避免死循环。确保你的循环条件最终会变为假。\n\n## 使用 `for-each`\
    \ 循环\n\nC++ 提供了一种方便的方法，通过使用 `for-each` 循环来遍历集合（例如数组、`vector`）中的元素。这种循环也被称为基于范围\
