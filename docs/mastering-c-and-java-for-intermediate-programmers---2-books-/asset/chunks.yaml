    \n## 常见数据类型\n\nC++ 提供了几种内置数据类型来表示不同类型的值。选择合适的数据类型对于高效的内存使用和数据的准确表示至关重要。让我们探索一些常见的数据类型：\n\
    \n### 整数类型\n\n#### `int`\n\n`int` 数据类型用于表示整数值。在大多数系统上，它通常占用 4 字节内存，可以存储特定范围内的整数，例如在\
    \ 32 位系统上范围为 -2,147,483,648 到 2,147,483,647。\n\n```cpp\nint count = 10; // 整数变量的一个示例。\n\
    ```\n\n#### `long` 和 `long long`\n\n`long` 和 `long long` 用于表示可能无法放入 `int` 范围的较大整数。`long`\
    \ 通常使用 4 字节，而 `long long` 使用 8 字节。\n\n```cpp\nlong population = 7800000000;  \
    \    // 'long' 变量的一个示例。\nlong long largeNumber = 1234567890; // 'long long' 变量的一个示例。\n\
    ```\n\n### 浮点类型\n\n#### `float` 和 `double`\n\n`float` 和 `double` 数据类型用于表示浮点数，包括带有小数点的实数。`float`\
    \ 通常使用 4 字节内存，而 `double` 使用 8 字节，提供更高的精度。\n\n```cpp\nfloat pi = 3.14159f;    //\
    \ 'float' 变量的一个示例。\ndouble salary = 55000.5; // 'double' 变量的一个示例。\n```\n\n###\
    \ 字符类型\n\n#### `char`\n\n`char` 数据类型表示单个字符。它使用 1 字节内存存储单个字符，如字母、数字或符号。\n\n```cpp\n\
    char grade = 'A'; // 'char' 变量的一个示例。\n```\n\n### 布尔类型\n\n#### `bool`\n\n`bool`\
    \ 数据类型表示布尔值，可以是 `true` 或 `false`。它经常用于 C++ 程序中的条件判断和决策。\n\n```cpp\nbool isStudent\
    \ = true; // 'bool' 变量的一个示例。\n```\n\n### 自定义数据类型\n\n除了内置类型外，C++ 还允许你使用结构体 (`structs`）和类\
    \ (`classes`）创建自定义数据类型。这些自定义类型允许你定义复杂的数据结构和对象，使你的代码更有组织且易于维护。\n\n在处理现实世界的实体（如员工、学生或产品）时，自定义数据类型特别有用，因为你可以将它们的属性和行为封装在结构化的格式中。\n\
    \n```cpp\n// 定义一个表示人的结构体。\nstruct Person {\n    std::string name;\n    int age;\n\
    };\n\n// 创建 'Person' 结构体的实例。\nPerson person1;\nperson1.name = \"Alice\";\nperson1.age\
    \ = 30;\n\nPerson person2;\nperson2.name = \"Bob\";\nperson2.age = 25;\n```\n\n\
    在这个示例中，我们使用 `struct` 定义了一个自定义数据类型 `Person`。每个 `Person` 都有名字和年龄，允许我们以结构化的方式表示个人。\n\
    \n## 类型推导 (auto)\n\nC++11 引入了 `auto` 关键字，它允许编译器根据初始化值自动推导出变量的数据类型。此功能简化了变量声明，并使代码更加简洁可读。\n\
    \n你可以这样使用 `auto`：\n\n```cpp\nauto x = 42;           // 'x' 被推导为 'int'。\nauto pi\
    \ = 3.14159;   // 'pi' 被推导为 'double'。\nauto name = \"Alice\"; // 'name' 被推导为 'const\
    \ char*'。\n```\n\n通过使用 `auto`，你让编译器决定合适的数据类型，减少类型错误的概率并使代码更加灵活。\n\n## 常量\n\n除了变量外，C++\
    \ 还允许定义常量。常量是在程序执行期间不会改变的值。它们对于定义不应被意外修改的固定值非常有用。\n\n### `const` 关键字\n\n在 C++\
    \ 中声明常量，可以在数据类型之前使用 `const` 关键字：\n\n```cpp\nconst int maxScore = 100; // 声明一个值为\
    \ 100 的常量 'maxScore'。\n```\n\n一旦声明常量，它就无法被修改。\n\n### 常量的优点\n\n- **可读性**：使用 `const`\
    \ 让你的代码包含更多信息。\n- **安全性**：常量防止值的意外更改。\n- **可维护性**：当你需要更新一个值时，只需要在一个地方更改。\n\n##\
    \ 类型修饰符\n\nC++ 提供了修饰符来改变数据类型的特征，例如它们的尺寸或符号位。\n\n### `unsigned`\n\n`unsigned` 修饰符与整数类型一起使用，表示它们只存储非负值。例如\
