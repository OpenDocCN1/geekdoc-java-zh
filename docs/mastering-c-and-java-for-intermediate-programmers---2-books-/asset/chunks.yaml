    ## Ternary Operator `? :`


    The ternary operator `? :` is a conditional operator that allows you to write
    compact conditional expressions. It''s also known as the conditional operator.


    ```cpp


    condition ? expression_if_true : expression_if_false


    ```


    The `condition` is evaluated first. If it''s `true`, the expression before the
    `:` is executed; otherwise, the expression after the `:` is executed.


    ```cpp


    int age = 18;


    std::string message = (age >= 18) ? "Adult" : "Minor";


    ```


    In this example, if `age` is greater than or equal to `18`, the `message` will
    be assigned the value `"Adult"`; otherwise, it will be assigned `"Minor"`.


    The ternary operator is handy for writing concise conditional assignments and
    can make your code more readable when used appropriately.


    ## Operator Precedence


    Operators in C++ have a specific precedence, which determines the order in which
    they are evaluated when combined in an expression. It''s important to understand
    operator precedence to avoid unexpected results in your code.


    Here''s a simplified overview of operator precedence from highest to lowest:


    1\. Parentheses `( )`: Highest precedence; used to group expressions and override
    default precedence.


    2\. Postfix increment/decrement `x++`, `x--`: Next highest precedence; modifies
    the variable and returns its current value.


    3\. Prefix increment/decrement `++x`, `--x`: Same as postfix but returns the updated
    value.


    4\. Arithmetic operators `+`, `-`, `*`, `/`, `%`: These operators perform basic
    mathematical operations.


    5\. Bitwise operators `&`, `|`, `^`, `~`, `<<`, `>>`: Used for bitwise manipulation.


    6\. Comparison operators `==`, `!=`, `<`, `>`, `<=`, `>=`: Used for comparisons.


    7\. Logical operators `&&`, `||`, `!`: Used for combining boolean expressions.


    8\. Ternary operator `? :`: Used for conditional expressions.


    9\. Assignment operators `=`, `+=`, `-=` etc.: Lowest


    precedence; used for assignment and calculations.


    Remember that parentheses can be used to change the order of evaluation and explicitly
    specify the desired precedence.


    ## Expressions


    An expression is a combination of operators, operands, and variables that produces
    a value. Expressions can be simple, involving just one variable, or complex, involving
    multiple operators and operands. Here are some examples of expressions:


    ```cpp


    int sum = 3 + 4; // Simple expression that calculates the sum.


    bool isTrue = (x > 5) && (y <= 10); // Complex expression combining comparisons.


    int result = (a * b) + (c / d) - (e % f); // Expression with arithmetic operators.


    ```


    In C++, expressions are used extensively to perform calculations, make decisions,
    and manipulate data.


    ## Summary


    In this chapter, we''ve delved into the world of operators and expressions in
    C++. You''ve learned about arithmetic operators for performing mathematical calculations,
    assignment operators for updating variable values, comparison operators for making
    logical comparisons, and logical operators for combining boolean values.


    We''ve explored increment and decrement operators for modifying variables and
    bitwise operators for manipulating individual bits within integers. Additionally,
    you''ve seen the ternary operator, which allows for compact conditional expressions,
    and learned about operator precedence, which determines the order in which operators
    are evaluated.


    Operators and expressions are the building blocks of C++ programming. They allow
    you to perform a wide range of tasks, from basic arithmetic to complex decision-making.
    As you gain more experience with C++, you''ll find yourself using these tools
    to create efficient and expressive code.


