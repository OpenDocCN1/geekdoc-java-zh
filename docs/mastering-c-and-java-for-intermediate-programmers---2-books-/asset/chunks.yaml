    \n```cpp\n#include <iostream>\n#include <fstream>\n\nint main() {\n  std::ofstream\
    \ file(\"numbers.txt\");\n  if (!file.is_open()) {\n    std::cerr << \"打开文件错误。\"\
    \ << std::endl;\n    return 1;\n  }\n  int num1 = 42;\n  double num2 = 3.14159;\n\
    \  file << num1 << std::endl;\n  file << num2 << std::endl;\n  file.close();\n\
    \  return 0;\n}\n```\n\n在这个示例中，我们打开 \"numbers.txt\" 文件进行写入，然后使用 `<<` 运算符向文件写入一个整数\
    \ (`num1`) 和一个双精度浮 (`num2`)。每个数据项后面都跟着 `std::endl` 以插入换行符。\n\n## 文件位置与定位\n\n在处理文件时，你可能需要移动文件位置以便在文件的特定位置读取或写入数据。C++\
