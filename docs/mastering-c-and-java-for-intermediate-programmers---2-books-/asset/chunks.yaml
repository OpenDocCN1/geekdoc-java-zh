    \ list.add(\"Alice\");\n        list.add(\"Bob\");\n        list.forEach(System.out::println);\n\
    \    }\n}\n```\n\n## 第 6 ：线程通信\n\n### 使用 `wait()` 和 `notify()`\n\n`wait()` 和 `notify()`\
    \ 方法允许线程进行通信并协调它们的活动。\n\n示例：\n\n```java\npublic class WaitNotifyExample {\n  \
    \  public static void main(String[] args) {\n        Object lock = new Object();\n\
    \        Thread producer = new Thread(() -> {\n            synchronized (lock)\
    \ {\n                System.out.println(\"Producer is producing data...\");\n\
    \                lock.notify(); // 通知等待的消费者\n            }\n        });\n    \
    \    Thread consumer = new Thread(() -> {\n            synchronized (lock) {\n\
    \                try {\n                    lock.wait(); // 等待生产者生产数据\n      \
    \              System.out.println(\"Consumer is consuming data...\");\n      \
    \          } catch (InterruptedException e) {\n                    e.printStackTrace();\n\
    \                }\n            }\n        });\n        producer.start();\n  \
    \      consumer.start();\n    }\n}\n```\n\n## 第 7 ：线程安全\n\n### Java 中的线程安全\n\n\
    线程安全指的是程序在多线程环境中正确且安全地执行的能力。\n\n### 不变对象\n\n不可变对象本质上是线程安全的，因为它们的状态在创建后无法被修改。\n\
    \n示例：\n\n```java\npublic final class ImmutablePoint {\n    private final int x;\n\
    \    private final int y;\n\n    public ImmutablePoint(int x, int y) {\n     \
    \   this.x = x;\n        this.y = y;\n    }\n    public int getX() {\n       \
    \ return x;\n    }\n    public int getY() {\n        return y;\n    }\n}\n```\n\
    \n## 结论\n\n并发是现代编程的一个关键方面，Java 提供了强大的工具和 API 来有效管理线程和并发编程。\n\n# 第 11 章：Java 网络编程\n\
