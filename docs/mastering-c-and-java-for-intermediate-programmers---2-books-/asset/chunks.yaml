    # Chapter 14: Web Development with Java Servlets


    Java Servlets are an essential part of web development using Java. Servlets provide
    a server-side solution for handling HTTP requests and generating dynamic content
    on the web. In this chapter, we will explore the fundamentals of Java Servlets,
    including handling HTTP methods, working with request and response objects, session
    management, and practical examples to demonstrate how to build web applications
    using Servlets.


    ## Section 1: Introduction to Java Servlets


    ### What are Java Servlets?


    Java Servlets are Java classes that run on the server-side to handle HTTP requests
    and produce dynamic content for web applications.


    ### Servlet Lifecycle


    Servlets follow a lifecycle with methods like `init()`, `service()`, and `destroy()`.


    ## Section 2: Setting Up a Servlet


    ### Servlet Configuration in web.xml


    Servlets need to be configured in the `web.xml` deployment descriptor.


    **Example: web.xml**


    ```xml

    <?xml version="1.0" encoding="UTF-8"?>

    <web-app xmlns="http://java.sun.com/xml/ns/javaee"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    xsi:schemaLocation="http://java.sun.com/xml/ns/javaee

    http://java.sun.com/xml/ns/javaee/web-app_3_0.xsd"

    version="3.0">

    <servlet>

    <servlet-name>HelloServlet</servlet-name>

    <servlet-class>com.example.HelloServlet</servlet-class>

    </servlet>

    <servlet-mapping>

    <servlet-name>HelloServlet</servlet-name>

    <url-pattern>/hello</url-pattern>

    </servlet-mapping>

    </web-app>

    ```


    ### Creating a Simple Servlet


    **Example: HelloServlet.java**


    ```java

    package com.example;

    import javax.servlet.*;

    import java.io.IOException;

    public class HelloServlet implements Servlet {

    @Override

    public void init(ServletConfig config) throws ServletException {

    // Initialization code

    }

    @Override

    public void service(ServletRequest req, ServletResponse res) throws ServletException,
    IOException {

    res.setContentType("text/html");

    res.getWriter().println("<html><body><h1>Hello, Servlet!</h1></body></html>");

    }

    @Override

    public void destroy() {

    // Cleanup code

    }

    @Override

    public ServletConfig getServletConfig() {

    return null;

    }

    @Override

    public String getServletInfo() {

    return null;

    }

    }

    ```


    ## Section 3: Handling HTTP Methods


    ### HTTP GET Method


    Servlets can handle GET requests using the `doGet()` method.


    **Example: HelloServlet.java**


    ```java

    package com.example;

    import javax.servlet.*;

    import javax.servlet.http.*;

    import java.io.IOException;

    public class HelloServlet extends HttpServlet {

    @Override

    protected void doGet(HttpServletRequest req, HttpServletResponse res) throws ServletException,
    IOException {

    res.setContentType("text/html");

    res.getWriter().println("<html><body><h1>Hello, Servlet!</h1></body></html>");

    }

    }

    ```


    ### HTTP POST Method


    Servlets can handle POST requests using the `doPost()` method.


    **Example: PostServlet.java**


    ```java

    package com.example;

    import javax.servlet.*;

    import javax.servlet.http.*;

    import java.io.IOException;

    public class PostServlet extends HttpServlet {

    @Override

    protected void doPost(HttpServletRequest req, HttpServletResponse res) throws
    ServletException, IOException {

    String name = req.getParameter("name");

    res.setContentType("text/html");

    res.getWriter().println("<html><body><h1>Hello, " + name + "!h1></body></html>");

    }

    }

    ```


    ## Section 4: Request and Response Objects


    ### HttpServletRequest


    The `HttpServletRequest` object contains information about the client''s request.


    **Example: RequestInfoServlet.java**


    ```java

    package com.example;

    import javax.servlet.*;

    import javax.servlet.http.*;

    import java.io.IOException;

    public class RequestInfoServlet extends HttpServlet {

    @Override

    protected void doGet(HttpServletRequest req, HttpServletResponse res) throws ServletException,
    IOException {

    String method = req.getMethod();

    String uri = req.getRequestURI();

    String protocol = req.getProtocol();

    res.setContentType("text/html");

    res.getWriter().println("<html><body>");

    res.getWriter().println("<p>Method: " + method + "</p>");

    res.getWriter().println("<p>URI: " + uri + "</p>");

    res.getWriter().println("<p>Protocol: " + protocol + "</p>");

    res.getWriter().println("</body></html>");

    }

    }

    ```


    ### HttpServletResponse


    The `HttpServletResponse` object is used to send responses back to the client.


    ## Section 5: Session Management


    ### HttpSession


    Servlets can manage sessions using the `HttpSession` object.


    **Example: CounterServlet.java**


    ```java

    package com.example;

    import javax.servlet.*;

    import javax.servlet.http.*;

    import java.io.IOException;

    public class CounterServlet extends HttpServlet {

    @Override

    protected void doGet(HttpServletRequest req, HttpServletResponse res) throws ServletException,
    IOException {

    HttpSession session = req.getSession(true);

    Integer count = (Integer) session.getAttribute("count");

    if (count == null) {

    count = 1;

    } else {

    count++;

    }

    session.setAttribute("count", count);

    res.setContentType("text/html");

    res.getWriter().println("<html><body>");

    res.getWriter().println("<p>Page visits: " + count + "</p>");

    res.getWriter().println("</body></html>");

    }

    }

    ```


    ## Conclusion


    Java Servlets are a fundamental part of web development in Java, providing a server-side
    solution for handling HTTP requests and generating dynamic content. In this chapter,
    we explored the basics of Java Servlets, including setting up a Servlet, handling
    HTTP methods, working with request and response objects, and session management.
    Armed with this knowledge, you can create robust and dynamic applications using
    Servlets, providing users with a seamless and interactive experience on the web.


