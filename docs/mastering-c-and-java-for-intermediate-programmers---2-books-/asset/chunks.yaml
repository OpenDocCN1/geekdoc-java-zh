    \        System.out.println(result); // 输出: 50\n    }\n}\n```\n\n# 第 6 章：异常处理\n\
    \n异常处理是编程中至关重要的部分，它允许开发者优雅地处理意外或错误情况。当程序执行期间发生错误时会抛出异常，适当处理这些异常可以防止程序崩溃并为调试提供有用信息。在本章中，我们将探索\
    \ Java 和 Python 中的异常处理，并结合实际示例演示如何处理各种异常。\n\n## 第 1 部分：异常处理的基础\n\n### 异常类层次结构\n"
- fmt: "\nIn both Java and Python, exceptions are organized in a class hierarchy.\
    \ The base class is typically named `Exception`, and various specific exceptions\
    \ are derived from it. This hierarchy allows developers to handle exceptions more\
    \ effectively based on their types.\n\n### Java Example:\n```java\ntry {\n   \
    \ // Code that may raise an exception\n} catch (Exception e) {\n    // Exception\
    \ handling code\n}\n```\n\n### Python Example:\n```python\ntry:\n    # Code that\
    \ may raise an exception\nexcept Exception as e:\n    # Exception handling code\n\
    ```\n\n## Section 2: Handling Specific Exceptions\n\nBoth Java and Python allow\
    \ developers to handle specific exceptions individually or in groups.\n\n### Java\
    \ Example:\n```java\ntry {\n    int result = divide(10, 0);\n    System.out.println(\"\
    Result: \" + result);\n} catch (ArithmeticException e) {\n    System.out.println(\"\
    Cannot divide by zero.\");\n} catch (Exception e) {\n    System.out.println(\"\
    An unexpected error occurred.\");\n}\n```\n\n### Python Example:\n```python\n\
    try:\n    result = divide(10, 0)\n    print(\"Result:\", result)\nexcept ZeroDivisionError:\n\
    \    print(\"Cannot divide by zero.\")\nexcept Exception as e:\n    print(\"An\
    \ unexpected error occurred.\")\n```\n\n## Section 3: The Finally Block\n\nBoth\
    \ Java and Python provide a `finally` block that executes regardless of whether\
    \ an exception is raised or not. This block is used for cleanup activities, such\
    \ as closing files or releasing resources.\n\n### Java Example:\n```java\ntry\
    \ {\n    // Code that may raise an exception\n} catch (Exception e) {\n    //\
    \ Exception handling code\n} finally {\n    // Cleanup code (always executed)\n\
    }\n```\n\n### Python Example:\n```python\ntry:\n    # Code that may raise an exception\n\
    except Exception as e:\n    # Exception handling code\nfinally:\n    # Cleanup\
    \ code (always executed)\n```\n\n## Section 4: Raising Exceptions\n\nIn both Java\
    \ and Python, developers can raise exceptions manually using the `throw` keyword\
    \ (Java) or the `raise` statement (Python). This is useful for signaling specific\
    \ errors or situations in the code.\n\n### Java Example:\n```java\npublic void\
    \ processAge(int age) throws InvalidAgeException {\n    if (age < 0) {\n     \
    \   throw new InvalidAgeException(\"Age cannot be negative.\");\n    }\n    //\
    \ Code to process the age\n}\n```\n\n### Python Example:\n```python\ndef process_age(age):\n\
    \    if age < 0:\n        raise ValueError(\"Age cannot be negative.\")\n    #\
    \ Code to process the age\n```\n\n## Section 5: Custom Exceptions\n\nDevelopers\
    \ can create custom exception classes to handle specific scenarios that are not\
    \ covered by the built-in exceptions.\n\n### Java Example:\n```java\npublic class\
    \ CustomException extends Exception {\n    public CustomException(String message)\
    \ {\n        super(message);\n    }\n}\n// Usage\ntry {\n    if (someCondition)\
    \ {\n        throw new CustomException(\"Custom error message.\");\n    }\n} catch\
    \ (CustomException e) {\n    // Custom exception handling code\n}\n```\n\n###\
    \ Python Example:\n```python\nclass CustomException(Exception):\n    def __init__(self,\
    \ message):\n        super().__init__(message)\n\n# Usage\ntry:\n    if some_condition:\n\
    \        raise CustomException(\"Custom error message.\")\nexcept CustomException\
    \ as e:\n    # Custom exception handling code\n```\n\n## Section 6: Nested Exception\
    \ Handling\n\nBoth Java and Python support nested exception handling, where exceptions\
    \ can be caught at different levels of the code.\n\n### Java Example:\n```java\n\
    try {\n    try {\n        // Code that may raise an exception\n    } catch (Exception\
    \ e) {\n        // Inner exception handling\n    }\n} catch (Exception e) {\n\
    \    // Outer exception handling\n}\n```\n\n### Python Example:\n```python\ntry:\n\
    \    try:\n        # Code that may raise an exception\n    except Exception as\
    \ e:\n        # Inner exception handling\n    except Exception as e:\n       \
    \ # Outer exception handling\n```\n\n---\n\nThis chapter explored exception handling\
    \ in both Java and Python, showcasing how it helps manage unexpected errors and\
    \ promotes robust and reliable code. By using `try-catch` (Java) or `try-except`\
    \ (Python) blocks, developers can gracefully handle exceptions and prevent program\
    \ crashes.\n\nFurthermore, the use of `finally` blocks ensures that critical cleanup\
    \ activities are executed regardless of whether an exception is raised or not.\
    \ Additionally, both languages allow developers to create custom exception classes\
    \ for specialized error handling.\n\nWith a strong grasp of exception handling\
    \ techniques, you can create more resilient and dependable programs that gracefully\
    \ recover from unexpected scenarios. As we continue through the book, we will\
    \ explore more advanced exception handling strategies and demonstrate their application\
    \ in real-world programming challenges.\n\n# Chapter 7: File Handling and I/O\
    \ Operations\n\nFile handling and Input/Output (I/O) operations are essential\
    \ aspects of programming that involve reading data from files, writing data to\
    \ files, and performing various operations on files. File handling enables programs\
    \ to store and retrieve data persistently, making it crucial for tasks like data\
    \ storage, configuration, and data processing. In this chapter, we will delve\
    \ into file handling and I/O operations in both Java and Python, with practical\
    \ examples to demonstrate how to work with files effectively.\n\n## Section 1:\
    \ File Handling in Python\n\n### Opening and Closing Files\n\nIn Python, files\
    \ can be opened using the `open()` function, and they should be properly closed\
    \ after processing using the `close()` method.\n\n**Python Example:**\n```python\n\
    # Opening a file in write mode\nfile = open(\"data.txt\", \"w\")\n# Writing data\
    \ to the file\nfile.write(\"Hello, world!\\n\")\nfile.write(\"This is a sample\
    \ text.\\n\")\n# Closing the file\nfile.close()\n```\n\n### Reading Data from\
    \ Files\n\nData can be read from files using different modes: `\"r\"` (read),\
    \ `\"w\"` (write), `\"a\"` (append), `\"r+\"` (read and write), etc.\n\n**Python\
    \ Example:**\n```python\n# Opening a file in read mode\nfile = open(\"data.txt\"\
    , \"r\")\n# Reading data from the file\ncontent = file.read()\nprint(content)\n\
    # Closing the file\nfile.close()\n```\n\n### Reading Line by Line\n\nFiles can\
    \ be read line by line using the `readline()` method.\n\n**Python Example:**\n\
    ```python\n# Opening a file in read mode\nfile = open(\"data.txt\", \"r\")\n#\
    \ Reading by line\nline1 = file.readline()\nline2 = file.readline()\nprint(line1)\n\
    print(line2)\n# Closing the file\nfile.close()\n```\n\n## Section 2: File Handling\
    \ in Java\n\n### Reading and Writing Files\n\nIn Java, file handling involves\
    \ using classes like `File`, `FileReader`, `FileWriter`, `BufferedReader`, and\
    \ `BufferedWriter` to perform file operations.\n\n**Java Example:**\n```java\n\
    import java.io.File;\nimport java.io.FileReader;\nimport java.io.FileWriter;\n\
    import java.io.BufferedReader;\nimport java.io.BufferedWriter;\nimport java.io.IOException;\n\
    \npublic class FileHandler {\n    public static void main(String[] args) {\n \
    \       try {\n            // Writing data to a file\n            FileWriter writer\
    \ = new FileWriter(\"data.txt\");\n            writer.write(\"Hello, world!\\\
    n\");\n            writer.write(\"This is a sample text.\\n\");\n            writer.close();\n\
    \n            // Reading data from a file\n            FileReader reader = new\
    \ FileReader(\"data.txt\");\n            BufferedReader bufferedReader = new BufferedReader(reader);\n\
    \            String line;\n            while ((line = bufferedReader.readLine())\
    \ != null) {\n                System.out.println(line);\n            }\n     \
    \       bufferedReader.close();\n            reader.close();\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
    \n## Section 3: File Modes and Exception Handling\n\n### File Modes in Python\n\
    \nIn Python, the `open()` function can be used with different modes for reading,\
    \ writing, and appending to files.\n\n**Python Example:**\n```python\n# Reading\
    \ from a file\nwith open(\"data.txt\", \"r\") as file:\n    content = file.read()\n\
    \    print(content)\n\n# Writing to a file (existing content will be overwritten)\n\
    with open(\"data.txt\", \"w\") as file:\n    file.write(\"Hello, world!\\n\")\n\
    \n# Appending to a file (data will be added at the end)\nwith open(\"data.txt\"\
    , \"a\") as file:\n    file.write(\"This is a sample text.\\n\")\n```\n\n### File\
    \ Exception Handling in Java\n\nIn Java, file handling can raise exceptions, such\
    \ as `IOException`, which should be properly handled using `try-catch` blocks.\n"
