    ### Const Objects


    You can also create `const` objects, which cannot be modified after their initial
    assignment. Const objects are especially useful for ensuring data integrity and
    preventing accidental changes.


    Here''s how you create a `const` object:


    ```cpp

    const ClassName constObjectName;

    ```


    For example, you can create a `const` object of the `Person` class like this:


