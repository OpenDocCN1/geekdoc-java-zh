    - `boolean`: Represents true or false


    2\. **Reference Data Types:** These data types refer to objects created from classes
    or interfaces. Examples include strings, arrays, and user-defined classes.


    ### Data Types in Python


    Python is a dynamically typed language, meaning the data type of a variable is
    determined automatically based on the assigned value. Python provides the following
    built-in data types:


    1\. **Numeric Types:** These include `int` (integers with unlimited precision),
    `float` (floating-point numbers), and `complex` (complex numbers).


    2\. **Sequence Types:** These represent sequences of values. The main sequence
    types are `list`, `tuple`, and `range`.


    3\. **Text Type:** The `str` data type represents strings of characters.


    4\. **Boolean Type:** The `bool` data type represents the truth values `True`
    and `False`.


    5\. **Set Types:** These include `set` (unordered collection of unique elements)
    and `frozenset` (immutable set).


    6\. **Mapping Type:** The `dict` data type represents key-value pairs.


    ## Section 2: Variables


    ### Declaring Variables in Java


    In Java, variables must be declared with an explicit data type before they can
    be used. The syntax for declaring variables is as follows:


    ```java


    <dataType> <variableName>;


    ```


    Here''s an example of declaring and initializing variables in Java:


    ```java


    public class Main {


    public static void main(String[] args) {


    int age;


    double salary;


    char grade;


    age = 30;


    salary = 45000.50;


    grade = ''A'';


    System.out.println("Age: " + age);


    System.out.println("Salary: " + salary);


    System.out.println("Grade: " + grade);


    }


    }


    ```


    ### Declaring Variables in Python


    In Python, you can directly assign values to variables without explicitly declaring
    their data types. Python infers the data type based on the assigned value. Here''s
    an example of declaring and initializing variables in Python:


    ```python


    age = 30


    salary = 45000.50


    grade = ''A''


    print("Age:", age)


    print("Salary:", salary)


    print("Grade:", grade)


    ```


    ### Variable Naming Rules


    Both Java and Python have specific rules for variable naming:


    - Variable names can contain letters (a-z, A-Z), digits (0-9), and underscores
    (_).


    - The first character of a variable name cannot be a digit.


    - Variable names are case-sensitive, meaning `age`, `Age`, and `AGE` are considered
    different variables.


    ## Section 3: Type Conversion and Casting


    ### Type Conversion in Java


    Java provides automatic type conversion for compatible data types, known as widening
    conversion. For example, converting an `int` to a `double`:


    ```java


    int number = 10;


    double result = number; // Automatic conversion from int to double


    ```


    However, explicit type conversion, known as casting, is required when converting
    from a larger data type to a smaller data type to avoid data loss:


    ```java


    double largeNumber = 1234.56;


    int smallNumber = (int) largeNumber; // Casting from double to int


    ```


    ### Type Conversion in Python


    Python also performs automatic type conversion, but it is referred to as "type
    coercion." For example, converting an `int` to a `float`:


    ```python


    number = 10


    result = float(number) # Automatic conversion from int to float


    ```


    Similarly, explicit type conversion is used when converting between different
    data types:


    ```python


    large_number = 1234.56


    small_number = int(large_number) # Casting from float to int


    ```


    ## Section 4: Type Checking and Type Conversion Functions


    ### Type Checking in Java


    In Java, you can check the data type of a variable using the `instanceof` operator.
    It returns `true` if the variable is an instance of the specified data type, otherwise
    `false`.


    ```java


    public class Main {


    public static void main(String[] args) {


    int number = 10;


    double salary = 45000.50;


    System.out.println(number instanceof Integer); // Output: true


    System.out.println(salary instanceof Double); // Output: true


    }


    }


    ```


    ### Type Checking in Python


    Python provides the `type()` function to check the data type of a variable:


    ```python


    number = 10


    salary = 45000.50


    print(type(number)) # Output: <class ''int''>


    print(type(salary)) # Output: <class ''float''>


    ```


    ### Type Conversion Functions in Python


    Python offers built-in functions to explicitly convert variables between different
    data types:


    - `int()`: Converts a value to an integer.


    - `float()`: Converts a value to a floating-point number.


    - `str()`: Converts a value to a string.


    - `bool()`: Converts a value to a boolean.


    ## Section 5: Examples of Data Types and Variables


    ### Example 1: Working with Numeric Data Types


    **Java Example:**


    ```java


    int num1 = 10;


    int num2 = 20;


    int sum = num1 + num2;


    System.out.println("Sum: " + sum);


    ```


    **Python Example:**


    ```python


    num1 = 10


    num2 = 20


    sum = num1 + num2


    print("Sum:", sum)


    ```


    ### Example 2: Manipulating Strings


    **Java Example:**


    ```java


    String firstName = "John";


    String lastName = "Doe";


    String fullName = firstName + " " + lastName;


    System.out.println("Full Name: " + fullName);


    ```


    **Python Example:**


    ```python


    first_name = "John"


    last_name = "Doe"


    full_name = first_name + " " +


    last_name


    print("Full Name:", full_name)


    ```


    ### Example 3: Using Boolean Variables


    **Java Example:**


    ```java


    boolean isRaining = true;


    if (isRaining) {


    System.out.println("Take an umbrella.");


    } else {


    System.out.println("Enjoy the sunshine!");


    }


    ```


    **Python Example:**


    ```python


    is_raining = True


    if is_raining:


    print("Take an umbrella.")


    else:


    print("Enjoy the sunshine!")


    ```


