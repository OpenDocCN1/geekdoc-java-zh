    ## Member Access Control


    In C++, class members (attributes and methods) can have different access control
    specifiers that determine their visibility and accessibility from outside the
    class. There are three primary access control specifiers: `public`, `protected`,
    and `private`.


    ### Public


    Members declared as `public` are accessible from anywhere in the program, including
    outside the class. They provide a public interface to the class and can be used
    to interact with objects of the class.


    ### Protected


    Members declared as `protected` are accessible within the class and by derived
    classes. They are not directly accessible from outside the class but can be accessed
    by derived classes if the inheritance relationship is established.


    ### Private


    Members declared as `private` are only accessible within the class. They are not
    visible or accessible from outside the class, ensuring strong encapsulation.


    Here''s an example


    demonstrating access control in a class:


    ```cpp


