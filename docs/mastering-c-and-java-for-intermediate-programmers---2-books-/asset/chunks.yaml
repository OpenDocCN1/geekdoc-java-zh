    \n## 指针\n\n### 什么是指针？\n\n指针是一个存储另一个变量内存地址的变量。指针不直接持有值，而是指向内存中存储该值的位置。指针是 C++ 中的基本概念，提供了一种直接操作内存的方法。\n\
