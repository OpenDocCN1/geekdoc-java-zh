    ### Example: Inheritance in Action


    Let''s explore a practical example involving shapes to illustrate inheritance.
    We''ll start with a base class `Shape` that defines common attributes and behaviors.
    Then, we''ll create two derived classes, `Circle` and `Rectangle`, which inherit
    from `Shape` and introduce their own attributes and behaviors.


    ```cpp

    class Shape {

    protected:

    double width;

    double height;

    public:

    Shape(double w, double h) : width(w), height(h) {}

    virtual double area() const {

    return width * height;

    }

    };

    class Circle : public Shape {

    private:

    double radius;

    public:

    Circle(double r) : Shape(0, 0), radius(r) {}

    double area() const override {

    return 3.14159 * radius * radius;

    }

    };

    class Rectangle : public Shape {

    public:

    Rectangle(double w, double h) : Shape(w, h) {}

    };

    ```


    In this code:

    - `Shape` is the base class, containing attributes `width` and `height` and a
    method `area()` to calculate the area.

    - `Circle` is a derived class that inherits from `Shape`. It adds a `radius` attribute
    and overrides the `area()` method to calculate the area of a circle.

    - `Rectangle` is another derived class that inherits from `Shape`. It takes `width`
    and `height` as constructor parameters.


    Now, let''s create objects of these classes and demonstrate how they can be used:


    ```cpp

    Circle circle(5.0);

    Rectangle rectangle(4.0, 6.0);

    Shape* shape1 = &circle;

    Shape* shape2 = &rectangle;

    double area1 = shape1->area(); // Calls Circle''s area() method

    double area2 = shape2->area(); // Calls Rectangle''s area() method

    ```


    In this example, we create `Circle` and `Rectangle` objects and use pointers to
    the base class `Shape` to calculate their areas. This demonstrates how objects
    of different derived classes can be treated uniformly when they share a common
    base class.


    ## Polymorphism: Treating Objects in a Unified Way


    ### The Concept of Polymorphism


    Polymorphism is a fundamental concept in OOP that enables objects of different
    classes to be treated as objects of a common base class. It allows you to write
    code that can work with objects of various types in a unified manner. Polymorphism
    is achieved through function overriding and virtual functions.


    The key idea behind polymorphism is that you can write generic code that operates
    on objects of a base class, and at runtime, the correct derived class version
    of a method is called based on the actual type of the object. This flexibility
    promotes code reusability and the creation of systems that can easily adapt to
    changing requirements.


    ### Function Overriding: The Heart of Polymorphism


    Function overriding is a critical aspect of polymorphism. It occurs when a derived
    class provides a specific implementation of a method that is already defined in
    the base class. The overridden method in the derived class has the same name and
    signature as the base class method.


    Here''s an example that demonstrates function overriding:


    ```cpp

    class Animal {

    public:

    virtual void makeSound() const {

    std::cout << "Animal makes a sound" << std::endl;

    }

    };

    class Dog : public Animal {

    public:

    void makeSound() const override {

    std::cout << "Dog barks" << std::endl;

    }

    };

    ```


    In this code, we have a base class `Animal` with a virtual function `makeSound()`,
    and a derived class `Dog` that overrides the `makeSound()` method to provide a
    specific implementation for dogs.


    Now, let''s create objects of both classes and demonstrate polymorphism:


    ```cpp

    Animal* animal1 = new Animal;

    Animal* animal2 = new Dog;

    animal1->makeSound(); // Calls Animal''s makeSound()

    animal2->makeSound(); // Calls Dog''s makeSound()

    ```


    In this code, we create two pointers to the base class `Animal`. The first pointer,
    `animal1`, points to an object of the `Animal` class, while the second pointer,
    `animal2`, points to an object of the `Dog` class. When we call the `makeSound()`
    method on these pointers, polymorphism comes into play:

    - `animal1->makeSound()` calls the `makeSound()` method of the `Animal` class
    because it points to an `Animal` object.

    - `animal2->makeSound()` calls the `makeSound()` method of the `Dog` class because
    it points to a `Dog` object. This demonstrates dynamic binding, where the correct
    method is determined at runtime based on the actual object type.


    ### Virtual Functions: The Foundation of Polymorphism


    To enable polymorphism and function overriding, you should declare base class
    functions as `virtual`. A virtual function is a member function in the base class
    that can be overridden by derived classes. It allows the correct derived class
    version of the function to be called based on the object''s actual type.


    Here''s how you declare a virtual function:


    ```cpp

    class BaseClass {

    public:

    virtual void virtualFunction() {

    // Virtual function implementation in the base class

    }

    };

    class DerivedClass : public BaseClass {

    public:

    void virtualFunction() override {

    // Derived class-specific implementation

    }

    };

    ```


    In the code above, the `virtualFunction()` method in the `BaseClass` is declared
    as `virtual`. The `DerivedClass` then overrides this virtual function with its
    own implementation using the `override` keyword.


    ### Abstract Classes: Promoting Concrete Implementations


    An abstract class is a class that cannot be instantiated directly and is meant
    to serve as a base class for other classes. It often contains one or more pure
    virtual functions, which are virtual functions without a default implementation
    in the base class. Derived classes must provide implementations for these pure
    virtual functions.


    Here''s an example of an abstract class with a pure virtual function:


    ```cpp

    class AbstractShape {

    public:

    // Pure virtual function

    virtual double area() const = 0;

    // Regular member function

    void printArea() const {

    std::cout << "Area: " << area() << std::endl;

    }

    };

    ```


    In this code, `AbstractShape` is an abstract class with a pure virtual function
    `area()`. Derived classes like `Circle` or `Rectangle` must provide concrete implementations
    of the `area()` function.


    ### Polymorphism and Object Slicing: A Cautionary Note


    When working with polymorphism, it''s essential to understand the concept of object
    slicing. Object slicing occurs when you assign an object of a derived class to
    an object of a base class. During this process, the specific attributes and behaviors
    of the derived class are "sliced off," leaving only the base class part.


    Here''s an exampleいい object slicing:


    ```cpp

    class Base {

    public:

    int baseValue;

    Base(int value) : baseValue(value) {}

    virtual void display() const {

    std::cout << "Base: " << baseValue << std::endl;

    }

    };

    class Derived : public Base {

    public:

    int derivedValue;

    Derived(int baseVal, int derivedVal) : Base(baseVal), derivedValue(derivedVal)
    {}

    void display() const override {

    std::cout << "Derived: " << baseValue << ", " << derivedValue << std::endl;

    }

    };

    int main() {

    Derived derivedObj(42, 101);

    Base baseObj = derivedObj; // Object slicing

    baseObj.display(); // Calls Base''s display()

    return 0;

    }

    ```


    In this code, we have a base class `Base` and a derived class `Derived`. The `Derived`
    class extends the base class by adding an additional attribute `derivedValue`.
    In the `main()` function, we create a `Derived` object and then assign it to a
    `Base` object. This assignment results in object slicing.


    When we call `baseObj.display()`, it calls the `display()` method of the base
    class, not the derived class, because `baseObj` is a `Base` object.

