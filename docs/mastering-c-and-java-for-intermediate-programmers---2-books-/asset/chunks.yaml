    MyClass(int initialData) {

    data = initialData;

    std::cout << "Object created with data: " << data << std::endl;

    }


    // Destructor

    ~MyClass() {

    std::cout << "Object destroyed with data: " << data << std::endl;

    }

    };

    ```


    In this code, the constructor initializes the `data` attribute, and the destructor
    provides a message when the object is destroyed.


    ## Inheritance


    Inheritance is a core concept in OOP that allows you to create a new class (derived
    class or subclass) based on an existing class (base class or superclass). The
    derived class inherits attributes and methods from the base class and can also
    have its own additional attributes and methods. Inheritance promotes code reusability
    and allows you to model "is-a" relationships between classes.


    Here''s how you define an inheritance relationship in C++:


    ```cpp

    class BaseClass {

    // Base class members

    };


    class DerivedClass : public BaseClass {

    // Derived class members

    };

    ```


    - `BaseClass`: The base class from which the derived class inherits.

    - `DerivedClass`: The derived class that inherits from the base class.


    In the example above, `DerivedClass` inherits members from `BaseClass`.


    ## Access Control in Inheritance


    C++ provides three access control specifiers for inherited members: `public`,
    `protected`, and `private`. These specifiers control how the inherited members
    can be accessed from the derived class.


    - `public`: Inherited members are accessible in the same way as they are in the
    base class.

    - `protected`: Inherited members are treated as `protected` in the derived class,
    meaning they can only be accessed within the derived class or its subclasses.

    - `private`: Inherited members are treated as `private` in the derived class,
    making them inaccessible from outside the base class.


    Here''s an example:


    ```cpp

    class BaseClass {

    public:

    int publicMember;

    protected:

    int protectedMember;

    private:

    int privateMember;

    };


    class DerivedClass : public BaseClass {

    // publicMember is still public

    // protectedMember is still protected

    // privateMember is not accessible from DerivedClass

    };

    ```


    ## Polymorphism


    Polymorphism is a fundamental concept in OOP that allows objects of different
    classes to be treated as objects of a common base class. This concept enables
    you to write code that can work with various derived classes uniformly. Polymorphism
    is achieved through function overriding and virtual functions.


    ### Function Overriding


    Function overriding occurs when a derived class provides a specific implementation
    of a method that is already defined in the base class. The overridden method in
    the derived class has the same name and signature as the base class method.


    Here''s an example:


    ```cpp

    class Animal {

    public:

    virtual void makeSound() {

    std::cout << "Animal makes a sound" << std::endl;

    }

    };


    class Dog : public Animal {

    public:

    void makeSound() override {

    std::cout << "Dog barks" << std::endl;

    }

    };


    class Cat : public Animal {

    public:

    void makeSound() override {

    std::cout << "Cat meows" << std::endl;

    }

    };

    ```


    In this code, the `makeSound` method is overridden in both the `Dog` and `Cat`
    classes to provide specific implementations. When you call `makeSound` on an object
    of the base class `Animal`, the appropriate derived class method is invoked.


    ### Virtual Functions


    To enable polymorphism and dynamic binding, you can use virtual functions. A virtual
    function is declared in the base class with the `virtual` keyword, and it can
    be overridden in derived classes. When a derived class object is accessed through
    a pointer or reference of the base class type, the appropriate derived class virtual
    function is called at runtime.


    Here''s how you declare a virtual function:


    ```cpp

    class BaseClass {

    public:

    virtual void virtualFunction() {

    // Base class implementation

    }

    };


    class DerivedClass : public BaseClass {

    public:

    void virtualFunction() override {

    // Derived class implementation

    }

    };

    ```


    ## Abstract Classes


    An abstract class is a class that cannot be instantiated and is typically used
    as a base class for other classes. Abstract classes often contain one or more
    pure virtual functions, which are declared with the `virtual` keyword and have
    no implementation in the base class. Derived classes must provide implementations
    for all pure virtual functions, making them concrete classes.


    Here''s an example of an abstract class:


    ```cpp

    class Shape {

    public:

    virtual double area() const = 0; // Pure virtual function

    virtual double perimeter() const = 0; // Pure virtual function

    };

    ```


    In this code, the `Shape` class is abstract and defines two pure virtual functions:
    `area` and `perimeter`. Derived classes, such as `Circle` or `Rectangle`, must
    implement these functions to become concrete classes.


    ## Encapsulation


    Encapsulation is one of the key principles of OOP that involves bundling data
    (attributes) and the methods (functions) that operate on that data into a single
    unit called a class. It also includes controlling access to the data by defining
    access specifiers (public, protected, private). Encapsulation helps in hiding
    the internal details of a class and provides a clear interface for interacting
    with objects.


    Here''s an example of encapsulation:


    ```cpp

    class BankAccount {

    private:

    double balance;

    public:

    BankAccount(double initialBalance) {

    balance = initialBalance;

    }

    double getBalance() const {

    return balance;

    }

    void deposit(double amount) {

    if (amount > 0) {

    balance += amount;

    }

    }

    void withdraw(double amount) {

    if (amount > 0 && amount <= balance) {

    balance -= amount;

    }

    }

    };

    ```


    In this code, the `balance` attribute is encapsulated within the `BankAccount`
    class. Access to `balance` is controlled through the `getBalance`, `deposit`,
    and `withdraw` methods.

