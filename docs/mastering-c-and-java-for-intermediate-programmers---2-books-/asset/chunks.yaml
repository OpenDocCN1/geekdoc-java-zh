    ### C++ Casting Operators


    C++ introduced four casting operators to provide more precise control over type
    casting. These operators are:


    - `static_cast`

    - `dynamic_cast`

    - `const_cast`

    - `reinterpret_cast`


    The most commonly used casting operator is `static_cast`, which allows you to
    perform various safe type conversions. Here''s how you can use `static_cast`:


    ```cpp

    double value = 3.14159;

    int intValue = static_cast<int>(value); // Explicitly converts ''value'' (double)
    to ''intValue'' (int).

    ```


    Using `static_cast` is preferred over C-style casting as it provides better type
    checking and safety.


