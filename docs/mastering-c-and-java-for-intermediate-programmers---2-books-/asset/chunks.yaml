    the user for input and store it in a variable:


    ```cpp


    int number;


    std::cout << "Enter a number: ";


    std::cin >> number;


    ```


    In this code, we use `std::cout` to display a prompt, and then `std::cin` to read
    the user''s input into the `number` variable.


    ## Comments


    Comments are essential for documenting your code and making it more understandable
    for both yourself and others who may read your code. In C++, you can add comments
    in two ways:


    - Single-line comments start with `//` and continue until the end of the line.
    For example:


    ```cpp


    // This is a single-line comment.


    ```


    - Multi-line comments start with `/*` and end with `*/`. They can span multiple
    lines. For example:


    ```cpp


    /* This is a


    multi-line comment. */


    ```


    Comments are ignored by the compiler and are meant for human readers of the code.
    They are a valuable tool for explaining your code''s logic, providing context,
    and documenting any tricky parts of your program.


    ## Summary


    In this chapter, we''ve laid the foundation for your C++ programming journey.
    You''ve learned how to install a C++ compiler, write your first C++ program, and
    understand the basics of variables and data types. Additionally, we explored input
    and output operations using `std::cin` and `std::cout`, and we discussed the importance
    of comments in documenting your code.


    As you continue your C++ learning journey, remember that practice is key. Experiment
    with code, explore different data types, and get comfortable with input and output
    operations. In the next chapter, we''ll dive deeper into C++ programming concepts,
    including operators and expressions, to further enhance your skills.


    So, keep coding, keep learning, and enjoy your adventure into the world of C++
    programming!


    This concludes Chapter 2 of "Mastering C++ Programming: A Comprehensive Guide
    for Intermediate Learners." In the following chapters, we will explore more advanced
    topics and practical examples to help you become proficient in C++ programming.


    # # Chapter 3: Variables and Data Types


    In the previous chapter, we took our first steps into the world of C++ programming,
    learning how to set up a development environment, write our first C++ program,
    and understand the essentials of input and output. Now, it''s time to explore
    the fundamental building blocks of any program: variables and data types.


    ## Understanding Variables


    Variables are like containers that hold data in your C++ programs. They allow
    you to store, manipulate, and retrieve information during the execution of your
    code. Think of a variable as a labeled box where you can place different types
    of items, such as numbers, text, or even complex structures.


    ### Declaring Variables


    To use a variable in C++, you first need to declare it. Declaration informs the
    compiler about the variable''s data type and name. Here''s the basic syntax for
    declaring a variable:


    ```cpp


    data_type variable_name;


    ```


    - `data_type`: This is the type of data the variable will store. For example,
    you can use `int` for integers, `double` for floating-point numbers, `char` for
    characters, and so on.


    - `variable_name`: This is the user-defined name of the variable. It should adhere
    to certain naming rules, such as starting with a letter and consisting of letters,
    digits, or underscores.


    Here''s an example of variable declaration:


    ```cpp


    int age; // Declares a variable named ''age'' to store integers.


    ```


    ### Initializing Variables


    After declaring a variable, you can also initialize it, which means assigning
    an initial value. Initialization is not mandatory, but it''s a good practice to
    give your variables an initial value to avoid potential bugs or unexpected behavior.
    Here''s how you can declare and initialize a variable:


    ```cpp


    data_type variable_name = initial_value;


    ```


    For example:


    ```cpp


    int score = 100; // Declares and initializes ''score'' with the value 100.


    ```


    ### Variable Naming Rules


    When choosing names for your variables, follow these naming rules:


    - Variable names are case-sensitive, so `age` and `Age` would be treated as different
    variables.


    - Variable names can consist of letters (both uppercase and lowercase), digits,
    and underscores.


    - A variable name must start with a letter or an underscore (it''s best to start
    with a letter to adhere to conventions).


    - Avoid using C++ keywords as variable names, as they have special meanings in
    the language. For example, don''t name your variable `int` or `for`.


    - Use meaningful and descriptive names for your variables to make your code more
    readable. For instance, `totalScore` is more informative than `ts`.


    ### Examples of Variable Declarations


