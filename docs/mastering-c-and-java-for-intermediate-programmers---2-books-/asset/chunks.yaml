    ## 增增和减运算符


    增增和减运算符用于将变量的值增加或减少 `1`。它们通常用于循环和计数器管理。


    ### 递增 `++`


    递增运算符 `++` 在操作数的值上加加 `1`。


    ```cpp

    int count = 5;

    count++; // Increment ''count'' by 1; ''count'' becomes 6.

    ```


    ### 递减 `--`


    递减运算符 `--` 在操作数的值上减 `1`。


    ```cpp

    int score = 10;

    score--; // Decrement ''score'' by 1; ''score'' becomes 9.

    ```


    ### 前置和后置递增/递减


    增增减运算符有两种使用方式：作为前置运算符（++x`, `--x`）或后置运算符（x++`, `x--`）。


    - 前置运算符（++x`, `--x`）先增或减变量，然后返回更新的值。


    ```cpp

    int a = 5;

    int b = ++a; // Increment ''a'' by 1 and assign it to ''b''; ''a'' and ''b'' will
    both be 6.

    ```


    - 后置运算符（x++`, `x--`）先变量的当前值，然后对其增或减。


    ```cpp

    int p = 5;

    int q = p++; // Assign the current value of ''p'' to ''q'' and then increment
    ''p''; ''p'' becomes 6, ''q'' is 5.

    ```


    使用前置或后置形式取决于你是否需要在表达式中使用变量的原始值或更新后的值。


    ## 位运算符


    位运算符对整数值的每个单独位进行操作。它们被用于低层编程和某些优化任务。以下是常见的位运算符：


    ### 位与 `&`


    位与运算符 `&` 在两个整数的对应位之间执行位与操作。


    ```cpp

    int x = 5;  // Binary: 0101

    int y = 3;  // Binary: 0011

    int result = x & y; // Result: 0001 (decimal 1)

    ```


    ### 位或 `|`


    位或运算符 `|` 在两个整数的对应位之间执行位或操作。


    ```cpp

    int a = 5;  // Binary: 0101

    int b = 3;  // Binary: 0011

    int result = a | b; // Result: 0111 (decimal 7)

    ```


    ### 位异异 `^`


    位异异运算符 `^` 在两个整数的对应位之间执行位异异（互斥或）操作。


    ```cpp

    int p = 5;  // Binary: 0101

    int q = 3;  // Binary: 0011

    int result = p ^ q; // Result: 0110 (decimal 6)

    ```


    ### 位反 `~`


    位反反运算符 `~` 反转（翻转）整数的所有位。


    ```cpp

    int num = 5;      // Binary: 0000 0101

    int result = ~num; // Result: 1111 1010 (decimal -6 due to two''s complement representation)

    ```


    ### 左移 `<<`


    左移运算符 `<<` 将整数的位左移指定的位数。


    ```cpp

    int x = 5;      // Binary: 0000 0101

    int result = x << 2; // Result: 0001 0100 (decimal 20)

    ```


    ### 右移 `>>`


    右移运算符 `>>` 将整数的位右移指定的位数。


    ```cpp

    int a = 20;      // Binary: 0001 0100

    int result = a >> 2; // Result: 0000 0101 (decimal 5)

    ```


    位运算符用于需要操作整数内部单个位的场景，例如低层硬件编程和某些算法中。


    ### 三元运算符 `? :`


    三元运算符 `? :` 是 `if-else` 语句的简写。它接受三个操作数并根据条件返回一个值。


