    \n# 第 9 章：Java Streams API\n\nJava Streams API 是 Java 8 引入 Java 标准库的一项强大功能。它提供了一种函数式方法来高效、简洁地处理数据集合。Stream\
    \ 允许开发者以声明式的方式对数据进行操作，使代码更具表达力且易于阅读。在本章中，我们将探索 Java Streams API 及其关键特性，并通过实际示例演示如何有效地使用它。\n\
    \n## 第 1 节：Java Streams 简介\n\n### 什么是 Stream？\n\nJava 中的 Stream 是元素的序列，可以以函数式和声明式的方式进行处理。它们提供了一种对列表、数组和映射等数据集合执行操作的方法。Stream\
    \ 允许并行处理，这在多核环境中可以提高性能。\n\n### Stream 的特性\n\nJava 中的 Stream 具有以下特性：\n\n1. **函数式方法：**\
    \ Stream 使用函数式方法进行数据处理，允许以更简洁、易读的方式表达操作。\n2. **惰性：** Stream 是惰性的，这意味着在调用终端操作之前，中间操作不会执行。这允许进行更高效的的，因为只处理需要的数据。\n\
    3. **并行处理：** Stream 可以进行并行处理，利用多核处理器的优势，并可能加速大型数据集上的操作。\n\n## 第 2 节：创建 Stream\n\
    \n### 从集合创建 Stream\n\nStream 可以从各种数据源创建，包括列表和集合等集合。\n\n**示例：**\n\n```java\nimport\
    \ java.util.List;\nimport java.util.stream.Stream;\npublic class StreamExample\
    \ {\n    public static void main(String[] args) {\n        List<String> names\
    \ = List.of(\"Alice\", \"Bob\", \"Charlie\", \"David\");\n        // 从列表创建一个流\n\
    \        Stream<String> namesStream = names.stream();\n        namesStream.forEach(System.out::println);\n\
    \    }\n}\n```\n\n### 生成 Stream\n\n可以使用 `Stream.of()` 或 `Stream.iterate()` 等静态方法生成\
    \ Stream。\n\n**示例：**\n\n```java\nimport java.util.stream.Stream;\npublic class\
    \ StreamExample {\n    public static void main(String[] args) {\n        // 使用\
    \ Stream.of() 创建流\n        Stream<Integer> numbersStream = Stream.of(1, 2, 3,\
    \ 4, 5);\n        numbersStream.forEach(System.out::println);\n        // 使用 Stream.iterate()\
    \ 创建流\n        Stream<Integer> evenNumbersStream = Stream.iterate(0, n -> n +\
    \ 2).limit(5);\n        evenNumbersStream.forEach(System.out::println);\n    }\n\
    }\n```\n\n## 第 3 节：中间操作\n\n### 过滤元素\n\nStream 支持 `filter()` 方法根据指定条件过滤元素。\n\n\
    **示例：**\n\n```java\nimport java.util.List;\nimport java.util.stream.Stream;\n\
    public class StreamExample {\n    public static void main(String[] args) {\n \
    \       List<String> names = List.of(\"Alice\", \"Bob\", \"Charlie\", \"David\"\
    );\n        // 过滤以 A 开头的名称\n        Stream<String> filteredNames = names.stream().filter(name\
    \ -> name.startsWith(\"A\"));\n        filteredNames.forEach(System.out::println);\n\
    \    }\n}\n```\n\n### 映射元素\n\n`map()` 方法将 Stream 中的每个元素转换为另一个对象。\n\n**示例：**\n\n\
    ```java\nimport java.util.List;\nimport java.util.stream.Stream;\npublic class\
    \ StreamExample {\n    public static void main(String[] args) {\n        List<String>\
    \ names = List.of(\"Alice\", \"Bob\", \"Charlie\", \"David\");\n        // 将名称映射为长度\n\
    \        Stream<Integer> nameLengths = names.stream().map(String::length);\n \
    \       nameLengths.forEach(System.out::println);\n    }\n}\n```\n\n### 排序元素\n\
    \nStream 可以 `sorted()` 方法进行排序。\n\n**示例：**\n\n```java\nimport java.util.List;\n\
    import java.util.stream.Stream;\npublic class StreamExample {\n    public static\
    \ void main(String[] args) {\n        List<String> names = List.of(\"Alice\",\
    \ \"Bob\", \"Charlie\", \"David\");\n        // 按字母顺序排序\n        Stream<String>\
    \ sortedNames = names.stream().sorted();\n        sortedNames.forEach(System.out::println);\n\
    \    }\n}\n```\n\n## 第 4 节：终端操作\n\n### 收集元素\n\n终端操作使用 `collect()` 方法将 Stream 的元素收集到集合中。\n\
    \n**示例：**\n\n```java\nimport java.util.List;\nimport java.util.stream.Collectors;\n\
    import java.util.stream.Stream;\npublic class StreamExample {\n    public static\
    \ void main(String[] args) {\n        List<String> names = List.of(\"Alice\",\
    \ \"Bob\", \"Charlie\", \"David\");\n        // 将以 A 开头的名称收集到新列表中\n        List<String>\
    \ filteredNames = names.stream()\n        .filter(name -> name.startsWith(\"A\"\
    ))\n        .collect(Collectors.toList());\n        System.out.println(filteredNames);\n\
    \    }\n}\n```\n\n### 归约元素\n\n`reduce()` 方法对 Stream 的元素进行归约操作。\n\n"
