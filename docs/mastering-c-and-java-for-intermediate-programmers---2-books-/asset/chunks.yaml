    ## Section 5: DatagramSocket and DatagramPacket


    ### UDP Communication


    UDP (User Datagram Protocol) is a connectionless protocol for sending and receiving
    data packets.


    ### DatagramSocket Class


    The `DatagramSocket` class in the `java.net` package is used for UDP communication.


    ### DatagramPacket Class


    The `DatagramPacket` class in the `java.net` package represents a data packet
    used in UDP communication.


    **Example:**


    ```java


    import java.net.*;


    import java.util.Arrays;


    public class UDPExample {


    public static void main(String[] args) {


    try {


    DatagramSocket socket = new DatagramSocket();


    byte[] sendData = "Hello, server!".getBytes();


    InetAddress serverAddress = InetAddress.getByName("localhost");


    int serverPort = 1234;


    DatagramPacket sendPacket = new DatagramPacket(sendData, sendData.length, serverAddress,
    serverPort);


    socket.send(sendPacket);


    byte[] receiveData = new byte[1024];


    DatagramPacket receivePacket = new DatagramPacket(receiveData, receiveData.length);


    socket.receive(receivePacket);


    String response = new String(receivePacket.getData(), 0, receivePacket.getLength());


    System.out.println("Server response: " + response);


    socket.close();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    ```


