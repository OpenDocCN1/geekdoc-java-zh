    \ must be used only for special-purpose problem solving and only when information\
    \ is not publicly available. The class members are marked private for reasons.\
    \ Few of the popular usage of reflection in day to day development includes the\
    \ following:\n\n* Reflection enables modular architecture by investigating code\
