- fmt: '

    * Which one takes up more memory between `ArrayList` and `LinkedList`? Why?

    * Between `ArrayList` and `LinkedList`, which one would you prefer if you need
    random access? Why?


    # Queue


    * A `queue` is a collection designed to hold elements before processing.

    * A `queue` has two ends, a tail, and a head.

    * A `queue` works in a `FIFO` manner, first in and first out.


    ## Types of Queues


    * `Queue` - simple queue which allows insertion at tail and removal from the head,
    in a `LIFO` manner.

    * `Deque` - allows insertion and removal of elements from head and tail.

    * `Blocking Queue` - blocks the thread to add element when its full and also blocks
    the thread to remove element when it''s empty.

    * `Transfer Queue` - special blocking queue where data transfer happens between
    two threads.

    * `Blocking Deque` - a combination of `Deque` and blocking queue .

    * `Priority queue` - element with the highest priority is removed first.

    * `Delay queue` - element is allowed to be removed only after the delay associated
    with it has elapsed.


    ## Basic Queue


    * A `queue` has one entry point (tail) and one exit point (head).

    * If entry and exit point is the same, it’s a `LIFO` (last in first out) queue
    .


    ```java

    // simple queue

    Queue<String> queue = new LinkedList<>();

    ```


    ## Priority Queue


    * In the `PriorityQueue`, a priority is associated with the elements in the queue.

    * Element with the highest priority is removed next.

    * `PriorityQueue` does not allow the `null` element.

    * An element of queue either implement a `Comparable` interface or use a `Comparator`
    object to calculate priority.


    ```java

    // City class implements Comparable interface

    Queue<City> pq = new PriorityQueue<>();

    ```


    ## Deque


    * `Deque` allows insertion and removal from both ends.

    * `Deque` does not provide indexed access to elements.

    * `Deque` extends the `Queue` interface.


    ```java

    // Create a Deque

    Deque<String> deque = new LinkedList<>();

    ```


    ## Blocking Queue


    * `BlockingQueue` interface inherits from `Queue` .

    * `BlockingQueue` is designed to be thread-safe.

    * `BlockingQueue` is designed to be used as producer-consumer queues.


    ## Transfer Queue


    * `TransferQueue` extends `BlockingQueue` .

    * It may be capacity bounded, where Producer may wait for space availability and/or
    Consumers may wait for items to become available.


    ```java

    // Transfer Queue

    TransferQueue<String> ltq = new LinkedTransferQueue<String>();

    ```


    ## Questions


    * What is the purpose of the `Queue`?

    * How is `Deque` different from `Queue`?

    * What is a priority queue?

    * What criteria should be used to delete an item from the priority queue?

    * What is a `Delay Queue`?

    * What is a `Blocking Queue`?

    * Which `Queue` is a thread-safe queue?

    * Which `Queue` implements the Producer-Consumer pattern?

    * Explain the difference between the `Blocking Queue` and the `Transfer Queue`?

    * Which `Queue` is capacity bounded, allowing only the specified number of elements
    in `Queue`? What happens if you try to put more than the capacity?


    # Map


    * The `map` contains key-value mapping.

    * Usually, `Map` allows one `null` as its key and multiple `null` as values, but
    it’s left to the `Map`''s implementation class to define restrictions.


    ## ImplementationHashMap


    * `HashMap` is based on a hash table.

    * `HashMap` does not guarantee the order of the elements in the map.

    * `HashMap`''s hash function provides constant-time performance for the `get()`
    and the `put()` operations.

    * `HashMap` allows one `null` for the key and multiple `null`s for the value.


    ```java

    // Create a map using HashMap

    Map<String, String> hashMap = new HashMap<>();

    ```


    ## LinkedHashMap


    * `LinkedHashMap` is a hash table and linked list implementation of `Map` interface.

    * `LinkedHashMap` stores entry using a doubly-linked list.

    * Use `LinkedHashMap` instead of `HashSet` if the insertion order is to be maintained.

    * The performance of `HashMap` is slightly better than `LinkedHashMap` as `LinkedHashMap`
    has to maintain the linked list too.

    * It ensures iteration over entries in its insertion order.


    ```java

    // LinkedHashMap

    LinkedHashMap lhm = new LinkedHashMap();

    ```


    ## WeakHashMap


    * `WeakHashMap` stores only weak references to its keys.

    * `WeakHashMap` supports both `null` key and `null` values.

    * When there is no reference to keys, they become a candidate for garbage collection.


    ```java

    // WeakHasMap

    Map map = new WeakHashMap();

    ```


    ## Sorted Map


    * `SortedMap` provides complete ordering on its keys.

    * Sorts the map entries on keys based either on natural sort order (`Comparable`)
    or custom sort order (`Comparator`).

    * `SortedMap` interface inherits from `Map`.


    ```java

    // sorted map

    SortedMap<String,String> sm = new TreeMap<>();

    ```


    ## Navigable Map


    * `NavigableMap` extends the `SortedMap` interface.

    * `TreeMap` class is the implementation of `NavigableMap` .

    * `NavigableMap` can be accessed in both, ascending and descending order.

    * It supports navigation in both directions and getting the closest match for
    the key.


    ```java

    // Create a Navigable Map

    NavigableMap<String,String> nm = new TreeMap<>();

    ```


    ## Concurrent Map


    * `ConcurrentHashMap` is concrete implementation of `ConcurrentMap`.

    * `ConcurrentHashMap` uses fine-grained synchronization by partitioning the map
    into buckets and locking each bucket.

    * `ConcurrentHashMap` does not lock the map while reading from it.


    ```java

    // Create a Concurrent Map

    ConcurrentMap<String,String> cm = new ConcurrentHashMap<>();

    ```


    ## Notes


    * The `Map` keys and `Set` items must not change state, so these must be immutable;
    prefer using immutable classes provided by JDK as key.

    * Never expose collection fields to the caller, instead provide methods to operate
    on.

    * `HashMap` offers better performance for inserting, locating, and deleting elements.

    * `TreeMap` is best for traversing in sorted order.


    ## Questions


    * How is `Map` different from other collections?

    * Can you add a `null` value as the key?

    * Can you guarantee ordering of elements in `HashMap`?

    * How `HashMap` can provide constant-time performance for the `get()` and the
    `put()` operations.

    * What is the difference between `HashMap` and `LinkedHashMap`?

    * If the insertion order is to be maintained, which one should you use: `LinkedHashMap`
    or `HashSet`? Why?

    * What is `WeakHashMap`?

    * If do you want to maintain the ordering of key, which `Map` class should you
    use?

    * Which Map class should you use to access it in both ascending and descending
    order?

    * Which `Map` implement is optimized for thread safety?

    * How does `ConcurrentHashMap` enforce scalability, with good efficiency still
    maintained?


    # Algorithms


    * Sorting - is used to sort the collection in ascending or descending order. You
    can either use the natural order if the key class has implemented a `Comparable`
    interface or need to pass the `Comparator` object for custom sorting.

    * Searching - `BinarySearch` algorithm is used to search keys.

    * Shuffling - it re-orders the elements in the list in random order; it is generally
    used in games.

    * Data Manipulation - `reverse`, `copy`, `swap`, `fill`, and `addAll` algorithms
    are provided to manipulate the usual data on the collection elements.

    * Extreme Value - `min` and `max` algorithms are provided to find the minimum
    and maximum values in the specified collection.


    # Questions


    * What are the different algorithms supported by the collection framework?

    * Which search algorithm is used to search keys?

    * How is the shuffling algorithm used?

