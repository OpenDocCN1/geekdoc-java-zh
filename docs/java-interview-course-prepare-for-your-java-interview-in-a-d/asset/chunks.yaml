  trans: "\n\n# 垃圾回收概述\n\n* 解释垃圾回收周期？\n* 为什么垃圾回收被认为是一个昂贵的过程？\n* 为什么垃圾回收周期提高应用程序的性能？\n\
    * 垃圾回收如何防止 `OutOfMemoryException`？\n* 垃圾回收使用哪种类型的线程：守护线程还是用户线程？\n* 什么是内存碎片？\n\
    * 为什么垃圾回收发生时应用程序似乎变慢了？\n* 你可以显式地请求垃圾回收吗？\n* 你调用哪些方法可以请求垃圾回收？\n* 垃圾回收会在请求时总是发生吗？\n\
    \n# 内存管理\n\n`JVM` 内存分为两大类：栈内存（stack）和堆内存（heap）。\n\n### 栈内存\n栈内存与每个系统线程相关，并在线程执行期间使用。栈包含方法中定义的局部对象和引用变量；尽管被引用的对象存储在堆中。一旦执行离开该方法，方法内声明的所有局部变量将从栈中移除。\n\
    \n### 堆内存\n堆内存分为若干称为“代”的区域：\n\n* **新生代 (New Generation)** - 它被分为 `Eden`（伊甸区）和\
    \ `Survivor`（幸存者区）。大多数新对象在 `Eden` 内存空间中创建。\n* **老年代 (Old Generation)** \n* **元空间\
    \ (Metaspace)**\n\n![](img/Image00017.jpg)\n\n当新生代满时，会触发垃圾回收。在 `Eden` 中生存此 GC\
    \ 周期的对象会被移动到 `Survivor` 空间。同样，在几次 `GC` 之后，存活的对象继续移动到老年代。`Metaspace` 被 `JVM` 用于保留永久对象，主要是类的元数据信息。新生代的垃圾回收频率比老年代高。\n\
    \n* `New Gen` 和 `Old Gen` 是堆的一部分，而 `Metaspace` 是原生内存（Native memory）的一部分。\n* `Metaspace`\
    \ 可以在运行时扩展，因为它是原生内存的一部分。\n\n当垃圾回收发生时，所有应用程序线程都会被冻结，直到 GC 完成操作。老年代的垃圾回收通常很慢；因此，如果老年代发生大量垃圾回收，可能会导致应用程序超时错误。\n\
    \n## 问题\n* 堆内存是如何划分的？\n* 解释堆内存的不同代？对象是如何跨代移动的？\n* 垃圾回收周期是如何触发的？\n* 新生代内存中的 `Eden`\
    \ 和 `Survivor` 空间是什么？\n* `Eden` 中的对象何时移动到 `Survivor` 空间？\n* 什么是 `Metaspace`？\n\
    * `Metaspace` 中存储的是什么类型的内容？\n* 为什么 `Metaspace` 拥有几乎无限的空间？\n* 哪一代的垃圾回收周期运行最慢？为什么？\n\
    * 哪代的垃圾回收频率更高？\n\n# 弱引用 vs 软引用 vs 虚引用\n\n通常，如果一个对象拥有引用，垃圾回收器就不会收集它。这一原则对于 `Weak`（弱引用）和\
    \ `Soft`（软引用）不成立。\n\n### 弱引用 (Weak Reference)\n弱引用是被垃圾回收器积极的引用。弱引用适用于缓存，可以在需要时重新加载。\n\
    \n### 软引用 (Soft Reference)\n软引用比 `Weak Reference` 略强，因为只有在存在内存限制时才会被垃圾回收器收集。软引用通常用于缓存可重建的资源，如文件句柄等。\n\
    \n### 虚引用 (Phantom Reference)\n虚引用是 `Java` 中中最弱的引用。它在对象被终结（finalize）后被引用，但内存尚未被垃圾回收器回收。它主要用于跟踪内存使用的技术目的。\n\
    \n## 问题\n* 什么是弱引用？\n* 什么是软引用？\n* 什么是虚引用？\n* 哪些类型的引用会被垃圾回收器收集，即使其类型的对象仍在在使用？\n\
    * 软引用和弱引用之间的区别是什么？\n* 弱引的典型用法是什么？\n* 软引用的典型用法是什么？\n* 虚引用的典型用法是什么？\n* 先收集的是软引用还是弱引用？\n\
    \n# 单元测试 (UNIT TESTING)\n\n## 为什么单元测试？\n两个最重要的原因：\n* 你只有通过亲身实践才能理解真正的收益。\n* 单元测试能让你晚上睡个安稳觉。\n\
    \n其他重要原因：\n* 单元测试对代码更改的成功/失败提供立即且持续的反馈。\n* 单元测试增加了进行重大更改的信心，而不必破坏任何现有功能。\n* 单元测试帮助你理解代码的内部和设计。\n\
    * 单元测试还可以作为各种编码场景的文档。\n* 单元测试通过减少对不同场景的多次手动验证周期，从长期来看节省了时间。\n\n## 问题\n* 单元测试的好处是什么？\n\
    * 单元测试从长期来看如何节省时间？\n* 你如何使用单元测试来记录编码场景？\n\n## 单元测试 vs 集成测试 vs 回归测试 vs 验证测试\n*\
    \ **单元 (Unit)**：单元测试在编写代码时持续进行，以获得对最小的可测试更改的即时反馈。最小的可测试单元可以跨越方法或类，但必须排除外部依赖，如\
    \ `File I/O`、`Databases`（数据库）、`Network Access`（网络访问）等。\n* **集成 (Integration)**：当一个场景的所有更改完全实现后，进行端到端集成测试。\n\
    * **回归 (Regression)**：回归测试是在整个软件上执行的一系列测试，以发现功能性和非功能性区域的错误。回归测试通常在增强、软件更新等之后进行。\n\
    * **验证 (Validation)**：验证测试用于验证在更新或部署软件后，更改是否按照要求执行的。\n\n## 问题\n* 什么是单元测试？\n* 什么是集成测试？\n\
    * 什么是回归测试？\n* 集成测试和回归测试有什么区别？\n* 什么是验证测试？\n\n# 测试私有成员 (Testing Private Members)\n\
    \n私有成员可以使用反射进行测试，但建议仅在测试遗留代码时这样做。\n\n### 使用\n以下代码演示了使用反射访问 `Account` 的私有字段。\n\n\
    ```java\npublic class Account {\n    private float rate = 10.5f;\n}\n\n@Test\n\
    public void testConcatenate() throws \n    IllegalAccessException, \n    NoSuchFieldException\
    \ {\n    Account account = new Account();\n    Class<? extends Account> refClass\
    \ = account.getClass();\n    Field field = refClass.getDeclaredField(\"rate\"\
    );\n    field.setAccessible(true);\n    assertEquals(10.5f, field.get(account));\n\
    }\n```\n\n如所述，不建议使用反射访问私有字段；我们有以下其他测试私有方法的方法：\n* 通过公共方法进行测试。\n* 如果可能，更改字段的访问修饰符。\n\
    * 修改类设计。\n\n## 问题\n* 测试私有成员的不同方法有哪些？\n* 你可以使用 `Reflection`（反射）测试私有成员吗？\n* 为什么不应该使用反射测试私有成员？\n\
    * 测试私有成员的各种方法有哪些？\n\n"
