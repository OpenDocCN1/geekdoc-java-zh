  trans: "\n\n`String capitalObj = new String ( \"London\" );`![](img/Image00008.jpg)而在下方的示例中，两个字符串字面量引用了内存池中的同一个对象。`String\
    \ cityName = \"London\" ;`\n\n`String capital = \"London\" ;`![](img/Image00009.jpg)问题：\n\
    \n* 解释字符串池（String Pool）内存管理？\n* 字符串字面量是如何存储在内存中的？\n* 字符串池是如何针对内存优化的？\n* 字符串对象（String\
    \ Objects）是如何存储在内存中的？\n* 为什么 Java 不能使用类似字符串池的机制来存储其他类型的数据对象？\n\n## 不变性 - 安全问题\n\
    \n垃圾回收器（Garbage Collector;\nfield .setAccessible( true );\nchar [] value = ( char\
    \ []) field .get( accountNo );\n// 重写内容\nvalue [ 0 ] = 'X' ;\nvalue [ 1 ] = 'Y'\
    \ ;\nvalue [ 2 ] = 'Z' ;\n// 输出 \"XYZ123\"\nSystem . out .println( accountNo );\n\
    ```\n\n问题：\n\n* 你可以重写 `String` 类来修改其不变性吗？\n* 绕过字符串的不变性是否？\n* 是否建议使用反射绕过字符串的不变性？为什么？\n\
    \n## StringBuilder vs StringBuffer\n\n### 相同点\n\n* `StringBuilder` 和 `StringBuffer`\
    \ 对象都是可变的，因此允许字符串值发生变化。\n* 这两个类的对象都在堆内存中被创建并存储。\n* 这两个类具有相似的方法。\n\n### 不同点\n\n\
    * `StringBuffer` 的方法是同步的，因此它是线程安全的，而 `StringBuilder` 则。\n* `StringBuilder` 的性能显著优于\
    \ `StringBuffer`，因为 `StringBuilder` 没有同步开销。\n\n注意：如果你需要在线程之间共享字符串对象，请使用 `StringBuffer`，否则使用\
    \ `StringBuilder`。问题：\n\n* `StringBuffer` 和 `StringBuilder` 之间有什么相同点和区别？\n* 在什么情况下你会倾向于使用\
    \ `StringBuffer` 而不是 `StringBuilder`？\n* 在单线程应用中，`StringBuffer` 和 `StringBuilder`\
    \ 之间你倾向于使用哪一个？\n\n## Unicode\n\nUnicode 是一种国际标准字符编码系统，代表了世界上大多数的书写语言。在 `Unicode`\
    \ 之前，存在多种流行的编码系统：`ASCII`、`KOI8`、`ISO 8859` 等，每种编码系统都有自己的代码值和字符集，且长度各不相同。为了解决这个问题，创建了一个统一的标准，被称为\
    \ `Unicode`。Unicode 为每个字符提供了独立平台和语言的唯一数字。问题：\n\n* 什么是 Unicode 字符？\n* 使用 Unicode\
    \ 字符有什么优势？\n* 在 Unicode 之前占据主导地位的编码系统存在什么问题？\n\n## 内部类\n\n`Inner Class`（内部类）是另一个类中的类。\n\
    `Outer Class`（外部类）包含内部类的类。\n\n注意：\n\n* 编译器为每个内部类生成一个独立的类文件。\n\n### 内部类的优点\n\n\
    * 使用内部类很容易实现回调函数。\n* 内部类可以访问外部类的私有成员，而这些成员是继承类也无法访问的。\n* 内部类有助于强制闭包（closures），使得外部实例和周围的作用域可用。\n\
    * 外部类为内部类提供了额外的命名空间。\n\n问题：\n\n* 什么是内部类？\n* 什么是外部类？\n* 定义内部类的优点是什么？\n* 什么是闭包？如何使用内部类来创建闭包？\n\
    * 什么是回调？如何使用内部类来创建回调？\n* 内部类可以访问外部外部类的私有成员吗？\n* 外部类带来了什么好处？\n\n## 静态成员嵌套类\n\n\
    * 静态嵌套类像其他其他成员一样，在类内部声明为 `static`。\n* 静态嵌套类是独立的，与外部类没有关系。它通常用于与外部类组合在一起。\n* 它可以被声明为\
    \ `public`、`private`、`protected` 或包级权限。\n\n静态嵌套类的声明：\n```java\n// 外部类\npublic\
    \ class Building {\n    // 静态成员内部类\n    public static class Block{\n}\n```\n创建静态嵌套类的对象：\n\
    ```java\n// 静态类实例\nBuilding.Block block = new Building();\n```\n问题：\n\n* 什么是静态嵌套类？\n\
    * 静态类无论是嵌套还是外部都是相同的；那么定义内部类的好处是什么？\n\n### 内部类\n\n* 局部类声明在方法内部。\n* 它不能声明为 `public`、`private`\
    \ 或包级权限。\n\n```java\n// 外部类\npublic class CityNames {\n    private List <String>\
    \ cityNames = new ArrayList<>();\n    Iterator <String> nameIterator(){\n    \
    \    // 局部类\n        class NameIterator implements Iterator <String> {\n     \
    \       @Override\n            public boolean hasNext() {\n                return\
    \ false;\n            }\n            @Override\n            public String next()\
    \ {\n                return null;\n            }\n        }\n        // 返回局部类的实例\n\
    \        return new NameIterator();\n    }\n}\n```\n注意：\n\n* 为了在外部使用内部类，局部类必须实现一个公共接口或继承公共类并重写方法。\n\
    \n问题：\n\n* 内部类和局部类有什么区别？\n* 为什么局部类不能使用访问修饰符？\n* 定义局部类的规则是什么？\n* 局部类解决了什么问题？\n\n\
    ### 非静态嵌套类\n\n* 非静态嵌套类像其他成员一样在类内部声明。\n* 它可以被声明为 `public`、`private`、`protected`\
    \ 或包级权限。\n* 非静态嵌套类是闭包，因为它们可以访问外部实例。\n* 创建非静态内部类的对象需要一个外部类的对象。\n\n非静态嵌套类的声明：\n\
    ```java\n// 外部类\npublic class Building {\n    // 非静态成员内部类\n    public class Block{}\n\
    }\n```\n创建非静态嵌套类的对象：\n```java\n// 外部类的实例\nBuilding building = new Building();\n\
    // 非静态成员内部类的实例\nBuilding.Block block = building . new Block();\n```\n问题：\n\n*\
    \ 什么是非静态嵌套类？\n* 为什么非静态嵌套类可以被当作闭包？\n\n"
- fmt: "\n# Can you create an instance of a non-static inner class without defining\
    \ an outer class?\n\n## Anonymous Inner Class\n\n- Anonymous inner class does\
    \ not have a name.\n- The anonymous inner class is defined and its object is created\
    \ at the same time.\n- Anonymous inner class is always created using `new` operator\
    \ as part of an expression.\n- To create an Anonymous class, a `new` operator\
    \ is followed by an existing interface or class name.\n- The anonymous class either\
    \ implements the interface or inherits from an existing class.\n\n### Creation\
    \ of anonymous inner class // outer class\n\n```java\npublic class CityNames {\n\
    \    private List<String> cityNames = new ArrayList<>();\n\n    public Iterator<String>\
    \ nameIterator() {\n        // Anonymous inner class\n        Iterator<String>\
    \ nameIterator = new Iterator<String>() {\n            @Override\n           \
    \ public boolean hasNext() {\n                return false;\n            }\n \
    \           @Override\n            public String next() {\n                return\
    \ null;\n            }\n        };\n        // return an instance of a local inner\
    \ class.\n        return nameIterator();\n    }\n}\n```\n\n### Notes\n- Do not\
    \ return inner classes as it has reference to the outer enclosing class, otherwise\
    \ memory leaks may occur.\n- Use anonymous class when you want to prevent anyone\
    \ from using the class anywhere else.\n- Serialization of Anonymous and Inner\
    \ classes must be avoided, as there could be compatibility issues during de-serialization,\
    \ due to different JRE implementation.\n\n### Questions\n- What is an anonymous\
    \ inner class?\n- How an anonymous inner class is different from the local inner\
    \ class?\n- Why you shouldn't return an inner class object from a method?\n- If\
    \ you want to prevent anyone from using your class outside, which type of inner\
    \ class you should define?\n- Why should you avoid serialization of anonymous\
    \ and inner classes?\n\n# FUNCTIONAL PROGRAMMING\n\n## Functional Interface\n\
    Functional Interface is an interface with only one abstract method but can have\
    \ any number of default methods.\n\n`@FunctionalInterface`\n\n```java\npublic\
    \ interface Greator<T> {\n    public T greater(T arg1, T args2);\n}\n```\n\nAnnotation\
    \ `@FunctionalInterface` generates a compiler warning when the interface is not\
    \ a valid functional interface.\n\n```java\n@FunctionalInterface\npublic interface\
    \ Greator<T> {\n    public T greater(T arg1, T args2);\n}\n```\n\nAccount class,\
    \ defined below, used as an argument to the functional interface `Greater`.\n\n\
    ```java\npublic class Account {\n    private int balance;\n\n    public Account(int\
    \ balance) {\n        this.balance = balance;\n    }\n\n    public int getBalance()\
    \ {\n        return balance;\n    }\n\n    @Override\n    public String toString()\
    \ {\n        return \"Account{\" + \"balance=\" + balance + \"}\";\n    }\n}\n\
    ```\n\nThe code below demonstrates the usage of Lambda expression to find the\
    \ account with the greater balance. Similarly, the same Function Interface, `Greater`,\
    \ can be used to compare other similar business objects too.\n\n```java\npublic\
    \ static void main(String[] args) {\n    Greator<Account> accountComparer = (Account\
    \ acc1, Account acc2) ->\n        acc1.getBalance() > acc2.getBalance() ? acc1\
    \ : acc2;\n\n    Account account1 = new Account(6);\n    Account account2 = new\
    \ Account(4);\n    System.out.println(\"Account with greater balance: \" + accountComparer.greater(account2,\
    \ account1));\n}\n```\n\n### Questions\n- What is Function Interface?\n- What\
    \ are the benefits of using Functional Interface?\nJava also provides a set of\
    \ predefined functional interfaces for most scenarios.\n\n## Lambda Expression\n\
    Lambda expressions provide a convenient way to create anonymous class implement\
    \ Functional Interface more compactly. Lambda Expressions are primarily useful\
    \ where you want to pass some functionality as an argument to another method and\
    \ defer the execution of such functionality until an appropriate time.\n\nLambda\
    \ expression can be just a block of statement with method body and optional parameter\
    \ types without method name or return type. It can be passed as a method and be\
    \ stored in a variable.\n\n```java\n// lambda expressions\n() -> 2\n(x,y) -> x\
    \ + y\n(Double x, Double y) -> x*y\n```\n\n### Questions\n- What is Lambda Expression?\n\
    - How are Lambda Expression and Anonymous class-related?\n- Can you pass Lambda\
    \ Expression as a method parameter?\n- What is the meaning of deferred execution\
    \ of functionality, using Lambda Expression?\n- What are the benefits of using\
    \ Lambda Expression?\n- How are Lambda Expression and Functional Interface related?\n\
    \n## Pure Functions\nPure functions are functions whose results depend only on\
    \ the arguments passed onto them and are neither influenced by any change of state\
    \ in the application nor altering the application state. Pure functions return\
    \ the same result for the same arguments.\n\n```java\npublic int increaseByFive(int\
    \ original) {\n    int toAdd = 5;\n    return original + toAdd;\n}\n```\n\n###\
    \ Questions\n- What is a Pure Function?\n- What is the use of Pure Function in\
    \ Functional Programming?\n- How is the Pure Function guaranteed to always return\
    \ the same results for the same arguments?\n\n## Fluent Interface\nA fluent interface\
    \ is used to transmit commands to subsequent calls, without the need to create\
    \ intermediate objects and is implemented by method chaining. The fluent interface\
    \ chain is terminated when a chained method returns `void`. Fluent interface improves\
    \ readability by reducing unnecessary objects.\n\nIn the code below, the Fluent\
    \ Interface is used to add a new `Employee`.\n\n```java\nemployee.create()\n \
    \   .atSite(\"London\")\n    .inDepartment(\"IT\")\n    .atPosition(\"Engineer\"\
    );\n```\n\nFluent interfaces are used primarily in scenarios where you construct\
    \ queries, create a series of objects, or construct nodes in hierarchical order.\n\
    \n### Questions\n- What is the Fluent Interface?\n- What are the benefits of defining\
    \ and using Fluent Interface?\n- Describe some usage of Fluent Interface?\n\n\
    # GENERICS\n\n## Generics\nGenerics is a mechanism that allows the same code to\
    \ work on objects of different types in a type, class or interface, or a method;\
    \ while providing compile-time protection. Generics are introduced to enforce\
    \ the safety of type, in particular for collection classes.\n\n- Once a parameter\
    \ type is defined in generics, the object will work with the defined type only.\n\
    - In generics, the formal type parameter (`E` in the case below) is specified\
    \ with the type (class or interface).\n\n```java\n// Generic List type\n// E is\
    \ type parameter\npublic interface List<E> {\n    void add(E x);\n    Iterator<E>\
    \ iterator();\n}\n```\n\n- In generics, the parameterized type (`Integer` in this\
    \ case) is specified when a variable of type is declared or the object of the\
    \ type is created.\n\n```java\n// variable of List type declared\n// With Integer\
    \ parameter type\nList<Integer> integerList = new ArrayList<Integer>();\n```\n\
    \n### Notes\n- There is a convention for naming parameters commonly used in Generics:\
    \ `E` for element, `T` for type, `K` for key, and `V` for values.\n- A generic\
    \ type is compiler support; all the type parameters are removed during the compilation\
    \ and this process is called `erasure`.\n- Due to strong type checking, generics\
    \ help avoid many `ClassCastException` instances.\n\n### Generic Class Example\n\
    - The following `NodeId` generic class definition can be used with the object\
    \ of any type.\n\n```java\n// NodeId generic class with type parameter\npublic\
    \ class NodeId<T> {\n    private final T Id;\n\n    public NodeId(T id) {\n  \
    \      this.Id = id;\n    }\n\n    public T getId() {\n        return Id;\n  \
    \  }\n}\n```\n"
