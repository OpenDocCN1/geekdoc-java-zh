    *   Placing an extremely large amount of text in the memory pool can lead to memory
    leak or performance issues.


    Note: Instead of using String object, prefer using a string literal so that the
    compiler can optimize it.Questions


    *   What is String interning?


    *   Can String Objects also be interned?


    *   What happens when you store a new String literal value that is already present
    in the string pool?


    *   What are the drawbacks of creating a large number of String literals?


    *   Which one is preferred: String Object or String Literal? Why?


    String Pool Memory ManagementThe String pool is a special area in memory managed
    by the Java compiler for String memory optimization. If there is already a String
    literal present in the string pool, compiler refers the new String literal reference
    to an existing String variable in the pool, instead of creating a new literal.
    Java compiler can perform this optimization because String is immutable.In this
    example below, both the String objects are different and are stored into [Heap](#text00143.html_a416)
    .String cityNameObj = new String( "London" );'
