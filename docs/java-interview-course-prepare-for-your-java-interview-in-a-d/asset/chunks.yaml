  trans: "\n\n# 问题\n\n- 在 `Runnable` 和 `Thread` 之间哪种是优方法？\n- 实现 `Runnable` 会创建线程吗？\n\
    - `Thread` 类和 `Runnable` 接口都有 `run` 方法，它们的区别是什么？\n\n## Runnable vs Callable 接口\n\
    \n### Runnable 接口\n```java\n@FunctionalInterface\npublic interface Runnable {\n\
    \    public abstract void run();\n}\n```\n\n### Callable 接口\n```java\n@FunctionalInterface\n\
    public interface Callable<V > {\n    V call() throws Exception ;\n}\n```\n\n-\
    \ `Runnable` 不能返回结果且不能抛出检查异常。\n- `Callable` 需要实现 `call()` 方法，而 `Runnable` 需要实现\
    \ `run()` 方法。\n- `Callable` 可以配合 `ExecutorService` 方法使用，但 `Runnable` 不行。\n\n###\
    \ 问题\n- `Callable` 和 `Runnable` 接口之间的区别是什么？\n- 使用 `Runnable` 替 `Callable` 的好处是什么？\n\
    - 你可以从 `Runnable` 接口中抛出检查异常吗？\n- 为什么 `Runnable` 和 `Callable` 接口被称为函数式接口？\n- 哪个接口返回结果：`Runnable`\
    \ 还是 `Callable`？\n\n## 守护线程 (Daemon Thread)\n\n守护线程允许 JVM 随着程序退出。一旦 JVM 停止，所有守护线程都会退出，而不会回溯堆栈，也不会执行任何\
    \ `finally` 块。守护线程以非常低的优先级执行。\n\n线程会继承父线程的守护状态，这意味着任何由 `main` 线程创建的线程都是非守护线程。通常，守护线程用于支持应用程序的后台任务或服务。垃圾回收是在守护线程中进行的。\n\
    \n你可以像下面一样创建一个守护线程：\n\n```java\nThread thread = new Thread();\nthread .setDaemon(true\
    \ );\n```\n\n所有非守护线程被称为用户线程。这些线程会阻止 JVM 关闭。当没有更多用户线程时，进程终止。Java 的 `main` 线程始终是一个用户线程。\n\
    \n### 问题\n- 什么是守护线程？\n- 什么是用户线程？`main` 线程是什么？\n- 如果守护线程仍在运行，程序可以退出吗？\n- 如果用户线程仍在运行，程序可以退出吗？\n\
    - 当 JVM 停止并退出所有守护线程时，守护线程上的 `finally` 块还有机会执行吗？\n- 当创建一个新线程时，它是作为用户线程还是守护线程创建？\n\
    - 如果没有用户线程在运行但守护线程仍在运行，会发生什么？\n- Java 的 `main` 线程是用户线程还是守护线程？\n- 当你在 `main` 线程上创建一个新线程时，创建的是什么类型的线程：守护还是用户？\n\
    - 你可以使用守护线程做什么什么工作？\n\n## 竞态条件 (Race Condition) 和不可变对象 (Immutable Object)\n\n\
    当多个线程同时访问共享数据并对其修改时，就会产生竞态条件。由于这些线程读写数据的顺序无法预测，这可能导致不可预测的数据值。\n\n如果一个对象在构造后没有状态改变的可能性，则它被认为是不可变的。如果一个对象是不可变的，它可以在多个线程之间共享，而不必担心竞态条件。\n\
    \n### 如何使对象不可变\n- 将类声明为 `final`。\n- 只允许通过构造函数创建对象。不要提供字段的 setter 方法。\n- 将所有字段标记为\
    \ `private`。\n\n### 问题\n- 不可变对象如何帮助防止竞态条件？\n- 为什么竞态能够产生不可预测的结果？\n- 为什么不可变对象在多线程环境中被认为是安全的？\n\
    - 为什么建议将不可变类声明为 `final`？\n- 为什么构造函数应该是构造不可变对象的唯一方式？如果提供了 setter 方法会发生什么？\n\n##\
    \ 线程池 (Thread Pool)\n\n线程池是一组工作线程，它们独立存在于 `Runnable` 和 `Callable` 任务之外。固定线程池减少了线程创建的开销。当请求激增超过其处理能力时，它帮助应用程序进行优雅的降级，防止应用程序进入挂起或崩溃状态。\n\
    \n线程池还通过解耦任务的创建与执行实现了松耦合设计。借助 `Executors` 类可以轻松地创建固定线程池，你可以使用 `newFixedThreadPool()`\
    \ 工厂方法创建 `ExecutorService` 来执行任务。\n\n### 问题\n- 什么是线程池？\n- 线程池如何减少线程创建的开销？\n- 线程池如何帮助防止应用程序挂起或崩溃？\n\
    - 什么是固定线程池，它是如何创建？\n- 线程池如何实现松耦合设计？\n\n## 同步 (SYNCHRONIZATION)\n\n### 并发 (Concurrent)\
    \ vs 并行 (Parallel) vs 异步 (Asynchronous)\n\n并行处理是在多个核心上同时执行相同的任务。并发处理是同时执行多个任务；这些任务可以在多个核心上执行，也可以通过处理器上的抢占式时间分片线程执行。\n\
    \n异步处理是进程的独立执行，不需要等待中间操作的返回值。\n\n### 问题\n- 解释并发处理？\n- 解释并行处理？\n- 解释异步处理？\n- 解释并发处理与并行处理之间的区别？\n\
    - 并行处理需要多个线程吗？\n- 在什么情况下应用程序是并发而非行的？\n    - 当应用程序同时处理多个操作，而不将这些操作进一步分为更小的任务时。\n\
    - 在什么情况下应用程序是并行但不并发的？\n    - 当应用程序处理一个操作并将该操作分成更小的任务并并行处理时。\n- 在什么情况下应用程序既不是并发也不是行的？\n\
    \    - 当应用程序只处理一个操作，而不将该操作分为更小的任务时。\n- 在什么情况下应用程序既是并发又是行的？\n    - 当应用程序同时处理多个操作，并将这些操作进一步分为并行处理的小任务时。\n\
    \n## 线程同步\n\n当多个线程访问共享数据进行修改时，就会发生竞态条件。由于无法预测这些线程读写数据的顺序，可能会导致不可预测的数据值。\n\n临界区是指如果被多个线程并发访问可能会对结果产生不良影响的代码块。线程同步是对临界区的控制，以防止程序的不良影响。同步建立了一个被称为“发生在前”（happen-before）的缓冲区，确保随后获取相同本地对象的线程可以访问该线程对本地对象的所有更改。\n\
    \n### 问题\n- 解释多线程中的竞态条件？\n- 什么是临界区？\n- 什么是线程同步？\n- 什么是内存屏障？\n- 线程同步中的发生在前概念是什么？\n\
    \n## 同步方法与同步块\n\n`synchronized` 关键字用于标记代码中的临界区。互斥同步通过使用 `synchronized` 关键字锁定临界区来实现。这可以通过两种方式实现。\n\
    \n### 将方法标记为临界区\n```java\nclass DatabaseWrapper {\n    Object reference = new\
    \ Object();\n    // 标记为临界区的方法\n    public synchronized void writeX() {\n     \
    \   // 代码在这里\n    }\n    // 标记为临界区的静态方法\n    public static synchronized void writeY()\
    \ {\n        // 代码在这里\n    }\n}\n```\n\n### 将代码块标记为临界区\n```java\npublic void writeToDatabase()\
    \ {\n    // 多个线程可以到达这里// 标记为临界区的代码\n    synchronized (this ) {\n        // 只有一个线程可以同时执行这里\n\
    \    }\n    // 多个线程可以执行这里\n}\n```\n\n"
- fmt: "\n- Minimize the scope of locking to just a critical section. This will improve\
    \ overall performance and minimize chances for encountering a race condition.\n\
    - Prefer `synchronized` block over `synchronized` method, as block locks only\
    \ on a local object as opposed to an entire class object.\n- From within `synchronized`,\
    \ never call a method provided by the client code or the one that is designed\
    \ for inheritance.\n\n## Questions\n- How is the `synchronized` keyword used?\n\
    - What is the difference between `synchronized` methods and `synchronized` block?\n\
    - Why is `synchronized` block preferred to `synchronized` method?\n- Does the\
    \ `synchronized` method lock the entire object?\n- What happens if you call a\
    \ method supported by the client from within a `synchronized` block or process?\n\
    \n## Conditional Synchronization\nConditional synchronization is achieved using\
    \ conditional variable along with `wait()` and `notify()` or `notifyAll()` methods.\n\
    \n```java\npublic void operation() throws InterruptedException {\n    synchronized\
    \ (reference) {\n        if (condition1) {\n            // wait for notification\n\
    \            reference.wait();\n        }\n        if (condition2) {\n       \
    \     // Notify all waiting threads\n            reference.notifyAll();\n    \
    \    }\n    }\n}\n```\n\n1. There are two methods to signal the waiting thread(s).\n\
    \    - `notify()` - signals only one random thread.\n    - `notifyAll()` - signals\
    \ all threads in a wait state.\n2. The `wait()` method has an overload to pass\
    \ timeout duration too, `wait(long timeout)`.\n3. Between `notify()` and `notifyAll()`\
    \ method, prefer using `notifyAll()` as it notifies all the waiting threads.\n\
    4. The `notify()` method wakes a single thread, and if multiple threads are waiting\
    \ to be notified, then the choice of thread is arbitrary.\n\n## Questions\n- What\
    \ is conditional synchronization?\n- What is the purpose of the `wait` call?\n\
    - What is the difference between `notify` and `notifyAll` method?\n- With multiple\
    \ threads waiting for the notification which one will be notified when you call\
    \ `notify`?\n- Which one should you prefer between `notify` and `notifyAll`? Why?\n\
    \n## Volatile\nIn a multi-threaded application, every thread maintains a copy\
    \ of the variable from the main memory to its CPU cache. So any change made by\
    \ a thread to the variable in its CPU cache will not be visible to other threads.\
    \ A field marked `volatile` is stored and read directly from the main memory.\
    \ As `volatile` fields are stored in main memory, all the threads have visibility\
    \ to the most updated copy of the volatile field's value, irrespective of the\
    \ thread modified it.\n\nConsider a class `Ledger`, which has a member `currentIndex`\
    \ to keep track of the number of entries made. In a multi-threaded environment,\
    \ each thread will increment `currentIndex` value independently.\n\n```java\n\
    public class Ledger {\n    public int currentIndex = 0;\n}\n```\n\nIf we mark\
    \ `currentIndex` as `volatile`, then each thread will use its value from the main\
    \ memory and will not create a copy of it.\n\n```java\npublic class Ledger {\n\
    \    public volatile int currentIndex = 0;\n}\n```\n![](Image00013.jpg)\n\n##\
    \ Questions\n- What is a `volatile` variable?\n- Explain the problem that `volatile`\
    \ field solves?\n- Where are the `volatile` variables stored?\n\n## static vs\
    \ volatile vs synchronized\n\n### static Variable\nThe `static` variables are\
    \ used in the context of class objects where there in only one copy of a static\
    \ variable exists, regardless of how many objects of the class are created. But\
    \ if multiple threads are accessing the same variable, each thread will make a\
    \ copy of that variable in its CPU cache and change made by a thread will not\
    \ be visible to other threads.\n\n### volatile Variable\n`volatile` variables\
    \ are used in the context of threads, where only one variable exists regardless\
    \ of how many threads or objects accessing it and everyone always gets the most\
    \ recently updated value. `volatile` forces all the reads and writes to happen\
    \ directly in the main memory and not in CPU caches.\n\n### synchronized\nBoth\
    \ `static` and `volatile` are field modifiers dealing with memory visibility related\
    \ to variables; whereas, `synchronized` deals with controlling access to a critical\
    \ section in code using a monitor, thus preventing concurrent access to a section\
    \ of code.\n\n## Questions\n- What are the `static` variables?\n- All the objects\
    \ of a class share `static` variables. But in a multi-threaded environment; why\
    \ a change made by one object to the static variable is not visible to an object\
    \ on another thread?\n- If both `static` and `volatile` variables are shared between\
    \ objects, then what's the problem a `volatile` variable solves?\n- How are `volatile`\
    \ and `static` variables different from the `synchronized`, since even the `synchronized`\
    \ monitor guards memory objects too?\n\n## ThreadLocal Storage\nEach thread has\
    \ a private memory called `thread-local storage`, which can be used to store thread's\
    \ current operation-related data. Usually, the `ThreadLocal` variables are implemented\
    \ as private static fields and are used to store information like Transaction\
    \ Identifier, User Identifiers, etc.\n\n### ThreadLocal declaration\n```java\n\
    ThreadLocal<String> threadLocal = new ThreadLocal<String>();\n```\n\n### Setting\
    \ thread local value\n```java\nthreadLocal.set(\"value\");\n```\n\n### Getting\
    \ thread-local value\n```java\nString accountId = threadLocal.get();\n```\n- `ThreadLocal`\
    \ objects are contained within a thread.\n- `ThreadLocal` existence is linked\
    \ to the thread for which it was created.\n- To prevent leak, it's a good practice\
    \ to `remove()`.\n```java\nthreadLocal.remove();\n```\n\n## Questions\n- What\
    \ is thread-local storage?\n- What are the things you store in `ThreadLocal`?\n\
    - Why shouldn’t you synchronize the access to `ThreadLocal`?\n- Why should you\
    \ remove `ThreadLocal`?\n\n## wait() vs sleep()\n\n### Conditional Synchronization\
    \ with `wait()`\n```java\npublic void waitFor(int timeInMs) throws InterruptedException\
    \ {\n    synchronized (reference) {\n        if (condition1) {\n            //\
    \ wait for notification\n            reference.wait(timeInMs);\n        }\n  \
    \  }\n}\n```\n\n### sleep() for a specified interval\n```java\npublic void sleepFor(int\
    \ timeInMs) throws InterruptedException {\n    //Pause for timeInMs\n    Thread.sleep(timeInMs);\n\
    \    //Print a message\n    print(\"Slept for :\" + timeInMs + \"ms.\");\n}\n\
    ```\n- The `wait` method is called on the object's monitor; whereas `sleep` is\
    \ called on a thread.\n- Waiting objects can be notified; whereas, a sleeping\
    \ thread cannot.\n- A sleeping thread cannot release a lock; whereas, awaiting\
    \ object can.\n- To wake a sleeping thread you need a reference of it, which is\
    \ not needed for a waiting object.\n\n## Questions\n- What is the difference between\
    \ `wait` and `sleep`?\n- Why it's possible to notify the waiting object but not\
    \ the sleeping?\n- As you need handle to a sleeping thread to wake it; do you\
    \ need direct access to a waiting object too? Why?\n- What is the mechanism to\
    \ signal an object to come out of `wait`?\n\n## Joining Threads\nThreads are usually\
    \ joined when there is a dependency between the threads. The `join()` method of\
    \ the target thread is used to suspend the current thread. In such situations\
    \ a current thread cannot proceed, until the target thread on which it depends\
    \ on, has finished execution.\n\n```java\n// main thread joined with the thread\n\
    public void main(String[] args) {\n    Thread thread1 = new Thread(ThreadMethodRef::threadMethod);\n\
    \    thread1.start();\n    // current thread waits until thread1 completes execution\n\
    \    thread1.join();\n}\n\n\n## Questions\n- What is the purpose of the thread's\
    \ `join` method?\n- Why do you need to join two threads?\n"
