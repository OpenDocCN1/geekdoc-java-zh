  trans: "\n\n* 通常的子类（SuperType –SubType）规则不适用于泛型。在这个示例中，尽管 `Integer` 派自 `Object`，但类型参数为\
    \ `Integer` 的 `NodeId` 仍然无法赋值类型参数为 `Object` 的 `NodeId`。\n\n```java\n// Parameter\
    \ Type - Object\nNodeId<Object> objectNodeId = new NodeId<>( new Object());\n\n\
    // Parameter Type - Integer\nNodeId<Integer> integerNodeId = new NodeId<>( 1 );\n\
    \n// 这会导致错误\nobjectNodeId = integerNodeId; ( error )\n```\n\n## 类型通配符\n\n* 泛型中的通配符以\
    \ `?` 的形式表示。例如，接受 `List<?>` 作为参数的方法将接受任何类型的 `List` 作为参数。\n\n```java\npublic void\
    \ addVehicles( List <?> vehicles) {\n    //...\n}\n```\n\n* 设置可选的上界和下界以实施限制，因为通过通配符定义的参数确切形式是未。\n\
    \n```java\n// 只能添加类型为 Truck 的车辆\npublic void addVehicles( List <? extends Truck>\
    \ vehicles) {\n    //...\n}\n```\n\n### Notes\n* 不要在一个返回类型中返回通配符，因为知道方法返回了什么总是更安全的。\n\
    \n## 上界 (Upper Bound)\n\n* 为了实施限制，可以在类型参数上设置上界。上界限制方法仅接受仅派自指定数据类型的未知类型参数，例如在下面示例中的\
    \ `Number`。\n\n```java\n// 类型通配符的上界\npublic void addIds( List <? extends Number>\
    \ T)\n```\n\n## 下界 (Lower Bound)\n\n* 为了实施限制，可以在类型参数上设置下界。下界限制方法仅接受是指定数据类型的父类的未知类型参数，例如下面示例中的\
    \ `Float`。\n\n```java\n// 类型通配符的下界\npublic void addIds( List <? super Float> T)\n\
    ```\n\n## 类型推断 (Type Inference)\n\n* 类型推断是编译器查看方法调用和声明以推断类型参数的能力。\n* 在泛型（`Generics`）中，菱操作符\
    \ `<>` 的操作符方便了类型推断。\n\n```java\n// 使用菱操作符进行类型推断\nList <Integer> integerList =\
    \ new ArrayList<>();\n```\n\n### Questions\n* 泛型中的类型通配符是什么？\n* 解释上界类型通配符？\n* 解释下界类型通配符？\n\
    * 泛型中不同类型的通配符是如何使用的？\n* 泛型的自动类型推断是什么？泛型中的菱操作符是什么？\n\n## 泛型方法 (Generic Method)\n\
    \n* 泛型方法定义了自己的类型参数。\n\n```java\n// generic method\npublic < T > void addId ( T\
    \ id){\n```\n\n* 如果我们从上面的方法删除 `<T>`，我们将得到编译错误，因为它代表了泛型方法中类型参数的声明。\n* 泛型方法的类（`class`）或接口（`interface`）不需要是泛型的。\n\
    * 在调用泛型方法时，我们不需要显式地指定类型参数。\n\n### Notes\n* 优先使用泛型和参数化类/方法来强制编译时类型安全。\n* 使用边界类型参数来增加方法参数的灵活性，同时它也有助于限制可以使用的类型。\n\
    \n### Questions\n* 解释泛型方法？\n* 你可以在非泛型类型上添加泛型方法吗？\n* 将边界类型定义为方法参数的用处是什么？\n* 泛型是如何强制执行编译类型安全的？\n\
    \n## Java 泛型 vs Java 数组 (Array)\n\n### Java 泛型\n考虑以下层级结构，![](img/Image00010.jpg)\n\
    由于 `Car` 和 `Bike` 均派自 `Vehicle`，是否可以将 `List<Car>` 或 `List<Bike>` 赋值给 `List<Vehicle>`\
    \ 变量？\n\n不，`List<Car>` 或 `List<Bike>` 不能被 `List<Vehicle>` 替换，因为你不能在有 `cars` 的同一个列表中放入\
    \ `Bike`。所以尽管 `Bike` 是一个 `Vehicle`，但它不是一个 `Car`。\n\n```java\nList< Bike > bikes\
    \ = new ArrayList< Bike >();//假设这是允许的\nList< Vehicle > vehicles = bikes ;\nvehicles\
    \ .add( new Car ());// Error - Bike 和 Vehicle 被视为不兼容类型。\nBike bike = vehicles\
    \ .get( 0 );\n```\n\nJava 编译器在编译时对不兼容类型进行此类检查。更多信息请参阅 类型擦除。\n\n### Java 数组\n然而，与泛型不同，`Car`\
    \ 数组可以赋值给 `Vehicle` 数组：\n\n```java\nCar [] cars = new Car [ 3 ];\nVehicle [] vehicles\
    \ = cars ;\n```\n\n对于数组，尽管编译器允许上述代码编译，但当你运行这段代码时，你将得到 `ArrayStoreException`。\n\
    \n```java\n//这将导致 ArrayStoreException\nvehicles [ 0 ] = new Bike ();\n```\n\n\
    所以尽管编译器没有捕获此问题，运行时类型系统捕获了。数组是可具体化的类型（reifable types），这意味着运行时感知到其类型。\n\n### Questions\n\
    * 什么是可具体化的类型（reifable types）？\n* 为什么不能将子类的泛型集合对象赋值给父类的泛型集合对象？\n* 为什么允许将子类的数组对象赋值给父类的数组对象？Java\
    \ 数组更具多态吗？\n\n## 类型擦除 (Type Erasure)\n对于 Java 泛型类型，由于名为类型擦除的过程，Java 编译器会丢弃类型信息，并且它在运行时是不可用的。\n\
    \n### Questions\n* 什么是可具体化的类型（reifable types）？\n* 什么是类型擦除？\n* 如果没有类型擦除会发生什么？\n\
    \n## 协变 (Co-variance)\n协变是一种允许从带有上界通配符的泛型中读取项，但不能向其写入的概念。\n\n考虑以下带有上界通配符的声明：\n\
    \n```java\nList<? extends Vehicle > vehicles = new ArrayList<Bike >();\n```\n\n\
    从 `vehicles` 读取，因为列表中的任何内容都是 `Vehicle` 的子类并可以向上转型。\n\n```java\nVehicle vehicle\
    \ = vehicles .get(0 );\n```\n\n然而不允许向协变结构放入任何内容。\n\n```java\n// 编译错误\nvehicles\
    \ .add(new Bike ());\n```\n\n这是不允许的，因为 Java 无法保证泛型结构中的实际类型。它可以是任何扩展 `Vehicle`\
    \ 的类型，但编译器无法确定。所以可以读写。\n\n### Questions\n* 解释协变？\n* 为什么不能向带有上界通配符的泛型添加子类元素？\n\n\
    ## 逆变 (Contra-variance)\n逆变是一种允许向带有下界通配符的泛型写入项，但不能从中读取任何内容的概念。\n\n考虑以下带有下界通配符的声明：\n\
    \n```java\nList<? super Car > cars = new ArrayList<Vehicle >();\n```\n\n在这种情况下，尽管\
    \ `ArrayList` 的类型是 `Vehicle`，你也可以通过逆变向其添加 `Car`；因为 `Car` 派自 `Vehicle`。\n\n```java\n\
    cars .add(new Car ());\n```\n\n然而，你不能假设你会从这个逆变结构中获得 `Car` 对象。\n\n```java\n// 编译错误\n\
    Car vehicle = cars .get( 0 );\n```\n\n* 解释逆变？\n* 为什么不能从带有下界通配符的泛型读取元素？\n\n## 协变\
    \ vs 逆变\n* 当你只想从集合中读取泛型值时，使用协变。\n* 当你只想向集合中添加泛型值时，使用逆变。\n* 当你打算同时对集合进行读取和写入操作时，使用特定的泛型类型。\n\
    \n### Questions\n* 什么时候应该使用协变？\n* 什么时候应该使用逆变？\n\n"
