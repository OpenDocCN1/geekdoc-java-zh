  trans: "\n\n# 访问修饰符\n\n访问修饰符决定了其他类是否可以访问变量或调用方法。在类级别，你可以使用 `public` 修饰符或不使用修饰符。对于类成员，你可以使用以下访问修饰符之一：\n\
    \n- `private`: 外部类无法访问该成员。\n- `protected`: 子类可以访问该成员。\n- `public`: 中所有的类都可以访问该成员。\n\
    - `无修饰符`: 包内的所有类都可以访问此成员。\n\n重写方法中的访问修饰符应该与被重写的方法相同或限制更。可选的 `static` 和 `final`\
    \ 关键字经常与访问修饰符配合使用。\n\n### 问题\n\n* 访问修饰符目的是什么？\n* 类访问修饰符列表与成员访问修饰符列表是否存在区别？\n*\
    \ `private`、`protected` 和 `public` 访问修饰符的作用范围是什么？\n* 当类没有指定访问修饰符时会发生什么？\n* 如果子类位于不同的包中，它仍然能看到父类的\
    \ `protected` 成员吗？\n* 为什么派生类中的成员访问修饰符应该比基类的限制更少？\n    * 根据继承的概念，你应该能够使用父类引用使用子类对象。如果子类成员使用了具有更限制性的访问修饰符进行降级，这将是不可能的。\n\
    * 决定类访问访问修饰符的标准应该是什么？\n    * 你应该使用限制性最强的访问修饰符以确保安全性并防止任何误用。\n\n# static\n\n###\
    \ static 类\n只有嵌套/内部类可以被定义为 `static`，而外部类不能。\n\n### static 变量和方法\n当对变量和方法使用 `static`\
    \ 关键字时，它表示这些成员属于类，并且这些成员被类的所有对象共享。静态成员没有副本，并且仅存储在内存的单一位置。这些成员应该通过类名进行访问。\n\n`static`\
    \ 方法无法访问实例方法或属性，因为静态成员属于类，而不是类的实例。\n\n### 问题\n\n* 什么是 `static` 类？\n* 任何类都可以声明为\
    \ `static` 类吗？\n* 什么是 `static` 方法？\n* 什么是 `static` 变量？\n* 谁拥有 `static` 类成员？这与非静态类有何不同？\n\
    * 你应该如何访问 `static` 的类成员？\n* `static` 方法可以访问实例成员吗？为什么？\n\n# final\n\n### final\
    \ 类 A\n`final` 类不能被扩展，这使得类既安全又高效。\n\n### final 方法 A\n`final` 方法不能被重写，这防止了向类中引入任何意外行为的可能性。\n\
    \n### final 变量 A\n`final` 变量引用不能更改，但 `final` 变量引用的 `mutable object` 的内容是可以更改的。\n\
    \n### 空 final 变量\n一个在声明处未初始化的变量。\n\n#### 注意事项\n\n* 空 final 变量需要在类的构造函数中进行初始化。\n\
    * `final` 变量类似于不可变变量，因此与 `final` 变量相关的计算可以被缓存以优化。\n\n### 问题\n\n* 解释 `final` 类？\n\
    * 声明一个类为 `final` 有什么好处？\n* 解释 `final` 方法？\n* 声明一个方法为 `final` 有什么好处？\n* 解释 `final`\
    \ 变量？\n* 声明一个变量为 `final` 有什么好处？\n* 当你声明一个变量为 `final` 时，你可以更改它引用的对象的内容吗？\n* 当你声明一个变量为\
    \ `final` 时，你可以将其引用另一个对象吗？\n* 什么是空 final 变量？\n* 将变量声明为 `final` 如何有助于优化？\n\n# static\
    \ 初始化块\n\n* `static` 初始化块通常用于确保在类的任何对象使用之前，所有需要的类资源（如驱动程序、连接字符串等）都是可用的。\n* `static`\
    \ 块无法访问实例成员。\n* `static` 块对一个类只被调用一次。\n* 类可以定义任意数量的初始化块，它们按照它们在类中的定义顺序被调用。\n*\
    \ 你只能从 `static` 块中抛出未检查的异常。\n\n在这个代码示例中，静态初始化块为类创建一次连接字符串。\n\n```java\nprivate\
    \ static String connectionString;\n\nstatic {\n    connectionString = getConnectionSting();\n\
    }\n```\n\n### 问题\n\n* 什么是静态初始化块？\n* 静态初始化块的主要目的是什么？在 `static` 块中你应该做哪些类型的事情？\n\
    * 你能从静态初始化块访问实例成员吗？为什么？\n* 每当创建类的实例时，静态初始化块都会被调用吗？\n* 一个类中可以定义多少个 `static` 块？\n\
    * 当定义多个 `static` 块时，关于它们的执行顺序的标准是什么？\n* 你能从静态初始化块抛出异常吗？什么类型？\n\n# finally\n\n\
    `finally` 块的主要目的是确保在执行完 `try` 块中的操作后，应用程序恢复到一致状态。在 `finally` 块中，通常可以关闭流和数据库连接等资源以防止泄漏。\n\
    \n```java\nInputStream is = null;\n\ntry {\n    is = new FileInputStream(\"input.txt\"\
    );\n} finally {\n    if (is != null) {\n        is.close();\n    }\n}\n```\n\n\
    ### finally 块执行\n编译器会尽全力执行 `finally` 块，以下情况除外：\n\n* 调用了 `System.exit()`。\n* 当前线程被中断。\n\
    * JVM 崩溃。\n\n### 从 finally 返回\n你永远不要从 `finally` 块返回。如果 `finally` 块中存在 `return`\
    \ 语句，它将立即返回。\n\n### 问题\n\n* 你如何保证某段代码始终执行？\n* 在 `finally` 块中你应该做什么？\n* 在 `catch`\
    \ 块中你应该做什么？\n* `finally` 块总是执行吗？在什么情况下 `finally` 块不执行？\n* 你应该从 finally 返回吗？为什么？\n\
    \n# finalize()\n\n当 `垃圾 Collector` 确定没有对象的引用时，它会在从内存移除该对象之前调用该对象的 `finalize()`\
    \ 方法。\n\n如果对象没有进入垃圾收集范围，或者 JVM 在垃圾收集有机会运行之前停止，`finalize()` 方法将不会被调用。\n\n可以重写 `finalize()`\
    \ 方法来释放如文件句柄、数据库连接等资源；但你不能依赖 `finalize()` 来这样做，而应该显式地释放此类资源。\n\n无法保证 JVM 会调用 `finalize()`，因此你应该将\
    \ `finalize()` 视为释放资源的备用机制。尽可能地使用 `try-with-resource` 结构在资源使用完成后自动释放它们。\n\n如果\
    \ `finalize()` 方法抛出未捕获的异常，该异常将在终止终结化之前被忽略。\n\n### 问题\n\n* Java 中的 `finalize()`\
    \ 方法是什么？\n* `finalize()` 方法在什么时候被调用？\n* 谁调用 `finalize()` 方法？\n* `finalize()` 方法中可以做哪些事情？\n\
    * 你应该显式调用 `finalize()` 方法来释放资源吗？为什么？\n* 还有哪些替代机制可以用于释放系统资源？\n* 如果从 `finalize()`\
    \ 方法抛出一个未处理的异常会发生什么？\n\n"
- fmt: "\n# Widening vs Narrowing Conversions\n\n## Widening Conversions\nWidening\
    \ conversions deals with assigning an object of sub-class (derived class) to an\
    \ object of super-class (base class). In the example below, `Car` is derived from\
    \ `Vehicle`.\n\n```java\nCar car = new Car ();\nVehicle vehicle = car ;\n```\n\
    \n## Narrowing Conversions\nNarrowing conversions deals with assigning an object\
    \ of super-class (base class) to an object of sub-class (derived class). An explicit\
    \ cast is required for conversion. In the example below, `Bike` is derived from\
    \ `Vehicle`.\n\n```java\nVehicle vehicle = new Vehicle ();\nBike bike = ( Bike\
    \ ) vehicle ;\n```\n\n## Questions\n* What is widening conversion?\n* What is\
    \ narrowing conversion?\n* Is there any possibility of a loss of data in narrowing\
    \ conversion?\n\n# getters and setters\nThe following code demonstrates the usage\
    \ of getter and setter .\n\n```java\npublic class Person {\n    private String\
    \ name ;\n\n    public String getName() {\n        return StringUtils.capitalize(\
    \ name );\n    }\n\n    public void setName( String name) {\n        if (name.isEmpty()){\n\
    \            System.out.println( \"Name string is empty\" );\n            //throw\
    \ exception\n        }\n        this . name = name;\n    }\n}\n```\n\n## Benefits\
    \ of using getter and setter\n* Validations can be performed in the setter or\
    \ can be added later when required.\n* Value can have alternative representation,\
    \ based on internal (storage) or external (caller's) requirement.\n* It hides\
    \ the internal data structure used to store the value.\n* Internal fields can\
    \ be changed, without requiring changing any users of the code.\n* It encapsulates\
    \ the internal complexity while retrieving or calculating the value.\n* It provides\
    \ the ability to specify different access modifiers for getter and setter.\n*\
    \ It provides the ability to add debugging information.\n* It can be passed around\
    \ as Lambda expressions.\n* Many libraries like mocking, serialization, etc. expect\
    \ getters/setters for operating on the objects.\n\n## Questions\n* Why do you\
    \ need getters and setters when you can directly expose the class field?\n* Explain\
    \ a few benefits of using getters and setters?\n\n# varargs vs object array\n\
    The varargs argument allows zero or more parameters to be passed to the method;\
    \ whereas, an object array argument cannot be called with zero parameters.\n\n\
    ## varargs\n```java\npublic static int getCumulativeValue( int ... values){\n\
    \    int sum = 0 ;\n    for ( int value : values){\n        sum += value ;\n \
    \   }\n    return sum ;\n}\n```\n\n## object array\n```java\npublic static int\
    \ getCumulativeValues( int [] values){\n    int sum = 0 ;\n    for ( int value\
    \ : values){\n        sum += value ;\n    }\n    return sum ;\n}\n```\n\n* The\
    \ varargs can only be the last argument in the method; whereas, an object array\
    \ can be defined in any order.\n* Both varargs and object array are handled as\
    \ an array within a method.\n* Though varargs are not very popular, it can be\
    \ used in any place where you have to deal with an indeterminate number of parameters.\n\
    \n## Questions\n* What is varargs?\n* What is the difference between varargs and\
    \ object array?\n* Can you call a method with zero arguments, that expects a varargs\
    \ as a parameter?\n* Can you overload a method that takes an int array, to take\
    \ an int varargs?\n* What are the different scenarios where you can use varargs?\n\
    \n# Default Interface Method\n* Default interface methods are directly added to\
    \ an Interface to extend its capabilities.\n* The Default interface method can\
    \ be added to an Interface that is not even under your control.\n* Default interface\
    \ method does not break any existing implementation of an interface it is added\
    \ to.\n* Implementing class can override the default methods defined in the interface.\n\
    * The Default method is also known as the Defender or Virtual extension method.\n\
    \nIn this code example default Interface method, `getAdditonSymbol()`, is added\
    \ to an existing interface `Calculator`.\n\n```java\npublic interface Calculator\
    \ {\n    public < T > T add( T num1, T num2);\n    default public String getAdditionSymbol(){\n\
    \        return \"+\" ;\n    }\n}\n```\n\n## Limitations with the Default method\n\
    * If the class inherits multiple interfaces having default methods with the same\
    \ signature, then the implementing class has to provide the implementation for\
    \ that default method. \n* If any class in the inheritance hierarchy has a method\
    \ with the same signature, then default methods become irrelevant.\n\n## Default\
    \ method vs Abstract method\nFollowing are a couple of minor differences:\n* Abstract\
    \ methods allow defining constructor.\n* Abstract methods can have a state associated.\n\
    \n## With Default method - Abstract class vs Interface\nWith the introduction\
    \ of default methods, now Interfaces can be extended to add capabilities, without\
    \ breaking the classes.\n\n## Questions\n* What are default interface methods?\n\
    * What are the benefits of default interface methods?\n* Can you add default methods\
    \ to an interface that is not directly under your control?\n* What happens when\
    \ a class inherits two interfaces and both define a method with same signature?\n\
    \n# Static Interface Method\n* Static interface methods are directly added to\
    \ an Interface to extend its capabilities.\n* Static interface methods are generally\
    \ used to implement utility functions like sorting, etc.\n* Static methods are\
    \ also used when you want to enforce specific behavior in the classes.\n* Implementing\
    \ class cannot override the static methods defined in the interface.\n* The static\
    \ method can even be added to an interface that is not under your control.\n*\
    \ Similar to the default method, static method does not break any existing implementation\
    \ it is added to.\n\nIn this code example static Interface method, `getUtconedDateTime()`,\
    \ is added to an existing interface `DBWrapper`.\n\n```java\npublic interface\
    \ DBWrapper {\n    static ZonedDateTime getUtconedDateTime( Instant date ){\n\
    \        ZoneId zoneId = TimeZone.getTimeZone(\"UTC\").toZoneId();\n        ZonedDateTime\
    \ zonedDateTime = ZonedDateTime.ofInstant(date, zoneId );\n        return zonedDateTime\
    \ ;\n    }\n}\n```\n\n## Questions\n* What is static interface method?\n* Where\
    \ can you use static interface methods?\n* Can you override static interface methods?\n\
    * What is the difference between static and default interface methods?\n* Can\
    \ you add a static interface method to an interface which is not directly under\
    \ your control?\n* What happens if a class inherits two interfaces and both define\
    \ a static interface method with the same signature?\n\n# Annotations\nAnnotations\
    \ associates metadata to different program elements. Annotations may be directed\
    \ at the compiler or at runtime processing.Annotations metadata can be used for\
    \ documentation, generating boilerplate code, performing compiler validation,\
    \ runtime processing, etc. Annotations do not have any direct effect on the code\
    \ piece they annotate. We can apply annotations to a field, a variable, a method,\
    \ a parameter, a class, an interface, an enum, a package, an annotation itself,\
    \ etc.\n\n## Usage\nUser-defined annotations are directly placed before the item\
    \ to be annotated.\n\n```java\n@Length (max= 10 , min= 5 )\npublic class ParkingSlot\
    \ {\n    // Code goes here\n}\n```\n\n## Built-in annotations\n* @Deprecated -\
    \ signifies that the method is obsoleted.\n* @Override - signifies that a superclass\
    \ method is overridden.\n* @SupressWarnings - used to suppress warnings.\n\n##\
    \ Questions\n* What are annotations?\n* Where can you use annotations?\n* Where\
    \ you can apply annotations?\n"
