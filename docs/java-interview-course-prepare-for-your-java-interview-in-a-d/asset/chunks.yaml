    *   What are the Preferences?


    *   What are the types of information that can be stored with the Preferences?


    *   While using the Preference class, should you worry about the internal format
    used by the operating system?


    Pass by value or Pass by ReferenceIn Java - method arguments, whether primitive
    or object reference, are always passed by value, and access to the objects is
    allowed only through the reference. While passing an object to a method, it''s
    the copy of the reference that is passed and not the object itself. Any changes
    done to the object reference changes the object content and not the value of the
    reference.Questions


    *   What is the difference between pass-by-value and pass-by-reference?


    *   How is the reference type argument passed in Java; by reference or by value?


    *   If a copy of the reference is passed by value, how can the method get access
    to the object that reference is pointing to?


    *   If a copy of the reference is passed by value, can you change the value of
    reference?


    OBJECT ORIENTED PROGRAMMINGPolymorphismPolymorphism is an ability of a class instance
    to take different forms based on the instance it’s acting upon.Polymorphism is
    primarily achieved by sub-classing or by implementing an interface. The derived
    classes can have their own unique implementation for a certain feature and yet
    share some of the functionality through inheritance.The behavior of objects depends
    specifically on its position in the class hierarchy.Consider you have a Furniture
    class that has addLegs() method. A Chair and a Table class extend Furniture class;
    having their implementation of addLegs(). In the above situation, the runtime
    determines which implementation of addLegs() method gets called, based on whether
    you have a Chair or a Table class instance.public abstract class Furniture {


         public abstract void addLegs();


         public void print( String message){


             System . out .println(message);


        }


    }class Chair extends Furniture {


         @Override


         public void addLegs() {


            print( "Chair Legs Added" );


        }


    }class Table extends Furniture{


         @Override


         public void addLegs() {


            print( "Table Legs Added" );


        }


    }Furniture furniture = new Chair ();


    // This prints "Chair Legs Added"


    furniture .addLegs();


    furniture = new Table ();


    // This prints "Table Legs Added"


    furniture .addLegs();Benefits of polymorphismThe real power and benefit of polymorphism
    can be achieved when you can code to an abstract base class or an interface. Based
    on the context, polymorphism enables the selection of most appropriate class implementation.
    Not only in production code, but it also paves the way to have an alternate implementation
    for testing.Questions


    *   What is Polymorphism?


    *   What are the different ways to achieve polymorphism?


    *   How is inheritance useful to achieve polymorphism?


    *   What are the benefits of polymorphism?


    *   How is the polymorphism concept useful for unit testing?


    Parametric polymorphismIn Java, Generics provides an implementation of Parametric
    Polymorphism , which enables the use of the same code implementation with the
    values of different types, without compromising on compile-time type safety check.In
    the example below, we added an upper bound to type parameter T such that it implements
    an interface that guarantees getWheelsCount() method in the type T.interface Vehicle
    {


         int getWheelsCount();


    }class Car < T extends Vehicle> {


         private T vehicle ;


         public Car( T vehicle) {


             this . vehicle = vehicle;


        }


         public int getWheelsCount() {


             return vehicle .getWheelsCount();


        }


    }It can take a list of Vehicle of type T and returns the count of wheels in the
    Vehicle , without worrying about what type T actually is.Questions


    *   What is Parametric Polymorphism?


    *   How Generics is used to achieve Parametric Polymorphism?


    *   How are the Type Wildcards used to achieve Parametric Polymorphism?


    *   Can you achieve Parametric Polymorphism without Generics?


    Subtype polymorphismIn Subtype polymorphism, also known as inclusion polymorphism
    , the parameter definition of a function supports any argument of a type or its
    subtype.So if the parameters of a function have subtypes, then that function exhibits
    subtype polymorphism . Java code below illustrates the use of this kind of polymorphism.abstract
    class Vehicle{


         public abstract int getWheelsCount();


    }class Car extends Vehicle{


         @Override


         public int getWheelsCount() {


             return 4 ;


        }


    }class Bike extends Vehicle{


         @Override


         public int getWheelsCount() {


             return 2 ;


        }


    }public void printWheelsCount(Vehicle vehicle) {


        print(vehicle.getWheelsCount());


    }public void main( String [] args) {


        printWheelsCount( new Car ());


        printWheelsCount( new Bike ());


    }In the code above, the method printWheelsCount() takes a Vehicle as parameter
    and prints count of wheels in the Vehicle. The main method shows subtype polymorphic
    calls, taking objects of Car and Bike as arguments. Any place that expects a type
    as a parameter will also accept subclass of that type as a parameter.Questions


    *   What is Subtype Polymorphism?


    *   What is Inclusion Polymorphism?


    *   What is the difference between Parametric Polymorphism and SubType Polymorphism?


    *   Can you achieve SubType polymorphism using Generics?


    Overriding


    *   Method overriding is redefining the base class method to behave in a different
    manner than its implementation in the base class.


    *   Method overriding is an example of dynamic or runtime polymorphism.


    *   In dynamic polymorphism , the runtime takes the decision to call an implementation,
    as the compiler does not know what to bind at compile time.


    Rules for method overriding


    *   Method arguments and their order must be the same in the overriding method.


    *   Overriding methods can have the same return type or subtype of the base class
    method''s return type.


    *   The access modifier of the overridden method cannot be more restrictive than
    its definition in the base class.


    *   Constructor, static, and final method cannot be overridden.


    *   The overridden method cannot throw checked exceptions if its definition in
    base class doesn''t, though the overridden method can still throw an unchecked
    exception .


    Questions


    *   What is method overriding?


    *   What is dynamic polymorphism?


    *   Why can''t you override static methods defined in super-class or interface?


    *   Can you override a final method defined in super-class?


    *   Can you override a public method in super-class and mark it protected?


    *   Why can''t you override constructor of super-class?


    *   Can an overridden method throw checked exception; when the method in super-class
    does not? Why?


    *   What are the benefits of method overriding?'
