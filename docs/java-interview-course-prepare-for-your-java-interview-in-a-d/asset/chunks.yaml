  trans: "\n\n- 将锁定范围缩小到仅限临界区。这将提高整体性能并尽量减少遇到竞态条件的概率。\n- 优先使用 `synchronized` 块而不是\
    \ `synchronized` 方法，因为块只在本地对象上锁定，而不是整个类对象。\n- 在 `synchronized` 块内部，永远不要调用客户端代码提供的方法或为继承设计的方法。\n\
    \n## Questions\n- `synchronized` 关键字是如何使用的？\n- `synchronized` 方法和 `synchronized`\
    \ 块之间有什么什么区别？\n- 为什么优先使用 `synchronized` 块而不是 `synchronized` 方法？\n- `synchronized`\
    \ 方法会锁定整个对象吗？\n- 如果在 `synchronized` 块或过程内部调用客户端支持的方法，会发生什么？\n\n## 条件同步\n条件同步通过条件变量配合\
    \ `wait()` 和 `notify()` 或 `notifyAll()` 方法来实现。\n\n```java\npublic void operation()\
    \ throws InterruptedException {\n    synchronized (reference) {\n        if (condition1)\
    \ {\n            // 等待通知\n            reference.wait();\n        }\n        if\
    \ (condition2) {\n            // 通知所有等待的线程\n            reference.notifyAll();\n\
    \        }\n    }\n}\n```\n\n1. 有两种方法可以信号等待的线程。\n    - `notify()` - 仅信号一个随机线程。\n\
    \    - `notifyAll()` - 所有处于等待状态的线程。\n2. `wait()` 方法有一个重载版本也可以传递超时持续时间，`wait(long\
    \ timeout)`。\n3. 在 `notify()` 和 `notifyAll()` 方法之间，优先使用 `notifyAll()`，因为它会通知所有等待的线程。\n\
    4. `notify()` 方法唤醒单个线程，如果有多个线程等待被通知，那么线程的选择是随机的。\n\n## Questions\n- 什么是条件同步？\n\
    - 调用 `wait` 的目的是什么？\n- `notify` 和 `notifyAll` 方法之间有什么区别？\n- 当有多个线程在等待通知时，当你调用\
    \ `notify` 时哪一个会被通知？\n- 在 `notify` 和 `notifyAll` 之间你应该优先选择哪一个？为什么？\n\n## Volatile\n\
    在多线程应用中，每个线程都会维护一个从主内存到其 CPU 缓存的变量副本。因此，线程对其 CPU 缓存中变量的任何更改对其他线程都是不可见的。标记为 `volatile`\
    \ 的字段直接从主内存中存储和读取。由于 `volatile` 字段存储在主内存中，因此所有线程都能看到 `volatile` 字段值的最新更新副本，无论是哪个线程修改了它。\n\
    \n考虑一个类 `Ledger`，它有一个成员 `currentIndex` 来跟踪已输入条目的数量。在多线程环境中，每个线程都会独立地增加 `currentIndex`\
    \ 的值。\n\n```java\npublic class Ledger {\n    public int currentIndex = 0;\n}\n\
    ```\n\n如果我们将 `currentIndex` 标记为 `volatile`，那么每个线程将使用其来自主内存的值，而不会创建它的副本。\n\n```java\n\
    public class Ledger {\n    public volatile int currentIndex = 0;\n}\n```\n![](img/Image00013.jpg)\n\
    \n## Questions\n- 什么是 `volatile` 变量？\n- 解释 `volatile` 字段解决了什么问题？\n- `volatile`\
    \ 变量存储在哪里？\n\n## static vs volatile vs synchronized\n\n### static Variable\n`static`\
    \ 变量用于类对象的上下文中，无论创建多少个类对象，静态变量只存在一个副本。但如果多个线程访问同一个变量，每个线程都会在其 CPU 缓存中创建该变量的副本，一个线程所做的更改对其他线程是不可见的。\n\
    \n### volatile Variable\n`volatile` 变量用于线程上下文，无论有多少个线程或对象访问它，都只存在一个变量，且每个人始终获得最新更新的值。`volatile`\
    \ 强制所有读写操作直接在主内存中进行，而不是在 CPU 缓存中。\n\n### synchronized\n`static` 和 `volatile` 都是字段修饰符，处理与变量相关的内存可见性；而\
    \ `synchronized` 处理的是使用监视器对代码中临界区的访问控制，从而防止对代码段的并发访问。\n\n## Questions\n- 什么是 `static`\
    \ 变量？\n- 类的所有对象共享 `static` 变量。但在多线程环境中，为什么一个对象对静态变量的更改对另一个线程上的对象是不可见的？\n- 如果 `static`\
    \ 和 `volatile` 变量在对象之间共享，那么 `volatile` 变量解决了什么问题？\n- `volatile` 和 `static` 变量与\
    \ `synchronized` 有什么不同，因为即使是 `synchronized` 监视器也会保护内存对象？\n\n## ThreadLocal Storage\n\
    每个线程都有一个称为“线程本地存储”（thread-local storage）的私有内存，用于存储线程当前操作相关的数据。通常，`ThreadLocal`\
    \ 变量被实现私有静态字段，用于存储事务标识、用户标识等信息。\n\n### ThreadLocal 声明\n```java\nThreadLocal<String>\
    \ threadLocal = new ThreadLocal<String>();\n```\n\n### 设置线程本地值\n```java\nthreadLocal.set(\"\
    value\");\n```\n\n### 获取线程本地值\n```java\nString accountId = threadLocal.get();\n\
    ```\n- `ThreadLocal` 对象包含在线程内部。\n- `ThreadLocal` 的生命周期与其创建的线程相关联。\n- 为了防止泄漏，调用\
    \ `remove()` 是一个好习惯。\n```java\nthreadLocal.remove();\n```\n\n## Questions\n- 什么是线程本地存储？\n\
    - 你在 `ThreadLocal` 中存储了什么？\n- 为什么你不应该同步 `ThreadLocal` 的访问？\n- 为什么你应该移除 `ThreadLocal`？\n\
    \n## wait() vs sleep()\n\n### 使用 `wait()` 进行条件同步\n```java\npublic void waitFor(int\
    \ timeInMs) throws InterruptedException {\n    synchronized (reference) {\n  \
    \      if (condition1) {\n            // 等待通知\n            reference.wait(timeInMs);\n\
    \        }\n    }\n}\n```\n\n### 指定间隔的 sleep()\n```java\npublic void sleepFor(int\
    \ timeInMs) throws InterruptedException {\n    // 暂停 timeInMs\n    Thread.sleep(timeInMs);\n\
    \    // 打印消息\n    print(\"Slept for :\" + timeInMs + \"ms.\");\n}\n```\n- `wait`\
    \ 方法在对象的监控上调用；而 `sleep` 在线程上调用。\n- 等待的对象可以被通知；而睡眠线程不能。\n- 睡眠线程不能释放锁；而等待的对象可以。\n\
    - 唤醒睡眠线程需要它的引用，而等待对象则不需要。\n\n## Questions\n- `wait` 和 `sleep` 之间有什么区别？\n- 为什么可以通知等待对象而不能通知睡眠线程？\n\
    - 既然唤醒睡眠线程需要句柄，那么等待对象需要直接访问吗？为什么？\n- 信号对象退出 `wait` 的机制是什么？\n\n## Joining Threads\n\
    当线程之间存在依赖关系时，通常需要连接线程。目标线程的 `join()` 方法用于挂起当前线程。在这种情况下，在它所依赖的目标线程执行完成之前，当前线程无法继续执行。\n\
    \n```java\n// 主线程与线程 1 连接\npublic void main(String[] args) {\n    Thread thread1\
    \ = new Thread(ThreadMethodRef::threadMethod);\n    thread1.start();\n    // 当前线程等待\
    \ thread1 执行完成\n    thread1.join();\n}\n```\n\n\n## Questions\n- 线程 `join` 方法的目的是什么？\n\
    - 为什么需要连接两个线程？\n\n"
- fmt: "\n# Atomic Classes\nAtomic classes provide the ability to perform atomic operations\
    \ on the primitive types, such that only one thread is allowed to change the value\
    \ until the method call completes. Atomic classes like `AtomicInteger` and `AtomicLong`\
    \ wraps the corresponding primitive types. There is one present for reference\
    \ type too, `AtomicReference`. There is no need to provide synchronized access\
    \ to `Atomic Class` objects. Method `incrementAndGet()` is `AtomicInteger` is\
    \ often used in place of pre and post-increment operators.\n\n## Questions\n*\
    \ What are the atomic classes?\n* Why don't you need to synchronize access to\
    \ an object of the atomic class?\n* Why pre and post-increment operator are not\
    \ thread-safe?\n    * Pre and post-operation are multiple operations under the\
    \ hood- read, increment, and write. All three are not synchronized together, so\
    \ any thread context switch that happens in between will result in undesired results.\n\
    * What is the difference between Atomic and Volatile variables?\n    * Atomic\
    \ variables provide atomic access even for the compound operation like pre and\
    \ post-increment operation, which is not possible if the variable is declared\
    \ as `Volatile`. `Volatile` just guarantees happen-before reads.\n\n# Lock\n*\
    \ Locking is a mechanism for controlling shared resource access in a multithreaded\
    \ system.\n* `ReentrantLock` class implements a lock interface.\n* A lock can\
    \ be acquired and released in different blocks of code.\n* `Lock` interface has\
    \ method `tryLock()` to verify resource availability.\n* As a good practice, the\
    \ acquired lock must be released in the `finally` block.\n\n```java\n// Thread-safe\
    \ class\npublic class SafeAccount {\n    // Create lock object\n    private Lock\
    \ lockObject = new ReentrantLock();\n\n    public void addMoney() {\n        //\
    \ Acquire the lock\n        lockObject.lock();\n        try {\n            //\
    \ add some money logic here\n        } finally {\n            // Release the lock\n\
    \            lockObject.unlock();\n        }\n    }\n}\n```\n\n## Questions\n\
    * Explain the locking mechanism in a multi-threaded environment?\n* Do you need\
    \ to acquire and release lock in the same block of code?\n* Why should you prefer\
    \ using `tryLock()` instead of a `lock()`?\n\n# ReadWriteLock\n* `ReadWriteLock`\
    \ maintains a pair of associated locks, one for writing and the other for read-only\
    \ operations.\n* Only one thread can acquire a write lock, but multiple threads\
    \ can have read lock.\n* `ReadWriteLock` interface is implemented by `ReentrantReadWriteLock`.\n\
    \n```java\n// ReentrantReadWriteLock lock\nReentrantReadWriteLock rwl = new ReentrantReadWriteLock();\n\
    // read lock\nLock rl = rwl.readLock();\n// write lock\nLock wl = rwl.writeLock();\n\
    ```\n\n## Questions\n* What are the benefits of using `ReadWriteLock`?\n* In which\
    \ scenarios should you prefer `ReadWriteLock` over other locking mechanism?\n\n\
    # Synchronisers\nSynchronizers synchronize multiple threads to protect a `Critical\
    \ Section`.\n\n| SyncPoint | Threads |\n| :--- | :--- |\n\n### Synchronizer Types\n\
    * Barriers\n* Semaphore\n* Phasers\n* Exchangers\n* Latch\n\n## Questions\n* What\
    \ is the purpose of synchronizers?\n* What are the different types of synchronizers\
    \ available in Java?\n\n# Barriers\n* In `Barriers`, a set of threads waits for\
    \ each other to arrive at the barrier point before moving ahead.\n* `CyclicBarrier`\
    \ is a concrete implementation of the `Barrier` synchronizer.\n\n```java\n// barrier\
    \ with five threads\nCyclicBarrier barrier = new CyclicBarrier(5);\n```\n\n* A\
    \ `Barrier` is also called a cycle because it can be reused after calling `reset()`\
    \ on it.\n* Action can be passed to the `CyclicBarrier` to execute when all the\
    \ threads reach barrier point.\n\n```java\n// barrier with an action to run//\
    \ at the barrier point.\nCyclicBarrier barrier = new CyclicBarrier(5, () -> {\n\
    \    // barrier point action code.\n});\n```\n\n* If any thread is terminated\
    \ prematurely, the other threads will exit.\n* Barriers are generally used when\
    \ all threads arrive, and then proceeds to the next phase.\n\n## Questions\n*\
    \ Explain `Barrier`?\n* Can you reuse `Barrier` again?\n* What happens if one\
    \ of threads dies?\n\n# Semaphore\n* `Semaphore` maintains a specified number\
    \ of permits.\n\n```java\n// Semaphore created with four\nSemaphore semaphore\
    \ = new Semaphore(4);\n```\n\n* To gain a permit, use `acquire()`.\n* To release\
    \ the permit, use `release()`.\n* If `release()` is called more times than `acquire()`,\
    \ an additional permit will be added.\n* `Semaphore` is generally used to allow\
    \ limited access.\n\n## Questions\n* Explain `Semaphore`?\n* What happens if you\
    \ call `release()` more time than `acquire()`?\n* What happens when-permits are\
    \ not available?\n* Where do you use `Semaphore`?\n\n# Phaser\n* Unlike barriers,\
    \ the number of parties registered with `Phaser` can change over time.\n\n```java\n\
    // Phaser with four\nPhaser phaser = new Phaser(4);\n```\n\n* A `Phaser` can also\
    \ be reused.\n* Use `register()` method to register a party.\n* Use `arriveAwaitAdvance()`\
    \ to wait for all parties to arrive.\n* `Phasers` monitor the count of registered,\
    \ arrived, and un-arrived parties.\n* A party can be de-registered using `arriveDeregister()`\
    \ method.\n\n## Questions\n* Explain `Phaser`?\n* What is special about `Phaser`\
    \ regarding the number of parties?\n* Can you reuse the same `Phaser` object again?\n\
    * Can you monitor the count of `Phaser` using some external object who is not\
    \ registered as a party?\n* What is the difference between `Semaphore` and `Phaser`?\n\
    \n# Exchanger\n* The `exchanger` lets two threads wait for each other at a Synchronization\
    \ point to swap elements.\n\n```java\n// Exchanging array of strings\nExchanger<ArrayList<String>>\
    \ exchanger = new Exchanger<ArrayList<String>>();\n```\n\n* `Exchangers` use `exchange()`\
    \ method to exchange information.\n\n```java\n// exchanger exchanging data\nobjectToExchange\
    \ = exchanger.exchange(objectToExchange);\n```\n\n* On `exchange()`, the consumer\
    \ empties the object to be exchanged and waits for the producer to exchange it\
    \ with full object again.\n\n## Questions\n* Explain `Exchanger`?\n* How many\
    \ threads are required with the `Exchanger` object?\n* What is the primary purpose\
    \ of `Exchanger` synchronizer?\n* Does `Exchanger` synchronizer use the same object\
    \ to exchange every time or a different object can be exchanged?\n\n# Latch\n\
    * `Latch` makes the group of threads wait till a set of operations is finished.\n\
    * The `latch` cannot be reused.\n* `CountDownLatch` class provides an implementation\
    \ for `Latch`.\n* All threads wait calling `await()` method till `countDown()`\
    \ is called as many times the latch counter is set.\n\n```java\n// Create a countdown\
    \ latch with five counter\nCountDownLatch cdl = new CountDownLatch(5); // Count\
    \ down on the latch after completion of thread job\n```\n"
