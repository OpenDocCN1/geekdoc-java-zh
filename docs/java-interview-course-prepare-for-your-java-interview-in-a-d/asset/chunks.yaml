  trans: "\n\n* 控制反转（Inversion of Control）与依赖注入（Dependency Injection）之间有什么区别？\n* 实现依赖注入的不同方式有哪些？\n\
    * 识别依赖源的不同方法有哪些？\n* 谁负责注入依赖对象？\n* 依赖注入对单元测试有什么帮助？\n* 依赖注入如何用于模块化软件开发？\n\n## 服务定位器（Service\
    \ Locator）\n\n服务定位器是一个封装了解析所请求服务逻辑的对象。服务定位器还提供了一个用于注册服务的接口，这允许你在不修改依赖这些服务的对象的情况下替换具体的实现类。\n\
    \n在下图所示，`Account` 类使用 `ServiceLocator` 来解析它所依赖的 `AccountService` 和 `UserService`。\n\
    \n![](img/Image00005.jpg)\n\n```java\npublic class Account {\n    UserService\
    \ userService ;\n    AccountService accountService ;\n\n    public Account() {\n\
    \        this.userService = ServiceLocator.getService(UserService.class);\n  \
    \      this.accountService = ServiceLocator.getService(AccountService.class);\n\
    \    }\n}\n```\n\n### 服务定位器的好处\n* 类不需要管理任何服务依赖及其生命周期。\n* 它有助于独立测试一个类，而无需该类所依赖的真实服务类。\n\
    * 它允许运行时优化；因为服务可以在运行时进行注册和注销。\n\n### 问题\n* 解释一下什么是服务定位器设计模式？\n* 使用服务定位器设计模式有什么好处？\n\
    * 服务定位器和依赖注入模式之间有什么区别？\n* 在什么情况下你会更倾向于使用服务定位器而不是依赖注入，反之亦然？\n* 服务定位器如何帮助测试？\n\n\
    ## 菱形问题（Diamond Problem）\n\nJava 不允许继承多个类，因为当多个父类拥有具有相同签名方法的方法时，可能会产生歧义，编译器无法决定使用哪一个父类的方法。\n\
    \n考虑下图所示的继承层次结构。如果 `Base` 类中定义的方法 `calculate()` 同时被 `DerivedLeft` 和 `DerivedRight`\
    \ 重写，那么对于 `Confused` 类继承哪一个版本的 `calculate()` 就会产生歧义。\n\n![](img/Image00006.jpg)\n\
    \n在下面的代码中，对于应该调用哪个版本的 `calculate()` 存在歧义。这在 Java 中被称为“菱形问题”。\n\n```java\npublic\
    \ static void main (String [] args){\n    Base base = new Confused ();\n    base.calculate();\n\
    }\n```\n\n### 默认接口方法导致的菱形问题\n\n引入默认接口方法后，可能会出现菱形问题。如果 `Base`、`DerivedLeft` 和 `DerivedRight`\
    \ 都是接口，并且三个接口中都存在作为默认接口方法的 `calculate()`，这将导致菱形问题。在这种情况下，`Confused` 类必须显式地重新实现\
    \ `calculate()` 方法；否则歧义将被编译器拒绝。\n\n### 问题\n* 解释 Java 中的菱形问题？\n* 为什么 Java 不提供多重继承？\n\
    * 使用默认接口方法，类仍然可以继承两个具有相同签名方法的接口；这难道不会导致菱形问题吗？你如何解决它？\n\n## 面接口编程（Programming to\
    \ interface）\n\n面向接口编程通过促进软件组件之间的解耦，为模块化软件开发奠定了基础。高水平的解耦提高了软件组件的可维护性、扩展性和可测试性。模块化软件设计有助于加快上市速度，因为它方便了多个使用同一代码库的团队之间的并行软件开发。正是面向接口编程的设计范式形成了控制反转的基础，控制反转管理着任何大型软件应用程序中的依赖关系。\n\
    \n让我们来看一个简单的例子。假设我们有一个对集合排序的方法，它接受 `Map` 接口作为参数。这意味着 `sort()` 方法没有绑定到任何特定的 `Map`\
    \ 实现类型，你可以传递任何 `Map` 接口的具体实现。\n\n```java\npublic static void main ( String []\
    \ args){\n    sort( new HashMap<>());\n    sort( new TreeMap<>());\n    sort(\
    \ new ConcurrentSkipListMap<>());\n    sort( new TreeMap<>());\n}\n\npublic static\
    \ void sort(Map map){\n    // 执行排序\n}\n```\n\n### 面向接口编程的好处\n* 根据上下文，你可以在运行时选择最合适的行为。\n\
    * 对于测试，你可以传递模拟对象（mock objects）或存根（stubs）实现。\n* 接口/API 定义或约不会频繁更改。\n* 面向接口还方便了团队之间的并行开发，因为不同团队的开发者可以在进行最终集成之前继续针对接口编写代码。\n\
    \n### 问题\n* 面向接口编程的概念是什么？\n* 面向接口编程有什么好处？\n* 面向接口编程如何促进软件组件之间的解耦？\n* 依赖注入和面向接口编程之间有何关联？你可以在不支持面向接口的情况下实现依赖注入吗？\n\
    * 模块化软件有什么好处？\n* 面向接口编程如何帮助单元测试？\n\n## 抽象类 vs 接口\n\n### 抽象类\n抽象类不能被实例化，但可以被扩展。当你想要在类之间强制执行通用设计和实现，并期望派生类实现所需的特殊功能时，请扩展抽象类。\n\
    \n### 接口\n接口是一组相关方法的集合，定义了它的行为以及与外部世界的契约。当你想要在不相关的类之间定义共同行为时，使用接口。接口也可以定义为没有任何任何方法，这种接口被称为标记接口（marker\
    \ interface）；此类接口通常用于对类分类。标记接口的一个示例是 `java.io.Serializable`，它没有定义任何方法，但支持序列化的类必须实现它。\n\
    \n### 抽象类和接口的区别\n* 抽象类可以通过更新来为类添加更多功能，而接口可以通过添加来为类实现新行为。尽管引入了默认接口方法，接口也可以被扩展以具有更多功能。\n\
    * 接口可以被多重继承；而抽象类不能。\n* 接口定义行为，因此它可以应用于不相关的类；而相关类扩展抽象类。\n* 接口方法可以有任何类型的访问修饰符；而接口成员都是公共的。\n\
    * 抽象类可以关联状态，这在接口中是不可能的。\n* 抽象类可以被扩展而不会破坏扩展它的类；而接口的任何更改（非默认非静态方法除外）都会破坏现有实现。\n\n\
    ### 问题\n* 如果抽象类不能被实例化，那么为什么需要为抽象类定义构造函数呢？\n    * 构造函数可以执行执行的字段初始化，并执行类约束。\n* 定义抽象类？抽象类在类设计中起什么作用？\n\
    * 定义接口？接口在类设计中起什么作用？\n* 在什么情况下你会更倾向于使用抽象类而不是接口，反之亦然？\n* 解释抽象类和接口之间的各种区别？\n* 什么是标记接口？标记接口是如何使用的？\n\
    * 你可以在接口中声明静态方法吗？\n* 在引入默认接口方法后，抽象类与接口相比还有何不同？\n\n"
- fmt: "\n# Internationalization and Localization\n\n## Internationalization\nThe\
    \ internationalization of software is the process to ensure that software is not\
    \ tied to only one language or locale. Its shortened name is `i18n`.\n\n## Localization\n\
    The localization of software is the process to ensure that software has all the\
    \ resources available to support a specific language or locale. Its shortened\
    \ name is `l10n`.\n\n### Note\n`Internationalization` facilitates `localization`.\n\
    \n### Questions\n* What is Internationalization?\n* What is localization?\n* What\
    \ is the difference between `localization` and `internationalization`?\n* Can\
    \ you achieve `localization` without building support for `Internationalization`?\n\
    \n# Immutable Objects\nAn object is considered immutable when there is no possibility\
    \ of its state change after its construction.\n\n### Advantages\n* It is easier\
    \ to design and implement an immutable object, as you don't have to manage state\
    \ change.\n* Immutable objects are inherently thread-safe because they cannot\
    \ be modified after creation. So there is no need to synchronize access to it.\n\
    * Immutable objects reduce Garbage Collection overhead.\n\n### Disadvantages\n\
    * A separate object needs to be defined for each distinct value because you cannot\
    \ reuse an `Immutable` object.\n\n### The rule for defining Immutable Objects\n\
    * Declare the class `final`.\n* Allow only the constructor to create the object.\
    \ Don't provide field setter.\n* Mark all the fields `private`.\n\n### Example\
    \ of an immutable class, `Employee`\n```java\nfinal public class Employee {\n\
    \    final private int id;\n    final private String name;\n    final private\
    \ String department;\n\n    public Employee(int id, String name, String department)\
    \ {\n        this.id = id;\n        this.name = name;\n        this.department\
    \ = department;\n    }\n\n    public int getId() {\n        return id;\n    }\n\
    \n    public String getName() {\n        return name;\n    }\n\n    public String\
    \ getDepartment() {\n        return department;\n    }\n}\n```\n\n### Questions\n\
    * What is an immutable object?\n* What are the rules for defining an immutable\
    \ object?\n* What are the advantages/disadvantages of an immutable object?\n*\
    \ How do you create an immutable object?\n* What are the different situations\
    \ where you can use immutable objects?\n* What is the difference between a `final`\
    \ and an immutable object?\n* What is the optimization benefit of declaring a\
    \ variable `final`?\n* Can you list some of the problems with Immutability?\n\
    \    * It's harder to define constructors with loads of arguments.\n    * Since\
    \ the enforcement of immutability is left to the developer, even a single setter\
    \ added accidentally can break it.\n\n# Cloning\nCloning is the process of creating\
    \ a copy of an object. Simply assigning an existing object reference to an object,\
    \ results in two references pointing to the same object. There are two types of\
    \ cloning, shallow cloning and deep cloning.\n\n## Shallow Cloning\nShallow cloning\
    \ simply copies the values of the properties; for primitive property members,\
    \ an exact copy is created; and for reference type members, its address is copied.\
    \ So, for the reference type members, both original and the newly created copy,\
    \ point to the same object in heap.\n\n## Deep Cloning\nDeep cloning recursively\
    \ copies the content of each member to the new object. Deep cloning always creates\
    \ an independent copy of the original object. To create a deep clone, a dedicated\
    \ method known, as `CopyConstructor` should be written.\n\n### Questions\n* What\
    \ is cloning?\n* What is shallow cloning?\n* Explain drawbacks with shallow cloning?\n\
    * What is deep cloning?\n* What is `CopyConstructor`?\n* When would you prefer\
    \ deep cloning over shallow cloning and vice versa?\n\n# DATA TYPES\n\n## NaN\n\
    Not a Number also is known as `NaN`, is the undefined result produced because\
    \ of arithmetic computations like divide by zero, operating with infinity, etc.\
    \ No two `NaN` are equal. `NaNs` are of two types:\n* `Quiet NaN`: When a quiet\
    \ `NaN` is results, there is no indication unless the result is checked.\n* `Signalling\
    \ NaN`: When a signaling `NaN` results, it signals invalid operation expression.\n\
    \n### Questions\n* What is `NaN` or Not a Number?\n* What is Quiet NaN?\n* What\
    \ is Signalling NaN?\n* Are two `NaN` equal?\n\n## EnumSet\n* The `EnumSet` is\
    \ a specialized set implementation to be used with an `Enum` type.\n* The `EnumSet`\
    \ is represented internally as bit vectors, in a very compact and efficient manner.\n\
    * The `EnumSet` provides optimized implementation to perform bit flag operations\
    \ and should be used in place of performing `int` flag operations.\n\nThe following\
    \ code demonstrates the usage of `EnumSet`.\n```java\nprivate enum Vehicle {\n\
    \    CAR,\n    JEEP,\n    MOTORCYCLE\n}\n\npublic static void main(String[] args)\
    \ {\n    EnumSet<Vehicle> TWOWHEELER = EnumSet.of(MOTORCYCLE);\n    if (TWOWHEELER.contains(JEEP))\
    \ {\n        //\n    }\n}\n```\n\n### Questions\n* What is `EnumSet`?\n* Why should\
    \ you prefer `EnumSet` to perform `int` flag operations?\n\n## Comparing the Types\n\
    Primitive types can be compared only by using the equality operators (`==`); whereas,\
    \ reference types can be compared using equality operator and `equals()` method,\
    \ depending upon what we want to compare.\n\n### Equality Operators\nFor reference\
    \ types, the equality operators `==` and `!=` are used to compare the addresses\
    \ of two objects not their actual content.\n\n### equals() Method\nUse `equals()`\
    \ method when you want to compare the content of two objects. `Object` class defines\
    \ `equals()` method, which must be overridden by subclasses to facilitate content\
    \ comparison. If the `equal()` method is not overridden by a class, then the `equals()`\
    \ method of the `java.lang.Object` class is called, which uses an equality operator\
    \ to compare references.\n\n### Questions\n* What are the different ways to compare\
    \ types?\n* What does the equality operator compare for the reference types?\n\
    * What does the `equals()` method compare?\n* When would you prefer `equals` method\
    \ to equality operator?\n* What happens if a class does not override the `equals`\
    \ method?\n\n## Float Comparison\nTwo float numbers should not be compared using\
    \ equality operator `==`; as the same number, say 0.33, may not be stored in two\
    \ floating-point variables exactly as 0.33, but as 0.3300000007 and 0.329999999767.\
    \ So to compare two float values, compare the absolute difference of two values\
    \ against a range.\n```java\nif (Math.abs(floatValue1 - floatValue2) < EPSILON)\
    \ {\n    //\n}\n```\nwhere `EPSILON` is a very small number like `0.0000001`,\
    \ and that depend on the desired precision.\n\n### Questions\n* Why shouldn't\
    \ you use the equality operator to compare float value?\n* What is the preferred\
    \ way to compare two float values?\n* What should be the criteria to decide on\
    \ the value of the range that should be used to compare two float values?\n\n\
    ## String Comparison\n`String` class object uses equality operator, `==`, to tests\
    \ for reference equality and `equals()` method to test content equality. You should\
    \ always use `equals()` method to compare the equality of two `String` variables\
    \ from different sources. Interned Strings can be compared using equality operators\
    \ too.\n\n### Questions\n* Why should you use the `equals` method to compare `String`\
    \ objects?\n* What is the pitfall of using an equality operator to compare two\
    \ `String` objects?\n* What are interned string? How can you compare two interned\
    \ strings?\n"
