    Advantages of inner classes


    *   It''s easy to implement callbacks using inner classes.


    *   The inner class has access to the private members of the enclosing class that
    aren''t even available to the inherited classes.


    *   The inner class helps to enforce closures that make the enclosing instance
    and the surrounding scope available.


    *   The outer classes provide additional namespace to the inner classes.


