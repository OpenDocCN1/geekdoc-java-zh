  trans: "\n\n# Java 中的 Preferences\n\n在 Java 中，`Preferences` 类用于以层次结构的形式存储用户偏好设置。`Preferences`\
    \ 类抽象了存储过程，并以特定于操作系统的方式存储偏好：Mac 上使用偏好文件，Windows 系统上使用注册表。虽然偏好中的键（keys）是 `Strings`，但值可以是任何原始类型。应用程序使用\
    \ `Preferences` 类来存储和检索用户、系统偏好以及配置数据。\n\n### 问题\n* 什么是 `Preferences`？\n* `Preferences`\
    \ 可以存储哪些类型的信息？\n* 在使用 `Preference` 类时，你是否需要担心操作系统所使用的内部格式？\n\n# 值传递还是引用传递\n\n\
    在 Java 中 - 方法参数（无论是原始类型还是对象引用）始终是**按值传递**的，并且仅允许通过引用访问对象。在将对象传递给方法时，传递的是引用的拷贝，而不是对象本身。对对象引用进行的任何更改都会改变对象的内容，而不是引用本身的值。\n\
    \n### 问题\n* 值传递和引用传递有什么区别？\n* 在 Java 中引用类型参数是如何传递的？按引用传递还是按值传递？\n* 如果按值传递了引用的拷贝，方法如何访问该引用所指向的对象？\n\
    * 如果按值传递了引用的拷贝，你可以更改引用的值吗？\n\n# 面向对象编程\n\n## 多态\n\n多态是类实例根据其所作用的实例采取不同形式的能力。多态主要通过子类化或实现接口来实现。派生类可以对特定功能拥有自己独特的实现，同时通过继承共享某些功能。对象的行为具体取决于它在类层次结构中的位置。\n\
    \n假设你有一个 `Furniture` 类，它包含一个 `addLegs()` 方法。`Chair` 和 `Table` 类继承自 `Furniture`\
    \ 类；它们都有对 `addLegs()` 的实现。在上述情况下，运行时将根据你拥有 `Chair` 还是 `Table` 类实例，决定调用哪个 `addLegs()`\
    \ 方法的实现。\n\n```java\npublic abstract class Furniture {\n    public abstract void\
    \ addLegs();\n    public void print(String message) {\n        System.out.println(message);\n\
    \    }\n}\n\nclass Chair extends Furniture {\n    @Override\n    public void addLegs()\
    \ {\n        print(\"Chair Legs Added\");\n    }\n}\n\nclass Table extends Furniture\
    \ {\n    @Override\n    public void addLegs() {\n        print(\"Table Legs Added\"\
    );\n    }\n}\n\nFurniture furniture = new Chair();\n// This prints \"Chair Legs\
    \ Added\"\nfurniture.addLegs();\n\nfurniture = new Table();\n// This prints \"\
    Table Legs Added\"\nfurniture.addLegs();\n```\n\n### 多态的优势\n当你能够针对抽象基类或接口编写代码时，就能实现多态真正的力量和优势。根据上下文文，多态允许选择最合适的类实现。这不仅在生产代码中如此，还为测试提供替代实现铺平了道路。\n\
    \n### 问题\n* 什么是多态？\n* 实现多态的不同方式有哪些？\n* 继承对实现多态有什么用？\n* 多态的优势是什么？\n* 多态概念对单元测试有什么用处？\n\
    \n### 参数多态\n在 Java 中，泛型（Generics）提供了参数多态的实现，它允许在处理不同类型的值时使用相同的代码实现，而不会削弱编译时的类型安全检查。在下面的示例中，我们为类型参数\
    \ `T` 添加了上界，使其实现一个接口，该接口保证了类型 `T` 中存在 `getWheelsCount()` 方法。\n\n```java\ninterface\
    \ Vehicle {\n    int getWheelsCount();\n}\n\nclass Car<T extends Vehicle> {\n\
    \    private T vehicle;\n    public Car(T vehicle) {\n        this.vehicle = vehicle;\n\
    \    }\n    public int getWheelsCount() {\n        return vehicle.getWheelsCount();\n\
    \    }\n}\n```\n它可以接收类型为 `T` 的 `Vehicle` 列表，并返回 `Vehicle` 的轮数量，而无需担心 `T` 实际上是什么类型。\n\
    \n### 问题\n* 什么是参数多态？\n* 如何使用泛型实现参数多态？\n* 如何使用类型通配符（Type Wildcards）实现参数多态？\n* 不使用泛型可以实现参数多态吗？\n\
    \n### 子类型多态\n在子类型多态（也称为包含多态）中，函数的参数定义支持任何类型或其子类型的参数。如果函数的参数具有子类型，那么该函数就表现出子类型多态。下面的\
    \ Java 代码说明了这种多态的使用。\n\n```java\nabstract class Vehicle {\n    public abstract\
    \ int getWheelsCount();\n}\n\nclass Car extends Vehicle {\n    @Override\n   \
    \ public int getWheelsCount() {\n        return 4;\n    }\n}\n\nclass Bike extends\
    \ Vehicle {\n    @Override\n    public int getWheelsCount() {\n        return\
    \ 2;\n    }\n}\n\npublic void printWheelsCount(Vehicle vehicle) {\n    print(vehicle.getWheelsCount());\n\
    }\n\npublic void main(String[] args) {\n    printWheelsCount(new Car());\n   \
    \ printWheelsCount(new Bike());\n}\n```\n在上述代码中，`printWheelsCount()` 方法接收 `Vehicle`\
    \ 作为参数并打印 `Vehicle` 的轮数。`main` 方法展示了子类型多态调用，接收 `Car` 和 `Bike` 对象作为参数。任何期望类型参数的地方都会接受该类型的子类。\n\
    \n### 问题\n* 什么是子类型多态？\n* 什么是包含多态？\n* 参数多态和子类型多态有什么区别？\n* 可以使用泛型实现子类型多态吗？\n\n#\
    \ 重写\n\n* 方法重写（Overriding）是重新定义基类方法以具有与其基类实现不同的行为。\n* 方法重写是动态多态（运行时多态）的一种示例。\n\
    * 在动态多态中，运行时决定调用哪个实现，因为编译器在编译时无法确定绑定。\n\n### 方法重写的规则\n* 重写方法的参数及其顺序必须与原方法相同。\n\
    * 重写方法可以具有相同的返回类型或基类方法返回类型的子类型。\n* 重写方法的访问修饰符不能比基类中的定义更严格。\n* 构造函数、静态方法和 final\
    \ 方法不能被重写。\n* 如果基类中的定义没有抛出检查异常，则重写方法不能抛出检查异常，但重写方法仍然可以抛出运行时异常。\n\n### 问题\n* 什么是方法重写？\n\
    * 什么是动态多态？\n* 为什么不能重写父类或接口中定义的静态方法？\n* 可以重写父类中定义的 final 方法吗？\n* 可以重写父类中的 public\
    \ 方法并将其标记为 protected 吗？\n* 为什么不能重写父类的构造函数？\n* 当基类方法没有抛出检查异常时，重写方法可以抛出检查异常吗？为什么？\n\
    * 方法重写的处有哪些？\n\n"
- fmt: "\n# @Override\n\nThe `@Override` annotation is a way to explicitly declare\
    \ the intention of overriding a method implementation defined in the base class.\
    \ Java performs compile-time checking for all such annotated methods. It provides\
    \ an easy way to mistake-proof against accidentally writing the wrong method signature\
    \ when you want to override from the base class. \n\nIf a derived class defines\
    \ a method having the same signature as a method in the base class, the method\
    \ in the derived class hides the one in the base class. By prefixing a subclass's\
    \ method header with the `@Override` annotation, you can detect if an inadvertent\
    \ attempt is made to overload instead of overriding a method.\n\n### Questions\n\
    *   What is the purpose of the `@Override` annotation?\n*   What happens if you\
    \ define a method with the same signature as defined in the super-class and without\
    \ using the `@Override` annotation?\n*   What are the benefits of `@Override`\
    \ annotation?\n\n## Overloading\n\n*   The method overloading is about defining\
    \ more than one method with the same name, but with different parameters.\n* \
    \  Method overloading is an example of static or compile-time polymorphism.\n\
    *   In static polymorphism , it's while writing the code the decision is made\
    \ to call a specific implementation.\n\n### Rules for method overloading\n*  \
    \ The method can be overloaded by defining method with the same name as an existing\
    \ one but having\n    *   A different number of arguments.\n    *   The different\
    \ datatype of arguments.\n    *   A different order of arguments.\n*   The return\
    \ type of the overloaded method can be different.\n*   A method with the same\
    \ name and the same parameter cannot be defined when they differ only by return\
    \ type.\n*   Overloading methods are not required to throw the same exception\
    \ as the methods it’s overloading.\n\n## Operator Overloading\n\nOperator overloading\
    \ is an ability to enhance the definition of the language-dependent operators.\
    \ For example, you can use `+` operator to add two integers and also to concat\
    \ two strings.\n\n### Questions\n*   Explain method overloading?\n*   What is\
    \ static polymorphism?\n*   What is the difference between static and dynamic\
    \ polymorphism?\n*   Can you override a method such that all the parameters are\
    \ the same with the difference only in return type?\n*   What is operator overloading?\n\
    *   What are the benefits of method overloading?\n*   What is the difference between\
    \ overriding and overloading?\n\n## Abstraction\n\nAbstraction helps to move the\
    \ focus from the internal details of the concrete implementation to the types\
    \ and its behavior. Abstraction is all about hiding details about data, its internal\
    \ representation, and its implementation. The other equally important object-oriented\
    \ concept is an encapsulation that could be used to abstract the complexities\
    \ and the internal implementation of a class. Abstraction also helps to make the\
    \ software maintainable, secure, and provides an ability to change the implementation\
    \ without breaking any client.\n\n### Questions\n*   What is abstraction?\n* \
    \  How abstraction is different from encapsulation?\n*   What are the benefits\
    \ of abstraction?\n*   Can you achieve abstraction without encapsulation?\n\n\
    ## Inheritance\n\nInheritance is an object-oriented design concept that deals\
    \ with reusing an existing class definition (known as super-class) and defining\
    \ more special categories of class (known as sub-class) by inheriting that class.\
    \ It focuses on establishing the IS-A relationship between sub-class and its super-class.\
    \ Inheritance is also used as a technique to implement polymorphism; when a derived\
    \ type implements a method defined in the base type.\n\n### Rules for Inheritance\n\
    *   There can be a multiple levels of inheritance, based on the requirements to\
    \ create specific categories.\n*   Only single class inheritance is allowed in\
    \ Java, as multiple inheritances comes with its share of complexity; check Diamond\
    \ Problem.\n*   A class declared `final` cannot be extended.\n*   A class method\
    \ declared `final` cannot be overridden.\n*   Constructors and private members\
    \ of the base class are not inherited.\n*   The constructor of the base class\
    \ can be called using `super()`.\n*   The base class's overridden method can be\
    \ called using `super` keyword, otherwise, you will end up calling an overriding\
    \ method recursively.\n\n### Questions\n*   Explain inheritance?\n*   What is\
    \ the purpose of inheritance?\n*   What should be the criteria to decide the inheritance\
    \ relation between two classes?\n*   How inheritance plays an important role in\
    \ polymorphism?\n*   Can you inherit the final class?\n*   What happens if you\
    \ don't use the `super` keyword to call an overridden member?\n*   Why can't you\
    \ inherit static members defined in the super-class?\n*   What are the challenges\
    \ one can face if multiple inheritances are possible in Java?\n\n## Composition\n\
    \nThe composition is an object-oriented design concept that is closely related\
    \ to inheritance, as it also deals with reusing classes; but it focuses on establishing\
    \ a HAS- A relationship between classes. So unlike Inheritance, which deals with\
    \ extending features of a class, composition reuses a class by composing it. The\
    \ composition is achieved by storing reference of another class as a member.\n\
    \n### Inheritance vs Composition\n\nPrimary issue with inheritance is that it\
    \ breaks encapsulation as the derived class becomes tightly coupled to implementation\
    \ of the base class. The problem becomes complex when a class is not designed\
    \ keeping future inheritance scope and you have no control over the base class.\
    \ There is possibility of breaking a derived class because of changes in the base\
    \ class. So, inheritance must be used only when there is perfect IS-A relationship\
    \ between the base and the derived class definitions; and in case of any confusion\
    \ prefer composition over inheritance.\n\n### Questions\n*   Explain composition?\n\
    *   What is the difference between inheritance and composition?\n*   What should\
    \ be the criteria to decide composition relation between two classes?\n*   Explain\
    \ few problems with inheritance that can be avoided by using composition?\n* \
    \  When should you prefer composition over inheritance and vice versa?\n\n## FUNDAMENTAL\
    \ DESIGN CONCEPTS\n\n### Dependency Injection vs Inversion of Control\nThe Dependency\
    \ Injection and the Inversion of Control promotes modular software development\
    \ by loosely coupling the dependencies. Independent modular objects are also maintainable\
    \ and testable.\n\n### Inversion of Control\nInversion of Control provides a design\
    \ paradigm where dependencies are not explicitly created by the objects that require,\
    \ but such objects are created and provided by the external source.\n\n### Dependency\
    \ Injection\nDependency Injection is a form of IoC that deals with providing object\
    \ dependencies runtime; through constructors, setters or the service locators.\
    \ Annotations and Interfaces are used to identify the dependency sources to create\
    \ and inject dependencies.\n\n*   Mode of dependency injection:\n    *   Through\
    \ constructor\n    *   Through setter\n    *   Through method parameter\n*   It's\
    \ the responsibility of the dependency injection framework to inject the dependencies.\n\
    \n![](Image0004.jpg) The code below demonstrates dependency injection as a constructor\
    \ parameter.\n\n```java\npublic class Account {\n    UserService userService;\n\
    \    AccountService accountService;\n\n    public Account(UserService userService,\
    \ AccountService accountService) {\n        this.userService = userService;\n\
    \        this.accountService = accountService;\n    }\n}\n```\n\nNot only in production\
    \ systems, but DI and IoC also provide immense help in unit testing too, by providing\
    \ an ability to mock dependencies. Spring framework is an example of a DI container.\n\
    \nNoteIt is important to ensure that dependency objects are initialized before\
    \ they are requested.\n\n### Questions\n*   What is Inversion of Control?\n* \
    \  What is Dependency Injection?\n"
