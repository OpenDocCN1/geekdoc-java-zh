    \ XML 的替代方案，更是它的继任者。随着大数据和物联网的发展，加上 JSON 能够轻松解析为 JavaScript 对象的能力，它已成为 Web 集成的首选数据格式。以下是其背后的几个主要因素。\n\
    \n* 它具有互操作性，因为它仅限于原始数据类型。\n* 它比 XML 更轻量、更不冗余。\n* 它非常容易序列化并在网络上传输结构化数据。\n* 几乎所有现代语言都支持它。\n\
    * 所有流行的 浏览器中的 JavaScript 解析器都支持它。\n\n#### JSON 结构\nJSON 结构可以分为 JSON 对象和 JSON 数组。\n\
    \n**JSON 对象**\nJSON 对象简单来说是由逗号分隔的键值对组成。键始终是字符串。\n![](img/Image00014.jpg)\n\n**JSON\
    \ 数组**\nJSON 数组是值的有序集合。值可以是字符串、数字、对象或数组本身。\n![](img/Image00015.jpg)\n\n### 问\n\
    * 什么是 JSON？\n* JSON 流行的主要原因是什么？\n* JSON 和 XML 数据格式之间有什么显著区别？\n* 为什么 JSON 成为数据交换的首选格式？\n\
    * 解释 JSON 对象和 JSON 数组之间的区别？\n\n### 内存管理\n#### 栈（Stack）与 堆（Heap）\n* 栈是每个系统线程在创建时与之关联的内存；而堆是应用程序中所有线程共享的内存。\n\
    * 对于线程访问的每个函数，都会在栈顶分配一块内存，用于局部变量和簿记数据，这些内会在函数返回时按后进先出（LIFO）顺序被释放。相比之下，堆中的内存分配是相对随机的，没有强制的模式，且堆上的变量需要手动销。\n\
    * 当线程退出时，与线程关联的栈会被回收。当应用程序进程退出时，堆内存会被回收。\n* 分配和释放栈内存更简单快速，因为它就像调整指针一样简单。堆中的内存分配和释放相对复杂，因为没有固定的内存分配模式。\n\
    * 栈内存仅对所有线程可见，因此内存访问是直接的；而堆内存跨应用程序中的多个线程共享，因此与其他线程同步会影响性能。\n* 当栈内存耗尽时，JVM 抛出 `StackOverFlowError`；当堆空间耗尽时，JVM\
    \ 抛出 `OutOfMemoryError`。\n\n#### 栈和堆中的内存分配\n此示例描述了在调用方法时栈和堆内存的分配。\n* `num1` 和\
    \ `num2` 变量存储在栈中。\n* 引用点变量存储在栈中。\n* `Point` 类的对象存储在堆中。\n![](img/Image00016.jpg)\n\
    \n### 问题\n* 什么是栈？\n* 什么是堆？\n* 在生命周期内，栈内存是如何分配和释放的？\n* 栈内存何时被释放？\n* 堆内存何时被释放？\n\
    * 为什么栈中的内存分配比堆快？\n* 为什么你需要在堆上应用同步而不是栈上？\n* 当栈内存耗尽时你会得到什么异常？\n* 当堆内存耗尽时你会得到什么异常？\n\
    * 你需要显式释放栈上的对象吗？\n\n#### 堆碎片\n堆碎片发生在 Java 应用在一段时间内分配和释放大小不等的内存块，这导致在已用块之间分布着许多小的空闲内存块。这是一个大块。\n\
    堆碎片会导致长垃圾回收（GC）周期，因为 JVM 被迫使对堆进行压缩。通过增加堆大小等方法可以控制堆碎片。\n\n### 问题\n* 什么是堆碎片？\n*\
    \ 为什么会发生堆碎片？\n* 谁负责减少堆碎片？\n* 你如何控制堆碎片？\n* 当堆碎片非常严重时会发生什么？\n* 为什么堆碎片会减慢应用程序速度？\n\
    \n#### 对象序列化\n将内存中对象的内容转换为字节以便持久化或传输被称为对象序列化。这些字节可以通过反序列化转换回对象。\n在 Java 中，如果一个对象的类实现了\
    \ `java.io.Serializable` 或其子接口 `java.io.Externalizable`，则该对象是可序列化的。标记为 `transient`\
    \ 的成员不会被序列化。`ObjectInputStream` 和 `ObjectOutputStream` 是专门用于读写对象的流类。\n\n### 问题\n\
    * 什么是序列化和反序列化？\n* 希望支持序列化的类型需要实现哪个接口？\n* 你如何防止某个成员被序列化？\n* Java 中哪些类用于序列化和反序列化对象？\n\
    \n#### 垃圾回收\nJava 中的垃圾回收是识别并从内存中移除未引用的对象，并将剩余对象移动在一起以释放连续内存块的过程。当由于垃圾回收发生时，应用程序中所有运行的线程会在收集周期内暂停。垃圾回收器在守护线程（Daemon\
    \ thread）上运行。\n将所有存活对象移动在一起可以减少内存碎片，从而提高内存分配的性能。\n在垃圾回收期间，对象根据其生存年龄移动到内存的不同区域，称为“代”。\n\
    System 类暴露了 `gc()` 方法，用于请求垃圾回收。当你调用 `System.gc()` 时，JVM 不保证立即执行垃圾回收，但可以在可能的时候执行。你也可以使用\
    \ `Runtime.getRuntime().gc()` 来请求垃圾回收。\n\n### 问题\n* 什么是垃圾回收？\n\n"
- fmt: "\n# Garbage Collection Overview\n\n* Explain the Garbage Collection cycle?\n\
    * Why Garbage Collection is considered an expensive process?\n* Why Garbage Collection\
    \ cycle improves the performance of an application?\n* How does Garbage Collection\
    \ prevent `OutOfMemoryException`?\n* Which type of thread is used for Garbage\
    \ Collection: Daemon or user thread?\n* What is memory fragmentation?\n* Why does\
    \ the application seem to slow down when Garbage Collection happens?\n* Can you\
    \ explicitly request a Garbage Collection?\n* Which methods can you call to request\
    \ Garbage Collection?\n* Does Garbage Collection always happen when requested?\n\
    \n# Memory Management\n\n`JVM` memory is divided into two major categories: stack\
    \ memory, and heap memory.\n\n### Stack Memory\nStack memory is associated with\
    \ each system thread and used during the execution of the thread. A stack contains\
    \ local objects and the reference variables defined in the method; although the\
    \ referenced objects are stored in heap. Once the execution leaves the method,\
    \ all the local variables declared within the method are removed from the stack.\n\
    \n### Heap Memory\nHeap Memory is divided into various regions called generations:\n\
    \n* **New Generation** - It's divided into `Eden` and `Survivor` space. Most of\
    \ the new objects are created in `Eden`'s memory space.\n* **Old Generation**\n\
    * **Metaspace**\n\n![](Image00017.jpg)\n\nWhen the new generation is filled, it\
    \ triggers garbage collection. Objects that survive this GC cycle in `Eden` are\
    \ moved to `Survivor` space. Similarly, after a few cycles of `GC`, the surviving\
    \ objects keep moving to the old generation. `Metaspace` is used by `JVM` to keep\
    \ permanent objects, mostly the metadata information of the classes. New generations\
    \ are more frequently garbage collected than the old generations.\n\n* `New Gen`\
    \ and `Old Gen` are part of heap whereas `Metaspace` is part of Native memory.\n\
    * `Metaspace` can expand at runtime, as it's part of native memory.\n\nWhen Garbage\
    \ collection happens, all the application threads are frozen until GC completes\
    \ its operation. Garbage collection is typically slow in the old generation; so\
    \ if lots of Garbage Collection happens in the old generation, it may lead to\
    \ timeout errors in the application.\n\n## Questions\n* How is Heap memory divided?\n\
    * Explain different generations of heap memory? How objects are moved across generations?\n\
    * How is the garbage collection cycle triggered?\n* What are `Eden` and `Survivor`\
    \ spaces in New Generation memory?\n* When do the objects in `Eden` move to `Survivor`\
    \ space?\n* What is `Metaspace`?\n* What is the type of things stored in `Metaspace`?\n\
    * Why `Metaspace` has virtually unlimited space?\n* In which generation Garbage\
    \ Collection cycle runs slowest? Why?\n* Which generation is more frequently garbage\
    \ collected?\n\n# Weak vs Soft vs Phantom Reference\n\nGenerally, if an object\
    \ is having a reference then the garbage collector will not collect it. This principle\
    \ is not true for `Weak` and `Soft` references.\n\n### Weak Reference\nA weak\
    \ reference is a reference that eagerly gets collected by the garbage collector.\
    \ Weak references are good for caching, which can be reloaded when required.\n\
    \n### Soft Reference\nSoft reference is slightly stronger than the `Weak Reference`,\
    \ as these are collected by garbage collector only when there is a memory constraint.\
    \ Soft references are generally used for caching re-creatable resources like file\
    \ handles, etc.\n\n### Phantom Reference\nPhantom reference is the weakest reference\
    \ in `Java`. It is referenced after an object has been finalized, but the memory\
    \ is yet to be claimed by the Garbage collector. It is primarily used for the\
    \ technical purpose to track memory usage.\n\n## Questions\n* What is a weak reference?\n\
    * What is a soft reference?\n* What is Phantom Reference?\n* What are the various\
    \ reference types that get collected by the Garbage Collector, even when the objects\
    \ of their types are still in use?\n* What is the difference between soft reference\
    \ and weak reference?\n* What is the typical usage of weak reference?\n* What\
    \ is the typical usage of soft reference?\n* What is the typical usage of Phantom\
    \ reference?\n* Which is collected first: soft reference or weak reference?\n\n\
    # UNIT TESTING\n\n## Why Unit Testing?\nTwo most important reasons:\n* You can\
    \ understand the real benefits only by doing it yourself.\n* The unit test helps\
    \ you to sleep well at night.\n\nOther important reasons:\n* Unit tests provide\
    \ immediate and continuous feedback on the success/failure of the changes made\
    \ to the code.\n* Units test increases the confidence to make big changes without\
    \ worrying about breaking any existing feature.\n* The unit test helps you to\
    \ understand the internals of the code and design.\n* Unit tests also serve as\
    \ documentation for various coding scenarios.\n* Unit test saves time in the longer\
    \ run by reducing the multiple cycles of manual verification of different scenarios.\n\
    \n## Questions\n* What are the benefits of unit testing?\n* How does unit testing\
    \ save time in the long run?\n* How can you use unit testing to document the coding\
    \ scenarios?\n\n## Unit vs Integration vs Regression vs Validation Testing\n*\
    \ **Unit**: Unit testing is continuously done while writing the code; to get immediate\
    \ feedback to the smallest testable change made. Smallest testable units can span\
    \ across methods or classes but must exclude external dependencies like `File\
    \ I/O`, `Databases`, `Network Access`, etc.\n* **Integration**: Integration testing\
    \ is done to test end to end integration when all the changes made for a scenario\
    \ is completely implemented.\n* **Regression**: Regression testing is a series\
    \ of tests performed on entire software to uncover bugs in both functional and\
    \ non-functional areas. Regression testing is usually done after enhancements,\
    \ software updates, etc.\n* **Validation**: Validation testing is done to verify\
    \ that after updating or deploying the software, the changes are made as per the\
    \ requirements.\n\n## Questions\n* What is unit testing?\n* What is integration\
    \ testing?\n* What is regression testing?\n* How are the differences between integration\
    \ testing and regression testing?\n* What is validation testing?\n\n# Testing\
    \ Private Members\n\nPrivate members can be tested using reflection, but it's\
    \ advisable to do so only when you need to test some legacy code.\n\n### Usage\n\
    The code below demonstrates the use of reflection to access the private field\
    \ of `Account`.\n\n```java\npublic class Account {\n    private float rate = 10.5f;\n\
    }\n\n@Test\npublic void testConcatenate() throws \n    IllegalAccessException,\
    \ \n    NoSuchFieldException {\n    Account account = new Account();\n    Class<?\
    \ extends Account> refClass = account.getClass();\n    Field field = refClass.getDeclaredField(\"\
    rate\");\n    field.setAccessible(true);\n    assertEquals(10.5f, field.get(account));\n\
    }\n```\n\nAs mentioned, it's not advisable to access private fields using reflection;\
    \ we have following other options to test code in a private method:\n* Test the\
    \ private method through the public method.\n* Change the access modifier of the\
    \ field, if possible.\n* Change the class design.\n\n## Questions\n* What are\
    \ the different ways to test private members?\n* Can you use `Reflection` to test\
    \ private members?\n* Why shouldn't you use reflection to test private members?\n\
    * What are the various methods to test private members?\n\n# Mocking\n\nThe primary\
    \ responsibility of a unit test is to test the conditional logic in the class\
    \ code, which should run super-fast for immediate feedback. To enable immediate\
    \ feedback, a class must have no external dependencies, which is not practical\
    \ in object-oriented software development, where you need to communicate with\
    \ external objects to perform `File IO`, read and write to a `database`, get data\
    \ from `web service`, etc. So the basic idea of mocking to replace these external\
    \ dependencies with mock objects, to isolate the object under test.\n\n## Benefits\
    \ of mocking\n"
