    \ overloading?\n\n*   What is static polymorphism?\n\n*   What is the difference\
    \ between static and dynamic polymorphism?\n\n*   Can you override a method such\
    \ that all the parameters are the same with the difference only in return type?\n\
    \n*   What is operator overloading?\n\n*   What are the benefits of method overloading?\n\
    \n*   What is the difference between overriding and overloading?\n\nAbstractionAbstraction\
    \ helps to move the focus from the internal details of the concrete implementation\
    \ to the types and its behavior. Abstraction is all about hiding details about\
    \ data, its internal representation, and its implementation.The other equally\
    \ important object-oriented concept is an encapsulation that could be used to\
    \ abstract the complexities and the internal implementation of a class.Abstraction\
    \ also helps to make the software maintainable, secure, and provides an ability\
    \ to change the implementation without breaking any client.Questions\n\n*   What\
    \ is abstraction?\n\n*   How abstraction is different from encapsulation?\n\n\
    *   What are the benefits of abstraction?\n\n*   Can you achieve abstraction without\
    \ encapsulation?\n\nInheritanceInheritance is an object-oriented design concept\
    \ that deals with reusing an existing class definition (known as super-class)\
    \ and defining more special categories of class (known as sub-class) by inheriting\
    \ that class. It focuses on establishing the IS-A relationship between sub-class\
    \ and its super-class. Inheritance is also used as a technique to implement [polymorphism](#text00026.html_a3YZ)\
    \ ; when a derived type implements a method defined in the base type.Rules for\
    \ Inheritance\n\n*   There can be a multiple levels of inheritance, based on the\
    \ requirements to create specific categories.\n\n*   Only single class inheritance\
    \ is allowed in Java, as multiple inheritances comes with its share of complexity;\
    \ check [Diamond Problem](#text00038.html_a3XR) .\n\n*   A class declared final\
    \ cannot be extended.\n\n*   A class method declared final cannot be overridden.\n\
    \n*   Constructors and private members of the base class are not inherited.\n\n\
    *   The constructor of the base class can be called using super() .\n\n*   The\
    \ base class's overridden method can be called using super keyword, otherwise,\
    \ you will end up calling an overriding method recursively.\n\nQuestions\n\n*\
    \   Explain inheritance?\n\n*   What is the purpose of inheritance?\n\n*   What\
    \ should be the criteria to decide the inheritance relation between two classes?\n\
    \n*   How inheritance plays an important role in polymorphism?\n\n*   Can you\
    \ inherit the final class?\n\n*   What happens if you don't use the super keyword\
    \ to call an overridden member?\n\n*   Why can't you inherit static members defined\
    \ in the super-class?\n\n*   What are the challenges one can face if multiple\
    \ inheritances are possible in Java?\n\nCompositionThe composition is an object-oriented\
    \ design concept that is closely related to [inheritance](#text00033.html_a417)\
    \ , as it also deals with reusing classes; but it focuses on establishing a HAS-\
    \ A relationship between classes. So unlike Inheritance , which deals with extending\
    \ features of a class, composition reuses a class by composing it. The composition\
    \ is achieved by storing reference of another class as a member.Inheritance vs\
    \ CompositionPrimary issue with inheritance is that it breaks encapsulation as\
    \ the derived class becomes tightly coupled to implementation of the base class.\
    \ The problem becomes complex when a class is not designed keeping future inheritance\
    \ scope and you have no control over the base class. There is possibility of breaking\
    \ a derived class because of changes in the base class.So, inheritance must be\
    \ used only when there is perfect IS-A relationship between the base and the derived\
    \ class definitions; and in case of any confusion prefer composition over inheritance\
    \ .Questions\n\n*   Explain composition?\n\n*   What is the difference between\
    \ inheritance and composition?\n\n*   What should be the criteria to decide composition\
    \ relation between two classes?\n\n*   Explain few problems with inheritance that\
    \ can be avoided by using composition?\n\n*   When should you prefer composition\
    \ over inheritance and vice versa?\n\nFUNDAMENTAL DESIGN CONCEPTSDependency Injection\
    \ vs Inversion of ControlThe Dependency Injection and the Inversion of Control\
    \ promotes modular software development by loosely coupling the dependencies.\
    \ Independent modular objects are also more maintainable and testable.Inversion\
    \ of ControlInversion of Control provides a design paradigm where dependencies\
    \ are not explicitly created by the objects that require these, but such objects\
    \ are created and provided by the external source.Dependency InjectionDependency\
    \ Injection is a form of IoC that deals with providing object dependencies runtime;\
    \ through constructors, setters or the service locators. Annotations and Interfaces\
    \ are used to identify the dependency sources to create and inject dependencies.\n\
    \n*   Mode of dependency injection:\n\n    *   Through constructor\n\n    *  \
    \ Through setter\n\n    *   Through method parameter\n\n*   It's the responsibility\
    \ of the dependency injection framework to inject the dependencies.\n\n![](Image00004.jpg)The\
    \ code below demonstrates dependency injection as a constructor parameter.public\
    \ class Account {\n\nUserService userService ;\n\n    AccountService accountService\
    \ ;\n\npublic Account(UserService userService,\n\n                   AccountService\
    \ accountService) {\n\n        this .userService =\n\n                userService;\n\
    \n        this .accountService =\n\n                accountService;\n\n    }\n\
    \n}Not only in production systems, but DI and IoC also provide immense help in\
    \ unit testing too, by providing an ability to mock dependencies. Spring framework\
    \ is an example of a DI container.NoteIt is important to ensure that dependency\
    \ objects are initialized before they are requested.Questions\n\n*   What is Inversion\
    \ of Control?\n\n*   What is Dependency Injection?"
