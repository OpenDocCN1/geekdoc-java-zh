  trans: "\n\n# 原子类 (Atomic Classes)\n原子类提供了对原始类型执行原子操作的能力，使得方法调用完成之前只允许一个线程更改值。`AtomicInteger`\
    \ 和 `AtomicLong` 等原子类封装了相应的原始类型。引用类型也有对应的类，即 `AtomicReference`。不需要对 `Atomic Class`\
    \ 对象提供同步（synchronized）访问。`AtomicInteger` 的方法 `incrementAndGet()` 通常用于替代前置和后置操作符。\n\
    \n## Questions\n* 什么是原子类？\n* 为什么不需要对原子类对象进行同步访问？\n* 为什么前置和后置操作符不是线程安全的？\n    *\
    \ 前置和后缀操作在底层是多次操作——读取、递增和写入。这三个操作并没有同步执行，因此在它们之间发生的任何线程切换都会导致非预期的结果。\n* 原子变量（Atomic）和\
    \ volatile 变量有什么区别？\n    * 原子变量即使对于前置和后缀递增等复合操作也能提供原子访问，而如果变量声明为 `Volatile`，这是无法可能的。`Volatile`\
    \ 仅保证发生之前的（happen-before）读取。\n\n# 锁 (Lock)\n* 锁是多线程系统中控制共享资源访问的机制。\n* `ReentrantLock`\
    \ 类实现了一个锁接口。\n* 锁可以在不同的代码块中获取和释放。\n* `Lock` 接口拥有 `tryLock()` 方法来验证资源的可用性。\n* 良好的做法是，获取的锁必须在\
    \ `finally` 块中释放。\n\n```java\n// 安全类\npublic class SafeAccount {\n    // 创建锁对象\n\
    \    private Lock lockObject = new ReentrantLock();\n\n    public void addMoney()\
    \ {\n        // 获取锁\n        lockObject.lock();\n        try {\n            //\
    \ 此处添加金额的逻辑\n        } finally {\n            // 释放锁\n            lockObject.unlock();\n\
    \        }\n    }\n}\n```\n\n## Questions\n* 解释多线程环境中的锁机制？\n* 你是否需要在同一个代码块中获取并释放锁？\n\
    * 为什么你应该倾向于使用 `tryLock()` 而不是 `lock()`？\n\n# 读写锁 (ReadWriteLock)\n* `ReadWriteLock`\
    \ 维护了一对关联的锁，一个用于写入，另一个用于只读操作。\n* 只有一个线程可以获取写锁，但多个线程可以拥有读锁。\n* `ReadWriteLock`\
    \ 接口由 `ReentrantReadWriteLock` 实现。\n\n```java\n// ReentrantReadWriteLock 锁\nReentrantReadWriteLock\
    \ rwl = new ReentrantReadWriteLock();\n// 读锁\nLock rl = rwl.readLock();\n// 写锁\n\
    Lock wl = rwl.writeLock();\n```\n\n## Questions\n* 使用 `ReadWriteLock` 有什么好处？\n\
    * 在哪些场景下，你应该倾向于使用 `ReadWriteLock` 而不是其他锁机制？\n\n# 同步器 (Synchronisers)\n同步器同步多个线程以保护临界区域（Critical\
    \ Section）。\n\n| 同步点 (SyncPoint) | 线程 (Threads) |\n| :--- | :--- |\n\n### 同步器类型\n\
    * 屏障 (Barriers)\n* 信号量 (Semaphore)\n* 栅器 (Phasers)\n* 交换器 (Exchangers)\n* 计数器\
    \ (Latch)\n\n## Questions\n* 同步器的目的是什么？\n* Java 中提供了哪些类型的同步器？\n\n# 屏障 (Barriers)\n\
    * 在 `Barriers` 中，一组线程会互相等待到达屏障点后再继续移动。\n* `CyclicBarrier` 是 `Barrier` 同步器的具体实现。\n\
    \n```java\n// 带有五个线程的屏障\nCyclicBarrier barrier = new CyclicBarrier(5);\n```\n\n\
    * `Barrier` 也称为循环的，因为它在对其调用 `reset()` 后可以被重用。\n* 可以将动作传递给 `CyclicBarrier`，以便在所有线程到达屏障点时执行。\n\
    \n```java\n// 带有在屏障点运行的动作的屏障\nCyclicBarrier barrier = new CyclicBarrier(5, ()\
    \ -> {\n    // 屏障点动作代码。\n});\n```\n\n* 如果任何线程提前终止，其他线程将退出。\n* 屏障通常用于所有线程到达后，然后进入下一个阶段。\n\
    \n## Questions\n* 解释 `Barrier`？\n* 你可以再次重用 `Barrier` 吗？\n* 如果一个线程死亡了会什么？\n\n#\
    \ 信号量 (Semaphore)\n* `Semaphore` 维护指定数量的许可。\n\n```java\n// 创建具有四个许可的信号量\nSemaphore\
    \ semaphore = new Semaphore(4);\n```\n\n* 要获取许可，使用 `acquire()`。\n* 要释放许可，使用 `release()`。\n\
    * 如果调用 `release()` 的次数多于 `acquire()`，将增加额外的许可。\n* `Semaphore` 通常用于允许限制访问。\n\n\
    ## Questions\n* 解释 `Semaphore`？\n* 如果你调用 `release()` 的次数比 `acquire()` 多会发生什么？\n\
    * 当许可不可用时会发生什么？\n* 你在哪里使用 `Semaphore`？\n\n# 栅器 (Phaser)\n* 与屏障不同，注册到 `Phaser`\
    \ 的参与人数可以随时间变化。\n\n```java\n// 带有四个方的栅器\nPhaser phaser = new Phaser(4);\n```\n\
    \n* `Phaser` 也可以被重用。\n* 使用 `register()` 方法注册参与者。\n* 使用 `arriveAwaitAdvance()`\
    \ 等待所有参与者到达。\n* `Phasers` 监控已注册、到达和未到达参与者的计数。\n* 使用 `arriveDeregister()` 方法注销参与者。\n\
    \n## Questions\n* 解释 `Phaser`？\n* `Phaser` 在参与人数方面有什么特殊之处？\n* 你可以再次重用同一个 `Phaser`\
    \ 对象吗？\n* 你可以使用未注册为参与者的外部对象监控 `Phaser` 的计数吗？\n* `Semaphore` 和 `Phaser` 有什么区别？\n\
    \n# 交换器 (Exchanger)\n* `exchanger` 让两个线程在同步点互相等待以交换元素。\n\n```java\n// 交换字符串数组\n\
    Exchanger<ArrayList<String>> exchanger = new Exchanger<ArrayList<String>>();\n\
    ```\n\n* `Exchangers` 使用 `exchange()` 方法交换信息。\n\n```java\n// 交换数据\nobjectToExchange\
    \ = exchanger.exchange(objectToExchange);\n```\n\n* 在 `exchange()` 时，消费者清空要交换的对象并等待生产者再次交换完整的对象。\n\
    \n## Questions\n* 解释 `Exchanger`？\n* `Exchanger` 对象需要多少线程？\n* `Exchanger` 同步器的主要目的是什么？\n\
    * `Exchanger` 同步器每次都使用同一个对象交换，还是可以使用不同的对象？\n\n# 计数器 (Latch)\n* `Latch` 让一组线程等待一组操作完成。\n\
    * `latch` 不可重用。\n* `CountDownLatch` 类提供了 `Latch` 的实现。\n* 所有线程调用 `await()` 方法等待，直到\
    \ `countDown()` 被调次数达到计数器的设置次数。\n\n```java\n// 创建一个计数为五的倒计时器\nCountDownLatch cdl\
    \ = new CountDownLatch(5); // 在线程任务完成后对计数器递减\n```\n\n"
- fmt: "\n```java\ncdl .countDown();// waiting for count down signals\ncdl .await();\n\
    ```\n\n## Questions\n* Explain `Latch` synchronizer?\n* Can you reuse the same\
    \ `Latch` object again; like `Barrier` and `Phaser`?\n* What is the signaling\
    \ process when a thread finishes its work?\n\n## Executor Framework\nThe executor\
    \ framework provides an infrastructure to execute a set of related tasks on a\
    \ thread. `Executor` takes care to manage the following:\n\n* Creating and destroying\
    \ threads.\n* Maintaining an optimal number of threads for a task.\n* Parallel\
    \ and sequential execution of tasks.\n* Segregating task submission and task execution.\n\
    * Policies are related to controlling task execution.\n\n// Executor interface\
    \ definition\n```java\npublic interface Executor {\n    void execute ( Runnable\
    \ command);\n}\n```\n\n## Questions\n* Explain the `Executor` framework?\n* What\
    \ are the different capabilities of the `Executor` framework?\n\n## Executor Service\n\
    * `ExecutorService` inherits from the `Executor` interface providing the following\
    \ additional methods:\n    * `shutdown()` - shuts down the executor after submitting\
    \ the tasks.\n    * `shutdownNow()` - interrupts the current task and discards\
    \ the pending tasks.\n    * `submit()` - adds tasks to the `Executor`.\n    *\
    \ `awaitTermination()` - waits for existing tasks to terminate.\n* `ExecutorService`\
    \ provides `Future` objects to track the progress and the status of the executing\
    \ task.\n* All the tasks submitted to the `Executor` are queued, which are executed\
    \ by the thread pool threads.\n\n// Executor created with five threads in its\
    \ thread pool\n```java\nExecutorService exec = Executors.newFixedThreadPool( 5\
    \ );\n```\n* To create a thread pool with a single thread, use `newSingleThreadExecutor()`\
    \ method.\n\n## Handling Results\n* The `run()` method of the `Runnable` interface\
    \ cannot return a result or throw an exception.\n* Tasks, which can return a result,\
    \ are instance of `Callable` interface.\n\n//tasks can return results derived\
    \ from `Callable` using the `call` method\n```java\npublic interface Callable\
    \ < V > {\n    V call() throws Exception;\n}\n```\n* The `submit()` method returns\
    \ Future object object which helps to track task.\n\n// ExecutorService example\n\
    ```java\npublic class ExecService {\n    public static void main(String[] args)\n\
    \            throws ExecutionException, InterruptedException {\n      // Create\
    \ executor with five threads// in its thread pool.\n      ExecutorService exec\
    \ = Executors.newFixedThreadPool( 5 );\n      // Submit the callable task to the\
    \ executor\n      Future <String> task = exec .submit(\n                     \
    \           new Callable <String>() {\n                                @Override\n\
    \                                public String call()\n                      \
    \                  throws Exception {\n                                    //some\
    \ logic\n                                    return null ;\n                 \
    \               }\n                            });\n      // waits for the result\n\
    \      String result = task .get();\n      // Shutdown executor\n      exec .shutdown();\n\
    \    }\n}\n```\n* If there is an exception during the task, calling `get()` method\
    \ on the `ExecutorService` will throw instance of `ExecutionException`.\n\n##\
    \ Scheduling Task\n* `ScheduledExecutorService` can be used to schedule future\
    \ task.\n* Methods used to schedule:\n    * `schedule(task, delayTime, TimeUnit.SECONDS)`\n\
    \    * `scheduleAtFixedRate(task, delayTime, repeatPeriod, TimeUnit.SECONDS)`\n\
    \    * `scheduleWithFixedDelay(task, delayTime, fixedDelay, TimeUnit.SECONDS)`\n\
    \n## ExecutorCompletionService\n* `ExecutorCompletionService` uses `Executor`\
    \ to execute the task.\n* `CompletionService` of `Executor` can be used to get\
    \ results from multiple tasks.\n* `ExecutorCompletionService` provides concrete\
    \ implementation for `CompletionService`.\n\n// Create executor with five threads\n\
    ```java\nExecutorService es = Executors.newFixedThreadPool( 5 );\n// ExecutorCompletionService\
    \ returns an object\nExecutorCompletionService<Result> cs = new ExecutorCompletionService<>(\
    \ es );\n// submit task to ExecutorCompletionService\ncs .submit( longTask );\n\
    // get the result of task\nFuture <Result> completedTask = cs .take();\n```\n\n\
    ## Notes\n* Always associate context-based names to the threads, it immensely\
    \ helps in debugging.\n* Always exit gracefully, calling either `shutdown()` or\
    \ `shutdownNow()` based on your use case.\n* Configure thread pool for the `ExecutorService`\
    \ such that the number of threads configured in the pool are not significantly\
    \ greater than the number of processors.\n* You should query the host to find\
    \ the number of processors to configure the thread pool: `Runtime.getRuntime().availableProcessors()`.\n\
    \n## Questions\n* Explain `ExecutorService`?\n* How do you track the progress\
    \ and status of the executing tasks?\n* Does `Executor service` use dedicate threads\
    \ to executes queued tasks?\n* Can you use `Runnable` object with `ExecutorService`?\
    \ Why?\n* How do you find if an exception is thrown in the `ExecutorService`?\n\
    * Can you schedule a task to run in the future with the `ExecutorService`?\n*\
    \ With `ExecutorService`, how can you get results from the multiple tasks?\n*\
    \ What is the difference between `submit()` and `execute()` methods of `ExecutorService`?\n\
    \    * If you use `submit()`, you can get any exception thrown by calling `get()`\
    \ method on `Future`; whereas, if you use `execute()`, an exception will go to\
    \ `UncaughtExceptionHandler`.\n* How can you exit gracefully from `ExecutorService`?\n\
    * What should be the criteria for configuring thread pool size? How can you set\
    \ that?\n\n## Fork-Join\n* The fork-Join framework takes advantage of multi-processors\
    \ and multi-core systems.\n* It divides the tasks into sub-tasks to execute in\
    \ parallel.\n* The `fork()` method spawns a new sub-task from the task.\n```java\n\
    subTask .fork();\n```\n* The `join()` method lets the task wait for other task\
    \ to complete.\n```java\nsubTask .join();\n```\n* Important classes in Fork-Join:\n\
    \    * `ForkJoinPool` - thread pool class is used to execute subtasks.\n    *\
    \ `ForkJoinTask` - manages subtask using `fork()` and `join()` methods.\n    *\
    \ `RecursiveTask` - a task that yields result.\n    * `RecursiveAction` - a task\
    \ that does not yield results.\n* Both `RecursiveTask` and `RecursiveAction` provide\
    \ an abstract `compute()` method to be implemented by the class, whose object\
    \ represents the `ForkJoin task`.\n\n## Questions\n* Explain the Fork-Join framework\
