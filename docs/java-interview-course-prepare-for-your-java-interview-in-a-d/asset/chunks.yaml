  trans: "\n\n# 宽转换与 窄转换\n\n## 宽转换 (Widening Conversions)\n宽转换涉及将子类（派生类）对象赋值给父类（基类）对象。在下面的示例中，`Car`\
    \ 继承自 `Vehicle`。\n\n```java\nCar car = new Car ();\nVehicle vehicle = car ;\n\
    ```\n\n## 窄转换 (Narrowing Conversions)\n窄转换涉及将父类（基类）对象赋值给子类（派生类）对象。转换需要显式类型转换。在下面的示例中，`Bike`\
    \ 继承自 `Vehicle`。\n\n```java\nVehicle vehicle = new Vehicle ();\nBike bike = (\
    \ Bike ) vehicle ;\n```\n\n## 问题\n* 什么是宽转换？\n* 什么是窄转换？\n* 窄转换中是否存在数据丢失的可能性？\n\n\
    # getters 和 setters\n以下代码演示了 getter 和 setter 的用法。\n\n```java\npublic class Person\
    \ {\n    private String name ;\n\n    public String getName() {\n        return\
    \ StringUtils.capitalize( name );\n    }\n\n    public void setName( String name)\
    \ {\n        if (name.isEmpty()){\n            System.out.println( \"Name string\
    \ is empty\" );\n            //throw exception\n        }\n        this . name\
    \ = name;\n    }\n}\n```\n\n## 使用 getter 和 setter 的好处\n* 可以在 setter 中执行验证，或在以后需要时添加。\n\
    * 根据内部（存储）或外部（调用者）的需求，值可以有不同的表示形式。\n* 它隐藏了用于存储值的内部数据结构。\n* 可以更改内部字段，而无需更改使用该代码的用户。\n\
    * 它在检索或计算值时封装了内部复杂性。\n* 它提供了为 getter 和 setter 指定不同访问修符的能力。\n* 它提供了添加调试信息的能力。\n\
    * 它可以作为 Lambda 表达式进行传递。\n* 许多库（如 mock、序列化等）期望通过 getters/setters 来操作对象。\n\n## 问题\n\
    * 当你可以直接暴露类字段时，为什么还需要 getters 和 setters？\n* 解释使用 getters 和 setters 的某些好处？\n\n\
    # 变长参数 (varargs) 与 对象数组\n变长参数允许向方法传递零或多个参数；而对象数组参数不能用零个参数进行调用。\n\n## 变长参数\n```java\n\
    public static int getCumulativeValue( int ... values){\n    int sum = 0 ;\n  \
    \  for ( int value : values){\n        sum += value ;\n    }\n    return sum ;\n\
    }\n```\n\n## 对象数组\n```java\npublic static int getCumulativeValues( int [] values){\n\
    \    int sum = 0 ;\n    for ( int value : values){\n        sum += value ;\n \
    \   }\n    return sum ;\n}\n```\n\n* 变长参数只能是方法的最后一个参数；而对象数组可以定义为任何顺序。\n* 变长参数和对象数组在方法内部都被视为数组处理。\n\
    * 尽管变长参数并不流行，但在任何需要处理不确定参数的地方都可以使用。\n\n## 问题\n* 什么是变长参数？\n* 变长参数和对象数组之间的区别是什么？\n\
    * 你可以调用一个期望变长参数作为参数的零参数方法吗？\n* 你可以重载接收 int 数组的方法，使其接收 int 变长参数吗？\n* 你可以使用变长参数的不同场景有哪些？\n\
    \n# 默认接口方法 (Default Interface Method)\n* 默认接口方法直接添加到接口中以扩展其功能。\n* 默认接口方法可以添加到甚至你无法控制的接口中。\n\
    * 默认接口方法不会破坏其被添加的接口的现有实现。\n* 实现类可以重写接口中定义的默认方法。\n* 默认方法也被称为防御方法 (Defender) 或 虚拟扩展方法\
    \ (Virtual extension method)。\n\n在此代码示例中，默认接口方法 `getAdditonSymbol()` 被添加到现有的接口\
    \ `Calculator` 中。\n\n```java\npublic interface Calculator {\n    public < T >\
    \ T add( T num1, T num2);\n    default public String getAdditionSymbol(){\n  \
    \      return \"+\" ;\n    }\n}\n```\n\n## 默认方法的局限性\n* 如果类继承了多个具有相同签名的默认方法的接口，则该实现类必须为该默认方法提供实现。\n\
    * 如果继承层次结构中的任何类都有具有相同签名的方法，则默认方法将变得无关。\n\n## 默认方法 vs 抽象方法\n以下是几点细微区别：\n* 抽象方法允许定义构造函数。\n\
    * 抽象方法可以关联状态。\n\n## 使用默认方法 - 抽象类与 接口\n随着默认方法的引入，现在接口可以被扩展以添加功能，而不会破坏类。\n\n## 问题\n\
    * 什么是默认接口方法？\n* 默认接口方法的好处是什么？\n* 你可以在无法直接控制的接口中添加默认方法吗？\n* 当一个类继承两个接口且两者都定义了相同签名的方法时会发生什么？\n\
    \n# 静态接口方法 (Static Interface Method)\n* 静态接口方法直接添加到接口中以扩展其功能。\n* 静态接口方法通常用于实现排序等工具函数。\n\
    * 当你想在类中强制特定行为时也会使用静态方法。\n* 实现类不能重写接口中定义的静态方法。\n* 静态方法甚至可以添加到无法控制的接口中。\n* 与默认方法类似，静态方法不会破坏其被添加的任何现有实现。\n\
    \n在此代码示例中，静态接口方法 `getUtconedDateTime()` 被添加到现有的接口 `DBWrapper` 中。\n\n```java\n\
    public interface DBWrapper {\n    static ZonedDateTime getUtconedDateTime( Instant\
    \ date ){\n        ZoneId zoneId = TimeZone.getTimeZone(\"UTC\").toZoneId();\n\
    \        ZonedDateTime zonedDateTime = ZonedDateTime.ofInstant(date, zoneId);\n\
    \        return zonedDateTime ;\n    }\n}\n```\n\n## 问题\n* 什么是静态接口方法？\n* 哪里可以使用静态接口方法？\n\
    * 你可以重写静态接口方法吗？\n* 静态方法和默认方法的区别是什么？\n* 你可以在无法直接控制的接口中添加静态接口方法吗？\n* 如果一个类继承两个接口且两者都定义了相同签名的静态接口方法会发生什么？\n\
    \n# 注解 (Annotations)\n注解将元数据关联到不同的程序元素。注解针对编译器或运行时处理。注解元数据用于文档、生成模板代码、编译验证、运行时处理等。注解对它们标记的代码片段没有直接影响。我们可以将注解应用于字段、变量、方法、参数、类、接口、枚举、包、注解本身等。\n\
    \n## 用法\n自定义注解直接放置在要注解的项之前。\n\n```java\n@Length (max= 10 , min= 5 )\npublic class\
    \ ParkingSlot {\n    // 代码位于此处\n}\n```\n\n## 内置注解\n* @Deprecated - 表示该方法已过时。\n\
    * @Override - 表示重写了父类方法。\n* @SupressWarnings - 用于抑制警告。\n\n## 问题\n* 什么是注解？\n* 哪里可以使用注解？\n\
    * 你可以在哪里应用注解？\n\n"
- fmt: "\n# Preferences in Java\n\nIn Java, the `Preferences` class is used for storing\
    \ user preferences in hierarchical form. The `Preferences` class abstracts out\
    \ the process of storage and stores the preferences in an operating system specific\
    \ way: preferences file on Mac, or the registry on Windows systems. Though the\
    \ keys in preferences are `Strings`, value can belong to any primitive type. Applications\
    \ use `Preferences` class to store and retrieve user and system preferences and\
    \ configuration data.\n\n### Questions\n* What are the `Preferences`?\n* What\
    \ are the types of information that can be stored with the `Preferences`?\n* While\
    \ using the `Preference` class, should you worry about the internal format used\
    \ by the operating system?\n\n# Pass by value or Pass by Reference\n\nIn Java\
    \ - method arguments, whether primitive or object reference, are always passed\
    \ by value, and access to the objects is allowed only through the reference. While\
    \ passing an object to a method, it's the copy of the reference that is passed\
    \ and not the object itself. Any changes done to the object reference changes\
    \ the object content and not the value of the reference.\n\n### Questions\n* What\
    \ is the difference between pass-by-value and pass-by-reference?\n* How is the\
    \ reference type argument passed in Java; by reference or by value?\n* If a copy\
    \ of the reference is passed by value, how can the method get access to the object\
    \ that reference is pointing to?\n* If a copy of the reference is passed by value,\
    \ can you change the value of reference?\n\n# OBJECT ORIENTED PROGRAMMING\n\n\
    ## Polymorphism\n\nPolymorphism is an ability of a class instance to take different\
    \ forms based on the instance it’s acting upon. Polymorphism is primarily achieved\
    \ by sub-classing or by implementing an interface. The derived classes can have\
    \ their own unique implementation for a certain feature and yet share some of\
    \ the functionality through inheritance. The behavior of objects depends specifically\
    \ on its position in the class hierarchy.\n\nConsider you have a `Furniture` class\
    \ that has `addLegs()` method. A `Chair` and a `Table` class extend `Furniture`\
    \ class; having their implementation of `addLegs()`. In the above situation, the\
    \ runtime determines which implementation of `addLegs()` method gets called, based\
    \ on whether you have a `Chair` or a `Table` class instance.\n\n```java\npublic\
    \ abstract class Furniture {\n    public abstract void addLegs();\n    public\
    \ void print(String message) {\n        System.out.println(message);\n    }\n\
    }\n\nclass Chair extends Furniture {\n    @Override\n    public void addLegs()\
    \ {\n        print(\"Chair Legs Added\");\n    }\n}\n\nclass Table extends Furniture\
    \ {\n    @Override\n    public void addLegs() {\n        print(\"Table Legs Added\"\
    );\n    }\n}\n\nFurniture furniture = new Chair();\n// This prints \"Chair Legs\
    \ Added\"\nfurniture.addLegs();\n\nfurniture = new Table();\n// This prints \"\
    Table Legs Added\"\nfurniture.addLegs();\n```\n\n### Benefits of polymorphism\n\
    The real power and benefit of polymorphism can be achieved when you can code to\
    \ an abstract base class or an interface. Based on the context, polymorphism enables\
    \ the selection of most appropriate class implementation. Not only in production\
    \ code, but it also paves the way to have an alternate implementation for testing.\n\
    \n### Questions\n* What is Polymorphism?\n* What are the different ways to achieve\
    \ polymorphism?\n* How is inheritance useful to achieve polymorphism?\n* What\
    \ are the benefits of polymorphism?\n* How is the polymorphism concept useful\
    \ for unit testing?\n\n### Parametric polymorphism\nIn Java, Generics provides\
    \ an implementation of Parametric Polymorphism, which enables the use of the same\
    \ code implementation with the values of different types, without compromising\
    \ on compile-time type safety check. In the example below, we added an upper bound\
    \ to type parameter `T` such that it implements an interface that guarantees `getWheelsCount()`\
    \ method in the type `T`.\n\n```java\ninterface Vehicle {\n    int getWheelsCount();\n\
    }\n\nclass Car<T extends Vehicle> {\n    private T vehicle;\n    public Car(T\
    \ vehicle) {\n        this.vehicle = vehicle;\n    }\n    public int getWheelsCount()\
    \ {\n        return vehicle.getWheelsCount();\n    }\n}\n```\nIt can take a list\
    \ of `Vehicle` of type `T` and returns the count of wheels in the `Vehicle`, without\
    \ worrying about what type `T` actually is.\n\n### Questions\n* What is Parametric\
    \ Polymorphism?\n* How Generics is used to achieve Parametric Polymorphism?\n\
    * How are the Type Wildcards used to achieve Parametric Polymorphism?\n* Can you\
    \ achieve Parametric Polymorphism without Generics?\n\n### Subtype polymorphism\n\
    In Subtype polymorphism, also known as inclusion polymorphism, the parameter definition\
    \ of a function supports any argument of a type or its subtype. So if the parameters\
    \ of a function have subtypes, then that function exhibits subtype polymorphism.\
    \ Java code below illustrates the use of this kind of polymorphism.\n\n```java\n\
    abstract class Vehicle {\n    public abstract int getWheelsCount();\n}\n\nclass\
    \ Car extends Vehicle {\n    @Override\n    public int getWheelsCount() {\n  \
    \      return 4;\n    }\n}\n\nclass Bike extends Vehicle {\n    @Override\n  \
    \  public int getWheelsCount() {\n        return 2;\n    }\n}\n\npublic void printWheelsCount(Vehicle\
    \ vehicle) {\n    print(vehicle.getWheelsCount());\n}\n\npublic void main(String[]\
    \ args) {\n    printWheelsCount(new Car());\n    printWheelsCount(new Bike());\n\
    }\n```\nIn the code above, the method `printWheelsCount()` takes a `Vehicle` as\
    \ parameter and prints count of wheels in the `Vehicle`. The `main` method shows\
    \ subtype polymorphic calls, taking objects of `Car` and `Bike` as arguments.\
    \ Any place that expects a type as a parameter will accept subclass of that type\
    \ as a parameter.\n\n### Questions\n* What is Subtype Polymorphism?\n* What is\
    \ Inclusion Polymorphism?\n* What is the difference between Parametric Polymorphism\
    \ and SubType Polymorphism?\n* Can you achieve SubType polymorphism using Generics?\n\
    \n# Overriding\n\n* Method overriding is redefining the base class method to behave\
    \ in a different manner than its implementation in the base class.\n* Method overriding\
    \ is an example of dynamic or runtime polymorphism.\n* In dynamic polymorphism,\
    \ the runtime takes the decision to call an implementation, as the compiler does\
    \ not know what to bind at compile time.\n\n### Rules for method overriding\n\
    * Method arguments and their order must be the same in the overriding method.\n\
    * Overriding methods can have the same return type or subtype of the base class\
    \ method's return type.\n* The access modifier of the overridden method cannot\
    \ be more restrictive than its definition in the base class.\n* Constructor, static,\
    \ and final method cannot be overridden.\n* The overridden method cannot throw\
    \ checked exceptions if its definition in base class doesn't, though the overridden\
    \ method can still throw an unchecked exception.\n\n### Questions\n* What is method\
    \ overriding?\n* What is dynamic polymorphism?\n* Why can't you override static\
    \ methods defined in super-class or interface?\n* Can you override a final method\
    \ defined in super-class?\n* Can you override a public method in super-class and\
    \ mark it protected?\n* Why can't you override constructor of super-class?\n*\
    \ Can an overridden method throw checked exception; when the method in super-class\
    \ does not? Why?\n* What are the benefits of method overriding?\n"
