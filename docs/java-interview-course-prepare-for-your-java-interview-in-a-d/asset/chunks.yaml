    \ operator and equals() method, depending upon what we want to compare.Equality\
    \ OperatorsFor reference types, the equality operators == and != are used to compare\
    \ the addresses of two objects in memory and not their actual content..equals()\
    \ MethodUse equals() method when you want to compare the content of two objects.\
    \ Object class in Java defines equals() method, which must be overridden by the\
    \ subclasses to facilitate content comparison between its objects. If the equal()\
    \ method is not overridden by a class, then the equals() method of the java.lang.Object\
    \ class is called, which uses an equality operator to compare references.Questions\n\
    \n*   What are the different ways to compare types in Java?\n\n*   What does the\
    \ equality operator compare for the reference types?\n\n*   What does the equals\
    \ method compare?\n\n*   When would you prefer using equals method to equality\
    \ operator?\n\n*   What happens if a class does not override the equals method?\n\
    \nFloat ComparisonTwo float numbers should not be compared using equality operator\
    \ ==; as the same number, say 0.33, may not be stored in two floating-point variables\
    \ exactly as 0.33, but as 0.3300000007 and 0.329999999767.So to compare two float\
    \ values, compare the absolute difference of two values against a range.if ( Math\
    \ .abs( floatValue1 - floatValue2 ) < EPSILON ){\n\n     //\n\n}where EPSILON\
    \ is a very small number like 0.0000001, and that depend on the desired precision.Questions\n\
    \n*   Why shouldn't you use the equality operator to compare float value?\n\n\
    *   What is the preferred way to compare two float values?\n\n*   What should\
    \ be the criteria to decide on the value of the range that should be used to compare\
    \ two float values?\n\nString ComparisonString class object uses equality operator\
    \ , ==, to tests for reference equality and equals() method to test content equality.You\
    \ should always use equals() method to compare the equality of two String variables\
    \ from different sources. [Interned](#text00058.html_a3W0) Strings can be compared\
    \ using equality operators too.Questions\n\n*   Why should you use the equals\
    \ method to compare String objects?\n\n*   What is the pitfall of using an equality\
    \ operator to compare two String objects?\n\n*   What are interned string? How\
    \ can you compare two interned strings?"
