    \ TreeMap<>());\n\n    sort( new ConcurrentSkipListMap<>());\n\n    sort( new\
    \ TreeMap<>());\n\n}public static void sort(Map map){\n\n    // perform sort\n\
    \n}Benefits of programming to interface\n\n*   Based on the context, you can runtime\
    \ select the most appropriate behavior.\n\n*   For testing, you can pass mock\
    \ objects or stubs implementation.\n\n*   The interface/API definitions or the\
    \ contract does not change frequently.\n\n*   Programming to Interface also facilitates\
    \ parallel development between teams, as developers from different ream can continue\
    \ writing code against an interface before doing final integration.\n\nQuestions\n\
    \n*   What is the concept of programming to interface?\n\n*   What are the benefits\
    \ of programming to interface?\n\n*   How does programming to interface facilitate\
    \ decoupling between software components?\n\n*   How dependency injection and\
    \ programming to the interface are inter-related? Can you achieve dependency injection\
    \ without supporting programming to interface?\n\n*   What are the benefits of\
    \ modular software?\n\n*   How does programming to interface help with unit testing?\n\
    \nAbstract Class vs InterfaceAbstract ClassAn Abstract class cannot be instantiated\
    \ but can be extended. Extend abstract class when you want to enforce a common\
    \ design and implementation among classes, and expect the derived class to implement\
    \ required specialized functionality.InterfaceThe Interface is a set of related\
    \ methods, which defines its behavior and its contract with the outside world.\
    \ Use an interface when you want to define common behavior among unrelated classes.\
    \ An interface can also be defined without any method and such interface is known\
    \ as marker interface; such interfaces are generally used to categorize the classes.\
    \ An example of a marker interface is java.io.Serializable , which does not define\
    \ any method but must be implemented by the classes that support serialization.Difference\
    \ between Abstract Class and Interface\n\n*   An Abstract class can be updated\
    \ to add more capabilities to a class whereas Interface can be added to implement\
    \ new behavior to the class. Though with the introduction of [default interface\
    \ methods](#text00020.html_a3UR) , even Interfaces can be extended to have more\
    \ capabilities.\n\n*   An Interface can be multiple inherited; whereas, an abstract\
    \ class cannot.\n\n*   Interface define behavior, so it can even be applied to\
    \ unrelated classes; whereas, related classes extend Abstract class.\n\n*   Abstract\
    \ class methods can have any type of access modifier; whereas, Interface has all\
    \ public members.\n\n*   An Abstract class can have state associated, which is\
    \ not possible with Interface.\n\n*   An Abstract class can be extended without\
    \ breaking the classes that extend it; whereas, any change in Interface, except\
    \ for non-default and non-static methods, will break the existing implementation.\n\
    \nQuestions\n\n*   If an abstract class cannot be instantiated, then what could\
    \ be a need to define a constructor for an Abstract class?\n\n    *   A constructor\
    \ can be used to perform the required field initialization and also to enforce\
    \ class constraints.\n\n*   Define Abstract class? What role an Abstract class\
    \ plays in a class design?\n\n*   Define Interface? What role does Interface play\
    \ in class design?\n\n*   When would you prefer using Abstract class over Interface\
    \ and vice-versa?\n\n*   Explain various differences between Abstract Class and\
    \ Interface?\n\n*   What are marker interfaces? How are marker interfaces used?\n\
    \n*   Can you declare an interface method static?\n\n*   With the introduction\
    \ of default interface methods; how Abstract class is still different from an\
    \ Interface?"
