    \ 方法。\n\n## 同步与并发集合\n\n同步类和并发类都提供线程安全，但它们的主要区别在于可扩展性和性能。\n\n### 集合同步\n\n* 集合同步通过允许一次仅有一个线程访问集合来实现。\n\
    * 同步通过将所有方法标记为 `synchronized` 来实现。\n* 任何调用多个方法的复合操作都需要客户端进行处理。\n* 同步集合的示例包括 `HashTable`、`HashSet`\
    \ 和同步 `HashMap`。\n\n### 并发集合\n\n* 集合并发通过允许多个线程同时访问集合来实现。\n* `ConcurrentHashMap`\
    \ 通过根据哈希值将集合划分为多个桶并使用不同的锁来保护每个哈桶，实现了非常细粒度的锁定。\n* 性能显著优，因为它允许多个写入者同时访问集合，而不需要锁定整个集合。\n\
    * 并发集合的示例包括 `ConcurrentHashMap`、`CopyOnWriteArrayList` 和 `CopyOnWriteHashSet`。\n\
    \n对于大型集合，优先使用 `ConcurrentHashMap` 等并发集合而不是 `HashTable`，因为并发集合的锁定开销更小，性能更好。注意，在存在相互操作依赖的多线程中，你仍然需要为并发集合的复合操作提供同步访问，如下所示：\n\
    \n```java\nObject synchObject = new Object();\n\nConcurrentHashMap < String ,\
    \ Account > map = new ConcurrentHashMap<>();\n\npublic void updateAccount( String\
    \ userId) {\n    synchronized ( synchObject ) {\n        Account userAccount =\
    \ map .get(userId);\n        if ( userAccount != null ) {\n            // some\
    \ 操作\n        }\n    }\n}\n```\n\n"
- fmt: "\n* What is collection concurrency?\n* How do you achieve collection synchronization?\n\
    * How do you ensure coordinated collection access when a composite operation needs\
    \ several methods to complete the task?\n* How do you achieve collection concurrency?\n\
    * How does `ConcurrentHashMap` offer multiple threads concurrent access to the\
    \ same collection?\n* Why performance of `ConcurrentHashMap` is better even though\
    \ it allows simultaneous writes from multiple threads?\n* What would you prefer\
    \ between the `ConcurrentHashMap` and the `HashTable`? Why?\n\n## Iterating Over\
    \ Collections\nThere are several ways to iterate over a collection in Java. The\
    \ following are the most common methods.\n\n### Iterable.forEach\nThe `forEach`\
    \ method is available with the collections implementing the `Iterable` interface,\
    \ and the `forEach` method takes a parameter of type `Consumer`.\n\n```java\n\
    List<Account> accounts = Arrays.asList(\n    new Account(123),\n    new Account(456)\n\
    );\naccounts.forEach(acc -> print(acc));\n```\n\n### for-each looping\n* A for-each\
    \ loop can be used to loop the `map.entrySet()`, to get key and value both.\n\
    ```java\nfor (Map.Entry<String, Account> accountEntry : map.entrySet()) {\n  \
    \  print(\"UserId - \" + accountEntry.getKey() + \", \" +\n          \"Account\
    \ - \" + accountEntry.getValue());\n}\n```\n* A for-each loop can be used to loop\
    \ `map.keyKeys()` to get keys.\n* A for-each loop can be used to loop `map.values()`\
    \ to get values.\n* While running a for-each loop, collection cannot be modified.\n\
    * A for-each loop can only be used to navigate forward.\n\n### Iterator\n* The\
    \ `Iterator` can move in both directions backwards and forward.\n* When using\
    \ the `Iterator`, you can remove entries during an iteration, which is not possible\
    \ when you use a for-each loop.\n* The for-each loop also uses `Iterator` internally.\n\
    ```java\nIterator<Map.Entry<String, Account>> accountIterator = map.entrySet().iterator();\n\
    while (accountIterator.hasNext()) {\n    Map.Entry<String, Account> accountEntry\
    \ = accountIterator.next();\n    print(\"UserId - \" + accountEntry.getKey() +\
    \ \", \" +\n          \"Account - \" + accountEntry.getValue());\n}\n```\n\n###\
    \ Notes\n* The for-each loop should be preferred over the `for` loop, as the `for`\
    \ loops can be the source of errors, specifically related to index calculations.\n\
    * The `Iterator` is considered more thread-safe because it throws an exception\
    \ if the collection changes during iteration.\n\n## Data Independent Access\n\
    The code should be written in such a way that client code should not be aware\
    \ of the internal structure used to store the collection. This enables making\
    \ internal changes without breaking any client code. So to facilitate data-independent\
    \ access to the collection, it must be exposed such that the `Iterator` can be\
    \ used to iterate through all the elements of the collection.\n\n### Questions\n\
    * Explain different ways to iterate over collection?\n* Can you modify the collection\
    \ structure while iterating using a for-each loop?\n* Can you modify a collection\
    \ element value while iterating using a for-each loop?\n* What are the limitations\
    \ with the for-each loop, regarding the navigation direction?\n* What is different\
    \ between the for-each loop and the `Iterator`, regarding the navigation direction?\n\
    * Can you modify the collection structure while iterating using an `Iterator`?\n\
    * Can you modify a collection element value while iterating using an `Iterator`?\n\
    * Between the for-each loop and the `for` loop, which one should you prefer? Why?\n\
    * Why `Iterators` are considered more thread-safe?\n* Explain the concept of Data\
    \ Independent Access of the collection?\n* How can you design your class to provide\
    \ Data Independent Access to the collections used in the class?\n\n## Fail Fast\n\
    The `Iterator` methods are considered fail-fast because `Iterator` guards against\
    \ any structural modification made to the. This ensures that any failure is reported\
    \ quickly rather than application landing into a corrupt state sometime later.\
    \ In such a scenario, `ConcurrentModificationException` is thrown. The `Iterators`\
    \ from `java.util` are fail fast.\n\n### Questions\n* What is the term fail-fast\
    \ used in collection iteration?\n* What is the benefit of a fail-fast iterator?\n\
    * What is a fail-safe iterator?\n* The fail-safe iterator doesn't throw any exception\
    \ when a collection is modified, because fail-safe iterator works on the clone\
    \ of the original collection. Iterators from `java.util.concurrent` package is\
    \ fail-safe.\n\n## ERROR AND EXCEPTION HANDLING\n### Exception\nException class\
    \ hierarchy in java:\n\n* An exception is an abnormal situation that interrupts\
    \ the flow of program execution.\n* All exceptions inherit from `Throwable`.\n\
    * You subclass `Exception` class if you want to create a checked exception or\
    \ `RuntimeException` if you want to create an unchecked exception.\n* Though you\
    \ can subclass `Throwable` to create checked exception, this not recommended as\
    \ `Throwable` is root-class for all exceptions and errors.\n\n### Questions\n\
    * What is an Exception?\n* What are the root level exceptions in Java?\n* Which\
    \ super-class should you subclass to create checked exception?\n* Which super-class\
    \ should you subclass to create unchecked exceptions?\n\n### Checked vs Unchecked\
    \ Exception\n* The checked exceptions are checked at compile time.\n* Except for\
    \ `RuntimeException` and `Error`, the checked exceptions extend `Throwable`.\n\
    * The checked exceptions are programmatically recoverable.\n* You can handle checked\
    \ exceptions either by using `try/catch` or using `throws` clause in method declaration.\n\
    * Static initializers cannot throw checked exceptions.\n\n```java\npublic static\
    \ void main(String args[]) {\n    FileInputStream fis = null;\n    try {\n   \
    \     fis = new FileInputStream(\"details.txt\");\n    } catch (FileNotFoundException\
    \ fnfe) {\n        System.out.println(\"Missing File :\" + fnfe);\n    }\n}\n\
    ```\n\n### Unchecked Exception\n* The unchecked exceptions are checked at runtime.\n\
    * Unchecked exceptions extend `RuntimeException`.\n* You can't fairly hope to\
    \ recover from those exceptions.\n* The unchecked exceptions can be avoided using\
    \ good programming techniques.\n* Throwing unchecked exceptions helps to reveal\
    \ shortcomings.\n\n```java\npublic int getAccountBalance(String customerName)\
    \ {\n    int balance = 0;\n    if (customerName == null) {\n        throw new\
    \ IllegalArgumentException(\"Null argument\");\n    }\n    // logic to return\
    \ balance\n    return balance;\n}\n```\n\n### Error\n* The error classes are used\
    \ to define irrecoverable and fatal exceptions, which the applications are not\
    \ supposed to catch.\n* Generally programmers cannot do anything to recover from\
    \ these exceptions.\n* Even if you catch `OutOfMemoryError`, you may get it again\
    \ because there is a high probability that the Garbage Collector may not be able\
    \ to free memory.\n\nUse checked exception only for the scenario where failure\
    \ is expected and there is a very reasonable way to recover from it; for anything\
    \ else use unchecked exception.\n\n### Questions\n* What are the checked exceptions?\n\
    * What are the unchecked exceptions?\n* What types of exceptions does the `Error`\
    \ class in Java defines?\n* How can you handle checked exceptions?\n* What happens\
    \ if an exception is unhandled?\n* What are the different ways to handle checked\
    \ exceptions?\n* Which exception classes will you use in the catch block to handle\
    \ both: checked and unchecked exceptions?\n* How do you choose between checked\
    \ and unchecked exceptions?\n* Can you throw checked exceptions from the static\
    \ initializer block? Why?\n    * You cannot throw because there is no specific\
    \ place to catch it and it's called only once. You have to use `try/catch` to\
    \ handle checked exceptions.\n* What should you do to handle an Error?\n"
