  trans: "\n\n# 异常处理最佳实践\n\n尽管异常处理主要由上下文驱动，但在异常处理策略上必须保持一致性。以下是异常处理的一些最佳实践：\n\n1.\
    \ 永远不要抑制异常 - 因为这可能导致程序处于不安全且不稳定的状态。\n2. 不要进行过度的异常处理 - 特别当你不知道如何完全从异常中恢复时。\n3.\
    \ 永远不要吞掉（swallow）异常 - 因为这可能导致应用程序处于不一致的状态，最糟糕的是还没有记录发生的原因。\n4. 不要捕获异常并继续程序执行 -\
    \ 带有某些默认行为执行。今天定义的默认行为在未来可能不再有效。\n5. 不要向用户显示通用的错误信息 - 相反，请清理异常处理代码以报告用户友好的消息，并对下一步操作提供建议。\n\
    6. 不要在一个单个 `try-catch` 中放置多个一个异常场景 - 因为这将导致无法确定异常的原因。\n7. 不要在一个单个 `catch` 块中捕获多个受检异常\
    \ - 因为这将无法确定异常的原因。\n8. 不要不必要的包装异常 - 这可能会掩盖真实的源头。\n9. 不要泄露敏感信息 - 相反，对于专门从可能泄露敏感信息的源生成的异常进行清洗。\n\
    10. 始终记录异常 - 除非有充分的理由不这样做。\n11. 不要捕获 `Throwable` - 因为这将无法确定异常的原因。\n12. 不要使用异常来控制执行流\
    \ - 相反，在可能的情况下使用布尔值来验证条件。\n13. 程序化处理不同的场景 - 不要将所有代码逻辑都放在 `try` 块中。\n14. 显式命名线程\
    \ - 在多线程应用程序中，这极大简化了调试。\n15. 永远不要抛出通用异常 - 因为这将无法确定异常的原因。\n\n## 问题\n\n* 描述一些异常处理的最佳实践？\n\
    * 抑制异常的陷阱是什么？\n* 显示通用错误信息有什么问题？\n* 异常被吞掉的缺点是什么？\n* 在单个 catch 块中处理多个异常的陷阱是什么？\n\
    * 如果异常从包含敏感信息的源抛出，你会怎么做？在这种情况下你会记录什么？向用户显示什么消息？\n* 将所有异常都包装进一个通用异常类的陷阱是什么？\n*\
    \ 为什么你不应该使用异常来控制程序的执行流？\n* 你应该记录所有异常吗？为什么？\n* 为什么你不应该使用 `Throwable` 或其他根类来捕获异常？\n\
    * 应该使用什么标准来判断哪些代码块应该包含在 `try` 块中？\n* 如果进行了多个方法的嵌套调用，你会为每个方法使用 `try-catch` 吗？为什么？\n\
    \n`try-with-resources` 是 Java 语言的一种构造，它使得自动关闭 `try` 语句包含的资源更容易。\n\n```java\ntry\
    \ (FileInputStream fis = new FileInputStream(\"details.txt\")) {\n    // 读取数据的代码\n\
    }\n```\n\n* 使用 `try-with-resources` 的资源必须继承 `AutoCloseable` 接口。\n* 你可以在 `try`\
    \ 块中指定多个资源。\n\n## 问题\n\n* 你可以使用哪种 Java 构造来自动关闭系统资源？\n* 在 `try-with-resource` 构造中使用类对象时，资源必须继承哪个接口？\n\
    \n# 多线程\n\n## 线程术语\n\n* 线程是进程中可执行代码的最小单元。\n* 程序是一组有序的操作。\n* 进程是程序的实例。\n* `Context\
    \ Switch`（上下文切换）是存储和恢复线程状态的昂贵过程。\n* 并行处理是在多个核心上同时执行相同的任务。\n* 多线程是 CPU 并发执行多个进程或线程的能力。\n\
    * 当两个线程互相等待对方释放锁时，就会发生死锁。\n\n## 基本概念\n\n* 所有的 Java 程序都从用户线程上的 `main()` 方法开始。\n\
    * 当没有剩余的用户线程可以执行时，程序终止。\n* `Thread` 维护一个私有栈和系列待执行的指令。\n* `Thread` 拥有一个名为 `thread-local\
    \ storage`（线程本地存储）的私有内存，在多线程环境中可用于存储线程当前操作相关的数据。\n* JVM 允许进程拥有多个线程。\n* 每个线程都有优先级。\n\
    \n## 问题\n\n* 什么是线程？\n* 什么是程序？\n* 什么是进程？\n* 线程和进程的区别是什么？\n* 程序和进程的区别是什么？\n* 解释一下线程的上下文切换？\n\
    * 什么是并行处理？\n* 什么是多线程？\n* 并行处理和多线程之间有什么关系？\n* 什么是死锁？\n* 什么是用户线程？\n* 什么是线程本地存储？你应该用线程本地存储存储什么类型的对象？\n\
    * 线程共享栈内存吗？\n\n## 线程生命周期\n\n以下是线程状态的不同阶段：\n* **New**（新创建）：线程已创建但未启动。\n* **Runnable**（可运行）：线程正在运行。\n\
    * **Blocked**（阻塞）：线程正在等待进入关键区域。\n* **Waiting**（等待）：线程通过调用 `wait()` 或 `join()`\
    \ 进行等待。\n* **Time-waiting**（计时等待）：线程通过调用带超时的 `wait()` 或 `join()` 进行等待。\n* **Terminated**（已终止）：线程已完成任务并退出。\n\
    \n注意：你可以使用 `getState()` 方法获取线程的状态。\n\n## 问题\n\n* 描述线程生命周期的不同阶段？\n* 阻塞状态和等待状态的区别是什么？\n\
    * 如何获取线程状态？\n* 线程睡眠和线程等待有什么区别？\n\n## 线程终止\n\n应该通过调用 `interrupt()` 方法来停止线程。对线程调用\
    \ `interrupt()` 甚至可以跳出 `Thread.sleep()` 状态。\n\n```java\nif (Thread.currentThread().isInterrupted())\
    \ {\n    // 清理并停止\n    // 例如跳出循环\n}\n```\n\n注意：`stop()`、`suspend()` 和 `resume()`\
    \ 方法已被废弃，因为使用这些方法可能导致程序处于不一致的状态。\n\n## 问题\n\n* 定义一种良好的线程终止策略？\n* 什么是线程中断？线程中断方法与线程停止方法有什么区别？\n\
    * 如果线程正在睡眠时你对线程调用中断会发生什么？\n* 调用中断会立即停止线程吗？\n\n## 实现 Runnable 与 扩展 Thread\n\n实现\
    \ `Runnable` 接口的线程：\n```java\npublic class RunnableDerived implements Runnable\
    \ {\n    public void run() {\n    }\n}\n```\n\n扩展 `Thread` 类的线程：\n```java\npublic\
    \ class ThreadDerived extends Thread {\n    public void run() {\n    }\n}\n```\n\
    \n* `Runnable` 的 `run()` 方法不会构造新线程，而是在创建它的同一个线程中作为普通进程运行，而 `Thread` 的 `start()`\
    \ 方法会构造新线程。\n* 除非你要对 `Thread` 类进行特殊化（这在大多数情况下是不可能的），否则 `Runnable` 是创建线程的首选方式。\n\
    \n## 问题\n\n* 创建线程的不同方式有哪些？\n* 实现 `Runnable` 接口与扩展 `Thread` 类有什么区别？\n* 什么时候应该扩展\
    \ `Thread` 类？\n* 什么时候应该继承 `Runnable` 接口？\n\n"
- fmt: "\n\n# Questions\n\n- Which one is the preferred way between `Runnable` and\
    \ `Thread`?\n- Does implement `Runnable` creates a thread?\n- Both `Thread` class\
    \ and `Runnable` Interface have `run` methods, what is the difference?\n\n## Runnable\
    \ vs Callable Interface\n\n### Runnable Interface\n```java\n@FunctionalInterface\n\
    public interface Runnable {\n    public abstract void run();\n}\n```\n\n### Callable\
    \ Interface\n```java\n@FunctionalInterface\npublic interface Callable<V > {\n\
    \    V call() throws Exception ;\n}\n```\n\n- A `Runnable` cannot return a result\
    \ and cannot throw a checked exception.\n- A `Callable` needs to implement a `call()`\
    \ method while a `Runnable` needs to implement the `run()` method.\n- A `Callable`\
    \ can be used with `ExecutorService` methods but a `Runnable` cannot.\n\n### Questions\n\
    - What is the difference between the `Callable` and `Runnable` interface?\n- What\
    \ is the benefit of using `Runnable` over `Callable`?\n- Can you throw checked\
    \ exceptions from the `Runnable` interface?\n- Why `Runnable` and `Callable` interfaces\
    \ called Functional Interface?\n- Which Interface returns the result: `Runnable`\
    \ or `Callable`?\n\n## Daemon Thread\n\nA daemon thread is a thread, which allows\
    \ JVM to exit as soon as the program. As soon as JVM halts, all the daemon threads\
    \ exist without unwinding stack or letting any `finally` blocks to execute. Daemon\
    \ thread executes on very low priority.\n\nThreads inherit the daemon status or\
    \ parent thread, which means that any thread that is created by the `main` thread\
    \ will be a non-daemon thread. Generally, the daemon threads are used to support\
    \ background tasks or services for the application. Garbage Collection happens\
    \ on Daemon thread.\n\nYou can create a daemon thread like the following:\n\n\
    ```java\nThread thread = new Thread();\nthread .setDaemon(true );\n```\n\nAll\
    \ non-daemon threads are called user threads. Those threads stop the JVM from\
    \ closing. The process terminates when there are no more user threads. The Java\
    \ `main` thread is always a user thread.\n\n### Questions\n- What is a daemon\
    \ thread?\n- What is user thread? What is the `main` thread?\n- Can a program\
    \ exit if daemon thread is still running?\n- Can a program exit if the user thread\
    \ is still running?\n- Does a `finally` block on a Daemon thread still get a chance\
    \ to execute When THE JVM halts exiting all the Daemon thread?\n- When a new thread\
    \ is created; is it created as a user thread or a Daemon thread?\n- What happens\
    \ if no user thread is running but a Daemon thread is still running?\n- What is\
    \ Java's `main` thread: a user thread or a Daemon thread?\n- What type of thread\
    \ is created when you create a new thread on a `main` thread: daemon or user?\n\
    - What kind of work you can use Daemon thread for?\n\n## Race Condition and Immutable\
    \ Object\n\nA race condition arises when multiple threads access shared data simultaneously\
    \ to modify it. As the order of data read and write by these threads cannot be\
    \ predicted, this can lead to an unpredictable data value.\n\nAn object is considered\
    \ immutable when there is no possibility of its state change after the construction.\
    \ If an object is immutable, it can be shared across multiple threads without\
    \ worrying about the race conditions.\n\n### To make an object Immutable\n- Declare\
    \ the class `final`.\n- Allow only constructor to create an object. Don't provide\
    \ field setter.\n- Mark all the field `private`.\n\n### Questions\n- How immutable\
    \ objects help to prevent race conditions?\n- Why is race condition capable of\
    \ generating unpredictable results?\n- Why immutable objects are considered safe\
    \ in a multi-threaded environment?\n- Why it's suggested to declare an immutable\
    \ class as `final`?\n- Why constructor should be the only way to construct an\
    \ immutable object? What happens if setters are provided?\n\n## Thread Pool\n\n\
    Thread Pool is a set of a number of worker threads that exist separately from\
    \ the `Runnable` and `Callable` tasks. A fixed thread Pool reduces the overhead\
    \ of thread creation. It helps the application to degrade gracefully when there\
    \ is a surge in request that go beyond its capacity to process, by preventing\
    \ an application from entering into a hanging state or crashing.\n\nThread Pool\
    \ also enables a loosely coupled design by decoupling the creation and execution\
    \ of tasks. Creating a fixed thread pool is easy with the help of `Executors`\
    \ class, where you can use the `newFixedThreadPool()` factory method to create\
    \ `ExecutorService` to execute tasks.\n\n### Questions\n- What is a thread pool?\n\
    - How does a thread pool reduce the overhead of thread creation?\n- How does a\
    \ thread pool help to prevent an application from hanging or crashing?\n- What\
    \ is a fixed thread pool and how is it created?\n- How does the thread pool enables\
    \ loosely coupled design?\n\n## SYNCHRONIZATION\n\n### Concurrent vs Parallel\
    \ vs Asynchronous\n\nParallel processing is the simultaneous execution of the\
    \ same task on multiple cores. Concurrent processing is the simultaneous execution\
    \ of multiple tasks; either on multiple cores or by a pre-emptively time-shared\
    \ thread on the processor.\n\nAsynchronous processing is independent execution\
    \ of a process, without waiting for a return value from intermediate operations.\n\
    \n### Questions\n- Explain concurrent processing?\n- Explain parallel processing?\n\
    - Explain asynchronous processing?\n- Explain the difference between concurrent\
    \ and parallel processing?\n- Does parallel processing require multiple threads?\n\
    - When an application is concurrent but not parallel?\n    - When application\
    \ processes multiple operations simultaneously without dividing these operations\
    \ further into smaller tasks.\n- When an application is parallel but not concurrent?\n\
    \    - When application processes one operation dividing the operation into smaller\
    \ tasks that are processed in parallel.\n- When an application is neither concurrent,\
    \ not parallel?\n    - When application processes only one operation without dividing\
    \ the operation into smaller tasks.\n- When an application is both concurrent\
    \ and parallel?\n    - When application processes multiple operations simultaneously\
    \ and also dividing these operations further into smaller tasks that are processed\
    \ in parallel.\n\n## Thread Synchronization\n\nA race condition occurs when multiple\
    \ threads access shared data to modify it. As it is not possible to predict the\
    \ order of data read and write by these threads, it may lead to an unpredictable\
    \ data value.\n\nCritical Section is the block of code that if accessed concurrently,\
    \ by more than one thread, may have undesirable effects on the outcome. Thread\
    \ Synchronization is controlling access to the critical sections to prevent undesirable\
    \ effects in the program. Synchronization establishes a memory buffer, known as\
    \ happen-before, which ensures that any other thread that subsequently acquires\
    \ the same local objects may access all changes made by the thread to the local\
    \ objects.\n\n### Questions\n- Explain race condition in multi-threading?\n- What\
    \ is a critical section?\n- What is thread synchronization?\n- What is a memory\
    \ barrier?\n- What is the concept of happen-before in thread synchronization?\n\
    \n## Synchronized Method vs Synchronized Block\n\nThe `synchronized` keyword is\
    \ used to mark a critical section in the code. Mutual exclusion synchronization\
    \ is achieved using locking the critical section using the `synchronized` keyword.\
    \ This can be done in the following two ways.\n\n### Marking a method as a critical\
    \ section\n```java\nclass DatabaseWrapper {\n    Object reference = new Object();\n\
    \    // Method marked as critical section\n    public synchronized void writeX()\
    \ {\n        // code goes here\n    }\n    // Method marked as critical section\n\
    \    public static synchronized void writeY() {\n        // code goes here\n \
    \   }\n}\n```\n\n### Marking block of code as a critical section\n```java\npublic\
    \ void writeToDatabase() {\n    // multiple threads can reach here// Code marked\
    \ a critical section\n    synchronized (this ) {\n        // only one thread can//\
    \ execute here at a time\n    }\n    // multiple threads can execute here\n}\n\
    ```\n\nNotes\n"
