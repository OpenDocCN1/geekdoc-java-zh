  trans: "\n\n# 枚举比较\n\n`ComparisonEnum` 既不能实例化也无法复制。因此，始终只有一个枚举的实例可用，即在枚举定义中定义的那个实例。由于只有一个枚举实例可用，你可以同时使用等价运算符（==`）和\
    \ `equals()` 方法进行比较。但建议优先使用等价运算符 `==`，因为它不会抛出 `NullPointerException`，并且还能执行编译时的兼容性检查。\n\
    \n### 问题\n* 比较两个枚举的不同方法有哪些？\n* 解释一下为什么你可以同时使用等价运算符和 `equals` 方法来比较枚举？\n* 比较两个枚举值的首选方式是哪种？\n\
    \n## 枚举与公共静态字段\n\n以下代码演示了 `enum` 和 `public static field` 的用法。以下是使用 `enum` 替代 `public\
    \ static int` 的优点。\n\n* `Enums` 是在编译时检查的，而 `int` 值不是。使用 `public static int`，你可以向\
    \ `AddVehicle()` 方法传递任何 `int` 值。\n* `int` 值需要根据预期的范围进行验证；而 `enums` 不需要。\n* 位标志标志操作已内置在\
    \ `enumSet` 中。\n\n```java\nprivate enum Vehicle {\n    CAR,\n    JEEP,\n    MOTORCYCLE,\n\
    \    SCOOTER\n};\n\npublic void AddVehicle(Vehicle vehicle){\n}\n\npublic static\
    \ field\npublic static int CAR = 0;\npublic static int JEEP = 1;\npublic static\
    \ int MOTORCYCLE = 2;\npublic static int SCOOTER = 3;\npublic void AddVehicle(int\
    \ vehicle){\n}\n```\n\n### 问题\n* 使用 `enum` 相比 `public static int` 字段的优点是什么？\n\
    * 与 `enum` 参数相比，为什么你需要对 `int` 参数进行额外的验证？\n* 为什么你应该倾向于使用 `enum` 而不是 `public static\
    \ int`？\n\n## 包装类\n\n每个基本数据类型都有一个对应的类，将该基本数据类型封装成该类的对象。包装类提供了许多实用方法来操作基本数据值。由于包装类允许基本数据类型转换为引用类型，因此它们也可以与集合一起使用。\n\
    \n### 问题\n* 什么是包装类？\n* 使用包装类型而非基本数据类型的优点是什么？\n* 如何在集合中使用基本数据类型？\n\n## 自动装箱与自动拆箱\n\
    \n自动装箱（Auto boxing）是将基本类型转换为对象的过程，涉及动态内存分配和相应的包装类对象的初始化。自动拆箱（Auto unboxing）是将包装类转换为基本类型的过程。\n\
    \n在下面的代码中，`23.456f` 被自动装箱为对象 `Float(23.456f)`，从 `addTax()` 返回的值被自动拆箱为 `float`。\n\
    \n```java\npublic static void main(String [] args){\n    float beforeTax = 23.456f;\n\
    \    float afterTax = addTax(beforeTax);\n}\n\npublic static Float addTax(Float\
    \ amount){\n    return amount * 1.2f;\n}\n```\n\n### 问题\n* 什么是自动装箱和自动拆箱？\n* 自动装箱的优点是什么？\n\
    \n## BigInteger 和 BigDecimal\n\n`BigInteger` 和 `BigDecimal` 用于处理大于 `Long.MAX_VALUE`\
    \ 和 `Double.MAX_VALUE` 的值。这些大值作为 `String` 值传递给 `BigInteger` 和 `BigDecimal` 的构造函数。`BigDecimal`\
    \ 支持通过实用方法指定所需的舍入方式和应用的精度。\n\n```java\nBigInteger bInt = new BigInteger(\"9876543210987654321098765\"\
    );\n```\n\n`BigInteger` 和 `BigDecimal` 对象都是不可变的，因此对它们进行的任何操作都会创建一个新对象。`BigInteger`\
    \ 主要用于加密和安全应用。\n\n### 问题\n* `BigInteger` 和 `BigDecimal` 类型是什么？\n* `BigInteger`\
    \ 和 `BigDecimal` 的值在内部是如何存储的？\n* `BigInteger` 的用途是什么？\n\n# 字符串 STRINGS\n\n## String\
    \ 的不可变性\n\n`String` 对象是不可变的，这意味着一旦构造完成，`String` 引用指向的对象就永远无法改变。尽管你可以将相同的引用赋予另一个\
    \ `String` 对象。考虑以下示例：\n\n```java\nString greeting = \"Happy\";\ngreeting = greeting\
    \ + \" Birthday\";\n```\n\n上述代码创建了三个不同的 `String` 对象：`\"Happy \"`、`\" Birthday\
    \ \"` 和 `\" Happy Birthday \"`。\n\n* 虽然你不能改变 `String` 对象的值，但你可以更改指向该对象的引用变量。在上面的示例中，`String`\
    \ 引用 `greeting` 开始指向 `String` 对象 `\"Happy Birthday\"`。\n* 注意，在 `String` 上执行的任何操作都会导致新的\
    \ `String`。\n* `String` 类被标记为 `final`，因此无法重写 `String` 类的不可变行为。\n\n### 优点\n* 由于\
    \ `String` 对象不需要同步，因此在线程之间共享 `String` 对象是安全的。\n* 由于 `String` 不改变，Java 环境将 `String`\
    \ 字面量缓存到内存中称为“字符串池”（String Pool）的特殊区域以进行优化。如果池中已存在 `String` 字面量，则共享同一个字符串字面量。\n\
    * 不可变的 `String` 值可以防止执行过程中发生任何值的更改。\n* 由于 `String` 对象的哈希值不会改变，可以缓存哈希值而不需要在每次需要时重新计算。\n\
    \n### 缺点\n* `String` 类无法扩展以提供额外的功能。\n* 如果由于字符串操作创建了大量的 `String` 字面量，会给垃圾收集带来压力。\n\
    \n### 问题\n* 为什么 `String` 对象是不可变的？\n* `String` 对象在内存中是如何创建的？\n* 不可变性的优点/缺点是什么？\n\
    * 为什么 `String` 对象是线程安全的？\n* 将 `String` 类声明为 `final` 有什么？\n* Java 环境对字符串进行了什么内存优化？\n\
    * 为什么不需要反复计算 `String` 对象的哈希值？\n\n## 字符串字面量与对象\n\n### 字符串字面量\n字符串字面量是 Java 语言的一种概念，`String`\
    \ 类将双引号内的字符串缓存到名为字符串池的特殊区域。\n\n```java\nString cityName = \"London\";\n```\n\n\
    ### 字符串对象\n`String` 对象使用 `new()` 运算符在堆中创建，与其他对象一样。\n\n```java\nString cityNameObj\
    \ = new String( \"London\");\n```\n\n### 问题\n* 什么是字符串字面量？\n* 字符串字面量和字符串对象有什么区别？\n\
    * 字符串字面量是如何存储的？\n\n## 字符串池化（String Interning）\n\n* 字符串池化是一种存储每个唯一不可变字符串副本的概念。\n\
    * 当你定义任何新的 `String` 字面量时，它会被池化。池中相同的字符串常量会被任何字符串字面量引用。\n* 字符串池字面量不仅在编译时定义，在运行时也定义。你可以显式地调用\
    \ `String` 对象的 `intern()` 方法将其添加到池中（如果不存在）。\n* 在内存池中放置大量的文本会导致内存泄漏或性能问题。\n\n注意：与其使用字符串对象，不如使用字符串字面量，以便编译器进行优化。\n\
    \n### 问题\n* 什么是字符串池化？\n* 字符串对象也可以被池化吗？\n* 当你存储一个已存在于字符串池中的新 `String` 字面量时会发生什么？\n\
    * 创建大量 `String` 字面量有什么缺点？\n* 优先使用字符串对象还是字符串字面量？为什么？\n\n## 字符串池内存管理\n\n字符串池是 Java\
    \ 编译器用于字符串内存优化的内存中的特殊区域。如果字符串池中已存在 `String` 字面量，编译器会将新的字符串字面量引用指向池中现有的字符串变量，而不是创建新的字面量。Java\
    \ 编译器可以执行这种优化是因为 String 是不可变的。\n\n```java\nString cityNameObj = new String( \"\
    London\");\n```\n\n"
- fmt: "\n`String capitalObj = new String ( \"London\" );`![](Image00008.jpg)Whereas\
    \ in this example below, both String literal reference to the same object in the\
    \ memory pool. `String cityName = \"London\" ;`\n\n`String capital = \"London\"\
    \ ;`![](Image00009.jpg)Questions:\n\n* Explain String Pool Memory Management?\n\
    * How are String Literals stored in memory?\n* How String Pool is optimized for\
    \ memory?\n* How are String Objects stored in memory?\n* Why can Java not use\
    \ a String Pool-like mechanism to store objects of other types of data?\n\n##\
    \ Immutability - Security Issue\n\nIt's the responsibility of the [Garbage Collector](#text00146.html_a3VR)\
    \ to clear string objects from the memory; though you can also [use reflection](#text00061.html_a3VS)\
    \ to do so, that's not recommended. Since Strings are kept in `String Pool` for\
    \ re-usability, chances are that the strings will remain in memory for a long\
    \ duration. As `String` is immutable and its value cannot be changed, a memory\
    \ dump or accidental logging of such `String` can reveal sensitive content like\
    \ password or account number, stored into it.\n\nSo instead, it's advisable to\
    \ use char array (`char []`) to store such sensitive information, which can be\
    \ explicitly overwritten by an overriding content, thus reducing the window of\
    \ opportunity for an attack.Questions:\n\n* How are String literals cleared from\
    \ the `String Pool`?\n* Can you use reflection to clear a `String` object?\n*\
    \ What are the security issues associated with the immutable Strings?\n* Why should\
    \ you not use Strings to store sensitive information such as passwords, access\
    \ keys, etc.?\n* What other data type can be used to store the password instead\
    \ of String?\n\n## Circumvent String Immutability\n\nImmutability feature in `String`\
    \ can be bypassed with reflection, though it is NOT recommended to use reflection\
    \ to do so because it is a violation of security and is considered an attack.\
    \ The following code demonstrates how reflection can be used to circumvent string\
    \ immutability:\n\n```java\nString accountNo = \"ABC123\" ;\nField field = String\
    \ . class .getDeclaredField( \"value\" );\nfield .setAccessible( true );\nchar\
    \ [] value = ( char []) field .get( accountNo );\n// Overwrite the content\nvalue\
    \ [ 0 ] = 'X' ;\nvalue [ 1 ] = 'Y' ;\nvalue [ 2 ] = 'Z' ;\n// Print \"XYZ123\"\
    \nSystem . out .println( accountNo );\n```\n\nQuestions:\n\n* Can you override\
    \ the `String` class to modify its immutability?\n* Is it possible to circumvent\
    \ string immutability?\n* Is it recommended to circumvent string immutability\
    \ using reflection? Why?\n\n## StringBuilder vs StringBuffer\n\n### Similarities\n\
    \n* Both `StringBuilder` and `StringBuffer` objects are mutable, so allows String\
    \ values to change.\n* The objects of both the classes are created and stored\
    \ in heap.\n* Both the classes have similar methods.\n\n### Differences\n\n* `StringBuffer`\
    \ methods are synchronized , so its thread-safe whereas `StringBuilder` is not.\n\
    * The performance of `StringBuilder` is significantly better than `StringBuffer`,\
    \ as `StringBuilder` does not have synchronization overheads.\n\nNote: If you\
    \ need to share String objects between threads then use `StringBuffer`, otherwise\
    \ `StringBuilder`.Questions:\n\n* What are the similarities and differences between\
    \ `StringBuffer` and `StringBuilder`?\n* When would you prefer `StringBuffer`\
    \ to `StringBuilder`?\n* Between `StringBuffer` and `StringBuilder`, which one\
    \ would you prefer in a single-threaded application?\n\n## Unicode\n\nUnicode\
    \ is an international standard character encoding system that represents most\
    \ of the written languages in the world. Before `Unicode`, there were multiple\
    \ encoding systems prevalent: `ASCII`, `KOI8`, `ISO 8859`, etc., each encoding\
    \ system having its code values and character set with different lengths. So to\
    \ solve this issue, a uniform standard is created, which is known as `Unicode`.\
    \ Unicode provides a platform and language independent unique number for each\
    \ character.Questions:\n\n* What are Unicode characters?\n* What are the advantages\
    \ of using Unicode characters?\n* What are the encoding systems problems which\
    \ predominated before Unicode?\n\n## INNER CLASSES\n\n`Inner Class` – is a class\
    \ within another class.\n`Outer Class` – is an enclosing class that contains the\
    \ inner class.\n\nNote:\n\n* The compiler generates a separate class file for\
    \ each inner class.\n\n### Advantages of inner classes\n\n* It's easy to implement\
    \ callbacks using inner classes.\n* The inner class has access to the private\
    \ members of the enclosing class that aren't even available to the inherited classes.\n\
    * The inner class helps to enforce closures that make the enclosing instance and\
    \ the surrounding scope available.\n* The outer classes provide additional namespace\
    \ to the inner classes.\n\nQuestions:\n\n* What is the inner class?\n* What is\
    \ the outer class?\n* What are the advantages of defining an inner class?\n* What\
    \ are closures? How inner class can be used to create closures?\n* What are callbacks?\
    \ How inner class can be used to create callbacks?\n* Can an inner class access\
    \ private members of the enclosing outer class?\n* What benefit does the outer\
    \ class bring?\n\n## Static Member Nested Class\n\n* A static nested class is\
    \ declared as `static` inside a class like any other member.\n* A static nested\
    \ class is independent and has nothing to do with the outer class. It is generally\
    \ used to keep together with the outer class.\n* It can be declared `public`,\
    \ `private`, `protected`, or at the package level.\n\nDeclaration of static nested\
    \ class:\n```java\n// outer class\npublic class Building {\n    // static member\
    \ inner class\n    public static class Block{\n}\n```\nCreating an object of static\
    \ nested class:\n```java\n// instance of static member class\nBuilding.Block block\
    \ = new Building();\n```\nQuestions:\n\n* What is static nested class?\n* Static\
    \ classes, nested or outer, are the same; then what's the benefit of defining\
    \ an inner class as static?\n\n### Inner Class\n\n* A local inner class is declared\
    \ and can be used inside a method.\n* It cannot be declared `public`, `private`,\
    \ or at the package level.\n\n```java\n// outer class\npublic class CityNames\
    \ {\n    private List <String> cityNames = new ArrayList<>();\n    Iterator <String>\
    \ nameIterator(){\n        // local class\n        class NameIterator implements\
    \ Iterator <String> {\n            @Override\n            public boolean hasNext()\
    \ {\n                return false ;\n            }\n            @Override\n  \
    \          public String next() {\n                return null ;\n           \
    \ }\n        }\n        // return an instance of local class\n        return new\
    \ NameIterator();\n    }\n}\n```\nNote:\n\n* To be able to use the inner class\
    \ outside, the local inner class must implement a public interface or Inherit\
    \ a public class and override methods to redefine some aspects.\n\nQuestions:\n\
    \n* What is the difference between an inner class and a local inner class?\n*\
    \ Why can't you use an access modifier with the local inner class?\n* Explain\
    \ the rules for defining local inner class?\n* What problem does local inner class\
    \ solve?\n\n### Non-Static Nested Class\n\n* A non-static nested class is declared\
    \ inside a class like any other member.\n* It can be declared `public`, `private`,\
    \ `protected`, or at the package level.\n* Non-static nested classes are closures\
    \ as they have access to enclosing instance.\n* An object of the outer class is\
    \ required to create an object of a non-static inner class.\n\nDeclaration of\
    \ non-static nested class:\n```java\n// outer class\npublic class Building {\n\
    \    // non-static member inner class\n    public class Block{}\n}\n```\nCreating\
    \ an object of non-static nested class:\n```java\n// instance of the outer class\n\
    Building building = new Building();\n// instance of non-static member inner class\n\
    Building.Block block = building . new Block();\n```\nQuestions:\n\n* What is a\
    \ non-static nested class?\n* Why a non-static nested class can be used as closures?\n"
