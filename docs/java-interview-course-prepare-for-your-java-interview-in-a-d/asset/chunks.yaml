  trans: "\n\n*   `Import`: 导入包，以便在代码中使用非限定名称使用类。\n*   `Class`: 类，表示具有属性和方法的类型模板。\n\
    *   `Field`: 字段，表示用于存储值的成员。\n*   `Method`: 方法，表示类的操作/行为。\n*   `Modifier`: 修饰符，指定类和/或成员的访问控制级别。\n\
    *   `Parameter`: 参数，指定方法定义中声明的变量。\n*   `Argument`: 实参，指定传递方法参数的数据。\n\n## Questions\n\
    * 什么是包（package）？\n* 为什么要导入包？\n* 为什么要指定访问修饰符？\n* 什么是静态导入（static import）？\n    *\
    \ `static import` 允许在不需要通过类名限定的情况下访问类的静态成员。\n* 实参和参数之间的区别是什么？\n\n## 在 JVM 中编译和执行\
    \ Java 代码\nJava 程序的编译和执行步骤![](img/Image00003.jpg)\n\n1. Java 编译器将 Java 源代码（`.java`\
    \ 文件）编译成一种二进制格式，称为字节码（`.class` 文件）。Java 字节码是一种平台无关的指令集，包含了指令（`opcode`）和参数信息。\n\
    2. 字节码由特定操作系统的 Java 虚拟机（`JVM`）翻译成特定平台的机器码。\n3. `JVM` 中的类加载器（Class loader）将类的二进制表示加载到内存中。\n\
    4. `JVM` 中的执行引擎（Execution engine）执行字节码并生成特定操作系统的机器指令。这些机器码指令由中央处理器（`CPU`）直接执行。\n\
    \n## Questions\n* 解释 Java 代码编译和执行的过程？\n* 什么是字节码？\n* 字节码和源代码之间的区别是什么？\n* 什么是机器码？\n\
    * 字节码和机器码之间的区别是什么？\n* 什么是 `JVM`？它对于不同的操作系统是相同还是不同？\n* `JVM` 的主要组件有哪些？\n* 类加载器在\
    \ `JVM` 中起什么？\n* 执行引擎在 `JVM` 中起什么？\n* 什么是机器指令？\n\n## 数据类型\n### 原始类型\n* 原始数据类型有\
    \ `byte`、`boolean`、`char`、`short`、`int`、`float`、`long` 和 `double`。\n* 原始类型始终有值；如果没有赋值，它将有一个默认值。\n\
    * `long` 值后面带有后缀 `L`（或 `l`）以区别于 `int`。\n* `float` 值后面带有后缀 `F`（或 `f`）以区别于 `double`。同样，`double`\
    \ 后面带有后缀 `D`（或 `d`）。\n* `char` 是无符号的，表示 Unicode 值。\n* 当将原始类型赋值给另一个变量时，会创建一个副本。\n\
    \n### 引用类型\n* 所有非原始类型都是引用类型。\n* 引用类型通常也被称为 `objects`（对象）。尽管引用类型指的是内存中的一个对象。\n\
    * 未赋值的引用类型对象将具有 `null` 作为默认值。\n* `Objects` 变量和方法，它们定义了对象的状态和行为。\n* 当将一个引用赋值给另一个引用时，它们都指向同一个对象。\n\
    \n## Questions\n* 什么是原始数据类型？\n* 如果原始数据类型的变量没有赋值，它包含什么？\n* 为什么我们在 `long` 后面加 `L`，在\
    \ `Float` 后面加 `F`，在 `double` 后面加 `D`？\n* 将一个原始数据类型的变量赋值给相同类型的另一个变量时会发生什么？\n* 什么是引用数据类型？\n\
    * 将引用数据类型的变量赋值给另一个相同引用类型的变量时会发生什么？\n* 原始数据类型和引用数据类型之间的区别是什么？\n* 引用类型中变量和方法的目的是什么？\n\
    * 如果引用数据类型的变量没有赋值，它包含什么？\n\n## 命名规范\n### 驼峰命名法（Camel Case）与帕斯卡命名法（Pascal Case）\n\
    `Camel Case` 是编写复合单词时使每个单词的首字母大写的做法，例如 `BorderLength`；它也称为 `Pascal Case` 或大驼峰命名法。但在编程世界中，`Camel\
    \ case` 通常以小写字母开头，例如 `borderLength`；它也称为小驼峰命名法。为了讨论方便，我们将格式 `BorderLength` 视为\
    \ `Pascal Case`，将格式 `borderLength` 视为 `Camel Case`。命名规范是一组规范标识符命名的规则，标识符代表接口、类、方法、变量和其他实体。尽管命名规范的选择和实现往往是一个争论的话题。标准的命名规范可以提高代码的可读性、审查和整体理解。\n\
    \n### 接口\n* 名称应该是 `Pascal Case`。\n* 如果定义的是行为，名称应该是形容词，否则是名词。\n```java\npublic\
    \ interface RunnableClass\n```\n\n### 类\n* 名称应该是 `Pascal Case`。\n* 名称应该是名词，因为类代表某些现实世界中的对象。\n\
    ```java\npublic class ArrayListMethod\n```\n\n### 方法\n* 名称应该是 `Camel Case`。\n\
    ```java\npublic boolean isEmpty()\n```\n\n### 变量\n* 名称应该是 `Camel Case`。\n```java\n\
    private long serialVersion = 1234L;\n```\n\n### 常数\n* 名称应该是全大写字母。复合词之间用下划线分隔。\n\
    ```java\nprivate int DEFAULT_CAPACITY = 10;\n```\n\n### 枚举\n* 枚举集合的名称应该是全大写字母。\n\
    ```java\npublic enum Duration {\n    SECOND, MINUTE, HOUR\n}\n```\n\n### 缩写\n\
    * 尽管缩写词通常用全大写表示，但在 Java 中，只有缩写词的首字母应该大写，其余部分小写。\n```java\npublic void parseXml(){}\n\
    ```\n\n## Questions\n* 命名规范的含义是什么？\n* 为什么我们需要命名规范？\n* `Camel Case` 和 `Pascal Case`\
    \ 的区别是什么？\n* `Upper Camel Case` 和 `Lower Camel Case` 的区别是什么？\n* 解释接口、类、方法、变量、常量、枚举和缩写的命名规范？\n\
    \n## Object\n每个 Java 类都直接或间接地地继承自 `java.lang.Object` 类，这意味着 `Object` 类的变量可以引用任何类的对象。由于继承，以下\
    \ `Object` 类方法可以被重写以实现类特定的代码。\n\n* `hashCode()` 返回对象的哈希码值。\n* `equals()` 使用 `==`\
    \ 运算符比较两个对象的等价性。\n* `clone()` 创建对象的副本。重写类应该继承 `Cloneable` 接口并实现 `clone()` 方法以定义拷贝的含义。\n\
    * `toString()` 返回对象的字符串表示。\n* `finalize()` 由垃圾回收器调用以清理资源。`Object` 对 `finalize()`\
    \ 的实现什么都不做。\n\n## Questions\n* 所有 Java 类的基类是什么？\n* 派生类可以重写哪些 `Object` 类方法？\n*\
    \ 如果你的类没有重写 `Object` 的 `equals` 方法会发生什么？\n    * `Object` 类中的 `equals()` 方法比较的是对象引用是否相同而不是内容。要比较内容，你需要重写\
    \ `equals()` 方法。\n* `clone()` 方法目的是目的是？\n* 为什么重写类应该定义自己的 `clone()` 方法实现？\n* 如果重写类没有重写\
    \ `clone()` 方法会发生什么？\n    * 如果一个对象包含指向外部对象的引用，对被引用对象的任何更改在克隆中也是可见的。\n\n"
- fmt: "\n# Access Modifiers\n\nThe access modifiers determine the rules about whether\
    \ other classes can access a variable or invoke a method. At the class level,\
    \ you can either use a `public` modifier or no modifier. For class members, you\
    \ can use one of the following access modifiers:\n\n- `private`: External classes\
    \ cannot access the member.\n- `protected`: Only sub-classes can access the member.\n\
    - `public`: All classes in the application can access the member.\n- `no modifier`:\
    \ All classes within the package can access this member.\n\nThe access modifier\
    \ in the overriding methods should be the same or less restrictive than the overridden\
    \ method. Optional `static` and `final` keywords are frequently used along with\
    \ the access modifiers.\n\n### Questions\n\n* What is the purpose of the access\
    \ modifier?\n* Is there any difference between the list of access modifiers available\
    \ for a class and for its members?\n* What is the scope of `private`, `protected`,\
    \ and `public` access modifiers?\n* What happens when no access modifier is specified\
    \ with the class?\n* If sub-class exists in a different package, can it still\
    \ have visibility to the `protected` members of the super-class?\n* Why should\
    \ the member access modifier in the derived class be less restrictive than the\
    \ base?\n    * As per the concepts of Inheritance, you should be able to use sub-class\
    \ objects with super-class reference. This will not be possible if sub-class member\
    \ is decelerated with more restrictive access modifier.\n* What should be the\
    \ criteria to decide an access modifier for your class?\n    * You should use\
    \ the most restrictive access modifier to ensure security and to prevent any misuse.\n\
    \n# static\n\n### static class\nOnly nested/inner classes can be defined as `static`\
    \ and not the outer class.\n\n### static variable and method\nWhen a `static`\
    \ keyword is used with the variables and the methods, it signifies that these\
    \ members belong to the class and these members are shared by all the objects\
    \ of the class. Static members do not have a copy and are stored only at a single\
    \ location in memory. These members should be accessed using the class name.\n\
    \nA `static` method does not have access to instance methods or properties, because\
    \ static members belong to the class and not the class instances.\n\n### Questions\n\
    \n* What are the `static` classes?\n* Can any class be declared as a `static`\
    \ class?\n* What are the `static` methods?\n* What are the `static` variables?\n\
    * Who owns the `static` class members? How is that different for non-static classes?\n\
    * How should you access class members that are `static`?\n* Can a `static` method\
    \ have access to an instance member? Why?\n\n# final\n\n### final ClassA\nA `final`\
    \ class cannot be extended, which makes the class secure and efficient.\n\n###\
    \ final MethodA\nA `final` method cannot be overridden, which prevents any possibility\
    \ of introducing any unexpected behavior to the class.\n\n### final VariableA\n\
    A `final` variable reference cannot be changed, but the content of the `mutable\
    \ object`, that the `final` variable is referencing, can be changed.\n\n### blank\
    \ final variable\na variable that is not initialized at the point of declaration.\n\
    \n#### Notes\n\n* A blank final variable needs to be initialized in the constructor\
    \ of the class.\n* The `final` variables are like immutable variables, so computations\
    \ related to `final` variables can be cached for optimization.\n\n### Questions\n\
    \n* Explain the `final` class?\n* What are the benefits of declaring a class `final`?\n\
    * Explain the `final` method?\n* What are the benefits of declaring a method `final`?\n\
    * Explain the `final` variable?\n* What are the benefits of declaring a variable\
    \ `final`?\n* When you declare a variable `final`, can you change the content\
    \ of the object it's referencing?\n* When you declare a variable `final`, can\
    \ you change it to reference another object?\n* What is the blank final variable?\n\
    * How does declaring a variable as `final` helps with optimization?\n\n# static\
    \ Initialization Block\n\n* A `static` initialization block is generally used\
    \ to ensure that all the required class resources (like drivers, connection strings,\
    \ etc.) are available before any object of the class is used.\n* A `static` block\
    \ does not have access to the instance members.\n* A `static` block is called\
    \ only once for a class.\n* A class can define any number of initializing blocks,\
    \ which gets called in order of their definition in the class.\n* You can only\
    \ throw an unchecked exception from a `static` block.\n\nIn this code example,\
    \ static initialization block creates connection string once for the class.\n\n\
    ```java\nprivate static String connectionString;\n\nstatic {\n    connectionString\
    \ = getConnectionSting();\n}\n```\n\n### Questions\n\n* What is a static initialization\
    \ block?\n* What is the primary purpose of a static initialization block? What\
    \ are the types of things you should do in a static block?\n* Can you access instance\
    \ members from static initialization block? Why?\n* Does the static initialization\
    \ block gets called whenever an instance of the class is created?\n* How many\
    \ `static` blocks can be defined in a class?\n* When multiple `static` blocks\
    \ are defined, what is the criterion about their order of execution?\n* Can you\
    \ throw an exception from the static initialization block? What type?\n\n# finally\n\
    \nThe primary purpose of a `finally` block is to ensure that the application is\
    \ brought back to a consistent state, after the operations performed in the `try`\
    \ block. Within the `finally` block, usually, the resources like streams and database\
    \ connections can be closed to prevent leaks.\n\n```java\nInputStream is = null;\n\
    \ntry {\n    is = new FileInputStream(\"input.txt\");\n} finally {\n    if (is\
    \ != null) {\n        is.close();\n    }\n}\n```\n\n### finally block execution\n\
    The compiler does all in its power to execute the `finally` block, except in the\
    \ following conditions:\n\n* If `System.exit()` is called.\n* If the current thread\
    \ is interrupted.\n* If JVM crashes.\n\n### Return from finally\nYou must never\
    \ return from within the `finally` block. If there is a `return` statement present\
    \ in the `finally` block, it will immediately return, ignoring any return present\
    \ in the function.\n\n### Questions\n\n* How do you guarantee that a block of\
    \ code is always executed?\n* What are the things you should do in a `finally`\
    \ block?\n* What are the things you should do in a `catch` block?\n* Does `finally`\
    \ block always execute? What are the conditions when `finally` block does not\
    \ execute?\n* Should you ever return from the finally block? Why?\n\n# finalize()\n\
    \nWhen the `Garbage Collector` determines that there is no reference to an object,\
    \ it calls `finalize()` on that object; just before removing that object from\
    \ memory.\n\nThe `finalize()` method will not be called if an object does not\
    \ become eligible for garbage collection, or if JVM stops before garbage collector\
    \ gets a chance to run.\n\nThe `finalize()` method could be overridden to release\
    \ the resources like file handles, database connections, etc.; but you must not\
    \ rely on `finalize()` to do so, and release such resources explicitly.\n\nThere\
    \ is no guarantee that `finalize()` will be called by the JVM, and you should\
    \ treat `finalize()` only as a backup mechanism for releasing resources. Where\
    \ possible, use `try-with-resource` construct to automatically release the resources;\
    \ as soon as their usage is finished.\n\nIf an uncaught exception is thrown by\
    \ the `finalize()` method, the exception is ignored before terminating the finalization.\n\
    \n### Questions\n\n* What is the `finalize()` method in Java?\n* When does the\
    \ `finalize()` method gets called?\n* Who calls the `finalize()` method?\n* What\
    \ are the things that can be done in the `finalize()` method?\n* Should you explicitly\
    \ call the `finalize()` method to release resources? Why?\n* What are some alternate\
    \ mechanisms that can be used to release system resources?\n* What happens if\
    \ an unhandled exception is thrown from the `finalize()` method?\n"
