  trans: "\n\n# 国际化与本地化\n\n## 国际化\n软件国际化是确保软件不绑定到单一语言或区域的过程。其缩写为 `i18n`。\n\n## 本地化\n\
    软件本地化是确保软件拥有所有支持特定语言或区域的资源的过程。其缩写为 `l10n`。\n\n### 注意事项\n`国际化` 有助于`本地化`。\n\n###\
    \ 问题\n* 什么是国际化？\n* 什么是本地化？\n* `本地化` 和 `国际化` 之间的区别是什么？\n* 可以在不构建`国际化`支持的情况下实现`本地化`吗？\n\
    \n# 不变对象\n当一个对象在构造后没有改变状态的可能性，则该对象被认为是不可变的。\n\n### 优点\n* 设计和实现不可变对象更加简单，因为你不需要管理状态的变化。\n\
    * 不变对象天然是线程安全的，因为它们在创建后无法被修改。因此，不需要对其访问进行同步。\n* 不变对象减少了垃圾回收（Garbage Collection）的开销。\n\
    \n### 缺点\n* 每个不同的值都需要定义一个单独的对象，因为你无法重用一个 `Immutable` 对象。\n\n### 定义不变对象的规则\n* 将类声明为\
    \ `final`。\n* 仅允许构造函数创建对象。不要提供字段的 setter（Setter）。\n* 将所有字段标记为 `private`。\n\n###\
    \ 不变类示例，`Employee`\n```java\nfinal public class Employee {\n    final private\
    \ int id;\n    final private String name;\n    final private String department;\n\
    \n    public Employee(int id, String name, String department) {\n        this.id\
    \ = id;\n        this.name = name;\n        this.department = department;\n  \
    \  }\n\n    public int getId() {\n        return id;\n    }\n\n    public String\
    \ getName() {\n        return name;\n    }\n\n    public String getDepartment()\
    \ {\n        return department;\n    }\n}\n```\n\n### 问题\n* 什么是不变对象？\n* 定义不变对象的规则是什么？\n\
    * 不变对象的优点/缺点是什么？\n* 如何创建不变对象？\n* 在哪些不同情况下可以使用不变对象？\n* `final` 和不可变对象之间的区别是什么？\n\
    * 将变量声明为 `final` 有什么优化收益？\n* 能列举一些关于不可变性的问题吗？\n    * 定义带有大量参数的构造函数更加困难。\n    *\
    \ 由于不可变性的实现交给了开发者，即使不小心添加了单个 setter 也会破坏它。\n\n# 克隆\n克隆是创建对象副本的过程。简单地将现有对象的引用赋值给一个对象会导致两个引用指向同一个对象。克隆有两种类型：浅拷贝和深拷贝。\n\
    \n## 浅拷贝\n浅拷贝简单地复制属性的值；对于原始类型属性成员，会创建一个精确的副本；对于引用类型成员，则复制其地址。因此，对于引用类型成员，原始对象和新创建的副本都指向堆内存中的同一个对象。\n\
    \n## 深拷贝\n深拷贝递归地将每个成员的内容复制到新对象中。深拷贝总是会创建原始对象的独立副本。要创建深拷贝，应该编写一个名为 `CopyConstructor`\
    \ 的专用方法。\n\n### 问题\n* 什么是克隆？\n* 什么是浅拷贝？\n* 解释浅拷贝的缺点？\n* 什么是深拷贝？\n* 什么是 `CopyConstructor`？\n\
    * 在什么情况下你会倾向于使用深拷贝而不是浅拷贝，反之亦然？\n\n# 数据类型\n\n## NaN\nNot a Number（非数字）也称为 `NaN`，是由于除以零、与无穷大运算等算术计算产生的未定义结果。两个\
    \ `NaN` 不相等。`NaN` 有两种类型：\n* `Quiet NaN`（静默 NaN）：当产生安静 `NaN` 时，除非检查结果，否则没有指示。\n\
    * `Signalling NaN`（信号 NaN）：当产生信号 `NaN` 时，它会信号无效的操作表达式。\n\n### 问题\n* 什么是 `NaN`\
    \ 或 Not a Number？\n* 什么是 Quiet NaN？\n* 什么是 Signalling NaN？\n* 两个 `NaN` 相等吗？\n\n\
    ## EnumSet\n* `EnumSet` 是一种用于 `Enum` 类型的特殊集合实现。\n* `EnumSet` 在内部以位向量（bit vectors）的形式表示，非常紧凑且高效。\n\
    * `EnumSet` 提供了执行位标志操作的优化实现，应该用来代替执行 `int` 标志操作。\n\n以下代码演示了 `EnumSet` 的用法。\n```java\n\
    private enum Vehicle {\n    CAR,\n    JEEP,\n    MOTORCYCLE\n}\n\npublic static\
    \ void main(String[] args) {\n    EnumSet<Vehicle> TWOWHEELER = EnumSet.of(MOTORCYCLE);\n\
    \    if (TWOWHEELER.contains(JEEP)) {\n        //\n    }\n}\n```\n\n### 问题\n*\
    \ 什么是 `EnumSet`？\n* 为什么你应该倾向于使用 `EnumSet` 来执行 `int` 标志操作？\n\n## 比较类型\n原始类型只能通过相等运算符（`==`）进行比较；而引用类型可以根据我们想要比较的内容使用相等运算符和\
    \ `equals()` 方法进行比较。\n\n### 等等运算符\n对于引用类型，相等运算符 `==` 和 `!=` 用于比较两个对象的地址，而不是它们的实际内容。\n\
    \n### equals() 方法\n当你想比较两个对象的内容时，请使用 `equals()` 方法。`Object` 类定义了 `equals()` 方法，子类必须重写该方法以方便内容比较。如果类没有重写\
    \ `equals()` 方法，则会调用相等运算符进行比较。\n\n### 问题\n* 比较类型有哪些方式？\n* 引用类型的相等运算符比较什么？\n* `equals()`\
    \ 方法比较什么？\n* 为什么你会倾向于使用 `equals` 方法而不是相等运算符？\n* 如果类没有重写 `equals` 方法会发生什么？\n\n\
    ## 浮点比较\n两个浮点数不应使用相等运算符 `==` 进行比较；因为相同的数字（例如 0.33）在两个浮点变量中存储的可能并不是 0.33，而是 0.3300000007\
    \ 和 0.329999999767。因此，比较两个浮点值时是将两个值的绝对差与一个范围进行比较。\n```java\nif (Math.abs(floatValue1\
    \ - floatValue2) < EPSILON) {\n    //\n}\n```\n其中 `EPSILON` 是一个非常小的数字，如 `0.000001`，这取决于所需的精度。\n\
    \n### 问题\n* 为什么不应该使用相等运算符比较浮点值？\n* 比较两个浮点值的优方法是什么？\n* 决定用于比较两个浮点值的范围的标准是什么？\n\n\
    ## 字符串比较\n`String` 类对象使用相等运算符 `==` 测试引用相等性，使用 `equals()` 方法测试内容相等性。在比较来自不同来源的两个\
    \ `String` 变量时，始终使用 `equals()` 方法。池化字符串也可以使用相等运算符进行比较。\n\n### 问题\n* 为什么应该使用 `equals`\
    \ 方法比较 `String` 对象？\n* 使用相等运算符比较两个 `String` 对象的陷阱是什么？\n* 什么是池化字符串？如何比较两个池化字符串？\n\
    \n"
- fmt: "\n# Enum Comparison\n\n`ComparisonEnum` can neither be instantiated nor copied.\
    \ So always only a single instance of the enum is available, the one defined with\
    \ the enum definition. As only one instance of the enum is available, you can\
    \ use both equality operator (`==`) and `equals()` method for comparison. But\
    \ prefer using equality operator, `==`, as it does not throw `NullPointerException`\
    \ and it also performs compile-time compatibility check. \n\n### Questions\n*\
    \ What are the different ways to compare two enums?\n* Explain why you can use\
    \ both equality operator and `equals` method to compare enum?\n* Which is the\
    \ preferred way to compare two enum values?\n\n## Enum vs Public Static Field\n\
    \nThe code below demonstrates the usage of `enum` and `public static field`. The\
    \ following are advantages of using `enum` over `public static int`.\n\n* The\
    \ `Enums` are compile-time checked, whereas `int` values are not. With `public\
    \ static int`, you can pass any `int` value to `AddVehicle()` method.\n* An `int`\
    \ value needs to be validated against an expected range; whereas, `enums` are\
    \ not.\n* Bitwise flag operations are built into `enumSet`.\n\n```java\nprivate\
    \ enum Vehicle {\n    CAR,\n    JEEP,\n    MOTORCYCLE,\n    SCOOTER\n};\n\npublic\
    \ void AddVehicle(Vehicle vehicle){\n}\n\npublic static field\npublic static int\
    \ CAR = 0;\npublic static int JEEP = 1;\npublic static int MOTORCYCLE = 2;\npublic\
    \ static int SCOOTER = 3;\npublic void AddVehicle(int vehicle){\n}\n```\n\n###\
    \ Questions\n* What are the advantages of using `enum` over `public static int`\
    \ fields?\n* Why do you need to perform extra validation with the `int` parameter\
    \ as compared to the `enum` parameter?\n* Why should you prefer using an `enum`\
    \ over a `public static int`?\n\n## Wrapper Classes\n\nEach Primitive data type\
    \ has a class defined for it that wraps the primitive datatype into the object\
    \ of that class. Wrapper classes provide lots of utility methods to operate on\
    \ primitive data values. As the wrapper classes enable primitive types to convert\
    \ into reference types, these can be used with the collections too.\n\n### Questions\n\
    * What are the wrapper classes?\n* What are the advantages of using the wrapper\
    \ type over the primitive type?\n* How can you use primitive types with collections?\n\
    \n## Auto boxing and Auto unboxing\n\nAuto boxing is an automatic conversion of\
    \ primitive type to an object, which involves dynamically memory allocation and\
    \ initialization of corresponding Wrapper class object. Auto unboxing is the automatic\
    \ conversion of a Wrapper class to a primitive type.\n\nIn the code below, `23.456f`\
    \ is auto boxed to an object `Float(23.456f)` and the value returned from `addTax()`\
    \ is auto unboxed to `float`.\n\n```java\npublic static void main(String [] args){\n\
    \    float beforeTax = 23.456f;\n    float afterTax = addTax(beforeTax);\n}\n\n\
    public static Float addTax(Float amount){\n    return amount * 1.2f;\n}\n```\n\
    \n### Questions\n* What are auto boxing and auto unboxing?\n* What are the advantages\
    \ of auto boxing?\n\n## BigInteger and BigDecimal\n\n`BigInteger` and `BigDecimal`\
    \ are used to handle values that are larger than `Long.MAX_VALUE` and `Double.MAX_VALUE`.\
    \ Such large values are passed as `String` values to the constructor of `BigInteger`\
    \ and `BigDecimal`. `BigDecimal` supports utility methods to specify the required\
    \ rounding and the scale to be applied.\n\n```java\nBigInteger bInt = new BigInteger(\"\
    9876543210987654321098765\");\n```\n\nBoth `BigInteger` and `BigDecimal` objects\
    \ are immutable, so any operation on it creates a new object. `BigInteger` is\
    \ mainly useful in cryptographic and security applications.\n\n### Questions\n\
    * What are the `BigInteger` and `BigDecimal` types?\n* How are the values of `BigInteger`\
    \ and `BigDecimal` internally stored?\n* What are the usages of `BigInteger`?\n\
    \n# STRINGS\n\n## String Immutability\n\nThe `String` object is immutable, which\
    \ means once constructed, the object which `String` reference refers to, can never\
    \ change. Though you can assign the same reference to another `String` object.\
    \ Consider the following example:\n\n```java\nString greeting = \"Happy\";\ngreeting\
    \ = greeting + \" Birthday\";\n```\n\nThe code above creates three different `String`\
    \ objects, `\"Happy \"`, `\" Birthday \"` and `\" Happy Birthday \"`.\n\n* Though\
    \ you cannot change the value of the `String` object you can change the reference\
    \ variable that is referring to the object. In the above example, the `String`\
    \ reference `greeting` starts referring to the `String` object `\"Happy Birthday\"\
    `.\n* Note that any operation performed on `String` results in the creation of\
    \ a new `String`.\n* `String` class is marked `final`, so it's not possible to\
    \ override the immutable behavior of the `String` class.\n\n### Advantages\n*\
    \ As no synchronization needed for `String` objects, it's safe to share a `String`\
    \ object between threads.\n* As `String` does not change, the Java environment\
    \ caches `String` literals into a special area in memory known as the `String\
    \ Pool` for optimization. If a `String` literal already exists in the pool, the\
    \ same string literal is shared.\n* Immutable `String` values safeguard against\
    \ any change in value during execution.\n* As hash-code of `String` object does\
    \ not change, it is possible to cache hash-code and not calculate every time it's\
    \ required.\n\n### Disadvantages\n* The `String` class cannot be extended to provide\
    \ additional features.\n* If loads of `String` literals are created, either as\
    \ new objects or because of any string operation, it will put the load on Garbage\
    \ Collector.\n\n### Questions\n* Why `String` objects called immutable?\n* How\
    \ is the `String` object created in memory?\n* What are the advantages/disadvantages\
    \ of Immutability?\n* Why are `String` objects considered thread-safe?\n* What\
    \ are the advantages of declaring `String` class `final`?\n* What memory optimization\
    \ is performed by the Java environment for strings?\n* Why you don't have to re-calculate\
    \ hash-code of `String` object over the time?\n\n## String Literal vs Object\n\
    \n### String Literal\nString literal is a Java language concept where the `String`\
    \ class is optimized to cache all the Strings created within double quotes, into\
    \ a special area known as String Pool.\n\n```java\nString cityName = \"London\"\
    ;\n```\n\n### String Object\nThe `String` object is created using `new()` operator\
    \ into the heap, like any other object.\n\n```java\nString cityNameObj = new String(\
    \ \"London\");\n```\n\n### Questions\n* What is String literal?\n* What are the\
    \ differences between a String Literal and String Object?\n* How are the String\
    \ Literals stored?\n\n## String Interning\n\n* String interning is a concept of\
    \ storing only a single copy of each distinct immutable String value.\n* When\
    \ you define any new String literal it is interned. Same String constant in the\
    \ pool is referred for any String literal.\n* String pool literals are defined\
    \ not only at the compile-time but also during runtime. You can explicitly call\
    \ a method `intern()` on the `String` object to add it to the String Pool, if\
    \ not present.\n* Placing an extremely large amount of text in the memory pool\
    \ can lead to memory leak or performance issues.\n\nNote: Instead of using String\
    \ object, prefer using a string literal so that the compiler can optimize it.\n\
    \n### Questions\n* What is String interning?\n* Can String Objects also be interned?\n\
    * What happens when you store a new String literal value that is already present\
    \ in the string pool?\n* What are the drawbacks of creating a large number of\
    \ String literals?\n* Which one is preferred: String Object or String Literal?\
    \ Why?\n\n## String Pool Memory Management\n\nThe String pool is a special area\
    \ in memory managed by the Java compiler for String memory optimization. If there\
    \ is already a String literal present in the string pool, compiler refers the\
    \ new String literal reference to an existing String variable in the pool, instead\
    \ of creating a new literal. Java compiler can perform this optimization because\
    \ String is immutable.\n\n```java\nString cityNameObj = new String( \"London\"\
    );\n```\n"
