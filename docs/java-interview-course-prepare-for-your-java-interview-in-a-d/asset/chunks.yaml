    # COLLECTIONS


    `Collections` are the data structures that are basic building blocks to create
    any production level software application in Java. Interviewers are interested
    in understanding different design aspects related to the correct usage of collections.
    Each collection implementation is written and optimized for a specific type of
    requirement, and interview questions are to gauge the interviewee''s understanding
    of such aspects. Questions are often asked to check whether the candidate understands
    the correct usage of collection classes and is aware of alternative solutions
    available. Following are few aspects on which questions on collections are asked:


    - Collection types in Java.

    - Unique features of different collection types.

    - Synchronized collection.

    - Concurrent collection.

    - Ordering of elements in a collection.

    - Speed of reading from collection.

    - Speed of writing to a collection.

    - The uniqueness of the elements in a collection.

    - Ease of inter-collection operation.

    - Read-only collections.

    - Collection navigation.


    ## Collection Fundamentals


    The collection is a container that groups multiple elements. Following is a simple
    example of a collection:


    ```java

    // Create a container list of cities

    List<String> cities = new ArrayList<>();


    // add names of cities

    cities.add("London");

    cities.add("Edinburgh");

    cities.add("Manchester");

    ```


    ### Notes


    - Collections work with reference types.

    - All collection interface implementation is `Generic`.

    - Unlike arrays, all collection types can grow or shrink in size.

    - Java provides a lot of methods to manipulate collections based on their use,
    so always test the existing methods before you implement one.


    ## Collection Framework


    The collection framework is defined by the following components:


    - **Interfaces** - are the abstract types defined for each specific type of usage
    and collection type.

    - **Implementation** - are concrete implementation classes to create an object
    to represent a different type of collection.

    - **Algorithms** - are applied to the collections to perform various computations
    and to manipulate the elements in the collection.


    Collection Framework helps you to reduce programming efforts, by providing data
    structures and algorithms to operate on them.


    ### Questions


    - Explain collections?

    - How collections and `Generics` related?

    - Can you use collection with primitive types?

    - How can you use collection with the primitive types?

    - Explain the difference between collections and arrays?

    - What is the benefit of the collection framework?

    - What are the different components of the collection framework?


    ## Collection Interfaces


    An interface defines its behavior in the form of the signature of the methods.
    To use a collection, you should always write code against collection interfaces
    and not the class implementations, so that the code is not tied to a specific
    implementation. This protects from possible changes in the underlying implementation
    class.


    The following are the most important interfaces that define collections and their
    behavior. Each child node below is inherited from its parent node:


    - `Collection`

    - `Queue`

    - `BlockingQueue`

    - `TransferQueue`

    - `BlockingDeque`

    - `Deque`

    - `List`

    - `Set`

    - `SortedSet`

    - `NavigableSet`

    - `Map`

    - `SortedMap`


    ### Questions


    - Why should you write code against the collection interface and not concrete
    implementation?


    ## Collection Types


    - **Set**: `Set` contains unique elements.

    - **List**: `List` is an ordered collection.

    - **Queue**: `Queue` holds elements before processing in a `FIFO` manner.

    - **Deque**: `Deque` holds elements before processing in both, `FIFO` and `LIFO`
    manner.

    - **Map**: The `map` contains the mapping of keys to corresponding values.


    ### Questions


    - What are the different collection types?

    - Define `Set` collection Type?

    - Define `List` collection Type?

    - Define `Queue` collection Type?

    - Define `Deque` collection Type?

    - Define `Map` collection Type?

    - What is the difference between `Queue` and `Deque`?


    ## Set


    ### Basic Set

    ```java

    // Create a set

    Set<String> set = new HashSet<>();

    ```


    - `Set` is a collection of unique elements.

    - Elements in the `Set` are stored unordered.

    - Only one `null` element can be added to a `Set`.

    - Duplicate elements are ignored.

    - When ordering is not needed, `Set` is the fastest and has a smaller memory footprint.


    ### LinkedHashSet

    ```java

    // Create a linkedHashSet

    Set<String> linkedHashSet = new LinkedHashSet<>();

    ```


    - `LinkedHashSet` keeps the `Set` elements in the same order in which they were
    inserted.

    - Insertion order is not affected in `LinkedHashSet` if an element is re-inserted.

    - `Iterator` in `LinkedHashSet` returns elements in the same order in which these
    were added to the collection.


    ### Sorted Set


    - `SortedSet` imposes the ordering of elements to be either sorted in natural
    order by implementing a `Comparable` interface or custom sorted using a `Comparator`
    object.

    - `TreeSet` is an implementation class for the `SortedSet` interface.


    ```java

    // Create a sorted set of city names

    SortedSet<String> cityNames = new TreeSet<>();

    ```


    - Use a `Comparator` object to perform custom sorting.

    ```java

    SortedSet<City> sortedCitiesByName = new TreeSet<>(Comparator.comparing(City::getName));

    ```


    - If an element implements a `Comparable` interface, then the `compareTo()` method
    is used to sort in the natural order.


    ### Navigable Set


    - `NavigableSet` inherits from `SortedSet` and defines additional methods.

    - `NavigableSet` can be traversed in both, ascending and descending order.

    - `TreeSet` is one of the implementation classes for the `NavigableSet` interface.


    ### Questions


    - Can you add duplicate elements in a `Set`?

    - Which collections type should you use when ordering is not a requirement? Why?

    - Can you add a `null` element to a `Set`?

    - Which `Set` class should you use to maintain the order of insertion?

    - What happens to the order, if the same element is inserted again in a `Set`?
    Will it maintain its original position or inserted in the end?

    - Which `Set` class should you use to ensure the ordering of the elements?

    - Which `Set` class should you use when you need to traverse in both the directions?


    ## List


    - The `list` is an ordered collection of objects.

    - The `list` can have a duplicate.

    - The `list` can have multiple `null` elements.

    - In `List`, an element can be added at any position.

    - Using `ListIterator`, a list can be iterated in both, forward and backward direction.


    ```java

    // Create a list of cities

    List<String> cities = new ArrayList<>();

    ```


    ### ArrayList


    - `ArrayList` is based on an array.

    - It performs better if you access elements frequently.

    - Add and remove is slower in the `ArrayList`. If an element is added anywhere
    but the end requires shifting of the element. If elements are added beyond its
    capacity then the array is copied to a newly allocated place.


    ### LinkedList


    - `LinkedList` is based on the list.

    - `LinkedList` is slower in accessing elements and only sequential access allowed.

    - Adding and removing elements from `LinkedList` is faster.

    - `LinkedList` consumes more memory than `ArrayList` as it keeps pointers to its
    neighboring elements.


    ### List Iterator


    - `ListIterator` iterates list in both the directions


    ```java

    // full list iterator

    ListIterator<String> fullIterator = cities.listIterator();


    // partial list iterator starts at index 3

    ListIterator<String> partialIterator = cities.listIterator(3);

    ```


    ### Notes


    - Random access is better in `ArrayList` as it maintains an index-based system
    for its elements whereas `LinkedList` has more overhead as it requires traversal
    through all elements.


    ### Questions


    - Can you add duplicate elements to a `List`?

    - Can you add `null` to a list?

    - In which scenarios would you use `ArrayList` in: frequent add/update or frequent
    reading?

    - In which scenarios would you use `LinkedList` in: frequent add/update or frequent
    reading?

