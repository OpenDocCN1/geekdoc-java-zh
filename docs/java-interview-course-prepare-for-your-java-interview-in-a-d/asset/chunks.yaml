    in hierarchical form. Preferences class abstracts out the process of storage and
    stores the preferences in an operating system specific way: preferences file on
    Mac, or the registry on Windows systems. Though the keys in preferences are Strings
    value can belong to any primitive type.Applications use Preferences class to store
