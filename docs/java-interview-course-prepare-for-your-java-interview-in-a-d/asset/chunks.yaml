    # Mock Objects

    * Mock objects help you to isolate and test only the conditional logic in the
    class without testing dependencies.

    * In the mock object, you can implement partial functionality required for the
    test without implementing the complete dependency object.

    * You don''t have to worry about understanding the internal of dependencies, which
    helps in faster development time.


    ## Questions

    * What are mock objects?

    * What are the benefits of using mock objects?

    * Why do mock objects help to speed up the tests?

    * Why should you use mock objects for unit testing?

    * What are the types of dependencies that you should replace with mock objects?


    # JAVA DEVELOPMENT TOOLS


    ## Git

    `Git` is a source code management system. Its distributed version control system
    (`DVCS`) facilitates multiple engineers and teams to work in parallel. `Git`''s
    primary emphasis is on providing speed with maintaining data integrity. `Git`
    also provides the ability to perform almost all the operations offline, when network
    is not available. All the changes can be pushed to the server on the network''s
    availability.


    Let''s discuss a few terms that are frequently used:

    * `Repository` - is a directory that contains all the project files.

    * `Clone` - it creates a working copy of the local repository.

    * `Branch` - is created to encapsulate the development of a new feature or to
    fix a bug.

    * `HEAD` - points to the last commit.

    * `Commit` - commits changes to the `HEAD` and not to the remote repository.

    * `Pull` - Gets the changes from the remote repository to the local repository.

    * `Push` - Commits the local repository changes to the remote repository.


    ### Git Workflow Structure

    ![](Image00018.jpg)


    ## Questions

    * What is distributed version control systems?

    * Why do you use a version control system?

    * What are the typical activities you perform with a version control system?

    * Explain the branching strategy of code?


    ## Maven

    `Maven` is a software project management framework that manages project build,
    dependency resolution, testing, deployment, reporting, etc. `Maven` is based on
    conventions rather than elaborate configurations. `Maven` is managed by `pom.xml`
    (also known as Project Object Model) file, which facilitates defining various
    tasks (or `goals`) and also has a dedicated section to specify various project
    dependencies, which are resolved by `Maven`.


    ## Questions

    * Why should you need a framework for dependency resolution - you can manually
    download the files and add a reference?

    * What all things does `Maven` support?

    * Why `Maven` is said to be convention-based?

    * What is the meaning of `goals` in `Maven`?


    ## Jenkins

    Continuous Integration

    Continuous Integration is a practice where the engineers, who are working in parallel
    on the same code repository, merge their changes frequently. Every check-in is
    followed by a series of automated activities, which aims to validate the changes
    in the check-in. Typical automated activities following the check-in are:

    * Fetching changes from the repository,

    * Performing automated build.

    * Execute different tests like the unit, integration, validations, etc.

    * Deploy the changes.

    * Publish the results.


    `Jenkins` is an open-source web-based tool to perform continuous integration.
    `Jenkins` provides configuration options to configure and execute all the above-mentioned
    activities. Available configuration options are: configuring `JDK`, security,
    Build Script; integration with `Git`, `Ants`, `Maven`, `Gradle`, etc.; deployment,
    etc. The execution of jobs can be associated with some event or can be based on
    time-based scheduling.


    ## Questions

    * What is Continuous Integration?

    * What are the different activities that the Continuous Integration framework
    should support?

    * Explain the capabilities of `Jenkins` to support Continuous Integration?

    * How do you integrate third-party tools with `Jenkins`?


    # JAVA INTERVIEW COURSE

