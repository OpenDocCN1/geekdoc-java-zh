    # 模拟对象 (Mock Objects)

    * 模拟对象帮助你隔离并仅测试类中的条件逻辑，无需测试依赖项。

    * 在模拟对象中，你可以实现测试所需的部分功能，而无需实现完整的依赖对象。

    * 你不需要担心理解依赖的内部实现，这有助于缩短开发时间。


    ## 问题

    * 什么是模拟对象？

    * 使用模拟对象有什么好处？

    * 为什么模拟对象有助于加速测试？

    * 为什么在单元测试中应该使用模拟对象？

    * 哪些类型的依赖应该用模拟对象来替换？


    # JAVA 开发工具


    ## Git

    `Git` 是一个源代码管理系统。它的分布式版本控制系统 (`DVCS`) 允许多个工程师和团队并行工作。`Git` 的主要重点是在保持数据完整性的同时提供快速响应。`Git`
    还提供了在网络不可用时离线执行几乎所有操作。。网络可用时，可以将所有更改推送到网络服务器。


    让我们讨论一下几个常用的术语：

    * `Repository`（仓库） - 包含所有项目文件的目录。

    * `Clone`（克隆） - 创建本地仓库的工作副本。

    * `Branch`（分支） - 用于封装新功能的开发或修复 Bug。

    * `HEAD` - 指向最后一次提交。

    * `Commit`（提交） - 将更改提交到 `HEAD` 而不是远程仓库。

    * `Pull`（拉取） - 从远程仓库获取更改到本地仓库。

    * `Push`（推送） - 将本地仓库更改提交到远程仓库。


    ### Git 工作流结构

    ![](img/Image00018.jpg)


    ## 问题

    * 什么是分布式版本控制系统？

    * 为什么要使用版本控制系统？

    * 使用版本控制系统时通常执行哪些活动？

    * 请解释代码的分支策略？


    ## Maven

    `Maven` 是一个软件项目管理框架，负责项目构建、依赖解析、测试、部署、报告等。`Maven` 基于约定而非复杂的配置。`Maven` 由 `pom.xml`（也称为项目对象模型）文件管理，该文件便于定义各种任务（或
    `goals`），并有一个专门的区域来指定各种项目依赖，这些依赖由 `Maven` 进行解析。


    ## 问题

    * 为什么需要一个依赖解析框架——你不能手动下载文件并添加引用吗？

    * `Maven` 支持哪些功能？

    * 为什么说 `Maven` 是基于约约的？

    * `Maven` 中 `goals` 的什么含义？


    ## Jenkins

    持续集成 (Continuous Integration)

    持续集成是一种实践，即在同一代码仓库上并行工作的工程师频繁合并他们的更改。每次提交后都会紧随着一系列自动化活动，旨在验证提交的更改。提交后的典型自动化活动包括：

    * 从仓库获取更改，

    * 执行自动化构建。

    * 执行不同的测试，如单元测试、集成测试、验证等。

    * 部署更改。

    * 发布结果。


    `Jenkins` 是一个用于持续集集的开源 Web 工具。`Jenkins` 提供了配置选项来配置和执行上述所有活动。可用的配置选项包括：配置 `JDK`、安全、构建脚本；与
    `Git`、`Ants`、`Maven`、`Gradle` 等集成；部署等。作业的执行可以与某些事件关联，也可以基于时间的调度。


    ## 问题

    * 什么是持续集成？

    * 持续集成框架应该支持哪些不同的活动？

    * 解释 `Jenkins` 支持持续集成的能力？

    * 如何将第三方工具集成到 `Jenkins` 中？


