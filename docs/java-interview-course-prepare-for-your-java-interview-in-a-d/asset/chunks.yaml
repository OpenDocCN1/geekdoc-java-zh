  trans: "\n\n# 你可以在不定义外部类的情况下创建非静态内部类的实例吗？\n\n## 匿名内部类\n\n- 匿名内部类没有名称。\n- 匿名内部类在定义的同时也创建了其对象。\n\
    - 匿名内部类始终使用 `new` 运算符作为表达式的一部分来创建。\n- 创建匿名类时，在 `new` 运算符后紧跟一个现有的接口或类名。\n- 匿名类要么实现接口，要么继承自现有的类。\n\
    \n### 匿名内部类的创建 // 外部类\n\n```java\npublic class CityNames {\n    private List<String>\
    \ cityNames = new ArrayList<>();\n\n    public Iterator<String> nameIterator()\
    \ {\n        // 匿名内部类\n        Iterator<String> nameIterator = new Iterator<String>()\
    \ {\n            @Override\n            public boolean hasNext() {\n         \
    \       return false;\n            }\n            @Override\n            public\
    \ String next() {\n                return null;\n            }\n        };\n \
    \       // 返回一个局部内部类的实例。\n        return nameIterator();\n    }\n}\n```\n\n###\
    \ 注意事项\n- 不要返回内部类，因为它持有对外部封闭类的引用，否则可能会发生内存泄漏。\n- 当你想防止任何人在其他地方使用该类时，使用匿名类。\n-\
    \ 必须避免匿名类和内部类的序列化，因为由于不同的 JRE 实现，在反序列化可能会可能会兼容性问题。\n\n### 问题\n- 什么是匿名内部类？\n- 匿名内部类与局部内部类有什么区别？\n\
    - 为什么你不应该从方法中返回内部类对象？\n- 如果你想防止任何人在外部使用你的类，你应该定义哪种类型的内部类？\n- 为什么应该避免对匿名类和内部类的序列化？\n\
    \n# 函数式编程\n\n## 函数式接口\n函数式接口是一个只有一个抽象方法的接口，但可以拥有任意数量的默认方法。\n\n`@FunctionalInterface`\n\
    \n```java\npublic interface Greator<T> {\n    public T greater(T arg1, T args2);\n\
    }\n```\n\n当接口不是有效的函数式接口时，注解 `@FunctionalInterface` 会产生编译器警告。\n\n```java\n@FunctionalInterface\n\
    public interface Greator<T> {\n    public T greater(T arg1, T args2);\n}\n```\n\
    \n下面定义的 `Account` 类用作函数式接口 `Greater` 的参数。\n\n```java\npublic class Account {\n\
    \    private int balance;\n\n    public Account(int balance) {\n        this.balance\
    \ = balance;\n    }\n\n    public int getBalance() {\n        return balance;\n\
    \    }\n\n    @Override\n    public String toString() {\n        return \"Account{\"\
    \ + \"balance=\" + balance + \"}\";\n    }\n}\n```\n\n下面的代码演示了如何使用 Lambda 表达式找到余额更大的账户。同样，相同的函数式接口\
    \ `Greater` 也可以比较其他类似的业务对象。\n\n```java\npublic static void main(String[] args)\
    \ {\n    Greator<Account> accountComparer = (Account acc1, Account acc2) ->\n\
    \        acc1.getBalance() > acc2.getBalance() ? acc1 : acc2;\n\n    Account account1\
    \ = new Account(6);\n    Account account2 = new Account(4);\n    System.out.println(\"\
    Account with greater balance: \" + accountComparer.greater(account2, account1));\n\
    }\n```\n\n### 问题\n- 什么是函数式接口？\n- 使用函数式接口的好处是什么？\nJava 同时也为大多数场景提供了一组预定义的函数式接口。\n\
    \n## Lambda 表达式\nLambda 表达式提供了一种方便的方法，可以更紧凑地创建实现函数式接口的匿名类。当你想将功能作为参数传递给另一个方法，并推迟该功能的执行直到适当的时机时，Lambda\
    \ 表达式特别有用。\n\nLambda 表达式可以仅仅是一个带有方法体和可选参数类型的语句块，没有方法名或返回类型。它可以作为方法传递并存储在变量中。\n\
    \n```java\n// lambda 表达式\n() -> 2\n(x,y) -> x + y\n(Double x, Double y) -> x*y\n\
    ```\n\n### 问题\n- 什么是 Lambda 表达式？\n- Lambda 表达式与匿名类之间有什么联系？\n- 你可以将 Lambda 表达式作为方法参数传递吗？\n\
    - 使用 Lambda 表达式延迟执行功能的含义是什么？\n- 使用 Lambda 表达式的好处是什么？\n- Lambda 表达式与函数式接口之间有什么关系？\n\
    \n## 纯函数\n纯函数是指结果仅取决于传递给它的参数的函数，不受应用程序中任何状态更改的影响，也不会改变应用程序的状态。纯函数对于相同的参数返回相同的的结果。\n\
    \n```java\npublic int increaseByFive(int original) {\n    int toAdd = 5;\n   \
    \ return original + toAdd;\n}\n```\n\n### 问题\n- 什么是纯函数？\n- 纯函数在函数式编程中的作用是什么？\n\
    - 如何保证纯函数对相同的参数总是返回相同的结果？\n\n## 流式接口\n流式接口用于将命令传递给后续调用，而无需创建中间对象，并通过方法链式调用实现。流式接口链在链式方法返回\
    \ `void` 时结束。流式接口通过减少不必要的对象提高了可读性。\n\n在下面的代码中，流式接口被用于添加一个新的 `Employee`。\n\n```java\n\
    employee.create()\n    .atSite(\"London\")\n    .inDepartment(\"IT\")\n    .atPosition(\"\
    Engineer\");\n```\n\n流式接口主要用于构建查询、创建一系列对象或按层次顺序构建节点的场景。\n\n### 问题\n- 什么是流式接口？\n\
    - 定义和使用流式接口有什么好处？\n- 描述一下流式接口的使用？\n\n# 泛型\n\n## 泛型\n泛型是一种允许代码在类型、类或接口或方法上处理不同类型对象的机制；同时提供编译时的保护。泛型的引入是为了类型安全，特别是对于集合类。\n\
    \n- 一旦在泛型中定义了参数类型，对象将仅与定义的类型工作。\n- 在泛型中，形式类型参数（例如 `E`）在类型（类或接口）处指定。\n\n```java\n\
    // 泛型 List\n// E 是类型参数\npublic interface List<E> {\n    void add(E x);\n    Iterator<E>\
    \ iterator();\n}\n```\n\n- 在泛型中，参数化类型（例如 `Integer`）在声明类型变量或创建类型对象时指定。\n\n```java\n\
    // 声明 List 类型\n// 使用 Integer 参数\nList<Integer> integerList = new ArrayList<Integer>();\n\
    ```\n\n### 注意事项\n- 泛型命名常用约定：`E` 代表元素，`T` 代表类型，`K` 代表键，`V` 代表值。\n- 泛型是编译支持；所有的类型参数在编译期间都会被移除，这个过程称为擦除（erasure）。\n\
    - 由于强类型检查，泛型有助于避免许多 `ClassCastException` 实例。\n\n### 泛型类示例\n- 下面的 `NodeId` 泛型类定义可以与任何类型的对象工作。\n\
    \n```java\n// 带有类型参数的泛型 NodeId 类\npublic class NodeId<T> {\n    private final\
    \ T Id;\n\n    public NodeId(T id) {\n        this.Id = id;\n    }\n\n    public\
    \ T getId() {\n        return Id;\n    }\n}\n```\n\n"
- fmt: "\n* Usual SuperType – SubType rules do not apply to generics. In this example,\
    \ even though `Integer` is derived from `Object`, still `NodeId` with type parameter\
    \ `Integer` cannot be assigned to `NodeId` with type parameter `Object`.\n\n```java\n\
    // Parameter Type - Object\nNodeId<Object> objectNodeId = new NodeId<>( new Object());\n\
    \n// Parameter Type - Integer\nNodeId<Integer> integerNodeId = new NodeId<>( 1\
    \ );\n\n// This results in an error\nobjectNodeId = integerNodeId; ( error )\n\
    ```\n\n## Type Wildcards\n\n* A wildcard in generics is represented in the form\
    \ of `?`. For example, a method which takes `List<?>` as a parameter will accept\
    \ any type of `List` as an argument.\n\n```java\npublic void addVehicles( List\
    \ <?> vehicles) {\n    //...\n}\n```\n\n* Optional upper and lower limits are\
    \ set to enforce limitations, as the exact form of parameter defined by the wild\
    \ card is not known.\n\n```java\n// Only vehicles of type Truck can be added\n\
    public void addVehicles( List <? extends Truck> vehicles) {\n    //...\n}\n```\n\
    \n### Notes\n* Do not return wildcard in a return type as its always safer to\
    \ know what is returned from a method.\n\n## Upper Bound\n\n* To impose a restriction,\
    \ upper bound can be set on the type parameters. Upper bound restricts a method\
    \ to accept unknown type arguments extended only from the specified data type,\
    \ like `Number` on the example below.\n\n```java\n// Upper bound of type wild\
    \ card\npublic void addIds( List <? extends Number> T)\n```\n\n## Lower Bound\n\
    \n* To impose a restriction, lower bound can be set on the type parameters. Lower\
    \ Bound restricts a method to accept unknown type argument, which is a super-type\
    \ of specified data type only, like `Float` in the example below.\n\n```java\n\
    // Lower bound of type wild card\npublic void addIds( List <? super Float> T)\n\
    ```\n\n## Type Inference\n\n* Type inference is a compiler's ability to look at\
    \ method invocation and declaration to infer the type arguments.\n* In `Generics`,\
    \ the operator called Diamond operator, `<>`, facilitates type inference.\n\n\
    ```java\n// Type inference using Diamond operator\nList <Integer> integerList\
    \ = new ArrayList<>();\n```\n\n### Questions\n* What is Type Wildcard in Generics?\n\
    * Explain the Upper Bound type wildcard?\n* Explain Lower Bound type wildcard?\n\
    * How are the different types of wildcards used in generics?\n* What is automatic\
    \ type inference in Generics? What is the diamond operator in Generics?\n\n##\
    \ Generic Method\n\n* Generic methods define their type parameters.\n\n```java\n\
    // generic method\npublic < T > void addId ( T id){\n```\n\n* If we remove the\
    \ `<T>` from the above method, we will get a compilation error as it represents\
    \ the declaration of the type parameter in a generic method.\n* The type (`class`\
    \ or `interface`) that has a generic method does not have to be of `genetic` [sic\
    \ generic] type.\n* While calling the generic method, we do not need to explicitly\
    \ indicate the type parameter.\n\n### Notes\n* Prefer using Generics and parameterized\
    \ classes/methods to enforce compile-time type safety.\n* Use the Bounded Type\
    \ parameter to increase the flexibility of method arguments, at the same time\
    \ it also helps to restrict the types that can be used.\n\n### Questions\n* Explain\
    \ the Generics method?\n* Can you add a Generic method to a non-Generic type?\n\
    * What are the benefits of defining the bounded type as method parameters?\n*\
    \ How is compile type safety enforced by Generics?\n\n## Java Generics vs Java\
    \ Array\n\n### Java Generics\nConsider the following hierarchy,![](Image00010.jpg)\n\
    As both `Car` and `Bike` are derived from `Vehicle`, is it possible to assign\
    \ `List<Car>` or `List<Bike>` to a variable of `List<Vehicle>`?\n\nNo, `List<Car>`\
    \ or `List<Bike>` cannot be replaced with `List<Vehicle>`, because you cannot\
    \ put a `Bike` in the same list that has `cars`. So even though `Bike` is a `Vehicle`,\
    \ it's not is a `Car`.\n\n```java\nList< Bike > bikes = new ArrayList< Bike >();//\
    \ suppose this is allowed\nList< Vehicle > vehicles = bikes ;\nvehicles .add(\
    \ new Car ());// Error - Bike and Vehicle are considered incompatible types.\n\
    Bike bike = vehicles .get( 0 );\n```\n\nJava compiler does this checking compile\
    \ time for incompatible types. For more on this refer to [Type Erasure](#text00081.html_a3VF).\n\
    \n### Java Array\nHowever, unlike Generics, the array of `Car` can be assigned\
    \ to the array of `Vehicle`:\n\n```java\nCar [] cars = new Car [ 3 ];\nVehicle\
    \ [] vehicles = cars ;\n```\n\nFor Array, even though the compiler allows the\
    \ above code to compile but when you run this code, you will get `ArrayStoreException`.\n\
    \n```java\n// this will result in ArrayStoreException\nvehicles [ 0 ] = new Bike\
    \ ();\n```\n\nSo even though the compiler did not catch this issue, the runtime\
    \ type system caught it. An array is reifable types, which means that run time\
    \ is aware of its type.\n\n### Questions\n* What are the reifable types?\n* Why\
    \ can't you assign a Generic collection object of sub-type to a Generic collection\
    \ object of super-type?\n* Why it's allowed to assign an array object of sub-type\
    \ to an array object of super-type? Are Java array more polymorphic?\n\n## Type\
    \ Erasure\nFor Java generic types, due to a process known as type erasure, Java\
    \ compiler discards the type information and it is not available at run time.\
    \ So because the type information is not available runtime, java compiler takes\
    \ extra care to stop you at compile time itself, preventing any heap pollution.\
    \ Generics type is also of non-reifiable types, which means that its type information\
    \ is removed during the compile time.\n\n### Questions\n* What are non-reifable\
    \ types?\n* What is type erasure?\n* What would happen if type erasure is not\
    \ there?\n\n## Co-variance\nCovariance is a concept that you can read items from\
    \ a generics defined with the upper bound type wildcard, but you cannot write\
    \ anything into the collection.\n\nConsider the following declarations with upper\
    \ bound type wildcard:\n\n```java\nList<? extends Vehicle > vehicles = new ArrayList<Bike\
    \ >();\n```\n\nYou are allowed to read from `vehicles` generic collection because\
    \ whatever is present in the list is sub-class of `Vehicle` and can be up-casted\
    \ to a `Vehicle`.\n\n```java\nVehicle vehicle = vehicles .get(0 );\n```\n\nHowever,\
    \ you are not allowed to put anything into a covariant structure.\n\n```java\n\
    // This is a compile-time error\nvehicles .add(new Bike ());\n```\n\nThis would\
    \ not be allowed, because Java cannot guarantee the actual type of the object\
    \ in the generic structure. It can be anything that extends `Vehicle`, but the\
    \ compiler cannot be sure. So you can read, but not write.\n\n### Questions\n\
    * Explain co-variance?\n* Why can't you add an element of subtype to a generic\
    \ defined with upper bound type wildcard?\n\n## Contra-variance\nContra-variance\
    \ is the concept that you can write items to a generic defined with lower bound\
    \ type wildcard, but you cannot read anything into the collection.\n\nConsider\
    \ the following declarations with lower bound type wildcard:\n\n```java\nList<?\
    \ super Car > cars = new ArrayList<Vehicle >();\n```\n\nIn this case, even though\
    \ the `ArrayList` is of type `Vehicle` you can add `Car` into it through contra-variance;\
    \ because `Car` is derived from `Vehicle`.\n\n```java\ncars .add(new Car ());\n\
    ```\n\nHowever, you cannot assume that you will get a `Car` object from this contra-variant\
    \ structure.\n\n```java\n// This is a compile-time error\nCar vehicle = cars .get(\
    \ 0 );\n```\n\n### Questions\n* Explain contra-variance?\n* Why can't you read\
    \ an element from a Generic defined with lower bound type wildcard?\n\n## Co-variance\
    \ vs Contra-variance\n* Use covariance when you only intend to read generic values\
    \ from the collection.\n* Use contra-variance when you only intend to add generic\
    \ values into the collection.\n* Use the specific generic type when you intend\
    \ to do both, read from, and write to the collection.\n\n### Questions\n* When\
    \ should you use co-variance?\n* When should you use contra-variance?\n"
