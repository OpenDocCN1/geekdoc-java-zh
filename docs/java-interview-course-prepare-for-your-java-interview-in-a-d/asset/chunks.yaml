  trans: "\n\n* 什么是集合并发？\n* 如何实现集合同步？\n* 当复合操作需要多个方法才能完成任务时，如何确保集合访问的协调性？\n* 如何实现集合并发？\n\
    * `ConcurrentHashMap` 如何提供多线程并发访问同一个集合？\n* 为什么即使允许多线程同时写入，`ConcurrentHashMap`\
    \ 的性能更好？\n* 在 `ConcurrentHashMap` 和 `HashTable` 之间你更倾向于哪一个？为什么？\n\n## 遍历集合\n在\
    \ Java 中有多种方法遍历集合。以下是最常用的方法。\n\n### Iterable.forEach\n实现了 `Iterable` 接口的集合可以使用\
    \ `forEach` 方法，该 `forEach` 方法接收一个 `Consumer` 类型的参数。\n\n```java\nList<Account>\
    \ accounts = Arrays.asList(\n    new Account(123),\n    new Account(456)\n);\n\
    accounts.forEach(acc -> print(acc));\n```\n\n### for-each 循环\n* 可以使用 for-each\
    \ 循环遍历 `map.entrySet()` 以同时获取键和值。\n```java\nfor (Map.Entry<String, Account> accountEntry\
    \ : map.entrySet()) {\n    print(\"UserId - \" + accountEntry.getKey() + \", \"\
    \ +\n          \"Account - \" + accountEntry.getValue());\n}\n```\n* 可以使用 for-each\
    \ 循环遍历 `map.keySet()` 获取键。\n* 可以使用 for-each 循环遍历 `map.values()` 获取值。\n* 在运行 for-each\
    \ 循环期间，不能对集合进行修改。\n* for-each 循环只能向前导航。\n\n### Iterator\n* `Iterator` 可以向后和向前两个方向移动。\n\
    * 使用 `Iterator` 时，可以在迭代过程中移除条目，而使用 for-each 循环是无法实现的。\n* for-each 循环内部也使用了 `Iterator`。\n\
    ```java\nIterator<Map.Entry<String, Account>> accountIterator = map.entrySet().iterator();\n\
    while (accountIterator.hasNext()) {\n    Map.Entry<String, Account> accountEntry\
    \ = accountIterator.next();\n    print(\"UserId - \" + accountEntry.getKey() +\
    \ \", \" +\n          \"Account - \" + accountEntry.getValue());\n}\n```\n\n###\
    \ 注意事项\n* 应该优先使用 for-each 循环 own `for` 循环，因为 `for` 循环可能是错误的来源，特别是与索引计算相关的错误。\n\
    * `Iterator` 被认为更线程安全，因为如果集合在迭代期间发生变化，它会抛出异常。\n\n## 数据无关访问\n代码的编写方式应该让客户端代码感知不到用于存储集合的内部结构。这使得可以在不破坏任何客户端代码的情况下进行内部更改。因此，为了便于对集合的数据无关访问，必须暴露集合，以便可以使用\
    \ `Iterator` 遍历集合的所有元素。\n\n### 问题\n* 解释遍历集合的不同方法？\n* 在使用 for-each 循环迭代时，可以修改集合的结构吗？\n\
    * 在使用 for-each 循环迭代时，可以修改集合元素的值吗？\n* 关于导航方向，for-each 循环有哪些局限性？\n* 在导航方向上，for-each\
    \ 循环和 `Iterator` 有什么区别？\n* 在使用 `Iterator` 迭代时，可以修改集合结构吗？\n* 在使用 `Iterator` 迭代时，可以修改集合元素的值吗？\n\
    * 在 for-each 循环和 `for` 循环之间，你应该更倾向于哪一个？为什么？\n* 为什么 `Iterators` 被认为是更线程安全的？\n*\
    \ 解释集合的数据无关访问概念？\n* 如何设计你的类以为类中使用的集合提供数据无关访问？\n\n## 快速失败 (Fail Fast)\n`Iterator`\
    \ 方法被认为是快速失败的，因为 `Iterator` 防止了对集合进行的任何结构性修改。这确保了任何失败都能快速报告，而不是让应用程序稍后进入损坏状态。在这种情况下，会抛出\
    \ `ConcurrentModificationException`。来自 `java.util` 的 `Iterators` 是快速失败的。\n\n###\
    \ 问题\n* 集合迭代中“快速失败”术语的含义是什么\n* 快速失败迭代器的好处是什么？\n* 什么是安全（fail-safe）迭代器？\n* 安全迭代器在集合被修改时不会抛出任何异常，因为安全迭代器运行在原始集合的副本上工作。来自\
    \ `java.util.concurrent` 包的迭代器是安全的。\n\n## 错误与异常处理\n### 异常\nJava 中的异常类层次结构：\n\n\
    * 异常是中断程序执行流的异常情况。\n* 所有异常都继承自 `Throwable`。\n* 如果你想创建一个受检异常（checked exception），请继承\
    \ `Exception` 类；如果你想创建一个未受检异常（unchecked exception），请继承 `RuntimeException`。\n*\
    \ 虽然你可以通过继承 `Throwable` 来创建受检异常，但不建议这样做做，因为 `Throwable` 是所有异常和错误的根类。\n\n### 问题\n\
    * 什么是异常（Exception）？\n* Java 中的根级异常有哪些？\n* 创建受检异常应该继承哪个父类？\n* 创建未受检异常应该继承哪个父类？\n\
    \n### 受检异常 vs 未受检异常\n* 受检异常在编译编译进行进行检查。\n* 除了 `RuntimeException` 和 `Error` 之外，受检异常都扩展自\
    \ `Throwable`。\n* 受检异常在程序上是可以恢复的。\n* 你可以通过使用 `try/catch` 或在方法声明中使用 `throws` 子句来处理受检异常。\n\
    * 静态初始化器不能抛出受检异常。\n\n```java\npublic static void main(String args[]) {\n    FileInputStream\
    \ fis = null;\n    try {\n        fis = new FileInputStream(\"details.txt\");\n\
    \    } catch (FileNotFoundException fnfe) {\n        System.out.println(\"Missing\
    \ File :\" + fnfe);\n    }\n}\n```\n\n### 未受检异常\n* 未受检异常在运行时检查。\n* 未受检异常扩展自 `RuntimeException`。\n\
    * 你无法期望从这些异常中恢复。\n* 可以使用良好的编程技术避免未受检异常。\n* 抛出未受检异常有助于揭示缺陷。\n\n```java\npublic\
    \ int getAccountBalance(String customerName) {\n    int balance = 0;\n    if (customerName\
    \ == null) {\n        throw new IllegalArgumentException(\"Null argument\");\n\
    \    }\n    // 返回余额的逻辑\n    return balance;\n}\n```\n\n### 错误 (Error)\n* 错误类用于定义不可恢复的致命异常，应用程序不应该捕获这些异常。\n\
    * 通常情况下，程序员无法从这些异常中恢复做任何操作。\n* 即使你捕获了 `OutOfMemoryError`，你仍可能再次遇到它，因为垃圾回收器可能无法释放内存。\n\
    \n仅在预期失败且有合理恢复方法的情况下使用受检异常；任何其他情况请使用未受检异常。\n\n### 问题\n* 什么是受检异常？\n* 什么是未受检异常？\n\
    * Java 中的 `Error` 类定义了哪些类型的异常？\n* 如何处理受检异常？\n* 如果异常未被处理会发生什么？\n* 处理受检异常的不同方法有哪些？\n\
    * 在 catch 块中你应该使用哪些异常类来处理受检和未受检异常？\n* 你如何在受检异常和未受检异常之间选择？\n* 可以在静态初始化块中抛出受检异常吗？为什么？\n\
    \    * 不能抛出，因为没有特定的地方可以捕获它，而且只执行一次。你必须使用 `try/catch` 来处理受检异常。\n* 处理错误（Error）你应该怎么做？\n\
    \n"
- fmt: "\n# Exception Handling Best Practices\n\nEven though exception handling is\
    \ primarily driven by context, but there must be a consistency in the exception\
    \ handling strategy. Following are few exception handling best practices:\n\n\
    1. Never suppress an exception - as it can lead your program to an unsafe and\
    \ unstable state.\n2. Don't perform excessive exception handling - specifically\
    \ when you do not know how to completely recover from it.\n3. Never swallow an\
    \ exception - as it may lead the application into an inconsistent state, and even\
    \ worst, without recording the reason for it.\n4. Don't catch and continue program\
    \ execution - with some default behavior. Default behavior defined today may not\
    \ be valid in the future.\n5. Don't show a generic error message to the user -\
    \ instead, clean the exception handling code to report user-friendly message with\
    \ a suggestion about the next step.\n6. Don't put more than one exception scenarios\
    \ in single `try-catch` - as it will be impossible to ascertain the reason for\
    \ the exception.\n7. Don't catch multiple checked exceptions in a single `catch`\
    \ block - as it will be impossible to ascertain the reason for the exception.\n\
    8. Don't unnecessarily wrap the exception - which may mask the true source.\n\
    9. Don't reveal sensitive information - instead, sanitize exceptions generated\
    \ specifically from the sources that may reveal sensitive information.\n10. Always\
    \ log exception - unless there is a compelling reason not to do so.\n11. Don't\
    \ catch `Throwable` - as it will be impossible to ascertain the reason for the\
    \ exception.\n12. Don't use exception to control the flow of execution - instead,\
    \ use a boolean to validate a condition where possible.\n13. Handle different\
    \ scenarios programmatically - instead of putting all coding logic in a `try`\
    \ block.\n14. Explicitly name the threads - in a multithreaded application, it\
    \ significantly eases the debugging.\n15. Never throw a generic exception - as\
    \ it will be impossible to ascertain the reason for the exception.\n\n## Questions\n\
    \n* Describe some exception handling best practices?\n* What are the pitfalls\
    \ of suppressing an exception?\n* What is the problem with showing a generic error\
    \ message?\n* What is the downside of swallowing as an exception?\n* What are\
    \ the pitfalls of handling multiple exceptions in a single catch block?\n* What\
    \ would you do if an exception is thrown from a source that contains sensitive\
    \ information? What would you log in such a case and what message would you show\
    \ to the user?\n* What is the pitfall of wrapping all the exceptions into a Generic\
    \ exception class?\n* Why shouldn't you use exceptions to control the flow of\
    \ program execution?\n* Should you log all the exceptions? Why?\n* Why shouldn't\
    \ you use `Throwable` or some other root level class to catch exceptions?\n* What\
    \ criteria should be used to decide which block of code should be included in\
    \ the `try` block?\n* If a nested call is made that goes through multiple methods,\
    \ would you be using a `try-catch` for each method? Why?\n\n`try-with-resources`\
    \ is a Java language construct, which makes it easier to automatically close the\
    \ resources enclosed within the `try` statement.\n\n```java\ntry (FileInputStream\
    \ fis = new FileInputStream(\"details.txt\")) {\n    // Code to read data\n}\n\
    ```\n\n* The resource used with `try-with-resources` must inherit the `AutoCloseable`\
    \ Interface.\n* You can specify multiple resources within a `try` block.\n\n##\
    \ Questions\n\n* Which java construct can you use to close the system resources\
    \ automatically?\n* Which Interface resources must inherit to use a class object\
    \ within a `try-with-resource` construct?\n\n# THREADING\n\n## Threading Terms\n\
    \n* A thread is the smallest piece of executable code within a process.\n* A program\
    \ is a set of ordered operations.\n* A process is an instance of a program.\n\
    * `Context Switch` is an expensive process of storing and restoring the state\
    \ of a thread.\n* Parallel processing is the simultaneous execution of the same\
    \ task on multiple cores.\n* Multithreading is the ability of a CPU to execute\
    \ multiple processes or threads concurrently.\n* Deadlock occurs when two threads\
    \ are waiting for each other to release the lock.\n\n## Basic Concepts\n\n* All\
    \ Java programs begin with the `main()` method on a user thread.\n* The program\
    \ terminates when there is no user thread left to execute.\n* `Thread` maintains\
    \ a private stack and series of instructions to execute.\n* `Thread` has a private\
    \ memory called `thread-local storage`, which can be used to store thread's current\
    \ operation-related data, in a multi-threaded environment.\n* JVM allows the process\
    \ to have multiple threads.\n* Each thread has a priority.\n\n## Questions\n\n\
    * What is a thread?\n* What is a program?\n* What is a process?\n* What is the\
    \ difference between a thread and a process?\n* What is the difference between\
    \ program and process?\n* Explain context switching of thread?\n* What is parallel\
    \ processing?\n* What is multi-threading?\n* How parallel processing and multithreading\
    \ related?\n* What is deadlock?\n* What is a user thread?\n* What is thread-local\
    \ storage? What type of objects should you would store with thread local storage?\n\
    * Do threads share stack memory?\n\n## Thread Lifecycle\n\nThe following are various\
    \ stages of thread states:\n* **New**: Thread is created but not started.\n* **Runnable**:\
    \ Thread is running.\n* **Blocked**: Thread waiting to enter the critical section.\n\
    * **Waiting**: Thread is waiting by calling `wait()` or `join()`.\n* **Time-waiting**:\
    \ Thread waiting by calling `wait()` or `join()` with a timeout.\n* **Terminated**:\
    \ Thread has completed its task and exited.\n\nNotes:You can get the state of\
    \ thread using the `getState()` method.\n\n## Questions\n\n* Describe the different\
    \ stages of thread lifecycle?\n* What is the difference between the blocked state\
    \ and the waiting state?\n* How can you find a thread state?\n* How thread sleep\
    \ is different from thread wait?\n\n## Thread Termination\n\nThe thread should\
    \ be stopped calling `interrupt()` method. Calling `interrupt()` on a thread even\
    \ breaks it out of `Thread.sleep()` state.Long operation executing on the thread\
    \ should recurrently call `isInterrupted()` method to check whether the thread\
    \ is requested to be stopped, where you can safely terminate the current operation\
    \ and perform any cleanup.\n\n```java\nif (Thread.currentThread().isInterrupted())\
    \ {\n    // cleanup and stop execution\n    // for example, a break in a loop\n\
    }\n```\n\nNotes:The `stop()`, `suspend()`, and `resume()` methods are deprecated,\
    \ as using these may lead the program to an inconsistent state.\n\n## Questions\n\
    \n* Define a good strategy to terminate a thread?\n* What is thread interrupt?\
    \ How thread interrupt method is different from the thread stop method?\n* What\
    \ happens if a thread is sleeping and you call interrupt on the thread?\n* Does\
    \ calling interrupt stop the thread immediately?\n\n## Implementing Runnable vs\
    \ Extending Thread\n\nThread instantiated implementing `Runnable` Interface:\n\
    ```java\npublic class RunnableDerived implements Runnable {\n    public void run()\
    \ {\n    }\n}\n```\n\nThread created extending `Thread` class:\n```java\npublic\
    \ class ThreadDerived extends Thread {\n    public void run() {\n    }\n}\n```\n\
    \n* `Runnable`'s `run()` method does not construct a new thread but runs as a\
    \ normal process in the same thread on which it was created, whereas the `Thread`'s\
    \ `start()` methods construct a new thread.\n* `Runnable` is the preferred way\
    \ to create a thread unless you are specializing `Thread` class, which is unlikely\
    \ in most of the case. (Wait, original text preserved)\n\n## Questions\n\n* What\
    \ are the different ways to create a thread?\n* How implementing the `Runnable`\
    \ interface is different from extending `Thread` class?\n* When should you extend\
    \ the `Thread` class?\n* When should you inherit `Runnable` Interface?\n"
  raw: 'Exception Handling Best PracticesEven though exception handling is primarily
    driven by context, but there must be a consistency in the exception handling strategy.
    Following are few exception handling best practices:


    1.  Never suppress an exception - as it can lead your program to an unsafe and
    unstable state.


    2.  Don''t perform excessive exception handling - specifically when you do not
    know how to completely recover from it.


    3.  Never swallow an exception - as it may lead the application into an inconsistent
    state, and even worst, without recording the reason for it.


    4.  Don''t catch and continue program execution - with some default behavior.
    Default behavior defined today may not be valid in the future.


    5.  Don''t show a generic error message to the user - instead, clean the exception
    handling code to report user-friendly message with a suggestion about the next
    step.


    6.  Don''t put more than one exception scenarios in single try-catch - as it will
    be impossible to ascertain the reason for the exception.


    7.  Don''t catch multiple checked exceptions in a single catch block - as it will
    be impossible to ascertain the reason for the exception.


    8.  Don''t unnecessarily wrap the exception - which may mask the true source.


    9.  Don''t reveal sensitive information - instead sanitize exceptions generated
    specifically from the sources that may reveal sensitive information.


    10.  Always log exception - unless there is a compelling reason not to do so.


    11.  Don''t catch Throwable - as it will be impossible to ascertain the reason
    for the exception.


    12.  Don''t use exception to control the flow of execution - instead, use a boolean
    to validate a condition where possible.


    13.  Handle different scenarios programmatically - instead of putting all coding
    logic in a try block.


    14.  Explicitly name the threads - in a multithreaded application, it significantly
    eases the debugging.


    15.  Never throw a generic exception - as it will be impossible to ascertain the
    reason for the exception.


    Questions


    *   Describe some exception handling best practices?


    *   What are the pitfalls of suppressing an exception?


    *   What is the problem with showing a generic error message?


    *   What is the downside of swallowing as an exception?


    *   What are the pitfalls of handling multiple exceptions in a single catch block?


    *   What would you do if an exception is thrown from a source that contains sensitive
    information? What would you log in such a case and what message would you show
    to the user?


    *   What is the pitfall of wrapping all the exceptions into a Generic exception
    class?


    *   Why shouldn''t you use exceptions to control the flow of program execution?


    *   Should you log all the exceptions? Why?


    *   Why shouldn''t you use Throwable or some other root level class to catch exceptions?


    *   What criteria should be used to decide which block of code should be included
    in the try block?


    *   If a nested call is made that goes through multiple methods, would you be
    using a try-catch for each method? Why?


    try-with-resourcetry-with-resource is a Java language construct, which makes it
    easier to automatically close the resources enclosed within the try statement.try
    (FileInputStream fis =


                 new FileInputStream("details.txt" )) {


        // Code to read data


    }


    *   The resource used with try-with-resources must inherit the AutoCloseable Interface.


    *   You can specify multiple resources within a try block.


    Questions


    *   Which java construct can you use to close the system resources automatically?


    *   Which Interface resources must inherit to use a class object within a try-with-resource
    construct?


    THREADINGThreading Terms


    *   A thread is the smallest piece of executable code within a process.


    *   A program is a set of ordered operations.


    *   A process is an instance of a program.


    *   Context Switch is an expensive process of storing and restoring the state
    of a thread.


    *   Parallel processing is the simultaneous execution of the same task on multiple
    cores.


    *   Multithreading is the ability of a CPU to execute multiple processes or threads
    concurrently.


    *   Deadlock occurs when two threads are waiting for each other to release the
    lock.


    Basic Concepts


    *   All Java programs begin with the main() method on a user thread.


    *   The program terminates when there is no user thread left to execute.


    *   Thread maintains a private stack and series of instructions to execute.


    *   Thread has a private memory called thread-local storage, which can be used
    to store thread''s current operation-related data, in a multi-threaded environment.


    *   JVM allows the process to have multiple threads.


    *   Each thread has a priority.


    Questions


    *   What is a thread?


    *   What is a program?


    *   What is a process?


    *   What is the difference between a thread and a process?


    *   What is the difference between program and process?


    *   Explain context switching of thread?


    *   What is parallel processing?


    *   What is multi-threading?


    *   How parallel processing and multithreading related?


    *   What is deadlock?


    *   What is a user thread?


    *   What is thread-local storage? What type of objects should you would store
    with thread local storage?


    *   Do threads share stack memory?


    Thread LifecycleThe following are various stages of thread states.New - Thread
    is created but not started.Runnable - Thread is running.Blocked - Thread waiting
    to enter the critical section.Waiting - Thread is waiting by calling wait() or
    join().Time-waiting - Thread waiting by calling wait() or join() with a specified
    timeout.Terminated - Thread has completed its task and exited.NotesYou can get
    the state of thread using the getState() method on the thread.Questions


    *   Describe the different stages of the thread lifecycle?


    *   What is the difference between the blocked state and the waiting state?


    *   How can you find a thread state?


    *   How thread sleep is different from thread wait?


    Thread TerminationThe thread should be stopped calling interrupt() method. Calling
    interrupt on a thread even breaks it out of Thread.sleep() state.The long operation
    executing on the thread should recurrently call isInterrupted() method to check
    whether the thread is requested to be stopped, where you can safely terminate
    the current operation and perform any required cleanup.if (Thread .currentThread().isInterrupted())
    {


    // cleanup and stop execution


    //, for example, a break in a loop


    }NotesThe stop() , suspend(), and resume() methods are deprecated, as using these
    may lead the program to an inconsistent state.Questions


    *   Define a good strategy to terminate a thread?


    *   What is thread interrupt? How thread''s interrupt method is different from
    the thread stop method?


    *   What happens if a thread is sleeping and you call interrupt on the thread?


    *   Does calling interrupt stop the thread immediately?


    Implementing Runnable vs Extending ThreadThread instantiated implementing Runnable
    Interfacepublic class RunnableDerived


             implements Runnable {


        public void run() {


        }


    }Thread created extending Thread classpublic class ThreadDerived


             extends Thread {


        public void run() {


        }


    }


    *   Runnable''s run() method does not construct a new thread but runs as a normal
    process in the same thread on which it was created, whereas the Thread''s start()
    methods construct a new thread.


    *   Runnable is the preferred way to create a thread unless you are specializing
    Thread class, which is unlikely in most of the case.


    *   By Implementing Runnable you are providing a specialized class an additional
    ability to run too.


    *   Also by separating the task as Runnable you can execute the task using different
    means.


    Questions


    *   What are the different ways to create a thread?


    *   How implementing the Runnable interface is different from extending Thread
    class?


    *   When should you extend the Thread class?


    *   When should you inherit Runnable Interface?'
