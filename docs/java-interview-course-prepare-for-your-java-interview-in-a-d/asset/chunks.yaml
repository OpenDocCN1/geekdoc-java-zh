    \    - [Maven]\n    - [Jenkins]\n\n# JAVA 面试课程\n\n## 引言\n《Java 面试课程》这本书是基于许多专业软件架构师进行数百次技术面试的经验编写的。《Java\
    \ 面试课程》涵盖了应聘者应该具备实战经验并必须深入理解的 Java 概念。书中包含了大量的代码片段和插图来解释这些概念。清晰理解软件设计原理和语言是非常重要的，因为面试中可能会以不同的方式讨论同一个问题。面试官不仅对听正确答案感兴趣，而且对你对问题的看法和想法感兴趣。你解读问题和表达观点的方式对你的成功至关重要。为了建立面对此类面试的勇气，你需要花费大量时间编写代码、阅读技术主题并与同事讨论。希望这本书不仅能帮助你应对下一次面试，还能帮助你完成日常软件开发工作。祝你好运！！！\n\
    \n# JAVA 基础\n\n## Java 程序结构剖析\n下面的代码片段展示了一个简单 Java 程序的结构。\n![](img/Image0002.jpg)\n\
    \n* `Package` (包) - 将相似的类型逻辑分组到命名空间中。它可以防止命名冲突并提供访问保护。\n\n"
- fmt: "\n*   `Import`: Imports the package, so that classes can be used in the code\
    \ by their unqualified names.\n*   `Class`: Represents a type template having\
    \ properties and methods.\n*   `Field`: Represents a member used for holding values.\n\
    *   `Method`: Represents an operation/behavior of the class.\n*   `Modifier`:\
    \ Specifies the access control level of a class and or its members.\n*   `Parameter`:\
    \ Specifies the variable declared in the method definition.\n*   `Argument`: Specifies\
    \ the data passed to the method parameters.\n\n## Questions\n* What is a package?\n\
    * Why do you need to import packages?\n* Why do you need to specify access modifiers?\n\
    * What is a static import?\n    * `static import` enables access to static members\
    \ of a class without the need to qualify it by the class name.\n* What is the\
    \ difference between argument and parameter?\n\n## Compiling and Executing Java\
    \ Code in JVM\nJava program compilation and execution steps![](Image00003.jpg)\n\
    \n1. Java compiler compiles the Java source code (`.java` file) into a binary\
    \ format known as bytecode (`.class` file). Java bytecode is a platform-independent\
    \ instruction set, which contains instructions (`opcode`) and parameter information.\n\
    2. Bytecode is translated by the operating system specific Java Virtual Machine\
    \ (`JVM`) into the platform-specific machine code.\n3. The `Class loader` in `JVM`\
    \ loads the binary representation of the classes into memory.\n4. The `Execution\
    \ engine` in `JVM` executes the byte code and generates operating system specific\
    \ machine instructions. These machine code instructions are executed directly\
    \ by the central processing unit (`CPU`).\n\n## Questions\n* Explain the process\
    \ of Java code compilation and execution?\n* What is bytecode?\n* What is the\
    \ difference between bytecode and source code?\n* What is the machine code?\n\
    * What is the difference between bytecode and machine code?\n* What is `JVM`?\
    \ Is it different or the same for different operating systems?\n* What are the\
    \ major components of `JVM`?\n* What is the role of the class loader in `JVM`?\n\
    * What is the role of the execution engine in `JVM`?\n* What are machine instructions?\n\
    \n## Data Types\n### Primitive Types\n* Primitive data types are `byte`, `boolean`,\
    \ `char`, `short`, `int`, `float`, `long` and `double`.\n* Primitive types always\
    \ have value; if not assigned, it will have a default value.\n* A `long` value\
    \ is suffixed with `L` (or `l`) to differentiate it from `int`.\n* A `float` value\
    \ is suffixed with `F` (or `f`) to differentiate it from `double`. Similarly `double`\
    \ is suffixed with `D` (or `d`).\n* A `char` is unsigned and represent Unicode\
    \ values.\n* When a primitive type is assigned to another variable, a copy is\
    \ created.\n\n### Reference Types\n* All non-primitive types are reference types.\n\
    * Reference types are also usually known as `objects`. Though reference types\
    \ refer to an object in memory.\n* An unassigned object of reference type will\
    \ have `null` as the default value.\n* `Objects` have variables and methods, which\
    \ define their state and behavior.\n* When a reference is assigned to another\
    \ reference, both points to the same object.\n\n## Questions\n* What are primitive\
    \ data types?\n* If a variable of primitive data type is not assigned, what does\
    \ it contain?\n* Why do we suffix `L` with `long`, `F` with `Float` and `D` with\
    \ `double`?\n* What happens when you assign a variable of a primitive data type\
    \ to another variable of the same type?\n* What are the reference data types?\n\
    * What happens when you assign a variable of the reference data type to another\
    \ variable of the same reference type?\n* What are the differences between the\
    \ primitive data types and the reference data types?\n* What is the purpose of\
    \ variables and methods in a reference type?\n* If a variable of reference data\
    \ type is not assigned, what does it contain?\n\n## Naming Convention\n### Camel\
    \ Case vs Pascal Case\n`Camel Case` is the practice of writing composite words\
    \ such that the first letter in each word is capitalized, like `BorderLength`;\
    \ it is also known as `Pascal Case` or `upper Camel Case`. But in the programming\
    \ world, `Camel case` generally starts with the lower case letter, like `borderLength`;\
    \ it is also known as `lower Camel Case`. For this discussion, let's consider\
    \ the format `BorderLength` as `Pascal Case` and the format `borderLength` as\
    \ `Camel Case`. The Naming convention is a set of rules that govern the naming\
    \ for the identifiers, which represents interface, class, method, variable, and\
    \ other entities. Although the choice and implementation of the naming conventions\
    \ often become a matter of debate. Standard naming convention improves the code\
    \ readability, review, and overall understanding.\n\n### Interface\n* The name\
    \ should be `Pascal Case`.\n* The name should be an adjective if it defines behavior,\
    \ otherwise noun.\n```java\npublic interface RunnableClass\n```\n\n### Class\n\
    * The name should be `Pascal Case`.\n* The name should be a noun, as a class represents\
    \ some real-world object.\n```java\npublic class ArrayListMethod\n```\n\n### Method\n\
    * The name should be `Camel Case`.\n```java\npublic boolean isEmpty()\n```\n\n\
    ### Variable\n* The name should be `Camel Case`.\n```java\nprivate long serialVersion\
    \ = 1234L;\n```\n\n### Constants\n* The name should be all uppercase letter. Compound\
    \ words should be separated by underscores.\n```java\nprivate int DEFAULT_CAPACITY\
    \ = 10;\n```\n\n### Enum\n* Enum set names should be all uppercase letters.\n\
    ```java\npublic enum Duration {\n    SECOND, MINUTE, HOUR\n}\n```\n\n### Acronyms\n\
    * Even though acronyms are generally represented by all Upper Case but in Java,\
    \ only the first letter of acronyms should be upper case and rest lower case.\n\
    ```java\npublic void parseXml(){}\n```\n\n## Questions\n* What is the meaning\
    \ of naming convention?\n* Why do we need a naming convention?\n* What is the\
    \ difference between `Camel Case` and `Pascal Case`?\n* What is the difference\
    \ between `Upper Camel Case` and `Lower Camel Case`?\n* Explain naming convention\
    \ for Interface, Class, Method, Variable, Constant, Enum, and Acronyms?\n\n##\
    \ ObjectEvery Java class is inherited, directly or indirectly, from `java.lang.Object`\
    \ class, which also means that a variable of `Object` class can reference the\
    \ object of any class. Because of inheritance, following `Object` class methods\
    \ are available for overriding with class-specific code.\n\n* `hashCode()` returns\
    \ hash-code value for the object.\n* `equals()` compares two objects for equality\
    \ using `==` operator.\n* `clone()` creates copy of object. An `Overriding` class\
    \ should inherit the `Cloneable` interface and implement a `clone()` method to\
    \ define the meaning of copy.\n* `toString()` returns string representation of\
    \ the object.\n* `finalize()` called by Garbage Collector to clean up resources.\
    \ `Object`'s implementation of `finalize()` does nothing.\n\n## Questions\n* What\
    \ is the base class for all Java classes?\n* What are the different methods of\
    \ `Object` class available for overriding in the derived class?\n* What happens\
    \ if your class does not override `equals` method from the `Object` class?\n \
    \   * The `equals()` method in `Object` class compares whether object references\
    \ are the same and not the content. To compare content, you need to override the\
    \ `equals()` method.\n* What is the purpose of the `clone()` method?\n* Why should\
    \ the overriding class define its implementation of the `clone()` method?\n* What\
    \ happens if the overriding class does not override the `clone()` method?\n  \
    \  * In case if an object contains references to an external object, any change\
    \ made to the referenced object will be visible in the cloned too.\n"
