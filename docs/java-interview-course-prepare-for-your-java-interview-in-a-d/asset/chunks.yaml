  trans: "\n\n# @Override\n\n`@Override` 注解是一种显式声明重写基类中定义的方法实现的意图的方法。Java 对所有此类带有注解的方法进行编译时检查。它提供了一种简单的方法，可以防止在想要重写基类方法时不小心写了错误的方法签名。\n\
    \n如果派生类定义了一个与基类中方法签名相同的方法，则派生类中的方法将隐藏基类中的方法。通过在子类方法的头部加上 `@Override` 注解，你可以检测是否无意中尝试重载（overload）而非重写（override）方法。\n\
    \n### 问题\n*   `@Override` 注解的目的是什么？\n*   如果你定义了一个与父类中签名相同的方法且没有使用 `@Override`\
    \ 注解，会发生什么？\n*   `@Override` 注解的好处有哪些？\n\n## 重载 (Overloading)\n\n*   方法重载是指定义多个同名但参数不同的方法。\n\
    *   方法重载是静态多态或编译时多态的例子。\n*   在静态多态中，是在编写代码时决定调用哪个特定的实现的。\n\n### 方法重载的规则\n*   可以通过定义与现有方法同名的方法来重载方法，但该方法具有：\n\
    \    *   不同数量的参数。\n    *   不同数据类型的参数。\n    *   不同的参数顺序。\n*   重载方法的返回类型可以是不同的。\n\
    *   当仅在返回类型不同时，不能定义同名且相同参数的方法。\n*   重载方法不需要抛出与它所重载的方法相同的异常。\n\n## 运算符重载 (Operator\
    \ Overloading)\n\n运算符重载是一种增强依赖语言的运算符定义的能力。例如，你可以使用 `+` 运算符来加两个整数，也可以用于拼接两个字符串。\n\
    \n### 问题\n*   解释什么是方法重载？\n*   什么是静态多态？\n*   静态多态和动态多态之间的区别是什么？\n*   你可以重写一个方法使得所有参数都相同，仅区别于返回类型吗？\n\
    *   什么是运算符重载？\n*   方法重载的好处有哪些？\n*   重写（riding）和重载（overloading）的区别是什么？\n\n## 抽象\
    \ (Abstraction)\n\n抽象有助于将关注从具体实现的内部细节转移到类型及其行为。抽象的核心在于隐藏关于数据、其内部表示及其实现的细节。另一个同样重要的面向对象概念是封装，它可以用于抽象类的复杂性和内部实现。抽象还帮助使软件具有可维护性、安全性，并提供了在不破坏任何客户端的情况下更改实现的能力。\n\
    \n### 问题\n*   什么是抽象？\n*   抽象与封装有什么区别？\n*   抽象的好处有哪些？\n*   你可以在没有封装的情况下实现抽象吗？\n\
    \n## 继承 (Inheritance)\n\n继承是一种面向对象的设计概念，涉及重用现有的类定义（称为基类）并通过继承该类来定义更特殊的类类别（称为子类）。它侧重于在子类与其父类之间建立\
    \ \"IS-A\"（是一个）的关系。继承也被用作实现多态的技巧；当派生类型实现了在基类型中定义的方法时即可。\n\n### 继承的规则\n*   根据创建特定类别的需求，可以存在多级继承。\n\
    *   Java 只允许单类继承，因为多重继承会带来相应的复杂性；请检查菱形问题（Diamond Problem）。\n*   声明为 `final` 的类不能被扩展。\n\
    *   声明为 `final` 的类方法不能被重写。\n*   基类的构造函数和私有成员不被继承。\n*   可以使用 `super()` 调用基类的构造函数。\n\
    *   可以使用 `super` 关键字调用基类的被重写方法，否则你将递归地调用重写方法。\n\n### 问题\n*   解释什么是继承？\n*   继承的目的是什么？\n\
    *   决定两个类之间继承关系的标准是什么？\n*   继承在多态中起着什么样的重要作用？\n*   你可以继承 `final` 类吗？\n*   如果你不使用\
    \ `super` 关键字调用被重写的成员，会发生什么？\n*   为什么你不能继承父类中定义的静态成员？\n*   如果 Java 允许多重继承，人们可能会面临哪些挑战？\n\
    \n## 组合 (Composition)\n\n组合是一种与继承密切相关的面向对象的设计概念，因为它也涉及重用类；但它侧重于在类之间建立 \"HAS-A\"\
    （有一个）的关系。因此，与处理扩展类特性的继承不同，组合通过组合类来重用类。组合通过存储另一个类的引用作为成员来实现的。\n\n### 继承 vs 组合\n\
    \n继承的主要问题是它破坏了封装，因为派生类与基类的实现紧密耦合。当一个类的设计时没有考虑未来的继承范围，且你对基类没有控制权时，问题就会变得复杂。基类的变化可能会导致派生类的破坏。因此，只有在基类和派生类定义之间存在完美的\
    \ \"IS-A\" 关系时才应该使用继承；在任何疑问的情况下，优先选择组合而非继承。\n\n### 问题\n*   解释什么是组合？\n*   继承和组合有什么区别？\n\
    *   决定两个类之间组合关系的标准是什么？\n*   解释几个使用组合可以避免的继承问题？\n*   在什么时候你应该优先选择组合而不是继承，反之亦然？\n\
    \n## 基础设计概念 (FUNDAMENTAL DESIGN CONCEPTS)\n\n### 依赖注入 (Dependency Injection) vs\
    \ 反转控制 (Inversion of Control)\n依赖注入和反转控制通过松耦合依赖项来促进模块化软件开发。独立的模块对象也具有可维护性和可测试性。\n\
    \n### 反转控制 (Inversion of Control)\n反转控制提供了一种设计范式，依赖项不是由需要的对象显式创建，而是由外部源创建并提供的。\n\
    \n### 依赖注入 (Dependency Injection)\n依赖注入是 IoC 的一种形式，用于在运行时提供对象依赖；通过构造函数、setter\
    \ 方法或服务定位器实现。注解和接口用于识别创建和注入依赖的源。\n\n*   依赖注入的模式：\n    *   通过构造函数\n    *   通过 setter\n\
    \    *   通过方法参数\n*   注入依赖是依赖注入框架的责任。\n\n![](img/Image0004.jpg) 下方的代码演示了作为构造函数参数的依赖注入。\n\
    \n```java\npublic class Account {\n    UserService userService;\n    AccountService\
    \ accountService;\n\n    public Account(UserService userService, AccountService\
    \ accountService) {\n        this.userService = userService;\n        this.accountService\
    \ = accountService;\n    }\n}\n```\n\n不仅在生产系统中，DI 和 IoC 在单元测试也提供了巨大的帮助，因为它提供了模拟（mock）依赖的能力。Spring\
    \ 框架是 DI 容器的一个示例。\n\n注意确保在依赖对象被请求之前已经进行了初始化是重要的。\n\n### 问题\n*   什么是反转控制？\n*  \
    \ 什么是依赖注入？\n\n"
- fmt: "\n* What is the difference between the Inversion of Control and Dependency\
    \ Injection?\n* What are the different ways to implement Dependency Injection?\n\
    * What the different ways to identify dependency sources?\n* Who has the responsibility\
    \ to inject dependent objects?\n* How Dependency injection is useful for unit\
    \ testing?\n* How Dependency Injection can be used for modular software development?\n\
    \n## Service Locator\n\nThe service locator is an object that encapsulates the\
    \ logic to resolve the service requested. The service locator also provides an\
    \ interface to register services with it, which allows you to replace the concrete\
    \ implementation without modifying the objects that depend on these services.\n\
    \nIn the figure below, `Account` class uses `ServiceLocator` to resolve the `AccountService`\
    \ and `UserService` it depends on.\n\n![](Image00005.jpg)\n\n```java\npublic class\
    \ Account {\n    UserService userService ;\n    AccountService accountService\
    \ ;\n\n    public Account() {\n        this.userService = ServiceLocator.getService(UserService.class);\n\
    \        this.accountService = ServiceLocator.getService(AccountService.class);\n\
    \    }\n}\n```\n\n### Benefits of Service Locator\n* The class does not have to\
    \ manage any service dependency and its life cycle.\n* It helps to test a class\
    \ independently, without the availability of real services class depends on.\n\
    * It enables runtime optimization; as services can be registered and unregistered\
    \ runtime.\n\n### Questions\n* Explain the Service Locator design pattern?\n*\
    \ What are the benefits of using a Service Locator design pattern?\n* What is\
    \ the difference between Service Locator and Dependency Injection pattern?\n*\
    \ When would you prefer Service Locator over Dependency Injection and vice versa?\n\
    * How does Service Locator help in testing?\n\n## Diamond Problem\n\nJava doesn't\
    \ allow extending multiple classes because of the ambiguity that could arise when\
    \ more than one super-classes have the same signature method, and the compiler\
    \ can't decide which super-class method to use.\n\nConsider the inheritance hierarchy\
    \ set out in the figure below. If the method `calculate()` defined in the `Base`\
    \ class is overridden by both, `DerivedLeft` and `DerivedRight`, then it creates\
    \ ambiguity regarding which version of `calculate()` does the `Confused` class\
    \ inherits.\n\n![](Image00006.jpg)\n\nIn the code below there is an ambiguity\
    \ regarding which version of `calculate()` should be called. This is known as\
    \ Diamond Problem in Java.\n\n```java\npublic static void main (String [] args){\n\
    \    Base base = new Confused ();\n    base.calculate();\n}\n```\n\n### Diamond\
    \ Problem with Default Interface Method\n\nDiamong problem is possible with the\
    \ introduction of Default Interface methods. If `Base`, `DerivedLeft`, and `DerivedRight`\
    \ are Interfaces, and there exists `calculate()` as default interface method is\
    \ all three, it will cause the Diamond Problem. In such a scenario the `Confused`\
    \ class has to explicitly re-implement the `calculate()` method; otherwise, the\
    \ ambiguity will be rejected by the compiler.\n\n### Questions\n* Explain the\
    \ Diamond Problem in Java?\n* Why Java does not provide multiple inheritances?\n\
    * Using default interface methods, a class can still inherit two interfaces with\
    \ the same signature method; would this not cause Diamond Problem? How can you\
    \ solve it?\n\n## Programming to interface\n\nProgramming to interface forms the\
    \ basis for modular software development by facilitating decoupling between software\
    \ components. A high level of decoupling improves maintainability, extensibility,\
    \ and testability of software components. Modular software design also helps to\
    \ improve speed to market, as it facilitates parallel software development between\
    \ multiple teams working with the same code base. It's the Programming to Interface\
    \ design paradigm that forms the foundation for Inversion of Control, which manages\
    \ dependency relationships in any large software application.\n\nLet take a very\
    \ simple example. Suppose we have a method to sort a collection which accepts\
    \ `Map` Interface as the parameter. It means that the `sort()` method is not tied\
    \ to any specific type of `Map` implementation and you can pass any concrete implementation\
    \ of `Map` interface.\n\n```java\npublic static void main ( String [] args){\n\
    \    sort( new HashMap<>());\n    sort( new TreeMap<>());\n    sort( new ConcurrentSkipListMap<>());\n\
    \    sort( new TreeMap<>());\n}\n\npublic static void sort(Map map){\n    // perform\
    \ sort\n}\n```\n\n### Benefits of programming to interface\n* Based on the context,\
    \ you can runtime select the most appropriate behavior.\n* For testing, you can\
    \ pass mock objects or stubs implementation.\n* The interface/API definitions\
    \ or the contract does not change frequently.\n* Programming to Interface also\
    \ facilitates parallel development between teams, as developers from different\
    \ ream can continue writing code against an interface before doing final integration.\n\
    \n### Questions\n* What is the concept of programming to interface?\n* What are\
    \ the benefits of programming to interface?\n* How does programming to interface\
    \ facilitate decoupling between software components?\n* How dependency injection\
    \ and programming to the interface are inter-related? Can you achieve dependency\
    \ injection without supporting programming to interface?\n* What are the benefits\
    \ of modular software?\n* How does programming to interface help with unit testing?\n\
    \n## Abstract Class vs Interface\n\n### Abstract Class\nAn Abstract class cannot\
    \ be instantiated but can be extended. Extend abstract class when you want to\
    \ enforce a common design and implementation among classes, and expect the derived\
    \ class to implement required specialized functionality.\n\n### Interface\nThe\
    \ Interface is a set of related methods, which defines its behavior and its contract\
    \ with the outside world. Use an interface when you want to define common behavior\
    \ among unrelated classes. An interface can also be defined without any method\
    \ and such interface is known as marker interface; such interfaces are generally\
    \ used to categorize the classes. An example of a marker interface is `java.io.Serializable`,\
    \ which does not define any method but must be implemented by the classes that\
    \ support serialization.\n\n### Difference between Abstract Class and Interface\n\
    * An Abstract class can be updated to add more capabilities to a class whereas\
    \ Interface can be added to implement new behavior to the class. Though with the\
    \ introduction of default interface methods, even Interfaces can be extended to\
    \ have more capabilities.\n* An Interface can be multiple inherited; whereas,\
    \ an abstract class cannot.\n* Interface define behavior, so it can even be applied\
    \ to unrelated classes; whereas, related classes extend Abstract class.\n* Abstract\
    \ class methods can have any type of access modifier; whereas, Interface has all\
    \ public members.\n* An Abstract class can have state associated, which is not\
    \ possible with Interface.\n* An Abstract class can be extended without breaking\
    \ the classes that extend it; whereas, any change in Interface, except for non-default\
    \ and non-static methods, will break the existing implementation.\n\n### Questions\n\
    * If an abstract class cannot be instantiated, then what could be a need to define\
    \ a constructor for an Abstract class?\n    * A constructor can be used to perform\
    \ the required field initialization and also to enforce class constraints.\n*\
    \ Define Abstract class? What role an Abstract class plays in a class design?\n\
    * Define Interface? What role does Interface play in class design?\n* When would\
    \ you prefer using Abstract class over Interface and vice-versa?\n* Explain various\
    \ differences between Abstract Class and Interface?\n* What are marker interfaces?\
    \ How are marker interfaces used?\n* Can you declare an interface method static?\n\
    * With the introduction of default interface methods; how Abstract class is still\
    \ different from an Interface?\n"
