  \ cityName = \"London\" ;`\n\n`String capital = \"London\" ;`![](img/Image00009.jpg)问题：\n\
  \n* 解释字符串池（String Pool）内存管理？\n* 字符串字面量是如何存储在内存中的？\n* 字符串池是如何针对内存优化的？\n* 字符串对象（String\
  \ Objects）是如何存储在内存中的？\n* 为什么 Java 不能使用类似字符串池的机制来存储其他类型的数据对象？\n\n## 不变性 - 安全问题\n\n\
