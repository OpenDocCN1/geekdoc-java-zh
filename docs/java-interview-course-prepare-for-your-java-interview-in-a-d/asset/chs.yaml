  \n## 引言\n《Java 面试课程》这本书是基于许多专业软件架构师进行数百次技术面试的经验编写的。《Java 面试课程》涵盖了应聘者应该具备实战经验并必须深入理解的\
  \ Java 概念。书中包含了大量的代码片段和插图来解释这些概念。清晰理解软件设计原理和语言是非常重要的，因为面试中可能会以不同的方式讨论同一个问题。面试官不仅对听正确答案感兴趣，而且对你对问题的看法和想法感兴趣。你解读问题和表达观点的方式对你的成功至关重要。为了建立面对此类面试的勇气，你需要花费大量时间编写代码、阅读技术主题并与同事讨论。希望这本书不仅能帮助你应对下一次面试，还能帮助你完成日常软件开发工作。祝你好运！！！\n\
  \n## JAVA 基础\n\n## Java 程序结构剖析\n下面的代码片段展示了一个简单 Java 程序的结构。\n![](img/Image0002.jpg)\n\
  \n* `Package` (包) - 将相似的类型逻辑分组到命名空间中。它可以防止命名冲突并提供访问保护。\n\n\n\n\n\n*   `Import`:\
  \ 导入包，以便在代码中使用非限定名称使用类。\n*   `Class`: 类，表示具有属性和方法的类型模板。\n*   `Field`: 字段，表示用于存储值的成员。\n\
  *   `Method`: 方法，表示类的操作/行为。\n*   `Modifier`: 修饰符，指定类和/或成员的访问控制级别。\n*   `Parameter`:\
  \ 参数，指定方法定义中声明的变量。\n*   `Argument`: 实参，指定传递方法参数的数据。\n\n## Questions\n* 什么是包（package）？\n\
  * 为什么要导入包？\n* 为什么要指定访问修饰符？\n* 什么是静态导入（static import）？\n    * `static import` 允许在不需要通过类名限定的情况下访问类的静态成员。\n\
  * 实参和参数之间的区别是什么？\n\n## 在 JVM 中编译和执行 Java 代码\nJava 程序的编译和执行步骤![](img/Image00003.jpg)\n\
  \n1. Java 编译器将 Java 源代码（`.java` 文件）编译成一种二进制格式，称为字节码（`.class` 文件）。Java 字节码是一种平台无关的指令集，包含了指令（`opcode`）和参数信息。\n\
  2. 字节码由特定操作系统的 Java 虚拟机（`JVM`）翻译成特定平台的机器码。\n3. `JVM` 中的类加载器（Class loader）将类的二进制表示加载到内存中。\n\
  4. `JVM` 中的执行引擎（Execution engine）执行字节码并生成特定操作系统的机器指令。这些机器码指令由中央处理器（`CPU`）直接执行。\n\
  \n## Questions\n* 解释 Java 代码编译和执行的过程？\n* 什么是字节码？\n* 字节码和源代码之间的区别是什么？\n* 什么是机器码？\n\
  * 字节码和机器码之间的区别是什么？\n* 什么是 `JVM`？它对于不同的操作系统是相同还是不同？\n* `JVM` 的主要组件有哪些？\n* 类加载器在 `JVM`\
  \ 中起什么？\n* 执行引擎在 `JVM` 中起什么？\n* 什么是机器指令？\n\n## 数据类型\n### 原始类型\n* 原始数据类型有 `byte`、`boolean`、`char`、`short`、`int`、`float`、`long`\
  \ 和 `double`。\n* 原始类型始终有值；如果没有赋值，它将有一个默认值。\n* `long` 值后面带有后缀 `L`（或 `l`）以区别于 `int`。\n\
  * `float` 值后面带有后缀 `F`（或 `f`）以区别于 `double`。同样，`double` 后面带有后缀 `D`（或 `d`）。\n* `char`\
  \ 是无符号的，表示 Unicode 值。\n* 当将原始类型赋值给另一个变量时，会创建一个副本。\n\n### 引用类型\n* 所有非原始类型都是引用类型。\n\
  * 引用类型通常也被称为 `objects`（对象）。尽管引用类型指的是内存中的一个对象。\n* 未赋值的引用类型对象将具有 `null` 作为默认值。\n*\
  \ `Objects` 变量和方法，它们定义了对象的状态和行为。\n* 当将一个引用赋值给另一个引用时，它们都指向同一个对象。\n\n## Questions\n\
  * 什么是原始数据类型？\n* 如果原始数据类型的变量没有赋值，它包含什么？\n* 为什么我们在 `long` 后面加 `L`，在 `Float` 后面加 `F`，在\
  \ `double` 后面加 `D`？\n* 将一个原始数据类型的变量赋值给相同类型的另一个变量时会发生什么？\n* 什么是引用数据类型？\n* 将引用数据类型的变量赋值给另一个相同引用类型的变量时会发生什么？\n\
  * 原始数据类型和引用数据类型之间的区别是什么？\n* 引用类型中变量和方法的目的是什么？\n* 如果引用数据类型的变量没有赋值，它包含什么？\n\n## 命名规范\n\
  ### 驼峰命名法（Camel Case）与帕斯卡命名法（Pascal Case）\n`Camel Case` 是编写复合单词时使每个单词的首字母大写的做法，例如\
  \ `BorderLength`；它也称为 `Pascal Case` 或大驼峰命名法。但在编程世界中，`Camel case` 通常以小写字母开头，例如 `borderLength`；它也称为小驼峰命名法。为了讨论方便，我们将格式\
  \ `BorderLength` 视为 `Pascal Case`，将格式 `borderLength` 视为 `Camel Case`。命名规范是一组规范标识符命名的规则，标识符代表接口、类、方法、变量和其他实体。尽管命名规范的选择和实现往往是一个争论的话题。标准的命名规范可以提高代码的可读性、审查和整体理解。\n\
  \n### 接口\n* 名称应该是 `Pascal Case`。\n* 如果定义的是行为，名称应该是形容词，否则是名词。\n```java\npublic interface\
  \ RunnableClass\n```\n\n### 类\n* 名称应该是 `Pascal Case`。\n* 名称应该是名词，因为类代表某些现实世界中的对象。\n\
  ```java\npublic class ArrayListMethod\n```\n\n### 方法\n* 名称应该是 `Camel Case`。\n```java\n\
  public boolean isEmpty()\n```\n\n### 变量\n* 名称应该是 `Camel Case`。\n```java\nprivate\
  \ long serialVersion = 1234L;\n```\n\n### 常数\n* 名称应该是全大写字母。复合词之间用下划线分隔。\n```java\n\
  private int DEFAULT_CAPACITY = 10;\n```\n\n### 枚举\n* 枚举集合的名称应该是全大写字母。\n```java\n\
  public enum Duration {\n    SECOND, MINUTE, HOUR\n}\n```\n\n### 缩写\n* 尽管缩写词通常用全大写表示，但在\
  \ Java 中，只有缩写词的首字母应该大写，其余部分小写。\n```java\npublic void parseXml(){}\n```\n\n## Questions\n\
  * 命名规范的含义是什么？\n* 为什么我们需要命名规范？\n* `Camel Case` 和 `Pascal Case` 的区别是什么？\n* `Upper\
  \ Camel Case` 和 `Lower Camel Case` 的区别是什么？\n* 解释接口、类、方法、变量、常量、枚举和缩写的命名规范？\n\n##\
  \ Object\n每个 Java 类都直接或间接地地继承自 `java.lang.Object` 类，这意味着 `Object` 类的变量可以引用任何类的对象。由于继承，以下\
  \ `Object` 类方法可以被重写以实现类特定的代码。\n\n* `hashCode()` 返回对象的哈希码值。\n* `equals()` 使用 `==`\
  \ 运算符比较两个对象的等价性。\n* `clone()` 创建对象的副本。重写类应该继承 `Cloneable` 接口并实现 `clone()` 方法以定义拷贝的含义。\n\
  * `toString()` 返回对象的字符串表示。\n* `finalize()` 由垃圾回收器调用以清理资源。`Object` 对 `finalize()`\
  \ 的实现什么都不做。\n\n## Questions\n* 所有 Java 类的基类是什么？\n* 派生类可以重写哪些 `Object` 类方法？\n* 如果你的类没有重写\
  \ `Object` 的 `equals` 方法会发生什么？\n    * `Object` 类中的 `equals()` 方法比较的是对象引用是否相同而不是内容。要比较内容，你需要重写\
  \ `equals()` 方法。\n* `clone()` 方法目的是目的是？\n* 为什么重写类应该定义自己的 `clone()` 方法实现？\n* 如果重写类没有重写\
  \ `clone()` 方法会发生什么？\n    * 如果一个对象包含指向外部对象的引用，对被引用对象的任何更改在克隆中也是可见的。\n\n\n\n\n\n\
  ## 访问修饰符\n\n访问修饰符决定了其他类是否可以访问变量或调用方法。在类级别，你可以使用 `public` 修饰符或不使用修饰符。对于类成员，你可以使用以下访问修饰符之一：\n\
  \n- `private`: 外部类无法访问该成员。\n- `protected`: 子类可以访问该成员。\n- `public`: 中所有的类都可以访问该成员。\n\
  - `无修饰符`: 包内的所有类都可以访问此成员。\n\n重写方法中的访问修饰符应该与被重写的方法相同或限制更。可选的 `static` 和 `final` 关键字经常与访问修饰符配合使用。\n\
  \n## 问题\n\n* 访问修饰符目的是什么？\n* 类访问修饰符列表与成员访问修饰符列表是否存在区别？\n* `private`、`protected` 和\
  \ `public` 访问修饰符的作用范围是什么？\n* 当类没有指定访问修饰符时会发生什么？\n* 如果子类位于不同的包中，它仍然能看到父类的 `protected`\
  \ 成员吗？\n* 为什么派生类中的成员访问修饰符应该比基类的限制更少？\n    * 根据继承的概念，你应该能够使用父类引用使用子类对象。如果子类成员使用了具有更限制性的访问修饰符进行降级，这将是不可能的。\n\
  * 决定类访问访问修饰符的标准应该是什么？\n    * 你应该使用限制性最强的访问修饰符以确保安全性并防止任何误用。\n\n## static\n\n###\
  \ static 类\n只有嵌套/内部类可以被定义为 `static`，而外部类不能。\n\n### static 变量和方法\n当对变量和方法使用 `static`\
  \ 关键字时，它表示这些成员属于类，并且这些成员被类的所有对象共享。静态成员没有副本，并且仅存储在内存的单一位置。这些成员应该通过类名进行访问。\n\n`static`\
  \ 方法无法访问实例方法或属性，因为静态成员属于类，而不是类的实例。\n\n## 问题\n\n* 什么是 `static` 类？\n* 任何类都可以声明为 `static`\
  \ 类吗？\n* 什么是 `static` 方法？\n* 什么是 `static` 变量？\n* 谁拥有 `static` 类成员？这与非静态类有何不同？\n\
  * 你应该如何访问 `static` 的类成员？\n* `static` 方法可以访问实例成员吗？为什么？\n\n## final\n\n### final 类\
  \ A\n`final` 类不能被扩展，这使得类既安全又高效。\n\n### final 方法 A\n`final` 方法不能被重写，这防止了向类中引入任何意外行为的可能性。\n\
  \n### final 变量 A\n`final` 变量引用不能更改，但 `final` 变量引用的 `mutable object` 的内容是可以更改的。\n\
  \n### 空 final 变量\n一个在声明处未初始化的变量。\n\n### 注意事项\n\n* 空 final 变量需要在类的构造函数中进行初始化。\n*\
  \ `final` 变量类似于不可变变量，因此与 `final` 变量相关的计算可以被缓存以优化。\n\n## 问题\n\n* 解释 `final` 类？\n\
  * 声明一个类为 `final` 有什么好处？\n* 解释 `final` 方法？\n* 声明一个方法为 `final` 有什么好处？\n* 解释 `final`\
  \ 变量？\n* 声明一个变量为 `final` 有什么好处？\n* 当你声明一个变量为 `final` 时，你可以更改它引用的对象的内容吗？\n* 当你声明一个变量为\
  \ `final` 时，你可以将其引用另一个对象吗？\n* 什么是空 final 变量？\n* 将变量声明为 `final` 如何有助于优化？\n\n## static\
  \ 初始化块\n\n* `static` 初始化块通常用于确保在类的任何对象使用之前，所有需要的类资源（如驱动程序、连接字符串等）都是可用的。\n* `static`\
  \ 块无法访问实例成员。\n* `static` 块对一个类只被调用一次。\n* 类可以定义任意数量的初始化块，它们按照它们在类中的定义顺序被调用。\n* 你只能从\
  \ `static` 块中抛出未检查的异常。\n\n在这个代码示例中，静态初始化块为类创建一次连接字符串。\n\n```java\nprivate static\
  \ String connectionString;\n\nstatic {\n    connectionString = getConnectionSting();\n\
  }\n```\n\n## 问题\n\n* 什么是静态初始化块？\n* 静态初始化块的主要目的是什么？在 `static` 块中你应该做哪些类型的事情？\n* 你能从静态初始化块访问实例成员吗？为什么？\n\
  * 每当创建类的实例时，静态初始化块都会被调用吗？\n* 一个类中可以定义多少个 `static` 块？\n* 当定义多个 `static` 块时，关于它们的执行顺序的标准是什么？\n\
  * 你能从静态初始化块抛出异常吗？什么类型？\n\n## finally\n\n`finally` 块的主要目的是确保在执行完 `try` 块中的操作后，应用程序恢复到一致状态。在\
  \ `finally` 块中，通常可以关闭流和数据库连接等资源以防止泄漏。\n\n```java\nInputStream is = null;\n\ntry\
  \ {\n    is = new FileInputStream(\"input.txt\");\n} finally {\n    if (is != null)\
  \ {\n        is.close();\n    }\n}\n```\n\n### finally 块执行\n编译器会尽全力执行 `finally`\
  \ 块，以下情况除外：\n\n* 调用了 `System.exit()`。\n* 当前线程被中断。\n* JVM 崩溃。\n\n### 从 finally 返回\n\
  你永远不要从 `finally` 块返回。如果 `finally` 块中存在 `return` 语句，它将立即返回。\n\n## 问题\n\n* 你如何保证某段代码始终执行？\n\
  * 在 `finally` 块中你应该做什么？\n* 在 `catch` 块中你应该做什么？\n* `finally` 块总是执行吗？在什么情况下 `finally`\
  \ 块不执行？\n* 你应该从 finally 返回吗？为什么？\n\n## finalize()\n\n当 `垃圾 Collector` 确定没有对象的引用时，它会在从内存移除该对象之前调用该对象的\
  \ `finalize()` 方法。\n\n如果对象没有进入垃圾收集范围，或者 JVM 在垃圾收集有机会运行之前停止，`finalize()` 方法将不会被调用。\n\
  \n可以重写 `finalize()` 方法来释放如文件句柄、数据库连接等资源；但你不能依赖 `finalize()` 来这样做，而应该显式地释放此类资源。\n\
  \n无法保证 JVM 会调用 `finalize()`，因此你应该将 `finalize()` 视为释放资源的备用机制。尽可能地使用 `try-with-resource`\
  \ 结构在资源使用完成后自动释放它们。\n\n如果 `finalize()` 方法抛出未捕获的异常，该异常将在终止终结化之前被忽略。\n\n## 问题\n\n\
  * Java 中的 `finalize()` 方法是什么？\n* `finalize()` 方法在什么时候被调用？\n* 谁调用 `finalize()` 方法？\n\
  * `finalize()` 方法中可以做哪些事情？\n* 你应该显式调用 `finalize()` 方法来释放资源吗？为什么？\n* 还有哪些替代机制可以用于释放系统资源？\n\
  * 如果从 `finalize()` 方法抛出一个未处理的异常会发生什么？\n\n\n\n\n\n## 宽转换与 窄转换\n\n## 宽转换 (Widening\
  \ Conversions)\n宽转换涉及将子类（派生类）对象赋值给父类（基类）对象。在下面的示例中，`Car` 继承自 `Vehicle`。\n\n```java\n\
  Car car = new Car ();\nVehicle vehicle = car ;\n```\n\n## 窄转换 (Narrowing Conversions)\n\
  窄转换涉及将父类（基类）对象赋值给子类（派生类）对象。转换需要显式类型转换。在下面的示例中，`Bike` 继承自 `Vehicle`。\n\n```java\n\
  Vehicle vehicle = new Vehicle ();\nBike bike = ( Bike ) vehicle ;\n```\n\n## 问题\n\
  * 什么是宽转换？\n* 什么是窄转换？\n* 窄转换中是否存在数据丢失的可能性？\n\n## getters 和 setters\n以下代码演示了 getter\
  \ 和 setter 的用法。\n\n```java\npublic class Person {\n    private String name ;\n\n\
  \    public String getName() {\n        return StringUtils.capitalize( name );\n\
  \    }\n\n    public void setName( String name) {\n        if (name.isEmpty()){\n\
  \            System.out.println( \"Name string is empty\" );\n            //throw\
  \ exception\n        }\n        this . name = name;\n    }\n}\n```\n\n## 使用 getter\
  \ 和 setter 的好处\n* 可以在 setter 中执行验证，或在以后需要时添加。\n* 根据内部（存储）或外部（调用者）的需求，值可以有不同的表示形式。\n\
  * 它隐藏了用于存储值的内部数据结构。\n* 可以更改内部字段，而无需更改使用该代码的用户。\n* 它在检索或计算值时封装了内部复杂性。\n* 它提供了为 getter\
  \ 和 setter 指定不同访问修符的能力。\n* 它提供了添加调试信息的能力。\n* 它可以作为 Lambda 表达式进行传递。\n* 许多库（如 mock、序列化等）期望通过\
  \ getters/setters 来操作对象。\n\n## 问题\n* 当你可以直接暴露类字段时，为什么还需要 getters 和 setters？\n* 解释使用\
  \ getters 和 setters 的某些好处？\n\n## 变长参数 (varargs) 与 对象数组\n变长参数允许向方法传递零或多个参数；而对象数组参数不能用零个参数进行调用。\n\
  \n## 变长参数\n```java\npublic static int getCumulativeValue( int ... values){\n   \
  \ int sum = 0 ;\n    for ( int value : values){\n        sum += value ;\n    }\n\
  \    return sum ;\n}\n```\n\n## 对象数组\n```java\npublic static int getCumulativeValues(\
  \ int [] values){\n    int sum = 0 ;\n    for ( int value : values){\n        sum\
  \ += value ;\n    }\n    return sum ;\n}\n```\n\n* 变长参数只能是方法的最后一个参数；而对象数组可以定义为任何顺序。\n\
  * 变长参数和对象数组在方法内部都被视为数组处理。\n* 尽管变长参数并不流行，但在任何需要处理不确定参数的地方都可以使用。\n\n## 问题\n* 什么是变长参数？\n\
  * 变长参数和对象数组之间的区别是什么？\n* 你可以调用一个期望变长参数作为参数的零参数方法吗？\n* 你可以重载接收 int 数组的方法，使其接收 int\
  \ 变长参数吗？\n* 你可以使用变长参数的不同场景有哪些？\n\n## 默认接口方法 (Default Interface Method)\n* 默认接口方法直接添加到接口中以扩展其功能。\n\
  * 默认接口方法可以添加到甚至你无法控制的接口中。\n* 默认接口方法不会破坏其被添加的接口的现有实现。\n* 实现类可以重写接口中定义的默认方法。\n* 默认方法也被称为防御方法\
  \ (Defender) 或 虚拟扩展方法 (Virtual extension method)。\n\n在此代码示例中，默认接口方法 `getAdditonSymbol()`\
  \ 被添加到现有的接口 `Calculator` 中。\n\n```java\npublic interface Calculator {\n    public\
  \ < T > T add( T num1, T num2);\n    default public String getAdditionSymbol(){\n\
  \        return \"+\" ;\n    }\n}\n```\n\n## 默认方法的局限性\n* 如果类继承了多个具有相同签名的默认方法的接口，则该实现类必须为该默认方法提供实现。\n\
  * 如果继承层次结构中的任何类都有具有相同签名的方法，则默认方法将变得无关。\n\n## 默认方法 vs 抽象方法\n以下是几点细微区别：\n* 抽象方法允许定义构造函数。\n\
  * 抽象方法可以关联状态。\n\n## 使用默认方法 - 抽象类与 接口\n随着默认方法的引入，现在接口可以被扩展以添加功能，而不会破坏类。\n\n## 问题\n\
  * 什么是默认接口方法？\n* 默认接口方法的好处是什么？\n* 你可以在无法直接控制的接口中添加默认方法吗？\n* 当一个类继承两个接口且两者都定义了相同签名的方法时会发生什么？\n\
  \n## 静态接口方法 (Static Interface Method)\n* 静态接口方法直接添加到接口中以扩展其功能。\n* 静态接口方法通常用于实现排序等工具函数。\n\
  * 当你想在类中强制特定行为时也会使用静态方法。\n* 实现类不能重写接口中定义的静态方法。\n* 静态方法甚至可以添加到无法控制的接口中。\n* 与默认方法类似，静态方法不会破坏其被添加的任何现有实现。\n\
  \n在此代码示例中，静态接口方法 `getUtconedDateTime()` 被添加到现有的接口 `DBWrapper` 中。\n\n```java\npublic\
  \ interface DBWrapper {\n    static ZonedDateTime getUtconedDateTime( Instant date\
  \ ){\n        ZoneId zoneId = TimeZone.getTimeZone(\"UTC\").toZoneId();\n      \
  \  ZonedDateTime zonedDateTime = ZonedDateTime.ofInstant(date, zoneId);\n      \
  \  return zonedDateTime ;\n    }\n}\n```\n\n## 问题\n* 什么是静态接口方法？\n* 哪里可以使用静态接口方法？\n\
  * 你可以重写静态接口方法吗？\n* 静态方法和默认方法的区别是什么？\n* 你可以在无法直接控制的接口中添加静态接口方法吗？\n* 如果一个类继承两个接口且两者都定义了相同签名的静态接口方法会发生什么？\n\
  \n## 注解 (Annotations)\n注解将元数据关联到不同的程序元素。注解针对编译器或运行时处理。注解元数据用于文档、生成模板代码、编译验证、运行时处理等。注解对它们标记的代码片段没有直接影响。我们可以将注解应用于字段、变量、方法、参数、类、接口、枚举、包、注解本身等。\n\
  \n## 用法\n自定义注解直接放置在要注解的项之前。\n\n```java\n@Length (max= 10 , min= 5 )\npublic class\
  \ ParkingSlot {\n    // 代码位于此处\n}\n```\n\n## 内置注解\n* @Deprecated - 表示该方法已过时。\n*\
  \ @Override - 表示重写了父类方法。\n* @SupressWarnings - 用于抑制警告。\n\n## 问题\n* 什么是注解？\n* 哪里可以使用注解？\n\
  * 你可以在哪里应用注解？\n\n\n\n\n\n## Java 中的 Preferences\n\n在 Java 中，`Preferences` 类用于以层次结构的形式存储用户偏好设置。`Preferences`\
  \ 类抽象了存储过程，并以特定于操作系统的方式存储偏好：Mac 上使用偏好文件，Windows 系统上使用注册表。虽然偏好中的键（keys）是 `Strings`，但值可以是任何原始类型。应用程序使用\
  \ `Preferences` 类来存储和检索用户、系统偏好以及配置数据。\n\n## 问题\n* 什么是 `Preferences`？\n* `Preferences`\
  \ 可以存储哪些类型的信息？\n* 在使用 `Preference` 类时，你是否需要担心操作系统所使用的内部格式？\n\n## 值传递还是引用传递\n\n在\
  \ Java 中 - 方法参数（无论是原始类型还是对象引用）始终是**按值传递**的，并且仅允许通过引用访问对象。在将对象传递给方法时，传递的是引用的拷贝，而不是对象本身。对对象引用进行的任何更改都会改变对象的内容，而不是引用本身的值。\n\
  \n## 问题\n* 值传递和引用传递有什么区别？\n* 在 Java 中引用类型参数是如何传递的？按引用传递还是按值传递？\n* 如果按值传递了引用的拷贝，方法如何访问该引用所指向的对象？\n\
  * 如果按值传递了引用的拷贝，你可以更改引用的值吗？\n\n## 面向对象编程\n\n## 多态\n\n多态是类实例根据其所作用的实例采取不同形式的能力。多态主要通过子类化或实现接口来实现。派生类可以对特定功能拥有自己独特的实现，同时通过继承共享某些功能。对象的行为具体取决于它在类层次结构中的位置。\n\
  \n假设你有一个 `Furniture` 类，它包含一个 `addLegs()` 方法。`Chair` 和 `Table` 类继承自 `Furniture` 类；它们都有对\
  \ `addLegs()` 的实现。在上述情况下，运行时将根据你拥有 `Chair` 还是 `Table` 类实例，决定调用哪个 `addLegs()` 方法的实现。\n\
  \n```java\npublic abstract class Furniture {\n    public abstract void addLegs();\n\
  \    public void print(String message) {\n        System.out.println(message);\n\
  \    }\n}\n\nclass Chair extends Furniture {\n    @Override\n    public void addLegs()\
  \ {\n        print(\"Chair Legs Added\");\n    }\n}\n\nclass Table extends Furniture\
  \ {\n    @Override\n    public void addLegs() {\n        print(\"Table Legs Added\"\
  );\n    }\n}\n\nFurniture furniture = new Chair();\n// This prints \"Chair Legs\
  \ Added\"\nfurniture.addLegs();\n\nfurniture = new Table();\n// This prints \"Table\
  \ Legs Added\"\nfurniture.addLegs();\n```\n\n### 多态的优势\n当你能够针对抽象基类或接口编写代码时，就能实现多态真正的力量和优势。根据上下文文，多态允许选择最合适的类实现。这不仅在生产代码中如此，还为测试提供替代实现铺平了道路。\n\
  \n## 问题\n* 什么是多态？\n* 实现多态的不同方式有哪些？\n* 继承对实现多态有什么用？\n* 多态的优势是什么？\n* 多态概念对单元测试有什么用处？\n\
  \n### 参数多态\n在 Java 中，泛型（Generics）提供了参数多态的实现，它允许在处理不同类型的值时使用相同的代码实现，而不会削弱编译时的类型安全检查。在下面的示例中，我们为类型参数\
  \ `T` 添加了上界，使其实现一个接口，该接口保证了类型 `T` 中存在 `getWheelsCount()` 方法。\n\n```java\ninterface\
  \ Vehicle {\n    int getWheelsCount();\n}\n\nclass Car<T extends Vehicle> {\n  \
  \  private T vehicle;\n    public Car(T vehicle) {\n        this.vehicle = vehicle;\n\
  \    }\n    public int getWheelsCount() {\n        return vehicle.getWheelsCount();\n\
  \    }\n}\n```\n它可以接收类型为 `T` 的 `Vehicle` 列表，并返回 `Vehicle` 的轮数量，而无需担心 `T` 实际上是什么类型。\n\
  \n## 问题\n* 什么是参数多态？\n* 如何使用泛型实现参数多态？\n* 如何使用类型通配符（Type Wildcards）实现参数多态？\n* 不使用泛型可以实现参数多态吗？\n\
  \n### 子类型多态\n在子类型多态（也称为包含多态）中，函数的参数定义支持任何类型或其子类型的参数。如果函数的参数具有子类型，那么该函数就表现出子类型多态。下面的\
  \ Java 代码说明了这种多态的使用。\n\n```java\nabstract class Vehicle {\n    public abstract int\
  \ getWheelsCount();\n}\n\nclass Car extends Vehicle {\n    @Override\n    public\
  \ int getWheelsCount() {\n        return 4;\n    }\n}\n\nclass Bike extends Vehicle\
  \ {\n    @Override\n    public int getWheelsCount() {\n        return 2;\n    }\n\
  }\n\npublic void printWheelsCount(Vehicle vehicle) {\n    print(vehicle.getWheelsCount());\n\
  }\n\npublic void main(String[] args) {\n    printWheelsCount(new Car());\n    printWheelsCount(new\
  \ Bike());\n}\n```\n在上述代码中，`printWheelsCount()` 方法接收 `Vehicle` 作为参数并打印 `Vehicle`\
  \ 的轮数。`main` 方法展示了子类型多态调用，接收 `Car` 和 `Bike` 对象作为参数。任何期望类型参数的地方都会接受该类型的子类。\n\n##\
  \ 问题\n* 什么是子类型多态？\n* 什么是包含多态？\n* 参数多态和子类型多态有什么区别？\n* 可以使用泛型实现子类型多态吗？\n\n## 重写\n\n\
  * 方法重写（Overriding）是重新定义基类方法以具有与其基类实现不同的行为。\n* 方法重写是动态多态（运行时多态）的一种示例。\n* 在动态多态中，运行时决定调用哪个实现，因为编译器在编译时无法确定绑定。\n\
  \n### 方法重写的规则\n* 重写方法的参数及其顺序必须与原方法相同。\n* 重写方法可以具有相同的返回类型或基类方法返回类型的子类型。\n* 重写方法的访问修饰符不能比基类中的定义更严格。\n\
  * 构造函数、静态方法和 final 方法不能被重写。\n* 如果基类中的定义没有抛出检查异常，则重写方法不能抛出检查异常，但重写方法仍然可以抛出运行时异常。\n\
  \n## 问题\n* 什么是方法重写？\n* 什么是动态多态？\n* 为什么不能重写父类或接口中定义的静态方法？\n* 可以重写父类中定义的 final 方法吗？\n\
  * 可以重写父类中的 public 方法并将其标记为 protected 吗？\n* 为什么不能重写父类的构造函数？\n* 当基类方法没有抛出检查异常时，重写方法可以抛出检查异常吗？为什么？\n\
  * 方法重写的处有哪些？\n\n\n\n\n\n## @Override\n\n`@Override` 注解是一种显式声明重写基类中定义的方法实现的意图的方法。Java\
  \ 对所有此类带有注解的方法进行编译时检查。它提供了一种简单的方法，可以防止在想要重写基类方法时不小心写了错误的方法签名。\n\n如果派生类定义了一个与基类中方法签名相同的方法，则派生类中的方法将隐藏基类中的方法。通过在子类方法的头部加上\
  \ `@Override` 注解，你可以检测是否无意中尝试重载（overload）而非重写（override）方法。\n\n## 问题\n*   `@Override`\
  \ 注解的目的是什么？\n*   如果你定义了一个与父类中签名相同的方法且没有使用 `@Override` 注解，会发生什么？\n*   `@Override`\
  \ 注解的好处有哪些？\n\n## 重载 (Overloading)\n\n*   方法重载是指定义多个同名但参数不同的方法。\n*   方法重载是静态多态或编译时多态的例子。\n\
  *   在静态多态中，是在编写代码时决定调用哪个特定的实现的。\n\n### 方法重载的规则\n*   可以通过定义与现有方法同名的方法来重载方法，但该方法具有：\n\
  \    *   不同数量的参数。\n    *   不同数据类型的参数。\n    *   不同的参数顺序。\n*   重载方法的返回类型可以是不同的。\n\
  *   当仅在返回类型不同时，不能定义同名且相同参数的方法。\n*   重载方法不需要抛出与它所重载的方法相同的异常。\n\n## 运算符重载 (Operator\
  \ Overloading)\n\n运算符重载是一种增强依赖语言的运算符定义的能力。例如，你可以使用 `+` 运算符来加两个整数，也可以用于拼接两个字符串。\n\
  \n## 问题\n*   解释什么是方法重载？\n*   什么是静态多态？\n*   静态多态和动态多态之间的区别是什么？\n*   你可以重写一个方法使得所有参数都相同，仅区别于返回类型吗？\n\
  *   什么是运算符重载？\n*   方法重载的好处有哪些？\n*   重写（riding）和重载（overloading）的区别是什么？\n\n## 抽象 (Abstraction)\n\
  \n抽象有助于将关注从具体实现的内部细节转移到类型及其行为。抽象的核心在于隐藏关于数据、其内部表示及其实现的细节。另一个同样重要的面向对象概念是封装，它可以用于抽象类的复杂性和内部实现。抽象还帮助使软件具有可维护性、安全性，并提供了在不破坏任何客户端的情况下更改实现的能力。\n\
  \n## 问题\n*   什么是抽象？\n*   抽象与封装有什么区别？\n*   抽象的好处有哪些？\n*   你可以在没有封装的情况下实现抽象吗？\n\n\
  ## 继承 (Inheritance)\n\n继承是一种面向对象的设计概念，涉及重用现有的类定义（称为基类）并通过继承该类来定义更特殊的类类别（称为子类）。它侧重于在子类与其父类之间建立\
  \ \"IS-A\"（是一个）的关系。继承也被用作实现多态的技巧；当派生类型实现了在基类型中定义的方法时即可。\n\n### 继承的规则\n*   根据创建特定类别的需求，可以存在多级继承。\n\
  *   Java 只允许单类继承，因为多重继承会带来相应的复杂性；请检查菱形问题（Diamond Problem）。\n*   声明为 `final` 的类不能被扩展。\n\
  *   声明为 `final` 的类方法不能被重写。\n*   基类的构造函数和私有成员不被继承。\n*   可以使用 `super()` 调用基类的构造函数。\n\
  *   可以使用 `super` 关键字调用基类的被重写方法，否则你将递归地调用重写方法。\n\n## 问题\n*   解释什么是继承？\n*   继承的目的是什么？\n\
  *   决定两个类之间继承关系的标准是什么？\n*   继承在多态中起着什么样的重要作用？\n*   你可以继承 `final` 类吗？\n*   如果你不使用\
  \ `super` 关键字调用被重写的成员，会发生什么？\n*   为什么你不能继承父类中定义的静态成员？\n*   如果 Java 允许多重继承，人们可能会面临哪些挑战？\n\
  \n## 组合 (Composition)\n\n组合是一种与继承密切相关的面向对象的设计概念，因为它也涉及重用类；但它侧重于在类之间建立 \"HAS-A\"\
  （有一个）的关系。因此，与处理扩展类特性的继承不同，组合通过组合类来重用类。组合通过存储另一个类的引用作为成员来实现的。\n\n### 继承 vs 组合\n\n\
  继承的主要问题是它破坏了封装，因为派生类与基类的实现紧密耦合。当一个类的设计时没有考虑未来的继承范围，且你对基类没有控制权时，问题就会变得复杂。基类的变化可能会导致派生类的破坏。因此，只有在基类和派生类定义之间存在完美的\
  \ \"IS-A\" 关系时才应该使用继承；在任何疑问的情况下，优先选择组合而非继承。\n\n## 问题\n*   解释什么是组合？\n*   继承和组合有什么区别？\n\
  *   决定两个类之间组合关系的标准是什么？\n*   解释几个使用组合可以避免的继承问题？\n*   在什么时候你应该优先选择组合而不是继承，反之亦然？\n\n\
  ## 基础设计概念 (FUNDAMENTAL DESIGN CONCEPTS)\n\n### 依赖注入 (Dependency Injection) vs 反转控制\
  \ (Inversion of Control)\n依赖注入和反转控制通过松耦合依赖项来促进模块化软件开发。独立的模块对象也具有可维护性和可测试性。\n\n###\
  \ 反转控制 (Inversion of Control)\n反转控制提供了一种设计范式，依赖项不是由需要的对象显式创建，而是由外部源创建并提供的。\n\n###\
  \ 依赖注入 (Dependency Injection)\n依赖注入是 IoC 的一种形式，用于在运行时提供对象依赖；通过构造函数、setter 方法或服务定位器实现。注解和接口用于识别创建和注入依赖的源。\n\
  \n*   依赖注入的模式：\n    *   通过构造函数\n    *   通过 setter\n    *   通过方法参数\n*   注入依赖是依赖注入框架的责任。\n\
  \n![](img/Image0004.jpg) 下方的代码演示了作为构造函数参数的依赖注入。\n\n```java\npublic class Account\
  \ {\n    UserService userService;\n    AccountService accountService;\n\n    public\
  \ Account(UserService userService, AccountService accountService) {\n        this.userService\
  \ = userService;\n        this.accountService = accountService;\n    }\n}\n```\n\
  \n不仅在生产系统中，DI 和 IoC 在单元测试也提供了巨大的帮助，因为它提供了模拟（mock）依赖的能力。Spring 框架是 DI 容器的一个示例。\n\n\
  注意确保在依赖对象被请求之前已经进行了初始化是重要的。\n\n## 问题\n*   什么是反转控制？\n*   什么是依赖注入？\n\n\n\n\n\n* 控制反转（Inversion\
  \ of Control）与依赖注入（Dependency Injection）之间有什么区别？\n* 实现依赖注入的不同方式有哪些？\n* 识别依赖源的不同方法有哪些？\n\
  * 谁负责注入依赖对象？\n* 依赖注入对单元测试有什么帮助？\n* 依赖注入如何用于模块化软件开发？\n\n## 服务定位器（Service Locator）\n\
  \n服务定位器是一个封装了解析所请求服务逻辑的对象。服务定位器还提供了一个用于注册服务的接口，这允许你在不修改依赖这些服务的对象的情况下替换具体的实现类。\n\n\
  在下图所示，`Account` 类使用 `ServiceLocator` 来解析它所依赖的 `AccountService` 和 `UserService`。\n\
  \n![](img/Image00005.jpg)\n\n```java\npublic class Account {\n    UserService userService\
  \ ;\n    AccountService accountService ;\n\n    public Account() {\n        this.userService\
  \ = ServiceLocator.getService(UserService.class);\n        this.accountService =\
  \ ServiceLocator.getService(AccountService.class);\n    }\n}\n```\n\n### 服务定位器的好处\n\
  * 类不需要管理任何服务依赖及其生命周期。\n* 它有助于独立测试一个类，而无需该类所依赖的真实服务类。\n* 它允许运行时优化；因为服务可以在运行时进行注册和注销。\n\
  \n## 问题\n* 解释一下什么是服务定位器设计模式？\n* 使用服务定位器设计模式有什么好处？\n* 服务定位器和依赖注入模式之间有什么区别？\n* 在什么情况下你会更倾向于使用服务定位器而不是依赖注入，反之亦然？\n\
  * 服务定位器如何帮助测试？\n\n## 菱形问题（Diamond Problem）\n\nJava 不允许继承多个类，因为当多个父类拥有具有相同签名方法的方法时，可能会产生歧义，编译器无法决定使用哪一个父类的方法。\n\
  \n考虑下图所示的继承层次结构。如果 `Base` 类中定义的方法 `calculate()` 同时被 `DerivedLeft` 和 `DerivedRight`\
  \ 重写，那么对于 `Confused` 类继承哪一个版本的 `calculate()` 就会产生歧义。\n\n![](img/Image00006.jpg)\n\
  \n在下面的代码中，对于应该调用哪个版本的 `calculate()` 存在歧义。这在 Java 中被称为“菱形问题”。\n\n```java\npublic\
  \ static void main (String [] args){\n    Base base = new Confused ();\n    base.calculate();\n\
  }\n```\n\n### 默认接口方法导致的菱形问题\n\n引入默认接口方法后，可能会出现菱形问题。如果 `Base`、`DerivedLeft` 和 `DerivedRight`\
  \ 都是接口，并且三个接口中都存在作为默认接口方法的 `calculate()`，这将导致菱形问题。在这种情况下，`Confused` 类必须显式地重新实现 `calculate()`\
  \ 方法；否则歧义将被编译器拒绝。\n\n## 问题\n* 解释 Java 中的菱形问题？\n* 为什么 Java 不提供多重继承？\n* 使用默认接口方法，类仍然可以继承两个具有相同签名方法的接口；这难道不会导致菱形问题吗？你如何解决它？\n\
  \n## 面接口编程（Programming to interface）\n\n面向接口编程通过促进软件组件之间的解耦，为模块化软件开发奠定了基础。高水平的解耦提高了软件组件的可维护性、扩展性和可测试性。模块化软件设计有助于加快上市速度，因为它方便了多个使用同一代码库的团队之间的并行软件开发。正是面向接口编程的设计范式形成了控制反转的基础，控制反转管理着任何大型软件应用程序中的依赖关系。\n\
  \n让我们来看一个简单的例子。假设我们有一个对集合排序的方法，它接受 `Map` 接口作为参数。这意味着 `sort()` 方法没有绑定到任何特定的 `Map`\
  \ 实现类型，你可以传递任何 `Map` 接口的具体实现。\n\n```java\npublic static void main ( String [] args){\n\
  \    sort( new HashMap<>());\n    sort( new TreeMap<>());\n    sort( new ConcurrentSkipListMap<>());\n\
  \    sort( new TreeMap<>());\n}\n\npublic static void sort(Map map){\n    // 执行排序\n\
  }\n```\n\n### 面向接口编程的好处\n* 根据上下文，你可以在运行时选择最合适的行为。\n* 对于测试，你可以传递模拟对象（mock objects）或存根（stubs）实现。\n\
  * 接口/API 定义或约不会频繁更改。\n* 面向接口还方便了团队之间的并行开发，因为不同团队的开发者可以在进行最终集成之前继续针对接口编写代码。\n\n##\
  \ 问题\n* 面向接口编程的概念是什么？\n* 面向接口编程有什么好处？\n* 面向接口编程如何促进软件组件之间的解耦？\n* 依赖注入和面向接口编程之间有何关联？你可以在不支持面向接口的情况下实现依赖注入吗？\n\
  * 模块化软件有什么好处？\n* 面向接口编程如何帮助单元测试？\n\n## 抽象类 vs 接口\n\n### 抽象类\n抽象类不能被实例化，但可以被扩展。当你想要在类之间强制执行通用设计和实现，并期望派生类实现所需的特殊功能时，请扩展抽象类。\n\
  \n### 接口\n接口是一组相关方法的集合，定义了它的行为以及与外部世界的契约。当你想要在不相关的类之间定义共同行为时，使用接口。接口也可以定义为没有任何任何方法，这种接口被称为标记接口（marker\
  \ interface）；此类接口通常用于对类分类。标记接口的一个示例是 `java.io.Serializable`，它没有定义任何方法，但支持序列化的类必须实现它。\n\
  \n### 抽象类和接口的区别\n* 抽象类可以通过更新来为类添加更多功能，而接口可以通过添加来为类实现新行为。尽管引入了默认接口方法，接口也可以被扩展以具有更多功能。\n\
  * 接口可以被多重继承；而抽象类不能。\n* 接口定义行为，因此它可以应用于不相关的类；而相关类扩展抽象类。\n* 接口方法可以有任何类型的访问修饰符；而接口成员都是公共的。\n\
  * 抽象类可以关联状态，这在接口中是不可能的。\n* 抽象类可以被扩展而不会破坏扩展它的类；而接口的任何更改（非默认非静态方法除外）都会破坏现有实现。\n\n\
  ## 问题\n* 如果抽象类不能被实例化，那么为什么需要为抽象类定义构造函数呢？\n    * 构造函数可以执行执行的字段初始化，并执行类约束。\n* 定义抽象类？抽象类在类设计中起什么作用？\n\
  * 定义接口？接口在类设计中起什么作用？\n* 在什么情况下你会更倾向于使用抽象类而不是接口，反之亦然？\n* 解释抽象类和接口之间的各种区别？\n* 什么是标记接口？标记接口是如何使用的？\n\
  * 你可以在接口中声明静态方法吗？\n* 在引入默认接口方法后，抽象类与接口相比还有何不同？\n\n\n\n\n\n## 国际化与本地化\n\n## 国际化\n\
  软件国际化是确保软件不绑定到单一语言或区域的过程。其缩写为 `i18n`。\n\n## 本地化\n软件本地化是确保软件拥有所有支持特定语言或区域的资源的过程。其缩写为\
  \ `l10n`。\n\n### 注意事项\n`国际化` 有助于`本地化`。\n\n## 问题\n* 什么是国际化？\n* 什么是本地化？\n* `本地化` 和\
  \ `国际化` 之间的区别是什么？\n* 可以在不构建`国际化`支持的情况下实现`本地化`吗？\n\n## 不变对象\n当一个对象在构造后没有改变状态的可能性，则该对象被认为是不可变的。\n\
  \n### 优点\n* 设计和实现不可变对象更加简单，因为你不需要管理状态的变化。\n* 不变对象天然是线程安全的，因为它们在创建后无法被修改。因此，不需要对其访问进行同步。\n\
  * 不变对象减少了垃圾回收（Garbage Collection）的开销。\n\n### 缺点\n* 每个不同的值都需要定义一个单独的对象，因为你无法重用一个\
  \ `Immutable` 对象。\n\n### 定义不变对象的规则\n* 将类声明为 `final`。\n* 仅允许构造函数创建对象。不要提供字段的 setter（Setter）。\n\
  * 将所有字段标记为 `private`。\n\n### 不变类示例，`Employee`\n```java\nfinal public class Employee\
  \ {\n    final private int id;\n    final private String name;\n    final private\
  \ String department;\n\n    public Employee(int id, String name, String department)\
  \ {\n        this.id = id;\n        this.name = name;\n        this.department =\
  \ department;\n    }\n\n    public int getId() {\n        return id;\n    }\n\n\
  \    public String getName() {\n        return name;\n    }\n\n    public String\
  \ getDepartment() {\n        return department;\n    }\n}\n```\n\n## 问题\n* 什么是不变对象？\n\
  * 定义不变对象的规则是什么？\n* 不变对象的优点/缺点是什么？\n* 如何创建不变对象？\n* 在哪些不同情况下可以使用不变对象？\n* `final` 和不可变对象之间的区别是什么？\n\
  * 将变量声明为 `final` 有什么优化收益？\n* 能列举一些关于不可变性的问题吗？\n    * 定义带有大量参数的构造函数更加困难。\n    * 由于不可变性的实现交给了开发者，即使不小心添加了单个\
  \ setter 也会破坏它。\n\n## 克隆\n克隆是创建对象副本的过程。简单地将现有对象的引用赋值给一个对象会导致两个引用指向同一个对象。克隆有两种类型：浅拷贝和深拷贝。\n\
  \n## 浅拷贝\n浅拷贝简单地复制属性的值；对于原始类型属性成员，会创建一个精确的副本；对于引用类型成员，则复制其地址。因此，对于引用类型成员，原始对象和新创建的副本都指向堆内存中的同一个对象。\n\
  \n## 深拷贝\n深拷贝递归地将每个成员的内容复制到新对象中。深拷贝总是会创建原始对象的独立副本。要创建深拷贝，应该编写一个名为 `CopyConstructor`\
  \ 的专用方法。\n\n## 问题\n* 什么是克隆？\n* 什么是浅拷贝？\n* 解释浅拷贝的缺点？\n* 什么是深拷贝？\n* 什么是 `CopyConstructor`？\n\
  * 在什么情况下你会倾向于使用深拷贝而不是浅拷贝，反之亦然？\n\n## 数据类型\n\n## NaN\nNot a Number（非数字）也称为 `NaN`，是由于除以零、与无穷大运算等算术计算产生的未定义结果。两个\
  \ `NaN` 不相等。`NaN` 有两种类型：\n* `Quiet NaN`（静默 NaN）：当产生安静 `NaN` 时，除非检查结果，否则没有指示。\n*\
  \ `Signalling NaN`（信号 NaN）：当产生信号 `NaN` 时，它会信号无效的操作表达式。\n\n## 问题\n* 什么是 `NaN` 或 Not\
  \ a Number？\n* 什么是 Quiet NaN？\n* 什么是 Signalling NaN？\n* 两个 `NaN` 相等吗？\n\n## EnumSet\n\
  * `EnumSet` 是一种用于 `Enum` 类型的特殊集合实现。\n* `EnumSet` 在内部以位向量（bit vectors）的形式表示，非常紧凑且高效。\n\
  * `EnumSet` 提供了执行位标志操作的优化实现，应该用来代替执行 `int` 标志操作。\n\n以下代码演示了 `EnumSet` 的用法。\n```java\n\
  private enum Vehicle {\n    CAR,\n    JEEP,\n    MOTORCYCLE\n}\n\npublic static\
  \ void main(String[] args) {\n    EnumSet<Vehicle> TWOWHEELER = EnumSet.of(MOTORCYCLE);\n\
  \    if (TWOWHEELER.contains(JEEP)) {\n        //\n    }\n}\n```\n\n## 问题\n* 什么是\
  \ `EnumSet`？\n* 为什么你应该倾向于使用 `EnumSet` 来执行 `int` 标志操作？\n\n## 比较类型\n原始类型只能通过相等运算符（`==`）进行比较；而引用类型可以根据我们想要比较的内容使用相等运算符和\
  \ `equals()` 方法进行比较。\n\n### 等等运算符\n对于引用类型，相等运算符 `==` 和 `!=` 用于比较两个对象的地址，而不是它们的实际内容。\n\
  \n### equals() 方法\n当你想比较两个对象的内容时，请使用 `equals()` 方法。`Object` 类定义了 `equals()` 方法，子类必须重写该方法以方便内容比较。如果类没有重写\
  \ `equals()` 方法，则会调用相等运算符进行比较。\n\n## 问题\n* 比较类型有哪些方式？\n* 引用类型的相等运算符比较什么？\n* `equals()`\
  \ 方法比较什么？\n* 为什么你会倾向于使用 `equals` 方法而不是相等运算符？\n* 如果类没有重写 `equals` 方法会发生什么？\n\n##\
  \ 浮点比较\n两个浮点数不应使用相等运算符 `==` 进行比较；因为相同的数字（例如 0.33）在两个浮点变量中存储的可能并不是 0.33，而是 0.3300000007\
  \ 和 0.329999999767。因此，比较两个浮点值时是将两个值的绝对差与一个范围进行比较。\n```java\nif (Math.abs(floatValue1\
  \ - floatValue2) < EPSILON) {\n    //\n}\n```\n其中 `EPSILON` 是一个非常小的数字，如 `0.000001`，这取决于所需的精度。\n\
  \n## 问题\n* 为什么不应该使用相等运算符比较浮点值？\n* 比较两个浮点值的优方法是什么？\n* 决定用于比较两个浮点值的范围的标准是什么？\n\n##\
  \ 字符串比较\n`String` 类对象使用相等运算符 `==` 测试引用相等性，使用 `equals()` 方法测试内容相等性。在比较来自不同来源的两个 `String`\
  \ 变量时，始终使用 `equals()` 方法。池化字符串也可以使用相等运算符进行比较。\n\n## 问题\n* 为什么应该使用 `equals` 方法比较\
  \ `String` 对象？\n* 使用相等运算符比较两个 `String` 对象的陷阱是什么？\n* 什么是池化字符串？如何比较两个池化字符串？\n\n\n\n\
  \n\n## 枚举比较\n\n`ComparisonEnum` 既不能实例化也无法复制。因此，始终只有一个枚举的实例可用，即在枚举定义中定义的那个实例。由于只有一个枚举实例可用，你可以同时使用等价运算符（==`）和\
  \ `equals()` 方法进行比较。但建议优先使用等价运算符 `==`，因为它不会抛出 `NullPointerException`，并且还能执行编译时的兼容性检查。\n\
  \n## 问题\n* 比较两个枚举的不同方法有哪些？\n* 解释一下为什么你可以同时使用等价运算符和 `equals` 方法来比较枚举？\n* 比较两个枚举值的首选方式是哪种？\n\
  \n## 枚举与公共静态字段\n\n以下代码演示了 `enum` 和 `public static field` 的用法。以下是使用 `enum` 替代 `public\
  \ static int` 的优点。\n\n* `Enums` 是在编译时检查的，而 `int` 值不是。使用 `public static int`，你可以向\
  \ `AddVehicle()` 方法传递任何 `int` 值。\n* `int` 值需要根据预期的范围进行验证；而 `enums` 不需要。\n* 位标志标志操作已内置在\
  \ `enumSet` 中。\n\n```java\nprivate enum Vehicle {\n    CAR,\n    JEEP,\n    MOTORCYCLE,\n\
  \    SCOOTER\n};\n\npublic void AddVehicle(Vehicle vehicle){\n}\n\npublic static\
  \ field\npublic static int CAR = 0;\npublic static int JEEP = 1;\npublic static\
  \ int MOTORCYCLE = 2;\npublic static int SCOOTER = 3;\npublic void AddVehicle(int\
  \ vehicle){\n}\n```\n\n## 问题\n* 使用 `enum` 相比 `public static int` 字段的优点是什么？\n* 与\
  \ `enum` 参数相比，为什么你需要对 `int` 参数进行额外的验证？\n* 为什么你应该倾向于使用 `enum` 而不是 `public static\
  \ int`？\n\n## 包装类\n\n每个基本数据类型都有一个对应的类，将该基本数据类型封装成该类的对象。包装类提供了许多实用方法来操作基本数据值。由于包装类允许基本数据类型转换为引用类型，因此它们也可以与集合一起使用。\n\
  \n## 问题\n* 什么是包装类？\n* 使用包装类型而非基本数据类型的优点是什么？\n* 如何在集合中使用基本数据类型？\n\n## 自动装箱与自动拆箱\n\
  \n自动装箱（Auto boxing）是将基本类型转换为对象的过程，涉及动态内存分配和相应的包装类对象的初始化。自动拆箱（Auto unboxing）是将包装类转换为基本类型的过程。\n\
  \n在下面的代码中，`23.456f` 被自动装箱为对象 `Float(23.456f)`，从 `addTax()` 返回的值被自动拆箱为 `float`。\n\
  \n```java\npublic static void main(String [] args){\n    float beforeTax = 23.456f;\n\
  \    float afterTax = addTax(beforeTax);\n}\n\npublic static Float addTax(Float\
  \ amount){\n    return amount * 1.2f;\n}\n```\n\n## 问题\n* 什么是自动装箱和自动拆箱？\n* 自动装箱的优点是什么？\n\
  \n## BigInteger 和 BigDecimal\n\n`BigInteger` 和 `BigDecimal` 用于处理大于 `Long.MAX_VALUE`\
  \ 和 `Double.MAX_VALUE` 的值。这些大值作为 `String` 值传递给 `BigInteger` 和 `BigDecimal` 的构造函数。`BigDecimal`\
  \ 支持通过实用方法指定所需的舍入方式和应用的精度。\n\n```java\nBigInteger bInt = new BigInteger(\"9876543210987654321098765\"\
  );\n```\n\n`BigInteger` 和 `BigDecimal` 对象都是不可变的，因此对它们进行的任何操作都会创建一个新对象。`BigInteger`\
  \ 主要用于加密和安全应用。\n\n## 问题\n* `BigInteger` 和 `BigDecimal` 类型是什么？\n* `BigInteger` 和\
  \ `BigDecimal` 的值在内部是如何存储的？\n* `BigInteger` 的用途是什么？\n\n## 字符串 STRINGS\n\n## String\
  \ 的不可变性\n\n`String` 对象是不可变的，这意味着一旦构造完成，`String` 引用指向的对象就永远无法改变。尽管你可以将相同的引用赋予另一个\
  \ `String` 对象。考虑以下示例：\n\n```java\nString greeting = \"Happy\";\ngreeting = greeting\
  \ + \" Birthday\";\n```\n\n上述代码创建了三个不同的 `String` 对象：`\"Happy \"`、`\" Birthday \"\
  ` 和 `\" Happy Birthday \"`。\n\n* 虽然你不能改变 `String` 对象的值，但你可以更改指向该对象的引用变量。在上面的示例中，`String`\
  \ 引用 `greeting` 开始指向 `String` 对象 `\"Happy Birthday\"`。\n* 注意，在 `String` 上执行的任何操作都会导致新的\
  \ `String`。\n* `String` 类被标记为 `final`，因此无法重写 `String` 类的不可变行为。\n\n### 优点\n* 由于 `String`\
  \ 对象不需要同步，因此在线程之间共享 `String` 对象是安全的。\n* 由于 `String` 不改变，Java 环境将 `String` 字面量缓存到内存中称为“字符串池”（String\
  \ Pool）的特殊区域以进行优化。如果池中已存在 `String` 字面量，则共享同一个字符串字面量。\n* 不可变的 `String` 值可以防止执行过程中发生任何值的更改。\n\
  * 由于 `String` 对象的哈希值不会改变，可以缓存哈希值而不需要在每次需要时重新计算。\n\n### 缺点\n* `String` 类无法扩展以提供额外的功能。\n\
  * 如果由于字符串操作创建了大量的 `String` 字面量，会给垃圾收集带来压力。\n\n## 问题\n* 为什么 `String` 对象是不可变的？\n*\
  \ `String` 对象在内存中是如何创建的？\n* 不可变性的优点/缺点是什么？\n* 为什么 `String` 对象是线程安全的？\n* 将 `String`\
  \ 类声明为 `final` 有什么？\n* Java 环境对字符串进行了什么内存优化？\n* 为什么不需要反复计算 `String` 对象的哈希值？\n\n\
  ## 字符串字面量与对象\n\n### 字符串字面量\n字符串字面量是 Java 语言的一种概念，`String` 类将双引号内的字符串缓存到名为字符串池的特殊区域。\n\
  \n```java\nString cityName = \"London\";\n```\n\n### 字符串对象\n`String` 对象使用 `new()`\
