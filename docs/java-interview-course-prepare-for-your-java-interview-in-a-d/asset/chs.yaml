  * 使用什么搜索算法搜索键？\n* 洗牌算法是如何使用的？\n\n\n\n\n\n## Comparable 与 Comparator 的区别\n\n`Comparable`\
  \ 接口的实现用于按照自然顺序对集合进行进行排序，而 `Comparator` 对象则用于对集合进行自定义排序。如果一个元素实现了 `Comparable` 接口，则使用\
  \ `compareTo()` 方法进行自然顺序排序。`compareTo()` 方法将指定的对象与现有对象进行比较以确定顺序。根据现有对象是小于、等于还是大于指定的对象，它返回一个负整数、零或正整数。\n\
  \n## Comparable 接口实现\n\n`@Override`\n`public int compareTo( Employee employee)`\n\
  \n```java\n@Override\npublic int compareTo( Employee employee) {\n    //comparison\
  \ 逻辑\n}\n```\n\n## Comparator\n\n`Comparator` 对象包含了用于比较两个对象的逻辑，这些逻辑的排序方式可能与自然排序不一致。`Comparator`\
  \ 接口拥有 `compare()` 方法，它接收两个对象，并根据第一个参数是小于、等于还是大于第二个参数，返回一个负整数、零或正整数。\n\n使用 `Comparator`\
  \ 对象执行自定义排序：\n\n```java\nSortedSet <City> sortedCitiesByName =\n    new TreeSet<>(\
  \ Comparator .comparing(\n        City::getName));\n```\n\n`Comparator` 通常用于在你无法完全控制该类的情况下提供一种自定义的比较算法。\n\
