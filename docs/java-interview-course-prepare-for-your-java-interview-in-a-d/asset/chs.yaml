  \n## StringBuilder vs StringBuffer\n\n### 相同点\n\n* `StringBuilder` 和 `StringBuffer`\
  \ 对象都是可变的，因此允许字符串值发生变化。\n* 这两个类的对象都在堆内存中被创建并存储。\n* 这两个类具有相似的方法。\n\n### 不同点\n\n*\
  \ `StringBuffer` 的方法是同步的，因此它是线程安全的，而 `StringBuilder` 则。\n* `StringBuilder` 的性能显著优于\
  \ `StringBuffer`，因为 `StringBuilder` 没有同步开销。\n\n注意：如果你需要在线程之间共享字符串对象，请使用 `StringBuffer`，否则使用\
  \ `StringBuilder`。问题：\n\n* `StringBuffer` 和 `StringBuilder` 之间有什么相同点和区别？\n* 在什么情况下你会倾向于使用\
  \ `StringBuffer` 而不是 `StringBuilder`？\n* 在单线程应用中，`StringBuffer` 和 `StringBuilder`\
  \ 之间你倾向于使用哪一个？\n\n## Unicode\n\nUnicode 是一种国际标准字符编码系统，代表了世界上大多数的书写语言。在 `Unicode`\
  \ 之前，存在多种流行的编码系统：`ASCII`、`KOI8`、`ISO 8859` 等，每种编码系统都有自己的代码值和字符集，且长度各不相同。为了解决这个问题，创建了一个统一的标准，被称为\
  \ `Unicode`。Unicode 为每个字符提供了独立平台和语言的唯一数字。问题：\n\n* 什么是 Unicode 字符？\n* 使用 Unicode\
  \ 字符有什么优势？\n* 在 Unicode 之前占据主导地位的编码系统存在什么问题？\n\n### 内部类\n\n`Inner Class`（内部类）是另一个类中的类。\n\
  `Outer Class`（外部类）包含内部类的类。\n\n注意：\n\n* 编译器为每个内部类生成一个独立的类文件。\n\n### 内部类的优点\n\n* 使用内部类很容易实现回调函数。\n\
  * 内部类可以访问外部类的私有成员，而这些成员是继承类也无法访问的。\n* 内部类有助于强制闭包（closures），使得外部实例和周围的作用域可用。\n* 外部类为内部类提供了额外的命名空间。\n\
  \n问题：\n\n* 什么是内部类？\n* 什么是外部类？\n* 定义内部类的优点是什么？\n* 什么是闭包？如何使用内部类来创建闭包？\n* 什么是回调？如何使用内部类来创建回调？\n\
  * 内部类可以访问外部外部类的私有成员吗？\n* 外部类带来了什么好处？\n\n## 静态成员嵌套类\n\n* 静态嵌套类像其他其他成员一样，在类内部声明为 `static`。\n\
  * 静态嵌套类是独立的，与外部类没有关系。它通常用于与外部类组合在一起。\n* 它可以被声明为 `public`、`private`、`protected` 或包级权限。\n\
  \n静态嵌套类的声明：\n```java\n// 外部类\npublic class Building {\n    // 静态成员内部类\n    public\
  \ static class Block{\n}\n```\n创建静态嵌套类的对象：\n```java\n// 静态类实例\nBuilding.Block block\
  \ = new Building();\n```\n问题：\n\n* 什么是静态嵌套类？\n* 静态类无论是嵌套还是外部都是相同的；那么定义内部类的好处是什么？\n\
  \n### 内部类\n\n* 局部类声明在方法内部。\n* 它不能声明为 `public`、`private` 或包级权限。\n\n```java\n// 外部类\n\
  public class CityNames {\n    private List <String> cityNames = new ArrayList<>();\n\
  \    Iterator <String> nameIterator(){\n        // 局部类\n        class NameIterator\
  \ implements Iterator <String> {\n            @Override\n            public boolean\
  \ hasNext() {\n                return false;\n            }\n            @Override\n\
  \            public String next() {\n                return null;\n            }\n\
  \        }\n        // 返回局部类的实例\n        return new NameIterator();\n    }\n}\n\
  ```\n注意：\n\n* 为了在外部使用内部类，局部类必须实现一个公共接口或继承公共类并重写方法。\n\n问题：\n\n* 内部类和局部类有什么区别？\n*\
  \ 为什么局部类不能使用访问修饰符？\n* 定义局部类的规则是什么？\n* 局部类解决了什么问题？\n\n### 非静态嵌套类\n\n* 非静态嵌套类像其他成员一样在类内部声明。\n\
  * 它可以被声明为 `public`、`private`、`protected` 或包级权限。\n* 非静态嵌套类是闭包，因为它们可以访问外部实例。\n* 创建非静态内部类的对象需要一个外部类的对象。\n\
  \n非静态嵌套类的声明：\n```java\n// 外部类\npublic class Building {\n    // 非静态成员内部类\n    public\
  \ class Block{}\n}\n```\n创建非静态嵌套类的对象：\n```java\n// 外部类的实例\nBuilding building = new\
  \ Building();\n// 非静态成员内部类的实例\nBuilding.Block block = building . new Block();\n\
  ```\n问题：\n\n* 什么是非静态嵌套类？\n* 为什么非静态嵌套类可以被当作闭包？\n\n\n\n\n\n## 你可以在不定义外部类的情况下创建非静态内部类的实例吗？\n\
  \n## 匿名内部类\n\n- 匿名内部类没有名称。\n- 匿名内部类在定义的同时也创建了其对象。\n- 匿名内部类始终使用 `new` 运算符作为表达式的一部分来创建。\n\
  - 创建匿名类时，在 `new` 运算符后紧跟一个现有的接口或类名。\n- 匿名类要么实现接口，要么继承自现有的类。\n\n### 匿名内部类的创建 // 外部类\n\
  \n```java\npublic class CityNames {\n    private List<String> cityNames = new ArrayList<>();\n\
  \n    public Iterator<String> nameIterator() {\n        // 匿名内部类\n        Iterator<String>\
  \ nameIterator = new Iterator<String>() {\n            @Override\n            public\
  \ boolean hasNext() {\n                return false;\n            }\n          \
  \  @Override\n            public String next() {\n                return null;\n\
  \            }\n        };\n        // 返回一个局部内部类的实例。\n        return nameIterator();\n\
  \    }\n}\n```\n\n### 注意事项\n- 不要返回内部类，因为它持有对外部封闭类的引用，否则可能会发生内存泄漏。\n- 当你想防止任何人在其他地方使用该类时，使用匿名类。\n\
  - 必须避免匿名类和内部类的序列化，因为由于不同的 JRE 实现，在反序列化可能会可能会兼容性问题。\n\n## 问题\n- 什么是匿名内部类？\n- 匿名内部类与局部内部类有什么区别？\n\
  - 为什么你不应该从方法中返回内部类对象？\n- 如果你想防止任何人在外部使用你的类，你应该定义哪种类型的内部类？\n- 为什么应该避免对匿名类和内部类的序列化？\n\
  \n## 函数式编程\n\n## 函数式接口\n函数式接口是一个只有一个抽象方法的接口，但可以拥有任意数量的默认方法。\n\n`@FunctionalInterface`\n\
  \n```java\npublic interface Greator<T> {\n    public T greater(T arg1, T args2);\n\
  }\n```\n\n当接口不是有效的函数式接口时，注解 `@FunctionalInterface` 会产生编译器警告。\n\n```java\n@FunctionalInterface\n\
  public interface Greator<T> {\n    public T greater(T arg1, T args2);\n}\n```\n\n\
  下面定义的 `Account` 类用作函数式接口 `Greater` 的参数。\n\n```java\npublic class Account {\n   \
  \ private int balance;\n\n    public Account(int balance) {\n        this.balance\
  \ = balance;\n    }\n\n    public int getBalance() {\n        return balance;\n\
  \    }\n\n    @Override\n    public String toString() {\n        return \"Account{\"\
  \ + \"balance=\" + balance + \"}\";\n    }\n}\n```\n\n下面的代码演示了如何使用 Lambda 表达式找到余额更大的账户。同样，相同的函数式接口\
  \ `Greater` 也可以比较其他类似的业务对象。\n\n```java\npublic static void main(String[] args) {\n\
  \    Greator<Account> accountComparer = (Account acc1, Account acc2) ->\n      \
  \  acc1.getBalance() > acc2.getBalance() ? acc1 : acc2;\n\n    Account account1\
  \ = new Account(6);\n    Account account2 = new Account(4);\n    System.out.println(\"\
  Account with greater balance: \" + accountComparer.greater(account2, account1));\n\
  }\n```\n\n## 问题\n- 什么是函数式接口？\n- 使用函数式接口的好处是什么？\nJava 同时也为大多数场景提供了一组预定义的函数式接口。\n\n\
  ## Lambda 表达式\nLambda 表达式提供了一种方便的方法，可以更紧凑地创建实现函数式接口的匿名类。当你想将功能作为参数传递给另一个方法，并推迟该功能的执行直到适当的时机时，Lambda\
  \ 表达式特别有用。\n\nLambda 表达式可以仅仅是一个带有方法体和可选参数类型的语句块，没有方法名或返回类型。它可以作为方法传递并存储在变量中。\n\n\
  ```java\n// lambda 表达式\n() -> 2\n(x,y) -> x + y\n(Double x, Double y) -> x*y\n```\n\
  \n## 问题\n- 什么是 Lambda 表达式？\n- Lambda 表达式与匿名类之间有什么联系？\n- 你可以将 Lambda 表达式作为方法参数传递吗？\n\
  - 使用 Lambda 表达式延迟执行功能的含义是什么？\n- 使用 Lambda 表达式的好处是什么？\n- Lambda 表达式与函数式接口之间有什么关系？\n\
  \n## 纯函数\n纯函数是指结果仅取决于传递给它的参数的函数，不受应用程序中任何状态更改的影响，也不会改变应用程序的状态。纯函数对于相同的参数返回相同的的结果。\n\
  \n```java\npublic int increaseByFive(int original) {\n    int toAdd = 5;\n    return\
  \ original + toAdd;\n}\n```\n\n## 问题\n- 什么是纯函数？\n- 纯函数在函数式编程中的作用是什么？\n- 如何保证纯函数对相同的参数总是返回相同的结果？\n\
  \n## 流式接口\n流式接口用于将命令传递给后续调用，而无需创建中间对象，并通过方法链式调用实现。流式接口链在链式方法返回 `void` 时结束。流式接口通过减少不必要的对象提高了可读性。\n\
  \n在下面的代码中，流式接口被用于添加一个新的 `Employee`。\n\n```java\nemployee.create()\n    .atSite(\"\
  London\")\n    .inDepartment(\"IT\")\n    .atPosition(\"Engineer\");\n```\n\n流式接口主要用于构建查询、创建一系列对象或按层次顺序构建节点的场景。\n\
  \n## 问题\n- 什么是流式接口？\n- 定义和使用流式接口有什么好处？\n- 描述一下流式接口的使用？\n\n## 泛型\n\n## 泛型\n泛型是一种允许代码在类型、类或接口或方法上处理不同类型对象的机制；同时提供编译时的保护。泛型的引入是为了类型安全，特别是对于集合类。\n\
  \n- 一旦在泛型中定义了参数类型，对象将仅与定义的类型工作。\n- 在泛型中，形式类型参数（例如 `E`）在类型（类或接口）处指定。\n\n```java\n\
  // 泛型 List\n// E 是类型参数\npublic interface List<E> {\n    void add(E x);\n    Iterator<E>\
  \ iterator();\n}\n```\n\n- 在泛型中，参数化类型（例如 `Integer`）在声明类型变量或创建类型对象时指定。\n\n```java\n\
  // 声明 List 类型\n// 使用 Integer 参数\nList<Integer> integerList = new ArrayList<Integer>();\n\
  ```\n\n### 注意事项\n- 泛型命名常用约定：`E` 代表元素，`T` 代表类型，`K` 代表键，`V` 代表值。\n- 泛型是编译支持；所有的类型参数在编译期间都会被移除，这个过程称为擦除（erasure）。\n\
  - 由于强类型检查，泛型有助于避免许多 `ClassCastException` 实例。\n\n### 泛型类示例\n- 下面的 `NodeId` 泛型类定义可以与任何类型的对象工作。\n\
  \n```java\n// 带有类型参数的泛型 NodeId 类\npublic class NodeId<T> {\n    private final T\
  \ Id;\n\n    public NodeId(T id) {\n        this.Id = id;\n    }\n\n    public T\
  \ getId() {\n        return Id;\n    }\n}\n```\n\n\n\n\n\n* 通常的子类（SuperType –SubType）规则不适用于泛型。在这个示例中，尽管\
  \ `Integer` 派自 `Object`，但类型参数为 `Integer` 的 `NodeId` 仍然无法赋值类型参数为 `Object` 的 `NodeId`。\n\
  \n```java\n// Parameter Type - Object\nNodeId<Object> objectNodeId = new NodeId<>(\
  \ new Object());\n\n// Parameter Type - Integer\nNodeId<Integer> integerNodeId =\
  \ new NodeId<>( 1 );\n\n// 这会导致错误\nobjectNodeId = integerNodeId; ( error )\n```\n\
  \n## 类型通配符\n\n* 泛型中的通配符以 `?` 的形式表示。例如，接受 `List<?>` 作为参数的方法将接受任何类型的 `List` 作为参数。\n\
  \n```java\npublic void addVehicles( List <?> vehicles) {\n    //...\n}\n```\n\n\
  * 设置可选的上界和下界以实施限制，因为通过通配符定义的参数确切形式是未。\n\n```java\n// 只能添加类型为 Truck 的车辆\npublic void\
  \ addVehicles( List <? extends Truck> vehicles) {\n    //...\n}\n```\n\n### Notes\n\
  * 不要在一个返回类型中返回通配符，因为知道方法返回了什么总是更安全的。\n\n## 上界 (Upper Bound)\n\n* 为了实施限制，可以在类型参数上设置上界。上界限制方法仅接受仅派自指定数据类型的未知类型参数，例如在下面示例中的\
  \ `Number`。\n\n```java\n// 类型通配符的上界\npublic void addIds( List <? extends Number>\
  \ T)\n```\n\n## 下界 (Lower Bound)\n\n* 为了实施限制，可以在类型参数上设置下界。下界限制方法仅接受是指定数据类型的父类的未知类型参数，例如下面示例中的\
  \ `Float`。\n\n```java\n// 类型通配符的下界\npublic void addIds( List <? super Float> T)\n\
  ```\n\n## 类型推断 (Type Inference)\n\n* 类型推断是编译器查看方法调用和声明以推断类型参数的能力。\n* 在泛型（`Generics`）中，菱操作符\
  \ `<>` 的操作符方便了类型推断。\n\n```java\n// 使用菱操作符进行类型推断\nList <Integer> integerList = new\
  \ ArrayList<>();\n```\n\n## Questions\n* 泛型中的类型通配符是什么？\n* 解释上界类型通配符？\n* 解释下界类型通配符？\n\
  * 泛型中不同类型的通配符是如何使用的？\n* 泛型的自动类型推断是什么？泛型中的菱操作符是什么？\n\n## 泛型方法 (Generic Method)\n\n\
  * 泛型方法定义了自己的类型参数。\n\n```java\n// generic method\npublic < T > void addId ( T id){\n\
  ```\n\n* 如果我们从上面的方法删除 `<T>`，我们将得到编译错误，因为它代表了泛型方法中类型参数的声明。\n* 泛型方法的类（`class`）或接口（`interface`）不需要是泛型的。\n\
  * 在调用泛型方法时，我们不需要显式地指定类型参数。\n\n### Notes\n* 优先使用泛型和参数化类/方法来强制编译时类型安全。\n* 使用边界类型参数来增加方法参数的灵活性，同时它也有助于限制可以使用的类型。\n\
  \n## Questions\n* 解释泛型方法？\n* 你可以在非泛型类型上添加泛型方法吗？\n* 将边界类型定义为方法参数的用处是什么？\n* 泛型是如何强制执行编译类型安全的？\n\
  \n## Java 泛型 vs Java 数组 (Array)\n\n### Java 泛型\n考虑以下层级结构，![](img/Image00010.jpg)\n\
  由于 `Car` 和 `Bike` 均派自 `Vehicle`，是否可以将 `List<Car>` 或 `List<Bike>` 赋值给 `List<Vehicle>`\
  \ 变量？\n\n不，`List<Car>` 或 `List<Bike>` 不能被 `List<Vehicle>` 替换，因为你不能在有 `cars` 的同一个列表中放入\
  \ `Bike`。所以尽管 `Bike` 是一个 `Vehicle`，但它不是一个 `Car`。\n\n```java\nList< Bike > bikes\
  \ = new ArrayList< Bike >();//假设这是允许的\nList< Vehicle > vehicles = bikes ;\nvehicles\
  \ .add( new Car ());// Error - Bike 和 Vehicle 被视为不兼容类型。\nBike bike = vehicles .get(\
  \ 0 );\n```\n\nJava 编译器在编译时对不兼容类型进行此类检查。更多信息请参阅 类型擦除。\n\n### Java 数组\n然而，与泛型不同，`Car`\
  \ 数组可以赋值给 `Vehicle` 数组：\n\n```java\nCar [] cars = new Car [ 3 ];\nVehicle [] vehicles\
  \ = cars ;\n```\n\n对于数组，尽管编译器允许上述代码编译，但当你运行这段代码时，你将得到 `ArrayStoreException`。\n\n\
  ```java\n//这将导致 ArrayStoreException\nvehicles [ 0 ] = new Bike ();\n```\n\n所以尽管编译器没有捕获此问题，运行时类型系统捕获了。数组是可具体化的类型（reifable\
  \ types），这意味着运行时感知到其类型。\n\n## Questions\n* 什么是可具体化的类型（reifable types）？\n* 为什么不能将子类的泛型集合对象赋值给父类的泛型集合对象？\n\
  * 为什么允许将子类的数组对象赋值给父类的数组对象？Java 数组更具多态吗？\n\n## 类型擦除 (Type Erasure)\n对于 Java 泛型类型，由于名为类型擦除的过程，Java\
  \ 编译器会丢弃类型信息，并且它在运行时是不可用的。\n\n## Questions\n* 什么是可具体化的类型（reifable types）？\n* 什么是类型擦除？\n\
  * 如果没有类型擦除会发生什么？\n\n## 协变 (Co-variance)\n协变是一种允许从带有上界通配符的泛型中读取项，但不能向其写入的概念。\n\n\
  考虑以下带有上界通配符的声明：\n\n```java\nList<? extends Vehicle > vehicles = new ArrayList<Bike\
  \ >();\n```\n\n从 `vehicles` 读取，因为列表中的任何内容都是 `Vehicle` 的子类并可以向上转型。\n\n```java\nVehicle\
  \ vehicle = vehicles .get(0 );\n```\n\n然而不允许向协变结构放入任何内容。\n\n```java\n// 编译错误\nvehicles\
  \ .add(new Bike ());\n```\n\n这是不允许的，因为 Java 无法保证泛型结构中的实际类型。它可以是任何扩展 `Vehicle` 的类型，但编译器无法确定。所以可以读写。\n\
  \n## Questions\n* 解释协变？\n* 为什么不能向带有上界通配符的泛型添加子类元素？\n\n## 逆变 (Contra-variance)\n\
  逆变是一种允许向带有下界通配符的泛型写入项，但不能从中读取任何内容的概念。\n\n考虑以下带有下界通配符的声明：\n\n```java\nList<? super\
  \ Car > cars = new ArrayList<Vehicle >();\n```\n\n在这种情况下，尽管 `ArrayList` 的类型是 `Vehicle`，你也可以通过逆变向其添加\
  \ `Car`；因为 `Car` 派自 `Vehicle`。\n\n```java\ncars .add(new Car ());\n```\n\n然而，你不能假设你会从这个逆变结构中获得\
  \ `Car` 对象。\n\n```java\n// 编译错误\nCar vehicle = cars .get( 0 );\n```\n\n* 解释逆变？\n\
  * 为什么不能从带有下界通配符的泛型读取元素？\n\n## 协变 vs 逆变\n* 当你只想从集合中读取泛型值时，使用协变。\n* 当你只想向集合中添加泛型值时，使用逆变。\n\
  * 当你打算同时对集合进行读取和写入操作时，使用特定的泛型类型。\n\n## Questions\n* 什么时候应该使用协变？\n* 什么时候应该使用逆变？\n\
  \n\n\n\n\n## 集合 (COLLECTIONS)\n\n`Collections` 是构建任何生产级 Java 应用程序的基础构建模块。面试官希望了解与集合正确用法相关的不同设计方面。每个集合实现都是针对特定类型的需求而编写和优化的，面试题旨在衡量面试者对这些方面的理解。提问通常是为了为了检查候选人是否理解集合类的正确用法，以及是否了解可用的替代方案。以下是关于集合提问的几个方面：\n\
  \n- Java 中的集合类型。\n- 不同集合类型的独特特征。\n- 同步集合。\n- 并发集合。\n- 集合中元素的顺序。\n- 从集合中读取的速度。\n\
  - 向集合写入的速度。\n- 集合中元素的唯一性。\n- 集合间操作的易用性。\n- 只读集合。\n- 集合导航。\n\n## 集合基础\n\n集合是一个组合多个元素的容器。以下是集合的简单示例：\n\
  \n```java\n// 创建一个城市列表容器\nList<String> cities = new ArrayList<>();\n\n// 添加城市名称\n\
  cities.add(\"London\");\ncities.add(\"Edinburgh\");\ncities.add(\"Manchester\");\n\
  ```\n\n### 注意事项\n\n- 集合与引用类型一起。\n- 所有集合接口实现都是泛型的（`Generic`）。\n- 与数组不同，所有集合类型的大小都可以增长或收缩。\n\
  - Java 提供了许多方法根据其用途来操作集合，因此在实现新方法之前，始终要测试现有方法。\n\n## 集合框架\n\n集合框架由以下组件定义：\n\n- **接口\
  \ (Interfaces)** - 是为每种特定用途类型和集合类型定义的抽象类型。\n- **实现 (Implementation)** - 是具体的实现类，用于创建表示不同类型集合的对象。\n\
  - **算法 (Algorithms)** - 应用于集合以执行各种计算并操作集合中的元素。\n\n集合框架通过提供操作这些数据的数据结构和算法，帮助你减少编程工作量。\n\
  \n## 问题\n\n- 解释什么是集合？\n- 集合与 `Generics`（泛型）之间有什么关系？\n- 你可以使用基本数据类型使用集合吗？\n- 如何对基本数据类型使用集合？\n\
  - 解释集合和数组之间的区别？\n- 集合框架的处是什么？\n- 集合框架有哪些不同的组件？\n\n## 集合接口\n\n接口以方法签名的形式定义其行为。使用集合时，你应该始终针对集合接口编写代码，而不是类实现类，这样代码就不会与特定的实现绑定。这可以防止底层实现类可能发生更改的影响。\n\
  \n以下是定义集合及其行为最重要的接口。下面的每个子节点都继承自其父节点：\n\n- `Collection`\n- `Queue`\n- `BlockingQueue`\n\
  - `TransferQueue`\n- `BlockingDeque`\n- `Deque`\n- `List`\n- `Set`\n- `SortedSet`\n\
  - `NavigableSet`\n- `Map`\n- `SortedMap`\n\n## 问题\n\n- 为什么你应该针对集合接口编写代码而不是具体的实现类？\n\
  \n## 集合类型\n\n- **Set**: `Set` 包含唯一元素。\n- **List**: `List` 是有序集合。\n- **Queue**: `Queue`\
  \ 以 `FIFO`（先进先出）方式在处理前持有元素。\n- **Deque**: `Deque` 以 以 `FIFO` 和 `LIFO`（后进先出）方式在处理前均持有元素。\n\
  - **Map**: `map` 包含键到对应值的映射。\n\n## 问题\n\n- 有哪些不同的集合类型？\n- 定义 `Set` 集合类型？\n- 定义 `List`\
  \ 集合类型？\n- 定义 `Queue` 集合类型？\n- 定义 `Deque` 集合类型？\n- 定义 `Map` 集合类型？\n- `Queue` 和 `Deque`\
  \ 之间有什么区别？\n\n### Set\n\n### 基础 Set\n```java\n// 创建一个 set\nSet<String> set = new\
  \ HashSet<>();\n```\n\n- `Set` 是一个包含唯一元素的集合。\n- `Set` 中的元素是无序存储的。\n- `Set` 中只能添加一个\
  \ `null` 元素。\n- 重复元素会被忽略。\n- 当不需要排序时，`Set`是最快的，且内存占用较小。\n\n### LinkedHashSet\n```java\n\
  // 创建一个 linkedHashSet\nSet<String> linkedHashSet = new LinkedHashSet<>();\n```\n\
  \n- `LinkedHashSet` 保持 `Set` 元素与其插入时的相同顺序。\n- 如果 `LinkedHashSet` 中重新插入元素，插入顺序不会受到影响。\n\
  - `LinkedHashSet` 中的 `Iterator` 返回元素的顺序与这些元素添加到集合的顺序相同。\n\n### 排序集合 (Sorted Set)\n\
  \n- `SortedSet` 强制执行元素的排序，要么通过实现 `Comparable` 接口按自然顺序排序，要么使用 `Comparator` 对象进行自定义排序。\n\
  - `TreeSet` 是 `SortedSet` 接口的一个实现类。\n\n```java\n// 创建一个按城市名称排序的集合\nSortedSet<String>\
  \ cityNames = new TreeSet<>();\n```\n\n- 使用 `Comparator` 对象执行自定义排序。\n```java\nSortedSet<City>\
  \ sortedCitiesByName = new TreeSet<>(Comparator.comparing(City::getName));\n```\n\
  \n- 如果元素实现了 `Comparable` 接口，则使用 `compareTo()` 方法按自然顺序进行排序。\n\n### 可导航的集合 (Navigable\
  \ Set)\n\n- `NavigableSet` 继承自 `SortedSet` 并定义了额外的方法。\n- `NavigableSet` 可以按升序和降序进行遍历。\n\
  - `TreeSet` 是 `NavigableSet` 接口的实现类之一。\n\n## 问题\n\n- 你可以在 `Set` 中添加重复元素吗？\n- 当不需要顺序要求时，你应该使用哪种集合类型？为什么？\n\
  - 你可以在 `Set` 中添加 `null` 元素吗？\n- 你应该使用哪个 `Set` 类来维护插入顺序？\n- 如果在 `Set` 中再次插入相同的元素，会发生什么？它会保持原始位置还是插入到末尾？\n\
  - 你应该使用哪个 `Set` 类来确保元素的顺序？\n- 当你需要双向方向遍历时，你应该使用哪个 `Set` 类？\n\n## List\n\n- `list`\
  \ 是对象的有序集合。\n- `list` 可以有重复元素。\n- `list` 可以有多个 `null` 元素。\n- 在 `List` 中，可以在任何位置添加元素。\n\
  - 使用 `ListIterator`，列表可以沿正向和反向两个方向进行迭代。\n\n```java\n// 创建一个城市列表\nList<String> cities\
  \ = new ArrayList<>();\n```\n\n### ArrayList\n\n- `ArrayList` 基于数组。\n- 如果频繁访问元素，它的性能更好。\n\
  - `ArrayList` 中的添加和删除操作较慢。如果在任何地方添加元素但在末尾则需要移动元素。如果添加的元素超过其容量，则会将数组复制到新分配的地方。\n\n\
  ### LinkedList\n\n- `LinkedList` 基于链表。\n- `LinkedList` 访问元素较慢，且仅允许顺序访问。\n- 在 `LinkedList`\
  \ 中添加和删除元素更快。\n- `LinkedList` 比 `ArrayList` 消耗更多内存，因为它保留了指向相邻元素的指针。\n\n### 列表迭代器\
  \ (List Iterator)\n\n- `ListIterator` 在两个方向遍历列表\n\n```java\n// 完整的列表迭代器\nListIterator<String>\
  \ fullIterator = cities.listIterator();\n\n// 从索引 3 开始的部分列表迭代器\nListIterator<String>\
  \ partialIterator = cities.listIterator(3);\n```\n\n### 注意事项\n\n- `ArrayList` 的随机访问更好，因为它为元素维护了基于索引系统，而\
  \ `LinkedList` 的开销更大，因为它需要遍历所有元素。\n\n## 问题\n\n- 你可以在 `List` 中添加重复元素吗？\n- 你可以向列表添加\
  \ `null` 吗？\n- 在什么种场景下你会使用 `ArrayList`：频繁添加/更新还是频繁读取？\n- 在什么种场景下你会使用 `LinkedList`：频繁添加/更新还是频繁读取？\n\
  \n\n\n\n\n* `ArrayList` 和 `LinkedList` 哪一个占内存内存？为什么？\n* 在 `ArrayList` 和 `LinkedList`\
  \ 之间，如果你需要随机访问，你会选择哪一个？为什么？\n\n## 队列 (Queue)\n\n* `queue` 是一种用于在处理之前存储元素的集合。\n*\
  \ `queue` 有两个端：尾部（tail）和头部（head）。\n* `queue` 按照 `FIFO`（先进先出）的方式工作。\n\n## 队列类型\n\n\
  * `Queue` - 简单队列，允许在尾部插入和从头部移除，以 `LIFO` 方式（注：此处原文 LIFO 可能为笔误，通常队列为 FIFO）操作。\n* `Deque`\
  \ - 允许从头部和尾部插入及移除元素。\n* `Blocking Queue` - 当队列满时会阻塞添加元素的线程，当为空时也会阻塞移除元素的线程。\n* `Transfer\
  \ Queue` - 一种特殊的阻塞队列，在两个线程之间进行数据传输。\n* `Blocking Deque` - `Deque` 和阻塞队列的结合。\n* `Priority\
  \ queue` - 优先级最高的元素最先被移除。\n* `Delay queue` - 只有在元素相关的延迟过期后才允许移除该元素。\n\n### 基础队列\
  \ (Basic Queue)\n\n* `queue` 有一个入口点（尾部）和一个出口点（头部）。\n* 如果入口点和出口点是同一个，它就是一个 `LIFO`（后进先出）队列。\n\
  \n```java\n// simple queue\nQueue<String> queue = new LinkedList<>();\n```\n\n##\
  \ 优先级队列 (Priority Queue)\n\n* 在 `PriorityQueue` 中，优先级与队列中的元素相关。\n* 优先级最高的元素下一个被移除。\n\
  * `PriorityQueue` 不允许 `null` 元素。\n* 队列元素要么实现 `Comparable` 接口，要么使用 `Comparator` 对象来计算优先级。\n\
  \n```java\n// City class implements Comparable interface\nQueue<City> pq = new PriorityQueue<>();\n\
  ```\n\n## 双端队列 (Deque)\n\n* `Deque` 允许从两端插入和移除。\n* `Deque` 不为元素提供索引的访问。\n* `Deque`\
  \ 扩展了 `Queue` 接口。\n\n```java\n// Create a Deque\nDeque<String> deque = new LinkedList<>();\n\
  ```\n\n## 阻塞队列 (Blocking Queue)\n\n* `BlockingQueue` 接口继承自 `Queue`。\n* `BlockingQueue`\
  \ 被设计为线程安全的。\n* `BlockingQueue` 设计用于作为生产者-消费者队列。\n\n## 传输队列 (Transfer Queue)\n\n\
  * `TransferQueue` 扩展了 `BlockingQueue`。\n* 它可能是容量限制的，生产者可能会等待空间可用，和/或消费者可能会等待项目可用。\n\
  \n```java\n// Transfer Queue\nTransferQueue<String> ltq = new LinkedTransferQueue<String>();\n\
  ```\n\n## 问题\n\n* `Queue` 的目的是什么？\n* `Deque` 和 `Queue` 有什么区别？\n* 什么是优先级队列？\n* 应该用什么标准从优先级队列中删除项？\n\
  * 什么是 `Delay Queue`？\n* 什么是 `Blocking Queue`？\n* 哪一个 `Queue` 是线程安全的队列？\n* 哪个 `Queue`\
  \ 实现了生产者-消费者模式？\n* 解释 `Blocking Queue` 和 `Transfer Queue` 之间的区别？\n* 哪个 `Queue` 是容量限制的，允许\
