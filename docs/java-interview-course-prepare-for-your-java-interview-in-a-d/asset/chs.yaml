  \ 成为数据交换的首选格式？\n* 解释 JSON 对象和 JSON 数组之间的区别？\n\n## 内存管理\n#### 栈（Stack）与 堆（Heap）\n\
  * 栈是每个系统线程在创建时与之关联的内存；而堆是应用程序中所有线程共享的内存。\n* 对于线程访问的每个函数，都会在栈顶分配一块内存，用于局部变量和簿记数据，这些内会在函数返回时按后进先出（LIFO）顺序被释放。相比之下，堆中的内存分配是相对随机的，没有强制的模式，且堆上的变量需要手动销。\n\
  * 当线程退出时，与线程关联的栈会被回收。当应用程序进程退出时，堆内存会被回收。\n* 分配和释放栈内存更简单快速，因为它就像调整指针一样简单。堆中的内存分配和释放相对复杂，因为没有固定的内存分配模式。\n\
  * 栈内存仅对所有线程可见，因此内存访问是直接的；而堆内存跨应用程序中的多个线程共享，因此与其他线程同步会影响性能。\n* 当栈内存耗尽时，JVM 抛出 `StackOverFlowError`；当堆空间耗尽时，JVM\
  \ 抛出 `OutOfMemoryError`。\n\n#### 栈和堆中的内存分配\n此示例描述了在调用方法时栈和堆内存的分配。\n* `num1` 和 `num2`\
  \ 变量存储在栈中。\n* 引用点变量存储在栈中。\n* `Point` 类的对象存储在堆中。\n![](img/Image00016.jpg)\n\n## 问题\n\
