  ```\n\n## 问题\n* 什么是字符串字面量？\n* 字符串字面量和字符串对象有什么区别？\n* 字符串字面量是如何存储的？\n\n## 字符串池化（String\
  \ Interning）\n\n* 字符串池化是一种存储每个唯一不可变字符串副本的概念。\n* 当你定义任何新的 `String` 字面量时，它会被池化。池中相同的字符串常量会被任何字符串字面量引用。\n\
  * 字符串池字面量不仅在编译时定义，在运行时也定义。你可以显式地调用 `String` 对象的 `intern()` 方法将其添加到池中（如果不存在）。\n*\
  \ 在内存池中放置大量的文本会导致内存泄漏或性能问题。\n\n注意：与其使用字符串对象，不如使用字符串字面量，以便编译器进行优化。\n\n## 问题\n* 什么是字符串池化？\n\
