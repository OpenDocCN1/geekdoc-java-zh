  * 如何设计你的类以为类中使用的集合提供数据无关访问？\n\n## 快速失败 (Fail Fast)\n`Iterator` 方法被认为是快速失败的，因为 `Iterator`\
  \ 防止了对集合进行的任何结构性修改。这确保了任何失败都能快速报告，而不是让应用程序稍后进入损坏状态。在这种情况下，会抛出 `ConcurrentModificationException`。来自\
  \ `java.util` 的 `Iterators` 是快速失败的。\n\n## 问题\n* 集合迭代中“快速失败”术语的含义是什么\n* 快速失败迭代器的好处是什么？\n\
  * 什么是安全（fail-safe）迭代器？\n* 安全迭代器在集合被修改时不会抛出任何异常，因为安全迭代器运行在原始集合的副本上工作。来自 `java.util.concurrent`\
  \ 包的迭代器是安全的。\n\n## 错误与异常处理\n### 异常\nJava 中的异常类层次结构：\n\n* 异常是中断程序执行流的异常情况。\n* 所有异常都继承自\
  \ `Throwable`。\n* 如果你想创建一个受检异常（checked exception），请继承 `Exception` 类；如果你想创建一个未受检异常（unchecked\
  \ exception），请继承 `RuntimeException`。\n* 虽然你可以通过继承 `Throwable` 来创建受检异常，但不建议这样做做，因为\
  \ `Throwable` 是所有异常和错误的根类。\n\n## 问题\n* 什么是异常（Exception）？\n* Java 中的根级异常有哪些？\n* 创建受检异常应该继承哪个父类？\n\
  * 创建未受检异常应该继承哪个父类？\n\n### 受检异常 vs 未受检异常\n* 受检异常在编译编译进行进行检查。\n* 除了 `RuntimeException`\
  \ 和 `Error` 之外，受检异常都扩展自 `Throwable`。\n* 受检异常在程序上是可以恢复的。\n* 你可以通过使用 `try/catch` 或在方法声明中使用\
  \ `throws` 子句来处理受检异常。\n* 静态初始化器不能抛出受检异常。\n\n```java\npublic static void main(String\
  \ args[]) {\n    FileInputStream fis = null;\n    try {\n        fis = new FileInputStream(\"\
  details.txt\");\n    } catch (FileNotFoundException fnfe) {\n        System.out.println(\"\
  Missing File :\" + fnfe);\n    }\n}\n```\n\n### 未受检异常\n* 未受检异常在运行时检查。\n* 未受检异常扩展自\
  \ `RuntimeException`。\n* 你无法期望从这些异常中恢复。\n* 可以使用良好的编程技术避免未受检异常。\n* 抛出未受检异常有助于揭示缺陷。\n\
  \n```java\npublic int getAccountBalance(String customerName) {\n    int balance\
  \ = 0;\n    if (customerName == null) {\n        throw new IllegalArgumentException(\"\
  Null argument\");\n    }\n    // 返回余额的逻辑\n    return balance;\n}\n```\n\n### 错误\
  \ (Error)\n* 错误类用于定义不可恢复的致命异常，应用程序不应该捕获这些异常。\n* 通常情况下，程序员无法从这些异常中恢复做任何操作。\n* 即使你捕获了\
  \ `OutOfMemoryError`，你仍可能再次遇到它，因为垃圾回收器可能无法释放内存。\n\n仅在预期失败且有合理恢复方法的情况下使用受检异常；任何其他情况请使用未受检异常。\n\
  \n## 问题\n* 什么是受检异常？\n* 什么是未受检异常？\n* Java 中的 `Error` 类定义了哪些类型的异常？\n* 如何处理受检异常？\n\
  * 如果异常未被处理会发生什么？\n* 处理受检异常的不同方法有哪些？\n* 在 catch 块中你应该使用哪些异常类来处理受检和未受检异常？\n* 你如何在受检异常和未受检异常之间选择？\n\
  * 可以在静态初始化块中抛出受检异常吗？为什么？\n    * 不能抛出，因为没有特定的地方可以捕获它，而且只执行一次。你必须使用 `try/catch` 来处理受检异常。\n\
  * 处理错误（Error）你应该怎么做？\n\n\n\n\n\n## 异常处理最佳实践\n\n尽管异常处理主要由上下文驱动，但在异常处理策略上必须保持一致性。以下是异常处理的一些最佳实践：\n\
  \n1. 永远不要抑制异常 - 因为这可能导致程序处于不安全且不稳定的状态。\n2. 不要进行过度的异常处理 - 特别当你不知道如何完全从异常中恢复时。\n3.\
  \ 永远不要吞掉（swallow）异常 - 因为这可能导致应用程序处于不一致的状态，最糟糕的是还没有记录发生的原因。\n4. 不要捕获异常并继续程序执行 - 带有某些默认行为执行。今天定义的默认行为在未来可能不再有效。\n\
  5. 不要向用户显示通用的错误信息 - 相反，请清理异常处理代码以报告用户友好的消息，并对下一步操作提供建议。\n6. 不要在一个单个 `try-catch`\
  \ 中放置多个一个异常场景 - 因为这将导致无法确定异常的原因。\n7. 不要在一个单个 `catch` 块中捕获多个受检异常 - 因为这将无法确定异常的原因。\n\
  8. 不要不必要的包装异常 - 这可能会掩盖真实的源头。\n9. 不要泄露敏感信息 - 相反，对于专门从可能泄露敏感信息的源生成的异常进行清洗。\n10. 始终记录异常\
  \ - 除非有充分的理由不这样做。\n11. 不要捕获 `Throwable` - 因为这将无法确定异常的原因。\n12. 不要使用异常来控制执行流 - 相反，在可能的情况下使用布尔值来验证条件。\n\
  13. 程序化处理不同的场景 - 不要将所有代码逻辑都放在 `try` 块中。\n14. 显式命名线程 - 在多线程应用程序中，这极大简化了调试。\n15. 永远不要抛出通用异常\
  \ - 因为这将无法确定异常的原因。\n\n## 问题\n\n* 描述一些异常处理的最佳实践？\n* 抑制异常的陷阱是什么？\n* 显示通用错误信息有什么问题？\n\
  * 异常被吞掉的缺点是什么？\n* 在单个 catch 块中处理多个异常的陷阱是什么？\n* 如果异常从包含敏感信息的源抛出，你会怎么做？在这种情况下你会记录什么？向用户显示什么消息？\n\
  * 将所有异常都包装进一个通用异常类的陷阱是什么？\n* 为什么你不应该使用异常来控制程序的执行流？\n* 你应该记录所有异常吗？为什么？\n* 为什么你不应该使用\
  \ `Throwable` 或其他根类来捕获异常？\n* 应该使用什么标准来判断哪些代码块应该包含在 `try` 块中？\n* 如果进行了多个方法的嵌套调用，你会为每个方法使用\
  \ `try-catch` 吗？为什么？\n\n`try-with-resources` 是 Java 语言的一种构造，它使得自动关闭 `try` 语句包含的资源更容易。\n\
  \n```java\ntry (FileInputStream fis = new FileInputStream(\"details.txt\")) {\n\
  \    // 读取数据的代码\n}\n```\n\n* 使用 `try-with-resources` 的资源必须继承 `AutoCloseable` 接口。\n\
  * 你可以在 `try` 块中指定多个资源。\n\n## 问题\n\n* 你可以使用哪种 Java 构造来自动关闭系统资源？\n* 在 `try-with-resource`\
  \ 构造中使用类对象时，资源必须继承哪个接口？\n\n## 多线程\n\n## 线程术语\n\n* 线程是进程中可执行代码的最小单元。\n* 程序是一组有序的操作。\n\
  * 进程是程序的实例。\n* `Context Switch`（上下文切换）是存储和恢复线程状态的昂贵过程。\n* 并行处理是在多个核心上同时执行相同的任务。\n\
  * 多线程是 CPU 并发执行多个进程或线程的能力。\n* 当两个线程互相等待对方释放锁时，就会发生死锁。\n\n## 基本概念\n\n* 所有的 Java 程序都从用户线程上的\
  \ `main()` 方法开始。\n* 当没有剩余的用户线程可以执行时，程序终止。\n* `Thread` 维护一个私有栈和系列待执行的指令。\n* `Thread`\
  \ 拥有一个名为 `thread-local storage`（线程本地存储）的私有内存，在多线程环境中可用于存储线程当前操作相关的数据。\n* JVM 允许进程拥有多个线程。\n\
  * 每个线程都有优先级。\n\n## 问题\n\n* 什么是线程？\n* 什么是程序？\n* 什么是进程？\n* 线程和进程的区别是什么？\n* 程序和进程的区别是什么？\n\
  * 解释一下线程的上下文切换？\n* 什么是并行处理？\n* 什么是多线程？\n* 并行处理和多线程之间有什么关系？\n* 什么是死锁？\n* 什么是用户线程？\n\
  * 什么是线程本地存储？你应该用线程本地存储存储什么类型的对象？\n* 线程共享栈内存吗？\n\n## 线程生命周期\n\n以下是线程状态的不同阶段：\n* **New**（新创建）：线程已创建但未启动。\n\
  * **Runnable**（可运行）：线程正在运行。\n* **Blocked**（阻塞）：线程正在等待进入关键区域。\n* **Waiting**（等待）：线程通过调用\
  \ `wait()` 或 `join()` 进行等待。\n* **Time-waiting**（计时等待）：线程通过调用带超时的 `wait()` 或 `join()`\
  \ 进行等待。\n* **Terminated**（已终止）：线程已完成任务并退出。\n\n注意：你可以使用 `getState()` 方法获取线程的状态。\n\
  \n## 问题\n\n* 描述线程生命周期的不同阶段？\n* 阻塞状态和等待状态的区别是什么？\n* 如何获取线程状态？\n* 线程睡眠和线程等待有什么区别？\n\
  \n## 线程终止\n\n应该通过调用 `interrupt()` 方法来停止线程。对线程调用 `interrupt()` 甚至可以跳出 `Thread.sleep()`\
  \ 状态。\n\n```java\nif (Thread.currentThread().isInterrupted()) {\n    // 清理并停止\n\
  \    // 例如跳出循环\n}\n```\n\n注意：`stop()`、`suspend()` 和 `resume()` 方法已被废弃，因为使用这些方法可能导致程序处于不一致的状态。\n\
  \n## 问题\n\n* 定义一种良好的线程终止策略？\n* 什么是线程中断？线程中断方法与线程停止方法有什么区别？\n* 如果线程正在睡眠时你对线程调用中断会发生什么？\n\
  * 调用中断会立即停止线程吗？\n\n## 实现 Runnable 与 扩展 Thread\n\n实现 `Runnable` 接口的线程：\n```java\n\
  public class RunnableDerived implements Runnable {\n    public void run() {\n  \
  \  }\n}\n```\n\n扩展 `Thread` 类的线程：\n```java\npublic class ThreadDerived extends Thread\
  \ {\n    public void run() {\n    }\n}\n```\n\n* `Runnable` 的 `run()` 方法不会构造新线程，而是在创建它的同一个线程中作为普通进程运行，而\
  \ `Thread` 的 `start()` 方法会构造新线程。\n* 除非你要对 `Thread` 类进行特殊化（这在大多数情况下是不可能的），否则 `Runnable`\
  \ 是创建线程的首选方式。\n\n## 问题\n\n* 创建线程的不同方式有哪些？\n* 实现 `Runnable` 接口与扩展 `Thread` 类有什么区别？\n\
  * 什么时候应该扩展 `Thread` 类？\n* 什么时候应该继承 `Runnable` 接口？\n\n\n\n\n\n## 问题\n\n- 在 `Runnable`\
  \ 和 `Thread` 之间哪种是优方法？\n- 实现 `Runnable` 会创建线程吗？\n- `Thread` 类和 `Runnable` 接口都有 `run`\
  \ 方法，它们的区别是什么？\n\n## Runnable vs Callable 接口\n\n### Runnable 接口\n```java\n@FunctionalInterface\n\
  public interface Runnable {\n    public abstract void run();\n}\n```\n\n### Callable\
  \ 接口\n```java\n@FunctionalInterface\npublic interface Callable<V > {\n    V call()\
  \ throws Exception ;\n}\n```\n\n- `Runnable` 不能返回结果且不能抛出检查异常。\n- `Callable` 需要实现\
  \ `call()` 方法，而 `Runnable` 需要实现 `run()` 方法。\n- `Callable` 可以配合 `ExecutorService`\
  \ 方法使用，但 `Runnable` 不行。\n\n## 问题\n- `Callable` 和 `Runnable` 接口之间的区别是什么？\n- 使用 `Runnable`\
  \ 替 `Callable` 的好处是什么？\n- 你可以从 `Runnable` 接口中抛出检查异常吗？\n- 为什么 `Runnable` 和 `Callable`\
  \ 接口被称为函数式接口？\n- 哪个接口返回结果：`Runnable` 还是 `Callable`？\n\n## 守护线程 (Daemon Thread)\n\
  \n守护线程允许 JVM 随着程序退出。一旦 JVM 停止，所有守护线程都会退出，而不会回溯堆栈，也不会执行任何 `finally` 块。守护线程以非常低的优先级执行。\n\
  \n线程会继承父线程的守护状态，这意味着任何由 `main` 线程创建的线程都是非守护线程。通常，守护线程用于支持应用程序的后台任务或服务。垃圾回收是在守护线程中进行的。\n\
  \n你可以像下面一样创建一个守护线程：\n\n```java\nThread thread = new Thread();\nthread .setDaemon(true\
  \ );\n```\n\n所有非守护线程被称为用户线程。这些线程会阻止 JVM 关闭。当没有更多用户线程时，进程终止。Java 的 `main` 线程始终是一个用户线程。\n\
  \n## 问题\n- 什么是守护线程？\n- 什么是用户线程？`main` 线程是什么？\n- 如果守护线程仍在运行，程序可以退出吗？\n- 如果用户线程仍在运行，程序可以退出吗？\n\
  - 当 JVM 停止并退出所有守护线程时，守护线程上的 `finally` 块还有机会执行吗？\n- 当创建一个新线程时，它是作为用户线程还是守护线程创建？\n\
  - 如果没有用户线程在运行但守护线程仍在运行，会发生什么？\n- Java 的 `main` 线程是用户线程还是守护线程？\n- 当你在 `main` 线程上创建一个新线程时，创建的是什么类型的线程：守护还是用户？\n\
  - 你可以使用守护线程做什么什么工作？\n\n## 竞态条件 (Race Condition) 和不可变对象 (Immutable Object)\n\n当多个线程同时访问共享数据并对其修改时，就会产生竞态条件。由于这些线程读写数据的顺序无法预测，这可能导致不可预测的数据值。\n\
  \n如果一个对象在构造后没有状态改变的可能性，则它被认为是不可变的。如果一个对象是不可变的，它可以在多个线程之间共享，而不必担心竞态条件。\n\n### 如何使对象不可变\n\
  - 将类声明为 `final`。\n- 只允许通过构造函数创建对象。不要提供字段的 setter 方法。\n- 将所有字段标记为 `private`。\n\n\
  ## 问题\n- 不可变对象如何帮助防止竞态条件？\n- 为什么竞态能够产生不可预测的结果？\n- 为什么不可变对象在多线程环境中被认为是安全的？\n- 为什么建议将不可变类声明为\
  \ `final`？\n- 为什么构造函数应该是构造不可变对象的唯一方式？如果提供了 setter 方法会发生什么？\n\n## 线程池 (Thread Pool)\n\
  \n线程池是一组工作线程，它们独立存在于 `Runnable` 和 `Callable` 任务之外。固定线程池减少了线程创建的开销。当请求激增超过其处理能力时，它帮助应用程序进行优雅的降级，防止应用程序进入挂起或崩溃状态。\n\
  \n线程池还通过解耦任务的创建与执行实现了松耦合设计。借助 `Executors` 类可以轻松地创建固定线程池，你可以使用 `newFixedThreadPool()`\
  \ 工厂方法创建 `ExecutorService` 来执行任务。\n\n## 问题\n- 什么是线程池？\n- 线程池如何减少线程创建的开销？\n- 线程池如何帮助防止应用程序挂起或崩溃？\n\
  - 什么是固定线程池，它是如何创建？\n- 线程池如何实现松耦合设计？\n\n## 同步 (SYNCHRONIZATION)\n\n## 并发 (Concurrent)\
  \ vs 并行 (Parallel) vs 异步 (Asynchronous)\n\n并行处理是在多个核心上同时执行相同的任务。并发处理是同时执行多个任务；这些任务可以在多个核心上执行，也可以通过处理器上的抢占式时间分片线程执行。\n\
  \n异步处理是进程的独立执行，不需要等待中间操作的返回值。\n\n## 问题\n- 解释并发处理？\n- 解释并行处理？\n- 解释异步处理？\n- 解释并发处理与并行处理之间的区别？\n\
  - 并行处理需要多个线程吗？\n- 在什么情况下应用程序是并发而非行的？\n    - 当应用程序同时处理多个操作，而不将这些操作进一步分为更小的任务时。\n\
  - 在什么情况下应用程序是并行但不并发的？\n    - 当应用程序处理一个操作并将该操作分成更小的任务并并行处理时。\n- 在什么情况下应用程序既不是并发也不是行的？\n\
  \    - 当应用程序只处理一个操作，而不将该操作分为更小的任务时。\n- 在什么情况下应用程序既是并发又是行的？\n    - 当应用程序同时处理多个操作，并将这些操作进一步分为并行处理的小任务时。\n\
  \n## 线程同步\n\n当多个线程访问共享数据进行修改时，就会发生竞态条件。由于无法预测这些线程读写数据的顺序，可能会导致不可预测的数据值。\n\n临界区是指如果被多个线程并发访问可能会对结果产生不良影响的代码块。线程同步是对临界区的控制，以防止程序的不良影响。同步建立了一个被称为“发生在前”（happen-before）的缓冲区，确保随后获取相同本地对象的线程可以访问该线程对本地对象的所有更改。\n\
  \n## 问题\n- 解释多线程中的竞态条件？\n- 什么是临界区？\n- 什么是线程同步？\n- 什么是内存屏障？\n- 线程同步中的发生在前概念是什么？\n\
  \n## 同步方法与同步块\n\n`synchronized` 关键字用于标记代码中的临界区。互斥同步通过使用 `synchronized` 关键字锁定临界区来实现。这可以通过两种方式实现。\n\
  \n### 将方法标记为临界区\n```java\nclass DatabaseWrapper {\n    Object reference = new Object();\n\
  \    // 标记为临界区的方法\n    public synchronized void writeX() {\n        // 代码在这里\n \
  \   }\n    // 标记为临界区的静态方法\n    public static synchronized void writeY() {\n    \
  \    // 代码在这里\n    }\n}\n```\n\n### 将代码块标记为临界区\n```java\npublic void writeToDatabase()\
  \ {\n    // 多个线程可以到达这里// 标记为临界区的代码\n    synchronized (this ) {\n        // 只有一个线程可以同时执行这里\n\
  \    }\n    // 多个线程可以执行这里\n}\n```\n\n\n\n\n\n- 将锁定范围缩小到仅限临界区。这将提高整体性能并尽量减少遇到竞态条件的概率。\n\
  - 优先使用 `synchronized` 块而不是 `synchronized` 方法，因为块只在本地对象上锁定，而不是整个类对象。\n- 在 `synchronized`\
  \ 块内部，永远不要调用客户端代码提供的方法或为继承设计的方法。\n\n## Questions\n- `synchronized` 关键字是如何使用的？\n\
  - `synchronized` 方法和 `synchronized` 块之间有什么什么区别？\n- 为什么优先使用 `synchronized` 块而不是 `synchronized`\
  \ 方法？\n- `synchronized` 方法会锁定整个对象吗？\n- 如果在 `synchronized` 块或过程内部调用客户端支持的方法，会发生什么？\n\
  \n## 条件同步\n条件同步通过条件变量配合 `wait()` 和 `notify()` 或 `notifyAll()` 方法来实现。\n\n```java\n\
  public void operation() throws InterruptedException {\n    synchronized (reference)\
  \ {\n        if (condition1) {\n            // 等待通知\n            reference.wait();\n\
  \        }\n        if (condition2) {\n            // 通知所有等待的线程\n            reference.notifyAll();\n\
  \        }\n    }\n}\n```\n\n1. 有两种方法可以信号等待的线程。\n    - `notify()` - 仅信号一个随机线程。\n\
  \    - `notifyAll()` - 所有处于等待状态的线程。\n2. `wait()` 方法有一个重载版本也可以传递超时持续时间，`wait(long\
  \ timeout)`。\n3. 在 `notify()` 和 `notifyAll()` 方法之间，优先使用 `notifyAll()`，因为它会通知所有等待的线程。\n\
  4. `notify()` 方法唤醒单个线程，如果有多个线程等待被通知，那么线程的选择是随机的。\n\n## Questions\n- 什么是条件同步？\n-\
  \ 调用 `wait` 的目的是什么？\n- `notify` 和 `notifyAll` 方法之间有什么区别？\n- 当有多个线程在等待通知时，当你调用 `notify`\
  \ 时哪一个会被通知？\n- 在 `notify` 和 `notifyAll` 之间你应该优先选择哪一个？为什么？\n\n## Volatile\n在多线程应用中，每个线程都会维护一个从主内存到其\
  \ CPU 缓存的变量副本。因此，线程对其 CPU 缓存中变量的任何更改对其他线程都是不可见的。标记为 `volatile` 的字段直接从主内存中存储和读取。由于\
  \ `volatile` 字段存储在主内存中，因此所有线程都能看到 `volatile` 字段值的最新更新副本，无论是哪个线程修改了它。\n\n考虑一个类 `Ledger`，它有一个成员\
  \ `currentIndex` 来跟踪已输入条目的数量。在多线程环境中，每个线程都会独立地增加 `currentIndex` 的值。\n\n```java\n\
  public class Ledger {\n    public int currentIndex = 0;\n}\n```\n\n如果我们将 `currentIndex`\
  \ 标记为 `volatile`，那么每个线程将使用其来自主内存的值，而不会创建它的副本。\n\n```java\npublic class Ledger {\n\
  \    public volatile int currentIndex = 0;\n}\n```\n![](img/Image00013.jpg)\n\n\
  ## Questions\n- 什么是 `volatile` 变量？\n- 解释 `volatile` 字段解决了什么问题？\n- `volatile` 变量存储在哪里？\n\
  \n## static vs volatile vs synchronized\n\n### static Variable\n`static` 变量用于类对象的上下文中，无论创建多少个类对象，静态变量只存在一个副本。但如果多个线程访问同一个变量，每个线程都会在其\
  \ CPU 缓存中创建该变量的副本，一个线程所做的更改对其他线程是不可见的。\n\n### volatile Variable\n`volatile` 变量用于线程上下文，无论有多少个线程或对象访问它，都只存在一个变量，且每个人始终获得最新更新的值。`volatile`\
  \ 强制所有读写操作直接在主内存中进行，而不是在 CPU 缓存中。\n\n### synchronized\n`static` 和 `volatile` 都是字段修饰符，处理与变量相关的内存可见性；而\
  \ `synchronized` 处理的是使用监视器对代码中临界区的访问控制，从而防止对代码段的并发访问。\n\n## Questions\n- 什么是 `static`\
  \ 变量？\n- 类的所有对象共享 `static` 变量。但在多线程环境中，为什么一个对象对静态变量的更改对另一个线程上的对象是不可见的？\n- 如果 `static`\
  \ 和 `volatile` 变量在对象之间共享，那么 `volatile` 变量解决了什么问题？\n- `volatile` 和 `static` 变量与 `synchronized`\
  \ 有什么不同，因为即使是 `synchronized` 监视器也会保护内存对象？\n\n## ThreadLocal Storage\n每个线程都有一个称为“线程本地存储”（thread-local\
  \ storage）的私有内存，用于存储线程当前操作相关的数据。通常，`ThreadLocal` 变量被实现私有静态字段，用于存储事务标识、用户标识等信息。\n\
  \n### ThreadLocal 声明\n```java\nThreadLocal<String> threadLocal = new ThreadLocal<String>();\n\
  ```\n\n### 设置线程本地值\n```java\nthreadLocal.set(\"value\");\n```\n\n### 获取线程本地值\n```java\n\
  String accountId = threadLocal.get();\n```\n- `ThreadLocal` 对象包含在线程内部。\n- `ThreadLocal`\
  \ 的生命周期与其创建的线程相关联。\n- 为了防止泄漏，调用 `remove()` 是一个好习惯。\n```java\nthreadLocal.remove();\n\
  ```\n\n## Questions\n- 什么是线程本地存储？\n- 你在 `ThreadLocal` 中存储了什么？\n- 为什么你不应该同步 `ThreadLocal`\
  \ 的访问？\n- 为什么你应该移除 `ThreadLocal`？\n\n## wait() vs sleep()\n\n### 使用 `wait()` 进行条件同步\n\
  ```java\npublic void waitFor(int timeInMs) throws InterruptedException {\n    synchronized\
  \ (reference) {\n        if (condition1) {\n            // 等待通知\n            reference.wait(timeInMs);\n\
  \        }\n    }\n}\n```\n\n### 指定间隔的 sleep()\n```java\npublic void sleepFor(int\
  \ timeInMs) throws InterruptedException {\n    // 暂停 timeInMs\n    Thread.sleep(timeInMs);\n\
  \    // 打印消息\n    print(\"Slept for :\" + timeInMs + \"ms.\");\n}\n```\n- `wait`\
  \ 方法在对象的监控上调用；而 `sleep` 在线程上调用。\n- 等待的对象可以被通知；而睡眠线程不能。\n- 睡眠线程不能释放锁；而等待的对象可以。\n\
  - 唤醒睡眠线程需要它的引用，而等待对象则不需要。\n\n## Questions\n- `wait` 和 `sleep` 之间有什么区别？\n- 为什么可以通知等待对象而不能通知睡眠线程？\n\
  - 既然唤醒睡眠线程需要句柄，那么等待对象需要直接访问吗？为什么？\n- 信号对象退出 `wait` 的机制是什么？\n\n## Joining Threads\n\
  当线程之间存在依赖关系时，通常需要连接线程。目标线程的 `join()` 方法用于挂起当前线程。在这种情况下，在它所依赖的目标线程执行完成之前，当前线程无法继续执行。\n\
  \n```java\n// 主线程与线程 1 连接\npublic void main(String[] args) {\n    Thread thread1\
  \ = new Thread(ThreadMethodRef::threadMethod);\n    thread1.start();\n    // 当前线程等待\
  \ thread1 执行完成\n    thread1.join();\n}\n```\n\n\n## Questions\n- 线程 `join` 方法的目的是什么？\n\
  - 为什么需要连接两个线程？\n\n\n\n\n\n## 原子类 (Atomic Classes)\n原子类提供了对原始类型执行原子操作的能力，使得方法调用完成之前只允许一个线程更改值。`AtomicInteger`\
  \ 和 `AtomicLong` 等原子类封装了相应的原始类型。引用类型也有对应的类，即 `AtomicReference`。不需要对 `Atomic Class`\
  \ 对象提供同步（synchronized）访问。`AtomicInteger` 的方法 `incrementAndGet()` 通常用于替代前置和后置操作符。\n\
  \n## Questions\n* 什么是原子类？\n* 为什么不需要对原子类对象进行同步访问？\n* 为什么前置和后置操作符不是线程安全的？\n    * 前置和后缀操作在底层是多次操作——读取、递增和写入。这三个操作并没有同步执行，因此在它们之间发生的任何线程切换都会导致非预期的结果。\n\
  * 原子变量（Atomic）和 volatile 变量有什么区别？\n    * 原子变量即使对于前置和后缀递增等复合操作也能提供原子访问，而如果变量声明为 `Volatile`，这是无法可能的。`Volatile`\
  \ 仅保证发生之前的（happen-before）读取。\n\n## 锁 (Lock)\n* 锁是多线程系统中控制共享资源访问的机制。\n* `ReentrantLock`\
  \ 类实现了一个锁接口。\n* 锁可以在不同的代码块中获取和释放。\n* `Lock` 接口拥有 `tryLock()` 方法来验证资源的可用性。\n* 良好的做法是，获取的锁必须在\
  \ `finally` 块中释放。\n\n```java\n// 安全类\npublic class SafeAccount {\n    // 创建锁对象\n\
  \    private Lock lockObject = new ReentrantLock();\n\n    public void addMoney()\
  \ {\n        // 获取锁\n        lockObject.lock();\n        try {\n            // 此处添加金额的逻辑\n\
  \        } finally {\n            // 释放锁\n            lockObject.unlock();\n   \
  \     }\n    }\n}\n```\n\n## Questions\n* 解释多线程环境中的锁机制？\n* 你是否需要在同一个代码块中获取并释放锁？\n\
  * 为什么你应该倾向于使用 `tryLock()` 而不是 `lock()`？\n\n## 读写锁 (ReadWriteLock)\n* `ReadWriteLock`\
  \ 维护了一对关联的锁，一个用于写入，另一个用于只读操作。\n* 只有一个线程可以获取写锁，但多个线程可以拥有读锁。\n* `ReadWriteLock` 接口由\
  \ `ReentrantReadWriteLock` 实现。\n\n```java\n// ReentrantReadWriteLock 锁\nReentrantReadWriteLock\
  \ rwl = new ReentrantReadWriteLock();\n// 读锁\nLock rl = rwl.readLock();\n// 写锁\n\
  Lock wl = rwl.writeLock();\n```\n\n## Questions\n* 使用 `ReadWriteLock` 有什么好处？\n*\
  \ 在哪些场景下，你应该倾向于使用 `ReadWriteLock` 而不是其他锁机制？\n\n## 同步器 (Synchronisers)\n同步器同步多个线程以保护临界区域（Critical\
  \ Section）。\n\n| 同步点 (SyncPoint) | 线程 (Threads) |\n| :--- | :--- |\n\n### 同步器类型\n\
  * 屏障 (Barriers)\n* 信号量 (Semaphore)\n* 栅器 (Phasers)\n* 交换器 (Exchangers)\n* 计数器 (Latch)\n\
  \n## Questions\n* 同步器的目的是什么？\n* Java 中提供了哪些类型的同步器？\n\n## 屏障 (Barriers)\n* 在 `Barriers`\
  \ 中，一组线程会互相等待到达屏障点后再继续移动。\n* `CyclicBarrier` 是 `Barrier` 同步器的具体实现。\n\n```java\n\
  // 带有五个线程的屏障\nCyclicBarrier barrier = new CyclicBarrier(5);\n```\n\n* `Barrier`\
  \ 也称为循环的，因为它在对其调用 `reset()` 后可以被重用。\n* 可以将动作传递给 `CyclicBarrier`，以便在所有线程到达屏障点时执行。\n\
  \n```java\n// 带有在屏障点运行的动作的屏障\nCyclicBarrier barrier = new CyclicBarrier(5, () ->\
  \ {\n    // 屏障点动作代码。\n});\n```\n\n* 如果任何线程提前终止，其他线程将退出。\n* 屏障通常用于所有线程到达后，然后进入下一个阶段。\n\
  \n## Questions\n* 解释 `Barrier`？\n* 你可以再次重用 `Barrier` 吗？\n* 如果一个线程死亡了会什么？\n\n## 信号量\
  \ (Semaphore)\n* `Semaphore` 维护指定数量的许可。\n\n```java\n// 创建具有四个许可的信号量\nSemaphore semaphore\
  \ = new Semaphore(4);\n```\n\n* 要获取许可，使用 `acquire()`。\n* 要释放许可，使用 `release()`。\n\
  * 如果调用 `release()` 的次数多于 `acquire()`，将增加额外的许可。\n* `Semaphore` 通常用于允许限制访问。\n\n##\
  \ Questions\n* 解释 `Semaphore`？\n* 如果你调用 `release()` 的次数比 `acquire()` 多会发生什么？\n*\
  \ 当许可不可用时会发生什么？\n* 你在哪里使用 `Semaphore`？\n\n## 栅器 (Phaser)\n* 与屏障不同，注册到 `Phaser` 的参与人数可以随时间变化。\n\
  \n```java\n// 带有四个方的栅器\nPhaser phaser = new Phaser(4);\n```\n\n* `Phaser` 也可以被重用。\n\
  * 使用 `register()` 方法注册参与者。\n* 使用 `arriveAwaitAdvance()` 等待所有参与者到达。\n* `Phasers`\
  \ 监控已注册、到达和未到达参与者的计数。\n* 使用 `arriveDeregister()` 方法注销参与者。\n\n## Questions\n* 解释\
  \ `Phaser`？\n* `Phaser` 在参与人数方面有什么特殊之处？\n* 你可以再次重用同一个 `Phaser` 对象吗？\n* 你可以使用未注册为参与者的外部对象监控\
  \ `Phaser` 的计数吗？\n* `Semaphore` 和 `Phaser` 有什么区别？\n\n## 交换器 (Exchanger)\n* `exchanger`\
  \ 让两个线程在同步点互相等待以交换元素。\n\n```java\n// 交换字符串数组\nExchanger<ArrayList<String>> exchanger\
  \ = new Exchanger<ArrayList<String>>();\n```\n\n* `Exchangers` 使用 `exchange()` 方法交换信息。\n\
  \n```java\n// 交换数据\nobjectToExchange = exchanger.exchange(objectToExchange);\n```\n\
  \n* 在 `exchange()` 时，消费者清空要交换的对象并等待生产者再次交换完整的对象。\n\n## Questions\n* 解释 `Exchanger`？\n\
  * `Exchanger` 对象需要多少线程？\n* `Exchanger` 同步器的主要目的是什么？\n* `Exchanger` 同步器每次都使用同一个对象交换，还是可以使用不同的对象？\n\
  \n## 计数器 (Latch)\n* `Latch` 让一组线程等待一组操作完成。\n* `latch` 不可重用。\n* `CountDownLatch`\
  \ 类提供了 `Latch` 的实现。\n* 所有线程调用 `await()` 方法等待，直到 `countDown()` 被调次数达到计数器的设置次数。\n\n\
  ```java\n// 创建一个计数为五的倒计时器\nCountDownLatch cdl = new CountDownLatch(5); // 在线程任务完成后对计数器递减\n\
  ```\n\n\n\n\n\n```java\ncdl .countDown();// 等待计数器信号\ncdl .await();\n```\n\n## 问题\n\
  * 解释什么是 `Latch` 同步器？\n* 你可以重复使用同一个 `Latch` 对象吗；就像 `Barrier` 和 `Phaser` 那样？\n* 当线程完成工作时的信号传递过程是怎样的？\n\
  \n## 执行框架 (Executor Framework)\n执行框架提供了一个在线程上执行一组相关任务的基础设施。`Executor` 负责管理：\n\n\
  * 创建和销毁线程。\n* 为任务维护最佳线程数量。\n* 任务的并行和顺序执行。\n* 将任务提交与任务执行分离。\n* 策略与控制任务的执行有关。\n\n\
  // Executor 接口定义\n```java\npublic interface Executor {\n    void execute ( Runnable\
  \ command);\n}\n```\n\n## 问题\n* 解释什么是 `Executor` 框架？\n* `Executor` 框架有哪些不同的能力？\n\
  \n## Executor Service\n* `ExecutorService` 继承自 `Executor` 接口，提供了以下额外方法：\n    * `shutdown()`\
  \ - 在提交任务后关闭执行器。\n    * `shutdownNow()` - 中断当前任务并丢弃待处理的任务。\n    * `submit()` - 将任务添加到\
  \ `Executor` 中。\n    * `awaitTermination()` - 等待现有任务终止。\n* `ExecutorService` 提供\
  \ `Future` 对象来跟踪执行任务的进度和状态。\n* 所有提交给 `Executor` 的任务都会被队列化，由线程池线程执行。\n\n// 使用包含五个线程的线程池创建执行器\n\
  ```java\nExecutorService exec = Executors.newFixedThreadPool( 5 );\n```\n* 要创建一个单线程线程池，请使用\
  \ `newSingleThreadExecutor()` 方法。\n\n## 处理结果 (Handling Results)\n* `Runnable` 接口的\
  \ `run()` 方法不能返回结果或抛出异常。\n* 可以返回结果的任务是 `Callable` 接口的实例。\n\n// 任务可以通过 `Callable`\
  \ 的 `call` 方法返回派生结果\n```java\npublic interface Callable < V > {\n    V call() throws\
  \ Exception;\n}\n```\n* `submit()` 方法返回 `Future` 对象，有助于跟踪任务。\n\n// ExecutorService\
  \ 示例\n```java\npublic class ExecService {\n    public static void main(String[]\
  \ args)\n            throws ExecutionException, InterruptedException {\n      //\
  \ 创建包含五个线程线程池的执行器。\n      ExecutorService exec = Executors.newFixedThreadPool( 5\
  \ );\n      // 将可 任务提交给执行器\n      Future <String> task = exec .submit(\n       \
  \                         new Callable <String>() {\n                          \
  \      @Override\n                                public String call()\n       \
  \                                 throws Exception {\n                         \
  \           //某些逻辑\n                                    return null ;\n        \
  \                        }\n                            });\n      // 等待结果\n   \
  \   String result = task .get();\n      // 关闭执行器\n      exec .shutdown();\n    }\n\
  }\n```\n* 如果任务执行过程中发生异常，在 `ExecutorService` 上调用 `get()` 方法将抛出 `ExecutionException`\
  \ 实例。\n\n## 任务调度 (Scheduling Task)\n* `ScheduledExecutorService` 可用于调度未来的任务。\n*\
  \ 用于调度的方法：\n    * `schedule(task, delayTime, TimeUnit.SECONDS)`\n    * `scheduleAtFixedRate(task,\
  \ delayTime, repeatPeriod, TimeUnit.SECONDS)`\n    * `scheduleWithFixedDelay(task,\
  \ delayTime, fixedDelay, TimeUnit.SECONDS)`\n\n## ExecutorCompletionService\n* `ExecutorCompletionService`\
  \ 使用 `Executor` 执行任务。\n* `Executor` 的 `CompletionService` 可用于从多个任务获取结果。\n* `ExecutorCompletionService`\
  \ 提供了 `CompletionService` 具体实现。\n\n// 创建包含五个线程的执行器\n```java\nExecutorService es\
  \ = Executors.newFixedThreadPool( 5 );\n// ExecutorCompletionService 返回一个对象\nExecutorCompletionService<Result>\
  \ cs = new ExecutorCompletionService<>( es );\n// 向 ExecutorCompletionService 提交任务\n\
  cs .submit( longTask );\n// 获取任务结果\nFuture <Result> completedTask = cs .take();\n\
  ```\n\n### 注意事项\n* 始终为线程关联基于上下文的名称，这对调试非常有帮助。\n* 始终优雅地退出，根据你的用例调用 `shutdown()` 或\
  \ `shutdownNow()`。\n* 为 `ExecutorService` 配置线程池，使池中配置的线程数不显著大于处理器数量。\n* 你应该查询主机以找到处理器数量来配置线程池：`Runtime.getRuntime().availableProcessors()`。\n\
  \n## 问题\n* 解释什么是 `ExecutorService`？\n* 你如何跟踪执行任务的进度和状态？\n* `Executor service` 是否使用专用线程来执行队列中的任务？\n\
  * 你可以在 `ExecutorService` 中使用 `Runnable` 对象吗？为什么？\n* 你如何发现 `ExecutorService` 中是否抛出了异常？\n\
  * 你可以使用 `ExecutorService` 调度任务在未来运行吗？\n* 使用 `ExecutorService`，如何从多个任务中获取结果？\n* `ExecutorService`\
  \ 的 `submit()` 方法和 `execute()` 方法有什么区别？\n    * 如果你使用 `submit()`，你可以通过调用 `Future`\
  \ 上的 `get()` 方法获取任何抛出的异常；而如果你使用 `execute()`，异常将进入 `UncaughtExceptionHandler`。\n\
  * 你如何从 `ExecutorService` 优雅地退出？\n* 配置线程池大小的标准是什么？如何设置？\n\n## Fork-Join\n* Fork-Join\
  \ 框架利用了多处理器和多核心系统。\n* 它将任务分为子任务以并行执行。\n* `fork()` 方法从任务派生一个新的子任务。\n```java\nsubTask\
  \ .fork();\n```\n* `join()` 方法让任务等待其他任务完成。\n```java\nsubTask .join();\n```\n* Fork-Join\
  \ 中的重要类：\n    * `ForkJoinPool` - 用于执行子任务的线程池类。\n    * `ForkJoinTask` - 使用 `fork()`\
  \ 和 `join()` 方法管理子任务。\n    * `RecursiveTask` -产生结果的任务。\n    * `RecursiveAction`\
  \ 不产生结果的任务。\n* `RecursiveTask` 和 `RecursiveAction` 都提供了一个抽象的 `compute()` 方法供类实现，该类代表\
  \ `ForkJoin task`。\n\n## 问题\n* 解释 Java 中的 Fork-Join 框架？\n* Fork-Join 框架如何优化任务执行？\n\
  * `RecursiveTask` 和 `RecursiveAction` 之间有什么区别？\n\n## 反射 (REFLECTION)\n反射用于在运行时检查代码并可能修改应用程序的行为。\n\
  \n## 反射的用途\n反射仅用于特殊目的的问题解决，且仅在信息不可公开时使用。类成员被标记为私是有原因的。日常开发中反射的一些流行用法包括：\n\n* 反射通过在运行时调查代码和库来实现模块化架构，插件应用程序中的类和组件。\n\
  * 注解通过反射读取。JUnit 使用反射发现用于设置和测试的方法。\n* 调试器使用反射读取类的私有成员。\n* IDE 使用反射枚举类成员并探测代码。\n\
  * 对象关系映射 (ORM) 使用反射从数据创建对象。\n* 像 Spring 这样的依赖注入框架使用反射来解析依赖。\n\n### 使用\n下面的代码演示了如何使用反射访问\
  \ `Account` 类的私有字段。\n```java\npublic class Account {\n```\n\n\n\n\n\n```java\nprivate\
  \ float rate = 10.5f;\n\n}\n\npublic static void main(String[] args) throws IllegalAccessException\
  \ {\n    Account account = new Account();\n    Class<? extends Account> refClass\
  \ = account.getClass();\n    // get all the field\n    Field[] fields = refClass.getDeclaredFields();\n\
  \    for (Field field : fields) {\n        // no more private\n        field.setAccessible(true);\n\
  \        print(field.get(account));\n    }\n}\n```\n\n## 问题\n* 什么是反射？\n* 反射可以用于哪些不同的场景？\n\
  * 调试器是如何使用反射的？\n* 反射如何帮助创建模块化的软件架构？\n* 你可以使用反射访问私有成员吗？\n* 请举例说明在软件开发库、工具和框架中哪些反射的例子？\n\
  \n### 反射的缺点\n只有在某些内容不可公开且有非常充分的理由时，才应该使用反射，否则你必须重新审查你的设计。\n\n* 反射没有编译时检查，成员名称的任何更改都会导致代码崩溃。\n\
  * 反射违反了封装性，因为它暴露了内部数据结构。\n* 反射违反了抽象性，因为它暴露了内部实现，并提供了绕过应用于成员的验证逻辑的能力。\n* 反射是缓慢的，因为它在运行时解析成员时有额外的开销。\n\
