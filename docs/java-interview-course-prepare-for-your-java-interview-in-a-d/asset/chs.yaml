  * 优先使用字符串对象还是字符串字面量？为什么？\n\n## 字符串池内存管理\n\n字符串池是 Java 编译器用于字符串内存优化的内存中的特殊区域。如果字符串池中已存在\
  \ `String` 字面量，编译器会将新的字符串字面量引用指向池中现有的字符串变量，而不是创建新的字面量。Java 编译器可以执行这种优化是因为 String\
  \ 是不可变的。\n\n```java\nString cityNameObj = new String( \"London\");\n```\n\n\n\n\n\
