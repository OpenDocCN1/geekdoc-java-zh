    Late Summer 2039


    Mykl held the world in his hands. Continents and oceans spun in a blur before
    his eyes. As they slowed, he gave Greenland another swipe with his tiny fingers
    and sat mesmerized by the illusion of power rotating in his lap.


    “Put the globe away Mykl. We have to go,” a gentle voice said from behind.


    A slender woman with raven black hair cascading over her shoulders stood patiently
    in the doorway of the one-bedroom apartment. Rays of warm light from the setting
    sun accentuated her petite figure. She wore preposterously high heels in an attempt
    to create a fantasy of height, while fishnet stockings hugged her legs, sparkling
    magically from ankles to hips with calculated purpose. A leather corset pierced
    the opening of her jacket. One pale hand hung relaxed at her side, while the other
    tapped red nails on the doorframe. A lock of hair masked one of her angular face.


    Her fierce blue eyes stared purposefully at the small boy across the room. “Now,
    Mykl."


    He placed the globe atop his cluttered desk. Giving it one last spin, he danced
    his fingers across the keyboard of his disposable computer, closed his calculus
    book, and dashed to take his mother’s outstretched hand.


    “We won’t have to live like this much longer, you know,” she said as they walked
    to the car. “In fact, I may even be done by tonight. Then we can finally be by
    your dad.


    Mykl tilted his head to gaze at her. She rarely spoke of this man he had never
    met. It was as if he were some great secret. His mother had many secrets, and
    she kept them well.


    She kissed his cheek as she checked his seatbelt. “I named you after him, Mykl.
    He’s going to be so happy to see you."


    He probably had a weird name too, Mykl thought. No one ever spelled his right,
    and everyone who saw it written down wrong. It would be a lot easier if he spelled
    it like every other Michael.'
