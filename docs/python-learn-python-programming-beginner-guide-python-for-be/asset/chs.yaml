- "# Python：学习 Python 编程 – 初学者指南 (初学者的 Python，HTML,PHP, C,Java,Ruby,SQL 书籍 1)\n\n\n\
  \n\n\n\n\n\n## 什么是 Python？\n\nPython 是最适合初者的编程语言。它是一种解释型的、高级的、交互式的且面向对象的脚本语言。它的设计旨在具有高度的可读性。它使用的英语关键字比任何其他编程语言都多，因此很容易学习和理解。\n\
  \n### 作为解释型语言的 Python：\n\nPython 是一种解释型语言。它不使用编译器；解释器逐行检查代码并创建字节码。字节码是一种中间“语言”，它既不是机器码，也不是源代码。由于这种中间状态，字节码在操作系统之间比机器码更具迁移性；这有助于\
  \ Python 实现跨平台运行。Java 是另一种也使用字节码的语言。然而，由于 Python 使用解释器而不是编译器，代码处理速度可能会慢一些。字节码仍然需要被处理器“解码”后才能使用，这需要额外的时间。但这样做的好处是程序员可以立即看到其代码的结果。他不需要等待编译器来判断某处是否存在导致程序崩溃的语法错误。由于解释特性，Python\
  \ 和类似的语言用于快速应用程序开发和程序原型设计。例如，可以在几小时内创建一个简单的程序，并在同一次访问期间展示给客户。程序员可以反复修改程序并快速查看结果。这允许他们尝试不同的想法，并查看哪种是最好的，而必在死胡同上花费大量时间。这也适用于创建图形用户界面（GUI）。在几分钟内就可以布局出简单的“草图”，因为\
  \ Python 不仅有多种不同的 GUI 库可用，默认还包含了一个简单的库（`Tkinter`）。\n\n### 作为面向对象编程 (OOP) 的 Python：\n\
  \nPython 支持面向对象的编程风格，将代码封装在对象之中。Python 与其他语言不同之处在于，在开发程序时你有两个选择：过程化编程或面向对象。你可以在同一个程序中混合使用两者。\n\
  \n过程化编程是开发程序的逐步过程。函数在需要时由程序调用以执行某些处理，然后将控制权返回给主程序。C 和 BASIC 是过程化语言。\n\n面向对象编程 (OOP)\
  \ 意味着使用对象进行编程。对象由不同的编程逻辑单元创建；变量和方法组合成执行特定任务的对象。例如，如果你构建了一个机器人模型，身体的每个部分都是一个分离的对象，能够执行不同的事情，但仍然是对象的一部分。OOP\
  \ 也广泛用于 GUI 开发。\n\n### 作为初学者语言的 Python：\n\nPython 提供了广泛的应用，从简单的文本处理到 WWW 浏览器以及游戏。对于初学者级程序员来说，这是一门很好的语言。\n\
  \n## Python 历史\n\nGuido van Rossum 是 Python 语言的开发者。它于 80 年代后期和 90 年代初在荷兰的数学和计算机科学国家研究所开发。他在指导其进展方面起了至关重要的作用。\n\
  \n它是许多其他语言的结合，包括 ABC、Modula-3、C、C++、Algol-68、SmartTalk 以及 Unix shell 等脚本语言。它现在受版权保护，源代码在\
  \ GNU 通用公共许可证 (GPL) 下可用。\n\n## Python 的特性\n\n以下是 Python 编程的一些特性：\n\n### 易于学习：\n\n\
  它比其他语言容易学习得多。Python 的关键字很少，结构简单，便于制作和理解。它有清晰的语法，允许程序员快速上手这门语言。\n\n### 易于阅读：\n\n\
  它是一门高级语言，使用了许多英语单词。这就是为什么它比其他语言更容易阅读和理解。代码定义更清晰，肉眼可见。而且源代码非常易于维护。\n\n### 标准库：\n\n\
  Python 拥有大量用于编程的库。这些库在 UNIX、Windows 和 Macintosh 上都是通用且跨平台兼容的。\n\n### 交互模式：\n\nPython\
  \ 允许交互式模式，支持对代码段进行交互式测试和调试。\n\n### 可移植：\n\nPython 在所有平台上都具有相同的接口，可以在各种硬件平台上运行。它是可移植的，这意味着它们可以在不进行修改的情况下在不同类型的计算机上运行。\n\
  \n### 可扩展：\n\nPython 的一个特性是可以向 Python 解释器添加低级模块。这些模块允许程序员添加或自定义他们的工具以提高效率。\n\n###\
  \ 数据库：\n\nPython 为程序员提供了所有主要商业数据库的接口。\n\n### 图形用户界面 (GUI) 编程：\n\nPython 具有执行 GUI\
  \ 的能力，可以创建并移植到许多系统调用、窗口系统（如 Windows MFC、Macintosh 和 Unix 的 X 窗口系统）以及库。\n\n### 可扩展：\n\
  \nPython 是一门非常庞大且进步的语言，与 shell 脚本相比，它可以为大型程序提供更好的结构和支持。\n\nPython 还有许多上述其他特性，部分如下：\n\
  \n- 它可以编译为字节码以构建大型应用程序。\n- 支持 IT 功能、结构化编程方法和 OOP。\n- 编程语言最强大的特性之一是操作变量的能力。\n- 它支持自动垃圾收集。\n\
  - 它能够与 C、C++、CORBA、ActiveX 和 JAVA 轻松集成。\n- 它提供了非常高级的动态类型并支持动态类型检查。\n\n## Python\
  \ 入门\n\nPython 被认为是解释型语言，因为 Python 程序是由解释器执行的。使用解释器有两种方法：交互式模式和脚本模式。在交互式模式下，你输入\
  \ Python 程序，解释器显示结果：\n\n```\n1+1\n2\n```\n\n大于符号 `>>>` 是解释器用于指示它已就绪的提示符。如果你输入 `1+1`，解释器回复\
  \ `2`。或者，你可以将代码存储在文件中并使用解释器执行文件内容，这被称为脚本。惯例，Python 脚本的文件以 `.py` 扩展名结尾。\n\n要执行脚本，你必须告诉解释器文件名。如果你有一个名为\
  \ `mywork.py` 的脚本并且在 UNIX 命令行窗口中工作，你输入 `python mywork.py`。在其他开发环境中，执行脚本的细节不同。你可以在\
  \ Python 网站 `http://python.org/` 找到你环境的说明。\n\n\n\n\n\n程序是代码行/指令的组合，规定了如何执行计算。计算可以是数学上的，例如求解方程或寻找多项式的根，但也可以是符号计算，例如在文档中搜索和替换文本或编译程序。\n\
  \n每种语言中都包含一些指令：\n\n*   输入：通过键盘或其他输入设备从用户获取数据\n*   输出：在屏幕或其他输出设备上显示数据。\n*   数学：执行基础数学运算。\n\
  *   条件执行：检查某些条件并执行相应的代码。\n*   重复：反复执行某些操作，通常伴随着某种变化。\n\n## 什么是调试？\n\n编程错误被称为 bug（错误），追踪这些错误的过程被称为调试（debugging）。\n\
  \n编程中有三种类型的错误：\n\n### 语法错误\n只有在语法错误正确的情况下，Python 才能执行程序；否则解释器会显示错误信息。语法是关于结构的规则。例如，括号必须成对出现，所以\
  \ `(1+3)` 是合法的，但 `3)` 就是语法错误。\n\n在编程的最初几周里，你可能会花费大量时间追踪语法错误。随着经验的增加，你犯的错误会越来越少，并且能更快地找到它们。\n\
  \n### 运行时错误\n第二种错误是运行时错误，之所以这么命名是因为错误在程序开始运行后才会出现。这些错误也被称为异常（exceptions），因为它们通常表示发生了某些异常（且糟糕）的情况。\n\
  \n### 逻辑错误\n第三种是逻辑错误。如果你的程序中存在逻辑错误，它会成功运行，即计算机不会生成任何错误信息，但它不会做正确的事；它会执行我们没有预料到的事情。具体来说，它会执行你告诉它做的事。它的发生由于程序逻辑编写有误。\n\
  \n在我们开始编写第一个 Python 程序之前，我们必须简要地了解一些术语及其功能。这将消除初学者的概念模糊并对他们非常有帮助。\n\n*   **解决问题**：制定问题、寻找解决方案并表达解决方案的过程。\n\
  *   **高级语言**：一种如 `Python` 类的编程语言，设计为便于人类阅读和编写。\n*   **低级语言**：设计为便于计算机执行的编程语言；也称为“机器语言”或“汇编语言”。\n\
  *   **移植性**：程序可以在多种类型的计算机上运行的属性。\n*   **解释**：通过逐行翻译来执行高级语言程序。\n*   **编译**：将用高级语言编写的程序一次性翻译成低级语言，为稍后的执行做准备。\n\
  *   **源代码**：编译前的高级语言程序。\n*   **目标代码**：编译器翻译程序后的输出。\n*   **可执行文件**：准备好执行的目标代码的别名。\n\
  *   **提示符**：解释器显示的字符，表示它已准备好接收用户输入。\n*   **脚本**：存储在文件中的程序（通常是被解释的）。\n*   **交互模式**：通过在提示符处输入命令和表达式来使用\
  \ `Python` 解释器的方法。\n*   **脚本模式**：使用 `Python` 解释器读取并执行脚本语句的方法。\n*   **程序**：规定计算的指令集。\n\
  *   **算法**：解决一类问题的通用过程。\n*   **Bug**：程序中的错误。\n*   **调试**：寻找错误的过程。\n*   **语法**：程序的结构。\n\
  *   **异常**：运行时检测到的错误。\n*   **逻辑**：程序员的意图。\n*   **语义（逻辑）**：程序的含义。\n*   **标记**：程序的节点元素。\n\
  *   **赋值**：分配一个值的语句。\n*   **运算符**：特殊的符号，如加法、乘法或字符串。\n*   **操作数**：运算符作用的值。\n*   **地板除**：除法数字并舍弃小数部分的操作。\n\
  *   **求值**：通过执行运算来简化表达式。\n*   **优先级规则**：支配表达式求值顺序的规则。\n*   **拼接**：将两个操作数首尾相接。\n\
  *   **注释**：程序中供其他程序员（或任何阅读源代码的人）查看的信息，对程序的执行没有影响。\n*   **类型**：值的类别。\n*   **整数**：表示整数的类型。\n\
  *   **浮点数**：表示小数部分的类型。\n*   **字符串**：表示字符序列的类型。\n*   **变量**：引用值的名称。\n*   **语句**：代码段。\n\
  *   **关键字**：如 `if`、`def` 和 `while` 等保留用字。\n\n## 第一个程序\n\n在所有新语言中，第一个程序被称为“Hello\
  \ World”，因为它们做的只是显示“Hello World”这两个单词。\n\n在 Python 中：\n\n```\nprint 'Hello World'\n\
  ```\n\n这是 `print` 的一个简单示例，它实际上并没有在纸上打印任何东西。它在屏幕上显示一个值。在这种情况下，结果是 Hello World 单词。程序中的引号标记了要显示的文本的开始和结束；它们不会出现在结果中。\n\
  \n在 Python 3 中，打印的语法略有不同：\n\n```\nprint('Hello, World!')\n```\n\n括号表示 `print` 是一个函数。如果你使用的是\
  \ Python 3，则必须进行这种转换。除此之外，我们需要担心的差异很少。\n\n## 值与类型\n\n字母和数字在程序中被称为值。\n\n示例：`1`、`20`、`Hello`\
  \ 等。\n\n这些值具有不同的类型。在上面的示例中，`'1'` 是整数，而 `\"Hello\"` 是字符串，你可以通过包裹在引号内来识别字符串。\n\n如果你不确定某个值是什么类型，解释器可以告诉你。\n\
  \n```\ntype('Hello')\n```\n`<class 'str'>`\n\n```python\ntype(49)\n```\n`<class\
  \ 'int'>`\n\n如果数字以引号形式编码，那么它们也变为了字符串：\n\n```python\ntype('49')\n```\n`<class 'str'>`\n\
  \n```python\ntype('8.8')\n```\n`<class 'str'>`\n\n\n\n\n变量是一个引用某个值的名称。它是一个你可以在其中放入某些东西的。。编程语言最强大的特性之一就是操作变量的能力。\n\
  \n为了创建新变量，我们使用赋值运算符并给它们赋值：\n\n```python\nresult = ‘easily done’\nx = 88\ng = 9.8\n\
  ```\n\n在上面的示例中，我们使用了三个变量。第一个将字符串赋值给名为 `result` 的新变量；第二个将整数 `88` 赋值给 `x`；第三个将重力加速度\
  \ `g` 的赋值为 `9.8`。\n\n变量的类型就是它所引用的值的类型。\n\n```python\ntype(message)\n<type 'str'>\n\
  \ntype(n)\n<type 'int'>\n\ntype(pi)\n<type 'float'>\n```\n\n## 变量命名规则：\n\n我们创建变量名遵循以下规则：\n\
  \n-   它不能是关键字。\n-   除了下划线（`_`）之外没有特殊字符。\n-   变量名内部不允许有空格或空白。\n-   第一个字符必须是字母。\n\
  -   它可以包含字母和数字。\n-   永远不要重复使用相同的名称。\n-   可以是大写，但变量名以小写字母开头是个好主。\n\n优秀的程序员会为他们的变量选择有意义的名称，并在程序中使用它们。\n\
  \n如果你提供一个非法名称，你将得到语法错误。\n\n```python\n20level = 'Final round'\nSyntaxError: invalid\
  \ syntax\n\ngood@ = 1000000\nSyntaxError: invalid syntax\n\nclass = 'look good'\n\
  SyntaxError: invalid syntax\n```\n\n`20level` 是非法的，因为它不是以字母开头。`good@` 是非法的，因为它包含非法字符\
  \ `@`。但 `class` 有什么问题呢？事实证明 `class` 是 Python 的关键字之一。解释器使用关键字来识别程序的结构，它们不能用作变量名。\n\
  \n## 关键字\n\n这些编程语言中已经解释了含义的单词。关键字不能用作变量名，因为如果我们这样做，就是在尝试给关键字分配新的含义，这是计算机不允许的。\n\n\
  每个关键字都执行一个特定的任务。\n\n下表是 Python 编程中用到的一些关键字：\n\n| And | `del` | `from` |\n| `Not`\
  \ | `while` | `as` |\n| `Assert` | `elif` | `global` |\n| `Or` | `with` | `else`\
  \ |\n| `If` | `pass` | `yield` |\n| `Break` | `except` | `import` |\n| `Print` |\
  \ `class` | `exec` |\n| `In` | `raise` | `continue` |\n| `Finally` | `is` | `return`\
  \ |\n| `Def` | `lambda` | `for` |\n| `Try` | | |\n\n## 运算符和操作数\n\n计算工作通过运算符执行加法和乘法。运算符应用于值被称为操作数。运算符是可以操作操作数值的构造结构。\n\
  \n一些基本运算符是：\n\n1.  算术运算符\n2.  比较（关系）运算符\n3.  赋值运算符\n4.  逻辑运算符\n\n## 算术运算符：\n\n有一些有用的算术运算符：\n\
  \n| `+` | 加法 | `*` | 乘法 |\n| `-` | 减法 | `/` | 除法 |\n| `**` | 幂 | `%` | 取模 |\n| `//`\
  \ | 整除 | | |\n\n如下例所示：\n\n```python\n2+3     hour-1             hour*2+minute minute/30\
  \       2**5 (x+2)*(y-22)\n```\n\n在 Python 中，没有必要声明。在其他语言中，你必须先声明再初始化，这两个步骤在同一行代码中完成。例如在\
  \ C++ 中\n\n```cpp\nint a = 3; // 整数的内联初始化\nfloat b;\nb = 4.0 f ; // 浮点数的顺序初始化\n\
  ```\n\n在这里你可以看到，先声明它是浮点数还是整数是关重要的。\n\n但在 Python 中这不是必须的，如果你用某个值初始化变量，它就会存储在那种类型中。正如在这个示例中：\n\
  \n```python\na = 3 #integer\nb = 4.0 #floating point\n```\n\n如你所，`a` 和 `b` 都是数字，但\
  \ Python 可以在不告知的情况下判断出它们是什么类型。在 C++ 示例中，一个浮点值必须被“声明”两次；首先给变量赋予类型（`float`），然后将实际值赋给变量。你还会注意到\
  \ Python 中的注释是用井/磅符号（`#`）隔开，其用法与 C++ 或 Java 中的 `//` 注释完全一样。Python 中的数字就是这些了。\n\n\
  在 Python 2 中，除法运算符可能不符合你的预期：\n\n```python\nminute = 59\nminute/60\n0\n```\n\n`minute`\
  \ 的值为 59，在常规算术中 59 除以 60 等于 0.98333，而不是 0。差异的原因是 Python 正在执行整除 `//`。当两个操作数都是整数时，结果也是整数；整除会切掉小数部分，所以在这个示例中它向下取整为零。\n\
  \n在 Python 3 中，此除法的结果是一个浮点数。新运算符 `//` 执行整除。如果任一操作数是浮点数，Python 将执行浮点除法。结果是一个浮点数：\n\
  \n```python\nminute//60.0.98333333333\n```\n\n## 比较（关系）运算符：\n\n这些运算符决定操作数之间的关系。\n\
  \n| 运算符 | 描述 |\n| :--- | :--- |\n| `==` | 当两个值相等时 |\n| `!=` | 当两个值不等时 |\n| `>` |\
  \ 用于大于 |\n| `<` | 用于小于 |\n| `>=` | 用于大于或等于 |\n| `<=` | 用于小于或等于 |\n\n## 赋值运算符：\n\n\
  在 Python 中我们使用赋值运算符。它们的描述如下：\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `=` | 从右侧赋值 |\n\
  | `+=` | 将操作数相加并将结果赋左侧 |\n| `-=` | 从左侧减去右侧并将结果赋左侧 |\n| `*=` | 将操作数相乘并将结果赋左侧 |\n\
  | `/=` | 将左侧除以右侧并将结果赋左侧 |\n| `**=` | 对左侧幂并将结果赋左侧 |\n| `%=` | 使用两个操作数取模并将结果赋左侧 |\n\
  | `//=` | 对运算符应用整除并将结果赋左侧 |\n\n## 逻辑运算符：\n\nPython 编程中使用了以下逻辑运算符：\n\n| 运算符 | 描述\
  \ |\n| :--- | :--- |\n| `and` | 仅当两个条件都满足时 |\n| `or` | 仅当一个条件真时 |\n| `not` | 用于反转结果\
  \ |\n\n## 成员运算符：\n\n只有两个成员运算符。它们测试序列（如三元组、列表或字符串）中的成员身份。\n\n| 运算符 | 描述 |\n| :---\
  \ | :--- |\n| `in` | 仅当在序列中找到变量时为真 |\n| `not in` | 仅当不在序列中找到变量时为真 |\n\n## 身份运算符：\n\
  \n它们用于比较两个对象的内存位置。Python 中只有两个身份运算符：\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `is` |\
  \ 如果两个变量是同一个对象则返回真 |\n| `is not` | 如果两个变量不是同一个对象则返回真 |\n\n\n\n\n| 操作符 | 描述 |\n|\
  \ :--- | :--- |\n| `is` | 如果操作符两边的变量指向同一个对象，则结果为真，否则为假。 |\n| `is not` | 如果操作符两边的变量指向同一个对象，则结果为假，否则为真。\
  \ |\n\n## 运算顺序（优先级）\n\n当我们在一个表达式中使用多个运算符时，求值顺序取决于优先级规则。数学运算符有一套优先级顺序。从上到下的优先级顺序为：\n\
  \n- 括号优先级最高，可以强制表达式按照你想要的顺序进行求值。示例：`3*(5+4)`、`(2**5)+2`。第一个结果是 `27`，第二个是 `34`。\n\
  - 幂运算优先级次高。因此 `4**2+1` 是 `17` 而不是 `64`，`3*1**3` 是 `3` 而不是 `27`。\n- 在指数和补运算之后，一元加和减（`+`\
  \ 和 `-`）具有第三高优先级。\n- 除法、乘法、取模和整除的优先级相同。因此 `2*3-1` 是 `5` 而不是 `4`，`6+4/8` 是 `8` 而不是\
  \ `5`。\n- 加法和减法在除法和乘法之后优先级相同。\n- `<<`、`>>` 右左移。\n- `&` 按位“与”。\n- `^`、`|` 按位“异或”和普通“或”。\n\
  - `<=`, `<`, `>`, `>=` 比较运算符。\n- `<>`, `==`, `!=` 等等运算符。\n- `=`, `%=`, `/=`, `//=`,\
  \ `-=`, `+=`, `*=`, `**=` `=`\n- `is`、`is not` 恒等运算符。\n- `in`、`not in` 成员运算符。\n\
  - `not`、`or`、`and` 逻辑运算符。\n\n相同相同的运算符从左到右求值。我并不费力去记忆其他运算符的优先级规则。如果通过观察无法判断，我会使用括号让它一目了然。\n\
  \n## 表达式与语句\n\n值、运算符和变量的组合被称为表达式。单独的值被视为一个表达式，变量也是如此，因此以下都是合法的表达式：\n\n示例：\n`88`\n\
  `X`\n`X+11`\n\n语句是 Python 解释器可以执行的代码单元。我们已经见过两种语句：`print` 和赋值。从技术上讲，表达式也是语句，但将它们视为不同的事物可能更简单。重要的区别在于表达式有值，而语句没有。\n\
  \n## 交互式模式与脚本模式\n\n使用解释型语言的优点之一是，可以在将代码放入脚本之前在交互式模式下测试代码片段。但交互式模式和脚本模式之间存在令人困惑的差异。\n\
  \n例如，如果你将 Python 作为计算器使用，可能会输入：\n\n```python\n>>> miles = 26.2\n>>> miles * 1.6\n\
  42.182\n```\n\n第一行给 `miles` 赋值了一个值，但它没有可见的影响。第二行是一个表达式，因此解释器对其求值并显示结果。所以我们学到了马拉松大约是\
  \ 42 公里。但如果你将相同的代码输入脚本并运行，你将得没有任何输出。在脚本模式下，单独的表达式没有可见的影响。Python 实际上会求值该表达式，但除非你告诉它，否则不会显示值：\n\
  \n```python\nmiles = 26.2\nprint miles * 1.61\n```\n\n这种行为最初可能会令人困惑。脚本通常包含一系列语句。\
  \ 如果有多个语句，结果将随着语句的执行逐个出现。\n\n例如，该脚本：\n\n```python\nprint 100\nx = 55\nprint 11\n\
  ```\n\n产生输出：\n```\n100\n11\n```\n赋值语句不产生输出。\n\n## 字符串\n\n编程中的字符串简单就是文本，可以是单个字符、单词、短语或完整的句子。字符串是\
  \ Python 中最流行的类型之一。它们是编程时常用的元素之一，至少在与用户交互时是。因为它们如此常见，它们是 Python 中的原生数据类型，这意味着它们内置了许多强大的功能。与其他语言不同，你不需要担心自己创建这些功能。这是好事，因为内置功能经过了多次测试，并针对性能和稳定性进行了优化。\n\
  \nPython 中的字符串与大多数其他语言不同。我们可以简单地通过将字符括在引号中创建字符串。首先，没有字符类型，只有单字符字符串。字符串不能就地进行修改；每当你对它进行更改（如拼接）时，都会创建一个新的字符串对象。这意味着你必须意识到你并不是在操作内存中的字符串；在你处理它时，它不会被改变或删除。你只是每次都创建一个新字符串。创建字符串非常简单。例如：\n\
  \n```python\nnum1 = 'Hello World'\nnum2 = 'Basics'\n```\n\n`num1` = 'Hello World',\
  \ `num2` = 'Basics'.\n\n（注：原文此处存在大量重复的段落，已按要求在翻译中去重处理）\n\n\n\n\n| `%E` | 指数计数法（使用大写\
  \ ‘E’） | `%f` | 浮点实数 |\n\n# Python 中的决策制定\n\n在日常生活中，我们经常根据条件做出决定。例如，如果我们有 $5，我们就买一个板板球拍，否则不买。这个例子说明，如果第一个条件为真，我们就可以继续操作；否则我们就执行其他任务。Python\
  \ 在编程中为我们提供了这种条件语句来做出决策。决策结构评估多个产生真或假结果的表达式。在 Python 编程中，零和空值（null）被视为假，其他值均为真。\n\
  \n在 Python 中，我们有以下类型的决策语句：\n\n## `if` 语句：\n\n它类似于 C 语言。在 `if` 语句中，我们提供一些条件对数据进行比较并做出决策。如果满足条件，则执行语句。\n\
  \n### 语法\n```\nif (condition)\n    statement\n```\n\n### 示例:\n```\nnum1 = 2\nif\
  \ num1:\n    print “Expression is true”\n    print num1\n\nnum2 = 0\nif num2:\n\
  \    print “Expression is False ”\n    print num2\n\nprint “Its Over”\n```\n\n如果布尔表达式求值为真，则执行\
  \ `if` 语句内部的语句块。如果布尔表达式求值为假，则执行 `if` 语句结束后的后续代码。`if-statemnt` 可以写在一行中。\n\n### 示例:\n\
  ```\nnum = 1\nif ( num== 1 ) : print \"one-line if\"\n```\n\n## `if-else` 语句：\n\n\
  如果其语句的条件为假，则执行控制将跳转到 `if` 语句后的第一个语句。如果我们使用 `else` 语句，它会在 `if` 语句之后执行。`else` 语句与\
  \ `if` 语句结合使用。它是一个可选语句，大多数情况下在 `if-else` 语句块中使用一次。\n\n### 语法:\n```\nif (conditon):\n\
  \    statement\nelse:\n    statement\n```\n\n### 示例:\n```\nnum1 = 0\nif num1:\n\
  \    print \"Expression is true\"\nelse:\n    print \"Expression is false\"\n```\n\
  \n## `elif` 语句：\n\n如果我们想检查多个表达式是否为真，并在其中一个条件求值为真时立即执行语句块，我们有 `elif` 语句来执行此类任务。\n\
  \n它像 `else` 语句一样是可选的。我们在块中通常使用一个 `else` 语句，但可以有很多 `elif` 语句。\n\n### 语法:\n```\nif\
  \ (condition1):\n    statement\nelif(condition2):\n    statement\nelif(condition3):\n\
  \    statement\nelse:\n    statement\n```\n\n它类似于其他语言中的 `switch case` 语句。\n\n###\
  \ 示例:\n```\nnum = 1\nif num == 2:\n    print \"True Expression 1\"\nelif num ==\
  \ 3:\n    print \"True Expression 2\"\nelif num == 1:\n    print \"True Expression\
  \ 3\"\nelif num == 1:\n    print \"True Expression 4\"\nelse:\n    print \"No one\
  \ match!\"\n```\n\n如果没有一个可以匹配真表达式，则将打印 `else` 语句。\n\n# 循环\n\n当我们需要多次执行某块代码时，我们在\
  \ Python 中使用循环。在编程语言中，有各种控制结构允许更复杂的路径。\n\n简单的循环语句允许我们多次执行某块代码。\n\n为了处理循环需求，Python\
  \ 提供了以下几种类型的循环：\n\n## `While` 循环：\n\n如果给定的条件为真，`while` 循环会重复执行语句，直到它变为假。\n\n###\
  \ 语法:\n```\nwhile (condition):\n    statement\n    increment\\decrement\n```\n\n\
  首先，我们在 `while` 循环上方声明一个变量。然后在括号中给出条件。在条件中我们可能使用关系运算符。然后我们编写循环语句，如果语句为真，循环就会反复执行，直到为假为止。语句可以是单行的，也可以是语句块。在语句之后，我们在循环的末尾提到递增或递减。如果循环第一次执行，第二次执行将带有该递增或递减进行。这个过程一直持续到条件变为假为止。\n\
  \n### 示例:\n```\nvalue = 0\nwhile (value <5):\n    print ‘The value is:’, value\n\
  \    value= value +1\nprint “Its Over”\n```\n\n此块仅包含打印和递增语句，它在每个循环周期后将值增加 1。当值增加\
  \ 4 时，条件变为假，它停止工作。\n\n### 在 `While` 循环中使用 `else` 语句：\n\nPython 支持与 `While` 循环语句关联的\
  \ `else` 语句。如果在 `while` 循环在使用 `else` 语句，则在条件变为假时执行 `else` 语句。\n\n## `For` 循环：\n\n\
  `For` 循环具有遍历任何序列项的能力，例如列表或字符串。表达式列表首先被评估，如果序列包含其中任何一个项。然后序列中的第一个项被赋值给该变量。\n\n###\
  \ 语法:\n```\nfor iterating_var in sequence:\n    statement\n```\n\n### 示例:\n```\n\
  for letter in ‘Python’:\n    print letter\n```\n\n### 在 for 中 `else` 语句：\n\n在 Python\
  \ 中我们可以使用 `else` 语句。当循环耗尽时，会执行 `else` 语句。\n\n## 循环嵌套：\n\n循环内部的循环被称为循环嵌套。Python 允许循环嵌套。\n\
  \n### For 循环语法:\n```\nfor iterating_var in sequence:\n    statement\n```\n\n###\
  \ While 循环语法:\n```\nwhile(condition):\n    statements\n```\n\n## 控制语句：\n\n为了改变普通循环执行，我们使用控制语句。在\
  \ Python 中有以下：\n\n### `Break` 语句：\n\n它的工作与 C 语言相同。它停止执行并跳出循环。用于 `for` 和 `while`\
  \ 循环。\n\n### 语法:\n```\nbreak\n```\n\n### 示例:\n```\nfor letter in ‘Python’:\n   \
  \ if letter == ‘h’:\n        break\n    print ‘Current Letter :’ letter\n```\n\n\
  ### `Continue` 语句：\n\n当循环中使用 `continue` 语句时，它会将控制返回循环开头。它不会执行当前迭代中的剩余语句，并将控制移回循环顶部。\n\
  \n### 语法:\n```\ncontinue\n```\n\n### 示例:\n```\nfor letter in ‘Python’:\n    if letter\
  \ == ‘o’:\n        continue\n    print ‘Current Letter :’ letter\n```\n\n### `Pass`\
  \ 语句：\n\n执行时什么都不会发生，它是一个空操作。它适用于那些最终会编写代码但尚未编写的地方。\n\n### 语法:\n```\npass\n```\n\n\
  ### 示例:\n```\nfor letter in ‘Python’:\n    if letter == ‘h’:\n        pass\n   \
  \ print ‘This is pass block’\n    print ‘Current Letter :’ letter\n```\n\n## 列表\n\
  \n像字符串一样，列表是值的序列。Python 中最基本的数据结构是序列。序列中的每个元素都有自己的位置或索引。在字符串中我们只有字符值，但在列表中它们可以是任何类型。列表中的值称为元素或项。\n\
  \n创建列表非常简单，我们可以仅使用方括号创建列表。\n\n## 示例 1:\n```\nList1 = [10, 20, 30, 40]\n```\n\n##\
  \ 示例 2:\n```\nList2 = [‘June’, ‘July’, ‘August’ ]\n```\n\n## 示例 3:\n```\nList3 =\
  \ [‘march’, 2.1 , 5 ]:\n```\n\n不包含元素的被称为空集合。你可以通过括号 `[]` 创建空列表。\n\n## 访问列表中的值：\n\
  \n\n\n\n它们的访问方式与字符串相似（例如切片和拼接），因此非常易用，而且它们是变长的，即它们在使用过程中会自动增长和收缩。要访问列表中的元素，请使用方括号。实际上，Python\
  \ 列表是 Python 解释器内部的 C 数组，作用就像指针数组。\n\n示例：\n\n```python\nlist1 = ['June', 'july',\
  \ 404, 808];\nlist2 = [1, 2, 3, 4, 5, 6, 7 ];\nprint \"list1[0]: \", list1[0]\n\
  print \"list2[1:3]: \", list2[1:3]\n```\n\n需要记住的最重要的是，列表是位于方括号内的一系列对象，用逗号分隔。字典和元组看起来相似，但它们使用不同类型的括号。\n\
  \n列表最常见的用途是遍历列表并对列表中的每个对象执行相同的操作，因此通常会使用相似的数据类型。\n\n## 在列表中添加元素\n\n在列表中添加新元素非常简单。为了这个目的，我们有\
  \ `append` 语句，通过它可以告诉列表添加元素。\n\n示例：\n\n```python\nmylist = [20 , 22 , 24 ];\nmylist.append\
  \ (26) ;\nprint mylist own\n```\n\n要把两个列表连接在一起，我们有 `extend()` 语句。可以使用此语句将两个列表连接在一起。\n\
  \n示例：\n\n```python\nlist1 = [\"June\", \"July\" ,\"August\"];\nlist2 = [5 , 10 ,\
  \ 15 ];\nlist1.extend(list2);\nprint list1\n```\n\n## 在列表中删除元素\n\n有许多方法可以从列表中删除元素。要删除一个元素，可以使用\
  \ `del` 语句和 `pop`（如果你确切知道要删除的是哪个元素），或者在不知道的情况下使用 `remove` 方法。\n\n`pop` 会修改列表并在执行后返回删除的元素。\n\
  \n示例：\n\n```python\nlist = ['a', 'b', 'c'];\nnewlist = list.pop(1);\nprint t\n```\n\
  \n如果你不需要移除值，可以使用 `del` 运算符。\n\n示例：\n\n```python\nlist = ['a', 'b', 'c'];\ndel list[1];\n\
  print t\n```\n\n如果你不知道想要删除的元素的索引但知道该元素本身，可以使用 `remove` 语句。\n\n示例：\n\n```python\n\
  list= ['a', 'b', 'c'];\nlist.remove('b');\nprint list\n```\n\n## 列表运算符\n\n列表也可以像字符串一样执行\
  \ `+`（拼接）和 `*`（重复）运算符，但结果是一个新列表而不是字符串。\n\n列表执行所有我们在字符串上用过的通用操作。\n\n| 表达式 | 输出 |\
  \ 描述 |\n| :--- | :--- | :--- |\n| `[1 , 2 , 3 ]+[4, 5, 6]` | `[1, 2, 3, 4, 5, 6]`\
  \ | 拼接 |\n| `Len([1, 2, 3]),` | `3` | 长度 |\n| `3 in [1, 2, 3]` | `True` | 成员关系 |\n\
  | `[‘OK’]*4` | `[‘OK’ ,’OK’ , ‘OK’ , ‘OK’ ]` | 重复 |\n| `For x in [1, 2, 3]: print\
  \ x,` | `1 2 3` | 迭代 |\n\n## 字典\n\n字典是 Python 中最有用的数据类型之一。字典类似于列表，但它具有更通用的属性。在列表中，索引必须是整数，但在字典中，它们可以是几乎任何类型。它们是对象的无序集合，与关键字匹配。相比之下，列表是使用数值偏移的有序集合。\n\
  \nPython 字典提供了索引集合（即键 keys）和值集合之间的映射。每个键都映射到一个值。键和值之间的关系被称为键值对，有时也称为一个项（item）。\n\
  \n## 字典的基本属性\n\n字典具有一些属性：\n\n- 它不是偏移量，可以通过关键字轻松访问。它的执行方式与关联数组相同。字典中的所有项都有其自己的关键字；关键字用于调用该项。\n\
  - 为了提供更快的查找，存储的对象是随机顺序排列的。在创建时，字典以它选择的任何顺序存储项。使用键即可获取项。字典中没有内置方法对项排序，如果你需要排序，请自行处理。\n\
  - 字典是变长的，可以包含任何类型的对象，并支持深度嵌套。\n- 它们不能像列表或字符串那样被修改，但它们是可变的（mutable）。\n- 它们是唯一支持映射的数据类型。\n\
  - 在内部，字典实现为哈希表。\n\n## 字典的基本操作\n\n现在我们有一个 Python 字典一些常用操作的列表：\n\n- `d1 = { }` 空字典。\n\
  - `d2 = { ‘basic’ : 2, ‘Python’ : 3}` 两个元素的字典。\n- `d3 = { ‘June’ : { ‘July’ : 1\
  \ , ‘August’ : 2 } }` 嵌套。\n- `d2 [ ‘Python’ ] , d3[ ‘June’ ][ ‘July’ ]` 通过键索引。\n\
  - `d2.has_key( ‘Python’`), `d2.keys( )`, `d2.values( )` 方法：成员测试、键列表、值列表等。\n- `len(d1)`\
  \ 长度（存储的条目数）。\n- `d2 [key] = new`, `del d2[key]` 添加/删除。\n\n\n\n\n\n* 它们也可以用作字典的键。大多数程序员并没有为此目的使用元组。\n\
  * 它们用于存储在字符串格式化中要插入到字符串中的多个值。\n\n## 基本操作\n\n以下是元组的一些常用操作列表：\n\n* `()` 它仅仅只是一个空元组。\n\
  * `tup1 = (0, )` 单个元素的元组。\n* `tup2 = (0, 1, 2, 3)`\n* `tup3 = 1, 2, 3, 4` 这是另一个四个元素的元组，如上所示，但没有括号。\n\
  * `tup3 = (‘xyz’ , ( ‘ijk’ , ‘lmn’ ))` 嵌套元组。\n* `tup1[n]`, `tup3[n][j]` 索引。\n* `tup1[i:j]`\
  \ 切片。\n* `len(tup1)` 长度。\n* `tup1 + tup2` 合并。\n* `tup3*4` 重复。\n* `for x in tup2`\
  \ 迭代。\n* `3 in tup2` 成员检查。\n\n第二项显示了如何创建一个单个元素的元组。由于括号可以包围表达式，因此你必须在元素后放置逗号，以告诉\
  \ Python 单个元素实际上是一个元组。第四项显示了不带括号的元组；当元组没有歧义时，可以使用这种形式。然而，直接使用括号比去研究何时是可选的要容易得多。\n\
  \n## 创建元组\n\n创建元组非常简单，你只需要将值放在一起并用逗号分隔它们。你可以使用括号来结束元组，但这是可选的。\n\n示例：\n\n```\ntup1\
  \ = ( ‘Sunday’ , ‘Monday’ , 1 , 2 );\ntup2 = ( 11 , 12 , 13 , 14 , 15);\ntup3 =\
  \ “a” , “b” , “c” , “d” ;\n```\n\n##访问值\n\n我们使用方括号配合索引或索引进行切片，以获取该索引处的值。\n\n示例：\n\
  \n```\ntup1 = ('Sunday', 'Monday', 1, 2);\ntup2 = (1, 2, 3, 4, 5, 6, 7 );\nprint\
  \ \"tup1[0]: \", tup1[0]\nprint \"tup2[1:5]: \", tup2[1:5]\n```\n\n"
