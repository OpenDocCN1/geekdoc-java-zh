    程序是代码行/指令的组合，规定了如何执行计算。计算可以是数学上的，例如求解方程或寻找多项式的根，但也可以是符号计算，例如在文档中搜索和替换文本或编译程序。


    每种语言中都包含一些指令：


    *   输入：通过键盘或其他输入设备从用户获取数据

    *   输出：在屏幕或其他输出设备上显示数据。

    *   数学：执行基础数学运算。

    *   条件执行：检查某些条件并执行相应的代码。

    *   重复：反复执行某些操作，通常伴随着某种变化。


    ## 什么是调试？


    编程错误被称为 bug（错误），追踪这些错误的过程被称为调试（debugging）。


    编程中有三种类型的错误：


    ### 语法错误

    只有在语法错误正确的情况下，Python 才能执行程序；否则解释器会显示错误信息。语法是关于结构的规则。例如，括号必须成对出现，所以 `(1+3)` 是合法的，但
    `3)` 就是语法错误。


    在编程的最初几周里，你可能会花费大量时间追踪语法错误。随着经验的增加，你犯的错误会越来越少，并且能更快地找到它们。


    ### 运行时错误

    第二种错误是运行时错误，之所以这么命名是因为错误在程序开始运行后才会出现。这些错误也被称为异常（exceptions），因为它们通常表示发生了某些异常（且糟糕）的情况。


    ### 逻辑错误

    第三种是逻辑错误。如果你的程序中存在逻辑错误，它会成功运行，即计算机不会生成任何错误信息，但它不会做正确的事；它会执行我们没有预料到的事情。具体来说，它会执行你告诉它做的事。它的发生由于程序逻辑编写有误。


    在我们开始编写第一个 Python 程序之前，我们必须简要地了解一些术语及其功能。这将消除初学者的概念模糊并对他们非常有帮助。


    *   **解决问题**：制定问题、寻找解决方案并表达解决方案的过程。

    *   **高级语言**：一种如 `Python` 类的编程语言，设计为便于人类阅读和编写。

    *   **低级语言**：设计为便于计算机执行的编程语言；也称为“机器语言”或“汇编语言”。

    *   **移植性**：程序可以在多种类型的计算机上运行的属性。

    *   **解释**：通过逐行翻译来执行高级语言程序。

    *   **编译**：将用高级语言编写的程序一次性翻译成低级语言，为稍后的执行做准备。

    *   **源代码**：编译前的高级语言程序。

    *   **目标代码**：编译器翻译程序后的输出。

    *   **可执行文件**：准备好执行的目标代码的别名。

    *   **提示符**：解释器显示的字符，表示它已准备好接收用户输入。

    *   **脚本**：存储在文件中的程序（通常是被解释的）。

    *   **交互模式**：通过在提示符处输入命令和表达式来使用 `Python` 解释器的方法。

    *   **脚本模式**：使用 `Python` 解释器读取并执行脚本语句的方法。

    *   **程序**：规定计算的指令集。

    *   **算法**：解决一类问题的通用过程。

    *   **Bug**：程序中的错误。

    *   **调试**：寻找错误的过程。

    *   **语法**：程序的结构。

    *   **异常**：运行时检测到的错误。

    *   **逻辑**：程序员的意图。

    *   **语义（逻辑）**：程序的含义。

    *   **标记**：程序的节点元素。

    *   **赋值**：分配一个值的语句。

    *   **运算符**：特殊的符号，如加法、乘法或字符串。

    *   **操作数**：运算符作用的值。

    *   **地板除**：除法数字并舍弃小数部分的操作。

    *   **求值**：通过执行运算来简化表达式。

    *   **优先级规则**：支配表达式求值顺序的规则。

    *   **拼接**：将两个操作数首尾相接。

    *   **注释**：程序中供其他程序员（或任何阅读源代码的人）查看的信息，对程序的执行没有影响。

    *   **类型**：值的类别。

    *   **整数**：表示整数的类型。

    *   **浮点数**：表示小数部分的类型。

    *   **字符串**：表示字符序列的类型。

    *   **变量**：引用值的名称。

    *   **语句**：代码段。

    *   **关键字**：如 `if`、`def` 和 `while` 等保留用字。


    ## 第一个程序


    在所有新语言中，第一个程序被称为“Hello World”，因为它们做的只是显示“Hello World”这两个单词。


    在 Python 中：


    ```

    print ''Hello World''

    ```


    这是 `print` 的一个简单示例，它实际上并没有在纸上打印任何东西。它在屏幕上显示一个值。在这种情况下，结果是 Hello World 单词。程序中的引号标记了要显示的文本的开始和结束；它们不会出现在结果中。


    在 Python 3 中，打印的语法略有不同：


    ```

    print(''Hello, World!'')

    ```


    括号表示 `print` 是一个函数。如果你使用的是 Python 3，则必须进行这种转换。除此之外，我们需要担心的差异很少。


    ## 值与类型


    字母和数字在程序中被称为值。


    示例：`1`、`20`、`Hello` 等。


    这些值具有不同的类型。在上面的示例中，`''1''` 是整数，而 `"Hello"` 是字符串，你可以通过包裹在引号内来识别字符串。


    如果你不确定某个值是什么类型，解释器可以告诉你。


    ```

    type(''Hello'')

    ```

    `<class ''str''>`


    ```python

    type(49)

    ```

    `<class ''int''>`


    如果数字以引号形式编码，那么它们也变为了字符串：


    ```python

    type(''49'')

    ```

    `<class ''str''>`


    ```python

    type(''8.8'')

    ```

    `<class ''str''>`


