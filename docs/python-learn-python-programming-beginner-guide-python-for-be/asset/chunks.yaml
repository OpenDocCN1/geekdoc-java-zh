    ## String Formatting


    It is a very good feature of python programming. Its resembles the function from
    C’s `printf()` family. Its symbol is `%`. For example:


    ```python

    print " My name is %s and roll no. is %d." % (''Omer'', 15)

    ```

    This code will produce output: `My name is Omer and roll no. is 15.`


    There are some useful symbols which can be used along with `%`:


    | Format symbol | Conversion | Format Symbol | Conversion |

    | :--- | :--- | :--- | :--- |

    | `%c` | character | `%s` | string conversion |

