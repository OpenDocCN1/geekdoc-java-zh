    * 它们也可以用作字典的键。大多数程序员并没有为此目的使用元组。

    * 它们用于存储在字符串格式化中要插入到字符串中的多个值。


    ## 基本操作


    以下是元组的一些常用操作列表：


    * `()` 它仅仅只是一个空元组。

    * `tup1 = (0, )` 单个元素的元组。

    * `tup2 = (0, 1, 2, 3)`

    * `tup3 = 1, 2, 3, 4` 这是另一个四个元素的元组，如上所示，但没有括号。

    * `tup3 = (‘xyz’ , ( ‘ijk’ , ‘lmn’ ))` 嵌套元组。

    * `tup1[n]`, `tup3[n][j]` 索引。

    * `tup1[i:j]` 切片。

    * `len(tup1)` 长度。

    * `tup1 + tup2` 合并。

    * `tup3*4` 重复。

    * `for x in tup2` 迭代。

    * `3 in tup2` 成员检查。


    第二项显示了如何创建一个单个元素的元组。由于括号可以包围表达式，因此你必须在元素后放置逗号，以告诉 Python 单个元素实际上是一个元组。第四项显示了不带括号的元组；当元组没有歧义时，可以使用这种形式。然而，直接使用括号比去研究何时是可选的要容易得多。


    ## 创建元组


    创建元组非常简单，你只需要将值放在一起并用逗号分隔它们。你可以使用括号来结束元组，但这是可选的。


    示例：


    ```

    tup1 = ( ‘Sunday’ , ‘Monday’ , 1 , 2 );

    tup2 = ( 11 , 12 , 13 , 14 , 15);

    tup3 = “a” , “b” , “c” , “d” ;

    ```


    ##访问值


    我们使用方括号配合索引或索引进行切片，以获取该索引处的值。


    示例：


    ```

    tup1 = (''Sunday'', ''Monday'', 1, 2);

    tup2 = (1, 2, 3, 4, 5, 6, 7 );

    print "tup1[0]: ", tup1[0]

    print "tup2[1:5]: ", tup2[1:5]

    ```


