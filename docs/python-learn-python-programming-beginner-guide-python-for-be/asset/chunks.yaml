    * They can also be used as keys for dictionaries. Most of the programmers did
    not use tuples for this purpose.

    * They are use to holding multiple values to be inserted into a string in the
    string formatting.


    ## Basic Operation


    Here is a list of some common operations for tuples:


    * `()` it’s a simply an empty tuple.

    * `tup1 = (0, )` A one-item tuple.

    * `tup2 = (0, 1, 2, 3)`

    * `tup3 = 1, 2, 3, 4` it is another four-item tuple as above but is has no parentheses.

    * `tup3 = (‘xyz’ , ( ‘ijk’ , ‘lmn’ ))`, Nested tuples.

    * `tup1[n]`, `tup3[n][j]`, Index.

    * `tup1[i:j]`, Slice.

    * `len(tup1)`, Length.

    * `tup1 + tup2`, Concatenate.

    * `tup3*4`, Repeat.

    * `for x in tup2`, Iteration.

    * `3 in tup2`, Membership.


    The second entry shows hoe to create a one item tuple. Since parentheses can surround
    expressions, you have to show Python when a single item is actually a tuple by
    placing a comma after the item. The fourth entry shows a tuple without parentheses;
    this form can be used when a tuple is unambiguous. However, it’s easiest to just
    use parentheses than to figure out when they’re optional.


    ## Creating a Tuple


    Creating a tuple is very simple you just put the values and separate them by using
    comma. You can use parentheses to close the tuple but it’s optionally.


    Example:


    ```

    tup1 = ( ‘Sunday’ , ‘Monday’ , 1 , 2 );

    tup2 = ( 11 , 12 , 13 , 14 , 15);

    tup3 = “a” , “b” , “c” , “d” ;

    ```


    ## Access a Value


    We use square brackets for slicing along with index or indices to get the value
    at that index.


    Example:


    ```

    tup1 = (''Sunday'', ''Monday'', 1, 2);

    tup2 = (1, 2, 3, 4, 5, 6, 7 );

    print "tup1[0]: ", tup1[0]

    print "tup2[1:5]: ", tup2[1:5]

    ```

