    to perform a computation. The computation might be something mathematical , such
    as solving equations or finding the roots of a polynomial , but it can also be
    symbolic computation such as searching and replacing text in a document or compiling
    a program.


    There are some instructions in every language :


    *   Input: Getting data from user through keyboard or other input device


    *   Output: Displayed data on screen or other output device.


    *   Math: Perform basic mathematical operations.


    *   Conditional execution: Check for certain conditions and execute the appropriate
    code.


    *   Repetitions : Perform some action repeatedly, usually with some variation.


    ## What is debugging ?


    Programming errors are called bugs and the process of tracking them down is called
    debugging.


    There are three types of errors in programming:


    ### Syntax Error:


    Python can only executes a program if the syntax error is correct; otherwise the
    interpreter displays an error message. Syntax are rules about structure . For
    example , parentheses have to come in matching pairs so (1+3) is legal, but 3)
    is a syntax error.


    During the first few weeks of your programming , you will probably spend a lot
    of  time tracking down syntax error . As you gain experience , you will make fewer
    errors and find them faster.


    ### Runtime Error:


    The second type of error is a runtime error ,so called because the error does
    not appear until after the program has started running. These errors are also
    called exceptions because they usually indicate that something exceptional (and
    bad) has happened.


    ### Logical Error:


    The third one is logical error. If there is a logical error in your program ,
    it will run successfully in the sense that the computer will not generate any
    error message, but it will not do the right thing it will do something that we
    are not excepting. Specifically it will do what you told to it to do. Its occur
    due to make wrong logic of program.


    Before we start our first program in Python we must know some terminologies and
    their functions in a short way .It will clear the concept of beginners and be
    a very helpful for them.


    Problem solving: The process of formulating a problem, finding a solution, and
    expressing the solution.


    High-level language: A programming language like Python that is designed to be
    easy for humans to read and write.


    Low-level language: A programming language that is designed to be easy for a computer
    to execute; also called “machine language” or “assembly language.” portability:
    A property of a program that can run on more than one kind of computer. interpret:
    To execute a program in a high-level language by translating it one line at a
    time.


    Compile: To translate a program written in a high-level language in to a low-level
    language all at once, in preparation for later execution.


    Source code: A program in a high-level language before being compiled.


    Object code: The output of the compiler after it translates the program.


    Executable: Another name for object code that is ready to be executed.


    Prompt: Characters displayed by the interpreter to indicate that it is ready to
    take input from the user.


    Script: A program stored in a file (usually one that will be interpreted).


    Interactive mode: A way of using the Python interpreter by typing commands and
    expressions at the prompt.


    Script mode: A way of using the Python interpreter to read and execute statements
    in a script.


    Program: A set of instructions that specifies a computation.


    Algorithm: A general process for solving a category of problems.


    Bug: An error in a program.


    Debugging: The process of finding and removing any of the three kinds of programming
    errors.


    Syntax: The structure of a program.


    Syntax error: An error in a program that makes it impossible to parse (and therefore
    impossible to interpret).


    Exception: An error that is detected while the program is running.


    Semantics (logic): The meaning of a program.


    Semantic (Logical) error: An error in a program that makes it do something other
    than what the programmer intended.


    Token: One of the basic elements of the syntactic structure of a program, analogous
    to a word in a natural language.


    Parse: To examine a program and analyze the syntactic structure.


    Print statement: An instruction that causes the Python interpreter to display
    a value on the screen.


    Value: One of the basic units of data, like a number or string, that a program
    manipulates.


    Type: A category of values. The types we have seen so far are integers (type int),
    floating point numbers (type float), and strings (type str).


    Integer: A type that represents whole numbers. floating-point: A type that represents
    numbers with fractional parts.


    String: A type that represents sequences of characters.


    Variable: A name that refers to a value.


    Statement: A section of code that represents a command or action. So far, the
    statements we have seen are assignments and print statements.


    Assignment: A statement that assigns a value to a variable.


    State diagram: A graphical representation of a set of variables and the values
    they refer to.


    Keyword: A reserved word that is used by the compiler to parse a program; you
    cannot use keywords like if, def, and while as variable names. 


    Operator: A special symbol that represents a simple computation like addition,
    multiplication, or string concatenation


    Operand: One of the values on which an operator operates.


    Floor division: The operation that divides two numbers and chops off the fraction
    part.


    Expression: A combination of variables, operators, and values that represents
