    ## 什么是 Python？


    Python 是最适合初者的编程语言。它是一种解释型的、高级的、交互式的且面向对象的脚本语言。它的设计旨在具有高度的可读性。它使用的英语关键字比任何其他编程语言都多，因此很容易学习和理解。


    ### 作为解释型语言的 Python：


    Python 是一种解释型语言。它不使用编译器；解释器逐行检查代码并创建字节码。字节码是一种中间“语言”，它既不是机器码，也不是源代码。由于这种中间状态，字节码在操作系统之间比机器码更具迁移性；这有助于
    Python 实现跨平台运行。Java 是另一种也使用字节码的语言。然而，由于 Python 使用解释器而不是编译器，代码处理速度可能会慢一些。字节码仍然需要被处理器“解码”后才能使用，这需要额外的时间。但这样做的好处是程序员可以立即看到其代码的结果。他不需要等待编译器来判断某处是否存在导致程序崩溃的语法错误。由于解释特性，Python
    和类似的语言用于快速应用程序开发和程序原型设计。例如，可以在几小时内创建一个简单的程序，并在同一次访问期间展示给客户。程序员可以反复修改程序并快速查看结果。这允许他们尝试不同的想法，并查看哪种是最好的，而必在死胡同上花费大量时间。这也适用于创建图形用户界面（GUI）。在几分钟内就可以布局出简单的“草图”，因为
    Python 不仅有多种不同的 GUI 库可用，默认还包含了一个简单的库（`Tkinter`）。


    ### 作为面向对象编程 (OOP) 的 Python：


    Python 支持面向对象的编程风格，将代码封装在对象之中。Python 与其他语言不同之处在于，在开发程序时你有两个选择：过程化编程或面向对象。你可以在同一个程序中混合使用两者。


    过程化编程是开发程序的逐步过程。函数在需要时由程序调用以执行某些处理，然后将控制权返回给主程序。C 和 BASIC 是过程化语言。


    面向对象编程 (OOP) 意味着使用对象进行编程。对象由不同的编程逻辑单元创建；变量和方法组合成执行特定任务的对象。例如，如果你构建了一个机器人模型，身体的每个部分都是一个分离的对象，能够执行不同的事情，但仍然是对象的一部分。OOP
    也广泛用于 GUI 开发。


    ### 作为初学者语言的 Python：


    Python 提供了广泛的应用，从简单的文本处理到 WWW 浏览器以及游戏。对于初学者级程序员来说，这是一门很好的语言。


    ## Python 历史


    Guido van Rossum 是 Python 语言的开发者。它于 80 年代后期和 90 年代初在荷兰的数学和计算机科学国家研究所开发。他在指导其进展方面起了至关重要的作用。


    它是许多其他语言的结合，包括 ABC、Modula-3、C、C++、Algol-68、SmartTalk 以及 Unix shell 等脚本语言。它现在受版权保护，源代码在
    GNU 通用公共许可证 (GPL) 下可用。


    ## Python 的特性


    以下是 Python 编程的一些特性：


    ### 易于学习：


    它比其他语言容易学习得多。Python 的关键字很少，结构简单，便于制作和理解。它有清晰的语法，允许程序员快速上手这门语言。


    ### 易于阅读：


    它是一门高级语言，使用了许多英语单词。这就是为什么它比其他语言更容易阅读和理解。代码定义更清晰，肉眼可见。而且源代码非常易于维护。


    ### 标准库：


    Python 拥有大量用于编程的库。这些库在 UNIX、Windows 和 Macintosh 上都是通用且跨平台兼容的。


    ### 交互模式：


    Python 允许交互式模式，支持对代码段进行交互式测试和调试。


    ### 可移植：


    Python 在所有平台上都具有相同的接口，可以在各种硬件平台上运行。它是可移植的，这意味着它们可以在不进行修改的情况下在不同类型的计算机上运行。


    ### 可扩展：


    Python 的一个特性是可以向 Python 解释器添加低级模块。这些模块允许程序员添加或自定义他们的工具以提高效率。


    ### 数据库：


    Python 为程序员提供了所有主要商业数据库的接口。


    ### 图形用户界面 (GUI) 编程：


    Python 具有执行 GUI 的能力，可以创建并移植到许多系统调用、窗口系统（如 Windows MFC、Macintosh 和 Unix 的 X 窗口系统）以及库。


    ### 可扩展：


    Python 是一门非常庞大且进步的语言，与 shell 脚本相比，它可以为大型程序提供更好的结构和支持。


    Python 还有许多上述其他特性，部分如下：


    - 它可以编译为字节码以构建大型应用程序。

    - 支持 IT 功能、结构化编程方法和 OOP。

    - 编程语言最强大的特性之一是操作变量的能力。

    - 它支持自动垃圾收集。

    - 它能够与 C、C++、CORBA、ActiveX 和 JAVA 轻松集成。

    - 它提供了非常高级的动态类型并支持动态类型检查。


    ## Python 入门


    Python 被认为是解释型语言，因为 Python 程序是由解释器执行的。使用解释器有两种方法：交互式模式和脚本模式。在交互式模式下，你输入 Python
    程序，解释器显示结果：


    ```

    1+1

    2

    ```


    大于符号 `>>>` 是解释器用于指示它已就绪的提示符。如果你输入 `1+1`，解释器回复 `2`。或者，你可以将代码存储在文件中并使用解释器执行文件内容，这被称为脚本。惯例，Python
    脚本的文件以 `.py` 扩展名结尾。


    要执行脚本，你必须告诉解释器文件名。如果你有一个名为 `mywork.py` 的脚本并且在 UNIX 命令行窗口中工作，你输入 `python mywork.py`。在其他开发环境中，执行脚本的细节不同。你可以在
    Python 网站 `http://python.org/` 找到你环境的说明。


