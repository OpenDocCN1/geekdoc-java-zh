    变量是一个引用某个值的名称。它是一个你可以在其中放入某些东西的。。编程语言最强大的特性之一就是操作变量的能力。


    为了创建新变量，我们使用赋值运算符并给它们赋值：


    ```python

    result = ‘easily done’

    x = 88

    g = 9.8

    ```


    在上面的示例中，我们使用了三个变量。第一个将字符串赋值给名为 `result` 的新变量；第二个将整数 `88` 赋值给 `x`；第三个将重力加速度 `g`
    的赋值为 `9.8`。


    变量的类型就是它所引用的值的类型。


    ```python

    type(message)

    <type ''str''>


    type(n)

    <type ''int''>


    type(pi)

    <type ''float''>

    ```


    ## 变量命名规则：


    我们创建变量名遵循以下规则：


    -   它不能是关键字。

    -   除了下划线（`_`）之外没有特殊字符。

    -   变量名内部不允许有空格或空白。

    -   第一个字符必须是字母。

    -   它可以包含字母和数字。

    -   永远不要重复使用相同的名称。

    -   可以是大写，但变量名以小写字母开头是个好主。


    优秀的程序员会为他们的变量选择有意义的名称，并在程序中使用它们。


    如果你提供一个非法名称，你将得到语法错误。


    ```python

    20level = ''Final round''

    SyntaxError: invalid syntax


    good@ = 1000000

    SyntaxError: invalid syntax


    class = ''look good''

    SyntaxError: invalid syntax

    ```


    `20level` 是非法的，因为它不是以字母开头。`good@` 是非法的，因为它包含非法字符 `@`。但 `class` 有什么问题呢？事实证明 `class`
    是 Python 的关键字之一。解释器使用关键字来识别程序的结构，它们不能用作变量名。


    ## 关键字


    这些编程语言中已经解释了含义的单词。关键字不能用作变量名，因为如果我们这样做，就是在尝试给关键字分配新的含义，这是计算机不允许的。


    每个关键字都执行一个特定的任务。


    下表是 Python 编程中用到的一些关键字：


    | And | `del` | `from` |

    | `Not` | `while` | `as` |

    | `Assert` | `elif` | `global` |

    | `Or` | `with` | `else` |

    | `If` | `pass` | `yield` |

    | `Break` | `except` | `import` |

    | `Print` | `class` | `exec` |

    | `In` | `raise` | `continue` |

    | `Finally` | `is` | `return` |

    | `Def` | `lambda` | `for` |

    | `Try` | | |


    ## 运算符和操作数


    计算工作通过运算符执行加法和乘法。运算符应用于值被称为操作数。运算符是可以操作操作数值的构造结构。


    一些基本运算符是：


    1.  算术运算符

    2.  比较（关系）运算符

    3.  赋值运算符

    4.  逻辑运算符


    ## 算术运算符：


    有一些有用的算术运算符：


    | `+` | 加法 | `*` | 乘法 |

    | `-` | 减法 | `/` | 除法 |

    | `**` | 幂 | `%` | 取模 |

    | `//` | 整除 | | |


    如下例所示：


    ```python

    2+3     hour-1             hour*2+minute minute/30       2**5 (x+2)*(y-22)

    ```


    在 Python 中，没有必要声明。在其他语言中，你必须先声明再初始化，这两个步骤在同一行代码中完成。例如在 C++ 中


    ```cpp

    int a = 3; // 整数的内联初始化

    float b;

    b = 4.0 f ; // 浮点数的顺序初始化

    ```


    在这里你可以看到，先声明它是浮点数还是整数是关重要的。


    但在 Python 中这不是必须的，如果你用某个值初始化变量，它就会存储在那种类型中。正如在这个示例中：


    ```python

    a = 3 #integer

    b = 4.0 #floating point

    ```


    如你所，`a` 和 `b` 都是数字，但 Python 可以在不告知的情况下判断出它们是什么类型。在 C++ 示例中，一个浮点值必须被“声明”两次；首先给变量赋予类型（`float`），然后将实际值赋给变量。你还会注意到
    Python 中的注释是用井/磅符号（`#`）隔开，其用法与 C++ 或 Java 中的 `//` 注释完全一样。Python 中的数字就是这些了。


    在 Python 2 中，除法运算符可能不符合你的预期：


    ```python

    minute = 59

    minute/60

    0

    ```


    `minute` 的值为 59，在常规算术中 59 除以 60 等于 0.98333，而不是 0。差异的原因是 Python 正在执行整除 `//`。当两个操作数都是整数时，结果也是整数；整除会切掉小数部分，所以在这个示例中它向下取整为零。


    在 Python 3 中，此除法的结果是一个浮点数。新运算符 `//` 执行整除。如果任一操作数是浮点数，Python 将执行浮点除法。结果是一个浮点数：


    ```python

    minute//60.0.98333333333

    ```


    ## 比较（关系）运算符：


    这些运算符决定操作数之间的关系。


    | 运算符 | 描述 |

    | :--- | :--- |

    | `==` | 当两个值相等时 |

    | `!=` | 当两个值不等时 |

    | `>` | 用于大于 |

    | `<` | 用于小于 |

    | `>=` | 用于大于或等于 |

    | `<=` | 用于小于或等于 |


    ## 赋值运算符：


    在 Python 中我们使用赋值运算符。它们的描述如下：


    | 运算符 | 描述 |

    | :--- | :--- |

    | `=` | 从右侧赋值 |

    | `+=` | 将操作数相加并将结果赋左侧 |

    | `-=` | 从左侧减去右侧并将结果赋左侧 |

    | `*=` | 将操作数相乘并将结果赋左侧 |

    | `/=` | 将左侧除以右侧并将结果赋左侧 |

    | `**=` | 对左侧幂并将结果赋左侧 |

    | `%=` | 使用两个操作数取模并将结果赋左侧 |

    | `//=` | 对运算符应用整除并将结果赋左侧 |


    ## 逻辑运算符：


    Python 编程中使用了以下逻辑运算符：


    | 运算符 | 描述 |

    | :--- | :--- |

    | `and` | 仅当两个条件都满足时 |

    | `or` | 仅当一个条件真时 |

    | `not` | 用于反转结果 |


    ## 成员运算符：


    只有两个成员运算符。它们测试序列（如三元组、列表或字符串）中的成员身份。


    | 运算符 | 描述 |

    | :--- | :--- |

    | `in` | 仅当在序列中找到变量时为真 |

    | `not in` | 仅当不在序列中找到变量时为真 |


    ## 身份运算符：


    它们用于比较两个对象的内存位置。Python 中只有两个身份运算符：


    | 运算符 | 描述 |

    | :--- | :--- |

    | `is` | 如果两个变量是同一个对象则返回真 |

    | `is not` | 如果两个变量不是同一个对象则返回真 |

