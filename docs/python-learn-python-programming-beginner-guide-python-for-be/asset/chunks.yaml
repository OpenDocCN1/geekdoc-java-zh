    They are accessed just like strings (e.g. slicing and concatenation) so they are
    simple to use and they’re variable length, i.e. they grow and shrink automatically
    as they’re used. To access elements in list , use the square brackets. In reality,
    Python lists are C arrays inside the Python interpreter and act just like an array
    of pointers.


    Example:


    ```python

    list1 = [''June'', ''july'', 404, 808];

    list2 = [1, 2, 3, 4, 5, 6, 7 ];

    print "list1[0]: ", list1[0]

    print "list2[1:3]: ", list2[1:3]

    ```


    The biggest thing to remember is that lists are a series of objects written in
    side square brackets, separated by commas. Dictionaries and tuples will look similar
    except they have different types of brackets.


    The most common use of a list is to iterate over the list and perform the same
    action to  each object within the list, hence the use of similar data types.


    ## Adding Elements in List


    Adding new elements in a list is so easy. For this purpose we have `append` statement
    with which we can tell the list to add it.


    Example:


    ```python

    mylist = [20 , 22 , 24 ];

    mylist.append (26) ;

    print mylist own```


    To linked two list together, we have `extend()` statement. We can linked two lists
    together by using this statement.


    Example:


    ```python

    list1 = ["June", "July" ,"August"];

    list2 = [5 , 10 , 15 ];

    list1.extend(list2);

    print list1

    ```


    ## Remove Elements in List


    There are many ways to delete elements from a list. To delete a n element you
    can use either `del` statement and `pop` if you know exactly which element you
    are deleting or `remove` method if you don’t know.


    `pop` modifies the list and return the element that was removed after execution.


    Example:


    ```python

    list = [''a'', ''b'', ''c''];

    newlist = list.pop(1);

    print t

    ```


    `del` operator can be used if you don’t remove the value.


    Example:


    ```python

    list = [''a'', ''b'', ''c''];

    del list[1];

    print t

    ```


    if you don’t know the index of that element which desired to remove but know that
    element, you can use `remove` statement.


    Example:


    ```python

    list= [''a'', ''b'', ''c''];

    list.remove(''b'');

    print list

    ```


    ## List Operators


    Lists also perform `+` (concentration) and `*` (repetition) operators like string,
    but the result is is new list not a string.


    Lists performs all of the general operations we used on strings.


    | Expression | Output | Description |

    | :--- | :--- | :--- |

    | `[1 , 2 , 3 ]+[4, 5, 6]` | `[1, 2, 3, 4, 5, 6]` | Concentration |

    | `Len([1, 2, 3]),` | `3` | Length |

    | `3 in [1, 2, 3]` | `True` | Membership |

    | `[‘OK’]*4` | `[‘OK’ ,’OK’ , ‘OK’ , ‘OK’ ]` | Repetition |

    | `For x in [1, 2, 3]: print x,` | `1 2 3` | Iteration |


    ## Dictionaries


    Dictionaries are one of the most useful data type in Python. A dictionary is like
    a list but it has more general properties. In a list , the indices have to be
    integers but in dictionaries they can be almost any type. They are unordered collections
    of objects, matches to a keywords. List on the other hand, are ordered collections
    that use a numerical offset.


    Python dictionaries provide a mapping between a set of indices i.e keys and a
    set of values. Each key map to a value. The relation of key and a value is called
    a key-value pair or sometimes an item.


    ## Basic Properties of Dictionaries


    There are some properties of dictionaries:


    - It is not an offset and easily accessed by keyword. Its perform the same execution
    as associative arrays. All the items in dictionary have its own keyword; the keyword
    is used to call the item.

    - To provide faster lookup, the stored objects are in a random order. When created,
    a dictionary stores items in any order it chooses. To use the key, we get the
    item. There are no buit-in method in dictionaries to order the items, If you need
    to order do it yourself.

    - Dictionaries are variable length, can hold objects of any type ,and support
    deep nesting

    - They can’t be modified like lists or strings but can be mutable.

    - They are the only data type that support mapping.

    - Internally, dictionaries are implemented as a hash table.


