- fmt: '

    A variable is a name refer to the a value. It is a place where you can put a stuff
    in. One of the most powerful feature of programming languages is the ability to
    manipulate variables.


    For creation of new variable we use assignment operator and give them value:


    ```python

    result = ‘easily done’

    x = 88

    g = 9.8

    ```


    Above these examples we have use three variables. The first assign a string to
    a new variable named `result`; the second gives the integer `88` to `x` and the
    third assigns the value of gravitational acceleration `g` to `9.8`.


    The type of a variable is the type of the value it refers to.


    ```python

    type(message)

    <type ''str''>


    type(n)

    <type ''int''>


    type(pi)

    <type ''float''>

    ```


    ## Rules for variable name:


    We have some rules for creating a variable name are:


    - It is not a keyword.

    - No special character use except underscore (`_`).

    - No space or blanks are allowed within variable name.

    - First character must b alphabet.

    - It can be alpha-numeric.

    - Never use again same name.

    - It can be uppercase, but its good idea to begin variable name with a lowercase
    letters.


    A good programmer choose a meaningful name for their variables. Which he used
    in his program.


    If you give an illegal name , you get a syntax error.


    ```python

    20level = ''Final round''

    SyntaxError: invalid syntax


    good@ = 1000000

    SyntaxError: invalid syntax


    class = ''look good''

    SyntaxError: invalid syntax

    ```


    `20level` is illegal because it does not begin with a letter. `good@` is illegal
    because it contains an illegal character, `@`. But what’s wrong with `class`?
    It turns out that `class` is one of Python’s keywords. The interpreter uses keywords
    to recognize the structure of the program, and they cannot be used as variable
    names.


    ## Key Words


    These are the words whose meaning has already been explained in the programming
    language. Keywords cannot be used as variable names because if we do so we are
    trying to assign a new meaning to the keywords, which is not allowed by the computer.


    Every keyword perform a specific task.


    Some important keywords are below in the table which are used in the python programming:


    | And | `del` | `from` |

    | `Not` | `while` | `as` |

    | `Assert` | `elif` | `global` |

    | `Or` | `with` | `else` |

    | `If` | `pass` | `yield` |

    | `Break` | `except` | `import` |

    | `Print` | `class` | `exec` |

    | `In` | `raise` | `continue` |

    | `Finally` | `is` | `return` |

    | `Def` | `lambda` | `for` |

    | `Try` | | |


    ## Operators and Operands


    The computation work like addition and multiplication perform with operators.
    The values the operator is applied to are called operands. Operators are the construct
    which can manipulate the value of operands.


    Some basic operators are :


    1. Arithmetic Operators

    2. Comparison (Relational) Operators

    3. Assignment Operators

    4. Logical Operators


    ## Arithmetic Operators:


    There are useful arithmetic operators:


    | `+` | Additions | `*` | Multiplication |

    | `-` | Subtraction | `/` | Division |

    | `**` | Exponentiation | `%` | Modulus |

    | `//` | Floor Division | | |


    As in following example:


    ```python

    2+3     hour-1             hour*2+minute minute/30       2**5 (x+2)*(y-22)

    ```


    In Python , the declaration is not necessary. In other languages you must declare
    first then initialize and both steps done in same line of the code. For example
    in C++


    ```cpp

    int a = 3; //inline initialization of integer

    float b;

    b = 4.0 f ; //sequential initialization of floating point number

    ```


    In this you can see that it is essential to declare first either it is float or
    integer.


    But in Python Its not essential , if you initialize a variable with some value
    its store in that type. As you can see in this example:


    ```python

    a = 3 #integer

    b = 4.0 #floating point

    ```


    As you can see, `a` and `b` are both numbers but Python can figure out what type
    they are without being told. In the C++ example, a float value has to be “declared”
    twice; first the variable is given a type (`float`) then the actual value is given
    to the variable. You’ll also note that comments in Python are set off with a hash/pound
    sign (`#`) and are used exactly like the `//` comments in C++ or Java. That’s
    about it for numbers in Python.


    In Python 2, the division operator might not do what you expect:


    ```python

    minute = 59

    minute/60

    0

    ```


    The value of `minute` is 59, and in conventional arithmetic 59 divided by 60 is
    0.98333, not 0. The reason for the discrepancy is that Python is performing floor
    division `//`. When both of the operands are integers, the result is also an integer;
    floor division chops off the fraction part, so in this example it rounds down
    to zero.


    In Python 3, the result of this division is a float. The new operator `//` performs
    floor division. If either of the operands is a floating-point number, Python performs
    floating-point division, and the result is a float:


    ```python

    minute//60.0

    0.98333333333333328

    ```


    ## Comparison(Relational) Operators:


    These operators decide the relation between operands.


    | Operators | Description |

    | :--- | :--- |

    | `==` | This applied when two values are equal |

    | `!=` | This applied when two values are not equal |

    | `>` | This is used for greater than |

    | `<` | This is used for less than |

    | `>=` | This is used for greater than or equal |

    | `<=` | This is used for less than or equal |


    ## Assignment Operators:


    In Python we used some assignment operators. Their description given below:


    | Operators | Description |

    | :--- | :--- |

    | `=` | It assigns values from right. |

    | `+=` | It added up the operands and assign the result to left. |

    | `-=` | It subtracted right operand from left and assign to left. |

    | `*=` | It multiply both operands and assign the result to left. |

    | `/=` | It divides right operand with left and assign to left. |

    | `**=` | It make exponent to left and assign the result to left. |

    | `%=` | It takes modulus using two operands and assign to left. |

    | `//=` | Its applied floor division on operators and assign to left. |


    ## Logical Operators:


    There are following logical operators used in Python programming:


    | Operators | Description |

    | :--- | :--- |

    | `and` | It works only when both conditions satisfied. |

    | `or` | It works when only one condition true. |

    | `not` | Use to reverse the result. |


    ## Membership Operators:


    There are only two membership operators. They test the membership in a sequence
    such as triples, lists or strings.


    | Operators | Description |

    | :--- | :--- |

    | `in` | Only when true when it finds a variable in a specified sequence. |

    | `not on` | Only when true when it does not finds a variable in a specified sequence.
    |


    ## Identity Operators:


    They are use for comparing the memory locations of two objects. There is only
    two identity operators in Python:


    | Operators | Description |

    | :--- | :--- |

    | `is` | Returns true if both variables are the same object. |

    | `is not` | Returns true if both variables are not the same object. |

