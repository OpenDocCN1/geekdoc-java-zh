    ## Order of Operations


    When we use more than one operator in an expression, then the order of evaluation
    depends on the rules of priority. There is a priority order for mathematical operators.
    The priority order from top to bottom is:


    - Parentheses have the highest priority and can be used to force an expression
    to evaluate in the order you want. Examples: `3*(5+4)`, `(2**5)+2`. In first answer
    is `27` and in second `34`.

    - Exponentiation has the second highest priority. So `4**2+1` is `17` not `64`
    and `3*1**3` is `3` not `27`.

    - After Exponential Complement, unary plus and minus (`+` and `-`) have third
    highest priority.

    - Division, multiplication, modulus and floor division have the same priority
    order. So `2*3-1` is `5` not `4` and `6+4/8` is `8` not `5`.

    - Addition and subtraction have the same priority after division and multiplication.

    - `<<`, `>>` right and left bitwise shift.

    - `&` Bitwise ‘AND’.

    - `^`, `|` Bitwise exclusive “OR” and regular “OR”.

    - `<=`, `<`, `>`, `>=` Comparison Operators.

    - `<>`, `==`, `!=` Equality Operators.

    - `=`, `%=`, `/=`, `//=`, `-=`, `+=`, `*=`, `**=`=`

    - `is`, `is not` Identity Operators.

    - `in`, `not in` Membership Operators.

    - `not`, `or`, `and` Logical Operators.


    Operators with the same priority are evaluated from left to right. I don’t work
    hard to remember rules of precedence for other operators. If I can’t tell by looking
    at the expression, I use parentheses to make it obvious.


    ## Expressions and statements


    A combination of values, operator and variables are called expression. A value
    all by itself consider an expression, and so is a variable, so the following are
    all legal expressions:


    Example:

    `88`

    `X`

    `X+11`


    A statement is a unit of code that the Python interpreter can execute. We have
    seen two kinds of statement: `print` and assignment. Technically an expression
    is also a statement, but it is probably simpler to think of them as different
    things. The important difference is that an expression has a value; a statement
    does not.


    ## Interactive mode and Script mode


    One of the benefits of working with an interpreted language is that you can test
    bits of code in interactive mode before you put them in a script. But there are
    differences between interactive mode and script mode that can be confusing.


    For example, if you are using Python as a calculator, you might type:


    ```python

    >>> miles = 26.2

    >>> miles * 1.6

    42.182

    ```


    The first line assigns a value to `miles`, but it has no visible effect. The second
    line is an expression, so the interpreter evaluates it and displays the result.
    So we learn that a marathon is about 42 kilometers. But if you type the same code
    into a script and run it, you get no output at all. In script mode an expression,
    all by itself, has no visible effect. Python actually evaluates the expression,
    but it doesn’t display the value unless you tell it to:


    ```python

    miles = 26.2

    print miles * 1.61

    ```


    This behavior can be confusing at first. A script usually contains a sequence
    of statements. If there is more than one statement, the results appear one at
    a time as the statements execute.


    For example, the script:


    ```python

    print 100

    x = 55

    print 11

    ```


    produces the output:

    ```

    100

    11

    ```

    The assignment statement produces no output.


