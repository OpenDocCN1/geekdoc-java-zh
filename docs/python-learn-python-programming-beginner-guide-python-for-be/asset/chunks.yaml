    | :--- | :--- |

    | `is` | 如果操作符两边的变量指向同一个对象，则结果为真，否则为假。 |

    | `is not` | 如果操作符两边的变量指向同一个对象，则结果为假，否则为真。 |


    ## 运算顺序（优先级）


    当我们在一个表达式中使用多个运算符时，求值顺序取决于优先级规则。数学运算符有一套优先级顺序。从上到下的优先级顺序为：


    - 括号优先级最高，可以强制表达式按照你想要的顺序进行求值。示例：`3*(5+4)`、`(2**5)+2`。第一个结果是 `27`，第二个是 `34`。

    - 幂运算优先级次高。因此 `4**2+1` 是 `17` 而不是 `64`，`3*1**3` 是 `3` 而不是 `27`。

    - 在指数和补运算之后，一元加和减（`+` 和 `-`）具有第三高优先级。

    - 除法、乘法、取模和整除的优先级相同。因此 `2*3-1` 是 `5` 而不是 `4`，`6+4/8` 是 `8` 而不是 `5`。

    - 加法和减法在除法和乘法之后优先级相同。

    - `<<`、`>>` 右左移。

    - `&` 按位“与”。

    - `^`、`|` 按位“异或”和普通“或”。

    - `<=`, `<`, `>`, `>=` 比较运算符。

    - `<>`, `==`, `!=` 等等运算符。

    - `=`, `%=`, `/=`, `//=`, `-=`, `+=`, `*=`, `**=` `=`

    - `is`、`is not` 恒等运算符。

    - `in`、`not in` 成员运算符。

    - `not`、`or`、`and` 逻辑运算符。


    相同相同的运算符从左到右求值。我并不费力去记忆其他运算符的优先级规则。如果通过观察无法判断，我会使用括号让它一目了然。


    ## 表达式与语句


    值、运算符和变量的组合被称为表达式。单独的值被视为一个表达式，变量也是如此，因此以下都是合法的表达式：


    示例：

    `88`

    `X`

    `X+11`


    语句是 Python 解释器可以执行的代码单元。我们已经见过两种语句：`print` 和赋值。从技术上讲，表达式也是语句，但将它们视为不同的事物可能更简单。重要的区别在于表达式有值，而语句没有。


    ## 交互式模式与脚本模式


    使用解释型语言的优点之一是，可以在将代码放入脚本之前在交互式模式下测试代码片段。但交互式模式和脚本模式之间存在令人困惑的差异。


    例如，如果你将 Python 作为计算器使用，可能会输入：


    ```python

    >>> miles = 26.2

    >>> miles * 1.6

    42.182

    ```


    第一行给 `miles` 赋值了一个值，但它没有可见的影响。第二行是一个表达式，因此解释器对其求值并显示结果。所以我们学到了马拉松大约是 42 公里。但如果你将相同的代码输入脚本并运行，你将得没有任何输出。在脚本模式下，单独的表达式没有可见的影响。Python
    实际上会求值该表达式，但除非你告诉它，否则不会显示值：


    ```python

    miles = 26.2

    print miles * 1.61

    ```


    这种行为最初可能会令人困惑。脚本通常包含一系列语句。 如果有多个语句，结果将随着语句的执行逐个出现。


    例如，该脚本：


    ```python

    print 100

    x = 55

    print 11

    ```


    产生输出：

    ```

    100

    11

    ```

    赋值语句不产生输出。


    ## 字符串


    编程中的字符串简单就是文本，可以是单个字符、单词、短语或完整的句子。字符串是 Python 中最流行的类型之一。它们是编程时常用的元素之一，至少在与用户交互时是。因为它们如此常见，它们是
    Python 中的原生数据类型，这意味着它们内置了许多强大的功能。与其他语言不同，你不需要担心自己创建这些功能。这是好事，因为内置功能经过了多次测试，并针对性能和稳定性进行了优化。


    Python 中的字符串与大多数其他语言不同。我们可以简单地通过将字符括在引号中创建字符串。首先，没有字符类型，只有单字符字符串。字符串不能就地进行修改；每当你对它进行更改（如拼接）时，都会创建一个新的字符串对象。这意味着你必须意识到你并不是在操作内存中的字符串；在你处理它时，它不会被改变或删除。你只是每次都创建一个新字符串。创建字符串非常简单。例如：


    ```python

    num1 = ''Hello World''

    num2 = ''Basics''

    ```


    `num1` = ''Hello World'', `num2` = ''Basics''.


