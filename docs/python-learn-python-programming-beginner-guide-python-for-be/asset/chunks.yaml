    ```


    ## 在列表中删除元素


    有许多方法可以从列表中删除元素。要删除一个元素，可以使用 `del` 语句和 `pop`（如果你确切知道要删除的是哪个元素），或者在不知道的情况下使用 `remove`
    方法。


    `pop` 会修改列表并在执行后返回删除的元素。


    示例：


    ```python

    list = [''a'', ''b'', ''c''];

    newlist = list.pop(1);

    print t

    ```


    如果你不需要移除值，可以使用 `del` 运算符。


    示例：


    ```python

    list = [''a'', ''b'', ''c''];

    del list[1];

    print t

    ```


    如果你不知道想要删除的元素的索引但知道该元素本身，可以使用 `remove` 语句。


    示例：


    ```python

    list= [''a'', ''b'', ''c''];

    list.remove(''b'');

    print list

    ```


    ## 列表运算符


    列表也可以像字符串一样执行 `+`（拼接）和 `*`（重复）运算符，但结果是一个新列表而不是字符串。


    列表执行所有我们在字符串上用过的通用操作。


    | 表达式 | 输出 | 描述 |

    | :--- | :--- | :--- |

    | `[1 , 2 , 3 ]+[4, 5, 6]` | `[1, 2, 3, 4, 5, 6]` | 拼接 |

    | `Len([1, 2, 3]),` | `3` | 长度 |

    | `3 in [1, 2, 3]` | `True` | 成员关系 |

    | `[‘OK’]*4` | `[‘OK’ ,’OK’ , ‘OK’ , ‘OK’ ]` | 重复 |

    | `For x in [1, 2, 3]: print x,` | `1 2 3` | 迭代 |


    ## 字典


    字典是 Python 中最有用的数据类型之一。字典类似于列表，但它具有更通用的属性。在列表中，索引必须是整数，但在字典中，它们可以是几乎任何类型。它们是对象的无序集合，与关键字匹配。相比之下，列表是使用数值偏移的有序集合。


    Python 字典提供了索引集合（即键 keys）和值集合之间的映射。每个键都映射到一个值。键和值之间的关系被称为键值对，有时也称为一个项（item）。


    ## 字典的基本属性


    字典具有一些属性：


    - 它不是偏移量，可以通过关键字轻松访问。它的执行方式与关联数组相同。字典中的所有项都有其自己的关键字；关键字用于调用该项。

    - 为了提供更快的查找，存储的对象是随机顺序排列的。在创建时，字典以它选择的任何顺序存储项。使用键即可获取项。字典中没有内置方法对项排序，如果你需要排序，请自行处理。

    - 字典是变长的，可以包含任何类型的对象，并支持深度嵌套。

    - 它们不能像列表或字符串那样被修改，但它们是可变的（mutable）。

    - 它们是唯一支持映射的数据类型。

    - 在内部，字典实现为哈希表。


    ## 字典的基本操作


    现在我们有一个 Python 字典一些常用操作的列表：


    - `d1 = { }` 空字典。

    - `d2 = { ‘basic’ : 2, ‘Python’ : 3}` 两个元素的字典。

    - `d3 = { ‘June’ : { ‘July’ : 1 , ‘August’ : 2 } }` 嵌套。

    - `d2 [ ‘Python’ ] , d3[ ‘June’ ][ ‘July’ ]` 通过键索引。

    - `d2.has_key( ‘Python’`), `d2.keys( )`, `d2.values( )` 方法：成员测试、键列表、值列表等。

    - `len(d1)` 长度（存储的条目数）。

    - `d2 [key] = new`, `del d2[key]` 添加/删除。


