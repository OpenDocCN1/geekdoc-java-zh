    | ** | Exponentiation | % | Modulus |


    | // | Floor Division |  |  |


    As in following example:


    2+3      hour-1                            hour*2+minute              minute/30             
    2**5              (x+2)*(y-22)


    In Python , the declaration is not necessary. In other languages you must declare
    first then initialize and both steps done in same line of  the code. For example
    in C++


    int a = 3;     //inline initialization of integer


    float b;


    b = 4.0 f ;         //sequential initialization of floating point number


    In this you can see that it is essential to declare first either it is float or
    integer .


    But in Python Its not essential , if you initialize a variable with some value
    its store in that type. As you can see in this example:


    a = 3 #integer


    b = 4.0 #floating point


    As you can see, “a” and “b” are both numbers but Python can figure out what type
    they are without being told. In the C++ example, a float value has to be “declared”
    twice; first the variable is given a type (“float”) then the actual value is given
    to the variable. You’ll also note that comments in Python are set off with a hash/pound
    sign (#) and are used exactly like the “//” comments in C++ or Java. That’s about
    it for numbers in Python.


    In Python 2, the division operator might not do what you expect:


    minute = 59


    minute/60


    0


    The value of minute is 59,and in conventional arithmetic 59 divided by 60 is 0.98333,not
    0\. The reason for the discrepancy is that Python is performing floor division
    “//”. When both of the operands are integers, the result is also an integer; floor
    division chops off the fraction part, so in this example it rounds down to zero.


    In Python 3, the result of this division is a float. The new operator // performs
    floor division. If either of the operands is a floating-point number, Python performs
    floating-point division, and the result is a float:


    minute//60.0


    0.98333333333333328


    ## Comparison(Relational) Operators:


    These operators decide the relation among them and compare the values on either
    side of them.


    | Operators | Description |


    | == | This applied when two values are equal to each other |


    | != | This applied when two values are not equal to each other. |


    | > | This is used for greater than |


    | < | This is used for less than |


    | >= | This is used for greater than or equal to |


    | <= | This is used for less than or equal to |


    | <> | If two operands are not equal then it used as != |


    ## Assignment operators:


    In Python we used some assignment operators. Their description given in the table
    below:


    | Operators | Description |


    | = | It assigns values from right side operands to left side operand. |


    | +=(Add AND) | It added up the both operands and assign the value of result to
    left operand. |


    | -=(Subtract AND) | It subtracted right operand from left and assign result to
    left operand. |


    | *=(Multiply AND) | It multiply both operands and assign the result to left operand.
    |


    | /=(Divide AND) | It divides right operand with left and assign the result to
    left operand. |


    | **=(Exponent AND) | It make exponent to left operand on right and  assign the
    result to left operand. |


    | %=(Modulus AND) | It takes modulus using two operands and assign the result
    to left operand. |


    | //=(Floor Division AND) | Its applied floor division on operators and assign
    value to left operand. |


    ## Bitwise Operators:


    They perform bit by bit operations and works on bits.


    There are some Bitwise operators used in python:


    | Operators | Description |


    | & Binary AND | If both cases true than it exist |


    | &#124;Binary OR | If either one operand true it will exist |


    | ^ Binary XOR | It copies the bit if it exists in one operand but not both |


    | ~ Binary ones Complement | It has the effect of ‘flipping’ bits. |


    | << Binary left shift | The left operands value is moved left by the number of
    bits specified by the right operand. |


    | >> Binary right shift | The left operands value is moved right by the number
    of bits specified by the right operand. |


    Examples:


    Let consider if a = 60; and b = 13; Now in binary format they will be as follows
    −


    a = 0011 1100


    b = 0000 1101


    -----------------


    a&b = 0000 1100


    a|b = 0011 1101


    a^b = 0011 0001


    ~a  = 1100 0011


    ## Logical Operators:


    There are following logical operators used in Python programming:


    | Operators | Description |


    | and | It works only when both conditions satisfied. |


    | or | It works when only one condition true. |


    | not | Use to reverse the result. |


    ## Membership Operators:


    There are only two membership operators. They test the membership in a sequence
    such as triples, lists or strings.


    | Operators | Description |


    | in | Only when true when it finds a variable in a specified sequence. |


    | not on | Only when true when it does not finds a variable in a specified sequence.
    |


    ## Identity Operators:


    They are use for comparing the memory locations of two objects. There is only
    two identity operators in Python:


