  trans: "\n\n| `%E` | 指数计数法（使用大写 ‘E’） | `%f` | 浮点实数 |\n\n# Python 中的决策制定\n\n在日常生活中，我们经常根据条件做出决定。例如，如果我们有\
    \ $5，我们就买一个板板球拍，否则不买。这个例子说明，如果第一个条件为真，我们就可以继续操作；否则我们就执行其他任务。Python 在编程中为我们提供了这种条件语句来做出决策。决策结构评估多个产生真或假结果的表达式。在\
    \ Python 编程中，零和空值（null）被视为假，其他值均为真。\n\n在 Python 中，我们有以下类型的决策语句：\n\n## `if` 语句：\n\
    \n它类似于 C 语言。在 `if` 语句中，我们提供一些条件对数据进行比较并做出决策。如果满足条件，则执行语句。\n\n### 语法\n```\nif (condition)\n\
    \    statement\n```\n\n### 示例:\n```\nnum1 = 2\nif num1:\n    print “Expression\
    \ is true”\n    print num1\n\nnum2 = 0\nif num2:\n    print “Expression is False\
    \ ”\n    print num2\n\nprint “Its Over”\n```\n\n如果布尔表达式求值为真，则执行 `if` 语句内部的语句块。如果布尔表达式求值为假，则执行\
    \ `if` 语句结束后的后续代码。`if-statemnt` 可以写在一行中。\n\n### 示例:\n```\nnum = 1\nif ( num==\
    \ 1 ) : print \"one-line if\"\n```\n\n## `if-else` 语句：\n\n如果其语句的条件为假，则执行控制将跳转到\
    \ `if` 语句后的第一个语句。如果我们使用 `else` 语句，它会在 `if` 语句之后执行。`else` 语句与 `if` 语句结合使用。它是一个可选语句，大多数情况下在\
    \ `if-else` 语句块中使用一次。\n\n### 语法:\n```\nif (conditon):\n    statement\nelse:\n\
    \    statement\n```\n\n### 示例:\n```\nnum1 = 0\nif num1:\n    print \"Expression\
    \ is true\"\nelse:\n    print \"Expression is false\"\n```\n\n## `elif` 语句：\n\n\
    如果我们想检查多个表达式是否为真，并在其中一个条件求值为真时立即执行语句块，我们有 `elif` 语句来执行此类任务。\n\n它像 `else` 语句一样是可选的。我们在块中通常使用一个\
    \ `else` 语句，但可以有很多 `elif` 语句。\n\n### 语法:\n```\nif (condition1):\n    statement\n\
    elif(condition2):\n    statement\nelif(condition3):\n    statement\nelse:\n  \
    \  statement\n```\n\n它类似于其他语言中的 `switch case` 语句。\n\n### 示例:\n```\nnum = 1\nif\
    \ num == 2:\n    print \"True Expression 1\"\nelif num == 3:\n    print \"True\
    \ Expression 2\"\nelif num == 1:\n    print \"True Expression 3\"\nelif num ==\
    \ 1:\n    print \"True Expression 4\"\nelse:\n    print \"No one match!\"\n```\n\
    \n如果没有一个可以匹配真表达式，则将打印 `else` 语句。\n\n# 循环\n\n当我们需要多次执行某块代码时，我们在 Python 中使用循环。在编程语言中，有各种控制结构允许更复杂的路径。\n\
    \n简单的循环语句允许我们多次执行某块代码。\n\n为了处理循环需求，Python 提供了以下几种类型的循环：\n\n## `While` 循环：\n\n\
    如果给定的条件为真，`while` 循环会重复执行语句，直到它变为假。\n\n### 语法:\n```\nwhile (condition):\n    statement\n\
    \    increment\\decrement\n```\n\n首先，我们在 `while` 循环上方声明一个变量。然后在括号中给出条件。在条件中我们可能使用关系运算符。然后我们编写循环语句，如果语句为真，循环就会反复执行，直到为假为止。语句可以是单行的，也可以是语句块。在语句之后，我们在循环的末尾提到递增或递减。如果循环第一次执行，第二次执行将带有该递增或递减进行。这个过程一直持续到条件变为假为止。\n\
    \n### 示例:\n```\nvalue = 0\nwhile (value <5):\n    print ‘The value is:’, value\n\
    \    value= value +1\nprint “Its Over”\n```\n\n此块仅包含打印和递增语句，它在每个循环周期后将值增加 1。当值增加\
    \ 4 时，条件变为假，它停止工作。\n\n### 在 `While` 循环中使用 `else` 语句：\n\nPython 支持与 `While` 循环语句关联的\
    \ `else` 语句。如果在 `while` 循环在使用 `else` 语句，则在条件变为假时执行 `else` 语句。\n\n## `For` 循环：\n\
    \n`For` 循环具有遍历任何序列项的能力，例如列表或字符串。表达式列表首先被评估，如果序列包含其中任何一个项。然后序列中的第一个项被赋值给该变量。\n\n\
    ### 语法:\n```\nfor iterating_var in sequence:\n    statement\n```\n\n### 示例:\n\
    ```\nfor letter in ‘Python’:\n    print letter\n```\n\n### 在 for 中 `else` 语句：\n\
    \n在 Python 中我们可以使用 `else` 语句。当循环耗尽时，会执行 `else` 语句。\n\n## 循环嵌套：\n\n循环内部的循环被称为循环嵌套。Python\
    \ 允许循环嵌套。\n\n### For 循环语法:\n```\nfor iterating_var in sequence:\n    statement\n\
    ```\n\n### While 循环语法:\n```\nwhile(condition):\n    statements\n```\n\n## 控制语句：\n\
    \n为了改变普通循环执行，我们使用控制语句。在 Python 中有以下：\n\n### `Break` 语句：\n\n它的工作与 C 语言相同。它停止执行并跳出循环。用于\
    \ `for` 和 `while` 循环。\n\n### 语法:\n```\nbreak\n```\n\n### 示例:\n```\nfor letter\
    \ in ‘Python’:\n    if letter == ‘h’:\n        break\n    print ‘Current Letter\
    \ :’ letter\n```\n\n### `Continue` 语句：\n\n当循环中使用 `continue` 语句时，它会将控制返回循环开头。它不会执行当前迭代中的剩余语句，并将控制移回循环顶部。\n\
    \n### 语法:\n```\ncontinue\n```\n\n### 示例:\n```\nfor letter in ‘Python’:\n    if\
    \ letter == ‘o’:\n        continue\n    print ‘Current Letter :’ letter\n```\n\
    \n### `Pass` 语句：\n\n执行时什么都不会发生，它是一个空操作。它适用于那些最终会编写代码但尚未编写的地方。\n\n### 语法:\n```\n\
    pass\n```\n\n### 示例:\n```\nfor letter in ‘Python’:\n    if letter == ‘h’:\n  \
    \      pass\n    print ‘This is pass block’\n    print ‘Current Letter :’ letter\n\
    ```\n\n# 列表\n\n像字符串一样，列表是值的序列。Python 中最基本的数据结构是序列。序列中的每个元素都有自己的位置或索引。在字符串中我们只有字符值，但在列表中它们可以是任何类型。列表中的值称为元素或项。\n\
    \n创建列表非常简单，我们可以仅使用方括号创建列表。\n\n### 示例 1:\n```\nList1 = [10, 20, 30, 40]\n```\n\n\
    ### 示例 2:\n```\nList2 = [‘June’, ‘July’, ‘August’ ]\n```\n\n### 示例 3:\n```\nList3\
