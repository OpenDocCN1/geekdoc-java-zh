  trans: "\n\n![](img/cover.jpeg)\n\nCopyright © 2018\n\n版权所有。未经出版者书面许可，不得以任何形式或通过任何手段复制、传播或传输本书的任何部分，包括复印、录制或其他电子或机械方法，但法律允许的评论性引用以及某些其他非商业用途。\n\
    \n# 1. 引言\n\nLambda 存在于许多语言中。Lambda 是一种匿名函数（没有名字的），用于实现由函数式接口定义的函数。\n\nJava8 将\
    \ Lambda 引入了 Java。Lambda 表达式是一种不属于任何类的函数。如果 Java Lambda 表达式是一个对象，它可以被传递并按需执行（这允许我们以更简洁的方式传递逻辑）。`λ`\
    \ 是代表 Lambda 的符号。\n\n## 1.1. Lambda 语法\n\n### 1.1.1 通用语法\n\nLambda 表达式在 Java 中引入了箭头。它将\
    \ Lambda 表达式分为两个部分。左侧指定表达式所需的参数，如果没有参数，也可以为空。右侧是 Lambda 体，指定了 Lambda 表达式的动作：`(parameter1,\
    \ parameter2) -> {code}`\n\n下面的示例是一个带有 2 个参数的 Lambda，它将这些参数打印到控制台：\n\n```java\n\
    (int number, char) -> {System.out.println(number);}\n```\n\n### 1.1.2. 缩写\n\n\
    - Lambda 中的参数是可选的：\n  `(number, character) -> {System.out.println(number);}`\n\
    - 有 1 个参数的 Lambda => 括号是可选的：\n  `number -> {System.out.println(number);}`\n- 无参数的\
    \ Lambda => 括号是强制的：\n  `() -> {System.out.println(\"Hello World\");}`\n- 只有一个指令的\
    \ Lambda => 大括号是可选的：\n  `number -> System.out.println(number);`\n- 只有一个返回指令的 Lambda\
    \ => 关键字 return 是可选的：\n  `number -> number;`\n\n## 1.2 Lambda 是函数式接口的实现\n\n函数式接口是一个包含且只有一个抽象方法的接口。Java\
    \ 标准 `Runnable` 接口就是这样一个函数式接口。它定义了一个方法：`run()`。\n\n除了内置的函数式接口，我们还可以创建自己的函数式接口。下面的示例就是这样一个单方法接口：\n\
    \n```java\npublic interface EvenNumber {\n    boolean isEven(int number);\n}\n\
    ```\n\n在 Java7 中，你必须使用像这样的匿名接口实现：\n\n```java\nclass Main {\n    public static\
    \ void main(String[] args) {\n        EvenNumber myEvenNumber = new EvenNumber()\
    \ {\n            public boolean isEven(int number) {\n                return number\
    \ % 2 == 0;\n            }\n        };\n        System.out.println(myEvenNumber.isEven(7));\n\
    \    }\n}\n```\n\n在 Java8 中，你可以使用实现函数式接口的 Lambda 表达式：\n\n```java\nclass Main {\n\
    \    public static void main(String[] args) {\n        EvenNumber myEvenNumber\
    \ = number -> number % 2 == 0;\n        System.out.println(myEvenNumber.isEven(7));\n\
    \    }\n}\n```\n\n## 1.3 @Functional interface\n\n建议所有函数式接口都带有 `@FunctionalInterface`\
    \ 注解。这不仅能清晰地说明接口的目的，还允许编译器在标记接口不满足条件时生成错误。具有超过 1 个抽象方法的接口不再是函数式接口，并且无法用 Lambda\
    \ 实现。当接口标记了 `@FunctionalInterface` 注解且函数有超过 1 个抽象方法时，编译器将生成错误。\n\n```java\n@FunctionalInterface\n\
    public interface EvenNumber {\n    boolean isEven(int number);\n}\n```\n\n# 2.\
    \ Java 标准库与 lambda\n\n`comparator` 接口是一个函数式接口。它有 1 个抽象方法：`int compare(T object1,\
    \ T object2);`。\n\n你不需要写一个类来实现这个接口，可以写一个简短的 Lambda 作为接口的实现。\n\n```java\nclass\
    \ Main {\n    public static void main(String[] args) {\n        String[] fruits\
    \ = { \"apple\", \"cherries\", \"banana\", \"avocado\" };\n        Arrays.sort(fruits,\
    \ (fruit1, fruit2) -> -fruit1.compareTo(fruit2));\n        System.out.println(Arrays.toString(fruits));\n\
    \    }\n}\n```\n\n你可以使用每个单词的长度对水果进行排序。你只需要将 Lambda 表达式更改为：\n\n```java\nfruit1.length()\
    \ - fruit2.length()\n```\n\n# 3. Stream 和 forEach\n\n`Stream` 接口是 Java8 新引入的。流代表元素序列，并支持各种操作来对这些元素执行计算。Stream\
    \ 可以从各种数据源创建，如数组、列表、集合等……\n\n`Stream` 接口中的方法接受 Lambda 作为参数，这使得代码变得非常短且易读。\n\n\
    ## 3.1.1.foreach\n\n"
- fmt: "\n`forEach` iterates over a collection and performs the given action for each\
    \ element of the collection until all elements have been processed or the action\
    \ throws an exception. The example below will print each fruit to the console:\n\
    \n```java\nclass Main {\n    public static void main(String[] args) {\n      \
    \  String[] fruits = { \"apple\", \"cherries\", \"banana\", \"avocado\" };\n \
    \       Stream<String> stream = Arrays.stream(fruits);\n        stream.forEach(fruit\
    \ -> System.out.println(fruit));\n    }\n}\n```\n\nIt is possible to combine the\
    \ last two instructions into one:\n\n```java\nclass Main {\n    public static\
    \ void main(String[] args) {\n        String[] fruits = { \"apple\", \"cherries\"\
    , \"banana\", \"avocado\" };\n        Arrays.stream(fruits)\n        .forEach(fruit\
    \ -> System.out.println(fruit));\n    }\n}\n```\n\n## 3.2 Date sources of a stream\n\
    \n### 3.2.1 List\n\nA `List` can be a date source of a stream\n\n```java\nclass\
    \ Main {\n    public static void main(String[] args) {\n        List<String> fruits\
    \ = Arrays.asList(\"apple\", \"cherries\", \"banana\", \"avocado\");\n       \
    \ fruits.stream()\n        .forEach(fruit -> System.out.println(fruit));\n   \
    \ }\n}\n```\n\n### 3.2.2 Set\n\nA `Set` can be a date source of a stream\n\n```java\n\
    class Main {\n    public static void main(String[] args) {\n        Set<Integer>\
    \ numbers = new LinkedHashSet<>();\n        numbers.add(1);\n        numbers.add(3);\n\
    \        numbers.add(4);\n        numbers.add(7);\n        numbers.stream().forEach(getal\
    \ -> System.out.println(getal));\n    }\n}\n```\n\n### 3.2.3 Map\n\nThe `keySet`,\
    \ the `values` or the `entrySet` can be a date source of a stream. In the example\
    \ below we use an `entrySet`.\n\n```java\nclass Main {\n    public static void\
    \ main(String[] args) {\n        Map<String, String> languages = new LinkedHashMap<>();\n\
    \        languages.put(\"ENG\", \"English\"); \n        languages.put(\"FRE\"\
    , \"French\");  \n        languages.entrySet().stream()\n        .forEach(entry\
    \ -> System.out.println(entry.getKey() + ':' + entry.getValue()));  \n    }\n\
    }\n```\n\n## 3.3 String\n\nA `String` can be a date source of a stream. The values\
    \ in the stream are the characters of the `String`.\n\n```java\nclass Main {\n\
    \    public static void main(String[] args) {\n        \"Lambdafun\".chars()\n\
    \        .forEach(unicode->System.out.println((char) unicode)); \n    }\n}\n```\n\
    \n## 3.4 Files\n\nA file can be a date source of a stream. The values in the stream\
    \ are `Strings` that represent the lines in the file.\n\n```java\nclass Main {\n\
    \    private final static Path LANGUAGES_PATH = Paths.get(\"/data/languages.txt\"\
    );\n    public static void main(String[] args) {\n        try (Stream<String>\
    \ stream = Files.lines(LANGUAGES_PATH)) {\n            stream.forEach(line ->\
    \ System.out.println(line));\n        } catch (IOException ex) {\n           \
    \ ex.printStackTrace();\n        }\n    }\n}\n```\n\n## 3.5 Directory\n\nA `directory`\
    \ can be a date source of a stream. The values in the stream are the `paths` of\
    \ the files and the subdirectories in the directory.\n\n```java\nclass Main {\n\
    \    private final static Path DATA_PATH = Paths.get(\"/data\");\n    public static\
    \ void main(String[] args) {\n        try (Stream<Path> stream = Files.list(DATA_PATH))\
    \ {\n            stream.forEach(entry -> System.out.println(entry.getFileName()));\n\
    \        } catch (Exception ex) {\n            ex.printStackTrace();\n       \
    \ }\n    }\n}\n```\n\n## 3.6 Infinite sequence of values\n\nAn infinite sequence\
    \ of values can be a date source of a stream.\n\n```java\nclass Main {\n    public\
    \ static void main(String[] args) { \n        Stream.iterate(1, previousNumber\
    \ -> previousNumber + 2)\n        .forEach(oddNumber->System.out.println(oddNumber));\
    \  \n    }\n}\n```\n\nUse the method `limit()` if you want to limit the sequence:\n\
    \n```java\nclass Main {\n    public static void main(String[] args) { \n     \
    \   Stream.iterate(1, previousNumber -> previousNumber + 2)\n        .limit(10)\n\
    \        .forEach(oddNumber->System.out.println(oddNumber));  \n    }\n}\n```\n\
    \n## 3.7 Sequence of numbers\n\n```java\nclass Main {\n    public static void\
    \ main(String[] args) {\n        IntStream.rangeClosed(1, 10).forEach(number ->\
    \ System.out.println(number));\n        IntStream.range(1, 10).forEach(number\
    \ -> System.out.println(number));\n    }\n}\n```\n\n## 4. Filter\n\nSometimes\
    \ you might want to work with only a subset of the elements. To do so, you can\
    \ use the `filter` method.\n\nFor example if you want to create a subset of the\
    \ list with fruits, which contains only those strings whose length is more than\
    \ 6 characters, you use a `filter`:\n\n```java\nclass Main {\n    public static\
    \ void main(String[] args) {\n        Stream.of(\"apple\", \"cherries\", \"banana\"\
    , \"avocado\")\n        .filter(fruit -> fruit.length()>6)\n        .forEach(fruit\
    \ -> System.out.println(fruit));\n    }\n}\n```\n\n## 5. Sort\n\nYou can sort\
    \ the values in a stream with the stream-method `sorted()`\n\n```java\nclass Main\
    \ {\n    public static void main(String[] args) {\n        Stream.of(\"apple\"\
    , \"cherries\", \"banana\", \"avocado\")\n        .sorted()\n        .forEach(fruit\
    \ -> System.out.println(fruit));\n    }\n}\n```\n\nThis `sorted` method sorts\
    \ the stream with natural ordering. It is also possible to use a `Comparator`.\
    \ In the example below we sort by length:\n\n```java\nclass Main {\n    public\
    \ static void main(String[] args) {\n        Stream.of(\"apple\", \"cherries\"\
    , \"banana\", \"avocado\")\n        .sorted((fruit1, fruit2) -> fruit1.length()\
    \ - fruit2.length())\n        .forEach(fruit -> System.out.println(fruit));\n\
    \    }\n}\n```\n\n## 6. Combining operations\n\nSometimes you might want to combine\
    \ multiple operations. For example, you can `filter` and then `sort`:\n\n```java\n\
    class Main {\n    public static void main(String[] args) {\n        Stream.of(\"\
    apple\", \"cherries\", \"banana\", \"avocado\")\n        .filter(fruit -> fruit.length()>6)\n\
    \        .sorted()\n        .forEach(fruit -> System.out.println(fruit));\n  \
    \  }\n}\n```\n\n## 7. Unique values\n\nThe `distinct()` method returns the unique\
    \ elements of the stream.\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) {\n        Stream.of(\"apple\", \"cherries\", \"banana\", \"avocado\"\
    , \"apple\")\n        .distinct()\n        .forEach(fruit -> System.out.println(fruit));\n\
    \    }\n}\n```\n\n## 8. Transform\n\nAssume we now have a stream that we can transform,\
    \ say mapping strings. The `map` operation takes a function and returns something\
    \ else. In the example below we transform the strings to their lengths:\n\n```java\n\
    class Main {\n    public static void main(String[] args) {\n        Stream.of(\"\
    apple\", \"cherries\", \"banana\", \"avocado\")\n        .map(fruit -> fruit.length())\n\
    \        .forEach(length -> System.out.println(length));\n    }\n}\n```\n\n##\
    \ 9. Check if one or all values match with a predicate\n\n### 9.1 allMatch\n\n\
    The `allMatch` method returns true if all the values of the stream match the predicate.\
    \ We pass the predicate as an argument to the `allMatch()` method.\n\n```java\n\
    class Main {\n    public static void main(String[] args) {\n        System.out.println(\n\
    \            Stream.of(\"apple\", \"cherries\", \"banana\", \"avocado\")\n   \
    \         .allMatch(fruit -> fruit.length() > 5)\n        );\n    }\n}\n```\n\n\
    ### 9.2 anyMatch\n\nThe `anyMatch` method returns true if one of the values matches\
    \ the predicate.\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\n            Stream.of(\"apple\", \"cherries\"\
    , \"banana\", \"avocado\")\n            .anyMatch(fruit -> fruit.length() > 6)\n\
    \        );\n    }\n}\n```\n\n## 10. Collect Stream values\n\nIt is possible to\
    \ collect all the values of a stream in an array, list, set,…\n\n### 10.1 Array\n\
    \nTo convert a stream to an array we use the `toArray()` method. This method returns\
    \ an array containing the elements of the stream.\n\n```java\nclass Main {\n \
    \   public static void main(String[] args) {\n        Stream<String> stream =\
    \ Stream.of(\"apple\", \"cherries\", \"banana\", \"avocado\");\n        String[]\
    \ arr = stream.toArray(size -> new String[size]);\n        System.out.println(Arrays.toString(arr));\n\
    \    }\n}\n```\n\n### 10.2 List\n\nTo convert a stream to a List we use the `collect()`\
    \ method from stream objects. The `toList()` collector can be used for collecting\
    \ all Stream elements into a List instance.\n\n```java\nclass Main {\n    public\
    \ static void main(String[] args) {\n        List<String> list = Stream.of(\"\
    apple\", \"cherries\", \"banana\", \"avocado\")\n                            \
    \       .collect(Collectors.toList());\n        System.out.println(list);\n  \
    \  }\n}\n```\n"
  raw: "forEach iterates over a collection and performs the given action for each\
    \ element of the collection until all elements have been processed or the action\
    \ throws an exception. The example below will print each fruit to the console:\n\
    \nclass Main {\n\npublic  static  void main(String[] args) {\n\nString[] fruits\
    \ = { \"apple\", \"cherries\", \"banana\", \"avocado\" };\n\nStream<String> stream\
    \ = Arrays.stream(fruits);\n\nstream.forEach(fruit -> System.out.println(fruit));\n\
    \n}}\n\nIt is possible to combine the last two instructions into one:\n\nclass\
    \ Main {\n\npublic  static  void main(String[] args) {\n\nString[] fruits = {\
    \ \"apple\", \"cherries\", \"banana\", \"avocado\" };\n\nArrays.stream(fruits)\n\
    \n.forEach(fruit -> System.out.println(fruit));\n\n}}\n\n## 3.2 Date sources of\
    \ a stream\n\n### 3.2.1List\n\nA list can be a date source of a stream\n\nclass\
    \ Main {\n\npublic  static  void main(String[] args) {\n\nList<String> fruits\
    \ = Arrays.asList(\"apple\", \"cherries\", \"banana\", \"avocado\");\n\nfruits.stream()\n\
    \n.forEach(fruit -> System.out.println(fruit));\n\n}}\n\n### 3.2.2 Set\n\nA Set\
    \ can be a date source of a stream\n\nclass Main {\n\npublic  static  void main(String[]\
    \ args) {\n\nSet<Integer> numbers = new LinkedHashSet<>();\n\nnumbers.add(1);\n\
    \nnumbers.add(3);\n\nnumbers.add(4);\n\nnumbers.add(7);\n\nnumbers.stream().forEach(getal\
    \ -> System.out.println(getal));\n\n}}\n\n### 3.2.3 Map\n\nThe keySet, the values\
    \ or the entrySet can be a date source of a stream. In the example below we use\
    \ an entrySet.\n\nclass Main {\n\npublic  static  void main(String[] args) {\n\
    \nMap<String, String> languages = new LinkedHashMap<>();\n\nlanguages.put(\"ENG\"\
    , \"English\"); \n\nlanguages.put(\"FRE\", \"French\");  \n\nlanguages.entrySet().stream()\n\
    \n.forEach(entry -> System.out.println(entry.getKey() + ':' + entry.getValue()));  \
    \ }\n\n}\n\n## 3.3String\n\nA String can be a date source of a stream. The values\
    \ in the stream are the characters of the String.\n\nclass Main {\n\npublic  static\
    \  void main(String[] args) {\n\n \"Lambdafun\".chars()\n\n    .forEach(unicode->System.out.println((char)\
    \ unicode)); } }\n\n## 3.4 Files\n\nA file can be a date source of a stream. \
    \ The values in the stream are Strings that represent the lines in the file.\n\
    \nclass Main {\n\nprivate  final  static Path LANGUAGES_PATH = Paths.get(\"/data/languages.txt\"\
    );\n\npublic  static  void main(String[] args) {\n\ntry (Stream<String> stream\
    \ = Files.lines(LANGUAGES_PATH)) {\n\nstream.forEach(line -> System.out.println(line));\n\
    \n} catch (IOException ex) {\n\nex.printStackTrace();\n\n}}}\n\n## 3.5 Directory\n\
    \nA directory can be a date source of a stream.  The values in the stream are\
    \ the paths of the files and the subdirectories in the directory.\n\nclass Main\
    \ {\n\nprivate  final  static Path DATA_PATH = Paths.get(\"/data\");\n\npublic\
    \  static  void main(String[] args) {\n\ntry (Stream<Path> stream = Files.list(DATA_PATH))\
    \ {\n\nstream.forEach(entry -> System.out.println(entry.getFileName()));\n\n}\
    \ catch (Exception ex) {\n\nex.printStackTrace();\n\n}}}\n\n## 3.6Infinite sequence\
    \ of values\n\nAn infinite sequence of values can be a date source of a stream.\n\
    \nclass Main {\n\npublic  static  void main(String[] args) { \n\nStream.iterate(1,\
    \ previousNumber -> previousNumber + 2)\n\n.forEach(oddNumber->System.out.println(oddNumber));  \
    \ }\n\n}\n\nUse the method limit() if you want to limit the sequence:\n\nclass\
    \ Main {\n\npublic  static  void main(String[] args) { \n\nStream.iterate(1, previousNumber\
    \ -> previousNumber + 2)\n\n.limit(10)\n\n.forEach(oddNumber->System.out.println(oddNumber));  \
    \ }\n\n}\n\n## 3.7Sequence of numbers\n\nclass Main {\n\npublic  static  void\
    \ main(String[] args) {\n\nIntStream.rangeClosed(1, 10).forEach(number -> System.out.println(number));\n\
    \nIntStream.range(1, 10).forEach(number -> System.out.println(number));\n\n# 4.\
    \ Filter\n\nSometimes you might want to work with only a subset of the elements.\
    \ To do so, you can use the filter method.\n\nFor example if you want to create\
    \ a subset of the list with fruits, which contains only those strings whose length\
    \ is more than 6 characters, you use a filter:\n\nclass Main {\n\npublic  static\
    \  void main(String[] args) {\n\nStream.of(\"apple\", \"cherries\", \"banana\"\
    , \"avocado\")\n\n.filter(fruit -> fruit.length()>6)\n\n.forEach(fruit -> System.out.println(fruit));\n\
    \n}}\n\n# 5. Sort\n\nYou can sort the values in a stream with the stream-method\
    \ sorted()\n\nclass Main {\n\npublic  static  void main(String[] args) {\n\nStream.of(\"\
    apple\", \"cherries\", \"banana\", \"avocado\")\n\n.sorted()\n\n.forEach(fruit\
    \ -> System.out.println(fruit));\n\n}}\n\nThis method sorts the stream with natural\
    \ ordering.\n\nOrdering provided by Comparator is possible as well. This Comparator\
    \ can be instantiated using a Lambda expression. In the example below we will\
    \ order by length of each string:\n\nclass Main {\n\npublic  static  void main(String[]\
    \ args) {\n\nStream.of(\"apple\", \"cherries\", \"banana\", \"avocado\")\n\n.sorted((fruit1,\
    \ fruit2)-> fruit1.length() - fruit2.length())\n\n.forEach(fruit -> System.out.println(fruit));\n\
    \n}}\n\n# 6. Combining operations\n\nIn the example below we combine the filter,\
    \ sorted and forEach operations:\n\nclass Main {\n\npublic  static  void main(String[]\
    \ args) {\n\nStream.of(\"apple\", \"cherries\", \"banana\", \"avocado\")\n\n.filter(fruit\
    \ -> fruit.length()>5)\n\n.sorted()\n\n.forEach(fruit -> System.out.println(fruit));\n\
    \n}}\n\n# 7. Unique values\n\nThe Stream method distinct() returns the unique\
    \ values\n\nclass Main {\n\npublic  static  void main(String[] args) {\n\nStream.of(\"\
    apple\", \"cherries\", \"apple\", \"banana\", \"avocado\", \"apple\")\n\n.distinct()\n\
    \n.sorted()\n\n.forEach(fruit -> System.out.println(fruit));\n\n}}\n\n# 8. Transform\n\
    \nAssume we now have a filtered data that we can use for the real operations,\
    \ say transforming the objects. The map operations allows us to apply a function\
    \ that takes in a parameter of one type, and returns something else.\n\nIn the\
    \ example below we will transform the list of strings to a list of numbers (the\
    \ lengths of the strings)\n\nclass Main {\n\npublic  static  void main(String[]\
    \ args) {\n\nStream.of(\"apple\", \"cherries\", \"banana\", \"avocado\")\n\n.map(fruit\
    \ -> fruit.length())\n\n.forEach(fruit -> System.out.println(fruit));\n\n}}\n\n\
    We can also use this map method if we want to transform a list of objects to a\
    \ list of methods of that object. In the example below we get the surfaces of\
    \ the rectangles in the stream.\n\nclass Rectangle {\n\nprivate  final  int  length;\n\
    \nprivate  final  int  width; \n\nRectangle(int  length, int  width) {\n\nthis.length\
    \ = length;   \n\nthis.width = width; \n\n} \n\nint getSurface() {\n\nreturn \
    \ length * width; \n\n}\n\n}\n\nclass Main {\n\npublic  static  void main(String[]\
    \ args) { \n\nStream.of(new Rectangle(6, 2), new Rectangle(3, 1), new Rectangle(5,\
    \ 4))\n\n.map(rectangle -> rectangle.getSurface())\n\n.forEach(surface -> System.out.println(surface));}\
    \ }\n\n# 9. Check if one or all values match with a given predicate\n\n## 9.1AllMatch\n\
    \nThis method returns true if all the values of a stream match with the given\
    \ predicate. We pass the predicate as an argument to the allmatch() method.\n\n\
    class Main {\n\npublic  static  void main(String[] args) {\n\nSystem.out.println(\n\
    \nStream.of(\"apple\", \"cherries\", \"banana\", \"avocado\")\n\n.allMatch(fruit\
    \ -> fruit.length() == 6));\n\n}}\n\n## 9.2Anymatch\n\nThis method returns true\
    \ if one of the values matches with the given predicate\n\nclass Main {\n\npublic\
    \  static  void main(String[] args) {\n\nSystem.out.println(\n\nStream.of(\"apple\"\
    , \"cherries\", \"banana\", \"avocado\")\n\n.anyMatch(fruit -> fruit.length()\
    \ == 6));\n\n}}\n\n# 10.  Collect Stream values\n\nIt is possible to collect all\
    \ the values of a stream in an array, list, set,…\n\n## 10.1 Array\n\nTo convert\
    \ a stream to an array we use the toArray() method from stream objects. This method\
    \ returns an array containing the elements of the stream.\n\nclass Main {\n\n\
    public  static  void main(String[] args) {\n\nStream<String> stream = Stream.of(\"\
    apple\", \"cherries\", \"banana\", \"avocado\");\n\nString[] arr = stream.toArray(size\
    \ -> new String[size]);\n\nSystem.out.println(Arrays.toString(arr));\n\n}}\n\n\
    ## 10.2List\n\nTo convert a stream to a List we use the collect() method from\
    \ stream objects. The toList() collector can be used for collecting all Stream\
    \ elements into a List instance."
