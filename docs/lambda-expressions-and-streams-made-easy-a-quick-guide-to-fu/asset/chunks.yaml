    \n[10.6Stats on long values](#part0000_split_028.html__Toc518902994)\n\n[10.7Stats\
    \ on double values](#part0000_split_029.html__Toc518902995)\n\n[10.8 Min and max\
    \ of other valus](#part0000_split_030.html__Toc518902996)\n\n[11.Reduce](#part0000_split_031.html__Toc518902997)\n\
    \n[11.1 Stream.reduce() with Accumulator](#part0000_split_032.html__Toc518902998)\n\
    \n[11.2 Stream.reduce() with Identity and Accumulator](#part0000_split_033.html__Toc518902999)\n\
    \n[12Conclusion](#part0000_split_034.html__Toc518903000)\n\n# 1. Introduction\n\
    \nLambda’s exist in many coding languages. A Lambda is an anonymous function (function\
    \ without a name) and is used to implement a function defined by a functional\
    \ interface.\n\nJava8 introduces Lambda’s into Java. Lambda’s are Java’s first\
    \ steps into functional programming. A Java Lambda expression is a function which\
    \ can be created without belonging to any class. A Java Lambda expression can\
    \ be passed around as if it was an object and executed on demand (which allows\
    \ us to pass logic in a more compact way.)\n\nλ is the symbol that represents\
    \ a Lambda.\n\n## 1.1. Lambda syntax\n\n### 1.1.1. General syntax\n\nLambda expressions\
    \ introduce the arrow parameter into Java. It divides the lambda expression in\
    \ two parts. The left side specifies the parameters required by the expression\
    \ which could also be empty if no parameters are required. The right side is the\
    \ lambda body which specifies the actions of the lambda expression:\n\n(parameter1,\
    \ parameter2) -> {code of the function}\n\nThe example below is a Lambda with\
    \ 2 parameters that prints those parameters to the console:\n\n(int number, char\
    \ character) -> {System.out.println(number); System.out.println(character);}\n\
    \n### 1.1.2. Abbreviations \n\n*   Parameters are optional in a Lambda\n\n   \
    \ (number, character) -> {System.out.println(number); System.out.println(character);}\n\
    \n*   A Lambda that has 1 parameter => the parentheses are optional\n\n    number\
    \ -> {System.out.println(number);}\n\n*   A Lambda that hasn’t any parameters\
    \ => the parentheses are obliged\n\n    () -> {System.out.println(“Hello World”);}\n\
    \n*   A Lambda that has only one instruction => the curly brackets are optional\n\
    \n    number -> System.out.println(number);\n\n*   A Lambda that has only one\
    \ instruction that is a return-instruction => the keyword return is optional\n\
    \n    number -> number * number;\n\n## 1.2A Lambda is an implementation of a functional\
    \ interface\n\nA functional interface is an interface that contains one and only\
    \ one abstract method. The Java standard [Runnable interface](https://docs.oracle.com/javase/7/docs/api/java/lang/Runnable.html)\
    \ is such a functional interface. It defines one method: run().\n\nAside from\
    \ the built-in functional interfaces, we can create our own functional interfaces.\
    \ The example below is such a single method interface:\n\npublic  interface EvenNumber\
    \ {\n\nboolean isEven(int  number);\n\n}\n\nIn Java7 you would have to use an\
    \ anonymous interface implementation like this:\n\npublic  class  Main {\n\npublic\
    \  static  void main(String[] args) {\n\nEvenNumber myEvenNumber = new EvenNumber()\
    \ {\n\npublic  boolean isEven(int  number) {\n\nreturn  number % 2 == 0;\n\n}};\n\
    \nSystem.out.println(myEvenNumber.isEven(7));\n\n}}\n\nIn Java8 you can use a\
    \ Lambda expression that implements the functional interface:\n\npublic  class\
    \ Main {\n\npublic  static  void main(String[] args) {\n\nEvenNumber myEvenNumber\
    \ =\n\n number -> number % 2 == 0;\n\n System.out.println(myEvenNumber.isEven(7)); \n\
    \n } }\n\n## 1.3 @Functional interface\n\nAll functional interfaces are recommended\
    \ to have an informative  @FunctionalInterface  annotation. This not only clearly\
    \ communicates the purpose of this interface, but also allows a compiler to generate\
    \ an error if the annotated interface does not satisfy the conditions. An interface\
    \ that has more than 1 abstract method is no longer a functional interface and\
    \ cannot be  implemented with a Lambda. When the interface is annotated with the\
    \  @FunctionalInterface annotation and the function has more than 1 abstract method,\
    \ the compiler will generate an error.\n\n@FunctionalInterface\n\npublic  interface\
    \ EvenNumber {\n\nboolean isEven(int  number);\n\n}\n\n# 2. Java standard library\
    \ and lambda’s\n\nThe interface comparator is a functional interface. It has 1\
    \ abstract method:\n\nint compare(T object1, T object2);\n\nyou don’t need to\
    \ write a class to implement this interface, you can write a short lambda as implementation\
    \ of the interface.\n\nclass Main {\n\npublic  static  void main(String[] args)\
    \ {\n\nString[] fruits = { \"apple\", \"cherries\", \"banana\", \"avocado\" };\n\
    \nArrays.sort(fruits, (fruit1, fruit2) -> -fruit1.compareTo(fruit2));\n\nSystem.out.println(Arrays.toString(fruits));\n\
    \n}}\n\n You could also use the length of each word to sort the fruits. You just\
    \ need to change the lambda expression to:                           \n\nfruit1.length()\
    \ - fruit2.length()\n\n# 3. Stream and forEach\n\nThe interface Stream is new\
    \ in Java8\\. A stream represents a sequence of elements and supports different\
    \ kinds of operations to perform computations upon those elements. Streams can\
    \ be created from various data sources like an array, a list, a set,…\n\nThis\
    \ guide teaches you how to work with Java 8 streams and how to use the different\
    \ kinds of available stream operations like filter, map, reduce,…\n\nThe methods\
    \ in the Stream interface accept a Lambda as parameter, which makes the code very\
    \ short and readable.\n\n## 3.1.1. foreach"
