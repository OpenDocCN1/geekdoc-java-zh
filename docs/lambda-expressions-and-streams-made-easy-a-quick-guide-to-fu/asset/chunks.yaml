    , \"avocado\", \"cherries\").count());\n    }\n}\n```\n\n### 10.5.2 Sum\n\n返回\
    \ `IntStream` 的和\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) {\n        IntStream stream = IntStream.of(1, 3, 4, 7);\n        System.out.println(stream.sum());\n\
    \    }\n}\n```\n\n### 10.5.3 Min, max, average\n\n返回 `IntStream` 的最小值、最大值或平均值\n\
    \n```java\nclass Main {\n    public static void main(String[] args) {\n      \
    \  IntStream stream = IntStream.of(1, 3, 4, 7);\n        stream.min().ifPresent(smallest\
    \ -> System.out.println(smallest));\n    }\n}\n```\n\n## 10.6 Stats on long values\n\
    \n`LongStream` 接口是一个用于 long 类型值的流。方法与 `IntStream` 相同。可以使用 `mapToLong()` 方法将 `IntStream`\
    \ 转换为 `LongStream`。\n\n## 10.7 Stats on double values\n\n`DoubleStream` 接口是一个用于\
    \ double 类型值的流。方法与 `IntStream` 相同。可以使用 `mapToDouble()` 方法将 `IntStream` 转换为 `DoubleStream`。\n\
    \n## 10.8 Min and max of other values\n\n可以在 `min` 和 `max` 方法中传入 Lambda 表达式来确定哪些是最小值和最大值。该\
    \ lambda 将实现函数接口 `Comparator`。\n\n```java\nclass Main {\n    public static void\
