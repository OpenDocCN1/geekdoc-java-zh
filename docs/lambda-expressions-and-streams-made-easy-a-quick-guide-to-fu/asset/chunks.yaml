    ## 10.3 Set


    To convert a stream to a Set we use the collect() method from stream objects.
    The toSet() collector can be used for collecting all Stream elements into a Set
    instance.


    class Main {


    public  static  void main(String[] args) {


    System.out.println(


    Stream.of("apple", "cherries", "banana", "avocado")


    .sorted()


    .collect(Collectors.toSet()));


    }}


    ## 10.4Map


    In a map there is a key and a value. In the example below we will use the length
    of the strings as key and group all the fruits by length of their names.


    class Main {


    public  static  void main(String[] args) {


    Map<Integer, List<String>> fruitByLength =


    Stream.of("apple", "mango", "lemon", "avocado", "cherries")


    .collect(Collectors.groupingBy(fruit -> fruit.length()));


    fruitByLength.entrySet().stream()


    .forEach(entry -> {System.out.println(entry.getKey()); entry.getValue().stream()


    .forEach(fruit -> System.out.print(fruit + " "));


    System.out.println();});


    }}


    ## 10.5Stats


    ### 10.5.1Count


    Returns the number of values in a stream


    class Main {


    public  static  void main(String[] args) {


    System.out.println(


    Stream.of("apple", "mango", "lemon", "avocado", "cherries").count());


    }}


    ### 10.5.2Sum


    Returns the sum of an IntStream


    class Main {


    public  static  void main(String[] args) {


    IntStream stream = IntStream.of(1, 3, 4, 7);


    System.out.println(stream.sum());


    }}


    ### 10.5.3 Min, max, average


    Returns the min, max or average of an IntStream


    class Main {


    public  static  void main(String[] args) {


    IntStream stream = IntStream.of(1, 3, 4, 7);


    stream.min().ifPresent(smallest -> System.out.println(smallest));


    }}


    ## 10.6Stats on long values


    The interface LongStream is a stream for long values. The methods are the same
    as with the IntStream. It is possible to convert an IntStream to a LongStream
    with the method mapToLong()


    ## 10.7Stats on double values


    The interface DoubleStream is a stream for double values. The methods are the
    same as with the IntStream. It is possible to convert an IntStream to a DoubleStream
    with the method mapToDouble()


    ## 10.8 Min and max of other valus


    It is possible to give in a Lambda in the min and max methods to determine which
    are the min and max values. The lambda will implement the functional interface
    Comparator


    class Main {


    public  static  void main(String[] args) {


        Stream.of(BigDecimal.valueOf(1.1), BigDecimal.valueOf(0.9), BigDecimal.valueOf(0.5))  


        .min((number1, number2) -> number1.compareTo(number2))


        .ifPresent(smallest -> System.out.println(smallest));


        } }


    # 11. Reduce


    The methods min, sum, max,… all reduce the values of a stream to one single value.
    The method reduce() does the same thing, but this method is able to reduce any
    value to one single value (not only int, double, long values). It is a general-purpose
    reduction method.


    There are 2 versions of the reduce method :


    ## 11.1 Stream.reduce() with Accumulator


    It performs a reduction on the elements of the given stream, using given accumulation
    function.


    class Main {


    public  static  void main(String[] args) {


    System.out.println(Stream.of(BigDecimal.valueOf(1.1), BigDecimal.valueOf(0.9),
    BigDecimal.valueOf(0.5))


    .reduce(BigDecimal.ZERO, (previousSum, number) -> previousSum.add(number)));


    }}


    ## 11.2 Stream.reduce() with Identity and Accumulator


    It performs a reduction on the elements of the given stream, using given identity
    value, an accumulation function and combining functions. The identity value must
    be an identity for the combiner function. Combiner is a function which aggregates
    results of the accumulator. Combiner is called only in a parallel mode to reduce
    results of accumulators from different threads.


    class Main {


    public  static  void main(String[] args) {


    Stream.of(BigDecimal.valueOf(1.1), BigDecimal.valueOf(0.9), BigDecimal.valueOf(0.5))


    .reduce((previousSum, number) -> previousSum.add(number))


    .ifPresent(sum -> System.out.println(sum));


    }}


    # 12Conclusion


    Thank you for reading this short introduction to Lambda’s and streams in Java.
    This guide contains all the information you need to start using Lambda’s yourself.
    Hopefully you learned a lot and feel ready to start integrating Lamdba’s into
    your code. If you have any questions you can contact me at [programming_made_easy@outlook.be](mailto:programming_made_easy@outlook.be)


    Good luck and have fun!'
