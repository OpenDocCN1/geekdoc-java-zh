    \        .ifPresent(smallest -> System.out.println(smallest));\n    }\n}\n```\n\
    \n# 11. Reduce\n\n`min`、`sum`、`max`… 等方法都将流的值归约为单个值。`reduce()` 方法执行相同的操作，但该方法能够将任何值归约为单个值（而不只是\
    \ `int`、`double`、`long` 值）。它是一个通用的归约方法。\n\n`reduce` 方法有两个版本：\n\n## 11.1 Stream.reduce()\
    \ with Accumulator\n\n使用给定的累加函数对给定流的元素执行归约。\n\n```java\nclass Main {\n    public\
    \ static void main(String[] args) {\n        System.out.println(Stream.of(BigDecimal.valueOf(1.1),\
    \ BigDecimal.valueOf(0.9), BigDecimal.valueOf(0.5))\n        .reduce(BigDecimal.ZERO,\
    \ (previousSum, number) -> previousSum.add(number)));\n    }\n}\n```\n\n## 11.2\
    \ Stream.reduce() with Identity and Accumulator\n\n使用给定的标识值（identity）、累加函数和组合函数对给定流的元素执行归约。标识值必须是\
    \ `combiner` 函数的恒元。`Combiner` 是聚合累加器结果的函数。`Combiner` 仅在并行模式下调用，用于减少来自不同线程的累加器结果。\n\
