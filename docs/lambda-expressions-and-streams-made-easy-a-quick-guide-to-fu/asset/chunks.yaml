  trans: "\n\n`forEach` 遍历集合并对集合中的每个元素执行指定的操作，直到所有元素都处理完毕或操作抛出异常。下面的示例将把每种水果打印到控制台：\n\
    \n```java\nclass Main {\n    public static void main(String[] args) {\n      \
    \  String[] fruits = { \"apple\", \"cherries\", \"banana\", \"avocado\" };\n \
    \       Stream<String> stream = Arrays.stream(fruits);\n        stream.forEach(fruit\
    \ -> System.out.println(fruit));\n    }\n}\n```\n\n可以将最后两条指令合并为一条：\n\n```java\n\
    class Main {\n    public static void main(String[] args) {\n        String[] fruits\
    \ = { \"apple\", \"cherries\", \"banana\", \"avocado\" };\n        Arrays.stream(fruits)\n\
    \        .forEach(fruit -> System.out.println(fruit));\n    }\n}\n```\n\n## 3.2\
    \ 流的数据源\n\n### 3.2.1 List\n\n`List` 可以作为流的数据源\n\n```java\nclass Main {\n    public\
    \ static void main(String[] args) {\n        List<String> fruits = Arrays.asList(\"\
    apple\", \"cherries\", \"banana\", \"avocado\");\n        fruits.stream()\n  \
    \      .forEach(fruit -> System.out.println(fruit));\n    }\n}\n```\n\n### 3.2.2\
    \ Set\n\n`Set` 可以作为流的数据源\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) {\n        Set<Integer> numbers = new LinkedHashSet<>();\n        numbers.add(1);\n\
    \        numbers.add(3);\n        numbers.add(4);\n        numbers.add(7);\n \
    \       numbers.stream().forEach(getal -> System.out.println(getal));\n    }\n\
    }\n```\n\n### 3.2.3 Map\n\n`keySet`、`values` 或 `entrySet` 可以作为流的数据源。在下面的示例中，我们使用了\
    \ `entrySet`。\n\n```java\nclass Main {\n    public static void main(String[] args)\
    \ {\n        Map<String, String> languages = new LinkedHashMap<>();\n        languages.put(\"\
    ENG\", \"English\"); \n        languages.put(\"FRE\", \"French\");  \n       \
    \ languages.entrySet().stream\n        .forEach(entry -> System.out.println(entry.getKey()\
    \ + ':' + entry.getValue()));  \n    }\n}\n```\n\n## 3.3 String\n\n`String` 可以作为流的数据源。流中的值是\
    \ `String` 的字符。\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) {\n        \"Lambdafun\".chars()\n        .forEach(unicode->System.out.println((char)\
    \ unicode)); \n    }\n}\n```\n\n## 3.4 Files\n\n文件可以作为流的数据源。流中的值是代表文件行的 `Strings`。\n\
    \n```java\nclass Main {\n    private final static Path LANGUAGES_PATH = Paths.get(\"\
    /data/languages.txt\");\n    public static void main(String[] args) {\n      \
    \  try (Stream<String> stream = Files.lines(LANGUAGES_PATH)) {\n            stream.forEach(line\
    \ -> System.out.println(line));\n        } catch (IOException ex) {\n        \
    \    ex.printStackTrace();\n        }\n    }\n}\n```\n\n## 3.5 Directory\n\n目录（`directory`）可以作为流的数据源。流中的值是该目录下的文件和子目录的\
    \ `paths`。\n\n```java\nclass Main {\n    private final static Path DATA_PATH =\
    \ Paths.get(\"/data\");\n    public static void main(String[] args) {\n      \
    \  try (Stream<Path> stream = Files.list(DATA_PATH)) {\n            stream.forEach(entry\
    \ -> System.out.println(entry.getFileName()));\n        } catch (Exception ex)\
    \ {\n            ex.printStackTrace();\n        }\n    }\n}\n```\n\n## 3.6 无限值序列\n\
    \n无限值序列可以作为流的数据源。\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) { \n        Stream.iterate(1, previousNumber -> previousNumber + 2)\n\
    \        .forEach(oddNumber->System.out.println(oddNumber));  \n    }\n}\n```\n\
    \n如果你想限制序列，请使用 `limit()` 方法：\n\n```java\nclass Main {\n    public static void\
    \ main(String[] args) { \n        Stream.iterate(1, previousNumber -> previousNumber\
    \ + 2)\n        .limit(10)\n        .forEach(oddNumber->System.out.println(oddNumber));\
    \  \n    }\n}\n```\n\n## 3.7 数字序列\n\n```java\nclass Main {\n    public static\
    \ void main(String[] args) {\n        IntStream.rangeClosed(1, 10).forEach(number\
    \ -> System.out.println(number));\n        IntStream.range(1, 10).forEach(number\
    \ -> System.out.println(number));\n    }\n}\n```\n\n## 4. Filter\n\n有时你可能只想处理元素的子集。要实现这一点，你可以使用\
    \ `filter` 方法。\n\n例如，如果你想创建一个水果列表子集，其中包含长度大于 6 个字符的字符串，你可以使用 `filter`：\n\n```java\n\
    class Main {\n    public static void main(String[] args) {\n        // 示例逻辑\n\
    \    }\n}\n```\n\n## 5. Sort\n\n你可以使用 `sorted` 方法对流中的值进行排序。\n\n## 6. 操作组合\n\n\
    有时你可能想组合多个操作。例如 `filter` 然后再 `sort`：\n\n## 7. Unique values\n\n`distinct()` 方法返回流中的唯一元素。\n\
    \n## 8. Transform\n\n假设我们现在有一个可以转换的流，例如映射字符串。`map` 操作接收一个函数并返回其他内容。在下面的示例中，我们将字符串转换为长度：\n\
    \n## 9. 检测所有值是否匹配谓词\n\n### 9.1 allMatch\n\n`allMatch` 方法在流中的所有值都匹配谓词时返回 true。我们将谓词作为\
    \ `allMatch()` 方法的参数。\n\n### 9.2 anyMatch\n\n`anyMatch` 方法在任意一个值匹配谓词时返回 true。\n\
    \n## 10. Collect 流值\n\n可以将流的所有值收集到数组、列表、集合等\n\n### 10.1 Array\n\n将流转换为数组需要使用 `toArray()`\
    \ 方法。该方法返回一个包含流元素的数组。\n\n### 10.2 List\n\n将流转换为列表需要使用流对象的 `collect()` 方法。`toList()`\
    \ 收集器可将所有流元素收集到 List 实例中。\n\n"
- fmt: "\n```java\nclass Main {\n    public static void main(String[] args) {\n  \
    \      System.out.println(\n            Stream.of(\"apple\", \"cherries\", \"\
    banana\", \"avocado\")\n            .sorted()\n            .collect(Collectors.toList()));\n\
    \    }\n}\n```\n\n## 10.3 Set\n\nTo convert a stream to a `Set` we use the `collect()`\
    \ method from stream objects. The `toSet()` collector can be used for collecting\
    \ all `Stream` elements into a `Set` instance.\n\n```java\nclass Main {\n    public\
    \ static void main(String[] args) {\n        System.out.println(\n           \
    \ Stream.of(\"apple\", \"cherries\", \"banana\", \"avocado\")\n            .collect(Collectors.toSet()));\n\
    \    }\n}\n```\n\n## 10.4 Map\n\nIn a map there is a key and a value. In the example\
    \ below we will use the length of the strings as key and group all the fruits\
    \ by length of their names.\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) {\n        Map<Integer, List<String>> fruitByLength =\n            Stream.of(\"\
    apple\", \"mango\", \"lemon\", \"avocado\", \"cherries\")\n            .collect(Collectors.groupingBy(fruit\
    \ -> fruit.length()));\n        fruitByLength.entrySet().stream()\n          \
    \  .forEach(entry -> {\n                System.out.println(entry.getKey());\n\
    \                entry.getValue().stream()\n                .forEach(fruit ->\
    \ System.out.print(fruit + \" \"));\n                System.out.println();\n \
    \           });\n    }\n}\n```\n\n## 10.5 Stats\n\n### 10.5.1 Count\n\nReturns\
    \ the number of values in a stream\n\n```java\nclass Main {\n    public static\
    \ void main(String[] args) {\n        System.out.println(\n            Stream.of(\"\
    apple\", \"mango\", \"lemon\", \"avocado\", \"cherries\").count());\n    }\n}\n\
    ```\n\n### 10.5.2 Sum\n\nReturns the sum of an `IntStream`\n\n```java\nclass Main\
    \ {\n    public static void main(String[] args) {\n        IntStream stream =\
    \ IntStream.of(1, 3, 4, 7);\n        System.out.println(stream.sum());\n    }\n\
    }\n```\n\n### 10.5.3 Min, max, average\n\nReturns the min, max or average of an\
    \ `IntStream`\n\n```java\nclass Main {\n    public static void main(String[] args)\
    \ {\n        IntStream stream = IntStream.of(1, 3, 4, 7);\n        stream.min().ifPresent(smallest\
    \ -> System.out.println(smallest));\n    }\n}\n```\n\n## 10.6 Stats on long values\n\
    \nThe interface `LongStream` is a stream for long values. The methods are the\
    \ same as with the `IntStream`. It is possible to convert an `IntStream` to a\
    \ `LongStream` with the method `mapToLong()`.\n\n## 10.7 Stats on double values\n\
    \nThe interface `DoubleStream` is a stream for double values. The methods are\
    \ the same as with the `IntStream`. It is possible to convert an `IntStream` to\
    \ a `DoubleStream` with the method `mapToDouble()`.\n\n## 10.8 Min and max of\
    \ other values\n\nIt is possible to give in a Lambda in the `min` and `max` methods\
    \ to determine which are the min and max values. The lambda will implement the\
    \ functional interface `Comparator`\n\n```java\nclass Main {\n    public static\
    \ void main(String[] args) {\n        Stream.of(BigDecimal.valueOf(1.1), BigDecimal.valueOf(0.9),\
    \ BigDecimal.valueOf(0.5))\n        .min((number1, number2) -> number1.compareTo(number2))\n\
    \        .ifPresent(smallest -> System.out.println(smallest));\n    }\n}\n```\n\
    \n# 11. Reduce\n\nThe methods `min`, `sum`, `max`,… all reduce the values of a\
    \ stream to one single value. The method `reduce()` does the same thing, but this\
    \ method is able to reduce any value to one single value (not only `int`, `double`,\
    \ `long` values). It is a general-purpose reduction method.\n\nThere are 2 versions\
    \ of the `reduce` method:\n\n## 11.1 Stream.reduce() with Accumulator\n\nIt performs\
    \ a reduction on the elements of the given stream, using given accumulation function.\n\
    \n```java\nclass Main {\n    public static void main(String[] args) {\n      \
    \  System.out.println(Stream.of(BigDecimal.valueOf(1.1), BigDecimal.valueOf(0.9),\
    \ BigDecimal.valueOf(0.5))\n        .reduce(BigDecimal.ZERO, (previousSum, number)\
    \ -> previousSum.add(number)));\n    }\n}\n```\n\n## 11.2 Stream.reduce() with\
    \ Identity and Accumulator\n\nIt performs a reduction on the elements of the given\
    \ stream, using given identity value, an accumulation function and combining functions.\
    \ The identity value must be an identity for the `combiner` function. `Combiner`\
    \ is a function which aggregates results of the accumulator. `Combiner` is called\
    \ only in a parallel mode to reduce results of accumulators from different threads.\n\
    \n```java\nclass Main {\n    public static void main(String[] args) {\n      \
    \  Stream.of(BigDecimal.valueOf(1.1), BigDecimal.valueOf(0.9), BigDecimal.valueOf(0.5))\n\
    \        .reduce((previousSum, number) -> previousSum.add(number))\n        .ifPresent(sum\
    \ -> System.out.println(sum));\n    }\n}\n```\n\n# 12. Conclusion\n\nThank you\
    \ for reading this short introduction to Lambda’s and streams in Java. This guide\
    \ contains all the information you need to start using Lambda’s yourself. Hopefully\
    \ you learned a lot and feel ready to start integrating Lamdba’s into your code.\
    \ If you have any questions you can contact me at `programming_made_easy@outlook.be`.\n\
    \nGood luck and have fun!\n"
