- fmt: "\n![](cover.jpeg)\n\nCopyright © 2018\n\nAll rights reserved. No part of this\
    \ publication may be reproduced, distributed, or transmitted in any form or by\
    \ any means, including photocopying, recording, or other electronic or mechanical\
    \ methods, without the prior written permission of the publisher, except in the\
    \ case of brief quotations embodied in critical reviews and certain other noncommercial\
    \ uses permitted by copyright law.\n\n# 1. Introduction\n\nLambda exist in many\
    \ languages. A Lambda is an anonymous function (function without a name) and is\
    \ used to implement a function defined by a functional interface.\n\nJava8 introduces\
    \ Lambda into Java. A Lambda expression is a function which can be created without\
    \ belonging to any class. A Java Lambda expression can be passed around if it\
    \ was an object and executed on demand (which allows us to pass logic in a more\
    \ compact way.) `λ` is the symbol that represents a Lambda.\n\n## 1.1. Lambda\
    \ syntax\n\n### 1.1.1. General syntax\n\nLambda expressions introduce arrow into\
    \ Java. It divides the lambda expression in two parts. The left side specifies\
    \ the parameters required by the expression which could also be empty if no parameters\
    \ are required. The right side is the lambda body which specifies the actions\
    \ of the lambda expression: `(parameter1, parameter2) -> {code}`\n\nThe example\
    \ below is a Lambda with 2 parameters that prints those parameters to the console:\n\
    \n```java\n(int number, char) -> {System.out.println(number);}\n```\n\n### 1.1.2.\
    \ Abbreviations\n\n- Parameters are optional in a Lambda:\n  `(number, character)\
    \ -> {System.out.println(number);}`\n- A Lambda that has 1 parameter => the parentheses\
    \ are optional:\n  `number -> {System.out.println(number);}`\n- A Lambda that\
    \ hasn’t any parameters => the parentheses are obliged:\n  `() -> {System.out.println(\"\
    Hello World\");}`\n- A Lambda that has only one instruction => the curly brackets\
    \ are optional:\n  `number -> System.out.println(number);`\n- A Lambda that has\
    \ only one instruction that is a return-instruction => the keyword return is optional:\n\
    \  `number -> number;`\n\n## 1.2 Lambda is an implementation of a functional interface\n\
    \nA functional interface is an interface that contains one and only one abstract\
    \ method. The Java standard `Runnable` interface is such a functional interface.\
    \ It defines one method: `run()`.\n\nAside from the built-in functional interfaces,\
    \ we can create our own functional interfaces. The example below is such a single\
    \ method interface:\n\n```java\npublic interface EvenNumber {\n    boolean isEven(int\
    \ number);\n}\n```\n\nIn Java7 you would have to use an anonymous interface implementation\
    \ like this:\n\n```java\nclass Main {\n    public static void main(String[] args)\
    \ {\n        EvenNumber myEvenNumber = new EvenNumber() {\n            public\
    \ boolean isEven(int number) {\n                return number % 2 == 0;\n    \
    \        }\n        };\n        System.out.println(myEvenNumber.isEven(7));\n\
    \    }\n}\n```\n\nIn Java8 you can use a Lambda expression that implements the\
    \ functional interface:\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) {\n        EvenNumber myEvenNumber = number -> number % 2 == 0;\n    \
    \    System.out.println(myEvenNumber.isEven(7));\n    }\n}\n```\n\n## 1.3 @Functional\
    \ interface\n\nAll functional interfaces are recommended to have an informative\
    \ `@FunctionalInterface` annotation. This not only clearly communicates the purpose\
    \ of this interface, but also allows a compiler to generate an error if the annotated\
    \ interface does not satisfy the conditions. An interface that has more than 1\
    \ abstract method is no longer a functional interface and cannot be implemented\
    \ with a Lambda. When the interface is annotated with the `@FunctionalInterface`\
    \ annotation and the function has more than 1 abstract method, the compiler will\
    \ generate an error.\n\n```java\n@FunctionalInterface\npublic interface EvenNumber\
    \ {\n    boolean isEven(int number);\n}\n```\n\n# 2. Java standard library and\
    \ lambda’s\n\nThe interface `comparator` is a functional interface. It has 1 abstract\
    \ method: `int compare(T object1, T object2);`.\n\nYou don’t need to write a class\
    \ to implement this interface, you can write a short lambda as implementation\
    \ of the interface.\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) {\n        String[] fruits = { \"apple\", \"cherries\", \"banana\", \"\
    avocado\" };\n        Arrays.sort(fruits, (fruit1, fruit2) -> -fruit1.compareTo(fruit2));\n\
    \        System.out.println(Arrays.toString(fruits));\n    }\n}\n```\n\nYou could\
    \ also use the length of each word to sort the fruits. You just need to change\
    \ the lambda expression to:\n\n```java\nfruit1.length() - fruit2.length()\n```\n\
    \n# 3. Stream and forEach\n\nThe interface `Stream` is new in Java8\\. A stream\
    \ represents a sequence of elements and supports different kinds of operations\
    \ to perform computations upon those elements. Streams can be created from various\
    \ data sources like an array, a list, a set,…\n\nThe methods in the `Stream` interface\
    \ accept a Lambda as parameter, which makes the code very short and readable.\n\
    \n## 3.1.1.foreach\n"
