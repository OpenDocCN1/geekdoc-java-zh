    “快速解析和理解错误信息将为你节省大量时间，并让你事半功倍。你尝试过解决问题的事实，会让向你寻求帮助的人倍胜有加。”

    —— Jack Franklin，《Beginning jQuery》作者


    Jack 还建议初学者起初尝试自己解决问题。当在调试时遇到瓶颈时，`React` 的共同贡献者 Lee Byron 会通过大量使用调试工具，亲自尝试理解发生了什么。


    一旦我准确地理解了发生了什么——一步步地跟进——那么我就可以将其与我预期的结果进行对比，孤出意料之外的部分，并看看我的假设哪里错了，或者某些代码是如何导致这种意想不到的情况的。


    然而，错误不仅限于 bug。有时候，你会做出错误的决定，例如使用错误的数据结构。根据 Mike 的说法，在这些错误决策上吃亏，最终会帮助你学会何时使用某些设计模式是合理的。


    ## 5. 理解事物运作原理


    “无论你处于什么水平，我都会说：永远不要在不知道代码为何有效的情况下写任何一行代码，要深入底层。比方说，要保持痴迷的好奇心。成为源代码世界的印第纳·琼斯。好奇心是工程师之间永恒的特质。我不认为如果不带着好奇心注视显示器，你在这个行业无法生存。既像孩子般纯真，又严谨学术。”

    —— Ross Chapman


    可以说，光有兴趣是不够的。如果你目标成为一名体面的专业开发者，你就必须努力理解事物是如何运作的。


    “你可以通过筛选 StackOverflow 上的问题开始理解你所使用的工具。我从中中学到了一点东西。[那些顶部的 AngularJS 问题]读起来真的非常有趣，因为
    `Angular` 是一个非常大的框架。”

    —— Todd Motto，AngularJS 大会演讲者，Google 开发专家


    `Spotify` 的高级基础设施工程师 Rohan Singh 强调了理解当前工作栈下方一个层级栈的重要性。Rohan 说：“我们作为软件工程师所做的一切都涉及在某种抽象层面工作。”换句话说，如果你使用某种数据库，你可以忽略它的内部实现，并期望它“能够运行”。


    此外，为了真正理解事物是如何运作的，你应该能够解释为什么某些技术选择比其他选择更好，并在事物运行方式不符合预期时能够排除故障。Rohan 在实践中通过做到这一点：一点一点地尝试学习并理解他所使用的任何平台或系统的基础——无论是
    `Python`、`Go` 还是 `Linux` 操作系统。据他说，这最终能帮你建立一个关于底层运作原理的心理模型，并拓宽你的知识基础。


    最终，你将作为工程师而成长，而且额外的是，通过学习如何进行“后倾式”调试而不是“前倾式”调试，你能够更高效地调试。换句话说，你会向后倾并深入思考底层是如何运作的，以找出问题可能所在。Rohan
    说：“这比使用交互式调试器或其他工具进行‘前倾式’调试快得多，而且涉及的盲目尝试少。”


    事实上，`Evernote` 的 Andrei Thorp 认为每个人应该尽早学习基础的 `C` 语言。


    因为它极简且不会为你做太多，它迫使你从更底层理解计算机到底是如何运作的。例如，`C` 让你自己管理所使用的内存——这意味着以后当你使用 `Python` 之类的工具时，你实际上理解
    `Python` 在为你做什么。然后，当你看到某些奇怪的 bug 时，你脑中就有这套工具箱来理解问题可能是什么。


    ## 6. 持续学习新事物


    没有任何事情比从事一份糟糕且平庸的编程工作更能扼杀你的职业/技艺轨迹了。“要去一个被鼓励/迫使不断学习新技巧的地方，”目前在 `Amazon Web Services`
    工作的 Jonathan Henson 说。Jonathan 每年都会尝试学习一种新的编程语言、范式或栈。然后他会将自己投入到有机会应用这些技能的项目中。


    “我认为最重要的技能是元学习（meta-learning）”Kasra 说，“对我来说，这是区分工程师和程序员的标准。花 12 周在一门课程上学好一个框架确实是有道理的，但我非常尊重（并喜欢雇用）那些能够为了完成某项任务现场学习任何所需知识的开发者。”


    那么，学习新技能最好的方法是什么？


    阅读关于你想做的事情只是开始。Steve Klabnik 是 `Rust` 核心团队成员，在 `Rails` 历史贡献榜上排名第 37，他寻找关于该主题的任何现有研究，并试图弄清楚擅长你想做的事的人是如何获得结果的。


    最重要的事情就是直接去做。


    1. 尝试去做，很可能做得不好。

    2. 弄清楚我在哪里错了，以及我需要改进什么。

    3. 针对我确定的问题进行。

    4. 重复。”


    `Bellhops` 的 CTO Adam Haney 说，他学习新语言最喜欢的技巧是使用新语言的范式重新实现之前的项目。例如，他会把以前用 `C++` 编写的面向对象的代码，用函数式语言重新实现一遍。


    我觉得这种练习让我做好了评估新技术的准备，因为我理解底层的计算机科学原理，即使我不了解该语言或框架的复杂细节。


    如果你在记忆方面有困难，Andrei 建议建立一个“记忆宫”。通的想法是利用你大脑强大的视觉记忆，并将其映射到更技术的数据上。他也非常迷信像“Seinfeld
    日历”这样的技巧，这种方法基于 Jerry Seinfeld 的观点：你不需要每天都苦工作，你只需要每天进步一点点。“通过他的日历，你只需要勾选今天是否做了项目，”Andrei
    说，“有一些很棒的 App 可以帮你。


    在 `Android` 上，我使用 `HabitBull`。随着你的连续天数越长，你越有动力坚持下去


    ## 7. 学习如何与他人协作


    学习新事物的另一种方法是与他人一起进行项目。


    “独行侠的传奇是一个神话，”Adam 说，“几乎所有重大的项目都需要团队协作。”这意味着你需要学习将问题拆解为多个部分、构建代码库部分之间良好的接口，并在架构上进行协作。


    “与一群志同道合且能挑战你的工程师一起工作无疑让你进入快道，”Craig 说，“孤立工作让你很难发现自己做出的愚蠢选择并难以学习新事物。”


    每个人都会犯错——这就是编程的常态。初学者应该努力留在优秀的工程师周围并接受反馈。Jonathan 强调道：“不要对你的错误敏感。那是进步的方法。承认你的错误并从中学习。”


    获取代码审查还会迫使你思考为什么那样做，并更好地理解代码。“我最喜欢的合作的工程师是那些不会对你写的代码放过一马的人，”Ross 说，“我记得我第一次被挑战时，那简直把我吓坏了。但那天晚上我回到一直在学习，直到我至少可以自信地解释如何在闭包中传递这些内容。”


    那么，在哪里可以找到与你结对并帮助你的导师或同伴呢？


    根据 Jack 的说法，当地的聚会通常会有为任何需要的人提供免费指导的环节。其他免费资源包括 Twitter 群组、Slack 群组和 IRC 频道。

