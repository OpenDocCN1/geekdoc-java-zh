    上述显示的代码是两条语句，分隔符防止计算机将代码误读为单条语句。然而，编写代码时涉及人类，因此代码需要对人类可读，或者对任何可能阅读你代码的其他生物可读。良好的代码意味着遵循特定的格式风格。我们将在本章的后续部分详细讨论更多良好的代码风格。每组字符或文本都会由计算机中的词法分析器（有时称为
    lexer）进行转换，并变为一个符号。这一过程被称为标记化（tokenization），或者用计算机科学家的话说，词法分析器将你的代码标记为符号。一旦标记完成，符号就会被解析（parsed）；这个过程将标记组织成计算机要执行的指令。这种独特的词汇将程序员描绘成了一群奇怪的外星生物，他们拥有完全属于自己的语言；不过，我向保证，在与大多数程序员聊天时，并不经常提到关于词法分析器的话。


    这看起来可能是一项巨大的工程，而且我们正在跳到更复杂的计算机科学主题，但这一切都发生在幕后，所以你不需要看到这些内容的发生。


    理解编译器的作用以及它是如何工作的是非常重要的，这样你就能用计算机可以理解的方式编写代码。这就是为什么一个简单的拼写错误会阻止词法分析器构建代码的原因。我们很快就会学习编写用于分析、标记和解析的代码。


    计算机无法解释或猜测你正尝试做什么。因此，如果你错误地输入了 `int i = 0:` 而不是 `int i = 0;`，最后一个标记无法被词法分析器转换为正确的符号，因此这条语句将完全无法被解析。这段代码在编译之前就会导致错误。


    ### 分隔符标记 (Separator Tokens)


    最常见的分隔符是 `;`，分号。这个标点符号用于结束一条代码语句。其他分隔符成对出现。大括号成对使用，用于分隔一组代码语句。左括号是 `{`，尖端指向组的外部；它与关闭大括号对的
    `}` 配对。圆括号以 `(` 开始并以 `)` 结束，方括号以 `[` 开始并以 `]` 结束。不同的起始和结束大括号、方括号和圆括号有特定的用途，并帮助识别它们被用于什么地方。还有角括号
    `<` 和 `>`；这些用于包围数据类型。不要忘记单引号 `''''` 和双引号 `""`，它们也是成对使用的，用于包围被称为字符串的符号。


    #### 注意


    在许多文字处理器中，经常使用起始和结束引号（`“` 和 `”`）。词法分析器不识别这些“智能引号”，因此编程文本编辑器使用直引号（`"`）。一旦你意识到编程中使用的字母、数字和所有其他字符都被解析为美国信息交换标准代码（ASCII）或
    Unicode 转换格式（UTF-8）、16 或 32，这些细微的变化就不再微妙了。


    ASCII 和 UTF 都是计算机用于读取文本时使用的字符数据库的名称。计算机不使用眼睛阅读。相反，它们使用一个数字数据库来查找正在使用的每个字符。因此，对于计算机来说，如果我们使用
    `UTF-16`，`“` 看起来更像 `0x201C`，而 `"` 像 `0x0022`。代码中的大括号用于分隔语句。圆括号通常用于接收数据。方括号通常有助于识别数组。我们稍后会讨论数组，但在解释之前，你可以先想象成类似电子表格或图纸的东西。


    ```java

    int[] arrayNumbers = {1, (int) 3.0, 9000};

    ```


    上述语句将三个数字赋值给数组。大括号中包含一对用逗号分隔的语句。大括号中的第二条语句是将一个带有点 `.` 的数字转换为一个不带点的数字。这可能需要一些解释，但习惯看到这种东西是有处的。我们很快就会讨论什么是数组，以及点运算符。


    通常在学习编程时，你会看到很多奇怪的标记，它们可能看起来没有任何意义。这取决于你观察你遇到的每一个标记，并尝试理解它是做什么的。


    如果没有任何语句是说得通的，那也没关系。此时我们并不要求你已经知道所有这些含义，但你很快就会知道了。


    ### 运算符标记 (Operator Tokens)


    运算符类似于关键字，但它们只使用少数非单词字符。冒号或分号是一个运算符；与关键字不同，运算符会根据它们出现的位置或使用方式来改变其功能。这种行为的转变被称为运算符重载（operator
    overloading），这是一个复杂的课题，我们稍后会讨论。同样重要的一点是，当你需要时，可以创建自己的运算符。Java 中的逗号有不同的含义。它们用于分隔不同的数据值，例如
    `for(int i = 0, j = 1; ; i++, j++)`。


    ### 其他运算符标记 (Other Operator Tokens)


    泛而言，运算符是处理变量之间特定操作的特殊字符。运算符和变量出现的符号或顺序通常通过以下表示法或数学语法进行教学：`a + b = c`。然而，在编程中，倾向于使用：`c
    = a + b;` 这种变化是因为 `Java` 中的 `=` 运算符的工作方式与其数学课上通常教授的功能不同。`=`运算符的左侧是赋值侧，右侧是操作侧。这使得重点放在被赋值的值上，而不是如何赋值。上面的例子应该读作“c
    被赋值 a 加 b”。


    ### 字面量 (Literals)


    字面量有许多不同的形式；类似于运算符 `+`、`-` 或 `=`，它们是出现在它们之间的标记。数字被认为是标记，或以字面量方式使用的标记。数字可以称为数字字面量。当内容放入引号中时，例如“I’m
    a literal”，你写的是字符串字面量。字面量贯穿几乎所有的编程语言，并构成 `Java` 数据类型的基础。现在我们只处理几种不同类型的字面量，但很快我们就会接触更多。


    ### 律性与非律性操作 (Transitive and Non-Transitive Operations)


    在数学课上，有时会教某些操作具有律性而另一些不是。例如 `2 + 3 + 4` 和 `4 + 3 + 2` 的结果相同。每个数字出现在运算符之间的位置并不重要，因此
    `+` 运算符认为是律性的。这一概念在 `Java` 中同样适用。当我们开始混合运算符时，结果就会改变。


    ```java

    int a = 1 + 2 - 4 + 7; //a = 6

    int b = 7 + 4 - 2 + 1; //b = 10

    ```


    ### 什么是函数？ (What Are Functions?)


    函数（有时称为方法）包含处理数据的语句。这些语句可以也可以处理数据。方法可以被其他语句访问。这种行为被称为调用函数或进行函数调用。


