    \ is\n12 11 13 5 6 7\n\nSorted array is\n5 6 7 11 12 13\n\n# Quicksort\n\nSort\
    \ algorithms order the elements of an array according to a predefined order. Quicksort\
    \ is a divide and conquer algorithm. In a divide and conquer sorting algorithm\
    \ the original data is separated into two parts \"divide\" which are individually\
    \ sorted and \"conquered\" and then combined.\n\n### Algorithm\n\n- If the array\
    \ contains only one element or zero elements than the array is sorted.\n- If the\
    \ array contains more than one element than:\n    - Select an element from the\
    \ array. This element is called the \"pivot element\". For example select the\
    \ element in the middle of the array.\n    - All elements which are smaller then\
    \ the pivot element are placed in one array and all elements which are larger\
    \ are placed in another array.\n    - Sort both arrays by recursively applying\
    \ Quicksort to them.\n    - Combine the arrays.\n\nQuicksort can be implemented\
    \ to sort \"in-place\". This means that the sorting takes place in the array and\
    \ that no additional array needs to be created.\n\n### Program: Java program for\
    \ implementation of QuickSort\n\n```java\nclass QuickSort\n{\n    /* This function\
    \ takes last element as pivot,\n       places the pivot element at its correct\n\
    \       position in sorted array, and places all\n       smaller (smaller than\
    \ pivot) to left of\n       pivot and all greater elements to right\n       of\
    \ pivot */\n    int partition(int arr[], int low, int high)\n    {\n        int\
    \ pivot = arr[high];\n        int i = (low-1); // index of smaller element\n \
    \       for (int j=low; j<=high-1; j++)\n        {\n            // If current\
    \ element is smaller than or\n            // equal to pivot\n            if (arr[j]\
    \ <= pivot)\n            {\n                i++;\n                // swap arr[i]\
    \ and arr[j]\n                int temp = arr[i];\n                arr[i] = arr[j];\n\
    \                arr[j] = temp;\n            }\n        }\n        // swap arr[i+1]\
    \ and arr[high] (or pivot)\n        int temp = arr[i+1];\n        arr[i+1] = arr[high];\n\
    \        arr[high] = temp;\n        return i+1;\n    }\n    /* The main function\
    \ that implements QuickSort()\n       arr[] --> Array to be sorted,\n       low\
    \ --> Starting index,\n       high --> Ending index*/\n    void sort(int arr[],\
    \ int low, int high)\n    {\n        if (low < high)\n        {\n            /*\
    \ pi is partitioning index, arr[pi] is\n               now at right place */\n\
    \            int pi = partition(arr, low, high);\n            // Recursively sort\
    \ elements before\n            // partition and after partition\n            sort(arr,\
    \ low, pi-1);\n            sort(arr, pi+1, high);\n        }\n    }\n    /* A\
    \ utility function to print array of size n */\n    static void printArray(int\
    \ arr[])\n    {\n        int n = arr.length;\n        for (int i=0; i<n; ++i)\n\
    \            System.out.print(arr[i]+\" \");\n        System.out.println();\n\
    \    }\n    public static void main(String args[])\n    {\n        int arr[] =\
    \ {10, 7, 8, 9, 1, 5};\n        int n = arr.length;\n        QuickSort ob = new\
    \ QuickSort();\n        ob.sort(arr, 0, n-1);\n        System.out.println(\"sorted\
    \ array\");\n        printArray(arr);\n    }\n}\n```\n\nOutput:\n\nSorted array:\n\
