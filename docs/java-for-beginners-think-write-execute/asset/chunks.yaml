    对象具有状态、行为和标识。


    这意味着一个对象可以拥有内部数据（赋予其状态）、方法（产生行为），并且每个对象都可以与其他任何对象唯一地区分开来——具体来说，每个对象在内存中都有一个唯一的地址。


    ## 对象具有接口


    因此，尽管我们在面向对象编程中实际上做的是创建新的数据类型，但几乎所有的面向对象编程语言都使用 `class` 关键字。当你看到“类型（type）”这个词时，请思考“类（class）”，反之亦然。


    由于 `class` 描述了一组具有相同特征（数据元素）和行为（功能）的对象，因此 `class` 实际上是一个数据类型，因为例如，浮点数也拥有一组特征和行为。区别在于，程序员定义一个
    `class` 是为了适应某个问题，而不是被强制使用一个设计用于表示机器中存储单元的现有数据类型。你通过添加特定于你需求的新数据类型来扩展编程语言。编程系统欢迎新的
    `classes`，并对它们提供与内置类型同等的关注和类型检查。


    面向对象的方法不仅限于构建仿真。无论你是否同意任何程序都是你所设计的系统的仿真，使用 OOP 技术都可以轻松地将一组问题简化为简单的解决方案。


    一旦建立了一个 `class`，你就可以随心所欲地创建任意数量该类的对象，然后操作这些对象，就像它们是你试图解决的问题中存在的元素一样。事实上，面向对象编程的挑战之一就是在问题空间中的元素与解决方案空间中的对象之间建立一一映射。


    但你如何让对象为你做有用的工作呢？需要一种方法向对象提出请求，以便它执行某些操作，例如完成交易、在屏幕上绘制某些内容或打开开关。每个对象只能满足某些特定的请求。你对对象提出的请求由其接口定义，而类型则决定了接口。一个简单的例子可能是灯泡的表示：


    ![](img/00009.jpeg)


    ```

    Light lt = new Light();

    lt.on();

    ```


    接口决定了你可以对特定对象提出的请求。然而，在某处必须有代码来满足该请求。这与隐藏的数据共同构成了实现。从过程化编程的角度来看，这并不复杂。


    一个类型与每个可能的请求关联有一个方法，当你向对象发出特定请求时，该方法就会被调用。这个过程通常被总结为向对象“发送消息”（提出请求），对象会弄清楚如何处理该消息（它执行代码）。


    在这里，类型/类的名称是 `Light`，这个特定 `Light` 对象的名称是 `lt`，你对 `Light` 对象可以提出的请求是开启它、关闭它、让它变亮或变暗。你通过为该对象定义一个“引用”（`lt`）并调用
    `new` 来请求该类型的新对象，创建一个 `Light` 对象。要向对象发送消息，你写出对象的名称并用点（dot）将其与消息请求连接起来。从预定义 `class`
    使用者的角度来看，这基本上就是对象编程的全部内容。


    前面的图表遵循统一建模语言（UML）的格式。每个 `class` 用一个方框表示，类型名称位于框的顶部，你感兴趣描述的任何数据成员位于框的中间，方法（属于该对象的函数，接收你发送给该对象的任何消息）位于框的底部。在
    UML 设计图中，通常只显示 `class` 的名称和公共方法，因此在本例中，中间部分没有显示。如果你只对类名感兴趣，那么底部也就不需要显示。


    ## 对象提供服务：


    当你试图开发或理解一个程序设计时，考虑对象的最佳方式之一是将它们视为“服务提供者”。你的程序本身将为用户提供服务，它通过使用其他对象提供的服务来实现这一点。你的目标是产生（甚至更好，在现有代码库中找到）一组提供理想服务来解决你的问题的对象。


    开始这样做的一种方法是问：“如果我可以神奇地从帽子里变出它们，哪些对象会立即解决我的问题？”例如，假设你正在创建一个记账程序。你可能会想象一些包含预定义记账输入界面的对象，另一组执行记账计算的对象，以及一个处理在所有类型打印机上打印支票和发票的对象。也许这些对象中的某些已经存在，对于那些不存在，它们会什么样？这些对象将提供什么服务，它们需要哪些对象来履行职责？如果你继续这样做，最终你会达到一个点，可以说：“那个对象看起来足够简单，可以坐下来写”或者“我确定那个对象已经存在了”。这是将问题分解为一组对象的合理方法。


    将对象视为服务提供者还有一个额外的好处：它有助于提高对象的内聚性。高内聚性是软件设计的一个基本质量：它意味着软件组件的各个方面（例如对象，尽管这也可以适用于方法或对象库）很好地“契合在一起”。人们在设计对象时面临的一个问题是将过多的功能挤到一个对象中。例如，在你的支票打印模块中，你可能决定需要一个了解所有格式和打印的对象。你可能会发现这对于一个对象来说太重了，你需要的是三个或更多对象。一个对象可能是所有可能的支票布局的目录，可以查询有关如何打印支票的信息。一个对象或一组对象可以是通用打印接口，了解所有类型的打印机（这个是购买而不是自己编写的候选对象）。第三对象可以使用另外对象的服务来完成任务。因此，每个对象都提供一组内聚的服务。在良好的面向对象设计中，每个对象只做好一件事，而不试图做太多。这不仅允许发现可能购买的对象（打印机接口对象），还产生了可能在其他地方重用的新对象（支票布局目录）。


    隐藏的实现：


    '
- fmt: "\nIt is helpful to break up the playing field into class creators (those who\
    \ create new data types) and client programmers (the class consumers who use the\
    \ data types in their applications). The goal of the client programmer is to collect\
    \ a toolbox full of classes to use for rapid application development. The goal\
    \ of the class creator is to build a class that exposes only what’s necessary\
    \ to the client programmer and keeps everything else hidden. Why? Because if it’s\
    \ hidden, the client programmer can’t access it, which means that the class creator\
    \ can change the hidden portion at will without worrying about the impact on anyone\
    \ else. The hidden portion usually represents the tender insides of an object\
    \ that could easily be corrupted by a careless or uninformed client programmer,\
    \ so hiding the implementation reduces program bugs. \n\nIn any relationship it’s\
    \ important to have boundaries that are respected by all parties involved. When\
    \ you create a library, you establish a relationship with the client programmer,\
    \ who is also a programmer, but one who is putting together an application by\
    \ using your library, possibly to build a bigger library. If all the members of\
    \ a `class` are available to everyone, then the client programmer can do anything\
    \ with that `class` and there’s no way to enforce rules. Even though you might\
    \ really prefer that the client programmer not directly manipulate some of the\
    \ members of your `class`, without access control there’s no way to prevent it.\
    \ Everything’s naked to the world. \n\nSo the first reason for access control\
    \ is to keep client programmers’ hands off portions they shouldn’t touch—parts\
    \ that are necessary for the internal operation of the data type but not part\
    \ of the interface that users need in order to solve their particular problems.\
    \ This is actually a service to client programmers because they can easily see\
    \ what’s important to them and what they can ignore. \n\nThe second reason for\
    \ access control is to allow the library designer to change the internal workings\
    \ of the `class` without worrying about how it will affect the client programmer.\
    \ For example, you might implement a particular `class` in a simple fashion to\
    \ ease development, and then later discover that you need to rewrite it in order\
    \ to make it run faster. If the interface and implementation are clearly separated\
    \ and protected, you can accomplish this easily. \n\nJava uses three explicit\
    \ keywords to set the boundaries in a `class`: `public`, `private`, and `protected`.\
    \ These access specifiers determine who can use the definitions that follow. `public`\
    \ means the following element is available to everyone. The `private` keyword,\
    \ on the other hand, means that no one can access that element except you, the\
    \ creator of the type, inside methods of that type. `private` is a brick wall\
    \ between you and the client programmer. Someone who tries to access a `private`\
    \ member will get a compile-time error. The `protected` keyword acts like `private`,\
    \ with the exception that an inheriting class has access to `protected` members,\
    \ but not `private` members. Inheritance will be introduced shortly. \n\nJava\
    \ also has a “default” access, which comes into play if you don’t use one of the\
    \ aforementioned specifiers. This is usually called package access because classes\
    \ can access the members of other classes in the same package (library component),\
    \ but outside of the package those same members appear to be private.\n\n## Reusing\
    \ the implementation\n\nOnce a `class` has been created and tested, it should\
    \ (ideally) represent a useful unit of code. It turns out that this reusability\
    \ is not nearly so easy to achieve as many would hope; it takes experience and\
    \ insight to produce a reusable object design. But once you have such a design,\
    \ it begs to be reused. Code reuse is one of the greatest advantages that object-oriented\
    \ programming languages provide. \n\nThe simplest way to reuse a `class` is to\
    \ just use an object of that `class` directly, but you can also place an object\
    \ of that `class` inside a new `class`. We call this “creating a member object.”\
    \ Your new `class` can be made up of any number and type of other objects, in\
    \ any combination that you need to achieve the functionality desired in your new\
    \ `class`. Because you are composing a new `class` from existing `classes`, this\
    \ concept is called composition (if the composition happens dynamically, it’s\
    \ usually called aggregation). Composition is often referred to as a “has-a” relationship,\
    \ as in “A car has an engine.”\n\n![](images/00010.jpeg)\n\n(This UML diagram\
    \ indicates composition with the filled diamond, which states there is one car.\
    \ I will typically use a simpler form: just a line, without the diamond, to indicate\
    \ an association.5) \n\nComposition comes with a great deal of flexibility. The\
    \ member objects of your new `class` are typically `private`, making them inaccessible\
    \ to the client programmers who are using the `class`. This allows you to change\
    \ those members without disturbing existing client code. You can also change the\
    \ member objects at run time, to dynamically change the behavior of your program.\
    \ Inheritance, which is described next, does not have this flexibility since the\
    \ compiler must place compile-time restrictions on classes created with inheritance.\
    \ \n\nBecause inheritance is so important in object-oriented programming, it is\
    \ often highly emphasized, and the new programmer can get the idea that inheritance\
    \ should be used everywhere. This can result in awkward and overly complicated\
    \ designs. Instead, you should first look to composition when creating new classes,\
    \ since it is simpler and more flexible. If you take this approach, your designs\
    \ will be cleaner. Once you’ve had some experience, it will be reasonably obvious\
    \ when you need inheritance.\n\n## Inheritance\n\nBy itself, the idea of an object\
    \ is a convenient tool. It allows you to package data and functionality together\
    \ by concept, so you can represent an appropriate problem-space idea rather than\
    \ being forced to use the idioms of the underlying machine. These concepts are\
    \ expressed as fundamental units in the programming language by using the `class`\
    \ keyword. \n\nIt seems a pity, however, to go to all the trouble to create a\
    \ `class` and then be forced to create a brand new one that might have similar\
    \ functionality. It’s nicer if we can take the existing class, clone it, and then\
    \ make additions and modifications to the clone. This is effectively what you\
    \ get with inheritance, with the exception that if the original class (called\
    \ the base class or superclass or parent class) is changed, the modified “clone”\
    \ (called the derived class or inherited class or subclass or child class) also\
    \ reflects those changes. \n\n![](images/00011.jpeg)\n\n(The arrow in this UML\
    \ diagram points from the derived class to the base class. As you will see, there\
    \ is commonly more than one derived class.) \n\nA type does more than describe\
    \ the constraints on a set of objects; it also has a relationship with other types.\
    \ Two types can have characteristics and behaviors in common, but one type may\
    \ contain more than another and may also handle more messages (or handle them\
    \ differently). Inheritance expresses this similarity between types by using the\
    \ concept of base types and derived types. A base type contains all of the characteristics\
    \ and behaviors that are shared among the types derived from it. You create a\
    \ base type to represent the core of your ideas about some objects in your system.\
    \ From the base type, you derive other types to express the different ways that\
    \ this core can be realized.\n"
