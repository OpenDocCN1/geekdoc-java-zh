    The code shown above is two statements, the separator keeps the computer from
    misreading the code as a single statement. However, there are humans involved
    with writing code, and thus code needs to be readable by humans, or any other
    life-form which might read your code. Proper code means following a specific formatting
    style. We’ll dive into more about proper code style later in this chapter. Each
    group of characters, or text, is converted by a lexical analyzer, sometimes called
    a lexer, in the computer and turned a symbol. This process is called tokenization,
    or as a computer scientist would say, a lexer tokenizes your code into symbols.
    Once tokenized, the symbols are parsed; this process organizes the tokens into
    instructions for the computer to follow. This unique vocabulary does frame programmers
    as a strange group of alien beings with a language all to themselves; I promise,
    however, conversations about lexical analyzers don’t come up very often when talking
    with most programmers.


    This may seem like a great deal of work and we are jumping ahead into more complex
    computer science topics, but all of this happens behind the scenes so you don’t
    need to see any of this taking place.


    It’s important to understand what a compiler does, and how it works so you can
    write code in a way the computer can understand. This is why a simple typo will
    stop the lexer from building code. We’ll get to writing code to be analyzed, tokenized,
    and parsed soon enough.


    A computer can’t interpret or guess at what it is you’re trying to do. Therefore,
    if you mistype `int i = 0:` and not `int i = 0;` the last token cannot be converted
    by the lexer into a proper symbol, and thus this statement will not be parsed
    at all. This code results in an error before the code is even compiled.


    ### Separator Tokens


    The most common separator is the `;`, semicolon. This mark of punctuation is used
    to end a code statement. Other separators come in pairs. Curly braces are used
    in pairs to separate groups of code statements. The opening curly brace is the
    `{` with the pointy end pointed to the outside of the group; this is paired with
    the `}` which closes the curly brace pair. Parentheses start with the `(` and
    end with the `)` while square brackets start with `[` and end with `]`. The different
    opening and closing braces, brackets, and parentheses have specific purposes and
    are used to help identify what they are being used for. There are angle brackets
    `<` and `>` as well; these are used to surround data types. And don’t forget both
    single quotes `''''` and double quotes `""`, which are used in pairs as well to
    surround symbols called strings.


    #### NOTE


    In many word processors a beginning and ending quote (`“` and `”`) are often used.
    The lexical analyzer doesn’t recognize these smart quotes, so the text editor
    for programming uses straight quote marks (`"`) instead. These subtle changes
    aren’t so subtle once you realize that letters, numbers, and every other character
    used in programming are all parsed as American Standard Code for Information Interchange
    (ASCII) or unicode transformation format (UTF-8), 16, or 32.


    Both ASCII and UTF are names given to the database of characters that the computer
    uses to read text. Computers don’t use eyes to read. Rather, they use a database
    of numbers to look up each character being used. Therefore, to a computer `“`
    looks more like `0x201C` and `"` like `0x0022`, if we were using `UTF-16`. Curly
    braces are used in code to separate statements. Parentheses are usually used to
    accept data. Square brackets are often used to help identify arrays. We’ll get
    into arrays later, but imagine something like a spreadsheet or a graph paper till
    we get to their explanation.


    ```java

    int[] arrayNumbers = {1, (int) 3.0, 9000};

    ```


    The above statement assigns three numbers to an array. The curly braces contain
    a pair of statements separated by a comma. The second statement in the curly braces
    is converting a number with a dot `.` into a number without a dot in it. This
    will take a bit of explanation, but it’s good to get used to seeing this sort
    of thing. We’ll get to what an array is soon enough, as well as a dot operator.


    Often, when learning to program you’ll see many strange tokens which might not
    seem to have any meaning. It’s up to you to observe every token you come across
    and try to understand what it does.


    If none of the statements makes sense that’s fine. At this point you’re not expected
    to know what all this means yet, but you soon will.


    ### Operator Tokens


    Operators are like keywords but use only a few non-word characters. The colon
    or semi-colon is an operator; unlike keywords, operators change what they do based
    on where they appear, or how they are used. This behavior shifting is called operator
    overloading, and it’s a complex subject that we’ll get into later. It’s also important
    to know that you can make up your own operators when you need to. Commas in Java
    have a different meaning. They’re used to separate different data values like
    `for(int i = 0, j = 1; ; i++, j++)`.


    ### Other Operator Tokens


    Operators in general are special characters that take care of specific operations
    between variables. Notation or the order in which operators and variables appear
    is normally taught with the following notation or mathematic grammar: `a + b =
    c`. However, in programming the following is preferred: `c = a + b;` the change
    is made because the `=` operator in `Java` works differently from its function
    commonly taught in math class. The left side of the `=` operator is the assignment
    side, and the right side is the operation side. This puts the emphasis on the
    value assigned rather than how it’s assigned. The result is more important than
    how the problem is solved since the computer is doing the math. In programming
    the above example should be read as “c is assigned a plus b.”


    ### Literals


    Literals come in many different forms; similar to operators which appear as things
    like `+`, `-`, or `=` literals are the tokens that often go between them. Numbers
    are considered literals, or tokens that are used in a literal manner. Numbers
    can be called numeric literals. When something is put into quotes, as in “I’m
    a literal,” you are writing a string literal. Literals are common throughout nearly
    all programming languages and form the base of `Java`’s data types. Right now,
    we’re dealing with only a few different types of literals, but there are many
    more we will be aware of soon.


    ### Transitive and Non-Transitive Operations


    In math class it’s sometimes taught how some operations are transitive and others
    not. For instance `2 + 3 + 4` and `4 + 3 + 2` result in the same values. Where
    each number appears between the operators doesn’t matter, so the `+` operator
    is considered transitive. This concept holds true in `Java`. Results change when
    we start to mix operators.


    ```java

    int a = 1 + 2 - 4 + 7; //a = 6

    int b = 7 + 4 - 2 + 1; //b = 10

    ```


    ### What Are Functions?


    Functions, sometimes called methods, contain statements which can process data.
    The statements can or cannot process data. Methods can be accessed by other statements.
    This action is referred to as calling a function or making a function call.

