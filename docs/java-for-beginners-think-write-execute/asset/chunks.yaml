    values. The integer is a Java built-in type. Basically, this means that integers
    are a fundamental part of java. Other built-in types include float, double, string,
    bool, and object. Less commonly used built-in types are char, short, and byte.
    Altogether, there are 15 different built-in types.


    All of these, except object and string, are value types. Every type of data you’re
    able to build must be based on all of these built-in types. The system which creates
    all of these floats, doubles, and bools is rooted in the origin of computing.
    Remember the punch tapes and pieces of paper with holes in them? Those were records
    of 1s and 0s which were fed into computers for storing in the form of mechanical
    switches, either on or off. The patterns represented numbers or instructions and
    logic.


    Today, we still use the same system of 1s and 0s, or binary, only we don’t need
    to punch holes in paper to tell the computer what to do. The methods of creating
    and storing the instructions have become many times more complex, but nonetheless
    the principle of the 1 and 0 are the same. These are called bits; one possible
    origin for that name is the little bits of paper that were left over from punching
    all of the holes in the paper cards.


    Value and Reference Types:


    The int, float, double, and bool are commonly used value types. The basics of
    this usage pattern relate to the system that stores and organizes the computer’s
    memory. When you talk about computer storage you use the word megabyte or gigabyte.
    Value types are stored with a very specific purpose in mind: to keep track of
    a numeric value.


    NOTE:


    The word mega refers to how many millions of bytes a component in your computer
    can store. Giga indicates how every many billions of bytes are being stored. Have
    you ever thought about what a byte actually is? A byte is what is called an 8-bit
    unsigned integer, or a system of using 8 bits to form a number. What this means
    is that it’s a whole number like 0, 7, or 32,767\. The word unsigned indicates
    that the number cannot be negative, like −512\. A 1 or 0 in computer terms is
    called a bit. We won’t go into detail on how computers use bits to count, and
    it’s a rather fun thing to learn on your own.


    However, it’s important to know that a byte has a limited range, from 0 to 255\.
    I’ll just leave you with the idea that you could count up to 1023 on your 10 fingers
    if you used binary rather than decimal. Your fingers can be used to represent
    a 10-bit unsigned integer. The computer’s calculation capabilities used to be
    far more limited than they are today. An 8-bit game console made in the 1980s
    had a limited number of colors, 256 to be exact.


    This limitation was based on the number of bits that the processor could handle.
    The processor had a limited number of transistors which could be used at any one
    time. Shortly after, floating point coprocessors were introduced, which had a
    much larger numeric range allowed, by having closer to 32 bits to work with. In
    all of these cases, when you use a value type, that number is actually stored
    as 1s and 0s in your computer’s RAM. This should be considered fairly remarkable.


    In the past you’d have to go through flaming hoops to store a value. Now you just
    type in float f = 3.1415926535; and you can measure the circumference of the universe
    accurately to within the width of a single atom. What all of these types have
    in common is that they are stored as a single element. Large values like  double 
    gigawatts = 1210000000.0; and double mint = 2.0; use the same amount of memory.


    Your computer doesn’t assign one double or the other more space in memory. These
    types are referred to as primitive types. The only difference between an int and
    a float is the number of bits they use at a time, 8 and 32 respectively; doubles
    use 64 bits.


    The string and object types differ a bit in how they are stored. These types are
    a composite of any number smaller elements. The bigger a string or object the
    bigger chunk of memory the computer opens up to place that object or string. These
    are called reference types or sometimes called nullable types because Java doesn’t
    look to a single element in memory to get data from it.


    Strong Typing:


    This has nothing to do with how hard you type on the keyboard!


    Java sees a difference between numbers in how they are written. A whole number
    like 1 is different from 1.0, even though we can think of them as having the same
    value. Some of these differences can be added by adding a letter. Therefore, 1.0
    and 1.0f are actually different numbers as well. Java is a strongly typed programming
    language. When a programming language uses strong types you’re expected to keep
    the different types separated.


    This means that a 1 + 1.0f can create a problem. Because the two numbers are actually
    different types of numbers we have to convert one of them to match the other before
    the operation is allowed to take place. To convert from one type to another we
    have to tell Java that we intend to make that conversion from a 1 to a 1.0 by
    using what’s called a cast operator. Aside from changing how memory is used, types
    also limit any problems which might come about when working in a team of programmers.


    Thinking in Algorithms


    An algorithm is a detailed step-by-step instruction set or formula for solving
    a problem or completing a task. In computing, programmers write algorithms that
    instruct the computer how to perform a task.


    When you think of an algorithm in the most general way (not just in regards to
    computing), algorithms are everywhere. A recipe for making food is an algorithm,
    the method you use to solve addition or long division problems is an algorithm,
    and the process of folding a shirt or a pair of pants is an algorithm. Even your
    morning routine could be considered an algorithm! In fact, here’s what your child’s
    morning might look like written out as an algorithm:


    ![](images/00014.jpeg)


    What kinds of problems are solved by   algorithms?


    Sorting is by no means the only computational problem for which algorithms have
    been developed. Practical applications of algorithms are ubiquitous and include
    the following examples:


    1.  The Human Genome Project has made great progress toward the goals of identifying
    all the 100,000 genes in human DNA, determining the sequences of the 3 billion
    chemical base pairs that make up human DNA, storing this information in databases,
    and developing tools for data analysis. Each of these steps requires sophisticated
    algorithms. Although the solutions to the various problems involved are beyond
    the scope of this book, many methods to solve these biological problems use ideas
    from several of the chapters in this book, thereby enabling scientists to accomplish
    tasks while using resources efficiently. The savings are in time, both human and
    machine, and in money, as more information can be extracted from laboratory techniques.'
