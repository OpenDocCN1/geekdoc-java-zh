- fmt: "\n## Socket Class\n\n| 4 | `public Socket(InetAddress host, int port, InetAddress\
    \ localAddress, int localPort) throws IOException` | This method is identical\
    \ to the previous constructor, except that the `host` is denoted by an `InetAddress`\
    \ object instead of a `String`. |\n| 5 | `public Socket()` | Creates an unconnected\
    \ socket. Use the `connect()` method to connect this socket to a server. |\n\n\
    When the `Socket` constructor returns, it does not simply instantiate a `Socket`\
    \ object but it actually attempts to connect to the specified server and port.\n\
    \nSome methods of interest in the `Socket` class are listed here. Notice that\
    \ both the client and the server have a `Socket` object, so these methods can\
    \ be invoked by both the client and the server.\n\n| Sr.No. | Method & Description\
    \ |\n| :--- | :--- |\n| 1 | `public void connect(SocketAddress host, int timeout)\
    \ throws IOException` | This method connects the socket to the specified `host`.\
    \ This method is needed only when you instantiate the `Socket` using the no-argument\
    \ constructor. |\n| 2 | `public InetAddress getInetAddress()` | This method returns\
    \ the address of the other computer that this socket is connected to. |\n| 3 |\
    \ `public int getPort()` | Returns the port the socket is bound to on the remote\
    \ machine. |\n| 4 | `public int getLocalPort()` | Returns the port the socket\
    \ is bound to on the local machine. |\n| 5 | `public SocketAddress getRemoteSocketAddress()`\
    \ | Returns the address of the remote socket. |\n| 6 | `public InputStream getInputStream()\
    \ throws IOException` | Returns the input stream of the socket. The input stream\
    \ is connected to the output stream of the remote socket. |\n| 7 | `public OutputStream\
    \ getOutputStream() throws IOException` | Returns the output stream of the socket.\
    \ The output stream is connected to the input stream of the remote socket. |\n\
    | 8 | `public void close() throws IOException` | Closes the socket, which makes\
    \ this `Socket` object no longer capable of connecting again to any server. |\n\
    \n## InetAddress Class Methods\n\nThis class represents an Internet Protocol (IP)\
    \ address. Here are following useful methods which you would need while doing\
    \ socket programming –\n\n| Sr.No. | Method & Description |\n| :--- | :--- |\n\
    | 1 | `static InetAddress getByAddress(byte[] addr)` | Returns an `InetAddress`\
    \ object given the raw IP address. |\n| 2 | `static InetAddress getByAddress(String\
    \ host, byte[] addr)` | Creates an `InetAddress` based on the provided host name\
    \ and IP address. |\n| 3 | `static InetAddress getByName(String host)` | Determines\
    \ the IP address of a host, given the host's name. |\n| 4 | `String getHostAddress()`\
    \ | Returns the IP address string in textual presentation. |\n| 5 | `String getHostName()`\
    \ | Gets the host name for this IP address. |\n| 6 | `static InetAddress getLocalHost()`\
    \ | Returns the local host. |\n| 7 | `String toString()` | Converts this IP address\
    \ to a `String`. |\n\n## Socket Client Example\n\nThe following `GreetingClient`\
    \ is a client program that connects to a server by using a socket and sends a\
    \ greeting, and then waits for a response.\n\n### Example\n\n```java\n// File\
    \ Name GreetingClient.java\nimport java.net.*;\nimport java.io.*;\n\npublic class\
    \ GreetingClient {\n    public static void main(String[] args) {\n        String\
    \ serverName = args[0];\n        int port = Integer.parseInt(args[1]);\n     \
    \   try {\n            System.out.println(\"Connecting to \" + serverName + \"\
    \ on port \" + port);\n            Socket client = new Socket(serverName, port);\n\
    \            System.out.println(\"Just connected to \" + client.getRemoteSocketAddress());\n\
    \            OutputStream outToServer = client.getOutputStream();\n          \
    \  DataOutputStream out = new DataOutputStream(outToServer);\n            out.writeUTF(\"\
    Hello from \" + client.getLocalSocketAddress());\n            InputStream inFromServer\
    \ = client.getInputStream();\n            DataInputStream in = new DataInputStream(inFromServer);\n\
    \            System.out.println(\"Server says \" + in.readUTF());\n          \
    \  client.close();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n## Socket Server Example\n\nThe following `GreetingServer`\
    \ program is an example of a server application that uses the `Socket` class to\
    \ listen for clients on a port number specified by a command-line argument –\n\
    \n### Example\n\n```java\n// File Name GreetingServer.java\nimport java.net.*;\n\
    import java.io.*;\n\npublic class GreetingServer extends Thread {\n    private\
    \ ServerSocket serverSocket;\n\n    public GreetingServer(int port) throws IOException\
    \ {\n        serverSocket = new ServerSocket(port);\n        serverSocket.setSoTimeout(10000);\n\
    \    }\n\n    public void run() {\n        while (true) {\n            try {\n\
    \                System.out.println(\"Waiting for client on port \" + serverSocket.getLocalPort()\
    \ + \"...\");\n                Socket server = serverSocket.accept();\n      \
    \          System.out.println(\"Just connected to \" + server.getRemoteSocketAddress());\n\
    \                DataInputStream in = new DataInputStream(server.getInputStream());\n\
    \                System.out.println(in.readUTF());\n                DataOutputStream\
    \ out = new DataOutputStream(server.getOutputStream());\n                out.writeUTF(\"\
    Thank you for connecting to \" + server.getLocalSocketAddress() + \"\\nGoodbye!\"\
    );\n                server.close();\n            } catch (SocketTimeoutException\
    \ s) {\n                System.out.println(\"Socket timed out!\");\n         \
    \       break;\n            } catch (IOException e) {\n                e.printStackTrace();\n\
    \                break;\n            }\n        }\n    }\n\n    public static\
    \ void main(String[] args) {\n        int port = Integer.parseInt(args[0]);\n\
    \        try {\n            Thread t = new GreetingServer(port);\n           \
    \ t.start();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n"
