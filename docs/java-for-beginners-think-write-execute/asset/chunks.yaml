    \ part at the right end. Initially, the sorted part is empty and the unsorted\
    \ part is the entire list.\n\nThe smallest element is selected from the unsorted\
    \ array and swapped with the leftmost element, and that element becomes a part\
    \ of the sorted array. This process continues moving unsorted array boundary by\
