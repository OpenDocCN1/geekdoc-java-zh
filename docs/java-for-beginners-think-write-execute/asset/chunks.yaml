    \               of their current position */\n            while (j >= 0 && arr[j]\
    \ > key) {\n                arr[j+1] = arr[j];\n                j = j - 1;\n \
    \           }\n            arr[j+1] = key;\n        }\n    }\n\n    /* A utility\
