    排序后的数组\n5 6 7 11 12 13\n\n# 快速排序\n\n排序算法根据定义的顺序对数组中的元素进行排序。快速排序是一种分治法算法。在分治法排序算法中，原始数据被分成两个部分，“分”，这两个部分会被分别进行排序并“攻”，然后进行合并。\n\
    \n### 算法\n\n- 如果数组只包含一个元素或零个元素，则数组是已排序的。\n- 如果数组包含多一个元素，则：\n    - 从数组中选择一个元素。该元素被称为“基准元素”（pivot\
    \ element）。例如，选择数组中间的元素。\n    - 将所有小于基准元素的元素放在一个数组中，将所有大于基准元素的元素放在另一个数组中。\n  \
    \  - 通过递归地对这两个数组应用快速排序来完成排序。\n    - 合并这些数组。\n\n快速排序可以实现为“原地”排序。这意味着排序在数组内部进行，不需要创建额外的数组。\n\
    \n### 程序：实现快速排序的 Java 程序\n\n```java\nclass QuickSort\n{\n    /* 此函数取最后一个元素作为基准，\n\
    \       将基准元素放在排序后数组的正确位置，\n       并将所有较小（小于基准）的元素放在基准的左侧，\n       将所有较大的元素放在基准的右侧\
    \ */\n    int partition(int arr[], int low, int high)\n    {\n        int pivot\
    \ = arr[high];\n        int i = (low-1); // 较小元素的索引\n        for (int j=low; j<=high-1;\
    \ j++)\n        {\n            // 如果当前元素小于或\n            // 等于基准\n           \
    \ if (arr[j] <= pivot)\n            {\n                i++;\n                //\
    \ 交换 arr[i] 和 arr[j]\n                int temp = arr[i];\n                arr[i]\
    \ = arr[j];\n                arr[j] = temp;\n            }\n        }\n      \
    \  // 交换 arr[i+1] 和 arr[high]（或基准）\n        int temp = arr[i+1];\n        arr[i+1]\
    \ = arr[high];\n        arr[high] = temp;\n        return i+1;\n    }\n    /*\
    \ 实现 QuickSort()的主函数\n       arr[] --> 需要排序的数组，\n       low --> 起始索引，\n      \
    \ high --> 结束索引*/\n    void sort(int arr[], int low, int high)\n    {\n      \
    \  if (low < high)\n        {\n            /* pi 是分区索引，arr[pi] \n            \
    \   现在位于正确的位置 */\n            int pi = partition(arr, low, high);\n          \
    \  // 递归排序分区之前\n            // 之后分区之后的元素\n            sort(arr, low, pi-1);\n\
    \            sort(arr, pi+1, high);\n        }\n    }\n    /* 用于打印大小为 n 的数组的工具函数\
    \ */\n    static void printArray(int arr[])\n    {\n        int n = arr.length;\n\
    \        for (int i=0; i<n; ++i)\n            System.out.print(arr[i] + \" \"\
    );\n        System.out.println();\n    }\n    public static void main(String args[])\n\
    \    {\n        int arr[] = {12, 11, 13, 5, 6, 7};\n        System.out.println(\"\
    给定数组\");\n        printArray(arr);\n        QuickSort ob = new QuickSort();\n\
    \        ob.sort(arr, 0, arr.length-1);\n        System.out.println(\"\\n 排序后的数组\"\
    );\n        printArray(arr);\n    }\n}\n```\n\n输出：\n\n给定数组是\n12 11 13 5 6 7\n\n\
    排序后的数组是\n5 6 7 11 12 13\n\n"
