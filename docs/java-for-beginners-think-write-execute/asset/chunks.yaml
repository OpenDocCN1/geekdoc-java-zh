    \ sort\n\nInsertion sort is a simple sorting algorithm that works the way we sort\
    \ cards in our hands.\n\n## Algorithm\n- Step 1: If it is the first element, it\
    \ is already sorted. return 1\n- Step 2: Pick next element\n- Step 3: Compare\
    \ with all elements in the sorted sub-list\n- Step 4: Shift all the elements in\
    \ the sorted sub-list that is greater than the value to be sorted\n- Step 5: Insert\
    \ the value\n- Step 6: Repeat until list is sorted\n\n## Program: Java program\
    \ for implementation of Insertion Sort\n\n```java\nclass InsertionSort {\n   \
    \ /*Function to sort array using insertion sort*/\n    void sort(int arr[]) {\n\
    \        int n = arr.length;\n        for (int i = 1; i < n; ++i) {\n        \
    \    int key = arr[i];\n            int j = i - 1;\n            /* Move elements\
