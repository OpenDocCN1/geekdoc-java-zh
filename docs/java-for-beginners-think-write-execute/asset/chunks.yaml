    # 第 4 章 | 网络


    ## 什么是网络编程？


    `network programming` 一术是指编写在多个设备（计算机）上执行的程序，这些设备都通过网络相互连接。


    J2SE API 的 `java.net` 包包含了一系列类和接口，这些类和接口提供了底层通信细节，允许你编写专注于解决当前手头问题的程序。


    `java.net` 包对两种常见的网络协议提供了支持：


    1. **TCP** – `TCP` 代表传输控制协议（Transmission Control Protocol），它允许两个应用程序之间进行可靠的通信。`TCP`
    通常在互联网协议上使用，被称为 `TCP/IP`。

    2. **UDP** – `UDP` 代表用户数据报协议（User Datagram Protocol），这是一种无连接协议，允许在应用程序之间传输数据包。


    本章将让你对以下两个主题有良好的理解——


    1. **Socket 编程** – 这是网络领域应用最广泛的概念，并进行了非常详细的解释。

    2. **URL 处理** – `URL` 代表统一资源定位符（Uniform Resource Locator），表示万维网上的资源，例如 Web 页面或
    FTP 目录。


    ## Socket 编程


    Sockets 使用 `TCP` 在两台计算机之间提供通信机制。客户端程序在通信的这一端创建一个 socket，并尝试将该 socket 连接到服务器。


    当连接建立时，服务器会在通信的另一端创建一个 socket 对象。现在客户端和服务器可以通过向 socket 写入和从 socket 读取数据来通信。


    `java.net.Socket` 类表示 socket，而 `java.net.ServerSocket` 类为服务器程序提供了监听客户端并与其建立连接的机制。


    使用 sockets 在两台计算机之间建立 `TCP` 连接时，会发生以下步骤：


    * 服务器实例化 `ServerSocket` 对象，指定通信要发生的端口号。

    * 服务器调用 `ServerSocket` 类的 `accept()` 方法。该方法会等待客户端在指定的端口上连接服务器。

    * 在服务器等待期间，客户端实例化 `Socket` 对象，指定要连接的服务器名称和端口号。

    * `Socket` 类的构造函数尝试将客户端连接到指定的服务器和端口号。如果建立了连接，客户端现在拥有了一个能够与服务器通信的 `Socket` 对象。

    * 在服务器端，`accept()` 方法返回服务器上一个新 socket 的引用，该 socket 连接到客户端的 socket。

    * 连接建立后，可以使用 I/O 流进行通信。每个 socket 都有一个 `OutputStream` 和 `InputStream`。客户端的 `OutputStream`
    连接到服务器的 `InputStream`。`TCP` 是一种双向通信协议，因此数据可以在两个流之间传输。


    ### ServerSocket 类


    `java.net.ServerSocket` 类被服务器用于获取端口并监听客户端请求。


    `ServerSocket` 类有四个构造函数：


    | 序号 | 构造函数及描述 |

    | :--- | :--- |

    | 1 | `public ServerSocket(int port) throws IOException`: 尝试创建一个绑定到指定端口的服务器。如果该端口已被另一个应用程序绑定，则发生异常。
    |

    | 2 | `public ServerSocket(int port, int backlog) throws IOException`: 与上一个构造函数类似，`backlog`
    参数指定在队列中存储多少个接入客户端。 |

    | 3 | `public ServerSocket(int port, int backlog, InetAddress address) throws
    IOException`: 与上一个构造函数类似，`InetAddress` 参数指定要绑定的本地地址。 |

    | 4 | `public ServerSocket() throws IOException`: 创建未绑定的服务器 socket。使用此构造函数时，在准备好绑定服务器时使用
    `bind()` 方法。 |


    以下是 `ServerSocket` 类的一些常用方法：


    | 序号 | 方法及描述 |

    | :--- | :--- |

    | 1 | `public int getLocalPort()`: 返回服务器 socket 监听的端口。如果你在构造函数中传入 0 作为端口号，则此方法非常有用。
    |

    | 2 | `public Socket accept() throws IOException`: 等待接入客户端。该方法一直阻塞直到客户端连接到服务器或超时（假设已通过
    `setSoTimeout()` 设置了超时值）。否则，该方法将无限阻塞。 |

    | 3 | `public void setSoTimeout(int timeout)`: 设置 socket 在 `accept()` 期间等待的超时时间。
    |

    | 4 | `public void bind(SocketAddress host, int backlog)`: 将 socket 绑定到 `SocketAddress`
    对象中的服务器和端口。 |


    当 `ServerSocket` 调用 `accept()` 时，在客户端连接之前不会返回。连接后，`ServerSocket` 在未指定的端口创建一个新的
    `Socket` 并返回该新 `Socket` 的引用。现在客户端和服务器之间建立了 `TCP` 连接，可以开始通信。


    ### Socket 类


    `java.net.Socket` 类表示客户端和服务相互通信使用的 socket。客户端通过实例化获取 `Socket` 对象，而服务器通过 `accept()`
    的返回值获取 `Socket` 对象。


    `Socket` 类有五个客户端用于连接服务器的构造函数：


    | 序号 | 构造函数描述 |

    | :--- | :--- |

    | 1 | `public Socket(String host, int port) throws UnknownHostException, IOException`:
    此方法尝试连接到指定的服务器和端口。如果构造函数没有抛出异常，则连接成功，客户端已连接到服务器。 |

    | 2 | `public Socket(InetAddress host, int port) throws IOException`: 此方法与上一个构造函数相同，只是主机由
    `InetAddress` 对象表示。 |

    | 3 | `public Socket(String host, int port, InetAddress localAddress, int localPort)
    throws IOException`: 连接到指定的主机和端口，并在本地主机上指定的地址和端口上创建 socket。 |


