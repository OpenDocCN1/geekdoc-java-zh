    \n“如果你手里一把锤子，一切看起来都像钉子。”\n\n## 2. 设计模式\n\n这需要教育和经验。结构化代码有多种方法，每种方法都有其适用和不适用场景。你要么需要在在这个过程中犯错，要么需要从已经犯过错的人那里学习。\n\
    \n## 3. 编程范式\n\n`面向对象编程`并不是唯一的真理。`函数式编程`也如此。同样还有[响应式编程](https://en.wikipedia.org/wiki/Reactive_programming)。编程有不同的方式，每种方式都有其特定的目的。不仅如此，某些语言天生更适合某种特定的范式。\n\
    \n## 4. 数据结构\n\n诚然，你的语言可以让你对不同的数据结构有一个基本的了解。但再次，这只是基础性的。自学者往往倾向于只使用他们喜爱的语言中有效的数据结构。仅仅因为它在你的语言中不是原生类型或甚至常用结构，并不意味着它不存在。\n\
    \n## 5. 测试\n\n可能只是我个人的观点，在将代码推送到环境之前，有很多测试方法。学习如何进行单元测试。更重要的是，学习测试驱动开发。测试代码与编写可测试代码之间是有区别的。\n\
