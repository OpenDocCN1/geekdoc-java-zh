  trans: "\n`continue` 关键字可以用于任何循环控制结构。它会导致循环立即跳转到循环的下次迭代。\n\n- 在 `for` 循环中，`continue`\
    \ 关键字会导致控制立即跳转到更新语句。\n- 在 `while` 循环或 `do/while` 循环中，控制立即跳转到布尔表达式。\n\n## 语法\n\n\
    `continue` 的语法是任何循环内部单条语句——\n\n```java\ncontinue;\n```\n\n## 流程图\n\n![Java Continue\
    \ Statement](img/00008.jpeg)\n\n## 示例\n\n```java\npublic class Test {\n  public\
    \ static void main(String args[]) {\n    int[] numbers = {10, 20, 30, 40, 50};\n\
    \    for(int x : numbers) {\n      if(x == 30) {\n        continue;\n      }\n\
    \      System.out.print(x);\n      System.out.print(\"\\n\");\n    }\n  }\n}\n\
    ```\n\n## 输出\n\n```\n10\n20\n40\n50\n```\n\n## 类\n\n任何 Java 程序中最重要的部分是类。这里的“类”不是学生去的那种教室；而是分类意义上的类。Java\
    \ 中的类以几种不同的形式出现。有些被称为部分类（partial classes），有些类甚至出现在另一个类内部；这些类被称为嵌套类（nested classes）。类是指令和数据的集合。指令被称为函数或方法。存储在类中的数据被称为字段或属性。抛开所有命名不谈，重要的是类做了什么以及它们是如何被使用的。\n\
    \n类是灵活且易于更改的，但这种灵活性并不是没有复杂性的。正如我们之前看到的，类声明可以包含比以下示例多多的内容。然而，大部分复杂性出现在本书的后面，当需要时才会出现。\n\
    \n当你处理游戏或任何类型的编程任务时，首先收集数据，然后弄清楚如何使用数据。在大多数编程范式中，最好的方法是在新类的开始时从变量。例如，在下面的伪代码中，我们可能想在出去之前知道是星期几：\n\
    \n```java\nTime day = today;\nif (day == Friday) {\n  PartyTonight = true;\n}\n\
    ```\n\n我们从获取日期开始，然后根据日期决定今晚做什么。除非我们想上班迟到，否则我们应该避免先聚会再检查是星期几。我们将在学习了如何在类中正确使用变量后，对这个主题进行更详细的介绍。\n\
    \n## 对象简介\n\n面向对象编程（OOP）的发明是为了将数据和逻辑关联成封装良好的代码包。当你在 Java 中编写一个类时，你正在为一个新对象创建蓝图和指令。然后可以根据你的蓝图构建任意数量的对象。程序员在谈论从类蓝图创建对象时会使用\
    \ `instantiate`（实例化）一词。每个被实例化的对象都是其构建的类的实例。类本身并不是由它创建的实例之一。新创建的对象包含了写入类中的所有函数和数据。\n\
    \n所有编程语言都提供抽象。可以认为，你能够解决的问题的复杂性与抽象的类型和质量直接相关。我说的“类型”是指“你正在抽象什么？”。汇编语言是对底层机器的一种抽象。随后的许多所谓的“命令式”语言（如\
    \ FORTRAN、BASIC 和 C）都是汇编语言的抽象。这些语言是对汇编语言的巨大改进，但它们的主要抽象仍然要求你从计算机的结构来思考，而不是从试图解决的问题的结构来思考。\n\
    \n程序员必须在机器模型（位于“解决方案空间”中，即你实现解决方案的地方，如计算机）与实际正在解决的问题模型（位于“问题空间”中，即问题存在的地方，如业务）之间建立关联。执行这种映射所需的努力，以及它是外部于编程语言的这一事实，导致了程序难以编写且维护成本高昂，并作为副作用产生了整个“编程方法”行业。\n\
    \n建模机器的替代方案是对你试图解决的问题进行建模。早期的语言如 LISP 和 APL 选择了特定的世界观（分别为“所有问题根结底都是列表”或“所有问题都是算法的”）。Prolog\
    \ 将所有问题转化为决策链。创建的语言还用于基于约束的编程，以及专门通过操作图形符号进行编程的语言。（后者被证明限制性太大了。）\n\n这些方法中的每一种对于它们设计要解决的特定类问题可能都是很好的解决方案，但当你跳到该领域之外时，它们就会变得笨拙。\n\
    \n面向对象的方法更进了一步，为程序员提供了表示问题空间中元素的工具。这种表示方法足够通用，使得程序员不受限于任何特定类型的问题。我们将问题空间中的元素及其在解决方案空间中的表示称为“对象”。（你还需要其他没有问题空间类比的对象。）\n\
    \n这种想法是，允许程序通过添加新类型的对象来自己适应问题的术语，因此当你阅读描述解决方案的代码时，你读到的也是表达问题的词汇。这比我们以前拥有的更灵活、更强大的语言抽象。因此，OOP\
    \ 允许你根据问题本身来描述问题，而不是根据运行解决方案的计算机来描述。它仍然与计算机有联系：每个对象看起来都很像计算机——有状态，也有可以执行的操作。然而，这种类比对于对象来说并不糟糕——它们具有特征。\n\
    \n简单来说，OOP 是构建对象、实例化并使用它们的过程。使用对象涉及读取数据、对数据进行处理以及执行任务。\n\n## 面向对象编程的特征\n\n这些特征代表了纯的面向对象方法：\n\
    \n1. **一切皆对象**。把对象想象成特殊的变量；它存储数据，但你可以对其请求。理论上，你可以将试图解决的问题中的任何概念组件（狗、建筑、服务等）表示为程序中的一个对象。\n\
    2. **程序是由一组通过发送消息告诉对方做什么的对象组成的**。要向对象提出请求，你向该对象`发送消息`。更具体地说，你可以将消息看作是调用特定对象的`方法`的请求。\n\
    3. **每个对象都有由其他对象组成的内存**。换句话说，你通过包含现有对象的包来创建一个新类型的对象。因此，你可以在构建程序的同时通过对象的简单性隐藏复杂性。\n\
    4. **每个对象都有一个类型**。用术语来说，每个对象都是`类`的实例，其中“类”与“类型”同义。类最重要的区别特征是“你可以向它发送什么消息？”\n5.\
    \ **特定类型的所有对象都可以接收相同的消息**。这实际上是一个带有深意的陈述，正如你之后看到的。因为类型为“圆”的对象也是“形状”类型的对象，所以圆保证接受形状消息。这意味着你可以编写处理形状的代码，并自动处理任何符合形状描述的物体。这种替换性是\
    \ OOP 中一个强大的概念。\n\n对对象更简洁的描述是：\n\n"
- fmt: "\nAn object has state, behavior and identity. \n\nThis means that an object\
    \ can have internal data (which gives it state), methods (to produce behavior),\
    \ and each object can be uniquely distinguished from every other object—to put\
    \ this in a concrete sense, each object has a unique address in memory.\n\n##\
    \ An object has an interface\n\nSo, although what we really do in object-oriented\
    \ programming is create new data types, virtually all object-oriented programming\
    \ languages use the `class` keyword. When you see the word “type” think “class”\
    \ and vice versa.\n\nSince a `class` describes a set of objects that have identical\
    \ characteristics (data elements) and behaviors (functionality), a `class` is\
    \ really a data type because a floating point number, for example, also has a\
    \ set of characteristics and behaviors. The difference is that a programmer defines\
    \ a `class` to fit a problem rather than being forced to use an existing data\
    \ type that was designed to represent a unit of storage in a machine. You extend\
    \ the programming language by adding new data types specific to your needs. The\
    \ programming system welcomes the new `classes` and gives them all the care and\
    \ type checking that it gives to built-in types. \n\nThe object-oriented approach\
    \ is not limited to building simulations. Whether or not you agree that any program\
    \ is a simulation of the system you’re designing, the use of OOP techniques can\
    \ easily reduce a large set of problems to a simple solution. \n\nOnce a `class`\
    \ is established, you can make as many objects of that `class` as you like, and\
    \ then manipulate those objects as if they are the elements that exist in the\
    \ problem you are trying to solve. Indeed, one of the challenges of object-oriented\
    \ programming is to create a one-to one mapping between the elements in the problem\
    \ space and objects in the solution space. \n\nBut how do you get an object to\
    \ do useful work for you? There needs to be a way to make a request of the object\
    \ so that it will do something, such as complete a transaction, draw something\
    \ on the screen, or turn on a switch. And each object can satisfy only certain\
    \ requests. The requests you can make of an object are defined by its interface,\
    \ and the type is what determines the interface. A simple example might be a representation\
    \ of a light bulb:\n\n![](images/00009.jpeg)\n\n```\nLight lt = new Light();\n\
    lt.on();\n```\n\nThe interface determines the requests that you can make for a\
    \ particular object. However, there must be code somewhere to satisfy that request.\
    \ This, along with the hidden data, comprises the implementation. From a procedural\
    \ programming standpoint, it’s not that complicated.\n\nA type has a method associated\
    \ with each possible request, and when you make a particular request to an object,\
    \ that method is called. This process is usually summarized by saying that you\
    \ “send a message” (make a request) to an object, and the object figures out what\
    \ to do with that message (it executes code). \n\nHere, the name of the type/class\
    \ is `Light`, the name of this particular `Light` object is `lt`, and the requests\
    \ that you can make of a `Light` object are to turn it on, turn it off, make it\
    \ brighter, or make it dimmer. You create a `Light` object by defining a “reference”\
    \ (`lt`) for that object and calling `new` to request a new object of that type.\
    \ To send a message to the object, you state the name of the object and connect\
    \ it to the message request with a period (dot). From the standpoint of the user\
    \ of a predefined `class`, that’s pretty much all there is to programming with\
    \ objects. \n\nThe preceding diagram follows the format of the Unified Modeling\
    \ Language (UML). Each `class` is represented by a box, with the type name in\
    \ the top portion of the box, any data members that you care to describe in the\
    \ middle portion of the box, and the methods (the functions that belong to this\
    \ object, which receive any messages you send to that object) in the bottom portion\
    \ of the box. Often, only the name of the `class` and the public methods are shown\
    \ in UML design diagrams, so the middle portion is not shown, as in this case.\
    \ If you’re interested only in the class name, then the bottom portion doesn’t\
    \ need to be shown, either.\n\n## An object provides services:\n\nWhile you’re\
    \ trying to develop or understand a program design, one of the best ways to think\
    \ about objects is as “service providers.” Your program itself will provide services\
    \ to the user, and it will accomplish this by using the services offered by other\
    \ objects. Your goal is to produce (or even better, locate in existing code libraries)\
    \ a set of objects that provide the ideal services to solve your problem. \n\n\
    A way to start doing this is to ask, “If I could magically pull them out of a\
    \ hat, what objects would solve my problem right away?” For example, suppose you\
    \ are creating a bookkeeping program. You might imagine some objects that contain\
    \ pre-defined bookkeeping input screens, another set of objects that perform bookkeeping\
    \ calculations, and an object that handles printing of checks and invoices on\
    \ all different kinds of printers. Maybe some of these objects already exist,\
    \ and for the ones that don’t, what would they look like? What services would\
    \ those objects provide, and what objects would they need to fulfill their obligations?\
    \ If you keep doing this, you will eventually reach a point where you can say\
    \ either, “That object seems simple enough to sit down and write” or “I’m sure\
    \ that object must exist already.” This is a reasonable way to decompose a problem\
    \ into a set of objects. \n\nThinking of an object as a service provider has an\
    \ additional benefit: It helps to improve the cohesiveness of the object. High\
    \ cohesion is a fundamental quality of software design: It means that the various\
    \ aspects of a software component (such as an object, although this could also\
    \ apply to a method or a library of objects) “fit together” well. One problem\
    \ people have when designing objects is cramming too much functionality into one\
    \ object. For example, in your check printing module, you may decide you need\
    \ an object that knows all about formatting and printing. You’ll probably discover\
    \ that this is too much for one object, and what you need is three or more objects.\
    \ One object might be a catalog of all the possible check layouts, which can be\
    \ queried for information about how to print a check. One object or set of objects\
    \ can be a generic printing interface that knows all about different kinds of\
    \ printers (but nothing about bookkeeping—this one is a candidate for buying rather\
    \ than writing yourself). And a third object could use the services of the other\
    \ two to accomplish the task. Thus, each object has a cohesive set of services\
    \ it offers. In a good object-oriented design, each object does one thing well,\
    \ but doesn’t try to do too much. This not only allows the discovery of objects\
    \ that might be purchased (the printer interface object), but also produces new\
    \ objects that might be reused somewhere else (the catalog of check layouts).\
    \ \n\nTreating objects as service providers is a great simplifying tool. This\
    \ is useful not only during the design process, but also when someone else is\
    \ trying to understand your code or reuse an object. If they can see the value\
    \ of the object based on what service it provides, it makes it much easier to\
    \ fit it into the design. \n\nThe hidden implementation: \n"
  raw: 'An object has state, behavior and identity. 


    This means that an object can have internal data (which gives it state), methods
    (to produce behavior), and each object can be uniquely distinguished from every
    other object—to put this in a concrete sense, each object has a unique address
    in memory.


    An object has an interface:


    So, although what we really do in object-oriented programming is create new data
    types, virtually all object-oriented programming languages use the “class” keyword.
    When you see the word “type” think “class” and vice versa.


    Since a class describes a set of objects that have identical characteristics (data
    elements) and behaviors (functionality), a class is really a data type because
    a floating point number, for example, also has a set of characteristics and behaviors.
    The difference is that a programmer defines a class to fit a problem rather than
    being forced to use an existing data type that was designed to represent a unit
    of storage in a machine. You extend the programming language by adding new data
    types specific to your needs. The programming system welcomes the new classes
    and gives them all the care and type checking that it gives to built-in types. 


    The object-oriented approach is not limited to building simulations. Whether or
    not you agree that any program is a simulation of the system you’re designing,
    the use of OOP techniques can easily reduce a large set of problems to a simple
    solution.   


    Once a class is established, you can make as many objects of that class as you
    like, and then manipulate those objects as if they are the elements that exist
    in the problem you are trying to solve. Indeed, one of the challenges of object-oriented
    programming is to create a one-to one mapping between the elements in the problem
    space and objects in the solution space. 


    But how do you get an object to do useful work for you? There needs to be a way
    to make a request of the object so that it will do something, such as complete
    a transaction, draw something on the screen, or turn on a switch. And each object
    can satisfy only certain requests. The requests you can make of an object are
    defined by its interface, and the type is what determines the interface. A simple
    example might be a representation of a light bulb:


    ![](images/00009.jpeg)


    Light lt = new Light();


    lt.on();


    The interface determines the requests that you can make for a particular object.
    However, there must be code somewhere to satisfy that request. This, along with
    the hidden data, comprises the implementation. From a procedural programming standpoint,
    it’s not that complicated.


    A type has a method associated with each possible request, and when you make a
    particular request to an object, that method is called. This process is usually
    summarized by saying that you “send a message” (make a request) to an object,
    and the object figures out what to do with that message (it executes code). 


    Here, the name of the type/class is Light, the name of this particular Light object
    is lt, and the requests that you can make of a Light object are to turn it on,
    turn it off, make it brighter, or make it dimmer. You create a Light object by
    defining a “reference” (lt) for that object and calling new to request a new object
    of that type. To send a message to the object, you state the name of the object
    and connect it to the message request with a period (dot). From the standpoint
    of the user of a predefined class, that’s pretty much all there is to programming
    with objects. 


    The preceding diagram follows the format of the Unified Modeling Language (UML).
    Each class is represented by a box, with the type name in the top portion of the
    box, any data members that you care to describe in the middle portion of the box,
    and the methods (the functions that belong to this object, which receive any messages
    you send to that object) in the bottom portion of the box. Often, only the name
    of the class and the public methods are shown in UML design diagrams, so the middle
    portion is not shown, as in this case. If you’re interested only in the class
    name, then the bottom portion doesn’t need to be shown, either.


    An object provides services:


    While you’re trying to develop or understand a program design, one of the best
    ways to think about objects is as “service providers.” Your program itself will
    provide services to the user, and it will accomplish this by using the services
    offered by other objects. Your goal is to produce (or even better, locate in existing
    code libraries) a set of objects that provide the ideal services to solve your
    problem. 


    A way to start doing this is to ask, “If I could magically pull them out of a
    hat, what objects would solve my problem right away?” For example, suppose you
    are creating a bookkeeping program. You might imagine some objects that contain
    pre-defined bookkeeping input screens, another set of objects that perform bookkeeping
    calculations, and an object that handles printing of checks and invoices on all
    different kinds of printers. Maybe some of these objects already exist, and for
    the ones that don’t, what would they look like? What services would those objects
    provide, and what objects would they need to fulfill their obligations? If you
    keep doing this, you will eventually reach a point where you can say either, “That
    object seems simple enough to sit down and write” or “I’m sure that object must
    exist already.” This is a reasonable way to decompose a problem into a set of
    objects. 


    Thinking of an object as a service provider has an additional benefit:      It
    helps to improve the cohesiveness of the object. High cohesion is a fundamental
    quality of software design: It means that the various aspects of a software component
    (such as an object, although this could also apply to a method or a library of
    objects) “fit together” well. One problem people have when designing objects is
    cramming too much functionality into one object. For example, in your check printing
    module, you may decide you need an object that knows all about formatting and
    printing. You’ll probably discover that this is too much for one object, and that
    what you need is three or more objects. One object might be a catalog of all the
    possible check layouts, which can be queried for information about how to print
    a check. One object or set of objects can be a generic printing interface that
    knows all about different kinds of printers (but nothing about bookkeeping—this
    one is a candidate for buying rather than writing yourself). And a third object
    could use the services of the other two to accomplish the task. Thus, each object
    has a cohesive set of services it offers. In a good object-oriented design, each
    object does one thing well, but doesn’t try to do too much. This not only allows
    the discovery of objects that might be purchased (the printer interface object),
    but it also produces new objects that might be reused somewhere else (the catalog
    of check layouts). 


    Treating objects as service providers is a great simplifying tool. This is useful
    not only during the design process, but also when someone else is trying to understand
    your code or reuse an object. If they can see the value of the object based on
    what service it provides, it makes it much easier to fit it into the design. 


