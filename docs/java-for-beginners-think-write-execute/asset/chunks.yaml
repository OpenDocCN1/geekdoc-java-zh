    “一种不影响你编程思维方式的语言是不值得学习的。”

    ― 阿兰·J·珀利斯 (Alan J. Perlis)


    “计算机程序员是宇宙的创造者，他们是那个宇宙的唯一立法者。任何剧作家、导演或皇帝，无论多强大，都从未行使过如此绝对的权威来布置舞台或战场，并指挥如此忠心不渝的演员或军队。”

    ― 约瑟夫·魏森鲍姆 (Joseph Weizenbaum)


    “如果两者都是冻结的，那么在水上行走和根据规范开发软件都是容易的。”

    ― 埃德华·贝拉德 (Edward Berard)


    “Perl —— 唯一在 RSA 加密前后看起来完全一样的语言。”

    ― 基斯·博斯蒂克 (Keith Bostic)


    “你能学到的最糟糕的 own 就是你的第一门编程语言。”

    ― 艾兰·凯 (Alan Kay)


    “计算机就像小提琴。你可以想象一个新手先尝试留声机，然后是小提琴。他说，后者的听起来糟糕极了。这就是我们从人文主义者和大多数计算机科学家那里听过的论点。他们说，计算机程序对于特定用途很有用，但它们并不灵活。小提琴或打字机也是如此，直到你学会如何使用它们。”

    ― 马尔文·明斯基 (Marvin Minsky)


    “一个程序最重要的属性是它是否实现了用户的意图。”

    ― C.A.R. 霍尔 (C.A.R. Hoare)


    “面向对象的编程提供了一种编写‘面条代码’的可持续方法。它让你像积累一系列补丁一样来构建程序。”

    ― 保罗·格拉汉 (Paul Graham)，《黑客与画家：计算机时代的宏大思想》(Hackers & Painters: Big Ideas from the
    Computer Age)


    “四十岁时，我已经老到不能再当程序员了；写代码是年轻人的工作。”

    ― 米克尔·克莱顿 (Michael Crichton)，《猎物》(Prey)


    “说真的，一些优秀的编程是在纸上完成的。把它放入计算机只是一个次要细节。”

    ― 马克斯·卡纳特-亚历山大 (Max Kanat-Alexander)，《代码简单性：软件基础》(Code Simplicity: The Fundamentals
    of Software)


    “衡量程序员的标准不应该是他们的才智和逻辑，而应该是他们用例分析的完整性。”

    ― 阿兰·J·珀利斯 (Alan J. Perlis)


    “只有当我们训练自己在不将程序视为可执行代码片段的情况下思考程序时，进步才可能。”

    ― 埃德格·W·迪杰斯特拉 (Edsger W. Dijkstra)


    “不要因为你‘知道’它是能运行的，就忽略涉及 bug 的例程或代码段。证明它。在这一语境下、使用这些数据、使用这些边界条件来证明它。”

    ― 安德鲁·亨特 (Andrew Hunt)，《程序员实战之道：从行想法到大师》(The Pragmatic Programmer: From Journeyman
    to Master)


    “记住，代码实际上是是我们最终表达需求的语言。我们可能会创建接近需求的语言。我们可能会创建帮助我们解析和将这些需求组装成正式结构的工具。但我们永远无法消除必要的精确性——所以代码永远存在。”

    ― 罗伯特·C·马丁 (Robert C. Martin)


    “软件测试是一项像狩猎一样的运动，它是捕虫。”

    “事实证明，编程是很困难的。基本规则通常简单且清晰。但建立在规则之上的程序往往会变得足够复杂，以引入自身的规则和复杂性。在某种意义上，你正在建立自己的迷宫，你可能会迷失其中。”

    ― 玛里恩·哈弗贝克 (Marijn Haverbeke)


