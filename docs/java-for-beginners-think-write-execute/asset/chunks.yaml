  trans: "\n\n# 单维 Java 数组示例：\n\n让我们来看 Java 数组的简单示例，其中我们将对数组进行声明、实例化、初始化和遍历。\n\n```java\n\
    class Testarray{\n    public static void main(String args[]) {\n        int a[]=new\
    \ int[5]; // 声明和实例化\n        a[0]=10; // 初始化\n        a[1]=20;\n        a[2]=70;\n\
    \        a[3]=40;\n        a[4]=50;\n        // 打印数组\n        for(int i=0;i<a.length;i++)\
    \ // length 是数组的属性\n            System.out.println(a[i]);\n    }\n}\n```\n**输出：**\n\
    ```\n10\n20\n70\n40\n50\n```\n\n## Java 数组的声明、实例化和初始化：\n\n我们可以以下方式同时声明、实例化并初始化\
    \ Java 数组：\n\n```java\nint a[]={33,3,4,5}; // 声明、实例化和初始化\n```\n\n让我们来看打印此数组的简单示例。\n\
    \n```java\nclass Testarray1{\n    public static void main(String args[]) {\n \
    \       int a[]={33,3,4,5}; // 声明、实例化和初始化\n        // 打印数组\n        for(int i=0;i<a.length;i++)\
    \ // length 是数组的属性\n            System.out.println(a[i]);\n    }\n}\n```\n**输出：**\n\
    ```\n33\n3\n4\n5\n```\n\n## 在 Java 中将数组传递给方法：\n\n我们可以将 Java 数组传递给方法，这样可以在任何数组上重用相同的逻辑。让我们来看使用方法获取数组最小数字的简单示例。\n\
    \n```java\nclass Testarray2{\n    static void min(int arr[]) {\n        int min=arr[0];\n\
    \        for(int i=1;i<arr.length;i++)\n            if(min>arr[i])\n         \
    \       min=arr[i];\n        System.out.println(min);\n    }\n    public static\
    \ void main(String args[]) {\n        int a[]={33,3,4,5};\n        min(a); //\
    \ 将数组传递给方法\n    }\n}\n```\n**输出：**\n```\n3\n```\n\n## Java 中的多维数组：\n\n在这种情况下，数据是基于行和列的索引存储的（也称为矩阵形式）。\n\
    \n### 在 Java 中声明多维数组的语法：\n- `dataType[][] arrayRefVar;` (或)\n- `dataType [][]\
    \ arrayRefVar;` (或)\n- `dataType arrayRefVar[][];` (或)\n- `dataType [] arrayRefVar[];`\n\
    \n### 在 Java 中实例化多维数组的示例：\n```java\nint[][] arr=new int[3][3]; // 3 行 3 列\n```\n\
    \n### 在 Java 中初始化多维数组的示例：\n```java\narr[0][0]=1;\narr[0][1]=2;\narr[0][2]=3;\n\
    arr[1][0]=4;\narr[1][1]=5;\narr[1][2]=6;\narr[2][0]=7;\narr[2][1]=8;\narr[2][2]=9;\n\
    ```\n\n### Java 多维数组的示例：\n让我们来看声明、实例化、初始化和打印二维数组的简单示例。\n\n```java\nclass Testarray3{\n\
    \    public static void main(String args[]) {\n        // 声明并初始化 2D 数组\n     \
    \   int arr[][]={{1,2,3},{2,4,5},{4,4,5}};\n        // 打印 2D 数组\n        for(int\
    \ i=0;i<3;i++)\n            for(int j=0;j<3;j++){\n                System.out.print(arr[i][j]+\"\
    \ \");\n            System.out.println();\n    }\n}\n```\n**输出：**\n```\n1 2 3\
    \ \n2 4 5 \n4 4 5 \n```\n\n## 循环\n\n可能会出现需要执行某次代码块的情况。通常，语句是按顺序执行的：首先执行第一个语句，然后是第二个语句，依此类推。编程语言提供了各种控制结构，允许更复杂的路径。`loop`\
    \ 语句允许我们多次执行一个语句或一组语句，以下是大多数编程语言中循环语句的一般形式：\n\n![循环架构](img/0004.jpeg)\n\n### While\
    \ 循环：\n如果我们想在循环中多次运行特定的语句，我们需要另一种方法。为了实现这一点，Java 提供了另外关键字 `while` 和 `for`。`while`\
    \ 语句更容易使用。它只需要一个参数来确定是否继续执行。该语句与 `if` 语句有些相似，不同在于它在完成评估后会返回 `while` 语句的顶部。\n\n\
    `while` 循环的语法为：\n```java\nwhile(Boolean_expression) {\n    // 语句\n}\n```\n在这里，`statement(s)`\
    \ 可以是一个单独语句或一组语句。`condition` 可以是任何表达式，而 `true` 是任何非零值。在执行时，如果 `boolean_expression`\
    \ 的结果为 true，则将执行循环内部的操作。只要表达式的结果为 true，这种执行就会持续下去。当条件变为 false 时，程序控制将传递到循环紧后的下一行。\n\
    \n**流程图：**\n![While 循环](img/0005.jpeg)\n\n**示例：**\n```java\npublic class Test\
    \ {\n    public static void main(String args[]) {\n        int x = 10;\n     \
    \   while(x < 20) {\n            System.out.print(\"value of x : \" + x);\n  \
    \          System.out.println(\"\\n\");\n        }\n    }\n}\n```\n**输出：**\n```\n\
    value of x : 10\nvalue of x : 11\nvalue of x : 12\nvalue of x : 13\nvalue of x\
    \ : 14\nvalue of x : 15\nvalue of x : 16\nvalue of x : 17\nvalue of x : 18\nvalue\
    \ of x : 19\n```\n\n### For 循环：\n为了对循环执行获得更细致的控制，我们另一种选择。`for` 循环需要三个不同的语句。\n\n\
    **语法：**\n```java\nfor(initialization; condition; update) {\n    // 语句\n}\n```\n\
    这里是 Java 中 `for` 循环的执行方式：\n- 第一个语句是 `initialization`。\n- 第二个语句是 `condition`。\n\
    - 第三个语句是 `update`。\n- `initialization` 只执行一次。\n- `condition` 在每次循环会被评估。如果为 true，则执行循环体；如果为\
    \ false，循环终止。\n- `update` 在循环体之后执行，然后回到 `condition`。\n\n**流程图：**\n![For 循环](img/0006.jpeg)\n\
    \n**示例：**\n以下是 Java 中 `for` 循环的代码。\n```java\npublic class Test {\n    public static\
    \ void main(String args[]) {\n        for(int x = 10; x < 20; x = x + 1) {\n \
    \           System.out.print(\"value of x : \" + x);\n            System.out.print(\"\
    \\n\");\n        }\n    }\n}\n```\n**输出：**\n```\nvalue of x : 10\nvalue of x :\
    \ 11\nvalue of x : 12\nvalue of x : 13\nvalue of x : 14\nvalue of x : 15\nvalue\
    \ of x : 16\nvalue of x : 17\nvalue of x : 18\nvalue of x : 19\n```\n\n## 循环控制语句：\n\
    循环控制语句改变其正常执行顺序。当离开作用域时，在该作用域内创建的所有自动对象将被销毁。Java 支持以下控制语句：\n\n- Break 语句\n- Continue\
    \ 语句\n\n`break` 语句在 Java 语言有两种用法：\n- 当循环内部遇到 `break` 语句时，循环立即终止，程序控制恢复到循环后的下一个语句。\n\
    - 它可以终止 `switch` 语句中的 case（在下一章节介绍）。\n\n### Break 语句\n`break` 的语法是任何循环中的单个语句：\n\
    ```java\nbreak;\n```\n**流程图：**\n![Break 语句](img/0007.jpeg)\n\n**示例：**\n```java\n\
    public class Test {\n    public static void main(String args[]) {\n        int\
    \ [] numbers = {10, 20, 30, 40, 50};\n        for(int x : numbers ) {\n      \
    \      if( x == 30 ) {\n                break;\n            }\n            System.out.print(\
    \ x );\n            System.out.print(\"\\n\");\n        }\n    }\n}\n```\n**输出：**\n\
    ```\n10\n20\n```\n\n"
- fmt: "\nThe `continue` keyword can be used in any of the loop control structures.\
    \ It causes the loop to immediately jump to the next iteration of the loop.\n\n\
    - In a `for` loop, the `continue` keyword causes control to immediately jump to\
    \ the update statement.\n- In a `while` loop or `do/while` loop, control immediately\
    \ jumps to the Boolean expression.\n\n## Syntax\n\nThe syntax of a `continue`\
    \ is a single statement inside any loop —\n\n```java\ncontinue;\n```\n\n## Flow\
    \ Diagram\n\n![Java Continue Statement](images/00008.jpeg)\n\n## Example\n\n```java\n\
    public class Test {\n  public static void main(String args[]) {\n    int[] numbers\
    \ = {10, 20, 30, 40, 50};\n    for(int x : numbers) {\n      if(x == 30) {\n \
    \       continue;\n      }\n      System.out.print(x);\n      System.out.print(\"\
    \\n\");\n    }\n  }\n}\n```\n\n## Output\n\n```\n10\n20\n40\n50\n```\n\n## Classes\n\
    \nThe most important part of any Java program is the class. Classes here are not\
    \ the sort that students go to; rather, they are classes in terms of classification.\
    \ Classes in Java appear in several different forms. Some are called partial classes,\
    \ and some classes can even appear inside of another class; these classes are\
    \ called nested classes. A class is a collection of instructions and data. The\
    \ instructions can be referred to as functions or methods. The data stored in\
    \ a class is called a field or property. All of the naming aside, what’s important\
    \ is what classes do and how they’re used.\n\nClasses are flexible and easily\
    \ changed, but this flexibility is not without some complexity. As we’ve seen\
    \ before, the class declaration can contain a lot more than the following example.\
    \ However, much of the complexity comes later in this book, when needed.\n\nWhen\
    \ you approach a game or any sort of programming task it’s important to first\
    \ collect data, and then figure out how to use the data. In most programming paradigms\
    \ it’s best to start off with variables at the beginning of your new class. For\
    \ instance, in this pseudo code we might want to know what day it is before going\
    \ out:\n\n```java\nTime day = today;\nif (day == Friday) {\n  PartyTonight = true;\n\
    }\n```\n\nWe start off with getting a day, and then deciding what to do tonight\
    \ based on the day. We should refrain from partying and then checking what the\
    \ day is unless we want to show up for work late. We’ll go into more detail on\
    \ this topic later on, after we’ve learned about how to use a variable in a class\
    \ properly.\n\n## Introduction to Objects\n\nObject oriented programming (OOP)\
    \ was invented to associate data and logic into nicely packaged bundles of code.\
    \ When you write a class in Java you’re creating blueprints and instructions for\
    \ a new object. Any number of objects can then be constructed based on your blueprints.\
    \ Programmers use the term `instantiate` when talking about creating an object\
    \ from the class blueprint. Each instantiated object is an instance of the class\
    \ from which it was constructed. The class is not itself one of the instances\
    \ created by it. The newly created object contains all of the functions and data\
    \ written into the class.\n\nAll programming languages provide abstractions. It\
    \ can be argued that the complexity of the problems you’re able to solve is directly\
    \ related to the kind and quality of abstraction. By “kind” I mean, “What is it\
    \ that you are abstracting?” Assembly language is a small abstraction of the underlying\
    \ machine. Many so-called “imperative” languages that followed (such as FORTRAN,\
    \ BASIC, and C) were abstractions of assembly language. These languages are big\
    \ improvements over assembly language, but their primary abstraction still requires\
    \ you to think in terms of the structure of the computer rather than the structure\
    \ of the problem you are trying to solve.\n\nThe programmer must establish the\
    \ association between the machine model (in the “solution space,” which is the\
    \ place where you’re implementing that solution, such as a computer) and the model\
    \ of the problem that is actually being solved (in the “problem space,” which\
    \ is the place where the problem exists, such as a business). The effort required\
    \ to perform this mapping, and the fact that it is extrinsic to the programming\
    \ language, produces programs that are difficult to write and expensive to maintain,\
    \ and as a side effect created the entire “programming methods” industry.\n\n\
    The alternative to modeling the machine is to model the problem you’re trying\
    \ to solve. Early languages such as LISP and APL chose particular views of the\
    \ world (“All problems are ultimately lists” or “All problems are algorithmic,”\
    \ respectively). Prolog casts all problems into chains of decisions. Languages\
    \ have been created for constraint-based programming and for programming exclusively\
    \ by manipulating graphical symbols. (The latter proved to be too restrictive.)\n\
    \nEach of these approaches may be a good solution to the particular class of problem\
    \ they’re designed to solve, but when you step outside of that domain they become\
    \ awkward.\n\nThe object-oriented approach goes a step further by providing tools\
    \ for the programmer to represent elements in the problem space. This representation\
    \ is general enough that the programmer is not constrained to any particular type\
    \ of problem. We refer to the elements in the problem space and their representations\
    \ in the solution space as “objects.” (You will also need other objects that don’t\
    \ have problem-space analogs.)\n\nThe idea is that the program is allowed to adapt\
    \ itself to the lingo of the problem by adding new types of objects, so when you\
    \ read the code describing the solution, you’re reading words that also express\
    \ the problem. This is a more flexible and powerful language abstraction than\
    \ what we’ve had before. Thus, OOP allows you to describe the problem in terms\
    \ of the problem, rather than in terms of the computer where the solution will\
    \ run. There’s still a connection back to the computer: Each object looks quite\
    \ a bit like a computer—it has a state, and it has operations that you can perform.\
    \ However, this doesn’t seem like such a bad analogy to objects—they all have\
    \ characteristics and behaviors.\n\nTo simply put, OOP is the process of building\
    \ objects, instancing, and then using them. Using objects involves reading data,\
    \ using logic on the data, and then carrying out tasks.\n\n## Characteristics\
    \ of object-oriented programming\n\nThese characteristics represent a pure approach\
    \ to object-oriented programming:\n\n1. **Everything is an object.** Think of\
    \ an object as a fancy variable; it stores data, but you can `make requests` to\
    \ it. In theory, you can take any conceptual component in the problem you’re trying\
    \ to solve (dogs, buildings, services, etc.) and represent it as an object in\
    \ your program.\n2. **A program is a bunch of objects telling each other what\
    \ to do by sending messages.** To make a request of an object, you `send a message`\
    \ to that object. More concretely, you can think of a message as a request to\
    \ call a `method` that belongs to a particular object.\n3. **Each object has its\
    \ own memory made up of other objects.** Put another way, you create a new kind\
    \ of object by making a package containing existing objects. Thus, you can build\
    \ complexity into a program while hiding it behind the simplicity of objects.\n\
    4. **Every object has a type.** Using the parlance, each object is an instance\
    \ of a `class`, in which “class” is synonymous with “type.” The most important\
    \ distinguishing characteristic of a class is “What messages can you send to it?”\n\
    5. **All objects of a particular type can receive the same messages.** This is\
    \ actually a loaded statement, as you will see later. Because an object of type\
    \ “circle” is also an object of type “shape,” a circle is guaranteed to accept\
    \ shape messages. This means you can write code that talks to shapes and automatically\
    \ handle anything that fits the description of a shape. This substitutability\
    \ is one of the powerful concepts in OOP.\n\nEven more succinct description of\
    \ an object is:\n"
