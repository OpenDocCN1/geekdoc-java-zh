    在写故事时，我们将一组句子称为一个段落。代码块中的语句相互工作以完成一项任务。


    ### 代码是如何执行的


    当创建一个类时，它所有的指令并不是同时执行的。正如之前所解释过的，类中的每个部分集合都由被称为“语句”的文本行组成。每条语句按顺序执行。计算机从哪里开始通常取决于被告知从哪个语句集合开始。你负责代码如何启动。


    Java 为我们提供了一个名为 `Main()` 的函数，我们稍后会介绍。然而，这是使用 Java 开始代码的首选位置。一旦调用了 `Main()`，计算机就会跳转到
    `Main()` 中的第一行并开始执行那里编写的指令。当计算机到达每条语句时，它从语句的左侧开始，向右侧处理。基本上，计算机读取代码就像你阅读这个句子一样。


    ### 学习复制与粘贴


    “优秀的艺术家在创造，伟大的艺术家在窃取。”有很多代码示例供你复制并粘贴到项目中。本书的内容以及所有可下载的内容也无二。这意味着你必须理解代码在做什么，才能将其解释并以适应你的需求。


    每个程序员都会习惯性地这样做。


    ![image](img/00016.jpeg)


    学习如何这样做非常重要，因为在很多情况下你实际上需要这样做——不仅是为了学习，而且是为了完成任何陌生的任务。编程是一个不断学习的过程。它是命令计算机的语言。


    每当你学习一种新语言时，会有大量的词是你必须查询的。


    再加上每个程序员都可以创造新词的事实，你就有了一种你永远需要字典的语言。


    当显示某些代码时，你会被要求将代码复制到你的项目中。当你的手指准备好放在键盘上，你会养成打字的习惯。


    程序员通常是打字高手是有原因的。这也是为什么程序员对他们偏好的键盘非常挑剔的原因。在大多数情况下，书中的项目将处于你可以阅读已经存在的文本的状态。


    大多数项目处于更完整的状态，你能够运行它们并看到预期的结果。作为一个程序员，我已经习惯了在互联网上搜索示例代码。


    一旦我发现了看起来很有用的东西，我会复制那些代码并粘贴到一个简单的测试用例中。在我理解了代码在做什么之后，我会将其重写为更适合我特定用例的形式。


    即使代码涉及一些有趣的技巧，我也会从该代码中学习。


    随着我学习新的技巧，我作为程序员也成长了。学习新技巧的唯一方法是找到必要性去解决一个我尚未想出解决方案的新问题。寻找问题的解决方案是成为程序员的基本部分。


    ### 理解浮点数


    浮点数多年来一直是计算机的焦点。获得浮点精度是许多早期计算机科学家的目标。因为小数点后可以跟的数字数量有无限可能，因此使用二进制计算无法真正、完整地表示任何分数。


    一个常见的例子是 $\pi$，我们称其为 `pi`。假设 `3.14` 之后有无尽的数字。即使在今天，计算机被用来计算小数点后数以百计万亿位的数字。


    计算机预留了浮点数的某些位来表示小数点在数字中的出现位置，但即使这样也是受限的。第一位通常是符号位，设置数字的负范围或正范围。随后的 8 位是该数字的指数，被称为
    `mantissa`（尾数）。剩余的位是出现在小数点周围的数字。一个 `float` 值可以在任何方向移动小数点 38 位，但它受限于其能够存储的值。


    在没有特殊考虑的情况下，计算机无法处理任意大的数字。要将 `float` 强制转换为 `int`，你需要更显式一些。


    这就是为什么 Java 要求你使用强制转换，你需要添加 `(int)`：


    ```

    int Zint = (int)Zmove;

    ```


    `(int)` 是一个强制转换运算符；或者说 `(type)`充当从右侧类型到左侧所需类型的转换器。


    ### 大 O 表示法


    大 O 表示法是我们用来阐述算法运行所需多时间的语言。它是我们用来比较解决问题的不同方法的效率的方式。


    假设你有一个 10 个对象的列表，你想按顺序对它们进行排序。有一系列算法可以来实现这一点，但并不是所有算法都是平等的。有些算法比其他算法快，但更重要的是，算法的速度取决于它处理的项数量。大
    O 是一种衡量算法扩展性的一种方法。大 O 指的是算法的复杂程度。


    大 O 使用类似 `O(n)` 的符号表示。`O` 仅仅表示我们正在谈论大 O，你可以忽略它（至少在面试的目的上）。


    下面是按扩展性优坏顺序排序的大 O 复杂度列表：


    -   **O(1) / 常数复杂度**：常数。这意味着无论数据集的大小如何，算法总是花费常数时间。1 个项目需要 1 秒，10 个需要 1 秒，100 个需要
    1 秒。它总是花费相同的时间。

    -   **O(log n) / 对数复杂度**：没有常数好，但仍然很好。时间随数据集的增大而增加，但不是比例增加。这意味着相对于较大的数据集，算法在较小数据集上花费更多。1
    个需要 1 秒，10 个需要 2 秒，100 个需要 3 秒。如果你的数据集有 10 个，每项导致 0.2 秒。如果你的数据集有 100 个，每项只需要 0.03
    秒。这使得对数算法具有良好的扩展性。

    -   **O(n) / 线性复杂度**：数据集越大，所需时间越按比例增长。1 个需要 1 秒，10 个需要 10 秒，100 个需要 100 秒。

    -   **O(n log n)**：前两者的良好结合。通常排序有两个部分，第一个循环是 `O(n)`，第二个是 `O(log n)`，组合形成 `O(n
    log n)`。1 个需要 2 秒，10 个需要 12 秒，100 个需要 103 秒。

    -   **O(n²) / 平方复杂度**：事情变得格外缓慢了。1 个需要 1 秒，10 个需要 100，100 个需要 10000。

    -   **O(2^n) / 指数级增长！**：每增加一个元素，算法时间就会翻倍。1 个需要 1 秒，10 个需要 1024 秒，100 个需要 1267650600228229401496703205376
    秒。


    希望你到为止还能跟上，但让我们深入研究一些排序和搜索的示例算法。重点是要能够解释算法的复杂度。面试官喜欢让候选人设计算法，然后询问它的复杂度是多少。

