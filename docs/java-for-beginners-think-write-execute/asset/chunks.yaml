  trans: "\n带有多个参数的函数可以执行更多操作。值参数是将数据传入函数以完成某些简单任务的有效方法。\n\n# 逻辑与运算符\n\n逻辑允许你根据变量的变化来控制函数的哪些部分被执行。通过逻辑，你将能够改变代码中哪些语句将运行。简单来说，你写的任何内容必须涵盖你计划覆盖的每种情况。逻辑通过几个简单的系统控制，主要是\
    \ `if` 关键字以及 `if` 的各种变体。\n\n### 布尔值\nJava 中的布尔值，简称为 `bools`，非 `true`（真）即 `false`（假）。最简单的方法是将它们想为开启或关闭状态的开关。要将一个\
    \ `var` 声明为 `bool`，你可以使用下面的代码。\n\n```java\npublic class Example\n{\n    public\
    \ bool SomeBool;\n}\n```\n\n### 等于运算符\n相等运算符创建布尔条件。设置布尔变量有许多方法。例如，值之间的比较是设置变量的有用手段。确定相等的最基本方法是使用以下运算符：`==`。单等号和双等号符号的使用是有区别的。`=`\
    \ 用于赋值，而 `==` 用于比较值。\n\n当你需要比较两个值时，可以使用以下概念。如果你需要和程序员交流，需要记住这些运算符被称为相等运算符。\n\n\
    这里的语法最初看起来可能有些困惑，但有解决办法。\n\n```java\nvoid Func ()\n{ \n    SomeBool = (1 == 1);\n\
    }\n```\n\n还有其他需要注意的运算符。你将在本章稍后部分介绍其他逻辑运算符。在这种情况下，我们正在询问两个数值是否相同。为了让这更清晰，我们可以将代码分成更多行。现在，我们正在比较\
    \ `a` 和 `b`。显然，它们看起来并不相同；毕竟是不同的字母。然而，它们确实包含相同的整数值，而这正是这里真正比较的内容。\n\n```java\n\
    void Func ()\n{\n    int a = 1;\n    int b = 1;\n    SomeBool = (a == b);\n}\n\
    ```\n\n评估有左侧和右侧。单等号运算符（`=`）分隔了不同的侧。`=` 的左侧被计算，并查看右侧的值以获取赋值。因为 `1 == 1`，也就是说 `1`\
    \ 等于 `1`，该语句的最终结果是 `SomeBool` 为 `true`。\n\n### 关系运算符\n布尔值也可以通过比较值来设置。比较两个不同值的运算符被称为关系运算符。我们使用\
    \ `==`（等于）来检查值是否相同；我们也可以使用 `!=`（不等于）来检查两个变量是否不同。\n\n它的工作原理与上一节中的 `!` 类似。程序员更多地检查一个值是否大于或小于另一个值。他们通过使用\
    \ `>`（大于）和 `<`（小于）这样做。我们还可以使用 `>=`（大于等于）和 `<=`（小于等于）。让我们来看看这种用法的一些示例。\n\n```java\n\
    public class Test {\n    public static void main(String args[]) {\n        int\
    \ a = 10;\n        int b = 20;\n        System.out.println(\"a == b = \" + (a\
    \ == b));\n        System.out.println(\"a != b = \" + (a != b));\n        System.out.println(\"\
    a > b = \" + (a > b));\n        System.out.println(\"a < b = \" + (a < b));\n\
    \        System.out.println(\"b >= a = \" + (b >= a));\n        System.out.println(\"\
    b <= a = \" + (b <= a));\n    }\n}\n```\n\n**输出：**\n```\na == b = false\na !=\
    \ b = true\na > b = false\na < b = true\nb >= a = true\nb <= a = false\n```\n\n\
    ### Return 关键字\n我们需要喜爱 `return` 关键字。这个关键字将函数转换为数据。在它生效之前，需要满足一些条件。到目前，我们一直在使用\
    \ `void` 关键字来声明函数的返回类型。它看起来像下面的代码片段。\n\n```java\nvoid MyFunction()\n{\n    //此处是代码...\n\
    }\n```\n\n在这种情况下，使用 `return` 将非常简单。\n\n```java\nvoid MyFunction()\n{\n    //此处是代码\
    \ ...\n    return;\n}\n```\n\n此函数返回 `void`。这条语句具有更深层的含义。当实际上返回一个真实值（void 以外的某种东西）时，返回一个值才有意义。让我们来看一个更有意义的函数。函数声明开头的\
    \ `void` 关键字意味着此函数没有返回类型。如果我们更改声明，我们需要确保有一个与声明匹配的返回值。这可以像下面的代码片段一样简单。\n\n```java\n\
    int MyFunction()\n{\n    //此处是代码...\n    return 1; // 1 是一个 int\n}\n```\n\n此函数返回\
    \ `int`  `1`。声明带有返回值的函数要求返回类型与声明匹配。当使用该函数时，它应该被视为与函数返回类型匹配的数据类型。\n\n# 类/静态变量\n\
    类变量也称为静态变量，使用 `static` 关键字在类中声明，但在方法、构造函数或块之外。无论创建了多少个对象，每个类只有一个类变量副本。\n\n静态变量在程序启动时创建，在程序停止时销毁。可见性与实例变量相似。数字的默认值为\
    \ `0`；布尔值为 `false`；对象引用为 `null`。\n\n示例：\n\n```java\nimport java.io.*;\n\npublic\
    \ class Employee {\n    // salary 变量是静态变量\n    private static double salary;\n\
    \    // DEPARTMENT 是常量\n    public static final String DEPARTMENT = \"Development\
    \ \";\n\n    public static void main(String args[]) {\n        salary = 1000;\n\
    \        System.out.println(DEPARTMENT + \"average salary:\" + salary);\n    }\n\
    }\n```\n**输出：**\nDevelopment average salary:1000\n\n注意：如果从外部类访问，常量应通过 `Employee.DEPARTMENT`\
    \ 访问。\n\n# 数组\n数组是组织良好的数据列表。想象从零开始的编号列表，每向列表添加内容时就会扩展一行。数组对于任何情况都很有用，因为它们被视为单个数据块。例如，如果你想存储一组高分，你会想用数组来实现。最初，你可能想要一个包含\
    \ 10 个元素的列表。理论上，你可以使用以下代码来存储每个分数。\n\n```java\nint score1;\nint score2;\nint score3;\n\
    int score4;\nint score5;\nint score6;\nint score7;\nint score8;\nint score9;\n\
    int score10;\n```\n\n更糟糕的是，如果你需要处理每个值，你需要创建一个按变量名处理每个变量的代码。为了检查 `score2` 是否大于\
    \ `score1`，你需要编写一个专门用于检查这两个变量的函数，以便交换它们。谢天谢地有数组。\n\n数组有两种类型：\n*   一维数组\n*   多维数组\n\
    \n### Java 中的一维数组\n在 Java 中声明数组的语法：\n`dataType[] arr;` (或)\n`dataType [] arr;`\
    \ (或)\n`dataType arr[];`\n\n在 Java 中实例化数组：\n`arrayRefVar=new datatype[size];`\n"
- fmt: "\n# Example of single dimensional java array:\n\nLet's see the simple example\
    \ of java array, where we are going to declare, instantiate, initialize and traverse\
    \ an array.\n\n```java\nclass Testarray{\n    public static void main(String args[])\
    \ {\n        int a[]=new int[5]; // declaration and instantiation\n        a[0]=10;\
    \ // initialization\n        a[1]=20;\n        a[2]=70;\n        a[3]=40;\n  \
    \      a[4]=50;\n        // printing array\n        for(int i=0;i<a.length;i++)\
    \ // length is the property of array\n            System.out.println(a[i]);\n\
    \    }\n}\n```\n**Output:**\n```\n10\n20\n70\n40\n50\n```\n\n## Declaration, Instantiation\
    \ and Initialization of Java Array:\n\nWe can declare, instantiate and initialize\
    \ the java array together by:\n\n```java\nint a[]={33,3,4,5}; // declaration,\
    \ instantiation and initialization\n```\n\nLet's see the simple example to print\
    \ this array.\n\n```java\nclass Testarray1{\n    public static void main(String\
    \ args[]) {\n        int a[]={33,3,4,5}; // declaration, instantiation and initialization\n\
    \        // printing array\n        for(int i=0;i<a.length;i++) // length is the\
    \ property of array\n            System.out.println(a[i]);\n    }\n}\n```\n**Output:**\n\
    ```\n33\n3\n4\n5\n```\n\n## Passing Array to method in java:\n\nWe can pass the\
    \ java array to method so that we can reuse the same logic on any array. Let's\
    \ see the simple example to get minimum number of an array using method.\n\n```java\n\
    class Testarray2{\n    static void min(int arr[]) {\n        int min=arr[0];\n\
    \        for(int i=1;i<arr.length;i++)\n            if(min>arr[i])\n         \
    \       min=arr[i];\n        System.out.println(min);\n    }\n    public static\
    \ void main(String args[]) {\n        int a[]={33,3,4,5};\n        min(a); //\
    \ passing array to method\n    }\n}\n```\n**Output:**\n```\n3\n```\n\n## Multidimensional\
    \ array in java:\n\nIn such case, data is stored in row and column based index\
    \ (also known as matrix form).\n\n### Syntax to Declare Multidimensional Array\
    \ in java:\n- `dataType[][] arrayRefVar;` (or)\n- `dataType [][] arrayRefVar;`\
    \ (or)\n- `dataType arrayRefVar[][];` (or)\n- `dataType [] arrayRefVar[];`\n\n\
    ### Example to instantiate Multidimensional Array in java:\n```java\nint[][] arr=new\
    \ int[3][3]; // 3 row and 3 column\n```\n\n### Example to initialize Multidimensional\
    \ Array in java:\n```java\narr[0][0]=1;\narr[0][1]=2;\narr[0][2]=3;\narr[1][0]=4;\n\
    arr[1][1]=5;\narr[1][2]=6;\narr[2][0]=7;\narr[2][1]=8;\narr[2][2]=9;\n```\n\n\
    ### Example of Multidimensional java array:\nLet's see the simple example to declare,\
    \ instantiate, initialize and print the 2Dimensional array.\n\n```java\nclass\
    \ Testarray3{\n    public static void main(String args[]) {\n        // declaring\
    \ and initializing 2D array\n        int arr[][]={{1,2,3},{2,4,5},{4,4,5}};\n\
    \        // printing 2D array\n        for(int i=0;i<3;i++)\n            for(int\
    \ j=0;j<3;j++){\n                System.out.print(arr[i][j]+\" \");\n        \
    \    System.out.println();\n    }\n}\n```\n**Output:**\n```\n1 2 3 \n2 4 5 \n\
    4 4 5 \n```\n\n## Loop\n\nThere may be a situation when you need to execute a\
    \ block of code several number times. In general, statements are executed sequentially:\
    \ the first statement is executed first, followed by the second, and so on. Programming\
    \ languages provide various control structures that allow for more complicated\
    \ paths. A `loop` statement allows us to execute a statement or group of statements\
    \ multiple times and following is the general form of loop statement in most of\
    \ programming languages:\n\n![Loop Architecture](images/0004.jpeg)\n\n### While\
    \ loop:\nIf we want to run a specific statement more than once in a loop, we need\
    \ another method. To do this, java comes with another couple of keywords `while`\
    \ and `for`. The `while` statement is easier to use. It needs only one argument\
    \ to determine if it should continue to execute. This statement is somewhat like\
    \ the `if` statement, only that it returns to the top of the `while` statement\
    \ when it’s done with its evaluations.\n\nThe syntax of `while` loop is:\n```java\n\
    while(Boolean_expression) {\n    // Statements\n}\n```\nHere, `statement(s)` may\
    \ be a single statement or block of statements. The `condition` may be any expression,\
    \ and `true` is any non zero value. When executing, if `boolean_expression` result\
    \ is true, then the actions inside the loop will be executed. This will continue\
    \ as long as the expression result is true. When the condition becomes false,\
    \ program control passes to the line immediately following the loop.\n\n**Flow\
    \ Diagram:**\n![Java While Loop](images/00005.gif)\nHere, key point of the `while`\
    \ loop is that the loop might not run. When the expression is tested and the result\
    \ is false, the loop body will be skipped and the first statement after the while\
    \ loop will be executed.\n\n**Example:**\n```java\npublic class Test {\n    public\
    \ static void main(String args[]) {\n        int x = 10;\n        while( x < 20\
    \ ) {\n            System.out.print(\"value of x : \" + x );\n            System.out.print(\"\
    \\n\");\n        }\n    }\n}\n```\n**Output:**\n```\nvalue of x : 10\nvalue of\
    \ x : 11\nvalue of x : 12\nvalue of x : 13\nvalue of x : 14\nvalue of x : 15\n\
    value of x : 16\nvalue of x : 17\nvalue of x : 18\nvalue of x : 19\n```\n\n###\
    \ For Loop:\nTo gain a bit more control over the execution of a loop, we have\
    \ another option. The `for` loop requires three different statements to operate.\
    \ The first statement is called an `initialization`, the second is a `condition`,\
    \ and the third is an `operation`.\n\n**Syntax:**\n```java\nfor(initialization;\
    \ Boolean_expression; update) {\n    // Statements\n}\n```\nHere is the flow of\
    \ control in a `for` loop:\n- The `initialization` step is executed first, and\
    \ only once. This step allows you to declare and initialize any loop control variables\
    \ and this step ends with a semicolon (`;`).\n- Next, the `Boolean expression`\
    \ is evaluated. If it is true, the body of the loop is executed. If it is false,\
    \ the body of the loop will not be executed and control jumps to the next statement\
    \ past the `for` loop.\n- After the `body` of the `for` loop gets executed, the\
    \ control jumps back up to the `update` statement. This statement allows you to\
    \ update any loop control variables. This statement can be left blank with a semicolon\
    \ at the end.\n- The `Boolean expression` is now evaluated again. If it is true,\
    \ the loop executes and the process repeats (body of loop, then update step, then\
    \ Boolean expression). After the `Boolean expression` is false, the `for` loop\
    \ terminates.\n\n**Flow Diagram:**\n![Java For Loop](images/0006.gif)\n\n**Example:**\n\
    Following is an example code of the `for` loop in Java.\n```java\npublic class\
    \ Test {\n    public static void main(String args[]) {\n        for(int x = 10;\
    \ x < 20; x = x + 1) {\n            System.out.print(\"value of x : \" + x );\n\
    \            System.out.print(\"\\n\");\n        }\n    }\n}\n```\n**Output:**\n\
    ```\nvalue of x : 10\nvalue of x : 11\nvalue of x : 12\nvalue of x : 13\nvalue\
    \ of x : 14\nvalue of x : 15\nvalue of x : 16\nvalue of x : 17\nvalue of x : 18\n\
    value of x : 19\n```\n\n## Loop Control Statements:\nLoop control statements change\
    \ execution from its normal sequence. When execution leaves a scope, all automatic\
    \ objects that were created in that scope are destroyed. Java supports the following\
    \ control statements:\n\n- Break Statement\n- Continue Statement\n\nThe `break`\
    \ statement in Java programming language has the following two usages:\n- When\
    \ the `break` statement is encountered inside a loop, the loop is immediately\
    \ terminated and the program control resumes at the next statement following the\
    \ loop.\n- It can be used to terminate a case in the `switch` statement (covered\
    \ in the next chapter).\n\n### Break Statement\nThe syntax of a `break` is a single\
    \ statement inside any loop:\n```java\nbreak;\n```\n**Flow Diagram:**\n![Java\
    \ Break Statement](images/0007.jpeg)\n\n**Example:**\n```java\npublic class Test\
    \ {\n    public static void main(String args[]) {\n        int [] numbers = {10,\
    \ 20, 30, 40, 50};\n        for(int x : numbers ) {\n            if( x == 30 )\
    \ {\n                break;\n            }\n            System.out.print( x );\n\
    \            System.out.print(\"\\n\");\n        }\n    }\n}\n```\n**Output:**\n\
    ```\n10\n20\n```\n"
