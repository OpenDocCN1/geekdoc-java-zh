    create new data types) and client programmers4 (the class consumers who use the
    data types in their applications). The goal of the client programmer is to collect
    a toolbox full of classes to use for rapid application development. The goal of
    the class creator is to build a class that exposes only what’s necessary to the
    client programmer and keeps everything else hidden. Why? Because if it’s hidden,
    the client programmer can’t access it, which means that the class creator can
    change the hidden portion at will without worrying about the impact on anyone
    else. The hidden portion usually represents the tender insides of an object that
    could easily be corrupted by a careless or uninformed client programmer, so hiding
    the implementation reduces program bugs. 


    In any relationship it’s important to have boundaries that are respected by all
    parties involved. When you create a library, you establish a relationship with
    the client programmer, who is also a programmer, but one who is putting together
    an application by using your library, possibly to build a bigger library. If all
    the members of a class are available to everyone, then the client programmer can
    do anything with that class and there’s no way to enforce rules. Even though you
    might really prefer that the client programmer not directly


    manipulate some of the members of your class, without access control there’s no
    way to prevent it. Everything’s naked to the world. 


    So the first reason for access control is to keep client programmers’ hands off
    portions they shouldn’t touch—parts that are necessary for the internal operation
    of the data type but not part of the interface that users need in order to solve
    their particular problems. This is actually a service to client programmers because
    they can easily see what’s important to them and what they can ignore. 


    The second reason for access control is to allow the library designer to change
    the internal workings of the class without worrying about how it will affect the
    client programmer. For example, you might implement a particular class in a simple
    fashion to ease development, and then later discover that you need to rewrite
    it in order to make it run faster. If the interface and implementation are clearly
    separated and protected, you can accomplish this easily. 


    Java uses three explicit keywords to set the boundaries in a class: public, private,
    and protected. These access specifiers determine who can use the definitions that
    follow. public means the following element is available to everyone. The private
    keyword, on the other hand, means that no one can access that element except you,
    the creator of the type, inside methods of that type. private is a brick wall
    between you and the client programmer. Someone who tries to access a private member
    will get a compile-time error. The protected keyword acts like private, with the
    exception that an inheriting class has access to protected members, but not private
    members. Inheritance will be introduced shortly. 


    Java also has a “default” access, which comes into play if you don’t use one of
    the aforementioned specifiers. This is usually called package access because classes
    can access the members of other classes in the same package (library component),
    but outside of the package those same members appear to be private. 


    Reusing the implementation:


    Once a class has been created and tested, it should (ideally) represent a useful
    unit of code. It turns out that this reusability is not nearly so easy to achieve
    as many would hope; it takes experience and insight to produce a reusable object
    design. But once you have such a design, it begs to be reused. Code reuse is one
    of the greatest advantages that object-oriented programming languages provide. 


    The simplest way to reuse a class is to just use an object of that class directly,
    but you can also place an object of that class inside a new class. We call this
    “creating a member object.” Your new class can be made up of any number and type
    of other objects, in any combination that you need to achieve the functionality
    desired in your new class. Because you are composing a new class from existing
    classes, this concept is called composition (if the composition happens dynamically,
    it’s usually called aggregation). Composition is often referred to as a “has-a”
    relationship, as in “A car has an engine.” 


    ![](images/00010.jpeg)


    (This UML diagram indicates composition with the filled diamond, which states
    there is one car. I will typically use a simpler form: just a line, without the
    diamond, to indicate an association.5) 


    Composition comes with a great deal of flexibility. The member objects of your
    new class are typically private, making them inaccessible to the client programmers
    who are using the class. This allows you to change those members without disturbing
    existing client code. You can also change the member objects at run time, to dynamically
    change the behavior of your program. Inheritance, which is described next, does
    not have this flexibility since the compiler must place compile-time restrictions
    on classes created with inheritance. 


    Because inheritance is so important in object-oriented programming, it is often
    highly emphasized, and the new programmer can get the idea that inheritance should
    be used everywhere. This can result in awkward and overly complicated designs.
    Instead, you should first look to composition when creating new classes, since
    it is simpler and more flexible. If you take this approach, your designs will
    be cleaner. Once you’ve had some experience, it will be reasonably obvious when
    you need inheritance. 


    Inheritance:


    By itself, the idea of an object is a convenient tool. It allows you to package
    data and functionality together by concept, so you can represent an appropriate
    problem-space idea rather than being forced to use the idioms of the underlying
    machine. These concepts are expressed as fundamental units in the programming
    language by using the class keyword. 


    It seems a pity, however, to go to all the trouble to create a class and then
    be forced to create a brand new one that might have similar functionality. It’s
    nicer if we can take the existing class, clone it, and then make additions and
    modifications to the clone. This is effectively what you get with inheritance,
    with the exception that if the original class (called the base class or superclass
    or parent class) is changed, the modified “clone” (called the derived class or
    inherited class or subclass or child class) also reflects those changes.  


    ![](images/00011.jpeg)


    (The arrow in this UML diagram points from the derived class to the base class.
    As you will see, there is commonly more than one derived class.) 


    A type does more than describe the constraints on a set of objects; it also has
    a relationship with other types. Two types can have characteristics and behaviors
    in common, but one type may contain more characteristics than another and may
    also handle more messages (or handle them differently). Inheritance expresses
    this similarity between types by using the concept of base types and derived types.
    A base type contains all of the characteristics and behaviors that are shared
    among the types derived from it. You create a base type to represent the core
    of your ideas about some objects in your system. From the base type, you derive
    other types to express the different ways that this core can be realized. '
