    increases so does the access time in proportion.


    ### 4. O(n log n)


    The best example of O(n log n) is a merge sort. This is a divide and conquer algorithm.
    Imagine you have a list of integers. We divide the list in two again and again
    until we are left with with a number of lists with 1 item in: each of these lists
    is therefore sorted.We then merge each list with it’s neighbour (comparing the
    first elements of each every time). We repeat this with the new composite list
    until we have our sorted result.


    ## How to figure out Big O in an interview?


    This is not an exhaustive list of Big O.  Much as you can O(n2), you can also
    have O(n^3) (imagine throwing an extra loop into your bubble sort for no apparent
    reason).  What the list on this page should allow you to do is have a stab in
    the dark at figuring out what the big O of an algorithm is.  If someone is asking
    you this during an interview they probably want to see how you try and figure
    it out. Break down the loops and processing.


    *   Does it have to go through the entire list? There will be an n in there somewhere.


    *   Does the algorithms processing time increase at a slower rate than the size
    of the data set? Then there’s probably a log n in there.


    *   Are there nested loops? You’re probably looking at n^2 or n^3.


    *   Is access time constant irrelevant of the size of the dataset?? O(1)


