    added.  1 item takes 1 second, 10 items takes 1024 seconds, 100 items takes 1267650600228229401496703205376
    seconds.


    Examples:


    Hopefully you’re with me so far, but let’s dive into some example algorithms for
    sorting and searching.  The important thing is to be able to explain what complexity
    an algorithm is.  Interviewers love to get candidates to design algorithms and
    then ask what the complexity of it is.


