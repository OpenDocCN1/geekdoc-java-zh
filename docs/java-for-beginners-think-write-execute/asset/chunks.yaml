    CHAPTER 1 | Introduction


    What This Book Is About


    This book was written as an answer for anyone to pick up a programming language
    and be productive. You will be able to start from scratch without having any previous
    exposure to any programming language. By the end of this book, you will have the
    skills to be a capable programmer, or at least know what is involved with how
    to read and write code. Afterward you should be armed with the knowledge required
    to feel confident in learning more. You should have general computer skills before
    you get started. After this you’ll know what it takes to at least look at code
    without your head spinning.


    Why Read This Book?


    You could go online and find videos and tutorials to learn; however, there is
    a distinct disadvantage when it comes to learning things in order and in one place.


    Most YouTube or tutorial websites either gloss over a topic or dwell at a turtle’s
    pace for an hour on a particular subject. Online content is often brief and doesn’t
    go into much depth on any given topic. It is incomplete or still a work in progress.
    You’ll often find yourself waiting weeks for another video or tutorial to come
    out.


    Most online tutorials for Java are scattered, disordered, and incohesive. It is
    difficult to find a good starting point and even more difficult to find a continuous
    list of tutorials to bring you to any clear understanding of the Java programming
    language. Just so you know, you should find the act of learning exciting. If not,
    then you’ll have a hard time continuing through to the end of this book. To learn
    any new skill, a lot of patience is required.


    I remember asking an expert programmer how I’d learn to program. He told me to
    write a compiler. At that time, it seemed rather mean, but now I understand why
    he said that. It is like telling someone who wants to learn how to drive Formula
    1 cars to go compete in a race. In both cases, the “learn” part was left out of
    the process of learning. It is very difficult to tell someone who wants to learn
    to write code where to begin.


    However, it all really does start with your preparedness to learn. Your motivation
    must extend beyond the content of this book. You may also have some preconceived
    notions about what a programming is.


    I can’t change that, but you should be willing to change your thoughts on the
    topic if you make discoveries contrary to your knowledge. Keep an open mind.


    Computer artists often believe that programming is a technical subject that is
    incompatible with art. I find the contrary to be true. Programming is an art,
    much as literature and design is an art. Programming just has a lot of obscure
    rules that need to be understood for anything to work.


    Do I Need to Know Math?


    With complex rules in mind, does programming require the knowledge of complex
    mathematics? Actually, unless you program mathematical software, only a bit of
    geometry is nice to have. Most of the examples here use only a tiny bit of math
    to accomplish their purposes.


    Mathematics and programming do overlap quite a lot in their methodology. Math
    taught in schools provides a single solution. Programming results tend to behave
    a bit like a math proof, but only the proof isn’t just another bit of math. Rather,
    the proof of your code means that your zombies chase after humans.


    A considerable amount of math required has been done for you by the computer.
    It is just up to you to know what math to use, and then plug in the right variables.


    Programming as a Form of Expression


    There is a deeper connection between words and meaning in programming. This connection
    is more mechanical, but flexible at the same time. In relation to a programming
    language, programmers like to call this “expressiveness.” When you write words
    in literature, you infer most if not all of the meaning. When programming inference
    isn’t implied, then you’re free to define your own meanings for words and invent
    words freely.


    One common merging of art and code appears within a video game. Anytime characters
    can react to each other and react to user interaction, which conveys a greater
    experience. An artist, an animator, or an environment designer should have some
    ability to convey a richer experience to the audience. A character artist can
    show a monster to his or her audience; but to really experience the creature,
    the monster should glare, grunt, and attack in reaction to the audience.


    Chapter 2 | Programming Basics


    What Is Programming?


    It’s all about writing code. Programming is a process in which we organize data
    and use logic to do something with those data. The data are everything a computer
    can store; they can range from numbers to zombie characters in a video game.


    You do this by writing text into files called source code. Source code written
    into text files replaces punch cards used by the computing machines half a century
    ago.


    When data are combined with logic and then written into a single file, they’re
    called a class. Classes are also data, and as such can be managed with more logic.


