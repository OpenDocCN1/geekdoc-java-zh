- fmt: "\n# Classes\n\nClasses are used to create objects in the computer’s memory\
    \ and can be duplicated to have a life of their own. Classes are used to build\
    \ objects. Each piece of data within the class becomes a part of that object.\
    \ Different chunks of data inside of a class are called class members.\n\nClass\
    \ members can also be chunks of logic called functions or methods.\n\nFor Example,\
    \ in a game with a horde of zombies, each zombie is duplicated or instanced from\
    \ a zombie class. Each zombie has unique values for each attribute or data element\
    \ in the class. \n\nThis means hit points, and locations are unique for each duplicate\
    \ zombie object. Objects created from a class are called instances. Similar to\
    \ families, objects can inherit properties from one another.\n\nThe child sometimes\
    \ called a subclass inherits attributes from its parent. For instance, the child\
    \ created from a zombie may inherit the parent’s hunger for brains.\n\nTo be useful,\
    \ the child zombie can also add new objects and change the objects it inherited\
    \ from its parent class. As a result, now the child zombie might have tentacles\
    \ that the parent didn’t have. Objects talk to each other through events and messages.\n\
    \nShooting at zombies can create an event, or in programmer terms, it “raises”\
    \ an event. The bullet impact event tells the zombie class to then take necessary\
    \ steps when hit by a bullet.\n\nEvents command the class to take actions on its\
    \ data, which is where functions come in.\n\nFunctions, also known as methods,\
    \ are sections of logic that act on data. They allow your class to create additional\
    \ events and talk to yet more objects.\n\nAs the player presses the trigger and\
    \ moves the joystick around, yet more events can be raised and messages can be\
    \ sent. Events and messages allow the player to interact with your world; logic\
    \ events and objects together build your game.\n\n## What is Data?\n\nData, in\
    \ a general sense, is sort of like a noun. Like nouns, data can be a person, place,\
    \ or thing. Programmers refer to these nouns as objects, and these objects are\
    \ stored in memory as variables. The word variable infers something that might\
    \ change, but this isn’t always the case. It’s better to think of a variable as\
    \ a space in your computer’s memory to put information. When you play word games\
    \ like MadLibs you might ask for someone’s name, an object, an adverb, and a place.\
    \ Your result could turn out like “Garth ate a jacket, and studiously played at\
    \ the laundry-mat.” In this case the name, object, adverb, and place are variable\
    \ types. The data is the word you use to assign the variable with.\n\nProgrammers\
    \ use the word type to denote what kind of data is going to be stored. Computers\
    \ aren’t fluent in English and don’t usually know the difference between the English\
    \ types noun and adjective, but they do know the difference between letters and\
    \ a whole variety of numbers. There are many predefined types in `java` or any\
    \ other language.\n\nIf you add that to the ability to create new types of data,\
    \ the kinds of data we can store is practically unlimited.\n\nThe C# built-in\
    \ types are sometimes called POD, or plain old data. The term POD came from the\
    \ original `C++` standard which finds its origin dating back to 1979. POD types\
    \ have not fundamentally changed from their original implementation.\n\nSo far\
    \ we’ve used the word type several times. Programmers define the word type to\
    \ describe the variety of data to be stored.\n\n## Declarations\n\nVariables are\
    \ created using declarations. Declaration is defined as a formal statement or\
    \ announcement. Each set of words a programmer writes is called a statement. In\
    \ English we’d use the word sentence, but programmers like to use their own vocabulary.\
    \ Declaration statements for variables define both the type and the identifier\
    \ for a variable.\n\n```\npublic class Example\n{\n    int i;\n}\n```\n\nProgrammers\
    \ use a semicolon (`;`) rather than a period to end the statement. Therefore,\
    \ if you want to sound like a programmer you can say you can “write a statement\
    \ to declare a variable of type `int` with the identifier `i`.” Or if you want\
    \ to be overly dramatic you can proclaim “I declare a new variable of type `int`\
    \ to be known as `i`!” and so it shall be.\n\n## Variables\n\nVariables are used\
    \ to store information to be referenced and manipulated in a computer program.\
    \ They also provide a way of labeling data with a descriptive name, so our programs\
    \ can be understood more clearly by the reader and ourselves. It is helpful to\
    \ think of variables as containers that hold information. Their sole purpose is\
    \ to label and store data in memory. This data can then be used throughout your\
    \ program.\n\nA variable’s name is called an identifier. For the most part an\
    \ identifier is a unique word that a programmer, or in this case you, picks to\
    \ name a variable. An identifier is always something that a programmer invented\
    \ to describe a variable; it’s like naming a new pet or a baby.\n\n### Identifiers\n\
    \nIdentifiers, which are considered symbols or tokens, are words that you invent\
    \ which you then assign a meaning. Identifiers can be as simple as the letter\
    \ `i` or as complex as `@OhHAICanIHasIdentifier01`.\n\n`identifier` is the word\
    \ that’s used to name any function, variable, or type of data you create. When\
    \ the keyword `class` is used it’s followed by another word called an identifier.\
    \ After properly identifying a function, or other chunk of data, you can now refer\
    \ to that data by its identifier. In other words, when you name some data `Charles`\
    \ you access that data by the name `Charles`.\n\n```\nclass MyNewClassImWriting\n\
    {\n}\n```\n\n### Variable Names\n\nIt’s important to know that variable identifiers\
    \ and class identifiers can be pretty much anything. There are some rules to naming\
    \ anything when programming. Here are some guidelines to help. Long names are\
    \ more prone to typos, so keep identifiers short. A naming convention for variables\
    \ should consider the following points:\n\n- The variable name should indicate\
    \ what it’s used for, or at least what you’re going to do with.\n- This should\
    \ be obvious, but a variable name shouldn’t be misleading. Or rather, if you’re\
    \ using a variable named `radius`, you shouldn’t be using it as a character’s\
    \ velocity.\n- It’s also helpful if you can pronounce the variable’s name; otherwise\
    \ you’re likely to have issues when trying to explain your code to another programmer.\n\
    \n```\nint someLong_complex_hardToRememberVariableName;\n```\n\nThere is an advantage\
    \ to keeping names as short as possible still quite clear. Your computer screen,\
    \ and most computers for that matter, can only fit so many characters on a single\
    \ line. You could make the font smaller, but then you run into readability issues\
    \ when letters get too small. Consider the following function, which requires\
    \ more than one variable to work.\n\n```SomeverFunction(TopLeftCorner – SomeThickness\
    \ + OffsetFromSomePosition, BottomRightCorner – SomeThickness + OffsetFromSomePosition);\n\
    ```\n\nThe code above uses many long variable names. Because of the length of\
    \ each variable, the statement takes up multiple lines making a single statement\
    \ harder to read. We could shorten the variable names, but it’s easy to shorten\
    \ them too much.\n\n```\nCleverFunc(TL–Thk+Ofst,LR–Thk+Ofst);\n```\n\nVariable\
    \ names should be descriptive, so you know what you’re going to be using them\
    \ for: too short and they might lose their meaning.\n\n```\nint a;\n```\n\nWhile\
    \ short and easy to remember, it’s hard for anyone else coming in to read your\
    \ code and know what you’re using the variable a for for. This becomes especially\
    \ difficult when working with other programmers. Variable naming isn’t completely\
    \ without rules.\n\n```\nint 8;\n```\n\nA variable name can’t be a number. This\
    \ is bad; numbers have a special place in programming as much of it has other\
    \ uses for them. IDE will try to help you spot problems. A squiggly red line will\
    \ appear under any problems it spots. And speaking of variable names with numbers,\
    \ you can use a number as part of a variable name.\n\n```\nint varNumber2;\n```\n\
    \nThe above name is perfectly valid, and can be useful, but conversely consider\
    \ the following.\n\n```\nint 13thInt;\n```\n"
