  trans: "\n函数在不同的编程语言中看起来可能不同，但它们的工作原理大部分情况下是相同的。通常的模式是接收数据并使用逻辑来处理这些数据。函数也可能有其他名称，例如方法（methods）。主要的区别在于不同语言使用语法的方式。语法基本上是指空格或制表符、操作符或关键字的使用。\n\
    \n归根结底，你所做的一切都是告诉编译器如何将你的指令转换为计算机解释的命令。变量和函数构成了编程的主体。你想要记住的任何数据都存储在变量中。变量由你的函数进行处理。通常，当你将变量和函数组合在一个地方时，你将其称为一个类（class）。\n\
    \n### 示例\n\n```java\npublic void PrintNum ()\n{\n    System.out.println (anotherNum);\n\
    }\n```\n\n在编写新函数时，在继续其他任务之前，填写整个函数的布局是一个良好的习惯。这会让编译器感到轻松；如果将一个函数留为 `void MyFunction`\
    \ 的形式然后跳到另一个函数，会让编译器困惑于你打算做什么。在这种情况下，集成开发环境（例如 `MonoDevelop`）会不断读取和解释你正在编写的内容，类似于文字处理器中的拼写检查器。当它遇到没有确定形式的语句时（例如变量、函数或类定义），它对你编写代码的解释将抛出警告或错误。`MonoDevelop`\
    \ 看起来可能有点挑剔，但它正在尽力提供帮助。\n\n## 编写函数\n\n函数由声明（declaration）和体（body）组成。有些程序员喜欢把这些称为方法，但撇开语义不谈，函数基本上是一个语句集合的容器。\n\
    \n让我们继续之前的示例：\n\n```java\nvoid MyFunction ()\n{\n}\n```\n\n这是一个名为 `MyFunction`\
    \ 的基础函数。我们可以添加额外的关键字来修改函数的可见性。我们将要看到的一个常见修饰符是 `public`。\n\n```java\npublic void\
    \ MyFunction ()\n{\n}\n```\n\n`public` 关键字需要出现在函数返回类型之前。在这种情况下，它是 `void`，意味着该函数不返回任何内容。但函数可以以几种不同的方式作为值。作为参考，返回\
    \ `int` 的函数看起来像这样。在任何具有返回类型的函数中，必须存在某种返回语句（return statement）。\n\n```java\npublic\
    \ int MyFunction ()\n{\n    return 1;\n}\n```\n\n`public` 修饰符总是需要的，除非你需要让此函数对其他类可用。如果这一点现在不理解，很快就会明白了。函数最后总是要求的部分是参数列表（parameter\
    \ list）。留空它是有效的，但为了感受参数列表中的 `arg`（或参数 argument）看起来是什么样，请看下一个示例。\n\n```java\npublic\
    \ void MyFunction (int i)\n{\n}\n```\n\n目前，我们将暂不使用参数列表，但以后知道你看到的是什么很重要，这样它就不会让你感到意外。参数列表用于将信息从函数外部传递到函数内部。这就是类能够将信息从一个发送到另一个。函数声明与类声明相似。函数是处理变量逻辑的核心。\n\
    \n## 函数作用域\n\n变量的生命往往是短暂的。某些变量只存在于几行代码中。某些变量可能只在函数开始时产生，并在函数结束时消失。类作用域内的变量只要类存在就一直存在。变量的寿命取决于它创建的位置。\n\
    \n### 示例\n\n```java\npublic class Classscopm{\n    int ClassInt;\n    void first()\n\
    \    {\n        int firsttint;\n    }\n    void second()\n    {\n        int secondint;\n\
    \    }\n}\n```\n\n如果我们观察上面的图，就可以可视化作用域是如何划分的。外层框代表谁可以看到 `ClassInt`。在第一个 `()` 函数内部，我们有一个\
    \ `firsttint`，它只存在于第一个 `()` 函数中。\n\n`secondint` 也是如此，只存在于 `second()` 函数中。这意味着\
    \ `first()` 可以同时使用 `ClassInt` 和 `firsttint`，但不能 `secondint`。同样，`second()` 可以看到\
    \ `ClassInt` 和 `secondint`，但看不到 `firsttint`。\n\n## 参数列表\n\n当函数被调用时，它的标识符后面跟着参数列表会被添加到代码中。参数就像房子门上的小信口。可能会有一个整数、浮点数和数组的槽。门上的每个槽（或参数列表中的参数）都是一个类型后跟一个标识符。\n\
    \n如果我们看一个基础示例，就能看到这一切是如何运作的。\n\n```java\npublic class Example {\n    int a = 0;\n\
    \    void SetA (int i) {\n        a = i;\n    }\n}\n```\n\n`SetA (int i)` 接收一个\
    \ `int` 类型的参数。这是一个值参数（value parameter）的简单示例；接下来我们将介绍其他类型的参数。值参数声明了类型和标识符，其的作用域被限于其声明所在函数的内容。当你运行上面的程序并给函数\
    \ `SetA(3)` 参数赋值 `3` 时，你将看到一个 `0` 跟着一个 `3`。我们可以这样做很多次，每次都允许更改值。\n\n目前，我们将暂不使用参数列表，但以后知道你看到的是什么很重要，这样它就不会让你感到意外。参数列表用于将信息从函数外部传递到函数内部。这就是类能够将信息从一个发送到另一个。\n\
    \n## 副作用（Side Effects）\n\n当函数直接设置类中的变量时，程序员将其称为副作用（side effects）。副作用通常是程序员试图避免的。\n\
    \n```java\nclass MyEffect {\n    int a = 0;\n    void SetA ()\n    {\n       \
    \ a = 5;\n    }\n}\n```\n\n上面的 `SetA()` 函数将 `a` 设置为 `5`。`public` 修饰符并不总是需要的，除非你需要让此函数对其他类可用。\n\
    \n副作用越多，可能出现越奇怪的行为。如果 `Main()` 函数期望一个值但得到了另一个，就会开始出现意料之外的行为。更糟糕的是，如果 `SetAgain()`\
    \ 被另一个类调用而你期望 `a` 为 `5`，你将会遇到更多奇怪的行为。\n\n## 多参数\n\n函数可以接受的参数数量没有限制。某些语言限制你最多使用\
    \ 16 个参数，这似乎是可以接受的。如果你的逻辑需要超过 16 个参数，将你的函数拆分为不同的部分可能会更容易。然而，如果我们我们要执行一些简单的事情，我们可能还是想使用多个参数。\n\
    \n```java\nint a = 0;\nvoid SetA (int i, int j) {\n    a = i * j;\n}\n```\n\n\
    我们可以为 `SetA` 添加第二个参数。逗号标记告诉函数接受参数列表中的另一个变量。对于这个示例，我们使用两个 `int` 相乘并将值赋值给 `a`。对参数列表中允许使用的类型没有限制。\n\
    \n```java\nint a = 0;\nfloat b = 0;\nvoid SetA (int i, float j) { \n    a = i;\
    \ \n    b = j;\n}\n```\n"
- fmt: "\nThe function with multiple parameters can do more. Value parameters are\
    \ helpful ways to get data into a function to accomplish some sort of simple task.\n\
    \n# Logic and Operators\n\nLogic allows you to control what part of a function\
    \ is evaluated based on changes to variables. Using logic, you'll be able to change\
    \ which statements in your code will run. Simply put, everything you write must\
    \ cover each situation you plan to cover. Logic is controlled through a few simple\
    \ systems, primarily the `if` keyword and variations of `if`.\n\n### Booleans\n\
    In Java booleans, or `bools` for short, are either true or false. It’s easiest\
    \ to think of these as switches either in on or in off position. To declare a\
    \ `var` as a `bool`, you use something like the following.\n\n```java\npublic\
    \ class Example\n{\n    public bool SomeBool;\n}\n```\n\n### Equality Operators\n\
    Equality operators create boolean conditions. There are many ways to set a boolean\
    \ variable. For instance, comparisons between values are a useful means to set\
    \ variables. The most basic method to determine equality is using the following\
    \ operator: `==`. There’s a difference between use of a single and a double equals\
    \ to symbol. `=` is used to assign a value whereas `==` is used to compare values.\n\
    \nWhen you need to compare two values you can use the following concept. You’ll\
    \ need to remember that these operators are called equality operators, if you\
    \ need to talk to a programmer.\n\nThe syntax here may look a bit confusing at\
    \ first, but there are ways around that.\n\n```java\nvoid Func ()\n{ \n    SomeBool\
    \ = (1 == 1);\n}\n```\n\nThere are other operators to be aware of. You will be\
    \ introduced to the other logical operators later in the chapter. In this case,\
    \ we are asking if two number values are the same. To make this a more clear,\
    \ we can break out the code into more lines. Now, we’re looking at `a` versus\
    \ `b`. Clearly, they don’t look the same; they are different letters after all.\
    \ However, they do contain the same integer value, and that’s what’s really being\
    \ compared here.\n\n```java\nvoid Func ()\n{\n    int a = 1;\n    int b = 1;\n\
    \    SomeBool = (a == b);\n}\n```\n\nEvaluations have a left and a right side.\
    \ The single equal to operator (`=`) separates the different sides. The left side\
    \ of the `=` is calculated and looks to the value to the right to get its assignment.\
    \ Because `1 == 1`, that is to say, `1` is equivalent to `1`, the final result\
    \ of the statement is that `SomeBool` is true.\n\n### Relational Operators\nBool\
    \ values can also be set by comparing values. The operators used to compare two\
    \ different values are called relational operators. We use `==`, the is equal\
    \ symbol, to check if values are the same; we can also use `!=`, or not equal,\
    \ to check of two variables are different.\n\nThis works similarly to the `!`\
    \ in the previous section. Programmers more often check if one value is greater\
    \ or lesser than another value. They do this by using `>`, or greater than, and\
    \ `<`, or less than. We can also use `>=`, greater or equal to, and `<=`, less\
    \ than or equal to. Let’s see a few examples of how this is used.\n\n```java\n\
    public class Test {\n    public static void main(String args[]) {\n        int\
    \ a = 10;\n        int b = 20;\n        System.out.println(\"a == b = \" + (a\
    \ == b));\n        System.out.println(\"a != b = \" + (a != b));\n        System.out.println(\"\
    a > b = \" + (a > b));\n        System.out.println(\"a < b = \" + (a < b));\n\
    \        System.out.println(\"b >= a = \" + (b >= a));\n        System.out.println(\"\
    b <= a = \" + (b <= a));\n    }\n}\n```\n\n**Output:**\n```\na == b = false\n\
    a != b = true\na > b = false\na < b = true\nb >= a = true\nb <= a = false\n```\n\
    \n### Return Keyword\nWe need to love the `return` keyword. This keyword turns\
    \ a function into data. There are a couple of conditions that need to be met before\
    \ this will work. So far, we’ve been using the keyword `void` to declare the return\
    \ type of a function. This looks like the following code fragment.\n\n```java\n\
    void MyFunction()\n{\n    //code here...\n}\n```\n\nIn this case, using `return`\
    \ will be pretty simple.\n\n```java\nvoid MyFunction()\n{\n    //code here ...\n\
    \    return;\n}\n```\n\nThis function returns `void`. This statement has a deeper\
    \ meaning. Returning a value makes a lot more sense when a real value, something\
    \ other than a void, is actually returned. Let’s take a look at a function that\
    \ has more meaning. The keyword `void` at the beginning of the function declaration\
    \ means that this function does not have a return type. If we change the declaration,\
    \ we need to ensure that there is a returned value that matches the declaration.\
    \ This can be as simple as the following code fragment.\n\n```java\nint MyFunction()\n\
    {\n    //code here...\n    return 1; // 1 is an int\n}\n```\n\nThis function returns\
    \ `int` `1`. Declaring a function with a return value requires that the return\
    \ type and the declaration match. When the function is used, it should be treated\
    \ like a data type that matches the function’s return type.\n\n# Class/Static\
    \ Variables\nClass variables also known as static variables are declared with\
    \ the `static` keyword in a class, but outside a method, constructor or a block.\
    \ There would only be one copy of each class variable per class, regardless of\
    \ how many objects are created from it.\n\nStatic variables are created when the\
    \ program starts and destroyed when the program stops. Visibility is similar to\
    \ instance variables. Default values are `0` for numbers; for Booleans, it is\
    \ `false`; and for Object references, it is `null`.\n\nExample:\n\n```java\nimport\
    \ java.io.*;\n\npublic class Employee {\n    // salary variable is a private static\
    \ variable\n    private static double salary;\n    // DEPARTMENT is a constant\n\
    \    public static final String DEPARTMENT = \"Development \";\n\n    public static\
    \ void main(String args[]) {\n        salary = 1000;\n        System.out.println(DEPARTMENT\
    \ + \"average salary:\" + salary);\n    }\n}\n```\n**Output:**\nDevelopment average\
    \ salary:1000\n\nNote: If the variables are access from an outside class the constant\
    \ should be accessed as `Employee.DEPARTMENT`.\n\n# Arrays\nArrays are nicely\
    \ organized lists of data. Think of a numbered list that starts at zero and extends\
    \ one line every time you add something to the list. Arrays are useful for any\
    \ number of situations because they’re treated as a single hunk of data. For instance,\
    \ if you wanted to store a bunch of high scores, you’d want to do that with an\
    \ array. Initially, you might want to have a list of 10 items. You could in theory\
    \ use the following code to store each score.\n\n```java\nint score1;\nint score2;\n\
    int score3;\nint score4;\nint score5;\nint score6;\nint score7;\nint score8;\n\
    int score9;\nint score10;\n```\n\nTo make matters worse, if you needed to process\
    \ each value, you’d need to create a set of code that deals with each variable\
    \ by name. To check if `score2` is higher than `score1`, you’d need to write a\
    \ function specifically to check those two variables before switching them. Thank\
    \ goodness for arrays.\n\nThere are two types of array:\n*   Single Dimensional\
    \ Array\n*   Multidimensional Array\n\n### Single Dimensional Array in java\n\
    Syntax to Declare an Array in java:\n`dataType[] arr;` (or)\n`dataType [] arr;`\
    \ (or)\n`dataType arr[];`\n\nInstantiation of an Array in java:\n`arrayRefVar=new\
    \ datatype[size];`\n"
