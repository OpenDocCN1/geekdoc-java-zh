    ## 2. 互联网让世界各地的人能够快速访问和检索大量信息。在巧妙算法的帮助下，网站能够管理和处理这些海量数据。必须使用算法的问题示例包括：寻找数据传输的优质路径，以及使用搜索引擎快速找到包含特定信息的页面。


    ## 3. 电子商务使得商品和服务能够以电子化的方式进行谈判和交换，它依赖于个人信息的隐私性，例如信用卡号、密码和银行对单。电子商务中使用的核心技术包括公钥加密和数字签名，这些技术基于数值算法和数论。


    ## 4. 制造业和其他商业企业通常需要以最有利的方式分配稀缺资源。石油公司可能想知道在哪里设置钻井以实现预期利润最大化。政治候选人可能想决定在哪里花钱购买竞选广告，以最大化赢得选举的概率。航空公司可能希望以最廉的价格将机组人员分配给航班，确保每班航班都有人员负责，并符合政府关于机组调度的规定。互联网服务提供商可能希望决定在哪里放置额外资源，以便更有效地为客户服务。这些都是可以使用线性规划解决的问题示例。


    虽然这些示例的一些细节超出了本书的范围，但我们确实提供了适用于这些问题和领域的基础技术。


    ### 算法作为一种技术


    假设计算机的速度是无限的，计算机内存是免费的。你还会为了学习算法吗？答案是肯定的，即使没有其他理由，你仍然想证明你的解决方案能够终止，并且给出一个正确的答案。


    如果计算机的速度是无限的，那么任何解决问题的正确方法都行。


    你可能希望你的实现符合良好的软件工程实践规范（例如，你的实现应该是经过良好设计并记录的），但你通常会使用任何最容易实现的方法。当然，计算机可能很快，但并不是无限快。内存可能廉价，但不是免费的。


    因此，计算时间是一种有限的资源，内存空间也是如此。你应该明智地使用这些资源，时间或空间上高效的算法将帮助你做到这一点。


    ### 存储存储在哪里？


    视觉化程序运行时某些布局方式是很有用的——特别是内存是如何安排的。有五种不同的存储位置：


    1. **寄存器 (Registers)**。这是最快的存储，因为它存在于与其他存储不同的位置：处理器内部。然而，寄存器的数量受到严格限制，因此寄存器根据需要进行分配。你无法直接控制它们，在你的程序中也看不到任何寄存器存在的证据（相反，`C`
    和 `C++` 允许你向编译器建议寄存器分配）。


    2. **栈 (The stack)**。它位于通用随机访问内存 (`RAM`) 区域，但通过栈指针获得处理器的直接支持。栈指针向下移动创建新内存，向上移动释放内存。这是一种极其快速且高效的存储分配方式，仅次于寄存器。Java
    系统在创建程序时必须知道存储在栈上的所有项的确切寿命。这一限制限制了你程序的灵活性，因此虽然某些 Java 存储存在于栈上——特别是对象引用——但 Java
    对象本身并不放置在栈上。


    3. **堆 (The heap)**。这是一个通用的内存池（同样在 `RAM` 区域），所有的 Java 对象都存储在其中。堆的妙处是，与栈不同，编译器不需要知道该存储必须在堆上保留多久。因此，使用堆上的存储具有极大的灵活性。每你需要一个对象时，只需使用
    `new` 编写代码创建它，当该代码执行时，存储就会分配在堆上。当然，这种灵活性也是需要付出代价的：分配和清理堆存储可能比栈存储花费更多时间（如果你在 Java
    中可以在栈上创建对象的话，就像在 `C++` 中那样）。


    4. **常量存储 (Constant storage)**。常量值通常直接放置在程序代码中，这是安全的，因为它们永远不会改变。有时常量会被单独隔离开，以便在嵌入式系统中可以根据选择被放置在只读内存
    (`ROM`) 中。


    5. **非 RAM 存储 (Non-RAM storage)**。如果数据完全位于程序外部，它可以在程序未运行时存在，且不受程序的控制。这类的两个主要示例是：流式对象
    (streamed objects)，将对象转换为字节流，通常是为了发送到另一台机器；以及持久化对象 (persistent objects)，将对象放置在磁盘上，以便在程序终止后仍保留其状态。这些类型存储的技巧是将对象转换为可以在其他介质上存在的东西，并在需要时重新复活为普通的基于
    `RAM` 的对象。Java 提供了轻量级持久化支持，而 `JDBC` 和 `Hibernate` 等机制为在数据库中存储和检索对象信息提供了更高级的支持。


    ### 语句与表达式 (Statements and Expressions)


    在阅读一本书或一个故事时，你从有序的词链中提取含义。类似地，计算机从有序指令的链中提取命令。


    在英语中，我们称之为句子 (sentence)；程序员称之为语句 (statement)。


    语句被认为是任何通过分号隔开、完成某种任务的代码块。任何给定任务的核心都是算法 (algorithm)，不要将其与对数 (logarithm) 混淆。


    算法是一个完成某些任务的系统化过程。在许多方面，你可以将其看作是一个食谱，或者说，食谱是制作食物的算法。


    完成一项任务可能只需要一两个语句，也可能需要数百条语句。


    ![`3.bp.blogspot.com/-qi_h4uWuaLY/WBNQIt6zNjI/AAAAAAAAGso/63MfQEDmpIJghpMTGRN3vZTiuLiY3wCK4B/s400/PascalScriptIfThenElse.png`](img/这完全取决于给定任务的难度。每一个具体的语句都是通向目标的一个步骤。这就是花费几分钟煎蛋和花费一小时烘焙舒芙的区别。每个步骤通常相当简单，最终结果至关重要。)


    就像句子一样，语句有不同的形式。语句可以声明并为变量赋值。这些被称为声明和赋值语句。这些语句用于设置各种类型的数据并给它们命名。


    ### 表达式 (Expressions)


    语句的主体被称为标识符 (identifiers)。赋值语句用于给标识符赋值。当你读到“Jack 是男孩，Jill 是一个女孩”时，你已经在脑中为这两个主题分配了性别。


    在 Java 中，这看起来可能像：


    ```java

    gender Jack = male;

    gender Jill = female;

    ```


    赋值语句通常包含某种操作。这些被称为表达语句 (expressive statements)。与表达情感不同，代码中的表达式看起来像 `x + y`。表达式处理数据。处理后，表达式的结果可以赋值给变量。


    语句的集合被称为代码块 (code block)，不像可能会阻止你代码运行的路障，而更像是一个构建块 (building block)，即任何用于构建的东西。


