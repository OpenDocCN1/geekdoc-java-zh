    # Chapter 4 | Networking


    ## What is network programming?


    The term `network programming` refers to writing programs that execute across
    multiple devices (computers), in which the devices are all connected to each other
    using a network.


    The `java.net` package of the J2SE APIs contains a collection of classes and interfaces
    that provide the low-level communication details, allowing you to write programs
    that focus on solving the problem at hand.


    The `java.net` package provides support for the two common network protocols –


    1. **TCP** – `TCP` stands for Transmission Control Protocol, which allows for
    reliable communication between two applications. `TCP` is typically used over
    the Internet Protocol, which is referred to as `TCP/IP`.

    2. **UDP** – `UDP` stands for User Datagram Protocol, a connection-less protocol
    that allows for packets of data to be transmitted between applications.


    This chapter gives a good understanding on the following two subjects−


    1. **Socket Programming** – This is the most widely used concept in Networking
    and it has been explained in very detail.

    2. **URL Processing** – `URL` stands for Uniform Resource Locator and represents
    a resource on the World Wide Web, such as a Web page or FTP directory.


    ## Socket Programming


    Sockets provide the communication mechanism between two computers using `TCP`.
    A client program creates a socket on its end of the communication and attempts
    to connect that socket to a server.


    When the connection is made, the server creates a socket object on its end of
    the communication. The client and the server can now communicate by writing to
    and reading from the socket.


    The `java.net.Socket` class represents a socket, and the `java.net.ServerSocket`
    class provides a mechanism for the server program to listen for clients and establish
    connections with them.


    The following steps occur when establishing a `TCP` connection between two computers
    using sockets –


    * The server instantiates a `ServerSocket` object, denoting which port number
    communication is to occur on.

    * The server invokes the `accept()` method of the `ServerSocket` class. This method
    waits until a client connects to the server on the given port.

    * After the server is waiting, a client instantiates a `Socket` object, specifying
    the server name and the port number to connect to.

    * The constructor of the `Socket` class attempts to connect the client to the
    specified server and the port number. If communication is established, the client
    now has a `Socket` object capable of communicating with the server.

    * On the server side, the `accept()` method returns a reference to a new socket
    on the server that is connected to the client''s socket.

    * After the connections are established, communication can occur using I/O streams.
    Each socket has both an `OutputStream` and an `InputStream`. The client''s `OutputStream`
    is connected to the server''s `InputStream`. `TCP` is a two-way communication
    protocol, hence data can be sent across both streams.


    ### ServerSocket Class


    The `java.net.ServerSocket` class is used by servers to obtain a port and listen
    for client requests.


    The `ServerSocket` class has four constructors:


    | Sr.No | Constructor & Description |

    | :--- | :--- |

    | 1 | `public ServerSocket(int port) throws IOException`: Attempts to create a
    server bound to the specified port. An exception occurs if the port is already
    bound by another application. |

    | 2 | `public ServerSocket(int port, int backlog) throws IOException`: Similar
    to the previous constructor, the `backlog` parameter specifies how many incoming
    clients to store in a queue. |

    | 3 | `public ServerSocket(int port, int backlog, InetAddress address) throws
    IOException`: Similar to the previous constructor, the `InetAddress` parameter
    specifies the local address to bind to. |

    | 4 | `public ServerSocket() throws IOException`: Creates an unbound server socket.
    When using this constructor, use the `bind()` method when you are ready to bind
    the server. |


    Following are some common methods of the `ServerSocket` class:


    | Sr.No | Method & Description |

    | :--- | :--- |

    | 1 | `public int getLocalPort()`: Returns the port that the server socket is
    listening on. This method is useful if you passed in 0 as the port number in a
    constructor and let the server find a port for you. |

    | 2 | `public Socket accept() throws IOException`: Waits for an incoming client.
    This method blocks until a client connects to the server on the specified port
    or the socket times out, assuming that the time-out value has been set using `setSoTimeout()`.
    Otherwise, this method blocks indefinitely. |

    | 3 | `public void setSoTimeout(int timeout)`: Sets the time-out value for how
    long the server socket waits during `accept()`. |

    | 4 | `public void bind(SocketAddress host, int backlog)`: Binds the socket to
    the specified server and port in the `SocketAddress` object. |


    When the `ServerSocket` invokes `accept()`, the method does not return until a
    client connects. After a client connect, the `ServerSocket` creates a new `Socket`
    on an unspecified port and returns a reference to this new `Socket`. A `TCP` connection
    now exists between the client and the server, and communication can begin.


    ### Socket Class


    The `java.net.Socket` class represents the socket that both the client and the
    server use to communicate with each other. The client obtains a `Socket` object
    by instantiating one, whereas the server obtains a `Socket` object from the return
    value of `accept()`.


    The `Socket` class has five constructors that a client uses to connect to a server:


    | Sr.No | Constructor & Description |

    | :--- | :--- |

    | 1 | `public Socket(String host, int port) throws UnknownHostException, IOException`:
    This method attempts to connect to the specified server at the specified port.
    If this constructor does not throw an exception, the connection is successful
    and the client is connected to the server. |

    | 2 | `public Socket(InetAddress host, int port) throws IOException`: This method
    is identical to the previous constructor, except that the host is denoted by an
    `InetAddress` object. |

    | 3 | `public Socket(String host, int port, InetAddress localAddress, int localPort)
    throws IOException`: Connects to the specified host and port, creating a socket
    on the local host at the specified address and port. |

