    *   **TESTING**: Most of the autodidacts lack knowledge or generally do not understand
    the importance of the testing process.

    *   **PROGRAM PARADIGMS (and corresponding language)**: “If you only have a hammer,
    every problem looks like a nail”. I’ve had many of these hammer-types. They often
    just do not understand why not every problem can be solved the same way/with the
    same methodology.

    *   **MACHINE RELATED MATHEMATICAL PROBLEMS**: They lack numerical mathematics
    skills and do not understand why floating points arithmetic can fail you if you
    don’t watch out.


    # WHAT ARE THE MOST IMPORTANT DATA STRUCTURE AND ALGORITHMS TO PREPARE FOR AN
    INTERVIEW?


    Did you know that the top 10 [data structures](https://goo.gl/E2ENP8) account
    for 99% of all data structure use in the real world? Probably not, because I just
    made those numbers up — but they''re in the right ballpark. Yes, on occasion we
    ask a problem whose optimal solution requires a [Bloom filter](http://en.wikipedia.org/wiki/Bloom_filter)
    or [suffix tree](http://en.wikipedia.org/wiki/Suffix_tree), but even those problems
    tend to have a near-optimal solution that uses a much more mundane data structure.
    The data structures that are going to show up most frequently are:


    *   Array

    *   Stack / Queue

    *   Hashset / Hashmap / Hashtable / Dictionary

    *   Tree / binary tree

    *   Heap

    *   Graph


    You should know these data structures inside and out. What are the insertion/deletion/lookup
    characteristics? (`O(log n)` for a balanced binary tree, for example.) What are
    the common caveats? (Hashing is tricky, and usually takes `O(k)` time when `k`
    is the size of the object being hashed.)


    What algorithms tend to go along with each data structure? ([Dijkstra''s](https://secure.wikimedia.org/wikipedia/en/wiki/Dijkstra%27s_algorithm)
    for a graph.) But when you understand these data structures, sometimes the solution
    to a problem will pop into your mind as soon as you even think about using the
    right one.


    Stick to basics. I would classify the following data structures as **must know**:


    1.  `Linked List` - Single and Doubly

    2.  `Stack`

    3.  `Queues`

    4.  `Binary Search Trees` or general `Binary Tree`

    5.  `Heaps`

    6.  Basic `Graph Traversal` and `Shortest Path`

    7.  `Hashing`


    Following data structures may be asked. I would say that their probability of
    being asked is between 50 to 75%:


    1.  `Tries`

    2.  Advance Graphs like flow and min-cut etc.

    3.  `Bit Manipulation`


    You will probably crack interviews with sufficient knowledge of above.


    Following have very low probability of being asked (< 25%%):


    1.  `Segment Trees` / `Binary Indexed Trees`

    2.  `AVL Trees`

    3.  `B+ Trees`


    Other hard data structures are absolutely unnecessary.


    Following Algorithms / Tricks / Topics may also be important:


    1.  `Memory Management`

    2.  Basic Co-ordinate geometry - `Manhattan Distance`, `Closest Point Pair`

    3.  `Divide and Conquer`

    4.  `Greedy`

    5.  `Dynamic Programming` - Extremely important

    6.  `Probability` and basic `Number Theory`

    7.  `Sorting and Searching`


    Following topics is important for Knowledge / Experience based questions:


    1.  `OS` - `Threads`, `Processes` and `Locks` using `Mutex`, `Semaphores`

    2.  `Scalability Issues`, `RPCs`, `Rate limiter`, etc.

    3.  `OOP Concepts`

    4.  `Databases` - `SQL`, `NoSQL`, Writing simple `Queries`, `Transactions`, `ACID`

    5.  `Linux Commands` - `sed`, `grep`, `ps`, etc.


    # 9 WAYS TO BECOME A GREAT PROGRAMMER!


    ## 1. PRACTICE


    Asides from following tutorials, you should work on your own projects.


    "The most fundamental thing is that you actually go and code. I’ve heard it recommended
    that by the time you finish college, you should have written 100,000 lines at
    minimum." — Andrei Thorp from Evernote.


    But how do I get start, you may ask.


    "I always tell people to find something they’re doing more than once a week and
    to try to automate it. Ignore if anyone else has solved the problem before, and
    just make a tool/utility for yourself that fixes a common issue in your life."
    — Kasra Rahjerdi, Mobile Lead at Stack Overflow.


    "Like any other skill, it takes practice – deliberate practice, stepping outside
    of your comfort zone and learning the nuance and subtleties – that set apart great
    from good.” — Derick Bailey, the creator of WatchMeCode.net.


    Derick is a top 0.42% StackOverflow user, and has also contributed to open source
    frameworks such as `MarionetteJS` and `BackboneJS`.


    It’s OK to fail. Coding is all about failing and fixing things, and about learning
    how to do things better. If you don’t build things and work on areas that you
    know you are weak on, you’ll never get better. If you ever need to receive advice
    on how to improve and what you’re not doing so well on, feel free to ask an experienced
    developer to help your get straightened up by either reviewing your code or walking
    you through concepts you are having trouble understanding.


    ## 2. BE PATIENT


    No-brainer here, but it’s easy to get frustrated by your lack of progress and
    forget that you’re not alone.


    "Becoming a good programmer takes a long, long time and a lot of tedious evenings.
    Before you can write good code, you have to write hundreds of thousands of lines."
    — Mike Arpaia, a former Etsy dev who now builds information security for Facebook.


    Mike stresses that beginners should give up on the assumption that one can become
    an excellent quickly. But… what if you’re not even past the tutorial stages yet?
    What if you’re still banging your head against the wall wondering perhaps you’re
    not cut out for? Before you leap to conclusions know that everyone has a different
    learning style. Author of Tutorial, Michael Hartl, points out that beginners should
    try lots of different resources (books, videos, etc.) to see what ‘clicks’.


    ## 3. STAY INTERESTED


    If you’re bored by the project you’re working on, you should probably reconsider
    any lofty goals of learning to code. Or, maybe you’re just working on the wrong
    project or learning through the wrong resource. Always keep yourself motivated
    by working on personal projects that excites you.


    Coraline Ada Ehmke, founder of LGBTech and contributor to high-profile open source
    projects such as `Rails` and `RSpec`, started coding at a young age. However,
    her first class in college as a Computer Science major made her doubt her passion.


    I remember our semester-long project was to write software for an ATM. I was so
    bored and not challenged, I decided that if that’s what life as an engineer was
    like, I didn’t want any part of it, so I dropped out soon after. However, she
    continued to work on projects she found interesting. By 1993 she was online and
    building websites and has been developing web apps ever since.


    ## 4. LOVE THE ERROR


    As a beginner you’ll likely be mired in bugs. If you feel intimidated by all the
    red, you’re not alone. Ross Chapman, a UX Engineer who coded for Zendesk and now
    working at ScienceExchange, admits to being a scared developer when he first started
    out.


    I didn’t have the patience because I wasn’t ready to love the challenge of fixing
    things. But that’s pretty much where my really bad habits come from. With that
    said, Ross urges beginners to embrace errors as crucial learning moments. Since
    you’ll be debugging for life, you should get used to errors and learn to recognize
    the error messages.


