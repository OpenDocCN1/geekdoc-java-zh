    Element not present\");\n        else\n            System.out.println(\"Element\
    \ found at index \" + result);\n    }\n}\n```\n\n# 冒泡排序\n\n冒泡排序被认为是最简单的算法。在冒泡排序中，从第一个元素遍历到最后一个元素。在这里，当前元素与下一个元素进行比较。如果当前元素大于下一个元素，则进行交换。\n\
    \n## 算法\n我们假设 `list` 是一个包含 `n` 个元素的数组。我们进一步假设 `swap` 函数会交换给定数组元素的值。\n\n``` Bubble\
    \ BubbleSort(list)\n  for all elements of list\n    if list[i] > list[i+1]\n \
    \     swap(list[i], list[i+1])\n  end for\nend BubbleSort\n```\n\n## 程序：Java 实现冒泡排序\n\
    \n```java\nclass BubbleSortExample {\n    static void bubbleSort(int[] arr) {\n\
    \        int n = arr.length;\n        int temp = 0;\n        for (int i = 0; i\
    \ < n; i++) {\n            for (int j = 1; j < (n - i); j++) {\n             \
    \   if (arr[j-1] > arr[j]) {\n                    //交换元素\n                   \
    \ temp = arr[j-1];\n                    arr[j-1] = arr[j];\n                 \
    \   arr[j] = temp;\n                }\n            }\n        }\n    }\n\n   \
    \ public static void main(String[] args) {\n        int arr[] = {3, 60, 35, 45,\
    \ 320, 5};\n        System.out.println(\"Array Before Sort\");\n        for (int\
    \ i = 0; i < arr.length; i++) {\n            System.out.print(arr[i] + \" \");\n\
    \        }\n        System.out.println();\n        bubbleSort(arr); //使用冒泡排序排序数组\n\
    \        System.out.println(\"Array After Sort\");\n        for (int i = 0; i\
    \ < arr.length; i++) {\n            System.out.print(arr[i] + \" \");\n      \
    \  }\n    }\n}\n```\n\n输出：\nArray Before Sort\n3 60 35 45 320 5\nArray After Sort\n\
    2 5 35 45 60 320\n\n# 插入排序\n\n插入排序是一种简单的排序算法，其工作方式就像我们整理手中的牌牌一样。\n\n## 算法\n- 步骤\
    \ 1：如果是第一个元素，它已经是有序的。返回 1\n- 步骤 2：选取下一个元素\n- 步骤 3：与已排序子列表中的所有元素进行比较\n- 步骤 4：将已排序子列表中所有大于待排序值的元素向后移动一位\n\
    - 步骤 5：插入该值\n- 步骤 6：重复直到列表排序就绪\n\n## 程序：实现插入排序的 Java 程序\n\n```java\nclass InsertionSort\
    \ {\n    /*使用插入排序排序数组*/\n    void sort(int arr[]) {\n        int n = arr.length;\n\
    \        for (int i = 1; i < n; ++i) {\n            int key = arr[i];\n      \
    \      int j = i - 1;\n            /*将 arr[0..i-1] 中大于 key 的\n               元素向后移动一个位置\n\
    \               到达当前位置 */\n            while (j >= 0 && arr[j] > key) {\n    \
    \            arr[j+1] = arr[j];\n                j = j - 1;\n            }\n \
    \           arr[j+1] = key;\n        }\n    }\n\n    /*打印大小为 n 的数组的实用函数*/\n  \
    \  static void printArray(int arr[]) {\n        int n = arr.length;\n        for\
    \ (int i = 0; i < n; ++i)\n            System.out.print(arr[i] + \" \");\n   \
    \     System.out.println();\n    }\n\n    public static void main(String args[])\
    \ {\n        int arr[] = {12, 1, 13, 5, 6};\n        InsertionSort ob = new InsertionSort();\n\
    \        ob.sort(arr);\n        printArray(arr);\n    }\n}\n```\n输出：5 6 1 12 13\n\
    \n# 归并排序\n\n`Mergesort` 算法可以对集合进行排序。`Mergesort` 是一种分治算法。\n\n## 算法\n- 步骤 1：如果只有一个元素，它是有序的。返回。\n\
    - 步骤 2：将列表递归地分为两部分直到没有可以划分。\n- 步骤 3：将子列表合并为有序列表。\n\n## 程序：归并排序的 Java 程序\n\n```java\n\
    class MergeSort {\n    // 合并两个子数组\n    // 第一个子数组是 arr[l..m]\n    // 第二个子数组是 arr[m+1..r]\n\
    \    void merge(int arr[], int l, int m, int r) {\n        // 待合并的子数组的大小\n   \
    \     int n1 = m - l + 1;\n        int n2 = r - m;\n        /* 创建临时数组 */\n   \
    \     int L[] = new int[n1];\n        int R[] = new int[n2];\n        /* 将数据拷贝到临时数组*/\n\
    \        for (int i = 0; i < n1; ++i)\n            L[i] = arr[l + i];\n      \
    \  for (int j = 0; j < n2; ++j)\n            R[j] = arr[m + 1 + j];\n        /*\
    \ 合并临时数组 */\n        // 第一、二子数组的初始索引\n        int i = 0, j = 0;\n        // 合并数组的初始索引\n\
    \        int k = l;\n        while (i < n1 && j < n2) {\n            if (L[i]\
    \ <= R[j]) {\n                arr[k] = L[i];\n                i++;\n         \
    \   } else {\n                arr[k] = R[j];\n                j++;\n         \
    \   }\n            k++;\n        }\n        /* 拷贝 L[] 中的剩余元素 */\n        while\
    \ (i < n1) {\n            arr[k] = L[i];\n            i++;\n            k++;\n\
    \        }\n        /* 拷贝 R[] 中的剩余元素 */\n        while (j < n2) {\n          \
    \  arr[k] = R[j];\n            j++;\n            k++;\n        }\n    }\n\n  \
    \  // 使用 merge() 排序 arr[l..r]\n    void sort(int arr[], int l, int r) {\n    \
    \    if (l < r) {\n            // 找到中间点\n            int m = (l + r) / 2;\n  \
    \          // 排序前、后两个部分\n            sort(arr, l, m);\n            sort(arr, m\
    \ + 1, r);\n            // 合并排序后的两个部分\n            merge(arr, l, m, r);\n    \
    \    }\n    }\n}\n```\n\n"
