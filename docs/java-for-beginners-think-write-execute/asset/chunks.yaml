    在某些语言中，你必须显式地声明你想让方法具有晚绑定属性的灵活性（C++ 使用 `virtual` 关键字来实现）。在这些语言中，默认情况下，方法不是动态绑定的。在
    Java 中，动态绑定是默认行为，你不需要记住添加任何额外的关键字来实现多态性。


    ## 类型


    当我们给变量赋值一个值，例如 `int i = 1;` 时，我们实际上在进行一个有趣的假设。我们假设使用 `1` 会自动推导出与变量类型匹配的数值类型。计算机使用多种不同的数据类型来存储数字。到为止，我们看到
    `int` 这个词被频繁提及，好像你已经知道 `int` 是什么。在日常生活中，我们几乎不认为数字 `1` 和 `1.0` 甚至单词 "one" 之间有任何区别。


    作为人类，我们可以很容易地将数字概念化为测量单位并在它们之间进行转换。但对于计算机来说，单词 "one" 和数字 `1` 之间的转换并不简单。`int` 关键字是
    integer（整数）的缩写。整数是整数数值。整数是 Java 的内置类型。基本上，这意味着整数是 `java` 的基础组成部分。其他内置类型包括 `float`、`double`、`string`、`bool`
    和 `object`。不常用的内置类型有 `char`、`short` 和 `byte`。总共有 15 种不同的内置类型。


    所有这些类型除 `object` 和 `string` 之外，都是值类型。你能够构建的任何数据类型都必须基于这些内置类型。创建所有这些 `floats`、`doubles`
    和 `bools` 的系统植于计算的起源。还记得那些打孔带和带孔的纸吗？那些是 `1s` 和 `0s` 的记录，以机械开关（开启或关闭）的形式馈入计算机进行存储。这些模式代表了数字、指令和逻辑。


    今天，我们仍然使用相同的 `1s` 和 `0s` 系统，即二进制，只是我们不再需要在纸上打孔来告诉计算机要做什么。创建和存储指令的方法已经复杂了许多倍，但
    `1` 和 `0` 的原理仍然是相同的。这些被称为位（bits）；该名称的一个可能来源是在在纸片上打完所有孔后留下的纸屑。


    ### 值类型和引用类型


    `int`、`float`、`double` 和 `bool` 是常用的值类型。这种用法模式的基础与存储和组织计算机内存的系统有关。谈论计算机存储时，你会使用
    `megabyte` 或 `gigabyte` 等词。值类型的存储有非常特定的目的：跟踪数值。


    #### 注意


    `mega` 一词指的是你计算机中的组件可以存储多少百万字节。`Giga` 表示存储了多少十亿字节。你是否考虑过 `byte`（字节）到底是什么？`byte`
    是所谓的 8 位无符号整数，或者说是使用 8 位组成一个数字的系统。这意味着是一个像 `0`、`7` 或 `32,767` 这样的整数。`unsigned`（无符号）表示数字不能为负数，例如
    `-512`。在计算机术语中，`1` 或 `0` 被称为位（bit）。我们不会详细介绍计算机如何使用位来计数的，这是一个非常有趣的自学课题。


    然而，知道 `byte` 的范围有限（从 `0` 到 `255`）是非常重要的。我留给你们这样一个概念：如果你使用二进制而不是十进制，你可以用十根手指数到
    `1023`。你的手指可以用来表示一个 10 位无符号整数。计算机的计算能力过去比现在受限得多。20 世纪 80 年代制造的 8 位游戏机颜色有限，确切来说是
    `256` 种。


    这种限制是基于处理器能够处理的位数。处理器在任何时刻使用的晶体管数量是的。不久后，浮点协处理器被引入，它们通过具有更接近 `32 bits` 的工作空间允许大得多的数值范围。在所有这些情况下，当你使用值类型时，该数字实际上是以
    `1s` 和 `0s` 的形式存储在你计算机的 RAM 中的。这应该被认为是非常了不起的。


    在过去，你必须经历重重火考验才能存储一个值。现在你只需要输入 `float f = 3.1415926535;`，你就可以精确到单个原子宽度测量宇宙的周长。所有这些类型的共同点是它们是作为单个元素存储的。大值如
    `double gigawatts = 1210000000.0;` 和 `double mint = 2.0;` 使用相同的内存。


    你的计算机不会为一个 `double` 或另一个分配更多的内存空间。这些类型被称为原始类型（primitive types）。`int` 和 `float`
    之间的唯一区别是它们每次使用的位数，分别为 `8` 位和 `32` 位；`doubles` 使用 `64 bits`。


    `string` 和 `object` 类型在存储方式上略有不同。这些类型是任意数量元素的组合 `string` 或 `object` 越大，占用的内存块就越大。这些被称为引用类型，有时被称为可空类型，因为
    Java 不查看内存中的单个元素获取数据。


    ### 强类型


    这与你在键盘上输入有多快无关！


    Java 看到数字在写法上存在差异。整数数字 `1` 与 `1.0` 不同，尽管我们可以认为它们的值相同。这些差异可以通过添加一个字母来产生。因此，`1.0`
    和 `1.0f` 也是不同的数字。Java 是一种强类型编程语言。当编程语言使用强类型时，你会被将不同的类型分开。


    这意味着这两个数字是不同的类型，在允许操作之前，我们需要将其中一个转换以匹配另一个。除了改变内存的使用方式，类型还限制了在团队工作时可能出现的问题。


    ## 算法思维


    算法是一个详细的逐步步骤的指令集或公式，用于解决问题或完成任务。在计算中，程序员编写算法指示计算机如何执行任务。


    当你以最通用的方式思考算法（不仅限于计算）时，算法无处不在。食物食谱是一个算法，你解决加法或长除法的方法是一个算法，折叠衬衫或裤子的过程也是算法。甚至你的早晨常规也可以被看作是一个算法！事实上，你孩子的早晨可能写成这样的算法：


    哪些问题是由算法解决的？


    排序并不是算法开发的唯一计算问题。算法的应用无处不在，包括以下示例：


    1. 人类基因组计划在目标取得了巨大进展：识别人类 DNA 中所有的 10 万个基因、确定组成人类 DNA 的 30 亿碱基对序列、将这些信息存储在数据库中以及开发数据分析工具。每一步都需要复杂的算法。虽然涉及的各种解决方案超出了本书的范围，但许多解决这些生物问题的方法使用了书中几个章节的观点，从而使科学家能够在高效利用资源的同时完成任务。节省的是时间（人类和机器）以及金钱，因为可以从实验技术中提取出更多信息。


