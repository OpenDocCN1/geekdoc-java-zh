    \ // 如果 x 在 arr[] 中存在，返回其索引，否则\n    // 返回 -1\n    int binarySearch(int arr[],\
    \ int x) {\n        int l = 0, r = arr.length - 1;\n        while (l <= r) {\n\
    \            int m = l + (r-l)/2;\n            // 检查 x 是否在中间\n            if (arr[m]\
    \ == x)\n                return m;\n            // 如果 x 较大，忽略左半部分\n          \
    \  if (arr[m] < x)\n                l = m + 1;\n            // 如果 x 较小，忽略右半部分\n\
    \            else\n                r = m - 1;\n        }\n        // 如果到达这里说明元素不存在\n\
    \        return -1;\n    }\n\n    public static void main(String args[]) {\n \
    \       BinarySearch ob = new BinarySearch();\n        int arr[] = {2, 3, 4, 10,\
