  raw: 'For example, a trash-recycling machine sorts pieces of trash. The base type
    is “trash”, and each piece of trash has a weight, a value, and so on, and can
    be shredded, melted, or decomposed. From this, more specific types of trash are
    derived that may have additional characteristics (a bottle has a color) or behaviors
    (an aluminum can may be crushed, a steel can is magnetic). In addition, some behaviors
    may be different (the value of paper depends on its type and condition). Using
    inheritance, you can build a type hierarchy that expresses the problem you’re
    trying to solve in terms of its types. 


    A second example is the classic “shape” example, perhaps used in a computer-aided
    design system or game simulation. The base type is “shape,” and each shape has
    a size, a color, a position, and so on. Each shape can be drawn, erased, moved,
    colored, etc. From this, specific types of shapes are derived (inherited)—circle,
    square, triangle, and so on—each of which may have additional characteristics
    and behaviors. Certain shapes can be flipped, for example. Some behaviors may
    be different, such as when you want to calculate the area of a shape. The type
    hierarchy embodies both the similarities and differences between the shapes.  


    ![](images/00012.jpeg)


    Casting the solution in the same terms as the problem is very useful because you
    don’t need a lot of intermediate models to get from a description of the problem
    to a description of the solution. With objects, the type hierarchy is the primary
    model, so you go directly from the description of the system in the real world
    to the description of the system in code. Indeed, one of the difficulties people
    have with object-oriented design is that it’s too simple to get from the beginning
    to the end. A mind trained to look for complex solutions can initially be stumped
    by this simplicity. 


    When you inherit from an existing type, you create a new type. This new type contains
    not only all the members of the existing type (although the private ones are hidden
    away and inaccessible), but more importantly it duplicates the interface of the
    base class. That is, all the messages you can send to objects of the base class
    you can also send to objects of the derived class. Since we know the type of a
    class by the messages we can send to it, this means that the derived class is
    the same type as the base class. In the previous example, “A circle is a shape.”
    This type equivalence via inheritance is one of the fundamental gateways in understanding
    the meaning of object-oriented programming. 


    Since both the base class and derived class have the same fundamental interface,
    there must be some implementation to go along with that interface. That is, there
    must be some code to execute when an object receives a particular message. If
    you simply inherit a class and don’t do anything else, the methods from the base-class
    interface come right along into the derived class. That means objects of the derived
    class have not only the same type, they also have the same behavior, which isn’t
    particularly interesting. 


    You have two ways to differentiate your new derived class from the original base
    class. The first is quite straightforward: You simply add brand new methods to
    the derived class. These new methods are not part of the base-class interface.
    This means that the base class simply didn’t do as much as you wanted it to, so
    you added more methods. This simple and primitive use for inheritance is, at times,
    the perfect solution to your problem. However, you should look closely for the
    possibility that your base class might also need these additional methods. This
    process of discovery and iteration of your design happens regularly in object-oriented
    programming.  


    Interchangeable objects with polymorphism:


    When dealing with type hierarchies, you often want to treat an object not as the
    specific type that it is, but instead as its base type. This allows you to write
    code that doesn’t depend on specific types. In the shape example, methods manipulate
    generic shapes, unconcerned about whether they’re circles, squares, triangles,
    or some shape that hasn’t even been defined yet. All shapes can be drawn, erased,
    and moved, so these methods simply send a message to a shape object; they don’t
    worry about how the object copes with the message. 


    Such code is unaffected by the addition of new types, and adding new types is
    the most common way to extend an object-oriented program to handle new situations.
    For example, you can derive a new subtype of shape called pentagon without modifying
    the methods that deal only with generic shapes. This ability to easily extend
    a design by deriving new subtypes is one of the essential ways to encapsulate
    change. This greatly improves designs while reducing the cost of software maintenance. 


    There’s a problem, however, with attempting to treat derived-type objects as their
    generic base types (circles as shapes, bicycles as vehicles, cormorants as birds,
    etc.). If a method is going to tell a generic shape to draw itself, or a generic
    vehicle to steer, or a generic bird to move, the compiler cannot know at compile
    time precisely what piece of code will be executed. That’s the whole point—when
    the message is sent, the programmer doesn’t want to know what piece of code will
    be executed; the draw method can be applied equally to a circle, a square, or
    a triangle, and the object will execute the proper code depending on its specific
    type. 


    If you don’t have to know what piece of code will be executed, then when you add
    a new subtype, the code it executes can be different without requiring changes
    to the method that calls it. Therefore, the compiler cannot know precisely what
    piece of code is executed, so what does it do? 


    For example, in the following diagram the BirdController object just works with
    generic Bird objects and does not know what exact type they are. This is convenient
    from BirdController’s perspective because it doesn’t have to write special code
    to determine the exact type of Bird it’s working with or that Bird’s behavior.
    So how does it happen that, when move( ) is called while ignoring the specific
    type of Bird, the right behavior will occur (a Goose walks, flies, or swims, and
    a Penguin walks or swims)?


    ![](images/00013.jpeg)


    The answer is the primary twist in object-oriented programming:        The compiler
    cannot make a function call in the traditional sense. The function call generated
    by a non-OOP compiler causes what is called early binding, a term you may not
    have heard before because you’ve never thought about it any other way. It means
    the compiler generates a call to a specific function name, and the runtime system
    resolves this call to the absolute address of the code to be executed. In OOP,
    the program cannot determine the address of the code until run time, so some other
    scheme is necessary when a message is sent to a generic object. 


    To solve the problem, object-oriented languages use the concept of late binding.
    When you send a message to an object, the code being called isn’t determined until
    run time. The compiler does ensure that the method exists and performs type checking
    on the arguments and return value, but it doesn’t know the exact code to execute. 


    To perform late binding, Java uses a special bit of code in lieu of the absolute
    call. This code calculates the address of the method body, using information stored
    in the object (this process is covered in great detail in the Polymorphism chapter).
    Thus, each object can behave differently according to the contents of that special
    bit of code. When you send a message to an object, the object actually does figure
    out what to do with that message. '
