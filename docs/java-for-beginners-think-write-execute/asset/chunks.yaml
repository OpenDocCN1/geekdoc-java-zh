    You can’t solve someone’s problem with code if you don’t understand their problem.
    Working  on projects exposed me to the way that small businesses, marketers, brokers
    and other professionals approach the world. When you understand how they currently
    solve problems, you can work with them to come up with new and better solutions."


    —Adam Haney, CTO of Bellhops


    One thing Ross wishes he had done earlier in his career was to better appreciate
    the discipline and history of Software Engineering itself.


    These days it’s easy to dive into the vocation and only focus on the “coding.”
    Especially as browser coders or web app coders in a booming market working with
    huge dynamic programming languages (Ruby, JavaScript) and vastly quirky “computer”
    languages and formats (HTML, CSS), we might be tempted to spend all our time racing
    to master the myriad tools, frameworks and APIs so we can crush interviews or
    level up at the job. But building a product on a team is always a social exercise,
    and a particular one at that with a unique set of challenges that are mostly non-technical.
    Like, turns out the hardest thing in software engineering is deciding what to
    build, not how; though maybe this is less true in as the JavaScript mycelium rhizomes
    dramatically.


    Ross said it took him a while to understand that most of software engineering
    happens in your head first. “Coding will likely become the easy part soon. But
    a dope engineer can draw a solution with boxes, circles, and lines—and I know
    that’s a learned skill because I’ve been doing it more and it I’m getting better
    at it.” The realization that coding was much more “chin in hand and white boarding”
    was actually so resonant for him, he wrote a blog post about it.


    “Remember that this is about human beings and our lives, not just about the technology
    that you’re coding with,” says Derick. “Learn how humans think, interact and deal
    with each other. Then represent what you’ve learned in your software architecture
    and design.


    9\. DON’T RE-INVENT THE WHEEL


    * * *


    Finally, no matter how good you get, your code will never be 100% original, as
    many problems have been solved in your language of choice already. “Absolutely
    ain’t no shame in keeping the wheel as is,” Ross assures. “However, when it’s
    time to commit, you better be damn sure you can defend that code to your team
    with Dwayne Johnson-like charm and confidence.”


    “Don’t re-invent the wheel just because you don’t understand an abstraction,”
    Mike reminds us.


    However, this isn’t to say there is absolutely no value to re-inventing the wheel.
    Matthew Zeiler, CEO of Clarifai, encourages people to build things that already
    have existing solutions if that’s what interests them. Building a tool from scratch
    will help you learn more about software engineering, system design, scalability,
    and more.


    Conclusion


    * * *


    Frustrations abound when learning how to develop apps or projects, but hopefully
    the tips above made you feel more confident in your quest to become a developer.


    4 secrets of great programmers!


    #1.REGARDING CAREER


    * * *


    *   Write code that can be read, understood, and manipulated by others. This allows
    you to hand-off and take on new challenges.


    *   If you horde your knowledge, you''ll be the only care taker of it --- or in
    an engineering/business minded organization, a risk.


    *   Stop taking pride in code or hackatons survived, means nothing in a permanent
    team. Execution and collaboration will serve you greater.


    #2.REGARDING SOLUTIONS AND CODING


    * * *


    *   If you can''t explain it to a non-programmer, you might be over-complicating
    or over-optimizing.


    *   If you can''t draw a architecture diagram, you also might be over-complicating
    it.


    *   Don''t show off by writing "compact code"


    #3.REGARDING PERSONAL IMPROVEMENT


    * * *


    *   Don''t be a Java or C/C++ (or other) fan-boy/girl. You''ll be learning 10+
    languages in a long-term career. Treat them as tools, not bandwagons.


    *   There will always be a better programmer and they are hard to identify. Learn
    from them all.


    *   You are not defined by the quality of your code. Don''t judge yourself that
    way.


    #4.REGARDING PHILOSOPHY


    * * *


    *   Programming is the art of enabling non-programmers to do more than what they
    can do alone.


    *   Computer science is a catalyst to nearly every field of study or industry
    in the world. CS enables humanity to do more, solve more, be better.


    *   Computer science != programming. If your college only taught you how to program,
    go ask for your money back.


    DIFFERENCE BETWEEN A PROGRAMMER, A GOOD PROGRAMMER AND A GREAT PROGRAMMER.


    *   Programmer: anyone who can write working programs to solve problems, given
    a sufficiently detailed problem statement. 


    *   Good programmer: a programmer who collaborates with others to create maintainable,
    elegant programs suitable for use by the customer, on time and with low defect
    rates, with little or no interpersonal drama.


    *   Great programmer: a good programmer who understands algorithms and architectures
    intuitively, can build self-consistent large systems with little supervision,
    can invent new algorithms, can refactor live systems without breaking them, can
    communicate effectively and cogently with non-technical staff on technical and
    non-technical issues, understands how to keep his or her ego in check, and can
    teach his or her skills to others. 


    The path of becoming a great programmer is to start by being a programmer, and
    then develop the skills needed to be a good programmer, then practice those skills
    until you master them, then develop the skills needed to be a great programmer,
    and then practice those skills until you master them.


    The amount of time this takes depends on your personal skills, personality, and
    training.  It also depends on the experience and opportunities that you have during
    your career, and how you react to them.


    4 REASONS WHY YOUR PROGRAM CRASHES!


    There may be 4 reasons why your program may crash:


    *   Your program may depend on some element of randomness: user input, randomly
    generated number, time, etc.


    *   If Your program is using an uninitialized variable, it could be accessing
    data it isn''t supposed to (same with accessing something outside of an arrays
    indices)


    *   Your program may be using an external library that crashes all the time.


    *   Stack overflows!


    Programming Quotes!


    * * *


    “Talk is cheap. Show me the code.” 


    ― Linus Torvalds


    * * *


    “Programs must be written for people to read, and only incidentally for machines
    to execute.” 


    ― Harold Abelson, Structure and Interpretation of Computer Programs


    * * *


    “Programming today is a race between software engineers striving to build bigger
    and better idiot-proof programs, and the Universe trying to produce bigger and
    better idiots. So far, the Universe is winning.” 


    ― Rick Cook, The Wizardry Compiled


    * * *


    “Always code as if the guy who ends up maintaining your code will be a violent
    psychopath who knows where you live” 


    ― John Woods


    * * *


    “That''s the thing about people who think they hate computers. What they really
    hate is lousy programmers.” 


    ― Larry Niven


    “The best programs are written so that computing machines can perform them quickly
    and so that human beings can understand them clearly. A programmer is ideally
    an essayist who works with traditional aesthetic and literary forms as well as
    mathematical concepts, to communicate the way that an algorithm works and to convince
    a reader that the results will be correct.” 


    ― Donald Ervin Knuth, Selected Papers on Computer Science


    * * *


    “I''m not a great programmer; I''m just a good programmer with great habits.” 


    ― Kent Beck


    * * *


    “Everyone knows that debugging is twice as hard as writing a program in the first
    place. So if you''re as clever as you can be when you write it, how will you ever
    debug it?” 


    ― Brian W. Kernighan


