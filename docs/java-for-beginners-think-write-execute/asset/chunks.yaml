    \ Search the minimum element in the list\n- Step 3 - Swap with value at location\
    \ `MIN`\n- Step 4 - Increment `MIN` to point to next element\n- Step 5 - Repeat\
    \ until list is sorted\n\n### Program: Selection Sort in Java\n\n```java\npublic\
