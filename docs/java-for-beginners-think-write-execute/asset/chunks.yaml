    to larger ones.   1 item takes 1 second, 10 items takes 2 seconds, 100 items takes
    3 seconds. If your dataset has 10 items, each item causes 0.2 seconds latency.
    If your dataset has 100, it only takes 0.03 seconds extra per item. This makes
