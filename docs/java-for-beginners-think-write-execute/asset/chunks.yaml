     n is the thing the complexity is in relation to; for programming interview questions
    this is almost always the size of a collection. The complexity will increase or
    decrease in accordance with the size of the data store.


    Below is a list of the Big O complexities in order of how well they scale relative
    to the dataset.


    O(1)/Constant Complexity: Constant.  This means irrelevant of the size of the
    data set the algorithm will always take a constant time. 1 item takes 1 second,
    10 items takes 1 second, 100 items takes 1 second. It always takes the same amount
    of time.


    O(log n)/Logarithmic Complexity: Not as good as constant, but still pretty good.
     The time taken increases with the size of the data set, but not proportionately
