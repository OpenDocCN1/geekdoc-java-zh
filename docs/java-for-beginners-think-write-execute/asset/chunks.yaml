    # 第 1 章 | 引言


    ## 本书关于什么


    这本书的编写是为了任何想要学习编程语言并提高生产力的人提供答案。你可以从零开始，无需事先接触过任何编程语言。读完本书后，你将具备成为合格程序员的技能，或者至少了解阅读和编写涉及的内容。


    ## 为什么要读这本书？


    这本书的编写是为了任何想要学习编程语言并提高生产力的人提供答案。你可以从零开始，无需事先接触过任何编程语言。读完本书后，你将具备成为合格程序员的技能，或者至少了解阅读和编写涉及的内容。


    ## 我需要学习数学吗？


    这本书的编写是为了任何想要学习编程语言并提高生产力的人提供答案。你可以从零开始，无需事先接触过任何编程语言。读完本书后，你将具备成为合格程序员的技能，或者至少了解阅读和编写涉及的内容。


    ## 作为作为一种表达形式的编程


    在编程中，词汇与意义之间存在着更深层的联系。这种联系更机械化，但同时也具有灵活性。对于编程语言，程序员们称之为 `expressiveness`（表现力）。当你在文学中写单词时，你会推断出大部分甚至全部意义。而在编程时，如果推理不是隐含，你就可以自由地为词汇定义自己的意义。


