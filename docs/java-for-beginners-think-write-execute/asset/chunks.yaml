     You discover this is “Children of Men”. You repeat this again and you’ve found
    back to the future.


    Although adding more elements will increase the amount of time it takes to search,
    it doesn’t do so proportionally. Therefore it is O(log n).


    ### 3. O(n)


    As discussed in my post on collections, LinkedLists are not so good (relatively
    speaking) when it comes to retrieval.  It actually has a Big O of O(n) as in the worst
    case, to find an element T which is the last element in the list, it is necessary
