    \nThe `Mergesort` algorithm can be used to sort a collection of objects. `Mergesort`\
    \ is so called divide and conquer algorithm. Divide and conquer algorithms divide\
    \ the original data into smaller sets of data to solve the problem.\n\n## Algorithm\n\
    - Step 1: if it is only one element in the list it is already sorted, return.\n\
    - Step 2: divide the list recursively into two halves until it no more divided.\n\
    - Step 3: merge the smaller lists into new list in sorted order.\n\n## Program:\
    \ Java program for Merge Sort\n\n```java\nclass MergeSort {\n    // Merges two\
    \ subarrays of arr[\n    // First subarray is arr[l..m]\n    // Second subarray\
    \ is arr[m+1..r]\n    void merge(int arr[], int l, int m, int r) {\n        //\
    \ Find sizes of two subarrays to be merged\n        int n1 = m - l + 1;\n    \
    \    int n2 = r - m;\n        /* Create temp arrays */\n        int L[] = new\
