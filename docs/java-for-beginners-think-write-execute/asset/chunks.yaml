    ### 关键字


    关键字是特殊的单词或符号，它们告诉编译器执行特定的操作。例如，行首的关键字 `class` 告诉编译器你正在创建一个类。类声明是告诉编译器你即将创建一个新类的代码行。单词出现的顺序非常重要。英语需要句子和语法才能向读者妥善地传达我们的思想。


    在代码中，无论是 `Java` 还是其他语言，编程都需要语句和语法来向计算机正确传达指令。


    ```

    class className


    {


    }

    ```


    每个类都需要一个名称；在上面的示例中，我们把类命名为 `className`，尽管我们很容易地将类命名为 `Charles`。当命名一个新类时，该名称变成了一个新的标识符。这对于每个变量名也是如此，尽管作用域限制了变量标识符存在的长度和位置。我们将很快学习更多关于变量和作用域的知识。你不能将关键字用于
    `Java` 预期用途之外的任何地方。有例外，但通常情况下，关键字为你提供了特定的命令。


    `Java` 中总大约有 80 个你应该注意的关键字。


    ### 标记


    在书面英语中，语言的最小元素是字母和数字。单独的大多数字母和数字缺乏特定的含义。字母之后更大的元素是单词。每个单词都有更多的含义，但复杂的思想很难用一个单词传达。为了传达一个思想，我们使用句子。句子中的每个单词都有特定的用途，如下图所示。为了传达一个概念，我们使用一组句子组成成一个段落。为了传达情感，我们使用许多段落组成成章节。为了讲述一个故事，我们使用书，即章节的集合。


    ![](img/00002.jpeg)


    编程有类似的组织机制。最小的有意义元素是标记（token），随后是语句、代码块、函数，然后类和命名空间，最后是程序，在我们的案例中是一个游戏。我们将从最小元素开始，一直到编写自己的类。然而，在开始编写复杂代码之前，了解非常小的元素对于理解所有部分是如何结合是非常重要的。


    编写 Java：


    Java 是一种基于英语的编程语言；像任何其他 C 类编程语言一样，它可以被拆分为标记，即计算机可以理解的最小意义文本片段。标记由单个字符或一系列字符组成。例如，在下面这个简单的语句中有五个标记。


    ![](img/00003.jpeg)


    标记可以分类为关键字、标识符、字面量、运算符、分隔符和空白。上面的语句包含五个标记，并提供了空白支持。关键字 `int` 后面是标识符 `i`。之后是一个运算符
    `=`，它将运算符左侧的标识符赋值右侧字面量 `0` 的值。最后一个标记 `;` 是分隔符，用于结束语句。空白和注释（我们尚未涵盖）不被视为标记，尽管它们可以充当分隔符。使用正确的格式或风格是非常重要的。


    让我们检查示例代码：


    ```

    int i = 0; int j = 1;

    ```

