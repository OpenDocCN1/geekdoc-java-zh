    \n二分查找是计算机科学中基础算法之一。为了探索它，我们首先建立一个理论框架，然后利用它来正确实现该算法，并避免大家一直在讨论的那些讨厌的差错误（off-by-one\
    \ errors）。\n\n### 在有序序列中查找值\n\n在最简单的形式中，二分查找用于在有序序列中快速找到一个值（目前将序列视为普通数组）。我们将要查找的值称为\
    \ `target`。二分查找维护一个目标值所在的连续序列。初始状态下，搜索空间是整个序列。在每一步中，算法将中位数与目标值进行比较。\n\n例如，考虑以下序列，假设我们要查找\
    \ `55`：\n\n| 0 | 5 | 13 | 19 | 22 | 55 | 68 | 72 | 81 | 98 |\n\n我们对目标值的位置感兴趣，因此用索引表示搜索空间。从这里我们得出不仅索引\
    \ `6` 不是目标值，而且索引 `1` 到 `5` 的元素都不可能是目标值，因为所有元素都小于 `41`。这使得搜索空间缩小到索引 `7` 到 `11`：\n\
    \n| 55 | 68 |\n\n如果目标存在，二分查找将清空搜索空间。这个条件很容易检查和处理。这里是配合描述的代码：\n\n```python\ndef\
    \ binary_search(A, target):\n    lo = 1, hi = size(A)\n    while lo <= hi:\n \
    \       mid = lo + (hi-lo)/2\n        if A[mid] == target:\n            return\
    \ mid\n        elif A[mid] < target:\n            lo = mid+1\n        else:\n\
    \            hi = mid-1\n    # 未找到目标\n```\n\n复杂度：\n\n由于二分查找每次比较都使搜索空间减半，我们可以断定并容易证明二分查找查找值永远不会超过（大\
    \ O 表示法）`O(log N)` 次比较。\n\n对数是一个增长极其缓慢的函数。如果你不知道二分查找到底有多高效，考虑在一个包含百万名字的电话簿中查找一个名字。二分查找让你最多通过\
    \ 21 次比较找到任何给定的名字。如果你能管理一个按名字排序的世界范围内人的列表，你可以在少于 35 步找到任何人。\n\n程序：Java 实现递归二分查找\n\
