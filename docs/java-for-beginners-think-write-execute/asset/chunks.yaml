    this is the preferred place to begin our code using Java. Once Main() is called,
    the computer goes to the first line in Main() and begins to carry out the instructions
    written there. As the computer gets to each statement the computer starts on the
    left of the statement and works its way to the right. Basically, a computer reads
    code like you’re reading this sentence.


    Learning To Copy & Paste


    “A good artist creates, a great artist steals.” There are code examples for you
    to copy and paste into your project. The content of this book and all downloadable
    content are no different. This means that you’ll have to understand what the code
    is doing to interpret it to fit your needs.


    Every programmer does this habitually.


     ![https://3.bp.blogspot.com/-YFiXeWOGauQ/WBNOs__W1OI/AAAAAAAAGsc/Ug6oi8Vi3A4bz9wIIepvh0w2f96G_3CswCK4B/s320/copypaste_logo.png](images/00016.jpeg)


    It is important to learn how to do this since it is something that you actually
    need to do in many cases not only to learn but also to get any unfamiliar task
    done. Programming is a constant learning process. It is a language to command
    computers.


    Anytime you learn a new language, there will be plenty of words which you’ll have
    to look up.


    Add to this the fact that every programmer gets to make up new words, and you’ve
    got a language that you’ll always need a dictionary for.


    When some code is shown, you’ll be expected to copy that code into your project.
    With your fingers ready on the keyboard, you’ll want to get in the habit of typing.


    There is a reason why programmers are usually fast typists. This is also cause
    for programmers to be picky about what keyboard they prefer. In most cases, the
    projects in this book will be in some state where you can read text that is already
    in place.


    Most of the projects are in a more complete state, where you’ll be able to run
    them and see an intended result. As a programmer I’ve gotten used to searching
    the Internet for example code.


    Once I’ve discovered something that looks useful, I copy that code and paste it
    into a simple test case. After I’ve wrapped my head around what the code is doing,
    I rewrite it in a form that is more suited for my specific case.


    Even if the code involves some fun trick, I’ll learn from that code.


    As I learn new tricks, I grow as a programmer. The only way to learn new tricks
    is to find the necessity to solve a new problem for which I haven’t already figured
    out a solution. Finding solutions to problems is a fundamental part of being a
    programmer.


    Understanding Floating Points


    Floating point numbers have been a focus of computers for many years. Gaining
    floating point accuracy was the goal of many early computer scientists. Because
    there are an infinite possibilities of how many numbers can follow a decimal point,
    it’s impossible to truly represent any fraction completely using binary computing.


    A common example is π, which we call pi. It’s assumed that there are an endless
    number of digits following 3.14\. Even today computers are set loose to calculate
    the hundreds of billions of digits beyond the decimal point.


    Computers set aside some of the bits of a floating point number aside to represent
    where the decimal appears in the number, but even this is limited. The first bit
    is usually the sign bit, setting the negative or positive range of the number.
    The following 8 bits is the exponent for the number called a mantissa. The remaining
    bits are the rest of the number appearing around the decimal point. A float value
    can move the decimal 38 digits in either direction, but it’s limited to the values
    it’s able to store.


    Without special considerations, computers are not able to handle arbitrarily large
    numbers. To cast a float into an int, you need to be more explicit.


    That’s why Java requires you to use the cast and you need to add the (int) in


    int Zint = (int)Zmove;.


    The (int) is a cast operator; or rather (type) acts as a converter from the type
    on the right to the type needed on the left.


    Big O Notation


    Big O notation is the language we use for articulating how long an algorithm takes
    to run. It''s how we compare the efficiency of different approaches to a problem.


     Imagine you have a list of 10 objects, and you want to sort them in order.  There’s
    a whole bunch of algorithms you can use to make that happen, but not all algorithms
    are built equal.  Some are quicker than others but more importantly the speed
    of an algorithm can vary depending on how many items it’s dealing with. Big O
    is a way of measuring how an algorithm scales.  Big O references how complex an
    algorithm is.


    Big O is represented using something like O(n).  The O simply denoted we’re talking
