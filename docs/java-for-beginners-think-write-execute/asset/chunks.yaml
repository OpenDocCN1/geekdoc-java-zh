  trans: "\n无论大小如何，它始终以恒定的速度返回。`Queue` 的 javadoc 规定，“检索方法（`peek`、`element` 和 `size`）是常数时间”。这其中的原因显而易见。对于\
    \ `peek`，我们总是返回第一个元素，而我们始终拥有该元素的引用；它后面有多少个元素并不重要。列表的大小在元素添加/删除时更新，无论列表大小如何，引用这个数字都只需要一次操作。\n\
    \n### 2. O(log n)\n\n经典的例子是二分查找。你是一个巨大的极客，所以你显然对你的电影收藏按字母顺序排列了序。为了找到你的《回到未来》，你首先来到列表的中间。你发现中间的电影是《史福克斯一家聚聚》，然后你转向开头和这电影电影之间的部分。你发现那部电影是《生机断》。再次重复这个过程，你就找到了《回到未来》。\n\
    \n虽然增加更多元素会增加搜索所需的时间，但增加并不是比例增加的。因此，它是 `O(log n)`。\n\n### 3. O(n)\n\n正如我在关于 `collections`\
    \ 的文章中所讨论的，链表（LinkedLists）在检索方面（相对而言）并不太好。它的大 O 复杂度实际上是 `O(n)`，因为在最坏情况下，为了找到列表中的最后一个元素\
    \ `T`，必须遍历整个包含 `n` 个元素的列表来找到 `T`。随着元素数量的增加，访问时间也会按比例增加。\n\n### 4. O(n log n)\n\
    \n`O(n log n)` 的最佳例子是合并排序。这是一种分治算法。假设你有一个整数列表。我们不断地划分列表，直到剩下若干个包含 1 个元素的列表；因此，这些列表每一个都是有序的。然后我们将每个列表与其邻居合并（每次都比较每个列表的第一个元素）。我们对新的组合列表重复此操作，直到我们得到排序后的结果。\n\
    \n## 如何在面试中确定 Big O？\n\n这并不是 Big O 的穷尽列表。就像你可以写 `O(n2)` 一样，你也可以 `O(n³)`（想象在没有明显原因的情况下为你的泡排序增加一个额外的循环）。此页面上的列表应该让你能够尝试找出算法的\
    \ Big O 是多少。如果有人在面试中问你这个问题，他们可能想看你是如何尝试推导出来的。拆解循环和处理过程。\n\n* 它必须遍历整个列表吗？那里某处有一个\
    \ `n`。\n* 算法的处理时间增长速度是否比数据集的大小增长速度慢？那么那里可能有一个 `log n`。\n* 是否有嵌套循环？你可能在看 `n²` 或\
    \ `n³`。\n* 访问时间是否与数据集的大小无关？？`O(1)`\n\n## 示例问题：\n\n我有一个随机排列的 `1` 到 `100` 数字的数组。其中缺少一个数字。写一个算法来找出这个数字是什么以及缺失的位置在哪里。\n\
    \n这个问题有很多变体，都非常流行。要计算缺失的数字，我们可以简单地将我们所有的数字相加，并将其减去 `1` 到 `100` 之间所有数字和的预期值。为了这样做，我们需要遍历列表一次。在此过程中我们还可以记录下哪个位置有缺口。\n\
    \n```java\npublic void findTheBlank(int[] theNumbers) {\n    int sumOfAllNumbers\
    \ = 0;\n    int sumOfNumbersPresent = 0;\n    int blankSpace = 0;\n    for (int\
    \ i = 0; i < theNumbers.length; i++) {\n        sumOfAllNumbers += i + 1;\n  \
    \      sumOfNumbersPresent += theNumbers[i];\n        if (theNumbers[i] == 0)\n\
    \            blankSpace = i;\n    }\n    System.out.println(\"Missing number =\
    \ \" + (sumOfAllNumbers - sumOfNumbersPresent) + \" at location \" + blankSpace\
    \ +\" of the array\");\n}\n\nnew BubbleSort().findTheBlank(new int[]{7,6,0,1,3,2,4});\n\
    \n// 缺失数字 = 5，位于数组位置 2\n```\n\n这个算法的 big O 是多少？\n\n我们的算法遍历了列表一次，所以它简单是 `O(n)`。\n\
    \nBig-O 复杂度图：\n\n![](img/00017.jpeg)\n\n![](img/00018.jpeg)\n\n数组排序算法复杂度：\n\n\
