  trans: "\n\n## Socket 类\n\n| 4 | `public Socket(InetAddress host, int port, InetAddress\
    \ localAddress, int localPort) throws IOException` | 此方法与之前的构造函数相同，不同之处在于 `host`\
    \ 由 `InetAddress` 对象表示而不是 `String`。 |\n| 5 | `public Socket()` | 创建一个未连接的 socket。使用\
    \ `connect()` 方法将此 socket 连接到服务器。 |\n\n当 `Socket` 构造函数返回时，它并不仅仅是实例化了一个 `Socket`\
    \ 对象，而是实际上尝试连接到指定的服务器和端口。\n\n这里列出了 `Socket` 类中一些感兴趣的方法。请注意，客户端和服务器都拥有一个 `Socket`\
    \ 对象，因此这些方法可以被客户端和服务器共同调用。\n\n| 序序号 | 方法与描述 |\n| :--- | :--- |\n| 1 | `public\
    \ void connect(SocketAddress host, int timeout) throws IOException` | 此方法将 socket\
    \ 连接到指定的 `host`。只有当您使用无参数构造函数实例化 `Socket` 时，才需要此方法。 |\n| 2 | `public InetAddress\
    \ getInetAddress()` | 此方法返回此 socket 所连接的另一台计算机的地址。 |\n| 3 | `public int getPort()`\
    \ | 返回 socket 在远程机器上绑定的端口。 |\n| 4 | `public int getLocalPort()` | 返回 socket 在本地机器上绑定的端口。\
    \ |\n| 5 | `public SocketAddress getRemoteSocketAddress()` | 返回远程 socket 的地址。\
    \ |\n| 6 | `public InputStream getInputStream() throws IOException` | 返回 socket\
    \ 的输入流。该输入流连接到远程 socket 的输出流。 |\n| 7 | `public OutputStream getOutputStream()\
    \ throws IOException` | 返回 socket 的输出流。该输出流连接到远程 socket 的输入流。 |\n| 8 | `public\
    \ void close() throws IOException` | 关闭 socket，使得此 `Socket` 对象不再能够连接到任何服务器。 |\n\
    \n## InetAddress 类方法\n\n此类表示一个 Internet 协议（IP）地址。以下是您进行 socket 编程时可能需要的有用方法：\n\
    \n| 序序号 | 方法与描述 |\n| :--- | :--- |\n| 1 | `static InetAddress getByAddress(byte[]\
    \ addr)` | 给定原始 IP 地址返回一个 `InetAddress` 对象。 |\n| 2 | `static InetAddress getByAddress(String\
    \ host, byte[] addr)` | 根据提供的主机名和 IP 地址创建 `InetAddress`。 |\n| 3 | `static InetAddress\
    \ getByName(String host)` | 给定主机名，确定主机的 IP 地址。 |\n| 4 | `String getHostAddress()`\
    \ | 返回文本形式的 IP 地址字符串。 |\n| 5 | `String getHostName()` | 获取此 IP 地址的主机名。 |\n| 6\
    \ | `static InetAddress getLocalHost()` | 返回本地主机。 |\n| 7 | `String toString()`\
    \ | 将此 IP 地址转换为 `String`。 |\n\n## Socket 客户端示例\n\n以下 `GreetingClient` 是一个客户端程序，它通过\
    \ socket 连接到服务器并发送问候语，然后等待响应。\n\n### 示例\n\n```java\n// 文件名 GreetingClient.java\n\
    import java.net.*;\nimport java.io.*;\n\npublic class GreetingClient {\n    public\
    \ static void main(String[] args) {\n        String serverName = args[0];\n  \
    \      int port = Integer.parseInt(args[1]);\n        try {\n            System.out.println(\"\
    Connecting to \" + serverName + \" on port \" + port);\n            Socket client\
    \ = new Socket(serverName, port);\n            System.out.println(\"Just connected\
    \ to \" + client.getRemoteSocketAddress());\n            OutputStream outToServer\
    \ = client.getOutputStream();\n            DataOutputStream out = new DataOutputStream(outToServer);\n\
    \            out.writeUTF(\"Hello from \" + client.getLocalSocketAddress());\n\
    \            InputStream inFromServer = client.getInputStream();\n           \
    \ DataInputStream in = new DataInputStream(inFromServer);\n            System.out.println(\"\
    Server says \" + in.readUTF());\n            client.close();\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
    \n## Socket 服务器示例\n\n以下 `GreetingServer` 程序是一个服务器应用程序示例，它使用 `Socket` 类在命令行参数指定的端口号上监听客户端——\n\
    \n### 示例\n\n```java\n// 文件名 GreetingServer.java\nimport java.net.*;\nimport java.io.*;\n\
    \npublic class GreetingServer extends Thread {\n    private ServerSocket serverSocket;\n\
    \n    public GreetingServer(int port) throws IOException {\n        serverSocket\
    \ = new ServerSocket(port);\n        serverSocket.setSoTimeout(10000);\n    }\n\
    \n    public void run() {\n        while (true) {\n            try {\n       \
    \         System.out.println(\"Waiting for client on port \" + serverSocket.getLocalPort()\
    \ + \"...\");\n                Socket server = serverSocket.accept();\n      \
    \          System.out.println(\"Just connected to \" + server.getRemoteSocketAddress());\n\
    \                DataInputStream in = new DataInputStream(server.getInputStream());\n\
    \                System.out.println(in.readUTF());\n                DataOutputStream\
    \ out = new DataOutputStream(server.getOutputStream());\n                out.writeUTF(\"\
    Thank you for connecting to \" + server.getLocalSocketAddress() + \"\\nGoodbye!\"\
    );\n                server.close();\n            } catch (SocketTimeoutException\
    \ s) {\n                System.out.println(\"Socket timed out!\");\n         \
    \       break;\n            } catch (IOException e) {\n                e.printStackTrace();\n\
    \                break;\n            }\n        }\n    }\n\n    public static\
    \ void main(String[] args) {\n        int port = Integer.parseInt(args[0]);\n\
    \        try {\n            Thread t = new GreetingServer(port);\n           \
    \ t.start();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n"
- fmt: "\n## URL Methods\n\n| 8 | `public String getHost()` Returns the host of the\
    \ URL. |\n| 9 | `public String getFile()` Returns the filename of the URL. |\n\
    | 10 | `public String getRef()` Returns the reference part of the URL. |\n| 11\
    \ | `public URLConnection openConnection() throws IOException` Opens a connection\
    \ to the URL, allowing a client to communicate with the resource. |\n\n### Example\n\
    \nThe following `URLDemo` program demonstrates the various parts of a `URL`. A\
    \ `URL` is entered on the command line, and the `URLDemo` program outputs each\
    \ part of the given `URL`.\n\n```java\n// File Name : URLDemo.java\n\nimport java.net.*;\n\
    import java.io.*;\n\npublic class URLDemo {\n    public static void main(String\
    \ [] args) {\n        try {\n            URL url = new URL(\"https://www.amrood.com/index.htm?language=en#j2se\"\
    );\n            System.out.println(\"URL is \" + url.toString());\n          \
