    Variable names can’t start with any numbers. To be perfectly honest, I’m not sure
    why this case breaks the compiler, but it does seem to be related to why numbers
    alone can’t be used as variable names.


    ```

    int $; int this-that; int (^_^);

    ```


    Most special characters also have meanings, and are reserved for other uses. For
    instance, in `JAVA` a `-` is used for subtracting; in this case `JAVA` may think
    you’re trying to subtract `that` from `this`. Keywords, you should remember, are
    also invalid variable names as they already have a special meaning for `JAVA`.
    In IDE (integrated Development Environment), you might notice that the word `this`
    is highlighted, indicating that it’s a keyword. Spaces in the middle of a variable
    are also invalid.


    ```

    int Spaces are bad;

    ```


    Most likely, adding characters that aren’t letters will break the compiler. Only
    the underscore and letters can be used for identifier names. As fun as it might
    be to use emoticons for a variable, it would be quite difficult to read when in
    use with the rest of the code.


    ```

    int ADifferenceInCase; int adifferenceincase;

    ```


    The two variables here are actually different. Case-sensitive languages like `java`
    do pay attention to the case of a character; this goes for everything else when
    calling things by name. Considering this: `A` is different from `a`.


    As a programmer, you need to consider what a variable should be named. It must
    be clear to you and anyone else with whom you’ll be sharing your work with. You’ll
    also be typing your variable name many times, so they should be short and easy
    to remember and type. The last character we discuss here is the little strange
    `@` or at. The `@` can be used only if it’s the first character in a variable’s
    name.


    ```

    int @home;


    int noone@home;

    ```


    In the second variable declared here we’ll get an error. Some of these less regular
    characters are easy to spot in your code. When you have a long list of variables
    it’s sometimes best to make them stand out visually. Some classically trained
    programmers like to use an underscore to indicate a class scope variable. The
    underscore is omitted in variables which exist only within a function. You would
    find the reason for the odd rule regarding `@` when you use `int`, which is reserved
    as a keyword. You’re allowed to use `int @int`, after which you can assign `@int`
    any integer value. However, many programmers tend to use `MyInt`, `mInt`, or `_
    int` instead of `@int` based on their programming upbringing.


    Good programmers will spend a great deal of time coming up with useful names for
    their variables and functions. Coming up with short descriptive names takes some
    getting used to, but here are some useful tips. Variables are often named using
    nouns or adjectives as they describe an attribute related to what they’re used
    for.


    In the end once you start using the name of the variable throughout the rest of
    your code, it becomes harder to change it as it will need to be changed everywhere
    it’s used. Doing a global change is called refactoring, and this happens so often
    that there is software available to help you “refactor” class, variable, and function
    names.


    NOTE:


    You may also notice the pattern in which uppercase and lowercase letters are used.
    This is referred to as either `BumpyCase` or `CamelCase`. Sometimes, the leading
    letter is lowercase, in which case it will look like `headlessCamelCase` rather
    than `NormalCamelCase`. Many long debates arise between programmers as to which
    is correct, but in the end either one will do. Because `Java` is case sensitive,
    you and anyone helping you should agree whether or not to use a leading uppercase
    letter. These differences usually come from where a person learned how to write
    software or who taught that person. The use of intermixed uppercase and lowercase
    is a part of programming style. Style also includes how white space is used.


    ### Keywords


    Keywords are special words, or symbols, that tell the compiler to do specific
    things. For instance, the keyword `class` at the beginning of a line tells the
    compiler you are creating a class. A class declaration is the line of code that
    tells the compiler you’re about to create a new class. The order in which words
    appear is important. English requires sentences and grammar to properly convey
    our thoughts to the reader.


    In code, `Java` or otherwise, programming requires statements and syntax to properly
    convey instructions to the computer.


    ```

    class className


    {


    }

    ```


    Every class needs a name; in the above example we named our class `className`,
    although we could have easily named the class `Charles`. When a new class is named
    the name becomes a new identifier. This also holds true for every variable’s name,
    though scope limits how long and where the variable’s identifier exists. We’ll
    learn more about variables and scope soon. You can’t use keywords for anything
    other than what `Java` expects them to be used for. There are exceptions, but
    in general, keywords provide you with specific commands.


    Altogether in `Java` there are roughly 80 keywords you should be aware of.


    ### Tokens


    In written English the smallest elements of the language are letters and numbers.
    Individually, most letters and numbers lack specific meaning. The next larger
    element after the letter is the word. Each word has more meaning, but complex
    thoughts are difficult to convey in a single word. To communicate a thought, we
    use sentences. The words in a sentence each have a specific use, as seen in the
    diagram below. To convey a concept we use a collection of sentences grouped into
    a paragraph. And to convey emotion we use a collection of many paragraphs organized
    into chapters. To tell a story we use a book, a collection of chapters.


    ![](images/00002.jpeg)


    Programming has similar organizational mechanisms. The smallest meaningful element
    is a token, followed by statements, code blocks, functions, followed by classes
    and namespaces and eventually a program, or in our case a game. We will begin
    with the smallest element and work our way up to writing our own classes. However,
    it’s important to know the very smallest element to understand how all the parts
    fit together before we start writing any complex code.


    Writing Java:


    Java is an English-based programming language; like any other C-like programming
    language it can be broken into tokens, the smallest meaningful fragment of text
    that the computer can understand. Tokens are made of a single character or a series
    of characters. For instance, in a simple statement like the following there are
    five tokens.


    ![](images/00003.jpeg)


    Tokens can be categorized as a keyword, identifier, literal, operator, separator,
    and white space. The above statement contains five tokens with spacing provided
    with white space. The keyword `int` is followed by the identifier `i`. This is
    followed by an operator `=` which assigns the identifier on the left of the operator
    and the value of the literal `0` on the right. The last token `;` is a separator
    which ends the statement. White spaces and comments, which we have yet to cover,
    are not considered tokens, although they can act as separators. It’s important
    that proper formatting or style be used.


    Let’s examine a sample of code:


    ```

    int i = 0; int j = 1;

    ```

