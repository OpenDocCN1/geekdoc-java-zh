    *   **测试**：大多数自学者缺乏知识，或者通来说不理解测试过程的重要性。

    *   **编程范式（及相应的语言）**：“如果你手里只有一把锤子，看什么都像钉子。”我遇到过很多这种“锤子型”的人。他们往往只是不理解为什么不是每个问题都能用相同的方式或相同的方法论来解决。

    *   **与相关的数学问题**：他们缺乏数值数学技能，并且不理解如果不注意，浮点数运算为什么会出错。


    # 面试需要准备哪些最重要的数据结构和算法？


    你知道吗？前 10 个[数据结构](https://goo.gl/E2ENP8) 占据了现实世界所有数据结构使用的 99%？可能不知道，因为这我随口编造的数字——但它们大致是对的。是的，偶尔我们会问一个最优解需要[布隆过滤器](http://en.wikipedia.org/wiki/Bloom_filter)
    或[后缀树](http://en.wikipedia.org/wiki/Suffix_tree) 的问题，但即使是这些问题，往往也存在使用更平庸的数据结构的近优解。出现频率最高的数据结构是：


    *   数组

    *   栈 / 队列

    *   集合 / 哈希映射 / 哈希表 / 字典

    *   树 / 二叉树

    *   堆

    *   图


    你应该对这些数据结构了如指掌。插入/删除/查找的特性是什么？（例如，平衡二叉树为 `O(log n)`）。常见的注意事项有哪些？（哈希很复杂，当 k 是被哈对象的大小时，通常需要
    `O(k)` 时间。）


    哪些算法通常与每种数据结构配合使用？（图的 [Dijkstra](https://secure.wikimedia.org/wikipedia/en/wiki/Dijkstra%27s_algorithm)。）但当你理解了这些数据结构后，有时你刚一想到使用正确的数据结构，问题的解决方案就会跳入脑海。


    坚持基础。我将以下数据结构归类为**必知**：


    1.  `Linked List`（链表）—— 单链和双向链

    2.  `Stack`（栈）

    3.  `Queues`（队列）

    4.  `Binary Search Trees`（二叉搜索树）或通用 `Binary Tree`（二叉树）

    5.  `Heaps`（堆）

    6.  基础 `Graph Traversal`（图遍历）和 `Shortest Path`（最短路径）

    7.  `Hashing`（哈希）


    以下数据结构可能会被问。。它们被问到的概率在 50 到 75% 之间：


    1.  `Tries`（字典树）

    2.  高级图，如流和最小切等

    3.  `Bit Manipulation`（位操作）


    只要具备上述知识，你就能通过面试。


    以下被问到的概率非常低（< 25%）：


    1.  `Segment Trees`（段树）/ `Binary Indexed Trees`（二叉索引树）

    2.  `AVL Trees`（AVL 树）

    3.  `B+ Trees`（B+树）


    其他困难的数据结构绝对没有必要。


    以下算法/技巧/主题可能也重要：


    1.  `Memory Management`（内存管理）

    2.  基础坐标几何 - `Manhattan Distance`（曼哈顿距离）、`Closest Point Pair`（最近点对）

    3.  `Divide and Conquer`（分治法）

    4.  `Greedy`（贪心）

    5.  `Dynamic Programming`（动态规划）——极其重要

    6.  `Probability`（概率）和基础 `Number Theory`（数论）

    7.  `Sorting and Searching`（排序与搜索）


    以下主题对于基于知识/经验的问题很重要：


    1.  `OS`（操作系统）—— 使用 `Mutex`（互斥锁）、`Semaphores`（信号量）的 `Threads`（线程）、`Processes`（进程）和锁

    2.  `Scalability Issues`（扩展性问题）、RPCs、`Rate limiter`（限流器）等

    3.  `OOP Concepts`（面向对象概念）

    4.  `Databases`（数据库）—— `SQL`, `NoSQL`, 编写简单的 `Queries`（查询）、`Transactions`（事务）、`ACID`

    5.  `Linux Commands`（Linux 命令）—— `sed`, `grep`, `ps` 等


    # 成为优秀程序员的 9 种方法！


    ## 1. 练习


    除了遵循教程之外，你还应该努力自己的项目。


    “最根本的事情是你实际上去写代码。我听过建议，大学毕业时你至少应该写过 100,000 行代码。”来自 Evernote 的 Andrei Thorp。


    但你可能会问，我该如何开始。


    “我总是告诉人们找一件每周做超过一次的事情，并尝试将其自动化。不要管别人以前是否解决过这个问题，只需为你自己制作一个工具/实用程序来解决生活中的常见问题。”——
    Stack Overflow 移动负责人 Kasra Rahjerdi。


    “像任何其他技能一样，它需要练习——刻意练习，走出舒适区并学习细微差别和微妙之处——这区分了优秀与平庸。”—— WatchMeCode.net 的创建者 Derick
    Bailey。


    Derick 是 StackOverflow 上前 0.42% 的用户，也曾为 `MarionetteJS` 和 `BackboneJS` 等开源框架贡献过代码。


    失败没关系。编码本质就是关于失败和修复问题，以及学习如何做得更好。如果你不构建东西，并且不在你知道自己弱的领域下努力，你永远不会好起来。如果你需要关于如何改进以及你哪里做得不好的建议，请随时向经验丰富的开发者寻求，通过审查你的代码或引导你理解你有困难的概念来帮助你纠正。


    ## 2. 有耐心


    这显而易见，但人们很容易因为缺乏进展而沮丧，并忘记你并不孤单。


    “成为一个好的程序员需要很长的时间。在写出好代码之前，你必须写几十万行代码。”—— Mike Arpaia，曾任 Etsy 开发人员，现在为 Facebook
    负责信息安全工作。


    Mike 强调，初学者应该放弃很快就能变优秀的假设。但是……如果你还没过教程阶段呢？如果你还在撞墙并怀疑自己不是块块呢？教程作者 Michael Hartl
    指出，初学者应该尝试不同的资源（书籍、视频等），看看什么最适合自己。


    ## 3. 保持兴趣


    如果你对正在进行的项目感到无味，你可能应该重新考虑学习代码的高目标。或者，你只是找错了项目，或通过错误的资源学习。始终通过让你兴奋的个人项目来保持动力。


    Coraline Ada Ehmke 是 LGBTech 的创始人，`Rails` 和 `RSpec` 等知名开源项目的贡献者，她从很小就开始编程。然而，大学里计算机科学专业的第一门课让她怀疑了自己的热忱。


    “我记得我们一个学期的项目是为一台 ATM 编写软件。我感到非常无聊且没有挑战，我决定如果工程师的生活就是这样，我不想参与其中，于是不久后我退学了。”然而，她继续做她觉得感兴趣的项目。到
    1993 年她已经在在线构建网站，并从此一直开发 Web 应用。


    ## 4. 喜爱错误


    作为初学者，你可能会陷入 Bug 的海洋。如果你对所有的红色（错误信息）感到恐惧，你并不孤单。曾在 Zendesk 担任过 UX 工程师、现在在 ScienceExchange
    old 的 Ross Chapman 承认在刚开始时是个胆小的开发者。


    “我当时没有耐心，因为我还没准备好热爱修复问题的挑战。但这正是我那些非常坏习惯的来源。”尽管如此，Ross 敦促初学者将错误视为至关重要的学习机会。由于你一生都在调试，所以你应该习惯错误，并学会识别错误信息。


