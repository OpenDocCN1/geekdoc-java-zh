  trans: "\n\n# 类 (Classes)\n\n类用于在计算机内存中创建对象，并通过复制以拥有自己的生命。类用于构建对象。类中的每部分数据都成为该对象的一部分。类内部的不同数据块被称为类成员（class\
    \ members）。\n\n类成员也可以是函数（functions）或方法（methods）的逻辑块。\n\n例如，在一个僵尸群的游戏中，每个僵尸都是从僵尸类复制或实例化的。每个僵尸对于类中的每个属性或数据元素都有独特的值。\n\
    \n这意味着血量值和位置对于每个被复制的僵尸对象都是唯一的。从类创建的对象被称为实例（instances）。与家庭一样，对象可以相互继承属性。\n\n有时称为子类（subclass）的孩子从其父类继承属性。例如，从僵尸创建的子类可能会继承父类对大脑的渴望。\n\
    \n为了发挥作用，子僵尸还可以添加新对象，并修改它从父类继承的对象。结果是，现在子僵尸可能拥有父类没有的触手。对象之间通过事件（events）和消息（messages）进行通信。\n\
    \n向僵尸射击可以创建一个事件，或者用程序员的术来说，这被称为“抛出”（raises）一个事件。子弹命中事件告诉僵尸类在被子弹击中时采取必要的步骤。\n\n\
    事件命令类对其数据执行操作，这正是函数的用武之地。\n\n函数也称为方法，是作用于数据的逻辑部分。它们允许你的类创建额外的事件并与更多对象进行通信。\n\n\
    当玩家按下扳机并移动摇杆时，可以抛出更多事件并发送消息。事件和消息允许玩家与你的世界进行交互；逻辑事件和对象共同构建了你的游戏。\n\n## 什么是数据？\
    \ (What is Data?)\n\n广义来说，数据类似于名词。和名词一样，数据可以是人、地点或物。程序员将这些名词称为对象（objects），这些对象作为变量（variables）存储在内存中。“变量”一词暗示了某些可能会发生变化的东西，但情况并非总是如此。最好将变量看作计算机内存中用于存放信息的空间。当你玩像\
    \ MadLibs 这样的文字填空游戏时，你可能会要求某人的名字、一个物体、一个副词和一个地点。你的结果可能是“加斯吃了一件夹克，并专注地在洗衣店里玩。”在这种情况下，名字、物体、副词和地点就是变量类型。数据就是你用来赋值变量的单词。\n\
    \n程序员使用“类型”（type）一词来表示将存储什么类型的数据。计算机并不精通英语，通常不知道英语类型“名词”和“形容词”之间的区别，但它们知道字母和各种数字之间的区别。在\
    \ `java` 或任何其他语言中都有预定义的类型。\n\n如果加上创建新类型数据的能力，我们能够存储的数据种类实际上是无边际的。\n\nC# 的内置类型有时被称为\
    \ POD，或“单纯的旧数据”（plain old data）。POD 术语源于原始的 `C++` 标准，其起源可以追溯到 1979 年。POD 类型从其原始实现没有发生根本性的变化。\n\
    \n到目前为止，我们已经多次使用了“类型”这个词。程序员定义“类型”来描述要存储的数据的种类。\n\n## 声明 (Declarations)\n\n变量是通过声明（declarations）创建的。声明被定义为正式的陈述或公告。程序员写的每组单词被称为语句（statement）。在英语中，我们会使用“sentence”（句子）一词，但程序员喜欢使用自己的词汇。变量的声明语句定义了变量的类型和标识符（identifier）。\n\
    \n```\npublic class Example\n{\n    int i;\n}\n```\n\n程序员使用分号（`;`）而不是句号来结束语句。因此，如果你想听起来像个程序员，你可以说你可以“写一条语句来声明一个类型为\
    \ `int` 标识符为 `i` 的变量”。或者如果你想表现得过度戏剧化，你可以宣布：“我宣告一个类型为 `int` 的新变量，名为 `i` ！”它将是如此。\n\
    \n## 变量 (Variables)\n\n变量用于存储在计算机程序中被引用和操作的信息。它们还提供了一种使用描述性名称对数据进行标记的方法，以便读者和我们自己能更清楚地理解我们的程序。将变量看作存放信息的容器是有帮助的。它们的唯一目的是在内存中标记和存储数据。这些数据随后可以在整个程序中使用。\n\
    \n变量的名称被称为标识符（identifier）。在大多数情况下，标识符是程序员（在这种情况下是你）选择的用于为变量命名的唯一单词。标识符总是程序员为了描述变量而发明的某种东西；它就像给新宠物或宝宝起名一样。\n\
    \n### 标识符 (Identifiers)\n\n标识符被认为是符号或标记（tokens），是你发明的并赋予其含义的单词。标识符可以像字母 `i` 一样简单，也可以像\
    \ `@OhHAICanIHasIdentifier01` 一样复杂。\n\n`identifier` 是用于命名你创建的任何函数、变量或数据类型的单词。使用关键字\
    \ `class` 时，后面跟着另一个被称为标识符的单词。在正确识别函数或其他数据块后，你现在可以通过其标识符来引用该数据。换句话说，当你把某些数据命名为\
    \ `Charles` 时，你通过 `Charles` 这个名字来访问该数据。\n\n```\nclass MyNewClassImWriting\n{\n\
    }\n```\n\n### 变量名 (Variable Names)\n\n重要的是，变量标识符和类标识符几乎可以是任何内容。在编程时，命名任何东西都有一些规则。以下是一些有帮助的指南。长名字更容易出现拼写错误，所以保持标识符简短。变量的命名规范应该考虑以下点：\n\
    \n- 变量名应该指示它的用途，或者至少说明你打算用它做什么。\n- 这种不应该是误导性的。或者说，如果你使用一个名为 `radius` 的变量，你不应该把它用作角色的速度。\n\
    - 如果你能读出变量的名字，也会很有帮助；否则当你尝试向另一个程序员解释代码时可能会遇到问题。\n\n```\nint someLong_complex_hardToVariableName;\n\
    ```\n\n保持尽可能简短的名字是有优势的。你的计算机屏幕（以及大多数计算机）单行内只能容纳有限的字符。你可以缩小字体，但这样就会遇到字母太小导致的可读性问题。考虑以下函数，它需要多个变量才能工作。\n\
    \n```SomeFunction(TopLeftCorner – SomeThickness + OffsetFromPosition, BottomRightCorner\
    \ – SomeThickness + OffsetFromPosition);\n```\n\n上面的代码使用了许多长变量名。由于每个变量的长度，语句占据了多行，使得单个语句难以阅读。我们可以缩短变量名，但很容易缩短过头。\n\
    \n```\nCleverFunc(TL–Thk+Ofst,LR–Thk+Ofst);\n```\n\n变量名应该是具有描述性的，这样你才知道你打算如何使用它们：太短了可能会丢失意义。\n\
    \n```\nint a;\n```\n\n虽然简短且容易记忆，但对于任何其他阅读你代码的人来说，很难知道你把变量 `a` 用做什么了。这在与其他程序员合作时会变得格外困难。变量命名并不是完全没有规则的。\n\
    \n```\nint 8;\n```\n\n变量名不能是数字。这是糟糕的；数字在编程中有特殊的地位，因为编程的大部分对其有其他用途。IDE 会尝试帮助你发现问题。它发现的任何问题下方都会出现红色的波浪线。既然提到带数字的变量名，你可以将数字作为变量名的一部分。\n\
    \n```\nint varNumber2;\n```\n\n上面的名称是完全有效的，并且可能是有用的，但相反请考虑以下内容。\n\n```\nint 13thInt;\n\
    ```\n\n"
