    ## 2. The Internet enables people all around the world to quickly access and retrieve
    large amounts of information. With the aid of clever algorithms, sites on the
    Internet are able to manage and manipulate this large volume of data. Examples
    of problems that make essential use of algorithms include finding good routes
    on which the data will travel, and using a search engine to quickly find pages
    on which particular information resides.


    ## 3. Electronic commerce enables goods and services to be negotiated and exchanged
    electronically, and it depends on the privacy of personal information such as
    credit card numbers, passwords, and bank statements. The core technologies used
    in electronic commerce include public-key cryptography and digital signatures,
    which are based on numerical algorithms and number theory.


    ## 4. Manufacturing and other commercial enterprises often need to allocate scarce
    resources in the most beneficial way. An oil company may wish to know where to
    place its wells in order to maximize its expected profit. A political candidate
    may want to determine where to spend money buying campaign advertising in order
    to maximize the chances of winning an election. An airline may wish to assign
    crews to flights in the least expensive way possible, making sure that each flight
    is covered and that government regulations regarding crew scheduling are met.
    An Internet service provider may wish to determine where to place additional resources
    in order to serve its customers more effectively. All of these are examples of
    problems that can be solved using linear programming.


    Although some of the details of these examples are beyond the scope of this book,
    we do give underlying techniques that apply to these problems and problem areas.


    ### Algorithms as a technology


    Suppose computers were infinitely fast and computer memory was free. Would you
    have any reason to study algorithms? The answer is yes, if for no other reason
    than that you would still like to demonstrate that your solution method terminates
    and does so with the correct answer.


    If computers were infinitely fast, any correct method for solving a problem would
    do.


    You would probably want your implementation to be within the bounds of good software
    engineering practice (for example, your implementation should be well designed
    and documented), but you would most often use whichever method was the easiest
    to implement. Of course, computers may be fast, but they are not infinitely fast.
    And memory may be inexpensive, but it is not free.


    Computing time is therefore a bounded resource, and so is space in memory. You
    should use these resources wisely, and algorithms that are efficient in terms
    of time or space will help you do so.


    ### Where storage lives?


    It’s useful to visualize some aspects of how things are laid out while the program
    is running—in particular how memory is arranged. There are five different places
    to store data:


    1. **Registers**. This is the fastest storage because it exists in a place different
    from that of other storage: inside the processor. However, the number of registers
    is severely limited, so registers are allocated as they are needed. You don’t
    have direct control, nor do you see any evidence in your programs that registers
    even exist (`C` & `C++`, on the other hand, allow you to suggest register allocation
    to the compiler).


    2. **The stack**. This lives in the general random-access memory (`RAM`) area,
    but has direct support from the processor via its stack pointer. The stack pointer
    is moved down to create new memory and moved up to release that memory. This is
    an extremely fast and efficient way to allocate storage, second only to registers.
    The Java system must know, while it is creating the program, the exact lifetime
    of all the items that are stored on the stack. This constraint places limits on
    the flexibility of your programs, so while some Java storage exists on the stack—in
    particular, object references—Java objects themselves are not placed on the stack.


    3. **The heap**. This is a general-purpose pool of memory (also in the `RAM` area)
    where all Java objects live. The nice thing about the heap is that, unlike the
    stack, the compiler doesn’t need to know how long that storage must stay on the
    heap. Thus, there’s a great deal of flexibility in using storage on the heap.
    Whenever you need an object, you simply write the code to create it by using `new`,
    and the storage is allocated on the heap when that code is executed. Of course
    there’s a price you pay for this flexibility: It may take more time to allocate
    and clean up heap storage than stack storage (if you even could create objects
    on the stack in Java, as you can in `C++`).


    4. **Constant storage**. Constant values are often placed directly in the program
    code, which is safe since they can never change. Sometimes constants are cordoned
    off by themselves so that they can be optionally placed in read-only memory (`ROM`),
    in embedded systems.


    5. **Non-RAM storage**. If data lives completely outside a program, it can exist
    while the program is not running, outside the control of the program. The two
    primary examples of this are streamed objects, in which objects are turned into
    streams of bytes, generally to be sent to another machine, and persistent objects,
    in which the objects are placed on disk so they will hold their state even when
    the program is terminated. The trick with these types of storage is turning the
    objects into something that can exist on the other medium, and yet can be resurrected
    into a regular `RAM`-based object when necessary. Java provides support for lightweight
    persistence, and mechanisms such as `JDBC` and `Hibernate` provide more sophisticated
    support for storing and retrieving object information in databases.


    ### Statements and Expressions


    When reading a book or story you extract meaning from an ordered chain of words.
    In a similar way, computers extract commands from a chain of ordered instructions.


    In English we call this a sentence; programmers call this a statement.


    A statement is considered to be any chunk of code which accomplishes some sort
    of task separated by a semicolon. At the center of any given task is the algorithm,
    not to be confused with a logarithm.


    An algorithm is a systematic process that accomplishes something. In many ways
    you can think of it as a recipe, or rather a recipe is an algorithm for making
    food.


    It can take just one or two statements to accomplish a task, or it could take
    many hundreds of statements.


    ![https://3.bp.blogspot.com/-qi_h4uWuaLY/WBNQIt6zNjI/AAAAAAAAGso/63MfQEDmpIJghpMTGRN3vZTiuLiY3wCK4B/s400/PascalScriptIfThenElse.png](images/00015.jpeg)


    This all depends on the difficulty of a given task. Each individual statement
    is a step toward a goal. This is the difference between spending a few minutes
    frying an egg, or spending an hour baking a souffle. Each step is usually fairly
    simple; the final result matters.


    Like sentences, statements have different forms. Statements can declare and assign
    values to variables. These are called declaration and assignment statements. These
    statements are used to set up various types of data and give them names.


    ### Expressions


    The subjects of your statements are called identifiers. An assignment statement
    is used to give an identifier a value. When you read “Jack is a boy and Jill is
    a girl,” you’ve mentally assigned two subjects their genders.


    In Java this might look more like:


    ```java

    gender Jack = male;

    gender Jill = female;

    ```


    Assignment statements often incorporate some sort of operation. These are called
    expressive statements. Different from expressing an emotion, expressions in code
    look more like `x + y`. Expressions process data. After processing, the result
    of an expression can be assigned to a variable.


    A collection of statements is called a code block, not like a roadblock which
    might stop your code, but more like a building block, anything that’s used to
    build.

    '
