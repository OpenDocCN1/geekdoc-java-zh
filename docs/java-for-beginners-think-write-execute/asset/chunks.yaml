    \        int k = l;\n        while (i < n1 && j < n2) {\n            if (L[i]\
    \ <= R[j]) {\n                arr[k] = L[i];\n                i++;\n         \
    \   } else {\n                arr[k] = R[j];\n                j++;\n         \
    \   }\n            k++;\n        }\n        /* Copy remaining elements of L[]\
    \ if any */\n        while (i < n1) {\n            arr[k] = L[i];\n          \
    \  i++;\n            k++;\n        }\n        /* Copy remaining elements of R[]\
