  trans: "\n将开发领域划分为类创建者（创建新数据类型的人）和客户端程序员（在应用程序中使用这些数据类型的类备用者）是有帮助的。客户端程序员的目标是收集一个装满类的“类工具箱”，以便进行快速应用程序开发。类创建者的目标是构建一个类，仅向客户端程序员暴露必要的内容，并隐藏其他所有内容。为什么呢？因为如果它是被隐藏的，客户端程序员就无法访问它，这意味着类创建者可以随心所欲地更改隐藏部分，无需担心对他人产生影响。隐藏部分通常代表对象的内部敏感细节，这些部分很容易被粗心或不了解的客户端程序员所破坏，因此隐藏实现细节可以减少程序错误。\n\
    \n在任何关系中，拥有让所有参与方都尊重的边界都是关重要的。当你创建一个库时，你与客户端程序员建立了一种关系，对方也是一名程序员，但是一个正在通过使用你的库来组合应用程序的程序员，可能是为了构建一个更大的库。如果\
    \ `class` 的所有成员对所有人都可见，那么客户端程序员就可以对该 `class` 执行任何操作，而且没有办法强制规则。尽管你可能更希望客户端程序员不要直接操作你\
    \ `class` 的某些成员，但在没有访问控制的情况下，无法阻止这种行为。一切对世界都是透明的。\n\n所以，访问控制的第一个原因是让客户端程序员不要触碰他们不应该碰的部分——这些部分对于数据类型的内部运行是必要的，但并不是用户为了解决其特定问题而需要的接口的一部分。这实际上是对客户端程序员的一种服务，因为他们可以很容易地看到对他们是重要的，以及哪些是可以忽略的。\n\
    \n访问控制的第二个原因是允许库设计人员更改 `class` 的内部工作原理，而无需担心这将如何影响客户端程序员。例如，你可能会以一种简单的方式实现特定的\
    \ `class` 以简化开发，然后以后发现你需要重写它以使其运行得更快。如果接口和实现被清晰地分离并保护，你就可以轻松地完成这一点。\n\nJava 使用三个显式关键字来在\
    \ `class` 中设置边界：`public`、`private` 和 `protected`。这些访问修符决定了谁可以使用随后的定义。`public`\
    \ 意味着后续元素对所有人可用。另一方面，`private` 关键字意味着除了你（该类型的创建者）之外，在该类型的方法内部，没有人可以访问该元素。`private`\
    \ 是你和客户端程序员之间的一堵墙。尝试访问 `private` 成员的人将得到编译时错误。`protected` 关键字的作用类似于 `private`，例外是继承类可以访问\
    \ `protected` 成员，但不能访问 `private` 成员。继承很快就会介绍。\n\nJava 还有一种“默认”访问，如果你不使用上述修符之一，就会起作用。这通常被称为包访问，因为类可以访问同一包（库组件）中其他类的成员，但在包之外，这些相同的成员看起来似乎是私有的。\n\
    \n## 重用实现\n\n一旦 `class` 被创建并测试，它（理想情况下）应该代表一个有用的代码单元。事实证明，这种可重用性并没有许多人希望的那么容易实现；产生可重用的对象设计需要经验和洞察力。但一旦你拥有了这样的设计，它就急于被重用。代码重用是面向对象编程语言提供的最大优势之一。\n\
    \n重用 `class` 的简单方法是直接使用该 `class` 的对象，但你也可以将该 `class` 的对象放在一个新的 `class` 中。我们称之为为“创建一个成员对象”。你的新\
    \ `class` 可以由任何数量和类型的其他对象组成，并以任何你实现新 `class` 中所需功能的组合方式。由于你是从现有的 `classes` 组合一个新的\
    \ `class`，这个概念被称为组合（如果组合是动态发生的，通常称为聚合）。组合通常被称为“具有（has-a）”关系，例如“汽车有一个引擎”。\n\n![](img/00010.jpeg)\n\
    \n(此 UML 图用实心菱形表示组合，它表示有一辆汽车。我通常会使用更简单的形式：只需一条线，不带菱形，表示关联。5) \n\n组合带来了极大的灵活性。你新\
    \ `class` 的成员对象通常是 `private` 的，使得使用该 `class` 的客户端程序员无法访问它们。这允许你更改这些成员而不扰动现有的客户端代码。你还可以在运行时更改成员对象，以动态更改程序的行为。在下文中描述的继承没有这种灵活性，因为编译器必须对通过继承创建的类施加编译时的限制。\n\
    \n由于继承在面向对象编程中是如此重要，它经常被高度强调，新程序员可能会产生继承应该无处使用的的想法。这可能导致笨拙且过度复杂的设计。相反，在创建新类时，你应该首先考虑组合，因为它更简单、更灵活。如果你采取这种方法，你的设计将更加整洁。一旦你有了一些经验，什么时候需要继承将变得显而易见。\n\
    \n## 继承\n\n对象的主意本身是一个方便的工具。它允许你从概念上将数据和功能封装在一起，因此你可以表示一个适当的问题空间想法，而不是被迫使用底层机器的惯用法。这些概念通过使用\
    \ `class` 关键字表示为编程语言中的基本单元。\n\n然而，费尽精力创建一个 `class` 然后又被强制创建一个具有相似功能的新类，这似乎很遗憾。如果我们能够获取现有类、克隆它，然后对克隆进行添加和修改，那就好了。这实际上通过继承得到的，例外是如果原始类（基类、超类或父类）发生变化，修改后的“克隆”（派生类、继承类、子类或子类）也会反映这些变化。\n\
    \n![](img/00011.jpeg)\n\n(此 UML 图中的箭头从派生类指向基类。正如你看到的，通常有一个派生类。)\n\n类型不仅描述对一组对象的约束；它还与其他类型有关系。两个类型可以具有共同的特征和行为，但一个类型可能比另一个包含更多，并且处理更多的消息（或以不同的方式处理）。继承通过使用基类型和派生类型的概念来表达类型之间的相似性。基类型包含了所有派自它的类型共享的所有特征和行为。你创建一个基类型来表示你对系统中某些对象的核心想法。从基类型开始，你派生出其他类型以表示这种核心的不同方式。\n"
- fmt: "\nFor example, a trash-recycling machine sorts pieces of trash. The base type\
    \ is “trash”, and each piece of trash has a weight, a value, and so on, and can\
    \ be shredded, melted, or decomposed. From this, more specific types of trash\
    \ are derived that may have additional characteristics (a bottle has a color)\
    \ or behaviors (an aluminum can may be crushed, a steel can is magnetic). In addition,\
    \ some behaviors may be different (the value of paper depends on its type and\
    \ condition). Using inheritance, you can build a type hierarchy that expresses\
    \ the problem you’re trying to solve in terms of its types. \n\nA second example\
    \ is the classic “shape” example, perhaps used in a computer-aided design system\
    \ or game simulation. The base type is “shape,” and each shape has a size, a color,\
    \ a position, and so on. Each shape can be drawn, erased, moved, colored, etc.\
    \ From this, specific types of shapes are derived (inherited)—circle, square,\
    \ triangle, and so on—each of which may have additional characteristics and behaviors.\
    \ Certain shapes can be flipped, for example. Some behaviors may be different,\
    \ such as when you want to calculate the area of a shape. The type hierarchy embodies\
    \ both the similarities and differences between the shapes.  \n\n![](images/00012.jpeg)\n\
    \nCasting the solution in the same terms as the problem is very useful because\
    \ you don’t need a lot of intermediate models to get from a description of the\
    \ problem to a description of the solution. With objects, the type hierarchy is\
    \ the primary model, so you go directly from the description of the system in\
    \ the real world to the description of the system in code. Indeed, one of the\
    \ difficulties people have with object-oriented design is that it’s too simple\
    \ to get from the beginning to the end. A mind trained to look for complex solutions\
    \ can initially be stumped by this simplicity. \n\nWhen you inherit from an existing\
    \ type, you create a new type. This new type contains not only all the members\
    \ of the existing type (although the private ones are hidden away and inaccessible),\
    \ but more importantly it duplicates the interface of the base class. That is,\
    \ all the messages you can send to objects of the base class you can also send\
    \ to objects of the derived class. Since we know the type of a class by the messages\
