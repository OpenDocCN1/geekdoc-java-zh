    “A language that doesn''t affect the way you think about programming is not worth
    knowing.”

    ― Alan J. Perlis


    “The computer programmer is a creator of universes for which he alone is the lawgiver.
    No playwright, no stage director, no emperor, however powerful, has ever exercised
    such absolute authority to arrange a stage or field of battle and to command such
    unswervingly dutiful actors or troops.”

    ― Joseph Weizenbaum


    “Walking on water and developing software from a specification are easy if both
    are frozen.”

    ― Edward Berard


    “Perl – The only language that looks the same before and after RSA encryption.”

    ― Keith Bostic


    “The most disastrous thing that you can ever learn is your first programming language.”

    ― Alan Kay


    “A computer is like a violin. You can imagine a novice trying first a phonograph
    and then a violin. The latter, he says, sounds terrible. That is the argument
    we have heard from our humanists and most of our computer scientists. Computer
    programs are good, they say, for particular purposes, but they aren’t flexible.
    Neither is a violin, or a typewriter, until you learn how to use it.”

    ― Marvin Minsky


    “The most important property of a program is whether it accomplishes the intention
    of its user.”

    ― C.A.R. Hoare


    “Object-oriented programming offers a sustainable way to write spaghetti code.
    It lets you accrete programs as a series of patches.”

    ― Paul Graham, Hackers & Painters: Big Ideas from the Computer Age


    “At forty, I was too old to work as a programmer myself anymore; writing code
    is a young person’s job.”

    ― Michael Crichton, Prey


    “Some of the best programming is done on paper, really. Putting it into the computer
    is just a minor detail.”

    ― Max Kanat-Alexander, Code Simplicity: The Fundamentals of Software


    “Programmers are not to be measured by their ingenuity and their logic but by
    the completeness of their case analysis.”

    ― Alan J. Perlis


    “Progress is possible only if we train ourselves to think about programs without
    thinking of them as pieces of executable code.”

    ― Edsger W. Dijkstra


    “Don''t gloss over a routine or piece of code involved in the bug because you
    "know" it works. Prove it. Prove it in this context, with this data, with these
    boundary conditions.”

    ― Andrew Hunt, The Pragmatic Programmer: From Journeyman to Master


    “Remember that code is really the language in which we ultimately express the
    requirements. We may create languages that are closer to the requirements. We
    may create tools that help us parse and assemble those requirements into formal
    structures. But we will never eliminate necessary precision—so there will always
    be code.”

    ― Robert C. Martin


    “Software testing is a sport like hunting, it''s bughunting.”

    “Programming, it turns out, is hard. The fundamental rules are typically simple
    and clear. But programs built on top of these rules tend to become complex enough
    to introduce their own rules and complexity. You’re building your own maze, in
    a way, and you might just get lost in it.”

    ― Marijn Haverbeke


    Thank You!

