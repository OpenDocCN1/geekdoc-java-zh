- fmt: "\nFunctions may look different in different programming languages, but the\
    \ way they work is mostly the same. The usual pattern is taking in data and using\
    \ logic to manipulate that data. Functions may also be referred to by other names,\
    \ for example, methods. The major differences come from the different ways the\
    \ languages use syntax. Syntax is basically the use of spaces or tabs, operators,\
    \ or keywords.\n\nIn the end, all you’re doing is telling the compiler how to\
    \ convert your instructions into computer-interpreted commands. Variables and\
    \ functions make up the bulk of programming. Any bit of data you want to remember\
    \ is stored in a variable. Variables are manipulated by your functions. In general,\
    \ when you group variables and functions together in one place, you call that\
    \ a class.\n\n### Example\n\n```java\npublic void PrintNum ()\n{\n    System.out.println\
    \ (anotherNum);\n}\n```\n\nWhen writing a new function, it’s good practice to\
    \ fill in the entirety of the function’s layout before continuing on to another\
    \ task. This puts the compiler at ease; leaving a function in the form `void MyFunction`\
    \ and then moving on to another function leaves the compiler confused as to what\
    \ you’re planning on doing. The integrated development environment, in this case\
    \ `MonoDevelop`, is constantly reading and interpreting what you are writing,\
    \ somewhat like a spell checker in a word processor. When it comes across a statement\
    \ that has no conclusive form, like a variable, function, or class definition,\
    \ its interpretation of the code you’re writing will raise a warning or an error.\
    \ `MonoDevelop` might seem a bit fussy, but it’s doing its best to help.\n\n##\
    \ Writing a Function\n\nA function consists of a declaration and a body. Some\
    \ programmers like to call these methods, but semantics aside, a function is basically\
    \ a container for a collection of statements.\n\nLet’s continue with the example:\n\
    \n```java\nvoid MyFunction ()\n{\n}\n```\n\nHere is a basic function called `MyFunction`.\
    \ We can add in additional keywords to modify the function’s visibility. One common\
    \ modifier we’ll be seeing is `public`.\n\n```java\npublic void MyFunction ()\n\
    {\n}\n```\n\nThe `public` keyword needs to appear before the return type of the\
    \ function. In this case, it’s `void`, which means that the function doesn’t return\
    \ anything. but functions can act as a value in a few different ways. For reference,\
    \ a function that returns an `int` would look like this. A return statement of\
    \ some kind must always be present in a function that has a return type.\n\n```java\n\
    public int MyFunction ()\n{\n    return 1;\n}\n```\n\nThe `public` modifier isn’t\
    \ always necessary, unless you need to make this function available to other classes.\
    \ If this point doesn’t make sense, it will soon. The last part of the function\
    \ that is always required is the parameter list. It’s valid to leave it empty,\
    \ but to get a feeling for what an `arg`, or argument in the parameter list, looks\
    \ like, move on to the next example.\n\n```java\npublic void MyFunction (int i)\n\
    {\n}\n```\n\nFor the moment, we’ll hold off on using the parameter list, but it’s\
    \ important to know what you’re looking at later on so it doesn’t come as a surprise.\
    \ Parameter lists are used to pass information from outside of the function to\
    \ the inside of the function. This is how classes are able to send information\
    \ from one to another.\n\nFunction declaration is similar to class declaration.\
    \ Functions are the meat of where logic is done to handle variables.\n\n## Function\
    \ Scope\n\nVariables often live an ephemeral life. Some variables exist only over\
    \ a few lines of code. Variables may come into existence only for the moment a\
    \ function starts and then disappear when the function is done. Variables in the\
    \ class scope exist for as long as the class exists. The life of the variable\
    \ depends on where it’s created.\n\n### Example\n\n```java\npublic class Classscopm{\n\
    \    int ClassInt;\n    void first()\n    {\n        int firsttint;\n    }\n \
    \   void second()\n    {\n        int secondint;\n    }\n}\n```\n\nIf we look\
    \ at the above figure we can visualize how scope is divided. The outer box represents\
    \ who can see `ClassInt`. Within the first `()` function we have a `firsttint`\
    \ that only exists within the first `()` function.\n\nThe same is repeated for\
    \ the `secondint`, found only in the `second()` function. This means that `first()`\
    \ can use both `ClassInt` and `firsttint` but not `secondint`. Likewise, `second()`\
    \ can see `ClassInt` and `secondint` but not `firsttint`.\n\n## Parameter Lists\n\
    \nWhen a function is called, its identifier followed by its parameter list is\
    \ added to code. Parameters are like little mail slots on the front door of a\
    \ house. There might be a slot for integers, floats, and arrays. Each slot on\
    \ the door, or argument in the parameter list, is a type followed by an identifier.\n\
    \nIf we look at a basic example, we’ll see how all this works.\n\n```java\npublic\
    \ class Example {\n    int a = 0;\n    void SetA (int i) {\n        a = i;\n \
    \   }\n}\n```\n\n`SetA (int i)` takes in one parameter of type `int`. This is\
    \ a simple example of a value parameter; there are other types of parameters which\
    \ we’ll go into next. The value parameter declares the type and an identifier\
    \ whose scope is limited to the contents of the function it’s declared with. When\
    \ you run the above program and give value `3` to the parameter of the function\
    \ `SetA(3)` you’ll see a `0` followed by a `3`. We can do this any number of times,\
    \ and each time we’re allowed to change what value we set `A` to. Of course, it’s\
    \ easier to use `a = 3` in the class, but then we wouldn’t be learning anything.\n\
    \n## Side Effects\n\nWhen a function directly sets a variable in the class the\
    \ function lives in, programmers like to call this a side effect. Side effects\
    \ are usually things that programmers try to avoid, but it’s not always practical.\n\
    \n```java\nClass MySideEffect {\n    int a = 0;\n    void SetA ()\n    {\n   \
    \     a = 5;\n    }\n}\n```\n\nThe above `SetA()` function sets `a` to `5`. The\
    \ `SetA()` function does have a clear purpose, but there’s nothing in the function\
    \ that indicates where the variable lives. If the variable lived in another class\
    \ which `SideEffect` inherited from, then you wouldn’t even see the variable in\
    \ this class. Once the complexity in a class grows, where and when a variable\
    \ gets changed becomes more obscure. Reading what a function does should not involve\
    \ jumping around to find what variable it’s making changes. This brings us back\
    \ to the topic of scope. Limiting the scope or reach of a function helps limit\
    \ the number of places where things go wrong.\n\n```java\nclass MySideEffect {\n\
    \    int a = 0;\n    void SetA ()\n    {\n        a = 5;\n    }\n    void SetAgain\
    \ ()\n    {\n        a = 10;\n    }\n}\n```\n\nThe more functions that have a\
    \ side effect, the more strange behaviors might occur. If `Main()` function is\
    \ expecting one value but gets something else, you can start to get unexpected\
    \ behaviors. Worse yet, if `SetAgain()` is called from another class and you were\
    \ expecting `a` to be `5`, you’re going to run into more strange behaviors.\n\n\
    ## Multiple Arguments\n\nThere aren’t any limits to the number of parameters that\
    \ a function can accept. Some languages limit you to no more than 16 arguments,\
    \ which seems acceptable. If your logic requires more than 16 parameters, it’s\
    \ probably going to be easier to separate your function into different parts.\
    \ However, if we’re going to be doing something simple, we might want to use more\
    \ than one parameter anyway.\n\n```java\nint a = 0;\nvoid SetA (int i, int j)\
    \ {\n    a = i * j;\n}\n```\n\nWe can add a second parameter to `SetA`. A comma\
    \ token tells the function to accept another variable in the parameter list. For\
    \ this example, we’re using two ints to multiply against one another and assign\
    \ a value to `a`. There isn’t anything limiting the types we’re allowed to use\
    \ in the parameter list.\n\n```java\nint a = 0;\nfloat b = 0;\nvoid SetA (int\
    \ i, float j) { \n    a = i; \n    b = j;\n}\n```\n"
  raw: 'Functions may look different in different programming languages, but the way
    they work is mostly the same. The usual pattern is taking in data and using logic
    to manipulate that data. Functions may also be referred to by other names, for
    example, methods. The major differences come from the different ways the languages
    use syntax. Syntax is basically the use of spaces or tabs, operators, or keywords.


    In the end, all you’re doing is telling the compiler how to convert your instructions
    into computer-interpreted commands. Variables and functions make up the bulk of
    programming. Any bit of data you want to remember is stored in a variable. Variables
    are manipulated by your functions. In general, when you group variables and functions
    together in one place, you call that a class.


    Example:


    public void PrintNum ()


    {


    System.out.println (anotherNum);


    }


    When writing a new function, it’s good practice to fill in the entirety of the
    function’s layout before continuing on to another task. This puts the compiler
    at ease; leaving a function in the form void MyFunction and then moving on to
    another function leaves the compiler confused as to what you’re planning on doing.
    The integrated development environment, in this case MonoDevelop, is constantly
    reading and interpreting what you are writing, somewhat like a spell checker in
    a word processor. When it comes across a statement that has no conclusive form,
    like a variable, function, or class definition, its interpretation of the code
    you’re writing will raise a warning or an error. MonoDevelop might seem a bit
    fussy, but it’s doing its best to help.


    Writing a Function:


    A function consists of a declaration and a body. Some programmers like to call
    these methods, but semantics aside, a function is basically a container for a
    collection of statements.


    Let’s continue with the example:


    void MyFunction ()


    {


    }


    Here is a basic function called MyFunction. We can add in additional keywords
    to modify the function’s visibility. One common modifier we’ll be seeing is public.


    public void MyFunction ()


    {


    }


    The public keyword needs to appear before the return type of the function. In
    this case, it’s void, which means that the function doesn’t return anything. but
    functions can act as a value in a few different ways. For reference, a function
    that returns an int would look like this. A return statement of some kind must
    always be present in a function that has a return type.


    public int MyFunction ()


    {


    return 1;


    }


    The public modifier isn’t always necessary, unless you need to make this function
    available to other classes. If this point doesn’t make sense, it will soon. The
    last part of the function that is always required is the parameter list. It’s
    valid to leave it empty, but to get a feeling for what an arg, or argument in
    the parameter list, looks like, move on to the next example.


    public void MyFunction (int i)


    {


    }


    For the moment, we’ll hold off on using the parameter list, but it’s important
    to know what you’re looking at later on so it doesn’t come as a surprise. Parameter
    lists are used to pass information from outside of the function to the inside
    of the function. This is how classes are able to send information from one to
    another.


    Function declaration is similar to class declaration. Functions are the meat of
    where logic is done to handle variables.


    Function Scope:


    Variables often live an ephemeral life. Some variables exist only over a few lines
    of code. Variables may come into existence only for the moment a function starts
    and then disappear when the function is done. Variables in the class scope exist
    for as long as the class exists. The life of the variable depends on where it’s
    created.


    Example:


    public class Classscopm{


    int ClassInt;


    void first()


    {


    int firsttint;


    }


    void second()


    {


    int secondint;


    }


    }


    If we look at the above figure we can visualize how scope is divided. The outer
    box represents who can see ClassInt. Within the first () function we have a firsttint
    that only exists within the first () function.


    The same is repeated for the secondint, found only in the second () function.
    This means that first () can use both ClassInt and firsttint  but not secondint.
    Likewise, second () can see ClassInt and secondint but not firsttint.


    Parameter Lists:


    When a function is called, its identifier followed by its parameter list is added
    to code. Parameters are like little mail slots on the front door of a house. There
    might be a slot for integers, floats, and arrays. Each slot on the door, or argument
    in the parameter list, is a type followed by an identifier.


    If we look at a basic example, we’ll see how all this works.


    public class Example {


    int a = 0;


    void SetA (int i) {


    a = i;


    }


    }


    void SetA (int i) takes in one parameter of type int. This is a simple example
    of a value parameter; there are other types of parameters which we’ll go into
    next. The value parameter declares the type and an identifier whose scope is limited
    to the contents of the function it’s declared with. When you run the above program
    and give value 3 to the parameter of the function SetA(3) you’ll see a 0 followed
    by a 3\. We can do this any number of times, and each time we’re allowed to change
    what value we set A to. Of course, it’s easier to use a = 3 in the class, but
    then we wouldn’t be learning anything.


    Side Effects:


    When a function directly sets a variable in the class the function lives in, programmers
    like to call this a side effect. Side effects are usually things that programmers
    try to avoid, but it’s not always practical. Writing functions with side effects
    tend to prevent the function from being useful in other classes. We’ll find other
    systems that allow us to avoid using side effects, but in some cases, it’s necessary.


    Class MySideEffect {


    int a = 0;


    void SetA ()


    { 


    a = 5;


    }


    }


    The above SetA() function sets int a to 5. The SetA() function does have a clear
    purpose, setting A, but there’s nothing in the function that indicates where the
    variable it’s setting lives. If the variable lived in another class which MySideEffect
    inherited from, then you wouldn’t even see the variable in this class. Once the
    complexity in a class grows, where and when a variable gets changed or read becomes
    more obscure. If a function remains self-contained, testing and fixing that function
    becomes far easier.


    Reading what a function does should not involve jumping around to find what variable
    it’s making changes to. This brings us back to the topic of scope. Limiting the
    scope or reach of a function helps limit the number of places where things can
    go wrong.


    class MySideEffect {


     int a = 0;


    void SetA ()


    { 


    a = 5;


    }


    void SetAgain ()


    { 


    a = 10;


    }


    }


    The more functions that have a side effect, the more strange behaviors might occur.
    If Main () function is expecting one value but gets something else entirely, you
    can start to get unexpected behaviors. Worse yet, if SetAgain() is called from
    another class and you were expecting a to be 5, you’re going to run into more
    strange behaviors.


    Multiple Arguments:


    There aren’t any limits to the number of parameters that a function can accept.
    Some languages limit you to no more than 16 arguments, which seems acceptable.
    If your logic requires more than 16 parameters, it’s probably going to be easier
    to separate your function into different parts. However, if we’re going to be
    doing something simple, we might want to use more than one parameter anyway.


     int a = 0;


    void SetA (int i, int j) {


    a = i * j;


    }


    We can add a second parameter to SetA. A comma token tells the function to accept
    another variable in the parameter list. For this example, we’re using two ints
    to multiply against one another and assign a value to a. There isn’t anything
    limiting the types we’re allowed to use in the parameter list.


     int a = 0;


    float b = 0;


    void SetA (int i, float j) { 


    a = i; 


    b = j;


    }'
