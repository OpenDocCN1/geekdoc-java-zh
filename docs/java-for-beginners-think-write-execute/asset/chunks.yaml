  raw: '"Being able to quickly parse and understand error messages will save you a
    lot of time and get you a long way. The fact you’ve tried will be very much appreciated
    by the person you’re asking for help."


    — Jack Franklin, author of “Beginning jQuery”


    Jack also recommends beginners to make an attempt at fixing problems on their
    own at first. When


    hitting a wall when debugging, Lee Byron, co-contributor to React, personally
    attempts to understand what’s going on by making ample usage of the debugger tools.


    Once I understand exactly what is happening – step by step, then I can compare
    that to what I expected to happen and isolate the surprising parts and see where
    my assumptions were wrong or how some code led to the surprising situation.


    Errors aren’t limited to bugs, however. Sometimes, you make bad decisions such
    as using the wrong data structure. According to Mike, getting burned by those
    bad decisions will eventually help you learn when it’s reasonable to use certain
    design patterns


    5\. UNDSERSTAND HOW THINGS WORK


    * * *


    "No matter what level you’re at I’ll say this: never ever write a line of code
    without knowing why it works, to the metal. Like, be obsessively curious. Be the
    Indiana Jones of source. Curiosity is one constant among engineers. I don’t think
    you could make it in this biz without looking into the monitor with wonder. Both
    childlike, and ruthlessly academic."


    — Ross Chapman


    Suffice to say, interest is not enough. You have to strive to understand how things
    work if you’re aiming to become a professional developer of some decency.


    "You can start out understanding the tools you use by sifting through StackOverflow
    questions. I’ve learned a thing or two from them. [The top AngularJS questions
    are] really interesting to read through as Angular is such a big framework."


    — Todd Motto, an AngularJS conference speaker and Developer Expert at Google


    Rohan Singh, a senior infrastructure engineer at Spotify, stresses the importance
    of working towards understanding the layer one level of the stack beneath what
    you’re working on right now. “Everything we do as software engineers involves
    working at some level of abstraction,” Rohan says. In other words, if you use
    some sort of database, you can take away the internals of the database and expect
    it to “just work”.


    Furthermore, to really understand how things work, you should be able to explain
    why certain  technical choices are better than others, and be able to troubleshoot
    problems when things don’t work the way the do. Rohan achieves this in practice
    by trying, a little bit at a time, to learn about and  understand the fundamentals
    of whatever platform or system he uses — whether that’s Python or Go or the Linux
    operating system. According to him, this eventually helps you generate a mental
    of model of how things work under the covers, and broadens your base of understanding.


    Ultimately, you’ll grow as engineer, and as a bonus you’d be able to debug more
    efficiently by learning how to do more “lean back” debugging as opposed to “lean
    in” debugging. In other words, you’d lean back and think hard about how things
    work under the covers to figure out what the problem might be. “This can be a
    lot faster and involve a lot less flailing than ‘lean in’ debugging with an interactive
    debugger or other tools,” Rohan says.


    In fact, Andrei Thorp from Evernote thinks everyone should learn basic C early
    on.


    Because it’s minimal and doesn’t do much for you, it forces you to understand
    how computers really work on a lower level. For example, C makes you manage the
    memory you use yourself – which means that later, when you use something like
    Python, you actually understand what Python is doing for you. Then, when you see
    some strange bug, you have this toolkit in your mind to understand what the problem
    could be.


    6\. KEEP LEARNING NEW THINGS


    * * *


    Nothing will kill your career/craft trajectory more than working at some shitty
    mundane programming job. Go somewhere where you are encouraged/forced to constantly
    learn new tricks,


    Says Jonathan Henson, who currently works at Amazon Web Services. Jonathan also
    tries to learn a new programming language, paradigm, or stack every year. He then
    puts himself on projects where he would have the opportunity to apply those skills.


    “I think the most important skill to learn is meta-learning,” says Kasra. “That’s
    what separates engineers and programmers to me. There’s something to be said about
    spending 12 weeks at a course learning one framework really well, but I really
    respect (and like to hire) devs that are able to learn whatever they need, on
    the spot, to do a task.”


    So, what’s the best way to learn new skills?


    Reading about what you want to do is a start. Steve Klabnik, who’s a Rust core
    team member and ranked #37 on the all-time Rails contributors list, seeks out
    any established research on the topic and also tries to figure out how people
    who are good at the thing he wants to do achieve their results.


    The most important thing is to just do it.


    1\. Try to do the thing, probably do it poorly.


    2\. Figure out where I’m going wrong, and what i need to improve


    3\. Work on what I’ve identified.


    4\. Repeat.”


    CTO of Bellhops, Adam Haney, says his favorite trick to learning new languages
    is to reimplement a previous project using the paradigms of that new language.
    For example, he would take something he wrote as object oriented code in C++ and
    then reimplement it in a functional language.


    I feel like this kind practice has prepared me to evaluate new technologies because
    I understand the underlying Computer Science principles even if I don’t know the
    intricate details of the language or framework.


    If you struggle with memorization, Andrei recommends building a memory palace.
    The general idea is that you use your brain’s powerful visual memory, and map
    that to more technical data, like numbers. He also strongly believe in techniques
    like The Seinfeld Calendar, which is based on Jerry Seinfeld’s idea that you don’t
    need to work hard every day — you only need to progress a little bit every day.
    “So with his calendar, you just check off whether you worked on the project today
    or not,” Andrei says. “There are some nice apps that will help you with this.


    On Android, I use HabitBull. As your streak gets longer, you feel more motivated
    to keep it running


    7\. LEARN HOW TO WORK WITH OTHERS


    * * *


    Another way you can learn new things is to work on projects with other people.


    “The legend of the lone coder is a myth,” Adam says. “Almost all substantial projects
    require teamwork.” This means you’ll need to learn the skills of breaking a problem
