    Since we wanted to be able to enter the pantry at floor level from inside the
    barn/garage, we took advantage of this to create a smaller second floor that would
    serve as more storage space. But this meant that part of the pantry walls would
    be above ground, and those walls would need to be well insulated; bags of sand
    would not do the job.'
