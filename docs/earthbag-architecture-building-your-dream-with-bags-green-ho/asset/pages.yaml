  md: '# The Basics


    # What Kind of Bags Work?


    Burlap sacks were the most common choice for military and flood control sandbag
    projects in the early days. These worked well as long as the bags didn''t rot
    from being exposed to too much moisture or sunlight over time, which was fine
    because they were considered temporary structures.


    By far, the most common bag material in use today is polypropylene. This synthetic
    is stronger than burlap and resistant to damage from chemical or moisture exposure.
    It is quite vulnerable to damage from ultraviolet exposure from sunlight, however,
    so it must be protected from this as much as possible. One can buy polypropylene
    bags that have been given a UV resistant coating, but this only adds adds a few
    weeks of protection if the bags are left in the sunlight.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_22_0.png)


    If you are going to fill the bags with loose material, it is pretty much imperative
    to use the poly bags, because they are stronger and will not deteriorate once
    they are plastered. If you intend to fill the bags with an adobe or stabilized
    material, then burlap or other natural materials for the'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'bags may work, because once the wall has set up, the strength of the bag is
    not as important.


    The fabric of the polypropylene bags is actually woven from small ribbons of the
    material. This is good, because it renders the bags breathable to some extent,
    meaning that moisture added to the fill material can eventually dissipate, and
    the fill can form a solid block. For this reason, other, nonbreathable, synthetic
    bags may not work well for earthbag building.


    Polypropylene bags are commonly used for the storage of grains or animal feeds.
    This means they can often be found as surplus or recycled bags. They can also
    sometimes be purchased as misprints from bag manufacturers or wholesalers. Of
    course, it is also possible to buy quantities of new bags at reasonable prices,
    both online and from local outlets. See the Resources chapter for more information
    about this.


    The best size for earthbag projects would be bags that might be designated as
    50 pound feed bags. These measure around 18 inches wide when flat and 32 inches
    long. This size works well, but the exact size is not critical; bags could be
    somewhat larger or smaller, though I wouldn’t go much smaller or the stability
    of the wall might be compromised. The wall will be about 18 inches thick when
    plastered. If you have larger bags, they might be used at the base, and if you
    have smaller bags, they might work near the top of a wall or dome. Larger bags
    would be more stable, but they take more material to fill them and they make thicker
    walls.


    Then there is the question of whether to buy gusseted bags or not. Gussets, or
    pleats sewn into the bottom of the bag keep the profile of the bag uniformly in
    one plane they are filled and tapped into place. Without the gussets, there is
    a tendency for the pointed corners at the bottom to stick out, making the later
    plastering more difficult. Some people like to carefully fold and pin the bottom
    of the bag to avoid this, but I prefer to simply pound the points in with a hammer
    before plastering. Another trick is to turn the bag inside out to avoid the points.


    Nader Khalili pioneered the use of long tubular sections of the same polypropylene
    material used to fabricate individual bags for layering on a'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'wall. These tubes can be cut as long as needed to complete a particular wall
    section, slid onto a rigid filling tube or funnel, and then filled in place. It
    takes several people to accomplish this efficiently, but the result can be very
    aesthetically satisfying, strong, and quickly done.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_24_0.png)


    The tubing material can be purchased (usually directly from a factory) as huge
    rolls, up to 6000 feet long. For some reason, there generally is no advantage
    economically in buying the large rolls over purchasing the individual bags, despite
    the obvious increase of manufacturing time and materials that goes into making
    the bags.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_25_0.png)


    A recent innovation with bag material is the use of open mesh bags of the sort
    that is commonly used to package fruit. This mesh can also be purchased in long
    rolls and used in a similar manner to the tubes of polypropylene. This technique
    was introduced by Fernando Pacheco, a Brazilian engineer, and he calls it “Hyperadobe.”
    The mesh bags are often a raschel weave and the fiber is either polypropylene
    or other synthetics.


    Hyperadobe takes Superadobe to a whole new level with many distinct advantages.
    The net bagging is generally cheaper than the woven poly material; the fill will
    dry out and cure faster; there may be no need for barbed wire in vertical wall
    designs; it creates a more monolithic structure due to direct bonding between
    courses; it is easier to gather the tubing on a canister for filling; there is
