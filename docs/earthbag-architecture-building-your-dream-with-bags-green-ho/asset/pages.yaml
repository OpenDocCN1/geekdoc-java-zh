  md: '# # Hanging Cabinets, etc.


    How do you attach cabinets and such to an earthbag wall?


    The answer, to some extent, depends upon what you fill the bags with. If you use
    an adobe-like soil that contains some clay, then you can actually use very long
    screw that will hold quite a bit of weight. With other, looser soil or material,
    you need to use another strategy.


    Earthbag walls can support a great deal of weight if the attachments are done
    right. You can embed wood or steel into the wall where you want to hang cabinets.
    This can be done either at the time of building the wall, or it can be done later
    by simply driving stakes into the wall. This might be easier done in places where
    there is already a slight void, like between bags or courses of bags.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_73_0.png)'
  merge: -1
  pgno: 73
- img_proc: true
  md: You can easily pound long sections of threaded rods all the way through bags,
    and then bolt sections of wood (even 2" X 4" s) on both sides, that are very secure.
    If they are long enough, a whole row of cabinets can be hung on them. Piercing
    the earthbags, even with loose material, is not a problem.
