  md: '# The Pond


    Peaceful Valley had a natural water channel dividing it that periodically ran
    water. We often thought it would be nice to take advantage of this and create
    a small pond by damming it. Eventually we decided to manifest this pond, and we
    chose earthbags as a way of making the dam.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_147_0.png)


    I knew that most dams gain their strength by forming a convex curve facing the
    impounded water, so I mimicked this in my placement of the earthbags. I also knew
    that it needed to be thickest at the base, so I did this by placing two rows of
    bags with a space between them that I filled with sand. As the dam gained height
    I tapered both rows of bags inward so that by the time I was at the top it became
    just one row of bags.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_148_0.png)


    This is the view of the dam from below. The large stones were used to help stabilize
    the dam and protect the bags and the plastic that covered them. At the deepest
    it was about five feet, which was deep enough to keep goldfish over winter.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_149_0.png)


    We lined the entire dam and pond area with black polyethylene to keep the water
    from just draining away into the sand. To protect the plastic we stacked stones
    or covered it with gravel.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_150_0.png)


    This pond became one of our favorite places to spend meditative time. It wasn''t
    long before frogs and water loving insect found it. We stocked it with some tiny
    goldfish that grew and reproduced. All was serene until one day we had a deluge
    of rain that came down so hard and fast that several local streets were nearly
    washed away. That same brief storm brought so much sand and silt down the arroyo
    that it overwhelmed the little catch basin we had created to deal with it, and
    completely filled the entire pond so there was no water left there. The fish were
    gone, washed further downstream and likely never survived. What a pity... but
    at least we enjoyed it for those few years before the calamity. And the earthbag
    dam actually held firmly!'
  merge: -1
