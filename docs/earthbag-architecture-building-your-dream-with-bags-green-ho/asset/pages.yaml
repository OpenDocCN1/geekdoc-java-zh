  md: '# Tamping the Bags


    To consolidate the fill material and flatten the bags in place they need to be
    tamped soon after being laid. I usually wait until I have laid several, or even
    a whole course of bags, before doing this, since once you are there tamping it
    is easier to do a whole section at once.


    Stomping on the bags with your feet can do some tamping, but it is much more efficient
    and thorough to use a special tamping device. These can be purchased in some hardware
    stores, or fabricated in various ways.


    My favorite tamper is home made, with a metal pipe handle welded to a scrap piece
    of heavy steel. The weight of this tool is an advantage, because it adds to the
    downward tamping thrust; it is a bit heavier to lift, but I find it takes less
    effort than always putting force into the downward thrust. The tamping blade is
    about as wide as a standard bag, so each tamping action will do maybe 25% of the
    bag. The commercial tampers usually aren’t as wide so they need to be moved around
    more to do the job.'
  merge: -1
