- img_proc: true
  md: 'Around the time that we started building Montecito I realized that the project
    would go much faster if I were able to make the papercrete plaster in greater
    quantities. Mike McCain, the papercrete master, had invented a truly industrial
    mixer that he called a tow mixer, and I enlisted his help in fabricating one for
    me. It is really a rather simple idea of using the rear axel of a small pickup
    truck and placing the drive connection pointing upwards so that a lawn mower blade
    can be attached to it. Around this blade is secured a large tank, like the stock
    tank pictured above. A separate tow bar and hitch, the blade is welded to the
    axle so that when the mixer is pulled behind a vehicle, the blade is forced to
    turn with tremendous power. All it would take is the equivalence of one pass around
    the block at slow speed, and by the time you returned the papercrete would be
    completely mixed and ready to dump into the drain box.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_116_0.png)


    I used this mixer to produce enough papercrete to cover the completed Montecito,
    and barely got the job done before winter. As with the bedroom-'
