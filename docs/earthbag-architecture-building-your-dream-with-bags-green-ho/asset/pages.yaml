  md: '# Midsection


    The next phase of construction was to join Montecito to the bedroom dome with
    a connecting space that would serve many functions. On the lower level would be
    a greenhouse, bathroom, utility space, and above that would be a small office.


    My plan classed for a section of a sphere on the north that would basically rest
    upon the two domes to support it. The south side would be framed with wood to
    easily provide glazing for the greenhouse, as well as a large flat roof for various
    solar panels.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_118_0.png)


    To test my theory that it would be possible to create such a section of a sphere
    using earthbags, I pulled out my little kit of miniature earthbags and started
    to stack them between two dome-like mounds of papercrete. The photo shows the
    result of this, and it all seemed like it was stable enough that it was worth
    a try at full scale.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_119_0.png)


    In reality, the bag wall proceeded fairly easily up to the first story, mainly
    because this part was nearly vertical. The back of the wall to the north was going
    to be substantially bermed, so the lower bags were filled with soil for thermal
    mass, and then scoria was placed up against them for insulation. An apron of black
    plastic was put into place to protect it all from moisture before it got backfilled.'
