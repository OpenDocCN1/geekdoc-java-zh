  md: '# Plaster


    In preparing a wall for plastering, you should try to get the surface all into
    the same plane as much as possible. This would be the time to pound in any protruding
    bag corners and flatten any bags that stick out noticeably. You can also take
    a putty knife or screw driver and tuck in any loose bag material that might interfere
    with there being a good bond between the

    plaster and the wall.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_64_0.png)


    In most situations the use of plaster mesh is a good idea; mesh will help hold
    the plaster in place while it is curing, and will also help keep it there over
    time. Chicken wire (either 1 or 2 inch wire works), stucco mesh, and even synthetic
    fish netting has been used for this purpose.'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'One way to fix the mesh to the wall is with homemade U-shaped staples. These
    can be cut from wire that is stiff enough to be able to pound them into place
    with a hammer. Prongs that measure 3 or 4 inches long should hold the mesh onto
    the wall well enough.


    Plaster is usually applied in two or three coats, with the first one left rough
    to provide good "tooth" for the next one. The last coat would be the finish or
    smooth coat. One way to assure that the first coat gets well adhered to the wall
    beyond the mesh, is to actually throw it with the trowel at the wall. If you aim
    towards the crevices between the bags, this is where the best opportunity is for
    the plaster to grab onto the wall.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_65_0.png)


    Interior plaster can be most anything that covers the wall well that you want
    to live with. This could be an earthen plaster (sand and clay), lime, cement'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'stucco, or even papercrete. A combination of these might also work; with one
    project (pictured above), I used an initial coat of papercrete with a finish coat
    of white lime for a nice bright finishing.


    The exterior plaster is best stabilized with some cement or lime to protect the
    finish from weathering too much, especially if it is not protected by wide roof
    eaves. In general it is best that the plaster breathes some, so if any moisture
    manages to enter the wall it can dissipate eventually.


    With domes it is absolutely necessary to provide a waterproof coating to avoid
    water entering the building and compromising the integrity of the dome or promoting
    the growth of mold. For this reason I recommend cement stucco on the dome exterior.
    You can add some latex to the stucco mix that helps with making it waterproof.
    Then, after the stucco has cured, an exterior roof paint can be applied for added
    protection.


    There is much more that can be said about plastering; see the resources that are
    focused specifically about this.'
  merge: -1
