  md: '# What Shapes are Possible?


    Earthbag building is quite versatile but there are some inherent limits to what
    is reasonably attempted. Vertical walls, whether curved or straight are always
    possible, although straight ones may require buttressing (disscussed later). Curved
    vertical walls tend to be more stable because they are self-buttressing.


    The potential height of vertical walls is governed by the same ratio that applies
    to other earthen wall systems. Wall height : thickness at the base is at least
    10 : 1, so an earthbag wall that is 15 inches wide at the base should be no taller
    than 150 inches, which is 12.5 feet. If you want to go higher than that you need
    to use wider bags, at least at the bottom of the wall.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_44_0.png)


    What about two story buildings that have vertical walls? It is possible, but they
    would have to be very carefully engineered. Above is pictured one concept for
    a two story building that was suggested by an engineer and might pass code in
    some places. You can see how the first story is wider than the second, and how
    steel anchors wrap the entire second story wall and are embedded in concrete bond
    beams at the top of each story’s wall. In general, it is best to stick to one
    floor for most vertical walled earthbag buildings.'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'Domes are commonly built with earthbags, both simple isolated domes and complex
    interconnected ones. There is a limit to how large a diameter could be without
    compromising the integrity of the dome; this limit seems to be around 6 to 7 yards
    or meters. It is best to stay with circular dome patterns; I did make a large
    elliptical dome once, but had a lot of trouble keeping it stable, as you will
