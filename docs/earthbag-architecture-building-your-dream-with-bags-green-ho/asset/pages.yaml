  md: '# Fill Material


    The most common thermal mass fill material is a mix of sand and clay that approaches
    that used in other earthen wall systems, such as adobe, cob and rammed earth,
    where about 30% clay and 70% sand mix is ideal. Since since soil is encased in
    a strong bag, the exact formulation for this soil mix can have much more variability
    when used for earthbags. The objective is to have that that does not shift around
    once it is moistened, tamped into place, and dried. Virtually any soil can be
    used in earthbags, but it is best to avoid heavy clays or fine, slippery sand.
    As you remove most of the larger rocks and organic debris, you should be fine.
    This means that it is often possible to use the earth beneath your feet at the
    site of building. What could be more sustainable than this?


    How the bags will be used in a wall may determine what the best fill material
    is. Vertical walls are generally more forgiving than domes, which really need
    to be built with solid blocks of material. A dome created with shape-shifting
    fill could become unstable and collapse, unless it has proper reinforcing.


    Another determining factor for choice of fill material is exposure to possible
    moisture issues, like underground situations or domes built in wet climates.


    If there is not enough clay to bind the soil, it is possible to stabilize it with
    either Portland cement or builder''s lime. About 10% of these stabilizers could
    be enough, but it is best to run some tests with your soil to determine this.
    With domes, especially in climates where excess moisture could be an issue, it
    is advisable to stabilize the soil with cement to assure that the fill will never
    become soft enough to deform. We advise folks to avoid making domes in rainy climates,
    or at least to provide an additional, separate roof over the dome to shed water
    away from it.


    Other, more insulating fill materials that have been used successfully include
    pumice and scoria (which are both lightweight volcanic stone), perlite, and even
    rice hulls. One could experiment with recycling Styrofoam (EPS foam) or crushed
    plastic bottles as fill also. Of course, you'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'would have to take into account the possible compressibility of these materials
    when designing the wall.


    A special case for appropriate fill material is at the foundation or first course
    or two at the base of a wall. Here you want the wall to absolutely not deteriorate
    in moist conditions, nor do you want the wall to wick moisture upward into the
    level with loose gravel. So we generally advise folks to fill the bags at this
    level with loose material. And because it is essential that such loose material
    never escapes, we advise the use of two bags (one placed inside the other) for
    double assurance it will be secure. A good stabilized plaster is essential to
    protect these bags.'
