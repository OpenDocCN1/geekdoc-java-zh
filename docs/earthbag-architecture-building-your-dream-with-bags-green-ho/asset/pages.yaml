  md: '# Recessed Pantry


    Having had the wonderful cool pantry at Peaceful Valley, we missed this facility
    and wanted to manifest another one as soon as we could. So as we designed an addition
    to the manufactured home that we had bought in Colorado after returning from Mexico,
    we included a recessed pantry. It would be adjacent to a large new barn/garage
    attached to the house, so it wouldn''t be as convenient as it was at Peaceful
    Valley, but it would also serve several other functions.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_173_0.png)


    First we had an excavator dig a hole that was about 4 feet deep and slightly bigger
    than the footprint of the pantry. I wanted the pantry itself to be about 6 feet
    underground, but I figured that I could use the sandy soil that was left at the
    bottom of the hole to fill the bags. This meant that I needed to dig a trench
    around the perimeter of the hole that would go down to the actual intended floor
    level for the pantry.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'The next step was to start filling and laying the bags in the trench. As I
    did this I placed a 6 mil black plastic liner next to the outside of the bags.
    This would serve both as a moisture barrier for the pantry and as a convenient
    way to protect the bags from exposure to the sunlight when I wasn’t working on
    the project. As the wall rose I would go around and backfill soil up against the
    plastic and the bags, securing the whole assembly.


    These pantry walls were not actually vertical; I inclined them at a slight angle
    outward, so that their weight would be falling toward the embankment.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_174_0.png)'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'This avoided any necessity to buttress the wall on the inside. In fact, I felt
    so confident that these pantry walls would be secure, even with the fine sandy
    soil as fill, I dispensed with using barbed wire between the courses for the most
    part.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_175_0.png)


    With the wall that was adjacent to the garage, I did use barbed wire, as well
    as long rebar stakes to help stabilize it, even with the outward incline. This
    was because with heavy vehicles parking right next to the wall, I realized that
    there could be added pressure against that wall.


    Near one of the corners, low on the wall, I installed an inlet air vent for the
    pantry, using sections of 6 inch PVC pipe. This pipe would draw air from above
    ground but feed it into the space down low. The exhaust air vent would be up high
    in the opposite corner.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_176_0.png)


    I used the native sand to fill these bags because I wanted there to be direct
    thermal contact between the walls of the pantry and the underground soil. Theoretically,
    the soil 5 feet below the surface at his high altitude location would not freeze,
    and it would stay at a fairly constant cool temperature... just what you want
    in a cool pantry.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_177_0.png)


    In the above photo underground pantry walls have been completed, and you can see
    the huge water tank in the adjacent garage waiting to be lowered into place at
    the bottom of the pantry floor. Even though the tank takes up a lot of the available
    space it will serve several important functions.


    This is a 1500 gallon tank that will collect rainwater from the roof of the barn/garage
    and will provide irrigation water and a reserve water supply for security. All
    of this water will also help stabilize the temperature in the pantry, since it
    will act as a huge bank of thermal mass. And the pantry will help keep the water
