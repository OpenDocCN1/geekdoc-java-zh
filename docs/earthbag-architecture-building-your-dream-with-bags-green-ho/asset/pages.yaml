  md: '# Barbed Wire


    In most circumstances it is best to place barbed wire between each course of earthbags,
    ideally two strands of 4-pronged barbed wire placed parallel to each other. There
    are several reasons for doing this. First of all, the barbs on the wire tend to
    catch into the fabric of the bags, essentially stitching the two together into
    a more monolithic structure. The other main reason is that the wire provides tensile
    strength that the bag wall would lack without. This is especially important for
    dome structures, because they exert strong outward pressure on the bags from the
    weight of the bags above pressing downward and outward.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_38_0.png)


    In general, the barbed wire holds everything together into a uniform matrix that
    resists the component bags from dislodging.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_39_0.png)


    Barbed wire is nasty stuff to work with. It has a mind of its own and can gouge
    your hands easily. I always use heavy leather gloves when working with it and
    give lots of respect. It helps to unwind enough wire from the spool to fit the
    desired place in advance, and then carefully bend it into a more or less straight
    line before placing it on the wall. Then, as shown in the photo, you can use stones,
    bricks, or other heavy objects to keep it where it should be on the course of
    bags. This should be done for the entire section of wall before going to lay more
    bags on top of it.


    To make it easier to position each bag perfectly into place, a metal “slider”
    can be very handy. This is a piece of sheet metal cut to approximately the size
    of a bag, with a 90 degree grip handle on one end. The idea is to put this slider
    over the barbed wire in the area where the next bag is to be placed. Then, once
    the bag has been filled and laid down into its intended location, you can hold
    the bag in place with one hand and yank on the metal slider to remove it and allow
    the bag to drop into place. That is'
