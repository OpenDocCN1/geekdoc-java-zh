  md: '# Openings


    Doors and windows provide challenges for the integrity of an earthbag wall. Any
    opening creates a place where the matrix of the wall is torn, so to speak, and
    the edges of the opening need to be stiffened. There are various ways to accomplish
    this stiffening.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_51_0.png)


    Doors can be made rigid by creating a metal or wooden frame around them that is
    integrally connected to the earthbag wall. This “door buck” can then be used for
    attachment of the door itself. One good way to connect the door buck to the bags
    is to provide periodic anchor plates within the wall as it is being erected. These
    can be plywood or metal plates that either have a piece of solid wood attached
    at one end or the metal edge turned 90 degrees. A bunch of nails can be driven
    through them in both directions that get embedded into the bags below and above
    them. The solid wood or metal edge is exposed in the doorway in the same plane
    as the door buck to which it can be attached. Window bucks can be created and
    attached in the same manner as door bucks.


    A simple door or window buck may not be sufficiently strong on the top of the
    frame to support the weight of the wall or roof that may be above it. It is important
    to make sure that an adequate “header” be provided to support such weight, and
    this could be a larger beam of wood that is wide enough to support the bags. In
    some cases, when the top of the door or window is quite close to the top of the
    wall where there would normally be a reinforced “bond beam” (discussed later),
    then this beam itself will act as a'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'sufficient header. Another way to deal with the weight of the wall above a
    door or window is to make an arched opening there.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_52_0.png)


    Windows can be created in shapes other than rectangular, such as circular or triangular.
    In this case it is possible to insert an appropriate frame for these shapes as
    the wall is being built, with the bags jammed up against them. I have done this
    with various diameter culvert sections or old metal wheels. A simple triangular
    shape can be made of wood to frame a window, like shown in the photo.


    In addition to stiffening door and window openings with frames, it is a good idea
    to drive vertical metal rods or rebar stakes through the bags near the edge of
    the opening in such a way that they avoid hitting any anchor plates'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'within the walls. This stake can eventually be incorporated into the bond beam
    at the top of the wall.


    I might caution you that with earthbag domes you need to be careful not to riddle
    them with too many windows or doors. Because domes rely on the barbed wire for
    the tensile strength of the walls, too many perforations can compromise this and
    introduce weaknesses into the wall.


    Sometimes it is not convenient to use operable windows with earthbag projects,
    so some other way to introduce good ventilation may be necessary. I have done
    this by using vent pipes placed in strategic places, both low and high within
    the structure. A section of any large diameter pipe can serve this purpose; I
    have used both metal and plastic for this. Such a vent placed placed at the apex
    of a dome can create a considerable draft when some inlet air vent is opened as
    well. One simple way to provide vent closures for these is to use an inflated
    ball that fits the diameter of the pipe.


    While on the topic of openings, I might mention that once a wall is completed,
    it is rather difficult to go back and retrofit a wall with either a door or window.
    Cutting through an earthbag wall can be a messy and even hazardous venture. For
    this reason, I advise you to frame in any door or window spaces that you expect
    you may need at some future time during the initial construction phase. These
    can be finished so that they may not be noticeable, but you will know they are
    waiting there if necessary.'
