  md: '# # The Future of Earthbag Building


    I believe that the future of earthbag building is very bright indeed. If the way
    it has expanded globally over the last couple of decades is any indication, we
    can expect earthbag architecture to continue to flourish. In fact, from what we
    know about the enormous environmental, and political pressures bearing down on
    humanity, earthbag building provides some real hope that we will be able to deal
    effectively with some of these challenges.


    We know that earthbag structures can be extremely robust when Mother unleashes
    her periodic fury, and with more severe weather predicted as a result of global
    warming, her fury could become even more fearsome. Earthbag houses have already
    withstood hurricanes, floods and earthquakes, so we know that, if built properly,
    they can provide safe havens. Another increasing threat is fire, and since most
    part of earthbag houses won''t burn, they should withstand this as well.


    I have frequently requested to pleas assistance after major natural disasters
    for folks looking for ways to rebuild communities with safe, inexpensive housing;
    their research has singled out earthbag building as a likely candidate. Initially,
    earthbag architecture was considered by many to be solely useful for temporary
    emergency housing. This is probably because of the similarity it has with the
    use of sand bags for flood control and military barricades. But now people are
    becoming aware that this technology offers a whole world of permanent architectural
    possibilities.


    The other side of the equation of dealing with the adverse effects of climate
    change, is addressing the causes of these changes in the first place. Greenhouse
    gasses have been singled out as the most likely cause, and to diminish the emission
    of carbon dioxide means consuming less fossil fuel and conserving our natural
    resources. Since earthbag building generally uses unprocessed natural materials,
    the bulk of what is needed to build this does not require burning fossil fuel.


    Another environmental threat is air pollution, both inside and outside the home.
    The natural mineral fill material generally used in earthbags is inert'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'does and not off gas, which contributes to cleaner air. Earthen plasters can

    also be used; even lime plaster that emits CO2 during its manufacture will

    reabsorb that gas as it cures. Earthbag architecture does not necessarily rely

    on wood for construction, thus conserving trees that also absorb CO2.


    Earthbag buildings have the potential to be extremely durable, as there is

    littled used that will deteriorate over time. And at the end of their life, the
    fill

    material usually just be returned to the earth where it came from.

    Obviously, from an environmental standpoint, earthbag architecture is

    superior to standard construction these days.


    Economically, building with earthbags can be the one least costly

    approaches available. Certainly the materials for building walls can be dirt

    cheap. Beyond that, it depends on the building style, size and amenities how

    much it might cost. As any building project, the amount of work the

    owner is willing to invest, and how good he or she might be in finding

    inexpensive supplies, can make a big difference in the cost. The earthbags

    themmselves are generally available all over the world; often they can be

    recycled from previous uses.


    Minimal housing can be created with earthbags for practically nothing. As I

    showed with the construction of the little underground dome, the cost for

    that was nothing more than the cost of the bags and a sheet of plastic. Of

    course the bags themselves might have been recycled and cost nothing as

    well. It is literally possible to take a shovel and a backpack filled with bags

    plastic, and go into the wilderness and create a small domicile! On the

    other hand, one could construct a true mansion with earthbag architecture; it

    is this versatility I love about earthbag building.


    Politically, the future is hard to predict. Because of this uncertainty about

    where any place in the world is headed, the versatility represented by\earthbag
    building is a virtue. And the fact that earthbag walls can protect a

    family from penetrating bullets would be a comfort to many. It is even\possible
    to go completely underground and nearly disappear from view, as

    many survivalists dream of. So no matter what your outlook may be,

    earthbag architecture might have a place in you and your family’s future.'
  merge: -1
  pgno: 254
