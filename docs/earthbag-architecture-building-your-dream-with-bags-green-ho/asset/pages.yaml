- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_56_0.png)


    You will notice that the photo to the left shows a different pattern of stacking
    bags. This what I call a “double crosshatch” pattern, and it resulted from much
    experimentation in trying to make an arch spanning six feet. I used a set of miniature
    bags I had made to come up with the concept. Basically alternating courses of
    two bags placed side by side and oriented in a # pattern creates a much more solid
    arch. In fact I found that, as shown in the model above, such an arch can remain
    unsupported by lateral walls.'
