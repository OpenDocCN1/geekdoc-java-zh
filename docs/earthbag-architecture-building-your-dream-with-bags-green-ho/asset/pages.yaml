  md: '# Foundations


    Earthbags themselves make good foundations, and have been used that way for many
    other building systems, such as for straw bale, cordwood, cob, etc. In this case,
    the bags are built up to the proper height for a stem wall that keeps the rest
    of the wall at least a foot above grade, well above snow level or possible back
    splash from hitting the ground.


    All foundation systems must take into account the possibility of the underlying
    soil heaving with freezing weather or from expanding with moisture, as do heavy,
    expanding clays. The common way to avoid these problems is to dig down to a level
    that is below the frost depth for that region, or below any layers of heavy clay
    soil.


    Prescriptive building codes often require continuous concrete foundations that
    comply with specific conditions and measurements. Such a foundation can be used
    with earthbag construction, as long as the top of the concrete foundation is wide
    enough to accommodate the full width of the earthbags when compacted on top. In
    this case it would likely be a good idea to place a moisture barrier on top of
    the foundation wall, or start with a course of gravel-filled bags, to avoid the
    concrete from wicking moisture into the wall above.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_29_0.png)


    Better using a massive reinforced concrete foundation would be to employ a simple
    rubble trench foundation. These foundations were embraced by the famous architect,
    Frank Lloyd Wright. The idea is to dig a trench, at least as wide as the bags
    and plaster, down deep enough to get below the frost level. This trench is then
    filled with cobble stones, possibly graded so that the smaller aggregate is toward
    the top of the trench. This keeps the foundation stable from soil heating provides
    lots of spaces between the stones for moisture to accumulate and eventually drain.
    As seen in the above photo, the top of the rubble trench can be recessed some
    below grade, with the first course of gravel-filled bags placed so that they will
    provide a “toe” into the soil.


    If the soil surrounding the trench does not drain enough, then what is know as
    a French drain can be installed. This is a 3 - 4 inch drain pipe (usually plastic
    these days) that has been perforated so that water can seep into it from above
    and the sides. The pipe is laid toward the bottom of the'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'trench and inclined slightly so that water will run to either a “daylight”
    location on the property or to an underground sump or drain field. This will allow
    any excess water to flow away from the foundation.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_30_0.png)


    In the above photo the rubble trench is fairly shallow and no French drain is
    provided because the soil is pure sand that drains exceedingly well, making upheaval
    highly unlikely. The wire mesh visible in the photo was an attempt to keep the
    cobbles contained from migrating into the sand, and would not be needed in most
    applications.


    There is no specific need to place a concrete cap on top of a rubble trench, but
    this could be done if the code requires it, or if the cobble stones used in the
    trench are fairly large and don’t provide a good enough surface to lay the first
    course of bags on.


    Additionally, the soil surrounding the base of the foundation wall should be graded
    so that it slopes away from the structure, keeping surface water from collecting
    near the foundation.'
