  md: '# Montecito


    The next building season brought us to the most complex and challenging portion
    of this monumental project. This was the large oval dome that would comprise our
    kitchen/dining/living room/and loft office. It measured roughly 20 feet on the
    short axis and 30 feet on the long axis. It was positioned about 20 feet away
    from the bedroom dome, and like the bedroom, would have a six foot glassed entry,
    as well as several circular windows for passive solar heat.


    Soon after we started the construction we came up with the name “Montecito” for
    this dome, which means “little mountain” in Spanish, because we realized that
    the dome itself would be a veritable mountain of bags.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_99_0.png)


    Montecito would be substantially bermed into the south-facing slope, and you can
    see in the photo how the leveled building pad has left a bank of native sand around
    parts of the perimeter. We hired an excavator to do the digging this time to speed
    the project along. On the far right you can see'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'another room that was dug out at the same time that would eventually become
    our pantry. In the distance the bedroom and our bus home are visible.


    We foolish made a huge tent-like shade structure over the building area, but the
    wind made quick work of demolishing it so we went back to putting tarps over the
    walls themselves.


    The elliptical footprint was broken by four doors leading to all four directions.
    Each of these openings would be framed by hefty double bagged buttresses.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_100_0.png)


    We found some antique steel wheels that had been parts of farm equipment and had
    had very wide rims that could actually support some bags placed on top, and we
