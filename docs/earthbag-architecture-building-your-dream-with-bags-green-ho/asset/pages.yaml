  md: '![](img/4f93d33c635578ee6b6ef918bb8ad9d6_55_0.png)


    I have found that half circular arches work fine for spans up to about three feet,
    but much wider than that they seem vulnerable to collapse. For wider spans up
    to six feet I think that the pointed gothic arch form is more secure.


    A simple radial pattern of stacking the bags, like that shown in the first photo
    is common. In doing this it is obviously necessary to fasten the top of the bags
    very securely so there is no possibility of spillage. The way to stack the bags
    is alternately from both sides until there is space for one “capstone” bag, which
    must be firmly tamped into place to assure that compression won’t later dislodge
    it.


    Before attempting to remove an arch form, it is best to build up the walls on
    both sides of it to the point where there is no possibility of any sideways movement
    of the bags comprising the arch. In fact, if the arch is built along the wall,
    it is possible to run the barbed wire between the arch bags and the wall bags,
    thus securing the whole assembly as a unit.'
