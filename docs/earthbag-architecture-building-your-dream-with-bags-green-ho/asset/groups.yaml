    # Roofs


    Most any conventional roof system can be used over an earthbag building. Obviously,
    a design that includes rounded or domed forms with rectilinear ones can present
    more challenges to roof design. I prefer pitched roofs rather than flat (or nearly
    flat) roofs; they usuallya do a better job of shedding moisture and keeping it
    away from the walls.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_67_0.png)


    With the exception of domes and very small vaults, earthbags cannot be used to
    create a roof. It is possible to use earthbags filled with insulating materials
    to insulate other roof systems, and I have done this few times. In the photo the
    earthbags are filled with scoria, a lightweight natural insulating material.


    In the discussion about bond beams I mentioned some ways to attach the roof framing
    members to the bond beam. For the most part, these details'
  - '[PAGE 68]


    resemble those used with any other wall system, where there is a top plate that
    can be used to attach rafters, trusses, etc. Sometimes these are secured with
    wind resistant connectors, where this might be a threat.'
  - '[PAGE 69]


    # Floors


    Most earthbag project have floors at or near the grade of the property, with perhaps
    no more than a step up. A concrete pad is certainly one flooring option, but is
    not the only one. The floor could also be made with flagstone, brick, pavers,
    poured adobe or rammed earth. Carpet could be laid over any of these, but tile
    would need a solid concrete base most likely. The photo shows a combination of
    flagstone on the right with poured adobe scored to appear like stone; an oil finish
    is being applied to both.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_69_0.png)


    It is almost always a good idea to put some insulation down before making the
    floor over. This will isolate the floor from the earth below, which would otherwise
    tend to siphon off the warmth and bleed energy. It is possible to use commercial
    rigid foam insulation for this purpose, but a more natural alternative that I
    have used crushed scoria, a lightweight volcanic stone.


    If you want a raised floor with a crawl space beneath it, this is also possible.
    To do this it would be good to create a bond beam below the floor level'
  - '[PAGE 70]


    where a plate can be made to secure the floor to it. Then standard floor joists
    and other flooring materials can be added. More earthbags can be stuffed between
    the joists to continue with the wall that goes up.'
  - '[PAGE 71]


    # Utilities


    How do you handle electrical and plumbing circuits in an earthbag house?


    Electrical wire can be routed between the bags before they get plastered, either
    with conduit or or using UF wire accepted for direct burial in the plaster. If
    the wire or conduit is tucked into the crevice between the bags it will not interfere
    with the application of the plaster.


    To install the electrical boxes you can simply drive some long pointed wooden
    stakes into the bags where you want them and leave enough sticking out to screw
    the boxes to. With fairly loose fill this is easy to do and they are plenty strong.
    This may be harder to do with some soils, especially if stabilized. Once the stakes
    are driven in they are amazingly firm and do not wobble, and, of course the plaster
    holds them even better.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_71_0.png)'
  - '[PAGE 72]


    Often it is easier to route plumbing into wood framed partition walls inside the
    house, and otherwise route drains and such under the floor (as shown above). In
    my earthbag house I brought the primary water line in below frost level and then
    up to connect with plumbing in a framed interior wall. This avoids any issues
    with freezing pipes. You can run water lines in the cracks between bags.


    If frost is not an issue, then it would be possible to just poke the pipe directly
    through the wall while you are building it, or even pound a section of steel pipe
    through after the fact. Or you can leave larger diameter pipe in appropriate places
    to serve as chases for pipe later on.


    The black water from the toilet needs to drain to an appropriate septic tank or
    sewer line. The shower and sinks drain could be plumbed into a gray-water tank
    for possible re-use if you want.'
  - '[PAGE 73]


    # # Hanging Cabinets, etc.


    How do you attach cabinets and such to an earthbag wall?


    The answer, to some extent, depends upon what you fill the bags with. If you use
    an adobe-like soil that contains some clay, then you can actually use very long
    screw that will hold quite a bit of weight. With other, looser soil or material,
    you need to use another strategy.


    Earthbag walls can support a great deal of weight if the attachments are done
    right. You can embed wood or steel into the wall where you want to hang cabinets.
    This can be done either at the time of building the wall, or it can be done later
    by simply driving stakes into the wall. This might be easier done in places where
    there is already a slight void, like between bags or courses of bags.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_73_0.png)'
  - '[PAGE 74]


    You can easily pound long sections of threaded rods all the way through bags,
    and then bolt sections of wood (even 2" X 4" s) on both sides, that are very secure.
    If they are long enough, a whole row of cabinets can be hung on them. Piercing
    the earthbags, even with loose material, is not a problem.'
  - '[PAGE 75]


    # Peaceful Valley


    My first hands-on experience of building with earthbags was soon after we bought
    the property in Colorado where we wanted to park our bus home. The street was
    called Peaceful Way, so we decided to call our property “Peaceful Valley,” as
    there was a small waterway down the middle of it. We had gotten permission from
    the property owners association to build a house with earthbags, but I wanted
    to first gain some experience on a small trial structure.


    We decided to make a small earthbag dome, just using the local soil (basically
    sand) to fill the bags. We figured that we could use the building for storage
    or a garden shed eventually, so it didn’t really need to be insulated.'
  - '[PAGE 76]


    # Riceland


    Most of the misprinted polypropylene bags that we bought were marked “Riceland,”
    a brand of rice, so we started calling this little dome Riceland. There were no
    books available at that time (1996) to guide me with how to build this way, but
    I thought how hard could it be to fill and stack bags with barbed wire between
    them? I had already seen several successful earthbag domes, so I had some idea
    of the appropriate shape.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_76_0.png)


    We selected a site not too far from where we planned to build the house and leveled
    an area large enough for the dome. I placed a stake in the center of the space
    and used a string as a 7 foot radius to scribe a 14 foot diameter (interior) circle.
    Another circle about a foot and a half larger in radius described the outside
    of the dome.'
  - '[PAGE 77]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_77_0.png)


    Then we dug a trench about a foot deep between the circular lines, added an entrance
    space with flanking buttresses, and were ready to fill the trench with rubble
    for the foundation. We would have gone further down below the frost level (about
    5 feet in that region) but since the sand drained so well it seemed pointless.'
  - '[PAGE 78]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_78_0.png)


    Soon I was filling the bags with the sand I had piled up, stacking them on the
    wall and putting the barbed wire between the courses. I kept the wall covered
    with tarps when I wasn’t working on it. How exciting it was to see this building
    materialize, primarily from the earth beneath it!


    I used a 14 foot plastic pole as a radius for the arc that defined the curve of
    the wall going up. I would place this pole at the base of the wall and then pass
    it through the imaginary center axis of the dome, checking the accuracy of where
    I had placed the bags. I did this every time I completed one course, in several
    places around the wall. I could have set up a mechanical compass arrangement to
    do this, but I liked the simplicity of doing it this way. At first the wall rose
    nearly vertically, so the curvature wasn’t noticed until it was about 3 feet high.'
- md: '

    We found some culvert couplers that we used as forms to create round windows in
    this little dome. They were just as wide as the bags and got solidly locked into
    the wall as the bags pressed against the corrugated surface.


    You might notice that with this dome I was tying twine around the bags as placing
    the barbed wire between them. This was an attempt to make the wall even more monolithic,
    and I thought that the extra twine would help hold the plaster to the wall. I
    later dispensed with this, deeming it unnecessary.


    One day while I was happily carrying buckets of sand up a ladder to fill the bags
    in place, my eye caught a discrepancy in the perfectly circular aspect of the
    top row of bags. I thought this was strange since I was sure I had checked that
    course with my pole. As I stood on top of the wall, I felt movement beneath me
    and I could see that the wall was caving in! I immediately jumped outside the
    dome to be safe and watched as almost the entire structure imploded to the ground.
    It was like watching a slow motion wave in action, proceeding from one side of
    the wall around to the other.


    Yikes! I was safe, but it was a major calamity; a tangled mess of bags, sand,
    barbed wire, bent ladder and culvert couplers. The buttresses at the doorway kept
    that part from collapsing, and the wall up to about a yard high was OK. But what
    had gone wrong?


    It took days for me to clean up the mess, and my confidence was severely shaken.
    I had plenty of time to ponder the problem and ultimately realized that my mistake
    was to use the native sand, which was very fine and slippery... a true shape shifter.
    Basically, once I got high enough up the wall, gravity dictated that it was going
    to pull the wall down by shifting the sand in the bags. This is why it is so important
    to use a fill material that will consolidate into a more solid mass when erecting
    a dome. Now I know!


    My intention all along was to use crushed scoria to fill the bags for our dome
    home, because it is lightweight, mined locally, and provides fairly good insulation
    due to all of the trapped air in the voids of this volcanic stone. So at this
    point with Riceland, we decided to switch to filling the bags with scoria and
    see if it would actually work well as a fill. But first I made a tiny dome with
    the scoria to test the theory. The photo shows me smiling inside the completed
    test dome, and I was confident enough to proceed with reconstructing Riceland.


    Working with the scoria was actually much easier, due to its lighter weight. I
    could fill the bags on the ground and easily carry them to the wall, since each
    bag only weighed about 35 pounds. I carefully tamped the courses in place to get
    the loose scoria to pack into a kind of block that was solid enough to hold its
    shape. It wasn''t long before I got back to the height of where it was at the
    time of the collapse, and all was fine.


    My first attempt at making the buttresses surrounding the doorway, using a stack
    of single bags on top of each other, was too wobbly. So I tried using this pattern
    of two bags placed side by side in an alternating crossh pattern, and this was
    much more stable. As I was building the buttresses, I inserted wooden blocks with
    half inch threaded rod bolted through them, and the rod sticking out between the
    bags.


    This allowed me to eventually fasten the wooden door frame securely to the buttress.


    When I got up to the height of the top of the door, it was time to set up a form
    for an arched window over the door. I proceeded to fashion the arch as described
    earlier in the section about building arches, using single bags laid over the
    form.


    The plan was to build a half loft in the upper part of the dome that could be
    used for sleeping or additional storage space. I framed this loft by simply laying
    2 X 6 inch joists all the way across the dome and resting them on the top of the
    wall. I used wooden shims to assure that the loft was level and in one plane.
    Then I filled in the spaces between the joists with more bags of scoria. I noticed
    that as soon as I had the loft framing locked into place, the whole structure
    became rigid and didn''t vibrate as much as when I walked around on the top bags.


