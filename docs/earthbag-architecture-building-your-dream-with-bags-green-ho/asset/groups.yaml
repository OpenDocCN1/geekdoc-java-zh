    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_184_0.png)


    I calculated that the appropriate diameter of the dome at the height represented
    by the top of the interior cylinder would be nearly a foot less than the bottom,
    so I caved that much off the rim of the cylinder into the bottom of the trench,
    and started using that soil to fill the first earthbags that I laid at the very
    bottom.


    My intention was to build the dome upwards by consuming all of that cylinder of
    soil eventually. In practice this concept worked quite well. It was easy to place
    the bags up against the inner wall as a guide, and simply shovel soil directly
    into the bags from the center. To keep the soil damp so it would pack well and
    to make the digging easier, I occasionally placed water in a cavity of the the
    cylinder and let it soak down.'
  - '[PAGE 185]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_185_0.png)


    After laying the first course of bags, I stretched a piece of black plastic around
    the outside of the bags and secured it in place with soil packed between it and
    the outside of the trench. But in order to be able to lay the plastic up and over
    the outside of the trench, I needed to slice it into several sections, as shown
    above. This would also allow me to expose only portion of the bag wall that I
    was working on, and it would eventually provide a moisture barrier on the outside
    of the dome.


    I needed some way to enter the dome once it was completed and I thought that a
    simple and effective way to make an entrance would be with a section of a large
    metal culvert. I found a perfect one about four feet in diameter that I salvaged
    for the project.'
  - '[PAGE 186]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_186_0.png)


    After the bags were laid up to three courses, I felt that it was time to set the
    culvert into place. This required some more digging to create enough space. I
    set it at a position where it would support the bags that would be placed above
    it. Then it was just a matter of jamming the bags tightly against it as the wall
    increased.


    Each time I completed placing a course of bags, I was careful to pack soil up
    against it from the outside. As the wall rose, I didn''t want the outward thrust
    of the dome walls to be able to dislodge any bags. This was especially important
    because I had chosen to not use barbed wire between the courses, figuring that
    once the entire dome were buried it couldn''t expand anyway and didn''t need the
    tensile strength of the wire to secure it.


    The further I dug down inside the dome, the more of the wall was exposed, and
    soon there was a step down from the level of the culvert, near the bottom.'
  - '[PAGE 187]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_187_0.png)


    Eventually I needed to use a ladder to carry the dirt up in buckets to pour into
    the bags. And then pretty soon I had used all of the available interior soil and
    needed to start using some that was stacked on the outside. It was exciting to
    be nearing completion of the dome. I was very careful to tamp the soil (mostly
    with my feet) so that the entire structure was solid as it rose. Toward the top
    the bags became more of a continuously spiraling pattern rather than discrete
    courses.'
  - '[PAGE 188]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_188_0.png)


    The final closure created more of a mound above grade than I had hoped, but it
    was all quite firm.


    I carefully set up the thermometer that would record the historic high and low
    temperature experienced inside the dome. In fact, I buried the probe about another
    foot deeper under the floor to have an even more accurate reading. Once that was
    set I proceeded to seal the culvert door with more earthbags so that I could cover
    the entire structure with more soil. I had to use a wheelbarrow to bring this
    additional soil from places nearby that wouldn’t disturb the existing vegetation
    too much.'
  - '[PAGE 189]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_189_0.png)


    I realized that the top of this mound of dirt was quite vulnerable to erosion
    from wind and rain, so in an attempt to protect it, I collected rocks from a nearby
    arroyo and carefully placed them on the peak. This gave the project a distinctly
    decorative or sculptural look that pleased me. I suspect that anyone encountering
    this on our land would think that it was just playful sculpture.


    If we ever decide to develop this property further, this little underground dome
    could be used for storage or as a root cell. In this case the doorway and entrance
    would need to be fixed in such a way that it could easily be entered and kept
    secure.


    This project demonstrates that it is possible to create a potentially habitable
    space with an armful of bags, a sheet of plastic, a piece of culvert and a shovel.'
  - '[PAGE 190]


    <!-- no content -->'
  - '[PAGE 191]


    # Earthbag Building Around the World


    Nobody really knows how much earthbag building has been done around the world.
    The concept has only been promoted over the last few decades, and there is no
    registry of known construction. As the webmaster of www.earthbagbuilding.com and
    a contributing editor of www.naturalbuildingblog.com, I probably have my finger
    on the pulse of this movement as much as anybody. I have been surprised how popular
    it has become over such a short time; I think that this is so for several reasons.
    For one thing, it can be accomplished just about anywhere on the globe where there
    is material to fill the bags with; it is not dependent on nearby forests, fields
    of grain, or other limited resources. And it can be done remarkably cheaply, by
    mainly unskilled workers.


    In this chapter I will briefly profile a selection of earthbag building projects
    from around the world to give you an idea of the amazing diversity of styles and
    innovative ways that people have utilized this technology. These images were mostly
    taken from online sources, with permission for their use where possible. You can
    find out more about most of these above mentioned websites.'
  - '[PAGE 192]


    # # North America


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_192_0.png)


    The bag work on this complex dome home built in Joshua Tree, California for Mark
    Reppert was completed in about three months by a crew of five with occasional
    extra help. It was based on one of Nader Khalili’s plans, and was given a permit
    by San Bernardino County. The bags were filled with 70 percent on-site soil, 22
    percent gravel, and roughly 8 percent cement. The large domes got two rings of
    4 point barbed wire while the others only needed one. Most of the doorways are
    lintels made using the tubes, but with a higher ratio of cement and also 3 thick
    pieces of rebar pounded through the bags. The house is buried in the ground 4
    feet except for an entrance patio. They used Henry’s asphalt emulsion and 6 mil
    plastic liner as waterproofing below grade. The cost came in around $50,000 for
    just the skeleton.'
- md: '

    I helped a friend, Baraka, design this earthbag house for the Colorado climate
    she lived in. She had very specific ideas about the shape and room arrangement,
    but wanted some input as to what was practical with earthbags and how to accomplish
    many details of construction. Like Peaceful Valley, the bags were filled with
    scoria. Often workers had their own ideas about how things should be done, and
    sometimes these ideas prevailed. This resulted in a few wall sections that were
    not completely plumb, and a few other problems. Even so, the house is basically
    very sound of construction and should serve her well into the future.


    A 700-square-foot BLM permitting station in Bluff, Utah has walls ranging from
    15 to 24 inches in thickness that create thermal mass, which produces a soundproof
    and energy-efficient structure. Earthbag buildings are resistant to fire, flood,
    and rot, making them permanent structures that are less expensive to insure. Building
    dirt was sanded with 10 percent clay content. The exterior was sheathed with OSB
    board (secured by plastic fasteners inserted between the bags) and 2-inch foam.
    Traditional cement stucco provided the slightly irregular appearance of an old
    adobe building. Natural earthen plaster detailed with colors from locally harvested
    clay makes the inside of the building just as compatible with the environment
    as the outside of the structure.


    The above 1,000 square foot earthbag home was built on a shoestring budget by
    owner/builder Alison Kennedy in Moab, Utah. It was the first permitted earthbag
    house in Utah. It is a post and beam structure with earthbag in-fill. The foundation
    was poured concrete and conventional concrete block. The bags were filled with
    “reject sand” delivered from a local gravel yard. A concrete block bond beam was
    mortared into place on top of the wall. The exterior walls were first covered
    with earthen plaster then two coats of lime plaster were added for additional
    erosion protection. Alison harvested wild clays, which she made into a paint and
    applied to the surface of the fresh lime plaster.


    The below, left 500 square foot house was designed by the owner, John Capillo,
    and built in Berea, Kentucky. The code officials gave John his permit without
    a hassle. His design has a 16 dome with a larger circle coming off the dome that
    has a wooden roof. The lower part of the structure has thicker walls than the
    upper part to create some buttressing. Dense grade "lime dust" from a quarry a
    couple miles away was used as fill; after the lime cured it became like rock.
    The back side of the house was buried four feet. They used heavy 6 mil plastic
    barrier with a French drain surrounding the structure. For the first few weeks
    7 people worked every day and after that the numbers went down to 2 or 3 people
    a day. This structure took about three months to complete the bag work. The cost
    came in around $15,000.


    The DOME HOME in Baja California, Mexico, is based on Sacred Geometry principles,
    Fibonacci sequences and deep ecology. A high level of aesthetic detail was achieved
    by master builder/designer Rah Rysak. Earthen plasters use nopal cactus, aloe
    vera and wood cellulose; this is a cement and VOC free material zone.


    Earth Lodge 2.0 Emergency Shelter was designed by Eco Friendly Shelters in Washington
    State. The soil used for fill was from the excavation of the site; the wood used
    was salvaged from local forest fires; the earth sheltered roofs protect it from
    blazing sun and cold winter wind; light is from tubular skylights. It cost less
    than $5,000 for this 1,200 sq. ft. shelter.


    This 280 sq. ft. home was mainly built by two women in Ohio for about $10,000.
    It has survived a gale force wind that blew a tree on it, only marring the papercrete
    plaster. They used crushed limestone fines (dust) to 3/4 inch in size for fill.


    The “Canadian Dirtbags” built three round rooms of varying heights with two gable
    roofs that come together at the bedroom. They consider themselves “a couple of
    reformed city kids living out in the middle of nowhere in Alberta, Canada, trying
    to plot out a sustainable life for themselves.”


    This home was owner built by Martin Cubak in Idaho. The first floor is a 22 foot
    diameter earthbag roundhouse. Above that, he made a wood framed bedroom, and has
    plans to expand the house further, with more bedrooms and a greenhouse. He did
    all of this on his days off from work for about $5,000.


    Kent Kaufman’s earthbag cabin in Montana was plastered with earth, water, and
    straw mixed in a portable cement mixer. It was thrown on the walls, making sure
    rows and cracks were well filled in. He finished the entire exterior south wall
    in one day. He put plastic between the wall and the dirt where the cabin is set
    into the side of the hill.

