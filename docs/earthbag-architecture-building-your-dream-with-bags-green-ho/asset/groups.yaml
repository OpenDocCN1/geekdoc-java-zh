  mdcn: '

    这栋位于尼加拉瓜的房屋建造在山坡上，为了通风、视野并减少昆虫。他们很幸运，拥有极好的土壤，这些土壤在润湿并夯实后会非常紧密。地基是由河石和火山岩混合而成的碎石沟。它是一个大约
    12×14 米的椭圆形设计。构造梁和屋顶似乎将整个房子紧密地结合在了一起。第一层灰泥使用了牛粪、粘土、木屑和干草。第二层是45%的粘土、45%的沙和10%的水泥。最后一层是30%粘土、30%沙、30%石灰灰和10%的水泥。


    在计划于贝利兹建造土袋房屋时，Jesse Loving 决定先建一个储藏室。这栋建筑 99.9% 可生物降解。它建造成本低廉、耐用、提供非机械冷却，且美观。建筑与其自然环境融合得很好。没有使用混凝土或石油基产品；仅使用了极量的化石燃料运输材料，用电也极少。


    La Casa de Tierra（大地之屋）是一座位于哥斯达黎南太平洋南岸 Ojochal 的租赁房屋，也称为托尔图加滩（海龟海滩）。土袋内填充了高粘土含量土壤和沙子的混合物。在会呼吸的土墙上添加了土灰泥。


    位于危地马拉的 Somos 儿童村有几栋用土袋建造的漂亮家庭住宅，有需要的家庭在停留期间居住在那里。前两栋房屋由危地马拉建筑师 Cecilia Rodriguez
    设计。它们配有太阳能热水器，并回收了灰水。房屋在寒冷的夜晚保持着舒适的温度，不需要供暖。该村庄为有需要的人提供了安全保障和希望的未来。


    ## 南美


    这处住宅由 José Andrés Vallejo 设计，在哥伦比亚波哥大仅用 5 个月就建成。La Casa Vergara 的设计探索了以 Superadobe（超级土袋）作为建筑技术的抗震潜力以及当代设计。Superadobe
    使用了三种元素：土/混凝土、管状袋和铁丝网。使用这种方法建造的整体结构建筑具有创建有机且灵活空间的能力。


    Gabriel Raia Carneiro 是一位在巴西工作的绿色建筑师、生态设计师和永续农业专家。这处住宅的地基是碎石沟。使用塑料将地基与上方的墙分开，墙内填充了纯土。这个项目利用了
    Superadobe 中曲线呈现的可能性，因为它们表达了感性并提供了强度。


    这栋位于巴塔哥尼亚的房屋由 Paul 和 Konomi Coleman 建造，由填充了土的土袋制成。它具有一个包含浮石的双层墙系统。人们通过手工搬运了 500
    吨土。房屋下方温暖的土壤和周围的草皮墙调节了室内温度。二楼的墙由火山岩制成，这种岩石非常非常轻，有很多空气孔，作为隔热层效果非常好。房屋的设计类似于冰岛的草皮屋。夏天时，墙上覆盖满了花，小屋看起来像一片花花的草甸。


    Hyperadobe 由巴西 EcoOca 的 Fernando Pacheco 开发。Hyperadobe 没有使用实心编织聚丙烯布，而是使用了针织 Raschel
    网布（用于水果包装的相同网眼材料），价格更便宜。浇筑了混凝土基础，并开始铺设 Hyperadobe 层，土壤通常含有 70% 的沙和 30% 的粘土，具有良好的含水量。Raschel
    留了“粗面”状态以接受天然灰泥。由于是垂直墙，层与层之间不需要铁丝网，因为开口网使底层的土壤会与上方的新层融合。


    这所位于秘鲁的社区中心是由 Pisco Sin Fronteras 组织的志愿者团队建造的。由于地下水位高，它建在混凝土垫面上。土袋作业是典型的，有夯实的粘土土、铁丝网和定期的垂直钢筋桩。他们用三根钉子封住袋子。他们使用了,,,带有垂直垂直钢筋。在顶部，他们浇了一层水泥。


    这一个一个，覆盖了石灰抹灰。


    这一个位于 theia 的土袋项目是在 Pedro Ramirez 的指导下建造的。它有四个圆顶，包括一个主卧室、一个大客厅、。


    这栋位于阿根廷科尔多瓦的房屋由 Leo 分阶段建造的。它有一个太阳能加热器。他们组装了用于和和和的，一个屋顶。


    这个位于巴西米纳斯吉拉斯州的州的土袋项目受到了广泛关注，并深受居住者的喜爱。它是一个在…………建造的土袋项目原型，……，是，带一个。


    ## 欧洲


    这个项目在波兰建造，作为廉价建筑技术的演示。它是由 Paulina Wojciechowska 创立的“手与房屋”组织发起的许多项目之一。在瓦片屋顶下方是一个半地下圆顶，带有一个壁炉。


    三天内，20个人建造了一个内径两米的土袋 Superadobe 圆顶，带有一个入口拱顶。这是在 Earth Hands and Houses 举办的一次工作坊期间的。他们使用了大约。这本打算在英国萨塞建造一个地下室。使用了富粘土的土壤来填充袋子。五天后，灰泥小组用土/稻草/粘土对项目进行了抹灰处理。


    Atulya Bingham 建造了这栋土袋圆形房屋，俯瞰土耳其地中海壮丽的奥林匹山谷。它位于半英亩土地上，位于山坡上，经过一条颠簸刺骨的土路，没有自来水，没有电，也没有电话线。她使用从自己土地上挖的土来填充袋子。考虑到未来的扩张，她框架了一个额外的门，并给房屋盖了一个平顶，为她建造二层提供了可能。


    房子覆盖了石灰灰泥。Bingham 选用了一种对我们的地球影响尽可能小的生活，努力自产自用所需。

