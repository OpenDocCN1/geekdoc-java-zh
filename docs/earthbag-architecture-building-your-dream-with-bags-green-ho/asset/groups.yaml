    the conical top of this dome, I set up a tripod of PVC pipe. Buckets of soil were
    either passed or carried out for filling the bags.


    When we noticed that the perfect form of the wall seemed to be distorting a bit,
    I advised that we start mixing some lime with the soil before it was moistened,
    so that the bags would become even firmer.'
  - '[PAGE 164]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_164_0.png)


    I experimented with the concept of creating an arch form by simply bending some
    PVC pipe into an arch shape. This worked to some extent, but was not ideal.'
  - '[PAGE 165]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_165_0.png)


    For an exterior plaster we decided to use a cement-based stucco, which is very
    common in Mexico. Along with the cement, lime and sand, we added a liquid latex
    to make it more impervious to moisture. This was all mixed on the ground by placing
    the liquid in a depression in the middle of the pile, as is customary in Mexico.
    First we applied a rough scratch coat, then we went over it with a troweled finish
    coat. On the inside we used a lime plaster that is more environmentally benign.'
  - '[PAGE 166]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_166_0.png)


    This area of Mexico has a pronounced rainy season, so it was important to keep
    the dome as sealed from water as possible. So along with the moisture resistant
    stucco, we would put a final coating of a special roof paint that is used in Mexico
    for painting flat concrete roofs. This is something which would ideally be renewed
    every few years.'
  - '[PAGE 167]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_167_0.png)


    Once the final bags were placed on top of the dome, we couldn’t resist assembling
    for a group photo.'
  - '[PAGE 168]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_168_0.png)


    We needed to screen the sand for the plaster. A couple of adventurous girls actually
    decided to join us in the work. They had been sitting on the side for several
    days, and we encouraged them to join us.


    In the end I think that this was a very successful project. Many people, young
    and old, got hands-on experience, enough to embark on their own projects in the
    future. I assembled some books about the basics of building with earthbags that
    I left with the school’s library for future students to refer to. And the dome
    itself should remain on the campus for many years to serve as a model and a reminder
    of what can be done.


    Not long after finishing that dome, and after we had moved back to the United
    States, I got a phone call from the founder of a philanthropic organization centered
    in Puerto Vallarta, Mexico, called “Children of the Dump.” He had visited the
    dome while it was under construction and was impressed by earthbag technology.
    He had the idea that earthbags could be'
- md: '

    used to build homes, both for disadvantaged Mexican families and for Americans
    looking for pleasant but inexpensive living accommodations in Puerto Vallarta.
    We had several discussions about the possibilities and I encouraged him to pursue
    the design of a model earthbag home that he had in mind.


    Several months later he called again requesting that I join him in Puerto Vallarta
    to help the actual building of the model home. He was willing to pay my way there
    and support me for several weeks of consulting on site. I felt that, considering
    how many homes could potentially be built based on the model, it would be worth
    my time to do this. So soon I was flying back to Mexico.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_169_0.png)


    I had already done some significant design work making a digital model based on
    the ideas we had discussed, and this is shown above. The concept was that the
    original house would resemble this drawing, but there would be the potential for
    a second story to be added where the roof veranda shows. The buttresses helped
    contain some exterior planter boxes.


    When I arrived the project was already well under way, with most of the walls
    over a yard high. They were filling the rather large bags (mostly recycled flour
    bags from local bakeries) with a natural adobe soil that had been dredged up from
    a nearby canal. The property where the model was being built was part of an equipment
    yard for a large crane company and the house would eventually become the owner’s
    personal dwelling.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_170_0.png)


    The folks working on the project were a combination of volunteers from the dump
    recycling community and construction workers hired by the organization. I was
    able to give them some suggestions for minor improvements on their methodology,
    but basically they were on the right track. Again, many of the men preferred to
    pick up the very heavy bags to set them on the wall. The women contented themselves
    with filling the bags with dirt.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_171_0.png)


    Rather than relying on the earthbags to support the weight of the roof, the workers
    opted to fabricate reinforced concrete pillars at strategic places within the
    structure. This is the method of building that they were familiar with, and I
    could see no reason why it wouldn''t work, and it would help buttress the structure.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_172_0.png)


    For an interior plaster I convinced them to use lime; for the exterior they used
    a conventional cement stucco with some added colorant on the final coat.


    By the time that I was ready to fly home they were almost ready to pour the concrete
    roof in the standard Mexican way.


    ## Recessed Pantry


    Having had the wonderful cool pantry at Peaceful Valley, we missed this facility
    and wanted to manifest another one as soon as we could. So as we designed an addition
    to the manufactured home that we had bought in Colorado after returning from Mexico,
    we included a recessed pantry. It would be adjacent to a large new barn/garage
    attached to the house, so it wouldn''t be as convenient as it was at Peaceful
    Valley, but it would also serve several other functions.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_173_0.png)


    First we had an excavator dig a hole that was about 4 feet deep and slightly bigger
    than the footprint of the pantry. I wanted the pantry itself to be about 6 feet
    underground, but I figured that I could use the sandy soil that was left at the
    bottom of the hole to fill the bags. This meant that I needed to dig a trench
    around the perimeter of the hole that would go down to the actual intended floor
    level for the pantry.


    The next step was to start filling and laying the bags in the trench. As I did
    this I placed a 6 mil black plastic liner next to the outside of the bags. This
    would serve both as a moisture barrier for the pantry and as a convenient way
    to protect the bags from exposure to the sunlight when I wasn’t working on the
    project. As the wall rose I would go around and backfill soil up against the plastic
    and the bags, securing the whole assembly.


    These pantry walls were not actually vertical; I inclined them at a slight angle
    outward, so that their weight would be falling toward the embankment.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_174_0.png)


    This avoided any necessity to buttress the wall on the inside. In fact, I felt
    so confident that these pantry walls would be secure, even with the fine sandy
    soil as fill, I dispensed with using barbed wire between the courses for the most
    part.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_175_0.png)


    With the wall that was adjacent to the garage, I did use barbed wire, as well
    as long rebar stakes to help stabilize it, even with the outward incline. This
    was because with heavy vehicles parking right next to the wall, I realized that
    there could be added pressure against that wall.


    Near one of the corners, I installed an inlet for the pantry, using sections of
    PVC pipe. This pipe would draw water from the roof and enter the tank. An underground
    overflow pipe installed on the water tank inside is directed to a sump so there
    is no worry about too much water going into the tank.


    Since we wanted to be able to enter the pantry at floor level from the barn/garage,
    we took advantage of this to create more storage space. This meant that part of
    the pantry walls would be above ground, and those walls would need to be well
    insulated; bags of sand would not do the job.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_176_0.png)


    Near one of the corners, I installed an exhaust vent for the pantry, using sections
    of PVC pipe. This pipe would draw air from the roof and enter the tank. An underground
    overflow pipe installed on the water tank inside is directed to a sump so there
    is no worry about too much water going into the tank.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_177_0.png)


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_178_0.png)


    Here is a 3-D sketch I made of the plan for the pantry. The large cylinder represents
    the water tank, and you can see the steps spiraling down to it.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_179_0.png)


    I could have switched to filling the bags with scoria at this point, but for the
    above grade walls I decided to try my hand at cordwood construction. I cut the
    cordwood to the same thickness as the earthbag foundation beneath them, about
    15 inches. Cordwood walls have a cavity between the inside and outside masonry
    which is filled with sawdust, so this, and the wood itself, is where the insulation
    comes from. Of course I also insulated the roof of the structure.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_180_0.png)


    So far the concept for this cool pantry has worked well, over a couple of winters.
    There has been no freezing within the space, although it has come close at times.
    For security I installed a small electric heater on a thermostat that would turn
    it on if it got below 34 degrees F. and shut it back off at a few degrees warmer.
    This is at about 8000 feet elevation in Colorado which has rather harsh winters.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_181_0.png)


    Here you can see how the finished pantry appears, with the water catchment system
    from the roof of the garage/barn installed. The large turquoise pipe is designed
    to collect the first water off the roof that might be contaminated before it would
    enter the overflow to the tank. After each rainstorm, the dirty water is drained
    so that the system is set for the next storm.

