  - '[PAGE 224]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_224_0.png)


    Small Earth, with the assistance of the Hounslow Heath School, created this Earth
    Creature at the Southbank’s Hayward Gallery in England. It is designed for outdoor
    learning. The long fabric tubes were filled with adobe soil and cement or lime.'
  - '[PAGE 225]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_225_0.png)


    This school, located under the flight path of one of Heathrow’s runways, found
    an excellent way to mitigate the noise for children at play: they built a domed
    Superadobe structure that allows the kids to duck under when the noise is too
    intrusive. The domes have no doors but even so they cut the noise considerably.'
  - '[PAGE 226]


    # Africa


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_226_0.png)


    A team of two architects and eight professors, under the direction of Akio Inoue
    of Tenri University in Japan, implemented the construction of an ecovillage by
    Lake Victoria, Uganda, East Africa. This ecovillage was designed to alleviate
    poverty and demonstrate sustainable building with earthbags. It is composed of
    three clusters of buildings, including a water tower at the center. Each cluster
    is composed of four living units, each one with a living room, two bedrooms, a
    kitchen, toilet, shower room, and meditation room. Each unit has a biomass latrine
    and a wind power generator that supplies electricity. It was plastered with a
    cement stucco.'
  - '[PAGE 227]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_227_0.png)


    Eternally Solar of South Africa has pioneered a novel approach to earthbag building.
    Long bags are sewn into three compartments, with the outer two being filled with
    adobe or sand, and the central channel either left as a void or filled with rebar
    and concrete for lintels or bond beams. This house features: solar water heating,
    integral grey water system, solar lighting system, recycled cellulose ceiling
    insulation and a permaculture garden irrigated with grey water.'
  - '[PAGE 228]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_228_0.png)


    Another unique earthbag building technology developed in South Africa consists
    of three elements: a framework of Eco-Beams (timber and beams that form the framework
    for the sandbag walls); specially formulated fabric bags, filled with sand and
    stacked between the beams; and, finally, the cladding of the beams with wire mesh
    and either plaster, timber or plasterboard. The completed structure is waterproof,
    fireproof and soundproof.'
  - '[PAGE 229]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_229_0.png)


    Brandon Rogers’ earthbag project is located in Ghana. This is a guest house with
    one bedroom, a main space for the living/dining/kitchen areas and a multi-purpose
    room which will act as studio. The walls are 20 inches thick so they can resist
    the elements. Rogers and his crew cast floor slabs and began the process of filling,
    sewing, tamping, and hauling the polypropylene sacks into place. The bulk of the
    walls went up very quickly over approximately a three-week period. The exterior
    was plastered with a cement finish to minimize maintenance and then detailed with
    stone.'
  - '[PAGE 230]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_230_0.png)


    In Kitgum town, Uganda, Far Reaching Ministries built homes for employees, fellow
    laborers and staff with earthbags. Pictured is the first hut that they built,
    based on traditional architecture. The construction of these earthbag homes has
    also turned into a huge opportunity to share their faith and the earthbag technique
    of building as people gather to see what they did. Ultimately, they have reached
    out to house many orphans from the community.'
  - '[PAGE 231]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_231_0.png)


    The NextAid organization, with the assistance of Joe Kennedy, created a child
    support center outside of Johannesburg, South Africa. This center, for a group
    Youth With a Vision helps serve the millions of orphans of the HIV/AIDS crisis
    in Africa. They used local materials such as earth to minimize costs and make
    the building systems available to the local community. Pictured is the administrative
    office for the compound.'
  - '[PAGE 232]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_232_0.png)


    This project was produced and lead by Scott Howard of Earthen Hand. It was the
    first earthbag dome in Mali and Serves as a library for many villages in the area,
    The project employed several local people during construction. A two week-long
    workshop completed the majority of the structure. It is a catenary arc, reaching
    nearly 17 feet in height, and has a loft.'
  - '[PAGE 233]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_233_0.png)


    With the help of the NGO Aid Global, nineteen students from the Bergen School
    of Architecture in Norway built a school building in a Mozambique village using
    mostly earthbags. The building consists of an enclosed room for computers and
    an open room for English lessons. A reinforced concrete frame was filled with
    earthbags, and glass bottles were embedded in one wall. The corrugated iron roof
    is supported over a wooden framework for ventilation.'
  - '[PAGE 234]


    # The East


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_234_0.png)


    This versatile earthbag structure was built by Owen Geiger in Thailand. It is
    8 feet in diameter inside and approximately 8 feet high. Plans could be scaled
    up to create 10- to 16-foot diameter domes. He estimated that the cost was about
    $300. The first two courses of bags were circles bonded with barbed wire. Succeeding
    courses start at either side of the door opening. He used old tires to form the
    door arch. It was covered with sheet plastic and then backfilled with soil and
    planted with grass.'
  - '[PAGE 235]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_235_0.png)


    Also in Thailand, the construction of this Om Dome was overseen by Scott Howard
    of Earthen Hand and Trevor Litle. It is a spiritual temple for the Pyramid Yoga
    Center. It measures 27 feet outer diameter and 27 feet in height. The fill material
    was mainly adobe soil. the the exterior plaster was cement-based stucco.'
  - '[PAGE 236]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_236_0.png)


    The Tenri University International Cooperation Project sent a group of students,
    with Akio Inoue as the project leader, to a village near Jamnagar, India. Local
    workers and students were also engaged in the construction. Pictured are three
    earthbag domes used for a library at an elementary school. These structures measure
    about 3 meters in diameter and 4 meters high. The domes were plastered with stucco.'
  - '[PAGE 237]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_237_0.png)


    A charity created this eco-village, called the Pegasus Children’s Project, to
    accommodate 80 children, 10 staff, and a small school near Kathmandu, Nepal. Architect
    Nader Kahlili worked with them to build over 40 Superadobe domes. The tubing was
    filled with 10 parts soil to 1 part cement for added longevity. The domes were
    then plastered inside and out with with stucco and painted with linseed oil and
    milk. The series of earthquakes that leveled many regions of Nepal in the Spring
    of 2015 spared these domes, while most other houses in that village collapsed.'
  - '[PAGE 238]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_238_0.png)


    This “cave,” in Koh Phangan, Thailand, artfully combines granite, wood and earth.
    It is divided into three rooms on three levels, topped by a loft. The earthbag
    walls fill gaps between large boulders and the double roof structure is elliptic
    in shape. The earthbags were filled with a mix of two different soils (one rich
    in clay and the other sandy in nature). Roughly 25 tons of dirt went into bags
    in order to form both exterior and interior dividing walls. They used cheap cement
    well casings for windows. The roof was covered with palm thatch with a life expectancy
    of 4-6 years.'
  - "[PAGE 239]\n\n![](img/4f93d33c635578ee6b6ef918bb8ad9d6_239_0.png)\n\n“Ark Soaring\
    \ in the Sky” is a school for orphans in Thailand designed by\nKikuma Watanabe,\
