    Small Earth 在 Hounslow Heath School 的协助下，在英国的萨斯班克海沃德美术馆创作了这个“地球生物”。它是为户外学习而设计的。长条织物管内填充了生土、水泥或石灰。


    这所学校位于希斯罗机场一条跑道的飞径下方，他们找到了一种缓解儿童玩耍噪音的极佳方法：他们建造了一个圆顶的超级土袋（Superadobe）结构，让孩子们在噪音过大时可以躲进去。这些圆顶没有门，但有效地减少了噪音。


    ## 非洲


    一个由两位建筑师和八位教授组成的团队，在日本天理大学井上昭（Akio Inoue）的指导下，在东非乌干达维多利亚湖边实施了生态村的建设。这个生态村旨在缓解贫困，并展示土袋的可持续建筑技术。它由三个建筑群组成，中心有一个水塔。每个群由四个居住单元组成，每个单元都有一个客厅、两个卧室、一个厨房、一个厕所、淋浴间和一个冥想室。每个单元都配有生物质厕和一个供电的风力发电机。建筑表面涂有水泥抹灰。


    南非的 Eternally Solar 公司开创了一种新颖的土袋建筑方法。长被缝成三个隔间，外两个隔间填充生土或沙子，中间通道则留空，，或填充钢筋和混凝土作为过梁或连接梁。这栋房屋特色在于：太阳能热水器、集成灰水系统、太阳能照明系统、再生纤维天花板隔热层以及一个用灰水灌溉的永续农业花园。


    在南非开发的另一种独特土袋建筑技术由三个元素组成：生态梁（Eco-Beams）框架（形成土袋墙框架的木材和梁）；特种配制的织物袋，填充沙子并堆叠在梁之间；以及最后用铁丝网和抹灰、木材或石膏板对梁进行包层。完成的结构防水、防火且隔音。


    Brandon Rogers 的土袋项目位于加纳。这是一间带有一个卧室的客栈，一个作为生活/用餐/厨房区域的主空间，以及一个作为工作室的多功能房间。墙厚达
    20 英寸，能够抵御天气变化。Rogers 和他的团队浇筑了楼板，并开始了填充、缝合、夯实和将聚丙烯袋移到位的过程。大部分墙体在大约三周内飞快建成。外部涂有水泥饰面以减少维护，并用石头进行了细节处理。


    在乌干达的基图姆镇，Far Reaching Ministries 使用土袋为员工、工人和工作人员人员建造了房屋。照片中是他们根据传统建筑建造的第一座茅草屋。这些土袋房屋的建造也变成了一个分享他们信仰和土袋建筑技术的绝佳机会，因为人们聚在一起观看他们的成果。最终，他们为社区的许多孤儿提供了家园。


    NextAid 组织在 Joe Kennedy 的协助下，在南非约翰内斯堡郊外创建了一个儿童支持中心。该中心为“有愿景的青年”小组服务，帮助应对非洲艾滋病毒危机中数百万的孤儿。他们使用了土壤等当地材料来降低成本，并让当地社区能够使用这些建筑系统。照片中是建筑群的行政办公室。


    该项目由 Earthen Hand 的 Scott Howard 制作并领导。它是马里第一个个土袋圆顶，作为该地区许多村庄的图书馆。项目在建设期间聘用了几名当地人。一个为期两周的工作坊完成了大部分结构。它是一个悬线圆弧，高度接近
    17 英尺，并有一个阁楼。

