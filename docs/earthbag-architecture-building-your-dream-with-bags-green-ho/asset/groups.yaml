  - '[PAGE 24]


    wall. These tubes can be cut as long as needed to complete a particular wall section,
    slid onto a rigid filling tube or funnel, and then filled in place. It takes several
    people to accomplish this efficiently, but the result can be very aesthetically
    satisfying, strong, and quickly done.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_24_0.png)


    The tubing material can be purchased (usually directly from a factory) as huge
    rolls, up to 6000 feet long. For some reason, there generally is no advantage
    economically in buying the large rolls over purchasing the individual bags, despite
    the obvious increase of manufacturing time and materials that goes into making
    the bags.'
  - '[PAGE 25]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_25_0.png)


    A recent innovation with bag material is the use of open mesh bags of the sort
    that is commonly used to package fruit. This mesh can also be purchased in long
    rolls and used in a similar manner to the tubes of polypropylene. This technique
    was introduced by Fernando Pacheco, a Brazilian engineer, and he calls it “Hyperadobe.”
    The mesh bags are often a raschel weave and the fiber is either polypropylene
    or other synthetics.


    Hyperadobe takes Superadobe to a whole new level with many distinct advantages.
    The net bagging is generally cheaper than the woven poly material; the fill will
    dry out and cure faster; there may be no need for barbed wire in vertical wall
    designs; it creates a more monolithic structure due to direct bonding between
    courses; it is easier to gather the tubing on a canister for filling; there is
    better adhesion of plaster; the mesh provides an automatic plaster mesh reinforcement.
    The only disadvantage that I is that it wouldn’t work with loose fill materials
    because of spillage.'
  - '[PAGE 26]


    # Fill Material


    The most common thermal mass fill material is a mix of sand and clay that approaches
    that used in other earthen wall systems, such as adobe, cob and rammed earth,
    where about 30% clay and 70% sand mix is ideal. Since since soil is encased in
    a strong bag, the exact formulation for this soil mix can have much more variability
    when used for earthbags. The objective is to have that that does not shift around
    once it is moistened, tamped into place, and dried. Virtually any soil can be
    used in earthbags, but it is best to avoid heavy clays or fine, slippery sand.
    As you remove most of the larger rocks and organic debris, you should be fine.
    This means that it is often possible to use the earth beneath your feet at the
    site of building. What could be more sustainable than this?


    How the bags will be used in a wall may determine what the best fill material
    is. Vertical walls are generally more forgiving than domes, which really need
    to be built with solid blocks of material. A dome created with shape-shifting
    fill could become unstable and collapse, unless it has proper reinforcing.


    Another determining factor for choice of fill material is exposure to possible
    moisture issues, like underground situations or domes built in wet climates.


    If there is not enough clay to bind the soil, it is possible to stabilize it with
    either Portland cement or builder''s lime. About 10% of these stabilizers could
    be enough, but it is best to run some tests with your soil to determine this.
    With domes, especially in climates where excess moisture could be an issue, it
    is advisable to stabilize the soil with cement to assure that the fill will never
    become soft enough to deform. We advise folks to avoid making domes in rainy climates,
    or at least to provide an additional, separate roof over the dome to shed water
    away from it.


    Other, more insulating fill materials that have been used successfully include
    pumice and scoria (which are both lightweight volcanic stone), perlite, and even
    rice hulls. One could experiment with recycling Styrofoam (EPS foam) or crushed
    plastic bottles as fill also. Of course, you'
  - '[PAGE 27]


    would have to take into account the possible compressibility of these materials
    when designing the wall.


    A special case for appropriate fill material is at the foundation or first course
    or two at the base of a wall. Here you want the wall to absolutely not deteriorate
    in moist conditions, nor do you want the wall to wick moisture upward into the
    level with loose gravel. So we generally advise folks to fill the bags at this
    level with loose material. And because it is essential that such loose material
    never escapes, we advise the use of two bags (one placed inside the other) for
    double assurance it will be secure. A good stabilized plaster is essential to
    protect these bags.'
  - '[PAGE 28]


    # Foundations


    Earthbags themselves make good foundations, and have been used that way for many
    other building systems, such as for straw bale, cordwood, cob, etc. In this case,
    the bags are built up to the proper height for a stem wall that keeps the rest
    of the wall at least a foot above grade, well above snow level or possible back
    splash from hitting the ground.


    All foundation systems must take into account the possibility of the underlying
    soil heaving with freezing weather or from expanding with moisture, as do heavy,
    expanding clays. The common way to avoid these problems is to dig down to a level
    that is below the frost depth for that region, or below any layers of heavy clay
    soil.


    Prescriptive building codes often require continuous concrete foundations that
    comply with specific conditions and measurements. Such a foundation can be used
    with earthbag construction, as long as the top of the concrete foundation is wide
    enough to accommodate the full width of the earthbags when compacted on top. In
    this case it would likely be a good idea to place a moisture barrier on top of
    the foundation wall, or start with a course of gravel-filled bags, to avoid the
    concrete from wicking moisture into the wall above.'
  - '[PAGE 29]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_29_0.png)


    Better using a massive reinforced concrete foundation would be to employ a simple
    rubble trench foundation. These foundations were embraced by the famous architect,
    Frank Lloyd Wright. The idea is to dig a trench, at least as wide as the bags
    and plaster, down deep enough to get below the frost level. This trench is then
    filled with cobble stones, possibly graded so that the smaller aggregate is toward
    the top of the trench. This keeps the foundation stable from soil heating provides
    lots of spaces between the stones for moisture to accumulate and eventually drain.
    As seen in the above photo, the top of the rubble trench can be recessed some
    below grade, with the first course of gravel-filled bags placed so that they will
    provide a “toe” into the soil.


    If the soil surrounding the trench does not drain enough, then what is know as
    a French drain can be installed. This is a 3 - 4 inch drain pipe (usually plastic
    these days) that has been perforated so that water can seep into it from above
    and the sides. The pipe is laid toward the bottom of the'
  - '[PAGE 30]


    trench and inclined slightly so that water will run to either a “daylight” location
    on the property or to an underground sump or drain field. This will allow any
    excess water to flow away from the foundation.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_30_0.png)


    In the above photo the rubble trench is fairly shallow and no French drain is
    provided because the soil is pure sand that drains exceedingly well, making upheaval
    highly unlikely. The wire mesh visible in the photo was an attempt to keep the
    cobbles contained from migrating into the sand, and would not be needed in most
    applications.


    There is no specific need to place a concrete cap on top of a rubble trench, but
    this could be done if the code requires it, or if the cobble stones used in the
    trench are fairly large and don’t provide a good enough surface to lay the first
    course of bags on.


    Additionally, the soil surrounding the base of the foundation wall should be graded
    so that it slopes away from the structure, keeping surface water from collecting
    near the foundation.'
- md: '

    [content]

    Another ecological foundation for earthbags could be carefully mortared stones
    built up on the rubble trench. This could be done for aesthetic reasons, or as
    a way to keep from needing to use gravel-filled bags. As with a concrete foundation,
    it would be prudent to place a moisture barrier between the mortared stones and
    the first course of bags.


    ## Filling and Laying the Bags


    Various simple ways have been used to make it easier to fill the bags. One common
    way is to cut the bottom out of a 5 gallon plastic bucket and use the top part
    as a funnel that holds the bag open. We have used a slightly tapered metal cylinder
    that is part of a commercial chicken feeder for the same purpose. I have seen
    stands made of metal that will hold an entire bag up and allow the fill to be
    shoved in. No matter how you do it, it helps to have a way of keeping the top
    of the bag open while filling it. With the long continuous tubing material, it
    is essential to have some kind of a chute to collect the loose fabric on that
    allows the fill to be placed toward the end, and then more tubing can be released
    from the chute as needed.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_32_0.png)


    Unless you are working with lightweight fill material, I would advise you to fill
    the bags in place on the wall being built. This way you just need to carry smaller
    buckets or shovel of material and save your back. A full bag of soil can easily
    weigh over 100 pounds, making the job of carrying or lifting arduous.


    Since the bottom of the bag has been sewn closed, it is best to place the bottom
    toward any opening in the wall to assure that nothing will tend to spill out.
    The simplest way to close the top of the bag is to leave enough space at the top
    to be able to fold the bag so that it will be compressed against the previously
    laid bag; about 8 to 10 inches is sufficient to do this. This wastes some potential
    length of the bag for filling, so you might prefer to physically close the bag
    at the top. If that seam will be pushed up against another bag, a simple way to
    close it is to fasten it with nails, wire or cord staples.


    Using the full length of the bag has the advantage that the longer bags will have
    space to overlap each other when laid in the preferred running bond pattern that
    is typical in laying brick walls. This makes for a more stable wall, and of course
    ultimately uses fewer bags to construct the wall.


    In some circumstances, both ends of the bag might be exposed and need to be securely
    closed. I have done this by actually heming the top and sewing it with heavy thread,
    using very wide stitches. Another method that may be faster, is to use metal wire
    that is stiff enough to simply jab it through the hemmed seam in several places
    and fold over the end of the wire to secure it.


    Before closing the bag the fill at the top can be tapered that it will conform
    to any angle formed by the arc of a small diameter circle to make a closer fit
    between two adjacent bags. Also it helps to push a bit on both sides of the bag
    at the top so that it is easier to fold or fasten the bag material. This all becomes
    second nature once you get into the swing of the work pattern.


    When filling bag in place on the wall, I usually place the bottom of the bag about
    where it will eventually be, so that once it is full and secured at the top, it
    can be simply pushed over to align it with the previously laid bag. This way there
    is no need to lift that heavy bag at all. A bit of pushing with your hands or
    feet will snug the bags into place so they can be tamped later.


    ## Tamping the Bags


    To consolidate the fill material and flatten the bags in place they need to be
    tamped soon after being laid. I usually wait until I have laid several, or even
    a whole course of bags, before doing this, since once you are there tamping it
    is easier to do a whole section at once.


    Stomping on the bags with your feet can do some tamping, but it is much more efficient
    and thorough to use a special tamping device. These can be purchased in some hardware
    stores, or fabricated in various ways.


    My favorite tamper is home made, with a metal pipe handle welded to a scrap piece
    of heavy steel. The weight of this tool is an advantage, because it adds to the
    downward tamping thrust; it is a bit heavier to lift, but I find it takes less
    effort than always putting force into the downward thrust. The tamping blade is
    about as wide as a standard bag, so each tamping action will do maybe 25% of the
    bag. The commercial tampers usually aren’t as wide so they need to be moved around
    more to do the job.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_36_0.png)


    Another approach to making your own tamper is to embed a long handle in a large
    can of wet cement and let it cure, creating a heavy circular tamper. I have never
    used one of these, but I think they may not do as good as a job because they tend
    to make small circular indentations that would not be as uniformly flat, and definitely
    would take more tampering per bag to do a good job.


    Some people like to also tap the sides of the bag to make the wall flatter, which
    takes less plaster to cover. I haven’t done this because I kind of like the deeper
    crevices between the bags to help key in the plaster. It is partly an aesthetic
    thing, depending on whether you like smoother walls or


    ## Barbed Wire


    In most circumstances it is best to place barbed wire between each course of earthbags,
    ideally two strands of wire placed parallel to each other. There are several reasons
    for doing this. First of all, the barbs on the wire tend to catch into the fabric
    of the bags, essentially stitching the two together into a monolithic structure.
    The other main reason is that the wire provides tensile strength that the bag
    would lack. This is especially important for dome structures, because they exert
    outward pressure on the bags.


    In general, the barbed wire holds everything into a uniform matrix that resists
    the bags from dislodging.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_38_0.png)


    Barbed wire is nasty stuff to work with. It has a mind of its own and can gouge
    your hands easily. I always use heavy leather gloves when working with it. It
    helps to unwind enough wire from the spool to fit the desired place in advance,
    and then carefully bend it into more or less straight line before placing it on
    the wall. Then, as shown in the photo, you can use stones, bricks, or other heavy
    objects to keep it where it should be on the course of bags. This should be done
    for the entire section of wall before going to lay more bags on top of it.


    To make it easier to position each bag perfectly into place, a metal “slider”
    can be very handy. This is a piece of sheet metal cut to approximately the size
    of a bag, with a 90 degree grip handle on one end. The idea is to put this slider
    over the barbed wire in the area where the next bag is to be placed. Then, once
    the bag has been filled and laid down into its intended location, you can hold
    the bag in place with one hand and yank on the metal slider to remove it and allow
    the bag to drop into place. Otherwise, the bag will inevitably fall a little off
    from where it needs to be and then be stuck on the barbed wire and impossible
    to move without picking it up, which is a real nuisance.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_39_0.png)


    The times I have dispensed with placing barbed wire between the bags is when I
    believe that the laws of gravity will prevail and keep a wall from pulling apart.
    An example of this is with an underground pantry that I made with outwardly inclined
    walls below grade. I figured that gravity was going to keep those walls inclined
    no matter what. Another example is a small underground dome where the inward pressure
    of the surrounding soil would counteract the outward pressure of the dome itself,
    and the whole thing would be kept together by compression.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_40_0.png)

    [/content]

