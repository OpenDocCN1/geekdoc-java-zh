    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_240_0.png)


    Engineering Ministries International conducted a construction training workshop
    in Thailand near the Burma border for earthbag building and a thin shell latex
    concrete roof system called the HyPar. The building created was for the Free Burma
    Rangers, who needed a medical facility.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_241_0.png)


    The Edge of Seven and Small World Nepal built a two-room secondary school in the
    village of Phuleli, Nepal, which is deep in the Himalayas, with no roads or airports
    within an eight-hour hike. Any material that is not available on site must be
    carried in. A stone and cement foundation and floor was laid. The first two courses
    of airbags were filled with small gravel broken by hammer from larger stones excavated
    on site. The remaining bags were filled with sifted excavated adobe soil. Cement
    plaster was used with chicken wire mesh lathe, later whitewashed. The series of
    earthquakes that leveled many regions of Nepal in the Spring of 2015 spared this
    school, while most other houses in that village collapsed.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_242_0.png)


    Another one of Kikuma Watanabe’s designs is this community center for the Al-Jawasreh
    Society in Jordan. It is a public facility where educational and vocational programs
    are provided. It has three architectural components: Jordan’s traditional stone
    building, modern reinforced concrete, and earthbag building which draws attention
    as ecological architecture. A passive solar system makes a comfortable environment
    inside the building.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_242_1.png)


    Folks in the Gaza strip, who have been denied many building materials, have taken
    to building with earthbags. They have connected many structures that have a square,
    vertical walled base, which then tapers upward to form a domed roof. This allows
    the maximum use of space in a series of connected domes.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_243_0.png)


    After devastating earthquakes and floods in Pakistan various projects have focused
    on earthbag construction, including this 20 X 12 foot structure. There is a buttress
    on the back wall. It was built on a rubble trench, then they filled the first
    two rows of bags with 6% cement and the rest sand and clay. After reaching the
    height of 18 inches, they reduced the amount of cement to 3%. The height of the
    house reaches about 9 feet. This house took 17 days to build, and they planned
    to build up to 500 houses.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_244_0.png)


    Maggi McKerron of Chiang Dao, Thailand, has been experimenting with building roundhouses
    for guests using bags filled with rice hulls. These have much of the same insulating
    properties as strawbales, but the rice hulls do not absorb moisture, so this makes
    for an ideal building material for monsoon areas. Rice hulls are generally discarded
    and they are very difficult to burn (another plus for using them as walls). They
    are very cheap or even free. Another wonderful factor is that they are light;
    you can carry a few bags at a time. But of course they are not load bearing. In
    order to use them you need to make a framework that will hold up your roof, doors,
    windows, etc. She used mostly bamboo and some reinforced steel bars all tied together
    with wire for a frame.


    # Islands


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_245_0.png)


    The Konbit Shelter organization designed and built this house in Haiti for Monique
    and her two young girls. The interior diameter of the main space is 18.5 feet,
    with scalloped partial circles that extend to a 22.5 ft. interior diameter. They
    completed four courses a day, filling the tubes with cement-stabilized earth,
    and got to the finished height of 20 feet in nine days. Much of the labor was
    contributed by Haitians.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_246_0.png)


    One of the first earthbag houses built in Haiti was the “Sun House” on the campus
    of a Catholic orphanage run by Father Marc Boisvertt. They used recycled bags,
    local clay and sand from a nearby creek bed. River rocks and mortar were used
    for the foundation, and a concrete pad was poured for the floor. They sewed the
    bags closed in order to use fewer bags and made heavy metal tampers. A concrete
    bond beam secured the top of the walls and the roof. The finish is painted stucco.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_247_0.png)


    This is a Shinto Shrine in Niigata, Japan, designed by Kikuma Watanabe. It was
    built on a vacant lot. The structure is earthbags.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_248_0.png)


    The Children of Hope School in Leogane, Haiti, under the direction of Matt Gunn,
    was built on a rubble trench, then they filled the first two rows of bags with
    6% cement and the rest sand and clay. After reaching the height of 18 inches,
    they reduced the amount of cement to 3%. The height of the house reaches about
    9 feet. This house took 17 days to build, and they planned to build up to 500
    houses.


