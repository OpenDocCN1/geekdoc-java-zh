    \ was designed with two architectural\ncomponents: the earthbag building and a\
    \ light steel building with a bamboo\nand grass roof. The earthbag building is\
    \ set on the ground floor and the steel\nbuilding is for the upper floor. Three\
    \ earthbag domes stand on the ground\n help support the upper steel part."
