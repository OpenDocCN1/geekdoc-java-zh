    or covered it with gravel.'
  - '[PAGE 150]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_150_0.png)


    This pond became one of our favorite places to spend meditative time. It wasn''t
    long before frogs and water loving insect found it. We stocked it with some tiny
    goldfish that grew and reproduced. All was serene until one day we had a deluge
    of rain that came down so hard and fast that several local streets were nearly
    washed away. That same brief storm brought so much sand and silt down the arroyo
    that it overwhelmed the little catch basin we had created to deal with it, and
    completely filled the entire pond so there was no water left there. The fish were
    gone, washed further downstream and likely never survived. What a pity... but
    at least we enjoyed it for those few years before the calamity. And the earthbag
    dam actually held firmly!'
  - '[PAGE 151]


    # Carriage House


    One thing that Peaceful Valley lacked a good workshop/garage and additional storage
    space. When we acquired a small RV after selling the bus, we needed a place to
    store it away from the weather; we needed a carriage house.


    After Ponding our options for awhile, we decided to order a pre-manufactured steel
    vault, similar to the old Quonset huts that were popular after the war. We found
    one deal online that we couldn''t refuse: a new 16'' X 30'' unit, complete with
    all bolts and parts (but not the end panels) delivered for about $2,000. My concept
    was that this could be raised on an earthbag stem wall so that it could also have
    a second story for a small separate office and more storage space. Furthermore,
    I figured that we could line the outside of the structure with bags of scoria
    and it would be as well insulated as the house.


    About this time, a friend who had begun construction of a couple of earthbag domes
    on his nearby land decided to sell the property. Would buyers wanted the earthbag
    projects removed, so I offered to help to do this in exchange for the bags of
    scoria. It took a few days of work, but by the time I was done I had a stack of
    usable bags of scoria sufficient to do the entire carriage house project... all
    for free.'
  - '[PAGE 152]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_152_0.png)


    As an aside, during the demolition of one of the domes I decided to conduct an
    experiment to see how much soil I could remove from under one section of the wall
    before it would begin to collapse. To my amazement, as the above photo shows,
    I had almost entirely removed everything but a small pedestal before it began
    to separate. The wall was enclosed in wire mesh reinforced stucco which held it
    all together.'
  - '[PAGE 153]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_153_0.png)


    The stem wall for the Carriage House was two bags thick, with a wooden plate attached
    to the top to connect the steel sections to.'
  - '[PAGE 154]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_154_0.png)


    Once the steel vault was all bolted into shape and resting on the stem wall, I
    bolted 2" X 10" wood joists across for the second story floor. These joists served
    a dual function of also tying the vault so that it couldn''t expand with the additional
    weight of all the bags of scoria on top.


    I placed the bags of scoria down into the troughs of each rib, working alternately
    on both sides to keep the forces balanced as I went up. Then I plastered it with
    papercrete (later cement stucco was added). This insulation was good enough that,
    even on very hot days, I could touch the metal inside and it would feel cool.


    I built the end walls with recycled materials. The floor was fiber reinforced
    concrete. The total cost of this 900 square foot building was about $5,000!'
  - '[PAGE 155]


    # The Glorieta


    A local spiritual group asked me if I could help them conduct a workshop that
    would provide some interest and exercise for participants of a week long international
    conference. Much of what the attendees would be doing was fairly sedentary, so
    I came up with a concept of having people build a kind of airbag monument on the
    property belonging to the group. We discussed various possible locations and architectural
    designs and eventually settled on a site where a natural hillside could be terraced
    in such a way to create seating for a kind of amphitheater. The stage for the
    amphitheater would also be a relaxing shade structure, a kind of focal point for
    folks to congregate or meditate. A gazebo or shade structure of this sort is known
    in Spanish as a “Gloreta,” so that is what we decided to call it.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_155_0.png)


    The sand used to fill the bags was dug out from the hillside while forming the
    terraces of the amphitheater, and the benches along the terraces were'
- md: '

    also formed with bags of sand. We did place barbed wire between the courses, but
    made no attempt to stabilized the sand. I felt that with the vertical walls this
    would be plenty stable... and it has stood the test of time.


    Having so many helping hands made fast work of erecting the Glorietta, which was
    a perfectly round structure with benches built into both sides. Some large descending
    buttresses opened outward from the stage area in a welcoming fashion.


    We assigned various tasks to the volunteers, so that some dug sand from the hillside,
    while others transported it via wheelbarrows to the Glorietta. The sand was passed
    by buckets to those working on the wall which filled and placed the bags, then
    someone came along with the tamper. Another team measured, cut and placed barbed
    wire in preparation for the next course of bags.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_156_0.png)


    By the end of the workshop we had all of the bags stacked and some of the lime/cement/sand
    plaster over them, using chicken wire for mesh. We didn’t have time to put up
    the rafters for the shaded roof (which was to be fabricated by weaving small branches
    around the rafters, like weaving a basket, so I installed the poles later. We
    also later hired a professional stucco crew to finish the plastering.


    This experience was the high point of the conference for them. They left with
    a greater understanding of the possibilities of earthbag building, and a greater
    appreciation for truly sustainable architecture. After all, we had created an
    enduring functional and aesthetically pleasing structure, using little more than
    the soil dug at the site and some poles scavenged as dead standing trees along
    the nearby watercourse.


    # Mexican Dome & Model Home


    During the time that we lived in Mexico in a small village near Lake Chapala and
    Guadalajara I became involved with a local Green Group that was promoting sustainable
    living practices. I made a few presentations about green building, including with
    earthbags, and this piqued the interest of many folks. One of the coordinators
    asked me if there might be some sort of practical example of earthbag building
    that could be done to demonstrate its viability and train some of the locals in
    the technique. I thought about the possibility and eventually queried a local
    priest who ran a Catholic boarding school if he would be interested in hosting
    an earthbag project on the campus of the school. He found the idea intriguing
    and suggested that I make a presentation to the student body to see if there were
    sufficient interest.


    On the day of the presentation I was a little nervous because my grasp of the
    Spanish language is limited, but I was able to make myself understood with the
    help of some large photographs that illustrated my commentary. The teachers and
    students present all seemed quite interested, and when I asked for a show of hands
    of how many might participate in working on a project, over half of the hands
    were raised, including many of the young girls.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_159_0.png)


    With this encouragement, I went ahead and made arrangements to begin construction
    of a small dome, similar to Riceland, on the school property. We set aside a few
    hours on every Saturday morning, when the normal classes were not in session,
    to embark on this project. Besides the students, I invited members of the Green
    Group to join us, so it would be a multicultural and mixed age affair. We never
    knew who would show up on a given Saturday, but there were often as many as a
    dozen assorted volunteers.


    I especially wanted to engage the students at this school because most of them
    were ethnic native Mexicans who came from small, poor villages where such inexpensive
    and durable buildings might well be appreciated.


    As it turned out, despite the interest shown by some of the girls, the student
    volunteers were almost entirely male, which I am sure was a cultural bias for
    appropriate gender activity.


    We dug a rubble trench foundation, and then filled the first few course of bags
    with gravel to keep water from wicking upward.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_160_0.png)


    Welded steel doors are commonly used in Mexico, so I had one fabricated that had
    several long metal rods protruding from the sides of the frame that could be embedded
    in the earthbag as it rose.


    I tried to encourage the kids to fill the bags in place, so they wouldn’t have
    to lift the heavy bags. I even had metal sliders to make it easier to position
    the bags perfectly over the barbed wire. But several of the young boys liked to
    demonstrate their strength by filling the bags on the ground and then lifting
    them into place on the wall. Machismo is alive and well in Mexico!


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_161_0.png)


    Most of the bags were filled with a kind of road base that we had dumped there
    to make the job easier than trying to dig our own soil on the site. Also, I thought
    it would pack well enough with just a bit of moistening.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_162_0.png)


    The boy in the center of the dome used a long piece of bamboo to make sure that
    the curvature was correct as the wall rose. Some of the kids enjoyed being up
    on the wall to use the special tamper we had made.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_163_0.png)


    As with Riceland, we created a small loft to help stabilize the structure and
    use as a platform for continuing the work of building the wall. As a guide for
    the conical top of this dome, I set up a tripod of PVC pipe. Buckets of soil were
    either passed or carried out for filling the bags.


    When we noticed that the perfect form of the wall seemed to be distorting a bit,
    I advised that we start mixing some lime with the soil before it was moistened,
    so that the bags would become even firmer.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_164_0.png)


    I experimented with the concept of creating an arch form by simply bending some
    PVC pipe into an arch shape. This worked to some extent, but was not ideal.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_165_0.png)


    For an exterior plaster we decided to use a cement-based stucco, which is very
    common in Mexico. Along with the cement, lime and sand, we added a liquid latex
    to make it more impervious to moisture. This was all mixed on the ground by placing
    the liquid in a depression in the middle of the pile, as is customary in Mexico.
    First we applied a rough scratch coat, then we went over it with a troweled finish
    coat. On the inside we used a lime plaster that is more environmentally benign.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_166_0.png)


    This area of Mexico has a pronounced rainy season, so it was important to keep
    the dome as sealed from water as possible. So along with the moisture resistant
    stucco, we would put a final coating of a special roof paint that is used in Mexico
    for painting flat concrete roofs. This is something which would ideally be renewed
    every few years.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_167_0.png)


    Once the final bags were placed on top of the dome, we couldn’t resist assembling
    for a group photo.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_168_0.png)


    In the end I think that this was a very successful project. Many people, young
    and old, got hands-on experience, enough to embark on their own projects in the
    future. I assembled some books about the basics of building with earthbags that
    I left with the school’s library for future students to refer to. And the dome
    itself should remain on the campus for many years to serve as a model and a reminder
    of what can be done.


    Not long after finishing that dome, and after we had moved back to the United
    States, I got a phone call from the founder of a philanthropic organization centered
    in Puerto Vallarta, Mexico, called “Children of the Dump.” He had visited the
    dome while it was under construction and was impressed by earthbag technology.
    He had the idea that earthbags could be

