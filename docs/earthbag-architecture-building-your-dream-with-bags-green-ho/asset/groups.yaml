    Justin Martin’s Gainesville, Florida house used an earth/lime mix for solid bags.
    It has an exterior adobe plaster. The thermal mass keeps things very moderate
    inside throughout the year. Visitors are skeptical that such a lovely house was
    actually built with the earth from the site. He kept a piece of interior paneling
    loose in order to show them the bags from the inside. It cost around $50k, roughly
    1/3 or less than the cost of a similarly sized stick home.'
  - '[PAGE 203]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_203_0.png)


    This clinic in Mexico initiated by Cato was built on a rubble trench foundation
    with a typical adobe soil mix and using barbed wire between courses. It was finished
    with an earthen plaster. The circular reciprocal roof is very strong. It has a
    small kitchen and dorm room as well as the examination room. The community that
    it serves helped build it.'
  - '[PAGE 204]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_204_0.png)


    An intrepid couple in Montana spent three long months, 2,000 earthbags, 4,000
    nails for closing the bags, 90 cubic yards of lava rock and 4 miles of barbed
    wire to complete construction of their dome home. They consumed 37 cans of Chili
    and had 40 pounds of combined weight-loss. They did this without any classes or
    courses or previous experience and with only the internet, their wits, four hands,
    bespectacled eyes and boundless determination.'
  - '[PAGE 205]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_205_0.png)


    The idea of the Half Moon cabin was to build the shell on Earthship principles
    but with earthbags instead of tires. The systems and design was very simple: the
    smallest necessary 12 volt electrical system, no internal plumbing apart from
    cistern-fed drinking water, all waste is composted. The Half Moon is averaging
    63 degrees inside with no supplemental heating. The California site was excavated
    from a sloping area selected primarily because of its view of the mountains to
    the south.'
  - '[PAGE 206]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_206_0.png)


    Marcia Gibbons’ Ransom Ranch project in Bisbee, Arizona, was based on concepts
    she learned at CalEarth. She is an artist, and made hand-painted tiles mixed with
    antique collectible tiles and salvaged tiles for the kitchen. A small solar-powered
    system provides electricity. There are extensive vegetable gardens.'
  - '[PAGE 207]


    # Central America


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_207_0.png)


    Land Trees in Panama provides courses and seminars in building with adobe, earthbag,
    wood logs and thatch. Their Majestic Dome served as their first structure where
    they learned many aspects of how to build with earthbags. Construction of this
    Majestic Dome started off as a small dog house but then it was converted into
    an “Air Shaft Tower”. Eventually the Dome developed into a 2-story Main Building
    and an impressive 3-story Dormitory Tower with thatch roof. The Majestic Dome
    can accommodate up to 12 people without stepping on each others toes. This Majestic
    Dome used over 150 tons of earth. The exterior plaster is hydrated lime.'
- md: '

    This house in Nicaragua was built into a hillside for the breeze, views and fewer
    insects. They were fortunate to have great soil to work with that compacted very
    well when dampened and tamped. The foundation was a rubble trench with a mixture
    of river rock and volcanic rock. It is an oval design of 12×14 meters or so. The
    bond beam and roof seemed to really bring the house together tightly. For the
    first layer of plaster they used cow manure, clay, wood chips and hay. The second
    coat was 45% clay, 45% sand and 10% cement. The final coat was 30% clay, 30% sand,
    30% lime and 10% cement.


    In planning to build an earthbag house in Belize, Jesse Loving decided to first
    build a storage shed. This building is 99.9% degradable. It was inexpensive to
    build, is durable, provides non-mechanical cooling, and is aesthetically pleasing.
    The building blends well into its natural environment. No concrete or petroleum-based
    products were used; a very small amount of fossil fuel was used to transport materials,
    and very little electricity was used.


    La Casa de Tierra (the House of Earth) is a rental house located in Ojochal, also
