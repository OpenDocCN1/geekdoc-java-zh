    Small Earth, with the assistance of the Hounslow Heath School, created this Earth
    Creature at the Southbank’s Hayward Gallery in England. It is designed for outdoor
    learning. The long fabric tubes were filled with adobe soil and cement or lime.


    This school, located under the flight path of one of Heathrow’s runways, found
    an excellent way to mitigate the noise for children at play: they built a domed
    Superadobe structure that allows the kids to duck under when the noise is too
    intrusive. The domes have no doors but even so they cut the noise considerably.


    ## Africa


    A team of two architects and eight professors, under the direction of Akio Inoue
    of Tenri University in Japan, implemented the construction of an ecovillage by
    Lake Victoria, Uganda, East Africa. This ecovillage was designed to alleviate
    poverty and demonstrate sustainable building with earthbags. It is composed of
    three clusters of buildings, including a water tower at the center. Each cluster
    is composed of four living units, each one with a living room, two bedrooms, a
    kitchen, toilet, shower room, and meditation room. Each unit has a biomass latrine
    and a wind power generator that supplies electricity. It was plastered with a
    cement stucco.


    Eternally Solar of South Africa has pioneered a novel approach to earthbag building.
    Long bags are sewn into three compartments, with the outer two being filled with
    adobe or sand, and the central channel either left as a void or filled with rebar
    and concrete for lintels or bond beams. This house features: solar water heating,
    integral grey water system, solar lighting system, recycled cellulose ceiling
    insulation and a permaculture garden irrigated with grey water.


    Another unique earthbag building technology developed in South Africa consists
    of three elements: a framework of Eco-Beams (timber and beams that form the framework
    for the sandbag walls); specially formulated fabric bags, filled with sand and
    stacked between the beams; and, finally, the cladding of the beams with wire mesh
    and either plaster, timber or plasterboard. The completed structure is waterproof,
    fireproof and soundproof.


    Brandon Rogers’ earthbag project is located in Ghana. This is a guest house with
    one bedroom, a main space for the living/dining/kitchen areas and a multi-purpose
    room which will act as studio. The walls are 20 inches thick so they can resist
    the elements. Rogers and his crew cast floor slabs and began the process of filling,
    sewing, tamping, and hauling the polypropylene sacks into place. The bulk of the
    walls went up very quickly over approximately a three-week period. The exterior
    was plastered with a cement finish to minimize maintenance and then detailed with
    stone.


    In Kitgum town, Uganda, Far Reaching Ministries built homes for employees, fellow
    laborers and staff with earthbags. Pictured is the first hut that they built,
    based on traditional architecture. The construction of these earthbag homes has
    also turned into a huge opportunity to share their faith and the earthbag technique
    of building as people gather to see what they did. Ultimately, they have reached
    out to house many orphans from the community.


    The NextAid organization, with the assistance of Joe Kennedy, created a child
    support center outside of Johannesburg, South Africa. This center, for a group
    Youth With a Vision helps serve the millions of orphans of the HIV/AIDS crisis
    in Africa. They used local materials such as earth to minimize costs and make
    the building systems available to the local community. Pictured is the administrative
    office for the compound.


