  - '[PAGE 246]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_246_0.png)


    One of the first earthbag houses built in Haiti was the “Sun House” on the campus
    of a Catholic orphanage run by Father Marc Boisvertt. They used recycled bags,
    local clay and sand from a nearby creek bed. River rocks and mortar were used
    for the the foundation, and a concrete pad was poured for the floor. They sewed
    the bags closed in order to use fewer bags and made heavy metal tampers. A concrete
    bond beam secured the top of the walls and the roof. The finish is painted stucco.'
  - '[PAGE 247]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_247_0.png)


    This is a Shinto Shrine in Niigata City, Japan was designed by Kikuma Watanabe.
    It was built in a vacant lot between two bridges where there used to be lots of
    houses and people, but after construction of the bridges, the town and people
    disappeared. Inside the shrine people are able to find themselves and remember
    their origin. The structure is earthbags and steel (for the roof).'
  - '[PAGE 248]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_248_0.png)


    Illac Diaz, founder of My Shelter Foundation, is pictured in front of one of his
    projects, a high school in the Philippines. An alliance of NGOs, the local government,
    and community groups manifested the school. The vertical walls were all built
    with earthbags and the vaulted roofs were ferrocement. It cost 40 percent less
    than conventional classrooms to build. Its unique design and earth material make
    it self-cooling and equally durable compared to standard classrooms. Also the
    structure is more typhoon resistant. This school has 10 classrooms and a library
    that can cater to the needs of 360 students.'
  - '[PAGE 249]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_249_0.png)


    This roundhouse is a family residence in the Philippines. At first two courses
    of gravel bags were laid over a 2 foot deep gravel trench. The excavated soil
    was used to fill the bags. 4-point barbed wire was laid in between every course.
    Both the top and the sides of the bags were carefully tamped solid. Five concrete
    culvert sections were used to frame the windows and some frosted glass blocks
    were also inserted in the wall. Bamboo from the property was used for rafters
    and split to be used to secure the native cogon thatch. A reinforced concrete
    bond beam was neatly poured. There is a stainless steel compression ring to hold
    up all the bamboo rafters as well as the polycarbonate dome skylight.'
  - '[PAGE 250]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_250_0.png)


    This is one of several eco-houses under construction at Plenitud Eco-Iniciativas
    in Puerto Rico.'
  - '[PAGE 251]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_251_0.png)


    This earthbag Women’s Center in Vanuatu withstood Cyclone Pam with category 5
    winds and helped local families survive. The building and the earthbag water tank
    made it through the storm with minimal damage, despite the widespread destruction
    in the region. Fortunately, some families were able to safely shelter in the women’s
    center earthbag roundhouse as the storm passed through. This news impressed Bundaberg
    Bag Company enough to donate 1,000 meters of polypropylene tubing to build more
    earthbag structures and water tanks.'
  - '[PAGE 252]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_252_0.png)


    The Children of Hope School in Leogane, Haiti, under the direction of Matt Gunn,
    was built on a substantial rubble trench foundation and double bagged with 10%
    cement stabilized earth. They averaged about two rows of bags per day. A solid
    reinforced concrete bond beam completed the wall. The plaster was cement stucco
    with chicken wire embedded. The floor was tamped stabilized earth with a thin
    layer of colored cement as the finish. To keep the roof hurricane proof, they
    ran a piece of rebar above the tin roofing above every other purlin. The building
    inspector that came out even asked if they would do a workshop to teach more people
    about it.'
  - '[PAGE 253]


    # # The Future of Earthbag Building


    I believe that the future of earthbag building is very bright indeed. If the way
    it has expanded globally over the last couple of decades is any indication, we
    can expect earthbag architecture to continue to flourish. In fact, from what we
    know about the enormous environmental, and political pressures bearing down on
    humanity, earthbag building provides some real hope that we will be able to deal
    effectively with some of these challenges.


    We know that earthbag structures can be extremely robust when Mother unleashes
    her periodic fury, and with more severe weather predicted as a result of global
    warming, her fury could become even more fearsome. Earthbag houses have already
    withstood hurricanes, floods and earthquakes, so we know that, if built properly,
    they can provide safe havens. Another increasing threat is fire, and since most
    part of earthbag houses won''t burn, they should withstand this as well.


    I have frequently requested to pleas assistance after major natural disasters
    for folks looking for ways to rebuild communities with safe, inexpensive housing;
    their research has singled out earthbag building as a likely candidate. Initially,
    earthbag architecture was considered by many to be solely useful for temporary
    emergency housing. This is probably because of the similarity it has with the
    use of sand bags for flood control and military barricades. But now people are
    becoming aware that this technology offers a whole world of permanent architectural
    possibilities.


    The other side of the equation of dealing with the adverse effects of climate
    change, is addressing the causes of these changes in the first place. Greenhouse
    gasses have been singled out as the most likely cause, and to diminish the emission
    of carbon dioxide means consuming less fossil fuel and conserving our natural
    resources. Since earthbag building generally uses unprocessed natural materials,
    the bulk of what is needed to build this does not require burning fossil fuel.


    Another environmental threat is air pollution, both inside and outside the home.
    The natural mineral fill material generally used in earthbags is inert'
- md: '

    does and not off gas, which contributes to cleaner air. Earthen plasters can also
    be used; even lime plaster that emits CO2 during its manufacture will reabsorb
    that gas as it cures. Earthbag architecture does not necessarily rely on wood
    for construction, thus conserving trees that also absorb CO2.


    Earthbag buildings have the potential to be extremely durable, as there is little
    used that will deteriorate over time. And at the end of their life, the fill material
    usually just be returned to the earth where it came from. Obviously, from an environmental
    standpoint, earthbag architecture is superior to standard construction these days.


    Economically, building with earthbags can be the one least costly approaches available.
    Certainly the materials for building walls can be dirt cheap. Beyond that, it
    depends on the building style, size and amenities how much it might cost. As any
    building project, the amount of work the owner is willing to invest, and how good
    he or she might be in finding inexpensive supplies, can make a big difference
    in the cost. The earthbags themselves are generally available all over the world;
    often they can be recycled from previous uses.


    Minimal housing can be created with earthbags for practically nothing. As I showed
    with the construction of the little underground dome, the cost for that was nothing
    more than the cost of the bags and a sheet of plastic. Of course the bags themselves
    might have been recycled and cost nothing as well. It is literally possible to
    take a shovel and a backpack filled with bags plastic, and go into the wilderness
    and create a small domicile! On the other hand, one could construct a true mansion
    with earthbag architecture; it is this versatility I love about earthbag building.


    Politically, the future is hard to predict. Because of this uncertainty about
    where any place in the world is headed, the versatility represented by earthbag
    building is a virtue. And the fact that earthbag walls can protect a family from
    penetrating bullets would be a comfort to many. It is even possible to go completely
    underground and nearly disappear from view, as many survivalists dream of. So
    no matter what your outlook may be, earthbag architecture might have a place in
    you and your family’s future.


