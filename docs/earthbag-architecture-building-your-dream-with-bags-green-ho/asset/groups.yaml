    # Foreword


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_3_0.png)


    Kelly Hart Dr. Owen Geiger


    Ten years have elapsed since Kelly Hart and I decided to create EarthbagBuilding.com,
    and shortly thereafter Earthbag Building Blog (later renamed NaturalBuildingBlog.com).
    It''s been a pleasure and honor working with Kelly. What started as a basic idea
    to spread the word about building with bags has grown by leaps and bounds as more
    people world-wide seek out lower cost, more sustainable building options. These
    two websites combined now average about 8,000 readers each day. The reasons for
    this growth are many. Escalating construction costs is the primary motivator for
    using alternative building methods such as earthbags. Factory made materials such
    as cement, steel and brick have become much more expensive and so many people
    simply cannot afford to build their own homes with these conventional materials.


    Along with the rapid growth in popularity have come many innovations. The simplicity
    of natural building lends itself to creativity and experimentation, so builders
    often try new things. Being actively involved in every aspect of this movement
    means Kelly and I get to hear about countless innovations and share the best ideas
    with our readers.


    Ten years ago the main earthbag options were building domes and other small, simple
    designs with subsoil and stabilized subsoil in polypropylene bags. There were
    very few earthbag building books,'
  - '[PAGE 4]


    websites, workshops and trainers at that time. Kelly had been experimenting with
    scoria bag building, but few other main airbag authors and builders have picked
    up the idea, despite all the advantages of building with scoria -- lightweight,
    super insulating, easy to work with, faster, fire and pest resistant, etc.


    The pace of earthbag innovation has greatly accelerated with a greater Web presence.
    This has made it easier for people to discover the benefits of building with bags.
    It''s no longer necessary to attend a workshop or buy a book; most building details
    are now clearly explained on our websites. Over the years our sites have documented
    all the best earthbag projects, materials and methods. We''ve continuously added
    project profiles, house designs, images, videos, testing reports, articles and
    other related resources. We now have thousands of pages of free information.


    Of all the changes from the last 10 years perhaps the most exciting have been
    improvements in building methods. These innovations can have a reaching impact
    on how earthbuildings are constructed for many years to come. Using lightweight
    scoria instead of heavier materials may it possible for less muscular owner-builders
    to build their own home. This is but one of many examples. Here''s a sampling
    of earthbag innovations and developments over the last 10 years:


    +   * Greater of lightweight, highly insulating materials such as scoria, pumice,
    perlite and expanded clay granules and rice hills;

    * Engineer Pacheco developed hydrorobe using raspberry mesh tubing. Both Kelly
    and I are big fans of building with mesh bags and tubing, and have written extensively
    about this exciting development. The cost of the mesh material can be around one-quarter
    of the cost of poly bags, plus the mesh is ideal for binding with plaster;

    * Eternally Solar/Dr. Anderton''s sand bag building method;

    * Patti Stouter''s earthqu method;

    * Mechanized building to speed construction has become more popular;

    * Many new materials have been proposed and experimented with: foamed geopolymer,
    hempcrete, vetiver/lime, vetiver/clay, woodchip/clay, crushed limestone, lime
    or gypsum stabilized soil, caliche, mine tailings;

    * Confined earthbag with post and beam frame;

    * Thin wall earthbag for speed and ease of construction;

    * Rainscreen to protect earthbag domes;

    * Earthquake and hurricane resistant construction methods such as pinning walls
    with rebar;

    * Low cost, alternative bond beams, lintels, foundations and many other details;

    * Making uniform earthbags using a wooden form as in Coron, Philippines;'
  - '[PAGE 5]


    +   * Earthbag cool pantries, root cellars, water tanks, retaining walls, ponds.


    Owen Geiger, April, 2015'
