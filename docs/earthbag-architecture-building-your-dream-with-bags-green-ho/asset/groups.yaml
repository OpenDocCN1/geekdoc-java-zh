    above grade walls I decided to try my hand at cordwood masonry construction. I
    cut the cordwood to the same thickness as the earthbag foundation wall beneath
    them, about 15 inches. Cordwood walls have a cavity between the inside and outside
    masonry which is filled with sawdust, so this, and the wood itself, is where the
    insulation comes from. Of course I

    also insulated the roof of the structure.'
  - '[PAGE 180]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_180_0.png)


    So far the concept for this cool pantry has worked well, over a couple of winters.
    There has been no freezing within the space, although it has come close at times.
    For security I installed a small electric heater on a thermostat that would turn
    it on if it got below about 34 degrees F. and shut it back off at a few degrees
    warmer. This is at about 8000 feet elevation in Colorado which has rather harsh
    winters.'
  - '[PAGE 181]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_181_0.png)


    Here you can see how the finished pantry appears, with the water catchment system
    from the roof of the garage/barn installed. The large turquoise pipe is designed
    to collect the first water off the roof that might be contaminated before it would
    enter the overflow to the tank. After each rainstorm, the dirty water is drained
    so that the system is set for the next storm. An underground overflow pipe pipe
    installed on the water tank inside is directed to a sump so there is no worry
    about too much water going into the tank.'
- md: '

    ## A Small Underground Dome


    This earthbag project took place while Rosana and I were spending our winter away
    from Colorado, down in southern New Mexico. We own a few acres of desert property
    we bought many years ago at a county tax auction; it has never been developed
    beyond a small driveway carved out for parking. Basically we have just used this
    land for periodic camping over the years.


    I have often wondered what the underground temperature would be about 6 feet below
    the surface in this region. Summers can be quite hot and winters are fairly mild,
    so digging into the ground might be a good way to develop a residence that would
    be pleasant all year round, with very little additional energy input. To test
    this theory out, I thought that somehow burying a recording thermometer deep under
    ground would provide useful information.


    Many people have asked about burying earthbag domes, and unfortunately know of
    few actual examples of doing this. So I thought that a fun and informative experiment
    would be to build a small earthbag dome underground on our property, place the
    recording thermometer inside, and completely close it up for a year.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_183_0.png)


    For this experiment I outlined an 8 foot diameter circle in a suitable spot, and
    then drew another circle about 15 inches further out. Next I started digging out
    the soil between the two lines to make a trench wide enough to lay bags into.
    I hoped that I could continue digging this way easily enough to go perhaps 5 feet
    down.


    The top couple of feet were fairly loose adobe soil that would make excellent
    fill for the eventual bag work. But the lower I dug, the more compact and rocky
    the soil became. I persisted however, by pouring water down in the trench and
    allowing it to penetrate the soil, making the digging easier. I was able to descend
    nearly five feet this way; you can barely see the handle of the shovel in the
    above photo.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_184_0.png)


    I calculated that the appropriate diameter of the dome at the height represented
    by the top of the interior cylinder would be nearly a foot less than the bottom,
    so I caved that much off the rim of the cylinder into the bottom of the trench,
    and started using that soil to fill the first earthbags that I laid at the very
    bottom.


    My intention was to build the dome upwards by consuming all of that cylinder of
    soil eventually. In practice this concept worked quite well. It was easy to place
    the bags up against the inner wall as a guide, and simply shovel soil directly
    into the bags from the center. To keep the soil damp so it would pack well and
    to make the digging easier, I occasionally placed water in a cavity of the the
    cylinder and let it soak down.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_185_0.png)


    After laying the first course of bags, I stretched a piece of black plastic around
    the outside of the bags and secured it in place with soil packed between it and
    the outside of the trench. But in order to be able to lay the plastic up and over
    the outside of the trench, I needed to slice it into several sections, as shown
    above. This would also allow me to expose only portion of the bag wall that I
    was working on, and it would eventually provide a moisture barrier on the outside
    of the dome.


    I needed some way to enter the dome once it was completed and I thought that a
    simple and effective way to make an entrance would be with a section of a large
    metal culvert. I found a perfect one about four feet in diameter that I salvaged
    for the project.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_186_0.png)


    After the bags were laid up to three courses, I felt that it was time to set the
    culvert into place. This required some more digging to create enough space. I
    set it at a position where it would support the bags that would be placed above
    it. Then it was just a matter of jamming the bags tightly against it as the wall
    increased.


    Each time I completed placing a course of bags, I was careful to pack soil up
    against it from the outside. As the wall rose, I didn''t want the outward thrust
    of the dome walls to be able to dislodge any bags. This was especially important
    because I had chosen to not use barbed wire between the courses, figuring that
    once the entire dome were buried it couldn''t expand anyway and didn''t need the
    tensile strength of the wire to secure it.


    The further I dug down inside the dome, the more of the wall was exposed, and
    soon there was a step down from the level of the culvert, near the bottom.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_187_0.png)


    Eventually I needed to use a ladder to carry the dirt up in buckets to pour into
    the bags. And then pretty soon I had used all of the available interior soil and
    needed to start using some that was stacked on the outside. It was exciting to
    be nearing completion of the dome. I was very careful to tamp the soil (mostly
    with my feet) so that the entire structure was solid as it rose. Toward the top
    the bags became more of a continuously spiraling pattern rather than discrete
    courses.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_188_0.png)


    The appropriate diameter of the dome at the height represented by the top of the
    interior cylinder would be nearly a foot less than the bottom, so I caved that
