    # Why Build with Earthbags?


    Versatility is the first word that comes to mind when I consider the question,
    “Why build with earthbags?” I can''t think of any other building technology, traditional
    or alternative, that offers so much versatility in terms of both building style
    and material behavior.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_18_0.png)


    Earthbags are useful for making both straight and curved vertical walls, or they
    can be stacked to create various dome shapes, and these can be combined into some
    very interesting volumes, as pictured above.


    Earthbags can be employed both below and above ground, since the polypropylene
    bag material commonly used is impervious to moisture damage. A variety of fill
    material can be used, depending on the need for insulation or thermal mass in
    the wall, and whether it needs to be resistant to moisture damage or not.'
  - '[PAGE 19]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_19_0.png)


    Another good reason to consider earthbags is that the construction can be extremely
    ecological. The foundation, walls, and even the roof (in the case of a dome) can
    be fashioned without the use of industrial materials (other the bags themselves
    and some barbed wire) or even wood, which often is not sustainably harvested.


    Earthbag building can be done quite economically; the bulk of the materials needed
    might be sourced for free on site, and the need for lots of concrete for a foundation
    could be eliminated. Of course, all of the usual supplies needed by any house,
    such as electrical and plumbing, will add to the expense.


    Most of the process of building with earthbags is simple and requires very little
    experience or training. Owner/builders can take on an earthbag project with just
    a modicum of guidance, much of which can be found for free on the internet. We
    usually recommend starting with a small, non-critical project to gain some initial
    experience. While earthbag building is definitely'
  - '[PAGE 20]


    hard work, it doesn’t have to be backbreaking; it is possible to fill the bags
    in place, using buckets to carry the fill material, or lightweight fill materials
    can be used.


    Durability is another factor in choosing earthbags;; if properly detailed, with
    care in protecting the bag material both during the construction and with a good
    plaster, an earthbag building could last a very long time. In general, there is
    nothing that will rot. And at the end of the lifetime of such a building, most
    of the material can simply reunite with the earth.'
  - '[PAGE 21]


    # The Basics


    # What Kind of Bags Work?


    Burlap sacks were the most common choice for military and flood control sandbag
    projects in the early days. These worked well as long as the bags didn''t rot
    from being exposed to too much moisture or sunlight over time, which was fine
    because they were considered temporary structures.


    By far, the most common bag material in use today is polypropylene. This synthetic
    is stronger than burlap and resistant to damage from chemical or moisture exposure.
    It is quite vulnerable to damage from ultraviolet exposure from sunlight, however,
    so it must be protected from this as much as possible. One can buy polypropylene
    bags that have been given a UV resistant coating, but this only adds adds a few
    weeks of protection if the bags are left in the sunlight.'
  - '[PAGE 22]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_22_0.png)


    If you are going to fill the bags with loose material, it is pretty much imperative
    to use the poly bags, because they are stronger and will not deteriorate once
    they are plastered. If you intend to fill the bags with an adobe or stabilized
    material, then burlap or other natural materials for the'
  - '[PAGE 23]


    bags may work, because once the wall has set up, the strength of the bag is not
    as important.


    The fabric of the polypropylene bags is actually woven from small ribbons of the
    material. This is good, because it renders the bags breathable to some extent,
    meaning that moisture added to the fill material can eventually dissipate, and
    the fill can form a solid block. For this reason, other, nonbreathable, synthetic
    bags may not work well for earthbag building.


    Polypropylene bags are commonly used for the storage of grains or animal feeds.
    This means they can often be found as surplus or recycled bags. They can also
    sometimes be purchased as misprints from bag manufacturers or wholesalers. Of
    course, it is also possible to buy quantities of new bags at reasonable prices,
    both online and from local outlets. See the Resources chapter for more information
    about this.


    The best size for earthbag projects would be bags that might be designated as
    50 pound feed bags. These measure around 18 inches wide when flat and 32 inches
    long. This size works well, but the exact size is not critical; bags could be
    somewhat larger or smaller, though I wouldn’t go much smaller or the stability
    of the wall might be compromised. The wall will be about 18 inches thick when
    plastered. If you have larger bags, they might be used at the base, and if you
    have smaller bags, they might work near the top of a wall or dome. Larger bags
    would be more stable, but they take more material to fill them and they make thicker
    walls.


    Then there is the question of whether to buy gusseted bags or not. Gussets, or
    pleats sewn into the bottom of the bag keep the profile of the bag uniformly in
    one plane they are filled and tapped into place. Without the gussets, there is
    a tendency for the pointed corners at the bottom to stick out, making the later
    plastering more difficult. Some people like to carefully fold and pin the bottom
    of the bag to avoid this, but I prefer to simply pound the points in with a hammer
    before plastering. Another trick is to turn the bag inside out to avoid the points.


    Nader Khalili pioneered the use of long tubular sections of the same polypropylene
    material used to fabricate individual bags for layering on a'
- md: '

    wall. These tubes can be cut as long as needed to complete a particular wall section,
    slid onto a rigid filling tube or funnel, and then filled in place. It takes several
    people to accomplish this efficiently, but the result can be very aesthetically
    satisfying, strong, and quickly done.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_24_0.png)


    The tubing material can be purchased (usually directly from a factory) as huge
    rolls, up to 6000 feet long. For some reason, there generally is no advantage
    economically in buying the large rolls over purchasing the individual bags, despite
    the obvious increase of manufacturing time and materials that goes into making
    the bags.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_25_0.png)


    A recent innovation with bag material is the use of open mesh bags of the sort
    that is commonly used to package fruit. This mesh can also be purchased in long
    rolls and used in a similar manner to the tubes of polypropylene. This technique
    was introduced by Fernando Pacheco, a Brazilian engineer, and he calls it “Hyperadobe.”
    The mesh bags are often a raschel weave and the fiber is either polypropylene
    or other synthetics.


    Hyperadobe takes Superadobe to a whole new level with many distinct advantages.
    The net bagging is generally cheaper than the woven poly material; the fill will
    dry out and cure faster; there may be no need for barbed wire in vertical wall
    designs; it creates a more monolithic structure due to direct bonding between
    courses; it is easier to gather the tubing on a canister for filling; there is
    better adhesion of plaster; the mesh provides an automatic plaster mesh reinforcement.
    The only disadvantage that is that it wouldn’t work with loose fill materials
    because of spillage.


    # Fill Material


    The most common thermal mass fill material is a mix of sand and clay that approaches
    that used in other earthen wall systems, such as adobe, cob and rammed earth,
    where about 30% clay and 70% sand mix is ideal. Since soil is encased in a strong
    bag, the exact formulation for this soil mix can have much more variability when
    used for earthbags. The objective is to have that that does not shift around once
    it is moistened, tamped into place, and dried. Virtually any soil can be used
    in earthbags, but it is best to avoid heavy clays or fine, slippery sand. As you
    remove most of the larger rocks and organic debris, you should be fine. This means
    that it is often possible to use the earth beneath your feet at the site of building.
    What could be more sustainable than this?


    How the bags will be used in a wall may determine what the best fill material
    is. Vertical walls are generally more forgiving than domes, which really need
    to be built with solid blocks of material. A dome created with shape-shifting
    fill could become unstable and collapse, unless it has proper reinforcing.


    Another determining factor for choice of fill material is exposure to possible
    moisture issues, like underground situations or domes built in wet climates.


    If there is not enough clay to bind the soil, it is possible to stabilize it with
    either Portland cement or builder''s lime. About 10% of these stabilizers could
    be enough, but it is best to run some tests with your soil to determine this.
    With domes, especially in climates where excess moisture could be an issue, it
    is advisable to stabilize the soil with cement to assure that the fill will never
    become soft enough to deform. We advise folks to avoid making domes in rainy climates,
    or at least to provide an additional, separate roof over the dome to shed water
    away from it.


    Other, more insulating fill materials that have been used successfully include
    pumice and scoria (which are both lightweight volcanic stone), perlite, and even
    rice hulls. One could experiment with recycling Styrofoam (EPS foam) or crushed
    plastic bottles as fill also. Of course, the you would have to take into account
    the possible compressibility of these materials when designing the wall.


    A special case for appropriate fill material is at the foundation or first course
    or two at the base of a wall. Here you want the wall to absolutely not deteriorate
    in moist conditions, nor do you want the wall to wick moisture upward into the
    level with loose gravel. So we generally advise folks to fill the bags at this
    level with loose material. And because it is essential that such loose material
    never escapes, we advise the use of two bags (one placed inside the other) for
    double assurance it will be secure. A good stabilized plaster is essential to
    protect these bags.


    # Foundations


    Earthbags themselves make good foundations, and have been used that way for many
    other building systems, such as for straw bale, cordwood, cob, etc. In this case,
    the bags are built up to the proper height for a stem wall that keeps the rest
    of the wall at least a foot above grade, well above snow level or possible back
    splash from hitting the ground.


    All foundation systems must take into account the possibility of the underlying
    soil heaving with freezing weather or from expanding with moisture, as do heavy,
    expanding clays. The common way to avoid these problems is to dig down to a level
    that is below the frost depth for that region, or below any layers of heavy clay
    soil.


    Prescriptive building codes often require continuous concrete foundations that
    comply with specific conditions and measurements. Such a foundation can be used
    with earthbag construction, as long as the top of the concrete foundation is wide
    enough to accommodate the full width of the earthbags when compacted on top. In
    this case it would likely be a good idea to place a moisture barrier on top of
    the foundation wall, or start with a course of gravel-filled bags, to avoid the
    concrete from wicking moisture into the wall above.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_29_0.png)


    Better using a massive reinforced concrete foundation would be to employ a simple
    rubble trench foundation. These foundations were embraced by the famous architect,
    Frank Lloyd Wright. The idea is to dig a trench, at least as wide as the bags
    and plaster, down deep enough to get below the frost level. This trench is then
    filled with cobble stones, possibly graded so that the smaller aggregate is toward
    the top of the trench. This keeps the foundation stable from soil heating provides
    lots of spaces between the stones for moisture to accumulate and eventually drain.
    As seen in the above photo, the top of the rubble trench can be recessed some
    below grade, with the first course of gravel-filled bags placed so that they will
    provide a “toe” into the soil.


    If the soil surrounding the trench does not drain enough, then what is know as
    a French drain can be installed. This is a 3-4 inch drain pipe (usually plastic
    these days) that has been perforated so that water can seep into it from above
    and the sides. The pipe is laid toward the bottom of the trench and inclined slightly
    so that water will run to either a “daylight” location on the property or to an
    underground sump or drain field. This will allow any excess water to flow away
    from the foundation.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_30_0.png)


    In the above photo the rubble trench is fairly shallow and no French drain is
    provided because the soil is pure sand that drains exceedingly well, making upheaval
    unlikely. The wire mesh visible in the photo was an attempt to keep the cobbles
    contained from migrating into the sand, and would not be needed in most applications.


    Additionally, the soil surrounding the base of the foundation wall should be graded
    so that it slopes away from the structure, keeping surface water from collecting
    near the foundation.

