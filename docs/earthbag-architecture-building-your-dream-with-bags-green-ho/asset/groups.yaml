  - '[PAGE 119]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_119_0.png)


    In reality, the bag wall proceeded fairly easily up to the first story, mainly
    because this part was nearly vertical. The back of the wall to the north was going
    to be substantially bermed, so the lower bags were filled with soil for thermal
    mass, and then scoria was placed up against them for insulation. An apron of black
    plastic was put into place to protect it all from moisture before it got backfilled.'
  - '[PAGE 120]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_120_0.png)


    I stabilized the back wall further by connecting floor/ceiling joists across to
    the large viga that had already been secured between the two domes. A couple of
    vertical posts helped support this platform.


    The second story soon became more of a challenge as the wall curved further inward,
    gravity was working against me at this point. It required periodic braces to keep
    the wall from toppling. Two round culvert coupler windows were also braced into
    place and the bags were stacked around them.'
  - '[PAGE 121]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_121_0.png)


    When the wall arrived at the right height to attach rafters for the roof, I connected
    these to the viga at the base and where they intersected the bag wall, I pounded
    log rebar stakes through the rafters and deep into the bag wall. This helped to
    freeze the wall where I wanted it, as well as secure the rafters in place.'
  - '[PAGE 122]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_122_0.png)


    By the time I got all of the rafters positioned, the back wall was able to stand
    on its own without the braces, however, I did install a few permanent braces just
    for safety’s sake.


    To prepare the roof to accept the metal roofing I planned to install, all I needed
    to do was nail some 1 X 4 stringers across the rafters. This was a very steep
    roof because I wanted it to be the perfect angle for the best performance of solar
    panels. I also wanted there to be plenty of head room in that upper space.'
  - '[PAGE 123]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_123_0.png)


    Below the metal roof, I created an extended bay for a greenhouse bed. This would
    be right next to the kitchen, convenient for fetching fresh greens. The central
    part of the little roof over the greenhouse was also glazed for better growth
    of the plants. And this part of the roof was hinged so that it could be raised
    a bit to allow good ventilation. Metal flashing was between the metal roof and
    the papercrete in the domes.'
  - '[PAGE 124]


    # Pantry


    The concept for the pantry was that it would be substantially buried underground,
    and on on the north side of the building so that it would rarely receive much
    direct sunlight and stay cooler. It was basically another small earthbag dome
    (about 14 feet in diameter) nestled right up against Montecito so that it was
    really only a little more than half a dome.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_124_0.png)


    We filled the bags at the base, up to the level of the ground, with the native
    soil because we wanted it to be coupled directly to the earth, the better to keep
    it cool. Then we switched to filling them with scoria to help insulate the room
    from the ambient air outside.'
  - '[PAGE 125]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_125_0.png)


    Once we had the bags stacked up to about ground level, I decided to provide a
    conical support structure with poles. This was because I knew we would be placing
    more dirt on top of the pantry, and so the pitch on the top needed to be shallow
    enough that this dirt wouldn''t just slide off. The poles were simply resting
    on the bags and were pinned into them with rebar pins through holes drilled into
    the wood. At the top there was a small ring for attaching the top of the poles.
    I ran some concentric wire around the poles to help keep the bags in place.'
  - '[PAGE 126]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_126_0.png)


    Two layers of 6 mil black plastic were draped over the entire structure before
    it got backfilled with soil. On the right can be seen a 4 inch PVC vent pipe for
    inlet air and eventually a 6 inch PVC vent pipe was installed at the apex of the
    dome.'
  - '[PAGE 127]


    # Mudroom Entry


    The final element of the original design for this house was a mudroom entry space
    leading to the street. The idea was to make a small vault with earthbags, and
    I was determined to find a way to do this. I had already successfully spanned
    six feet using the double crosshatch pattern with the bags, so I figured that
    if I used the same form that I had used for those arches it would work. But I
    wanted the span at the base to be 8 feet, so I decided to incline the lower part
    of the vault enough that the span would only be 6 feet higher up. And if these
    walls were also as thick as the double bags, then it would match up well.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_127_0.png)'
  - '[PAGE 128]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_128_0.png)


    Since the vault was to be much longer than the form for the arch I needed to create
    a way to slide the form to a new spot once the arch was in place. I did this with
    some temporary rails that would support the arch form as it was moved forward.
    This approach worked pretty well, with the thick inclined walls providing enough
    of a buttressing effect to counteract the outward thrust of the vault.'
  - '[PAGE 129]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_129_0.png)


    In the above photo the vault was complete, and a recessed entry door framed. Peter
    is in the process of putting papercrete on some small pillars that would support
    a small bell tower. Right outside the door would be a rope that could be pulled
    to ring the bell and let us know that somebody was there.'
  - '[PAGE 130]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_130_0.png)


    This is what the vaulted entry looked like with holiday decorations.'
  - '[PAGE 131]


    # Finished Interior


    Creating the shell of this house was only half of the work, as the interior finish
    details were considerable, as with any house. We greatly enjoyed being able to
    finally move in. Some of the amenities took several more years to realize, but
    eventually the house took on the shape and appearance that we dreamed of.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_131_0.png)


    This view of our bedroom shows the earthbag staircase that ascends to the loft
    area. The entire column serves as thermal mass for this passive solar room. We
    rarely needed to have supplemental heat in there. The wall finish in the bedroom
    was the smoothed papercrete that had been given a staining wash of watery latex
    paint.'
  - '[PAGE 132]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_132_0.png)'
  - '[PAGE 133]


    The greenhouse bed is on the right and the walkway between the bedroom and the
    kitchen was laid with flagstone for durability and more thermal mass. On the left
    was a solar heated hot tub made with a stock water tank lined with local stones.
    A circulating pump could be turned on to provide a small waterfall down the backing
    stones into the tub.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_133_0.png)


    Rosana was quite pleased with her cosy office above the greenhouse/bathroom area.
    You can see some of the permanent braces that help keep that earthbag wall secure.'
  - '[PAGE 134]


    <!-- no content -->'
  - '[PAGE 135]


    We created a shower stall in a back corner of the Midsection by lining the space
    with local stones and tongue and grooved planks.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_135_0.png)


    The kitchen and dining area were under the loft in Montecito. At first the central
    heater was a wood stove, but we discovered that the passive solar heating worked
    so well it was difficult to regulate the heat so we eventually replaced it with
    a propane heater.'
  - '[PAGE 136]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_136_0.png)


    The kitchen was kind of an odd space, but we made it work with some creative cabinetry.'
  - '[PAGE 137]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_137_0.png)


    The door to the right of the kitchen led into the pantry. Behind the curtain were
    shelves for storage. In a dome it takes some ingenuity to find ways to store things.'
