    # History of Earthbag Building


    The idea of making walls by stacking bags of sand or earth has been around for
    over a century. Originally sandbags were used for flood control and military bunkers
    because they are easy to transport to where they need to be used, fast to assemble,
    inexpensive, and effective at their tasks of warding off water and bullets. At
    first natural materials such as burlap were used to manufacture the bags; more
    recently woven polypropylene has become the preferred material of its superior
    strength.


    The use of sandbags has generally been associated with the construction of temporary
    structures or barriers. Using sandbags to build houses or permanent structures
    has been a relatively recent innovation.


    In 1976 Gernot Minke at the Research Laboratory for Experimental Building at Kassel
    Polytechnic College in Germany began to investigate the question of how natural
    building materials like sand and gravel could be used for building houses without
    the necessity of using binders to consolidate the material. The use of fabric-packed
    bulk material was found to be a cost-efficient approach. They used pumice to pack
    in the bags, because it weighs less and has better thermal insulating properties
    than ordinary sand and gravel. Their first successful experiments were with corbelled
    dome shapes (an inverted catenary) which was obtained with the aid of a rotating
    vertical template mounted at the center of the structure.'
  - '[PAGE 11]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_11_0.png)


    In 1978, under Gernot Minke’s direction, a prototype house using an earthquake-proof
    stacked-bag type of construction was built in Guatemala.  They used cotton bags
    soaked in lime-wash to protect the material from rot and insects. When flattened,
    the bags measured roughly 3 X 4 inches (8 X 10 cm) Vertical bamboo poles placed
    on both sides of the bags and interconnected with wire loops gave the stacked
    bags stability. The bamboo rods were fixed to the foundation and to the horizontal
    tie beam at the top.


    It was Iranian-born architect Nader Khalili who popularized the notion of building
    permanent structures with bags filled with earthen materials. Actually his first
    concept was to fill the bags with moon dust! Attending a 1984 NASA symposium for
    brainstorming ways to build shelters on the moon, Khalili coupled the old sandbag
    idea with the ancient adobe dome and arch construction methods from his homeland
    in the Middle East. He realized that bags filled with lunar “dirt” could be stacked
    into domes or vaults to provide shelter.


    Khalili came up with a further refinement on this building concept on Earth: for
    a permanent, shock-resistant structure, where no place stands for barbed wire
    between the courses of bags, thus unifying the shell into a more monolithic structure?'
  - '[PAGE 12]


    At first Khalili was filling his experimental bags with desert sand, but then
    evolved his idea of Superadobe, where bags or long tubes of polypropylene bag
    material would be filled with a moistened adobe soil, or cement-stabilized soil,
    that would dry into large adobe blocks. In this case the original bag material
    was merely the initial form and would not necessarily be an integral part of the
    eventual structure.


    Soon after these first experiments, Khalili began publicizing his work through
    the media and conducting workshops on the techniques that he was perfecting. Many
    people who read about his work, visited his compound in Hesperia, California,
    or studied with him there, decided to go ahead with their own experiments with
    his ideas.


    Among these “early adopters” were Joe Kennedy, Paulina Wojziekowska, Kaki Hunter
    and Doni Kiffmeyer, Akio Inoue, and myself. I believe that it was Joe Kennedy
    who coined the term “earthbag” to suggest that the bag could contain a variety
    of earthen materials.


    Paulina Wojciechowska was the first to write an entire book on the topic of earthbag
    building: Building with Earth: A Guide to Flexible-Form Earthbag Construction
    was published in 2001. This featured some of her early experiments done at Khalili’s
    CalEarth, along with several other case histories.'
  - '[PAGE 13]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_13_0.png)


    Akio Inoue, from Tenri University in Japan, has done extensive experimentation
    with earthbag construction, both on the campus of the University and in India
    and Africa. Above is pictured one of many projects that has helped build for assistance
    programs.


    Kaki Hunter and his husband Doni Kiffmeyer became enamored with earthbag construction
    after studying with Khalili, and worked on a variety of projects, both for themselves
    and for clients. In 2004 they wrote and got published another book, Earth Building:
    the Tools, Tricks and Techniques , based on their particular experience.


    In the meantime, Nader Khalili was continuing the promotion of his Superadobe
    technique and eventually decided to patent the idea, which he obtained in the
    U. S. in 1999, using very general terms that cover using bags made of any material
    being filled with virtually any material, and combining these with barbed wired
    between the courses.'
- md: '

    Many of us who had been engaged in promoting airbag building on our own were contacted
    by Khalili and asked to enter into contracts with him in order to continue our
    work. It didn’t take much research to discover that his patent could easily be
    disqualified because he had been publicizing his techniques through various media
    for at least four years before he even applied for his patent. Patent law clearly
    states that such publicity occurring prior to one year before the patent application
    would disqualify it for consideration.


    So now the door is wide open for anyone to take this concept and run with it,
    and more people are doing so all the time, all over the world. While Khalili and
    most of his students have focused primarily on using the bags to form large adobe
    blocks, others have tried filling them with a variety of other materials, such
    as crushed volcanic rock, crushed coral, non-adobe soils, gravel, and rice hulls.


    Nader Khalili died in 2008, but his family continues to operate CalEarth where
    they conduct workshops and promote the Superadobe concept around the world. Earthbag
    building would certainly not be as popular today as it is without the dedication
    and work of this visionary.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_15_0.png)


    Earthbag building is unique among all other building technologies in that it can
    be either insulation or thermal mass, depending on what the bags are filled with.
    Insulation will tend to isolate the interior space from the outside air, whereas
    thermal mass will slowly transfer that outside air temperature into the interior.
    This is a very important distinction, because these characteristics of a wall
    will greatly influence how comfortable, economical, and ecological any given system
    will be.


    Safety is of prime concern with all building technologies, and much experimentation
    and testing has been done to establish guidelines for many ways of building. Khalili
    established a relationship with the building department in Hesperia, California,
    where CalEarth is located, an area where earthquakes are naturally a great danger.
    In 1993 live-load tests to simulate seismic, snow and wind loads were performed
    on a number of domed earthbag structures at CalEarth and these exceeded code requirements
    by 200%.


    In 1995 dynamic and static load tests were performed on several prototypes for
    a planned Hesperia Museum and Nature Center to be constructed using Khalili’s
    Superadobe concepts with both dome and vault shapes. All of these tests exceeded
    ICBO and City of Hesperia requirements.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_16_0.png)


    In 2006, at the request of Dr. Owen Geiger of the Geiger Research Institute of
    Sustainable Building, the Department of Civil and Mechanical Engineering of the
    U.S. Military Academy at West Point conducted several controlled and computer-monitored
    tests to determine the ability of polypropylene earthbags filled with sand, local
    soil, and rubble to withstand vertical loads. Their written report concluded that
    “overall, the earthbags show as a low cost building alternative. Very cheap, and
    easy to construct, they have proven durable under loads that will be seen in a
    single residential home. More testing should prove the reliability and usefulness
    of earthbags.


    Despite the success of these tests, earthbag building concepts have yet to be
    incorporated into the International Residential Building Code. Obviously more
    widespread acceptance of the demonstrated viability of earthbag building needs
    to occur!


    It is difficult to know how many residences and other earthbag structures have
    been built at this point, certainly hundreds if not thousands. Many of us have
    been promoting the technique for use as emergency shelters, and some have been
    built for this reason. It is easy for folks to accept this way of building temporary
    shelters because it fits the historical model of sandbag use.


    But many of us have also built substantial homes using earthbags, and in the process
    we''ve realized how truly versatile and sustainable the technique is. I wouldn''t
    be surprised if many of these earthbag homes are still standing long after their
    conventional counterparts built contemporaneously have disintegrated.


    ## Why Build with Earthbags?


    Versatility is the first word that comes to mind when I consider the question,
    “Why build with earthbags?” I can''t think of any other building technology, traditional
    or alternative, that offers so much versatility in terms of both building style
    and material behavior.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_18_0.png)


    Earthbags are useful for making both straight and curved vertical walls, or they
    can be stacked to create various dome shapes, and these can be combined into some
    very interesting volumes, as pictured above.


    Earthbags can be employed both below and above ground, since the polypropylene
    bag material commonly used is impervious to moisture damage. A variety of fill
    material can be used, depending on the need for insulation or thermal mass in
    the wall, and whether it needs to be resistant to moisture damage or not.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_19_0.png)


    Another good reason to consider earthbags is that the construction can be extremely
    ecological. The foundation, walls, and even the roof (in the case of a dome) can
    be fashioned without the use of industrial materials (other the bags themselves
    and some barbed wire) or even wood, which often is not sustainably harvested.


    Earthbag building can be done quite economically; the bulk of the materials needed
    might be sourced for free on site, and the need for lots of concrete for a foundation
    could be eliminated. Of course, all of the usual supplies are available, but the
    cost of the bags is the main expense. Most of the bags can be found for free or
    at a low cost if you know where to look.


    Earthbag building is simple to learn, but it requires some effort to get right.
    The most important thing is to ensure the bags are packed tightly and the walls
    are plastered correctly. If you do this, your building will last for a long time.


    ## The Basics


    ### What Kind of Bags?


    Burlap is the most common material used for earthbag building because it is breathable
    and inexpensive. However, it is prone to rot if it is exposed to the elements
    for too long. Polypropylene bags are much more durable and are resistant to rot
    and moisture. However, they are not breathable, which can be a problem if the
    walls are not properly vented.


    The best size for earthbag projects would be 50 pound feed bags. These measure
    around 18 inches wide when flat and 32 inches long. This size works well, but
    the exact size is not critical; bags could be somewhat larger or smaller, though
    I wouldn’t go much smaller or the stability of the wall might be compromised.
    The wall will be about 18 inches thick when plastered. If you have larger bags,
    they might be used at the base, and if you have smaller bags, they might work
    near the top of a wall or dome.


    Then there is the question of whether to buy gusseted bags or not. Gussets, or
    pleats sewn into the bottom of the bag keep the profile of the bag uniformly in
    one plane they are filled and tapped into place. Without the gussets, there is
    a tendency for the pointed corners at the bottom to stick out, making the later
    plastering more difficult. Some people like to carefully fold and pin the bottom
    of the bag to avoid this, but I prefer to simply pound the points in with a hammer
    before plastering. Another trick is to turn the bag inside out to avoid the points.


