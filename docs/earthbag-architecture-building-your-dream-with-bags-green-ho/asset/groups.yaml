    自从完成土袋房屋（大约在2000年）以来，我参与了许多其他土袋建筑项目，包括池塘的小水坝、一个用于车库/商店/办公室复合体的大拱顶、一个小型露天剧场项目、一个嵌入式储藏室以及几个独立的小圆顶。我将随着故事的进展描述所有这些建筑。我从这些经验中学到了很多知识，并将它们与你们分享。


    在建造土袋房屋期间，我继续收集实际施工过程的视频素材，这耗时近三个时间。最后，我制作了另一个视频节目（后转为DVD），标题为《用袋建筑：我们如何制作我们的实验性土袋/纸石混凝土房屋》。


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_8_0.png)


    在我完工土袋房屋左右，我开始为我们位于科罗拉多州的当地报纸撰写了一系列关于可持续建筑的文章。在某个时刻，我曾想过将这些文章结成一本书，但随后意识到一个致力于同一主题的网站可能会吸引全球更多的读者。这便是
    www.greenhomebuilding.com 的诞生，它一直繁荣发展至今。


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_8_1.png)


    作为这个成功网站的补充，我创立了 www.dreamgreenhomes.com，将几位绿色建筑师和设计师的才华汇聚在一个绿色房屋设计图的市场中。


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_8_2.png)


    这些设计师之一是奥恩·盖格博士（Dr. Owen Geiger），他是我的私人朋友，也是一个被“土袋病毒”侵中的人。我们讨论过一起合写一本关于土袋建筑的书，但后来选择启动另一个网站：http://www.earthbagbuilding.com。奥恩随后还撰写了一本土袋建筑指南，以及一个关于该主题的教学DVD。


    ![](img/4f93d33c635578ee6b6ef918bb8ad96_9_0.png)


    与土袋建筑网站同步，我们分享了一个关于同一主题的博客，现在它已演变为 http://www.naturalbuildingblog.com。奥恩负责了该博客的大部分文章，但我偶尔也会进行记录。


    所有这些资源结合在一起提供了丰富的信息，不仅关于土袋建筑，还关于一般的普持续建筑。你可以通过上述网站购买到提到的大多数书籍和DVD。


    你可以预见到在下一章中读到关于土袋建筑的历史。接后，我将深入探讨如果你想尝试这种建筑方式，需要了解的基础知识。在此之后，我将详细描述我在各种项目中的许多直接经验。多年来，我们一直在网上发布关于世界各地开展的丰富多样的土袋建筑信息；现在我将总结其中一些内容，以便你理解这种革命性建筑技术的范围竟有多广。关于所有这些，我们可以观察可能性的基础，并对土袋建筑的未来可能是什么样子提出建议。


    希望当你读完这本书时，你对用土袋能做的事情有一个良好的了解，并对操作它的基础知识有所理解。当然，没有任何东西可以取代直接经验，我鼓励你尝试一下，从一些小项目开始，或者参加某地的工作坊。然而，请记住，任何建筑都涉及风险。正如你稍后读到的，我遇到过许多必须克服的挫折，其中一些可能导致受伤。我或
    Hartworks, Inc. 对因使用此书中发现的任何信息而导致的损失、损坏或伤害不承担任何责任。我希望你像我一样喜欢建筑的过程！


    # 土袋建筑的历史


    通过堆叠装有沙或土的袋子建造墙壁的想法已经存在了一个多世纪。最初，沙袋被用于防洪和军事地堡，因为它们易于运输到使用地点、组装快、廉价，并且在抵御水和子弹的任务上非常有效。起初使用黄麻等天然材料制造袋子；最近，织造聚丙烯因其优越的强度而成为首选材料。


    沙袋的使用通常与临时结构或屏障的建造有关。使用沙袋建造房屋或永久性结构是一项相对较新的创新。


    1976年，德国卡斯塞尔理工学院实验建筑研究实验室的格恩诺特·米克（Gernot Minke）开始研究如何利用沙子和碎石等天然建筑材料建造房屋，而无需使用粘结剂来固化材料。发现使用织物包装散装材料是一种具有成本效益的方法。他们使用浮石填充在袋中，因为比普通的沙子和碎石更轻，且具有更好的隔热性能。他们的第一次成功实验是叠涩圆顶形状（倒悬链线），这是通过一个安装在结构中心的旋转垂直模板实现的。


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_11_0.png)


    1978年，在格恩诺特·米克的指导下，在危地拉建造了一座使用抗震堆叠袋式结构的原型房屋。他们使用浸泡过石灰水的棉袋来保护材料免受腐烂和虫害侵害。压平时，袋子的尺寸约为
    3 X 4 英寸（8 X 10 厘米）。放在袋子两侧的垂直竹竿并用线环连接为堆叠的袋子提供了稳定性。竹杆固定在基础和顶部的水平拉梁上。


    伊朗裔建筑师纳德尔·哈里里（Nader Khalili）普及了用装有土壤材料的袋子建造永久结构的想法。实际上，他的第一个概念是向袋子里填充月尘！在参加1984年NASA关于如何在月球建造避难所的研讨会时，哈里里将旧沙袋的想法与他家乡中东的古代土砖圆顶和拱门建筑方法相结合。他意识到填充月球“土”的袋子可以堆成圆顶或拱顶以提供住所。


    哈里里对这一地球建筑概念进行了进一步的改进：对于一个永久的、抗震的结构，在袋层之间不放置铁丝网，从而将外壳统一成一个更具整体性的结构？


    起初，哈里里用沙漠沙填充他的实验袋子，但随后演变了了他的“超级土袋”（Superadobe）构想，即聚丙烯材料的袋子将填充润湿的土砖土壤或水泥固化的土壤，这些土壤会干燥成大土砖块。在这种情况下，原始的袋子材料仅仅是初始形式，并不一定是结构中不可缺的一部分。


    在这些首次实验后，哈里里开始通过媒体宣传他的工作，并就这些技术举办工作坊。许多读到他工作的人、访问他在加州赫斯珀利亚（Hesperia）的庄园，或在那里学习的人，都决定进行自己的实验。


    这些早期者中包括乔·肯尼迪（Joe Kennedy）、保琳娜·沃杰霍肖斯科卡（Paulina Wojciechowska）、卡基·亨特（Kaki Hunter）和唐尼·基夫梅耶（Doni
    Kiffmeyer）、井上英雄以及我。我认为是乔·肯尼迪创造了“土袋”（earthbag）这一术语，暗示袋子可以包含各种土壤材料。


    保琳娜·沃杰霍肖斯科卡是第一个对土袋建筑主题撰写整本书的人：《用土构筑：柔性成型土袋建筑指南》于2001年出版。该书中介绍了她在哈里里的 CalEarth
    期间进行的一些早期实验，以及其他几个案例研究。


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_13_0.png)


    来自日本天理大学的井上英雄（Akio Inoue）在大学校园内以及印度和非洲对土袋建筑进行了广泛的实验。上面的照片是许多帮助建立援助计划的项目之一。


    卡基·亨特（Kaki Hunter）和她的丈夫唐尼·基夫梅耶（Doni Kiffmeyer）在向哈里里学习后对土袋建筑着迷，并为他们自己和客户开展了各种项目。2004年，他们撰写并出版了另一本书《土质建筑：工具、技巧与技术》，基于他们的特定经验。


    与此同时，纳德尔·哈里里继续推广他的超级土袋技术，并决定对该想法申请专利，他于1999年在美国获得了专利，使用了非常通用的术语，涵盖了使用任何材料制成的袋子填充几乎任何材料，并在袋层之间结合铁丝网。


