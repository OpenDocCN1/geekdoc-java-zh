  mdcn: '

    我帮助我的朋友 Baraka 为她居住的科罗拉多州气候设计了这栋土袋袋房屋。她对形状和房间布局有非常具体的想法，但希望就土袋建筑的实用性以及如何完成许多施工细节获得建议。像“宁静谷”一样，袋子里填充的是浮石。工人们通常对施工做法有自己的主意，有时这些想法会占据主导。这导致几处墙体并不完全垂直，还出现了其他一些问题。尽管如此，这栋房子的结构基本上非常稳固，在未来应该能很好地服务她。


    位于犹他州布夫（Bluff）的一座 700 平英尺 BLM 许可站，其墙厚度在 15 到 24 英寸之间，形成了热质量，产生了一个隔音且节能的结构。土袋建筑防火、防水、防腐，是保险费用较低的永久性结构。建筑用土经过细砂处理，含有
    10% 的粘土。外墙覆盖了 OSB 板（通过插入袋子之间的塑料紧固件固定）和 2 英厚的泡沫。传统的水泥抹灰提供了类似于旧土坯建筑略微不规则的外观。使用当地采集的粘土调配的天然土抹灰，使建筑内部与外部环境同样契合。


    上述 1,000 平英尺的土袋房屋由业主兼建造者 Alison Kennedy 在犹他州莫阿布（Moab）以极低预算建造。它是犹他州第一栋获得许可的土袋房屋。它是一个木框架结构，内部填充了土袋。基础是现浇混凝土和传统的混凝土块。袋子里填充了从当地碎石石场运来的“废弃沙”。墙顶砌筑了一圈混凝土块联结梁。外墙先覆盖了土抹灰，然后添加了两层石灰抹灰以增加额外的防侵蚀保护。Alison
    采集了野生粘土，将其制成油漆涂在新鲜石灰粉的表面。


    下方左侧 500 平英尺的房屋由业主 John Capillo 设计，并在肯塔基州贝雷亚（Berea）建造。代码官员毫不费力地就发给了 John 许可证。他的设计有一个
    16 英尺的圆顶，圆顶延伸出一个较大的圆，并配有木屋顶。结构的下部分比上部分的墙厚，以产生支撑作用。使用了几英里外采石场的密实级“石灰粉”作为填充物；石灰固化后变得像岩石一样。房屋背部被埋了四英尺。他们使用了厚重的
    6 角塑料隔层，并在结构周围使用了法式排水沟。最初几周，每天有 7 人工作，之后人数减少到每天 2 或 3 人。这个结构的袋装工作大约花了三个月。成本大约在
    15,000 美元。


    位于墨西哥下加利福州的圆顶房屋（DOME HOME）基于神圣几何原理、斐波纳契数列和深生态学。由大师建造者/设计师 Rah Rysak 实现了高水平的美学细节。土抹灰使用了仙掌、芦胶和木纤维素；这是一个无水泥和无
    VOC（挥发性有机化合物）的材料区域。


    土质小屋 2.0 应急避难所由华盛顿州的 Eco Friendly Shelters 设计。用于填充的土壤来自现场挖掘；使用的木材回收自当地的森林火灾；土掩护屋顶保护其免受烈日和寒风的侵害；光线来自管状天窗。这个
    1,200 平英尺的避难所成本低于 5,000 美元。


    这栋 280 平英尺的房屋主要由俄亥俄州的两个女性建造，花费约 10,000 美元。它度过了一场将树吹倒在上面的大风，仅损坏了纸浆抹灰。他们使用了 3/4
    英寸的碎石灰岩细粉作为填充。


    “加拿大土袋人”建造了三个高度不一的圆形房间，配有两个卧室处汇合的双坡屋顶。他们认为自己是“住在加拿大阿尔伯塔省偏远地区的几个改造过的城市孩子，试图为自己规划可持续的生活”。


    这栋房屋是由 Martin Cubak 在爱达荷州自建的。一楼是一个直径 22 英尺的土袋圆屋。在那上面，他做了一个木框架的卧室，并计划进一步扩大房屋，增加更多的卧室和温室。他利用工作之余的休息完成了这一切，花费了约
    5,000 美元。


    Kent Kaufman 位于蒙大拿州的土袋小屋用便携式水泥搅拌机混合的土、水和草进行抹灰。这些抹灰被涂抹在墙上，确保行缝和裂缝都填充良好。他在一天内就完成了整个外南墙的抹灰。

    '
