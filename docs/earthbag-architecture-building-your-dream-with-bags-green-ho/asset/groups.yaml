    Inside the pantry we left the earthbags free of plaster, so it became a sort of
    “truth room.” We displayed some of the misprinted bags we had used.


    The interior plaster in Montecito was a thin coating of lime trowweled over the
    papercrete. This produced a bright white finish that was easy to repair with a
    touch of lime wash.


    I found a naturally curved tree branch that was perfect for the balustrade leading
    up to my office.


    Besides being my office, the loft in Montecito was our TV viewing room and occasional
    guest space.


    The square footage (or round feet, as we used to joke) of the entire house, including
    the loft areas, was around 1300. It ended up taking three years of my labor to
    accomplish, and was exceedingly satisfying. Visitors almost always commented how
    they immediately felt embraced by the space, with all of the curved features;
    there were virtually no sharp corners.


    This project was nearly complete when this photo was taken. The solar electric
    panels on the roof provided enough electricity to run all of our lights as well
    as our refrigerator/freezer. The space below them was reserved for solar thermal
    panels to heat our domestic water and the hot tub. In the lower right corner of
    the photo can be seen those thermal panels waiting to be installed.


    The total cost of this house, including all of the major appliances but not the
    land, was about $35,000; this was finished in the year 2000. Then, as fate would
    have it, about five years later we ended up selling the house when we moved to
    Mexico for several years. By then, the papercrete finish on the exterior was beginning
    to show signs of erosion, especially flatter below the windows and on top of the
    vaulted entry and other flatter areas.


    At my recommendation, the new owners hired a stucco crew to resurface the entire
    structure with a tinted cement stucco. At the time of this resurfacing, special
    eyebrows were constructed over the windows, protecting them further. And custom
    round dual-pane windows replaced the original rectangular ones I had installed.


    Riceland was transformed into a charming guest cabin.


    I anticipate that this house will still be standing proud a century from now.


    # The Pond


    Peaceful Valley had a natural water channel dividing it that periodically ran
    water. We often thought it would be nice to take advantage of this and create
    a small pond by damming it. Eventually we decided to manifest this pond, and we
    chose earthbags as a way of making the dam.


    I knew that most dams gain their strength by forming a convex curve facing the
    impounded water, so I mimicked this in my placement of the earthbags. I also knew
    that it needed to be thickest at the base, so I did this by placing two rows of
    bags with a space between them that I filled with sand. As the dam gained height
    I tapered both rows of bags inward so that by the time I was at the top it became
    just one row of bags.


    This is the view of the dam from below. The large stones were used to help stabilize
    the dam and protect the bags and the plastic that covered them. At the deepest
    it was about five feet, which was deep enough to keep goldfish over winter.


    We lined the entire dam and pond area with black polyethylene to keep the water
    from just draining away into the sand. To protect the plastic we stacked stones
    or covered it with gravel.


    This pond became one of our favorite places to spend meditative time. It wasn''t
    long before frogs and water-loving insects found it. We stocked it with some tiny
    goldfish that grew and reproduced. All was serene until one day we had a deluge
    of rain that came down so hard and fast that several local streets were nearly
    washed away. That same brief storm brought so much sand and silt down the arroyo
    that it overwhelmed the little catch basin we had created to deal with it, and
    completely filled the entire pond so there was no water left there. The fish were
    gone, washed further downstream and likely never survived. What a pity... but
    at least we enjoyed it for those few years before the calamity. And the earthbag
    dam actually held firmly!


    # Carriage House


    One thing that Peaceful Valley lacked was a good workshop/garage and additional
    storage space. When we acquired a small RV after selling the bus, we needed a
    place to store it away from the weather; we needed a carriage house.


    After pondering our options for a while, we decided to order a pre-manufactured
    steel vault, similar to the old Quonset huts that were popular after the war.
    We found one deal online for a 16'' X 30'' unit for $2,000. The steel vault was
    placed on a stem wall, which was two bags thick. Once the steel vault was all
    bolted into shape, I bolted 2" X 10" wood joists across for the second floor.
    These joists served a dual function of also tying the vault so it couldn''t expand
    with the additional weight of all the bags on top. I placed the bags down into
    the troughs of each rib, working alternately on both sides to keep the forces
    balanced as I went up. Then I plastered it with papercrete (later cement stucco
    was added). This insulation was good enough that, even on hot days, I could touch
    the metal inside and it would feel cool. I built the end walls with recycled materials.
    The floor was fiber-reinforced concrete. The total cost of this 900 square foot
    building was about $5,000!


    Wait, a local spiritual group asked me if I could help them conduct a workshop
    that would provide some interest and exercise for participants of a week-long
    conference. Much of what the attendees would be doing was fairly sedentary, so
    I came up with a concept of having people build a kind of airbag monument on the
    property belonging to the group. We discussed various possible locations and architectural
    designs and eventually settled on a site where a natural hillside could be terraced
    in such a way to create seating for a kind of amphitheater. The stage for the
    amphitheater would also be a relaxing shade structure, a kind of focal point for
    folks to congregate or meditate. A gazebo or shade structure of this sort is known
    in Spanish as a “Gloreta,” so that is what we decided to call it.


    The sand used to fill the bags was dug out from the hillside while forming the
    terraces of the amphitheater, and the benches along the terraces were

