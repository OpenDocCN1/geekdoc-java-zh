    the loose scoria to pack into a kind of block that was solid enough to hold its
    shape. It wasn''t long before I got back to the height of where it was at the
    time of the collapse, and all was fine.


    My first attempt at making the buttresses surrounding the doorway, using a stack
    of single bags on top of each other, was too wobbly. So I tried using this pattern
    of two bags placed side by side in an alternating crossh pattern, and this was
    much more stable. As I was building the buttresses, I inserted wooden blocks with
    half inch threaded rod bolted through them, and the rod sticking out between the
    bags.


    This allowed me to eventually fasten the wooden door frame securely to the buttress.


