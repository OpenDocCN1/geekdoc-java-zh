  - '[PAGE 79]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_79_0.png)


    We found some culvert couplers that we used as forms to create round windows in
    this little dome. They were just as wide as the bags and got solidly locked into
    the wall as the bags pressed against the corrugated surface.


    You might notice that with this dome I was tying twine around the bags as placing
    the barbed wire between them. This was an attempt to make the wall even more monolithic,
    and I thought that the extra twine would help hold the plaster to the wall. I
    later dispensed with this, deeming it unnecessary.


    One day while I was happily carrying buckets of sand up a ladder to fill the bags
    in place, my eye caught a discrepancy in the perfectly circular aspect of the
    top row of bags. I thought this was strange since I was sure I had checked that
    course with my pole. As I stood on top of the wall I felt movement beneath me
    and I could see that the wall was caving in! I immediately jumped outside the
    dome to be safe and watched as almost the entire structure imploded to the ground.
    It was like watching a slow motion wave in action, proceeding from one side of
    the wall around to the other.'
  - '[PAGE 80]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_80_0.png)


    Yikes! I was safe, but it was a major calamity; a tangled mess of bags, sand,
    barbed wire, bent ladder and culvert couplers. The buttresses at the doorway kept
    that part from collapsing, and the wall up to about a yard high was OK. But what
    had gone wrong?


    It took days for me to clean up the mess, and my confidence was severely shaken.
    I had plenty of time to ponder the problem and ultimately realized that my mistake
    was to use the native sand, which was very fine and slippery... a true shape shifter.
    Basically, once I got high enough up the wall, gravity dictated that it was going
    to pull the wall down by shifting the sand in the bags. This is why it is so important
    to use a fill material that will consolidate into a more solid mass when erecting
    a dome. Now I know!'
  - '[PAGE 81]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_81_0.png)


    My intention all along was to use crushed scoria to fill the bags for our dome
    home, because it is lightweight, mined locally, and provides fairly good insulation
    due to all of the trapped air in the voids of this volcanic stone. So at at this
    point with Riceland, we decided to switch to filling the bags with scoria and
    see if it would actually work well as a fill. But first I made a tiny dome with
    the scoria to test the theory. The photo shows me me smiling inside the completed
    test dome, and I was confident enough to proceed with reconstructing Riceland.


    Working with the scoria was actually much easier, due to its lighter weight. I
    could fill the bags on the ground and easily carry them to the wall, since each
    bag only weighed about 35 pounds. I carefully tamped the courses in place to get
    the loose scoria to pack into a kind of block that was solid enough to hold its
    shape. It wasn''t long before I got back to the height of where it was at the
    time of the collapse, and all was fine.'
  - '[PAGE 82]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_82_0.png)


    My first attempt at making the buttresses surrounding the doorway, using a stack
    of single bags on top of each other, was tooobbly. So I tried using this pattern
    of two bags placed side by side in an alternating crossh pattern, and this was
    much more stable. As I was building the buttresses I inserted wooden blocks with
    half inch threaded rod bolted through them, and the rod sticking out between the
    bags.'
  - '[PAGE 83]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_83_0.png)


    This allowed me to eventually fasten the wooden door frame securely to the buttress.'
  - '[PAGE 84]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_84_0.png)


    When I got up to the height of the top of the door it was time to set up a form
    for an arched window over the door. I proceeded to fashion the arch as'
  - '[PAGE 85]


    described earlier in the section about building arches, using single bags laid
    over the form.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_85_0.png)


    The plan was to build a half loft in the upper part of the dome that could be
    used for sleeping or additional storage space. I framed this loft by simply laying
    2 X 6 inch joists all the way across the dome and resting them on the top of the
    wall. I used wooden shims to assure that the loft was level and in one plane.
    Then I filled in the spaces between the joists with more bags of scoria. I noticed
    that as soon as I had the loft framing locked into place, the whole structure
    became rigid and didn''t vibrate as much as when I walked around on the top bags.'
  - '[PAGE 86]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_86_0.png)


    As I neared completion of the top of the dome I inserted a couple of vents. The
    first was a section of insulated stove pipe for an eventual wood stove if'
  - '[PAGE 87]


    needed. The other was a section of 8 inch PVC pipe to serve as an air vent right
    at the apex. How satisfying it was to place those final bags and have the dome
    completed!


    Around the time that we were building Riceland I had taken a workshop with Mike
    McCain, one of the inventors of papercrete, and I was intrigued with its potential
    as a plaster over earthbags. Papercrete is essentially scrap paper that has been
    turned into a pulp, mixed with Portland cement, and allowed to cure.'
  - '[PAGE 88]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_88_0.png)


    It is necessary to somehow mechanically mix the paper slurry to return the fibers
    to a pulp and mix in the cement. This can be done in a kitchen blender, but to
    make enough papercrete to plaster an entire dome would require a huge industrial
    blender. So I made one using a 55 gallon plastic drum, a threaded rod spindle
    suspended down the middle of it with bushings at either end to keep it stable.
    At the lower end of the rod I fabricated a steel cutting blade, and on top, above
    the barrel, I attached a small electric motor. I cut a hole in the top of the
    barrel large enough to'
  - '[PAGE 89]


    insert the paper and cement, and at the bottom I put in a 4 inch drain with a
    threaded plug. Then I was set to give the thing a whirl.


    First I filled the barrel about half full of water, then I started to drop strips
    of turn up newspaper that had been soaking in water over night. I found that if
    I didn''t feed it too quickly the motor could handle shredding it into a slurry.
    The more paper I added, the thicker the slurry got. When it was getting pretty
    thick, I would add about one large shovel full of dry Portland cement and let
    it thoroughly mix.


    This slurry then needed to be drained of excess water to make the wet papercrete
    thick enough to be able to apply it as a plaster. I did this by dumping it into
    a drain box set up below the drain plug in the mixer. You can see this drain box
    on its side in the photo. The bottom of the box was a synthetic mesh screen that
    was fine enough to keep the paper fibers from passing through, but the water would
    just seep away. Interestingly, this excess water was perfectly clear, as the paper
    fiber held all of the cement particles like a filter.'
  - '[PAGE 90]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_90_0.png)


    After the water had drained for about half an hour or so, the papercrete was ready
    to apply. We would take bucketfuls of the stuff over to the wall and place it
    by rubber gloved hands directly onto the bags. It was a very plastic, clay-like
    substance that was easy to manipulate this way.


    We didn''t use any wire mesh for plaster at this point, and found that it was
    sufficiently adhered when it was pushed into all of the crevices between the bags.
    You can tell that the wet papercrete is darker than after it cures some.'
  - '[PAGE 91]


    It takes papercrete at least a week to cure as it slowly dries out. Then if it
    gets wet again it will absorb a great deal of moisture, rather like a sponge.
    In most applications this can make it problematic as a plaster, but in this case,
    with the bags of scoria, we found that the papercrete would not pass the moisture
    through the wall to the inside; it would simply get damp and dry out out to the
    atmosphere, especially in that rather arid Colorado climate. Also, interestingly,
    the papercrete didn''t seem to expand or contract with moisture or freeze/thaw
    cycles.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_91_0.png)


    I bought quite a bit of double pane glass as seconds rather cheaply from local
    glass shops; they end up with lots of this as customer returns or miss-sized glass.
    All I cared was that the glass was big enough to cover the intended opening, so
    the exact size didn''t matter. Above I was fitting the'
- md: '

    glass over the opening while the papercrete was still wet, so that I could score
    around the glass and dig out enough papercrete to embed it in place. Later, after
    the papercrete had cured I would caulk around the glass.


    ## Bedroom


    Having successfully completed one small dome, Rosana and I felt confident enough
    to proceed with beginning the construction of our actual house. We waited until
    the next spring to embark on this, retreating to a warmer southern region to winter
    in our bus home.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_93_0.png)


    This time we started right out filling the bags with scoria. In fact, we realized
    that, given how well the native sand drains, there was really no need for the
    rubble trench foundation. Instead, we spread about 6 inches of scoria (the red
    stone you can see in the above picture) over the entire footprint of the dome.
    We did this primarily to help insulate the floor itself from the ground below.


    Rather than placing tarps over the walls, this time we stretched tarps over the
    entire dome to create a shade structure. This served well, except in windy weather
    we often had to make repairs, so it may have created more work for us.


    In the photo you can see someone fitting a bag over the metal funnel (part of
    a chicken feeder) that we used to fill the bags. The rows of bags behind him are
    already filled with scoria and waiting to go up on the wall.


    For this bedroom dome we made the interior diameter 16 feet, a little larger than
    Riceland. It also had a loft framed over part of it with bags of scoria placed
    between the joists. A culvert coupler served as a window opening. Part of the
    exterior wall had already been plastered with papercrete.


    On the far side you can see a very large arch, spanning 6 feet, that we tried
    to make by stacking single bags over a temporary form that was made by just stacking
    more bags underneath it in the shape that we wanted. We soon discovered that we
    made several mistakes in doing this. The first mistake was thinking that single
    bags forming a semicircular arch that spans 6 feet would be sufficiently strong
    to hold its shape.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_95_0.png)


    As you can see in the above photo, we had a massive failure of that arch, causing
    the adjacent walls that were connected to it to collapse. Obviously, that method
    of making an arch spanning that distance needed to be improved upon.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_96_0.png)


    It was at this point that I came up with the double crosshatch method of forming
    an arch, as suggested earlier in my discussion about making arches. This was actually
    an extension of the idea of making the buttresses that flanked the door by also
    using double crosshatch bags. These two approaches work well together, since the
    arch is provided with a very solid and wide platform to be launched from.


    In addition to doing this, I made a new wooden arch form that was more of a Gothic,
    pointed arch. The combination of these two changes created a very secure arch
    indeed, and I used this same method in several other locations while building
    this house.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_97_0.png)


    We wanted an opening that spanned 6 feet because our plan called for a large sliding
    glass door in the bedroom to enhance the passive solar heating potential for that
    room. We bought commercial vinyl doors and a half-round window to match it and
    embedded these in the papercrete plaster.


    We also wanted an openable window in the bedroom for ventilation, so we bought
    a matching small sliding window with a half-round above it that is visible left
    of the door in the photo below. Like with Riceland I placed an 8 inch PVC pipe
    vent at the very top of the dome as an exit air vent.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_98_0.png)


    By the time that the snow began to fly we had the bedroom snugly plastered and
    ready for winter. A three foot wide doorway was prepared that would lead from
    the bedroom into the rest of the house, but since we needed to leave it over winter,
    we bagged up that doorway and put a temporary plaster over it.


    ## Montecito


    The next building season brought us to the most complex and challenging portion
    of this monumental project. This was the large oval dome that would comprise our
    kitchen/dining/living room/and loft office. It measured roughly 20 feet on the
    short axis and 30 feet on the long axis. It was positioned about 20 feet away
    from the bedroom dome, and like the bedroom, would have a six foot glassed entry,
    as well as several circular windows for passive solar heat.


    Soon after we started the construction we came up with the name “Montecito” for
    this dome, which means “little mountain” in Spanish, because we realized that
    the dome itself would be a veritable mountain of bags.


