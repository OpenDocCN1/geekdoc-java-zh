    buckets or shovel of material and save your back. A full bag of soil can easily
    weigh over 100 pounds, making the job of carrying or lifting arduous.


    Since the bottom of the bag has been sewn closed, it is best to place the bottom
    toward any opening in the wall to assure that nothing will tend to spill out.
    The simplest way to close the top of the bag is to leave enough space at the top
    to be able to fold the bag so that it will be compressed against the previously
    laid bag; about 8 to 10 inches is sufficient to do this. This wastes some potential
    length of the bag for filling, so you might prefer to physically close the bag
    at the top. If that seam will be pushed up against another bag, a simple way to
    close it is to fasten it with nails, wire or cord staples.


    Using the full length of the bag has the advantage that the longer bags will have
    space to overlap each other when laid in the preferred running bond pattern that
    is typical in laying brick walls. This makes for a more stable wall, and of course
    ultimately uses fewer bags to construct the wall.


    In some circumstances, both ends of the bag might be exposed and need to be securely
    closed. I have done this by actually heming the top and sewing it with heavy thread,
    using very wide stitches. Another method that may be faster, is to use metal wire
    that is stiff enough to simply jab it through the hemmed seam in several places
    and fold over the end of the wire to secure it.


    Before closing the bag fill at the top can be tapered that it will conform to
    any angle formed by the arc of a small diameter circle to make a closer fit between
    two adjacent bags. Also it helps to push a bit on both sides of the bag at the
    top so that it is easier to fold or fasten the bag material. This all becomes
    second nature once you get into the swing of the work pattern.'
  - '[PAGE 34]


    When filling bag in place on the wall, I usually place the bottom of the bag about
    where it will eventually be, so that once it is full and secured at the top, it
    can be simply pushed over to align it with the previously laid bag. This way there
    is no need to lift that heavy bag at all. A bit of pushing with your hands or
    feet will snug the bags into place so they can be tamped later.'
  - '[PAGE 35]


    # Tamping the Bags


    To consolidate the fill material and flatten the bags in place they need to be
    tamped soon after being laid. I usually wait until I have laid several, or even
    a whole course of bags, before doing this, since once you are there tamping it
    is easier to do a whole section at once.


    Stomping on the bags with your feet can do some tamping, but it is much more efficient
    and thorough to use a special tamping device. These can be purchased in some hardware
    stores, or fabricated in various ways.


    My favorite tamper is home made, with a metal pipe handle welded to a scrap piece
    of heavy steel. The weight of this tool is an advantage, because it adds to the
    downward tamping thrust; it is a bit heavier to lift, but I find it takes less
    effort than always putting force into the downward thrust. The tamping blade is
    about as wide as a standard bag, so each tamping action will do maybe 25% of the
    bag. The commercial tampers usually aren’t as wide so they need to be moved around
    more to do the job.'
  - '[PAGE 36]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_36_0.png)


    Another approach to making your own tamper is to embed a long handle in a large
    can of wet cement and let it cure, creating a heavy circular tamper. I have never
    used one of these, but I think they may not do as good as a job because they tend
    to make small circular indentations that would not be as uniformly flat, and definitely
    would take more tampering per bag to do a good job.


    Some people like to also tap the sides of the bag to make the wall flatter, which
    takes less plaster to cover. I haven’t done this because I kind of like'
  - '[PAGE 37]


    the deeper crevices between the bags to help key in the plaster. It is partly
    an aesthetic thing, depending on whether you like smoother walls or don’t mind
    some uneven variation in the surface of a wall.'
  - '[PAGE 38]


    # Barbed Wire


    In most circumstances it is best to place barbed wire between each course of earthbags,
    ideally two strands of 4-pronged barbed wire placed parallel to each other. There
    are several reasons for doing this. First of all, the barbs on the wire tend to
    catch into the fabric of the bags, essentially stitching the two together into
    a more monolithic structure. The other main reason is that the wire provides tensile
    strength that the bag wall would lack without. This is especially important for
    dome structures, because they exert strong outward pressure on the bags from the
    weight of the bags above pressing downward and outward.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_38_0.png)


    In general, the barbed wire holds everything together into a uniform matrix that
    resists the component bags from dislodging.'
  - '[PAGE 39]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_39_0.png)


    Barbed wire is nasty stuff to work with. It has a mind of its own and can gouge
    your hands easily. I always use heavy leather gloves when working with it and
    give lots of respect. It helps to unwind enough wire from the spool to fit the
    desired place in advance, and then carefully bend it into a more or less straight
    line before placing it on the wall. Then, as shown in the photo, you can use stones,
    bricks, or other heavy objects to keep it where it should be on the course of
    bags. This should be done for the entire section of wall before going to lay more
    bags on top of it.


    To make it easier to position each bag perfectly into place, a metal “slider”
    can be very handy. This is a piece of sheet metal cut to approximately the size
    of a bag, with a 90 degree grip handle on one end. The idea is to put this slider
    over the barbed wire in the area where the next bag is to be placed. Then, once
    the bag has been filled and laid down into its intended location, you can hold
    the bag in place with one hand and yank on the metal slider to remove it and allow
    the bag to drop into place. That is'
  - '[PAGE 40]


    the theory, and it usually works pretty well. Otherwise, the bag will inevitably
    fall a little off from where it needs to be and then be stuck on the barbed wire
    and impossible to move without picking it up, which is a real nuisance.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_40_0.png)


    The times I have dispensed with placing barbed wire between the bags is when I
    believe that the laws of gravity will prevail and keep a wall from pulling apart.
    An example of this is with an underground pantry that I made with outwardly inclined
    walls below grade. I figured that gravity was going to keep those walls inclined
    no matter what. Another example is with a small underground dome where the inward
    pressure of the surrounding soil would counteract the outward pressure of the
    dome itself, and the whole thing would be kept together by compression.'
- md: '

    ## Protect the Walls


    I have mentioned that polypropylene will degrade when exposed to the ultraviolet
    in sunlight, even with UV resistant bags. For this reason it is of paramount importance
    that the bags be protected from this hazard as much as possible. I can''t stress
    this enough; I have answered countless emails from folks who discovered that their
    bag walls were disintegrating because they left them exposed too long. It only
    takes a few weeks for this to start to happen, and after a while you can literally
    poke your finger through the material.


    At times I have stretched tarps over projects and tied them to provide shade during
    the day. This can be quite effective, but difficult to keep in place when a stiff
    wind comes up and wants to sail the thing away. A somewhat more secure approach
    is to place the tarps directly over the wall and place weights to hold them into
    place. This way you can remove the tarp from just the section of wall that you
    are working on and then replace it when you are finished.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_42_0.png)


    At times I have started to apply an initial plaster on the wall even before it
    is finished, just to help keep the sun away from that vulnerable material.


    I have heard of folks using old paint to give a temporary protective coating to
    their earthbags once the wall has been erected, and I''m sure that this helps.


    Once the wall is totally covered and cannot be seen by the sun, the bags should
    last for a very long time. Nobody really knows how long they will last because
    the synthetic material has not been in existence long enough to find out. Tests
    have shown that polypropylene is not degraded by water or most chemicals. I have
    gone back to interior walls that were left unplastered for nearly two decades,
    and they seem as strong, pliable and bright as the day I put them there. And once
    I dug down to check some earthbags that had been used as part of a dam for a pond
    and were protected by heavy plastic and stones; although some tree roots had managed
    to infiltrate some of the bags, the poly material itself was as supple as ever.


    ## What Shapes are Possible?


    Earthbag building is quite versatile but there are some inherent limits to what
    is reasonably attempted. Vertical walls, whether curved or straight are always
    possible, although straight ones may require buttressing (discussed later). Curved
    vertical walls tend to be more stable because they are self-buttressing.


    The potential height of vertical walls is governed by the same ratio that applies
    to other earthen wall systems. Wall height : thickness at the base is at least
    10 : 1, so an earthbag wall that is 15 inches wide at the base should be no taller
    than 150 inches, which is 12.5 feet. If you want to go higher than that you need
    to use wider bags, at least at the bottom of the wall.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_44_0.png)


    What about two story buildings that have vertical walls? It is possible, but they
    would have to be very carefully engineered. Above is pictured one concept for
    a two story building that was suggested by an engineer and might pass code in
    some places. You can see how the first story is wider than the second, and how
    steel anchors wrap the entire second story wall and are embedded in concrete bond
    beams at the top of each story’s wall. In general, it is best to stick to one
    floor for most vertical walled earthbag buildings.


    Domes are commonly built with earthbags, both simple isolated domes and complex
    interconnected ones. There is a limit to how large a diameter could be without
    compromising the integrity of the dome; this limit seems to be around 6 to 7 yards
    or meters. It is best to stay with circular dome patterns; I did make a large
    elliptical dome once, but had a lot of trouble keeping it stable, as you will
    read later.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_45_0.png)


    Hemispherical domes are only possible with some extra supporting structure to
    help keep that shape. I once designed one with a wooden geodesic substructure
    that worked pretty well.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_46_0.png)


    A better shape for a self-supporting dome is a catenary arch, or something that
    resembles this. A catenary arch is often described as the shape that a suspended
    chain takes when the two ends are held out at the same level; if this shape is
    then inverted you have the shape of a catenary dome. The diagram shows one way
    to approach this shape that I have successfully built several times.


    There is a common misconception that an airbag vault, or tunnel with an inverted
    U-shape, would be easy to make and quite stable. In reality this is a shape that
    should be avoided, except in very small widths (perhaps no larger than 6 feet
    wide). The reason for this is that without massive buttressing, the outward pressure
    of the bags on the upper part of the vault on the lower portion can easily distort
    the shape enough for the top to collapse, posing a considerable hazard. Nader
    Khalili did make some vaulted structure using earthbags as vertical stem walls
    on the sides, but the vaulted portion was actually made with ferrocement.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_47_0.png)


    I once built a vaulted structure the vaulted portion was actually made with ferrocement.
    I will describe this later in the book.


    ## Buttressing


    Certain types of walls are not sufficiently stable on their own and require some
    help. In general, circular or curved walls are inherently stable enough not to
    require buttressing. This is why wandering or serpentine fence walls are so strong;
    they just don''t want to tip over, even with lateral pressure. Round houses can
    envelop a very large space without any interior partitions or external buttresses
    for this reason.


    Straight walls usually require buttressing to help stabilize them with some form
    of buttressing. A buttress is basically a short segment of wall that is attached
    to the wall, usually at a 90 degree angle, to keep it from toppling. The buttress
    needs to be integrally connected to the wall so they can''t separate.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_48_0.png)


    It can be advantageous for buttresses to be placed near wall openings, like doors
    and windows, to help stabilize them. The buttresses only have to extend a few
    feet outward from an exterior wall to be effective. And they don''t really need
    to go all the way to the top; perhaps 2/3 of the way up the wall is sufficient.
    These buttresses can taper as they go up; in fact they can provide a decorative
    style, like those pictured with the stepped buttress on the circular structure.


    It is not uncommon to see plans that have buttresses at the corners, like the
    one above. I think this is partly stylistic and partly because it was found that
    adobe buildings, the corners were vulnerable to earthquake damage and buttresses
    helped that. With earthbags, the corners can be reinforced with steel rebar stakes
    driven into the corner from the top of the wall. For this reason I think that
    corner buttressing is unnecessary.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_49_0.png)


    Domes may require an interior buttress at the doorway that allows a vertical door
    to be installed. Either this, or an external vault or roofed area needs to be
    arranged to make it possible to install the vertical door.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_50_0.png)

