    of the bags on the upper part of the vault on the lower portion can easily distort
    the shape enough for the top to collapse, posing a considerable hazard. Nader
    Khalili did make some vaulted structure using earthbags as vertical stem walls
    on the sides, but the vaulted portion was actually made with ferrocement.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_47_0.png)


    I once built a large vaulted structure that was lined with earthbags, but the
    basic structure underneath was a commercial steel Quonset building. I will describe
    how I did this later in the book.'
  - '[PAGE 48]


    # Buttressing


    Certain types of walls are not sufficiently stable on their own and require some
    help staying vertical. The common way to stabilize them is with some form of periodic
    buttressing. A buttress is basically a short segment of wall that is attached
    to a longer wall, usually at a 90 degree angle, which keeps the major wall from
    any tendency to topple sideways. The buttress needs to be integrally connected
    to the wall it supports so that the two can''t separate. A well designed buttress
    can work either inside or outside of the wall it supports; this means that interior
    partition walls can also act as buttresses.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_48_0.png)


    It is usually straight walls that need buttressing because they can easily topple
    if they aren''t. With earthbags, we usually advise that any straight wall longer
    than about 10 feet could benefit from being buttressed. In the above plan the
    exterior planter boxes are partially enclosed with tapered buttresses.


    It is not uncommon to see plans that have buttresses at the corners, like the
    one above. I think this is partly stylistic and partly because it was found that
    with adobe buildings, the corners were vulnerable to earthquake damage and buttresses
    of this sort helped remedy that. With earthbags, the corners can be reinforced
    with the barbed wire that actually turns the corners, and'
  - '[PAGE 49]


    with vertical steel rebar stakes driven down into the corner from the top of the
    wall. For this reason I think that corner buttressing is unnecessarily redundant.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_49_0.png)


    It can be advantageous for buttresses to be placed near wall openings, like doors
    and windows, to help stabilize them. The buttresses only have to extend a few
    feet outward from an exterior wall to be effective. And they don\u27 really need
    to go all the way to the top; perhaps 2/3 of the way up the wall is sufficient.
    These buttresses can taper as they go up; in fact they can provide a decorative
    style, like those pictured with the stepped buttress on the circular structure.


    In general, circular or curved walls are inherently stable enough not to require
    buttressing. This is why wandering or serpentine fence walls are so strong; they
    just don\u271 want to tip over, even with lateral pressure. Round houses can envelop
    a very large space without any interior partitions or external buttresses for
    this reason.'
  - '[PAGE 50]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_50_0.png)


    Domes may require an interior buttress at the doorway that allows a vertical door
    to be installed. Either this, or an external vault or roofed area needs to be
    arranged to make it possible to install the vertical door. The above photo shows
    two different styles of creating an interior buttress.'
- md: '

    # Openings


    Doors and windows provide challenges for the integrity of an earthbag wall. Any
    opening creates a place where the matrix of the wall is torn, so to speak, and
    the edges of the opening need to be stiffened. There are various ways to accomplish
    this stiffening.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_51_0.png)


    Doors can be made rigid by creating a metal or wooden frame around them that is
    integrally connected to the earthbag wall. This “door buck” can then be used for
    attachment of the door itself. One good way to connect the door buck to the bags
    is to provide periodic anchor plates within the wall as it is being erected. These
    can be plywood or metal plates that either have a piece of wood attached at one
    end or metal edge turned 90 degrees. A bunch of nails can be driven through them
    in both directions that get embedded into the bags below and above them. The wood
    or metal edge is exposed in the doorway in the same plane as the door buck to
    which it can be attached. Window bucks can be created and attached in the same
    manner as door bucks.


    A simple door or window buck may not be sufficiently strong on the top of the
    frame to support the weight of the wall or roof that may be above it. It is important
    to make sure that an adequate “header” be provided to support such weight larger
    beam of wood that is wide enough to support the bags. In some cases, when the
    top of the door or window is quite close to the top of the wall, then this beam
    itself will act as a sufficient header. Another way to deal with the weight of
    the wall above a door or window is to make an arched opening.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_52_0.png)


    Windows can be created in shapes other than rectangular, such as circular or triangular.
    In this case it is possible to insert an appropriate frame for these shapes as
    the wall is being built, with the bags jammed against them. I have done this with
    various diameter sections. A simple triangular shape can be made of wood to frame
    a window, like shown in the photo. In addition to stiffening door and window openings
    with frames, it is a good idea to drive metal rods or rebar stakes through the
    bags near the edge of the opening in such a way that they avoid hitting any anchor
    plates within the walls. This stake can eventually be incorporated into the bond
    beam at the top of the wall.


    I might caution that with earthbag domes you need to be careful not to riddle
    them with too many windows or doors. Because domes rely on barbed wire for the
    tensile strength of the walls, too many perforations can compromise this and introduce
    weaknesses into the wall. Sometimes it is not convenient to use operable windows
    with earthbag projects, so another way to introduce good ventilation may be necessary.
    I have done this by using pipes placed in strategic places, both low and high.
    A section of large diameter pipe can serve this purpose; I have used both metal
    and plastic for this. Such a vent placed at the apex of a dome can create a considerable
    draft when opened as well. One simple way to provide closures for these is to
    use an inflated ball that fits the pipe.


    While on the topic of openings, I might mention that once a wall is completed,
    it is rather difficult to go back and retrofit a wall with either a door or window.
    Cutting through an earthbag wall can be messy and even hazardous. For this reason,
    I advise you to frame in any door or window spaces that you expect you may need
    at some future time during the construction phase. These can be finished so that
    they may not be noticeable, but you will know they are waiting there if necessary.


    # Arches


    The use of arches can be an effective and elegant way to create and stabilize
    wall openings. I have seen a variety of ways of doing this, but almost always
    they employ some form of temporary support while building the arch. These arch
    supports can be built from any rigid material in the shape that you want the final
    arch to be. Once the support is released it is available for use in some other
    location.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_54_0.png)


    The above arch form was made from two pieces of plywood cut to a half-round shape
    and connected together with short lengths of 2x4 inch wood strips. It was then
    clamped to the top of the door buck that was already in place. It is most convenient
    if the form is initially secured in such a way that it is easy to knock out some
    spacers that will allow the form to lower enough to be able to pull it out and
    away from the arched bags. Otherwise, the weight and friction of the bags on the
    form can make this difficult.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_55_0.png)


    I have found that half-circular arches work fine for spans up to about three feet,
    but much wider than that they seem vulnerable to collapse. For wider spans up
    to six feet I think that the pointed gothic arch form is more secure.


    A simple radial pattern of stacking the bags, like that shown in the first photo
    is common. In doing this it is obviously necessary to fasten the top of the bags
    very securely so there is no possibility of spillage. The way to stack the bags
    is alternately from both sides until there is space for one “capstone” bag, which
    must be firmly tamped into place to assure that compression won’t later dislodge
    it.


    Before attempting to remove an arch form, it is best to build up the walls on
    both sides of it to the point where there is no possibility of any sideways movement
    of the bags comprising the arch. In fact, if the arch is built along the wall,
    it is possible to run the barbed wire between the arch bags and the wall bags,
    thus securing the whole assembly as a unit.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_56_0.png)


    You will notice that the photo to the left shows a different pattern of stacking.
    In fact I found, as shown in the model above, such an arch can remain unsupported
    by the walls. When using long tubular bags filled with material, it is possible
    to make arches in a different way. These still utilize a form to build the arch,
    but the method can be simplified. The photos show approaches that create arches
    of the same thickness as the wall. Either the single or double bag method can
    also create eyebrows over the opening.

    '
  mdcn: '


    # 开口


    门和窗户给土袋墙的完整性带来了挑战。任何开口都会导致墙体的结构（某种程度上）被撕裂，因此开口的边缘需要进行加固。有多种方法可以实现这种加固。


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_51_0.png)


    通过在门周围创建一个金属或木质制成的框架，并将其与土袋墙整体连接，可以使门变得刚固。这个“门框（door buck）”随后便可用于安装门本身。将门框与土袋连接的一种好方法是在砌墙过程中在墙内定期提供锚固板。这些板材可以是胶板或金属板，其一端连接有一块木头，或者金属边缘转了
    90 度。可以从两个方向向它们钉入许多钉子，使其嵌入上方和下方的土袋中。木头或金属边缘暴露在门洞口，与门框处于同一平面，从而可以安装在门上。窗框也可以以门门框的方式制作并安装。


    简单的门或窗框在框架顶部可能不够坚固，无法支撑上方可能存在的墙或屋顶的重量。重要的是确保提供足够的“过梁（header）”来支撑这种重量，即一根足够宽以支撑土袋的粗大木梁。在某些情况下，当门或窗的顶部非常靠近墙顶时，这根梁本身就可以充当足够的过梁。处理门窗上方墙重量的另一种方法是制作拱形开口。


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_52_0.png)


    窗户可以制作矩形以外的形状，如圆形或三角形。在这种情况下，可以在砌墙时为这些形状插入合适的框架，并将土袋挤压在上面。我曾对不同直径的截面这样做过。可以用木头制作一个简单的三角形作为窗户框，如照片所示。除了用框架加固门窗开口外，另一个好是在开口边缘附近的土袋中插入金属杆或钢筋桩，使它们避开墙内的任何锚固板。这些桩最终可以整合到墙顶的构造梁（bond
    beam）中。


    我可能需要提醒，对于土袋圆顶，需要小心不要在上面布太多的窗门。因为圆顶依靠铁丝丝提供墙的抗拉强度，过多的孔会损害这种强度并给墙体引入弱点。有时在土袋工程中使用可开启的窗户并不方便，因此可能需要另一种引入良好通风的方法。我曾通过在战略性的高位置位置管道来实现。一段大直径管道可以达到此目的；我既用过金属也用过塑料。位于圆顶顶部的通风口打开时可以产生相当的对流。为这些口密封的一种简单方法是使用与管道匹配的充气球。


    说到开口话题，我想提到，一旦墙完成后，想要回过来改造墙以安装门或窗是非常困难的。切开土袋墙可能会非常混乱，甚至很危险。因此，我建议你在施工阶段就为你预计未来某个时刻可能需要的任何门窗空间预留框架。这些空间可以进行处理，使其不明显，但如果需要，你会知道它们就在那里候着。


    # 拱


    使用拱是创建和稳定墙体开口的一种有效且优雅的方法。我见过许多这种方法，但几乎总是在建造拱时采用某种形式的临时支撑。这些拱支撑可以用任何刚性材料制成，形状取决于你想要的最终拱形状。一旦释放支撑，它就可以在其他地方使用。


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_54_0.png)


    上面的拱形是由两块切割成半圆形状的胶板制成的，并用短的 2x4 英寸木条连接在一起。然后将其夹紧在已经就位的门框顶部。最方便的方法是最初将模板固定，这样很容易敲掉一些垫块，让模板下降足够低，以便将其拉出并从拱形土袋处移开。否则，土袋对模板的重量和摩擦力会让这变得困难。


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_55_0.png)


    我发现半圆拱在约三英尺的跨度内效果良好，但比这宽得多的跨度它们似乎容易坍塌。对于六六英尺的宽跨度，我认为尖哥特式拱形更安全。


    堆叠土袋的简单径向图案（如第一张照片所示）很常见。在这样做时，显然必须非常牢固地固定土袋顶部，以确保没有溢漏。堆叠土袋的方法是从两侧交替堆叠，直到有空间放置一个“盖石”袋，这块袋必须被牢固地压实到位，以确保压力以后不会将其移位。


    在尝试移除拱模板之前，最好在拱的两侧砌好墙体，直到构成拱的土袋没有任何侧向移动的可能性。事实上，如果拱是沿着墙的，可以在拱袋和墙袋之间绕过铁丝网，从而将整个组件作为一个单元固定起来。


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_56_0.png)


    你会注意到左侧的照片显示了不同的堆叠模式。事实上我发现，如上面的模型所示，这种拱可以在没有墙体支撑的情况下存在。当使用填充材料的长管状土袋时，可以用不同的方法制作拱。这些方法仍然利用模板来建造拱，但方法可以简化。照片展示的方法可以创建出与墙厚度相同的拱。单袋法或双袋法也可以在开口上方创建过眉石。


    '
