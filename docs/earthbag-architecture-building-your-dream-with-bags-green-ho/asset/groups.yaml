    ## Finished Interior


    Creating the shell was only half the work, as the interior details took several
    years to realize. This view of our bedroom shows the earthbag staircase that ascends
    to the loft. The finish in the bedroom was smoothed papercrete that had been given
    a staining wash of latex paint.

