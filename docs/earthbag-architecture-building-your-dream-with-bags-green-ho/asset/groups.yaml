    # # Introduction


    In 1996 my wife Rosana and I were traveling around the Southwestern United States
    in a 40 foot bus I had converted into a traveling home and video production studio.
    I was collecting information and video footage for a documentary program called
    A Sampler of Alternative Homes: Approaching Sustainable Architecture. Somebody
    I talked to asked me, "Have you heard of airbag building? I hadn''t, but I was
    determined to find out more about it, as it seemed like it should be covered in
    my program.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_6_0.png)


    I soon discovered that an Iranian born architect named Nader Khalili was responsible
    for promoting the idea of making buildings by stacking bags, or tubes, filled
    with soil. He called this technique Superadobe. I arranged to meet him at his
    experimental compound, CalEarth (The California Institute of Earth Art and Architecture),
    in the California desert, to get a first hand introduction to the building technique.
    There I found an interesting collection of odd-shaped structures, mostly fashioned
    by stacking coils of large plastic tubing filled with soil. Khalili himself was
    a charismatic visionary with the zeal and drive to manifest his visions.


    Around this time, I also visited a former student of Khalili''s institute, who
    had built herself a small domed house and art studio using the Superadobe technique
    in Arizona, and footage of her explaining how she and her son had done it was
    used in the video program.'
  - '[PAGE 7]


    As we roared around the American Southwest in our bus, we were always looking
    for beautiful places where we could park, and possibly develop landing pads for
    recurrent visits. One such spot turned up at a high alpine valley in Southern
    Colorado. The scenery was spectacular and the land was cheap, so we bought a small
    bit of acreage that actually had water, sewer, and electricity within easy range
    for hooking up.


    The only hitch with just parking our bus there and enjoying life was that the
    property association that governed what could be done on the land had rules that
    expressly denied this. It would be possible to live in our bus while building
    a house, however, so we started to think about doing that. My mind went back to
    the earthbag building I had seen, and I convinced Rosana that we could design
    and build an experimental home with earthbags, and do so quite cheaply.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_7_0.png)


    Fortunately, beyond the regulations applied by the homeowners association, the
    county had not adopted restrictive building codes. This made experimental construction
    much more feasible. We designed a rather unusual plan that combined two domes
    with a central connecting space between them, and offered this to the committee
    that reviewed plans for the association. I was a little surprised that they accepted
    these plans without modification, so we were free to begin construction. I will
    describe the process of building this home in considerable detail later in the
    book.'
- md: '

    Since completing earthbag house (in about 2000), I have engaged in a number of
    other earthbag building projects, including a small dam for a pond, a large vault
    for a garage/shop/office complex, a small amphitheater project, a recessed pantry,
    and several independent small domes. I will describe all of this building as the
    story unfolds. I have learned a lot from all of this experience, that I will share
    with you.


    While I was building the earthbag house, I continued to collect video footage
    of the process of the actual construction, which took nearly three years. I eventually
    produced another video program (since converted to DVD) titled Building with Bags:
    How We Made Our Experimental Earthbag/Papercrete House.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_8_0.png)


    Around the time I finished building the earthbag home I started writing a series
    of articles for our local newspaper in Colorado about sustainable architecture.
    At a certain point I thought about combining these articles into a single book,
    but then realized a website devoted to the same topic might have more readers
    around the world. That is when www.greenhomebuilding.com was born and it continues
    to flourish to this day.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_8_1.png)


    As an adjunct to this successful website, I founded www.dreamgreenhomes.com to
    combine the talents of several green architects and designers into a marketplace
    for stock green home plans.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_8_2.png)


    One of these designers is Dr. Owen Geiger, who was a personal friend, and someone
    who was also bitten by the “earthbag bug.” We talked about doing a book together
    about earthbag building, but then opted to launch another website: http://www.earthbagbuilding.com.
    Owen has gone on to write a guide to earthbag building as well as a how-to-DVD
    on the topic.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_9_0.png)


    In tandem with the earthbag building website, we shared a blog on the same topic,
    that has now morphed into http://www.naturalbuildingblog.com. Owen does most of
    the blog posts for this, but I occasionally recount it as well.


    All of these resources combined offer a wealth of information, not only about
    earthbag building, but about sustainable architecture in general. You can find
    most of the books and DVDs mentioned available for purchase via the above websites.


    You can anticipate reading about the history of earthbag building in the next
    chapter. Then I will delve into the basics of what you need to know if you want
    to try your hand at building this way. After this I will describe in detail much
    of my direct experience with various projects. For years we have been publishing
    online information about the amazing variety of earthbag building that has been
    done around the world; now I will summarize some of this so you can understand
    how broad the scope of this revolutionary building technique is. On all of this,
    we can look at the basics of what is possible and suggest what the future of earthbag
    building might look like.


    Hopefully, by the time you have finished reading this book you will have a good
    idea of what can be done with earthbags, as well as some understanding of the
    basics for doing it. Of course nothing can replace direct experience, I encourage
    you to try your hand, starting with some small project, or participating in a
    workshop somewhere. Please bear in mind, however, that there are risks involved
    in any building. As you will read later, I have encountered many setbacks that
    I had to overcome, and some of these could have resulted in injury. Neither I
    nor Hartworks, Inc. will have liability for loss, damage, or injury, resulting
    from the use of any information found in this book. I hope that you enjoy the
    process of building as much as I have!


    # History of Earthbag Building


    The idea of making walls by stacking bags of sand or earth has been around for
    over a century. Originally sandbags were used for flood control and military bunkers
    because they are easy to transport to where they need to be used, fast to assemble,
    inexpensive, and effective at their tasks of warding off water and bullets. At
    first natural materials such as burlap were used to manufacture the bags; more
    recently woven polypropylene has become the preferred material of its superior
    strength.


    The use of sandbags has generally been associated with the construction of temporary
    structures or barriers. Using sandbags to build houses or permanent structures
    has been a relatively recent innovation.


    In 1976 Gernot Minke at the Research Laboratory for Experimental Building at Kassel
    Polytechnic College in Germany began to investigate the question of how natural
    building materials like sand and gravel could be used for building houses without
    the necessity of using binders to consolidate the material. The use of fabric-packed
    bulk material was found to be a cost-efficient approach. They used pumice to pack
    in the bags, because it weighs less and has better thermal insulating properties
    than ordinary sand and gravel. Their first successful experiments were with corbelled
    dome shapes (an inverted catenary) which was obtained with the aid of a rotating
    vertical template mounted at the center of the structure.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_11_0.png)


    In 1978, under Gernot Minke’s direction, a prototype house using an earthquake-proof
    stacked-bag type of construction was built in Guatemala. They used cotton bags
    soaked in lime-wash to protect the material from rot and insects. When flattened,
    the bags measured roughly 3 X 4 inches (8 X 10 cm). Vertical bamboo poles placed
    on both sides of the bags and interconnected with wire loops gave the stacked
    bags stability. The bamboo rods were fixed to the foundation and to the horizontal
    tie beam at the top.


    It was Iranian-born architect Nader Khalili who popularized the notion of building
    permanent structures with bags filled with earthen materials. Actually his first
    concept was to fill the bags with moon dust! Attending a 1984 NASA symposium for
    brainstorming ways to build shelters on the moon, Khalili coupled the old sandbag
    idea with the ancient adobe dome and arch construction methods from his homeland
    in the Middle East. He realized that bags filled with lunar “dirt” could be stacked
    into domes or vaults to provide shelter.


    Khalili came up with a further refinement on this building concept on Earth: for
    a permanent, shock-resistant structure, where no place stands for barbed wire
    between the courses of bags, thus unifying the shell into a more monolithic structure?


    At first Khalili was filling his experimental bags with desert sand, but then
    evolved his idea of Superadobe, where bags of polypropylene bag material would
    be filled with moistened adobe soil, or cement-stabilized soil, that would dry
    into large adobe blocks. In this case the original bag material was merely the
    initial form and would not necessarily be an integral part of the structure.


    Soon after these first experiments, Khalili began publicizing his work through
    the media and conducting workshops on the techniques. Many people who read about
    his work, visited his compound in Hesperia, California, or studied with him there,
    decided to go ahead with their own experiments.


    Among theseearlyearly” were Joe Kennedy, Paulina Wojciechowska, Kaki Hunter and
    Doni Kiffmeyer, Akio Inoue, and myself. I believe that it was Joe Kennedy who
    coined the term “earthbag” to suggest that the bag could contain a variety of
    earthen materials.


    Paulina Wojciechowska was the first to write an entire book on the topic of earthbag
    building: Building with Earth: A Guide to Flexible-Form Earthbag Construction
    was published in 2001. This featured some of her early experiments done at Khalili’s
    CalEarth, along with several other case histories.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_13_0.png)


    Akio Inoue, from Tenri University in Japan, has done extensive experimentation
    with earthbag construction, both on the campus of the University and in India
    and Africa. Above is pictured one of many projects that has helped build for assistance
    programs.


    Kaki Hunter and his husband Doni Kiffmeyer became enamored with earthbag construction
    after studying with Khalili, and worked on a variety of projects, both for themselves
    and for clients. In 2004 they wrote and got published another book, Earth Building:
    the Tools, Tricks and Techniques, based on their particular experience.


    In the meantime, Nader Khalili was continuing the promotion of his Superadobe
    technique and eventually decided to patent the idea, which he obtained in the
    U. S. in 1999, using very general terms that cover using bags made of any material
    being filled with virtually any material, and combining these with barbed wire
    between the courses.

