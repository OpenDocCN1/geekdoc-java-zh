    the dome itself would be a veritable mountain of bags.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_99_0.png)


    Montecito would be substantially bermed into the south-facing slope, and you can
    see in the photo how the leveled building pad has left a bank of native sand around
    parts of the perimeter. We hired an excavator to do the digging this time to speed
    the project along. On the far right you can see'
  - '[PAGE 100]


    another room that was dug out at the same time that would eventually become our
    pantry. In the distance the bedroom and our bus home are visible.


    We foolish made a huge tent-like shade structure over the building area, but the
    wind made quick work of demolishing it so we went back to putting tarps over the
    walls themselves.


    The elliptical footprint was broken by four doors leading to all four directions.
    Each of these openings would be framed by hefty double bagged buttresses.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_100_0.png)


    We found some antique steel wheels that had been parts of farm equipment and had
    had very wide rims that could actually support some bags placed on top, and we
    used these for decorative window supports in the south-facing direction.'
  - '[PAGE 101]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_101_0.png)


    We used the same arch support that had been successful in the bedroom to form
    the arch over the entry. In the above photo you can also see the log ends of several
    large log supports (vigas) for the loft. As with the other domes, as soon as these
    vigas were locked into place, the entire structure become much firmer while working
    on it. I tarred the exposed ends of the logs and they were flush with the bags
    so that they would eventually get covered by the papercrete plaster. You can see
    these as black dots in the above photo.'
  - '[PAGE 102]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_102_0.png)


    Above is pictured the entry into the pantry next to the kitchen with the vigas
