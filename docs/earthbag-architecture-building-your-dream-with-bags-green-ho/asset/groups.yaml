    在回填土壤之前，整个结构上都覆盖了两层6密耳的黑色塑料。在右侧可以看到一根4英寸的PVC进气通风管，最终在圆顶顶端安装了一个6英寸的PVC通风管。


    这栋房子原始设计的最后一个元素是通往街道的泥卫室入口空间。想法是用土袋做一个小拱顶，我坚心要找到一种方法来实现。我已经成功使用土袋的双交叉网格模式跨越了六英尺，我想如果我使用制作那些拱门时用的模具，它就能行。但我希望底部的跨度达到8英尺，所以我使用了土袋的双交叉网格模式将底部的跨度增加到8英尺。


    ## 完成后的室内


    建造外壳只是工作一半，因为室内细节需要几年时间来实现。我们卧室的这个视角展示了通往阁楼的土袋楼梯。卧室的饰层是光滑的纸混凝土，并采用了乳漆染的染色处理。

