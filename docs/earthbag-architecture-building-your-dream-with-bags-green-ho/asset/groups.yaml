  - '[PAGE 59]


    # Bond Beams


    Bond beams are a way to stiffen a wall at the junction of the wall and the roof,
    or the wall and a second floor or loft. These are places where it is necessary
    to connect the wall to other kinds of materials and there is a need for absolute
    rigidity. Bond beams also serve to stabilize the wall itself, firming up the entire
    structure.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_59_0.png)


    The most common bond beam is made with reinforced concrete that is formed to match
    the exact shape of the wall. If any vertical steel stakes have been driven into
    the wall to help stiffen it, these stakes can protrude above the top bags so they
    also get incorporated into the concrete bond beam; this creates a very strong
    matrix for the entire structure. At the time of pouring the concrete, J-bolts
    can be embedded for eventual connection to a top plate for the roof or floor joists.


    With straight walls it is possible to make the bond beam with lumber that has
    been attached to the wall with steel rods driven into the wall at intervals. If
    the top of the rods are bent over and they are driven through pre-drilled holes
    at various angles, this can connect the bond beam securely.'
- md: '

    I have come up with another way to make bond beams for straight-sided buildings
    that also provides some hurricane and earthquake protection for the walls and
    the roof framing. At the same time this method will automatically provide strong
    lintels over doors and windows.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_60_0.png)


    The idea is that during construction, once you have arrived at height where you
    are at the level of the top of any door or window (presuming that these are the
    same height), you lay down a piece of hollow, rectangular-section steel tubing
    right on top of that last row of earthbags. It is also possible to do this with
    pieces of wood by using somewhat larger dimensions, but I prefer metal because
    it is stronger and more reliable in its characteristics. It should be as long
    as the wall is, going from the center of one corner to the center of the other
    corner. In most localities you can purchase such tubing up to 6 meters (20 feet)
    long, and two pieces can be strapped together if necessary, using connection plates
    that are either welded or bolted in place. This tubing can be various sizes, depending
    on how long the wall is, but I recommend about 1 1/2” X 4” in general.


    It would be a good idea to have made this area as level as possible, through tamping
    or even shimmering some bags, so that the steel beam will lie level as it can.
    Before putting this first piece of steel in place, it should be pre-drilled with
    1/2” holes at 1 foot intervals all the way through both sides of the metal in
    the center of the long dimension.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_61_0.png)


    If you look at the above cross-section detail you can see that there is a piece
    of 3/8” rebar about 2 feet long with one end bent over 90 degrees. Such pieces
    of rebar can be pounded down every other hole and into the bags below. But don’t
    pound them all the way yet, because you also want to install 2 foot sections of
    threaded rod (sometimes called “all-thread”) vertically in each of the empty holes
    that are left. These need to be secured with steel washers and nuts underneath
    the beam so they can’t be pulled out. Once all the pieces of threaded rods are
    in place, you can finish pounding down the rebar anchors. Now the whole assembly
    should remain fixed in place.


    Wherever threaded rods are over doors or windows you may need to put a nut on
    the rod on top of the beam and also recessed into the beam by drilling a large
    enough hole on the lower side to allow other window or door assemblies to be joined
    flush with the beam. Now you can place some extra pieces of the same type of tubular
    metal over the door and window openings on either side of the beam so that they
    are long enough to extend maybe 1/2 feet on either side. These can also be pinned
    into place with similar rebar. This will become a platform over which earthbags
    will be placed.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_62_0.png)


    At the corners where two bond beams meet, the metal beams can be connected rigidly
    with 90 degree brackets on either side of each beam, through-bolted in a similar
    manner. This will make the entire structure integrally connected, which should
    withstand considerable force from earthquakes or wind.


    At this point you are ready to start laying earthbags. These should be filled
    so that they are 2 feet long when tamped into place. This may mean that they will
    need to be hemmed or stitched at the top if there is not enough material to fold
    over and seal that way. They will be placed directly between the threaded rods
    in order to maintain the staggered, brick-like layering of bags. Because these
    bags will eventually clamp together to form the bond beam, it doesn''t really
    matter much whether they are staggered or not. In most cases, three rows of bags
    can be arranged this way, but depending on the intended height of the wall, you
    can also lay fewer or more rows as long as the threaded rods are long enough to
    extend above the beam.


    This steel beam needs to be prepared with 1/2" holes drilled to match exactly
    the pattern of the lower one so that it can be placed in the middle of the top-most
    bags with the ends of the threaded rods protruding all the way through. In this
    case there is no real need to pound rebar pins through the bags since this whole
    assembly will be clamped tight as a unit, so fewer holes need to be drilled through
    the upper beam.


    Before the washers and nuts are put onto the rods, you want to position metal
    L-brackets wherever there will be rafters or joists. These brackets will connect
    these roof members to the bond beam in a solid, yet flexible manner. As you tighten
    down the nuts on all the threaded rods, be sure to check the level of the beam,
    making sure that it becomes level as possible so the roof itself will be level.
    It may be necessary to tighten some of them more than others. You want this whole
    assembly to be clamped tightly together so that there is no chance of any of the
    bags becoming dislodged, but don''t want to overly bend or stress the metal.


    # Plaster


    In preparing a wall for plastering, you should try to get the surface all into
    the same plane as much as possible. This would be the time to pound in any protruding
    bag corners and flatten any bags that stick out noticeably. You can also take
    a putty knife or screwdriver and tuck in any loose bag material that might interfere
    with there being a good bond between the plaster and the wall.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_64_0.png)


    In most situations the use of plaster mesh is a good idea; mesh will help hold
    the plaster in place while it is curing, and will also help keep it there over
    time. Chicken wire (either 1 or 2 inch wire works), stucco mesh, and even synthetic
    fish netting has been used for this purpose.


    One way to fix the mesh to the wall is with homemade U-shaped staples. These can
    be cut from wire that is stiff enough to be able to pound them into place with
    a hammer. Prongs that measure 3 or 4 inches long should hold the mesh onto the
    wall well enough.


    Plaster is usually applied in two or three coats, with the first one left rough
    to provide good "tooth" for the next one. The last coat would be the finish or
    smooth coat. One way to assure that the first coat gets well adhered to the wall
    beyond the mesh, is to actually throw it with the trowel at the wall. If you aim
    towards the crevices between the bags, this is where the best opportunity is for
    the plaster to grab onto the wall.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_65_0.png)


    Interior plaster can be most anything that covers the wall well that you want
    to live with. This could be an earthen plaster (sand and clay), lime, cement,
    stucco, or even papercrete.

