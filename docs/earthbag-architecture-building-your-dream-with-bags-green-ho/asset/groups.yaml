  - '[PAGE 106]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_106_0.png)


    For the second story above the loft of Montecito I felt that I needed to create
    some sort of temporary framework to guide the shape of the bag walls. So I did
    this by first erecting a tripod that would support a boat-like structure that
    would somewhat resemble the oval shape at the top. I connected 2 X 6 inch struts
    from this down to the existing perimeter of the wall. The idea was that I would
    use this while building, and then remove it entirely once the dome was complete.'
  - '[PAGE 107]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_107_0.png)


    Soon I was happily stacking bags of scoria again; the bags were light enough that
    I could carry them up the ladder to find their place on the wall. We used several
    smaller antique wagon wheels for the window openings above the loft.'
  - '[PAGE 108]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_108_0.png)


    As Montecito gained weight I noticed a few somewhat troubling aberrations in the
    form of the walls. One was in an area below the loft on the north side where there
    was a tendency for the wall to bulge outward. In the photo below you can see how
    I had used a log coupled with a hydraulic jack to try to push it back into shape.
    Eventually I decided to alleviate the downward pressure in that region by installing
    a permanent vertical pole supporting two of the loft vigas.'
  - '[PAGE 109]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_109_0.png)


    This vertical support eventually became part of the structure for a set of shelves.
    In the above photo you can see how the entrance from the east came into the house
    onto a landing, and from some simple steps went up to the loft. The bags that
    created the landing were filled with the native sand, since that area did not
    need to be insulated, and in fact the thermal performance of the house would benefit
    from there being more thermal mass inside. I did this in several other places,
    such as in parts of the buttresses.


    I persevered with stacking bags up to the very top of the temporary form, and
    even installed a couple of vent pipes at the top. Then I noticed something very
    troubling indeed. The relatively flat sections of the walls, especially on the
    north side, were pressing heavily on the temporary guiding framework. The more
    I analyzed the situation, the more I realized'
  - '[PAGE 110]


    if I Removed those supporting 2 X 6''s the whole wall might just collapse! In
    other words, the oval shape that I was attempting to create earthbags was inherently
    unstable. With circular domes, all of the forces around the circle are in equilibrium,
    but with this ellipse, the long sides exert more pressure on the shorter ends.
    This effect was exaggerated by the boat-like shape I had created at the top, so
    that the net effect was that those long walls might just come tumbling down, unless
    they were somehow held in place.


    I spent a rather sleepless night once I realized all of this, and by morning I
    had come to the conclusion that my best recourse was to remove the entire upper
    level above the loft. This was a rather depressing thought, partly because I knew
    that winter was just around the corner and I wanted to get Montecito sealed up
    before then.


    So I carefully started to dismantle several week''s worth of work, dropping the
    bags full of scoria down to the floor below the loft. Most of the bags survived
    their fall and were reusable. I carefully rolled up the barbed wire for reuse
    later.'
  - '[PAGE 111]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_111_0.png)


    For a permanent support framework, I first fabricated an oval hoop of metal that
    was spanned with some wooden poles to hold its shape. This metal band would be
    held up near the top of the dome with radiating poles descending to the perimeter
    of the bag wall at loft level. Each pole was attached to the metal band with a
    lag bolt.'
  - '[PAGE 112]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_112_0.png)


    At the base the pole was either attached to one of the vigas for the loft, or
    it was attached to a wooden plate that was extended out from the bag wall itself.
    As the photo shows, this plate was pinned into place in the wall with a section
    of rebar.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_112_1.png)'
  - '[PAGE 113]


    As an added measure of caution, I drilled holes through each pole about 4 feet
    up from its base in such a way that I could thread heavy duty wire cable around
    the entire structure, as one would do with a yurt to keep the roof rafters from
    expanding outward. Before I tightened and secured this cable, I fixed some horizontal
    poles between each of the vertical ones. These can be seen in the photos to the
    right.


    I had the foresight to wrap all of the wooden poles with industrial clear plastic
    wrap so that it would protect the wood from all of the plaster that I knew would
    eventually be slathered up there to cover the bags between the poles. I figured
    that I could easily cut this away with a knife once the plastering was finished,
    and the poles would be pristine, and this did work well.'
  - '[PAGE 114]


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_114_0.png)'
  - '[PAGE 115]


    Whenever I had some extra help I put folks to work hoisting up the old bags from
    the heap on the floor with a rope and pulley arrangement, so that I could place
    them in the wall above.


    Before long we had managed to get the project back to the point where I discovered
    the weakness in my original plan and had to regroup. This time I felt much more
    confident in the enduring stability of the structure. And with the cable around
    the perimeter of the upper framework, I felt that the building could even survive
    a small earthquake.


    Ever since this experience I have cautioned people that earthbag domes are best
    kept to circular structures. I feel that the risk of imbalance that we experienced
    with Montecito is best avoided entirely. And even with circular domes I feel that
    about 20 feet in diameter is the largest that can be safely done.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_115_0.png)'
  - '[PAGE 116]


    Around the time that we started building Montecito I realized that the project
    would go much faster if I were able to make the papercrete plaster in greater
    quantities. Mike McCain, the papercrete master, had invented a truly industrial
    mixer that he called a tow mixer, and I enlisted his help in fabricating one for
    me. It is really a rather simple idea of using the rear axel of a small pickup
    truck and placing the drive connection pointing upwards so that a lawn mower blade
    can be attached to it. Around this blade is secured a large tank, like the stock
    tank pictured above. A separate tow bar and hitch, the blade is welded to the
    axle so that when the mixer is pulled behind a vehicle, the blade is forced to
    turn with tremendous power. All it would take is the equivalence of one pass around
    the block at slow speed, and by the time you returned the papercrete would be
    completely mixed and ready to dump into the drain box.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_116_0.png)


    I used this mixer to produce enough papercrete to cover the completed Montecito,
    and barely got the job done before winter. As with the bedroom-'
  - '[PAGE 117]


    the previous year, I temporarily filled in some of the doorways with earthbags.


    You will notice three vents exiting the peak of Montecito. The two on either side
    are air vents, and the central one is for a wood stove that would be located near
    the middle of the room. The windows in the picture above are waiting to be covered
    with glass that would be embedded in fresh papercrete. Fortunately papercrete
    is stable enough dimensionally that it is safe to do this; with many plasters,
    thermal expansion might break the glass.'
  - '[PAGE 118]


    # Midsection


    The next phase of construction was to join Montecito to the bedroom dome with
    a connecting space that would serve many functions. On the lower level would be
    a greenhouse, bathroom, utility space, and above that would be a small office.


    My plan classed for a section of a sphere on the north that would basically rest
    upon the two domes to support it. The south side would be framed with wood to
    easily provide glazing for the greenhouse, as well as a large flat roof for various
    solar panels.


    ![](img/4f93d33c635578ee6b6ef918bb8ad9d6_118_0.png)


    To test my theory that it would be possible to create such a section of a sphere
    using earthbags, I pulled out my little kit of miniature earthbags and started
    to stack them between two dome-like mounds of papercrete. The photo shows the
    result of this, and it all seemed like it was stable enough that it was worth
    a try at full scale.'
- md: '

    In reality, the bag wall proceeded fairly easily up to the first story, mainly
    because this part was nearly vertical. The back of the wall to the north was going
    to be substantially bermed, so the lower bags were filled with soil for thermal
    mass, and then scoria was placed up against them for insulation. An apron of black
    plastic was put into place to protect it all from moisture before it got backfilled.


    I stabilized the back wall further by connecting floor/ceiling joists across to
    the large viga that had already been secured between the two domes. A couple of
    vertical posts helped support this platform.


    The second story soon became more of a challenge as the wall curved further inward,
    gravity was working against me at this point. It required periodic braces to keep
    the wall from toppling. Two round culvert coupler windows were also braced into
    place and the bags were stacked around them.


    When the wall arrived at the right height to attach rafters for the roof, I connected
    these to the viga at the base and where they intersected the bag wall, I pounded
    log rebar stakes through the rafters and deep into the bag wall. This helped to
    freeze the wall where I wanted it, as well as secure the rafters in place.


    By the time I got all of the rafters positioned, the back wall was able to stand
    on its own without the braces, however, I did install a few permanent braces just
    for safety’s sake.


    To prepare the roof to accept the metal roofing I planned to install, all I needed
    to do was nail some 1 X 4 stringers across the rafters. This was a very steep
    roof because I wanted it to be the perfect angle for the best performance of solar
    panels. I also wanted there to be plenty of head room in that upper space.


    Below the metal roof, I created an extended bay for a greenhouse bed. This would
    be right next to the kitchen, convenient for fetching fresh greens. The central
    part of the little roof over the greenhouse was also glazed for better growth
    of the plants. And this part of the roof was hinged so that it could be raised
    a bit to allow good ventilation. Metal flashing was between the metal roof and
    the papercrete in the domes.


    ## Pantry


    The concept for the pantry was that it would be substantially buried underground,
    and on the north side of the building so that it would rarely receive much direct
    sunlight and stay cooler. It was basically another small earthbag dome (about
    14 feet in diameter) nestled right up against Montecito so that it was really
    only a little more than half a dome.


    We filled the bags at the base, up to the level of the ground, with the native
    soil because we wanted it to be coupled directly to the earth, the better to keep
    it cool. Then we switched to filling them with scoria to help insulate the room
    from the ambient air outside.


    Once we had the bags stacked up to about ground level, I decided to provide a
    conical support structure with poles. This was because I knew we would be placing
    more dirt on top of the pantry, and so the pitch on the top needed to be shallow
    enough that this dirt wouldn''t just slide off. The poles were simply resting
    on the bags and were pinned into them with rebar pins through holes drilled into
    the wood. At the top there was a small ring for attaching the top of the poles.
    I ran some concentric wire around the poles to help keep the bags in place.


    Two layers of 6 mil black plastic were draped over the entire structure before
    it got backfilled with soil. On the right can be seen a 4 inch PVC vent pipe for
    inlet air and eventually a 6 inch PVC vent pipe was installed at the apex of the
    dome.


    ## Mudroom Entry


    The final element of the original design for this house was a mudroom entry space
    leading to the street. The idea was to make a small vault with earthbags, and
    I was determined to find a way to do this. I had already successfully spanned
    six feet using the double crosshatch pattern with the bags, so I figured that
    if I used the same form that I had used for those arches it would work. But I
    wanted the span at the base to be 8 feet, so I used the double crosshatch pattern
    with the bags to increase the span at the base to 8 feet.


    The concept for the pantry was that it would be substantially buried underground,
    and on the north side of the building so that it would rarely receive much direct
    sunlight and stay cooler. It was basically another small earthbag dome (about
    14 feet in diameter) nestled right up against Montecito so that it was really
    only a little more than half a dome.


    We filled the bags at the base, up to the level of the ground, with the native
    soil because we wanted it to be coupled directly to the earth, the better to keep
    it cool. Then we switched to filling them with scoria to help insulate the room
    from the ambient air outside.


    Once we had the bags stacked up to about ground level, I decided to provide a
    conical support structure with poles. This was because I knew we would be placing
    more dirt on top of the pantry, and so the pitch on the top needed to be shallow
    enough that this dirt wouldn''t just slide off. The poles were simply resting
    on the bags and were pinned into them with rebar pins through holes drilled into
    the wood. At the top there was a small ring for attaching the top of the poles.
    I ran some concentric wire around the poles to help keep the bags in place.


    Two layers of 6 mil black plastic were draped over the entire structure before
    it got backfilled with soil. On the right can be seen a 4 inch PVC vent pipe for
    inlet air and eventually a 6 inch PVC vent pipe was installed at the apex of the
    dome.


    The final element of the original design for this house was a mudroom entry space
    leading to the street. The idea was to make a small vault with earthbags, and
