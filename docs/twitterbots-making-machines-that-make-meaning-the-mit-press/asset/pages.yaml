  md: 'Let''s explore a popular love poem format, often called "Roses Are Red,\” whose
    template structure yields poems that are disposable but fun. The poems are short,
    constrained, and heavily reliant on rhyme. Here is a typical instance:


    +   - Roses are red

    - Violets are blue

    - Sugar is sweet

    - And so are you.


    There are a great versions of this poem and many jokes that use the same poetic
    structure. Each one varies a little from the basic version above. Some variants
    change words or entire phrases, while others change the meaning of the poem or
    play with its structure. Here are a few more examples, so that we can begin to
    look for the common patterns that we can feed into our generator:


    +   - Roses are red

    - Violets are yellow

    - Being with you

    - Makes me happy and mellow.


    This poem has the same sentiment as the first, but the poet has changed the rhyme
    in the second line by switching in a different color, in order to end on a different
    note. It also removes the comparison in the third line. Here is one more:


    +   - Roses are red

    - Violets are blue

    - Onions stick

    - And so do you.


    These variants only slightly tweak the poetic format, which suggests a Tracer
    grammar could capture the variability in form. We can also see some obvious points
    of replacement where we might insert some lexical variability. We can change the
