    analogy between storytelling and racing simulations. Take the two characters A
    and B: let''s keep the simplifying assumption that each story is built around
    a well-matched pairing of a protagonist to B, and so we can take A and B to be
    the story equivalent of two cars racing along parallel grooves on the same track.
    This track is the plot, a sequence of actions that each character must pass through
    in the right order, as each action frames an event in which both characters participate
    together. If A is selling, then B is buying, and if B performs surgery, because
    A is unwell. The same event can be viewed from the perspective of different characters
    (for example, a lend event for A is a borrow event for B), a well-crafted plot
    arranges its actions so as to draw the reader’s attention back and forth between
    characters, as though the reader was watching a fluid game of tennis. When rendered
    into English and into threads, the sequence of plot actions will describe how
    A and B proceed neck-and-neck from the starting position of the first action to
    the story’s finishing line.


