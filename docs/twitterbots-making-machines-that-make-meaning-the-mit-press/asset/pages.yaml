    # Chapter 1


    Telegrams were much faster than letters, of course, but they discouraged verbosity
    and encouraged instead a system of conventions, shorthands, and codes. However,
    even conventions are open to playful exploitation. When physicist Teller, not
    a man celebrated for his linguistic creativity, telegraphed colleagues to notify
    them of the first successful detonation of a hydrogen bomb, his telegram was not
    unlike Joyce''s: "It’s a Boy.\^4 Yet we should perhaps expect more from writers
    who are paid to be funny. When dispatched to Venice by his editor at the New Yorker,
    the humorist Robert Bentley sent off this six-word telegram, "Streets full of
    water. Please advise,"^5 established the high-water mark rather than the norm,
    since telegrams were rarely intended for mass consumption. We know only of the
    best because their authors chose to share them after the fact, in anecdotes that
    improved with age. In some tellings, Bentley omitted the extragance "please,"
    and in places he replaced "full of water" with "flooded." Yet the best examples
    of the method that nothing at all was ceded because they were never actually sent,
    except that in world of three-hand anecdotes and after-dinner speeches where fable
    became fact. Sadly, the telegram that is often cited as the wistest ever belongs
    to the realm of the next. It would count as another example of staircase with
    one of telegram if the year it was supposed to have been sent, 1843, was not a
    full year before Samuel Morse sent the first official telegram—the grandiose "What
    God Hath Wrought"\^6—in 1844.


    When General Charles Napier conquered the Indian province of Sindh (now part of
    Pakistan) in 1843 on behalf of his employers in the East India Company, he is
    said to have cheekly sent the one-word telegram, "Pecavvi.\^7 Napier was the victor
    of the Peninsular War, whose mandate in Sindh was to suppress the rebellious elements
    who were making difficult for his employers, and he brought with him the public
    school philosophy that one is never more predisposed to gratitude than receiving
    a sounding thunder. But Napier exceeded his mandate by bringing the whole province
    to heel, and he was richly rewarded for his efforts, his military zeal the target
    of much criticism in the newspapers and in parliament. So Pecavi, Latin for "I
    have sinned was both a confession of his guilt and a celebration of his military
    victory—in other words, "I may have sinned but I have sinned.\^8 It didn''t hurt
    that Napier could show his classical education in the process and flatter his
    employers by acknowledging that they were also educated enough to understand Latin.'
