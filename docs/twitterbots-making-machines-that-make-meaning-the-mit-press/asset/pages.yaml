  md: '# Make Something That Makes Something


    # 81


    ties, and output styles. This means there is no one right way to build a generator,
    but we can surely help out with some general guidelines to guide you to where
    you want to go.


    Every generator has a starting point. Sometimes it''s an idea for creating a new
    kind of artifact in an already crowded space of interest, such as a video bot
    that lampoons a stringent politician or invents new ideas for video games. Sometimes
    it is an amazing source of data that you have stumbled upon, such as a list of
    a thousand video game names,¹¹ or political donations, or common malorphisms,
    or a knowledge base of famous people and their fairly (we provide this last one
    in chapter 5). One of the best ways to start thinking about a new generator is
    to create some examples by hand. Creating examples allows you to notice patterns
    in the content that you might not otherwise appreciate. These patterns need not
    generalize across all of the examples that you produce, but you might know two
    or three with something in common. Thus, most pub names do not obey the pattern
    “The <something> and <something>” so that they stand out when you write some down
    or look up on the Internet. Patterns can help you pick apart the layers of abstraction
    in your content to see changes, what stays and how much it varies. Identifying
    the moving parts of what you want to generate will help you see which parts can
    be extracted and handed over to an automated generator.


    So let''s build a new generator by starting with an example of what we want to
    generate and thinking about how to gradually turn it into a generative system.
    This generator, like others of pub names and Trumpisms, will be another example
    of a grammar-based generator. Indeed, the term grammar can be used to label any
    declarative set of rules that describes how to construct artifacts from their
    parts, whether those artifacts are texts, images, or sounds. For our pub name
    generator, our rules defined a simple semantic grammar describing how to name
    English pubsby filling slots such as <animal> with the results of other rules)
    and how to choose an animal (even if trivially this just means it from a fixed
    basket of options). Grammars are especially suited to the generation of content
    that is highly structured and easily dissected into discrete recombinant parts.
    For our pub names, every name employs the same kinds of element in the same places,
    so that we can easily pull out the <animal> parts and the <adjective> parts and
    write lists to generalize them. Our Trump bot explores a world with very different
    flora and fauna, but it does so in much the same way.'
