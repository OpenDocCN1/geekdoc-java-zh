    should be as beautiful as the chance meeting on a dissecting-table of a sewing-machine
    and an umbrella." In the spirit of the ready-made, Breton borrowed this enigmatic
    line from another writer, Comte de Lautréamont, it suited his philosophy of contextual
    dislocation and reintegration so perfectly. Breton saw that familiarity can rob
    everyday objects of their essential magic, habituating us to seeing them from
    a single utilitarian perspective. By forcing objects into jarring juxtapositions
    and forcing the viewer to see out new connections and resonances within these
    amalgams can objects be made to once again reveal their overlooked potential.
