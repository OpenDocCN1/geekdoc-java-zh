    # Space Is Big—Really Big


    Suppose we want to print out our pub name generator so as to give it to some friends,
    but we are a tired, or perhaps a little curious, about what it might generate
    when we are not to explain it. What we need to do is to think about our generator—or
    any generic system—as a whole system rather than simply considering any one output.
    A single output from a generator is sometimes called an artifact, as such, in
    our case of the fictional pub: "The Tipsy Walrus." If we want to talk about a
    set of artifacts instead, we use a different term: space. A space is a mathematical
    term for describing a set of things that share a common property or a common use
    or a common genus. But we mostly use the term space rather than set because we
    emphasize that a space is something we can navigate and something we are to explore.


