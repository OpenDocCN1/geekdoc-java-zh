    Chapter 2


    Once new users gain access to a developing technology and grow in familiarity
    with it, two interesting milestones are reached. The first is that they are soon
    encouraged to graduate to newer and more complex systems that build on this acquired
    knowledge. So today we do much more than merely take photographs: we also edit
    and modify them in time to improve the way they look. Even a simple app on our
    smartphones can readjust the lighting, balance the colors, and transform the substance
    of our images with fancy filters. The second milestone occurs soon after we master
    a new technology, when we want to revert it too. So artists don''t simply use
    photography to replicate the world as it is; some find ways to create abstract
    images by manipulating light and shadow, while others use photography to freeze
    moments in time so they can beter depict events and them to their own aesthetics
    and style. Each of these developments—the evolution of a new technology, its growth,
    and its eventual subversion—flows from gaining greater access to the technology,
    but they also go-in-hand with a deeper understanding of the original concept.


    Generative software is currently still at mid-nineteenth-century status, where
    practitioners mostly need to be part-time technologists—part chemist and part
    architect to make sense of how it works. Many aficionados work with their own
    custom-built tools, and though they may not present the physical dangers of volatile
    chemicals, they can certainly explode metaphorically without mixed due care. We
    are entering a world where nothing is truly set in stone, and we still have no
    idea what generative software can do for the world or who might want to use it
    or what they want to do with it. In some ways this is terrifying, and it can feel
    as if we are fumbling in the dark and unsure of where to go next. But it is also
    exciting, energizing, and a source of great optimism and joy, because every day,
    we can go out and think of new ways to make systems that have meanings. We can
    build tools to help more users get involved, even if we may never be sure of what
    we''ll be doing in six months'' time.


    The goal of this book is to show you just one possible future for Twitterbots,
