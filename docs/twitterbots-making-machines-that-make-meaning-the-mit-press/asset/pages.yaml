  md: 'The greatest benefit of Twitter''s character limit: limiting how much we can
    say forces us to leave room for the rich imaginations of our readers, turning
    the construction of meaning into a truly collaborative affair. It is fascinating
    to see an established voice in the world of comedy come to grips with Twitter
    and the collaborative construction of meaning, and if we go back to the very start
    of the timelines for @theEllenShow, @robdelaney, or @SteveMartinToGo, we see a
    new view slowly emerge as a blend of comedic sensibilities and Twitter conversions.
    When Steve Martin first took to Twitter, he mixed one-off jokes with long-form
    concepts that he fully elaborated over a series of connected tweets. Martin himself
    recounts, which was critical feedback from followers that helped him trim the
    unnecessary fat from his online persona, prompting a shift from slim, piecemeal
    narratives to brief comics and interactive back-and-forths with his fans.¹17 Though
    it took time, Martin came to appreciate that at Twitter, less is more.


    We can enjoy a similar retrospective on the outputs of a Twitterbot that remains
    under active development, watching with delight as the early additions in its
    timeline, *Hello Worlds*, give way to a more polished and increasingly diverse
    repertoire of outputs. This latter point speaks to an emerging role for bots in
