    Chapter 4


    # Lost in Space


    Every generative system—from a simple Twitter bot as @StealthMoun-tain or @EnjoyTheMovie
    to the huge investment in corporate AI that is IBM’s Watson—is an intrepid explorer
    in a space of generative possibilities. With an alphabet of 100 or so characters,
    our bots can generate up to 100¹⁴⁰ tweets. However, recall that Borges made very
    plain in “The Library of Babel” that a bot with the ability to generate all 100¹⁴⁰
    of these possibilities is not one that everyone is ever likely to follow. Nonetheless,
    while much of this vast space is devoid of any possibility of meaningful linguistic
    interpretation, these 100¹⁴⁰ tweets define the outer limits of any possibility
    space to be explored by our bots. Depending on how we construct our Twitter, each
    will effectively confine its explorations to a distinctive neighborhood, or sweet
    spot, in this vastly larger universal space.


    A modulus of formal analysis can help us get our heads around the key issues that
    characterize these spaces and the bots that explore them. In formal analysis,
    a language is defined as the set of all strings that can be validly produced within
    that language from its alphabet. A language L is the set of all strings, composed
    wholly from the characters of an alphabet Σ, any string that is not in this set
    may not belong to another language, or it may not, but does not belong to L. In
    formal terms, we say that a language L can be produced by an abstract machine
    Mb, so that Mb can generate all the string that is not in L. Any Twitterbot T,
    no matter the programming language in which it is coded, will correspond to an
    abstract machine Mt, so that Mt produces strings—that belong to L. The languages
    corresponding to two formal machines (or bots) Ma and Mb may overlap, so that
    La ∩ L ≠ Ø, or it may be the case that La ⊆ L, so that Mb is capable of generating
    any valid string that Ma can generate and more besides, or vice versa if L⊆L.
    Indeed, it may be the case that A and B are written in very different programming
    languages to capture different aspects of human psychology on Twitter, that Ma
    ≠ Mb, yet La = LB. In other words, two bots may exactly explore the same possibility
    space with different agendas, producing outputs that cannot be distinguished from
    each other on the basis of individual tweets.


    If La = LB Ma ≠ Mb, it may be that Ma samples LA differently from how Mb samples
    LA, so that each may allow us to statistically distinguish the actions of Ma from
    Mb. That is, Ma and Mb may drink from the same pool and stomp on the same'
