    # I Read the News Today, Oh Boy


    Just as we expect the news to reflect our events, we adapt conversations to reflect
    the news, often responding to particular events with a pithy remark, apropos metaphor,
    an ironic observation, or a fumble for profund to propel us a new tangent. Our
    bots can be just as topical if they cut their cloth from the unspooling fabric
    of the news cycle. Of course, in previous chapters, we extolled the benefits of
    regenerating a bot’s tweets, so that the offline of exploring a possibility space
    and charting what is found can be logically separated from the run-time task of
    selecting and posting tweets to a bot’s timeline. This division of responsibilities
    has a number of advantages, not least when it comes to creating new possibility
    spaces from old, but it does little to encourage topicality. Yet surprising as
    it may sound, it is on this specific point of topicality that a large prebuilt
    space can truly come into its own.


