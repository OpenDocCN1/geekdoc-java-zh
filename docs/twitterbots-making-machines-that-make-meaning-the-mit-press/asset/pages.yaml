  md: '# What-If Machines


    to the same Twitter drumbeat. So truth rubs elbows with half-truths, lies, and
    Frankfurt-style “bullshit”, while dreams and fantasies mingle with hard reality.


    Bots such as @pentameter contrived to reorder the pages of the Twitter book so
    that mindfulness becomes poetic dreaming, by nudging readers to perceive a semantic
    or pragmatic reason between tweets that are paired with metrical grounds. It works
    much like a dating agency that pairs members on the principle that it is the couples
    with similar weight, height, or other superficial measures of compatibility that
    generate the most electrifying sparks. In this way, the bot adds value to tweets
    that may have already run their authors’ intended courses. Indeed, by striking
    sparks from what otherwise seem like spent fuel, our bots confront head-on the
    spectre of disposability that haunts Twitter but other forms of content delivery.
    The cultural critic Lawson, who writes extensively about television, diagnosed
    TV’s pre-HBO lack of artistic standing with an insight that seems as relevant
    to Twitter as now to TV in the 1980s and 1990s: “The invisibility to posterity
    has always been television’s difficulty. Many programs are intended to be disposable,
    to disintegrate even as you look at them.”²21 Even the wistest tweets are disposable
    ephemeral, flashes of light that quickly recede as our lines fill with new and
    memory by using automation to ensure that new content is produced with clock regularity
    to supplement the old. Our bots can no hold back time than King Canute could hold
    the tides, but that has never been their purpose. Bots can give new life even
    to content that is intended disposable and take from their disintegration the
    material for new tweets. Moreover, as our Twitter lathes produce the steady streams
    of sparks in the form of whimsical what-ifs, these may in turn ignite the imaginations
    of human users (and perhaps other bots) who might refine, repackage, or satirize
    these ideas in a never-ending cycle of disposable. Individual tweets may be disposable,
    but the overall cycle of creativity lives on.


