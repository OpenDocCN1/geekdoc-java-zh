  md: '# Less Is More


    # Educated Insolence


    In an age when people sent telegrams and paid for their messages by the word,
    the telephone companies—which were not to be outdone by an older technology—“Every
    telephone is a telegraph office.\¹ Much like today’s mobile phones, this combination
    of technologies made the world a smaller and more connected place, allowing people
    to do many of the same things that web-savvy users go online to today, such as
    transferring money, booking tickets for passage by rail or sea, and ordering flowers,
    candy, books, and cigars for delivery to recipients in cities across the globe.
    In the late nineteenth and early twentieth centuries, the world was connected
    not by the Internet or the web by transatlantic cable, and the “last mile” was
    just a boy on a bicycle, how-to books such as Nelson Ross’s “How to Write Telegrams
    Properly,” a a 1928 pamphlet, would joke that it costs nothing to be polite, the
    telegraph was a communication medium whose users had to pay to say “please” and
    pay twice as much as say “thank you.” If the telephone was the Internet of its
    day, the telegram was it.


    We tend to use sparingly when we have to buy them. While constraints often bring
    out the best in us, telegraph was not widely considered a medium in which writers
    did their best work. Even James Joyce, one of the most creative writers of the
    twentieth century, could only muster the three-word message “son Jim” to his brother
    Stanislaus on the birth of his son Giorgio.\² Ernest Hemingway’s editor, Maxwell
    Perkins, was even briefer, sending a one-word telegram, “Girl,” on the birth of
    his daughter, Sigmund Freud joined—in a way that will surprise no one—that news
    of a boy surely deserved a telegram, news of a girl warranted only a letter.³'
