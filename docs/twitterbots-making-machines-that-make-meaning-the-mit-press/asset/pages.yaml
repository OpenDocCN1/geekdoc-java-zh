    on the workings of their Twitterbots and notice when additional sophistication
    and new features have been added. Because bots are artificial but use human language
    and other systems of human signification to speak to human concerns, Twitterbots
    blur the line between the natural and the artificial. They show us how human meaning
    can arise from nonhuman meaning and reveal the hidden regularities at the heart
    of human behavior. When we interfere with the autonomy of a Twitterbot, so that
    its outputs result from artificial intelligence rather than wholly mechanical
    means, the bot''s followers naturally felt cheated and betrayed. The scandalous
