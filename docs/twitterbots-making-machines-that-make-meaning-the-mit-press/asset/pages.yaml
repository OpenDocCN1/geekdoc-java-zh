  md: '# 4 Chapter 1


    men of war with Napier and Campbell, to quite literally speak (if only in our
    collective imaginations) like a schoolgirl, albeit one with a classical education
    and a dry wit? Aristotle said it best when he defined humor as a form of educated
    insolence, for creativity is an essentially precocious aspect of the way we use
    language.¹⁰ Its precept is anchored in a number of seemingly contradictory desires:
    the desire to fit in, balanced with the desire to respect tradition while demonstrating
    a mastery over convention; the desire to belong while striving to stand out; and
    the desire to follow (or be seen to follow) in the footsteps of past masters blazing
    a trail of one’s own. Having spent blood, treasure, and goodwill to secure a brutal
    victory, it may indeed seem juvenile for “great” men to exert in childish wordplay,
    these puns offer the perfect symbol of what we *think* their creators were trying
    to achieve. They reflect not just a contest of meanings but a contest of cultures
    and class systems, in which the “heroic” champions of highminded Western values
    (represented by a Latin education and a respect for the European classics) were
    seen to triumph over the peoples, the cities, and the much older traditions of
    the East. In truth, none of these men have sent the telegrams for which they are
    remembered, but our willingness to keep the stories alive says a deal about why
    we use language creatively and how we use technologies to communicate.


    # Welcome to the Metalevel


    We cherish the few examples of true creativity that survive, in fact or legend,
    from the bygone age of telegraphy, by Twitter, the modern inheritance of the best
    aspects of the telegraph, offers us this creativity in freely abundance. Indeed,
    the inner workings of the telegraph (or the “Victorian Internet,” as writer Thomas
    Cage calls it) had a significant human component, Twitter’s end-to-end automation
    means that our machines are just capable of sending and receiving tweets as we
    are.¹¹ Twitter’s application program interface (API) is specifically designed
    to allow other pieces of software, such as smartphone apps, to exploit all of
    its *read* and *write* services. These other apps may simply offer intermediary
    services to their human users, or they may be autonomous consumers and generators
    of content in their own right. On Twitter we call these generators of content
    “Twitterbots,” for (ro)bots that have been designed to operate their own Twitter
    accounts. But these bots are capable of the same kinds of educated insolence that
    we see humans produce on Twitter? Are they capable of generating messages with
    the same double-edged clev.'
