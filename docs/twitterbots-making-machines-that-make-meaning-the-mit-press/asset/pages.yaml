    extend over an arbitrary number of threaded tweets. The key is CBDQ''s support
    for a response grammar, which allows a Tracer-based bot to respond to mentions
    from other Twitter users. If the core Tracer generates the first act of the story
    and mentions it in that first tweet, the bot''s response grammar can respond to
    this first tweet—in effect, respond to itself—with a follow-up action in a new
    tweet. If this follow-up also mentions the bot''s own handle, the response grammar
    will again be allowed to respond to itself with subsequent actions in subsequent
    tweets. This call-and-response marshals the two components of CBDQ to allow a
    long-story by talking to itself. You will find grammars for each side of the conversation
    in a directory named Generator in our TraceElements repository. You may notice
    that these grammars give names (such as Flotsam and Jetsam, or Donald and Hillary)
    to the characters in each story, and consistently use the same names for A and
    B across tweets in the same narrative. Different narratives use different character
    names, so how does the grammar remember which names to use in different tweets?


    We use another trick to build a long-term view into a grammar that lasts even
    a short-term memory. Rather than using the nonterminals of the grammar to represent
    simple-stories that correspond to plot actions, we create composite states that
    bind a plot action to the final action of a story. Thus, the grammar uses states
    such as fail_in_with_are_betrayed_by (which we can read as: A falls with B, but
    is eventually betrayed by B), and its rules to interlink states that end with
    the same final action. Because each story state “knows” how its story will end,
    it can use this knowledge to assign coherent names across tweets. Thus, for example,
    stories that end with are_betrayed_by always use the names Mia and Woody. Since
    the grammar generates stories that terminate with more than two hundred unique
