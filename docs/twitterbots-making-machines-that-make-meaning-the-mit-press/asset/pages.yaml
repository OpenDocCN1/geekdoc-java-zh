    are not who they seem to be or who they are, competing histories that never completely
    persuade. The characters of the novel may hold different views on “historicity,”
    but each in his or own way attempts to project external meaning into objects and
    events to see their way to an “inner truth.” In many ways, the themes of Dick’s
    novel are applicable to our appreciation of artifacts made by autonomous machines
    as well as conventional man-made artifacts, and perhaps more because our machines
    are themselves a special kind of man-made object. We ask many of the questions
    of their outputs and face many of the same doubts. In this final chapter, we find
    that many of the themes of Dick’s novel chime with the opportunities and the concerns
    raised by our bots.


    Consider the desire for historicity, that is, our need for a connection between
    an artifact and some external context that can give relevance and meaning; the
    search for history is ultimately a search for story and the desire to frame an
    object within a satisfying narrative. Dick’s novel has a cynical manufacturer
