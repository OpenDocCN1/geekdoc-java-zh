    artifact. What does it mean to say that something is a “fake” or the product of
    artifice? Does an object that “has history in it,” such as an object tied to a
    famous person or a pivotal event in history, have more intrinsic value than a
    perfectly functional copy of the same thing? Does the origin of the thing, or
    the intent with which it was made, determine its usefulness to others? Wholly
