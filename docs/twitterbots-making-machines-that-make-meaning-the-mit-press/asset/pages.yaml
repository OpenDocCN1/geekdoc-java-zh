    referring metaphors for the participants of the This version of the grammar is
    named What-if grammar backward.txt because the referring metaphors always refer
    back to the semantics of the previous action. Another variant, called What-if
    grammar forward.txt, generating referring metaphors that are specific to the next
    action only. Try both in CBDQ to see which generates the most coherent narratives
    for you.


