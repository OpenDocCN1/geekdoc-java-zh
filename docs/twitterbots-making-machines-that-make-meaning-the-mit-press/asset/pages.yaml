    Napier''s witticism rings mainly because we want to be true. It caps a witty anecdote
    that hides the horrors of imperial repression behind a clever pun. The many instances
    of verbal ineptitude that folk history attaches to Vice President Dan Quayle—such
    as the tale of how, on a tour of Latin America, Quayle expressed regret at not
    having Latin classes in high school—we prefer the humorous legend to the boring
    truth. But just as Quayle''s tale of witlessness was invented by a late-night
    comic and later misremembered and misquoted as historical fact Napier''s tale
    of Latin wit was invented by a schoolgirl, Catherine Winkworth, who joked to her
    teacher that "Peccavi" would have been the wittiest way for thezealous general
    to signal his triumph to his disproving bosses. 8 Winkworth sent her joke to the
    editors of a new humor magazine, Punch, and Peccavi became part of the official
    Napier biography.


    If Napier that telegram never seemed like a opportunity to impress future historians,
    future generals were more ready to make for Napier''s oversight. In 1856, the
    British annexed the province of Oudh (whose name rhymes with loud), Lord Dalhousie,
    sent a one-telegram, “Vovi,” to the Foreign Office in London. Dalhousie''s Vovi
    is Latin for “I have voted,” and can be read as a pun for "I have Oudh [as I wished]."
    or "I have Oudh [as I wished]." But the governor''s annexation of Oudh was to
    stir serious rebellions among the ill-treated population, forcing General Colin
    Campbell (later Baron Clyde) to take and later retake the city of Lucknow following
    the Sepoy mutiny of 1857. After capturing Lucknow for the second time in 1858,
    Campbell is said to have sent yet another joke by telegraph. But inflation needed
    three words—“Nunc fortunat sum, meaning “I am in luck now”—to signal his victory
    with a pun. In military circles, the Latin pun was fast becoming a telegraphic
    meme with which generals could simultaneously paint a veneer of polite society
    with the brutality of imperialism and cement their reputations in the history
    books.


    We can see why such as "Peccavi" and its later variants might have appealed to
    a clever child such as Catherine Winkworth. Like most other instances of creativity,
    linguistic or otherwise, Winkworth''s pun made the strange seem more familiar
    and the familiar just a little stranger and more exotic. New ways of referring
    to the different classes of the British Empire could be fashioned from the stuff
    of everyday schoolwork, while the banal substance of this work—boring Latin—could
    be put to new and clever uses. But what could drive such men of state as Dalhousie,
