    incoming messages. This status bar was often wittier and more interest- than the
    actual messages themselves, and it seemed to be a valuable channel for communication
    in its own right. With colleagues Biz Stone and Evan Williams, Dorsey set out
    to create an app for mobile phones that flipped this state of affairs upside down:
    the status message would become the primary channel of communication between users.
    As the joke went in those early days, Twitter was an application that allowed
    you to tell the world what you had for breakfast. Because the service was designed
    to piggyback on the texting facilities of cell phones, the size of each status
    update was necessarily limited by the maximum length of a text message: 160 characters.
    A portion of this 160-character maximum was reserved for use by the app itself,
    containing the name (or handle) of the sender, a colon, and a space, allowing
    users to use whatever was left over for their tweet. Observing that this practice
    was unfair to users with longer handles, Dorsey and later standardized the division
    of space: the app would take 20 characters for itself and the remaining 140 to
    users. A magic number was born, making 140 a new benchmark for verbal concision.
    As Twitter tinkered with its winning formula and others used a heftier 280-character
    container for their thoughts, the platform’s original magic number reasserts itself
    in Twitter’s two-for-one arithmetic


    The word tweet was coined not by Twitter but by its users, and was given the official
    imprimatur of the company only after it gained wide-spread use. The /status/ in
    the URL of each tweet a fossilized reminder of those early days. Showing how fast
    time flies, the URL of @CIA’s first tweet exposes this ID:


    ```

    https://twitter.com/CIA/status/47497139852182528

    ```


