    The most memorable shot in Steven Spielberg''s Jaws is not a close-up of a toothy
    shark or its unfortunate victims. Rather, since Jaws is fundamentally a film about
    people and their differing reactions to an implacable existential threat, the
    most affecting shot is a close-up of one of the human protagonists, the local
    police chief. We see the chief sitting uneasily on a beach chair, scanning the
    water for the presence of the titular threat, when the director executes a “dolly
    zoom” on his startled face. This maneuver, one of the most dramatic camera moves
    in the filmmaker’s repertoire, comprises two camera actions that must be executed
    simultaneously: a “dolly out,” in which the camera is quickly pulled away from
    its target on a trolley or track, and a “zoom in,” in which the camera lens extends
    for a simultaneous close-up of the target. The two actions almost cancel each
    other out, but not quite, for the target remains resolutely in focus and appears
    just as prominent on the screen, the background behind the dramatically falls
    away. The effect is as unsettling as it is fleeting: just as the chief anchored
    to the spot with fear, the world behind him seems to jump back in terror.


    It may seem contradictory, but dolly zooms grab our attention and hold our focus
    by taking a sudden and rather big step backward. The linguistic equivalent of
    a dolly zoom is a metaphor, for effective metaphors, like effective dolly zooms,
    execute a simultaneous pull-out and zoom-in to focus sharply on those aspects
    of a topic that are of most interest to the speaker while causing the noise and
    distraction of the rest of the world to dramatically fall away. But like a dolly
    zoom, they achieve this attention-grabbing close-up on one facet of a topic by
    stepping all the way back into a different conceptual domain. So to talk about
    the pain of a difficult divorce we might pull backward into the domain of war,
