    ness and elegant concision as Winkworth’s “Peccavi” or Benchley’s “Streets filled
    with water. Please advise”? The answer to each of these questions is a qualified
    yes.


    Human creativity is a constantly replenished resource on Twitter, where a stream
    of newly minted hashtags marks the birth of new challenges to received wisdom
    and encourages fresh perspectives on the stale and too familiar. Anyone can join
    in the fun by marking one''s own tweets with the hashtag #JamesEllroyStarWars,
    or by inventing a new hashtag of one''s to elicit conceptual and linguistic innovation
    from. Consider the hashtag #JamesEllroyStarWars, minted by the comedian Patton
    Oswalt to encourage his followers to blend the innocent, fairy-tale world of Star
    Wars with the noirish, argent-heavy world of James Ellroy''s Los Angeles, in a
    world where everyone is on the mouth, on the take, and quick with the slang. This
    type, one of many minted on Twitter every day, allows Twitter users to show their
    knowledge of two different milieux, yielding gems as “Ackbar smelled like a plate
    of calamari, but bout eyes see the invisible inevitability. Trap” (from Twitter
    user @EarlRiverFlow) and “Leia kissed on the mouth. Deep down she knew her brother,
    but she it” (from @The_Jump_Room). Twitterbot designers do not set to replace
    or supplement this creativity; they simply aim to augment what they know and do:
    clever engineering. Whether you are a regular Twitter user responding to the creative
    challenge of how to add your own voice to the game of #JamesEllroyStarWars or
    a bot designer responding to the engineering challenge of building a robot to
    generate responses the challenge is much the same, if only taken to the metalevel
    in the latter instance.


    There is no reason, in principle at least, why we cannot give our machines enough
    knowledge of the world to appear educated, or enough metknowledge to use this
    education in insolent and entertaining ways. The profound questions of whether
    a machine can feel pride at showing off its “education” to others, or feel surprise
    at the effectiveness of its own defiance of convention, or feel the joy that comes
    from being playfully insolent to others are questions we must leave to the philosophers.
    We can give answers in how we go building and then critiquing our bots, but rather
    than present a definitive philosophical position, this book focuses on ideas,
    methods, tools, and resources for crafting new Twitterbots as a well-matched marriage
    of software engineering and knowledge engineering. Whether our Twitterbots are
    genuinely creative in their own right, or merely showcases for the metacreativity
    of their creators, is a question we leave to our readers to answer for'
