    a nice coat of paint to make them shine. Before we begin, though, it is useful
    to think for a moment about the theory of Twitterbots and generative machinery
    more generally. We come across generators every day, from machines that assign
    school places and hospital appointments to the algorithms that drop candy from
    the sky in the games on our phones. In this chapter, we think about what separates
    generative software in terms of the world of its outputs, and not just one or
