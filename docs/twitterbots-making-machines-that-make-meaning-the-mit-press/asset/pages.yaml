    # Borrowed Ladders


    The most human-scale objects on Twitter are, of course, us, humans, and nothing
    burishes a bot''s reputation for human-scale ideation quite like a demonstration
    of its ability to talk to—or talk about—real people. We humans like to talk about
    one another, and we love to be talked about. Heroes and villains are all very
    well in the abstract, but give us a specific individual with observable qualities,
    good and bad, on whom to pin these labels, and labels become things of substance—if
    not exactly true things, then things rich in when comedian Colbert calls "truthness."
    When the figurative application of labels begins to resemble an intellectual shell
    game, it is useful to remind ourselves that labels like "hero" or "villain," or
    "loner" or "loser," or "winner" or "whiner" are designed to be applied to real
    people to reflect what we perceive to be their realities. We may see some truth
    in the claims that some priests are heroic or heroes are lone, but seeing shades
    of one another scarcely matches the thrill of recognition when our labels are
    made real as flesh-and-blood people, or when the people we know and love (or know)
    are reduced to labels.


