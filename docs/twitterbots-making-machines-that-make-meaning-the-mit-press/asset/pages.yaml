    Metaphors are typically presented to their target audience as the products of
    intentional making-making process, and it is the readers'' recognition of this
    intentionality that leads them to make the metaphor seriously enough to plug the
    gap between what is said and what is implied. But as some metaphors fail to soar
    while many more simply flat, this perception of intentionality also leads readers
    to appraise a metaphor as a hit or a miss. Dreams, in contrast, regardless of
    whether they mean something or not at all, are rarely viewed as intentional acts,
    and no dream, no matter how fascinating or dull, is ever judged a success or a
    failure. When asking human judges to rate a bot-generated metaphor on dimensions
    such as vividness, drama, laughter, and entertainment, we might expect big-picture
    concerns about the success or failure of an utterance to color their ratings.
    However, as we have shown above, it is a simple matter to present human judges
    with the “dream” equivalent of our NOC-based metaphors to elicit ratings along
