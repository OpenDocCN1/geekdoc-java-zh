    # Search at the Crossroads


    Search plays a foundational role in two perspectives on human behavior that one
    would be forgiven for thinking at odds with each other. For the Al theorist, search
    is the core of all intelligent decision making: a rational decision maker must
    explore all of the available options and their ramifications. This requires an
    agent to explore an often vast space of possibilities—of actions and the effect
    of the actions they license—to find a path to the solution that minimizes reward,
    and obeys all of the stated constraints. For a creator in the Ulipo tradition,
    constrained search is also the name of the game, even if this search is conducted
    in the giddy spirit of playful generation, looks to us to be more aimless than
    directed, and feels more expansive than reductive.


    Each perspective is beholden to an entrenched metaphor that predates both. Indeed,
    we see this metaphor everywhere or in our language of problem solving, whenever
    we talk of backtracking or getting sidetracked or hitting a dead end, or of exhausting
    every avenue to find the right path,'
