    Each row in our spreadsheet represents a different semantic frame. To linguists
    who follow the frame-semantic tradition championed by Charles Fillmore, we can
    understand an action by understanding how its participants relate to each other
    through the semantic roles they play. And we can understand a role as victim or
    seller or patient by understanding how it relates to other roles in a given action.
    A semantic frame is a collection of roles that may be filled when describing a
    specific instance of an action. For instance, in any commercial transaction, there
    will be a buyer and a seller. These two roles are found in the frame of the actions
    “to buy” and “to sell,” though each will be realized in different syntactic positions
    in the sentence level. Thus, the seller fills the position of the verb “to sell,”
    but it is pushed into a “from” propositional phrase for the verb “to buy.” In
    our spreadsheet, we use columns to convey syntactic information, with the first
    three columns dedicated to the subject, verb, and object positions and cell values
    to convey semantic information. We use a broader collection of roles in our frames—how
    ninjas for shoguns and assassinate victims with the aid of accomplices—because
    we need to freight these requests with a moral dimension if we are later to give
    our bots the ability to make moral pronouncements about certain kinds of actions
    with certain kinds of role fillers.


