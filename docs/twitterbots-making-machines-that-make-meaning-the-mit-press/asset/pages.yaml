  md: 'methors will be. We''ve squeezed a great deal of knowledge into a metaphor-generating
    Trery grammar you can find in the Metaphor Generator subdirectory of our Tracer
    repository. This machine-generated grammar is so jam-packed with details that
    not only does it use of cryptic two- and three-letter labels for nonterminals


    Most revelations are fascinating, but others are “fascinating” as a brick wall.


    The grammar encodes the fact that revelations are stereotypically fascinating,
    just as it encodes the fact that brick walls are typically anything but fascinating.
    Facts like the former come from earlier research into similes and are harvested
    from the web using the search pattern “[X] as [Y].” Ironic observations about
    the latter are harvested from web mobiles, but this time using the search pattern
    “about as [X] as [Y].” It turns out that humans use to telegraph their creative
    (and often ironic) intent with markers of semantic imprecision such as “about,”
    “almost,” and “not so much.” The Tracer grammar pairs a nonronic stereotype with
    an ironic observation to create a new figurative comparison that is both factual
    and weird.


    Since KQkq allows its Tracer bots respond to any mentions of its handle in the
    tweets of others, you''ll also find a metaphor response in the same subdirectory.
    The grammar, named metaphor responses. txt, is a simpler format than the standard
    Tracer grammar. Each rule pairs a literal string on the left-hand side (the stimulus)
    with a single string on the right-hand side (the response). The only response
    can contain a nonterminal symbol. When the stimulus contains a property (such
    as “fascinating” or “sublime”), the response asks the main Tracer grammar to generate
    a metaphor that pivots on that property. For example, should another user mention
    the name of our bot and use the word “sublime” in the same text, CBDQ may generate
    the following response on our behalf:


    Most gems are sublime, but others are “sublime” as a kick to the head


    For good measure, the response grammar also contains a large number of stimulus:response
    pairs that have been autogenerated from an online dream dictionary, allowing the
    bot to offer faux analyses of a user’s dreams. The part of the response grammar
    dabbles in dream makes no reference to the main Tracer grammar and its nonterminals,
    so you are free to cut-and-paste this part into your own Tracer-based bots on
    CBDQ.'
