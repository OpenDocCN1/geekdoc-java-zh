    is Reddit, a vast community of people who share links and stories and vote on
    which should earn more. Bots can do many things on this site, from posting updates
    to submitting links and messaging users; these actions are analogous to replying
    to tweets, tweeting, and directly messaging users on Twitter. Reddit bots are
    often used as assistants to furnish online discussions with incidental chunks
    of information. For instance, one bot scans for YouTube videos, finds the top
    comment for that video, and appends it as a comment on the Reddit page. Another
    bot scans Reddit threads with more than five links to YouTube and creates a YouTube
