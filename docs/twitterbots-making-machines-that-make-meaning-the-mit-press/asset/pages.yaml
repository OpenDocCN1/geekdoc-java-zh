    The challenge of bending the affordances of Twitter''s API to the implementation
    of autonomous Twitterbots is what will interest the engineer in all of us, but
    this technical challenge poses in comparison to the knowledge challenge of building
    bots that can bend the conventions of human interaction, crafty witty, provocative,
    and concise outputs that we will want to read and eagerly regret. With this book,
    we set out to explore each of these challenges.


    Provocative writers have always been into “the whole brevity thing,” as The Dude
    memorably put in the 1998 movie The Big Lebowski. By saying, a creative writer
    can imply so much more than words could fully articulate. Long before Twitter,
    writers had ample opportunity to derive semiotic sport from the brevity of their
    aphorisms, their poems, and even their newspaper articles. One writer in particular,
    the French modern Félix Fénéon who lived in France a century ago, exercised his
    talent for concise on a task that might worthy “creative writing.” Fénéon was
    hired by the newspaper Le Matins to write a series of very short squibs on the
    various facts—divers, court cases, coroners’ reports—and from France that were
    not worthy of a full article of their own. Their squibs, or “novels in three lines,”
    as they later came to be called, were well-crafted tweets long before Twitter
    was a technical possibility. Consider this 114-character example of Fénéon’s oeuvre,
    as translated into English by Luc Santé: “Love decidently has a hard time sitting
    still. Émile Conte, 25 Rue Davy, pierced with his knife his wife’s breath.” This
    123-character cautionary tale is a personal favorite: “There is no longer a God
    for drunkards. Kersilie, of Saint-Germain, who had mistaken the window for the
    door, is dead.” But this 133-character pen portrait of a thug with a scar for
    each year of his life must take the prize for sheer evocativeness: “On Bécu, 28,
    who were awarded at Beaujon hospital with a gunshot wound, counted 28 scars. His
    nickname in the underworld: Target. To prove the point that Fénéon and Twitter
    were made for each other, Luc Santé created an account, @novins3lines, that contains
    all of Fénéon’s Matins squibs (or at least those clipped and saved by Fénéon’s
    partner) in separate tweets.¹⁶ As writers, we strive for just this kind of sparseness
    and minimalist grace in our tweets, and as build bots, we try to impart a similar
    talent for constructing texts that are just as lean and effective.


    Fénéon’s beloved tweets are all the better for leaving so much of the story to
    the reader’s imagination, and so, over a hundred years later, miniature tales
    still resonate with the contemporary world. This is perhaps'
