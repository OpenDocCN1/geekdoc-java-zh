    # Making the Jump to Hyperspace


    Our frames KB represents the space of possible actions that an agent may take,
    either for, or against another. If we construct a second space to give an idealized
    cast to the various roles used in our action frames, we can finally construct
    our moral maze from the cross-product of these two spaces and KBs. The resulting
    hyperspace will be far larger than either of its component spaces, for it will
    contain a multitude of crossroad junctions at which actions from our frames KB
    will intersect with moral exemplars from our KB of roles. For demonstration purposes,
    we now construct a simpler space of “ideal” roles to show how our bour can seamlessly
    integrate two spaces into hyperspace.


    Our KB of 4,730 frames has 336 unique roles, but these are from uniformly distributed.
    With most lexical choices, which use of roles obeys a power law distribution,
    with few roles commanding frequent use—for instance, “victim” has 837 uses in
    the KB—and with many more finding just a few uses apiece. In addition to “victim,”
    the most common roles are “rival” (331 uses), “enemy” (329 uses), “follower” (308
    uses), “dupe” (214 uses), and “accomplice” (193 uses). All roles that carry a
    strong moral dimension and for which one can easily imagine good and bad exemplars.
    Of course, what constitutes a “good” or “bad” filler for a role will depend on
    one’s own part in a possible transgression. If one intends to commit a crime,
    the ideal accomplice will be competent, loyal, and right-tipped in the eventuality
    of capture. Conversely, to the victims of a crime, a good accomplice will be a
    bad lieutenant—one who is disloyal, and quick to turn tail at the slightest sign
    of resistance. A Moses figure obeying moral injunctions will thus curse the former,
    and perhaps cynically, for the latter.


    To begin, let’s create a new spreadsheet for our role space and give it the name
    Idealroles.xlsx. In the first column, we place our roles, one row per 336 rows.
    In the second, we place one or more separated positive “ideals” for each role,
    as in the following snapshot (with column labels in row 1):


