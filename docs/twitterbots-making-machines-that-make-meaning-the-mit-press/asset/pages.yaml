    all of the words that were tallied. The higher the tally of a particular word,
    the greater the chance it has being selected, much like buying more tickets in
    a lottery increases the chance of winning. The algorithm picks its next word,
    it adds it to its sentence and uses that to look up a set of tallies for the word
    after that. This process continues until the algorithm has a fresh sentence to
    tweet. Here are some sample sentences generated by the Markov approach to slice,
