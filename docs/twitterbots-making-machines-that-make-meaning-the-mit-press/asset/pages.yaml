  md: '# Fifty Shades of Dorian Gray


    # The Selfies of Dorian Gray


    We were to reinvent Dorian Gray for the twenty-first century, the young cad about
    town would now have as many ways to strut his stuff in the virtual world as in
    the real. Gray might now likely favor Facebook over LinkedIn to upload his artistic
    impressions of him to Pinterest, though as he would surely delight in the possibilities
    of the digital self-portrait to shape his own aesthetic image on Instagram and
    Flickr. Lacking any need or desire to work for a living, Gray would most likely
    favor manicured hands, each tweet would likely serve as the linguistic equivalent
    of a selfie online pose to convey one''s attitude to the world and especially,
    one''s social circle. In fact, because what we tweet and whom we follow can be
    so very revealing about our inner selves, a burglar who came upon Gray''s hidden
    “soul” portrait in the attic could scarcely learn more about the man''s true personality
    than any of his followers on Twitter. Our online personality is now as measurable
    as our carbon footprint and is as much a function of what we unthinkingly discard
    as what we flaunt.


    In addition to some rather obvious statistics, such as how often we tweet, how
    many others follow us, and how many others follow us, we principally reinvent
    ourselves in our choice of words. How often I refer to “I,” “me,” “myself,” “mine”
    and “my” can tell you a good deal about my propensity for self-absorption, with
    a frequent use of “we” and “our” indicates a willingness to share either credit
    or blame. The frequency with which I use “you” or “your” is just as indicative
    of a desire to channel my feelings outward, so if I also show a partiality for
    negative words, this pairing of observables is strongly indicative of hostility.
    Frequent use of “LOL,” “OMG,” and the exclamation point reveals an excitable personality,'
