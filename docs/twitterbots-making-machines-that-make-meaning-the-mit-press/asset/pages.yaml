  md: '# Fifty Shades of Dorian Gray 171


    Olivia uses William S. Burroughs’s cutup method in much the same way that it is
    used by Darius Kazemi’s @twoheadlines: to splice two arbitrary tweets into one.
    Whereas @twoheadlines cuts news headlines to produce new headlines, Olivia slices
    random Twitter musings to produce oddly engraining brains. Olivia’s core algorithm,
    as described by Dubbin, is remarkably simple: the bot looks for hyperbolic tweets
    that use adverbs such as "totally" and "literally" to emphasize a phrase, as in,
    "If we leader of the Labour Party would totally spend my time at big public meetings
    in my honour" and "Freddie Mercury would totally spend into this too." Splicing
    these together with the adversarial pivot creates two new-formed possibilities:
    "If I were leader of the Labour Party I would fit into this too" and "Freddie
    Mercury would spend all my time at big public meetings in my honour. Because of
    the fondness for adverbs like totally, the inputs to the bot’s slicer are quite
    often the work of teenagers, or at least young of heart, Dubbin noticed that his
    bot’s outputs tend to smell like teen spirit too. A tightly constrained use of
    the cutup method resulted in a bot with a distinct personality that Dubbin named
    Olivia Taters, or as writer Aaron Sinkin dubs "America’s favorite robot teenager."


    Though the Olivia bot gathers its raw materials from diverse and more-random Twitter
    effusions that are only in their use of particular adverbs, her personality is
    not the wishy-washy aggregate we see in @botALL. Rather, as shown in the bot’s
    AnalyzeWords profile, she (both Dubbin and Sinkin) enthusiastically refer to the
    bot as a "she" remains a well-drawn presence on Twitter. She exudes anger and
    affability, analytically, and an awareness of her feelings and her environment,
    and she tempers occasional dark thoughts with LOL excitability. Olivia pushes
    many of the AnalyzeWords needing in directions where they provoke comparisons
