  md: 'But however one views their efforts, these bots make Twitter a more creative
    place for everyone.


    Most Twitterbots are simple constructs that make a virtue of their simplicity.
    Their value is to be measured in ideas rather than lines of code. Prolific Twitter
    builder Darius Kazemi calls such bots tiny subdivisions, simple creations that
    amuse and provoke, and those very artificial prompts us to think a little more
    about the nature of human creativity.¹12 Kazemi''s @botheadlines subverts the
    daily news, creating one imaginary headline from two real ones. Fabricated headlines,
    such as "Miss Universe attacks northern city; dozens killed," make us laugh and
    make us think about the baggage we bring with us to a news story (e.g., that stories
    about Miss Universe are fluff, while stories about Boko Haram are bleak.) @pentametron,
    a Twitterbot by developer Ranjit Bhatnagar, finds ancient poetry in the random
    musings of the Twittersphere. His technique is simple: find two of ten syllables
    that each can be read as written in the poetic meter of iambic pentameter, where
    every second syllable is stressed and follows an unstressed syllable. Shakespeare''s
    classic line “But, soft! What light through window breaks?” is the model of iambic
    pentameter. By pairing two syllables randomly if they rhyme on their last syllables,
    @pentametron creates rhyming couples by pairing tweets such as "Come on slam,
    and welcome to the jam," with "Many Twitter profiles are filled with spam." Although
    @pentametron lacks understanding of what each tweet actually mean, its resulting
    blends are often charming, surprising, and highly retweetable. The bot encourages
    us to understand each tweet in a new light, and perhaps a little more, and a little
    more deeply, about what it is that makes any text worthy of the label "poem."


    It takes knowledge—of Twitter, language, poetry, of the news—for a bot to insolently
    spin off new tweets (with new meanings) from the thoughts and words of others.
    In the popular imagination, the bot is associated with an altogether darker strain
    of educated insolence, in which malignant software agents exploit an inbuilt knowledge
    of network protocols and security conventions to disrupt and prevent the operation
    of other software systems. The “hackers” who build these systems are not lacking
    in creativity, theirs is an unbalanced creativity that places an undue emphasis
    on insolence over education. However, this book is born of the belief that not
    all hackers are devious and not all bots are insidious. The word “hacking” has
    an older sense, that denotes any programmer who takes joy in the pure act of software
    creation, while “bot” can mean any autonomous software system that is designed
    to help, amuse, provoke,'
