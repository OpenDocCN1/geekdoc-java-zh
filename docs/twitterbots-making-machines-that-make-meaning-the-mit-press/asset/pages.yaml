    Twitter provides a RESTful API to its developers. If REST implies a Zen detachment
    from worldly concerns, this is not so far from the mark. REST is in short fact
    for representational state transfer, and for developers it indicates a certain
    choice of architecture and a certain mode of interaction with the API. A RESTful
    API maintains a clean separation between the "client" (the system using the API
    to access services and transfer data) and the "server" (the system that actually
    provides the API as a means of providing services and data to its users). In the
    case of a Twitterbot, the server provides the Twitter-side machinery while the
    client is the bot in question. A RESTful server undertakes to fulfill all requests
    from a client efficiently and with a minimum of fuss for both parties. The server
    will not maintain any state information for the client; rather it is the client''s
    responsibility to keep track of its own use of the API and the current state of
    its larger goal in using the API. Likewise, the server will not expect the client
    to store any information that is not properly stored on the server side. Thus,
    the Twitter API will not ask a client to maintain its own Twitter timeline or
    store a list of its past tweets (though of course is free to do so if it wishes).
    As transactions between the server and the client should be considered one-shot
    and atomic, as it becomes the responsibility of the client to disconnect its task
    into a sequence of such transactions, each of which will not ask the server to
    remember the state or the result of a previous transaction. All such transactions
    will be conducted over the web via its hypertext transfer protocol (http). The
    client can micromanage this http connection with directly, or it can employ a
    third-party library that manages this low-level communication on its behalf. By
