    # Carpet Diem


    The web provides an abundance of code and tools for creating your own cellular
    automata, and the GitHub of resources for this book contains a variety of java
    classes so that bots can create automata that weave captivating images of their
    own. Two classes in particular are of interest to bot builders. The class ColorAutomaton
    implements an n-state automaton of m cells in each of its n states and m cells
    is represented as a distinct RGB color. An instance of ColorAutomaton will unfurl
    a 2-D image of m x pixels over t ticks by first creating its random rule set and
    its own 1-D starting row of m cells, before it then applies those rules to change
    the cells from one tick to the next. Though each automaton is happy to work entirely
    from random rules and start states, built-in search functionality using Lévy flight
    allows a client bot to nudge an automaton into an aesthetic sweet spot in the
    space of possible rules and start states. Since states are represented within
    each automaton as colors, this class also provides antialiasing and mirroring
    capabilities that conveniently prepare the automaton''s internal states for subsequent
    rendering as a 2-D image:


