    boundaries, to connect with large groups of people. Sometimes the people coalesce
    into communities, like the loose collective of bot makers who go by the hashtag
    #botALLY on Twitter (the pronunciation of it is something of mystery, with some
    preferring it to rhyme it with totally and others declaring themselves “bot allies”
