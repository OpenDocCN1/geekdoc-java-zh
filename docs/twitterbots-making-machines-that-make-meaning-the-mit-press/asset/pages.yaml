    franchisees and adopted by the parent company only once they they had proven themselves
    with customers, a variety of Twitter’s key features were first jury-rigged by
    its users out of sheer communicative necessity, long before they were officially
    supported by the software itself. Retweeting emerged as a convention where users
    would simply paste the text of one tweet into another and append the marker “RT”
    before the Twitter handle of the original author. But this approach, which gave
    little change from 140 characters, left resenders with little room to comment
    their own. Moreover, because all conventions are open to creative exploitation,
    the “It’s a boy!” convention exploited by Edward Teller to creatively mark the
    birth of his new technology or the “please advise” convention exploited by Robert
    Benchly to affect a journalistic naiveté, the RT convention lends itself to mischief,
    misrepresentation, and downright仕上げ. Consider the following tweet that satirically
    chan-nels voice of another user:


    Yes! We should send illegal aliens into space. RT @realDonaldTrump: My WILL will
    be TREENDOUS that aliens will see it from space.


    The old RT convention allowed Twitter users to put words in the mouths of others,
    concocting misrepresentations that were harder to detect in this particular case.
    For this reason, Twitter introduced an unofficial retweet function that allows
    an original tweet to be attached to another in its unedited entirety and frees
    up the surrounding tweet to use its full allocation of 140 characters for new
    text. Users, however, remain free to use the unofficial RT convention for mostly
    humorous ends, crafting their own works of educated innocence from the tweets
    of others.


    Conventions rarely stayed to their intended patterns of were very long. Creativity
    always finds a way, allowing humans to evolve new conventions or find new ways
    of adapting old conventions to uses for fresh meanings. Charge people by the word
    for their messages, and people will choose to express themselves with one long
    word rather than two short ones. Give people a means of sharing their joy at the
    birth of a child, and they will subvert it as a means of expressing joy at the
    dawn of a new age. Limit the messages that people can write to a mere 140 characters,
    and they will make a sport of this constraint, fitting witty ways to squeeze maximal
    value from every single character. Give engineers an API for building an ecology
    of third-party applications around your communication service, and they will create
    a rich set of new features and affordances for human users to enjoy. They may
