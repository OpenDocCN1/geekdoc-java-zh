    # Springtime for Twitter and Iron


    Western Union, the most iconic of telegraph companies, sent its last telegram
    on January 27, 2006, though telegrams had already been viewed as anachronisms
    for decades.¹14 The British post office discontinued the service in 1982, yet
    the idea, if not the reality, of the telegraph still held a secure place in the
    language and the popular imagination. For instance, the reading of “telegraphs”
    from absent guests at wedding banquets continued unabated, even if the telegrams
    of old were replaced by faxes, emails, and texts. It took two months after Western
    Union killed the telegram for Twitter to post its first tweet, on March 21, 2006,
    long before the word tweet was coined (the earliest tweets were called tweets
    or status updates*). That first tweet, from Twitter cofounder Jack Dorsey, had
    none of the grandeur of Morse’s “What God had wrought” and showed a mix of humility
    and brand uncertainty when he claimed to be setting up “my tweet.” It was, then,
    of a small step than a giant leap. But Dorsey’s tweet was marking time in more
    ways than one. Unlike the ephemeral telegrams of yore, the most important instances
    of which are now found only in the journalistic record (in the best cases) or
    apocryphal gospel (the worst, and most likely, cases), this first tweet for Twitter
    still exists as part of Dorsey’s official Twitter timeline. Indeed, the tweet,
    which has a unique status ID, also occurs in the timelines of many other Twitter
    users, since it has been retweet (which is to say, forwarded from user to user)
    over 100,000 times since its minting. Dorsey’s tweet has a URL that reveals its
    status id:


    ```

    https://twitter.com/jack/status/20

    ```


    Only the earliest tweets had such an impressively low-status ID. Those first tweets
    were called status updates because Twitter was originally conceived as a service
    that would allow its users to keep friends, family, and other “followers” up-to-date
    on their comings and goings, that is, on their current status.¹15 Dorsey had been
    inspired by a secondary feature of instant messaging apps that allowed users to
    explain, with a small piece of text of the “gone fishing” variety, which they
    were currently unavailable to respond'
