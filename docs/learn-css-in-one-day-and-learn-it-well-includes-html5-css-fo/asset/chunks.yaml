  trans: "\n\n> 刷新浏览器。没有任何变化对吧？那是因为 `list-style-position: outside;` 是默认值。现在将 `list-style-position:\
    \ outside;` 改为 `list-style-position: inside;`。你会发现无序列表向右稍微移动了（即缩进增加了）。\n\n> 5.\
    \ 移除 `ul` 的 `list-style-type` 属性，并添加以下内容：\n\n> (a) `list-style-image: url(\"myMarker.gif\"\
    );`\n\n> 观察“Cars Unordered List”发生了什么变化。\n> 6. 现在让我们来看看如何为超链接样式。尝试在指定的选择器中添加以下规则：\n\
    \n> (a) 在 `a:link{}` 中添加 `color: green;`\n> 并观察“Click Me”链接发生了什么变化。\n\n> (b) 在\
    \ `a:active{}` 中添加 `font-size: 2em;`\n> 并点击该链接。\n\n> (c) 在 `a:hover{}` 中添加 `background-color:\
    \ red;`\n> 并鼠标悬停在链接上。\n\n### 练习 9.2\n\n> 1. 在浏览器和文本编辑器中同时打开 `Chapter 9 - Navigation\
    \ Bar.html` 文件。\n> 2. 此页面展示了如何使用列表和链接的 CSS 规则创建一个水平导航栏的示例。书中解释了这些步骤。学习代码并尝试修改\
    \ CSS 声明以改进此导航栏的设计。\n\n# 第 10 章：表格\n\nHTML 表格默认外观并不好看。然而，通过一些简单的 CSS 样式设置，我们可以轻松地将其转换为精美的表格。在本章中，我们将学习如何实现。\n\
    \n## 边框、内边距和外边距\n\n我们将查看的第一组属性是 `border`、`padding` 和 `margin` 属性。还记得我们在讨论 CSS\
    \ 盒模型时提到过这些属性吗？HTML 表格（`<table>`）和表格单元格（`<th>` 和 `<td>`）遵循与其他 CSS 元素相同的盒模型，因此可以使用这些属性进行样式设置。\n\
    \n为了理解这些是如何运作的，请参考下图（“Table Margin”和“Table Padding”字样仅供参考，在实际表格中并不）。\n\n![](img/00014.jpg)\n\
    \n该表格的 CSS 规则如下：\n\n```css\ntable {\n  border: dashed 1px black;\n  padding: 50px;\n\
    \  margin: 60px;\n}\n\nth {\n  border: solid 1px black;\n  padding: 30px;\n  text-align:\
    \ center;\n}\ntd {\n  border: solid 1px black;\n  padding: 20px;\n}\n```\n\n虚线是表格的边框（border）。虚边框周围的空间是表格的外边距（margin，声明为\
    \ 60px），虚边框内部的空间是它的内边距（padding，50px）。\n\n第一行（Firstname, Lastname, Age）使用 `<th>`\
    \ 标签定义为表格表头。“Firstname”、“Lastname”和“Age”单词周围的空间是 `<th>` 元素的内边距（30px）。\n\n第二、第三和第四行使用\
    \ `<td>` 标签定义。诸如“Derek”、“Aaron”和“31”等单词周围的空间是 `<td>` 元素的内边距（20px）。\n\n`<th>` 和\
    \ `<td>` 元素没有声明外边距，因为外边距对表格单元格会被忽略。因此，我们无法指定单元格之间的间距。默认情况下，单个表格单元格之间会有很小的间隙。此外，即使你将表格内边距设置为\
    \ 0px，表格边框（虚线）与单元格边框（实线）之间也存在一个间隙。如果你只需要一个边框，必须使用 `border-collapse` 属性：\n\n```css\n\
    border-collapse: collapse;\n```\n\n在我们进行本章的练习时，将有机会尝试 `border`、`padding` 和 `margin`\
    \ 属性。现在，让我们继续下一个属性。\n\n## 高和宽\n\n表格的宽度和高度可以使用 `width` 和 `height` 属性进行设置。值通常以像素或百分比的形式给出。例如，下面的代码将表格宽度设置为父元素宽度的\
    \ 100%，高度设置为 500px。\n\n```css\ntable {\n  width: 100%;\n  height: 500px;\n}\n\
    ```\n\n你也可以在 `tr`、`th` 或 `td` 级别使用 `height` 属性。例如，如果你想让表头行的高度为 100px，你可以写：\n\n\
    ```css\nth {\n  height: 100px;\n}\n```\n\n此外，你可以在表格单元格级别设置 `width` 属性（即针对 `td`\
    \ 和 `th` 元素）。如果你想让表格单元格的宽度为 200px，你可以写：\n\n```css\nth {\n  width: 200px;\n}\n\
    ```\n\n如果你想对单独的列设置样式，可以使用 `id`/`class` 属性。例如，如果你有下面的表格结构：\n\n```html\n<table>\n\
    \  <tr>\n    <th id=\"firstColumn\">First Column</th>\n    <th id=\"secondColumn\"\
    >First Column</th>\n  </tr>\n  <tr>\n    <td>Some data</td>\n    <td>More data</td>\n\
    \  </tr>\n</table>\n```\n\n你可以单独设置列的宽度。\n\n```css\n#firstColumn {\n  width: 40%;\n\
    }\n\n#secondColumn {\n  width: 60%;\n}\n```\n\n## 文字对齐\n\n表格单元格内的文字可以使用 `text-align`\
    \ 属性进行水平对齐，使用 `vertical-align` 属性进行垂直对齐。`text-align` 的常用值有 `center`、`left` 和 `right`。`vertical-align`\
    \ 的常用值有 `top`、`middle` 和 `bottom`。\n\n```css\nth {\n  text-align: center;\n  vertical-align:\
    \ middle;\n}\n```\n\n## 背景、字体和文字\n\n表格还可以使用第 7 和 8 章中的属性设置样式。例如，下面的代码将 `<th>`\
    \ 元素设置为绿色背景。\n\n```css\nth {\n  background-color: green;\n}\n```\n\n## nth-child\
    \ 选择器\n\n有时表格非常难以阅读。提高可读性的一种方法是交替行上色。对于偶数行，我们写：\n\n```css\ntr:nth-child(even)\
    \ {\n  background-color: lightgray;\n}\n```\n\n对于奇数行，我们写：\n\n```css\ntr:nth-child(odd)\
    \ {\n  background-color: lightblue;\n}\n```\n\n### 练习 10\n\n> 1. 在浏览器和文本编辑器中同时打开\
    \ `Chapter 9 - Navigation Bar.html` 文件。\n> 2. 此页面展示了如何使用列表和链接的 CSS 规则创建一个水平导航栏的示例。书中解释了这些步骤。学习代码并尝试修改\
    \ CSS 声明以改进此导航栏的设计。\n\n### 练习 10.1\n\n> 1. 在浏览器和文本编辑器中同时打开 `Chapter 10 - Tables.html`\
    \ 文件。\n> 2. 修改 `table` 的 声明并观察表格发生了什么。尝试添加以下内容：\n\n> (a) `padding: 50px;`\n> (b)\
    \ `margin: 30px;`\n> (c) `border-collapse: collapse;`\n> (d) 将 `border: dashed\
    \ 1px black;` 改为 `border: 2px green;`\n> 3. 修改 `th` 的 声明并观察表格发生了什么。尝试添加：\n\n>\
    \ (a) `padding: 50px;`\n> (b) `margin: 30px;`（外边距规则会被忽略，试试看）\n> 对 `td` 执行同样的操作。\n\
    > 4. 移除第 3 部分中 `td` 和 `th` 的 `padding` 和 `margin` 属性。修改 `table` 的 声明并观察表格发生了什么。尝试添加以下：\n\
    \n> (a) `width: 300px;`\n> (b) `width: 50%;`\n> 注意现在表格的宽度是红色框的 50%。\n> (c) `height:\
    \ 500px;`\n> (d) `height: 80%;`\n> 注意现在表格的高度是红色框的 80%。\n> 5. 移除第 4 部分中 `table`\
    \ 的 `height` 和 `width` 属性。修改 `th` 的 声明并观察表格发生了什么。尝试将 `height` 属性更改为：\n\n> (a)\
    \ `height: 100px;`\n> 从 `th` 中移除 `height` 属性并将其添加到 `td` 中。观察发生了什么。对 `tr` 执行同样的操作。\n\
    > 6. 修改 `th` 的 声明并观察表格发生了什么。尝试将 `width` 属性更改为：\n\n> (a) `width: 100px;`\n> 从 `th`\
    \ 中移除 `width` 属性并将其添加到 `td` 中。观察发生了什么。应该没有区别，因为无论你在 `th` 还是 `td` 级别设置表格单元格的宽度，该宽度都会影响这两个元素。\n\
    \n"
- fmt: "\n## 7. Add the attributes `id=\"firstColumn\"`, `id=\"secondColumn\"` and\
    \ `id=\"thirdColumn\"` to the first, second and third `<th>` start tags respectively.\
    \ Next, add the following CSS rules to adjust the width of the three columns separately:\n\
    \n```css\n#firstColumn {\n    width: 100px;\n}\n#secondColumn {\n    width: 200px;\n\
    }\n#thirdColumn {\n    width: 50px;\n}\n```\n\nRefresh the page and observe what\
    \ happens. Try adjusting the width with different values.\n\n## 8. Modify the\
    \ CSS declaration for `tr` and observe what happens to the table. Try adding:\n\
    \n(a) `text-align: center;`\n(b) `vertical-align: top;`\n\nRemove the above properties\
    \ from `tr` and add them to `th`. Notice what happens. Repeat the same for `td`.\
    \ If you do not see any difference, try increasing the width of the table and/or\
    \ the height of the rows.\n\n## 9. Modify the CSS declaration for `tr` and observe\
    \ what happens to the table. Try adding:\n\n(a) `background-color: green;`\n(b)\
    \ `color: white;`\n\nRemove the above properties from `tr` and add them to `th`.\
    \ Notice what happens.\n\nNow, remove the properties from `th` and add them to\
    \ `td`.\n\n## 10. Finally, let’s try coloring alternating rows. Remove the `background-color`\
    \ and `color` rules from `td` first. Next, add the following code and observe\
    \ what happens.\n\n```css\ntr:nth-child(even) {\n    background-color: lightgreen;\n\
