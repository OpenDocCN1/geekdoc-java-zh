  trans: "\n在 HTML 文档的后续部分，你有以下 HTML 代码，其中包含一个内联 CSS 规则：\n\n```html\n<p style=\"font-size:\
    \ 30px;\">>Some text</p>\n```\n\n你认为哪条规则将应用到“Some text”这些文字上？\n\n正确答案是内联规则。这是因为在其他相等的情况下，最后声明的规则具有最高优先级。由于内联\
    \ CSS 是在 HTML 代码内部声明的，它的声明时间比在 `head` 部分声明的嵌入式 CSS 要晚。因此，将应用 `30px` 的字体大小。\n\n\
    ## 显示不一致\n\n在处理 CSS 时，需要面对的另一个问题是浏览器之间的显示不一致问题。你可能会发现你的网站在不同的浏览器中看起来略有不同（或差异巨大）。大多数显示问题倾向于出现在旧版本的\
    \ Internet Explorer 中，尽管问题也可能出现在其他浏览器中（尤其是移动端浏览器）。\n\n显示不一致的发生是因为不同的浏览器使用不同的布局引擎来解释网站的\
    \ CSS 代码。例如，`Safari` 和 `Chrome` 使用 `WebKit` 引擎，而 `Firefox` 使用 `Gecko` 引擎。一个引擎计算和显示页面的方式可能与另一个引擎不同。例如，`Internet\
    \ Explorer` 使用的引擎 `Trident` 会自动为某些页面设计增加页面的像素宽度。这可能导致宽度不足而侧边栏被推到底部。\n\n另一个导致显示不一致的问题是对某些\
    \ CSS 属性缺乏通用支持。某些属性并不是被所有浏览器支持的。你可以访问 [`www.caniuse.com`](http://www.caniuse.com/)\
    \ 网站来检查你正在开发的浏览器是否支持某个 CSS 属性。\n\n有时，只有当我们为 CSS 规则添加前缀时，特定的浏览器才会支持某个 CSS 属性。这对于\
    \ `CSS3` 中的新属性尤其如此。一个例子是 `CSS3` 中的 `column-count` 属性。该属性将一个元素分为多个列。例如，我们可以通过编写\
    \ `column-count: 3` 将一个 `div` 元素分为三列。\n\n旧版本的 `Firefox`、`Chrome`、`Safari` 和 `Opera`\
    \ 不支持此属性。为了让该属性在这些浏览器上生效，你必须写成三个声明：\n\n```css\n-webkit-column-count: 3;\n-moz-column-count:\
    \ 3;\ncolumn-count: 3;\n```\n\n而不是简单的：\n\n```css\ncolumn-count: 3;\n```\n\n`-webkit-`\
    \ 前缀增加了对旧版本 `Chrome`、`Safari` 和 `Opera` 的支持，而 `-moz-` 前缀增加了对 `Firefox` 的支持。此外，我们还有\
    \ `-ms-` 前缀增加了对 `Internet Explorer` 的支持。\n\n在创建网站时，在各种浏览器上进行测试是有用的，以确保没有内容出现损坏。修复“损坏”显示的方法取决于导致问题的原因。如果你真的被住了，我建议去搜索或在\
    \ [`stackoverflow.com`](http://stackoverflow.com/) 上发布提问，这是一个对程序员非常有用的在线社区。\n\n\
    ## 注释\n\n本章涵盖的最后一个内容是注释。在 CSS 中，我们使用 `/*...*/` 符号向代码中添加注释。例如下：\n\n```css\n/*\n\
    下面的规则是注释。\np {\n    background-color: black;\n    font-size: 20px;\n    color:\
    \ white;\n}\n*/\n```\n\n`/*` 和 `*/` 之间的所有内容都会被浏览器忽略。\n\n## 练习 3\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
    \ 下载此练习的源代码并解压文件。此练习的源代码可以在 `Chapter 3 - Basics of CSS` 中找到。\n\n### 练习 3.1\n\n\
    1. 在浏览器和文本编辑器中打开 `Chapter 3 - Basics of CSS.html` 文件。\n2. 首先，在源编辑器中寻找以下几行：\n```css\n\
    p {\n    background-color: yellow;\n}\n```\n这选中了所有的 `<p>` 元素并将背景颜色设置为黄色。'This\
    \ is some text in the div.' 这一行没有被选中，因为它不在任何 `<p>` 标签内。\n3. 现在，让我们尝试将规则从\n```css\n\
    p {\n    background-color: yellow;\n}\n```\n改为\n```css\nP {\n    Background-colo:\
    \ YELLOW;\n}\n```\n在文本编辑器中保存文件并刷新浏览器。注意看，没有任何变化？这是因为 CSS 在大多数情况下对大小写不敏感。\n4. 现在，让我们尝试选择不同的\
    \ HTML 元素，并观察哪些元素最终变成了黄色背景。对于每一项，只需将 HTML 文件中第 6 行的选择器更改所需的选择器。\n首先，让我们选择 `class\
    \ = \"myClassPara\"` 的元素。为此只需将 CSS 规则中的 `p` 选择器改为 `.myClassPara`。保存文件并刷新浏览器。注意哪个段落被选中了。\n\
    5. 现在将选择器改为 `.myclasspara`。注意发现没有任何被选中？那是因为 CSS 在选择类和 ID 时是大小写敏感的。\n6. 接下来，让我们选择\
    \ `id = \"myIDPara\"` 的元素。尝试自己动手。学会了吗？你可以将 `.myClassPara` 改为 `p#myIDPara` 或直接用\
    \ `#myIDPara`。注意哪个段落被选中了。尝试将 `#myIDPara` 改为 `#MYIDPARA`。注意没有任何被选中？\n7. 接下来，让我们学习如何选择多个元素。尝试同时选择\
    \ `h1` 和 `h2` 元素。这样做的方法只需将选择器改为 `h1, h2`。\n8. 接下来尝试选择 `div` 元素。做到，只需将选择器改为 `div`。\n\
    9. 现在，让我们选择 `div` 元素内部的 `p` 元素。为此我们编写 `div p` 作为选择器。注意哪些元素被选中了。\n10. 接下来，尝试选择所有的链接\
    \ (`<a>`) 元素。你注意到了什么？链接现在都高亮显示为黄色，对吧？\n11. 接下来，我们将根据 HTML 属性缩小选择范围。尝试选择 `href=\"\
    http://www.learncodingfast.com\"` 的链接。此事的正确方法是使用方括号，如下：\n```css\na[href=\"http://www.learncodingfast.com\"\
    ]\n```\n尝试一下。现在只有第一个链接会有黄色背景。\n12. 接下来，我们将使用伪类选择器在鼠标悬停在链接元素上时更改所有链接元素的背景颜色。尝试将\n\
    ```css\na[href=\"http://www.learncodingfast.com\"]\n```\n改为\n```css\na:hover\n\
    ```\n保存文件并刷新浏览器。注意没有任何被选中？现在将鼠标悬停在任何链接上并观察发生了什么。\n13. 接下来，让我们尝试选择 `div` 元素的第二个子元素。通过将选择器改为\n\
    ```css\np:nth-child(2)\n```\n来实现。\n14. 现在，让我们尝试选择所有 `<p>` 元素的第一个字母。你使用伪元素 `first-letter`\
    \ 来。将选择器改为\n```css\np::first-letter\n```\n15. 接下来，让我们看看元素拥有多个类时会发生什么。将选择器改回 `.myClassPara`\
    \ 并在 `</style>` 之前添加以下 CSS 代码：\n```css\n.mySecondPara {\n    text-decoration:\
    \ underline;\n}\n```\n注意哪个段落既有黄色背景又有下划线。这是因为该段落有两个类：`myClassPara` 和 `mySecondPara`。\n\
    16. 最后，让我们尝试在所有 `<p>` 元素的结尾添加叹号。使用 `after` 伪元素来实现。在 `</style>` 之前添加以下 CSS 代码：\n\
    ```css\np::after{\n    content: \"!\";\n}\n```\n\n## 第 4 章：CSS Box 模型\n\n到为止，我们涵盖了\
    \ HTML 和 CSS 的基础。在本章中，我们将开始编写实际的 CSS 代码。具体来说，我们将学习 CSS 盒模型（Box Model），并如何修改盒的外观。\n\
    \n### 什么是 CSS 盒模型\n\n在 CSS 中，所有元素都被视为盒子。CSS 盒子由外边距、边框、内边距和实际内容组成，如下所示。\n"
- fmt: "\n![](images/00011.jpg)\n\nThe thick black line is the border. Within the\
    \ border is the padding and the actual content. Outside the border is the margin\
    \ of the box. The thickness of the padding, border and margin can all be modified\
    \ with CSS. To understand how this box model works, let’s analyze the code below.\
    \ You can download this code at [http://learncodingfast.com/css](http://learncodingfast.com/css).\n\
    \n```html\n<!doctype html>\n<html>\n<head><title>Chapter 4 - CSS Box Model</title>\n\
    <style type=\"text/css\">\n#box1 {\nmargin: 20px;\npadding: 10px;\nborder: 5px\
    \ solid black;\nwidth: 100px;\nheight: 100px;\ntext-align: justify;\nfloat: left;\n\
    }\n#box2 {\nmargin: 20px;\npadding: 50px;\nborder: 5px solid black;\nwidth: 100px;\n\
    height: 100px;\ntext-align: justify;\nfloat: left;\n}\n</style></head>\n<body>\n\
    <div id=\"box1\">Learn CSS in One Day and Learn It Well. CSS is easy.</div>\n\
