  trans: "\n\n`<ol>` 标签代表有序列表（ordered list），用于创建以数字或字母作为标记的列表。\n\n### 示例\n```html\n\
    <ol>\n  <li>Chocolate</li>\n  <li>Strawberry</li>\n  <li>Vanilla</li>\n</ol>\n\
    ```\n输出：\n> 1. Chocolate（巧克力）\n> 2. Strawberry（草莓）\n> 3. Vanilla（香草）\n\n`<ul>`...`</ul>`\
    \ 和 `<li>`...`</li>`\n\n`<ul>` 标签代表无序列表（unordered list），与 `<ol>` 标签类似。然而，它不使用数字或字母作为列表标记，而是使用形状（如圆点或空心圆）。\n\
    \n### 表格\n`<table>`...`</table>`， `<tr>`...`</tr>`， `<th>`...`</th>`，以及 `<td>`...`</td>`\n\
    \n`<table>` 标签用于创建表格。`<tr>` 代表“表格行”（Table Row），`<th>` 代表“表格表头”（Table Header），`<td>`\
    \ 代表“表格数据”（Table Data）。在 HTML 中，表格按行创建的。\n\n#### 示例（数字不属于代码部分）：\n```html\n<table>\n\
    \  <tr>\n    <th>Name</th>\n    <th>Gender</th>\n  </tr>\n  <tr>\n    <td>Abigail</td>\n\
    \    <td>F</td>\n  </tr>\n  <tr>\n    <td>Benny</td>\n    <td>M</td>\n  </tr>\n\
    </table>\n```\n这段代码将为你生成一个有 3 行 2 列的表格。第 2 到 5 行定义了表格的第一行，由于使用了 `<th>` 标签，它是表头行。第\
    \ 6 到 9 行定义了第二行，第 10 到 13 行定义了第三行。取决于你在 CSS 中如何设置表格，你会得到一个下面类似的表格：\n\n![](img/00005.jpg)\n\
    \n#### 与 CSS 结合使用的元素\n有两个特殊的 HTML 元素，它们在 HTML 中没有内在含义。它们主要与 CSS 结合使用，为网页的特定部分设置样式。这两个元素是\
    \ `div` 和 `span`。\n\n#### Div 标签\n`<div>`...`</div>`\n\n`<div>` 代表“划分”（division），用于定义\
    \ HTML 文档中的一个划分或区域。`<div>` 标签通常与 CSS 结合使用，来格式化 `<div>`...`</div>` 标签内部的内容。\n\n\
    例如，如果我们写道：\n```html\n<div>\n  This is some division in the HTML document.\n  <ol>\n\
    \    <li>Chocolate</li>\n    <li>Strawberry</li>\n    <li>Vanilla</li>\n  </ol>\n\
    </div>\n```\n我们可以使用 CSS 来格式化 `div` 标签内部的所有内容（即文本和有序列表）。我们将在下一章学习如何进行操作。\n\n####\
    \ Span 标签\n`<span>`...`</span>`\n\n`<span>` 标签与 `<div>` 标签类似。主要的区别在于 `<div>` 是一个块级元素（block\
    \ element），而 `<span>` 是一个行内元素（inline element）。\n\n块级元素是以换行符开始和结束的。相比之下，行内元素不会以换行符开始或结束。例如，如果我们写道：\n\
    \n`This is a <div>block element</div>, while this is an <span>inline</span> element.`\n\
    \n我们将得到：\n`This is a`\n`block element`\n`, while this is an inline element.`\n\
    \n由于短语“block element”被标记了 `<div>` 标签，它会在新行开始并结束。另一方面，“inline”一词是一个行内元素，不会在新行开始或结束。通常，我们倾向于使用\
    \ `<div>` 来包裹文档的各个章节，而 `<span>` 用于包裹小部分文本、图像等。\n\n### 用于在网站中添加 JavaScript 代码的元素\n\
    `<script>`...`</script>`\n\n`<script>` 标签用于向我们的 HTML 文档添加内部 JavaScript 代码，或链接到外部脚本。JavaScript\
    \ 是一种脚本语言，为我们的网站添加交互性。\n\n#### 示例（添加内部 JS 代码）：\n```html\n<script>\n  document.getElementById(\"\
    para1\").innerHTML = \"Hello JavaScript!\";\n</script>\n```\n#### 示例（链接到外部 JS\
    \ 脚本）：\n```html\n<script type=\"text/javascript\" src=\"myscripts.js\"></script>\n\
    ```\n\n### 用于格式化文本的元素\n#### Strong\n`<strong>`...`</strong>`\n\n`<strong> 标签用于定义重要文本。大多数浏览器会将文本加粗。\n\
    \n示例：\n`The examination will be held on <strong>12 Jan at 2pm</strong>. Latecomers\
    \ will not be allowed into the hall.`\n\n输出：\n考试将于 1 月 12 日下午 2 点举行。迟到者将进入考场。\n\
    \n#### Em\n`<em>`...`</em>`\n\n`<em> 标签用于定义强调的文本。大多数浏览器将以斜体形式显示文本。\n\n示例：\n`The\
    \ examination will be held on 12 Jan at 2pm. Latecomers <em>will not be allowed</em>\
    \ into the hall.`\n\n考试将于 1 月 12 日下午 2 点举行。迟到者*将不允许*进入考场。\n\n### 用于定义区域的元素\n####\
    \ Header\n`<header>`...`</header>`\n`header` 元素用于顶部部分。\n\n#### Navigation\n`<nav>`...`</nav>`\n\
    `nav` 代表导航（navigation）。\n\n#### Main\n`<main>`...`</main>`\n`main` 元素用于内容区域。\n\
    \n#### Footer\n`<footer>`...`</footer>`\n`footer` 用于底部部分。\n\n### 注释\n注意在上一个示例中，我们使用了\
    \ `<!--` 和 `-->` 符号吗？它们被称为注释。大多数时候编程时，需要添加注释以便阅读。注释不会在浏览器中显示，它们仅仅是为了解释代码。\n\n\
    要在 HTML 文档中添加注释，我们使用 `<!--...-->` 标签。\n\n示例：\n```html\n<!--This is a comment.\
    \ It will not be displayed in the browser.-->\n```\n\n### 字符实体\n某些字符在 HTML 中有预定义的含义并用于特定用途。例如，小于符号\
    \ `<` 用于启动所有标签。如果我们要在网页上显示文本 5<12 会发生什么？\n\n为了实现这一点，我们需要使用字符实体。字符实体始终以与符号 `&`\
    \ 开始并以分号 `;` 结束。显示小于符号有两种方法。我们可以写 `&lt;` 也可以写 `&#60;`。前者被称为实体名称，后者被称为实体数字。实体名称更容易记忆（`lt`\
    \ 代表 less than），但某些浏览器不支持所有的实体名称。\n\n常用的字符实体包括：\n- 小于符号 (<): `&lt;` 或 `&#60;`\n\
    - 大于符号 (>): `&gt;` 或 `&#62;`\n- 安培符号 (&): `&amp;` 或 `&#38;`\n\n"
- fmt: "\nAnother commonly used character entity is non-breaking space (`&nbsp;`).\
    \ A non breaking space entity is used to display consecutive spaces. By default,\
    \ HTML does not recognise consecutive spaces. If you write 5 spaces in your HTML\
    \ code, the browser will remove 4 of them and display only one space. For instance,\
    \ if you write\n\n`“There are 5 spaces      here”`\n\nthe browser will display\
    \ it as\n\n`“There are 5 spaces here”`.\n\nIf you want to display more than one\
    \ space, you need to write\n\n`“There are 5 spaces &nbsp;&nbsp;&nbsp;&nbsp;here”`.\n\
    \n# Chapter 3: Basics of CSS\n\nNow that we’ve covered quite a bit of HTML, let’s\
    \ move on to CSS. CSS stands for Cascading Stylesheet and as the name suggests,\
    \ CSS is all about styling and making your website look gorgeous.\n\nThe latest\
    \ version of CSS is `CSS3\\`. Unlike previous versions of CSS (namely `CSS1` and\
    \ `CSS2.1`), `CSS3` splits the language into different modules so that each module\
    \ can be developed separately at a different pace. Each module adds new features\
    \ or extends the capabilities of features previously defined in `CSS 2.1\\`. Essentially,\
    \ `CSS3` is simply an extension of `CSS2.1`.\n\nThis book covers the core properties\
    \ of `CSS2.1` as well as a few new properties that are introduced in `CSS3\\`.\
    \ Once you master the core properties, you will have no problems moving on to\
    \ more advanced properties that are newly added in `CSS3`. These advanced properties\
    \ allow for more fanciful styling of your website, such as adding transitions\
    \ and animations.\n\nIn this chapter, we’ll be covering the basics of CSS, including\
    \ its syntax and order of precedence. However, before going into the syntax of\
    \ CSS, let’s first learn how to add CSS rules to our web site.\n\n## Applying\
    \ CSS Code\n\nThere are three ways to apply CSS code to our site.\n\nThe first\
    \ is by linking to an external file. This is the recommended method. To do linking,\
    \ you need to write your CSS rules in a separate text file and save it with a\
    \ `.css` extension. The syntax for adding the rules to your HTML code is\n\n```\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\">\n```\n\nYou add\
    \ the `<link>` tag to the `head` element, between the `<head>...</head>` tags.\
    \ The first two attributes `rel` and `type` tell the browser that this is a CSS\
    \ stylesheet. You do not need to modify them. The last attribute `href` is where\
    \ you specify the path to the CSS file that you want to link to. A CSS file is\
    \ simply a file that contains CSS rules, without any HTML tags. An example is\
    \ shown below. Don’t worry if the code does not make sense to you, we’ll cover\
    \ them very soon.\n\n```\nbody {\n      margin: 0;\n      background-color: green;\n\
    }\n```\n\nSave this code as “style.css” in the same folder as the `.html` file.\
    \ You can then use the `<link>` tag above to link this CSS file to your HTML file.\n\
    \nThe second method to add CSS rules to our site is to embed the code directly\
    \ into our HTML source code, within the `head` element. This is done with the\
    \ `<style>` tag. An example is shown below. The embedded CSS code starts after\
    \ the `<style>` start tag and ends before the `</style>` end tag.\n\n```html\n\
    <head>\n<style>\ndiv {\n           color: blue;\n           width: 100px;\n  \
    \         height: 200px;\n}\n</style>\n</head>\n```\n\nThe last method is to use\
    \ inline CSS. Inline CSS is specified in the start tag of the element you want\
    \ to apply it to, using the `style` attribute. Each rule ends with a semi-colon\
    \ (;). An example is:\n\n```html\n<div style=\"text-decoration:underline; color:blue;\"\
    >Some text</div>\n```\n\nOut of the three methods, linking is the preferred method.\
    \ Linking separates the HTML content from the styling rules and makes it easier\
    \ to maintain our codes. It is also extremely useful when we need to apply the\
    \ same CSS rules to multiple web pages.\n\nEmbedded CSS, on the other hand, is\
    \ commonly used when the rules only apply to one web page.\n\nInline CSS is handy\
    \ when you need to apply a rule to only one element, or when you want to override\
    \ other CSS rules that apply to the same element. This is because inline CSS has\
    \ a higher precedence than CSS code added using the other two methods. We’ll discuss\
    \ order of precedence later in this chapter. However, inline CSS mixes styling\
    \ with content and should be avoided whenever possible.\n\n## Syntax of a CSS\
    \ rule\n\nNow that we know how to apply CSS rules to our HTML files, let’s move\
    \ on to learn some actual CSS code. The first thing to learn about CSS is its\
    \ syntax, which is relatively straightforward. The syntax is:\n\n```\nselector\
    \ { property : value; property : value; property : value; }\n```\n\nFor instance,\
    \ if you want to style the contents inside a `<div>` tag, you write the rule as\n\
    \n```\ndiv {\n  background-color: green;\n  font-size: 12px;  \n}\n```\n\nThe\
    \ `div` is the selector. Inside the curly brackets, you define the property and\
    \ value. Each declaration ends with a semi-colon (;). Indentation and line breaks\
    \ do not matter in CSS.\n\n```css\ndiv {\n  background-color: green;\n  font-size:\
    \ 12px;\n}\n```\n\n## Selecting an Element\n\nSuppose you want to style one `<div>`\
    \ to have a font size of 12px and another to 14px. How would you do it?\n\n##\
    \ Selecting Classes and IDs\n\nThere are basically two ways to do it. The first\
    \ method is to use the `id` attribute. In your HTML document, instead of just\
    \ using the `<div>` tag, you can add `id` to it.\n\n```html\n<div id=\"para1\"\
    >Some text.</div>\n<div id=\"para2\">More text.</div>\n```\n\nIn our CSS code,\
    \ we can then select the respective `id` by adding a `#` sign in front of the\
    \ `id` name. An example is shown below:\n\n```css\ndiv {\n  background-color:\
    \ green;\n}\n#para1 {\n  font-size: 12px;\n}\n#para2 {\n  font-size: 14px;\n}\n\
    ```\n\nThe first rule applies to all elements with the `<div>` tag. The second\
    \ rule only applies to the element with `id=\"para1\"`. The third rule only applies\
    \ to the element with `id=\"para2\"`. In addition to using the selector `#para1`,\
    \ you can also be more specific and write `div#para1`, with no space before and\
    \ after the `#` sign. Both methods will select the same element, but the second\
    \ method has a higher precedence.\n\nNote that an `id` should be unique within\
    \ a page. Two `<div id=\"para1\">` tags is not allowed. One `<div id=\"para1\"\
    >` and one `<p id=\"para1\">` tag is also not allowed as both have the same `id`.\
    \ Although your HTML and CSS code will work even if you have two elements with\
    \ the same `id`, problems will arise when you start using Javascript or other\
    \ scripting languages on your website.\n\nIf you need to apply the same CSS rules\
    \ to two different elements, you can use a `class`. A `class` is similar to an\
    \ `id`, with the exception that a `class` need not be unique. In addition, an\
    \ `id` has a higher precedence than a `class`.\n\nFor now, let’s consider the\
    \ following code:\n\n```html\n<div class=\"myclass1\">Some text.</div>\n<p class=\"\
    myclass1\">More text.</p>\n<div>Yet more text.</div>\n```\n\nIf you want to select\
    \ all `<div>` elements (i.e. the first and third element), you write\n\n```css\n\
    div { }\n```\n\nIf you want to select all elements with `class=\"myclass1\"` (i.e.\
    \ the first and second element), you add a dot `.` in front of the `class` name,\
    \ like this:\n\n```css\n.myclass1 { }\n```\n\nIf you only want to select `<p>`\
    \ tags with `class=\"myclass1\"` (i.e. the second element), you write\n\n```css\n\
    p.myclass1 { }\n```\n\nThere should be no space before and after the dot.\n"
  raw: 'Another commonly used character entity is non-breaking space (`&nbsp;`). A
    non breaking space entity is used to display consecutive spaces. By default, HTML
    does not recognise consecutive spaces. If you write 5 spaces in your HTML code,
    the browser will remove 4 of them and display only one space. For instance, if
    you write


    `“There are 5 spaces      here”`


    the browser will display it as


    `“There are 5 spaces here”`.


    If you want to display more than one space, you need to write


    `“There are 5 spaces &nbsp;&nbsp;&nbsp;&nbsp;here”`.


    Chapter 3: Basics of CSS


    Now that we’ve covered quite a bit of HTML, let’s move on to CSS. CSS stands for
    Cascading Stylesheet and as the name suggests, CSS is all about styling and making
    your website look gorgeous.


    The latest version of CSS is CSS3\. Unlike previous versions of CSS (namely CSS1
    and CSS2.1), CSS3 splits the language into different modules so that each module
    can be developed separately at a different pace. Each module adds new features
    or extends the capabilities of features previously defined in CSS 2.1\. Essentially,
    CSS3 is simply an extension of CSS2.1.


    This book covers the core properties of CSS2.1 as well as a few new properties
    that are introduced in CSS3\. Once you master the core properties, you will have
    no problems moving on to more advanced properties that are newly added in CSS3\.
    These advanced properties allow for more fanciful styling of your website, such
    as adding transitions and animations.


    In this chapter, we’ll be covering the basics of CSS, including its syntax and
    order of precedence. However, before going into the syntax of CSS, let’s first
    learn how to add CSS rules to our web site.


    Applying CSS Code


    There are three ways to apply CSS code to our site.


    The first is by linking to an external file. This is the recommended method. To
    do linking, you need to write your CSS rules in a separate text file and save
    it with a `.css` extension. The syntax for adding the rules to your HTML code
    is


    `<link rel="stylesheet" type="text/css" href="style.css">`


    You add the `<link>` tag to the `head` element, between the `<head>...</head>`
    tags. The first two attributes `rel` and `type` tell the browser that this is
    a CSS stylesheet. You do not need to modify them. The last attribute `href` is
    where you specify the path to the CSS file that you want to link to. A CSS file
    is simply a file that contains CSS rules, without any HTML tags. An example is
    shown below. Don’t worry if the code does not make sense to you, we’ll cover them
    very soon.


    `body {`


    `       margin: 0;`


    `       background-color: green;`


    `}`


    Save this code as “style.css” in the same folder as the .html file. You can then
    use the `<link>` tag above to link this CSS file to your HTML file.


    The second method to add CSS rules to our site is to embed the code directly into
    our HTML source code, within the `head` element. This is done with the `<style>`
    tag. An example is shown below. The embedded CSS code starts after the `<style>`
    start tag and ends before the `</style>` end tag.


    `<head>`


    `<style>`


    `div {`


    `              color: blue;`


    `              width: 100px;`


    `              height: 200px;`


    `}`


    `</style>`


    `</head>`


    The last method is to use inline CSS. Inline CSS is specified in the start tag
    of the element you want to apply it to, using the `style` attribute. Each rule
    ends with a semi-colon (;). An example is:


    `<div style="text-decoration:underline; color:blue;">Some text</div>`


    Out of the three methods, linking is the preferred method. Linking separates the
    HTML content from the styling rules and makes it easier to maintain our codes.
    It is also extremely useful when we need to apply the same CSS rules to multiple
    web pages.


    Embedded CSS, on the other hand,  is commonly used when the rules only apply to
    one web page.


    Inline CSS is handy when you need to apply a rule to only one element, or when
    you want to override other CSS rules that apply to the same element. This is because
    inline CSS has a higher precedence than CSS code added using the other two methods.
    We’ll discuss order of precedence later in this chapter. However, inline CSS mixes
    styling with content and should be avoided whenever possible.


    Syntax of a CSS rule


    Now that we know how to apply CSS rules to our HTML files, let’s move on to learn
    some actual CSS code. The first thing to learn about CSS is its syntax, which
    is relatively straightforward. The syntax is:


    `selector { property : value; property : value; property : value; }`


    For instance, if you want to style the contents inside a `<div>` tag, you write
    the rule as


    `div {`


    `  background-color: green;`


    `  font-size: 12px;  `


    `}`


    The first word `div` is the selector. It tells the browser that the set of rules
    inside the curly brackets { } applies to all elements with the `<div>` tag.


    Inside the curly brackets, you write all your declarations. You start by declaring
    the property that you want to set (`background-color` in the first declaration),
    followed by a colon (:). Next, you give the value that you want (`green` in this
    case). Finally, you end each declaration with a semi-colon (;).


    Indentation and line breaks do not matter in CSS. You can also write your declarations
    like this:


    `div { background-color: green; font-size: 12px; }`


    Pretty straightforward right? Great! Let’s move on...


    Selecting an Element


    In the example above, the rules declared in the curly brackets will apply to ALL
    elements with a `<div>` tag. However, most of the time, we want greater variation.
    Suppose you want one `<div>` element to have a font size of 12px and another to
    have a font size of 14px. How would you do it?


    Selecting Classes and IDs


    There are basically two ways to do it. The first method is to use the `id` attribute.
    In your HTML document, instead of just using the `<div>` tag, you can add an `id`
    attribute to it. For instance, you can write


    `<div id=”para1”>`


    `Some text.`


    `</div>`


    `<div id=”para2”>`


    `More text.`


    `</div>`


    In our CSS code, we can then select the respective `id` by adding a # sign in
    front of the `id` name. An example is shown below:


    `div {`


    `  background-color: green;`


    `}`


    `#para1`


    `{`


    `  font-size: 12px;`


    `}`


    `#para2`


    `{`


    `  font-size: 14px;`


    `}`


    The first rule applies to all elements with the `<div>` tag. The second rule only
    applies to the element with `id=”para1”`. The third rule only applies to the element
    with `id=”para2”`.


    In addition to using the selector `#para1`, you can also be more specific and
    write `div#para1`, with no space before and after the # sign. Both methods will
    select the same element, but the second method has a higher precedence (more on
    this later).


    Note that an `id` should be unique within a page. Two `<div id=”para1”>` tags
    is not allowed. One `<div id=”para1”>` and one `<p id=”para1”>` tag is also not
    allowed as both have the same `id`. Although your HTML and CSS code will work
    even if you have two elements with the same `id`, problems will arise when you
    start using Javascript or other scripting languages on your website.


    If you need to apply the same CSS rules to two different elements, you can use
    a `class`. A `class` is similar to an `id`, with the exception that a `class`
    need not be unique. In addition, an `id` has a higher precedence than a `class`.


    For now, let’s consider the following code:


    `<div class=”myclass1”>`


    `Some text.`


    `</div>`


    `<p class=”myclass1”>`


    `More text.`


    `</p>`


    `<div>`


    `Yet more text.`


    `</div>`


    If you want to select all `<div>` elements (i.e. the first and third element),
    you write


    `div { … }`


    If you want to select all elements with `class=”myclass1”` (i.e. the first and
    second element), you add a dot (.) in front of the `class` name, like this:


    `.myclass1 { … }`


    If you only want to select `<p>` tags with `class=”myclass1”` (i.e. the second
    element), you write


    `p.myclass { … }`


    There should be no space before and after the dot.'
