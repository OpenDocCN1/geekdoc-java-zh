  trans: "\n\n字体类型主要三大类：衬线字体（serif）、无衬线字体（san serif）和等宽字体（monospace）。\n\n衬线字体在某些字符的末端有一个小笔画。示例包括“Times\
    \ New Roman”和 Georgia。\n\n无衬线字体在字符的末端没有笔画。示例包括 Arial 和 Verdana。\n\n等宽字体对所有字符都使用相同的空间。例如，字母‘i’的宽度与字母‘a’相同。等宽宽字体的示例包括“Courier\
    \ New”和“Lucida Console”。\n\n在指定 `font-family` 属性时，你应该始终包含多个字体名称，这样如果浏览器不支持第一个字体，它就会尝试下一个字体，直到找到它支持的字体为止。从更具体的字体（如“Times\
    \ New Roman”）开始，并以一个通用的字体族结束。如果字体名称包含多个单词，应使用引号。\n\n示例：\n\n```\nfont-family: \"\
    Times New Roman\", Times, serif;\n```\n\n## font-size\n\n`font-size` 属性设置文本的大小。字体大小可以使用像素\
    \ (`px`)、em、百分比 (%) 或使用关键字来设置。\n\n### 使用 px\n\n大多数浏览器上使用的默认字体大小是 16 像素。如果你想让网站以不同的字体大小显示，可以这样指定：\n\
    \n```\nfont-size: 20px;\n```\n\n### 使用 em\n\n一个 em 等于当前字体大小。如果该元素是另一个元素的子元素，则当前字体大小是父元素的字体大小。如果该元素不是任何元素的元素，则当前字体大小是浏览器的默认字体大小。如上述，大多数浏览器上使用的默认字体大小是\
    \ 16px。因此，默认情况下 `1em = 16px`。\n\n然而，可以通过更改浏览器设置来更改默认字体大小。例如，要更改 Firefox 默认字体大小，点击菜单按钮（最右侧的三条横线按钮），选择“选项\
    \ (Options)”，最后选择“内容 (Content)”选项卡。然后你可以在“字体与颜色 (Fonts & Colors)”部分更改当前字体大小。\n\
    \n如果用户将默认字体大小设置为 20px，`1em` 变为 20px。如果你想让字体大小变为当前字体大小的 1.5 倍，只需编写 `1.5em`。em 是大多数开发者首选的单位大小，因为默认字体大小可以由用户自定义。\n\
    \n### 使用百分比\n\n百分比与 em 类似。200% 简单意味着当前字体大小的 2 倍。因此，`200% = 2em`。\n\n### 使用关键字\n\
    \n指定字体大小的最后方法是使用关键字。常用的关键字有 `xx-small`、`x-small`、`small`、`medium`（默认值）、`large`、`x-large`\
    \ 和 `xx-large`。\n\n示例：\n\n```\nfont-size: 40px;\nfont-size: 1.5em;\nfont-size:\
    \ 120%;\nfont-size: large;\n```\n\n## font-style\n\n`font-style` 属性用于指定斜体文本。两个常用值为\
    \ `normal` 和 `italic`。normal 以斜体显示文本，而 italic 以斜体显示文本。\n\n示例：\n\n```\nfont-style:\
    \ italic;\n```\n\n## font-weight\n\n`font-weight` 属性是 `font-style` 的对应项。虽然 `font-style`\
    \ 用于指定斜体文本，但 `font-weight` 用于指定粗体文本。常用的值包括 `normal`、`bold`、`bolder` 和 `lighter`。或者，你也可以使用\
    \ 100 的倍数的数字指定字符的粗细，从 100（最细）到 900（最粗）。400 是正常粗，700 与 bold 相同。\n\n然而请注意，大多数网页浏览器只支持\
    \ `normal` 和 `bold` 字体权重。在这种情况下，100-500 对应 `normal`，而 600 及以上对应 `bold`。\n\n示例：\n\
    \n```\nfont-weight: bold;\nfont-weight: 300;\n```\n\n## Text Properties\n\nCSS\
    \ `text` 属性允许你设置与文本字体无关的属性。常用属性包括文本颜色、文本对齐、文本装饰、字间距、词间距和行高。\n\n### color\n\nCSS\
    \ `color` 属性指定文本颜色。与我们在第 4 章中学习的 `border-color` 属性类似，文本颜色可以通过三种方式指定：使用颜色名称、RGB\
    \ 值或十六进制值。\n\n示例：\n\n```\ncolor: blue;\ncolor: #00ff00;\ncolor: rgb(255,0,0);\n\
    ```\n\n### text-alignment\n\n`text-alignment` 属性允许我们指定文本是居中、左对齐、右对齐还是两端对齐。常用的值为\
    \ `left`、`right`、`center` 和 `justify`。\n\n示例：\n\n```\ntext-align: center;\n```\n\
    \n### text-decoration\n\n`text-decoration` 属性主要用于指定文本是否用线条进行装饰。常用的值为 `none`（即：普通文本，无装饰）、`underline`（下划线）、`overline`（文本上方的线）和\
    \ `line-through`（贯穿线）。\n\n此属性通常用于移除链接的下划线。默认情况下，大多数浏览器将以蓝色显示链接并带有下划线。你可以使用代码 `text-decoration:\
    \ none;` 来移除装饰。\n\n示例：\n\n```\ntext-decoration: none;\n```\n\n### letter-spacing\n\
    \n字间距用于增加或减少字符之间的间间距。可以使用像素 (`px`) 或相对单位 `em` 来指定。\n\n示例：\n\n```\nletter-spacing:\
    \ 2px;\n```\n\n### word-spacing\n\n词间距另一方面用于增加或减少单词之间的间距。与 `letter-spacing` 类似，可以使用像素\
    \ (`px`) 或相对单位 `em` 来指定。\n\n示例：\n\n```\nword-spacing: 2px;\n```\n\n### line-height\n\
    \n行高用于设置行之间的间距。可以使用数字、长度或百分比来设置。使用数字时，它是字体大小的倍数。\n\n示例：\n\n```\nline-height: 1.5;\n\
    line-height: 24px;\n```\n\n## Exercise\n\n为了更好地理解每个属性的作用，请尝试下面的练习。\n\n### Exercise\
    \ 8\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css) 下载此练习的源代码。此练习的源代码可以在第\
    \ 8 章中找到。\n\n### Exercise 8.1\n\n1. 同时在浏览器和文本编辑器打开打开 Chapter 8 - Font and Text.html。\n\
    2. 修改 `font-family` 属性并观察文本的变化。当前字体族是无衬线字体。尝试以下各项：\n   - a) `font-family: Verdana,\
    \ Arial, Helvetica, sans-serif;`\n   - b) `font-family: Courier, \"Lucida Console\"\
    , monospace;`\n3. 修改 `font-size` 属性并观察每种情况下示例文本的变化。尝试：\n   - a) `font-size: 40px;`\n\
    \   - b) `font-size: 1.5em;`\n   - c) `font-size: x-small;`\n   - d) `font-size:\
    \ 120%;`\n4. 修改 `font-style` 属性并观察文本的变化。尝试：\n   - a) `font-style: italic;`\n5.\
    \ 修改 `font-weight` 属性并观察文本的变化。尝试：\n   - a) `font-weight: bold;`\n   - b) `font-weight:\
    \ 300;`\n6. 修改 `color` 属性并观察文本的变化。尝试：\n   - a) `color: blue;`\n   - b) `color:\
    \ #00ff00;`\n   - c) `color: rgb(255,0,0);`\n\n"
