    # 第 1 章：引言


    欢迎来到 CSS 的世界。我非常高兴也很荣幸你选择了这本书。在我们共同开启这段学习之旅之前，让我们先定义一下什么是 CSS。


    CSS 代表 Cascading Stylesheet（级联样式表），用于网站的样式和设计。它是网页程序员在创建网站时使用的多种语言之一。其他网页语言还包括
    `HTML`、`Javascript` 和 `PHP` 等（仅列举）。


    `HTML` 关注网站的内容和结构。由于没有内容的网站的存在是毫无意义的，因此对于任何对网页编程感兴趣的人来说，了解 `HTML` 是至关重要的。本书将从介绍
    `HTML` 开始，涵盖你可能需要的一些关于 `HTML` 的基本基础知识。虽然这些内容并非无一完缺，但它应该足够你完成大部分必要的 `HTML` 任务了。如果你已经熟悉
    `HTML`，可以随时跳到第 3 章。


    ## 职业工具


    在我们开始编写 `HTML` 和 `CSS` 页面之前，让我们先看一些推荐用于网页编程的工具。


    在最基础的层，你只需要一个网页浏览器（例如 Internet Explorer、Chrome、Safari、Firefox）和一个文本编辑器（例如记事本）就可以开始编写网站了。然而，除非你属于认为真正的程序员不应该使用任何编程辅助的流派，否则我强烈建议你使用一些在线提供的免费工具来让你的编码生活更轻松。


    最推荐的工具之一是提供语法高亮的高级文本编辑器。语法高亮意味着编辑器会根据文本的用途用不同的颜色显示文本。例如，编辑器可能用红色表示关键字，蓝色表示注释，绿色表示变量。这个简单的功能将使你的代码变得更容易阅读和调试。如果你在
    Windows 电脑上使用，我建议使用 `Notepad++` ([`notepad-plus-plus.org/`](http://notepad-plus-plus.org/))。对于
    Mac，我建议使用 `TextWrangler` ([`www.barebones.com/products/textwrangler/`](http://www.barebones.com/products/textwrangler/))。两者都是免费使用的。


    ### 打开 .HTML 文件


    `.HTML` 文件有两种打开方式。一种方法是通过双击文件在网页浏览器中打开它。这是为了查看页面。另一种方法是在文本编辑器中打开它进行编辑。要这样做，首先启动你的文本编辑器，然后在编辑器内部打开文件。


    在处理 `HTML` 文件时，我建议你同时在浏览器和文本编辑器中打开文件，并将两个窗口并排排列。这样，你可以在编辑器中编辑代码、保存，然后移动到浏览器，刷新页面，并立即检查你对代码所做更改的效果。在完成第
    3 章到第 10 章的练习时请遵循此步骤。


    # 第 2 章：HTML 基础


    现在我们已经涵盖了网页编程的入门介绍，让我们开始学习一些真正的 `HTML` 代码。在本章中，我们将涵盖 HTML 的精要内容。如果你熟悉 `HTML`，可以跳过本章直接进入第
    3 章。


    对于那些 `HTML` 新手朋友来说，让我们开始吧。


    ## 什么是 HTML


    `HTML` 代表 Hypertext Markup Language（超文本标记语言），是网页程序员用于向网页添加内容的语言。标记语言简单来说是对文档进行注释的语言，用于解释文本的不同部分以及它们应该如何呈现。例如，我们可以使用
    `HTML` 来指定内容应该以列表形式还是表格形式呈现。目前的 `HTML` 版本是 `HTML5`。


    `HTML` 最棒的一点是网页的源代码对所有人免费查看。这使得我们很容易通过学习其他网页的源码来学习 `HTML`。要在 Windows 上查看网页的源代码，只需在页面任何地方右键点击，并选择“查看网页源代码”（或类似的选项，如“查看页面源代码”，取决于你使用的浏览器）。如果你在
    Mac 上，点击菜单栏中的“查看”，选择“开发者”，然后选择“查看源代码”。


    你看到的大部分源代码看起来会非常复杂，特别是如果你之前没有 `HTML` 知识的话。不用担心这些。很快，你就能自己写出这类“复杂”的代码了。


    为了更好地理解 `HTML5` 如何工作，让我们从检查 `HTML` 文档的基本结构开始。


    ### HTML 页面的基本结构


    下面是一个基础 `HTML` 文档的示例。我在每行旁边添加了数字供参考。


    ```html

    1 <!doctype html>

    2 <html>

    3 <head>

    4 <title>我的第一个页面</title>

    5 </head>

    6 <body>

    7 <p>这只是文本</p>

    8 <img src="image.jpg" alt="某些图片">

    9 </body>

    10 </html>

    ```


    正如你从上面的代码所示，`HTML` 使用了角括号，如 `<head>` 和 `<body>`。


    #### Doctype（文档类型）


    在第 1 行，`<!doctype html>` 标签告诉浏览器此文档使用 HTML5。如果你检查旧页面的源码，你可能会看到类似 `<!DOCTYPE HTML
    PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd`](http://www.w3.org/TR/html4/strict.dtd)">`
    内容。这意味着他们使用的是其他 HTML 版本，在本例中为 HTML4.01。


    #### 开始和结束标签


    在第 2 行，`<html>` 标签告诉浏览器代码从这里开始。`HTML` 中的大多数标签都有对应的结束标签。`<html>` 的结束标签位于第 10 行。它在
    `html` 单词之前有一个斜杠 `/`。


    注意，并不是所有的 `HTML` 标签都有结束标签。例如，用于网页添加图片的 `<img>` 标签就没有结束标签。通常，当我们需要让浏览器知道标签何结束时，就需要一个结束标签。例如，如果我们想在
    `HTML` 中加粗某些文本，可以写成 `<strong>重要内容</strong>`。


    `<strong>` 标签和 `</strong>` 标签告诉浏览器加粗效果何时开始以及何时结束。相比之下，不需要告诉浏览器插入的图片何时结束。


    #### head 元素（头部）


    在第 3 行，我们有了 `<head>` 元素的开始。从广义上说，一个 `HTML` 文档由两个主要元素组成：`head` 和 `body` 元素。


    `head` 提供了文档的通用信息，包括元数据、标题和附加资源的链接。它从第 3 行的 `<head>` 标签开始，到第 5 行的 `</head>` 标签结束。在
    `<head>...</head>` 标签内部，我们包含了提供了所有这些后台信息的其他标签。


    在我们的示例中，我们只在 `head` 元素中包含了标题信息。`<title>` 元素（第 4 行）显示浏览器应在其标题栏或页面标签上显示的标题。在这种情况下，将显示“我的第一个页面”。我们将在稍后的部分介绍更多在
    `head` 元素内部使用的标签。


    #### body 元素（主体）


