  trans: "\n有四种定位元素的方法。为了理解这四种方法的工作原理，我强烈建议你尝试本章末尾的。如果不通过实践，这个主题很难理解。\n\n### 静态定位\
    \ (Static Positioning)\n\n第一种定位方法是 `static` 定位。静态并没有特殊含义，它意味着元素是根据页面的正常流进行定位。所有的\
    \ HTML 元素默认都使用这种方法定位。如果你想指定使用 `static` 定位（例如覆盖同一元素的其他定位规则），可以写：\n\n```css\nposition:\
    \ static;\n```\n\n### 相对定位 (Relative Positioning)\n\n定位元素的第二种方法是 `relative` 定位。这种方法相对于元素的正常位置进行定位。正常位置是指元素在未指定定位规则或使用\
    \ `static` 定位时的默认位置。\n\n假设我们有两个盒子，`box1` 和 `box2`，且没有指定定位。如果在 HTML 代码中我们在 `box1`\
    \ 之后创建 `box2`，那么 `box2` 默认将定位在 `box1` 下方（参见下面的代码）。\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<style>\n#box1 {\n  /*一些 box1 的样式规则*/\n}\n#box2 {\n  /*一些 box2\
    \ 的样式规则*/\n}\n</style>\n</head>\n<body>\n  <div id=\"box1\">Box 1</div>\n  <div\
    \ id=\"box2\">Box 2</div>\n</body>\n</html>\n```\n\n现在假设我们为 `box2` 的 CSS 声明添加了以下规则：\n\
    \n```css\nposition: relative;\nleft: 150px;\ntop: 50px;\n```\n\n我们所做是将 `box2`\
    \ 的定位更改为 `relative` 定位。\n\n![](img/00002.jpg)\n\n上面的图片显示了使用 `relative` 定位时 `box2`\
    \ 的位置。添加了一个白色虚线框来显示 `box2` 的原始位置。\n\n当应用 `relative` 定位时，`box2` 会相对于其正常位置发生移动。`top:\
    \ 50px;` 行将盒子距离原始位置的顶部移动 50px，而 `left: 150px;` 行则将其向左侧移动 150px。\n\n你也可以使用 `right`\
    \ 和 `bottom` 属性来定位 `box2`。例如，`bottom: 50px;` 将将 `box2` 从原始底部向上移动 50px，而 `right:\
    \ 50px;` 将将其从 `box2` 的原始右边缘向左移动 50px。此外，你还可以使用负像素来定位盒子（例如 `left: -50px`）。\n\n\
    尝试第 5 章的练习，并调整这些值来观察它们是如何工作的。\n\n请注意，当使用 `relative` 定位时，元素可能会与其他元素发生重叠。\n\n如果你想指定哪个元素在前面，就必须使用\
    \ `z-index` 属性。`z-index` 属性适用于任何定位为 `relative`、`fixed` 或 `absolute` 的元素（即不是 `static`）。`z-index`\
    \ 值较大的元素将定位在 `z-index` 值较小的元素前面。\n\n假设你有两个盒子，`greenBox` 和 `redBox`，并且它们相互重叠。如果你将\
    \ `greenBox` 的 `z-index` 为\n\n```css\nz-index: 1;\n```\n\n并将 `redBox` 的 `z-index`\
    \ 为\n\n```css\nz-index: 2;\n```\n\n那么 `redBox` 将位于 `greenBox` 之上，因为它的 `z-index`\
    \ 值更大。\n\n### 固定定位 (Fixed Positioning)\n\n第三种定位方法是 `fixed` 定位。顾其名，使用 `fixed` 方法定位的元素将始终保持在其分配的位置上；即使页面滚动，它也不会移动。固定定位通常用于在网页侧边定位社交分享按钮。要使用\
    \ `fixed` 定位，我们写：\n\n```css\nposition: fixed;\n```\n\n使用 `fixed` 定位时，我们可以使用 `top`\
    \ 属性指定盒子距离页面顶部的像素数，而 `left` 属性指定它距离页面左侧的像素数。\n\n除了 `top` 和 `left`，还有 `right` 和\
    \ `bottom` 属性，它们分别指定了盒子距离页面右侧和底部的像素数。\n\n### 绝对定位 (Absolute Positioning)\n\n最后一种方法是\
    \ `absolute` 定位。\n\n当使用 `absolute` 定位时，元素相对于第一个非 `static` 定位的父元素进行定位。如果没有找到这样的元素，它将相对于页面进行定位。\n\
    \n例如，假设我们有以下 HTML 代码：\n\n```html\n<div id=\"box1\">Content in Box 1</div>\n<div\
    \ id=\"box2\">Content in Box 2</div>\n```\n\n以及以下 CSS 声明：\n\n```css\n#box1 {\n\
    \  position: relative;\n}\n#box2 {\n  position: absolute;\n  top: 50px;\n  left:\
    \ 150px;\n}\n```\n\n假设 `box2` 不是任何具有非静态定位元素的子元素，它将相对于页面进行定位。\n\n### 浮动定位 (Floating\
    \ Positioning)\n\n*注意：提供的文本包含了一个关于浮动的描述，但这里是为了完整性。*\n\n浮动是一种用于在页面上排列元素的技术。为了查看它是如何工作的，假设我们有以下代码：\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n<title>Float</title>\n<style type=\"\
    text/css\">\ndiv {\n  padding: 10px;\n  border: 1px black;\n  margin: 5px;\n \
    \ float: left;\n}\n#box1 {\n  width: 60px;\n  height: 100px;\n}\n#box2 {\n  width:\
    \ 100px;\n  height: 20px;\n}\n#box3 {\n  width: 50px;\n  height: 150px;\n}\n#box4\
    \ {\n  width: 20px;\n  height: 50px;\n}\n#box5 {\n  width: 150px;\n  height: 120px;\n\
    }\n#box6 {\n  width: 120px;\n  height: 70px;\n}\n#box7 {\n  width: 25px;\n  height:\
    \ 80px;\n}\n</style>\n</head>\n<body>\n  <div id=\"box1\">Box 1</div>\n  <div\
    \ id=\"box2\">Box 2</div>\n  <div id=\"box3\">Box 3</div>\n  <div id=\"box4\"\
    >Box 4</div>\n  <div id=\"box5\">Box 5</div>\n  <div id=\"box6\">Box 6</div>\n\
    \  <div id=\"box7\">Box 7</div>\n</body>\n</html>\n```\n\n如果我们运行这段代码，将得到类似下面图片的结果。\n\
    \n![](img/00013.jpg)\n\n注意盒子是如何从上到下从左到右排列的。由于盒子 5 太厚无法放入第一行，CSS 将其放置在上一个盒子的下方。\n\
    \n现在假设在 7 个盒子之外，我们还有以下想要在网站上显示的文本：\n\n```html\n<p>This is some text that is not\
    \ floated.</p>\n<p>This is more text that is not floated.</p>\n<p>This is yet\
    \ more text that is not floated.</p>\n```\n"
- fmt: "\nIf these paragraphs are included in the HTML document after the `div` boxes,\
    \ we’ll get the diagram below. These paragraphs will just ‘squeeze’ into whatever\
    \ space is available.\n\n![](images/00006.jpg)\n\nIf you do not want that to happen,\
    \ you can clear the float by using the `clear: both` property. To do that, make\
    \ the following addition to the CSS declaration:\n\n```css\n.clearFloat { clear:\
    \ both; }\n```\n\nTo use this class, we add it to the first `<p>` tag:\n\n```html\n\
    <p class=\"clearFloat\">This is some text that is not floated.</p>\n```\n\nYou\
    \ only need to add the `clearFloat` class to the first `<p>` tag. Once you clear\
    \ the float, the text will no longer wrap around the boxes.\n\nThat’s the gist\
    \ of how positioning and floating works in CSS. I strongly encourage you to try\
    \ the exercises for this Chapter to get a better understanding of these two concepts.\n\
    \n## Exercise 5\n\nDownload the source code for this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in the Chapter\
    \ 5 - Positioning and Floating folder.\n\n### Exercise 5.1\n\n> 1. Open the file\
    \ `Chapter 5 - Positioning.html` concurrently in your browser and text editor.\n\
    \n> 2. Add the rule `position: static;` to the CSS declaration for `#box1` and\
    \ `#box2` and observe what happens to the positions of the two boxes.\n>\n> Nothing\
    \ changes right? That's because all HTML elements are positioned using `static`\
    \ positioning by default.\n\n> 3. Remove the rule `position: static;` from the\
    \ CSS declaration for `#box1` and `#box2`. Add the following lines to the CSS\
    \ declaration of #`box2`.\n\n```css\nposition: relative;\ntop: 50px;\nleft: 70px;\n\
    ```\n\n> Observe what happens to the position of the second box. 3. It is now\
    \ 50px from the top and 10px from the left of its normal position.\n\n> Play around\
    \ with different values for the `top` and `left` properties and see what happens\
    \ to the position of `box2`. Try negative values as well. You can also try using\
    \ the `right` and `bottom` properties.\n\n> 4. Now change the CSS declaration\
    \ of #`box2` back to\n\n```css\nposition: relative;\ntop: 50px;\nleft: 70px;\n\
    ```\n\n> Notice that the text is partially hidden by the red box?\n\n> If you\
    \ want the text to appear in front of the red box, add the following lines to\
    \ the CSS declaration of `p`.\n\n```css\nposition: relative;\nz-index: 2;\n```\n\
    \n> You can set the position to either `relative`, `absolute` or `fixed`. It does\
    \ not matter as long as it is not `static`.\n\n> Next, add the line `z-index:\
    \ 1;` to the CSS declaration of `#box2`. Refresh the page. The text should now\
    \ be in front of the red box since the `z-index` of the text is greater than the\
    \ `z-index` of the red box.\n\n> If you want the red box to be in front of the\
    \ text instead, just change the `z-index` of `#box2` to a value greater than 2.\n\
    \n> 5. Now, change the height of `#box1` to `5000px` and the positioning of `#box2`\
    \ to `fixed` (`position: fixed;`).\n\n> Scroll the page. 5. The red box does not\
    \ move as it uses fixed positioning now.\n\n> 6. Change the positioning for `#box2`\
    \ back to `relative` and the height of `#box1` back to `100px`. Add the following\
    \ line just before the `<p>` tag in the HTML code at the bottom of the file.\n\
    \n```html\n<div id=\"box3\"></div>\n```\n\n> Now add the following CSS declaration\
    \ to style `box3`.\n\n```css\n#box3 {\n  position: absolute;\n  top: 50px;\n \
    \ left: 150px;\n  background-color: yellow;\n  width: 50px;\n  height: 50px;\n\
    \  padding: 20px;\n  border: 5px dotted black;\n  margin: 10px;\n}\n```\n\n> `box3`\
    \ uses `absolute` positioning and since it is not a child element of any `<div>`\
    \ elements, it is positioned relative to the page. That is, it is positioned 50px\
    \ from the top of the page and 150px from the left.\n\n> 7. Now change the `<div>`\
    \ code for the three boxes to the following:\n\n```html\n<div id=\"box1\"> </div>\n\
    <div id=\"box2\">\n    <div id=\"box3\"></div>\n</div>\n```\n\n> `box3` is now\
    \ a child element of `box2`. Therefore it is positioned 50px down from the top\
    \ and 150px right from the left side of `box2` as it is now positioned relative\
    \ to `box2`.\n\n### Exercise 5.2\n\n> 1. Open the file `Chapter 5 - Floating.html`\
    \ concurrently in your browser and text editor.\n\n> 2. Resize your browser-window\
    \ to see what happens when the `<<div>>` elements do not have enough room.\n\n\
    > 3. Modify the CSS declaration for `div` by changing `float: left;` to `float:\
    \ right;`. Observe what happens to the positions of the boxes.\n\n> 4. Now change\
    \ the rule back to `float: left;` and add the code below to the HTML code, just\
    \ above the `</body>` tag.\n\n```html\n<p>This is some text that is not floated.</p>\n\
    <p>This is more text that is not floated.</p>\n<p>This is yet more text that is\
    \ not floated.</p>\n```\n\n> Refresh the page and observe where the text is. Resize\
    \ the browser window to see what happens when the width of the page is narrow.\n\
    \n> 5. Next, add the code\n\n```css\n.clearFloat { clear: both; }\n```\n\n> to\
    \ the CSS declaration just above the `</style>` tag.\n\n> Change the first `<p>`\
    \ tag to `<p class=\"clearFloat\">` and observe what happens.\n\n## Chapter 6:\
    \ Display and Visibility\n\nCongratulations. You have now learned a fair bit of\
    \ CSS. In fact, we have covered most of the important concepts in CSS, including\
    \ the CSS box model and the idea of floating and positioning. In this chapter,\
    \ we’ll look at how to pull a disappearing act in CSS.\n\nThat’s right. CSS has\
    \ not one, but two, properties that allow us to remove or hide an element. These\
    \ two properties are the `display` and `visibility` properties.\n\n### Display\n\
    \nThe CSS `display` property is used to modify how an element is displayed. There\
    \ are three commonly used values: `none`, `inline` and `block`.\n\nThe first value\
    \ ‘none`’ makes an element disappear. The page will be displayed as if the element\
    \ is not there.\n\nThe second value ‘inline`’ causes an element to be displayed\
    \ as an inline element. We briefly talked about inline elements in Chapter 2 when\
    \ discussing `<div>` and `<span>`. Recall that an inline element does not start\
    \ and end with a new line. Another characteristic of an inline element is that\
    \ it will only take up much height and width as it needs. Hence, there is no point\
    \ specifying the height and width of an inline element.\n\nIn contrast, a block\
    \ element starts and ends with a new line and its height and width can be changed.\
    \ If you want an element to be displayed as a block element, you use the `block`\
    \ value.\n\nExample:\n\n```css\ndisplay: none;\n```\n\n### Visibility\n\nThe CSS\
    \ `visibility` property is used to hide an element. You do that by writing `visibility:\
    \ hidden;`.\n\nThe difference between `visibility: hidden` and `display: none`\
    \ is that for the former, the element is hidden but still takes up space. Using\
    \ the `visibility` property is just like wearing an invisible cloak. The element\
    \ is still there, even though you can’t see it.\n\nIn contrast, when you use `display:\
    \ none`, the element is essentially removed from the page and the page will display\
    \ as if the element does not exist at all.\n\nFor instance, suppose the two properties\
    \ are applied to the word “magic” in the sentence “This is just like magic. You\
    \ can make words disappear.” below:\n\nFor `visibility: hidden;` you’ll get\n\n\
    “This is just like        . You can make words disappear.”\n\nFor `display: none;`\
    \ you’ll get\n\n“This is just like . You can make words disappear.”\n\n## Exercise\
    \ 6\n\nDownload the source code for this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in the Chapter\
