  trans: "\n除了使用 RGB 表示法，你还可以使用十六进制法，它使用 6 位数字来表示颜色。前两个数字代表“红色”强度的十六进制值，接下来两个代表“绿色”，最后两个代表“蓝色”。通常会使用颜色工具来生成这些十六进制值。访问\
    \ [`instant-eyedropper.com/`](http://instant-eyedropper.com/) 网站获取这样一个免费工具。\n\n\
    或者，你可以访问 [`html-color-codes.info/`](http://html-color-codes.info/)，那里有一张颜色表供你选择选择的颜色。点击它，你就会得到相应的十六进制值。\n\
    \n### 示例：\n\n```\nborder-color: rgb(255, 0, 0);\n```\n将设置所有边框为红色。\n\n```\nborder-color:\
    \ red green;\n```\n将顶部和底部的边框设置为红色，左侧和右侧的边框设置为绿色。\n\n```\nborder-top-color: #12005F;\n\
    ```\n将设置顶部边框设置为 #12005F。\n\n### border-style（边框样式）\n\n要设置边框样式，你使用 `border-style`\
    \ 属性。接受的值有：`none`、`dotted`、`dashed`、`solid`、`double`、`groove`、`ridge`、`inset`\
    \ 和 `outset`。例如，如果你写：\n\n```\nborder-style: solid dotted;\n```\n顶部和底部边框将为实线，而左右为虚线。如果你想单独设置样式，可以写：\n\
    \n```\nborder-top-style: solid;\n```\n\n```\nborder-left-style: dotted;\n```\n\
    \n### border-radius（圆角）\n\n`border-radius` 属性用于创建圆角边框。该值通常以像素或百分比给出。\n\n可以为四个角单独设置圆角。这四个角分别是\
    \ `top-left`、`top-right`、`bottom-right` 和 `bottom-left`。\n\n### 示例：\n\n```\nborder-radius:\
    \ 5px;\n```\n将所有角的圆角半径设置为 5px。\n\n```\nborder-radius: 10px 20px;\n```\n将左上角和右下角（即对角线的两个角）的半径设置为\
    \ 10px，右上角和左下角的半径设置为 20px。\n\n```\nborder-radius: 25px 5px 0 50px;\n```\n从左上角开始按顺时针方向继续设置各个角的值。\n\
    \n```\nborder-top-left-radius: 10px;\n```\n将左上角的边框半径设置为 10px。\n\n如果该元素的宽度和高度为\
    \ 100px，内边距为 20px，边框宽度为 50px（总宽度和总高度 = 100 + 20*2 + 50*2 = 240px），将圆角设置为 120px（240\
    \ 除以 2）将得到一个圆而不是正方形。\n\n### Border Shorthand（边框简写）\n\n`border` 属性是在单行内指定边框宽度、样式和颜色的简写，而不是分开进行。只需写道：\n\
    \n```\nborder: 5px solid green;\n```\n这些值分别代表宽度 (5px)、样式 (solid) 和颜色 (green)。此简写中不包含圆角。\n\
    \n### 练习 4\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css) 下载此练习的源代码并解压文件。此练习的源代码可以在\
    \ \"Chapter 4 - CSS Box Model\" 文件夹中找到。\n\n### 练习 4.1\n\n1. 在你的浏览器和文本编辑器中同时打开\
    \ `Chapter 4 - CSS Box Model.html`。\n2. 调整浏览器窗口大小，观察乱码文本是如何绕过更大的框流动的。\n3. 通过修改\
    \ `box1` 的 CSS 声明，将 `width: 100px;` 和 `height: 100px;` 分为以下每一项：\n   (a) `width:\
    \ 200px; height: 200px;`\n   (b) `width: 60%;`\n   (c) `height: auto; width: auto;`\n\
    \   在编辑器中保存文件并在浏览器中刷新页面。注意每种情况下 `box1` 发生了什么。\n4. 现在将 `box1` 的宽度和高度改回 100px，并将标签\
    \ `<div id=\"box1\">...</div>` 之间的文本更改为：\n   “一天内学会 CSS 并学好它。此示例展示了当文本溢出框尺寸时会发生什么。”\n\
    \   接下来，在 `box1` 的 CSS 声明中添加以下每一项，并注意每种情况下发生了什么：\n   (a) `overflow: visible;`\n\
    \   (b) `overflow: hidden;`\n   (c) `overflow: scroll;`\n   (d) `overflow: auto;`\n\
    5. 修改 `box1` 的 CSS 声明，将 `margin: 20px;` 改为以下每一项，并注意每种情况下 `box1` 周围空间发生了什么：\n \
    \  (a) `margin: 50px;`\n   (b) `margin: -50px;`\n   (c) `margin: 25px 200px;`\n\
    \   (d) `margin: 25px;`\n6. 在 `box1` 的 CSS 声明中添加以下每一项，并注意每种情况下发生了什么：\n   (a) `border:\
    \ 5px solid red;`\n   (b) `border: 5px dashed blue;`\n   (c) `border: 5px dotted\
    \ green;`\n   (d) `border: 5px double yellow;`\n7. 修改 `box1` 的 CSS 声明，将 `margin:\
    \ 20px;` 改为以下每一项，并注意 `box1` 周围空间发生了什么：\n   (a) `margin: 50px;`\n   (b) `margin:\
    \ -50px;`\n   (c) `margin: 25px 200px;`\n   (d) `margin: 25px;`\n8. 在 `box1` 的\
    \ CSS 声明中添加以下每一项，并注意每种情况下发生了什么：\n   (a) `border: 5px solid red;`\n   (b) `border:\
    \ 5px dashed blue;`\n   (c) `border: 5px dotted green;`\n   (d) `border: 5px double\
    \ yellow;`\n9. 修改 `box1` 的 CSS 声明，将 `margin: 20px;` 改为以下每一项，并注意 `box1` 周围空间发生了什么：\n\
    \   (a) `margin: 50px;`\n   (b) `margin: -50px;`\n   (c) `margin: 25px 200px;`\n\
    \   (d) `margin: 25px;`\n"
- fmt: "\nThere are four methods to position an element. To understand how the four\
    \ methods work, I strongly encourage you to try out the exercise at the end of\
    \ this chapter. This is a topic that is difficult to understand without a hands-on\
    \ approach.\n\n### Static Positioning\n\nThe first positioning method is `static`\
    \ positioning. Static doesn't mean much, it just means that the elements are positioned\
    \ according to the normal flow of the page. All HTML elements are positioned using\
    \ this method by default. If you want to specify that `static` positioning be\
    \ used (for instance to override another positioning rule for the same element),\
    \ you write:\n\n```css\nposition: static;\n```\n\n### Relative Positioning\n\n\
    The second method to position an element is the `relative` positioning method.\
    \ This method positions an element relative to its normal position. Normal position\
    \ refers to the default position of the element when no positioning rule is specified\
    \ or when `static` positioning is used.\n\nSuppose we have two boxes, `box1` and\
    \ `box2` with no positioning specified. If we create `box2` after `box1` in our\
    \ HTML code, `box2` will be positioned below `box1` by default (refer to code\
    \ below).\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n#box1 {\n  /*Some\
    \ rules for styling box1*/\n}\n#box2 {\n  /*Some rules for styling box2*/\n}\n\
    </style>\n</head>\n<body>\n  <div id=\"box1\">Box 1</div>\n  <div id=\"box2\"\
    >Box 2</div>\n</body>\n</html>\n```\n\nNow suppose we add the following rules\
    \ to the CSS declaration of `box2`:\n\n```css\nposition: relative;\nleft: 150px;\n\
    top: 50px;\n```\n\nWhat we’ve done is change the positioning of `box2` to `relative`\
    \ positioning.\n\n![](images/00002.jpg)\n\nThe image above shows the position\
    \ of `box2` when `relative` positioning is used. A white dotted box is added to\
    \ show the original position of `box2`.\n\nWhen `relative` positioning is applied,\
    \ `box2` is moved relative to its normal position. The line `top: 50px;` moves\
    \ the box 50px away from the top of the original position and the line `left:\
    \ 150px;` moves it 150px away from the left.\n\nYou can also use the `right` and\
    \ `bottom` properties to position `box2`. For instance, `bottom: 50px;` will move\
    \ `box2` 50px up from the original bottom of `box2` while `right: 50px;` will\
    \ move it 50px left from the original right edge of `box2`. In addition, you can\
    \ use negative pixels to position the boxes (e.g. `left: -50px`).\n\nTry the exercise\
    \ for Chapter 5 and play around with the values to see how all these work.\n\n\
    Note that when `relative` positioning is used, the element can end up overlapping\
    \ other elements.\n\nIf you want to specify which element should be in front,\
    \ you have to use the `z-index` property. The `z-index` property works on any\
    \ element that has a position of either `relative`, `fixed` or `absolute` (i.e.\
    \ not `static`). An element with greater `z-index` value will be positioned in\
    \ front of an element with a lower `z-index` value.\n\nSuppose you have two boxes,\
    \ `greenBox` and `redBox`, and they overlap each other. If you declare the `z-index`\
    \ of `greenBox` as\n\n```css\nz-index: 1;\n```\n\nand the `z-index` of `redBox`\
    \ as\n\n```css\nz-index: 2;\n```\n\n`redBox` will be on top of `greenBox` as it\
    \ has a greater `z-index` value.\n\n### Fixed Positioning\n\nThe third positioning\
    \ method is `fixed` positioning. As the name suggests, an element that is positioned\
    \ using the `fixed` method will always stay at its assigned location; it will\
    \ not move even when the page is scrolled. Fixed positioning is commonly used\
    \ to position social sharing buttons at the side of a web page. To use `fixed`\
    \ positioning, we write:\n\n```css\nposition: fixed;\n```\n\nWhen using `fixed`\
    \ positioning, we can use the `top` property to specify the number of pixels the\
    \ box should be from the top of the page while the `left` property specifies the\
    \ number of pixels it should be from the left of the page.\n\nIn addition to `top`\
    \ and `left`, there are also the `right` and `bottom` properties, which specify\
    \ the number of pixels the box should be from the right side and bottom of the\
    \ page respectively.\n\n### Absolute Positioning\n\nThe final method is `absolute`\
    \ positioning.\n\nWhen `absolute` positioning is used, an element is positioned\
    \ relative to the first parent element that has a position other than static.\
    \ If no such element is found, it is positioned relative to the page.\n\nFor instance,\
    \ suppose we have the following HTML code:\n\n```html\n<div id=\"box1\">Content\
    \ in Box 1</div>\n<div id=\"box2\">Content in Box 2</div>\n```\n\nand the following\
    \ CSS declaration:\n\n```css\n#box1 {\n  position: relative;\n}\n#box2 {\n  position:\
    \ absolute;\n  top: 50px;\n  left: 150px;\n}\n```\n\nAssuming that `box2` is not\
    \ a child element of any element that has a non static positioning, it’ll be positioned\
    \ relative to the page.\n\n### Floating Positioning (New Section based on content)\n\
    \n*Note: The provided text contains a description of floating which lacked a clear\
    \ header in the source, but it is included here for completeness.*\n\nFloating\
    \ is a technique used to arrange elements on a page. To see how this works, suppose\
    \ we have the following code:\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>Float</title>\n\
    <style type=\"text/css\">\ndiv {\n  padding: 10px;\n  border: 1px black;\n  margin:\
    \ 5px;\n  float: left;\n}\n#box1 {\n  width: 60px;\n  height: 100px;\n}\n#box2\
    \ {\n  width: 100px;\n  height: 20px;\n}\n#box3 {\n  width: 50px;\n  height: 150px;\n\
    }\n#box4 {\n  width: 20px;\n  height: 50px;\n}\n#box5 {\n  width: 150px;\n  height:\
    \ 120px;\n}\n#box6 {\n  width: 120px;\n  height: 70px;\n}\n#box7 {\n  width: 25px;\n\
    \  height: 80px;\n}\n</style>\n</head>\n<body>\n  <div id=\"box1\">Box 1</div>\n\
    \  <div id=\"box2\">Box 2</div>\n  <div id=\"box3\">Box 3</div>\n  <div id=\"\
    box4\">Box 4</div>\n  <div id=\"box5\">Box 5</div>\n  <div id=\"box6\">Box 6</div>\n\
    \  <div id=\"box7\">Box 7</div>\n</body>\n</html>\n```\n\nIf we run this code,\
    \ we’ll get something like the next image.\n\n![](images/00013.jpg)\n\nNotice\
    \ how the boxes are arranged from left to right, starting from the top. As box\
    \ 5 is too thick to fit into the top row, CSS places it below the previous box.\n\
    \nNow suppose in addition to these 7 boxes, we also have the following text that\
    \ we want to display on the site.\n\n```html\n<p>This is some text that is not\
    \ floated.</p>\n<p>This is more text that is not floated.</p>\n<p>This is yet\
    \ more text that is not floated.</p>\n```\n"
  raw: 'There are four methods to position an element. To understand how the four
    methods work, I strongly encourage you to try out the exercise at the end of this
    chapter. This is a topic that is difficult to understand without a hands-on approach.


    Static Positioning


    The first positioning method is `static` positioning. Static doesn''t mean much,
    it just means that the elements are positioned according to the normal flow of
    the page. All HTML elements are positioned using this method by default. If you
    want to specify that `static` positioning be used (for instance to override another
    positioning rule for the same element), you write


    `position: static;`


    Relative Positioning


    The second method to position an element is the `relative` positioning method.
    This method positions an element relative to its normal position. Normal position
    refers to the default position of the element when no positioning rule is specified
    or when `static` positioning is used.


    Suppose we have two boxes, `box1` and `box2` with no positioning specified. If
    we create `box2` after `box1` in our HTML code, `box2` will be positioned below
    `box1` by default (refer to code below).


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<style>`


    `#box1 {`


    `/*Some rules for styling box1*/`


    `}`


    `#box2 {`


    `/*Some rules for styling box2*/`


    `}`


    `</style>`


    `</head>`


    `<body>`


    `<div id="box1">Box 1</div>`


    `<div id="box2">Box 2</div>`


    `</body>`


    `</html>`


    Now suppose we add the following rules to the CSS declaration of `box2`.


    `position: relative;`


    `left: 150px;`


    `top: 50px;`


    What we’ve done is change the positioning of `box2` to `relative` positioning.


    ![](images/00002.jpg)


    The image above shows the position of `box2` when `relative` positioning is used.
    A white dotted box is added to show the original position of `box2`.


    When `relative` positioning is applied, `box2` is moved relative to its normal
    position. The line `top: 50px;` moves the box 50px away from the top of the original
    position and the line `left: 150px;` moves it 150px away from the left.


    You can also use the `right` and `bottom` properties to position `box2`. For instance,
    `bottom: 50px;` will move `box2` 50px up from the original bottom of `box2` while
    `right: 50px;` will move it 50px left from the original right edge of `box2`.
    In addition, you can use negative pixels to position the boxes (e.g. `left: -50px`)


    Try the exercise for Chapter 5 and play around with the values to see how all
    these work.


    Note that when `relative` positioning is used, the  element can end up overlapping
    other elements.


    If you want to specify which element should be in front, you have to use the `z-index`
    property. The `z-index` property works on any element that has a position of either
    `relative`, `fixed` or `absolute` (i.e. not `static`). An element with greater
    `z-index` value will be positioned in front of an element with a lower `z-index`
    value.


    Suppose you have two boxes, `greenBox` and `redBox`, and they overlap each other.
    If you declare the `z-index` of `greenBox` as


    `z-index: 1;`


    and the `z-index` of `redBox` as


    `z-index: 2;`


    `redBox` will be on top of `greenBox` as it has a greater `z-index` value.


    Fixed Positioning


    The third positioning method is `fixed` positioning. As the name suggests, an
    element that is positioned using the `fixed` method will always stay at its assigned
    location; it will not move even when the page is scrolled. Fixed positioning is
    commonly used to position social sharing buttons at the side of a web page. To
    use `fixed` positioning, we write


    `position: fixed;`


    When using `fixed` positioning, we can use the `top` property to specify the number
    of pixels the box should be from the top of the page while the `left` property
    specifies the number of pixels it should be from the left of the page.


    In addition to `top` and `left`, there are also the `right` and `bottom` properties,
    which specify the number of pixels the box should be from the right side and bottom
    of the page respectively.


    Absolute Positioning


    The final method is `absolute` positioning.


    When `absolute` positioning is used, an element is positioned relative to the
    first parent element that has a position other than static. If no such element
    is found, it is positioned relative to the page.


    For instance, suppose we have the following HTML code:


    `<div id="box1">Content in Box 1</div>`


    `<div id="box2">Content in Box 2</div>`


    and the following CSS declaration:


    `#box1 {`


    `position: relative;`


    `}`


    `#box2 {`


    `position: absolute;`


    `top: 50px;`


    `left: 150px;`


    `}`


    Assuming that `box2` is not a child element of any element that has a non static
    positioning, it’ll be positioned relative to the page. That is, it is positioned
    50px from the top of the page and 150px from the left.


    However, if we change the HTML structure to


    `<div id="box1">Content in Box 1`


    `<div id="box2">Content in Box 2</div>`


    `</div>`


    `box2` is now a child element of `box1`. Hence `box2` will be positioned relative
    to `box1`. It is now 50px down from the top and 150px right from the left side
    of `box1`.


    In a way, `absolute` positioning is similar to `relative` positioning, except
    that the element is positioned relative to its parent element instead of its normal
    position.


    Floating


    The next CSS property we are going to discuss is floating.


    Floating is a technique used to arrange elements on a page. The idea is similar
    to putting books onto a bookshelf. Imagine you have a stack of books of varying
    thickness and height and you need to put all the books onto a bookshelf. In addition,
    you are not allowed to rearrange the books. That is, the books must be placed
    onto the bookshelf in the same order as they were in the original stack.


    To perform this task CSS-style, we’ll start with the top row. We’ll put the books
    one by one onto the top row, starting from left to right. Suppose the top row
    is almost full and you have a book that is too thick to fit onto the top row.
    What do you do? You’ll move to the next row below it, right? Well, CSS does it
    a little differently. CSS will try to fit this ‘book’ onto the same row, below
    the previous ‘book’, as long as there is some space below it (refer to Box 5 in
    the next diagram). This method of stacking the books is similar to doing a `float:
    left` in CSS.


    Alternatively, you can do a `float: right` in CSS. This is equivalent to starting
    from the top row but stacking the books from right to left.


    To see how this works in CSS, suppose we have 7 `div` boxes of varying heights
    and widths that are floated left (refer to code below):


    `<!doctype html>`


    `<html>`


    `<head><title>CSS Float</title>`


    `<style type="text/css">`


    `div {`


    `padding: 10px;`


    `border: 1px dashed black;`


    `margin: 5px;`


    `float: left;`


    `}`


    `#box1 {`


    `width: 60px;`


    `       height: 100px;`


    `}`


    `#box2 {`


    `width: 100px;`


    `       height: 20px;`


    `}`


    `#box3 {`


    `width: 50px;`


    `       height: 150px;`


    `}`


    `#box4 {`


    `width: 20px;`


    `       height: 50px;`


    `}`


    `#box5 {`


    `width: 150px;`


    `       height: 120px;`


    `}`


    `#box6 {`


    `width: 120px;`


    `       height: 70px;`


    `}`


    `#box7 {`


    `width: 25px;`


    `       height: 80px;`


    `}`


    `</style></head>`


    `<body>`


    `       <div id="box1">Box 1</div>`


    `       <div id="box2">Box 2</div>`


    `       <div id="box3">Box 3</div>`


    `       <div id="box4">Box 4</div>`


    `       <div id="box5">Box 5</div>`


    `       <div id="box6">Box 6</div>`


    `       <div id="box7">Box 7</div>`


    `</body>`


    `</html>`


    If we run this code, we’ll get something like the next image.


    ![](images/00013.jpg)


    Notice how the boxes are arranged from left to right, starting from the top. As
    box 5 is too thick to fit into the top row, CSS places it below the previous box.


    Now suppose in addition to these 7 boxes, we also have the following text that
    we want to display on the site.


    `<p>This is some text that is not floated.</p>`


    `<p>This is more text that is not floated.</p>`


    `<p>This is yet more text that is not floated.</p>`'
