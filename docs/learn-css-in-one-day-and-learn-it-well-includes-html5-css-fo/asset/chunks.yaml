    \ for Exercises](#index_split_014.html_filepos220226)\n\n# Chapter 1: Introduction\n\
    \nWelcome to the world of CSS. I am so glad and honoured that you picked up this\
    \ book. Before we embark on this learning journey together, let us first define\
    \ what is CSS.\n\nCSS stands for Cascading Stylesheet and is used for the styling\
    \ and design of a website. It is one of the many languages a web programmer uses\
    \ to create a website. Other web languages include `HTML`, `Javascript` and `PHP`,\
    \ just to name a few.\n\n`HTML` is concerned with the content and structure of\
    \ a website. As a website’s existence is meaningless without content, knowing\
    \ `HTML` is essential for anyone interested in web programming. This book will\
    \ first start with an introduction to `HTML`, covering some of the essential basics\
    \ you need to know about `HTML`. While this coverage is by no means comprehensive,\
    \ it should be enough for you to perform most of the `HTML` tasks necessary. If\
    \ you are familiar with `HTML`, feel free to skip to Chapter 3.\n\n## Tools of\
    \ the Trade\n\nBefore we start coding our `HTML` and `CSS` pages, let us first\
    \ look at some of the recommended tools for doing web programming.\n\nAt the most\
    \ basic level, you only need a web browser (e.g. Internet Explorer, Chrome, Safari,\
    \ Firefox) and a text editor (e.g. Notepad) to start coding websites. However,\
    \ unless you belong to the school of thought that real programmers shouldn’t use\
