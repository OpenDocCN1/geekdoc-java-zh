    \ with a more specific font (such as “Times New Roman”) and end with a generic\
    \ font family. If the font name is more than one word, quotation marks should\
    \ be used.\n\nExample:\n\n`font-family: \"Times New Roman\", Times, serif;`\n\n\
    font-size\n\nThe `font-size` property sets the size of the text. Font size can\
    \ be set with pixels (px), em, percentage (%) or by using keywords.\n\nUsing px\n\
    \nThe default font size used on most browsers is 16 pixels. If you want your site\
    \ to display with a different font size, you can specify it like this: `font-size:\
    \ 20px;`.\n\nUsing em\n\nAn em is is equal to the current font size. If the element\
    \ is the child of another element, the current font size is the font size of the\
    \ parent element. If the element is not a child of any element, the current font\
    \ size is the browser’s default font size. As mentioned above, the default font\
    \ size used on most browsers is 16px. Hence by default 1em = 16px.\n\nHowever,\
    \ this default font size can be changed by changing the browser’s setting. For\
    \ instance, to change the default font size on Firefox, click on the menu button\
    \ (the right most button with three horizontal lines), select “Options’ and finally\
    \ select the “Content’ tab. You can then change the current font size under the\
    \ ‘Fonts & Colors’ section.\n\nIf the user sets the default font size to 20px,\
    \ 1em becomes 20px. If you want the font size to be 1.5 times the current font\
    \ size, you simply write 1.5em. The em is the prefered unit size used by most\
    \ developers as the default font size can be customised by the user.\n\nUsing\
    \ Percentage\n\nPercentage is similar to em. 200% simply means 2 times the current\
    \ font size. Hence, 200% = 2em.\n\nUsing Keywords\n\nThe final way to specify\
    \ font size is to use keywords. Commonly used keywords are `xx-small`, `x-small`,\
    \ `small`, `medium` (this is the default), `large`, `x-large` and `xx-large`.\n\
    \nExamples:\n\n`font-size: 40px;`\n\n`font-size: 1.5em;`\n\n`font-size: 120%;`\n\
    \n`font-size: large;`\n\nfont-style\n\nThe `font-style` property is used to specify\
    \ italic text. The two common values are `normal` and `italic`. Normal will display\
    \ text with no italic while italic displays text in italic.\n\nExample:\n\n`font-style:\
    \ italic;`\n\nfont-weight\n\nThe `font-weight` property is the counterpart of\
    \ `font-style`. While `font-style` is used to specify italic text, `font-weight`\
    \ is used to specify bold text. Commonly used values include `normal`, `bold`,\
    \ `bolder` and `lighter`. Alternatively, you can also specify the thickness of\
    \ the characters using numbers in multiples of 100, from 100 (thinnest) to 900\
    \ (thickest). 400 is the normal thickness, and 700 is the same as bold.\n\nHowever,\
    \ note that most web browsers only support `normal` and `bold` font weights. In\
    \ that case, 100-500 correspond to `normal` while 600 and above correspond to\
    \ `bold`.\n\nExamples:\n\n`font-weight: bold;`\n\n`font-weight: 300;`\n\nText\
    \ Properties\n\nCSS `text` properties allow you to set properties that are not\
    \ related to the font of the text. Common properties include text color, text\
    \ alignment, text decoration, letter spacing, word spacing and line height.\n\n\
    color\n\nThe CSS `color` property specifies the color of the text. Similar to\
    \ what we learned in Chapter 4 regarding the `border-color` property, text color\
    \ can be specified in one of three ways: using a color name, a RGB value or a\
    \ hex value.\n\nExamples:\n\n`color: blue;`\n\n`color: #00ff00;`\n\n`color: rgb(255,0,0);`\n\
    \ntext-alignment\n\nThe `text-alignment` property allows us to specify whether\
    \ we want text to be centered, or aligned to the left or right, or justified.\
    \ The commonly used values are `left`, `right`, `center` and `justify`.\n\nExample:\n\
    \n`text-align: center;`\n\ntext-decoration\n\nThe `text-decoration` property is\
    \ mainly used to specify whether the text should be decorated with a line. The\
    \ commonly used values are `none` (i.e. just normal text, no decoration), `underline`,\
    \ `overline` (a line above the text) and `line-through` (a line through the text).\n\
    \nThis property is commonly used to remove underlines from hyperlinks. By default,\
    \ most browsers will display hyperlinks in blue, with an underline. You can use\
    \ the code `text-decoration: none;` to remove the underline.\n\nExample:\n\n`text-decoration:\
    \ none;`\n\nletter-spacing\n\nLetter spacing is used to increase or decrease the\
    \ spacing between letters in a word. You specify the amount of spacing in pixels.\
    \ To increase the spacing, use a positive value. To decrease it, use a negative\
    \ value.\n\nFor instance, `letter-spacing: 2px;` will cause the letters to be\
    \ spaced 2 pixels apart. `letter-spacing: -1px;` will cause the letters to be\
    \ cramped together, overlapping each other by 1 pixel.\n\nExample:\n\n`letter-spacing:\
    \ 2px;`\n\nword-spacing\n\nWord spacing, on the other hand, is used to increase\
    \ or decrease the spacing between words in text. Similar to `letter-spacing`,\
    \ you specify the amount of spacing in pixels, using positive to increase the\
    \ spacing and negative to decrease it.\n\nExample:\n\n`word-spacing: 2px;`\n\n\
    line-height\n\nLine height is used to set the spacing between each line of text.\
    \ This property can be set using a number, a specific length, or a percentage.\n\
    \nWhen using a number to specify `line-height`, the given number will be multiplied\
    \ with the current font size to give the line height. For instance, `line-height:\
    \ 2` will result in a line height of 32px if the current font size is 16px.\n\n\
    When using length to specify `line-height`, units such as px (pixel), em, cm,\
    \ pt (point, where 1 point = 1/72 of 1in) etc can be used.\n\nWhen using percentage,\
    \ the given percentage will be multiplied with the current font size to give the\
    \ line height. For instance, `line-height: 50%` will result in a line-height of\
    \ 8px if the current font size is 16px. Note that `line-height` does not alter\
    \ the font size. A line height of 8px will result in the lines overlapping each\
    \ other.\n\nExamples:\n\n`line-height: 20px;`\n\n`line-height: 120%;`\n\nTo have\
    \ a better understanding of how each of these properties work, try the exercise\
    \ below.\n\nExercise 8\n\nDownload the source code for this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in the Chapter\
    \ 8 - Font and Text folder.\n\nExercise 8.1\n\n> 1. Open the file Chapter 8 -\
    \ Font and Text.html concurrently in your browser and text editor.\n\n> 2. Modify\
    \ the CSS property `font-family` and observe what happens to the sample text.\
    \ The current font family is Sans Serif. Try each of the following:\n\n> \n\n\
    > (a) `font-family: Verdana, Arial, Helvetica, sans-serif;`\n\n> (b) `font-family:\
    \ Courier, \"Lucida Console\", monospace;`\n\n> 3. Modify the CSS property `font-size`\
    \ and observe what happens to the sample text in each of the following cases.\
    \ Try\n\n> \n\n> (a) `font-size: 40px;`\n\n> (b) `font-size: 1.5em;`\n\n> (c)\
    \ `font-size: x-small;`\n\n> (d) `font-size: 120%;`\n\n> 4. Modify the CSS property\
    \ `font-style` and observe what happens to the sample text. Try\n\n> \n\n> (a)\
    \ `font-style: italic;`\n\n> 5. Modify the CSS property `font-weight` and observe\
    \ what happens to the sample text. Try\n\n> \n\n> (a) `font-weight: bold;`\n\n\
    > (b) `font-weight: 300;`\n\n> 6. Modify the CSS property `color` and observe\
    \ what happens to the sample text. Try\n\n> \n\n> (a) `color: blue;`\n\n> (b)\
    \ `color: #00ff00;`\n\n> (c) `color: rgb(255,0,0);`"
