  trans: "\n第 6 行是 `body` 元素的开始处。`<body>...</body>` 标签内的内容将显示在网页上。在我们的示例中，文本“This\
    \ is just text”和图像“someimage.jpg”将被显示。\n\n在`<body>...</body>` 标签内部，我们还可以使用许多其他标签，例如添加图像的\
    \ `<img>` 标签、用于显示表格的 `<table>` 标签以及添加列表的 `<ul>` 标签。我们稍后会详细介绍这些标签。\n\n为了感受一下它的工作原理，你可以从配套网站下载本章节的代码（[`http://learncodingfast.com/css`](http://learncodingfast.com/css`)`）。源代码可以在\
    \ `Chapter 2 - Basics of HTML` 文件夹中找到。双击 HTML 文件即可启动它。\n\n在完成本书附带的额外奖励项目时，你将在导师的指导下编写一个真实的\
    \ HTML 文档。该项目的源代码可以在 `Bonus Project\\Answers` 文件夹中找到。\n\n## Head 元素中的元素\n\n现在我们已经了\
    \ HTML 是如何工作的，让我们详细查看 `head` 元素。\n\n如上所述，`head` 元素提供了关于文档的通用信息，例如它的元数据、标题以及指向外部资源的链接。让我们来看\
    \ `head` 元素内部的一些标签。\n\n### <meta>\n\n`<meta>` 标签包含在 `<head>...</head>` 标签内，用于向浏览器、搜索引擎或其他网络服务提供有关网站的额外信息。这些信息将不会显示在页面本身。`<meta>`\
    \ 标签没有结束标签。\n\n`<meta>` 标签的一个常见用途是为搜索引擎提供关键词。例如：\n\n```html\n<meta name=\"keywords\"\
    \ content=\"HTML, CSS, Learn in One Day\">\n```\n\n你可能会注意到这个标签比我们之前讨论的标签要长得多。这是因为\
    \ `<meta>` 标签有两个属性：`name` 和 `content`。\n\n`name` 用于指定标签包含的信息的类型（在本例中为关键词），而 `content`\
    \ 用于指定信息的内容。\n\n你还可以使用 `name=description` 属性为你的网站提供描述。例如：\n\n```html\n<meta name=\"\
    description\" content=\"This is my first Website. It teaches you how to use HTML\
    \ and CSS\">\n```\n\n`<meta>` 标签的另一个常见用途是使用它来指定浏览器如何控制页面的缩放级别和尺寸。这是通过 `name=viewport`\
    \ 属性实现的。例如，你可以写：\n\n```html\n<meta name=\"viewport\" content=\"width=300, initial-scale=1\"\
    >\n```\n\n`width=300` 将视口宽度设置为 300 像素。一个像素（`px`）等于计算机屏幕上的一个点。\n\n当你将视口设置为 300px\
    \ 且有一张宽度为例如 500 像素的图像时，你只能看到图像的一部分，因为图像的宽度大于视口的宽度。要查看图像的其余部分，你必须滚动页面。相比之下，如果你将视口设置为\
    \ 500px，整个图像将显示出来而无需任何滚动。如果你将视口设置为 1000px，整个图像也会显示，但它会更小，并且只占屏幕宽度的一半。\n\n`initial-scale=1`\
    \ 设置了页面被浏览器首次加载时的初始缩放级别（在这种情况下为 1x）。\n\n如果你感兴趣了解更多关于视口的工作原理，可以查看 [`https://developer.apple.com/library/ios/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html`](https://developer.apple.com/library/ios/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html`)`]。\n\
    \n### <title>...</title>\n\n`<title>` 标签用于定义浏览器应该在其标题栏或页面标签页上显示的标题。\n\n### <style>...</style>\n\
    \n`<style>` 标签用于向我们的 HTML 文档添加内部 CSS 代码。我们将在第 3 章学习如何做到这一点。\n\n示例：\n\n```html\n\
    <style type=\"text/css\">\nbody {\n  …\n}\n</style>\n```\n\n### <link>\n\n`<link>`\
    \ 标签用于链接到外部资源，最常用于链接到外部 CSS 样式表。它不需要结束标签。\n\n示例：\n\n```html\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"mystyle.css\">\n```\n\n`rel` 和 `type` 属性仅告诉浏览器你正在链接到一个\
    \ CSS 样式表。你不需要修改它们。唯一你需要修改的属性是 `href` 属性。该属性用于指定 CSS 文件的路径。\n\n## 如何编写外部文件的路径\n\
    \n任何外部文件的路径始终从 HTML 文档的当前文件夹开始。假设有五个文件夹：`User`、`Documents`、`MyWebsite`、`MyCSS`\
    \ 和 `MoreCSS`，结构如下：\n\n`User > Documents > MyWebsite > MyCSS > MoreCSS`\n\n这意味着，`User`\
    \ 文件夹包含 `Documents` 文件夹，后者又包含 `MyWebsite` 文件夹。在 `MyWebsite` 文件夹中，我们有 `MyCSS` 文件夹，它包含\
    \ `MoreCSS` 文件夹。\n\n如果你在 `MyWebsite` 文件夹中工作，想要访问 `MoreCSS`，路径就是 `MyCSS/MoreCSS`。\n\
    \n## Head 元素中的元素\n\n现在我们已经理解了 HTML 是如何工作的，让我们详细查看 `head` 元素。\n\n如上所述，`head` 元素提供了关于文档的通用信息，例如它的元数据、标题以及指向外部资源的链接。让我们来看\
    \ `head` 元素内部的一些标签。\n\n## Body 元素中的元素\n\n第 6 行是 `body` 元素的开始处。`<body>...</body>`\
    \ 标签内的内容将显示在网页上。在我们的示例中，文本“This is just text”和图像“someimage.jpg”将被显示。\n\n在`<body>...</body>`\
    \ 标签内部，我们还可以使用许多其他标签，例如添加图像的 `<img>` 标签、用于显示表格的 `<table>` 标签以及添加列表的 `<ul>` 标签。我们稍后会详细介绍这些标签。\n\
    \n为了感受一下它的工作原理，你可以从配套网站下载本章节的代码（[`http://learncodingfast.com/css`](http://learncodingfast.com/css`)`）。源代码可以在\
    \ `Chapter 2 - Basics of HTML` 文件夹中找到。双击 HTML 文件即可启动它。\n\n在完成本书附带的额外奖励项目时，你将在导师的指导下编写一个真实的\
    \ HTML 文档。该项目的源代码可以在 `Bonus Project\\Answers` 文件夹中找到。\n"
- fmt: "\nThe `<ol>` tag stands for ordered list and is used to create a list with\
    \ numbers or alphabets as list markers.\n\n### Example\n```html\n<ol>\n  <li>Chocolate</li>\n\
    \  <li>Strawberry</li>\n  <li>Vanilla</li>\n</ol>\n```\nOutput:\n> 1. Chocolate\n\
    > 2. Strawberry\n> 3. Vanilla\n\n`<ul>`...`</ul>` and `<li>`...`</li>`\n\nThe\
    \ `<ul>` tag stands for unordered list and is similar to the `<ol>` tag. However,\
    \ instead of using numbers or alphabets as list markers, it uses shapes (such\
    \ as a dot, or a hollow circle).\n\n### Tables\n`<table>`...`</table>`, `<tr>`...`</tr>`,\
    \ `<th>`...`</th>`, `<td>`...`</td>`\n\nThe `<table>` tag is used to create a\
    \ table. `<tr>` stands for “Table Row”, `<th>` stands for “Table Header” and `<td>`\
    \ stands for “Table Data”. Tables are created row by row in HTML.\n\n#### Example\
    \ (numbers are not part of the code):\n```html\n<table>\n  <tr>\n    <th>Name</th>\n\
    \    <th>Gender</th>\n  </tr>\n  <tr>\n    <td>Abigail</td>\n    <td>F</td>\n\
    \  </tr>\n  <tr>\n    <td>Benny</td>\n    <td>M</td>\n  </tr>\n</table>\n```\n\
    This code will give you a table with 3 rows and 2 columns. Line 2 to 5 defines\
    \ the first row of the table, which is a header row as the `<th>` tag is used.\
    \ Line 6 to 9 defines the second row and lines 10 to 13 defines the third. Depending\
    \ on how you style the table in CSS, you’ll get a table similar to the one below:\n\
    \n![](images/00005.jpg)\n\n### Elements Used in Conjunction with CSS\nThere are\
    \ two special HTML elements that do not have any inherent meaning in HTML. They\
    \ are mainly used in conjunction with CSS to style a specific section of the webpage.\
    \ These two elements are `div` and `span`.\n\n#### Div Tag\n`<div>`...`</div>`\n\
    \n`<div>` stands for ‘division’ and is used to define a division or a section\
    \ in a HTML document. The `<div>` tag is normally used in conjunction with CSS\
    \ to format the contents within the `<div>`...`</div>` tags.\n\nFor instance,\
    \ if we write:\n```html\n<div>\n  This is some division in the HTML document.\n\
    \  <ol>\n    <li>Chocolate</li>\n    <li>Strawberry</li>\n    <li>Vanilla</li>\n\
    \  </ol>\n</div>\n```\nwe can use CSS to format everything inside the `div` tags\
    \ (i.e. both the text and the ordered list). We’ll learn how to do that in the\
    \ next chapter.\n\n#### Span Tag\n`<span>`...`</span>`\n\nThe `<span>` tag is\
    \ similar to the `<div>` tag. The main difference is that `<div>` is a block element,\
    \ while `<span>` is an inline element.\n\nA block element is one that starts and\
    \ ends with a new line break. In contrast, an inline element does not start or\
    \ end with a line break. For instance, if we write:\n\n`This is a <div>block element</div>,\
    \ while this is an <span>inline</span> element.`\n\nwe’ll get:\n`This is a`\n\
    `block element`\n`, while this is an inline element.`\n\nAs the phrase ‘block\
    \ element’ is tagged with the `<div>` tag, it starts and ends on a new line. On\
    \ the other hand, the word ‘inline’ is an inline element and does not start or\
    \ end on a new line. Generally, we tend to use `<div>` to wrap sections of a document,\
    \ while `<span>` is used to wrap small portions of text, images, etc\n\n### Elements\
    \ For Adding Javascript Code to Website\n`<script>`...`</script>`\n\nThe `<script>`\
    \ tag is used to add internal Javascript code to our HTML document or to link\
    \ to an external script. Javascript is a scripting language that adds interactivity\
    \ to our website.\n\n#### Example (to add internal JS code):\n```html\n<script>\n\
    \  document.getElementById(\"para1\").innerHTML = \"Hello JavaScript!\";\n</script>\n\
    ```\n#### Example (to link to an external JS script):\n```html\n<script type=\"\
    text/javascript\" src=\"myscripts.js\"></script>\n```\n\n### Elements For Formatting\
    \ Text\n#### Strong\n`<strong>`...`</strong>`\n\nThe `<strong>` tag is used to\
    \ define important text. Most browsers will bold the text.\n\nExample:\n`The examination\
    \ will be held on <strong>12 Jan at 2pm</strong>. Latecomers will not be allowed\
    \ into the hall.`\n\nOutput:\nThe examination will be held on 12 Jan at 2pm. Latecomers\
    \ will not be allowed into the hall.\n\n#### Em\n`<em>`...`</em>`\n\nThe `<em>`\
    \ tag is used to define emphasized text. Most browsers will display the text in\
    \ italics form.\n\nExample:\n`The examination will be held on 12 Jan at 2pm. Latecomers\
    \ <em>will not be allowed</em> into the hall.`\n\n### Elements For Defining Sections\n\
    #### Header\n`<header>`...`</header>`\nThe `header` element is for the top section.\n\
    \n#### Navigation\n`<nav>`...`</nav>`\n`nav` stands for navigation.\n\n#### Main\n\
    `<main>`...`</main>`\nThe `main` element is for the content area.\n\n#### Footer\n\
    `<footer>`...`</footer>`\nThe `footer` is for the bottom section.\n\n### Comments\n\
    Notice that in the previous example, we used `<!--` and `-->` symbols? These are\
    \ known as comments. Most of the time when we program, we need to add comments\
    \ to make it easier to read. Comments are not displayed in the browser, they are\
    \ merely added to explain our code.\n\nTo add comments to HTML documents, we use\
    \ the `<!--...-->` tag.\n\nExample:\n```html\n<!--This is a comment. It will not\
    \ be displayed in the browser.-->\n```\n\n### Character Entities\nSome characters\
    \ have predefined meanings in HTML and are reserved for that specific use. For\
    \ instance, the less than sign `<` is used to start all tags. What happens if\
    \ we need to display the text 5<12 on our webpage?\n\nTo do that, we need to use\
    \ character entities. Character entities always start with an ampersand `&` and\
    \ end with a semi-colon `;`. There are two ways to display the less than sign.\
    \ We can either write `&lt;` or `&#60;`. The first is known as the entity name\
    \ while the latter is known as the entity number. An entity name is easier to\
    \ remember (`lt` stands for less than) but some browsers do not support all entity\
    \ names.\n\nCommonly used character entities include:\n- Less than sign (<): `&lt;`\
    \ or `&#60;`\n- Greater than sign (>): `&gt;` or `&#62;`\n- Ampersand sign (&):\
    \ `&amp;` or `&#38;`\n"
  raw: 'The `<ol>` tag stands for ordered list and is used to create a list with numbers
    or alphabets as list markers.


    Example:


    `<ol>`


    `  <li>Chocolate</li>`


    `  <li>Strawberry</li>`


    `  <li>Vanilla</li>`


    `</ol>`


    Output:


    > 1. Chocolate


    > 2. Strawberry


    > 3. Vanilla


    <ul>...</ul> and <li>...</li>


    The `<ul>` tag stands for unordered list and is similar to the `<ol>` tag. However,
    instead of using numbers or alphabets as list markers, it uses shapes (such as
    a dot, or a hollow circle).


    <table>...</table>, <tr>...</tr>, <th>...<th>, <td>...</td>


    The `<table>` tag is used to create a table. `<tr>` stands for “Table Row”, `<th>`
    stands for “Table Header” and `<td>` stands for “Table Data”. Tables are created
    row by row in HTML.


    Example (numbers are not part of the code):


    `1  <table>`


    `2    <tr>`


    `3       <th>Name</th>`


    `4       <th>Gender</th>`


    `5    </tr>`


    `6    <tr>`


    `7       <td>Abigail</td>`


    `8       <td>F</td>`


    `9    </tr>`


    `10   <tr>`


    `11      <td>Benny</td>`


    `12      <td>M</td>`


    `13   </tr>`


    `14 </table>`


    This code will give you a table with 3 rows and 2 columns. Line 2 to 5 defines
    the first row of the table, which is a header row as the `<th>` tag is used. Line
    6 to 9 defines the second row and lines 10 to 13 defines the third. Depending
    on how you style the table in CSS, you’ll get a table similar to the one below:


    ![](images/00005.jpg)


    Elements Used in Conjunction with CSS


    There are two special HTML elements that do not have any inherent meaning in HTML.
    They are mainly used in conjunction with CSS to style a specific section of the
    webpage. These two elements are `div` and `span`.


    <div>...</div>


    `<div>` stands for ‘division’ and is used to define a division or a section in
    a HTML document. The `<div>` tag is normally used in conjunction with CSS to format
    the contents within the `<div>...</div>` tags.


    For instance, if we write


    `<div>`


    `This is some division in the HTML document.`


    `<ol>`


    > `<li>Chocolate</li>`


    > `<li>Strawberry</li>`


    > `<li>Vanilla</li>`


    `</ol>`


    `</div>`


    we can use CSS to format everything inside the `div` tags (i.e. both the text
    and the ordered list). We’ll learn how to do that in the next chapter.


    <span>...</span>


    The `<span>` tag is similar to the `<div>` tag. The main difference is that `<div>`
    is a block element, while `<span>` is an inline element.


    A block element is one that starts and ends with a new line break. In contrast,
    an inline element does not start or end with a line break. For instance, if we
    write


    `This is a <div>block element</div>, while this is an <span>inline</span> element.`


    we’ll get


    `This is a`


    `block element`


    `, while this is an inline element.`


    As the phrase ‘block element’ is tagged with the `<div>` tag, it starts and ends
    on a new line. On the other hand, the word ‘inline’ is an inline element and does
    not start or end on a new line. Generally, we tend to use `<div>` to wrap sections
    of a document, while `<span>` is used to wrap small portions of text, images,
    etc


    Elements For Adding Javascript Code to Website


    <script>...</script>


    The `<script>` tag is used to add internal Javascript code to our HTML document
    or to link to an external script. Javascript is a scripting language that adds
    interactivity to our website..


    Example (to add internal JS code):


    `<script>`


    `document.getElementById("para1").innerHTML = "Hello JavaScript!";`


    `</script>`


    Example (to link to an external JS script):


    `<script type=”text/javascript” src="myscripts.js"></script>`


    Elements For Formatting Text


    <strong>...</strong>


    The `<strong>` tag is used to define important text. Most browsers will bold the
    text.


    Example:


    `The examination will be held on <strong>12 Jan at 2pm</strong>. Latecomers will
    not be allowed into the hall.`


    Output:


    The examination will be held on 12 Jan at 2pm. Latecomers will not be allowed
    into the hall.


    <em>...</em>


    The `<em>` tag is used to define emphasized text. Most browsers will display the
    text in italics form.


    Example:


    `The examination will be held on 12 Jan at 2pm. Latecomers <em>will not</em> be
    allowed into the hall.`


    Output:


    The examination will be held on 12 Jan at 2pm. Latecomers will not be allowed
    into the hall.


    Elements for Defining Sections of a Webpage


    HTML also comes with a few tags for defining sections of a webpage. These tags
    do not do much, their purpose is simply to indicate to the browser and developer
    which section the content they enclose belongs to.


    <header>...</header>


    The `header` element defines the top section of a webpage and normally consists
    of the logo/banner of the website. Do not confuse the `header` element with the
    `head` element. The `head` element defines all the behind the scene stuff and
    is not displayed on the page. The `header` element on the other hand defines content
    that is to be displayed at the top of the website.


    <nav>...</nav>


    `nav` stands for navigation and is used to define a set of navigation links (i.e.
    menu).


    <main>...</main>


    The `main` element is used to define the main section of a page.


    <footer>...</footer>


    The `footer` element is the counterpart of the `header` element and is used to
    define the footer of the web page (i.e. the bottom section). The `header` and
    `footer` elements are similar to the ‘header’ and ‘footer’ sections of a MS Word
    document. For Word documents, we normally use the footer to display the page number.
    On a website, we normally use it to include additional links and additional information
    (such as contact information and copyright information).


    Note that all the four elements above are to be included in the `<body>...</body>`.
    Their purpose is mainly to further segment the `<body>` element into different
    sections. The code below shows how these elements are used.


    `<!doctype html>`


    `<html>`


    `<head><title>An example</titlte></head>`


    `<body>`


    `<header>`


    `       <!-- Insert Banner or Logo Here -->`


    `</header>`


    `<nav>`


    `       <!-- Insert Navigation Links Here -->`


    `</nav>`


    `<main>`


    `       <!-- Insert Main Content Here -->`


    `</main>`


    `<footer>`


    `       <!-- Insert Footer Here -->`


    `</footer>`


    `</body>`


    `</html>`


    Comments


    Notice that in the previous example, we used a lot of the `<!--` and `-->` symbols?
    These are known as comments.


    Most of the time when we program, we need to add comments to our code to make
    it easier to read and understand. This is extremely important if we are working
    with other programmers or if we need to edit the source code at a later date.
    Comments are not displayed in the browser, they are merely added to explain our
    code.


    To add comments to a HTML documents, we use the `<!--... -->` tag.


    Example:


    `<!--This is a comment. It will not be displayed in the browser.-->`


    Character Entities


    Some characters have predefined meanings in HTML and are reserved for that specific
    use. For instance, the less than sign (<) is used to start all tags. What happens
    if we need to display the text 5<12 on our webpage?


    To do that, we need to use character entities. Character entities always start
    with an ampersand


    sign (&) and end with a semi-colon (;). There are two ways to display the less
    than sign. We can either write `&lt;` or `&#60;`. The first is known as the entity
    name while the latter is known as the entity number. An entity name is easier
    to remember (`lt` stands for less than) but some browsers do not support all entity
    names. On the other hand, entity numbers are harder to remember but the support
    is better.


    Commonly used character entities include


    Less than sign (<)


    `&lt;`   or   `&#60;`


    Greater than sign (>)


    `&gt;`   or   &#62;


    Ampersand sign (&)


    `&amp;`   or   `&#38;`


    For instance, if you want to display 5<12 on your website, you write it as `5&lt;12`
    in your HTML code.'
