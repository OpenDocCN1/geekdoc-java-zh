    \ suggest `TextWrangler` ([http://www.barebones.com/products/textwrangler/](http://www.barebones.com/products/textwrangler/)).\
    \ Both are free to use. \n\n### Opening a .HTML File\n\nAn `.HTML` file can be\
    \ opened in two ways. One way is to open it in a web browser by double clicking\
    \ on the file. This is for viewing the page. Another way is to open it in a text-editor\
    \ for editing. To do that, first launch your text-editor and then open the file\
    \ from within the editor.\n\nWhen working with `HTML` files, I suggest you open\
    \ the file in your browser and text-editor concurrently and arrange the two windows\
    \ so that they are side-by-side. That way, you can edit the code on your editor,\
    \ save it, and then move over to your browser, refresh the page and immediately\
    \ check the effects of the changes you made to the code. Follow this procedure\
    \ when working on the exercises from Chapters 3 to 10.\n\n# Chapter 2: Basics\
    \ of HTML\n\nNow that we’ve covered a basic introduction to web programming, let’s\
    \ start learning some actual `HTML` code. In this chapter, we’ll be covering the\
    \ essentials of HTML. If you are familiar with `HTML`, you can skip the chapter\
    \ and go ahead to Chapter 3.\n\nFor those of you who are new to `HTML`, let’s\
    \ get started.\n\n## What is HTML\n\n`HTML` stands for Hypertext Markup Language\
    \ and is a language used by web programmers to add content to a web page. A markup\
    \ language is simply a language for annotating a document to explain what different\
    \ sections of the text are and how they should be presented. For instance, we\
    \ can use `HTML` to specify whether the content should be presented as a list\
    \ or in table form. The current `HTML` version is `HTML5`.\n\nThe nicest thing\
    \ about `HTML` is that the source code of a web page is free for all to view.\
    \ This makes it easy for us to learn `HTML` by studying the codes of other web\
    \ pages. To view the source code of a web page on Windows, simply right-click\
    \ anywhere on the page and select “View Source” (or something similar, such as\
    \ “View Page Source”, depending on the browser you use). If you are on Mac, click\
    \ on “View” in the menu bar, select “Developer” and then select “View Source”.\n\
    \nMost of the source code that you view will look very complicated, especially\
    \ if you have no prior knowledge in `HTML`. Don’t worry about that. Soon, you’ll\
    \ be able to write such ‘complicated’ codes yourself.\n\nTo get a better understanding\
    \ of how `HTML5` works, let’s start by examining the basic structure of a `HTML`\
    \ document.\n\n### Basic Structure of a HTML Page\n\nAn example of a basic `HTML`\
    \ document is shown below. I’ve added numbers beside each line for reference.\n\
    \n```html\n1 <!doctype html>\n2 <html>\n3 <head>\n4 <title>My First Page</title>\n\
