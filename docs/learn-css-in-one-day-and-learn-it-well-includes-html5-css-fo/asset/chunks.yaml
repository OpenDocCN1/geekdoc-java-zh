    , Georgia, serif;\nfont-size: 1em;\nfont-style: normal;\nfont-weight: normal;\n\
    color: black;\ntext-align: left;\ntext-decoration: none;\nletter-spacing: 0px;\n\
    word-spacing: 0px;\nline-height: 1;\n}\n</style>\n</head>\n<body>\n    <h3>示例文本</h3>\n\
    \    <p id=\"sampletext\">这段文本用于演示各种字体和文本属性的效果。修改“sampletext”的 CSS 声明，并观察这段文本发生了什么变化。这段文本添加了边框，以显示“两端对齐（justify）”的效果。</p>\n\
    </body>\n</html>\n```\n\n# 练习 9.1\n\n```html\n<!doctype html>\n<html>\n<head>\n\
