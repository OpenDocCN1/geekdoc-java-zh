  trans: "\n\n## 7. 修改 CSS 属性 `text-align` 并观察示例文本的变化。默认情况下，此段落的文字是左对齐的。现在尝试以下各项：\n\
    \n(a) `text-align: justify;`\n(b) `text-align: right;`\n(c) `text-align: center;`\n\
    \n## 8. 修改 CSS 属性 `text-decoration` 并观察示例文本的变化。尝试：\n\n(a) `text-decoration: underline;`\n\
    (b) `text-decoration: overline;`\n(c) `text-decoration: line-through;`\n\n## 9.\
    \ 修改 CSS 属性 `letter-spacing` 并观察示例文本的变化。尝试：\n\n(a) `letter-spacing: 5px;`\n(b)\
    \ `letter-spacing: -5px;`\n\n## 10. 将 `letter-spacing` 改回 `0px`。修改 CSS 属性 `word-spacing`\
    \ 并观察示例文本的变化。尝试：\n\n(a) `word-spacing: 10px;`\n(b) `word-spacing: -20px;`\n\n\
    ## 11. 将 `word-spacing` 改回 `0px`。修改 CSS 属性 `line-height` 并观察示例文本的变化。尝试：\n\n(a)\
    \ `line-height: 2;`\n(b) `line-height: 25px;`\n(c) `line-height: 30%;`\n\n# 第\
    \ 9 章：列表、链接与导航栏\n\n在本章中，我们将学习用于设置超链接和列表样式的 CSS 属性。此外，我们将结合这两个概念，讨论如何创建网页上常见的导航栏。准备好了吗？让我们先从\
    \ CSS 列表开始。\n\n### CSS 列表\n\n回想一下在 HTML 中我们可以创建两种类型的列表：有序列表和无序列表。我们可以使用 CSS 列表属性对这些列表进行样式设置。\n\
    \n#### list-style-type\n\n`list-style-type` 属性允许你为列表设置列表项目标记。列表项目标记是指每个列表项目左侧的那些符号/数字/字母。\n\
    \n对于有序列表，我们可以指定想要使用的数字或字母类型作为标记。例如，如果我们想使用罗马数字（如 i, ii, iii）作为项目标记，可以编写 `list-style-type:\
    \ lower-roman;`。\n\n其他常用的标记还包括：\n\n`decimal`（这是默认值），\n`decimal-leading-zero`（带有前零的数字，例如\
    \ 01, 02..），\n`lower-alpha`（例如 a, b, c..），\n`lower-greek`（例如 α, β, γ..），\n`upper-alpha`（例如\
    \ A, B, C..）以及\n`upper-roman`（例如 I, II, III…）。\n\n对于无序列表，你可以指定想要作为项目符号的形状。默认标记是\
    \ `disc`（实心圆）。你可以将其改为 `square`（正方形）或 `circle`（圆形）。\n\n此外，你也可以选择不为列表使用任何项目标记。要这样做，你需要编写\
    \ `list-style-type: none;`。这在创建导航栏时非常常见。\n\n示例：\n\n`list-style-type: lower-roman;`\n\
    `list-style-type: circle;`\n`list-style-type: none;`\n\n#### list-style-image\n\
    \n如果你不喜欢提供的任何列表样式，可以选择使用图像作为列表项目标记。要这样做，你可以使用 `list-style-image` 属性来指定使用的图像 URL。\n\
    \n示例：\n\n`list-style-image: url(‘myMarker.gif’);`\n\n#### list-style-position\n\
    \n`list-style-position` 属性用于指定列表项目标记应该出现在内容流的内部还是外部。有两个接受的值：`inside` 和 `outside`。\n\
    \n默认情况下，列表项目带有一定的缩进显示。如果 `list-style-position` 设置为 `inside`，则列表项目标记将在缩进之后。缩进由下方图中框的左边缘表示。如果\
    \ `list-style-position` 设置为 `outside`，则标记将在缩进之前显示![](img/00004.jpg)\n\n换句话说，`list-style-position:\
    \ inside` 产生的缩进比 `list-style-position: outside` 更多。默认位置是 `outside`。\n\n示例：\n\n\
    `list-style-position: outside;`\n\n#### list-style\n\n`list-style` 是一个简写属性，用于在一个声明中设置所有的列表属性（即\
    \ `list-style-type`、`list-style-position` 和 `list-style-image`）。如果缺少任何值，将使用该缺失属性的默认值。\n\
    \n示例：\n\n`list-style: square inside url(\"myMarker.gif\");`\n\n### CSS 链接\n\n\
    可以使用之前章节讨论过的任何 CSS 属性对超链接进行样式设置。你可以使用 `background-color` 属性设置背景颜色，这将使链接具有高亮外观。你还可以使用第\
    \ 8 章涵盖的文本和字体属性来更改字体大小、字体样式、文本颜色、文本装饰等。\n\n此外，我们还可以根据状态对超链接进行样式设置。链接有四种状态：\n\n\
    `link`（未访问的链接）\n`visited`（已访问的链接）\n`hover`（用户鼠标悬停在其上方时）\n`active`（链接被点击时）\n\n\
    要指定状态，我们使用以下伪类：\n\n```\na:link\na:visited\na:hover\na:active\n```\n\n示例：\n\n```css\n\
    a:link { color: blue; }\na:visited { color: purple; }\na:hover { color: red; }\n\
    a:active { color: yellow; }\n```\n\n### 导航栏\n\n导航栏通常作为无序列表创建。让我们尝试制作自己的菜单。\n\n\
    ```html\n<ul>\n  <li><a href=\"home.html\">首页 (Home)</a></li>\n  <li><a href=\"\
    html.html\">HTML 教程 (HTML Tutorial)</a></li>\n  <li><a href=\"csstutorial.html\"\
    >CSS 教程 (CSS Tutorial)</a></li>\n</ul>\n```\n\n接下来，我们需要对列表设置样式。我们使用 CSS 移除列表符号。\n\
    \n```css\nul {\n  list-style-type: none;\n}\n```\n\n现在我们必须对链接设置样式。我们将为链接使用块级显示（block\
    \ display）。\n\n```css\na {\n  display: block;\n  width: 160px;\n  text-align:\
    \ center;\n  text-decoration: none;\n  background-color: #00FF00;\n}\n```\n\n\
    最后，如果我们希望导航栏水平排列，我们需要让列表项目向左浮动。\n\n```css\nli {\n  float: left;\n}\n```\n\n完成！我们刚刚了一个简单的水平导航栏。此导航栏的代码作为本章练习的一部分给出。你可以尝试调整它并使其看起来更美观。你可以为四种链接状态指定样式。\n\
    \n## 练习 9\n\n从 [`learningfast.com/css`](http://learningfast.com/css) 下载此练习源码并解压文件。练习源码可以在\
    \ Chapter 9 - Lists and Navigation Bars 文件夹找到。\n\n### 练习 9.1\n\n1. 在浏览器和编辑器中同时打开文件\
    \ Chapter 9 - List and Links.html。\n2. 修改 `ol` 的 CSS 声明并观察有序列表的变化。尝试以下各项：\n  \
    \ (a) `list-style-type: decimal-leading-zero;`\n   (b) `list-style-type: lower-roman;`\n\
    \   (c) `list-style-type: upper-roman;`\n   (d) `list-style-type: upper-alpha;`\n\
    \   (e) `list-style-type: lower-alpha;`\n   (f) `list-style-type: lower-greek;`\n\
    \   (g) `list-style-type: none;`\n3. 修改 `ul` 的 CSS 声明并观察无序列表的变化。尝试以下各项：\n   (a)\
    \ `list-style-type: circle;`\n   (b) `list-style-type: square;`\n   (c) `list-style-type:\
    \ none;`\n   (d) `list-style-type: disc;`\n4. 在 `ul` 的 CSS 声明中添加以下规则：\n   ```css\n\
    \   list-style-position: outside;\n   ```\n\n"
- fmt: "\n> Refresh the browser. Nothing changes right? That is because `list-style-position:\
    \ outside;` is the default. Now change `list-style-position: outside;` to `list-style-position:\
    \ inside;`. You’ll notice that the unordered list is shifted slightly to the right\
    \ (i.e. there’s more indentation).\n\n> 5. Remove the `list-style-type` property\
    \ for `ul` and add the following instead:\n\n> (a) `list-style-image: url(\"myMarker.gif\"\
    );`\n\n> Observe what happens to the 'Cars Unordered List'.\n> 6. Now let’s look\
    \ at how to style hyperlinks. Try adding the following rules to the stated selector:\n\
    \n> (a) Add `color: green;` to `a:link{}`\n> and observe what happens to the ‘Click\
    \ Me’ link.\n\n> (b) Add `font-size: 2em;` to `a:active{}`\n> and click on the\
    \ link.\n\n> (c) Add `background-color: red;` to `a:hover{}`\n> and hover your\
    \ mouse over the link.\n\n### Exercise 9.2\n\n> 1. Open the file `Chapter 9 -\
    \ Navigation Bar.html` concurrently in your browser and text editor.\n> 2. This\
    \ page shows an example of how a horizontal navigation bar can be created using\
    \ CSS rules for lists and links. The steps are explained in the book. Study the\
    \ code and try modifying the CSS declaration to improve the design of this navigation\
    \ bar.\n\n# Chapter 10: Tables\n\nHTML tables are ugly looking by default. However,\
    \ with some simple CSS styling, we can easily convert them into gorgeous looking\
    \ tables. In this chapter, we’ll look at how to do that.\n\n## Border, Padding\
    \ and Margin\n\nThe first set of properties we’ll be looking at is the `border`,\
    \ `padding` and `margin` properties. Recall we talked about these properties when\
    \ discussing the CSS box model? HTML tables (`<table>`) and table cells (`<th>`\
    \ and `<td>`) follow the same box model as other CSS elements and can therefore\
    \ be styled using these properties.\n\nTo understand how this work, refer to the\
    \ diagram below (the words ‘Table Margin’ and ‘Table Padding’ are added for reference\
    \ and do not exist on the actual table).\n\n![](images/00014.jpg)\n\nThe CSS rules\
    \ for this table are as follows:\n\n```css\ntable {\n  border: dashed 1px black;\n\
    \  padding: 50px;\n  margin: 60px;\n}\n\nth {\n  border: solid 1px black;\n  padding:\
    \ 30px;\n  text-align: center;\n}\ntd {\n  border: solid 1px black;\n  padding:\
    \ 20px;\n}\n```\n\nThe dotted line is the table’s border. Space surrounding the\
    \ dotted border is the table’s margin (declared to be 60px) and space within the\
    \ dotted border is its padding (50px).\n\nThe first row (Firstname, Lastname,\
    \ Age) is defined as the table heading using the `<th>` tag. Space surrounding\
    \ the words ‘Firstname’, ‘Lastname’ and ‘Age’ is the padding for the `<th>` element\
    \ (30px).\n\nThe second, third and fourth row is defined using the `<td>` tag.\
    \ Space surrounding words like ‘Derek’, ‘Aaron’ and ‘31’ is the padding for the\
    \ `<td` element (20px).\n\nNo margins are declared for the `<th>` and `<td` elements\
    \ as margins are ignored for table cells. Hence, we cannot specify the spacing\
    \ between the cells. By default, there’ll be a small gap between individual table\
    \ cells. In addition, there’s also a gap between the table’s border (the dotted\
    \ line) and the borders of the cells (the solid lines) even if you set table padding\
    \ to 0px. If you only want one border, you have to use the `border-collapse` property:\n\
    \n```css\nborder-collapse: collapse;\n```\n\nWe’ll have a chance to play around\
    \ with the `border`, `padding` and `margin` properties when we do the exercise\
    \ for this chapter. For now, let’s move on to the next property.\n\n## Height\
    \ and Width\n\nThe width and height of a table can be set using the `width` and\
    \ `height` properties. The values are normally given in pixels or as a percentage.\
    \ For instance, the code below sets the table width to be 100% of the parent element\
    \ and the height to be 500px.\n\n```css\ntable {\n  width: 100%;\n  height: 500px;\n\
    }\n```\n\nYou can also use the height property at the `tr`, `th` or `td` level.\
    \ For instance, if you want the table header row to have a height of 100px, you\
    \ can write\n\n```css\nth {\n  height: 100px;\n}\n```\n\nIn addition, you can\
    \ set the width property at the table cell level (i.e. for the `td` and `th` elements).\
    \ If you want the table cells to have a width of 200px, you can write\n\n```css\n\
    th {\n  width: 200px;\n}\n```\n\nIf you want to style individual columns, you\
    \ can use the `id`/`class` attribute to do it. For instance if you have the table\
    \ structure below:\n\n```html\n<table>\n  <tr>\n    <th id=\"firstColumn\">First\
    \ Column</th>\n    <th id=\"secondColumn\">First Column</th>\n  </tr>\n  <tr>\n\
    \    <td>Some data</td>\n    <td>More data</td>\n  </tr>\n</table>\n```\n\nyou\
    \ can set the width of the table columns individually.\n\n```css\n#firstColumn\
    \ {\n  width: 40%;\n}\n\n#secondColumn {\n  width: 60%;\n}\n```\n\n## Text Alignment\n\
    \nText within table cells can be aligned horizontally using the `text-align` property\
    \ and vertically using the `vertical-align` property. The commonly used for `text-align`\
    \ are `center`, `left`, `right`. The commonly used for `vertical-align` are `top`,\
    \ `middle`, `bottom`.\n\n```css\nth {\n  text-align: center;\n  vertical-align:\
    \ middle;\n}\n```\n\n## Background, Font and Text\n\nTables can also be styled\
    \ using properties for background, font and text covered in Chapter 7 and 8. For\
    \ instance, the code below will set the `<th>` elements to white and give them\
    \ a green background.\n\n```css\nth {\n  background-color: green;\n}\n```\n\n\
    ## nth-child Selector\n\nSometimes we have a very table difficult to read. One\
    \ way to improve the readability is to color alternating rows. To color even rows,\
    \ we write\n\n```css\ntr:nth-child(even) {\n  background-color: lightgray;\n}\n\
    ```\n\nTo color odd rows, we write\n\n```css\ntr:nth-child(odd) {\n  background-color:\
    \ lightblue;\n}\n```\n\n### Exercise 10\n\n> 1. Open the file `Chapter 10 - Tables.html`\
    \ concurrently in your browser and text editor.\n> 2. This page shows an example\
    \ of how a horizontal navigation bar can be created using CSS rules for lists\
    \ and links. The steps are explained in the book. Study the code and try modifying\
    \ the CSS declaration to improve the design of this navigation bar.\n\n### Exercise\
    \ 10.1\n\n> 1. Open the file `Chapter 10 - Tables.html` concurrently in your browser\
    \ and text editor.\n> 2. Modify the CSS declaration for `table` and observe what\
    \ happens to the table. Try adding each of the following:\n\n> (a) `padding: 50px;`\n\
    > (b) `margin: 30px;`\n> (c) `border-collapse: collapse;`\n> (d) Change `border:\
    \ dashed 1px black;` to `border: 2px green;`\n> 3. Modify the CSS declaration\
    \ for `th` and observe what happens to the table. Try adding:\n\n> (a) `padding:\
    \ 50px;`\n> (b) `margin: 30px;` (Margin rules will be ignored. Try it)\n> Repeat\
    \ the same for `td`.\n> 4. Remove the `padding` and `margin` properties from Part\
    \ 3 for both `td` and `th`. Modify the CSS declaration for `table` and observe\
    \ what happens to the table. Try adding each of the:\n\n> (a) `width: 300px;`\n\
    > (b) `width: 50%;`\n> Notice that the width of the table is now 50% of the red\
    \ box.\n> (c) `height: 500px;`\n> (d) `height: 80%;`\n> Notice that the height\
    \ of the table is now 80% of the red box.\n> 5. Remove the `height` and `width`\
    \ properties for `table` from Part 4. Modify the CSS declaration for `th` and\
    \ observe what happens to the table. Try changing the `height` property to:\n\n\
    > (a) `height: 100px;`\n> Remove the `height` property from `th` and add it to\
    \ `td`. Notice what happens. Repeat the same for `tr`.\n> 6. Modify the CSS declaration\
    \ for `th` and observe what happens to the table. Try changing the `width` property\
    \ to:\n\n> (a) `width: 100px;`\n> Remove the `width` property from `th` and add\
    \ it to `td`. Notice what happens. There should be no difference as whether you\
    \ set the width of a table cell at the `th` or `td` level, that width will affect\
    \ both elements.\n"
  raw: "> Refresh the browser. Nothing changes right? That is because `list-style-position:\
    \ outside;` is the default. Now change `list-style-position: outside;` to `list-style-position:\
    \ inside;`. You’ll notice that the unordered list is shifted slightly to the right\
    \ (i.e. there’s more indentation).\n\n> 5. Remove the `list-style-type` property\
    \ for `ul` and add the following instead:\n\n> \n\n> (a) `list-style-image: url(\"\
    myMarker.gif\");`\n\n> \n\n> Observe what happens to the 'Cars Unordered List'.\n\
    \n> 6. Now let’s look at how to style hyperlinks. Try adding the following rules\
    \ to the stated selector:\n\n> \n\n> (a) Add `color: green;`  to  `a:link{}`\n\
    \n> and observe what happens to the ‘Click Me’ link.\n\n>  \n\n> (b) Add `font-size:\
    \ 2em;`  to  `a:active{}`\n\n> and click on the link.\n\n> \n\n> (c) Add `background-color:\
    \ red;`  to  `a:hover{}`\n\n> and hover your mouse over the link.\n\nExercise\
    \ 9.2\n\n> 1. Open the file Chapter 9 - Navigation Bar.html concurrently in your\
    \ browser and text editor.\n\n> 2. This page shows an example of how a horizontal\
    \ navigation bar can be created using CSS rules for lists and links. The steps\
    \ are explained in the book. Study the code and try modifying the CSS declaration\
    \ to improve the design of this navigation bar.\n\nChapter 10: Tables\n\nHTML\
    \ tables are ugly looking by default. However, with some simple CSS styling, we\
    \ can easily convert them into gorgeous looking tables. In this chapter, we’ll\
    \ look at how to do that.\n\nBorder, Padding and Margin\n\nThe first set of properties\
    \ we’ll be looking at is the `border`, `padding` and `margin` properties. Recall\
    \ we talked about these properties when discussing the CSS box model? HTML tables\
    \ (`<table>`) and table cells (`<th>` and `<td>`) follow the same box model as\
    \ other CSS elements and can therefore be styled using these properties.\n\nTo\
    \ understand how this work, refer to the diagram below  (the words ‘Table Margin’\
    \ and ‘Table Padding’ are added for reference and do not exist on the actual table).\n\
    \n![](images/00014.jpg)\n\nThe CSS rules for this table are as follows:\n\n`table\
    \ {`\n\n`border: dashed 1px black;`\n\n`padding: 50px;`\n\n`margin: 60px;`\n\n\
    `}`\n\n`th {`\n\n`border: solid 1px black; `\n\n`padding: 30px;`\n\n`text-align:\
    \ center;`\n\n`}`\n\n`td {`\n\n`border: solid 1px black; `\n\n`padding: 20px;`\n\
    \n`}`\n\nThe dotted line is the table’s border. Space surrounding the dotted border\
    \ is the table’s margin (declared to be 60px) and space within the dotted border\
    \ is its padding (50px).\n\nThe first row (Firstname, Lastname, Age) is defined\
    \ as the table heading using the `<th>` tag. Space surrounding the words ‘Firstname’,\
    \ ‘Lastname’ and ‘Age’ is the padding for the `<th>` element (30px).\n\nThe second,\
    \ third and fourth row is defined using the `<td>` tag. Space surrounding words\
    \ like ‘Derek’, ‘Aaron’ and ‘31’ is the padding for the `<td>` element (20px).\n\
    \nNo margins are declared for the `<th>` and `<td>` elements as margins are ignored\
    \ for table cells. Hence, we cannot specify the spacing between the cells. By\
    \ default, there’ll be a small gap between individual table cells. In addition,\
    \ there’s also a gap between the table’s border (the dotted line) and the borders\
    \ of the cells (the solid lines) even if you set table padding to 0px. If you\
    \ only want one border, you have to use the `border-collapse` property:\n\n`border-collapse:\
    \ collapse;`\n\nWe’ll have a chance to play around with the `border`, `padding`\
    \ and `margin` properties when we do the exercise for this chapter. For now, let’s\
    \ move on to the next property.\n\nHeight and Width\n\nThe width and height of\
    \ a table can be set using the `width` and `height` properties. The values are\
    \ normally given in pixels or as a percentage. For instance, the code below sets\
    \ the table width to be 100% of the parent element and the height to be 500px.\n\
    \n`table {`\n\n`width: 100%;`\n\n`height: 500px;`\n\n`}`\n\nYou can also use the\
    \ height property at the `tr`, `th` or `td` level. For instance, if you want the\
    \ table header row to have a height of 100px, you can write\n\n`th {`\n\n`      \
    \ height: 100px;`\n\n`}`\n\nIn addition, you can set the width property at the\
    \ table cell level (i.e. for the `td` and `th` elements). If you want the table\
    \ cells to have a width of 200px, you can write\n\n`th {`\n\n`width: 200px;`\n\
    \n`}`\n\nIf you want to style individual columns, you can use the `id`/`class`\
    \ attribute to do it. For instance if you have the table structure below:\n\n\
    `<table>`\n\n`       <tr>`\n\n> `<th id=”firstColumn”>First Column</th>`\n\n`      \
    \ <th id=”secondColumn”>First Column</th>`\n\n`</tr>`\n\n`       <tr>`\n\n> `<td>Some\
    \ data</th>`\n\n`       <td>More data</th>`\n\n`</tr>`\n\n`</table>`\n\nyou can\
    \ set the width of the table columns individually like this:\n\n`#firstColumn\
    \ {`\n\n`       width: 40%;`\n\n`}`\n\n`#secondColumn {`\n\n`       width: 60%;`\n\
    \n`}`\n\nText Alignment\n\nText within table cells can be aligned horizontally\
    \ using the `text-align` property and vertically using the `vertical-align` property.\
    \ The commonly used values for the `text-align` property are `center`, `left`,\
    \ `right` and `justify`. The commonly used values for the `vertical-align` property\
    \ are `top`, `middle` and `bottom`.\n\nExamples:\n\n`th {`\n\n`       text-align:\
    \ center;`\n\n`       vertical-align: middle;`\n\n`}`\n\nBackground, Font and\
    \ Text\n\nTables can also be styled using properties for background, font and\
    \ text covered in Chapter 7 and 8\\. For instance, the code below will set the\
    \ text color of `<th>` elements to white and give the elements a green background\
    \ color.\n\n`th {`\n\n`       background-color: green;`\n\n`       color: white;`\n\
    \n`}`\n\nnth-child( ) Selector\n\nSometimes when we have a very large table with\
    \ a lot of rows, the table may be difficult to read. \n\nOne way to improve the\
    \ readability of large tables is to color alternating rows. This can be easily\
    \ achieved with the `nth-child( )` selector.\n\nTo color even rows, we write\n\
    \n`tr:nth-child(even) {`\n\n`       background-color: lightgreen;`\n\n`}`\n\n\
    To color odd rows, we write\n\n`tr:nth-child(odd) {`\n\n`       background-color:\
    \ lightgray;`\n\n`}`\n\nExercise 10\n\nDownload the source code for this exercise\
    \ from [http://learncodingfast.com/css](http://learncodingfast.com/css) and unzip\
    \ the file. The source code for this exercise can be found in the Chapter 10 -\
    \ Tables folder.\n\nExercise 10.1\n\n> 1. Open the file Chapter 10 - Tables.html\
    \ concurrently in your browser and text editor.\n\n> 2. Modify the CSS declaration\
    \ for `table` and observe what happens to the table. Try adding the following\
    \ and observe what happens in each case:\n\n> \n\n> (a) `padding: 50px;`\n\n>\
    \ (b) `margin: 30px;`\n\n> (c) `border-collapse: collapse;`\n\n> (d) Change `border:\
    \ dashed 1px black;` to `border: solid 2px green;`\n\n> 3. Modify the CSS declaration\
    \ for `th` and observe what happens to the table. Try adding:\n\n> \n\n> (a) `padding:\
    \ 50px;`\n\n> (b) `margin: 30px;` (Margin rules will be ignored. Try it)\n\n>\
    \ \n\n> Repeat the same for `td`.\n\n> 4. Remove the `padding` and `margin` properties\
    \ from Part 3 for both `td` and `th`. Modify the CSS declaration for `table` and\
    \ observe what happens to the table. Try adding each of the following:\n\n> \n\
    \n> (a) `width: 300px;`\n\n> \n\n> (b) `width: 50%;`\n\n> Notice that the width\
    \ of the table is now 50% of the red box.\n\n> \n\n> (c) `height: 500px;`\n\n\
    > \n\n> (d) `height: 80%;`\n\n> Notice that the height of the table is now 80%\
    \ of the red box.\n\n> 5. Remove the `height` and `width` properties for `table`\
    \ from Part 4\\. Modify the CSS declaration for `th` and observe what happens\
    \ to the table. Try changing the `height` property to:\n\n> \n\n> (a) `height:\
    \ 100px;`\n\n> \n\n> Remove the `height` property from `th` and add it to `td`.\
    \ Notice what happens. Repeat the same for `tr`.\n\n> 6. Modify the CSS declaration\
    \ for `th` and observe what happens to the table. Try changing the `width` property\
    \ to:\n\n> \n\n> (a) `width: 100px;`\n\n> \n\n> Remove the `width` property from\
    \ `th` and add it to `td`. Notice what happens. There should be no difference\
    \ as whether you set the width of a table cell at the `th` or `td` level, that\
    \ width will affect both elements."
