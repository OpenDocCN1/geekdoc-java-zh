    语法 1:

    ```

    margin: 25px;

    ```

    语法 2:

    ```

    margin: 25px 50px;

    ```

    语法 3:

    ```

    margin-top: 25px;

    ```

    语法 4:

    ```

    margin: 25px 50px 60px 10px;

    ```


