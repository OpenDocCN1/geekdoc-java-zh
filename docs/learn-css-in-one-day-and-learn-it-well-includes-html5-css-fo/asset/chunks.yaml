    \ the HTML code, it is declared later than the embedded CSS which is declared\
    \ in the `head` section. Hence, a font size of 30px will be applied.\n\nDisplay\
    \ Inconsistency\n\nAnother issue to deal with when working with CSS is the problem\
    \ of display inconsistency across browsers. You may find that your website looks\
    \ slightly (or drastically) different in different browsers. Most display issues\
    \ tend to occur in older versions of Internet Explorer, although issues can occur\
    \ in other browsers too (especially mobile browsers).\n\nDisplay inconsistencies\
    \ occur because different browsers use different layout engines to interpret the\
    \ site’s CSS code. For instance, Safari and Chrome use the WebKit engine while\
    \ Firefox uses the Gecko engine. One engine may calculate and display a page differently\
    \ from another engine. For instance Trident, the engine used by Internet Explorer,\
    \ automatically widens a page’s pixel width for certain page designs. This can\
    \ lead to the sidebar being pushed to the bottom due to insufficient width.\n\n\
    Another problem causing display inconsistency is the lack of universal support\
    \ for some CSS properties. Some properties are not supported by all browsers.\
    \ You can go to the site [http://www.caniuse.com](http://www.caniuse.com/) to\
    \ check if a certain CSS property is supported by the browser that you are developing\
    \ for.\n\nSometimes, a certain CSS property is supported by a particular browser\
    \ only when we add a prefix to our CSS rules. This is especially true for newer\
    \ properties in CSS3\\. An example is the `column-count` property in CSS3\\. This\
    \ property divides an element into multiple columns. For instance, we can divide\
    \ a `div` element into three columns by writing `column-count: 3`.\n\nThis property\
    \ is not supported by older versions of Firefox, Chrome, Safari and Opera. To\
    \ enable the property to work on these browsers, you have to write it as three\
    \ declarations,\n\n`-webkit-column-count: 3;`\n\n`-moz-column-count: 3;`\n\n`column-count:\
    \ 3;`\n\ninstead of just\n\n`column-count: 3;`\n\nThe `-webkit-` prefix adds support\
    \ for older versions of Chrome, Safari and Opera while the `-moz-` prefix adds\
    \ support for Firefox. In addition, we also have the `-ms-` prefix that adds support\
    \ for Internet Explorer.\n\nWhen creating your website, it is useful to test it\
    \ on various browsers to ensure that nothing is broken. The way to fix a ‘broken’\
