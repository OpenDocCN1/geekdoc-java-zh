  trans: "\n\n## 7. 分别在第一个、第二个和第三个 `<th>` 开始标签添加 `id=\"firstColumn\"`、`id=\"secondColumn\"\
    ` 和 `id=\"thirdColumn\"` 属性。接下来，添加以下 CSS 规则来分别调整三列的宽度：\n\n```css\n#firstColumn\
    \ {\n    width: 100px;\n}\n#secondColumn {\n    width: 200px;\n}\n#thirdColumn\
    \ {\n    width: 50px;\n}\n```\n\n刷新页面并观察发生了什么。尝试用不同的值调整宽度。\n\n## 8. 修改 `tr` 的\
    \ CSS 声明并观察表格发生了什么。尝试添加：\n\n(a) `text-align: center;`\n(b) `vertical-align: top;`\n\
    \n从 `tr` 中移除上述属性并将它们加到 `th` 中。观察发生了什么。对 `td` 重复相同的操作。如果你没有看到任何区别，请尝试增加表格的宽度和或行的高度。\n\
    \n## 9. 修改 `tr` 的 CSS 声明并观察表格发生了什么。尝试添加：\n\n(a) `background-color: green;`\n(b)\
    \ `color: white;`\n\n从 `tr` 中移除上述属性并将它们加到 `th` 中。观察发生了什么。\n\n现在，从 `th` 中移除这些属性并将它们加到\
    \ `td` 中。\n\n## 10. 最后，让我们尝试交替行上色。首先从 `td` 中移除 `background-color` 和 `color` 规则。接下来，添加以下代码并观察发生了什么。\n\
    \n```css\ntr:nth-child(even) {\n    background-color: lightgreen;\n}\ntr:nth-child(odd)\
    \ {\n    background-color: lightgray;\n}\n```\n\n## Bonus 项目\n\n恭喜你！我们现在涵盖了足够的\
    \ CSS（以及 HTML）基础知识，可以从零开始编写我们的第一个网页了。学习 CSS 的最佳方法是实践。因此，我在书中包含了一个额外项目，你将在该项目的指导下为一个虚拟旅行旅行社编写网页。你可以在\
    \ [`www.learncodingfast.com/demo/jetspeed.html`](http://www.learncodingfast.com/demo/jetspeed.html)\
    \ 查看该项目的演示。\n\n最初我打算将项目放在书的最后。但考虑到 CSS 的图形化特性，我决定在 Kindle 书中包含项目的所有指令和图像并不是理想的。因此，我为项目创建了一个单独的\
    \ PDF 文件，可以在 [`learncodingfast.com/css`](http://learncodingfast.com/css) 下载。\n\
    \n我强烈建议你尝试这个项目，因为它将让你有机会看到在书中学习的所有概念是如何联系的。完成这个项目将帮助巩固你的学习并填补你可能存在的任何漏洞。\n\n编码愉快！\n\
    \n## 感谢\n\n我们已经到了书的结尾。感谢你阅读这本书，希望你喜欢它。更重要的是，我衷心希望这本书帮助你掌握了 CSS 的基础知识。\n\n我知道你可以从几十本关于\
    \ CSS 的书中进行选择，但你选择了这本书。再次感谢你下载这本书并一直读到最后。请尝试练习和额外项目。你将在实践中学到很多。\n\n现在我想请你帮个“小”忙。你能否花一两分钟时间[在亚马逊上为这本书留评](http://www.amazon.com/review/create-review/ref=cm_cr_dp_wrt_summary?ie=UTF8&asin=B00UI2QHQG&channel=detail-glance&nodeID=133140011&store=digital-text)？\n\
    \n这些反馈对我非常有帮助，并将帮助我继续编写更多编程指南。如果你喜欢这本书或有任何改进建议，请告诉我。我将深胜感激 :)\n\n最后但同样重要的是，记住你可以在\
    \ [`www.learncodingfast.com/css`](http://www.learncodingfast.com/css) 下载项目和练习的源代码。\n\
    \n你也可以通过 jamie@learncodingfast.com 联系我。\n\n## 录录：练习源代码\n\n### 练习 3.1\n\n```html\n\
