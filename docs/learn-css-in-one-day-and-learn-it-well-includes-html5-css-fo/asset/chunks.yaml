    \n# Chapter 9: Lists, Links and Navigation Bars\n\nIn this chapter, we’ll be looking\
    \ at CSS properties for styling hyperlinks and lists. In addition, we’ll combine\
    \ both concepts and discuss how to create navigation bars commonly seen on web\
    \ pages. Ready? Let’s first start with CSS list.\n\n### CSS Lists\n\nRecall that\
    \ in HTML, we can create two different types of list: ordered list and unordered\
    \ list? We can style these lists using CSS list properties.\n\n#### list-style-type\n\
    \nThe `list-style-type` property allows you to set list item markers for your\
    \ lists. List item markers refer to those bullets/numbers/letters on the left\
    \ of each list item.\n\nFor ordered lists, we can specify the type of numbers\
    \ or letters we want to use as markers. For instance, if we want to use roman\
    \ numbers (e.g. i, ii, iii) as item markers, we can write `list-style-type: lower-roman;`.\n\
    \nOther commonly used markers include:\n\n`decimal` (this is the default),\n`decimal-leading-zero`\
    \ (number with a leading zero, e.g. 01, 02..),\n`lower-alpha` (e.g. a, b, c..),\n\
    `lower-greek` (e.g. α, β, γ..),\n`upper-alpha` (e.g. A, B, C..) and\n`upper-roman`\
    \ (e.g. I, II, III…).\n\nFor unordered list, you can specify the shape that you\
    \ want to use as the bullet. The default marker is a `disc` (a filled circle).\
    \ You can change that to either a `square` or a `circle`.\n\nIn addition, you\
    \ can also choose not to use any item marker for your list. To do that, you write\
    \ `list-style-type: none;`. This is commonly done when creating navigation bars.\n\
    \nExamples:\n\n`list-style-type: lower-roman;`\n`list-style-type: circle;`\n`list-style-type:\
    \ none;`\n\n#### list-style-image\n\nIf you do not fancy any of the provided list\
    \ styles, you can choose to use an image as the list item marker. To do that,\
    \ you use the `list-style-image` property to specify the url of the image to use.\n\
    \nExamples:\n\n`list-style-image: url(‘myMarker.gif’);`\n\n#### list-style-position\n\
    \nThe `list-style-position` property is used to specify whether the list item\
    \ markers should appear inside or outside the content flow. There are two acceptable\
    \ values: `inside` and `outside`.\n\nBy default, list items are displayed with\
    \ a certain amount of indentation. If `list-style-position` is set to `inside`,\
    \ the list item markers are displayed after the indentation. The indentation is\
    \ represented by the left edge of the boxes in the image below. If `list-style-position`\
    \ is set to `outside`, the markers are displayed before the indentation. ![](images/00004.jpg)\n\
    \nIn other words, `list-style-position: inside` will result in more indentation\
    \ than `list-style-position: outside`. The default position is `outside`.\n\n\
    Examples:\n\n`list-style-position: outside;`\n\n#### list-style\n\n`list-style`\
    \ is a shorthand property for setting all the list properties (i.e. `list-style-type`,\
    \ `list-style-position` and `list-style-image`) in one declaration. If any value\
    \ is missing, the default value for the missing property will be used.\n\nExamples:\n\
    \n`list-style: square inside url(\"myMarker.gif\");`\n\n### CSS Links\n\nHyperlinks\
    \ can be styled using any of the CSS properties discussed in previous chapters.\
    \ You can style the background color using the `background-color` property. This\
    \ will give the link a highlighted appearance. You can also use the text and font\
    \ properties covered in Chapter 8 to change the font size, font style, text color,\
    \ text decoration etc.\n\nIn addition, we can choose to style hyperlinks based\
    \ on the state. Links can be in four states:\n\n`link` (an unvisited link)\n`visited`\
    \ (a visited link)\n`hover` (when user mouses over it)\n`active` (when the link\
    \ is clicked)\n\nTo specify the state, we use the following pseudo-classes:\n\n\
    ```\na:link\na:visited\na:hover\na:active\n```\n\nExamples:\n\n```css\na:link\
    \ { color: blue; }\na:visited { color: purple; }\na:hover { color: red; }\na:active\
    \ { color: yellow; }\n```\n\n### Navigation Bars\n\nNavigation bars are commonly\
    \ created as an unordered list. Let’s try our own menu.\n\n```html\n<ul>\n  <li><a\
    \ href=\"home.html\">Home</a></li>\n  <li><a href=\"html.html\">HTML Tutorial</a></li>\n\
    \  <li><a href=\"csstutorial.html\">CSS Tutorial</a></li>\n</ul>\n```\n\nNext,\
    \ we need to style the list. We want to remove the bullet from the list using\
    \ CSS.\n\n```css\nul {\n  list-style-type: none;\n}\n```\n\nNow, we have to style\
    \ the hyperlinks. We’ll use block display for the links.\n\n```css\na {\n  display:\
    \ block;\n  width: 160px;\n  text-align: center;\n  text-decoration: none;\n \
    \ background-color: #00FF00;\n}\n```\n\nFinally, if we want the navigation bar\
    \ to be horizontal, we need to float the list items left.\n\n```css\nli {\n  float:\
    \ left;\n}\n```\n\nThere you go! We’ve just created a simple horizontal navigation\
    \ bar. The source code for this navigation bar is given as part of the exercise\
    \ for this chapter. Play around it and try to make it more visually appealing.\
    \ You can specify specify styles for the four link states.\n\n## Exercise 9\n\n\
    Download the source code for this exercise from [http://learningfast.com/css](http://learningfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in the Chapter\
    \ 9 - Lists and Navigation Bars folder.\n\n### Exercise 9.1\n\n1. Open the file\
    \ Chapter 9 - List and Links.html concurrently in your browser and text editor.\n\
    2. Modify the CSS declaration for `ol` and observe what happens to the 'Cars Ordered\
    \ List'. Try each of the following:\n   (a) `list-style-type: decimal-leading-zero;`\n\
    \   (b) `list-style-type: lower-roman;`\n   (c) `list-style-type: upper-roman;`\n\
    \   (d) `list-style-type: upper-alpha;`\n   (e) `list-style-type: lower-alpha;`\n\
    \   (f) `list-style-type: lower-greek;`\n   (g) `list-style-type: none;`\n3. Modify\
    \ the CSS declaration for `ul` and observe what happens to the 'Cars Unordered\
    \ List'. Try each of the following:\n   (a) `list-style-type: circle;`\n   (b)\
    \ `list-style-type: square;`\n   (c) `list-style-type: none;`\n   (d) `list-style-type:\
    \ disc;`\n4. Add the following rule to the CSS declaration for `ul`:\n   ```css\n\
    \   list-style-position: outside;\n   ```\n"
  raw: "> 7. Modify the CSS property `text-align` and observe what happens to the\
    \ sample text. By default, the text in this paragraph is left aligned. Now try\
    \ each of the following:\n\n> \n\n> (a) `text-align: justify;`\n\n> (b) `text-align:\
    \ right;`\n\n> (c) `text-align: center;`\n\n> 8. Modify the CSS property `text-decoration`\
    \ and observe what happens to the sample text. Try\n\n> \n\n> (a) `text-decoration:\
    \ underline;`\n\n> (b) `text-decoration: overline;`\n\n> (c) `text-decoration:\
    \ line-through;`\n\n> 9. Modify the CSS property `letter-spacing` and observe\
    \ what happens to the sample text. Try\n\n> \n\n> (a) `letter-spacing: 5px;`\n\
    \n> (b) `letter-spacing: -5px;`\n\n> 10. Change `letter-spacing` back to `0px`.\
    \ Modify the CSS property `word-spacing` and observe what happens to the sample\
    \ text. Try\n\n> \n\n> (a) `word-spacing: 10px;`\n\n> (b) `word-spacing: -20px;`\n\
    \n> 11. Change `word-spacing` back to `0px`. Modify the CSS property `line-height`\
    \ and observe what happens to the sample text. Try\n\n> \n\n> (a) `line-height:\
    \ 2;`\n\n> (b) `line-height: 25px;`\n\n> (c) `line-height: 30%;`\n\nChapter 9:\
    \ Lists, Links and Navigation Bars\n\nIn this chapter, we’ll be looking at CSS\
    \ properties for styling hyperlinks and lists. In addition, we’ll combine both\
    \ concepts and discuss how to create navigation bars commonly seen on web pages.\
    \ Ready? Let’s first start with CSS list.\n\nCSS Lists\n\nRecall that in HTML,\
    \ we can create two different types of list: ordered list and unordered list?\
    \ We can style these lists using CSS list properties.\n\nlist-style-type\n\nThe\
    \ `list-style-type` property allows you to set list item markers for your lists.\
    \ List item markers refer to those bullets/numbers/letters on the left of each\
    \ list item.\n\nFor ordered lists, we can specify the type of numbers or letters\
    \ we want to use as markers. For instance, if we want to use roman numbers (e.g.\
    \ i, ii, iii) as item markers, we can write `list-style-type: lower-roman;`.\n\
    \nOther commonly used markers include:\n\n`decimal` (this is the default),\n\n\
    `decimal-leading-zero` (number with a leading zero, e.g. 01, 02..),\n\n`lower-alpha`\
    \ (e.g. a, b, c..),\n\n`lower-greek` (e.g. α, β, γ..),\n\n`upper-alpha` (e.g.\
    \ A, B, C..) and\n\n`upper-roman` (e.g. I, II, III…).\n\nFor unordered list, you\
    \ can specify the shape that you want to use as the bullet. The default marker\
    \ is a `disc` (a filled circle). You can change that to either a `square` or a\
    \ `circle`.\n\nIn addition, you can also choose not to use any item marker for\
    \ your list. To do that, you write `list-style-type: none;`. This is commonly\
    \ done when creating navigation bars.\n\nExamples:\n\n`list-style-type: lower-roman;`\n\
    \n`list-style-type: circle;`\n\n`list-style-type: none;`\n\nlist-style-image\n\
    \nIf you do not fancy any of the provided list styles, you can choose to use an\
    \ image as the list item marker. To do that, you use the `list-style-image` property\
    \ to specify the url of the image to use.\n\nExamples:\n\n`list-style-image: url(‘myMarker.gif’);`\n\
    \nlist-style-position\n\nThe `list-style-position` property is used to specify\
    \ whether the list item markers should appear inside or outside the content flow.\
    \ There are two acceptable values: `inside` and `outside`.\n\nBy default, list\
    \ items are displayed with a certain amount of indentation. If `list-style-position`\
    \ is set to `inside`, the list item markers are displayed after the indentation.\
    \ The indentation is represented by the left edge of the boxes in the image below.\
    \ If `list-style-position` is set to `outside`, the markers are displayed before\
    \ the indentation. ![](images/00004.jpg)\n\nIn other words, `list-style-position:\
    \ inside` will result in more indentation than `list-style-position: outside`.\
    \ The default position is `outside`.\n\nExamples:\n\n`list-style-position: outside;`\n\
    \nlist-style\n\n`list-style` is a shorthand property for setting all the list\
    \ properties (i.e. `list-style-type`, `list-style-position` and `list-style-image`)\
    \ in one declaration. If any value is missing, the default value for the missing\
    \ property will be used.\n\nExamples:\n\n`list-style: square inside url(\"myMarker.gif\"\
    );`\n\nCSS Links\n\nHyperlinks can be styled using any of the CSS properties discussed\
    \ in previous chapters. You can style the background color using the `background-color`\
    \ property. This will give the link a highlighted appearance. You can also use\
    \ the text and font properties covered in Chapter 8 to change the font size, font\
    \ style, text color, text decoration etc.\n\nIn addition, we can choose to style\
    \ hyperlinks based on the state they are in. Links can be in one of four states:\n\
    \n`link` (an unvisited link)\n\n`visited` (a visited link)\n\n`hover` (when the\
    \ user mouses over it), or\n\n`active` (when the link is clicked).\n\nTo specify\
    \ the state, we write `a:link`, `a:visited`, `a:hover` or `a:active`. You should\
    \ always specify the 4 states in the order above.\n\nExamples:\n\n`a {`\n\n`      \
    \ text-decoration: none;`\n\n`}`\n\n`a:link {`\n\n`color: #0000FF;`\n\n`}`\n\n\
    `a:visited {`\n\n`       color: #00FF00;`\n\n`}`\n\n`a:hover {`\n\n`       color:\
    \ #FFFF00;`\n\n`}`\n\n`a:active {`\n\n`color: #FF00FF;`\n\n`}`\n\nNavigation Bars\n\
    \nNavigation bars are commonly created as an unordered list in HTML and styled\
    \ using list and link properties in CSS.\n\nLet’s try creating our own navigation\
    \ bar. First, we need to create an unordered list of items for our menu and make\
    \ the list items clickable (as hyperlinks).\n\n`<ul>`\n\n`<li><a href=”home.html”>Home</a></li>`\n\
    \n`<li><a href=”htmltutorial.html”>HTML Tutorial</a></li>`\n\n`<li><a href=”csstutorial.html”>CSS\
    \ Tutorial</a></li>`\n\n`<li><a href=”javascripttutorial.html”>Javascript Tutorial</a></li>`\n\
    \n`</ul>`\n\nNext, let’s add the following declaration to our CSS style to remove\
    \ the default bullet from the list.\n\n`ul {`\n\n`       list-style-type: none;`\n\
    \n`}`\n\nNow, we have to style the hyperlinks. We’ll use a block display which\
    \ allows us to specify the width of the links. In addition, we’ll center align\
    \ the text and remove all underlines. We’ll also add a background color to our\
    \ links.\n\n`a {`\n\n`display: block;`\n\n`width: 160px;`\n\n`text-align: center;`\n\
    \n`text-decoration: none;`\n\n`background-color: #00FF00;`\n\n`}`\n\nFinally,\
    \ if we want the navigation bar to be a horizontal bar, we need to float the list\
    \ items left. Otherwise, the list items will be displayed as a vertical bar.\n\
    \n`li {`\n\n`       float: left;`\n\n`}`\n\nThere you go! We’ve just created a\
    \ simple horizontal navigation bar. The source code for this navigation bar is\
    \ given as part of the exercise for this chapter. Play around with it and try\
    \ to make it more visually appealing. You can also specify different styles for\
    \ the four different link states.\n\nThis method is just one of the methods to\
    \ create a navigation bar. The accompanying project for this book will demonstrate\
    \ a different method.\n\nExercise 9\n\nDownload the source code for this exercise\
    \ from [http://learncodingfast.com/css](http://learncodingfast.com/css) and unzip\
    \ the file. The source code for this exercise can be found in the Chapter 9 -\
    \ Lists, Links and Navigation Bars folder.\n\nExercise 9.1\n\n> 1. Open the file\
    \ Chapter 9 - List and Links.html concurrently in your browser and text editor.\n\
    \n> 2. Modify the CSS declaration for `ol` and observe what happens to the 'Cars\
    \ Ordered List'. Try each of the following:\n\n> \n\n> (a) `list-style-type: decimal-leading-zero;`\n\
    \n> (b) `list-style-type: lower-roman;`\n\n> (c) `list-style-type: upper-roman;`\n\
    \n> (d) `list-style-type: upper-alpha;`\n\n> (e) `list-style-type: lower-alpha;`\n\
    \n> (f) `list-style-type: lower-greek;`\n\n> (g) `list-style-type: none;`\n\n\
    > 3. Modify the CSS declaration for `ul` and observe what happens to the 'Cars\
    \ Unordered List'. Try each of the following:\n\n> \n\n> (a) `list-style-type:\
    \ circle;`\n\n> (b) `list-style-type: square;`\n\n> (c) `list-style-type: none;`\n\
    \n> (d) `list-style-type: disc;`\n\n> 4. Add the following rule to the CSS declaration\
    \ for `ul`:\n\n> \n\n> `list-style-position: outside;`\n\n> "
