  trans: "\n一个元素可以拥有多个类（classes）。在 HTML 属性中，多个类之间用空格分隔。例如，下方的 `div` 有两个类：`myclass1`\
    \ 和 `myclass2`。\n\n```html\n<div class=\"myclass1 myclass2\">\n…\n</div\n```\n\
    \n如果我们有以下 CSS 代码：\n\n```css\n.myclass1 { … }\n.myclass2 { … }\n```\n\n那么 `myclass1`\
    \ 和 `myclass2` 的规则都将应用于上述 `<<div>>`。\n\n# 更多选择器\n\n除了通过 `id` 和 `class` 选择元素外，CSS\
    \ 还提供了许多方法来指定我们想要选择的元素。\n\n## 选择多个元素\n\n例如，我们可以一次性选择多个元素。如果我们想选择 `<div>`、`<p>`\
    \ 和 `<ul>` 元素，我们写：\n\n```css\ndiv, p, ul { … }\n```\n\n## 选择子元素\n\n如果我们想选择 `<div>`\
    \ 元素内部所有的 `<p>` 元素，我们写：\n\n```css\ndiv p { … }\n```\n\n注意 `div` 和 `p` 之间没有逗号。在这种情况下，CSS\
    \ 规则将仅适用于 `<div>` 元素内部的 `<p>` 元素。例如，如果我们有下面的 HTML 结构，规则将适用于“I am a paragraph inside\
    \ div”，而不会适用于“I am a stand-alone paragraph”。\n\n```html\n<div>\n    <p>I am a\
    \ paragraph inside div</p>\n</div>\n<p>I am a stand-alone paragraph</p>\n```\n\
    \n第一个段落“I am a paragraph inside div”被称为 `<div>` 标签的子元素（child element），因为它的起始标签和结束标签（`<p>`\
    \ 和 `</p>`）完全位于 `<div>...</div>` 标签之内。\n\n## 根据属性选择\n\n你也可以根据元素的属性选择元素。如果你想选择所有链接到\
    \ `http://www.learncodingfast.com/` 的超链接，你写：\n\n```css\na[href=\"http://www.learncodingfast.com/\"\
    ] { … }\n```\n\n方括号之前不应该有空格。如果你有以下 HTML 代码，只有第一个链接会被选中。\n\n```html\n<a href=\"\
    http://www.learncodingfast.com/\">Learn Coding Fast</a>\n<a href=\"http://www.google.com/\"\
    >Google</a>\n```\n\n## 选择伪类\n\n另一个常用的选择器是伪类选择器（pseudo-class selector）。伪类指的是元素的一种特殊状态。最常见的伪类是针对\
    \ `<a>...</a>` 元素的伪类。超链接可以处于四种状态之一：\n\n- `link`（未访问的链接）\n- `visited`（已访问的链接）\n\
    - `hover`（当用户将鼠标悬停在上面时），或\n- `active`（当链接被点击时）。\n\n我们可以根据超链接所处的状态来选择它。例如，要选择悬停状态，我们写：\n\
    \n```css\na:hover { … }\n```\n\n关键字 `hover` 通过冒号（`:`）加在 `a` 选择器的后面，冒号前后均不有空格。我们将在第\
    \ 9 章中回到选择超链接不同状态的概念。\n\n## 选择子元素\n\n除了选择超链接的不同状态外，我们还可以使用伪类来选择子元素。假设我们有一个带有三个\
    \ `<p>` 子元素的 `<div>` 元素：\n\n```html\n<div>\n    <p>I am the first child</p>\n\
    \    <p>I am the second child</p>\n    <p>I am the third child</p>\n</div>\n```\n\
    \n我们可以使用 `first-child` 伪类来选择第一个 `<p>` 元素。还可以使用 `last-child` 选择器选择最后一个子元素，或使用 `nth-child(n)`\
    \ 选择器选择第 n 个子元素。例如，如果我们写：\n\n```css\np:nth-child(2) { … }\n```\n\n我们将选择段落“I am\
    \ the second child”。\n\n## 选择伪元素\n\n除了伪类，CSS 还有伪元素（pseudo-elements）的概念。伪元素指的是元素的指定部分，例如第一个字母或第一行。例如，如果我们有下文所示的\
    \ `<p>` 元素：\n\n```html\n<p>This is some text.</p>\n```\n\n我们可以通过写以下代码来选择第一个字母：\n\
    \n```css\np::first-letter { … }\n```\n\n注意在这种情况下使用了双冒号（`::`）。另一个伪元素是 `first-line`\
    \ 元素。它将选择文本的第一行。最后，我们可以使用 `before` 和 `after` 伪元素在元素的内容之前或之后插入内容。例如，如果我们想在所有 `<h1>`\
    \ 元素之后添加一个感叹号，我们可以写：\n\n```css\nh1::after {\n    content: \"!\";\n}\n```\n\n这将在会在所有\
    \ `<h1>` 元素之后追加一个感叹号。如果我们有以下 HTML：\n\n```html\n<h1>This is a heading</h1>\n```\n\
    \n## 不区分大小写\n\n在大多数情况下，CSS 选择器和规则是不区分大小写的。因此，你可以写成：\n\n```css\ndiv { color: green;\
    \ }\n```\n\n或者\n\n```css\nDIV { color: green; }\n```\n\n两者的效果一样好。这种不区分大小写的唯一例外是在选择类名和\
    \ id 的时候。如果我们有：\n\n```html\n<div id=\"myID\">Some text</div>\n```\n\n`div#myID`\
    \ 将选中上述元素，而 `div#MYID` 则不会。\n\n# 优先级\n\n现在我们已经学会了如何选择元素，让我们进入 CSS 中一个非常重要的概念：优先级（order\
    \ of precedence）。正如之前提到的，我们可以通过三种不同的方式将 CSS 代码应用到网站中。程序员使用一种一种方式来应用 CSS 代码是很常见的。例如，一个网站可能在外部文件中定义了\
    \ CSS 规则，并在其 `<style>...</style>` 标签中嵌入了一些额外的 CSS 规则。这可能导致多个规则应用于同一个元素。在使用 CSS\
    \ 时最令人沮丧的体验（尤其是当你刚开始时）是你尝试对一个元素应用 CSS 样式，但页面似乎完全忽略了你的规则。大多数情况下，这是由于优先级导致的。具体来说，当多个规则应用于同一个元素，且另一个规则的优先级高于你指定的规则时就会发生这种情况。\n\
    \n三个原则控制着哪个 CSS 规则具有更高的优先级。\n\n### 原则一：选择器越具体，优先级越高\n\n我们不会详细介绍如何计算选择器的特殊性（specificity）。要记住的核心点是：`id`\
    \ 比 `class` 更具体，而 `class` 比元素更具体。考虑下面的代码：\n\n```css\ndiv { font-size: 10px; }\n\
    #myId { font-size: 12px; }\n.myClass { font-size: 14px; }\n<div id=\"myId\" class=\"\
    myClass\">Some text</div>\n```\n\n由于 `<div>` 元素拥有 `class=\"myClass\"` 和 `id=\"\
    myId\"`，所有三个规则 `div`、`#myId` 和 `.myClass` 都适用于该元素。然而，由于 `id` 优先级最高，“Some text”的字体大小将为\
    \ 12px。\n\n此外，关于特殊性的另一个点是：选择器越详细，优先级越高。例如，`div#myId` 的优先级高于 `#myId`。这是因为 `div#myId`\
    \ 更详细，因为它告诉我们 `myId` 是 `div` 元素的 `id`。在下面的示例代码中，将应用黄色。\n\n```css\ndiv { color:\
    \ red; }\ndiv#myId { color: yellow; }\n#myId { color: blue; }\n.myClass { color:\
    \ green; }\n<div id=\"myId\" class=\"myClass\">Some text</div>\n```\n\n### 原则二：如果没有指定样式，元素将从父容器继承样式\n\
    \n子元素是位于另一个元素起始和结束标签内的元素。例如，在下面的代码中，`<p>` 是 `<body>`元素的子元素。由于`<p>` 没有定义字体大小，它将从定义了该属性的\
    \ `<body>` 元素处继承该属性。\n\n```css\nbody {\n    font-size: 1.5em;\n}\n<body>\n   \
    \ <p>Some text</p>\n</body>\n```\n\n如果 `<body>` 元素也没有定义 `font-size` 属性，则将使用浏览器的默认字体大小。\n\
    \n### 原则三：在其他条件相等的情况下，最后声明的规则胜出\n\n假设你在 HTML 的 `<head>` 元素中有以下 CSS 声明：\n\n```html\n\
    <head>\n<style>\n    p { font-size: 20px; }\n</style>\n</head>\n```\n"
- fmt: "\nFurther down the HTML document, you have the following HTML code, with an\
    \ inline CSS rule:\n\n```html\n<p style=\"font-size: 30px;\">>Some text</p>\n\
    ```\n\nWhich rule do you think will be applied to the words “Some text”?\n\nThe\
    \ correct answer is the inline rule. This is because all things being equal, the\
    \ rule that is declared last has the highest precedence. Since inline CSS is declared\
    \ within the HTML code, it is declared later than the embedded CSS which is declared\
    \ in the `head` section. Hence, a font size of `30px` will be applied.\n\n## Display\
    \ Inconsistency\n\nAnother issue to deal with when working with CSS is the problem\
    \ of display inconsistency across browsers. You may find that your website looks\
    \ slightly (or drastically) different in different browsers. Most display issues\
    \ tend to occur in older versions of Internet Explorer, although issues can occur\
    \ in other browsers too (especially mobile browsers).\n\nDisplay inconsistencies\
    \ occur because different browsers use different layout engines to interpret the\
    \ site’s CSS code. For instance, `Safari` and `Chrome` use the `WebKit` engine\
    \ while `Firefox` uses the `Gecko` engine. One engine may calculate and display\
    \ a page differently from another engine. For instance, `Trident`, the engine\
    \ used by `Internet Explorer`, automatically widens a page’s pixel width for certain\
    \ page designs. This can lead to the sidebar being pushed to the bottom due to\
    \ insufficient width.\n\nAnother problem causing display inconsistency is the\
    \ lack of universal support for some CSS properties. Some properties are not supported\
    \ by all browsers. You can go to the site [http://www.caniuse.com](http://www.caniuse.com/)\
    \ to check if a certain CSS property is supported by the browser that you are\
    \ developing for.\n\nSometimes, a certain CSS property is supported by a particular\
    \ browser only when we add a prefix to our CSS rules. This is especially true\
    \ for newer properties in `CSS3`. An example is the `column-count` property in\
    \ `CSS3`. This property divides an element into multiple columns. For instance,\
    \ we can divide a `div` element into three columns by writing `column-count: 3`.\n\
    \nThis property is not supported by older versions of `Firefox`, `Chrome`, `Safari`\
    \ and `Opera`. To enable the property to work on these browsers, you have to write\
    \ it as three declarations:\n\n```css\n-webkit-column-count: 3;\n-moz-column-count:\
    \ 3;\ncolumn-count: 3;\n```\n\ninstead of just\n\n```css\ncolumn-count: 3;\n```\n\
    \nThe `-webkit-` prefix adds support for older versions of `Chrome`, `Safari`\
    \ and `Opera` while the `-moz-` prefix adds support for `Firefox`. In addition,\
    \ we also have the `-ms-` prefix that adds support for `Internet Explorer`.\n\n\
    When creating your website, it is useful to test it on various browsers to ensure\
    \ that nothing is broken. The way to fix a ‘broken’ display depends on the issue\
    \ causing it. If you are really stuck, I suggest searching or posting the question\
    \ on [http://stackoverflow.com](http://stackoverflow.com/), which is a very useful\
    \ online community for programmers.\n\n## Comments\n\nThe last thing to cover\
    \ in this chapter is comments. In CSS, we add comments to our code using the `/*...*/`\
    \ symbols. An example is as follows:\n\n```css\n/*\nThe rules below are comments.\n\
    p {\n    background-color: black;\n    font-size: 20px;\n    color: white;\n}\n\
    */\n```\n\nEverything between `/*` and `*/` is ignored by the browser.\n\n## Exercise\
    \ 3\n\nDownload the source code for this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in `Chapter\
    \ 3 - Basics of CSS`.\n\n### Exercise 3.1\n\n1. Open the file `Chapter 3 - Basics\
    \ of CSS.html` in your browser and text editor.\n2. First, look for the following\
    \ lines in source editor:\n```css\np {\n    background-color: yellow;\n}\n```\n\
    This selects all `<p>` elements and sets their background colors to yellow. The\
    \ line 'This is some text in the div.' is not selected because it is not within\
    \ any `<p>` tags.\n3. Now let’s try changing the rule from\n```css\np {\n    background-color:\
    \ yellow;\n}\n```\nto\n```css\nP {\n    Background-colo: YELLOW;\n}\n```\nSave\
    \ the file in text editor and refresh your browser. Notice that nothing changes?\
    \ This is because CSS is not case-sensitive in most cases.\n4. Now let us try\
    \ to select different HTML elements and observe which elements end up with yellow\
    \ background. For each item, simply change the selector on line 6 in the HTML\
    \ file to the required selector.\nFirst, let’s select the element with `class\
    \ = \"myClassPara\"`. To do that, change the `p` selector in the CSS rule to `.myClassPara`.\
    \ Save the file and refresh the browser. Notice which paragraph is selected.\n\
    5. Now change the selector to `.myclasspara`. Notice that nothing is selected?\
    \ That is because CSS is case-sensitive when selecting classes and ids.\n6. Next,\
    \ let's select the element with `id = \"myIDPara\"`. Try doing yourself. Got it?\
    \ You can change `.myClassPara` to either `p#myIDPara` or just `#myIDPara`. Notice\
    \ which paragraph is selected. Try changing `#myIDPara` to `#MYIDPARA`. Notice\
    \ that nothing is selected?\n7. Next, let’s learn how to select more than one\
    \ elements. Try selecting both the `h1` and `h2` elements. The way to do it is\
    \ simply to change the selector to `h1, h2`.\n8. Next try selecting the `div`\
    \ element. To do it, simply change the selector to `div`.\n9. Now, let's select\
    \ the `p` element inside the `div` element. To do this, we write `div p` as the\
    \ selector. Notice which elements are selected.\n10. Next, try selecting all the\
    \ link (`<a>`) elements. What do you notice? The links are now highlighted in\
    \ yellow right?\n11. Next, we’ll narrow down our selection based on HTML attributes.\
    \ Try selecting the link with `href=\"http://www.learncodingfast.com\"`. The correct\
    \ way to do this is with square brackets as follows:\n```css\na[href=\"http://www.learncodingfast.com\"\
    ]\n```\nTry it. Only the first link will have a yellow background now.\n12. Next,\
    \ we’ll use the pseudo-class selector to change the background color of all link\
    \ elements when we hover over them. Try changing\n```css\na[href=\"http://www.learncodingfast.com\"\
    ]\n```\nto\n```css\na:hover\n```\nSave the file and refresh the browser. Notice\
    \ that nothing is selected? Now hover your mouse over any of the hyperlinks and\
    \ observe what happens.\n13. Next, let’s try to select the second child element\
    \ of the `div` element. You do that by changing the selector to\n```css\np:nth-child(2)\n\
    ```\n14. Now, let’s try selecting the first letter of all `<p>` elements. You\
    \ use the pseudo-element `first-letter` to do that. Change the selector to\n```css\n\
    p::first-letter\n```\n15. Next, let’s look at what happens when an element has\
    \ more than one classes. Change the selector back to `.myClassPara` and add the\
    \ following CSS code just before the `</style>` tag:\n```css\n.mySecondClassPara\
    \ {\n    text-decoration: underline;\n}\n```\nNotice which paragraph is both yellow\
    \ in background AND underlined. This is because that paragraph has two classes:\
    \ `myClassPara` and `mySecondClassPara`. Therefore, both rules apply to it.\n\
    16. Finally, let’s try adding an exclamation mark to the end of all `<p>` elements.\
    \ We’ll use the `after` pseudo-element to do that. Add the following CSS code\
    \ just before the `</style>` tag:\n```css\np::after{\n    content: \"!\";\n}\n\
    ```\n\n## Chapter 4: CSS Box Model\n\nSo far, we’ve covered the basics of HTML\
    \ and CSS. In this chapter, we’ll start to do some actual CSS coding. Specifically,\
    \ we’ll learn about the CSS box model and look at how we can modify the look and\
    \ feel of a box in CSS.\n\n### What is the CSS Box Model\n\nAll elements in CSS\
    \ are treated as boxes. CSS boxes consist of margins, borders, padding, and the\
    \ actual content as shown below.\n"
