  (b) `text-decoration: overline;`\n(c) `text-decoration: line-through;`\n\n## 9.\
  \ 修改 CSS 属性 `letter-spacing` 并观察示例文本的变化。尝试：\n\n(a) `letter-spacing: 5px;`\n(b) `letter-spacing:\
  \ -5px;`\n\n## 10. 将 `letter-spacing` 改回 `0px`。修改 CSS 属性 `word-spacing` 并观察示例文本的变化。尝试：\n\
  \n(a) `word-spacing: 10px;`\n(b) `word-spacing: -20px;`\n\n## 11. 将 `word-spacing`\
  \ 改回 `0px`。修改 CSS 属性 `line-height` 并观察示例文本的变化。尝试：\n\n(a) `line-height: 2;`\n(b)\
  \ `line-height: 25px;`\n(c) `line-height: 30%;`\n\n## 第 9 章：列表、链接与导航栏\n\n在本章中，我们将学习用于设置超链接和列表样式的\
  \ CSS 属性。此外，我们将结合这两个概念，讨论如何创建网页上常见的导航栏。准备好了吗？让我们先从 CSS 列表开始。\n\n## CSS 列表\n\n回想一下在\
  \ HTML 中我们可以创建两种类型的列表：有序列表和无序列表。我们可以使用 CSS 列表属性对这些列表进行样式设置。\n\n### list-style-type\n\
  \n`list-style-type` 属性允许你为列表设置列表项目标记。列表项目标记是指每个列表项目左侧的那些符号/数字/字母。\n\n对于有序列表，我们可以指定想要使用的数字或字母类型作为标记。例如，如果我们想使用罗马数字（如\
  \ i, ii, iii）作为项目标记，可以编写 `list-style-type: lower-roman;`。\n\n其他常用的标记还包括：\n\n`decimal`（这是默认值），\n\
  `decimal-leading-zero`（带有前零的数字，例如 01, 02..），\n`lower-alpha`（例如 a, b, c..），\n`lower-greek`（例如\
  \ α, β, γ..），\n`upper-alpha`（例如 A, B, C..）以及\n`upper-roman`（例如 I, II, III…）。\n\n\
  对于无序列表，你可以指定想要作为项目符号的形状。默认标记是 `disc`（实心圆）。你可以将其改为 `square`（正方形）或 `circle`（圆形）。\n\
  \n此外，你也可以选择不为列表使用任何项目标记。要这样做，你需要编写 `list-style-type: none;`。这在创建导航栏时非常常见。\n\n示例：\n\
  \n`list-style-type: lower-roman;`\n`list-style-type: circle;`\n`list-style-type:\
  \ none;`\n\n### list-style-image\n\n如果你不喜欢提供的任何列表样式，可以选择使用图像作为列表项目标记。要这样做，你可以使用\
  \ `list-style-image` 属性来指定使用的图像 URL。\n\n示例：\n\n`list-style-image: url(‘myMarker.gif’);`\n\
  \n### list-style-position\n\n`list-style-position` 属性用于指定列表项目标记应该出现在内容流的内部还是外部。有两个接受的值：`inside`\
  \ 和 `outside`。\n\n默认情况下，列表项目带有一定的缩进显示。如果 `list-style-position` 设置为 `inside`，则列表项目标记将在缩进之后。缩进由下方图中框的左边缘表示。如果\
  \ `list-style-position` 设置为 `outside`，则标记将在缩进之前显示![](img/00004.jpg)\n\n换句话说，`list-style-position:\
  \ inside` 产生的缩进比 `list-style-position: outside` 更多。默认位置是 `outside`。\n\n示例：\n\n`list-style-position:\
  \ outside;`\n\n### list-style\n\n`list-style` 是一个简写属性，用于在一个声明中设置所有的列表属性（即 `list-style-type`、`list-style-position`\
  \ 和 `list-style-image`）。如果缺少任何值，将使用该缺失属性的默认值。\n\n示例：\n\n`list-style: square inside\
  \ url(\"myMarker.gif\");`\n\n## CSS 链接\n\n可以使用之前章节讨论过的任何 CSS 属性对超链接进行样式设置。你可以使用\
  \ `background-color` 属性设置背景颜色，这将使链接具有高亮外观。你还可以使用第 8 章涵盖的文本和字体属性来更改字体大小、字体样式、文本颜色、文本装饰等。\n\
  \n此外，我们还可以根据状态对超链接进行样式设置。链接有四种状态：\n\n`link`（未访问的链接）\n`visited`（已访问的链接）\n`hover`（用户鼠标悬停在其上方时）\n\
  `active`（链接被点击时）\n\n要指定状态，我们使用以下伪类：\n\n```\na:link\na:visited\na:hover\na:active\n\
  ```\n\n示例：\n\n```css\na:link { color: blue; }\na:visited { color: purple; }\na:hover\
  \ { color: red; }\na:active { color: yellow; }\n```\n\n## 导航栏\n\n导航栏通常作为无序列表创建。让我们尝试制作自己的菜单。\n\
  \n```html\n<ul>\n  <li><a href=\"home.html\">首页 (Home)</a></li>\n  <li><a href=\"\
  html.html\">HTML 教程 (HTML Tutorial)</a></li>\n  <li><a href=\"csstutorial.html\"\
  >CSS 教程 (CSS Tutorial)</a></li>\n</ul>\n```\n\n接下来，我们需要对列表设置样式。我们使用 CSS 移除列表符号。\n\
  \n```css\nul {\n  list-style-type: none;\n}\n```\n\n现在我们必须对链接设置样式。我们将为链接使用块级显示（block\
  \ display）。\n\n```css\na {\n  display: block;\n  width: 160px;\n  text-align: center;\n\
  \  text-decoration: none;\n  background-color: #00FF00;\n}\n```\n\n最后，如果我们希望导航栏水平排列，我们需要让列表项目向左浮动。\n\
  \n```css\nli {\n  float: left;\n}\n```\n\n完成！我们刚刚了一个简单的水平导航栏。此导航栏的代码作为本章练习的一部分给出。你可以尝试调整它并使其看起来更美观。你可以为四种链接状态指定样式。\n\
  \n## 练习 9\n\n从 [`learningfast.com/css`](http://learningfast.com/css) 下载此练习源码并解压文件。练习源码可以在\
  \ Chapter 9 - Lists and Navigation Bars 文件夹找到。\n\n### 练习 9.1\n\n1. 在浏览器和编辑器中同时打开文件\
