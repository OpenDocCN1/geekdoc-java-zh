  \ `width` 属性并将其添加到 `td` 中。观察发生了什么。应该没有区别，因为无论你在 `th` 还是 `td` 级别设置表格单元格的宽度，该宽度都会影响这两个元素。\n\
  \n\n\n\n\n## 7. 分别在第一个、第二个和第三个 `<th>` 开始标签添加 `id=\"firstColumn\"`、`id=\"secondColumn\"\
