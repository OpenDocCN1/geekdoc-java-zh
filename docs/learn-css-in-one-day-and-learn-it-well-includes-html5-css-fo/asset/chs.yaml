  \ `font-weight` 属性并观察文本的变化。尝试：\n   - a) `font-weight: bold;`\n   - b) `font-weight:\
  \ 300;`\n6. 修改 `color` 属性并观察文本的变化。尝试：\n   - a) `color: blue;`\n   - b) `color: #00ff00;`\n\
  \   - c) `color: rgb(255,0,0);`\n\n\n\n\n\n## 7. 修改 CSS 属性 `text-align` 并观察示例文本的变化。默认情况下，此段落的文字是左对齐的。现在尝试以下各项：\n\
  \n(a) `text-align: justify;`\n(b) `text-align: right;`\n(c) `text-align: center;`\n\
