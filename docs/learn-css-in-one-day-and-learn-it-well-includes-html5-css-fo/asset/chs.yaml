  \n## 第 7 章：背景\n\n在本章中，我们将学习如何更改元素的背景属性。这些属性包括更改它的背景颜色和背景图像。\n\n首先，让我们先看看如何更改背景颜色。\n\
  \n## 背景颜色\n\n要声明元素的背景颜色，我们使用 `background-color` 属性。类似于我们指定 CSS 框的边界颜色一样，我们可以使用三种表示法之一声明元素的背景颜色：颜色名称、rgb\
  \ 表示法或十六进制表示法。\n\n示例：\n\n```\nbackground-color: green;\n```\n\n```\nbackground-color:\
  \ rgb(0, 255, 0);\n```\n\n```\nbackground-color: #00FF00;\n```\n\n## 背景图像\n\n如果你觉得仅使用颜色作为元素的背景太单调，你可以选择使用图像。CSS\
  \ 允许我们在图像显示方面具有极大的灵活性。\n\n### background-image\n\n要使用图像作为背景，我们使用 `background-image`\
  \ 属性指定图片的 URL。\n\n示例：\n\n```\nbackground-image: url(“image1.jpg”);\n```\n\n### background-repeat\n\
  \n默认情况下，背景图像位于元素的左上角，并在垂直和水平方向上重复。如果你不希望背景图像重复，可以使用 `background-repeat` 属性进行更改。以下列表显示了\
  \ `background-repeat` 属性的一些常用值：\n\n- `repeat`: 这是默认值。图像将在水平和垂直方向上重复。\n- `repeat-x`:\
  \ 图像仅在水平方向上重复。\n- `repeat-y`: 图像仅在垂直方向上重复。\n- `no-repeat`: 图像不重复。\n\n示例：\n\n```\n\
  background-repeat: repeat-x;\n```\n\n### background-attachment\n\n`background-attachment`\
  \ 属性指定背景图像应该是固定还是随页面滚动。两个常用的值是 `fixed` 和 `scroll`。默认值是 `scroll`。尝试本章末的练习来查看它是如何工作的。\n\
  \n示例：\n\n```\nbackground-attachment: scroll;\n```\n\n### background-position\n\n\
  如果你想指定显示背景图像的哪个区域，`background-position` 属性将非常有用。\n\n假设你有一个宽度和高度均为 100px 的元素。如果你使用的背景图像宽度为\
  \ 200px，高度为 300px，那么只有背景图像的一部分将显示，因为图像大于元素的尺寸。\n\n![](img/00009.jpg)\n\n例如，如果你使用上面的图像（200px\
  \ 比 300px）作为 100px 比 100px 元素的背景图像，默认只会显示区域 A（左上角）。如果你想显示区域 F 呢？要这样做，你需要更改 `background-position`\
  \ 属性的值。\n\n指定 `background-position` 值的最常用方法是使用像素。语法为：\n\n```\nbackground-position:\
  \ xpos ypos;\n```\n\n为了理解这种语法如何工作，让我们想象有一块中心有一个 100px 比 100px 洞的纸板。纸板上的这个洞代表 HTML\
  \ 元素。现在想象你的背景图像在在那块纸板下方。默认情况下，图像将对齐，使得区域 A 通过纸板上的孔显示出来。如果你想显示区域 F，你必须将图像（而不是纸板）向左移动\
  \ 100px 并向上移动 200px。要用 CSS 实现这一点，你这样写道：\n\n```\nbackground-position: -100px -200px;\n\
  ```\n\n第一个数字（`-100px`）水平移动图像。如果这个数字是正数，图像向右移动。如果是负数，它向左移动。\n\n第二个数字（`-200px`）垂直移动图像。如果这个数字是正数，图像向移动移动。如果是负数，它向向上移动。\n\
  \n理解这个概念的最佳方法是尝试本章的练习。我强烈建议你在进入第 8 章之前完成它们。\n\n## 练习 7\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
  \ 下载此练习的源代码并解压文件。此练习的源代码可以在章节中找到。\n\n### 练习 7.1\n\n1. 从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
  \ 下载此练习的源代码并解压文件。此练习的源代码可以在章节中找到。\n2. 在浏览器中打开 `7 - Background.html` 文件。观察 `body`\
  \ 发生了什么。\n3. 在 `body` 中，将 `background-attachment: fixed;` 改为 `background-attachment:\
  \ scroll;`。刷新页面并观察发生了什么。\n4. 在 `body` 中，将 `background-repeat: repeat;` 改为：\n   -\
  \ `repeat-x`\n   - `no-repeat`\n   - `repeat-y`\n   观察每种情况发生了什么。\n5. 在 `body` 中，将\
  \ `background-color: white;` 改为 `background-color: #000FF;`。这将页面背景颜色改为蓝色。\n6. 最后，我们将查看\
  \ `background-position` 属性。示例中的图像是相同文件夹中的 `backgroundposition.png`。在继续之前看一眼。\n7.\
  \ 注意，当 `background-position` 设置为 `0 0`（默认值）时，显示区域 A。更改 `background-position` 属性将相对于区域\
  \ A 移动图像。\n8. 在 `#box1` 的 CSS 声明中，将 `background-position: 0 0;` 改为：\n   - `background-position:\
  \ -100px 0;`\n   - `background-position: 100px 0;`\n   - `background-position: 0\
  \ -100px;`\n   - `background-position: 0 100px;`\n   - `background-position: -100px\
  \ -100px;`\n   尝试弄清楚你会得到哪个区域。\n\n## 第 8 章：文本与字体\n\nCSS 中的文本和字体属性用于格式化网页上单词和文本的外观。`font`\
  \ 属性关注字符的外观，例如是“粗”还是“细”、“大”还是“小”，以及使用什么字体。`text` 属性用于样式化其他其他。在本章中，我们将涵盖常用的 `text`\
  \ 和 `font` 属性。\n\n## 字体属性\n\n### font-family\n\n`font-family` 属性用于设置字体类型。\n\n\n\n\
  \n\n字体类型主要三大类：衬线字体（serif）、无衬线字体（san serif）和等宽字体（monospace）。\n\n衬线字体在某些字符的末端有一个小笔画。示例包括“Times\
  \ New Roman”和 Georgia。\n\n无衬线字体在字符的末端没有笔画。示例包括 Arial 和 Verdana。\n\n等宽字体对所有字符都使用相同的空间。例如，字母‘i’的宽度与字母‘a’相同。等宽宽字体的示例包括“Courier\
  \ New”和“Lucida Console”。\n\n在指定 `font-family` 属性时，你应该始终包含多个字体名称，这样如果浏览器不支持第一个字体，它就会尝试下一个字体，直到找到它支持的字体为止。从更具体的字体（如“Times\
  \ New Roman”）开始，并以一个通用的字体族结束。如果字体名称包含多个单词，应使用引号。\n\n示例：\n\n```\nfont-family: \"\
  Times New Roman\", Times, serif;\n```\n\n## font-size\n\n`font-size` 属性设置文本的大小。字体大小可以使用像素\
  \ (`px`)、em、百分比 (%) 或使用关键字来设置。\n\n### 使用 px\n\n大多数浏览器上使用的默认字体大小是 16 像素。如果你想让网站以不同的字体大小显示，可以这样指定：\n\
  \n```\nfont-size: 20px;\n```\n\n### 使用 em\n\n一个 em 等于当前字体大小。如果该元素是另一个元素的子元素，则当前字体大小是父元素的字体大小。如果该元素不是任何元素的元素，则当前字体大小是浏览器的默认字体大小。如上述，大多数浏览器上使用的默认字体大小是\
  \ 16px。因此，默认情况下 `1em = 16px`。\n\n然而，可以通过更改浏览器设置来更改默认字体大小。例如，要更改 Firefox 默认字体大小，点击菜单按钮（最右侧的三条横线按钮），选择“选项\
  \ (Options)”，最后选择“内容 (Content)”选项卡。然后你可以在“字体与颜色 (Fonts & Colors)”部分更改当前字体大小。\n\n\
  如果用户将默认字体大小设置为 20px，`1em` 变为 20px。如果你想让字体大小变为当前字体大小的 1.5 倍，只需编写 `1.5em`。em 是大多数开发者首选的单位大小，因为默认字体大小可以由用户自定义。\n\
  \n### 使用百分比\n\n百分比与 em 类似。200% 简单意味着当前字体大小的 2 倍。因此，`200% = 2em`。\n\n### 使用关键字\n\n\
  指定字体大小的最后方法是使用关键字。常用的关键字有 `xx-small`、`x-small`、`small`、`medium`（默认值）、`large`、`x-large`\
  \ 和 `xx-large`。\n\n示例：\n\n```\nfont-size: 40px;\nfont-size: 1.5em;\nfont-size: 120%;\n\
  font-size: large;\n```\n\n## font-style\n\n`font-style` 属性用于指定斜体文本。两个常用值为 `normal`\
  \ 和 `italic`。normal 以斜体显示文本，而 italic 以斜体显示文本。\n\n示例：\n\n```\nfont-style: italic;\n\
  ```\n\n## font-weight\n\n`font-weight` 属性是 `font-style` 的对应项。虽然 `font-style` 用于指定斜体文本，但\
  \ `font-weight` 用于指定粗体文本。常用的值包括 `normal`、`bold`、`bolder` 和 `lighter`。或者，你也可以使用 100\
  \ 的倍数的数字指定字符的粗细，从 100（最细）到 900（最粗）。400 是正常粗，700 与 bold 相同。\n\n然而请注意，大多数网页浏览器只支持\
  \ `normal` 和 `bold` 字体权重。在这种情况下，100-500 对应 `normal`，而 600 及以上对应 `bold`。\n\n示例：\n\
  \n```\nfont-weight: bold;\nfont-weight: 300;\n```\n\n## Text Properties\n\nCSS `text`\
  \ 属性允许你设置与文本字体无关的属性。常用属性包括文本颜色、文本对齐、文本装饰、字间距、词间距和行高。\n\n### color\n\nCSS `color`\
  \ 属性指定文本颜色。与我们在第 4 章中学习的 `border-color` 属性类似，文本颜色可以通过三种方式指定：使用颜色名称、RGB 值或十六进制值。\n\
  \n示例：\n\n```\ncolor: blue;\ncolor: #00ff00;\ncolor: rgb(255,0,0);\n```\n\n### text-alignment\n\
  \n`text-alignment` 属性允许我们指定文本是居中、左对齐、右对齐还是两端对齐。常用的值为 `left`、`right`、`center` 和 `justify`。\n\
  \n示例：\n\n```\ntext-align: center;\n```\n\n### text-decoration\n\n`text-decoration`\
  \ 属性主要用于指定文本是否用线条进行装饰。常用的值为 `none`（即：普通文本，无装饰）、`underline`（下划线）、`overline`（文本上方的线）和\
  \ `line-through`（贯穿线）。\n\n此属性通常用于移除链接的下划线。默认情况下，大多数浏览器将以蓝色显示链接并带有下划线。你可以使用代码 `text-decoration:\
  \ none;` 来移除装饰。\n\n示例：\n\n```\ntext-decoration: none;\n```\n\n### letter-spacing\n\
  \n字间距用于增加或减少字符之间的间间距。可以使用像素 (`px`) 或相对单位 `em` 来指定。\n\n示例：\n\n```\nletter-spacing:\
  \ 2px;\n```\n\n### word-spacing\n\n词间距另一方面用于增加或减少单词之间的间距。与 `letter-spacing` 类似，可以使用像素\
  \ (`px`) 或相对单位 `em` 来指定。\n\n示例：\n\n```\nword-spacing: 2px;\n```\n\n### line-height\n\
  \n行高用于设置行之间的间距。可以使用数字、长度或百分比来设置。使用数字时，它是字体大小的倍数。\n\n示例：\n\n```\nline-height: 1.5;\n\
  line-height: 24px;\n```\n\n## Exercise\n\n为了更好地理解每个属性的作用，请尝试下面的练习。\n\n### Exercise\
  \ 8\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css) 下载此练习的源代码。此练习的源代码可以在第\
  \ 8 章中找到。\n\n### Exercise 8.1\n\n1. 同时在浏览器和文本编辑器打开打开 Chapter 8 - Font and Text.html。\n\
  2. 修改 `font-family` 属性并观察文本的变化。当前字体族是无衬线字体。尝试以下各项：\n   - a) `font-family: Verdana,\
  \ Arial, Helvetica, sans-serif;`\n   - b) `font-family: Courier, \"Lucida Console\"\
  , monospace;`\n3. 修改 `font-size` 属性并观察每种情况下示例文本的变化。尝试：\n   - a) `font-size: 40px;`\n\
