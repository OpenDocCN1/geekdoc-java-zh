- "# 一天学会并精通 CSS（包含 HTML5）：带实战项目的 CSS 初学者实用指南。你开始 CSS 编程所需的唯一书籍……（通过实战项目快速开发）（第 2\
  \ 卷）\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n本书的编写目的是帮助你**快速**学习 CSS 并**精通**它。\n\n本书不假设你具备任何编程背景。如果你是一个完全的初学者，你会发现这本书以易于理解的方式解释了复杂的概念。如果你是一个经验丰富的程序员，但刚接触\
  \ CSS，这本书将为你提供足够的深度，让你能够立即开始编写 CSS 代码。\n\n书中的所有示例和图像都经过仔细挑选，以演示每个概念，以便你对该语言有更深入的理解。每个\
  \ CSS 章节末尾都有一个练习题。这些练习旨在帮助你进一步加强理解。所有练习的源代码可以在书末的附录中找到。\n\n此外，正如查德·布兰森（Richard Branson）所说：“学习任何东西最好的方法就是实践”。本书附带了一个额外的奖励项目，引导你从零开始编写一个网页。该项目使用了书中涵盖的概念，并让你有机会看到所有内容是如何整合在一起的。\n\
  \n你可以在此处下载奖励项目和所有练习的源代码：\n\n[`www.learncodingfast.com/css`](http://www.learncodingfast.com/css)。\n\
  \n## 联系信息\n\n我非常期待听到你的反馈。\n\n如有反馈或疑问，你可以通过 jamie@learncodingfast.com 与我联系。\n\n##\
  \ Jamie 的其他书籍\n\n![](img/00012.jpg)\n\n[Python：一天学会并精通 Python](http://mybook.to/Python)\n\
  \n\n\n```\n注意哪个段落既有黄色背景又有下划线。这是因为该段落有两个类：`myClassPara` 和 `mySecondPara`。\n16. 最后，让我们尝试在所有\
  \ `<p>` 元素的结尾添加叹号。使用 `after` 伪元素来实现。在 `</style>` 之前添加以下 CSS 代码：\n```css\np::after{\n\
  \    content: \"!\";\n}\n```\n\n## 第 4 章：CSS Box 模型\n\n到为止，我们涵盖了 HTML 和 CSS 的基础。在本章中，我们将开始编写实际的\
  \ CSS 代码。具体来说，我们将学习 CSS 盒模型（Box Model），并如何修改盒的外观。\n\n### 什么是 CSS 盒模型\n\n在 CSS 中，所有元素都被视为盒子。CSS\
  \ 盒子由外边距、边框、内边距和实际内容组成，如下所示。\n\n\n\n\n![](img/00011.jpg)\n\n粗黑线是边框（border）。边界内部是内边距（padding）和实际内容。边界外部是盒子的外边距（margin）。内边距、边框和外边距的厚度都可以通过\
  \ CSS 修改。为了理解这个盒模型是如何工作的，让我们分析下面的代码。你可以在 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
  \ 下载这段代码。\n\n```html\n<!doctype html>\n<html>\n<head><title>Chapter 4 - CSS Box\
  \ Model</title>\n<style type=\"text/css\">\n#box1 {\nmargin: 20px;\npadding: 10px;\n\
  border: 5px solid black;\nwidth: 100px;\nheight: 100px;\ntext-align: justify;\n\
  float: left;\n}\n#box2 {\nmargin: 20px;\npadding: 50px;\nborder: 5px solid black;\n\
  width: 100px;\nheight: 100px;\ntext-align: justify;\nfloat: left;\n}\n</style></head>\n\
  <body>\n<div id=\"box1\">Learn CSS in One Day and Learn It Well. CSS is easy.</div>\n\
  <div id=\"box2\">Learn CSS in One Day and Learn It Well. CSS is easy.</div>\n<p>skajd\
  \ fhadlc vkas j cnl ka jshvn aclaks jdclkasjd ckasj cnkas djvcn ksa mc nlkasd jn\
  \ skajd fhadlc vkas j cnl ka jshvn aclaks jdclkasjd ckasj cnkas djvcn ksa mc nlkasd\
  \ jn skajd fhadlc vkas j cnl ka jshvn aclaks jdclkasjd ckasj cnkas djvcn ksa mc\
  \ nlkasd jn</p>\n</body>\n</html>\n```\n\n如果你运行这段代码，你将看到下面的盒子。盒子旁边和下方的乱码文本被添加是为了显示外边距（margin）。\n\
  \n![](img/00003.jpg)\n\n这段代码定义了两个宽度和高度均为 100 像素的盒子。这个宽度和高度仅指内容区域的尺寸。\n\n第一个盒子 (`box1`）在内容区域周围有\
  \ 10 像素（px）的内边距。在内边距周围，它有一个 5px 的黑色实线框。`box1` 的总宽度（包括边框）为 100（内容区域）+10*2（两侧内边距）+5*2（两侧边框）=\
  \ 130 px。高度也是如此。\n\n第二个盒子 (`box2`）有 50px 的内边距。尽管 `box2` 比 `box1` 大得多，但注意看“Learn\
  \ CSS in One Day and Learn It Well. CSS is easy.”这段文字仍然占据相同的区域吗？这是因为内容区域是由宽度和高度属性决定的，而不是内边距。`box2`\
  \ 的总宽度为 100+50*2+5*2 = 210px。它的高度也是 210px。\n\n在边框外部，两个盒子都有 20px 的外边距。注意到乱码文本和盒子之间有一些空间吗？那就是外边距。\n\
  \n尝试稍微修改代码，更改宽度、高度、内边距、外边距和边框属性的值。观察每个变化影响了哪些部分。你应该注意到宽度和高度影响内容区域。外边距影响边框外的区域，而内边距影响内部的区域。边框当然是盒子的边界。我们接下来将详细介绍这些属性。\n\
  \n### 宽度和高度属性\n\nCSS 盒子的 `width` 和 `height` 属性指定内容区域的尺寸（不包括内边距、边框和外边距）。值通常以像素或百分比给出。例如，我们示例中的代码将\
  \ `box1` 和 `box2` 的宽度和高度设置为 100px。你也可以将宽度设置为 80%。这样盒子的内容区域将占据页面宽度的 80%。最后，你可以将高度和宽度设置为\
  \ `auto`。在这种情况下，浏览器将根据显示盒子内内容所需的空间自动计算这些值。\n\n### Overflow 属性\n\n有时，内容区域的宽度和高度可能太小，无法容纳盒子内部的内容。默认情况下，内容将溢出盒子并与其他内容叠加。这会导致网页格式非常糟糕。如果你不希望这种情况发生，可以使用\
  \ `overflow` 属性。下面的图显示了如何使用 `overflow` 属性的不同值（`visible`、`hidden`、`scroll` 和 `auto`）显示内容。\n\
  \n![](img/00001.jpg)\n\n### 内边距和外边距属性\n\n内边距和外边距都是透明的。因此我们无法更改它们的颜色。但是我们可以指定它们的宽度。指定宽度最常用的单位是像素。如果你希望外边距为\
  \ 10 像素，编写 `margin: 10px;`。10 和 px 之间不应有任何空格。\n\n下面的示例显示了指定外边距宽度的四种不同语法。内边距也一样。只需将属性名从\
  \ `margin` 更改为 `padding` 即可。\n\n语法 1:\n```\nmargin: 25px;\n```\n语法 2:\n```\nmargin:\
  \ 25px 50px;\n```\n语法 3:\n```\nmargin-top: 25px;\n```\n语法 4:\n```\nmargin: 25px\
  \ 50px 60px 10px;\n```\n\n\n\n\n除了使用 RGB 表示法，你还可以使用十六进制法，它使用 6 位数字来表示颜色。前两个数字代表“红色”强度的十六进制值，接下来两个代表“绿色”，最后两个代表“蓝色”。通常会使用颜色工具来生成这些十六进制值。访问\
  \ [`instant-eyedropper.com/`](http://instant-eyedropper.com/) 网站获取这样一个免费工具。\n\n\
  或者，你可以访问 [`html-color-codes.info/`](http://html-color-codes.info/)，那里有一张颜色表供你选择选择的颜色。点击它，你就会得到相应的十六进制值。\n\
  \n### 示例：\n\n```\nborder-color: rgb(255, 0, 0);\n```\n将设置所有边框为红色。\n\n```\nborder-color:\
  \ red green;\n```\n将顶部和底部的边框设置为红色，左侧和右侧的边框设置为绿色。\n\n```\nborder-top-color: #12005F;\n\
  ```\n将设置顶部边框设置为 #12005F。\n\n### border-style（边框样式）\n\n要设置边框样式，你使用 `border-style`\
  \ 属性。接受的值有：`none`、`dotted`、`dashed`、`solid`、`double`、`groove`、`ridge`、`inset` 和\
  \ `outset`。例如，如果你写：\n\n```\nborder-style: solid dotted;\n```\n顶部和底部边框将为实线，而左右为虚线。如果你想单独设置样式，可以写：\n\
  \n```\nborder-top-style: solid;\n```\n\n```\nborder-left-style: dotted;\n```\n\n\
  ### border-radius（圆角）\n\n`border-radius` 属性用于创建圆角边框。该值通常以像素或百分比给出。\n\n可以为四个角单独设置圆角。这四个角分别是\
  \ `top-left`、`top-right`、`bottom-right` 和 `bottom-left`。\n\n### 示例：\n\n```\nborder-radius:\
  \ 5px;\n```\n将所有角的圆角半径设置为 5px。\n\n```\nborder-radius: 10px 20px;\n```\n将左上角和右下角（即对角线的两个角）的半径设置为\
  \ 10px，右上角和左下角的半径设置为 20px。\n\n```\nborder-radius: 25px 5px 0 50px;\n```\n从左上角开始按顺时针方向继续设置各个角的值。\n\
  \n```\nborder-top-left-radius: 10px;\n```\n将左上角的边框半径设置为 10px。\n\n如果该元素的宽度和高度为 100px，内边距为\
  \ 20px，边框宽度为 50px（总宽度和总高度 = 100 + 20*2 + 50*2 = 240px），将圆角设置为 120px（240 除以 2）将得到一个圆而不是正方形。\n\
  \n### Border Shorthand（边框简写）\n\n`border` 属性是在单行内指定边框宽度、样式和颜色的简写，而不是分开进行。只需写道：\n\n\
  ```\nborder: 5px solid green;\n```\n这些值分别代表宽度 (5px)、样式 (solid) 和颜色 (green)。此简写中不包含圆角。\n\
  \n### 练习 4\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css) 下载此练习的源代码并解压文件。此练习的源代码可以在\
  \ \"Chapter 4 - CSS Box Model\" 文件夹中找到。\n\n### 练习 4.1\n\n1. 在你的浏览器和文本编辑器中同时打开 `Chapter\
  \ 4 - CSS Box Model.html`。\n2. 调整浏览器窗口大小，观察乱码文本是如何绕过更大的框流动的。\n3. 通过修改 `box1` 的 CSS\
  \ 声明，将 `width: 100px;` 和 `height: 100px;` 分为以下每一项：\n   (a) `width: 200px; height:\
  \ 200px;`\n   (b) `width: 60%;`\n   (c) `height: auto; width: auto;`\n   在编辑器中保存文件并在浏览器中刷新页面。注意每种情况下\
  \ `box1` 发生了什么。\n4. 现在将 `box1` 的宽度和高度改回 100px，并将标签 `<div id=\"box1\">...</div>`\
  \ 之间的文本更改为：\n   “一天内学会 CSS 并学好它。此示例展示了当文本溢出框尺寸时会发生什么。”\n   接下来，在 `box1` 的 CSS 声明中添加以下每一项，并注意每种情况下发生了什么：\n\
  \   (a) `overflow: visible;`\n   (b) `overflow: hidden;`\n   (c) `overflow: scroll;`\n\
  \   (d) `overflow: auto;`\n5. 修改 `box1` 的 CSS 声明，将 `margin: 20px;` 改为以下每一项，并注意每种情况下\
  \ `box1` 周围空间发生了什么：\n   (a) `margin: 50px;`\n   (b) `margin: -50px;`\n   (c) `margin:\
  \ 25px 200px;`\n   (d) `margin: 25px;`\n6. 在 `box1` 的 CSS 声明中添加以下每一项，并注意每种情况下发生了什么：\n\
  \   (a) `border: 5px solid red;`\n   (b) `border: 5px dashed blue;`\n   (c) `border:\
  \ 5px dotted green;`\n   (d) `border: 5px double yellow;`\n7. 修改 `box1` 的 CSS 声明，将\
  \ `margin: 20px;` 改为以下每一项，并注意 `box1` 周围空间发生了什么：\n   (a) `margin: 50px;`\n   (b)\
  \ `margin: -50px;`\n   (c) `margin: 25px 200px;`\n   (d) `margin: 25px;`\n8. 在 `box1`\
  \ 的 CSS 声明中添加以下每一项，并注意每种情况下发生了什么：\n   (a) `border: 5px solid red;`\n   (b) `border:\
  \ 5px dashed blue;`\n   (c) `border: 5px dotted green;`\n   (d) `border: 5px double\
  \ yellow;`\n9. 修改 `box1` 的 CSS 声明，将 `margin: 20px;` 改为以下每一项，并注意 `box1` 周围空间发生了什么：\n\
  \   (a) `margin: 50px;`\n   (b) `margin: -50px;`\n   (c) `margin: 25px 200px;`\n\
  \   (d) `margin: 25px;`\n\n\n\n有四种定位元素的方法。为了理解这四种方法的工作原理，我强烈建议你尝试本章末尾的。如果不通过实践，这个主题很难理解。\n\
  \n### 静态定位 (Static Positioning)\n\n第一种定位方法是 `static` 定位。静态并没有特殊含义，它意味着元素是根据页面的正常流进行定位。所有的\
  \ HTML 元素默认都使用这种方法定位。如果你想指定使用 `static` 定位（例如覆盖同一元素的其他定位规则），可以写：\n\n```css\nposition:\
  \ static;\n```\n\n### 相对定位 (Relative Positioning)\n\n定位元素的第二种方法是 `relative` 定位。这种方法相对于元素的正常位置进行定位。正常位置是指元素在未指定定位规则或使用\
  \ `static` 定位时的默认位置。\n\n假设我们有两个盒子，`box1` 和 `box2`，且没有指定定位。如果在 HTML 代码中我们在 `box1`\
  \ 之后创建 `box2`，那么 `box2` 默认将定位在 `box1` 下方（参见下面的代码）。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<style>\n#box1 {\n  /*一些 box1 的样式规则*/\n}\n#box2 {\n  /*一些 box2 的样式规则*/\n\
  }\n</style>\n</head>\n<body>\n  <div id=\"box1\">Box 1</div>\n  <div id=\"box2\"\
  >Box 2</div>\n</body>\n</html>\n```\n\n现在假设我们为 `box2` 的 CSS 声明添加了以下规则：\n\n```css\n\
  position: relative;\nleft: 150px;\ntop: 50px;\n```\n\n我们所做是将 `box2` 的定位更改为 `relative`\
  \ 定位。\n\n![](img/00002.jpg)\n\n上面的图片显示了使用 `relative` 定位时 `box2` 的位置。添加了一个白色虚线框来显示\
  \ `box2` 的原始位置。\n\n当应用 `relative` 定位时，`box2` 会相对于其正常位置发生移动。`top: 50px;` 行将盒子距离原始位置的顶部移动\
  \ 50px，而 `left: 150px;` 行则将其向左侧移动 150px。\n\n你也可以使用 `right` 和 `bottom` 属性来定位 `box2`。例如，`bottom:\
  \ 50px;` 将将 `box2` 从原始底部向上移动 50px，而 `right: 50px;` 将将其从 `box2` 的原始右边缘向左移动 50px。此外，你还可以使用负像素来定位盒子（例如\
  \ `left: -50px`）。\n\n尝试第 5 章的练习，并调整这些值来观察它们是如何工作的。\n\n请注意，当使用 `relative` 定位时，元素可能会与其他元素发生重叠。\n\
  \n如果你想指定哪个元素在前面，就必须使用 `z-index` 属性。`z-index` 属性适用于任何定位为 `relative`、`fixed` 或 `absolute`\
  \ 的元素（即不是 `static`）。`z-index` 值较大的元素将定位在 `z-index` 值较小的元素前面。\n\n假设你有两个盒子，`greenBox`\
  \ 和 `redBox`，并且它们相互重叠。如果你将 `greenBox` 的 `z-index` 为\n\n```css\nz-index: 1;\n```\n\
  \n并将 `redBox` 的 `z-index` 为\n\n```css\nz-index: 2;\n```\n\n那么 `redBox` 将位于 `greenBox`\
  \ 之上，因为它的 `z-index` 值更大。\n\n### 固定定位 (Fixed Positioning)\n\n第三种定位方法是 `fixed` 定位。顾其名，使用\
  \ `fixed` 方法定位的元素将始终保持在其分配的位置上；即使页面滚动，它也不会移动。固定定位通常用于在网页侧边定位社交分享按钮。要使用 `fixed` 定位，我们写：\n\
  \n```css\nposition: fixed;\n```\n\n使用 `fixed` 定位时，我们可以使用 `top` 属性指定盒子距离页面顶部的像素数，而\
  \ `left` 属性指定它距离页面左侧的像素数。\n\n除了 `top` 和 `left`，还有 `right` 和 `bottom` 属性，它们分别指定了盒子距离页面右侧和底部的像素数。\n\
  \n### 绝对定位 (Absolute Positioning)\n\n最后一种方法是 `absolute` 定位。\n\n当使用 `absolute` 定位时，元素相对于第一个非\
  \ `static` 定位的父元素进行定位。如果没有找到这样的元素，它将相对于页面进行定位。\n\n例如，假设我们有以下 HTML 代码：\n\n```html\n\
  <div id=\"box1\">Content in Box 1</div>\n<div id=\"box2\">Content in Box 2</div>\n\
  ```\n\n以及以下 CSS 声明：\n\n```css\n#box1 {\n  position: relative;\n}\n#box2 {\n  position:\
  \ absolute;\n  top: 50px;\n  left: 150px;\n}\n```\n\n假设 `box2` 不是任何具有非静态定位元素的子元素，它将相对于页面进行定位。\n\
  \n### 浮动定位 (Floating Positioning)\n\n*注意：提供的文本包含了一个关于浮动的描述，但这里是为了完整性。*\n\n浮动是一种用于在页面上排列元素的技术。为了查看它是如何工作的，假设我们有以下代码：\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>Float</title>\n<style type=\"\
  text/css\">\ndiv {\n  padding: 10px;\n  border: 1px black;\n  margin: 5px;\n  float:\
  \ left;\n}\n#box1 {\n  width: 60px;\n  height: 100px;\n}\n#box2 {\n  width: 100px;\n\
  \  height: 20px;\n}\n#box3 {\n  width: 50px;\n  height: 150px;\n}\n#box4 {\n  width:\
  \ 20px;\n  height: 50px;\n}\n#box5 {\n  width: 150px;\n  height: 120px;\n}\n#box6\
  \ {\n  width: 120px;\n  height: 70px;\n}\n#box7 {\n  width: 25px;\n  height: 80px;\n\
  }\n</style>\n</head>\n<body>\n  <div id=\"box1\">Box 1</div>\n  <div id=\"box2\"\
  >Box 2</div>\n  <div id=\"box3\">Box 3</div>\n  <div id=\"box4\">Box 4</div>\n \
  \ <div id=\"box5\">Box 5</div>\n  <div id=\"box6\">Box 6</div>\n  <div id=\"box7\"\
  >Box 7</div>\n</body>\n</html>\n```\n\n如果我们运行这段代码，将得到类似下面图片的结果。\n\n![](img/00013.jpg)\n\
  \n注意盒子是如何从上到下从左到右排列的。由于盒子 5 太厚无法放入第一行，CSS 将其放置在上一个盒子的下方。\n\n现在假设在 7 个盒子之外，我们还有以下想要在网站上显示的文本：\n\
  \n```html\n<p>This is some text that is not floated.</p>\n<p>This is more text that\
  \ is not floated.</p>\n<p>This is yet more text that is not floated.</p>\n```\n\n\
  \n\n\n如果这些段落位于 `div` 盒子之后并在 HTML 文档中，我们将得到下面的图表。这些段落将仅仅“挤进”任何可用空间。\n\n![](img/00006.jpg)\n\
  \n如果你不希望发生这种情况，可以使用 `clear: both` 属性来清除浮动。要实现这一点，请在 CSS 声明中添加以下内容：\n\n```css\n.clearFloat\
  \ { clear: both; }\n```\n\n要使用此类，我们将其添加到第一个 `<p>` 标签中：\n\n```html\n<p class=\"clearFloat\"\
  >这是一段没有浮动的文本。</p>\n```\n\n你只需要在第一个 `<p>` 标签上添加 `clearFloat` 类。一旦你清除了浮动，文本将不再环绕盒子显示。\n\
  \n这就是 CSS 中定位和浮动工作原理的要点。我强烈建议你尝试本章的练习题，以更好地理解这两个概念。\n\n### 练习 5\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
