    **PROCEDURAL LANGUAGE** A type of programming language that relies on a series
    of well-constructed steps and procedures.


    **PROTOCOL** A set of rules or procedures for transmitting data between electronic
    devices.


    **SERVER SIDE/BACK END** Refers to a computer that processes requests and delivers
    information to another computer over the internet or a local network.


    **SOFTWARE** Programs used to operate computers.


    **SOURCE CODE** Instructions written in a computer programming language.


    **SYNTAX** A set of rules that specify how a computer language must be written.


    **TECHNICAL WRITING** Easy-to-understand instructions, often used for products
    related to computer hardware and software, engineering, chemistry, aeronautics,
    robotics, finance, medicine, consumer electronics, and biotechnology.


    **TRANSISTOR** A mechanism that controls current or voltage flow and acts as a
    switch or gate for electronic signals.


    # FOR MORE INFORMATION


