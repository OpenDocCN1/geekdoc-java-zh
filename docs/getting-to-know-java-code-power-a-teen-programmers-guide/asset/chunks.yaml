  trans: '


    在日常，企业、政府和其他主要组织必须处理海量数据。他们收集、存储、跟踪并分析这些数据，以做出战略性的业务决策。对于今天的程序员来说，挑战在于如何跟上这股不断增长的信息洪啸。《科技评论》的高级编辑
    Antonio Regalado 表示，只有约 0.5% 的数据会被分析。由于 `Java` 可以在桌面电脑、移动设备和平板上直接使用——并提供了大量的代码库——这种语言可以承担许多与大数据处理相关的任务。到
    2018 年，`Hadoop` 已成为一套流行的程序和程序集，用于构建大数据操作的核心框架。`Hadoop` 本身是用 `Java` 开发的。


    # 走向太空及彼岸


    `Java` 技术已进入了无人涉足的领域。美国国家航空航天局（`NASA`）在许多项目使用了 `Java`，包括其提供虚拟 3D 地球的 World Wind
    软件开发工具包。观众可以对地球上的不同位置进行放大和缩小。现代机器人工程也使用了 `Java`。一辆获奖奖的自动驾驶汽车运行在该代码之上。通过他的公司 `Marginally
    Clever` 构建并销售机器人的 Dan Royer 依赖于 `Java`。这种语言也是艺术机器人 `Makelangelo` 背后的动力，它可以绘制海报和壁画。Ali
    Lemus 将机器人与医疗领域相结合，组装了一个廉价的假手。Lemus 提供了如何使用 3D 打印机和 `Java` 代码构建该肢体的说明。


    ![Image](img/imgg_055_.jpg)


    感谢 `Java` 技术，Doctor Online 提供了交互式患者护理服务。在娱乐界，工业光魔（`ILM`）已转向 `Java` 来制作各种特效。`ILM`
    制作了如《加勒比海》系列电影中迪·琼斯像章鱼一样的脸，以及许多漫威电影中钢铁侠盔甲真实的金属表面。


    云是 `Java` 留下足迹的另一个尖领域。云计算是指使用托管在互联网上的远程服务器网络来存储、管理和处理数据的实践。组织和个人远程访问这些计算服务。当某人将数据存储在计算机硬盘上或从其硬盘上运行程序时，这被称为本地存储和计算——而不是云计算。云计算服务已成为一些人的首选，因为作为拥有和运行计算机及网络的更具成本的选择。一个例子是微软的
    `Office Online`。用户可以通过互联网访问仅限网络版本的 `Word`、`Excel`、`PowerPoint` 和 `OneNote` 版本，而无需安装任何东西。它们是云计算工具。`Google
    Drive` 是一种流行的云端文件存储形式。由于 `Java` 可以随处运行，它非常适合云端开发。


    ## 其他编程语言


    `Java` 经常与其他编程语言一起使用。这里是任何初学者应该了解的其他几种广泛使用的语言。


    - **C**: `C` 被广泛使用，是一种创建于 1972 年的通用语言。它与 `UNIX` 操作系统紧密相关。

    - **C++**: `C++` 能够在各种平台上运行，如 Windows、Mac OS 和各种版本的 `UNIX`，多年来一直是最受欢迎的语言之一。它于
    1979 年创建，是 `C` 的一个更广泛的版本。

    - **C#**: `C#` 是 `C` 和 `C++` 的混合体，由微软开发，用于与 `Java` 竞争。

    - **Objective-C**: 这是编写为 `OS X` 和 `iOS` 软件的主要编程语言。

    - **Python**: 作为一种顶尖语言，这种交互式、面向对象的编程语言免费使用。它以英国喜剧剧团蒙提派森飞行马戏团命名。`Google` 的许多组件是用
    `Python` 编写的，游戏《战场 2》、《星际迷航桥指挥官》和《文明 4》也是如此。

    - **Ruby on Rails**: 有时仅称为 `Rails`，`Ruby on Rails` 是由 David Heinemeier Hansson
    用 `Ruby` 语言构建的开源 Web 框架。它将 `Ruby` 与 `HTML`、`CSS` 和 `JavaScript` 结合。`Ruby` 在程序员中以一种简洁的语言而闻名。

    - **SQL**: 结构化查询语言面向存储、操作和查询存储在数据库中的数据。


    # 万物互联


    在快速变化的世界世界，一个相对新的概念是物联网（`IoT`）。这指的是将各种设备连接到互联网——厨房电器、无人驾驶汽车、心率监测器等。这些电子产品通过 `M2M`（即机器对机器）通信进行连接。


    智能自行车锁通过特殊的手机 App 打开和关闭——如果有人尝试破坏用户的自行车，他或她的手机就会收到短信。现在已经有了设备可以追踪冰箱里牛奶和鸡蛋的新鲜度，并在食物变质时发送消息提醒消费者。`June`
    烤箱和配套的 `June` App 允许用户通过其 `iPhone` 或 `iPad` 控制烹饪，并通过实时视频流监控食物。理论上讲，设备内部的技术还允许公司收集更多关于其自身产品和内部系统的数据。研究机构
    `Gartner` 报告显示，2017 年估计有 84 亿设备连接到互联网，共享并收集信息。然而，`IoT` 的主要关注点之一是安全。黑客已经演示了如何破坏系统以获得对家庭安全系统和计算机驱动车辆等物品的控制。


    在 `Oracle.com` 的一次采访中，`Globalcode` 的创始人 Vinicius Senger 表示，`Java` 的诞生是为了实现这些。他说：


    ```

    Java 一直致力于提供企业解决方案、互联网销售以及银行服务，但 Java 最初的设计是作为一种连接事物的编程语言。

    ```


    相同的架构、安全性和通信协议， `Java` 应用于银行、零售企业和互联网业务，也可以用于嵌入式设备。`Java` 是通往技术、编程和每个人便利未来的门户。


    ## 术语表


    - **ANDROID**: 由 `Google` 开发的基于开源系统的操作系统。

    - **APPLETS**: 执行特定任务的小程序。

    - **应用程序编程接口 (API)**: 用于构建软件的程序、协议和工具。

    - **BUG**: 计算机程序中的代码错误或缺陷。

    - **客户端/前端**: 指在用户计算机上发生的操作。

    - **编译器**: 将编程语言编写的语句翻译成计算机理解的机器语言的软件。

    - **计算机架构**: 系统的组织和结构。

    - **数据库管理**: 对计算机程序中收集的信息进行组织和维护。

    - **调试**: 发现并修复中的错误。

    - **嵌入式**: 描述位于大型机械或电气系统中专用功能的计算机系统。

    - **图形用户界面 (GUI)**: 通常读作“gooey”，GUI 基本上是让人使用和交互计算机的视觉组件。它们通过视觉元素使计算机更易使用。微软 Windows
    和 Apple Mac 界面都使用“桌面”屏幕。

    - **集成开发环境 (IDE)**: 简化软件开发和调试的编程环境。

    - **IOS**: 由 Apple 公司创建并开发的移动操作系统。

    - **机器码**: 计算机中央处理器理解的基础语言。

    - **MOD**: “修改”的缩写，对视频游戏进行某些方面的更改。

    - **范式**: 一种编程风格或方式。


