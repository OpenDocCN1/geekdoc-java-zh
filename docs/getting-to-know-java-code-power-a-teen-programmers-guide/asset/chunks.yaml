    ## 核心概念


    - **条件判断**：这些是代码中的“如果-那么”结构，告诉计算机如果某事为真，则执行某些操作。例如，如果银行账户余额低于 100 美，代码可能会发布一条声明：“余额不足”。

    - **循环**：循环是一段重复执行的代码，用于执行主任务。

    - **脚本**：脚本是使用特定脚本语言编写的一种特殊类型的编码。所有脚本都是编码，但并非所有编码都是脚本。脚本语言不需要编译——它们是被解释的。例如，通常情况下，`Java`
    程序在运行之前需要编译，而通常情况下，像 `JavaScript` 或 `PHP` 这样的脚本语言不需要编译。

    - **方法**：方法是定义在数据字段中的操作或程序。

    - **序列化**：这是对动作或事件进行安排，使其按照预先的顺序引导到下一个有序动作。

    - **变量**：这些是可以根据程序运行而改变的值。可以根据需要进行创建、编辑或删除。


    ## 探索应用世界


    Web 应用涵盖了广泛的功能。它们可以通过在线表单收集输入、统计投票调查、接收产品订单、预订机票或允许用户登录。人们现在可以上网购买衣服、办理银业务或参与讨论——这一切都归功于
    Web 应用。世界各地的用户可以在他们的计算机浏览器上访问应用程序——因此数以百万计的人实际上同时使用同一个应用。


    ![Image](img/imgg_050_.jpg)


    在客户端（普通用户看到的部分），网站可以使用标记语言或脚本语言构建，例如 `HTML`（超文本标记语言）、`CSS`（层叠样式表）或 `JavaScript`。`Java`
    也用于应用程序，但通常在服务器端。例如，`Java servlets` 是通常响应网站用户请求的服务器程序，最常见的是响应用 `HTTP`（超文本传输协议）请求。`Java`
    在处理与许多其他系统（如银行和保险公司使用的系统）通信的大型 Web 应用方面口碑良好。


    `Java` 已成为构建在 `Android` 智能手机上运行程序的本质语言。Google 选择 `Java` 作为其极其流行的 `Android` 移动操作系统的编程语言。即使是
    `Gmail` 的服务器端功能也由 `Java` 和 `C++` 运行。2006 年，Google 为手机提供了基于 `Java` 的 `Gmail` 应用程序。应用让任何人通过移动设备进行广泛的活动，从玩在线游戏到与世界各地聊天以及查看
    3D 图像。尽管 `Android` 一直依赖基于 `Java` 的应用，但 Oracle 已起诉 Google，声称 `Android` 侵犯了其专利——而
    Google 声称它在公平使用法下合法整合了 `Java` 技术。


    ![Image](img/imgg_051_.jpg)


    2017 年 5 月，EdX——一家大型大学课程在线提供商——将 `Java` 评为可以在网上免费学习的三种最有利的编程技能之一（另外 `SQL` 和 `C`）。该公司重点介绍了
    `Java`，因为它开启了通往卓越机会的大门，这些机会年薪通常超过 10 万美元。劳工统计局 (`BLS`）的数据显示，2016 年计算机程序员的中位薪资为每年
    79,840 美元。衡量编程语言流行的的 `TIOBE Index` 在 2018 年 2 月将 `Java` 排名第一——这意味着对于知道 `Java`
    的人来说，就业机会远多于任何其他语言。


    `Java` 大师有广泛的就业选择。例如，一名 `Java` 软件开发人员设计应用程序和软件，通常与 Web 开发人员和软件工程师合作，将 `Java` 集成到不同的业务系统中。这些应用可能是用于移动设备或平板，也可以运行在计算机上。所有类型的企业和组织都使用
    `Java` 软件。


    ## 开发人员与程序员


    `Java` 可能可能处理文字处理软件、浏览器工具、游戏或媒体播放器（如 `iTunes`）。软件开发通常是一份非常有创造性的工作，因为它需要提出新想法。通常，开发人员参与产品的每一个阶段，从构思到引入世界。在此过程中，他们会测试和分析产品，检查任何潜在问题。如果有任何故障，开发人员需要找到解决方法。他们需要确保拥有最高质量的产品，并确保程序是用户友好的。此外，开发者可能会编写详细说明产品的文档，以便他人了解其所有细节。开发者展示软件结构以及它将如何与其他程序一起运行的大局。在许多情况下，他们制作图表和流程图来解释如何编写代码，然后将实际的代码编写工作交给程序员。


    与开发人员相比，程序员的工作创造性可能较低。他们执行开发人员提出的计划，花整天编写大量代码。他们还会调试（测试并修复错误）并将信息收集到库中，供日后使用并使未来的代码编写更容易。程序员可以有不同的专业领域。游戏程序员编写驱动计算机游戏图形的代码。Web
    程序员构建与其共存网站和应用程序。他们可能会将基于 `Java` 的程序与使用 `HTML`（Web 开发语言）构建的页面相结合。Web 设计结合了许多技能，包括计算机编程和图形设计。网站创建者知道如何结合动画、视频、音频和交互功能。尽管在技术驱动的世界中，设计师和程序员非常受需求，但美国劳工统计局预测，从
    2014 年到 2024 年，计算机程序员的职位将减少 8%。其部分原因是公司正在从美国境外聘佣更廉价的程序员。


    ## 教育途径


    如果编程和软件开发证明是你想要追求的职业领域，你将希望超越在线教程。许多主要雇主只招聘那些拥有计算机科学、信息系统、数学或密切相关领域学位的人。课程可能涵盖数据结构、体系体系、数据库管理、统计和技术写作。对于任何使用任何语言的程序员来说，这些都是重要的技能。


    虽然计算机编程领域成功的标准路线是通过获得大学学位，但一个能够证明经验并精通 `Java` 编码的人仍然可以获得极佳的职位。Oracle 拥有自己的“大学”，提供在线课程和认证。通过官方熟水平考试会提高求职者的价值。正如许多程序员和开发人员所证明的那样，教育过程永无止。编码世界不断变化，因此专业人士需要跟上所有的最新进展。即使是高级程序员也必须在引入新特性时掌握它们。如果你将此视为职业，请准备好享受终身学习。


