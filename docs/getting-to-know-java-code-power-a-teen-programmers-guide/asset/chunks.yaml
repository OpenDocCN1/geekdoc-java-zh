- fmt: '

    There’s nothing like working a real-world job to see what a career is really like.
    Those earning a college degree in computer science can often take advantage of
    internship opportunities through their school. Internships give students real-world
    work experience while also earning course credit. Most major companies offer computer
    science-related internships programs. Wal-Mart has one related to its online sales.
    Chevron seeks interns to assist on its applications, database management, and
    business analysis tools. Apple, General Electric, Hewlett-Packard, Verizon, IBM,
    Boeing, Microsoft, Target, Comcast, Dow Chemical, Dell, Humana, Oracle, Time Warner,
    and thousands of other corporations have technology internships.


    ![Image](images/imgg_052_.jpg)


    Students may research problems and help develop and implement solutions. Working
    with skilled professionals, students master technological terms and understand
    the most current challenges in the tech world. Internships also often lead to
    invaluable job contacts. It is both a chance to build a résumé by taking on new
    responsibilities and a chance to build a network of professional connections that
    may turn into sources for recommendations or even full-time employment.


    # AN ENGLISH MAJOR MASTERS JAVA


    Not all Java and coding experts start out with a background in computer science.
    Jonathan Feinberg is a senior software engineer at Google, where he works on code
    that powers a drawing engine, a tool that lets other software engineers add drawing
    features to their Android, iOS (an operating system used on Apple’s mobile devices),
    and web applications. He writes the code in `Java` as well as `C++`, `Objective-C`,
    and `JavaScript`.


    Although he grew up with a love for computer programming, that was not his first
    path as he entered college. While many of his colleagues have degrees in computer
    science, Feinberg has a bachelor’s degree in English and American literature.
    Still, if someone is interested in a programming career, he recommends studying
    computer science or software engineering, and in the twenty-first century, it
    is good to know `Java`, `C++`, or `Python`.


    Fein berg used `Java` to create `Wordle`, which is a toy for generating “word
    clouds” from text provided by the user. He has contributed to `Processing` (`processing.org`),
    a flexible software sketchbook and a language for learning how to code within
    the context of the visual arts. Feinberg has mainly worked on `Processing`’s initial
    support for Android programming and `Python Mode`, which lets users create `Processing`
    sketches using the `Python` programming language (`Python Mode` itself, however,
    is written in `Java`).


    He learned `Java` mostly by reading the first edition of *The Java Programming
    Language* and then coming up with fun little projects to challenge himself. He
    wrote a solitaire program and many other small programs to make animations.


    For Feinberg’s uses, `Java` offers the best toolkit for writing programs that
    provide interactive computer graphics. “The `Java 2D API`, as it’s called, is
    still my favorite graphics toolkit—the one I most readily ‘think in’ when exploring
    or designing graphical programs,” he says.


    `Java` is also good for avoiding coding errors. He says that there are entire
    classes of bugs (programming errors) that simply cannot happen in `Java` because
    the language makes them impossible. “Those sorts of bugs are the cause of many
    crashes in `C` and `C++` programs,” he says, adding that `Java`’s handling of
    errors is why many corporations (including Google) choose the language for certain
    large-scale software projects.


    As far as disadvantages are concerned, Feinberg points to `Java`’s reputation
    for being verbose. “It takes a lot of typing to express simple ideas,” he says.
    “This can be frustrating, and lead to code that’s boring to read. It can be a
    bit like having to write a novel by filling in tax forms.”


    # AN APTITUDE FOR APPS


    As a senior software engineer at Scientific Games Interactive, Will Rieder maintains
    and extends mobile social casino gaming apps by adding new features and troubleshooting
    existing ones. Two of their popular games are *Rainbow Riches* and *Spartacus
    Gladiator of Rome.* Although the majority of the company’s code base is in `C#`
    or `flash/actionScript`, they use `Java` as a “glue” to interface with the Android
    hardware.


    Rieder got interested in programming at age eleven when his advanced math class
    took a field trip to a local university computer lab. He found he loved the problem-solving
    aspect of programming—whether it involved playing a puzzle game or finding the
    best way to code a puzzle game. He says that the process requires him to ask,
    “How do I get from A to B? Is there a more efficient pathway between the two points?”


    He picked up `Java` by using it to develop Android applications, and he says that
    right now there are a lot of opportunities for young people who know `Java` and
    other programming languages.


    ![Image](images/imgg_053_.jpg)


    As a computer language that is constantly evolving and still being developed to
    this day, `Java` remains cutting edge. The language regularly gets updates and
    new versions. The online `Java` community numbers in the millions, and users have
    assembled a large number of open-source libraries and development tools available
    to make programming challenges easier.


    In an interview with Pearson Frank, a recruitment agency specializing in Java
    jobs, Jessica Kerr, a developer at software development company Atomist and a
    panelist on the podcast *Greater Than Code,* said that the world is moving faster
    and faster, and there is an increased need for automation. Because `Java` is practical
    and versatile, she sees it continuing to play a vital role in the future of technology.


    # STRENGTHENING APPS


    In recent years, app development for mobile devices has grown substantially as
    consumers have become more attached to these gadgets than ever. The official language
    for Android app development is `Java`. In 2014, mobile internet usage surpassed
    desktop use. There is no doubt that the app business is enormous.


    ![Image](images/imgg_054_.jpg)


    The app intelligence firm Sensor Tower calculated that global app revenue climbed
    35 percent in 2017 to reach nearly $60 billion. Gaming apps sit at the top of
    the leaderboards. For example, Bandai Namco Entertainment’s *Dragon Ball Z Dokkan
    Battle* brings in about $2 million per day in revenue. For those with a passion
    for game development, several websites have popped up to offer help, including
    java-gaming.org and Lightweight Java Game Library ([[www.lwjgl.org`](http://www.lwjgl.org)).


    For many people, apps like Facebook, Messenger, Google, Gmail, Instagram, Amazon,
    and Apple Music have been woven into their everyday lives. Music apps Pandora
    and Spotify, video streaming apps Netflix and Hulu, and other useful apps have
    soared in popularity as well. Many health-conscious consumers have turned to apps
    to track weight, calories, and exercise goals. In 2017, TechCrunch reported that
    although mobile app use has continued to grow, it may be slowing as the market
    has become flooded with an abundance of apps.


    When it comes to app development, a programmer has to think about which platform
    his or her app will be designed for. Apple’s iOS platform has been the leader,
    with Android not far behind. A 2017 report in Fuel.com said that 16 percent of
    Android app developers earn over $5,000 per month in revenue. A few teenage computer
    whiz kids have struck it rich with their app ideas. When Nick D’Aloisio was sixteen,
    he came up with Trimit, an app that condenses large amounts of text into shorter
    summaries. He wound up selling his idea to Yahoo! for $30 million.


    # BOOSTING BIG DATA

