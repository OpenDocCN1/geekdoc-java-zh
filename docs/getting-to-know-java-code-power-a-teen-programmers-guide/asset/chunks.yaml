    客户端（也称为前端）指的是网页浏览器。客户端代码（主要用 `Javascript` 编写）在网页加载后运行在某人的个人计算机上。


    # 面向对象的风格


    编程有不同的风格或方式，被称为“范式”。程序员使用不同的范式来组织软件，使其能够按预期的方式工作。一种常见的编程风格被称为过程化编程。这种范式使用任务列表来为计算机提供逐步步进的指令。大多数原始的编程语言都是过程化的，包括
    `C`、`COBOL` 和 `Fortran`。


    相比之下，`Java` 是一种面向对象编程（`OOP`）语言。`OOP` 语言将数据视为对象，并使用一组相互作用的对象，而不是长长的命令列表。这些每个对象都承担着不同的角色。例如，动画程序中的一个对象可能会告诉角色行走或跳跃。对象还会如何与程序中的其他对象进行交互。


    任何面向对象的语言——包括 `Java`——都使用类。类是对象的蓝图代码，描述了它的内容。类描述了数据字段并定义了操作，称为方法。通过向对象发送消息，它会执行其方法之一。


    当有大量可以共享和复用的代码时，通常使用 `OOP`。当创建一个对象来处理复杂的任务或行为时，程序员可以轻松地在其代码的任何地方再次使用该对象。过程化代码可能很容易遵循，但在代码量巨大时，维护会变得困难。


    由于对象是可复用的，`OOP` 提高了速度和效率，特别是 `Java`，已被证明在速度方面优于其他语言。开发者经常使用它，因为它减轻了编写软件时的某些工作量。


    ## JAVASCRIPT 和 JAVA 是不同的生物


    由于这两种常用计算机语言的名称，人们有时认为 `Java` 和 `JavaScript` 有关。然而，`JavaScript` 并不是 `Java` 平台的一部分。虽然它们都是面向对象的语言，但它们非常不同。正如开发者
    Jeremy Keith 在 2009 年说的：“`Java` 之于 `JavaScript` 就像火腿之于兔子。”以下是几处不同。


    `JavaScript` 通常用于在网页浏览器中制作交互效果。`Java` 的 applets 也能做到这一点，但其人气正在下降。虽然 `Java` 作为服务器的骨干而闻名，但
    `JavaScript` 代码传统上只运行在浏览器中——尽管它在服务器编程方面正取得进展。`Java` 代码需要编译，而 `JavaScript` 代码全都是文本形式。总体来说，`JavaScript`
    被认为比 `Java` 简单，如果有人想制作生动的交互式网页，它是一门非常棒的语言。


    既然它们如此不同，为什么名字又相似呢？`JavaScript` 最初由 Netscape 的 Brendan Eich 开发，命名为 `Mocha`，后来被重命名为
    `LiveScript`。1995 年，Netscape 和 `Sun Microsystems` 达成了许可协议，该语言被重命名为 `JavaScript`。它的意图是作为脚本语言来辅助
    `Java`（这意味着它不需要编译）。当时，`Java` 是一门热门的新型编程语言，一些人认为 `JavaScript` 的命名是为了给该产品带来更多声望和热度。


    ![Image](img/imgg_038_.jpg)


    > 图中的 Brendan Eich 在 20 世纪 90 年代开发了 `JavaScript`，与 `Java` 配合用于高级应用程序和用户。


    # Java 的全貌


    当人们考虑 `Java` 时，它不仅仅是指语言本身。它包含了整个 `Java` 平台，即支持该语言以及构建网络系统和应用程序的整个环境。这包括它的编译器、`Java
    虚拟机 (JVM)`、库、框架和应用程序接口（`APIs`）。`Java 运行环境 (JRE)` 是由 `Oracle` 开发并提供的程序包，包含了 `Java
    虚拟机 (JVM)`、库以及运行 `Java` 应用程序和 applet（执行特定任务的小程序）所需的组件。


    当有人下载 `Java` 软件时，他就会收到这个运行环境，为这个人提供了在网页浏览器中运行 `Java` 所需的一切。`JRE` 包含了 `Java` 插件软件，允许用
    `Java` 语言编写的 applet 运行在各种浏览器中。网页开发者一直使用 applet 为网页添加功能——在网页上创建交互式按钮、复选框、表单和其他小型动画。今天，applet
    几乎已经消失，被其他技术取代——根据 `Oracle` 的说法，`JRE 9` 继续提供 `Java` 插件并支持在仍然提供标准插件支持的浏览器上启动 applet，但仅供有限使用且不建议使用。


    ## 翻译工具


    与许多计算机语言一样，`Java` 平台拥有工具——编译器和解释器——用于翻译语言以便机器能够理解。编译器是一个特殊的程序，它将用一种编程语言编写的语句转换为计算机处理器最终使用的代码。这种平台无关语言被称为
    `Java 字节码`。虽然字节码类似于机器语言，但它并不是任何实际计算机的机器语言。`Java` 编译器还会在用户在使用 `Java 的‘语法’`（即语法）犯错时告知用户。《Object-Oriented
    Programming in Java》的合著者 Bill McCarty 博士将编译器比作一个严厉的任务主管，他“不容忍任何对 Java 官方规则的偏离”。在开发早期发现这些语法错误是非常重要的，而不是在后期，因为那时产品可能已经发给了公众。


    ![Image](img/imgg_039_.jpg)


    `Java 虚拟机` 是解释器。`JVM` 解密由编译器产生的字节码。所有计算机的操作方式都不同，而 `JVM` 负责翻译字节码。任何安装了 `JVM` 的类型的计算机都可以在开发应用程序的系统上运行
    `Java` 程序。`Oracle` 解释说，由于 `JVM` 的存在，在带有 `Windows OS` 的 `PC` 上开发的 `Java` 程序在带有
    `Solaris OS` 的 `Sun Ultra 工作站`上也可以同样运行，反之亦然。


    平台的另一部分是 `APIs`。这些是用于 `Java` 程序的节省时间的、预先编译好的代码库。`框架` 由多个库组成。它们是大型的预写代码库，任何人都可以将其添加到自己的代码中以节省时间。


    ![Image](img/imgg_040_.jpg)


    Linus Torvalds，这位开发了 `Linux OS`、`Android` 和 `Chrome OS` 技术的软件工程师曾说：“大多数优秀的程序员编程不是因为期待获得报酬或来自大众的赞誉，而是因为编程很有趣。”从理论上讲，编程应该是有趣且创造创意，事实也是如此。但如果某人是编程领域的完全新手，学习像
    `Java` 这样的计算机语言是需要时间的。用代码思考是一个非常独特的过程。学习基础知识可能需要六个月，而需要两到三年才能变得熟练。


    ## 结论


