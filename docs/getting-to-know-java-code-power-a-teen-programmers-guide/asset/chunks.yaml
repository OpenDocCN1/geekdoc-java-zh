- fmt: "\nFans of Java, however, find it very beginner friendly because it has a syntax\
    \ (or structure) that is intuitive. It can be easy to write, read, and understand.\
    \ Some languages, such as `C++`, are more complex than Java, although Java uses\
    \ a syntax that is similar to `C++`. If someone learning Java has any experience\
    \ with that language, it can be helpful.\n\nJava has a toolset and editors that\
    \ let users know right away if they have made any mistakes. And there is a vast\
    \ community of Java users that can be tapped into online for any questions or\
    \ problems.\n\n![Image](images/imgg_042_.jpg)\n\n# COMPUTING FUNDAMENTALS\n\n\
    For those with little or no knowledge, the journey to mastering Java starts with\
    \ gaining a fundamental understanding of how computers and programming works in\
    \ general. Before someone even attempts to write a single line of code, he or\
    \ she has to grasp some essentials.\n\nComputer programming requires an interest\
    \ in problem solving. It involves creativity, logic, and patience. Patience is\
    \ especially key because it can take time to fully understand the structure of\
    \ code and how that code can tell computers what they need to do. Sometimes, the\
    \ work may seem overwhelming, so it helps to take a pause and a deep breath and\
    \ get the help needed to understand each step in the learning process. Without\
    \ code and computers, the entire modern world as humankind knows it would collapse.\
    \ It may be difficult to learn, but it is incredibly important!\n\nComputers have\
    \ four main functions involved with handling information. They take in information\
    \ from the user; they manipulate that information; they store information; and\
    \ they output information.\n\n## A BINARY BRAIN\n\nOn a certain level, everything\
    \ in a computer operates off a binary system. In everyday life, most humans use\
    \ the decimal system. This system is based on the numerals 1 through 9 and 0.\
    \ A binary system, on the other hand, uses just 0s and 1s to represent numbers,\
    \ letters, and other data.\n\nToday’s computers operate with transistors. Computers\
    \ contain millions or billions of these transistors. They are tiny switches that\
    \ trigger electric signals. Transistors are the building blocks for computer chips,\
    \ which make up processing and memory units. As a collection of switches, transistors\
    \ can either be on or off. Computers operate from combinations of transistors\
    \ being turned on or off. Binary code is the language that tells the computer\
    \ which switches to turn on (with a `1) and which switches to turn off (with a\
    \ `0`).\n\nIt would be almost impossible to write code with billions of 1s and\
    \ 0s, so computer scientists figured out how to write coding languages that are\
    \ much simpler. When a program is written in a language like Java and is ready\
    \ to run, it is put through a compiler that converts the instructions into a machine\
    \ code that can be read and executed by a computer. Machine code is the elemental\
    \ language of 1s and 0s that tells the computer what to do.\n\n![Image](images/imgg_043_.jpg)\n\
    \n## PUTTING OBJECTS TOGETHER\n\nBecause Java handles large programs, it was developed\
    \ as an object-oriented language. Basically, the objects in Java are predeveloped\
    \ pieces of code. Programmers that use this type of code do not necessarily need\
    \ to see the code that makes up the actual “object.” They know how to fit the\
    \ objects together to build their programs.\n\nAn object can have multiple variables\
    \ (called attributes or properties) for storing different types of data, and it\
    \ can have its own particular functions (called methods) to manipulate the object’s\
    \ variables. These terms can be difficult to understand at first, but the more\
    \ someone works with programming, the clearer they will become.\n\n## TAKING THE\
    \ FIRST STEP\n\nBefore a user can write and run a simple Java program, he or she\
    \ needs to install the platform on his or her computer system. It is possible\
    \ to download the Java Software Development Kit free of charge for Linux, Windows,\
    \ Mac, and Solaris operating systems at Oracle.com. Once the Java platform is\
    \ installed and configured for their systems, users can try to write and run a\
    \ very simple program.\n\nMany lessons in coding begin with teaching the “Hello,\
    \ World!” program. This is a program that simply prints the words “Hello, World!”\
    \ to the screen. Typically, a program will be written in a text editor, which\
    \ is a tool provided with operating systems and software development packages.\
    \ Text editors are used to enter programming language source statements. This\
    \ program should be saved as `HelloWorld.java`. Then, users access the code by\
    \ that name later and run it on their computers.\n\n![Image](images/imgg_044_.jpg)\n\
    \nThis simple code for a “Hello, World!” program is written like this:\n\n```java\n\
    public class Main {\n    public static void main(String[] args) { System.out.println(“Hello,\
    \ World!”); }\n}\n```\n\nThe first line of the code declares that it is public,\
    \ meaning it has public access. Any other class can access it.\n\nThe second line\
    \ in the application is called the `main` method. Every application in Java must\
    \ contain a `main` method. The Java compiler starts to execute the code from the\
    \ `main` method. This line is a mandatory line of code that serves as a main entry\
    \ point for the program to run. Understanding each piece of the code requires\
    \ more in-depth study. For example, `String[] args` means that a person can see\
    \ and edit “arguments.” Arguments are independent items, or variables, that contain\
    \ data or codes.\n\nThe last line of the code is really the meat of the program,\
    \ and it tells the computer what to do. `println` is telling your computer to\
    \ write the string (which is the provided text) “Hello, World!” on the screen\
    \ and then insert a line break.\n\nThis simple bit of code gives beginners some\
    \ idea of how the Java language works, but understanding all the bits and pieces\
    \ demands intensive learning. According to the Java syntax, each statement must\
    \ end in a semicolon and a single line comment must begin with two slashes. Methods\
    \ and classes are defined with curly braces.\n\n### DIG IN DEEPER: ONLINE TUTORIALS\n\
    \nTo learn more about programming in Java, new users can explore the many resources\
    \ that are available on the internet. Here are a few well-established websites:\n\
    \n- **Code Academy**: Since 2011, CodeAcademy.com has provided free interactive\
    \ coding classes for different programming languages, including Java. The site\
    \ charges for some additional services.\n- **LearnJavaOnline.org**: This free\
    \ interactive tutorial is designed for all levels of programmers—from the absolute\
    \ beginners to the more experienced.\n- **Udemy**: Launched in 2009, Udemy.com\
    \ has offered more than sixty-five online courses. Hundreds of thousands of students\
    \ have taken its Java Tutorial for Complete Beginners, which is designed for those\
    \ who have no prior programming knowledge.\n- **Youth Digital**: Youthdigital.com\
    \ offers online tech courses that teach kids ages eight to fourteen how to code,\
    \ design, develop, and animate.\n\n## GIVE THE CODE A TRY\n\nAfter the code is\
    \ written in the text editor and saved, it has to be compiled so the computer\
    \ can read it. To do this, the user types the command: `javac HelloWorld.java`.\
    \ If all goes right, the compiler generates bytecode in a `HelloWorld.class` file.\
    \ One of the great things about the Java compiler is that it will tell the user\
    \ if there are mistakes, including which line or lines of code are wrong.\n"
