    没有什么比从事一份现实的工作更能让你了解职业的真实面目了。获得计算机科学学位的学生通常可以通过他们的学校利用实习机会。实习让学生获得现实世界的工作经验，同时还能获得课程学分。大多数大公司都提供计算机科学相关的实习计划。沃尔玛有一个与其在线销售相关的计划。雪佛龙正在寻找实习生来协助其应用程序、数据库管理和业务分析工具。苹果、通用电气、惠尔士-帕科、威信、IBM、波音、微软、Target、Comcast、道达化学、戴尔、Humana、甲骨、时代以及数千其他公司都提供技术实习。


    ![Image](img/imgg_052_.jpg)


    学生可以研究问题并帮助开发和实施解决方案。通过与专业人士合作，学生可以掌握技术术语并理解科技领域最前沿的挑战。实习通常还能带来宝贵的人脉联系。这既是一个通过承担新责任来丰富简历的机会，也是一个建立人脉网络的机会，这些人脉可能成为推荐来源甚至全职工作的机会。


    # 英语专业精通 Java


    并不是所有的 Java 和编码专家都是以计算机科学背景起家的。Jonathan Feinberg 是 Google 的高级软件工程师，他在那里负责编写绘图引擎的代码，该工具允许其他软件工程师为他们的
    Android、iOS（一种用于苹果移动设备的操作系统）和 Web 应用程序添加绘图功能。他使用 `Java` 以及 `C++`、`Objective-C`
    和 `JavaScript` 编写代码。


    尽管他从小就对计算机编程充满热爱，但在进入大学时，这并不是他的首选路径。虽然他的许多同事拥有计算机科学学位，但 Feinberg 拥有的是英语和美国文学学士学位。尽管如此，如果有人对编程职业感兴趣，他建议学习计算机科学或软件工程，而在二十一世纪，了解
    `Java`、`C++` 或 `Python`是一件好事。


    Fein berg 使用 `Java` 创建了 `Wordle`，这是一个根据用户提供的文本生成“词云”的玩具。他曾为 `Processing` (`processing.org`)
    贡献过代码，这是一个灵活的软件速写板以及一种在视觉艺术背景下学习如何编码的语言。Feinberg 主要负责 `Processing` 对 Android 编程的初步支持以及
    `Python Mode`，后者允许用户使用 `Python` 编程语言创建 `Processing` 草图（但 `Python Mode` 本身是用 `Java`
    编写的）。


    他学习 `Java` 主要是通过阅读《Java 编程语言》（*The Java Programming Language*）的第一版，然后想出有趣的小项目来挑战自己。他写了一个纸牌程序和许多其他制作动画的小程序。


    对于 Feinberg 来说，`Java` 为编写提供交互式计算机图形的程序提供了最好的工具包。“所谓的 `Java 2D API` 仍然是我最喜欢的图形工具包——当我在探索或设计图形化程序时，我最容易用它来‘思考’的工具，”他说。


    `Java` 也利于避免编码错误。他说，某些整类的 错误（编程错误）在 `Java` 中根本不会发生，因为这种语言让它们变得无法实现。“这类错误是 `C`
    和 `C++` 程序中许多崩溃的原因，”他说，并补充道，`Java` 对错误的处理方式是许多公司（包括 Google）在某些大型软件项目选择选择该语言的原因。


    至于缺点，Feinberg 指出了 `Java` 冗长的声誉。“表达简单的想法需要输入大量的字符，”他说，“这可能会令人沮丧，并导致读起来很无聊的代码。这有点像通过填写税表来写一部小说。”


    # 应用的天赋


    作为 Scientific Games Interactive 的高级软件工程师，Will Rieder 通过添加新功能和排除现有功能的故障来维护和扩展移动社交赌场游戏应用。他们的两个热门游戏是
    *Rainbow Riches*（彩虹）和 *Spartacus Gladiator of Rome*。尽管该公司的大部分代码库使用的是 `C#` 或 `flash/actionScript`，但他们使用
    `Java` 作为“胶水”来与 Android 硬件建立接口。


    Rieder 在十一岁时对编程产生兴趣，当时他的高级数学课去当地大学的计算机实验室实地。他发现自己热爱编程中解决问题的方面——无论是玩益智游戏，还是寻找编写益智游戏的最佳方法。他说这个过程需要他提问：“我如何从
    A 到 B？两点之间是否有更高效的路径？”


    他通过用于开发 Android 应用程序学会了 `Java`，他说现在对了解 `Java` 和其他编程语言的年轻人来说，有很多机会。


    ![Image](img/imgg_053_.jpg)


    作为一种不断演进且至今仍在开发的计算机语言，`Java` 保持着前沿。该语言经常获得更新和新版本。在线 `Java` 社区人数以百万计，用户汇集了大量的开源库和开发工具，使编程挑战变得更加简单。


    在接受专门从事 Java 工作的招聘机构 Pearson Frank 访谈时，软件开发公司 Atomist 的开发者、播客 *Greater Than Code*
    的小组讨论员 Jessica Kerr 表示，世界正运行得越来越快，对自动化的需求也日益增加。由于 `Java` 既实用又多功能，她认为它在未来将继续发挥至关重要的作用。


    # 强化应用


    近年来，随着消费者对这些设备变得比以往任何时候都要依赖，移动设备的应用开发已大幅增长。Android 应用开发的官方语言是 `Java`。2014 年，移动互联网的使用超过了桌面端的使用。毫无疑问，应用业务是巨大的。


    ![Image](img/imgg_054_.jpg)


    应用智能公司 Sensor Tower 计算，全球应用收入在 2017 年增长了 35%，达到近 600 亿美元。游戏应用占据排行榜的前端。例如，万代南古娱乐的《龙珠之觉斗士》每天带来约
    200 万美元收入。对于对游戏开发充满热情的人，几个网站已经出现提供帮助，包括 java-gaming.org 和 Lightweight Java Game
    Library ([www.lwjgl.org](http://www.lwjgl.org))。


    对于许多来说，Facebook、Messenger、Google、Gmail、Instagram、Amazon 和 Apple Music 等应用已经融入了他们的日常生活。音乐应用
    Pandora 和 Spotify，视频流媒体应用 Netflix 和 Hulu 以及其他实用应用也大受欢迎。许多关注健康的消费者已转向应用来跟踪体重、卡路里和运动目标。


    # 增强大数据


    '
- fmt: '

    On a daily basis, businesses, governments, and other major organizations must
    deal with enormous amounts of data. They gather it, store it, keep track of it,
    and analyze it to make strategic business decisions. For programmers today, the
    challenge is keeping up with this ongoing tsunami of information. Antonio Regalado,
    senior editor for the *Technology Review,* said that only about .5 percent of
    all data is ever analyzed. Because `Java` is ready to use on desktops, mobile
    devices, and tablets—and offers vast libraries of code—the language can take on
    many of the tasks related to dealing with big data. By 2018, `Hadoop` had become
    a popular set of procedures and programs used to form the backbone of big data
    operations. `Hadoop` itself was developed in `Java`.


    # TO SPACE AND BEYOND


    `Java` technology has taken steps into areas where no one has gone before. The
    National Aeronautics and Space Administration (`NASA`) uses `Java` in many projects,
    including its World Wind software development kit that provides a virtual 3D globe.
    Viewers can zoom in and out of various locations on Earth. Modern robotics engineering
    makes use of `Java` as well. An award-winning self-driving car operates on the
    code. Dan Royer, who constructs and sells robots through his company, `Marginally
    Clever`, relies on `Java`. The language is also behind `Makelangelo`, an art robot
    that draws posters and murals. Combining the worlds of robotics and health care,
    Ali Lemus assembled a low-cost prosthetic hand. Lemus provides instructions on
    how to build the appendage using a 3D printer and `Java` code.


    ![Image](images/imgg_055_.jpg)


    Thanks to `Java` technology, Doctor Online provides an interactive patient care
    service. In the world of show business, Industrial Light & Magic (`ILM`) has turned
    to `Java` for all sorts of effects. `ILM` has produced such effects as the squidlike
    face of Davy Jones in the Pirates of the Caribbean movie series and the photorealistic
    metal surfaces of Ironman’s suit in many Marvel films.


    The cloud is another cutting-edge area where `Java` has made its mark. Cloud computing
    is the practice of using a network of remote servers hosted on the internet to
    store, manage, and process data. Organizations and individuals access these computing
    services remotely. When someone stores data on or runs programs from his or her
    computer’s hard drive, that is called local storage and computing—not cloud computing.
    Cloud computing services have become preferred by some as a more affordable option
    to owning and operating computers and networks. One example is Microsoft’s `Office
    Online`. A user can tap into internet-only versions of `Word`, `Excel`, `PowerPoint`,
    and `OneNote` accessed via the internet without installing anything. They are
    cloud computing tools. `Google Drive` is a popular cloud form of file storage.
    Since `Java` can run anywhere, it has well suited to cloud development.


    ## OTHER PROGRAMMING LANGUAGES


    `Java` is often used along with other programming languages. Here are a few of
    the other widely used ones any beginner should learn about.


    - **C**: Widely used, `C` is a general-purpose language that was created in 1972.
    It is closely tied to the `UNIX` operating system.

    - **C++**: Able to run on a variety of platforms, such as Windows, Mac OS, and
    the various versions of `UNIX`, `C++` has been one of the most popular languages
    for years. It was created in 1979 as a more extensive version of `C`.

    - **C#**: A hybrid of `C` and `C++`, `C#` was developed by Microsoft to compete
    with `Java`.

    - **Objective-C**: This is the primary programming language for writing software
    for `OS X` and `iOS`.

    - **Python**: A top-ranking language, this interactive, object-oriented programming
    language is free to use. It was named after the British comedy troupe Monty Python’s
    Flying Circus. Many components of `Google` are written in `Python`, as are the
    games `Battlefield 2`, `Star Trek Bridge Commander`, and `Civilization 4`.

    - **Ruby on Rails**: Sometimes just called `Rails`, `Ruby on Rails` is an open-source
    web application framework that was built with the language `Ruby` by David Heinemeier
    Hansson. It incorporates `Ruby` with `HTML`, `CSS`, and `JavaScript`. `Ruby` is
    known among programmers for being an uncluttered language.

    - **SQL**: Structured Query Language is geared toward storing, manipulating, and
    querying data stored in databases.


    # EVERYTHING IS CONNECTED


    In the rapidly changing technological world, a relatively new concept is the Internet
    of Things (`IoT`). This refers to the linking of all kinds of devices to the internet—kitchen
    appliances, driverless cars, heart monitors, and more. These electronic products
    connect via `M2M`, or machine to machine, communication.


    Smart bike locks open and close via a special phone app— and if someone tries
    to tamper with a user’s bike, his or her phone receives a text message. Devices
    now exist that track the freshness of milk and eggs in the fridge and send messages
    alerting consumers when foods have gone bad. The `June` oven and complementary
    `June` app lets users control cooking with their `iPhone` or `iPad` and monitor
    the food all via a live video stream. In theory, the technology inside devices
    also lets companies collect more data about their own products and their own internal
    systems. The research firm `Gartner` reported that an estimated 8.4 billion devices
    were connecting with the internet, sharing and collecting information, in 2017.
    One of the big concerns with the `IoT`, however, is security. Hackers have demonstrated
    how systems can be broken to gain control of items like home security systems
    and computer-driven vehicles.


    In an interview on `Oracle.com`, Vinicius Senger, founder of `Globalcode`, says
    that `Java` was born to do this stuff. He says:


    ```

    Java has been all about providing corporate solutions, selling items on the Internet,
    and banking, but Java was initially designed as a programming language to connect
    things as home appliances.

    ```


    The same architectures, security, and communication protocols that `Java` applies
    to banks, retail enterprises, and internet businesses can be used on embedded
    devices. `Java` is the gateway into a brave new future of technology, programming,
    and convenience for everyone.


    ## GLOSSARY


    - **ANDROID**: Mobile operating system developed by `Google` that is based on
    an open-source operating system.

    - **APPLETS**: Small applications that perform specific tasks.

    - **APPLICATION PROGRAMMING INTERFACE (API)**: A set of routines, protocols, and
    tools for building software.

    - **BUG**: A coding error or flaw in a computer program.

    - **CLIENT SIDE/FRONT END**: Refers to actions that take place on a user’s computer.

    - **COMPILER**: Software that translates statements written in a programming language
    to machine language that a computer can understand.

    - **COMPUTER ARCHITECTURE**: How a computer system is organized and structured.

    - **DATABASE MANAGEMENT**: The organization and maintenance of information collected
    in a computer program.

    - **DEBUG**: To find and fix errors in software or hardware.

    - **EMBEDDED**: Describing a computer system with a dedicated function within
    a larger mechanical or electrical system.

    - **GRAPHICAL USER INTERFACE (GUI)**: Often pronounced “gooey,” GUI is basically
    the visual components that let a person use and interact with a computer. They
    are designed with visual elements that make the computer easier to use. Microsoft
    Windows and Apple Mac interfaces all use a “desktop” screen where icons are displayed.

    - **INTEGRATED DEVELOPMENT ENVIRONMENT (IDE)**: A programming environment that
    streamlines the development and debugging of software and coding.

    - **IOS**: A mobile operating system created and developed by Apple Inc.

    - **MACHINE CODE**: An elemental language that a computer’s central processing
    unit understands.

    - **MOD**: Short for “modification,” an alteration that changes some aspect of
    a video game.

    - **PARADIGM**: A style or way of programming.

