    ABOUT THE AUTHOR


    Don Rauf is the author of numerous nonfiction books, including *Powering Up a
    Career in Internet Security, Computer Game Designer, Schwinn: The Best Present
    Ever, Killer Lipstick and Other Spy Gadgets,* and *American Inventions.* He lives
    in Seattle with his wife, Monique, and son, Leo.


