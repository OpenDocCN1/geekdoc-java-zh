    要看到你的程序运行，你必须随后在命令行中输入 `java HelloWorld`。然后，屏幕上应该弹出“Hello, World!”字样。任何电脑上的命令行都是一个强大的、具有控制力的入口。小心你通过命令行执行的命令——如果输入顺序错误，你可能会删掉所有数据。如果你没有写过程序，你可能不知道命令行在哪里。例如，苹果的
    Mac OS 系统将命令行存储在一个名为 `Terminal`（终端）的程序中，它可以在`Applications`文件夹下的`Utilities`中找到。计算机科学老师
    David Baumgold 说，Windows 有它自己的命令行，但它很难用。他推荐安装一个名为 `Babun` 的免费且易用的命令行程序。


    ![Image](img/imgg_046_.jpg)


    # 玩与实验


    在完成像这样的这样的简单练习后，新手程序员可能想找一些自己个人感兴趣的简单项目。在学习过程中，追求一个自己选择的目标会更有动力。你可能想让一匹马的图像从屏幕的一侧移动到另一侧。你可能会创建一个随机侮辱生成器，它可能会吐出诸如“你这个臭臭的、穿袜子的蛆虫饼！”之类的短语。你可能想尝试制作一个简单的二维游戏。学习的关键在于尝试一些项目并看它们是如何运作的。


    ![Image](img/imgg_047_.jpg)


    程序员是将大问题分解为简单步骤的国王和皇后。编码让世界变得更容易，因为它自动化了工作——但需要编写代码的体力劳动才能获得让别人的生活更轻松的结果。就像任何技能一样，练习编程越多，就越容易。看到代码运行的结果可能需要一些时间。程序通常第一次运行并无效，因此程序员需要耐心回去重试。他们需要检查代码行，以确保一切正确。这需要对细节进行大量的精确检查——这就是为什么程序员遵循古老的木工谚言“量两次，切一刀”。


    对编码的常见抱怨是它可能会令人沮丧、枯燥和无聊。一些编码工作涉及大量复制和粘贴现有代码来完成任务。这可以让工作变得更容易，但有时会削弱过程中的创造性。为了保持编码的趣味性，程序员会承担感兴趣的项目和挑战。编码赋予了创造原创内容的潜力。为了激发学习
    Java 或另一个程序的灵感，选择一个有趣且符合个人兴趣的项目会有帮助。


    ![Image](img/imgg_048_.jpg)


    # 来自 Minecraft 的动力


    进入编程世界的趣味趣味方式是通过电脑游戏，`Minecraft` 不仅世界上最流行的游戏之一，它提供了理解编码的工具。凭借超过 1.22 亿的销量和每月 5500
    万用户，`Minecraft` 已成为全球性现象。


    瑞典视频游戏程序员 Markus “Notch” Persson 最初将 `Minecraft` 作为一个爱好项目开始。尽管他没有完成高中，但 Persson
    喜欢用乐高积木，他从七岁父亲带回一台 Commodore 计算机开始，就开始自学编程。到八岁时，他已经写了他的第一个程序。2009 年，他对乐高、游戏和编程的热情结合在一起，制作了
    `Minecraft` 的第一个版本。与他的创意伙伴 Jakob Porsér 一起，Persson 在同年创立了 `Mojang` 公司（瑞典语意为“小道具”），进一步开发和销售
    `Minecraft` 以及其他游戏。


    ![Image](img/imgg_049_.jpg)


    `Minecraft` 几乎是一次性的成功，第一年就卖掉了约两万份拷贝——在第二年，通常每天都有这么多下载量。2012 年 9 月，Persson 以 25
    亿美元的价格将 `Mojang` 卖给了 `Microsoft`。


    `Minecraft` 被称为沙盒游戏。它提供了一个无限的环境，玩家可以在其中随意漫游并改变虚拟世界，用方块建造结构。游戏中的角色在充满泥土、树木、水、云朵、岩浆、山脉等的世界中破坏并替换方块。Minecraft
    玩家可以在线并在多人版本中与他人互动。随着游戏的发展，还加入了羊、猪、牛、僵尸、苦力帕、骷、船只、轨道和雪。


    为了制作方块、工具和材料，`Minecraft` 提供了大量的物品库存和一个制作工作台。`Minecraft` 的开发者创建了红石，这允许用户制作电路。在这个虚拟宇宙中，红石基本上是一种传输“电能”的手段，它可以被成型和设置以制造各种发明，从灯灯和时钟到计算机和工厂。游戏继续添加动态功能，例如在活塞上升高或降低的平台。


    # 加入 MOD 团队


    编程在这里通过一个名为 `mods` 的功能发挥作用，它是“modifications”（修改）的缩写。由于 `Minecraft` 是用 `Java` 编写的，`Java`
    代码开启了自定义 mod 创建的世界。`Minecraft` 赋予玩家改变角色、物体和景观属性的能力。通过 `Java`，皮肤——或决定角色外观的图像——可以更改。mod
    可以为游戏添加新的结构。


    CodaKid Online Kids Academy 的创始人 David Dodge 说，`Minecraft` 的编码基础可以通过拖放工具轻松学习。这些工具演示了事件驱动编程，这种编程被用于响应用户或系统的操作。2016
    年，`Microsoft` 和 `Code.org` 为 `Minecraft` 引入了一个拖放平台。这些代码块可能包含 if-then 语句（条件）、循环、序列、数组、变量或其他指令。拖放技术是编程的良好第一步。


    在掌握了基础原理后，新手可以更上一层楼，使用真正的 `Java` 语言工作。在 `Codakid.com` 上，David Dodge 说，任何人都可以使用
    `Java` 创建发射闪电的雷锤、制作岩浆弹或设计其他发明的物品。程序员将他的创意愿景变为现实。一旦代码在游戏中执行，奖励是即时的。


    要创建一个 `Minecraft` mod，集成开发环境（IDE）可以帮助。这是一种提供图形用户界面（GUI）的软件应用程序，它可以简化工作并帮助调试软件。一个适用于
    Java 的常用 IDE 称为 `Eclipse`。另一个 mod 工具是应用程序编程接口（API）。流行的 mod API，如 `Bukkit` 或 `Hmod`，提供了与
    `Minecraft` 轻松通信的接口。


    ## Java 语：学习编程术语


    当一个人学习编程门径时，会使用常用短语来描述不同的元素。这里有一些有助于初学者更流畅地使用编程语言的术语。


    ### 数组

    数组是数据或变量的集合、分组或列表。例如，名称列表。数组可以描述为包含多个数据的数据变量。一旦数据存储在数组中，就可以通过变量名和键（或隔间名称）来检索。


    ### 类

    类是用于对象的蓝图并描述其内容的代码。类描述数据字段并定义称为方法的操作。


