    # 序言


    谈到计算机编程语言，Java 非常火热。根据衡量编程语言使用情况的 2018 年 TIOBE 指数，Java 目前受欢迎程度超过了许多常用语言，包括 `C++`、`Python`、`C#`、`PHP`
    和 `JavaScript`。Java 运行在安卓智能手机的应用上，构建视频游戏，并运行许多网页功能。在某种程度上，Java 是构建 LinkedIn、`eBay`、`Amazon`
    和 `Google` 等热门网站背后的工具。此外，数以亿计的设备运行在 Java 上，从 ATM 机到停车收费再到蓝光播放器。令人惊讶的是，Java 并没有用于编写冲出热咖啡的咖啡机。通常，这些运行在
    `C` 或 `C++` 语言上。


    虽然 `C` 和 `C++` 都发明于 20 世纪 70 年代且今天仍然流行，但当 James Gosling 在 1991 年发明 Java 时，它已经超越了它们。他在加利福尼亚的太阳微系统（Sun
    Microsystems）与一个名为“绿色小组”（Green Team）的小工程师团队一起创建了这种语言。今天，所有与 Java 相关的材料都来自计算机技术公司
    Oracle，该公司在 2010 年收购了太阳微系统。


    Java 的根源可以追溯到一个名为 Oak 的程序，它是以工程师办公室外的一棵树命名的。最初，Gosling 和绿色小组开发 Oak 程序是为了运行一种交互式手持家用娱乐控制器，其目标市场是数字有线电视行业。到
    1994 年，该程序演变成了 Java。在此过程中名称发生了变化，因为发现另一家名为 Oak Technology 的公司已经在使用它了。在 `JavaWorld.com`
    的一次采访中，Oak 的产品经理 Kim Polese 表示，她将程序命名为 Java 是因为它“反映了技术的精髓：动态、革命性、活泼、有趣”。


    ![Image](img/imgg_033_.jpg)![Image](img/imgg_034_.jpg)


    Gosling 和绿色小组成功地创造了一种简单、安全（可以用于编写防篡改和防病毒的系统）并且运行在多个操作系统上的语言。Java 的口号是“一次编写，随运行”（write
    once, run anywhere）。用这种新术语在一台计算机上编写的代码可以在另一个计算机系统上运行。Gosling 和同事们设计了一种消除编写代码中某些繁琐方面的系统。Java
    允许用户编写代码段，以便以后重复使用，而无需反复重写代码。随着 90 年代互联网的普及，设计者们意识到这种新语言是创建在线应用程序的理想选择。1995 年，团队宣布
    Netscape Navigator 浏览器将整合 Java 技术。Navigator 成为 20 世纪 90 年代的统治浏览器。如今流行的浏览器如 `Safari`、`Explorer`、`Firefox`
    都支持 Java。


    尽管 Java 现在已经有二十年的历史了，但需求依然很大。在接受 `TechRepublic` 采访时，招聘公司 Hays 的技术总监 James Milligan
    说：“你可以掌握基础。”对于对学习感兴趣的人，强烈推荐学习 Java。


    ![Image](img/imgg_035_.jpg)


    # 机器中的大脑


    电子设备和系统并非独立运行。许多设备依赖内部计算机芯片提供的电子“大脑力量”。这种被称为嵌入式处理器或逻辑芯片的微处理器告诉机器如何工作。例如，ATM 机依靠处理器来接收用户的指令，以便执行所需任务——接受存款、取款、开具余额账单等。基本上，ATM
    是一个数据终端，它的嵌入式处理器与银行的主机处理器通信，后者持有客户账户的实际详细信息。主机处理器检查持卡人提交的详情（包括安全代码）；如果一切无误，交易即可完成。


    谈到网站，Java 以其服务器端能力而闻。许多需要处理大量流量的大型公司（如 Sam''s Club、Amazon 和 Apple App Store）都依赖它。每天支持超过四亿条推文的
    Twitter，其核心架构基于 Java 系统。Java 编程在公司的服务器上执行所有工作，服务器是用于处理请求并通过互联网或局域网向其他计算机传递数据的计算机。服务器端也称为后端，存储了客户端通过网络浏览器通过互联网访问的网页。Java
    编程告诉网站或应用程序如何运行。


    ![Image](img/imgg_037_.jpg)


