  raw: 'The client side, also called the front end, refers to the web browser. Client-side
    codes (which are largely written in Javascript) run on someone’s personal computer
    after a web page is loaded.


    AN OBJECT-ORIENTED STYLE


    There are different styles or ways of programming, called paradigms. Programmers
    use different paradigms to organize software so it works as desired. One common
    style of programming is called procedural. This paradigm uses a list of tasks
    that gives the computer step-by-step instructions. Most of the original programming
    languages are procedural, including C, COBOL, and Fortran.


    Java, on the other hand, is an object-oriented programming (OOP) language. OOP
    languages think of data as objects and use a collection of interacting objects
    instead of a long list of commands. Each of these objects performs a distinct
    role. An object in an animation program, for example, may tell a character to
    walk or jump. An object will also know how to interact with other objects in the
    program.


    Any object-oriented    language—including    Java—uses classes. A class is the
    code that is the blueprint for the object and describes its contents. The class
    describes data fields and defines operations, called methods. By sending a message
    to an object, it executes one of its methods.


    OOP is often used when there is a lot of code that can be shared and reused. When
    an object is created to handle a complex task or behavior, a programmer can easily
    use that object again anywhere in his or her code. Procedural code can be easy
    to follow, but it gets difficult to maintain when there are huge amounts of code.


    Because objects are reusable, OOP increases speed and efficiency, and Java in
    particular has been shown to outperform other languages in terms of speed. Developers
    often use it because it eases some of the workload when writing software.


    »JAVASCRIPT AND JAVA ARE DIFFERENT ANIMALS


    Because of the names of these two common computerprogramming languages, people
    sometimes think that Java and JavaScript are related. JavaScript, however, is
    not part of the Java platform. While they are both object-oriented languages, they
    are very different. As the developer Jeremy Keith said in 2009, “Java is to JavaScript
    as ham is to hamster.” Here are a few differences.


    JavaScript is typically used to make interactive effects within web browsers.
    Java’s applets, which also did this, are declining in popularity. While Java is
    known as a workhorse for servers, JavaScript code has traditionally run on browsers
    only—although it has been gaining ground for server programming. Java code needs
    to be compiled, while JavaScript code is all in text. Overall, JavaScript is considered
    less complex than Java, and it is a great language to learn if someone wants to
    make lively, interactive web pages.


    So why do they have similar names if they are so different? JavaScript was originally
    developed by Brendan Eich of Netscape under the name Mocha, which was later renamed
    to LiveScript. In 1995, Netscape and Sun Microsystems made a licensing agreement
    and the language was renamed JavaScript. It was intended to compliment Java as
    a scripting language (meaning it did not have to be compiled). At the time, Java
    was a hot new programming language, and some believed that the naming of JavaScript
    was intended to give the product more prestige and buzz.


    ![Image](images/imgg_038_.jpg)


    >> Brendan Eich, shown here, developed JavaScript in the 1990s to work alongside
    Java for advanced applications and users.


    THE FULL JAVA WORKS


    When one considers Java, it goes beyond just the language. It includes the whole
    Java platform, which is the entire environment that supports the language and
    the building of web systems and applications. This includes its compiler, Java’s
    Virtual Machine (JVM), libraries, frameworks, and application programming interfaces
    (APIs). The Java Runtime Environment (JRE) is a bundle developed and offered by
    Oracle, which includes the Java Virtual Machine (JVM), libraries, and other components
    necessary to run Java applications and applets (small applications that perform
    specific tasks).


    When someone downloads Java software, he or she receives this runtime environment,
    which gives that person everything he or she needs to run Java on a web browser.
    The JRE includes Java plug-in software that allows applets written in the Java programming
    language to run inside various browsers. Web developers have used applets to bring
    functionality to a web page—creating interactive buttons, check boxes, forms,
    and other small animations on web pages. Today, the applet is almost dead, replaced
    by other technology—JRE 9 continues to provide the Java plug-in and support launching
    applets on browsers that still offer standard plug-in support but is available
    only for limited use and not recommended, according to Oracle.


    TRANSLATING TOOLS


    Like many computer languages, the Java platform has tools—a compiler and interpreter—that
    translate the language so machines can understand it. A compiler is a special
    program that transforms statements written in one programming language into a
    code that a computer’s processor will eventually use. This platform-independent
    language is called Java bytecode. Although bytecode is similar to machine language,
    it is not the machine language of any actual computer. The Java compiler also
    tells a user when he or she has made a mistake using Java’s “grammar,” or syntax.
    Dr. Bill McCarty, the coauthor of *Object-Oriented Programming in Java,* compares
    the compiler to a stern taskmaster who “tolerates absolutely no departure from
    the official rules of the Java language.” It is important to pick up these syntax
    errors early in development rather than later, when a product may have been shipped
    out to the public.


    ![Image](images/imgg_039_.jpg)


    Java’s Virtual Machine is the interpreter. The JVM deciphers the bytecode that
    has been produced by the compiler. All computers operate in different ways, and
    the JVM translates the Java bytecode into executable instructions. A computer
    system with the JVM installed can run Java programs regardless of the computer
    system on which the applications were originally developed. Each type of computer
    needs its own Java bytecode interpreter, but all these interpreters interpret
    the same bytecode language.


    Oracle explains that because of the JVM, a Java program developed on a personal
    computer (PC) with the Windows NT operating system (OS) should run equally well
    without modification on a Sun Ultra workstation with the Solaris operating system,
    and vice versa.


    Another part of the platform is APIs. These are time-saving, ready-made libraries
    of compiled code to use in Java programs. Frameworks consist of multiple libraries.
    They are large bodies of prewritten code that anyone can add to their own code
    to save time.


    ![Image](images/imgg_040_.jpg)


    Linus Torvalds, a software engineer who developed technology behind Linux operating
    systems, Android, and Chrome OS, once said, “Most good programmers do programming
    not because they expect to get paid or get adulation by the public, but because
    it is fun to program.” In theory, programming should be fun and creative—and it
    often is. But if someone is a total newbie to the programming game, learning a
    computer language like Java takes some time. Thinking in code is a very unique process.
    It can take up to six months to learn the basics and two to three years to become
    fairly proficient. The process depends on many factors—time put in, learning ability,
    and natural talent.


    THE PLUSES AND MINUSES


    When it comes to Java, the language gets mixed reviews. Some think Java is clunky
    and requires more work than other languages. One Java user online said that Java
    is about as much fun as watching beige paint dry on the wall of a shuttered DMV office.
    Critics have called it verbose, requiring too much work to get things running
    properly.


    ![Image](images/imgg_041_.jpg)'
