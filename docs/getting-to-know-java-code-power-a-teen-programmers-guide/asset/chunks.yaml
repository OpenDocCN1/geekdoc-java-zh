    programming interface (API). Popular modding APIs, such as Bukkit or Hmod, provide
    an interface that easily communicates with *Minecraft.* A source code editor such
    Notepad++ can ease the process of editing source code.


    ###### >>JAVA JIVE: LEARNING THE LINGO OF PROGRAMMING


    As a person learns the ropes of programming, some common phrases are used to describe
    different elements. Here are a few terms that should help the beginner become
    more fluent in the language of coding.


    Array: An array is a collection, group, or list of data or variables. It could
    be a list of names, for example. An array could be described as a variable that
    holds multiple pieces of data. Once the data is stored in an array, it can be
    retrieved by referring to the variable name and the key (or compartment name).
    A search engine may use an array to store websites found when a user does a search.


    Class: A class is the code that is the blueprint for the object and describes
    its contents. The class describes data fields and defines operations called methods.'
