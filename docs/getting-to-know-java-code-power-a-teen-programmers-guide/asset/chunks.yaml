    \ Java 使用的语法与 `C++` 相似。如果学习 Java 的人有该语言的经验，那将会很有帮助。\n\nJava 拥有一工具集和编辑器，可以让用户在出错时立即获知。而且，还有一个庞大的\
    \ Java 用户社区，遇到任何问题或困难时，都可以在网上寻求帮助。\n\n![Image](img/imgg_042_.jpg)\n\n# 计算基础\n\n\
    对于那些知识很少或没有知识的人来说，掌握 Java 的旅程从对计算机和编程通用工作原理的基本理解开始。在某人尝试编写单行代码之前，他或她必须掌握一些基本要素。\n\
    \n计算机编程需要对解决问题感兴趣。它涉及到创造力、逻辑和耐心。耐心特别是关键，因为需要时间来完全理解代码结构以及这些代码如何告诉计算机需要执行的操作。有时，工作可能会看起来让人压力从心，因此停下来深呼吸，并获取所需的帮助来理解学习过程中的每一步是有帮助的。没有代码和计算机，人类所知的整个现代世界将会崩溃。学习可能很难，但极其重要！\n\
    \n计算机处理信息涉及四个主要功能：接收用户的信息；处理这些信息；存储信息；输出信息。\n\n## 二进制大脑\n\n在某种程度上，计算机中的一切都根据二进制系统运行。日常生活中，大多数人类使用十进制。该系统基于数字\
    \ 1 到 9 和 0。另一方面，二进制系统仅使用 0 和 1 来表示数字、字母和其他数据。\n\n今天的计算机使用晶体管运行。计算机包含数百万或数十亿晶体管。它们是触发电信号的微型开关。晶体管是计算机芯片的构建块，芯片由处理器和内存单元组成。作为开关集合，晶体管处于开启或关闭状态。计算机根据晶体管开启或关闭的组合运行。二进制代码是告诉计算机开启哪些开关（用\
    \ `1` 表示）、关闭哪些开关（用 `0` 表示）的语言。\n\n编写包含数十亿 1 和 0 的代码几乎是不可能的，因此计算机科学家想出了编写简单得多的语言的方法。当程序用\
    \ Java 等语言编写好并准备好运行时，它会被放入编译器中，将指令转换为计算机可以读取和执行的机器码。机器码是 1 和 0 组成的基础语言，告诉计算机应该做什么。\n\
    \n![Image](img/imgg_043_.jpg)\n\n## 组合对象\n\n因为 Java 处理大型程序，因此它被开发为一种面向对象的语言。基本上，Java\
    \ 中的对象是预先开发的代码段。使用这种类型代码的程序员并不一定需要看到实际“对象”的代码。他们知道如何将对象组合在一起来构建他们的程序。\n\n一个对象可以有多个变量（称为属性或特性）来存储不同类型的数据，并且它还可以拥有自己的特定函数（称为方法）来操作对象的变量。这些术语起初可能很难理解，但某人接触编程越频繁，它们就会变得越清晰。\n\
    \n## 迈出第一步\n\n在用户编写和运行一个简单的 Java 程序之前，他或她需要在其计算机系统上安装该平台。可以在 Oracle.com 免费下载适用于\
    \ Linux、Windows、Mac 和 Solaris 操作系统的 Java 软件工具包（JDK）。一旦 Java 平台为他们的系统完成安装和配置，用户就可以尝试编写并运行一个非常简单的程序。\n\
    \n许多编码课程从教授“Hello, World!”程序开始。这是一个简单在屏幕上打印“Hello, World!”字样的程序。通常，程序会在文本编辑器中编写，文本编辑器是操作系统和软件开发包提供的工具。文本编辑器用于输入编程语言源语句。该程序应保存为\
    \ `HelloWorld.java`。然后，用户以后通过该名称访问代码并在他们的计算机上运行它。\n\n![Image](img/imgg_044_.jpg)\n\
    \n这个“Hello, World!”程序的简单代码编写如下：\n\n```java\npublic class Main {\n    public static\
    \ void main(String[] args) { System.out.println(“Hello, World!”); }\n}\n```\n\n\
    代码的第一行声明它是公共的（public），意味着它具有公共访问权限。任何其他类都可以访问它。\n\n应用程序的第二行被称为 `main` 方法。Java\
    \ 中的每个应用程序都必须包含一个 `main` 方法。Java 编译器从 `main` 方法开始执行代码。这一行是强制性的代码行，作为程序运行的主入口点。理解代码的每部分需要更深层次的研究。例如，`String[]\
    \ args` 意味着人可以看到并编辑“参数”（arguments）。参数是包含数据或代码的独立项目或变量。\n\n### 代码的最后一行真的是程序的精髓，它告诉计算机应该做什么。`println`\
    \ 是告诉你的计算机在屏幕上写入字符串（即提供的文本）“Hello, World!”然后插入一个换行符。\n\n这段简单的代码让初学者对 Java 语言如何工作有了一些了解，但要理解所有细节需要密集的学习。根据\
    \ Java 语法，每条语句都必须以分号结束，单行注释必须以两个斜杠开头。方法和类用大括号定义。\n\n### 深入学习：在线教程\n\n为了学习更多关于\
    \ Java 编程，新用户可以探索互联网上的许多资源。这里是一些广为人知的网站：\n\n- **Code Academy**: 自 2011 年以来，CodeAcademy.com\
    \ 为不同的编程语言（包括 Java）提供了免费的交互式编码课程。网站对某些额外服务收费。\n- **LearnJavaOnline.org**: 这个免费的交互式教程适用于所有水平的程序员——从初学者到经验丰富的者。\n\
    - **Udemy**: Udemy.com 于 2009 年推出提供了六多门在线课程。数十万学生学习了它的“完全学者 Java 教程”，该课程专为没有先编程知识的人设计。\n\
    - **Youth Digital**: Youthdigital.com 提供在线技术课程，教 8 到 14 岁的儿童如何编码、设计、开发和动画。\n\n\
    ## 尝试代码\n\n在文本编辑器中编写并保存代码后，必须进行编译以便计算机读取。要这样做，用户输入命令：`javac HelloWorld.java`。如果一切顺利，编译器将在\
    \ `HelloWorld.class` 文件中生成字节码。Java 编译器的伟大之处之一是它会告诉用户是否存在错误，包括哪一行或几行代码是错误的。\n\n"
- fmt: '

    To see your program in action, you must then type `java HelloWorld` in the command
    line. Then the text “Hello, World!” should pop up on the screen. The command line
    on any computer is the powerful, controlling entryway. Be careful what commands
    you execute via the command line—punch in the wrong orders and you can wind up
    erasing all your data. If you have not been programming, you might not know where
    the command line is. For example, Apple’s Mac OS systems store the command line
    in a program called `Terminal`, which can be found in the `Utilities` folder in
    `Applications`. Computer science teacher David Baumgold says that Windows has
    its own command line, but it is difficult to use. He recommends installing a free
    and easy command line program called `Babun`.


    ![Image](images/imgg_046_.jpg)


    # PLAY AND EXPERIMENT


    After completing a simple exercise such as this, a novice programmer may want
    to think of easy projects that are of personal interest. Pursing a goal you choose
    can be more motivating when it comes to learning. You may want to make an image
    of a horse move from one side of the screen to the other. You might create a random
    insult generator, which might spew out a phrase like “Thou reeky puke-stockinged
    maggot-pie!” You might want to explore making a simple two-dimensional game. The
    key to learning is trying some projects and seeing how they work.


    ![Image](images/imgg_047_.jpg)


    Coders are the kings and queens of taking big problems and breaking them down
    into simple steps. Coding makes the world easier because it automates work—but
    it takes the hands-on labor of writing the code to get results that will make
    others’ lives easier. Like any skill, the more programming someone practices,
    the easier it gets. Seeing the results of coding in action can take some time.
    Programs often do not work on the first pass, so coders need the patience to go
    back in and try again. They need to look over lines of code to make sure everything
    is right. It requires a lot of precise checking of detail—that is why coders follow
    the old carpentry proverb “measure twice, cut once.”


    Common complaints about coding are that it can be frustrating, tedious, and boring.
    Some coding jobs involve a lot of cutting and pasting of preexisting code to get
    the job done. This can make the job easier, but sometimes it takes away from the
    creativity of the process. To keep coding interesting, programmers take on projects
    and challenges that interest them. Coding gives the potential to make something
    original. To get inspired about learning Java or another program, picking a project
    that is fun and of personal interest helps.


    ![Image](images/imgg_048_.jpg)


    # MOTIVATION FROM MINECRAFT


    A fun way to get into programming is through computer games, and `Minecraft` is
    not only one of the most popular games in the world, it also provides the tools
    to understand coding. With more than 122 million copies sold and 55 million users
    every month, `Minecraft` has become a worldwide phenomenon.


    The Swedish video game programmer Markus “Notch” Persson started `Minecraft` as
    a hobby project. Although he never finished high school, Persson loved building
    with Legos, and he taught himself to code starting at age seven when his father
    brought home a Commodore computer. By age eight, he had written his first program.
    In 2009, his passions for Legos, games, and programming came together when he
    made the first version of `Minecraft`. Along with his creative partner Jakob Porsér,
    Persson started the company `Mojang` (Swedish for “gadget”) that year to further
    develop and sell `Minecraft` and other games.


    ![Image](images/imgg_049_.jpg)


    `Minecraft` was practically an instant success, selling about twenty thousand
    downloads in its first year—and often that many every day in its second year.
    In September 2012, Persson sold `Mojang` to `Microsoft` for $2.5 billion.


    `Minecraft` is known as a sandbox game. It provides an infinite environment in
    which players can wander and change a virtual world at will, building structures
    with cubes. Characters in the game destroy blocks and replace blocks in a world
    filled with dirt, trees, water, clouds, lava, mountains, and more. Minecrafters
    can go online and interact with others in a multiplayer version. Sheep, pigs,
    cows, zombies, creepers, skeletons, boats, rails, and snow were added as the game
    developed.


    To make blocks, tools, and materials, `Minecraft` supplies a vast inventory of
    items and a crafting grid. `Minecraft` developers created redstone, which allowed
    users to make circuitry. In this virtual universe, redstone is basically a means
    to carry “electricity,” and it can be shaped and set up to make all sorts of inventions,
    from lamps and clocks to computers and factories. The game continues to add dynamic
    features, such as platforms that raise or lower on pistons.


    # JOIN THE MOD SQUAD


    Programming comes into play here with a feature called `mods`, short for “modifications.”
    Because `Minecraft` was written in `Java`, `Java` coding unlocks the world of
    customized mod making. `Minecraft` gives players the ability to change qualities
    of characters, objects, and landscapes. With `Java`, the skins—or the images that
    determine what a character looks like—can be changed. A mod can add new structures
    to the game.


    David Dodge, the founder of CodaKid Online Kids Academy, says that fundamentals
    of coding for `Minecraft` are easy to learn with drag-and-drop tools. These tools
    demonstrate event-driven programming, which is written to respond to actions by
    the user or the system. In 2016, `Microsoft` and `Code.org` introduced a drag-and-drop
    platform for `Minecraft.` These code blocks may contain if-then statements (conditionals),
    loops, sequencing, arrays, variables, or other instructions. The drag-and-drop
    technique is a great first step into coding. Although it does not involve the
    syntax of coding, it visually shows how coding instructions fit together like
    a puzzle.


    With basic principles mastered, newbies can kick it up a notch and work with the
    actual `Java` language. On `Codakid.com`, David Dodge says that anyone can use
    `Java` to create a ThunderHammer that shoots lightning, make a `LavaBomb`, or
    design other items of his or her invention. The programmer brings his or her creative
    vision to life. Once the code is executed in the game, the reward is instant.
    Users can have great fun seeing their own coded work in action in their favorite
    game.


    To create a `Minecraft` mod, an integrated development environment (IDE) can help.
    This is a software application that provides a graphical user interface (GUI)
    that streamlines the work and helps debug software. One common IDE that happens
    to be great for Java is called `Eclipse`. Another tool for modding is an application
    programming interface (API). Popular modding APIs, such as `Bukkit` or `Hmod`,
    provide an interface that easily communicates with `Minecraft.`


    ## JAVA JIVE: LEARNING THE LINGO OF PROGRAMMING


    As a person learns the ropes of programming, some common phrases are used to describe
    different elements. Here are a few terms that should help the beginner become
    more fluent in the language of coding.


    ### Array

    An array is a collection, group, or list of data or variables. It could be a list
    of names, for example. An array could be described as a variable that holds multiple
    pieces of data. Once the data is stored in an array, it can be retrieved by referring
    to the variable name and the key (or compartment name). A search engine may use
    an array to store websites found when a user does a search.


    ### Class

    A class is the code that is the blueprint for the object and describes its contents.
    The class describes data fields and defines operations called methods.

