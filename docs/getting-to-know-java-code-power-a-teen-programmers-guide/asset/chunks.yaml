    ## Core Concepts


    - **Conditionals**: These are “if-then” constructs in codes that tell the computer
    if something is true, then do something. For example, if a bank account goes under
    $100, code may then issue a statement: “Insufficient funds.”

    - **Loop**: A loop is a repeating piece of code that carries out a main task.

    - **Scripting**: Scripting is a specific type of coding written in a specific
    scripting language. All scripting is coding, but not all coding is scripting.
    Scripting languages do not need to be compiled—they are interpreted. For example,
    normally, a `Java` program needs to be compiled before running, whereas, normally,
    a scripting language like `JavaScript` or `PHP` does not require compilation.

    - **Method**: A method is an operation or procedure defined in a data field.

    - **Sequencing**: This is the arranging of an action or event so that it leads
    to the next ordered action in a predetermined order.

    - **Variables**: These are values that can change depending on the program. They
    can be created, edited, or deleted as much as needed.


    ## Exploring the World of Apps


    Web applications cover a wide range of functions. They can gather input through
    online forms, tally voting polls, take product orders, book airline flights, or
    let a user log in. People can now go online to buy clothes, do their banking,
    or participate in discussions—all because of web apps. Users around the world
    can access the applications on their computer browser—so millions of people can
    actually be using one app at the same time.


    ![Image](images/imgg_050_.jpg)


    On the client side (seen by common users), websites may be constructed with markup
    or scripting languages, such as `HTML` (Hypertext Markup Language), `CSS` (Cascading
    Style Sheets), or `JavaScript`. `Java` is used for apps as well but often on the
    server side. For example, `Java servlets` are server programs that typically respond
    to requests from website users, most commonly an `HTTP` (hypertext transfer protocol)
    request. `Java` has built a reputation for doing well with large web applications
    that communicate with a number of other systems, such as those used by banks and
    insurance companies.


    `Java` has grown to become the essential language for building programs that run
    on `Android` smartphones. Google chose to use `Java` as the programming language
    for its massively popular `Android` mobile operating system. Even the server-side
    functions of `Gmail` are run by `Java` and `C++`. In 2006, Google offered a `Java`-based
    application of `Gmail` for mobile phones. Apps let anyone do a broad range of
    activities via a mobile device, from playing online games to chatting with people
    around the world to viewing 3D images. Although `Android` has consistently relied
    on `Java`-based apps, Oracle has filed lawsuits against Google, claiming that
    `Android` infringes on its patents—while Google claims it legally incorporates
    `Java` technology under fair-use laws.


    ![Image](images/imgg_051_.jpg)


    In May 2017, EdX——a massive online provider of university-level courses—named
    `Java` one of the three most lucrative programming skills you can learn online
    for free (along with `SQL` and `C`). The company spotlighted `Java` for opening
    the door to outstanding opportunities that often pay more than $100,000 a year.
    Numbers from the Bureau of Labor Statistics (`BLS`) show that the median pay for
    computer programmers was $79,840 a year in 2016. The `TIOBE Index`, which is a
    measure of the popularity of programming languages, ranked `Java` as number one
    in February 2018—meaning there are far more employment opportunities for those
    who know `Java` than any other language.


    A vast range of employment options are available to the `Java` master. A `Java`
    software developer, for example, comes up with applications and software, often
    working together with web developers and software engineers to integrate `Java`
    into different business systems. The applications might be for mobile devices
    or tablets or could run on computers. All types of businesses and organizations
    use `Java` software.


    ## Developers and Programmers


    `Java` coders might be working on word processing software, web browser tools,
    games, or media players, such as `iTunes`. Software development is often a very
    creative job because it requires coming up with new ideas. Typically, developers
    are involved in every step of a product, from its conception to its introduction
    to the world. Along the way, they are testing and analyzing the product, checking
    it for any potential problems. If there are any troubles, developers need to find
    a fix. They need to ensure they have the best quality product and that the program
    is user friendly. Also, developers may put together documents detailing the product
    so others understand all the details about it. Developers present the big picture
    about software structure and how it will operate with other programs. In many
    cases, they produce diagrams and flowcharts that explain how to write the code,
    but then they pass off the actual code writing to programmers.


    Programmers can have a less creative job compared to the developers. They execute
    the plan presented by the developer, spending their days writing tons of code.
    They also debug (test and fix mistakes) and collect information into libraries
    that may be used later and make future code writing easier. Programmers can have
    different specialties. Game programmers write code that drives the graphics of
    computer games. Web programmers build the websites and applications that live
    with them. They may combine `Java`-based programs with pages built in `HTML`,
    the web development language. Web design brings together many skills, including
    computer programming and graphic design. The site creators know how to incorporate
    animation, video, audio, and interactive features.


    Although designers and programmers are very much in demand in the technology-driven
    world, the US Bureau of Labor Statistics predicts that jobs for computer programmers
    will decline by 8 percent between 2014 and 2024. Part of the reason for this is
    that companies are hiring more affordable programmers from outside the United
    States.


    ## Educational Pathways


    If programming and software development turns out to be a field you want to pursue
    as a career, you will want to move beyond online tutorials. Many major employers
    hire only those who have a degree in computer science, information systems, mathematics,
    or a closely related field. The coursework might cover data structures, computer
    architecture, database management, statistics, and technical writing. These are
    all important skills for any programmer using any language.


    While the standard route to success in computer programming is through a college
    degree, a person who can demonstrate experience and a mastery of `Java` coding
    can still land a terrific position. Oracle has its own “university” that provides
    online courses and certification. Passing an official proficiency exam raises
    the value of a job candidate. As many programmers and developers will testify,
    the educational process never ends. The world of coding continually changes, so
    professionals need to keep up with all the latest advances. Even senior programmers
    have to master new features as they are introduced. If you this as a career, be
    ready to enjoy a lifetime of learning.


    ### Internships give a real-world view

