    It would be almost impossible to write code with billions of 1s and 0s, so computer
    scientists figured out how to write coding languages that are much simpler. When
    a program is written in a language like Java and is ready to run, it is put through
    a compiler that converts the instructions into a machine code that can be read
    and executed by a computer. Machine code is the elemental language of 1s and 0s
    that tells the computer what to do.


    ![Image](images/imgg_043_.jpg)


    PUTTING OBJECTS TOGETHER


    Because Java handles large programs, it was developed as an object-oriented language.
    Basically, the objects in Java are predeveloped pieces of code. Programmers that
    use this type of code do not necessarily need to see the code that makes up the
    actual “object.” They know how to fit the objects together to build their programs.


    An object can have multiple variables (called attributes or properties) for storing
    different types of data, and it can have its own particular functions (called
    methods) to manipulate the object’s variables. These terms can be difficult to
    understand at first, but the more someone works with programming, the clearer they
    will become.


    TAKING THE FIRST STEP


    Before a user can write and run a simple Java program, he or she needs to install
    the platform on his or her computer system. It is possible to download the Java
    Software Development Kit free of charge for Linux, Windows, Mac, and Solaris operating systems
    at Oracle.com. Once the Java platform is installed and configured for their systems,
    users can try to write and run a very simple program.


    Many lessons in coding begin with teaching the “Hello, World!” program. This is
    a program that simply prints the words “Hello, World!” to the screen. Typically,
    a program will be written in a text editor, which is a tool provided with operating
    systems and software development packages. Text editors are used to enter programming
    language source statements. This program should be saved as HelloWorld.java. Then,
    users access the code by that name later and run it on their computers.


    ![Image](images/imgg_044_.jpg)


    This simple code for a “Hello, World!” program is written like this:


    public class Main {


    public static void main(String[] args) { System.out.println(“Hello, World!”);
    } }


    The first line of the code declares that it is public, meaning it has public access.
    Any other class can access it.


    The second line in the application is called the main method. Every application
    in Java must contain a main method. The Java compiler starts to execute the code
    from the main method. This line is a mandatory line of code that serves as a main entry
    point for the program to run. Understanding each piece of the code requires more
    in-depth study. For example, String[] args means that a person can see and edit
    “arguments.” Arguments are independent items, or variables, that contain data
    or codes.


    The last line of the code is really the meat of the program, and it tells the
    computer what to do. “Println” is telling your computer to write the string (which
    is the provided text) “Hello, World!” on the computer screen and then insert a line
    break.


    This simple bit of code gives beginners some idea of how the Java computer language
    works, but understanding all the bits and pieces demands some intensive learning.
    According to the Java syntax, each statement must end in a semicolon and a single
    line comment must begin with two forward slashes. Methods and classes are defined
    with curly braces.


    ###### >>DIG IN DEEPER: ONLINE TUTORIALS


    To learn more about programming in Java, new users can explore the many resources
    that are available on the internet. Here are a few well-established websites to
    explore:


    Code Academy: Since 2011, CodeAcademy.com has provided free interactive coding
    classes for different programming languages, including Java. The site charges
    for some additional services.


    LearnJavaOnline.org: This free interactive tutorial is designed for all levels
    of programmers—from the absolute beginners to the more experienced.


    Udemy: Launched in 2009, Udemy.com has offered more than sixty-five thousand online
    courses. Hundreds of thousands of students have takes its Java Tutorial for Complete
    Beginners, which is designed for those who have no prior programming knowledge. Youth
    Digital: Youthdigital.com offers online tech courses that teach kids ages eight
    to fourteen how to code, design, develop, and animate.


    ![Image](images/imgg_045_.jpg)


    GIVE THE CODE A TRY


    After the code is written in the text editor and saved, it has to be compiled
    so the computer can read it. To do this, the user types the command: *javac HelloWorld.java.*
    If all goes right, the compiler generates bytecode in a HelloWorld.class file.
    One of the great things about the Java compiler is that it will tell the user
    if there are mistakes, including which line or lines of code are wrong.'
