    \n [Recommended Book by Ray Yao](#part0015.xhtml_recommend)\n\n### Syntax Chart\n\
    \n------------------------------------------------------------------------------\n\
    \n& syntax\n\n\"&\" has two functions.\n\n1\\. Work as a relational operator.\n\
    \n// Return true if two conditions are true, return false if one of the conditions\
    \ is false.\n\n// \"&\" evaluates all conditions, even if the first condition\
    \ is false.\n\ne.g.\n\npublic class Main {\n\npublic static void main(String[]\
    \ args){\n\nint x = 100, y = 90, z = 60;\n\nif ((x > y) & (x > z))\n\nSystem.out.println(\"\
    The value of x is \" + x);\n\n}\n\n}\n\n// Output:   The value of x is 100\n\n\
    2\\. Work as a bitwise AND\n\n // Return 1 if two bits are 1, return 0 if one\
    \ of the bits is 0.\n\ne.g.\n\npublic class Main {\n\n    public static void main(String[]\
    \ args){\n\n        int x= 4;\n\n        int y = 6;\n\n        int z = x & y;\n\
    \n        System.out.println(x + \" & \" + y + \" = \" + z);\n\n    }\n\n}\n\n\
    // Output:   4\n\n------------------------------------------------------------------------------\n\
    \n| syntax\n\n\"|\" is used for bitwise Or.\n\n// Return 1 if one of the bits\
    \ is 1, return 0 if all bits are 0.\n\ne.g.\n\npublic class Main {\n\n    public\
    \ static void main(String[] args){\n\n        int x= 4;\n\n        int y = 6;\n\
    \n        int z = x | y;\n\n        System.out.println(x + \" | \" + y + \" =\
    \ \" + z);\n\n    }\n\n}\n\n// Output:   6\n\n------------------------------------------------------------------------------\n\
    \n^ syntax:\n\n\"^\" is used for bitwise XOR\n\n// if corresponding bits are different,\
    \ it returns 1, else it returns 0.\n\ne.g.\n\npublic class Main {\n\n    public\
    \ static void main(String[] args){\n\n        int x= 4;\n\n        int y = 6;\n\
    \n        int z = x ^ y;\n\n        System.out.println(x + \" ^ \" + y + \" =\
    \ \" + z);\n\n    }\n\n}\n\n// Output:   4 ^ 6 = 2\n\n------------------------------------------------------------------------------\n\
    \n<< syntax:\n\noperand << bits\n\n// Left shift all bits according to a given\
    \ number of bits. \n\ne.g.\n\npublic class Main {\n\n    public static void main\
    \ (String[] args) {       \n\n        int operand = 2;\n\n // left shift 2 bits\n\
    \n        int n = operand << 2;\n\n        System.out.println(n);   \n\n    }\n\
    \n}\n\n// Output:   8\n\n------------------------------------------------------------------------------\n\
    \n>> syntax:\n\noperand  >>  bits\n\n// Right  shift all bits according to a given\
    \ number of bits. \n\ne.g.\n\npublic class Main {\n\n    public static void main\
    \ (String[] args) {       \n\n        int operand = 8;\n\n // right shift 2 bits\n\
    \n        int n = operand >> 2;\n\n        System.out.println(n);   \n\n    }\n\
    \n}\n\n// Output:   2\n\n------------------------------------------------------------------------------\n\
    \n>>> syntax:\n\noperand  >>>  bits\n\n// Right  shift all bits according to a\
    \ given number of bits. \n\n// The vacancy in the leftmost position is filled\
    \ with 0\n\n// Unsigned right shift\n\n-2 = 11111110 (binary)\n\n-2 >>> 1  returns\
    \ 01111111\n\ne.g.\n\n------------------------------------------------------------------------------\n\
    \nabs() syntax:\n\nMath.abs(number)\n\n// Returns the absolute value of a number\n\
    \ne.g\n\npublic class Main {\n\n  public static void main(String[] args) {\n\n\
        System.out.println(Math.abs(-168.88)); \n\n    System.out.println(Math.abs(168.88)); \n\
    \n  }\n\n}\n\n// Output:\n\n168.88\n\n168.88\n\n------------------------------------------------------------------------------\n\
    \nabstract syntax:\n\nabstract class/method\n\n// \"abstract\" is used in class\
    \ or method\n\n// Abstract class works as a parent class, which will be extended\
    \ by its subclass. The method of the subclass will override the abstract method\
    \ of the abstract class.\n\n// \"abstract class\" cannot create any object.\n\n\
    // \"abstract method\" is used in abstract class only\n\n// \"abstract method\"\
    \ is an empty method without a body.\n\ne.g.\n\nabstract class Book{ // create\
    \ an abstract class\n\nabstract void read(); // create an abstract method\n\n\
    }\n\nclass eBook extends Book{ //  extend the parent class\n\nvoid read(){ //\
    \ override the abstract method"
