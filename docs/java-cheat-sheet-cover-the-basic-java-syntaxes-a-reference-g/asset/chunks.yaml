    \ syntax`\n- `switch syntax`\n- `synchronized syntax`\n- `tan() syntax`\n- `tanh()\
    \ syntax`\n- `this syntax`\n- `this syntax`\n- `thread creating syntax`\n- `thread\
    \ extends syntax`\n- `thread implements runnable syntax`\n- `throw syntax`\n-\
    \ `throw syntax`\n- `throws syntax`\n- `time syntax`\n- `toCharArray() syntax`\n\
    - `toDegrees() syntax`\n- `toIntExact() syntax`\n- `toLowCase() syntax`\n- `toRadians()\
    \ syntax`\n- `toString() syntax`\n- `toUpperCase() syntax`\n- `transient syntax`\n\
    - `trim() syntax`\n- `try syntax`\n- `type casting syntax`\n- `ulp() syntax`\n\
    - `user input syntax`\n- `valueOf() syntax`\n- `var syntax`\n- `variable syntax`\n\
    - `variable syntax`\n- `void syntax`\n- `volatile sytax`\n- `while syntax`\n-\
    \ `wrapper class syntax`\n\n# Appendix\n\n- Java Keywords\n- Data Type\n- Arithmetic\
    \ Operator\n- Assignment Operators\n- Logical Operators\n- Comparison Operators\n\
    - Conditional Operator\n- Overloading Overriding\n- Default, Public, Protected\n\
    - Abstract Interface\n- Data Type\n- Modifiers\n- Date, File\n- Syntax\n\n# Logical\
    \ Operators\n\n### `&` syntax\n`&` is used for bitwise AND. It returns 1 if both\
    \ bits are set, 0 if one bit is false.\n\ne.g.\n```java\npublic class Main {\n\
    \    public static void main(String[] args) {\n        int x = 100, y = 90, z\
    \ = 60;\n        System.out.println(x & y);\n    }\n}\n```\nOutput: `92`\n\n###\
    \ `|` syntax\n`|` is used for bitwise OR. It returns 1 if one bit is set, 0 if\
    \ all bits are false.\n\ne.g.\n```java\npublic class Main {\n    public static\
    \ void main(String[] args) {\n        int x = 4, y = 6;\n        System.out.println(x\
    \ | y);\n    }\n}\n```\nOutput: `6`\n\n### `^` syntax\n`^` is used for bitwise\
    \ XOR. It returns 1 if bits are different, else it returns 0.\n\ne.g.\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        int\
    \ x = 4, y = 6;\n        System.out.println(x ^ y);\n    }\n}\n```\nOutput: `2`\n\
    \n### `<<` syntax\n`<<` is used for left shift. It shifts all bits by a given\
    \ number of bits.\n\ne.g.\n```java\npublic class Main {\n    public static void\
    \ main(String[] args) {\n        int operand = 2;\n        System.out.println(operand\
    \ << 2);\n    }\n}\n```\nOutput: `8`\n\n### `>>` syntax\n`>>` is used for right\
    \ shift. It shifts all bits by a given number of bits.\n\ne.g.\n```java\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        int operand\
    \ = 8;\n        System.out.println(operand >> 2);\n    }\n}\n```\nOutput: `2`\n\
    \n### `>>>` syntax\n`>>>` is used for unsigned right shift. It shifts all bits\
    \ by a given number of bits. The vacancy in the leftmost position is filled with\
    \ 0.\n\ne.g.\nUnsigned right shift:\n-2 = `11111110` (binary), `-2 >>> 1` returns\
    \ `01111111`\n\n### `abs()` syntax\n`Math.abs(number)` returns the absolute value\
    \ of a number.\n\ne.g.\n```java\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        System.out.println(Math.abs(-168.88));\n        System.out.println(Math.abs(168.88));\n\
    \    }\n}\n```\nOutput:\n`168.88`\n`168.88`\n\n### `abstract` syntax\n`abstract`\
    \ is used in class or method. An abstract class works as a parent class, which\
    \ will be extended by its subclass. The method of the subclass will override the\
    \ abstract method of the abstract class. `abstract class` cannot create any object.\
    \ `abstract method` is used in abstract class only; `abstract method` is an empty\
    \ method without a body.\n\ne.g.\n```java\nabstract class Book { // create an\
    \ abstract class\n    abstract void read(); // create an abstract method\n}\n\n\
    class eBook extends Book { // extend the parent class\n    void read() { // override\
    \ the abstract method\n}\n```\n"
