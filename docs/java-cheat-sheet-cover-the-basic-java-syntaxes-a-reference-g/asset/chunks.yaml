    \    }\n    public static void main(String[ ] args){\n        ThreadClass threadObj\
    \ = new ThreadClass( );\n        threadObj.start( ); // start thread\n    }\n\
    }\n```\n\n# Output:\n```\nThread!\nThread!\nThread!\n```\n\n---\n\n# thread implements\
    \ `runnable` syntax\n\n```java\npublic class MyClass implements Runnable{ }\n\
    ```\n\n`MyClass` needs to implement `Runnable` before creating a thread object\
    \ and running thread tasks\n\ne.g.\n```java\npublic class ThreadClass implements\
    \ Runnable{\n    // implements\n    public void run( ){ // thread body\n     \
    \   for(int n = 0; n<3; n++){\n            System.out.println(\"Thread!\");\n\
    \        }\n    }\n    public static void main(String[ ] args){\n        Thread\
    \ threadObj = new Thread(new ThreadClass( ));\n        threadObj.start( ); //\
    \ start thread\n    }\n}\n```\n\n# Output:\n```\nThread!\nThread!\nThread!\n```\n\
    \n---\n\n# throw syntax\n\n```java\nthrow new Exception(\"message\");\n```\n\n\
    Generate an error and error message.\n\ne.g.\n```java\npublic class Main{\n  \
    \  public static void main(String[] args){\n        System.out.println(100/0);\n\
    \        throw new ArithmeticException(\"/ by zero\");\n    }\n}\n```\n\n# Output:\n\
    ```\nException in thread \"main\" java.lang.ArithmeticException: / by zero\nat\
    \ Main.main(Main.java:5)\n```\n\n---\n\n# throw syntax\n\n```java\ncatch(ArithmeticException\
    \ e){\n    throw e;  \n}\n```\n\nCatch an error from `try` and throw an exception\n\
    \ne.g.\n```java\npublic class Main{\n    static void fun(){\n        try{\n  \
    \          System.out.println(100/0);\n        }\n        catch(ArithmeticException\
    \ e){\n            throw e; // throw an exception\n        }\n    }\n    public\
    \ static void main(String[] args){\n        fun();\n    }\n}\n```\n\n# Output:\n\
