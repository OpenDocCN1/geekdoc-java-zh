  trans: "\n\n# log10() 语法\n\n`Math.log10(number)`\n\n// 返回数字的底数为 10 的对数\n\n例如\n\n\
    ```java\npublic class Main {\n  public static void main(String[] args) {\n   \
    \ // 为 double 类型计算 log10()\n    System.out.println(Math.log10(8.0));\n    // 计算零值的\
    \ log10()\n    System.out.println(Math.log10(0.0));\n  }\n}\n```\n\n// 输出:\n0.9030899869919435\n\
    -Infinity\n\n# log1p() 语法\n\n`Math.log1p(number)`\n\n// 返回数字与 1 之和的自然对数（底为 e）\n\
    \n例如\n\n```java\npublic class Main {\n  public static void main(String[] args)\
    \ {\n    // 为 double 类型计算 log1p()\n    System.out.println(Math.log1p(8.0));\n\
    \    // 计算零值的 log1p()\n    System.out.println(Math.log1p(0.0));\n  }\n}\n```\n\
    \n// 输出:\n2.1972245773362196\n0.0\n\n# long 语法\n\n`long variable`\n\n// 一个从 -9223372036854775808\
    \ 到 9223372036854775807 的数字的数据类型\n\n例如\n\n```java\nlong num = 16816800000L;\n\
    System.out.println(num);\n```\n\n// 输出: 16816800000\n\n# matches() 语法\n\n`str.matches('正则表达式的字符串')`\n\
    \n// 检查字符串是否匹配指定的正则表达式。匹配则返回 true，不匹配则返回 false。\n\n例如\n\n```java\nimport java.io.*;\n\
    public class Main {\npublic static void main(String args[]) {\nString str = new\
    \ String(\"Shell Scripting in 8 Hours\");\nSystem.out.println(str.matches(\"(.*)Scripting(.*)\"\
    ));\nSystem.out.println(str.matches(\"Scripting\"));\nSystem.out.println(str.matches(\"\
    Shell(.*)\"));\nSystem.out.println(str.matches(\"(.*)Hours\"));\n}} // (.*) 表示所有字符和空格\n\
    ```\n\n// 输出: true, false, true, false\n\n# max() 语法\n\n`Math.max(num1, num2)`\n\
    \n// 返回两个数字之间的最大值\n\n例如\n\n```java\npublic class Main {\n  public static void\
    \ main(String[] args) {\n    System.out.println(Math.max(102, 168));\n    // 返回\
    \ 102 和 168 之间的最大值\n  }\n}\n```\n\n// 输出: 168\n\n# 方法语法\n\n`type method_name(\
    \ ){…..};` // 声明一个方法。\n\n`method_name( );` // 调用一个方法。\n\n// 方法是一个可以重复使用的代码块。\n\
    \n例如\n\n```java\npublic class MethClass{\npublic static void main(String args[\
    \ ]){\nmeth( ); } // 调用 “meth”\nstatic void meth( ) { // 声明一个方法\nSystem.out.print(\
    \ \"Here is a method\" );\n}}\n```\n\n// 输出: Here is a method\n\n# 方法与参数语法\n\n\
    `type method_name ( argument ) {……};`\n\n`method_name ( arg );`\n\n// 在调用方法时，可以同时将\
    \ `arg` 传递给方法。\n\n例如\n\n```java\npublic class MethArg{\npublic static void main\
    \ ( String [ ] args ) {\nmeth( \"with param\" );  // 调用 meth 并传递参数\n}\nstatic\
    \ void meth(String argument) { // 声明方法\nSystem.out.print( \"Here is a method \"\
    \ + argument );\n}}\n```\n\n// 输出: Here is a method with param\n\n# min() 语法\n\
    \n`Math.min(num1, num2)`\n\n// 返回两个数字之间的最小值\n\n例如\n\n```java\npublic class Main\
    \ {\n  public static void main(String[] args) {\n    System.out.println(Math.min(102,\
    \ 168));\n    // 返回 102 和 168 之间的最小值\n  }\n}\n```\n\n// 输出: 102\n\n# 模块（module）语法\n\
    \n`module myModuleName { }`\n\n// 声明一个模块\n// Java 模块是 Java 应用程序或 Java API 的包\n\
    \n例如\n\n```java\nmodule myModule {\n  exports myPackage;\n}\n```\n\n// 将 `myPackage`\
    \ 导出以便在 `myModule` 外部使用\n\n# multiplyExact() 语法\n\n`Math.multiplyExact(num1, num2)`\n\
    \n// 返回 `num1` 和 `num2` 的乘积\n\n例如\n\n```java\nclass Main {\n  public static void\
    \ main(String[] args) {\n    System.out.println(Math.multiplyExact(x, y));\n \
    \ }\n}\n```\n\n// 输出: 18\n\n# native 语法\n\n`native()`\n\n// `native` 只是一个修饰符，仅表示该方法是用原生代码实现的\n\
    \n例如\n\n```java\npublic native int method1(int);\npublic native boolean method2(boolean);\n\
    ```\n\n# negate() 语法\n\n`negate(num)`\n\n// 返回 `num` 的符号反转\n\n例如\n\n```java\n\
    class Main {\n  public static void main(String[] args) {\n    int x = 100;\n \
    \   System.out.println(negate(x));\n  }\n}\n```\n\n// 输出: -100\n\n# new 语法\n\n\
    `new Class_name();`\n\n// 创建一个对象\n// 对象是类的实例\n\n例如\n\n```java\nColour obj = new\
    \ Colour(); // 创建对象 `obj`\nobj.co1 = \"red\"; // 对象引用变量 `co1`\nobj.co2 = \"blue\"\
    ; // 对象引用变量 `co2`\nobj.bright(); // 对象引用方法 `bright()`\n```\n\n# offsetByCodePoints()\
    \ 语法\n\n`str.offsetByCodePoints(int index, int codePointOffset)`\n\n// 返回字符串内部的索引，该索引是给定索引的偏移\n\
    // 偏移量基于 `codePointOffset` 的代码点\n// index: 需要偏移的索引。\n// codePointOffset: 代码点单位的偏移量。\n\
    \n例如\n\n```java\nimport java.lang.*;\npublic class Main {\npublic static void\
    \ main(String[] args) {\nString str = \"JavaScript\";\nSystem.out.println(\"The\
    \ String is \" + str);\nint offset = str.offsetByCodePoints(3, 5);\nSystem.out.println(\"\
    The index is \" + offset);\n}\n}\n```\n\n// 输出:\nThe String is JavaScript\nThe\
    \ index is 8\n\n# nextAfter() 语法\n\n`Math.nextAfter(x, y)`\n\n// 返回在 `y` 方向上相邻\
    \ `x` 的数值\n\n例如\n\n```java\npublic class Main {\n  public static void main(String[]\
    \ args) {\n    double x = 6.5;\n    double y = 9.0;\n    System.out.println(Math.nextAfter(x,\
    \ y));\n  }\n}\n```\n\n// 输出: 6.500000000000001\n\n# nextDown() 语法\n\n`Math.nextDown(num)`\n\
    \n// 返回负无穷方向上相邻 `num` 的数值\n\n例如\n\n```java\npublic class Main {\n  public static\
    \ void main(String[] args) {\n    double num = 6.8;\n    System.out.println(Math.nextDown(num));\n\
    \  }\n}\n```\n\n// 输出: 6.799999999999999\n\n# nextUp() 语法\n\n`Math.nextUp(num)`\n\
    \n// 返回正无穷方向上相邻 `num` 的数值\n\n例如\n\n```java\npublic class Main {\n  public static\
    \ void main(String[] args) {\n    double num = 6.8;\n    System.out.println(Math.nextUp(num));\n\
    \  }\n}\n```\n\n// 输出: 6.800000000000001\n\n# 重载（overloading）语法\n\n`public method_name(arg1){\
    \ }`\n\n"
- fmt: "\n```java\npublic method_name(arg2){ }\n```\n\n## Overloading\n\n// Overloading\
    \ means that there are two or more same-name methods in a class, and their arguments\
    \ are different.\n\ne.g.\n\n```java\nclass Colour{\n  String x,y; // declare a\
    \ class\n\n  public Colour ( String a, String b) { x=a; y=b; } // overloading\n\
    \n  public Colour ( ) { x=\"red \"; y=\"blue \";} // overloading\n\n  public static\
    \ void main (String args[ ]) {\n    Colour obj1=new Colour(\"pink \", \"white\
    \ \"); \n    Colour obj2=new Colour( );\n    System.out.println(obj1.x + obj1.y);\n\
    \    System.out.println(obj2.x + obj2.y);\n  }\n}\n```\n\n// Output:\n```\npink\
    \ white\nred blue\n```\n\n---\n\n## Overriding\n\noverriding syntax:\n\n```java\n\
    public method_name(arg){ } // this method in a parent class\npublic method_name(arg){\
    \ } // this method in a child class\n```\n\n// The method of child class can override\
    \ the method of the parent class, if the method name and argument are the same.\n\
    \ne.g.\n\n```java\nclass Parent_Class{\n  int meth( int n ) { return n; } // overriding\n\
    }\n\nclass Child_Class extends Parent_Class{\n  int meth( int n ) { return 100\
    \ + n; } // overriding\n}\n\npublic class OverrideClass {\n  public static void\
    \ main (String args[ ]){\n    Child_Class obj=new Child_Class( );\n    System.out.print(\
    \ obj.meth( 200 ));\n  }\n}\n```\n\n// Output: 300\n\n---\n\n## Package Syntax\n\
    \npackage syntax:\n\n```java\npackage packageName\n```\n\n// Create a package\n\
    \ne.g.\n\n```java\npackage myPackage;\n\npublic class MyClass {\n  public static\
    \ void main(String[] args) {\n    System.out.println(\"This is a package!\");\n\
    \  }\n}\n```\n\n// Output: This is a package!\n\n---\n\n## PI Syntax\n\npi syntax:\n\
    \n### `Math.PI`\n\n// `Math.PI` is a constant that stores the value of pi.\n\n\
    e.g.\n\n```java\npublic class PIRandom{\n  public static void main (String [ ]\
    \ args){\n    double p = Math.PI;\n    System.out.println(\"The PI value is\"\
    \ + p);\n  }\n}\n```\n\n// Output: The PI value is 3.14159265358979\n\n---\n\n\
    ## Polymorphism Syntax\n\npolymorphism syntax:\n\n```java\nclass Parent{ }  //\
    \ parent class\nclass Child1 extends Parent{ }  // child1 class\nclass Child2\
    \ extends Parent{ }  // child2 class\nobj = new Child1( );  // create a child1\
    \ object\nobj = new Child2( );   // create a child2 object\n```\n\n// Polymorphism\
    \ means to that a parent class can be extended by multiple child classes.\n//\
    \ Polymorphism describes the ability to perform different method for different\
    \ objects.\n\ne.g.\n\n```java\nclass Animals{ // parent class\n  void yell( ){\n\
    \    System.out.println(\"yelling......\");\n  }\n}\n\nclass Dogs extends Animals{\
    \ // child class\n  void yell( ){ // overriding\n    System.out.println(\"Woww,\
    \ Woww......\");\n  }\n}\n\nclass Cats extends Animals{ // child class\n  void\
    \ yell( ){ // overriding\n    System.out.println(\"Meaw, Meaw......\");\n  }\n\
    }\n\npublic class PolymorphismClass{   \n  public static void main(String args[\
    \ ]){ // main function\n    Animals animalObj;\n    animalObj = new Dogs( ); //\
    \ create a dog object\n    animalObj.yell( ); // dog object calls yell()\n   \
    \ animalObj = new Cats( ); // create a cat object\n    animalObj.yell( ); // cat\
    \ object calls yell()\n  }\n}\n```\n\n// Output:\n```\nWoww, Woww……\nMeaw, Meaw……\n\
    ```\n\n---\n\n## pow() Syntax\n\npow() syntax:\n\n`Math.pow(x,y)`\n\n// Return\
    \ a value of the `x` raised to the power of the `y`.\n\ne.g.\n\n```java\npublic\
    \ class Main {\n  public static void main(String[] args) {\n    // computes 2\
    \ raised to the power 3\n    System.out.println(Math.pow(2, 3));\n  }\n}\n```\n\
    \n// Output:\n```\n8.0\n```\n\n---\n\n## print() Syntax\n\nprint() syntax:\n\n\
    ### `System.out.print( );` // print the result in the same line.\n### `System.out.println(\
    \ );` // print the result in the different line.\n\ne.g.\n\n### `System.out.print(\
    \ \"A \" );`\n### `System.out.print( \"B \" );`\n`System.out.print( \"C\" );`\n\
    // Output: A B C\n\n### `System.out.println( \"A \" );`\n### `System.out.println(\
    \ \"B \" );`\n`System.out.println( \"C\" );`\n// Output:\n```\nA\nB\nC\n```\n\n\
    ---\n\n## Private Syntax\n\nprivate syntax:\n\n`private` variable/method/consturtor\n\
    \n// An access modifier. The private variables, methods or constructors can only\
    \ be accessed within the declared class\n\ne.g.\n\n```java\npublic class Student\
    \ {\n  private String name = \"Andy\";\n  private String id = \"007hero\";\n \
    \ private int phone = 12345678;\n  public static void main(String[] args) {\n\
    \    Student obj = new Student();\n    System.out.println(\"Name: \" + obj.name);\n\
    \    System.out.println(\"ID: \" + obj.id);\n    System.out.println(\"Phone: \"\
    \ + obj.phone);\n  }\n}\n```\n\n// Output:\n```\nName: Andy\n007hero\n12345678\n\
    ```\n\n---\n\n## Protected Syntax\n\nprotected syntax:\n\n`protected` variable/method/constructor\n\
    \n// An access modifier. The protected variables, methods or constructors only\
    \ be accessed within the same package and subclasses\n\ne.g.\n\n```java\nclass\
    \ Student {\n  protected String name = \"Andy\";\n  protected String id = \"007hero\"\
    ;\n  protected int phone = 12345678;\n}\n\npublic class Classmate extends Student\
    \ {\n  private int age = 18;\n  public static void main(String[] args) {\n   \
    \ Classmate obj = new Classmate();\n    System.out.println(\"Name: \" + obj.name);\n\
    \    System.out.println(\"ID: \" + obj.id);\n    System.out.println(\"Phone: \"\
    \ + obj.phone);\n    System.out.println(\"Age: \" + obj.age);\n  }\n}\n```\n\n\
    // Output:\n```\nName: Andy\n007hero\n12345678\n18\n```\n\n---\n\n## Public Syntax\n\
    \npublic syntax:\n\n`public` variable/method/constructor\n\n// An access modifier.\
    \ The public variables, methods or constructors can be accessed by any classes\n\
    \ne.g.\n\n```java\nclass Student {\n  public String name = \"Andy\";\n  public\
    \ String id = \"007hero\";\n  public int phone = 12345678;\n}\n\npublic class\
    \ Classmate extends Student {\n  private int age = 18;\n  public static void main(String[]\
    \ args) {\n    Classmate obj = new Classmate();\n    System.out.println(\"Name:\
    \ \" + obj.name);\n    System.out.println(\"ID: \" + obj.id);\n    System.out.println(\"\
    Phone: \" + obj.phone);\n    System.out.println(\"Age: \" + obj.age);\n  }\n}\n\
    ```\n\n// Output:\n```\nName: Andy\n007hero\n12345678\n18\n```\n\n---\n\n## Random()\
    \ Syntax\n\nrandom() syntax:\n\n`Math.random()`\n\n// Returns a random number\
    \ between 0.0 and 1.0\n\ne.g.\n\n```java\npublic class Main {\n  public static\
    \ void main(String[] args) {\n    // generates a random number between 0.0 to\
    \ 1.0\n    System.out.println(Math.random());\n  }\n}\n```\n\n// Output: 0.540026663014329\n\
    \n---\n\n## Recursion Syntax\n\nrecursion syntax:\n\n```java\nmyFunction(){\n\
    \  myFunction(); // call myFunction()\n```\n\n// Recursion means that a function\
    \ is called inside itself.\n\ne.g.\n\n```java\npublic class Factorial {\n  static\
    \ int fact( int n ) {\n    if (n != 0) // stop condition\n      return n * fact(n-1);\
    \ // recursive call\n    else\n      return 1;\n  }\n  public static void main(String[]\
    \ args) {\n    int num = 5, result;\n    result = fact(num);\n    System.out.println(num\
    \ + \" factorial is \" + result);\n  }\n}\n```\n\n// Output: 5 factorial is 120\n\
    \n---\n\n## regionMatches()\n\n`regionMatches()`\n\n`str1.regionMatches(int offset1,\
    \ String str2, int offset2, int len)`\n\n// Check if two string regions are equal,\
    \ return true if their regions are equal, return false if not.\n// offset1: the\
    \ beginning offset of the subregion in the string.\n// offset2: the beginning\
    \ offset of the subregion in the string argument.\n\ne.g.\n\n```java\nimport java.io.*;\n\
    public class Main {\n  public static void main(String args[]) {\n    String Str1\
    \ = new String(\"Shell Scripting in 8 Hours\");\n    String Str2 = new String(\"\
    Scripting\");\n    String Str3 = new String(\"SCRIPTING\");\n    System.out.print(\"\
    Return Result: \");\n    System.out.println(Str1.regionMatches(6, Str2, 0, 9));\n\
    \    System.out.print(\"Return Result: \");\n    System.out.println(Str1.regionMatches(6,\
    \ Str3, 0, 9));\n  }\n}\n```\n"
