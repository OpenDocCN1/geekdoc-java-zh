  trans: "\n\n```java\npublic method_name(arg2){ }\n```\n\n## 方法重载 (Overloading)\n\
    \n// 重载意味着类中存在两个或多个同名方法，但它们的参数不同。\n\n例如：\n\n```java\nclass Colour{\n  String x,y;\
    \ // 声明一个类\n\n  public Colour ( String a, String b) { x=a; y=b; } // 重载\n\n  public\
    \ Colour ( ) { x=\"red \"; y=\"blue \";} // 重载\n\n  public static void main (String\
    \ args[ ]) {\n    Colour obj1=new Colour(\"pink \", \"white \"); \n    Colour\
    \ obj2=new Colour( );\n    System.out.println(obj1.x + obj1.y);\n    System.out.println(obj2.x\
    \ + obj2.y);\n  }\n}\n```\n\n// 输出：\n```\npink white\nred blue\n```\n\n---\n\n\
    ## 方法重写 (Overriding)\n\n重写语法：\n\n```java\npublic method_name(arg){ } // 父类中的此方法\n\
    public method_name(arg){ } // 子类中的此方法\n```\n\n// 如果方法名和参数相同，子类的方法可以重写父类的方法。\n\n\
    例如：\n\n```java\nclass Parent_Class{\n  int meth( int n ) { return n; } // 重写\n\
    }\n\nclass Child_Class extends Parent_Class{\n  int meth( int n ) { return 100\
    \ + n; } // 重写\n}\n\npublic class OverrideClass {\n  public static void main (String\
    \ args[ ]){\n    Child_Class obj=new Child_Class( );\n    System.out.print( obj.meth(\
    \ 200 ));\n  }\n}\n```\n\n// 输出：300\n\n---\n\n## 包语法 (Package Syntax)\n\n包的语法：\n\
    \n```java\npackage packageName\n```\n\n// 创建一个包\n\n例如：\n\n```java\npackage myPackage;\n\
    \npublic class MyClass {\n  public static void main(String[] args) {\n    System.out.println(\"\
    This is a package!\");\n  }\n}\n```\n\n// 输出：This is a package!\n\n---\n\n## PI\
    \ 语法 (PI Syntax)\n\nPI 的语法：\n\n### `Math.PI`\n\n// `Math.PI` 是一个存储 π 值的常量。\n\n\
    例如：\n\n```java\npublic class PIRandom{\n  public static void main (String [ ]\
    \ args){\n    double p = Math.PI;\n    System.out.println(\"The PI value is\"\
    \ + p);\n  }\n}\n```\n\n// 输出：The PI value is 3.14159265358979\n\n---\n\n## 多态语法\
    \ (Polymorphism Syntax)\n\n多态的语法：\n\n```java\nclass Parent{ }  // 父类\nclass Child1\
    \ extends Parent{ }  // 子类 1\nclass Child2 extends Parent{ }  // 子类 2\nobj = new\
    \ Child1( );  // 创建一个 child1 对象\nobj = new Child2( );   // 创建一个 child2 对象\n```\n\
    \n// 多态意味着父类可以被多个子类扩展。\n// 多态描述了对对象执行不同方法的能力。\n\n例如：\n\n```java\nclass Animals{\
    \ // 父类\n  void yell( ){\n    System.out.println(\"yelling......\");\n  }\n}\n\
    \nclass Dogs extends Animals{ // 子类\n  void yell( ){ // 重写\n    System.out.println(\"\
    Woww, Woww......\");\n  }\n}\n\nclass Cats extends Animals{ // 子类\n  void yell(\
    \ ){ // 重写\n    System.out.println(\"Meaw, Meaw......\");\n  }\n}\n\npublic class\
    \ PolymorphismClass{   \n  public static void main(String args[ ]){ // 主函数\n \
    \   Animals animalObj;\n    animalObj = new Dogs( ); // 创建一个狗对象\n    animalObj.yell(\
    \ ); // 狗对象调用 yell()\n    animalObj = new Cats( ); // 创建一个猫对象\n    animalObj.yell(\
    \ ); // 猫对象调用 yell()\n  }\n}\n```\n\n// 输出：\n```\nWoww, Woww……\nMeaw, Meaw……\n\
    ```\n\n---\n\n## pow() 语法 (pow() Syntax)\n\npow() 语法：\n\n`Math.pow(x,y)`\n\n//\
    \ 返回 `x` 的 `y` 次。\n\n例如：\n\n```java\npublic class Main {\n  public static void\
    \ main(String[] args) {\n    // 计算 2 的 3 次方\n    System.out.println(Math.pow(2,\
    \ 3));\n  }\n}\n```\n\n// 输出：\n```\n8.0\n```\n\n---\n\n## print() 语法 (print()\
    \ Syntax)\n\nprint() 语法：\n\n### `System.out.print( );` // 在同一行打印结果。\n### `System.out.println(\
    \ );` // 在不同的行打印结果。\n\n例如：\n\n### `System.out.print( \"A \" );`\n### `System.out.print(\
    \ \"B \" );`\n`System.out.print( \"C\" );`\n// 输出：A B C\n\n### `System.out.println(\
    \ \"A \" );`\n### `System.out.println( \"B \" );`\n`System.out.println( \"C\"\
    \ );`\n// 输出：\n```\nA\nB\nC\n```\n\n---\n\n## 私有语法 (Private Syntax)\n\n私有语法：\n\
    \n`private` 变量/方法/构造函数\n\n// 一种访问修饰符。私有变量、方法或构造函数只能在声明的类内部被访问\n\n例如：\n\n```java\n\
    private int x;\nprivate void method() {}\nprivate MyClass() {}\n```\n\n---\n\n\
    ## 受保护语法 (Protected Syntax)\n\n受保护语法：\n\n`protected` 变量/方法/构造函数\n\n// 一种访问修饰符。受保护变量、方法或构造函数只能在声明的类或子类中被访问\n\
    \n例如：\n\n```java\nprotected int x;\nprotected void method() {}\nprotected MyClass()\
    \ {}\n```\n\n---\n\n## 公有语法 (Public Syntax)\n\n公有语法：\n\n`public` 变量/方法/构造函数\n\n\
    // 一种访问修饰符。公共变量、方法或构造函数可以被任何类访问\n\n例如：\n\n```java\npublic int x;\npublic void\
    \ method() {}\npublic MyClass() {}\n```\n\n---\n\n## Random 语法 (Random() Syntax)\n\
    \nrandom 语法：\n\n`Math.random()`\n\n// 返回 0.0 到 1.0 之间的随机数\n\n例如：\n\n```java\n\
    public class Main {\n  public static void main(String[] args) {\n    // 生成 0.0\
    \ 到 1.0 之间的随机数\n    System.out.println(Math.random());\n  }\n}\n```\n\n// 输出：0.54002666301429\n\
    \n---\n\n## 递归语法 (Recursion Syntax)\n\n递归语法：\n\n```java\nmyFunction(){\n  myFunction();\
    \ // 调用 myFunction()\n```\n\n// 递归意味着函数内部调用了自身。\n\n例如：\n\n```java\npublic class\
    \ Factorial {\n  static int fact( int n ) {\n    if (n != 0) // 停止条件\n      return\
    \ n * fact(n-1); // 递归调用\n    else\n      return 1;\n  }\n  public static void\
    \ main(String[] args) {\n    int num = 5, result;\n    result = fact(num);\n \
    \   System.out.println(num + \" factorial is \" + result);\n  }\n}\n```\n\n//\
    \ 输出：5 factorial is 120\n\n---\n\n## regionMatches() 语法 (regionMatches())\n\n\
    `regionMatches()`\n\n`str1.regionMatches(int offset1, String str2, int offset2,\
    \ int len)`\n\n// 检查字符串区域是否相等，如果区域相等则返回 true，否则返回 false。\n// offset1: 字符串中子区域的起始偏移。\n\
    // offset2: 参数字符串中子区域的起始偏移。\n\n例如：\n\n```java\nimport java.io.*;\npublic class\
    \ Main {\n  public static void main(String args[]) {\n    String Str1 = new String(\"\
    Shell Scripting in 8 Hours\");\n    String Str2 = new String(\"Scripting\");\n\
    \    String Str3 = new String(\"SCRIPTING\");\n    System.out.print(\"Return Result:\
    \ \");\n    System.out.println(Str1.regionMatches(6, Str2, 0, 9));\n    System.out.print(\"\
    Return Result: \");\n    System.out.println(Str1.regionMatches(6, Str3, 0, 9));\n\
    \  }\n}\n```\n\n"
