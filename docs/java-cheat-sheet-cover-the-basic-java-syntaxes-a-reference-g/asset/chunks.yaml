  trans: "\n\n// 在创建 `Scanner` 对象之前，你需要先导入 `java.util.Scanner` 类。\n\n例如：\n\n```java\n\
    import java.util.Scanner;\n\npublic class Example{\n  public static void main(String\
    \ args[]){\n    String myStr;\n    Scanner obj = new Scanner(System.in);\n   \
    \ System.out.println(\"Please input your name: \");\n    myStr = obj.nextLine();\n\
    \    System.out.println(\"My name is: \" + myStr);\n  }\n}\n```\n\n// 输出: \nPlease\
    \ input your name:\nMy name is: Ray Yao\n\n---\n\n### instanceof 语法:\n\n```\n\
    object instanceof class\n```\n\n// 如果对象是某个特定类的实例，则返回 true\n\n例如：\n\n```java\n\
    public class Main { \n  public static void main(String[] args) { \n    Main obj\
    \ = new Main(); \n    System.out.println(obj instanceof Main);\n  }\n}\n```\n\
    // 输出:  true\n\n---\n\n### int 语法:\n\n```\nint variable\n```\n\n// 范围从 -2147483648\
    \ 到 2147483647 的数字类型\n\n例如：\n\n```java\nint num = 168168;\nSystem.out.println(num);\
    \ \n```\n// 输出:  168168\n\n---\n\n### interface 语法:\n\n```\nclass MyClass implement\
    \ Interface\n```\n\n// 接口是一种特殊的类，会被类实现。\n// 接口包含一个或多个空方法，这些方法将由类的方法来实现。\n\n例如：\n\
    \n```java\ninterface Book{ // 定义一个接口\n  public void myBook(); // 定义一个空方法\n}\n\n\
    class eBook implements Book{ // 实现接口\n  public void myBook(){ // 实现空方法\n    System.out.println(\"\
    Implement an empty method.\");\n  }\n}\n\npublic class InterfaceExmp {\n  public\
    \ static void main(String[] args) {\n    eBook obj = new eBook();\n    obj.myBook();\n\
    \  }\n}\n```\n// 输出:  Implement an empty method.\n\n---\n\n### intern()\n\n```\n\
    str.intern()\n```\n\n/* 用于从内存中获取字符串，这确保了所有相同的字符串共享相同的内存。*/\n\n```java\npublic\
    \ class InternExample2 { \n  public static void main(String[] args) {        \
    \  \n    String s1 = \"RayYao\"; \n    String s2 = s1.intern(); \n    String s3\
    \ = new String(\"RayYao\");              \n    System.out.println(s1==s2); //\
    \ true \n    System.out.println(s1==s3); // false  \n    System.out.println(s2==s3);\
    \ // false \n  }\n}\n```\n// 输出: true, false, false\n\n---\n\n### isEmpty() 语法:\n\
    \n```\nstr.isEmpty()\n```\n\n// 如果字符串为空则返回 true，否则返回 false。\n\n例如：\n\n```java\n\
    public class Main {\n  public static void main(String[] args) {\n    String str1\
    \ = \"\";\n    String str2 = \"Good\";\n    System.out.println(str1.isEmpty());\n\
    \    System.out.println(str2.isEmpty());\n  }\n}\n```\n// 输出: true, false\n\n\
    ---\n\n### iterator 语法:\n\n```\nIterator<String> it = collection.iterator();\n\
    ```\n\n// 创建一个集合对象\n// Iterator 对象用于遍历集合\n\n例如：\n\n```java\nimport java.util.LinkedList;\n\
    import java.util.Iterator;\n\npublic class Main {\n  public static void main(String[]\
    \ args) {\n    LinkedList<String> colors = new LinkedList<String>();\n    colors.add(\"\
    Red\"); // 添加一个元素\n    colors.add(\"Yellow\");\n    colors.add(\"Green\");\n \
    \   System.out.println(colors); // 显示元素值\n    Iterator<String> it = colors.iterator();\
    \ // 创建一个 LinkedList 对象\n    while(it.hasNext()) { 遍历\n      System.out.println(it.next());\n\
    \    }\n  }\n}\n```\n// 输出:\n[Red, Yellow, Green]\nRed\nYellow\nGreen\n\n---\n\
    \n### lambda 语法:\n\n```\n(parameter1, parameter2) -> expression\n```\n\n/* Lambda\
    \ 表达式是一个匿名函数；它是一个可以返回值的简短代码块。 */\n\n例如：\n\n```java\nimport java.lang.FunctionalInterface;\n\
    \ninterface MyClass{ // 接口\n  double piValue(); // 抽象方法\n}\n\npublic class Main\
    \ {\n  public static void main(String[] args ) {\n    MyClass refer; // 声明对 MyClass\
    \ 的引用\n    refer = () -> 3.1415; // lambda 表达式\n    System.out.println(\"The Pi\
    \ value is \" + refer.piValue());\n  }\n}\n```\n// 输出: The Pi value is 3.1415\n\
    \n---\n\n### lastIndexOf() 语法:\n\n```\nstr.lastIndexOf('string') or str.lastIndexOf('character')\n\
    ```\n\n// 返回指定字符串或字符在字符串中一次出现的索引\n\n例如：\n\n```java\npublic class Main {\n  public\
    \ static void main(String[] args) {\n    String str = \"This book is a good book\"\
    ;\n    System.out.println(str.lastIndexOf(\"book\"));\n  }\n}\n```\n// 输出:  20\n\
    \n---\n\n### length() 语法:\n\n```\nstr.length()\n```\n\n// 返回字符串的长度\n\n例如：\n\n\
    ```java\npublic class Main {\n  public static void main(String[] args) {\n   \
    \ String str = \"This book is a good book\";\n    System.out.println(str.length());\n\
    \  }\n}\n```\n// 输出:  23\n\n---\n\n### LinkedList 语法:\n\n```\nLinkedList<String>\
    \ obj = new LinkedList<>();\n```\n\n// 创建一个 LinkedList 对象\n// LinkedList 类是可调整的\n\
    \n例如：\n\n```java\nimport java.util.LinkedList;\n\npublic class Main {\n  public\
    \ static void main(String[] args) {\n    LinkedList<String> colors = new LinkedList<>();\n\
    \    colors.add(\"Red\"); // 添加一个元素\n    colors.add(\"Yellow\");\n    colors.add(\"\
    Green\");\n    System.out.println(colors); // 显示元素值\n    Iterator<String> it =\
    \ colors.iterator(); // 创建一个 LinkedList 对象\n    while(it.hasNext()) { 遍历\n   \
    \   System.out.println(it.next());\n    }\n  }\n}\n```\n// 输出: \n[Red, Yellow,\
    \ Green]\nRed\nYellow\nGreen\n\nobj.addFirst(\"value\"); // 在开头添加元素\nobj.addLast(\"\
    value\"); // 在末尾添加元素\nobj.getFirst(); // 获取第一个元素\nobj.getLast(); // 获取最后一个元素\n\
    obj.removeFirst(); // 删除第一个元素\nobj.removeLast(); // 删除最后一个元素\nobj.clear(); //\
    \ 清空所有元素\nobj.size(); // 获取大小\nobj.set(index, element); // 设置指定索引的值\nobj.get(index);\
    \ // 获取指定索引的值\nobj.contains(object); // 判断是否包含某个元素\nobj.indexOf(object); // 获取元素首次出现的索引\n\
    obj.lastIndexOf(object); // 获取元素最后一次出现的索引\n\n---\n\n### Array 语法:\n\n```\nint[]\
    \ arr = new int[5];\n```\n\n// 创建一个数组\n// 数组是固定长度的\n\n例如：\n\n```java\npublic class\
    \ Main {\n  public static void main(String[] args) {\n    int[] arr = new int[3];\n\
    \    arr[0] = 10;\n    arr[1] = 20;\n    arr[2] = 30;\n    System.out.println(arr[0]);\n\
    \  }\n}\n```\n// 输出: 10\n\n---\n\n### for 循环 语法:\n\n```\nfor (int i = 0; i < 5;\
    \ i++) {\n  // 代码块\n}\n```\n\n// 重复执行代码块\n\n例如：\n\n```java\npublic class Main\
    \ {\n  public static void main(String[] args) {\n    for (int i = 0; i < 3; i++)\
    \ {\n      System.out.println(i);\n    }\n  }\n}\n```\n// 输出:\n0\n1\n2\n\n---\n\
    \n### 增强型循环 (for-each) 语法:\n\n```\nfor (Type item : collection) {\n  // 代码块\n\
    }\n```\n\n// 用于遍历集合或数组\n\n例如：\n\n```java\npublic class Main {\n  public static\
    \ void main(String[] args) {\n    String[] fruits = {\"Apple\", \"Banana\", \"\
    Cherry\"};\n    for (String fruit : fruits) {\n      System.out.println(fruit);\n\
    \    }\n  }\n}\n```\n// 输出:\nApple\nBanana\nCherry\n\n---\n\n### while 循环 语法:\n\
    \n```\nwhile (condition) {\n  // 代码块\n}\n```\n\n// 只要条件为真，就执行代码块\n\n例如：\n\n```java\n\
    public class Main {\n  public static void main(String[] args) {\n    int i = 0;\n\
    \    while (i < 3) {\n      System.out.println(i);\n      i++;\n    }\n  }\n}\n\
    ```\n// 输出:\n0\n1\n2\n\n---\n\n### do-while 循环 语法:\n\n```\ndo {\n  // 代码块\n} while\
    \ (condition);\n```\n\n// 至少执行一次代码块，然后检查条件\n\n例如：\n\n```java\npublic class Main\
    \ {\n  public static void main(String[] args) {\n    int i = 0;\n    do {\n  \
    \    System.out.println(i);\n      i++;\n    } while (i < 3);\n  }\n}\n```\n//\
    \ 输出:\n0\n1\n2\n\n"
- fmt: "\n# log10() syntax\n\n`Math.log10(number)`\n\n// Return the base 10 logarithm\
    \ of a number\n\ne.g.\n\n```java\npublic class Main {\n  public static void main(String[]\
    \ args) {\n    // compute log10() for a double value\n    System.out.println(Math.log10(8.0));\n\
    \    // compute log10() for zero value\n    System.out.println(Math.log10(0.0));\n\
    \  }\n}\n```\n\n// Output:\n0.9030899869919435\n-Infinity\n\n# log1p() syntax\n\
    \n`Math.log1p(number)`\n\n// Return the natural logarithm (base e) of the sum\
    \ of the number and 1\n\ne.g.\n\n```java\npublic class Main {\n  public static\
    \ void main(String[] args) {\n    // compute log1p() for a double value\n    System.out.println(Math.log1p(8.0));\n\
    \    // compute log1p() for zero value\n    System.out.println(Math.log1p(0.0));\n\
    \  }\n}\n```\n\n// Output:\n2.1972245773362196\n0.0\n\n# long syntax\n\n`long\
    \ variable`\n\n// A data type of the numbers from -9223372036854775808 to 9223372036854775808\n\
    \ne.g.\n\n```java\nlong num = 16816800000L;\nSystem.out.println(num);\n```\n\n\
    // Output: 16816800000\n\n# matches() syntax\n\n`str.matches('string with regular\
    \ expression')`\n\n// Check whether or not a string matches the specified regular\
    \ expression. Return true if match, return false if not.\n\ne.g.\n\n```java\n\
    import java.io.*;\npublic class Main {\npublic static void main(String args[])\
    \ {\nString str = new String(\"Shell Scripting in 8 Hours\");\nSystem.out.println(str.matches(\"\
    (.*)Scripting(.*)\"));\nSystem.out.println(str.matches(\"Scripting\"));\nSystem.out.println(str.matches(\"\
    Shell(.*)\"));\nSystem.out.println(str.matches(\"(.*)Hours\"));\n}} // (.*) means\
    \ all characters and spaces\n```\n\n// Output: true, false, true, false\n\n# max()\
    \ syntax\n\n`Math.max(num1, num2)`\n\n// Return the largest value between two\
    \ numbers\n\ne.g.\n\n```java\npublic class Main {\n  public static void main(String[]\
    \ args) {\n    System.out.println(Math.max(102, 168));\n    // return the max\
    \ value between 102 and 168\n  }\n}\n```\n\n// Output: 168\n\n# method syntax\n\
    \n`type method_name( ){…..};` // declares a method.\n\n`method_name( );` // calls\
    \ a method.\n\n// The Method is a code block that can be repeated using.\n\ne.g.\n\
    \n```java\npublic class MethClass{\npublic static void main(String args[ ]){\n\
    meth( ); } // call “meth”\nstatic void meth( ) { // declare a method\nSystem.out.print(\
    \ \"Here is a method\" );\n}}\n```\n\n// Output: Here is a method\n\n# method\
    \ & argument syntax\n\n`type method_name ( argument ) {……};`\n\n`method_name (\
    \ arg );`\n\n// When calling a method, the `arg` can be passed to the method at\
    \ the same time.\n\ne.g.\n\n```java\npublic class MethArg{\npublic static void\
    \ main ( String [ ] args ) {\nmeth( \"with param\" );  // call meth & pass an\
    \ argument\n}\nstatic void meth(String argument) { // declare method\nSystem.out.print(\
    \ \"Here is a method \" + argument );\n}}\n```\n\n// Output: Here is a method\
    \ with param\n\n# min() syntax\n\n`Math.min(num1, num2)`\n\n// Return the smallest\
    \ value between two numbers\n\ne.g.\n\n```java\npublic class Main {\n  public\
    \ static void main(String[] args) {\n    System.out.println(Math.min(102, 168));\n\
    \    // return the min value between 102 and 168\n  }\n}\n```\n\n// Output: 102\n\
    \n# module syntax\n\n`module myModuleName { }`\n\n// Declares a module\n// A Java\
    \ module is the package of a Java application or Java API\n\ne.g.\n\n```java\n\
    module myModule {\n  exports myPackage;\n}\n```\n\n// Make `myPackage` exported\
    \ so that it can be used outside of the `myModule`\n\n# multiplyExact() syntax\n\
    \n`Math.multiplyExact(num1, num2)`\n\n// Return the product of `num1` and `num2`\n\
    \ne.g.\n\n```java\nclass Main {\n  public static void main(String[] args) {\n\
    \    System.out.println(Math.multiplyExact(x, y));\n  }\n}\n```\n\n// Output:\
    \ 18\n\n# native syntax\n\n`native()`\n\n// `native` is a modifier only indicate\
    \ that the method is implemented in native code\n\ne.g.\n\n```java\npublic native\
    \ int method1(int);\npublic native boolean method2(boolean);\n```\n\n# negate()\
    \ syntax\n\n`negateExact(num)`\n\n// Return the reversed sign of `num`\n\ne.g.\n\
    \n```java\nclass Main {\n  public static void main(String[] args) {\n    int x\
    \ = 100;\n    System.out.println(negateExact(x));\n    int y = 200;\n    System.out.println(negateExact(y));\n\
    \  }\n}\n```\n\n// Output: -100, -200\n\n# new syntax\n\n`Class = new();`\n\n\
    // Create a new object\n\ne.g.\n\n```java\npublic class Main {\n  public static\
    \ void main(String[] args) {\n    int num = 10;\n    System.out.println(num);\n\
    \  }\n}\n```\n\n// Output: 10\n\n# nextAfter() syntax\n\n`Math.nextAfter(x, y)`\n\
    \n// Return a number adjacent to `x` in the direction of `y`\n\ne.g.\n\n```java\n\
    public class Main {\n  public static void main(String[] args) {\n    double x\
    \ = 6.5;\n    double y = 9.0;\n    System.out.println(Math.nextAfter(x, y));\n\
    \  }\n}\n```\n\n// Output: 6.50000000000001\n\n# nextDown() syntax\n\n`Math.nextDown(num)`\n\
    \n// Return a number adjacent to `num` in the direction of negative infinity.\n\
    \ne.g.\n\n```java\npublic class Main {\n  public static void main(String[] args)\
    \ {\n    float num1 = 6.8;\n    System.out.println(Math.nextDown(num1));\n   \
    \ double num2 = 6.8;\n    System.out.println(Math.nextDown(num2));\n  }\n}\n```\n\
    \n// Output: 6.799999, 6.79999999999999\n\n# nextUp() syntax\n\n`Math.nextUp(num)`\n\
    \n// Return a number adjacent to `num` in the direction of positive infinity.\n\
    \ne.g.\n\n```java\npublic class Main {\n  public static void main(String[] args)\
    \ {\n    float num1 = 6.8;\n    System.out.println(Math.nextUp(num1));\n    double\
    \ num2 = 6.8;\n    System.out.println(Math.nextUp(num2));\n  }\n}\n```\n\n// Output:\
    \ 6.8000007, 6.80000000000001\n\n# object syntax\n\n`obj = new Class_name();`\n\
    \n// Create an object\n// An object is an instance of a class.\n\ne.g.\n\n```java\n\
    Colour obj = new Colour(); // create an object `obj`\nobj.co1 = \"red\"; // an\
    \ object references a variable `co1`\nobj.co2 = \"blue\"; // an object references\
    \ a variable `co2`\nobj.bright(); // an object references a method `bright()`\n\
    ```\n\n# offsetByCodePoints() syntax\n\n`str.offsetByCodePoints(int index, int\
    \ codePointOffset)`\n\n// Returns an index within a String, this index is the\
    \ offset from the given index\n// The offset is based on the `codePointOffset`'s\
    \ code points\n// index: The index to be offset.\n// codePointOffset: The offset\
    \ in code points.\n\ne.g.\n\n```java\nimport java.lang.*;\npublic class Main {\n\
    public static void main(String[] args) {\nString str = \"JavaScript\";\nSystem.out.println(\"\
    The String is \" + str);\nint offset = str.offsetByCodePoints(3, 5);\nSystem.out.println(\"\
    The index is \" + offset);\n}\n}\n```\n\n// Output:\nThe String is JavaScript\n\
    The index is 8\n\n# overloading syntax\n\n`public method_name(arg1){ }`\n"
