    \  }\n}\n```\n\n// 输出:\n```\nPython Syntax Book\n```\n\n# 变量语法（先声明后赋值）\n\n```java\n\
    type variableName;\nvariable = value;\n```\n\n// 要定义一个变量，我们必须指定类型并为变量分配值。\n\n\
    e.g.\n\n```java\npublic class Main {\n  public static void main(String[] args)\
    \ {\nint num; // 声明变量 'num'\n    num = 100;\n    System.out.println(num);\n  }\n\
    }\n```\n\n// 输出: 100\n\n# void 语法\n\n```java\nvoid method(){…}\n```\n\n// 指定一个没有返回类型的方法\n\
    \ne.g.\n\n```java\npublic class Main {\n  static void fun() {\n    System.out.println(\"\
    Scala in 8 Hours\");\n  }\n  public static void main(String[] args) {\n    fun();\n\
    \  }\n}\n```\n\n// 输出: Scala in 8 Hours\n\n# volatile 语法\n\n```java\nvolatile\
    \ type variable = value;\n```\n\n// 使变量值在线程间可见且不可缓存。\n// 确保变量值可以被多个线程读取、写入和修改\n\
    \ne.g.\n\n```java\npublic class MyClass {\n    public volatile int counter = 0;\n\
    }\n```\n\n// 变量 `counter` 可以被其他线程读取或写入\n\n# while 语法\n\n```java\nwhile (condition)\
    \ {\n  code\n}\n```\n\n// while 循环在条件为真时持续运行代码。\n\ne.g.\n\n```java\nint n = 1;\n\
    \    while (n < 6) {\n      System.out.print(n);\n      n++;\n}\n```\n\n// 输出:\
    \ 12345\n\n# 包装类语法\n\n```java\nWrapper_class variable = value; // 创建一个包装对象\n```\n\
    \n// 包装类意味着 Byte, Short, Integer, Long, Float, Double, Boolean, Character, ArrayList,\
    \ LinkedList, HashMap, HashSet 类。\n// 我们必须使用包装类来创建包装对象。\n\ne.g.\n\n```java\npublic\
    \ class Main {\n  public static void main(String[] args) {\nInteger i = 100; //\
    \ Integer 是一个包装类\nDouble d = 100.88; // Double 是一个包装类\nString s = \"good\"; //\
    \ String 是一个包装类\n    System.out.println(i);\n    System.out.println(d);\n    System.out.println(s);\n\
    }}\n```\n\n// 输出: 100    100.88    good\n\n# 录\n\n## Java 关键字\n\n| | |\n| :---\
