    \n### 字符串连接语法\n\n```java\nstr = str1 + str2;\n```\n```java\nstr = str1.concat(str2);\n\
    ```\n// `+` 可以连接两个字符串。\n// `concat()` 可以连接两个字符串。\n\ne.g.\n```java\nString s1 =\
    \ \"Hello\"; String s2 = \"Friends\";\nSystem.out.print(s1 + s2); // 连接两个字符串\n\
    System.out.print(s1.concat (s2)); // 连接两个字符串\n```\n// 输出: Hello Friends\n// 输出:\
    \ Hello Friends\n\n------------------------------------------------------------------------------\n\
    \n### StringBuffer 语法\n\n```java\nStringBuffer str = new StringBuffer();\n```\n\
    // 创建一个 `StringBuffer` 对象。\n// `StringBuffer` 代表一个值可以动态改变的字符串。\n\ne.g.\n```java\n\
    StringBuffer str = new StringBuffer (\"abcde\");\nstr.insert (2, \"1234\"); //\
    \ 输出: abc1234de\nstr.append (\"5678\"); // 输出: abc1234de5678\nstr.reverse ();\
    \ // 输出: 8765ed4321cba\n```\n// `StringBuffer str = new StringBuffer (\"abcde\"\
    \ )` 创建了一个对象 `str`，其值为 `\"abcde\"`。\n\n------------------------------------------------------------------------------\n\
    \n### subSequence() 语法\n\n```java\nstr.subSequence(startIndex, endIndex)\n```\n\
    // 从字符串返回返回字符序列\n\ne.g.\n```java\npublic class Main {\n  public static void main(String[]\
    \ args) {\n    String str = \"Shell Scripting in 8 Hours\";\n    System.out.println(str.subSequence(6,\
    \ 15));\n  }\n}\n```\n// 输出: Scripting\n\n------------------------------------------------------------------------------\n\
    \n### subString() 语法\n\n```java\nstr.substring(startIndex)\n```\n```java\nstr.substring(startIndex,\
    \ int endIndex)\n```\n// 返回字符串的子字符串\n\ne.g.\n```java\npublic class Main{ \n  public\
    \ static void main(String args[]){ { \n    String str=\"Shell Scripting in 8 Hours\"\
    ; \n    System.out.println(str.substring(6)); \n    System.out.println(str.substring(6,\
    \ 15)); \n  }\n}\n```\n// 输出:\nScripting in 8 Hours\nScripting\n\n------------------------------------------------------------------------------\n\
    \n### subtractExact() 语法\n\n```java\nMath.subtractExact(num1, num2)\n```\n// 返回\
    \ `num1` 和 `num2` 之间的差\n\ne.g.\n```java\nclass Main {\n  public static void main(String[]\
    \ args) {\n    int x = 100;\n    int y = 20;\n    System.out.println(Math.subtractExact(x,\
    \ y)); \n  }\n}\n```\n// 输出: 80\n\n------------------------------------------------------------------------------\n\
    \n### super 语法\n\n```java\nsuper.method or super.variable\n```\n// `super` 代表父类的对象\n\
    \ne.g.\n```java\nclass Book { // 父类\n  public void title() {\n    System.out.println(\"\
    Ray Yao's Books\");\n  }\n}\nclass eBook extends Book { // 子类\n  public void title()\
    \ {\n    super.title(); // 调用父类方法\n    System.out.println(\"C# Syntax Chart\"\
    );\n  }\n}\n\npublic class Main {\n  public static void main(String[] args) {\n\
    \    Book myeBook = new eBook();\n    myeBook.title(); // 调用子类方法\n  }\n}\n```\n\
    // 输出:\nRay Yao's Books\nC# Syntax Chart\n\n------------------------------------------------------------------------------\n\
    \n### super 语法\n\n```java\nsuper ( argument );\n```\n// 在子类中，`super` 用于调用父类的构造函数。\n\
    \ne.g.\n```java\nclass Parent_Class{\n  Parent_Class (int m, int n){ // 构造函数\n\
    \    this.m=m;  this.n=n;\n  }\n}\nclass Child_Class extends Parent_Class{\n \
    \ Child_Class(int m, int n){ // 构造函数\n    super ( m,n ); // 调用父类的构造函数\n  }\n}\n\
    ```\n// `super ( argument );` 放置在子类构造函数的第一行，用于调用父类的构造函数。\n\n------------------------------------------------------------------------------\n\
    \n### switch 语法\n\n```java\nswitch (condition) {\n  case value1:\n    statement;\n\
    \    break;\n  case value2:\n    statement;\n    break;\n  case value3:\n    statement;\n\
    \    break;\n  default:\n    statement;\n}\n```\n// `switch` 满足条件时\n\n```java\n\
    int weekday = 2;\nswitch (weekday) {\n  case 1:\n    System.out.println(\"Monday\"\
    );\n    break;\n  case 2:\n    System.out.println(\"Tuesday\");\n    break;\n\
    \  case 3:\n    System.out.println(\"Wednesday\");\n    break;\n  default:\n \
    \   System.out.println(\"Invalid weekday\");\n}\n```\n// 输出: Tuesday\n\n------------------------------------------------------------------------------\n\
    \n### switch 语法\n\n```java\nswitch (expression) {\n  case value1:\n    statement;\n\
    \    break;\n  case value2:\n    statement;\n    break;\n  case value3:\n    statement;\n\
    \    break;\n  default:\n    statement;\n}\n```\n// `switch` 匹配表达式\n\n```java\n\
    String fruit = \"Apple\";\nswitch (fruit) {\n  case \"Apple\":\n    System.out.println(\"\
    Apple\");\n    break;\n  case \"Banana\":\n    System.out.println(\"Banana\");\n\
    \    break;\n  case \"Cherry\":\n    System.out.println(\"Cherry\");\n    break;\n\
    \  default:\n    System.out.println(\"Unknown fruit\");\n}\n```\n// 输出: Apple\n\
    \n------------------------------------------------------------------------------\n\
    \n### synchronized 语法\n\n```java\nsynchronized method() {\n  statement\n}\n```\n\
    // `synchronized` 饰符指定方法一次只有一个线程访问\n\n```java\npublic class MyClass {\n  public\
    \ synchronized void method() {\n    // 语句\n  }\n}\n```\n\n------------------------------------------------------------------------------\n\
    \n### synchronized 语法\n\n```java\nsynchronized (object) {\n  statement\n}\n```\n\
    // `synchronized` 块指定代码块一次只有一个线程访问\n\n```java\npublic class MyClass {\n  public\
    \ void method() {\n    synchronized (this) {\n      // 语句\n    }\n  }\n}\n```\n\
    \n------------------------------------------------------------------------------\n\
    \n### volatile 语法\n\n```java\nvolatile boolean variable\n```\n// `volatile` 饰符确保变量的值总是从主内存中读取\n\
    \n```java\npublic class MyClass {\n  volatile boolean flag = false;\n  public\
    \ void setFlag() {\n    flag = true;\n  }\n  public boolean getFlag() {\n    return\
    \ flag;\n  }\n}\n```\n\n------------------------------------------------------------------------------\n\
    \n### final 语法\n\n```java\nfinal int VARIABLE\n```\n// `final` 饰符表示变量一旦后不能被修改\n\
    \n```java\npublic class MyClass {\n  final int CONSTANT = 10;\n  public void method()\
    \ {\n    // CONSTANT = 20; // 编译错误\n  }\n}\n```\n\n```java\nfinal class Class\
    \ { }\n```\n// `final` 饰符表示类不能被继承\n\n```java\nfinal void method() { }\n```\n//\
    \ `final` 饰符表示方法不能被重写\n\n"
