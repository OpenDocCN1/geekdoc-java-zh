    - `user input 语法`\n- `valueOf() 语法`\n- `var 语法`\n- `variable 语法`\n- `variable\
    \ 语法`\n- `void 语法`\n- `volatile sytax`\n- `while 语法`\n- `wrapper class 语法\n\n\
    # 附录\n\n- Java 关键字\n- 数据类型\n- 算术运算符\n- 赋值运算符\n- 逻辑运算符\n- 比较运算符\n- 条件运算符\n- 重载与重写\n\
    - 默认、公共、受保护\n- 抽象、接口\n- 数据类型\n- 修饰符\n- 日期、文件\n- 语法\n\n# 逻辑运算符\n\n### `&` 语法\n\
    `&` 用于位与运算。如果两个位都为 1，则返回 1；如果其中一位为假，返回 0。\n\n例如：\n```java\npublic class Main {\n\
    \    public static void main(String[] args) {\n        int x = 100, y = 90, z\
    \ = 60;\n        System.out.println(x & y);\n    }\n}\n```\n输出：`92`\n\n### `|`\
    \ 语法\n`|` 用于位或运算。如果其中一个位为 1，则返回 1；如果所有位均为假，返回 0。\n\n例如：\n```java\npublic class\
    \ Main {\n    public static void main(String[] args) {\n        int x = 4, y =\
    \ 6;\n        System.out.println(x | y);\n    }\n}\n```\n输出：`6`\n\n### `^` 语法\n\
    `^` 用于位异异运算。如果位不同，则返回 1，否则返回 0。\n\n例如：\n```java\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        int x = 4, y = 6;\n        System.out.println(x\
    \ ^ y);\n    }\n}\n```\n输出：`2`\n\n### `<<` 语法\n`<<` 用于左移。它将所有位向左移动指定的位数。\n\n例如：\n\
    ```java\npublic class Main {\n    public static void main(String[] args) {\n \
    \       int operand = 2;\n        System.out.println(operand << 2);\n    }\n}\n\
    ```\n输出：`8`\n\n### `>>` 语法\n`>>` 用于右移。它将所有位向右移动指定的位数。\n\n例如：\n```java\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        int operand\
    \ = 8;\n        System.out.println(operand >> 2);\n    }\n}\n```\n输出：`2`\n\n###\
    \ `>>>` 语法\n`>>>` 用于无符号右移。它将所有位向右移动指定的位数。左侧的空位用 0 填充。\n\n例如：\n无符号右移：\n-2 = `11111110`（二进制），`-2\
    \ >>> 1` 返回 `01111111`\n\n### `abs()` 语法\n`Math.abs(number)` 返回数字的绝对值。\n\n例如：\n\
    ```java\npublic class Main {\n    public static void main(String[] args) {\n \
    \       System.out.println(Math.abs(-168.88));\n        System.out.println(Math.abs(168.88));\n\
    \    }\n}\n```\n输出：\n`168.88`\n`168.88`\n\n### `abstract` 语法\n`abstract` 用于类或方法。抽象类作为父类工作，可被子类扩展。子类的方法将重写抽象类的抽象方法。`abstract\
    \ class` 无法创建任何对象。`abstract method` 仅用于抽象类；它是没有方法体的空方法。\n\n```java\nabstract class\
    \ Book { // 创建一个抽象类\n    abstract void read(); // 创建一个抽象方法\n}\n\nclass eBook extends\
    \ Book { // 扩展父类\n    void read() { // 重写抽象方法\n```"
- fmt: "\n```java\nSystem.out.println(\"I override that abstract method.\");\n}\n\n\
    public class AbstractDemo {\n    public static void main(String[] args) {\n  \
    \      eBook obj = new eBook();\n        obj.read();\n    }\n}\n```\n// Output:\
    \ I override that abstract method.\n\n---\n\n### acos() syntax\n\n`Math.acos(number)`\n\
    \n// Return the arc cosine value of a number\n\ne.g.\n```java\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        System.out.println(Math.acos(0.88));\n\
    \        System.out.println(Math.acos(-0.88));\n        System.out.println(Math.acos(0));\n\
    \        System.out.println(Math.acos(-1));\n        System.out.println(Math.acos(1));\n\
    \    }\n}\n```\n// Output:\n0.4949341263408955\n2.646658527248898\n1.5707963267948966\n\
    3.141592653589793\n0.0\n\n---\n\n### addExact() syntax\n\n`Math.addExact(num1,\
    \ num2)`\n\n// Returns the sum of two numbers\n\ne.g.\n```java\nclass Main {\n\
    \    public static void main(String[] args) {\n        int x = 36;\n        int\
    \ y = 52;\n        System.out.println(Math.addExact(x, y)); \n    }\n}\n```\n\
    // Output: 88\n\n---\n\n### arithmetic operator syntax\n\nArithmetic operators\
    \ mean `+`, `-`, `*`, `/`, `%`, `++`, `--`\n\n// `%` gets a remainder.\n// `++`\
    \ increases 1\n// `--` decreases 1.\n\ne.g.\n```java\npublic class Main {\n  \
    \  public static void main(String[] args) {\n        int x1 = 10; int y1 = 2;\n\
    \        System.out.println(x1 + y1); // 10+2=12\n        int x2 = 10; int y2\
    \ = 2;\n        System.out.println(x2 - y2); // 10-2=8\n        int x3 = 10; int\
    \ y3 = 2;\n        System.out.println(x3 * y3); // 10*2=20\n        int x4 = 10;\
    \ int y4 = 2;\n        System.out.println(x4 / y4); // 10/2=5\n        int x5\
    \ = 10; int y5 = 2;\n        System.out.println(x5 % y5); // 10%2=0\n        int\
    \ x6 = 10;\n        System.out.println(++x6); // 10+1=11\n        int x7 = 10;\n\
    \        System.out.println(--x7); // 10-1=9\n    }\n}\n```\n\n---\n\n### array\
    \ syntax\n\n`int array-name[] = {\"value0\", \"value1\", \"value2\",…};`\n\n//\
    \ Create an array\n\ne.g.\n```java\nint arr[] = { 10, 11, 12, 13 }; // create\
    \ an array\n```\n// The above code creates an array named `arr`, which has four\
    \ elements:\n- Number 0 element is `arr[0]` with value 10. Key is 0.\n- Number\
    \ 1 element is `arr[1]` with value 11. Key is 1.\n- Number 2 element is `arr[2]`\
    \ with value 12. Key is 2.\n- Number 3 element is `arr[3]` with value 13. Key\
    \ is 3.\n\nIn the array, Key’s alias is “index”. Index’s alias is “key”.\nNote\
    \ that index begins from 0.\n\n---\n\n### array syntax\n\n- `int array-name[]\
    \ = new int [number of elements];`\n- `int array-name[index0] = \"value0\";`\n\
