    \ |\n| do | |\n| double | |\n| else | |\n| extends | |\n| false | |\n| final |\
    \ |\n| finally | |\n| float | |\n| for | |\n| if | |\n| implements | |\n| import\
    \ | |\n| int | |\n| interface | |\n| new | |\n| null | |\n| package | |\n| private\
    \ | |\n| protected | |\n| public | |\n| return | |\n| static | |\n| String | |\n\
    | super | |\n| switch | |\n| this | |\n| throw(s) | |\n| true | |\n| try | |\n\
    | void | |\n| while | |\n\n## 数据类型\n\n| 数据类型 | 大小 |  |\n| :--- | :--- | :--- |\n\
    | byte | 1 byte | -128 到 127 的整数 |\n| short | 2 bytes | -32,768 到 32,767 的整数 |\n\
