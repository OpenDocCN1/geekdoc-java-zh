  \ 类用于处理输出流。\n- `new FileOutputStream(file_name)` 创建一个输出流。\n- `System.in.read()`\
  \ 从键盘读取输入的字符。\n- `fout.write()` 将字符写入文件。\n\n例如：\n（假设我们要在 `D:` 盘中写入一个文件 “myFile.txt”）\n\
  \n```java\nimport java.io.*;\n\npublic class OutputFile {\n    public static void\
  \ main(String[] args) {\n        char ch;\n        try {\n            FileOutputStream\
  \ fout = new FileOutputStream(\"D:\\\\myFile.txt\");\n            System.out.println(\"\
  请输入一个句子，以 # 键结束并按回车:\");\n            while ((ch = (char)System.in.read()) != '#')\
  \ /*从键盘读取输入的字符*/\n                fout.write(ch); // 将字符写入文件\n            fout.close();\n\
  \        } catch (FileNotFoundException e) {\n            System.err.println(e);\n\
  \        } catch (IOException e) {\n            System.err.println(e);\n       \
  \ }\n    }\n}\n```\n// （ 运行程序，并在键盘上输入 “PHP in 8 Hours!” ）\n// 结果：\n// 请检查 `D:` 盘中的\
  \ `myFile.txt`，你会发现内容是 “PHP in 8 Hours!”。\n\n---\n\n## final syntax\n\n### `final\
  \ class/variable/method`\n- 修饰符使类/变量/方法不可更改、不可继承且不可重写。\n\n例如：\n```java\npublic class\
  \ Main {\n    final int n = 100;\n    public static void main(String[] args) {\n\
  \        Main obj = new Main();\n        obj.n = 200; // 错误！\n        System.out.println(obj.n);\n\
  \    }\n}\n```\n// 输出：（ 错误信息…… ）\n\n### `final class` 语法\n- `final` 是一个关键字。\n- `final\
  \ class` 意味着该类不能被扩展。\n\n例如：\n```java\nfinal class FnClass { // 声明 final 类\n    //……\n\
  }\n\nclass SubClass extends FnClass { // 错误！无法继承\n    //……\n}\n```\n// 输出：错误信息\n\
  \n### `final method` 语法\n- `final` 是一个关键字。\n- `final method()` 意味着该方法不能被重写。\n\n\
  例如：\n```java\nclass Animal {\n    final void study() { // 声明 final 方法\n        System.out.print(\"\
  Animal\");\n    }\n}\n\nclass Tiger extends Animal {\n    void study() { // 错误！因为\
  \ study() 想要重写……\n        System.out.print(\"Tiger\");\n    }\n}\n```\n// 输出：错误\n\
  \n### `final variable` 语法\n- `final` 是一个关键字。\n- `final variable` 意味着值不能被修改。\n\n\
  例如：\n```java\npublic class FnClass {\n    final int n = 10; // 声明 final 变量\n   \
  \ void study() {\n        n = 20; // 错误！\n    }\n}\n```\n// 输出：错误\n\n#### `finally`\
