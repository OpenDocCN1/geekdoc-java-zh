  \ Syntax)\n\n多态的语法：\n\n```java\nclass Parent{ }  // 父类\nclass Child1 extends Parent{\
  \ }  // 子类 1\nclass Child2 extends Parent{ }  // 子类 2\nobj = new Child1( );  //\
