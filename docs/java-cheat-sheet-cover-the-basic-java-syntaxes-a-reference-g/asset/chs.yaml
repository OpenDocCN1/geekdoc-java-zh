- "# Java 快速查表：基础 Java 语法详解，参考指南\n\n\n\n![](img/cover00250.jpeg)\n\n\n## 关于本书\n本书涵盖了基础\
  \ Java 语法。我们可以快速参考最有帮助的编程语法，例如常用命令语法、字符串函数语法、集合函数语法、类与对象语法等……所有这些语法对于编程都非常有用。\n\n\
  我们可以将此书视为一本基础语法手册，因为它的条目是按字母顺序排列的，方便我们轻松参考重要的语法。\n\n无论现在还是未来，这本 Java 语法书都能为我们的学习和工作编码提供巨大的帮助。\n\
  \n## 免责声明\n本书仅作为基础语法手册；它不能包含该主题的所有条目。其目的是作为快速查表书籍的补充，而不是完整的 Java 字典。\n\n\n\n# 附录\n\
  \n- Java 关键字\n- 数据类型\n- 算术运算符\n- 赋值运算符\n- 逻辑运算符\n- 比较运算符\n- 条件运算符\n- 重载与重写\n- 默认、公共、受保护\n\
  - 抽象、接口\n- 数据类型\n- 修饰符\n- 日期、文件\n- 语法\n\n# 逻辑运算符\n\n## `&` 语法\n`&` 用于位与运算。如果两个位都为\
  \ 1，则返回 1；如果其中一位为假，返回 0。\n\n例如：\n```java\npublic class Main {\n    public static\
  \ void main(String[] args) {\n        int x = 100, y = 90, z = 60;\n        System.out.println(x\
  \ & y);\n    }\n}\n```\n输出：`92`\n\n## `|` 语法\n`|` 用于位或运算。如果其中一个位为 1，则返回 1；如果所有位均为假，返回\
  \ 0。\n\n例如：\n```java\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        int x = 4, y = 6;\n        System.out.println(x | y);\n    }\n\
  }\n```\n输出：`6`\n\n## `^` 语法\n`^` 用于位异异运算。如果位不同，则返回 1，否则返回 0。\n\n例如：\n```java\npublic\
  \ class Main {\n    public static void main(String[] args) {\n        int x = 4,\
  \ y = 6;\n        System.out.println(x ^ y);\n    }\n}\n```\n输出：`2`\n\n## `<<` 语法\n\
  `<<` 用于左移。它将所有位向左移动指定的位数。\n\n例如：\n```java\npublic class Main {\n    public static\
  \ void main(String[] args) {\n        int operand = 2;\n        System.out.println(operand\
  \ << 2);\n    }\n}\n```\n输出：`8`\n\n## `>>` 语法\n`>>` 用于右移。它将所有位向右移动指定的位数。\n\n例如：\n\
  ```java\npublic class Main {\n    public static void main(String[] args) {\n   \
  \     int operand = 8;\n        System.out.println(operand >> 2);\n    }\n}\n```\n\
  输出：`2`\n\n## `>>>` 语法\n`>>>` 用于无符号右移。它将所有位向右移动指定的位数。左侧的空位用 0 填充。\n\n例如：\n无符号右移：\n\
  -2 = `11111110`（二进制），`-2 >>> 1` 返回 `01111111`\n\n## `abs()` 语法\n`Math.abs(number)`\
  \ 返回数字的绝对值。\n\n例如：\n```java\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        System.out.println(Math.abs(-168.88));\n        System.out.println(Math.abs(168.88));\n\
  \    }\n}\n```\n输出：\n`168.88`\n`168.88`\n\n### `abstract` 语法\n`abstract` 用于类或方法。抽象类作为父类工作，可被子类扩展。子类的方法将重写抽象类的抽象方法。`abstract\
  \ class` 无法创建任何对象。`abstract method` 仅用于抽象类；它是没有方法体的空方法。\n\n```java\nabstract class\
  \ Book { // 创建一个抽象类\n    abstract void read(); // 创建一个抽象方法\n}\n\nclass eBook extends\
  \ Book { // 扩展父类\n    void read() { // 重写抽象方法\n```\n\n\n\n```java\nSystem.out.println(\"\
  I override that abstract method.\");\n}\n\npublic class AbstractDemo {\n    public\
  \ static void main(String[] args) {\n        eBook obj = new eBook();\n        obj.read();\n\
  \    }\n}\n```\n// 输出: I override that abstract method.\n\n---\n\n## acos() 语法\n\
  \n`Math.acos(number)`\n\n// 返回数字的余弦值\n\ne.g.\n```java\npublic class Main {\n   \
  \ public static void main(String[] args) {\n        System.out.println(Math.acos(0.88));\n\
  \        System.out.println(Math.acos(-0.88));\n        System.out.println(Math.acos(0));\n\
  \        System.out.println(Math.acos(-1));\n        System.out.println(Math.acos(1));\n\
  \    }\n}\n```\n// 输出:\n0.4949341263408955\n2.646658527248898\n1.5707963267948966\n\
  3.141592653589793\n0.0\n\n---\n\n## addExact() 语法\n\n`Math.addExact(num1, num2)`\n\
  \n// 返回两个数字之和\n\ne.g.\n```java\nclass Main {\n    public static void main(String[]\
  \ args) {\n        int x = 36;\n        int y = 52;\n        System.out.println(Math.addExact(x,\
  \ y)); \n    }\n}\n```\n// 输出: 88\n\n---\n\n## 算术运算符语法\n\n算术运算符意味着 `+`, `-`, `*`,\
  \ `/`, `%`, `++`, `--`\n\n// `%` 获取余数。\n// `++` 增加 1\n// `--` 减 1。\n\ne.g.\n```java\n\
  public class Main {\n    public static void main(String[] args) {\n        int x1\
  \ = 10; int y1 = 2;\n        System.out.println(x1 + y1); // 10+2=12\n        int\
  \ x2 = 10; int y2 = 2;\n        System.out.println(x2 - y2); // 10-2=8\n       \
  \ int x3 = 10; int y3 = 2;\n        System.out.println(x3 * y3); // 10*2=20\n  \
  \      int x4 = 10; int y4 = 2;\n        System.out.println(x4 / y4); // 10/2=5\n\
  \        int x5 = 10; int y5 = 2;\n        System.out.println(x5 % y5); // 10%2=0\n\
  \        int x6 = 10;\n        System.out.println(++x6); // 10+1=11\n        int\
  \ x7 = 10;\n        System.out.println(--x7); // 10-1=9\n    }\n}\n```\n\n---\n\n\
  ## 数组语法\n\n`int array-name[] = {\"value0\", \"value1\", \"value2\",…};`\n\n// 创建一个数组\n\
  \ne.g.\n```java\nint arr[] = { 10, 11, 12, 13 }; // 创建一个数组\n```\n// 上述代码创建了一个名为\
  \ `arr` 的数组，它有四个元素：\n- 编号 0 的元素是 `arr[0]`，值为 10。Key 为 0。\n- 编号 1 的元素是 `arr[1]`，值为\
  \ 11。Key 为 1。\n- 编号 2 的元素是 `arr[2]`，值为 12。Key 为 2。\n- 编号 3 的元素是 `arr[3]`，值为 13。Key\
  \ 为 3。\n\n在数组中，Key 的别名是“index（索引）”。Index 的别名是“key”。\n请注意 index 从 0 开始。\n\n---\n\n\
  ## 数组语法\n\n- `int array-name[] = new int [number of elements];`\n- `int array-name[index0]\
  \ = \"value0\";`\n- `int array-name[index1] = \"value1\";`\n- `int array-name[index2]\
  \ = \"value2\";`\n\n// 创建一个数组\n\ne.g.\n```java\nint arr[] = new int [3]; // 创建一个数组\n\
  arr[0] = 10;\narr[1] = 20;\narr[2] = 30;\n```\n// 上述代码创建了一个数组，数组名为 `arr`，它有三个元素：`arr[0]`、`arr[1]`、`arr[2]`。它们的索引是\
  \ 0, 1 和 2。它们的值是 10, 20 和 30。请注意索引数字从 0 开始。\n\n---\n\n## 数组元素语法\n\n`int value =\
  \ array[index];`\n\n// 从元素中获取值。\n\n`int array[index] = value;`\n\n// 给元素设置一个值。\n\
  \ne.g.\n```java\nint myArr[] = {10, 20, 300, 40, 50};\nint val = myArr[2]; // 从元素中获取值。\n\
  System.out.println(val);\n```\n// 输出: 300\n\ne.g.\n```java\nint myNum[] = new int\
  \ [5];\nmyNum[2] = 80; // 给元素设置一个值。\nSystem.out.println(myNum[2]);\n```\n// 输出:\
  \ 80\n\n---\n\n## 数组长度语法\n\n`array_name.length;`\n\n// 返回数组元素的总数。\n\ne.g.\n```java\n\
  public class ArrLen {\n    public static void main(String[] args) {\n        int\
  \ myArr[] = {100, 200, 300}; // 创建数组“myArr”\n        int len = myArr.length; //\
  \ 获取数组长度\n        System.out.print(len);\n    }\n}\n```\n// 输出: 3\n\n---\n\n## 数组排序语法\n\
  \n`Arrays.sort(array_name);`\n\n// 对数组排序并显示结果。\n在使用 `Arrays.sort()` 之前，必须 `import\
  \ java.util.Arrays;`。\n\ne.g.\n```java\npackage try;\nimport java.util.Arrays;\n\
  public class SortArr {\n    public static void main(String[] args) {\n        String\
  \ arr[] = {\"Cod\", \"App\", \"Bay\"};\n        Arrays.sort(arr); // 排序数组\n    \
  \    for(int n=0; n<arr.length; n++) { // 运行次数\n            System.out.print(arr[n]\
  \ + \" \");\n        }\n    }\n}\n```\n// 输出: App Bay Cod \n\n---\n\n## ArrayList\
  \ 语法\n\n`ArrayList<String> obj = new ArrayList<>();`\n\n// 创建 ArrayList 对象\n`ArrayList`\
  \ 类是可调整的数组，可以修改大小。\n\ne.g.\n```java\nimport java.util.ArrayList;\npublic class Main\
  \ {\n    public static void main(String[] args) {\n        ArrayList<String> colors\
  \ = new ArrayList<>();\n        colors.add(\"Red\"); // 添加元素\n        colors.add(\"\
  Yellow\");\n        colors.add(\"Green\");\n        System.out.println(colors);\
  \ // 显示值\n        for (int i = 0; i < colors.size(); i++) { // 遍历\n            System.out.println(colors.get(i));\n\
  \        }\n        System.out.println(colors.get(0)); // 获取元素\n        colors.set(1,\
  \ \"White\"); // 设置元素值\n        System.out.println(colors);\n        colors.remove(2);\
  \ // 删除元素值\n        System.out.println(colors);\n        System.out.println(colors.size());\
  \ // 获取 ArrayList 大\n        colors.clear(); // 清除所有元素\n        System.out.println(colors);\n\
  \    }\n}\n```\n// 输出:\n[Red, Yellow, Green]\nRed\nYellow\nGreen\n[Red, White]\n\
  2\n[]\n\n---\n\n## asin() 语法\n\n`Math.asin(number)`\n\n// 返回数字的正弦值\n\ne.g.\n```java\n\
  public class Main {\n    public static void main(String[] args) {\n        System.out.println(Math.asin(0.88));\n\
  \        System.out.println(Math.asin(-0.88));\n    }\n}\n```\n// 输出: 0.9688918399818517\n\
  -0.9688918399818507\n\n---\n\n## 断言语法\n\n`assert condition: \"message\";`\n\n//\
  \ 断言通过检查我们假设为真来检测任何问题。\n// 如果条件为假，JVM 将停止程序。\n// 运行文件时需要使用 `java -ea`。\n\ne.g.\n\
  ```java\nimport java.util.Scanner;\npublic class Assertion {\n    public static\
  \ void main(String args[]) {\n        int value = 100;\n        assert value > 100\
  \ : \"The value is not greater than 100\";\n        System.out.println(\"The value\
  \ is \" + value);\n    }\n}\n```\n// 输出: Exception in thread \"main\" java.lang.AssertionError:\
  \ The value is not greater than 100\n\n---\n\n## 赋值运算符\n\n赋值运算符意味着 `=`, `+=`, `-=`,\
  \ `*=`, `/=`, `%=`, `&=`, `|=`, `^=`, `>>=`, `<<=`。\n\ne.g.\n```java\npublic class\
  \ Main {\n    public static void main(String[] args) {\n        int n1 = 6; n1 +=\
  \ 2;\n        System.out.println(n1); // n1 = 6+2, 8\n        int n2 = 6; n2 -=\
  \ 2;\n        System.out.println(n2); // n2 = 6-2, 4\n        int n3 = 6; n3 *=\
  \ 2;\n        System.out.println(n3); // n3 = 6*2, 12\n        int n4 = 6; n4 /=\
  \ 2;\n        System.out.println(n4); // n4 = 6/2, 3\n        int n5 = 6; n5 %=\
  \ 2;\n        System.out.println(n5); // n5 = 6%2, 0\n        int n6 = 6; n6 &=\
  \ 2;\n        System.out.println(n6); // n6 = 6&2, 2\n        int n7 = 6; n7 |=\
  \ 2;\n        System.out.println(n7); // n7 = 6|2, 6\n        int n8 = 6; n8 ^=\
  \ 2;\n        System.out.println(n8); // n8 = 6², 4\n        int n9 = 6; n9 >>=\
  \ 2;\n        System.out.println(n9); // n9 = 6>>2, 1\n        int n10 = 6; n10\
  \ <<= 2;\n        System.out.println(n10); // n10 = 6<<2, 24\n    }\n}\n```\n\n\n\
  \n\n\n## atan() 语法\n\nsyntax: `Math.atan(number)`\n\n// 返回介于 `-PI/2` 和 `PI/2` 弧之间的数字的正反正函数值\n\
  \ne.g.\n```java\npublic class Main {\n  public static void main(String[] args) {\n\
  \    double x = 0.88;\n    double y = 0.0;\n    double z = 1.0;\n    System.out.println(Math.atan(x));\
  \ \n    System.out.println(Math.atan(y)); \n    System.out.println(Math.atan(z));\
  \ \n  }\n}\n```\n\n// 输出:\n0.7216548508647612\n0.0\n0.7853981633974483\n\n---\n\n\
  ## atan2() 语法\n\nsyntax: `Math.atan2(y, x)`\n\n// 通过将直角坐标 `(x, y)` 转换为极坐标 `(r, theta)`\
  \ 来返回角度 `theta`。\n\ne.g.\n```java\nclass Main {\n  public static void main(String[]\
  \ args) {\n    double x = 4.2;\n    double y = 5.9;\n    double theta = Math.atan2(y,\
  \ x);\n    System.out.println(theta);              \n    System.out.println(Math.toDegrees(theta));\
  \    \n  }\n}\n```\n\n// 输出:\n0.9521519758701495\n54.554289672401765\n\n---\n\n\
  ## boolean 语法\n\nsyntax: `boolean variable`\n\n// 一种具有 `true` 或 `false` 值的数据类型\n\
  \ne.g.\n```java\nboolean good = true;\nboolean bad = false;   \nSystem.out.println(good);\n\
  System.out.println(bad);\n```\n// 输出: true, false\n\n---\n\n## break 语法\n\nsyntax:\
  \ `break;`\n\n// 终止循环或 `switch` 块\n\ne.g.\n```java\nfor (int n = 1; n < 8; n++)\
  \ {\n  if (n == 6) {\n    break;\n  }\n  System.out.print(n);\n}\n```\n// 输出: 12345\n\
  \n---\n\n## byte 语法\n\nsyntax: `byte variable`\n\n// 一种从 `-128` 到 `127` 的数字数据类型\n\
  \ne.g.\n```java\nbyte myNum = 88;\nSystem.out.println(myNum);\n```\n// 输出: 88\n\n\
  ---\n\n## case 语法\n\nsyntax: `case value:`\n\n// 在 `switch` 语句中标记代码块\n\ne.g.\n```java\n\
  int number = 2;\nswitch (number) {\n  case 1:\n    System.out.println(\"Number 1\"\
  );\n    break;\n  case 2:\n    System.out.println(\"Number 2\");\n    break;\n}\n\
  ```\n// 输出: Number 2\n\n---\n\n## catch 语法\n\nsyntax: `catch (Exception e)`\n\n\
  // 捕获从 `try` 语句抛出的异常\n\ne.g.\n```java\ntry {\n    int[] arr = {10, 20, 30};\n  \
  \  System.out.println(arr[5]);\n}\ncatch (Exception e) {\n    System.out.println(\"\
  Out of range!\");\n}\n```\n// 输出: Out of range!\n\n---\n\n## cbrt() 语法\n\nsyntax:\
  \ `Math.cbrt(number)`\n\n// 返回数字的立方根值\n\ne.g.\n```java\nclass Main {\n  public static\
  \ void main(String[] args) {\n    double a = 125.0;\n    double b = -27;\n    double\
  \ c = 0.0;\n    System.out.println(Math.cbrt(a)); \n    System.out.println(Math.cbrt(b));\
  \ \n    System.out.println(Math.cbrt(c)); \n  }\n}\n```\n// 输出:\n5.0\n-3.0\n0.0\n\
  \n---\n\n## ceil() 语法\n\nsyntax: `Math.ceil(number)`\n\n// 返回大于或等于其参数的最近整数。\n\n\
  e.g.\n```java\npublic class Main {\n  public static void main(String[] args) {\n\
  \    double num = 3.14;\n    System.out.println(Math.ceil(num));\n  }\n}\n```\n\
  // 输出: 4.0\n\n---\n\n## char 语法\n\nsyntax: `char variable`\n\n// 用于单个字符的数据类型\n\n\
  e.g.\n```java\nchar ch = 'C';\nSystem.out.println(ch);\n```\n// 输出: C\n\n---\n\n\
  ## charAt() 语法\n\nsyntax: `string.charAt(index)`\n\n// 返回指定索引处的字符\n\ne.g.\n```java\n\
  public class Main{\n  public static void main(String []args){\n    String str =\
  \ \"kindle\";\n    char c = str.charAt(2);\n    System.out.println(c);\n  }\n}\n\
  ```\n// 输出: n\n\n---\n\n## class 语法\n\nsyntax:\n```java\nclass Class_name {\n  variable;\n\
  \  method_name() { }\n}\n```\n`class` 是对象的模板，并用于创建对象。`class Class_name` 定义了一个类。\n\
  \ne.g.\n```java\npublic class MyClass { // 定义一个类\n  int num = 100;\n  public static\
  \ void main(String[] args) {\n    MyClass myObj = new MyClass(); // 创建一个对象\n   \
  \ System.out.println(myObj.num);\n  }\n}\n```\n// 输出: 100\n\n---\n\n## class 对象\
  \ 语法\n\nsyntax:\n```java\nclass Class_name { // 定义一个类\n}\nobj = new Class_name();\
  \ // 创建一个对象\n```\n\ne.g.\n```java\nclass Colour { // 定义一个类\n  String co1, co2;\n\
  \  void bright () { \n    System.out.println(\"This flower is \" + co1);\n    System.out.println(\"\
  That flower is \" + co2);\n  }\n  public static void main(String[] args) {\n   \
  \ Colour obj = new Colour(); // 创建一个对象\n    obj.co1= \"red.\";  obj.co2=\"blue.\"\
  ; // 引用\n    obj.bright (); // 对象引用一个方法\n  }\n}\n```\n// 输出:\nThis flower is red.\n\
  That flower is blue.\n\n---\n\n## attribute 语法\n\nsyntax:\n```java\nclass Class_name\
  \ {\n  variable1;\n  variable2;\n}\n```\n`class Class_name` 定义了属性 `variable1` 和\
  \ `variable2`。\n\ne.g.\n```java\npublic class Main {\n  int num = 10;\n  public\
  \ static void main(String[] args) {\n    Main obj = new Main();\n    System.out.println(obj.num);\n\
  \  }\n}\n```\n// 输出: 10\n\n---\n\n## class 对象 语法\n\nsyntax:\n```java\npublic class\
  \ Main {\n  int num = 10;\n}\n```\n创建一个 `Main` 类。\n```public static void main(String[]\
  \ args) {\n  Main obj = new Main();\n  System.\n.\n(obj.num: 10\n\n---\n\n## codePointAt()\
  \ 语法\n\nsyntax: `string.codePointAt(index)`\n\n// 返回指定索引处的 Unicode 值。\n\ne.g.\n\
  ```java\npublic class Main{\n  public static void main(String []args){\n    String\
  \ str = \"kindle\";\n    int u = str.codePointAt(2);\n    System.out.println(u);\n\
  \  }\n}\n```\n// 输出: 110\n\n---\n\n## codePointBefore() 语法\n\nsyntax: `string.codePointBefore(index)`\n\
  \n// 返回指定索引之前的 Unicode 值。\n\ne.g.\n```java\npublic class Main{\n  public static\
  \ void main(String []args){\n    String str = \"kindle\";\n    int u = str.codePointBefore(2);\n\
  \    System.out.println(u);\n  }\n}\n```\n// 输出: 105\n\n---\n\n## codePointCount()\
  \ 语法\n\nsyntax: `string.codePointCount(beginIndex, endIndex)`\n\n// 返回字符串指定范围内的\
  \ Unicode 值数量。\n\ne.g.\n```java\npublic class Main {\n  public static void main(String[]\
  \ args) {\n    String str = \"Hello World\";\n    int num = str.codePointCount(0,\
  \ 8);\n    System.out.println(num);\n  }\n}\n```\n// 输出: 8\n\n---\n\n## comment\
  \ 语法\n\n单行注释以两个斜杠 `//` 开始。多行注释以 `/*` 开始并以 `*/` 结束。\n\ne.g.\n```java\npublic class\
