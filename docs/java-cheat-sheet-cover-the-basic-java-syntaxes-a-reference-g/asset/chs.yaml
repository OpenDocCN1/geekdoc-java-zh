  // 多态描述了对对象执行不同方法的能力。\n\n例如：\n\n```java\nclass Animals{ // 父类\n  void yell( ){\n\
  \    System.out.println(\"yelling......\");\n  }\n}\n\nclass Dogs extends Animals{\
  \ // 子类\n  void yell( ){ // 重写\n    System.out.println(\"Woww, Woww......\");\n\
  \  }\n}\n\nclass Cats extends Animals{ // 子类\n  void yell( ){ // 重写\n    System.out.println(\"\
  Meaw, Meaw......\");\n  }\n}\n\npublic class PolymorphismClass{   \n  public static\
  \ void main(String args[ ]){ // 主函数\n    Animals animalObj;\n    animalObj = new\
