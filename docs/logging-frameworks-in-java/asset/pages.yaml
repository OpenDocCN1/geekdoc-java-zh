  md: '# 4. 2. LOG BACK’S ARCHITECTURE


    The architecture of Logback is similar to that of Log4j. It is made up of three
    modules:


    +   a. logback-core


    The core module is the base module for the logback-classic and logback-access
    module. This module consists of the basic api and components that are used by
    the other two modules.


    +   b. logback-classic


    This module extends the core module. It is a subclass of the logback-core module
    and internally implements SL4J. SL4J API implemented by this module enables switching
    between various logging frameworks


    +   c. logback-access


    This module extends the core module as well. It implements sl4j as well. It provides
    logging in an HTTP environment. Servlet containers that help provide HTTP access
    logging functionality (Gülcü & Pennec, 2011).


