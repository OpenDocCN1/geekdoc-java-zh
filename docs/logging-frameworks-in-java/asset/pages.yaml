    #  3. Unsynchronized Appender Base class


    This class is similar to the Appender Base class. It differs from the Appender
    Base class in terms of synchronization. Any class that is derived from the Unsynchronized
    Appender Base class needs to handle synchronization on its own.


    Some of the important methods provided by this class are as:


    # Table 4.4: Unsynchronized Appender Base class methods (Logback-Parent 1.2.3
    API, 2017)


    | Method | Description |

    | void append() | This method writes the log message to the specified destination.
    |

    | void addFilter(Filter<E> filter) | This method adds the specified filter to
    the appender. |

    | String getName() | This method returns the name of the appender. |

    | abstract void append(E event) | This is an abstract method which can be overridden
    by its subclasses to provide class-specific behavior. |

    | void clearAllFilters() | This method clears all the filters declared for the
    appender. |

    | List<Filter<E>> getCopyOfAttached-FiltersList() | The method returns a copy
    of all the filters held within the specified object. |

    | FilterReply getFilterChainDecision(E event) | This method loops/iterates over
    all the filters present in the current filter chain. |'
