  md: '# 186 Logging Frameworks in Java


    # ### Table 5.2: Simple Logger properties (SLF4J 1.8.0-beta0 API, 2017)


    | Property Name | Description |

    |---|---|

    | logfile | This is the target output. Possible options are file path, system.err
    or system.out |

    | Cache Output Stream | If this is set to true, the output stream is cached. |

    | Default Log Level | This can be debug, info, trace, error or warn. By default
    it is info. |

    | Show Date Time | If this is set to true, the current date and time is printed
    with the log message. It is false by default. |

    | Date Time Format | This is used to set the date to be used for formatting the
    log messages. By default, it is Simple Date Format of java. |

    | Show Thread Name | This outputs the current thread name and is true by default.
    |

    | Show Log Name | This property, if true prints the logger name along with the
    log message. |

    | level In Brackets | This property is used to display the log level within square
    brackets. By default, it is false. |

    | Show Short Log Name | This property if set to true shows the log name with the
    last component in the log message. |


