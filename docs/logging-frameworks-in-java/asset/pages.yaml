  md: '# CHAPTER

    7


    # SUMMARY


    In this book, we have seen up to 4 different logging frameworks and one Logging

    Framework Facade so far.


    We started with the traditional and simple Java Logging Framework. We

    studied the architecture and components that form the core of this logging

    framework. We saw how to implement this framework by means of several

    simple examples. We discovered that this framework has no configuration

    overhead as it is embedded within the JRE itself. As it is part of the default

    Java JRE package, no special installation procedures need to be initiated.

    However, we came upon certain drawbacks to the use of this framework such

    as security issues and serialization problems. Additionally, the performance

    offffered by this framework as per benchmark analysis performed by several

    platforms suggest that it is up to 10 times slower when compared to

    others frameworks (Benchmarking Java Logging Frameworks, 2017).


    The next framework that we studied was the third-party (Apache) log4j

    logging framework. We explored its unique architecture, the components

    that make up the architecture and its configuration. We examined its

    cabilities by testing it via a sufficient amount of simple and easy examples

    extensively we use the API provided by this framework.


    We found out that this framework is quite powerful and easy to configure,

    understand and implement. Several unique features such as logging to

    databases, asynchronous logging and logging over networks are offered by

    log4j2. Benchmark analysis hints that this framework performs well when

    compared to other Java frameworks. It performs at a level that is more or'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Logging Frameworks in Java


    less the same as logback can be implemented by all types of applications small
    and large alike (Sitepoint, 2017).


    We moved on to another third-party framework named logback which was launched
    by QOS as a successor to the framework log4j, also written by the same author
    that developed log4j, Ceki Gülcü. In the same manner, as we proceeded for the
    previous two logging frameworks, we analyzed and learned the core architecture
    and components of the Logback logging framework. With the help of several samples,
    we examined in detail the means to implement and use this framework for our Java
    applications.


    We came to the realization that this framework is almost as powerful as log4j
    and also that has certain perks in terms of features when compared with its predecessor.
    This framework ups the ante by providing useful and practical features such as
    condition processing of configuration files, automation in terms of rolling of
    files, exception handling, native SLF4J implementation, to name a name few (Gülcü
    and Pennec, 2011).


    Moving forward, we took a turn to probe and examine SLF4J, a façade for logging
    frameworks, which raises the stakes and brings the story of the logging frameworks
    to a whole new level. Developed by Ceki Gülcü yet again, this framework offers
    the Java developers and users'' community the chance to select their desired logging
    framework at the time of deployment. Needless to say, this framework clearly has
    an edge in the market of logging frameworks. It offers the prospect of hand-picking
    a logging framework based on the needs of the application which change rapidly
    and hence offers a massive advantage to developers and clients alike. With its
    wide array of bindings and support for several logging frameworks, it has risen
    up to be one of the most popular logging frameworks that are used by Java applications.


    Although this framework offers several benefits, it has a slight inconvenience:
    it is only as fast as the framework it uses. Hence, the choice of the underlying
    base logging framework should be made prudently. Studies and benchmarking of various
    combinations SLF4J and log4j2, SLF4J and Java Util logging indicates that the
    best combination among the three are SLF4J in combination with logback (Benchmarking
    Java Logging Frameworks, 2017).


    Lastly, we revisited another small yet strong and sturdy framework called TinyLog.
    A simplistic framework with a simple design for logging, TinyLog is one to keep
    an eye out for. Notwithstanding the fact that TinyLog does'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'not offer all the incredible features offered by logback and log4j, somewhat
    ev the field by achieving fast performance as described in the benchmark analysis
    (tinylog: Benchmark, 2017).


    Granted that TinyLog is leaps and bounds behind the popularly used logging frameworks
    such as logback, log4j, JCL in terms of support, use, community, and features,
    but it is one framework to watch out for. This framework bodies well for applications
    that wish to use a fast and lightweight alternative to the traditional logging
    frameworks.


    The following table provides a comparison of the logging frameworks that we have
    studied in this book based on important parameters such as performance, powerful
    features, community support, maintenance, etc.


    | Framework Parameter | JUL | LOG4J | Logback | TinyLog |

    |---|---|---|---|--|

    | Log Levels | 7 levels: info, config, fine, finer, severe, warning | 6 levels:
    info, error, warn, debug, trace | 5 levels: error, warn, info, debug | 5 levels:
    Error, warn, trace, info, debug |

    | Logging Networks | Weak capabilities | Strong features | Strong features | Extremely
    limited functionality |

    | Online community | Moderately large community | Strong online community and
    support | Extremely wide community and strong support | Small community but the
    good support provided |

    | Actively maintained | No | No | Yes | Yes |

    | Performance (asynchronous) (Benchmarking Java Logging Frameworks, 2017) | Weak
    as compared to the other 3 frameworks | Definitely better than JUL but slightly
    slower than logback | Very good performance as compared to JUL andlogback | Offers
    the best performance (tinylog: benchmark, 2017) |

    | Mavenision possible | Not applicable | Yes | Yes | Yes |

    | Dynamic Configuration Possible | Yes, but only using MX or re-reading the configuration
    | Yes, can be done programmatically. | Yes, can be done programmatically. | Yes,
    can be done programmatically. |

    | Mapped Diagnostics Context | No | Yes | Yes | Yes |

    | Exception Handling (from I/O failures ) | No | Yes | Yes | No |

    | Configuration file type (XML/properties) | Properties | Both | Both. Logback
    offers groovy format too. | Properties |'
