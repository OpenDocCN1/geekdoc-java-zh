  md: '# 3. SLF4J and Logback


    We have so far taken a look at the use of slf4j with log4j and the java util logging
    frameworks.


    In this section, we shall see the use of slf4j with logback.


    As logback natively implements slf4j, this combination is extremely easy to implement
    and configure.


    Similar to the previous 2 examples, we remove the existing bindings.


    Then, we proceed to the bindings required for the logback framework.


    In case of logback, in addition to the slf4j-api.jar, we need the logback-classic.jar
    as it implements the slf4j logger api. But, logback-classic is in turn dependent
    on logback-core.jar. Hence, we need to add that to our classpath as well.


    Hence, in total, we require 3 jar files to configure slf4j with logback.


    +   - slf4j-api.jar

    - logback-classic.jar

    - logback-core.jar


    We add them to our class path by right-clicking on the project-> Build Path->
    Configure Path.


    ![](img/e779f11d414c53184ecfd97086dcfe13_212_0.png)


    Next, we add a logback.xml configuration file to configure our application to
    use logback as its logging framework.'
