  md: "# 168 Logging Frameworks in Java\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<configuration>\n  <property scope=\"content\" resource=\"app.properties\"\
    \ />\n  <if condition=\"property(\"ENVIRONMENT\").contains(\"DEV\")\">\n    <then>\n\
    \      <include file=\"F:/workspace/logback/src/main/resources/logback-dev.xml\"\
    \ />\n    </then>\n  <else>\n    <if condition=\"property(\"ENVIRONMENT\").contains(\"\
    PROD\")\">\n      <then>\n        <include file=\"F:/workspace/logback/src/main/resources/logback-prod.xml\"\
    \ />\n      </then>\n      <else>\n        <if condition=\"property(\"ENVIRONMENT\"\
    ).contains(\"UAT\")\">\n          <then>\n            <include file=\"F:/workspace/logback/src/main/resources/logback-uat.xml\"\
    \ />\n          </then>\n          <else>\n            <appender name=\"console\"\
    \ class=\"ch.qos.logback.core.ConsoleAppender\">\n              <pattern>%d{yyyy-MM-dd\
    \ HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n</pattern>\n            </appender>\n\
    \            <root level=\"debug\">\n              <appender-ref ref=\"console\"\
    \ />\n            </root>\n          </else>\n        </if>\n      </else>\n \
    \   </else>\n  </if>\n</configuration>\n```\n\nHere, we provide a default appender\
    \ and root logger in all the conditions that do not match. If none of the conditions\
    \ are met, then the logger defaults to a console appender. But it is important\
    \ to note that even if one of the conditions is met, the logs will be duplicated\
    \ as we provided a default console appender and root logger.\n\nIf we want to\
    \ avoid this duplication, we can use the additivity parameter or the duplicate\
    \ message filter as explained before.\n\nAnother way to avoid duplicate messages\
    \ is to use the nested if-then-else loop in the configuration as shown below:\n\
    \n```\n<xml version=\"1.0\" encoding=\"UTF-8\"?>\n<configuration>\n  <property\
    \ scope=\"content\" resource=\"app.properties\" />\n  <if condition=\"property(\"\
    ENVIRONMENT\").contains(\"DEV\")\">\n    <then>\n      <include file=\"F:/workspace/logback/src/main/resources/logback-dev.xml\"\
    \ />\n    </then>\n  <else>\n    <if condition=\"property(\"ENVIRONMENT\").contains(\"\
    PROD\")\">\n      <then>\n        <include file=\"F:/workspace/logback/src/main/resources/logback-prod.xml\"\
    \ />\n      </then>\n      <else>\n        <if condition=\"property(\"ENVIRONMENT\"\
    ).contains(\"UAT\")\">\n          <then>\n            <include file=\"F:/workspace/logback/src/main/resources/logback-uat.xml\"\
    \ />\n          </then>\n          <else>\n            <include file=\"F:/workspace/logback/src/main/resources/logback-default.xml\"\
    \ />\n          </else>\n        </if>\n      </else>\n    </else>\n  </if>\n\
    </configuration>\n```\n\nHere, we added a nested if-then-else loop and provide\
    \ a default configuration file if no condition matches. We add a new file named\
    \ logback-default.xml which implements a simple file appender.\n\nThis is shown\
    \ below:"
