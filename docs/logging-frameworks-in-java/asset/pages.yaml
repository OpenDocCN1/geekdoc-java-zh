  md: '# 4.1. INTRODUCTION


    Log back is logging framework that was released in 2006. Designed by Ceki Gülcü,
    the creator of log4j, this framework was preconceived as a successor to log4j
    (Logback Home, 2017).


    Log back is based upon experience gained from the study and design of logging
    systems in the industry. Log back is faster and has a smaller footprint compared
    to the other logging systems.


    Log back provides an array of features big and small that make it an easy logging
    system to understand and use. It is very similar in concept to log4j but has several
    improvements. The latest version of log ack is 1.2.3.


    Some of the features of Log back are as follows:


    Log back is faster as compared to log4j as the internal source code has been written
    to perform operations faster. The execution of certain paths that are critical
    have been made faster by the rewriting of the code. The Log back components are
    faster and occupy less memory as well. In other words, its memory footprint is
    small (Log back Home, 2017).


    Log back is a framework that comes with a long list of tests that ensure the strength,
    durability, and dependability of this framework even under stress conditions.


    Log back provides detailed documentation which is updated regularly. Additionally,
    it has a large community support which makes it easy for users to use and implement
    this framework.


    Logback is compatible with SL4j. Logback implementation is built upon sl4j api
    natively and an sl4j logger can be used easily with logback the underlying logging
    framework used for logging. As Logback integrates seamlessly with SL4J, it is
    easy to switch between frameworks without having to change your code. SL4J is
    discussed in detail in Chapter 5.


    Logback framework supports either XML or Groovy types for the configuration file.
    The groovy file types are widely used by developers as their syntax is shorter,
    consistent and easy to understand and configure.


    Additionally, logback provides an automatic Groovy tool that helps migrate configuration
    files written in XML to the groovy format. The groovy style configuration has
    been made available since logback version 0.9.22.'
  merge: -1
