  md: '# 3.1. INTRODUCTION


    Log4j is another logging framework based on the Java language owned and released
    by Apache. It was written by Ceki Gülccü. It is a part of the logging services
    project of the entity Apache Software Foundation. It was first released in 1996.
    It was developed by the European Union SEMPER (Secure Electronic Marketplace for
    Europe) project that the project wished to have a tracing API of its own like
    most large applications (Goers, 2017).


    Then, after several enhancements and evolutions, this API gradually became log4j
    which is now an extremely popular logging framework for Java. The package for
    this framework is now distributed under the Apache Software License which is an
    open source certified license.


    As mentioned earlier, logging has many advantages and log4j tries to provide a
    complete, easy and fast logging mechanism. Log4j is a flexible framework that
    is written completely in Java but can also be used in other languages such as
    C++, C#, Perl, Python, Ruby, etc. An excellent feature of log4j is its ability
    of dynamic configuration via external files at runtime. Additionally, it provides
    good methods of remote logging. Using this framework, log can easily be written
    to various targets such as Databases, Remote files, Syslog and so on.


    The latest version of log4j is Apache log4j 2.9.1 which was released in September
    2017. All the examples provided in this book are based on this version.


    # 3.2. LOG4J VERSIONS


    Log4j has several versions that were released over the years. The very first version
    that was released after the initial package log4j 0.5 was released in 1999. Post
    this release, another 60 versions of log4j 1.x were released; each version with
    some modifications and features. 1.2 was the last version released in this series.
    Details of the changes related to this version can be found at the following link.


    ```

    https://logging.apache.org/log4j/1.2/changes-report.html

    ```


    In 2015, Apache announced that the log4j 1.x series has reached its end and will
    be discontinued.'
  merge: -1
