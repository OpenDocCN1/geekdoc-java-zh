  md: "# 226 Logging Frameworks in Java\n\nWe add the property ‘tinylog.configuration’\
    \ and specify the fully qualified path of the configuration file.\n\nWe click\
    \ on run to execute the class.\n\nThe output is as follows:\n\n![](img/e779f11d414c53184ecfd97086dcfe13_239_0.png)\n\
    \n# Example 6: Loading the configuration file programmatically\n\nIn the example,\
    \ we load the tinylog.properties file, which is present in C:\\Temp using the\
    \ Configurator API.\n\nThe contents of the properties file are:\n\n```\ntinylog.properties\n\
    # set the writer to a file\ntinylog.writer = console\n# specify the format of\
    \ the output messages\ntinylog.format=[yyyy-MM-dd HH:mm:ss] (%thread) [%level]:\
    \ %message\n# specify the level of the writer\ntinylog.level=debug\n```\n\nThe\
    \ java class is as follows:\n\n```\nTinylogExample.java\npackage com.java.logging.tinylog;\n\
    \n// import the static logger\nimport java.io.File;\nimport java.io.IOException;\n\
    \nimport org.codel.tinylog.Configurator;\nimport org.codel.tinylog.Logger;\n\n\
    public class TinylogExample {\n    public static void main(String[] args) throws\
    \ IOException {\n        // get the configuration file path in a file object\n\
    \        File file = new File(\"C:\\Temp\\tinylog.properties\");\n\n        //\
    \ use the Configurator class to load the properties file\n        Configurator.defaultConfig(file).build();\n\
    \n        // log messages in a log\n        Logger.info(\"Information Message\"\
    );\n        Logger.warn(\"Warning Message\");\n        Logger.error(\"Error Message\"\
    );\n        Logger.debug(\"Debug Message\");\n    }\n}\n```\n\nIn this case, we\
    \ create an object of type File that holds the path to the properties file. Then,\
    \ we input it as a parameter to the Configurator’s fromFile() method that reads\
    \ the file and configures the logging as per the configuration in the properties\
    \ file."
