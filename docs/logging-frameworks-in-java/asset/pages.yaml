- img_proc: true
  md: '# Logging Frameworks in Java


    ![](img/e779f11d414c53184ecfd97086dcfe13_143_0.png)


    LOGGER/APPENDER FILTER POSSIBLE RESPONSES ACTIONS TAKEN BY FILTER BASED ON RESPONSE
    RECEIVED


    The filter has a decide() method that accepts a parameter of type I Logging


    Event. This method returns 3 possible enumeration values: ACCEPT, DENY or NEUTRAL.
    If the message is DENY, the log message is rejected and none of the remaining
    filters are consulted. If the message is NEUTRAL, then the control is passed on
    to the next filter and its response is checked and so on. If the list of filters
    is exhausted and reached its end, the logging event is handled normally.


    Some of the available filters in logback are as follows:


    +   * Threshold Filter: This filter filters log events below a specified threshold
    level. All events of this particular threshold level and above this level.

    * Level Filter: This filter filters log events based on exact matching of Levels.

    * Evaluator Filter: This is an abstract filter class that has an event evaluator.
    The event evaluator evaluates given criteria and checks if it is met or not. Based
    on the result (match/ mismatch) it returns the value specified by Match/on Mismatch
    property.

    * Counting Filter: This filter is used to obtain statistical data about the access
    of the remote web server by your application. Details such as average time spent
    daily, weekly, monthly, and so on.

    * Duplicate Message Filter: This filter separates duplicate log messages. It detects
    duplicate log messages and if they are repeated more than a fixed number of times,
    the log messages are discarded.'
