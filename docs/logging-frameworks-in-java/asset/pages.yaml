  md: 'This is formatted printing which is completely inspired by the traditional
    C language''s print statements.


    For formatting the log message, we call the format message. But if we want to
    customize this message, a format String along with a list of arguments is provided.
    This string contains text (the log message) and one more **format specifications**.


    In general, the syntax for general, character, and numerical format specifies
    is as follows:


    % %[index_of_ argument] [flags] [width of argument] [. precision] conversion


    Here, the index, width, precision, and flags are all optional. The index is a
    decimal integer which specifies the position of the argument in the list of arguments.


    The flags are nothing but a set of characters that modify the output. Precision
    is used to limit the number of characters. Conversion is another character that
    indicates how the argument should be formatted. A *conversion* is applied to an
    argument. This is a character element that indicates what content should be inserted
    in the log output. This may be of different types.


    Additionally, the format specifiers for date and time are different and have the
    following syntax: %[index_of_ argument$][flags][width]conversion


    Like general format specifiers, the parameters index of the argument flags, width,
    and conversion are optional.


    In this case, the **conversion** that is is a sequence of two characters. The
    first character in the sequence is ''t'' or ''T''. The second character indicates
    the format to be used (java.util.logging (Java Platform SE 7, 2017).


    There exist 6 categories of conversions. They are:


    +   - General: Applicable to any argument;


    +   - Character: Applicable to Unicode characters char, byte, short and their
    respective Wrapper classes;


    +   - Numeric: Applicable to Integer and Floating-point values such as int, float,
    double, Big Decimal, Big Integer, and their respective wrapper classes;


    +   - Date/Time: Applicable to Date, time classes in Java;


    +   - Percent: this produces the literal ''%%''; and


    +   - Line Separator: This produces a line separator that is specific to the platform.'
