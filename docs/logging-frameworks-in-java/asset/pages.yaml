    # 5. Filters


    Filters are used to filter out log messages. They decide which log

    messages to pass on to the appender or the logger in itself. The filters are

    present in the logback-classic module but the base class is present in the core

    module. Logback has different types of filters based on ternary logic:


    +   a. Regular Filters


    These are the standard filters provided by logback. All the filters

    in logback are subclassed from the base class name Filter consisting of a

    decide() method that decides whether the log message will be accepted or

    rejected. They are based on ternary logic and are stored in an ordered list.

    Based on the result received from the decide() method, the filter accepts or

    rejects the log message.


    The working of a filter is described in the following figure:'
