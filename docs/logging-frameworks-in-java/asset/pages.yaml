  md: '# PREFACE


    Logging plays a vital role in the maintenance of any software application. Logging
    is simply an action of maintaining a log of the events that take place in the
    lifetime of an application. Log statements are nothing but simple messages that
    note down the transactions/communications-taking place between different elements
    within the application. These messages are written to a file called as the Log
    file. In other words, logging is documentation of all the events that occur in
    a system.


    Logging, when used wisely is an extremely powerful tool to debug, administer and
    maintain your applications. It provides you with information about what your coding
    is doing. This helps rapidly debug the code, monitor the application and manage
    complex applications. Additionally, logging can serve as a means to measure application
    performance.


    Logging is an intrinsic part of many object-oriented languages such as Java, C++
    Python, etc. To make the process of logging effortless, many powerful logging
    frameworks have been provided to facilitate the process for the concerned users.
    With the use of frameworks for the purpose of logging, a developer can better
    maintain his application in an easy, developer-friendly way. For example, in the
    case of complex client-server applications, logging helps to understand the activities
    of the server/servers being used thereby aiding in deciphering the incidents that
    take place in such a context. Java logging frameworks not only ease the process
    of logging, but also help standardize the process.


    In this book, various logging frameworks have been presented in the context of
    Java, a language that is very well suited to object-oriented programming and design.
    This book covers the basics of logging, its implementation in Java and describes
    in detail some logging frameworks that are used in a Java context. Several samples
    of java code implementing logging functionality and tested against Java versions
    7.0 and 8.0 have been provided.'
  merge: -1
