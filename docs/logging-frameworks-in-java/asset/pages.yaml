- img_proc: true
  md: 'the maximum number of events that can take place (maxBurst). Once this number
    is reached, the filter quietly discards the log events.


    +   4. Composite Filter: This filter allows the use of multiple filters in the
    same context.


    +   5. Map Filter: This is a unique filter that allows the log messages to be
    filtered on the basis of a Map that contains key-value pairs. Based on the key-value
    pairs being present in the log message, the logs are accepted or rejected.


    +   6. Regex Filter: This filter allows the log information to be filter against
    a regular expression. It takes in a pattern and filters the log messages based
    on the pattern.


    +   7. Structured Data Filter: This is an advanced Map Filter that is used to
    filter log information on the basis of the event id, type of message/event and
    the message itself.


    +   8. Marker Filter: This filter filters the logging event Marker against a Marker
    value. Each event''s Marker is compared with the marker value in the filter and
    based on the result, the log event is accepted or rejected.


    +   9. Thread Context Map Filter: This filter is used to filter log events based
    on the elements present in the Thread Context Map. Key-value pairs are used.


    +   10. Dynamic Threshold Filter: This filter provides the possibility of filtering
    logging information based on different properties such as log level, user id,
