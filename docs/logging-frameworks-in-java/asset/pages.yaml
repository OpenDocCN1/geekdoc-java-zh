    # 3.7.4. Filters


    Filters are the components that determine which log messages will reach their
    target destination. If when a filter is invoked, it calls its filter method and
    returns an Enumeration result which has 3 possibilities: ACCEPT, DENY or NEUTRAL.
    They can be configured at Logger, Appender or Context level.


    Log4j provides the following types of filters:


    +   1. Threshold Filter: This filter defines a threshold level and allows the
    log event to pass if the log event has a level that is either or higher than the
    current threshold.


    +   2. Time Filter: This filter is used to limit the logging for a particular
    time period. It accepts a start and end time that can be configured.


    +   3. Burst Filter: This filter provides a limit on the number of possible logging
    events. Using this filter rate, speed and processing of the logging can be controlled.
    It has a parameter that maintains'
