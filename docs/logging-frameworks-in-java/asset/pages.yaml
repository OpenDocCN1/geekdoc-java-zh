  md: '# Logging Frameworks in Java


    <if>, <then> and else. These elements reduce redundancy and allow the use of a
    single configuration file for several development environments.


    Logback has an advanced Filtering mechanism as compared to other logging frameworks.
    It allows filtering on a user base. Imagine an application that has been deployed
    on a server. To avoid a large volume of log records the logging level is to set
    either ''WARN'' or ''ERROR''. But, if an issue arises someday in the production
    environment or if the server is at a remote location, we need to set the level
    to DEBUG to analyze the issue which will generate a large quantity of logs.


    But, inlogback, this can be avoided by means of user level filtering. Logback
    gives us an option of maintaining the original log level for all users except
    for a particular user (the user who is analyzing the issue) who can see the logs
    at a more detailed level than everyone else. So, when this particular user logs
    in,he will be generating debug logs and all other at the ERROR or WARN level.
    This can be done with the help of an MDC Filter which is not discussed in the
    scope of this book.


    Logback comes with an excellent appender namely the shifting appender. This appender
    can be used to filter/shift the log information based on any attribute at runtime.
    For instance, this appender can separate logs based on user login/session and
    generate log files per user. This can be done with environment and many other
    runtime parameters which make logback powerful.


    Another useful feature of logback is that when an exception occurs, not only is
    the stack trace printed in the logs, but also the packaging data is printed along
    with it.


    This means that logback will print the packages used by the application such as
    hibernate, spring, etc. This lets the user know which class generated the exception
    and also which package and which version of this package the class uses. For instance,
    if you are using spring boot 3.2.2 this information will be present in the stack
    trace. So, the work of a developer is made incredibly easier as now he doesn''t
    need to go back to the customer for additional information.


    The logback family provides us with another smart module called the logback-access.
    This module is part of the logback package and it integrates containers for servlets
    such as Tomcat, Jetty thereby providing http-access with logging functionalities.
    This module is yet another powerful feature of logback and it has all of the components
    of the logback classic module.'
