    There are 3 pre-defined styles provided by the java.util.logging package. They
    are as follows:


    +   1. java.util.logging. Simple Formatter.format="%1$4s: %5$s [%1$tc]"



    This prints 1 line with the log level (4S), the log message (5S) and the timestamp
    (1S) in a square bracket.


    +   2. java.util.logging. Simple Formatter.format="%1$tc%%2$s%n%4$s: %5$s%6$s%n"



    This prints 2 lines where the first line includes the timestamp (1S) and the source
    (2S); the second line includes the log level (4S) and the log message (5S) followed
    with the throwable and its back trace (6S), if any:


