    the bytes held by the footer of the encoded event. | Byte [] header Bytes () |
    This method returns the bytes held by the header of the encoded event. |


    # 4.5. CONFIGURATION


    Logback is distributed under a dual license under the LGPL and EPL.


    Similar to log4j and java util logging, the configuration in logback is done with
    a configuration file. This file is named as logback-test.xml or logback.xml.


    But, if a file is not provided it looks for the following three files in order:


    +   - logback.xml

    - logback.groovy

    - logback.xml


    If no file is found, it still lets you adding to your application. It defaults
    to the Basic Configurator configuration. This configuration logs to the console.


    In order to use logback in your eclipse project, slf4j, the logback-core and logback-classic
    packages (jar files) must be present on the classpath of your project. The logback-core
    and logback-classic jar can be downloaded at the following location:


    https://logback.qos.ch/download.html


    Download the zip file and extract the contents of the file. To download the sjf4j
    file, it needs to be downloaded from another location as follows:'
