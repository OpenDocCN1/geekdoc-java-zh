  md: '# Java Logging Framework 31


    # Example 3: File Handler with default Java configuration


    In this example, we demonstrate the use of a File Handler. This example outputs
    the log messages to a file and not on the console. In the java.util.logging package,
    the default configuration doesn''t declare a file Handler. But, it provides default
    properties as output file pattern, rotation, and size. The configuration file
    used is the default file that has been provided by Java.


    ```

    # logging.properties

    ############################################

    # Default Logging Configuration File

    # You can use a different file by specifying a filename

    # with the java.util.logging.config.file system property.

    # For example java.util.logging.config.file=myfile


    ############################################

    # Global properties

    # #handlers specifies a comma-separated list of log Handler

    # These classes must be installed on the system before startup.

    # Note that these classes must be on the system classpath

    # By default we use a ConsoleHandler, which will only

    # show messages to the console and above levels.

    handers=java.util.logging.ConsoleHandler


    # To add the File Handler, use the following line.

    #handlers=java.util.logging.FileHandler,java.util.logging.ConsoleHandler


    # Default global level

    # This specifies which kind of events are logged across

    # all handlers. For any given facility this global level

    # can be overridden by a facility specific level

    # Note that the ConsoleHandler also has a separate level

    # setting to limit messages printed to the console.

    level=INFO


    # Handler properties

    # Describes specific configuration info for Handlers.

    # Default file output is in the home directory.

    java.util.logging.FileHandler.pattern=%h/java.log

    java.util.logging.FileHandler.count=5000

    java.util.logging.FileHandler.formatter=java.util.logging.XMLFormatter


    # limit the messages that are printed on the console to INFO and above.

    java.util.logging.ConsoleHandler.level=INFO

    java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter


    # Example to customize the SimpleFormatter output format

    # to print one-line log message like this:

    # <level> <message> <date>

    java.util.logging.SimpleFormatter.format=%4$s: %5$s [%1$tT]%n


    ############################################

    # Facility specific properties...

    # Provides extra control for each logger.

    ############################################


    # For example, set the com.xyz.foo logger to only log SEVERE

    # messages:

    com.xyz.foo.level= SEVERE

    ```'
