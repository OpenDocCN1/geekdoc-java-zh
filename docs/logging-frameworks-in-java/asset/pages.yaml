  md: '# 182 Logging Frameworks in Java


    SLF4J is Simple Logging Facade for Java which is a framework or abstraction for
    logging that allows the user to plug-in the logging framework dynamically at deployment
    time. It provides a layer (SLF4J layer) of abstraction between the application
    and the underlying logging framework used (SLF4J manual, 2017).


    This framework was created by Ceki Gulcu in 2004. The latest release is version
    1.7.25 (SLF4J News, 2017).


    SLF4J acts as a channel between the application and the underlying logging framework
    of the application.


    We have already seen SLF4J briefly in the previous chapter. It is simple to integrate
    into any java project. To use slf4j in your project, we need to add the slf4j-api.jar
    in the classpath of the project. In addition to this, the jars of the underlying
    framework must be provided as well.


    In this chapter, the upcoming sections, we shall take a look at the SLF4J in detail.


    # 5.1. FEATURES AND ADVANTAGES OF SLF4J


    Some advantages of using SLF4J are as follows (SLF4J manual, 2017):


    +   1. It provides the ability to select your logging framework at the time of
    application deployment.

    2. It offers binding for other logging frameworks such as log4j, logback, java
    util logging etc.

    3. It provides a tool to migrate java projects to slf4j.

    4. It is fast and supports parameterization of your logging information.

    5. It provides API jars to bridge legacy code from old logging frameworks.


    # 5.2. SLF4J DOWNLOAD


    To use slf4j in your java application, the slf4j package is required. It can be
    downloaded from the official SL4J downloads page https://www.slf4j.org/download.html


    Once downloaded, extract the contents of the compressed file. SLF4J package comes
    with several jar files that are known as binding jars that help'
