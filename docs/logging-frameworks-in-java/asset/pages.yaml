  md: '# 2.1. INTRODUCTION


    This is the default logging framework provided as part of the Java Language Packages.
    The Java API provides a sub-package in the java.util package called the logging
    that consists of the logging API. The java.util.logging package was introduced
    in the Java SE 4 (1.4) release in 2001.


    This package provides several classes and interfaces that support and implement
    the core logging functionalities. This package was introduced in order to provide
    a means to maintain, troubleshoot and repair the software at the client side in
    a simple way.


    Logging was put into place in order to handle the following different scenarios:


    # Resolve issues found during software development


    Logging may be used to aid the developers during the course of development of
    the software. The API could be used to obtain additional information about the
    application that is currently under development. A developer can generate logging
    information for the target application to determine where his point''s behavior
    has changed. This could help him locate the root cause of the bug/issue. Although
    a developer has access to debugging and profiling tools in him current development
    environment that help him resolve issues found during the development cycle, logging
    can be used as an additional hassle-free method to obtain information about the
    application under development.


    Additionally, in a distributed environment with several clients and servers or
    in an environment without a development environment such as servers, a developer
    can easily test his application with the help of logging.


    # Resolving issues detected by System Administrators and End Users


    Logging can be used to analyze, track and fix issues that are found by the users
    of the system and the system administrators. The logging functionality can be
    used to obtain logs of the target application to fix these issues. The development
    team can focus on generating logs for the specific part of the application that
    seems to pose a problem and then analyze the logs to determine the cause of the
    issue and resolve it.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Java Logging Framework 7


    This includes regular day-to-day bugs/issues that can be analyzed, tracked and
    fixed in a local environment such as basic configuration issues, security issues,
    memory issues, etc.


    # 3. Issues detected at the client end


    Logging is an excellent method to fix issues that are detected at the client end.
    These issues are the ones that are found in a production context when the software
    has already been deployed at the client location. Issues detected in a client
    environment are considered to be of the highest priority and they need to be resolved
    with minimum delays. Moreover, in such a scenario, the development team may not
    have access to the production environment. This usually happens in large distributed
    teams where each of the software development is handled by different teams. Hence,
    in such scenarios prove to be beneficial. The logs that have been generated at
    the client end can be provided to the development team which can further analyze
    the logs and resolve the issue. In such cases, the logs are further detailed containing
    a lot of information about the activities of the system. Moreover, in such a situation
    the tracing level of all the components may be as detailed as possible. Another
    possibility is that the logging information for a specific sub-component/sub-components
    might be traced in a deeper way as compared to the others much more information
    on their execution internally within the sub-component.


    All these configurations can be done with the properties file that serves as the
    configuration file. This will be discussed in detail in further sections.


    # 4. Issues detected by Service Engineers


    These issues are the ones that are found by the service and maintenance team that
    is located at the client location. Issues found in this context are similar to
    production issues. Logging can be used by the Service Engineers to diagnose and
    resolve issues that were detected. Similar to the production environment, the
    logging information needs to be extremely detailed and complex as compared to
    that provided in a development environment. In this situation, all or some of
    the components/sub-components will require a deeper tracing level as compared
    to other components.


    A detailed logging/tracing level can be pre-configured at the time of development
    of the software. This will be discussed in detail in upcoming sections.'
  merge: -1
