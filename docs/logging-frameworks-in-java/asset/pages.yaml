  md: '2 Logging Frameworks in Java


    # 1.1. WHAT IS LOGGING?


    Logging is nothing but the act of recording an activity. It is an action of maintaining
    a record of the events of an application.


    It is the process of writing log messages during the period of execution of a
    software application to a common central place. The activity of logging allows
    us to maintain and report all types of statuses of the application such as error
    messages, warnings as well as a general status of the application. These messages
    are stored centrally and can be retrieved for analysis at a later point.


    The logs serve a wide variety of uses; they can be used to debug out the cause
    of problems in the system, perform system analysis in terms of performance or
    to run a statistical analysis of the system.


    # 1.2. WHY DO WE NEED LOGGING?


    Logging is a simple low-tech method of debugging (log4Delphi.sourceforge.net,
    2017). Logging is essential because in certain situations it may be the only way
    to debug the application. In a multithreaded Java application or a large distributed
    client-server application, this serves as the only way to know the status of the
    application. Particularly in case, an application is at the production stage where
    a debugger cannot be used, logging is the best for running. Additionally, logging
    can help in determining and analyzing timing related issues as well; with the
    help of time-stamped log statements.


    Over the years, logging has proved to be instrumental in the SDLC lifecycle as
    it has benefits. Logging has the capability to provide specific context related
    to the current execution of an application. Logging is devised and built to let
    a simple Java program or advanced Java components such as servlets, applets, EJBs
    etc. generate useful messages that are of interest to the developers, administrators,
    engineers and the end users. Once log statements are added to the code, the log
    output is generated automatically. Furthermore, the logs can be persisted thereby
    allowing developers to analyze them at a later stage. Apart from the use of logging
    in the software development life cycle, a logging framework that is API rich can
    be used as an auditing tool.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Introduction to Logging 3


    # 1.3. WHAT IS A JAVA LOGGING FRAMEWORK?


    A Java logging framework is a computer data logging package for the Java platform
    (Java Logging Framework, 2016).


    Logging is generally a standard for software development teams. In order to ease
    the process of logging, there are several frameworks that simplify and standardize
    this process of logging for the Java platform (Java Logging Framework, 2016).


    A logging framework is designed in such a way that it is easy to incorporate in
    an existing application with minimal overhead and configuration requirements.


    A logging framework is typically made up of the following components:


    # 1. Logger


    The most important component of any logging framework is the Logger. This is the
    object which performs the logging operation in applications and is just called
    ‘Logger'' (Lars Vogel, 2016). A log entry can have different levels of criticality
    based on the nature of the application. Typically, a log message can be of type
    DEBUG, INFO, ERROR, WARNING etc. This is called a logging level. The logging levels
    vary based on the logging framework. The logger provides the ability to define
    different levels of importance of the logged messages and the ability to use different
    destinations for the output such as the console, a file, etc. Additionally, a
    logger is configurable and hence we have the choice of disabling certain types
    of log messages from the log output. For instance, in a production scenario, we
    may not want to see all the log messages that are of a particular type such as
    debug. The logger essentially captures the log messages.


    # 2. Appender


    Once the log messages have been captured by the logger, this logging information
    needs to be sent to an appropriate destination. This destination is the appender,
    which writes the log messages to the specified destination. The appender is attached
    to the logger and it listens for messages of particular logging levels (Error,
    debug, etc). Its main goal is to take the logging information and post it to the
    correct destination such as a console or file. The appender is capable of writing
    messages to the following destinations:


    +   - File;

    - Console;'
  merge: -1
