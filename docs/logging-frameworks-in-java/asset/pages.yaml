  md: "# 158 Logging Frameworks in Java\n\nspecific configuration file. Most of these\
    \ files have several parts of the configuration that are common to all environments.\
    \ As a result, log configuration is duplicated and the configuration becomes redundant.\
    \ Nevertheless, logback provides the ability to perform conditional processing\
    \ of the logback configuration files using it, then, else constructs which to\
    \ do all the configuration using a single file.\n\nLogback makes use of the Janino\
    \ library to enable conditional processing. The Janino library consists of the\
    \ conditional processing and evaluation API. To add this library, download the\
    \ janino.jar from the Janino homepage or from GitHub. ( https://github.com/janino-compiler/janino).\
    \ From the version 2.6.0 and above, the Janino library requires the commons-compiler\
    \ as jar. Download the library and use it in your classes as follows:\n\n![](img/e779f11d414c53184ecfd97086dcfe13_171_0.png)\n\
    \nThe configuration file is as follows:\n\n```\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<configuration>\n  <property name=\"content\" resource=\"app.properties\"\
    />\n  <if condition=\"query(\\${ENV_NAME}).contains('DEV')\")\n    <then>\n  \
    \    <appender name=\"Console\" class=\"ch.qos.logback.core.ConsoleAppender\"\
    >\n        <pattern>%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n</pattern>\n      </appender>\n\
    \    </then>\n    <else>\n      <appender name=\"File\" class=\"ch.qos.logback.core.FileAppender\"\
    >\n        <pattern>%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n</pattern>\n      </appender>\n\
    \    </else>\n  </if>\n</configuration>\n```"
