  md: '# Java Logging Framework 13


    the java.util.logging package, the Level class holds the different levels that
    can be attributed to log statements. A log level is simply an integer that determines
    how critical the log message is. The level is an integer that determines how important
    the message is (Level, 2017). It is a rough guide that denotes the urgency and
    importance of a particular log message. The higher this value, the more critical
    the message is. A higher value indicates higher priority.


    The following 7 levels (descending order of importance) have been provided by
    default in the java.util.logging package in the class Level: (Table 2.1).


    **Table 2.1:** Log levels (Java Platform SE 7), 2017


    | Log Levels |

    | SEVERE |

    | WARNING |

    | INFO |

    | CONFIG |

    | FINE |

    | FINER |

    | FINEST |


    Each log level corresponds to a constant that is declared in the class Level.


    Log levels can be used for filtering purposes as well. All the log messages that
    are valued below a particular level can be rejected or suppressed. The logger
    class can make use of the level() method to configure the logger to accept log
    messages only above a certain level. For example, if we set the log level to INFO,
    all the messages of type CONFIG, FINE, FINER and FINEST are ignored.


    This has been illustrated with the help of examples in Section 2.5.


    # 2.27. Control Flow


    As shown in Figure 2.1, the flow of control for logging is simple. The java application
    creates a Logger. This object is called by the application. A logger is generally
    organized hierarchically (using namespaces). Each logger surveys the log level
    that it is focused on and rejects other log requests that'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 14 Logging Frameworks in Java


    are not satisfy its requested level demands or are below this defined log level.


    When the Logger instance is called, the logger object creates an object of type
    Log Record. Once a Log Record is created, this is passed to the Handler which
    handles publication of log messages. Moreover, a Logger and a handler both can
    use Filters or log to focus on a particular Log Record. Furthermore, the handler
    has the possibility to format the message before it is sent to the output stream
    (external environment). Localization of a log message specific to a particular
    geographical, cultural or political region can be done with the help of a Formatter.
    The external environment can constitute the console, a file, a remote file, etc.


    All the output handlers of a logger are tracked by it. A logger can be configured
    to ignore certain handlers which have been configured below a certain log level.


    As discussed in the previous sections, Handlers can also send output to another
    Handler. The Memory Handler is one example. It maintains a buffer of records and
    waits for a trigger so that it can publish the records to an external source.
    In this case, the Formatting of the log record is done by the last handler in
    the control flow.


    The logging API is developed and structured in such a way as to minimize the cost
    of logging. Events such as Formatting and Localization are delayed until they
    are requested by the Handler. Also, with the use of a Memory Handler, formatting
    does not need to be done, thereby saving costs of formatting.


