    # 5.6.2. Multiple Bindings on the Classpath


    This is yet another error that occurs quite frequently.


    Sometimes, during the course of development, developers switch between multiple
    logging frameworks. Hence, sometimes it may happen that we leave the old bindings
    on the framework. In this case, the logging does not work properly.


    Consider that your project was configured to use logback for logging purposes.
    In this case, the following jars are present on your classpath:


    +   - slf4j-api.jar

    - logback-classic.jar

    - logback-core.jar


    Now, you wish to configure your project to use log4j2. You proceed to add the
    following jars to your classpath:


    +   - log4j-core.jar

    - log4j-api.jar

    - slf4j-log4j-impl.jar

    - slf4j-api.jar


    But, you forget to remove the previous jar files. Now, your classpath looks like
    this:


