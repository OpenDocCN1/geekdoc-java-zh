  md: '# 6.3. COMPONENTS OF TINY LOG


    The Tiny Log framework is not complex and has minimal components that work together
    to provide logging functionality.


    It has 2 main components: Logger, Level, Writers, and Configurator.


    # 6.3.1. Logger


    The logger is the main component of this framework. The logger is the component
    that is used to generate the log events. In tiny log, the logger is a static class.


    Some of the important methods of this class are as follows:


    Table 6.1: Logger Methods (tinylog 1.2. API, 2017).


    | Method | Description |

    |---|---||

    | Configurator getConfiguration() | This method returns a copy of the current
    tinylog configuration. |

    | Level getLevel() | This method returns the global log level. |

    | Level getLevel(String string) | This method returns the level for a class or
    package. |

    | void debug(String message) | This method logs a debug message. |

    | void info(String message) | This method logs an information message. |

    | void error(String message) | This method logs an error message. |

    | void warn(String message) | This method logs a warn message. |

    | void trace(String message) | This method logs a trace message. |

    | void debug(Throwable t) | This method logs a debug message with the stack trace.
    |

    | void info(Throwable t) | This method logs an info message with the stack trace.
    |

    | void error(Throwable t) | This method logs an error message with the stack trace.
    |

    | void warn(Throwable t) | This method logs a warn message with the stack trace.
    |

    | void trace(Throwable t) | This method logs a trace message with the stack trace.
    |

    | void debug(Throwable t, String message, Object...arguments) | This method logs
    a debug message with the stack trace and the given arguments |

    | void info(Throwable t, String message, Object...arguments) | This method logs
    an info message with the stack trace and the given arguments |'
