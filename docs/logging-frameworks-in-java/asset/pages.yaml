  md: '# Logging Frameworks in Java


    Example: tinylog.writer policies = count: 10


    +   - Startup Policy: This policy rolls out a new file each time the application
    is started. The keyword that should be used is ‘startup’. This is the default
    policy set up for the rolling file writer. If no other policy is configured, then
    the startup policy is activated by tiny log.


    +   4. JDBC Writer: This writer writes the log messages to an SQL database table.


    This writer supports writing of logs to the database in batch mode as well. Moreover,
    in case of losses of connections, tinylog supports the reestablishment of the
    lost connection. The configuration for the logger is the same configuration that
    is used in case of the configuration of jdbc with the url, sid, and hostname.
    The username and password (if any) for the database can be configured as well.


    Using the jdbc writer the following values can be logged (tinylog, 2017)


    | Parameter Name | Description |

    |---|---|

    | DATE | The date and time pertaining to the log |

    | THREAD_ID | The identifier of the current thread |

    | THREAD_NAME | The name of the current thread |

    | RENDERED_LOG_ENTRY | The final value of the rendered log entry used for text
    format |

    | PROCESS_ID | The process id of the application |

    | CLASS | The fully qualified name of the class without its package name |

    | CLASS_NAME | The name of the class that generated the log request |

    | METHOD | The name of the method that generated the log request |

    | PACKAGE | The package that issues the log requests |

    | MESSAGE | The log message |

    | LINE | The line number that generated the log request |

    | EXCEPTION | Exception (if any) thrown by the program |

    | LEVEL | The level of the log entry |

    | CONTEXT | The values set within the logging context |

    | FILE | The name of the java source file that generated the log request |'
