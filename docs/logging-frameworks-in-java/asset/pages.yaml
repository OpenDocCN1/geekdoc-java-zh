  md: '5. Shared File Writer: This writer is used to share a file among several logger
    instances. This is generally used in a multithreaded context.


    6. Logcat Writer: This writer is used to log messages in an Android system/context.


    TinyLog provides a Writer interface which is implemented by all the writer classes.


    The methods provided by this interface are as follows (tinylog, 2017):


    **Table 6.2:** Writer Interface Methods (tinylog 1.2. API, 2017)


    | Method | Description |

    | --- | --- |

    | void write(LogEntry logEntry) | This method writes a log entry/message to its
    destination. |

    | void init(Configuration configuration) | This method is used to initialize the
    writer. |

    | Set<LogEntryValue> getLogEntryValues() | This method returns all the values
    of the log entries that are needed by the writer. |

    | void flush() | This method flushes out the log entries and puts any residual
    data. |

    | void close() | This method closes the current writer and frees all the resources
    it occupies from memory. |


    # 6.3.4. Configurator


    The configurator is used to configure the TinyLog Logger (tinylog 1.2 API, 2017).
    Some of the methods provided by this class are as follows:


    **Table 6.3:** Configurator class methods (tinylog 1.2 API, 2017)


    | Method | Description |

    | --- | --- |

    | Configurator add Writer (Writer) | This method adds a writer to output the log
    entries. |

    | Configurator add Writer (Writer, Level level) | This method adds a writer to
    output the log entries and sets the given level for the writer. |

    | Configurator add Writer (Writer, Level, String pattern) | This method adds a
    writer to output the log entries, sets the given level for the writer and sets
    the given pattern for the writer. |'
