  md: '# 2.6. MISCELLANEOUS FEATURES


    # 2.6.1. Security Issues


    In the java.util.logging package security issues within logging have not been
    considered in too much detail. Although logging is not considered to be the most
    important part of an application, a mechanism has been provided to ensure the
    protection of the configuration.


    The Logging Permission class provides security that prevents unauthorized class
    to change the log configuration. It is a security permission that needs to be
    defined which controls access to the updating of the configuration file. In this
    way, the untrustworthy code is not allowed to make changes and impede the functioning
    of the logger. Using this mechanism only trusted/registered applications are handed
    the required permissions to modify and update the logging configuration. So, the
    applications that do not have the appropriate permissions will only be to create
    logger and log messages, not add or remove loggers or handlers.


    But, a security breach present in the logging package is that untrusted applications
    still have the right to create, define and use their own anonymous loggers that
    are not registered anywhere in the logger namespace tree. These loggers are not
    checked for permissions and any class can modify the configuration of the logs
    using these loggers (Java Logging Overview, 2017).


    Another security threat is that spoofing is not prevented. This means that the
    source of calls for logging cannot be determined. The source may or may be fake.
    The XML formatter is susceptible to injection threats.


    Furthermore, the Java logging framework is vulnerable to DOS (Denial of Service)
    attacks. It is possible for any client to flood the application with dozens of
    meaningless log messages and attempt to mask an important log message.


    # 2.6.2. Remote Access and Serialization


    Although the java logging framework has been defined for use in a single address
    space and the class to logging methods are local. But we have the possibility
    of logging to remote locations. The Socket Handler is capable of writing data
    to machines on another network using messages in an XML format. XML format is
    a standard format that can be processed on many different types of systems.'
