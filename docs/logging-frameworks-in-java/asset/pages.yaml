  md: '# 2.2. COMPONENTS OF A LOGGING FRAMEWORK


    The logging framework in Java is composed of the following components: (Figure
    2.1).


    ![](img/e779f11d414c53184ecfd97086dcfe13_21_0.png)


    # 2.2.1. Logger


    As explained in Chapter 1, the logger is the main component of the logging framework.
    In the java logging package, a Logger class has been provided that does the work
    of a logger. Typically, the application calls a logger object to perform a logging
    operation.


    Loggers are entities that are named similar to dot-separated java packages (com.oracle).
    The logger namespace is entirely hierarchical and it is managed by the class Log
    Manager.


    The naming convention for a logger is the same as for java packages. Loggers constantly
    observe their parent logger in the java namespace tree for logging. The parent
    of a logger is its closest ancestor in the tree. The root logger (also named "")
    is the Logger that is highest up in the namespace and has no parent. In the case
    the logger is declared to be anonymous, its parent is root.


    All the loggers may inherit some attributes from their parents may be any of the
    following attributes:


    +   - Log level


    If a logger has a log level of null or it has not been set at all, then the Logger
    will traverse up the family tree to find a Logger with a Level that is not null
    and use this level.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '+   * Handler


    The default behavior of loggers in the Java logging framework is that a logger
    will send its output to the handlers of its parents in a recursive manner up the
    family tree.


    +   * Resource bundle names


    If a resource bundle has not been defined for a logger or it is null, it inherits
    the resource bundle from its parents. If its parents do not have a resource bundle
    defined, then the logger scans the parent tree recursively until a valid bundle
    name is found.


    The concepts of Handlers, Bundles and Log levels have been discussed in the next
    section.


    To create a logger instance of the class Logger is typically created. The instances
    of the Logger class are organized hierarchically. This means that if a Logger
    is at the lowest level in the hierarchy, it will forward its log messages/data
    to its parents/ancestors. A Child Logger may inherit certain properties related
    to logging configuration from their respective parent/parents in the tree/namespace.


    This enables filtering of other branches of Logger in a particular sub-tree.


    Log requests are maintained in the form of a Log Record object, which passes the
    requests between the Logger and the Handler. A Log Record object is an instance
    of the Log Record class which holds the contents of the log message and its level.


    # 2.2.2. Handler


    This component receives objects from the Logger object and publishes the object.
    Each and every logger object can have access to one or more handlers.


    The handler receives the log message from the application logger as in input and
    further exports/sends it to a certain destination/target. Standard targets for
    a handler include, output files, System log files, remote files, etc. Each logger
    must have at least one handler.


    The java.util.logging package provides the following standard handlers:'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Stream Handler


    This is the simplest type of handlers that is used for writing formatted logs
    to an object of type Stream. It is basically a stream-based handler. A log record
    is output to a particular stream []. The main aim of this handler class is to
    serve as a base class that can be further used in the implementation of other
    handlers for logging.


    # Console Handler


    This is another straightforward handler class that is used to write log records
    to the System. Err stream it is a system-based handler that publishes the log
    output to the console. In a development environment that consists of an IDE such
    as Eclipse, the log output is displayed in the console tab as shown below.


    ![](img/e779f11d414c53184ecfd97086dcfe13_23_0.png)


    # File Handler


    The File Handler is a handler that writes log messages to a single file or a set
    of rotating log files (File Handler, 2017). Rotation of files is done to ensure
    smooth memory management. As each log file reaches a particular size, it is closed
    for writing, rotated out and a new file is opened. Typically, the order of naming
    is numerical and successive; the numbering starting from 0 is appended to the
    filename.


    Additionally, we have the possibility of rotating the files on the basis of days,
    weeks or months.


    # Socket Handler


    The Socket Handler is a handler this is used to send log records over a network.
    It writes the logs to remotely located ports (TCP). The records are published
    to a network stream by the Handler.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Memory Handler


    The memory handler is a handler that stores log records in its buffer. The buffer
    is circular and hence the earlier records are discarded from its memory. This
    handler stores the incoming Log Record object received from the Logger into its
    buffer and simply drops the previous records/inputs. This handler serves as a
    cheap method of buffering and further helps reduce costs related to the formatting
    of the log messages.


    This handler can be thought of as a temporary memory handler that saves the log
    records until a certain condition is met. Once this condition is met, the Memory
    Handler will publish the log records to another Handler which will then publish
    it to discard target location.


    This condition is handled by the **push Level** parameter which will be discussed
    in Section 2.5.


    Developers also have the possibility to write their own customized handlers. This
    can be done by writing a completely new handler from scratch or by subclassing
    one of the existing handlers.


    A handler can be set on and off using the setLevel method provided by the handler
    API.


    A Log Manager is generally used to set the default properties of a Handler. This
    shall be discussed in the upcoming sections.


    # 2.2.3. Filter


    The filter, as its name suggests is used to filter the log messages. The filter
    has the power to decide whether a log message gets published or not. This is extremely
    useful in case of production environments where only specific types of messages
    are printed and published in order to avoid large quantities of logs. In the java
    logging framework, the Filter class provides this functionality.


    Each logger has a filter associated with it. Whenever a log message is given to
    a logger, it first has to go through its filter. By default, the logger does not
    have a filter set. But, if a Filter has been configured for the logger, the message
    can be either accepted or rejected by the filter. A filter basically decides if
    a Log record is of any interest to or not.


    If no filter has been configured, each message is accepted by default.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 2.2.4. Formatter


    Before the log records are published to a destination, the handler has the possibility
    of formatting the log messages before they are sent to an output stream. Additionally,
    the messages can be localized as per a particular geographical region.


    Each handler has a Formatter associated to it. But the use of a formatter is optional.


    In order to format a message before publishing it, the Handler classes use a class
    called Formatter to format an object of type Log Record.


    By default, the Java logging framework provides two in-built formatter classes.
    These two formatters inherit from the parent class: Formatter.


    They are:


    +   a. Simple Formatter


    This is a fairly simple type of data formatter that writes the log messages in
    a format that is easily readable by users. Summaries of logs are generated using
    this formatter.


    +   b. XML Formatter


    This formatter is a slightly advanced and structured formatter. It writes the
    log data in detailed fashion in XML-based format.


    The handler classes in the logging API make use of either of the above two formatters.
    But, a developer can also develop his own custom formatter.


    Similar to a Handler, this can be done by subclassing the Formatter class.


    # 2.2.5. The Log Manager


    In the Java, logging framework there exists a special component called the Log
    Manager.


    It is a global component that tracks and manages all the logging information.
    It contains a namespace of all the loggers in a hierarchical manner. It also contains
    logging control properties that are read from a configuration file. The configuration
    related to the logging shall be discussed in section 2.7.


    # 2.2.6. Log Levels


    Each log message that is logged by a logger has a log level associated to it.
    The level is nothing but the level of importance of the message. In'
  merge: -1
