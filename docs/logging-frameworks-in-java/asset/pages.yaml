  md: '# 4. Layout


    The layout interface, present in the logback-core package consists of methods
    that are implemented by all the concrete layout classes in the logback package.


    Some of the important methods of this class are as follows:


    Table 4.5: Layout interface methods (Logback-Parent 1.2.3 API, 2017)


    | Method | Description |

    | String doLayout(E event) | This method takes an event as an input and converts/formats
    it into a representable string format. |

    | String getContentType() | This method returns the content type of the logging
    information |

    | String getFooter() | This method returns the footer of the file for the current
    layout. |

    | String getHeader() | This method returns the header of the file for the current
    layout. |

    | String getFooter() | This method returns the footer of the formatted logging
    event. |

    | String getHeader() | This method returns the header of the formatted logging
    event. |


    # 5. Layout Base class


    This class implements the Layout interface and provides a skeleton for the derived
    Layout classes such as Pattern Layout, HTML Layout, etc. In addition to implementing
    all the methods of the Layout interface, it provides the following useful methods:


    Table 4.6: Layout Base class methods (Logback-Parent 1.2.3 API, 2017)


    | Method | Description |

    | void set File Footer (String footer) | This method sets the file footer for
    the current layout. |

    | void set File Header (String header) | This method sets the file footer for
    the current layout. |

    | void set Presentation Footer (String footer) | This method sets the footer for
    the current logging event. |'
