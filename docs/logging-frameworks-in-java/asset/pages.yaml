    In addition to the above components, another important part of the tinylog configuration
    is the format used for logging.


    The format decides the way in which the logs will be printed on the destination.
    Tinylog uses placeholders ''{}'' to specify the elements present in the log format.


    The default format is the following (tinylog, 2017):


    ```

    "{date:yyyy-MM-dd HH:mm:ss [{thread}] {class}.{method}()\n{level}:{message}"

    ```


    By default, the date and time are printed followed by the current thread name,
    followed by the fully qualified class name and method name on the first line.
    On the next line, the level of the message and the message is printed.


    The various placeholders and their meaning are provided in the table below:'
