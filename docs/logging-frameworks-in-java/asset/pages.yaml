- img_proc: true
  md: '# 6.1. INTRODUCTION


    Tiny log is a lightweight logging framework for Java and android applications.
    It is open source, distributed under the Apache License 2.0 and was released in
    August 2012 (tinolog, 2017). The very first version to be released was 0.6. The
    latest stable version is 1.2.


    Some of the useful features of this framework are as follows (tinolog, 2017):


    +   - It is lightweight and has a very small size. The jar file has a size of
    94KB.

    - It is easy to configure and use. Like most logging frameworks it can be configured
    using a properties file, system properties or programmatically.

    - It makes use of precompiled patterns that optimizes the performance making it
    fast.

    - TinyLog supports multithreaded applications.

    - It provides bindings for a number of different logging frameworks as Apache
    Commons Logging, Log4j1.x, and slf4j as well.


    # 6.2. DOWNLOAD


    Tiny log is fairly simple to install. First, we need to download the tinolog jar
    file


    It can be found at the following location:

    http://www.tinolog.org/download

    Once we download the zip file, we extract its contents.


    | Name | Date modified | Type | Size |

    |---|---|---|--|

    | license.txt | 30-09-2017 17:39 | Test Document | 11 KB |

    | readme.txt | 30-09-2017 17:39 | Test Document | 2 KB |

    | tinolog-1.2.jar | 30-09-2017 17:39 | Executable Jar File | 92 KB |

    | tinolog-1.2-javadoc.jar | 30-09-2017 17:39 | Executable Jar File | 250 KB |

    | tinolog-1.2-sources.jar | 30-09-2017 17:39 | Executable Jar File | 84 KB |


    As we can see, the tinolog jar file is very small and has a size of 92 KB. To
    use in a Java project, we simply add it to the project build path. The configuration
    will be discussed in the next section.'
