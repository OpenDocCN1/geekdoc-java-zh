    console.layout.pattern = %d %p [%t] %c - %m%n\n# define the File appender\nR.type\
    \ = RollingFile\nR.name = ${filename}\nR.filePattern = ${filename}-\\%d{yyyy-MM-dd}.log\n\
    R.layout.type = PatternLayout\nR.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %p (%c)\
    \ - %m%n\nR.policies.type = SizeBasedTriggeringPolicy\nR.policies.time.interval\
