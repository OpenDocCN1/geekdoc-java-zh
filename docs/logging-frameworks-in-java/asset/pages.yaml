    # 5.3. SLF4J bindings


    SLF4J provides several jar files, also as bindings in its distribution package.


    The slf4j-jdk14-1.7.25.jar is a binding for java util logging, i.e., jdk 1.4 logging.
    The slf4j-jcl11-1.7.25.jar is a binding for Jakarta Commons Logging framework.
    The slf4j-log4j12-1.7.25.jar is a binding for the log4j 1.2 version.


    The log4j-over-slf4j-1.7.25.jar provides binding for the log4j so that implements
    the log4j api. Using this jar, any java application has the possibility to migrate
    to slf4j without changing the code. In order it is sufficient to replace the log4j
    jar file with the log4j-over-slf4j file.


    For ease of migration from jcl to slf4j the package has a jar file named jcl-over-slf4j.jar
    that implements the api of jcl but uses slf4j as the base.


    Additionally, slf4j provides a slf4j-simple-1.7.25.jar binding that supports a
    simple logger. It sends logging events to the system. Err or the'
