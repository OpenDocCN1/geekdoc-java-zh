  md: "# Java Logging Framework\n\nAs we can see, only two log messages have been\
    \ logged in the File Handler output 'Logging.log'.\n\n# Example 8: Filters that\
    \ filter a specific log\n\nThis example implements a Filter that filters out messages\
    \ of level INFO. Any messages with this level are rejected by the logger.\n\n\
    To filter the log output, we need to implement the Filter interface and implement\
    \ the isgable() method.\n\n```\nLoggingExample.java\npackage com.java.logging.examples;\n\
    \nimport java.util.logging.Filter;\n\npublic class LoggingFilterExample implements\
    \ Filter {\n    private static final Logger LOGGER = Logger.getLogger(LoggingFilterExample.class.getName());\n\
    \n    public static void main(String[] args) {\n        // set the handler for\
    \ the logger;\n        LOGGER.addHandler(new LoggingExample());\n        LOGGER.severe(\"\
    Severe message\");\n        // This log message will get published as its level\
    \ is not INFO\n        LOGGER.info(\"Information message\");\n        // Since\
    \ this is a log message of level WARNING it will be ignored by the logger\n  \
    \      LOGGER.warning(\"Warning message\");\n        // This log message will\
    \ get published as its level is not INFO\n        LOGGER.warning(\"Warning message\"\
    );\n    }\n\n    // Override the isLoggable method to filter messages of level\
    \ INFO\n    @Override\n    public boolean isLoggable(LogRecord record) {\n   \
    \     // return false if the Level is INFO this message won't be logged\n    \
    \    if (record.getLevel() == Level.INFO) {\n            return false;\n     \
    \   }\n        // else return false\n        return true;\n    }\n}\n```"
