  md: "# Logging Frameworks in Java\n\nThis works well in case of a small and simple\
    \ application. However, in case of large-scale applications that span over several\
    \ environments and servers, there may be several properties specific to the Operating\
    \ system that may need to be checked by the logging configuration prior to logging.\
    \ In an environment that is large and complex, it becomes difficult to maintain\
    \ a single file containing all the properties to be checked.\n\nIn such cases,\
    \ system properties can be used. Generally, every large-scale application makes\
    \ use of system properties to store the environment name or context. The logback\
    \ logging functionality has the option of making use of the system property in\
    \ its configuration. This is done with the help of the ‘scope’ element in the\
    \ configuration files.\n\nWe set the scope to ‘system’ and then recover the values\
    \ of the environment variables.\n\nThis is shown below:\n\n```\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?>\n<configuration>\n  <property name=\"system\"\
    \ value=\"DEV\"/>\n  <if condition=\"property('system').contains('DEV')\">\n \
    \   <include file=\"F:\\workspace\\Logback\\src\\logback-dev.xml\"/>\n  </if>\n\
    \  <else>\n    <if condition=\"property('ENVIRONMENT').contains('PROD')\">\n \
    \     <include file=\"F:\\workspace\\Logback\\src\\logback-prod.xml\"/>\n    </if>\n\
    \    <else>\n      <if condition=\"property('ENVIRONMENT').contains('GAX')\">\n\
    \        <include file=\"F:\\workspace\\Logback\\src\\logback-gax.xml\"/>\n  \
    \    </if>\n      <else>\n        <include file=\"F:\\workspace\\Logback\\src\\\
    logback-default.xml\"/>\n      </else>\n    </else>\n  </else>\n</configuration>\n\
    ```\n```\n\nWe keep the same configuration file as before but we change the scope\
    \ to ‘system’.\n\nWe go to the system variables and create a new variable called\
    \ ‘ENVIRONMENT’ with the value ‘DEV’ as follows:"
