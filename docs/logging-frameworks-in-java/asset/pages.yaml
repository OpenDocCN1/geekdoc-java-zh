- img_proc: true
  md: '# Logback 121


    The Logback framework provides automated reload of the configuration files. Once
    a change has been made to the file, it is reloaded on its own. It uses a scanning
    process to scan the configuration files. This mechanism is extremely rapid, dynamic
    and scalable in terms of a large amount of parallel executing threads and is free
    of contention. Additionally, it doesn''t use another separate thread for the purpose
    of scanning which saves memory.


    Logback has a strong failure recovery system in I/O. The File Appender and all
    its subclasses have the capability of handling I/O failures without additional
    overhead. In case a file stops working for some time, a reboot of the system is
    no longer needed in order to continue logging. Once the server starts functioning,
    the appender will recover from the error quickly and continue its work.


    Another interesting feature provided by the logback framework is that now provides
    API to handle the removal/deletion of archived logs automatically. A property
    <<maxHistory>> for rolling appenders is provided which stands for the maximum
    number of archived log records that can be kept. For example, if we set a monthly
    rolling policy and wish to delete logs older than a year, this property can be
    set to 12. This will automatically delete log records that are older than 12 months.
    This property is explained with the use of Section 4.6


    Logback also has the capability of being able to compress logs that are archived
    at the time of a file rollover in the rolling file appender. This event is an
    asynchronous event and hence doesn''t put your application on hold during the
    time it compresses the files.


    The logback framework supports the writing of a single file by several File Appenders
    that run on multiple JVM machines. This is done via the prudent method.


    Logbacks Lilith which is a logging and access event viewer for logback. It is
    capable of handling large amounts of log records.


    Another attractive feature provided by logback is that it provides us the possibility
    to execute only parts of the configuration based on certain conditions. For example,
    in a software development life cycle, the developers make use of different environments
    such as development, testing, pre-production, and production. Although these files
    have many properties in common, we generally have to create separate configuration
    files for each environment. But this is not the case with logback. Logback prevents
    duplication of code by supporting conditional operators such as'
