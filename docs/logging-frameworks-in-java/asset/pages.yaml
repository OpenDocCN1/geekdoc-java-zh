  md: "We define 2 simple interfaces that we shall implement in the form of lambda\
    \ expressions. The interfaces are as follows:\n\n```\nInterface1.java\npackage\
    \ com.java.logging.tinylog;\n\ninterface Interface1 {\n    String message();\n\
    }\n```\n\n```\nInterface2.java\npackage com.java.logging.tinylog;\npublic interface\
    \ Interface2 {\n    int calculate(int a, int b);\n}\n```\n\nWe use the following\
    \ java class to log messages using lambda expressions:\n\n```\nTinyLogExample22.java\n\
    package com.java.logging.tinylog;\nimport org.pmw.tinylog.Configurator;\npublic\
    \ class TinyLogExample22 {\n    public static void main(String[] args) {\n   \
    \     // call the writer to configure a new console writer\n        Configurator.activate(Config).writer(new\
    \ ConsoleWriter()).level(Level.TRACE).activate();\n        // log regular messages\n\
    \        Logger.error(\"Error Message\");\n        Logger.warn(\"Warning Message\"\
    );\n        Logger.info(\"Information Message\");\n        // log messages using\
    \ lambda expressions\n        // Provide functional implementation of the interface\
    \ method message()\n        Interface1 i1 = () -> {\n            return \"The\
    \ application is stable. No issues to report\";\n        };\n        // log message\
    \ without parameters\n        Logger.info(i1.message());\n        // log message\
    \ with message description and parameters\n        Logger.info(\"Application Message:\
    \ \" + i1.message());\n        // Provide functional implementation of the interface\
    \ method calculate()\n        Interface2 i2 = (a, b) -> {\n            return\
    \ a + b;\n        };\n        // log message using interface2\n        // log\
    \ message with only parameters\n        Logger.info(i2.calculate(5, 10));\n  \
    \      // log message with message description and parameters\n        Logger.info(\"\
    The value returned is: \" + i2.calculate(15, 10));\n    }\n}\n```\n\nThe output\
    \ generated is as follows:"
