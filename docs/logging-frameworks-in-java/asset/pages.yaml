  md: '# Log4j 67


    The successor version log4j 2.0-alpha1 was released in 2012. Since then several
    versions of log4j 2.x have been released. The latest version is log4j 2.9.1. The
    release history can be found at the following link: https://logging.apache.log4j/2.x/changes-report.html#a2.9.1


    # 3.3. LOG4J FEATURES


    Log4j offers several advanced features for simplifying logging as follows (Gülcü,
    2003):


    +   1. Log4j offers fast, thread-safe logging services.

    2. Log4j offers a dynamic configuration of properties at runtime.

    3. Log4j offers its own version of garbage free logging which saves memory.

    4. Multiple appender outputs along with internationalization.

    5. It is based on a plugin system which makes it easy to extend the existing framework.

    6. It is fairly easy to customize different components such as log levels, handlers,
    and loggers.

    7. It can be used as an auditing framework due to its transparency and extended
    exception handling capabilities.

    8 It supports the Java 8 feature of lambda expressions which makes it easy to
    construct log messages.

    9. The way the log is formatted can be changed by providing custom layouts which
    is easier to manipulate using the Layout class.

    10. TCP and UDP support is provided by the Syslog appender.

    11. Log4j is open source software and has a wide support community.

    12. It is not restrictive to a specific set of classes that one needs to build
    open. The configuration in log4j is simple and not always bound to specific classes,
    packages or methods.


