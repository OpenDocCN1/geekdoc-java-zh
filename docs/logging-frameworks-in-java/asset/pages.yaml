  md: '# Logback 131


    +   - GE Event Evaluator Filter: This is a concrete class and it takes Boolean
    expressions written in Groovy language as the criteria for evaluation.


    +   - Janino Event Evaluator Filter: This is a concrete class filter and it takes
    a Java language block that returns a Boolean value as the criteria for evaluation.


    +   b. Turbo Filters


    Turbo Filters are slightly different from the regular filters. All the objects
    from this filter inherit from the TurboFilter class which is an abstract class.
    Turbo Filters work in a similar manner to regular filters and also use ternary
    logic to perform evaluation of the criteria.


    They differ from the regular filters in terms of context. In addition to being
    called invoked by an appender or a logger, these filters are called each time
    a logging event is initiated which gives them a wider scope than the regular filters.
    Another difference between the regular and the turbo filters is that objects do
    not need the creation or instantiation of a logging event to perform filtering.
    Hence, these filters are generally used for fast, speedy filtering of logs before
    the logging events have been created (Gülcü and Pennec, 2011).


    # 6. Encoders


    Encoders were introduced in the version 0.9.19 of logback. Encoders are used to
    change or format the log event into a byte array format. With the use of an encoder,
    once the log information is converted into a byte array, it can be further written
    to an output stream.


    Previous to the introduction of encoders appenders would use layouts to format
    the log information. But starting from this version, the File Appender and all
    its subclasses use an encoder instead of a layout. This change was introduced
    as encoders have better control over the formatting of the logging events which
    makes them quite useful. The functionality is provided by the Encoder interface
    in logback whose base class is present in the logback core and its implementations
    are present in logback-classic module.


    Appenders are configured to use an encoder just as they are configured to use
    layouts and filters. The Encoder Interface has a doEncode() method which is called
    each time the appender is called.'
