    # 3.7. LOG4J API


    This section covers the basic API classes provided by the log4j framework.


    # 3.7.1. Logger


    Loggers are the central unit of the log4j framework. Loggers are nothing but named
    entities (Gülcü, 2003).


    The loggers in log4j are named using the hierarchy rule.


    This rule is as follows:


    > “A logger is said to be an ancestor of another logger if its name is followed
    by a dot is a prefix of the descendant logger. A logger which is an immediate
    ancestor of a descendant is said to be a parent logger and the immediate descendant
    is the child logger.” (Apache Log4j API 2.9.1, 2017).


    To explain this with a simple example the named “com.abc” is a parent of “com.abc.package1.”


    The default root logger is parent of all the loggers. This logger is a special
    logger that always exists and whose level cannot be null. Additionally, it doesn''t
    possess a name and hence cannot be retrieved by its name.


    Programmatically, to retrieve the logger object, we use the static Logger () method
    of the class Log Manager class. Some of the important methods of this class are
    shown in the table below:


    Methods of the Log Manager class: (Apache Log4j API 2.9.1, 2017)


