    # 2.4. ENVIRONMENT AND CONFIGURATION


    As the java logging framework consists of the logging API, no specific installation
    with respect to the logging component needs to be done. Once the JDK has been
    installed, we have access to the java util logging API.


    But, in order to enable logging, we need to configure it. The configuration for
    enabling logging in any Java application is done with the help of a configuration
    file that is read when the application is started. This configuration file is
    a standard file of type ''java.util.properties''. The Properties class in java
    represents nothing but a persistent set of properties (java.util.logging (Java
    Platform SE 7, 2017). It is a file that stores keyvalue pairs and is thread-safe
    which means that it can be used in multithreaded environment.


    The configuration process for logging in Java can be done in two ways; by use
    of a properties file or by writing a class that handles the initialization of
    the configuration. We describe the above methods with examples as shown below.


    # 2.4.1. Using a Properties File


    As the java logging package is a part of the JDK API, a configuration file has
    been provided by default by java. This file is named as logging.properties.


    This file is located at the following location:


    Local path to jdk\lib\logging.properties


    By default, the logger is set to output the log messages to the console and the
    default log level is set to INFO. A SimpleFormatter is used to format the log
    messages that are sent to the console as output. Also, the File Handler has been
    configured that formats the log output using the XML formatter.


    The contents of this file are as follows:'
