    The next section discusses the Simple logger provided by SLF4J.


    #  5.4. SIMPLE LOGGER


    The SLF4J package has a simple logger in its package. This logger is a simple
    implementation of the slf4j logger interface that logs to the console or system.
    Err.


    A few methods provided by this logger are:


    Table 5.1: Method of Simple Logger (SLF4J 1.8.0-beta0 API, 2017)


    | Method | Description |

    | --- | --- |

    | debug(String message) | This method logs a message of level debug. |

    | error(String message) | This method logs a message of level error. |

    | info(String message) | This method logs a message of level info. |

    | warn(String message) | This method logs a message of level warn. |

    | trace(String message) | This method logs a message of level trace. |

    | debug(String message, Throwable t) | This method logs a message of level debug,
    including an exception stack |

    | error(String message, Throwable t) | This method logs a message of level error,
    including an exception stack |

    | info(String message, Throwable t) | This method logs a message of level info,
    including an exception stack |

    | warn(String message, Throwable t) | This method logs a message of level warn,
    including an exception stack |

    | trace(String message, Throwable t) | This method logs a message of level trace,
    including an exception stack |

    | String getName() | This method returns the name of the logger. |

    | void log(LoggingEvent event) | This method logs the logging event. |

    | String renderLevel(int level) | This method sets the level to the given level.
    |

    | Boolean isEnabled() | This method returns true if info messages are enabled.
    |

    | Boolean is ErrorEnabled() | This method returns true if error messages are enabled.
    |

    | Boolean is TraceEnabled() | This method returns true if trace messages are enabled.
    |

    | Boolean is DebugEnabled() | This method returns true if debug messages are enabled.
    |

    | boolean isWarnEnabled() | This method returns true if warn messages are enabled.
    |


    In addition to the methods, some static string properties are provided by this
    class that help in configuring the logger. The properties are as follows:'
