  md: "We define a resource file that contains the properties for our application\
    \ and we set the scope as context. In Logback, a property can be defined in three\
    \ possible scopes named local, context or system.\n\nIn the local scope, the property\
    \ is said to exist from the minute it is defined in the configuration file until\
    \ the execution of the configuration file (Gülücü and Pennec, 2011). The variables\
    \ defined in this scope are created each time a configuration file is read.\n\n\
    In the context scope, a property lasts as long as the context or until its value\
    \ is erased. Once a property is defined to be in this scope, it becomes a part\
    \ of the context and is available to all the logging events, remote events included.\n\
    \nIf a property is defined in the system scope, it is inserted into the system’s\
    \ properties of the JVM and this value exists until the JVM is not terminated\
    \ or its value is erased.\n\nThis file is created at the same level in our directory\
    \ tree as the configuration file.\n\nWe initialize this file with the ‘ENVIRONMENT’\
    \ property set to DEV as shown below:\n\n![](img/e779f11d414c53184ecfd97086dcfe13_172_0.png)\n\
    \nThe java class is as follows:\n\n```\npackage com.java.logback.examples;\n\n\
    import org.slf4j.Logger;\nimport org.slf4j.LoggerFactory;\n\npublic class LogbackExample5\
    \ {\n    public static void main(String[] args) throws InterruptedException {\n\
    \        // get logger object\n        Logger logger = LoggerFactory.getLogger(LogbackExample5.class);\n\
    \n        // log messages\n        logger.error(\"Error Message\");\n        logger.warn(\"\
    Warning Message\");\n        logger.info(\"Information Message\");\n\n       \
    \ // on exception\n        int[] a = {1, 2, 0};\n        try {\n            a[3]\
    \ = 2;\n        } catch (Exception e) {\n            logger.error(\"Array Index\
    \ is not within bounds\");\n        }\n    }\n}\n```"
