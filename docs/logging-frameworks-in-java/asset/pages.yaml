  md: "# Example 15: Regex Filter Example\n\nIn this example, we show the use of a\
    \ regex filter. We configure a regex to accept log messages that contain the string\
    \ pattern *message*. If the log messages match this, they are accepted; else they\
    \ are rejected.\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>n<Configuration>\n\
    \  <Appenders>\n    <Console name=\"consoleAppender\">\n      <RegexFilter regex=\"\
    .message.*\" onMatch=\"ACCEPT\" onMismatch=\"DENY\" />\n      <PatternLayout pattern=\"\
    [%logger{36}] %message %n\" />\n    </Console>\n  </Appenders>\n  <Loggers>\n\
    \    <Root level=\"trace\">\n      <AppenderRef ref=\"consoleAppender\" />\n \
    \   </Root>\n  </Loggers>\n</Configuration>\n```\n\nThe test java class is as\
    \ follows:\n\n```\nimport org.apache.logging.log4j.LogManager;\n\npublic class\
    \ Log4jExample15 {\n  // get the logger object from the LogManager\n  private\
    \ static final Logger LOG = LogManager.getLogger(Log4jExample15.class);\n\n  public\
    \ static void main(String[] args) throws InterruptedException {\n    // add standard\
    \ log statements\n    LOG.error(\"Error message\");\n    LOG.fatal(\"Fatal message\"\
    );\n    LOG.warn(\"Warning message\");\n    LOG.debug(\"Debug message\");\n  \
    \  LOG.trace(\"Trace message\");\n\n    // This message will not be displayed\
