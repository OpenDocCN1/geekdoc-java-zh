    # Example 2. Lambda Expressions


    In this example, we demonstrate the use of lambda expressions in logging. To start
    it, we first need to download version 1.3 of tinylog as the version 1.2 does not
    support lambda expressions.


    We download the version 1.3 from the tinylog downloads page:


    We add the tinylog-1.3.1.jar file to our classpath as follows:


    ![](img/e779f11d414c53184ecfd97086dcfe13_263_0.png)'
