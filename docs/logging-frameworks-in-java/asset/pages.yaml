    console. This logger output log message of higher level or above INFO. This simple
    uncomplicated binding can be used in case of small applications.


    Further, a NOP (no-operation) binding is present in the slf4j package as well.
    This is the default logger that is invoked if no other binding is present in the
    application. This logger output the log events to the console as well.


    In case of logback, the logback-classic inherently implements slf4j’s logger which
    means that using slf4j with logback incurs no overhead whatsoever in terms of
    memory and processing times (SLF4J manual, 2017).


    Switching logging frameworks is easy using slf4j. In order to change your logging
    framework, you need to add ONE binding to your classpath.


    If your application uses java util logging, then you have two jars in your classpath:
    slf4j-api and slf4j-jdk1.4.jar


    Now, if you want to replace this with logback, replace the slf4j-jdk1.4. by logback-classic.jar.
    For logback, you will also need to add the logback-core.jar as it forms the base
    of the logback-4J framework.


    The various bindings between SLF4J and various logging frameworks are explained
    by the image below:


    | SLF4J unbound | SLF4 bound to logback-classic application | SLF4J bound to log4j
    application | SLF4J bound to java.utilLogging application | SLF4J bound to simple
    application | SLF4J bound to nooperation application |

    |---|---|---|---|---|---||

    | SLF4J API slf4j-api.jar | SLF4J API slf4j-api.jar | SLF4J API slf4j-api.jar
    | SLF4J API slf4j-api.jar | SLF4J API slf4j-api.jar | SLF4J API slf4j-api.jar
    |

    | /devnull | Underlaying framework logback-core.jar | Adaptation layer slf4j-log4j.jar
    | Adaptation layer slf4j-jdk14-api.jar | Underlaying framework slf4j-simple.jar
    | Underlaying framework slf4j-nop.jar |

    | A invoking binding to B | | | Underlaying framework slf4j.jar | Underlaying
    framework slf4j.jar | JVM runtime | /devnull |

    | slf4j-jar artifact binding available in classpath | | | | | |

    | slf4j-jar artifact binding available in classpath | | | | | |

    | abstract logging api | native implementation of slf4j | adaptation layer | non-native
