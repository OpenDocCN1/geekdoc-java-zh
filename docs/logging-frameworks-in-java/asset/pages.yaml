    | static Logger get Logger () | This method returns a logger object with the name
    of the class that calls this method |

    | static Logger get Logger (String name) | This method returns a logger object
    with the specified name |

    | static Logger get Root Logger () | This method returns the root Logger |

    | Static Logger get Formatted Logger (String name) | This method returns a logger
    that is formatted with the specified name |'
