    | Place Holder Name | Description |

    | --- | --- |

    | {class} | The fully qualified name of the class that logged the message. |

    | {class_name} | The name of the class (not the full package name) that logged
    the message. |

    | {date} | The date and time the logging request took place. It is compatible
    with SimpleDateFormat in Java. |

    | {file} | Name of the java source file which issued the log request |

    | {line} | Line number in the java class where the log was invoked. |

    | {message} | The log message |

    | {method} | The name of method that invoked the log message. |n| {package} |
    The name of the package that invoked the logging request. |

    | {level} | The log level of the message. |

    | {thread} | The name of the current thread. |

    | {thread_id} | The ID of the current thread that invoked the log message. |

    | {context:key} | Key-value pair taken at runtime (Thread-safe) |


