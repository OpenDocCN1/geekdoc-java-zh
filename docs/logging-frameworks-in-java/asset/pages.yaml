    # ## 6.3.2. Level


    Similar to other logging frameworks, tinylog makes use of a level class holds
    the various levels used by the logger to log the messages.


    This class consists of an enumeration of the following log levels:


    +   -DEBUG

    -TRACE

    -INFO

    -ERROR

    -WARN


    The order of their priority is:


    TRACE<DEBUG<INFO<WARN<ERROR


    By default, tinylog is configured to log log messages of level INFO and above.


    This means that the debug and trace messages are ignored by the logger.


    # ## 6.3.3. Writers


    In tinylog, the writers are analogous to appenders and print the log messages
    to the desired location/destination such as console, file etc. (tiny **log 1.2**.
    API, 2017).


    The following writers are provided by tinylog:


    +   1. Console Writer: This writer writes the log messages on to the console.

    2. File Writer: This writer writes the log messages to a file.

    3. Rolling File Writer: This writer is like a Rolling File Appender and rolls
    out (rotates) the log files.


    Once a certain condition is met (size/ time for example) a new file is created
    and the old one is backed-up. Tinylog provides a **labeler** that is used to name
    the log files that are rotated. The labeler is analogous to a file'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'name pattern in logback/log4j. Also, rolling policies are provided that help
    define when to create/roll out a new file. Policies are analogous to Triggering
    policies used in logback.


    Similar to other frameworks used for logging, the labeler and the policies go
    in hand.


    Tiny Log comes with the following labelers:


    +   * Count Labeler: This labeler is used to label the rolled out files in a sequential
    way starting from 0 such as file.0.log, file.1.log and so on. To configure this
    the keyword ‘count’ must be used in the configuration.

    * Process Id Labeler: This particular labeler is used to label the rolled out
    files with the current process id such as file.1234.log. The keyword ‘pid’ is
    used to configure this labeler.

    * Time Stamp Labeler: This labeler is used to label the rolled-out files with
    the timestamp. This timestamp is generally a date format as specified by the Simple
    Date Format. The keyword ‘timestamp’ is used to configure this labeler for the
    writer.


    TinyLog has the following policies:


    +   * Hourly Policy: This rolling policy rotates log files on an hourly basis.
    The keyword to be used in the configuration is ‘hourly.’

    * Daily: This rolling policy rotates log files on a daily basis. The keyword to
    be used in the configuration is ‘daily.’

    * Weekly: This rolling policy rotates log files on a weekly basis. The keyword
    to be used in the configuration is ‘weekly.’

    * Monthly: This rolling policy rotates log files on a monthly basis. The keyword
    to be used in the configuration is ‘monthly.’

    * Yearly: This rolling policy rotates log files on a yearly basis. The keyword
    to be used in the configuration is ‘yearly.’

    * Size Policy: This rolling policy rotates log files based on the size of the
    log file. A roll-out happens when the given file size is reached. The keyword
    to be used in the configuration is ‘size.’ Example: tinylog. writer. policies=
    size: 1KB.

    * Count Policy: This policy is used to rotate the log files based on the count
    of the total number of log entries in the log file. The keyword to be used during
    configuration is ‘count.’'
