    # 3. Levels


    As we have already seen in the previous chapters, loggers and appenders can be
    assigned levels based on their priorities. Logback supports the following levels
    (in increasing order of importance): TRACE, DEBUG, INFO, WARN and ERROR. Logback
    has a class called Level (a final class) that handles levels. In logback, the
    Level class is present in the logback classic module.


    If no level is specified for a logger, it inherits the Level of the first logger
    in the hierarchy that has a Level that is not null. If the value for the level
    for all the loggers up in the hierarchy is null, then the logger inherits the
    log level from the root logger. The default log level of the root logger is debug.'
