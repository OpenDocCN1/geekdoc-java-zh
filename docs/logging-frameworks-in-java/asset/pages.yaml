  md: '# Logging Frameworks in Java


    +   * Send via email;

    * Append/add to a table in a database;

    * Network Socket; and

    * Distribute it via Java Messaging Services (JMS).


    # 3. Formatter


    A formatter is the component that is used to configure the format of the log messages.
    A formatter usually displays the log in a string format. It is used as a means
    to enhance the quality of the log and provide additional information about the
    logs such as time zones in addition to the log level, date and time log message.
    Formatters represent the data in a better way that is suited to needs of the application.


    In order to ensure that log messages can be added in a java program/application,
    the framework is built with powerful API that renders logging to be as inexpensive
    as possible. With the use of a logging framework, the stakeholders of the application
    can ensure that the log visibility can change dynamically; the code can produce
    detailed logs when required (in case of critical errors) and limit the logs produced
    under normal. The API within a framework provides mechanisms to change and control
    the display of logs dynamically, which makes logging an inexpensive yet extremely
    helpful activity. The API differs from framework to framework, but most frameworks
    provide interfaces and classes that serve as hooks for developers to extend the
    existing API provided by the framework.


    # 1.4. LOGGING FRAMEWORKS IN JAVA


    There are several logging frameworks that have been developed over the past few
    years for the Java language. Some of the commonly used logging frameworks are
    as follows:


    +   * Java logging;

    * Log4j;

    * SL4J;

    * Logback; and

    * TinyLog.


    Each of the above frameworks is discussed in detail in the upcoming chapters.
    It is assumed that all the readers are familiar with Java and have a good understanding
    of programming with Java.'
  merge: -1
