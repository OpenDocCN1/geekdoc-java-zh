  md: "Log4j 111\n\n| A9 |\n|---|n| 1 | column1,column2 |\n| 2 | message 2,35 |\n\
    | 3 | message 2,36 |\n| 4 | message 2,37 |\n| 5 | message 2,38 |\n| 6 | message\
    \ 2,39 |\n\nExample 25: Failover Appender\n\nThe failover appender is a fail-safe-appender.\
    \ We have the possibility of adding several appenders to the failover appender.\
    \ If the main appender crashes or fails, the next appender in the list is invoked\
    \ and if this one fails, the next one is called and so on. This process is repeated\
    \ until no appender is left in the list. This appender provides backups for the\
    \ existing appenders.\n\nThe configuration for this appender is simple. We write\
    \ a configuration file in the usual way. Here have a rolling file appender and\
    \ a console appender in our configuration. To provide a fail-safe, we use the\
    \ element <FailOver>. Within this element, we provide the list of all the backup\
    \ appenders.\n\nIn case of our configuration, we provide a single appender in\
    \ this list. But in real life applications, this list is longer.\n\nThe configuration\
    \ file is as follows:\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\"?>\n<configuration\
    \ status=\"WARN\">\n  <appender name=\"rollingFile\" class=\"org.apache.log4j.core.rolling.RollingFileAppender\"\
    \ fileName=\"logs/app.log\" filePattern=\"logs/app-%d{yyyy-MM-dd}.log\" ignoreExceptions=\"\
    false\">\n    <patternLayout pattern=\"%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c:%L\
    \ %L - %m%n\"/>\n  </appender>\n  <appender name=\"console\" class=\"org.apache.log4j.ConsoleAppender\"\
    >\n    <patternLayout pattern=\"%msg%n\"/>\n  </appender>\n  <failover name=\"\
    failoverAppender\" primary=\"rollingFile\">\n    <failovers>\n      <appender\
    \ ref=\"console\"/>\n    </failovers>\n  </failover>\n  <root>\n    <level level=\"\
    INFO\">\n      <appender ref=\"failoverAppender\"/>\n    </level>\n  </root>\n\
    </configuration>\n```\n\nThe test java class is as follows:\n\n![](img/e779f11d414c53184ecfd97086dcfe13_124_0.png)"
