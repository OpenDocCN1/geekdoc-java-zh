    除了残障人士外，屏幕阅读器对跑步或开车的人来说也很有用。因为在跑步或开车时将视线离开道路是危险的，你可以使用屏幕阅读器。该设备允许让你在处理必须要做的任务的同时，仍然了解你所访问网站的内容。


    # 搜索引擎优化 (SEO)


    ### SEO 基础

    搜索引擎优化（SEO）是指让你的网站出现在搜索结果顶部的实践。每当用户输入某个关键词或关键词组（key phrase）来搜索某个话题时，如果你的网站包含相关内容，你的网站就会出现在搜索引擎的搜索结果中。


    搜索引擎优化的核心意图是找出用户可能在他们的搜索引擎中输入什么内容。你认为他们会使用哪些术语来找到你的网站？一旦你发现了这些术语，就必须将它们整合到你的网站中，以便增加被搜索引擎索引的概率。


    搜索引擎通过检查网站内容并考虑链接到这些网站的数量，来决定哪些网站在搜索结果中排名靠前。它们还会考虑这些链接的相关性。


    搜索引擎优化通常分为两类：页面外技术和页面内技术。


    # 页面外技术

    让其他网站链接到你对你来说非常重要。这些链接有助于提升你的排名。搜索引擎通过检查有多少其他网站链接到你的网站来确定你网站的排名。它们对包含相关内容的网站感兴趣。


    例如，假设你的网站是一家销售鱼饵的在线商店。将它链接到一个介绍护发护理和护发产品的网站将是极不相关的。另一方面，一个关于钓鱼的网站则被认为是相关的。


    此外，搜索引擎还会检查链接中结束标签和开始标签之间的字词。如果链接中的文本包含关键词，而不仅仅是“点击此处”和网站 URL，搜索引擎将认为它们是相关的。请注意，你网站链接上的词汇也必须出现在你网站所链接向的那些网页的文本中。


    # HTML & CSS


    # 页面内技术

    你可以通过在网页上使用页面内技术来提高你在搜索引擎中的排名。这些技术背后的主要思想是，用户可能会在搜索引擎中输入某些关键词，这就是为什么你必须利用这一优势，将这些关键词包含在你网站的
    HTML 代码和文本中。


    通过这种方式，搜索引擎就会被你的网站涵盖了与关键词相关的话题。请记住，搜索引擎在很大程度上取决于网页中的文本。因此，使用用户可能搜索的术语对你来说至关重要。你必须将这些术语放入你的文本中。


    你必须让你的关键词出现在重要位置。此外，你必须确保你的图像在 `alt` 属性中包含正确的文本，以便搜索引擎能够轻松理解其内容。


    你的关键词必须出现在这些重要位置在哪里？通常有七个地方：


    - 1. 页面标题 (Page Title)

    它位于浏览器窗口的顶部。也可以在浏览器的标签页上找到。页面标题在 `title` 元素中指定，该元素位于 `head` 元素内部。


    - 2. 网页地址或 URL

    它包含了你的文件名。尽可能地，你必须在文件名中使用关键词或关键词组。


    - 3. 标题 (Headings)

    如果你在标题元素中使用关键词或关键词组，搜索引擎就能发现该页面是否与某个主题相关，并比赋予它比其他文本更高的权重。


    - 4. 正文 (Text)

    尽可能，你必须在文本正文中重复你的关键词或关键词组。你必须至少重复二到三次。尽管如此，你应该避免过度使用它们。否则，你的读者可能不再理解你的内容。如果你希望访客不断回到你的网站，你必须让你的内容变得易于阅读和理解。


    - 5. 链接文本 (Link Text)

    你必须在创建网页间链接的文本中使用关键词或关键词组，而不是泛泛的表达。虽然“点击此处”的目的很直观，但你的访客可能会认为那是点击饵或某些不重要的东西。


    - 6. 图像 Alt 文本 (Image Alt Text)

    搜索引擎希望你在 `alt` 文本中对图像给出准确描述。通过这样做，当用户使用图像在搜索引擎中搜索结果时，你的图像也会显示出来。


    - 7. 页面描述 (Page Descriptions)

    你的描述位于 `description` 元素中。它是通过使用 `meta` 标签指定的。请记住，你的页面描述必须是描述网页内容的句子。


    尽管它们没有显示在你的浏览器窗口中，但它们可能会出现在搜索引擎的结果中。通过某些技术（如添加与页面背景颜色相同的文本）来试图欺骗搜索引擎永远不是理想的。如果你这样做，你将受到惩罚，你的网站可能会被封禁。


    # 识别关键词和关键词组

    如果你想让你的网站吸引用户和搜索引擎，你必须使用最流行、最相关的关键词和关键词组。然而，如果你不熟悉搜索引擎优化，这可能会非常乏味。幸运的是，你可以使用以下方法为你的网站确定合适的关键词和关键词组：


    # 1. 头脑风暴

    你必须列出用户可能在搜索引擎输入的所有的关键词和关键词组。把自己放在在线用户的角度考虑。特别是，你必须把自己放在一个可能对你网站内容感兴趣的人的角度。你提供什么服务？你讨论哪些话题？考虑你的受众。除了关键词外，如果你的网站包含无法用单词描述的话题，你可以使用关键词组。


    # 2. 组织

    确保你将关键词和关键词组组织成列表。根据部分或类别对其进行分组。这样你就可以轻松找到它们。例如，如果你的网站是宠物商店，按动物分组。将兔子、狗和猫分开。如果你的网站更大或为在线客户提供更多产品，可以使用子分类。


    # 3. 研究

    你可以使用多种工具帮助你了解更多在线用户使用的关键词和关键词组。当你输入关键词时，这些工具会提供你可能使用的其他关键词的建议。例如，你可以使用 Google
    AdWords。如果你使用它，你必须选择“精确匹配 (exact match)”而不是“模糊匹配 (broad match)”。你还可以使用 Wordtracker
    和 Keyword Discovery。在这些工具提供关键词后，你可以将它们加入你的列表。这些工具可能会建议不相关的词汇。


    # 4. 比较

    你的网站无法在用户每次输入关键词时都出现在搜索结果的最顶端。它并不可能出现在顶部，尤其是当你网站上的话题是常见话题时。如果你有很多竞争对手，你就必须进行比较。


    有一些关键词研究网站可以提供关于有多少在线用户使用特定关键词或关键词组的数据。这非常有帮助，因为你能够确定你的词汇的竞争程度。


