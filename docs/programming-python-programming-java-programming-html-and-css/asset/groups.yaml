    你现在在互联网上看到人们使用的是 HTML 4.01 和 XHTML 1.0。正如你在上一章节中所学习到的，这些版本在实际上是非常相似的。


    区别在于， 对 对某些内容非常敏感，例如在标签单词中使用大写或小写字母。它对闭合标签的使用也敏感。


    作为初学者，建议你选择 HTML 4.01 而不是 XHTML 1.0。后者对你的网站来说比前者并没有太大帮助。你只使用 HTML 也就足够了。因此，你并没有迫切需要过渡到
    XHTML。


    无论如何，版本行被称为 DOCTYPE。它出现在行的开头，实际上是“文档类型定义”（Document Type Definition）的缩写。如果你想进一步缩短，可以使用
    DTD。你将得到相同的结果。


    文档类型定义为网络浏览器提供了很多帮助。除了提供你所使用的 HTML 版本信息外，它还能告诉浏览器网页是否使用了名为“框架”（frames）的 HTML 技术、是否是普通网页，或者是一个使用了受限
    HTML 子集的普通网页。


    ## HEAD Section


    你已经读过了 HEAD 部分，现在对它的作用有了了解。网页的 `TITLE` 标签是该部分最核心的组件之一。它为搜索引擎和网络浏览器提供有关网页标题的信息。你在该标签中使用任何标题都不会显示在网页上。相反，每当显示页面时，它会显示在浏览器窗口的标题栏上。


    然后，你可以回到文本编辑器并在 HEAD 部分输入这一行：


    ```html

    <title>This is my very first web page</title>

    ```


    你必须将光标移动到包含 `<head>` 标签的行末尾。之后，你需要按 Enter 键在下方产生新行。完成后，你可以输入上方示例中看到的单词。确保将单词放在
    `<title>` 和 `</title>` 标签之间。


    你现在可以保存页面并在浏览器中刷新或重新加载它。你只需按按下 Ctrl + S 和 Ctrl + R 键即可。保存并加载后，你可以检查浏览器窗口的标题栏。你看到了什么？嗯，你应该看到你使用的标题已经显示出来了。


    正如你所看到的，你输入的单词并没有出现在网页的正文部分。这是因为 `<title>` 标签仅仅为搜索引擎和网络浏览器创建网页标题。它不会改变你网页的外观。如果你想在网页上显示特定的内容，你必须使用
    `BODY` 部分。


    你应该注意，`TITLE` 标签非常重要。事实上，它是所有网页的必选部分。换句话说，没有标题标签你就无法创建网页。你永远不要遗漏它。


    ## The BODY Section


    在这一部分，你将使用段落标签 `<p>` 和 `</p>`。`<p>` 标签表示浏览器必须显示其后的所有内容，直到遇到 `</p>` 标签。


    继续使用你的文本编辑器和上面显示的示例程序，你必须将文本光标放在句子的末尾：


    # MICHEAL KNAPP


    这是一个不涉及任何网站的示例网页。


    你只需要移动光标，直到它到达句号或行末尾。然后，你必须按 Enter 键在文本编辑器中创建一个新行。完成后，你可以在空白行上输入另一个句子。你可以输入如下任何内容：


    The website www.sample.com 是网站管理员和程序员的理想信息来源。


    然后，你必须像之前那样保存页面并在浏览器中重新加载它。检查新句子的位置。正如你所看到的，尽管你在文本编辑器中将其放在了新行，浏览器仍然在你的第一个句子之后显示了它。由于由于，这两个句子似乎属于同一个段落。

