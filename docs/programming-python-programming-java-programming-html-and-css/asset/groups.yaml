    其页面标题中的关键词。请注意，包含你使用的术语的页面越多，你的竞争对手就越多。


    ## 5. 精炼


    你必须选择你需要关注的关键词和关键短语。你应该始终选择与你网站章节相关的关键词和关键短语。


    如果某个短语高度相关但竞争非常激烈，你必须毫不犹豫地使用它。为了增加你的网站被发现的概率，你可以检查是否有其他可以与你的关键词和关键短语结合的术语。


    例如，如果你在网站上提供的服务或信息针对的是特定的位置，那么你必须将将此位置整合到你所使用的关键词和关键短语列表中。你必须这样做，这样人们才能找到你的网站。


    如果你的网站在某个国家推广某特定公司，那么你必须从该国家获取数百个寻找该特定公司提供的产品或服务的流量。获取成千上万个甚至不在该国家或正在寻找不同类型产品或服务的流量是毫无意义的。


    ## 6. 映射


    一旦你创建了关键词和短语列表，了解了竞争对手，并发现了最相关的关键词和短语，你就必须为每个网页选择要使用的关键词和短语。


    你可以为网站的每个页面选择三到五个映射的关键词和短语。然后，你可以将它们作为每个页面的关键词和短语。


    记住，你没有必要在所有页面上重复它们。此外，随着你从主页越到网站的不同章节，你的关键词和关键短语可以针对每个页面上的个人主题变得更加具体。


    ## Google Analytics


    ### 有多少人访问你的网站？


    一旦在线访问者进入你的网站，你就可以开始分析他们是如何来的、他们在搜索什么，以及他们何时将离开网站。Google Analytics 是网站管理员用来弄清楚这些问题的非常流行的工具。


    要使用它，你需要注册一个账户。你只需要访问 Google 网站搜索 analytics。你也可以输入 www.google.com/analytics 并从那里开始。在网站上，系统将为你提供一段跟踪代码。你需要在网站的所有页面使用这段跟踪代码。


    每当在线访问者加载你的网页时，你的跟踪代码就会向存储服务器发送数据。然后，Google 提供了一个网页界面。你可以用它查看在线用户如何使用和浏览你的网站。


    Google Analytics 提供跟踪代码，该代码应该出现在闭合标签之前。网页的外不会被跟踪代码改变。它对你的网站实际上没有任何重大影响。


    ### 你可以在哪里看到有多少在线用户访问了你的网站？


    你可以使用概览页面获取这些信息。它为你提供了你可能搜索的数据快照。它特别告知你有多少在线用户访问了你的网站。


    在线用户访问你网站的次数被称为“访问”（visit）。如果一个访问者在你的网站上半小时内不再活跃，然后突然跳转到你网站的另一个页面，这被计为一次新访问。


    在特定时间内访问你网站的在线用户总数被称为“唯一访问”（unique visit）。如果在线用户在特定时间内多次返回你的网站，那么唯一访问的次数将低于总访问次数。


    你的在线访问者在你的网站上查看的页面总数被称为“页面浏览”（page views）。你的在线访问者每次访问你的网站时查看的平均页面数被称为“每次访问页面数”（page
    per visit）。平均停留时间（average time on site）指的是你的在线用户每次访问你的网站时花费的时间。


    如果你希望切换网站上报告显示的时间，你必须使用日期选择器，它位于页面顶部。如果你想知道有多少在线用户访问了你的网站，你可以查看流量报告。如果你想知道这些用户来自哪里，你可以查看流量来源报告。如果你想知道这些用户在搜索什么，你可以查看搜索词报告。如果你想知道这些用户在你的网站上的行为，你可以查看行为报告。如果你想知道这些用户来自哪个国家，你可以查看地理位置报告。如果你想知道这些用户使用的是什么设备，你可以查看设备报告。如果你想知道这些用户使用的是什么浏览器，你可以查看浏览器报告。如果你想知道这些用户使用的是什么操作系统，你可以查看操作系统报告。如果你想知道这些用户使用的是哪种语言，你可以查看语言报告。

    '
