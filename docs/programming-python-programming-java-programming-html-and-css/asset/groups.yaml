    This is an example of the level 3 heading

    This is an example of the level 4 heading

    This is an example of the level 5 heading

    This is an example of the level 6 heading


    As you can see in the output, the sizes of the headings are different. The first
    heading is the largest while the sixth heading is the smallest.


    ## Bold and Italic


    You can make your texts appear more presentable by bolding or italicizing them.
    These styles also make your content more readable. You can highlight or put more
    emphasis on words that are bolded or italicized.

