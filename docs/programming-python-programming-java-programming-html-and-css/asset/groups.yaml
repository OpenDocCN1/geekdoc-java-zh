    # CHAPTER 1:

    INTRODUCTION TO HTML AND CSS


    # Fundamentals


    Introduction to HTML language is a computer language specifically designed for
    creating websites. Such websites can be visited by anyone regardless of their
    location or time zone. As long as you have an Internet connection, you can visit
    websites.


    The computer language is easy to learn. Its fundamentals can actually be grasped
    in just one sitting. Even though it is simple, it is effective and powerful. It
    is also continuously going through revisions in order to meet the requirements
    and demands of users.


    HTML stands for Hyper Text Markup Language. Hyper Text is a method used to move
    across the Internet. You can click on hyperlinks, which are special texts that
    move you towards the next page. It is called hyper because it is not linear. In
    other words, you can move towards any location on the Internet at any time you
    desire simply by clicking on links.


    It is a standard markup language for making Web pages. It describes Web page structure
    using markup. The HTML tags does markup to the texts inside them. Simply put,
    they mark it as a specific type of texts, such as italicized or bold. The elements
    of HTML are basically the building blocks of HTML pages. Its elements are represented
    by tags and its tags label content with heading, table, and paragraph among other.


    Even though browsers do not generally display HTML tags, they use these tags to
    render the contents of pages.'
  - '[PAGE 184]


    # Frequently Asked Questions (FAQ)


    # How does HTML work?


    The computer language has a series of short codes that are typed into a text file.
    These become the tags of the HTML. The text is saved as an HTML file and is viewed
    using a browser such as Internet Explorer. The browser reads the file and then
    translates the text to a visible form that renders the page as the programmer
    intended.


    When you write HTML codes, you have to use tags correctly. You can use a powerful
    graphical editor or a rudimentary text editor to create your pages.


    # What do HTML tags do?


    Tags separate normal texts from codes. They are the words found between angle
    brackets and they allow tables and images among others to tell the browser what
    needs to be rendered on the page. HTML tags perform a variety of functions. They
    do not show up when you use a browser to view the page. You only see their effects.
    The most basic and simplest of tags do not have a lot of functions. They merely
    apply formatting to texts.


    For example, they can make the text bold or italicized. If you want to make a
    text bold, you simply have to place it between `<b>` and `</body>` such as the
    following example:


    ```

    <b> This text is not bold. </b>

    ```


    As you can see in the example shown above, the first text is bold while the second
    one is not. The second text is not bold because it is outside of the code that
    makes texts bold.'
