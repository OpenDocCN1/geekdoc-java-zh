    首先，你的第一行必须识别你在网页上使用的 HTML 版本和类型。然后，你必须用 `<html>` 和 `</html>` 标签包裹网页的其余部分。


    # HTML 逻辑


    你网页的第一部分被称为 HEAD 部分。在这个部分中，`<head>` 标签开始，`</head>` 标签结束。它是面向搜索引擎和 Web 浏览器的信息。


    # DOCTYPE 或 DTD


    仍然参考上述示例，你可以看到这些词


    ```

    <!DOCTYPE HTML PUBLIC "//W3C // DTD HTML 4.01 Transitional //EN"

