    # HTML & CSS


    ## Introduction to Cascading Style Sheets


    Cascading Style Sheets, more commonly referred to as CSS, is a simple design language
    used to make developing websites easier. It is basically used to define the styles
    of Web pages, including their layout, design, variations in display for various
    devices, and sizes of screens.


    It deals with the feel and look part of the Web page. With it, you have the power
    to control the styles of your fonts, colors of your texts, spacing between your
    paragraphs, sizes and layouts of your columns, background colors and background
    images of your website, designs of your overall layout, sizes of your screen,
    display variation in multiple devices, and a lot of other amazing effects.


    The language is very easy to grasp and learn. It also gives you control over your
    HTML documents'' presentation. More often than not, CSS is used in combination
    with markup languages XHTML and HTML.


    CSS allows you to make the most of your available time. With this language, you
    only have to write your code once and reuse it over and over. You can reuse the
    same sheet for different HTML pages. Also, you can define a style for every HTML
    element and then apply it to multiple Web pages.


    CSS makes pages load faster. There is no more need for you to write HTML tag attributes
    all the time. You can simply write one CSS rule for a tag and then apply it to
    the rest of its occurrences. The fewer codes there are, the faster the downloading
    time will be.


    CSS allows for easier maintenance. If you want to make a significant change, all
    you have to do is change the style. The elements in your Web pages will then update
    automatically.


    CSS has much better styles than HTML. It has more attributes too. Thus, you can
    make your HTML page look better as compared to when you use HTML attributes.


    CSS allows content to be displayed on multiple types of devices. So, whatever
    electronic device you use, you can view the Web page in it. You can use the same
    HTML document to display different website versions on handheld devices, including
    cell phones and PDAs, and then print it out.


    CSS is also recommended to be used instead of HTML attributes. If you want your
    Web pages to be compatible with future browsers, you have to use CSS in every
    HTML page.


    With regard to offline browsing, you can rely on CSS to locally store Web applications.
    It can do this because of an offline cache. It allows you to check out offline
    websites. This cache also makes sure that the website loads faster and has a better
    overall performance.


    Furthermore, CSS offers platform independence. It also supports the most recent
    browsers available.


    # Frequently Asked Questions (FAQ)


    Was CSS a solution to a particular issue or problem?

    Yes, CSS was actually a solution to a huge problem. HTML was not really meant
    to feature tags for Web page formatting. It was merely designed to describe its
    content. Consider the following examples:


    ```

    <h1>This is an example of a heading</h1>

    <p>This is an example of a paragraph</p>

    ```


    The moment color attributes and tags became additions to HTML 3.2, Web developers
    experienced a lot of problems. The development of huge websites in which color
    and font information were included at every page became an expensive and tedious
    process. Because of this issue, the World Wide Web Consortium developed CSS. Its
    development was such a huge relief for Web developers because it got rid of the
    style formatting from HTML pages.


    # Does CSS save a lot of work?


    Yes, it does. Style definitions are typically saved in an external .css file.
    This external stylesheet allows you to change the appearance of your whole website
    simply by changing a file.


    # Who created CSS?


    Håkon Wium Lie first proposed the CSS language on the 10th of October 1994. At
    that time, Lie was working with Tim Berners-Lee at CERN. A few other style sheet
    languages were also proposed for the Web. When discussions about public mailing
    lists were made, the first recommendation on CSS was done by the World Wide Web
    Consortium in 1996. The proposal of Bert Bos was particularly influential, which
    is why he is also considered as the co-creator of CSS.


    # Who maintains CSS?


    A group of individuals within the World Wide Web Consortium, known as the CSS
    Working Group, maintains CSS. They also create specifications, which are documents.
    These specifications eventually become recommendations once they were discussed
    and ratified by the members of the World Wide Web Consortium.


    # Why are ratified specifications referred to recommendations?


    They are called as such due to the fact that World Wide Web Consortium no longer
    has any control over the implementation of CSS. Independent organizations and
    companies create the software. The World Wide Web Consortium is a group of individuals
    that makes recommendations with regard to how the Internet needs to evolve and
    how it works.


