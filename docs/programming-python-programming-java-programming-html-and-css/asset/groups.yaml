    You may add colors to your links if you want. You can use the attributes alink,
    link, and vlink to set colors for your active links, links, and visited links,
    respectively.


    To help you understand this concept better, you should take a look at the following
    sample program. Take note that you have to save it in test.htm. Then, you can
    open that in whatever web browser you want. You will then be able to learn how
