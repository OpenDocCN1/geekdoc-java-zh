    As you can see in the output, only the words that were enclosed in the tags `<b>`
    and `</b>`;` were bolded. The rest of the sentence was not affected.


    In the same way, an italicized word can make it stand out from the rest of the
    sentence. You can make a particular character italic by enclosing it in the tags
    `<i>` and `</i>`. Likewise, this element represents the section of your text that
    you want to present in a particular manner. For instance, you can italicize technical
    terms, quotes, foreign words, or proper names among others.


    To help you understand this concept further, take a look at the following example:


    ```html

    <p> In this example, you can see that this word appears <i> italic. </i></p>

