    \ element for index 5 = 77\nThe element for index 6 = 99\nThe element for index\
    \ 7 = 11\nThe element for index 8 = 53\nThe element for index 9 = 66\n```\n\n\
    如果你会注意到，声明数组的所有元素是非常枯燥且困难的。想象一下有 100 个需要打印或存储的元素，一个一个地写难道不是很麻烦吗？在大多数情况下，程序员会实现迭代语句（while、do-while\
    \ 和 for），使得遍历数组中的每个元素变得简单得多。\n\n这是一个使用循环实现数组的示例：\n\n```java\npublic class loop_array\
    \ {\n    public static void main (String[] args) {\n        int x = 10;\n    \
    \    int[] sample_array;\n        sample_array = new int [x];\n        for (x\
