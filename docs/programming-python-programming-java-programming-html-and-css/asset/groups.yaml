    are ideal to make files in PDF, ZIP, or DOC form downloadable. It is actually
    pretty simple. All you have to do is provide the URL of your file. You can use
    the following example as a guideline:


    ```

    <!DOCTYPE html>

    < html>

    <head>

    < title> This is an example for a hyperlink </title>

    </head>

    <a href = https://www.sampleprogram.com/page.pdf>

    Click to download file </a>

    </body>

    </html>

    ```


