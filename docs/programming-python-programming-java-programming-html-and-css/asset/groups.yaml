  mdcn: "\n通常在多处理器系统上。\n\n## 排序方法\n\n- 该方法的作用与 `parallelSort` 方法相同，但它是按顺序对数组元素进行排序的。\n\
    \n## 第 4 章：方法、对象、类\n\n在之前的章节中，我们已经对类、方法和对象进行了简短的介绍。在本章中，我们将更详细地讨论这些术语。\n\n## 类\
    \ (Classes)\n\n类通常是一个包含特定特定属性（或者说，实例变量）的声明。与方法一起，声明一个 Java 类与在 Simula 中声明类非常相似。\n\
    \n请看以下代码：\n\n```java\nclass Example{\n    private int value;\n    protected char\
    \ letter;\n}\n```\n\n你会发现，在数据类型 `int` 和 `char` 之前有声明。这些声明意味着属性不能在类之外访问。总的来说，属性需要保持为\
    \ `private` 或 `protected`，以防止其他类的直接未经授权的访问。Java 中通常使用三种声明：`private`、`protected`\
    \ 和 `public`。\n\n#### 公有 (Public)\n- 此声明意味着可以从其他类访问该属性。\n\n### 私有 (Private)\n\
    - 此声明不允许该类以外的任何类访问该属性。\n\n### 保护 (Protected)\n- 此类与 `private` 声明有些相似，尽管它允许其自身的类和子类访问，但不能从外部访问。\n\
    \nJava 中的类定义如下：\n\n```java\nclass MyClass {\n    // 字段、构造函数和方法\n    // 声明\n}\n\
    ```\n\n上面的代码是编写类的示例。大括号之间的区域被称为类体。它包含了从类创建的对象的初始化代码。这些代码包括：构造函数、方法。\n\n我们对声明和方法已经很熟悉。构造函数用于创建对象。类可以包含构造函数，这些构造函数从主类中执行。在形式上，声明构造函数与声明方法几乎相同，但两点不同：构造函数使用类名且没有返回类型。这是一个构造函数的示例：\n\
    \n```java\npublic class Example{\n    int start;\n    int final;\n    int middle;\n\
    \    // 构造函数\n    public Example(int Constant, int confinal, int middle) {\n \
    \       start = Constant;\n        final = confinal;\n        middle = middle;\n\
    \    }\n}\n```\n\n下面的代码显示了如何创建一个名为 `samp` 的新对象：\n\n```java\nExample samp = new\
    \ Example(0, 10, 5);\n```\n\n这在内存中创建了空间来初始化对象及其值。不需要参数，例如：\n\n```java\npublic\
    \ Example () {\n    int start = 0;\n    int final = 10;\n    int middle = 5;\n\
    }\n```\n\n无参数创建对象也是一样的：\n\n```java\nExample samp = new Example();\n```\n\n两个构造函数都可以在类中进行声明，因为它们的参数不同。与方法一样，Java\
    \ 平台可以根据参数的数量和类型进行区分。类不能拥有两个名称相同且参数类型相同的构造函数；因此这会导致编译错误。类中并不要求有任何构造函数，尽管建议这样做。编译器会自动为没有参数的类提供默认构造函数。在此期间，编译器将检查该类是否没有构造函数，因此明确这一点很重要。（我们将在讨论构造函数后讨论更多关于父类和子类的内容）。\n\
    \n## 父类和子类 (Superclasses and Subclasses)\n\n现在，如果一个类没有父类，它仍然有一个包含默认构造函数的默认父类。\n\
    \n```java\nclass MyClass extends MySuperClass implements MyInterface{\n    int\
    \ value;\n    int result;\n}\n```\n\n看上面的代码。`MyClass` 类继承了另一个名为 `MySuperClass`\
    \ 的类。`MyClass` 现在是 `MySuperClass` 的子类。`MySuperClass` 现在被称为父类。这意味着 `MyClass` 继承了其父类的所有属性和方法。还添加另一个关键字：`implements`。这意味着\
    \ `MyClass` 可以实现接口。也可以添加如 `public` 和 `private` 等声明。总的来说，类可以包含以下组件：\n\n- 类修饰符（`public`、`private`、`protected`）\n\
    - 类名\n- 父类（`superclass`）和关键字 `extends`。注意：子类一次只能扩展一个父类\n- 用逗号分隔的接口，如果存在需要实现的多个接口\n\
    - 类体以 `{` 开始，以 `}` 结束\n\n## 对象 (Objects)\n\n在 Java 中，对象是类的实例。它是通过方法的使用与其他一切交互的。由于这个，程序可以执行发送者和接收者之间的多个目标，如\
    \ GUI 实现和信息管理。\n\n## 方法 (Methods)\n\n我们在之前的章节中已经介绍过方法。正如我们所知，方法在 C 等编程语言中相当于函数。它被用于执行特定的任务，如计算和处理。这是一个方法的示例：\n\
    \n```java\npublic void getAverage (float exam1, float exam2, float exam3){\n \
