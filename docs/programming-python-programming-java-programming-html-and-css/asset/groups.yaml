    class arr_copy_sample{\n    public static void main(String[] args) {\n       \
    \ int[] sourceArr = { 0, 2, 4, 6, 8, 10,\n        12, 14, 16 };\n\n        int[]\
    \ destArr = new int[7];\n        int x;\n\n        System.arraycopy(sourceArr,\
