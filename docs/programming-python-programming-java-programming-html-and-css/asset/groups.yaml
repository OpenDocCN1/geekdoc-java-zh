    ## 第 4 章：HTML 结构


    ## 网页与文档的结构


    网页如何使用结构


    为了帮助初学者理解网页如何使用结构，你可以想象一份典型的报纸。它看起来是什么样子的？它的部分和特征是什么？


    对于报纸的每一页，你都会看到一个标题。后面通常跟着图片和文本。然后，你会看到正文，它可能包含子标题，或者被分为几个子章节。报纸的这种特定结构允许读者更好地理解文章或新闻报道。页面被组织并分类到相应的类别中，以防止混淆和信息误导。


    计算机程序也有同样的概念。它需要有一个结构才能正常运行并被理解。如果它的元素没有经过适当组织，程序员可能会感到困惑。


    以下是 HTML 的主要元素：


    - 头部（Header）

    - 主体（Main）

    - 导航菜单（Navigational menu）

    - 文章（Article）

    - 章节（Section）

    - 侧栏（Aside）

    - 地址（Address）

    - 页脚（Footer）


    这些元素非常通俗易懂。因此，即使你只是一个初学者，了解它们的用途应该也不困难。


    ## 头部（Header）


    该元素用于识别并包含显示在每个网页开头的内容。这些内容包括标志或品牌、搜索栏、标语、导航项目以及在你的网页中重复的其他内容。


    通常情况下，头部位于主体（body）之前，但也可以位于主元素（main）之前。


    ## 主体（Main）


    该元素位于头部和页脚之间，旨在表示与你的网页主要主题或主体相关的内容。它必须包含此页面特有的内容。它不应该包含在网页中重复的内容，例如导航项目、头部和页脚。


    此外，你的网页上可以有多个`main`元素。如果你的首页展示了最新的文章，这将特别理想。你可以为这些中的每篇文章都创建一个`main`元素。


    ## 导航菜单（Navigational Menu）


    该元素通常位于网页的上方。也可以放在页脚或侧边栏。在网页上使用导航菜单时，你必须使用`<nav>` 标签。此外，不需要为你所有的链接使用这个标签。尽管如此，对于导航到特定部分或整个网站的链接块，它是至关重要的。


    ## 文章（Article）


    该元素可以放置在网页的任何位置，尽管它最常见于`main`或`section`元素之后。如果你有文章、博客文章任何其他分发的内容，使用它是非常理想的。


    ## 章节（Section）


    该元素用于确定整个网站中主要子章节的内容。例如，如果你的网页上有一个 HTML 格式的电子书，你可以为电子书的每一章使用此元素。


    同样，如果你的侧边栏有多个用于搜索、广告、注册表单和相关文章的部分，你可以为这些部分中的每一个使用`section` 标签。


    有些用户会混淆`div`和`section`的使用。理想情况下，如果你只是想让你的内容更容易组织或你正在使用 JavaScript，那么你应该使用`div`。另一方面，如果你想在编写文档大纲时将你的内容作为项目列出，那么你必须使用`section`。


    ## 侧栏（Aside）


    如果你的网页显示了与主要内容相关但并不构成主要内容的信息，可以使用该元素。相关的链接和内容、广告以及作者信息通常位于此元素中。


    例如，如果你的文章包含技术术语，而它们的定义位于侧边栏中，你应该将这些定义放在标签中。这样，你的访问者和读者就能更容易看到它们。你可能还想为侧边栏使用`<aside>`
    标签，以便向访问者明确表示它不是网页的主要部分。


    ## 地址（Address）


    该元素用于提供网页上作者或网站所有者、文章或文档的联系信息。如果它位于`body`中，显示文档的联系信息。如果它位于`article`中，则显示该特定文章的联系信息。


    ## 页脚（Footer）


    该元素代表最近的分段根或分段内容元素的页脚。它通常包含关于作者、文档链接和版权的信息。


    ## 相关元素与声明


    以下是你可能在 HTML 程序中发现的其他元素：


    ### 元数据（Meta）


    该元素用于为 HTML 文档提供额外信息。封装在`<meta>` 标签中的信息不会显示在网页上。然而，它会被网络爬虫和浏览器读取。


    ### 基础（Base）


    该元素用于确定基础 URL，你可以基于它构建网页上使用的所有相对 URL。如果它包含`target` 属性，该属性将作为文档中出现的每个超链接的默认属性。


    ### （Div）


    该元素用于定义任意的内容块，这些块可以作为单个单元进行放置和样式化。


    ### 类型声明（DOCTYPE）


    此声明用于通知浏览器文档是 HTML。


    ## 第 5 章：HTML 文本


    ## 标记（Markup）


    当你创建一个网页时，你需要添加这些标记，以作为页面的结构。


    通常情况下，标记有两种类型：结构化和语义化。结构化标记指的是识别段落和标题的元素。另一方面，语义化标记提供了如缩写、引用句子和强调等信息。


    ## 标题（Headings）


    本质上，HTML 中有六级标题。


    ```html

    <h1></h1>

    <h2></h2>

    <h3></h3>

    <h4></h4>

    <h5></h5>

    <h6></h6>

    ```


    在 HTML 中使用的六级标题：


    ```html

    <h1></h1>

    <h2></h2>

    <h3></h3>

    <h4></h4>

    <h5></h5>

    <h6></h6>

    ```


    第一个标题`h1`用于主标题。第二个标题`h2`用于副标题。如果你在副标题下有更多部分，你必须使用第三级标题`h3`、第四级标题`h4`等。


    网页浏览器通常以不同的大小显示标题内容。例如，第一个标题`h1`的字体最大，而第六个标题`h6`的字体最小。此外，显示在浏览器上的大小是可以变化的。作为用户，你可以控制你希望在浏览器显示的字体大小。你也可以控制它们的颜色和字体样式。


    看看下面的示例：


    ```html

    <h1>这是主标题的示例</h1>

    <h2>这是二级标题的示例</h2>

    <h3>这是三级标题的示例</h3>

    <h4>这是四级标题的示例</h4>

    <h5>这是五级标题的示例</h5>

    <h6>这是六级标题的示例</h6>

    ```


    上述示例的输出应该如下：


    # 这是主标题的示例


    这是二级标题的示例

    这是三级标题的示例

    这是四级标题的示例

    这是五级标题的示例

    这是六级标题的示例


    正如你在输出所示，标题的大小是不相同的。第一个标题最大，而第六个标题最小。


    ## 加粗与斜体（Bold and Italic）


    你可以通过加粗或斜体让你的文本看起来更美观。这些样式还能让你的内容更具读性。你可以对加粗或斜体的单词进行突出显示或强调。


