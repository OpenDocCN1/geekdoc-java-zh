    # Java 编程


    ## 总结


    总而言之，Java 编程语言是一种非常强大的编程语言，可以用于许多方面。Java 编程语言具有简单、面向对象、独立于主机平台、包含网络系统语言设施和库，以及专门设计用于从远程源安全执行代码的结构等目标，这些特性是
    C 和 C++ 等其他编程语言所不具备的。


    考虑到 Java 编程语言，它将代码划分为模块的能力使其比于 C/C++ 等其他语言具有巨大的优势。在 Java 中，输出应用程序可以以模块的形式提取，而不仅仅是单一的可执行文件。相比之下，C/C++
    等编程语言在遇到代码的微小变化或调整时，需要重新编译整个应用程序。


    Java 编程语言的思想是将将源代码编译成可以解释的中间语言。这种中间语言被认为是字节码（byte code）。而 Java 虚拟机或 JVM 则是解释器。在标准化方面，Java
    拥有标准库，能够以多种方式访问主机的功能（如网络和图形）。Java 编程语言还支持多线程程序，这对于网络应用程序来说是必要的。


    Java 具有平台独立性，当它被应用于 Web 服务和微型服务器等服务端应用程序时，会变得更加强大和高效。对于客户端，Java 还提供了一些改进，如 Windows
    工具包、小部件工具包和 Swing。Java 是一种“编写一次，到处运行”的编程语言。这意味着只要存在 Java 虚拟机，它到任何硬件的移植性就没有问题。它也是一种“编写一次，到处测试”的编程语言。这使得
    Java 非常高效和快速。


    对于执行和错误处理，Java 可以像其他对象一样让异常抛出一个对象。它唯一的要求是实现 `Throwable` 接口。编译器还会指定是否可以捕获异常。如果对抛出的异常没有创建捕获块（catch
    block），编译器将产生错误。


    Java 强制程序员处理异常。尽管如此，程序员必须能够处理异常，或者定义必须由用户处理。


    在网络能力领域，Java 的前身没有允许其语言与其他计算机系统联网的功能。这意味着它们具有平台独立性，并且几乎所有的网络协议都是标准化的。这使得 Java
    语言开发者更加关注它在互联网中的集成。


    Java 设计之初就将网络计算作为其特性之一。它是最早提供对远程源代码执行广泛支持的语言系统之一。


    对于动态类加载，Java 中的类可以根据需要进行编译。如果程序执行期间不需要某个类，则无法将该类编译成代码。


    这种优势在网络编程中非常有用。能够运行可以从文件系统或远程源加载类的程序是一个非常高效的概念。用 Java 语言编写的程序在执行过程中修改自己的代码也是可能的。然而，对于用
    Java 编写的程序，带有反馈执行并随着时间的推移改进生成的代码更为现实可行。


    在 Java 中，释放内存不再是程序员的责任范围。Java 虚拟机 (JVM) 会跟踪并记录所有使用的内存。当内存不再被使用时，它会自动释放。在这一发生时，JVM
    在后台执行另一个任务：释放未引用的、未使用的内存，这称为垃圾回收（Garbage Collection）。垃圾回收器始终运行。这一特性使得编写复杂的服务端程序变得简单。现在程序员唯一需要做的就是观察对象创建的速度。如果应用程序创建对象的速度于垃圾回收器释放的速度，会导致内存问题。应用程序可能会内存耗尽或抛出异常，或者停止运行以便垃圾回收器跟上并完成其任务的时间。


    关于 Java 的一点可以说明，它背后的人也是 Applet（小程序）概念的创建者。Java 程序还可以在 Web 浏览器中运行。Java 最初设计用于用于
    Web 应用程序。Java 编程语言的承诺在于浏览器端，即代码可以被下载并作为浏览器的 applet 执行。


    由于 Java 基本上是某些编程语言的升级，因此其他语言中的某些特性在 Java 中被禁用了，例如多继承、类型转换限制等，以避免错误。


    最后总结一下，Java 是一种可以交付结果并实现其目标的编程语言。Java 语言不仅仅是其他语言，因为它允许创建高级数据类型（对象），这些对象可以代表现实世界的实体。这些对象还可以可以修改的字段。


    Java 是一种非常灵活的编程语言。从软件开发到 applet 的开发；Java 已经在许多方面证明自己是一种强大的语言。但它的灵活性尚未结束。由于它是平台无关的，相同的
    Java 程序可以在不同的操作系统上运行，而不需要重新创建或重写代码，不像 C 和 C++ 等编程语言。这完全归功于 Java 环境，它解释 Java 源代码并向操作系统传递需要执行的操作。


    当然，这种语言也有一些缺点，但它仍然容易理解和学习。在一天之内，任何人都能创建自己的 Java 程序。


    ## 结论


    再次感谢下载此书！


    我们希望这本书能够帮助你更好地理解 Java 编程语言。


    下一步是应用你从阅读这本书中学学到的知识。


