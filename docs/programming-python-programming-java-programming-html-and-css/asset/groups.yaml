    # start 属性


    作为程序员，你可以根据意愿在 `<ol>` 标签上使用 `start` 属性。它的目的是指定你偏好的列表标记的起始点。


    此表显示了你可以用于有序列表的 `start` 属性。请注意，起点可以是任何地方。你可以从任何想要的数字开始。在下面的示例表中，起始点将是数字 3。


    | Type Start | 描述 |

    | --- | --- |

    | Type = "1" Start = "3" | 数字从 3 开始。如果你使用这种类型，你的列表项目将由数字组织，从标称 3 开始。 |

    | Type = "A" Start = "3" | 字母从 C 开始。如果你使用这种类型，你的列表项目将由大写字母组织，从大写字母 C 开始，因为它是字母表的第三个字母。
    |

    | Type = "a" Start = "3" | 字母从 c 开始。如果你使用这种类型，你的列表项目将由小写字母组织，从小写字母 c 开始，因为它是字母表的第三个字母。
    |

    | Type = "i" Start = "3" | 数字从 iii 开始。如果你使用这种类型，你的列表项目将由小写数字组织，从罗马数字 iii 开始。 |

    | Type = "I" Start = "3" | 数字从 III 开始。如果你使用这种类型，你的列表项目将由大写数字组织，从罗马数字 III 开始。 |


