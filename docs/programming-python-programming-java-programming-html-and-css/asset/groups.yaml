    随后，由 Dave Raggett 领导的一个工作组制定了 HTML 3.0。这个版本的 HTML 在功能方面优于之前的两个版本。它具有许多新功能，并为用户创建惊叹的网页设计提供了更多机会。遗憾的是，浏览器实现这些改进的速度很缓慢。由于规模等原因，只添加了少数项改进。最终，HTML
    3.0 不再被使用。


    由于这次失败，开发者注意到改进必须是模块化的。它们应该分阶段添加，这样浏览器公司就不会有太大困难。


    ## HTML 3.2


    浏览器特定的标签不断出现。最终显而易见，必须有一个特定的标准。1994 年，世界维网联盟（W3C）成立，旨在对计算机语言进行标准化，并确保它不断演进以满足用户的需求和要求。


    世界维网联盟创建了 HTML 3.2，并赋予其代号 WILBUR。该版本是对当前标准的精简版更改。它在 1997 年被认为是官方标准。直到今天，它仍然被所有浏览器完全支持。


    ## HTML 4.01


    这是相对于之前版本的一次巨大演变。它也是经典 HTML 的最终迭代。在开发的早期，它被赋予了代号 COUGAR。它的许多功能源自 HTML 3.0。它还对旧标签进行了大量精简，并支持新的演示性支持语言——层叠样式表（CSS）以及国际化支持。


    1997 年 12 月，世界维网联盟推荐了 HTML 4.0。1998 年 4 月，它最终成为官方标准。微软为 Internet Explorer 浏览器承担了支持工作。Internet
    Explorer 5 和 Internet Explorer 6 都对几乎每个标签和属性提供了支持。


    ## HTML 4.01


    在 HTML 4.0 发布了一段时间后，开发者对其文档进行了一些修正和修订。这导致了 HTML 4.01 的产生。


    ## XHTML 1.0


    世界维网联盟在 21 世纪初发布了 XHTML 1.0 规范作为建议。2000 年 1 月，它成为与 HTML 4.01 的共同标准。


    这个版本代表了一个全新的 HTML 分支，它偏离了旧的规范使用方式。XHTML 包含了 XML 的严谨性。代码必须编写得正确，以便在到达浏览器时能够运行。XHTML
    并没有许多已弃用或新的属性和标签，尽管为了提高功能和可访问性，某些内容发生了变化。对于用户来说，有一套新的编码规则。


    ## HTML 5


    在 XHTML 1.0 和 HTML 4.0 发布后，开发者想要制定 XHTML 2。他们还希望引入创新。然而，他们的提议被证明是不切实际且乏味的，以至于该项目不再继续进行。他们必须寻找其他方法。


    ## HTML & CSS


    在此期间，几位务实 Web 技术的支持者、浏览器程序员以及规范编写者，开始使用超越世界维网联盟典型程序的方法来创建某些东西。他们将自己的小组称为 Web 超文本应用技术工作组（WHATWG）。他们创建了一项新规范。


    世界维网联盟最终决定，HTML 仍然是世界维网的未来。当 XHTML 2 停止使用时，HTML 5 被视为新规范。HTML 5 专为世界维网设计。目前，它仍在使用中。


    ## CSS 版本


    ### CSS 1


    这个版本的 CSS 最初于 1996 年 12 月作为世界维网联盟的建议发布。它描述了该语言以及 HTML 标签的简单视觉格式模型。


    ### CSS 2


    这个版本的 CSS 在 1998 年 5 月成为世界维网联盟的建议。它构建在之前的版本之上。它的特点是支持特定媒体的样式表，例如音频设备、打印、元素定位、表格和可下载字体。


    ### CSS 3


    这个版本的 CSS 在于 1999 年 6 月成为世界维网联盟的建议。它构建在之前的版本之上。它的特点是被称为“模块”的划分文档。每个模块都有在 CSS 第二版本中定义的新扩展功能。


    CSS 3 模块还包含了 CSS 2 的旧规范和扩展功能。这些包括盒模型、选择器、背景、边框、替换内容、图像值、文本效果、动画、用户界面、多列布局、2D 变换和
    3D 变换。


    ## 第 2 章：访问 Web


    ## 上网


    ### Web 浏览器


    用户可以使用 Web 浏览器访问互联网上的网站，浏览器是一种软件。最常用的 Web 浏览器有 Google Chrome、Internet Explorer、Mozilla
    Firefox、Opera 和 Safari。


    如果你想查看特定的网页，必须在浏览器中输入其地址。你也可以使用书签，或者通过点击带你进入该网站的链接。


    软件制造商定期发布其浏览器的新版本。每次更新，他们都会添加新功能，以及对计算机语言的支持新增。


    另外，对你来说非常重要的一点是，许多用户并没有运行最新版本的浏览器。因此，你不能期望每一位访问你网站的访都使用更新后的浏览器所提供的最新功能。在创建网站时，必须考虑这一事实。


    如果你想确保能够从世界各地触达每个人，你就必须让你的网站与他们使用的浏览器兼容。除了使用更新版本外，你还应该让你的网站能够被旧版本浏览器的用户看到。


    ## Web 服务器和设备


    当你请求浏览器获取某个网页时，它会自动跨越世界维网发送一个请求。


    这个请求会被发送到名为“Web 服务器”的特殊计算机上。Web 服务器托管你在互联网上看到的网站。它始终保持在线连接。它还针对请求网页的用户进行了优化。


    有许多公司和组织运行着他们自己的 Web 服务器。尽管如此，聘请一家 Web 托管公司来运行你的 Web 服务器仍然更加方便。当然，你可以找到付费和免费的托管服务，选择哪一个取决于你的偏好和需求。


    在确定特定的网络托管公司之前，你必须查看评论并进行研究。此外，你必须记住，免费托管服务通常是有限制的。因此，你无法利用付费版本所提供的所有功能。


    说到设备，用户使用笔记本电脑、台式电脑、手机和平板电脑等设备访问网站。由于用户现在可以使用各种设备进入网络，你必须确保你的网站在这些设备上都能正常显示。记住，它们具有不同的屏幕尺寸以及不同的加载时间。某些设备连接互联网比其他设备更快。


    ## 屏幕阅读器


    这些程序通过扫描并向用户读取屏幕内容。通常情况下，它们被视力不或有视觉障碍的人士使用。

