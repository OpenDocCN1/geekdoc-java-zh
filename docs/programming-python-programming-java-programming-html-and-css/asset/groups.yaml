    has been italicized. </p>

    ```


    The output of the above given example should look like this:


    ## HTML & CSS


    In this example, you can see that this word appears *italic*.


    In this other example, you can see that this certain *keyword* has been italicized.


    Just like with bold, only the words that are enclosed within the tags `<i>` and
    `</i>` are italicized. The rest of the sentence remains unaffected.


    ## Superscript and Subscript


    If you need to include certain terms or formula in your content, you can use superscript
    and subscript.


    The element `<sup>` is used to turn a character into a superscript. For example,
    you can use this element for mathematical concepts or dates.


    Consider the following examples:


    ```html

    <p> We will celebrate Christmas on the 25 <sup>th </span></sup> of December. </p>

    ```


    The output of the above given example should look like this:


    We will celebrate Christmas on the 25<sup>th</sup> of December.


    On the other hand, the element `<sub>` is used to turn a character into a subscript.
    For example, you can use this element for chemical formulas or footnotes.


    Consider the following examples:


    ```html

    <p> The chemical formula for water is H<sub>2 </span></sub> 0. </p>

    ```


    The output of the above given example should look like this:


    The chemical formula for water is H₂O..


    ## Whitespaces


    You have read about whitespaces from a previous chapter. In this part of this
    book, you will learn more about it. First of all, a whitespace or an extra space
    is used by webmasters or programmers to add an extra space to a line or start
    a new element.


    When your browser sees two spaces or more are next to each other, it will merely
    display a single space. Likewise, if it sees a line break, it merely considers
    it a single space. This is referred to as white space collapsing.


    Webmasters and programmers generally take advantage of this when indenting their
    code and making it easier to read. It is just more organized to see a program
    that is not cluttered with sentences. You can use as many spaces as necessary
    between the words, or even press Enter to go to a new line, and your output will
    stay the same.


    Take a look at the following example:


    ```html

    < p > The girl that has no name slain the sons of Walden Frey and fed them to
    him. < </p>

    ```


    ```html

    < p > The girl that has no name slain the sons of Walden Frey and fed them to
    him.< </p>

    ```


    ```html

    < p > The girl that has no name slain the sons of Walden Frey and fed them to
    him. < </p>

    ```


    The output of the above given example should look like this:


    The girl that has no name slain the sons of Walden Frey and fed them to him.


    The girl that has no name slain the sons of Walden Frey and fed them to him.

    The girl that has no name slain the sons of Walden Frey and fed them to him.


    As you can see, the output remains the same in spite of the number of spaces and
    line breaks used on the sentence.


    ## CHAPTER 6: HTML LISTS


    In general, there are three ways on how you can specify your list of information.
    Keep in mind that every list has to contain at least one element.


    A list can contain the following:


    - `<ol>` You use it for ordered lists because it makes use of various schemes
    in order to list the items.

    - `<ul>` You use it for unordered lists because it lists the items with use of
    bullets.

    - `<dl>` You use it for definition lists because it organizes the items as if
    they were in a dictionary.


    ## Ordered Lists


    If you want to display your items with numbers rather than bullets, you have to
    use an ordered list. You have to use the tag `<ol>`. When you do, you will notice
    the numbering begins at 1 and has an increment of 1.


    To help you understand this concept further, take a look at the following example:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title> This sample program shows you an ordered list looks like</title>

    </head>

    <body>

    <ol type="1">

