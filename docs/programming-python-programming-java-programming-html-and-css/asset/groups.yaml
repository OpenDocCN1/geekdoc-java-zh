    ## CHAPTER 4: HTML STRUCTURE


    ## Structuring Web Pages and Documents


    How Web Pages Use Structure


    To help you understand the way web pages use structure as a beginner, you can
    think of a typical newspaper. How does it look like? What are its parts and features?


    For every page of the newspaper, you will see a headline. It is usually followed
    by images and texts. Then, you will see the main article, which may include subheadings
    or is divided into several sub-sections. This particular structure of the newspaper
    allows readers to understand the article or the news report better. The page is
    organized and classified into their appropriate categories to prevent confusion
    and misinformation.


    A computer program has the same concept. It needs to have a structure in order
    for it to run and be understood properly. If its elements are not appropriately
    organized, the programmer may be confused.


    The following are the primary elements of HTML:


    - Header

    - Main

    - Navigational menu

    - Article

    - Section

    - Aside

    - Address

    - Footer


    These elements are pretty self-explanatory. So, it should not be difficult for
    you to know what they are meant for, even if you are only a beginner.


    ## Header


    This element is used for the purpose of identifying and containing the contents
    that shows at the beginning of each web page. These contents include the logo
    or branding, search bar, tagline, navigation items, and other things that are
    duplicated across your web pages.


    More often than not, the header is placed before the body, but it can also precede
    the main element.


    ## Main


    This element is found between the header and the footer, and is meant to denote
    the contents of your web page that are related to the primary topic or the body
    of your web page. It has to contain contents that are unique to this page. It
    should not contain contents that are duplicated across your web pages, such as
    navigation items, headers, and footers.


    Then again, you can have more than one main element on your web page. This is
    especially ideal if your homepage features your most recent posts. You can have
    a main element for each of these posts.


    ## Navigational Menu


    This element is usually placed at the upper part of the web page. It can also
    be placed in the footer or at the sidebar. You have to use the tag `<nav>` when
    using a navigational menu on your web page. Then again, there is no need for you
    to use this tag for all your links. Nevertheless, they are crucial for the blocks
    of links that navigate to a specific part or the entire website.


    ## Article


    This element can be placed anywhere on your web page, although it is most commonly
    found after the main or section elements. It is ideal to be used if you have articles,
    blog posts, and any other contents that are syndicated.


    ## Section


    This element is used for the purpose of determining the contents that are major
    sub-sections of the entire website. For instance, if you have an e-book on your
    web page that is in HTML format, you can use this element for every chapter of
    the e-book.


    Similarly, if your sidebar has several sections for the search, ads, signup form,
    and related posts, you can use the section tags for each one of these sections.


    Some users are confused with using div and section. Ideally, you have to use div
    if you simply want your content to be easier to organize or you are using JavaScript.
    On the other hand, you have to use section if you want your contents to be listed
    as items when you write the outline of your document.


    ## Aside


    This element can be used if your web page shows information that is related to
    your main content, but does not exactly constitute it. Related links and content,
    advertisements, and author information are usually found within this element.


    For instance, if your post contains technical terms and their definitions are
    found on the sidebar, you should probably put these definitions in tags. This
    way, it would be easier for your visitors and readers to see them. You may also
    want to use the tag `<aside> for your sidebar in order to make it clear to your
    visitors that it is not a primary part of your web page.


    ## Address


    This element is used to provide the contact information of the author or owner
    of the website, an article, or a document on the web page. If it is found within
    the body, it shows the contact information of the document. If it is found within
    the article, it shows the contact information for that particular article.


    ## Footer


    This element represents a footer for the nearest sectioning root or sectioning
    content element. It usually contains information regarding the author, links of
    documents, and copyright.


    ## Related Elements and Declaration


    The following are other elements that you may find in the HTML program:


    ### Meta


    This element is used to provide additional information to the HTML document. The
    information that is enclosed within the tag `<meta>` is not shown on the website.
    However, it is read by web crawlers and browsers.


    ### Base


    This element is used to determine a base URL upon which you can build all relative
    URLs that you use on your web page. If it contains a target attribute, this attribute
    would be used as a default attribute for every hyperlink that appears on the document.


    ### Div


    This element is used to define arbitrary blocks of content that can be placed
    and styled as single units.


    ### DOCTYPE


    This declaration is used to inform the browsers of visitors that the document
    is an HTML document. All HTML documents have to have this declaration in order
    to be compliant with the HTML standards.


    ## CHAPTER 5: HTML TEXT


    ## Markup


    When you create a web page, you have to add tags, which are referred to as markups
    to the content of your page. They give additional information as well allow the
    browsers to display the correct structure of the page.


    In general, there are two types of markups: structural and semantic. Structural
    markup refers to the elements that you use to identify the paragraphs and the
    headings. Semantic markup, on the other hand, provides addition information, such
    as meanings of acronyms, quoted sentences, and emphasis among others.


    ## Headings


    In essence, there are six levels of headings used in HTML.


    ```html

    <h1></h1>

    <h2></h2>

    <h3></h3>

    <h4></h4>

    <h5></h5>

    <h6></h6>

    ```


    The first heading `<h1>` is meant for the main heading. The second heading `<h2>`
    is meant for the subheading. If you have more sections under your subheading,
    you have to use the third heading `<h3>`, the fourth heading `<h4>`, and so on.


    Web browsers usually show the contents of headings in various sizes. For instance,
    the contents of the first heading `<h1>` have the largest size while the contents
    of the sixth heading `<h6>` have the smallest size. Then again, the sizes displayed
    on browsers can vary. As a user, you have control over what size you want your
    texts to appear on your browser. You also have control over their color and font
    style.


    Take a look at the following example:


    ```html

    <h1>This is an example of the main heading</h1>

    <h2>This is an example of the level 2 heading</h2>

    <h3>This is an example of the level 3 heading</h3>

    <h4>This is an example of the level 4 heading</h4>

    <h5>This is an example of the level 5 heading</h5>

    <h6>This is an example of the level 6 heading</h6>

