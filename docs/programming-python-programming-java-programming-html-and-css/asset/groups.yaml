  mdcn: "\n\n# JAVA 编程\n\ncount 的当前值是: 7\ncount 的当前值是: 8\ncount 的当前值是: 9\n\n你会发现，代码在表达式中声明了变量。循环的作用范围涵盖了变量声明一直到循环部分的结束，因此它在终止和递增表达式时非常有用。如果循环内部的变量在其他地方不需要，更好的做法是直接在循环内部声明该变量，以减少错误。\n\
    \n`for` 循环内部表达式并不是必需的。换句话说，如果程序进入了 `for` 循环且没有任何表达式，将没有任何内容需要评估。这将导致如下面示例代码所示的死循环。\n\
    \n```java\nfor ( ; ) {\n    // 过程 / 代码 / 语句\n}\n```\n\n`for` 循环有另一种编写方式。这种形式在遍历数组和记录（将在第\
    \ 3 章中讨论）时非常有用。这种形式的 `for` 循环其他术语是增强型 for 语句（增强 for）。增强 for 语句有助于使循环更加紧凑且易读。以下是一个将增强循环应用于数组的示例代码：\n\
    \n```java\nclass EnhancedForExample {\n    public static void main(String[] args)\
    \ {\n        int[] values = {11, 12, 13, 14, 15, 16, 17, 18, 20};\n        for\
    \ (int list : values ) {\n            System.out.println(\"The number is: \" +\
    \ list);\n        }\n    }\n}\n```\n\n代码中的循环看起来与普通的 `for` 循环有点不同。变量 `list` 类似于一个指向当前索引的指针，允许访问其当前值。上述程序的输出将是：\n\
    \n```\nThe number is : 11\nThe number is : 12\nThe number is : 13\nThe number\
    \ is : 14\nThe number is : 15\nThe number is : 16\nThe number is : 17\nThe number\
    \ is : 18\nThe number is : 19\nThe number is : 20\n```\n\n建议使用增强 for 语句，特别是在处理数组和记录时。它减少了迭代错误并提高了代码的可读性。\n\
    \n## 分支语句\n\n### Break 语句\n\n我们都见过 `break` 语句是如何工作的。一旦程序遇到 `break` 语句，它就会终止其所属的代码部分。事实上，这是\
    \ `break` 最常见的应用。另一个应用是带标签的 `break`。虽然它与无标签的 `break` 几乎相同，但“标签（label）”一词产生了区别。这里有一个示例代码：\n\
    \n```java\npublic class Hello{\n    public static void main(String[] args) {\n\
    \        int x,y;\n        loop:\n        for(x=0;x<5;x++) {\n            System.out.println(\"\
    \ \");\n            for(y=0;y<5;y++) {\n                System.out.print(\"x \"\
    );\n                if(y==3 && x==2 ) {\n                    break loop;\n   \
    \             }\n            }\n        }\n    }\n}\n```\n\n通过添加语句“loop”，带标签的\
    \ `break` 变得可能。根据上述代码，当 `y` 的值评估为 3 且 `x` 的值评估为 2 时，`break` 语句终止由标签 `loop` 覆盖的部分。上述程序的运行是：\n\
    \nx x x x x\nx x x x x x\nx x x x x\n\n### Continue 语句\n\n`continue` 语句实际上是 `break`\
    \ 语句的相反面。在某种意义上，如果表达式内部的条件评估为真，它会保持某部分继续运行。但它并不完全相反，因为它跳过了 `for`、`while` 和 `do-while`\
    \ 循环的当前迭代。\n\n与 `break` 语句一样，`continue` 语句也有无标签和带标签的形式。在无标签的 `continue` 语句中，会对表达式进行评估，以便程序知道是否应该跳到代码部分的末。\n\
    \n#### 这里是一个无标签的 `continue` 语句的示例：\n\n```java\npublic class Hello{\n    public\
    \ static void main(String[] args) {\n        int x,y;\n\n        for(x=0;x<5;x++)\
    \ {\n            System.out.println(\" \");\n            for(y=0;y<5;y++) {\n\
    \                System.out.print(\"x \");\n                if(y==3 && x==2 )\
    \ {\n                    continue;\n                }\n            }\n       \
    \ }\n    }\n}\n```\n\n#### 上述代码的输出将是：\n\nx x x x x\nx x x x x x\nx x x x x x\n\
    x x x x x x\n\n注意：由于上述代码是无标签的 `continue` 语句，代码不会跳过包含的表达式，尽管它仍然会评估表达式为真为假。\n\n\
    另一方面，带标签的 `continue` 会跳过标签开始的循环。这里是一个带标签的 `continue` 语句的示例：\n\n```java\npublic\
    \ class Hello{\n    public static void main(String[] args) {\n        int x,y;\n\
    \        loop:\n        for (x=0;x<5;x++) {\n            System.out.println(\"\
    \ \");\n            for(y=0;y<5;y++) {\n                System.out.print(\"x \"\
    );\n                if(y==3 && x==2 ) {\n                    continue loop;\n\
    \                }\n            }\n        }\n    }\n}\n```\n\n## 第3章：数组\n\n数组不是基本类型。它是存储相同类型变量的容器。数组的大小是固定的。一旦创建了数组，它就无法扩展。\n\
    \n![array](img/ecc93915cc11c52875ba42510a27_0.png)\n\n如上所示，数组的位置称为索引（indices）。存储在索引中的值称为元素（elements）。数组从索引0开始\n\
    \n### 数组声明\n\n考虑整数变量 `sample_array`。为了让 `sample_array` 成为数组，在 `int` 之后添加 `[]`。示例：\n\
    \n```java\nint[] sample_array;\n```\n\n你刚刚声明了一个名为 `sample_array` 的整数数组。现在，数组声明可以分为两个部分：数组的数据类型和数组本身的名称。`[]`\
    \ 保持为空是因为它们不是声明的一部分。虽然你声明了数组，但这意味着意味着创建了它。\n\n**注意：** 与任何其他变量一样，正确声明数组非常重要。否则，你的程序将遇到错误。\n\
    \nJava 数组不仅限于整数数组。以下是其他类型的示例：\n\n- `String[] string_array;`\n- `byte[] byte_array;`\n\
    - `long[] long_array;`\n- `float[] float_array;`\n- `boolean[] boolean_array;`\n\
    - `double[] double_array;`\n- `char[] char_array;`\n- `short[] short_array;`\n\
    \n以下代码行是向特定数组索引赋值（元素）的示例：\n\n```java\nsample_array[0] = 24;\nchar_array_sample[4]\
    \ = \"E\";\n```\n\n为了访问数组并显示它，可以使用数组名称和你想访问的元素的索引：\n\n```java\nSystem.out.println(\"\
    The value is: \" + sample_array[0]);\nSystem.out.println(\"The element is: \"\
    \ + char_array_sample[4]);\nSystem.out.println(\"The element in the index is \"\
    \ + sample_array[5] + \".\");\n```\n\n"
