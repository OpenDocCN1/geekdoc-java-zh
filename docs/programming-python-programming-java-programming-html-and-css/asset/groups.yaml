    The average is: \" + average + \" %.\");\n}\n```\n\n在方法中，需要的组件只有方法名、返回类型、参数（如果有）以及方法本身。然而，还可以添加一些组件，如修饰符和异常列表。修饰符对方法很重要，这样数据访问就是安全的，并且不会误处理信息。异常列表也很重要，因为它们用于处理运行时错误。关于异常列表的更多内容将在后续章节讨论。\n\
