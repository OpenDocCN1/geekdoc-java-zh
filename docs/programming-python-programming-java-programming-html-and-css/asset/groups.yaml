  mdcn: "\n\n使用 \"instanceof\"。这减少了因类型转换不当导致运行时错误的概率。\n\n```java\nif (obj1 instanceof\
    \ MyOwnClass) {\n  MyOwnClass sample = (MyOwnClass) obj1;\n}\n```\n\n`instanceof`\
    \ 运算符检查 `obj1` 是否指向 `MyOwnClass`，以便在不会抛出运行时异常的情况下进行转换。\n\n## 多重继承\n\n类和接口之间的区别是接口不允许拥有字段，而类可以。另一个区别是，接口不能创建自身的实例来创建对象，而类可以被实例化来创建对象。正如第\
    \ 4 章所讨论的，对象通过类定义的字段来存储其当前状态。\n\nJava 编程语言不允许一个类拥有多个父类，其是为了避免状态多重继承的可能性，换句话说，就是避免从多个类继承字段的能力。\n\
    \n考虑一种可以创建一个扩展多个类的类的情况。当通过类的实例创建对象时，该类所有父类的字段都将由对象继承。可能会出现某个方法或构造函数创建了相同字段实例的情况。这将非常难以解决。这也是接口不能包含字段的原因；为了避免状态多重继承带来的问题。\n\
    \n从多个类继承方法定义的能力被称为**实现的多重继承**。这种继承可能会带来很多问题，例如方法名冲突。能够支持实现多重继承的编程语言\n\n# JAVA\
    \ 编程\n\n可能会遇到诸如多个父类具有同名方法的情况。这些编程语言的编译器将无法区分不同方法之间的差异。人为错误（例如与父类方法产生冲突）也可能发生。\n\
    \n默认方法也具有不同形式实现多重继承。一个接口可以被多个类实现。这些接口可以包含同名的默认方法。在 Java 中，编译器有一套规则可以验证默认方法所需的类需求。\n\
    \nJava 编程语言具有支持**类型多重继承**的能力。这在技术上是指实现多个接口的能力。一个对象可以拥有多个类型。这些类型可以是它们自己的类，也可以是类实现的所有接口的类型。换句话说，如果一个声明变量声明为接口类型，则该变量的值可以用于引用任何实现了该接口的类的任何实例化对象。\n\
    \n另一方面，实现多重继承允许类从其扩展的接口继承任何定义方法的不同实现。\n\n## 实例方法\n\n在子类中，与父类实例方法具有相同签名和返回类型的实例方法，具有重写父类实例方法的能力。\n\
    \n由于子类的重写能力，允许一个类继承一个特征相对相似的父类，并根据需要修改这些特征。重写方法的组件（名称、参数类型和参数数量、返回类型）必须与被重写的方法相同。重写方法也可以返回被重写方法返回类型的子类型；换句话说，即协变返回类型。\n\
    \n在方法重写期间，建议使用 `@Override`，这样可以指示编译器父类中的方法将被重写。如果父类中不存在要重写的方法，则会发生错误。\n\n## 静态方法\n\
    \n当在子类中定义与父类相同的静态方法（方法签名相同）时，子类的方法将隐藏父类的方法。\n\n实例方法重写和静态方法重写的区别在于：\n\n- 子类中被重写的实例方法是被调用的方法。\n\
    - 使用的隐藏静态方法可能会不同，因为其调用的位置在父类和子类之间可能不同。\n\n在接口中，默认方法和抽象方法可以像实例方法一样处理，以便像实例方法一样被继承。尽管如果类或接口的父类型已经具有相同方法签名的默认方法，Java\
    \ 编译器将遵循继承规则，从而解决方法名的冲突。这些规则是：\n\n- 接口默认方法的优先级低于实例方法。\n- 被其他候选者重写的方法将被忽略。这种情况发生在父类型具有相似的祖先类时。\n\
    \n在抽象方法的情况下，如果至少有一个定义的默认方法与抽象方法冲突，Java 编译器将抛出编译错误。需要注意的是，父类型方法必须显式地重写。\n\n## 多态\n\
    \n在生物学中，多态（polymorphism）术语指的是生物或物种可以处于多个不同的阶段或形式。在 Java 编程语言，这个概念同样适用。独特的行为可以通过自己的子类定义，但仍然能够共享父类的一些相似功能。\n\
    \n为了演示多态，我们将对 `Vehicle` 类进行一些调整。例如，可以在类中添加一个名为 `displayData` 的方法。该方法显示当前存储在实例中的所有数据。\n\
    \n```java\npublic void displayData() {\n    System.out.println(\"\\nThe Vehicle\
    \ is \" + \"in the correct\" + this.\n    + \" with a gas in liters of \" + this.gas\
    \ +\n    + \" and currently have a total distance travelled of \" + this.distance\
    \ + \".\");\n}\n```\n\n为了演示 Java 语言中的多态特性，`Car` 类扩展了 `Vehicle` 类。对于 `Car` 类，将添加一个名为\
    \ `breaks` 的字段，这是一个字符串值，表示汽车是否包含减震器。以下是更新后的类：\n\n```java\npublic class Car extends\
    \ Vehicle {\n\n    private String breaks;\n\n    public Car(\n        int sDistance,\n\
    \        int sGas,\n        int sAngle,\n        String breakType) {\n       \
    \ super(sDistance,\n        sGas,\n        sAngle);\n        this.setBreaks(breakType);\n\
    \    }\n\n    public String getBreaks() {\n        return this.breaks;\n    }\n\
    \n    public void setBreaks(String breakType) {\n        this.breaks = breakType;\n\
    \    }\n\n    public void displayData() {\n        super.displayData();\n    \
    \    System.out.println(\"The \" + \"car has a\" +\n        getBreaks() + \" type\
    \ as breaks\");\n    }\n}\n```\n\n注意被重写的方法 `displayData`。另一个需要考虑的细节是输出中包含关于刹车的数据。下一步是创建\
    \ `RallyCar` 类。由于拉力赛车使用不同的轮组以便在泥地上转向，在字段集中添加了新字段 `WheelWidth`。以下是 `RallyCar` 类：\n\
    \n```java\npublic class RallyCar extends Vehicle {\n\n    private int WheelWidth;\n\
    \n    public RallyCar(\n        int sDistance,\n        int sGas,\n        int\
    \ sAngle,\n        int newWheelWidth) {\n        super(sDistance,\n        sGas,\n\
    \        sAngle);\n        this.setWheelWidth(newWheelWidth);\n    }\n\n    public\
    \ int getWheelWidth() {\n        return this.WheelWidth;\n    }\n\n    public\
    \ void setWheelWidth(int newWheelWidth) {\n        this.WheelWidth = newWheelWidth;\n\
    \    }\n\n    public void displayData() {\n        super.displayData();\n    \
    \    System.out.println(\"The Rally Car \" + \" has \" + getWheelWidth() + \"\
    \ set of wheels.\");\n    }\n}\n```\n\n"
