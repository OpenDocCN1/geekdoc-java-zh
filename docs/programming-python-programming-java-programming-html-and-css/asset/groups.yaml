    在元组中。


    ## 字典的所有信息 (All About Dictionaries)


    字典类似于包含单词定义的普通字典。在字典中，你拥有许多单词，每个单词都有一个对应的定义。在 Python 中，你需要查找定义的单词被称为“键”（key），而定义则被称为“值”（value）。你不会在字典中找到带编号的值，键也是如此。你可以自由添加、删除和修改需要包含在字典中的值。一个很好的例子是电话簿或地址簿。


    ## 字典示例 (Dictionary Sample)


    列表（Lists）和元组（tuples）允许你通过访问索引数字获取特定索引的值或内容。相反，字典可以根据名称为你提供你需要的数字——这与列表和元组是相反。如果你需要存储不同联系人的电话（就像电话簿一样），你就需要使用字典。


    当你开始创建字典时，你会发现它与创建列表或元组相似。列表使用括号 `( )` 以及括号内或内部的值。元组使用中括号 `[ ]` 以及其之间的值。而字典则使用大括号
    `{ }`。


    以下是创建字典的方法（示例是一个电话簿）：


    ```

    phone={''Catherine Becket'':7895675, ''Anthony Clarke'':1234523,

    ''Linda Jones'':8875689, ''Andy Bower'':7564438, ''Davey Lewis'':56656789}

    ```


    如果你想打印 Catherine 的号码：


    ```

    print phone[''Catherine Becket'']

    ```


    看到与列表或元组的区别了吗？你不是使用数字或索引来标识值，而是使用了你需要检索的值。在给定示例中，你使用人的名字来检索她的号码。


    ## 向字典添加条目 (Adding an Entry to the Dictionary)


    当你想要向字典添加条目时，你需要遵循以下语法：


    ```

    dictionary name[''要添加的名称或键'']=值

    ```


    尝试一下这个：


    ```

    phone[''David King'']=1231234

    ```


    上述语句告诉程序向 `phone` 字典中添加名为 ‘David King’ 且号码为 1231234 的


    如果你尝试打印 David 的号码，‘1231234’ 将显示在屏幕上。


    ## 删除条目 (Deleting an Entry)


    当你想要从字典中删除一个值时，使用 ‘del’。这是你需要遵循的语法：


    ```

    del dictionary name [''字典上的名称'']

    ```


    如果你想从你的字典中删除 Anthony，你可以这样做：


    ```

    del phone[''Anthony Clarke'']

    ```


    请注意你的大小写。Python 是区分大小大小的。如果你不小心忘记了需要大写的字母，请做好准备在你的控制台屏幕上看到错误消息。


    这里有一个构建字典的示例程序：


    ```python

    1 #一个字典的示例程序

    2

    3 #首先定义字典，它最初是空的

    4

    5 age = {}

    6

    7 #向字典添加一些名称以及对应的

    8 age

    9 age[''Anna''] = 20

    10 age[''Portia''] = 19

    11 age[''Ambrose''] = 65

    12 age[''Allain''] = 45

    13

    14 #使用 has_key() 函数，它的形式如下：

    15 #function_name.has_key(key-name)

    16 #如果字典包含该键-name，则返回 TRUE

    17 #如果没有，则返回 FALSE。

    18

    19 if age.has_key(''Anna''):

    20     print "Anna 在字典列表中。她今年是", \

    21 age[''Anna''], "years old"

    22

    23 else:

    24     print "Anna 不在字典列表中"

    ```

