    # Going Online


    # Web Browsers


    Users can visit websites on the Internet using a web browser, which is a type
    of software. Some of the most commonly used web browsers are Google Chrome, Internet
    Explorer, Mozilla Firefox, Opera, and Safari.


    If you want to view a particular web page, you have to type its address on your
    browser. You can also use a bookmark or follow the link that takes you to the
    website by clicking on it.


    Manufacturers of software release a new version of their browser on a regular
    basis. Each time, they add a new feature as well as supporting additions to the
    computer language.


    Then again, it is crucial for you to take note that a lot of users do not run
    the most recent versions of their browsers. Thus, you cannot expect everyone who
    visits your website to use the most recent functionalities offered by the updated
    browsers. You have to consider this fact when you create a website.


    If you want to make sure that you can reach everyone from different parts of the
    world, you have to make your website compatible with the browser that they use.
    Aside from using the updated versions, you should also make your website viewable
    by users with older versions of browsers.


    # Web Servers and Devices


    The moment you ask the browser you use for a web page, it automatically sends
    a request across the World Wide Web.'
