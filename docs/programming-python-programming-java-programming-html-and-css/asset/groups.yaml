    <li>Glock</li>

    <li>Grendel</li>

    <li>Mauser Model</li>

    <li>Pocket Pistols</li>

    <li>Ruger Old Army</li>

    <li>Smith and Wesson</li>

    <li>Weather Vanguard</li>

    </ol>

    </body>

    </html>

    ```


