    In the following sections, you will find Python installation for different platforms.


    # For Unix and Linux


    You need to open your browser and go here to get your Python installer; http://www.python.org/downloads/.


    Follow the link so you can download the needed source code.


    After downloading, you can extract the files.


    You can edit the setup file if you wish to modify the options to meet your requirement.


    Run the code, configure the script.


    Install Python, and it is ready. You can use it right away if you are ready to
    start.


    # For Windows


    Here are the steps to take when installing Python in computers using Windows.


    Open your browser and go here for your installer; http://www.python.org/downloads/.


    To use the installer python-{version} you wish to install}.msi, the installed
    Windows in your computer system should support Microsoft Installer 2.0, otherwise
    you won''t be able to install or run Python. To check if your Windows supports
    MSI, save the installer to your computer, and simply run it to find out.


    You need to run the saved file next. The easy-to-use installer wizard for Python
    will pop. You won''t get intimidated even if it''s your first time running it.
    Choose default settings, and'
