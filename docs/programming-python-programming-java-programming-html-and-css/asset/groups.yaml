    Java 实际上是一种由太阳微系统公司（Sun Microsystems）开发的出色的编程语言。它最初用于内核应用程序或 Applet。这些 Applet
    嵌入在网页中并在浏览器中运行。Java 使用一种被称为字节码（byte code）的特殊格式，而不是普通的机器码。在 Java 解释程序的帮助下，字节码可以在任何计算机上执行。这个
    Java 解释程序被称为 Java 虚拟机或 JVM。它在今天的大多数计算机系统中都是可用的。Java 可能使用字节格式，但 Java 没有任何部分是要求使用这种字节码技术的。存在一些编译器，可以生成真正的机器码，或者广为人知的原生代码（native
    code）。


    Java 程序由一系列类组成。这些程序的源代码写在 `.java` 文件中。这些源文件被编译成 `.class` 文件，其中包含字节码而不是特定于 CPU
    的机器码。`.class` 文件随后在运行时由 Java 虚拟机（JVM 或解释器）执行。


    Java 并不限于内核应用程序。从技术上讲，它是一门完整的通用面向对象编程语言，可以开发各种应用程序。Java 的语法与 C++ 的语法非常相似，但去除了其容易出错的特性和复杂性。


    不要将 Java 误认为 JavaScript。JavaScript 是一种完全不同的编程语言。JavaScript 是网页或网站内容生成的三个基本组成部分之一。Java
    和 JavaScript 的区别在于 Java 是一种面向对象的编程语言，而 JavaScript 是一种面向对象的脚本语言。用 Java 编写的代码需要编译，而用
    JavaScript 编写的代码都是文本。Java 创建的应用程序可以在虚拟机和浏览器中同时运行，而 JavaScript 只能在浏览器中运行。每种语言还需要不同的插件集。


    创建 Java 的公司太阳微系统公司提供了开发基于 Java 软件的免费工具。如果你想了解更多关于这些工具，可以访问此网站（https://www.java.sun.com）获取更多信息，例如针对不同计算机系统（UNIX、Microsoft
    Windows、OSX）的 Java 编译器以及详细文档。Java 编译器是免费的，可以从给定的链接下载。


    在整本电子书中，我们将讨论 Java 程序编译的基础知识、简单的表达式和声明、类、对象和语句，直到你能够在一天内学习、理解并编写一个完整的 Java 程序。


    # 第一章：Java 基础


    # 编译和运行 Java 程序


    Java 中的每个源文件都恰好包含一个类。文件名必须与类名相同。例如，类 `Hello` 应该存储在源文件 `Hello.java` 中。使用 `javac`
    编译器，可以在终端中编译源文件 `Hello.java`：


    ```

    javac Hello.java

    ```


    这将产生一个与源文件同名但扩展名不同的文件；`.class` 扩展。类文件现在包含字节码。这意味着它不能被立即执行。它需要一个 Java 虚拟机或字节码解释器：


    ```

    java Hello

    ```


    上面的命令加载并执行 `Hello` 类及其 `main` 方法。如果该类包含了其他类的扩展（将在接后的章节中进一步讨论），这些类将在需要时自动加载。如果你有一个继承了几个其他源文件的源文件，你可以使用以下命令编译所有文件：


    ```

    javac *.java

    ```


    假设所有文件都在同一个文件夹中，每个源文件将加载并执行其对应的类文件。


    # 声明和表达式


    Java 中有八种原始类型（primitive types）。原始类型意味着这些类型不是根据其他任何东西定义的；基本上是原子的。它们是 CPU 准备好处理的位序列。这些类型是：


    Byte, short, int, long, float, double, char, Boolean


    如果变量类型不是原始类型，则它被视为引用类型（reference type）。引用类型可以是类、接口或数组类型。任何引用类型的变量都可以被设置为 `null`。这意味着它可以不包含任何内容。


    Java 支持常规的数据类型，如整数、字符、布尔值和其他变量。这里是示例：


    ```

    int a, b; // 整数变量

    float f; // 浮点数变量

    char s; // 字符变量

    boolean a;      // 返回真或假

    ```


    注意：`//` 和 `/* */` 分别用于单行注释和多行注释。


    数值表达式的写法几乎与其他语言完全相同。


    ```

    a = 2 * (3 + 1);

    b = c / 4.1243;

    np = q % 2;

    o = true;

    s = ''L'';

    ```


    在声明变量时可以为其赋值一个初始值。


    ```

    int a = 5;

    float f = 0.52;

    ```


    # Java 编程


    Java 中的除法运算符实际上代表两种含义。它可以可以是实数的除法，也可以是整数的除法。这在大多数情况下并不是一个大问题，尽管可能会导致不同的结果。


    ```

    double a;

    a = 1/9;           // a 的结果将为 0.0

    a = 1.0 / 9.0;     // a 的结果将为 0.111...

    ```


    第一个操作执行的是整数除法，因此结果为 0。如果你想得到 1 除 9 的精确商，你需要将 1 和 9 表示为实值，以便除法变为实除法。


    在 Java 中可以将实值赋值给整数变量。值会自动转换为相应的类型。这被称为类型转换（typecasting）。


    Java 支持类型转换，但不会自动执行转换。程序员需要通过在表达式前的括号中写入所需的类型来指示何时以及进行哪些转换。


    ```

    double a;

    int b;

    b = (int) (a * 12.3223122);

    ```


    当然，可以将整数赋值给实变量而不需要类型转换。只要转换不会丢失任何信息，就不需要强制转换。


    Java 是一门面向对象的编程语言，因此我们使用的术语与结构化编程语言中的术语略有不同。


