    wait for it to finish installing. You are ready to use Python on Windows.


    # For Macintosh


    Recent Macs have Python installed in their system already, but the trouble is
    it could be out of date. You can visit here here to get the latest version of
    Python for Mac; http://www.python.org/download/mac/.


    You will also get the extra tools. For past versions of Mac OS, before the 2003
    release of OS X 10.3, there is MacPython.


    You can also visit this link to access the entire documentation of MacPython;
    http://www.cwi.nl/~jack/macpython.html


    # Online Python Programming


    You can also run your Python program here if you don''t want to install Python
    in your computer yet; http://www.pythonthontutor.com/visualize.html#mode=edit


    You will see two windows – the code window and the output window. You can practice
    as much as you want, and even start coding as you learn. You can understand how
    things work better if you begin using Python as you read this book. You will be
    able to see where you are going, and how to fix the errors that you might encounter.


