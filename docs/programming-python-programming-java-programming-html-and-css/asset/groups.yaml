    `food` 现在的值是餐费加上税费。


    在下一行，将值 `food+food*tip` 赋值给变量 `total_cost`，以获得餐点的总费用。


    你有这样这段代码：


    ```

    1 # 这个程序将计算餐总费用加上小费

