    block is positioned between the tags <body> and </body>.


    If you look at the code closely, you will realize that there are other words that
    are within angle brackets such as <head> and </head> as well as <html> and </html>.
    The words that are found within these angle brackets are referred to as HTML tags.


    Most of the tags in HTML come in pairs. The <body>, instance, is used to signify
    the beginning of a sentence while the slash ( / ) is used to signify the end of
    a sentence. So, when you see </body>, you can expect to find a sentence that was
    ended.


    Keep in mind that every tag represents a particular function. For instance, the
    tags <p> and </p> are used to signify the beginning and end of a particular paragraph.


