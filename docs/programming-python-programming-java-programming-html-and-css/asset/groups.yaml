  mdcn: "\n\n# JAVA 编程\n\n它们的方法重载。\n\n方法重载在编写程序时可能是一个高效的概念，但它降低了代码的可读性，因此使用频率并不高。\n\
    \n# 方法返回值\n\n有三种情况会导致方法退出其区域并返回到主程序：第一是方法执行了其体内的所有语句；第二是遇到了 `return` 语句；第三，是抛出了\
    \ `exception`（异常）。\n\n在方法声明中可以声明方法的返回类型。然后使用 `return` 语句来返回在方法体内求值的方法的结果。如果方法的返回类型为\
    \ `void`，则它不返回任何值，也不要求包含 `return` 语句。然而，在某些情况下，可以使用 `return` 语句来控制程序流并退出方法——几乎类似于\
    \ `break` 语句。尝试从一个声明为 `void` 的方法返回值将导致编译错误。相反，如果方法没有声明为 `void`，则要求包含一个带有对应值的 `return`\
    \ 语句。\n\n返回值的数据类型与方法声明的返回类型的数据类型相同也关重要。例如，尝试从一个整数值返回一个 `float` 值。这将导致错误。\n\n```\n\
    public int solveAverage ( ) {\n    return ((score1+score2+score3)/3);\n}\n```\n\
    \n该方法将返回表达式 (score1 + score2 + score3) / 3 的求值结果。\n\nreturn 语句不仅限于原始数据类型。\n\n\
    它还可以返回引用类型变量。看下面的代码：\n\n```java\nPublic MyOwnClass solveMethod( MyOwnClass sample1,\n\
    MyOwnClass sample2) {\n    MyOwnClass example_1;\n    //在此处插入一些代码\n    Return\
    \ example_1;\n}\n```\n\n# this 语句\n\n我们在之前的章节中已经见过 \"this\" 的用法。`this` 实际上指的是当前正在调用其方法或构造函数的对象。通过使用\
    \ `this`，可以在实例方法内部引用当前对象的任何成员或属性。\n\n`this` 关键字通常用于字段，因为它被方法或构造函数的参数所遮蔽。\n\n看下面的示例：\n\
    \n```java\npublic class sample{\n    public int a;\n    public int b;\n\n    public\
    \ sample (int i, int j) {\n        a = i;\n        b = j;\n    }\n}\n```\n\n通过使用\
    \ `this` 语句，代码可以重写为：\n\n```java\npublic class sample{\n    public int a;\n   \
    \ public int b;\n\n    public sample (int a, int b) {\n    this.a = a;\n    this.b\
    \ = b;\n    }\n}\n```\n\n构造函数的每个参数都遮蔽了对象对应的每个属性。构造函数 `sample` 内部的属性 `x` 属于类 `sample`\
    \ 参数的局部拷贝。为了引用属性 `x`，构造函数需要使用 `this.x`。\n\n还可以使用 `this` 语句调用同一类中的另一个构造函数，只要它是在构造函数内部。这个过程可以称为显式构造函数调用。例如：\n\
    \n```java\npublic class sample {\n    private int a, b, var1, var2;\n    public\
    \ sample( ) {\n        this(0, 1, 3, 3);\n    }\n    public sample(int var1, int\
    \ var2) {\n        this(0, 1, var1, var2);\n    }\n    public sample ( int a,\
    \ int b, int var1, int var2) {\n        this.a = a;\n        this.b = b;\n   \
    \     this.var1 = var1;\n        this.var2 = var2;\n    }\n}\n```\n\n上述代码包含一组构造函数。每个构造函数都提供一个默认值并创建\
    \ `sample` 类成员变量的实例。\n\n# 第 5 章：\n接口与继承\n\n在编程和软件工程中，在某些情况下，让不同的程序员或不同的程序员小组拥有一个“共同基础”是至关重要的，这使得他们的代码和软件具有交互性。这些程序员应该能够编写代码，无论他们不知道其他程序员的代码是如何写的。这些程序员的“共同基础”被称为接口（interface）。\n\
    \n例如，在一个社区中存在先进车辆，可以在没有人类操作员的情况下运行并运输人员。为了让这些车辆运行，车辆制造商开发了用 Java 编写的软件可以在无需人工操作的情况下控制车辆。想象你的车辆或汽车自动启动并加速，并且能够管理速度以避免事故。\n\
    \n另一个可以考虑的例子是全球定位系统或 GPS。计算机系统接收 GPS 传输的数据，以跟踪车辆的位置并提供其它数据的无线传输，如最新的地图、天气和交通状况。结合\
    \ GPS，自动车辆可以实现这些功能。\n\n"
