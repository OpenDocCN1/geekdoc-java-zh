    \ As discussed in chapter 4, objects store their current state in fields which\
    \ can be defined through the use of classes.\n\nThe reason why the Java Programming\
    \ Language does not allow a class to have more than one super class is to avoid\
    \ the possibility of multiple inheritance of the state, or in other words, the\
    \ ability to inherit fields from multiple classes.\n\nConsider a situation where\
    \ it is possible to create a class that can extend multiple classes. When an object\
    \ is created through an instance of a class, the fields of all of the superclass\
    \ of that class will be inherited by the object. There will be a possibility that\
    \ a method or constructor can create an instance of the same fields. This will\
    \ be very difficult to resolve. This is also why interfaces cannot contain fields;\
    \ to avoid the problems from multiple inheritance of state.\n\nThe ability to\
    \ inherit method definitions from multiple classes is called multiple inheritance\
    \ of implementation. This type of inheritance can have a lot of problems such\
    \ as conflicts with method names. Programming languages that are able to support\
    \ multiple inheritance of implementation \n\n# JAVA PROGRAMMING\n\nmight encounter\
    \ situations such as multiple superclasses that have methods of the same names.\
    \ The compilers of these programming languages will not be able to distinguish\
    \ the difference of one method from the other. Human errors such as creating a\
    \ conflict with the methods of a superclass can also happen.\n\nDefault methods\
    \ also have a different form of multiple inheritance of implementation. Multiple\
    \ interfaces can be implemented by more than a class. These interfaces can contain\
    \ default methods with the same name. In Java, the compiler has rules that could\
    \ verify the default method class needs or uses.\n\nThe Java Programming Language\
    \ has the capability to support multiple inheritance of type. This is technically\
    \ the ability to implement more than one interface. It is possible for an object\
    \ to have multiple types. These types can be of their own class or the types of\
    \ all the interfaces implemented by the class. In other words, if a declared variable\
    \ is declared as a type of an interface, the value of that variable can be used\
    \ to reference any instantiated object from any class where the interface is being\
    \ implemented.\n\nMultiple inheritance of implementation, on other hand, allows\
    \ a class to inherit different implementations from an interface that it extends\
    \ any method defined.\n\n## Instance Method\n\nIn a subclass, an instance method\
    \ with the same signature and return type as an instance method in a superclass\
    \ has the capability to override the instance method of the superclass.\n\nDue\
    \ to the overriding ability of a subclass, a class can be allowed to inherit from\
    \ a superclass whose characteristics are relatively similar and modify those characteristics\
    \ as required. The components (name, type and number of parameters, return type)\
    \ of the overriding method must be the same as the method that it will override.\
    \ It is also possible for an overriding method to return the subtype of the type\
    \ returned by the overridden method; In other words, a covariant return type.\n\
    \nDuring method overriding, it is recommended to use the @Override so that the\
    \ compiler will be instructed that a method in the superclass will be overridden.\
    \ If the method to be overridden in the superclass does not exist, an error will\
    \ occur.\n\n## Static Methods\n\nWhen an identical static method (identical method\
    \ signatures) from a superclass is defined within a subclass, the method from\
    \ the subclass will hide the method from the superclass.\n\nThe difference between\
    \ instance method overriding and static method overriding is:\n\n- The overridden\
    \ instance method in the subclass is the method that is invoked.\n- The hidden\
    \ static method that gets used may vary since the location where it is invoked\
    \ may vary between a superclass and a subclass.\n\nIn an interface, default methods\
    \ and abstract methods can be treated like instance methods in such a way that\
    \ they can be inherited like instance methods. Although if the supertypes of a\
    \ class or interface already have default methods with the same method signatures,\
    \ the java compiler will follow the rules of inheritance so the conflict in method\
    \ name will be resolved. These rules are:\n\n- Interface default methods are less\
    \ preferred over instance methods.\n- Overridden methods by other candidates will\
    \ be ignored. This situation happens when the supertypes have a similar ancestor.\n\
    \nIn the case of abstract methods, if there is at least one defined default method\
    \ that conflicts with an abstract method, a compiler error will be thrown by the\
    \ Java compiler. It is important to note that the supertype methods must be overridden\
    \ explicitly.\n\n## Polymorphism\n\nIn Biology, the term polymorphism is referred\
    \ to where in an organism or species can assume multiple different phases or forms.\
    \ In the Java programming language, this concept is also applicable. The unique\
    \ behaviors can be defined by their own subclass but still be able to share some\
    \ of the similar functionalities of the parent class.\n\nTo be able to demonstrate\
    \ polymorphism, we will make some adjustments to the class Vehicle. For example,\
    \ a method named displayData can be added to the class. This method displays all\
    \ the data that are currently stored in an instance.\n\n```java\npublic void displayData()\
    \ {\n    System.out.println(\"\\nThe Vehicle is \" + \"in the correct\" + this.\n\
    \    + \" with a gas in liters of \" + this.gas +\n    + \" and currently have\
    \ a total distance travelled of \" + this.distance + \".\");\n}\n```\n\nTo be\
    \ able to demonstrate features of polymorphism in the Java Programming Language,\
    \ the class Vehicle is extended by class Car. For the class Car, a field named\
    \ breaks will be added, which is a String value that indicates if the car contains\
    \ a shock absorber, Here is the updated class:\n\n```java\npublic class Car extends\
