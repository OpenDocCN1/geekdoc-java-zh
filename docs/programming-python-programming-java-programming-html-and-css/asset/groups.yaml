    # CHAPTER 6:

    THE LOOPS


    What if someone tasked you to create a program that will do or repeat a certain
    process at least 50 times? Will you be able to pull it off without trouble? You
    could try copy-pasting a segment of the program, which the program needs to keep
    doing over and over again, for 50 times. Expect to see a virtually incompre incomprehensible
    program that is utterly pointless. But, there is a better alternative and that
    is to instruct the machine to keep doing a particular segment in the code, until
    it has reached the point or command that tells it to stop repeating the process.
    It is known as a loop.


    The ‘while loop’ is the loop that tells the program to keep doing a certain task
    while the answer returns a positive response or while it satisfies the condition
    within the loop. It will only stop when the answer returns a false response or
    if the condition in the while loop is no longer applicable for a particular process
    to execute.


    The ‘for loop’ is the loop that tells the computer to continue executing the code
    for a certain amount of repetition, the condition is true or still valid, or any
    given conditions in the ‘for loop’. It will only stop running the process when
    it encountered something that tells it to stop or if the condition is no longer
    applicable to perform the process.


    Loops are helpful because they can make the program more readable and they create
    ease in coding the program. A programmer no longer needs to write the code over
    and over again just to meet the goal of the process involved. It is also easy
    to maintain and update the program if it’s concise and clean.'
