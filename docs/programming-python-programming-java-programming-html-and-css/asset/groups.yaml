    # The Start Attribute


    As the programmer, you are free to use the start attribute with the tag <ol> if
    you want. Its purpose is for specifying the beginning point of the list marker
    that you prefer.


    This table shows you the start attributes that you can use for ordered lists.
    Take note that the starting point could be anywhere. You can start with whatever
    number you want. In the following sample table, the starting point would be number
    3.


    | Type Start | Description |

    | --- | --- |

    | Type = "1" Start = "3" | Numerals start with 3. If you use this type, your list
    items would be organized by numbers, starting from the nominal 3. |

    | Type = "A" Start = "3" | Letters start with C. If you use this type, your list
    items would be organized by uppercase letters, starting from the uppercase letter
    C because it is the third letter of the alphabet. |

    | Type = "a" Start = "3" | Letters start with c. If you use this type, your list
    items would be organized by lowercase letters, starting from the lowercase letter
    c because it is the third letter of the alphabet. |

    | Type = "i" Start = "3" | Numerals start with iii. If you use this type, your
    list items would be organized by lowercase numerals, starting with the Roman numeral
    iii. |

    | Type = "I" Start = "3" | Numerals start with III. If you use this type, your
    list items would be organized by uppercase numerals, starting with the Roman numeral
    III. |


    To help you understand the functions of the list attributes for ordered lists,
    you should take a look at the following examples:


