    # 第一章：欢迎来到 Python 世界


    Python 是一种交互式的、通用的、面向对象的高级编程语言。你需要遵循正确的语法来获得你想要的输出。学习 Python 语言并不困难，初学者也能掌握，但如果你对编程有一定了解，会有帮助。


    基本上，Python 能够满足各种编程语言的需求。你只需要熟悉 Python 的语法就能实现你想要的功能。如果你有特定的编程语言经验，那么理解 Python
    的工作将会非常容易。


    Python 有多个不同的版本，在本教程中使用 Python 2.7，你可以从这里免费下载：http://www.python.org


    ## 为什么选择 Python？


    Python 是解释型的，这意味着解释器在运行时处理所有内容。你想执行程序时不需要编译器。它与 PHP 和 PERL 类似。


    Python 是交互式的；它允许你作为程序员坐在 Python 提示符前，并在编写程序时与解释器建立交互。


    Python 是面向对象的。Python 使用面向对象的编程技术或风格将代码封装在对象中。


    Python 是适用于初学者的编程语言。许多人认为它是很棒的入门语言。它支持广泛的应用——从简单的文本处理到游戏开发。由于其结构简单、语法定义良好，学习起来非常容易。任何人都可以轻松掌握这门语言。


    Python 拥有强大的标准库，并且兼容 Windows、UNIX 和 Mac。你不需要进行任何转换或将其转换为你当前操作系统（OS）理解的内容。


