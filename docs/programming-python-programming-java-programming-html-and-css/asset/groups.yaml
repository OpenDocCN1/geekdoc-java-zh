    | == | Equal to | 6==6 |

    | != | Not equal to | 2!=2+1 |

    | < | Less than | 6<7 |

    | <= | Less than or equal to | 6<=2+a |

    | > | Greater than | 19>18 |

    | >= | Greater than or equal to | 4<=4-a |


    Remember the symbol that goes with each comparator. The comparators check if a
    value is (or is not) equal to, greater than (or equal to), or less than (equal
    to) another value. You usually use the comparators in a loop.


