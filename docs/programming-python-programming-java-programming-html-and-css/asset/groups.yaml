    # 学习 HTML 和学习使用它编写代码需要很长时间吗？


    这实际上取决于你学习新计算机语言并掌握其基础知识的能力。如果你以前学习过编程，和/或具有一些编写代码的训练或经验，那么你可能比初学者或新手更有优势。由于你已经熟悉了计算机编程，从你之前的语言过渡到
    HTML 可能不需要花费很长时间。


    但话虽如此，这仍然取决于你的能力。有些初学者是学得很快的人。他们可以在几天内就学会 HTML。更高级的程序员可以在不到一小时内学会基础知识。一旦你学会了如何使用标签，就可以立即开始创建
    HTML 页面。


    如果你想创建令人印象深刻的网站，你必须学习最新的技术以及标签的正确用法。你还必须学习更多图形设计和字体排版知识，以进一步提高你的技能。


    # 是否必须一直在线？


    不需要。实际上，你可以在离线时为你的网站编写代码。你可以将文件存储在计算机上，稍后再将其传输到网上。每当你有新代码时，都可以将其添加到现有的在线程序中。


    # 有没有 HTML 做不到的事情？


    是的。HTML 并不完美，但它的开发者一直在不断寻找改进方法。你可能还想为你的 HTML 程序学习层级样式表（CSS）和 JavaScript。前者用于页面的呈现方式并提高其可访问性，而后者为基础
    HTML 添加了更多功能。


    # HTML & CSS


    ## 层级样式表简介


    层级样式表（Cascading Style Sheets，通常称为 CSS）是一种用于让网站开发变得更简单的设计语言。它基本上被用于定义 Web 页面的样式，包括它们的布局、设计、针对不同设备的显示变化以及屏幕尺寸。


    它处理 Web 页面的感觉和外观部分。通过它，你能够控制字体样式、文本颜色、段落之间的间距、列的大小和布局、网站的背景颜色和背景图像、整体布局的设计、屏幕尺寸、多个设备中的显示变化以及许多其他惊的效果。


    这种语言非常容易掌握和学习。它还让你能够控制 HTML 文档的呈现方式。通常情况下，CSS 会与标记语言 XHTML 和 HTML 结合使用。


    CSS 允许你最大限度地利用可用时间。通过这种语言，你只需要编写一次代码就可以反复重复使用它。你可以将同一张样式表用于不同的 HTML 页面。此外，你可以为每个
    HTML 元素定义一种样式，然后将其应用于多个 Web 页面。


    CSS 使得页面加载更快。你不再需要一直编写 HTML 标签属性。你只需要为一个标签简单编写一条 CSS 规则，然后将其应用于它的其他出现处。代码越少，下载时间就越快。


    CSS 使得维护更加容易。如果你想进行重大更改，你只需要更改样式即可。你 Web 页面中的元素将自动更新。


    CSS 的样式比 HTML 好得多。它也有更多属性。因此，与使用 HTML 属性相比，你可以让你的 HTML 页面看起来更好。


    CSS 允许内容在多种类型的设备上显示。因此，无论你使用什么电子设备，都可以在其中查看 Web 。你可以使用相同的 HTML 文档在手机设备（包括手机和平
    PDA）上显示不同的网站版本，然后将其打印出来。


    建议使用 CSS 代替 HTML 属性。如果你希望 Web 页面与未来的浏览器兼容，必须在每个 HTML 页面中使用 CSS。


    关于离线浏览，你可以依靠 CSS 在本地存储 Web 应用程序。它可以这样做是因为有离线缓存。它允许你查看离线网站。这种缓存还确保了网站加载更快并具有更好的整体性能。


    此外，CSS 提供了平台独立性。它还支持目前最新的浏览器。


    # 常见问题 (FAQ)


    CSS 是针对特定问题或困难的解决方案吗？

    是的，CSS 实际上是一个巨大问题的解决方案。HTML 之初并不是为了用于 Web 页面格式化的标签。它仅仅被设计用于描述其内容。考虑以下示例：


    ```

    <h1>这是一个标题的示例</h1>

    <p>这是一个段落的示例</p>

    ```


    当颜色颜色属性和标签成为 HTML 3.2 的新增内容时，Web 开发者遇到了许多问题。开发在每个页面中都包含颜色和字体信息的巨型网站变成了一个昂贵且乏味的过程。由于这个问题，世界维网联盟联盟（W3C）开发了
    CSS。CSS 的开发对 Web 开发者来说是一个巨大的解脱，因为它从 HTML 页面中去除了样式格式。


    # CSS 是否节省了大量工作？


    是的，的。样式定义通常保存在外部的 .css 文件中。这个外部样式表允许你仅通过更改一个文件来更改整个网站的外观。


    # 谁创建了 CSS？


    Håkon Wium Lie 在 1994 年 10 月 10 日首次提出了 CSS 语言。当时，Lie 在欧洲核研究组织（CERN）与 Tim Berners-Lee
    一起工作。其他几种样式表语言也被提用于 Web。在讨论公共邮件列表时，关于 CSS 的第一个建议是由维网联盟在 1996 年做出的。Bert Bos 的提案特别有影响力，这就是为什么他也被认为是
    CSS 的共同创建者。


    # 谁维护 CSS？


    世界维网联盟内部的一小组个人（被称为 CSS 工作组）维护 CSS。他们还创建规范，即文档。这些规范一旦被世界维网联盟的成员讨论并批准，就会成为建议。


    # 为什么批准的规范被称为建议？


    之所以这样，是因为世界维网联盟不再控制 CSS 的实现。独立的组织和公司创建软件。世界维网联盟是一个就互联网如何演进以及如何工作提出建议的团体。


    # MICHEAL Knapp


    ## HTML 版本


    ### 历史与版本


    正如你所知，HTML 是一种不断演变的计算机语言。因此，你不能期望它长期不变。创建修订后的规范和标准是为了适应用户不断变化的需求和要求。


    ### HTML 1.0


    这是向公众发布的第一个 HTML 版本。但在其发布期间，并没有很多人喜欢创建网站。因此，这个版本的计算机语言是有局限性的。当时的用户只能在互联网上放置一些简单的文本。


    ### HTML 2.0


    它是 HTML 1.0 的改进版本。它拥有前一个版本的所有功能，并增加了新功能。它是 20 世纪 90 年代网站设计的标准，因为它定义了许多核心功能。


    ### HTML 3.0


    当向公众发布时，更多的人已经在编程和 Web 开发。更多的人已经熟悉 HTML 并希望使用它来创建网站。网站管理员对创建网站有了更多。他们希望他们的网站看起来更吸引人且友好。


