    # The Base Path


    Keep in mind that you do not have to provide the complete URL for all the links
    you use for every time you link an HTML document to the same website. In fact,
    you may just eliminate it altogether if you go for the tag <base> in the header
    of the HTML document.


    This tag gives the base path for each one of the links. Thus the browser you use
    will simply concatenate the relative path towards the base path and produce the
    complete URL.


