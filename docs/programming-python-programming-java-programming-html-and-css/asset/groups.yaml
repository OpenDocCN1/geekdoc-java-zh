  mdcn: "\n适用于你的窗口。你可以在可读的元素 `<body>` 上使用 `background-color` 属性。如果你想让文本更具可读性，可以使用\
    \ `padding` 将其与框的边缘隔开。\n\n# 颜色基础\n\n你在电脑屏幕上看到的所有颜色都是通过红、绿、蓝颜色组合而成的。如果你想寻找特定的颜色，可以使用取色器。像\
    \ Photoshop 图像编辑程序就拥有这些工具。\n\n本质上，你的电脑显示器是由称为像素（pixels）的小型正方形组成的。这些像素肉眼可见，但你必须非常仔细地观察屏幕。\n\
    \n当你的电脑关闭时，你只能看到一片漆黑，因为没有光。一旦你开启它，你就能看到不同颜色的像素。这些像素形成了图像和文本。\n\n# RGB 值\n\n用于表示红、绿、蓝的值范围从\
    \ 0 到 255。\n\n# 颜色名称\n\n预定义的名称代表颜色，尽管这些名称是有限的。\n\n# 进制代码\n\n十六进制代码也用于表示红、绿、蓝的值。\n\
    \n# 色相 (Hue)\n\n它接近对颜色的口语印象。\n\n# 亮度 (Brightness)\n\n也称为值（value），它指的是特定颜色中黑色的含量。在亮度最低时，颜色倾向于非常暗。在亮度最高时，颜色不包含任何黑色。\n\
    \n# 饱和度 (Saturation)\n\n它指的是特定颜色中灰色的含量。在饱和度最低时，颜色大部分是灰色。在饱和度最高时，颜色不包含任何灰色。\n\n\
    这是一个示例程序：\n\n```\n<!DOCTYPE html>\n<html\n<head>\n<style>\nbody {\ncolor: blue;\n\
    }\nh1 {\ncolor: green;\n}\n</style>\n</head>\n<body>\n<h1>This is an example of\
    \ a heading </h1>\n<p>This is a sample text. It is blue because the default color\
    \ is blue. If you wish to change the color, you have to edit the body selector.</p>\n\
    </body>\n</html>\n```\n\n当你运行它时，你将得到以下输出：\n\n# 这是一个标题示例\n\n这是一个示例文本。它是蓝色的，因为默认颜色是蓝色。如果你想更改颜色，你必须编辑\
    \ body 选择器。\n\n# HTML & CSS\n\n# 相关元素\n\n不要忘记指定对比度和透明度。\n\n# 对比度 (Contrast)\n\n\
    在选择背景和前景颜色时，确保文本有足够的对比度以保持易于阅读。\n\n# 高对比度 (High Contrast)\n\n如果背景色和前景颜色之间有高对比度，文本将变得更容易阅读。然而，你不应该使用过高的对比度，因为可能会导致文本难以阅读。\n\
    \n# 中对比度 (Medium Contrast)\n\n当你降低对比度时，可以提高文本的可读性。这在你有长文本时特别理想。你可以使用白色背景配深灰色文本，或深色背景配米白色文本来降低对比度。\n\
    \n# 低对比度 (Low Contrast)\n\n如果背景色和前景颜色之间的对比度低，文本将变得难以阅读。缺乏对比度是色盲和视觉障碍人士的常见问题。如果你在户外阳光反射在屏幕上，也会让在手持设备上的阅读变得困难。如果你使用低质量显示器，也会遇到同样的问题。\n\
    \n# 透明度 (Opacity)\n\n此属性允许你指定元素及其子元素的透明度。你可以选择从 0.0 到 1.0 之间的任何值。例如，如果你想要 15%\
    \ 的透明度，你必须选择 0.15。\n\n# 第 9 章：\nCSS 文本\n\n# 字体 (Typeface)\n\n通常情况下，有两类属性可以控制文本的显示方式。第一类是直接影响你使用的字体的。它影响字体的外观和字体类型。另一类允许你使用任何想要的字体，并控制文本颜色以及字母与单词之间的间距，并且对你的文本具有相同的效果。\n\
    \n请记住，你拥的文本格式对页面的可读性有巨大影响。\n\n# 字体术语\n\n# 等宽字体 (Monospace)\n\n固定宽度或等宽字体中的所有字母宽度都相同。相反，非等宽字体中的字母宽度各异。\n\
    \n# 字重 (Weight)\n\n字重被分为细（light）、中（medium）、粗（bold）和黑（black）。它们不仅能增加强调，还会影响页面上空白的数量和对比度的程度。\n\
    \n# 伸展 (Stretch)\n\n伸展分为紧凑（condensed）、常规（regular）和扩展（extended）。窄或紧凑字体版本的特点是字母细且相互靠近。扩展字体版本的特点是字母粗且间距较远。\n\
    \n# HTML & CSS\n\n# 样式 (Style)\n\n样式可以是普通（normal）、斜体（italic）或倾斜（oblique）。斜体字体的字母具有草写感，而倾斜字体则是将普通样式以角度形式呈现。\n\
    \n# 选择字体\n\n在选择字体时，你必须考虑你的浏览器。记住，只有当字体安装在计算机中时，它才会显示该字体。\n\n正因如此，大多数网站都选择电脑上常用的一小组字体。尽管如此，如果你想绕过这种限制，可以使用某些技术。\n\
    \n你可以指定多个字体并产生一个优先级顺序。这被称为字体栈（font stack）。建议在选择了特定字体后，包含你喜欢的字体的通用名称。\n\n# 无衬线字体\
    \ (Sans-Serif)\n\n这些字体的特点是末端平且设计非常简洁。\n\n# 衬线字体 (Serif)\n\n这些字体在主笔画末端有额外的细节。这些细节被称为衬线（serif）。\n\
    \n# 幻想字体 (Fantasy)\n\n这些字体具有装饰性，非常适合标题。它们不适合正文。\n\n# 草写字体 (Cursive)\n\n这些字体可能有连接笔画和其他草写特征，如手写风格。\n\
    \n# 更多字体\n\n你可以使用某些技术来获取更多字体。然而，你必须注意字体往往受版权保护。因此，你可以使用的技术通常受到其许可协议的限制。\n\n| Font-Family\
    \ | Font-Face | 基于服务的字体-Face |\n| :--- | :--- | :--- |\n| 你需要在电脑上安装该字体。你可以使用 CSS\
    \ 指定该字体。 | 如果字体没有安装在电脑上，你可以使用 CSS 查找下载位置。 | 通过商业服务可以获得更多字体。 |\n| 你的字体选择是有限的。 |\
    \ 你必须下载字体文件，这会导致网页变慢。 | 你必须支付费用来涵盖购买的。 |\n| 在许可方面没有问题，因为不是你发行字体的。 | 使用字体的许可必须配合\
    \ font-face。 | 服务根据与字体行的合同或协议提供独特的字体选择。 |\n\n你可以使用 PC 或 Mac 设计字体。然而，你应该记住，字体的外观在这些设备上可能不同。如果你使用\
    \ Mac 设计，必须查看字体在 PC 上的显示，因为 PC 渲染通常不平滑。如果你使用 PC 设计，则没有问题，因为它在 Mac 上仍然很好看。\n\n\
    # HTML & CSS\n\n# 属性\n\n如果你想成功编写程序，你必须学习以下某些文本属性：\n\n# 文本对齐 (Text Alignment)\n\
    \n你可以使用 text-align 设置文本的水平对齐。你可以设置为左对齐、右对齐、两端对齐或居中对齐。\n\n这是一个示例：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<style>\nh1 {\n  text -align : center;\n}\nh2 {\n  text\
    \ -align : left;\n}\nh3 {\n  text -align : right;\n}\n</style>\n</head>\n<body>\n\
    <h1> 居中标题示例 </h1>\n<h2> 左对齐标题</h2>\n<h3> 右对齐标题</h3></h3>\n<p> 这三个示例标题显示了三种不同的文本对齐方式。\
    \ </p>\n</body>\n</html>\n```\n\n"
