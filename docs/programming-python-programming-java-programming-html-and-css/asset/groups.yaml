    # Analytics


    # How many people come to your website?


    Once online visitors come to your website, you can begin to analyze how they arrived,
    what they were searching for, and when they are going to leave the website. Google
    Analytics is a very popular tool that webmasters use to figure these things out.


    In order to use it, you need to sign up for an account. You just have to go to
    the Google website and search for analytics. You can also type in www.google.com/analytics
    and start from there. On the website, you will be provided with a tracking code.
    You need to use this tracking code on all the pages of your website.


    Each time an online visitor loads your web page, your tracking code sends out
    data to the servers in which it is kept. Then, Google provides an interface that
    is web-based. You can use it to see how online users use and navigate through
    your website.


    Google Analytics provide the tracking code, which should show up before the closing
    tag. The appearance of web pages is not altered by the tracking code. It does
    not really have any major effect on your website.


