    # The return Statement


    The return statement is different from both the break and continue statements.
    It exits from a method and returns to where the method was called.


    A return statement, like the return statement in other programming languages,
    has two forms: one that returns a value, and one that does not. In order to return
    a value, simply write the value or expression that evaluates the value after the
    return keyword. Here is an example:


    ```

    return answer;

    ```


    Here is an example of a return statement without a value:


    ```

    return;

    ```


    Note: When a return statement is used, the return type of the method should be
    int. If void is declared for a method, the return statement will not work. The
    data type after the return value must also be the same as the one declared as
    a parameter in the method. Otherwise, the program will run'
