    布尔运算符并不是从左到右求值的。就像算术运算符一样，布尔运算符也有运算顺序：


    - 布尔运算符 `not` 先计算。

    - 布尔运算符 `and` 后计算。

    - 布尔运算符 `or` 最后计算。


