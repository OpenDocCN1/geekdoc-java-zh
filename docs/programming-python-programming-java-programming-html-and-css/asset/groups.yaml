    # HTML & CSS


    # Related Elements


    Do not forget to specify the contrast and opacity.


    # Contrast


    See to it that there is sufficient contrast for your text to be legible when you
    choose background and foreground colors.


    # High Contrast


    If there is a high contrast between the background and the foreground colors,
    the text becomes easier to read. However, you should not use too much contrast
    because it can cause the text to be difficult to read.


    # Medium Contrast


    You can improve the readability of a text when you reduce its contrast. This is
    especially ideal if you have long texts. You can use a white background and a
    dark gray text or a dark background and an off white text to reduce the contrast.


    # Low Contrast


    If there is a low contrast between the background and the foreground colors, the
    text becomes more difficult to read. Lack of contrast is a common problem for
    people with color blindness and visual impairments. It also makes reading text
    on handheld devices difficult if you are outdoors and the sunlight reflects on
    your screen. You can also experience the same problem if you are using a low quality
    monitor.


    # Opacity


    This property lets you specify which element opacity and child element you want
