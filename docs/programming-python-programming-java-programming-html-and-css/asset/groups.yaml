    哪些是文字处理器呢？它们包括任何允许你在文档文件中创建表格、给文本加下划线以及其他操作的程序。Microsoft Office、Open Office 和
    Libre Office 都属于此类范畴。由于 Wordpad 本质上是一个文字处理器，你应该避免将其用于此类目的。


    如果你预算有限、刚开始担任 Web 开发人员，或者想先测试一下文本编辑器，可以尝试像 BlueGriffon 和 KompoZer 等免费版本。它们是你可以免费下载的开源
    Web 编辑器。然而，由于对现代 Web 标准的支持过时，KompoZer 可能不再适用于现代 Web 标准。


    如果你有 Dreamweaver 呢？如果你的电脑上安装了它，那么你就不需要获取单独的文本编辑器了。你只需点击菜单栏中的“视图”（View），然后从下拉菜单中选择“代码”（Code），即可切换到代码视图。Dreamweaver
    就会从视觉设计界面切换到文本编辑器界面。


    Dreamweaver 具有内置的文本编辑器，非常适合使用 HTML 写代码的个人。此外，它还提供了允许你检查和修正代码的工具。如果你想在浏览器中预览你的
    Web ，也可以切换到“设计”（Design）视图。此外，Dreamweaver 还允许你使用它的站点同步功能发布 Web 。


    # 开始学习 HTML


    ## 你的第一个网页


    任何事情都有第一次。就像你第一次做的任何事情一样，创建一个网页既让人兴奋又让人感到紧张。你感到兴奋是因为你终于可以独立做一些事情了。你可以从零开始创建一个网站并测试你代码的效率。同时，你也感到紧张，因为你担心代码无法运行或电脑会损坏。


    话虽如此，如果你不迈出这一步，你永远会受困。你也会后悔没有勇气去尝试。所以尽管如此，你现在应该开始创建一个网站了。


    ```

    <!DOCTYPE HTML PUBLIC "- //W3C // DTD HTML 4.01 Transitional //EN"

    "http://www.sampleprogram.com/TR/html4/loose.dtd" >

    <<html>

    <head>

    </head>

    <body>

    <p>

    这是一个不涉及任何网站的示例网页。

    </p>

    </body>

    </html>

    ```


    请注意，上述示例实际上并没有连接到任何网站。www.sampleprogram.com 是并不存在的。给出这个示例仅作为你的指南，让你知道应该如何编写代码。


    无论如何，你可以从这个示例 HTML 页面开始。你必须将其放入文本编辑器中并保存为文件名“sample.html”。你必须将其保存在桌面上。


    # HTML & CSS


    你可能认为这一步并不是必要的，但实际上它是必要的。这个简单的步骤可以帮助你更多地学习使用 HTML 代码创建网站。在学习过程中，你还会学习如何修改代码来改进你的程序。此外，你也会越来越熟悉你的文本编辑器。很快，你就会习惯使用它。


    你输入到文本编辑器中的文本颜色可能会有所不同，取决于你使用的文本编辑器。不同的文本编辑器有不同的颜色。你不必担心这个问题。这些颜色就是 WebMaster和程序员所说的“语法高亮”。你可以直接忽略它，因为它对你的程序没有产生重大影响。


    要保存文件，你只需点击菜单中的“文件”（File），然后点击子菜单中的“保存”（Save）。当系统提示你输入文件名时，你必须在文件中选择正确的文件夹进行保存。在这种情况下，你必须将文件保存在桌面上，以便将来方便、快速地查看和参考。输入“sample.html”。


    你从上一章中了解到，记事本并不是一种推荐的文本编辑器。所以，你不应该使用记事本处理这段代码。如果你使用记事本，它只会将文件名改为“sample.txt”，你将无法得到想要的输出。


    即使你可以重命名它，使用适当的文本编辑器仍然好得多。特别是当你处理……时。


