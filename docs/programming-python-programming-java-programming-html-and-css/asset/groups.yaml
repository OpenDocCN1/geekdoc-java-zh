    HTML 为特色。请记住，使用 HTML 手写代码页面并不是制作网站最简单的方法。实际上，它是创建网站效率最低且速度最慢的方法。根据你的喜好，它甚至可能是最枯燥的。


    所以，如果你只是想有一个网站，你应该考虑使用可视化编辑器。可视化编辑器，通常也被统称为 WYSIWYG 编辑器，是一种计算机程序，它让你在几乎或完全没有技术知识的情况下设计网站。WYSIWYG
    的意思是“所见即所得”（What You See Is What You Get）。基本上，你看到的就是你实际得到的。


