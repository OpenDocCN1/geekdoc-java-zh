    \n此外，你不需要任何花哨或昂贵的设备。你可以使用文本编辑器和 Web 浏览器创建一个漂亮的网站——这两个都已经安装在电脑中了。不过，如果你想找另一个文本编辑器或浏览器，可以从网上下载。你有很多选择。\n\
