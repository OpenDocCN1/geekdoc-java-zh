    # The Target Attribute


    It is used for the purpose of specifying the location in which the linked document
    gets opened. As the programmer, you can use the following:


    | Options | Descriptions |

    | frame name | It loads your linked document on a frame that has a customized
    name. |

    | _blank | It opens your linked document on another tab or window. |

    | _parent | It opens your linked document in your parent frame. |

    | _self | It opens your linked document within the same frame. |

    | _top | It opens your linked document at the top level frameset or the entire
    browser window, regardless of the number of nested levels in the current frame.
    |


    To help you learn more about these target attributes, here is a sample program
    that contains the different types:'
