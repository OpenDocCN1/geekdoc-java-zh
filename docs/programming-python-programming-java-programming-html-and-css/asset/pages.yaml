- pgno: 233
  md: '# Whitespaces


    You have read about whitespaces from a previous chapter. In this part of this
    book, you will learn more about it. First of all, a whitespace or an extra space
    is used by webmasters or programmers to add an extra space to a line or start
    a new element.


    When your browser sees two spaces or more are next to each other, it will merely
    display a single space. Likewise, if it sees a line break, it merely considers
    it a single space. This is referred to as white space collapsing.


    Webmasters and programmers generally take advantage of this when indenting their
    code and making it easier to read. It is just more organized to see a program
    that is not cluttered with sentences. You can use as many spaces as necessary
    between the words, or even press Enter to go to a new line, and your output will
    stay the same.


    Take a look at the following example:


    ```

    < p > The girl that has no name slain the sons of Walden Frey and fed them to
    him. < </p>

    ```


    ```

    < p > The girl that has no name slain the sons of Walden Frey and fed them to
    him.< </p>

    ```


    ```

    < p > The girl that has no name slain the sons of Walden Frey and fed them to
    him. < </p>

    ```


    The output of the above given example should look like this:


    The girl that has no name slain the sons of Walden Frey and fed them to him.


    The girl that has no name slain the sons of Walden Frey and fed them to him.

    The girl that has no name slain the sons of Walden Frey and'
