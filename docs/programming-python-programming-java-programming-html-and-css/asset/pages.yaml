    eliminated, although you might still find some, but they are the terms that you
    will likely (almost always) encounter when creating your codes. You will find
    no such trouble in understanding the terms, and how to do it properly. Samples
    are provided for you, and explanations are also presented so you won''t get lost
    and still have fun while learning.


