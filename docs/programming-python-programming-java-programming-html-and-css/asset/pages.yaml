    # Click to send an email


    When a user clicks on the link, an email client will be launched. It can be Outlook
    Express, Lotus Notes, etc. However, if the user does not have any email client
    installed on his computer, he will not be able to send an email using this link.


    # Default Settings


    If you want to have a default email body and email subject with an email address,
    you can use the following example as a guide:


    ```

    <a href="mailto:sampleprogram.com?subject=Feedback&body=Message">

    Click to send feedback

    </a>

