- pgno: 229
  md: '# CHAPTER 5:

    HTML TEXT


    # Markup


    When you create a web page, you have to add tags, which are referred to as markups
    to the content of your page. They give additional information as well as allow
    the browsers to display the correct structure of the page.


    In general, there are two types of markups: structural and semantic. Structural
    markup refers to the elements that you use to identify the paragraphs and the
    headings. Semantic markup, on the other hand, provides addition information, such
    as meanings of acronyms, quoted sentences, and emphasis on sentences among others.


    # Headings


    In essence, there are six levels of headings used in HTML.


    ```

    <h1>

    <h2>

    <h3>

    <h4>

    <h5>

    <h6>

    ```


    The first heading <h1> is meant for the main heading. The second heading <h2>
    is meant for the subheading. If you have more sections under your subheading,
    you have to use the third heading <h3>, the fourth heading <h4>, and so on.


    Web browsers usually show the contents of headings in various sizes. For instance,
    the contents of the first heading <h1> have the largest size while the contents
    of the sixth heading <h6> have the smallest size. Then again, the sizes'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# HTML & CSS


