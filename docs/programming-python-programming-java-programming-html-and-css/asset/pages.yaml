  md: '# JAVA PROGRAMMING


    The division operator in Java actually means two different things. It can either
    be real division for real numbers, or integer division for integers. This is not
    really a problem in most cases although it may lead to varying results.


    ```

    double a;

    a = 1/9;           // the result of a will be 0.0

    a = 1.0 / 9.0;     // the result of a will be 0.111...

    ```


    The first operation performed integer division, hence the result of 0. If you
    want to get the exact quotient of 1 and 9, you need to express 1 and 9 as real
    values so that the division becomes real division.


    It is possible in java to assign a real value to an integer variable. The value
    is automatically converted to the corresponding type. This is called typecasting.


    Java supports type conversion (typecasting) but does not perform the conversions
    automatically. The programmer is required to indicate where and what conversions
    must be made by writing the desired type in parentheses before the expression.


    ```

    double a;

    int b;

    b = (int) (a * 12.3223122);

    ```


    Of course, it is possible to assign an integer value to a real variable without
    typecasting. It is not necessary to cast as so long as the conversion can be performed
    without the loss of any information.


    Java is an object-oriented programming language, so the terms that we will use
    are a little different compared to the terms used in structural programming languages.


    Functions, sub-routines, and procedures in Java are called'
