  md: '# # CHAPTER 1:

    WELCOME TO THE

    WORLD OF THE PYTHON


    Python is an interactive, general-purpose, object-oriented, and high-level programming
    language. You need to follow the correct syntax for the command or task that you
    want to do in order to yield the output that you want to see. It is not difficult
    to learn the Python programming language, even a novice programmer will be able
    to learn it immediately, but it helps if you have a basic understanding of the
    terminologies used in computer programming. If you have prior experience in working
    with other programming language, then you won''t have any trouble understanding
    how the program should flow.


    Basically, you can create a flowchart that fits all programming languages. You
    only need to get yourself familiar with the syntax of each language so your program
    will understand what you want it to do and achieve what you want to achieve. If
    you know a particular programming language, then it would be easy for you to understand
    how Python should work. A basic understanding of any programming language will
    definitely help a lot when you begin your Python programming lessons.


    Python has different versions, and for this tutorial you need to use the Python
    2.7, which you can download for free here; http://www.python.org/


    # ## Why Python?


    Python is especially created to be highly readable. It uses plain English words
    most of the time, and has lesser syntactical constructions as compared to other
    programming languages.'
