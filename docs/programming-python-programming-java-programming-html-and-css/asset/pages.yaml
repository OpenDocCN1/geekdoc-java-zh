    # Frequently Asked Questions (FAQ)


    Was CSS a solution to a particular issue or problem?

    Yes, CSS was actually a solution to a huge problem. HTML

    was not really meant to feature tags for Web page

    formatting. It was merely designed to describe its content.

    Consider the following examples:


    ```

    < h1 > This is an example of a heading /h1 >n< p > This is an example of a paragraph
    </p>

    ```


    The moment color attributes and tags became additions to

    HTML 3.2, Web developers experienced a lot of problems.

    The development of huge websites in which color and font

    information were included at every page became an

    expensive and tedious process. Because of this issue, the

    World Wide Web Consortium developed CSS. Its'
