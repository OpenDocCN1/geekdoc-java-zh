  md: 'If you will run the code above, you should get this result:


    ![](img/eccbd9391552cc11c5e52875ba42510a_17_0.png)


    # A Glimpse at Whitespace


    Whites is important in Python programming. You need to be careful when using whitespace.
    It is used to structure the code of Python program. If you should indent your
    code, then you need to indent it by four spaces, or wise you will get this error
    message:


    ```

    Traceback (most recent call last):

    File "string", line 1, in <module>

    File "/usr/lib/python2.7/py_compile.py", line 117, in compile

    raise py_exc

    py_compile PyCompileErrors: Sorry: IndentationError:

    unexpected indent (prog.py, line 2)

    ```


    The error is highlighted for you. It says, “Indentation error”. The programmer
    indented the statement in line 2 by one space, it should be four.


    You will learn more about the importance of whitespace when you begin structuring
    your program. For now, it is enough that you have an idea about whitespace.'
