    # All About Dictionaries


    Dictionaries are similar to the dictionary that contains definition of words.
    In a dictionary, you have words, and each of them has corresponding definition.
    In Python, the word you need to find the definition is known as a ''key'', and
    the definition is known as a ''value''. You won''t find numbered values in a dictionary,
    the same goes with the key. You are allowed to add, remove, and modify the values
    that you need to include in the dictionaries. A good example is the telephone
    or address book.


    # Dictionary Sample


    Lists and tuples give you the value or content of a certain index by accessing
    the index number. Dictionaries, on the other hand, can give you the number that
    you need to know based on the name – the opposite of lists and tuples. You need
    to use dictionaries if you need to store the numbers of the different contact
    persons, just like a phone book.


    When you begin creating your dictionary you will see that it is similar to making
    a list or tuple. A list uses parentheses ( ) with the values in or inside the
    parentheses. A tuple uses brackets [ ] with the values in between. A dictionary
    uses curly braces { }.


    This is how you make a dictionary (the example is a phone book):


    ```

    phone={''Catherine Becket'':7895675, ''Anthony Clarke'':1234523,

    ''Linda Jones'':8875689, ''Andy Bower'':7564438, ''Davey Lewis'':56656789}

    ```


    If you want to print Catherine''s number:


    ```

    print phone[''Catherine Becket'']

