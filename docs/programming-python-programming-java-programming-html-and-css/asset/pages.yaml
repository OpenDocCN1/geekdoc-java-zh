    be tasked to maintain the program. There are also times when the comment must
    appear as part of the program that the user will also see. It serves as a reminder
    or a guide for the user.


    The above example is a single line comment. If you try to print it, you will see
    a single line comment. No matter how long the message might be, it will only print
    in single line.


    # Multi-line Comments


    Hash sign (#) will yield a single line comment no matter long it might be (it
    gets truncated if it doesn''t fit the screen anymore). You can create a multi-line
    comment using the ''#'' sign, but it can be a pain. You need to start each line
    with ''#'' to create another line each time you create another line statement
    in your program.


    Instead, you can use a block of triple quotations like this: """ The single comment
    above can look like this:


    ```

    All comments have hash sign at the beginning, the program will not execute it

    ```


    The programmer used the triple quotations to create the multi-line comment.


    # Python Variables


    A program is never without variables (except if all it needs to do is print something).
    Games, apps, or search engines creation requires you to work with different types
    of data. A variable serves as a home for a piece of data, and like home it should
    have have an address or more specifically, a name. You should name your variable
    so you will know where to retrieve a certain data that a section of the program
    needs.'
