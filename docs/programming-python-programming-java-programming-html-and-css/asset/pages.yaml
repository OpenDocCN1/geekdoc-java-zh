- pgno: 284
  md: '# HTML & CSS


    # Related Elements


    Do not forget to specify the contrast and opacity.


    # Contrast


    See to it that there is sufficient contrast for your text to be legible when you
    choose background and foreground colors.


    # High Contrast


    If there is a high contrast between the background and the foreground colors,
    the text becomes easier to read. However, you should not use too much contrast
    because it can cause the text to be difficult to read.


    # Medium Contrast


    You can improve the readability of a text when you reduce its contrast. This is
    especially ideal if you have long texts. You can use a white background and a
    dark gray text or a dark background and an off white text to reduce the contrast.


    # Low Contrast


    If there is a low contrast between the background and the foreground colors, the
    text becomes more difficult to read. Lack of contrast is a common problem for
    people with color blindness and visual impairments. It also makes reading text
    on handheld devices difficult if you are outdoors and the sunlight reflects on
    your screen. You can also experience the same problem if you are using a low quality
    monitor.


    # Opacity


    This property lets you specify which element opacity and child element you want
    to have. You can choose any value from 0.0 to 1.0. For example, if you want to
    have 15% opacity, you have to choose 0.15.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# CHAPTER 9:

    CSS TEXT


    # Typeface


    In general, there are two classifications of properties that let you control how
    your text appears. First, there is the one that has a direct effect on the font
    that you use. It affects its appearance and typeface. Then, there is the one that
    lets you use whatever font you want as well as control the text color and spacing
    between the letters and words, and still has the same effect on your text.


    Keep in mind that the text formatting that you have can have a huge effect on
    the readability of your pages.


    # Typeface Terminology


    # Monospace


    All the letters in a fixed-width or monospace font have the same width. The letters
    in a non-monospace font, on the other hand, have varying widths.


    # Weight


    The weight of fonts is classified into light, medium, bold, and black. They do
    not only add emphasis. They also affect the number of whitespaces and amount of
    contrast on the page.


    # Stretch


    The stretch is classified into condensed, regular, and extended. Narrow or condensed
    font versions feature thin letters that are close to each other. Expanded font
    versions have thicker letters that are far from each other.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# HTML & CSS


    # Style


    Style can be normal, italic, or oblique. An italic font has a cursive aspect to
    its lettering while an oblique font puts the normal style on an angle.


    # Selecting a Typeface


    When it comes to selecting a typeface, you have to take your browser into consideration.
    Remember that it will only display the typeface if it is installed in the computer.


    Because of this, most websites go for small sets of typefaces that are commonly
    installed on computers. Nevertheless, there are certain techniques you can use
    if you wish to bypass such limitation.


    You can specify several typefaces and produce an order of preference. This is
    known as the font stack. It is recommended that you include the generic name of
    the font that you like after selecting a particular typeface.


    # Sans-Serif


    These fonts feature straight ends and a very clean design.


    # Serif


    These fonts feature additional details at the ends of the primary letter strokes.
    Such details are called serifs.


    # Fantasy


    These fonts are decorative and ideal for titles. They are not ideal for bodies
    of text.


    # Cursive


    These fonts may have joining strokes and other cursive characteristics like handwriting
    styles.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# More Selections of Typefaces


    You can use certain techniques to obtain more fonts. However, you have to take
    note that typefaces tend to be copyrighted. Thus, the techniques you can use are
    often limited by their licenses.


    | Font-Family | Font-Face | Service-Based Font-Face |

    | You need to have the typeface installed on your computer. You can use your CSS
    to specific this typeface. | If the font is not installed on your computer, you
    can use CSS to find out where you can download it. | You can gain access to more
    fonts by using commercial services. |

    | Your choices of typefaces are limited. | You have to download your font file,
    causing your web page to slow down. | You have to pay fees in order to cover the
    licenses that are purchased from the font foundries. |

    | aren''t any issues with regard to licensing because it is not who distributes
    the typeface. | The license for using the font has to permit distribution with
    the use of font-face. | Service deals with issues associated with the individuals
    who created the font. |

    | The choice of typefaces is limited due to the fact that the fonts have to be
    installed on the computer. | The choice is limited due to the fact that only a
    few typefaces can be distributed freely. | Every service offers a unique choice
    of fonts depending on their contract or agreement with the font foundries. |


    You can use a PC or a Mac to design typefaces. However, you should keep in mind
    that the appearance of the typeface can appear differently on these devices. If
    you design using a Mac, you have to look at how the typefaces appear on a PC since
    it tends to render less smoothly. If you design using a PC, you have no problem
    because it would still look good on a Mac.'
  merge: -1
  img_proc: true
