- pgno: 102
  md: '# CHAPTER 1:

    BASICS OF JAVA


    # Compiling and running a Java Program


    Every source file in Java contains exactly one class. The filename must be the
    same as the class name. For example, a class Hello should be stored in the source
    file Hello.java. Using the javac compiler, the source file Hello.java can be compiled
    in the terminal:


    ```

    javac Hello.java

    ```


    This will result in a file with the same name as the source file but a different
    file extension; the .class extension. The class file now contains the byte code.
    This means that it cannot be executed immediately. It needs a Java Virtual Machine
    or byte code interpreter:


    ```

    java Hello

    ```


    The command above loads and executes the Hello class and its main method. If the
    class contains extensions from other classes (to be discussed further on the following
    chapters), these classes are loaded automatically when needed. If you have a source
    file which extends several other source files, you can compile all of them using:


    ```

    javac *.java

    ```


    Assuming that all files are in the same folder, each source file will load and
    execute its corresponding class file.


    # Declarations and Expressions'
