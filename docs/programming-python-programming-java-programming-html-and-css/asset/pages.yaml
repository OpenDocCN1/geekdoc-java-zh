- pgno: 280
  md: '# HTML & CSS


    # CHAPTER 8:

    CSS COLOR


    # Fundamentals


    You can easily make your pages brighter and livelier by using good colors and
    color combinations. Then again, you have to know how to specify them. You also
    have to be familiar with the color terminologies. See to it that you use background
    colors and contrast to your advantage.


    # Foreground Color


    You can specify text colors within elements through the color property. In fact,
    you can specify colors using RGB values, color names, and hex codes.


    RGB values express colors according to the amount of red, green, and blue they
    contain. RGB basically stands for red, green, and blue. Color names are the names
    of the colors that humans and browsers easily recognize. Hex codes refer to the
    six-digit codes representing the amount of red, green, and blue a color has. A
    hash or pound sign (#) comes before it.


    # Background Color


    Every HTML element is treated by CSS as it is shown inside a box. Background-color
    sets which color is used for the background of this box. Just like with foreground
    colors, you can specify which colors you want by using RGB values, color names,
    and hex codes.


    What happens if you do not specify any background color? Your background will
    be transparent unless you choose a particular color for it.


    By default, a white background is used on browser windows. Nevertheless, you are
    free to set a specific background color'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'for your windows. You can use the property background-color on the readable
    element <body>. If you want to make your text more readable, you can separate
    it from the edge of the box through the use of padding.


    # Color Basics


    All the colors you see on your computer screen are created by combining the colors
    red, green, and blue. If you want to search for a particular color, you can use
    color pickers. Image editing programs such as Photoshop feature these tools.


    In essence, your computer monitor is composed of very small squares known as pixels.
    These pixels can be seen by the naked eye, but you have to look very closely at
    your screen.


    When your computer is turned off, you only see the blackness because there is
    no light present. Once you turn it on, you will be able to see the pixels that
    are of different colors. These pixels create images and texts.


    # RGB Values


    The values used to represent red, green, and blue range from 0 to 255.


    # Color Names


    Predefined names represent colors, although they are limited.


    # Hex Codes


    Hexadecimal codes are also used for the values that represent red, green, and
    blue.


    # Hue


    It is near the colloquial impression of color.


    # Brightness


    Also referred to as value, it refers to the amount of black present in a particular
    color. The color tends to be very dark'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# HTML & CSS


    at minimum brightness. The color does not contain any black

    at maximum brightness.


    # Saturation


    It refers to how much gray is present in a particular color.

    The color is mostly gray at minimum saturation. The color

    does not contain any gray at maximum saturation.


    Here is a sample program:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <style>

    body {

    color: blue;

    }

    h1 {

    color: green;

    }

    </style>

    </head>

    <body>

    <h1>This is an example of a heading </h1>

    <p>This is a sample text. It is blue because the default color is

    blue. If you wish to change the color, you have to edit the body

    selector.</p>

    </body>

    </html>

    ```'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'When you run it, you would get the following output:


    # # This is an example of a heading


    This is a sample text. It is blue because the default color is blue. If you wish
    to change the color, you have to edit the body selector.'
