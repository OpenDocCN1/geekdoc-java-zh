  md: '# INTRODUCTION


    The world of programming is a very diverse one where each programming language
    has its own specific advantages. There are languages such as C and Assembly which
    focus on operating system instructions and other computer software guides while
    there are other languages such as HTML and JavaScript which focus on web-based
    applications. An example of a programming language that can do both is Java. This
    eBook contains guides and instructions that will help you learn and understand
    java in one day.


    # So what Is Java?


    Java is actually a decent programming language developed at Sun Microsystems.
    It was originally used for Internet applications or applets. Those applets are
    embedded on web pages and run in the browser. Java uses a special format known
    as byte code instead of an ordinary machine code. With the help of a Java interpreter
    program, the byte code can be executed on any computer. This Java interpreter
    program is called a Java Virtual Machine or JVM. It is available today in most
    computer systems. Java may use byte format but there is nothing about Java that
    requires this byte code technique. There are some compilers that exist and generate
    real machine code, or more commonly known as native code.


    Java programs consist of sets of classes. The source files of those programs are
    written in .java. These source files are'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# JAVA PROGRAMMING


    then compiled into .class files which contain the byte code instead of the CPU-specific
    machine code. The .class files are then executed by a Java Virtual Machine (JVM
    or interpreter) at run time.


    Java is not limited to Internet applications. It is technically a complete general
    object-oriented programming language which can be used to develop all sorts of
    applications. The syntax of Java is very much similar to the syntax of C++ but
    removes its error-prone features and complications.


    Do not mistake Java for JavaScript. JavaScript is an entirely different programming
    language. JavaScript is an as one of the three essential components of a webpage
    or website content production. The difference between Java and JavaScript is that
    Java is an object-oriented programming language while JavaScript is an object-oriented-scripting
    language. Codes written in Java need to be compiled while the codes written in
    JavaScript are all in text. Java creates applications that can run in both a virtual
    machine and a browser while JavaScript can only run on a browser. Each language
    also requires different sets of plug-ins.


    Sun Microsystems, the company behind the creation of Java, offer free tools for
    developing Java-based software. If you want to know more about those tools, you
    can visit this website (https://www.java.sun.com) for more information such as
    Java compilers for different computer systems (UNIX, Microsoft Windows, OSX) along
    with detailed document-ation. Java compilers are free and can be down-loaded from
    the given link.'
  merge: -1
  img_proc: true
