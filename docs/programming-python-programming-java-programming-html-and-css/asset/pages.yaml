    especially if you want to easily change the values on the list to suit your needs.


    A list can be defined in the same manner as you would a tuple. If you have five
    dogs named Tad, Snoopy, Doug, Chase, and Madoka and you want to put them in a
    list, then you need to write it like this:


    ```

    dogs = [''Tad'', ''Snoopy'', ''Doug'', ''Chase'', ''Madoka'']

    ```


