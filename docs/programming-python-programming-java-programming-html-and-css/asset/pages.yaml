    # Bits of Python History


    Guido van Rossum developed Python during the late 1980s and early 1990s at the
    National Research Institute for Mathematics and Computer Science, which is located
    in the Netherlands.


    He derived Python from many other languages, including C, C++, ABC, Modula-3,
    SmallTalk, Algol-68, and Unix shell as well as other scripting languages. Until
    now, Python had several updates and versions to enhance user experience and meet
    or satisfy the continuously changing needs of users as time goes by.


    Although there are several versions of Python, the programmer only needs to update
    the syntax from the old version so they can use the latest version.


    Python is currently being maintained by a core development team at National Research
    Institute for Mathematics and Computer Science. Guido van Rossum directs its progress,
    a vital role that only he can fulfill.


    Python is available in different platforms. Users only need to choose the binary
    code that is applicable for their chosen platform and download it to install Python.
    There are also available online python interpreter that you can use as you take
