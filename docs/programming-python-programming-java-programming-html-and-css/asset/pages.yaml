  md: '# Image Links


    Texts are great for creating hypertext links and images are useful for web pages.
    In HTML, you can get the best of both worlds. You can use images as your hyperlinks.
    The process is simple and easy. You just have to put an image within the hyperlink.


    You can use images, icons, or graphics. Just make sure that you do not violate
    any copyright rules. As much as possible, you should use your own images. If you
    cannot produce one, you can use free images from the Internet.


    # Putting HTML Images on Web Pages


    The command used to put images on a web page is constant. You have to use the
    same format each time you want to do this. As a programmer, you may want to put
    your images in the subdirectory "images". Here is the format that you have to
    use to place an image on your web page:


    ```

    <img src="image.png" alt="some texts" width = 30 height = 30>

    ```


    Of course, the above given example is only a guideline. You can modify it depending
    on your file name and preferences for width and height.


    # The Image Element Parameters


    The following are the image element parameters that you have to keep in mind:


    img. It stands for image. Also, it tells the web browser that an image would be
    shown on the web page. The image would appear on the exact place you put it in
    your image tag.


    <image name.<suffix>. The image name can be anything you want while the suffix
    can be any of the allowed image formats: .gif, .png, .jpg, .jpeg, and .bmp. For
    example:'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# HTML & CSS


    sampleimage.png, imagetest.gif.


    src. It stands for source. It is an attribute or a command within a command. It
    tells the web browser where it has to go to locate the image. Take note that it
    would be much easier to use a subdirectory named as “images” to search for your
    images in random locations. By putting all your images in this subdirectory, you
    can simply call for them by using a subdirectory name such as /images/sampleimage.jpeg.


    In addition, you can direct your source to another place on the Internet. For
    example, if you are using an image hosting website, you have to use the complete
    URL of your image such as in the following example: http://www.imagehostingwebsite.com/youraccount/image.jpg.


    alt. It stands for alternate text. It tells the web browser that if it cannot
    locate the image, it can display a particular text. In addition, it informs visitors
    who cannot see the image what it is about. It shows up when the mouse is hovered
    over the image.


    <description text>. It is where you place the text that describes the image. It
    is found within the body of the program.


    height. It stands for the height of the image measured by pixels. You can define
    any height you want, but it has to be smaller than that of your web browser.


    width. It stands for the width of the image measured by pixels. You can define
    any width you want, but it has to be smaller than that of your web browser.


    # Image Formats


    The following are the image formats that you can use for'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# MICHEAL KNAPP


    your image links:


    .png. It is pronounced as ping and stands for Portable Network Graphic. It has
    partial transparency options. However, there are still browsers that do not display
    files that have this suffix.


    .gif. It is pronounced as jif and stands for Graphics Interchange Format. It is
    a simple format that features a series of colored pixels or picture elements to
    form a picture. It is easily read by web browsers. It uses compression, but only
    when it is first made into such format.


    .jpg or jpeg. It is pronounced as j-peg. The reason why there are two names for
    this format is because MAC and PC formats allow three and four letters after the
    dot. It stands for Joint Photographic Experts Group, which is the organization
    that developed it. This format is one of a kind because uses compression throughout
    its lifetime.


    When your computer does not use an image in this format, it simply folds and stores
    it away. For instance, a certain picture can be shown at 10k bytes but stored
    at only 4k bytes. This is a great space saving technique. You get to save on valuable
    hard drive space. However, you also need more memory to unfold such image.


    .bmp. It is pronounced as bimp and stands for bitmap. Bitmaps are images that
    computers produce and place for users. Although it is not likely for programmers
    to use bitmap for their images, some web browsers still allow it.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Frequently Asked Questions (FAQs)


    Is .gif really pronounced with a soft G?


    Yes, it is. You may argue that it could be otherwise since the Oxford English
    Dictionary accepts both hard and soft G pronunciations. Also, the letter G stands
    for the word ''graphic'', which is obviously pronounced with a hard G. So, why
    should it be ''gif''?


    The pronunciation of this popular image format has been a cause of debate for
    years. A little while ago, however, its creator, Steve Wilhite, set the record
    straight and said that the correct pronunciation is ''gif'', with a soft G. The
    man who made .gif already said that it is ''gif'', so you should just accept it
    as is.


    What about if you still cannot accept it? You have been used to using it with
    a hard G?


    Well, you have to know about the rules of the pronunciation of the letter G. In
    essence, if the letter G is followed by a letter that is e, i, or y, its pronunciation
    will be soft. Some examples include the words "gin", "engine", "page", "vengeance",
    "generation", "gym", "astrology", and "Egypt".


    On the other hand, if the letter G is followed by any other letter than e, i,
    and y, its pronunciation will be hard. Consider the words "gazebo", "grass", "go",
    and "gloves". Some exceptions, however, are the words "give" and "gift".


    Where can you get free images for your web page?


    You can get free images from libraries of stock photos. There are a lot of websites
    that offer these royalty-free images. Most websites that offer free images for
    commercial business purposes have a Creative Commons license. Creative Commons
    is a non-profit organization that accepts submissions of photos, videos, and audio
    files.


    Some of the websites you can visit to search for free images'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'include Wikimedia.org, Flickr, Pixabay, FreeDigitalPhotos.net, Deviant Art,
    BigFoto.com, and Openclipart.org.


    **Is giving credit the same as asking for permission? In other words, can you
    use a certain image, acknowledge its owner, and not violate any rules on copyright**


    No. Unless the owner of the image file specifically said that anyone can use his
    or her work as long as that owner gives him or her credit, you need to talk to
    the owner and ask for permission. Basically, it is not enough to just mention
    the name of the owner and provide a link to the original file.


    You should not assume there would not be any copyright infringements if you credit
    the owner or author. Sadly, there are so many people who are misinformed. They
    make the classic mistake of merely crediting the author and not actually contacting
    him or her to ask for permission.


    If you do not want to be in any copyright trouble, you should probably play it
    safe and use your own image file or get one from a website that offers stock photos.


    # Turning Images Into Links


    When you create hypertext links, all you get are blue words with links connected
    to them. If you want to make your images active or clickable, you have to provide
    them with hypertext links. You can do that by using the following format:


    ```

    < a href="https://www.sampleprogram.com"> <img src="homepageimage.gif" alt="home">
    > </a>

    ```


    In the above given example, fictitious URLs were once again used to serve as guidelines.


    When you put an image tag in a location where you usually put words, you get an
    image link instead of a mere text link. Instead of words becoming blue, it is
    the borders of the'
  merge: -1
  img_proc: true
