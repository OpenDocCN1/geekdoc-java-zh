- pgno: 278
  md: '# Email Links


    You may think that it is difficult to place HTML email links on web pages, but
    it is actually very easy. However, it is not advisable to do it because it can
    result in spamming problems. You can receive unnecessary spam messages on your
    email.


    So, unless you want to purposely receive these these kinds of emails, you should
    probably avoid using email links on your web pages. There are certain individuals
    who use specific programs to collect such emails and then use them to spam accounts.


    If you want visitors to send you emails, you can use an HTML form to gather their
    data. Then, you can use CGI or PHP scripts to send out emails.


    For example, you can use the link https://www.sampleprogram.com/about/contact_us.htm
    to collect the necessary data. Of course, you need to turn it into a hyperlink.
    You can use Contact Us or Email Us for this purpose.


    When a visitor of your website clicks on the link, he will be directed to the
    web page wherein he can fill up the form. You can use this form to collect feedback
    or user information. Then, you can use a CGI program to get such data and send
    it to your email account.


    # Email Tags


    When you use the tag <a>, you can choose which email address your emails are to
    be sent to. You simply have to type mailto:email address with the href attribute.


    You have to use the following syntax if you want to use mailto rather than http:'
  merge: -1
  img_proc: true
