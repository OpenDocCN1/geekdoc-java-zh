    # Download Links


    If you want to create a text link, you can do that with HTML. In fact, text links
    are ideal to make files in PDF, ZIP, or DOC form downloadable. It is actually
    pretty simple. All you have to do is provide the URL of your file. You can use
    the following example as a guideline:


    ```

    <!DOCTYPE html>

    < html>

    <head>

    < title> This is an example for a hyperlink </title>

    </head>

    <a href = https://www.sampleprogram.com/page.pdf>

    Click to download file </a>

    </body>

    </html>

    ```


    The above given example would result in the following output:


    Click to download file


    As you can see in the output, the text link "Click to download file" directs you
    to the page where the file is found and lets you download it with quickness and
    ease.


    # The File Download Dialog Box


    You can actually give your visitors an option to click on a link to display a
    File Download box rather than show them the actual content right away. You simply
    have to use an HTTP header for the HTTP response.


    Say, you want to make a certain file downloadable via a certain link, you may
    use the following syntax:'
