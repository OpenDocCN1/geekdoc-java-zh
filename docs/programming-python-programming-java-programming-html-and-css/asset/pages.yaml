  md: '# INTRODUCTION


    Learning Python Programming in 7 days is possible, although it might not look
    like it''s easy at first, especially if you are someone with meager experience
    in dealing with a programming language. As you learn, you will see that it is
    not difficult to understand, and it becomes easier when you add patience, diligence,
    and discipline.


    If you make a mistake, you will see an error message that pops on the screen.
    It can guide you in correcting the mistake you made in writing your code. There
    are lots of cases where simple capitalization or indentation is the culprit. Don''t
    panic in case you encountered an error, let the error message guide you in making
    your codes right.


    Understand that you will be able to learn the Python basics in one day, but that
    won''t make you an instant expert. You still need to practice and work your way
    in discovering the cool things that you can do with Python as you go along. Even
    expert programmers need to spend ample time in honing their programming skills.
    Before you know it, you are ready to create a more complex program.


    This book has all the materials that you need in learning basic Python Programming.
