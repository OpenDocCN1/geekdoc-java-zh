- pgno: 217
  md: '# HTML Logic


    Check out your HTML code. You can view it on your text editor. Read the text that
    is shown on your browser. Still using the same example given above, the words
    say “This is a sample web page that is not involved with any website.” As you
    can see, the sentence is positioned between the tags <p> and the </p>. The whole
    block is positioned between the tags <body> and </body>.


    If you look at the code closely, you will realize that there are other words that
    are within angle brackets such as <head> and </head> as well as <html> and </html>.
    The words that are found within these angle brackets are referred to as HTML tags.


    Most of the tags in HTML come in pairs. The <body>, instance, is used to signify
    the beginning of a sentence while the slash ( / ) is used to signify the end of
    a sentence. So, when you see </body>, you can expect to find a sentence that was
    ended.


    Keep in mind that every tag represents a particular function. For instance, the
    tags <p> and </p> are used to signify the beginning and end of a particular paragraph.


    # HTML Documents


    To help you learn about web page structures faster, you should think of a regular
    business letter. How does this letter look like? What are its parts or components?


    In general, a business letter is a formal letter that needs to follow a specific
    format. It has to include a header or the address of the sender, as well as the
    address of the receiver. It also has to include the name of the receiver, followed
    by the main content of the letter.


    Just like business letters, web pages need to follow a specific format too.'
  merge: -1
  img_proc: true
