  md: '# CHAPTER 6: HTML LISTS


    In general, there are three ways on how you can specify your list of information.
    Keep in mind that every list has to contain at least one element.


    A list can contain the following:


    < ol > You use it for ordered lists because it makes use of various schemes in
    order to list the items.


    < ul > - You use it for unordered lists because it lists the items with use of
    bullets.


    < dl > You use it for definition lists because it organizes the items as if they
    were in a dictionary.


    # Ordered Lists


    If you want to display your items with numbers rather than bullets, you have to
    use an ordered list. You have to use the tag <ol>. When you do, you will notice
    the numbering begins at 1 and has an increment of 1 for every succeeding element.
    These succeeding elements, however, must be given the tag <li>.


    To help you understand this concept further, you should take a look at the following
    example:


    ```

    <DOCTYPE html>

    <html>

    <head>

    < title > This sample program shows you how a basic ordered list looks like </title>

    </head>

    <body>

    <ol>

    <li> Colt Python </li>

    ```'
