- pgno: 225
  md: '# CHAPTER 4:

    HTML STRUCTURE


    # Structuring Web Pages and Documents


    How Web Pages Use Structure


    To help you understand the way web pages use structure as a beginner, you can
    think of a typical newspaper. How does it look like? What are its parts and features?


    For every page of the newspaper, you will see a headline. It is usually followed
    by images and texts. Then, you will see the main article, which may include subheadings
    or is divided into several sub-sections. This particular structure of the newspaper
    allows readers to understand the article or the news report better. The page is
    organized and classified into their appropriate categories to prevent confusion
    and misinformation.


    A computer program has the same concept. It needs to have a structure in order
    for it to run and be understood properly. If its elements are not appropriately
    organized, the programmer may be confused.


    The following are the primary elements of HTML:


    +   - Header

    - Main

    - Navigational menu

    - Article

    - Section

    - Aside

    - Address

    - Footer


    These elements are pretty self-explanatory. So, it should not'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# HTML & CSS


    be difficult for you to know what they are meant for, even if you are only a beginner.


    # Header


    This element is used for the purpose of identifying and containing the contents
    that shows at the beginning of each web page. These contents include the logo
    or branding, search bar, tagline, navigation items, and other things that are
    duplicated across your web pages.


    More often than not, the header is placed before the body, but it can also precede
    the main element.


    # Main


    This element is found between the header and the footer, and is meant to denote
    the contents of your web page that are related to the primary topic or the body
    of your web page. It has to contain contents that are unique to this page. It
    should not contain contents that are duplicated across your web pages, such as
    navigation items, headers, and footers.


    Then again, you can have more than one main element on your web page. This is
    especially ideal if your homepage features your most recent posts. You can have
    a main element for each of these posts.


    # Navigational Menu


    This element is usually placed at the upper part of the web page. It can also
    be placed in the footer or at the sidebar. You have to use the tag `<nav>` when
    using a navigational menu on your web page. Then again, there is no need for you
    to use this tag for all your links. Nevertheless, they are crucial for the blocks
    of links that navigate to a specific part or the entire website.


    # Article


    This element can be placed anywhere on your web page,'
