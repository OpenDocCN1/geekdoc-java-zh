- pgno: 184
  md: '# Frequently Asked Questions (FAQ)


    # How does HTML work?


    The computer language has a series of short codes that are typed into a text file.
    These become the tags of the HTML. The text is saved as an HTML file and is viewed
    using a browser such as Internet Explorer. The browser reads the file and then
    translates the text to a visible form that renders the page as the programmer
    intended.


    When you write HTML codes, you have to use tags correctly. You can use a powerful
    graphical editor or a rudimentary text editor to create your pages.


    # What do HTML tags do?


    Tags separate normal texts from codes. They are the words found between angle
    brackets and they allow tables and images among others to tell the browser what
    needs to be rendered on the page. HTML tags perform a variety of functions. They
    do not show up when you use a browser to view the page. You only see their effects.
    The most basic and simplest of tags do not have a lot of functions. They merely
    apply formatting to texts.


    For example, they can make the text bold or italicized. If you want to make a
    text bold, you simply have to place it between `<b>` and `</body>` such as the
    following example:


    ```

    <b> This text is not bold. </b>

    ```


    As you can see in the example shown above, the first text is bold while the second
    one is not. The second text is not bold because it is outside of the code that
    makes texts bold.'
  merge: -1
  img_proc: true
- pgno: 185
