  md: '# MICHEAL KNAPP


    # HTML Versions


    # History and Versions


    As you know, HTML is a continuously evolving computer language. Therefore, you
    cannot expect it to stay the same for a long time. A revised set of specifications
    and standards are created in order to adapt with the evolving needs and requirements
    of users.


    # HTML 1.0


    It was the first ever version of HTML that was released to the public. During
    the time of its release, however, not a lot of people were into creating websites.
    Thus, this version of the computer language was limiting. All a user can do back
    then was put some simple texts on the Internet.


    # HTML 2.0


    It was an improved version of HTML 1.0. It had everything its predecessor had,
    but with the addition of new features. It became the standard for website design
    in the mid-1990s because it defined a lot of core features.


    # HTML 3.0


    By the time it was released to the public, more people have been into programming
    and Web developing. More people have become familiar with HTML and wanted to use
    it for creating websites. Webmasters wanted more to creating websites. They wanted
    their websites to look attractive and inviting.


    However, there came a problem. During that time, the Netscape company was leading
    the browser market. They offered the Netscape Navigator, which was a browser.
    In their desire to appease the requests and demands of HTML users, they came up
    with proprietary tags as well as attributes. They called these abilities the Netscape
    extension tags.


    When the other companies learned of these tags, they tried'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'to produce replicas that mimic the effects of such tags. However, their browsers
    are not able to display the same output. So, if you design a Web page using the
    Netscape extension tags, you will not be able to get your desired output using
    different browsers. You will only end up being confused and annoyed.


    Then, a work group headed by Dave Raggett came up with HTML 3.0. This version
    of HTML was better than the two previous versions in terms of features. It had
    a lot of new abilities and more opportunities for users to create amazing Web
    page designs. Unfortunately, the browsers were slow to implement such improvements.
    Only a few improvements were added, mainly because of the size. Eventually, HTML
    3.0 was no longer used.


    Due to this failure, the developers noted that improvements have to be modular.
    They should be added in stages so that browser companies will not have a hard
    time.


    # HTML 3.2


    Browser specific tags continue to come. Eventually, it was apparent that there
    has to be a certain standard. In 1994, the World Wide Web Consortium (W3C) was
    founded to standardize the computer language and ensure that it keeps evolving
    to fit the needs and requirements of users.


    The World Wide Web Consortium created HTML 3.2 and gave it a code name WILBUR.
    The version was a reduced change to the current standards. It was considered to
    be the official standard in 1997. To this date, it is still fully supported by
    all browsers.


    # HTML 4.01


    It was a huge evolution from the previous versions. It was also the final iteration
    of the classic HTML. During the early stages of its development, it was given
    the code name COUGAR. A lot of its functionalities were derived from HTML'
  merge: -1
  img_proc: true
- pgno: 191
  md: '3.0. There were also plenty of trimmings on old tags, support for the new supporting
    presentational language, cascading stylesheets, and internationalism.


    In December 1997, the World Wide Web Consortium recommended HTML 4.0. In April
    1998, it eventually became the official standard. Microsoft undertook browser
    support for the Internet Explorer browser. Internet Explorer 5 and Internet Explorer
    6 both offer support for nearly every tag and attribute.


    # HTML 4.01


    After HTML 4.0 has been released for a while, the developers made some corrections
    and revisions in its documentation. This resulted in HTML 4.01.


    # XHTML 1.0


    The World Wide Web Consortium issued the specifications for XHTML 1.0 around the
    start of the 21st century as a recommendation. In January 2000, it became a joint
    standard with HTML 4.01.


    This version represents a whole new HTML branch, which was a departure from the
    old ways of using specs. XHTML included rigors of XML. The code has to be written
    properly in order for it to work when it reaches the browser. XHTML did not have
    a lot of deprecated or new attributes and tags, although certain things have changed
    with a view of improved functionality and accessibility. There are new sets of
    coding rules for users.


    # HTML 5


    After XHTML 1.0 and HTML 4.0 were released, the developers wanted to come up with
    XHTML 2. They also wanted new innovations. However, their proposal turned out
    to be unrealistic and boring that the project was no longer pursued. They had
    to find another approach.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# HTML & CSS


    During this time, several fans of the pragmatic Web technology, and browser programmers,
    specification writers, started to create something using methods that are beyond
    the typical procedures used by the World Wide Web Consortium. They referred to
    their group as the Web Hypertext Application Technology Working Group (WHATWG).
    They created a new specification.


    The World Wide Web Consortium eventually decided that HTML remains to be the future
    of the World Wide Web. HTML 5 was regarded as the new specification when XHTML
    2 was discontinued. HTML 5 was specifically designed for the World Wide Web. At
    present, it is still used.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# CSS Versions


    # CSS 1


    This version of CSS first came out as a recommendation by the World Wide Web Consortium
    in December 1996. It describes the language and the simple visual formatting models
    of HTML tags.


    # CSS 2


    This version of CSS became a recommendation of the World Wide Web Consortium in
    May 1998. It was built on the previous version. It features support for style
    sheets that are media-specific such as aural devices, prints, element positioning,
    tables, and downloadable fonts.


    # CSS 3


    This version of CSS became a recommendation of the World Wide Web Consortium in
    June 1999. It was built on the previous versions. It features divided documentations
    known as modules. Every module has a new extension feature that was defined in
    the second version of CSS.


    CSS 3 modules also have the old specifications and extension features of CSS 2.
    These include the box model, selectors, backgrounds, borders, replaced content,
    image values, text effects, animations, user interface, multiple column layout,
    2D transformations, and 3D transformations.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# CHAPTER 2:

    ACCESSING THE WEB


    # Going Online


    # Web Browsers


    Users can visit websites on the Internet using a web browser, which is a type
    of software. Some of the most commonly used web browsers are Google Chrome, Internet
    Explorer, Mozilla Firefox, Opera, and Safari.


    If you want to view a particular web page, you have to type its address on your
    browser. You can also use a bookmark or follow the link that takes you to the
    website by clicking on it.


    Manufacturers of software release a new version of their browser on a regular
    basis. Each time, they add a new feature as well as supporting additions to the
    computer language.


    Then again, it is crucial for you to take note that a lot of users do not run
    the most recent versions of their browsers. Thus, you cannot expect everyone who
    visits your website to use the most recent functionalities offered by the updated
    browsers. You have to consider this fact when you create a website.


    If you want to make sure that you can reach everyone from different parts of the
    world, you have to make your website compatible with the browser that they use.
    Aside from using the updated versions, you should also make your website viewable
    by users with older versions of browsers.


    # Web Servers and Devices


    The moment you ask the browser you use for a web page, it automatically sends
    a request across the World Wide Web.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'This request is taken to a special computer called the web server. The web
    server hosts the websites that you see on the Internet. It stays connected online
    all the time. It is also optimized to cater to users who request for web pages.


    There are huge companies and organizations that run their very own web servers.
    Nevertheless, it is still more convenient to hire a web hosting company to run
    your web servers. You can find paid and free hosting services. of course, which
    one you will choose depends on your preference and needs.


    You have to check out reviews and do the researches before you settle with a particular
    web hosting company. In addition, you have to keep in mind that free hosting services
    are usually limited. So, you will not be able to take advantage of all the features
    that pay versions offer.


    When it comes to devices, users go to websites using their laptops, desktop computers,
    mobile phones, and tablets among others. Because users can now go online using
    a wide variety of devices, you have to make sure that your website can be displayed
    properly on these devices. Keep in mind that they have different sizes of screen
    as well as different loading times. Some devices connect faster to the Internet
    as compared to the others.


    # Screen Readers


    These are programs that scan and read the contents of a screen to the user. More
    often than not, they are used by individuals who have poor eyesight or some visual
    impairment.


    You have to know that a lot of countries have certain legislations with regard
    to public buildings being accessible by people who have disabilities. In the same
    manner, websites are required by the law to be accessible to people with disabilities.'
  merge: -1
  img_proc: true
- pgno: 196
  md: Aside from people with disabilities, screen readers are also useful to people
    who are jogging or driving. Because it is dangerous to keep your eyes off the
    road when you jog or drive, you can use a screen reader. The device allows you
    to do what you have to do while still knowing the content of the website that
    you visited.
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Search Engine Optimization (SEO)


    The Basics of SEO

    Search engine optimization (SEO) refers to the practice of making your website
    appear on top of the search results. Each time a user types a certain keyword
    or key phrase to search for a topic, your website can pop up on the results of
    the search engine if it features related content.


    The main idea behind search engine optimization is to find out what users are
    likely to type into their search engines. What terms do you think they will use
    to find your website? Once you find out what these terms are, you have to incorporate
    them into your website so that you can boost your chances of being indexed by
    the search engines.


    Search engines determine which websites come out first at the search results by
    checking the content of websites and considering how many websites are linked
    to them. They also consider the relevance of these links.


    Search engine optimization is usually divided into two categories: off page techniques
    and on page techniques.


    # Off-Page Techniques


    It is important for you to get other websites to connect to you. These links contribute
    to your ranking. Search engines determine the ranking of your website by checking
    how many other websites are linked to yours. They are interested in websites that
    feature relevant content.


    Say, for instance, your website is an online store that sells fish bait. It would
    be highly irrelevant to link it to a website that features hair care and hair
    products. On the other hand, a website about angling would be considered relevant.


    In addition, search engines check out the words found between the closing and
    opening tags in the links. If the texts in the links contain keywords instead
    of merely ‘click here’'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# HTML & CSS


    and website URLs, the search engines will consider them relevant. Take note that
    the words on your website links also have to show up in the texts of the web pages
    that your website is linked to.


    # On-Page Techniques


    You can improve your ranking in the search engines by using on page techniques
    on your web pages. The primary idea behind these techniques is that users are
    likely to input certain keywords on their search engines, which is why you have
    to use this to your advantage and include these keywords in the HTML code and
    text of your website.


    This way, the search engines will be informed that your website covers the topics
    that the keywords are pertaining to. Keep in mind that search engines largely
    depend on the texts in web pages. Hence, it is crucial for you to use terms that
    users are likely to search for. You have to put these terms in your text.


    You have to make your keywords appear on the important places. Also, you have
    to make sure that your images contain the right texts in their alt attribute so
    that the search engines can easily understand their content.


    Where are these important places that your keywords have to appear? In general,
    there are seven of them:


    +   1. Page Title


    It is found at the top of your browser window. It can also be found on tab of
    your browser. The page title is specified in the title element, which is found
    inside the head element.


    +   2. Web Address or URL


    It includes the name of your file. As much as possible, you have to use keywords
    or key phrases in your file name.


    +   3. Headings'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'The search engines can find out if a page is relevant to a subject and give
    it more weight than the other texts if you use keywords or key phrases in your
    heading element.


    # 4. Text


    As much as possible, you have to repeat your keywords or key phrases in the main
    body of your text. You have to repeat them at least two to three times. Then again,
    you should refrain from overusing them. Otherwise, your readers may no longer
    understand your content. If you want visitors to keep coming back to your website,
    you have to make your content easy to read and understand.


    # 5. Link Text


    You have to use keywords or key phrases in the texts that create the links between
    web pages instead of generic expressions. While ‘click here’ is pretty straightforward
    on its purpose, your visitors may think that it is a clickbait or something that
    is not that important.


    # 6. Image Alt Text


    The search engines want you to give accurate descriptions of the images in your
    alt text. By doing so, you also make your images show up when users use images
    to search for results in the search engines.


    # 7. Page Descriptions


    Your description is found in the element. It is specified with the use of a meta
    tag. Keep in mind that your page descriptions have to be sentences that describe
    the content of your web page.


    Even though they are not displayed your browser window, they may show up in the
    search engine results. It is never ideal to try fooling the search engines by
    doing certain techniques such as adding texts that are of the same colors as the
    backgrounds of your pages. If you do, you will get penalized and you website may
    get banned.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Identifying Keywords and Key Phrases


    If you want your website to appeal to users and search engines, you have to use
    the most popular and most relevant keywords and key phrases. However, this can
    be quite tedious if you are not familiar with search engine optimization. Fortunately,
    you can determine the appropriate keywords and key phrases for your website using
    the following methods:


    # 1. Brainstorm


    You have to make a list of all the keywords and key phrases that a user may type
    into a search engine. Put yourself in the shoes of an online user. In particular,
    you have to put yourself in the shoes of a person who may be interested in what
    your website is all about. Think of your target audience.


    What are the services or products that you offer on your website? What are the
    topics or issues that you discuss? You can ask others and find out which words
    they are most likely to use when they want to search for your website. People
    who are not familiar with a certain topic may use a different term to refer to
    it. In other words, they may not use jargons that are specific to your industry.


    Aside from keywords, you can use key phrases if your website features topics that
    cannot be described with just one word. A lot of users are also likely to use
    keywords to search for a particular topic, service, or product.


    # 2. Organize


    See to it that you organize your keywords and key phrases into lists. You have
    to group them according to section or category. This way, you can easily locate
    them.


    For instance, if your website is an online pet store, you can group keywords for
    animals according to category. You can separate rabbits, dogs, and cats.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'If your website is larger or you have more items to offer online customers,
    you can use sub-categories. This way, you can group items according to brand and
    model, not just type.


    # 3. Research


    You can use a variety of tools to help you find out more about the keywords and
    key phrases that online users use. When you input a keyword, the tools will give
    suggestions regarding other keywords that you may want to use.


    For instance, you can use Google Adwords. If you use it, you have to choose ''exact
    match'' instead of ''broad match''. You can also use Wordtracker and Keyword Discovery.
    After these tools provide you with keywords, you can add them to your lists. These
    tools are likely to suggest terms that are not relevant. You have to choose which
    ones are relevant for your website and discard the rest.


    # 4. Compare


    Your website cannot show up on top of the search results every time a user inputs
    a keyword. It is just not likely to appear on top all the time, especially if
    the topics you have on your website are common. If you have a lot of competitors,
    you have to make comparisons.


    Keep in mind that the more websites optimize a certain keyword, the more difficult
    it will be for you to go up the search engines when online users type in that
    keyword.


    There are keyword research websites that can provide you with data with regard
    to how many online users used for a certain keyword or key phrase. This is really
    helpful because you will be able to determine how much competition your terms
    have.


    In addition, you can take advantage of the advanced search feature of Google to
    search for titles of pages. By doing this, you can identify the number of websites
    that feature your'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'keywords in their page titles. Take note that the more pages contain the terms
    you use, the more competitors you have.


    # 5. Refine


    You have to choose which keywords and key phrases you need to concentrate on.
    You should always go for keywords and key phrases that are relevant to the sections
    of your website.


    In case there is a certain phrase that is highly relevant yet has plenty of competition,
    you must not be hesitant to use it. In order for you to increase the odds of your
    website being found, you may check out if there are other terms that you can incorporate
    with your keywords and key phrases.


    Say, for instance, if the service or information you provide on your website targets
    a specific location, you have to incorporate this location into the list of keywords
    and key phrases that you use. You have to do this so that people can find your
    website.


    If your website promotes a certain company in a certain country, then you have
    to get hundreds of people from that country that are in search of products or
    services that this certain company offers. It would be pointless to get thousands
    of people who are not even in that country or are looking for a different type
    of product or service.


    # 6. Map


    Once you have created a list of keywords and key phrases, knew about your competitors,
    and found out about the most relevant keywords and key phrases, you have to choose
    which keywords and key phrases you are going to use for every web page.


    You can choose three to five keywords and key phrases that map to every page of
    the website. Then, you can use them as your keywords and key phrases for every
    page.'
  merge: -1
  img_proc: true
- pgno: 203
  md: Keep in mind that there is no more need for you to repeat them on all your pages.
    In addition, your keywords and key phrases can be more specific towards the individual
    topics you have on every page as you go farther away from your homepage towards
    the different sections on the website.
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Analytics


    # How many people come to your website?


    Once online visitors come to your website, you can begin to analyze how they arrived,
    what they were searching for, and when they are going to leave the website. Google
    Analytics is a very popular tool that webmasters use to figure these things out.


    In order to use it, you need to sign up for an account. You just have to go to
    the Google website and search for analytics. You can also type in www.google.com/analytics
    and start from there. On the website, you will be provided with a tracking code.
    You need to use this tracking code on all the pages of your website.


    Each time an online visitor loads your web page, your tracking code sends out
    data to the servers in which it is kept. Then, Google provides an interface that
    is web-based. You can use it to see how online users use and navigate through
    your website.


    Google Analytics provide the tracking code, which should show up before the closing
    tag. The appearance of web pages is not altered by the tracking code. It does
    not really have any major effect on your website.


    # Where can you see how many online users come to your website?


    You can use the overview page to obtain this information. It provides you with
    a snapshot of the data that you are likely to search for it. It particularly informs
    you of how many online users come to your website.


    The amount of times online users come to your website is called visit. If a visitor
    is no longer active on your website for half an hour and then suddenly goes to
    another page on your website, that gets counted as a new visit.


    The total amount of online users who have come to your'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'website over a certain period of time is called unique visit. The amount of
    unique visits gets lower than the amount of visits if online users return to your
    website more than once over a certain period of time.


    The total amount of pages that your online visitors view on your website is called
    page views. The average amount of web pages your online visitors check out on
    your website for every visit is known as page per visit. The average time on site
    refers to how much time your online users spend on your website for every visit.


    If you wish to switch the time your reports display on your website, you have
    to use the date selector, which is found at the upper right corner of your website.
    Each time you log in, you will notice that it is set to the final month of the
    year. Nevertheless, you can easily change it to display the date that you prefer.


    If you wish to export statistics for other applications, you have to use the export
    link. It is found above the title that shows ''visitors overview''.


    # What does your visitors look at and where do they come from?


    When online users come to your website, what do you think they look at? Well,
    you can know more about what your visitors search for when they arrive at your
    website by using the content link at the left part of your website.


    The pages tell you about the pages that online users are likely to look at since
    these pages receive the most views. It also tells you about the pages that your
    visitors spend a lot of time checking out.


    The landing pages refer to the pages that online users get to when they first
    visit your website. They are very helpful since you can learn about the users
    that do not come to your'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# HTML & CSS


    website through your homepage.


    The top exit pages tell you about the pages that online users tend to leave or
    exit from. If there are plenty of users who leave from a certain page, you may
    consider improving or changing that page.


    The bounce rate refers to the amount of online users who exited on the same web
    page that they came to. If there is a high bounce rate on your website, there
    is a huge possibility that online users did not find what they were looking for
    on your pages. It could also be that your website is not attractive or enticing
    enough for your visitors to stay and look around.


    A closed browser, used back button, entered new URL, clicked links to other sites,
    and clicked advertisements all as a bounce.


    So, where do your online visitors come from? You can check out the traffic sources
    link located at the left side of your website.


    The referr display the websites that connect you and the amount of visitors who
    came to your website through them. If a website sends huge amounts of traffic
    to your website, you can contact the other website and ask if you can work together
    as a team. This way, you can make sure that traffic continues to flow into your
    website. You may also search for other similar websites and request for a connection.


    The direct displays which pages visitors get to if they did not arrive through
    another site or a link. They may have typed in your URL into their browsers, clicked
    on a link from an email, Word document, or PDF file, or used a bookmark on their
    browsers.


    The search terms displays the terms that online users input into search engines
    to look for your website. This allows you'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# MICHEAL KNAPP


    to learn about the ways your visitors search for the content of your website.
    Oftentimes, the way they describe what they need is different from the way you
    describe your own website. Hence, you can improve your content, keywords, and
    key phrases.


    The advanced features can be accessed through the help files of Google Analytics.
    If you own an online store, you should consider checking e-commerce tracking.
    It adds data on the products or services you have sold, the average size of baskets,
    etc.


    Moreover, you can create goals and specific which paths you wish your visitors
    would take. Then, you should see how far they would get through these paths. Knowing
    all these allows you to obtain as much data and information as online users as
    possible.


    # Domain Names and Hosting


    You need to have a domain name as well as web hosting if you want your website
    to be up and running.


    The domain name refers to the web address. It is basically the URL that online
    users type in order to arrive at a particular website or web page.


    There are a lot of websites that let you register a domain name. More often than
    not, you have to pay a yearly fee to keep your domain name. Do not worry, though.
    the fee is usually minimal.


    When you choose a domain name, you will be asked to verify if your preferred name
    is still available. Keep in mind that since the advent of the Internet, people
    have started registering domain names. Thus, the domain name that you want have
    already been taken by someone else. It may even take some time before you finally
    find a domain name that is suitable for your website.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# HTML & CSS


    Aside from registering a domain name, you also need to obtain web hosting. Usually,
    the websites that allow you to register a domain name also offers web hosting.
    Many of them even offer packages and discounts if you avail of both services from
    their website. So, if you want to save some money, you have to take advantage
    of this offer.


    What is web hosting exactly? Web hosting is the process of giving access and storage
    space for websites.


    In order for people to find your website, you have to upload it to a server. A
    web server is a special computer that is always connected online. It is designed
    and developed to serve web pages every time they are asked for.


    A lot of websites, excluding huge websites, rely on web servers to stay up and
    running. These web servers are run by companies that offer web hosting services.
    Using a web server is more practical and economical for users who are on a budget
    and want to go for something reliable.


    The disk space refers to the overall size of the files that consist of your website.
    These files include your CSS and HTML files, scripts, and images.


    The bandwidth refers to how much data is sent to your visitors by the hosting
    company. So, how much data do you actually use? Well, for example, are ten people
    who checked out all the pages of your website. This becomes the equivalent to
    ten times the available amount of disk space that you used.


    The backups verify if the hosting company does backups on your website. It also
    tells you how often the hosting company does this. Take note that certain users
    merely create backups in order for them to be able to restore websites in case
    there was server breaking. The others let you access backups,'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'which are helpful in case of emergencies, such as when you break your website
    accidentally as you try to keep it updated.


    A lot of hosting companies provide web hosting packages to email servers. So,
    when it comes to email accounts, you may want to check out the size of the mailbox
    as well as the number of mailboxes that you are allowed to use.


    If you run a content management system, you can expect it to use a database and
    a server side programming language. For instance, a PHP may have a MySQL database
    while an ASP.net may have an SQL server database. See to it that you verify with
    the hosting company if they support such technologies. Otherwise, you may have
    a problem with the software that you need to use.


    Usually, it is worth looking for a review of a hosting company. By checking out
    reviews, you can see and find out about the experiences of other people or customers
    with a certain hosting company.


    Sadly, you can only verify the reliability of a hosting company in the event that
    something goes wrong. Usually, when things are going smoothly and in order, you
    will not be able to detect their shortcomings. It is only when there is a problem
    or emergency that you can prove if they are worth your time and money.


    In times of trouble or emergency situations, can the hosting company help you
    out? Is the hosting company going to stick with you and continue to support you?
    Then again, no hosting company is perfect. So, if the reviews seem too good to
    be true, they probably are fake. Even the best hosting companies sometimes encounter
    down times, and you may read about these in their negative reviews.


    When it comes to hosted services, you can find numerous'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'online services that let you point a domain name to a server. Most blogging
    platforms such as Tumblr, Posterous, and WordPress provide servers to their users.
    Likewise, e-commerce websites such as Shopify and Big Cartel provide servers on
    which the websites of the users are hosted on.


    So, if you are on a similar platform, there is no more need for you to get a separate
