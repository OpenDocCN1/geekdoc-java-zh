- pgno: 249
  md: '# Frequently Asked Questions (FAQ)


    What happens when you use type a or type A, which are represented by the letters
    of the English alphabet, and you go over the number 26?


    You continue counting by going back to the first letter, but this time, you double
    the letters. In the modern English alphabet, there are only 26 letters.


    So, if you want to start with number “23”, which represents the letter “w”, and
    you have more than four items on your list, you will get the letters “aa” by the
    time the counting reaches the 27th.


    This happens because the 26th letter is “z” and that would go to your fourth item.
    Since you have more than four items on the list and the last letter of the English
    alphabet is “z”, you have to go back to letter “a” for your fifth item, and so
    on.


    Would you get an error if you start with 27 or beyond?


    No, you will not get an error. Your program will still run.


    Would the counting go back to number “1” which represents the letter “a”?


    Yes, but as mentioned earlier, the letters would be doubled this time around.
    To help you understand this concept further, here is an example for you to study:


    ```

    <!DOCTYPE html >

    <html>

    <head>

    <title> This sample program shows you how an ordered list using type a start 23
    looks like < /head>

    <body>

    <ol type = " a " start = "23">

    <li>Toyota Camry </li>

    <li>Subaru Forester </li>

    ```'
  merge: -1
  img_proc: true
