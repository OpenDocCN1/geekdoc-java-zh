  md: '# ICODE ACADEMY


    There are eight primitive types in Java. By primitive, it means that these types
    are not defined in terms of anything else; basically, atomic. They are sequences
    of bits that the CPU is ready to deal with. These types are:


    Byte, short, int, long, float, double, char, Boolean


    If a variable type is not a primitive type, it is considered a reference type.
    A reference type can either be a class, interface, or array type. A variable of
    any reference type can be set to `null`. This means that it can hold nothing


    Java supports the usual set of data types such as integer, char, boolean, and
    other variables. Here are some:


    ```

    int a, b; //integer variables

    float f; //float variable

    char s; //character variable

    boolean a;      //returns true or false

    ```


    Note: `//` and `/* */` are used to serve for single line comments and multiple
    line comments respectively.


    Numerical expressions can be written in pretty much the same way as other languages.


    ```

    a = 2 * (3 + 1);

    b = c / 4.12643;

    np = q % 2;

    o = true;

    s = ''L'';

    ```


    It is possible to assign an initial value to a variable directly when declaring
    it.


    ```

    int a = 5;

    float f = 0.52;

    ```'
