    # Important Reminders


    You need to bear in mind that you must solve the ''not'' part first, the ''and''
    part second, and the ''or'' part last.


    The ''and'' boolean operator will only yield True if both sides are true; as long
    as there’s a false statement, the whole thing is False.


    The ''or'' boolean operator will only yield False if both side are false; as long
    as there’s a true statement, the whole thing is True.


    The parentheses () can also help you evaluate your expression in the order you
    want. Anything inside the parentheses is evaluated or taken as its own unit.


