  md: '# CHAPTER 5:

    UNDERSTANDING LISTS,

    TUPLES, AND DICTIONARIES


    It is important to understand what are lists, tuples, and dictionaries in Python
    programming. They can help you make your coding easier. You will appreciate them
    more if you begin working on a more complex or sophisticated programs.


    For this lesson, you need to go back to variables, a bit deeper.


    When you take a deeper look, variables actually store information, which can be
    rehashed at any time. The stored information can also be changed at any given
    time, or gets reassigned.


    But what if you need to store a long list of data, which doesn''t change or just
    remain as it is over time, such as the months in a year or a phone or address
    book?


    For these problems and other similar issues, Python provides three solutions –
    lists, dictionaries, and tuples.


    # All About Tuples


    Tuples are similar to lists, and the only difference is you are not allowed to
    alter the values in a tuple. The set values that have been assigned to it are
    the values that you need to stick with. You are not allowed to add anything or
    omit something. Each value has its own reference number and it starts from 0 and
    not 1. The collection of each month’s name is one good example of tuples.


    # Tuple Sample'
