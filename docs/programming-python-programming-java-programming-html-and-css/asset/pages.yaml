    # Footer


    This element represents a footer for the nearest sectioning root or sectioning
    content element. It usually contains information regarding the author, links of
    documents, and copyright.


    # Related Elements and Declaration


    The following are other elements that you may find in the HTML program:


    # Meta


    This element is used to provide additional information to the HTML document. The
    information that is enclosed within the tag <meta> is not shown on the website.
    However, it is read by web crawlers and browsers.


    # Base


    This element is used to determine a base URL upon which you can build all relative
    URLs that you use on your web page. If it contains a target attribute, this attribute
    would be used as a default attribute for every hyperlink that appears on the document.


    # Div


    This element is used to define arbitrary blocks of content that can be placed
    and styled as single units.


    # DOCTYPE


    This declaration is used to inform the browsers of visitors that the document
    is an HTML document. All HTML documents have to have this declaration in order
    to be compliant with the HTML standards.'
