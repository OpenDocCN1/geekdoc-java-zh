  md: '# Unordered Lists


    Unordered lists are collections of related items that do not have any special
    sequence or order. You can create an unordered list with the use of the tag `<ul>`.
    When you use this tag, all the items in your list will be be marked with bullets.


    To help you understand this concept further, you should look at the following
    example:


    ```

    <!DOCTYPE html>

