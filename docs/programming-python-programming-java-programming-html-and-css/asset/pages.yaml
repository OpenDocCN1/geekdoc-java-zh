  md: '# PYTHON PROGRAMMING


    Python is interpreted, and it only means that an interpreter is already processing
    everything at runtime. You don''t need a compiler if you want to execute the program.
    It is similar to PHP and PERL.


    Python is interactive; it allows you, the programmer, to sit at a Python prompt
    and establish interaction with the interpreter as you write your program.


    Python is object-oriented. Python uses object-oriented programming technique or
    style that encapsulates program code within objects.


    Python is a programming language for novice programmers. Many consider it a great
    programming language for beginners. It supports the development of a wide array
    of applications – from unsophisticated text processing all the way to programming
    games. It is easy to learn due to its simple structure, and well defined syntax.
    Anyone can pick up the language without trouble.


    Python is easy to read due to its clearly defined code. You don''t need to learn
    all the computer or programming jargons when using Python, although it is advisable
    to know some of the important terms for easy understanding.


    Python is easy to maintain and update. It is not as complicated as the other programming
    languages. It is fun to create a program that practically talks back at you (in
    a nice way). Its interactive mode also allows the programmer to do interactive
    testing and debugging to correct the program or code and make it flow according
    to the programmer''s design or goal.


    Python has a broad standard library that is portable and compatible with Windows,
    UNIX, and Mac. You don''t need to do something or convert it into something that
    your current operating system would understand – your OS (operating'
