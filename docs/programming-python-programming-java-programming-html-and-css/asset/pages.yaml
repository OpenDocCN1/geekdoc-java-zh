    language can also determine the difference between methods with different method
    signatures. In other words, different parameters can determine the difference
    from one method to the other. Of course, both methods have to be within the same
    class.


    Imagine having a class that can solve 2 numbers of the same datatype. Each method
    is different for each datatype. It is tiresome to write a new method name for
    each method. Since Java supports method overloading, it is possible to use the
    same method name for the multiple methods. The parameters or arguments are the
    only components that need to be changed.


    ```

    public void solve ( int a, int b) { }

    public void solve ( float x, float y) { }

    public void solve ( double i, double j) { }


    ```


    Methods that are overloaded can be distinguished through the number of parameters
    and the data type passed to the method. If you notice it in the code base, solve
    (int a, int b) and solve (float x, float y) clearly have different parameters
    and are considered different from each other since they require different method
    parameters. It is not possible to declare one method with the same name and the
    same parameters. The compiler will not be able to differentiate them from one
