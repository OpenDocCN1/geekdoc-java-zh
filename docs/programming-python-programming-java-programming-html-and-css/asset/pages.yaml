  md: '# CHAPTER 2:

    PYTHON SYNTAX


    Python is easy to learn, and this book aims to guide you about the basic things
    you need to know in learning Python. You will learn the usual commands or functions
    that you would encounter time and again.


    You will see the codes and expected output in a simulated screen to give you the
    feel of what it''s like; the only difference is that the color of the text will
    remain the same. It is also advisable to open your Python program, either the
    one that you have downloaded or the one online.


    # Hash Sign


    All comments should have a hash sign (#) before the comment. It tells the program
    to bypass it or not run it whenever it encounters the hash sign. The comments
    are written to remind the programmer of certain things or give instruction to
    the one assigned to maintain the program. It looks like this:


    ```

    #All comments with hash will not be executed

    ```


    If you want to print it you need to write the code like this:


    ```

    print "All comments with hash will not be executed"

    ```


    # Single Line Comments


    There are times when comments must be included in the program to serve as guide
    for the programmer regarding the'
