    # Python Booleans


    Boolean is the second data type in Python program. A boolean is similar to a light
    switch. It has only two values. The light switch has on or off, while boolean
    can only assume True or False.


    You can also use variables to store booleans. Look at the example below:


    ```

    first_one = True

    second_one = False

    ```


    This means that the variable first_one has the value ‘True’, and the variable
    second_one has the value ‘False’. In naming variables, use the names that have
    something to do with its role in the program so it would be easier to remember
    and understand.


