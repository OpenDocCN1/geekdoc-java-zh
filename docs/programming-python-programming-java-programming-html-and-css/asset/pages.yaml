  md: 'image that turn blue. Well, this can actually be any color you want to set
    your web page to. The default color is usually blue.


    If you do not like the borders because they annoy you or you just prefer no borders,
    you can make them disappear by using the following CSS codes:


    ```

    <img style="border : none;" src="homepageimage.gif" alt="home">

    ```


    Take note that homepageimage.gif is just an example. You have to use your own
    link for this part. When you add CSS codes that denote the non-inclusion of borders,
    you can enjoy a border-free image on your web page.


    However, if you like borders and you actually want the border to get bigger, you
    can modify the code into something like the following:


    ```

    <img style="border : 55px solid blue;" src="homepageimage.gif" alt="home">

    ```


    You can see if your image is now active by hovering over it. Take note that you
    should just move the pointer over the image and not click on it.


    In case your image does not become viewable for whatever reason, it would be great
    to add an alternate text informing the user where your link goes.


    It is not really difficult to create image links. You just have to provide the
    URLs of your website and location of your image file. You also have to indicate
    if you would like to see a border or not.


    To help you understand this concept further, you should take'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'a look at the following example:


    ```

    <DOCTYPE html>

    <html>

    <head>

    <title> This is an example of an image hyperlink </title>

    </head>

    <body>

    <p> Click link </p>

    <a href="https://www.sampleprogram.com" target="_self">

    <img src="/images/logo.jpg" alt="Sample Program" border="0" />

    </a>

    </body>

    </html>

    ```


    The sample program shown above would produce an image link as its output. When
    you click on this link, you would be directed to the homepage of the sample website
    used in the program.


    # Mouse-Sensitive Images


    Both XHTML and HTML standards offer a feature that allows you to embed a variety
    of links inside one image. This would depend on the coordinates available on this
    image. When you connect different links to different coordinates, you can click
    on different locations on the image to open it.


    The image becomes mouse-sensitive. It becomes an image map. In general, there
    are a couple of ways on how to create an image map: server-side and client-side.


    A server-side image map is made with the <img> tag attribute ismap. It requires
    access to related image-map processing applications and a server. A client-side
    image map is made with the <img> tag attribute usemap, along'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# HTML & CSS


    with the <area> and <map> tags.


    # Server-Side Image Maps


    If you choose to create a server-side image map, you simply have to place the
    image within a hyperlink and then use the attribute isismap to activate or enable
    it.


    When you click anywhere on the image, your browser passes the coordinates of your
    mouse pointer as well as the URL that you used. Your server uses the coordinates
    of the mouse pointer to identify which document it would send back to the web
    browser.


    When you use ismap, the attribute href of the <a> tag has to have the URL of the
    server application, such as a PHP or CGI script, in order for it be able to read
    the passed coordinates and then process the request.


    Mouse position coordinates refer to the screen pixels. When you count these pixels,
    you start at the upper left portion or at (0,0).


    # Client-Side Image Maps


    The attribute usemap enables these images. Its value is necessary to create image
    tags and link maps. <area> and <map> tags define the image coordinates as well
    as their links.


    # The Coordinate System


    The shape you use determines the value of your coordinates. Keep in mind that
    every coordinate is relative to the upper left portion of the image (0,0). Every
    shape has a URL. If you want to learn about the coordinates of various positions,
    you can use an image software.


    The following are the coordinates for rectangles, circles, and polygons:'
  merge: -1
  img_proc: true
- pgno: 277
  md: '```

    rect = x1, y1, x2, y2

    ```


    In the upper left portion, you will find the x1 and y1 coordinates. In the lower
    right portion, you will find the x2 and y2 coordinates.


    ```

    circle = xc, yc radius

    ```


    At the center, you will find the xc and yc coordinates. Radius refers to the radius
    of the circle.


    ```

    poly = x1, y1, x2, y2, x3, y3, ... xn yn

    ```


    The points or vertices of the polygon are defined by the x and y pairs.


