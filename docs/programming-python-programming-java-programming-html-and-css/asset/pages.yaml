- pgno: 188
  md: '# HTML & CSS


    development was such a huge relief for Web developers because it got rid of the
    style formatting from HTML pages.


    # Does CSS save a lot of work?


    Yes, it does. Style definitions are typically saved in an external .css file.
    This external stylesheet allows you to change the appearance of your whole website
    simply by changing a file.


    # Who created CSS?


    Håkon Wium Lie first proposed the CSS language on the 10th of October 1994. At
    that time, Lie was working with Tim Berners-Lee at CERN. A few other style sheet
    languages were also proposed for the Web. When discussions about public mailing
    lists were made, the first recommendation on CSS was done by the World Wide Web
    Consortium in 1996. The proposal of Bert Bos was particularly influential, which
    is why he is also considered as the co-creator of CSS.


    # Who maintains CSS?


    A group of individuals within the World Wide Web Consortium, known as the CSS
    Working Group, maintains CSS. They also create specifications, which are documents.
    These specifications eventually become recommendations once they were discussed
    and ratified officially by the members of the World Wide Web Consortium.


    # Why are ratified specifications referred to recommendations?


    They are called as such due to the fact that the World Wide Web Consortium no
    longer has any control over the implementation of CSS. Independent organizations
    and companies create the software. The World Wide Web Consortium is a group of
    individuals that makes recommendations with regard to how the Internet needs to
    evolve and how it works.'
  merge: -1
  img_proc: true
