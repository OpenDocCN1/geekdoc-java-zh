- pgno: 215
  md: '# Getting Started with HTML


    # Your Very First Web Page


    Everything has a first time. Just like everything that you do for the first time,
    creating a web page can both be exciting and nerve-wracking. You are excited because
    you can finally do something on your own. You can create a website from scratch
    and test out the efficiency of your codes. At the same time, you are also nervous
    because you are afraid that your code will not work or your computer will be damaged.


    Then again, if you do not take the leap, you will forever be stuck. You will also
    regret not having the courage to just do it. So, with this being said, you should
    begin creating a website right now.


    ```

    <!DOCTYPE HTML PUBLIC " - //W3C // DTD HTML 4.01 Transitional //EN"


    // "http://www.sampleprogram.com/TR/html4/loose.dtd" >

    <html>

    <head>

    </head>

    <body>

    <p>

    This is a sample web page that is not involved with any website.

    </p>

    </body>

    </html>

    ```


    Take note that the above given example is not actually connected to any website.
    www.sampleprogram.com is nonexistent. This example is given as a mere guide for
    you to know how you should write your code.


    Anyway, you can start with this sample HTML page. You have to put it into the
    text editor and save it with a file name of "sample.html". You have to save it
    on your desktop.'
  merge: -1
  img_proc: true
