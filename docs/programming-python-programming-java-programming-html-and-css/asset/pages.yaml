  md: 'HTML & CSS


    # CHAPTER 7:

    HTML LINKS


    Your web page can feature a variety of links that directly take the user to another
    web page. It can even direct the user to specific locations on your website. These
    links are called hyperlinks. They let your visitors navigate throughout your website
    by clicking on images, words, and/or phrases. You can create a hyperlink using
    any image or text you have on your web page.


    # Text Links


    In order for you to be able to link documents, you have to specify the links using
    the anchor tag <a>. Whatever is placed between the opening <a> and closing </a>
    anchor tags become part of a link. When visitors come to your website, they can
    click the link to be directed to the corresponding document.


    The following syntax is for using the anchor tag:


    ```

    <a href = "the URL of the document "... attributes - list > the link text </a>

    ```


    To help you understand this concept further, you should take a look at the following
    example:


    ```

    <!DOCTYPE html>

    <head>

    < title > This is a basic example of a link or hyperlink. </title>

    </head>

    <body> >

    ```


    259'
