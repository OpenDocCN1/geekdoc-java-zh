- pgno: 211
  md: '# CHAPTER 3:

    HOW TO CREATE A WEBSITE


    # Fundamentals


    # Understanding HTML and CSS


    Every Web page you see online uses HTML to format its page to be displayed in
    your Web browser. Whether a website is for shopping, blogging, or researching,
    it uses HTML. All search engines, personal websites, and entertainment websites
    feature HTML.


    Keep in mind that hand coding your Web page using HTML is not the easiest way
    to make a website. Actually, it is the least efficient and slowest way to create
    it. Depending on the inclinations you have, it can even be the most tedious.


    So, if all you desire is to have a website, you should consider using a visual
    Web editor instead. A visual Web editor, also commonly referred to as WYSIWYG
    Web editor is a computer program that allows you to design a website with little
    to no technical knowledge. WYSIWYG stands for What You See Is What You Get. Basically,
    whatever you see is really what you get.


    Also, HTML alone will not do the job. If you expect to achieve the output that
    professional Web designers produce, you have to use other tools. You cannot rely
    on HTML for all the features and functions that you want.


    For instance, HTML does not suffice when you want to have at least two columns
    on your website, if you want to change colors or use a variety of font types,
    or if you want to perform other visual design tasks to make the Web page look
    more attractive and presentable.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# HTML & CSS


    This is where CSS comes in. CSS is the technology that HTML needs. You have to
    use it to control the appearance of the website. Your website will not be complete
    unless you use CSS after HTML. Both of them have to work with each other.


    The entire process seems complicated, especially to individuals who do not know
    much or anything at all about programming and Web developing. If you want to have
    it easier, you should just use a visual Web editor that instantaneously creates
    the HTML and CSS codes for.


    # Beginning HTML and CSS


    If you are ready to begin HTML and CSS, you need to get a text editor. You can
    choose from a wide variety of HTML editors. A good HTML editor provides you with
    a built-in browser window, which you can use to preview your Web page.


    A good HTML editor also features a validator, which you can use to look for any
    mistakes that you have made. It is as if you are using a spell checker in the
    word process. Then again, no spell check is perfect. Even the best one cannot
    identify every mistake present in the file. The same thing goes with it


    Thus, you have to be good at identifying errors on your own. You need to have
    a sharp eye to catch mistakes and typographical errors. If you do not have the
    skills for this but you want your work to be flawless, you can hire a writer and
    an editor. Take note that the entire Web page can suffer if you miss just one
    closing tag.


    You have to be very careful when you type your code. As much as possible, you
    have to type slowly. However, if you think that typing slowly wastes a lot of
    time, you can just hire someone else to check your work for you. Your work has
    to be checked for mistakes and typographical errors, as well as tested for functionality.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'When searching for an HTML editor on the Internet, you may find some services
    or websites that offer pre-designed templates. While these templates are convenient
    and easy to use, they prevent you from producing a unique output.


    You can use a pre-designed template to make a website, but it will not be one
    of kind. It will function the same way as other websites that also used the same
    kind of pre-designed template. Hence, it is much better to design your own website
    yourself.


    In addition, you have to keep in mind that using a Notepad is not ideal. Some
    people use Notepad for their HTML and CSS codes. Notepad is a program that comes
    with Windows computers. However, a Notepad is not exactly a proper text editor.


    If you have to code directly using HTML, you need to use a fully functional text
    editor. There are free and paid versions of text editors. If you merely use Notepad,
    it will not be able to handle all the characters and character combinations that
    you use.


    If you insist on using the Notepad, then you also have to limit the characters
    and character combinations that you use on your code. Otherwise, your file may
    end up being corrupted. Worse, you will not be notified of this. There are no
    error messages or warnings.


    What''s more, Notepad does not have the capacity to deal with huge files. Hence,
    there is a tendency for it to invoke another program such as Wordpad. When this
    happens, things can get much worse for you because Wordpad will most certainly
    corrupt the Web page.


    Even developers from Microsoft do not recommend using Notepad as a text editor.
    Notepad was created for regular computer users for the casual viewing of log files
    and other'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# HTML & CSS


