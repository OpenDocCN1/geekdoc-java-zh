  md: "# JAVA PROGRAMMING\n\ntheir Method overloading.\n\nMethod overloading may be\
    \ a very efficient concept in writing a program, but it reduces the codes readability\
    \ so its usage is not that often.\n\n# Method Value Returning\n\nThere are three\
    \ situations wherein a method exits its section and returns to the main program:\
    \ First is when the method passes through all the statements in its body Second\
    \ is when a `return` statement is encountered, and third, when an `exception`\
    \ is thrown.\n\nIt is possible to declare the return type of a method in the method\
    \ declaration. The `return` statement is then used to return the value of the\
    \ method evaluated within its body. If the return type of a method is `void`,\
    \ then it does not return any value and it is not required to contain a `return`\
    \ statement. However, in some cases, a `return` statement can be used to manipulate\
    \ program flow and exit the method—almost similar to a `break` statement. Trying\
    \ to return a value from a method with a `void` declaration will result in a compilation\
    \ error. On the other hand, if a method is not declared void, it is required to\
    \ have a `return` statement with its corresponding value.\n\nIt is also vital\
