    - Microsoft Azure 在 65 个国家拥有近 129 个接入节点，提供带有存储功能的全功能云平台。

    - KeyCDN 在 23 个国家拥有 34 个接入节点，支持 HLS 协议。

    - Akamai 在 30 个国家拥有 60 个接入节点，支持 HLS、HDS 和 DASH 协议。


