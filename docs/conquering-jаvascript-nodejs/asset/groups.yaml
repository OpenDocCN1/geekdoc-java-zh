- md: "\n# Zeba Academy – Conquering JavaScript\n\nThe “Conquering JavaScript” series\
    \ of books are authored by the Zeba Academy team members, led by Sufyan bin Uzayr,\
    \ consisting of:\n\n- Divya Sachdeva\n- Jaskiran Kaur\n- Simran Rao\n- Aruqqa\
    \ Khateib\n- Suleymen Fez\n- Ibbi Yasmin\n- Alexander Izbassar\n\nZeba Academy\
    \ is an EdTech venture that develops courses and content for learners primarily\
    \ in STEM fields and offers educational consulting and mentorship to learners\
    \ and educators worldwide.\n\nAdditionally, Zeba Academy is actively engaged in\
    \ running IT Schools in the CIS countries and is currently working in partnership\
    \ with numerous universities and institutions.\n\nFor more info, please visit\
    \ https://zeba.academy\n\n# Introduction\n\nIN THIS CHAPTER\n\n- Basic about Node.js\n\
    - Features of Node.js\n- Advantages and Disadvantages\n\nThis chapter will enlighten\
    \ us with the basics of Node.js, including its tons of features, modules, and\
    \ infrastructure. We will later discuss about the advantages and disadvantages\
    \ of using Node.js.\n\nJavaScript is without a question among the most prominent\
    \ and commonly used client-side programming languages accessible. It's primarily\
    \ utilized for online front-end development, but it's also a valuable customer\
    \ for cross-development platforms. It's also known for being utilized in a number\
    \ of other well-known ecosystems, including React Native, PhoneGap, Titanium,\
    \ Apache, NativeScript, and Appcelerator. JavaScript's scope of use has expanded\
    \ in recent years, and it is now also used for server-side development. Node.js\
    \ is without a doubt responsible for this enormous shift in web development.\n\
    \nSome in the developer community are hailing this technology, known as Node.js,\
    \ as \"the next Ruby on Rails.\" However, it isn't a silver bullet, and it is\
    \ not suitable for all programming circumstances. The obstacles to entry are surprisingly\
    \ low because the framework was created for the\n\n# 2 ■ Conquering JavaScript\n\
    \nwidely used JavaScript, and the reasons for using Node to build apps – particularly\
    \ low-latency, real-time apps – are becoming increasingly compelling.\n\nNode.js\
    \ is having a JavaScript runtime environment which is open-source and cross-platform\
    \ is a popular tool for almost any task. Node.js runs the V8 JavaScript engine,\
    \ which is at the heart of Google Chrome, outside of the browser. As a result,\
    \ Node.js is lightning-quick.\n\nThis allows Node.js to handle hundreds of concurrent\
    \ connections without incurring the overhead of thread concurrency control, which\
    \ may be a major source of mistakes.\n\nNode.js also comes with a bigger library\
    \ of JavaScript modules, which greatly facilitates the building of Node.js web\
    \ applications.\n\nNode.js = Runtime Environment + JavaScript Library\n\nSimply\
    \ said, this means that the entire site may be run on a single “stack,” allowing\
    \ you to concentrate on the project's business objectives rather than development\
    \ and maintenance. Because Node.js is open source, it is completely free to use\
    \ and is constantly updated by a global developer community. It’s important to\
    \ remember that Node.js is a runtime environment, not a framework or library,\
    \ as as is the case with traditional application software.\n\nA runtime environment\
    \ (also known as an RTE) is a set of web APIs that a developer can use to write\
    \ code, as well as a JavaScript engine to read it. This makes it lightweight,\
    \ adaptable, and simple to deploy, all of which will help you optimize and accelerate\
    \ your app project.\n\nDatatypes: Node.js includes a number of data types that\
    \ are similar to those found in JavaScript.\n\n- Boolean\n- Undefined\n- Null\n\
    - String\n- Number\n\n# Loose typing: Node.js offers loose typing, which means\
    \ you do not have to define what kind of data will be put in a variable ahead\
    \ of time. Node.js, we utilize the var keyword to declare any sort of variable.\n\
    \n# Example:\n\n```javascript\n// Variable store number data type\nvar a = 40;\n\
    console.log(typeof a);\n// Variable store string data type\na = \"GOOD MORNING\"\
    ;\nconsole.log(typeof a);\n// Variable store Boolean data type\na = false;\nconsole.log(typeof\
    \ a);\n// Variable store undefined (no value) data type\nb = No value;\nconsole.log(typeof\
    \ a);\n```\n\nObjects and functions: Node.js objects are the same as JavaScript\
    \ objects, in that they are analogous to variables and contain multiple values\
    \ typed as name: value pairs. The name and value in the program is separated by\
    \ a colon, and each pair is separated by a comma.\n\n# Example:\n\n```javascript\n\
    var company = {\nName: \"JOHNNY DEPP\",\nAddress: \"LOS ANGELIS\",\nContact: \"\
    +1198665432109\",\nEmail: \"johnny.depp@yahoo.org\"\n};\n// Display the object\
    \ information\nconsole.log(\"Data of Customer:\", customer);\n// Display the type\
    \ of variable\nconsole.log(\"Data of Customer:\", typeof customer);\n```\n\nFunctions:\
    \ Functions in Node.js are defined by using the function keyword, followed by\
    \ the function's name and parameters. We don't have to declare datatypes for the\
    \ parameters in Node.js, and we do not have to\n\n# 4 Conquering JavaScript\n\n\
    check the amount of arguments\n\n# Example:\n\n```javascript\n// Functions in\
    \ Node.js are defined by using the function keyword,\n// followed by the function's\
    \ name and parameters.\n// We don't have to declare datatypes for the parameters\
    \ in Node.js.\n\nfunction divide(num1, num2) {\n    return num1 / num2;\n}\nconsole.log(divide(10,\
    \ 2));\n```\n\nObjects and functions: Node.js objects are the same as JavaScript\
    \ objects, in that they are analogous to variables and contain multiple values\
    \ typed as name: value pairs. The name and value in the program is separated by\
    \ a colon, and each pair is separated by a comma.\n\n# Example:\n\n```javascript\n\
    var company = {\n  Name: \"JOHNNY DEPP\",\n  Address: \"LOS ANGELIS\",\n  Contact:\
    \ \"+1198665432109\",\n  Email: \"johnny.depp@yahoo.org\"\n};\n// Display the\
    \ object information\nconsole.log(\"Data of Customer:\", customer);\n// Display\
    \ the type of variable\nconsole.log(\"Data of Customer:\", typeof customer);\n\
    ```\n\nFunctions: Functions in Node.js are defined by using the function keyword,\
