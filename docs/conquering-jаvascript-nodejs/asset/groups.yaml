    \ us more flexibility and convenience when developing websites or web apps because\
    \ we can use a single language for everything.\n\n# Conquering JavaScript\n\n\
    ## HOW TO CREATE AN ANGULAR APP USING NODE.JS\n\nWe can create Angular apps in\
    \ a variety of methods and deploy them to production. One method is to create\
    \ Angular using Node.js or Java, while another one is to create Angular and deliver\
    \ static content using the NGINX web server. With Node.js, we must also deal with\
    \ server code; for example, we must use node to load the index.html page.\n\n\
    ### Introduction\nAngular is a JavaScript framework for developing online apps\
    \ that does not require the browser to be open. We need a system that loads Angular’s\
    \ index.html (single page) in the browser together with all of its dependencies\
    \ (CSS and JS files). The web server in this example is node, which loads Angular\
    \ assets and takes APIs from the Angular app.\n\n### Prerequisites\nFor this,\
    \ there are a few prerequisites. We'll need node.js installed on our laptop, as\
    \ well as an understanding of how HTTP works. We will need them on our laptop\
    \ if we want to practice and run this on it.\n\n- ngx-bootstrap\n- Node.js\n-\
    \ Angularscript\n- Typescript\n- VSCode\n\n### Project Exercising\nThis is a small\
    \ project that shows how to create and operate an Angular application using Node.js.\
    \ We have a simple software that allows us to add people, count them on the side,\
    \ and retrieve them at any time.\n\nWe make an API call to the node.js server\
    \ to store users as we add them, and we obtain the same data from the server when\
    \ we retrieve them. In the video below, we can watch network calls.\n\nThe GitHub\
    \ page for this project may be found here. We can clone and run it on our own\
    \ machine.\n\n```\n// clone the project\nhttps://github.com/bbachi/angular-Node.js-example.git\n\
    ```\n\n```\n// install and start the project\nnpm install\nnpm start\n```\n\n\
    Only a minimal bit of Node.js is required for this project.\nIf we're new to Node.js,\
    \ don't worry; this brief description will get us up and running with this project.\
    \ We can skip this section if we are already familiar with Node.js. For server-side\
    \ applications, Node.js is an asynchronous event-driven JavaScript runtime environment.\
    \ The most recent version of Node.js is 12, which we may download from this link.\
    \ We can download the Node.js package and install it on our laptop by clicking\
    \ on any LTS link. The command node -v can be used to determine the Node’s version.\
