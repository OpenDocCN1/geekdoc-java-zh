  mdcn: "\n\n## 总结 ■ 149\n\n导入 express 并定义两个路由：/API/users 和 /API/user，以及一个监听在 3080\
    \ 端口的服务器。可以在此处找到 server.js 文件。为了处理 HTTP 请求对象中的数据，我们利用了 body-parser。\n\n```javascript\n\
    const express = require('express');\nconst app = express()\nconst bodyParser =\
    \ require(\"body-parser\");\nport = 3080;\n```\n\n```javascript\nconst users =\
    \ [];\n```\n\n```javascript\napp.use(bodyParser.json());\n```\n\n```javascript\n\
    app.get('/api/users', (req, res) => {\n  res.json(users)\n});\n```\n\n```javascript\n\
    app.post('/api/user', (req, res) => {\n  const user = req.body.user;\n  users.push(user);\n\
    \  res.json(\"user added\")\n});\n```\n\n```javascript\napp.get('/', (req, res)\
    \ => {\n  res.send('App Works !!!!')\n});\n```\n\n```javascript\napp.listen(port,\
    \ () => {\n  console.log(`Server listening on the port: ${port}`);\n});\n```\n\
    \n当我们使用命令 `npm run demand` 启动 Node.js API 时，无论修改哪个文件，它都会自动更新。\n\n## ANGULAR 应用\n\
    \nNode.js API 现在可以通过 3080 端口访问。现在是时候查看一下 Angular 应用了。my-app 文件夹包含了完整的 Angular\
    \ 应用。通过命令 `ng new my-app`，我们可以构建一个新应用。我不会在这里发布所有文件；相反，我们可以在上面的 Github 站点或此处查看所有它们。\n\
    \n## 攻克 JavaScript\n\n让我们来看一些关键文件。这是一个使用 node API 的服务文件。\n\n```typescript\nimport\
    \ { Injectable } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
    \n@Injectable({\n  providedIn: 'root'\n})\nexport class AppService {\n\n  constructor(private\
    \ http: HttpClient) { }\n\n  rootURL = '/api';\n\n  getUsers() {\n    return this.http.get(this.rootURL\
    \ + '/users');\n  }\n\n  addUser(user: any) {\n    return this.http.post(this.rootURL\
    \ + '/user/',\n    {user});\n  }\n}\n```\n\n订阅这些请求并从 API 获取数据的应用组件如下代码所示：\n\n\
    ```typescript\nimport { Component, OnDestroy } from '@angular/core';\nimport {\
    \ FormGroup, FormControl, Validators } from '@angular/forms';\nimport { AppService\
    \ } from './app.service';\nimport { takeUntil } from 'rxjs/operators';\nimport\
    \ { Subject } from 'rxjs';\n\n@Component({\n  selector: 'app-root',\n  templateUrl:\
    \ './app.component.html',\n  styleUrls: ['./app.component.css']\n})\n```\n\n##\
    \ 总结 ■ 151\n\n```typescript\nexport class AppComponent implements OnDestroy {\n\
    \n  constructor(private appService: AppService) {}\n\n  title = 'angular-Node.js-example';\n\
    \n  userForm = new FormGroup({\n    firstName: new FormControl('', Validators.required),\n\
    \    lastName: new FormControl('', Validators.required),\n    email: new FormControl('',\
    \ Validators.required)\n  });\n\n  users: any[] = [];\n  userCount = 0;\n\n  destroy$:\
    \ Subject<boolean> = new Subject<boolean>();\n\n  onSubmit() {\n    this.appService.addUser(this.userForm.value);\n\
    \    pipe(takeUntil(this.destroy$)).subscribe(data => {\n      console.log('message:::',\
    \ data);\n      this.userCount = this.userCount + 1;\n      console.log(this.userCount);\n\
    \      this.userForm.reset();\n    });\n  }\n\n  getAllUsers() {\n    this.appService.getUsers().pipe(takeUntil(this.destroy$)).subscribe((users:\
    \ any[]) => {\n      this.users = users;\n    });\n  }\n\n  ngOnDestroy() {\n\
    \    this.destroy$.next(true);\n    this.destroy$.unsubscribe();\n  }\n}\n```\n\
    \n## 152 攻克 JavaScript\n\n### Angular 和 Node API 的协同工作\n\n在开发期间，Angular 应用运行在\
    \ 4200 端口，由 webpack 开发服务器支持，3080 端口上由 Node.js API 支持。\n\n这两者应该以某种方式进行交互。所有的 API\
    \ 调用都可以被代理到 Node.js API。Angular 内置了代理技术。首先，我们必须定义位于 my-app 文件夹中的 `proxy.conf.json`。\n\
    \n```json\n{\n  \"api\": {\n    \"target\": \"http://localhost:3080\",\n    \"\
    secure\": false\n  }\n}\n```\n\n如果我们检查该文件，我们会注意到所有以 /api 开头的路径都将重定向到 http://localhost:3080，这是\
    \ Node.js API 运行的地方。随后必须在 `angular.json` 的 `serve` 部分下定义 `proxyConfig` 键。\n\n\
    ```bash\n// Node.js API (终端 1)\nnpm run dev\n// Angular app (终端 2)\nnpm start\n\
    ```\n\n### 如何创建一个生产就绪的项目\n\n在 webpack 开发服务器的支持下，Angular 应用运行在 4200 端口。当在生产环境中运行运行时，情况并非如此。我们必须创建\
    \ Angular 项目并使用 node 服务器。\n\n"
