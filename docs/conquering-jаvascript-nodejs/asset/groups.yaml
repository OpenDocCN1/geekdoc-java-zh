- md: "\n## Code Optimization ■ 117\n\nUsing the Node.js file system, we used the\
    \ file read operation in both models.\n\n### Synchronous\n\n```javascript\nconst\
    \ fs = require('fs');\nconst content = fs.readFileSync(\"app.txt\", \"utf8\");\n\
    console.log(content);\nconsole.log('waiting for the file to read......');\n```\n\
    \n### Asynchronous\n\n```javascript\n//include file system module\nconst fs =\
    \ require('fs');\n//readFile() reads the file - Note: original text had readFileSync\n\
    fs.readFile(\"app.txt\", \"utf8\", function (err, content) {\n  if (err) {\n \
    \   return console.log(err);\n  }\n  //read the file\n  console.log(content);\n\
    });\nconsole.log('waiting for the file to read.....');\n```\n\nAll operations\
    \ are suspended until the synchronous fragment completes the data processing.\
    \ Before printing the data and message to the console, readFileSync will read\
    \ the file and store its data in memory.\n\nThe console message will be printed\
    \ asynchronously as the system does other activities. Even though it was the last\
    \ command, “waiting for the file to read\" is printed before the file content.\
    \ When the file is read, a callback function will be called. Our application will\
    \ run faster using the asynchronous approach, and will avoid the so-called Call-back\
    \ Hell.\n\n## Query Augmentation\n\nConsider having a database table over one\
    \ million rows of data to query. The procedure generated by this database to obtain\
    \ the data's end point will have a significant impact on the performance of our\
    \ application. Bad queries will slow down our application, leaving our users frustrated.\
    \ Query optimization is the solution to this problem.\n\n## 118 Conquering JavaScript\n\
    \n### OVERVIEW OF BASIC STRATEGIES FOR IMPROVING DATABASE PERFORMANCE OPTIMIZATION\n\
    \nSELECT Should Be Avoided at All Costs\n\nThis would seem to be the most apparent\
