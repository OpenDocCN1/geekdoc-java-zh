    # THE V8 JAVASCRIPT ENGINE


    The JavaScript engine that drives Google Chrome is known as V8. It is the component
    that interprets our JavaScript and runs it in Chrome. The JavaScript engine, also
    known as V8, parses and executes JavaScript code. The browser provides the DOM
    and other Web Platform APIs (which together create the runtime environment). The
    JavaScript engine is unique in that it is unaffected by the browser in which it
    is run. The emergence of Node.js was aided by this essential feature. V8 was chosen
    to power Node.js back in 2009, and by the popularity of Node.js grew, V8 evolved
    into the engine that powers an astounding amount of server-side JavaScript code.
    Thanks to V8, which also powers desktop apps with projects like Electron, the
    Node.js ecosystem is massive.


