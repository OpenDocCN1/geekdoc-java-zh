    # 36 Conquering JavaScript


    The WebSockets protocol supports a quick two-way exchange of messages between
    the client and the server over one open connection, and Node''s event-based architecture
    works well with it. Installing WebSockets libraries on both the server and client
    sides allows us to construct real-time communications with reduced overheads,
    latency, and data transmission than most other, more traditional methods. WebSockets
    are so well in Node, thanks to packages such as socket.io, ws, and WebSocket-node,
    which allows users to easily create real-time chats and applications. To construct
    a basic live chat using socket.io, for example, all we have to do install the
    socket.io library on both the web server and the client, then create event emitters
    and broadcasters to push messages over the WebSockets open connection. This basic
    capability can be created with only a few lines of code.


    # BUILDING APPLICATION WITH NODE.JS


    There are several approaches to developing a real-time communication technology.
    HTTP Long polling and WebSockets are used in two of the most prevalent ways. This
    chapter will walk you through a simple Socket.io tutorial for creating a real-time
    chat. So, let us begin writing the code to better understand its working and design.


    # What Are WebSockets and How Do I Use Them?


    WebSockets are a mesmerizing technology in and of themselves, and now let us look
    at what it is in more detail.


    # Definition of WebSockets


    WebSockets API is a technology that allows a client and a server to communicate
    in a bidirectional manner. This means that when requesting data from both the
    server and the database, the client longer needs to be the transaction''s starter.


    # What Are WebSockets and How Do They Work?


    Typically, a client requests data when establishing a new connection, and subsequently
    the connection is lost. The data-sending server is also only connected during
    the exchange. Apart from accepting data, the socket.io establishes an initial
    connection with the backend server when using WebSockets. The WebSocket handshake
    is the name for this procedure. The request includes the Upgrade header. This
    is how the client connects to the server and informs it that it needs to establish
    a connection.'
