    \ State, Zip\nFROM Customers\n```\n\nEven though we don't require all of the fields\
    \ in this database, the initial query will pull them all. Because the second query\
    \ will only return the required fields, it will be the more efficient approach\
    \ to execute the SELECT statement. When using the INSERT and UPDATE commands,\
    \ the same principle should be applied.\n\n### Use the WHERE Clause\n\nThe query's\
    \ purpose is to retrieve the relevant records from our database. The WHERE clause\
    \ aids in record filtering and restricts the number of records pulled based on\
    \ constraints. The WHERE clause takes the role of the HAVING clause, which chooses\
    \ records prior to filtering the dataset. WHERE statements in SQL are far faster\
    \ because they reduce the amount of data that the database engine has to process.\n\
