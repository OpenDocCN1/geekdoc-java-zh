    # 征服 JavaScript 系列


    # 征服 JavaScript

    Node.js


    编辑：


    # Sufyan bin Uzayr


    CRC Press

    Taylor & Francis Group


    ## 征服 JavaScript


    毫无疑问，JavaScript 是可用最卓越且最常用的客户端编程语言之一。近年来，JavaScript 的使用范围不断扩大，现在它也被用于服务器端开发。Node.js
    是一个极其流行的 JS 框架，旨在用于快速 Web 和应用程序的开发。


    **征服 JavaScript：** Node.js 帮助读者掌握 Node.js 框架，以实现更快、更健壮的开发。本书是一份详细的指南，帮助开发者和编码人员利用
    Node.js 实现更多功能。它简要介绍了基础知识，然后进入更高级、更的练习，帮助读者快速获得所需的知识。


    **核心特性：**


    - 讨论如何使用 Node.js 解决现实实际问题

    - 提供全栈开发的完整覆盖

    - 涵盖使用 Node.js 服务器端开发


    这本书对于 Node.js 开发者以及参与游戏开发、移动应用、渐进式应用（现在甚至是桌面应用）的人员来说，都是非常有价值的参考书。


    ## 关于系列丛


    《征服 JavaScript》系列涵盖了广泛的主题，专门涉及 JavaScript 编程生态系统，如框架和库。该系列的每本书都专注于一个单一主题，并详细阐述该主题，特别关注真实世界的用法和以代码为中心的方法，遵循行业标准的编码范式，以帮助学习者获得对现实项目实用的专业知识。


    该系列书籍的一些关键方面包括：


    - 清晰易懂的文字，涵盖各种 JavaScript 相关的主题，并按相关性排序。

    - 特别关注实践练习，提供大量的代码示例和程序。

    - 引导式的 JS 编码方法，带有分步教程和演示。

    - 高度强调技能的现实实用性，从而剔除冗余和很少使用的概念以及臃肿软件。

    - 广泛的参考文献和资源，帮助读者从书中获得最大收益。


    《征服 JavaScript》系列书籍假设对编码基础有基本的了解。


    《征服 JavaScript》由 Sufyan bin Uzair 编辑，他是一位在计算领域拥有十年经验的作家和教育者。Sufyan 拥有多个学位，并在全球的大学和机构任教。到此为止，Sufyan
    已编写和编辑了 50 多本书，为该系列带了丰富的经验。可以在 sufyanism.com 了解更多关于他的作品。


    https://www.routledge.com/Conquering-JavaScript/book-series/CRCCONJAV


