    # The Pursuit of Excellence


    V8 is written in C++ and is updated on a regular basis. It is portable and works
    on Mac, Windows, Linux, and a variety of other operating systems. We will disregard
    the implementation specifics of V8 in this V8 introduction because they may be
    obtained on more authoritative sites (e.g., the V8 official site!) and they change
    over time, frequently dramatically. V8, like other JavaScript engines, is always
    improving to improve the Web and the Node.js environment. There has been a performance
    race on the web for years, and we (as users and developers) have benefited greatly
    from it because we get faster and better optimized machines year after year.


    # Compilation


    Although JavaScript is commonly thought of as an interpreted language, contemporary
    JavaScript engines do more than just interpret; they also compile it. This has
    been gone from going since 2009, when the Spider Monkey JavaScript compiler was
    included in Firefox 3.5, and everyone has been following suit. V8 compiles JavaScript
    internally with just-in-time compilation to speed up execution. This may sound
    counterintuitive, but JavaScript has gone from a language that typically executed
    a few lines of code to execute programs with tens to hundreds of thousands of
    lines running in the browser since the release of Google Maps in 2004. Rather
    than simply a few validation rules or simple scripts, our applications can now
    run for hours inside a browser. Compiling JavaScript makes sense in this new world
    while it may take a little longer to get the JavaScript ready, will be significantly
    more performant than solely interpreted code once it is.


