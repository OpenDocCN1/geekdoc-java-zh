    ## Introduction ■7


    ## Editor of Text


    This really is the place in which you''ll write your code. Editors encompass Windows
    Notepad, OS Edit command, Brief, Epsilon, EMACS, and vim or vim, to name a few.
    On different operating systems, the name and version of the text editor may differ.
    For example, Windows Notepad will be utilized, while vim or vi can be used on
    both Windows and Linux or UNIX. Source files are files that contain program source
    code that you produce with your editor. The suffix ".js" is commonly used for
    source files in Node.js projects. Before you begin programming, make sure you
    have a text editor installed and you have sufficient expertise writing a computer
    program, saving it to a file, and then running it.


    ## The Runtime for Node.js


    JavaScript is used to write the source code in the source file. Your JavaScript
    code will be interpreted and executed using the Node.js interpreter. The Node.js
    distribution supports SunOS, Linux, Mac OS, and Windows operating systems with
    32-bit (386) and 64-bit (amd64) x86 CPU architectures.


    ## The Node.js Archive Can Be Downloaded Here


    Node.js Downloads the most recent version of the Node.js installable zip file.
    The versions available on various OSs at the time of authoring this book are listed
    below.


    | OS | Achieve name |

    | :--- | :--- |

    | Windows | node-v18.2.0-x64.msi |

    | Linux | node-v18.2.0-Linux-x64.tar.gz |

    | Mac | node-v18.2.0-darwin-x64.tar.gz |

    | SunOS | node-v18.2.0-sunos-x64.tar.gz |


    ## UNIX/LINUX/MAC OS X AND SUNOS INSTALLATIONS


    Download and extract the node-v6.3.1-osname.tar.gz archive into /tmp, then move
    the extracted files to the /usr/local/nodejs directory, depending on your OS architecture.


    ## Windows Installation


    To install Node.js, run the MSI file and follow the instructions.


    ## Conquering JavaScript


    The installer uses the Node.js package from C: Program Files\nodejsjs by default.
    The PATH environment variable on Windows should be set to the C: Program Files\nodesbin
    directory by the installer. Restart any open command prompts to make the change
    effect.


    ### Node.js Has a Number of Features

    The following are some of the key features that make Node.js the architect''s
    first choice:


    - *Asynchronous and event-driven*: The APIs in the Node.js library are all asynchronous
    (nonblocking) which is that a Node.js server will never wait for data from an
    API and will move on to the next API after visiting the previous one, and to a
    notification mechanism called Node.js aids the server in obtaining a response
    from the previous request.

    - *Speed*: Node.js library is highly quick in code execution because it is built
    on Google Chrome''s V8 JavaScript Engine.

    - *Single-threaded*: It uses single-threaded paradigm with event looping, making
    it very scalable. The event method allows the server to respond in a nonblocking
    and scalable manner, unlike traditional servers that generate restricted threads
    to process requests. It makes use of a single-threaded program that can handle
    significantly more requests than traditional servers like Apache HTTP Server.

    - *No data buffering*: In a Node.js application, no data is ever buffered. These
    programs just output the data in pieces.

    - *License*: The MIT license governs the distribution of Node.js.


    ### Who Makes Use of Node.js?

    The following is a link to a GitHub page that has an exhaustive list of Node.js
    projects, applications, and enterprises. eBay, General Electric, GoDaddy, Microsoft,
    PayPal, Uber, Wikipins, Yahoo!, and Yammer are just a few of the companies on
    this list.


    ### When Should You Use Node.js?

    The areas where Node.js is proving to be an excellent technology partner are as
    follows:


    - *Applications that are I/O bound*

    - *Streaming data applications*

    - *A lot of data applications that run in real time (DIRT)*

    - *Applications based on JSON APIs*

    - *Applications that are only one page long*


    ## THE BENEFITS OF NODE.JS


    There are several elements that a CTO or a tech professional must consider while
    considering Node.js advantages and downsides for our web app, for scalability
    of technology, speed, performance, application constraints, and so on. The speed
    with which your application reaches the market is determined by the decisions
    you make at this stage.


    On the internet, JavaScript is the most widely used client-side. After the launch
    of Node.js, in 2009, it has become incredibly simple. Let’s look at the advantages
    of using Node.js.


    ### Scalability Is Straightforward

    The most compelling feature of Node.js is how easy it is to scale. By adding new
    nodes to the existing system, applications can be horizontally.


    ### Simple to Comprehend

    Most developers are familiar with JavaScript since this is among the most often-used
    programming languages. Because JavaScript is supported by almost all browsers,
    it makes putting the code into operation much easier.


    ### Recognized for Delivering Exceptional Results

    As suggested previously, Node.js understands code Google''s V8 JavaScript engine
    compiles code instantly into machine code. The runtime environment improves code
    performance.


    ### The Advantages of Caching

    Individual elements could also be cached in Node.js'' runtime environment. The
    first module is cached in the program memory every time it is requested. Because
    caching helps programs to load web pages faster and respond to users more quickly,
    developers do not have to execute the codes.


    ### Allows You to Build Own Applications

    Another advantage of Node.js is its versatility in creating apps and software.
    When it comes to imposing rules, Ruby on Rails is missing this capability.


    ### Handles a Large Number of Requests at Once

    Since Node.js provides the option of using nonblocking I/O systems, developers
    can handle multiple queries in one go. Competing platforms, such as Ruby or Python,
    struggle to manage simultaneous queries as well as this system.


    ### Node.js is a Framework with a Lot of Flexibility

    Node.js is well known for its extensibility, which means you may modify and expand
    it to match your individual requirements. JSON can also be used to provide a means
    for data to be exchanged between the web server and the client. It also comes
    with built-in APIs for creating HTTP, TCP, and DNS servers, among other things.


    ### A Large and Active Group Provides Community Support

    Node.js has a big and active developer community that is always contributing to
    its development.


    ### Full-Stack Node.js

    Node.js is a full-featured option for the-side.


    ### API Instability: Significant Code Changes as a Result of Unstable API

    Frequent API updates and the lack of stability that comes with them are one of
    the major problems of Node.js that most developers have to cope with. As a result,
    developers are compelled to update the access code on a regular basis to ensure
    compliance with the current version of the Node.js API.


    ### Your Code May Be Jeopardized If You Do Not Have a Library Support System

    Many Node.js NPM registries and libraries are of poor quality, incomplete, and
    poorly described. As a result, if amateurs construct a web application in Node.js,
    this insufficient monitoring becomes complicated.

