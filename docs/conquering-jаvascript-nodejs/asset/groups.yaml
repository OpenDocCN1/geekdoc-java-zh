    ## 86 Conquering JavaScript


    ### Authentication That Is Safe


    Tokens, auth0, jwt, and other authentication mechanisms are available for Node.js
    apps. Each has its own set of merits and demerits when viewed through the lenses
    of the IoT. Tokens are useful, but they aren''t totally secure. They''re a terrific
    technique to authenticate that let you identify a specific user and decide whether
    or not to provide them access.


    An encrypted token or login/password data is stored in firmware by the IoT ecosystem.
    Someone can steal the token if they have physical access to the device, which
    also applies to jwt and auth0.


    By integrating any server-side authentication tools into the Node.js framework,
