    # CONQUERING JAVASCRIPT SERIES


    # Conquering JavaScript

    Node.js


    EDITED BY


    # Sufyan bin Uzayr


    CRC Press

    Taylor & Francis Group


    ## Conquering JavaScript


    JavaScript is without a question among the most prominent and commonly used client-side
    programming languages available. JavaScript''s scope of use has expanded in recent
    years, and it is now also used for server-side development. Node.js is an extremely
    popular JS framework, meant for rapid web and application development.


    **Conquering JavaScript:** Node.js helps the reader master the Node.js framework
    for faster and more robust development. The book is a detailed guide that will
    help developers and coders do more with Node.js. It discusses the basics in brief,
    and then moves on to more advanced and detailed exercises to help readers quickly
    gain the required knowledge.


    **Key Features:**


    - Discusses how to use Node.js for real-world practical solutions

    - Provides complete coverage of full-stack development

    - Covers server-side development with Node.js


    This book is a valuable reference for Node.js developers as well as those involved
    in game development, mobile apps, progressive applications, and now even desktop
    apps.


    ## About the Series


    The Conquering JavaScript series covers a wide range of topics, pertaining specifically
    to the JavaScript programming ecosystem, such as frameworks and libraries. Each
    book of this series is focused on a singular topic, and covers the said topic
    at length, focusing especially on real-world usage and code-oriented approach,
    adhering to an industry-standard coding paradigm, so as to help the learners gain
    practical expertise that can be useful for real-world projects.


    Some of the key aspects of books in this series are:


    - Crystal-clear text, spanning various JavaScript-related topics sorted by relevance.

    - Special focus on practical exercises with numerous code samples and programs.

    - A guided approach to JS coding with step-by-step tutorials and walkthroughs.

    - Keen emphasis on the real-world utility of skills, thereby cutting the redundant
    and seldom-used concepts and bloatware.

    - A wide range of references and resources to help the readers gain the most out
    of the books.


    The Conquering JavaScript series of books assume a basic understanding of coding
    fundamentals.


    Conquering JavaScript is edited by Sufyan bin Uzair, a writer and educator having
    over a decade of experience in the computing field. Sufyan holds multiple degrees,
    and has taught at universities and institutions worldwide. Having authored and
    edited over 50 books thus far, Sufyan brings a wide array of experience to the
    series. Learn more about his works at sufyanism.com.


    https://www.routledge.com/Conquering-JavaScript/book-series/CRCCONJAV


