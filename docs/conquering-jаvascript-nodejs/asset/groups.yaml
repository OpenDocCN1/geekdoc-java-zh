    \ will be returned by LIMIT. When using LIMIT to enforce a limit on a dataset,\
    \ be sure the results are desirable and relevant. For example, if our Customer\
    \ table has 500 records and we only require the first 100, LIMIT is an efficient\
    \ technique to sample out the desired results while avoiding the remaining 400\
    \ records.\n\nHere's an illustration:\n\n```sql\nSELECT FirstName, LastName, Address,\
    \ City, State, Zip\nFROM Customers LIMIT 100\n```\n\n### Avoid CHOOSE A UNIQUE\
    \ OPTION\n\neliminates duplicate records by grouping them to produce unique results.\
    \ Customers are shown in our table as an example.\n\n```sql\nSELECT DISTINCT Name,\
    \ Surname, State, Zip FROM Customers\n```\n\nSome common name and surnames, such\
    \ as Johnny Depp, may be grouped together. As a result, the number of records\
    \ will be incorrect. When a table contains a high number of customers with the\
    \ name “David Smith,” this query may take a long time to run. Use a more precise\
    \ and efficient query such as:\n\n```sql\nSELECT FirstName, LastName, State, Zip\
    \ FROM Customers\n```\n\nThe number of records will be correct, as well.\n\n###\
    \ Use the Wildcard (Percent) Character as Needed\n\nIf you want to SELECT consumers\
    \ with first names that begin with the letter “Avi,”:\n\nFirst query\n\n```sql\n\
    SELECT FirstName from Customers where FirstName like '%avi%'\n```\n\nSecond query\
    \ 2\n\n```sql\nSELECT FirstName from Customers where FirstName like 'avi%'\n```\n\
    \nFirstNames such as Avishek, Avinash, or Avik will be retrieved in the first\
    \ query. This approach is inefficient since it may return unexpected results,\
    \ such as David, Xavier, or Davin, if the FirstNames contains the letter “Avi.”\
    \ This wildcard may be performed more efficiently using the second query.\n\n\
    ### Using Off-Peak Hours to Run Queries\n\nWhen the number of concurrent users\
    \ is at its lowest, analytical and data-management queries should be run in the\
    \ production database; usually between the hours of 3 a.m. and 5 a.m.\n\nCheck\
    \ out this article about MySQL query performance enhancement. It contains important\
    \ MySQL hints that will help us improve our query writing skills.\n\n## GO WITHOUT\
    \ A SESSION\n\nSession information is saved in memory. As our app's traffic rises,\
    \ more sessions will be produced, potentially causing substantial server burden.\
    \ We must find a way to save session data or a way to reduce the quantity of data\
