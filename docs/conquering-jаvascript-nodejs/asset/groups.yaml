    定期进行缓存是提高性能的一种极佳方法。缓存可能很困难，因此我们需要工具来帮助；我们可以有效地缓存应用程序，例如：


    - Redis 缓存设计用于在单线程中处理缓存数据请求，并且是完全异步的。考虑尝试一下。它是一个易于使用的 API，用于管理我们的客户端和服务器端缓存。

    - Memcached 是一种分布式内存系统，可以在多个节点上保存数据。它利用了具有哈希表功能的哈希方案。这些设计确保了添加或删除服务器节点不会影响键到服务器节点的映射。

    - Node-set 的缓存 `get` 和 `delete` 方法与 Memcached 的方法几乎等同。它有一个超时机制，当超时过期时从缓存中删除数据。

    - Nginx 将有助于负载均衡。Nginx 将有助于对静态文件进行缓存，使应用程序能够专注于其他任务。它具有极低的内存占用和高并发性。


    ## 改进数据管理技术


    优化数据管理技术对性能至关重要，因为它简化了系统流程并提高了应用程序的整体效率。我们可能会思考 Node.js 应用程序中哪些部分可以进行优化。从查看如何管理数据开始。Node.js
    程序可能会因为 CPU/IO 密集型任务（例如数据库查询或缓慢的 API 请求）而变慢。在 Node.js 项目中，数据是通过发送 API 请求并返回响应来获取的。


    ## 实现此点的有效方法是什么？


    分页（Pagination）是一种常见的方法，它将响应划分为内容批，可以在保留提供给用户客户端的大量数据的同时，优化响应。


    过滤（Filtering）是一种实用的策略，因为它允许客户端根据其自身的标准来限制结果。这会减少总调用次数和显示的结果数量，同时也允许用户根据其需求更精确地确定是否提供了所需的资源。在
    REST API 设计中，这两个原则被频繁使用。


    ## 征服 JavaScript


    数据获取有两种方式，即为获取不足（underfetching）和获取过度（overfetching）。前者提供了比客户端所需的更多的数据，而后者则未能提供必要的数据，导致需要后续调用不同的端点来完成数据收集。这两个问题可能会在客户端侧出现，其结果是
    API 扩展不足。GraphQL 解决了这种情况，因为服务器不需要猜测客户端想要什么；客户端指定它们的请求并准确地获得它们想要的内容。


    ## 负载均衡


    创建能够处理大量连接的高性能应用程序是一个典型的挑战。为了维持连接，一种频繁的选择是分配流量。负载均衡是这种方法的术语。为了管理多个连接，Node.js 允许我们克隆应用程序实例。这可以通过单台多核服务器或多个服务器来实现。引入的
    `cluster` 模块可以通过生成新的进程工作线程（每个 CPU 核心一个）在多核服务器上扩展 Node.js 应用，这些线程都会同时运行并连接到单个主进程，允许进程共享服务器端口。它充当一个单一的大型多线程
    Node.js 服务器。我们可以使用 `cluster` 模块来实现负载均衡，并使用轮询（round-robin）技术将传入的连接分配到环境中众多 CPU
    核心上的所有工作线程。


    使用 PM2 进程管理器来保持应用程序无限运行是另一种选择。它通过在发生代码更新或错误时重启程序来防止停机。PM2 包含一个集群功能，允许我们在所有核心上运行数多个进程，而无需担心修改代码以适应原生的
    `cluster` 模块。单集群设计有缺点；我们计划从单服务器架构转变为带有反向负载均衡的多服务器架构。


    它（NGINX）允许在多个 Node.js 服务器上进行负载均衡，并提供多种负载均衡策略：


    - 轮询（Round robin）：将新请求路由到列表中的下一个服务器。

    - 最少连接（Least connections）：将新请求路由到活动连接最少的服务器。

    - IP 哈希（IP hash）：将客户端 IP 地址哈希后发送到相应的服务器。


    ## 代码优化 ■ 115


    当使用多个应用程序服务器时，代理功能保护 Node.js 服务器免受直接互联网流量的影响，并赋予我们很大的自由度。


    ## 安全客户端认证


    如果你想为用户提供定制化体验，大多数 Web 应用必须保留状态。如果用户可以登录我们的网站，我们需要跟踪他们的会话（sessions）。


    在实现有状态认证时，我们通常会生成随机会话标识符，将会话详情保存在服务器上。我们可以使用像 Redis 这样的中央存储解决方案来存储会话数据，或使用 IP
    哈希方法（负载均衡）来确保在将有状态解决方案扩展到跨多个服务器的负载均衡应用程序时，用户始终能到达同一个 Web 服务器。使用单个服务器有一些缺点，例如，如果该服务器需要维修，就会导致问题。


    另一种可扩展的方法是使用 JWT 的无状态认证，可能更好。它的好处是始终可访问的，无论哪个系统为用户提供服务。当用户登录时，典型的 JWT 实现会生成一个令牌（token）。该令牌是包含所需信息的
    JSON对象的 base64 编码。客户端获取令牌，并用于验证所有 API 请求。


    ## 保持代码的轻量与紧凑


    在设计移动端和 Web 应用时，确保我们使用了保持代码库最小化的原则。这适用于客户端和服务器代码。结果是延迟和加载时间将缩短。对于保持代码简洁，单页 Web
    应用（SPA）是一个极佳的选择。假设我们的 Web 应用有一个页面，页面上有几个 JavaScript 文件。当我们在浏览器中访问此页面时，它会对其发起六次
    HTTP 调用。


    Node.js 有许多开源库和模块。在开发阶段，我们应该考虑为什么使用某个框架而不是另一个。关键点是，使用框架应该是值得的。这并不是说选择


    ## 征服 JavaScript


    是一个糟糕的主意。框架是极好的。它们具有可扩展性并有明显的优势。只有当框架能让我们的代码更容易理解时才使用它。


    ### 使用 WebSocket 进行有效的服务器通信


    HTTP 请求/响应模型长期以来一直是互联网的基础。在应用程序中，WebSocket 是 HTTP 的替代方案。它们允许客户端和服务器进行双向长期的通信。一旦建立了通道，它将保持开启状态，允许客户端和服务器快速可靠地进行通信。


    HTTP 对于数据共享和客户端驱动的通信是有效的。通过 WebSocket，服务器可以在客户端未显式请求之前向其传递消息，允许它们同时对话。这对于实时和长期通信是理想的。


    ### 异步编码


    Node.js 使用单线程并发架构。为了提供非阻塞的操作流，Node.js 大量使用异步代码。得益于异步 I/O，在第一次传输完成之前其他处理就可以继续。同步编码可能会导致我们的网站无法访问。它采用了阻塞操作，可能会导致我们的主线程阻塞，从而导致网页速度大幅下降。我们可以利用队列来监控异步工作流，允许我们附加额外的任务并添加额外的回调，而不会停止主线程。


