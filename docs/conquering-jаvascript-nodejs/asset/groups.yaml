    \ --collection policeData --drop --file ./path/to/json.json\n```\n\nNow, before\
    \ beginning your database, we should familiarize ourselves with how indexes in\
    \ MongoDB (or any database) function. An index is a data structure or a particular\
    \ arrangement of data that allows you to search for information quickly. This\
    \ allows you to access results without having to search the full database.\n\n\
    For example, suppose you kept student information in a book in ascending order\
    \ of their names, implying that we have an index on the name field. That way,\
    \ if we needed information on a person named Tyrion, we could instantly find it\
    \ without having to look through the rest of the pupils.\n\nHowever, if the same\
    \ information was recorded in ascending order of their height, finding information\
    \ for a person by name would be difficult. Because the students are no longer\
    \ saved in order of their names, we may have to scan and search over numerous\
    \ rows, which could take a long time. However, different types of inquiries are\
    \ now possible. Get information on kids who are between the heights of 4 and 5\
    \ feet, for example. In which situation, Tyrion's information might be immediately\
    \ acquired because different types of indexes are supported by different databases.\
    \ The complete list of indexes that support MongoDB can be found here.\n\nSo,\
    \ if you type the following command:\n\n```javascript\nDB.policeData.find().pretty()\n\
    ```\n\nreturns all documents contained within the policeData collection, which\
    \ is the whole list of officers. We can use the command `db.policeData.find({userId:\
    \ \"01\"})` to get information on a specific cop whose userId is\n\n# Application\
    \ Development III 97\n\n```json\n{\n  \"id\" : ObjectId(\"57e75af5eb1b8edc94406943\"\
