  mdcn: "\n摘要 ■ 139\n\n基于 MIT 许可证分发的开源软件，它基于 Sinatra 微框架。\n\nExpress.JS 框架具有以下重要特性：\n\
    \n- Express 是一个 Node.js 层，它在 Node.js 之上提供了在线应用开发工具，如基础路由、中间件、模板引擎和静态文件服务。\n- 它非常简单，且不会对\
    \ Node.js 性能造成压力。它被用于创建现代的在线应用和 Web API。\n- 对于代码分段，Express 利用了模型-视图-控制器（MVC）结构。\n\
    - 灵活且能够适应个人需求。\n- 设置了中间件来处理 HTTP 请求和响应。\n- 这是一个尖端的对象关系映射（ORM）程序，它使我们能够执行高昂的 CRUD\
    \ 操作。\n- Uber、PayPal、IBM 等更多公司使用 Express.js 进行服务器开发。\n\n**Meteor**：这是一个用于创建和部署\
    \ JavaScript Web、桌面和移动端应用的免费开源框架。该框架用于 Node.js 的快速原型设计。\n\nMeteor 的其他优势包括：\n\n\
    - 我们可以创建一套可在所有平台（包括 Web、桌面、iOS 和 Android）运行的单一源代码。\n- 关系型数据库 MongoDB 可以与 Meteor\
    \ 配合使用。\n- Js 是一种有助于数据同步的编程语言。\n- Meteor 有一个名为 Live Reload（实时加载）的内置功能，允许我们无需重新编译浏览器页面即可看到代码逻辑。\n\
    - Meteor 有一个开发响应式用户界面的平台。\n- 应用程序持续使用单一语言，这提高了一致性。\n- 网页可以实时更新。\n\n# 140 ■ 征服\
    \ JavaScript\n\n- Sails 是一个构建在 Node JS 之上的具有 MVC 设计的 JavaScript 框架。它是以简单方式设计企业级应用和在线\
    \ API 的最佳选择。更多的数据请求、自动生成 JavaScript 对象表示（JSON）请求以及额外的 HTTP 能力都是 Sails 升级版 Rails\
    \ 版本的 MVC 软件设计的一部分。\n- Waterline 是 Sails 包含的一个强力 ORM，它为任何公共数据库提供了简单的数据访问层。\n-\
    \ Sails 拥有蓝图（blueprints）和脚手架（scaffolds），我们可以利用它们无需编写代码即可快速启动应用的后端。\n- 我们 Sails\
    \ 应用中的每个路由都支持 Web sockets，并且它们将翻译传入的 socket 消息。\n- Nest.js：Nest.js 是最具前瞻性的 Node\
    \ js 框架之一，用于创建动态且可扩展的企业和业务应用。凭借大量的库选择，它为我们这样的开发者提供了完全的灵活性。Nest 的主要编程语言是进阶 JavaScript\
    \ 和 TypeScript。\n- 由于启用了 TypeScript，Nest 有了保障。Js 具有健壮的类型系统并遵循优秀的编码规范。\n- 它是一个多范式框架，实现了\
    \ OOP（面向对象编程）、FP（函数式编程）和 FRP（函数式反应编程）等原则。\n- 它自带后端生产力加速器。它提供了一个高度可扩展的生态系统，允许创建全服务器端的应用程序。\n\
    - Nest CLI 是一个强大的工具，允许我们为 Web 应用创建多个预构建的功能。\n- Koa：Express.js 团队创建了 Koa，这是一个高度扩展的\
    \ Node.js 最小 Web 框架。一个 Koa Web 应用类似于包含一组中间件函数的对象。当用户提出请求时，Koa 将这些函数放在栈中并执行它们。\n\
    - 即使在最低层的中间件级别，高层 JavaScript 也提高了兼容性和健壮性。它提供了内容协商、缓存新鲜度、代理支持、弹出窗口和重定向功能。它提供了一个中间件框架，中间件可以在不集成到核心的情况下进行扩展，从而减少内存占用。最关键的一点是，我们可以工作而无需等待回调。\n\
    \n- Hapi：得益于输入验证，它是最安全、简单的 Node.js 框架之一。Hapi.js 框架具有一些主要特性，包括：\n  - 它的架构基于插件的。\n\
    \  - 拥有强大的生态系统和大量的安全默认设置。\n  - Paypal Hapi 框架通过快速执行 JavaScript 模板引擎为客户交付动态内容，该引擎被迪士尼等大型企业使用。\n\
    \  - 它非常具有扩展性，并支持许多第三方插件。这些插件使得创建可以处理数千人的实时聊天程序成为可能。\n  - 它便于为开发者创建详细文档。\n\n-\
    \ Derby：这是一个用于 Node.js 在线应用开发的全栈框架。它以支持“Racer 引擎”而闻名，允许许多用户实时处理同一数据。此 Node 框架使用\
    \ Share DB 的操作转换（Operational Transformation）服务，利用复杂的冲突解决算法进行离线访问、实时更新和快速交互。\n\
    \  - Derby.js 将服务器和客户端浏览器结合，允许在单个文件中编写后端和前端代码。\n  - Derby 使用模板进行数据渲染；因此，不需要在服务器端创建昂贵的\
    \ DOM 实现。\n  - Derby.js 在服务器上生成模板的 HTML 输出，以加快页面加载速度。\n- 它提供全面的搜索引擎优化（SEO）辅助。\n\
    - Derby.JS 在客户端浏览器上使用快速、原生的 DOM 操作技术进行渲染。\n\n# 142 征服 JavaScript\n\nLoopback\n\
    LoopBack 是一个 Node.js 和 TypeScript API MVC 框架，允许我们快速开发由后端系统组成的 API 和微服务。Loopback\
    \ 以无缝的方式将其 API 连接到数据源。\n\n- 内置的 API 浏览器和内置客户端，允许我们动态地探索它。\n- 使用 MySQL、MongoDB、Oracle\
    \ 从模式创建数据模型。\n- 它包含一个基础的 CLI 用于快速原型设计。\n- 它支持 Android、iOS 和 Web。\n- 可以使用附加组件进行文件管理、第三方登录等。\n\
    \nAdonis\nAdonis 是一个 JavaScript MVC 框架，支持 Express、Koa 和 MEAN 技术栈。基于 PHP 的 Laravel\
    \ 对它有很大影响，它们之间有很多相似之处。\n\n- Adonis.js 提供了一个包含许多标准功能的健壮环境。\n- 它构建在依赖注入和 IOC（反转控制）之上。\n\
    - 路由组、基于子域的路由和资源都由 Adonis 的路由层支持。\n"
