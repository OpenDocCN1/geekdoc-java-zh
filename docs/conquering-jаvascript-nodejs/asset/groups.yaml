    ## 86 征服 JavaScript


    ### 安全的认证


    Tokens、auth0、jwt 以及其他认证机制适用于 Node.js 应用。从物联网（IoT）的视角来看，每种机制都有其独特的优缺点。Tokens 很有用，但它们并不是完全安全的。它们是一种极好的认证技术，可以让你识别特定的用户并决定是否为其提供访问权限。


    IoT 生态系统会将加密的令牌或登录/密码数据存储在固件中。如果有人拥有设备的物理访问权限，就可以窃取令牌，这对于 jwt 和 auth0 也是如此。


    通过将任何服务器端认证工具集成到 Node.js 框架中，我们可以使用它们并使用 Node Package Manager（npm）手动完成此操作：passport、auth0
    和 jwt。此外，还有用于集成云服务的包，如 Azure IoT hub Node.js 或 AWS-IoT。IoT 生态系统会将加密的令牌或登录/密码数据存储在固件中。如果有人拥有设备的物理访问权限，就可以窃取令牌，这对于
    jwt 和 auth0 也是如此。通过将任何服务器端认证工具集成到 Node.js 框架中，你可以直接使用它们。我们可能可以使用 Node Package
    Manager 手动完成此操作：passport、auth0 和 jwt。还有用于集成云服务的包，如 Azure IoT hub 或 AWS-IoT。


    ### 使用 Node.js 创建 API 非常简单


    构建 API的能力是 Node.js 的另一个优势。例如，LinkedIn 的开发者首次使用 Node.js 开发工具创建了移动 API。Node.js 框架被用于在该平台上构建
    Web 服务和 API。因为使用 Node.js 开发 API 只需几行代码，因此可以快速完成。


    ### 从哪里开始使用 Node.js 开发 IoT 项目？


    当我们开始构建一个 IoT 项目时，脑海中第一个问题通常是：从哪里开始？是先设计架构，还是选择我们所需的所有模块？也许你应该从数据库开始？


    这比看起来要容易得多。第一步是设计一个包含所有字段的数据库架构。我们需要它来充分发挥你的项目的价值。如果没有它，由于系统架构糟糕，可能会导致请求延迟，甚至在开发过程中陷入停滞。数据库是
    IoT 项目中最脆弱的部分，也是最难修改的部分。架构应该尽可能具有适应性，并适用于新技术的集成。


    最佳解决方案是采用分层模型—视图—控制器（MVC）模式，其中每个系统组件在整体方案中都有自己的角色，并遵循 MVC 设计。


    在我们决定数据库架构后，考虑数据将如何更新、更新频率以及数量。几乎所有的 IoT 服务都为你的问题提供了现成的解决方案。例如，AWS IoT 包含一种“规则（Rules）”功能，允许开发者或
    DevOps 人员安排数据。我们可以选择数据存储在何处、使用哪个数据库、运行哪个脚本进行额外的数据处理。我们应该熟悉服务的运行机制，以避免重复造轮子。像 AWS
    这样的服务设计初目的是让你的生活变得更轻松，如果我们不利用它们，就错失了机会。


    ### 如何为 IoT 选择最佳数据库？


    现代数据库可以连接到 IoT 数据库；然而，这取决于开发者如何实现连接。在选择数据库之前，我们必须确定它是否适合我们提供给用户的功能。以下是该数据库的主要功能列表：


    - 支持索引且设计灵活。

    - 用户友好的方案，能够承受海量数据。

    - 支持数据导出和导入。

    - 使用各种参数进行多功能搜索。

    - 具有很高的性价比。


    在启动 IoT 项目时，取决于每个人来决定优先考虑哪些功能。然而，在项目中使用多个不同的数据库并不是坏主意。可能项目的设计非常复杂，以至于只有一个数据库能够满足所有功能需求。要记住：对于简单的操作，你不需要强大的数据库；相反，应该使用高度专门的数据库。


    - InfluxDB：自 2013 年以来，InfluxDB 一直是 IoT 的最佳数据库。它是一个用 Go 语言创建的开源时序数据库。它为 IoT 设计卓越，这有助于它的持续流行。

    - CrateDB 是一种用 Java 开发的开源分式 SQL 数据库。它的主要优势是它提供的库列表，例如 Facebook Presto、Apache Lucene
    和 Elasticsearch，这些不需要任何额外的配置就能让你的生活变得简单。该数据库非常适合集成到各种 IoT 平台。

    - MongoDB 是一个免费的 NoSQL 数据库。它是每个编写过 Node.js 项目的开发者的好朋友。它简单易用，具有类似于 JSON 的架构，与 JavaScript
    配合得很好。MongoDB 可能不是构建 IoT 平台的理想答案，但将 Node.js 集成到平台它是理想的。

    - Amazon DynamoDB 是一个闭源的时序数据库，是 Amazon 在线服务之一。最好与该公司提供的其他服务一起使用，例如 Cloudtable
    或 IBMix。在这种情况下，AWS IoT 为构建高负载项目提供了一个强大的框架。单独使用此数据库是一个坏主意，但有许多不同的替代品可以实现相同的目的。在比较了几个现代数据库后，我们可以得出什么结论？我们都适合
    IoT 开发，但每种都有自己的能力。因此，根据你的需求做出明智的决定。


    ### 如何让大数据为 IoT 项目服务


    因此，在我们的 IoT 项目中，我们选择了主要的选栈，通过数据库和服务器的架构，现在是时候开始开发了。第一步是确定项目的哪个部分负载最重以及如何对其进行优化。如果我们利用复杂的解决方案（例如
    AWS IoT 配合 DynamoDB），无论容量 AWS 都会承担。相比之下，如果我们在自己的服务器上构建，有一些解决方案可以帮助我们。让我们注意以下几点，以便我们的优化工作更加顺畅。


    '
