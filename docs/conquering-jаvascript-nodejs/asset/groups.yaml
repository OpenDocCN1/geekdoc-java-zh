    # WHAT MAKES NODE.JS PERFORMANCE SO SPECIAL?


    Google''s V8, one of the fastest JavaScript engines available, powers Node.js.


    Run-to-Completion, Single-Threaded Behavior

    Let us have a look at the concept of single threading. Enabling threads for parallel
    processing within an application, Node.js does not have this capability. Alternatively,
    we can use asynchronous code and an event loop to create multi-tasking applications.


    Detecting Memory Leaks

    If a program is allocated some memory in RAM and not cleared after its action,
    the objects in the heap pile up continually until the working memory resource
    is exhausted, resulting in a crash, as we mentioned in a previous blog “Memory
    Leaks in Java.” Although the garbage collector clears the working memory, memory
    leaks are likely to occur in our applications. As a result, it’s critical to keep
    a close eye on things and set some alarming or warning features in the system.


    We can dump the expose to JavaScript using the V8 engine.

    To address the limitations of it, the V8 engine uses two types of garbage collection.


    +   - Mark sweep: slower than scavenge, but clears the working memory of all junk.


    +   - Scavenge: quick, but doesn''t remove all unreferenced items. In other words,
