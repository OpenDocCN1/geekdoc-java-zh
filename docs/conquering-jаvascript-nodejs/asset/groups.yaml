    # Introduction 23


    - Users make requests to the server (blocking or nonblocking) to perform tasks.

    - The requests are sent through the server''s Event Queue first.

    - The event queue sends requests to the event loop in a sequential order. The
    event loop examines the request''s type (blocking or nonblocking).

    - Non-blocking requests that do not require external resources are processed by
    Event Loop, and responses are returned to the requesting clients.

    - A single thread is assigned to the process for blocking requests in order to
    complete the task using external resources.

    - The request is routed to the Event Loop when the procedure is completed, which
    returns the response to the client.


