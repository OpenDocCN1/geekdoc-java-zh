  mdcn: "\n\n## 108 征服 JavaScript\n\n- 让我们从一个简单的性能测试工具开始：Artillery。它是用 Node.js 语言编写的。\n\
    - 当我们设置 Artillery 时，它会对你的 Node.js 应用进行定期查询。\n- 我们可以告诉 Artillery 请求哪些端点、以多快的速率以及持续多久等。\n\
    \n让我们来看一个基础测试配置。\n\n```\nConfig:\ntarget: 'https://artillery.io'\nphases:\n  -\
    \ duration: 45\n    arrivalRate: 15\ndefaults:\n  headers:\n    x-my-service-auth:\
    \ '9874018382710021882985667'\nscenarios:\n  - flow:\n    get:\n      URL: \"\
    /docs\"\n```\n\n我们正在告诉 Artillery 以 15 的速率对你的端点进行请求 45 秒，这大约等同于有 15 个访问访问该 URL。运行以下命令进行测试：\n\
    \n我们使用 artillery 运行 config.yml。\n\n### 在 Node.js 中创建性能测试配置\n\n性能测试配置指定了你的性能测试将如何执行。例如，如果我们开始运行一个电子商务网站，我们可以预期全天范围内都有稳定的客户活动。或者，如果我们的应用程序是用于订票的，我们将在短时间内看到大量流量，即票务订单开启的时间。\n\
    \n因此，我们的性能测试环境也应该是类似的。我们可以根据需要创建尽可能多的测试配置，并按我们喜欢的任何顺序运行它们。\n\n## 复制大规模分布式系统\n\n\
    当应用程序达到一定规模时，流量水平可能会变得极高且不可预测。我们还可以按照预期的用户百分比对 Node.js 应用进行测试，如果检测到性能下降，我们可以回退到先前的执行状态，即典型的流量水平。这种技术的关键优势在于，我们可以在实际生产应用程序上进行测试，因此我们不必再担心测试结果与真实情况不符。\n\
    \n我们需要数据来找出为什么我们的程序加载如此缓慢。在获取数据后，我们需要使用 Node.js 性能监控对我们的应用程序进行评估。\n\n## 配置我们的监控\n\
    \n所有应用程序在它们所做的事情上都是优秀的，但都需要某种类型的监控。这些监控工具帮助我们更好地理解应用程序重要的性能指标。在进行性能测试之前，我们应该更好地了解需要满足什么样的性能基准。我们的\
    \ SLA（服务水平协议）和 KPI（关键性能指标）是什么？哪些关键措施可以帮助我们更好地理解性能问题？\n\n- 带有 API 运行：API 有多种价位和功能。根据需求选择最合适的工具至关重要。为了检查性能，我们应该尽可能获取数据。\n\
    \n以下是一个很好的起点：\n\n- 基础架构数据：我们几乎肯定需要运行应用程序的主机的数据。我们可以在运行在云端的应用程序原始版本中接收这些数据。这些信息将包括主机的\
    \ CPU 使用率、内存使用和连接信息。\n\n- 应用程序监控：这些工具位于应用程序代码内部，能够记录信息，例如函数如何被调用/执行、我们提出了哪些问题等。\n\
    \n## 征服 JavaScript\n\n- 聚合日志：聚合日志使得搜索和可视化我们的日志数据变得简单。我们可以为每个 API 的性能绘制图表并记录。\n\
    \n### 设置 Node.js 性能测试环境\n\n云托管可能是设置测试基础设施最高效的方法。为了消除请求延迟和数据偏差，云托管确保测试在同一台机器和同一时间位置执行。\n\
    \n### 运行我们的测试\n\n在启动命令行配置后，我们在这个阶段将收到发往 Node.js 应用的请求。我们可以使用所选的监控来查看事件循环是否正常工作、对\
    \ Node.js 的请求时间是否超过预期，以及连接是否超时。使用 Artillery 和 Retrace 等工具对 Node.js 的速度和性能进行性能测试可能帮助我们发现性能退化。\n\
    \n### 如何让 Node.js 运行更快\n\n让我们来看几种让 Node.js 运行更快的技术。提高 JavaScript 性能的技术包括：\n\n\
    ### 前端工具\n\n在前端，发送到浏览器的内容尽可能少至关重要。这特别包括图片、JavaScript 和 CSS 文件。模块打包器（例如 webpack,\
    \ Parcel, Rollup）和任务运行器参与了实现这一可能性的过程（例如 Gulp, Grunt 等）。\n\n### 任务运行器和模块打包器\n\n\
    模块打包器是构建工具，它们将一组模块及其依赖项合并成单个文件或文件集合。之后，这种压缩化后的输出可以在生产环境中使用。压缩化过程随我们使用的工具而异，但在大多数情况下，我们可以利用\
    \ JavaScript ES6 版本的标准化格式作为代码模块。可以进行复杂的转换，例如缩短多字符变量名或采用与原始代码相当的更短语法，以及将多个 JavaScript\
    \ 文件合并为一个以减少网络查询。CSS 压缩也是如此；删除了多余的空格和注释，以便浏览器更容易解释代码。\n\n## CSS 的模块和预处理器\n\n在压缩化方面，CSS\
    \ 在减少页面加载期间的浏览器请求方面并无不同。post-CSS、Sass 和 LESS 等 CSS 预处理器提供了变量、函数和混入。\n\n### 图片\n\
    \n在将代码发送到浏览器时，我们还需要考虑图片。通常情况下，照片越大越好。\n\n### HTTP/2 和 SSL\n\n使用 HTTP/2 需要安全传输层（TLS）和套字层安全（SSL）协议。Node.js\
    \ 的功能让设置 HTTP/2 变得非常费力。HTTP/2 具有以下特性：\n\n- 头部压缩：移除多余头部并强制对所有头部压缩。\n- 多复用：允许在单个\
    \ TCP 连接上同时检索资源。\n\n多复用用于减少发送到服务器的请求。建立 HTTP 连接的时间通常比发送数据的时间更高。\n\n## 使用缓存\n\n\
    缓存是提高应用速度的流行方法。发生在客户端和服务器端。客户端缓存是临时存储 HTML 页面、CSS 样式表、JS 脚本和多媒体资产的过程。缓存通过在浏览器或内容分发网络（CDN）中保留频繁请求的信息来节省成本。客户端缓存发生在浏览器或\
    \ CDN 缓存数据时。这种想法是，如果用户访问网站后离开，网站不应再次下载所有资源。\n\n这通过 HTTP 缓存头部变得可行。缓存头部分为两类：\n\n\
    - 过期日期：指示必须再次请求资源。\n- 缓存控制：max age 指示资源的有效期。\n\n除非并且资源具有缓存头部，否则浏览器只有在缓存过期后才会重新请求资源。这种方法也有一些缺点。例如，如果资源发生了变化怎么办？必须以某种方式破坏缓存。通过在资源\
    \ URL 中添加版本号，我们可以使用缓存破坏方法来解决此问题。使用 Node.js 技术如 web pack，这非常简单。\n\n"
