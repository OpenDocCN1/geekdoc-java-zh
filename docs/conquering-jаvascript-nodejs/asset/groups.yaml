    \ API for managing our client-side and server-side cache.\n- Memcached is a distributed\
    \ memory system that saves data over several nodes. It makes use of a hashing\
    \ schema with hash table capabilities. These make sure that adding or removing\
    \ a server node has no effect on the key-server node mapping.\n- Node-set, cache's\
