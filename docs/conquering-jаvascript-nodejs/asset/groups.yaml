    \ : 25,\n  \"location\" : {\n    \"type\" : \"Point\",\n    \"address\" : \"Kalyan\
    \ Nagar, Bengaluru, Karnataka 560034, India\",\n    \"coordinates\" : [\n    \
    \  77.6399711000003,\n      13.0280047\n    ]\n  }\n}\n```\n\n## Geospatial Indexes\
    \ in MongoDB\n\nGeoJSON objects can be stored in documents using geospatial indexes.\
    \ GeoJSON objects come in a variety of shapes and sizes, including Point, LineString,\
    \ and Polygon. If you look at the result of your `.find()` command, we will note\
    \ that each location is an object with a type field and coordinates field. This\
    \ is significant because the $near command can be used to query for points within\
    \ a specific distance for a particular longitude and latitude of your GeoJSON\
    \ object is of the Point type.\n\nWe will need to construct a 2D sphere index\
    \ (a geographic index) on the location field and a type field within it to use.\
    \ The 2D sphere index can be used to calculate geometries on a sphere that resembles\
    \ the earth. This comprises geographical searches in MongoDB, such as those for\
    \ inclusion, intersection, and proximity.\n\nSo, in your mongo shell, type:\n\n\
    ```javascript\ndb.policeData.createIndex(\"location\": \"2dsphere\")\n```\n\n\
    To get documents from the closest to the farthest away from a given pair of coordinates,\
    \ use the following syntax:\n\n```javascript\nDB.<collectionName>.find({\n  <fieldName>:\
    \ {\n    $near: {\n      $geometry: {\n        type: \"Point\",\n        coordinates:\
    \ [<longitude>, <latitude>]\n      },\n      $minDistance: <distance in metres>,\n\
    \      $maxDistance: <distance in metres>\n    }\n  }\n}).pretty()\n```\n\n$minDistance\
    \ and $maxDistance are two variables that can be used to calculate distance. Fields\
    \ like distance are optional. Now, run this command to find all cops within 2\
    \ kilometers of latitude 12.9718915 and longitude 77.64115449999997.\n\n```javascript\n\
    DB.policeData.find({\n  location: {\n    $near: {\n      $geometry: {\n      \
    \  type: \"Point\",\n        coordinates: [77.641154499999977, 12.9718915]\n \
    \     },\n      $maxDistance: 2000\n    }\n  }\n}).pretty()\n```\n\nThat's all\
