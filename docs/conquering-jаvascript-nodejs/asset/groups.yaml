    应用开发 II ■ 63


    - 空间启发式：利用 UI 空间中的各种元素可能会大有益；例如，你可以引入负空间来获得更沉浸式的体验。


    - 我们可以通过考虑流媒体应用内容的可访问性，构建出最佳体验的 UI。


    # 第 5 步：测试与维护


    流媒体应用测试是我们开发策略中的重要方面，因为它确保了我们的 UI、后端服务器、API 集成和其他组件能够良好运行。使用 Selenium 和 Appium
    等自动化技术将将帮助我们缩短运行各种测试的时间，允许我们的公司精调应用性能。


    我们需要为流媒体应用运行以下几种类型的测试：


    - UX 测试用于保证用户体验在所有设备上保持一致性。一致性、导航和功能性都将在跨平台进行测试。


    - 负载测试模拟系统的峰值需求，以检查你的应用程序是否能够处理增加的负载。当数百万用户从多个地方从你的应用程序中消费内容时，负载测试变得至关重要。


    - 性能测试检查服务器响应用户内容请求时的可靠性、稳定性和性能，无论带宽或平台如何。此类测试将允许我们确保无故障的流媒体服务并提高应用性能。


    - 检查语言清晰度、内容的文化恰当性、个性化以及针对本地客户支付的准确货币格式都是本地化测试的一部分。这是一项关键检查，以确保内容本地化符合用户的选择。


    保持最佳性能需要跟踪许多 KPI 并精调应用程序的功能。另一方面，维护需要理解程序的堆栈和架构设计，以便实现应用功能。


    # 64 涉及 JavaScript


    # 创建一个流媒体应用程序的成本是多少？


    在计算制作流媒体应用程序的成本时，必须考虑几个因素。它取决于功能的复杂性、开发者的参与模式以及其他各种方面。了解成本有助于制定出产生最佳结果的稳健开发策略。


    ## 取决于功能的成本


    在决定如何开发流媒体应用时，功能性极关重要。例如，如果我们正在创建一个 SVOD（按需付费的视频点播）OTT（过顶传输流媒体电视）应用，我们需要为各种不同人口统计学特征的消费者提供多种功能。多种视频分辨率选项（如
    4K 或 1080P）以及多语言音频调整可能需要很长时间的开发。基础功能（如用户登录和个人资料管理）的设计时间较短，因为它们不那么复杂。问题是，我们如何确定精确的成本？答案是开发时间。然而，它取决于应用程序的类型、规模和特征。建立流媒体应用程序的成本不仅基于基于成本，还包括市场研究、构思、测试和维护等成本。


    ## 使用 NODE.JS 进行应用开发


    如果我们打算创建一个具有许多连接同时运行的流媒体 Web 应用程序，Node 的才华无疑对我们有益。在 Web 应用程序中播放视频时，Node.js 是理想的选择，因为它将数据分割成片段并快速播放大型视频。


    ## 视频游戏的流


    数据分段发送到客户端而不是一次性发送，这就是流（Streams）的特性。在 Node.js 中，有的流以难于处理、甚至更难以理解而闻名。Dominic Tarr
    认为“流是 Node 最大且最被低估的概念”。即使是 Redux 的创建者、Reactjs 核心团队成员 Dan Abramov 也对 Node 的流感到恐畏。


    应用开发 II ■ 65


    ### 到底是什么流？


    流是构建 Node.js 应用程序的核心原理之一。它们是一种处理数据的方法，按顺序读取输入并写入输出。流是一种高效处理读取/写入文件、网络对话或任何端到端数据流的技术。流的特点是，它们不是像传统方法那样一次性将文件读入内存，而是逐段读取数据块，在处理其内容而不将其完全存储在内存中。这使得流在处理海量数据时极其有用。例如，文件的大小可能会超过你分配的内存空间，如果不将完整文件读入内存，将很难处理。在这种情况下，流来救场。使用流处理较小的数据位来读取更大的文件是可行的。以
    YouTube 或 Netflix 这样的“流式”服务为例：这些服务不需要你下载所有的视频和音频流。相反，浏览器以连续块流的形式接收电影，允许接收者几乎立即开始观看和收听。


    另一方面，流不仅用于处理视频或海量数据。它们还提供了编写“可组合”（composable）代码的机会。当我们考虑可组合性进行设计时，我们是在确保多个组件可以以特定方式组合以获得相同的结果。在
    Node.js 中使用流，你可以通过在较小的代码段之间管道（pipe）数据来创建强大的代码块。


    为什么使用流而不是其他数据处理方法？流相比其他数据处理方法具有两个显著优势：


    - 内存效率：意味着我们在处理数据之前不需要将大量数据加载到内存中。


    - 时间效率：一旦收到数据，立即开始处理所需的时间比等待完整载荷传输要少得多。


    在 Node 中，有四种不同的 streams.js 类型：


    - 可写（Writable）：数据可以写入流。例如，`fs.createWriteStream()` 允许我们使用流将数据写入文件。


    # 66 涉及 JavaScript


    - 可读（Readable）：可以读取的数据流。例如，`fs.createReadStream()` 允许我们读取文件内容。


    - 双工流（Duplex streams）可以在两个方向上进行读取和的流。以互联网为例。


    - 能够修改或转换数据的流被称为套接转换（socket transforms）。在文件压缩的情况下，我们可以将压缩数据写入文件并从文件中接收压缩数据。


    如果我们以前处理过 Node.js，可能遇到过流。例如，在基于 Node.js 的 HTTP 服务器中，请求是一个读取流，响应是一个可写流。可能使用了 `fs`
    模块，它允许你与可读和可写的文件流进行交互。当你使用 Express 与客户端接口时，都会使用流，因为 TCP 套接字、TLS 栈和其他连接都是构建在 Node.js
    流上的。在我们处理的每个数据库连接驱动程序中也会流。


    ## 现实示例


    创建可读流的最有效方法是什么？我们首先创建并初始化可读流。


    ```javascript

    const Stream = require(''stream'')

    const readableStream = new Stream.Readable()

    ```


    初始化后，我们可以向流传输数据：


    ```javascript

    readableStream.push(''ping!'')

    readableStream.push(''pong!'')

    ```


    # 异步方式迭代器


    在处理流时，强烈建议使用异步迭代器。根据 Axel Rauschmayer 博士的说法，异步迭代是一种异步获取数据容器内容的机制（这意味着在获取项目之前，当前“任务”可能会被中断）。值得注意的是，在流内部使用了
    `readable` 事件


