    # 雅加路65号


    朝北点方向，建筑上挂着如今显得忧伤的路易威登模特，凝视着太空，我们能听到周围峡谷中传来的诵唱声和鼓声，看不见却占据着主导地位。我现在唯一感到慰藉的是那些永恒衰败的、回溯着英国时代的旧公寓，它们错落着垂直的空调外机和晾衣绳。除非有海啸才能将它们冲倒。当然，这是因为我自己也住在其中一栋里——嘉兰楼（Garland
    House），它于1965年建成雅加路上，我已经在那里住了太久，以至于那里对我来说就像某个古老的洞穴一样永恒。


    司机现在把我留在了街角，我的大楼耸立在足疗水疗中心和一家廉价时尚店之上。街道安静而冷清，这极不寻常。我那大楼引人目的黄色外墙，不知为何只涂到了第四层，此刻看起来也同样是寂静地被遗弃了，仿佛所有租客都离开了一周，或者正躲在锁着的门后靠罐金枪鱼度日。横跨在建筑正面的黄色管道和阀门上满了静止的鸟儿，它们似乎在足疗中心红色的霓虹灯汉字中找到了慰藉，在那些覆盖着睡美人图像的陈旧百叶窗旁，睡美人的头如往常那样枕在伸出的手臂上。二楼那个被红光照亮的小脚印，一直是我回家的标志。于是，我踩着惯常疲惫的脚步走上五楼，推门进入那间狭窄的房间套间——在没有空调的四个小时后，那里已变成了一个小小的热源。由于多年我一直没提精神去更换那些暗淡的墙纸，房间显得昏暗而潮湿。


    然而，墙纸上的图案画满了小鸟和藤蔓，我已经习惯了它们，就像我习惯了与它们为伴的、那种由常规驱动的孤独一样。我给自己调了一杯加满冰的金汤杜露，打开电视。我的手似乎在发抖。


    我像每晚一样出于病态的奇心听着新闻，一个字也不信。亲北京报纸对当天暴乱的报道与前一天一样无趣，不断贬低事件的严重性并淡化其意义。这在预料之中。然而，这场持续的戏码总是引人入胜。半小时后，我回到电脑前获取真实新闻。我继续喝着，动作缓慢且带着某种自得的从容，我能听见头顶传来赖太太穿着拖鞋在楼层间穿行的脚步声，她正对着早已去世的丈夫大大大。一只孤单的夏蛾飞进了公寓，在灯罩周围横冲直撞，但我没有精力去抓捕它。


    此时，我已经在Twitter上关注了数十名同为记者，其中许多是随身携带相机的当地人，他们每天走入街头，追踪事件直到清晨。他们的用户名色彩斑斑：“香港隐士”、“W.
    B. 耶叶斯”、“火焰器喷射器”。在我带着相机在街头流荡的几周里，我从未遇到过任何我认得的公民记者。这就像是一个流动的秘密社，他们用手机相机第一次记录着地面上的一场缓慢燃烧的革命。我早已意识到，我的运作模式和我供职的出版物无法提供任何优于这些公民记者的东西。我们被抛下了。就像


    # 雅加路67号


    像昏睡的大象，我们蹒跚着追赶那些早已在其他地方以三倍速度泄露的新闻。我们唯一的作用就是为我们认为值得载入纸面的（即便只是数字打印）的任何信息条目赋予一种合法性感。但这已演变成某种骗局。我们像其他人一样撒着谎言。但我们绝对确信自己没有撒谎，并且鄙视那些我们认为在撒谎的人。


    中国共产人至少对这一点理解得非常清楚。因此，他们对新闻业充满蔑视。我永远无法向他们解释其中的浪漫何在。他们从未看过《五日情人》（*His Girl Friday*）。即便看过了，他们又能理解出什么呢？但对于我们这这一代的恐龙来说，我们谁不想做一个在《晨报》（*The
    Morning Post*）咔哒机器声中穿梭的沃尔特·伯恩斯（Walter Burns）呢？正如吉米建议的那样，那种曾经伟大的浪漫正是它如今堕落为令人幻灭的原因。例如，当我被迫向吉米北京的朋友们辩护那份报纸时，我发现自己对自己主张和目的感到模糊且不确定。“瑞切尔·马多和布莱恩·斯特尔特是滑稽的疯子，”他们会这样说，带着愉快的眼睛看着我，冷静地等待我的某种反驳，当然，他们根本不知道凯瑞·格兰特（Cary
    Grant）是谁。我又该说什么呢？“不，他们不是，共和国一切良好吗？”事实上，我从远处目睹了美国媒体那种诡异的衰败和放荡。我触感到，尤其是电视记者，不再传递任何诚信的内容。但报纸记者也遵循着同样的下行轨迹，他们坐在华盛顿权贵的桌子下吸食残屑，而情报机构抛给他们的来自“匿名人士”的泄密消息实际上操纵着局面。这就是他们变现产品的方式。我数不清有多少退休特工守在CNN、MSNBC和NBC的办公桌前，替记者发言，设定话语准则，直到这两群人变得奇特地难以不分。极少有人对国家安全国家表示不满。没有人散出任何真正的勇气气息。我们与共产人之间的差距已经缩小，而记者在经历了一段浪漫英雄时期后，变回了他一直以来的样子：一个庸才、一个投机分子和一个宣传员。当数十场抗议全城同时爆发时，那些笨拙的新闻机构无法模仿。


