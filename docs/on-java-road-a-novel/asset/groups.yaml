    \n“他们什么时候*没有*下达过命令呢？”贝贝卡说道。\n\n吉米说：“他们可能不会这么做。毕竟，实行宵禁是一件极其愚蠢的事。而这，”他叹了口气，“正是他们会这么做的原因。”\n\
    \n在我看来，贝贝卡身上似乎有什么东西幻灭了。她的情绪变得无精打采，或者说根本是不感兴趣了。之后，我们上楼去了二楼的酒吧，那里比餐厅更拥挤。那里是衣着考究的富人的聚会场所：那些输得起的人。那里有一个户外露台，挤满了穿着阿玛尼西装的当地年轻人，在潮湿空气中浸透着。我过去曾用一种审慎的羡慕看着他们，这些露台上的美女，但现在我只觉得他们很可怜。在围绕他们形成的新秩序中，他们还有什么样的未来？他们依然会富有，但在其他自由方面，他们将被孤立。然而，他们并没有表现出焦虑的迹象。这是一个闷热的夜晚，小产金酒流淌。我们听不到附近街道的任何声音。中环道一片死寂，地标广场关闭了。从中环道向上延伸的巷弄不再人满为患。上一个时代似乎结束了，那种显而易见的街头狂欢终于散。我们走到外面，吉米借口去洗手间。当我和贝贝卡单独在一起时，她转过身问我，我曾结过婚，而且在澳门赌博输光了所有的钱是真的吗。\n\
    \n“是他那样对你说的？”\n\n她抬起手掩着脸笑了。\n\n“他是这么说的。但也许他是在开我的玩笑，”\n\n他确实在如此，于是我采取了反讽。“不，全是真的。我生了病，为了治好病我必须输光所有的钱。”\n\
    \n明亮的眼睛里露出一瞬间的不可置信。\n\n“现在你住在嘉兰大厦？”\n\n“我知道你不知道。但是的，我也计划在那里死掉。我想不出更好的地方了。也许我天生有点懒惰，或者我们大家都是如此。我们找到了一个好地方，就不舍得离开。起身离开需要花费太多精力了。而且，我不认为我现在能适应西方的城市了。伦敦会要我的命。”\n\
    \n“这在报纸上听起来很悲伤。”\n\n她用中文说的，我不得不承认听起来确实很有吸引力。伦敦是一个回国英国人的终点。\n\n她继续道：“所以回英国已经太晚了吗？我们中许多人可能会去那里，我相信你一定听过。”\n\
    \n“对我来说，家就在这里。我曾以为人可以在生命的尽头收拾行李离开。但不是那样的。在不知不觉中，你跨过了一条条线，某一天醒来发现回去已经太晚了。我本以为会在我五十岁生日，但我已经跨过了那条线。这是一种疲态。你想，‘我在哪里消失有什么关系？在香港的芬斯丹还是旺角——这能有什么关系？’而因为你实际上已经在旺角，或者在任何地方，你只是顺流而下，死在旺角。没有人会在乎你死在哪里。”\n\
    \n“真的吗？”\n\n我摇了摇头，补充道：\n“我不想死在恒拉西，原因显而易见。但在其他地方——”\n\n“但恒拉西是死最好的地方。”\n\n“你想孤独死去，而不是被成千上万个刚死的人围着。”\n\
