    ## 雅华路 113


    为了获取独家新闻，我被派往了医院。我去那里是为了给我们的读者提供一段情感描写。酒精和热水澡让我昏昏欲睡，但我决定等到第二天晚上，，无论这种延迟会让斯特里克（Strick）多么恼火。尽管如此，我还是了自己的节奏。


    第二天晚上，我先走到了丰盛（Fung Shing），吃了一盘蒸肠豆腐卷。那里现在挤满了喧闹的——也许是由于此而胆大大的——留着新发型的男人，我引来了几道目光，仿佛他们脑海里已经聚成了一群暴徒，但我饿得没空顾那么多了。无论如何，我打了出租车来到位于旺角的康华医院，那座仿骑士医院堡垒的复制品屹立在敦华街（Dundas
    Street）。大厅和街道上人满为患，我不得不出示几次记者证才进去。受伤的男孩在间病房里，访客几乎完全被排除在外。这是一起不寻常的事件，因为双方都没有轻易使用武器。我听闻是一名警察在斗殴中发了脾气，向他的对手发射了三枪，其中一个就是这个男孩。这不会登上世界头条，但尽管如此，几个没带装备的警察在那里，轻轻地将我们推开，大概是让我们安静下来。他们似乎是被命令来平息局面，而不是相反。香港是一个枪击事件大多局限于黑道地下世界的城市。而现在，这正发生在学生身上。


    在那些受挫的记者聚在一起的混乱斗外外的阶梯上，我遇到了汉宁根（Cunningham），他是为了一家澳洲频道来的。他穿着一件泡纹布外套，外套在他身上显得软塌塌的。他把我拉到纷争之围外，告诉我


    ## 114 劳伦斯·奥斯伯恩


    那个孩子不会死，但他的家人发表了声明，说他们将起诉警察。当然，这不会有结果。在新的局势下，起诉警察已成为一项极无可能的尝试。


    “是斯特里克派你来这儿的？”


    “还能是谁？”


    “现在对你没什么故事可讲了，老兄。你太晚了。”他给我一个安慰的微笑，“看出你的脸还没好。”


    我好久没想过我的伤口了，但现在我想起来——多亏了这位观察敏锐的小丑子——我感到它又痒了，于是用脑海中感受了一下。


    “噢，那个啊，”我嘟囔道。


    “看起来又感染了。盖尔（Gyle），像那种糟糕的伤口你得小心，就像我上次说的那样。”


    他笑了，我本应该将其视为一种关怀的责备。


    我说：“我太忙了。听着，康尼（Cunny），如果其他人都拿到了故事，我们大可以走人蛋了，对吧？”


    他叹了口气：“我不行，我得留下来。编辑坚持。”


    “留一整晚？”


    他看了一眼手表，好像这能有什么区别似的。


    “多久就留多久。我知道这没意义。”


    “你的摄影师在哪？”


    “他在里面撒尿呢。”


    “哎，我觉得我像是在排队末尾。就像橄榄球赛的中场休息。”


    但我仍然在与聚在一起的记者群中穿行，我感觉到他们正在等待在他们的新闻编辑室里有所价值的更新。这种氛围我早已熟悉。我们的行会聚集在同一个地方寻找一个我们都想要的故事，竞争关系在共同的无力感中变得缓和。随着我们年龄的增长，这种开玩笑式的同情正变得越来越枯燥、越来越愤世嫉俗。当然，我已经认识了他们中的许多人了。毕竟这是一座小城市。由于香港狭窄的地形，每个人注定互相认识，如果我第二天晚上去中环香港（FCC），那几张脸几乎肯定会出现在酒吧里。但现在，陌生的面孔在人群中穿梭。


    我看到一个摄影师走下阶，肩膀上挂着设备，一瞬间，我的目光与他交汇，那种彼此认出的眼神让我一惊。他走过我走向大门，当他溜走时，我想起了他：那个在岛上戴着针织帽、一直在拍灯塔照片的男人。我如此确定，甚至跟着他来到敦华街，看着他独自穿过那条街通向敦华广场（Dundas
    Square）。我犹豫了，想知道在此时离开医院是否值得，然后决定在太晚之前跟着他。他走得很快，肩膀缩着，街道因为东菜街的市集而拥挤。


    他实际上转进了那条街，当我紧跟在他身后时，在市集摊位间的一个转角，正好他经过了我知道的一家叫“汤姆”（Tom Yum）的小泰国餐厅。我不得不半跑着才能跟上他的速度。


    很快，他向后瞥了一眼，脚步放慢了，在嵌入建筑立面的旋转空调机组和垂直堆叠的晾衣绳下悠闲地散步，相机在左左腋下下晃动。


    ## 116 劳伦斯·奥斯伯恩


    他并没有在那里逗留，即使他留下了，我也没有计划对他说什么。很快，我们穿过金鱼市场，大约一分钟后，他停了下来。在照亮一排又一排悬挂在塑料袋里的金鱼和会叫的鸣鸟笼子的灯光下，我稍微看清了他的脸。他是一个五十岁的男人，打扮得有些张扬而不够低调，穿着黑色运动鞋和一件靛蓝色的外套。他走进其中一家亮着灯的鱼店，观察了一些标本，如果他是在考虑买的话。然后，他小心翼翼地出来，向四周张望，继续沿着东菜街走，直到到达一个充满了小狗、兔子和更多金鱼的交叉路口。他转入街道，没多久我就费力跟上他。他一步步消失在人群中，我感觉到他知道正被人跟踪。


    不情愿地，气喘吁吁地放弃了，在一个摊位停下来买了一个冰淇淋。吃着冰淇淋，我原路回到医院，汉宁根仍在那里徘徊。他看起来像是被自己的失望刺伤了。尽管如此，他很有面子没有问我去哪里了，而是建议


    ## 雅华路


    放弃那个受伤的学生，去春鹿（Spring Deer）和他的两个朋友一起吃鸭，一个是叫索尼·巴瓦（Sonny Bawa）的斯里兰卡记者，一个是丹·莫耶（Dan
    Moyers）的澳洲商人，后者经常为汉宁根提供政府内部的情报和人脉。我稍微了解这两位先生并明确地厌恶他们，但同时，在疯狂时期，为了听风，有时与这些讨厌鬼混在一起是工作中不可或的一部分。他们两个都是热衷于八卦者、窃听者、阴谋论爱好者，以及间谍网络的组织者：和他们吃晚餐通常会有收获。我可以忍受小时，汉宁根会请我吃晚餐。


    因此，我们沿着弥敦街出发，那里的日常骚乱正在进行中，当我们戴着记者证绕过它时，空气中回荡着玻璃破碎的声音，尽管不知道是谁造成的。路过时，汉宁根指出是同一条路后方另一条警察线发射了第一枚催泪弹，风把它吹到了我们的脚后。


