    # ON JAVA ROAD 87


    sion with mummifying their leaders? I can understand the Egyptians or the Incas.
    But Communists? It’s disappearance anxiety. They destroy the past and its culture
    and yet they can’t bring themselves to destroy their own cadavers. I can’t understand
