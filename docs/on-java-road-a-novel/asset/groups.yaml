    # ON JAVA ROAD 107


    “I’m going up to the Peak now,” she said. “I suppose you must be busy, too. Jimmy’s
    staying in town tonight. He has some engagement with his family. So I’ll spend
    a night up on the mountain. I like it much better up there.”


    I said, quite spontaneously, that if she liked I could take her back in a car
    and then have it drive me home afterward. It was a small detour.


    “You don’t have to do that.”

    “It’s a gentleman’s duty.”


    She seemed to be made pensive by the idea of gentlemen and their duties.


    In the end it was a short drive at night and there was no reason for her to say
    no. The roads were empty on the way up the mountain, twisting through moonlight
    dispersed through leaves, and the Peak’s vertiginous jungle was bathed in the
    light of arc lamps. She rolled down the window and slumped against the clammy
    leather of the seat. I wondered if she was bored by me. She didn’t say so at least,
    as before, we didn’t need to talk anymore. That was refreshing. The less you talk,
    the more you feel. The more you feel, the less there is to say. Eventually the
    driver left us at the tram terminus and I asked him to wait for me in the dark
    Rebecca and I walked up to Lugard Road, a three-mile pedestrian walkway with iron
    rails built by the British in 1914 that cuts through forest as it circumnavigates
    the Peak. It winds its way past steep jungles of machilus and camphor trees, past
    views of a city that from this height appeared at that moment submerged in its
    own distant light.


    The path by now was deserted. But from the city we could hear the dull thudding
    of police helicopters invisible in the skies.


    # 108 LAWRENCE OSBORNE


    I had never imagined that anyone could actually live on Lugard Road but now that
    I was there at night I noticed structures that I had not registered before. Both
    above and below the alley stood immense and gloomy villas from a bygone-age, some
    with grandiose terraces lined with columns. Most appeared deserted and in a state
    of semi-ruin. Looking up from the road I could see the windows of rooms whose
    ceilings had been stripped bare to reveal the insulation and rafters. A few were
    still occupied, by people so rich that the adjective itself was meaningless. They
    must have been the most expensive houses on earth. One uninhabhabited house below
    the road possessed a palatial greenhouse whose panes were stained with moss, and
    next to it, a covered walkway connecting it to the house. It was impossible to
    know who had once lived there or who still held this parcel of land worth tens
    or even hundreds of millions. The great families within these houses once intermingled
    with the ghosts of my own nation, who had retreated here to escape the heat, bringing
    with them the comforting flora of India and Malaya. Their weeping Indian rubber
    trees draped roots over the road and brushed our faces as we went underneath them.
    There were steep canyons of Livistona fan palms humming with night insects, and
    perched above rock walls loomed her grandfather-s house, topped with barbed-wire
    fortifications and iron spears. There was no visible clue that we were near any
    kind of city. We approached it by a ramp protected by grilled gates that seemed
    to have been disused for a half-century. As we drew near, two ancient wall-mounted
    lamps came alive automatically. At the gate, she held out a hand and shook mine,
    and the exchange was not quite as warm as it could have been. She was self-conscious,
    I thought, but the same was as true of myself. I told her that we''d be with Jimmy
    again within a week and until then maybe it would be a good idea if she stayed
    up there on the Peak among the Livstonas and out of trouble.


    “I could say the same to you, Adrian. You should go back to restaurant reviews.”


    “I was a terrible food critic.”


    “Thank God for that. Now that you mention it, staying up here is not such a bad
    idea, after all. Don’t you love the smell up here?”


    “Jungle,” I breathed.


    “How could one live in a place without jungle?”


    It would be like being dead, thought.


    And it was then that I noticed something jarring. The lamps cast my own shadow
    around me, throwing it up against a wall for a moment and along the pavement.
    One notices such things on a lonely walk. Within a tunnel of shadows, I thought,
    your own becomes more noticeable. But when I glanced down at this moving shadow-show
    set in motion by my walking, I thought for a moment that I did not see her. Even
    when the lamps were almost above us and a sharp shadow flowed out from my feet,
    I saw none emanating from hers. It was as if the light bounced off her in a different
    way or passed right through her with no effect, or else it could easily have been
    the interplay of light and shadow at that hour of the evening. In any case it
    was time for farewells. She turned and buzzed herself in and the lamps went off,
    moving into the darkness. A rectangle of lunar light flashed across her back and
    I wanted to say something light and witty somehow true that could be tossed after
    her. But the words didn’t come to me. Such moments come out of nowhere, fast as
    curveballs, and usually they aren’t seized. I turned.


    On the way back down from the Peak in the same car, the driver peering at me in
    the mirror as if I had failed some erotic assignment, I thought over how even
    now I had still not even remotely tackled the riddle of Rebecca. I felt that something
    had been held out to me—an offer—but at the same time it was not real, and I had
    heard nothing about anything since the afternoon. Still in the bath, I called
    my jilted editor at his hotel and apologized for my disappearance. A sudden attack
    of nausea, I explained, coupled with an inexplicable weakness in the legs—all
    the recent stress had been getting to me.


    “You’re full of shit,” Strick said. “I saw you with a girl. But we’ll get on it
    this time. I was just about to call you, actually: I need you to go to the hospital
    where they’re holding the kid who was shot tonight.”


    I’d heard nothing about a kid being shot, but then I had heard nothing about anything
    since the afternoon.


    “You know which?” Strick asked.


    “I’ll get on it right now, maestro.”


    “Good lad. Try and get him to be distraught on camera. I’t mean him distraught.
    I mean catch it for the world to see.”


    I looked up the incident on Twitter and found the hospital in Mong Kok. A sixteen-year-old
    had been shot by a Raptor on a main street in view of dozens of journalists only
    four hours earlier. The story was already out. But I was not being


    # SIX


    # 112 LAWRENCE OSBORNE


    I could hear the strains of the TV series Wo men de shian in the room next to
    me, and I had no idea who was in that unit. I was half-sure that I had seen an
    old lady standing by its door one day with keys. But it had been long ago. Yes,
    it was certainly Forty Years We Walked. I had watched it once on a flight to Xi’an.
    It made me smile to hear it through a wall. But at the same time it did not feel
    as coincidental as it should have felt. It felt as if it were directed at me specifically.


    Instinctively I locked the door from within with both chains, which I never did,
    and took a bath with the help of a bottle of rum. The stairwell was filled with
    an aroma of steaming sea bass and chives. The gwailo, as they called me, was home
    and had not been home all evening. Even in my bath, I could still hear the demented
    TV sets. Something had set them off, in the way that crows or dogs are set off.
    The tenants stirred. We all knew that we might be spied on by tenants. The walls
    were little more than paper; any ear pressed to them would be as effective as
    a bug. I didn''t know them and obviously they didn''t know me.

