    changed at the radio transmitter and then descended ready for a short swim. I
    saw her first and for a few moments I kept it to myself so that I could take her
    in; I was sure she had not seen me doing so, though of course she had spotted
    the motor launch at once. I later found out that it was illegal to anchor there,
    so either Jimmy had found a way to get around the rules as he usually did or he
    had simply taken his chances with being detected, prepared as he probably was
