    We fell into the crowds of Argyle Street and it was not long before I was struggling
    to keep up with him. Step by step he slipped away among the bodies, and I felt
    that he knew he was being followed and had avoided me skillfully. Yet it had surely
    not been me who had interested him out on Kau Pei Chau.


    Reluctantly, and feeling out of breath, I gave up and stopped by a stall to get
    an ice cream. Eating it, I retraced my steps back to the hospital, where Cunningham
    was still loitering by the doors waiting for his break. He looked as if he had
    been impaled by his own disappointment. Still, he had enough tact not to ask me
    where I had gone and suggested'
