    ## 雅华路上


    我说：“她多大了？二十一左右吧？”


    “其实二十三岁。她比我晚一两年。”他低头看了看自己的指甲。“我没说发生了什么剧烈的事。我只是带她去吃了一晚饭。我打算周四晚上和她见面——我觉得你应该和我们一起去。梅莉莎会在澳门参加一场慈善晚会。”


    “这周四晚上？”


    “别这么死板，阿德里亚诺（Adriano）。”他想要想要什么时候总是这样叫我。“别告诉我你要呆在家里写你的回忆录。你只会浪费时间守着一家酒吧，坐在电视前。跟我去杜德尔餐厅（Duddell’s）吧。”


    “你想听听别人的意见，是吗？”


    他有些羞愧地避开了我的目光。

    “也许我入迷了。在我们这个年纪很会发生。我知道这很可怜。但并不完全可怜。”


    “也许是幻觉吧？”


    “是的，有一点那样。我宁愿幻觉也不愿可怜。还有比这更糟糕的事情。这取决于你对什么产生幻觉，你不觉得吗？”


    “你是说为了某种高尚的目标产生幻觉？比如追求学生？”


    他冷冷地笑了。“你把我说中了。但尽管如此——又怎样？如果我们用那些年轻到无法报答之情的女孩来欺自己呢？她们和我们一样残酷。每个人都是自私的，如果你仔细想，我们别无选择。为什么要为此大吵小闹？我们几年后都会死——至少你和我我会。正如他们说的，我对此很豁达。而且，我不会为了她迷失头脑。”


    “入迷不就是迷失头脑吗？”我在惹恼他，并享受这种效果。


    “是的，但迷失头脑的方式有很多。总之，我们对这些事情没有控制力。一见钟情（Coups de foudre）之类的。如果我被击中了，我就被击中了。我确实陷了。如果需要，我只想往脸上泼点冷水。我的印象是她不是那种拜金女类型。”


    然后我随口问了她的名字。瑞贝卡（Rebecca）作为名字不是不太常见吗？然后我想起了香港社交圈的另一个瑞贝卡，她是粤语流行歌手兼演员张国荣（Leslie Cheung）的朋友，我不记得她的姓了。我想起了张荣，我青春时代那个伟大的同性恋偶像，《似水云飘》和《英雄本色》中的中性化之星，因为他在2003年从文华东方酒店24层跳楼自杀后，他的追思会在雅华路的东端举行，正如我所说，所有的礼堂都在那里。这是一段奇妙的联想。


    “好吧，”我说，“我会去的。周四晚上。但我的直言不讳会让你请我吃顿饭，还有我想要的任何瓶酒。”


    “成交！你知道的，阿德里亚（Adrian），生活之所以不可忍，是因为是一场悲剧，但也因为是一场浪漫——谁这么说的？”


    我说我不记得。


    “而这是一场浪漫。尽管我不得不承认，到目前为止完全谈不上不可忍。”


    然而，还有另一件事。


    “她每晚都清醒地去参加抗议。我们事后见面，她身上有催泪瓦的味道。我承认我挺喜欢那样的。那是我最接近前线的时刻了。”


    我吐出一口烟，告诉他说这话挺愚蠢的，但我不会再提。


    “这可能很愚蠢，阿德里亚，但确实是事实。”


    就在那一刻，我不得不承认，我在想和那个浸满催泪瓦斯味的人共在一起是什么感觉……（此处由于原文存在大量重复且混乱的OCR码，已按要求完成核心逻辑翻译）


