    # ON JAVA ROAD 215


    mer British police station converted into a hotel, which over-looked the sea at
    the village of the same name. I would go there with-the-moment girlfriends or
    books and some-times, rarely, both; and as I grew older I would occasionally go
    with neither. It reminded me of happier times. Times that now felt as if they
    lay outside the edge of history altogether.


    The Heritage lay on the island, with somber jade mountains on the water opposite
    it, its rooms painted white, many with original fireplaces and French windows.
    Since there were only nine rooms its privacy was unmatched. I would know every
    other person there at any given mo-ment. Moreover, there was no road running past
    it, just a footpath that ended in a jetty where ferries once used to stop. There
    I could take my coffee every morning and sit with my legs dangling over the waves.


    Surrounded by the ocean on three sides I could feel re-moved from the threat of
    interlopers from Hong Kong. I cal-culated the crisis had depressed the hotel industry
    and I was right. When I got there the Heritage was empty, the mountains over the
    water were darkened by clouds, and the small hill of tropical forest where the
    hotel stood was hushed. They gave me the room I had taken with girlfriends in
    years past and I slept for twelve hours a day. When the rain swept I sat in one
    of the patios and read the books I had brought with me, four Conrad novels arranged
    chronologi-ically. I watched everyone who passed on the path below and everyone
    strolling on the jetty, and kept a keen eye out espe-cially for the private boats
    that sometimes drew up. I told the staff that I was taking no calls or visitors.
    Not that I was ex-pecting any.'
