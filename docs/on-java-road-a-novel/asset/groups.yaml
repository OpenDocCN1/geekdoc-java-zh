    # ON JAVA ROAD 149


    “And when was this?”


    I wanted to calculate at what point she had been verifiably alive, but Jimmy was
    deliberately vague, as if he didn’t want to say. All he had admitted that they
    had gone to Soho House for dinner and he hadn’t planned to do it then. The pressure
    had gotten too much for him, said. They were in the restaurant area. A lot of
    people noticed. “It was a royal fuckup,” he admitted.


    I said, “But they wouldn’t have known who you were necessarily.”


    “I’m sure some did. You never came over and asked us if everything was all right.
    That’s never happened to me before.\u201d He was seething, re-liviving it all
    again.


    “I don’t believe a word of it.”


    “You know,” he went on, as if what I said couldn’t possibly matter, you spend
    all this time with a woman and you think you know who she is and *what* she is
    and why she is with you. But in the end you know nothing. Absolutely nothing.\uu201d


    He had looked into her eyes at that moment, he said, and saw nothing recognizable
    at all. Just a hostile emptiness. Naturally he understood it was the shock of
    an unpleasant moment. He could hardly have expected the scene to go entirely to
    plan. She had launched into recriminations, accusations, and the violence of the
    reaction had blindsided him. She told him that he was only doing it because he
    was afraid of his wife’s family. Which was true. But they were unwelcome nonetheless.
    She hadn’t tried at all to see it from'
