    # JAVA 街 89 号


    我们在喝着 Aperol 泡泡酒，红尾灰在海角上方盘旋，然后逐渐消失在视线中。盘子里是生红鲷鱼和腌制金枪鱼，蜡烛摇曳着。吉米对酒抱怨道：“一家全球酒精税最低的法国餐厅，他们竟然连……——”但我发现自己正处于十年来最明亮的一天，向瑞贝卡提问了一些问题，这些问题恰恰因为其平庸，问起来反而是一种享受。


    “我会去某个地方读研的，”当我问她是否在考虑追求学术事业时，她告诉我。“也许去美国，”我对其他人这么说。“这里还有其他地方的人去吗？”我说不知道。总之，那是为了逃离香港。我看着她用小叉子剔开一只牡蛎，心想她相对于旁边的那个男人，适应能力是多么地惊人。那个人的情绪变化得如此快，几乎无法跟上。她显然已经学会了不再尝试去追随他变化莫测的心。他言语中偶尔浮出的尖锐苦涩对她来说是如此陌生，以至于这些话会毫无效果地溜走。她甚至能感觉到吗，或者知道那是什么吗？那是一种源自过去的冷酷，当然是对自己的失望。我们是奇特的一代。在许多方面都很幸运，出生在
    20 世纪 60 年代的繁荣中，但不像我们之后的几代那样被宠坏；柔软但不像我们的继任者那样软弱。我们的祖父曾觉得我们很荒唐。但在这一切之外，是吉米那无疑遗传的阶级性让他既敏感又冷酷。即使当他调侃她时，他对她也关怀备微。你能看出他尊重她：当她说话时，他会仔细听，限制自己的话语。她在谈论她在美国的未来职业。中途，吉米指出道：“她是个天才（wunderkind）。但她不会夸嘘自己，因为天才不需要。”


    “我不是什么天才。我甚至不知道那是什么意思。”


    “一个善良且充满好奇心的孩子。你就是。艾德安，我想在沙滩上和这个天才跳舞。你能帮我守住后阵吗？”


    尽管感觉只过了几分钟，一小时后，我发现自己正看着吉米和瑞贝卡赤脚在沙滩上跳舞。这是一场随着同样的波萨诺瓦曲律响起的凌乱华尔兹，其他情侣带着一丝对自己遗憾的嫉妒看着他们。我看得出来这不是他们第一次一起跳舞。据我所知，那可能已经是第百次了。他们跳得像一对对彼此身体契合的恋人。风吹起他们周围松散的沙子，在
    Aperol 酒精的作用下，他们来来回去，说话声音很小，我听不清内容。那看起来像是一场永远不会自行停止的运动，某种必须从外部才能停止、将他们带回地球的东西


    # 五


    在那之后的每一个下午，由于对瑞贝卡的决心感到羞愧，我都会戴着黄色头盔，带着一个挂在电单车后方的防毒面具出发。由于天生谨慎，我用各种抗议标章（press tags）覆盖自己，尽管这些护符最终起的作用只是吸引那些武装着震爆手榴和防弹衣的警察的辱骂和攻击。但在那个时刻，在恶臭的酷夏日里，我依然抱着一种幻觉，认为它们会像护符或泰国佛教经文刺青（sak
    yant）一样保护我。没有任何橡胶弹会向我飞来；没有任何催泪弹会针对我。我可以像一个神圣的人一样，在被剥皮者和飞翔者中穿行。


    起初，我认为我的标章给了我隐身能力，并据此行动，带着完全不自得的自信，穿过临时搭建的路障和警察局外投掷的莫洛调燃瓶引发的火。那是一段神圣的疯狂时期。但很快就会结束。命令一定是高层下达，为了给那些写字的人一点头头。尽管如此，那周街道依然保持着他们的礼貌：为路过的叛乱者提供免费的浓咖啡和瓶装水，人群为救护车让路，所有这一切都进入了国际媒体，并让人们以为这只是一场很快就会平息的家族纷争。但远在国外民主国家的人们并不知道他们面对的是谁，我同样如此。那周，我开始注意到，随着周末深夜的临近，一种歇斯底里的情绪在警察中蔓延，警棍敲击盾牌的声音像斯巴塔方阵一样；从高层楼宇和天桥上发射的催泪弹罐令人意外，它们拖着烟雾像失败的烟花一样向我们冲来，落在地上时带着一种反常的恶意向我们的脚旋转。


    我体内的某些东西发生了变化，但发生得可能比我的意识所理解的要缓慢。这就像坚固建筑的钉子一个一个脱落。木梁移动偏移，横梁颤抖。在某些周末晚上，中环较宽的街道弥漫着火烟，这有助于那里的人群感受到自己人数的力量，感受到针对单一目标的匿名群众的力量。每个人都知道他们的口号是“像水一样（Be
    water）”，李龙关于躲避敌人攻击的一条迷人的建议。但水也可以是惩罚性的波浪。那些人潮冲击着中陆的岸边、地铁站、警察局以及小规模部署的警察，警察在导弹弹雨般的攻击下破碎并撤退，随后又面对了水炮车，有时还面对了反抗的出租司机——这很见，他们讨厌警察。


    # JAVA 街 89 号


    ……（续）……被木棍击打。


    # JAVA 街 93 号


    ……（续）……努力保持他们处于生活后视镜中的男人圈，这只能通过衣服来实现。但他的西装尽管光亮亮且剪裁得体，并不显气质；他的眼睛探索每个房间寻找女性的关注，但女性却视他如透明。然而，这种糟糕的方程式并不清晰，仿佛他失去宠爱的结局是一个谜团。事实恰恰如此。


    与此同时，他在财务上过得很好。由于一个不靠谱的新加坡亿万翁，《鸦》（The Raven）的注资超过了《华盛顿邮报》。当我进来时他在接电话，然而那个上海 30
    年代房间演奏的爵士四重奏可能让他的对话变得不可能。也许他在假装。


    “艾德安，很高兴你还呼吸。”他站起来，由于酒精有些站不稳，握了握我的手。“很高兴见到你，小姐。你的肺怎么样了？”坏了。”


