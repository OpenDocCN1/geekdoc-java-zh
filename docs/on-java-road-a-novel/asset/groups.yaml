    # ON JAVA ROAD 83


    the meal at Duddell''s. My questions had likely nettled her and then had driven
    her to reflect upon what she had said to me by way of answers. Was I an interloper
    from the wrong generation who shouldn''t be trusted, even though she had said
    that she liked me?


    WHEN WE HAD ROUNDED the southern tip of Waglan Island we cast anchor again and
    sat in the calm provided by the rocks. Under dark blue parasols we played cards
    and listened to classical Chinese music, bells and drums of Tang. The mood had
    changed again, like something unexpectedly blown off course.


    "Did you know," Jimmy said, that if your penis curves more than thirty degrees
    when you erect you might have Peyronie''s disease? Have you ever experienced this,
    tongzhi?"


    "Only when drinking tequila."


    "Is that an advertisement for tequila? If it is, I want to try it. Can it go to
    forty degrees, do you think?"


    Rebecca said, “You two have been talking like this for over twenty-five years,
    I can tell. Adrian, was he like this when he was twenty?


    "He was worse, much worse. But we did try to translate ‘The Exile’s Letter’ together.
    It was a competition among the Chinese language students at the time. In the end
    we almost won the competition."


    "The Li Bai poem?"


    "Li Po, Li Bai. The very same,” Jimmy said. “I know you know it. Every schoolchildren
    knows it."


    "We studied it at school."


    “Like everyone. Anyway, Adrian and I translated ‘The Exile’s Letter’ together
    at Cambridge in 1989. In my opinion it’s the best translation since Ezra Pound’s.
    It was even published in the varsity magazine.


    “Is it online?”


    “I very much doubt it. It’s in print in someone’s vault somewhere.”


    “So it’s disappeared, too, then.”


    Jimmy turned to me with an exasperated look.


    “It has not disappeared. It has just gone into hiding.”


    “Disappeared!” She laughed.


    “You realize that everything on the internet—I mean everything—will eventually
    disappear as well? People thought bound books would make them immortal. In reality
    it just gave them a two-hundred-year reprieve.",


    “Fifty-year reprieve,” I said.


    “Fifty, then. Or twenty.”


    But then


    Mao, the man who destroyed monasteries and temples. What did he love about it?”


    I said, “It was the impossible thought that you could actually touch the brushstrokes
    of Li Bai himself.”


    “Exactly. I think it fascinated Mao because he couldn’t erase it along Marxist
    lines. The Tang era will always be with us, in our memories. Maybe that era was
    superior to ours. We have the five-mile suspension bridges; they have Li Bai.
    Some would say we’ll all die long before getting close to that genius.”


    It was interesting to be talking about Mao on a luxury motor launch with slipper
    lobsters and martinis. But then, Mao loved dance parties and seducing young nurses—hundreds
    of them, according to some accounts. He was no puritan. The Chairman loved above
    our pale blue skies as much as the ghost of Li Bai. Every age must summon its
    emperor. Jimmy said that in his view nations didn’t change much over time. China
    was still an empire, just as the United States was and would always be an early
    nineteenth-century country, as Tocqueville had famously and cryptically remarked.
    Just as it could be argued that the English would always have a bit of the Tudors
    in them. Just as the French on some subconscious level would always inhabit the
    centralized land of the Sun King.


    Jimmy recalled the terrible story of Mao’s personal physician, Dr. Li Zhisui,
    who was summoned by the Politburo moments after Mao’s death in 1976 to perform
    a mummification of the body so that millions could pay their respects to the Chairman
    publicly in the Great Hall of the People. Alarmed, Dr. Li had reluctantly agreed,
    even though he had no idea how to perform the necessary operation. But since the
    showing of the body would only be for two weeks he thought that it might be possible.


    In a panic, nevertheless, he retreated to the capital’s medical libraries in search
    of some guidance. If he failed to perform the operation successfully he would
    probably be shot. Finally he stumbled upon a formaldehyde procedure that he thought
    might work. It involved massive injections of the chemical into the Chairman’s
    body, which proceeded to perform. The cadaver immediately bloated up to an enormous
    size and the doctors were faced with a new dilemma. How could they make the body
    presentable to the public? Just at that nerve-racking moment the Politburo summoned
    Dr. Li a second time and told him that they had changed their minds. They didn’t
    need Mao’s body to be preserved for two weeks. No, they needed it preserved for
    all time. He was to proceed accordingly.


    In the end a medical team was dispatched to Hanoi to study the mummy of Ho Chi
    Minh and were told privately that Uncle Ho’s nose had fallen off and been replaced
    with a wax one. It was useful information. The same fate had fallen the mummies
    of Lenin and Stalin. Dr. Li returned anxiously to Beijing and set about making
    Mao materially indestructible. Dr. Li, that cultured and gentle man educated in
    the West, succeeded to the satisfaction of the Politburo and to the satisfaction
    of the millions of tourists who file past the crystal coffin between eight in
    the morning and midnight every day.


    “But why,” Jimmy went on, “do socialists have this obsession with mummifying their
    leaders? I can understand the Egyptians or the Incas. But Communists? I can’t
    understand it.”


    “Yes you can,” Rebecca said. “It’s a result of hierarchy. These are societies—it’s
    all they know. Mao is just...” “Everyone has emperors,” I said. “From time to
    time. I wonder if they’ll mummify one of ours.” “And you stay,” Rebecca added
    grimly.


    At about three the waves became choppy, signaling in some meteorological way that
    our day was drawing to a close and that we should think about returning to the
    main island. The day was still clear, however. Jimmy was in no hurry. We hauled
    anchor and moved across the open waters toward Shek O, thinking to cast down there
    and maybe go eat at beach restaurants. Secluded village was a place where many
    of the Hong Kong rich liked to hide out for a few days and nights when they were
    tired of the metropolis, and that included me. Between forested capes there lay
    a small beach with a semi-commercialized village behind it. Its alleys were crowded
    with designer toy houses and old temples. There was a sloping headland immaculate
    with bare patches of granite while offshore dozed the pale shapes of islands.


    Moored in the shallows I saw the curious lifeguard towers on the beach were unoccupied.
    The lights of a restaurant called Cocababana flickered into life. Whatever crowds
    had been there during the day had melted away and there was only a single man
    sitting on the sand playing a guitar. On a lone pole a digital clock displayed
    the time for nobody.


    The plan was for Tom to drive the launch back to Aberdeen by himself while we
    swam ashore and then dried off the dusky sun. The water came only to our chests
    in the event.


    We sat on the sand for a while watching the sun and the launch turning as its
    motors revved. We dried in minutes and walked up to Cocababana. It was a modern
    cement affair with bossa nova playing through the speakers. There were a few upper-class
    bohemian customers from the village sitting at the outside tables. We sat there
    as well, shadowed partially by a tree wondrously taller than the restaurant, and
    the unspoken understandings among us slipped and slid until they finally became
    something new, an emotion triangular, three-sided, with myself as the shortest
    side and, otherwise put, Jimmy and Rebecca as the main stars on their little stage
    and myself as the audience.

