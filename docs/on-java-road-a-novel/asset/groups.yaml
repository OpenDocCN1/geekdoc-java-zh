    这话或许有些道理。在那些最漫长的夜晚，我经常梦见死在这里的一家医院，然后醒来走回到以前的生活，却没有意识到自己已不再真实。这是老年人中常见的噩梦。你在正午分走在阳光明媚的街道上，突然意识到自己在人行道上没有投下影子。


    ## 十


    我从未弄弄过吉米是否真的去洛杉矶出差了，或者他是否实际上正躲在某间密闭的卧室里听着我们说话。唐家的一切一天变得比一天更加晦晦。无论梅丽莎怎么说，现在已经不可能和他们做朋友了，因为在她看来，我是那场丑闻的帮犯，无论她曾暗示过多少次可能会原谅我。尽管如此，他的小丑闻也来去去，而且由于集体意识的无常在作祟，瑞贝卡·托的名字也随之消逝，被扫进了许多人认为属于它的那片阴影中。除了她的父母和朋友，只有我把她的失踪当成一种日日夜夜的经历，那种空虚感就像内心一场巨大而缓慢的腐烂。负罪感在其中起了作用。我们相识不长，也不算深，但我觉得我的沉默帮助掩盖了她的抹除，我再次心情情愿扮演了帮犯的角色。


    这种抹除之干净最令我惊讶，尽管我无法说出为什么应该感到惊讶。没有出现关于她死亡的正式公告，家人也没有发布任何哀悼声明。我推测，原因在于他们选择保持沉默，不引起不必要的关注。他们也将自己的痛苦私密化。对于一个香港家庭来说，这可能是极其困难的，而且违背了他们根深蒂固的社会习俗。但时代已不再平凡，人们也相应地改变了行为。在更暴力的社会中，人们忍受了习俗的更极端扭曲，因此他们的秘密似乎并非完全不可理解。


    但结果就像她从未存在过一样。这种灾难性的念头在接下来的几天里在我心中生长，以至于我开始在下午走完整个华嘉路（Java Road），去那些著名的在路段南端挤满人行道的殡仪馆。我走向南端，在灵堂遗像中寻找瑞贝卡。我很清楚她的家人不会在那里张贴她的照片，但某种不理性的东西依然引着我走向那里。


    规模最大的是香港殡仪馆，它是香港岛主要的守灵场所。我曾作为社会记者多次去过那里，再次回想起张国荣的去世，他的守灵仪式也曾在那里举行，那是一段幸福得多、遥远的时光，那时歌手和影星从大楼跳下会引起人们的悲痛，而不是那些无一所有的疯狂学生。我曾只是路过那里看一眼——我们中有许多人是被派去报道的——但从未进入过粉丝聚集的内部。当时我无法相信，这位《游牧者》（Nomad）的明星，或许是华人世界最大的明星，竟然从酒店顶端跳了下去。那感觉像是一个文化时代的终结。当我走在华嘉路上时想着这件事；2003年现在感觉像是一个世纪以前的事了。你能想象今天会有一个中国演员以莱斯·霍华德（Leslie
    Howard）命名，那位英式冷静与文雅优雅的典范？“我一生没有做过任何错事，”张国荣在他简短的遗书中哀道，“为什么非要这样？”又有谁知道那个问题的答案呢？


    我来到街道一侧的一系列较小的殡仪馆，它们的花束摆在人行道上。香港殡仪馆立在华嘉路的尽头，是一座有着奶油色瓷墙的弧形建筑，带围栏的人行道通常堆满了切断的花茎和残留的花束。门上嵌在金色圆柱内的黑色弧形门楣刻着金色的汉字，在那之外的一切都昏睡而寂静。


    尽管从外面看像是一栋办公楼，但这间殡仪馆有一定的名声。名人们喜欢在那里举行最后的仪式。正如我注意到的，社会名流往往会在它的场地内完成人世的最后一站，你可以说那是最后一次露面的好地方。然而，当我到达时，那里并不忙。我悄无声息地溜进去，漫无目的地穿过又一个房间，寻找瑞贝卡的最后痕迹，尽管我很清楚自己永远找不到她。那里很可能在一个疲惫家庭的决定下举行了一场安静的火化。托家决定不让这件事传上新闻。然而，我无法理解的是我那些同行记记者的冷漠。对他们来说，成千上万其他故事更迫切，占据了所有时间。他们不可能报道所有事情，所以对此完全不感兴趣。于是，这件事就从他们身边溜过，而他们觉得没有义务去深挖。也可能是他们不惜一切代价避开了它。是恐惧还是冷漠抓住了他们，很难说。


    当我从一层楼走到另一楼，从一个灵堂走到另一个灵堂时，我意识到自己正独自独自追逐着一个幻象。那个死女人的幽灵在远处看着我。我相信这一点。她现在也是一个“鬼”（gwai）。正因如此，我在周围的环境中感受到了她，一个心怀不满的灵魂，只在我自己的脑海中才是有声且触手可的，但却直接向我发出挑战。由于纯粹的不幸，我似乎是唯一愿意或能够对她的失踪采取行动的见证者，除了我的线人之外，我没有利益于淡化这件事。


    在中国神话中，没有得到正义的鬼会回到人间寻仇。它们要么是“饿鬼”，要么是“孤魂”。人们会向它们供奉。它们必须被安抚、安葬。在七月十五的中元节期间，人们会向它们供奉。饿鬼有九种，但我只能猜她现在可能属于哪一类。但是，活人呢？瑞贝卡或许有挂念她的朋友，有去寻找她的人，但对于她，我一个也不认识。他们中有人联系过我吗？我们活跃在不同的圈子里。因此，我们是一个异类，我和瑞贝卡的幽灵，形单影只。在华嘉路上，在殡仪馆之间，这一点变得非常清晰。当我路过人行道上一排排花和黑丝带时，我知道我正被人跟踪。随着我沿着华嘉路走越远，这种感觉持续着，很快我开始停下、转身，看向朝我走来的脸群，那些脸对我来说是陌生的，就像我对它们来说一样。


