    # ON JAVA ROAD


    instead that we give up on the wounded student and go to Spring Deer for Peking
    duck with two friends of his, a Sri Lankan journalist called Sonny Bawa and an
    Australian businessman, Dan Moyers, who often gave Cunningham leads and contacts
    inside the government.


    I knew the two gentlemen a little and detested them unequivocally, but at the
    same time it was a necessary part of the job to sometimes hang out with the detestables
    in order to keep one’s ear to the ground in feverish times. Both of them were
    assiduous gossipmongers, eavesdroppers, conspiracy enthusiasts, and orchestrators
    of spy networks: dinner with them often paid off. I could endure them for an hour
    and Cunningham would buy me dinner.


    We set off along Nathan Road, therefore, where the daily disturbances were under
    way, and as we skirt around it wearing our press badges the air crackled with
    the sound of glass breaking, though I couldn''t see by whom. In passing, Cunningham
    pointed out that it was the police smashing bottles from a stockpile they had
    found so that they couldn''t be used as missiles. Behind us and farther up the
    same road the first gas round had been fired from another police line and the
    wind blew it down at our heels. Miniature Stonehengeenges made of bricks had begun
    to appear on the roads then and around them the young black-clads stood with their
    woks ready to smother the gas canisters, in their scuba masks and ad hoc body
    armor, not yet tensed by an imminent confrontation. Gas smoke wafted over us,
    and as we hurried to get away from it I noticed how calm they appeared, almost
    diffident. I thought of them now as Rebecca’s comrades, which only endeared me
    to them even more. By Chungking'
