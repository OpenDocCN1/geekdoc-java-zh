    blackmail him. I didn''t believe it then, and nor, I thought, did he. But now
    I began to entertain the possibility that I might have been wrong. Confusion began
    to well up around and within me. It was a bewilderment deepened by the dissolution
    going on all around us. You could say that the whole society had become paranoid
    as it swayed on its no-longer-solid foundations and began to disintegr. Therefore
    I, and everyone else, would become paranoid as well. Nor would Jimmy''s paranoia
    be exceptional. It was the new reality and we were all in it together. Whatever
    still existed of the boundaries between the police, the government, the powerful
    families, and the media seemed to have been removed from one month to the next.
    The old Hong Kong of laws and judges in British wigs had been deconstructed overnight
    and in its place there had emerged a wild totalitarian world in which rumor, hyperbole,
    hatred, tribalism, and supposition were regnant. Now, when a crime happened—say,
    when a student protester was found drowned in the sea or dead from an apparent
    suicidal jump from a tall building—no one could assume that they knew what had
    really happened. If it was a genuine suicide, no one believed it; if it wasn''t,
    much of the population did believe it. Insinations and gossip sprang to life around
    the event. It was impossible to know who was telling the truth.


    In any case, Wong went on, after we had returned to the lab the body was gone.
    The disappearance was as complete as it was enigmatic. He looked at me and there
    was a faint, slightly cruel smile.


