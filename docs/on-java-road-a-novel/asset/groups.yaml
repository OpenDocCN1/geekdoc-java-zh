    # ONE


    THOUGHT, IN THOSE DESPERATE AND FORGOTTEN days, of that passage in a novel I had
    read in school where the narrator insists he prefers to be known as a reporter
    rather than as a journalist, the humbler word better denoting what he does, namely
    transcribing what he sees. Today it’s an even less dishonorable job description.
    I knew all the journalists in Hong Kong, but I also knew a fair number of the
    reporters—the citizens trailing the city’s movable war zones, often like me all
    alone with a phone camera, and over time I had become more comfortable among them
    without consciously knowing why. But what were we describing and for whom? I wasn''t
    sure about that either. For myself, perhaps, and a few others scattered across
    the globe, such as I liked to imagine them, it would depend how deep you wanted
    to go into yourself. Some of these reporters had become been strangely famous.


    They were unlike me in that respect. Although I had been in Hong Kong for more
    than twenty years, slaying away as a reporter factotum gradually persevering his
    way into higher echelons of respectability, I had never made a name for my-'
  - '[PAGE 19]


    # 4 LAWRENCE OSBORNE


    self in my adopted city. People knew me vaguely as a writer of something or other,
    and, a fairly infamous glutton, little more than that. I had gone there when still
    a young man, chilled to the marrow by London and its prospects and, more important,
    unable to see myself succeeding in that tomb of a city. I had arrived in Hong
    Kong just after the Handover, knowing nobody except my old university friend Jimmy
    Tang, and equipped only with a single suitcase and savings of five thousand sterling.
    I had done well given those inauspicious beginnings, but I had never become a
    star writer. And in a way I didn''t mind at all. I had worked for a variety of
    newspapers, enjoyed a stint as a restaurant critic, married and divorced, accumulated
    a small apartment, and perfected the Chinese I had studied at university. In other
    words, I was an excellent nonentity.


    IN FACT, AT THE BEGINNING of that summer, when the disturbances had first erupted,
    I felt as though I were being woken from a deep and meaningless sleep. The city
    I had grown so used to—comfortable, cynical, overflowing with wine dinners and
    white-truffle events—was shattered the first moment I saw one of my neighbors
    wander onto Java Road at midnight in a white sleeveless shirt wielding a butcher’s
    knife. I knew the man by face if not by name because I saw him every other day
    at Fung Shing, the restaurant on that same Java Road where I spent much of my
    time drinking tea with guan tang jiaoiao soupy dumplings and editing my reports.
    I think he recognized me, too, but I was invisible to'
  - '[PAGE 20]


    him in that moment on the street at midnight because he was there looking for
    protestors to intimidate, and a Chinese civil war doesn''t automatically include
    European drifters.


    Later, it was true, certain expatriated foreigners would indeed become local heroes
    in the conflict that consumed the city that summer, like the Frenchman with no
    legs who declared his solidarity with the students standing precariously on his
    prosthetics and orating to thrilling effect. I never found out his name, though
    I was resolved to buy him drink if I ever saw him eating alone in a cheap restaurant.
    He was known merely as the Frenchman with No Legs. As the fellow knife-wielding
    diner at Fung Shing, I never knew his name either, but he would reappear like
    the ghost in a fol, never losing his power to disquiet.


    He was one of the countless Fujianese immigrants concentrated in North Point,
    the neighborhood where I lived, which had long been a bastion of pro-Beijing nationalist
    sentiment. Still speaking Mandarin instead of Cantonese, they were an island among
    the sea of Hong Kong who otherwise barely noticed them. Their moment of vindicating
    the Motherland had come, and when they achieved critical mass—as for example at
    Fung Shing at about 9 p.m.—they acquired a belligerent confidence even as they
    were huddled around pots of tea and after-dinner doughnuts, a delicacy carried
    from table to table on sugary trays after the main courses had been served. Since
    they regarded foreigners with suspicion at the best of times, and now associated
    us with the demonic prospect of democracy, I wondered if they, and he, were now
    my enemy. And even if they had drawn no blood'
  - '[PAGE 21]


    from me personally, how should I report and describe them?

    This question made me want to eat at Fung Shing every single night. Besides, the
    very name in English, Phoenix City, now seemed more aptose than it had before.
    Another phoenix, another riddle.


    Every time I climbed up the staircase to the second-floor eatery, which was level
    with its red-and-blue street sign, past a regal gold image of the bird equipped
    with a blue electric eye, I wondered if all eyes would be upon me as I entered
    the main room alone, dazzled by their overhead interrogation lights the Chinese
    seem to love in their restaurants, and which made me even more aware than usual
    of my unforgivable foreignness. I decided to call the Unknown Meat Cleaver Man
    Mr. Li, since that is one of the most common surnames on the mainland. If I were
    to ever meet him again in a dark street in those parts I wanted my assassin to
    have a name. Cloven in twain by Mr. Li. I rarely saw him at Fung Shing after that
    hot night of bastinado and disorder, men running after boys and girls in black
    with bamboo canes, then being chased back the same way when the momentum swung,
    like a theatrical production that had lost control of it.


    But it wasn’t only that. As a foreigner my relation to the people eating at Fung
    Shing had changed almost overnight. The entire atmosphere of the city had shifted.
    The cadences of the language around me sharpened, a language that I had never
    mastered in any case. Yet I detected these changes like magnetic alterations in
    the airwaves.


    I knew how to say “fuck your mother,” diao ni lao mu, but now I heard it made
    into a sentence directed at the armored cops: *diao ni lao mu gao gun*, where
    the last two words could'
- md: '

    be rendered as “dog officer.” The phrase hak ging was everywhere—dirty cops, black
    cops. The cops were soon shouting obscenities back at their satirists. Some of
    them said it in Mandarin. Cao ni mao. Over the warmer months the tensions that
    had begun with protests against an extradition law imposed by Beijing had and
    spiraled out of control. Now, as it became more irrational, more primal, one could
    see a hatred operating through words as much as through beatings and tear gas.
    Words are the most efficient vessel for carrying the seeds of violence. The tongue
    contains no bones, as the Arabs say, yet it breaks bones. Everything in the depths
    of the mind flows effortlessly through bone-shattering words. When a cop says
    to a sixteen-year-old girl sei bat po—“die, bitch”—the violence is already performed.
    A verb is not an act, but it is the prelude to one, a permission the violator
    has granted to himself by uttering the obscenity. Once during a standoff the police
    used a formal warning and the girls on the front line cried back, “Come here and
    we’ll scratch your balls off.” To which there was no answer. In that moment at
    least, the verbal insult nullified even a barrage of rubber bullets.


    For the next few days I didn’t go to the daily street protests. I went to Phoenix
    City as usual because I refreshed the arctic air-conditioning and the feeling
    of normalcy it bestowed on its patrons. It was a relief. I sat there by one of
    the mirrored columns and ate salted duck yolks and sou dumplings until the street
    cooled a little, and I could go down again of sane mind and walk around the sloped
    streets that run up from Java Road in search of rioters—call them what you will.
    But none appeared. A lull had descended, as if the students, with their last wills
    and testaments sewn inside their jackets, had decided to take a few days off to
    recuperate, allowing the streets to return to being places of consumerist erase.
    Or, in the case of Java Road, a place of funeral homes filled with black bunting
    and monochrome banners haunted by the ghosts of the sugar magnates who had once
    once made their fortunes on the maritime trade with Java, and whose imposing offices
    once stood here as a symbol of colonial magnananimity.


    The heat rose and by midday the inhabitants of the city bore it with raised newspapers
    and parasols. They were glum and stoic in their minimal clothes, and I wandered
    down to the ferry terminal behind the Vic Hotel just to soak up the coolness of
    the ocean. From there, the interval of ordinariness was impressive in its potency.
    The junks with their berry sails, the lights of the Kerry Hotel across the water
    coming on at dusk, the ferries packed with miserable perspirers bearing fans,
    and the edges of the mountains a color of old tea at the end of daylight. It was
    around this time that bodies had begun to appear in those same waters, quietly
    retrieved by police boats that reporters were not permitted to approach, the first
    intimations of a new form of intimidation, a new configuration of the chessboard.


    I sometimes retreated into the Vic, which was popular with middle-class mainlanders
    and since renamed, and went up to the somnambulant bar on the roof to watch the
    sunsets. I even brought me trunks on occasion and took an illegal dip in the hotel
    pool among the slightly nervous couples from the other side of the border. I suppose
    it was a matter of anywhere but my stifling little apartment at the Garland. Yet
    I was never lonelier than when I was in my own neighborhood and nowhere was more
    lonely than the top of the Vic Hotel as night came down.


    IT WAS THERE THAT I used to think of Jimmy Tang and the days many years before
    we had studied together at Clare College, Cambridge, and, among other things,
    had worked together in our spare time on a translation of Li Po’s “The Exile’s
    Letter.” It was one of the most famous Chinese poems of the Tang period, perhaps
    the most famous, erratically translated by Ezra Pound, and our desire to embark
    on a new version was inspired by the fact that Pound himself had not been able
    to speak a word of Chinese. We found this amusing, if not preposterous. He had
    merely used the notes of the American scholar Ernest Fenollosa. And yet, Jimmy
    used to say, his interpretations were almost as haunting as the original. Beyond
    that, his translations of Li Po had introduced Chinese poetry to Western readers
    for the first time. How could it be? Pound had, however, invented the title for
    English-readers, as well as turning the poet’s correct name—Li Bai into “Li Po.”
    The original was “Remembering Our Excursion in the Past: A Letter Sent to Commissary
    Yen of Ch’ao County.


    Jimmy was a scion of one Hong Kong’s wealthiest families, and I was a scholarship
    boy from a small town no one has ever heard of. But being at university together
    had made us equals. Now, more or less a quarter of a century later, we were friends
    again in the very different environment of Hong Kong, and the gap, of course,
    had reappeared. He was a millionaire socialite, I was a struggling—and one could
    say fairly declining—reporter. Even when we were undergraduates I had sensed that
    he was someone who might slip between your fingers and disappear, even though
    he had always appeared so radiantly solid, armed with life’s gifts. Even then,
    among only a handful of people studying Chinese in that medieval university, we
    had shared some kind of mental territory that was invisible to other people. Tenuously,
    we still did.


    I recall a morning in October when we had just started our first term: I caught
    sight of him crossing the college court. Only eighteen, a little younger than
    myself, he was walking in cricket whites with a Chinese girl toward the river,
    his shoulders draped in a cable sweater, leaving him a strange trail of water
    drops on the paving. Alone in a little cell, I was the friendless state-school
    boy studying Chinese because it was exquisitely unfashionable but, at least, also
    a seductively unattainable subject. It wouldn’t be an exaggeration to say that
    this couple holding hands in the shadows of Clare court were unlike anyone that
    I had ever encountered. Later that term, after we had become acquaintances, Jimmy
    gave me a copy of Izaak Walton’s Compleat Angler, which his father in Hong Kong
    had in turn given to him when he was. There was the observation, well known to
    anglers over the centuries, about the sadistic use of frogs as bait: “Use him
    as though you loved him, that is, harm him as little as you possibly, that he
    may live the longer.” You could see why a ruthless father would give such a book
    to his son, and why Jimmy would carry it around with him as he went to study among
    England’s lazy elite. At the time, he simply said that it was the wisest book
    he could imagine for learning how to live, since life really was like fishing.
    It required patience, cunning, and an ability to sit still for long periods, paying
    attention to unmoving waters. It encouraged a taste for quiet killing. The Compleat
    Angler’s other advantage was that no one else in Hong Kong had ever read it. It
    was secret knowledge, a manual of guile and persuasion. Latter, I never mentioned
    that book to him it felt like a slightly precious affection on the part of Tang
    father and son. I wondered if he still thumbed through it at critical moments.
    When you look back on who you were when you were eighteen, just before the corruption
    sets in, you’re bound to make a small and unconvincing monument out of that shines
    only during restless nights when you cannot sleep. You need to slightly falsify
    your vanished self, varnish him. But at the same time it’s eighteen-year-old self,
    cast off like an old skin, by whom you should be judged whenever you look in the
    mirror. He is the only judge who matters. Do you continue to disappoint him? Can
    there be any other outcome? What would he say to you?

