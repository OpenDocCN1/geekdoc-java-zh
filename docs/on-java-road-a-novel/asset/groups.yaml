    在 JAVA ROAD 41


    他们需要突击队来击败那些不听管教的反叛分子。所以，在那当时，胆怯可能比勇气更占主导。然而，金士酒慢慢镇醉了我，我三个小时前才恢复的好心情也恢复了。我之前一直和路透社的
    Sheila Ng 在一起，曾一度我觉得我可能会在她身上取得成功——但她抓住第一个机会就消失得无影无踪，而老头也没有提供替补人。我正变得明显越来越老了。光靠魅力和机智过人已经不够了。尽管如此，这一天并没有完全虚度。我下午的大部分时间都在采访的一位立法员，他几乎无法控制自己对即临的打击行动的渴望。我问康宁汉他去去哪儿了。


    “我请了假去龙龙山。我一路打车去那里，当我到达山顶时，我想起没法远足，因为我太胖了。你看，我身体素质差终于开始让我付出代价了——”


    “你应该去学普拉提。”


    他的眼睛陷入了僵性麻痹状态。


    “噢，什么种类的？我听说庞提斯教的版本是最好的。”


    “严厉且带有审判性。这才是你需要的。”


    但我只是笑了。他的说话方式很有喜剧演员的风范。庞提斯普拉提。


    他问我最近在忙什么。在见谁？


    “没真见什么人。不过我周四要见 Jimmy Tang。”


    “唐？你大学时代不就认识他吗？”


    “几十年前的事了。完全是因为有他，我才在这里的。你见过他吗？”


    “对我来说太‘高富帅’了。我只是在八卦杂志上关注他。”


    全都是因为一个醉酒的三合会，我想。


    我看了看手表表，装作这很重要似的。


    “我可以开车去康诺萨检查一下。我们再来一轮，你可以告诉他们这对你来说很正常——你是个酒鬼。”


    “他打我的时候，我可能只是微醺。”


    康宁汉告诉我，《时代》杂志可能会在年底撤掉他，把他派往雅加达。他在香港享受生活、扮演“白人记者”的十二年可能要结束了，他将回到炼狱，要么在雅加达，要么最终在萨里的某个郊区。后者是我们大多数人的死后之地。他在香港期间一分钱都没存下，因为没有人能存，也存不到。但他他在南大岛有一间小房子，那是他早期买的，但现在几乎很少用。也许他会死在那里，面对着南中国海。


    十二年前，这座城市还是一个完全不同的地方，那时感觉它像是一个避开历史风暴的避风港。但风暴又回来了，我们内心深处根深蒂固的安全感已经消失了。康宁汉会继续写那些关于愚蠢和暴暴行径的故事，甚至连他自己的读者也并不那么感兴趣，而我，如果运气足够好的话，会继续住在这里，为网站、新闻机构以及偶尔的杂志撰稿，因为在2006年景气好的时候，我也为自己买了一处小地方。只要不用付房租，你可以随心做的事过日子——这长期以来一直是我的哲学。


    一轮之后，我随心所欲地付了钱，回到外面找了辆车带我上中环，去康诺萨医院。在那里，我因在派对上的小意外以及因极其严重的宿醉导致的家里的倒霉事而声名显赫。然而，那天晚上，当我瘫在后座，看着外外公路一圈又一圈地转，看着公园里湿漉漉的树，透过开的车窗吸入催泪气的气味时，我觉得某些东西静静地结束了。我被一个当地人袭击了，他认定我是新的敌人。在当地生活的二十年里，这种情况从未发生过。化学反应已经了，正如最终会发生的那样，我不再无坚不摧。我们爬到城市上方，离
    Jimmy 所在的公寓并不远。医院空空如也，我在现场接受了治疗。一个伤口，呐，到底是怎么发生的？我撒了谎，我觉得隐瞒我现在意识到的意识形态攻击或种族攻击要好。


    “他打我时，我可能只是微醺。”


    康宁汉告诉我，《时代》杂志可能会在年底撤掉他，把他派往雅加达。他在香港享受生活、扮演“白人记者”的十二年可能要结束了，他将回到炼狱，要么在雅加达，要么最终在萨里的某个郊区。后者是我们大多数人的死后之地。他在香港期间一分钱都没存下，因为没有人能存，也存不到。但他他在南大岛有一间小房子，那是他早期买的，但现在几乎很少用。也许他会死在那里，面对着南中国海。


