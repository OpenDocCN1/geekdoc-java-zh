    # 198 劳伦斯·奥斯本


    “我们从没有和她在那儿吃过饭。她讨厌死那个地方了。”To保持冷静，试图唤起他的记忆。


    “一定是某个被你忘掉了，”他试探道，“只要你试着去就能想起来——”


    “我什么都记得，盖尔先生。我和妻子总是单独去那儿吃饭。我们从不和朋友聚餐。丽贝卡，完全没有。正如我所说，除了三年前的一顿圣诞晚餐，我们从未和她一起吃过饭。那次我确实记得。”


    “我-我一定搞错了，”我结结巴巴说道。


    “你在那里？”


    “我经常去那里。我是这里的会员。”


    “我从没在那儿见过你。但我可以问问，你是怎么知道餐厅里的人是我们？我们从未互相介绍过。”


    然而，我的脑海在时间中倒流，回到了那些杜士忌，她皮肤上异样的光泽，她的口红在杯缘上没有留下痕迹。我看到过他们聚聚在一起，我很确定这一点。当我们从吧台起身时，我曾握了一刻丽贝卡的手，那感觉就像噩梦一样真实。一切似乎都是坚实而灿烂的——甚至令人神采奕奕——然而所有的物理事物可能并非真实。我是否真的像我想中那样去过那里？在公园里的散步曾有多真实？在黑暗中上山的出租车之旅又是有多真实？


    “无论如何，”To继续说道，试图将话题从中国会乐部移开，“我一直想和你谈谈这个，盖尔。我很清楚你和丽贝卡是朋友，而且你们三个人曾在那艘游艇上聚会。我发现，金米·汤也是你的老朋友。鉴于此，我在想——我和妻子也在想——关于我们女儿的死，你是否有什么可以告诉我们？或者，你是否知道他们一直在通奸。”


    “我知道金米·汤去过停尸间。是的，他们确实在通奸。”


    “你对这两件事都确定吗？”


    我说我尽如所能确定。他的手紧绷起来，仿佛在拉扯一根精神上的绳子，眼神变得阴毒。


    “那只老鼠。你这个大大风病人。”


    他似乎在同时对这两条信息做出反应。我追问了他们的关系，并告诉了他我所知的，那相当多。


    “丽贝卡和我我并不是亲密的朋友。尽管如此——我觉得我应该告诉你。以防你以为我在隐瞒什么。


    我必须告诉你，我们对汤先生有最严重的怀疑。而且他的行为一直很古怪。他没有来看过我们。他甚至不承认自己和她有染。他是个胆小夫，不是吗？”


    我们不都是这样吗？我想。


    “他正在逃避什么，”我说，“他很害怕。”


    To随后放松了双手，一种更加无奈的情绪似乎笼罩了他。继续谈论那个滑头脑的金米是徒劳的。他说他在过去的几个夜晚里一直感觉到女儿的气息；他无法入睡，房子周围的大树似乎被风扰得异常。安全灯无缘无故地亮起，大门的链条咯咯作响。他的妻子告诉他，丽贝卡的灵魂就在他们身边，她也感受到了，并且深信不疑。她正守着这栋房子，让他们知道她在。


    他问我是否相信鬼。我说我不确定自己有多相信它们。“啊，”他叹了口气，“你不是中国人。”对于他们来说，他说情况完全不同。接着他问我，是否认为他的妻子去找她喜欢的拜访的灵媒来与祖先交流是明智之举。我说我无法对此提供意见，但也许可能有缓解作用。


