    "Not me," Jimmy said. "I’ve got nowhere to go."


    "What do you know about the curfew?" Rebecca asked Jimmy.


    "I heard about it last night at a poker table. True story. The government minions
    are leaking it everywhere. Beijing gave them the order, they say."


    "When did they *not* give the orders?" Rebecca said.


    Jimmy said, "They might not do it. After all, a curfew would be an incredibly
    stupid thing to do. And that," he sighed, "is why they will do it."


    It seemed to me that something deflated in Rebecca. Her mood became listless,
    or just disinterested. We went upstairs afterward to the second-floor bar, which
    was more crowded than the restaurant. We was a hangout for the groomed and the
    rich: people with much to lose. There was an outdoor terrace filled with capacity
    with young locals in Armoury suits and drenched in humidity. I used to look at
    them with a measured envy, these beauties of the terrace, but now I just felt
    sorry for them. What future did they have in the new order that was coalescing
    around them? They’d still be rich, but they would be marooned as far as their
    other liberties went. They shown no signs of anxiety, however. It was a stifling
    night and the small-production gin flowed. We couldn’t hear anything from the
    streets nearby. Queen’s Road Central was silent, the Landmark was closed. The
    lanes that ran upward from Queen’s Road were no longer thronged. The previous
    age had seemingly ended, and its more obvious street-level revel had finally dispersed.
    We went outside and Jimmy excused himself to go to the bathroom. When I was alone
    with Rebecca, she turned to me and asked if it was true that I had once been married
    and that I had lost all my money gambling in Macao.


    “Is that what he told you?”


    She smiled behind a raised hand.


    “He did. But perhaps he was pulling my leg,”


    He had been, so I resorted to irony. “No, it’s all true. I had an illness and
    I had to lose all my money to find the cure.”


    The bright eyes revealed a moment’s incredulity.


    “And now you live in the Garland building?”


    “I know you don’t know it. But yes, I’m planning to die there, too. I can’t think
    of anywhere better. Perhaps I’m a bit lazy by nature, or else we are all. We find
    a good spot and then we are loathe to leave it. It takes so much energy to get
    up and leave. Besides, I don’t think I could adapt to a Western city now. London
    would be the end of me.”


    “It’ll sound sad in the papers.”


    She said it in Chinese and I had to admit it sounded quite appealing. London is
    the end of a returning Englishman.


    She went on, “So it’s too late to go back to the UK? Many of us might be going
    there, as I’m sure you’ve heard.”


    “For me home is here. I used to think one could pack up and leave toward the end
    of one’s life. But it’s not like that. Without knowing it, you cross a line and
    wake up one day and find that it’s too late to go back. I used to think it would
    be my fiftieth birthday, and I crossed that line already. It’s a sort of weariness.
    You think, ‘What does it matter where I disappear? Hampstead or Mong Kok here
    in Hong Kong—what can it possibly matter?’ And because you are in fact already
    in Mong Kok, or wherever it may be, you just coast along and die in Mong Kok.
    And no one is going to care where you died.


    “Really?”


    I shook my head, adding:

    “I wouldn’t want to die in Varanasi, for obvious reasons. But anywhere else—”


    “But Varanasi would be the best place to die.”


    “You’d want to die alone, not surrounded by millions of other recently dead people.”

    “I think you don’t want to go back to your family. I understand that. Families
    are the worst, and I say that as a Chinese.”


    “May the gods strike you down.”


    After a beat I went on:

    “You’re right. It’s sad, I agree. Families! I have a sister, a brother, and a
    mother, and really I should be taking care of them. But here I am being selfish.
    How about neither Varanasi nor Hampstead?”


    She said, “I think I’d take Hampstead over Mong Kok. Not for living, but certainly
    for dying.”


    “You’re not there yet. You’re not even there.”


    I felt myself flirting with her. Pointless obviously, but it was some way from
    the heart. It had to be done with levity. Small talk swirled between us, she laughed
    once or twice, and we came, she and I, to a clearing in the forest.


    “I hope you stay,” she said lightly. “Don’t have a girlfriend?”


    I looked down at my fingernails and the moment seemed even more ridiculous to
    me than they usually did. Untidy crescents, ruined by constant worrying. “No.
    I’ve lost the touch for that sort of thing. I sometimes think it’s because I’ve
    lost the knack for fun. Fun is the word I hate most.”


    Didn’t Jimmy tell you one has to have fun before all goes dark? I would have thought
    you were a fun expert. Aren’t you?”


    “Not at all, no. I’m a tired person.”


    But we were laughing off, and she didn’t believe a word of it. “Jimmy and I differ.
    With me it’s a choice. I like coming out a bit. It keeps the flies away.”


    “Ah.” Of course I seriously doubted it. “I think I might have to go so soon,”
    she said, stifling a yawn. “I’m actually tired. I inhaled too much tear gas earlier.”


    “What about Jimmy?”


    He’ll go home to his wife and a hot today. It’s a weekday. Simple as that?”


    The eyes slackened a little, her uncommitted smile matched mine. “We go separate
    ways. We’re not tied to each other night and day, in case you hadn’t noticed.
    Married men. I call them ‘the tribe.’ It was a step too far in the direction of
    confession and I could see that she instantly regretted it. It’s your game, I
    thought. Your rules.


    “You and Jimmy can stay out drinking, or whatever is you like to do. What a shame
    there aren’t any opium houses left. Stay,” I wanted to say. “The night is still
    middle-aged.” I glanced down at her legs crossed at an angle to mine and noticed
    that there were spots of blue dye on her shins. The police used that in their
    water cannons so that anyone touched by their spray could be identified later.
    “Where did you go?” I asked, in such a way that we both understood what I meant.


    “Nowhere special—I wandered the streets. Who wants to know?


    “Didn’t Jimmy tell you not to go?”


    “He did but it’s not his call. He can’t go but I can. And since I must go, I do.”
    She paused. “Same as you.”


    “Then I might see you out there one day. Don’t be shy. You’ll see me because I
    never wear a helmet.”


    “We cockroaches aren’t shy—we’re gregarious. I don’t wear one either.”


    What said next was almost serious: “If we meet up like that I promise you won’t
    tell our mutual friend. You could even introduce me to your friends, if you felt
    like it. I’m curious about them.”


    “You mean ‘the young,’ as you call them? We’re nothing special. We’re just without
    the experience. You weren’t any different at our age.” I wondered if this was
    really true. In a single moment, provoked by such a comment, flashes of my past
    came back to me. Had I been no different from her, her generation, at that age?
    I couldn’t answer the question. I said that sometimes I feel I was never young
    because increasingly I couldn’t remember it. It felt like a pantomime I was acting
    in long ago. But I had lost the plot of it and now there was no plot at all. Growing
    old is never what you expect it to be. Beating one’s oars, borne back ceaselessly
    into the past.


    “Plot?” she said. “You’re more sentimental than me. We’re not a sentimental generation,
    if you didn’t know that. We’re not spoiled brats but not sentimental spoiled brats.”


    “There’s little wrong with being a bit sentimental. How can you not be?”


    “But you,” she went on, “had something to look forward to when you were young.
    You had a future. That’s the difference.”


    It was the simple gravity of this commonplace that took me by surprise. Young
    people in the West were always talking like this, and they had been talking like
    this for centuries. Whereas in the end, in the real world, they always turned
    out to have a reasonably comfortable future. The Sex Pistols all made good for
    themselves apart from the odd overdose. “No future” turned out to be an empty
    refrain. Our rebels eventually bought a ranch in Colorado or a beach house in
    Costa Rica. They were never in danger. But her generation in Hong Kong was facing
    a real future with no future, an actual oblivion enforced by banks, electronic
    warfare, and men with machine guns and telescopic sights. They were like the last
    pale flowers of Weimar. I thought then that if a human being takes on all the
    context in which she lives, it’s also that context which makes them beautiful.


    Jimmy reappeared, then, still talking into his phone. There were always deals
    going on that no one else knew about— openings, business opportunities, ways to
    make money

