    被翻译为“狗官”（dog officer）。“家伙”这个词随处可见——脏警察、黑人警察。警察们很快开始向他们的讽刺者回骂脏话。其中一些人用普通话说：“操你妈”。在温暖的几个月份里，最初因反对北京的一项引渡法而引发的紧张局势不断升级并失控。现在，随着事态变得更加不理性、原始，人们可以看到仇恨正像拳打和催泪瓦一样通过文字在运作。语言是承载暴力种子最高效的容器。正如阿拉伯人所说，舌头没有骨头，却能咬碎骨头。内心深处的一切都顺畅地通过那些碎骨的话语流出。当一个警察对一个十六岁的女孩说“sei
    bat po”（死吧，臭女人）时，暴力已经发生了。动词并不是行为，但它是行为的前奏，是违规者通过说出辱骂语赋予自己的一种许可。在一次对峙中，警察使用了正式警告，前线的女孩们回道：“过来，我们把你的蛋丸割掉。”对此，没有任何回应。至少在那个时刻，言语上的侮辱甚至让一排橡胶弹失效了。


    接下来的几天里，我没有参加每日的街头抗议。我照常去凤凰之城（Phoenix City），因为那里有清新的空调，以及这种感觉带给顾客的正常感。这是一种解脱。我坐在一个镜面柱旁，吃着咸鸭黄和生煎包，直到街道凉快了一些，我才能带着清醒的心智再次出发，在爪哇路（Java
    Road）延伸出来的坡道上走，寻找暴乱分子——随你怎么称呼都行。但没有人出现。一阵平静降临了，仿佛那些学生在夹克里缝进遗嘱后，决定休息几天来恢复体力，让街道回到消费主义抹去的场所。或者，在爪哇路，那里是一个挂满黑彩和单色横幅的殡仪馆之地，游荡着糖糖大亨们的幽灵，他们曾通过与爪哇的海上贸易积累财富，他们宏伟的办公室曾立于此，作为殖民大宽的象征。


    气温不断升高，到了正午，城市的居民撑着报纸和遮阳伞忍受酷热。他们穿着极简的衣服，显得忧郁而坚忍，我漫步到维酒店（Vic Hotel）后面的渡轮终点，为了沐浴海洋的凉意。从那里看，平凡间隙的力量感令人震撼。挂着浆果帆的垃圾船、对岸凯悦酒店黄昏时亮起的灯光、满载带着扇子的痛苦流汗者的渡轮，以及暮色中山峦呈现出的老茶色。大约就在这时，尸体开始出现在那些水域，被不准记者靠近的警察船静静打捞，这是新形式恐吓的首次征兆，棋盘的新构型。


    我有时会躲进维酒店（那里深受中产阶级大陆人的欢迎，并已更名），上顶楼那个半梦半醒的酒吧看日落。我偶尔还会带上泳裤，在来自边岸那些略显紧张的情侣中，在酒店泳池里偷游。我想，这只是为了离开我在加兰酒店（Garland）那窒息的小公寓。然而，当我回到自己的社区时，从未比那时更孤独；当夜幕降临，维酒店顶层没有任何比那里更孤独的地方。


    正是在那里，我常常想起唐森（Jimmy Tang），想起我们多年前在剑桥大学克莱学院（Clare College）一起学习的日子，当时我们还利用业余时间合作翻译李白的《将别书》。那是唐诗中最著名的诗作之一，也许是最著名的一首，被埃兹拉·庞德（Ezra
    Pound）翻译得乱七八糟，而我们想要创作新版的灵感源于庞德本人连句中文都不会说。我们觉得这很有趣，如果不是觉得荒谬的话。他仅仅是使用了美国学者恩内斯特·费诺洛萨（Ernest
    Fenollosa）的笔记。然而，唐森常说，他的解读几乎和原诗一样魂牵梦萦。此外，他对李白的翻译首次向西方读者介绍了中国诗歌。这怎么可能？然而，庞德为英语读者发明了标题，并将诗人的正确名字——李白，改成了“Li
    Po”。原题是《过华山石怀远：寄桃州尉严信》。


    唐森是香港最富有的家族之一的后裔，而我是来自一个没人听过的小镇的奖学金学生。但共同的大学使我们变得平等。现在，大约二十五年后，我们在迥然不同的香港环境中再次成为朋友，而鸿沟自然再次出现了。他是一个百万富翁名流，我是一个苦苦挣扎的——可以说是相当落魄的——记者。即便在我们读本科生时，我就察觉到他是那种可能会从指缝滑落并消失的人，尽管他总是看起来如此光彩而稳固，拥有一生的馈赠。即便在那时，在那座中世纪的大学里，学习中文的人寥寥无几，我们也共享着某种他人看不见的精神领地。虽然微弱，但我们现在依然拥有。


    我记得十十月的一个早晨，那时我们刚开始第一个学期：我看到他正穿过学院庭院。他才18岁，比我小一点，他穿着板球白运动服，和一个中国女孩走向河边，肩上披着一件针织衫，在铺路面上留下一道奇怪的水迹。我独自待在小小的隔间里，是一个没有朋友的公立学校男孩，学习中文是因为它极度过时，但至少也是一个引人入胜且不可及的主题。说这样并不夸张：这对在克莱学院庭阴影下牵手的情侣，与我遇到的任何人都不同。那个学期晚些时候，在我们结识后，唐森给了我一本伊萨克·沃尔尔顿的《完全钓鱼》（*Compleat
    Angler*），那是他在香港的父亲当年送给他的。书中有一段几个年来钓鱼者中广为人知的观察，关于将青蛙作为鱼饵的用法：“像爱它一样使用它，也就是说，尽可能少地伤害它，让它活得更久一点。”你可以理解为什么一个冷酷的父亲会给儿子这样的书，以及为什么唐森在英国懒散的精英阶层中学习时随身带着它。当时，他只是说这是我能想象到的关于学习生活最明智的书，因为生活确实就像钓鱼。它需要耐心、狡计以及长时间静坐观察静止水面的能力。它鼓励一种寂静杀戮的品味。《完全钓鱼》的另一个优点是，香港从未有人读过它。它是秘密知识，是一本关于诡计和说服的手。后来，我从未向他提到过那本书，那感觉像是唐父子之间略显珍贵的亲情。我想知道他在关键时刻是否还会翻阅它。当你回望自己18岁时的样子，在腐败开始之前，你不可避免会为那个自己建立一座微小且缺乏说服力的纪念碑，它只在失眠的深夜里发光。你需要轻微伪造你那消失的自我，为他上油漆。但同时，每当你照镜子时，都应该由那个像旧皮一样被丢弃的自我来审判你。他是唯一的法判官。你会继续让他失望吗？还会有其他结果吗？他会对你说什么？

