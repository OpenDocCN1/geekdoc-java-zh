    # Java望路 (On Java Road)


    *小说*


    ## 劳伦斯·奥斯本 (Lawrence Osborne)

    《被赦》作者


    > “十二年前，香港还是一个完全不同的地方，那时感觉自己躲避了历史风暴的侵袭。但风暴已经回归，我们心中根深蒂固的安全感消失了。”


    在香港当了二十年记者后，英国籍居留艾德里安·盖尔（Adrian Gyle）几乎毫无建树。晚上，他常在爪望路家楼下的“凤盛”餐厅吃着饺子喝着茶消磨时光，看着这座城市——这座城市曾充斥着各种晚宴和私人会员俱乐部——随着亲民主游威日益逼近家园而爆发暴力。


    在摩天大楼上俯瞰的是艾德里安的老友唐振杰（Jimmy Tang），他是香港最富有家族的后裔。正当盖尔准备离开香港时，他发现了最后一个谜团：神秘的丽贝卡（Rebecca），一名参与抗议的学生，也是唐振杰最近一次鲁莽的情人对象。但当丽贝卡失踪、唐振杰躲藏起来时，盖尔感到了那股熟悉的调查冲动。


    通过拼凑丽贝卡的最后几天和几小时，盖尔必须在一个充满友谊与背叛的动荡世界中谨慎行事，在这个世界上，个人忠诚在他曾经熟悉的城市中消失殆尽。《爪望路》讲述了一个处于旧世界与新秩序断裂线上、追求真理的故事。


    ![](img/fa4a0f9f459724ddedf1aff7a86c9b24_4_0.png)


    https://archive.org/details/onjavaradnovel0000osbo


