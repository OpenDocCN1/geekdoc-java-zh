    ## 168 LAWRENCE OSBORNE


    turned in, as he put it, did not represent quite the same risk that it would for
    a Hong Konger. It was a bluff on my part, but it seemed to work.


    “It would be bribery,” he said archly.

    “I’ll say it was a misunderstanding.”

    He was not as docile as he looked, then.


    “Tell me about the girl,” I said, beginning to sweat, lose control of my hands.
    “There’s no hurry. Go ahead.”


    I ordered more coffee. He talked quite smoothly. The girl was a drowning. She
    had been taken into the lab and they had examined her. She had been dead for only
    two or three hours, in the water for an hour, and by way of explanation, police
    had told them that she had been found at the surface floating a half-mile out
    between Waterfall Bay and Pak Kok Tsui. She was partially clothed but wearing
    only underwear from the waist down. He was not, however, the one who had completed
    the autopsy. That was another doctor. But later that man had told him privately
    that although she drowned, it was very possible she had also been assaulted beforehand.
    This doctor was sure that she had been made unconscious before being left in the
    water. Her blood contained of droperidol. It was a strange agent to find in her
    because it was usually used for its anxiolytic properties. However, high doses
    made it useful as a sedative for terminally patients when one wanted to quell
    her delirium.


    It must have been used to sedate her, because the concentrations in her blood
    were remarkably high. The colleague on duty at the morgue told him that he had
    been instructed to fill out the forms indicating suicide as the cause of death
    and to leave it at at that. It was presumably why Wong had been withdrawn from
    the autopsy; they didn’t want any dissenting opinions. Wong’s colleague had filled
    out the forms and signed them, because at the end of the day who doesn’t want
    to live a quiet life? Afterward the colleague had told Wong what he really thought
    in order to get it off his chest. But then again, she had hardly been the first
    they had seen or the first about which they had heard rumors. As far as the doctors
    were concerned they were protesters being picked up every night and taken to high-security
    depots. What happened inside these holding facilities they couldn’t say. His colleague
    didn’t much care, but he, Wong, did care. He was not political, he said, but he
    cared.


    I sensed then that he had spoken to me for reasons other than just money. He might
    not care about my “cause,” but his conscience was bothering him. Was it that?
    So he was not as cynical as I had initially assumed. Maybe things got a little
    frenzied, he went on, and maybe the police didn’t mind it that way. It enabled
    them to vent their frustrations. Either way, it was hardly random. The word was
    that they were arresting the students and “picking out” those they regarded as
    the bad apples because they already had files on all of them. Therefore they knew
    exactly who the girl was and why she was on the street. Where she had been picked
    up, he couldn’t say. But, I pressed him, why on earth Jimmy Tang been called down
    to the morgue before anyone else?


    He staggered, “I-I can’t offer you a theory, I’m afraid. Maybe his family have
    an understanding with the police and they wanted to keep him in the loop or out
    of the tabloids. You know how this city is.”


    “It’s the only thing I do know, I suppose.”


    The pieces had begun to come together in my mind. Terrible Tang had been called
    to the morgue by the police, whom he obviously knew, before news of the girl''s
    death got out. His involvement made no sense until I thought about it a bit more.
    Was it possible that he had been involved in her disappearance? He had certainly
    gotten rid of an embarrassment, a thorn in his side. Maybe he had done it under
    the guise of an accidental death at the hands of the police during a confrontation.
    It was extravagant to think it might be true, but in the end it would have been
    convenient for him.


