    # 太平山道 107


    “我现在要上山顶了，”她说，“我想你一定也很忙。吉米今晚留在了城里，他家里有聚会。所以我打算在山上过一晚。我更喜欢待在那儿。”


    我脱口而出说，如果她愿意，我可以开车送她回去，然后顺便送我回家。这只是个小小的绕路。


    “你不必那样做。”

    “这是绅士的责任。”


    这个关于绅士及其责任的想法似乎让她陷入了沉思。


    最后，这在夜晚是一段短短的车程，她没有理由拒绝。上山的路上空无一人，月光穿过叶缝散落在蜿蜒道路上，山顶那令人眩晕的丛林沐浴在弧灯的光芒中。她摇下车窗，靠在潮湿的皮革座椅上。我在想，她是否觉得我很无聊。至少她没有这么说，而且像以前一样，我们不再需要交谈。这种感觉很清爽。话得越少，感受就越多。感受越深，越无话可说。最后，司机把我们留在电车终点站，我请他在黑暗中等我。丽贝卡和我走上陆加德道（Lugard
    Road），这是一条英国人在1914年建造的、长三英里的带铁栏行人步行道，它环绕着山顶穿过森林。它蜿蜒经过陡峭的大榉和樟树丛林，俯瞰着城市的景色，从这个高度看，城市那一刻似乎沉浸在自己遥远的光芒中。


    此时小路已空空如也。但从城市方向，我们能听到隐没在空中看不见的警察直升机发出的沉闷轰嗡声。


    # 108 劳伦斯·奥斯伯恩


    我从未想过真的会有人住在陆加德道，但当我深夜站在那里时，我注意到了一些之前并未留意的建筑。在小巷的两侧都立着来自旧时代的巨大而阴森的别墅，有些别墅配有带柱廊的宏伟露台。大多数房子看起来是荒废的，处于半废墟状态。从路面上向上看，我可以看到房间的窗户，那些天花板已被剥光，露出了隔热层和横梁。有几间房子仍有人居住，住那里的人富得“富有”这个词本身已经失去了意义。它们一定是地球上最昂贵的房子。路下方的一栋空空房屋拥有一座宫殿般的温室，玻璃窗上布满了苔藓，旁边有一条连接它与房子的有盖走廊。无法知道曾经住在那里的是谁，或者现在是谁仍拥有这片价值数千万甚至上亿的土地。这些房子里的大族曾与我母国家的幽灵交织在一起，他们躲到这里避暑，并带来了印度和马来西亚那些令人慰藉的植物。他们哭泣的印度橡胶树根部垂在路面上，在我们从下面经过时拂过我们的脸。那里有陡峭的扇形棕榈峡谷，夜晚昆虫嗡嗡作响，岩墙上方耸立着她祖父的房子，顶端有着铁丝网防御工事和铁矛。没有任何明显的迹象表明我们正接近任何城市。我们通过一条由格栅大门保护的坡道靠近它，大门似乎已经废弃了半世纪。当我们靠近时，两盏古老的壁灯自动亮了。。在大门处，她伸出手握了我的手，这种交流并不像预想中那样温暖。我想，她很局促，我也是如此。我告诉她，我们在一周内会和吉米重聚，在此之前，也许她留在太平山顶，和那些扇形棕榈在一起，远离麻烦是件好主意。


    “我也可以对你说同样，艾德里安。你应该回去写餐厅评论了。”


    “我曾是个糟糕的食评评论家。”


    “谢天谢地如此。既然你提到了，其实留在这里倒不是什么坏主意。你不喜欢这里的气味吗？”


    “丛林，”我吐了口气。


    “人怎么能在一个没有丛林的地方生活呢？”


    那就像死了一样，我想。


    就在那时，我注意到了一些违和的现象。灯光将我的影子投射在周围，有时投射在墙上，有时沿着人行道延伸。在孤独的散步中，人们会注意到这些。我想，在阴影的隧道里，自己的影子变得更加明显。但当我俯视这场由我行走而启动的移动影戏时，我有一刻觉得我没有看到她。即使灯光几乎就在我们头上方，一道锐利的影子从我的脚下流出，我却看到没有任何影子从她那里散发出来。仿佛光线以一种不同的方式从她身上反射，或者直接穿过了她而毫无影响，又或许这只是那个时分光影的交错作用。无论如何，该告别了。她转过身按开关进了屋，灯光熄灭，她消失在黑暗中。一道矩形的月光掠过她的背影，我想说些轻快、幽默且某种程度上真实的话，跟在她身后。但言语没有出现在脑海。这样的时刻凭空出现，像曲球一样快，而且通常抓不住。我转过身。


    坐着同一辆车从太平山向下时，司机透过后视镜盯着我，仿佛我失败了某项情色任务。我在思考，直到现在我甚至连皮毛都没有触及丽贝卡的谜团。我觉得有什么东西向我伸出——一个提议——但同时它并不真实，从下午以来我没有听过关于任何事。我还在洗澡，在酒店拨通了我那个被抛弃编辑的电话，为失踪道歉。我解释说，突然一阵恶心，加上双腿莫名的无力——最近的压力一直在折磨着我。


    “你满嘴胡说，”斯特里克说，“我看到你和一个女孩在一起了。但这次我们会搞定的。事实上，我正准备给你打电话：我需要你去那家医院，他们那里关着今晚被中枪的孩子。”


    我没听说什么孩子中枪的事，但从下午以来，我确实没听过任何任何事。


    “你知道哪一家吗？”斯特里克问。


    “我这就去，大师。”


    “不错，小子。试着在镜头前表现得痛苦点。我的不是让他痛苦，我是要让全世界看到。”


    # 六


    # 112 劳伦斯·奥斯伯恩


    我能听到隔壁房间传来的电视剧《我们人的时代》，我不知道那个单元里住着谁。我半确定曾见过一个老太太站在门口拿着钥匙。但那是很久以前的事了。是的，那确实是《四十年路》。我曾在飞机上上看过。听到墙里传来的声音让我笑了。但同时，这感觉并不像应该那样的巧合。


