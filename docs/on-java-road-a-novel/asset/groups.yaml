    她走过它时，手轻地抚摸过它的侧面，就像她现在这样做。“我很高兴你来了，”她说，一边领着我进去，并没有转向我，“吉米一整天心情都糟糕极了。”


    “噢？”


    “家里人希望他能对香港局势发表一个表态，让当局知道我们的立场——希望是和他们站在一起。”


    “发表表态？”他们想让他宣布自己对国家和共产党的忠诚。嗯，措辞应该不会写成那样的。”


    “那会怎么措辞呢？”


    她在内心挣扎，我看得出来，她咬紧牙关，嘴部线条变得紧绷，她调动了所有的外交手段。


    “措辞会写成一种对信仰的宣言——对香港未来的信仰。我非得说得白吗？”


    这些年来，我一直认为他们的家是全香港最优雅的住所，尽管它很老旧，带着某种咯吱作响的年代，而且剥离了现代科技。它是刻意设计的维多利亚风格，因为那是梅莉莎父亲更偏向西方的口味，但渐渐，她自己那种更中式的感性开始占据主导。水晶灯散发着静止而不安的光芒，墙上的挂毯在风格上展示着紫禁城的场景，悬浮于东方主义与真实的东方之间，而陶俑现在随处可见，架在底座上或陈列在龛内，博物馆级的品质，且带着一种过分的自傲。它们散落在几幅20世纪60年代后期精致的易·赞（Luis
    Chan）迷幻彩画之间，那些画描绘了梦幻的岛屿和幽灵，旁边还有迷幻的恐龙和外形奇异的鸟；还有一件更具争议的当代新现实主义风格陈友辉的作品，那是吉米强迫他的妻子接受的。我知道陈友辉画的是几十年前经典香港电影的剧照，而他的反建制政治让他不受梅莉莎那种背景的人待见——然而，那幅作品挂在他们的客厅里，几乎没人注意到，透着一种不安的妥协精神。一群男人穿着背心围坐在桌子旁，在20世纪70年代某个被遗忘的年份里打着牌，散发着无声的威胁。


    这个房间通向一个阳台，阳台沐浴在向维多利亚港延伸的永不睡眠的大楼灯光中。海面显现，尖角的霓虹灯在黑色的水面上闪烁，轮渡船穿过倒影。已经有一组人坐在藤椅上，喝着公用壶里的曼哈顿冰茶。我认识他们中的几个人。唐家有两个尴尬重叠的圈子：一边是高回报的对冲基金经理和银行家，另一边是记者和学者，他们来到半山山的这个异域世界，与这些金融大佬为社交，而大佬们反过来几乎没注意到他们。我对这两个圈子都很熟悉，尽管在某种意义上我更倾向于银行家。他们没那么虚伪，他们那种友善的法西斯主义非常直率。


    但与此同时，还有第二个阳台，吉米把那里变成了一个热带花园，从另一个房间进入，梅莉莎带我去那里，因为她想和我单独谈谈，如果我不介意的话。景色是一样的，但我们独自坐在那个位于微型丛林中的单沙发上。一个女佣给我们送来了饮料。我与梅莉莎并不特别亲，尽管显然我们通过吉米认识了多年。我觉得她很有同情心，而且以她的方式来说，有一种脆弱的尊贵。高贵的不是她对吉米幼稚和自私的冷静忍受，而是她那种假装自己为了某种崇高目标而认为某些事没错的能力。她会赞美中国共产党在修建公路或成功将漫游者送到月球背面的方面的效率。她并不真的像党那样相信这种效率很重要，但她确实相信国家的崛起及其长久的、不断演变的荣光，这将在某一天保证一个霸权的格局。更重要的是，这也是她的未来，也是她家人的未来。大多数人会称这为伪善或更糟，因为显而易见，她并不完全相信共产主义本身。

