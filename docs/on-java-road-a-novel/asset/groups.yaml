    rebellion. In his villas he could swim in heated pools and enjoy the prized live
    fish from distant provinces brought in from the four corners of the land in plastic
    bags on special trains to be served at his dinner table. But one thing he could
    not control obstructive noises of any kind, especially those of dogs and frogs.
    The security details were charged with noise suppression. The frogs were easy
    to kill off, but the frogs presented a more obdurate challenge. They were too
