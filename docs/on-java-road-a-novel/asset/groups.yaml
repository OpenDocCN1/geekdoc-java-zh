    THE CAR STOPPED JUST AHEAD OF ME AND A DRIVER IN full uniform jumped out with
    surprising friendliness and announced his master''s name. “Would I mind taking
    a short drive with Mr. To, since he would greatly appreciate a conversation with
    me, if I didn’t?” After a moment’s alarm, I consented.


    We sat in the back of the car. Mr. To was a quiet man, he looked out the window.
    “Did you see the article?” he asked.


    “I did,” I said.


    “It was very bold,” he said.


    “I thought it was necessary,” I said.


    “But it is dangerous,” he said.


    “I know,” I said.


    We drove in silence for a while. “What are you going to do now?” he asked.


    “I don’t know,” I said.


    The car stopped in front of a house. “This is here,” he said. “Thank you,” I said.


    “See you again,” he said.


    “Goodbye,” I said.

