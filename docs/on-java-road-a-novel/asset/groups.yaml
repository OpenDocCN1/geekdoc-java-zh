    拿这件事开玩笑。在那之后，我没那么讨厌他了。“我们都在深陷于这这烂摊子里，”他似乎在话里行间这么说，“假装你比我更有道德，或者反之亦然，毫无意义。”他问我住在哪里，我模糊地指了指加兰山（Garland），他似乎察觉到了什么，因为他脸上掠过一丝怜悯。一个写稿匠的生活在四十岁之前还算如画。在那之后，贫穷就会抬头。


    “祝你好运，”他说，留我在中营街的一个街角，语气带着一种低调的终结感，暗示我们一段时间内不会再见面，而且我们双方都不介意。


    就在那天晚上，我拨通了他给我的号码，成功接通了其中一个。我在给安德·王博士（Dr. Andrew Wong）的语音邮件中用了我沙哑且破碎的粤语，并留下了电话。我告诉他考虑一下并回给我，只说：“我会付高报酬，而且只是你和我之间的事。”


    “这是什么事？”王博士在给我回电话时以此作为问候。


    “是关于一个进过太平间间的女孩。”


    我觉得这么直白地说出来很廉价，但别无选择。我甚至不确定自己在要求什么，只是在对着飞镖盘乱掷。


    “什么女孩？”


    “也许我们可以见面时再谈这个。”


    他沉默了良久，呼吸声沉重。我的语音邮件显然让他大吃一惊，他如此犹豫也是可以理解的。


    “你确定这是个好主意吗？你说你是英国人。你是外媒吗？”


    “香港媒体。”


    “那你要如何保证保密？”


    “我知道怎么做。但我偏于不要在电话里谈。你想回电给我，还是我们现在约时间见面？”


    他停顿了一下。“我会等一下考虑考虑。”


    “如果你不把这件事告诉别人，我将不胜感激。”


    “很好。你保证不录音任何东西吗？”


    在那地方工作的人根本不会听说过我。但一个提供金钱换谈的外国人，对于他们这些薪水平平的人来说，是一个令人兴奋的困境。


    在这一周剩下的时间里，我思考着可能的结果。王可以很容易告诉他的上级，当局就会尝试追踪电话源到我这里。这可能在几分钟内发生，然后他们就会出现在我家门口，就像他们对许多其他人这样做一样。一旦发生，我将成为人民的敌人，随之而来的是前往机场的单程旅行。想到这里，我对这个前景并不太担心。我可能会失去公寓和套房，但别人遭受过的比这惨得多。然而事实证明电话并没有被反查，我意识到王博士确实在亲自考虑。


    # 164 劳伦斯·奥斯本


    像巴瓦（Bawa）一样，他是为了自己。这意味着他最终会回电话，因为他的好奇心和贪婪会战胜理智。果其然，他建议我们在铜湾的一家小咖啡馆见面，我有时去那里看书。这是一个名为“走廊咖啡馆”（Café
    Corridor）的地方，位于一条窄巷的尽头，通向一个楼梯。楼梯向上是几模糊的按摩店。人们可以在那里坐几个小时，喝着单份法式手冲咖啡，看着顾客在楼梯上上下，永远看不腻他们脸上写出的道德困惑。有时他们在劳累后会停在那个巨大宽敞的单间房间里来一口咖啡因。我喜欢那里，因为没有对着街道的窗户。我们不会被外面任何人观察到。任何这样的人都必须走过巷，并在进入咖啡馆那像矮人般的门口时被看到。那里只有五张桌子。


    王博士本人这样出现时显得显而易见，一个三十五左右的男人，穿着灰色亚麻 T 恤和牛仔裤，看起来有些显眼的下班状态。很奇的是，那些互不相识却约好的人几乎立刻就能认出对方。他们之间闪过一丝愧疚。


    我起身站起来与他握手，因为我需要他稍微喜欢我一点，毕竟他并没有做错任何事。他不是敌人。


    “你真的会说粤语？”他用那种语言问道，语气不可置信但又希望那是真的。


    “我们得换成英语。你介意吗？”


    “我是医生。我也会说。”


    他坐下，我感谢他的特意为。这也是一种道歉。


    “我让你处境很尴尬了。”


    “确实如此。”


    但他虚弱地笑了，他的恐惧在那抹笑容中露了出来。


    “没办法。但这是为了件善事。”


    “我想也许是吧。但我为了钱才帮你。我不在乎你的善事。”


    我凑了两千美元，把它塞进一个信封里，现在我把它推到他桌子那一侧。对于一个香港医生来说，这不多，但我赌的是他匿名举报背后的道德维度。那是我的赌博。这些钱只是一个象征性的姿态。因此，当他冷静地拿过去并告诉我金额时，我松了一口气。也许这没有他希望的那么多，但如果是那样的话，他也没有表现出失望。我喜欢那里，因为没有对着街道的窗户。我们不会被外面任何人观察到。任何这样的人都必须走过巷，并在进入咖啡馆那像矮人般的门口时被看到。那里只有五张桌子。


