    ## ON JAVA ROAD 113


    dispatched to the hospital in order to obtain a scoop. I was going there to provide
    a segment of emotion for our readers. Drowsy from the rum and the hot bath, I
    decided to wait until the following evening, however much the delay would annoy
    Strick. Still, I made my own hours.


    The next night, I walked over to Fung Shing first and burned through a plate of
    steamed bean curd rolls. The place was crowded with now-boisterous—perhaps emboldened—men
    with fresh haircuts, and I got a few stares as if they had mentally formed a mob,
    though I was too starved to care much. In any case, from I taxied across to Kwong
    Wah Hospital in Mong Kok, that replica of a Knights Hospital fortress rises on
    Dundas Street. There was a crowd in the foyer and on the street so I had to flash
    my press card several times to get inside. The injured boy was in a private room
    and visitors were almost completely excluded. It had been an unusual incident,
    since weapons were not readily used on either side. I gathered a cop had lost
    his temper during a brawl and let off three shots at his antagonists, of which
    one was this boy. It wouldn’t make world headlines but all the same few policemen
    without their gear were there to gently push us back and, assume, quieten us.
    They seemed to have been ordered to calm the situation down than the reverse.
    Hong Kong was a city where shootings were largely confined to the underworld realm
    of gangsters. Now it was happening to students.


    On the steps outside the sordid melee of the frustrated press, I ran into Cunningham,
    who was there for an Australian channel. He was dressed in a seersucker jacket
    that had wilted around him. He pulled me aside from the fray and told


    ## 114 LAWRENCE OSBORNE


    me that the kid wasn’t going to die but his family had put out a statement that
    they were going to sue the cops. It wouldn’t go anywhere, of course. Suing the
    police had become an improbable venture under the new dispensation.


    "Did Strick sent you down here?"


    "Who else?"


    "There’s not much of a story for you now, old boy. You’re too late.” He gave me
    a consoling smile. “I see your face hasn’t healed."


    I hadn’t thought about my wound for quite some time, but now that I did—courtesy
    of this observant clown—I felt it itch again and gave it a feel with my mind.


    "Oh, that," I muttered.


    "Looks like it got infected again. You have to be careful with nasty cuts like
    that, Gyle, like I said last time."


    He smiled and I was supposed to take it as a caring reproach.


    I said, “I’ve been too busy. Look, Cunny, if everyone else has already got the
    story we might well sod off, right?”


    He sighed: “Not me, I have to stay. Editor insists."


    "All night?"


    He glanced at his watch, as if it made a difference.


    "As long as it takes. I know it’s pointless."


    "Where’s your cameraman?"


    "He’s taking a piss inside."


    "Well, I feel like I’m at the back of the line here. It’s like half-time at a
    rugger match."


    But all the same sifted through the crowd of journos who were assembled with us
    and I could sense that they were waiting for updates that would be worth something
    in their newsrooms. It was a mood I was long familiar with. The gathering of our
    guild in a single place in search of a story we all wanted, the rivalries mellowed
    by a shared futility. The wisecracking camaraderie getting drier, more cynical
    as we got older. And of course I had known many of them for years. It''s a small
    city in the end. By virtue of Hong Kong''s constricted topography everybody is
    bound to know everybody, and if I went to the FCC the following night the same
    faces would almost certainly be there at the bar. But now unfamiliar countenances
    darted through the mob.


    I saw a photographer coming down the steps with his equipment slung over his shoulder
    and for a moment my eyes met with a mutual recognition that startled me. He passed
    by me and headed for the gates, and as he slipped away I thought I recalled him:
    the man in the beanie on the island who had been taking pictures of the lighthouse.
    I was so sure of it that I followed him out onto Dundas Street and watched him
    cross that street alone toward Dundas Square. I hesitated, wondering if it was
    worth abandoning the hospital at that point, and then decided to follow him before
    it was too late. He was walking quickly, shoulders hunched, and the streets were
    crowded because of the market on Tung Choi Street.


    He had in fact turned into that street, and as I scurled after him I reached a
    corner among the market stalls just as he passed a small Thai place I knew called
    Tom Yum. I had to half run to keep within range of him.


    Soon, throwing a glance over one shoulder, his pace relented and he strolled more
    leisurely under the whirling air-conditioning units set into the facades and the
    vertical stacks of laundry lines, his camera swinging under his left armpit.


    ## 116 LAWRENCE OSBORNE


    He was not lingering for the moment, and if he did linger I had nothing planned
    to say to him. Soon we were threading our way through the goldfish market, and,
    for a minute or so, he paused. Under the lights that illuminated wall after wall
    of goldfish suspended in plastic bags of water and cages of tweeting songbirds,
    I saw his face a little better. He was a man of about fifty, a little too ostentiously
    to be inconspicuous, in black sneakers and an indigo jacket. He stepped into one
    of the fish shops with their tanks lit and purple and examined some of the specimens,
    if he was considering a purchase. Then, exiting a little tentatively, he looked
    both ways and resumed his progress down Tung Choi until he had reached a crossing
    filled with puppies and baby rabbits and yet more goldfish. There he swung off
    the streets and it was not long before I was struggling to keep up with him. Step
    by step he slipped away among the crowds, and I felt that he knew he was being
    followed.


    Reluctantly, and feeling out of breath, I gave up and stopped by a stall to get
    an ice cream. Eating it, I retraced my steps back to the hospital, where Cunningham
    was still loitering by the doors. He looked as if he had been impaled by his own
    disappointment. Still, he had enough tact not to ask where I had gone and suggested


    ## JAVA ROAD


    instead that we give up on the wounded student and go to Spring Deer for duck
    with two friends of his, a Sri Lankan journalist called Sonny Bawa and an Australian
    businessman, Dan Moyers, who often gave Cunningham leads and contacts inside the
    government. I knew the two gentlemen a little and detested them unequivocally,
    but at the same time it was a necessary part of the job to sometimes hang out
    with the detestables in order to keep one’s ear to the ground in feverish times.
    Both of them were assiduous gossipmongers, eavesdroppers, conspiracy enthusiasts,
    and orchestrators of spy networks: dinner with them often paid off. I could endure
    them for an hour and Cunningham would buy me dinner.


    We set off along Nathan Road, therefore, where the daily disturbances were under
    way, and as we skirt around it wearing our press badges the air crackled with
    the sound of glass breaking, though I couldn''t see by whom. In passing, Cunningham
    pointed out that it was the police smashing bottles from a stockpile they had
    found so they couldn''t be used as missiles. Behind us and farther up the same
    road the first gas round had been fired from another police line and the wind
    blew it down at our heels. Stonehenge made of bricks had begun to appear on the
    roads then and around them the young black-clads stood with their woks ready to
    smother the gas canisters, in their scuba masks and ad hoc body armor, not yet
    tensed by an imminent confrontation. Gas smoke wafted over us, and as we hurried
    to get away from it I noticed how calm they appeared, almost diffident. I thought
    of them now as Rebecca’s comrades, which only endeared me to them even more. By
    Chungking

