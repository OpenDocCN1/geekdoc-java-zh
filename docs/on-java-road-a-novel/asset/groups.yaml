    # 雅士路 149 号


    “那是什么时候的事？”


    我想计算出她是在哪一个时间点确实还活着的，但吉米（Jimmy）故意含糊其辞，好像不想说。他承认的只有他们去苏荷豪宅（Soho House）吃过晚餐，而他当时并没有打算那样做。压力太大了让他无法承受了，他说。他们当时在餐厅区域。很多人注意到了。“那是一场彻底的烂摊子，”他承认道。


    我说：“但他们并不一定知道你是谁。”


    “我确定有些人知道。你从来没有过来问过我们一切是否都好。这以前在我身上从未发生过。”他正气败坏地，仿佛在重演那一切。


    “我才才一个字也不信。”


    “你知道的，”他继续说道，仿佛我的话完全无关紧要，“你和一个女人相处了这么久，你以为你了解她是谁，是个*什么*样的人，以及她为什么和你在一起。但到头来你一无所知。完全一无所知。”


    他说那一刻他直着她的眼睛，什么也没有看到任何可以认出的东西。只有一种敌意的空洞。他自然理解那是由于不愉快时刻的震惊。他几乎无法指望局面会完全按照计划进行。她开始指责、控诉，那种反应的剧烈程度让他有些措手不及。她告诉他，他之所以这样做是因为他害怕他妻的家人。事实确实如此。但他们终究是不受欢迎的。吉米可怜地说道，她完全没有尝试从他的角度来看问题。然而，他却保持了沉默，并试图让她冷静下来。但她并不买账。


