    扫视水望向对岸，那里正发生着占领学生与暴乱警察之间的战斗。在我们上方，在这个本该波澜不惊的秋日里，直升机正盘旋着，螺旋片轻微的拍击声即便在太平山顶也清晰可闻。我在想，真是奇妙，这栋空旷豪宅竟是一个完美的观景点，可以日夜地观察这场奇观。我在那里呆了一整个下午看着这一切，等当我乘坐缆车返回湾仔时，我感觉自己仿佛从瑞贝卡童年那口清凉而深邃的井中汲了水。然而不仅如此：这也是我过去的一部分——太平山上的派对，在那些我已经不记得主人的房屋阳台上进行的可卡因马拉松，以及主权移交后那段日子纯真的乐观。


    ## 十二


    “没有死亡，”毛常说，“人类生命就不可能存在。”作为一种为大饥荒期间3500万死亡死亡辩护的格言，我一直认为这句话带有一种极其非凡的、毫无疑问的病态式的冷酷。但正如主席的许多名言一样，当你仔细思考几秒钟时，它们毫无意义。他关于城市、生活方式的言论，关于书籍、文化以及那整个文明的言论也是如此。它们一文不值。当知识分子这群绝望的族群反对他破坏全国各地不可替代的古迹时，他巧妙地将他们编入了拆迁队。他没有什么比中国建筑更痛恨的了。然而，他似乎喜爱诗歌，而且那是他亲笔所写的。不可避免地，在随后的几周虚无中，我想到了主席和瑞贝卡，她们在视线之外被火化，骨灰被倒进一个塑料容器里。


    几天后，我听说托斯（The Tos）占领了他们位于半山腰的房子，并赶在圣诞节前逃到了伦敦。唐氏一家已经潜伏起来。自从那首匿名的《瑞贝卡之死》在香港电波中播出后，吉米再也没有给我打过一个电话。他一定被震惊了。他知道那是我发的，那不会是什么他无法立刻理解的东西。斯特里克（Strick）言出必行，为了保护他珍贵的“雷文”（Raven），不得不放我走，并确保我能获得三个月的、数额适中的的遣散费。我对此并没有什么不满。这是我第一次带着薪水退休。我可以从以前的生活中抽离出来。


    抗议仍在继续，但它们再也无法抓住我。我知道它们将如何结束。国家很少会在这种战斗中失败。与此同时，新闻业是一场年轻人的游戏，正如我不断向每个愿意听的人重复的那样，而一个老人的游戏究竟是什么，谁也说不。园艺和同样老化的红酒吗？我再次环顾四周。一种生活方式正在迅速消失，因此（我并不算例外）我注定也会随之消失。我想起主席有一天俯瞰着曾经色彩斑斓且富有历史底蕴的北京天线——那里依然错综复杂并充满了佛教意义——他评论道，他等不及有一天，当他再次俯瞰这同一片迷人的景色时，他看到的是一片广阔的烟囱林。他如愿以偿。


    在公历新年后的几天，在丰盛餐厅，在一个安静的一周里，我点了常菜，坐在我的角落位一直到傍晚，然后我走回家。就在那间我唯一光顾的餐厅里，那个满脸通红、带着福建口音的肉刀李先生，在周中的某个早晚，从房间另一头发现了我，发出一声大笑，引吸引了餐厅里所有人的目光。他坐在一群喝着啤酒和茅台酒的嘈杂人群中——桌子上放着一瓶来自台湾的叛逆高粱，从他们满头大汗的脸来看，那酒一定已经对他们施加了阴险的魔力。李先生大声开了几个笑话，对着空气比划着，然后看向房间另一边的那个幽灵。我听到了我的名字，“阿地乐（Ah
    di le）。”


    抗议仍在继续，但它们不再吸引我。我知道它们将如何结束。国家很少会在这种战斗中失败。与此同时，新闻业是一场年轻人的游戏，正如我不断向每个愿意听的人重复的那样，而一个老人的游戏究竟是什么，谁也说不。园艺和同样老化的红酒吗？我再次环顾四周。一种生活方式正在迅速消失，因此（我并不算例外）我注定也会随之消失。我想起主席有一天俯瞰着曾经色彩斑斓且富有历史底蕴的北京天线——那里依然错综复杂并充满了佛教意义——他评论道，他等不及有一天，当他再次俯瞰这同一片迷人的景色时，他看到的是一片广阔的烟囱林。他如愿以偿。


