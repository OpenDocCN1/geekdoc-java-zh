    她是个迷人的女人，艾德里安。是的：通常情况下，我们会像你说的那样，站在她这边。但现在不是寻常的时代了，事实是我我不会再见到她了。我建议你也这样做，同志。如果你不认同，我也无能为。


    最后上了一道甜点，那是他在我去洗手间时点点的。那是一道菜单外的特供，一个榴莲冰淇淋金字塔，上面插着几荔枝。


    “他们给我们送了甜点，”他叹了口气，用叉子叉起一颗荔枝，“他们管这叫和平。”


    当我们回到街道上时，台风已经开始了，雨伞像无的主人一样在空旷的街道上旋转。然而，这丝毫没有影响吉米的好心情。他提议坐乘他的豪华轿车送我，但我拒绝了，借口说我在附近有约会。实际上，我想在雨中走回家，让我们的对话沉淀下来。在整个过程中，我一直有一种隐约的感觉，吉米在撒谎，既对自己，也对我。但我必须问个为什么。他真的能堕落到这种地步吗？也许我一直都有这种矛盾心理，这就是为什么我起初那么认真地听巴瓦说话。那个斯里兰卡人尽管很狡猾，但他至少是个诚实的八卦者，而诚实的八卦比编造的更有趣味。我决定带着一点诱导去找他，试着从他那里获得更多信息。也许我可以提供一些八卦作为交换。当我到达北点时，我已经决定私下和巴瓦谈谈，看看我是更相信他，还是更相信那个狡猾的吉米，尽管他是我的朋友。我爬上嘉园大楼梯回到闷热的房间，房间里满了筋疲力竭的苍蝇，我喷了它们，然后坐下给巴瓦打了电话。但我不该给他提供什么。最后，我决定在他选定的一天吃顿昂贵的午餐。他那么吝啬，这会让他开口，事实证明这个判断是准确的。提到免费午餐，外人来说可能很不可信，但在作家之间存在着一种令人愉悦的美食耻辱。任何免费的盛宴都能让他们开口。


    ## 八章


    我请巴瓦在凤盛等我，语气带着一种紧迫感，让他还没来得及加码跟我还价之前就表现出我想要的反应。正如拿破曾经说过的样：“速度，速度，速度。”事实上，他比我先到那里，穿得和那天晚上在春鹿时一模一样。令我满意的念头是，凭他那微薄的工资，他只有一套西装，在报纸下自己熨烫后，每个场合都穿。他坐在我总是坐的那个位子上；服务员一定知道他是来见我的，所以指引他坐在那里。由于卑鄙的外来感而变得同类，鬼佬（gwailo）总是和鬼佬混在一起。


    “我知道你会来的，”他那自得意的神情仿佛是，在某种意义上他是对的。我第一次没有上他的饵，但现在他能看出我变得更渴望了。我点了我常吃的点心和一些普洱茶。


    “你说这是你的地方？”他问。


    “在你开口之前，是的，这是一个共产主义聚集地。我来这里是为了汤包，不是为了政治。”


    “无论如何，他们一定会注意到你。如果我有你的那种政治观点，我就不会住在这一带。”


    我说我不知道自己有任何政治观点。“但我明白你的意思。你知道我可以在我想换的时候随时切换到普通话。我的普通话讲得比粤语好。”


    巴瓦两种语言都不会说，听到这句讽刺露出了苦脸。但这并不妨碍他从我这儿赢得一顿免费午餐和一些信息。


    “我们是同一个行业的，盖尔。我知道你有些事会留在肚子里。我一样，所以我我觉得我们可以交易。我信任你会保守不外传。”


    “我亦然。”


    “我们的目标是提供服务。顺便说一下，你在《苹果日报》上的那些照片看起来相当帅气。”


    “所以你注意到了，其中一个？”


    “噢，我是这座城市知道你是谁五个人之一。”


    餐厅正处于冷清时，所以空空如也。这是一个分享秘密的完美地方。他没有浪费时间问我需要或想要什么。他经常喜欢引用滚石滚乐队关于“需要”和“想要”的话，即是：你不能总是得到你想要的，但你通常可以得到你需要的。我想那是他的行动准则。


    好吧，我想，让我们直接切入正题吧。我直率地问他是否认识一个叫杜丽（Rebecca To）的女孩。或者问起杜氏家族，略显惊讶。


    “他们挺主张选举权的，不是吗？”


    “我不确定是不是。但即使是，他们也守口如瓶，而且绝对不赞同暴力。”


    “女儿呢？如果你问的是她，我不认识她。”


    “但认识她吗？”


    “关于她？”惊讶的表情慢慢消失，取而代之的是一种更不自觉的狡黠。“我不否认我见过她。”


    “你听说了什么？”


    “你是说我*看到*了什么？整个城市都在谈论她，以防你没注意到。”


    “我知道。但除了你在《苹果日报》上看到的，你还听说了什么？”


    “没什么好说的。她是个亲民主的小丑角，不是吗？”


    “可以这么说。”

