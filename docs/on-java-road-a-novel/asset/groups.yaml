    回首过去，我很清楚我们为什么会在克莱尔尔学院（Clare）成为朋友。我们中没有一个人属于那个环境。英国上层阶级的种种装饰并不属于我们。吉米已经在更广泛的世界中占据了位置，因为尽管他来自一个殖民地，但那是富有且充满活力的之地。而我才是那个农民。一个学会了转换中文动词的农民，但终究还是个农民。


    我喜欢认为他是在同情我；也许确实如此。或者我是那只嘴里带钩的青蛙，而他是那个尽量减少伤害我的人。我每天在讲座和普通话课上见到他，正如学生之间一样，只需几周时间，我们就从点头示意到可以交谈。到大一圣诞节时，我们每晚都去老鹰酒吧（The
    Eagle），或者去菲兹罗伊街的华夫尔餐厅（Waffles），或者是新厅旁的印度餐厅，他已经在我面前占据了年长者的地位——更好的衣服、更好的发型、更强的消费能力，以及更多的文学底蕴。这就是富人总是享有的起跑优势。他们起跑得极快，只有在以后，当一切为时已晚时才可能被反超。我估算这给了他们十五年的优势，而这正是至少能追上他们所需的时间。相比之下，他们往往过早枯竭。如果你在以后以后超越了他们，他们总会抱怨他们早期的优势实际上是一种阻碍。然而，吉米永远不会遭受那样的幻灭。尽管他父亲已经把他的未来规划到了每一个细节，但吉米告诉我，甚至在离开剑桥之前，他就已向那位家长宣称，他决定成为一名唐诗学者——而他那卑劣的家族无论做什么也无法阻止他。“反正他们是一群精神病态者和挥霍者，”他对我说道，仿佛我是他唯一会说这种话的人，尽管他后来在香港又执着地重复过这些话。“我有一个叔叔，每周每天都有一辆不同的车。按颜色分类。我祖父是在
    40 年代的赌场里赚钱的。他们不过是上海的黑帮，仅此而已。如果你看得很仔细，我也是一样。”


    他喜欢提醒我，香港最早的英国人公墓专门排除了中国死者。“但你们最终还是让我们进去了——以尸体的方式。”他的英语是在香港亚士力街的圣公男学校（Diocesan
    Boys’ School）获得的，完美无缺且几乎没有口音。他后来从未提到过他在米尔菲德学校（Millfield school）的时光，我也学会了永远不要问起这些。他更感兴趣我的学校，那是英国乡村的一所普通现代中学。对他来说，那是真正的异域风情。他对这种机构背后的阶级机制深着迷。当我告诉他，我的青少年时期大部分时间都在接受培养成为一名合格的技师时，他点头说：“是的，那可能还会更好。现在你除了一个没用的中文学位外将一无所有。而且现在的西方文人中还有谁在读中国诗呢？”他可能并不相信这另一种假设的未来。但看了一眼我那令人作呕的衣服——他挑了挑眉——他明白这其中或许有事实。衣服。这就是我们最初开始去伦敦的原因。对他而言，衣服从不是微不足道的，正如对于那些从未真正严肃过的人一样。例如，在谈论毛东主义时，他只会皱脸说：“是的，是的，我明白，但衣服，同志，衣服。”


    ## 劳伦斯·奥斯本（LAWRENCE OSBORNE）


    他在 Dege and Skinner 定了衣服，在 Lock and Co. 买了帽子。我当时觉得，那些东西本属于我，但他给了我穿上它们的自信。我是那个年级中唯一一个拥有纳拿马帽且有胆量真正戴它的人。我发现自己完全不了解自己的首都，但吉米通过成千上万次的唐家家族探险对此了如指掌。我对一切都一无所知。我从未去过餐厅，从未在酒店住过夜，从未喝过酒，从未坐过黑色出租车，从未去过夜俱乐部或剧院，除了大博物馆和祖父带我去的高盖特公墓（Highgate
    Cemetery）的马克思墓外，我从未去过任何有意义的遗迹地：那是工人阶级高尚的朝圣。很难向吉米描述那个老人的场景：一个来自贝夫登（Bevdean）的退休公交车司机，站在雨中形似大卫的马克思胸像前，眼中满是泪水，双臂堆满了供奉的花；而我站在他身后，瑟瑟发冷，无动于衷。吉米·唐，一个从中国逃离共产主义者的家族后裔，会调侃道，至少犹太马克思主义者被葬在那里。


    对于吉米来说，我的“重教育”是一场皮格玛吕游戏，他以天生的技巧玩着它。这让我保持了本分，尽管是以一种微妙且不易察觉的方式。然而，这也反常地让他进入了英国社交游戏，而这种游戏即使是米尔菲德学校也从未对他开启大门。但话又回来，还有中国诗，那是文字景观中的大教堂。正是通过吉米，我学会了正确地背诵它并沉浸在它的节奏中。那首关于黄鹤塔送别孟豪然的诗是他教我背诵的第一首李白，让我变得和数亿中国学生一样相似，尽管他从未履行过要写出一首超越庞德（Pound）著名英文译本的誓言。因为你又如何改进“烟笼落江尽”呢？


    ## 第二章


    ## 唐家


    半山山（Mid-Levels）有一栋名为“博雷特大厦”（Borrett Mansions）的建筑，高耸于城市之上，是一片布满蕨类和爬植物的山坡。刚下过雨，当我下车时，山的寒意触了我的脸。大厦周围的空气弥漫着苔藓和湿树皮的味道。在这里，地面层感觉仿佛自
    1970 年以来就停滞了。我穿过后门进入大堂，那是为他们十五楼的公寓服务的。门卫已经站在那里开着门。他认识我，快走向电梯，清楚要按哪个按钮。当我以英式的风格站在电梯金属框旁时，他上上下地看着我，仿佛在判断我的鞋是否足够好。然而，当门打开时，有一个女佣在那里迎接客人。她认出了我，说道：“你好吗，盖尔先生？”当我们走向比我们更有钱的人群时，交换了一个同样忧郁的眼神。大厦的居民们早已不在别了。


    这是一个大约十五人的聚会，与其说是派对不如说是晚餐。但唐家人不喜欢坐在餐桌旁，所以客人在他们坐的地方都会受到招待。我也喜欢这样。他们是精明的主人，在家里招待方面没有出过任何错。。梅莎·唐（Melissa
    Tang）打开了门；显然，门卫已经报了我的名字。她穿着一件黑色羊毛开衫和丝绒裤，对她来说这很休闲，因为颜色相同，我唯一注意到了她脖子上的珍珠。这看起来很有戏剧性且时髦；她总是那样。这这也是她父亲——古怪的富翁周罗德（Rodney
    Chow）的老公寓，那里铺着地毯的房间和从中国收集的明陶俑让她感到舒适。周家和唐家一样富有，尽管他们的财富是从制造业和电视电视站赚来的。罗德是一个脾气古怪的老头，喜欢穿锦缎睡袍和瑞典女孩，经常在唐家的聚会上和市中心活动露面；我很少与他互动，因为我害怕并厌恶他。罗德那种夸张的品味随处可见。那些无价陶俑之一是一匹等身大的马，脖子上挂着充满土气的铃铛，像守护神一样站在门厅里。每当梅莎


