    \ landscape glitter. On our platform we had lunch. Afterward, and now only slightly\
    \ buzzed, Rebecca and I dove into the water and swam against the line of the rocks\
    \ until we found other platforms among the formations. We hauled up and lay on\
    \ the rock, chilled by the sea. On the motor launch held in place by its line,\
