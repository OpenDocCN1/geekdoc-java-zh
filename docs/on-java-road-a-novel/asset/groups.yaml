    A LITTLE BEFORE ONE O''CLOCK Jimmy walked me back down to the lobby where the
    doorman I had seen before was fast asleep in front of his monitor. We stood together
    in the cool of the forest waiting for his driver and finishing the damp stubs
    of the once-noble Cohibas. In his Dugdale suit, still only slightly rumpled from
    the evening''s frivolities, Jimmy looked like a figure from the very decade in
    which the Borrett Mansions had been built. A ghost suddenly emerging into the
    age of electrical light, an anachronism that was not quite an anachronism. It
    was then that I remembered how, when we were students, he had always reminded
    me of the Arrow Collar Man, that slick icon of male beauty invented by the American
    illustrator J. C. Leyendecker for The Saturday Evening Post in the 1920s. Elegant
    and idealized models for Interwoven socks, Clu shirts, and of course the famous
    Arrow Collars. “Ephemera” glowed from a distance, not quite real in the drab light
    of common sense and yet far more real than photographs.


    He finished his stub and instead of tossing it into the nearby fix roots darted
    back to the door and crushed it into the sand ashtray standing next to it.


    His driver swept upon us out of nowhere. Jimmy didn’t do the farewell handshake,
    only the welcome kind. I rode down to Kennedy Road and then borne mindlessly toward
    the deep-set gloom of Wan Chai Park, the Queen Elizabeth Stadium, and the Dorset,
    which I had passed the previous day. The streets were filled with little stones
    like the aftermath of a volcanic eruption. For some reason we went down Yee Wo'
