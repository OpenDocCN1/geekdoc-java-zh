  - '[PAGE 90]


    the marquis. As I noticed their flash of gold and blue, I also caught the motion
    of something altogether more human. And indeed it was a man standing without much
    pretense to invisibility in the full sun, dressed in a windbreaker and a dark
    brown beanie. He held what looked like a camera with which he was shooting the
    winding lines of the rocky coastline around us. A nature photographer, then? I
    wondered how he had gotten there. He couldn’t have swum the thirty feet of the
    channel in a windbreaker, and if he had had come on a dinghy it was nowhere in
    sight. I thought of calling out to him but he was so engrossed in his task, and
    so detached from us, that I thought better of it and told myself instead that
    it was probably one of the scientists from the Swire center who would not want
    to be disturbed. Curiously, Jimmy didn’t see him at all. I rolled onto my back
    as well, slipped my sunglasses back on.


    “Besides,” Jimmy was saying, continuing the thread of our shared thought, “it’s
    nothing to come out here—there’s a free bus to She O. From there it’s a two-kilometer
