    # ON JAVA ROAD 101


    two more. I noticed then that she was wearing the kind of lipstick that did not
    come off on the rim of her glass.


    “I was never much of a drinker, even if you thought otherwise. In fact, I kind
    of hate it.”


    “You do?”


    “It’s a habit.” She paused thoughtfully. “Why do we have all these pointless habits?”


    We touched glasses and the steely gin hit the nose.

    “Beats me,” I said. “Because it’s easy.”


    “It’s like you living at the Garland—you must like it because it’s a habit. It’s
    like what you were saying last time about getting used to a certain way of life.”


    I said it was like an old armchair you can’t stop sitting in. It was like some
    old theatres in Hong Kong that one couldn’t resist wandering into just to find
    a long-gone age. Like the Sunbeam Theatre near me, which played Cantonese opera
    on Sunday evenings.


    “You know the Sunbeam?” she said, and I was sure she charmed a little. “My parents
    used to take me there when I was little.”


    “It’s around the corner from me on King’s Road.

    I know where it is, Adrian. I love that you know it. Are you a Cantonese opera
    fan?”


    “I like the ghosts.”


    “Doesn’t everyone?”


    She put both hands on the bar, the left covered with three rings, the right with
    the nails painted a dark scarlet.


    “What about your friend downstairs?” she said.


    He’ll live. He probably went home already. Should I go down and check?


    # 102 LAWRENCE OSBORNE


    “No, because then you won’t come back.”


    “Do you want me to come back?”


    “Why wouldn’t I?”


    I said that was for her to say. Then I added: “What about Jimmy?”


    “What about him? He didn’t call tonight. He’s not my boyfriend in case you thought
    he was. He couldn’t be. He’s my pass time.”


    I laughed. “Was that it, then?”


    “You know what Indians call doing nothing? Doing pass time.”


    “You knew they’d have a word for it!”


    “It’s not the same as doing nothing, see.”


    She looked at me sarcastically, then said, “Jimmy, you know, he’s fond of you,
    in his twisted way. He is twisted, and you know he is. If you made a pass at me
    he would probably have you fed to the pigs. Or the goldfish.”


    Too old, I was thinking already, this is not your game, Adrian, and you cannot
    win at it. It’s just an amusement, especially for her.


    I said, “Maybe we shouldn’t talk about Jimmy.”

    “I hate talking about him, too. I like talking with him but I hate talking about
    him. About you as well.”


    “Do you ever do that—talk about me?”


    She was too quick to argue and said that no, they didn’t. Hadn’t meant it. But
    of course she did.


    “The thing that baffles me,” I said, “is why you would hang out with men our age.
    I really don’t understand it. You have beautiful boys your own age.”


    ON JAVA ROAD 103


    “Jimmy is fifty. You’re about the same, I assume. In Hong Kong it’s an unremarkable
    difference. We’re not neurotic about it as you Westerners are. Until you brought
    it up, in fact, I hadn’t thought about it that much.”


    “Then I’m sorry I did. It was sort of stupid, wasn’t it?”


    You know better than that, you’ve lived here a long time. But you’re forgiven.
    You’re both young-looking for your age anyway.”


    Then I asked her what she thought about getting out of the China Club and going
    for a walk. It was exquisitely dangerous to walk around at night now, in a suit
    and tie, in a real dress, dolled up for an opera that was no longer being performed.


    She said it was by far the best idea of the evening. I said that we could walk
    through Chater Garden next door if she liked—it was relatively calm tonight. We
    could walk off the coming hangover.


    “From two gimlets?”


    “You’re the lightweight.”


    In the space of a moment she had become charmed, though not, I surmised, by me.


    WE WENT DOWN TO the vestibule, de facto gallery of Chinese artists whose works
    cover the walls, and I peered into the restaurant to see where Strick was. He
    had stayed on with his bottle, chatting to people at a neighboring table whom
    he evidently knew. While Rebecca and I were waiting for the elevator I asked one
    of the staff to wait five minutes after we had left and then approach Strick with
    an explanation for my absence. I had felt sick and decided to go home. I slipped
    the boy tip, in the old-fashioned way.


    We went down alone and onto Des Voeux between the Bank of China''s two stone lions.
    The road with its curving tram lines lay empty under the overwhelming presence
    of the HSBC Building and on the far side of it Chater Garden''s still-summery
    trees bathed in orange light. We crossed over to the neoclassical court buildings
    and dived into the gardens fringed with Chinese fan palms.


    The long L-shaped pool there was covered with dried leaves, if it hadn''t been
    swept clean in years, and the paths were bathed in the massive light displays
    of the towers around it. The other, new Bank of China building, with zigzagging
    white neons alternating rhythmically, and the HSBC Building projecting immense
    red and white graphics of bamboo leaves into the surrounding darkness. I didn''t
    know why I had asked her for a walk in the gardens, the decision had not been
    entirely conscious. A small park which would probably be quiet while the cop vans
    were spread out along Chater Road. I had seen their flashing lights earlier and,
    sure enough, they were still there when we came down. On Des Voeux Road, in fact,
    curious impromptu barricades of uprooted potted palms lay unmanned among trash
    bags and sundry debris designed to deter traffic—succeeding almost completely.
    Only a few teenagers in gas masks, holding their signature umbrellas, slipped
    by in the quiet. In the gardens the rubber trees brought in by the British long
    ago dripped with a multitude of aerial roots and in the middle of the paths Chinese
    holly trees cast a sticky gloom down onto our heads as we passed underneath them.


    Rebecca explained that she and Jimmy would sometimes go to a house that her family
    owned on the Peak, a small mansion her father had built for his use. Meanwhile
    she had gradually faded into memory. There was something about it that reminded
    me of peace. She said that her father lectured her about it; her mother had sunk
    into exasper resignation. They understood the issues abstractly, of course, but
    they could not accept her course of action. And so parents and child had reached
    an impasse.


    “Personally, I don''t care that much,” Rebecca said. “The city is over and done
    with if you ask me. It’s disappearing around us. In ten years’ time it will be
    unrecognizable. Just another anonymous city.”


    I said that was the saddest part about it: the departure of her generation. A
    new wandering diaspora would be created. “But maybe this city was just a hallucination
    after all,” she said. It was never meant to last. I wonder if I’ll come back when
    I’m old and remember you and Jimmy. Light joss sticks for you both.


    “Please do. As spirits, we’ll appreciate it.”


    “You’d do the same for me, wouldn’t you?”


    “I’ve got at least twenty-five years on you. It’s not going to happen.”


    You never know, her face seemed to say. We let the matter drop and continued walking,
    in that way people have when they know the unspoken is far more interesting than
    the inverse. Yet it was a small park and soon, if you weren’t careful, you’d find
    yourself doing laps.

