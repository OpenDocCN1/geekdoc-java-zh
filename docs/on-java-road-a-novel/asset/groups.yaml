    hotel pool among the slightly nervous couples from the other side of the border.  I
    suppose it was a matter of any-'
  - '[PAGE 24]


    where but my stifling little apartment at the Garland. Yet I was never lonelier
    than when I was in my own neighborhood and nowhere was more lonely than the top
    of the Vic Hotel as night came down.


    IT WAS THERE THAT I used to think of Jimmy Tang and the days many years before
    we had studied together at Clare College, Cambridge, and, among other things,
    had worked together in our spare time on a translation of Li Po’s “The Exile’s
    Letter.” It was one of the most famous Chinese poems of the Tang period, perhaps
    the most famous, erratically translated by Ezra Pound, and our desire to embark
    on a new version was inspired by the fact that Pound himself had not been able
    to speak a word of Chinese. We found this amusing, if not preposterous. He had
    merely used the notes of the American scholar Ernest Fenollosa. And yet, Jimmy
    used to say, his interpretations were almost as haunting as the original. Beyond
    that, his translations of Li Po had introduced Chinese poetry to Western readers
    for the first time. How could it be? Pound had, however, invented the title for
    English-readers, as well as turning the poet’s correct name—Li Bai into “Li Po.”
    The original was “Remembering Our Excursion in the Past: A Letter Sent to Commissary
    Yen of Ch’ao County.


    Jimmy was a scion of one Hong Kong’s wealthiest families, and I was a scholarship
    boy from a small town no one has ever heard of. But being at university together
    had made us equals. Now, more or less a quarter of a century later, we'
  - '[PAGE 25]


    were friends again in the very different environment of Hong Kong, and the gap,
    of course, had reappeared. He was a millionaire socialite, I was a struggling—and
    one could say fairly declining—reporter. Even when we were undergraduates I had
    sensed that he was someone who might slip between your fingers and disappear,
    even though he had always appeared so radiantly solid, armed with life’s gifts.
    Even then, among only a handful of people studying Chinese in that medieval university,
    we had shared some kind of mental territory that was invisible to other people.
    Tenuously, we still did.


    I recall a morning in October when we had just started our first term: I caught
    sight of him crossing the college court. Only eighteen, a little younger than
    myself, he was walking in cricket whites with a Chinese girl toward the river,
    his shoulders draped in a cable sweater, leaving him behind a strange trail of
    water drops on the paving. They looked as if they were drenched from head to foot,
    as if they had been for a swim in the very river they were now walking toward.
    Alone in a little cell, I was the friendless provincial state-school boy studying
    Chinese because it was exquisitely unfashionable but, at least, also a seductively
    unattainable subject. And it wouldn’t be an exaggeration to say that this couple
    trailing drops and holding hands in the shadows of the Clare court were unlike
    anyone else that I had ever encountered.


    Later that term, after we had become acquaintances, Jimmy gave me a copy of Izaak
    Walton’s Compleat Angler, which his father in Hong Kong had in turn given to him'
  - '[PAGE 26]


    when he was ১৪. There was the observation, well known to anglers over the centuries,
    about the sadistic use of frogs as bait: “Use him as though you loved him, that
    is, harm him as little as you may possibly, that he may live the longer.”


    You could see why a ruthless billionaire father would give such a book to his
    son, and why Jimmy would carry it around with him as he went to study among England’s
    lazy elite. At the time, he simply said that it was the wisest book he could imagine
    for learning how to live, since life really was like fishing. It required patience,
    cunning, and an ability to sit still for long periods, paying attention to unmoving
    waters. It encouraged a taste for quiet killing. The Compleat Angler’s other advantage
    was that no one else in Hong Kong had ever read it. It was secret knowledge, a
    manual of guile and persuasion. Latter, I never mentioned that book to him it
    felt like a slightly precious affection on the part of Tang father and son. I
    wondered if he still thumbed through it at critical moments.


