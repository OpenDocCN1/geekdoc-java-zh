    那昏暗的金黄色灯光让人瞬间感到神清气爽。坦率说，我忘记了陈大德（W. W. Chan）那种沉重的氛围，在那里还要为了一套我并不喜欢的西装量尺寸。现在是点心时间，是捞糕、黑松露小笼和普洱茶的时间。我体内的贪吃立刻觉醒了。在地下这么深的地方，即使风暴直击恒生银行，我们什么也听不到。这里是有钱人的避难所。吉米也变得兴致勃勃，这帮我忘记了之前的几个小时。我大口吃着裹着油辣椒酱的萝卜糕，听他描述岳父如何对他进行严厉的教训，要求他顺从他所谓的城市新政权：共产党。讽刺的是，自从抗议开始以来，他们庞大家族中的许多成员都在伦敦和温哥华买房，寻求英国或美国护照，并将资本转移到曼谷的空公寓里。你的左手不需要承认右手在背后背后做了什么。但尽管如此，这个家族必须表现出统一战线。


    “那群骗子。变态狂、花花子、吝啬鬼和寄生虫。你无法想象他们有多恐惧。而我竟然是那个让他们丢脸的人？他们要么在逃命，要么在向新统治者低头。高卢人对罗马人是怎么说的？你们化荒为陆，却称之为和平。”


    “塔西佗。”


    “对，塔西佗——没错。”他的眼睛亮了起来，愉快地微笑。“朱利斯·凯撒。所以习就是我们的朱利斯·凯撒，而我的家人就是屈服的高卢人。天才了。”


    他对这种博学的记忆感到满意，对着我微笑，筷子间夹着一个饺子，饺子在慢动作中散开了。


    “大家都在抢出口，”他继续道，“很快我们都要像老鼠一样住在加州了。像老鼠一样。加州的人都像老鼠一样生活。嗯，不是所有人。但我——我肯定在那里会像老鼠一样生活。一只逃跑的老鼠。一只*旧政时代*的老鼠。”


    “梅莉莎对在加州流亡没意见？”我问，不确定他是认真的。


    “老天了，她当然不OK。她没有理由离开。她发誓要留在这里。她一点也不介意中国体系。她很佩服它。看来我们要闹破脸了。”


    “你也可以留下，”


    “‘可以’不是‘愿意’。”


    “尽管如此，你可以的。”


    “但我不想活在那些蠢货统治下。卑躬屈膝之类。没门。”


    卑躬屈膝，嘴里被塞进一把大大的银匙：这并不是什么世界末日。不仅如此，在许多方面这甚至是有吸引力的。人们为了获得一点安全感和稳定性会忍受什么？几乎什么都可以。这取决于他们最大的恐惧是什么。但无论如何，屈膝绝不是一种独特的中国现象。在西方，谁没有屈过膝？只是多了一些动静和噪音，但最终为了交换健康、安全和长寿而向资本主义屈膝。事实上，数百万人*梦想*过在屈膝时嘴里被塞进一把银匙。那是他们的乌托邦！吉米变得激动起来，说话时发出嘶嘶声，像个滑稽戏木偶。


    你不需要我告诉你，我的岳父，还有我父亲，对于《取日报》里的那些照片简直对我发了疯。在其他地方也是如此，唉。他们确切知道如何击中我。那是一次精准的打击，我承认这一点。你能想象老陈对我说了什么吗？那是一场仪式性的羞辱。他把我叫进办公室，教训了我一小时。他把一杯威士忌朝我脸上甩，我只能站在那里受着。我无能为力。他叫我小混混（punk）。那是他用的原话。从一个大混混头领口中说出这个词，确实有点讽刺，但我得受着。你觉得那种感觉如何？


    我觉得你会活得的。


    别跟我耍聪明。


    但你有自己的钱，不是吗？


    是的，但不是——我该怎么说呢？


    ——在同一个量级上？


    谢谢。被看不起不是什么小事。那是好几亿。我有股份。这很复杂。总之，然后他冷静了一些。


    他问过你是谁拍的照片吗？


    他当然问了。但我怎么知道呢？他甚至暗示是你——是你安排的。你能想象吗？


    我的脑海中闪过一丝呆滞的惊讶，我试图控制住，但还是没能忍住张嘴。我立刻看出这给了吉米一种无声的恳求。“别担心，我劝他放弃那件事了。但他问起了你，我得告诉他。尽管你已经在我的派对上见过他，但他不记得任何不重要的人。我坚定地告诉他这和你没关系。话虽如此，我得问问，你是否认为你认识的某人可能把主意进了他的脑子里——哪怕只是你稍微认识的人——”


    我说这太荒谬了，我连想都不想。


    “我也是这么想的。但他有一点是对的。”

