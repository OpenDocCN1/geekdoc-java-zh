    ON JAVA ROAD 41


    they needed shock troops to beat the unlike rebels. So it was probably true that
    cowardice on this occasion had been the better part of valor. Gradually, however,
    the gin sedated me and the good mood I had in three hours returned. I had been
    with Sheila Ng from Reuters and at one point it seemed that I might have some
    success with her—but she had taken the first opportunity to vanish into thin air
    and the Old Man had not yielded a replacement. I was getting noticeably older.
    Charm and rapier wit alone were no longer enough. Nevertheless the day had not
    entirely wasted. I had spent most of the afternoon interviewing a lawmaker who
    could barely control his eagerness for an imminent crackdown. I asked Cunningham
    where he had been.


    “I took the day off and went to Dragon’s Back. I took the taxi all the way there
    and when I got to the top of the mountain I remembered that I can’t hike because
    I’m too fat. You see, my lack of fitness is finally taking its toll on me—”


    “You should take up Pilates.”


    His eyes went into tonic immobility.


    “Oh, what kind? I’ve heard Pontius is the best version of it.”


    “Stern and judgmental. That’s what you need.


    Only I laughed, though. He had a comedian’s delivery. Pontius Pilates.


    He asked me what I was up to these days. Who was I seeing?


    “No one really. Though I’m meeting Jimmy Tang on Thursday.”


    “Tang? Don’t you know him from university?”


    “Decades ago. It’s only because of him that I’m here at all. Did you ever meet
    him?”


    “Too ‘beautiful people’ for me. I just follow him in the gossip rags.”


    All because of a drunk triad, I thought.


    I looked at my watch, as if it mattered.


    “I could take a car up to Canossa and have it looked at. Let’s have another round
    and you can tell them it’s normal for you—you’re an alcoholic.”


    “I was probably tipsy when he hit me.”


    Cunningham told me that Time magazine might be pulling him out at the end of the
    year and sending him to Jakarta. His twelve years of enjoying life in Hong Kong,
    playing the Great White Correspondent, were perhaps coming to an end and he would
    descend back into Purgatory either in Jakarta or eventually a suburb in Surrey.
    The latter was where most of us went to die. He hadn’t saved up a dime during
    his time in Hong Kong because no one did or could. But he had his little house
    on Lamma Island that he had bought early on but which he now hardly ever used.
    Perhaps he would die there, in sight of the South China Sea.


    Twelve years ago the city had been a very different place, sheltered as it felt
    then from the storms of history. But the storm had returned and the long-established
    security in our hearts had vanished. Cunningham would continue writing stories
    about follies and outrages that even his own readers didn''t care much about,
    and I, if I was lucky, would carry on living here doing reports for websites and
    agencies and occasionally magazines since I, too, had bought a little place for
    myself when the going had been good back in 2006. As long as you''re not paying
    rent you can get by doing what you want—that had long been my philosophy.


    One round later, willy-nilly, I paid for the drinks and went back outside to find
    a cab to take me up to the Mid-Levels and the Canossa Hospital, where I was well
    known for my minor accidents at parties and my mishaps at home caused by especially
    severe severe hangovers. That night, however, as I was slumped in the back seat
    looking out at the freeways turning circles within circles and the wet trees in
    the parks, inhaling traces of tear gas through an open window, it seemed to me
    that something had quietly come to an end. I had been assaulted by a local who
    had decided that I was the new enemy. In two decades of living there had never
    happened before. The chemistry had changed, as it eventually does, and I was no
