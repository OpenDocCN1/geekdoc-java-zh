    酒店前的沿海道立着一排黑色铁柱，可以远眺大屿的山峰，这是我每天前往大澳径行的必经之路。小径穿过优美的古树，这些树定是我的同胞在几个世纪前种下的。它像极了丽贝卡和我曾一起走过的太平山小径。这是一片被地球另一端的种族强行塑造成不同形状的景观。


    但当小径离开这片修剪过的区域时，它似乎又回到了中国：岸边是当地渔民摆放的渔具和塑料桶，环绕着半心意的铁丝网后的少林武术文化，刻有褪色红色汉字的水泥结构，以及随处可见的守石狮。很快，出现了挂着一排排切好的鱼的商店，以及在水边堆满篮筐间的花摊。在河口处，房屋高高地架建在泥沼之上，长着奇怪的自制烟囱和旗帜。


    在这里，几天很快变成了几周，随着我停留的时间越来越长，我熟悉了这条条散步道的每一寸。退潮时，我会停在泥滩边抽一会儿烟，满足于周围只有老人们和在泥地上觅食的鸟类。在我身后的二层楼阳台上，老老们也躺在破旧的沙发上抽着烟——这是一场古老与沉思之烟民的和谐共。我避开了更远的主村，因为那里在周末经常挤满了市里的一日游游客。我从泥滩转过身走回遗迹酒店，尽管我有我的种族身份，却无人注意到。然而，一个下午当我到达那里时，雨刚开始下，仿佛是察觉到了我要来，酒店的一名员工打着伞下小路接我。他把伞递给我，说一艘私人游艇刚停在码头，也许我正在等访客？


    “我没等什么客人，”我虚弱地说。


    “是的，我们知道。但尽管如此——还是有人来看见你。”


    我告诉他我会亲自去码头看看是谁。如果是警察，最好在外面处理，这样就不会人注意了。于是我撑着酒店的伞走向码头，当我到达通往水的第一个台阶时，我看到那艘交通船顶着轮胎剧烈晃动，后方的桌子上放着一个冰桶，泛着光。那时我清楚地知道是谁了，出乎意料的是，几前下船的身影正站在码头的尽头，戴着一顶淡绿色的布鲁顿菲雷帽。那个我一直认为迟早会出现的人。


    **不仅如此，他**含蓄地强迫我一路走到码头尽头去见他。就好像是我应该移动位置去寻找他，而不是相反。这是多么典型啊；一场通过我们旧模式进行的会面。他似乎在暗示，既然是你坐了船过来的，所以你可以忍受这段简短的步行。


    他穿着一套灰色的威尔士纹西装，脚穿一双精美的旧黑色牛津鞋。当我走到他时，他安静地转过身，早已意识到我的存在。“你在那，你这个混蛋，”他的眼神似乎在说。接着，吉米没有带敌意地伸出手握了我的手，并打量了我一一番，仿佛我已经颓废了，但他太有礼貌，没有点破这一点。


    “你是在躲起来吗，艾德里？”


    “我请了几个周假。”


    “我们不都是这样吗？我刚回来。我岳父坚持让我出去待一会儿。你这儿地方可真不错。”


    “这不完全是我的。”


    “如此，如此。但还是，我明白你为什么在这里。”我建议我们进屋，因为在下雨，而他没带伞，但他似乎对落在西装表面的水点并不感到不悦。


    “事实上，”他说，“我在酒店里为我们订了晚餐。我希望这没问题。”


    我盯着他。“你确定这是个好主意吗？”不用说明这就是他出来见我的原因。但这句话在我们之间的空气中悬浮得如此显而易见，以吉米终于道出了我们都在想的问题。


    “我们都有值得愤恨的事。为了这顿晚餐，我们和��斧吧好吗？说句好听的，我觉得那场闹剧正在平息一点。总是这样。人们总会找到别的事情来痴迷，他们这群白痴。”


    “如果他们不那样，我们也没什么可以写的了。“说起这个——你知道的，”他继续说道，没有看我，而是望着窗外雨绵绵的山峦和翻滚的云雾，“我不怪你写下那些废话。假装你对她的死有某种内部消息。市场，这么说，是这种要求的。别抗议，你知道我的意思。你的职业甚至比我的更腐败。我们都清楚。我们都是婊子，你和我，每个人都是。但最后，我理解了。你误解了情况，因为你没有直接问我，而是跳进了你自己那阴谋论的兔子洞。老天爷的。你当时很生气。”


    “所以你是说我从头到都是错的？”


    “你当然是错的。你错了。你被一些尖锐的手段算计了。你不该那么绝望。”


    “绝望和这没关系——那个，那并不是针对我的敌意，对吧？”


    我否认了，但同时我不禁在想，其中是否有一丝真理。如果部分是真的，那我为什么还是怨恨他？这不仅仅是为了丽贝卡。这也源于我们自己的过去——我如何变得能看穿他，在不经意间让他变得透明。毕竟，这正是他一直能对我做到的。当我们年轻时，他总是处于优越地位，总是能评判我的庸俗。这是我们潜意识从未忘记或原谅的一点。他转过身，拍掉肩上的雨水，试图露出那种多年来习惯的、自然的微笑。


    “你可以辩论的，同志，那是你唯一没做的一件事。你根本没有任何证据。”


    我本可以辩论，但我预知了结果会如何，要让他承认自己在权力和财富法则之外做过任何事是多么不可能。他会否认我从消息来源听到的所有话，当然我确实付过钱给他们，而且当我们慢慢走回酒店时，我忧郁地意识到，他们可能一直都在撒谎。如果，正如我向自己承认的那样，在一个被极权统治的城市里，不可能信任任何人或他们的故事；我又为什么要信任他们呢？谁能说他们不是拿了钱、一点小人情和免费午餐，然后对着我的窘暗暗笑呢？他们根本不在乎。


    甚至在用餐后很久，坐在餐厅的玻璃屋顶下，听着雨点敲击屋顶，我无法详细谈论某个话题，否则他就会再次转为指责。我明白，这现在是他的招数。我狠狠地伤害了他，他来这里是为了向我索要道歉。除此之外，他说，荣誉要求他在我面前证明自己的清白。他放不下这种事。当我们走回酒店时，我注意到他走路有些跛脚，“我希望只是暂时的，”我说。他皱了皱脸，挥了挥手。但在晚餐时，他在第二瓶红酒后开启了这个话题。丽贝卡某个疯狂的朋友脑抽，要为她朋友的荣誉反击。他一直一直被纠缠着。现在他对此只感到自哀。他甚至认识那个女孩，“她叫凯莉，”他说。我立刻明白，他完全忘记了我在太平酒店见过她，尽管很短暂。

