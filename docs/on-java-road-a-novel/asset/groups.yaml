    # LAWRENCE OSBORNE


    crowded with designer toy houses and old temples. There was a sloping headland
    immaculate with bare patches of granite while offshore dozed the pale shapes of
    islands.


    Moored in the shallows I saw the curious lifeguard towers on the beach were unoccupied.
    The lights of a restaurant called the Cococabana flickered into life. Whatever
    crowds had been there during the day had melted away and there was only a single
    man sitting on the sand playing a guitar. On a lone pole a digital clock displayed
    the time for nobody.


    The plan was for Tom to drive the launch back to Aberdeen by himself while we
    swam ashore and then dried off the dusky sun. The water came only to our chests
    in the event.


    We sat on the sand for a while watching the sun and the launch turning as its
    motors revved. At this farthest outpost the city seemed to come to a standstill
    within an amphitheater of subtropical hills. A coolness sweeping down from the
    Dragon’s Back mountain pass seemed to remind us of hunger. We dried in minutes
    and walked up to Cococabana. It was a modern cement affair with bossa nova playing
    through the speakers. There were a few upper-class bohemian customers from the
    village sitting at the outside tables. We sat there as well, shadowed partially
    by a tree wondrously taller than the restaurant, and the unspoken understandings
    among us slipped and slid until they finally became something new, an emotion
    triangular, three-sided, with myself as the shortest side and, otherwise put,
    Jimmy and Rebecca as the main stars on their little stage and myself as the audience.'
- md: "\n# ON JAVA ROAD 89\n\nWE HAD OUR APEROL spitzes while black kites circled\
    \ the headland and then gradually faded from sight. Raw sea bream and marinated\
    \ tuna on the plates, the candles guttering. Jimmy complained about the wine:\
    \ “A French restaurant with the lowest alcohol taxes in the world and they can’t\
    \ even—” But I found I was in the middle of the brightest day of the decade, asking\
    \ Rebecca questions that were, precisely because of their banality, a pleasure\
    \ to ask. \n\n“I’ll go to grad school somewhere,” she told me when I asked if\
    \ she was thinking of pursuing an academic career. “Maybe the States,” I said\
    \ everyone else. “Do people here anywhere else?” I said didn’t know. It was an\
    \ escape from Hong Kong in any case. I watched her carve out an oyster with a\
    \ little fork and I thought how remarkably adaptable she was relative to the man\
    \ next to her. His moods came and went so fast that it was largely impossible\
    \ to keep pace with them. She had evidently learned not to even try to keep up\
    \ with his ever-changing states of mind. The cutting bitterness that sometimes\
    \ surfaced in his speech was so alien to her that it ran off without effect. Could\
    \ she even feel it, or know what it was? It was a coldness out of the past, a\
    \ disappointment in himself, of course. We were a curious generation. Lucky in\
    \ so many ways because born into the prosperity of the 1960s but not spoiled as\
    \ the generations that had come after us; soft but not as soft as our successors.\
    \ Our grandfathers had found us ridiculous. But beyond all this, it was Jimmy’s\
    \ doubtless inherited class that made him both sensitive and callous. Even as\
    \ he teased her she was solicitous around her. You could tell that he respected\
    \ her: when she spoke listened carefully, limiting his own words. She was talking\
    \ about her future career in the States. At one point Jimmy pointed out, “She’s\
    \ a wunderkind. But she won’t boast about it because wunderkinds don’t need to.”\n\
    \n“I’m not a wunderkind. I don’t even know what that is.”\n\n“It’s a child who\
    \ is kind and full of wonder. That’s you. Adrian, I want to dance down in the\
    \ sand with the wunderkind. Would you be so kind as to hold the fort?”\n\nAlthough\
    \ it felt like minutes, an hour later I found myself looking down at Jimmy and\
    \ Rebecca dancing barefoot in the sand. It was a ragged waltz set to the same\
    \ bossa nova, and the other couples watched them with an envy tinged by their\
    \ own regrets. I could tell that it was not the first time they had danced together.\
    \ It might have been the hundredth time for all I knew. They danced like lovers\
    \ attuned to each other’s body. The wind whipped the loose sand around them and\
    \ inspired by Aperol they moved back and forth, talking so quietly that I couldn’t\
    \ hear the words. It was like a movement that would never end of its own accord,\
    \ something that would have to be stopped from the outside, bringing them back\
    \ to earth.\n\n# FIVE\n\nEVERY AFTERNOON THEREAFTER, FEELING SHAMED BY Rebecca’s\
    \ resolution, I ventured out with both a yellow helmet and an anti-gas mask which\
    \ I hung from the back of my electric bike. Being cautious by nature I covered\
    \ myself with press tags though these talismans only served, in the end, to attract\
    \ abuse and aggression from a constabulary bristling with stun grenades and body\
    \ armor. But for the moment, in the dog days of that fetid summer, I still held\
    \ on to the illusion that they would protect me in the way of talismans or Thai\
    \ Buddhist sak yant tattoos. No rubber bullet would sail my way; no lachrymator\
    \ would be directed at me personally. I could move like a sacred person among\
    \ the flayed and the flyers.\n\nInitially least, I thought that my tags gave me\
    \ invisibility and I moved accordingly, with completely unearned confidence, through\
    \ makeshift barricades and fires set by Molotov cocktails thrown outside police\
    \ stations. It was a period of sacred madness. But soon it would come to an end.\
    \ The order must have come from high up to give the scribblers a bit of rough\
    \ stuff. Still, that week the streets still possessed their courtesies: free espressos\
    \ and bottled water for passing mutineers, the crowds parting for ambulances,\
    \ all the things that made their way into the international media and which set\
    \ up an expectation of a mere family feud that would soon blow over. But the people\
    \ far away in their democracies had little idea who they were dealing with and\
    \ nor, for that matter, did I. That week I began to notice a hysteria creeping\
    \ into the police as midnight approached on the weekend nights, the banging of\
    \ batons against their shields like a Spartan phalanx, the surprise of tear gas\
    \ canisters launched from the upper floors of tall buildings and overpasses, streaking\
    \ toward us with plumes of smoke like failed fireworks and spinning with an antic\
    \ malice toward our feet when they hit the ground.\n\nSomething in me turned but\
    \ it must have happened more gradually than my conscious mind understood. It was\
    \ like the nails of a steadfast building popping out one by one. The timbers move\
    \ and shift, the beams quiver. On some weekend evenings there was a haze of fire\
    \ and smoke in the wider streets of Central which helped the crowds there to feel\
    \ the potency of their own numbers, the power of a formless mass directed against\
    \ a single target. Everyone knew their slogan was “Be water,” a charming piece\
    \ of advice from Bruce Lee concerning the evasion of an enemy’s blows. But water\
    \ can also be a punishing wave. Those human waves crashed against mainland banks,\
    \ MTR stations, police stations, small deployments of cops which broke and retreated\
    \ under a hail of missiles and then subsequently against water cannon trucks and\
    \ sometimes against defiant taxi drivers who—a rare thing—detested them.\n\n#\
    \ ON JAVA ROAD 89\n\n... (continued) ...beaten with staves.\n\n# ON JAVA ROAD\
    \ 93\n\n... (continued) ...sphere of men who are looking in life’s rearview mirror\
