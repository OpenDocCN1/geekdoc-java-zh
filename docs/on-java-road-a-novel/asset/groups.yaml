    # ABOUT THE AUTHOR


    LAWRENCE OSBORNE is the author of seven critically acclaimed novels, including
    The Forgiven, Hunters in the Dark, Beautiful Animals, and The Glass Kingdom, as
    well as several books of nonfiction, including The Wet and the Dry and Bangkok
    Days. The film adaptation of The Forgiven, starring Jessica Chastain and Ralph
    Fiennes, was released in 2021. Osborne has led a nomadic life, living in Paris,
    New York, Mexico, and Istanbul, and he currently resides in Bangkok.'
  - '[PAGE 251]


