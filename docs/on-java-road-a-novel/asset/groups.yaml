    his confession was therefore a pseudo-confession. I objected to his insinuation
    about Rebecca, in any case, and I could see from his reaction that he was not
    at all surprised or inclined to push back.


    “I agree,” he conceded mildly. “But it’s not impossible either. That’s what Melissa
    and her father said to me. That it was a plot to harm me, to harm them. She was
    using me all along.”


    “It’s ridiculous.”


    “All right—”


    “Then where is Rebecca now?” He threw up his hands with a touch of melodrama.


    “That’s what I want to know. If only I *did* know. I didn’t see her after that
    night at Soho House and we stopped communicating. It was necessary. You can understand
    that.”


    “Naturally. So that night,” I said, “was really the last time you saw her?”


    “Absolutely.” Didn’t I say so? his tone implied. So their breakup must have been
    before I had met her at the China Club. Yet she had mentioned nothing about it
    to me. Either he was lying now or she had not wanted to bring it up at the time.
    Come to think of it, she had been quite cool when talking about Jimmy. Perhaps
    I had missed the clue.


    He was still talking, interrupting my train of thought. One night, he said, when
    he and Melissa had been dining in the main room, the landline phone had rung and
    Melissa had gotten there before him. He had heard her from the dining room, repeatedly
    asking “Hello? Hello?” until she had given up and returned to the table. He had
    then asked her who it had been. She had shrugged, saying only that it must have'
  - '[PAGE 167]


    been a prank call or a wrong number. Yet Melissa had appeared rattled and her
    mood had changed. It then occurred to him that someone on the other end of the
    line may have been spoken to her after all. He watched her face for signs that
    this might have been the case. She had grown cold and nervous. “It seems odd that
    people are playing pranks,” he had said. As she looked away he had felt certain
    that someone had indeed spoken to her and she did not want to reveal it.


    “I kept thinking all night that the caller had exposed my affair to Melissa and
    that she was keeping it to herself. But there was no way to prove it.”


    It was possible, I supposed, that Rebecca had been feeling vengeful and prone
    to reckless behavior. It would not be in keeping with the individual I thought
    I knew, but when it came down to it, how well did I know either of them?


    “You should call her,” I said.


    But suddenly, for the first time, I had the feeling that there was no one to call.
    Rebecca had gone, but I didn’t know where. I can’t say why I suspected either.
    A slow buildup of unease arose within me, and I thought of Bawa then. He had not
    lied at all—Jimmy had been at the morgue.


    “No,” he said smoothly, “that would be a terrible idea. I’m sure she hates me
    now. Either way, I’m not calling her. For all I know, she’s gone abroad.”


    “Abroad?”


    He made a small gesture of resignation and caught the eye of a waiter.


    “Shall we have another bottle? Come on.”


    We sailed on, bound to get more incoherent. It was a relief in a way. The skin
    along my back grew moist, my temples'
