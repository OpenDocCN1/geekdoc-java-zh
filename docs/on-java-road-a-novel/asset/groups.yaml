    \ a tsunami to bring those down. It was, of course, because I lived in one of\
    \ these myself, Garland House, built on Java Road in 1965, and I had lived there\
    \ so long that the place felt permanent to me as some ancient cave dwelling.\n\
    \nThe driver left me now, at the corner where my building rose above the Joy Foot\
    \ Spa and a cut-price fashion store. The street was silent and deserted, as it\
    \ never was usual. My building’s striking yellow facade, only painted color up\
    \ to the fourth floor for some reason, looked quietly abandoned in the same way,\
    \ as if all the tenants had left for the week or were surviving on canned tuna\
    \ behind locked doors. The yellow pipes and valves that crissrossed the building’s\
    \ front were filled with motionless birds who appeared to find comfort in the\
    \ foot spa’s red neon Chinese characters and the time-worn window blinds covered\
    \ with images of sleeping beauties, their heads resting as they always do, on\
    \ outstretched arms. That little image of a red-lit foot on the second floor had\
    \ always been the sign that I was home. And so, tracing my usual exhausted steps,\
    \ I went up to the fifth floor and let myself into the tiny waren of rooms now\
    \ a single pocket of heat after four hours without conditioning. They were dark\
    \ and musty by virtue of the drab wallpaper I had not roused myself to change\
    \ in years.\n\nYet their patterns were filled with images of little birds and\
    \ vines and I had grown used to them in the same way that I had gotten used to\
    \ my routine-driven solitude passed in their company. I made myself a gin and\
    \ tonic with piles of ice and turned on the TV. My hand appeared to be shaking.\n\
    \nI listened to the news as I did every night out of morbid curiosity, not believing\
    \ a word of it. The pro-Beijing papers’ coverage of day’s insurrections was as\
    \ uninteresting as the previous day’s, constantly downplaying the severity of\
    \ events and minimizing their significance. It was to be expected. The ongoing\
    \ charade, though, was always fascinating. And after a half hour I retired to\
    \ the laptop to get the real news. I continued drinking, slowly and with a certain\
    \ feet for myself, and I could hear above me the feet of Mrs. Lai traversing her\
    \ floors in slippers while she shouted at her long-dead husband. A lone summer\
    \ moth had found its way into the apartment and careened around the lampshades,\
    \ yet I didn’t have the energy to hunt it down.\n\nBy now I followed dozens of\
    \ fellow reporters on Twitter, many of them locals armed with their own cameras\
    \ who descended into the streets every day and followed events until the early\
    \ hours of the morning. They had colorful handles: Hong Kong Hermit, W. B. Yeats,\
    \ Flamethrower. During my weeks of wandering the streets with my camera I had\
    \ never run into a citizen journalist that I recognized. It was like a roving\
    \ secret society using their phone cameras to document for the first time a slow-burn\
    \ revolution on the ground. I had long realized that my modus operandi and the\
    \ publications I worked for had nothing to offer that could better these citizen\
    \ reporters. We had been left behind. Like\n\n# ON JAVA ROAD 67\n\ndrowsy elephants\
    \ we plodded after news that had long been divulged elsewhere at three times the\
    \ speed. The only purpose we served to bestow a sense of legitimacy to whatever\
    \ items of information we saw fit to enshrine in print, even if it was only ever\
    \ digital print. But it had become something of a con. We lied like everyone else.\
    \ But we were absolutely certain that we didn't lie and we despised those whom\
    \ we thought did.\n\nThe Chinese Communists at least understood very clearly.\
    \ Hence their contempt for journalism. I could never explain to them what the\
    \ romance of it was. They had never seen *His Girl Friday*. Even if they had seen\
    \ it, what sense would they ever make of it? But for us, the dinosaurs of my generation,\
    \ who among us didn’t want to be Walter Burns buzzing amid the clacking machines\
    \ of *The Morning Post?* As Jimmy had suggested, the once great romance of it\
    \ was what made its current degradation to disillusioning. When I was forced to\
    \ defend that same press to Jimmy’s Beijing friends, for example, I found myself\
    \ vague and uncertain about my own claims, my own purpose. “But Rachel Maddow\
    \ and Brian Stelter are comical lunatics,” they would say, looking at me with\
    \ merry eyes and waiting calmly for some sort of rebuttal on my part, having of\
    \ course no idea who Cary Grant had. And what was I supposed to say? No they aren’t\
    \ and all is well with the Republic? From afar, in fact, I had watched the strange\
    \ deterioration and debauchering of the American media. It struck me that television\
    \ journalists in particular no longer relayed anything of integrity. But print\
    \ journalists were following the same downward trajectory as they sat under the\
    \ tables of the powerful in Wash-\n\nington sucked up the crumbs, the leaks from\
    \ \"unnamed sources\" thrown to them by the intelligence agencies actually ran\
    \ the show. It was how they monetized their product. I had lost count of the number\
    \ of retired spooks manning the desks of CNN, MSNBC, and NBC and talking in place\
    \ of journalists, setting the terms of discourse until the two groups were curiously\
    \ indistinguishable. Very few talked disrespectfully of the national security\
    \ state. None gave off any whiff of actual courage. The gap between ourselves\
    \ and the Communists had narrowed and the journalist, after a period of being\
    \ a romantic hero, had become what he had been all long, a hack, a hustler, and\
    \ a propagandist. When dozens of protests erupted simultaneously across the city,\
    \ the clunkier news organizations could not mimic and which rendered them largely\
    \ useless when one needed to know what was happening hour by hour, or even by\
    \ minute. Those yesterday correspondents were the romantic heroes now, and their\
    \ energies had been relegated in my mind to a marginal position. You could argue\
    \ that it was inevitable. In fact that’s exactly what I would argue. As Dr. Johnson\
    \ once said, much journalism is little more than \"writing on the backs of advertisements.\"\
    \n\n Strangely, these meditations didn't unnerve me at all. The overall mood of\
    \ the city had an anesthetizing effect. Outside it was still a hundred degrees.\
    \ The air sour with hatred, the scream of far-off sirens multiplying. In the great\
    \ walls of tenement windows on the far side I could see faces peering out tentatively\
    \ as the sidewalks emptied. I noticed that, for the first time in the many years\
    \ that I could remember, the clotheslines outside those windows were now bare.\
    \ They were unlike trees whose branches have been stripped of leaves by a passing\
    \ tornado. Voices carried farther in the unoccupied canyons between the high buildings,\
    \ sirens could be heard from great distances, echoing endlessly, as if stabbing\
    \ through a tremendous vacuum, and all around there was a rippling electricity\
    \ in the airwaves; the herd spooked by the approach of wolves who have not yet\
    \ yet seen but whose tremendous and alien scent is on the wind.\n\n# FOUR\n\n\
    YOU LOOK AS IF YOU HAVEN’T SLEPT IN DAYS,” JIMMY said when we met three days later\
    \ at the marina in Aberdeen. It was where he kept the smaller of his two yachts,\
    \ a Tecanmar motor launch inherited from his uncle called Sweet Typhoon. “Is that\
    \ the case, comrade?”\n\n“I’ve been sleeping nonstop since I last saw you.”\n\n\
    “I’m relieved to hear it. You look like you don’t get enough sleep. I on the other\
    \ get too much.” He paused. “We’ll pick Rebecca up on the way. My skipper is ready.\
    \ His name is Tom. Well, it’s not his actual name obviously but I call him Tom.\
    \ Everyone in the family calls him Tom.”\n\n“On the way where?”\n\n“Tom! Can we\
    \ get this fool a screwdriver?”\n\n“Yes, sir.”\n\nThe skipper moved out of the\
    \ light and into the interior of walnut and brass where the bar was kept.\n"
