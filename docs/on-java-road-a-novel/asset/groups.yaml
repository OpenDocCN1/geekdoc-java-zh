    # 182 LAWRENCE OSBORNE


    To family made no grieving proclamation. The reason for this, I theorized, was
    that they had elected to keep things quiet and not draw unwanted attention to
    themselves. They had kept their grief private as well. It must have been an extraordinarily
    difficult thing for a Hong Kong family to do, and it would have been against all
    their ingrained social conventions. But the times were no longer ordinary and
    people had changed their behaviors accordingly. People had endured more extreme
    distortions of their customs in more violent societies and so their secrecy did
    not seem entirely impossible to understand.


