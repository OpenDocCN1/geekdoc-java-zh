    Lawrence Osborne 是七部广受好评的小说作者，其中包括《被原谅者》（现已改编为电影，由拉尔夫·菲恩斯和杰西卡·查斯汀主演）以及《唯有入睡：菲利·马洛洛小说》，该书曾入选《纽约时报》年度重要书单并获得埃德加奖提名。他还撰写过六本非虚构书籍，包括《曼谷岁月》。Osborne
