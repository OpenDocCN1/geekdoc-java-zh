    # ON JAVA ROAD 89


    WE HAD OUR APEROL spitzes while black kites circled the headland and then gradually
    faded from sight. Raw sea bream and marinated tuna on the plates, the candles
    gutter-ing. Jimmy complained about the wine: “A French restaurant with the lowest
    alcohol taxes in the world and they can’t even—” But I found I was in the middle
    of the brightest day of the decade, asking Rebecca questions that were, precisely
    because of their banality, a pleasure to ask.


    “I’ll go to grad school somewhere,” she told me when I asked if she was thinking
    of pursuing an academic career. “Maybe the States,” I said everyone else. Do people
    here anywhere else?” I said didn’t know. It was an escape from Hong Kong in any
    case. I watched her carve out an oyster with a little fork and I thought how remarkably
    adaptable she was relative to the man next to her. His moods came and went so
    fast that it was largely impossible to keep pace with them. She had evidently
    learned not to even try to keep up with his ever-changing states of mind. The
    cutting bitterness that sometimes surfaced in his speech was so alien to her that
    it ran off without effect. Could she even feel it, or know what it was? It was
    a coldness out of the past, a disappointment in himself, of course. We were a
    curious generation. Lucky in so many ways because born into the prosperity of
    the 1960s but not spoiled as the generations that had come after us; soft but
    not as soft as our successors. Our grandfathers had found us ridiculous. But beyond
    all this, it was Jimmy’s doubtless inherited class that made him both sensitive'
  - '[PAGE 105]


    and callous. Even as he teased her she was solicitous around her. You could tell
    that he respected her: when she spoke listened carefully, limiting his own words.
    She was talking about her future career in the States. At one point Jimmy pointed
    out, “She’s a wunderkind. But she won’t boast about it because wunderkinds don’t
    need to.”


    “I’m not a wunderkind. I don’t even know what that is.”


    “It’s a child who is kind and full of wonder. That’s you. Adrian, I want to dance
    down in the sand with the wunderkind. Would you be so kind as to hold the fort?”


    Although it felt like minutes, an hour later I found myself looking down at Jimmy
    and Rebecca dancing barefoot in the sand. It was a ragged waltz set to the same
    bossa nova, and the other couples watched them with an envy tinged by their own
    regrets. I could tell that it was not the first time they had danced together.
    It might have been the hundredth time for all I knew. They danced like lovers
    attuned to each other’s body. The wind whipped the loose sand around them and
    inspired by Aperol they moved back and forth, talking so quietly that I couldn’t
    hear the words. It was like a movement that would never end of its own accord,
    something that would have to be stopped from the outside, bringing them back to
    earth.'
