    Mansions the air cleared and we went down Mody at a more relaxed pace. Spring
    Deer, supposedly a haunt of gangsters back in the day, was at the top of a narrow
    flight of stairs, and at one of its humdrum tables, surrounded by lush floral
    wallpaper, the physical majesty of the Australian was startlingly paired with
    the severe thinness of the bespectacled Bawa. Only that ideology, the admiration
    for Mao’s state, I thought, could have brought them together so intimately and
    so ridiculously.


    One of the staff in a funereal black waistcoat had already brought over the first
    bottle of red and the heat of the packed room seemed to draw me back to happier
    times—of all the lost-to-memory nights I had gotten drunk by myself at Spring
    Deer among the old-timers.


    WE ORDER THREE PEKING DUCKS because the Australian insisted, and extra bulletins
    of the heavy, doughy pancakes for which Spring Deer is known. Moyers had also
    ordered sea cucumbers and steamed ham.


    “So you came from the hospital?” Moyers said to Cunningham directly, his eyes
    narrowing on a target inside the other man’s emotions.


    “Editor’s orders.”


    “I told Sonny here it wasn’t worth going—it served that ankle biter right and
    everyone knows it. It’s time we stopped glorifying protesters with coverage. I
    know Gyle here will disagree but I’ve seen the footage. That kid was throwing
    bricks, for Christ’s sake.”


    ## ON JAVA ROAD


    “Bricks versus bullets,” I said. “A fine contest.”


    “No, a brick can kill a man. Easy.


    Cunningham shook Bawa’s hand. “How are you, Sonny? I haven’t seen you much on
    the street.”


    The Sri Lankan was cool and feline in his way, and a faint smile came to the lips.


    “Oh, they’re all the same after a while, those events. I got bored of them. I
    have problematic lungs, too. Enough is enough.


    “I hear you. I haven’t been out much myself,” Cunningham said.


    “What about you?” Bawa said to me.

    “I’ve been laying low.”


    “Myself,” Moyers said, continuing his own train of thought, “I think they should
    bring in the tanks”


    Cunningham took off his jacket and slung it over his chair and I saw that his
    shirt was rotten with accumulated sweat.


    “Tanks,” he muttered, “always the solution.”


    Moyers turned to Bawa:


    “Cny here has seen a lot of tanks. But he’s better known for his sexual practices
    with ladies of the night. I say of the night, but in fact he doesn’t mind ladies
    of the day as well.”


    “He’s calling me a musketeer,” Cunningham said to me.

    But my musketeering days are long over. I sit by the radio now.”


    “That’s where you belong. Gyle, looks like you just got a dose of the old pepper.
    You want me to pour a bottle over your head?”


    “I think that would be unpleasant.”


    "Is that right? So did you get to see the weasel in his hospital bed?"


    "Not even close."


    "I thought not. You wasted your time, then."


    Bawa said, "All the same. I hope they arrest him when he’s patched up."


    Myers was done up in a poplin suit with wide lapels, his stomach bursting forth
    in a riot of mother-of-pearl buttons. Before the troubles he hadn’t been a bad
    sort, but civil unrest was always bad for business and his accounts had suffered.
    Like many expats, the indigenous youth irritated him with their tendency to demolish
    Chinese banks and branches of Starbucks licensed to Maxim’s Caterers. The latter
    were revealed for their sympathies with Beijing. I imagined he hadn’t been so
    vehement a few months earlier crisis had drawn out the inner man, as it always
    does. After a few minutes his initial vehemence subsided and I asked him what
    he had been doing with himself during the days of riot and abandonment.


    "Me? Nothing different. But Sonny here had an interesting day. Didn’t you, Sonny?"


    Sonny had not gone to the hospital, it was true, but he had gone to a morgue all
    the same.


    "A morgue?" Cunningham said.


    "They found a girl in the harbor this morning. I heard about it from the police."


    The number of bodies being fished out of Victoria Harbour was growing, most of
    them young, most of them women—or so I had heard on the grapevine. Their pictures
    appeared in the local yellow tabloid press, classified as suicides. Some of them
    were. But all? The photographers had somehow wormed their way into the confidential
    freezer compartments of various morgues.


    This trade in imagery went on every every day. For their part the police said
    nothing; there were few investigations. And so the grapevine had to say about
    it. According to gossips the girls were picked off the streets for rioting, raped,
    and then disposed of. No one could say if this was true. There was no proof either
    way. But there were also middle-aged men, hundreds of them, found in waste lots
    and empty garages and bedsits with torn flesh and mangled limbs. “Suicides” that
    nobody believed were suicides. It was why Bawa, in his curious way, was hunting
    down bodies in morgues. Not because he wanted to publicize them but because he
    wanted to explain them away as innocent deaths. His motive for doing so was double-edged;
    he was on the government’s side, as far as his sympathies went, and yet his line
    of work as a journalist made an association with the police profitable for him.
    He was friends with them and believed in their honor. I wondered what he thought
    when he heard crowds chanting “rapists”—sik long—at the constabulary he admired
    but who were now dressed more like an occupying army than a police force. Once
    again the grapevine had proved victorious over the mainstream press. Bawa was
    one of those men who have an ancestral fear of disorder. Even authoritarian rule
    by Beijing was better than disorder. If that rule meant throwing a few rioters
    into the harbor after a bout of perhaps unintentional violence on the part of
    the police, it was on balance better than the alternative, native democracy, which
    would mean chaos, litter, and a falling income.


    In this perverse, almost patriotic spirit, depending on one’s persuasion, Bawa
    trawled the morgues. Earlier that day he had received a tip-off from one of his
    police contacts that another young girl had been spotted in the sea by a passing
    tugboat and the police had gone out to pick up the body with as much secrecy as
    they could manage in the circumstances. The press, diverted elsewhere, had missed
    it the girl had been brought to shore. Bawa had gone down to the morgue about
    two hours afterward. The body was partially clothed and she was still wearing
    a short jacket. Bawa had not been allowed to see her. The officials at the morgue
    had made calls for relatives to identify the body. It was, without question, a
    suicide, the police had said, and Bawa repeated it to me with a grimly straight
    face that revealed not the slightest doubt of the official story. Of course, the
    police never lied or even exaggerated to their friends, and here Bawa was certainly
    a friend. As I was waiting at the morgue, writing in my notebook, I noticed a
    limousine drawing up and a man getting out. I thought I recognized him from the
    gossip rags. I think Jimmy Tang is a friend of yours, isn’t he, Adrian?”


    “Jimmy?”


    “I’m sure it was him and so was the officer. He might have been lying, of course.
    But why would he lie to me?” I looked at Cunningham as if it was I had been caught
    out and it must have been comical because Moyers couldn''t help a smile. Not knowing
    what to say, I blurted out something heavily predictable: “Tang was there?”


    “As I said,” Bawa went on calmly, with an effect of ice in his voice. He came
    in and greeted the officers and seemed so wrapped up in the situation that he
    didn’t see me.”


    “Do you know him?” Moyers asked.


    We were at university together. I’ve known him for over a quarter of a century.”


    Bawa nodded, indicating that he knew this already.


    “Then maybe you know why he came down there,” he said. “I certainly don’t know.
    Do you think it’s possible that he might have known the dead girl?”


    “That’s preposterous. Why would he?”


    “I can’t say. He was there and they let him in. He seemed pretty tense.” He paused.
    “I don’t want to write a story about it, if that’s what you’re thinking. Not at
    all. But it’s pretty interesting, don’t you think?”


    My first instinct was to protect Jimmy, so all I said that it couldn’t have been
    him.


    My mind was racing ahead. How many women did Jimmy have in his orbit? Lovers

