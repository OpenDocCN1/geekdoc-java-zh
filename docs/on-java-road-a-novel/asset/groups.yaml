    We moored along the volcanic rock coves of Beaufort Island. These other pleasure
    boats formed miniature floating domains from which people dove into the sea in
    snorkeling masks. We caught a few notes of their music and then disappeared from
    view. Within a few nautical miles we were up against the pale brown granite formations
    of an island that, as we went around it, appeared to have no visitors.


