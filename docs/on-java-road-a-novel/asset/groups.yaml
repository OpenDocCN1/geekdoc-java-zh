    ## 24 LAWRENCE OSBORNE


    on the balcony. Then he appeared suddenly in one of his beautiful W. W. Chan suits,
    an ecru herringbone number made from a Dugdale Lisburn linen. Elegance came spontaneously
    to him. He shot me a knowing look, seeing that I had spotted that he wanted to
    notice about his appearance.


    The others were mostly men who had known his father and who liked to talk quietly
    and cynically among themselves with Jimmy’s magnums of Domaine de Montille Volnay,
    decanted for an hour before being served. They were mostly pro-China in their
    views, servants of stability, as Jimmy called them. Many of them had companies
    in Shanghai and Shenzhen. Like Swire or the Ho family, they knew which side of
    their toast was buttered by their masters in Beijing. At the same time they also
    knew how to make themselves sound patriotically reasonable and capitalistically
    moderate. Once they reviled communism; now they dismissed as irrelevant. Yet in
    a bizarre twist of historical fate they were now quoting Western leftists with
    veiled approval because, among those leftists, conspiracy theories about CIA intervention
    in China and hatred of imperialism were naturally second. These theories chimed
    conveniently with the oligarchs’ own financial self-interest. It was a performance
    that I had heard many times before: out there, down in the city, the younger generation
    was spoiling their paradise, and they resented being called “collaborators” and
    “traitors” by their own grandchildren in their eyes it were they who had built
    the city and not their ungrateful spawn.


