    might have some truth to it. On my longest nights, I had often dreamed of dying
    in a hospital here then waking up and walking back to my prior life, not realizing
    that I was no longer real. A common nightmare among the aging. You walk down a
    sunlit street at noon and suddenly you perceive that you cast no shadow on the
    sidewalk.


    ## TEN


    NEVER FOUND OUT IF JIMMY HAD REALLY GONE TO Los Angeles on his business trip or
    whether he had in fact been listening to us from one of his closed-off bedrooms.
    Everything about the Tangs became more obscure by the day. Despite what Melissa
    had said it was now impossible to be friends with them since, as far as she was
    concerned, I was an accomplice to their scandal, however much she had hinted that
    she might forgive me. That said, his little scandal came and went, and, as if
    the fickleness of the collective mind were at play, Rebecca To’ name also came
    and went, brushed off into the shadows where many people felt it belonged. Aside
    from her parents and friends, it was I who was left with the question of her disappearance
    as something experienced night and day, an emptiness that felt like a great slow-motion
    decay in the heart. Guilt played its part. We had not known each other very long,
    or very deeply, but I felt that my silence had helped cover up her erasure, and
    again I had willingly played my role of accomplice.


    It was the cleanliness of this erasure that surprised me the most, though I couldn’t
    say why I should have been surprised. No formal announcement of her death appeared,
    the to family made no grieving proclamation. The reason for this, I theorized,
    was that they had elected to keep things quiet and not draw unwanted attention
    to themselves. They had kept their grief private as well. It must have been an
    extraordinarily difficult thing for a Hong Kong family to do, and it would have
    been against all their ingrained social conventions. But the times were no longer
    ordinary and people had changed their behaviors accordingly. People had endured
    more extreme distortions of their customs in more violent societies and so their
    secrecy did not seem entirely impossible to understand.


    But the effect was as if she had never existed. This calamitous idea grew within
    me over the following days, so that eventually I began to walk all the way down
    Java Road in the afternoons to visit the funeral parlors that famously crowd the
    sidewalks towards its lower end. I went to toward its lower end to look for Rebecca
    among the funeral portraits. I knew perfectly well that her family would not post
    her image there, but something irrational drew me there anyway.


    The biggest of these was the Hong Kong Funeral Home, the principal venue for wakes
    on Hong Kong Island. I had been there many times as a society reporter and recalled
    yet again the death of Leslie Cheung, whose wake had also been held there in far
    happier, distant times when it were singers and movie stars who caused grief when
    they threw themselves off buildings and not the maddened students with nothing
    to lose. I had passed by just to have a look—many of us were sent down to cover
    it—and yet had never gone inside where the crowds of fans had gathered. I could
    not believe at the time that the star of Nomad, perhaps the biggest star in the
    Chinese world at that moment, had hurled himself from the top of a hotel. It had
    felt like the end of a cultural era. I thought about it as I walked along the
    length of Java Road; 2003 now felt like a century ago. One could imagine today
    a Chinese actor naming himself after Leslie Howard, that epitome of British sangfroid
    and mellow elegance? “I never did anything wrong in my life,” Cheung lamented
    in his brief suicide note. “Why does it have to be this way?” And who knew the
    answer to that question?


    I came to the first of the smaller parlors that line one side of the street with
    their bouquets laid out on the sidewalk. The Hong Kong Funeral Home stood as Java
    Road’s terminus, a curved building with cream ceramic walls and a railed- sidewalk
    usually littered with the chopped-up stalks of flowers and remains of bouquets.
    The curved black lintels of the doors set within gold columns bore Chinese characters
    in gold and beyond them all were somnolent and hushed.


    Though it looked like a hummus office block from the outside, the Home enjoyed
    a certain reputation. The famous liked to have their last rites there. Society
    personalities, as I had noticed, often made their last stop on earth within its
    premises, and you might say that it was quite the place to be seen for the last
    time. At the hour of my arrival, however, it was not busy. I slipped inside unnoticed
    and went unprefully from room to room, for some last vestige of Rebecca, knowing
    very well that I was never going to find her. There had most likely been a quiet
    cremation, at the discretion of a weary family. The Tos had made a resolution
    to keep it out of the news. What I could not understand, though, was the indifference
    of my fellow hacks. For them, too, a thousand other stories were more pressing
    and took up all time. It was impossible for them to cover them all, so they showed
    no interest in it whatsoever. And so this one had passed them by without their
    feeling obligated to dig deeper. Of it was also possible that they had avoided
    it at all costs. Either fear or indifference had them in their grip, it was hard
    to say which.


    As I went from floor to floor, wake to wake, I realized that I was alone pursuing
    a chimera. The dead woman’s ghost was watching me from afar. I believed in it.
    She, too, was now a gwai. As such, I felt her in the environment around me, a
    spirit in its discontent, vocal and tangible only inside my own mind but challenging
    me directly. Through sheer misfortune, I was seemingly the only witness to her
    disappearance willing or able to do something about it, the only one apart from
    my source who did not have a vested interest in minimizing it.


