    You see how careless I am?


    But he was grinning in his insolent, childlike way—deep it was all one big cosmic
    joke that only we were in on. And I did think of what Melissa had said to me privately.


    He went on, “So I arranged for us to meet out here. I know it’s a bit of a production.
    But what is life without a bit of maneuvering? I also wanted to get you out of
    the city for a day. You were looking decidedly pale last time I saw you. Unhealthy.
    You live like a vole. Kiss the sun, boy! Kiss it and make up.”


    I looked up at the island to our right, separated from the headland by a narrow
    channel, and as if reading my eyes Jimmy immediately said that was called Kau
    Pei Chau and was uninhabited as far as he knew. Perhaps fishermen had clung to
    the Song dynasty. Now it was a Crusoe island, marooned upon its waters. Our patter
    fell away and I shaded my eyes. The sun seemed to have produced a high-pitched
    whining inside my head, a tinnitus, and I caught the motion of languorous butterflies
