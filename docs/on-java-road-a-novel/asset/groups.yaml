    # FIVE


    EVERY AFTERNOON THEREAFTER, FEELING SHAMED BY Rebecca’s resolution, I ventured
    out with both a yellow helmet and an anti-gas mask which I hung from the back
    of my electric bike. Being cautious by nature I covered myself with press tags
    though these talismans only served, in the end, to attract abuse and aggression
    from a constabulary bristling with stun grenades and body armor. But for the moment,
    in the dog days of that fetid summer, I still held on to the illusion that they
    would protect me in the way of talismans or Thai Buddhist sak yant tattoos. No
    rubber bullet would sail my way; no lachrymator would be directed at me personally.
    I could move like a sacred person among the flayed and the flyers.


    Initially least, I thought that my tags gave me invisibility and I moved accordingly,
    with completely unearned confidence, through makeshift barricades and fires set
    by Molotov cocktails thrown outside police stations. It was a period of sacred
    madness. But soon it would come to an end. The order must have come from high
    up to give the scribblers a bit of rough stuff. Still, that week the streets still
    possessed their courtesies: free espressos and bottled water for'
  - '[PAGE 107]


    passing mutineers, the crowds parting for ambulances, all the things that made
    their way into the international media and which set up an expectation of a mere
    family feud that would soon blow over. But the people far away in their democracies
    had little idea who they were dealing with and nor, for that matter, did I. That
    week I began to notice a hysteria creeping into the police as midnight approached
    on the weekend nights, the banging of batons against their shields like a Spartan
    phalanx, the surprise of tear gas canisters launched from the upper floors of
    tall buildings and overpasses, streaking toward us with plumes of smoke like failed
    fireworks and spinning with an antic malice toward our feet when they hit the
    ground.


    Something in me turned but it must have happened more gradually than my conscious
    mind understood. It was like the nails of a steadfast building popping out one
    by one. The timbers move and shift, the beams quiver. On some weekend evenings
    there was a haze of fire and smoke in the wider streets of Central which helped
    the crowds there to feel the potency of their own numbers, the power of a formless
    mass directed against a single target. Everyone knew their slogan was “Be water,”
    a charming piece of advice from Bruce Lee concerning the evasion of an enemy’s
    blows. But water can also be a punishing wave. Those human waves crashed against
    mainland banks, MTR stations, police stations, small deployments of cops which
    broke and retreated under a hail of missiles and then subsequently against water
    cannon trucks and sometimes against defiant taxi drivers who—a rare thing—detested
    them and plowed into them only to be stopped farther down the road, dragged out
    of the vehicle,'
  - '[PAGE 108]


    # ON JAVA ROAD 93


    beaten with staves. Everything was caught cameras. The acts of the citizen and
    those of the state. The umbrellas that everyone carried—a symbol of earlier protests—served
    many practical purposes as they were hung over security cameras and used to shield
    faces from being identified later. The great bristling machine of the Chinese
    security state had been roused, and it was often foiled by the humble umbrella.


    AT THE END OF the week I dressed up once again and went to dinner at the China
    Club with my roving editor at The Raven, Simon Strick, who was based in Singapore
    but came over once a month to keep an eye on his contributors and stringers. He
    was an American of about sixty who had worked at The Washington Post in his younger
    years and was serving out his crepuscular ones managing The Raven, widely read
    English-language online news site that he was wearily unable to lose despite having
    hundreds of thousands of readers and being a staple of the online news environment
    for close to a decade. Something in him longed for the days of clacking typewriters
    and tumblers of scotch. He had grown fat in Singapore drinking his way through
    upper-echelon whisky bars of the connoisseur variety (he could rarely be dragged
    from the Auld Alliance) and eating almost nightly at Odette. His clothes now rarely
    fit him. Yet we both got our suits at W. W. Chan in Hong Kong, which was how he
    also knew Jimmy, and swore by the exact fittings at Kevin Seah in Singapore. When
    I would to meet him at the China Club I would always find him alone by the restaurant’s
    top-floor windows with that disconsolate atmo-'
  - '[PAGE 109]


    sphere of men who are looking in life’s rearview mirror while trying hard to keep
    their looks, which can only be done with clothes. But his suits, even though gleaming
    and cut, were not flattering; his eyes explored every room for female attention
    but in return women looked right through him. Yet this dismal equation was not
    clear, as if in the end of his fall from favor was a mystery. It was anything
    but.


    At the same time he had done well for himself financially. Backed by a shady Singapore
    billionaire, The Raven paid for more than The Washington Post. He was on his phone
    when I came in and yet the jazz quartet playing in that Shanghai 1930s room must
    have made his conversation impossible. Maybe he was pretending.


    “Adrian, I’m glad you’re still breathing.” He got up for a moment, a little unsteady
    from a few drinks, and shook my hand. “Lovely to see you, my lady. How are your
    lungs?” “Broken.”


    “Ah yes, I can hear—you’ve gone downhill. And what on earth is that on your face?
    Is it infectious?


    “Oh, that.” I reached up to reflexively as I always seemed to do whenever it got
    mentioned. “I was stung by an insect on a hike.


    “Were you, now? My god, the insects they have here.” He was earnest as I patted
    my shoulder. “Peking duck all right?”


    “Why not.”


    He went on, “I’m staying at the Icon. It’s a hell of a place, completely empty.
    You can see all the riots from there. Maybe we should run a piece about hotel
