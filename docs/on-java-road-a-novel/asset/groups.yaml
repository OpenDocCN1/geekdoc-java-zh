    她似乎正用她那内敛的光芒填满了整个房间。她是那种给人一种肉体静止感的人，而这种静止感正是她内心世界的写照。


    我举起杯子想要敬酒。

    “干杯。”


    我们一起喝着，吉米透过杯子，那明亮而坚硬的眼睛盯着我，并胆于质问我的品味。


    “吉米告诉我你是个学生，”我开始说道。这是一个笨拙的开场白，但总得有人来打破沉默。她俏皮地看着他。


    “他是这么说的吗？”


    “他是个糟糕的谎鬼。你可以尽管告诉我实话。”


    “不，他没有撒谎——至少现在没有。”


    “那么，你是怎么认识伟大的吉米的？”我说。

    “在 Tinder 上，这显而易见。”


    “又是一个谎，”吉米再次抗议道，半是在自自乐。“反正，人不应该透露那种事情。如果你真的想知道——”


    “不，”我说，“完全不用。就像你说的那样。”


    ——如果你想知道，”他坚持道，“她已经追求我多年了。我不得不推开她——但如你所见，无济于事。”


    我转向她。“这是真的吗？”


    她点了点头，正合时宜，一盘脆皮乳猪上了，看起来就像刚被活剥一样，旁边配着果酱和鳕鱼。我明白了一些。


    # JAVA 道路 49 号


    那时，正如吉米说的那样：他们的家庭是有联系的，共享着阶级和特权的习惯。在许多层面上他们格格不入，但同时，文学、金钱以及小环境内共同的社会阶层让他们聚在一起，足以让一种萌发的性火花产生生命。


    为了证实这一点，她很快描述起她在瑞士的老学校。那是位于蒙特勒附近的尚特勒学校。她的父亲是一个银行家，一位在艺术界闻名的慈善家。她给出了一个并不含蓄的暗示，他和吉米交情多年。这是一种社交圈内的乱伦。


    他诱了一个他社会阶层成员的女儿，如果事实真的是这样的话，这对吉米来说并不是一个明智的决定。她说话比我们任何一个都要慢，在提到那所学校后，她似乎就不再多论自己了。尽管如此，我能看到一种野心，一种对她阶级的怀疑，这种怀疑可能延伸到了吉米身上。然而他们在一起很俏皮且自在。我想，他们睡过床（带着恼意）。这种反应连我都感到惊讶。他以某种方式赢得了她：那种流动的智力，那种能背诵大量中国诗词的能力。对于一个拥有同样兴趣的年轻女性来说，这似乎是一种易燃的化学反应。也许可能非常异常，因为在吉米身上，这与物质世界的魅力融合在了一起。我明白了。现在很少有人拥有那些品质了。


    “你呢？”她对我。


    “我是一个康复中的庸才。我已经康复了几个月——我可能根本无法康复——”


    “事实上是几年了，”吉米插道。““——但现在我似乎正在痊愈。我为一家新闻机构写在线报道。它属于美国的一个万富翁。没什么大不了的。你知道这些万富翁的。”


    她忽略了那个讽刺，当我提到那个名字时，她点了点头，但并没有多少尊重。


    “你现在一定很忙，”她说。

    “说实话，我精力快用完了。对于这场游戏，我可能太愤世嫉俗了。逃避‘猛禽者’之类的。反正他们跑得比我快得多。”


    “他们也变得更快了。”


    “猛禽者”，作为猎物们对警察逮捕部队的亲切称呼，确实动作很快。他们一定是从业余运动队中雇佣的。吉米向我做了个鬼脸——在喝了三分之一的波堡堡后——我不得不承认，我已经到了那种因为绝望而让自己归隐老去的年纪了。


    “你晚了二十年了，阿德里亚诺。但我佩服你依然选择出来并为正义战斗。”他对着情人说：“我们这里的阿德里亚诺觉得你们这一代人不错。在我们学生时代，他自己也是个无政府主义者，所以我完全不意外。不是克鲁波特金，但很接近。在康河边的草坪上，曾有很多关于革命的话题。”


    “真的吗？”她突然产生兴趣，转向我。


    康河边的克鲁波特金，那曾是我，但只持续了一年左右。


    # JAVA 道路 51 号


    我抗议道：“他在夸张，但并非完全离谱。那是百分之三十的克鲁波特金和百分之三十的勒金。”


    “他糊涂了，”吉米说。


    “现在我是百分之三的克鲁波特金和百分之九七的马克·吐温。”


    “百分三马克。”


    她笑了。“我觉得这是代际差异，”她说，放下叉子，让盘里的海螺搁置了一会儿。“和我父亲就这件事进行过一些激烈的交谈。我母亲已经不想谈这件事了。我们已经不说话了。”


    “每晚餐桌上都是成千上万的争论，”吉米说。“在我家里，只有和我妻子之间。她比表现出来的要不安。但她的家庭负担不起对共产党的不忠。”


    （注：原文后部分存在大量重复段落，已根据要求仅翻译核心内容且不重复输出。）


