    # TWO


    THE TANGS LIVED BELOW MAGAZINE GAP ROAD IN THE Mid-Levels in a building called
    Borrett Mansions. These fortress-like luxury tower blocks stood at the end of
    a narrow lane called Bowen Road, which burrowed through tropical forest crowded
    with creeper vines and ficus roots as it rose toward the rusticated walls of the
    Mansions. Here, on the ground floor of which were surprisingly modest Art Deco—style
    lobbies, it felt as if time had stood still since about 1970. Raised high above
    the city, the air around the Mansions smelled of moss and wet bark, and a mountain
    chill touched my face as soon as I got out of the car. It had rained just an hour
    before. The hillside of ferns and creepers around me dripped quietly as I walked
    across the back entrance lane to the lobby that served their apartment on the
    fifteenth floor.


    A doorman was already there ahead of me with the door held open. He knew me and
    skipped to the elevator, knowing already ivory button to press. But I had never
    learned his name. As I stood by the metal frame of the elevator, in tune with
    its 1930s British style, he looked me up and down as if deciding whether my shoes
    were good enough. A week-end night on the Mid-Levels and in politically uncertain'
  - '[PAGE 32]


    times. I would have guessed most of the wealthy inhabitants of the Mansions were
    already elsewhere in the world. The money was flowing outward, an unstoppable
    tide driven by despair at what was unfolding in their city. When the doors opened,
    however, a maid was there to greet arrivals. Recalling me, she said, “How are
    you, Mr. Gyle?” as we traveled up to the people richer than we were, exchanging
    a look of shared melancholy.


    It was a gathering of about fifteen people, a dinner more than a party. But the
    Tangs didn''t like sitting around a table and so guests were served anywhere they
    happened to be seated. I, too, liked it that. They were knowing hosts and made
    no missteps when it came to entertaining at home. Melissa Tang opened the door;
    clearly, the doorman had announced me. She was in a black cashmere cardigan and
    velvet trousers, casual for her, and because they were the same color the only
    thing eye noticed was her collar of pearls. It was dramatic and chic; she was
    always like that. It was also the old apartment of her father, the eccentric millionaire
    Rodney Chow, and its carpeted rooms and Ming terra-cottas collected from China
    made her comfortable. The Chows were as wealthy as the Tangs, though they had
    made their money in manufacturing and television stations. Rodney, a cantankerous
    old-timer fond of jacquard smoking jackets and Swedish girls, was often to be
    seen both at the Tangs'' soirees and about town, I rarely interacted with him
    since I feared and disliked him. Rodney’s oversize taste was everywhere apparent.
    One of those priceless terra-cottas was a life-size horse, its neck garlanded
    with earthy bells, standing like a guardian deity in the vestibule. Whenever Melissa'
