    The promenade in front of the hotel, with its row of black iron posts and its
    open view of the Lantau peaks, was my daily walk as I went into Tai O. It passed
    under lovely old trees that must have been planted by my countrymen in centuries
    past. It resembled the path around the Peak that Rebecca and I had walked together.
    A landscape nudged into a different shape by a race from the opposite side of
    the earth.


    But as the path left this manicured zone it seemed to pass back into China, with
    the tackle and plastic pots the local fishermen laid out along the shore, the
    Shaolin Wushu Culture behind a circumference of half-hearted barbed wire, the
    cement structures with faded red Chinese characters, and the watchful stone lions
    everywhere. Soon there were shops with pieces of butchered fish hung in rows and
    flower stalls set against the water amid stacks of baskets. By the estuary the
    houses were on stilts, above the mud with strange homemade chimneys and banner
    flags.


    Here, days quickly turned into weeks and, as my stay became longer, I came to
    know every inch of this passeggiata. I would stop by the mudflats at low tide
    and smoke for a while, content to be surrounded by nothing but old people and
    birds pecking their way across the mud. On the balconies of the two-story houses
    behind me old men lay on ruined sofas smoking as well—it was a harmony of ancient
    and contemplative smokers. I avoided the main village farther on, as it was often
    crowded with day-trippers from the city on weekends. From the mudflats I would
    turn and walk back to the Heritage, unnoticed despite my race. One afternoon when
    I arrived there, however, the rain had just started to fall when, as if knowing
    that I was approaching, one of the staff from the hotel came down to the footpath
    with an umbrella for me. He handed it over and said that a private boat had just
    pulled up at the jetty and that perhaps I was expecting a visitor?


    “I’m not expecting any visitors here,” I said, wanly.


    “Yes, we know. All the same—there’s someone here to see you.”


    I told him that I would go down to the jetty myself to see who it was. If it was
    the police it would be better to be done out there where no one would notice.
    So I walked to the jetty under the hotel umbrella and as I reached the first of
    the steps leading down to the water I saw the launch heaving against the tires
    and the shine of an ice bucket resting on a table at the rear. I knew then exactly
    who it was and, unsurprisingly, the figure who had disembarked only a few moments
    before was standing at the far end of the jetty alone in a pale green Bruton fedora.
    The one man who I always thought would show up sooner or later.


    NOT ONLY THAT, BUT he implicitly forced me to walk all the way to the end of the
    jetty to meet him. As if it were I who should displace myself to find him, and
    not the other way around. How typical it was; a meeting conducted via our old
    patterns. I made the sea trip, he seemed to be suggesting, so you can endure the
    short walk.


    He was dressed in a gray Prince of Wales suit with beautifully ancient black oxfords.
    When I reached him he turned quietly, aware of me already. So you are there, you
    rascal, his look seemed to say. Then without acrimony Jimmy held out a hand to
    shake and gave me a once-over, as if I had gone to seed but he was too well-mannered
    to make a point of saying so.


    “Are you hiding out, Adrian?”


    “I’m taking a few weeks off.”


    “Aren’t we all? I’ve just gotten back. My father-in-law insisted I get out for
    a while. Quite a spot you’ve got here.”


    “It’s not really mine.”


    “Quite so, quite so. But still, I can see why you’re here.” I suggested that we
    go inside since it was raining and he was without an umbrella, but he didn’t seem
    put out by the drops spotting the surface of his suit.


    "As a matter of fact,” he said, “I made a dinner reservation for us up at the
    hotel. I hope that’s all right.”


    I stared at him. “Are you sure that’s a good idea?” It didn’t need to be said
    that was why he had come out to see me. But it hung in the air so obviously between
    us that Jimmy turned at last to what we were both thinking.


    "We both have things to feel resentful about. Let’s bury the hatchet for the sake
    of dinner, shall we? For what it’s worth, I have the impression the brouhaha is
    dying down a bit. It always does. People always find something else to obsess
    about, idiots that they are.”


    "If they didn’t we wouldn’t have anything to write about.” “Speaking of which—you
    know,” he went on, not looking at me but instead gazing out over the rainy mountains
    and their rolling mists, “I don’t blame you for writing that drivel. Pretending
    you had some sort of inside information about her death. The market, so to speak,
    demanded it. Don’t protest, you know what I mean. Your profession is even more
    corrupt than mine. We both know it. We’re all whores,” you and me, everyone. But
    in the end, I understand. You misunderstood the situation because you didn''t
    ask me directly and you jumped down the rabbit hole of your own conspiracy theory.
    For Christ’s sake. You were upset.


    “So you are saying I was wrong all along?


    “Of course you were wrong. You were wrong. You were played by some sharp points.
    You shouldn''t have been so desperate.”


    “Desperation has nothing to do with it—Well, it wasn''t animus against me, was
    it?


    I denied, but at the same time I was forced to wonder if there wasn''t a grain
    of truth in it. If it was partially true, why did I resent him anyway? It wasn''t
    just about Rebecca, surely. It also came from our own past—the way I had come
    to be able to see through him, to make him transparent without realizing it. For,
    after all, this was what he had always been able to do to me. When we were young,
    was always in the superior position, always able to judge my vulgarities. That’s
    one thing our unconscious never forgets or forgives. He turned finally, brushed
    the rain from shoulders, and tried the old smile, comfortable one has wearing
    for years.


    “It could have argued, comrade, that was the one thing you didn''t do. You didn''t
    have any evidence at all.”


    I could have argued, but I knew in advance how it would turn out to be, how impossible
    it would be for him to admit that he had done anything outside the laws of power
    and wealth. He would deny everything I had heard from my sources, whom of course
    I had indeed paid and who, it occurred to me dismally as we walked slowly up to
    the hotel, might have been lying all long. If, as I admitted to myself, it was
    impossible to trust anyone or their stories in a city made totalitarian; why should
    I have trusted them? Who was to say hadn''t just taken the money and the little
    favors and the free lunches and had a quiet laugh at my expense? They wouldn''t
    have cared one way or the other.


    Even later into our meal, seated under the restaurant''s glass roof drumming upon
    it, I could not bro the subject in any detail without him turning on the reproach
    again. This was now, I understood, his line. I had savagely wronged him and he
    had come there to squeeze an apology out of me. Apart from anything else, he said,
    honor demanded that he establish his innocence in my eyes. He couldn''t let something
    like that go. As we walked over to the hotel, I had noticed the limp with which
    he was afflicted, I hoped only temporarily, I had said. He''d grimaced and waved
    a hand. At dinner, though, he opened up about it over the second bottle of red.
    Some crazed friend of Rebecca''s had taken it into her head to strike a posthumous
    blow for the honor of her friend. He had been stalked. Rueful was all that he
    felt about now. He even knew the girl, her name was Kerry, he said. I understood
    at once that he had completely forgotten that I had met her at Duddell''s, if
    briefly. But there was little point in mentioning the fact.

