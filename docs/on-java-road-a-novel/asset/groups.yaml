    She is a charming woman, Adrian. Yes: normally we would, as you put it, be sticking
    by her. But these are not normal times and the fact is I won''t be seeing her
    again. I''d suggest you do the same, comrade. I can''t help it if you disapprove.


    Eventually a dessert came which he''ve ordered while I was in the bathroom. It
    was an off-menu special, a pyramid of durian ice cream with lychees stuck into
    it.


    “They bring us dessert,” he sighed, spearing a lychee with his fork, and they
    call it peace.


    WHEN WE CAME BACK up to the street the typhoon had started and umbrellas whirled
    ownerless down the empty streets. It did not put the slightest dent in Jimmy’s
    good humor, however. He offered me a lift in his limo, but I refused, making the
    excuse that I had an appointment nearby. In reality I wanted to walk home in the
    rain and let our conversation sink and settle down. All along I had had the subtle
    feeling that Jimmy was lying, both to himself and to me. But I had to ask why.
    Was he really capable of going so far in iniquity? Perhaps I felt this ambivalence
    all along, which was why I had listened so attentively to Bawa in the first place.
    The Sri Lankan, for all his deviousness, was at least a truthful gossip, and truthful
    gossip is more salacious than the invented kind. I decided I would go back to
    him with a bit of inducement and try to get something further out of him. Perhaps
    I could offer some gossip in return. By the time I had reached North Point I had
    resolved to talk to Bawa privately and see whether he believed him more or less
    than I believed the artful Jimmy, even though he was my friend. I climbed the
    stairs of the Garland up to my overheated rooms, which were filled with exhausted
    flies, and sprayed them before sitting down and calling Bawa. But I was unsure
    what to offer him. In the end, I settled on an expensive lunch on a day of his
    choosing. He was so cheap, it would get him talking, and that calculation turned
    out to be accurate. When it comes to free lunches, improbable as it might seem
    to outsiders, there is a delightful gastronomic dishonor among scribes. Any free
    spread will get them talking.


    ## EIGHT


    HAD ASKED BAWA TO MEET ME AT FUNG SHING, with an air of urgency that would make
    him react the way I wanted before he had time to up the stakes and bargain with
    me. As Napoleon once said, “Vitesse, vitesse, vitesse.” In the event, he was there
    before me dressed exactly as he had been that night at Spring Deer. The satisfying
    thought that came to me that on his hack wages he possessed only one suit, which
    he wore on every occasion after ironing it himself under a newspaper. He was ensconced
    at the table I always took myself; the servers must have directed him knowing
    that he was there to meet me. Made cognate by despicable foreignness, gwailo always
    hang with gwailo.


    I knew you’d come around, his smug expression said, and in a way he was right.
    I had not bitten his bait the first time but now he could see I had gotten hungrier.
    I ordered my usual dim sum and some pu’er tea.


    “Is this your place, you say?” he asked.


    “Before you say it, yes, it’s a Communist hangout. I come here for the soupy dumplings,
    not the politics.”


    “All the same, they must notice you. If I had your politics I wouldn’t live around
    here.”


    I said I wasn’t aware of having any politics. “But I know what you mean. You know
    I can switch to Mandarin whenever I feel like it. I speak it better than Cantonese.”


    Bawa, who spoke neither, grimaced at the barb. But it wouldn’t get in the way
    of his winning both a free lunch and some information from me.


    “We’re in the same business, Gyle. I know you know things that you keep to yourself.
    So do I, so I think we can trade. I trust you to keep it to yourself.”


    “Likewise.”


    “We aim to be of service. By the way, you looked rather dashing in those pictures
    in the Apple Daily.”


    “So you noticed, one?”


    “Well, I am one of the five people in the city who know who you are.”


    The restaurant was in one of its lulls and therefore empty. A perfect place to
    share secrets. He didn’t waste any time asking what I needed or wanted. He was
    often fond of quoting the Rolling Stones about needs and wants, to wit, you can’t
    always get what you want, but you can usually get what you need. I think that
    it was his operational motto.


    All right, I thought, let’s jump right into it. I asked him bluntly if he knew
    a girl called Rebecca To. Or even for that matter the To family, mildly surprised.


    “They’re rather for voting rights, aren’t they?”


    “I’m not sure they are. But even if they are, they keep it to themselves and they
    certainly don’t approve of violence.”


    “What about the daughter? I don’t know her if that’s what you’re asking.”


    “But do you know her?”


    “Of her?” The surprised look faded slowly and was replaced by something more involuntarily
    sly. “I won’t deny I know of her.”


    “What have you heard?”


    “You mean what I have *seen*? The whole city has been talking about her, in case
    you haven’t noticed.”


    “I know that. But what have you heard about besides what you’ve seen in *Apple
    Daily*?”


    “There isn’t much to hear. She’s a pro-democracy runt, isn’t she?”


    “So to speak.”


    He glanced down at his hands, which always appeared to be lightly powdered. And
    indeed if he had turned up in a powdered wig I would probably not even have blinked.


    “Why are you asking?” he said.


    “I’m trying to find out where she is. I’ve been thinking about what you said about
    Jimmy at the morgue.”


    His mouth opened as if he was about to laugh, but in the end he was silent.


    “I’m wondering if I could find out more about the dead girl there.”


    “You want to know who it was?”


    “Yes.”


    “Well, you know, Adrian, so would I. It would be an interesting story for me.
    Why would I give it to you instead of writing it myself?”


    “Because I owe you an enormous favor that you could cash in later.”


    “Would have to be more than a free lunch, señor.”


    We both know the value of it. It might be very useful for you down the stretch.
    This is just one story anyway. And do you really want to write it and face the
    consequences? You might get yourself on the wrong side of the police. About that,
    I don''t care. But you do.


    “Obviously I care.”


    It was the way we hacks often dealt with each other, a cynical interplay of obligations.
    With a curious elegance we picked out a paper napkin and wrote two names with
    numbers, as one would jot something down during a bout of absentminded daydreaming.
    That, he told me, was all I was getting. I could take it or leave it. The slight
    disdain of this position struck me as being genuine. The names were employees
    of the morgue, and I could probably buy them off according to Bawa, though he
    couldn’t say what the going rate was. Nor would they go on the record, obviously.


    “I’d ask that you not breathe my name to a living soul,” he said, rather redundantly.


    “That’s the easy part.”


    He looked at me skeptically and shrugged.

    “It’s up to you whether you think it’s worth it. Why would you want to stick your
    neck out for this? You’re not really going to write something, are you?”


    “I owe owe you. They’re friends of mine, as you say,” I said, trying to throw
    off the scent. I know you and Tang were friends, but that’s no reason to jeopardize
    yourself.”


    I took a moment to reply to this.

    “I didn’t know the girl very well. But all the same, she’s worth defending.”


    He poured his tea and seemed momentarily serious.

    “It’s usually a bad idea to pursue. I don’t want you to write a piece about it,
    Adrian. It would finish you off. And the gesture would mean nothing, if you want
    my opinion.” He lowered his voice just a degree. “You put too much stress on the
    word free in free press. It’s all rigged from the get-go. I’ve been trying to
    tell you this for years: the Chinese system is the future. We pretend to write
    they pretend to read us. Forget it.”


    I said, “Then I should get paid is what you’re saying?”

    “I can’t advise you on that. And don’t be sarcastic. I’m just reminding you that
    you’re in China, not the Upper West Side.”


    “Maybe it’s just to sate my curiosity.”


    He smiled effortlessly.

    “It’s usually just smoke and mirrors.” He pushed the napkin with its information
    across the table. “And I fear you wouldn’t be defending her.”


    He walked with me back toward Java Road afterward there we stood for a moment,
    sniffing the air for tear gas

