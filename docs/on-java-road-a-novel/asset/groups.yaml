    I said, “It’s odd more than anything. Did you find out the girl’s name?”


    “They wouldn’t say. I don’t think she was some poor local student. The fact that
    the Tangs were involved—”


    But not necessarily in the plural, I wanted to say.

    “Isn’t the Jimmy Tang who races yachts?” Moyers put in casually, although he knew
    exactly who it was and how many yachts he had raced. “Don’t they call him Terrible
    Tang?” And he came down to the morgue?


    I said I really had no idea. Terrible Tang. It was a name I’d heard applied to
    him in order to evoke his notorious womanizing. Terrible Tang turns up to identify
    the body of a young woman—the soap opera wrote itself. But it could have been
    any number of girls because now, but rejecting at once the idea that it might
    be Rebecca. I had been with her the previous night and there had been no sign
    that anything was amiss. And surely there is always a sign. As for the others,
    I had seen a few of them at parties over the previous three or four years, invariably
    young and avid for advancement in the city’s suffocating social hierarchy. Now
    that I thought about them more carefully, scenes from the past resurfaced while
    I held my tongue. A face that flashed out of the dark one night at Pierre as Jimmy
    and his consort-of-the-night waved good night across a packed room in paper party
    hats; a gallery opening somewhere in Central on a hot summer night, a woman introduced
    briefly by a name I couldn''t now recall, her face covered in glitter, seen again
    by chance a week later at a charity function at Belon, even more striking under
    the globe-shaped lamps.


    But who had she been? I didn''t follow Jimmy’s liaisons as they were breaking
    news and I rarely asked him about his private life. Bawa, however, didn''t know
    this and it was clear that he was expecting a juicy tip from me, even one tossed
    out unknowingly by the unconscious.


    But I said, watching my every word, “I’m afraid I can''t give you a suggestion
    as to who the girl might be. Maybe it''s a high-society thing.”


