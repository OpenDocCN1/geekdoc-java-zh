    bar called the Old Man in Central. All through the previous twenty-four hours
    I had been feeling increasingly anxious, aware that I was becoming less and less
    invisible in the city as my outward appearance as a foreigner—as a European—began
    to take on new and dangerous meanings.


    As I came down onto the street after six de-ed o''clock, I saw a stout man standing
    at the corner of Staunton across from Fat Choy, holding himself up against the
    wall of steeply pitched Aberdeen Street, a man in the telltale white shirt of
    post-Beijing street-gang types and emerald satin knickerbockers caught sight as
    I waited for my car. He was holding an empty bottle of Jack Daniel’s and, if not
    knowing what else to do with it, lobbed it across the street at both me and my
    fading sharkskin suit. It smashed against the curb and tiny particles of glass
    landed upon the fabric of my sleeves and trousers. There was no one on the corner,
    but you could tell that a crowd had just passed and people had been battered;
    he himself had a bloody nose. He looked as if he had drunk a bottle of Jack Daniel''s
    all by himself. The neck didn’t smash for some reason and rolled away down Aberdeen,
    gathering speed while the man raised his fist and called me gaat zaat a cockroach.
    I wasn’t wearing any items of clothing normally associated with the protesters,
    such as a black shirt, so it must have been a drunken generalization, I thought,
    spat out indiscriminately.


    Gaat zaat in Cantonese had acquired a particular context during those sweltering
    summer weeks but I hadn’t thought it would ever be used against me, not even by
    the counter-protesters in white shirts who until then had seemed shy with suited
    foreigners. They hated us and sometimes cried “CIA” as I walked by, but only when
    I was in combat gear. “CIA” in Mandarin sounded almost poetic: zhhongguo qing
    baooji. This one was out for more blood and he came hunting me, crossing the junction
    toward a small roadwork near Beer Fish. Staggering a little, his eyes bloodshot,
    he called me a cockroach again and spat on the ground at the far end of Staunton.
    I saw my taxi coming to save me. He was already snarling with a certain amount
    of melody: Die lei lao mu—


    Before the car reached me, he had swung a wide punch and caught me on the right
    cheek, but not with enough force to knock me over. It was a weakening’s punch.
    “Easy, easy,” was all I managed to say, and swore at him in French in a desperate
    attempt to put him off. I believe I called him a lover of prostitutes. He came
    at me again, displeased with a foreign expression, and it was the opened door
    of the taxi that rescued me from a second attempt on his part. I dived and slammed
    the door behind me, more astonished than anything else. I wasn’t hurt, but I was
    insulted. And worse than being insulted, I had been taken unaware and by surprise.


    In the back seat I noticed the driver looking me over in the rearview mirror,
    mildly entertained, as a pinprick of blood had landed on the white front of my
    shirt and sat there like a ladybug. I wondered if it was his blood or mine, so
    I raised a finger to my cheek and discovered it was indeed split and bleeding.
    I had to use my pocket square to staunch it, thus staining its translucent yellow.


    I swore out loud and for a while forgot where I was going. The stunned feeling
    of being jumped incompetently obliterated all else for a good minutes. He had
    saved me. Foxglove was on the ground floor of an apartment block off Queens Road
    and had a secret door marked by a basket filled with umbrellas. It was a commonplace
    jazz, which only a man could have suggested, a typical journalist''s idea. Who
    wants a scrap with a thug? I thought glumly. Somewhere along Queens Road, in any
    case, I got the driver to stop and decided to walk up to Foxglove. By the time
    I found the building on Ice House Street with its low display windows at street
    level, filled with gold and silver handles, my cheek had dried out. Above the
    heads were signs from another age. Established 1868.


    I looked at myself in the glass displays of the vestibule—yet more mirrors—and
    saw in the reflection that I now had an ugly wound that didn''t give my face much
    character. That foul member, if indeed he was one, had ruined my week and not
    just my evening. I should have told him that yes, I was CIA and that I carried
    firepower. Nonetheless I calmed myself and strode to the basket of umbrellas.
    I knew already that one had to play a little game with them; you had to push hands
    down until you got the right one; then the fifth caused something to click behind
    the wall and the whole wall sprang to life and moved sideways. I stepped into
    a pitch-dark bar with a bandstand and a quartet playing Brubeck numbers. One move
    inside and the wall slid back into place. The place was full of people among women
    too young to notice him. Cunningham was in the custom-made safari jacket he always
    wore throughout the unbearable summers, probably some garbage from Sam’s Tailor
    where he had seen Anthony Bourdain get a suit made there. The pockets filled with
    quinine pills and the sweat clinging to his neck had not dried were ample defense
    against the strongest air-conditioning.


    “There you are,” he said, barely raising a hand to shake mine. “I thought you
    were coming from the Old Man.”


    His hand was clammy and I dropped it as soon as I could.


    “I was, Cunningham, but I got attacked. A triad member threw a punch at me outside
    Fat Choy.”


    “Oh? Was there any particular reason?”


    “Who knows. Maybe he was just drunk and in a bad mood. Highly unusual, though.
    There’s no crime here to speak of. The moron was waiting outside for me with a
    bottle of Jack Daniel’s. Maybe he’d had an argument with his wife. Or tensions
    are high—and whites are the enemy for those types. Perhaps. Have a drink, poor
    boy. I’ll have a sling. I have a mind to go back and fuck him up.”


    “Don’t do that. It’s triads who fuck us up, not the other around. Come on, just
    sit down and let the blood dry.”


    “It’s what one always thinks after getting punched. But you didn’t because you
    were scared. As Mike Tyson used to say—”


    Like hell I was. He threw a bloody bottle at me—everyone has a plan until they
    get punched in the face.


    The sling arrived and having waited for it politely, Cunningham offered a toast
    to injured journalists and I to Tong Boon, the bartender at Raffles in Singapore
    who invented the sling before the First War.


    “Those were the First days,” I said grandly as I could, my hand still shaking
    with rage at my humiliation, “and they’ll never come back. Yam sing.” I downed
    the whole thing and slammed the glass back on the bar. “Barman, one more mgoi.”


    Are you flush, Gyle?”


    “Flush? Why on earth would I be flush?”


    “You look flush. You’re behaving flush.”


    Not exactly that The Raven paid me for my piece about racetracks finally. It’s
    been four months. It’s just an extra thousand bucks for drinking in any case.
    I have to be flush to hang out with you. It’s like being friends with a cash-eating
    vertical wind tunnel.”


    “Well, if you say so. Barman, one more, mgoi.”


    I said that as far as I could see this place was full of “locusts”—it was our
    term for journalists and bloggers who had flown in from all over the world to
    cover the troubles in our city but who otherwise had little idea where they were
    and cared even less. It was also a Cantonese word for main-landers. Both species
    were seated in the dark with girls they had picked up somewhere. The Western species
    in their garishly bad journalist clothes: Banana Republic shirts and orthopedic
    shoes, as much as the dregs of former glories as we were ourselves. The mainlanders
    in suits they had bought at Sam’s.

