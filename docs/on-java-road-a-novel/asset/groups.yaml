    be fictional in the eyes of readers, but it would also be read as factual—it would
    be my version of “The Melon of Huanghtai.” This, in the end, was what I proposed
    to Strick. I sent the email in its entirety, asking him what he thought of it,
    and he responded by pointing out something quite obvious: that a shadowy unnamed
