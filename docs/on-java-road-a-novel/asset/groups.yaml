    When I looked back it was obvious why we had become friends at Clare. Neither
    of us belonged in that environment. The trappings of the English upper classes
    were not ours. Jimmy already had his position in the wider world because, although
    he came from a colony, it was a rich and vital one. It was I who was the peasant.
    A peasant who had learned to turn verbs in Chinese, but a peasant nonetheless.


    I like to think he felt sorry for me; maybe he did. Or I was the frog with a hook
    in his mouth and he was the one harming me as little as possible. I would see
    him every day at lectures and in Mandarin classes, and as is the way with students,
    it only took a couple of weeks before we were on nodding and then speaking terms.
    By Christmas of first year we were going to the Eagle every evening, or Waffles
    on Fitzroy Street, or the Indian next to New Hall, and he had assumed over me
    the senior position—better clothes, better hair, more spending power, and more
    literary candlepower. It was the head start that the rich always enjoy. Fast out
    of the blocks, they can be outpaced only later in life, when it''s too late. I
    calculate that it gives them a fifteen-year advantage, which is the span of time
    needed to at least draw level with them. By contrast, they often burn out early.
    If you surpass them later in life they will always complain that their early advantage
    was, in reality, a handicap. Jimmy, however, would never suffer that disillusion.
    Although his father already had his future mapped out to the last detail, Jimmy
    told me that he’d declared to the patriarch even before he had left for Cambridge
    that he had decided to become a scholar of Tang poetry—and there was nothing his
    vile clan could do to stop him. “They’re psychopaths and spendthrifters anyway,”
    he said to me, as if I were the only person to whom he would ever say such things,
    though he later repeated them obsessively in Hong Kong. “I have an uncle who has
    a different car for every day of the week. Color coded. My grandfather made his
    money in the gambling dens in the ''40s. They were racketeers from Shanghai, that’s
    all. It’s what I am, too, if you look hard enough.”


    He was fond of reminding me that the first British cemeteries in Hong Kong specifically
    excluded the Chinese dead. “But you let us in eventually—as corpses.” His English,
    acquired at the Diocesan Boys’ School on Argyle Street in Hong Kong, was faultless
    and almost without accent. He never talked about his years at Millfield school
    later on, and I learned never to ask him about them. He was more interested in
    my school, a secondary modern in the English countryside. That was true exoticism
    for him. He was fascinated by the class machinery behind such an establishment.
    When I told him that I had passed much of my teenage years being groomed to be
    a qualified mechanic, he nodded and said, “Yes, that might have been better. Now
    you’ll have nothing but a useless Chinese Studies degree. And who among Western
    literates even read Chinese poetry these days?” It was possible that he didn’t
    believe this other hypothetical future. But one look at my disgusting clothes—the
    eyebrow rose—and he understood that there might be some truth to it. Clothes.
    It was why we first began going to London. Clothes were never trivial to him,
    as they are never truly serious people. When talking about Maoism, for example,
    he would just grimace and say, “Yes, yes, I understand, but the clothes, comrade,
    the clothes.”


    ## LAWRENCE OSBORNE


    He got fitted at Dege and Skinner and bought hats at Lock and Co. That were, I
    thought at the time, me but which he gave me the confidence to wear. I was the
    only person in my year to own a panama hat who had the gall to actually wear it.
    I found that I didn''t know my own capital city at all, but Jimmy knew it intimately
    from a thousand Tang-family expeditions. I didn''t know anything about anything.
    I had never been to a restaurant before. Never spent a night in a hotel, never
    drunk wine, never taken a black cab, never been to a nightclub or a theater, and
    had never been to any site of note except for the British Museum and Karl Marx''s
    grave in Highgate Cemetery, taken to them by my grandfather: the high-minded pilgrages
    of the working class. It would have been difficult to describe to Jimmy the scene
    with the old man, a retired bus driver from Bevdean, standing before the David-like
    head of Marx in the rain, eyes filled with tears, his arms piled with votive flowers;
    me, shivering and unmoved behind him. Jimmy Tang, scion of a family who had fled
    the Communists in China, would have quipped that at least Jewish Marxists got
    to be buried there.


    For Jimmy, my “reeducation” was a Pygmalion game, which he played with an inborn
    skill. It kept me in my place, though in a subtle and unnoticed way. And yet it
    also let him—perversely—into the English social game to which even Millfield had
    never opened the doors. But then again, there was Chinese poetry, that cathedral
    in the landscape of words. It was with Jimmy that I learned to recite it correctly
    and to sink into its rhythms. The poem about seeing off Meng Haoran at Yellow
    Crane Tower was the first Li Bai he taught me to recite, making me similar to
    a billion Chinese school-children, though he never followed through on his vow
    to write a translation that would surpass Pound’s famous English-version. For
    how would you improve The smoke flowers are blurred over the river?


    ## TWO


    THE TANGS


    The Mid-Levels, a building called Borrett Mansions, stood high above the city,
    a hillside of ferns and creepers. It had rained just an hour, and a mountain chill
    touched my face as I got out of the car. The air around the Mansions smelled of
    moss and wet bark. Here, on the ground floor, it felt as if time had stood still
    since 1970. I walked across the back entrance to the lobby that served their apartment
    on the fifteenth floor. A doorman was already there with the door held open. He
    knew me and skipped to the elevator, knowing which button to press. As I stood
    by the metal frame of the elevator, in British style, he looked me up down as
    if deciding my shoes were good enough. When the doors opened, however, a maid
    was there to greet arrivals. Recalling me, she said, “How are you, Mr. Gyle?”
    as we traveled up to the people richer than we were, exchanging a look of shared
    melancholy. The inhabitants of the Mansions were already elsewhere.


    It was a gathering of about fifteen people, a dinner more than a party. But the
    Tangs didn''t like sitting around a table and so guests were served anywhere they
    happened to be seated. I, too, liked it that. They were knowing hosts and made
    no missteps when it came to entertaining at home. Melissa Tang opened the door;
    clearly, the doorman had announced me. She was in a black cashmere cardigan and
    velvet trousers, casual for her, and because they were the same color the only
    thing I noticed was her collar of pearls. It was dramatic and chic; she was always
    like that. It was also the old apartment of her father, the eccentric millionaire
    Rodney Chow, and its carpeted rooms and Ming terra-cottas collected from China
    made her comfortable. The Chows were as wealthy as the Tangs, though they had
    made their money in manufacturing and television stations. Rodney, a cantankerous
    old-timer fond of jacquard smoking jackets and Swedish girls, was often to be
    seen both at the Tangs'' soirees and about town; I rarely interacted with him
    since I feared and disliked him. Rodney’s oversized taste was everywhere apparent.
    One of those priceless terra-cottas was a life-size horse, its neck garlanded
    with earthy bells, standing like a guardian deity in the vestibule. Whenever Melissa

