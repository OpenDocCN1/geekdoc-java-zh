    # 174 LAWRENCE OSBORNE


    that anyone peering through the viewer would not see me, and rang the bell.


    There is a certain kind of silence that is the sign of panic. Something moved,
    then stilled itself. I rang again. Curiosity always wins out. Socked footfalls
    approached, very quietly, and I could sense the eye behind the peephole staring
    out into the landing. Then the door opened and Melissa’s voice came onto the landing
    and asked who was there. I stepped out nonchalantly as possible, and made the
    grin sheepish. “You!” she gasped, and not hesitating too much, slid off the chain
    and stepped onto the landing with me. She was in house slippers and sweatpants
    and a cashmere cardigan that didn’t cover her chilled and goosebump arms. The
    first thing she said was that Jimmy was not there, he had gone on a business trip
    to the U.S. and would not be back for a few days.


    “I was passing through,” I offered by way of petition. “I thought—”


    “You didn’t think to call?”


    “I did, but Jimmy didn’t pick up—never picks up, in fact. So strange.”


    “Would you like to come in, then?”


    The offer was unenthusiastic, but it would be worse for appearances if she simply
    refused to let me in.


    “Just for a minute,” I said. “Since I’m here.”


    Yes, since you’re here. I think you also owe me an explanation. Don’t you?”


    “I do, yes.”


    The admission seemed to satisfy her.


    I saw at once that the apartment was shut down in some way. The furniture was
    draped with protective dust sheets,


    # ON JAVA ROAD 175


    the carpets had been rolled up, and one of the Murano chandeliers had been dismantled,
    lowered to the floor, and wrapped.


    “End of the season?” I wanted to quip, knowing that there were no seasons and
    if they were wrapping up chandeliers they were moving on somewhere else for a
    while. It looked like Jimmy had made good on his offer of moving them to America.
    I took a look around as Melissa made tea in the equally bare kitchen. On the terrace
    the view looked more sinister, the lights more symbolic of some vague pandemonium
    and malice. As of last night, she said, Jimmy was in Los Angeles buying them a
    new house. They already had a place in London. But Los Angeles, to them, felt
    closer, on the Pacific Rim where they belonged. I said that I understood, privately
    I was taken aback. Could that be true? I scanned the walls for the artworks and
    saw that they had all disappeared. Perhaps it was true, then. After my interview
    with Wong, in fact, it felt all the more likely. That he had not told me was indicative
    of his guilt, since he would have dropped me a note before skipping town. She
    sat with me, haggard and drawn, her eyes filled with strain and exhaustion. It
    was very different from the last time I had seen her.


    “I assume you wanted to talk to Jimmy about something.” It’s related to what we
    talked about last time I was here. But since he’s not here and you are—well, I’ll
    be honest with you.”


    It struck me that she had been in need of a confidant for a long time and in some
    curious way I had promised to fulfill that role for her. Not that we ever got
    down to brass t


    # 176 LAWRENCE OSBORNE


    when we chatted together. All too obviously, my role had been subverted by my
    complicity with her wandering husband it could never be restored. Still, she wanted
    to know things from me that only I could provide. "We know her family socially.
    That was what was shocking. An affair with her, of all people? My father wanted
    to have him arrested"


    Her eyes narrowed. "How old is she? Twenty-three or something? What a fool Jimmy
    is. And you for going along with it and having the gall to show your face here."


    She was speaking her mind but I could see her anger tinged with forgiveness down
    the line. She knew I was not as bad as her husband. I said, "He invited me to
    go on the yacht for the day. It was after you and I had spoken. I didn’t know
    she would be there."


    "Didn’t you?"


    "He didn’t say anything beforehand."


    # ON JAVA ROAD 177


    "You’re a prick, Adrian. But you—you never were a very good liar, Adrian. You’re
    one of those men who lie because they think it’s honorable, and then do it badly.
    Which is dishonorable."


    "I promise you—"


    "Don’t promise anything. I don’t want to hear it."


    She got up and went to their luxurious cabinet. It was the temple of Jimmy’s alcoholic
    fantasies. “What would you like?”


    “You’re very understanding about your liquor. I like that. It’s your best trait.”
    “Whisky and ice,” I said. They had an old-fashioned soda fountain and the sound
    was comforting to the ear. She walked back with two sodas and handed one to me,
    ignored my request for ice. Her mind was elsewhere. Back in her velvet throne
    she asked me sarcastically to Jimmy and I liked to raise when we were alone. “Who’s
    better than us!” she echoed, and raised her glass. It was Jimmy’s whisky, all
    toast, too.


    “It’s surprising you came,” she said. “I’m even surprised you’ve stuck by Jimmy
    all years. I’m not sure he’s the loyal type deep down. He hasn’t ditched you,
    that’s true, but then he hasn’t needed to. If he needed to, he would. He ditched
    the girl, didn’t he?”


    “He said he did.”


    In a funny way I feel sorry for her. Do you know where she is now?” I lied and
    said I did not, but there was something off-kilter about the way she asked, as
    if she already knew the answer was playing the game. She said, “What was your
    impression of her?”


    I paused for a long time. “I don’t know what to say. I didn’t talk that much with
    her.” I think I met her once when she was much younger. It’s pretty vile, Jimmy
    would’ve met her then, too.


