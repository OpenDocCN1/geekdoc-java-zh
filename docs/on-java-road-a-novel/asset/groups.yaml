    两年时间，我不会那样躺在那儿任人侵犯。而且，他们现在根本不在乎外人说了什么或想了什么。那不是什么白人特权，而是蔑视。


    “那看来你的日子过得挺轻松。”


    “我在这里感觉很平静。我希望等我出去的时候，他们已经忘记那些英雄事迹了。”


    “噢，说到这个，还有其他消息。”


    我那时意识到，他来并不是为了给我带书和多维生素片，而是为了转达这另一个消息。


    “关于你朋友吉米的。有人在他房子外袭击了他。你们两个似乎是心有灵应。”


    我不仅感到惊讶，而且在某种不愉快的方式上，有些欣慰。


    “他还好吗？”


    “他伤得不重。”


    “所以我们在同一周内都遭到了袭击？”


    “这简直不可置信，”我说。


    “但事实确实如此。膝盖被刺了一刀。”


    “他残废了吗？”


    “你听起来像是在希望如此 true。”


    一个残废的吉米，这倒是个好主意。


    “是谁干的？”


    “这儿的一个女孩。”


    “我不认为他们有名字吧？”


    ## 爪华路 211


    “慧凯·（Kerry Hui）。对你来说意味着什么吗？”


    我不得不微笑，然后拒绝解释为什么。又是那个神秘的慧凯·。随着城市陷入无序，报复行动到处都是，因此在我的文章发表后有人去对付吉米并不完全让人意外，就像凤盛的那帮人对付我一样。但和坎宁汉谈论这些没意义。他是那种记者，把去自杀现场当成自己的分内，并记录每一个细节，就好像他在为后世编写编目一样。他必须相信那些自杀是完全正常的，否则他会疯掉。也许他已经疯了。在他诚恳的追问中，他现在想知道我打算如何打算。对他来说，显而易见的是我无法留在香港了，因为我现在被当局认定为一个多管闲事的“鬼佬”（gwailo），傲慢且无根据地诋低了他们警察的尊严。我一辈子的卑微的文学服务都付诸东流了，除了我那记宏大的告别，我最后的齐射。


    “盖尔，你真是把自己作送了，如果你介意我这么说的话。”他玩笑地拍了一下我的胳膊，眨了眨眼。“最近伦敦有什么空缺吗？”


    “在香港失败了，试试伦敦。”


    “最近大抵如此。或者干脆退休到泰晤河金斯顿（Kingston upon Thames）。我最终会那样做的。”


    于是，到了该进行早已排练好的思绪，感叹正在消失的世界秩序的落日，以及我们在其中不确定的地位。“最后的殖民者，”他说，一边递给我一片多维生素片和一杯医院的或——


    ## 212 劳伦斯·奥斯本


    橙汁。“如果你现在离开，六个月后没人会记得你的名字。如果你运气好的话。”


    “二十年是一场空。”


    “情况就是这样。那些从阳台跳下去的人反而是幸运的。”


    “他们没救了。在街上用用弹弓死掉不是更好吗？”


    “为了什么呢？那毫无意义。我们是新西藏。”


    “只不过西藏人没有英国护照。”


    “他们也不想要，”他说。


    “我考虑过在巴厘开一家酒店，”我反驳道。


    “我的意思是，比泰晤河金斯顿好得多。”


    “谁开？”


    他终于从口袋里掏出一瓶小瓶威士忌。


    “让我们都来一口该死的，为世界末日干杯吧。那些蠢货（berks）和混蛋（bell-ends）现在掌权了。”


    我在想如果让我翻译，该如何把这些英国俚语翻译成中文。这是不可能的。比起这些，翻译李白太简单。


    “如果我们十年后回来，”他说，“所有的街道都会以共产国际命名。”


    “我深怀疑。”


    他在塑料医院水杯里倒了两份，我为我们那不光彩的过去干了酒。


    “谁比我们更好？”我举起杯说。我那时想到了吉米，想那同样的祝酒词在我口中已变得多么扭曲。


    后来，我反思，他的话是否已在——


    ## 爪华路 213


    下意识地说服了我这样做，即，离开。我脸上的伤疤愈合了，变得光滑且略带光泽，像被风吹过的鹅卵石，从那时起，每当我走在街上，就像一个身上刻着罪孽标记的人。奇怪的是，我并不介意。这似乎是应得的。我没有从阳台跳下，也没有在一个夏日的夜晚被那些永远不会面对判决的人夺走。为什么我不能在脸上留下一道伤痕呢，就在那另一道由精准左钩造成的伤痕旁边？


    我经常想，诗人李白也是一样，在唐朝的中国走家串户，遍访寺庙，寻找避难所、工作机会、圣人、同道诗人、孤独和偶然的灵感。没有比这更出名的了：举头望月，低头思乡。我向护士们借了铅笔和纸，我用它们对坎宁汉带给我的那些用来熬夜的书做了几处翻译。即使是上面的


    ## 229 我回到加兰德之后


    望月，我想，他也会认可的，因为从这个视角可以观察到月升。就在那时，我产生了一个冲动，离开城市一段时间，无踪迹地消失，但利用机场，这会让每个人都变得显眼。我想到了大屿山。在我年轻时，事实上，我经常退隐大屿山和大澳遗产（Tai
    O Heritage），那是一个由英国警察局改建的酒店，俯瞰同名村的海。我会带着女朋友或书去那里，有时，罕见地，两者兼有；随着年龄增长，我变得什么都不带了。它让我想起更快乐的时光。那些时光现在感觉似乎完全处于历史的边缘。


    三面被海洋环绕，我感到自己远离了干涉的威胁——


    ## 爪华路 215


    遗产酒店位于岛上，对面水面上是色彩忧郁的翠玉山，它的房间被涂成白色，许多房间留有原始的壁炉和法式窗。由于只有九间房间，它的私密性是无与伦比的。我任何时候都能知道那里的每一个人。此外，那里没有道路经过，只有一条通往码头的小径，渡轮曾停靠在那里。在那里，我每天早晨可以喝我的咖啡，双腿悬在波花上。


    三面被海洋环绕，我感到自己远离了来自香港的入侵者的威胁。我推算出危机打击了酒店业，事实确实如此。当我到达时，遗产酒店空空如也，水面上的山被云雾遮蔽，酒店所在地的小热带森林山丘一片寂静。他们给了我以前和女朋友住过的那间房间，我每天睡十二小时。当下雨时，我坐在其中一个露台上读我带来的书，四本按时间顺序排列的康拉德小说。我观察下方小路上的每一个人和码头上散步的每一个人，并格外留意有时停靠的私人船只。


