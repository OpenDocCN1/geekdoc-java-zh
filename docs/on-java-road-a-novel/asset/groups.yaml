    # ON JAVA ROAD 149


    “And when was this?”


    I wanted to calculate at what point she had been verifiably alive, but Jimmy was
    deliberately vague, as if he didn’t want to say. All he had admitted that they
    had gone to Soho House for dinner and he hadn’t planned to do it then. The pressure
    had gotten too much for him, said. They were in the restaurant area. A lot of
    people noticed. “It was a royal fuckup,” he admitted.


    I said, “But they wouldn’t have known who you were necessarily.”


    “I’m sure some did. You never came over and asked us if everything was all right.
    That’s never happened to me before.” He was seething, re-livingiving it all again.


    “I don’t believe a word of it.”


    “You know,” he went on, as if what I said couldn’t possibly matter, you spend
    all this time with a woman and you think you know who she is and *what* she is
    and why she is with you. But in the end you know nothing. Absolutely nothing.”


    He had looked into her eyes at that moment, he said, and saw nothing recognizable
    at all. Just a hostile emptiness. Naturally he understood it was the shock of
    an unpleasant moment. He could hardly have expected the scene to go entirely to
    plan. She had launched into recriminations, accusations, and the violence of the
    reaction had blindsided him. She told him that he was only doing it because he
    was afraid of his wife’s family. Which was true. But they were unwelcome nonetheless.
    She hadn’t tried at all to see it from his point of view, Jimmy said pathetically.
    Yet he had remained quiet, and had tried to calm her down. She wouldn’t have it,
    though.


    “That’s an unfortunate scene for Soho House,” I said.

    “It was a farce.”


    Something in his eye seemed to brighten for a moment. I did

    “So afterward, when the pictures surfaced, I admit I did think it might be. She
    might have planned it long before our breakup. But maybe it was for another reason
    altogether, I don’t know. I have to admit to you, if I’m being frank, that I think
    she’s capable of it. She could well have been filled with rage at me. I wouldn’t
    blame her, even.”


    I didn’t buy it, but Jimmy seemed utterly convinced. He said that they spent the
    night together she never slept. Messages kept lighting her phone up all night.
    He had a hunch that it was her fellow conspirators down in the streets. Maybe
    they wanted something from her, maybe she was even sleeping with him for an ulterior
    reason, as he had just suggested to me. Then, along these lines, something more
    had occurred out of him. She was there with him purely to get money for the cause,
    or to cause a scandal that would make him amenable to them. Was it possible? he
    asked directly, and I replied that I had no idea. In fact, as far as concerned
    it was not true. His feverish ramblings about this theory felt put-on, as if he
    were carefully deflecting and leading me astray. And so, little by little, we
    began to enter new territory in our friendship. I could feel that it was a small
    game to Jimmy, and that he was sounding out my reactions by testing me and not
    divulging to what he really thought. He was lying, in other words, to play this
    game, and his confession was therefore a pseudo-confession. I objected to his
    insinuation about Rebecca, in any case, and I could see from his reaction that
    he was not at all surprised or inclined to push back.


    “I agree,” he conceded mildly. “But it’s not impossible either. That’s what Melissa
    and her father said to me. That it was a plot to harm me, to harm them. She was
    using me all along.”


    “It’s ridiculous.”


    “All right—”


    “Then where is Rebecca now?” He threw up his hands with a touch of melodrama.


    “That’s what I want to know. If only I *did* know. I didn’t see her after that
    night at Soho House and we stopped communicating. It was necessary. You can understand
    that.”


    “Naturally. So that night,” I said, “was really the last time you saw her?”


    “Absolutely.” Didn’t I say so? his tone implied. So their breakup must have been
    before I met her at the China Club. Yet she had mentioned nothing about me. Come
    to think of it, she had been quite cool when talking about Jimmy. Perhaps I had
    missed the clue. He was still talking, interrupting my train of thought. One night,
    he said, when he and Melissa had been dining in the main room, the landline phone
    had rung and Melissa had gotten there before him. He had heard her from the dining
    room, repeatedly asking “Hello? Hello?” until she had given up and returned to
    the table. He then asked her who had been. She had shrugged, saying only that
    it must have been a prank or a wrong number. Yet Melissa had appeared rattled
    and her mood had changed. It then occurred to him that someone on the other end
    of the line may have spoken to her after all. She had grown cold and nervous.
    “It seems odd that people are playing pranks,” he said. As she looked away he
    felt certain that someone had indeed spoken to her and she did not want to reveal
    it.


    “So afterward, when the pictures surfaced, I admit I did think it might be. She
    might have planned it long before our breakup. But maybe it was for another reason
    altogether, I don’t know.”


    I kept thinking all night that the caller had exposed my affair to Melissa and
    that she was keeping it to herself. But there was no way to prove it. It was possible,
    I supposed, that Rebecca had been feeling vengeful and prone to reckless behavior.
    It would not be in keeping with the individual I thought I knew, but when it came
    down to it, how well I know either? “You should call her,” I said.


    But suddenly, for the first time, I had the feeling that there was no one to call.
    Rebecca had gone, but I didn’t know where. A slow buildup of unease arose within
    me, and I thought of Bawa. He had not lied at all—Jimmy had been at the morgue.
    “No,” he said smoothly, “that would be a terrible idea. I’m sure she hates me
    now. Either way, I’m not calling her. For all I know, she’s gone abroad.”


    “Abroad?”


    He made a small gesture of resignation and caught the eye of a waiter. “Shall
    we have another bottle? Come on.”


    We sailed on, bound to get incoherent. It was a relief in a way. The skin along
    my back grew moist, my temples flushed with blood. The wound on my cheek, which
    by now felt like some old battle scar, grew feverishly hot as well and I feared
    it would suppurate visibly. I excused myself and went to the bathrooms, which
    were buried inside a small dark-walled labyrinth. I found them empty. Dampening
    a paper tissue, I tended to the wound, which had indeed flared up as if it were
    psychologically connected to my moods. An irrational fear gripped me. All that
    is solid, as Marx said, melts into air. Not only that, it does so from one moment
    to the next. Between leaving the table and staring into my own image everything
    I knew about Jimmy evaporated. Around me now was empty space, noise, and madness.
    I gripped the edge of the basin and watched as perspiration rolled down my cheek
    into the fabric of my collar. Yet the bathroom was cold, as cold as I was. I thought
    back to his account of the mysterious phone call to his house. Had it been after
    Bawa had seen him at the morgue, or before? I hadn’t asked him the date. Confused,
    I calmed myself and went back to the table, where Jimmy carried on as if he noticed
    nothing unusual about me.


    “A toast!” he cried, raising his glass. “Who’s better than us?”


    It was an old toast from college and I echoed it. Pretty much everyone in this
    room, I thought to myself, bitterly.


    “So what are you going to do now?” I asked, taking a sip of wine and relaxing
    into my seat.


    “I’ll stay home and have dinner with Melissa and endure it until she forgives
    me. It’s rather a classic move, but no more parties for me. I’m going to keep
    my face out of those magazines for a bit. Maybe I’ll grow up, as her family keep
    asking me to do.”


    “And about Rebecca, you really don’t know where she is?”


    “You’ll have to take my word for it. Maybe you can find her herself. Why the sudden
    interest, Adrian?”


    His eyes sharpened and I was forced to take a quick step back.


    “To be honest, I’m just worried about her.”


    He took this in his stride, revealing nothing. It was not the moment to confront
    him with my suspicions and I could hardly throw Bawa’s testimony in his face.
    He said, “If she hasn’t decamped to foreign parts by now, she’s probably out there
    on the streets fighting the revolution. I wouldn’t worry about her if I were you.
    She’s not our responsibility. The revolution is bigger than us, remember. It’s
    bigger than her, too. You should be worried about yourself, just as I am worried
    about myself. Apart from anything else, Adrian, her political engagements are
    dangerous to me as well. Don’t you see that? The whole charade was incredibly
    fucking stupid on my part. Sooner or later they will come for us simply because
    we associated with her. Maybe not this year. But next year or the year after that.
    These people have long, long memories.”


    I said that that was a trifle cowardly coming from us.


    “Cowardly?” he guffawed.


    “Should’nt we be sticking by her?”


    “I’m not sure I know what you mean.”


    I repeated what I had said, and this time around he became exasperated with me.

