    walked past it she ran a hand softly along its flank, as she did now. “I’m glad
    you came,” she said, not turning to me as she led me in. “Jimmy’s been in a foul
    mood all day.”


    “Oh?”


    “The family they want him to make a statement about the Hong Kong situation so
    that the authorities know where we stand—with them, hopefully.”


    “A statement?” They want him to declare their loyalty to the state and to the
    Communist Party. Well, it wouldn’t be worded like that.”


    “How would it be worded, then?”


    She vacillated inwardly, I could see it, and her mouth set as her teeth ground
    together and she mustered all her diplomacy.


    “It would be worded as a declaration of belief—in the future of Hong Kong. Do
    I have to spell it out?”


    Over the years I had come to think of their home as the most elegant in Hong Kong,
    even though it was oldfashioned, creaky in its way, and stripped of modern technology.
    It was deliberately Victorian because that had been Melissa’s father’s more Western
    taste, but gradually her own, more Chinese sensibility had begun to prevail. The
    chandeliers were statically ominous, the wall tapestries showed Forbidden City
    scenes stylistically, suspended between Orientalism and the actual East, and the
    terra-cottas were now everywhere, raised on pedestals or shelved inside niches,
    museum quality and a shade too proud of themselves. They lay among a handful of
    delicate Luis Chan psychedelic watercolors from the late 1960s depicting dreamy
    islands and ghosts alongside trippy dinosaurs and strange-looking birds, and a
    single more controversial Chun Fai piece in contemporary neorealist style that
    Jimmy had forced his wife to accept. I knew that Chun Fai painted stills from
    classic Hong Kong movies of decades past and that his anti-establishment politics
    made him unwelcome to people of Melissa''s background—yet the piece hung in their
    sitting room almost unnoticed, in a spirit of uneasy compromise. A group of men
    seated around a table in undershirts playing cards in some forgotten year of the
    1970s, exuding a quiet threat.


    This room opened onto a balcony, which bathed in the glow of the never-sleeping
    towers that descended toward Victoria Harbour. The sea appeared and the neons
    of Tsim Sha Tsui burned on its black surface as ferries passed through the reflections.
    There was a group already seated in the wicker chairs drinking Manhattan Iced
    Tea of communal jugs. I knew quite a few of them. The Tangs had two circles that
    overlapped awkwardly: high-rolling hedge funders and bankers on the one hand,
    and journalists and academics who journeyed up to the exotic world of the Mid-Levels
    to mingle with these financial overlords, who in turn barely noticed them. I was
    familiar with both circles, though I preferred the bankers, in a way. They were
    less pretentious and their kindly fascism was cheerfully upfront.


    But meanwhile there was a second balcony, which Jimmy had turned into a tropical
    garden, entered by a different room, and Melissa took me there because she wanted
    to have a word with me alone, if I didn''t mind. The view was the same, yet we
    sat alone together on the single sofa that stood within that miniature jungle.
    One of the maids brought us drinks. I was not especially close to Melissa, though
    obviously we knew each other for years through Jimmy. I found her sympathetic
    and, in her way, brittle noble. It wasn’t her stoic endurance of Jimmy’s childishness
    and self-ishness that was noble, but rather her capacity to pretend that she thought
    certain things for the sake of a higher cause. She would extol the efficiency
    of the Chinese Communist Party when it came to building highways or managing to
    put rover on the dark side of the moon. She didn’t really believe as the Party
    did, that such efficiency mattered, but she did believe in the nation’s ascent
    and its long, continually evolving glory, which would guarantee, one day, a hegemonic
    ture. More important, it would be her future, too, and her family’s. Most people
    would call that hypocrisy or worse, since it was clear that she was not entirely
    convinced that communism itself was the all-encompassing beatitude of the future.
    But there are more worldly ways of understanding it. Her duty was to her clan,
    her dynasty, her people, and her civilization—as she saw it. It was not a political
    loyalty. It was deeper than that and therefore more tenacious. It was a loyalty
    weary but unswerving, and it made me admire her in spite of myself. She always
    thought aimless, a rootless wanderer, and deep down I knew that she was right.


    “It’s been awhile since I’ve seen you,” Melissa said in her half-formal way, crossing
    her legs and trying her best to look relaxed. It wasn’t easy for her. “I’m sorry
    I wasn’t here the last time you came up. Jimmy says you’ve been working for a
    high and mighty news organization.”


    “Well, it isn’t CNN.”


    ## ON JAVA ROAD 21


    “I’m glad to hear it. We have quite enough American propaganda here as it is.
    I’m pleased for you either way. When I get some time I’ll read your dispatches.”


    I was rather hoping she wouldn''t, because the last thing I wanted with her were
    political discussions when we both knew how we felt about the issues. I was typically
    evangelical for democracy while she, a patriotic older type, couldn’t think of
    anything worse. So I prevaricated with a little self-denigration but her eyes
    were bright and had seen right into me.


    “I am a bit worried about Jimmy,” she went on smoothly, with a metronome’s ease.
    “He’s been behaving a little on the odd side lately. Have you noticed?”


    “The odd side?”


    “Mood swings. I was hoping—well, not hoping exactly, but I was thinking you might
    have an insight into it. I know you two play tennis every week. Don’t you have
    dinner at the China Club, too?”


    “Sometimes.”


    “You must have picked up on something? We’re all a bit tense lately, but my father
    was asking about him the other day.”


    “I take it he’s worried Jimmy has wrong opinions?”


    She shrugged. “Oh, he can have whatever opinions he likes, for heaven’s sake.
    It’s not that. But he can’t break ranks.


    “Break ranks with your family?”


    “You know what I mean. We have some standing with the Party, as I’m sure you understand.”
    She stared at me, lowered her voice. ## 22 LAWRENCE OSBORNE


    “We can’t have Jimmy going all pro-democracy on us.”


    “I’m sure it’s not that.”


    “A woman, then?”


    It was time to force a laugh. No woman, I insisted, But her tone remained flat,
    probing: “It must be something else, then.”


    “There’s nothing I’ve seen, Melissa. He’s not going to secret political meetings.
    He’s not taking movie actresses to a hidden-away love nest.”


    He was probably doing both but I held her eye and gradually she seemed to calm
    down.


    “All right. But I’d be grateful if you could come to me if you feel there’s something
    I should know. Would you do that for me?"


    I had to say yes, and I had to at least mean it. Over the years her family had
    been welcoming to me. They had invited me to their parties, their dinners, they
    had put in a good word for me here and there behind closed doors. I would go further:
    they had been one of my lifelines into the Hong Kong establishment. Not that I
    was an insider in that world, far from it. But I could drop into it time to time,
    as an interloper, and this ability was in large measure due to them. Since the
    Tangs were shipping billionaires, and donated charitably on a remarkable scale,
    they were not only amiable friends to me, but extremely useful ones as well. Jimmy’s
    father was kinder to me than Rodney Chow and well aware of how long I had known
    his son and how much affection existed between us.


    “You’ve reassured me,” she said, smoothing down her already unruffled trousers,
    as the velvet had accumulated motes of dust I couldn’t see. “Shall we have some
    punch?"


    For the rest of the evening I didn’t see much of Jimmy until the party had thinned
    and the remnants gathered again

