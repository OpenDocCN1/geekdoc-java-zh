    the mirror as if I had failed some erotic assignment, I thought over how even
    now I had still not even remotely tackled the riddle of Rebecca To. I felt that
    something had been held out to me—an offer of some kind—but at the same time it
    was nothing at all, just a passing mood late at night. In reality she had probably
    not even noticed the alterations going on in my mind because they had nothing
    to do with her, strobe-like as they passed through me, and afterward I was not
    sure whether anything about them was real at all.'
