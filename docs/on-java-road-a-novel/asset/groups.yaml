    ## JAVA路 95


    他咧咧一笑，牙齿呈现出一种人造的米白色，但同样非常均匀。至少可以说，这简直是不诚实的牙科手术。


    “我们必须以某种方式捕捉到全貌，艾德里安。并不是说我们不欣赏你的街头报道，那非常出色。但我确实想到，从长远来看，你可能会让自己陷入危险，而且如果你真的被搞残了，我们得考虑医疗费用。我确信外面有更大的‘大鱼’。另一方面，我个人很想看到一些关于医院的故事。你不能进到内部吗？”


    “对那个没兴趣，抱歉。”


    “问题是，其他人都在报道抗议活动。你当然做了一些出色的工作，这也是当下的头条新闻，但它完全属于我们吗？”


    “我正在努力。但我似乎始终无法完全抓到。”


    “我不想当那个说这种话的人。我明白你的意思。这就像冲向犯罪现场，眼睁睁看着一对衣角在你的前面转过角消失了。”


    我笑了。“这被你戳穿了。我不再那么快了。”


    “不如做些深层次的、节奏慢一点的。你不同意吗？”


    我能感觉到他的手握紧了。“我并不反对。”


    过了一会儿，我发现自己正看向房间的另一侧，期待着遇到我认识的人，那些在餐厅高峰时段偶尔会浮现在脑海中遗忘的面孔。在俱乐部里，这并不罕见。在黑漆扇子下，每个人看起来都有些眼熟，仿佛我至少和他们每人都见过一次，但在主意识中并没有记得其中任何人。但在房间的尽头，在一面写满中国书法的墙旁，那双眼睛捕捉到了瑞贝卡正和看起来像她父母的人坐在单独的一桌旁用餐。他们三人都穿者白色，就像花园派对——或者宗教仪式上的人——尽管那时已经过了九点。虽然她的父母（如果那是他们的话的话）背对着我，但瑞贝卡正面对着我。我似乎记得吉米说过她的父母是俱乐部的成员。


    这个幻影充当了一个即兴的灵感，我盯着她说：“也许我应该写写上流阶级家庭，以及那些走上街头的孩子。”


    “那是个极好的主意，”他叫道。


    “我们能做到吗？”


    “当然可以。我觉得这会非常有意思。引人入胜。参与感强。我是说，他们到底是怎么了？”


    他很清楚我在那个世界有足迹，很可能有信心地写出这些东西。但谨慎行事又是回事了。


    “你会考虑吗？”他问。


    我说我会考虑的，我不想为了新闻主义的猎奇心理而毁掉任何人。


    “这会毁掉任何人吗？”他问道，眼睛睁大，满是不可置信。


    “你很清楚可能会。”


    “我没说要暴露他们的秘密。我只是问他们的意见。公开记录。他们不会这样做吗？”


    ## JAVA路 97


    “老实说，我不知道。”


    “嗯，我们不会试图羞辱任何人。我不希望引起任何诉讼。但另一方面，我们都知道那是怎么运作的。我们的工作是查明真相。我们不冒犯任何人的情况下做到这一点。”


    “但我们必须得罪我的朋友吗？”


    他咯咯笑着，眼神流露出他有多享受挑拨我。


    “但我们一直在尝试这样做，不是吗？得罪你的朋友。到底谁才是你真正的朋友？诚实吧。我们都知道，故事比忠诚更重要。我个人很想看一篇关于你朋友吉米·唐的文章。当然，你永远不会写的。因为你对他忠诚，而且你知道这涉及什么……但说认真的，想想那会是一篇多么诱人的精彩文章。想想我们在香港会获得多少点击。但要挖深，你行吗？挖出一些惊人的内幕。然后我们再谈。”


    此时，我再次看向瑞贝卡和她的父母，几乎立刻对斯特里克说的话失去了兴趣。我开始找个好的借口站起来，朝他们的桌子走去。我想知道她的父母是什么样的人。她父亲转脸看向房间的其他地方，我清楚地看清他：一个神情严肃且帅气的男人，脸上的皱纹显示出的不是焦虑，而是对他所处处境的从容，甚至是对它们的掌控。但斯特里克在谈论钱，我无法抽身。我点头，几乎没有在听，全神贯注地盯着盯着远处的桌子旁。很快，瑞贝卡似乎察觉到了我的分神，她了起来，她的父母也慢慢地这样做。母亲转过头，我看到她的脸就像她女儿的老化版本，只是她的鼻梁更显傲慢。他们吃完了饭，满意地走向门口。抓住时机，我向斯特里克找了个“内厕”的借口，穿过桌椅组成的迷宫走向同一扇门。在五步路之内，我的心跳已经和我的大脑不同步调了。当我到达门口，随口问杜先生和杜太太去哪儿了时（因为工作人员肯定认识他们），他们说那家人上楼去酒吧休息了。我回头看向斯特里克，他又回到了那些权谋之中。

