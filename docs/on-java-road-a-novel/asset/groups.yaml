    “it’s all out in the open.” I laughed and told him how ridiculous he was. As if
    that could have been hidden.


    The maids had by now melted away and we were alone at the edge of a vast urban
    landscape filled with electrical ghosts, the light show of a Hong Kong night.
    From down came the persistent cries from the high-rises of people shouting choruses
    of defiance as they had for an hour, a sound that had become more animal despite
    the words that we could clearly hear. It echoed from building to building in a
    chain that might have encompassed the whole city in a few minutes.


    Jimmy was seemingly unmoved. He was merely curious as to why they were doing it.
    This must be a form of auditory semaphore bearing coded messages aimed at them,
    the rich and lofty in their hillside castles. Even though I told him that this
    was not the case, he refused to believe me and continued straining to catch the
    words that echoed across the ether. One of those words, undoubtedly, was *liberate*,
    as in *liberate Hong Kong. Gwang fuk heung cong*. This was a phrase invented by
