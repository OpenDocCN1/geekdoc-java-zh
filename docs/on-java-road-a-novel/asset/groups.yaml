    Lawrence Osborne is the author of seven critically acclaimed novels, including
    The Forgiven (now a major motion picture starring Ralph Fiennes and Jessica Chastain)
    and Only to Sleep: A Philip Marlowe Novel, a New York Times Notable Book that
    was nominated for an Edgar Award. He has also written six books of nonfiction,
    including Bangkok Days. Osborne has led a nomadic life, living in Paris, New York,
    Mexico, and Iambul. He currently resides in Bangkok.


