    街上：其他处是必须避开的冲突。维多利亚公园周围，忧郁的人群开始散去，各奔东西路，在某堵墙上，我看到了新的中文涂鸦，写着：“此生只嫁前线。”这是一个绝佳的信号，预示着
    Phoenix 永远不会留在 Jimmy Tang 身边，反正是不可能的。


    第二天晚上，当我坐在中环一家名为“老 Man头”的酒吧里时，这一切都在我的脑海中闪过。在过去的二十四小时里，我感到愈发焦虑，意识到随着我作为一个外国人——一个欧洲人的外表——开始带上新而危险的含义，我在这座城市里变得越来越不再透明。


    六点多我走到街上，看到一个壮硕男子站在中山街（Staunton）的街角，对面是肥仔（Fat Choy），他身体紧贴在坡度很陡的亚伯力慎街（Aberdeen
    Street）的墙上，穿着典型的北京事后街帮那种标志性的白衬衫和翡翠色丝绸灯裤，在我等车时注意到了他。他手里拿着一个空杰士·丹士瓶，似乎不知道该拿它做什么，就把它横跨马街朝我和我那件褪色的鲨鱼皮西装扔来。瓶子撞在路缘上碎了，细小的玻璃颗粒落在我的袖子和裤子上上。街角并没有别人，但你能看出有一群人刚刚路过，人们被打得过；他自己鼻子在流血。他看起来像是自己喝了一整瓶杰士·丹士。由于某种原因，瓶颈没碎，顺着亚伯力慎街滚远，越来越快，而那个男人举起拳头，叫我是一个“gaat
    zaat（臭蟑螂）”。我没有穿任何通常与抗议者相关的衣服，比如黑色衬衫，我想，这一定是一个醉酒后的泛指，随口无差别地吐口出来。


    “Gaat zaat”这个粤语在那些酷热的夏日里获得了一个特定的语境，但我没想过它会被用在我身上，哪怕不是那些到那时为止对穿西装的外国人还显得害羞的白衬衫反抗议者。他们恨我们，有时我走过时他们会大喊“CIA”，但只有当我穿着战斗服时才如此。“CIA”在普通话里听起来几乎很有诗意：zhhongguo
    qing baoji。这一个是想要更多的血，他来狩猎我，穿过路口走向啤酒鱼（Beer Fish）附近的一条小路。他步履踉跄着，双眼血红，再次叫我为蟑螂，并在中山街尽头往地上吐了一口唾沫。我看到我的出租车来救我了。他已经在带着某种韵律地咆哮着：“死老母（Die
    lei lao mu）——


    在车到达我面前，他挥出一记宽大的重拳击中我的右脸，但力度不足以将我击倒。那是一个软绵无力的拳头。“轻松，轻松，”是我唯一能说的话，并用法语咒骂他，绝望地试图打发他。我相信我叫他是个妓女之徒。他再次朝我冲来，对一个外国表情感到不悦，正是出租车打开的车门救了我免受他的第二次尝试。我扑进去，并在身后关上门，比任何事情都更感到惊讶。我没有受伤，但我受到了侮辱。而且比被侮辱更糟糕的是，我毫无防备且措手不及。


    坐在后座，我注意到司机正透过后视镜打量我。

