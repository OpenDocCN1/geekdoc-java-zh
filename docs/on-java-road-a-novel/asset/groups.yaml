    ## 七


    你必须钦佩一个拥有世界上最富有男人的城市，他叫李家政。我一一听到他的名字，就想起在这一轮抗议活动之初，他曾公开发表一份声明，引用了唐代诗人李贺的一首诗。“黄台槐，”李家政写作时带有极度隐晦的意图，“不忍再次被采摘。”


    在微博上引起轰动后，该声明在中国被封禁，因为它被理解为：一个被攻击过的东西不能再次受到攻击，否则将失去所有的价值。这意味着香港本身吗？李家政的发言人回答说，他引用的是《法华经》，共产主义者并不完全熟悉的教义。《法华经》是一带有奇幻色彩的戏剧和寓言，被中日两国的许多人视为佛法最后且最重要的启示。一位名为“妙音”的菩萨从遥远的星球造访佛，镶嵌宝石的宝塔漂浮在空中飞船中，而佛本身在数千年里拯救了数十亿灵魂。自然地，我知道李贺的这首诗。他作为太子，在684年被他的母亲武天后迫自杀。在自杀之前，他写下了《黄台槐》，作为对国家迫害的控诉：


    > 黄台之下槐，

    > 枝头累累众已熟。

    > 采其一，余者尚足；

    > 采其二，藤上已稀。

    > 恐再复尽采之，

    > 终将只剩空藤。


    很容易想象李家政和吉米坐在阳台上抽着雪茄一起引用这首诗。他们真的认识吗？无论如何，在那些定性照片发表后的几天或几周里，我一直在思考李家政和那些槐，这些照片很快从《亚洲日报》到了所有其他八卦报。你必须对他对周围强权权威的隐晦暗示表示敬。我一直在想，如果李家政可以说出这样的话，在没有过多掩饰的情况下暗示了君主最终会因为镇压过多臣民而自毁的观点，为什么我不行呢，我口袋里揣着英国护照？但，当我想到西方媒体本身变成了什么样时，这种讽刺感消失了。我们国家的记者每天都在被封口和限制。在我们统治者和通讯平台所有者的极大满意下，随着时间的推移，我们变得越来越像中国。


    无论如何，一周后的一个早上电话响了，电话那头的声音让我感到吃惊。吉米终于出现了，死而复生。他活泼而无辜，道歉并讨好，像那些习惯性逃避的人那样，哀求工作和家庭。在这种情况下，我发现并不并不意他的沉默。我很确定我对他朋友的询问已经传到了他那里。他一定听了我的所有信息，并在脑中反复思量。在那些信息中，我提到了照片，并想问他打算如何处理它们。


    “抱歉一直没联系，同志，”他轻快地说道，“现在，你今天打算干什么？我们要不要去中环买套西装？我请客。”


    我笑了。“一套西装是你所谓的请客？”


    “我觉得这也许是一个为我的无礼道歉的好方法。此外，我老岳父一直在往我身上砸钱。我想他们想让我闭嘴。”


    “这个提议可真奇怪的，吉米。”


    “是吗？我不明白为什么。我们之后可以聊严肃的话。我会带你去吃 Mott 32 的午饭。”


    “我比西装更喜欢那样。”


    “那可能更贵。然后我们可以聊聊媒体的事。”


    啊，我想，你终归还是需要我的。


    “我听别人说你和李家政一起吃了晚餐，”我说，语气比我预想的要急躁。。“你从哪里听说的？我甚至不认识那个人。你呢？”


    “我当然不。”


    “那你怎么知道这种事的？”


    “一个傻瓜记者跟我提过的。”


