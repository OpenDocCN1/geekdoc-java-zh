    # ON JAVA ROAD 191


    Strick at first was doubtful.


    “But it’s just interpretation and animosity,” he said coolly.


    “You are not, Adrian, a disinterested party.”


    “So what?”


    “Is it what you believe?”


    “It’s my gut feeling. That’s all.”


    Normally I would be careful with a gut feeling. You’ve been quite distraught and
    under the weather lately, what with your attack in the street and all. Are you
    sure?


    I said I didn’t care about anything anymore. “I wanted to go out on my shield?”
    He laughed.


    “That’s my whole point. Now I have the shield.”


    He took some persuading but gradually came around. It would be libel, slander
    if I even suggested the name of Jimmy Tang, but if I wanted to he had to be prepared
    to weather the storm—up to a point. And then it was I who hesitated. It would
    be a bold thing to do, given that I had no evidence apart from a hunch and a few
    dubious sources. But the whole point of going out on your shield was that you
    believed in the fight, no matter what you could prove in a court of law. Besides,
    what court of law even existed now?


    FOR A WHILE I stayed locked up inside the Garland living off deliveries. When
    I was bored I went to Fung Shing for the soupy dumplings and watched violence
    in the streets on the restaurant television along the Fujianese motherlanders.
    Crowds of black-clad youth came surging along streets, countered by men in white
    throwing traffic cones at them and brandishing homemade clubs. Each side, no doubt,
    thought of themselves as patriots. It reminded me of a quote by the great Italian
    writer Ennio Flaiano: “In Italy we have two kinds of fascism. On the one hand
    there is fascism, and on the other hand there is anti-fascism.” Yet I was feeling
    more gifted with a purpose. Soon I sent the reworked pages of my narrative to
    The Raven and was surprised that Strick was impressed by them. We discussed how
    to present it.


    “Would it be my voice, Rebecca''s imaginary voice, or an anonymous source?” she
    posited. In the end we went with an anonymous source and put it in the third person.
    We called the source Phoenix. I insisted on it because I knew Jimmy would get
    the reference at once and I wanted to wound him, to make him bleed, and give him
    sleepless nights. The piece implied that he had helped cover up her death in circumstances
    that were deliberately wrapped in the utmost ambiguity. The reading public already
    knew of their romantic association. Now more layers of conspiracy would be laid
    over a mere episode of adultery. I was not accusing him of murder, only of cowardice
    and expediency. But that was in some ways equivalent. Strick gave it the green
    light.


    For several days after the piece came out I watched it catch fire on social media,
    creating a maelstrom of rumors, and simultaneously and without any fuss I went
    to ground as quietly as I could and continued to watch the scandal grow. Even
    without my name attached to the article, those who made their business to know
    such things could make the connections easily enough. They would know within hours
    that a filthy gwailo had made it all up to smear the Hong Kong


    # ON JAVA ROAD 193


    Police Force. For what does a total-izing state not know? It was time to vanish.


    The Garland itself had grown moribund as it sank into its own defensiveness. As
    the streets became unsafe people instead gathered inside and whispered together
    in the corridors adjoining the stairway. I could hear them, even late at night,
    the gossip urgent but also edged with a jovial confidence that the speakers were
    on the right side of the state in the long run. Pro-Party gang members staying
    there after they had been bused in from the mainland? It was possible that some
    of them had been assigned the task of keeping an eye on the journalist foreigner.
    Long past midnight, when I was still working, I heard slipped feet moving past
    my door, taking their time. Bugs could be mounted anywhere. They could be fixed
    to electrical wires, to door frames, to the insides of drains. The whole structure
    could be a honeycombed listening device, for all that I could ever know. At the
    same time the transient population that I suspected had moved in to the Garland
    had become more vocal. Voices speaking in Mandarin, men talking about “chases”
    and “skirmishes” as they moved up the stairs, gathered on the landings with a
    bottle or two, laughing among themselves. Just as the city was changing, the Garland
    was changing hands. And day by day the story of Rebecca To grew on the internet
    until it metastasized into a string of conspiracy theories that flashed continuously
    through the electronic synapses of the city. The police vigorously denied; politicians
    evoked the CIA agent who had scripted the defacement. And all the while I only
    wondered what Mr. and Mrs. To thought of it.


    The meeting with them that I had been dreading finally came about, though not
    because of any initiative on my part. It was just a normal afternoon as I was
    walking down Java Road when I felt over my shoulder a car shadowing me at a crawl
    and I realized the To clan had finally found me. It all happened as smoothly and
    remarkably as a random encounter in the street, which it was not. My only surprise
