    with Beautiful ‘friend.’ An Affair?” Photographs began to appear everywhere of
    Jimmy and Rebecca together.


    The story was broken by the tabloid Apple Daily, which was owned by the anti-government
    garment industry magnate Jimmy Lai. We did not all remember why Lai had named
    his paper thus? If Adam and Eve, he is said to have stated, did not eat of the
    forbidden apple, would there be any evil and therefore any news? On its news site,
    the gossip about Jimmy Tang lit up the city. Even among the usual of celebrity
    scandals, gangster tales, gambling news, semi-fabrications about sensational suicides,
    grisly traffic accidents, and financial crimes it flared like a garish comet across
    the city’s consciousness.


    But there was something else. I instantly recognized the setting of the images.
    It was the island where we had moored together on Jimmy’s yacht. And in some of
    those shots I could also see myself, the obscure unnamed hack whom only a few
    people would recognize or comment upon, one of whom might certainly include Jimmy’s
    wife, Melissa. It meant that in her eyes I was now fingered as an accomplice to
    a bit of lighthearted adultery, just as she had expected of me only a few weeks
    before.


