    # TWELVE


    WITHOUT DEATH,” MAO USED TO SAY, “HUMAN LIFE could not exist.” As an aphorism
    justifying the 35 million deaths during the Great Famine I''ve always thought
    this saying possessed a remarkable, no doubt psychopathic coolness of touch. But
    like many of the Chairman''s sayings, it meant nothing at all when you mulled
    it over for a few seconds. The same was true of his sayings about cities, of ways
    of life; about books, culture, and for that whole civilizations. They were worthless.
    When intellectuals, that hopeless tribe, objected to his destruction of irreplaceable
    ancient sites across the country cleverly made them part of the demolition crews.
    There was nothing he hated more than Chinese architecture. However, he seemed
    to love poetry, which he wrote himself. Inevitably, then, into those ensuing weeks
    of limbo, I thought about the Chairman and Rebecca cremated out of sight and poured
    as ashes into a plastic container.

    I heard some days later that the Tos had boarded their house in Repulse Bay and
    decamped to London in time for Christmas. The Tangs had gone to ground. Jimmy
    never called me once after the anonymous “Death of Rebecca To” hit the Hong Kong
    airwaves. He must have been stunned. He'
  - '[PAGE 221]


    # 206 LAWRENCE OSBORNE


    knew it had come from me, it would not be something he wouldn’t understand at
    once. Strick, true to his word, had to let me go in order to protect his precious
    Raven and ensured that I would be paid for three months by way of a modest severance.
    I didn’t have any hard feelings about it. For the first time I was retired with
    a wage. I could float away from my previous life.


    The protests went on, but they no longer gripped me. I knew how they would end.
    The state rarely loses such combats. Journalism, at the same time, was a young
    man’s game, as I never ceased to repeat to whoever would listen, and it was anyone’s
    guess what an older man’s game actually was. Gardening and equally aging wines?
    I looked around me yet again. A way of life was disappearing rapidly and therefore
    (not being in any way exceptional) I was bound to disappear with it. I recalled
    that the Chairman, looking out one day over the once variegated and historically
    rich skyline of Beijing, still intricate and infused with Buddhist meaning, remarked
    that he could not wait for the day when, looking out over this same enchanted
    view, he would be able to admire instead a vast field of chimneys. He got his
    wish.


    AT FUNG SHING a few days after the Western calendar New Year, during a quiet week,
    I ordered my usual and sat at my corner table until the early evening, when I
    would walk home. That was there in the only restaurant I still frequented, that
    Mr. Meat Cleaver Li, the man with the red face and the Fujian accent, spotted
    me from across the room one early evening midweek and let out a roar of laughter
    that turned'
  - '[PAGE 222]


    # ON JAVA ROAD 207


    all heads in the dining room. He was among a raucous group drinking beers and
    shots of moutai—there was a bottle of treasonous Kaoliang from Taiwan on the table,
    and it must have already worked its insidious magic upon them by the looks of
    their sweating faces. Mr. Li shouted out a few jokes and stabbed the air and turned
    his gaze upon the ghost on the opposite side of the room. I heard my name, Ah
    di le. The recognition had surprised them and then delighted them. But how, I
    wondered, had they recognized me at all? Who had given me my name and an image
    of my face, and why? A wild idea formed: that the security forces had got wind
    that I was the author of the libelous article directed at their honor, the honor
    of their marvelous police force and of the government that controlled it. So,
    my fellow diners seemed to be ruminating, that traitorous author was the man who
    had been coming every day to their turf for years, and yet they had never known!
    The waitresses, caught in this strange moment, shot anxious glances in my direction,
    but for a different reason. I realized that it was fear for my safety, and by
    extension the reputation of the establishment.


    The laughter became louder and with it the jibes in Japanese accents directed
    obliquely at me. I called my waitress and asked for the bill. Before it arrived,
    however, Mr. Li staggered drunkenly to his feet and lurched across the room toward
    me carrying a teapot in one hand. He came up to my table and loudly demanded to
    know my name. He knew that I spoke Cantonese, so there was no use pretending.
    I didn''t know what he wanted or why he was annoyed with me, but then again it
    was possible he had heard from the staff that I was an unworthy foreigner who
    had insulted the'
  - '[PAGE 223]


    hardworking and patriotic officers of the law. I told him in that language that
    I was about to pay my bill and leave. At this he took the lid from the pot and
    hurled it at my head, though it grazed my shoulder on its way to the wall behind
    me, where it ricocheted to the floor. The table of men from which he had come
    into laughter again. It was an encouragement, an incitement to go further. Lifting
    the pot of tea, he grinned for a moment and then emptied the scalding contents
    over my head as I made an attempt to get to my feet.


    My arm deflected the pot itself but the tea burned my face and blinded me before
    the waitresses could throw themselves between us. The pandemonium that erupted
    was strangely muted and soon it had become a silent dance, the enraged Mr. Li,
    the waitresses, the other diners recoiling, and at its center me, stumbling toward
    the light from the windows with an unused napkin in one hand. The staff sat me
    down and the insane was bundled out of the restaurant by the manager before the
    police arrived, if they would ever arrive. Instead an ambulance was called and
    the manager put ice on my face while we waited for the paramedics to appear. Out
    on Java Road the attacker lingered with his friends, cackling and shouting until
    they were persuaded to disperse into the evening. Minutes later an ambulance came
    to take me back to Canossa, a hospital, it seemed, I was doomed to never abandon.


    THE BURNS WERE NOT severe but I stayed the night at Canossa all the same since
    they had also detected some ab-'
