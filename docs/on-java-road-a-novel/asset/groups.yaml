    # SIX


    WHEN I GOT BACK TO NORTH POINT THE STAIRWELL at the Garland was filled with an
    aroma of steaming sea bass and chives, and the walls were clammy as if they had
    turned into something organic and begun to sweat. From inside the units came bursts
    of martial music mixed with Mandarin variety TV shows. It was as if they had all
    turned up the volume of their sets to block out the exterior world. As I fumbled
    for my keys I sensed an eye tracking from inside one of those doors. The gwailo,
    the white ghost, as they called me, was home and he had not been home all evening.
    Instinctively I locked the door from within with both security chains, which I
    never normally did, and took a bath with the help of a bottle of rum.


    Even in my bath, however, I could still hear the demented TV sets. Something had
    set them off, in the way that crows or dogs are set off. The tenants stirred.
    I found to my surprise that it was the first time I had ever noticed. I didn''t
    know them and obviously they didn''t know me. We all knew that we might be spied
    on by tenants hired by the security services. The walls were little more than
    paper; any ear pressed to them would be as effective as a bug. After all, I'
  - '[PAGE 127]


    # 112 LAWRENCE OSBORNE


    myself could hear the strains of the TV series Wo men de shi nian in the room
    next to mine, and I had no idea who was in that unit. I was half-sure that I had
    seen an old lady standing by its door one day with her keys. But it had been long
    ago. Yes, it was certainly Forty Years We Walked. I had watched it once on a flight
    to Xi’an. It made me smile to hear it through a wall. But at the same time it
    did not feel as coincidal as it should have felt. It felt as if it were directed
    at me specifically.


    Still in the bath, I called my jilted editor at his hotel and apologized for my
    disappearance. A sudden attack of nausea, I explained, coupled with an inexplicable
    weakness in the legs—all the recent stress had been getting to me.


    “You’re full of shit,” Strick said. “I saw you with a girl. But we’ll get on it
    this time. I was just about to call you, actually: I need you to go to the hospital
    where they’re holding the kid who was shot tonight.”


