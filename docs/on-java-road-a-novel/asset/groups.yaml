    “What do you mean, where?” Jimmy said without looking at me.


    As we climbed aboard he said that there didn’t have to be a where on an outing
    like this, there had to be room for improvisation.


    “We’re going to pick up Rebecca at Cape D’Aguilar and then head out into the unknown.
    So many islands, so little time. We have lobster and Cantopop. It’s a heady and
    slightly nauseating mixture.”


    Inhabited islands: it was very much his style. The screwdrivers came when we were
    seated at the back with the fishing rods, shaded by an awning, and the iceboxes
    had been opened. They were filled with glass jars of black caviar and pots of
    crème fraîche. Tom put Wong Ka Kui on the sound system and we went out to sea
    away from the terrestrial heat and cement. I got through three screwdrivers and
    crackers with caviar. Soon we were skimming the green fringes of Lamma and into
    a mild and pale sea populated with little islands whose names neither of us could
    remember. I knew Beaufort Island, however, and the Tai Tam Tam headland opposite
    it. We motored between them with the music blaring, turning toward Cape D’Aguilar
    and wild rocks agitated with surf. Its hillsides carpeted with metallic jungle
    and bathed in sea mist, with the lighthouse at its summit lit by the sun. At a
    small bay called Hok Tsu Wan we threw anchor and waited for Rebecca to appear.


    Sunbathing, drinking at a good pace, we looked down at pearl-spot chromis glittering
    in silent gangs while changing our drinks to hard martinis. It was Jimmy himself
    who now manned the bar, and he made his drinks recklessly strong. He danced as
    he mixed, moving from one espadrille to the other, as if his mind was elsewhere
    in place and time. The cove sheltered from the wind that day and I could hear
    the cicadas rasping in the trees above us. It was enough at that moment to fill
    me with contentment; I didn''t need to wonder what was inside Jimmy’s mind. My
    own mind was confused enough. “There is no confusion like the confusion of a simple
    mind,” as Fitzgerald once wrote, and seemed to describe me perfectly in those
    moments. I was there, I supposed, to act as a buffer between them, to grease the
    wheels of their affair, to provide relief from awkwardness—it could have been
    any of these, or all of them, and it would have amounted to the same marginality
    for myself. I didn''t mind at all. One likes to be of service to a friend. And
    you need the moments when life comes to a standstill, becomes pure activity, and
    the unconscious climbs back into the driver’s seat.


    The sun was at eleven o''clock as I looked out over the bay. No one passed here
    because the entire Aguilar headland was a marine science reserve owned by the
    Swire Group. There was a building for the scientists and nothing else, though
    visitors were in theory allowed into the reserve. It was bare under a blinding
    sun and its twisted vegetation did not move in the wind. To amuse himself, Jimmy
    threw down scraps of cured salmon to make curious damselfish come in closer, and
    while he was absorbed in this boyish task he asked me if I ever thought about
    retiring from journalism and taking up another profession. I said I would probably
    retire the following day if I could. He gave up on the fish, turned slowly on
    his back, and let the sun strike his oiled face, as if he needed it after a long
    period huddled in restaurants, bedrooms, and boardrooms.


    “I could have gotten you into the real estate business, comrade. It’s soulless
    but relatively easy. I still could if you need a new career. I have some beach
    houses in Shek O we can turn for a quick profit. People are trying to sell and
    move to the U.S. but all we have to do is wait a couple of years and the market
    will return. My father-in-law has the connections.”


    “Perhaps. It’s tempting, even if I’m resigned to scribbling the rest of my days
    away.”


    “Are you? I’d say it was a shame, if you asked me. There’s a million things you
    can do with your life other than that bullshit career.”


    I grimaced. “I’m well aware.”


    “But you don’t dare to try something else. You’re smarter than that, Adrian. You
    always had an A-one mind. Frankly, I was surprised you went into the media. It’s
    a circus of minor talents.”


    “I had my reasons.”


    “Once, of course. But who am I to talk? I’m even more of a fuckup than you are.
    And more of a prisoner.”


    But his tone was level, studiously carefree, as if it didn’t matter much to him
    now. Yet he still felt the need to talk about it.


    “I doubt it,” I assured him. “In some ways neither of us is a prisoner. We’ve
    done quite well for ourselves. We didn’t become translators, at least.”


    This was good for a shared chuckle.


    “Thank God,” he murmured. “Though I could have been the world’s wealthiest translator.
    There’s a thought.”


    “Yes,” I conceded. “By the way, I wanted to ask you: Why are we meeting Rebecca
    all the way out here? You’ve already been seen together in town. Isn’t it a bit
    late to be playing hide-and-seek?”


    “Indeed it is. But all the same, it seems word getting around a bit too much.
    I was a bit of a fool letting that happen. I thought Duddell’s was usually discreet.
