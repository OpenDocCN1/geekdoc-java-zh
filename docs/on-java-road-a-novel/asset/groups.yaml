    出租车被绕到了西环镇（Kennedy Town）。那段向西的路程很长，在最后一排大楼之后是一片安静的岸，当我们驶过它们下方时，上面的灯光正一盏接盏熄灭，经过了马会诊所（Jockey
    Clinic）褪白的白墙和西宁街的一处小公园。对面是一间简陋的停尸间，但我让司机停在隔壁的巴士站内，那是中商码头开发项目的一部分。


    我请他在那里等我，并给了了一笔丰厚的小费，然后慢步回到同一条路上的停尸间。门口站着两个差警（po-po），我知道他们通常并不驻守在那里。当我出现时，作为一个窥视打探的外国人，因此是一个不受欢迎的形象，他们明显地紧张起来，并对我的身份大大其词。然而，我的身份并无太大影响。看到我戴着记者证后，他们断然拒绝让我进入现场。我用英文提出的一个很远的问题并没有得到回答，但我用普通话和他们交流，其中一人说得很流利。我因为那些劣质酒还有些微醉，感到自己的傲慢在升起。我坚持在台阶上向他们抛出几个尴尬的问题，说我知道早些时候有个女孩来过停尸间，我有兴趣见见她。那两个人叫来了一个高级警官，他推开玻璃门，对我大吼道让我退回街道上。他也要求看我的身份证，就在那时我意识到我可能许犯了一个小错误：我的名字现在会被记住。他想知道我是谁，这又关他什么事？对此我并给不出什么回答。


    ## 爪华道 131 号


    “那你就滚蛋，”他用英文吼道，挥舞着拳头，像中世纪战场上的战锤一样。


    我走回码头大楼，穿过无人值守的大门来到码头，心想自己确实犯了错，但不是什么巨大的失误。然而，我感到不安、不确定。月光下海面平静，一如既往，散落的岛屿笼罩在雾中。我坐在码头上，抽掉了一根薄荷味的香烟，思考着那三个警察的行为——他们的职责是阻止人们进入公共设施，却竟然用出如此难听的话语。他们的反应让巴华（Bawa）关于吉米的故事更有可能是真的，尽管几乎没有任何证据证明相反。正如中国人所说的，他无疑是所谓的“走生仔”（zau
    san ngai），处在困境中，字面意思是“从头到脚蚂蚁乱爬”。除此之外，我无法说他做了什么，或者他是如何卷其中的。有钱的人行事的方式与我这样的人所能完全不同。在这座城市巨大的珊瑚礁中，他们像章鱼一样移动，知晓许多我只能推测的洞穴和缝隙。尽管如此，你总是假设如果事情足够重要，你就可以向朋友询问任何事。


    接下来的几天，带着这个念头，我定期给吉米打电话，却发现他的语音信箱一直开着，并被用来屏蔽他的行踪。这似乎证实了巴华的暗示。至于瑞贝卡（Rebecca），她从未给过我号码，我没办法联系她。吉米本人似乎躲迹了半山山（Mid-Levels），也许是被他的家人隔绝了。这不像他的作风，他不回电话是很不寻常的。然而三天后，我得知他在春鹿（Spring
    Deer）吃完饭后的晚上办了一场派对。据说香港最富有的、名字极佳的李嘉诚（Li Ka-Shing）也在场，还有吉米那位令人畏的岳父周正（Rodney Chow）。又一次，这只是传闻，我觉得那甚至不是真的。那甚至可能是来自巴华本人为了刺我而散布的虚假信息。尽管如此，这促使我去寻找吉米数不胜数的朋友和关联，看他们是否会透露一两个风声。结果，他们显然被宣誓要保密，在这种情况下，他们显然没有漏掉任何线索（注：此处逻辑应为他们显然被买通了或守口如密）。


