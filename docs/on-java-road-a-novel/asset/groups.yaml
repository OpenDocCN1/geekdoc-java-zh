    return to London. This is no place for a gentle soul like you, and perhaps you''ve
    served your time.”


    At last moment I realized it was too late to ask him whether Rebecca had died
    accidentally or if there had been a design behind it. Not his design necessarily,
    but a design all the time. But I knew he would not speculate even to me. Why would
    he? He had already said that it had had nothing to do with him. Reading this impasse
    between us, he turned without a further word and strode back to the man in white,
    who rather feudally was holding out a heated and rolled wet towel on a silver
    dish. As the launch pulled out from the jetty and into open sea, he raised a glass
    to me from the gloom of the deck shining with polished brass and I caught faint
    whiff of music, an old song of Roman Tam if I was not mistaken. As I walked back
    to the Heritage I found to my surprise that I even knew the words.


    ## FOURTEEN


    IT WAS MANY YEARS UNTIL I SAW JIMMY AGAIN. MY London life, when I rejoined it,
    was exactly as I had had imagined, only worse. I bought a small studio in Battersea
    and made peace with the idea of living a life as different from my Hong Kong one
    as I could stomach. There was the problem of growing old as well. Except that
    I didn’t experience it as a problem. I still had my W. W. Chan suits and my dictionaries
    and I now had time to complete the translation of “The Exile’s Letter,” that fever
    dream devoted to the mysteries of friendship. I had enough funds to get by and
    from time to I was invited to give those lectures at the National Liberal Club
    that I had always meant to deliver.


    But my life was still just as indistinct. I took to making nostalgic day trips.
    From Battersea I walked across Chelsea Bridge to Victoria and took the local Brighton
    train, as I used to do as a child with my father. Now I would go down as far as
    Hassocks and then return without leaving the station, passing over the viaduct
    at Balcombe and staring down at the fields and hedgerows that had once been mine
    but now represented a past even more completely lost than the landscapes of Hong
    Kong. Even here there was nothing to hold on to. After an absence of three decades
    no one knew lived there anymore. I was as much of a gwailo here as I was in North
    Point. I would never have expected to find “The Exile’s Letter” to be so true
    to my own life as it now became, but perhaps I should have expected it. Walking
    back across Chelsea Bridge after nightfall on my return home I became lost in
    the kind of reverie that I had managed to avoid for most of my adult life. The
    bridge of St. John’s under the same moon during the first term when I was struggling
    with these lines:


    > *Till we had nothing but thoughts and memories between us.

    > And when separation had come to its worst

    > We met, and traveled together into Sen-Go

    > Through all the thirty-six folds of the turning

    > and twisting waters;

    > Into a valley of a thousand bright flowers...*


    In the end neither Jimmy nor I had been able to improve on that for the simple
    reason that nobody had ever been able to. So it transpired that the only thing
    that I had truly enjoyed in the intellectual domain of my life had turned out
    to be the thing at which I had most completely and utterly failed.


    The club did, in the end, ask me to deliver a lecture devoted exclusively to the
    problems of translation regarding “The Exile’s Letter.” Afterward there was a
    dinner in the club’s majestic dining room with a hundred attendees, many of them
    old-timers from Hong Kong who, like me, would never be going back. The grayheads
    in our final days of-right slumber. But the atmosphere was jolly. There were many
    speeches and the food did not matter. I tapped a wine-glass, stood before them,
    half gone on the house claret, that “The Exile’s Letter” was the greatest single
    poem about friendship ever written outside of Homer and that my lecture would
    proceed at our tables at my own request—for what could be more fitting to honor
    the spirit of Li Bai to eat and drink while listening to it?


    I recounted the famous story of his death at the age of sixty, which Jimmy had
    recalled for me as we were crossing the bridge of St. John’s all those years before.
    Falling into a river during a party while trying to seize a reflected image of
    the moon, that celestial body forever associated with his work. It may or may
    not be true. But as I spoke I began to feel a presence that did not correspond
    with my perceptions. It might have been the claret or the heat in the dining room,
    or perhaps the presence of Li Bai’s ghost. Either, I was sure that a voyeur had
    crept in to watch my performance from a distance. It made me fumble my lines and
    look around the room for clues, though I could only see faithfully inquiring eyes
    and the waitstaff standing with a monumental gravity by the tables. After my lecture
    had been concluded I sat down again drenched in sweat and there was awkward applause,
    as if my audience, too, could feel that I was disturbed. One of the moderators
    leaned over quietly and asked me if I was all right.


    “It’s just the heat in here,” I said. “I’ll settle down.”


    “Why don’t you go outside for a breather?” she suggested.


    “All right,” I said, gathering myself. “Hold my dessert.”


    ## ON JAVA ROAD 231


    I got up with some difficulty and went outside to the great spiraling marble staircase
    that plunged down to the club''s lobby. The air was full of Victorian dust and
    the oil portraits on the walls had acquired nocturnal pallor, which matched the
    stained-glass heads of Gladstone and colleagues that glowed on the ground floor.
    The icons of a disappeared civilization. The spiral was so precipitous that it
    was hard to see anyone rising or descending below, yet as I leaned over the polished
    banister I caught sight of a man in a houndstooth suit lining severely and beating
    what appeared to be a hasty retreat. I was sure in that moment that had slipped
    out of the dining room and so I followed him down, ready to call out Jimmy’s name
    in that funereal silence. A scarface and a cripple wounded by the same city. But
    on the floor below he had waited for me. It was only near the ground-floor lobby
    itself, filled with a party of members, that he paused for a moment, relented,
    and turned on his good foot to face me. His face had aged and he had lost the
    gladsome tilt of his hips. Yet the offhanded amorality was still in the eyes,
    with the knowledge that at the very last moment I would not have the guts to hunt
    down. It was better that way. He instead smiled and flicked a salute with two
    fingers against his temple as to say “Nice lecture, comrade.” And then he was
    gone, slipped away through the crowd and out into the dusk of Whitehall, where
    the bells were ringing, though course not for him.

