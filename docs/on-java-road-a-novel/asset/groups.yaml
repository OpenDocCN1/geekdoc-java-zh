    # 咖啡路 101


    再来一杯。这时我注意到她涂的是那种不会沾在杯缘上的口红。


    “我从来不怎么喝酒，尽管你觉得我是那样的。事实上，我有点讨厌它。”


    “是吗？”


    “这是一种习惯。”她若有所思地停顿了一下。“我们会有这么多毫无意义的习惯？”


    我们碰了碰杯，辛辣的金酒酒味直冲鼻腔。

    “我不知道，”我说，“因为这很容易。”


    “就像你住在嘉兰酒店（Garland）一样——你一定喜欢那里是因为那是一种习惯。就像你上次提到的，习惯了某种生活方式。”


    我说那像一把你坐了就停不掉的旧扶手椅。就像香港的一些老戏院，人们不由自主地走进去，只为寻觅一个早已消逝的时代。比如我附近的胜利华剧场，周日晚上会有粤剧表演。


    “你知道胜利华剧场吗？”她说，我确信她带着了一丝微笑。“我小时候，我父母常带我去那里。”


    “它就在我所在的皇大道（King’s Road）转角处。”

    “我知道它在哪儿，艾德里安。我喜欢你知道它。你是粤剧迷吗？”


    “我喜欢那些鬼魂。”


    “大家不都喜欢吗？”


    她双手撑在吧台上，左手戴着三枚戒指，右手的指甲涂成了深朱砂色。


    “那你楼下那个朋友呢？”她说。


    他会没事的。他可能已经回家了。我应该下楼去确认一下吗？


    # 102 劳伦斯·奥斯本


    “不，因为那样你就不会再回来了。”


    “你想要我回来吗？”


    “我为什么不想？”


    我说这由她来决定。接着我又问道：“吉米（Jimmy）呢？”


    “他怎么了？他今晚没打电话。他不是我的男朋友，如果你以为是我的话。那不可能。他只是我的消遣。”


    我笑了起来。“就是这样吗？”


    “你知道印度人怎么称呼‘无所事事’吗？叫消时间（Doing pass time）。”


    “你居然知道他们有专门的词！”


    “这和无所事事不一样，懂吗。”


    她嘲讽地看着我，然后说：“吉米，你知道的，他用他那扭曲的方式喜欢你。他很扭曲，你是知道的。如果你对我调情，他可能会把你喂给猪吃。或者喂给金鱼。”


    *太老了*，我已经在想了，艾德里安，这不是你的游戏，你赢不了的。这仅仅是一场消遣之，尤其是对她来说。


    我说：“也许我们不该谈论吉米。”

    “我也讨厌谈论他。我喜欢和他聊天，但我讨厌谈论他。关于你也是如此。”


    “你也会那样吗——谈论我吗？”


    她反驳得很快，说没有，他们没那样做。不是那个意思。但当然，她确实会。


    “让我困惑的是，”我说，“是为什么你要和我们这个年纪的男人混。我真的不理解。你有很多同龄的帅哥。”


    # 咖啡路 103


    “吉米五十岁了。我假设你也差不多。在香港，这种年龄差并不起眼。我们不像你们这些西方人对这很神经质。事实上，在你提起之前，我并没怎么想过这件事。”


    “那么我很抱歉提了。这看起来有点愚蠢，不是吗？”


    “你比这心里清楚，你在这里住了很久。但你被原谅了。反正你们看起来都比年龄年轻。”


    接着我问她对离开中国会馆（China Club）去散散步怎么看。现在晚上，穿着西装打领带，穿着真正的连衣裙，为了一场不再演出的歌剧而盛装打扮在外走，是极其危险的。


    她说这是今晚最棒的主意。我说如果她喜欢，我们可以穿过邻边的乍园（Chater Garden）——今晚相对平静。我们可以走路散掉即将到来的宿醉。


    “为了两杯金忌露（gimlets）？”


    “你是酒量浅。”


    转瞬之间，她变得着迷了，但我推测，并不是因为我。


    我们下楼来到门厅，那里实际上是一个中国艺术家的画廊，作品挂满了墙壁，我向向餐厅室内看史里克（Strick）在哪里。他留下来喝着他的酒，和邻桌的几个显然他认识的人聊天。当丽贝卡我和等电梯时，我请一名员工在我们离开五分钟后去找史里克，并解释我缺席的原因。我觉得身体不适，决定回家。我用老办法给了那个男孩一点小费。


    我们独自下楼，来到中国银行两尊石狮之间的德辅运道（Des Voeux）。那条有着弯曲电电线的路在汇丰（HSBC）大楼压倒性的存在下显得空旷，而在对面，乍园那充满夏日的树木沐浴在橙色的光芒中。我们穿过新古典主义的法院建筑，没入长满中国扇棕的花园。


    那里长长的L型水池如果多年没有打扫干净，就会落满枯叶，路径沐浴在周围大楼巨大的灯光秀中。另一座新的中国银行大楼，白色的霓虹灯节奏地闪烁，而汇丰大楼将巨大的红白竹叶图形投影在周围的黑暗中。我不知道自己为什么叫她去花园散步，这个决定并非完全是有意识的。当警察车散落在乍大道时，那个小公园可能会很安静。我早些见过他们闪烁的灯光，果然，当我们下楼时，他们还在那里。事实上，在德辅运路上，一些由连根盆棕榈树组成的奇特临时路障散落在垃圾袋和各种杂物中，旨在阻挡交通——这几乎完全成功了。只有几个戴着防毒面具、拿着标志性伞的青少年在安静中溜过。在花园里，英国人带来的橡胶树早已垂下无数气生根，在路径中间，中国冬青树在我们经过它们下方时，向我们的头顶投下了一片粘稠的阴影。


    丽贝卡解释说，她和吉米有时会去她家人在山顶拥有的一栋房子，那是她父亲为了自己使用建造的一座小别墅。与此同时，她逐渐淡化在记忆中。那里有些东西让我想起平静。她说她父亲对此教训过她；她母亲则陷入了绝望的无奈。他们当然在抽象上理解这些问题，但他们无法接受她的选择。因此，父母与孩子之间达到了僵局。


    “对我个人来说，我并不那么在意，”丽贝卡说，“如果你问我的话，这座城市已经结束了。它正在我们周围消失。十年后，它将变得无法认认。只是另一个无名的城市。”


    我说那是最令人伤心的：她这一代的离开。一个新的流离族群将会产生。“但也许这座城市终究是一场幻觉，”她说。它从未打算持续下去。我不知道等我老了是否会回来想起你和吉米。为你们点上香。


    “请务必这样做。作为灵魂，我们会感激的。”


    “你也会为我做的，不是吗？”


    “我比你至少大二十五岁。这是不会发生的。”


