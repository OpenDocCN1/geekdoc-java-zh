  - '[PAGE 69]


    "Not me," Jimmy said. "I’ve got nowhere to go."


    "What do you know about the curfew?" Rebecca asked

    Jimmy.


    "I heard about it last night at a poker table. True story.

    The government minions are leaking it everywhere. Beijing

    gave them the order, they say."


    "When did they *not* give the orders?" Rebecca said.


    Jimmy said, "They might not do it. After all, a curfew

    would be an incredibly stupid thing to do. And that," he

    sighed, "is why they will do it."


    It seemed to me that something deflated in Rebecca. Her

    mood became listless, or just disinterested. We went upstairs

    afterward to the second-floor bar, which was more crowded

    than the restaurant. We was a hangout for the groomed and the

    rich: people with much to lose. There was an outdoor terrace

    filled with capacity with young locals in Armoury suits and

    drenched in humidity. I used to look at them with a measured

    envy, these beauties of the terrace, but now I just felt sorry

    for them. What future did they have in the new order that

    was coalescing around them? They’d still be rich, but they

    would be marooned as far as their other liberties went. They

    shown no signs of anxiety, however. It was a stifling night

    and the small-production gin flowed. We couldn’t hear any-

    thing from the streets nearby. Queen’s Road Central was si-

    lent, the Landmark was closed. The lanes that ran upward

    from Queen’s Road were no longer thronged. The previous

    age had seemingly ended, and its more obvious street-level

    revel had finally dispersed. We went outside and Jimmy ex-

    cused himself to go to the bathroom. When I was alone with'
  - '[PAGE 70]


    Rebecca, she turned to me and asked if it was true that I had once been married
    and that I had lost all my money gambling in Macao.


    “Is that what he told you?”


    She smiled behind a raised hand.


    “He did. But perhaps he was pulling my leg,”


    He had been, so I resorted to irony. “No, it’s all true. I had an illness and
    I had to lose all my money to find the cure.”


    The bright eyes revealed a moment’s incredulity.


    “And now you live in the Garland building?”


    “I know you don’t know it. But yes, I’m planning to die there, too. I can’t think
    of anywhere better. Perhaps I’m a bit lazy by nature, or else we are all. We find
    a good spot and then we are loathe to leave it. It takes so much energy to get
    up and leave. Besides, I don’t think I could adapt to a Western city now. London
    would be the end of me.”


    “It’ll sound sad in the papers.”


    She said it in Chinese and I had to admit it sounded quite appealing. London is
    the end of a returning Englishman.


    She went on, “So it’s too late to go back to the UK? Many of us might be going
    there, as I’m sure you’ve heard.”


    “For me home is here. I used to think one could pack up and leave toward the end
    of one’s life. But it’s not like that. Without knowing it, you cross a line and
    wake up one day and find that it’s too late to go back. I used to think it would
    be my fiftieth birthday, and I crossed that line already. It’s a sort of weariness.
    You think, ‘What does it matter where I disappear? Hampstead or Mong Kok here
    in Hong Kong—what can it possibly mat-'
  - '[PAGE 71]


    ter?'' And because you are in fact already in Mong Kok, or wherever it may be,
    you just coast along and die in Mong Kok. And no one is going to care where you
