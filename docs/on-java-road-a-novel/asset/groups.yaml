    ## 168 劳伦斯·奥斯本


    被交出，用他的话说，所代表的风险对于香港人来说并不完全相同。那是我的一场虚张声，但似乎奏效了。


    “那是贿赂，”他戏弄地说道。

    “我会说那是个误会。”

    那时，他并不像看起来那么顺从。


    “告诉我关于那个女孩的事，”我说，开始出汗，双手也失去了控制。“不急，你慢慢说吧。”


    我又点了几杯咖啡。他说话得很流利。那个女孩是个溺水者。她被带进实验室，他们对她进行了检查。她去世只有两三个小时了，在水里泡了一个小时。作为解释，警察告诉他们，她在瀑布湾（Waterfall
    Bay）和波角咀（Pak Kok Tsui）之间半英外的海面上漂浮被发现。她穿得不整齐，下半身只穿了内衣。然而，完成尸检的人并不是他。那是另一位医生。但后来，那个医生私下告诉他，虽然女孩是溺死的，但她极有可能在之前也遭受了侵犯。这位医生确定，她在被投入水中之前就已经失去了意识。她的血液中含有氟哌啶类药物（droperidol）。在她的身上发现这种药物很奇怪，因为它通常被用于抗焦虑特性。然而，高剂量药物可作为终末期患者的镇静剂，当人们想要抑制她的�躁症时。


    这种药一定被用来镇静她了，因为她血液中的浓度高得惊人。太平间值班的同事告诉他，他接到指示填写表格，将自杀列为死因，并就此作罢。这可能就是老王（Wong）被撤出尸检的原因；他们不希望有任何异议。老王的同事填了表格并签了名，因为归根结底谁不想过上平静的生活呢？之后，那位同事向老王说了他的真实想法以发泄胸中。但话又回来，她几乎不是他们见过的第一个，也不是他们听过传闻的第一个。对于医生们来说，他们只是每晚被抓捕并带往高安全收留地的抗议者。这些收留设施内部发生了什么他们无法说。他的同事并不太在意，但他，老王，很在意。他说自己并不政治化，但他很在意。


    我那时察觉到，他跟我说话不仅仅是为了钱。他可能不在乎我的“事业”，但他的良心在困扰他。是因为这个吗？所以他并不像我最初假设那样愤世嫉俗。“也许事情变得有点疯狂，”他继续道，“也许警察并不介意这样。这能让他们发泄挫败感。”无论如何，这绝不是随机的。传闻说，他们正在逮捕学生，并“挑选”出他们认为是坏蛋的那些，因为他们对每个人都有档案。因此，他们完全清楚那个女孩是谁，以及她为什么会出现在街上。她在哪里被抓的，他没说。但是，我追问他，到底为什么唐强（Jimmy
    Tang）会先于任何人都被传到太平间？


    他踉踉跄跄地说道：“我——我恐怕无法给你提供一个理论。也许他的家人和警察有某种默契，他们想让他知情，或者让他避开报媒体。你清楚这座城市是什么样的。”


    “我想，那是我唯一知道的事。”


    碎片在我脑海中开始拼凑。可怕的唐在女孩死亡的消息传出之前，就被显然认识的警察传到了太平间。直到我再多想一会儿，他的参与才毫无意义。有没有可能是他参与了她的失踪？他确实摆除了一个令他尴尬的人、眼中钉。也许他是在对峙期间，在警察手下意外死亡的掩护下做到的。这种做法太奢侈了，但对他来说倒很方便。


    我想，那是我唯一知道的事。


    也许如此。我回想起他在32号的暗示，他是想勒索我。那时我不信，我想，他也不信。但现在我开始考虑这可能是真的。困惑在我心中涌起。整个社会似乎在摇曳并开始瓦解。你可以说，我们都在陷入这种偏执之中。因此我，以及每个人，都会变得偏执。这种偏执并非个案。


