    door and a display case with a single suit modeled inside it. But within the gentlemen’s-club-style
    room with its padded armchairs Jimmy was already present in a sharkskin suit talking
    with his cutter. We were the only ones since business had worsened, and Jimmy
    turned on the charm to make me feel less awkward.


    “You know Adrian Gyle, don’t you?” he said to the tailor.


    “He’s one of the world’s most famous journalists. Or so he says. I believe you
