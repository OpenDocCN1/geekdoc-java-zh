    ## 24 劳伦斯·奥斯本


    在阳台上。接着，他突然出现，身上穿着一套他精美的 W. W. Chan 西装，那是一件 Dugdale Lisburn 亚麻布制成的米色鱼骨纹西装。优雅感在他身上是自然流露的。他向我投来意味深长的眼神，看出我注意到他正想显摆他的打扮。


    其他人大多是认识他父亲的男人，他们喜欢低声而愤世嫉俗地聚在一起，喝着吉米准备的 Domaine de Montille Volnay 诺伊第级红葡萄酒，这些酒在享用前已经醒酒了一个小时。他们的观点大多亲亲的，是吉米口中的“稳定维护者”。他们中许多人在上海和深圳有公司。像太昌或何氏家族一样，他们清楚北京的老板们给面包的哪一面涂了黄油。与此同时，他们也知道如何让自己听起来既有爱国情怀又理性，在资本主义上适中。他们曾痛恨共产主义；现在却认为那无关紧要。然而，在历史命运奇特的转折中，他们现在正带着含蓄的赞同引用西方左翼人士，因为在那些左翼眼中，关于
    CIA 干预中国的阴谋论和对帝国主义的仇恨自然是次要的。这些理论恰恰符合这些寡头 way人的财务利益。这种表演我已经听过很多次：外面，在城里，年轻一代正在毁掉他们的天堂，他们怨恨被自己的孙辈称为“通敌”和“叛徒”，在孙辈眼里，是他们建立了这座城市，而不是那些不知感激的后代。


    但随着酒越来越醉，他们的脾气也发了，开始回忆起往事。他们的家族通过血缘和生意联系在一起，分享着许多轶闻。


    有趣的叔叔、疯狂的大姨妈、曾经优雅如今却落魄了的堂兄弟表妹，以及多年未曾露面的家族守财奴。世家财富像巨型古树的汁液一样流过他们身上。我坐在角落里听着他们聊天，抿着属于我的那份吉米窖藏，这一切持续了一段时间，我想他们什么时候才会全部回家，留下吉米和我在这王室般的氛围中独处。


    当这种情况终于发生时，他们走得相当仓促。留下吉米的一位法国朋友，我以前见过，他参加聚会时总是穿中国风，据报道他为梅丽莎销售艺术品。奥利维尔·梅茨穿着丝绸外套和白色袜子，看起来像个清朝的廷臣——他在商场里会那样穿吗？——他主座了一会儿，告诉我们，那些呼吁独立和解散警察部队的人应该记住，香港所有的水都要从中国大陆购买，那些活动分子无疑没能拿出一个严肃的水资源计划。他们是天真的傻瓜和乌托邦者。


    “毁掉几个火站很容易。但当水龙头干涸时，他们怎么办？”


    “那仅仅是为了破坏而破坏，”梅丽莎傲慢地补充道。


    “在我看来，”奥利维尔继续说道，“那是在西方宣传下长大的一代。没人能对此做什么，因为那是年轻人赖的媒体。他们甚至不知道自己在拆解什么。”


    “但等一下，”吉米说，正准备取他妻的趣，“我们买那些水付出了昂贵的代价。而且被中国强制把多余的水倒进海里，因为我们不允许储存。这简直是个圈诈。我们还应该对此心存感激？”


    “那你更想从哪里买水？”法国人说。


    “既然你这么问，我宁愿从台湾买。他们多的是。你觉得呢，艾德安？”所有的目光都转向我。

    我们的这位朋友每天报道抗议活动。他比我们了解得得多。


    “完全不是，”我说，“我是这儿的外国人。”


    吉米并不完全认真地说：“你们英国人是香港的创始人。这很反常，但你们不仅有权发表意见，而且……”


    （注：原文在此处似乎中断，根据翻译要求，已对提供的文本内容完成翻译。）

