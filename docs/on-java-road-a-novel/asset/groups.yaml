    diverted the taxi to Kennedy Town. It was a long ride out west to the quieter
    shore just beyond the last of the tower blocks, whose lights were going off one
    by one as we passed below them, past the faded white walls of the Jockey Clinic
    and the little park in Sai Ning Street. Opposite it lay the modest mortuary, but
    I asked the driver to drop me off inside the bus station next door, which was
    part of the China Merchants Wharf development.


    I asked him to wait for me there for a good tip, and walked slowly back to the
    mortuary on the same road. At the door were two po-po, or police, I knew were
    not usually stationed there. When I appeared, a snooping foreigner and therefore
    an unwelcome vision, they tensed visibly and made a fuss about my ID. My ID would
    not have made much difference, however. Seeing that I had a press badge they categorically
    refused to let me enter the premises. A far-flung question in English was not
    going to be answered but I I spoke to them in Putonghua and one of them spoke
    fluently. I was still a little buzzed from the bad wine and I felt my insolence
    rising. I persisted in throwing a few awkward questions at them right there on
    the steps, saying that I knew a girl had arrived at the mortuary some time before
    and that I had an interest in seeing her. The two men called in a senior officer,
    who pushed open the glass doors and barked at me to step back down onto the street.
    He too, demanded to see my ID and it was then that I realized I had perhaps made
    a small mistake: my name would now be remembered. Who was I, he wanted to know,
    and what was it to me? To which I couldn’t make much of a reply.


    ## ON JAVA ROAD 131


    “Then fuck off,” he shouted in English, waving a fist like a mace on a medieval
    battlefield.


    I walked back to the wharf building and went through the unmanned gate onto the
    jetty, thinking that I had indeed made an error but not an immense one. Yet I
    was uneasy, uncertain. The sea was calm under moonlight and as ever the scattered
    islands in their haze. I sat on the wharf and wore down a Hint of Mint cigarette,
    thinking over the mannerisms of the three policemen whose duty was to prevent
    entry to a public facility with such bad language. The way they had reacted made
    Bawa''s tale about Jimmy more likely than not, though there was hardly any proof
    one way or the other. As the Chinese say, he was certainly zau san ngai, in the
    shit, literally “crawling from head to toe with ants.” Beyond that I couldn''t
    say what what he had done or how he was involved. Men with money move in ways
    very different from the ways available to someone like myself. In the great coral
    reef of the city they moved like octopuses, knowing caves and niches that I could
    only guess at. Nevertheless, you always assume that you can ask a friend anything
    if it''s important enough.


    FOR SEVERAL DAYS, with that in mind, I called Jimmy at regular intervals only
    to find that his voicemail was perpetually activated and being used to screen
    his whereabouts. It seemed to corroborate Bawa''s insinuations. For Rebecca, she
    had never given me her number, and there was no way of reaching her. Jimmy himself
    seemed to have gone to ground up in the Mid-Levels, sequestered by his family
    perhaps. It was not like him, and it was unusual for him not to return a call.
    And yet three days later I got word of a party that he had thrown on the night
    after my dinner at Spring Deer. It was said that Hong Kong''s richest man, the
    superbly named Li Ka-Shing, had been there, as well as Jimmy''s formidable father-in-law,
    Rodney Chow. Once again, it was only gossip and I had a feeling that it was not
    even true. It might even have been disinformation emanating from Bawa himself
    to needle me. Nevertheless, it made me to go looking for Jimmy''s innumerable
    friends and associates to see if they would slip a hint or two. In the event,
    they had apparently been sworn to omertà. Nor did I find any mention of Rebecca
    herself. Around them, out of nowhere, an almost complete silence had descended.
    It was as if, for a brief and glamorous period, they had monopolized the dance
    floor and then walked off anyone but myself noticing. I thought that perhaps it
    was due to an agreement between themselves. I could well understand the societal
    pressures they were both continually under. But then I wondered how fully I understood
    the tight-knit warp and weave of a society like Hong Kong: incestuous, gossipy,
    given to rumors and backstabbing, its money all wrapped up in a few clans, always
    ready to flee to foreign parts if the going got rough. Insecurity and a nervous
    fight-or-flight mentality plague the collective subconscious of the wealthy classes.
    “How long have we got?" they seem to be perpetually asking themselves in their
    nightmares. “How long will our happiness last?” There were no answers to either
    question so they tried hard to maintain their outward respect.


