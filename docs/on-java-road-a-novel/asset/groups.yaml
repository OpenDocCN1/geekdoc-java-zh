    他在房间里待了一分钟，然后足够冷静地离开了。如果那个女孩真的是他的亲密情人，他天生的那种矜制一定大派用用场。


    我说：“这比什么都更显得奇怪。你查到那个女孩的名字了吗？”


    “他们不肯说。我觉得不是什么贫穷的当地学生。唐家参与其中——”


    但我想说，不一定是复数形式。

    “难道不是那个赛游艇的吉米·唐吗？”莫耶斯随口插道，尽管他很清楚那是谁，以及他赛过多少艘游艇。“他们不是管他叫‘可怕唐’吗？而且他居然跑去太平检了？”


    我说我一概不知道。可怕唐。我听过人们用这个名字称呼他，以此暗示他臭名昭著的花心。可怕唐出现来认领一个年轻女性的尸体——这出肥皂剧简直自己就写出来了。但那可能是任何一个女孩，因为现在——但我立刻排除了可能是贝贝贝卡的想法。我昨晚还和她在一起，没有任何迹象显示有什么异常。而且，总会有迹象的。至于其他人，我在过去三四年的派对上见过几个，他们总是年轻，且渴望在这座城市令人窒息的社会阶层中晋升。现在当我更仔细想起他们时，在保持沉默的同时，过去的画面浮现在脑海。某一天深夜，在皮埃尔餐厅，吉米和他的深夜伴人在挤满房间的屋子里戴着纸派对帽向大家挥手道；一个炎热的夏夜，市中心某处的一个画廊开幕式，一个被简短介绍过、我现在想不起名字的女人，脸上涂着亮片，一周后在贝隆的一场慈善活动上偶然再次见到，在球形灯光下显得更加引人注目。


    但她到底是谁呢？我并不关注吉米的私交关系，因为那些都是头条新闻，我也很少问他私生活。然而，巴瓦并不知道这一点，显然他正期待从我这里得到一个劲爆料，哪怕是由于无意识而无意间透露的。


    但我一边观察自己的每一个字，一边说：“恐怕我无法就女孩可能是谁给你你提供建议。也许这是上流社会的事。”


    我的意思是，在这个高高在上、且对巴瓦来说充满谜团的世界里，人们有自己的规则，并会与当局达成谨慎的安排。


    他说：“是的，确实是上流社会的事。没错。这显而易见。但你对那个世界比我了解得多。”


    “唐最近没干过好事，”莫耶斯叹了口气，此时北京鸭由老练的服务员推着脚轮推车送到了。“那是肯定的。”


    表演式的片鸭仪式开始了。打开盛着热气薄饼的竹篮，分发葱段。几秒钟内，他的话题就被抛到一边，我很庆幸自己不必再对此作解释。我还能感觉到那种幸灾乐祸的欲望，想挑拨我说出什么鲁莽的话，那会被记住很久，而且毫无仁情。


    因为在我们之间，始终存在着关于更大话题的挥之不去的紧张感。我被看作是倾向西方的，而他们对中国的尊重程度远比对美国的要高得多。这是一个性格问题。他们相信中国是一个优越的理念，它的时代已经到来。


    他们从未告诉我这个理念究竟是什么，除了对中国本身感性且令人生畏的想象：美丽的悬索桥、宏伟的机场、电动出租车、6500万间空公寓、钢铁产量数据、那3亿个我们这些勇敢的记者从未见过的灵魂从绝对贫困中解救。在1938年萨里郡的晚宴上，你也会听到关于德国的同样论点：高速公路、产量数字、工人假期和免费托儿、国家化医疗保健和低犯罪率：一个在闪光轨道上飞速前进的国家。我记得读过D.H·劳伦斯描写在20世纪20年代漫走在一座德国城市，感受着空气中奇异的电能，一种明显的改变。但这种观察永远无法说服任何人。面对巴瓦和莫耶斯以及对中国领先地位的信念，我没有任何他们会接受的反驳。如果你提到任何形式的虚假贸易，他们会叫道《经济杀手手的自白》！如果你提到新疆的营地，他们会冷笑，谈论伤膝事件。无尽的虚假等同、流沙、以及奇异而固执的自我迷醉。


