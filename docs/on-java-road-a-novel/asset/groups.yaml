    # 198 LAWRENCE OSBORNE


    “We’ve never eaten there with her. She detests the place.” To stayed calm and
    tried to jog his memory,


    “It must have been an occasion that’s slipped your mind,” he tried. “You can recall
    it if you try—”


    “I recall everything, Mr. Gyle. My wife and I eat there alone. We don’t ever dine
    with friends. Rebecca, not at all. As I say, we’ve never eaten with her except
    a Christmas dinner three years ago. Now, that I do remember.”


    “I-I must have been mistaken,” I stuttered.


    “You were there?”


    “I go there often enough. I’m a member.”


    “I’ve never seen you there. But I may ask, how did you know it was us in the dining
    room? We’ve never been introduced.”


    Yet my mind was racing backward in time, to the gimlets, the odd shine of her
    skin, her lipstick left no mark on the rim of her glass. I had seen them all together,
    I was certain of it. I had taken Rebecca’s hand for a moment as we stood up from
    the bar and it had been as real as nightmares ever are. Everything had seemed
    solid and brilliant—enlivening, even—and yet all physical things might not have
    been real after all. Had I even been there the way that I thought I had been?
    How real had the walk in the park been, the taxi ride up the mountain in the dark?


    “In any case,” To went on, to move the conversation away from the China Club,
    “I’ve been meaning to have this talk with you, Gyle. I know very well that you
    and Rebecca were friends, and the three of you were on that yacht to gather. I
    found out, too, that Jimmy Tang is an old friend of yours. In the light of that,
    I wondered—we wondered, my wife and I—if you had anything to tell us about our
    daughter’s death. Or else if you know they were having an affair.”


    “I know that Jimmy Tang went to the morgue. And yes, they were having an affair.”


    “Are you sure both of those things?”


    I said I was as sure I could be. His hands tensed as if they were pulling at a
    mental rope and his eyes turned venomous.


    “That vermin. You leper.”


    He seemed to be responding to both pieces of information at the same time. I pressed
    him about their relationship and told him what I knew, which was a fair amount.


    “Rebecca and I were not close friends. Still—I feel I ought to tell you. In case
    you thought I was holding it back.


    We have the gravest suspicions about Mr. Tang, I must tell you. And he has been
    behaving strangely. He hasn’t come to see us. He won’t even admit he was involved
    with her. He’s a coward, isn’t he?”


    Aren’t we all? I thought.


    “He’s running from something,” I said. “He’s afraid.”


    To then relaxed his hands and a more resigned mood appeared to come over him.
    It was useless to keep talking about the slippery Jimmy. He said he had been feeling
    the presence of his daughter over the preceding nights; he could not sleep and
    the great trees around their house seemed unusually disturbed by winds. The security
    lights kept coming on for no reason, the chains at the gate rattled. His wife
    told him that Rebecca’s spirit was near them, she could feel it, too, and was
    certain of it. She was stalking the house and letting them know that she was there.


    Did I believe in ghosts, he asked. I said I wasn’t sure how much I believed in
    them. “Ah,” he sighed, “you’re not Chinese.” For them, he said, it was quite otherwise.
    Then he asked me if I thought his wife was well advised to seek out the medium
    she liked to visit in order to talk to her ancestors. I said I couldn’t offer
    an opinion on that but perhaps it had an alleviating effect on her emotional state.
    “Do you believe in it? In mediums? Not at all.” He was already looking placidly
    through the tinted window. “Of course I do. What do you think?” He meant that
    for him such things were not a matter of conjecture. They were as real as cement
    walls. But I wonder if Jimmy does, I thought to myself. “Where do you stand on
    that, Mr. Gyle?” I said that I stood on the side of science, of course, but that
    knew everything. “But in any case,” he said, “who thinks about science when they’re
    mourning?”


    By now we had reached Chai Wan and were circling past the endlessly monotonous
    curve of Siu Wan perfectly serving the purpose of such a conversation. We came
    to a spacious junction framed by skyscrapers and at the far end of us the mountains
    reappeared, soaring into the underbelly of the clouds. There were no pedestrians
    and very few cars. To, as if thinking aloud, said that he had been meaning to
    ask a thousand things of me now that I had told him about Jimmy’s presence at
    the morgue and the affair between him and his daughter, he found himself numbed
    and bewildered.


    “How do you know the Tangs?” I asked, trying to rekind the conversation. To shook
    his head gravely. “I’ve known his family for decades. His father is not too rotten,
    though. Believe it or not I used to go fishing with the man when we were young.
    He used to talk nonsense about fishing if it were a philosophy. I never knew what
    to say. Fishing may many things enjoyable but dumb. No doubt his idiot son thinks
    it’s a philosophy, and you probably do as well.”


    “It’s dumb even for a boy of twenty. As for Jimmy, I’ve met him many times since
    he was a child. He was always a fairly arrogant boy. I always thought he was careless
    with others.”


    “You mean he loses them like toys?”


    “That’s certainly one way of putting it.” He poured me a second glass and there
    was fatalistic melancholy in the fumbling gestures of his hands as he picked up
    the ice bucket. He told me about his visits to his friends in the upper echelons
    of the police as he had tried to glean some information about what had happened
    to his daughter. For years he had been dealing with politicians, with Beijing
    investors, with Party princes for whom he had arranged the sale of valuable properties
    through his family connections. And what he had learned was that they always managed
    to, as he put, “silence frogs.” It was a reference to the security details assigned
    to Chairman Mao’s fifty villas in the 1950s. Each villa was located in a scenic
