    Street: elsewhere were events that had to be avoided. Around Victoria Park morose
    crowds were beginning to part and go their own ways, and along a wall I saw new
    graffiti in Chinese that read, “In this life only marry a front-liner." It was
    a delicious sign that Phoenix would never stay with Jimmy Tang, not forever in
    any case.


