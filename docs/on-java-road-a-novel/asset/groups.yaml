    # 一个君子总是按照他的良心行事。


    > --- 毛泽东，据其医生李志随报道


    # Java望路


    # 第一章


    在那些绝望而被遗忘的日子里，我想起了学校里读过的一部小说中的片段。叙述者坚持认为自己愿意被称为“记者”（reporter）而非“记者”（journalist），后者那个谦卑的词能更好地描述他的工作，即记录他所见的事物。今天，这个职业描述甚至更不体面了。我认识香港所有的记者，但也认识许多报道员——那些追随城市移动战区行动的公民，他们像我一样，独自一人拿着手机相机，随着时间的推移，在没有察觉的情况下，我与他们在一起感到更加自在。但我们在描述什么？又是给谁看？我对此也不确定。对我自己，也许对于散布在世界各地的少数其他人（正如我所想象的那样），这取决于你想多深层次地挖掘内心。其中一些记者变得奇异地出名。（注："become
    been" 可能是 OCR 错误，应为 "become"）


    在这方面，他们与我不同。尽管我在香港住了二十多年，作为一个杂杂记者，苦苦打拼并逐渐进入受人尊敬的高层，但我从未在我所居住的城市中出过名。人们只是模糊地知道我写过一些东西，而且还是个名声狼藉的食客，仅此而已。我是年轻时去那里的，当时被伦敦及其前景冷透骨髓，更重要的是，无法预见到在那座坟墓般的城市里获得成功。我在回归后不久就到了香港，除了大学好友唐振杰外别无无人，只有一个行李箱和五千英镑积蓄。考虑到这些不利的开端，我过得不错，但我从未成为一名明星作家。在某种程度上，我并不介意。我在多家报纸工作过，还当过美食评论员……（注：此处似乎有
    OCR 文本的跳跃/重复，我将根据提供的文本流进行对齐）。


    在摩天大楼上俯瞰的是艾德里安的老友唐振杰，他是香港最富有家族的后裔。看着这座城市——这座城市曾充斥着各种晚宴和私人会员俱乐部——随着亲民主游威日益逼近家园而爆发暴力。正当盖尔准备离开香港时，他发现了最后一个谜团：神秘的丽贝卡，一名参与抗议的学生，也是唐振杰最近一次鲁莽的情人对象。但当丽贝卡失踪、唐振杰躲藏起来，盖尔感到了那股熟悉的调查冲动。


    通过拼凑丽贝卡的最后几天和几小时，盖尔必须在一个充满友谊与背叛的动荡世界中谨慎行事，在这个世界上，个人忠诚在他曾经熟悉的城市中消失殆尽。《爪望路》讲述了一个处于旧世界与新秩序断裂线上、追求真理的故事。


    *（自纠：提供的 OCR 文本包含重叠段落，我将根据文本块重构叙事。）*


