  md: '# LAWRENCE OSBORNE


    He got fitted at Dege and Skinner and bought hats at Lock and Co. That were, I
    thought at the time, me but which he gave me the confidence to wear. I was the
    only person in my year to own a panama hat who had the gall to actually wear it.
    I found that I didn''t know my own capital city at all, but Jimmy knew it intimately
    from a thousand Tang family expeditions. I didn''t know anything about anything.
    I had never been to a restaurant before. Never spent a night in a hotel, never
    drunk wine, never taken a black cab, never been to a nightclub or a theater, and
    had never been to any site of note except for the British Museum and Karl Marx''s
    grave in Highgate Cemetery, taken to them by my grandfather: the high-minded pilgrages
    of the working class. It would have been difficult to describe to Jimmy the scene
    with the old man, a retired bus driver from Bevdean, standing before the Dardoz-like
    head of Marx in the rain, eyes filled with tears, his arms piled with votive flowers;
    me, shivering and unmoved behind him. Jimmy Tang, scion of a family who had fled
    the Communists in China, would have quipped that at least Jewish Marxists got
    to be buried there.


    For Jimmy, my “reeducation” was a Pygmalion game, which he played with an inborn
    skill. It kept me in my place, though in a subtle and unnoticed way. And yet it
