  md: '> “Twelve years ago Hong Kong had been a very different place, sheltered as
    it felt then from the storms of history. But the storm had returned and the long-established
    security in our hearts had vanished.”


    After two decades as a journalist in Hong Kong, expat Englishman Adrian Gyle has
    very little soup to show for it. Evenings are whiled away with dumplings and tea
    at Fung Shing, the restaurant downstairs from his home on Java Road, watching
    the city—once overflowing with wine dinners and private members'' clubs—erupt
    in violence as pro-democracy demonstrations hit ever closer to home.


    Watching from the skylises is Adrian''s old friend Jimmy Tang, the scion of Hong
    Kong''s wealthiest families. Just as Gyle prepares to turn his back on Hong Kong,
    he finds one last intrigue: the mysterious Rebecca, a student involved in the
    protests, and the latest of Jimmy''s reckless dalliances. But when Rebecca goes
    missing and Jimmy hides, Gyle feels that old familiar urge to investigate.


    Piecing together Rebecca''s final days and hours, Gyle must tread carefully through
    a volatile world of friendship and betrayal where personal loyalties vanish the
    city he once knew so well. On Java Road tells the story of a man between the fault
    lines of old worlds and new orders in pursuit of the truth.'
