  md: '# ABOUT THE TYPE


    This book was set in Fournier, a typeface named for Pierre-Simon Fournier (1712–68),
    the youngest son of a French printing family. He started out engraving woodblocks
    and large capitals, then moved on to fonts of type. In 1736 he began his own foundry
    and made several important contributions in the field of type design; he is said
    to have cut 147 alphabets of his own creation. Fournier is probably best remembered
    as the designer of St. Augustine Ordinaire, a face that served as the model for
    the Monotype Corporation’s Fournier, which was released in 1925.'
