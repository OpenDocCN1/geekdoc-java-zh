    # Object Life time and Garbage Collection


    The object lifetime (life cycle) of an object is the time between an object''s
    creation and its destruction. Rules for object lifetime vary significantly between
    languages, in some cases between implementations of a given language, and lifetime
    of a particular object may vary from one run of the program to another.


    ![](img/c7ab3e310e7811a38d328b7a483bb3ba_226_0.png)


    In some cases object lifetime coincides with variable lifetime of a variable with
    that object as value (both for static variables and automatic variables), but
    in general object lifetime is not tied to the lifetime of any one variable.'
