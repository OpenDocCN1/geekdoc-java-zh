  md: '# Object Oriented Programming 199


    +   - The definition of a class is reusable not only by the program for which
    it is initially created but also by object-oriented programs (and, for this reason,
    can be more easily distributed for use in networks).


    +   - The concept of data classes allows a programmer to create any new data type
    that is not already defined in the language itself.


    Simula was the first object-oriented programming language. Java, Python, C++,
    Basic .NET and Ruby are the most popular OOP languages today. The Java programming
    language is designed especially for use in distributed applications on corporate
    networks and the Internet. Ruby is used in many Web applications. Curl, Smalltalk,
    Delphi and Eiffel are also examples of object-oriented programming languages.


    # List of OOPs Concepts in Java


    There are four main OOPs concepts in Java. These are:


    +   - Abstraction. Abstraction means using simple things to represent complexity.
    We all know how to turn the TV on, but we do not need to know how it works in
    order to enjoy it. In Java, abstraction means simple things like objects, classes,
    and variables represent more complex code and data. This is important because
    it avoids repeating the same work multiple times.


    +   - Encapsulation. This is the practice of keeping fields within a class, providing
    access to them via public methods. It is a protective barrier that keeps the data
    and code safe within the class itself. This way, we can re-use objects like code
    components or variables without allowing access to the data system-wide.


    +   - Inheritance. This is a special feature of object oriented programming in
    Java. It lets programmers create new classes that share some of the attributes
    of existing classes. This lets us build on previous work without reinventing the
    wheel.


    +   - Polymorphism. This Java OOP concept lets the same word to mean different
    things in different contexts. One form of polymorphism in Java is method overloading.
    That''s when other form is method overriding. That''s when the different meanings
    are implied by the values of the supplied variables.


