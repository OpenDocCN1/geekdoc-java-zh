  md: '# Java Is a Platform Independent Language


    To understand the meaning of platform independent, we must need to understand
    the meaning of platform first. A platform is a pre-existing environment in which
    a program runs, obeying its constraints, and making use of its facilities.


    Lets back to the point. During compilation, the compiler converts java program
    to its byte code. this byte code can run on any platform such as Windows, Linux,
    Mac/OS etc. Which means a program that is compiled on windows can run on Linux
    and vice-versa. This is why java is known as platform independent language.


    ![](img/c7ab3e310e7811a38d328b7a483bb3ba_15_0.png)


    # Java is an Object Oriented language


    Object oriented programming is a way of organizing programs as collection of objects,
    each of which represents an instance of a class.


    Polymorphism is the provision of a single interface to entities of different types.


    +   4 main concepts of Object Oriented programming are:

    1. Abstraction

    2. Encapsulation

    3. Inheritance

    4. Polymorphism


    # Simple


    Java is considered as one of simple language because it does not have complex
    features like Operator'
  merge: -1
