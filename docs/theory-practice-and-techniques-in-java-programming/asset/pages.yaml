    features support.


    The Java language is a C-language derivative, so

    s syntax rules look much like C''s. For example, code

    blocks are modularized into methods and delimited by

    braces {{ and } }, and variables are declared before they

    used.


    Variable is a value that

    can change, depending

    on conditions or on

    information passed to

    the program.


    Structurally, the Java starts with packages.

    A package is the Java language''s namespace mechanism.

    Within packages are classes, and within classes are

    methods, variables, constants, and more.


