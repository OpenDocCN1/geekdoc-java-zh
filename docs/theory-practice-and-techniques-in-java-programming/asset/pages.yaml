  md: '# Theory, Practice and Techniques in Java Programming


    # Definition


    Java is one of the world’s most important and widely used computer languages,
    and it has held this distinction for many years. Unlike some other languages whose
    influence has weared with passage of time, while Java’s has grown. It is a simple
    programming language. Writing, compiling and debugging a program is easy in java.
    It helps to create modular programs and reusable code.


    # Creation of Java


    Java was developed by James Gosling, Patrick Naughton, Mike Sheridan at Sun Microsystems
    Inc. in 1991. It took 18 months to develop the first working version. The initial
    name was Oak but it was renamed to Java in 1995 as OAK was a registered trademark
    of another Tech company.


    ![](img/c7ab3e310e7811a38d328b7a483bb3ba_13_0.png)


    # Evolution of Java


    Java was initially launched as Java 1.0 but soon after its initial release, Java
    1.1 was launched. Java 1.1 redefined event handling, new library elements were
    added.


    In Java 1.2 Swing and Collection framework was added and suspend(), resume() and
    stop() methods were deprecated from Thread class.


    No major changes were made into Java 1.3 but the next release that was Java 1.4
    contained several important changes. Keyword assert, chained exceptions and channel
    based I/O System was introduced.


    Java 1.5 was called J2SE 5, it added following major new features:


    +   - Generics'
