  md: '# Definition


    A class is an entity that determines how an object will behave and what the object
    will contain. In other words, it is a blueprint or a set of instruction to build
    a specific type of object.


    A class is a user defined blueprint or prototype from which objects are created.
    It represents the set of properties or methods that are common to all objects
    of one type. In general, class declarations can include these components, in order:


    +   - Modifiers: A class can be public or has default access (Refer to this details).


    +   - Class name: The name should begin with an initial letter (capitalized by
    convention).


    +   - Superclass(if any): The name of the class''s parent (superclass), if any,
    preceded by the keyword extends. A class can only extend (subclass) one parent.


    +   - Interfaces(if any): A comma-separated list of interfaces implemented by
    the class, if any, preceded by the keyword implements. A class can implement more
    than one interface.


    +   - Body: The class surrounded by braces, { }.


    Constructors are used for initializing new objects. Fields are variables that
    provides the state of the class and its objects, and methods are used to implement
    the behavior of the class and its objects.


    There are various types of classes that are used in real time applications such
    as nested classes, anonymous classes, lambda expressions.


    An object is nothing but a self-contained component which consists of methods
    and properties to make a particular type of data useful. Object determines the
    behavior of the class. When you send a message to an object, you are asking the
    object to invoke or execute one of its methods.


    From a programming point of view, an object can be a data structure, a variable
    or a function. It has a memory location allocated. The object is designed as class
    hierarchies.


    It is a basic unit of Object Oriented Programming and represents the real entities.
    A typical Java program creates many objects, which as you know, interact by invoking
    methods. An object consists of:


    +   - State: It is represented by attributes of an object. It also reflect the
    properties of an object.'
