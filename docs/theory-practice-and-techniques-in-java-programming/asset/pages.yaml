    It is important to understand that the Java Virtual Machine architecture does
    not support any kind of efficient array initialization. In other words, array
    literals are created and initialized when the program is run, not when the program
    is compiled. Consider the following array literal:


    ```

    int[] perfectNumbers = {6, 28};

    This is compiled into Java byte codes that are equivalent to:

    int[] perfectNumbers = new int[2];nperfectNumbers[0] = 6;

    perfectNumbers[1] = 28;

    ```


    Thus, if you want to include a large amount of data in a Java program, it may
    not be a good idea to include that literally in an array, since the Java compiler
    has to create lots of Java byte codes to initialize the array, and then the Java
    interpreter has to laboriously execute all that initialization code. In cases
    like this, it is better to store your data in an external file and read it into
    the program at runtime.


    The fact that Java does array initialization explicitly at runtime has an important
    corollary, however. It means that the elements of an array literal can be arbitrary
    expressions that are computed at runtime, rather than constant expressions that
    are resolved by the compiler. For example:


    ```

    Point[] points = { circle1.getCenterPoint(), circle2.getCenterPoint() };

