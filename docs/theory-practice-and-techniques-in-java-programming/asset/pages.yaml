  md: '# 1.2 CREATING, COMPILING, AND EXECUTING A JAVA PROGRAM


    # Key Notes


    # Definition


    The Java language is a high-level language, but Java bytecode is a low-level language.
    The bytecode is similar to machine instructions but is architecture neutral and
    can run on any platform that has a Java Virtual Machine (JVM). Rather than a physical
    machine, the virtual machine is a program that interprets Java bytecode. This
    is one of Java’s primary advantages: bytecode can run on a variety of hardware
    platforms and operating systems. Java source code is compiled into Java bytecode
    and bytecode is interpreted by the JVM. Your Java code may use the code in the
    Java library.


    To execute a Java program is to run the program’s bytecode. You can execute the
    bytecode on any platform with a JVM, which is an interpreter. It translates the
    individual instructions in the bytecode into the target machine language one at
    a time rather than the whole program as a single unit. Each step is executed immediately
    after it is translated.


    # Programming Style and Documentation


    Good programming style and proper documentation make a program easy to read and
    help programmers prevent errors.


    # Learning Objectives


    +   * Write source code

    * Compile and run your java program

    * Use the classpath


    # Definition


    You have to create your program and compile it before it can be executed. This
    process is repetitive, as shown in Figure 1.1. If your program has compilation
    errors, you have to modify the program to fix them, and recompile it. If your
    program has runtime errors or does not produce the correct result, you have to
    modify the program, recompile it, and execute it again.


    Runtime error is a program error that occurs while the program is running.'
