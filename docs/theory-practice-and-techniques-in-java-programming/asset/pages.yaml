  md: '# File and Exception Handling


    Programming errors are error situations that occur because of logical errors in
    the program, while runtime environment errors are errors over which the program
    has little control. A program must be able to handle both kinds of errors. Ideally,
    programming errors should not occur, and the program should handle runtime environment
    errors gracefully.


    An exception in Java signals an error or an unexpected situation has occurred
    during program execution. Exception handling is the mechanism for dealing with
    such situations. It is based on the “throw and catch” principle. An exception
    is thrown when an error situation occurs during program execution. and caught
    by an exception handler that takes an appropriate action to handle the situation.
    This principle is embedded in the try–catch statement. All exceptions are objects
    and the Java standard library provides classes that represent different types
    of exceptions.


    Execution in computer and software engineering is the process by which a computer
    or a virtual machine performs the instructions of a computer program.


    The examples in this chapter show how exceptions can be thrown, propagated, caught
    and handled. These examples are intentionally simplified to highlight the important
    concepts in exception handling.


    # Types of Exceptions


    Exception can occur at runtime (known as runtime exceptions) as well as at compile-time
    (known Compile-exceptions). Based on these, we have two categories of Exceptions.
    You need to understand them to know how exception handling works in Java.


    # Checked Exceptions


    A checked exception is an exception that occurs at the compile time, these are
    also called as compile time exceptions. These exceptions cannot simply be ignored
    at the time of compilation, the programmer should take care of (handle) these
    exceptions.


    For example, if you use FileReader class in your program to read data from a file,
    if the file specified in


