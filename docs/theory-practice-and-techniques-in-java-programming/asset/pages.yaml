    The advantage of private static methods is that they can be reused later if

    you need to reinitialize the class variable.


    # Initializing Instance Members


    Normally, you would put code to initialize an instance variable in a constructor.

    There are two alternatives to using a constructor to initialize instance variables:

    initializer blocks and final methods.


    Initializer blocks for instance variables look just like static initializer blocks,

    but without the static keyword:


    ```

    {

    // whatever code is needed for initialization goes here

    }

    ```


    The Java compiler copies initializer blocks into every constructor. Therefore,

    this approach can be used to share a block of code between multiple constructors.

    A final method cannot be overridden in a subclass. Here is an example of using

    a final method for initializing an instance variable:

    class Whatever {


    ```

    private varType myVar = initializeInstanceVariable();


    protected final varType initializeInstanceVariable() {


    // initialization code goes here

    }

    ```


    This is especially useful if subclasses might want to reuse the initialization

    method. The method is final because calling non-final methods during instance

    initialization can cause problems.'
