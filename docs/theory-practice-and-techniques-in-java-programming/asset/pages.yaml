    # Array Literals


    The null literal used to represent the absence of an object can also be used to
    represent the absence of an array. For example:


    ```

    char[] password = null;

    ```


    In addition to the null literal, Java also defines syntax that allows you to specify
    array values literally in your programs. There are two different syntaxes for
    array literals. The first, and more commonly, syntax can be used only when declaring
    a variable of array type. It combines the creation of the array object with the
    initialization of the array elements:


    ```

    int[] powersOfTwo = {1, 2, 4, 8, 16, 32, 64};

    ```


    This creates an array that contains the int elements listed within the curly braces.
    Note that we don''t use the keyword or specify the type of the array in this array
    literal. The type is implicit in the variable declaration of which the initializer
    is a part. Also, the array length is not specified explicitly with this syntax;
    it is determined implicitly by counting the number of elements listed between
    the curly braces delimit classes, methods, and compound statements, they are not
    followed by semicolons. However, there is a semicolon following the curly brace
    in this array literal. This is one of the fine points of Java syntax. When curly
    braces delimit classes, methods, and compound statements, they are not followed
    by semicolons. However, for this array literal syntax, the semicolon is required
    to terminate the variable declaration statement.


    The problem with this array literal syntax is that it works only when you are
    declaring a variable of array type. Sometimes you need to do something with an
    array value (pass it to a method) but are going to use the array only once, so
    you don''t want to bother assigning it to a variable. In Java 1.1 and later, there
    is an array syntax that supports this kind of anonymous arrays (so called because
    they are not assigned to variables, so they don''t have names). This kind of array
