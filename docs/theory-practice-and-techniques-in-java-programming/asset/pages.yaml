  md: '# Definition


    A collection sometimes called a container is simply an object that groups multiple
    elements into a single unit. Collections are used to store, retrieve, manipulate,
    and communicate aggregate data. Typically, they represent data items that form
    a natural group, such as a poker hand (a collection of cards), a mail folder (or
    a telephone directory (a mapping of names to phone numbers). If you have used
    the Java programming language or just about any other programming language you
    are already familiar with collections.


    # Collections Framework


    Although we can use an array to store a group of elements of the same type (either
    primitives or objects). The array, however, does not support so-called dynamic
    allocation - it has a fixed length which cannot be changed once allocated. Furthermore,
    array is a simple structure. Many applications may require more complex data structure
    such as linked list, stack, hash table, sets, or trees.


    In Java, dynamically allocated data structures (such as ArrayList, LinkedList,
    Vector, Stack, HashSet, HashMap, Hashtable) are supported in a unified architecture
    called the Collection Framework, which mandates the common behaviors of all classes.


    A collection, as its name implied, is simply an object that holds a collection
    (or a group, a container) of objects. Each item in a framework is called an element.
    A framework, by definition, is a set of interfaces that force you to adopt some
    design practices. A well-designed framework can improve your productivity and
    provide ease of maintenance.


    collection framework provides a unified interface to store, retrieve and manipulate
    the elements of a collection, regardless of the underlying and actual implementation.
    This allows the programmers to program at the interfaces, instead of the actual
    implementation.


    Java collections framework is a set of classes and interfaces that implement commonly
    reusable data structures.'
