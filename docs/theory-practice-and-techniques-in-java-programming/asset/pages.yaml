  md: '# 5.2 AWT


    # Key Notes


    Definition


    The abstract window toolkit (AWT) is Java''s original platform-dependent windowing,
    graphics, and user-interface widget toolkit preceding Swing. The AWT is part of
    the Java Foundation Classes (JFC) the standard API for providing a graphical interface
    (GUI) for a Java program.


    # Components and Containers


    A container is a component which can contain other components inside itself. It
    is also an instance of a subclass of java.awt.Container. java.awt.Container extends
    java.awt.Component so containers are themselves components. In general components
    are contained in a container.


    # Learning Objective


    +   * Describe types of components in AWT

    * Discuss types of containers in AWT


    # Definition


    Abstract Window Toolkit (AWT) is a set of application program interfaces (API
    s) used by Java programmers to create graphical user interface ( GUI ) objects,
    as buttons, scroll bars, and windows. AWT is part of the Java Foundation Classes
    (JFC) from Sun Microsystems, the company that originated Java. The JFC are a comprehensive
    set of GUI class libraries that make it easier to develop the user interface part
    of an application program.


    Graphical user interface is a type of user interface that allows users to interact
    with electronic devices through graphical icons and visual indicators such as
    secondary notation, instead of used interfaces, typed command labels or text navigation.


    # Components and Containers


    A graphical user interface is built of graphical elements called components. Typical
    components include such as buttons, scrollbars, and text fields. Components allow
    the user to interact with the program and provide the user with visual feedback
    about the state of the program. In the AWT, all user interface components are
    instances of class Component or one of its subtypes.'
