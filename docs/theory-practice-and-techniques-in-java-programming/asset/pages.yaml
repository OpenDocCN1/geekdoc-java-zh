    might have a different X implementation, and the compiler has no way of knowing
    which X to import. To solve the problem, the developer must prefix each occurrence
    of X with the fully qualified package name. For the code fragment above, this
    leads to either a.X x = new a.X (); or b.X x = new b.X ();


