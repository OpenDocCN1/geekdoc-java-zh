    # Class Path Setting for Packages


    Classpath in Java is the path to directory or list of the directory which is used
    by ClassLoaders to find and load in Java program. Classpath can be specified using
    CLASSPATH environment variable which is case insensitive-cp -classpath command
    line option or Class-Path attribute in manifest.mf file inside JAR file in Java.


    # Understanding the class path and package names


    Java classes are organized into packages which are mapped to directories in the
    file system. But, unlike the file system, whenever you specify a package name,
    you specify the whole package name -- never part of it. For example, the package
    name for java.awt.Button is always specified as java.awt.


    For example, suppose you want the Java runtime to find a class named Cool.class
    in the package utility.myapp. If that to directory is C:\java\MyClasses\utility\myapp,
    you would set the class path so that it contains C:\java\MyClasses.


    To run that app, you could use the following JVM command:


    ```

    C:> java -classpath C:\java\MyClasses utility.myapp.Cool

    ```'
