    # Standard Constructors


    By convention, all general-purpose Collection implementations provide a standard
    conversion constructor that takes a Collection; SortedSet implementations are
    no exception. In TreeSet, this constructor creates an instance that sorts its
    elements according to their natural ordering. This was probably a mistake. It
    would have been better to check dynamically to see whether the specified collection
    was a SortedSetinstance and, if so, to sort the new TreeSet according to the same
    criterion (comparator or natural ordering). Because TreeSet took the approach
    that it did, it also provides a constructor that returns a new TreeSet containing
    the same elements sorted according to the same criterion. Note that it is the
    compile-time type of the argument, not its runtime type, that determines which
    of these constructors is invoked (and whether the sorting criterion is preserved).


    SortedSet implementations also provide, by convention, a constructor that takes
    a Comparator and returns an empty set sorted according the specified Comparator.
    If null is passed to this constructor, it returns a set that sorts its elements
    according to its natural ordering.


