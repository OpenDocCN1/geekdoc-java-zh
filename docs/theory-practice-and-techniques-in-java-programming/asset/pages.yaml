    If the List consists of String elements, it will be sorted into alphabetical order.
    If it consists of Date elements, it will be sorted into chronological order. How
    does this happen? String and Date both implement the Comparable interface. Comparable
    implementations provide a natural ordering for a class, which allows objects of
    that class to be sorted automatically. The following summarizes some of the most
    important Java platform classes that implement Comparable.


    | Class | Natural Ordering |

    |---||

    | Byte | Signed numerical |

    | Character | Unsigned numerical |

    | Long | Signed numerical |

    | Integer | Signed numerical |

    | Short | Signed numerical |

    | Double | Signed numerical |

    | Float | Signed numerical |

    | BigInteger | Signed numerical |

    | BigDecimal | Signed numerical |

    | Boolean | Boolean.FALSE < Boolean.TRUE |

    | File | System-dependent lexicographic on path |

    | String | Lexicographic |

    | Date | Chronological |

    | CollectionKey | Locale-specific lexicographic |


    If you try to sort a list, the elements which do not implement Comparable, Collections.sort(list)
