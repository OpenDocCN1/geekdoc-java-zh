    A class can contain any of the following variable types.


    **Local variables:** Variables defined inside methods, constructors or blocks
    are called local variables. The variable will be declared and initialized within
    the method and the variable will be destroyed when the method has completed.


    **Instance variables:** Instance variables are variables within a class but outside
    any method. These variables are initialized when the class is instantiated. Instance
    variables can be accessed from inside any method, constructor or blocks of that
    particular class.


    **Class variables:** Class variables are variables declared within a class, outside
    any method, with the static keyword.


    A class can have any number of methods to access the value of various kinds of
    methods. In the above example, barking(), hungry() and sleeping() are methods.


    # Memory Allocation for Objects


    Memory is allocated from heap to hold all instance variables and implementation-specific
    data of the object and its super classes. Implementation-specific data includes
    pointers to class and method data.


    In Java, all objects are dynamically allocated on Heap. This is different from
    C++ where objects can be allocated memory on Stack or on Heap. In C++, we allocate
    object using new(), the abject is allocated on Heap, otherwise on Stack if not
    global or static.


    In Java, when we declare a variable of a class type, only a reference is created
    (memory is not allocated for the object). To allocate memory to an object, we
    use new(). So the object is always allocated memory on heap.


    For example, following program fails in compilation. Compiler gives error "Error
    because t is not intialized",


