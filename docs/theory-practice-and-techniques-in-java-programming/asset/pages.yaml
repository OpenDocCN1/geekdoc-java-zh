  md: '# SUMMARY


    +   Java provides a data structure, the array, which stores a fixed-size sequential
    collection of elements of the same type. An array is used to store a collection
    of data, but it is often more useful to think of an array as a collection of variables
    of the same type.


    +   Array is a flexible structure for storing a sequence of values all of the
    same type. The values stored in an array are called elements.


    +   Array is a container object that holds a fixed number of values of a single
    type. The length of an array is established when the array is created.


    +   Arrays are a powerful and useful concept used in programming. Java SE provides
    methods to perform some of the most common manipulations related to arrays.


    +   Array types are the second kind of reference types in Java. An array is an
    ordered collection, or numbered list, of values. The values can be primitive values,
    objects, or even other arrays, but all of the values in an array must be of the
    same type.


    +   One dimensional array is a list of variables of same type that are accessed
    by a common name. An individual variable in the array is called an array element.
    Arrays form a way to handle groups of related data.


    +   A string is a collection of characters grouped together. For example, “hello”
    is a string consisting of the characters ‘h’, ‘e’, ‘l’, and ‘o’. Note that a character
    constant is enclosed in single quotes, whereas a string is enclosed in double
    quotes. In Java, a string is an object. With primitive data types, an object doesn’t
    exist until it is declared.


    +   By “immutable”, we mean that a String, once instantiated, cannot change. We
    can perform all kinds on “read” operations on a String object, like determine
    its size or count the number of vowels, but we cannot change the content of a
    String object.


    +   Methods used to obtain information about an object are known as accessor methods.
    One accessor method that you can use with strings is the length() method, which
    returns the number of characters contained in the string object.'
