  md: '# 310 Theory, Practice and Techniques in Java Programming


    example program, the comparison is between “cat” and “dog” (see line 17). The
    lexical difference, -1, appears in the 8th line of output. There are a couple
    of situations not accounted for in the discussion above. The numerical difference
    between two characters that differ only in case (e.g., ‘a’ and ‘A’) is 32, with
    uppercase characters lexically preceding lowercase characters. So, for example,
    the expression “zebra”.compareTo(“ZEPHYR”) equals 32. Comparisons that involve
    digits or punctuation symbols are a little tricky to evaluate. If there is no
    index position where the two strings differ, yet one is shorter than the longer
    string. The value returned is the difference in the lengths of the two strings.
    So, for example, the expression


    “lightbulb”.compareTo(“light”)


    equals 4


    “light”.compareTo(“light”)


    equals -4.


    equals()


    The last string method demonstrated in Figure 7.7 is the equals() method. equals()
    is a similar to compareTo() except it only tests for equality or inequality. The
    return type is a boolean: true if the two strings are identical, false otherwise.
    Since “cat” is not equal to “dog”, the result is false, as seen in the 9th line
    output.


    Note that the relational test for equality ( == ) is a valid string operator;
    however, its behaviour is distinctly different from the equals() method. For example,
    the expression


    ```

    s1 == s2

    ```


    returns true if s1 and s2 refer to the same object, where as the expression


    ```

    s1.equals(s2)

    ```


    returns true if the character sequence in s1 is the same as in s2.'
