  md: '# Introduction to Java Programming


    # 1.3 JAVA VIRTUAL MACHINE


    Key Notes


    Definition


    At runtime, the JVM reads and interprets .class files and executes the program''s
    instructions on the native hardware platform for which the JVM was written. The
    JVM interprets the bytecode just as a CPU would interpret assembly-language instructions.
    The difference is that the JVM is a piece of software written specifically for
    a particular platform. The JVM is the heart of the Java language''s “write-once,
    run-anywhere” principle. You can run code on any chipset for which a suitable
    implementation is available. JVMs are available for major platforms like Linux
    and Windows, and subsets of the Java language have been implemented in JVMs for
    mobile phones and hobbyist chips.


    Platform Independent


    Java is called platform independent because of Java Virtual Machine. As different
    computers with different operating system have their own JVM, when we submit .class
    to any operating system, JVM interpret the bytecode into machine level language.


    +   - JVM is the main component of Java architecture and it is the part of the
    JRE (Java Runtime Environment).

    - A program of JVM is written into “C Programming Language” and JVM is Operating
    System dependent.

    - JVM is responsible to allocate the necessary memory needed by the program.

    - JVM is responsible to allocate a memory space.


    Just-in-time Compiler (JIT)


    JIT is the part of the Java Virtual Machine (JVM) that is used to speed up the
    execution time. JIT interprets parts of the bytecode that have similar functionality
    at the same time, and hence reduces the amount of time needed for full interpretation.


    Learning Objectives


    +   - Understand byte code


    # Definition


    The Java Virtual Machine is called JVM, is an abstract computing machine or virtual
    machine interface that drives the java code.'
