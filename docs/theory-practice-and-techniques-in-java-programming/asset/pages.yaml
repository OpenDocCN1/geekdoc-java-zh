  md: '# SUMMARY


    +   - A class is an entity that determines how an object will behave and what
    the object will contain. In other words, it is a blueprint or a set of instruction
    to build a specific type of object.


    +   - Variables defined inside methods, constructors or blocks are called local
    variables. The variable will be declared and initialized within the method and
    the variable will be destroyed when the method has completed.


    +   - Memory is allocated from heap to hold all instance variables and implementation-specific
    data of the object and its super classes. Implementation-specific data includes
    pointers to class and method data.


    +   - Inheritance is when an object or class is based on any other object or class,
    using the same implementation specifying to maintain the same behavior. It is
    a mechanism for code reuse and to allow independent extensions of the original
    software via public classes and interfaces.


    +   - Multilevel inheritance refers to a mechanism in OO technology where one
    can inherit from a derived class, thereby making this derived class the base for
    the new class.


    +   - An interface is a reference type in Java. It is similar to class. It is
    a collection of abstract methods. A class implements an interface, thereby inheriting
    the abstract methods of the interface.


    +   - Instance initializers, which may also be called instance initialization
    blocks, are blocks of code (marked by open and close curly braces) that sit in
    the body of a class, but outside the body of any method declared in that.


    +   - If a class contain any abstract method then the class is declared as abstract
    class. An abstract class is never instantiated. It is used to provide abstraction.
    Although it does not provide 100% abstraction because it can also have concrete
    method.


    +   - Non-static Nested is the most important type of nested class. It is also
    known as Inner class. It has access to all variables and methods of Outer class
    including its private data members and methods and may refer to them directly.'
