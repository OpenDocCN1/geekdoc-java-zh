  md: '# Concept


    Java is known as an Object Oriented language. So, what does Object Oriented mean?
    It means that the foundations of any kind of program constructed in Java might
    be imagined in terms of Objects. A good example of this idea should be to have
    a look at a handful of sample business requirements for a program. Imagine that
    we are tasked with constructing a software program intended to keep track of an
    actual public library system. This system must keep track of each of the branches
    associated with the libraries, the whole set of materials that can be contained
    in the branches, and additionally all of the people that may need to access books
    from the library’s branch.


    Object-oriented programming (OOP) is a programming language organized around objects
    rather than “actions” and data rather than logic. Historically, a program has
    been viewed as a logical procedure that takes input data, processes it, and produces
    output data.


    The programming challenge was how to write the logic


    The first step in OOP is to identify all the objects the programmer wants to manipulate
    and how they relate to each other, an exercise often known as data modeling. Once
    an object has been identified, it is generalized as a class of objects (think
    of Plato’s concept of the “ideal” chair that stands for all chairs) which defines
    the kind of data it contains and any logic sequences that can manipulate it. Each
    distinct logic sequence is known as a method. Objects communicate with well-defined
    interfaces called messages.


    The concepts and rules used in object-oriented programming provide these important
    benefits:


    +   - The concept of a class makes it possible to define subclasses of data objects
    that share some or all of the main class characteristics. Called inheritance,
    this property of OOP forces a more thorough data analysis, reduces development
    time, and ensures more accurate coding.

    - Since a class defines only the data it needs to be concerned with, an instance
    of that class (an object) is run, the code will not be able to accidentally access
    other program data. This characteristic of data hiding provides greater security
    and avoids unintended data corruption.'
