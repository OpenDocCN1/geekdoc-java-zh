    then it is not necessary to create a separate file for that. Instead, you can
    add it as “Inner Class”


    # Static Nested Class


    If the nested class i.e the class defined within another class, has static modifier
    applied in it, then it is called as static nested class. Since it is, static nested
    classes can access only static members of its outer class i it cannot refer to
    non-static members of its enclosing class directly. Because of this restriction,
    static nested class is rarely used.


    # Non-static Nested Class


    Non-static Nested Class is the most important type of nested class. It is also
    known as Inner class. It has access to all variables and methods of Outer class
    including its private data members and methods may refer to them directly. But
    the reverse is not true, that is, Outer class cannot directly access members of
    Inner class. Inner class can be declared private, public, protected, or with default
    access whereas an Outer class can have only public or default access.


    ![](img/c7ab3e310e7811a38d328b7a483bb3ba_77_0.png)


    A non-static Nested Class that is created outside a method is called Member inner
    class.

    A non-static Nested class that is created inside a method is called local inner
    class. If you want to invoke the methods of local inner class, you must instantiate
    this class inside the method. We cannot use private, public or protected access
    modifiers with local inner class. Only abstract and final modifiers are allowed.


