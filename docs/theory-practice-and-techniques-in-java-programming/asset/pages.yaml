  md: 'The Java Collection Framework package (java.util) contains:


    +   - A set of interfaces,

    - Implementation classes, and

    - Algorithms (such as sorting and searching).


    Similar Collection Framework is the C++ Standard Template Library (STL).


    A collections framework is a unified architecture for representing and manipulating
    collections. All collections frameworks contain the following:


    +   - Interfaces: These are abstract data types that represent collections. Interfaces
    allow collections to be manipulated independently of the details of their representation.
    In object-oriented languages, interfaces generally form a hierarchy.

    - Implementations: These are the concrete implementations of the collection interfaces.
    In essence, they are reusable data structures.

    - Algorithms: These are the methods that perform useful computations, such as
    searching and sorting, on objects that implement collection interfaces. The algorithms
    are said to be polymorphic; that is, the same method can be used on many different
    implementations of the appropriate collection interface. In essence, algorithms
    are reusable functionality.


    Apart from the Java Collections Framework, the best-known examples of collections
    frameworks are the C++ Standard Template Library (STL) and Smalltalk''s collection
    hierarchy. Historically, collections frameworks have been quite complex, which
    gave them a reputation for having a steep learning curve. We believe that the
    Java Collections Framework breaks with this tradition.


    # Benefits of the Java Collections Framework


    The Java Collections Framework provides the following benefits:


    +   - Reduces programming effort: By providing useful data structures and algorithms,
    the Collections Framework frees you to concentrate on the important parts of your
    program rather than the low-level “plumbing” required to make it work. By facilitating
    interoperability among unrelated APIs, the Java Collections Framework frees you
    from writing adapter objects or conversion code to connect APIs.

    - Increases program speed and quality: This Collections Framework provides high-performance,
    high-quality implementations of useful data structures and algorithms. The various
    implementations of each interface are interchangeable, so programs can be easily
    tuned by switching collection implementations. Because you are freed from the
    drudgery'
