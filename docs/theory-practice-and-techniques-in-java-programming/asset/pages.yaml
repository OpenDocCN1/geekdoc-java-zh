    # The Set Interface


    Interface in the Java programming language is an abstract type that is used to
    specify a behaviour that classes implement.


    A Set is a Collection that cannot contain duplicate elements. It models the mathematical
    abstraction. The Set interface contains only inherited elements from Collection
    and adds the restriction that duplicate elements are prohibited. Set also adds
    a stronger contract on the behavior of the equals and hashCode operations, allowing
    Set instances to be compared meaningfully even if their implementation differs.
    Two Set instances are equal if they contain the same elements.


    The Java platform contains three general-purpose implementations: HashSet, TreeSet,
    and LinkedHashSet. HashSet, which stores its elements in a table, is the best-performing
    implementation; however it makes no guarantees concerning the order of iteration.
    TreeSet, which stores its elements in a red-black tree, orders its elements based
    on their values; it is substantially slower than HashSet. LinkedHashSet, which
    is implemented as a hash table with a linked list running through it, orders its
    elements on the order in which they were inserted into the set (insertion-order).
    LinkedHashSet spares its clients from the unspecified, generally chaotic ordering
    provided by HashSet at a cost that is only slightly higher.


