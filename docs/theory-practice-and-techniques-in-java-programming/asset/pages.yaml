  md: '# 2 CHAPTER CLASSES AND OBJECTS


    # 2.1 CONCEPT OF CLASSES AND OBJECTS


    # KEY NOTES


    # Definition


    A class is a blueprint or prototype that defines the variables and the methods
    (functions) common to all objects of a certain kind. An object is a specimen of
    a class. Software objects are often used to model real-world objects you find
    in everyday life.


    # Memory Allocation for Objects


    Java allocates space from a pool f memory called the heap. Each time a method
    is called, Java allocates a new block of memory a stack frame to hold its local
    variables. When the method returns, its stack frame is erased. Stack frames come
    from a region of memory called the stack.


    # Inheritance in Java


    Inheritance enables new objects to take on the properties of existing objects.
    A class that is used as the basis for inheritance is called a superclass or base
    class. A class that inherits from a superclass is called a subclass or derived
    class.


    # Learning Objective


    +   * Describe how to create classes in java

    * Define memory allocation for objects'
