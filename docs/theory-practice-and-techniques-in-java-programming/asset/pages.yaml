    # TECHNIQUE 4


    # SERIALIZE AN OBJECT IN JAVA


    When you serialize an object in Java, you convert the data into byte streams that
    then later convert back into the copy of the original data. If this sounds confusing,
    think of serialization in the following terms. You''re working on a document and
    then save it to your hard drive. You are, in manner of speaking, serializing the
    data so you can retrieve that copy later on. Serialization makes the transfer
    of data on networks much easier and more efficient.


    It''s important that you understand the basics of Java before serializing an object.
    If you''ve used programming languages such as Pascal and older versions of C,
    you''ll know that without object serialization, a programmer has to create a separate
    I/O text file to store and load data. Object serialization in Java bypasses creating
    this text file to store data, saving time and programming costs.


