  md: 'Object Oriented Programming 221


    # Access Control


    Java provides a number of access modifiers to set access levels for classes, variables,
    methods and constructors. The four access levels are –


    +   - Visible to the package, the default. No modifiers are needed.

    - Visible to the class only (private).

    - Visible to the world (public).

    - Visible to the package and all subclasses (protected).


    # Controlling Access to Members of a Class


    Access level modifiers determine whether other classes can use a particular field
    or invoke a particular method. There are two levels of access control:


    +   - At the top level—public, or package-private (no explicit modifier).

    - At the member level—public, protected, or package-private (no explicit modifier).


    A class may be declared with the modifier public, in which case class is visible
    to all classes everywhere. If a class has no modifier (the default, also known
    as package-private), it is visible only within its own package (packages are groups
    of related classes)


    At the member level, you can also use the public modifier or no modifier (package-private)
    just as with top-level classes, and with the same meaning. For members, there
    are two additional access modifiers: private and protected. The private modifier
    specifies that the member can only be accessed in its own class. The protected
    modifier specifies that the member can only be accessed within its own package
    (with package-private) and, in addition, by a subclass of its class in another
    package.


    The following table shows the access to members permitted by modifier.


    | Modifier | Class | Package | Subclass | World |

    | --- | --- | --- | --- | --- |

    | public | Y | Y | Y | Y |

    | protected | Y | Y | Y | N |

    | no modifier | Y | Y | N | N |

    | private | Y | N | N | N |


    The first data column indicates whether the class itself has access to the member
    defined by the access level. As you can see, a class always has access to its
    own members. The second column indicates whether classes in the'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Theory, Practice and Techniques in Java Programming


    package as the class (regardless of their parentage) have access to the member.
    The third column indicates whether subclasses of the class declared outside this
    package have access to the member. The fourth column indicates whether all classes
    have access to the member.


    Access levels affect you in two ways. First, when you use classes that come from
    another source, such as the classes in the Java platform, access levels determine
    which members of those classes you can use. Second, when you write a class, you
    need to decide what access level every member variable and every method in your
    class should have.


    ![](img/c7ab3e310e7811a38d328b7a483bb3ba_233_0.png)


    Let''s look at a collection of classes and see how access levels affect visibility.
    The following figure shows the four classes in this example and how they are related.


    The following table shows where the members of the Alpha class are visible for
    each of the access modifiers that can be applied to them.


    | Modifier | Alpha | Beta | Alphasub | Gamma |

    |---|---|---|---||

    | public | Y | Y | Y | Y |

    | protected | Y | Y | Y | N |

    | no modifier | Y | Y | N | N |

    | private | Y | N | N | N |


    If other programmers use your class, you want to ensure that errors from misuse
    cannot happen. Access levels can help you do this.


    +   Use the most restrictive access level that makes sense for a particular member.
    Use private unless you have a good reason not to.

    Avoid public fields except for constants. (Many of the examples in the tutorial
    use public fields. This may help to illustrate some points concisely, but is not
    recommended for production code.) Public fields tend to link you to a particular
    implementation and limit your flexibility in changing your code.'
