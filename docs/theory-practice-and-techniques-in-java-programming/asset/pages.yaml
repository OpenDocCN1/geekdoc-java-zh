  md: '# Theory, Practice and Techniques in Java Programming


    Garbage collection is a form of automatic memory management. The garbage collector,
    or just collector, attempts to reclaim garbage, or memory occupied by objects
    that are no longer in use by the program.


    In many cases – and by default in many object-oriented languages (OOLs), particularly
    those that use garbage collection (GC) – objects are allocated on the heap, object
    lifetime is not determined by the lifetime of a given variable: the value of a
    variable holding an object actually corresponds to a reference to the object,
    not the object itself, and destruction of the variable just destroys the reference,
    not the underlying object.


    Unlike some OO languages, Java does not support an explicit destructor method
    to delete an object from memory.


    +   - Instead, unused objects are deleted by a process known as garbage collection.


    The JVM automatically runs garbage collection periodically. Garbage collection:


    +   - Identifies objects no longer in use (no references)


    +   - Finalizes those objects (deconstructs them)


    +   - Frees up memory used by destroyed objects


    +   - Fragments memory


    Garbage collection introduces overhead, and can have a major effect on Java application
    performance.


    +   - The goal is to avoid how often and how long GC runs.


    +   - Programmatically, try to avoid unnecessary object creation and deletion.


    +   - Most JVMs have tuning parameters that affect GC performance.


    # Benefits of garbage collection:


    +   - Frees up programmers from having to manage memory. Manually identifying
    unused objects (as in a language such as C++) is not a trivial'
