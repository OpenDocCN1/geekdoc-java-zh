  md: '# Creating Arrays


    To create an array value in Java, you use the new keyword, just as you do to create
    an object. Arrays don''t need to be initialized like objects, however, so you
    don''t pass a list of arguments between parentheses. What you must specify, though,
    is how big you want the array to be. If you are creating a byte[], for example,
    you must specify how many bytes you want it to hold. Array values have a fixed
    size in Java. Once an array is created, it can never grow or shrink. Specify the
    desired size of your array as a non-negative integer between square brackets:


    ```

    byte[] buffer = new byte[1024];

    String[] lines = new String[50];

    ```


    When you create an array with this syntax, each of the values held in the array
    is automatically initialized to its default value. This is false for boolean values,
    \u0000 for charvalues, 0 for integer values, 0.0 for floating-point values, and
    null for objects or array values.


    # Using Arrays


    Once you''ve created an array with the new operator and the square-bracket syntax,
    you also use square brackets to access the individual values contained in the
    array. Remember that an array is an ordered collection of values. The elements
    of an array are numbered sequentially, starting with 0. The number of an array
    element refers to the element. This number is often called the *index*, and the
    process of looking up a numbered value in an array is sometimes called *indexing*
    the array.


    To refer to a particular element of an array, simply place the index of the desired
    element in square brackets the name of the array. For example:


    ```

    String[] responses = new String[2]; // Create an array of two strings

    responses[0] = "=Yes;"; // Set the first element of the array

    responses[1] = "=No;"; // Set the second element of the array

