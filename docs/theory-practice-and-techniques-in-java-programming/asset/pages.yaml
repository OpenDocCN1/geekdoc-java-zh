    - I/O from the Command Line: This Stream handles the Standard Streams and Console.


    As we will progress in our discussion, we will be required to deal with the Stream
    classes and the Reader/Writer classes. So, we will first discussed the difference
    between these classes.


    | Stream Classes | Reader/Writer Classes |

    |---|---|

    | Stream classes are byte oriented | Reader/Writer classes are oriented |

    | Doesn’t support Unicode characters | Supports Unicode characters |

    | Perform input/output of 8-bit bytes | Perform input/output of 16-bit Unicode
    characters |

    | Since JDK 1.0 | Since JDK 1.1 |


