  md: '# Definition


    Files are the most important mechanism for storing data permanently on mass-storage
    devices. Permanently means that the data is not lost when the machine is switched
    off. Files can contain:


    +   - data in a format that can be interpreted by programs, but not easily by
    humans (binary files);

    - alphanumeric characters, codified in a standard way (e.g., using ASCII or Unicode),
    and directly readable by a human user (text files). Text files are normally organized
    in a sequence of lines, each containing a special character (usually with the
    newline character). Consider, for example, a Java program stored in a file of
    the hard-disk.


    Hard disk is a data storage device that uses magnetic storage to store and retrieve
    information using one or more rigid rotating disks (platters) coated with magnetic
    material.


    Each file is characterized by a name and a directory in which the file is placed
    (one may consider the whole path that allows to find the file on the hard-disk
    as of the name of the file). The most important operations on files are: creation,
    reading from, writing to, renaming, deleting. All these operations can be performed
    by the operating system (or other application programs), or through suitable operations
    in a Java program.


    # Stream


    We can say that a stream is a different kind of sources and destinations such
    as the disk files, devices, memory arrays. Stream is a sequence of data (simple
    bytes, primitive data types, localized characters, objects) which flows the information
    that may be an input source or an output destination for example a console, buffer,
    etc. In Java you will see the various I/O Streams


    +   - Byte Streams: This Stream handles the binary i.e. 8-bit input/output data.

    - Character Streams: This Stream handles the character.

    - Buffered Streams: This Stream handles the buffered input/output streams.'
