  md: '# SUMMARY


    +   A Collection sometimes called a container is simply an object that groups
    multiple elements into a single unit. Collections are used to store, retrieve,
    manipulate, and communicate aggregate data.


    +   A collection, as its name implied, is simply an object that holds a collection
    (or a group, a container) of objects. Each item in a collection is called an element.
    A framework, by definition, is a set of interfaces that force you to adopt some
    design practices.


    +   These interfaces allow collections to be manipulated independently of the
    details of their representation. Core collection interfaces are the foundation
    of the Java Collections Framework.


    +   A Collection represents a group of objects known as its elements. The Collection
    interface is used to pass around collections of objects where maximum generality
    is desired.


    +   A Set is a Collection that cannot contain duplicate elements. It models the
    mathematical set abstraction. The Set interface contains only methods inherited
    from Collection and adds the restriction that duplicate elements are prohibited.


    +   A class is nothing but a blueprint or a template for creating different objects
    which defines its properties and behaviors. Java objects exhibit its properties
    and behaviors defined by its class.


    +   A Map interface provides key-value pairs, map objects contains keys associated
    with a value. Maps cannot contain duplicate keys and one key can be mapped to
    one element.


