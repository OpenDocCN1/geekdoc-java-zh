  md: '# SUMMARY


    +   - Files are the most important mechanism for storing data permanently on mass-storage
    devices. Permanently means that the data is not lost when the machine is switched
    off.


    +   - File class delete method is used to delete a file or an empty directory.


    +   - Programming errors are error situations that occur because of logical errors
    in the program, while runtime environment errors are errors over which the program
    has little control.


    +   - Exception handling is the mechanism for dealing with such situations. Exception
    can occur at runtime (known as runtime exceptions) as well as at compile-time
    (known Compile-time exceptions).


    +   - A checked exception is an exception that occurs at the compile time, these
    are also called as compile time exceptions.


    +   - Runtime Exceptions are also known as Unchecked Exceptions as the compiler
    does not check whether the programmer has handled them or not but is the duty
    of the programmer to handle these exceptions and provide a safe exit.


    +   - Errors are typically ignored in your code because you can rarely do anything
    about an error.


    +   - A method catches an exception using a combination of the try and catch keywords.
    A try/catch block is placed around the code that might generate an exception.


    +   - If a method does not handle a checked exception, the method must declare
    it using the throws keyword. The throws keyword appears at the end of a method''s
    signature.


    +   - The finally block follows a try block or a catch block. A finally block
    of code always executes, irrespective of occurrence of an Exception.


