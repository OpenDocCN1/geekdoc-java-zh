  md: '# Introduction to Java Programming


    overloading, Multiple inheritance, pointers and Explicit memory allocation.


    # Robust Language


    Two main problems that cause program failures are memory management mistakes and
    mishandled runtime errors. Java handles both of them efficiently.


    +   - Memory management mistakes can be overcome by garbage collection. Garbage
    collection is automatic de-allocation of objects which are no longer needed.

    - Mishandled runtime errors are resolved by Exception Handling procedures.


    # Secure


    Java is intended to be used in networked/distributed situations. Toward that end
    a lot of emphasis has been placed on security. Java enables the construction of
    virus-free, tamper-free systems. The authentication techniques are based on public-key
    encryption.


    There is a strong interplay between “robust” and “secure”. For example, the changes
    to the semantics of pointers make it impossible for applications to forge access
    to data structures or to access private data in objects that they do access. This
    closes the door on most activities of viruses.


    # Java is distributed


    Using java programming language we can create distributed applications. RMI (Remote
    Method Invocation) and EJB (Enterprise Java Beans) are used for creating distributed
    applications in Java. Simple words: The Java programs can be distributed on more
    than one systems that are connected to each other using internet connection. Objects
    on one JVM (java virtual machine) can execute procedures on a remote JVM.


    # Multithreading


    There are many things going at the same time in the world around us. Multithreading
    is a way of building applications that are built out of multiple threads. Unfortunately,
    writing programs that deal with many things happening at once can be much more
    difficult than writing in the conventional single-threaded C and C++ style.


    Java has a sophisticated set of synchronization primitives that are based on the
    widely used monitor and condition variable paradigm that was introduced by C.A.R.Hoare.
    By integrating these concepts into the language become


