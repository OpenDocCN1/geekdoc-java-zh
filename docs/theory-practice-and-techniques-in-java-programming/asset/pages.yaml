    # 4.1 FILE HANDLING


    # KEY NOTES


    Definition

    File handling in Java means how to read from and write to file in Java. Java provides
    the basic I/O package for reading and writing streams. java.io package allows
    to do all Input and Output tasks in Java.


    Java provides the java.io package for file handling in Java. java.io package contains
    the inbuilt Java classes and predefined methods using which you can read from
    and write data to file.


    Stream

    A stream is a communication channel that a program has with the outside world.
    It is used to transfer data items in succession.


    Operations on Files

    To execute reading and writing operations on a file, we must open the file before
    doing the operations, and close it after we are finished operating on it.


    +   Learning Objectives

    - Create and delete file

    - Read file and write file

    - Change file permissions'
