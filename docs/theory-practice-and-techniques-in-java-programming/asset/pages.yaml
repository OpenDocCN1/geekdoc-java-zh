    javac -classpath "../" CPTest2.java


    Before seeing how we can make this less ugly, consider this example (still in
    the same directory):


    ```

    javac -classpath "" CPTest1.java CPTest2.java

    ```


    This also works, even though the class is empty. This is because the Java compiler
    will look for references from any source code explicitly listed on the command
    line. If there are any classes, all in the same directory, we can simplify this
    to:


    ```

    javac -classpath "*.java

    ```


    The `*.java` expands to a list of all the .java files in the current directory.
    This explains why compiling many files in one operation succeeds when attempts
    to compile a single file fails.


    A more convenient way to compile CPTest2 on its own is like this:

    cd [root]


    ```

    javac -classpath "." com/web_tomorrow/CPTest2.java

    ```


    In this example we specify the full path to CPTest2.java, but include `.` in the
    -classpath option. Again, we aren''t telling the compiler to look for files in
    the current directory. Because the class we are looking for is com.web_tomorrow.CPTest1,
    the compiler will search in ./com/web_tomorrow (that is, the directory/web_tomorrow
    below the current directory). This is exactly where CPTest1 is located.


    In fact, even though I only specified CPTest2 on the command line, practice does
    in fact lead to the compilation of CPTest1 as well. The compiler finds the .java
    file in the right place, but it can''t tell whether this Java source really implements
    the right class, so it has to compile it. Note that if we do this:


    ```

    cd [root]

    ```


    ```

    javac -classpath ".\" com/web_tomorrow/CPTest1.java"

    ```


    it does not cause a compilation of CPTest2.java, because the compiler does not
