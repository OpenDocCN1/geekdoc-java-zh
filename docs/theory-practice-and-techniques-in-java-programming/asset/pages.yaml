  md: '# Theory, Practice and Techniques in Java Programming


    # String Methods


    Other than assignment and concatenation, string operations usually employ methods
    of the String class. Including all variations, there are over 50 methods in the
    String class; however, we will only examine the most common. These are listed
    in Table 7.1.


    # Table 7.1. Common methods in the String


    | String(s) | constructs a String object and initialize it with the string; returns
    a reference to the object |

    | s.length() | returns an int equal to the length of the string |

    | s.substring(i, j) | returns a String equal to substring of s starting at index
    i and ending at j-1 |

    | s.toUpperCase() | returns a String equal to s letters converted to uppercase
    |

    | s.toLowerCase() | returns a String equal to s letters converted to lowercase
    |

    | s.charAt(i) | returns the char at index i in string |

    | s1.indexOf(s2) | returns an int equal to index within s1 of the first occurrence
    of s2; returns -1 if s2 is not in s1 |

    | s1.compareTo(s2) | returns an int equal to the lexical difference between string
    s1 and s2; if s1 lexically precedes s2, the value returned is negative |

    | s1.equals(s2) | returns a boolean; true if s1 is the same as s2, false otherwise


    # Method Signatures


    Methods are summarized by their signature, which shows the first line of the method''s
    definition. For example, the signature for the compareTo() method, as given in
    the documentation for the String class, is public int compareTo(String anotherString)
    The reserved word "public" is a modifier. It identifies the method''s visibility
    in the larger context of a Java program. a public method can be accessed, or "called",
    from outside the class in which it is defined; it is visible anywhere where the
    class is viable. (A method declared private if it helps a public method achieve
    its goal but it is not accessible outside the class.) The reserved word "int"
    identifies the data type of the value returned by the method. The compareTo()
    method returns an integer. A method can also return an object; as a class name
    may appear instead of a data type.


    **Modifier** is a keyword that is added to change meaning of a definition. In
    Java, modifiers are categorized into two types, access control modifier and non-access
    modifier.'
