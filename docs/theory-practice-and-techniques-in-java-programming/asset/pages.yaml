    \ declaring the type of exception you are trying to catch. If an exception occurs\
    \ in protected code, the catch block (or blocks) that follows the type is checked.\
    \ If the type of exception that occurred is listed in a catch block, the exception\
    \ is passed to the catch block as much as an argument is passed into a method\
    \ parameter.\n\n# Multiple Catch Blocks\n\nA try block can be followed by multiple\
    \ catch blocks. The syntax for multiple catch blocks looks like the following\
    \ –\n\nSyntax\n\n```\ntry\n{\n  //Protected code\n}catch(Exception1 e1) {\n  //Catch\
    \ block\n}catch(Exception2 e2) {\n  //Catch block\n}catch(Exception3 e3) {\n \
    \ //Catch block\n}\n```\n\nThe previous statements demonstrate three catch blocks,\
    \ but you can have any number of them after a single try. If an exception occurs\
    \ in the protected code, the exception is thrown to the first catch block in the\
    \ list. If the data type of the exception thrown matches ExceptionType, it gets\
    \ caught. If not, the exception passes down to the second catch statement. This\
    \ continues until the exception is caught or falls through all catches, in which\
    \ case the current method stops execution and the exception is thrown down to\
    \ the previous method on the call stack."
