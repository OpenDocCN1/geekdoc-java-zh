  md: '# CHAPTER INTRODUCTION TO JAVA

    PROGRAMMING


    # 1.1 OVERVIEW OF JAVA


    # KEY NOTES


    Definition

    Java is a programming language and environment that was designed to solve a number
    of problems in modern programming practice. It started as part of a larger project
    to develop advanced software for consumer electronics. These are small reliable
    portable distributed real-time embedded systems.


    Creation of Java

    Java was developed by Sun Microsystems Inc in 1991, later acquired by Oracle Corporation.
    It was conceived by James Gosling and Patrick Naughton. It is a simple programming
    language. Writing, compiling and debugging a program is easy in java. It helps
    to create modular programs and reusable code.


    Evolution of Java

    James Gosling initiated Java language project in June 1991 for use of one of his
    many set-top box projects. The language, initially called ‘Oak’ after an oak tree
    that stood outside Gosling’s office, also went by the name ‘Green’ and ended up
    later being renamed as Java, from a list of random words.


    +   Learning Objectives

    * Understand main features of java

    * Discuss about the java language

    * Describe environmental setup of java

    * Explain application of java'
