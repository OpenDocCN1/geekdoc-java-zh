  md: '# Initializing Fields


    As you have seen, you can often provide an initial value for a field in the declaration:

    public class BedAndBreakfast {


    ```

    // initialize to 10

    public static int capacity = 10;


    // initialize to false

    private boolean full = false;

    }

    ```


    This works well when the initialization value is available and the initialization
    value can be put on one line. However, this form of initialization has limitations
    because of its simplicity. If initialization requires some logic (for example,
    error handling or for a loop to fill a complex array), simple assignment is inadequate.
    Instance variables can be initialized in constructors, where error handling or
    other logic can be used. To provide the same capability for class variables, the
    Java programming language includes static initialization blocks.


    # Static Initialization Blocks


    A static initialization block is a normal block of code enclosed in braces, {
    }, and preceded by the static keyword. Here is an example:

    static {

    // whatever code is needed for initialization goes here

    }

    A class can have any number of static initialization blocks, and they can appear
    anywhere in the class body. The runtime system guarantees that static initialization
    blocks are called in the order that they are declared in the source code. There
    is an alternative to static blocks — you can write a private static method: class
    Whatever {


    ```

    public static varType myVar = initializeClassVariable();


    private static varType initializeClassVariable() {

    ```'
