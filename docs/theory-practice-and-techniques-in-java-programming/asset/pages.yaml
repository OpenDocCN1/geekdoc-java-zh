    destroy()


    The destroy() method is called when the environment determines that your applet
    needs to be removed completely from memory. At this point, you should free up
    any resources the applet may be using. The stop() method is always called before
    destroy().


    Overriding update()


    In some situations, an AWT-based applet may need to override another method by
    the AWT, called update(). This method is called when your applet has requested
    a portion of its window be redrawn. The default version of update() simply calls
    paint().


    However, you can override the update() method so that it performs more repainting.
    In general, overriding update() is a specialized technique that is not applicable
    to all applets, and the examples in this chapter do not override update().


