    ```

    System.out.println("Element 1 at index 0: " + anArray[0]);

    nSystem.out.println("Element 2 at index 1: " + anArray[1]);

    nSystem.out.println("Element 3 at index 2: " + anArray[2]);"

    ```


    Alternatively, you can use the shortcut syntax to create and initialize an array:


    ```

    int[] anArray = {

    100, 200, 300,

    400, 500, 600,

    700, 800, 900, 1000

    };

    ```


    The length of the array is determined by the number of values provided between
    braces and separated by commas.


    You can also declare an array of arrays (also known as a multidimensional array)
    by using two or more sets of brackets, such as String[][] names. Each element,
    therefore, must be accessed by a corresponding number of index.'
