  md: "# Theory, Practice and Techniques in Java Programming\n\n# Single inheritance\n\
    \nSingle inheritance\nenables a derived class to inherit properties and behavior\
    \ from a single parent class. It allows a derived class to inherit the properties\
    \ and behavior of a base class, thus enabling code reusability as well as adding\
    \ new features to the existing code.\n\nSingle inheritance is damn easy to understand.\
    \ When a class extends only one class then we call it a single inheritance. The\
    \ below flow diagram shows that class B extends only one class which is A. Here\
    \ A is a parent class of B and B would be a child class of A.\n\n![](img/c7ab3e310e7811a38d328b7a483bb3ba_49_0.png)\n\
    \n(a) Single Inheritance\n\n# Single Inheritance example program in Java Class\
    \ A\n\n```\n{\n  public void method()\n  {\n    System.out.println(\"Base class\
    \ method\");\n  }\n}\n```\n\n# Class B extends A\n\n```\n{\n  public void methodB()\n\
    \  {\n    System.out.println(\"Child class method\");\n  }\n  public static void\
    \ main(String args[])\n  {\n    B obj = new B();\n    obj.methodA(); //calling\
    \ super class method\n    obj.methodB(); //calling local method\n  }\n}\n```"
