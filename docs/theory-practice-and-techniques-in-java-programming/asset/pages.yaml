  md: "# 2.2 INTERFACES IN JAVA\n\n> Key Notes\nDefinition\nInterface is a pure abstract\
    \ class. They are syntactically similar to classes, but you cannot create instance\
    \ of an Interface and their methods are declared without any body. Interface is\
    \ used to achieve complete abstraction in Java. \n\nLearning Objective\n* Define\
    \ the declaring and implementing interfaces in java\n\n# Definition\n\nAn interface\
    \ is a reference type in Java. It is similar to class. It is a collection of abstract\
    \ methods. A class implements an interface, thereby inheriting the abstract methods\
    \ of the interface.\n\nAlong with abstract methods, an interface may also contain\
    \ constants, default methods, static methods, and nested types. Method bodies\
    \ exist only for default methods and static methods.\n\nWriting an interface is\
    \ similar to writing a class. But a class describes the attributes and behaviors\
    \ of an object. An interface contains behaviors that a class implements.\n\nUnless\
    \ the class that implements the interface is abstract, all the methods of the\
    \ interface need to be defined in the class.\n\nAn interface is similar to a class\
    \ in the following ways:\n\n+   * An interface can contain any number of methods.\n\
    * An interface is written in a file with a .java extension, with the name of the\
    \ interface matching the name of the file.\n* The byte code of an interface appears\
    \ in a .class file.\n* Interfaces appear in packages, and their corresponding\
    \ bytecode must be in a directory structure that matches the package name.\n\n\
    However, an interface is different from a class in several ways, including:\n\n\
    +   * You cannot instantiate an interface.\n* An interface does not contain any\
    \ constructors.\n* All of the methods in an interface are abstract."
  merge: -1
  pgno: 53
- img_proc: true
  md: "# Classes and Objects\n\n+   - An interface cannot contain instance fields.\
    \ The only fields that can appear in an interface must be declared both static\
    \ and final.\n\n+   - An interface is not extended by a class; it is implemented\
    \ by a class.\n\n+   - An interface can extend multiple interfaces.\n\nBytecode,\
    \ also termed portable code or p-code, is a form of instruction designed for efficient\
    \ execution by a software interpreter.\n\n# Declaring Interfaces\n\nThe interface\
    \ keyword is used to declare an interface. Here is a simple example to declare\
    \ an interface\n\nExample\n\nFollowing is an example of an interface:\n\n```\n\
    /* File name : NameOfInterface.java */\nimport java.lang.*;\n// Any number of\
    \ import statements\n```\n\n```\npublic interface NameOfInterface\n// Any number\
    \ of final, static fields\n// Any number of abstract method declarations\n}\n\
    ```\n\nInterfaces have the following properties:\n\n+   - An interface is implicitly\
    \ abstract. You do not need to use the abstract keyword while declaring an interface.\n\
    \n+   - Each method in an interface is also implicitly abstract, so the abstract\
    \ keyword is not needed.\n\n+   - Methods in an interface are implicitly public.\n\
    \nExample\n\n```\n/* File name : Animal.java */\n```\n\n```\ninterface Animal\
    \ {\n  public void eat();\n  public void travel();\n}\n```\n\n![](img/c7ab3e310e7811a38d328b7a483bb3ba_54_0.png)"
