  md: '# SUMMARY


    +   Applet is a special type of program that is embedded in the webpage to generate
    the dynamic content. It runs inside the browser and works at client side.


    +   A JVM is required to view an applet. The JVM can be either a plug-in of the
    Web browser or a separate runtime environment.


    +   AWT-based applets will also often override the paint( ) method, which is defined
    by the AWT Component class. This method is called when the applet''s output must
    be redeployed.


    +   The init( ) method is the first method to be called. This is where you should
    initialize variables. This method is called only once during the run time of your
    applet.


    +   The paint( ) method is called each time an AWT-based applet''s output must
    be redrawn. This situation can occur for several reasons. For example, the window
    in which the applet is running may be overwritten by another window and then uncovered.


    +   The Applet.getParameter( ) method fetches a parameter given the parameter''s
    name (the value of a parameter is always a string). If the value is numeric or
    other non-character data, the string must be parsed.


    +   Abstract Window Toolkit (AWT) is a set of application program interfaces (API
    s) used by Java programmers to create graphical user interface ( GUI ) objects,
    such as buttons, scroll bars, and windows.


    +   A graphical user interface is built of graphical elements called components.
    Typical components include such items as buttons, scrollbars, and text fields.


    +   The AWT provides basic non-container component classes from which a user interface
    may be constructed. These nine classes are class Button, Canvas, Checkbox, Choice,
    Label, List, Scrollbar, TextArea, and TextField.


    +   Swing is a set of program components for Java programmers that provide the
    ability to create graphical user interface (GUI ) components, such as buttons
    and scroll bars, that are independent of the windowing system for specific operating
    system'
