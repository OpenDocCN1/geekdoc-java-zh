    # KEY NOTES


    Concept


    OOPs, concepts in Java are the main ideas behind Java''s Object Oriented Programming.
    They are an abstraction, encapsulation, and polymorphism. Grasping them is key
    to understanding how Java works. Basically, Java OOPs concepts let us create working
    methods and variables, then re-use all or part of them without compromising security


    Object


    An object is a software bundle of related state and behavior. Software objects
    are often used to model the real-world objects that you find in everyday life.
    This state and behavior are represented within an object, introduces the concept
    of data encapsulation, and explains the benefits of designing your software in
    this manner.


    Class


    A class is a blueprint or prototype from which objects are created. This section
    defines a class that models the state and behavior of a real-world object. Intentionally
    focuses on the basics, showing how even a simple class can cleanly model state
    and behavior.


    Learning Objectives


    +   - Discuss about abstraction and encapsulation

    - Explain the inheritance and polymorphism'
