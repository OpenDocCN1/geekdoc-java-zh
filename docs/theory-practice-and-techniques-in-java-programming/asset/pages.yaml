    # Strings as Objects


    A string is a collection of characters grouped together. For example, “hello”
    is a string consisting of the characters ‘h’, ‘e’, ‘l’, ‘l’, and ‘o’. Note that
    a character constant is enclosed in single quotes, whereas a string constant is
    enclosed in double quotes. In Java, a string is an object. As with primitive data
    types, an object does not exist until it is declared.


    Data type is a particular kind of data item, as defined by the values it can take,
    the programming language used, or the operations that can be performed on it.


    The following statement declares a String object variable named greeting:


    ```

    String greeting;

    ```


    The first hint that we are not dealing with a primitive data type, begins with
