    methods removeFirst and removeLast throw an exception if the Deque instance is
    empty.


    # Retrieve


    The methods getFirst and peekFirst retrieve the first element of the Deque instance.
    These methods dont remove the value from the Deque instance. Similarly, the methods
    getLast and peekLast retrieve the last element. The methods getFirst and getLast
    throw an exception if the Deque instance is empty whereas the methods peekFirst
    and peekLast return NULL.


    The 12 methods for insertion, removal and retrieval of Deque elements are summarized
    in the following table:


    | Type of Operation | First Element (Beginning of the Deque instance) | Last Element
    (End of the Deque instance) |

    |---|---||}{

    | Insert | addFirst(e), offerFirst(e) | addLast(e), offerLast(e) |

    | Remove | removeFirst(), pollFirst() | removeLast(), pollLast() |

    | Examine | getFirst(), peekFirst() | getLast(), peekLast() |


    In addition to these basic methods to insert,remove and examine a Deque instance,
    the Deque interface also has some predefined methods. One of these is removeFirstOccurence,
    removes the first occurrence of the specified element if it exists in the Deque
    instance. If the element does not exist then the Deque instance remains unchanged.
