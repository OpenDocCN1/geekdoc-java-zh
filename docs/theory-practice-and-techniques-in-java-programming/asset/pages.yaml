  md: '# 290 Theory, Practice and Techniques in Java Programming


    A one-dimensional array is, essentially, a list of like-typed variables. To create
    an array, you must first create an array of the desired type. The general form
    of a one-dimensional array declaration is


    ```

    var-name[];

    ```


    Here, type declares the base type of the array. The base type determines the data
    type of each element that comprises the array. Thus, base type for the array determines
    what type of data the array will hold. For example, the following declares an
    array named month_days with the type “array of int":


    ```

    int month_days[];

    ```


    Although this declaration establishes the fact that month_days is an array no
    array actually exists. In fact, the value of month_days is set to null, which
    represents an array with no value. To link month days with an actual, physical
    array of integers, you must allocate one new and assign it to month_days. new
    is a special operator that allocates memory.


    The general form of new as it applies to one-dimensional arrays appears as


    ```

    array-var = new[size];

    ```


    Here, type specifies the type of data being allocated, size specifies the number
    of elements in the array, and array-var is the array variable that is linked to
    the array. That is, to use new to allocate an array, you must specify the type
    and number of elements to allocate. The elements in the array allocated by new
    will automatically be initialized to zero. This example allocates a 12-element
    array of integers and links them to month_days.


    ```

    month_days = new int[12];

    ```


    After this statement executes, month_days will refer to an array of 12 integers.


    Let''s review: Obtaining an array is a two-step process. First, you must declare
    a variable of the desired array type. Second, you must allocate the memory that
    will hold the array, using new, and assign it to the array variable. Thus, in
    Java all arrays are dynamically allocated.


    Once you have allocated an array, you can access a specific element in the array
    by specifying its index within square brackets. All index start at zero. For example,
    this statement assigns the value 28 to the second element of month_days.


    ```

    month_days[1] = 28;

    ```'
