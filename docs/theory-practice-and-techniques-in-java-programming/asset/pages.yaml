  md: '# 4.2 JAVA - EXCEPTIONS


    ![](img/c7ab3e310e7811a38d328b7a483bb3ba_149_0.png)


    # Definition


    A program should be able to handle error situations that might occur at runtime.
    Error situations can be divided into two main categories:


    +   * Programming errors. For example, using an invalid index to access an array
    element, attempting to divide by zero, calling a method with illegal arguments
    or using a reference with the null value to access members of an object.

    * Runtime environment errors. For example, opening a file that does not exist,
    a read or write error when using a file, or a network connection going down unexpectedly.'
