  md: '# Applet, AWT and Swing Programming 175


    Components do not stand alone, but rather are found within containers. Containers
    contain and control the layout of components. Containers are themselves components,
    and can thus be placed inside other containers. In the AWT, all containers are
    instances of class Container or one of their subtypes. Spatially, components must
    fit completely within the container that contains them. This nesting of components
    (including containers) into containers creates a tree of elements, starting with
    the container at the root of the tree and expanding out to the leaves, which are
    components such as buttons.


    # Types of Components


    The inheritance relationship between the user interface component classes provided
    by the AWT. Class Component defines the interface to which all components


    The AWT provides nine non-container component classes from which a user interface
    may be constructed. These nine classes are class Button, Canvas, Checkbox, Choice,
    Label, List, Scrollbar, TextArea, and TextField.


    # Types of Containers


    The AWT provides four container classes. They are class Window and its two subtypes
    Frame and class Dialog -- as well as the Panel class. In addition to the containers
    provided by the AWT, the Applet is a container it is a subtype of the Panel class
    and can therefore hold components.


    | Window | A top-level display surface (a window). An instance of the Window class
    is not attached to nor embedded within another container. An instance of the Window
    class has no border and title. |

    | Frame | A top-level display surface (a window) with a border and title. An instance
    of the Frame class may have a menu bar. It is otherwise very much like an instance
    of the Window class. |

    | Dialog | A top-level display surface (a window) with a border and title. An
    instance of the Dialog class cannot exist without an associated instance of the
    Frame class. |

    | Panel | A generic container for holding components. An instance of the Panel
    class provides a container to which to add components.


