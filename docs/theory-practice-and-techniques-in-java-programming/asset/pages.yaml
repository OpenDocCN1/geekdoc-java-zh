  md: 'Theory, Practice and Techniques in Java Programming


    # Making JAR Files for Library Packages


    In addition to directory paths, classpath optionally identifies Java Archive files
    (jar files, or JARs) that house packages. A jar file is a zip file with a .jar
    file extension, instead of a .zip file extension.


    Jar files conveniently distribute packages; a developer needs to only distribute
    a single jar file instead of a package''s multiple files. Furthermore, a developer
    does not need to decipher how to recreate a package''s directory hierarchy a jar
    file internally contains that hierarchy. Finally, compressed jar files reduce
    storage space and speeds transmission over a network compared to equivalent non-
    JAR (Java Archive)-based packages. Recognize these advantages and distributes
    its set of standard packages in a single rt.(runtime) jar file.


    JAR (Java Archive) is a package file format typically used to aggregate many Java
    class files and metadata and resources (text, images, etc.) into one file for
    distribution.


    Let''s convert the earlier testpkg package into a jar file. The following steps
    assume a testpkg directory in the root directory, and AStartStop.class, A.class,
    and B.classfiles in testpkg:


    +   - Open a Windows command window and make sure you are in the c: drive''s root
    directory.

    - Ensure the classpath environment variable does not exist by executing classpath=.

    - Copy the following text into a file manifest and store this file in the root
    directory:

    - Specification-Title: testPkg specification title

    - Specification-Vendor: me

    - Specification-Version: 1.0

    - Implementation-Title: testPkg implementation

    - Implementation-Vendor: you Implementation-Version: 1.0.1

    - Execute jar cfm testpkg.jar. If successful, you should see testpkg.jar appear
    in the root directory.

    - Once testpkg.jar appears, execute deletee testpkg to delete the testpkg directory.'
