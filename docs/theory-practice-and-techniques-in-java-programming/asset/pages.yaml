  md: "# Classes and Objects 45\n\nWhen overriding methods defined in interfaces,\
    \ there are several rules to follow:\n\n+   - Checked exceptions should not be\
    \ declared on implementation methods other than the ones declared by the interface\
    \ method or subclasses of declared by the interface method.\n- The signature of\
    \ the interface method and the same return type or subtype should be maintained\
    \ when overriding the methods.\n- An implementation class itself can be abstract\
    \ and if so, interface methods must not be implemented.\n\nWhen implementation\
    \ interfaces, there are several rules:\n\n+   - A class can implement more than\
    \ one interface at a time.\n- A class can extend only one class, but implement\
    \ many interfaces.\n- An interface can extend another interface, in a similar\
    \ way as a class can extend another class.\n\n# Extending Interfaces\n\nAn interface\
    \ can extend another interface in the same way that a class can extend another\
    \ class. The extends keyword is used to extend an interface, and the child interface\
    \ inherits the methods of the parent interface.\n\nThe following Sports interface\
    \ is extended by Hockey and Football interfaces.\n\nExample\n\n```\n// Filename:\
    \ Sports.java\npublic interface Sports {\n    public void setHomeTeam(String name);\n\
    \    public void setVisitingTeam(String name);\n}\n// Filename: Football.java\n\
    public interface Football extends Sports {\n    public void homeTeamScored(int\
    \ points);\n    public void visitingTeamScored(int points);\n    public void endOfQuarter(int\
    \ quarter);\n}\n// Filename: Hockey.java\n```\n\n![](img/c7ab3e310e7811a38d328b7a483bb3ba_56_0.png)"
