  md: '# Definition


    Java provides a data structure, the array, which stores a fixed-size sequential
    collection of elements of the same type. An array is used to store a collection
    of data, but it is often more useful to think of an array as a collection of variables
    of the same type. Instead of declaring individual variables, such as number0,
    number1, ..., and number99, you declare one array variable as numbers and use
    numbers[0], numbers[1], ..., numbers[99] to represent individual variables.


    An array is a flexible structure for storing a sequence of all values of the same
    type. The values stored in an array are called elements. The individual elements
    are accessed using an integer index. As an analogy, consider post boxes. The boxes
    are indexed with numbers, so you can refer to an individual box by using a description
    “PO Box 884”. You already have experience using an index to indicate positions
    within a String, by calling methods like character or substring. As was the case
    with String indexes, arrays start with 0. This is a convention known as zero-based
    indexing.


    It might seem more natural to have indices that start with 1 instead of 0, but
    Sun declared that Java would use the same indexing scheme that is used in C and
    C++.


    To use an array in a program, you must declare a variable to reference the array,
    and you must specify the type of array the variable can reference. Here is the
    syntax for declaring an array variable —


    # Syntax


    ```

    dataType[] arrayRefVar; // preferred way.

    ```


    or


    ```

    dataType[] arrayRefVar[]; // works but not preferred.

    ```


    The style dataType[] arrayRefVar is preferred. The style dataType arrayRefVar[]
    comes from the C/C++ language and was adopted in Java to accommodate C/


    Zero-based indexing is a way of numbering in which the initial element of a sequence
