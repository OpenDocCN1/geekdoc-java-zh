  md: '# Introduction to Java Programming


    the operating system. Java virtual machines nowadays exist for most operating
    systems.


    We call the JVM a virtual machine because the Java compiler produces compiled
    code whose target machine is this virtual machine instead of a physical processor
    or computer. A Java program is said to be compiled to byte-codes, whose target
    architecture is the Java Virtual Machine, as illustrated by Figure 1.2.


    ![](img/c7ab3e310e7811a38d328b7a483bb3ba_30_0.png)


    **Figure 1.2.** Compilation of a Java program to byte-codes and executing it with
    the VM.


    Figure 1.2 also shows the development process a typical Java programmer uses to
    produce byte codes and execute them. The first box indicates that the Java source
    code is located in a “java” file, which is processed with a Java compiler called
    “javac”. The Java compiler produces a file called “class” file, which contains
    the byte code. The “class” file is then loaded across the network or loaded locally
    on your machine into the execution environment on that platform. Inside that environment
    is the Java virtual machine, which interprets and executes the byte code.


    # Just-in-time Compiler JIT


    In the Java programming language and environment, a just-in-time (JIT) compiler
    is a program that turns Java bytecode (a program that contains instructions that
    must be interpreted) into instructions that can be sent directly to the processor.
    After you have written a Java program, the source language statements are compiled
    by the Java compiler into bytecode rather than code that contains instructions
    that match a particular hardware platform’s processor (for example, an Intel Pentium
    microprocessor or an IBM System/390 processor). The bytecode is platform-independent
    code that can be sent to any platform and run on that platform.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '![](img/c7ab3e310e7811a38d328b7a483bb3ba_31_0.png)


    In the past, most programs written in any language have had to be recompiled,
    and sometimes, rewritten for each computer platform. One of the biggest advantages
    of Java is that you only have to write and compile a program once. The Java on
    any platform will interpret the compiled bytecode into instructions understandable
    by the particular processor. However, the virtual machine handles one bytecode
    instruction at a time. Using the just-in-time compiler (really a second compiler)
    at the particular system platform compiles the bytecode into the particular system
    code (as though the program had been compiled initially on that platform). Once
    the code has been (re-)compiled by the JIT compiler, it will usually run more
    quickly in the computer.


    The just-in-time compiler comes with the virtual machine and is used optionally.
    It compiles the bytecode into platform-specific executable code that is immediately
    executed. Sun Microsystems suggests that it''s usually faster to select the JIT
    compiler option, especially if the method executable is repeatedly reused.'
  merge: -1
