  md: '# Types of Applets


    There are two types of applets


    +   1. It is important to state at the outset that there are two varieties of
    applets based on Applet. The first ones-are use the Abstract Window Toolkit (AWT)
    to provide the graphical user interface (or no GUI at all). This style of applet
    has been available since Java was first created.

    2. The second type of applets are those based on the Swing class JApplet. Swing
    applets use the Swing classes to provide the GUI. Swing offers a richer and easier-to-use
    user interface than does the AWT. Thus, Swing-based applets are now the most popular.
    However, traditional AWT-based applets are still used, especially when only a
    very simple user interface is required. Thus, both AWT- and Swing-based applets
    are valid.


    # Applet Skeleton


    All but the most trivial applets override a set of methods that provide the basic
    mechanism by which the browser or applet viewer interfaces to the applet and controls
    its execution. Four of these methods, init( ), start( ), stop( ), and destroy(
    ), apply to all applets and are defined by Applet. Default implementations for
    all of these methods are provided. Applets do not need to override those methods
    they do not use. However, only very simple applets will not need to define all
    of them.


    AWT-based applets will also often override the paint( ) method, which is defined
    by the AWT Component class. This method is called when the applet''s output must
    be redisplayed. (Swing-based applets use a different mechanism to accomplish this
    task.) These five methods can be assembled into the skeleton shown here:


    ```

    // An Applet skeleton.


    import java.awt.*; import java.applet.*;; /*

    <applet code="AppletSkel" width=300 height=100> </applet>


    /*

    public class AppletSkel extends Applet { // Called first.

    public void init() { // initialization

    /* Called second, after init()). Also called whenever the applet is restarted.
    */ }

    ```'
