    browser.


    void showStatus(String str) : Displays str in the status window of the browser
    or applet viewer. If the browser does not support a status window, then no action
    takes place.


    void start() : Called by the browser when an applet should start (or resume) execution.
    It is automatically called after init() when an applet first begins.


    void stop() : Called by the browser to suspend execution of the applet. Once stopped,
