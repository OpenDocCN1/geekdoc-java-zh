  md: "# Implementing Interfaces\n\nWhen a class implements an interface, you can\
    \ think of the class as signing a contract, agreement to perform the specific\
    \ behaviors of the interface. If a class does not perform all the behaviors of\
    \ the interface, the class must declare itself as abstract.\n\nA class uses the\
    \ implements keyword to implement an interface. The implements keyword appears\
    \ in the class declaration following the extends portion of the declaration.\n\
    \nExample\n\n```\n/* File name : MammalInt.java */\npublic class MammalInt implements\
    \ Animal {\n\npublic void eat() {\n    System.out.println(\"Mammal eats\");\n\
    }\n\npublic void travel() {\n    System.out.println(\"Mammal travels\");\n}\n\n\
    public int noOfLegs() {\n    return 0;\n}\npublic static void main(String args[])\
    \ {\n    MammalInt m = new MammalInt();\n    m.eat();\n    m.travel();\n}\n}\n\
    ```"
