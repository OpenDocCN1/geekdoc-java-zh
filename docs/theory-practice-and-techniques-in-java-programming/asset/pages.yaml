  md: '# Package in Java Programing 265


    The previous steps introduce the following concepts:


    +   - Sun''s SDK includes a jar program that creates and manages jar files.

    A list of options follows jar on the command line. the cfm options are interpreted
    as follows: c creates a jar file, f identifies the jar file as testpkg.jar, and
    m identifies the file containing manifest information. Following cfm are the names
    of the jar file, the manifest file, and the package directory—in the same order
    as the options specified.

    - A manifest file stores metadata, data that describes a jar file''s contents,
    in a jar file. In our example, metadata consists of Specification-Title, Specification-Vendor,
    Specification-Version, Implementation-Title, Implementation-Vendor, and Implementation-Version.


    Now that you have a testpkg.jar, how do you reference that file so you can use
    Ustestpkg1 and Usetestpkg2? Include testpkg.jar and the current directory in your
    classpath environment by executing classpath=testpkg.jar; (or the platform-equivalent).
    Then execute java Usetestpkg1 and Usetestpkg2. You should see the same output
    as you saw earlier in this article.


    # Import Naming Convention for Packages


    Package names are written in all lower case to avoid conflict with the names of
    classes or interfaces. Companies use their reversed Internet domain name to begin
    their package names—for example, com.example.mypack for a package named mypackage
    created by a programmer at example.com. Name collisions that occur within a single
    company need to be handled by convention within that company, perhaps by including
    the region or the project name after the company name (for example, com.example.region.mypack).
    Packages in the Java language itself begin with java or javax. In some cases,
    the domain name may not be a valid package name. This can occur if the domain
    name contains a hyphen or other special character, if the package name begins
    with a digit or other character that is illegal to use as the beginning of a Java
    name, or if the package name contains a reserved Java keyword, such as “int”.
    In this event, the suggested convention is to add an underscore. For example:


    | Legalizing Package Names |

    | Domain Name | Package Name Prefix |

    | hyphenated-name.example.org | org.example.hyphenated_name |

    | example.int | int_example |

    | 123name.example.com | com.example_123name |'
