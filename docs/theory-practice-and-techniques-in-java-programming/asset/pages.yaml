  md: '# 6.2 CLASS FUNDAMENTAL PROPERTIES OF AN OBJECT-ORIENTED SYSTEM


    # Key Notes


    # Definition


    In object-oriented programming, a class is an extensible-code-template for creating
    objects, providing initial values for state and implementations of behavior. In
    many languages, the class name is used as the name for the class, the name for
    the default constructor of the class, and as the type of objects generated by
    instantiating the class; these distinct concepts are easily conflated.


    # Inheritance


    Inheritance provides a powerful and natural mechanism for organizing and structuring
    your software. This section explains how classes inherit state and behavior from
    their superclasses, and explains how to derive one class from another using the
    simple syntax provided by the Java programming language.


    # Interface


    An interface is a contract between a class and the outside world. When a class
    implements an interface, it promises to provide the behavior published by that
    interface. This section defines a simple interface and explains the necessary
    changes for any class that implements it.


    # Package


    A package is a namespace for organizing classes and interfaces in a logical manner.
    Placing your code inside packages makes large software projects easier to manage.
    This section explains why this is useful, and introduces you to the Application
    Programming Interface (API) provided by the Java platform.


    # Learning Objectives


    +   - Learn about object and object reference

    - Focus on declaring a variable to refer to an object

    - Define modifiers, methods nested

    - Explain the inner class and anonymous classes


    # Definition


    If you have never used an object-oriented programming language before, you will
    need to learn a few basic concepts before you can begin writing any code. This
    will introduce you to objects, classes, inheritance, interfaces, and packages.'
