  md: '# # 3 COLLECTION


    # ## 3.1 DEFINITION OF COLLECTION


    # KEY NOTES


    # ### Definition


    A collection is an object that can hold references to other objects. The collection
    interfaces declare the operations that can be performed on each type of collection.
    The classes and interfaces of the collections framework are in package java.util.


    # ### Collections Framework


    The collections framework is a collection of interfaces and classes which helps
    in storing and processing the data efficiently


    The collections framework was designed to meet several goals, such as:


    +   - The framework had to be high-performance. The implementations for the fundamental
    collections (dynamic arrays, linked lists, trees, and hashtables) were to be highly
    efficient.

    - The framework had to allow different types of collections to work in a similar
    manner with a high degree of interoperability.

    - The framework had to extend and/or adapt a collection easily.


    # ### Iterator Interface


    It is one of the predefined interface present in java.util.* package. The purpose
    of this interface is to extract or retrieve the elements of collection variable
    only in forward direction but not in backward direction.


    # ### Learning Objectives


    +   - Discuss about collections framework

    - Explain the iterator interface'
