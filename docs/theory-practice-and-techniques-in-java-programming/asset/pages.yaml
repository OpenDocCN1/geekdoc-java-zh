    # 7.1 FUNDAMENTAL OF PACKAGE


    # KEY NOTES


    Definition


    A package is a namespace that organizes a set of related classes and interfaces.
    Conceptually you can think of packages as being similar to different folders on
    your computer. You might keep HTML pages in one folder, images in another, and
    scripts or applications in yet another.


    Creating a package


    To create a package, you choose a name for the package and put a package statement
    with that name at the top of every source file that contains the types (classes,
    interfaces, enumerations, and annotation types) that you want to include in the
    package.


    Using Packages


    A package is a collection of related classes. It helps Organize your classes into
    a folder structure and make it easy to locate and use them. More importantly,
    it helps improve usability. Each package in Java has its unique name and organizes
    its classes and interfaces into a separate namespace, or name group.


    Learning Objectives


    +   - Declaring package members

    - Compiling the package

    - Importing a single package member

    - The directory structure of packages'
