  md: '# 1.8 Shopping Options


    An Amazon customer wants to buy a pair of jeans, a pair of shoes, a skirt, and
    a top but has a limited budget in dollars. Given different pricing options for
    each product, determine how many options our customer has to buy 1 of each product.
    You cannot spend more money than the budgeted amount.


    Example


    ```

    priceOfJeans = [2,3]

    priceOfShoes = [4]

    priceOfSkirts = [2,3]

    priceOfTops = [1,2]

    budget = 10

    ```


    The customer must buy shoes for 4 dollars since this leaves 6 dollars to spend
    on the other 3 items. Combinations of prices paid for jeans, skirts, and tops
    respectively that add up to 6 dollars or less are [2,2,2], [2,2,1], [3,2,1], [2,3,1].
    There are 4 ways the customer can purchase all 4 items.


    Function description


    Create a function that returns an integer which represents the number of options
    present to buy the four items.


    The function must have 5 parameters:


    ```

    int[] priceOfJeans: An integer array, which contains the prices of the pairs of
    jeans available.

    ```


    ```

    int[] priceOfShoes: An integer array, which contains the prices of the pairs of
    shoes available.

    ```


    ```

    int[] priceOfSkirts: An integer array, which contains the prices of the skirts
    available.

    ```


    ```

    int[] priceOfTops: An integer array, which contains the prices of the tops available.

    ```


    ```

    int dollars: the total number of dollars available to shop with.

    ```


    Constraints


    +   1 ≤ length(priceOfJeans, priceOfShoes, priceOfSkirts, priceOfTops) ≤ 10³

    1 ≤ dollars, prices ≤ 10⁹


    Solution


    To find how many ways the customer can purchase all four items, we can iterate
    the four arrays, combine all its products, and validate that customer cannot spend
    more money than the budgeted amount. The for-each construct helps our code be
    elegant and readable and there is no use of the index.'
