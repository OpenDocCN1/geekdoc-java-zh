  md: "Given an array: {9, 6, 5, 4}\n\nIn the first pass through, we have to make\
    \ three comparisons -> {6, 5, 4, 9}\n\nIn our second passthrough, we have to make\
    \ only two comparisons because we didn't to compare the final two numbers -> {5,\
    \ 4, 6, 9}\n\nIn our third pass through, we have made just one comparison -> {4,\
    \ 5, 6, 9}\n\nIn summarize:\n\n3 + 2 + 1 = 6 comparisons, or (N-1) + (N-2) + (N-3)\
    \ ... + 1 comparisons\n\nMoreover, in this scenario, we need a swap for each comparison.\
    \ Therefore, we have six comparisons and six swaps = 12, which is approximately\
    \ 4^2. As the number of items N increases, the number of steps exponentially grows,\
    \ as shown in the following table.\n\n| N | # steps | N^2 |\n| 4 | 12 | 16 |\n\
    | 5 | 20 | 25 |\n| 10 | 90 | 100 |\n\nTherefore, in Big O Nation, we could say\
    \ that the Bubble Sort algorithm has O(N2) efficiency.\n\n# Tests\n\n```\n@Test\n\
