- pgno: 124
  md: "Log216 = 4\n\nLog32 = 5\n\nThe binary search uses at most LogN key comparisons\
    \ to search in a sorted array of size N. With eight elements, it takes three comparisons,\
    \ with 16 elements takes four comparisons, with 32 elements takes five comparisons,\
    \ and so on.\n\n# How to Find the Time Complexity of an Algorithm\n\nTo find the\
    \ Big O complexity of an algorithm follows the following rules:\n\n+   - Ignore\
    \ the lower order terms\n\n+   - Drop the leading constants\n\nExample: If the\
    \ time complexity of an algorithm is 2n³ + 4n + 3. Its Big O complexity simplifies\
    \ to O(n³).\n\nExample: Given the following algorithm:\n\n```\npublic Integer\
    \ sumOfEvenNumbers(Integer N) {\n  int sum = 0;\n  for (int number = 1; number\
    \ <= N; number++) {\n    if ((number % 2) == 0)\n      sum = sum + number;\n \
    \ }\n  return sum;\n}\n```\n\nFirst, split the code into individual operations\
    \ and then compute how many times it is being executed, as is shown in the following\
    \ table.\n\n| Operation | Number of executions |\n| int sum = 0; | 1 |\n| int\
    \ number = 1; | 1 |\n| number <= N; | N |\n| number++ | N |\n| if ((number % 2)\
    \ == 0) | N |\n| sum = sum + number; | N |\n| return sum; | 1 |\n\nNow, we need\
    \ to sum how many times each operation is executing.\n\nTime complexity = 1 +\
    \ 1 + N + N + N + N + 1 => 4N + 3\n\nBig O complexity = O(N)"
