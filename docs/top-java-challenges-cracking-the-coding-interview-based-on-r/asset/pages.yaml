  md: "# 3.1 Sum of All Even Numbers from 1 to a Given Integer\n\nGiven Integer N,\
    \ calculates the sum of all even numbers from 1 to N.\n\nSolution\n\nIt looks\
    \ like an easy program, but believe me, most experienced programmers during the\
    \ interview forget to use the operator \"%%\" which returns the remainder. If\
    \ it is 0, the number is even; otherwise, it is odd. Listing 3.1 shows the algorithm.\n\
    \nListing 3.1 - Sum of All Even Numbers from 1 to N\n\n```\npublic class NumberUtils\
    \ {\n  public static int sumOfEvenNumbers(int N) {\n    int sum = 0;\n    for\
    \ (int number = 1; number <= N; number++)\n      if ((number % 2) == 0)\n    \
    \    sum = sum + number;\n  \n    return sum;\n  }\n}\n```\n\nOur code runs properly,\
    \ but as Software Engineers, we need to care about code efficiency. The following\
    \ algorithm runs faster than the previous one because it only loops the N/2 times.\n\
    \n```\npublic class NumberUtils {\n  public static int sumOfEvenNumbers(int N)\
    \ {\n    int sum = 0;\n    int number = 2;\n    while (number <= N) {\n      sum\
    \ += number;\n      //increase number by 2, which in definition\n      //is the\
    \ next even number\n      number+=2;\n    }\n    return sum;\n  }\n}\n```\n\n\
    Tests\n\n```\n@Test\npublic void sumOfEvenNumbers_test() {\n  assertEquals(42,\
    \ NumberUtils.sumOfEvenNumbers(12));\n  assertEquals(110, NumberUtils.sumOfEvenNumbers(21));\n\
    }\n```"
