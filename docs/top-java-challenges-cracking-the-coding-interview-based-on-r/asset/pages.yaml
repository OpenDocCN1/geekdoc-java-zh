  md: 'variable, function, or Class.


    | Real situation: | It must be refactored to this: |

    | int sID; //supplier Id | int supplierId; |

    | int artDelPrice; | int articleDeliveredPrice; |


    Even with external dependencies:


    ```

    private Z_E2F_RS_Result e2fResult; //ingredients recordset

    ```


    It must be refactored to:


    private Z_E2F_RS_Result ingredients;


    Imagine that we don''t have the //ingredients comment in e2fResult variable. Then,
    further in any part of our code, when we try to process this variable, we have
    the following sentence:


    ```

    e2f = e2fResult[];

    ```


    And we don''t know what does e2f means! Well, someone suggests asking the person
    responsible for this code. But that guy is not at the office. Well, send it an
    email, and he is on holiday!


    But if, instead, we adopt names that reveal intent from the beginning, we could
    avoid these catastrophic scenarios.


    ```

    ingredient = ingredients[];

    ```


    Throughout this book, you will see how important these practices are to write
    efficient readable algorithms.


    # Test-Driven Java Development


    Test-Driven Development (TDD) is a process, which is based on a procedure called
    green-green-refactor. This procedure consists of a few steps that are repeated
    over and again: Write a test, run all tests, write an implementation code, run
    all tests, refactor code, run all tests.


    While writing tests, we are in the green state. When the test implementation is
    ready, all tests should pass, and then we will be in the green state.


    In Java, we use JUnit libraries to implement our test cases. Throughout this book,
    we will omit, in some cases, the definition of a Java Test Class and focus only
    on the methods with @Test annotations.'
