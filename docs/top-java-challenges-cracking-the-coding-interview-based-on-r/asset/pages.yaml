- pgno: 47
  md: "Explanation:\n\nStep 1: Assemble the parts of sizes 4 and 6 (time required\
    \ is 10). Then, the size of the remaining parts for merging: [8,10,12].\n\nStep\
    \ 2: Assemble the parts of sizes 8 and 10 (time required is 18). Then, the size\
    \ of the remaining parts after merging: [18,12].\n\nStep 3: Assemble the parts\
    \ of sizes 18 and 12 (time required is 30).\n\nThe total time required to assemble\
    \ the parts is 10+18+30=58.\n\n# Solution\n\nWe order the parts, then calculates\
    \ the time between the two consecutive parts of small sizes until we arrive at\
    \ the last part. Listing 3.10 shows the algorithm.\n\nListing 3.10 – Assemble\
    \ Parts in Minimum Time\n\n```\npublic class AssembleParts {\n    public static\
    \ int minimumTime(int numOfParts, List<Integer> list) {\n        int[] arrayOfSizes\
    \ = list.stream().mapToInt(i -> i).toArray();\n        Arrays.sort(arrayOfSizes);\n\
    \n        int accumulatedTime = 0;\n        for (int idx = 0; idx < arrayOfSizes.length\
    \ - 1; idx++) {\n            accumulatedTime += arrayOfSizes[idx] + arrayOfSizes[idx\
    \ + 1];\n            // once assembled, we carry the current time to the next\
    \ element\n            // so in the next iteration, the first of the next two\
    \ parts\n            // it will already include the total time required\n    \
    \        // to assemble the two previous parts\n            arrayOfSizes[idx +\
    \ 1] = arrayOfSizes[idx] + arrayOfSizes[idx + 1];\n        }\n        return accumulatedTime;\n\
    \    }\n}\n```\n\n# Tests\n\n```\n@Test\npublic void test_right_values() {\n \
    \   assertTrue(AssembleParts.minimumTime(4,\n        new ArrayList<Integer>(Arrays.asList(8,\
    \ 4, 6, 12))) == 58);\n    assertTrue(AssembleParts.minimumTime(5,\n        new\
    \ ArrayList<Integer>(Arrays.asList(3, 7, 2, 10, 5))) == 59);\n}\n```"
