  md: "```\npublic class Sorting {\n    public int[] quickSort(int[] numbers, int\
    \ lo, int hi) {\n        if (lo < hi) {\n            int partition_border = partition(numbers,\
    \ lo, hi);\n            //sort elements recursively\n            quickSort(numbers,\
    \ lo, partition_border - 1);\n            quickSort(numbers, partition_border\
    \ + 1, hi);\n        }\n        return numbers;\n    }\n\n    private int partition(int[]\
    \ numbers, int lo, int hi) {\n        //element to be placed at right position\n\
    \        int pivot = numbers[hi];\n        int i = lo - 1; //index of smaller\
    \ element\n        for (int j = lo; j < hi; j++) {\n            //swap when element\
    \ smaller than pivot\n            if (numbers[j] < pivot) {\n                i++;\n\
    \                int aux = numbers[i];\n                numbers[i] = numbers[j];\n\
    \                numbers[j] = aux;\n            }\n        }\n        numbers[hi]\
    \ = numbers[i + 1];\n        return i + 1;\n    }\n}\n```\n\n# Tests\n\n```\n\
