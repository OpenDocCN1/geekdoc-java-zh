  md: '# Queue


    A Queue is an abstract data type, which includes a collection of objects that
    follow the first-in-out (FIFO) principle, i.e., the element inserted at first
    is the first element to come out of the list.


    Queues have the following constraints:


    +   * An *enqueue* operation allows inserting data at the end of a Queue.

    * A *dequeue* operation allows deleting data from the front of a Queue.

    * It can read only the element at the front of a Queue, called a front.


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_61_0.png)


    Queues are helpful to handle waiting times, for example:


    +   * Call centers, theaters, and other similar services process customer requests
    using the FIFO principle.


    # 6.1 Delimiter Matching


    Check if the parentheses, braces, and brackets in an expression are balanced.
    In doing so, we must ensure that:


    +   * Each opening symbol on the left delimiter matches a closing symbol on the
    right delimiter.

    * Left delimiters that occur later should be closed before occurring earlier.


    # Solution


    We use a *stack* data structure to ensure two limiting symbols match up correctly
    (right pair). Why Stack? Insertion and deletion of elements take place at one
    end the top of the Stack. The JDK includes the `Java.Stack` data structure. The
    *push* method adds an item to the top of this Stack. The *pop* method removes
    the element at the top of this Stack.


    +   * Iterate every character from the given expression. If it is an opening symbol,
    push that onto the Stack. If it is a closing symbol, pop an element from a Stack
    (the last opening symbol added) and check that they are the right pair.'
