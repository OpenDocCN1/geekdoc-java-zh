  md: '# Arrays and Strings


    # 1.0 Fundamentals


    Arrays


    An array is an object that stores a fixed number of elements of the same data
    type. It uses a contiguous memory location to store the elements. Its numerical
    index accesses each element.


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_10_0.png)


    Figure 1.0.1 Array


    If you ask the Array, give me the element at 4, the computer locates element''s
    cell in a single step.


    That happens because the computer finds the memory address where the Array begins-1000
    in the figure above - and adds 4, so the element will be located at memory address
    1004.


    Arrays are a linear data structure because the elements are arranged sequentially
    and accessed randomly.


    One of the limitations of the Array is that adding or deleting data takes a lot
    of time.


    In a one-dimensional array, you retrieve a single value when accessing each index.


    ```

    //declares an array of integers

    int[] arrayOfInts;

    //allocates memory for 10 integers

    arrayOfInts = new int[10];

    ```'
