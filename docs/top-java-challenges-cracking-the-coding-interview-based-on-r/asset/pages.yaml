  md: 'There are two ways to create a String object:


    +   1. By string literal


    ```

    String myString = "literal of";

    ```


    The java compiler creates and places a new string instance in the string constant
    pool. This avoids to create two instances with the same value.


    +   2. By new keyword


    ```

    String s = new String("hello world");

    ```


    The java compiler creates a new string object in the heap memory. The variable
    s refers to the object.


    ```

    myString + "chars.",

    ```


    The previous concatenation creates a third String object in memory. That is because
    Strings are immutable, they cannot change once it is created. A mutable StringBuilder
    class if you want to manipulate the contents of the string on the fly.


    ```

    StringBuilder stringOnFly = new StringBuilder();

    stringOnFly.append(myString).append("chars");

    ```


    String, StringBuffer and StringBuilder implements the CharSequence interface that
    is used to represent a sequence of characters.


    # 1.1 Reverse a Text


    Given a string of characters, reverse the order of the characters in an efficient
    manner.


    # Solution


    We choose an array - holds values of a single type - as our data structure because
    the algorithm receives a small amount of data, which is predictable and can be
    read randomly (its numerical index accesses each element).


    Firstly, convert the text to be reversed to a character array. Then, calculate
    the length of the string.


    Secondly, swap the position of array elements using a loop. Don''t use additional
    memory, which means avoiding unnecessary objects or variables (space complexity).
    Swapping does it in place by traversing values using a temporary variable. Then,
    swap the first element with the last, the second element with the penultimate,
    and so on. Moreover, we only need to iterate until half of the Array.


    Finally, it returns the new character array as a String. Listing 1.1 shows the
    algorithm.


    Listing 1.1 - Reverse a Text'
