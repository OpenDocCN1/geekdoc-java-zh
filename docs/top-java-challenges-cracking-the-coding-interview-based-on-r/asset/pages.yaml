    \ an iterative method.\n\n+   1. Initialize three-pointers: prev as NULL, current\
    \ as head, and next as NULL.\n2. Iterate through the linked list. Inside the loop,\
    \ do the following:\n\n```\n// Before changing next of current, store next node\n\
    next = current->next\n\n// Now change next of current, here is where actual reversing\
    \ happens\ncurrent->next = prev\n\n// Move prev and current one step forward\n\
    prev = current\ncurrent = next\n```\n\nListing 2.2 - Reverse a Linked List\n\n\
    ```\npublic void reverse() {\n  if (head == null) {\n    return;\n  }\n\n  Node\
    \ prev = null;\n  Node current = head;\n  Node next = null;\n  while (current\
    \ != null) {\n    next = current.next;\n    current.next = prev;\n    prev = current;\n\
    \    current = next;\n  }\n  head = prev;\n}\n```\n\nLet's see what happens at\
    \ the reverse method in the first iteration of a LinkedListList:"
