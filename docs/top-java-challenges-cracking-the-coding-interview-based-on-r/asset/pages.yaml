  md: "# 3.8 Write an Immutable Class to convert Currencies\n\nDesign a Money Class,\
    \ which can convert Euros to Dollars and vice versa. As examples, write two instances\
    \ with the following values: 67.89 EUR and 98.76 USD\n\nSolution\n\nAn immutable\
    \ class is a class whose instances cannot be modified. Its information is fixed\
    \ for the lifetime of the object without changes.\n\nTo make a class immutable,\
    \ we follow these rules:\n\n+   - Don't include a mutators method that could modify\
    \ the object's state.\n\n+   - Don't allow to extend the Class.\n\n+   - Make\
    \ all class members final and private\n\n+   - Ensure exclusive access to any\
    \ mutable components. Don't make references to those objects. Make defensive copies.\n\
    \nImmutable objects are thread-safe; they require no synchronization. We use a\
    \ BigDecimal data type for our Class because it provides operations on numbers\
    \ for arithmetic, rounding and can handle large floating-point numbers with great\
    \ precision. Listing 3.8 shows an immutable Class.\n\nListing 3.8 - Money Class\n\
    \n```\nimport java.math.BigDecimal;\npublic final class Money {\n    private static\
    \ final String DOLLAR = \"USD\";\n    private static final String EUR = \"EUR\"\
    ;\n    private static int ROUNDING_MODE = BigDecimal.ROUND_HALF_EVEN;\n    private\
    \ static int DECIMALS = 2;\n    private BigDecimal amount;\n    private String\
    \ currency;\n\n    public Money() {\n}\n\n    public static Money valueOf(\n \
    \       BigDecimal amount,\n        String currency) {\nreturn new Money(amount,\
    \ currency);\n}\n```"
