  md: '# PREFACE


    I am a software engineer who faced real interviews as a candidate for startups
    and big companies. Throughout the years, I have sourced factual questions that
    have been tried, tested, and commented on step by step and are now part of this
    book! I hope you find them practical and valuable in your career search.


    Yes, your CV matters. The job market is tough, and big firms and tech startups
    receive many applicants every day, so the need to filter the one becomes a daunting
    process. The interview by phone and the code challenge to be solved at home will
    lead you to the last and most decisive stage of the recruiting process, where
    the interviewer evaluates your problem-solving skills and knowledge of efficient
    data structures and algorithms.


    Usually, the interviewer poses a complex problem to solve in a limited time. You
    need to provide rationales about design choices made in your proposed solution
    in terms of resource and efficiency.


    Therefore, knowing the most appropriate data structures and algorithms to solve
    complex problems frequently used in the recruiting process can be decisive. Whether
    your knowledge of efficient data structures and algorithms is scarce or buried
    in your memory since you learned them for the first time, this book can help you.
    It includes the most common questions, and their respective solutions, that you
    can find in a real interview. Recall, the more prepared you are, the more points
    you accumulate objectively concerning other candidates.


    This book includes typical questions based on real interviews that you must know
    and practice. All solved and explained in detail.


    Typical questions include String manipulation, arrays, variables swapping, linked
    list, refactoring, recursion, searching, stacks, queues, trees, graphs, optimization,
    and games. In these questions, you can see how to choose the proper data structure
    for their optimal implementation.


    Also included are questions where you can design an algorithm based on the test
    development-driven approach, which is exceptionally essential for today''s companies.


    The more prepared and confident you are, the better the chances of negotiating
    your next salary.


    Moises Gamio


    Software Engineer, Senior Java Developer'
