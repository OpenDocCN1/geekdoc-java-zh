  md: "# 6.2 Queue via Stacks\n\nBuild a queue data structure using only two internal\
    \ stacks.\n\n# Solution\n\nStacks and Queues are abstract in their definition.\
    \ That means, for example, in the case of Queues, we can implement its behavior\
    \ using two stacks.\n\nThen we create two stacks of Java.util.Stack, inbox, and\
    \ outbox. The add method pushes elements onto the inbox. And the peek method will\
    \ do the following:\n\n+   - If the inbox is empty, refill it by popping each\
    \ element from the inbox and pushing it onto the outbox.\n\n+   - Pop and return\
    \ the top element from the outbox.\n\n![](img/60b89ebeda3428b712e02fb7e9fd8b5b_63_0.png)\n\
    \nListing 6.2 - Queue via Stacks\n\n```\nimport java.util.Stack;\npublic class\
    \ QueueViaStacks<T> {\nnStack<T> inbox;\nStack<T> outbox;\n\npublic QueueViaStacks()\
    \ {\n  inbox = new Stack<T>();\n  outbox = new Stack<T>();\n}\n}\n```"
