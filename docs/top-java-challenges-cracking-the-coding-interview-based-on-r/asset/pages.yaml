    \ \", \");\n            } else if (i % 3 == 0) {\n                System.out.print(FIZZ\
    \ + \" \", \");\n            } else if (i % 5 == 0) {\n                System.out.print(BUZZ\
    \ + \" \", \");\n            } else {\n                System.out.print(i + \"\
    , \");\n            }\n        }\n    }\n} \n```"
