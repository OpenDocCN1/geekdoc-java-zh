  md: "# 3.2 Validate a Leap Year\n\nA leap year is a calendar year containing an\
    \ additional day. This extra day occurs in February. The following rules define\
    \ a leap year:\n\n+   - A year will be a leap year if it is divisible by 4, but\
    \ not by 100\n- A year will be a leap year if it is divisible by 400.\n\nSolution\n\
    \nWe use the % operator to verify if a year is divisible by 4, 100, or 400. Listing\
    \ 3.2 shows the algorithm.\n\nListing 3.2 - Validate a Leap Year\n\n```\npublic\
    \ class DateUtils {\n    public static boolean isLeapYear(int year) {\n      \
    \  return (year % 400 == 0) ||\n            (year % 4 == 0 && year % 100 != 0);\n\
    \    }\n}\n```\n\nThis algorithm had a real application in the Y2K problem, where\
    \ COBOL programs in a Bank used to store four-digit years with only the final\
    \ two digits, so you could not distinguish 2000 from 1900. In addition to calculating\
    \ a leap year:\n\nFor years represented from 50 to 99, add 19 at begin, resulting\
    \ in 1950 until 1999.\nFor years represented from 00 to 49, add 20 at begin, resulting\
