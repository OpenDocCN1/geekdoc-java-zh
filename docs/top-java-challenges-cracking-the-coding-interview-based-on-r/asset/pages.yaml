- pgno: 52
  md: "```\npublic class Sorting {\n    public int[] bubbleSort(int[] numbers) {\n\
    \        if (numbers == null)\n            throw new RuntimeException(\"array\
    \ not initialized\");\n\n        boolean numbersSwapped;\n        do {\n     \
    \       numbersSwapped = false;\n            for (int i = 0; i < numbers.length\
    \ - 1; i++) {\n                if (numbers[i] > numbers[i + 1]) {\n          \
    \          int aux = numbers[i + 1];\n                    numbers[i + 1] = numbers[i];\n\
    \                    numbers[i] = aux;\n                    numbersSwapped = true;\n\
    \                }\n            }\n        } while (numbersSwapped);\n\n     \
    \   return numbers;\n    }\n}\n```\n\n# Example:\n\nFirst pass-through:\n{6, 4,\
    \ 9, 5} -> {4, 6, 9, 5} swap because of 6 > 4\n{4, 6, 9, 5} -> {4, 6, 9, 5}\n\
    {4, 6, 9, 5} -> {4, 6, 5, 9} swap because of 9 > 5\nNumbersSwapped=true\n\nSecond\
    \ pass-through:\n{4, 6, 5, 9} -> {4, 6, 5, 9}\n{4, 6, 5, 9} -> {4, 5, 6, 9} swap\
    \ because of 6 > 5\n{4, 5, 6, 9} -> {4, 5, 6, 9}\nNumbersSwapped=true\n\nThird\
    \ pass-through:\n{4, 5, 6, 9} -> {4, 5, 6, 9}\n{4, 5, 6, 9} -> {4, 5, 6, 9}\n\
    {4, 5, 6, 9} -> {4, 5, 6, 9}\nNumbersSwapped=false\n\nEfficiency of bubble sort\n\
    \nIn a worst-case scenario, where the Array comes in descending order, we need\
    \ a swap for each comparison. In our algorithm, a comparison happens when we compare\
    \ adjacent pairs of elements to determine which one is greater."
