- pgno: 121
  md: '# Big O Notation


    Big O Notation is a mathematical notation that helps us analyze how complex an
    algorithm is in terms of time and space. When we build an application for one
    user or millions of users, it matters.


    We usually implement different algorithms to solve one problem and measure how
    efficient one is with respect to the other ones.


    # Time and Space Complexity


    Time complexity is related to how many steps take the algorithm.


    Space complexity is related to how efficient the algorithm is using the memory
    and disk.


    Both terms depend on the input size, the number of items in the input. We can
    analyze the complexity based on three cases:


    +   - Best case or Big Omega Ω(n): Usually, the algorithm executes independently
    of the input size in one step.


    +   - Average case or Big Theta Θ(n): When the input size is random.


    +   - Worst-case or Big O Notation O(n): Gives us an upper bound on the runtime
    for any input. It gives us a kind of guarantee that the algorithm will never take
    any longer with a new input size.


    # Order of Growth of Common Algorithms


