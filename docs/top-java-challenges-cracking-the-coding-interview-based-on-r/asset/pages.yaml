  md: "# 3.3 Given an Integer N, Returns the Smallest Number of Digits\n\nWrite a\
    \ method, given an original number N of $d digits$, returns the smallest number\
    \ with the same number of digits. For example, given N=4751, the method should\
    \ return 1000. Given N=1, the method should return 0.\n\nSolution\n\nMaybe the\
    \ first idea that comes to our minds could be to iterate from the given number\
    \ and decrease one by one, and in every iteration to check if every new number\
    \ contains one digit less than the previous number. If the answer is True, the\
    \ previous one is the smallest number with the same number of digits as the original\
    \ number. Listing 3.3 shows the first algorithm for positive numbers.\n\nListing\
    \ 3.3 - Given an Integer N, Returns the Smallest Number of Digits\n\n```\npublic\
    \ class NumberUtils {\n    public static int smallest(int N) {\n        int smallestNumber\
    \ = 0;\n        if (N <= 1)\n            return smallestNumber;\n\n        int\
    \ numberOfDigitsOriginalN = String.valueOf(N).length();\n        while (N > 0)\
    \ {\n            if (String.valueOf(N).length() == (numberOfDigitsOriginalN -\
    \ 1)) {\n                return ++N;\n            }\n        }\n        return\
    \ smallestNumber;\n    }\n}\n```\n\nBut if we realize, the solution follows a\
    \ particular pattern:\n\nN = 4751 -> smallest number = 1000\nN = 189 -> smallest\
    \ number = 100\nN = 37 -> smallest number = 10\n\nThe smallest number is a power\
    \ of 10, where the exponent is: number of digits - 1\n\nSecond solution:"
  merge: -1
  img_proc: true
- pgno: 37
  md: "```\npublic static int smallest(int N) {\n    int smallestNumber = 0;\n   \
    \ if (N <= 1 || String.valueOf(N).length() == 1) {\n        return smallestNumber;\n\
    \    }\n    int numberOfOfDigits = String.valueOf(N).length();\n    return (int)\
    \ Math.pow(10, numberOfOfDigits - 1);\n}\n```\n\nIf we want to include negative\
    \ numbers, we must consider the smallest number with the same number of digits\
    \ and the same sign. Here the solution:\n\n```\npublic class NumberUtils {\n \
    \   public static int smallest(int N) {\n        int numberOfOfDigits = (int)\
    \ String.valueOf(Math.abs(N)).length();\n        if (N >= 0) {\n            if\
    \ (numberOfOfDigits == 1) {\n                return 0;\n            } else {\n\
    \                return (int) Math.pow(10, numberOfOfDigits - 1);\n          \
    \  }\n        } else {\n            return 1 - (int) Math.pow(10, numberOfOfDigits);\n\
    \        }\n    }\n```\n\nThe main idea in Analysis of Algorithms is always to\
    \ improve the algorithm performance by reducing the number of steps and comparisons.\
    \ The simpler and more intuitive an algorithm is, the more useful and efficient\
    \ it will be.\n\n# Tests\n\n```\n@Test\npublic void test_right_smallest_values()\
    \ {\n    assertTrue(NumberUtils.smallest(4751) == 1000);\n    assertTrue(NumberUtils.smallest(189)\
    \ == 100);\n    assertTrue(NumberUtils.smallest(37) == 10);\n    assertTrue(NumberUtils.smallest(1)\
    \ == 0);\n    assertTrue(NumberUtils.smallest(0) == 0);\n    assertTrue(NumberUtils.smallest(-1)\
    \ == -0);\n    assertTrue(NumberUtils.smallest(-38) == -99);\n}\n```\n\n```\n\
    @Test\npublic void test_wrong_smallest_values() {\n    assertFalse(NumberUtils.smallest(8)\
    \ == 1);\n    assertFalse(NumberUtils.smallest(2891) == 2000);\n}\n```"
