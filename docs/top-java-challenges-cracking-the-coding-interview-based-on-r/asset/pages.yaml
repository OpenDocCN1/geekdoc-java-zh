  md: "0, 1, 1, 2, 3, 5, 8, 13, 21, ...\n\nThe first two numbers of the Fibonacci\
    \ series are 0 and 1.\n\nExamples:\n\nFibonacci of 7 is: 13\n\nFibonacci of 10\
    \ is: 55\n\nDefines a method to calculate the Fibonacci Series using Recursion.\n\
    \n# Solution\n\nWe define two base cases:\n\nfibonacci(0) = 0 and fibonacci(1)\
    \ = 1\n\nWe calculate the ith Fibonacci number recursively:\n\nfibonacci(N) =\
