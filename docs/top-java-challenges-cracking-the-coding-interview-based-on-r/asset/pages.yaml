  md: "# Listing 1.6 Rotate a Matrix by 90 Degrees.\n\n```\npublic class MatrixUtils\
    \ {\n    public static void rotate(int[][] matrix) {\n        int n = matrix.length;\n\
    \        if (n < 1)\n            return;\n\n        /* layers */\\n        for\
    \ (int i = 0; i < n / 2; i++) {\n            /* elements */\\n            for\
    \ (int j = i; j < n - i - 1; j++) {\n                //Swap elements in clockwise\
    \ direction\n                //temp = top-left\n                int temp = matrix[i][j];\n\
    \                //top-left <- bottom-left\n                matrix[i][j] = matrix[n\
    \ - 1 - j][i];\n                //bottom-left <- bottom-right\n              \
    \  matrix[n - 1 - j][i] = matrix[n - 1 - i][n - 1 - j];\n                //bottom-right\
    \ <- top-right\n                matrix[n - 1 - i][n - 1 - j] = matrix[j][n - 1\
    \ - i];\n                //top-right <- top-left\n                matrix[j][n\
    \ - 1 - i] = temp;\n            }\n        }\n    }\n}\n```\n\n# Tests\n\n![](img/60b89ebeda3428b712e02fb7e9fd8b5b_21_0.png)\n\
