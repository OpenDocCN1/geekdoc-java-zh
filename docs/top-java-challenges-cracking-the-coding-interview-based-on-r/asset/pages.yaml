  md: 'When chars.length is 100, then:


    Total run time:


    O(1) + O(1) + O(100/2) + O(1) = 1 + 1 + 50 + 1 = 53


    But 53 ~ 50 → (N/2)


    If 50 executions depend on N/2, and N/2 depend on N


    Then, we can say that 50 executions depend on N as well.


    When chars.length is 100000, then:


    Total run time:


    O(1) + O(1) + O(100000/2) + O(1) = 1 + 1 + 50000 + 1 = 50003


    But 50003 ~ 50000 → (N/2)


    If 50000 executions depend on N/2, and N/2 depend on N


    Then, we can say that 50000 executions depend on N as well.


    Therefore, we can say that our Reverse Text algorithm runs in O(N) time.


    # 1.2 Validate if a String Has All Unique Characters


    Given a string of characters, validate if all of them are unique.


    Solution


    We assume the charset is ASCII, but you should always ask interviewers if you
    are unsure. Originally based on the English alphabet, ASCII encodes 128 specified
    into seven-bit integers. Ninety-five of the encoded characters are printable:
    these include the digits 0 to 9, lowercase letters a to z, uppercase A to Z, and
    punctuation symbols.


    Firstly, iterate the string, use the java charAt method to return the numerical
    representation for every character. Check this value in the Boolean Array. If
    it exists, the string does not have unique values. Otherwise, store this value
    in the Boolean Array as its first occurrence.


    Finally, if all characters had only one occurrence in the Boolean Array, the string
    has all unique characters. Listing 1.2 shows the algorithm.


    +   Listing 1.2 - Validate if a String Has All Unique Characters'
