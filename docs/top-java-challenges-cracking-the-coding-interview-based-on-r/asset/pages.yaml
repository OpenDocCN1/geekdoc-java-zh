  md: "# Recursion\n\n# 4.0 Fundamentals\n\nA method or function that calls itself\
    \ is called recursion. A recursive function is defined in terms of itself. We\
    \ always include a base case to finish the recursive calls.\n\nEach time a function\
    \ calls itself, its arguments are stored on the Stack before the new arguments\
    \ take effect. Each call creates new local variables. Thus, each call has its\
    \ copy of arguments and local variables.\n\nThat is one reason sometimes we don't\
    \ use recursion in the Production environment; for example, when we pass a big\
    \ integer, they can overflow the Stack and crash any application. But in other\
    \ cases, we can efficiently solve problems.\n\n# 4.1 Calculate Factorial of a\
    \ Given Integer N\n\nThe Factorial is the product of all positive integers less\
    \ than or equal to the non-negative integer. In real life, the Factorial is the\
    \ number of ways you can arrange n objects.\n\nSolution\n\n+   We define the base\
    \ case: returns 1 when N <= 1 to stop the recursion\n\n+   We use a recursive\
    \ formula: N * factorial(N - 1)\n\nListing 4.1 - Calculate Factorial of a Given\
    \ Integer N\n\n```\npublic class FactorRecursive {\n  public static int factorial(int\
    \ N) {\n    //base case\n    if (N <= 1)\n      return 1;\n    else\n      //recursive\
    \ call\n      return (N * factorial(N - 1));\n  }\n}\n```\n\nThe following figure\
    \ shows in the first half how a succession of recursive calls executes until factorial(1)\
    \ - the base case - returns 1, which stops the recursion. The second half shows\
    \ the values calculated and returned from each recursive call to its caller."
  merge: -1
  img_proc: true
- pgno: 49
  md: "```\nfactorial(6)\n= 6 * factorial(5)\n= 6 * 5 * factorial(4)\n= 6 * 5 * 4\
    \ * factorial(3)\n= 6 * 5 * 4 * 3 * factorial(2)\n= 6 * 5 * 4 * 3 * 2 * factorial(1)\n\
    = 6 * 5 * 4 * 3 * 2 * 1\n= 6 * 5 * 4 * 6\n= 6 * 5 * 24\n= 720\n```\n\nFigure 4.1\
    \ N Factorial\n\nThe following Listing shows the iterative version (and more efficient).\n\
    \n```\npublic class FactorIterative {\n    public static int factorial(int N)\
    \ {\n        int result = 1;\n        for (int i = 2; i <= N; i++)\n         \
    \   result *= i;\n        return result;\n    }\n}\n```\n\n# Tests\n\n```\n@Test\n\
    public void test_right_results() {\n    assertTrue(FactorialRecursive.factorial(1)\
    \ == 1);\n    assertTrue(FactorialRecursive.factorial(0) == 1);\n    assertTrue(FactorialRecursive.factorial(3)\
    \ == 6);\n    assertTrue(FactorialRecursive.factorial(6) == 720);\n}\n```\n\n\
    ```\n@Test\npublic void test_wrong_results() {\n    assertFalse(FactorialRecursive.factorial(3)\
