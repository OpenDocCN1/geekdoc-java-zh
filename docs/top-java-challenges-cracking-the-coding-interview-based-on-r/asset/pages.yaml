    \    assertArrayEquals(expected, numbers);\n}\n```\n\n# 5.3 Quick Sort\n\nQuickSort\
    \ is a divide and conquer algorithm. Given an array, it picks an element as a\
    \ pivot and partitions the given array around the chosen pivot.\n\n# Solution\n\
    \nGiven an array, we execute the following in-place steps:\n\n+   1. We pick from\
    \ the Array, the last element as our pivot.\n\n+   2. We execute a partition operation,\
    \ where we put all smaller elements before the pivot and put all greater elements\
    \ after the pivot. After this reorder of elements, the pivot is in its final and\
    \ correct position.\n\n+   3. Apply the above steps recursively to every sub-array\
    \ of elements.\n\nListing 5.3 - Quick Sort"
