  md: "# 1.5 Remove Duplicates from a List\n\nWrite a program to check if a list has\
    \ any duplicates, and if it does, it removes them.\n\nSolution\n\nMaybe your first\
    \ idea is to iterate through the list. You compare every item with the other ones.\
    \ If a duplicate is detected, it is removed. Or may you traverse the list and\
    \ store the first occurrence of each item in a new list and ignore all the next\
    \ occurrences of that item. Those solutions are brute force algorithms because\
    \ they use straightforward methods of solving a problem, but sometimes the interviewer\
    \ expects to reuse the libraries included in the JDK, which improves efficiency.\n\
    \nWe use the Set interface from the Collections library. By definition, Set does\
    \ not allow duplicates. Then, we use the sort method to order its items.\n\nA\
    \ Comparable interface sorts lists of custom objects in natural ordering. List\
    \ of Objects that implement Comparable (e.g., String) can be sorted automatically\
    \ by Collections.sort.\n\nLinkedHashSet(Collection list) is used to initialize\
    \ a HashSet with the list, removing the duplicates. List 1.5 shows this implementation.\n\
    \n```\npublic class ListUtils {\n    public static <E extends Comparable<E>>n\
    \    List<E> removeDuplicatesAndOrder(List<E> list) {\n        Set<E> set = new\
    \ LinkedHashSet<>(list);\n        ArrayList<E> arrayList = new ArrayList<>(set);\n\
    \        Collections.sort(arrayList);\n        return arrayList;\n    }\n}\n```\n\
    \n# Tests\n\n```\n@Test\npublic void versionNumberUsesCases() {\n    assertEquals(0,\
    \ VersionNumber.compare(\"15\", \"15.0\\));\n    assertEquals(0, VersionNumber.compare(\"\
    10.1\", \"10.1.0\\));\n    assertEquals(-1, VersionNumber.compare(\"10.1\", \"\
    10.1.1\\));\n    assertEquals(1, VersionNumber.compare(\"10.1.2\", \"10.1.1\\\
    ));\n}\n```"
