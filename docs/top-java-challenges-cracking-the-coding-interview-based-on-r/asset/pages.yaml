  md: '# Trees


    # 8.0 Fundamentals


    Tree


    A tree is a data structure that consists of nodes connected by edges.


    Tree structures are non-linear data structures. They allow us to implement algorithms
    faster than when using linear data structures.


    # Binary Tree


    A binary tree can have at most the two children: a left node and a right node.
    Every node contains two elements: a key used to identify the data stored by the
    node and a value that is collected in the node. The following figure shows the
    binary tree terminology


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_73_0.png)


    Figure 8.0 Binary Search Tree - terminology


    # Binary Search Tree


    The most common type of binary tree is the Binary Search Tree, which has two main
    characteristics:


    +   - The value of the left Node must be less than the value of its parent.'
