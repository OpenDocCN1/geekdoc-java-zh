  md: "```\nimport java.util.function.BiFunction;\npublic class IsNumberValidPowerOfBase\
    \ implements\nBiFunction<Integer, Integer, Boolean> {\n\n    @Override\n    public\
    \ Boolean apply(Integer number, Integer base) {\n        return isNumberValidPowerOfBase(number,\
    \ base);\n    }\n\n    static boolean isNumberValidPowerOfBase(int number, int\
    \ base) {\n        if (number == 0) {\n            return true;\n        }\n\n\
    \        while (number != 1) {\n            if ((number % base) != 0) {\n    \
    \            return false;\n            }\n            number = number / base;\n\
    \        }\n        return true;\n    }\n}\n```\n\n# Tests\n\n```\n@Test\npublic\
    \ void testOfWrongReturnValues() {\n    assertFalse(isNumberValidPowerOfBase.apply(6,\
    \ 2));\n    assertFalse(isNumberValidPowerOfBase.apply(16, 5));\n    assertFalse(isNumberValidPowerOfBase.apply(14,\
    \ 7));\n}\n```\n\n```\n@Test\npublic void testValidReturnValues() {\n    assertTrue(isNumberValidPowerOfBase.apply(243,\
    \ 3));\n    assertTrue(isNumberValidPowerOfBase.apply(16, 4));\n    assertTrue(isNumberValidPowerOfBase.apply(125,\
    \ 5));\n}\n```\n\n# 3.6 Validate If a Number Is Prime or Not\n\nA prime number\
