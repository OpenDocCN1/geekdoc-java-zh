    \ as visited and added to the queue.\n3. When the previous iteration cannot find\
    \ more adjacent vertices, we retrieve and remove the new head Vertex.\n\n# Listing\
    \ 9.2.2 - Breath-first search algorithm\n\n```\nimport java.util.*;\nimport java.util.concurrent.ConcurrentHashMap;\n\
