- pgno: 82
  md: 'A Graph is connected if there is at least one path from every vertex to every
    other vertex. The figure above is connected because all cities are connected.


    # Directed and Weighted Graphs


    A Graph is directed when the edges have a direction. In the figure above, we have
    a non-directed graph because the hyperloop can usually go either way. From Berlin
    to Leipzig is the same as from Leipzig to Berlin.


    Graphs are called a weighted graph when edges are given weight, e.g., the distance
    between two cities can be weighted in how fast they are connected.


    A graph answer one of the questions: which cities can be reached from a given
    city? We need to implement search algorithms. There are two different ways of
    searching in a graph: depth-first search (DFS) and breadth-first search (BFS).


    # 9.1 Depth-First Search (DFS)


    Implement the depth-first search algorithm to traverse a graph data structure.


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_82_0.png)


    # Solution


    Depth-first search (DFS) is an algorithm for traversing the Graph. The algorithm
    starts at the root node (selecting some arbitrary city as the root node) and explores
    as far as possible along each path. Figure 9.1.1 shows a sequence of steps if
    we choose Berlin as the root node.


    # Implementing the algorithm


    # Model the problem


    We need an Object which supports any data included in the Node. We called it vertex.
    Inside this vertex, we define a boolean variable to avoid cycles in searching
    cities, so we will mark each Node when visiting it. Listing 9.1.1 shows a Vertex
    Class implementation.'
