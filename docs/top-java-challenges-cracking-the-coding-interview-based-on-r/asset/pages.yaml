  md: '# Why Big O Notation ignores Constants?


    Big O Notation describes how many steps are required relative to the number of
    data elements. And it serves as a way to classify the long-term growth rate of
    algorithms.


    For instance, O(N) will be faster than O(N2) for all amounts of data, as shown
    in Figure A.2.


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_125_0.png)


    A.2 O(N) is faster than O(N²) for all amounts of data


    Now, if we compare O(100N) with O(N³), we can see that O(N³) is faster than O(100N)
    for some amounts of data, as shown in Figure A.3.


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_125_1.png)


    A.3 O(N²) is faster than O(100N) for some amounts of data


    But after a point, O(100N) becomes faster and remains faster for all increasing
    amounts of data from that point onward. And that is the reason why Big O Notation
    ignores constants. Because of this, O(100N) is written as O(N).'
