  md: '# Sorting and Searching


    # 5.0 Fundamentals


    **Searching** refers to finding an item in a collection that meets some specified
    criterion.


    **Sorting** refers to rearranging all the items in a collection into increasing
    or decreasing order.


    Sorting algorithms are essential to improve the efficiency of algorithms that
    require input data previously sorted.


    Applications of sorting:


    +   - Searching - Binary search algorithm needs sorted lists to run in an O(logN)
    performance.


    +   - Element uniqueness - An algorithm would sort the numbers in a list and check
    adjacent pairs to detect duplicate items.


    +   - Frequency distribution - An algorithm would sort a list of items and count
    from left to right.


    +   - Merge lists - An algorithm would compare elements from both sorted lists
    and add the smaller ones to every iteration''s merged list.


    # 5.1 Bubble Sort


    Bubble Sort is a sorting algorithm. It uses a unsorted array, which contains at
    least two adjacent elements out of order. The algorithm repeatedly passes through
    the array, swaps elements out of order, and continues until it cannot find more
    swaps.


    Solution


    The algorithm uses a Boolean variable to track whether it found a swap in its
    most recent pass through the Array; as long as the variable is true, the algorithm
    loops through the Array, looking for adjacent pairs of elements that are out of
    order and swap them. The time complexity, in the worst case it requires O(n²)
    comparisons. Listing 5.1 shows the algorithm.


    Listing 5.1 - Bubble Sort'
