  md: '# Coding Challenges


    # 10.0 Fundamentals


    There are two ways to receive a coding challenge from a recruiter. First, you
    receive a description of the coding challenge via email that you need to solve
    at home. Second, you need to solve the coding challenge in front of other developers
    at the recruiter''s office.


    For both ways, keep in mind a few things for making a good impression on the recruitment
    process:


    +   - Host your final code on a website like Github with a clear README file and
    clear commit messages


    +   - Include test cases for your code. It shows that you care about maintainability.


    +   - Build a clean code structure. Your code must be readable.


    +   - Apply SOLID principles, which tell you how to arrange your functions into
    classes and how those classes should be interrelated.


    +   - Think about possible improvements - not included in the challenge specification
    - because these will be the open questions from recruiters when you change your
    code in front of them.


    # 10.1 Optimize Online Purchases


    Given a budget B and a 2-D array, which includes [product-id][price][value], write
    an algorithm to optimize a basket with the most valuable products whose costs
    are less or equal than B.


    # Solution


    Imagine that we have a budget of 4 US$ and we want to buy the most valuable snacks
    from table 10.1.1


    But who decides if a product is more valuable than another one? Well, this depends
    on every business. It could be an estimation based on quantitative or qualitative
    analysis. We choose a quantitative approach for this solution based on which product
    gives us more grams per dollar invested.'
