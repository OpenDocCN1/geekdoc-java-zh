  md: "# 5.2 Insertion Sort\n\nInsertion sort is a sorting algorithm that builds the\
    \ final sorted array one element at a time. It's similar to the way we sort playing\
    \ cards in our hands.\n\nSolution\n\n+   - Iterates over all the elements and\
    \ start at index i=1.\n- Compare the current element (key) with all its preceding\
    \ elements.\n- If the key element is smaller than its predecessors, swap them.\
    \ Move elements that are greater than the key, one position ahead of their current\
    \ position.\n\nThis algorithm takes a quadratic running time O(n²). Listing 5.2\
    \ shows the algorithm.\n\nListing 5.2 - Insertion Sort\n\n```\npublic class Sorting\
    \ {\n    public int[] insertSort(int[] numbers) {\n        if (numbers == null)\n\
    \            throw new RuntimeException(\"numbers not initialized\");\n\n    \
    \    for (int i = 1; i < numbers.length; i++) {\n            int key = numbers[i];\n\
    \            int j = i - 1;\n            while (j >= 0 && numbers[j] > key) {\n\
    \                numbers[j + 1] = numbers[j];\n                j = j - 1;\n  \
    \          }\n            numbers[j + 1] = key;\n        }\n        return numbers;\n\
    \    }\n}\n```\n\nExample:\n\nnumbers = {13, 12, 14, 6, 7}\n\nWhen i = 1. Since\
    \ 13 is greater than 12, move 13 and insert 12 before 13\n\n12, 13, 14, 6, 7\n\
    \nWhen i = 2., 14 will remain at its position as all previous elements smaller\
    \ than 14\n\n12, 13, 14, 6, 7\n\nWhen i = 3., 6 will move to the beginning, and\
    \ all other elements from 12 to 14 will move"
