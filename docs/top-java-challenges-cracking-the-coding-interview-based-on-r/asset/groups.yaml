    \ of a Given Integer N\n\nThe Factorial is the product of all positive integers\
    \ less than or equal to the non-negative integer. In real life, the Factorial\
    \ is the number of ways you can arrange n objects.\n\nSolution\n\n+   We define\
    \ the base case: returns 1 when N <= 1 to stop the recursion\n\n+   We use a recursive\
    \ formula: N * factorial(N - 1)\n\nListing 4.1 - Calculate Factorial of a Given\
    \ Integer N\n\n```\npublic class FactorRecursive {\n  public static int factorial(int\
    \ N) {\n    //base case\n    if (N <= 1)\n      return 1;\n    else\n      //recursive\
    \ call\n      return (N * factorial(N - 1));\n  }\n}\n```\n\nThe following figure\
    \ shows in the first half how a succession of recursive calls executes until factorial(1)\
    \ - the base case - returns 1, which stops the recursion. The second half shows\
    \ the values calculated and returned from each recursive call to its caller."
