    ```\n\nThis Binary Search Tree works well when the data is inserted in random\
    \ order. But when the values to be inserted are already ordered, a binary tree\
    \ becomes unbalanced. With an unbalanced tree, we cannot find data quickly.\n\n\
    One approach to solving unbalanced trees is the red-black tree, a binary search\
