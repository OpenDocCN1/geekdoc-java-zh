    \ by 100\n- A year will be a leap year if it is divisible by 400.\n\nSolution\n\
    \nWe use the % operator to verify if a year is divisible by 4, 100, or 400. Listing\
    \ 3.2 shows the algorithm.\n\nListing 3.2 - Validate a Leap Year\n\n```java\n\
    public class DateUtils {\n    public static boolean isLeapYear(int year) {\n \
    \       return (year % 400 == 0) ||\n            (year % 4 == 0 && year % 100\
    \ != 0);\n    }\n}\n```\n\nThis algorithm had a real application in the Y2K problem,\
    \ where COBOL programs in a Bank used to store four-digit years with only the\
    \ final two digits, so you could not distinguish 2000 from 1900. In addition to\
    \ calculating a leap year:\n\n- For years represented from 50 to 99, add 19 at\
    \ begin, resulting in 1950 until 1999.\n- For years represented from 00 to 49,\
    \ add 20 at begin, resulting in 2000 until 2049.\n\nThe Bank assumed that before\
    \ 2049 all systems would be migrated to modern programming languages (digital\
    \ transformation), but that is another story.\n\nTests\n\n```java\n@Test\npublic\
    \ void isLeapYear() {\n    assertTrue(DateUtils.isLeapYear(400));\n    assertTrue(DateUtils.isLeapYear(2000));\n\
    \    assertTrue(DateUtils.isLeapYear(2020));\n}\n@Test\npublic void is_notLeapYear()\
    \ {\n    assertFalse(DateUtils.isLeapYear(401));\n    assertFalse(DateUtils.isLeapYear(2018));\n\
    }\n```\n\n## 3.3 Given an Integer N, Returns the Smallest Number of Digits\n\n\
    Write a method, given an original number N of $d$ digits, returns the smallest\
    \ number with the same number of digits. For example, given N=4751, the method\
    \ should return 1000. Given N=1, the method should return 0.\n\nSolution\n\nMaybe\
    \ the first idea that comes to our minds could be to iterate from the given number\
    \ and decrease one by one, and in every iteration to check if every new number\
    \ contains one digit less than the previous number. If the answer is True, the\
    \ previous one is the smallest number with the same number of digits as the original\
    \ number. Listing 3.3 shows the first algorithm for positive numbers.\n\nListing\
    \ 3.3 - Given an Integer N, Returns the Smallest Number of Digits\n\n```java\n\
    public class NumberUtils {\n    public static int smallest(int N) {\n        int\
    \ smallestNumber = 0;\n        if (N <= 1)\n            return smallestNumber;\n\
    \n        int numberOfDigitsOriginalN = String.valueOf(N).length();\n        while\
    \ (N > 0) {\n            if (String.valueOf(N).length() == (numberOfDigitsOriginalN\
    \ - 1)) {\n                return ++N;\n            }\n        }\n        return\
    \ smallestNumber;\n    }\n}\n```\n\nBut if we realize, the solution follows a\
    \ particular pattern:\n\n- N = 4751 -> smallest number = 1000\n- N = 189 -> smallest\
    \ number = 100\n- N = 37 -> smallest number = 10\n\nThe smallest number is a power\
    \ of 10, where the exponent is: number of digits - 1\n\nSecond solution:\n\n```java\n\
    public static int smallest(int N) {\n    int smallestNumber = 0;\n    if (N <=\
    \ 1 || String.valueOf(N).length() == 1) {\n        return smallestNumber;\n  \
    \  }\n    int numberOfDigits = String.valueOf(N).length();\n    return (int) Math.pow(10,\
    \ numberOfDigits - 1);\n}\n```\n\nIf we want to include negative numbers, we must\
    \ consider the smallest number with the same number of digits and same sign. Here\
    \ the solution:\n\n```java\npublic class NumberUtils {\n    public static int\
    \ smallest(int N) {\n        int numberOfDigits = (int) String.valueOf(Math.abs(N)).length();\n\
    \        if (N >= 0) {\n            if (numberOfDigits == 1) {\n             \
    \   return 0;\n            } else {\n                return (int) Math.pow(10,\
    \ numberOfDigits - 1);\n            }\n        } else {\n            return -(int)\
    \ Math.pow(10, numberOfDigits - 1);\n        }\n    }\n}\n```\n\nThe main idea\
    \ in Analysis of Algorithms is always to improve performance by reducing the number\
    \ of comparisons. The simpler and more intuitive the algorithm is, the more efficient\
    \ it will be.\n\nTests\n\n```java\n@Test\npublic void test_smallest_values() {\n\
    \    assertTrue(NumberUtils.smallest(4751) == 1000);\n    assertTrue(NumberUtils.smallest(189)\
    \ == 100);\n    assertTrue(NumberUtils.smallest(37) == 10);\n    assertTrue(NumberUtils.smallest(1)\
    \ == 0);\n    assertTrue(NumberUtils.smallest(0) == 0);\n    assertTrue(NumberUtils.smallest(-1)\
    \ == 0);\n}\n@Test\npublic void test_wrong_smallest_values() {\n    assertFalse(NumberUtils.smallest(8)\
    \ == 1);\n    assertFalse(NumberUtils.smallest(29) == 200);\n}\n```\n\n## 3.4\
    \ FizzBuzz\n\nWrite a program that will display all the numbers between 1 and\
    \ 100.\n\n- For each number divisible by three, the program will display the word\
    \ \"Fizz\".\n- For each number divisible by five, the program will display the\
    \ word \"Buzz\".\n- For each number divisible by three and five, the program will\
    \ display the word \"Fizz-Buzz\".\n\nThe output will look like this:\n\n1, 2,\
    \ Fizz, 4, Buzz, 7, 8, Buzz, 11, Fizz, 13, 14, Fizz-Buzz, 16, 19, ...\n\nSolution\n\
    \nIt looks like a simple algorithm but is \"hard\" for some programmers because\
    \ they try to follow the following:\n\n```\nif (theNumber is divisible by 3) then\n\
    \    print \"Fizz\"\nelse if (theNumber is divisible by 5) then\n    print \"\
    Buzz\"\nelse /* theNumber is not divisible by 3 or 5 */\n    print theNumber\n\
    ```\n\nBut where do we print \"Fizz-Buzz\" in this algorithm? The interviewer\
    \ expects that you think for yourself and make use of conditional without duplication.\
    \ Recognizing that a number by 3 and 5 is also divisible by 3*5 is the key to\
    \ a FizzBuzz solution. Listing 3.4 shows the algorithm.\n\nListing 3.4 - FizzBuzz\n\
    \n```java\npublic class NumberUtils {\n    public static void fizzBuzz(int N)\
    \ {\n        final String BUZZ = \"Buzz\";\n        final String FIZZ = \"Fizz\"\
    ;\n        for (int i = 1; i <= N; i++) {\n            if (i % 15 == 0) {\n  \
    \              System.out.print(FIZZ + \" -\" + BUZZ + \", \");\n            }\
    \ else if (i % 3 == 0) {\n                System.out.print(FIZZ + \", \");\n \
    \           } else if (i % 5 == 0) {\n                System.out.print(BUZZ +\
    \ \", \");\n            } else {\n                System.out.print(i + \", \"\
    );\n            }\n        }\n    }\n}\n```\n\nYou should never use System.out.print\
    \ in a Production environment. I/O routines consume a lot of resources in time\
    \ and memory.\n\nTests\n\n```java\npublic class FizzBuzzTest {\n    @Test\n  \
    \  public void testFizzBuzz() {\n        NumberUtils.fizzBuzz(100);\n    }\n}\n\
    ```\n\n## 3.5 Verify If a Number Is a Valid Power of a Base\n\nIn mathematics,\
    \ a function is an expression that maps an independent variable (domain) to a\
    \ dependent variable (range). Functional programming (FP) emphasizes functions\
    \ that produce results that depend only on their inputs and not on the program\
    \ state—i.e., pure mathematical functions.\n\nOne of Java's approaches to FP is\
    \ the definition of functional interfaces. A functional interface in Java has\
    \ only one abstract method. We can use functional available in the Java 8 library\
    \ like the Java.util.function.BiFunction<T, U, R>, which accepts two arguments\
    \ and produces one.\n\n```java\nBiFunction<Integer, Integer, Integer> sum = (x1,\
    \ x2) -> x1 + x2;\nInteger result = sum.apply(2, 3);\nSystem.out.println(result);\
    \ // 5\n```\n\nExponentiation involves two numbers: the base b and the exponent\
    \ or power n. Exponentiation corresponds to repeated multiplication of the base\
    \ n times. For instance, in the following expression: 3⁵ = 243, we say that 243\
    \ is the 5th power of 3.\n\nSolution\n\nWe do the inverse operation to verify\
    \ if a number is a valid power nth of another number (base).\n\nDivide the given\
    \ number by the base and evaluate if it provides a 0 remainder, then we iterate\
    \ this operation until we find a value of 1. Otherwise, if the rest is not 0,\
    \ then the given number is not a valid power nth of the base. Listing 3.5 shows\
    \ a function, which returns when a given number is the right power of a base.\n"
