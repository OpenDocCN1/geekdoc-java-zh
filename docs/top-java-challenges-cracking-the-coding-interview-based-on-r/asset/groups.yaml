    \ 8.1 Binary Search Tree\n\nA company uses the Global Trade Item Number (GTIN)\
    \ to uniquely identify all of its trade items. The GTIN identifies the types of\
    \ products that different manufacturers produce.\n\nA Webshop wants to retrieve\
    \ information about GTINs efficiently by using a binary search algorithm.\n\n\
    ### Solution\n\nWe define a `Product` Class which will be the data contained in\
    \ a Node.\n\nListing 8.1.1 shows how we create a `Product` Class.\n\nListing 8.1.1\
    \ - Product Class\n\n```java\npublic class Product {\n    Integer productId;\n\
    \    String name;\n    Double price;\n    String manufacturerName;\n    //setters\
    \ and getters are omitted\n}\n```\n\nListing 8.1.2 shows how we create a `NodeP`\
    \ Class to store a list of `Products`. Moreover, the Class allows us to have two\
    \ Node attributes to hold the left and right nodes.\n\nListing 8.1.2 - NodeP Class\n\
    \n```java\npublic class NodeP {\n    private String gtin;\n    private List<Product>\
    \ data;\n    private NodeP left;\n    private NodeP right;\n    public NodeP(String\
    \ gtin, List<Product> data) {\n        this.gtin = gtin;\n        this.data =\
    \ data;\n    }\n}\n```\n\nListing 8.1.3 shows a `TreeP` Class to implement an\
    \ abstract data type called binary search tree, which includes a `NodeP root`\
    \ variable for the first element to be inserted. We need to implement an `insert`\
    \ method, every time a new GTIN is inserted, it compares the current GTIN versus\
    \ the new GTIN. Depending on the result, we store the new GTIN on the left or\
    \ the right Node. In this way, the insert method maintains an ordered binary search\
    \ tree.\n\nListing 8.1.3 TreeP and insert method\n\n```java\npublic class TreeP\
    \ {\n    private NodeP root;\n    public void insert(String gtin, List<Product>\
    \ data) {\n        NodeP newNode = new NodeP(gtin, data);\n        if (root ==\
    \ null) {\n            root = newNode;\n        } else {\n            NodeP current\
    \ = root;\n            NodeP parent;\n            while (true) {\n           \
    \     parent = current;\n                if (gtin.compareTo(current.getGtin())\
    \ < 0) {\n                    current = current.getLeft();\n                 \
    \   if (current == null) {\n                        parent.setLeft(newNode);\n\
    \                        return;\n                    }\n                } else\
    \ if (gtin.compareTo(current.getGtin()) > 0) {\n                    current =\
    \ current.getRight();\n                    if (current == null) {\n          \
    \              parent.setRight(newNode);\n                        return;\n  \
    \                  }\n                } else {\n                    return; //already\
    \ exists\n                }\n            }\n        }\n        return;\n    }\n\
    }\n```\n\nListing 8.1.4 shows a `find` method, which iterates through all nodes\
    \ until a GTIN is found. This algorithm reduces the search space to N/2 because\
    \ the binary search tree is always ordered.\n\nListing 8.1.4 - find method\n\n\
    ```java\npublic NodeP find(String gtin) {\n    NodeP current = root;\n    if (current\
    \ == null)\n        return null;\n\n    while (current != null) {\n        if\
    \ (gtin.compareTo(current.getGtin()) < 0) {\n            current = current.getLeft();\n\
    \        } else if (gtin.compareTo(current.getGtin()) > 0) {\n            current\
    \ = current.getRight();\n        } else {\n            return current;\n     \
    \   }\n    }\n    return null;\n}\n```\n\n### Tests\n\n```\n@Test\npublic void\
    \ test_find() {\n  tree.insert(\"gt1\", Arrays.asList(product1));\n  tree.insert(\"\
    gt2\", Arrays.asList(product2));\n  tree.insert(\"gt3\", Arrays.asList(product3,\
    \ product4));\n  tree.insert(\"gt4\", Arrays.asList(product5));\n  tree.insert(\"\
    gt5\", Arrays.asList(product6, product7, product8));\n  assertEquals(null, tree.find(\"\
    gt0\"));\n  tree.insert(\"gt6\", Arrays.asList(product9));\n  assertTrue(tree.find(\"\
    gt6\") != null)\n}\n```\n"
