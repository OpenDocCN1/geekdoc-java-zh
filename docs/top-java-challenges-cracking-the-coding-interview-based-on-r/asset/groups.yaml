    # Linked Lists


    # 2.0 Fundamentals


    A linked list is a linear data structure that represents a sequence of nodes.
    Unlike arrays, linked lists store items at a not contiguous location in the computer''s
    memory. It connects items using pointers.


    Connected data that dispersed throughout memory are known as nodes. In a linked
    list, a node embeds data items. Because there are many similar nodes in a list,
    using a separate class called Node makes sense, distinct from the linked list
    itself.


    Each Node object contains a reference (usually called next or link) to the next
    Node in the list. This reference is a pointer to the next Node''s memory address.
    A Head is a special node that is used to denote the beginning of a linked list.
    A linked list representation is shown in the following figure.


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_28_0.png)


    Each Node consists of two memory cells. The first cell holds the actual data,
    while the second cell serves as a link indicating where the next Node begins in
    memory. The final Node''s list contains null since the linked list ends there.


    In the figure, we say that "B" follows "A," not that "B" is in the second position.


    A linked list''s data can be spread throughout the computer''s memory, which is
    a potential advantage over the Array. An array, by contrast, needs to find an
    entire block of contiguous cells to store its data, which can get increasingly
    difficult as the array size grows. For this reason, Linked Lists utilize memory
    more effectively.


    When each Node only points to the next Node, we have a singly linked list. A doubly-linked
    list when each Node points to the next Node and the previous Node.'
