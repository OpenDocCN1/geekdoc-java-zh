    ```

    students = { 4312 => "Jan",

    5102 => "Brian",

    5303 => "James" }

    ```


    An algorithm hashes the key, turns it into an array index, and jumps directly
    to the index with that number to get the associated value.


    But sometimes, there is a risk that different keys map to the same hashed array
    index. That is called a collision; we obtain a key hash to an already filled position.


    There are two solutions to deal with collisions: Chaining, where each entry in
    the hash array points to its linked list. The other one is open addressing, where
    only one array stores all items; when we want to insert a new hashed key, the
    slot is already filled, then the algorithm looks for another empty slot to insert
    the new item. This kind of search is called the probe sequence.


    Most of the programming languages already implement a strategy for dealing with
    collisions and choosing a hash function.


    # 7.1 Design a Hash Table


    Design a hash table, which implements add and get operations, key-value pairs
    should be generic, and use chaining technique for solving index collisions.


    # Solution


    Imagine that we want to identify warehouses as keys composed of 3 characters.


