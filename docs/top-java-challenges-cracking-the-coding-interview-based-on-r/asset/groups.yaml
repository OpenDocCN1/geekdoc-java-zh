    # Stacks and Queues


    # 6.0 Fundamentals


    Stack


    A Stack is an abstract data type, which includes a collection of objects that
    follow the last-in, first-out (LIFO) principle, i.e., the element inserted at
    last is the first element to come out of the list. A real-world example of a stack
    is the Stack of trays at a cafeteria.


    Stacks have the following constraints:


    +   - A push operation allows inserting data at the end of a stack.

    - A pop operation allows deleting data from the end of a stack.

    - It can read only the last element of a stack, which is called the top. The *peek*
    operation returns the value stored at the top of a stack without removing it from
    the stack.


    You can implement a Stack using an Array or a Singly Linked List.


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_60_0.png)


    Stacks are helpful to handle temporary data as part of various algorithms, for
    example:


    +   - Undo mechanism on text editor is based on Stack, i.e., cancel recent edit
    operations. The editor keeps text changes in a Stack.

    - Web browsers store URLs of visited websites on a stack. When a user visits a
    new website, its URL is "pushed" on the Stack. When the user presses the "back"
    button, the previous URL is "pop" from the Stack.'
