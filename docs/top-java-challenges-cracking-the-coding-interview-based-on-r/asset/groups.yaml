    # 9.2 Breadth-First Search (BFS)


    Implement the breadth-first search algorithm to traverse a graph data structure.


    Solution


    In the breadth-first search, the algorithm stays as close as possible to the starting
    point. It visits all the vertices adjacent to the starting vertex. The algorithm
    is implemented using a queue.


    9.2.1 shows a sequence of steps if we choose Berlin as the root node. The numbers
    indicate the order in which the vertices are visited.


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_88_0.png)


    The breath-first search algorithm first finds all the vertices that are one edge
    away from the starting vertex, then all the vertices that are two edges away,
    three edges away, and so on. It is useful to answer questions like what is the
    shortest path from Berlin to another city like München?


    We traverse cities that are one edge away from Berlin (first level): Rostock,
    Magdeburg, and Leipzig. Then we traverse cities that are two edges away from Berlin
    (second level): Hannover, Nürnberg, and Dresden. Then we traverse cities that
    are three edges away from Berlin (third level): Berlin, Dortmund, and München.
    That''s the idea. We already found München before traversing another possible
    path: Berlin, Magdeburg, Dortmund, Frankfurt, Stuttgart, München, which corresponds
    to the sixth level.'
