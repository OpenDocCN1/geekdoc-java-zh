    # Graphs


    # 9.0 Fundamentals


    A Graph is a non-linear data structure consisting of nodes (vertices) and edges.
    Its shape depends on the physical or abstract problem we are trying to solve.
    For example, if nodes represent cities, the routes which connect cities may be
    defined by no-directed edges. But if nodes represent tasks to complete a project,
    then their edges must be directed to indicate which task must be completed before
    another.


    # Terminology


    A Graph can model the Hyperloop transport to be installed in Germany.


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_81_0.png)


    Figure 9.0 Graph - terminology


    A Graph shows only the relationships between the vertices and the edges, and the
    most important here is here which edges are connected to which vertex. We can
    also say that a Graph models connections between objects.


    # Adjacency


    When a single edge connects two vertices, then they are adjacent or neighbors.
    In the figure above, the vertices represented by Berlin and Leipzig are adjacent,
    but the cities Berlin and Dresden are not.


    # Path


    A Path is a sequence of edges. The figure above shows a path from Berlin to München
    that passes through cities Leipzig and Nürnberg. Then the path is Berlin, Leipzig,
    Nürnberg, München.


    # Connected Graphs'
  - '[PAGE 82]


    A Graph is connected if there is at least one path from every vertex to every
    other vertex. The figure above is connected because all cities are connected.


    # Directed and Weighted Graphs


    A Graph is directed when the edges have a direction. In the figure above, we have
    a non-directed graph because the hyperloop can usually go either way. From Berlin
    to Leipzig is the same as from Leipzig to Berlin.


    Graphs are called a weighted graph when edges are given weight, e.g., the distance
    between two cities can be weighted in how fast they are connected.


    A graph answer one of the questions: which cities can be reached from a given
    city? We need to implement search algorithms. There are two different ways of
    searching in a graph: depth-first search (DFS) and breadth-first search (BFS).


    # 9.1 Depth-First Search (DFS)


    Implement the depth-first search algorithm to traverse a graph data structure.


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_82_0.png)


    # Solution


    Depth-first search (DFS) is an algorithm for traversing the Graph. The algorithm
    starts at the root node (selecting some arbitrary city as the root node) and explores
    as far as possible along each path. Figure 9.1.1 shows a sequence of steps if
    we choose Berlin as the root node.


    # Implementing the algorithm


    # Model the problem


    We need an Object which supports any data included in the Node. We called it vertex.
    Inside this vertex, we define a boolean variable to avoid cycles in searching
    cities, so we will mark each Node when visiting it. Listing 9.1.1 shows a Vertex
    Class implementation.'
  - "[PAGE 83]\n\n# Listing 9.1.1 - Vertex Class\n\n```\npublic class Vertex {\n \
    \   private String name;\n    private boolean visited;\n\n    public Vertex(String\
