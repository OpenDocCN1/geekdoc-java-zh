    # Big O Notation


    Big O Notation is a mathematical notation that helps us analyze how complex an
    algorithm is in terms of time and space. When we build an application for one
    user or millions of users, it matters.


    We usually implement different algorithms to solve one problem and measure how
    efficient one is with respect to the other ones.


    # Time and Space Complexity


    Time complexity is related to how many steps take the algorithm.


    Space complexity is related to how efficient the algorithm is using the memory
    and disk.


    Both terms depend on the input size, the number of items in the input. We can
    analyze the complexity based on three cases:


    +   - Best case or Big Omega Ω(n): Usually, the algorithm executes independently
    of the input size in one step.


    +   - Average case or Big Theta Θ(n): When the input size is random.


    +   - Worst-case or Big O Notation O(n): Gives us an upper bound on the runtime
    for any input. It gives us a kind of guarantee that the algorithm will never take
    any longer with a new input size.


    # Order of Growth of Common Algorithms


    ![](img/60b89ebeda3428b712e02fb7e9fd8b5b_121_0.png)'
  - "[PAGE 122]\n\n# Figure A.1 Big O Notation - order of growth\n\nThe order of growth\
    \ is related to the runtime of an algorithm increases when the input size increases\
    \ without limit and tells us how efficient the algorithm is. We can compare the\
    \ relative performance of alternative algorithms.\n\n# Big O Notations examples:\n\
    \n# O(1) - Constant\n\nIt does not matter if the input contains 1000 or 1 million\
    \ items. The code always executes in one step.\n\n```\npublic class BigONotation\
    \ {\n    public void constant(List<String> list, String item) {\n        list.add(item);\n\
    \    }\n}\n```\n\n```\n@Test\npublic void test_constantTime() {\n    List<String>\
    \ list = new ArrayList<>(Arrays.asList(\"one\", \"two\", \"three\\));\n    bigONotation.constant(list,\
    \ \"four\");\n}\n```\n\nIn a best-case scenario, an add method takes O(1) time.\
    \ The worst-case scenario takes O(n).\n\n# O(N) - Linear\n\nOur algorithm runs\
    \ in O(N) time if the number of steps depends on the number of items included\
    \ in the input.\n\n```\npublic int sum(int[] numbers) {\n    int sum = 0;\n  \
    \  for (int i = 0; i<numbers.length; i++) {\n        sum+=numbers[i];\n    }\n\
    \    return sum;\n}\n```\n\n```\n@Test\npublic void test_linearTime() {\n    final\
    \ int[] numbers = {1, 2, 4, 6, 1, 6};\n    assertTrue(bigONotation.sum(numbers)\
    \ == 20);\n}\n```\n\n# O(N²) - Quadratic\n\nWhen we have two loops nested in our\
    \ code, we say it runs in quadratic time O(N²). For"
