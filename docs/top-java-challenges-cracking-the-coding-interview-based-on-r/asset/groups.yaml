    \ Node 内存地址的指针。Head（头）是一个特殊的节点，用于标记链表的起始。链表的表示形式如图所示。\n\n![](img/60b89ebeda3428b712e02fb7e9fd8b5b_28_0.png)\n\
    \n每个 Node 由两个内存单元组成。第一个单元存储实际数据，而第二个单元作为链接，指示下一个 Node 在内存中的起始位置。链表的最后一个 Node 包含\
