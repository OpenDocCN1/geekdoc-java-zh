    \   //setters and getter omitted\n}\n```\n\nWe have two approaches to model how\
    \ the vertices are connected (edges): the adjacency matrix and the adjacency list.\
    \ For this algorithm, we are going to implement the adjacency matrix.\n\n# The\
    \ adjacency matrix\n\nIn a graph of N vertices, we create a two-dimensional array\
    \ of NxN. An edge between two vertices (cities) indicates a connection (two adjacent\
    \ nodes) represented by 1. No connections are represented by 0.\n\n| Berlin |\
    \ Leipzig | Dresden | Rostock | Nürnberg |\n|---|---|---|---|---||\n| Berlin |\
    \ 0 | 1 | 0 | 1 | 0 |\n| Leipzig | 1 | 0 | 1 | 0 | 1 |\n| Dresden | 0 | 1 | 0\
    \ | 0 | 0 |\n| Rostock | 1 | 0 | 0 | 0 | 0 |\n| Nürnberg | 0 | 1 | 0 | 0 | 0 |\n\
    \nTable 9.1.1 The adjacency matrix\n\nFor instance, the table says Leipzig is\
    \ adjacent to Berlin, Dresden, and Nürnberg, for example.\n\n# Create and initialize\
    \ an abstract data type\n\nWe create an abstract data type called Graph to define\
    \ the behavior of our data structure.\n\nWe need a stack structure so that we\
    \ can remember the visited vertices. A stack follows the last-in, first-out (LIFO)\
    \ principle, i.e., the city inserted at last is the first city to come out of\
    \ the stack.\n\nWe define an arrayOfVertex[] array to store new Vertices(cities)\
    \ added to the Graph."
