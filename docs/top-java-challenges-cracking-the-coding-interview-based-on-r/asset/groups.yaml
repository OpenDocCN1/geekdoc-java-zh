    \ 4, 6, 9}\n\nIn our third pass through, we have made just one comparison -> {4,\
    \ 5, 6, 9}\n\nIn summarize:\n\n3 + 2 + 1 = 6 comparisons, or (N-1) + (N-2) + (N-3)\
    \ ... + 1 comparisons\n\nMoreover, in this scenario, we need a swap for each comparison.\
    \ Therefore, we have six comparisons and six swaps = 12, which is approximately\
    \ 4^2. As the number of items N increases, the number of steps exponentially grows,\
    \ as shown in the following table.\n\n| N | # steps | N^2 |\n|---|---|---|\n|\
    \ 4 | 12 | 16 |\n| 5 | 20 | 25 |\n| 10 | 90 | 100 |\n\nTherefore, in Big O Nation,\
    \ we could say that the Bubble Sort algorithm has O(N^2) efficiency.\n\n# Tests\n\
    \n```java\n@Test\npublic void sortingArrays() {\n    final int[] numbers = {6,\
