    ```\n\n与数组不同，链表无法以常数时间访问第 n 个元素。我们需要迭代 n-1 个元素来获取第 n 个元素。但我们可以在链表的头部常数时间内插入、删除和更新节点。\n\
    \n## 2.1 实现链表\n\n实现包含 create、add 和 traverse 方法的链表。\n\n### 解决方案\n\n创建链表类\n\n我们可以将\
