    \n# Big O Notation\n\nBig O Notation is a mathematical notation that helps us\
    \ analyze how complex an algorithm is in terms of time and space. When we build\
    \ an application for one user or millions of users, it matters.\n\nWe usually\
    \ implement different algorithms to solve one problem and measure how efficient\
    \ one is with respect to the other ones.\n\n# Time and Space Complexity\n\nTime\
    \ complexity is related to how many steps take the algorithm.\n\nSpace complexity\
    \ is related to how efficient the algorithm is using the memory and disk.\n\n\
    Both terms depend on the input size, the number of items in the input. We can\
    \ analyze the complexity based on three cases:\n\n- Best case or Big Omega Ω(n):\
    \ Usually, the algorithm executes independently of the input size in one step.\n\
    - Average case or Big Theta Θ(n): When the input size is random.\n- Worst-case\
    \ or Big O Notation O(n): Gives us an upper bound of the runtime for any input.\
    \ It gives us a kind of guarantee that the algorithm will never take.\n\n# Order\
    \ of Growth of Common Algorithms\n\n![img/60b893742212f0fd7e9_121.png](img/60b893742212f0fd7e9_121.png)\n\
    \n# O(1) - Constant\n\nIt does not matter if the input contains 1000 or a million.\
    \ The code always executes in one step.\n\n```java\npublic class Bigotation {\n\
    \    public void constant(String item) {\n        list.add(item);\n    }\n}\n\
    ```\n\n```java\n@Test\npublic void constantTime() {\n    List<String> list = Arrays.asList(\"\
    one\", \"two\");\n    Bigotation.constant(\"three\");\n}\n```\n\n# O(N) - Linear\n\
    \nWe say it is linear when the number of steps increases.\n\n```java\npublic int\
    \ sum(int[] numbers) {\n  int sum = 0;\n  for (int i = 0; i < numbers.length;\
    \ i++) {\n    sum += numbers[i];\n  }\n  return sum;\n}\n```\n\n```java\n@Test\n\
    public void linearTime() {\n    final int[] numbers = {30, 20, 10, 5};\n    assertTrue(sum(numbers)\
    \ == 40);\n}\n```\n\n# O(N²) - Quadratic\n\nWhen we have two nested loops, it\
    \ is quadratic.\n\n```java\npublic void initializeBoard(int size) {\n    String[][]\
    \ board = new String[size][size];\n    for (int x = 0; x < size; x++) {\n    \
    \    for (int y = 0; y < size; y++) {\n            board[x][y] = \"\";\n     \
    \   }\n    }\n}\n```\n\n```java\n@Test\npublic void quadraticTime() {\n    initializeBoard(3);\n\
    }\n```\n\n# O(N³) - Cubic\n\nWe say it includes three nested loops.\n\n```java\n\
    public int countThreeSum(int[] numbers) {\n    int N = numbers.length;\n    int\
    \ count = 0;\n    for (int i = 0; i < N; i++) {\n        for (int j = i + 1; j\
    \ < N; j++) {\n            for (int k = j + 1; k < N; k++) {\n               \
    \ if (numbers[i] + numbers[j] + numbers[k] == 0) {\n                    count++;\n\
    \                }\n            }\n        }\n    }\n    return count;\n}\n```\n\
    \n```java\n@Test\npublic void countThreeSum() {\n    final int[] numbers = {30,\
    \ 20, 10, 5};\n    assertTrue(countThreeSum(numbers) == 4);\n}\n```\n\n# O(LogN)\
    \ - Logarithmic\n\nThis kind of algorithm produces a growth curve that peaks at\
    \ the beginning and slowly flattens out as the size increases.\n\nLog8=3\n\nLog16=4\n\
    \nLog32=5\n\nThe binary search uses at most LogN comparisons to search in sorted\
    \ array of size N. With eight elements, it takes three comparisons, with 16 elements\
    \ takes four, with 32 takes five, and so on.\n\n# How to Find the Time Complexity\
    \ of an Algorithm\n\nTo find the Big O complexity of an algorithm follows the\
    \ following rules:\n\n- Ignore the lower order terms\n- Drop the leading constants\n\
    \nExample: If the time complexity of an is 2n³ + 4n + 3. Its Big O complexity\
    \ simplifies to O(n³).\n\nExample: Given the following algorithm:\n\n```java\n\
    public Integer sumOfEvenNumbers(Integer N) {\n  int sum = 0;\n  for (int number\
    \ = 1; number <= N; number++) {\n    if ((number % 2) == 0)\n      sum = sum +\
    \ number;\n  }\n  return sum;\n}\n```\n\nFirst, split the code into individual\
    \ operations and then compute how many times it is being executed, as is shown\
    \ in the following table.\n\n| Operation | Number of executions |\n| :--- | :---\
    \ |\n| int sum = 0; | 1 |\n| int number = 1; | 1 |\n| number <= N; | N |\n| number++\
    \ | N |\n| if ((number % 2) == 0) | N |\n| sum = sum + number; | N |\n| return\
    \ sum; | 1 |\n\nNow, we need to sum how many times each operation is executing.\n\
    \nTime complexity = 1 + 1 + N + N + N + N + 1 => 4N + 3\n\nBig O complexity =\
    \ O(N)\n"
