    clear commit messages


    +   - Include test cases for your code. It shows that you care about maintainability.


    +   - Build a clean code structure. Your code must be readable.


    +   - Apply SOLID principles, which tell you how to arrange your functions into
    classes and how those classes should be interrelated.


    +   - Think about possible improvements - not included in the challenge specification
    - because these will be the open questions from recruiters when you change your
