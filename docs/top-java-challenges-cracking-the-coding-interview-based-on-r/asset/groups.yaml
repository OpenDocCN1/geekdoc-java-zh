    \ `peek` 操作。\n\n你可以使用数组或单链表实现栈。\n\n![](img/60b9ebeda3428b712e0fb7e98b5b_60_0.png)\n\
    \n栈有助于处理临时数据，例如：\n\n- 编辑器的撤销机制基于栈，即取消编辑操作。编辑器将文本更改存储在栈中。\n- 浏览器存储访问过的网站 URL。当用户访问新网站时，其\
    \ URL 被“推入”栈。当用户点击“后退”按钮时，上一个 URL 从栈中“弹出”。\n\n# \n\n队列是一种抽象数据类型，包含遵循先入先出（FIFO）原则的对象集合，即第一个插入的元素第一个取出。\n\
    \n队列具有以下限制：\n\n- `enqueue` 操作允许在队列的末尾插入数据。\n- `dequeue` 操作允许从队列的头部删除数据。\n- 它可以读取队列头部的元素，这称为头部。\n\
    \n![](img/60b9ebeda3428b712e0fb7e98b5b_61_0.png)\n\n队列有助于处理等待时间，例如：\n\n- 中心、剧院和其他类似的服务使用\
    \ FIFO 原则处理客户请求。\n\n## 6.1 边界匹配\n\n检查表达式中的括号、大括号和小括号是否平衡。在此，我们必须确保：\n\n- 左边界符的每个开启符号都与右边界符的结束符号匹配。\n\
    - 后出现的左边界符应该在先出现的之前关闭。\n\n### 解决方案\n\n我们使用*栈*数据结构来确保两个限制符号正确匹配（成对）。为什么选择栈？元素的插入和删除发生在栈的一个端，即栈顶。JDK\
    \ 包含了 `Java.Stack` 数据结构。`push` 方法将项添加到此栈的顶部。`pop` 方法移除栈顶的元素。\n\n- 遍历给定表达式中的每个字符。如果是开启符号，则将其推入栈。如果是结束符号，则从栈中弹出一个元素（最后添加的开启符号）并检查它们是否成对。\n\
    - 如果我们到达末尾且栈为空，则表达式是平衡的；否则不是。\n\n### 列表 6.1 - 边界匹配\n\n```java\nimport java.util.Stack;\n\
    public static boolean isBalanced(String expression) {\n    if (expression == null\
    \ || expression.length() < 2) {\n        return false;\n    }\n\n    Stack<Character>\
    \ stack = new Stack<>();\n    for (char c : expression.toCharArray()) {\n    \
    \    if (c == '(' || c == '[' || c == '{') {\n            stack.push(c);\n   \
    \     } else if (c == ')') {\n            if (stack.isEmpty() || stack.pop() !=\
    \ '(') {\n                return false;\n            }\n        } else if (c ==\
    \ ']') {\n            if (stack.isEmpty() || stack.pop() != '[') {\n         \
    \       return false;\n            }\n        } else if (c == '}') {\n       \
    \     if (stack.isEmpty() || stack.pop() != '{') {\n                return false;\n\
    \            }\n        }\n    }\n    return stack.isEmpty();\n}\n```\n\n## 6.2\
    \ 通过栈实现队列\n\n使用两个栈构建队列。这意味着，在队列的情况下，`add` 方法将元素推入 `inbox`。`peek` 方法执行以下操作：从 `inbox`\
    \ 弹出。\n\n```java\nimport java.util.Stack;\npublic class QueueStacks<T> {\n   \
    \ Stack<T> inbox;\n    Stack<T> outbox;\n\n    public QueueStacks() {\n      \
    \  inbox = new Stack<T>();\n        outbox = new Stack<T>();\n    }\n\n    public\
    \ void add(T value) {\n        // 栈总是最新的元素\n        inbox.push(value);\n    }\n\
    \n    public T peek() {\n        if (outbox.isEmpty()) {\n            while (!inbox.isEmpty())\
    \ {\n                // 逆序填充\n                outbox.push(inbox.pop());\n    \
    \        }\n        }\n        return outbox.pop();\n    }\n}\n```\n\n# 测试\n\n\
    ```java\npublic class QueueStacksTest {\n    QueueStacks<Integer> queueStacks;\n\
    \n    @Before\n    public void Before() {\n        queueStacks = new QueueStacks<>();\n\
    \    }\n\n    @Test\n    public void pop_firstElement() {\n        queueStacks.add(4);\n\
    \        queueStacks.add(2);\n        queueStacks.add(9);\n        assertEquals(new\
    \ Integer(4), queueStacks.peek());\n    }\n}\n```\n\n# 6.3 使用栈反转字符串\n\n给定一个字符串，使用栈反转字符顺序。\n\
    \n解决方案\n\n- 将文本转换为字符数组。\n- 创建一个空栈。\n- 将所有字符逐个推栈。\n- 从栈中取出所有字符并放入字符数组中。\n- 最后，将数组作为字符串返回。\n\
    \n### 列表 6.3 - 使用栈反转字符串\n\n```java\nimport java.util.Stack;\npublic class StringUtils\
    \ {\n    public static String reverse(String text) {\n        char[] charsArray\
    \ = text.toCharArray();\n        Stack<Character> stack = new Stack<Character>();\n\
    \n        for (int i=0; i<charsArray.length; i++) {\n            stack.push(charsArray[i]);\n\
    \        }\n\n        for (int i=0; i<charsArray.length; i++) {\n            charsArray[i]\
    \ = stack.pop();\n        }\n\n        return String.valueOf(charsArray);\n  \
    \  }\n}\n```\n\n# 测试\n\n```java\n@Test\npublic void reverseText_success() {\n\
    \    assertEquals(\"efac\", StringUtils.reverse(\"cafe\"));\n    assertEquals(\"\
    2312cba\", StringUtils.reverse(\"abc2132\"));\n}\n```\n"
