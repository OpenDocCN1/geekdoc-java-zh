    \ = 5.0。\n- **floor(x):** 返回 x 向下取整到最近的整数。例如：floor(4.4) = 4.0。\n- **max(x):**\
    \ 返回数值最大的数。例如：max(6,7) = 7。\n- **pow(x,y):** 返回 x 的 y 次幂。例如：pow(2,5) = 32.0。\n\
    - **random():** 返回 0 到 1 之间的随机数。例如：random() => 0.4554434499209374。\n\n"
