    //泛型链表\npublic class LinkedList<T> {\n    Node head;\n\n    private class Node\
    \ {\n        final T data;\n        Node next;\n        //默认初始化为 null\n      \
    \  Node(T data) {\n            this.data = data;\n            this.next = null;\n\
    \        }\n    }\n}\n```\n\n添加节点\n\n我们可以通过三种方式添加新节点：\n- 在链表的头部。\n- 在某个节点之前。\n\
    - 在链表的末尾。\n\n为了我们的目的，我们在链表的末尾添加新节点。步骤如下：\n- 创建一个带有数据的新 Node。\n- 如果头部为空（空列表），将新节点设置为头部。\n\
    - 如果头部不为空，找到最后一个节点。将新节点设置为最后一个节点。\n\n2.1.2 - 添加节点\n\n```java\npublic void add(T\
    \ data) {\n    Node node = new Node(data);\n    if (head == null) {\n        head\
    \ = node;\n    } else {\n        Node last = head;\n        while (last.next !=\
    \ null) {\n            last = last.next;\n        }\n        last.next = node;\n\
    \    }\n}\n```\n\n遍历链表\n\n遍历意味着从头部开始遍历列表中的所有数据。\n\n2.1.3 - 遍历链表\n\n# 测试\n\n```java\n\
    @Test\npublic void addNodes() {\n    LinkedList<String> linkedList = new LinkedList<>();\n\
    \    linkedList.add(\"s1\");\n    linkedList.add(\"s2\");\n    linkedList.add(\"\
    s3\");\n    linkedList.add(\"s4\");\n    assertEquals(\"[s1 -> s2 -> s3 -> s4]\"\
    , linkedList.toString());\n}\n```\n\n## 2.2 反转链表\n\n给定链表的头部指针，编写一个程序反转链表。\n\n\
    ### 解决方案\n\n为了反转链表，我们实现了迭代方法。\n1. 初始化三个指针：prev 为 null，current 为头部，next 为 null。\n\
    2. 遍历链表。在循环内部执行：\n   - 在改变 current.next 之前存储 next 节点。\n   - 现在改变 current.next，这就是反转发生的地方。\n\
    \   - 将 prev 和 current 向移动一步。\n\n2.2 - 反转链表\n\n```java\npublic void reverse()\
    \ {\n  if (head == null) {\n    return;\n  }\n\n  Node prev = null;\n  Node current\
    \ = head;\n  Node next = null;\n  while (current != null) {\n    next = current.next;\n\
    \    current.next = prev;\n    prev = current;\n    current = next;\n  }\n  head\
    \ = prev;\n}\n```\n\n让我们看看 LinkedList 的第一次迭代中 reverse 方法中发生了什么：\n\n[s1 -> s2 ->\
    \ s3]\n\n| 操作 | 结果 |\n| :--- | :--- |\n| next = current.next | next 变为 s2，即 s1\
    \ 的下一个 |\n| current.next = prev | 现在 s1 的下一个指向 null |\n| prev = current | prev\
    \ 变为 s1 |\n| current = next | 下一次迭代将处理新的 current = s2 |\n\n# 测试\n\n```java\n@Test\n\
    public void reverseLinkedList() {\n    LinkedList<String> linkedList = new LinkedList<>();\n\
