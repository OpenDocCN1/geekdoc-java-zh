    \ this:\n\n1, 2, Fizz, 4, Buzz, Fizz, 7, 8, Buzz, 11, Fizz, 13, 14, Fizz-Buzz,\
    \ 16, 19, ...\n\n# Solution\n\nIt looks like a simple algorithm but is \"hard\"\
    \ for some programmers because they try to follow the following reasoning:\n\n\
    ```\nif (theNumber is divisible by 3) then\n    print \"Fizz\"\nelse if (theNumber\
    \ is divisible by 5) then\n    print \"Buzz\"\nelse /* theNumber is not divisible\
    \ by 3 or 5 */\n    print theNumber\nend\n```\n\nBut where do we print \"Fizz-Buzz\"\
    \ in this algorithm? The interviewer expects that you think for yourself and make\
    \ use of conditional without duplication. Realizing that a number by 3 and 5 is\
    \ also divisible by 3*5 is the key to a FizzBuzz solution. Listing 3.4 shows the\
    \ algorithm.\n\n# Listing 3.4 - FizzBuzz\n\n```\npublic class NumberUtils {\n\
    \    public static void fizzBuzz(int N) {\n        final String BUZZ = \"Buzz\"\
    ;\n        final String FIZZ = \"Fizz\";\n        for (int i = 1; i <= N; i++)\
