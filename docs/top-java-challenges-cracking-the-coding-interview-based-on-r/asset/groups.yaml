    \n处理冲突有两种解决方案：链地址法（Chaining），其中哈希数组中的每个条目指向它的链表。另一种是开放寻址法（open addressing），仅用一个数组存储所有项；当我们想要插入一个新的哈希键时，如果槽位已填充，算法将寻找另一个空槽来插入新项。这种搜索被称为探测序列（probe\
    \ sequence）。\n\n大多数编程语言已经已经实现了处理冲突和选择哈希函数的策略。\n\n## 7.1 设计哈希表\n\n设计一个哈希表，实现 add（添加）和\
