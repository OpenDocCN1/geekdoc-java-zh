    \ Class to store a list of Products. Moreover, the Class allows us to have two\
    \ Node attributes to hold the left and right nodes.\n\nListing 8.1.2 - NodeP Class\n\
    \n```\npublic class NodeP {\n    private String gtin;\n    private List<Product>\
    \ data;\n    private NodeP left;\n    private NodeP right;\n    public NodeP(String\
    \ gtin, List<Product> data) {\n        this.gtin = gtin;\n        this.data =\
    \ data;\n    }\n}\n```\n\nListing 8.1.3 shows a TreeP Class to implement an abstract\
    \ data type called binary search tree, which includes a NodeP root variable for\
    \ the first element to be inserted. We need to implement an insert method, every\
    \ time a new GTIN is inserted, it compares the current GTIN versus the new GTIN.\
    \ Depending on the result, we store the new GTIN on the left or the right Node.\
    \ In this way, the insert method maintains an ordered binary search tree.\n\n\
    Listing 8.1.3 TreeP and insert method\n\n```\npublic class TreeP {\n    private\
    \ NodeP root;\n    public void insert(String gtin, List<Product> data) {\n   \
    \     NodeP newNode = new NodeP(gtin, data);\n        if (root == null) {\n  \
    \          root = newNode;\n        } else {\n            NodeP current = root;\n\
    \            NodeP parent;\n            while (true) {\n                parent\
    \ = current;\n                if (gtin.compareTo(current.getGtin()) < 0) {\n \
    \                   current = current.getLeft();\n                    if (current\
    \ == null) {\n                        parent.setLeft(newNode);\n             \
