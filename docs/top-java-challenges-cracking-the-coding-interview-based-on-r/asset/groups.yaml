    \ Integer N, calculates the sum of all even numbers from 1 to N.\n\nSolution\n\
    \nIt looks like an easy program, but believe me, most experienced programmers\
    \ during the interview forget to use the operator \"%%\" which returns the remainder.\
    \ If it is 0, the number is even; otherwise, it is odd. Listing 3.1 shows the\
    \ algorithm.\n\nListing 3.1 - Sum of All Even Numbers from 1 to N\n\n```\npublic\
    \ class NumberUtils {\n  public static int sumOfEvenNumbers(int N) {\n    int\
    \ sum = 0;\n    for (int number = 1; number <= N; number++)\n      if ((number\
    \ % 2) == 0)\n        sum = sum + number;\n  \n    return sum;\n  }\n}\n```\n\n\
    Our code runs properly, but as Software Engineers, we need to care about code\
    \ efficiency. The following algorithm runs faster than the previous one because\
    \ it only loops the N/2 times.\n\n```\npublic class NumberUtils {\n  public static\
    \ int sumOfEvenNumbers(int N) {\n    int sum = 0;\n    int number = 2;\n    while\
    \ (number <= N) {\n      sum += number;\n      //increase number by 2, which in\
    \ definition\n      //is the next even number\n      number+=2;\n    }\n    return\
    \ sum;\n  }\n}\n```\n\nTests\n\n```\n@Test\npublic void sumOfEvenNumbers_test()\
    \ {\n  assertEquals(42, NumberUtils.sumOfEvenNumbers(12));\n  assertEquals(110,\
    \ NumberUtils.sumOfEvenNumbers(21));\n}\n```"
  - "[PAGE 35]\n\n# 3.2 Validate a Leap Year\n\nA leap year is a calendar year containing\
    \ an additional day. This extra day occurs in February. The following rules define\
    \ a leap year:\n\n+   - A year will be a leap year if it is divisible by 4, but\
    \ not by 100\n- A year will be a leap year if it is divisible by 400.\n\nSolution\n\
    \nWe use the % operator to verify if a year is divisible by 4, 100, or 400. Listing\
    \ 3.2 shows the algorithm.\n\nListing 3.2 - Validate a Leap Year\n\n```\npublic\
    \ class DateUtils {\n    public static boolean isLeapYear(int year) {\n      \
    \  return (year % 400 == 0) ||\n            (year % 4 == 0 && year % 100 != 0);\n\
    \    }\n}\n```\n\nThis algorithm had a real application in the Y2K problem, where\
    \ COBOL programs in a Bank used to store four-digit years with only the final\
    \ two digits, so you could not distinguish 2000 from 1900. In addition to calculating\
    \ a leap year:\n\nFor years represented from 50 to 99, add 19 at begin, resulting\
    \ in 1950 until 1999.\nFor years represented from 00 to 49, add 20 at begin, resulting\
    \ in 2000 until 2049.\n\nThe Bank assumed that before 2049 all systems would be\
    \ migrated to modern programming languages (digital transformation), but that\
    \ is another story.\n\nTests\n\n```\n@Test\npublic void isLeapYear() {\n    assertTrue(DateUtils.isLeapYear(400));\n\
    \    assertTrue(DateUtils.isLeapYear(2000));\n    assertTrue(DateUtils.isLeapYear(2020));\n\
    }\nnn@Test\npublic void is_notLeapYear() {\n    assertFalse(DateUtils.isLeapYear(401));\n\
    \    assertFalse(DateUtils.isLeapYear(2018));\n}\n```"
  - "[PAGE 36]\n\n# 3.3 Given an Integer N, Returns the Smallest Number of Digits\n\
    \nWrite a method, given an original number N of $d digits$, returns the smallest\
    \ number with the same number of digits. For example, given N=4751, the method\
    \ should return 1000. Given N=1, the method should return 0.\n\nSolution\n\nMaybe\
    \ the first idea that comes to our minds could be to iterate from the given number\
    \ and decrease one by one, and in every iteration to check if every new number\
    \ contains one digit less than the previous number. If the answer is True, the\
    \ previous one is the smallest number with the same number of digits as the original\
    \ number. Listing 3.3 shows the first algorithm for positive numbers.\n\nListing\
    \ 3.3 - Given an Integer N, Returns the Smallest Number of Digits\n\n```\npublic\
    \ class NumberUtils {\n    public static int smallest(int N) {\n        int smallestNumber\
    \ = 0;\n        if (N <= 1)\n            return smallestNumber;\n\n        int\
    \ numberOfDigitsOriginalN = String.valueOf(N).length();\n        while (N > 0)\
    \ {\n            if (String.valueOf(N).length() == (numberOfDigitsOriginalN -\
    \ 1)) {\n                return ++N;\n            }\n        }\n        return\
    \ smallestNumber;\n    }\n}\n```\n\nBut if we realize, the solution follows a\
    \ particular pattern:\n\nN = 4751 -> smallest number = 1000\nN = 189 -> smallest\
    \ number = 100\nN = 37 -> smallest number = 10\n\nThe smallest number is a power\
    \ of 10, where the exponent is: number of digits - 1\n\nSecond solution:"
  - "[PAGE 37]\n\n```\npublic static int smallest(int N) {\n    int smallestNumber\
    \ = 0;\n    if (N <= 1 || String.valueOf(N).length() == 1) {\n        return smallestNumber;\n\
    \    }\n    int numberOfOfDigits = String.valueOf(N).length();\n    return (int)\
    \ Math.pow(10, numberOfOfDigits - 1);\n}\n```\n\nIf we want to include negative\
    \ numbers, we must consider the smallest number with the same number of digits\
    \ and the same sign. Here the solution:\n\n```\npublic class NumberUtils {\n \
    \   public static int smallest(int N) {\n        int numberOfOfDigits = (int)\
    \ String.valueOf(Math.abs(N)).length();\n        if (N >= 0) {\n            if\
    \ (numberOfOfDigits == 1) {\n                return 0;\n            } else {\n\
    \                return (int) Math.pow(10, numberOfOfDigits - 1);\n          \
    \  }\n        } else {\n            return 1 - (int) Math.pow(10, numberOfOfDigits);\n\
    \        }\n    }\n```\n\nThe main idea in Analysis of Algorithms is always to\
    \ improve the algorithm performance by reducing the number of steps and comparisons.\
    \ The simpler and more intuitive an algorithm is, the more useful and efficient\
    \ it will be.\n\n# Tests\n\n```\n@Test\npublic void test_right_smallest_values()\
    \ {\n    assertTrue(NumberUtils.smallest(4751) == 1000);\n    assertTrue(NumberUtils.smallest(189)\
    \ == 100);\n    assertTrue(NumberUtils.smallest(37) == 10);\n    assertTrue(NumberUtils.smallest(1)\
    \ == 0);\n    assertTrue(NumberUtils.smallest(0) == 0);\n    assertTrue(NumberUtils.smallest(-1)\
    \ == -0);\n    assertTrue(NumberUtils.smallest(-38) == -99);\n}\n```\n\n```\n\
    @Test\npublic void test_wrong_smallest_values() {\n    assertFalse(NumberUtils.smallest(8)\
    \ == 1);\n    assertFalse(NumberUtils.smallest(2891) == 2000);\n}\n```"
  - "[PAGE 38]\n\n# 3.4 FizzBuzz\n\nWrite a program that will display all the numbers\
    \ between 1 and 100.\n\n+   - For each number divisible by three, the program\
