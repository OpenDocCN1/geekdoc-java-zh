    \ R>, which accepts two arguments and produces one.\n\n```\nBiFunction<Integer,\
    \ Integer, Integer> sum = (x1, x2) -> x1 + x2;\nInteger result = sum.apply(2,\
    \ 3);\nSystem.out.println(result); // 5\n```\n\nExponentiation involves two numbers:\
    \ the base b and the exponent or power n. Exponentiation corresponds to repeated\
    \ multiplication of the base n times. For instance, in the following expression:\
    \ 3⁵ = 243, we say that 243 is the 5th power of 3. Therefore, 243 is the correct\
    \ power of 3.\n\n# Solution\n\nWe do the inverse operation to verify if a number\
    \ is a valid power nth of another number (base).\n\nDivide the given number by\
    \ the base and evaluate if it provides a 0 remainder, then we iterate this operation\
    \ until we find a value of 1. Otherwise, if the rest is not 0, then the given\
    \ number is not a valid power nth of the base. Listing 3.5 shows a function, which\
    \ returns when a given number is the right power of a base.\n\n# Listing 3.5 -\
    \ Verify If a Number Is a Valid Power of a Base"
