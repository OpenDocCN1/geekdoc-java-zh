  mdcn: "\n给定一个数组：{9, 6, 5, 4}\n\n在第一次遍历中，我们必须进行三次比较 -> {6, 5, 4, 9}\n\n在第二遍遍历中，我们只需要进行两次比较，因为我们不需要比较最后两个数字\
    \ -> {5, 4, 6, 9}\n\n在第三次遍历中，我们只进行了一次比较 -> {4, 5, 6, 9}\n\n总结：\n\n3 + 2 + 1 =\
    \ 6 次比较，或者 (N-1) + (N-2) + (N-3) ... + 1 次比较\n\n此外，在这种情况下，每次比较都需要进行交换。因此，我们有 6\
    \ 次比较和 6 次交换 = 12，这大约是 4^2。随着元素数量 N 的增加，步骤数呈指数级增长，如下表所示。\n\n| N | 步骤数 | N^2 |\n\
    |---|---|---|\n| 4 | 12 | 16 |\n| 5 | 20 | 25 |\n| 10 | 90 | 100 |\n\n因此，在大 O\
    \ 算法中，我们可以说冒泡排序算法的效率为 O(N^2)。\n\n# 测试\n\n```java\n@Test\npublic void sortingArrays()\
    \ {\n    final int[] numbers = {6, 4, 9, 5};\n    final int[] expected = {4, 5,\
    \ 6, 9};\n    int[] numbersSorted = sorting.bubbleSort(numbers);\n    assertEquals(expected,\
    \ numbersSorted);\n}\n```\n\n```java\n@Test\npublic void sortManyArray() {\n \
    \   final int[] array = {7, 9, 1, 4, 9, 12, 4, 13, 9};\n    final int[] expected\
    \ = {1, 4, 4, 7, 9, 9, 9, 12, 13};\n    sorting.bubbleSort(array);\n    assertEquals(expected,\
    \ array);\n}\n```\n\n## 5.2 插入排序\n\n插入排序是一种通过逐个元素构建最终排序数组的排序算法。它与我们牌牌时对扑牌的方式类似。\n\
    \n解决方案\n\n- 遍历所有元素并从索引 i=1 开始。\n- 将当前元素（key）与其之前的所有元素进行比较。\n- 如果 key 元素小于它的前驱，则交换它们。将比\
    \ key 大的元素向其当前位置向前移动一位。\n\n该算法的运行时间为二次 O(n²)。列表 5.2 显示了该算法。\n\n列表 5.2 - 插入排序\n\
    \n```java\npublic class Sorting {\n    public int[] insertSort(int[] numbers)\
    \ {\n        if (numbers == null)\n            throw new RuntimeException(\"numbers\
    \ not initialized\");\n\n        for (int i = 1; i < numbers.length; i++) {\n\
    \            int key = numbers[i];\n            int j = i - 1;\n            while\
    \ (j >= 0 && numbers[j] > key) {\n                numbers[j + 1] = numbers[j];\n\
    \                j = j - 1;\n            }\n            numbers[j + 1] = key;\n\
    \        }\n        return numbers;\n    }\n}\n```\n\n示例：\n\nnumbers = {13, 12,\
    \ 14, 6, 7}\n\n当 i = 1 时。由于 13 大于 12，移动 13 将 12 插入 13 之前\n\n12, 13, 14, 6, 7\n\
    \n当 i = 2 时，14 将留在原位置，因为之前所有的元素都小于 14\n\n12, 13, 14, 6, 7\n\n当 i = 3 时，6 将移动到开头，所有从\
    \ 12 到 14 的元素都将向其当前位置向前移动一位\n\n6, 12, 13, 14, 7\n\n当 i = 4 时，7 将移动到 6 之后的位置，从\
    \ 12 到 14 的元素将向其当前位置向前移动一位\n\n6, 7, 12, 13, 14\n\n# 测试\n\n```java\n@Test\npublic\
    \ void testInsertionSort() {\n    final int[] numbers = {13, 12, 14, 6, 7};\n\
    \    final int[] expected = {6, 7, 12, 13, 14};\n    sorting.insertSort(numbers);\n\
