    \n# 递归\n\n## 4.0 基础\n\n调用自身的方法或函数被称为递归。递归函数是根据其自身定义的。我们总是包含一个基础情况（base case）来结束递归调用。\n\
    \n每次函数调用自身时，其参数在新的参数生效之前存储在栈（Stack）中。每次调用都会创建新的局部变量。因此，每次调用都有其参数和局部变量的副本。\n\n\
