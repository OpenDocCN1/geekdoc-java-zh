    # Huffman Coding


    Huffman encoding is another example of an algorithm where a greedy approach is
    successful. The Huffman algorithm analyzes a message and depending on the frequencies
    of the characters used in the message, it assigns a variable-length encoding for
    each symbol. A commonly used symbol will have a shorter encoding while a rare
    symbol will have a longer encoding. The Huffman coding algorithm takes information
    about the frequencies or probabilities of a particular symbol occurring. It begins
    the prefix tree from the bottom up, starting with the two probable symbols in
    the list. It takes those symbols and forms a sub-tree containing them, and removes
    the individual symbols from the list. The algorithm sums the probabilities of
    elements in a sub-tree and adds the sub-tree its probability to the list. Next,
    the algorithm searches the list for the two symbols or sub-trees with the smallest
    probabilities. It uses those to make a new sub-tree, removes the original sub-trees/symbols
    from the list, and then adds the new sub-tree and its combined probability to
    the list. This repeats until there is one tree and all elements have been added.
    At each sub-tree, the optimal encoding for each symbol is created and together
    composes the overall optimal encoding.'
