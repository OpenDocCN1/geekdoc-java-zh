    # 6.3.2 Accounting (Banker''s) Method


    The aggregate method directly seeks a bound on the overall running time of a sequence
    of operations. In contrast, the accounting method seeks to find a payment of number
    of extra time units charged to each individual operation such that the sum of
    the payments is an upper bound on the total actual cost. Intuitively, one can
    keep of maintaining a bank account. Low-cost operations are charged a little more
    than their true cost, and the surplus is deposited into the bank account for later
    use. High-cost operations can be charged less than their true cost, and the deficit
    is paid by the savings in the bank account. In way we spread the cost of high-cost
    operations over the entire sequence. The charges to each operation must be large
    enough that the balance in the bank account always remains positive, but small
    enough that no one operation is charged significantly more than its actual cost.


    We emphasize that the extra time charged to an operation does not mean that the
    operation takes that much time. It is just a method of accounting that makes the
    analysis easier.


    If we let $c''_i$ be the charge for the $i$-th operation and $c$ be the true cost,
    then we would like


    $\Sigma_{iIsn} c''_i \leq \Sigma_{iIsn} c_i$

    for all $n$, which shows that the amortized time $\Sigma_{iIsn} c''_i$ for that
    sequence of $n$ operations is a bound on the true time $\Sigma_{iIsn} c_i$'
