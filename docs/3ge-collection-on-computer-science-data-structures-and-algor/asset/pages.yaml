    | 3rd pass | | 9 | 14 | 72 | 64 | 58 | 27 | 63... |


    The selection sort marks the first element (27). It then goes through the remaining
    data to find the smallest number (1). It swaps this with the first element and
    the smallest element is now in its correct position. It then marks the second
    element (63) and looks through the remaining data for the next smallest number
    (9). These two numbers are then swapped. This process continues until n-1 passes
