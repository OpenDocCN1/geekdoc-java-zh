  md: '# Data Structures and Algorithms in Java


    on Data Structures needed to understand the complexity of enterprise level applications
    and need of algorithms, and data structures. Data Structure is a way of collecting
    and organizing data in such a way that we can perform operations on these data
    in an effective way. Data Structures is about rendering data elements in terms
    of some relationship, for better organization and storage.


    # 1.1 CONCEPTS OF DATA STRUCTURE


    Before introducing data structures we should understand that computers do store,
    retrieve, and process a large amount of data. If the data is stored in well-organized
    way on storage media and in computer''s memory then it can be accessed quickly
    for processing that further reduces the latency and the user is provided fast
    response.


    ![](img/1449c4fd66ab317cb1507765b74c8aa2_13_0.png)


    Data structure introduction refers to a scheme for organizing data, or in other
    words a data structure is an arrangement of data in computer''s memory in such
    a way that it could make the data quickly available to the processor for required
    calculations. A data structure should be seen as a logical concept that must address
    two fundamental concerns. First, how the data will be stored, and second, what
    operations will be performed on it? As data structure is a scheme for data organization
    so the functional definition of a data structure should independent of its implementation.
    The functional definition of a data structure is known as ADT (Abstract Data Type)
    which is independent of implementation. The implementation part is left on developers
    who decide which technology best suits to their needs. For example, a stack ADT
    is a structure which supports operations such as push and pop. A stack can be
    implemented in a number of ways, for example using an array or a linked list.


    Along with data structures introduction, in real life, problem solving is done
    with help data structures and algorithms. An algorithm is a step by step process
    to solve a problem. In programming, algorithms are implemented in form of methods
    or functions or routines. To get a problem'
  merge: -1
