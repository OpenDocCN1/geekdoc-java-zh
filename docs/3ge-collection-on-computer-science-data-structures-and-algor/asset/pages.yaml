    # Finding Optimal Solution using Branch and Bound


    The selection rule for the next node in BFS (breadth-first search) and DFS (depth-first
    search) is “blind”. That is the selection rule does not give any preference to
    a node that has a very good chance of getting the search to an answer node quickly.
    The search for an optimal solution can often be speedy by using an “intelligent”
    ranking function, also called an approximate cost function to avoid searching
    in sub-trees that do not contain an optimal solution. It is similar to BFS-like
    search but with one optimization. Instead of following FIFO (first in first out)
    order, we choose a live node with least cost. We may not get optimal solution
    by following node with least promising cost, but it will provide very good chance
    of getting the search to an answer node quickly.'
