    # 3.1 SEARCHING ALGORITHMS


    A search algorithm is any algorithm which solves the search problem, namely, to
    retrieve information stored within some data structure, or calculated in the search
    space of a problem domain, with discrete or continuous values. Specific applications
    of search algorithms include:


    +   Problems in combinatorial optimization, such as:

    - The vehicle routing problem, form of shortest path problem

    - The knaps problem: Given a set of items, each with a weight and a value, the
    number of each item to include in a collection so that the total weight is less
    than or equal to a given limit and the total value is as large as possible.

    - The nurse scheduling problem


    +   Problems in constraint satisfaction, such as:

    - The map coloring problem

    - Filling in a sudoku or crossword puzzle


    +   In game theory and especially combinatorial game theory, choosing the best
    move to make next (such as with the minmax algorithm)


    +   Finding a combination or password from the whole set of possibilities


    +   Factoring an integer (an important problem in cryptography)


    +   Optimizing an industrial process, such as a chemical reaction, by changing
    the parameters of the process


    +   Retrieving a record from a database


    +   Finding the maximum or minimum value in a list or array


    +   Checking to see if a given value is present in a set of values


    The classic search problems described above and web search are both problems in
    information retrieval, but are generally studied as separate subfields and are
    solved and evaluated differently. Web search problems are generally focused on
    filtering and finding documents that are most relevant to human queries. Classic
    search algorithms are typically evaluated on'
