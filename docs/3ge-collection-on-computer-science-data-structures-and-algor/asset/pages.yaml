  md: '# Java Basics 289


    # Execution


    The class files generated by the compiler are independent of the machine or the
    OS, which allows them to be run on any system. To run, the main class file (the
    class that contains the method main) is passed to the JVM, and then goes through
    three main stages before the final machine code is executed. These stages are:


    # Class Loader


    The main class is loaded into the memory by passing its ‘class’ file to the JVM,
    invoking the invoker. All other classes referenced in the program are loaded through
    the class loader.


    A class loader, itself an object, creates a flat name space of class bodies that
    are referenced by a string name. The method definition is:


    ```

    // loadClass function prototype

    ```


    ```

    Class r = loadClass(String className, boolean resolveit);

    ```


    ```

    // className: name of the class to be loaded

    ```


    ```

    // resolveit: flag to decide whether any referenced class should be loaded or
    not.

    ```


    There are two types of class loaders: primodial, and non-primodial. Primordial
    class loader is embedded into all the JVMs, and is the default class loader. A
    non-primodial class loader is a user-defined class loader, which can be coded
    in order to customize class-loading process. Non-primodial class loader, if defined,
    is preferred over the default one, to load classes.


    # Byte Verifier


    After the bytecode of a class is loaded by the class loader, it has to be inspected
    by the bytecode verifier, whose job is to check that the instructions don’t perform
    damaging actions. The following are some of the checks carried out:


    +   - Variables are initialized before they are used.

    - Method calls match the types of object references.

    - Rules for accessing private data and methods are not violated.

    - Local variable accesses fall within the runtime stack.

    - The run time stack does not overflow.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '+   - If any of the above checks fails, the verifier does not allow the class
    to be loaded.


    # Just-In-Time Compiler


    This is the final stage encountered by the java program, and its job is to convert
    the loaded bytecode into machine code. When using JIT compiler, the hardware can
    execute the native code, as opposed to having the JVM interpret the same sequence
    of bytecode repeatedly and incurring the penalty of a lengthy translation process.
    This can lead to performance gains in the execution speed, unless methods are
    executed less frequently.


    The process can be well-illustrated by the following diagram:


    ![](img/1449c4fd66ab317cb1507765b74c8aa2_301_0.png)


    Due to the two-step execution process a java program is independent of the target
    operating system. However, because of the same, the execution time is way more
    than a similar program written in a compiled platform-dependent program.'
