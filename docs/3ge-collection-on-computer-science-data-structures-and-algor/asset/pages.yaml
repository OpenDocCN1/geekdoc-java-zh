  md: '# 1.5 STACK AND QUEUE


    A queue is an ordered collection of items where new items happens at one end,
    called the “rear,” and the removal of existing items occurs at the other end,
    commonly called the “front.” As an element enters the queue it starts at the rear
    and makes its way towards the front, waiting until time it is the next element
    to be removed.


    The most recently added item in the queue must wait at the end of the collection.
    The item that has been in the collection the longest is at the front. This ordering
    principle is sometimes called FIFO, first-in first-out. It is also known as “first-come
    first-served.”


    ![](img/1449c4fd66ab317cb1507765b74c8aa2_55_0.png)


    The simplest example of a queue is the typical line that we all participate in
    from time to time. We wait in a line for a movie, we we wait in the check-line
    at a grocery store, and we wait in the cafeteria line.


    You introduce two closely-related data types for manipulating arbitrarily large
    collections of objects: the stack and the queue. Stacks and queues are special
    cases of the idea of a collection. Each is characterized by four operations: create
    the collection, insert an item, remove an item, and test whether the collection
    is empty. A stack may be represented by an array, but the new item should be placed
    in the next available place in the array rather than at the end of the array.


    # 1.5.1 Stack


    A stack is a container of objects that are inserted and removed according to the
    last-in first-out (LIFO) principle. In the pushdown stacks only two operations
    are allowed: push the item into the stack, and pop the item out of the stack.
    A stack is a limited access data structure - elements can be added and removed
    from the stack only at the top.'
