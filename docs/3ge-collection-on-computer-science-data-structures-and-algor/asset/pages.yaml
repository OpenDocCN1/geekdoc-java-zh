  md: "# Breadth First\n\nTraversing a tree in breadth first order yields the values\
    \ of all nodes of a particular depth in the tree before any deeper nodes. In other\
    \ words, given a depth d we would visit the values of all nodes at d in a left\
    \ to right fashion, then we would proceed to d + 1 and so on until we have no\
    \ more nodes to visit. An example of breadth first traversal is shown in Figure\
