    After all the data has been passed through once, the largest data item (72) will
    have "bubbled" through to the end of the list. At the end of the second pass,
    the second largest data item (64) will be in the second last position. For n data
    items, the process continues for n-1 passes, until no exchanges are made in a
    single pass.


