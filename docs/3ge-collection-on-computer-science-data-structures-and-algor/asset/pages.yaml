  md: '# Data Structure: Introduction


    +   ■ Converting a decimal number into a binary number


    # Queue


    Queue is a first-in-first-out data structure. The element that is added to the
    queue data structure first, will be removed from the queue first. Dequeue, priority
    queue, and circular queue are the variants of queue data structure. Queue has
    the following application uses:


    +   ■ Access to shared resources (e.g., printer)


    +   ■ Multiprogramming


    +   ■ Message queue


    # Trees


    Tree is a hierarchical data structure. The very top element of a tree is called
    the root of the tree. Except the root element every element in a tree has a parent
    element, and zero or more children elements. All elements in the left sub-tree
    come before the root in sorting order, and all those in the right sub-tree come
    after the root.


    Tree is the most useful data structure when you have hierarchical information
    to store. For example, directory structure of a file system; there are many variants
    of tree you will come. Some of them are Red-black tree, threaded binary tree,
    AVL tree, etc.


    # Heap


    Heap is a binary tree that stores a collection of keys by satisfying heap property.
    Max heap and min heap are two flavors of heap data structure. The heap property
    for max heap is: each node should be greater than or equal to each of its children.
    While, for min heap it is each node should be smaller or equal to each of its
    children. Heap data structure is usually used to implement priority queues.


    # Dictionary


    Dictionary is a data structure that maintains a set of items indexed on basis
    of keys. Dictionary stores data in form of key-element pairs.


    # Hash Table


    Hash Table is again a data structure that stores data in form of key-element'
