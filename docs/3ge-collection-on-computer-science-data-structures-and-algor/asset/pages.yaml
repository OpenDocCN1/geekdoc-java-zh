    # How to find minimum spanning tree?


    The Stupid method is to list all spanning trees, and find minimum of list.

    We already know how to find minima... But there are far too many trees

    for this to be efficient. It''s also really an algorithm, because you''d still

    need to know how to list all the trees.


    A better idea is to find some key property of the MST that lets us be

    sure that some edge is part of it, and use this property to build up the\MST one
    edge at a time.


    For simplicity, we assume that there is a unique minimum spanning

    tree. You can get ideas like to work without this assumption but it

    hcomes harder to state your theorems or prove your algorithms precisely.


    Lemma: Let X be any subset of the vertices of G, and let edge e be

    t smallest edge connecting X to G-X. Then e is part of the minimum

    spanning tree.


    Proof: Suppose you have a tree T not containing e; then I want to

    show that T is not the MST. Let e=(u,v), with u in X and v not in X. Then

    because T is a spanning tree it contains a unique path from u to v, which

    together with e forms a cycle in G. This path has to include another edge

    f connecting X to G-X. T-e is another spanning tree (it has the same

    number of edges, and remains connected since you can replace any path

    containing f by one going the other way around the cycle). It has smaller

    weight than t since has smaller weight than f. So T was not minimum,

    is is what we wanted to prove.


    # 5.1.2 Kruskal''s Algorithm


    You will start with Kruskal''s algorithm, which is easiest to understand

    and probably the best one for solving problems by hand.


    +   Kruskal''s algorithm:

    sort the edges of G in increasing order by length

    keep a subgraph of S, initially empty

    for each edge in sorted order

    if the endpoints of e are disconnected in S

    add to S


    return S'
