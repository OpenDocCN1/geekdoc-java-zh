  md: '# CHAPTER

    1

    DATA STRUCTURE: INTRODUCTION


    # INTRODUCTION


    A data structure is a specialized format for organizing, processing, retrieving
    and storing data. While there are several basic and advanced structure types,
    any data structure is designed to arrange data to suit a specific purpose so that
    it can be accessed and worked with in appropriate ways. In computer programming,
    a data structure may be selected or designed to store data for the purpose of
    working on it with various algorithms. Each data structure contains information
    about the data values, relationships between the data and functions that can be
    applied to the data.


    ![](img/1449c4fd66ab317cb1507765b74c8aa2_12_0.png)


    Data Structures are the programmatic way of storing data so that data can be used
    efficiently. Almost every enterprise application uses various types of data structures
    in one or the other way. This chapter will give you a great understanding'
  merge: -1
