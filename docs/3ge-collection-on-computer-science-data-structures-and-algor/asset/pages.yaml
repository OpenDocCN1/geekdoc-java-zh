  md: 'Note that, whenever you add an edge (u,v), it''s always the smallest connect-part
    of S reachable from u with the rest of G, so by the lemma it must be part of the
    MST.


    This algorithm is known as a greedy algorithm, because it chooses at each step
    the cheapest edge to add to S. You should be very careful when trying to use greedy
    algorithms to solve other problems, since it usually doesn''t work. E.g. if you
    want to find a shortest path from a to b, it might be a bad idea to keep taking
    the shortest edges. The greedy idea only works in Kruskal''s because of the key
    property we proved.


    Analysis: The line test whether two endpoints are disconnected looks like it should
    be slow (linear time per iteration, or O(mn) total). Actually there are some complicated
    data structures that let us perform each test in constant time; this is known
    as the union-find problem and is discussed in Base section 8.5 (you would not
    get to it in this class, though). The slowest part turns out to be the sorting
    step, which takes O(m log n) time.


    # 5.1.3 Prim''s Algorithm


    Rather than build a subgraph one edge at a time, Prim''s algorithm builds a tree
    one vertex at a time.


    Prim''s algorithm:


    let T be a single vertex x


    ```

    while (T has fewer than n vertices)

    {

    find the smallest edge connecting T to G-T

    add it to T

    }

    ```


    Since each edge added to G-T, the lemma we proved that we only add edges that
    should be part of the MST.


    Again, it looks like the loop has a slow step in it. But again, some data structures
    can be used to speed this up. The idea is to use a heap to remember, for each
    vertex, the smallest edge connecting T with that vertex.

    Prim with heaps:


    make a heap of values (vertex,edge,weight(edge))'
