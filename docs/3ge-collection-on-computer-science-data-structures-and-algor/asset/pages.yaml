    # 5.2.2 Graph Traversal


    Graph traversal is a method used to search nodes in a graph. The graph traversal
    is used to decide the order used for node arrangement. It also searches for edges
    without making a loop, which means all the nodes and edges can be searched without
    creating a loop.


    There are two graph traversal structures.


    # 1. DFS (Depth First Search): In-Depth Search Method


    The DFS search begins starting from the first node and goes deeper and deeper,
    exploring down until the targeted node is found. If the targeted key is not found,
    the search path is changed to the path that was stopped exploring the initial
    search, and the same procedure is repeated for branch.


    The spanning tree is produced from the result of this search. This tree method
    is without the loops. The total number of nodes in the stack data structure is
    used to implement DFS traversal.


    Steps followed to implement DFS search:


    Step 1 – Stack size needs to be defined depending on the total number of nodes.


    Step 2 – Select the initial node for transversal; it needs to be pushed to the
    stack by visiting that node.


    Step 3 – Now, visit the adjacent node that is not visited before and push to that
    stack.


    Step 4 – Repeat Step 3 until there is no adjacent node that is not visited.


    Step 5 – Use backtracking and node when there are no other nodes to be visited.


    Step 6 – Empty the stack by repeating steps 3,4, and 5.


    Step 7 – When the stack is empty, a final spanning tree is formed by eliminating
    unused edges.


    # Applications of DFS are:


    +   - Solving puzzles with only one solution.'
