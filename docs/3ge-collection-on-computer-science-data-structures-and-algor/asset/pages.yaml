    Shell sort is a highly efficient sorting algorithm and is based on insertion sort
    algorithm. This algorithm avoids large shifts as in case of insertion sort, if
    the smaller value is to the far right and has to be moved to the far left. This
    algorithm uses insertion sort on a widely spaced elements, first to sort them
    and then sorts the less widely spaced elements. This spacing is termed as interval.
    This interval is calculated based on Knuth’s formula as -


    ```

    h = h * 3 + 1

