  md: '# 6.2 DYNAMIC PROGRAMMING


    Dynamic programming is a very powerful technique to solve a particular class of
    problems. It demands very elegant formulation of the approach and simple thinking
    and the coding part is very easy. The idea is very simple, If you have solved
    a problem with the given input, then save the result for future reference, so
    as to avoid the same problem again. Shortly ‘Remember your Past’. If the given
    problem can be broken up into smaller sub-problems and these smaller sub problems
    are in turn divided into still-smaller ones, and in this process, if you observe
    some over-lapping sub problems, then its a big hint for DP. Also, the optimal
    solutions to the sub problems-contribute to the optimal solution of the given
    problem.


    Dynamic programming approach is similar to divide and conquer in breaking down
    the problem into smaller and yet possible subproblems. Unlike, divide and conquer,
    these sub-problems are not solved independently. Rather, results of these smaller
    sub-problems are remembered and used for similar or overlapping sub-problems.


    Dynamic programming is used where we have problems, which can be divided into
    smaller sub-problems, so that their results can be re-used. Mostly, these algorithms
    are used for optimization. Before solving the hand sub-problem, dynamic algorithm
    will try to examine the results of the previously solved sub-problems. The solutions
    of sub-problems are combined in order to achieve the best solution.


    So we can say that:


    +   - The problem should be able to be divided into smaller overlapping sub-problem.

    - An optimum solution can be achieved by using an optimum solution of smaller
    sub-problems.

    - Dynamic algorithms use memorization.


    # Comparison


    In contrast to greedy algorithms, where local optimization is addressed, dynamic
    algorithms are motivated by an overall optimization of the problem.


    In contrast to divide and conquer algorithms, where solutions are combined to
    achieve an overall solution, dynamic algorithms use the output of a smaller sub-problem
    and then try to optimize a bigger sub-'
