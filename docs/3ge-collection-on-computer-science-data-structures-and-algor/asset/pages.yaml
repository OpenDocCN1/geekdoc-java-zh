    # 4.2.1 Knapsack Problem


    The knapsack problem or rucksack problem is a problem in combinatorial optimization:
    Given a set of items, each with a weight and a value, determine the number of
    each item to include in a collection so that the total weight is less than or
    equal to a given limit and the total value is as large as possible.


    # 0/1 Knapsack


    Branch and bound is an algorithm design paradigm which is generally used for solving
    combinatorial optimization problems. These problems typically are exponential
    in terms of time complexity and may require exploring all possible permutations
    in worst case. Branch and Bound solve these problems relatively quickly.


    Let us consider below 0/1 Knapsack problem to understand Branch and Bound.


    Given two arrays val[0..n-1] and wt[0..n-1] that represent values and weights
    associated with n items respectively. Find out the maximum value subset of val[i]
    such that sum of the weights of this subset is smaller than equal to Knapsack
    capacity W.


    Let us explore all approaches for this problem.


    +   - A Greedy approach is to pick the items in decreasing order of value per
    unit weight. The Greedy approach works only for fractional knapsack problem and
    may not produce correct result for 0/1 knapsack.


    +   - We can use Dynamic Programming (DP) for 0/1 Knapsack problem. In DP, we
    use a 2D table of size nx W. The DP Solution does not work if item weights are
    not integers.


    +   - Since DP solution does not always work, a solution is to use Brute Force.
    With n items, there are 2^n solutions to be generated, check each to see if they
    satisfy the constraint, save maximum solution that satisfies constraint. This
    solution can be expressed as tree.'
