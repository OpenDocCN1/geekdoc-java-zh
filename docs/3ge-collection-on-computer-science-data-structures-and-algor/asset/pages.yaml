    ![](img/1449c4fd66ab317cb1507765b74c8aa2_151_1.png)


    The backtracking based solution works better than brute force by ignoring infeasible
    solutions. We can do better if we know a bound on best possible solution subtree
    rooted with every node. If the best in subtree is worse than current, we can simply
    ignore this node and its subtrees. So we compute bound (best solution) for every
    node and compare the bound with current best solution before exploring the node.


