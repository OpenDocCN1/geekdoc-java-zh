    # 2.2 EXPRESSING ALGORITHMS


    Algorithms can be expressed in many kinds of notation, including natural languages,
    pseudocode, flowcharts, Programming languages or control tables (processed by
    interpreters). Natural language expressions of algorithms tend to be verbose and
    ambiguous, and are rarely used for complex or technical algorithms. Pseudocode,
    flowcharts and control tables are structured ways to express algorithms that avoid
    many of the ambiguities common in natural language statements, while remaining
    independent of a particular implementation language. Programming languages are
    primarily intended for extending algorithms in a form that can be executed by
    a computer, but are often used as a way to define or document algorithms.


    There is a wide variety of representations possible and one can express a given
    Turing machine Programme as a sequence of machine tables, or as a form of rudimentary
    machine code or assembly code called “sets of quadruples”.


