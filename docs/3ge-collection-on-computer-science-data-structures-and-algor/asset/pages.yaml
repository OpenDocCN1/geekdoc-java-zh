    The cryptographic interfaces are provider-based, allowing for multiple and interoperable
    cryptography implementations. Some providers may perform cryptographic operations
    in software; others may perform the operations on a hardware token (for example,
    on a smartcard device or on a hardware cryptographic accelerator). Providers that
    implement export-controlled services must be digitally signed.


    The Java platform includes built-in providers for many of the most commonly used
    cryptographic algorithms, including the RSA, DSA, and ECDSA signature algorithms,
    the AES encryption algorithm, the SHA-2 message digest algorithms, and the Diffie-Hellman
    (DH) and Elliptic Curve Diffie-Hellman (ECDH) key agreement algorithms. Most of
    the built-in providers implement cryptographic algorithms in Java code.


    The Java platform also includes a provider that acts as a bridge to a native PKCS#11
    (v2.x) token, named SunPKCS11, allows Java applications to seamlessly access cryptographic
    services located on PKCS#11-compliant tokens. On Windows, the Java platform includes
    a built-in provider that acts as a bridge to the native Microsoft CryptoAPI. This
    provider, named MSCAPI, allows Java applications to seamlessly access cryptographic
    services on Windows through the CryptoAPI.'
