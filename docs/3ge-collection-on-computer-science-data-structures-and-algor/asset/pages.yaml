  md: "# Algorithm Design Methods 127\n\nNotice that the algorithm is expressed as\
    \ a boolean function. This is essential to understanding the algorithm. If solve(n)\
    \ is true, that means node n is part of a solution—that, node n is one of the\
    \ nodes on a path from the root to some goal node. We say that n is solvable.\
    \ If solve(n) is false, there is no path that connects to any goal node.\n\nHow\
    \ does this work?\n\n+   - If any child of n is solvable, then n is solvable.\n\
    - If no child of n is solvable, then n is not solvable.\n\nHence, to decide whether\
    \ any non-leaf node n is solvable (part of a path to a goal node), all you have\
    \ to test whether any child of n is solvable. This is done recursively, on each\
    \ child of n. In the above code, this is done by the lines\n\n```\nfor each child\
    \ c of n {\n  if solve(c) succeeds, return true\n}\nreturn false\n```\n\nEventually\
    \ the recursion will “bottom” out at a leaf node. If the leaf node is a goal node,\
    \ it is solvable; if the leaf is not a goal node, it is not solvable. This is\
    \ our base case. In the above code, this is done by the lines\n\n```\nif n is\
    \ a leaf node {\n  if the leaf is a goal node, return true\n  else return false\n\
    }\n```\n\nThe backtracking algorithm is simple but important. You should understand\
    \ it thoroughly. Another way of stating it is as follows:\n\n+   - To search a\
    \ tree:\n  1. If the tree consists of a single leaf, test whether it is a goal\
    \ node,\n  2. Otherwise, search the subtrees until you find one containing a goal\
    \ node, or until you have searched them unsuccessfully.\n\nConceptually, you start\
    \ at the root of the tree; the tree probably has some good and bad leaves, though\
    \ it be that the leaves are all good or bad. You want to get to a good leaf. At\
    \ each node, beginning with the root, you choose one of its children to move to,\
    \ and you keep this up until you get to a leaf.\n\nFor example, suppose you get\
    \ to a bad leaf. You can backtrack to continue the search for a good leaf by revoking\
    \ your most recent choice, and trying out the next option in set of options. If\
    \ you run out of options,"
