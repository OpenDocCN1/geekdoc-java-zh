  md: "Data Structures and Algorithms in Java\n\nthan at any other point in human\
    \ history, a field has grown up around their design, analysis, and refinement.\
    \ The field of algorithm design requires a strong mathematical background, with\
    \ computer science degrees being particularly sought-after qualifications. It\
    \ offers a growing number of highly compensated career options, as the need for\
    \ (well as more sophisticated) algorithms continues to increase.\n\n# 4.1 BACKTRACKING\
    \ ALGORITHM\n\nBacktracking is an approach to problem solving which is usually\
    \ applied to constraint satisfaction problems like puzzles. In a backtracking\
    \ solution, a search path is followed and the algorithm backtracks at a particular\
    \ point (also known as decision point) as soon as it realizes that this path would\
    \ not lead to a valid solution and then it follows another path starting from\
    \ a previous decision point. In this way, different paths are repeatedly explored\
    \ to arrive at the final solution. It is depth first traversal of path in graph\
    \ where nodes are states of the solution and edge are between two states of solution\
    \ only if one state can be reached from another.\n\nOnly difference between brute\
    \ force algorithm backtracking algorithm is that backtracking discards partial\
    \ solution as soon as possible without following them till end. Consider the problem\
    \ of solving a Sudoku. A naive algorithm will try to find every possible arrangement\
    \ of numbers and checks if the problem can be solved with a particular arrangement\
    \ but the backtracking algorithm provides a much better and efficient solution.\n\
    \nBacktracking is basically a refinement of the brute-force approach in which\
    \ the solution to a problem is found using systematic search rather than trying\
    \ out possible solutions blindly.\n\nHere is the algorithm (pseudocode) for doing\
    \ backtracking for a given node:\n\n```\nboolean solve(Node n) {\n  if n is a\
    \ leaf node {\n    if the leaf is a goal node, return true\n    return false\n\
    \  } else {\n    for each child c of n {\n      if solve(c) succeeds, return true\n\
    \    }\n    return false\n  }\n}\n```"
