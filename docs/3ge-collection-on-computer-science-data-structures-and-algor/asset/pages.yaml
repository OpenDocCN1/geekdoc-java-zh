    # 2.2.2 Analysis of Algorithms


    When analysing a Programme in terms of efficiency, we want to look at questions
    such as, “How long does it take for the Programme to run?” and “Is there another
    approach that will get the answer more quickly?” Efficiency will always be less
    important than correctness; if you do not care whether a Programme works correctly,
    you can run it quickly indeed, and no one will think it’s much of an achievement!
    On the other hand, a Programme that gives a correct answer after ten thousand
    years is not very useful, so efficiency is an important issue.


    The term “efficiency” can refer to efficient use of any resource, including time,
    computer memory, disk space, or network bandwidth. However, we will deal exclusively
    with time efficiency, and the major question that we want to ask about a Programme
    is, how long does it take to perform its task?


    It makes little sense to classify an individual Programme as being “efficient”
    or “inefficient.” It makes more sense to compare two (correct) Programmes that
    perform the same task and ask which one of the two is “more efficient,” that is,
    which one performs the task more quickly. However, even there there are differences.


    The running time of a Programme is not well-defined. The run time can be different
    depending on the number and speed of the processors in the computer on which it
    is run and, in the case of Java, on the design of the Java Virtual Machine which
    is used to interpret the Programme.'
