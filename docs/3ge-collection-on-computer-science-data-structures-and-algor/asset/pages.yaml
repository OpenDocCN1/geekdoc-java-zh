    First of all we will see the general plan for analyzing the efficiency of non-recursive
    algorithms. This plan tells us the steps to be followed while analyzing such algorithms.


    General Plan for Analyzing Efficiency of Non Recursive Algorithms


    +   - Decide the input size based on parameter n.

    - Identify algorithm''s basic operation(s).

    - Check how many times the basic operation is executed. Then find whether the
    execution of basic operation depends upon the input size n. Determine worst, average,
    and best cases for input of size n. If the basic operation depends upon worst
    case, average case and best case then that has to be analyzed separately.

