    # Why minimum spanning trees?


    The standard application is to a problem like phone network design. You have a
    business with several offices; you want to lease phone lines to connect them with
    each other; and the phone charges different amounts of money to connect different
    pairs of cities. You want a set of lines that connects all your offices with a
    minimum total cost. It should be a spanning tree, since if a network isn’t a tree
    you can always remove some edges and save money.


    A less obvious application is that the minimum spanning tree can be used to approximately
    solve the traveling salesman problem. A convenient formal way of defining this
    problem is to find the shortest path that visits each point at least once.


    Note that if you have a path visiting points exactly once, it’s a special kind
    of tree. For the example above, twelve sixteen spanning trees are actually paths.
    If you have a path visiting some vertices more once, you can always drop some
    edges to get a tree. In general the MST weight is less than the TSP weight, because
    it’s a minimization over a strictly larger set.


    On the other hand, if you draw a path tracing the minimum spanning tree, you trace
    each edge twice and visit all points, so the TSP weight is less than the MST weight.
    Therefore this tour is within a factor of two of optimal. There is a more complicated
    way (Christofides’ heuristic) of using minimum spanning trees to find a tour within
    a factor'
