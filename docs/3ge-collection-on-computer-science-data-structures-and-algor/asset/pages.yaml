    # 1.3 LINKED LISTS


    Linked lists can be thought of from a high level perspective as being a series
    of nodes. Each node has at least a single pointer to the next node, and in the
    last node''s case a null pointer representing that there are no nodes in the linked
    list.


    In DSA our implementations of linked lists always maintain head and tail pointers
    so that insertion at the head or tail of the list is a constant time operation.
    Random insertion is excluded from this and will be a linear operation. As such,
    linked lists in DSA have the following characteristics:


    +   - Insertion is O(1)'
