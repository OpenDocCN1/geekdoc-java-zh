  md: '# SEARCHING AND SORTING ALGORITHM


    # INTRODUCTION


    A sorting algorithm is an algorithm that puts elements of a list in a certain
    order. The most frequently used orders are numerical order and lexicographical
    order. Efficient sorting is important for optimizing the efficiency of other algorithms
    (such as search and merge algorithms) that require input data to be in sorted
    lists. Sorting is also often useful for canonizing data and for producing human-readable
    output. More formally, the output of any sorting algorithm must satisfy two conditions:


    +   - The output is in non-decreasing order (each element is no smaller than the
    previous element according to the desired total order);

    - The output is a permutation (a reordering, yet retaining all of the original
    elements) of the input.


    Further, the input data is often stored in an array, which allows random access,
    rather than a list, which only allows sequential access; though many algorithms
    can be applied to either type of data after suitable modification.


    Sorting algorithms are often referred to as a word followed by the word "sort"
    and grammatically are used in English as noun phrases, for example in the sentence,
    "it is inefficient to use insertion sort on large lists" the phrase insertion
    sort refers to the insertion sort sorting algorithm.


    The searching algorithms are used to search or find one or more than one element
    from a dataset. These type of'
