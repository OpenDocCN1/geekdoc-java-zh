    Then, we have proven that a greedy choice (the first activity $a_i$ to finish
    in $S_k$) combined with an optimal solution to the remaining set $S_{ki}$ yields
    an optimal solution to $S_k$. More generally, we design greedy algorithms according
    to the following sequence of steps:


    +   - Cast the optimization problem as one in which we make a choice and are left
    with one sub problem to solve.


    +   - Prove that there is always an optimal solution to the original problem that
    makes the greedy choice, so that the greedy choice is always safe.


    +   - Demonstrate optimal substructure by showing that, having made the greedy
    choice, what remains is a sub problem with the property that if we combine an
    optimal solution to the sub problem with the greedy choice we have made, we arrive
    at an optimal solution to the original problem.


    We shall use this more direct process. Nevertheless, beneath every greedy algorithm,
    there is almost always a more dynamic-programming solution.'
