    The Integer Deadline Scheduling problem is stated as follows:


    # Integer Deadline Scheduling


    Instance: A set $A=\{a_1, ..., a_n\}$ of $n$ jobs, each requiring unit time to
    complete, and associated with each job $a$ is an integer deadline $d(a)$ and an
    integer profit $p(a)$.


    Produce: A schedule $[a_{i_1}, ..., a_{i_k}]$ for a single processor such that
    the sum of the profits of all jobs which are processed before their deadline is
    maximum over all schedules.


    The solution here is trickier than the Minimum Spanning Tree problem since, first
    we can order jobs based on their deadlines or profits so we decide on which to
    base the ordering and second, we need a schedule (that is, a list) as output and
    not a subset. As you suspect, ordering on profit is correct (since we are trying
    to maximize profit). We use $T$ to hold a subset of jobs which $can$ be scheduled
    in such a way that all jobs in the subset can be completed before their deadlines.
    The final solution is obtained by finding that schedule for $T$ (easily done by
    ordering the jobs in $T$ by increasing deadline) and tacking onto that schedule
    jobs not in $T$ in any order.'
