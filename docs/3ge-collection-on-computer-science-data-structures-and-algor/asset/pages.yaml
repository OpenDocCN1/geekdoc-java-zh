    # 2. BFS (Breadth-First Search): Search is implemented using a queuing method


    Breadth-First Search navigates a graph in a breadth motion and utilizes based
    on the Queue to jump from one node to another, after encountering an end in the
    path.


    Steps to implement BFS,


    Step 1 – Based on the number of nodes, the Queue is defined.


    Step 2 – Start from any node of the traversal. Visit that node and add it to the
    Queue.


    Step 3 – Now check the non-visited adjacent node, which is in front of the Queue,
    and add that into the Queue, not to the start.


    Step 4 – Now start deleting the node that doesn''t have any edges need to be visited
    and is not in the Queue.


    Step 5 – Empty the Queue by repeating steps 4 and 5.


    Step 6 – Remove the unused edges and form the spanning tree only after the Queue
    is empty.


    # Applications of BFS:


    +   ■ Peer to Peer Networks- Like in Bittorrent, it is used to find all adjacent
    nodes.


    +   ■ Crawlers in Search Engine.


