  md: "# Data Structure: Introduction\n\nThe insertion algorithm is split for a good\
    \ reason. The first algorithm (non-recursive) checks a very core base case - whether\
    \ or the tree is empty. If the tree is empty then we create our root node and\
    \ finish. In all other cases we invoke the recursive InsertNode algorithm which\
    \ simply guides us to the first appropriate place to put value. Note that at each\
    \ stage we perform a binary chop: we choose to recurse into the left sub tree\
    \ or the right by comparing the new value with that of the current node. For any\
    \ totally ordered type, no value can simultaneously satisfy the conditions to\
    \ place it in both sub trees.\n\n# 1.4.2 Searching\n\nSearching a BST is even\
    \ simpler than insertion. The pseudo code is self-explanatory but we will look\
    \ briefly at the premise of the algorithm nonetheless.\n\nWe have talked about\
    \ insertion, we either go left or right with the right sub tree containing values\
    \ that are 2 x where x is the value of the node we are inserting. When searching\
    \ the rules are made a little more atomic and at one time we have four cases to\
    \ consider:\n\n+   - root = ∅ in which case value is not in the BST; or\n- root.Value\
    \ = value in which case value is in the BST; or\n- value < root.Value, we must\
    \ inspect the left sub tree of root for value; or\n- value > root.Value, we must\
    \ inspect the right sub tree of root for value\n\n```\nalgorithm Contains(root,\
    \ value)\nPre: root is the node of the tree, value is what we would like to locate\n\
    Post: value is either located or not\nif root = ∅\n  return false\nend if\nif\
    \ root.Value = value\n  return true\nelse if value < root.Value\n  return Contains(root.Left,\
    \ value)\nelse\n  return Contains(root.Right, value)\nend if\nend Contains\n```"
