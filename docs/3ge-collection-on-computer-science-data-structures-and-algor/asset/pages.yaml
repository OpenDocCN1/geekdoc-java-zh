    # 7.2.1 Java Language Security and Bytecode Verification


    The Java language is designed to be type-safe and easy to use. It provides automatic
    memory management, garbage collection, and range-checking on arrays. This reduces
    the overall programming burden placed on developers, leading to fewer subtle programming
    errors and to be safer, more robust code.


    In addition, the Java language defines different access modifiers that can be
    assigned to classes, methods, and fields, enabling developers to restrict access
    to their class implementations as appropriate. Specifically, the Java language
    defines four access levels: private, protected, public, and unspecified, package.
    The most open access specifier is public access allowed to anyone. The most restrictive
    modifier is private access not allowed outside the particular class in which the
    private member (a method, for example) is defined. The protected modifier allows
    access to any subclass, or to other classes within the same package. Package-level
    access only allows access to classes within the same package.


    A compiler translates Java programs into a machine-independent bytecode representation.
    A bytecode verifier is invoked to ensure that only legitimate bytecodes are executed
    in the Java runtime. It checks that the bytecodes conform to the Java Language
    Specification and do not violate Java language rules or namespace restrictions.
    The verifier also checks for memory management violations, stack underflows or
    overflows, and illegal datatype casts. Once bytecodes have been verified, the
    Java runtime prepares them for execution.


