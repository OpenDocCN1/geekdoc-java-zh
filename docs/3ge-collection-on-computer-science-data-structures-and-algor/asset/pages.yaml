  md: '# 6.1.7 Task-Scheduling Problem as a Matroid


    An interesting problem that can be solved using matroids is the problem of optimally
    scheduling unit-time tasks on a single processor, where each task has a deadline
    and a penalty that must be paid if the deadline is missed. The problem looks complicated,
    but it can be solved in a surprisingly simple manner using a greedy algorithm.


    A unit-task is a job, such as a program to be run on a computer, that requires
    exactly one unit of time to complete. Given a finite set S of unit-time tasks,
    a schedule for S is a permutation of S specifying the order in which these tasks
    are to be performed. The first task in the schedule begins at time 0 and finishes
    at time 1, the second task begins at time 1 and finishes at time 2, and so on.


    The problem of scheduling unit-time tasks with deadlines and penalties for a single
    processor has the following inputs:


    +   - a set $S = \{1, 2, \dots, n\}$ of unit-time tasks;

    - a set of $n$ integer deadlines $d_1, d_2, \dots, d_n$ such that each $d_i$ satisfies
    $1 \leqslant d_i$ and task $i$ is supposed to finish by time $d_i$;

    - a set of $n$ nonnegative weights or penalties $w_1, w_2, \dots, w_n$ such that
    a penalty $w_i$ is incurred if task $i$ is not finished by time $d_i$ and no penalty
    is incurred if task $i$ finishes by its deadline.


    We are asked to find a schedule for S that minimizes the total penalty incurred
    for missed deadlines.


    Consider a given schedule. We say that a task is late in this schedule if it finishes
    after its deadline. Otherwise, the task is early-first form, in which the early
    tasks always precede the late tasks. To see this, note that if some early task
    $x$ follows some late task $y$, we can switch the positions of $x$ and $y$ without
    affecting $x$ being early or $y$ being late.


    We similarly claim that an arbitrary schedule can be put into canonical form,
    in which the early tasks are ordered of nondecreasing deadlines. To do so, we
    put the schedule into early-first form. Then, as long as there are two early tasks
    $i$ and $j$ finishing at respective times $k$ and $k+1$ in the schedule that $d_j
    < d_i$, we swap the positions of $i$ and $j$. Since task $j$ is early before the
    swap, $k+1 \leqslant d_j$. Therefore, $k+1 < d_i$, and so task $i$ is still early
    after the swap. Task $j$ is moved earlier in the schedule, so the search for an
    optimal schedule thus reduces to finding a set A of tasks that are to be early
    in the optimal'
