    # SASL


    Simple Authentication and Security Layer (SASL) is an Internet standard that specifies
    a protocol for authentication and optional establishment of a security layer between
    client and server applications. SASL defines how authentication data is to be
    exchanged, but does not specify the contents of that data. It is a framework into
    which specific authentication mechanisms that specify the contents and semantics
    of the authentication data can fit. There are a number of standard SASL mechanisms
    defined by the Internet community for various security levels and deployment scenarios.


    The Java SASL API defines classes and interfaces for applications that use SASL
    mechanisms. It is defined to be mechanism-neutral; as an application that uses
    the API need not be hardwired into using any particular SASL mechanism. Applications
    can select the mechanism to use based on desired security features. The API supports
    both client and server applications. The javax.security.sasl.Sasl class is used
    to create SaslClient and SasIServer objects.


    SASL mechanism implementations are supplied in provider packages. Each provider
    may support one or more SASL mechanisms and is registered and invoked via the
    standard provider architecture.


