    # 2.3 DESIGNING OF ALGORITHMS


    At first glance, the algorithms move-until and quick-sort have little in common.
    One process structures; the other processes lists. One creates a new structure
    for the generative step; the other splits a list into three pieces and recur on
    two of them. In short, a comparison of the two examples of generative recursion
    suggests that the design of algorithms is an ad hoc activity and it is impossible
    to come with a general design recipe. A closer look, however, suggests a different
    picture.


    First, even when we speak of algorithms as processes that solve problems, they
    are still data that consume and produce data. In other words, we still choose
    data to represent a problem, and we must definitely understand the nature of our
    data if we wish to understand the process. Second, we describe the processes in
    terms of data, for example, "creating a new structure" or "partitioning a list
    of numbers."


    Third, we distinguish between input data for which it is trivial to produce a
    solution and for which it is not. Fourth, the generation of problems is the key
    to the design of algorithms. Although the idea of how to generate a new problem
    might be independent of a data representation, it must certainly be implemented
    for whatever form of representation we choose for our problem. Finally, once the
    generated problems have been solved, the solutions must be combined with other
    values.


