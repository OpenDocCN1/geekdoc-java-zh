  md: '# Data Structures and Algorithms in Java


    +   - Deletion is O(n)

    - Searching is O(n)


    Out of the three operations the one that stands out is of insertion. In DSA we
    chose to always maintain pointers (or more aptly references) to the node(s) at
    the head and tail of the linked list and so performing a traditional insertion
    it either the front or back of the linked list is an O(1) operation. An exception
    to this rule is performing an insertion before a node that is neither the head
    nor tail in a singly linked list. When the node we are inserting is somewhere
    in the middle of the linked list (known as random insertion) the complexity is
    O(n). In order to add before the designated node we need to traverse the linked
    list to find that node''s current predecessor yields an O(n) run time.


    This data structure is trivial, but linked lists have a few key points at times
    they make them very attractive:


    +   - the list is dynamically resized, thus it incurs no copy penalty an array
    or vector would eventually incur;

    - Insertion is O(1)


