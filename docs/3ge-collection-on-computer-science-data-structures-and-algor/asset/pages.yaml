    Then $(E, I)$ is a matroid.


    To see this two properties define a matroid. Property (1) is satisfied since removing
    any edge from a forest results in another forest. Property (2) is satisfied by
    the following argument: Start with any $I_1 I_2$ in $I$ with $|I_2| = |I_1|+1$.
    Consider three possibilities.


    +   - There is an edge $e$ of $I_2$ which has at most one vertex in common with
    a vertex that is an endpoint of an edge of $I_1$. In this case $I_1 \cup \{e\}$
    is a forest.

    - There is an edge $e$ of $I_2$ which has one vertex common to a vertex in one
    connected component of $I_1$ and the other vertex'
