  md: '# 1.1.2 Classification of Data Structures


    The term data structure refers to the organization of data in a computer’s memory,
    in order to retrieve it quickly for processing. It is a scheme for data organization
    to decouple the functional definition of a data structure from its implementation.
    A data structure is chosen based on the problem type and the operations performed
    on the data.


    If the situation requires various data types within a data structure, we can choose
    heterogeneous data structures. Linked, ordered, and unordered lists are grouped
    as heterogeneous data structures. Linear data structures are lists, sets, tuples,
    queues, stacks, and heaps. Trees, tables, and containers are categorized as nonlinear
    data structures. Two-dimensional and multidimensional arrays are grouped as homogeneous
    data structures. Dynamic data structures are dictionaries, tree sets, and sequences.


    The classification of data structures is show in the following:


    ![](img/1449c4fd66ab317cb1507765b74c8aa2_16_0.png)


    Data structures can be broadly classified in two categories - linear structures
    and hierarchical structures. Arrays, linked lists, stacks, and queues are linear
    structures, while trees, graphs, heaps etc. are hierarchical structures. Every
    data structure has its own strengths, and weaknesses. Also, every data structure
    specially suits to specific problem types depending upon the operations performed
    and the data organization. For example, an array is suitable for read operations.
    Following is a quick introduction to important data structures.


    # Arrays


    Arrays are statically implemented data structures by some programming'
