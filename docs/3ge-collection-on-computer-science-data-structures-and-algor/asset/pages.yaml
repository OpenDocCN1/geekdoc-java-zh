    of making the locally optimal choice at each stage. In many problems, a greedy
    strategy does not usually produce an optimal solution, but nonetheless, a greedy
    heuristic may yield locally optimal solutions that approximate a globally optimal
    solution in a reasonable amount of time. For example, a greedy strategy for the
    travelling salesman problem (which is of a high computational complexity) is of
    the following heuristic: “At each step of the journey, visit the nearest unvisited
    city.” This heuristic does not intend to find a best solution, but it terminates
    in a reasonable number of steps; finding an optimal solution to such a complex
    problem typically requires unreasonably many steps. In mathematical optimization,
    greedy algorithms typically solve combinatorial problems having the properties
