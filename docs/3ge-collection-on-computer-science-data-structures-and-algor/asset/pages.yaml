    # 5.1.1 Spanning Tree


    Spanning tree can be defined as a sub-graph of connected, undirected graph G that
    is a tree produced by removing the desired number of edges from a graph.


    In other words, Spanning tree is a non-cyclic sub-graph of a connected and undirected
    graph G that connects all the vertices together.


    A graph G can have multiple spanning trees.


    # Minimum Spanning Tree


    A minimum spanning tree is a spanning tree which has minimal total weight. In
    other words, minimum spanning tree is the one which contains the least weight
    among all other spanning tree of some particular weighted graph (every edge has
    some weight in a weighted graph).


    Now suppose the edges of the graph have weights or lengths. The weight of a tree
    is just the sum of weights of its edges. Obviously, different trees have different
    lengths. The problem: how to find the minimum spanning tree?


    This problem can be solved by many different algorithms. It is the topic of some
    very recent research. There are several "best" algorithms, depending on the assumptions
    you make:


    +   A randomized algorithm can solve it in linear expected time. [Karger, Klein,
    and Tarjan, "A randomized linear-time algorithm to find minimum spanning trees",
    J. ACM, vol. 42, 1995, pp. 321-328].'
