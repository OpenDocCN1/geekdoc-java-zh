    Suppose we are given a set $E=\{e_1, e_2, ..., e_n\}$ of $n$ objects, each with
    associated positive integer weights $w(e_1), w(e_2), ..., w(e_n)$. Let $I$ be
    a subset of the power set (the set of all subsets) of $E$ with the following properties:


    +   - For every $I$, in $I$, if $I_1$ is a subset of $I_2$, then $I_2$ is in $I$.

    - For every pair $I_1, I_2$ in $I$ such that $|I_2| = |I_1|+1$, there is an element
    $e \in I_2 - I_1$, which makes $I_1 \cup \{e\}$ in $I$.


    Then the pair $(E, I)$ is a matroid. Members of $I$ are referred to as independent
    sets. Independent sets containing the most elements are called maximum cardinality
    independent set. The problem of finding a maximum cardinality independent set
    $(I_{max})$ which minimizes (or maximizes) the sum of $w(e)$ over all $e$ in $E$
    may be solved as follows (the Greedy Method):


    Set $T = emptyset$

    Order all objects in $E$ by increasing (decreasing) weight

    Repeat the following until $E$ is empty

    Let $e$ be the lowest (highest) weight element in $E$

    Remove $e$ from $T$

    If $T \cup \{e\}$ is in $I$ then add $e$ to $T$


