    # 4.2.2 Assignment problem


    The assignment problem is one of the fundamental combinatorial optimization problems
    in the branch of optimization or operations research in mathematics. It consists
    of finding a maximum weight matching (or minimum weight perfect matching) in a
    weighted bipartite graph.


    Let there be N workers and N jobs. Any worker can be assigned to perform any job,
    incurring some cost that may vary depending on the work-assignment. It is required
    to perform all jobs by assigning exactly one worker to each job and exactly one
    job to each agent in a way that the total cost of the assignment is minimized.
    The reject procedure should be a Boolean function that returns true only if it
    is certain that no possible extension of c is a valid solution for P. If the procedure
    cannot reach a definite conclusion, it should return false.


