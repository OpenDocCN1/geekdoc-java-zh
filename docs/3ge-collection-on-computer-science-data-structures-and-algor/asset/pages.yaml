  md: '# Platform-Dependence


    To understand the primary advantage of Java, you''ll have to learn about platforms.
    In most programming languages, a compiler (or interpreter) generates code that
    can execute on a specific target machine. For example, if you compile a C++ program
    on a Windows machine, the executable file can be copied to any other machine but
    it will only run on other Windows machines but never another machine (e.g., a
    Mac or a Linux machine). A platform is determined by the target machine (along
    with its operating system). For earlier languages, language designers needed to
    create a specialized version of the compiler (or interpreter) for every platform.
    If you wrote a program that you wanted to make available on multiple platforms,
    you, the programmer, would have to do quite a bit of additional work. You would
    have to create multiple versions of your source code for each platform.


    Java succeeded in eliminating the platform issue for high-level programmers (such
    as you) because it has reorganized the compile-link-execute sequence as an underlying
    level of the compiler. Details are complicated but, essentially, the designers
    of the Java language isolated those issues which are dependent on the platform
    and developed low-level means to abstractly refer to these issues. Consequently,
    the Java compiler doesn''t create an object file, but instead it creates a bytecode
    file which is, essentially, an object file for a virtual machine. In fact, the
    Java compiler is often called the JVM compiler (for Java Virtual Machine).


    Consequently, you can write a Java program (or javac) on any platform and use
    the JVM compiler to generate a bytecode file (bytecode files use the extension
    .class). This bytecode file can be used on any platform (that has installed Java).
    However, bytecode is not an executable file. To execute a bytecode file, you actually
    need to invoke a Java interpreter'
  merge: -1
