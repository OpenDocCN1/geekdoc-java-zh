    Consider the problem of determining whether a given set A of tasks is independent.
    For t = 1, 2, . . . n, let N(A) denote the number of tasks in A whose deadline
    is t or earlier


    # Lemma


    For any set of A, the following statements are equivalent:


    +   - The set A is independent.

    - For t = 1, 2, . . . n, we have N(A) ≤ t.

    - If the tasks in A are scheduled in order of non-decreasing deadlines, then no
    task is late.


    # Proof


    Clearly, if N(A) > t for some t, then there is no way to make a schedule with
    late tasks for set A, because there are more than t tasks to finish before time
    t. Therefore, (1) implies (2). If (2) holds, then (3) must follow: there is no
    way to say "get stuck" when scheduling the tasks in order of non-decreasing deadlines,
    since (2) implies that the ith largest deadline is at most i. Finally, (3) trivially
    implies (1).


    Using property 2 of Lemma, we can easily compute whether or not a set of tasks
    is independent.


    The problem of minimizing the sum of the late tasks is the same as the problem
    of maximizing the sum of the early tasks. The following theorem ensures that we
    can use the greedy algorithm to find an independent set A of tasks with the maximum
    penalty.


    # Theorem


    If S is a set of unit-time tasks with deadlines, and I is the set of all independent
    sets of tasks, then the corresponding system (S,I) is a matroid.'
