    # Traceback Step


    After the matrix fill step, the maximum alignment score for the two test sequences
    is 6. The traceback step determines the actual alignment(s) that result in the
    maximum score. Note that with a simple scoring algorithm such as one that is used
    here, there are likely to be multiple maximal alignments.


    The traceback step begins in the M,J position in the matrix, i.e the position
    that is a 6 in location. Traceback takes the current cell and looks to the Neighbour
    cells that could be direct predecessors. This means it looks to the Neighbour
    to the left (gap in sequence #2), the diagonal Neighbour (match/mismatch), and
    the Neighbour above it (gap in sequence #1). The algorithm for traceback chooses
    the next cell in the sequence one of the possible predecessors. In this case,
    the Neighbours are marked in red. They are all equal to 5.'
