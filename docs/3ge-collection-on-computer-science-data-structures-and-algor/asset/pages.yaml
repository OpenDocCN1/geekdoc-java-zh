    # SUMMARY


    +   - An algorithm design technique is a general approach to solving problems
    algorithmically that is applicable to a variety of problems from different areas
    of computing.


    +   - An algorithm is a series of instructions, often referred to as a “process”,
    which is to be followed when solving a particular problem.


    +   - An algorithm design technique is a general approach to solving problems
    algorithmically that is applicable to a variety of problems from different areas
    of computing


    +   - A backtracking algorithm is a recursive method of building up feasible solutions
    to a combinatorial optimization problem one step at a time.


    +   - Branch and bound is a technique used in integer optimization problems that
    is optimization problems for which the variables are integers.


    +   - Backtracking is a general algorithm which finds all complete solutions to
    a problem by building over partial solutions.


    +   - Subset problem is to find subset of elements that are selected from a given
    set whose sum adds up to a given number K.


    +   - A branch-and-bound algorithm consists of a systematic enumeration of candidate
    solutions by means of state space search: the set of candidate solutions is thought
    of as forming a rooted tree with the full set at the root.'
