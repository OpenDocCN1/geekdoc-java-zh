    # 7.2.6 Secure Communication


    The data that travels across a network can be accessed by someone who is not the
    intended recipient. When the data includes private information, such as passwords
    and credit card numbers, steps must be taken to make the data unintelligible to
    unauthorized parties. It is also important to ensure that you are sending the
    data to the appropriate party, and that the data has not been modified, either
    intentionally or unintentionally, during transport.


    Cryptography forms the basis required for secure communication. The Java platform
    also provides API support and provider implementations for a number of standard
    secure communication protocols.


    # SSL/TLS


    The Java platform provides APIs and an implementation of the SSL and TLS protocols
    that includes functionality for data encryption, message integrity, server authentication,
    and optional client authentication. Applications can use SSL/TLS to provide for
    the secure passage of data between two peers over any application protocol, such
    as HTTP on top of TCP/IP.


    The javax.ssl.SSLSocket represents a network socket that encapsulates SSL/TLS
    support on top of a normal stream socket (java.Socket). Some applications might
    want to use alternate transport abstractions (e.g., New-IO); the javax.ssl.SSLEngine
    class is available to produce and consume SSL/TLS packets.


    The Java platform also includes APIs that support the notion of pluggable (provider-based)
    key managers and trust managers. A key manager is encapsulated by the javax.net.KeyManager
    class, and manages the keys used to perform authentication. A trust manager is
    encapsulated by the TrustManager class (in the same package), and makes decisions
    about who to trust based on certificates in the key store it'
