    To account for this dependency, we can consider either the worst case run time
    analysis or the average case run time analysis of an algorithm. For a worst case
    run time analysis, we consider all possible problems of size n and look at the
    longest possible run time for all such problems. For an average case analysis,
    we consider all possible problems of size n and look at the average of the run
    times for all such problems. Usually, the average case analysis assumes that all
    problems of size n are equally likely to be encountered, although this is not
    always realistic — even possible in the case where there is an infinite number
    of different problems of a given size.


    In many cases, the average and the worst run times are the same within a constant
    multiple. This means that as asymptotic analysis is concerned, they are the same.
    That is, if the average run time is O(f(n)) or Θ(f(n)), then so is the worst case.
    However, later in the book, we will encounter a few cases where the average and
    worst asymptotic analyses differ.


