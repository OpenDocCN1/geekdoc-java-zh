    Proof


    We show that the cost B(T) of tree T can be expressed in terms of the cost B(T\`).
    By considering the component costs in equation, B(T) = Σf(c)d(c), we show that
    the cost B(T) of tree T can be expressed in terms of the cost B(T\`). For each
    c belongs to C - {x, y}, we have dt(c) = d(c).


    ```

    Σ_{cC} f[c]d(c) = Σ_{C-{x,y}} f[c]d(c)

    = f[x](d(z) + 1) + f[y] (d(z) + 1)

    = (f[x] + f[y]) d(z) + f[x] + f[y]

    ```


    And B(T) = B(T\`) + f(x) + f(y)


    If T'' is non-optimal prefix code for C`, then there exists a T\` whose leaves
    are the characters belongs to C\` that B(T\`) < B(T). Now, if x and y are added
    to T\` as children of z, then we get a prefix code for alphabet C with cost B(T\`)
    + f(x) + f[y] < B(T). Contradicting the optimality of T. Which implies that, tree
