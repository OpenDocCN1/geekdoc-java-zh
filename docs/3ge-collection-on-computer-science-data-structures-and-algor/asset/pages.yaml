  md: '# Greedy Algorithms 199


    How can we tell whether a greedy algorithm will solve a particular optimization
    problem? No way are works all the time, but the greedy-choice property and optimal
    substructure the two key ingredients. If we can demonstrate that the problem has
    these properties, then we are well on the way to developing a greedy algorithm
    for it.


    A greedy strategy for the traveling salesman problem (which is of a high computational
    complexity) is the following heuristic: “At each stage visit an unvisited city
    nearest to the current”. This heuristic does not find a best solution, but terminates
    in a reasonable number of steps; finding an optimal solution typically requires
    unnecessarily many steps. In mathematical optimization, greedy algorithms solve
    combinatorial problems having the properties of matroids.


    # Greedy-Choice Property


    The first key is the greedy-property: we can assemble a globally optimal solution
    by making locally optimal (greedy) choices. In other words, when we are considering
    which choice to make, we make the choice that looks best in the current problem,
    without considering results from sub problems.


    Here is where greedy algorithms differ from dynamic programming. In dynamic programming,
    we make a choice at each step, but the choice usually depends on the solutions
    to sub problems. Consequently, we typically solve dynamic-programming problems
    in a bottom-up manner, progressing from smaller sub problems to larger sub problems.
    (Alternatively, we can solve them top down, by memorizing. Of course, even though
    the code works top down, we must still solve the sub problems before making a
    choice.) In a greedy algorithm, we make whatever choice seems best at the moment
    and then solve the sub problem that remains. The choice made by a greedy algorithm
    may depend on choices so far, but it cannot depend on any future choices or on
    the solutions to sub problems. Thus, unlike dynamic programming, which solves
    the sub problems before making the first, a greedy algorithm makes its first choice
    before solving any sub problems. A dynamic-programming algorithm proceeds bottom
    up, whereas a greedy strategy generally progresses in a top-down fashion, making
    one greedy choice after another, reducing each given problem instance to a smaller
    one.


    Of course, we must prove that a greedy choice at each step yields a globally optimal
    solution. The proof examines a globally optimal solution to some sub problem.
    It then shows how to modify the solution to substitute the greedy choice for some
    other choice, resulting in one similar,'
