  md: '# Data Structure: Introduction 3


    solved we not only want algorithm but also an efficient algorithm. One criteria
    of efficiency is time taken by the algorithm, another could be the memory it takes
    at run time.


    Sometimes, we can have more than one algorithm for the same problem and we have
    to choose the best among available algorithms. This is done by algorithm analysis.
    The best algorithm is the one which has a fine balance between time and memory
    consumption. But, as we know the best rarely, and we generally give more priority
    to the time taken by the algorithm rather than the memory it consumes. Also, as
    memory is getting cheaper and computers have more memory today than previous time,
    therefore, run time analysis becomes more significant than memory.


    # 1.1.1 Basic Concepts


    In computer science, a data structure is a data organization, management, and
    storage format that enables efficient access and modification. More precisely,
    a data structure is a collection of data values, the relationships among them,
    and the functions or operations that can be applied to the data.


    The basic terms related to data structure:


    # Data Definition


    Data Definition defines a particular data with the following characteristics.


    +   - Atomic – Definition should define a single concept.

    - Traceable – Definition should be able to be mapped to some data element.

    - Accurate – Definition should be unambiguous.

    - Clear and Concise – Definition should be understandable.


    # Data Object


    Data Object represents an object having a data.


    # Data Type


    Data type is a way to classify various types of data such as integer, string,
    etc. which determines the values that can be used with the corresponding type'
  merge: -1
