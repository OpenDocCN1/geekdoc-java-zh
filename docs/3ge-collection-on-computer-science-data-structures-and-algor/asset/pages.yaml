  md: '# Data Structures and Algorithms in Java


    make a list L of n trees, each a single vertex

    while (L has more than one tree)


    for each T in L, find the smallest edge connecting T to G-T

    add all edges to the MST

    (causing pairs of trees in L to merge)


    As we saw in Prim''s algorithm, each edge you add must be part of the MST, so
    it must be to add them all at once.


    Analysis: This is similar to merge sort. Each pass reduces the number of trees
    by a factor of two, so there are O(log n) passes. Each pass takes time O(m) (first
    figure out which each vertex is in, for each edge test whether it connects two
    trees and is better than the ones seen before for the trees on either endpoint)
    so the total is O(m log n).


    #  5.1.5 A Hybrid Algorithm


    This is not really a separate algorithm, but you can combine two of the classical
    algorithms and do better than either alone. The idea is to do O(log log n) passes
    of Boruvka''s algorithm, then switch to Prim''s algorithm. Prim''s algorithm then
    builds one large tree by connecting it with the small trees in the list L built
    by Boruvka''s algorithm, keeping a heap which stores, for each tree in L, the
    best edge that can be used to connect it to the large tree. Alternately, you can
    think of collapsing the trees found by Boruvka''s algorithm into “supervertices”
    and running Prim''s algorithm on the resulting smaller graph. The point is that
    this reduces the number of min operations in the heap used by Prim''s algorithm,
    to equal the number of trees left in L after Boruvka''s algorithm, which is O(n
    / log n).


    Analysis: O(m log log n) for the first part, O(m + (n/log n) log n) = O(m + n)
    for the second, so O(m log log n) total.


