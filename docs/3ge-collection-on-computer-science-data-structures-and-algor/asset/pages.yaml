    # Constructing a Huffman Code


    Huffman invented a greedy algorithm that constructs an optimal prefix code called
    a


    Huffman code. Its proof of correctness relies on the greedy-choice property and
    optimal substructure. Rather than demonstrating that these properties hold and
    then developing pseudocode, we present the pseudocode first. Doing so will help
    clarify how the algorithm makes greedy choices.


    In the pseudocode that follows, we assume that C is a set of n characters and
    each c ∈ C is an object with an attribute c:freq its frequency. The algorithm
    builds the tree T corresponding to the optimal code in a bottom-up merge. It begins
    with a set of [C] leaves and |C|-1 “merging” operations to create the final tree.
    The algorithm uses a min-priority queue, keyed on the freq attribute, to identify
    the two least-frequent objects to merge. When we merge two objects, the result
    is a new object whose frequency is the sum of the frequencies of the two objects
    that were merged.


    ```

    HUFFMAN(C)

    1 n = |C|

    2 Q = C

    3 for i = 1 to n - 1

    4   allocate a new node z

    5   z.left = x = EXTRACT-MIN(Q)

    6   z.right = y = EXTRACT-MIN(Q)

    7   z.freq = x.freq + y.freq

    8   INSERT(Q, z)

    9 return EXTRACT-MIN(Q) // return root of the tree

    ```


    For our example, Huffman''s algorithm proceeds as shown in Figure 4. Since the
    alphabet contains 6 letters, the initial queue size is n=6, and 5 merge steps
    build the tree. The tree represents the optimal prefix code. The code word for
    a letter is the sequence of edge labels on the simple path from the root to the
    letter. Line 2 initializes the min-priority queue Q with the characters in C.
    The loop for lines 3–8 repeatedly extracts the two nodes x and y of lowest frequency
    names x and y in the proof of correctness. Therefore, we find it convenient to
    leave them in.'
