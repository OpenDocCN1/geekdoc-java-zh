  md: '# 1.4.3 Deletion


    Removing a node from a BST is fairly straightforward, with four cases to consider:


    +   - the value to remove is a leaf node; or

    - the value to remove has a right subtree, but no left subtree; or

    - the value to remove has a left subtree, but no right subtree; or

    - the value to remove has both a left and right subtree in which case promote
    the largest value in the left subtree


    There is also an implicit fifth case whereby the node to be removed is the only
    node in the tree. This case is already covered by the first, but should be noted
    as a possibility nonetheless.


