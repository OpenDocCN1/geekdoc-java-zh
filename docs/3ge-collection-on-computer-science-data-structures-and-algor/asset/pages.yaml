    \ on the stack;\n    while the stack is not empty {\n        if the node at the\
    \ top of the stack is a leaf {\n            if it is a goal node, return true\n\
    \            else pop off the stack\n        }\n        else {\n            if\
    \ the node at the top of the stack has untried children\n                push\
    \ the next untried child onto the stack\n            else pop the node off the\
    \ stack\n        }\n    }\n    return false;\n}\n```\n\nStarting from the root,\
    \ the only nodes that can be pushed onto the stack are the children of the node\
    \ currently on the stack, and these are only pushed by one child at a time; hence,\
    \ the nodes on the stack at all times describe a valid path in the tree. Nodes\
    \ are removed from the stack only when it is known they have no goal nodes among\
    \ their descendant. Therefore, if the root node gets removed (making the stack\
    \ empty), there must have been no goal nodes at all, and no solution to the problem.\n\
    \nWhen the stack algorithm terminates successfully, the nodes on the stack form\
    \ (in reverse order) a path from the root to a goal node.\n\nSimilarly, when the\
    \ recursive algorithm finds a goal node, the path information is embodied (in\
