    Lemma - Optimal Substructure Property


    Let T be a full binary tree representing an optimal prefix code over an alphabet
    C, where frequency f[c] is define for each character c belongs to C. Consider
    any two characters x and y that appear as sibling leaves in the tree T and let
    z be their parent. Then, considering character with frequency f[z] = f[x] + f[y],
    tree T` = T - {x, y} represents an optimal code for the alphabet C\`


