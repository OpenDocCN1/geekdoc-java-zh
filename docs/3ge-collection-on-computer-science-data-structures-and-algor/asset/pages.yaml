  md: '# 4.1.2 n-Queen’s Problem


    The N Queen Problem is one of the best problem used to teach backtracking and
    of course recursion. Backtracking is a general algorithm which finds all complete
    solutions to a problem by building over partial solutions. In this process, the
    problem might reach to a partial solution which may not result into a complete
    solution. Such partial solutions are effectively rejected by the backtracking
    algorithm.


    In this problem, you are given an empty chess board of dimensions N * N. The task
    is to place N queens, in each row such that they cause no harm to each other.
    The basic idea is mentioned below:


    +   * Start from the first row

    * Select a column and if it is empty, well within the limits of the board and
    in no immediate danger, then place the queen in the cell

    * Proceed to the next row


    +   * all the rows are safely filled

    * somewhere down the line, one of the queens cannot be placed in a row. Here we
    need to backtrack, because a decision was wrongly made in the past


    Algorithm:


    +   * Place the queens column wise, start from the left column

    * If all queens are placed.

    * return true and print the solution matrix.


    +   * Else

    1. Try all the rows in the current column.

    2. Check if queen can be placed safely if yes mark the current cell in solution
    matrix as 1 and try to solve the rest of the problem recursively.

    3. If the queen in above step leads to the solution return true.

    4. If placing the queen in above step does not lead to the solution, BACKTRACK,
    mark the current cell in solution matrix as 0 and return false.


    +   * If all rows are tried and nothing worked, return false and print NO SOLUTION.'
