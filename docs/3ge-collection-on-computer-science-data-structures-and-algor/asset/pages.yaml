    # 6.3 AMORTIZED ANALYSIS


    In an amortized analysis, the time required to perform a sequence of data-structure
    operations is averaged over all the operations performed. Amortized analysis can
    be used to show that the average cost of an operation is small, if one averages
    over a sequence of operations, even though a single operation may be expensive.
    Amortized analysis differs from average-case analysis in probability is not involved;
    an amortized analysis guarantees the average performance of each operation in
    the worst case.


    Amortized analysis is a worst-case analysis of a sequence of operations to obtain
    a tighter bound on the overall or average cost per operation in the sequence than
    is obtained by separately analyzing each operation in the sequence. For instance,
    when we considered the union and find operations for the disjoint set data abstraction
    earlier in the semester, we were able to bound the running time of individual
    operations by O(log n). However, for a sequence of n operations, it is possible
    to obtain tighter than an O(n log n) bound. Here we will consider a simplified
    version of the hash table problem above, and show that a sequence of n insert
    operations has overall time O(n).


    There are three main techniques used for amortized analysis:


    +   - The aggregate method, where the total running time for a sequence of operations
    is analyzed.

    - The accounting (or banker''s) method, where we impose an extra charge on inexpensive
    operations and use it to pay for expensive operations later.

    - The potential (or physicist''s) method, in which we derive a potential function
    characterizing the amount of work we can do in each step. This potential either
    increases or decreases with each successive operation, but cannot be negative.


    Consider an extensible array that can store any arbitrary number of integers,
    like an ArrayList or Vector in Java. These are implemented in terms of ordinary
    (non-extensible) arrays. Each add operation inserts a new element after all the
    elements previously inserted. If there are no empty cells left, a new array of
    the size is allocated, and all the'
