  md: '# Boolean Data Type


    The Boolean data type is used to store only two possible values: true and false.
    This data type is used for simple flags that track true/false conditions.


    The Boolean data type specifies one bit of information, but its “size” can''t
    be defined precisely.


    Example: Boolean one = false


    # Byte Data Type


    The byte data type is an example of primitive data type. It is an 8-bit signed
    two''s complement integer. Its value-range lies between -128 to 127 (inclusive).
    Its minimum value is -128 and maximum value is 127.


    The byte data type is used to save memory in large arrays where the memory savings
    is most required. It can also be used in place of “int” data type.


    Example: byte a = 10, byte b = -20


    # Short Data Type


    The short data type is a 16-bit signed two''s complement integer. Its value-range
    lies between -32,768 to 32,767 (inclusive). Its minimum value is -32,768 and maximum
    value is 32,767. Its default value is 0.


    The short data type can also be used to save memory just like byte data type.
    A short data is 2 times smaller than an integer.


    Example: short s = 10000, short r = -5000


    # Int Data Type


    The int data type is a 32-bit signed two''s complement integer. Its value-range
    lies between -2,147,483,648 (-2^31) to 2,147,483,647 (2^31 -1) (inclusive). Its
    minimum value is -2,147,483,648 and maximum value is 2,147,483,647. Its default
    value is 0.


    The int data type is generally used as a default data type for integral values
    unless there is no problem about memory.


    Example: int a = 100000, int b = -200000'
