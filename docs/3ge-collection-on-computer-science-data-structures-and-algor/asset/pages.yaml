    +   - Data Structure is a way of collecting and organizing data in such a way
    that we can perform operations on these data in an effective way.


    +   - A data structure is a data organization, management, and storage format
    that enables efficient access and modification. More precisely, a data structure
    is a collection of data values, the relationships among them, and the functions
    or operations that can be applied to the data.


    +   - The term data structure refers to the organization of data in a computer''s
    memory, in order to retrieve it quickly for processing. It is a scheme for data
    organization to decouple the functional definition of a data structure from its
    implementation.


    +   - Data Structures is about rendering data elements in terms of some relationship,
    for better organization and storage.


    +   - The functional definition of a data structure is known as ADT (Abstract
    Data Type) which is independent of implementation.


    +   - Data type is a way to classify various types of data such as integer, string,
    etc. which determines the values that can be used with the corresponding type
    of data, the type of operations that can be performed on the corresponding type
    of data.


    +   - Stacks and queues are special cases of the idea of a collection. Each is
    characterized by four operations: create the collection, insert an item, remove
    an item, and test whether the collection is empty.


    +   - A stack is a container of objects that are inserted and removed according
    to the last-in- first-out (LIFO) principle.'
