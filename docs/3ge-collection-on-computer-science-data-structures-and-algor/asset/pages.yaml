  md: '# Algorithms of Data Structure 65


    It can depend on details of the compiler which is used to translate the Programme
    from high-level language to machine language. Furthermore, the run time of a Programme
    depends on the size of the problem which the Programme has to solve. It takes
    a sorting Programme longer to sort 10000 items than it takes it to sort 100 items.


    When the run of two Programmes are compared, it often happens that Programme A
    solves small problems faster than Programme B, while Programme B solves larger
    problems than Programme A, so that it is simply not the case that one Programme
    is faster than the other in cases.


    In spite of these difficulties, there is a field of computer science dedicated
    to analysing the efficiency of Programmes. The field is known as Analysis of Algorithms.
    The focus is on algorithms, rather than on Programmes as such, to avoid to deal
    with multiple implementations of the same algorithm written in different languages,
    compiled with different compilers, and running on different computers. Still,
    even though it is a theoretical field, every Programmer should be aware of some
    of its techniques and results. Because this is not a mathematics book, the treatment
    will be informal. One the main techniques of algorithms is asymptotic analysis.
    The term "asymptotic" means basically "the tendency in the long run." An asymptotic
    analysis of algorithm''s run time looks at the question of how the run time depends
    on the size of the problem.


    The analysis is asymptotic because it considers what happens to the run time as
    the size of the problem increases without limit; it is not concerned with what
