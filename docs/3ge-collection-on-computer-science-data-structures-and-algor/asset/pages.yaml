  md: '# Data Structures and Algorithms in Java


    languages like C and C++; hence the size of this data structure must be known
    at compile time and cannot be altered at run time. But modern programming languages,
    for example, Java implements arrays as objects and give the programmer a way to
    alter the size of them at run time. Arrays are the most common data structure
    used to store data.


    Arrays are arguably easier data structures to use and access. But inserting an
    item to an array and deleting it from the array are situation dependent. If you
    want to insert an item at a particular position which is already occupied by some
    element then you have to shift all items from the position the new element has
    to be inserted then the new item. The time taken by insert operation is depend
    on how big the array is, and at which position the item is being inserted. The
    same is true about deletion of an item.


    If the array is unsorted then search operation is also proved costly and takes
    O(N) time in worst case, where N is size of the array. But if the array is sorted
    then search performance is improved magically and O(logN) time in worst case.


    # Linked List


    Linked list data structure provides better memory management than arrays. Because
    linked list is allocated memory at run time, so, there is no waste of memory.
    Performance wise linked list is slower than array because there is no direct access
    to linked list elements.


    Linked list is proved to be a useful data structure when the number of elements
    to be stored is not known ahead of time. There are many flavors of linked list
    you will see: linear, circular, doubly, and doubly circular.


    # Stack


    Stack is a last-in-first-out strategy data structure; this means that the element
    stored in last will be removed first. Stack has specific but very applications;
    some of them are as follows:


    +   - Solving Recursion - recursive calls are placed onto a stack, and removed
    from there once they are processed.

    - Evaluating post-fix expressions

    - Solving Towers of Hanoi

    - Backtracking

    - Depth first search'
