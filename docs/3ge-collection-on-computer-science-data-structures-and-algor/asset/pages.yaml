  md: '# 7.2.4 Public Key Infrastructure


    Public Key Infrastructure (PKI) is a term used for a framework that enables secure
    exchange of information based on public key cryptography. It allows identities
    (of people, organizations, etc.) to be bound to digital certificates and provides
    a means of verifying the authenticity of certificates. PKI encompasses keys, certificates,
    public key encryption, and trusted Certification Authorities (CAs) who generate
    and sign certificates.


    The Java platform includes APIs and provider support for X.509 digital certificates
    and Certificate Revocation Lists (CRLs), as well as PKIX-compliant certification
    path building and validation. The classes related to PKI are located in the java.security
    and java.security.cert packages.


    # Key and Certificate Storage


    The Java platform provides for long-term persistent storage of cryptographic keys
    and certificates via key and certificate stores. Specifically, the java.security.KeyStore
    class represents a key store, a secure repository of cryptographic keys and/or
    trusted certificates (to be used, for example, during certification path validation),
    and the java.security.cert.CertStore class represents a certificate store, a public
    and potentially vast repository of unrelated and typically untrusted certificates.
    A CertStore may also store CRLs.


    KeyStore and CertStore implementations are distinguished by types. The Java platform
    includes the standard PKCS11 and PKCS12 key store types (whose implementations
    are compliant with the corresponding PKCS specifications as well as a proprietary
    file-based key store called JKS (which stands for “Java Key Store”).


    The Java platform includes a special built-in JKS key store, cacerts, that contains
    a number of certificates for well-known, trusted CAs. The keytool utility is used
    to list the certificates in cacerts.


    The SunPKCS11 provider mentioned in “Cryptography” includes a PKCS11 KeyStore
    implementation. This means that keys and certificates residing in secure hardware
    (such as a smartcard) can be accessed and used by Java applications that smart
    keys may not be permitted to leave the device. In such cases, the java.security.Key
    object reference returned by the KeyStore API may simply be a reference to the
    key (that is, would not contain the actual key material). Such a Key object can
    only be used to perform cryptographic operations on the device where the actual
    key resides.'
