    # Access Control


    The access control architecture in the Java platform protects access to sensitive
    resources (for example, local files) or sensitive application code (for example,
    methods in a class). All access control decisions are mediated by a security manager,
    represented by the java.lang.SecurityManager class. A SecurityManager must be
    installed into the Java runtime in order to activate the access checks.


    Java applets and Web Start applications are automatically run with a SecurityManager
    installed. However, local applications executed via the java command by default
    run with a SecurityManager installed. In order to run local applications with
    a SecurityManager, either the application itself must programmatically set one
    via the setSecurityManager method (in the java.lang.System class), or java must
    be invoked with a -Djava.security.manager on the command line.


