    # Prefix Codes


    We consider here codes in which no code word is also a prefix of some other code
    word. Such codes are called prefix codes. Although we won''t prove it here, a
    prefix code can always achieve the optimal data compression among any character
    code, and so we suffer no generality by restricting our attention to prefix codes.
    Encoding is always simple for any binary character code; we just concatenate the
    code words representing each character of the file. For example, with the variable-length
    prefix code of Figure 2, we code the 3-character file abc as 0 101 100 D 0101100,
    "where" denotes concatenation. Prefix codes are desirable because they simplify
    decoding. Since no code is a prefix of any other, the code word that begins an
    encoded file is unambiguous. We can simply identify the initial code word, translate
    it back to the original character, and repeat the decoding process on the remainder
    of the encoded file. In our example, the string 001011101 parses uniquely as


    0 0 101 1101 , which decodes to aabe.'
