  md: '# Default permissions granted to the code


    This information is associated with the code regardless of whether the code is
    downloaded over an untrusted network (e.g., an applet) or loaded from the file
    system (e.g., a local application). The location from which the code was loaded
    is represented by the signer''s certificate chain, and default permissions are
    represented by java.security.Permission objects.


    The default permissions automatically granted to downloaded code include the ability
    to make network connections back to the host from which originated. The default
    permissions automatically granted to code loaded from the local file system include
    the ability to read files from the directory it came from, and also from subdirectories
    of that directory.


    Note that the identity of the user executing the code is not available at class
    loading time. It is the responsibility of application code to authenticate the
    end user if necessary. Once the user has been authenticated, the application can
    dynamically associate that user with executing code by invoking the doAs method
    in the javax.security.auth.Subject class.


    # Policy


    As mentioned earlier, a limited set of default permissions are granted to code
    by class loaders. Administrators have the ability to flexibly manage additional
    code permissions via a security policy.


    The Java platform encapsulates the notion of a security policy in the java.security.Policy
    class. There is only one Policy object installed into the Java runtime at any
    given time. The basic responsibility of the Policy object is to determine whether
    access to a protected resource is permitted to code (characterized by where it
    was loaded from, who signed it, and who is executing it). How a Policy makes this
    determination implementation-dependent. For example, it may consult a database
    containing authorization data, or may contact another service.


    The Java platform includes a default Policy implementation that reads its authorization
    data from one or more ASCII (UTF-8) files configured in the security properties
    file. These policy files contain the exact sets of permissions granted to code:
    specifically, the exact sets of permissions granted to code loaded from particular
    locations, signed by particular entities, and executing as particular users. The
    policy entries in each file must conform to a documented proprietary syntax, and
    may be composed via a simple text editor or the graphical policytool utility.'
