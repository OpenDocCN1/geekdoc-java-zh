  md: '# Searching and Sorting Algorithm 89


    how fast they can find a solution, and whether that solution is guaranteed to
    be optimal. Though information retrieval algorithms must be fast, the quality
    of ranking is more important, as is whether good results have been left out and
    bad results included.


    The appropriate search algorithm often depends on the data structure being searched,
    and may also include prior knowledge about the data. Some database structures
    are specially constructed to search algorithms faster or more efficient, such
    as a search tree, hash map, or a database index.


    Search algorithms can be classified based on their mechanism of searching. Linear
    search algorithms check every record for the one associated with a target key
    in a linear fashion. Binary, or half interval searches, repeatedly center the
    center of the search structure and divide the search space in half. Comparison
    search improves on linear searching by successively eliminating records based
    on comparisons of the keys until the target record is found, and can be applied
    on data structures with a defined order. Digital search algorithms work on the
    properties of digits in data structures that use numerical keys. Finally, hashing
    directly maps keys to records based on a hash function. Searches outside a linear
    search require that the data be sorted in some way.


    Algorithms are often evaluated by their computational complexity, or maximum theoretical
    run time. Binary search functions, for example, have a maximum complexity of O(log
    n), or logarithmic time. This means the maximum number of operations needed to
    find the search target is a logarithmic function of the size of the search space.


    An algorithm is a step-by-step procedure or method for solving a problem by a
    computer in a given number of steps. The steps of an algorithm may include repetition
    depending upon the problem for which the algorithm is written in human readable
    and understandable form.


