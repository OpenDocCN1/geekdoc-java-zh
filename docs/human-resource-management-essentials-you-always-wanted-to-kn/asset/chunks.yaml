    法院有权通过限制违规者的参与活动来惩罚任何违规者。这适用于未能履行法律要求的违约公司。违约公司可能被要求或被逐出多项可能影响其产率的活动。此类公司可能会经历生产力的缓慢或快速下降，导致产率低迷。


    ### 技能员工流失


    违约公司面临着流失技能员工的风险，因为这些员工不希望以公司未能遵守法律为代价，冒着个人操守或道德的风险。此外，工作氛围可能会受到损害，导致生产力不足、缺乏信任甚至员工职业倦怠。原因之一可能是公司没有对其卫生、电力、燃气或水务政策进行标准化。所有这些因素都是危险的，并将迫使员工离开公司。


    ### 生产力下降


    一个高效的组织会认可并遵守所在管辖区的现行法律。这意味着该组织遵守法律设定的政策，并执行符合管辖区要求的政策。其中之一是通过提供必要的工作工具和资源来善待员工。其他方面还包括对在此期间表现优秀的员工给予认可、鼓励和奖励。鼓励这种表现意味着遵守员工待遇标准，并将说服员工留任。而在某些情况下，不合规会导致生产力低下，并违反规范雇主与员工工作条款法律。


    ### 声誉受损和客户流失


    不合规的公司往往面临失去价值客户的命运。“名声狼藉”是大多数公司的结果。此外，可能需要很长时间才能有效重建并纠正这种印象。


    ## 3.4. 法律法规合规性的维护


    维护是一种保护的文化。在资源管理和法律合规方面，它涉及法律认为相关的因素的保护。这高度构成了劳动合同，以及工作效率所需的资源和工具。组织应该建立这些标准，这些标准不能相互冲突，且必须符合法律的要求。违反或无法达到要求的标准是受到惩罚的，并被视为违法行为。


    正如 Koziarz 所评，以符合管辖区要求的方式管理或维护资源成本会更低。同样，在违约或违反法律后对法律进行赔偿将是昂昂的。有几项合规法律需要了解和维护。如果可能的话，请向相应的管辖区或管理机构请求，或在网上搜索组织所在地管辖区的要求。


    同时，以下是一些适用于所有组织的主要合规法律：


    ### 电力


    1989 年《工作电力条例》要求组织实行一种抑制工作场所电气危害的维护文化。所有电气状况必须良好，并且必须执行如测试便携式设备等行动以确保功能完备。


    所有这些措施的实施旨在防止任何生命危害。不执行此类电气管理标准的公司面临法律惩罚的风险。在大多数组织中，聘请专门从事此工作的公司提供正式报告是种做法。


    ### 水资源


    肮脏的地面和表面必须冲洗，以防止威胁生命的感染。法律规定的标准是处理任何场所的积水或消除积水。所有表面必须保持整洁，必须设计适当的水道，并防止或修复任何种的泄漏。


    不能浪费水资源，水必须能够满足家庭和工业用途。必须聘请注册机构对设施进行评估，以确定水质状况，修理破损的水管，并确保其符合标准。


    ### 燃气


    1998 年《燃气安全条例》强调了频繁检查燃气系统以确保人员安全的。气体泄漏必须被发现并立即进行更换。商业燃气设备必须状况良好并始终保持运行，而不应成为啮类动物和昆虫的栖息地。为了识别并减少不便的损坏和故障，必须由认证工程师或持证的工程机构进行检查。


    ### 卫生


    1974 年《健康与安全法》强调了工作场所良好的卫生状况。环境必须整洁，不受任何来源的污染。在浴室和其他必要的房间内必须提供适当的消毒剂和抗菌产品。客户和员工都必须体验良好的氛围，组织场所不应有乱扔垃圾和暴露的荒地。


    ## 章节总结


    a) 法律合规旨在确保所有员工得到适当的对待和安全。


    b) 确保公司合规对组织内部和外部都有益处。


    c) 不合规或违反法律要求可能导致巨额罚款或限制公司活动。适用于所有组织的一些主要合规法律包括电力、水、燃气和卫生标准。


    ## 测验 3


    1) 下列哪项不是遵守法律指令的关键原因？


    a) 拥抱人力资源管理的通用理论

    b) 留住技能劳动力

    c) 维护诚信和声誉

    d) 防止不必要的罚款


    2) ______ HR 政策应与法律保持一致，并服务于 ________、________ 和 ________ 的利益。


    a) 外部、员工、客户、董事会

    b) 内部、员工、公司、法律

    c) 内部、员工、法律、客户

    d) 外部、员工、法律、公司


    3) 下列所有项都是适用于所有组织的合规法律，除了：


    a) 卫生

    b) 水资源

    c) 燃气

    d) 温度


    4) 未遵守法律和法规合规性可能导致：[选择所有适用项]


    a) 罚款

    b) 资源没收

    c) 公司关门

    d) 客户对公司的印象

    e) 以上均非


    5) 选择正确的陈述。


    a) 合规仅要求中大型组织遵守法律。较小组织可以豁免，因为它们尚未稳固地建立作为财务良好组织的角色。

    b) 不合规的惩罚限于金钱或罚款。

    c) 违反法规的组织将失去员工的尊重。

    d) 不合规组织不应担心对客户的影响，因为这是一个内部问题，仅涉及公司和法律。


    上述问题的答案可以从本书的[在线资源](http://www.vibrantpublishers.com)部分下载。**

