    # 第 8 章：人力资源管理中的 IT 平台：HRMS VS HRIS VS HCM


    第八章讨论并比较了不同的 IT 平台。重点关注以下内容：


    a) 人力资源管理中三个三个 IT 平台：`HRMS`、`HRIS` 和 `HCM`

    b) 三个特定 IT 平台之间的相似之处与差异。

    c) `HRMS`、`HRIS` 和 `HCM` 的特征。


    ![Image](img/image-1.png)


    人力资源管理中的技术扩展到多个领域，包括人力资源管理系统 (`HRMS`)、人力资源信息系统 (`HRIS`) 和人力资本管理 (`HCM`)。这涵盖了组织管理的方方面，并在应用得当时会非常有效。人力资源管理中的技术概念也延伸到各个领域。正如前面提到的，这是一个宽泛的概念，它的发展取决于管理技术流程的个人能力。大多数拥有专门资源管理部门的组织仍然会将责任委托给特定的个人。


    在任何管理中，如果没有对技术进行妥善的规划和实施，管理系统将会变差，并影响组织。如果意识到技术的关联性并将其引入系统，情况将相反。在技术到位的情况下，系统削弱的概率很低。这是因为管理层可以从组织事务的多个方面中抽出精力，专注于专注于制定更有效的策略。例如，在政策管理方面，人力资源管理不需要派遣一个团队或个人去法院排队学习并带回更新信息。司法系统只需在互联网上上传新数据，而管理部门则下载评审结果以确保合规，并更新现有的政策。


    本节将比较资源管理的三个方面，包括 `HRMS`、`HRIS` 和 `HCM`。这些基石之间没有任何区别。然而，它们是人力资源管理的组成部分。简而言之，一个智能的人力资源部门必须将管理分为分为单位。


    `HRMS` 有时可以与 `HRIS` 通用。然而，这两个系统是不同的。`HRMS` 完全管理组织的劳动力数据、活动数据、策略和计划。该系统包含有助于透视组织并跟踪相关活动的条目。它也可以定义组织的数据集合。这意味着
    `HRMS` 是组织信息的核心。每个人力资源人员可能都必须参考这些工具，以便更全面地了解自己的职责。


    `HRIS` 纯粹关注信息。这个技术工具存储了相关数据，如公司政策、运营模式、员工详情、公司预算、公司目标等。它是 `HRMS` 的一个子系统，但区别在于它更关注信息的存储和检索。由于其敏感性，它是最关乎安全性的工具。


    本研究的第三个点是人力资本管理 (`HCM`)。`HCM` 同样是人力资源管理中 `HRMS` 的一个方面。`HCM` 主要与员工发展有关。它仅仅是对被称为“人力资本”的优秀劳动力的寻找，以及对这种劳动动力的发展和留任。


    ## 8.1 人力资源管理系统 (HRMS)


    `HRMS` 涉及组织、劳动力以及其他部分的整体管理。它直接涉及在系统运行中应用任何科学的、有序且简单的原则。它有时被称为人力资源信息 (`HRIS`)，但这将限制其目的。与
    `HRIS` 不同，`HRMS` 涵盖了每个策略、管理技能、员工活动、工资系统、安全功能和雇主目标。许多组织认为这是管理的未来方向。作为数据库管理，它使得数据可以随时方便快捷地存储和检索。`HRMS`
    也可以称为用于雇主、员工和管理的自动化工具。通过系统集成，组织可以轻松、方便地在线运行特定任务。例如，某些组织的员工可以在线申请请假或休息，而无需向管理层发送纸质材料。当此请求到达系统时，系统会自动扫描并评估该请求。随后会将回复给员工，通知其是否符合条件。


    在不久之前，维护员工记录的过程要困难得多。组织不得不面临手动存储数据的丢失，有时这种丢失是由火灾、洪水、地震等自然灾害造成的。一个良好的 `HRMS` 将所有相关数据备份在某处，以便任何丢失的信息都能在世界任何地方被轻松替换或检索。


    组织喜欢与最有技能和最投入的人才合作。第一步是确保这一成就的招聘。系统有助于收集和招聘能够做出贡献的合格人才。`HRMS` 是每个组织在业务每个部门保持活跃所需的。此外，在该部门拥有正确的人员很重要。素质较低的人力资源人员难以应对需求。即使有技术资源，如果困难很大，考虑投入更多人员来加强并提升结果。


    ## 8.2 人力资源信息系统 (HRIS)


    人力资源信息系统 (`HRIS`) 是 `HRMS` 的一个子方面。这个方面涉及信息的获取。这些信息是组织规划策略和跟踪其进展所需的。从实际上，它是人力资源管理中最敏感的方面，也是
    `HRMS` 的子方面。


