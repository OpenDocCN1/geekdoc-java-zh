    ### Commodity Approach

    This is more or less regarded as a traditional approach since it is only interested
    in the production stance of a company. The approach involves commodifying employees
    and could well do away with such employees once the goal is attained. Sometimes,
    such employees could be retained, but the sense here is that the company arbitrates
    what happens and at any moment. This agrees with the hard model of Human Resource
    Management, which is organization-concerned.


    ### System Approach

    Human Resource Management is a concept that comprises components to function.
    The components include all things, abstract, concrete, and humanly that contribute
    to the positive or negative yields of a company.


    ### Human Resource Approach

    Human resources possess the productive prowess to bolster up or down the position
    of a company. Because human resources create a competitive advantage, they must
    be regarded and even rewarded. This approach of Human Resource Management coincides
    with the soft theory, which argues human resources as essential for organizational
    growth. As John F. Kennedy once said, “Our progress as a nation can be no swifter
    than our progress in education. The human mind is our fundamental resource.”


    ### Proactive and Reactive Approach

    A proactive management team saves organizations tons of losses and setbacks in
    productivity and gains. When an organization adopts a proactive approach, the
    chances are that there will be more effective decisions for the betterment of
    such an organization.


    On the other hand, when an organization adopts a reactive approach, the chances
    of a steady decline becomes inevitable. The reaction could be to address staffing
    problems, production problems, managerial problems, and more. Approaching organizational
    impediments continuously with a reactive formality would eventually lead to a
    breakdown of a part of the organization or the organization in entirety.


    ## 1.4 Basic Functions of Human Resource Management

    Edwin Flippo (2007) posits that Human Resource Management is the “planning, organizing,
    directing, controlling or procurement, development, compensation, integration,
    maintenance and separation of human resources to the end that individual, organizational,
    and social objectives are accomplished.”


    According to Flippo’s definition of Human Resource Management, it is clear that
    this concept refers mainly to the supervisory and managerial forms of an organization.


    Additionally, other leading minds in the HR realm have suggested primary functions
    of human resources management. These primary functions are typically broken down
    into:


    a) Managerial functions

    b) Operative functions


    The managerial functions are comprised of:

    a) Planning

    b) Staffing

    c) Organizing

    d) Directing

    e) Controlling


    The operative functions are more widely suggested as various individuals have
    contributed to their idea of a comprehensive list. Most familiar, the operative
    functions are characterized as:

    a) Recruitment or hiring

    b) Job analysis and design

    c) Performance appraisal

    d) Training and development

    e) Compensation

    f) Wage and salary administration

    g) Benefits administration

    h) Employee health and welfare

    i) Maintenance and retention

    j) Labor and employee relations

    k) Research

    l) Legal compliance

    m) Records management


    ![A screenshot of a cell phone Description automatically generated](images/HRM1.png)


    ### Recruitment of Skilled Employees

    It is ideal for maintaining an intelligent and skillful workforce by employing
    the best talent to complement the roles, the culture and the vision of the company.
    Human Resource Management is responsible for the intake of persons they perceive
    would be of a great addition and purpose to the company. Recruitment of otherwise
    unfit persons would mean a decline in the productivity and competitive prowess
    of the organization.


    ### Directing

    A company’s human resources or workers may, at some point, not know what or what
    not to do. Human Resource Management then attempts to set objectives and put the
    human resources on a course to success. Without that, productive activities might
    be approaching the wrong course.


    ### The Utility of Available Resources

    Both human and nonhuman resources are necessary to yield the best efficiency and
    progress for an organization. The idea of the establishment of Human Resource
    Management then bolsters the chances of being able to utilize what is available.
    This could involve apportioning duties to the available workforce/nonhuman resource
    to achieve a goal or maintain a relatively strong competitive advantage.


    ### Ensuring a Healthy Employer-Employee Relationship

    Human Resource Management ensures fluidity in the dealings between employers and
    employees. John Kennedy also said, “The human mind is our fundamental resource.”
    This suggests that in a situation where there is a tangled relationship between
    an employer and the employee, the affairs of the business would be affected. In
    this case, the concept of Human Resource Management brings about a balanced relationship
    between employers and employees.


    ### Training and Development of Employees

    For better company performance, workers must be qualified, skilled, and trained.
    Either the worker is allowed to adapt to the system or is trained to develop at
    a faster pace. Allowing a worker to adapt naturally would cost time and generate
    ineffective yields. However, training such individuals would aid the organization
    significantly.


    ## 1.5 The Human Resource Manager

    Human Resource Management comprises a human member or members. Human resource
    managers are responsible for the supervision, controlling, procurement, and management
    of human resources. They are the link between employers and employees, and they
    often validate decisions pertaining to the human resourcefulness of an organization.


    The human resource manager position is a professional type. It requires the psychological
    ability to handle situations proactively and reactively. Decisions are incredibly
    impactful and can either leave a blemish or create a sound, consistent practice
    for the company. Moreover, some of the conventional qualities of human resource
    managers include oratorical prowess, an actively thinking mind, the ability to
    dissolve pressure, excelled communication skills, and, most importantly, excellent
    leadership skills. All of these are put together for the description of human
    resource managers.


    ### Some Responsibilities of the Human Resource Manager

    Human resource managers are tasked with hefty responsibilities, especially that
    they act as a decisive measure for the productivity of a company. However, a competent
    and skilled human resource manager should possess at least the following attributes
    and be able to perform the following functions:

    a) The ability to plan, organize, manage, carry along, and set employees on the
    same course

    b) Setting up procedures that will permeate an instant or later yield to the organization’s
    productive ability

    c) Developing fresh ideas targeted at the collective growth of the organization
    as well as the employees

    d) Reviewing job descriptions and functions before recruitment publications

    e) Recruiting skilled employees to boost productivity

    f) Working with the human resource team to ensure a steady competitive position
    in an organization

    g) Advocating for the introduction of policies capable of affecting the organizational
    structure of a company positively

    h) Overseeing the activities of employees and allocating the fitting duty to employees

    i) Creating a well-disposed link between employees and the employer

    j) Suggesting a change or changes in a particular or overall structure or system
    of operation for betterment

    l) Reviewing salaries and recommending a new salary scale

    m) Creating a friendly work atmosphere and encouraging employees with their jobs

    m) Enforcing and maintaining legal compliance necessary to promote organizational
    growth

