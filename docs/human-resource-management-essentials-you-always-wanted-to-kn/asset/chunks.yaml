    一种健全的绩效管理策略绝不要假设团队已经知道发生了什么。对管理团队提出质疑并要求他们去质疑员工是具有战略意义的。你的新模型可能在某些方面让所有发现沟通有挑战的人感到困惑。当最优秀的人才表现突然下降时，通常是因为他们“认为”自己已经了然于胸。这同样会导致某些偏离轨道且远离新模型的员工，在不知情的情况下继续表现不佳。当公司进行需要适应的创新时，情况通常就是如此。让雇主充分知情，并确保每个可用人员都保持在正轨。一些人力资源人员养成了起草总结的习惯，定期向员工提示对他们的要求。考虑也这样做，但要谨慎不要用不受欢迎或不合理的提醒轰炸员工。


    ## 不要进行不必要的强加


    2019 年美国的一项研究发现，工作场所中的强加让工作变得更加困难。为了消除这种困难并提高快速性，建议提出建议而不是立即对员工强加。这是人力资源经理需要的一项关键技能。学会帮助或协助而不仅仅是命令局面至关重要。工作场所中的强加被认为是独裁的，并被归类为让员工保持投入、奉献和完美工作的传统方式。但让我们诚实吧。没有人想在一个只看重自己意见、流程和方向的独裁者手工作。


    ## 2.1 绩效管理策略的基础


    绩效管理的基础一点也不荒谬或难以理解。其核心思想在于具有足够的说服力来鼓励可用的人力。记住，人的思想对于业务或组织的增长是必要的。因此，推开绩效管理的价值并非明智。


    以下是绩效管理的基础及其对系统的影响：


    ### 通过工作流释放小组化工人


    绩效管理促进了一种对工人有吸引力的工作流。当人力资源人员或部门能够确定谁适合某项职责时，这种情况就会发生。通过绩效管理策略，组织定义个人技能最适合的角色将变得相对容易。当角色与个人进行战略性匹配时，管理绩效和工作流将变得更加无缝。本质上，工人通过他们的绩效和工作流获得了释放，因为他们可以在舒适区内操作。


    ### 招聘合适的人员


    每个组织都需要工作所需的完美人才和技能。通常，人力资源部门承担这项责任，这意味着为工作聘佣高技能人才。这里的想法在于选择。通常，人力资源人员利用特定的公司指南来简化选择过程，而其他人力资源人员则倾向于利用个人所带来的价值。嗯，这些都是充满活力的基础绩效管理策略，可以产生想要的结果。通常情况下，结果往往符合预期，这只有在设计良好的基准下才能实现。


    ### 营造有利的工作环境


    营造有利的工作环境是绩效管理的许多战略特征之一。生产力无疑取决于绩效，而绩效取决于人力资源。当人的头脑放松时，产量必将增加，这意味着投入加上高产出。


    然而，有利性应该伴随着对员工进行频繁且意外的检查。硬性模型认为，工作附加物如过度便利会助长懒，导致产量或生产力低下。因此，建议发明并采用策略来检查由既定绩效管理策略渗透的便利性。


    ### 审查员工表现


    绩效策略帮助审查员工的能力和技能是基础性的。审查并不自动意味着对绩效有负面的结果或看法。然而，在此类审查之后，人力资源部门应该奖励、鼓励或惩律员工。绩效管理策略无疑有助于挑选出某些高技能人才、收集、审查并得出结论。结果可能会有显著差异。有时，审查显示员工需要更多培训、值得获得奖励或值得被鼓励。


    ### 让员工了解绩效情况


    这是一种沟通策略，让员工知道他们的表现影响力是高是低。对于维持高效的绩效水平或处理不理想的绩效水平来说都是相关的。让员工了解他们的进度和表现可以简单如一个简短的陈述或较长的对话。在向员工报告低绩效之前，最理想的情况是确保这种低生产力的原因与组织的管理实践没有联系。这是绩效管理策略的基础之一，有助于行业保持健康的竞争活力。


    ### 资深绩效评估


    绩效管理策略鼓励对组织进行资历的审查。让人力资源人员对组织的整个进度进行及时检查应成为一种规范。这种做法有助于分类并确定公司在何处出现漏洞。在这方面，绩效管理可以取得巨大的成功。其中一种方法是制作组织事件副本，并以报告、备忘录或开放会议讨论的形式与工人分享信息。


    ## 2.2 绩效管理策略的目标


    任何绩效管理策略的目标都是审查和奖励卓越。让员工目标与公司目标相对应至关重要。受雇人员可能在工作，但与公司目标不一致。未能对齐目标可能导致巨大的事故，导致底线数字下降、员工士气下降等等。通过正确对齐目标，个人可以表现出影响业务创造力的企业核心价值观，并带来高生产力。


    此外，绩效管理旨在鼓励高技能和进一步的智力。它建立了一个文化模型，让劳动力保持正轨，没有困惑或模糊的预期。绩效管理策略的目标还促进自律、员工激励和积极的工作氛围。


    以下是绩效管理策略的常见目标：


    ### 目标清晰化


    ### 良好的雇佣关系


