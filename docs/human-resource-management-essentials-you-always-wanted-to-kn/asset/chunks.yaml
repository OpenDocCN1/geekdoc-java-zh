    # Chapter 10: People Development


    The focal point of this chapter is on development, and more precisely, the development
    of the workforce. The subject reveals correlated concepts including employee development,
    personal development, workforce development, and people development.


    Chapter ten covers the following concepts:


    a) Employee development

    b) The definition of people development

    c) The makeup of people development

    d) What people development attempts to achieve in an organization

    e) Why it is necessary to implement the concept in an organization

    f) The various working strategies of people development

    g) A broad overview of how training, coaching, and mentoring work in HRM


    ![Image](images/image-1.png)


    Employee development has, for a while, become a prominent commitment and goal
    in most progressive organizations. This concerns every area of the organization
    but pays particular attention to the mental and physical growth of employees.


    People development is a series of attempts, moves, and bids by management to grow
    its workforce. This scope can be said to be a strategic plan towards achieving
    a goal or bringing a potential goal into actuality. The primary aim of this facet
    of management is to build employees and equip them with the necessary knowledge
    required to run the business.

