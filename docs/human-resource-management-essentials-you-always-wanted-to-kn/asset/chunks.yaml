    Moreover, knowing what conflict an organization suffers helps to design a strategy
    that can be a fix. Conflict, however, can be classified based on result, involvement,
    scope, strategy, and a few more.


    ## 5.2.1 Conflict Based on Result


    When conflict occurs based on the result, it could be very unappealing to the
    required goals. It is a destructive event that encourages confusion in a single
    team or among multiple teams or groups in an organization. Most organizations
    are designed to maximize profits. This is a well-known scope in the establishment
    of various enterprises. Furthermore, for a company to maximize profits, there
    must be planned strategic approaches. In this case, vast resource managerial manpower
    is required to put everything on a course to success. For example, the Human Resource
    Management of an organization would be tasked with the responsibility of looking
    after or managing the human workforce aspect of an organization to achieve a result.
    For success, there must be no conflict, because conflict will kill the vision
    towards a result.


    When conflict sets into an organization, it sparks destruction. It takes away
    the needed recognition and introduces a tainted atmosphere. Necessary activities
    might be suspended or called off because conflict based on the result makes it
    evident that a planned goal cannot be attained in such a condition. How does this
    happen? An individual, a team, or an organization will be emotionally polarized.
    Furthermore, such an individual, team, or organization’s morale would be undermined.
    There could be an outbreak of fights, quarrels, verbal assaults, manipulation,
    and conniving behavior. Imagine having clients gathered while there is an interpersonal
    fight among some of the staff.


    Conflict on the basis of result affects a greater part of an organization. The
    main point, however, is that it does not matter what aspect the conflict grows
    from. The scope remains that it destroys every plan and puts an individual, group,
    and organization at a losing end.


    Reassuringly, conflicts that affect results can be swept off with simple strategic
    plans. Here is what should be done to curb conflicts on this basis.


    ### Identify the Source


    No conflict exists without a source. The source would most certainly be known
    by the individuals in charge of the expected goals. Set up an investigative team
    of about two to three persons depending on the size of the organization. The process
    toward discovery should not exceed three days before the real or root cause is
    uncovered.


    ### Review


    At this point, the uncovered cause must be reviewed. Without reviewing such a
    cause, it will be challenging to know how to eradicate the happening permanently.
    In cases where involved individuals or groups were issued specific responsibilities
    to complete, the focus should be on why one of the individuals or groups despises
    the other. In fact, in most recorded cases, the fault is always as a result of
    allocating the wrong workforce to the wrong individual or team.


    ### Implement


    After a review, make amends and restart the program. A conflict does not mean
    an absolute end to any plan of action. It is only usually a short problematic
    break. For a while, monitor the newly enacted policies governing the initially
    conflicting cause. Check how the new program goes and ensure that nothing conflicts
    again with the needed result.


    ## 5.2.2 Conflict based on Involvement


    On the basis of involvement, conflict takes an individual, group, or organizational
    aspect. No matter which of these is involved, the conflict will still leave its
    impact on the system. Let us break down the aspects of conflict based on involvement
    below.


    Based on involvement in the individual aspects, there are two types, as mentioned
    earlier. They include:


    a) Interpersonal


    b) Intrapersonal


    There is a similarity between these two aspects of individual conflict on the
    basis of involvement. People often confuse interpersonal conflict with intrapersonal
    conflict in an organization. The similarity between these two types of conflict
    is that both have to do with individual workers. However, the difference is that
    interpersonal conflict concerns, multiple individuals, while intrapersonal involves
    just one individual with thoughts that conflict either with a policy or plan towards
    a goal. Conflicts such as these are always hard on the organization because human
    resources are the productive minds of any organization. In order to reconcile
    this conflict, the affected individual or individuals should be invited for a
    brief review conversation. This can be done by the managerial department or even
    the employer, if necessary. But then, it is recommended to forward such to the
    human resource center for a better review and permanent resolution.


    Based on involvement on group aspect, the categories include:


    a) Intergroup


    b) Intragroup


    If individual conflicts hit an organization hard, group conflicts hit harder.
    This is not a scope but a deduction from a clear sense of judgment. Intergroup
    conflict is an opposition existing between multiple groups or teams in an organization.
    It differs from an intragroup conflict in that an intragroup conflict occurs among
    the members within a particular group or team in an organization. Studies suggest
    that intergroup conflict has a higher impact than an intragroup conflict. This
    statement is dependable in the sense that intergroup may likely involve a higher
    number of individuals than intragroup. Being that human resource is the brain
    behind the productiveness of every organization, an increased workforce would
    mean a more negative impact. The often-working strategic plan is the shuffling
    of such a team or group. This should come in after sorting the source of the conflict.


    The third conflict that falls on the basis of involvement is organizational conflict.
    There are two organizational conflicts which include:


    a) Interorganizational


    b) Intraorganizational


    While an interorganizational conflict involves opposition between different organizations,
    intraorganizational conflict is a conflict within a particular organization. Neither
    of these two types of conflicts has little impact on an organization. This class
    of conflict can well lead to the end of an organization’s existence. The reason
    is that every faculty of the conflict is usually involved. It can be employer-employee
    conflict, employer-management conflict, as well as management-employee conflict.
    The worst is when the conflict is an inter-organizational type of conflict. The
    clash of two organizations will not only affect an organization or organizations,
    but it will also give other establishments in the same field a tremendous competitive
    advantage.


    ## 5.2.3 Conflict Based on Scope


    Conflict on this basis may occasionally arise on cases as minor as inconveniencing
    meeting time decisions, a decision on who represents the organization, task allocation,
    and more. The list of the sort of events housing conflict based on scope is endless.


    An article on ‘Your Article Library’ suggests that conflict could be substantive
    as well as effective. When conflict is substantive, it directly concerns the duties
    developed or that are part of an organization’s policies. On this basis, whatever
    an employee, manager, and any other resource person does in an organization must
    comply with the principles of such an organization. Substantial conflict is often
    caused by the disaccording objectives or views of a workforce or management with
    the in-place objectives. This is to say that substantive conflict does not involve
    the opposition between an individual or a group of individuals. It, in fact, has
    little or nothing to do with employee or management emotions.

