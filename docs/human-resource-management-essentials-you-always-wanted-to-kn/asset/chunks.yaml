    ## What experts say about this book!


    “Human Resource Management Essentials is a clear and comprehensive foundational
    overview of the purpose and multifaceted role of the Human Resources function
    within an organization. Ms. Gilbert builds upon the history of the nature of work,
    pre and post-Industrial Revolution, building an important chronology that depicts
    how ‘work’ and ‘workers’ have evolved in response to shifting societal needs and
    how effectively managing human resources is a business imperative for organizational
    success and sustainability. Through a compelling integration of theoretical and
    conceptual content, relevant process models, and real-world practices and resources,
    Ms. Gilbert offers both a strategic and tactical resource for developing a sound
    knowledge base and skill set in human resource management that can be leveraged
    for more advanced deep-dive examination of each HR topic as well as applied in
    actual professional settings and contexts.”

    – Carrie A. Picardi, Ph.D. (Organizational Psychologist), Associate Professor
    of Management, University of Bridgeport


    “The book on Human Resource Management Essentials provides strong functional knowledge
    of HRM and will enable students to clearly understand the purpose, practice and
    procedures attributed to HRM. The author has a comprehensive knowledge of the
    field and shares excellent real world examples. This book will be a desk reference
    both for the HRM major as well as for the business major with a different concentration,
    long after they graduate and embark upon their careers.”

    – Fernán R. Cepero, MA, MS, PHR, SHRM-CP, Organizational & Global Leader Senior
    Human Resources Business Partner, YMCA OF GREATER ROCHESTER - ASSOCIATION OFFICE


    “This book gives a complete perspective of the entire gamut in Human Resources.
    On reading this book, you will get a comprehensive understanding of the Employee
    Lifecycle – right from hiring to exit from the organization. This textbook serves
    as a guide to understand the fundamentals on every aspect of Human Resources.
    Its principles can be applied while functioning as a human resource professional
    in any organization.”

    – Rhea Doshi (M.SC Counselling Psychology), Manager Global Business Services -
    Learning & Development at BASF India Ltd


    “Jaquina Gilbert’s topical text on Human Resource Management provides a thoughtful
    introduction on the foundations to becoming a great HR leader. The content is
    as expansive as it is digestible. Gilbert does a great job establishing the business
    case for HR while providing tactile responses to the most sort out cases. I recommend
    this book to anyone considering a career in the field.”

    – Anthony W. Caputo, Vice President - Remesh, Adjunct Professor - Seton Hall University


    “Jaquina Gilbert writes a simple and powerful guide to “Human Resource Management
    Essentials”. She deftly has cut through the noise and provided an systematic overview
    of what modern HR leaders think of HRM systems in the 21st century. In an easy
    to read manner, she explains the essential components of an effective HRM strategy.
    The book is effective not only for HR students and leaders, but for novice non-HR
    practitioners who are involved in manpower planning and other HR decisions. I
    would highly recommend Jaquina Gilbert’s book as an essential copy for emerging
    business leaders.”

    – Yogita Abichandani, Ph.D., Associate Professor, HR & OB at Management Development
    Institute Murshidabad, Board Member - SECU, North Carolina | Co-Chairperson- Academy
    of HRD USA, INDIA SIG. Chairperson- International Relations, Alumni - University
    of Georgia


    “After a long time, it’s good to have come across a book which gives detailed
    information on Human Resource Management. The author has covered all aspects of
    HRM in detail, right from the evolution of HRM to key roles, Legal aspects, Payroll,
    Compensation and Benefits, IT in HR, Health and Safety, etc. Each aspect has been
    looked at from a different perspective, keeping the current scenario in mind.
    This book will benefit both current HR professionals and future HR managers.”

    – Paras Panchamia, Manager - HR & Admin, Insight Business Machines Pvt. Ltd


    “This text on Human Resource Management Essentials is a solid read, and is a very
    good introduction to fundamental HR principles. Well-organized and written, the
    book includes easy-to-read and useful “how to” pieces and serves as a terrific
    resource for daily HR operators, leaders and managers.”

    – Paul W. Thurman, DBA, Professor of Management and Analytics, Columbia University


    “Human Resource Management Essentials is a basic, non-technical and easy read
    for anyone who wants general knowledge of the concepts of human resources. It
    is a great resource for small businesses and anyone who is currently in a non-HR
    role, but wants to understand the essentials of the field.”

    – Felicia D. Harris-Foster, MBA, MS-HRM, CFE & Adjunct Faculty


    ## About the Author


    ![A person smiling for the camera Description automatically generated](images/Untitled-1.jpeg)


    Jaquina Gilbert has over 20 years of Human Resources experience in multiple disciplines
    and holds both SHRM and PHR certifications. She authored three books and has written
    HR-related content for business owners, authors, and professionals in various
    industries. Jaquina received a BBA in Human Resources Management and Organizational
    Behavior from the University of North Texas in Denton, and an MS in Human Resource
    Training and Development from Amberton University.


    ## Table of Contents


    - [Chapter 1: The Concept Of Human Resource Management](#index_split_006.html_id_Toc39402638)

    - [1.1 Evolution of Human Resource Management](#index_split_006.html_id_Toc39402639)

    - [1.2 Theories of Human Resource Management](#index_split_006.html_id_Toc39402640)

    - [1.3 Approaches to Human Resource Management](#index_split_006.html_id_Toc39402641)

    - [1.4 Basic Functions of Human Resource Management](#index_split_006.html_id_Toc39402642)

    - [1.5 The Human Resource Manager](#index_split_006.html_id_Toc39402643)

    - [1.6 Challenges Faced by Human Resource Management](#index_split_006.html_id_Toc39402644)

    - [Chapter Summary](#index_split_007.html_id_Toc39402645)

    - [Quiz 1](#index_split_007.html_id_Toc39402646)

    - [Chapter 2: Performance Management Strategies](#index_split_008.html_id_Toc39402647)

    - [2.1 Basics of Performance Management Strategies](#index_split_008.html_id_Toc39402648)

    - [2.2 Objectives of Performance Management Strategies](#index_split_008.html_id_Toc39402649)

