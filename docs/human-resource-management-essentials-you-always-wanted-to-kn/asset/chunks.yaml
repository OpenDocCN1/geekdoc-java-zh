    Both employers and employees are necessary for production. A good performance
    management strategy is to develop goals that make it relatively easy to build
    a good working relationship between the employer and employees. The focus is not
    entirely on the relationship but takes it into consideration as not to strain
    the connection between the two. Doing so could hamper the company’s overall objective.


    ### Encouraging Individual Employee Growth


    Proper performance management can bring excellence to fruition. There is bound
    to be growth when staff is encouraged frequently. In the same vein, it is crucial
    to identify the flaws that staff may have and to delicately bring them to the
    employee’s attention, so that they do not erroneously believe their performance
    is the pillar of perfection. Some proponents of the hard model hold that encouragement
    would lead to the employee feeling too good for a task. On the other hand, the
    productivity level of such an employee might suffer a decline. However, proponents
    of the soft model hold that encouragement is one of the basic human resource managerial
    components. With regard to these arguments, contingent proponents hold that practicing
    soft or hard model approaches in an organization would depend on the type of organization.


    ### Handy Transparency


    In the words of Florini (2007), transparency is “the release of information which
    is relevant for evaluating institutions.” This goes on to highlight that with
    transparency, evaluation is possible, and this is a vital objective of performance
    management in any organization. Performance management seeks to ensure that employees
    are aware of the organizational goals and that employee outputs are in alignment
    with achieving those goals. Without transparency to fully understand the purpose
    of the objectives and how each position impacts the achievement of such objectives,
    it may prove difficult to accomplish the desired success.


    ### Swift and Excellent Skills Exploration


    An organization requires decent human resource skills to function at its best.
    Without the presence of such skills, an organization would find it challenging
    to keep up with the sole demand of the venture. Quality performance management
    therefore targets excellent skills and employs various strategic formalities to
    uncover such skills. They may be uncovered from an individual who is already employed
    with the company or from among its list of promising recruits.


    ## 2.3 Purpose of Performance Management Strategies


    Performance management, according to Armstrong and Baron (2004), is “a process
    which contributes to the effective management of individuals and teams in order
    to achieve high levels of organizational performance.” This definition suggests
    that performance management is not just a one-individual thing but a collective
    organizational thing that includes the organization, human resource persons, and
    human resources or employees.


    The general purpose of performance management is communicating a set goal and
    measuring how each individual contributes to achieving those set goals. In general,
    all concerned individuals must be trained and informed to achieve the goal. The
    purpose of performance management also extends to a more substantial part of the
    managerial system.


    Here are the purposes of performance management strategies:


    ### Bolstered Yield


    Performance management strategies enhance high or improved yields. This results
    from the proper treatment of employees. Proper management of available human resources
    would promote high output and would require ensuring that employers remain happy.


    ### Enhanced Communication


    Communication is effective in any organization. Proper communication in an organization
    would establish a brilliant employer-employee relationship. The employer would
    be able to communicate difficulties directly or through the Human Resource Management
    team. This effort dramatically boosts productivity.


    ### Employee Development


    Performance management encourages individual development. It is what keeps a company
    at the edge of competitive advantage in its niche. Here, proper implementation
    of the performance management concept would assist in the productive growth of
    an organization. When an employee is well developed, handling responsibilities
    becomes easy and such an employee is able to connect with a team.


    Other purposes of performance management include:


    a) Encouragement of commitments among managers and employees

    b) The presence of skilled workers

    c) Flexibility in teamwork

    d) Creating an enriched working atmosphere

    e) The encouragement of self-discipline among stakeholders of the company or establishment


    ## 2.4 Drafting Effective Performance Management Strategies


    After outlining performance management strategies, the subsequent task is to facilitate
    such strategies. For this reason, human resource departments would proceed to
    draft something effective. The first thing to consider in the process is individual
    (employee) development and how to convince the employee to be committed. This
    aligns with John Lockett’s (1992) opinion on performance management. Consider
    drafting effective performance management strategies that work universally in
    any practicing organization using Lockett’s opinion.


    ### Collect Performance Data


    A proactive human resource person would consistently receive reports about employee
    performance data. It is the employer’s place to request an audit of staff in the
    company. As a human resource person, inform the team of the need to collect seasoned
    work data, which would be used for a more detailed assessment of staff activities.
    This could be done daily, weekly, or monthly depending on the size of an organization.
    It will go on to ease the job load on the Human Resource Management team and ensure
    proactiveness in the Human Resource Management department.


    ### Collate Performance Data


    Collation is a stage of critical comparisons as well as the sequential and proper
    assembling of the collected records or data. It is ideal to share different department’s
    data in an organization to make the collation task easier and near errorless.


    ### Performance Appraisal


    Performance appraisals can also be referred to as performance reviews or annual
    reviews. This is the next necessary draft to develop in order to establish effective
    performance management strategies. Performance appraisal is simply the formalities
    in the assessment of an employee’s performance concerning the job allocated to
    him or her. The assessment involves how steady or consistent such an employee
    has been with the job and the effectiveness of his activities in the organization.
    An appraisal may either trigger rewarding a deserving employee or finding a solution
    and encouraging such an employee. It may also include assessing and addressing
    poor performance on the part of the employee and discussing resolutions.


    ### Ask Questions


    In cases where an appraisal reveals a lack of productivity in an employee’s activities,
    it is ideal to talk things out. Do not judge the appraisal result; instead, find
    out why the employee delivered a less than desirable performance. There could
    be something the company should know, and this might be a burden on not just that
    staff but to others extensively. Questioning the situation would contribute largely
    to identifying problems, which could be a result of the managerial decisions or
    working atmosphere.


