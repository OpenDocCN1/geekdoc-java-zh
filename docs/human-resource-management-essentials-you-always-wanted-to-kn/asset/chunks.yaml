    The court has the right to punish any offender by limiting the engagements of
    the offender. This applies to default companies who fail to practice standards
    that comply with the demands of the law. A defaulting company will be ordered
    or expelled from several engagements that may affect its yield. Such a company
    may witness a slow or rapid decline in productivity, which results in a low yield.


    ### Loss of Skilled Employees


    A defaulting company risks losing skillful employees as such employees do not
    want to risk their individual ethics or morality at the cost of the company’s
    failure to comply with laws. Additionally, the working atmosphere can be greatly
    compromised and result in a lack of production, lack of trust, or even employee
    burnout. One of the causes could be when a company does not standardize its policy
    on hygiene, electrical, gas, or water. All of these are hazardous and would force
    employees to sign out of the company.


    ### Decline in Productivity


    A productive organization recognizes and obeys the standing laws of a jurisdiction.
    This suggests that such an organization obeys the policies set by the law and
    practice policies that conform to the jurisdiction. One such is the proper treatment
    of staff by providing the necessary working tools and resources. Other aspects
    include recognition, encouragement, and reward for employees with high performance
    during a given period. Encouraging such performance means complying with employee
    treatment standards and will convince the employee to remain committed. Whereas,
    in some instances, noncompliance will result in low productivity and defaulting
    of the law governing the employer-employee working terms.


    ### Fractured Reputation and Loss of Customers


    Noncompliant companies often end up with the fate of losing valuable customers.
    “A bad name” is the result for most companies. Further, it might take a long time
    to effectively rebuild and correct the impression.


    ## 3.4. Maintenance of Legal and Regulatory Compliance


    Maintenance is a culture of preservation. In resource management and legal compliance,
    it concerns the preservation of the factors deemed relevant by the law. This highly
    constitutes employment agreements and resources and tools required for work efficiency.
    An organization should have these standards in place, which must not conflict
    but comply with what the law demands. To go against or to be unable to attain
    the required standards is punishable and treated as an offense.


    As Koziarz commented, it will be less expensive to manage or maintain resources
    in a way that complies with the jurisdiction. In the same vein, it will be costly
    when compensating for the law after a default or a breach. There are several compliance
    laws to know and preserve. If possible, request from the appropriate jurisdiction
    or governing agency or search online for the requirements of the jurisdiction
    where the organization is situated.


    Meanwhile, here are some of the major compliance laws applicable to all organizations:


    ### Electrical


    The 1989 Electricity at Work Regulations charges organizations to practice a maintenance
    culture that curbs electrical hazards in the workplace. All electrical conditions
    must be excellent, and actions such as testing portable appliances must be carried
    out to ensure full functionality.


    All of these are implemented in a bid to prevent any life hazard. Companies who
    do not practice this standard for electrical management, risk being punished by
    the law. It is a practice in most organizations to hire companies that specialize
    in this for a proper report.


    ### Water


    Dirty grounds and surfaces must be flushed against life-threatening infections.
    The standard set by the law is to treat stagnant water or do away with stagnant
    water in any premises. All surfaces must be kept, proper water channels must be
    designed, and leakages of any kind must be prevented or fixed.


    There must be no wastage of water resources, and water must be available for both
    domestic and industrial purposes. Registered agencies must be hired to run an
    assessment on the facility to ascertain water health, fix broken water pipes,
    and ensure that it conforms or complies with the standard.


    ### Gas


    The Gas Safety Regulations 1998 presses the need to frequently check on gas systems
    for the safety of people. Gas leakages must be uncovered, and replacements made
    instantly. Commercial gas equipment must be of good condition and must always
    be functional and should not be left to be a housing for rodents and insects.
    To identify and cut down inconveniencing breakages and breakdown, checks must
    be done by certified engineers or a licensed engineering agency.


    ### Hygiene


    The Health and Safety Act 1974 impresses the sound hygiene of working premises.
    The environment must be clean and unpolluted with sources of any kind. There must
    be appropriate disinfectants and antibacterial products provided in bathrooms
    and other necessary rooms. Both customers and employees must experience a good-natured
    atmosphere, and there should be no littering and exposed waste ground on the premises
    of an organization.


    ## Chapter Summary


    a) Legal compliance is targeted at ensuring proper treatment and security of all
    employees.


    b) Ensuring that a company is compliant benefits a company both within and outside
    the organization.


    c) Non-compliance or defaulting on legal requirements can result in substantial
    charges or limited company activities. Some major compliance laws applicable to
    all organizations include electrical, water, gas and hygiene standards.


    ## Quiz 3


    1) Which of the following is not a critical reason to comply with legal orders?


    a) To embrace the universalistic theory of HRM


    b) To retain a skilled workforce


    c) To preserve integrity and reputation


    d) To prevent unnecessary charges


    2) ______ HR policies should align with laws, and should serve the interest of
    ________, ________, and _________.


    a) External, the employee, the customers, the board


    b) Internal, the employee, the company, the law


    c) Internal, the employee, the law, the customers


    d) External, the employee, the law, the company


    3)All of the following are compliance laws that apply to all organizations, except:


    a) Hygiene


    b) Water


    c) Gas

    d) Temperature


    4) Failure to comply with legal and regulatory compliance can result in: [select
    all that apply]


    a) Fines

    b) Resource seizures

    c) Company closure

    d) Customer impression of the company

    e) None of the above


    5) Select the statement that is True.


    a) Compliance requires only medium and large organizations to adhere to laws.
    Smaller organizations are exempt because they have not firmly established their
    role as a financially sound organization.

    b) Punishments for noncompliance are limited to monetary fees or fines.

    c) An organization that defaults on regulations will experience a lack of respect
    from employees.

    d) Noncompliant organizations should not be concerned with the impact on customers
    because the issue is internal and only involves the company and the law.


    **Solutions to the above questions can be downloaded from the** [Online Resources](http://www.vibrantpublishers.com)
    **section of this book.**

