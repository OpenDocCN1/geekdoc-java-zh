    As earlier stated, compensation could be a benefit or reparation. It defines or
    compliments an action. It is not automatically necessary, and it is not subject
    to any jurisdictional regulatory system. The rule of compliance does not overly
    cover the scope of compensation in an organization. However, a recent study identified
    aspects such as ‘reparation’ where it is necessary to compensate an employee.
    Thus, this makes compensation somewhat essential for employees, especially when
    it is a fixed compensation. Also, it will be unsound for any organization to fail
    to compensate staff, especially whose uncertain fate occurs within the company.
    Cases of injury are very rampant in manufacturing industries, and as such, compensation
    is often duly paid to such employees for treatment.


    ## Types of Compensations


    ### Fixed

    This acts like wages and salaries. However, it is not an absolute salary in the
    sense that it only compensates a duty or responsibility, which could be only for
    that particular business period. Fixed compensation may be non-monetary, direct,
    or indirect compensation.


    ### Variable

    Only an organization may decide to offer variable compensation. Any regulatory
    law of jurisdiction does not compel it. A variable compensation may also be non-monetary,
    direct, or indirect compensation.


    In general, the scope of compensation is to compliment an employee for something
    that may or may not be part of the job. For some companies practicing variable
    compensation is a trick-shot towards encouraging an employee to be committed.
    It is also a means to make sure an employee’s contributions are well-recognized.


    ## 6.2. Aims and Objectives of Compensation


    Every organization wants to reap the best results from their employees. As such,
    compensating their efforts is one of the many strategic approaches to do so. It
    is not necessary to dole out variable compensation, whether non-monetary, direct,
    or indirect. However, it is necessary to dole out compensation when it is fixed.
    This is because fixed compensation functions like a salary or wages.


    For Keith Davies (1984), *“Compensation is what employees receive in exchange
    for their contribution to the organization.”* Although Davies’ definition does
    not emphatically state what type of compensation, it is clear that it will either
    be on the grounds of necessity or freewill from the organization.


    Here are a few aims and objectives of compensation:


    ### Retention of Skilled Employees

    There are times when employees feel they should abandon a particular job for something
    better. To think of it, such employees are usually highly skilled employees who
    feel unappreciated for their performances and contributions. As a strategy, the
    introduction of compensation convinces such an employee that the organization
    is very well aware of his presence and contributions. The sort of category of
    compensation that applies here is variable compensation. It may come as a non-monetary
    compensation like a car gift, promotion, or work-leave, for example. It may also
    be direct or indirect compensation. An employee with plans to look away from the
    company may reconsider extending the duration such that he or she has been convinced
    of better treatment.


    ### A Tool to Encourage Commitment

    Most employees need encouragement to maintain productivity. When there is no form
    of encouraging strategy, such employees feel discouraged and dwindle in efficiency.
    The factors associated with the employee will witness a rapid and steady decline,
    which may or may not be noticeable in an organization. When compensation is introduced,
    such employee’s morale is boosted. Compensating employees is like a golden rope.
    It tempts an employee to willingly tie-down themselves for the sake of the company.
    The concept makes it possible for staff to feel pride for the company.


    ### Minimize Expenses

    A company that practices fixed compensation tends to be on the winning side. With
    such practice, a company can decide whom to pay a certain amount. Whereas, this
    is not so possible with salaried staff who earn at almost an equal margin. Moreover,
    a staff of fixed compensation is not so bound by regulatory laws as the company
    might relieve them at any point in time. In short, several top organizations practice
    this standard, especially when there is a vacancy that requires short-termed responsibility.


    ### Regulatory Compliance

    The laws of some jurisdictions state that employees must be rewarded for exceptional
    performances. This, however, is not as serious as several other regulatory rules
    that invoice fairness. But then, working terms that include fixed compensations
    are part of the regulatory guidelines. Fairness policies should not be policies
    begged for but practiced such that deserving employees get compensated duly. This
    may mean a bit more expenses, but it aids in boosting employee performance, and
    this is an objective of compensation.


    ### Encourage Self-Discipline Among Employees

    It is very rampant for employees to bring in the ideology of red tape, especially
    in organizations where there is zero employee discipline. The red tape ideology
    is mostly prevailing in government organizations but has recently extended to
    private organizations. Employees tend to practice this with a supporting belief
    that the organization is, after all, doing nothing to encourage their performance.


    ## 6.3. Benefits of Compensation


    Compensating staff has benefits that stretch from emotional to physical aspects.
    These aspects each have roles to fill for the growth of the company. Besides,
    compensation is something that every employee should be entitled to for effectiveness.


    Some scholars have pronounced their thoughts on the concept of compensation, and
    one such is Edwin’s thought. Edwin Flippo (1980) speculates, *“The function of
    compensation is defined as the adequate and equitable remuneration of personnel
    for their contributions to the organizational objectives.”* Although Edwin’s definition
    is not broad enough, a lot could be extracted from the definition. As an employer,
    one of the many targets is to attain a certain level of success. Such being the
    case, strategies like employee compensation is required to prevail in the business.
    Compensation provides several benefits. These benefits apply to both employees
    and employers.


    For employees, the benefits include:

    a) An opportunity to tour a preferred destination

    b) Promotion

    c) Managerial role

    d) Additional incentives

    e) An award of excellence


    The primary benefits for organizations include rapid employee development, staff
    loyalty and commitment, retention of highly-skilled minds, and absolute control
    of the system.


    ### Rapid Employee Development

    Compensation facilitates employees’ development at a faster pace. Whether the
    compensation type is variable or fixed, the beneficial implication is that it
    encourages employee development. An individual who is newly employed or that has
    to adapt to work changes needs development for better and productive performance.
    Once compensation is duly or unduly in place, such an individual would have to
    rethink what he or she is doing. The employee may contend, *“It looks like someone
    values what I am doing, I should do better.”* For quicker development, he might
    resort to undergoing online courses and learning more about the system to invent
    new impactful ideas.


    ### Staff Loyalty and Commitment

    An employee may love the job, but that does not mean they are loyal and committed.
    A strategic plan aimed at unleashing this part of the employee must be put in
    place. One such plan, as often mentioned in this section, is ‘compensation.’ It
    convinces an employee of the admiration an organization has towards their performances.
    Nothing beats loyalty, and this should be the gift to boost yield.

