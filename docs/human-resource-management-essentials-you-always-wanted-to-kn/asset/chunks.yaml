    本章更关注健康合规。


    读者将发现：

    a) 健康安全发展在组织中的作用，以及缺乏健康管理的组织可能的结果

    b) 良好工作环境的要求

    c) `HRM` 在确保工作安全方面的相关性

    d) 为增强场所健康安全而采取的适当做法


    ![图像](img/image-1.png)


    组织中的员工可能由于健康问题而表现不佳。当组织对健康系统投入很少或完全不投入时，可能会出现这种情况。此外，不健康的环境不符合任何法律法规制度。不实践健康安全管理系统的组织可能会在司法管辖区面临法律诉讼。


