    # Chapter 4: Organizational Development In HRM


    Chapter four presents the concept of Organizational Development (OD) and its correlation
    with Human Resource Management. OD refers to working strategies aimed at improving
    a company. Organizational Development is a broad concept.


    This section provides readers with fundamental information that reveals the following:


    a) The definition and ideology of OD


    b) HRM goals for integrating OD in its managerial system


    c) OD methodological processes


    d) Strategic planning concepts and why it is necessary


