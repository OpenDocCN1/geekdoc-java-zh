    Performance scorecards are being introduced in several organizations as a means
    of monitoring and reviewing employee performance. HR sets up these systems and
    installs each on the appropriate systems in the organization. It could as well
    include employee work computers. Some companies anonymously install these to monitor
    the activities of employees in order to know who is being committed and who is
    not. This can also be termed an electronic appraisal.


    ### Flexibility, Speed, and Accuracy


    This was earlier mentioned as the essential scope of technology. Human Resource
    Management has substantial flexibility. With technology, there is flexibility
    in all ramifications of management, including the thinking aspect. How is IT relevant
    in thinking? It merely provides easy access to the required stats/updates for
    effective decisions. Moreover, HR persons do not require file stacks to store
    data used in running the organization.


    With speed, there is a rapid progression in the business. The speed here includes
    even the decision-making process. With technology, this is not an unsolvable difficulty.
    For instance, it provides room for a comprehensive analysis of the market speedily,
    thereby ensuring better risk management. It helps to stay abreast of market changes
    and to be able to formulate new strategies that will either increase the company’s
    competitive prowess or maintain its level.


    ### Accountability


    Operating on a manual standard is likely to make the accounting task difficult
    and incomprehensible. Managing payrolls in a noncomputerized way will lead to
    inaccurate records and will cause confusion. This is not the case when technology
    is involved because of the calculative ability is holds. A simple coding will
    be able to collect data, compile, sum up, and present a perfect result that can
    be accounted for. For this to be the case in an organization, such an organization
    must outsource for payroll systems like hiring an external payroll agency or professional
    to overlook the process of employee salaries and wages. IT goes as far as helping
    to determine the worth of a recruit in an organization correctly.


    ## 7.2 Challenges Faced by IT in HRM


    It is necessary to understand the significant technology loopholes to understand
    better how to manage situations when the need arises. Despite the relevance of
    technology in the business system, some downsides must not be overlooked for effectiveness.


    Anything related to technology in an organization is subject to the legal and
    regulatory laws of a jurisdiction. For example, the `1989 Electricity at Work
    Regulations` compels organizations to managerial principles that could expel or
    minimize the electric hazards that have harmful effects on the environment. Also,
    the `Gas Safety Regulations 1998` presses on the effectiveness of employing specific
    measures that could prevent disastrous incidents, which could lead to the loss
    of lives. Failure to conform to these principles, as always mentioned, attracts
    punishments, which may be monetary charges, a suspension/ban, long judicial processes,
    as well as facing certain limitations.


    This said, here are the three primary challenges faced by IT in Human Resource
    Management.


    ### Security


    Once there is an integration of technology in an organization, attacks begin to
    fly in. The worst scenario is when a said organization is entirely wireless. Such
    will require a high level of wireless security as hackers will attempt to install
    malware on the connections to gain access to the web system of the company. Also,
    every data entry that is utilized in an organization is risky as there may be
    trojans designed to travel with such data. Meanwhile, the present height of competitiveness
    among competitors is such that competitors hire programmers to design malware
    for unwarranted access to a fellow competitor’s web base. This is done in a bid
    to monitor competitor’s progress and changes in order to plan a strategy that
    performs better and remains at the top level of the competition.


    ### Data Loss


    The loss of data is a rampant problem with technology. Whether data is saved online
    or offline, there are chances that a breach might be initiated, and data would
    either be stolen or crashed. As a case study, `Yahoo` suffered a breach in `2013`,
    which affected about 3 billion accounts and meant a significant loss to the company.
    Now, what was supposed to serve as a medium for quick communication became a huge
    problem. This applies the same to Human Resource Management, who risks losing
    an employee and organizational data to hackers. Since this does not comply with
    the standards of individual data security, not only would losses be suffered but
    also legal charges for noncompliance with data security.


    ### Cost of Management


    The integration of technology in Human Resource Management is not very cost-effective.
    Management would have to hire or pay professionals to run checks on the system
    for security constantly. The cost of securing the base from hacks does not come
    cheap; however, it is better to settle the cost of securing data rather than lose
    them. Software preferred for managing an organization’s web system must be premium,
    and this means paying out a few bucks for subscriptions either on a monthly or
    yearly basis.


    ## 7.3 IT Applications in HRM


    The introduction of technology in Human Resource Management has altered the entire
    managerial processes. For example, instead of human resource persons focusing
    on the general management of an organization, technology aids in shifting focus
    to strategic management, which is more like a proactive problem solver. The importance
    of technology applies to both employees and management. Employees have taken advantage
    of the presence of technology to handle jobs with ease and effectiveness. This
    is the case when employees have to work from home as well as give feedback to
    the management from wherever.


    Management has introduced the aspect of information technology to the system for
    swifter operations. Such includes employee rate cards, easy regulatory and compliance
    policy updates, recruiting the best individuals, and timely job delivery from
    employees. Somehow, technology has curbed the unpromising distantness between
    employees and employers. As an employer today, it is effortless to connect with
    any employee of your choice. A simple ping from your home or office, and the employee
    would be notified. Also, discussing bothersome issues could take place from the
    bedroom. Needless to mention the advanced meeting concepts presently practiced
    in larger organizations whereby there is no physical presence.


    There is no longer a need to await a report from market spies as a few clicks
    on the internet reveal accurate data and present the condition of the market.
    Employee self-development is now easier than ever with several tools provided
    by IT. For example, websites are offering free and paid online courses and tutorials
    – written and visual. What an employee requires is a simple data connection and
    software like `YouTube` and `Udemy`. There are a series of video tutorials on
    `YouTube` and online paid and free courses on `Udemy`. An employee who finds time
    for any of these will likely develop and perform ten times better than a redundant
    employee. It is also the duty of Human Resource Management to encourage employees
    to practice these sorts of self-trainings in order to match up with the competition.


    Frankly, there have been many positives accompanying the introduction of technology
    to business organizations. There are now instances where employees deliver for
    daily jobs with minor taps and clicks on their `iPads` and `laptops`. Are the
    clients left out? Not at all; rather, they continue to enjoy the innovativeness
    of HR persons in the development of better standards and increased efficiencies.


    ## Chapter Summary


    a) It is essential to understand the framework of IT in HRM.

