    除了盈利之外，公司努力获得比其他企业的竞争优势。这是必要的，因为组织建立的权威越高，它在社会中的地位就越突出、越相关。组织发展通过应对和驱逐可能阻碍组织快速进步的挑战来发挥作用。


    ### 监管/法律合规


    法律机构讨厌违反标准的公司。公司同样讨厌在行事时被抓包，因为深知这种行为随伴的后果。因此，组织发展试图审查并确保组织政策与法律政策之间不冲突。


    ## 章节总结


    a) 组织发展是一个战略过程，指的是组织各种职能的渐进且实际的发展，并识别哪些方法有效，哪些方法无效。


    b) 战略规划、招聘和合规执行是组织发展的三个关键部分。


    c) 战略规划涉及三个传统阶段，包括制定、执行和评估。


    d) 产生适当招聘实践的各种流程应包括识别空缺、概述职位要求、生成职位描述、寻找和筛选，最后对招聘人员的绩效进行评估。


    e) 增强沟通、员工成长、竞争优势和增加利润都是人力资源管理（HRM）发展的目标。


    ## 测验 4


    ### 1) 哪一组词最准确地完成了组织发展的定义？“组织发展是一个 _____________ 过程，帮助一个 ___________ 达成目标。”


    a) 战略的、组织

    b) 科学的、员工

    c) 方法的、组织

    d) 概念、员工


    ### 2) 在考虑组织发展时，为了获得更好的结果而实施的通用程序的正确顺序是？


    a) 收集数据、分类问题、检查诊断后的问题、审查并计划、实施计划、检索计划数据并分析结果

    b) 收集数据、检索计划数据、分类问题、检查诊断后的问题、审查并计划、实施计划并分析结果

    c) 分类问题、检查诊断后的问题、收集数据、审查并计划、实施计划、检索计划数据并分析结果

    d) 分类问题、检查诊断后的问题、收集数据、检索计划数据、审查并计划、实施计划并分析结果


    ### 3) 下列所有都是战略规划必要的理由，除了：


    a) 提高输出

    b) 提高生产率

    c) 政策有效性

    d) 避免员工挑战


    ### 4) 以下哪些是人力资源管理发展的目标？[选择所有适用项]


    a) 员工成长

    b) 使公司获得竞争优势

    c) 解雇表现不佳的人员

    d) 增加利润

    e) 以上所有


    ### 5) 增强 ____________ 和 ____________ 之间的关系建立了良好沟通的纽带。这种增强导致生产率、____________、__________
    和工作环境的提高


    a) 员工、员工、牺牲、工龄

    b) 雇主、员工、士气、投入度

    c) 雇主、利益相关者、流动、忠诚

    d) 雇主、员工、士气、留存


