    雇主和员工对于生产来说都是必不可少的。良好的绩效管理策略是制定相关目标，使雇主与员工之间易于建立良好的工作关系。其重点并非完全放在关系上，而是将其考虑在内，以以免紧张双方之间的关系。这样做可能会阻碍公司的整体目标。


    ### 鼓励员工个人成长


    适当的绩效管理可以使卓越成果变为现实。当员工经常受到鼓励时，这种增长是不可避免的。同样，识别员工可能存在的缺陷并委婉地提醒他们注意也至关重要，以免他们错误地认为自己的表现是完美的典范。硬性模式的一些支持者认为，鼓励会导致员工对某项任务感到得心有余。另一方面，这类员工的生产力水平可能会下降。然而，软性模式的支持者认为，鼓励是人力资源管理的基本要素之一。针对这些观点，权变支持者认为，在组织中实践软性或硬性模式方法取决于组织的类型。


    ### 透明度的实用性


    正如 Florini (2007) 所说，透明度是“发布与评估机构相关的信息”。这进一步强调了有了透明度，评估才成为可能，而这是任何组织绩效管理的关键目标。绩效管理旨在确保员工了解组织目标，并确保员工的产出与实现这些目标一致。如果没有透明度来充分理解目标的宗旨以及每个职位如何影响这些目标的实现，要实现预期的成功可能是困难的。


    ### 快速且卓越的技能探索


    组织需要良好的人力资源技能才能处于最佳运行。如果没有这些技能，组织将发现很难跟上业务的唯一需求。因此，优质的绩效管理针对卓越技能，并采用各种战略形式来发掘此类技能。这些技能可能从公司已雇佣的个人中发现，也可以从其极具前景的招聘列表中发现。


    ## 2.3 绩效管理策略的目的


    根据 Armstrong 和 Baron (2004) 的观点，绩效管理是“一个对个人和团队进行有效管理、以实现高水平组织绩效的过程”。这一定义表明，绩效管理不仅仅是个个人的事务，而是一个集体的组织事务，包含了组织、人力资源人员以及人力资源或员工。


    绩效管理的总体目的是传达一套目标，并衡量每个个人对实现这些既定目标的贡献。通常情况下，所有相关人员都必须经过培训和告知以实现目标。绩效管理的目的还延伸到管理系统中更实质性的部分。


    以下是绩效管理策略的目的：


    ### 增强产出


    绩效管理策略可以提高或改善产出。这源于对员工的妥对待。对可用人力资源的适当管理将促进高产出，并要求确保雇主保持满意。


    ### 增强沟通


    沟通在任何组织中都是有效的。组织内良好的沟通将建立卓越的雇佣关系。雇主将可以直接或通过人力资源管理团队沟通困难。这种努力极大地提升了生产力。


    ### 员工发展


    绩效管理鼓励个人发展。这是公司在其细分领域保持竞争优势的关键。在这里，绩效管理概念的适当实施将有助于组织的生产性增长。当员工得到良好发展时，处理责任变得容易，这样的员工能够与团队联系。


    绩效管理的其他目的包括：


    a) 鼓励经理和员工之间的承诺感

    b) 技能工人的存在

    c) 团队合作的灵活性

    d) 营造丰富的氛围

    e) 鼓励公司或机构利益相关者的自律


    ## 2.4 拟定有效的绩效管理策略


    在概述绩效管理策略之后，接下来的任务是促进这些策略的实施。因此，人力资源部门将着手拟定有效的方案。在此过程中首先要考虑的是个人（员工）发展以及如何说服员工做出投入。这与
    John Lockett (1992) 关于绩效管理的观点一致。考虑利用 Lockett 的观点，拟定在任何实务组织中都通行的有效绩效管理策略。


    ### 收集绩效数据


    积极的人力资源人员会持续收到有关员工绩效数据的报告。要求公司员工进行审计是雇主的职责。作为人力资源人员，要通知团队收集丰富的工作数据，这些数据将用于对员工活动进行更详细的评估。这可以根据组织的大小每天、每周或每月进行一次。这将减轻人力资源管理团队的工作负担，并确保人力资源管理部门的主动性。


    ### 整理绩效数据


    整理是关键比较的阶段，也是对收集到的记录或数据进行顺序且正确的组装。在组织内分享不同部门的数据，可以使整理任务变得更容易且几乎无错。


    ### 绩效考核


    绩效考核也可以称为绩效回顾或年度回顾。这是建立有效的绩效管理策略而需要制定的下一个必要草案。绩效考核仅仅是根据员工与其分配的工作对其表现进行评估的正式形式。评估涉及该员工在工作中表现得多么稳定或一致，以及他在组织中活动的有效性。考核可能会奖励一个值得奖励的员工，也可能寻找解决方案并鼓励该员工。它还包括评估和处理员工表现不佳以及讨论解决方案。


    ### 提问


    在考核显示员工活动缺乏生产力的情况下，面谈是理想的。不要对考核结果下判断；相反，要找出为什么员工交付了不理想的表现。公司可能有应该了解的事情，这可能不仅对该员工是负担，对其他人也是如此。对情况进行提问将极大有助于识别问题，这些问题可能是管理决策或工作氛围的结果。


    ### 解决问题


