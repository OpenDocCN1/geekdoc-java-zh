    ## 测验 10


    1) 人才发展在隐含中是一种调整员工使其变得更 ____________ 好的行为。


    a) 心理上

    b) 情感上

    c) 集体上

    d) 个人上


    2) 哪项不是人才发展的重点领域？


    a) 创新能力

    b) 技能提升

    c) 更快的适应

    d) 卓越绩效

    e) 以上都不是


    3) 关于人才发展的一种观点是，开发系统有利于 _________ 而不是 _________。另一种观点则认为它对双方都有益。


    a) 员工、经理

    b) 经理、员工

    c) 员工、雇主

    d) 雇主、员工


    4) 大多数员工天生就具有与生的天赋，使他们能够对组织、其生产力和增长产生重大影响。[正确或错误]


    a) 正确

    b) 错误


    5) _________ 涉及对个体的心理学研究。为了使此类研究取得成效，必须存在一种亲密关系，让人力资源人员能够理解困扰员工的问题。


    a) 管理

    b) 辅导

    c) 指导

    d) 雇佣关系


