    Apart from profit-making, companies try to gain a competitive advantage over others.
    This is necessary because the more authority an organization builds, the more
    prominent and relevant it becomes in society. Organizational development plays
    a role by confronting and expelling the challenges that could hinder the rapid
    progress of an organization.


    ### Regulatory/Legal Compliance


    Law agencies detest companies that violate standards. Companies equally detest
    being caught in the act knowing the consequences accompanying such. Organizational
    development then attempts to review and ensure that both organizational and legal
    policies do not conflict.


    ## Chapter Summary


    a) Organizational Development is a strategic process that refers to the gradual
    and practical development of the various faculties of an organization and looks
    to identify what works and what does not.


    b) Strategic planning, recruitment, and compliance enforcement are three pivotal
    parts of organizational development.


    c) Strategic planning involves three traditional stages which include formulation,
    execution and evaluation.


    d) The various processes that result in a proper recruitment practice should involve
    the identification of a vacant position, outlining the requirements of the position,
    generating a description of job, sourcing and screening and finally reviewing
    the performance of the recruit.


    e) Enhanced communication, employee growth, competitive advantage, and increased
    profits are all objectives of HRM development.


