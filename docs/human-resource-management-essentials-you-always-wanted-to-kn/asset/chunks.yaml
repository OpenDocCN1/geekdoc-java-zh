    # 雇主与员工之间的关系可能是复杂的。由于这种关系引入了抽象和具体的互动，例如分享想法、行为、情感、人力资本、有形工作产品、态度、绩效等，因此组织必须通过一种微妙的方式来处理对这些关系的保护。人力资源管理试图保护驱动人力生产力要素的关系，而这种要素有助于组织的成功。这种保护最好的方式是制定并实施适当的策略，解决损害员工、管理层与公司之间关系的问题。许多组织建立了一个名为`Human
    Resource Management`的个人业务部门或职能，作为这些解决方案策略的制定者、维护者和执行者。


    ## 人力资源管理


    机构的`Human Resource Management`部门通常被赋予了指向员工全面发展的任务。这源于面试、对组织立场（财务和所有权）的分析、向员工传卓越且富有成果的知识、工作纪律、遏制公司员工之间的骚扰和恐吓行为，最重要的是维持和保持组织的工业化和进步性关系。在本文随后的部分，我们将探索`HRM`通常被采用和接受的通用功能。


    大量且各样的报告建议了正确或适当的人力资源与员工比例。领先的顾问、`SHRM`（人力资源管理协会）、商业博客主等人都分享了他们认为的何时聘用 HR 人员的最佳实践或最常见且有效的策略。平均而言，大多数报告和信息表明，当公司大约有
    40 名员工时，就应该聘请人力资源专业人员。最重要的是要知道，如果任何现代组织中缺乏这种关键的权威，将会出现一系列影响公司各个方面的挑战。从本质上说，如人员配置不当、员工关系紧张、雇主与员工关系疏远以及其他各种障碍将成为日常常发生的事情。关键在于在过程中尽早寻求人力资源专业人员，以避免与合规、法律、招聘、绩效、发展、留任和离职相关的各种失误。


    ## 人力资源管理的演变


    `Human Resource Management`一词可以追溯到古代中世纪。然而，近期的研究表明，`Human Resource Management`的概念可以追溯到远古。虽然人力资源的概念和时间一样古老，但早期并没有明确地承认`Human
    Resource Management`这一术语。此外，雇主与员工之间的关系程度在很大程度上是糟糕的，这就是为什么这个概念与早期历史并不紧密。


    在 20 世纪 20 年代，出现了新的正式职位来促进`Human Resources`的增长。其中之一是`Labor Manager`或`Employment
    Manager`职位，它的出现是作为对行业整体建设的一种制衡，特别关注劳动力和员工。这主要适用于生产率高的工厂，以便于生产和生产检查/管理。反过来，这触发了生产力的异常提升，但是以牺牲对员工的单纯鼓励为代价的，有时是为了获得与其他工厂的竞争优势。


    `Human Resource Management`在 20 世纪 80 年代进入了更充分的使用。然而，它仍然出现在一个未能理解雇主与员工之间关系的时代，而这种关系我们现在现代机构中经常看到。此外，人们认为其近现代的起点源于女性对自己和孩子寻求安全立足之地的渴望。除此之外，该概念的关注点还在工业中更好产出的生命力。


    ### 历史视角


    `Human Resource Management`作为一个术语和一个研究领域并非凭空产生。它经历了几个阶段和劳动分工，才在组织内部形成了其显赫地位。事实上，中世纪见证了`Human
    Resource Management`的兴起，以及它从一个限于农业的时代向工业化再到后工业化时代的进程。


    ### 工业革命前


    正如其名称所示，这场革命涵盖了社会中有限的职业。主要职业是农业，并伴随着手工业。当时缺乏工业化的理念，因此，以自然方式利用大部分自然资源占据了那个时期。


    为了简化这一理念，这里有在三个方面显著的三个类别——奴隶、农奴制和契约劳动。


    a) `Human Resource Management and Slavery`:


    将人类作为劳动力使用始于奴隶制的基石。劳动力的来源主要是主主购买在农场工作的奴隶。主主通常不关心或不关心人员配置的任何方面，包括福利、健康和工作时间。在此基础上，主主无法从田里筛选出无生产率的工人。相反，无能力的奴隶受到了极其糟糕的对待，被迫在困难且有时是不可能的条件下工作。然而，主主与奴隶之间存在着亲近的关系。忠诚的奴隶通常会获得某种奖励，或者被卖到更好的工作环境。最终，一些工人会离开并建立自己的产业，而另一些人则留在主主那里。


    b) `Human Resource Management and Serfdom`:


    农奴被束缚在土地上并被封建主所有。由于那个时代主要是封建的，农奴的责任始于和结束于农业。农奴享受来自封建主的某种待遇，封建主经常奖励他们。奖励可以是金或任何有价值的物质。


    c) `Human Resource Management and Contracted Labor`:


    随着时间的推演，人力资源发生了变化，这改变了劳动的整体观念。时代开始见证契约劳动或合同劳动，他们拥有比奴隶和农奴更多的自由。在此期间，主主倾向于尊重劳动者，这很大程度上是因为交易的契约性质。主主看到勤奋的工人，意图通过延长合同或终身合同留住他们。为了实现这一点，主主引入了多种工作福利、激励以及一些积极的激励影响，让工人保持快乐并延长合同。


    ### 工业革命 (1750 - 1850)


    工业革命标志着从农业向全职工业化转变的结束。这一时期通信比过去更加突出，这促进了对人力资源认识的持续增长。劳动的薪资分级制度以及对现有工业中工人更具热情的对待方式应运而生。这场革命在全球范围内被见证，这引起了大多数工人的不安。他们需要找到实用的方法来克服威胁他们生活方式的酝酿局面。


    工人的时间伴随着低薪水。为了解决这个问题，工会在 1790 年左右显著兴起，这为工业工人提供了更多的权威性。人事管理部门提升了他们的水平，采用了更熟练的模式来处理涉及公共事务的情况。


