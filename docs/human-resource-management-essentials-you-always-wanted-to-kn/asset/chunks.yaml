    罗伯特·欧文（Robert Owen）被视为人事管理的之父。他因提出改革员工工作时间的想法而闻名。在他的兰 ark 棉棉厂（Lanark Cotton Mills）公司里，他引入了八小时工作制，这现在是全球大多数机构的普遍做法。他的想法完全是为了激励工人产生更好的成果，以获得相对于他人的竞争优势。与查尔斯·巴贝奇（Charles
    Babbage）一起，罗伯特·欧文认为为健康的工人住房将带来完美的工作环境。


    ## 工业革命后 (1850 年)


    在此期间，弗雷德里克·泰勒（Frederick Taylor）的科学管理原则运而生，他不断改进工业效率，并成为最早的管理顾问之一。泰勒侧重于管理简单任务以提高生产力。他认为，从更科学的方法来处理工作可以增加产量，并减轻仅落在工人身上的责任。当时的工人曾被要求去思考如何获得提高生产力的激励或主动性。


    乔治·埃尔顿·梅奥（George Elton Mayo）被视为人力资源管理的之父。埃尔顿·梅奥与弗里茨·罗特利斯伯格（Fritz Roethlisberger）共同观察了“霍桑效应”（Hawthorne
    Effect）的发现，该效应认为需要高效的工人和卓越的工作条件。这把增加人力资源生产力的想法转化为了更具吸引力的产出效率。


    随着这一时期学术方法的日益盛行，人力资源管理的性质迅速传播到更现代的结构。人力资源管理的概念现在促进了行业对关注员工福利的需求。它进一步帮助机构采用效率而非非技能劳动力。尽管雇佣了熟练工人，人力资源管理也鼓励需要培训工人使其变得更有胜任。相反，行业将看到更具生产率的财务增长。


    ## 1.2 人力资源管理理论


    ### 普遍主义理论


    人力资源管理的普遍主义理论建立在最佳实践和高绩效工作实践的理念之上。它认为，行业的表现主要取决于可用人力资源的利用实践。这表明，缺陷的人力资源会对整个组织产生负面影响。


    此外，普遍主义者认为，任何足够好的做法都在全球范围内被实施。机构遵循其他机构有效的做法，以试图维持一种持久、良好且高效的氛围。此外，一个生产工业的成功是根据其财务表现来衡量的。因此，这样一家公司的表现取决于工人或人力资源的实践。该理论的愿景是开发一种可以被全球相关机构普遍采用的方法，以创建一个适用于所有人的平衡工作系统。


    ### 权变理论


    权变理论与人力资源管理的普遍主义理论完全对立的。该理论认为，全球范围内不存在相似的做法。就此而言，行业和组织应该制定一种符合其业务环境的模式。例如，麦当劳（McDonald’s）的员工有特定的送餐方式，以及为客户包装快餐的方法。如果将这种做法转移到像银行这样的机构，整个方法将产生冲突，反而会对日常活动构成威胁。这就是为什么理论或模型反对普遍性。这种观点认为，在
    `Y` 公司有效的方法在 `X` 公司可能不会奏效。


    ### 资源基础理论


    描述这一理论的独特术语是`learning`（学习）。基于资源的理论认为，工人的知识水平无疑会对公司的生产力做出巨大贡献。组织通过训练其员工在所属领域变得更熟练可以获得更显著的收益。一旦变得熟练，工人将发现更容易应对此类组织的需求，这将在短时间内鼓励高生产力。


    由于人力资源决定了竞争领域的增长和创造，让员工保持无知状态太久是不健康的。因此，员工或工人必须立即接受培训，而不能等到他们适应。


    ![一张自动生成的手机屏幕截图](img/HRM4.png)


    ### 软性模型


    软性模型或理论认为环境决定了员工的生产力。雷格（Legge）的观点认同员工是公司竞争优势的重要手段。这通过极度的奉献和灵活性来实现，并且通常非常有价值。这样的环境必须是有益且具有助推作用的。在这里，公司应该高度维护其工人的诚信。


    工人被鼓励共同努力以取得组织的进步。几位学者将其视为任何公司的一种战略方法，用以说服其劳动力倾尽全力并在活动中保持自律。


    软性理论还构想并承认人力资源对于组织的成功增长至关重要。一旦表现出决心、承诺、坚持和技巧（这些通常通过公司管理者的培训获得），机构的成功就会变成现实。此类情况同样可以在短时间内将工人更换为另一名熟练工人。


    ### 硬模型


    与人力资源管理的软性模型不同，硬模型是人力资源管理的传统观点，带有管理层的压力。该理论认为，赋予工人过多的免疫权和自由会导致生产力低下和懒惰。这种模型在工人自由方面反对软性模型。管理层对环境有更严格的控制，反过来紧张了工作氛围。


    组织更关注自身的增长，而不关注工人的工作福利。此外，由于技能被贬值，缺乏技能和团队合作。结果，公司的管理风格保持僵化，并且往往是强硬或不够灵活的。


    ## 1.3 人力资源管理方法


    人力资源管理具有几种方法。每种方法都体现了其独特的观点，而这些观点非常具有争议性。


    这里列出了一些人力资源管理方法：


    ### 管理方法


    这种方法的重点仅仅是管理。它关注了组织的管理方面以及其中的工人。它还涉及对决定组织生产力的整体展望和监督。从本质上说，管理方法涉及员工监督、生产力检查以及公司各层福利的理念。


