    The term ‘organizational development’ refers to the scientific methods and processes
    employed to aid in the development of an organization. It is a methodological
    approach towards achieving a goal, and that involves all aspects of a company.
    It refers to the gradual and practical development of the various faculties of
    an organization and looks to identify what works and what does not. The faculties
    may include employee performance, organization’s compliance with the law, the
    effectiveness of the internal and external policies on an organization, and its
    overall productivity.


    The idea of organizational development in Human Resource Management focuses on
    changes that could develop available human resources. It looks to replace older
    policies with new policies that can be effective in an organization’s workforce.
    This often takes place in a very systemic and organized pattern as either designed
    by a team of human resource persons or a visionary employer of labor.


    The ideology of organizational development in Human Resource Management preaches
    human resources development. This has a connection with the fact that human resources
    are a necessary aspect of the productive prowess of any organization. In short,
    human resources are the backbone of any organization. Human resources merit recognition
    from the ideology of organizational development in management due to its importance
    in productivity. Without productivity, which determines output, an organization
    would not be able to maintain its ability to perform and produce effectively.
    Also, unskilled or ineffective labor will discourage the growth of an establishment,
    and for this reason, there must be systemic standards employed by the human resource
    person(s) to reconcile things.


    ## 4.1. Concept of Organizational Development


    The concept of organizational development (OD) is an earnest attempt to amend
    or better develop an organization’s practical approaches and policy standard or
    pattern of operation. It takes place with the employment of a more sophisticated
    approach and relies on theories or models and a series of researches to function.
    The entire process is well-planned and designed before being applied to the organization
    for results.


    Cummings and Worley (1997, p.2) posit that “organization development is a system-wide
    application of behavioral science knowledge to the planned development and reinforcement
    of organizational strategies, structures, and processes for improving an organization’s
    effectiveness.” This definition highlights that OD rallies around the systemically
    planned development to identify, solve, generate, and implement a more effective
    strategy to solve problems.


    In the same vein, Burke (1982) asserts that “organizational development is a planned
    process of change in an organization’s culture through the utilization of behavioral
    science, technology, research, and theory.” Just like Cummings and Worley, the
    entire concept of organizational development relies on a system and is procedural.
    This means that the entire actions are carefully crafted and done in order to
    find the problem. Once the problem is identified, it becomes easy to solve since
    it has been well identified.


    Consider Beckhard’s view of the concept of organizational development before emphasizing
    the major terms. Beckhard (1969, p.9) claims that “organizational development
    is an effort planned, organization-wide, and managed from the top, to increase
    organization effectiveness and health through planned interventions in an organization’s
    processes, using behavioral-science knowledge.”


    There are common expressions used in all of these definitions. These terms also
    happen to give a fuller description of the concept of organizational development.
    Let’s identify the terms to break down the description of organizational development
    further. The common terms in the above definitions include:


    a) Science

    b) Plan

    c) System

    d) Process

    e) Development

    f) Change

    g) Effectiveness


    Taking a closer look at the identified central terms, one would notice that they
    each have something in common. It is further proof that the concept of organizational
    development is purely scientific. If planned outside of scientific measures, the
    result might not turn out as expected.


    ## 4.2. Objectives of HRM Development


    The objectives of Human Resource Management development differ from organization
    to organization. Several organizations each have their goal and reasons why development
    is important to them. Remember, the concept of Human Resource Management development
    thrives on the effectiveness of an idea and a scientific approach made towards
    it for a better result in an organization.


    In most cases, the idea is interrelated with the managerial doctoring. It is a
    buildup and attempt to solve a problem, propose, and initiate an approach that
    leads to expectations. How this works is simple. First, a plan is made, and the
    necessary facilities of an organization are informed. Everyone is made to brace
    up or stay abreast of an innovative idea that will first be used in a trial and
    error mode. During the process, the focus switches to make a clearer definition
    that seems to find out whether there are flaws in the plan that an organization
    can do away or cope with. This is the diagnosis stage, where everything is purely
    experimental in the organization. During this experimental approach, ideas are
    retrieved, and these ideas are such that they could be very effective in the organization.


    Since the goal of a developmental strategy is to identify and use what works,
    the extracted ideas will then be tested in some faculties with expectancy that
    it works. Often, a well-strategized and properly developed developmental structure
    works.


    Competitive Human Resource Management can figure this out and use it in an organization.
    Moreover, different strategies work for different organizations, and this is due
    to the overall operational, in-place policy, theoretical approach of a company.
    This would not be an impossible target for any talented Human Resource Management
    team.


    This said, after the effectiveness of human resources development in an establishment,
    there are fundamental expectations. Principally, these are the objectives of management
    development. Here are the targets and objectives of Human Resource Management
    development in an establishment.


    ### 4.2.1. Increasing Profits


    Profit maximization remains an undeniable concept in any development campaign.
    It concerns, as earlier identified, approaches that encourage more profit. Several
    strategies, like staff training, policy review, legal and regulatory compliance,
    as well as staff encouragement, are taken into consideration. These help a company
    to maximize profit and remain in business.


    ### 4.2.2. Setting an Organization on a Competitive Advantage


    Dale S. Beach perceives organization development as “a complex educational strategy
    designed to increase organizational effectiveness and wealth through planned intervention
    by a consultant using theory and techniques of applied behavioral service.” As
    seen here, the foremost objective of organization development is effectiveness
    and wealth. The idea of wealth awakens the sense that a company adopts this strategy
    to increase profit, which is the basis of any establishment, by attempting to
    initiate measures that boost its chances over those of other competitors.


    ### 4.2.3. Employee Growth


    Since the aim of organization development is the betterment of an organization,
    strategies like staff development also emerge. When a company shifts recognition
    to staff’s growth, it grows the business too. The productive aspect of any establishment
    relies on employees and not just employees but resourceful employees. For there
    to be resourceful employees, there must be employee training, a conducive working
    environment, recognition and reward, and respect of employee and initial working
    conditions.


    ### Enhanced Communication

