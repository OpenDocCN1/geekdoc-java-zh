    Moreover, conflict in an organization might sometimes be a movement towards a
    new standard. This means that conflict has the potential to build after destroying.
    An organization that recently reconciled differences among themselves will notice
    that there will be some sort of tolerance that initially lacked before and during
    the conflict. Unlike several other concepts, a conflict has things that define
    it.


    ### Inevitability

    Any organization should be well prepared, as an absolute is that within an operating
    business construct, conflict is inevitable. No matter how organized an organization
    is, the challenge of conflict will always set in. It could be management-employer
    conflict, employer-employee conflict, employee-employee, or management-employee
    conflict. These are collectively called inter-organizational conflicts. There
    is also an intra-organizational conflict that involves employees. However, what
    defines organizational management is its ability to reconcile differences.


    ### Avoidable

    This implies that with the right measures, conflict can be put out or minimized
    within and outside of the organization. Most companies set up teams other than
    resource management teams to identify and expel conflicts from the organization
    regularly. In cases where the managerial department is not proactive towards conflict,
    a conflict will arise. When it does, it will require an enormous strategy and
    resources to reconcile. It is better to design a proactive strategy that keeps
    checking on a conflict from eventually taking place.


    ### Reconciliation

    The idea is that conflict is not a concept that completely locks down a company
    but a necessary happening that can be solved whenever it arises. Conflict occurs
    as a process and can be solved procedurally. All it takes is a well-planned strategy
    that convinces the involved parties of the need to reconcile an outstanding misunderstanding.
    Whether it is internal or external, a sufficing resolution is not far-fetched.
    Also, it is easier to fix an internal conflict than external conflict. The reason
    is that externally conflicting parties likely have contradictory policies that
    will more than often disagree.


    ### Noticeable

    Companies with problems cannot conceal their problems. This brings on a soured
    competition, and the conflict would always be noticeable in the way both companies
    deal with each other’s affairs. If it is in an environment with multiple establishments
    of the same niche, the other companies will seize the opportunity to become competitively
    better.


    ### Spreads Rapidly

    Conflict spreads rapidly. It is like a communicable disease, and several companies
    or individuals can become involved. In an organization, for instance, when conflict
    arises, it moves from table to table. While moving, other personalities in the
    company will take sides. The supporters for each individual will tend to dislike
    the individuals supporting the other. This also happens on an organizational level
    where companies pick sides and rebuke the other company. This will arise in opposition
    and could affect the entire business health of a business environment. Such should
    be resolved on time to avoid low productivity.


    ## 5.2. Classification of Conflict

    Occasionally, conflicts arise in workplaces. The scope behind conflict usually
    is on who is right and who is wrong. Both parties often tend to think they are
    right while ignoring the fact that both could be wrong. David L. Austin (1976)
    opines that “It can be defined as a disagreement between two or more individuals
    or groups, with each individual or group trying to gain acceptance of its view
    or objectives over others.”


    Drawing from Austin’s opinion, it is evident that organizational conflicts are
    founded on personal objectives. Most times, neither party wants to listen to the
    other but, instead, feel they are right. This sort of conflict arises on various
    basis. It could be based on strategy, result, involvement, or scope. Whichever
    way, the focal point remains that conflict occurs because the involved or conflicting
    parties in an organization have refused to listen to each other’s views and objectives
    and to accept them in one form or another. As long as either party values only
    its objectives, the conflict will persist.


    Traditionally, the scope conflict is broad and so are its types. Some of the types
    of conflict include relationship conflict, value conflict, task conflict, intra-organizational
    conflict, inter-organizational conflict, interpersonal conflict, intrapersonal
    conflict.


    ### Relationship Conflict

    This has to do with the soured relationships between either employers and employees,
    employers and management, management-employee, or even employee and employees.
    The basis of conflicts such as this arises when the means of communication goes
    sour. It becomes tough to handle happiness, and as such, the organization loses.
    To fix a conflict such as this, human resource management must identify and reconcile
    the conflicting parties. Such would be possible through effective communication
    strategies.


    ### Value Conflict

    The differences in values are causative reasons why conflict takes place. This
    is most notable among the management staff since they are responsible for the
    planning of policies in the organization. A management team might consist of various
    individuals with varying beliefs. In most instances, such individuals tend to
    require that their suggestions be recognized over those of others. Sometimes,
    it could be as a result of personal interest.


    ### Task Conflict

    This is a type of conflict that arises when there is a difficulty or vast difference
    in the task apportioned. It is often a conflict of employer-employee, employer-management,
    or management-employee. For example, when the staff has a shared duty, it might
    initially appear as a simple task. Eventually, it becomes tougher and, in most
    cases, beyond the working conditions. The employee may experience difficulty and
    attempt to express it to management. Whereas management believes they have already
    mapped out or devised the perfect tasks to support the organization, an employee
    may vehemently disagree.


    ### Interpersonal and Intrapersonal Conflicts

    Interpersonal conflict occurs between two persons in an organization. It is usually
    among staff with varying belief systems. Sometimes, it has to do with external
    affairs that do not concern the organization. Also, it is as a result of differences
    in how both individuals view certain things. For example, if an employee is apportioned
    a task, another employee might arrive with a different idea thinking the initial
    idea is substandard or would be ineffective. On the other hand, intrapersonal
    conflict refers to the difficulties within one’s mind in an organization. Such
    difficulties could be conflicting thoughts towards a standing policy. It often
    ends in weak participation of such employees in the organization.


    ### Intergroup and Intragroup Conflicts

    Unlike interpersonal and intrapersonal conflicts, intergroup and intragroup conflict
    involve a team or a group in an organization. Intergroup conflict is common in
    organizations featuring teams tasked with a different responsibility that should
    boost the organization’s business performance. For example, a conflict might arise
    with the welfare department and social duties department in an organization. The
    social group department might then pick up issues with the welfare department
    due to probably the issuance of an amount that does not meet requirements. The
    different group might be thinking their initial demand is outrageous while the
    demanding team thinks they are trying to cheat. Intragroup conflict is different.
    This conflict occurs in a team of workers tasked with a goal. The only difference
    between intergroup and intragroup conflict is that intergroup occurs between two
    or more different groups, while intragroup occurs within the same team or group.

