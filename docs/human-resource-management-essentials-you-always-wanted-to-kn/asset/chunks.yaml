    在找到表现不佳的原因后，勤奋的经理或主管会尝试寻找解决方案。例如，当公司处于转型阶段时，员工通常需要一些时间来适应新系统。由于这种原因，员工可能会在分配的任务上出现落后。如果此类员工的原因暗示公司推行的工作流经常将员工分配到错误的工作上，可以考虑允许这些员工自由提议更合适的工作流。例如，一位擅长编程的员工在处理公司的推广事务（如使用任何社交平台为品牌广告）时可能会遇到困难。一旦确定了表现不佳的原因，请向人力资源管理部门报告。确保进行妥善的跟进，并制定出持久的解决方案。


    ### 奖励卓越表现


    高绩效员工应该得到奖励。奖励将鼓励员工在随后的工作中表现得更好。此外，奖励卓越表现可以建立更稳固的雇佣关系，注入忠诚、信任和感激的元素。


    ## 2.5 绩效管理周期


    比尔·盖茨曾对绩效评价道：“在商业领域，衡量你正在做的事情，选择那些重要的衡量标准，如客户满意度和绩效……你因此而蓬勃。”他对衡量标准、客户满意度和绩效的评论包含了三个必须共同作用才能产生积极结果的概念。绩效管理周期是对员工绩效的季节性或年度检查。该系统不区分任何类别的员工，寻求弥补不足，并推动全体员工统一朝着计划目标迈进。


    这种形式的首要目标是产生或发现有效的策略。这就是为什么策略大多以每年为单位进行，以评估员工绩效并查看可以采取哪些措施来提高绩效。最终，绩效管理周期的理念是让员工保持正轨以交付预期的输出。这是因为员工通常担心在任何组织中获得最低的评级。这一理念与员工的核心价值观相联系，并试图将这些价值观与组织的预期相匹配。该周期与工作效率、工作灵活性、员工投入度以及员工之间的激烈竞争等优势结合在一起。它涉及四个阶段，包括：


    a) 计划

    b) 监控

    c) 评审

    d) 奖励


    ![白色背景上文字的特写自动生成的描述](img/HRM10.jpeg)


    ### 计划


    计划是绩效管理周期的第一阶段，涉及设定简单、可实现的目标。在这里，可能会有一些微小但有效的活动，如对当前工作进行描述、概述清晰的目标，并告知员工组织对一年的预期。这一阶段应包括理解并纳入组织的指导原则。此外，管理层应该识别以员工为中心的绩效目标和策略。


    在计划期间，让计划符合约翰·昆西·亚当斯的话：“如果你的行动激励了他人去追逐更多梦想、学习更多知识、做更多事情并成为更好的人，你就是一个领导者。”制定能够激励员工且灵活的计划。参与到计划中，并努力带动每一个人。


    为了有一个更简单的绩效管理模型，可以考虑实施 `S-M-A-R-T` 技术。这是一种目标设定技术。目标或任务应该是：


    `S` – 具体（Specific）—— 目标要具体，确保它是组织内清晰易于理解的目标。


    `M` – 可衡量（Measurable）—— 所有计划必须是可衡量的且易于遵守。

    `A` – 可实现（Achievable）—— 不要计划组织无法实现的行动。简单来说，计划要切实际。

    `R` – 相关性（Relevant）—— 所有计划必须是相关的，并能对组织增长产生积极影响。

    `T` – 时间限制（Time-Bound）—— 不要制定超出可实现时间范围计划。


    这一阶段最基本的流程之一是最后部分。在实施计划之前，经理和员工（有时包括人力资源部门）应该同意并确认计划。这确保了所有参与人员的理解。


    ### 监控


    绩效管理周期的第二阶段涉及对组织正在活动和业务进行跟踪。检查为实现组织目标所做的进展和员工表现。偶尔会讨论困难并提供解决方案。听取员工的建议是理想的，因为他们更参与生产方面，有时知道什么对公司最好。在这个阶段，经理应该提供持续的教练、咨询、指导和引导。他们应该促进员工培训和发展机会，以便更好地管理表现不佳和纪律问题。


    绩效监控和发展应该是持续的过程，如果结合有效的目标设定，就能建立起通往员工成功的桥梁。


    ### 评审


    评审活动以确定目前实现了多少目标。本质上，在这里我们确定问责有效性衡量标准。理想情况下，评审应该导致采取措施来改善现状。此外，确定额外的措施有助于实现目标。关注员工至关重要。员工可能因为特定的公司新政策、创新、工作环境或糟糕的雇佣关系而表现下降。为了揭示原因，要询问此类员工，并且在此过程中不要责备他们。要给予鼓励，使此类员工对工作更加投入。参考之前制定的计划以查看目标是否达成很重要。在此阶段，确定评级结果很重要。在此阶段，经理应该对评级结果和绩效目标提供反馈。关键词是反馈！


    ### 奖励


    绩效管理周期的第四阶段也是最后一个阶段是奖励、薪酬和认可阶段。这是对员工本阶段表现的鼓励。戴尔·卡内基（领导力培训大师）认为：“人们为了钱工作，但为了认可、赞扬和奖励而付出额外努力。”除了钱，工人还需要认可和应有的赞扬。这意味着感到未被认可的员工将不会保持投入。为了鼓励这种工作更多、投入更多的愿望，应该考虑奖励。此类奖励有多种形式，可能包括礼物、升职、加薪、缩短工作时间和增加自由。奖励最初不应与评级或计划挂钩。评级应用于评估绩效。达成目标和任务最终可能与金钱奖励（如奖金或绩效工资）挂钩。其他奖励可能包括升职、特殊认可或满足认证要求。


    这一阶段的特点是在必要时实施绩效改进计划。如果员工没有达到预期的目标和任务，他们不一定要奖励，但应该接受适当的跟进以“奖励”他们的表现。这通常通过绩效改进计划（PIP）来实现。


