    ### 5.4 Causative Factors of Conflict


    Conflict is avoidable and solvable but still inevitable. Some organizations believe
    that they are too perfect to experience conflict. However, this is fallacious
    in several angles. Conflict is not something planned for; it takes everyone off
    guard. It is likely to occur in organizations where there is too little or no
    attention paid to things that could cause problems. For example, the least substantive
    conflict like company policy could trigger a fallout within an individual, and
    this is referred to as intraindividual conflict. It leaves an employee emotionally
    uncomfortable, which affects the workflow of the organization. There are several
    other causative factors of conflict of which every management department should
    be aware. Knowing these factors would help to manage the organization in a way
    that pushes it away from being confronted by conflict. Some of the causes mentioned
    are in line with Bell and Hart’s assertions on the causes of conflict.


    #### Contradictory Objectives

