  trans: "\n随着组织发展概念的有效性，沟通和沟通渠道将得到加强。同时，通过适当的沟通，将促进健康的雇佣关系。毫无疑问，如果没有有效的沟通，公司将保持僵化且缺乏活力。高层和中层领导将发现，很难与员工沟通并识别出需要解决方案的问题。\n\
    \n## 4.3. 组织发展流程\n\n组织发展流程是指组织为了实现预期目标而构建的简单分步骤的方法。这些流程旨在达到超过组织初始基准的高度。它们是以科学且组织化的方式进行的，并需要关注机构的各个方面，以避免将目标与其他目标混淆。所有可能的结果取决于管理层的执行力。此外，设计的任何计划必须保持一致，因为任何不一致都会破坏整个体系，从而导致意想不到且不符合愿望的结果。流程可能会根据公司的目标或侧重点而有所不同。\n\
    \n然而，这些通用的方法论流程通常用于实施以获得更好的结果：\n\n### 问题分类\n\n组织管理中的第一个流程是问题诊断或分类。它涉及揭示挫折、规避以及建立政策。由于问题识别具有敏感性，必须在该专注的情况下进行。在可能的情况下，必须结合使用人力和非人力工具来找出准确原因。建议密切研究四类问题，包括雇主、管理层、员工和公司政策。这四类涵盖了可能扰乱流程或公司的问题。\n\
    \n### 对诊断出的问题的审查\n\n这应该在分类或诊断问题后立即进行。应对对突出问题进行严密的科学研究。在这个阶段，研究警告说对情况采取偏面态度是糟糕的。这意味着不能忽视公司的任何有问题的部门，无论是雇主、管理层、员工还是非人力资源。一旦偏袒某个问题的源头，它就变成了一个“悬而未决的问题”。，必须重新审视并修正此类问题，否则结果将是可怕。\n\
    \n### 收集相关数据\n\n每个识别出的问题都有来源。从现在起，来源必须成为关注焦点。也就是说，任何产生问题的部门都必须接受密切监督，以检索相关数据。这可以通过获取该部门的每日或每周活动报告的形式来实现。请注意，必须按照建议只检索相关数据。除此之外，系统化的方法将会丢失，整个过程将变得复杂。\n\
    \n### 审查与规划\n\n在检索相关的活动或政策数据后，建立一个团队并指派其对这些数据进行审查。告知团队做什么，并确保定期监控个人进度。将此任务分配给管理团队的重要性在于，长期运行审查可能会导致不准确。接下来，从团队获取报告并作为一个团队进行汇总。执行一个与问题相符的计划。\n\
    \n### 计划实施\n\n在收集必要信息并制定合适计划后，起草草案以确保清晰。将计划发送给每个受影响的部门，并确保执行新计划。定期审查并检查进度。\n\n\
    ### 获取实施的计划数据\n\n在一段时间之后，获取实施计划的数据。寻找改进之处并找出变化的原因。根据目标对新政策进行修订或修改，以深化目标。监控进度直到业务期结束，届时将进行评估。\n\
    \n### 分析结果\n\n在业务期结束时，确认结果并识别积极因素。写下所有积极因素以及伴随它的有效策略。分析结果并进入下一个业务季度。对于导致结果不理想的计划行动，重新审视策略，以确定是否应该对某些流程进行修订或终止。\n\
    \n## 4.3.1. 战略规划\n\n没有有效的战略，组织就无法维持增长和成功。战略定义或描述了为了实现目标而利用一系列行动的方法。当一家公司制定战略时，该公司有一个意图要达的高度。因此，战略规划的概念不断演变。\n\
    \n### 定义战略规划\n\n这个术语源于战略，指的是一个简单的行动计划。它是思想、政策的安排，最后是为实现组织内成就而采取的决定性措施。战略规划的主要目标是确保只有有效的方法发挥效用。如果一个通常针对提高产出的策略失败了，说明缺乏规划或管理规划不当。然而，当战略有效时，意味着管理层已深入发现可行的方法，而且这是通过程序完成的。\n\
    \n在战略规划过程中，我们将制定战略团队称为战略家。他们的工作非常简单，难度取决于涉及人员的技能。\n\n传统上预计战略家在处理事务时具有系统性。必须建立若干方法来为机构规划战略。这是因为战略规划的概念繁盛于从僵化向能产生成果的演变。上上所述，让我们识别为任何组织提高生产力制定或规划有效战略的必要程序。\n\
    \n### 战略规划流程\n\n以下是规划战略的传统流程：\n\n### 制定\n\n这一阶段仅涉及在制定计划之前识别行动。一旦确定，接下来就是对将作为策略的思想进行另一种简单安排。例如，如果一家公司希望建立内部政策，他们必须提出能使此类政策符合管辖区法律标准的想法。\n\
    \n### 执行 \n\n这一阶段涉及将生成的计划应用到过程中。这里的过程指的是使用策略所需的内容。\n\n### 评估 \n\n在此阶段，管理层应对实施的计划进行跟进，以确定其是否有效。\n\
    \n### 为什么战略规划是必要的\n\n有些组织没有意识到战略规划的需要。结果，此类公司往往处于预期的错误端。例如，一家寻求表现良好但无法规划出增强这种动机的策略的公司将失败。任何大型机构都应该拥有一个专注于战略规划的专门部门以便在竞争中立足。\n\
    \n以下是战略规划必要的理由：\n\na) 政策的有效性\nb) 提高产出\nc) 制定清晰的政策\nd) 提高生产力\ne) 符合管辖区法律标准的能力\n\
    f) 符合且组织化的管理方式\ng) 在某些情况下招聘高技能的人才\n\n## 4.3.2. 招聘\n\n"
