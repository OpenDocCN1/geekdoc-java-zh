    Robert Owen is regarded as the father of personnel management. He is noted to
    have brought about the idea of reforming working hours for employees. In his company,
    `Lanark Cotton Mills`, he introduced an eight-hour work schedule, which is now
    commonly practiced by most establishments worldwide. His idea was all in a bid
    to motivate workers into yielding better results for a competitive advantage over
    others. Alongside `Charles Babbage`, Robert Owen resorted to the notion that housing
    healthy workers would result in a perfect job.


    ## Post Industrial Revolution (1850)


    During this time, `Frederick Taylor’` principle of scientific management emerged
    as he continued to improve upon industrial efficiencies and became known as one
    of the first management consultants. Taylor focused on managing simple tasks to
    improve productivity. He believed that approaching the work from a more scientific
    methodology would increase production and alleviate the responsibility that was
    being placed only on the workers. The workers had been tasked with trying to figure
    out how to get an incentive or initiative for their productivity.


    `George Elton Mayo` is regarded as the father of Human Resource Management. Elton
    Mayo, alongside `Fritz Roethlisberger`, observed the findings of the `Hawthorne
    Effect`, which argues for the need to have productive workers and excellent working
    conditions. This transformed the idea of increased human resource productivity
    to efficiency for a more attractive yield.


    With the acclivity of the period frequented by scholarly approaches, the nature
    of Human Resource Management propagated with swiftness to a more modern structure.
    The concept of Human Resource Management now promotes industries’ need to be attentive
    to the welfare of workers. It has further aided establishments to employ efficiency
    rather than the unskilled workforce. Despite the employment of skilled workers,
    Human Resource Management also encourages the need to train the workers to become
    more competent. Reciprocally, the industry would witness more productive financial
    growth.


    ## 1.2 Theories of Human Resource Management


    ### Universalistic Theory


    The universalistic theory of Human Resource Management is founded on the idea
    of best practice and high performances of work practices. It argues that the performance
    of the industry mainly has to do with the practices of available human resources.
    This suggests that a defective human resource would have a negative effect on
    the entire organization.


    Moreover, universalists hold that whatever practice is good enough is being practiced
    worldwide. Organizations follow what works for the other organization in an attempt
    to maintain a durable, working, and productive atmosphere. Also, the success of
    a production industry is scaled by its financial performance. Therefore, the performance
    of such a company is determined by the practices of the workers or human resources.
    The vision of this theory is to develop a method that could be commonly practiced
    by concerned organizations worldwide to create a balancing working system that
    works for all.


    ### Contingency Theory


    The contingency theory is the complete opposite of the universalist theory of
    Human Resource Management. This theory argues that there can be no similar practice
    worldwide. On this note, industries and organizations are supposed to strategize
    a format that agrees with their business environment. For example, `McDonald’s`
    staff have a specific way of making deliveries as well as packing fast food for
    customers. If such practice is transferred to an establishment such as a bank,
    the entire methods would conflict and, in turn, pose threats to the day to day
    activities. This is why the theory or model opposes universality. A view that
    what works in company `Y` will not work effectively in company `X`.


    ### Resource-Based Theory


    The unique term used to describe this theory is `learning`. The resource-based
    theory argues that the knowledgeability of a worker would certainly contribute
    largely to the productivity of a company. An organization would gain more significantly
    by training its staff to become more skilled in their class. Once skilled, the
    worker would find it easier to cope with the demands of such an organization,
    and this would encourage high productivity within short periods.


    Since human resources determine the growth and creation of a competitive sphere,
    it would be unhealthy for the staff to remain unknowledgeable for too long. Thus,
    staff or workers must be trained immediately and not allowed to wait until they
    adapt.


    ![A screenshot of a cell phone Description automatically generated](images/HRM4.png)


    ### Soft Model


    The soft model or theory holds that the environment determines an employee’s productivity.
    The position of `Legge` agrees that employees are a vital means of a company’s
    competitive advantage. This is realized through the utmost commitment and flexibility
    and is often very valuable. Such an environment must be conducive and tributary.
    Here, the company is supposed to hold high, the integrity of its workers.


    Workers are encouraged to busy themselves collectively for yielding organizational
    progress. Several scholars view it as a strategic approach for any company to
    convince its workforce into giving their all and being self-disciplined with their
    activities.


    The soft theory also conceives and recognizes human resources as critical to the
    successful growth of an organization. The success of an establishment becomes
    a reality once there is a show of determination, commitment, persistence, and
    skillfulness, often acquired through training from the managers of the company.
    Such occasions would as well make possible the replacement of workers with another
    skilled worker in no time.


    ### Hard Model


    Unlike the soft model of Human Resource Management, the hard model is a traditional
    view of Human Resource Management with pressure from the side of management. This
    theory contends that liberating workers with excess immunity and freedom would
    result in low productivity and laziness. This model opposes the soft model in
    instances of worker liberty. There is stricter control of the environment by management,
    and it, in turn, strains the working atmosphere.


    The organization is more concerned with its growth while not being attentive to
    the work welfare of the workers. Moreover, there is an absence of skill as well
    as lacking teamwork since skill is devalued. As a result, competence is determined
    and forced by the company. The company’s management style remains rigid and could
    often be unyielding or not yielding enough.


    ## 1.3 Approaches to Human Resource Management


    Human Resource Management features several approaches. Each of the approaches
    embodies its own unique viewpoint, which is very well disputable.


    Some of the approaches to Human Resource Management are highlighted here:


    ### Management Approach


    The focal point of this approach is simply management. This looks at the managerial
    aspect of an organization and the workers therein. It also involves the overall
    outlook and supervision of the activities that ascertain the productivity of an
    organization. Essentially, the management approach convolves the idea of staff
    supervision, productivity check, as well as the welfare of the company at all
    levels.


    ### Strategic Approach


    The Strategic Human Resource Management approach entails the yield-ability of
    employees. The focus of this approach is fixated at employees’ problem-solving
    abilities and the ability to rise to the occasion. This approach notably commences
    directly from interviews. It is interview-focal as it looks to examine the worth
    of potential or actual employees and what they can offer to the collective productivity
    and growth of the organization. It is basically what employees have to offer.
    In cases where a company subscribes to the contingency theory, such a company
    would have to drill such an employee to adapt despite being unfit.

