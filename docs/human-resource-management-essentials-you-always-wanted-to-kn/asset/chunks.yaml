    a) It is how the company communicates its goals and subsequently makes sure the
    individual activities and outputs of each employee contribute to the organization’s
    overall vision and set goals.


    b) It is designed to motivate employees.


    c) It is necessary to review and reward excellence.


    d) It is the encouragement of self-discipline among stakeholders of the company
    or establishment


    e) It is characterized by the acronym SMART.


    5) Select the statement that is True.


    a) The performance management cycle is characterized by the five stages—using
    an acronym known as SMART.


    b) Information should be shared with employees that advise of the organizational
    happenings. Sharing information can be in the form of memos, reports, and at meetings.


    c) It is important for HR persons to take a direct stance with employees to ensure
    their compliance and commitment to the organization. Therefore, HR should curb
    suggestions and impose strict demands at all times.


    d) Performance management tries to distract the workforce by providing unclear
    expectations and difficult objectives for employees to prove their skills competencies.


