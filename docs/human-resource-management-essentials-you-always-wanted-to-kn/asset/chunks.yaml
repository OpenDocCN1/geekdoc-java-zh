    # Chapter 1: The Concept Of Human Resource Management


    Chapter one introduces Human Resource Management (HRM) as both a term that defines
    a management function and an operating department within an organization. The
    chapter outlines the progressive existence of HRM and recounts various perspectives,
    theories, and approaches to the concept. The purpose is to ensure the reader’s
    understanding of the definition, evolutionary progress, opposing viewpoints, basic
    functions, and challenges of Human Resource Management.


    Key learning objectives should include the reader’s understanding of the following:


    a) The nature and concerns of HRM


    b) How Human Resource Management evolved to what it is today


    c) The theories governing the principles of Human Resource Management


    d) The various approaches and their effect on the concept of Human Resource Management


    e) Why Human Resource Management is necessary but not compulsory


    f) Responsibilities and challenges for a human resource manager


    ![Image](images/image.png)


    Most modern organizations are victims of issues such as regulatory compliance,
    employee-underperformance, relatively low outputs, and many more. As a result,
    such organizations either become stagnant or witness a rapid decline in productivity.
    This decline fosters the purpose for which Human Resource Management (HRM) has
    either already been or should be established. Human Resource Management is consequently
    tasked with planning strategies to solve these problems.


    Human Resource Management is a description of formalities and established patterns
    targeted at creating problem-solving strategies for the progress of an organization.
    It is a simple scheme that employs policies, practices, and systems to close any
    unpromising gaps between the company, management, and staff. These impending gaps
    could be both abstract and concrete. However, the objective of HRM is to identify
    the gap(s) and implement the strategies that best impede the discord between the
    primary constituents of its purpose.


    HRM policies, practices, and systems are developed and implemented with a focus
    on three primary components:


    a) Company/Organization


    b) Management


    c) Staff/Employees


    ![A picture containing game Description automatically generated](images/HRM3.png)


    Extensively, the company includes commodified resources (i.e., an organizational
    commodity) for productivity. For many companies, one of the most abundant resources
    is humans. Thus, human resources become an essential element for productivity
    and subsequent organizational performance. Organizations that seek to effectively
    address regulatory compliance issues, employee-underperformance, low outputs,
    and other pain points, must first safeguard its vital resource—its employees.'
