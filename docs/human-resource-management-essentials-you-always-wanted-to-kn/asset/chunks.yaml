    This is the most common cause of conflict in any organization. It is this causative
    factor that makes it possible to assert that conflict in the workplace is inevitable.
    When individual objectives clash, it gives rise to a conflict in various dimensions.
    This is most common among organizational departments of equal category. For instance,
    if a group in an organization is tasked with a duty of ensuring legal compliance,
    members may each have ideas that disagree. As such, each of the group members
    will frown at the ideas of one another. At this point, such responsibility is
    halted because the beneficial head-start, which is a collective decision among
    the members, is missing.


    ### Absence of Recognition and Reward

    Money encourages people to work, but as Dale Carnegie opines, when an employee
    is duly recognized, he or she becomes very committed. The sort of conflict that
    arises in instances such as this is intraindividual conflict. It destabilizes
    an employee and boosts his mental laziness. This is simply because the employee’s
    initial worthy performance was not recognized. Such an employee feels rejected
    and resorts to low productivity. The conflict occurs within the individual and
    causes such individual to be sad or demotivated. No organization would want to
    house this sort of conflict because productivity from that angle will dwindle.
    If this is the case with half of a company’s employees, it suffices to say that
    such an organization is underperforming.


    ### Assigning Wrong Duty

    Assigning a role to the wrong employee is yet another causative factor of conflict.
    It permeates fear, inconsistency (if such an employee is performing well at all),
    and makes an employee feel unable.


    ### Absurd Role Description

    When there is no clarity in a role description, it is difficult for either an
    individual, a group, or an organization as a whole to perform without leading
    to a conflict.


    ### Poor Employee Development

    Poor employee development conflicts in terms of work performance. An employee
    who is not put through a developmental process or training would either not adapt
    in time or fall out. Intraindividual conflict is a serious conflict category suffered
    by several organizations and must be evaded.


    Other causative factors of conflict include:

    a) Incompliance with working terms

    b) Discrimination (e.g., gender, race, religion, education, language, role or
    position)

    c) Biased employee protection


    To sort either of these cases, a proper strategic plan must be developed on the
    basis of trial and error. Fixing errors make it quite easy for any organization
    to move on swiftly with the activities that lead to high yield.


    ## 5.5 Conflict Resolution Practices

    When a conflict is allowed accommodation in an organization, it results in a complete
    breakdown. For such reason, strategic plans to resolve these conflicts must be
    in place. An employer in an organization should consider defining or following
    the tested strategies outlined below. Moreover, it is recommendable to assign
    this as a responsibility to the management department for more brilliant strategy
    implementation.


    ### Erect a Team to Source for Cause

    If the involved parties - individual or organization, are within the company,
    set up a team to source for the cause of the conflict. This team could otherwise
    be called ‘strategist,’ and their near simple task is to find the cause. The difficulty
    in sorting a cause could be elaborate or simple, depending on the conflicting
    factors and conflicting parties involved. The team should set into the midst of
    the conflict and make inquiries. It is through these inquiries that the strategists
    would get access to the minds of the conflicting bodies. Before this, such a team
    must be well-informed of the duty or responsibility leading to the conflict. For
    example, if it is an opposition between two groups in an organization, their tasks
    must be reviewed to better understand the complaints each party will give. In
    cases of intraindividual conflict, a similar approach must be followed.


    ### Invite the Conflicting Parties

    This should follow immediately after the discovery of the conflict cause. Questioning
    parties in their task places are not enough. This time around, be it a group of
    individuals or an individual, they must be tabled, in most cases, with a disciplinary
    committee. At this point, the aim should not be to criticize but to detect and
    think of a solution.


    ### Question the Situation

    The conflicting employees or management must be questioned once again. The focal
    point should be on the following:

    a) Apportioned task

    b) Individual objectives

    c) Personal interest

    d) Individual recognition in the organization

    e) Personal clashes

    f) Initial discord

    g) The skillfulness of individual(s) for such task


    The problem is likely to have a root in any of the above things. Get the involved
    parties to see their errors and make no mistake of supporting either party’s personal
    interests or individual opinions. Do not be judgmental and avoid saying things
    that threaten the skillfulness of such individuals.


    ### Demand Suggestions

    Most organizations skip this stage of conflict management. The suggestions here
    must be those of the opposition. However, it does not mean HRM or management should
    implement their suggestions because it may end up not being favorable to both
    sides. However, requiring input from various sides shows a sense of commitment
    to resolution. Additionally, allowing either party to propose potential resolutions
    builds the integrity and trust that each party has in the process. Oftentimes,
    conflict arises because one party does not believe that the other party values
    their opinion or has listened to them with the intent of understanding. This calms
    the parties’ defenses as they are allowed to express their discord and possible
    solutions. Strategists or human resource persons should be clear to explain that
    although suggestions are being taken, there is no guarantee that a particular
    suggestion would be implemented.


    ### Review the Cause

    Reviewing the sorted problem may or may not be done by a team of strategists.
    However, it is ideal to run this as a team of strategists in order for a more
    promising idea to be generated. While reviewing, there should be exceptional attention
    paid to the causes of the conflict rather than a solution. The reason is that
    knowing the problem leads to a solution. For example, sorting a conflict between
    two individuals with different objectives towards a similar objective would require
    that either both individuals be relieved of the task or both provided with specific
    duties in that same task. Further, knowing the cause will undoubtedly allow strategists
    to ultimately form solutions that proactively prevent further occurrences of the
    same or similar nature.


    ### Implement

    Implementing a resolution is the easiest of the tasks. This takes place either
    when both parties may have been relieved of the task causing the conflict or replaced.
    Whether a new individual or a team is introduced or initial parties are retained,
    the new strategy is what should be implemented. Implementing an old strategy with
    a new team may work, but the chances that the initial cause of the conflict will
    arise again is 50/50. The chances are neither promising nor worth a trial without
    sharp scrutiny and study of the newly tasked individual(s).


    ### Monitor the New Policy and Make Amends

    There must be a follow up of the new planned strategy. Keep an eye on the new
    policy and the individuals working with it.


    ## Chapter Summary

    a) Conflict management is a reactive measure that helps to identify the source
    of a problem and identify a solution.

    b) Conflict is classified based on result, involvement, scope, or strategy. Each
    of these classes of conflict requires a particular approach in any attempt to
    resolve.

    c) Conflict management approaches include competing, accommodating, avoiding,
    collaborating, and compromising.

