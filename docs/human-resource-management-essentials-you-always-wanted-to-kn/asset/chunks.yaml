    # 第 2 章：绩效管理策略


    本章解释了绩效管理，并强调了七种实施策略。人力资源专业人员应该整合这些策略，以提高任何组织内的有效性。本章通过识别各种策略的用途、有效的方法以及衡量绩效的通用循环来阐述绩效管理。


    在完成本章后，读者应该能够评估以下内容：


    a) 整合七种绩效管理策略的潜在有效性

    b) 什么使得绩效管理策略具有相关性以及采取策略的必要性

    c) 人力资源人员如何构建策略以实现预期目标

    d) 绩效循环背后的目的以及它如何塑造公司的预期


    ![Image](img/image-1.png)


    在驱动人力资源时，将工作氛围转化为一种能够吸引投入并提高员工表现的火花仍然是基本目标。绩效取决于员工作为一个团队或个人为提高生产力所付的投入程度。绩效管理是组织确保每位员工的个人活动和输出对组织整体目标贡献的方式。人力资源人员或团队会以功绩为目标。为了实现这种结果，绩效必须良好。无论组织在日常业务中采用什么种理论方法，最终重要的是导致生产力的集体绩效。


    倾向于进行人力资源管理的组织仅依赖于管理其劳动力或人类。这直接与某些机构内部为了实现既定目标而利用的各种绩效管理策略相关。其理念既要激励员工，又要制定符合员工道德和法律原则的政策。


    在绩效管理策略问题上，还没有传统上接受的形式。然而，随着时间的推移，已经引入了一些基于测试的系统性计划-行动方案。


    以下是用于增强和完善人力资源绩效管理的七种策略性举措：


    ### 建立并鼓励透明度


    Moore (1995) 建议透明度是过程的一个关键部分。公共经理被要求不断告知和教育其利益相关者，超出其信息披露的法律义务。因此，在存在透明度的情况下，有助于管理系统。HR
    经理预计在适用情况下向董事会（或高层执行领导）传达对透明度的需求，并以身作则。正如 Moore 的思想所言，超越义务告知利益相关者以提高生产力。


    ### 设计一个清晰透明的模型


    采用生动的人力资源开发管理模型是至关重要的。当前景模糊时，组织的其他经理和副经理将很难应对。请记住，清晰透明的模型是整个人力资源开发过程的一个关键方面。此外，尽管模型清晰透明，也要强调并重申愿景中的成就。创造一个让员工和经理可以就建模提问并反复提问题的途径。无论手中是什么模型，它必须让即使是最低层别的员工也能听懂。


    ### 鼓励频繁评估


    鼓励员工评估自己的活动是一项出色的绩效管理策略。这为员工提供了空间，让他们发现自己是否在系统中的表现良好。这种策略鼓励员工甚至经理保持专注和纪律，以匹配所需的工作生产力。其核心思想是，没有员工希望在任何机构中成为评分最低的。


    ### 奖励卓越、投入和纪律


    Coff 和 Kryscynski 等学者一直强调奖励的重要性。最近的研究进一步声称，奖励作为任何组织中实施的一项系统，对组织的增长非常有效。此此，Alpkan
    等人 (2010) 认为“持续的奖励制度可以激励企业家不断地建立新想法，培养创造力以及对创新的投入。”奖励努力工作是一项基本的绩效管理策略，适用于任何追求更高产出的组织。


    ### 保持沟通活跃


    Mark Amele (TrainingZone) 写过的一篇文章指出，沟通是必要的，因为误解可能导致影响公司发展的错误。这就是为什么有时不宜由于其僵化而采用人力资源管理的硬性模型。必须通过与员工频繁互动来保持沟通活跃。如果可能，应该将每个部门的目标和成就告知其他人。你永远不知道某个特定团队可能会从另一个团队中学到，通过弥补另一个团队在运营中最初遭受的缺陷从而表现得更好。


    ### 通知并带领团队


