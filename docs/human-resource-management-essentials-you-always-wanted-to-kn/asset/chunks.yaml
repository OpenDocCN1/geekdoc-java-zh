    On the contrary, affective conflict involves individuals’ relationships. This
    could be an emotional or concrete (physical) relationship. It equally involves
    a group of workforces in an organization and an organization as a whole. It thus
    suffices to say that an effective conflict extends from personal relationship
    to group relationship on to the organization level.


    Between substantive and affective conflicts based on scope, substantive is the
    most endurable. Substantive conflict is all about organizational productivity,
    and it embodies an achievable goal. Whereas effective conflict is unendurable,
    costly, and can prevent an establishment from reaching a desired goal.


    ### 5.2.4 Conflict Based on Strategy


    On the basis of strategy, conflict ensues on plans towards achieving a goal. Strategized
    conflict mostly comprises organizations. In rare cases, however, it involves individuals
    and groups of a particular organization. It can only be said to involve a party
    or parties of the same organization when such party or parties are tasked with
    objectives that must be sorted either on a competitive basis or cooperative basis.
    In essence, conflict based on strategy could arise either as a competition or
    a joint force towards achieving a goal.


    Conceptually, conflict is said to be competitive when varying organizations or
    individuals tasked with the same objectives (the goal of such objectives would
    be on who gets there first or who records the better success) battle it out to
    see who leads at the end of the day. In a competitive conflict, what matters is
    a ‘win.’ Every involved party (organizational or individual), therefore, employs
    a strategy - rational or irrational, to gain an advantage over the other competitor.
    In the process, either party develops some sort of unconscious dislike for the
    other. By ‘unconscious,’ it means that either of the parties may not realize the
    hatred towards the other organization or group.


    Conflict on a cooperative basis can also be referred to as collaborative conflict.
    It is a conflict taking place among establishments of the same objectives, same
    goal, and equal target. These organizations may operate as a merger and would
    suffer losses together as well as gain together. Despite being on the same course
    and having a similar pursuit, there is bound to the opposition in the long run.


    Conclusively, neither a competitive nor a cooperative conflict help in the growth
    of organizations. Both leave negative impacts but promote competitiveness, which
    may either be healthy or unhealthy. However, a cooperative conflict is most recognized
    and practiced by several organizations in order to declare a desirable competitive
    ground and freedom.


    ### 5.3 Approaches to Conflict Management


    After the transition from pre-industrialization to industrialization, organizational
    management faced yet another difficulty, which was conflict. However, several
    attempts have been made by managerial professionals to curb the problem. Initially
    planned strategies showed no positives until the discovery of the five-approach
    resolution techniques to conflict spearheaded in the 1970s. The reputable and
    intellectual names involved in the breakthrough to conflict management are Kenneth
    Thomas alongside Ralph Kilmann. The approach is designed with competition, accommodation,
    avoidance, collaboration, and compromise as cornerstones.


    Conflict is suffered by several organizations today. This is as a result of its
    inevitable but costly avoidable nature. As a scope, it thrives on organizational
    destruction rather than organizational development. It affects multiple productive
    factors of any organization, including human resource development.


    To prevent conflict from becoming the order in an organization, *here are the
    universally accepted approaches to adopt.*


    #### Competing


    This approach is such that triggers ‘unconscious hatred’ among competitors or
    parties. The scope is that best is the victor, and as such, every party wants
    to be the victor. This is not genuinely possible in the sense that in any event
    throttled by competitiveness, only the best wins. This approach requires enough
    resources and intelligence on the side of any competitor with the intent to win.
    Involved parties often employ strategies as rational and as irrational as possible
    in a bid to stay above. As such, the competition becomes burdensome to the extent
    that competitors have to lose to stay up. It mimics the positivity in sports like
    encouraging for quick thinking, faster implementations, better productivity, and
    ever-ready actions, among others.


    #### Accommodating


    This approach opposes competing in the sense that it functions as a subordinating
    merger. The idea is that, as a competitor or involved party in the conflict, one
    would dissolve by agreeing to circumvent the target for the opposition. It is
    not the most promising approach to conflict management; however, it encourages
    unity. But then, it might completely wipe off participation in the program. Studies
    have found that it is not the most actively practiced approach as it completely
    or partly puts one of the involved parties aside.


    #### Avoiding


    The concept here is simple. It is almost synonymous with the competing approach.
    However, the difference is that this approach surrenders to the other party. This
    may either be willingly or as a result of excessive pressure that the withdrawing
    party cannot resist. It is not very healthy as it discourages competitiveness
    and would often result in extreme domination by one party. In cases where a conflict
    involves two teams or groups in an organization, it might lead to the exemption
    of the other party. In an organizational basis, the competitive prowess and presence
    of a company may become desolate.


    #### Collaborating


    This implies the working together of conflicting individuals, groups, or organizations
    towards achieving a goal. This approach sparks some kind of unilateral operations
    whereby every conflicting party is subject to one another. The win of party `X`
    is a win of party `Y`, and the loss of party `Y` is a loss of party `X`. In essence,
    it is the pulling together of resources, in some cases, and following an informed
    course that is favorable to everyone. Moreover, for any resolution, the strategized
    resolving measures must be in line with the policies, beliefs, and interests of
    conflicting parties. Finally, it ensures a resolution that favors both parties.


    #### Compromising


    This is more like a medial alternative for avoiding and competing approaches.
    It draws some aspects from the mentioned approaches, and both conflicting parties
    contribute to the in-place plans towards resolving the conflict at hand.


