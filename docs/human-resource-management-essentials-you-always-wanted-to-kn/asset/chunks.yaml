    a) 竞争、分配错误职责、指派团队寻找原因、质询状况

    b) 竞争、接纳、回避、协作与妥协

    c) 竞争、终止、实施、邀请冲突双方进行讨论

    d) 竞争、适应、回避、沟通与妥协


