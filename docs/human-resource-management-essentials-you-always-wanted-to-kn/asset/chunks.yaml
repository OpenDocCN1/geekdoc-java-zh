    ## Quiz 10


    1) People development is implicitly an act of tuning employees to become ____________
    better.


    a) psychologically


    b) emotionally


    c) collectively


    d) individually


    2) Which is not a focal area of people development?


    a) Innovativeness


    b) Skills improvement


    c) Quicker adaptation


    d) Performance excellence


    e) None of the above


    3) One view of people development is that the development system benefits _________
    rather than ___________. An opposing view suggests that it benefits both.


    a) employees, managers


    b) managers, employees


    c) employees, the employer


    d) the employer, employees


    4) Most employees are naturally gifted with inherit innate abilities that allow
    them to impact an organization, its productivity and its growth significantly.
    [True or False]


    a) True


    b) False


    5) _________ involves the psychology study of an individual. And, for such a study
    to be fruitful, there must be a closeness that will allow the HR person even to
    understand what bothers an employee.


    a) Managing


    b) Coaching


    c) Mentoring


    d) Employer-employee relationship


    **Solutions to the above questions can be downloaded from the** [Online Resources](http://www.vibrantpublishers.com)
    **section of this book.**


