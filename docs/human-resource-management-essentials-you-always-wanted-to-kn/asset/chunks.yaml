    # Chapter 3: Legal And Regulatory Compliance


    A company will likely suffer legal repercussions if it does not practice policies
    that comply with the laws of the jurisdiction where it is located. This chapter
    explains the essence of legal and regulatory compliance.


    It is broken down into sections that helps readers to determine the following:


    a) How HRM facilitates and enforces regulatory compliance in an organization


    b) Why a company must be compliant with the law of a jurisdiction and the general
    law


    c) Potential implications of failure to maintain legal and regulatory compliance
    requirements


    d) Some major compliance laws applicable to all organizations


    ![Image](images/image-1.png)


    Legal and regulatory compliance is now being recognized in several organizations
    for the sake of punishment evasion. The general idea of legal and regulatory compliance
    is protection. The protection applies to all faculties of an organization, including
    its employees and clientele. Legal compliance is the adherence to legal specifications
    that concern any organization.


    An adequately strategized legal and regulatory compliance practice would leave
    a positive impact on the dealings of an organization. On the other hand, disobeying
    the concept will attract punishment. With the presence of a legal compliance concept,
    there is a high level of trust among business partners and even clients, which
    ensures that profit remains on a steady rise. For instance, healthcare and social
    networking companies are known to house a high amount of user data. Such data
    must not be breached, traded, or used for any commercial purpose without the user’s
    consent. When an organization wins the trust of the client, it becomes easier
    to do business. Meanwhile, if a user reports a data breach, such a company will
    suffer legal ramifications.


    Furthermore, the concept of legal and regulatory compliance couples several difficulties.
    An unavoidable difficulty is its constant financial requirements. To comply with
    legal setups means parting with cash. To keep up, an organization must employ
    extraordinary measures. Failure to comply with the outlined legal must-follow
    measures will result in punishment ranging from fines, production resources seizure,
    closure, and more.


    ![A screenshot of a cell phone Description automatically generated](images/HRM13.jpeg)


    ## 3.1\. Roles of HRM in Legal and Regulatory Compliance


    In the words of Koziarz, *“… compliance has created a level playing field that
    all organizations are expected to meet when it comes to protecting sensitive data.”*
    This highlights the provisions accompanying the concept of legal compliance for
    modern organizations to follow. It has to do with data protection, employee welfare
    management, and the imposition of legal policies that do not breach the outstanding
    employment conditions. Koziarz added that *“… managing compliance takes resources,
    but it is nowhere near as expensive as the costs associated with a breach.”* It
    might consume resources to be compliant with the law, but going against any order
    would be more costly.


    Human Resource Management is a necessary department in modern organizations. The
    role of HRM in the aspect of legal and regulatory compliance stretches to the
    adherence to the regulations governing every aspect of employment. The goal is
    to serve as a connection between the employer-employee relationship and the law
    and to ensure that all company and legal policies align. Below are the roles of
    Human Resource Management concerning regulatory compliance.


    ### Equilibration of Internal and External Policies


    This implies that the human resource person or management team must ensure matching
    policies. Any policy introduced in the organization must be of a standard with
    that of the law and must favor both employer and employee. For this to be the
    case, the human resource person or department must have an understanding of the
    legal and regulatory laws. When the internal policies conflict with the external
    policies, it becomes a problem. It is worse when the organization proves difficult
    instead of making the internal policy correspond with that of the law. For this
    to be effective, Human Resource Management must identify and sort such policies.


    ### Keep an Organization Compliant


    Aspects of the organization, such as maintenance compliance like electricity,
    water, environmental hygiene, and gas, require specific standards. If the standard
    of such components within the organization do not conform with the law, the organization
    will suffer. The law demands that certain hazardous equipment, activities, and
    the atmosphere remain in good condition. Such conditions must be conducive enough
    for both employees and even clients to conduct transactions or to operate.'
