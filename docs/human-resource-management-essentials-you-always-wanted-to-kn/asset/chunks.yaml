    “组织发展”一术语是指用于帮助组织发展的科学方法和过程。它是一种实现目标的方法论方法，涉及公司的所有方面。它指的是组织各项职能的渐进且实际的发展，并寻求识别哪些是有效的，哪些是无效的。这些职能可能包括员工绩效、组织对法律的合性、内部政策对组织的有效性以及其整体生产力。


    人力资源管理中的组织发展理念侧重于能够开发可用人力资源的变革。它旨在用可以在组织劳动力中有效的新政策来取代旧政策。这通常以非常系统化且有组织的模式进行，由人力资源人员团队或具有远见的劳动力雇主设计实施。


    人力资源管理中组织发展的意识形态强调人力资源开发。这与这一事实有关：人力资源是任何组织生产能力中不可或缺的方面。简而言之，人力资源是任何组织的支柱。由于人力资源对生产力具有重要性，它获得了管理中组织发展理念的认可。没有了决定产出的生产力，组织将无法维持其有效执行和生产的能力。此外，技能低或效率低下的劳动力将阻碍企业的增长，因此，人力资源人员必须采用系统性的标准来协调各项。


    ## 4.1. 组织发展的概念


    组织发展（OD）的概念是试图改进或更好地发展组织的实务方法和政策标准或运行模式的认真尝试。它通过采用更复杂的方法，并依靠理论或模型以及一系列研究来运作。整个过程在应用于组织以获得结果之前已经经过了周密的规划和设计。


    Cummings 和 Worley (1997, p.2) 认为“组织发展是将行为科学知识系统性地应用到对组织策略、结构和过程的计划开发和强化中，以提高组织的有效性。”这一定义强调了，组织发展围绕着系统性的计划开发展开，以识别、解决、产生和实施更有效的策略来解决问题。


    同样地，Burke (1982) 断言道“组织发展是通过利用行为科学、技术、研究和理论，对组织文化进行的计划性变革过程。”与 Cummings 和 Worley
    一样，整个组织发展的概念依赖于一个系统，并且具有程序性。这意味着所有的行动都是经过精心设计和执行的，以找到问题。一旦问题被识别出来，由于它已经被充分识别，就会变得容易解决。


    在强调主要术语之前，考虑 Beckhard 对组织发展概念的观点。Beckhard (1969, p.9) 声称“组织发展是一项计划的、全有范围且从顶层管理的努力，通过利用行为科学知识对组织过程进行计划干预，以提高组织的有效性和健康。”


    在所有这些定义中都有一些共同的表达。这些术语恰好对组织发展的概念提供了更全面的描述。让我们识别这些术语以进一步分解组织发展的描述。上述定义中的共同术语包括：


    a) 科学

    b) 计划

    c) 系统

    d) 过程

    e) 开发

    f) 变革

    g) 有效性


    仔细观察识别出的核心术语，你会发现它们都有共同点。这进一步证明了组织发展的概念是纯科学的。如果不在科学措施之外进行计划，结果可能不会符合预期。


    ## 4.2. 人力资源管理发展的目标


    人力资源管理发展的目标随组织而异。每个组织都有自己的目标以及发展对他们之所以重要的原因。记住，人力资源管理发展的概念依赖于理念的有效性以及为了在组织中获得更好结果而对其采取的科学方法。


    在大多数情况下，这种理念与管理手段密切相关。这是一种积累，并尝试解决问题、提议并启动一种导致预期的方法。其运作方式非常简单：首先制定一个计划，并告知组织必要的设施。让每个人都准备好或跟上一个创新理念，该理念将首先以试错模式进行使用。在此过程中，重点转移到做出更清晰的定义，似乎是为了查明计划中是否存在组织可以消除或应对的缺陷。这是诊断阶段，组织中的一切都是纯粹的实验性的。在这一实验性方法期间，提取出理念，而这些理念在组织中可能非常有效。


    由于发展策略的目标是识别并使用有效的方法，因此提取出的理念将在某些职能中接受测试，并预期它们是有效的。通常情况下，一个策略良好且开发良好的发展结构是起作用的。


    竞争性人力资源管理可以发现这一点并将其应用于组织中。此外，不同的策略适用于不同的组织，这是由于公司的整体运营情况、现行政策和理论方法。对于任何才华横溢的人力资源管理团队来说，这并不是不可实现的目标。


    尽管如此，在企业内部人力资源开发产生效果后，存在着基本的预期。主要是，这些是管理发展的目标。以下是企业中人力资源管理发展的目标和目的。


    ### 4.2.1. 增加利润


    利润最大化仍然任何开发活动中不可否认的概念。正如之前确定的，它涉及鼓励增加利润的方法。这考虑了几种策略，如员工培训、政策审查、法律和法规合规以及员工激励。这些有助于公司实现利润最大化并维持经营。


    ### 4.2.2. 建立组织的竞争优势


    Dale S. Beach 将组织发展视为“一种复杂的教育策略，旨在通过顾问利用理论和技术进行计划干预，以提高组织的有效性和财富。”正如在这里看到的，组织发展的首要目标是有效性和财富。财富的理念唤醒了这种感觉：公司通过尝试启动增加其竞争机会的措施来增加利润，而这是任何企业的基础。


    ### 增强沟通


