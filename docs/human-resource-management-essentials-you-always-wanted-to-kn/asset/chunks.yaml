    # 第 1 章：人力资源管理概念


    第一章介绍了人力资源管理（`HRM`），它既是一个定义管理职的术语，也是组织内部的一个运营部门。本章概述了 `HRM` 的演进过程，并叙述了各种观点、理论和方法。其目的是确保读者理解其定义和挑战。


    主要学习目标应包括读者对以下内容的理解：


    - `HRM` 的性质与关注点

    - `HRM` 如何演变成今天的模样

    - 治理 `HRM` 的理论

    - 各种方法及其对 `HRM` 的影响

    - 为什么 `HRM` 是必要的但并非强制的

    - 人力资源经理的职责与挑战


    ![Image](img/image.png)


    大多数现代组织都是合规性问题、员工表现不佳、产出低等许多问题的受害者。结果，这些组织要么陷入停滞，要么见证了生产力的快速下降。这种下降促成了人力资源管理（`HRM`）已经建立或本应该建立的目的。


    广义上，公司包含了商品化的资源（即组织商品）以提高生产力。对于许多公司来说，最丰富的资源之一就是人。因此，人力资源成为生产力以及后续组织绩效的关键要素。寻求有效解决合规性问题、员工表现不佳、产出低及其他痛点的组织，必须首先保护其核心资源——员工。


