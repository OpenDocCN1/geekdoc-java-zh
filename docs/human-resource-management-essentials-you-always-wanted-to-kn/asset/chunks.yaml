    # Chapter 7: Concept Of IT In HRM


    Information Technology (IT) is a necessary construct in any organization.


    Chapter seven highlights the following:


    a) The effect of IT on HRM

    b) Disadvantages of IT in HRM

    c) The relevance of IT in HRM and the need to employ IT systems in an organization

    d) Main challenges of IT in HRM


    ![Image](images/image-1.png)


    The need for technology in any organization should not be ignored. Although some
    fear that technology will promote the introduction of robots as a workforce, humans
    are still filling positions. Several organizations have admitted the importance
    of information technology (IT) as it aids in achieving goals near perfectly. Before
    now, the manual forms of operations made things difficult to accomplish. However,
    the basics of information technology, being automatic, present hefty and time-consuming
    tasks in an optimized and ordered manner.


    It will conventionally take days, if not weeks, to sort out minor things like
    an updated regulatory policy for organizational compliance. However, the advertency
    of Human Resource Management to technology could fix this within minutes of going
    online and retrieving an updated regulatory policy data. Not only does the mode
    of retrieval appear easy, understanding the policy becomes easier as a human resource
    person may not have to contact the governing agencies in person for more enlightenment
    on specific policies.


    ### Information Technology and HRM


    Human Resource Management is tasked with responsibilities including employee development,
    recruitment of skilled employees, training, ensuring legal compliance, encouraging
    employees at work, formulating new policies, and more. All of these functions
    can now be rendered effortlessly with the aid of technology, which couples several
    predesigned instructions that make it easier for large tasks to be cut; needless
    to say, an aspect like payroll management in an organization. A larger percentage
    of organizations have switched to automatic or electronic payroll systems, which
    feature accuracy and transparency in accountability.


    With the introduction of IT in Human Resource Management, there is now a ‘responsibility
    shift.’ Human Resource Management barely has to flip through pages to review employee
    performance and also do not pass through hassles to obtain updated regulatory
    policies and principles, which are then integrated into the managerial system
    of an organization. Instead of all these, management can make strategic planning
    a focal point to keep competition alive and healthy.


    ### Disadvantage of IT in HRM


    No study doubts the relevance of technology in Human Resource Management. However,
    there are doubts by a few studies on the adverse effects of technology. For instance,
    an organization of 80 employees is estimated to have at least one human resource
    person. Going by this estimate, in an organization of 150 employees, the number
    will increase to at least two human resource persons, and this will continue to
    increase. Usually, larger organizations should have a number of human resource
    persons enough to be called a team of strategists. However, technology cuts down
    the number by more than half as only a few persons can manage a large group with
    the proper technology. Here are the primary disadvantages of IT in HRM.


    a) Risk of unemployment of HR professionals

    b) A smaller number of human resource persons in an organization

    c) Unexpected employee data breach/crash

    d) Lazy mindedness of Human Resource Management

    e) Over-dependence on machines


    This extends to employees in an organization. The impact, just as in Human Resource
    Management, negatively affects employees. Rather than being judged by humans,
    employees risk being judged or assessed by machines, which will not be effective
    in the emotional aspect. Some of the notable effects on technology on employees
    include unemployment, lesser recognition, incorrect/undefining scores from machines,
    and a few more to mention. All in all, depending on how technology is managed
    in an organization, it makes an excellent addition to the company.


    ## 7.1 Importance of IT in HRM


    The mention of technology in Human Resource Management as a means for flexibility
    draws immediate attention. A difficult task can be tiring no matter the pay involved,
    but when the job is flexible, one would want to do more. This is the general benefit
    of technology in Human Resource Management that many human resource persons find
    alluring.


    Technology gives management a sense of swiftness. It keeps records of activities,
    and most advantageous, it makes them easily accessible. In every computer software,
    there is a `search` feature provided. This feature makes it easier to quickly
    access a given file no matter its location. Sometimes it is necessary to instruct
    a computer on what result to present. Comparing this to a non-technology-based
    Human Resource Management, searching for a particular file would require flipping
    through pages which consumes time and energy.


    ### Absolute Focus on Management


    With technology, the focal point of Human Resource Management will be on strategic
    planning. Recall that the relevance of HR is essentially on management. However,
    it is often tricky as the HR department would have to be attentive to all aspects
    of the company at the same time. Simply, this means that the managerial team of
    an organization will have to worry less about several other things and focus more
    on the technical area of development.


    ### Automatically Grade Employees

