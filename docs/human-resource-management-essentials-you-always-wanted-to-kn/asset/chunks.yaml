    # Chapter 6: Payroll And Compensation


    The focus for this chapter is payroll and compensation. It provides a broad introduction
    to the concepts the relevance they have in an organization.


    Readers should be able to determine the following upon completing the chapter:


    a) Different payroll methods

    b) Various types of payroll systems

    c) Types of compensation practiced universally by different organizations

    d) The strategic plan behind implementing a working payroll and compensation plan
    in a company

    e) How payroll and compensation benefit the competence level of a company

    f) The various forms of compensation practiced universally by organizations


    ![Image](images/image-1.png)


    Payroll could be characterized by two definitions or functions. The first is that
    it is simply a collection of staff-workers alongside their salaries. It lists
    out the staff in an organization and also lists out the salary or wages. The amount
    of money paid either daily, weekly, or monthly, which is the salary or wage that
    may have been agreed during negotiations. That is, either a company pays what
    is in line with their policy or what an individual requires. The second is that
    payroll refers to the Human Resource Management tasked with the responsibility
    of administering and distributing money to the employees of an organization. Apart
    from this, Human Resource Management also determines what pay fits a job role
    or an employee.


    Compensation, on the other hand, is a different terminology. It is merely an added
    benefit and may always come as a reparation, brilliance in performance, as a reward,
    or as payment for relief. It has nothing to do with salary and is often not negotiated
    as salary and wages unless it is a fixed compensation. Moreover, compensation
    is not something being debated about. It could be willful on the grounds of merit
    or worthiness. Compensation can be classified as a reward. As a reward, it is
    a suitable method of convincing a highly skilled employee to stay committed and
    loyal to the organization.


    Placing these two terms as concepts side by side, it suffices to say that the
    most necessary of the two is payroll. Compensation, however, can be necessary
    when it is fixed and not a variable. A variable compensation does not require
    a group of human resource managers to strike a strategic plan aimed at generating
    the right decision, but a fixed compensation does. Compensation, in general, requires
    reviews of some sort and may or may not be uncalled-for. On the other hand, when
    a seasoned payment (wages or salary) exceeds agreements without the knowledge
    of the employee, it is believed to be a compensation. This is so because the employee
    is not initially aware of the additional payments made.


    It is a good practice for organizations to have a vibrant Human Resource Management
    department. The department should be able to control, administer, determine, and
    decide on an effective payroll structure. It must be such that it does not only
    agree with the unique policies of the organization but that it is capable of engineering
    the functionality of both the employees and the organization.


    ## 6.1. Concept of Payroll and Compensation


    The concept of payroll is a little broader than it appears. Conventionally, it
    is known in any organization to either be the enlisted and attributed pay to be
    made to employees or as the Human Resource Management team that administers the
    payment. Payroll is practically what lures highly-skilled hands and brains. Moreover,
    since it refers to salaries and wages, it has a standardized level that regulatorily
    cannot be decreased or exceeded unless on agreement. Further, salary or wages,
    when not paid up to what the working conditions entail, become a legally noncompliant
    act that may result in costly payouts for any organization.


    ### Methods of Payroll


    * `Wages`: This method of payroll is commonly practiced in organizations situated
    in developed countries. It comes with several advantages for the employee, such
    as not working beyond the agreed time. Also, employers would not prefer to keep
    hourly paid staff for an extended time as it will require more money to be paid
    to compensate for the additional hours.


    * `Salary`: This salary method is prevalent in developing and under-developing
    countries. It is a cheaper method than the wages payroll method, and the pay is
    usually not significant, in most cases. It may not be the best, but some employees
    definitely love this as a lump sum would be paid at once rather than a broken
    pay.


    * `Commission`: This method, unlike the salary and wages method, does not tie
    down an individual to a company. It is often contractual and packages lots of
    disadvantages. One such disadvantage is job security, which is seldom guaranteed.


    ### Types of Payroll Systems


    There are primarily four types of payroll systems. They include:


    #### Internal Payroll System


    Here, payments are managed within the organization by an individual or a group
    of workers. The individual or group is tasked with keeping records, and this may
    be done either manually or electronically. It is best practiced in smaller organizations.


    #### External Payroll System


    This is the opposite of the internal payroll system. An organization does not
    have full control wages and salary management for its employees. The external
    body is usually a licensed or authorized agency that takes an agreed percentage
    at the time of making payments. The chances that salary payment will become problematic
    is very low in this system.


    #### Payroll Professional


    A professional may be hired to overlook the employees’ payments in an organization.
    He functions as an external body unless he is initially part of the company. Most
    organizations with an average number of employees practice this system.


    #### Managerial Electronic System


    This can also be called machine management. The accuracy of this system is high.
    However, humans are still required to maintain the servers, review, and modify
    the system from time to time.

