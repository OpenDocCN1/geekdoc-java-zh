    ## 1.6 人力资源管理面临的挑战


    人力资源管理面临着需要心理素质才能解决的问题。由于这些挑战中的大多数是不可预测的，因此处理这些情况可能具有挑战性。此外，某些决策可能极大地帮助公司，也可能对其造成不利影响。人力资源经理并不欢迎错误的决策，这意味着他们有时必须处理意外和问题，并确定其发生的概率。


    人力资源管理面临的一些挑战包括：


    ### 雇主与员工关系


    在雇主和员工之间建立亲密的关系是人力资源经理面临的问题之一。有时，人力资源经理可能需要辩护并更倾向于员工的行为或观点，即使在员工表现出低生产率的情况下。这种生产率低可能是由于非人力资源的缺乏或可用性有限。人力资源经理可能还必须保护遭受严酷、非法、暴力或其他不良工作条件的员工。有时，人力资源经理并不知道这些情况，但缓解威胁或不适局面，然后确定防止未来再次发生的解决方案始终是最佳决定。


    要管理那些涉及个人性格、教养、宗教信仰、情感以及其他定义员工身份的非实质特征的行为是困难的。这些抽象因素往往导致雇主无法确定员工的期望或愿望。人力资源经理的任务是帮助在这些无形特征之间建立桥梁，并利用它们来巩固强大且可靠的雇主与员工关系，使双方受益。这是具有挑战性的，因为人力资源经理在过程中保持公正的同时，试图为双方提供理由。在雇主采取专横的情况下，会影响组织，因为员工将失去适当的鼓励。这时，就需要人力资源经理来补偿这种情况，并激发员工的“工作就绪”因素。


    ### 生产率


    组织整体生产率的某些要素归功于人力资源经理的效率。人力资源经理必须不断做出决策和重大建议，以防止公司以更快或更慢的速度退。这可能包括人事建议、政策建议或实施有助于提高生产率的特定系统。


    公司的表现可能落在人力资源人员的肩上，无论是失败还是成功都会吸引所有人的目光来检查这一影响性角色。


    ### 适应变化


    偶尔，机构会见证巨大的创新。由于世界增长速度越来越快，这些创新通常是技术性的创新和进步。这种快速增长可能会带来策略制定上的困难，因为团队需要快速适应趋势。如果不能适应并良好地适应，人力资源经理可能会被认为缺乏才华或活力。人力资源经理或团队必须准备好在变革管理中发挥领导作用，并且完全能够制定有效策略以将所有其他团队和个人纳入其中。


    ### 处理工会事务


    当员工觉得其工作条件、环境或待遇不公时，他们可能会选择集体行动，组建或加入工会。工会随后成为这些员工的资源，使他们拥有集体发声权，代表或代表他们反对雇主。工会旨在代表成员的利益，并帮助解决员工与雇主之间出现的问题。


    并非所有组织都有工会劳动力或工会化的员工队伍。在由工会代表员工的公司中，处理疑虑有非常具体的流程和规则。通常，会出现公司的决策与员工需求冲突的情况。员工可能会寻求其工会代表的咨询或指导，以帮助与雇主进行对话。人力资源人员最常参与其中，并且必须运用极强的沟通、领导、倾听以及谈判和调解技巧来处理这种情况。这些人才对于确保过程的专业性并保证获得更好的解决结果至关重要。人力资源经理应该以高智商处理情况，确保充分理解员工的观点和工会代表的影响。人力资源经理应避免做出可能在财务和法律领域对公司造成巨大损失的话语或决策。


    ![一张手机屏幕截图，描述由自动生成](img/HRM11.jpeg)


    ### 选择最佳员工


    为工作选择最合适的人通常具有挑战性。当许多人带着几乎相似的资和经验申请时，很难确定谁更适合公司。在这种情况下，人力资源人员使用一系列路线图来帮助确定行动方案。这并不是一蹴而就的，但通过勤奋的招聘和评估努力，为职位选择最合适的人是可以完全行的。路线图从招聘工作开始，到将最合格的人安排上工作结束。


    ### 开发敏捷的工作流和有利的工作环境


    必要营造一种足以让员工感到安全、高效和受欢迎的氛围。当工作环境是互动且顺畅的时，就存在一种投入感。如此，大多数员工会进行更大程度的自律，以完全满足公司。然而，这是一个硬性模型所反对的概念，因为它认为这种氛围会产生不懈的结果，并鼓励员工懒散。


    ## 章节总结


    a) 人力资源管理（HRM）既是一个定义管理职的术语，也是组织内部的一个运营部门。


    b) 人力资源管理作为一种实践，从中世纪到文艺复兴时期一直存在到现在。


    c) 人力资源管理的演变跨越了历史上的前工业、工业和后工业时代。


    d) 组织必须采用理论方法，因为这有助于此类公司轻松确定目标。


    e) 人力资源管理有多种方法，包括：管理、战略、商品、系统、人力资源以及主动和被反应式方法。公司可能不会采用所有这些方法，但必须识别出有助于实现目标的类型。


    f) 人力资源管理对于公司保持竞争优势是必要的。


    g) 人力资源人员承担各种责任，是任何寻求进步和平衡的组织的关键人选。


    h) 人力资源管理的主要功能通常表现为管理职能和运作职能的特征。


