    ### 商品品化方法

    这在很大程度上被视为一种传统方法，因为它只关注公司的生产立场。这种方法涉及将员工商品化，并在实现目标后完全可以淘汰这些员工。有时，这些员工会被留任，但其核心意义是公司在任何时候都主宰发生的一切。这与关注组织的人力资源管理“硬性模型”是一致的。


    ### 系统方法

    人力资源管理是一个包含多个运作功能性组件的概念。这些组件包括所有抽象、具体和人类层面的因素，它们对公司的产产生积极或负面的影响。


    ### 人力资源方法

    人力资源拥有增强或削弱公司地位的生产能力。由于人力资源创造了竞争优势，它们必须被重视甚至奖励。这种人力资源管理方法与“软理论”相契合，该理论认为人力资源对于组织增长至关重要。正如约翰·F·肯尼迪所说：“我们国家的进步绝不会比我们在教育方面的进步更快。人类头脑是我们最根本的资源。”


    ### 主动与被动方法

    主动管理团队可以为组织节省大量的生产和收益方面的损失和挫折。当一个组织采取主动方法时，更有可能做出更有效的决策来改善该组织。


    另一方面，当一个组织采取被动方法时，持续下降的趋势将不可避免。这种反应可能是解决人员配置问题、生产问题、管理问题等。以被动的正式形式持续处理组织障碍，最终将导致组织部分或整个组织的崩溃。


    ## 1.4 人力资源管理的基本功能

    埃德温·弗里波（Edwin Flippo, 2007）认为人力资源管理是“对人力资源进行计划、组织、指导、控制或招聘、开发、补偿、整合、维护和分离，以实现个人、组织和社会目标的完成。”


    根据弗里波对人力资源管理的定义，很明显这一概念主要指的是组织的监督和管理形式。


    此外，人力资源领域的其他领先人物还提出了人力资源管理的主要功能。这些主要功能通常分为：


    a) 管理功能

    b) 运作功能


    管理功能包括：

    a) 计划

    b) 人员配置

    c) 组织

    d) 指导

    e) 控制


    运作功能被建议得广泛，因为不同人士对其综合清单做出了贡献。最熟悉的运作功能特征是：

    a) 招聘或聘用

    b) 职位分析与设计

    c) 绩效考核

    d) 培训与开发

    e) 补偿

    f) 工资福利管理

    g) 福利管理

    h) 员工健康与福利

    i) 维护与留才

    j) 劳动与员工关系

    k) 研究

    l) 法律合规

    m) 记录管理


    ![一张自动生成的手机描述截图](img/HRM1.png)


    ### 招募技能员工

    通过聘用优秀的人才来补充公司的角色、文化和愿景，对于维持一支智能且技能丰富的员工队伍是理想的。人力资源管理负责引入他们认为对公司有巨大贡献和意义的人员。招聘其他不合适的人员意味着组织生产力和竞争能力的下降。


    ### 指导

    公司的人力资源或员工在某些时刻可能不知道该做什么或不该做什么。此时，人力资源管理试图设定目标并将人力资源引向成功的道路。如果没有这一点，生产性活动可能会在错误的轨道上。


    ### 可用资源的效用

    人力和非人力资源对于组织产生最佳效率和进步都是必要的。建立人力资源管理的理念随后增强了利用可用资源的机会。这可能涉及向可用的人力/非人力资源分配职责，以实现目标或维持相对强大的竞争优势。


    ### 确保健康的雇佣关系

    人力资源管理确保雇主与员工之间往来的顺畅性。约翰·肯尼迪也曾说：“人类头脑是我们最根本的资源。”这表明，在雇主与员工之间关系复杂的情况下，业务事务将受到影响。在这种情况下，人力资源管理的概念带来了雇主与员工之间平衡的关系。


    ### 员工的培训与开发

    为了获得更好的公司表现，员工必须具备资质、技能并经过培训。要么允许员工适应系统，要么通过培训让他们以更快的速度发展。让员工自然适应会浪费时间并产生无效产出。然而，培训此类人员将对组织产生巨大帮助。


    ## 1.5 人力资源经理

    人力资源管理由一个或多个成员组成。人力资源经理负责人力资源的监督、控制、招聘和管理。他们是雇主与员工之间的纽带，并且经常对组织人力资源能力的决策进行验证。


    人力资源经理职位属于职业类型。它需要主动和被动处理情况的心理能力。决策具有极大的影响力，可能给公司留下污点，也可以建立健全、一致的实践。此外，人力资源经理的一些传统品质包括口才好、思维活跃、缓解压力的能力、卓越的沟通技巧，以及最重要的卓越的领导能力。所有这些共同构成了人力资源经理的描述。


    ### 人力资源经理的一些职责

    人力资源经理承担着重任，特别是他们充当公司生产力的决定性因素。然而，一名胜任且熟练的人力资源经理至少应具备以下属性并能够履行以下功能：

    a) 计划、组织、管理、引导并让员工处于同一轨道的能力

    b) 建立能够使即时或后期产出有利于组织生产能力的程序

    c) 开发针对组织及员工共同成长的新想法

    d) 在招聘发布前审查职位描述和职

    e) 招募技能员工以提高生产力

    f) 与人力资源团队合作，确保组织内部处于稳定的竞争地位

    g) 提倡引入能够积极影响公司组织结构的政策

    h) 监督员工活动并为员工分配合适的职责

    i) 在员工与雇主之间建立良好的联系

    j) 为特定或整体运营结构或系统的改变提出建议以改进

    l) 审查工资并建议新的薪资标准

    m) 营造友的工作氛围并鼓励员工工作

    m) 强制并维护促进组织增长所必需法律合规性


    '
