    # Chapter 5: Conflict Management


    Conflict is an unavoidable happening in any organization and may be initiated
    by an individual or group. Chapter five focuses on highlighting conflict and the
    various approaches that could dissolve it.


    This chapter provides readers with competency to explain the following:


    a) Definition and examples of conflict

    b) Characteristics of conflict

    c) The effects of conflict and the need to avoid it

    d) Different classifications of conflict

    e) Conflict resolution approaches and strategies

    f) Factors engendering conflict within an organization


    ![Image](images/image-1.png)


    An organization relies on the peaceful coexistence of human resources, management,
    and the employer to do well. When there is a conflict between these groups, it
    forces the effect of underperformance, which leads to a low yield. A conflict
    could also be initiated by or involve other stakeholders such as customers, clients,
    boards, or volunteers. Therefore, a conflict must be avoided like a plague in
    any business setting or organization for any planned target to be possible.


    Conflict is anything that attracts unrest in an organized system. It is often
    a reaction to unfavorable policies. In a managerial sense, conflict is simply
    a deliberate agitating measure taken towards a plan of action or action in a company.
    It is often notable among human resources but prevalent in other faculties of
    an organization as well.


    ### Definition and Difficulties of Conflict Management


    Conflict management is a reactive measure taken to weigh down the effects of conflict
    on a company’s general performance. The concept identifies the source of a problem,
    proffer, and implements a solution. Could conflict have a connection with compliance?
    Many human resource persons have at a time, wondered about the connection between
    conflict and regulatory compliance. The simple response is that as long as the
    laws of jurisdiction are against conflict, it applies to managerial, employee,
    and employer conflicts in organizations.


    Moreover, conflict management is a scientific-based concept. The reason is that
    it requires measures and steps to be taken in managing the causes of underperformance,
    imbalance relationship, and low yield in an organization. Without a quick response
    to conflict or an attempt towards conflict management, many difficulties will
    arise. Some of the difficulties include the following.


    ### Weak Communication


    Conflict does not encourage communication. Thus, it promotes a poor relationship
    between management, employers, and employees. Conflict in an organization is synonymous
    with a society that is not interactive. This is the case because it often leads
    to a misunderstanding that might result in a fight. The absence of communication
    will not just affect the relationship of the organization but that of the customers
    too. In cases where such conflict is noticeable, customers might withdraw their
    patronage.


    ### Underperformance


    A lively organization features a committed workforce. However, when the workforce
    encounters conflict, it takes away the spark and willingness to be committed and
    dedicated to a task. Naturally, it attracts a dull environment that does not encourage
    productivity. A conflict-ridden organization does not encourage employee development
    as there is no functional relationship to enhance such.


    ### Low Productivity


    It is a norm in any organization for conflict to encourage low productiveness.
    It will be surprising for a conflict-ridden organization to perform well in any
    faculty. In a business environment, there is a provision of the chart indicating
    company growth; such a company would often find itself sloping downwards and remaining
    at a low level. This equally signifies that such an organization is inactive in
    the in-place competition. Subsequently, they are out of the environmental competition
    for better control of the business environment.


    ## 5.1. Features of Conflict


    Although conflict is inevitable, organizations inflicted by conflict can always
    get through with proper understanding and reconciliation from conflicting parties.
    It is ideal to reconcile conflicts because they can ruin any existing relationship
    in a company in a blink of an eye.

