    ## 1.6 Challenges Faced by Human Resource Management


    Human Resource Management encounters problems that require mental strength to
    solve. It can be challenging having to deal with these situations because most
    of these challenges are unpredictable. Moreover, making certain decisions could
    very well aid or adversely damage the company. A human resource manager would
    not welcome wrong decisions, and this means occasionally having to work with and
    determine the probability of mishaps and issues.


    Some of the challenges faced by Human Resource Management include:


    ### Employer-Employee Relationship


    Creating an affectionate closeness between the employer and employee is one of
    the problems that confront human resource managers. Sometimes, a human resource
    manager may have to defend and lean more toward the employee’s behavior or perspective,
    even where the employee has shown low productivity. Such productivity could be
    due to the lack of or limited availability of nonhuman resources. Human resource
    managers may also have to protect employees who are subject to harsh, illegal,
    violent, or other undesirable working conditions. Sometimes the human resource
    manager is unaware of these circumstances, but it is always the best decision
    to alleviate the threats or uncomfortable situations and then to determine a solution
    to prevent future reoccurrence.


    It can be difficult to manage behaviors that invoke an individual’s personality,
    upbringing, religious beliefs, emotions, and other non-tangible characteristics
    that define an employee’s identity. These abstract components can often cause
    employers to be unable to ascertain an employee’s expectations or desires. The
    human resource manager is tasked with helping to build a bridge between these
    intangible characteristics and leveraging them to solidify a strong and reliable
    employer-employee relationship that benefits both parties. It is challenging because
    the human resource manager would attempt to justify both parties while keeping
    impartial in the process. In cases where an employer is highhanded, it affects
    the organization as workers would lose the appropriate encouragement. It is then
    the human resource manager’s place to compensate for the situation and ignite
    that ‘readiness to work’ factor in employees.


    ### Productivity


    Some elements of an organization’s overall productivity are attributed to the
    effectiveness of a human resource manager. Human resource managers must make constant
    decisions and considerable suggestions to prevent the company from backsliding
    at a quicker or slower pace. This may include staffing recommendations, policy
    suggestions, or implementing specific systems that could assist with increasing
    productivity.


    The performance of a company could rest on the shoulders of a human resource person,
    and both failure and a win would draw all eyes to inspect the impactful role.


