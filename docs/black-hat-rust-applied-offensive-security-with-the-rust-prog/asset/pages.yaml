    Rust does not provide the execution context required to execute Futures and Streams.
    This execution context is called a runtime. You can''t run an async Rust program
    without a runtime.


    The 3 most popular runtimes are:


    | Runtime | All-time downloads (2022) | Description |

    |---|---||

    | tokio | 42,874,882 | An event-driven, non-blocking I/O platform for writing
    asynchronous I/O backed applications. |

    | async-std | 5,875,271 | Async version of the Rust standard library |

    | smol | 1,187,600 | A small and fast async runtime |


    However, there is a problem: today, runtimes are not interoperable and require
    acknowledging their specifics in code: you can''t easily swap a runtime for another
    by changing only 1-2 lines of code.


    Work is done to permit interoperability in the future, but today, the ecosystem
    is fragmented. You have to pick one and stick to it.


    # 3.6 Introducing tokio


    Tokio is the Rust runtime with the biggest support from the community and has
    many sponsors (such as Discord, Fly.io, and Embark), which allow it to have paid
    contributors!


    If you are not doing embedded development, this is the runtime you should use.
    There is no hesitation to have.'
