    \ goal is to improve code reusability and reduce bugs by func-tions, structures,\
    \ and traits to have their types defined later.\n\nIn practice, it means that\
    \ an algorithm can be used with multiple different types, provided that they fulfill\
    \ the constraints. As a result, if you find a bug in your generic algorithm, you\
    \ only have to fix once. If you had to implement the algorithm 4 times for different\
    \ similar types (let say int32, int64, float32, float64), not only would you spent\
    \ 4x more time to implement it, but you would also spend 4x more time fixing the\
    \ same bug in all the implementations (granted you didn't introduce other bugs\
