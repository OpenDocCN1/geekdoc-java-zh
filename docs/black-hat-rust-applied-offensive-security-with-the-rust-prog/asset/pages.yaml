  md: 'evil twin attack.


    The attacker was walking in a targeted location with a Raspberry Pi in his backpack,
    spoofing the wifi access points of the location.


    When victims connected to their Raspberry Pi (thinking they were connecting to
    the wifi network of the campus), they were served a portal where they needed to
    enter their credentials, as usual.


    But as you guessed, it was a phishing form, absolutely identical to the legitimate
    portal, and all the credentials were logged in a database on the Raspberry Pi
    of the attacker.


    SSID: AIRPORT_FREE_WIFI


    ![](img/fd19beeb883de29aeed91588e61a7e14_231_0.png)


    Figure 9.7: Evil Twin


    The success rate was in the order of 80%-90%: 80-90% of the people who connected
    to the malicious access point got their credentials siphoned!


    Then, the phishing portal simply displayed a network error page, telling the victims
    that there was a problem with the internet and their request couldn''t be processed
    further, in order to raise suspicion.


    But why do people connect to the evil twin attack? They didn’t do anything particular!
    The beauty of the attack is that it relies on a “feature” of wifi: when 2 networks
    have the same name (SSID), the devices connect to the one with the strongest signal.
    And auto-connecting is enabled on all devices, the victims’ devices were simply
    auto-connecting to the malicious access point, thinking that it was a legitimate
    one.


    # 9.13.1 How-to


    Here is how to build an Evil Twin access point with a Raspberry Pi and Rust.'
