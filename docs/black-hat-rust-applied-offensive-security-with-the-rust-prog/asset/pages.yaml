  md: '# 10.3.2 Meterpreter


    Meterpreter (from the famous Metasploit offensive security suite), is defined
    by its creators “an advanced, dynamically extensible payload that uses in-memory
    DLL injection stagers and is extended over the network at runtime. It communicates
    over the stager socket and provides a comprehensive client-side Ruby API. It features
    command history, tab completion, channels, and more."


    # 10.3.3 Cobalt Strike


    Cobalt Strike is an advanced attack platform developed and sold for red teams.


    It’s known for its advanced customization possibilities, such as its Malleable
    C2 which allow operators to personalize the C2 protocol and thus reduce detection.


    # 10.3.4 Pegasus


    While writing this book, circa 2021, a scandal broke out about the Israeli spyware
    called pegasus, which was used to spy on a lot of civilians, and reporters.


    In fact, this spyware was already covered in 2018 and 2020.


    You can find two great reports about the use of Pegasus RAT to target journalists
    on the citizenlab.ca website.


    # 10.4 Why Rust


    Almost all existing RAT are developed in C or C++ for the agent due to the low
    resources usage and the low-level control these languages provide, Python, PHP,
    Ruby, or Go for the server and client parts.


    Unfortunately, these languages are not memory-safe, and it’s not uncommon to find
    vulnerabilities in various RATs. Also, it requires developers to know multiple
    programming languages, which is not that as all languages have their own pitfalls,
    toolchains, and hidden surprises. Finally, mixing languages doesn’t encourage
    re-use. Due to that, some of these RATs provide plugins and add-ons (to add features)
    as standalone binaries that are easier to detect by monitoring systems.


    On the other hand, Rust provides low-level control but also easy package management,
    high-level abstractions, and great code re-usability.


    Not only Rust allow us to re-use code across the agent, the server, and the client,
    but also by re-using all the packages we have in reserves, such as the scanners
    and exploits we previously crafted. Embedding them is as simple as adding a dependency
    to our project and calling a function!'
