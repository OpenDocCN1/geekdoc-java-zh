  md: "```\nfn process(processor: &dyn Processor, x: i64) {\n    let result = processor.compute(x,\
    \ 42);\n    println!(\"{}\", result);\n}\n\npub fn main() {\n    let processors:\
    \ Vec<Box<dyn Processor>> = vec[\n        Box::new(Cisc {}),\n        Box::new(Risc\
    \ {}),\n    ];\n\n    for processor in &processors {\n        process(&*processor,\
    \ 1);\n    }\n}\n```\n\nThe compiler will generate only 1 process function. It's\
    \ at runtime that your program will detect which kind of Processor is the processor\
    \ variable and thus compute method to call. This is known dynamic dispatch. The\
    \ type selection is made dynamically at runtime.\n\nThe syntax for trait objects\
    \ &dyn Processor may appear a little bit heavy, especially when coming from verbose\
    \ languages. I personally love it! In one look, we can see that the function accepts\
    \ a trait object, thanks to dyn Processor.\n\nThe reference & is required because\
    \ Rust must know the exact size for each variable.\n\nAs the structures implementing\
    \ the Processor trait may vary in size, the only solution is to pass a reference.\
    \ It could also have been a (smart) pointer as Box, Rc or Arc.\n\nThe point is\
    \ that the processor variable nodes need to have a size known at compile time.\n\
    \nNote in this specific example, we do &*processor because we first need to dereference\
    \ the Box in order to pass the reference to the process function. This is equivalent\
    \ of process(&*processor), 1)\n\nWhen compiling dynamically dispatched functions,\
    \ Rust will create under the hood what is called a vtable, and use this at runtime\
    \ to choose which function to call.\n\n# 4.3.2 Some Closing Thoughts\n\nUse static\
    \ dispatch when you need absolute performance and trait objects when you need\
    \ more flexibility or collections of objects sharing the same behavior."
