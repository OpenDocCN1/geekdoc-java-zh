  md: '# 6.26 Additional resources


    There is the great swisskyrepo/PayloadsAllTheThings and EdOverflow/bugbounty-cheatsheet
    GitHub repositories with endless examples and payloads that help to find these
    vulnerabilities.


    Basically, you just have to copy/paste the provided payloads into the inputs of
    your favorite web applications, and some vulnerabilities may pop. If no vulnerability
    is obvious but interfacing error messages are displayed, it''s still worth taking
    the time to investigate.


    # 6.27 Bug hunting


    Now we have an idea of what looks like a vulnerability, let see how to find them
    in the real world.


    There are some recurrent patterns that should raise your curiosity when hunting
    for vulnerabilities.


    # 6.27.1 Rich text editors


    Rich text editors, such as WYSIWYG or Markdown are often an easy target for XSS.


    # 6.27.2 File upload


    From arbitrary file write to XSS (with SVG files), file upload forms are also
    a great place to find a lot of vulnerabilities.


    # 6.27.3 Input fields


    As we saw, injections come input fields that are not sanitized. The thing to exploit
    non-sanitized input fields is to understand how and where they are outputted.
    Sometimes, this is not obvious as they may be processed by some algorithm. To
    transform URLs into links, for example,


    Also, input fields are hidden from the interface:


    ```

    <input type="hidden" id="id" name="id" value="123">

    ```


    # 6.27.4 HTTP Headers


    An overlooked attack vector is the HTTP headers of a request.


    Indeed, HTTP headers are sometimes used by applications and sent back in response.
    For example, think of an analytic service that displays the top 10 User-agent
    headers.'
