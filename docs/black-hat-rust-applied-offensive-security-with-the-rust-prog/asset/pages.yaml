  md: "# ## 5.10.1 Async\n\nThe first, and maybe most important reason for using Rust,\
    \ is its async I/O model: you are guaranteed to have the best performance possible\
    \ when making network requests.\n\n# ## 5.10.2 Memory-related performance\n\n\
    Making a lot of network requests and parsing data often require creating a lot\
    \ of short-lived memory objects, which would put a lot of pressure on garbage\
    \ collectors. As Rust doesn't have a garbage collector, it doesn't have this problem,\
    \ and the memory usage will be far more deterministic.\n\n# ## 5.10.3 Safety when\
    \ parsing\n\nScraping requires parsing. Parsing is one of the most common ways\
    \ to introduce vulnerabilities (Parsing JSON is a Minefield, XML parsing vulnerabilities)\
    \ or bugs. Rust, on the other hand, with its safety and strict error handling,\
    \ provides better tools to handle the complex task of parsing untrusted data and\
    \ complex formats.\n\n# ## 5.11 Associated types\n\nWe are now all about what\
    \ a crawler is and why Rust, let's learn the last few Rust features that we need\
    \ to build a crawler.\n\nThe last point to know about generics in Rust is: **Associated\
    \ types.**\n\nYou already dealt with associated types when using iterators and\
    \ Futures.\n\nRemember `FutureOutput<String>`, here `String` is an associated\
    \ type.\n\nWe could build a generic spider like:\n\n```\npub trait Spider<I>{\n\
