    # 8.4 no_std


    By default, Rust assumes support for various features from the Operating System:
    threads, a memory allocator (for heap allocations), networking, and so on...


    There are systems that do not provide these features or projects where you don''t
    need all the features provided by the standard library and to craft a binary as
    small as possible.


    This is where the `#[no_std]` attribute comes into play. Simply put it at the
    top of your `main.rs` or `lib.rs`, and the compiler will understand that you don''t
    want to use the standard library.


    But, when using `#[no_std]`, you have to take care of everything that the standard
    library, such as starting the program. Indeed, the Rust Core library can be used
    in an `#[no_std]` program / library.


    Also, we have to add special compiler and linker instructions in `.cargo/config.toml`.


    Here is a minimal `#[no_std]` program


    # Cargo.toml


    ```

    [package]

    name = "nostd"

    version = "0.1.0"

    edition = "2021"

    ```'
