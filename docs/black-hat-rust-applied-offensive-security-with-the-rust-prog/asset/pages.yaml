  md: 'There are a lot of problems when using websockets. First, it requires keeping
    a lot of, often idle, open connections, which is wasteful in terms of server resources.
    Second, there is no auto-reconnection mechanism, each time a network error happens
    (if the client change from wifi to 4G for example), you have to implement your
    own reconnection algorithm. Third, there is no built-in authentication mechanism,
    so you often have to hack your way through handshakes and some kind of other custom
    protocol.


    Websockets are the way to go if you need absolute minimal network usage and minimal
    latency.


    The principal downside of websockets is the complexity of implementation. Moving
    from a request/response paradigm to streams is not only hard to shift in terms
    of understanding and code organization but also is terms of infrastructure (like
    how to configure your reverse proxies...).


    #  10.5.2.3 Server-Sent Events (SSE)


    ![](img/fd19beeb883de29aeed91588e61a7e14_244_0.png)


    Figure 10.7: SSE


    Contrary to websockets, SSE streams are unidirectional: only the server can send
    data back to the client. Also, the mechanism for auto-reconnection is (normally)
    built-in into clients.


    Like websockets, it requires a lot of connections open.


    The downside is that it''s not easy to implement server-side.


    #  10.5.2.4 Long Polling


    Finally, there is long polling: the client emits a request with an indication
    of the last piece of data it has (a timestamp, for example), and the server sends
    the response back only when new data is available or when a certain amount of
    time passed.'
