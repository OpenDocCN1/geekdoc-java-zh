    # # 9.6 WebAssembly


    WebAssembly is described by the webassembly.org website: WebAssembly (abbreviated
    Wasm) is a binary instruction format for a stack-based virtual machine. Wasm is
    designed as a portable compilation target for programming languages, enabling
    deployment on the web for client and server applications.


    ...


    Put in an intelligible way


    But, you don''t write wasm by hand, it''s a compilation target. You write your
    code in a high-level language like Rust, and the compiler outputs WebAssembly!


    In theory, it sunsets a future where client web applications won''t be written
    in JavaScript, but in any language that you can be compiled to WebAssembly.


    There is also the wasmer runtime to execute wasm on servers.'
