  md: 'tors. It provides a relay between the client and the agents. One reason is
    to hide the identity of the operators issuing commands from the client. Another
    one is to provide high availability: the client can''t run 24h/24h. The server,
    on the other hand, can.


    # 11.18.2 What can go wrong


    Compromised server: The server can be compromised, whether it be a vulnerability
    or seized by the hosting provider itself.


    Network monitoring: Network monitoring systems are common in enterprise networks
    and may detect abnormal patterns, which may lead to the discovery of infected
    machines.


    Discovery of the agent: The agent itself may be uncovered, which may lead to forensic
    analyses: analyses of the infected machines to understand the modus operandi and
    what was extracted.


    Impersonation of the operators: An entity may take control of the compromised
    hosts and issue commands to them, by pretending to be the legitimate operators
    of the system.


    # 11.18.3 What are we going to do about it


    Compromised server: No cleartext data should be stored on the server. Thus we
    will use end-to-end encryption to both authenticate and keep confidential our
    commands and data.


    Network monitoring: By using a standard protocol (HTTP-S) and encrypting our data
    end-to-end, we may reduce our network footprint.


    Discovery of the agent: Data should be encrypted using temporary keys. No long-term
    key should be used for encryption. Only for authentication.


    Impersonation of the operators: End-to-end encryption provides authentication
    to prevent impersonation.


    # 11.19 Designing our protocol


    Now we have decided that we need encryption to avoid detection and mitigate the
    consequences of a server compromise, let''s design our protocol for end-to-end
    encryption.


    As we saw, one peculiarity of our situation is that the agent is only responding
    to requests issued by the client. Also, the agent can embed the client’s identity
    public key in order to verify that requests come from legitimate operators.


    It makes our life easier to implement forward secrecy, as instead of the client
    providing ephemeral public keys for key exchange, the ephemeral public key can
    be embedded directly'
