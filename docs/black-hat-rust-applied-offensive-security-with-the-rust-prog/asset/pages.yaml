  md: 'Of course, trying all the combinations of ASCII characters is not very practical
    when trying to brute force networked services. It takes too much time.


    A better way is to try only trained credentials (`username`, `password`) known
    to be often used by manufacturers. You can find such a wordlist in [Mirai''s source
    code online](https://example.com).


    This primitive but effective scale technique is often used by IoT botnets as Mirai
    or derivatives due to the poor security of IoT gadgets (Internet cameras, smart
    thermostats...).


    # 13.2.2 Stolen credentials


    For example, on an infected server, the worm can look at `/.ssh/config` and `/.ssh/known_hosts`
    to find other machines that may be accessible from the current server and use
    the private keys in the `~/.ssh` folder to spread.


    # 13.2.3 Networked services vulnerabilities


    By embedding exploits for known networked services vulnerabilities, a worm can
    target and spread to the machines hosting these services.


    One of the worms to become famous: [Morris](https://example.com) used this technique
    to spread.


    Nowadays, this technique is widely used by ransomware because of the speed at
    which they can spread once a new vulnerability is discovered.


    **This is why you should always keep your servers, computers, and smartphones
    up-to-date!**


    # 13.2.4 Other exploits


    A worm is not limited to exploiting networked services. As we saw in chapter 6,
    parsing is one of the first sources of vulnerabilities. Thus, by exploiting vulnerabilities
    in commonly used software, a worm can spread offline by infecting the files being
    parsed.


    Here are some examples of complex file types that are often subject to vulnerabilities:


    +   - Subtitles

    - Videos

    - Fonts

    - Images


    # 13.2.5 Infecting supply chain


    Each software project has dependencies that are known as its supply chain:'
