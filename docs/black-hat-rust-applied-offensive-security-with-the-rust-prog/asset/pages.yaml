  md: 'An example of a trick that I found to detect Windows Anti-Viruses was to open
    the current binary (the RAT) with the read-write flag. If it''s a success, the
    binary is being examined by some kind of sandbox or Anti-Virus. Indeed, Windows
    doesn''t allow a program that is currently being executed to be opened with write
    privileges.


    # 13.9.5 Privileges escalation


    As we saw in chapter 12, some techniques (for persistence, hiding, or simply full-system
    takeover) may require elevated privileges. For that, we can use the kind of exploits
    developed in chapter 7 and embed them in the RAT. It''s greatly facilitated by
    Rust''s package system.


    # 13.9.6 Encrypted Strings


    The first line of defense for your RAT to implement is Strings encryption. One
    of the very few steps any analyst or anti-virus will do when analyzing your RAT
    is to search for Strings (for example, with the `strings` unix tool).


    It''s possible to do that with Rust''s macros system and or crashes as `obfstr`
    or `litcrypt`


    # 13.9.7 Anti-debugging tricks


    The second line of defense against analysts is Anti-debugging tricks.


    Analysts (Humans or automated) use debuggers to reverse-engineer malware samples.
    This is known as "dynamic analysis". The goal of anti-debugging tricks is to slow
    down this dynamic analysis and increase the cost (in time) to reverse engineer
    our RAT.


    # 13.9.8 Proxy


    Once in a network, you may want to pivot into other networks. For that, you may
    need a proxy module to pivot and forward traffic from one network to another one,
    if you can''t access that second network.


    # 13.9.9 Stagers


    Until now, we built our RAT as a single executable. When developing more advanced
    RATs, you may want to split the actual executable and the payload into what is
    called a stager, and the RAT becomes a library.


    With this technique, the RAT that is now a library can live encrypted on disk.
    On execution, the stager will decrypt it in memory and load it. The **actual RAT
    will be decrypted only in memory.**


    It has the advantage of leaving way fewer pieces of evidence on the infected systems.'
