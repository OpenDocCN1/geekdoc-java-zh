  md: 'Exploit development is also known as “weaponization”.


    Entire companies are operating in the grey waters of exploits trading, such as
    Vupen or Zerodium. They often don''t find the exploits themselves but buy them
    from third-party hackers and find buyers (such as government agencies or malware
    developers).


    #  1.3.3 The developer


    The role of the developer is to build custom tools (credential dumpers, proxies...)
    and implants used during the attack. Indeed, using publicly available, pre-made
    tools vastly increase the risk of being detected.


    These are the skills we will learn and practice in the next chapters.


    #  1.3.4 The system administrator


    Once the initial compromise is performed, the role of the system administrator
    is to operate and secure the infrastructure used by attackers. Their knowledge
    can also be used during the exploitation and lateral movements phases.


    #  1.3.5 The analyst


    In all kinds of attacks, domain knowledge is required to interpret the findings
    and prioritize targets. This is the role of the analyst, either to provide deep
    knowledge about what specifically to target or to make sense of the exfiltrated
    data.


    #  1.4 Attribution


    Attribution is the process of identifying and laying blame on the operators behind
    a cyber attack.


    As we will see, it’s an extremely complex topic: sophisticated attackers go through
    multiple networks and countries before hitting their target.


    Attacks attribution is usually based on the following technical and operational
    elements:


    Dates and time of the attackers’ activities, which may reveal their time zone
    - even though it can easily be manipulated by moving the team to another country.


    Artifacts present in the employed malware, like a string of characters in a specific
    alphabet or language - although, one can insert another language in order to blame
    someone else.'
