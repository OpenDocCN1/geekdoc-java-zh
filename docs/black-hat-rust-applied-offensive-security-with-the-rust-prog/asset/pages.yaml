    # # Crawling the web for OSINT


    # ##5.1 OSINT


    OSINT stands for Open Source Intelligence. Just to be clear, the *Open Source*
    part has nothing to do with the *Open Source* you are used to know.


    OSINT can be defined as the methods and tools that use publicly available information
    to support intelligence analysis (investigation, reconnaissance).


    As OSINT consists of extracting meaningful information from a lot of data, it
    can, and should, be automated.


    # ##5.2 Tools


    The most-known tool for OSINT is Maltego. It provides a desktop application with
    a lot of features to visualize, script, and automate your investigations.


    Unfortunately, it may not be the best fit for everyone the *pro* plan is pricey
    if you are not using it. Also, from what I know, the SDKs are available only for
    a few programming languages you love: Rust.


    This is why I prefer plain markdown notes with homemade scripts in the programming
    language I prefer. The results of the scripts are then pasted into the markdown
    report or exported as CSV or JSON files.


    Everything is backed up in a Git repository.


    Then, with a tool like *Pandoc* you can export the markdown report to almost any
    format you want: PDF, HTML, Docx, Epub, PPTX, Latex...


    If you like the graphical representation, you can also use something like markmap
    to turn'
