  md: "The lack of order of the printed numbers shows us that jobs are executed concurrently.\n\
    \nIn async Rust, Streams and their concurrent combinators replace worker pools\
    \ in other languages. Worker pools are commonly used to process jobs concurrently,\
    \ such as HTTP requests, file hashing, and so on. In Rust, they are an anti-pattern\
    \ because their APIs often favor imperative programming, mutable variables (to\
    \ accumulate the result of computation) and thus may introduce subtle bugs.\n\n\
    Indeed, the most common challenge of a worker pool is to collect back the result\
    \ of the computation applied to the jobs.\n\nThere are 3 ways to use Streams to\
    \ replace worker pools and collect the result in an idiomatic functional way.\
    \ Remember to always put an upper limit on the number of concurrent tasks, otherwise,\
    \ you may exhaust the resources of your system and thus affect performance.\n\n\
    # 3.9.5.2 Using buffer_unordered and collect collect ? It can also be using Streams\
    \ to convert back to a collection.\n\n```\nch_03/tricoder/src/main.rs\n\n// Concurrent\
    \ stream method 1: Using buffer_unordered + collect\nlet subdomains: Vec<Subdomain>\
    \ = stream::iter(subdomains.into_iter())\n.map(|subdomain| ports::scan_ports(ports_concurrency,\
    \ subdomain))\n.buffer_unordered(subdomains_concurrency)\n.await();\n```\n\nThis\
    \ is the modern and idiomatic way to implement a worker pool in Rust. Here, our\
    \ subdomains is the list of jobs to process. It's then transformed into Futures\
    \ holding port scanning tasks. Those are concurrently executed thanks to buffer_unordered\
