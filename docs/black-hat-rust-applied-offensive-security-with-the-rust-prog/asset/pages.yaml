  md: '# 1.1.7 Industrial spying


    Industrial espionage has always been a tempting means for companies to break down
    competitors’ secrets and achieve competitive advantage. As our economy is more
    and more dematerialized (digitalized), this kind of attack will only increase
    in terms of frequency.


    # 1.1.8 Cyberwar


    This last kind of attack is certainly the less mediatized but without doubt the
    most spectacular. To learn more about this exciting topic, I can’t recommend enough
    the excellent book “Countdown Zero Day: Stuxnet and the Launch of the World’s
    First Digital Weapon” by Kim Zetter tells the story of, to my knowledge, the first
    act of advanced cyberwar: the Stuxnet worm.


    # 1.2 Phases of an attack


    ![](img/fd19beeb883de29aeed91588e61a7e14_17_0.png)


    Figure 1.1: Phases of an attack


    # 1.2.1 Reconnaissance


    The first phase consists of gathering as much information as possible about the
    target. Whether it be the names of the employees, the numbers of internet-facing
    machines and the services running on them, the list of public Git repositories...


    Reconnaissance is either passive (using publicly available data sources, such
    as social networks or search engines), or active (scanning the target’s networks
    directly, for ex-ample).


    # 1.2.2 Exploitation


    Exploitation is the initial breach. It can be performed by using exploits (zero-day
    or not), abusing humans (social engineering) or both (sending office documents
    with malware inside).'
