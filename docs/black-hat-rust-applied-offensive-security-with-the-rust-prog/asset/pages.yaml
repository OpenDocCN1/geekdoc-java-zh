  md: 'Commands for agents are hidden in comments or tweets.


    On the one hand, it allows hiding in the traffic. On the other hand, if your firewall
    informs you that your web server has started making requests to instagram.com
    , it should raise your curiosity.


    # 10.2.3 DNS


    The advantage of using DNS is that it''s undoubtedly the protocol with the least
    chances of being blocked, especially in corporate networks or public wifis.


    # 10.2.4 Peer-to-Peer


    Peer-to-Peer (P2P) communication refers to an architecture pattern where no server
    is required, and agents (nodes) communicate directly.


    ![](img/fd19beeb883de29aeed91588e61a7e14_239_0.png)


    Figure 10.3: P2P architecture


    In theory, the client can connect to any agent (called a node of the network),
    send a command, and the node will spread it to the other nodes until it reaches
    the intended recipient.


    In practice, due to network constraints such as NAT, some nodes of the network
    are temporarily elected as super-nodes and all the other agents connect to them.
    Operators then have to send instructions to super-nodes, and they will forward
    them to the intended agents.


    Due to the role that super-node are playing and the fact that they can be controlled
    by adversaries, end-to-end encryption (as we will see in the next chapter) is
    mandatory in such a topology.


    Examples of P2P RAT are ZeroAccess and some variants of Zeus.'
