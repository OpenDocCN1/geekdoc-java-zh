    # ### 14.5.1 Selling a scanner as a service


    Selling it as a service (as in Software as a Service, SaaS) is certainly the best
    way to monetize a scanner.


    2 famous companies in the market are Acunetix and Detectify.


    Beware that finding prospects for this kind of service is hard, and you certainly
    won''t be able to do it all by yourself. Furthermore, you only need to quickly
    adapt to new vulnerabilities to protect your customers, but also to follow all
    the major references such as OWASP, which is a lot of work!


    Actual security doesn''t sell. The sentiment of security does.


    # ### 14.5.2 Bug bounty


    Bug bounty programs are the uberization of offensive security. No interview, no
    degree asked. Anyone can join the party and try to make money or a reputation
    by finding vulnerabilities.


    If you are lucky, you could find a low-hanging fruit and make your first hundreds
    to thousands of dollars in a few hours (hint: subdomain takeover).


    If you are less lucky, you might quickly find vulnerabilities, or manually, then
    spend time writing the report, all that for your report being dismissed as non-receivable.
    Whether it be a duplicate, or not appreciated as serious enough to deserve a monetary
    reward.


    This is the dark side of bug bounties.


    **I recommend you to only participate in bug bounty programs offering monetary**'
