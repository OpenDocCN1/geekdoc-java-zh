    \ fn process(&self, item: I) -> Result<(), Error>;\n}\n```\n\nBut then it would\
    \ be very inconvenient to use as each function using it would need to also be\
    \ generic over `I` :\n\n```\nfn use_spider<I, S: Spider<I>>(spider: S) {\n   \
    \ // ...\n}\n```"
