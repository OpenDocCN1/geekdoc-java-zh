  md: '# # Chapter 9


    # ## Phishing with WebAssembly


    Sometimes, finding technical vulnerabilities is not possible: you don''t have
    the skills, don''t have the right team, or simply don''t have the time.


    When you can''t attack the infrastructure, you attack the people. And I have good
    news: they are, most of the time, way more vulnerable than the infrastructure.
    Furthermore, phishing attacks are particularly low cost.


    But, while computer hacking requires deep technical knowledge to understand how
    the Operating Systems and programming languages work, Human hacking requires understanding
    how Humans work to influence them.


    # ### 9.1 Social engineering


    Social engineering is all about persuading. Persuading someone to give you pieces
    of information, to do something, or to give you access that you shouldn''t have.


    While rarely present in engineering curricula, learning how to persuade is a key
    element of any initiative: as soon as you want to do something, someone will find
    a reason to oppose. This leaves you 2 choices:


    +   - Either you abandon.

    - Or you persuade the person(s) that what you want to do is the right thing, and
    it needs to be done.


    As you may have guessed, it is the latter that we will learn in this chapter.


    And I have even more good news: The art of persuasion hasn''t changed in 2000
    years! Thus there are countless writings on the topic.'
  merge: -1
