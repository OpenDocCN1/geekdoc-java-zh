  md: '# 10.9 Optimizing Rust’s binary size


    By default, Rust produces fairly large binaries, which may be annoying when building
    a RAT. A larger executable means more resources used on the system, longer and
    less reliable downloads, and easier to be detected.


    We will see a few tips to reduce the size of a Rust executable.


    Note that each of the following points may come with drawbacks, so you are free
    to mix them according to your own needs.


    # 10.9.1 Optimization Level


    In Cargo.toml


    ```

    [profile.release]

    opt-level = ''z'' Optimize for size

    ```


    # 10.9.2 Link Time Optimization (LTO)


    In Cargo.toml


    ```

    [profile.release]

    lto = true

    ```


    # 10.9.3 Parallel Code Generation Units


    In Cargo.toml


    ```

    [profile.release]

    cogen-units = 1

    ```


    Note that those techniques may slow down the compilation, especially Parallel
    Code Generation Units. In return, the compiler will be able to better optimize
    your binary.


    # 10.9.4 Choosing the right crates


    Finally, small crates can have the biggest impact on the size of the final executable.
    You can use cargo-bloat to find which crates are bloating your project and thus
    find alternatives, as we did for the agent''s HTTP client library.


    # 10.10 Dockerizing the server


    In order to package our server, we use a two-stages Docker image.'
