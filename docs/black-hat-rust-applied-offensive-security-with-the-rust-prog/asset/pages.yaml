  md: '# 1.2.3 Lateral Movements


    Also known as pivoting, lateral movement designates the process of maintaining
    access and gaining access to more resources and systems. Implants, Remote Access
    Tools (RATs), and various other tools are used during this phase. The biggest
    challenge is to stay hidden as long as possible.


    # 1.2.4 Data exfiltration


    Data exfiltration is not present in every cyberattack, but in most which are not
    carried out by criminals: industrial spying, banking trojans, State spying...


    It should be made with care as large chunks of data passing through the network
    may not go unnoticed.


    # 1.2.5 Clean up


    Once the attack is successfully completed, advised attackers need to cover their
    tracks in order to reduce the risk of being identified: logs, temporary files,
    infrastructure, phishing websites...


    # 1.3 Profiles of attackers


    The profile of attackers is also extremely varied. From lone wolves to teams of
    hackers, developers and analysts, there is definitely not a common profile that
    fits them all. However, I will try to portray which profiles should be part of
    a team conducting offensive operations.


    # 1.3.1 The hacker


    The term hacker is controversial: mainstream media use it to describe criminals
    while tech people use it to describe passionate or hobbyists tinkering with tech.
    In our context, we will use it to describe the person with advanced offensive
    skills and whose role is to perform reconnaissance and exploitation of the targets.


    # 1.3.2 The exploit writer


    The exploit writers are often developers with a deep understanding of security.
    Their role is to craft the weapons used by their teams to break into their targets''
    networks and machines.'
