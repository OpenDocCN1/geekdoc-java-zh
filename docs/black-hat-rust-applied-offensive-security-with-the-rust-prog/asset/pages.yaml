  md: '# 8.6 The never type


    the “never” type, represented as ! in code computations which never resolve to
    any value at all. For example, the exit function `fn exit(code: i32) -> !` exits
    the process without ever returning, and returns !.


    It is useful for creating shellcode, because our shellcodes will never return
    any value. They may `exit` to avoid brutal crashes, but their return value will
    never be used.


    # 8.7 Executing shellcodes


    Executing code from memory in Rust is very dependant on the platform as all modern
    Operating Systems implement security measures to avoid it.


    The following applies to Linux.


    There are at least 3 ways to execute raw instructions from memory:


    +   - By embedding the shellcode in the `.text` section of our program by using
    a special `attribute`.

    - By using `mmap` crate and setting a memory-mapped area as `executable`.

    - A third alternative not covered in this book is to use Linux''s `mprotect` function.


    # 8.7.1 Embedding a shellcode in the .text section


    Embedding a shellcode in our program is easy thanks to the `include_bytes!` macro,
    but adding it to the `.text` section is a bit tricky as, by default, only the
    reference to the `.text` section, and the buffer itself will be added to the `.rodata`
    section.


    Thanks to `.len` being a `const` function, the size of the buffer can be computed
    at compile-time, and we can allocate an array of the good size at compile-time.


    It can be achieved as:


    ```

    ch_08/executor/src/main.rs

    use std::mem;


    // we do this trick because otherwise only the reference is in the .text section

    const SHELLCODE_BYTES: &[u8] = include_bytes!("../shellcode.bin");

    const SHELLCODE_LENGTH: usize = SHELLCODE_BYTES.len();

    ```


    ```

    #[no_mangle]

    #[link_section = ".textnstatic SHELLCODE: [u8; SHELLCODE_LENGTH] = *include_bytes!("../shellcode.bin");

    ```'
