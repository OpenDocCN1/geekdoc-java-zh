    # 12.4 Cross-compilation


    ```

    Error: Toolchain / Library XX not found. Aborting compilation.

    ```


    How many times did you get this kind of message when trying to follow the build
    instructions of a project or cross-compile it?


    What if, instead of writing documentation, we could consign the build instructions
    into an immutable recipe that would guarantee us a successful 100% of the time?


    This is where Docker comes into play:


    **Immutability:** The Dockerfile are our immutable recipes, and docker would be
    our robot, flawlessly executing the recipes all days of the year.

    **Cross-platform:** Docker is available on the 3 main OSes (Linux, Windows, and
    macOS). Thus, we enable a team of several developers using different machines
    to work together, but we also greatly simplify our toolchains.


    By using Docker, we are finally reducing our problem to compiling from Linux to
    other platforms, instead of:


    +   * From Linux to other platforms

    * From Windows to other platforms

    * From macOS to other platforms

    * ...'
