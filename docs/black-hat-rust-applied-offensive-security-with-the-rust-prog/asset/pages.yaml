    # 10.5 Designing the server


    # 10.5.1 Which C&C channel to choose


    Among the channels previously listed, the one that will be 80% of the time and
    require 20% of the efforts (Hello Pareto) is HTTP(S).


    Indeed, the HTTP protocol is rarely blocked, and as it is the foundation of the
    web, there are countless matter implementations ready to be used.


    My experience is that if you decide not to use HTTP(S) and instead implement your
    own protocol, you will end up with the same features as HTTP (Requests-Responses,
    Streaming, Transport encryption, metadata) but half-backed, less reliable, and
    without the millions (?) of man-hours on the web ecosystem.


    # 10.5.2 Real-time communications


    All that is great, but how to do real-time communication with HTTP?


    There are 4 main ways to do that:


    +   - Short Polling

    - WebSockets (WS)

    - Server-Sent Events (SSE)

    - Long Polling


    # 10.5.2.1 Short Polling


    The first method for real-time communications is short polling.


    In this scenario, the client sends a request to the server, and the server immediately
    replies. If there is no new data, the response is empty. And most of the time
    it''s the case. So, most of the time, the responses of the server are empty and
    could have been avoided.


    Thus, short polling is wasteful in terms of network and CPU, as requests need
    to be parsed and encoded each time.


    The only pro is that it''s impossible to do simpler.


    # 10.5.2.2 WebSockets


    A websocket is a bidirectional stream of data. The client establishes a connection
    to the server, and then they can both send data.'
