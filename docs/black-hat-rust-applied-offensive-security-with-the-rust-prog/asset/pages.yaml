  md: '# Tokio''s Runtime


    ![](img/fd19beeb883de29aeed91588e61a7e14_66_0.png)


    Figure 3.2: Tokio''s different thread pools


    This is why async-await is also known as “Green threads” or “M:N threads”. They
    look like threads for the user (the programmer), but spawning is cheaper, and
    you can spawn more green threads than the actual number of OS threads the runtime
    is going to use under the hood.


    # 3.8 Sharing data


    You may want to share data between your tasks. As each task can be executed in
    a different thread (processor), sharing data between async tasks are subject to
    the same rules as sharing data between threads.


    # 3.8.1 Channels


    First, the channels. As we saw in the previous chapter, channels allow us to “share
    memory by communicating” instead of “communicate by sharing memory” (Mutexes).


    Tokio provides many types of channels depending on the task to accomplish:


    # 3.8.1.1 The oneshot channel


    The oneshot channel supports sending a single value from a single producer to
    a single consumer. This channel is usually used to send the result of a computation
    to a waiter.


    docs.rs/tokio/latest/tokio/sync'
