  md: "# 9.11 Deserialization in Rust\n\nOne of the most recurring questions when\
    \ starting a new programming language is: But how to encode/decode a struct to\
    \ JSON? (or XML\n\nIn Rust it is simple: by annotating your structures with serde\n\
    \nRemember the procedural macros in chapter 4? Serialize and Deserialization are\
    \ both procedural macros provided by the serde crate to create the serialization/deserialization\
    \ of Rust types (struct , enum ...) into/any data format.\n\n```\nuse serde::{Deserialize,\
    \ Serialize};\n#[derive(Serialize)]\npub struct LoginRequest {\n    pub email:\
    \ String;\n    pub password: String;\n}\n```\n\nThen you can serialize / deserialize\
    \ JSON with a specialized crate such as input field, or serde_json :\n\n```\n\
    // decode\nlet req_data: LoginRequest = serde_json::from_str(\"{{ ... }\")\";\n\
    \n// encode\nlet json_response = serde_json::to_string(&req_data);\n```\n\nMost\
    \ of the time, you don't have to do it yourself as it's taken care by some framework,\
    \ such as the HTTP client library or the webserver.\n\n# 9.12 A client application\
    \ with WebAssembly\n\nWhether it is with React, VueJS, Angular, or in Rust, modern\
    \ web applications are composed of 3 kinds of pieces:\n\n+   * Components\n* Pages\n\
    * Service\n\nComponents are reusable components and UI elements. An input field,\
    \ or a button, for example.\n\nPages are assemblies of components. They match\
    \ routes (URLs). For example, the /login page matches the Home / route.\n\nAnd\
    \ finally, Services are auxiliary utilities to wrap low-level features or external\
    \ services such as an HTTP client, a Storage service..."
