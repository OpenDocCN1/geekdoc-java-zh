  md: '# 13.9.10 Process migration


    Once executed, a good practice for RAT to reduce its footprint is to migrate to
    another process. By doing this, they no longer exist as an independent process
    but are now in the memory space of another process.


    Thus, from a monitoring tool perspective, it''s the host process that will do
    all the network and filesystem operations normally done by the RAT. Also, the
    RAT no longer appears in the process list.


    # 13.9.11 Stealing credentials


    Of course, a RAT is not limited to remote commands execution. The second most
    useful feature you may want to implement is stealing credentials.


    You will have no problem finding inspiration on GitHub: https://github.com/search?q=chromestealer


    The 3 most important kinds of credentials to look for are (in no particular order):


    **Web browsers saved passwords and cookies.** Stolen may have even greater value
    than stolen passwords as they can be imported in another browser to impersonate
    the original user and completely bypass 2-factor authentication.


    **SSH keys.** Compromised servers often have more value than simple computers:
    they may have access to sensitive information such as a database or simply have
    more resources available for mining cryptocurrencies or DDoSs.


    **Tokens for package registries.** Such as npmjs.com or crates.io. As we saw earlier,
    tokens can be used to distribute in a very broad or targeted way, depending on
    your needs.


    # 13.10 Summary


    +   * A **worm** is a piece of software that can replicate itself in order to
    spread to other machines.


    +   * Thanks to Rust''s packages system, it''s very easy to create reusable modules.


    +   * Any Remote Code Execution vulnerability on a networked service can be used
    by a worm to quickly spread.'
