  md: 'What kind of data is harvested using passive reconnaissance? Usually, pieces
    of information about employees of a company such as names, email addresses, phone
    numbers, but also source code repositories, leaked tokens. Thanks to search engines
    like Shodan, we can also look for open-to-the-world services and machines.


    As passive reconnaissance is the topic of chapter 5, we will focus our attention
    on active reconnaissance in this chapter.


    # 2.2 Active reconnaissance


    Active reconnaissance is the process of gathering information about a target directly
    by interacting with it.


    Active reconnaissance is noisier and can be detected by firewalls and honeypots,
    so you have to be careful to stay undetected, for example, by spreading the scan
    over a large span of time.


    A honeypot is an external endpoint that shall never be used by “regular” people
    of a given company, so the only people hitting this endpoint are attackers. It
    can be a mail server, an HTTP server, or even a document with remote content embedded.


    Once a honeypot is scanned or hit, it will report back to the security team which
    put it in place.


    A canary is like a honeypot in an internal network. Its purpose is to detect attackers
    once they have breached the external perimeter.


    The reconnaissance of a target itself can be split into two steps:


    +   - Assets discovery

    - Vulnerabilities identification (which is the topic of chapter 6)


    # 2.3 Assets discovery


    Traditionally, assets were defined only by technical elements: IP addresses, servers,
    domain names, networks...


    Today the scope is broader and encompasses social network accounts, public source
    code repositories, Internet of Things objects... Nowadays, everything is on or
    connected to the internet. From an offensive point of view, it''s really interesting.


    The goal of listing and mapping all the assets of a target is to find entry points
    and vulnerabilities for our coming attack.'
