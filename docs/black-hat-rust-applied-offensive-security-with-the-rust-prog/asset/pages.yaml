  md: '# 3.11 How to defend


    **Do not block the event loop**. I can''t repeat it enough as I see it too often.
    As we saw previously, you need to spawn blocking tasks in the dedicated thread
    pool (either fixed in size or unbounded, depending on if your application is more
    compute or I/O intensive).


    Don''t forget the numbers: in an `async` function or block, do not call a non-`async`
    function or perform a computation that may run for **more than 10 to 100 microseconds**.


    # 3.12 Summary


    +   Multithreading should be preferred when the program is CPU bound, `async-await`
    when the program is I/O bound


    +   **Don''t block the event loop**


    +   Streams are async iterators


    +   Streams replace worker pools


    +   Always limit the number of concurrent tasks or the size of channels not to
    exhaust resources


    +   If you are nesting async blocks, you are probably doing something wrong.'
