    # 3.2 Cooperative vs Preemptive scheduling


    In the programming language, there are mainly 2 ways to deal with I/O tasks: **preemptive
    scheduling and cooperative scheduling**.


    **Preemptive scheduling** is when the scheduling of the tasks is out of the control
    of the developer, entirely managed by a **runtime**. Whether the programmer is
    launching a sync or an async task, there is no difference in the code.


    For example, the Go programming routines on preemptive scheduling.


    It has the advantage of being easier to learn: for the developers, there is no
    difference between sync and async code. Also, it is almost impossible to misuse:
    the runtime takes care of everything.


    The disadvantages are:


    +   - Speed, which is limited by the cleverness of the runtime.

    - Hard to debug bugs: If the runtime has a bug, it may be extremely hard to find
    out, as the runtime is treated as dark magic by developers.


    On the other hand, with **cooperative scheduling**, the developer is responsible
    for telling the runtime when a task is expected to spend some waiting for I/O.
