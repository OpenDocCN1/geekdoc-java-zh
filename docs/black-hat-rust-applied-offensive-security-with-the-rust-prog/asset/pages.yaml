    #[cfg(target_os = "macos")

    mod mac;

    #[cfg(target_os = "macos")

    pub use mac::install;


    #[cfg(target_os = "windows")

    mod windows;

    #[cfg(target_os = "windows")

    pub use windows::install;

    ```


