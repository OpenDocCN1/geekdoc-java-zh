    # # 6.15 Denial of Service (DoS)


    A Denial of Service (DoS) attack''s goal is to make a service unavailable to its
    legitimate users.


    ![](img/fd19beeb883de29aeed91588e61a7e14_156_0.png)


    Figure 6.9: Denial of Service


    The motivation of such an attack is most of the time financial: whether it be
    for demanding a ransom to stop the DoS, or to cut off a competitor during a period
    where a high number of sales are expected.


    As you may have guessed, blocking Rust''s event loop often leads to a DoS, where
    a tiny amount of requests might block the entire system.


    There is also the cousin of DoS: DDoS, for Distributed Denial of Service, where
    the final goal is the same (make a service unavailable to its legitimate users),
    but the method is different. Here, attackers count on the limited resources of
    the network, for example, CPU power or bandwidth, and try to exhaust these resources
    by distributing the load on their side to multiple machines.


    DoS are usually not carried by a single attacker, but by a botnet controlled by
    an attacker.


    # # 6.15.1 Why it''s bad


    Can your customers buy t-shirts on your website if they can''t access it?


    # # 6.15.2 Case Studies


    +   - DoS on PayPal via web cache poisoning'
