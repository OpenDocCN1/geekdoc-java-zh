  md: '# # Chapter 7


    # ## Exploit development


    Now we know how to find vulnerabilities, it''s time to actively exploit our findings.


    An **exploit** is a piece of code used to trigger a vulnerability.

    Usually, exploits are developed either in python for remote exploits or in C for
    local exploits.

    Mastering both languages is hard and having 2 completely different languages prevents
    reuse.


    What if we had a single language that is low-level enough while providing high-level
    abstraction, is exceptionally fast, easy to cross-compile, all of that while being
    memory safe, highly reusable, and extremely reliable?


    You got it! Rust is the perfect language for exploits development.


    By writing exploit in Rust, we can use it as a binary, embedded in a larger exploitation
    toolkit, or embedded it into a RAT. All of this is very hard to achieve when writing
    exploits in Python or With Rust, it''s just a matter of creating a crate.


