    # ## 12.9 Packers


    A packer wraps an existing program and compresses and/or encrypts it.


    ![](img/fd19beeb883de29aeed91588e61a7e14_326_0.png)


    Figure 12.1: Packer


    For that, it takes our executables as input, then:


    +   - compress and/or encrypt it

    - prepend it with a stub

    - append the modified executable

    - set the stub as the entrypoint of the final program


    During runtime, the stub will decrypt/decompress the original executable and load
    it in memory.


    Thus, our original executable will only live decrypted/decompresssed in the memory
    of the Host system. It helps to reduce the chances of detection.


    The simplest and most famous packer is upx . Its principal purpose is to reduce
    the size of executables.


    ```

    $ sudo apt install -y upx

    $ upx -9 <my executable>

    ```


    As upx is famous, almost all anti-viruses know how to detect and circumvent it.
    Don’t expect it to fool any modern anti-virus or serious analyst.'
