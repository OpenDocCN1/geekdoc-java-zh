  md: '# Chapter 2


    # Multi-threaded attack surface ndiscovery


    > “To know your Enemy, you must become your Enemy", Sun Tzu


    As we have seen, the first step of every attack is reconnaissance. The goal of
    this phase is to gather as much information as possible about our target in order
    to find entry points for the coming assault.


    In this chapter, we will see the basics of reconnaissance, how to implement our
    own scanner in Rust and how to speed it up by leveraging multithreading.


    There are two ways to perform reconnaissance: Passive and Active.


    ![](img/fd19beeb883de29aeed91588e61a7e14_43_0.png)


    Figure 2.1: Passive vs Active reconnaissance


    # 2.1 Passive reconnaissance


    Passive reconnaissance is the process of gathering information about a target
    without interacting with it directly, for example, searching for the target on
    different social networks and search engines.


    Using publicly available sources is called OSINT, for Open Source INTelligence.'
