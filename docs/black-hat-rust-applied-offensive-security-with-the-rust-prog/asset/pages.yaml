  md: '# 11.4 Hash functions


    ![](img/fd19beeb883de29aeed91588e61a7e14_280_0.png)


    A hash function takes as input arbitrarily long message, and produces a fixed-length
    hash.


    Each identical message produces the same hash. On the other hand, two different
    messages should never produce the same hash.


    They are useful to verify the integrity of files, without having to compare/send
    the entire file(s).


    You already have encountered them on download pages.


    Examples of Hash functions: SHA-3, Blake2b, Blake3 .


    There are also MD5 and SHA-1 , but they SHOULD NOT BE USED TODAY as real-world
    attacks exist against those functions.


    # 11.5 Message Authentication Codes


    MAC (Message Authentication Code) functions are the mix of hash function and a
    secret key.


    The secret key allows authentication: only the parties with the knowledge of the
    secret key are able to produce a valid authenticated hash (also called a tag or
    a code).


    MACs are also known as Keyed hashing.


    An example of usage of MACs are JSON Web Tokens (JWTs): only the server with the
    knowledge of the secret key is able to issue valid tokens.'
