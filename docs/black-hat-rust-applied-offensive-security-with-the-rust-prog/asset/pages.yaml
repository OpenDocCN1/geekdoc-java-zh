    #  6.27.10 Just-In-Time compilation


    Just-In-Time (JIT) compilers may reduce the security measures of modern operating
    systems (by design), such as making some part of the memory **Writable And Executable**.
    It means that memory-related vulnerabilities are way easier to exploit.


