  md: "# ## 4.4 Command line argument parsing\n\nIn the first chapter, we saw how\
    \ to access command-line arguments. For more complex programs, such as our scanner,\
    \ a library to parse command-line arguments is required.\n\nFor example, we need\
    \ to parse more complex configuration options to our program, such as an output\
    \ format (JSON, XML...), a debug flag, or simply the ability to run multiple commands.\n\
    \nWe will use the most famous one: clap as it's also my favorite one, but keep\
    \ in mind that alternatives exist, such as structopt.\n\n```\nlet clap = Command::new(clap::crate_name!)\n\
    \    .version(clap::crate_version())\n    .about(clap::crate_description())\n\
    \    .subcommand(Command::new(\"modules\").about(\"List all modules\\))\n    .subcommand(\n\
    \        Command::new(\"scan\").about(\"Scan a target\").arg(\n            Arg::new(\"\
    target\")\n                .help(\"The domain name to scan\")\n              \
    \  .required(true)\n                .index(1)\n        )\n    )\n    .arg_required_else_help(true)\n\
    \    .get_matches();\n```\n\nHere we declare 2 subcommands: modules and scan.\n\
    \nThe scan subcommand also has a required argument: target, thus calling scan\
    \ like that:\n\n```\n$ tricoder scan\n```\n\nWon't work. You need to call it with\
    \ an argument:\n\n```\n$ tricoder scan kerkour.com\n```\n\nThen, we can check\
    \ which subcommand has been called and the value of the arguments:\n\n```\nif\
    \ let Some(matches) = cli.subcommand_matches(\"modules\") {\n    cli::modules();\n\
    } else if Some(matches) = cli.subcommand_matches(\"scan\") {\n    // we can safely\
    \ unwrap as the argument is required\n    let target = matches.value_of(\"target\"\
    ).unwrap();\n    cli::scan(target)?\n}\n```"
