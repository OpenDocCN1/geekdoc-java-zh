  md: '# 11.10 Diffie–Hellman key exchange


    Diffie-Hellman key exchange (more commonly called key exchange) is a method to
    establish a shared secret between two parties through a public channel.


    The same shared secret can be derived from Alice''s public key and Bob''s private
    key from Bob''s public key and Alice''s private key. Thus, both Alice and Bob
    can compute the same shared secret using their respective private keys and the
    other''s public key.


    Nowadays, the recommended key exchange functions to use are Elliptic-curve Diffie-Hellman
    (ECDH), which are much simpler to implement than RSA encryption.


    However, shared secrets computed through ECDH can''t be used directly for symmetric
    encryption. Most AEAD algorithms expect a uniformly symmetric key which shared
    secrets are not. Thus, to “increase their entropy”, we pass the output of the
    key exchange into a Key Derivation Function (KDF) to generate a shared secret
    that can be used for symmetric encryption.


    ![](img/fd19beeb883de29aeed91588e61a7e14_286_0.png)


    Figure 11.10: Key exchange


    The (certainly) most famous and used Key Exchange algorithm (and the one I recommend
    you to use if you have no specific requirement) is: x25519.


    # 11.11 Signatures


    Signatures are the asymmetric equivalent of MACs: given a keypair and a message
    (comprised of a public key and a private key), the private key can produce a signature
    of the message. The public key can then be used to verify that the signature has
    indeed been issued by someone (or something) with the knowledge of the private
    key.'
