  md: 'Advanced attack platforms are composed of a simple agent with the base functionalities
    and different modules that are downloaded, encrypted, and executed dynamically
    from memory only. It allows the operator to deploy their whole arsenal to each
    target and thus reduce the risks of being caught and/or revealing their capabilities.


    # 10.1.2 C&C (a.k.a. C2 or server)


    The C&C (for Command and Control, also abbreviated) C2


    It is operated on infrastructure under the control of the attackers, either compromised
    earlier or set up for the occasion, or as we will see, “public” infrastructure
    such as social networks.


    A famous (at least by the number of GitHub stars) open source C&C is Merlin.


    # 10.1.3 The client


    Last but not least, the client is the RAT operator’s interface to the server.
    It allows the operator(s) to send instructions to the server, which will forward
    them to the agents.


    It can be anything from a command-line application to a web application or a mobile
    application. It just needs to be communicate with the server.


    # 10.2 C&C channels & methods


    Using a simple server as C&C does not provide enough guarantees regarding availability
    in case of the server is attacked or seized; it may not reveal details about the
    operation, but also put an end to it. Using creative C&C channels enables operators
    to avoid some detection mechanisms: in an enterprise network, a request to this-is-not-attack.com
    may appear suspicious, while a request (hidden among many others) to youtube.com
    will surely draw less attention.


    # 10.2.1 Telegram


    One example of a bot using telegram as C&C channel is ToxicEye.


    Why is telegram so prominent among attackers? First due to the fog surrounding
    the company, and second because it’s certainly the social network that is the
    easiest to automate, bots are first-class citizens on the platform.


    # 10.2.2 Social networks


    Other social networks such as Twitter (PDF), Instagram, Youtube and more are used
    by creative attackers as “serverless” C&C.'
