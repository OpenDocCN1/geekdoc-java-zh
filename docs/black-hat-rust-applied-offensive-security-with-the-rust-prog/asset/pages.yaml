  md: '# 7.4 Building an exploitation toolkit


    pwntools is a well-known Python exploit development framework. It provides a lot
    of functions and helpers to fasten your finding and exploitation of vulnerabilities.


    The Rust, on the other hand, favors smaller crates and the composition of those
    small packages over monolithic frameworks like pwntools .


    Here is a list of crates that you can use today to help you during your exploit
    writing sessions.


    +   - reqwest for HTTP requests.

    - hyper if you need a low-level HTTP server or client.

    - tokio for when you need to interact with TCP or UDP services.

    - goblin if you need to read or modify executable files (PE, elf, mch-o).

    - rusts if you need to play with TLS services.

    - flate2 if you need compression/decompression.


