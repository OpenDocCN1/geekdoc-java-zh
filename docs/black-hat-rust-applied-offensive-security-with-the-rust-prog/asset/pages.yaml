  md: 'in each job. Thus the public key for each job''s result will only exist in
    the memory of the agent, the time for the agent to execute the job and encrypt
    back the result.


    # 11.19.1 Choosing the primitives


    Per the design document above, we need 4 primitives:


    +   - for Signatures (identity keypairs)

    - for encryption (jobs and results)

    - for key exchange (prekeys and ephemeral keys)

    - and a last one, a Key Derivation Function.


    # 11.19.1.1 Signatures


    Because it''s a kind of industry-standard, we choose Ed25519 for signatures.


    # 11.19.1.2 Encryption (AEAD)


    We basically have 3 choices for encryption:


    +   - AES-GCM

    - ChaCha20Poly1305

    - XCha20Poly1305


    11.19.1.2.1 AES-GCM The Galois/Counter Mode (GCM) for the famous AES block cipher
    is the safest and most commonly recommended if you want to use AES. It''s widely
    used practically thanks to its certifications and hardware support, which make
    it extremely fast on modern, mainstream CPUs.


    Unfortunately, being a mode for AES, it''s extremely hard to understand and easy
    to misuse or implement vulnerabilities when implementing it.


    11.19.1.2.2 ChaCha20-Poly1305 ChaCha20-Poly1305 is a combination of both a stream
    cipher (ChaCha20) and MAC (Poly1305) which combined, make one of the fastest AEAD
    primitive available today, which does not require special CPU instructions. That
    said, with SIMD instructions, as AVX-512, the algorithm is even faster.


    It''s not easy to benchmark crypto algorithms (people often end up with different
    numbers), but ChaCha20-Poly1305 is generally as fast or up to 1.5x slower than
    AES-GCM-256 on hardware.


    It is particularly appreciated by cryptographers due its elegance, simplicity,
    and speed. This is why you can find it in a lot of modern protocols such as TLS
    or WireGuard®.'
