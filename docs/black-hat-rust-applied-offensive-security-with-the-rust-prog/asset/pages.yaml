  md: '# 13.2 Spreading techniques


    Usually, a worm replicates itself without human intervention by automatically
    scanning networks. It has the disadvantage of being way easier to detect as it
    may try to spread to honeypots or network sensors.


    They use 2 kinds of techniques to spread:


    +   - By bruteforcing a networked service (SSH, for example)

    - Or by using exploits (RCE or even XSS)


    ![](img/fd19beeb883de29aeed91588e61a7e14_334_0.png)


    Figure 13.1: Worm


    After choosing the technique that your worm will use to spread, you want to choose
    the spreading strategy. There are 2 different strategies.


    The first way is for targeted attacks, where the worm only spreads when receiving
    specific instructions from its operators.


    The second way is for broad, indiscriminate attacks. The worm basically scans
    the whole internet and local networks in order to spread to many machines as possible.
    Beware that this implementation is completely illegal and may cause great harm
    if it reaches sensitive infrastructure such as hospitals during a global pandemic.
    It will end you in jail (or worse) quickly.


    # 13.2.1 Networked services bruteforce


    Bruteforce is the practice of trying all the possible combinations of credentials
    in the hope of eventually guessing it correctly (and, in our case, gaining access
    to the remote system).'
