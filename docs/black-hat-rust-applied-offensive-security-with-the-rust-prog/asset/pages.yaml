  md: '# 9.14.2 Two-factor authentication


    There are a lot of ways credentials can leak: either by phishing, malware, a data
    breach, a rogue employee...


    Two-factor authentication is an extra layer of security that helps to secure online
    accounts by making sure that people trying to gain access to an online account
    are who they say they are.


    In contrast to credentials, 2-factor authentication methods are supposed to prove
    that you own something instead of knowing (like a password).


    There are a few methods to achieve it:


    +   * Hardware token

    * unique code by SMS

    * unique code by email

    * software token

    * push notification


    Beware that 2FA by SMS is not secure because sms is a very old protocol, the messages
    can "easily" be intercepted. This method is also vulnerable to SIM swapping. That
    being said, it''s a thousand better to have SMS 2FA than nothing!


    # 9.14.3 DMARC, DKIM, and SPF


    As we saw earlier, DKIM, SPF, and DMARC are technologies helping administrators
    to protect their email domains.


    By setting these records, you are making it much harder for attackers to spoof
    your domains to send emails.


    DKIM (for DomainKeys Identified Mail) is a security standard designed to make
    sure emails from legitimate servers and aren''t altered in transit. It uses public-key
    cryptography to sign emails with a private key that the sending server has. We
    will learn about public-key cryptography, signatures, and private keys in chapter
    11.


    SPF (for Sender Policy Framework) is an email authentication technique that is
    used to prevent spammers from sending messages on behalf of your domain. With
    SPF organizations can publish the email servers authorized to send emails for
    a given domain name.


    DMARC (for Domain-based Message Authentication, Reporting, and Conformance) is
    an email authentication, policy, and reporting protocol built on SPF and DKIM.
    It enables organizations to publish policies for recipients servers how to handle
    authentication failures and thus detect email spoofing attempts.'
