    # 9.14.5 Buy adjacent domain names


    If you are a big company, buy the domain names close to yours (that you can generate
    with the tools we built earlier). This will make the job of the scammers and attackers
    harder.


    # 9.14.6 Shred (or burn) all old documents


    To avoid someone finding important things in your trash.


