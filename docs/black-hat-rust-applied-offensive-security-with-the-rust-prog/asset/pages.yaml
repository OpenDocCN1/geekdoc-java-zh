  md: 'Can someone be an expert in all these languages? I don''t think so. And the
    countless bugs and vulnerabilities in offensive tools prove I''m right.


    What if, instead, we could have a unique language.


    A language that, once mastered, would fill all the needs of the field:


    +   * Shellcodes

    * Cross-platform Remote Access Tools (RATs)

    * Reusable and embeddable exploits

    * Scanners

    * Phishing toolkits

    * Embedded programming

    * Web servers

    * ...


    What if we had a single language that is low-level enough while providing high-level
    abstractions, is exceptionally fast, and easy to cross-compile. All of that while
    being memory safe, highly reusable, and extremely reliable.


    No weird toolchains, strange binary packagers, vulnerable network code, injectable
    phishing forms...


    **Rust is the language to rule all.**


    Due to momentum, Rust isn''t widely adopted by the security industry yet, but
    once the tech leads and independent hackers understand this reality, I believe
    that the change will happen fast.


    Of course, there are some pitfalls and a few things to know, but everything is
    covered in the following chapters.


    # 1.1 Types of attacks


    All attacks are not necessarily illegal or unsolicited. Let''s start with a quick
    summary of the most common kinds of attacks found in the wild.


    # 1.1.1 Attacks without a clear goal


    Teenagers have an obscene amount of free time. Thus, some of them may start learning
    computer security after school and hack random targets on the internet. Even if
    they may not have clear goals in mind other inflating their ego and appeasing
    their curiosity, these kinds of attacks can still have substantial monetary costs
    for the victims.'
