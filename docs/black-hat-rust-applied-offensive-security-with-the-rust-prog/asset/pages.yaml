    +   • A compiler


    +   • A CI/CD pipeline


    By compromising any of these elements, a worm could spread to other machines.,


    +   • crossenv malware on the npm registry


    +   • Mick Stute on hunting a malicious compiler


    +   • Using Rust Macros to exfiltrate secrets


    +   • Embedded malware in the rc NPM package


    The simplest way to achieve this is by typo-squatting (chapter 9) famous packages.


    A more advanced way is by stealing the credentials of the package registries on
    developers’ computers and using them to infect the packages that the developers
    publish.


    # 13.2.6 Executable infection


    Infecting executables were very popular near the 2000s: programs were often shared
    directly between users, and not everything was as connected as today.


    Being said, there were entire communities dedicated to finding the most interesting
    ways to infect programs. It was known as the VX scene.


    If you want to learn more about this topic, search for “vxheaven” : )


    # 13.2.7 Networked storage


    Another trick is to simply copy itself in a networked folder, such as Dropbox,
    iCloud, or Google Drive, and pray for a victim to click and execute it.


    # 13.2.8 Removable storage


    Like networked storage, a worm can copy itself to removable storage units such
    as USB keys and hard drives and pray for a victim to click and execute it.


    # 13.3 Cross-platform worm


    Now we have a better idea about how a worm can spread, let’s talk about cross-platform
    worms.


    A cross-platform worm is a worm that can spread across different Operating Systems
    and architectures.'
