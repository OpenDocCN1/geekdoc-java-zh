  md: '#  9.7.5 How to improve delivery rates


    Improving email deliverability is the topic of entire books, and a million to
    billion-dollar industry, so it would be impossible to cover everything here.


    Being said, here are a few tips to improve the delivery rates of your campaigns:


    **Use one domain per campaign:** Using the same domain across multiple offensive
    campaigns is a, very bad idea. Not only that once a domain is flagged by spam
    systems, your campaigns will lose their effectiveness, and it will also allow
    forensic analysts to understand easily your *modus operandi*.


    **Don’t send emails in bulk:** The more your emails are targeted, the less the
    chance to be caught by spam filters, and, more importantly, to raise suspicion.
    Also, sending a lot of similar emails at the same moment may trigger spam filters.


    **IP address reputation:** When evaluating an email is spam or not, algorithms
    will take into account the reputation of the IP address of the sending server.
    Basically, each IP address has a reputation, and once an IP is caught sending
    much undesirable emails, its reputation drops, and the emails are blocked. A lot
    of parameters are taken into account like: is the IP from a residential neighborhood
    (often blocked, infected by botnets individual computers used to be the source
    of a lot of spam) or a data-center? And so...


    **Spellcheck content:** We received this email from this Nigerian prince wanting
    to send us a briefcase full of cash. You don’t want to look like that, do you?


