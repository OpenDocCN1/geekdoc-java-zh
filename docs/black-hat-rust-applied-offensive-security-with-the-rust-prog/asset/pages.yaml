    # 14.1.1 Lifetime Annotations


    I don''t like lifetime annotations. When combined with generics, it becomes extremely
    easy to produce extremely hard to read and reason about code. Do you and your
    coworkers favor: avoid lifetime annotations.


    Instead, when it''s possible, prefer to move data, or when it''s not possible,
    use smart pointers as Rc and Arc for long-lived references.


    One of the goals of this book was to prove that we can create complex programs
    without using them. Actually, when you avoid lifetime, Rust is a lot easier to
    read and understand,'
