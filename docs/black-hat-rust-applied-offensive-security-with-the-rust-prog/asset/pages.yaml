  md: '# Chapter 10


    # A modern RAT


    A R.A.T. (for Remote Access Tool, also called an R.C.S., for Remote Control System,
    a backdoor, or a trojan) refers to software that allows an operator to remotely
    control one or more systems, whether it be a computer, a smartphone, a server
    or an internet-connected printer.


    RATs are not always used for offensive operations, for example, you may know TeamViewer,
    which is often used for remote support and assistance (and by low-tech scammers).


    In the context of offensive security, a RAT should be as stealthy as possible
    to avoid detection and is often remotely installed using exploits or phishing.
    The installation is often a 2 stage process. First, an extremely small program,
    called a dropper, stager, or downloader, is executed by the exploit or the malicious
    document, and this small program will download the RAT itself and execute it.
    It provides more reliability during the installation process and allows, for example,
    the RAT to run entirely from memory, which reduces the traces left of the targeted
    systems.


    # 10.1 Architecture of a RAT


    Most of the time, a RAT is composed of 3 parts:


    +   - An agent

    - A C&C

    - And a client


    # 10.1.1 The Agent


    The agent is the payload. It''s the software that will be executed on the targeted
    systems.'
