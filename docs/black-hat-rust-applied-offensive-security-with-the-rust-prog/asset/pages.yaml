    rustls is a modern TLS library written in Rust. It uses ring under the hood for
    cryptography. Its goal is to provide only safe use features by allowing only TLS
    1.2 and upper, for example.


    In my opinion, this library is on the right track to replace OpenSSL and BoringSSL.


    # 11.16.6 Other crates


    There are many other crates as blake3, but in my opinion, they should be evaluated
    only if you can''t find your primitive in the crates/organizations above.


