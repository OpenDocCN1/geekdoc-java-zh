    #  14.5.2.1 Public vs Private bounty programs


    Some bug bounties programs are private: you need to be invited to participate.


    My limited experience with private bug bounty programs was extremely frustrating,
    and I swore to never (even try) participate again: I found SSRF that could have
    been escalated into something more serious. I found that the company running a
    bug bounty program, maybe I could take time to report. The program was private:
    you needed an invitation to participate. I had to contact the owners of the platform
    so many times. Unfortunately, it took too much time between the day I found the
    vulnerabilities and the day I was finally accepted to join the bug bounty program
    that I was working on something completely different, and I lost all the interest
    and energy to report these bugs


    Another anecdote about a private bug bounty program: I found an XSS on a subdomain
    of a big company that could have been used to steal session cookies. The company
    was not on any public bug bounty platform, I privately contacted them, explaining
    the vulnerability and asking if they offer bounties. They kindly replied that
    they, sometimes offer bounties, depending on the severity of the vulnerability.
    Apparently a kind of non-official bug bounty program. But not this time they said
    the vulnerability had already been reported. Fine, that happens all the time,
    no hard feelings. But, a few months later, I re-checked, and the vulnerability
    was still present, and many more. Once, twice shy, I didn''t report these new
    vulnerabilities, because again, it seemed not worth the time, energy, and mental
    health to deal with.


    All of that to say: bug bounty programs are great, but lose time with companies
    not listed on public bug bounty platforms, there is no accountability, and you
    will just burn time and energy (and become crazy in front of the indifference
    that you kindly help them secure their systems).


    Still, if you find vulnerabilities on a company''s systems and want to help them,
    because you are on a good day, **don''t contact them asking for money first!**
    It could be seen as extortion, and in today''s ambience with all the ransomware,
    it could bring you big problems.


    First, send a detailed report about the vulnerabilities, how to fix them, and
    only then, maybe, ask if they offer rewards.


    Unfortunately, not everyone understands that if (as a society) don''t reward the
    good guys for finding bugs, then only the bad guys have incentives to find and
    exploit those bugs.'
