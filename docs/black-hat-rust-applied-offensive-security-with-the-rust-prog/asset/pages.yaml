    # 10.7 Docker for offensive security


    Docker (which is the name of both the software and the company developing it),
    initially launched in 2013, and took the IT world by storm. Based on lightweight
    virtual containers, it allows backend developers to package all the dependencies
    and assets of an application in a single image and deploy it as is. They are a
    great and modern alternative to traditional virtual machines, usually lighter
    and can launch in under 100ms.


    By default, containers are not as secure as Virtual Machines, this is why new
    runtimes such as katacentors or gvisor emerged to provide isolation and allow
    to run untrusted containers on the same machine. Breaking the boundaries of a
    container is called an "escape".


    Container images are built using Dockerfile which is kind of a recipe.


    But today, Dockerfiles and the Open Containers Initiative (OCI) Image Format are
    not only used for containers. It has become a kind of industry standard for immutable
    and reproducible images. For example, the cloud provider fly.io is using Dockerfile
    to build Firecracker micro-VMs. You can use a Dockerfile as a kind of recipe to
    create cake. But better than a traditional recipe, you only need the Dockerfile
    to build an image that will be 100% of the time.


    Containers were and still a revolution. I believe it will take a long time before
    the industry moves towards a new packaging and distribution format, especially
    for backend applications such as our C&C server. Learning how it works and how
    to use it is an absolute prerequisite in today''s world.


    In this book, we won''t explore how to escape from a container, but instead, how
    to use Docker to sharpen our arsenal. In this chapter, we will see how to build
    a Docker image to easily package a server application, and in chapter 12, we will
    see how to use Docker to create a reproducible cross-compilation toolchain.'
