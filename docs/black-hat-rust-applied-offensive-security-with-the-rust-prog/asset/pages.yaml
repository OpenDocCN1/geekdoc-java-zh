    # ## 1.9.5 Ok(())


    You might also noticed that the last line of our main function does not contain
    the return keyword. This is because Rust is an expression-oriented language. Expressions
    evaluate to a value. Their opposites, statements, are instructions that do something
    and end with a semicolon ( ; ).


    So if your program reaches the last line of the main function, the main function
    will evaluate to Ok(()), which means: “success: everything went according to the
    plan”.


    An equivalent would have:


    ```

    return Ok(());

    ```


    but not:


    ```

    Ok(());

    ```


    Because Ok(()) is a statement due to the semicolon, and the main function no longer
    evaluates to its expected return type: Result.


    # ## 1.10 Mental models for approaching Rust


    Using Rust may require you to re-think all the mental models you learned while
    using other programming languages.


    # ## 1.10.1 Embrace the compiler


    The compiler will make you hard times when starting Rust. You will hate it. You
    will swear. You will wish to disable it and tell it to. Don''t.


    The compiler should be seen as an always available and friendly code-reviewer.
    So it''s not something preventing your code from compiling. Instead, it''s a friend
    that tells you that your code is defective and offers suggestions on how to fix
    it.


    I have witnessed a great improvement over the years of the messages displayed
    by the compiler, and I have no doubts that if today the compiler produces an obscure
    message for an edge case, it will be improved in the future.


    # ## 1.10.2 Just In Time learning


    Rust is a vast language that you won''t be able to master in a few weeks. And
    that''s totally fine. You don''t have to know everything to get started.'
