    the past two decades. You may find inside great inspiration when developing your
    own offensive tools. You can find the list at this address: https://github.com/black-hat-rust-bonuses/black-hat-rust-bonuses


    If you notice a mistake (it happens), something that could be improved, or want
    to share your ideas about offensive security, feel free to join the discussion
    on Github: https://github.com/skerkour/black-hat-rust'
