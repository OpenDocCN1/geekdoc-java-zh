    Figure 8.1: Executable and Linkable Format (ELF)


    Using multiple sections allows each section to have different characteristics.
    For example, the .text section is often marked as RX (Read-Execute) while the
    .data section as R (Read only). It permits enhancing security.


    # 8.3 Rust compilation process


    In order to be executed by the operating system, the Rust toolchain needs to compile
    the source code into the final executable.


    This process is roughly composed of 4 stages.


    **Parsing and Macro expansion:** The first step of compilation is to lex the source
    code and turn it into a stream of tokens. This stream of tokens is turned into
    and Abstract Syntax Tree (AST), macro are expanded into actual code, and the final
    AST is validated.


    **Analysis:** The second step is to proceed to type inference, trait solving,
    and type checking. Then, the AST (actually a High-Level Intermediate Representation
    (HIR), which is more compiler-friendly) is turned into Mid-Level Intermediate
    Representation (MIR) in order to borrow checking.


    Then, Rust code is analyzed for optimizations and monomorphized (remember generics?)
    it making copies of all the generic code with the type parameters replaced by
    concrete types).


    **Optimization and Code generation:** This is where LLVM intervenes: the MIR is
    converted into LLVM Intermediate Representation (LLVM IR), and LLVM proceeds to
    do more optimization on it, and finally emits machine code (ELF object or wasm).'
