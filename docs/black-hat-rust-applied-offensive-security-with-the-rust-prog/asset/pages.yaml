  md: '# Chapter 1


    # Introduction


    > Any sufficiently advanced cyberattack is indistinguishable from magic", unknown


    Whether it be in movies or mainstream media, hackers are often romanticized: they
    are depicted as black magic wizards, nasty criminals, or in the worst cases, as
    thieves with a hood and a crowbar.


    In reality, the spectrum of the profile of the attackers is extremely large, from
    the bored teenager exploring the internet to sovereign State’s armies as well
    as the unhappy former employee. As we will see, cyberattacks are not hard. Knowledge
    is simply unevenly distributed and jealously kept by the existing actors. The
    principal ingredients are a good dose of curiosity and the courage to follow your
    instinct.


    As digital is an always more important place in our lives, the impact and scale
    of cyberattacks will increase in the same way: we are helplessly witnessing during
    the current COVID-19 pandemic attacks against our hospitals which have real-life
    and dramatic consequences.


    It’s time to fight and prepare ourselves for the wars and battles of today (not
    tomorrow) and to understand that, in order to defend, there is no other way to
    put ourselves in the shoes of attackers and think how they think. What are their
    motivations? How can they break seemingly easily into any system? What do they
    do to their victims? From theory to practice, we will explore the arcanes of offensive
    security and build our own offensive tools with the Rust programming language.


    Why Rust?


    The world of security (and, more generally, software) is plagued by too many programming
    languages with too many footguns. You have to choose between fast and unsafe (C,
    C++) or slow but mostly safe (Python, Java...).'
