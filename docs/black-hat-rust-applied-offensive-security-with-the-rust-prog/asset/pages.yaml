    When implementing such a mechanism, don''t forget to sign your updates with your
    private key (See chapter 11). Otherwise, an attacker could take over your agents
    by spreading a compromised update.


    # 13.9.3 Virtual filesystem


    The more complex a RAT becomes, the more it needs to manipulate files:


    +   - configuration

    - sensible files to extract

    - cross-platform bundles

    - ...


    Unfortunately, using the filesystem of the host may leave traces and clues of
    the presence of the RAT. In order to circumvent that, a modern RAT could use an
    encrypted virtual filesystem.


    An encrypted virtual filesystem allows a RAT to hide its files from the host,
    and thus, eventual anti-virus engine and forensic analysts.


    The simplest way to implement an encrypted virtual filesystem is by using SQLCipher:
    an add-on for SQLite, which encrypts the database file on dist.


    # 13.9.4 Anti-Anti-Virus tricks


    Until now, we didn''t talk about detection.


    As you may certainly know, anti-viruses exist. Once a sample of your RAT is detected
    in the wild, it''s just a matter of days before it is flagged by all the anti-viruses.


    This is why we need to understand how anti-viruses work, in order to detect and
    bypass them. they mainly 3 methods to detect viruses:


    **Signature-based detection**: Anti-viruses check the hash of programs against
    a database of hashes known be viruses. This technique is the simplest to avoid
    a simple difference of 1 bit (some metadata of the binary, for example) modify
    the hash.


    **Shape analysis**: Anti-visrus check if the shape of a program is suspicious
    and looks like a virus (it has suspicious strings embedded for example, or it
    uses snippets of code known to be used by malware).


    **Behavior-based detection**: Anti-viruses execute unknown binaries in sandboxes
    in order to see if they behave like viruses (they try to access sensitive files,
    for example).'
