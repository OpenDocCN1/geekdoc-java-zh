  md: '# 10.2.5 Domain generation algorithms


    Domain generation algorithms (DGA) are not a distinct communication channel but
    rather a technique to improve the availability of the C&C in case of an attack.


    If the initial C&C is shut down, agents have an algorithm that will generate domain
    names and try to connect the C&C at these addresses. Operators then just have
    to register one of the domain names and migrate the C&C to it. If the C&C is again
    shut down, repeat.


    # 10.2.6 External Drives


    Some RATs and malware use external drives such as USB keys to exfiltrate data
    in order to target air-gapped systems (without internet access).


    ![](img/fd19beeb883de29aeed91588e61a7e14_240_0.png)


    Figure 10.4: using an external drive to escape an air-gapped network


    One example of such advanced RAT is the NewCore malware.


    # 10.3 Existing RAT


    Before designing our own RAT, let''s start with a quick review of the existing
    ones.


    # 10.3.1 Dark comet


    DarkComet is the first RAT I ever encountered, around 2013. Developed by Jean-Pierre
    Lesueur (known as DarkCoderSc), a programmer from France, it became (in)famous
    after being used by the Syrian government to steal information from the computers
    of activists fighting to overthrow it.'
