    From computers to smartphones passing by smart TVs, IoT such as cameras or “smart”
    fridges... Today’s computing landscape is kind of the perfect illustration of
    the word “fragmen-ntation”.


    Thus, if we want our operations to reach more targets, our RAT needs to support
    many of those platforms.


