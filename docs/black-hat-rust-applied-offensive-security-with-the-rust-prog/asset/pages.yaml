  md: '# 6.27.5 Dangerous / deprecated algorithms


    Some dangerous and deprecated algorithms such as md5 are still used in the wild.
    If you are auditing an application with access to the source code, a simple rg
    -i md5 suffices (using ripgrep).


    # 6.27.6 Methods with dangerous parameters


    There are two kinds of methods with dangerous parameters:


    +   - Cryptographic functions, where bad initialization or key reuse may lead
    to serious errors like AES-GCM-256 with reused nonces.

    - Data manipulation functions in memory unsafe languages such as memset or strcpy
    in C.


    # 6.27.7 Auth systems


    At the heart of every application, there are two vital systems:


    An authentication system to verify that users are who they pretend to be.


    And an authorization system to verify that users have the legitimate rights to
    execute the operations they want to execute.


    Authentication and authorization system are often complex and scattered over the
    place.


    When auditing an application, understand what operations require elevated privileges,
    and try to execute them without their privileges.


    # 6.27.8 Multiplayer games


    Game developers are not security engineers. They may focus their attention on
    gameplay, performance, and a lot of things in their domain of expertise, but not
    necessarily security.


    Furthermore, the networking stacks of some games are written in memory-unsafe
    languages, such as C or C++. This is the perfect recipe for disaster (memory-related
    vulnerabilities).


    As a side note, this is why you might not play multiplayer games on your work
    computer.


    # 6.27.9 Complex format parsing


    Parsing complex formats such as YAML is hard. This is why there are a lot of bugs
    found in parsing libraries. Sometimes, these bugs are actual vulnerabilities.'
