    #  14.5.2.3 How to succeed in bug bounty


    From what I observed, the simplest strategy to succeed in bug bounty is to focus
    on very (2 to 3) companies and have a deep understanding of their technology stack
    and architecture.


    For example, the bug hunter William Bowling seems to mostly focus on GitLab, GitHub,
    and Verizon Media. He is able to find rewarding bugs due to the advanced knowledge
    of and the technologies used by those companies.


    The second strategy, while less rewarding but more passive, is to simply run automated
    scanners (if allowed) on as many as possible targets and to harvest the low-hanging
    fruits such as subdomain takeovers and other configuration bugs. This strategy
    may not be the best if you want to make a primary income out of it. That being,
    with a little bit of luck, you could quickly make a few thousand dollars out of
    this.


