  md: "vector don't have the same shape.\n\n**Traits objects** solve precisely this\
    \ problem: when you want to use different concrete types (varying shape) adhering\
    \ to a contract (the trait), at runtime.\n\nInstead of using the objects directly,\
    \ we are going to use pointers to the objects in our collection. This time, the\
    \ compiler will accept our code, as every pointer has the same size.\n\nHow to\
    \ do this in practice? We will see below when adding modules to our scanner.\n\
    \n# 4.3.1 Static vs Dynamic dispatch\n\nSo, what is the technical difference between\
