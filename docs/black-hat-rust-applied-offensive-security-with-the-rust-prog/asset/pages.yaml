  md: '# # Chapter 11


    # # Securing communications with end-to-end encryption


    In today''s world, understanding cryptography is a prerequisite for anything serious
    related to technology, and especially security. From credit cards to cryptocurrencies,
    passing by secure messengers, password managers, and the web itself, cryptography
    is everywhere and provides bits of security in the digital world where everything
    can be instantly transmitted and copied almost infinitely for a cost of $0.


    Do you want the words you send to your relatives to be publicly accessible? Do
    you want your credit card to be easily copied? Do you want your password to leak
    any bad actor listening to your network? Cryptography provides technical solutions
    to these kinds of problems.


    End-to-end encryption is considered the holy grail of communication security because
    it''s the closest we achieve to mimicking real life communication. In a conversation,
    the invited persons are able to join the circle and take part in the discussion.
    Any intruder will be quickly ejected. End-to-end encryption provides the same
    guarantees, only invited parties can listen to the conversation and participate.
    But, as we will see, it also adds complexity and is not bulletproof.


    # ## 11.1 The C.I.A tri triad


    The cyberworld is highly adversarial and unpardonable. In real life, when you
    talk with someone else, only you and your interlocutor will ever know what you
    talked about. On the internet, when you talk with someone, your messages are saved
    in a database and may be accessible by employees of the company developing the
    app you are using, some government agents, or if the database is hacked by the
    entire world.'
