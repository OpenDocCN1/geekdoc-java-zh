  md: "# 4.5 Logging\n\nWhen a long-running program encounters a non-fatal error,\
    \ we may not necessarily want to stop its execution. Instead, the good practice\
    \ is to log the error for further investigation and debugging.\n\nThere are two\
    \ extraordinary crates for logging in Rust:\n\n+   - log: for simple, textual\
    \ logging.\n- slog: for more advanced structured logging.\n\nThese crates are\
    \ not strictly speaking loggers. You can add them to your programs as follows:\n\
    \nch_04/snippets/logging/src/main.rs\n\n```\nfn main() {\n    log::info(\"message\
    \ with info level\");\n    log::error(\"message with error level\");\n    log::debug(\"\
    message with debug level\");\n}\n```\n\nBut when you run the program:\n\n$ cargo\
    \ run\n\n+   - Compiling logging v0.1.0 (black-hat-rust/ch_04/snippets/logging)\n\
    - Finished dev [unoptimized + debuginfo] target(s) in 0.56s\n- Running `target/debug/logging`\n\
    \nNothing is printed...\n\nFor actually displaying something, you need a logger.\
    \ The log and slog crates are only facades.\n\nThey provide a unified interface\
    \ for logging across the ecosystem, but they do not actually log anything. For\
    \ that, you need a logger crate.\n\n# 4.5.1 env_logger\n\nYou can find a list\
    \ of loggers in the document log crate: https://github.com/rust-lang/log#in-executables.\n\
    \nFor the rest of this book, we will use env_logger because it provides great\
    \ flexibility and precision about what we log, and more importantly, it is easy\
    \ to use."
