  md: '# 11.19.1.2.3 XChaCha20-Poly1305 Notice the X ChaCha20-Poly1305


    Its meaning is eXtended nonce : instead of a 12 bytes (96 bits) nonce, it uses
    a longer one of 24 bytes (192 bits).


    Why?


    In order to avoid reuse with the same key (i.e. if you want to encrypt a loot
    of messages with the same key) using random nonces. Nonce reuse is fatal for the
    security of the algorithm.


    Indeed, due to the birthday paradox, when using random nonces with ChaCha20Poly1305
    , "only" 2 ^ (96 / 2) = 2 ^ 48 = 281,474,976,710,656 messages can be encrypted
    using the same secret key, it''s a lot, but it can happen rapidly for network
    packets.


    You can read the RFC online: https://datatracker.ietf.org/doc/html/draft-irtf-cfr-xchacha


    # 11.19.1.2.4 Final choice Our cipher of choice is XChaCha20Poly1305 ,because
    it''s simple to understand (and audit), fast, and the hardest to misuse, which
    are, in my opinion, the qualities to look for when choosing a ciph.


    I''ve published a benchmark comparing the different AEAD implementations in Rust
    on my blog.


    # 11.19.1.3 Key exchange


    Like Ed25519 , because it''s an industry standard, we are going to use X25519
    for key exchange.


    The problem with X25519 is that the shared secret is not a secure random vector
    of data, so it can''t be used securely as a secret key for AEAD. Instead, it''s
    a really big number encoded on 32 bytes. Its entropy is too low to be used securely
    as an encryption key.


    This is where comes into play our primitive: a Key Derivation Function.


    # 11.19.1.4 Key Derivation Function


    There are a lot of Key Derivation functions available. As before, we will go for
    what is, in our opinion, the simplest to understand and hardest to misuse: blake2b
    .


    # 11.19.1.5 Summary


    +   - Signature: Ed25519

    - Encryption: XChaCha20Poly1305

    - Key Exchange: X25519

    - Key Derivation Function: blake2b'
