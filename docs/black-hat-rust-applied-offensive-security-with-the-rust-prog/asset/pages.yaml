  md: "The watch channel is similar to a broadcast channel with capacity 1.\n\n# 3.8.2\
    \ Arc<Mutex<T>>\n\nFinally, the last important thing to know is how to use mutexes\
    \ in async Rust.\n\nA mutex allows programmers to share a variable between threads\
    \ (and thus async tasks). But, due to Rust's ownership model, a Mutex needs to\
    \ be wrapped with std::sync::Arc smart pointer.\n\nWhy do we need a mutex in the\
    \ first place? Because if two threads try to access and/modify the same variable\
    \ (memory cache) at the same time, it leads to a data race. A class of bugs is\
    \ very hard to find and fix.\n\ndocs.rs/tokio/latest/tokio/sync\n\n```\nuse tokio::sync::Mutex;\n\
    use std::sync::Arc;\n\n#[tokio::main]\nasync fn main() {\n    let data1 = Arc::new(Mutex::new(0));\n\
    \    let data2 = Arc::clone(&data1);\n\n    tokio::spawn(async move {\n      \
    \  let mut lock = data2.lock().await;\n        *lock += 1;\n    });\n\n    let\
    \ mut lock = data1.lock().await;\n    *lock += 1;\n}\n```\n\nA great thing to\
    \ note is that RAII (remember in chapter 01) comes in handy with mutexes. We don't\
    \ have to manually unlock them like in other programming languages. They will\
    \ automatically unlock when going out of scope (when they are dropped).\n\n# 3.8.2.1\
    \ Retention\n\nThe problem with mutexes is lock retention: when a task locks that\
    \ other tasks have to wait for the same mutex too much time.\n\nIn the worst case,\
    \ it can lead to deadlock: All tasks are blocked because a single task doesn't\
    \ release the mutex lock."
