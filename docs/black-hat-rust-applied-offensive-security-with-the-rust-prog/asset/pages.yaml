- img_proc: true
  md: '![](img/fd19beeb883de29aeed91588e61a7e14_121_0.png)


    Figure 5.4: The architecture of a crawler


    **Start URLs**: you need a list of seed URLs to start the crawl. For example,
    the root page of your target''s website.


    **Spiders**: this is the specialized part of a crawler, tuned for a specific site
    or task. For example, we could implement a spider to get all the users of a GitHub
    organization or all the vulnerabilities of a specific product. A spider is itself
    composed of 2 parts:


    +   - The scraper that fetches the URLs, parses the data, turns it into structured
    data, and a list of URLs extracted from the document to continue the crawl.

    - The processor that processes the structured data: saving it to a database, for
    example.


    The biggest advantage of splitting the responsibilities of a spider into 2 distinct
    stages is that they can run with different concurrency levels depending on your
    expected workload. For example, you could have a pool with 3 concurrent scrapers
    not to flood the website while crawling and trigger bot detection systems, but
    100 concurrent processors.


    **A Control loop**: this is the generic part of a crawler. Its job is to dispatch
    data between the scrapers and the processors and queue URLs.


