  md: "# Chapter 4\n\n# Adding modules with trait objects\n\nImagine that you want\
    \ to add a camera to your computer which is lacking one. You buy a webcam and\
    \ connect it via a USB port. Now imagine that you want to add storage to the same\
    \ computer. You buy an external hard drive and also connect it via a similar USB\
    \ port.\n\nThis is the power of generics applied to the world of physical gadgets.\
    \ A USB port is a generic port, and an accessory that connects to it is a **module**.\
    \ You don't have a specific port for a specific webcam vendor, another port for\
    \ another vendor, another one for one vendor of USB external drives, and so on...\
    \ You can connect any USB device to any port and have it working (minus software\
    \ compatibility...). Your PC vendors don't have to plan for any module you want\
    \ to connect to your computer. They just have to follow the generic and universal\
    \ USB specification.\n\nThe same applies to code. A function can perform a specific\
    \ task against a specific type, and a generic function can perform a specific\
    \ task on *some* (more on that later) types.\n\n```\nadd can add two i64 variables.\n\
    fn add(x, y: i64) -> i64 {\n    return x + y;\n}\n```\n\nHere, `add` can add two\
    \ variables of any type.\n\n```\nfn add<T>(x: T, y: T) -> T {\n    return x +\
    \ y;\n}\n```\n\n**But this code is not valid:** it makes no sense to add two planes\
    \ (for example). And the compiler don't even know how to add two planes! This\
    \ is where **constraints** come into play."
