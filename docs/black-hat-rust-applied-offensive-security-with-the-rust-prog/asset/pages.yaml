  md: '# ## 6.24 Logic error


    A logic error is any error that allows an attacker to manipulate the business
    logic of an application. For example, an attacker might be able to order many
    items in an eShope at a price of 0, or an attacker might be able to fetch sensitive
    data that normally only admins are allowed to fetch.


    Beware thanks to the compiler, this is certainly the kind of bugs you may produce
    the most when developing in Rust. This is why writing tests is important!


    No compiler will ever be to catch logic errors.


    # ### 6.24.1 Case studies


    +   - Availing Zomato gold by using a random third-party wallet_id

    - OLO Total price manipulation using negative quantities


    # ## 6.25 Race condition


    A race condition occurs when a program relies on concurrent operations, and the
    program relies on the sequence or timing of operations to produce correct output.


    The corollary is that if for some reason, lack of synchronization, for example,
    the sequence and timing of operations is changed, an error happens.


    For example, trying to read a value after having updated it in an eventually-consistent
    database.


    # ### 6.25.1 Why it’s bad


    Most of the time, an exploitable race condition occurs when verification is done
    concurrently of an update (create or delete) operation.


    # ### 6.25.2 Case studies


    +   - Race Condition of Transfer data Credits to Organization Leads to Add Extra
    Data Credits to the Organization

    - Race Condition allows to redeem multiple times gift cards which leads to free
    “money”

    - Ability to bypass partner email confirmation to take over any store given an
    employee email'
