  md: '# 2.3.1 Subdomain enumeration


    The method yielding the best results for minimal efforts regards public assets
    discovery subdomains enumeration.


    Indeed, nowadays, with the takeoff of cloud services, more and more companies
    no longer require a VPN to access their private services. They are publicly available
    through HTTPS.


    The most accessible source of subdomains is certificate transparency logs. When
    a Certificate Authority (CA) issues a web certificate (usage with HTTPS traffic,
    for example), the certificates are saved in public, transparent logs.


    The legitimate use of these logs is to detect rogue certificate authorities who
    may deliver certificates to wrong entities (imagine a *.google.com being delivered
    to a malicious hacking team, it would mean that they will be to Man In The Middle
    all the Google domains without detected).


    On the other hand, this transparency allows us to automate a chunk of our job.


    For example, to search for all the certificates issued for kerkour.com and its
    subdomains, go to https://crt.sh and search for %.kerkou.com (% being the wildcard
    character) https://crt.sh/?q=%%25.kerkou.com.


    A limitation of this technique is its inability to find non-HTTP(S) services (such
    as email or VPN services), and wildcard subdomains (*.kerkou.com , for example)
    which may obfuscate the actually used subdomains.


    As an anecdote, the fastest security audit I ever performed was a company that
    left its GitLab instance publicly accessible, to the world. I found the GitLab
    instance with basic subdomain enumeration. When I created an account, I got to
    all the (private) code repositories of the company, and a lot of them contained
    secrets and cloud tokens committed in code which could have led to the full takeover
    of the company''s infrastructure.


