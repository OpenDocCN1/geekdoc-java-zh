  md: "# ### 9.4.3 Bit squatting\n\nAnd last but not least, bit squatting.\n\nI personally\
    \ find this kind of attack mind-blowing!\n\nThe idea is that computers suffer\
    \ from memory errors where one or more bits are corrupted, they are different\
    \ than their expected value. It can come from electromagnetic interference or\
    \ cosmic rays (!).\n\nA bit that is expected to be 0 , may flips to 1 , and vice\
    \ versa.\n\n| 01100001 | 01100010 | 01100011 | 00101110 | 01100011 | 01101111\
    \ | 01101001 |\n|---|---|---|---|---|---|---||\n| a | b | c | . | c | o | m |\n\
    | 01100001 | 01100011 | 01100011 | 00101110 | 01100011 | 01101111 | 01101101 |\n\
    |---|---|---|---|---|---|---||\n| a | c | c | . | c | o | m |\n\nFigure 9.2: Bit\
    \ flip\n\nIn this example, attackers control acc.com , they may receive originally\
    \ destined for abc.com without any human error!\n\nHere is a small program to\
    \ generate all the \"bitshifted\" and valid alternatives of a given domain: cl_09/dnsquat/src/main.rs\n\
    \n```\nuse std::env;\n\nfn bitflip(charac: u8, pos: u8) -> u8 {\n    let shiftval\
    \ = 1 << pos;\n    charac ^ shiftval\n}\n\nfn is_valid(charac: char) -> bool {\n\
    \    charac.is_ascii_alphanumeric() || char == '-'\n}\n```"
