    # 11.18 Our threat model


    # 11.18.1 What are we working on


    We are working on a remote control system comprised of 3 components: an agent,
    a server, and a client.


    The agent is executed on our targets'' machines: a highly adversarial environment.


    The client is executed on the machines of the operators. Its role is to send commands
    to the agent.


    The server (or C&C) is executed in an environment normally under the control of
    the opera-'
