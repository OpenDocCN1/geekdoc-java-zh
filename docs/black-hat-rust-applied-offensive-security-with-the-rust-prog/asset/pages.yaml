  md: '# # Chapter 6


    # # Finding vulnerabilities


    # ## 6.1 What is a vulnerability


    The OWASP project defines a vulnerability as follows: A vulnerability is a hole
    or a weakness in the application, which can be a design flaw or an implementation
    bug, that allows an attacker to cause harm to the stakeholders of an application


    What is a vulnerability depends on your threat model (What is a threat model?
    We will learn more about that in chapter 11).


    For example, this bug was rewarded $700 for a simple DNS leak. In the context
    of privacy-preserving software, this is rather late and may endanger people.


    In the same vein, a tool such as npm audit may report a loot of vulnerabilities
    in your dependencies. It may not be vulnerable at all, even your own software
    uses those vulnerable dependencies, it may not be called or called in a way that
    the vulnerability cannot be triggered.


    # ## 6.2 Weakness vs Vulnerability (CWE vs CVE)


    CVE is a list of records — each containing an identification number, a description,
    and at least one public reference — publicly cybersecurity vulnerabilities and
    exposures.


    You can find the list of existing CVEs on the site https://www.cvedetails.com
    (that we have scraped in the previous chapter).


    CWE (Common Weakness Enumeration) is a community-developed list of software and
    hardware weakness types.


    You can find the list of CWEs online: https://cwe.mitre.org.'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'Thus, a weakness (CWE) is a pattern that may lead to a vulnerability (CVE).


    Not all vulnerabilities have a CVE ID associated. Sometimes because the person
    who found the vulnerability thinks it''s not worth the hassle, sometimes, because
    they don''t want the vulnerability to be publicly disclosed.


    # 6.3 Vulnerability vs Exploit


    While a vulnerability is a hole in an application, an exploit is a chunk of code
    that takes advantage of that for offensive purposes.


    Writing an exploit is known as **weaponization**: the process of turning a software
    bug into an actionable digital weapon.


    Writing exploits is a subtle art that requires deep knowledge of the technology
    where the vulnerability has been found.


    For example, an exploit for an XSS vulnerability (as we will see below) requires
    deep knowledge of the web and JavaScript ecosystem to bypass the restrictions
    imposed by the vulnerability, Web Application Firewalls (WAF), and browsers, such
    as a limited number of characters.


    # 6.4 0 Day vs CVE


    Not all vulnerabilities are public. Some are discovered and secretly kept in order
    to be weaponized or sold to people that are going to weaponize them.


    A non-public, but known by some, exploit is called a 0 Day.


    More can be read on the topic in the excellent Wikipedia''s article Market for
    zero-day exploits.


    On the other hand, a CVE is a known vulnerability affecting a product, even if
    no public exploit is available for this vulnerability.


    # 6.5 Web vulnerabilities


    I don''t think that toy examples of vulnerabilities teach anything.


    This is why instead of crafting toy examples of vulnerabilities for the sole purpose
    of this book, vulnerabilities that you will never ever encounter in a real-world
    situation, I instead curated what I think is among the best writeups about finding
    and exploiting vulnerabilities affecting real products and companies.'
