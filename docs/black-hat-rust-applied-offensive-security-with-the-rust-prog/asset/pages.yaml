  md: '# ## 1.1.2 Political attacks


    Sometimes, attacks have the only goal of spreading a political message. Most of
    the time, they materialize as website defacements where websites’ content is replaced
    with the political message, or denial-of-service attacks where a piece of infrastructure
    or a service is made unavailable.


    # ## 1.1.3 Pentest


    Pentest, which stands for Penetration Testing, may be the most common term used
    to designate security audits. One downside of pentests is that sometimes they
    are just a means to check boxes for compliance purposes, are performed using simple
    automated scanners, and may leave bits open.


    # ## 1.1.4 Red team


    Red teaming is seen as an evolution of traditional pentests: attackers are given
    permissions and a broader scope like phishing employees, using implants or even
    physical penetration. The idea is: in order to protect against attacks, auditors
    have to think and operate like real attackers.


    # ## 1.1.5 Bug bounty


    Bug bounty programs are the uberization of security audits. Basically, companies
    say: “Try to hack me. If you find something and report it to me, I will pay you”.


    As we will see in the last chapter, bug bounty programs have their limits and
    are sometimes used by companies as virtue signaling instead of real security measures.


    # ## 1.1.6 Cybercrime


    Cybercrime is definitely the most growing type of attack since the 2010s. From
    selling personal data on underground forums to botnets and ransomwares or credit
    card hacking, criminal networks have found creative ways of acting. An important
    peak occurred in 2017, when the NSA tools and exploits were leaked by the mysterious
    group “Shadow Brokers”, which were then used in other malware like WannaCry and
    Petya.


    Despite the strengthening of online services to reduce the impact of data-stealing(today,
    it is far more difficult to take advantage of a stolen card number to a few years
    ago), cryptonimals always find new ways to monetize their wrongdoings, especially
    with cryptocurrencies.'
