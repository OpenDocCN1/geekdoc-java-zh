    lot more people are able to understand your code.


    # 14.1.2 Macros


    I don''t like macros either. Don''t get me wrong. Sometimes they provide awesome
    usability improvements like `println!`, `log::info!`, or `#[derive(Deserialize,
    Serialize)]`. But I believe that most of them, they try to dissipate complexity
    that should be first cut or solved with better abstraction and code architecture.


    Rust provides **Declarative macros** ending with a `!` such as `println!` and
    **Procedural macros** as `#[tokio::main]`.


    The *Rust Book* provides everything you need to get started writing macros, but
    think twice before writing a macro.


    # 14.1.3 Embedded


    Really cool stuff is on the internet about how to use microcontrollers to create
    hacking devices, such as on `hackaday`, `mg.lol` and `hack5`. I believe that Rust
    has a bright future in these areas, but unfortunately, I have never done any embedded
    development myself, so this topic doesn''t have its place in this book.


    If you want to learn, *Ferrous Systems''* blog contains a list of content about
    using Rust for embedded systems.


    # 14.1.4 Ethics


    Ethics always been a complex topic debated since the first philosophers and is
    highly dependent on the culture, so I have nothing to bring to the table. That
