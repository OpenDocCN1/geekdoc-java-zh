  md: "By using an associated type, we simplify the usage of the trait and communicate\
    \ more clearly how it works:\n\n```\n#[async_trait]\npub trait Spider {\n  type\
    \ Item;\n\n  fn name(&self) -> String;\n  fn start_urls(&self) -> Vec<String>;n\
    \  async fn scrape(&self, url: &str) -> Result<Vec<Self::Item>, Vec<String>>,\n\
    \    Error>;n  async fn process(&self, item: Self::Item) -> Result<(), Error>;\n\
    }\n\nfn use_spider<S: Spider>(spider: S) {\n  // ...\n}\n```\n\nLike with type\
    \ parameters, you can constrain to associated types:\n\n```\npub trait Spider\
    \ {\n  type Item: Debug + Clone;\n\n  fn name(&self) -> String;\n  fn start_urls(&self)\
    \ -> Vec<String>;n  async fn scrape(&self, url: &str) -> Result<Vec<Self::Item>,\
    \ Vec<String>>,\n    Error>;n  async fn process(&self, item: Self::Item) -> Result<(),\
    \ Error>;\n}\n```\n\n# 5.12 Atomic types\n\nAtomic types, like mutexes, shared-memory\
    \ types: they can be safely shared between multiple threads.\n\nThey allow not\
    \ to use a mutex, and all the ritual around `lock()` which may introduce bugs\
    \ like deadlocks.\n\nYou should use an atomic if you want to share a boolean or\
    \ an integer (such as a counter) across threads instead of a `Mutex<bool>` or\
    \ `AtomicU64`.\n\nOperations on atomic types require an ordering argument. The\
    \ reason is out of topic of this book, but you can read more about it this excellent\
    \ post: Explaining Atomics in Rust.\n\nTo keep things simple, use `Ordering::SeqCst`\
    \ which provides the strongest guarantees."
