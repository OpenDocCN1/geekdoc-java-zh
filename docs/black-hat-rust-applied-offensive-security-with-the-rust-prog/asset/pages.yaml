    It has the advantage of being extremely simple to implement, as it’s not a stream,
    as a simple request-response scheme, and thus is extremely robust, does not require
    auto-reconnection, and can handle network errors gracefully. Also, contrary to
    short polling, polling is less wasteful regarding resources usage.


    The only downside is that it''s not fast as websockets regarding latency, but
    it does not matter for our use case (it would matter if we were designing a real-time
    game).


    Long polling is extremely efficient in Rust in contrary to a lot of other programming
    languages. Indeed, thanks to `async`, very few resources (a simple `async Task`)
    are used per open connection, while a lot of languages use a OS thread.


    Also, as we will see later, implementing graceful shutdowns for a server serving
    long-polling requests is really easy (unlike with WebSockets or SSE).


    Finally, as long-polling is simple HTTP requests, it''s the technique that has
    the highest chances of not being blocked by some kind of aggressive firewall or
    network equipment..


    It is for all reasons, but simplicity and robustness being the principal ones,
    that we choose long-polling to implement real-time communications for our RAT.


