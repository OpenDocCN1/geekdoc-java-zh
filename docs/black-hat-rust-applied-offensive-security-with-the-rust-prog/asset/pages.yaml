  md: "# 4.2.5 The derive attribute\n\nWhen you have a lot of traits to implement\
    \ for your types, it can quickly become tedious and may complexify your code.\n\
    \nFortunately, Rust has something for it: the derive attribute.\n\nBy using the\
    \ derive attribute, we are actually feeling our types to a Derive macro which\
    \ is a kind of procedural macro.\n\nThey take code as input (in this case, our\
    \ type), and create more code as output. At compile time.\n\nThis is especially\
    \ useful for data deserialization: just by implementing the Serialize and Deserialize\
    \ traits from the serde crate, the (almost) universally used serialization library\
    \ in Rust, we can then serialize and deserialize our types to a lot of data formats:\
    \ JSON, YAML, TOML, BSON and so on...\n\n```\nuse serde::(Serialize, Deserialize);\n\
    ```\n\n```\n#[derive(Debug, Clone, Serialize, Deserialize)]\nstruct Point {\n\
    \    x: u64,\n    y: u64,\n}\n```\n\nWithout much effort, we just implemented\
    \ the Debug, Clone, Deserialize traits for our struct Point.\n\nOne thing to note\
    \ is that all subfields of struct need to implement the traits:\n\n```\nuse serde::(Serialize,\
    \ Deserialize);\n```\n\n```\n// Not possible:\n#[derive(Debug, Clone, Serialize,\
    \ Deserialize)]\nstruct Point<T> {\n    x: T,\n    y: T,\n}\n```\n\n```\n// instead,\
    \ do this:\nuse serde::(Serialize, Deserialize);\nuse core::fmt::Debug; // Import\
    \ the Debug trait\n```\n\n```\n#[derive(Debug, Clone, Serialize, Deserialize)]\n\
    struct Point<T: Debug + Clone + Serialize + Deserialize>\n    x: T,\n```"
