  md: "```\nprocess(&processor2, 2);\n}\n```\n\nThe compiler generates a specialized\
    \ version for each type you call the function with and then replaces the sites\
    \ with calls to these specialized functions.\n\nThis is known as monomorphization.\n\
    \nFor example the code above roughly equivalent to:\n\n```\nfn processor(processor:\
    \ &Risc, x: i64) {\n    let result = processor.compute(x, 42);\n    println!(\"\
    {{}\", result);\n}\n```\n\n```\nfn processor_Cisc(processor: &Cisc, x: i64) {\n\
    \    let result = processor.compute(x, 42);\n    println!(\"{{}\", result);\n\
    }\n```\n\nIt's the same as if you were implementing these functions yourself.\
    \ This is known as static dispatch. The type selection is made statically at compile\
    \ time. It provides the best runtime performance.\n\nOn the other hand, when you\
    \ use a trait object: ch_04/snippets/dispatch/src/dynamic.rs\n\n```\ntrait Processor\
    \ {\n    fn compute(&self, x: i64, y: i64) -> i64;\n}\n```\n\n```\nstruct Risc\
    \ {}\nimpl Processor for Risc {\n    fn compute(&self, x: i64, y: i64) -> i64\
    \ {\n        x + y\n    }\n}\n```\n\n```\nstruct Cisc {}\nimpl Processor for Cisc\
    \ {\n    fn compute(&self, x: i64, y: i64) -> i64 {\n        x * y\n    }\n}\n\
    ```"
