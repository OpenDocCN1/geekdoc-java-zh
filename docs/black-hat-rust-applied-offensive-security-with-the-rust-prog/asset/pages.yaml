    # ## 5.21.2 Use a swappable store for the queues


    Another improvement for our crawler would be to use a persistent, on-disk store
    for our queues. Redis or PostgreSQL, for example.

    It would enable crawls to be paused and started at will, queues to grow past the
    available memory of our system, and jobs to be distributed among multiple machines.


    # ## 5.21.3 Error handling and retries


    To keep the code "clean" we didn''t implement any error handling nor retry mechanism.
    If, for any reason, a crawled website is temporarily unavailable, you may want
    to retry fetching it later.


    # ## 5.21.4 Respecting robots.txt


    +   - Fetch `robots.txt` on start.

    - Parse it and turn it into a set of rules.

    - For each queued URL, check if it matches a rule.


    # ## 5.22 Summary


    +   - OSINT is repetitive and thus should be automated

    - Use atomic types instead of integers or boolean wrapped by a mutex

    - It''s very hard to defend against scappers.'
