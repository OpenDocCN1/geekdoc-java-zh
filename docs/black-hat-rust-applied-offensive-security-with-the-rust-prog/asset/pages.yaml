    # 12.2 Cross-platform Rust


    Thankfully, Rust makes it easy to write code that will be conditionally compiled
    depending on the platform it''s compiled for.


    # 12.2.1 The cfg attribute


    The cfg attribute enables the conditional compilation of code. It supports many
    options so you can choose on platform to run which part of your code.


    For example: #[cfg(target_os = "linux")], #[cfg(target_arch = "aarch64")], #[cfg(target_pointer_width
    = "64")];


    Here is an example of code that exports the same install function but picks the
    right one depending on the target platform.


    ch_12/rat/agent/src/install/mod.rs


