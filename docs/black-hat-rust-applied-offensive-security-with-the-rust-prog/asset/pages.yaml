  md: '# 11.2 Threat modeling


    Threat modeling is the systematic analysis of potential risks and attack vectors
    in order to develop defenses and countermeasures against these threats.


    Put another way, it''s the art of finding against who and what you defend and
    what can go wrong in a system.


    According to the Threat Modeling Manifesto, at the highest levels, when we threat
    model, we ask four key questions:


    +   1. What are we working on?

    2. What can go wrong?

    3. What are we going to do about it?

    4. Did we do a good enough job?


    Threat modeling must be done during the design phase of a project, it allows to
    pinpoint issues that require mitigation.


    # 11.3 Cryptography


    Cryptography, or cryptology (from Ancient Greek: romanized: kryptós “hidden, secret";
    and graphein, “to write”, or - -logia, “study”, respectively), is the practice
    and study of techniques for secure communication in the presence of three parties
    called adversaries.


    Put another way, cryptography is the science and art of sharing confidential information
    with trusted parties.


    Encryption is certainly the first thing that comes to your mind when you hear
    (or read) the word cryptography, but, as we will see, it''s not the only kind
    of operation needed to secure a system.


    # 11.3.1 Primitives and protocols


    Primitives are the building blocks of cryptography. They are like lego bricks.


    Examples of primitives: SHA-3, Blake2b, AES-256-GCM.


    Protocols are the assembly of primitives in order to secure an application. They
    are like a house made of lego bricks.


    Examples of protocols: TLS, Signal, Noise.'
  merge: -1
