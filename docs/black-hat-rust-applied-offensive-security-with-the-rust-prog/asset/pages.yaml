  md: '# 5.9 Crawling the web


    First, a term disambiguation: what is the difference between a scraper and a crawler?

    Scraping is the process of turning unstructured web data into structured data.


    ![](img/fd19beeb883de29aeed91588e61a7e14_120_0.png)


    Figure 5.3: Web scraping


    Crawling is the process of running through a lot of interlinked data (web pages,
    for example).

    In practice, it''s most of the time useless without crawling through multiple
    pages or to crawl without scraping content, so we can say that each crawler is
    a scraper, and almost every scraper is a crawler.


    Some people prefer to call a scraper a crawler for a specific website and a crawler
    that crawls the entire web. Anyway, I think that it''s nitpicking, so we won''t
    spend more time debating.


    For the rest of this book, we are going to use the term **crawler**.


    So, why crawl websites to scrape data?


    It''s all about **automation**. Yes, you can manually browse the 1000s pages of
    a website and manually copy/paste the data in a spreadsheet.

    Or, you could build a specialized program, the crawler, that will do it for you
    in a blink.


    # 5.9.1 Designing a crawler


    A crawler is composed of the following parts:'
  merge: -1
