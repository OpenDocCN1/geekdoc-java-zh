- img_proc: true
  md: '# ## 9.1.1 The Art of Persuasion


    More than 2000 years ago, the Greek philosopher Aristotle wrote what may be the
    most crucial piece of work on persuasion: Rhetoric. He explains that there are
    three dimensions of a persuasive discourse:


    +   * Ethos (credibility)

    * Pathos (emotion)

    * Logos (reason)


    # ## 9.1.2 Ethos (credibility)


    In order to persuade, your target has to see you as a credible authority on a
    topic or for asking something.


    Will a secretary ask for the credentials of a production database?


    No!


    So as phishing is more about asking someone to do something than spreading ideas,
    you have to build a character that is legitimate to make the requests you want
    to make.


    # ## 9.1.3 Pathos (emotion)


    Once credibility is established, you need to create an emotional connection with
    your target. This is a deep and important topic, and we will learn more about
    it below.


    For now, remember that one of the best ways to create an emotional connection
    is storytelling.


    You have to invent a credible story with a disruptive element that only your target
    can solve.


    # ## 9.1.4 Logos (reason)


    Finally, once the connection with the other person is established, you have to
    explain why request or idea is important. Why should your target care about your
    request or idea?


    Why should this system administrator give you a link to reset an account''s credentials?


    Maybe because you are blocked and won''t be able to work until you are able to
    reset your credentials.


    # ## 9.1.5 Exploiting emotions


    Our brain is divided into multiple regions responsible for different things about
    our function-ing.'
  merge: -1
