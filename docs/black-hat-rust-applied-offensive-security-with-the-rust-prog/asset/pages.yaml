  md: '# 9.3.1.1 Please check your yearly bonus


    The idea is to let the victim believe to receive their yearly salary bonus, they
    have to check something on the intranet of the company. Of course, we will send
    a link directing to a phishing portal in order to collect the credentials.


    # 9.3.1.2 Here is the document you asked me


    The idea is to let the victim believe that someone from inside the company just
    sent them the document they asked. It may especially work in bigger companies
    where processes are often chaotic.


    This technique is risky if the victim didn''t ask for a document, it may raise
    suspicion.


    # 9.4 Watering holes


    Instead of phishing for victims, we let the victims come to us.


    In marketing, it''s called inbound marketing.


    The strategy is either to trick our victims or create something (a website, a
    Twitter account...) so compelling for our targets that they will engage with it
    without us having to ask.


    There are some particularly vicious kinds of watering holes:


    # 9.4.1 Typos squatting


    Have you ever tried to type google.com in your web search bar but instead typed
    google.com ? This is a typo.


    Now imagine our victim wants to visit mybank.com but instead types mybank .com
    . If an attacker owns the domain mybank.com and sets a website absolutely similar
    to mybank.com collects credentials instead of providing legitimate banking services.


    The same can be achieved with any domain name! Just look at your keyboard: Which
    keys are too close and similar? Which typos do you do the most often?


    # 9.4.2 Unicodes domains


    Do you see the difference between apple.com and pple.com ?


    The second example is the Unicode Cyrillic (U+0430) rather than the ASCII a (U+0041)!


    This is known as an homograph attack.'
