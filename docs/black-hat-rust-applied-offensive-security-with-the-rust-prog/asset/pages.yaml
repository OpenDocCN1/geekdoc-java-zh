  md: '# ## 6.6 Injections


    Injections is a family of vulnerabilities where some malicious payload can be
    injected into the application for various effects.


    **The root cause of all injections is the mishandling of the programs’ inputs.**


    What are examples of a program''s input?


    +   - For a web application, it can be the input fields of a form or an uploaded
    file.

    - For a VPN server, it''s the network packets.

    - For a wifi client, it''s, among other things, the name of the detected Wifi
    networks.

    - For an email application, it''s the emails, its metadata, and the attachments.

    - For a chat application, it''s the messages, the names of the users, and the
    deata.

    - For a video player, it''s the video files and the subtitle files.

    - For a music player, the audio files and their metadata.

    - For a terminal, it''s the input of the user and the output of the command-line
    applications.


    # ## 6.7 HTML injection


    HTML injection is a vulnerability where an attacker is able to inject arbitrary
    HTML code into the responses of an application rendering HTML code.


    ![](img/fd19beeb883de29aeed91588e61a7e14_142_0.png)


    Figure 6.1: HTML injection


    It can be used for defacement or tricking the users into doing harmful (for them)
    actions, such as replacing a login form with a malicious one.'
