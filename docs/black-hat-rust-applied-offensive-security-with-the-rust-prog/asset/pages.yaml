    Figure 13.2: Cross-platform worm


    For example, from a x86_64 computer running the Windows OS to an ARM server running
    the Linux IS. Or from a laptop running macOS to a smartphone running iOS.


    One example of such a cross-platform worm is Stuxnet. It uses normal computers
    to spread and reach industrial machines of Iran''s nuclear program that were in
    an air-gapped network (without access to the global internet). It''s a common
    security measure for sensitive infrastructure.


    As executables are usually not compatible between the platforms, a cross-platform
    worm needs to be compiled for all the targeted architecture.


    Then you have 2 choices:


    Either it uses a central server to store the bundle of all the compiled versions
    of itself, when infecting a new machine, downloads the bundle and select the appropriate
    binary. It has the advantage of being easy to implement and eases the distribution
    of updates.


    Or, it can carry the bundle of all the compiled versions, from an infected host
    to another. This method is a little bit harder to achieve, depending on the spreading
    technique used. But, as it does not rely on a central server, it is more stealthy
    and resilient.


    # 13.4 Spreading through SSH


    As always, we will focus on the techniques that bring the most results while staying
    simple. For a worm, it''s SSH for 2 reasons:


    +   - poorly configured IoT devices'
