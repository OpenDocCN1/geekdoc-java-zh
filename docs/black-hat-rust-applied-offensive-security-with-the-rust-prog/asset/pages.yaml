  md: '# 11.21.3 Prekey rotation, prekey bundles and sessions


    As you may have noticed, if the agent’s private prekey is compromised, all the
    messages can be decrypted. This is why in the first place, we use a temporary
    “prekey” and not a long-term private key like in PGP.


    Another strategy is to do like the Signal protocol: use prekey bundles. A prekey
    bundle is simply a lot of pre, pre-generated by the agent, and stored on the server.
    Each time an operator wants to issue a new command, the client fetches one of
    the bundle, and the server deletes it.


    It introduces much more complexity as the agent now needs to manage dozen of temporary
    keys (usually stored in an SQLite database), which may or may have been consumed
    by the client.


    Finally, we could like the Signal protocol and perform a key exchange between
    the client and an agent only. The key exchange would establish a session, and
    then, thanks to the double ratchet algorithm, we can send as many messages as
    we want needing more than one exchange.


    # 11.22 To learn more


    As cryptography is a booming field, with all the new privacy laws, hacks, data
    scandals, and quantum computers becoming more and more as a reality, you may certainly
    want to learn more about it.


    I have good news for you, there are 2 excellent (and this is nothing to say) books
    on the topic.


    # 11.22.1 Real-world cryptography


    by David Wong, of cryptologic.net, where you will learn the high-level usage of
    modern cryptography and how it is used in the real-world. You will learn, for
    example, how the Signal and TLS 1.3 protocols, or the Diem (previously known as
    Libra) cryptography work.


    # 11.22.2 Serious Cryptography: A Practical Introduction to Modern Encryption


    by Jean-Philippe Aumasson of aumasson.jp will teach you how the inner-working
    of crypto primitives and protocols, deconstructing all mathematical operations.


    I sincerely recommend you to read both. Besides being excellent, they are complementary.'
