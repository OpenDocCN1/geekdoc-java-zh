    \ set n to a big number that overflows an uint32 multiplied by the size of a pointer\
    \ (4 bytes on a 32bit system) like 1073741824, an integer overflow happens, and\
    \ we allocate a buffer of size 0 which is overflowed by the for loop.\n\nOne interesting\
    \ thing to note is that in debug mode (cargo build or cargo run), Rust will panic\
    \ when encountering an integer overflow, in release mode (cargo build --release\
    \ or cargo run --release), Rust will not panic. Instead, it performs two's complement\
    \ wrapping: the program won't crash, but the variable will hold an invalid value.\n\
    \n```\nlet x: u8 = 255;\n\n// x + 1 = 0 (and not 256)\n// x + 2 = 1 (and not 257)\n\
    // x + 3 = 2 (and not 258)\n```\n\nMore can be read about this behavior in the\
    \ Rust book.\n\n# 6.23.1 Why it's bad\n\nThis kind of vulnerability became popular\
    \ with smart contracts, where large sums of money were stolen due flawed contracts.\n\
    \nInteger overflow vulnerabilities can be used to control the execution flow of\
    \ a program or to trigger other vulnerabilities (such as the buffer overflow of\
    \ the example above).\n\n# 6.23.2 Case studies\n\n+   - An integer overflow found\
    \ in /lib/urlapi.c\n- libssh2 integer overflows and an out-of-bounds read (CVE-2019-13115)\n\
    - Another libssh2 integer overflow (CVE-2019-17498)"
