    #  10.5.3.1 Presentation


    The presentation layer is responsible for the deserialization of the requests
    and the serialization of the responses.


    It has its own models (HTML templates or structure to be encoded in JSON / XML).
    It encapsulates all the details about encoding responses of our web server.


    The presentation layer calls the services layer.


    #  10.5.3.2 Services


    The services layer is where the business logic lives. All our application''s rules
    and invariants live in the services layer.


    Need to verify a phone number? But what is the format of a phone number? The response
    to this question is in the services layer.


    What are the validations to proceed to when creating a job for an agent? This
    is the role of the service layer.


    #  10.5.3.3 Entities


    The entities encapsulates all the structures that will be used by the services
    layer. Each service has its own group of entities.


    Why not call this part a model? Because a model often refers to an object persisted
    in a database or sent by the presentation layer. In addition to being confusing,
    in the real world, not all entities are persisted. An object representing a group
    with its users may be used in your services but persisted nor transmitted by the
    presentation layer.


    In our case, the entities will `Agent`, `Job` (a job is a command created by the
    client, stored and dispatched by the server, and executed by the agent),


    #  10.5.3.4 Repository


    The repository layer is a thin abstraction over the database. It encapsulates
    all the database calls.


    The repository layer is called by the services layer.


    #  10.5.3.5 Drivers


    And the last piece of our architecture, `drivers` . Drivers encapsulate calls
    to third-party APIs and communication with external services as email servers
    or block storage.'
