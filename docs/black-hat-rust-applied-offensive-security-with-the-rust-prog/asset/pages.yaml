  md: '# 9.2.1 Dumpster diving


    Yeah, you heard it right. By digging in the trash of your target, you may be able
    to find interesting, non-destroyed papers: invoices, contracts, HR documents...


    In the worst case, it may even be printed private emails or credentials.


    # 9.2.2 Shoulder surfing


    Shoulder surfing simply means that you look where or what you shouldn''t:


    +   - Computer screens (in the train or cafes, for example)

    - Employees'' badges (in public transports)


    # 9.2.3 Physical intrusion


    Actually, physical intrusion can be highly technical, but the skills are not related
    to digital.


    There are basically two ways to practice physical intrusion:


    **Lockpicking**: like in movies... The reality is quite different, and it''s most
    of the time practical. To learn the basics of lock picking, take a look at the
    [MIT Guide to Lock Picking (PDF)](


    **Tailgating**: When you follow an employee in a building.


    The best way not to look suspicious is by meeting and joking with employees during
    a smoke break. If a badge is required, your new friends may be able to help you,
    because “you forgot yours on your desk” ;)


    # 9.3 Phishing


    In marketing, it''s called outbound marketing.


    It''s when you directly reach your target. I think I don''t need to attach a screenshot
    because you certainly already received thousands of these annoying emails and
    SMS telling you to update your bank password or something like that.


    We call a phishing operation a **campaign**, like a marketing campaign.


    # 9.3.1 A few ideas for your campaigns


    Sending thousands of junk emails will only result in triggering spam filters.
    Instead, we need to craft clever emails that totally look like something you could
    have received from a coworker or family member.'
