    # Going multi-platforms


    Now we have a mostly secure RAT, it''s time to expand the reach.


    Until now, we limited our builds to Linux. While the Linux market is huge server-side,
    this is another story client-side, with a market share of roughly 2.5% on the
    desktop.


    To increase the number of potential targets, we are going to use cross-compilation:
    we will compile a program from a Host Operating System for a different Operating
    System. Compiling Windows executables on Linux, for example.


    But, when we are talking about cross-compilation, we are not only talking about
    compiling a program from an OS to another. We are also talking about compiling
    an executable from one architecture to another. From x86_64 to aarch64 (also known
    as arm64 ), for example.


    In this chapter, we are going to see why and how to cross-compile Rust programs
    and how to avoid the painful edge-cases of cross-compilation, stay with me.


