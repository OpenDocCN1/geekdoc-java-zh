  md: '# 1.9 Our first Rust program: A SHA-1 hash cracker


    The moment has come to get our hands dirty: let''s write our first Rust program.
    As for all the code examples in this book, you can find the complete code in the
    accompanying repository: https://github.com/skerkour/black-hat-rust


    ```

    $ cargo sha1_cracker

    ```


    Will create a new project in the folder sha1_cracker .


    Note by default, cargo will create a binary (application) project. You can create
    a library project with --lib flag: cargo new my_lib --lib .


    | Data | Hash function | Hash |

    | --- | --- | --- |

    | password | SHA-1 | c8fed00eb2e87f1cee8e90ebbe87c190ac3848c |


    Figure 1.4: How a hash function works


    SHA-1 is a hash function used by a lot of websites to store the passwords of the
    users. In theory, a hashed password can never be recovered from its hash. Thus
    by storing the hash in their database, a website can assert that a given user
    has the knowledge of their password without storing the password in clear, by
    comparing the hashes. So if the website''s database is breached, there is no way
    to recover the passwords and access the users'' data.


    Reality is quite different. Let''s imagine a scenario where we just breached such
    a website, and we now want to recover the credentials of the users in order to
    gain their accounts. This is where a "hash cracker" is useful. A hash cracker
    is a program that will try different hashes in order to find the original password.


    This is why when creating a website, you should use a hash function specifically
    designed for this use case, such as argon2id which require way more resource to
    bruteforce than SHA-1, for example.


    This simple program will help you learn Rust''s fundamentals:


    +   * How to use Command Line Interface (CLI)

    * How to read files

    * How to use an external library

    * Basic error handling

    * Resources management'
