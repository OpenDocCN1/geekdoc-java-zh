    It''s an open secret that most of the time and costs spent on any serious software
    project are from maintenance. Rust is moving fast, and its ecosystem too, it''s
    necessary to automate projects'' maintenance.


    The good news is that, in my experience, due to its strong typing, Rust project
    maintenance is easier than in other languages: errors such as API changes will
    be caught at compile time.'
