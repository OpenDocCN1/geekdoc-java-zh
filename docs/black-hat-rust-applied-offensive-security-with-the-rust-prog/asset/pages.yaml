  md: '# Chapter 13


    # Turning our RAT into a worm to

    increase reach


    Now we have a working RAT that can persist on infected machines, it''s time to
    infect more

    targets.


    # 13.1 What is a worm


    A worm is a piece of software that can replicate itself in order to spread to
    other machines.


    Worms are particularly interesting for ransomware and botnet operators as reaching
    critical

    mass is important for these kinds of operations. That being said, stealth worms
    are also used

    in more targeted operations (e.g. Stuxnet).


    Worms are the evolution of viruses adapted to the modern computing landscape.
    Today, it''s

    very rare to find a computing device without access to the internet. Thus, it''s
    all-natural that

    worms use the network to spread.


    In the past, it was not uncommon for users to directly share programs on floppy
    disks or USB

    keys. Thus, a virus could spread by infecting a binary, which once copied and
    executed on

    another computer would infect it.


    Due to the protection mechanisms implemented by modern OSes, the prevalence of
    App

    Stores as a distribution channel, and the slowness of the process, this mode of
    operation has

    almost completely disappeared in favor of networked worms that can now spread
    to the entire

    internet in a matter of days, if not hours.


    That being said, it''s still uncommon to find viruses in pirated software and
    games (such as

    Photoshop).'
