  md: '# 14.2 The future of Rust


    I have absolutely no doubt that Rust will gradually replace all the low-level
    code that is today written in C or C++ due to the guarantees provided by the compiler.
    Too many critical vulnerabilities have been avoided. It will start with networked
    services, as those are easily remotely exploit (what is not networked today?),
    especially in video games where the amount of network vulnerabilities is mind-blowing.


    It may take some time for the biggest codebases, as web browsers (but it already
    has started for Firefox), which is said, because web browsers are the almost universal
    entry-point for anything virtual nowadays, we will continue to see a lot of memory-related
    vulnerabilities that Rust could have avoided.


    I also noticed a lot of interest for Rust development. I use myself to develop
    a SaaS (https://bloom.sh), and it''s an extremely pleasant experience, as a solo
    developer, it has never crashed and thus allows me to sleep better. I''ve shared
    my experience and a few tips on my blog: https://Kerkoum.com/blog/rust-for-web-development-2-years-later.


    The only limit to world dominance is its (relative) complexity, and more importantly,
    the long compile times.


    You can stay updated by following the two official blogs: * https://blog.rust-lang.org
    * https://foundation.rust-lang.org/posts


    # 14.3 Leaked repositories


    You can find online source leaked from organizations practicing offensive operations.


    The 2 most notable are:


    Hacked Team where a company specialized in selling offensive tools to governments
    across the world was hacked, and all its data was leaked. The write up by the
    hacker is also really interesting: https://www.exploit-db.com/papers/41914


