  md: '# ## 6.28.4 A scanner


    You get it! A scanner is what we built in the previous chapters.


    Scanners can''t replace the surgical precision of the brain of a hacker. Their
    purpose is to save you time by automating repetitive and fastidious tasks.


    Beware that a scanner, depending on the modules you enable, may be noisy and reveal
    your intentions. Due to their brute-force nature, they are easy to detect by firewalls.
    Thus, if you prefer to stay under the radar, be careful which options you enable
    with your scanner.


    # ## 6.28.5 And an intercepting proxy


    An intercepting proxy will help you inspect and modify requests on the fly, whether
    those requests come from your main computer or other devices such as a phone which
    does not have developer tools in the browser.


    It''s extremely useful to bypass client-side validation logic and send your payloads
    directly to the backend of the applications you are inspecting. They also offer
    some kind of automation, which is will save you a lot of time!


    I believe there is no better offensive proxy than the Burp Suite. It has a free
    (“community”) version to try it, and if you like it, and are serious about your
    bug hunting quest, you can buy a license to unlock all the features.


    Burp Suite also provides a lot of features to automate your requests and attacks.


    If this is your first step in hacking web applications, you don''t necessarily
    need an intercepting proxy. The developer tools of your web browser may suffice.
    That being said, it''s still great to learn how to use one, as you will be quickly
    limited when you want to intercept and modify requests.


    # ## 6.29 Automated audits


    # ### 6.29.1 Fuzzing


    Fuzzing is a method used to find bugs and vulnerabilities in software projects
    by automatically feeding them random data.'
