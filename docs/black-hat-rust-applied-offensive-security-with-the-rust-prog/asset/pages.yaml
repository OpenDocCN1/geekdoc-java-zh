  md: "# 3.8.1.3 broadcast\n\nThe **broadcast** channel supports sending many values\
    \ from many producers to many consumers. Each consumer will receive each value.\n\
    \nIt can be used as a Pub/Sub mechanism where consumers subscribe to messages\
    \ or events.\n\ndocs.rs/tokio/latest/tokio/sync\n\n```\nuse tokio::sync::broadcast;\n\
    \n#[tokio::main]\nasync fn main() {\n    let (tx, mut rx1) = broadcast::channel(16);\n\
    \    let mut rx2 = tx.subscribe();\n\n    tokio::spawn(async move {\n        assert_eq!(rx1.recv().await.unwrap(),\
    \ 10);\n        assert_eq!(rx1.recv().await.unwrap(), 20);\n    });\n\n    tokio::spawn(async\
    \ move {\n        assert_eq!(rx2.recv().await.unwrap(), 10);\n        assert_eq!(rx2.recv().await.unwrap(),\
    \ 20);\n    });\n\n    tx.send(10).unwrap();\n    tx.send(20).unwrap();\n}\n```\n\
    \n# 3.8.1.4 watch\n\nThe **watch** channel supports sending many values from a\
    \ single producer to many consumers. However, only the most recent value is stored\
    \ in the channel. Consumers are notified when a new value is sent, but there is\
    \ no guarantee that consumers will see all values."
