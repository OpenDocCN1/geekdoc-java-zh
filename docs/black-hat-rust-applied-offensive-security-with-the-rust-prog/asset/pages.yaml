    # 1.11.4 Slow compile times


    Compile times are closer to what we can find in the C++ world than in the world
    of dynamic languages like TypeScript (if TypeScript can be considered as a dynamic
    language). As a result, the "edit, compile, debug, repeat" workflow can become
    frustrating and break developers.


    There are many tricks to improve the compilation speed of your projects.


    The first one is to split a large project into smaller crates and benefit from
    Rust''s incremental compilation.


    Another one is to use cargo check instead of cargo build most of the time.


    ```

    $ cargo check

    ```


    As an example, on a project, with a single letter change:


    ```

    $ cargo check

    Finished dev [unoptimized + debuginfo] target(s) in 0.12s

    ```


    ```

    $ cargo build

    Compiling agent v0.1.0 (black-hat-rust/ch_11/agent)

    Finished dev [unoptimized + debuginfo] target(s) in 2.24s

    ```


    Compounded over a day (or week or month) of development, the gains are huge.


    Finally, reduce the use of generics. Generics adds a lot of work to the compiler
    and this significantly increase compile times.


