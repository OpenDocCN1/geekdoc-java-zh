    # # 11.21 Some limitations


    Now that end-to-end encryption is in place, our RAT is mostly secure, but there
    are still a few known limitations as an exercise for the reader.


    # # 11.21.1 Replay attacks


    A MITM could record the messages sent by the client or the agents and send them
    again at a later date. This is known as a replay attack: messages are replayed.


    Imagine sending some messages with a secure messaging app:


    +   * Alice: "Are you okay Bob?"

    * Bob: "Yes!" - the message is recorded by a MITM

    * Alice: "Are you ready to rob this bank?"

    * The MITM replaying Bob''s previous message: "Yes!"


    Bad, isn''t it?


    In our case, it''s even worse as the attacker could execute commands on the agents
    again and again.


    Fortunately, this is a solved problem, and ways to mitigate it are all well-known:
    https://www.kaspersky.com/resource-center/definitions/replay-attack


    # # 11.21.2 Agent''s configuration is not encrypted


    If our agent is detected, forensic analysts will have a hard time finding other
    infected machines as the agent is leaving an obvious trace of infection: its configuration
    file.


    One method to mitigate this problem, is first to generate a configuration file
    location that depends on some machine-dependent parameters which should never
    change. A serial number or a mac address, for example. The second thing is to
    encrypt the configuration file using a key derived from similar machine-dependent
    parameters.'
