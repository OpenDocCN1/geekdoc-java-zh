  md: '# Preface


    After high school, my plan for life was to become a private detective, maybe because
    I read too many Sherlock Holmes books. In France, the easiest way to become one
    is (was?) to go to law university and then attend a specialized school.


    I was not ready.


    I quickly realized that studying law was not for me: reality was travested to
    fit whatever narrative politics or professor wanted us to believe. No deep knowledge
    is taught here, only numbers, dates, how to look nice and sound smart. It was
    deeply frustrating for the young man I was, with an insatiable curiosity. I wanted
    to understand how the world works, not human conventions. For example, how do
    these machines we use that we are frantically typing on all day work under the
    hood?


    So I started installing Linux (no, I won''t enter the GNU/Linux war) on my Asus
    EeePC, a small notebook with only 1GB of RAM, because Windows was too slow, and
    started to develop C++ programs with Qt, thanks to online tutorials. I coded my
    own text and my own chains. My curiosity was not unfulled.


    One day, I inadvertently fell on the book that changed my life: “Hacking: The
    Art of Exploitation, 2nd Edition", by Jon Ericksonson.


    This book not only made me curious about how to make things, but more importantly,
    how to break things. It made me realize that you can''t build things without understanding
    how to break them, and by extension, where their weaknesses are.


    While the book remains great to learn low-level programming and how to exploit
    simple memory safety bugs, today, hacking requires new skills: web exploitation,
    network and system programming, and above all, how to code in a modern programming
    language.


    Welcome to the fascinating world of Rust and offensive security.


    While the Rust Book does an excellent job teaching What is Rust, I felt that a
    book about Why and How to Rust was missing. That means that some concepts will
    not'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'be covered in-depth in this book. Instead, we are going to see how to effectively
    use them in practice.


    In this book, we will shake the preconceived ideas (Rust is too complex for the
    real world, Rust is not productive...) and see how to architect and create real-world
    Rust projects applied to offensive security. We will see how polyvalent Rust is,
    which enables its users to replace the plethora of programming languages (Python,
    Ruby, C, C++...) plaguing the offensive security world with a unique language
    that offers high-level abstractions, high performance, and low-level control when
    needed.


    We will always start with some theory, deep knowledge that pass through ages,
    technologies and trends. This knowledge is independent of any programming language
    and will help you to get the right mindset for offensive security.


    I designed this book for people who want to understand how attackers think in
    order to better defend themselves or for people who want to enter the world of
    offensive security and eventually make a living off it.


    The goal of this book is to spend your time in path to action, by distilling knowledge
    and presenting it in code projects.


    It''s important to understand that Black Hat Rust is not meant to be a big encyclopedia
    containing all the knowledge of the world. Instead, it was designed as a guide
    to help you getting started and paved the way to action. Knowledge is a prerequisite,
    but it''s action that is shaping the world, and sometimes knowledge is a blocker
    for action (analysis paralysis). As we will see, some of the most primitive offensive
    techniques are still the most effective. Thus some very specific topics, such
    as how to bypass modern OS mechanisms will not be covered because there is already
    extensive literature on these topics, and they have little value in a book about
    Rust. That being said, I did my best to list the best resources for your learning
    journey.


    It took me approximately 1 year to become proficient in Rust, but it''s only when
    I started to write (and rewrite) a lot of code that made real progress.


    Rust is an extremely vast language, but in reality, you will (and should) use
    only a subset of its features: you don''t need to learn them all ahead of time.
    Some, we will study in this book, are fundamentals. Others are not and may have
    an adversarial effect on the quality of your code by making it harder to read
    and maintain.


    My intention with this book is not only to make you discover the fabulous world
    of offensive security, to convince that Rust is the long-awaited one-size-fits-all
    programming language meeting all the needs of offensive security, but also to
    save you'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'a lot of time by guiding you to what really matters when learning Rust and
    offensive security. But remember, knowledge is not enough. Knowledge doesn’t move
    mountains. Actions do.


    Thus, the book is only half of the story. The other half is the accompanying code
    repository: https://github.com/skerkour/black-hat-rust. It’s impossible to learn
    without practice, so I invite you to read the code, modify it and make it yours!


    If at any time you feel lost or don’t understand a chunk of Rust code, don’t hesitate
