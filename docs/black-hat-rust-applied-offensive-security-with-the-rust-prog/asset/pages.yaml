    # 6.9.3 DOM-based XSS


    A Dom-based XSS is an injection where the payload is not returned by the server,
    but instead executed directly by the browser by modifying the DOM.


    Most of the time, the endpoint of DOM-based XSS is an URL such as:


    ```

    <script>

    document write(''...'' + window.location + ''...'');

    </script>

    ```


    By sending a payload to window.location (the URL), an attacker will be able to
    execute JavaScript in the context of the victim, without the server even coming
    into play in this scenario. In the case of a Single-Page Application, the payload
    could attain the victim without even making a request to the server, making it
    impossible to investigate the victim without client-side instrumentation.


    # 6.9.4 Why it''s bad


    The impact of an XSS vulnerability is script execution in the context of the victim.
    Today, it means that the attackers have most of the time full control: they can
    steal session tokens, execute arbitrary commands, use identity, deflate websites
    and so on...


    Note that in some circumstances, XSS injections can be turned into remote-code
    executions (RCE), due to Server Side rendering (SSR) and headless browsers.


