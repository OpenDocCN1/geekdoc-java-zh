  md: "connection.\n\n#  3.7 Avoid blocking the event loops\n\nTHIS IS THE MOST IMPORTANT\
    \ THING TO REMEMBER.\n\nThe most important rule to remember in the world of `async-await`\
    \ **is not to block the event loop.**\n\nWhat does it mean? Not calling functions\
    \ that may run for more than 10 to 100 microseconds directly. Instead, `spawn_blocking`\
    \ them.\n\nThis is known as the `colored functions problem`. You cannot call blocking\
    \ functions inside `async` functions like you normally do, and vice versa. It\
    \ would break (literally) the system.\n\n#  3.7.1 CPU intensive operations\n\n\
    So, how to execute compute-intensive operations, such as encryption, image encoding,\
    \ or file hashing?\n\ntokio provides theio::task::spawn_blocking function for\
    \ blocking operations that eventually finish on their own. By that, I mean a blocking\
    \ operation which is not an infinite background job. For this kind of task, a\
    \ Rust Thread is much more appropriate.\n\nHere is an example of an application\
    \ where `spawn_blocking` is used:\n\n```\nlet is_code_valid = spawn_blocking(move\
    \ || crypto::verify_password(&code,\n                                     &code_hash)).await?;\n\
    ```\n\nIndeed, the function `crypto::verify_password` is expected to take a few\
    \ milliseconds to complete, it would block the event loop.\n\nInstead, calling\
    \ `spawn_blocking`, the operation is dispatched to tokio's blocking tasks thread\
    \ pool.\n\nUnder the hood, fixed-size thread pool for its executors (event-loops,\
    \ processors) which execute async tasks. Async tasks can be dispatched to this\
    \ thread pool using `tokio::spawn`.\n\nAnd one dynamically sized but bounded (in\
    \ size) thread pool for blocking tasks. By default, the latter will grow up to\
    \ 512 threads. Blocking tasks can be dispatched to this thread pool using `tokio::task::spawn_blocking`.\
    \ You can read more about how to finely configure it in tokio's documentation."
