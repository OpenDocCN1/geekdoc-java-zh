  md: '# 11.6 Key derivation functions


    Key Derivation Functions (KDFs) allow creating a secure key from a not-so-secure
    source.


    | Low-entropy passphrase | High-entropy data |

    | :--- | :--- |

    | (PB)KDF | KDF |

    | Argon2id | Blake2b |

    | High-entropy key | High-entropy key |


    Figure 11.5: Key Derivation Functions


    Functions that accept as input a low entropy input, such as a password, a passphrase
    or a big number, and produce a high-entropy, secure output. They are also known
    as PBKDF for Password Based Key Derivation Functions. For example Argon2d and
    PBKDF2.


    And functions that accept a high-entropy input, such as an already securely generated
    random vector, and produce an also high-entropy output. For example: Blake2b.


    Note that a function like Blake2b is polyvalent, and you can also use it with
    a secret key as a MAC.


    # 11.7 Block ciphers


    Block ciphers are the most famous encryption primitives and certainly the ones
    you think about when you read the word "cryptography".


    You give to a block cipher a message (also known as plaintext) and a secret key,
    and it outputs an encrypted message, also known as ciphertext. Given the same
    secret key, you will then be able to decrypt the ciphertext to recover the original
    message, for bit bit identical.


    Most of the time, the ciphertext is of the same size as the plaintext.


    An example of block cipher is AES-CBC.'
