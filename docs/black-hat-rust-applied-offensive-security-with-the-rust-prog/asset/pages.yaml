  md: '# ### 3.6.1 The event loop(s)


    At the core of all async runtimes, there are (whether it is in Rust, Node.js,
    or other languages) are the event loops, also called processors.


    # #### Run queue


    | Task | Task | | | | | | |


    ![](img/fd19beeb883de29aeed91588e61a7e14_63_0.png)


    # #### Run queue


    | Task | Task | Task | | | | | | |


    ![](img/fd19beeb883de29aeed91588e61a7e14_63_1.png)


    # #### Run queue (empty)


    | | | | | | | | | |


    ![](img/fd19beeb883de29aeed91588e61a7e14_63_2.png)


    Figure 3.1: Work stealing runtime. By Carl Lerche - License MIT - https://tokio.rs/blog/2019-10-scheduler#the-next-generation-tokio-scheduler


    In reality, for better performance, there are multiple processors per program,
    per CPU core.


    Each event-loop has its own queue of tasks await for completion. Tokio’s known
    to be a work-stealing runtime. Each processor can steal the task in the queue
    of another processor if its own is empty (i.e. it has nothing to do and is “sitting”
    idle).'
