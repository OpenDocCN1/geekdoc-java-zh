- img_proc: true
  md: 'There are 3 regions that are of interest to us:


    +   * The neocortex

    * The hypothalamus

    * The cerebellum and brainstem


    ![](img/fd19beeb883de29aeed91588e61a7e14_207_0.png)


    Figure 9.1: Our brain


    **The neocortex** is responsible for logical thinking.


    **The hypothalamus** is responsible for our emotions and feelings.


    **The cerebellum and brainstem** are responsible for our primitive functions.
    The cerebellum''s function is to coordinate muscle movements, maintain posture,
    and balance, while the brainstem, which connects the rest of the brain to the
    spinal cord, performs critical functions such as regulating cardiac and respiratory
    function, helping to control heart rate and breathing rate.


    If you want to influence someone, you should bypass its neocortex and speak to
    its hypothalamus.


    That''s why you can''t understand the success of the populist politicians with
    your neocortex. Their discourses are tailored to trigger and affect the hypothalamus
    of their listeners. They are designed to provoke emotive, not intellectual, reactions.


    Same for advertisements.


    Please note that this model is controversial. Still, using this model to analyze
    the world opens a lot of doors.'
