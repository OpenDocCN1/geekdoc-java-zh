  md: '# 5. DRIVER TYPES


    # What is JDBC Driver?


    JDBC drivers implement the defined interfaces in the JDBC API, for interacting
    with your database server.


    For example, using JDBC drivers enable you to open database connections or interact
    with it by sending SQL or database commands then receiving results with Java.


    The Java.sql package that ships with JDK, contains various classes with their
    behaviours and their actual implementains are done in third-party drivers. Third
    party vendors implements the java.sql.Driver interface in their database driver.


    # JDBC Drivers Types


    JDBC driver implementations vary because of the wide variety of operating systems
    and hardware platforms in which Java operates. Sun has divided the implementation
    types into four categories, Types 1, 2, 3, and 4, which is explained below:


    # Type 1: JDBC-ODBC Bridge Driver


    In a Type 1 driver, a JDBC bridge is used to access ODBC drivers installed on
    each client machine. Using ODBC, requires configuring on your system a Data Source
    Name (DSN) that represents the target database.


    When Java first came out, this was a useful driver because most databases only
    supported ODBC access but now this type of driver is recommended only for experimental
    use or when no other alternative is available.


    ![](img/e145b194969ce51c2b304489635cb841_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# JDBC


    ![](img/e145b194969ce51c2b304489635cb841_24_0.png)


    The JDBC-ODBC Bridge that comes with JDK 1.2 is a good example of this kind of
    driver.


    # Type 2: JDBC-Native API


    In a Type 2 driver, JDBC API calls are converted into native C/C++ API calls,
    which are unique to the database. These are typically provided by the database
    vendors and used in the same manner as the JDBC-ODBC Bridge. The vendor-specific
    driver must be installed on each client machine.


    If we change the Database, we have to change the native API, as it is specific
    to a database and they are mostly obsolete, but you may realize some speed increase
    with a Type 2 driver, because it eliminates ODBC''s overhead.


    ![](img/e145b194969ce51c2b304489635cb841_24_1.png)


    The Oracle Call Interface (OCI) driver is an example of a Type 2 driver.


    18'
