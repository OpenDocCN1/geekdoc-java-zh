  md: '# 13. STORED PROCEDURE


    We have learnt how to use Stored Procedures in JDBC while discussing the JDBC
    - Statements chapter. This chapter is similar to that section, but it would give
    you additional information about JDBC SQL escape syntax.


    Just as a Connection object creates the Statement and PreparedStatement objects,
    it creates the CallableStatement object, which would be used to execute a call
    to a database stored procedure.


    # Creating CallableStatementObject


    Suppose, you need to execute the Oracle stored procedure:


    ```

    CREATE OR REPLACE PROCEDURE getEmpName

    (EMP_ID IN NUMBER, EMP_FIRST VARCHAR) AS

    BEGIN

    SELECT first INTO EMP_FIRST

    FROM Employees

    WHERE ID = EMP_ID;

    END;

    ```


    NOTE: Above stored procedure has been written for Oracle, but we are working with
    MySQL database, so let us write same stored procedure for MySQL as follows to
    create it in EMP database:


    ```

    DELIMITER $$

    DROP PROCEDURE IF EXISTS `EMP`.`getEmpName` $$

    CREATE PROCEDURE `EMP`.`getEmpName`

    (IN EMP_ID INT, OUT EMP_FIRST VARCHAR(255))

    BEGIN

    SELECT first INTO EMP_FIRST

    FROM Employees

    WHERE ID = EMP_ID;

    END $$

    ```


    ![](img/e145b194969ce51c2b304489635cb841_105_0.png)'
  merge: -1
  pgno: 105
- img_proc: true
  md: "Three types of parameters exist: IN, OUT, and INOUT. The PreparedStatement\
    \ object only uses the IN parameter. The CallableStatement object can use all\
    \ the three.\n\nHere are the definitions of each:\n\n| Parameter | Description\
    \ |\n| --- | --- |\n| IN | A parameter whose value is unknown when the SQL statement\
    \ is created. You bind values to IN parameters with the setXXX() methods. |\n\
    | OUT | A parameter whose value is supplied by the SQL statement returns. You\
    \ retrieve values from the OUT parameters with the getXXX() methods. |\n| INOUT\
    \ | A parameter that provides both input and output values. You bind variables\
    \ with the setXXX() methods and retrieve values with the getXXX() methods. |\n\
    \nThe following code snippet shows how to employ the Connection.prepareCall()\
    \ method to instantiate a CallableStatement object based on the preceding stored\
    \ procedure:\n\n```\nCallableStatement cstmt = null;\ntry {\n    String SQL =\
    \ \"{call empName (?, ?, ?)}\";\n\nncstmt = conn.prepareCall(SQL);\n    . . .\
    \ .\n} catch (SQLException e) {\n    . . . .\n} finally {\n    . . . .\n}\n```"
