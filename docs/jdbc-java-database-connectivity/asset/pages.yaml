  md: '# 15. CREATE DATABASE


    This tutorial provides an example on how to create a Database using JDBC application.
    Before executing the following example, make sure you have the following in place:


    +   - You should have admin privilege to create a database in the given schema.
    To execute the following example, you need to replace the `username` and `password`
    with your actual user name and password.

    - Your MySQL or whatever database you are using, is up and running.


    # Required Steps


    The following steps are required to create a new Database using JDBC application:


    +   - **Import the packages**: Requires that you include the packages containing
    the JDBC classes needed for database programming. Most often, using `java.sql.*`
    will suffice.

    - **Register the JDBC driver**: Requires that you initialize a driver so you can
    open a channels with the database.

    - **Open a connection**: Requires using `DriverManager.getConnection()` method
    to create a Connection object, which represents a physical connection with the
    database server.

    - To create a database, you need not give any database name while preparing database
    URL as mentioned in the below example.

    - **Execute a query**: Requires using an object of type Statement for building
    and submitting an SQL statement to the database.

    - **Clean up the environment**: Requires explicitly closing all database resources
    versus relying on the JVM''s garbage collection.


    # Sample Code


    Copy and paste the following example in JDBCExample.java, compile and run as follows:


    ```

    //STEP 1. Import required packages

    import java.sql.*;


    public class JDBCExample {

    ```


