  md: "```\n}\nfinally {\n  ...\n}\n```\n\nAll parameters in JDBC are represented\
    \ by the ? symbol, which is known as the parameter marker. You must supply values\
    \ for every parameter before executing the SQL statement.\n\nThe setObject() methods\
    \ bind values to the parameters, where XXX represents the Java data type of the\
    \ value you wish to bind to the input parameter. If you forget to supply the values,\
    \ you will receive an SQLException.\n\nEach parameter marker is referred by its\
    \ ordinal position. The first marker represents position 1, the next position\
    \ 2, and so forth. This method differs from that of Java array indices, which\
    \ starts at 0.\n\nAll of the Statement object's methods for interacting with the\
    \ database (a) execute(), (b) executeQuery(), and (c) executeUpdate() also work\
    \ with the PreparedStatement object. However, the methods are modified to use\
    \ SQL statements that can input the parameters.\n\n# Closing PreparedStatement\
    \ Object\n\nJust as you close a Statement object, for the same reason you should\
    \ also close the PreparedStatement object.\n\nA simple call to the close() method\
