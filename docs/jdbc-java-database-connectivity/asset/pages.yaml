  md: '```

    Connection conn = DriverManager.getConnection(URL);

    ```


    # Using a Database URL and a Properties Object


    A third form of the DriverManager.getConnection( ) method requires a database
    URL and a Properties object:


    ```

    DriverManager.getConnection(String url, Properties info);

    ```


    A Properties object holds a set of key-value pairs. It is used to pass driver
    properties to the driver during a call to the getConnection() method.


    To make the same connection made by the previous examples, use the following code:


    ```

    import java.util.*;


    String URL = "jdbc:oracle:thin:amrood:1521:EMP";

    Properties info = new Properties();

    info.put("user", "username");

    info.put("password", "password");


    Connection conn = DriverManager.getConnection(URL, info);

    ```


    # Closing JDBC Connections


    At the end of your JDBC program, it is required explicitly to close all the connections
    to the database to end each database session. However, if you forget, Java''s
    garbage collector will close the connection when it cleans up stale objects.


    Relying on the garbage collection, especially in database programming, is a very
    poor programming practice. You should make a habit of always closing the connection
    with the close() method associated with connection object.


    To ensure that a connection is closed, you could provide a ''finally'' block in
    your code. A finally block always executes, regardless of an exception occurs
    or not.


    To close the above opened connection, you should call close() method as follows:


    ```

    conn.close();

    ```


    Explicitly closing a connection conserves DBMS resources, which will make your
    database administrator happy.


