  md: "```\n}\n```\n\nThe String variable SQL, represents the stored procedure, with\
    \ parameter placeholders.\n\nUsing the CallableStatement objects is much like\
    \ using the PreparedStatement objects. You must bind values to all the parameters\
    \ before executing the statement, or you will receive an SQLException.\n\nIf you\
    \ have IN parameters, just follow the same rules and techniques that apply to\
    \ a PreparedStatement object; use the setXXX() method that corresponds to the\
    \ Java data type you are binding.\n\nWhen you use OUT and INOUT parameters you\
    \ must employ an additional CallableStatement method, registerOutParameter().\
    \ The registerOutParameter() method binds the JDBC data type, to the data type\
    \ that the stored procedure is expected to return.\n\nOnce you call your stored\
    \ procedure, you retrieve the value from the OUT parameter with the appropriate\
    \ getXXX() method. This method casts the retrieved value of SQL type to a Java\
    \ data type.\n\n# ClosingCallableStatement Object\n\nJust as you close other object,\
    \ for the same reason you should also close the CallableStatement object.\n\n\
    A simple call to the close() method will do the job. If you close the Connection\
    \ object first, you will close the CallableStatement object as well. However,\
    \ you should explicitly close the CallableStatement object to ensure proper cleanup.\n\
