  md: '# 2. SQL SYNTAX


    Structured Query Language (SQL) is a standardized language that allows you to
    perform operations on a database, such as creating entries, reading content, updating
    content, and deleting entries.


    SQL is supported by almost any database you will likely use, and it allows you
    to write database code independently of the underlying database.


    This chapter gives an overview of SQL, which is a prerequisite to understand JDBC
    concepts. After going through this chapter, you will be able to Create, Read,
    Update, and Delete (often referred to as CRUD operations) data from a database.


    For a detailed understanding on SQL, you can read our MySQL Tutorial.


    # Create Database


    The CREATE DATABASE statement is used for creating a new database. The syntax
    is:


    ```

    SQL CREATE DATABASE DATABASE_NAME;

    ```


    Example

    The following SQL statement creates a Database named EMP:


    ```

    SQL CREATE DATABASE EMP;

    ```


    # Drop Database


    The DROP DATABASE statement is used for deleting an existing database. The syntax
    is:


    ```

    SQL DROP DATABASE DATABASE_NAME;

    ```


    Note: To create or drop a database you should have administrator privilege on
    your database server. Be careful, deleting a database would lose all the data
    stored in the database.


    # Create Table


    The CREATE TABLE statement is used for creating a new table. The syntax is:


    ![](img/e145b194969ce51c2b304489635cb841_10_0.png)'
