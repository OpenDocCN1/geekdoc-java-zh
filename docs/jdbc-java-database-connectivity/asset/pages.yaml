  md: '# 8. RESULT SETS


    The SQL statements that read data from a database query, return the data in a
    result set. The SELECT statement is the standard way to select rows from a database
    and view them in a result set. The java.sql.ResultSet interface represents the
    result set of a database query.


    A ResultSet object maintains a cursor that points to the current row in the result
    set. The term "result set" refers to the row and column data contained in a ResultSet
    object.


    The methods of the ResultSet interface can be broken down into three categories:


    +   - **Navigational methods**: Used to move the cursor arrow.

    - **Get methods**: Used to view the data in the columns of the current row being
    pointed by the cursor.

    - **Update methods**: Used to update the data in the columns of the current row.
    The updates can then be updated in the underlying database as well.


    The cursor is movable based on the properties of the ResultSet. These properties
    are designated when the corresponding Statement generates the ResultSet is created.


    JDBC provides the following connection methods to create statements with desired
    ResultSet:


    +   - **createStatement(int RSType, int RSConcurrency)**

    - **prepareStatement(String SQL, int RSType, int RSConcurrency)**

    - **prepareCall(String sql, int RSType, int RSConcurrency)**


    The first argument indicates the type of a ResultSet object and the second argument
    is one of two ResultSet constants for specifying whether a result set is read-only
    or updatable.


    # Type of ResultSet


    The possible RSType are given below. If you do not specify any ResultSet type,
    you will automatically get one that is TYPE_FORWARD_ONLY.


    | Type | Description |

    | ResultSet.TYPE_FORWARD_ONLY | The cursor can only move forward in |


