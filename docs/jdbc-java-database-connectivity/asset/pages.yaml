    Example


    The following SQL UPDATE statement changes the age column of the employee whose
    id is 100:


    ```

    SQL> UPDATE Employees SET age=20 WHERE id=100;

    ```


    # DELETE Data


    The DELETE statement is used to delete data from tables. The syntax for DELETE
    is:


    ```

    SQL> DELETE FROM table_name WHERE conditions;

    ```


    The WHERE clause can use the comparison operators such as =, !=, <, <=, >=, as
    well as the BETWEEN and LIKE operators.


    Example


    The following SQL DELETE statement deletes the record of the employee whose id
    is 100:


    ```

    SQL> DELETE FROM Employees WHERE id=100;

    ```'
