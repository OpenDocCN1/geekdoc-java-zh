  md: '# About the Tutorial


    JDBC API is a Java API that can access any kind of tabular data, especially data
    stored in a Relational Database. JDBC works with Java on a variety of platforms,
    such as Windows, Mac OS, and the various versions of UNIX.


    # Audience


    This tutorial is designed for Java programmers who would like to understand the
    JDBC framework in detail along with its architecture and actual usage.


    # Prerequisites


    Before proceeding with this tutorial, you should have a good understanding of
    Java programming language. As you are going to deal with RDBMS, you should have
    prior exposure to SQL and Database concepts.


