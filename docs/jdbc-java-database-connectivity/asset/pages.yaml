  md: "# JDBC\n\nThe String variable SQL represents the stored procedure, with parameter\
    \ placeholders.\n\nUsing CallableStatement objects is much like using PreparedStatement\
    \ objects. You must bind values to all the parameters before executing the statement,\
    \ or you will receive an SQLException.\n\nIf you have IN parameters, just follow\
    \ the same rules and techniques that apply to a PreparedStatement object; use\
    \ the setXXX() method that corresponds to the Java data type you are binding.\n\
    \nWhen you use OUT and IN parameters, you must employ an additional CallableStatement\
    \ method, registerOutParameter(). The registerOutParameter() method binds the\
    \ JDBC data type to the data type the stored procedure is expected to return.\n\
    \nOnce you have called your procedure, you retrieve the value from the OUT parameter\
    \ with the appropriate getXXX() method. This method casts the retrieved value\
    \ of SQL to a Java data type.\n\n# Closing CallableStatement Object:\n\nJust as\
    \ you close other Statement, for the same reason you should also close the CallableStatement\
    \ object.\n\nA simple call to the close() method will do the job. If you close\
    \ the Connection object first, it will close the CallableStatement as well. However,\
    \ you should always explicitly close the CallableStatement object to ensure proper\
    \ cleanup.\n\n```\nCallableStatement cstmt = null;\ntry {\n    String SQL = \"\
    {call getEmpName(?, ?)}\";\n    cstmt = conn.prepareCall(SQL);\n} catch (SQLException\
    \ e) {\n}\nfinally {\n    cstmt.close();\n}\n```\n\nWe have studied more details\
    \ in the Callable - Example Code section earlier.\n\n# 101"
