    \ values in Java, there are three tactics you can use:\n\n+   - Avoid using getXXX()\
    \ methods that return primitive data types.\n\n+   - Use wrapper classes for primitive\
    \ data types, and use the ResultSet object(wasNull() method to test whether the\
    \ wrapper class variable received the value returned by the getXXX() method should\
    \ be set to null.\n\n+   - Use primitive data types and the ResultSetObject's\
    \ wasNull() method to test whether the primitive variable received the value returned\
    \ by the getXXX() method should be set to an acceptable value that you've chosen\
    \ to represent a NULL.\n\nHere is one example to handle a NULL value:\n\n```\n\
    Statement stmt = conn.createStatement( );\nString sql = \"SELECT id, first, last,\
    \ age FROM Employees\";\nResultSet rs = stmt.executeQuery(sql);\nint id = rs.getInt(1);\n\
