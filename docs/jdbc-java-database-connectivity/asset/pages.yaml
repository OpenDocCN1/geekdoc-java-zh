    # Create Connection Object


    We have listed down three forms of DriverManager.getConnection() method to create
    a connection object.


    # Using a Database URL with a username and password


    The most commonly used form of getConnection() requires you to pass a database
    URL, a username, and a password:


    Assuming you are using Oracle''s thin driver, you''ll specify a host:portName
    for the database portion of the URL.


    If you have a host at TCP/IP address 192.0.0.1 with a host name of amrood, and
    your Oracle listener is configured to listen on port 1521, and your database name
    is EMP, complete database URL would be:


    ```

    jdbc:oracle:thin:amrood:1521:EMP

    ```


    Now you have to call getConnection() method with appropriate username and password
    to get a Connection object follows:


    ```

    String URL = "jdbc:oracle:thin:amrood:1521:EMP"

    String USER = "username"

    String PASS = "password"

    Connection conn = DriverManager.getConnection(URL, USER, PASS);

    ```


    # Using Only a Database URL


    A second form of the DriverManager.getConnection( ) method requires only a database
    URL:


    ```

    DriverManager.getConnection(String url)

    ```


    However, in this case, the database URL includes the username and password and
    has the following form:


    ```

    jdbc:oracle:driver:username/password@database

    ```


    So, the above connection can be created as follows:


    ```

    String URL = "jdbc:oracle:thin:username/password@amrood:1521:EMP";

    ```


    ![](img/e145b194969ce51c2b304489635cb841_30_0.png)'
