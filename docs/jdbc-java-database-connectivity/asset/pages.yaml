  md: "# JDBC SQL Escape Syntax\n\nThe escape syntax gives you the flexibility to\
    \ use database specific features unavailable to you by using standard JDBC methods\
    \ and properties.\n\nThe general SQL escape format is as follows:\n\n```\n{keyword\
    \ 'parameters'}\n```\n\nHere are the following escape sequences, which you would\
    \ find very useful while performing the JDBC programming:\n\n# d, t, ts Keywords\n\
    \nThey identify date, time, and timestamp literals. As you know, no two DBMSs\
    \ represent time and date the same way. This escape syntax tells the driver to\
    \ render the date or time in the target database's format. For Example:\n\n```\n\
    {d 'yyyy-mm-dd'}\n```\n\nWhere yyyy = year, mm = month; dd = date. Using this\
    \ syntax {d '2009-09-03'} is March 9, 2009.\n\nHere is a simple example how to\
    \ INSERT data in a table:\n\n```\n//Create a Statement object\nstmt = conn.createStatement();\n\
    //Insert data table, ID, First Name, Last Name, DOB\nString sql=\"INSERT INTO\
    \ STUDENTS VALUES \" + \n\"(100, 'Zara', 'Ali', {d '2001-12-16'}\");\nstmt.executeUpdate(sql);\n\
    ```\n\nSimilarly, you can use one of the following two syntaxes, either t or ts:\n\
    \n```\n{t 'hh:mm:ss'}\n```\n\nWhere hh = hour, mm = minute; ss = second. Using\
    \ this syntax {t '13:30:29'} is 1:30:29 PM.\n\n```\n{ts 'yyyy-mm-dd hh:mm:ss'}\n\
    ```\n\nThis is combined syntax of the above two syntax for 'd' and 't' to represent\
    \ timestamp.\n\n![](img/e145b194969ce51c2b304489635cb841_108_0.png)"
