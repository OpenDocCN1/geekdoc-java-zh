    The ResultSet interface contains a collection of update methods for updating the
    data of a result set.


    As with the get methods, there are two update methods for each data type:


    +   - One that takes a column name.

    - One that takes a column index.


    For example, to update a String column, you would use one of the following updateString()
    methods:


