    # Using Savepoints


    The new JDBC 3.0 Savepoint interface gives you an additional transactional control.
    Most modern DBMS, support savepoints within their environments such as Oracle''s
    PL/SQL.


    When you set a savepoint you define a logical rollback point within a transaction.
    If an error occurs past a savepoint, you can use the rollback method to undo either
    the changes or only the changes made after the savepoint.


    The Connection object has new methods that help you manage savepoints:


    +   - setSavepoint(String savepointName): Defines a new savepoint. It also returns
    a Savepoint object.

    - releaseSavepoint(Savepoint savepointName): Deletes a savepoint. Notice that
    it requires a Savepoint as a parameter. This object is usually a savepoint generated
    by the setSavepoint() method.


    ![](img/e145b194969ce51c2b304489635cb841_80_0.png)'
