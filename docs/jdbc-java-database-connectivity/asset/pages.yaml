  md: '# 4. SAMPLE CODE


    This chapter provides an example of how to create a simple JDBC application. This
    will show you how to open a database connection, execute a SQL query, and display
    the results.


    All the steps mentioned in this template example, would be explained in subsequent
    chapters of this tutorial.


    # Creating JDBC Application


    There are six steps involved in building a JDBC application:


    +   - Import the packages: Requires that you include the packages containing the
    JDBC classes needed for database programming. Most often, using import java.sql.*;
    will suffice.


    +   - Register the JDBC driver: Requires that you initialize a driver so you can
    open a communication channel with the database.


    +   - Open a connection: Requires using the DriverManager.getConnection() method
    to create a Connection object, which represents a physical connection with the
    database.


    +   - Execute a query: Requires using an object of type Statement for building
    and submitting an SQL statement to the database.


    +   - Extract data from result set: Requires that you use the appropriate ResultSet.getXXX()
    method to retrieve the data from the result set.


    +   - Clean up the environment: Requires explicitly closing all database resources
    versus relying on the JVM''s garbage collection.


    # Sample Code


    This sample example can serve as a template when you need to create your own JDBC
    application in the future.


    This sample code has been written based on the environment and database setup
    done in the previous chapter.


    Copy and past the following example in FirstExample.java, compile and run as follows:


    ```

    //STEP 1. Import required packages

    ```'
