    # 26. SORTING DATA


    This chapter provides an example on how to sort records from a table using JDBC
    application. This would use asc and desc keywords to sort records in ascending
    or descending order. Before executing the example, make sure you have the following
    in place:


    +   - To execute the following example you can replace the username and password
    with your actual user name and password.

    - Your MySQL or whatever database you are using, is up and running.


    # ## Required Steps


    The following steps are required to create a new Database using JDBC application:


    +   - Import the packages: Requires that you include the packages containing the
    JDBC classes needed for database programming. Most using, import java.sql.* will
    suffice.

    - Register the JDBC driver: Requires that you initialize a driver so you can open
    a communications channel with the database.

    - Open a connection: Requires using the DriverManager.getConnection() method to
    create a Connection object, which represents a physical connection with a database
    server.

    - Execute a query: Requires using an object of Statement for building and submitting
    a SQL statement to sort records from a table. Queries make use of asc and desc
    clauses to sort data in ascending and descending orders.

    - Clean up the environment: Requires explicitly closing all database resources
    relying on the JVM''s garbage collection.


    # ## Sample Code


    Copy and paste the following example in JDBCExample.java, compile and run as follows:


    ```

    //STEP 1. Import required packages

    import java.sql.*;


    public class JDBCExample {

    ```


