    \ exist: IN, OUT, and INOUT. The PreparedStatement object uses only the IN parameter.\
    \ The CallableStatement object can use all the three.\n\nHere are the definitions\
    \ of each:\n\n| Parameter | Description |\n| --- | --- |\n| IN | A parameter whose\
    \ value is unknown when the SQL statement is created. You bind values to IN parameters\
    \ with the setXXX() methods. |\n| OUT | A parameter whose value is supplied by\
    \ the SQL statement returns. You retrieve values from the OUT parameters with\
    \ the getXXX() methods. |\n| INOUT | A parameter that provides both input and\
    \ output values. You bind variables with the setXXX() methods and retrieve values\
    \ with the getXXX() methods. |\n\nThe following code snippet shows how to employ\
    \ the Connection.prepareCall() method to instantiate a CallableStatement object\
    \ based on the preceding stored procedure:\n\n```\nCallableStatement cstmt = null;\n\
    try {\n  String SQL = \"{call getEmpName (?, ?)}\";\n  cstmt = conn.prepareCall(SQL);\n\
    \  ..\n}\ncatch (SQLException e) {\n  ..\n}\nfinally {\n  ..\n}\n```\n\n![](img/e145b194969ce51c2b304489635cb841_44_0.png)"
- md: "\n```\n}The String variable SQL, represents the stored procedure, with parameter\
    \ placeholders.\n\nUsing the CallableStatement objects is much like using the\
    \ PreparedStatement objects. You must bind values to all the parameters before\
    \ executing the statement, or you will receive an SQLException.\n\nIf you have\
    \ IN parameters, just follow the same rules and techniques that apply to a PreparedStatement\
    \ object; use the setXXX() method that corresponds to the Java data type you are\
    \ binding.\n\nWhen you use OUT and INOUT parameters you must employ an additional\
    \ CallableStatement method, registerOutParameter(). The registerOutParameter()\
    \ method binds the JDBC data type, to the data type that the stored procedure\
    \ is expected to return.\n\nOnce you call your stored procedure, you retrieve\
    \ the value from the OUT parameter with the appropriate getXXX() method. This\
    \ method casts the retrieved value of SQL type to a Java data type.\n\n## ClosingCallableStatement\
    \ Object\n\nJust as you close other object, for the same reason you should also\
    \ close the CallableStatement object.\n\nA simple call to the close() method will\
    \ do the job. If you close the Connection object first, you will close the CallableStatement\
    \ object as well. However, you should explicitly close the CallableStatement object\
    \ to ensure proper cleanup.\n\n```\nCallableStatement cstmt = null;\ntry {\n \
    \   String SQL = \"{call getEmpName(?, ?)}\";\n    cstmt = conn.prepareCall(SQL);\n\
    }\ncatch(SQLException e) {\n    ...\n}\nfinally {\n    cstmt.close();\n}\n```\n\
