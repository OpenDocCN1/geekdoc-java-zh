    \            }\n        }\n    }\n}\n```\n\n```\n// 结束程序示例\n```\n\n## 5. 驱动类型\n\
    \n### 什么是 JDBC 驱动？\n\nJDBC 驱动程序实现了 JDBC API 定义的接口。\n\n例如，使用 JDBC 驱动程序可以让你通过发送\
    \ SQL 命令和接收结果来打开数据库连接并与其交互。\n\n`java.sql` 包随 JDK 提供了各种类，第三方厂商实现了 `java.sql.Driver`\
    \ 接口。\n\n### JDBC 驱动类型\n\nJDBC 驱动的实现取决于 Java 运行的各种操作系统和硬件平台。Sun 将实现类型分为四类，类型 1、2、3\
