- md: "\n# Type 3: JDBC-Net Pure Java\n\nIn a Type 3 driver, a three-tier approach\
    \ is used to access databases. The JDBC clients use standard network sockets to\
    \ communicate with a middleware application server. The socket information is\
    \ then translated by the middleware application server into the call format required\
    \ by the DBMS, and forwarded to the database server.\n\nThis kind of driver is\
    \ extremely flexible, since it requires no code installed on the client and a\
    \ single driver can actually provide access to multiple databases.\n\n![](img/e145b194969ce51c2b304489635cb841_25_0.png)\n\
    \nYou can think of the application server as a JDBC \"proxy,\" meaning that it\
    \ makes calls for the client application. As a result, you need some knowledge\
    \ of the application server's configuration in order to effectively use this driver\
    \ type.\n\nYour application server might use a Type 1, 2, or 4 driver to communicate\
    \ with the database, understanding the nuances will prove helpful.\n\n# Type 4:\
    \ 100% Pure Java\n\nIn a Type 4 driver, a pure Java-based driver communicates\
    \ directly with the vendor's database through socket connection. This is the highest\
    \ performance driver available for the database and is usually provided by the\
    \ vendor itself.\n\nThis kind of driver is extremely flexible, you don't need\
    \ to install special software on the client or server. Further, these drivers\
    \ can be downloaded dynamically.\n\n![](img/e145b194969ce51c2b304489635cb841_26_0.png)\n\
    \nMySQL's Connector/J driver is a Type 4 driver. Because of the proprietary nature\
    \ of their network protocols, database vendors usually supply type 4 drivers.\n\
    \n# Which Driver should be Used?\n\nIf you are accessing one type of database,\
    \ such as Oracle, Sybase, or IBM, the preferred driver type is 4.\n\nIf your Java\
    \ application is accessing multiple types of databases at the same time, type\
    \ 3 is the preferred driver.\n\nType 2 drivers are useful in situations, where\
    \ a type 3 or type 4 driver is not available yet for your database.\n\nThe type\
    \ 1 driver is not considered a deployment-level driver, and is typically used\
    \ for development and testing purposes only.\n\nAfter you've installed the appropriate\
    \ driver, it is time to establish a database connection using JDBC.\n\nThe programming\
    \ involved to establish a JDBC connection is fairly simple. Here are these simple\
    \ four steps:\n\n- * Import JDBC Packages: Add import statements to your Java\
    \ program to import required classes in your Java code.\n- Register JDBC Driver:\
    \ This step causes the JVM to load the desired driver implementation into memory\
    \ so it can fulfill your JDBC requests.\n- Database URL Formulation: This is to\
    \ create a properly formatted address that points to the database which you wish\
    \ to connect.\n- Create Connection Object: Finally, code a call to the DriverManager\
    \ object'sgetConnection( ) method to establish actual database connection.\n\n\
    # Import JDBC Packages\n\nThe Import statements tell the Java compiler where to\
    \ find the classes you reference in your code and are placed at the beginning\
    \ of your source code.\n\nTo use the standard JDBC package, which allows you to\
    \ select, insert, update, and delete data in SQL tables, add the following imports\
    \ to your source code:\n\n```\nimport java.sql.*; // for standard JDBC programs\n\
    import java.math.*; // for BigDecimal and BigInteger support\n```\n\n# Register\
    \ JDBC Driver\n\nYou must register the driver in your program before you use it.\
    \ Registering the driver is the process by which the Oracle driver's class file\
    \ is loaded into the memory, so it can be utilized as an implementation of the\
    \ JDBC interfaces.\n\nYou need to do this registration only once in your program.\
    \ You can register a driver in one of two ways.\n\n# Approach I - Class.forName()\n\
    \nThe most common approach to register a driver is to use Java's Class.forName()\
    \ method, to dynamically load the driver's class file into\n\n![](img/e145b194969ce51c2b304489635cb841_27_0.png)\n\
    \nmemory, which automatically registers it. This method is preferable because\
    \ it allows you to make the driver registration configurable and portable.\n\n\
    The following example uses Class.forName() to register the Oracle driver:\n\n\
    ```\ntry {\n  Class.forName(\"oracle.jdbc.driver.OracleDriver\");\n} catch (ClassNotFoundException\
    \ ex) {\n  System.out.println(\"Error: unable to load driver class!\");\n  System.exit(1);\n\
    }\n```\n\nYou can use getInstance() method to work around noncompliant JVMs, then\
    \ you'll have to code for two extra Exceptions as follows:\n\n```\ntry {\n  Class.forName(\"\
    oracle.jdbc.driver.OracleDriver\").newInstance();\n} catch (ClassNotFoundException\
    \ ex) {\n  System.out.println(\"Error: unable to load driver class!\");\n  System.exit(1);\n\
    } catch (IllegalAccessException ex) {\n  System.out.println(\"Error: access problem\
    \ while loading driver!\");\n  System.exit(2);\n} catch (InstantiationException\
    \ ex) {\n  System.out.println(\"Error: unable to instantiate driver!\");\n  System.exit(3);\n\
    }\n```\n\n# Approach II - DriverManager.registerDriver()\n\nThe second approach\
    \ you can use to register a driver, is to use the static DriverManager.registerDriver()\
    \ method.\n\nYou should use the registerDriver() method if you are using a non-JDK\
    \ compliant JVM, as the one provided by Microsoft.\n\nThe following example uses\
    \ registerDriver() to register the Oracle driver:\n\n```\ntry {\n  Driver myDriver\
    \ = new oracle.jdbc.driver.OracleDriver();\n  DriverManager.registerDriver(myDriver);\n\
    } catch(ClassNotFoundException ex) {\n  System.out.println(\"Error: unable to\
    \ load driver class!\");\n  System.exit(1);\n}\n```\n\n# Database URL Formulation\n\
    \nAfter you've loaded the driver, you can establish a connection using the **DriverManager.getConnection()**\
    \ method. For easy reference, let me list the three overloaded DriverManager.getConnection()\
    \ methods:\n\n- getConnection(String url)\n- getConnection(String url, Properties\
    \ prop)\n- getConnection(String url, String user, String password)\n\nHere each\
    \ requires a database **URL**. A database URL is an address that points to your\
    \ database.\n\nFormulating a database URL is where most of the problems associated\
    \ with establishing a connection occurs.\n\nFollowing table lists down the popular\
    \ JDBC driver names and database URL.\n\n| RDBMS | JDBC driver name | URL format\
    \ |\n| --- | --- | --- |\n| MySQL | com.mysql.jdbc.Driver | jdbc:mysql://hostname/databaseName\
    \ |\n| ORACLE | oracle.jdbc.driver.OracleDriver | jdbc:oracle:thin:@hostname:port\
    \ Number:databaseName |\n| DB2 | COM.ibm.db2.jdbc.net.DB2Driver | jdbc:db2:hostname:port\
    \ Number/databaseName |\n| Sybase | com.sybase.jdbc.SybDriver | jdbc:sybase:Tds:hostname:port\
    \ Number/databaseName |\n\n![](img/e145b194969ce51c2b304489635cb841_29_0.png)\n\
    \nAll the highlighted part in URL format is static and you need to change only\
    \ the remaining part as per your database setup.\n\n# Create Connection Object\n\
    \nWe have listed down three forms of DriverManager.getConnection() method to create\
    \ a connection object.\n\n# Using a Database URL with a username and password\n\
    \nThe most commonly used form of getConnection() requires you to pass a database\
    \ URL, a username, and a password:\n\nAssuming you are using Oracle's thin driver,\
    \ you'll specify a host:portName for the database portion of the URL.\n\nIf you\
    \ have a host at TCP/IP address 192.0.0.1 with a host name of amrood, and your\
    \ Oracle listener is configured to listen on port 1521, and your database name\
    \ is EMP, complete database URL would be:\n\n```\njdbc:oracle:thin:amrood:1521:EMP\n\
    ```\n\nNow you have to call getConnection() method with appropriate username and\
    \ password to get a Connection object follows:\n\n```\nString URL = \"jdbc:oracle:thin:amrood:1521:EMP\"\
    \nString USER = \"username\"\nString PASS = \"password\"\nConnection conn = DriverManager.getConnection(URL,\
    \ USER, PASS);\n```\n\n# Using Only a Database URL\n\nA second form of the DriverManager.getConnection(\
    \ ) method requires only a database URL:\n\n```\nDriverManager.getConnection(String\
    \ url)\n```\n\nHowever, in this case, the database URL includes the username and\
    \ password and has the following form:\n\n```\njdbc:oracle:driver:username/password@database\n\
    ```\n\nSo, the above connection can be created as follows:\n\n```\nString URL\
    \ = \"jdbc:oracle:thin:username/password@amrood:1521:EMP\";\n```\n\n![](img/e145b194969ce51c2b304489635cb841_30_0.png)\n"
  mdcn: "\n# 类型 3：JDBC-网络型\n\n在类型 3 驱动中，使用三层架构来访问数据库。JDBC 客户端使用标准网络套接与中间件服务器通信。然后由中间件服务器转换为\
    \ DBMS 所需的格式并转发到数据库。\n\n这种驱动非常灵活，因为它在客户端不需要安装代码，且单个驱动实际上可以访问多个数据库。\n\n![](img/e145b194969ce51c2b304489635cb841_25_png\n\
    \n你可以将中间件服务器视为 JDBC “代理”，它为客户端执行调用。因此，为了有效使用这种驱动，你需要了解中间件服务器的配置。\n\n你的应用程序可能会使用类型\
    \ 1、2 或 4 驱动与数据库通信，了解这些会有帮助。\n\n# 类型 4：100% Java\n\n在类型 4 驱动中，基于 Java 的驱动通过套接直接与数据库通信。这是性能最高的驱动，且通常由供应商提供。\n\
    \n这种驱动非常灵活，你不需要在客户端或服务器上安装特殊软件。此外，这些驱动可以动态下载。\n\n![](img/e145b194969ce51c2b304489635cb841_26_0)\n\
    \nMySQL 的 Connector/J 驱动是类型 4。由于其网络协议的特性，数据库供应商通常提供类型 4 驱动。\n\n# 应使用哪种驱动？\n\n\
    如果你访问一种数据库，例如 Oracle、Sybase 或 IBM，首选驱动是类型 4。\n\n如果你的 Java 程序同时访问多个类型的数据库，类型 3\
    \ 是首选驱动。\n\n类型 2 驱动在类型 3 或类型 4 驱动可用的情况下有用。类型 1 驱动不认为是部署级驱动，通常仅用于开发目的。\n\n在安装了适当的驱动后，就可以使用\
    \ JDBC 建立数据库连接了。建立 JDBC 连接的编程非常简单。以下是四个步骤：\n\n- **导入包**：在 Java 程序中添加 import 语句导入所需的类。\n\
    - **注册 JDBC 驱动**：此步骤使 JVM 将所需的驱动加载到内存中，以满足 JDBC 请求。\n- **数据库 URL 配置**：创建一个指向你想要连接的数据库的正确格式地址。\n\
    - **创建连接对象**：最后，调用 DriverManager 对象的 `getConnection()` 方法建立实际数据库连接。\n\n# 导入 JDBC\
    \ 包\n\nImport 语句告诉 Java 编译器在哪里找到代码中引用的类，并位于源代码的开头。\n\n为了使用标准的 JDBC 包并在 SQL 表中进行选择、插入、更新和删除，请在源代码中添加以下导入：\n\
    \n```\nimport java.sql.*; // 用于标准 JDBC 程序\nimport java.math.*; // 用于 BigDecimal\
    \ 和 BigInteger\n```\n\n# 注册 JDBC 驱动\n\n在使用驱动之前，你必须在程序中注册它。注册驱动是将驱动类文件加载到内存中的过程，以便作为\
    \ JDBC 接口的实现。\n\n你需要在程序中执行此注册。你可以通过两种方法之一注册驱动。\n\n# 方法 I - Class.forName()\n\n\
    注册驱动的最常用方法是使用 Java 的 `Class.forName()` 方法，将驱动类文件动态加载到\n\n![](img/e145b194969ce51c2b304489635cb841_27_0内存中，这会自动注册它。这种方法更好，因为它允许你让驱动注册变得可配置且可移植。\n\
    \n以下示例使用 `Class.forName()` 注册 Oracle 驱动：\n\n```\ntry {\n  Class.forName(\"oracle.jdbc.driver.OracleDriver\"\
    );\n} catch (ClassNotFoundException ex) {\n  System.out.println(\"Error: 无法加载驱动类!\"\
    );\n  System.exit(1);\n}\n```\n\n你可以使用 `getInstance()` 方法来绕过不符合标准的 JVM，然后你需要为两个额外的异常编写代码：\n\
    \n```\ntry {\n  Class.forName(\"oracle.jdbc.driver.OracleDriver\").newInstance();\n\
    } catch (ClassNotFoundException ex) {\n  System.out.println(\"Error: 无法加载驱动类!\"\
    );\n  System.exit(1);\n} catch (IllegalAccessException ex) {\n  System.out.println(\"\
    Error: 加载驱动时出现问题!\");\n  System.exit(2);\n} catch (InstantiationException ex)\
    \ {\n  System.out.println(\"Error: 无法实例化驱动!\");\n  System.exit(3);\n}\n```\n\n\
    # 方法 II - DriverManager.registerDriver()\n\n你可以用于注册驱动的第二方法是使用静态的 `DriverManager.registerDriver()`\
    \ 方法。\n\n如果你在使用非 JDK 兼容的 JVM（例如微软提供的），则应该使用 `registerDriver()` 方法。\n\n以下示例使用 `registerDriver()`\
    \ 注册 Oracle 驱动：\n\n```\ntry {\n  Driver myDriver = new oracle.jdbc.driver.OracleDriver();\n\
    \  DriverManager.registerDriver(myDriver);\n} catch(ClassNotFoundException ex)\
    \ {\n  System.out.println(\"Error: 无法加载驱动类!\");\n}\n```\n\n# 数据库 URL 配置\n\n在加载驱动后，可以使用\
    \ **DriverManager.getConnection()** 方法建立连接。为了方便，这里列出了三种重载的 `getConnection()` 方法：\n\
    \n- `getConnection(String url)`\n- `getConnection(String url, Properties prop)`\n\
    - `getConnection(String url, String user, String password)`\n\n数据库 URL 是指向你数据库的地址。格式化\
    \ URL。下表列出了流行的 JDBC 驱动名称和数据库 URL：\n\n| RDBMS | JDBC 驱动名称 | URL 格式 |\n| :--- |\
    \ :--- | :--- |\n| MySQL | com.mysql.jdbc.Driver | jdbc:mysql://hostname/databaseName\
    \ |\n| ORACLE | oracle.jdbc.driver.OracleDriver | jdbc:oracle:thin:@hostname:port:databaseName\
    \ |\n| DB2 | COM.ibm.db2.jdbc.DB2Driver | jdbc:db2:hostname:port |\n| Sybase |\
    \ com.sybase.jdbc.SybDriver | jdbc:sybase:Tds:hostname:port |\n\n![](img/e145b194969ce51c2b30489635cb841_29_0)格式中的所有高亮部分都是静态的，你只需要根据数据库设置更改其余部分。\n\
    \n# 创建连接对象\n\n我们列出了用于创建连接对象的 `DriverManager.getConnection()` 方法。\n\n# 使用带用户名和密码的数据库\
    \ URL\n\n常用的 `getConnection()` 方法要求传递数据库 URL、用户名和密码：\n\n假设你正在使用 Oracle 的 thin\
    \ 驱动，你需要在 URL 的数据库部分指定主机:端口名。\n\n如果你有一个 TCP/IP 地址为 192.0.0.1、主机名为 amrood 的主机，且\
