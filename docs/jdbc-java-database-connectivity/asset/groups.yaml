    \ program, it produces the following:\n\n```\nThe Java Date is:Wed Oct 25 10:00:00\
    \ UTC 2023\nThe SQL DATE is: 2023-10-25\nThe SQL TIME is: 10:00:00\nThe SQL TIMESTAMP\
    \ is: 2023-10-25 10:00:00\n```\n"
