  - "[PAGE 108]\n\n# JDBC SQL Escape Syntax\n\nThe escape syntax gives you the flexibility\
    \ to use database specific features unavailable to you by using standard JDBC\
    \ methods and properties.\n\nThe general SQL escape format is as follows:\n\n\
    ```\n{keyword 'parameters'}\n```\n\nHere are the following escape sequences, which\
    \ you would find very useful while performing the JDBC programming:\n\n# d, t,\
    \ ts Keywords\n\nThey identify date, time, and timestamp literals. As you know,\
    \ no two DBMSs represent time and date the same way. This escape syntax tells\
    \ the driver to render the date or time in the target database's format. For Example:\n\
    \n```\n{d 'yyyy-mm-dd'}\n```\n\nWhere yyyy = year, mm = month; dd = date. Using\
    \ this syntax {d '2009-09-03'} is March 9, 2009.\n\nHere is a simple example how\
    \ to INSERT data in a table:\n\n```\n//Create a Statement object\nstmt = conn.createStatement();\n\
    //Insert data table, ID, First Name, Last Name, DOB\nString sql=\"INSERT INTO\
    \ STUDENTS VALUES \" + \n\"(100, 'Zara', 'Ali', {d '2001-12-16'}\");\nstmt.executeUpdate(sql);\n\
    ```\n\nSimilarly, you can use one of the following two syntaxes, either t or ts:\n\
    \n```\n{t 'hh:mm:ss'}\n```\n\nWhere hh = hour, mm = minute; ss = second. Using\
    \ this syntax {t '13:30:29'} is 1:30:29 PM.\n\n```\n{ts 'yyyy-mm-dd hh:mm:ss'}\n\
    ```\n\nThis is combined syntax of the above two syntax for 'd' and 't' to represent\
    \ timestamp.\n\n![](img/e145b194969ce51c2b304489635cb841_108_0.png)"
- md: "\n## escape Keyword\n\nThis keyword identifies the escape character used in\
    \ LIKE clauses. Useful when using the SQL wildcard %, which matches zero or more\
    \ characters. For example:\n\n```java\nString sql = \"SELECT symbol FROM MathSymbols\
    \ WHERE symbol LIKE '\\%%' {escape '\\\\'}\";\nstmt.execute(sql);\n```\n\nIf you\
    \ use the backslash character (\\) as the escape character, you also have to use\
    \ two backslash characters in your Java String literal, because the backslash\
    \ is also a Java escape character.\n\n## fn Keyword\n\nThis keyword represents\
    \ scalar functions used in a DBMS. For example, you can use SQL function length\
    \ to get the length of the string:\n\n```sql\n{fn length('Hello World')}\n```\n\
    \nThis returns 11, the length of the character string 'Hello World'.\n\n## call\
    \ Keyword\n\nThis keyword is used to call the stored procedures. For example,\
    \ for a stored procedure requiring an IN parameter, use the following syntax:\n\
    \n```sql\n{call my_procedure(?)}\n```\n\nFor a stored procedure requiring an IN\
    \ parameter and returning an OUT parameter, use the following syntax:\n\n```sql\n\
    {? = call my_procedure(?)}\n```\n\n## oj Keyword\n\nThis keyword is used to signify\
    \ outer joins. The syntax is as follows:\n\n```sql\n{oj outer-join}\n```\n\nWhere\
    \ outer-join = table {LEFT|RIGHT|FULL} OUTER JOIN {table | outer-join} on search-condition.\
    \ For example:\n\n```java\nString sql = \"SELECT Employees FROM oj ThisTable RIGHT\
    \ JOIN TableA on id = '100'\";\nstmt.execute(sql);\n```\n\n![](img/e145b194969ce51c2b304489635cb841_109_0.png)\n\
    \n## 14. STREAMING DATA\n\nA PreparedStatement object has the ability to use input\
    \ and output streams to supply parameter data. This enables you to place entire\
    \ files into database columns that can hold large values, such as CLOB and BLOB\
    \ data types.\n\nThere are several methods, which can be used to stream data:\n\
    \n- *setAsciiStream(): This method is used to supply large ASCII values.\n- *setCharacterStream():\
    \ This method is used to supply large UNICODE values.\n- *setBinaryStream(): This\
    \ method is used to supply large binary values.\n\nThe setXXStream() method requires\
    \ an extra parameter, the file size, besides the parameter placeholder. This parameter\
    \ informs the driver how data should be sent to the database using the stream.\n\
    \n### Example\n\nConsider we want to upload an XML file XML_Data.xml into a database\
    \ table. Here is the content of this XML file:\n\n```xml\n<?xml version=\"1.0\"\
    ?>\n<Employee>\n<id>100</id>\n<first>Zara</first>\n<last>Ali</last>\n<Salary>10000</Salary>\n\
    <Dob>18-08-1978</Dob>\n</Employee>\n```\n\nKeep this XML file in the same directory\
    \ where you are going to run this example.\nThis example would create a database\
    \ table XML_Data and then file XML_Data.xml would be uploaded into this table.\n\
    \nCopy and paste the following example in JDBCExample.java, compile and run as\
    \ follows:\n\n```java\n// Import required packages\nimport java.sql.*;\nimport\
    \ java.io.*;\nimport java.util.*;\n\npublic class JDBCExample {\n    // JDBC driver\
    \ name and database URL\n    static final String JDBC_DRIVER = \"com.mysql.jdbc.Driver\"\
    ;\n    static final String DB_URL = \"jdbc:mysql://localhost/EMP\";\n\n    //\
    \ Database credentials\n    static final String USER = \"username\";\n    static\
    \ final String PASS = \"password\";\n\n    public static void main(String[] args)\
    \ {\n        Connection conn = null;\n        PreparedStatement pstmt = null;\n\
    \        Statement stmt = null;\n        ResultSet rs = null;\n        try {\n\
    \            // Register JDBC driver\n            Class.forName(\"com.mysql.jdbc.Driver\"\
    );\n\n            // Open a connection\n            System.out.println(\"Connecting\
    \ to database...\");\n            conn = DriverManager.getConnection(DB_URL,USER,PASS);\n\
    \n            // Create a Statement object and build table\n            stmt =\
    \ conn.createStatement();\n            createXMLTable(stmt);\n\n            //\
    \ Open a File InputStream\n            File f = new File(\"XML_Data.xml\");\n\
    \            long fileLength = f.length();\n            InputStream fis = new\
    \ FileInputStream(f);\n\n            // Create PreparedStatement and stream data\n\
    \            String SQL = \"INSERT INTO XML_Data VALUES (?,?)\";\n           \
    \ pstmt = conn.prepareStatement(SQL);\n            pstmt.setInt(1,100);\n    \
    \        pstmt.setAsciiStream(2,fis,(int)fileLength);\n            pstmt.execute();\n\
    \n            //Close input stream\n            fis.close();\n\n            //\
    \ Do a query to get the row\n            SQL = \"SELECT Data FROM XML_Data WHERE\
    \ id=100\";\n            rs = stmt.executeQuery(SQL);\n            // Get the\
    \ first row\n            if (rs.next()) {\n              //Retrieve data from\
    \ input stream\n              InputStream xmlInputStream = rs.getAsciiStream(1);\n\
    \              int c;\n              ByteArrayOutputStream bos = new ByteArrayOutputStream();\n\
    \              while (( c = xmlInputStream.read()) != -1) {\n                bos.write(c);\n\
    \              }\n              // Print results\n              System.out.println(bos.toString());\n\
    \            }\n            // Clean-up environment\n            rs.close();\n\
    \            stmt.close();\n            pstmt.close();\n            conn.close();\n\
    \        } catch(SQLException se) {\n          //Handle errors for JDBC\n    \
    \      se.printStackTrace();\n        }catch(Exception e) {\n          //Handle\
    \ errors for Class.forName\n          e.printStackTrace();\n        }\n    } finally\
    \ {\n      //finally block used to close resources\n      try{\n        if(stmt!=null)\
    \ {\n          stmt.close();\n        }} catch(SQLException se2){\n        //\
    \ nothing we can do\n        try{\n          if(pstmt!=null) {\n            pstmt.close();\n\
    \          } catch(SQLException se2){\n          // nothing we can do\n      \
    \    try{\n            if(conn!=null) {\n              conn.close();\n       \
    \     } catch (SQLException se) {\n              se.printStackTrace();\n     \
    \       } //end finally try\n          }//end try\n        System.out.println(\"\
    Goodbye!\");\n      }//end try\n    } //end main\n\n    public static void createXMLTable(Statement\
    \ stmt) throws SQLException {\n        System.out.println(\"Creating XML_Data\
    \ table...\");\n        // Create SQL Statement\n        String readingDataSql\
    \ = \"CREATE TABLE XML_Data \" + \"(id INTEGER, Data LONG)\";\n        // Drop\
    \ table first if it exists.\n        try{\n          stmt.executeUpdate(\"DROP\
    \ TABLE XML_Data\");\n        } catch(SQLException se){\n          // do nothing\n\
    \        }//Build table.\n        stmt.executeUpdate(readingDataSql);\n    } //end\
    \ createXMLTable\n} //end JDBCExample\n```\n\n![](img/e145b194969ce51c2b304489635cb841_114_0.png)\n\
    \nNow let us compile the above example as follows:\n\n```bash\nC:\\java JDBCExample.java\n\
