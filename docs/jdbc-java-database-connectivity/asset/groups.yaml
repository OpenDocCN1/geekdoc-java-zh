    # JDBC 数据库连接


    ## 简单学习


    ## 关于教程


    JDBC API 是一种 Java API，可以访问任何类型的表格化数据，特别是存储在关系型数据库中的数据。JDBC 可以在 Windows、Mac OS
    以及各种 UNIX 平台上运行。


    ## 读者群


    本教程面向希望详细了解 JDBC 框架及其实际用法的 Java 程序员。


    ## 先决条件


    在开始本教程之前，你应该对 Java 语言良好的良好的。由于你将处理 RDBMS（关系型数据库管理系统），你应该熟悉 SQL 和数据库概念。


