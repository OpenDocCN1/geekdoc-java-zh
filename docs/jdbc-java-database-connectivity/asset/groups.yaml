    ## 5. DRIVER TYPES\n\n### What is JDBC Driver?\n\nJDBC drivers implement the defined\
    \ interfaces in the JDBC API.\n\nFor example, using JDBC drivers enable you to\
    \ open database connections or interact with it by sending SQL commands or receiving\
    \ results.\n\nThe java.sql package that ships with JDK various classes classes\
    \ with their behaviors and actual actual are done done--party Third party vendors\
    \ implement the java.sql.Driver interface.\n\n### JDBC Drivers Types\n\nJDBC driver\
    \ implementations vary because of the wide variety of operating systems and hardware\
    \ platforms in which Java operates. Sun has divided the implementation types into\
    \ four categories, Types 1, 2, 3, and 4, which is explained below:\n\n#### Type\
    \ 1: JDBC-ODBC Bridge Driver\n\nIn a Type 1 driver, a JDBC bridge is used to access\
    \ ODBC drivers installed on each client machine. Using ODBC requires configuring\
    \ on your system a Data Source Name (DSN) that represents the target database.\n\
    \nWhen Java first came out, this was a useful driver because most databases only\
    \ supported ODBC access but now this type of driver is recommended only for experimental\
    \ use or when no other alternative is available.\n\nimg/e145b194969ce51c2b304489635cb841_23_0.png)\n\
    \n#### Type 2: JDBC-Native API\n\nIn a Type 2 driver, JDBC API calls are converted\
    \ into native C/C++ API calls, which are unique to the database. These are typically\
    \ provided by the database vendors and used in the same manner as the JDBC-ODBC\
    \ Bridge. The vendor-specific driver must be installed on each client machine.\n\
    \nIf we change the Database, we have to change the native API, as it is specific\
    \ to a database and they are mostly obsolete, but you may realize some speed increase\
    \ with a Type 2 driver, because it eliminates ODBC's overhead.\n\nimg/e145b194969ce51c2b304489635cb841_24_1.png\n\
    \nThe Oracle Call Interface (OCI) driver is an example of a Type 2 driver.\n"
