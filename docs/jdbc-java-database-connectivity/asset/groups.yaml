    # 12. BATCH PROCESSING


    Batch Processing allows you to group related SQL statements into a batch and submit
    them with one call to the database.


    When you send several SQL statements to the database at once, you reduce the amount
    of communication overhead, thereby improving performance.


    +   * JDBC drivers are not required to support this feature. You should use the
    DatabaseMetaData.supportsBatchUpdates() method to determine if the target database
    updates batch processing. The method returns true if your JDBC drivers support
    this feature.

    * the addBatch() method of Statement, PreparedStatement, and CallableStatement
    is used to add individual statements to the batch. the executeBatch() is used
    to start the execution of all the statements together.

    * the executeBatch() returns an array of integers, and each element of the array
    represents the update count for the respective update statement.

    * Just as you can add statements to a batch for processing, you can remove them
    with the clearBatch() method. This method removes all the statements added with
    the addBatch() method. However, you cannot selectively choose which statement
    to remove.


    # Batching with Statement Object


    Here is a typical sequence of steps to use Batch Processing with Statament Object:


    +   * Create a Statement object using createStatement() methods.

    * Set auto-commit to false using setAutoCommit().

    * Add as many as SQL statements you like into batch using addBatch() method on
    created statement object.

    * Execute all the SQL statements using executeBatch() method on created statement
    object.

    * Finally, commit all the changes using commit() method.


    Example


    The following code snippet provides an example of a batch update using Statement
    object:


