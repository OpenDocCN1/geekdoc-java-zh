  - '[PAGE 25]


    # Type 3: JDBC-Net Pure Java


    In a Type 3 driver, a three-tier approach is used to access databases. The JDBC
    clients use standard network sockets to communicate with a middleware application
    server. The socket information is then translated by the middleware application
    server into the call format required by the DBMS, and forwarded to the database
    server.


    This kind of driver is extremely flexible, since it requires no code installed
    on the client and a single driver can actually provide access to multiple databases.


    ![](img/e145b194969ce51c2b304489635cb841_25_0.png)


    You can think of the application server as a JDBC "proxy," meaning that it makes
    calls for the client application. As a result, you need some knowledge of the
    application server''s configuration in order to effectively use this driver type.


    Your application server might use a Type 1, 2, or 4 driver to communicate with
    the database, understanding the nuances will prove helpful.


    # Type 4: 100% Pure Java


    In a Type 4 driver, a pure Java-based driver communicates directly with the vendor''s
    database through socket connection. This is the highest performance driver available
    for the database and is usually provided by the vendor itself.


    This kind of driver is extremely flexible, you don''t need to install special
    software on the client or server. Further, these drivers can be downloaded dynamically.'
  - '[PAGE 26]


    ![](img/e145b194969ce51c2b304489635cb841_26_0.png)


    MySQL''s Connector/J driver is a Type 4 driver. Because of the proprietary nature
    of their network protocols, database vendors usually supply type 4 drivers.


    # Which Driver should be Used?


    If you are accessing one type of database, such as Oracle, Sybase, or IBM, the
    preferred driver type is 4.


    If your Java application is accessing multiple types of databases at the same
    time, type 3 is the preferred driver.


    Type 2 drivers are useful in situations, where a type 3 or type 4 driver is not
    available yet for your database.


    The type 1 driver is not considered a deployment-level driver, and is typically
    used for development and testing purposes only.'
  - '[PAGE 27]


    After you''ve installed the appropriate driver, it is time to establish a database
    connection using JDBC.


    The programming involved to establish a JDBC connection is fairly simple. Here
    are these simple four steps:


    +   * Import JDBC Packages: Add import statements to your Java program to import
    required classes in your Java code.

    * Register JDBC Driver: This step causes the JVM to load the desired driver implementation
    into memory so it can fulfill your JDBC requests.

    * Database URL Formulation: This is to create a properly formatted address that
    points to the database which you wish to connect.

    * Create Connection Object: Finally, code a call to the DriverManager object''sgetConnection(
    ) method to establish actual database connection.


    # Import JDBC Packages


    The Import statements tell the Java compiler where to find the classes you reference
    in your code and are placed at the beginning of your source code.


    To use the standard JDBC package, which allows you to select, insert, update,
    and delete data in SQL tables, add the following imports to your source code:


    ```

    import java.sql.*; // for standard JDBC programs

    import java.math.*; // for BigDecimal and BigInteger support

    ```


    # Register JDBC Driver


    You must register the driver in your program before you use it. Registering the
    driver is the process by which the Oracle driver''s class file is loaded into
    the memory, so it can be utilized as an implementation of the JDBC interfaces.


    You need to do this registration only once in your program. You can register a
    driver in one of two ways.


    # Approach I - Class.forName()


    The most common approach to register a driver is to use Java''s Class.forName()
    method, to dynamically load the driver''s class file into


    ![](img/e145b194969ce51c2b304489635cb841_27_0.png)'
