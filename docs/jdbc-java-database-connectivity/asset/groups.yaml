    ```\n\n# 13. 存储过程\n\n我们在讨论 JDBC - Statements 章节时已经学习了如何使用存储过程。本章与其相似，但将为你提供关于\
    \ JDBC SQL 语法的额外信息。就像 Connection 对象创建 Statement 和 PreparedStatement 对象一样，它还会创建\
    \ CallableStatement 对象，它将用于执行对存储过程的调用。\n\n## 创建 CallableStatement\n\n假设你需要执行 Oracle\
    \ 存储过程：\n\n```sql\nCREATE OR REPLACE PROCEDURE getName(\n    EMP_ID IN NUMBER,\n\
    \    OUT EMP_FIRST VARCHAR\n) AS\nBEGIN\n    SELECT first INTO EMP_FIRST\n   \
    \ FROM Employees\n    WHERE ID = EMP_ID;\nEND;\n```\n\n注意：上面的存储过程是为 Oracle 编写的，但我们使用\
    \ MySQL 数据库，因此让我们编写相同的存储过程来创建它：\n\n```sql\nDELIMITER $$\nDROP PROCEDURE IF EXISTS\
    \ `getName` $$\nCREATE PROCEDURE `getName`(\n    IN EMP_ID INT, \n    OUT EMP_FIRST\
    \ VARCHAR(255)\n)\nBEGIN\n    SELECT first INTO EMP_FIRST\n    FROM Employees\n\
    \    WHERE ID = EMP_ID;\n$$\n\n![](img/e145b194969ce51c2b304489635cb841_103_0.png)\n\
    \n三种类型：IN、OUT 和 INOUT。\n\n| 类型 | 描述 |\n| :--- | :--- |\n| IN | 存储过程的参数。使用 setXXX()\
    \ 方法绑定值。 |\n| OUT | 存储过程返回的值。使用 getXXX() 方法检索。 |\n| INOUT | 包含输入和输出的参数。使用 setXXX()\
    \ 方法绑定值。 |\n\n以下代码片段显示了如何使用 CallableStatement：\n\n```java\nCallableStatement cstmt\
    \ = null;\ntry {\n    String SQL = \"{call getName(?,)}\";\n    cstmt = conn.prepareCall(SQL);\n\
    \    // ...\n} catch (SQLException e) {\n    // ...\n} finally {\n    if (cstmt\
    \ != null) {\n        cstmt.close();\n    }\n}\n```\n\n# JDBC SQL 转义语法\n\n转义语法允许你使用标准\
    \ JDBC 方法无法使用的特定数据库功能。通用的 SQL 转义格式如下：\n\n```\n{keyword 'parameters'}\n```\n\n\
    在执行 JDBC 编程时，你会发现以下转义序列非常有用：\n\n# d, t, ts 关键字\n\n它们标识日期、时间和时间戳字量。如你所知，没有两个数据库以相同的方式表示时间和日期。这种转义语法告诉驱动按目标数据库的格式渲染日期或时间。例如：\n\
    \n```\n{d 'yyyy-mm-dd'}\n```\n\n其中 yyyy = 年，mm = 月；dd = 日。使用这种语法 {d '2009-09-03'}\
    \ 是 2009 年 9 月 3 日。\n\n这是一个向表中插入数据的示例：\n\n```java\n// 创建 Statement 对象\nstmt =\
    \ conn.createStatement();\n// 向表中插入数据，ID、名、姓、生日\nString sql=\"INSERT INTO STUDENTS\
    \ VALUES \" + \n\"(100, 'Zara', 'Ali', {d '2001-12-16'})\");\nstmt.executeUpdate(sql);\n\
    ```\n\n同样，你可以使用以下两种语法之一 t 或 ts：\n\n```\n{t 'hh:mm:ss'}\n```\n\n其中 hh = 小时，mm =\
    \ 分钟；ss = 秒。使用这种语法 {t '13:30:29'} 是下午 1:30:29。\n\n```\n{ts 'yyyy-mm-dd hh:mm:ss'}\n\
    ```\n\n这是上述 'd' 和 't' 两种语法的组合，用于表示时间戳。\n\n![](img/e145b194969ce51c2b304489635cb841_108_0.png)\n\
    \n"
