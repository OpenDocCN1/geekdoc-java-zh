    \n从数据库查询读取数据的 SQL 语句以结果集的形式返回数据。`SELECT` 语句是从数据库中选择行并在结果集中查看它们的标准方法。`java.sql.ResultSet`\
    \ 接口表示数据库查询的结果集。\n\n`ResultSet` 对象维护一个游标，指向结果集中的当前行。“结果集”一术指的是包含在 `ResultSet`\
    \ 对象中的行和列数据。\n\n`ResultSet` 接口的方法可以分为三类：\n\n-   **导航方法**：用于移动游标箭头。\n-   **Get\
    \ 方法**：用于查看游标指向的当前行列中的数据。\n-   **Update 方法**：用于更新当前行列中的数据。这些更新也可以同步到底层数据库中。\n\n\
    游标可以根据 `ResultSet` 的属性移动。这些属性是在创建相应的 `Statement` 生成 `ResultSet` 时指定的。\n\nJDBC\
    \ 提供了以下连接方法来创建所需的 `ResultSet` 的语句：\n\n-   `createStatement(int RSType, int RSConcurrency)`\n\
    -   `prepareStatement(String SQL, int RSType, int RSConcurrency)`\n-   `prepareCall(String\
    \ sql, int RSType, int RSConcurrency)`\n\n第一个参数表示 `ResultSet` 的类型，第二个参数是两个常量之一，指定结果集是只读还是可更新。\n\
    \n## 类型 ResultSet\n\n如果没有更多行，返回 false。\n\n| 类型 | 说明 |\n| --- | --- |\n| ResultSet.FORWARD_ONLY\
    \ | 游标只能向前移动 |\n| ResultSet.SCROLL_INSENSITIVE | 游标可以向后滚动，且结果集对创建后的其他更改不敏感。 |\n\
    | ResultSet.SCROLL_SENSITIVE | 游标可以前后滚动，且结果集对创建后的其他更改敏感。 |\n\n## 并发 ResultSet\n\
    \n可能的 RSConcurrency 如下所示。如果你不指定并发类型，将自动获得 `CONCUR_READ_ONLY`。\n\n| 并发 | 说明 |\n\
    | --- | --- |\n| ResultSet.CONCUR_READ_ONLY | 创建只读结果集。 |\n| ResultSet.CONCUR_UPDATEABLE\
    \ | 创建可更新的结果集。 |\n\n我们之前所有的示例都可以写如下，初始化一个向前的、只读的 `ResultSet` 对象：\n\n```\ntry {\n\
    \    Statement stmt = conn.createStatement(\n        ResultSet.TYPE_FORWARD_ONLY,\n\
    \        ResultSet.CONCUR_READ_ONLY);\n}\ncatch (Exception ex) {\n    ...\n}finally\
    \ {\n    ...\n}\n```\n\n![](img/e145b194969ce51c2b304489635cb841_50_0)\n\n## 导航结果集\n\
    \n`ResultSet` 接口中有几个移动游标的方法，包括：\n\n| S.N. | 方法与说明 |\n| --- | --- |\n| 1 | public\
    \ void beforeFirst() throws SQLException | 将游标移动到第一行之前。 |\n| 2 | public void afterLast()\
    \ throws SQLException | 将游标移动到最后一行之后。 |\n| 3 | public boolean first() throws SQLException\
    \ | 将游标移动到第一行。 |\n| 4 | public void last() throws SQLException | 将游标移动到最后一行。 |\n\
    | 5 | public boolean absolute(int row) throws SQLException | 将游标移动到指定的行。 |\n|\
    \ 6 | public boolean relative(int row) throws SQLException | 从当前指向的位置向前或向后移动指定的行数。\
    \ |\n| 7 | public boolean previous() throws SQLException | 将游标移动到上一行。如果上一行不在结果集范围内，则返回\
    \ false。 |\n| 8 | public boolean next() throws SQLException | 将游标移动到下一行。如果结果集中没有更多行，则返回\
    \ false。 |\n"
