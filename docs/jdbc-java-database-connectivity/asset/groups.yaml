    \ | --- | --- |\n| VARCHAR | java.lang.String | setString | updateString |\n|\
    \ CHAR | java.lang.String | setString | updateString |\n| LONGVARCHAR | java.lang.String\
    \ | setString | updateString |\n| BIT | boolean | setBoolean | updateBoolean |\n\
    | NUMERIC | java.math.BigDecimal | setBigDecimal | updateBigDecimal |\n| TINYINT\
    \ | byte | setByte | updateByte |\n| SMALLINT | short | setShort | updateShort\
    \ |\n| INTEGER | int | setInt | updateInt |\n| BIGINT | long | setLong | updateLong\
    \ |\n| REAL | float | setFloat | updateFloat |\n| FLOAT | float | setFloat | updateFloat\
    \ |\n| DOUBLE | double | setDouble | updateDouble |\n| VARBINARY | byte[] | setBytes\
    \ | updateBytes |\n| BINARY | byte[] | setBytes | updateBytes |\n| DATE | java.sql.Date\
    \ | setDate | getDate |\n| TIME | java.sql.Time | setTime | updateTime |\n| TIMESTAMP\
    \ | java.sql.Timestamp | setTimestamp | updateTimestamp |\n| CLOB | java.sql.Clob\
    \ | setClob | updateClob |\n| BLOB | java.sql.Blob | setBlob | updateBlob |\n\
    | ARRAY | java.sql.Array | setArray | updateArray |\n| REF | java.sql.Ref | setRef\
    \ | updateRef |\n| STRUCT | java.sql.Struct | setStruct | updateStruct |\n\nJDBC\
    \ 3.0 has enhanced support for BLOB, CLOB, ARRAY, and REF data types. The ResultSet\
    \ object has updateBLOB(), updateCLOB(), updateArray(), and updateRef() methods\
    \ that enable you to directly manipulate the respective data on the server. The\
    \ getXXX() and updateXXX() methods enable you to convert specific Java types to\
    \ JDBC data types. The methods, setObject() and updateObject(), enable you to\
    \ map any Java type to JDBC data type to retrieve column value. Each method can\
    \ be used with column name or its ordinal position.\n\n| SQL | JDBC/Java | setXXX\
    \ | updateXXX |\n| :--- | :--- | :--- | :--- |\n| VARCHAR | java.lang.String |\
    \ setString | updateString |\n| CHAR | java.lang.String | setString | updateString\
    \ |\n| LONGVARCHAR | java.lang.String | setString | updateString |\n| BIT | boolean\
