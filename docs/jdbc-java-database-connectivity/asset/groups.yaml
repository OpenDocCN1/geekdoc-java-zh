    \ JDBC 应用程序时，此示例可以作为模板。\n\n此示例代码是根据上一章完成的环境和数据库设置编写的。\n\n将以下示例复制并粘贴到 FirstExample.java\
    \ 中，并如下方式编译和运行：\n\n```\n//STEP 1. 导入所需的包\n```\n\n```\nimport java.sql.*;\n\npublic\
