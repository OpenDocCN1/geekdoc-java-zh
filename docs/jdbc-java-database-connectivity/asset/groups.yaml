    \ | updateBigDecimal |\n| TINYINT | byte | setByte | updateByte |\n| SMALLINT\
    \ | short | setShort | updateShort |\n| INTEGER | int | setInt | updateInt |\n\
    | BIGINT | long | setLong | updateLong |\n| REAL | float | setFloat | updateFloat\
    \ |\n| FLOAT | float | setFloat | updateFloat |\n| DOUBLE | double | setDouble\
    \ | updateDouble |\n| VARBINARY | byte[] | setBytes | updateBytes |\n| BINARY\
    \ | byte[] | setBytes | updateBytes |\n| DATE | java.sql.Date | setDate | getDate\
    \ |\n| TIME | java.sql.Time | setTime | updateTime |\n| TIMESTAMP | java.sql.Timestamp\
    \ | setTimestamp | updateTimestamp |\n| CLOB | java.sql.Clob | setClob | updateClob\
    \ |\n| BLOB | java.sql.Blob | setBlob | updateBlob |\n| ARRAY | java.sql.Array\
    \ | setArray | updateArray |\n| REF | java.sql.Ref | setRef | updateRef |\n| STRUCT\
    \ | java.sql.Struct | setStruct | updateStruct |\n\n## Date & Time Data Types\n\
    \nThe java.sql.Date class maps to the SQL DATE type, and the java.sql.Time and\
    \ java.sql.Timestamp classes map to the SQL TIME and SQL TIMESTAMP types, respectively.\n\
    \nFollowing example shows how the Date and Time classes format the standard Java\
    \ date and time values to match the SQL data type requirements.\n\n```java\nimport\
    \ java.sql.Date;\nimport java.sql.Time;\nimport java.sql.Timestamp;\nimport java.util.*;\n\
    \npublic class SqlDateTime {\n    public static void main(String[] args) {\n \
