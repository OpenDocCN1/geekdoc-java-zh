    ```\n\n# 11. 异常 (EXCEPTIONS)\n\n异常处理允许你以控制的方式处理异常情况，例如程序定义的错误。\n\n当发生异常情况时，会抛出一个异常（thrown）。“抛出”一词意味着当前程序的执行停止，并且控制权被重定向到最近的\
    \ `catch` 子句。如果没有适用的 `catch` 子句，程序的执行将结束。\n\nJDBC 异常处理与 Java 异常处理非常相似，但对于 JDBC\
    \ 而言，你最常处理的异常是 `SQLException`。\n\nJDBC 异常\n\nSQLException 对象包含了以下方法，用于获取异常的相关信息：\n\
    \n| 方法 | 说明 |\n| --- | --- |\n| getErrorCode() | 获取错误代码。 |\n| getMessage() | 获取异常消息。\
    \ |\n| getSQLState() | 获取 SQL 状态。 |\n| getNextException() | 获取异常链中的下一个异常。 |\n\
    | printStackTrace() | 打印堆栈轨迹。 |\n\n JDBC 示例\n\n通过 `try-catch-finally` 块可以处理异常。这里是其通用的形式：\n\
    \n```java\nimport java.sql.*;\n\npublic class JDBCExample {\n  // 驱动程序\n  static\
    \ final String JDBC_DRIVER = \"com.mysql.jdbc.Driver\";\n  // 数据库 URL\n  static\
    \ final String DB_URL = \"jdbc://localhost/EMP\";\n  // 凭据\n  static final String\
    \ USER = \"username\";\n  static final String PASS = \"password\";\n\n  public\
    \ static void main(String[] args) {\n    Connection conn = null;\n    Statement\
    \ stmt = null;\n    ResultSet rs = null;\n\n    try {\n        // STEP 1：注册驱动\n\
    \        Class.forName(JDBC_DRIVER);\n\n        // STEP 3：建立连接\n        conn =\
    \ DriverManager.getConnection(DB_URL,USER,PASS);\n\n        // STEP 4：执行查询\n \
    \       stmt = conn.createStatement();\n        String sql = \"SELECT id, first,\
    \ last FROM Employees\";\n        rs = stmt.executeQuery(sql);\n\n        // STEP\
    \ 5：从结果集中提取数据\n        while(rs.next()){\n            // 获取列名\n            int\
    \ id = rs.getInt(\"id\");\n            int age = rs.getInt(\"age\");\n       \
    \     String first = rs.getString(\"first\");\n            String last = rs.getString(\"\
    last\");\n\n            // 显示值\n            System.out.print(\"ID: \" + id);\n\
    \            System.out.print(\", Age: \" + age);\n            System.out.print(\"\
    , First: \" + first);\n            System.out.println(\", Last: \" + last);\n\
    \        }\n    } catch(SQLException se) {\n        // 处理 JDBC 错误\n        se.printStackTrace();\n\
    \    } catch(Exception e) {\n        // 处理 Class.forName 的错误\n        e.printStackTrace();\n\
    \    } finally {\n        // finally 块用于关闭资源\n        // STEP 6：清理环境\n       \
    \ if(rs!=null) rs.close();\n        if(stmt!=null) stmt.close();\n        if(conn!=null)\
    \ conn.close();\n    }\n    System.out.println(\"Goodbye!\");\n  }\n\n  public\
    \ static void printRs(ResultSet rs) throws SQLException {\n    // 确保我们从第一行开始\n\
    \    rs.beforeFirst();\n    // ... 剩余代码\n  }\n}\n```\n\n学习使用 `try-catch-finally`\
    \ 块来处理异常。类似于关闭数据库连接。\n"
