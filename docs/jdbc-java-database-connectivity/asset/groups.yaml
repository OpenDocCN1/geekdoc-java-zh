- md: "\nID: 104, Age: 40, First: John, Last: Paul\n\nGoodbye!\nC:\\>\n\nThe JDBC\
    \ driver converts the Java data type to the appropriate JDBC type, before sending\
    \ it to the database. It uses a default mapping for most data types. For example,\
    \ a Java int is converted to SQL INTEGER. The following table summarizes the default\
    \ JDBC type that the Java data type is converted to when you call the setXXX()\
    \ method of the PreparedStatement or CallableStatement or ResultSet.\n\n| SQL\
