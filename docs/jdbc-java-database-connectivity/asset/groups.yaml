    # 3. ENVIRONMENT


    To start developing with JDBC, you should setup you JDBC environment following
    the steps shown below. We assume that you are working on a Windows platform.


    # Install Java


    Install J2SE Development Kit 5.0 (JDK 5.0) from Java Official Site.

    Make sure following environment variables are set as described below:


    +   * JAVA_HOME: This environment variable should point to the directory where
    you installed the JDK, e.g. C:\Program Files\Java\jdk1.5.0.

    * CLASSPATH: This environment variable should have appropriate paths, e.g. C:\Program
    Files\Java\jdk1.5.0_20\jre\bin.

    * PATH: This environment variable should point to appropriate JRE bin, e.g. C:\Program
    Files\Java\jre1.5.0_20\bin.


    It is possible you have these variable set already, but just to make sure here''s
    how to check.


    +   * Go to the control panel and double-click on System. If you are a Windows
    XP user, it is possible you to open Performance and Maintenance, before you will
    see the System icon.

    * Go to the Advanced tab and click on the Environment Variables.

    * Now check if all the above mentioned variables are set properly.


    You automatically get both JDBC packages java.sql and javax.sql, when you install
    J2SE Development Kit 5.0 (JDK 5.0).


    # Install Database


    The most important thing you will need, of course is an actual running database
    with a table that you can query and modify.


    Install a database that is most suitable for you. You can have plenty of choices
    and common are:


    +   * MySQL DB: MySQL is an open source database. You can download it from MySQL
    Official Site. We recommend downloading the full Windows installation.'
  - '[PAGE 15]


    In addition, download and install MySQL Administrator as well as MySQL Query Browser.
    These are GUI based tools that will make your development much easier.


    Finally, download and unzip MySQL Connector/J (the MySQL JDBC driver) in a convenient
    directory. For the purpose of this tutorial, we will assume that you have installed
    the driver at C:\Program Files\MySQL\mysql-connector-java-5.1.8.


    Accordingly, set CLSPATH to C:\Program Files\MySQL\mysql-connector-java-5.1.8.jar.
    Your driver version may vary based on your installation.


    +   - Postgres DB is an open source database. You can download it from Postgres
    Official Site.


    The Postgres installation contains a GUI based administrative tool called pgAdmin
    III. JDBC drivers are also included as part of the installation.


    +   - Oracle DB: Oracle DB is a commercial database sold by Oracle. We assume
    that you have the necessary distribution media to install it.


    Oracle installation includes a GUI based administrative tool called Enterprise
    Manager. JDBC drivers are also included as a part of the installation.


    # Database Drivers


    The latest JDK includes a JDBC-ODBC Bridge driver that makes most Open Database
    Connectivity (ODBC) drivers available to programmers using the JDBC API.


    Now-a-days, most of the Database vendors are supplying appropriate JDBC drivers
    along with Database installation. So, you should not worry about this part.


    # Set Database Credential


    For this tutorial we are going to use MySQL database. When you install any of
    the above database, its administrator ID is set to root and gives provision to
    set a password of your choice.


    Using root ID and password you can create another user ID and password, or you
    can use root ID and password for your JDBC application.


    There are various database operations like database creation and deletion, which
    would need administrator ID and password.


    For rest of the JDBC tutorial, we would use MySQL Database with username and password
    as password.


