    ```\n\n# 13. STORED PROCEDURE\n\nWe have learnt how to use Stored Procedures while\
    \ discussing the JDBC - Statements chapter. This chapter is similar to that, but\
    \ would give you additional information about JDBC SQL syntax. Just as a Connection\
    \ object creates the Statement and PreparedStatement objects, it creates the CallableStatement\
    \ object, which would be used to execute a call to stored procedure.\n\n## Creating\
    \ CallableStatement\n\nSuppose, you need to execute the Oracle stored procedure:\n\
    \n```sql\nCREATE OR REPLACE PROCEDURE getName(\n    EMP_ID IN NUMBER,\n    OUT\
    \ EMP_FIRST VARCHAR\n) AS\nBEGIN\n    SELECT first INTO EMP_FIRST\n    FROM Employees\n\
    \    WHERE ID = EMP_ID;\nEND;\n```\n\nNOTE: Above stored procedure has been written\
    \ for Oracle, but we are working with MySQL database, so let us write same stored\
    \ procedure to create it:\n\n```sql\nDELIMITER $$\nDROP PROCEDURE IF EXISTS `getName`\
    \ $$\nCREATE PROCEDURE `getName`(\n    IN EMP_ID INT, \n    OUT EMP_FIRST VARCHAR(255)\n\
    )\nBEGIN\n    SELECT first INTO EMP_FIRST\n    FROM Employees\n    WHERE ID =\
    \ EMP_ID;\nEND $$\n```\n\n![](img/e145b194969ce51c2b304489635cb841_105_0.png)\n\
    \nThree types of parameters exist: IN, OUT, and INOUT. The PreparedStatement object\
    \ only uses IN parameter. The CallableStatement object can use all three. Here\
    \ are the definitions of each:\n\n| Parameter | Description |\n| :--- | :--- |\n\
    | IN | A parameter whose value is unknown when the SQL statement is created. You\
    \ bind values to IN with setXXX() methods. |\n| OUT | A parameter whose value\
    \ is supplied by the SQL statement returns. You retrieve values from OUT with\
    \ getXXX() methods. |\n| INOUT | A parameter that provides both input and output\
    \ values. You bind variables with setXXX() methods and retrieve values with getXXX()\
    \ methods. |\n\nThe following code snippet shows how to employ Connection.prepareCall()\
    \ method to instantiate CallableStatement object based on the preceding stored\
    \ procedure:\n\n```java\nCallableStatement cstmt = null;\ntry {\n    String SQL\
    \ = \"{call getName(?, ?)}\";\n    cstmt = conn.prepareCall(SQL);\n    // ...\n\
    } catch (SQLException e) {\n    // ...\n} finally {\n    // ...\n}\n```\n\n# JDBC\n\
    \nThe String variable SQL represents the stored procedure, with parameter placeholders.\
    \ Using CallableStatement objects is like using PreparedStatement objects. You\
    \ must bind values to all the parameters before executing the statement, or you\
    \ will receive an SQLException. If you have IN parameters, just follow the same\
    \ rules and techniques that apply to a PreparedStatement object; use the setXXX()\
    \ method that corresponds to the Java data type you are binding. When you use\
    \ OUT and INOUT parameters, you must employ an additional CallableStatement method,\
    \ registerOutParameter(). The registerOutParameter() method binds the JDBC data\
    \ type to the data type the stored procedure is expected to return. Once you have\
    \ called your procedure, you retrieve the value from the OUT parameter with the\
    \ appropriate getXXX() method. This method casts the retrieved value of SQL to\
    \ Java data type.\n\n# Closing CallableStatement Object\n\nJust as you close other\
    \ Statement, for the same reason you should also close the CallableStatement object.\
    \ A simple call to the close() method will do the job. If you close the Connection\
    \ object first, it will close the CallableStatement as well. However, you should\
    \ always close the CallableStatement object to ensure proper cleanup.\n\n```java\n\
    CallableStatement cstmt = null;\ntry {\n    String SQL = \"{call getName(?, ?)}\"\
    ;\n    cstmt = conn.prepareCall(SQL);\n} catch (SQLException e) {\n}\nfinally\
    \ {\n    cstmt.close();\n}\n```\n\nWe have studied more details in the Callable\
    \ - Example Code section earlier.\n\n# JDBC SQL Escape Syntax\n\nThe escape syntax\
    \ gives you the flexibility to use database-specific features unavailable to you\
    \ by standard JDBC methods and properties. The general SQL escape format is as\
    \ follows:\n\n```\n{keyword 'parameters'}\n```\n\nHere are the following escape\
    \ sequences, which you would find very useful while performing JDBC programming:\n\
    \n# d, t, ts Keywords\n\nThey identify date, time, and timestamp literals. As\
    \ you know no two DBMSs represent time and date the same way. This escape syntax\
    \ tells the driver to render the date or time in the target database's format.\
    \ For Example:\n\n```\n{d 'yyyy-mm-dd'}\n```\n\nWhere yyyy = year, mm = month;\
    \ dd = date. Using this syntax {d '2009-09-03'} is March 9, 2009.\n\nHere is a\
    \ simple example how to INSERT data in a table:\n\n```java\n//Create a Statement\
    \ object\nstmt = conn.createStatement();\n//Insert data table, ID, First Name,\
    \ Last Name, DOB\nString sql=\"INSERT INTO STUDENTS VALUES \" + \n\"(100, 'Zara',\
    \ 'Ali', {d '2001-12-16'})\");\nstmt.executeUpdate(sql);\n```\n\nSimilarly, you\
    \ can use one of the following two syntaxes, either t or ts:\n\n```\n{t 'hh:mm:ss'}\n\
    ```\n\nWhere hh = hour, mm = minute; ss = second. Using this syntax {t '13:30:29'}\
    \ is 1:30:29 PM.\n\n```\n{ts 'yyyy-mm-dd hh:mm:ss'}\n```\n\nThis is combined syntax\
    \ of the above two syntax for 'd' and 't' to represent timestamp.\n\n![](img/e145b194969ce51c2b304489635cb841_108_0.png)\n"
