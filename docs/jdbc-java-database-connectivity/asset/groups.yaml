    \ IF EXISTS `EMP`.`getEmpName` $$\nCREATE PROCEDURE `EMP`.`getEmpName`\n(IN EMP_ID\
    \ INT, OUT EMP_FIRST VARCHAR(255))\nBEGIN\nSELECT FIRST INTO EMP_FIRST\nFROM Employees\n\
    WHERE ID = EMP_ID;\nEND $$$\n\nDELIMITER ;\n```\n\nThis sample code has been written\
    \ based on the environment and database setup done in the previous chapters.\n\
    \nCopy and paste the following example in JDBCExample.java, compile and run as\
    \ follows:\n\n```\n//STEP 1. Import required packages\nimport java.sql.*;\n\n\
    public class JDBCExample {\n    // JDBC driver name and database URL\n    static\
    \ final String JDBC_DRIVER = \"com.mysql.jdbc.Driver\";\n    static final String\
    \ DB_URL = \"jdbc:mysql://localhost/EMP\";\n\n    // Database credentials\n  \
    \  static final String USER = \"username\";\n    static final String PASS = \"\
    password\";\n```\n\n![](img/e145b194969ce51c2b304489635cb841_46_0.png)\n\n```\n\
    public static void main(String[] args) {\n    Connection conn = null;\n    CallableStatement\
    \ stmt = null;\n    try{\n        // STEP 2: Register JDBC driver\n        Class.forName(\"\
    com.mysql.jdbc.Driver\");\n\n        // STEP 3: Open a connection\n        System.out.println(\"\
    Connecting to database...\");\n        conn = DriverManager.getConnection(DB_URL,USER,PASS);\n\
    \n        // STEP 4: Execute a query\n        System.out.println(\"Creating statement...\"\
    );\n        String sql = \"{call getEmpName(?, ?)}\";\n        stmt = conn.prepareStatement(sql);\n\
    \n        //Bind IN parameter first, then bind OUT parameter\n        int empID\
    \ = 102;\n        stmt.setInt(1, empID); // This would set ID as 102\n       \
    \ // Because second parameter is OUT so register it\n        stmt.registerOutParameter(2,\
    \ java.sql.Types.VARCHAR);\n\n        //Use execute method to run stored procedure.\n\
    \        System.out.println(\"Executing stored procedure... \");\n        stmt.execute();\n\
    \n        //Retrieve employee name with getXXX method\n        String empName\
    \ = stmt.getString(2);\n        System.out.println(\"Emp Name with ID:\" + empID\
    \ + \" is \" + empName);\n\n        stmt.close();\n        conn.close();\n   \
    \ } catch(SQLException e){\n```\n//Handle errors for JDBC\nse.printStackTrace();\n\
    catch(Exception e){\n    //Handle errors for Class.forName\n    e.printStackTrace();\n\
    }finally{\n    //finally block used to close resources\n    try{\n        if(stmt!=null)\n\
    \            stmt.close();\n    catch(SQLException se2){\n        // nothing we\
    \ can do\n    try{\n            if(conn!=null)\n                conn.close();\n\
    \        catch(SQLException se){\n            se.printStackTrace();\n        }/end\
    \ finally try\n    }}//end try\nSystem.out.println(\"Goodbye!\");\n}//end main\n\
    //end JDBCExample\n```\n\nNow let us compile the above example as follows:\n\n\
    ```\nC:\\>javac JDBCExample.java\n```\n\nWhen you run java JDBCExample, it produces\
    \ the following result:\n\n```\nC:\\>java JDBCExample\nConnecting to database...\n\
    Creating statement...\nExecuting stored procedure...\nEmp Name with ID:102 is\
    \ Zaid\nGoodbye!\n```\n\n```\nC:\\>\n```\n\n## 8. RESULT SETS\n\nThe SQL statements\
    \ that read data from a database query, return the data in a result set. The SELECT\
    \ statement is the standard way to select rows from a database and view them in\
    \ a result set. The java.sql.ResultSet interface represents the result set of\
    \ a database query.\n\nA ResultSet object maintains a cursor that points to the\
    \ current row in the result set. The term \"result set\" refers to the row and\
    \ column data contained in a ResultSet object.\n\nThe methods of the ResultSet\
    \ interface can be broken down into three categories:\n\n- **Navigational methods**:\
    \ Used to move the cursor arrow.\n- **Get methods**: Used to view the data in\
    \ the columns of the current row being pointed by the cursor.\n- **Update methods**:\
    \ Used to update the data in the columns of the current row. The updates can then\
    \ be updated in the underlying database as well.\n\nThe cursor is movable based\
    \ on the properties of the ResultSet. These properties are designated when the\
    \ corresponding Statement generates the ResultSet is created.\n\nJDBC provides\
    \ the following connection methods to create statements with desired ResultSet:\n\
    \n- **createStatement(int RSType, int RSConcurrency)**\n- **prepareStatement(String\
    \ SQL, int RSType, int RSConcurrency)**\n- **prepareCall(String sql, int RSType,\
    \ int RSConcurrency)**\n\nThe first argument indicates the type of ResultSet and\
    \ the second argument is one of two constants for specifying whether result set\
    \ is read-only or updatable.\n\n## Type ResultSet\n\nThe method returns false\
    \ if there are no more rows in the result set.\n\n| Type | Description |\n| ---\
    \ | --- |\n| ResultSet.FORWARD_ONLY | The cursor can only move forward in |\n\
    | ResultSet.SCROLL_INSENSITIVE | The cursor can scroll forward and backward, and\
    \ the result set is not sensitive to changes made by others after the result set\
    \ was created. |\n| ResultSet.SCROLL_SENSITIVE | The cursor can scroll forward\
    \ and backward, and the result set is sensitive to changes made by others after\
    \ the result set was created. |\n\n## Concurrency ResultSet\n\nThe possible RSConcurrency\
    \ are given below. If you do not specify any Concurrency type, you will automatically\
    \ get one that is CONCUR_READ_ONLY.\n\n| Concurrency | Description |\n| --- |\
    \ --- |\n| ResultSet.CONCUR_READ_ONLY | Creates a read-only result set. |\n| ResultSet.CONCUR_UPDATEABLE\
    \ | Creates an updateable result set. |\n\nAll our examples written so far can\
    \ be written as follows, which initializes a Statement object to create forward-only,\
    \ read only ResultSet object:\n\n```\ntry {\n    Statement stmt = conn.createStatement(\n\
    \        ResultSet.TYPE_FORWARD_ONLY,\n        ResultSet.CONCUR_READ_ONLY);\n\
    }\ncatch (Exception ex) {\n    ...\n}\nfinally {\n    ...\n}\n```\n\n![](img/e145b194969ce51c2b304489635cb841_50_0)\n\
    \n## Navigating a Result Set\n\nThere are several methods in the ResultSet interface\
    \ that involve moving the cursor, including:\n\n| S.N. | Methods & Description\
    \ |\n| 1 | public void beforeFirst() throws SQLException <br> Moves the cursor\
    \ just before the first row. |\n| 2 | public void afterLast() throws SQLException\
    \ <br> Moves the cursor just after the last row. |\n| 3 | public boolean first()\
    \ throws SQLException <br> Moves the cursor to the first row. |\n| 4 | public\
    \ void last() throws SQLException <br> Moves the cursor to the last row. |\n|\
    \ 5 | public boolean absolute(int row) throws SQLException <br> Moves the cursor\
    \ to the specified row. |\n| 6 | public boolean relative(int row) throws SQLException\
    \ <br> Moves the cursor the given number of rows forward or backward, from where\
    \ it is currently pointing. |\n| 7 | public boolean previous() throws SQLException\
    \ <br> Moves the cursor to the previous row. This method returns false if the\
    \ previous row is off the result set. |\n| 8 | public boolean next() throws SQLException\
    \ <br> Moves the cursor to the next row. This method returns false if there are\
    \ no more rows in the result set. |\n\n![](img/e145b194969ce51c2b304489635cb841_51_0)\n"
