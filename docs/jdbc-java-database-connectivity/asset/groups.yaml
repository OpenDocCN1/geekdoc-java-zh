    \ 20, First: Sima, Last: Chug\n\nGoodbye!\n:\\>\n```\n\n# 11. EXCEPTIONS\n\nException\
    \ handling allows you to handle exceptional conditions such as program-defined\
    \ errors in a controlled fashion.\n\nWhen an exception condition occurs, an exception\
    \ is thrown. The term thrown means that current program execution stops, and the\
    \ control is redirected to the nearest catch clause. If no applicable catch exists,\
    \ then the program's execution ends.\n\nJDBC Exception handling is very similar\
    \ to the Java Exception handling but for JDBC, the most common exception you'll\
    \ deal with is java.sql.SQLException.\n\n# SQLException Methods\n\nAn SQLException\
    \ can occur both in the driver and the database. When such an exception occurs,\
    \ an object of type SQLException will be passed to the catch clause.\n\nThe passed\
    \ SQLException object has the following methods available for retrieving additional\
    \ information about the exception:\n\n| Method | Description |\n| --- | --- |\n\
    | getErrorCode() | Gets the error number associated with the exception. |\n| getMessage()\
    \ | Gets the JDBC driver's error message for an error, handled by the driver or\
    \ gets the Oracle error number and message for a database error. |\n| getSQLState()\
    \ | Gets the XOPEN SQLState string. For a JDBC driver error, no useful information\
    \ is returned from this method. For a database error, the five-digit XOPEN SQLstate\
    \ is returned. This method can return null. |\n| getNextException() | Gets the\
    \ next Exception object in the exception chain. |\n\n# JDBC\n\n| Method | Description\
    \ |\n| --- | --- |\n| printStackTrace( ) | Prints the current exception, or throwable,\
    \ and its backtrace to a standard error stream. |\n| printStackTrace(PrintStream)\
    \ | Prints this throwable and its backtrace to the print stream you specify. |\n\
    | printStackTrace(PrintWriter) | Prints this throwable and its backtrace to the\
    \ print stream you specify. |\n\nBy utilizing the information available from the\
    \ Exception object, you can catch an exception and continue your program appropriately.\
    \ Here is the general form of a try block:\n\n```\ntry {\n  // Your risky code\
    \ goes between these curly braces!!!\ncatch(Exception ex) {\n  // Your exception\
    \ handling code goes between these\n  // curly braces, similar to the exception\
    \ clause\n  // in a PL/SQL block.\n}\nfinally {\n  // Your must-always-be-executed\
    \ code goes between these\n  // curly braces. Like closing database connection.\n\
    }\n```\n\n# Example\n\nStudy the following code to understand the usage of try-catch-finally\
    \ blocks.\n\n```java\nimport java.sql.*;\n\npublic class JDBCExample {\n  // driver\
    \ name\n  static final String JDBC_DRIVER = \"com.mysql.jdbc.Driver\";\n  // database\
    \ URL\n  static final String DB_URL = \"jdbc://localhost/EMP\";\n  // credentials\n\
    \  static final String USER = \"username\";\n  static final String PASS = \"password\"\
    ;\n\n  public static void main(String[] args) {\n    Connection conn = null;\n\
    \    Statement stmt = null;\n    ResultSet rs = null;\n\n    try{\n        //\
    \ STEP 1: Register driver\n        Class.forName(JDBC_DRIVER);\n\n        // STEP\
    \ 3: Open a connection\n        conn = DriverManager.getConnection(DB_URL,USER,PASS);\n\
    \n        // STEP 4: Execute a query\n        stmt = conn.createStatement();\n\
    \        String sql = \"SELECT id, first, last FROM Employees\";\n        rs =\
    \ stmt.executeQuery(sql);\n\n        // STEP 5: Extract data from result set\n\
    \        while(rs.next()){\n            // Retrieve column name\n            int\
    \ id = rs.getInt(\"id\");\n            int age = rs.getInt(\"age\");\n       \
    \     String first = rs.getString(\"first\");\n            String last = rs.getString(\"\
    last\");\n\n            // Display values\n            System.out.print(\"ID:\
    \ \" + id);\n            System.out.print(\", Age: \" + age);\n            System.out.print(\"\
    , First: \" + first);\n            System.out.println(\", Last: \" + last);\n\
    \        }\n    } catch(SQLException se) {\n        //Handle errors for JDBC\n\
    \        se.printStackTrace();\n    } catch(Exception e) {\n        //Handle errors\
    \ for Class.forName\n        e.printStackTrace();\n    } finally {\n        //finally\
    \ block used to close resources\n        // STEP 6: Clean-up environment\n   \
    \     if(rs!=null) rs.close();\n        if(stmt!=null) stmt.close();\n       \
    \ if(conn!=null) conn.close();\n    }\n    System.out.println(\"Goodbye!\");\n\
    \  }\n\n  public static void printRs(ResultSet rs) throws SQLException {\n   \
    \ //Ensure we start with first row\n    rs.beforeFirst();\n    // ... rest of\
    \ method\n  }\n}\n```\n*(Note: The OCR for the code was fragmented across pages;\
