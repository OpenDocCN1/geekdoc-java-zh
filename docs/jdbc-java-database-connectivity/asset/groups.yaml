    # 14. STREAMING DATA


    A PreparedStatement object has the ability to use input and output streams to
    supply parameter data. This enables you to place entire files into database columns
    that can hold large values, such as CLOB and BLOB data types.


    There are several methods, which can be used to stream data:


    +   * *setAsciiStream(): This method is used to supply large ASCII values.

    * *setCharacterStream(): This method is used to supply large UNICODE values.

    * *setBinaryStream(): This method is used to supply large binary values.


    The setXXStream() method requires an extra parameter, the file size, besides the
    parameter placeholder. This parameter informs the driver how data should be sent
    to the database using the stream.


    Example

    Consider we want to upload an XML file XML_Data.xml into a database table. Here
    is the content of this XML file:


    ```

    <?xml version="1.0"?>

