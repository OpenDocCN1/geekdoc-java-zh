    # 11.3.2 Admin microservice


    Now that Kafka is running and your topic is created, it’s time to modify the Admin
    microservice to produce events onto the topic!

    We will use a library that converts the pull approach of Kafka into a push approach.
    This library is in fact but easy to use because it removes a lot of the boilerplate
    code that is required when using the Kafka APIs directly. It’s written as a CDI
    extension and is available as Maven artifacts for you to consume. The code is
    available at https://github.com/aerogear/kafka-cdi.


    What’s the advantage of converting Kafka’s pull into a push one? It’s beneficial
    for those of us more familiar with Enterprise Java development, where with the
    CDI programming model we’re able to listen for events and perform an action when
    we receive one. This is what the Kafka library we’re using brings for us, the
    ability to listen for events every time a new record is written to a topic, just
    as if it were a CDI listener.


