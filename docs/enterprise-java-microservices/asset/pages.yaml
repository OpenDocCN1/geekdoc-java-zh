  md: "# Consuming a microservice with a Java client library\n\nexecutorService().execute(()\
    \ -> { Pass the lambda expression to an executor for processing. HttpURLConnection\
    \ connection = null;\n\n```\ntry {\n  // The code to open the connection, check\
    \ the status code,\n  // and process the response is identical to the synchronous\n\
    \  // example has been removed.\n  asyncResponse.resume(category);\n} catch (IOException\
    \ e) {\n  asyncResponse.resume(e);\n} finally {\n  assert connection != null;\n\
    \  connection.disconnect();\n}\n```\n\nResume the AsyncResponse with the deserialized\
    \ category instance.\nResume the AsyncResponse with an exception.\n\nThe listing\
    \ introduced concepts you haven't seen before—namely, @Suspended and AsyncResponse.\
    \ These two pieces are the core of how JAX-RS handles client requests asynchronously.\
    \ @Suspended informs the JAX-RS runtime that the HTTP request from the client\
    \ should be suspended until a response is ready. AsyncResponse indicates how the\
    \ developer informs the runtime that a response is ready or has failed to complete.\
    \ What does that look like? Take a look at figure 6.4.\n\n![](img/d166e73dc5b37ac6ba449ba856b8eebf_123_0.png)\n\
    \nHere's what is happening at each step within figure 6.4:\n\n+   1 An HTTP request\
    \ arrives from a browser or another client.\n2 getCategoryTreeAsync() triggers\
    \ code to be executed in a separate thread. On completion of getCategoryTreeAsync(),\
    \ the client request is suspended and the HTTP request thread that was handling\
    \ it is made available to handle additional requests."
