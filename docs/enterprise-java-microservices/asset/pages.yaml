  md: 'NOTE Payara Micro came out of the work that Payara was doing in providing fixes
    and enhancements to GlassFish v4.x via its Payara Server. Payara Micro was first
    released in May 2015 as a subset of Payara Server. Payara Micro has now surpassed
    version 5.181.


    There are certain advantages to having a deployment that deploys your application,
    in a traditional application server. The biggest advantage is that the Payara
    distribution can be used as a Docker layer. This makes it possible to create a
    Docker image containing that layer, which can then be used many times to package
    different applications with Docker.


    The major downside to this type of JSAs runtime is that it''s not possible to
    remove additional pieces. For instance, if your application requires only servants,
    there''s no way to remove parts such as JAX-RS. The advantages of this approach
    outweigh such downside, but that''s a decision for an enterprise to make based
    on its situation. We''ll cover a more flexible approach to JSAs a bit later.


    What does Payara Micro provide? Figure 3.6 compares the Payara distribution with
    the Web Profile.


    Let''s take a look at how your JAX-RS, CDI, JMS microservice uses Payara Micro;
    see Figure 3.7.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_66_0.png)


    Figure 3.6 Payara Micro compared to Web Profile


