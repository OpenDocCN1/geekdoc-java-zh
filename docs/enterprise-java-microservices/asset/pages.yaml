  md: '+   Reduced security footprint—Fewer ports are being opened for various features,
    and fewer services are running. In addition, you have a significantly reduced
    surface area for potential critical vulnerabilities (CVEs).


    +   Separation between applications—Many applications were usually deployed to
    a single application server.


    +   Simplified upgrades—The upgrade impacts a single application only.


    Greater separation between applications can mean a great things, so it warrants
    additional explanation. Over the years that Enterprise Java applications have
    been deployed into production, an application server rarely would contain a single
    application. Typically, an application server would be running anywhere from a
    handful to dozens of applications in a single instance.


    As you can see in figure 3.4, JeAS runtimes provide a greater isolation between
    different microservices than applications in a traditional Java EE application
    server.


