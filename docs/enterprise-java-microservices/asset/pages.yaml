  md: '# Why does a microservice need to be discovered?


    But this approach doesn''t allow for easy scaling of an application or microservice,
    either up or down. With a shift toward cloud deployments, one of the biggest changes
    is the way an environment is charged to an enterprise.


    In the past, enterprises would have internal infrastructure to host all their
    applications, whether for internal or public use. The main cost with internal
    infrastructure is in the initial setup. When that''s complete, the ongoing hardware
    cost is minimal, though it does result in a larger operations cost from managing
    an internal infrastructure.


    A migration to the cloud for most enterprises means not hosting applications on
    their own infrastructure instead of deploying to external hosting providers. Examples
    of these are Red OpenShift, Google Cloud, and Amazon Web Services. These providers
    shift the cost away from large up-front hardware installations to regular usage
    charges, usually on a monthly basis. This shift in the cost mechanism opens the
    door to costly scaling down an application when it''s used.


    Another upside to a scalable environment is being able to scale up when load increases
    without the often long hardware provision process of an enterprise. This is particularly
    benefit to an enterprise that experiences extremely high load during holidays.
    November and December are for most retail stores, and a scalable environment provides
    the ability to scale their available servers without servers sitting idle for
    the remainder of the year.


    The ability to quickly and easily scale up or down a particular microservice,
    or even a group of them, when operating in a cloud environment is a tremendous
    advantage to enterprise developers. It allows them to shift from the past, where
    they needed to anticipate demand to allow the time required for provisioning new
    hardware (which takes months). Enterprise developers deploying to the cloud can
    move to a future where a new instance, or series of them, can be running and processing
    user load within minutes.


    Being able to scale an application is tightly linked to how loosely coupled it
    is. As mentioned earlier, separating URLs that an application must use into an
    external registry greatly decreases the amount of coupling between components,
    when compared to the coupling through properties files that I mentioned earlier.


    Failover of external services is a concern for all distributed architectures.
    Maintaining loose coupling, through a service registry, allows failure of a microservice
    without bringing down the entire application, provided the microservice is scaled
    to more than a single instance!


    Using a service registry in service discovery opens the door to enabling you to
    handle failures gracefully, but in their own right they aren''t the solution.
    You also need frameworks and libraries that can assist with providing fault tolerance,
    as you don''t want to write it yourself! Chapter 8 shows how fault tolerance can
    be incorporated into your microservices.


