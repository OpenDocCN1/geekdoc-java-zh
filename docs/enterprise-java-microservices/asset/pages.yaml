- img_proc: true
  md: '# CHAPTER 9 Securing a microservice


    DEFINITION Bearer token is a security token with a special behavioral property.
    Any party in possession of the token can use it any way that any other party in
    possession of the same could. Using a bearer token doesn''t require the holder
    to prove possession of the cryptographic key.


    A slight variation on the preceding process involves one microservice authenticating
    itself to issue requests against a secured microservice. Figure 9.10 illustrates
    this


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_188_0.png)


    Figure 9.10 Microservice authentication


    This process differs in that whatever calls the secured microservice doesn''t
    contain or receive an authentication token from user:


    +   1. The request is received by a microservice that isn''t secured.

    2. The unsecured microservice authenticates itself against Keycloak.

    3. The bearer token is passed in the HTTP headers of the request to the secured
    microservice.

    4. The token is extracted from the request and passed to Keycloak for validation.
    If the token isn''t valid, an HTTP 401 status is returned to indicate that an
    unauthorized user made a request.


    The remainder of this chapter presents examples for both of these scenarios. Let''s
    see how you can use Keycloak to secure some microservices.


    # 9.3 Securing the Stripe microservice


    In this section, you''ll look at how authentication works in the scenario in figure
    9.10. Stripe and Payment microservices from chapter 8 will be implemented with
    security like figure 9.10. The Payment microservice will be based on the RESTEasy
    client version from that chapter. Let''s take a look at the previous scenario,
    this time with Stripe and Payment; see figure 9.11.'
