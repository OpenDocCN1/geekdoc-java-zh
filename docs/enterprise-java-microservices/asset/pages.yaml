    This is a test bit involved; it tests two things in one. The first part posts
    the book and asserts the results from that request. The second part performs a
    GET request and asserts that the newly created book is in the model.


    When posting the book, you must make sure you set the content type to application/x-www-form-urlencoded
    (with MediaType.APPLICATION_FORM_ENCODED) because that''s the content type that
    a browser will send when the book is posted in the running application. Then you
    use MockMvcRequestBuilder.param() method to set the fields that simulate the form
    being submitted. After the request has been performed, assert that the response
    is a redirect to /readingList. Assuming that most of the test method passes, you
    move on to part 2. First, you set up a Book object that contains the expected
    values. You will use this to compare with the value that''s in the model fetching
    the homepage.


    Then you perform a GET request for /readingList. For the most part, this is not
    different from the way you tested the homepage before, except instead of an empty
    collection in the model, you are checking that it has one item, and the item is
    the same as the expected Book you created. If so, then your controller seems to
    be doing its job of saving a book when one is posted to it.


