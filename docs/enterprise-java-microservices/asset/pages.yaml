  md: "# Spring Boot testing\n\nany configuration. Aside from the three lines of configuration\
    \ in listing 1 (which turns on autoconfiguration), you didn't have to write any\
    \ Spring configuration.\n\nDespite the lack of Spring configuration, this complete\
    \ Spring application is ready to run. Let's fire it up and see how it looks.\n\
    \n# Spring Boot testing\n\nThis section provides information about testing with\
    \ Spring Boot, by mocking parts of Spring MVC. This section contains content from\
    \ section 4.2.1 of Spring Boot in Action.\n\n# Mocking Spring MVC\n\nSince Spring\
    \ 3.2, the Spring Framework has had a useful facility for testing web applications\
    \ by mocking Spring MVC. This makes it possible to perform HTTP requests against\
    \ a controller without running the controller within an actual servlet container.\
    \ Instead, Spring's Mock MVC framework mocks enough of Spring MVC to make it feel\
    \ as though the application is running within a servlet container—but it's not.\n\
    \nTo set up a Mock MVC in your test, you can use MockMvcBuilders. This class offers\
    \ two methods:\n\n+   - standaloneSetup()—Builds a Mock MVC to serve one or more\
    \ manually configured and configured controllers\n\n+   - webAppContext()—Builds\
    \ a Mock MVC using a Spring application context, which presumably includes one\
    \ or more configured controllers\n\nThe primary difference between these two options\
    \ is that standaloneSetup() expects you to manually instantiate and inject the\
    \ controllers you want to, whereas webAppContext() works from an instance of WebApplicationContext,\
    \ which itself was probably loaded by Spring. The former is slightly more akin\
    \ to a unit test that you'll use only for focused tests around a single controller.\
    \ The latter, lets Spring load your controllers as well as their dependencies\
    \ for a full-blown integration test.\n\nFor purposes, you're going to use webAppContext()\
    \ so you can test the ReadingListController as it has been instantiated and injected\
    \ from the application context that Boot has autoconfigured.\n\nThe webAppContext()\
    \ takes a WebApplicationContext as an argument. Therefore, you will need to annotate\
    \ the test class with @SpringBootConfiguration and use @Autowired to inject the\
    \ WebApplicationContext into the test as an instance variable. This listing shows\
    \ the starting point for your Mock MVC tests.\n\nListing 6 MockMvcWebTests\n\n\
    ```\n@RunWith(JUnit4Runner.class)\n@SpringBootConfiguration(\n    classes = ReadingListApplication.class)\n\
    @SpringBootConfiguration\npublic class MockMvcWebTests {\n```\n\n![](img/d166e73dc5b37ac6ba449ba856b8eebf_259_0.png)"
