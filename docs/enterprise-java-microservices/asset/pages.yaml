    # 8.3.2 Circuit breakers


    If you''re in any way familiar with the fuses work in your home''s electrical
    panel, you''ll understand the principles of a circuit breaker. Figure 8.4 shows
    that electricity flows through a fuse unhindered unless it''s tripped open, causing
    the flow to be interrupted.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_161_0.png)


    Figure 8.4 Electrical circuit-breaker states'
