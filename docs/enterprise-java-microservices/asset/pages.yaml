    we can encounter with microservices, before covering how the various parts of
    the framework enable us to provide a means for our microservice to account for
    failures that might arise.


    Chapter 9 discusses security for our microservices and how to achieve it with
    Keycloak. What is required to secure microservices, retrieving tokens within a
    microservice for calling secured microservices, and, lastly, authenticating a
    user within a UI for consuming secured microservices, and this covers it all.


    Chapter 10 introduces the Cayambe monolith by showing how it can be run in its
    unmodified form. You''ll be taken through the steps to switch Cayambe to be a
    hybrid that has monolithic parts, but also contains microservices to expand and
    distribute its functionality.


    Chapter 11 introduces the topic of data streaming with Apache Kafka by reducing
    the duplication of data between hybrids and microservices. You''ll use data streaming
    to enable real-time updates to disparate data to simplify distributed architectures.


    # About the code


    All the code from the book can be found in the source code files that accompany
    the book. The code can be downloaded for free from the Manning website (www.manning.com/books/enterprise-java-microservices),
    as well as via the following GitHub repository: https://github.com/kenfinmig/ej-samples.
    All the sample code is structured as a series of Maven modules for each chapter
    or part of a chapter.


    All source code in listings or in the text is in a fixed width font like this
    to separate it from ordinary text. In many listings, the code is annotated to
    point out key concepts.


    # Book forum


    Purchase of Enterprise Java Microservices includes free access to a private web
    forum by Manning Publications, where you can make comments about the book, ask
    questions, and receive help from the author and other users. To access the forum,
    go to https://forums.manning.com/forums/java-microservices-in-action. You can
    also learn more about Manning''s forums and the rules of conduct at https://forums.manning.com/about.


    Manning''s commitment to our readers is to provide a venue for a meaningful dialogue
