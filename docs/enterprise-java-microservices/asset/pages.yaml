    You''ve seen how some unit tests assist in improving your internal code by reducing
    the potential for bugs. Let''s take the next step and write some integration tests!


    # 4.4 Integration testing


    Integration testing is similar to unit testing, and uses the same frameworks,
    but this could include databases, messaging systems, other microservices, or perhaps
    anything you need to talk to that isn''t internal to the microservice. If you
    had unit tests that used mocks or stubs to integrate with external systems, as
    part of integration testing the mocks and stubs are replaced with calls to the
    actual systems instead. Removing mocks or stubs opens your code to execution paths
    that haven''t been tested before, as well as introducing more test scenarios as
    you need to handling of errors in external systems.


    Depending on the type of systems a microservice integrates with, it may not be
    possible to execute these tests on a local developer''s machine. Integration testing
    is perfectly suited to continuous improvement environments, where resources are
    more plentiful and any systems that are required can be installed.


    With integration testing, you can expand the scope of what you''re intending to
    test and verify that it works as you expect. It also allows you use external systems
    as part of your testing as opposed to mocking anything. Testing with the actual
    services and systems that a microservice will rely on in production greatly improves
    your confidence that production won''t result in errors from your code. You''re
    not going to be running your integration tests against production systems, but
    you can run them against systems that closely mirror production setup and data.


    To assist in developing integration tests, you''ll be using Aquillian. Aquillian
    is a highly extensible testing platform for the JVM that allows the easy creation
    of integration, functional, and acceptance tests. Many extensions to the core
    of Aquillian exist to handle specific frameworks, such as JSF, or for browser
    testing with Selenium. Full details of all the extensions available for Aquillian
    can be found at http://aquillian.org/.'
