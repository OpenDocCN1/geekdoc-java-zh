    Finally, in chapter 9, you added security to your administration UI, which was
    originally created in chapter 2.


    How does it all fit together? Figure 10.5 represents the proposed architecture
    of the Cayambe hybrid monolith. You''ll combine large pieces of the original monolith
    with new microservices that you''ve developed throughout the book. This architecture
    certainly come a long way from where it started, but you still have some work
    ahead.'
