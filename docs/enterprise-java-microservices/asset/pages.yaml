  md: '# Spring Boot starter dependencies


    Via transitive dependencies, adding these four dependencies is equivalent of adding
    several dozen individual libraries to the build. Some of transitive dependencies
    include things as Spring MVC, Spring Data JPA, and Thymeleaf, as well as any transitive
    dependencies that those dependencies declare.


    The most important thing to notice about the four starter dependencies is that
    they''re only as specific as they need to be You don''t say that you want Spring
    MVC; you simply say that you want to build a web application. You don''t specify
    JUnit or any other testing tools; you just say that you want to test your code.
    The Thymeleaf and Spring Data JPA starters are a bit more specific, but only because
    there''s less specific way to declare that Thymeleaf and Spring Data JPA in this
    build are only a few of the many starter dependencies that Spring Boot offers.


    In no case did you need to specify the version. The starter dependencies'' versions
    are determined by which Spring Boot version you are using. The starter dependencies
    determine the versions of the transitive dependencies that you pull


    Not knowing what versions of the various libraries are used may be a little unsettling.
    You are encouraged to know that Spring Boot has been tested to ensure that all
    of the dependencies pulled in are compatible. It can be liberating to just specify
    a starter dependency and not have to worry about which libraries and which versions
    of those libraries you need to maintain.


    But if you know what you''re getting, you can always discover that from the build
    tool. In case of Gradle, the dependencies task will give you a dependency tree
    that includes every library that your project is using and its versions:


    ```

    $ gradle dependencies

    ```


    You can get a similar dependency tree from a Maven build with the tree goal of
    the dependency plugin:


    ```

    $ mvn dependency:tree

    ```


    For the most part, you should not concern yourself with the specifics of what
    each Spring Boot starter dependency provides. Generally it''s enough to know that
    the web starter enables you to build a web application, the Thymeleaf starter
    enables you to use Thymeleaf templates, and the Spring Data JPA starter enables
    persistence to a database by using Spring Data JPA.


    But if it, in spite of the testing performed by the Spring Boot team, there''s
    a problem with a starter dependency''s choice of libraries? How can you override
    the starter?


    # Overriding starter transitive dependencies


    Ultimately, starter dependencies are just dependencies like any other dependency
    in your build. You can use the facilities of the build tool to selectively override
    transitive'
