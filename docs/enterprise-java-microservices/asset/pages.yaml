  md: '# CHAPTER 11 Data streaming with Apache Kafka


    you want to process all records in the stream from the beginning. When you receive
    a Kafka record, you then determine whether you need to remove a category, the
    value is null, or whether we''re processing a new or updated record.


    To distinguish between update and new categories, you execute a SQL statement
    on the existing records in Cayambe to see whether this record exists. If it does,
    it is an update record; if it doesn''t, it''s a new one.


    If you didn''t want the overhead of running a SQL statement to determine whether
    you''re dealing with an update or a new category, you could change the value type
    for records in Kafka to be an enclosing object. The Category instance, the current
    value, can be a field on a new type, with a flag to indicate the type of change
    that''s being dealt with.


    Now that you''ve finished developing the Kafka consumer, you''re ready to see
    it working in unison! But before you deploy the Kafka consumer you just created,
    to see the visual changes as they happen, it''s starting to use the Cayambe hybrid
    from chapter 10 with the following:


    ```

    /wildfly-11.0.0.Final/bin/standalone.sh

    ```


    With Cayambe started, open a browser and navigate around the category tree. You
    should notice that any changes you made through the Admin microservice are visible,
    which makes sense because you haven''t activated the service to update the Cayambe
    database with any changes. So let''s start your Kafka consumer now:


    ```

    /chapter11/kafka-consumer> mvn clean fabric8:deploy -PopShiftift

    ```


    When the pod becomes operational, it should process all the records that are present
    on the Kafka topic, which you specified for it to begin at the earliest offset
    on the topic. You can open the logs of the service and see the console statements
    that were printed for each record processed.


    With the records processed by the Kafka consumer, go back to the Cayambe UI and
    refresh the page. When navigating through the category tree and finding categories
    that changed through the Admin microservice, you''ll notice that they''re updated
    or moved based on what you did.


    You''ve successfully decoupled the two systems so that one owns the data, the
    Admin microservice, and the other consumes a copy of it in a read-only manner.
    As an added benefit, as long as the Kafka producers and consumers are functioning,
    the data never becomes state.


