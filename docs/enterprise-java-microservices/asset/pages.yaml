    # 1.2.3 Why you care about being distributed?


    Now you''ve seen a distributed architecture, let''s look at some of the benefits:


    +   Services are location-independent. Services can locate and communicate with
    other services no matter where they are physically located. Such location independence
    allows services to be located on the same virtual hardware, physical hardware,
    same data center, different data centers, or even a public cloud, and all act
    is if they''re in the same JVM. The main downside to location independence is
    the extra time required to make the network calls between them, and by the nature
    of adding new network calls, you''ve reduced the likelihood of successful completion.'
