    # 10.4 Deploying everything to a hybrid cloud


    Because you have converted the Cayambe monolith to a hybrid, deploying everything
    becomes more complex—but you''re doing everything manually. In a real environment,
    you''d want the deployments to be automated to make the process even simpler.


    This section covers all the pieces of the Cayambe hybrid that need to be set up,
    configured, or deployed to run it. The first thing you need to do is have Minishift
    running. It should also start with a clean OpenShift environment, to remove any
    services that might be present. You''re going to need all the room you can get
    inside a local OpenShift! So let''s delete any existing Minishift VM (virtual
    machine) you have and start from scratch:


    ```

    > minishift delete

    > minishift start --cpus 3 --memory 4GB

    ```'
