  md: '# Just enough Application Server 43


    Why was this the case? Historically, the biggest reason is cost—and not just the
    cost of the application server, which usually wasn''t cheap, but all the physical
    hardware that was required to run a single application server. Certainly, over
    the last decade, with improved virtual machines and the rise of containers in
    recent years, the amount of physical hardware required for production environments
    has dropped significantly and along with it, the cost of production environments
    for enterprises.


    With JeAS runtimes, it''s possible, ignoring concerns for now, to run many instances
    of them on a single piece of physical hardware. Each JeAS runtime running in its
    own process is isolated from the others, preventing a common problem of collinear
    in an application server: namely, that one application failure causes the whole
    application server, and all applications running on it, to fail in an unrecoverable
    manner.


    # 3.1.3 Eclipse MicroProfile


    For anyone following developments in the landscape of Enterprise Java and microservices
    over the last couple of years, you''ve likely heard about Eclipse MicroProfile.
    It’s a community initiative to “Enterprise Java for microservices” that was formed
    with collaboration from Red Hat, IBM, Tombitree, Payara, and the London Java community.
    Since its initial formation, the community has moved to the Eclipse Foundation.


    From the first release with JAX-RS, CDI, and JSON-P forming the base Java EE technologies,
    we’ve surpassed version 1.3, including eight new MicroProfile specifications over
    those versions so far. Table 3.1 details the specifications included in each MicroProfile
    release.


    Table 3.1 MicroProfile specifications in each release


    | Specification | 1.0 (Sep 2016) | 1.1 (July 2017) | 1.2 (Sep 2017) | 1.3 (Jan
    2018) |

    |---|---|---|---|-|

    | JAX-RS | ✓ | ✓ | ✓ | ✓ |

    | CDI | ✓ | ✓ | ✓ | ✓ |

    | JSON-P | ✓ | ✓ | ✓ | ✓ |

    | Config | | | ✓ | ✓ |

    | Fault tolerance | | | ✓ | ✓ |

    | JWT propagation | | | ✓ | ✓ |

    | Metrics | | | ✓ | ✓ |

    | Health check | | | ✓ | ✓ |

    | Open tracing | | | | ✓ |

    | Open API | | | | ✓ |

    | Type-safe REST client | | | | | | |'
