  md: '# Summary


    # 137


    You likely noticed the extra work you had to do by looking up Topology.lookup(),
    which wasn''t required when using Netflix Ribbon as a client. Netflix Ribbon performs
    the service lookup based on the @ResourceGroup name, directly interacting with
    Topology to retrieve the information it needs.


    As you can when retrieving a topology entry from the map, you''re finding only
    the first URI for a given service, because you''re not load balancing across possibly
    multiple instances. With OpenShift, it''s not necessary to load balance on the
    client side, because DNS in OpenShift will perform this task for you on the server.


    If you''re deploying to a different environment, it''s likely that for a production
    situation you''d want to use an algorithm, or a variety of algorithm options,
    to choose which service instance to consume. With the Stripe microservice running
    from earlier, change into the /chapter7/resteasy-client directory and run:


    ```

    mvn clean fabric8:deploy -POpenshift -DskipTests

    ```


    With the Ribbon example, the URL of the service is the URL in the OpenShift console
    for the chapter7-resteasy-client, with /sync or /async added to the end. Once
    again, to test the endpoints, you need a tool (either Postman or whatever you
    prefer) to execute the POST request. If all has gone well, you should receive
    a similar response to the Ribbon example when executing the requests.


    # Summary


    +   - Code that includes locations of microservices to consume is prone to failures
    as instances come up and down. Failures can also occur when requiring updates
    to code or configuration when microservices move locations, and redeploying those
    changes across any impacted environment. Service discovery provides the separation
    you need for your microservices to scale without relying on IP addresses directly.

    - To be able to discover services to consume, you need them to be registered in
    a central place so your microservice can retrieve them. A service registry fulfills
    that role in a microservice environment.

    - Thorntail allows you to use Groups, OpenShift, or Consul as a service registry
    implementation in your microservice environments.

    - Using a Netflix Ribbon client in your microservice removes lookups from your
    client code while allowing you to take advantage of Thorntail topology implementations
    for service discovery.'
