  md: '# 1.1.4 What are the problems associated with monoliths?


    In general, an architectural design akin to the one in figure 1.1 is a good idea,
    but drawbacks exist as well:


    +   - Inability to scale individual components—This may not seem to be a major
    problem, but certain factors can alter the quality of poor scaling. If a single
    instance of the application requires a large amount of memory or space, scaling
    out to a not-insignificant number of nodes requires a large investment in hardware.

    - Performance of individual components—With a single deployment containing many
    components, it''s easy for one component to perform worse than the rest. You then
    have a single component slowing down the entire system, which isn''t a good situation,
    and the operations won''t be pleased.

    - Deployability of individual components—When the entire application is a single
    deployment, any changes require a deployment of the entire application, even if
    you have a single-line change in one component. That''s not good for business
    agility and often results in cadences of months to include many changes in one
    updated deployment.

    - Greater complexity—When an application has many components, it''s easy for the
    functional boundaries between them to become blurred. Blurring the separation
    of components further increases the complexity of code, both in terms of code
    execution and for a developer understanding the intent of the code.

    - Difficulty in accurately testing an application—When the grows, the amount of
    testing and time to ensure that any change didn''t cause a regression grows. What
    seems like the smallest and most insignificant change can easily lead to unforeseen
    errors and problems in completely unrelated components.


    All these issues cause cost to enterprises, while as slowing the speed with which
    they can take advantage of new opportunities. But these potential drawbacks are
    still small in comparison to starting from a clean slate.


    If an enterprise has an application that has evolved with new features over a
    decade or more, attempting to replace it with a greenfield project would cost
    hundreds of years in effort. This is a huge factor why enterprises continue maintaining
    existing monoliths.


    When it''s costly to replace a monolith with a more modern alternative, that application
    becomes entrenched in an enterprise. It becomes a critical application, and any
    downtime costs business impacts. This situation becomes ever more compounded with
    continual enhancements and fixes.


    On the flipside, some monoliths have been running well for years and can be easily
    managed by a handful of developers without much effort. Maybe they''re in a maintenance
    mode and not under heavy feature development. These monoliths are perfectly OK
    as they are. If it ain''t broke, don''t fix it.'
