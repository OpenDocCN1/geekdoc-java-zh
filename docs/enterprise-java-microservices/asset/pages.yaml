  md: '# Cayambe hybrid—monolith with microservices


    # 195


    Enterprise Java monolith


    Microservices environment


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_211_0.png)


    Figure 10.4 Enterprise Java and microservices hybrid architecture


    There are certainly benefits to being able to split a monolith into pieces, while
    separating out where those pieces might be deployed. Although doing so adds overhead,
    at least in terms of network calls and performance, the advantages often outweigh
    the downsides. This is especially true when those advantages revolve around key
    aspects, such as continuous delivery and release cadence.


    In chapter 2, you developed a new administration UI, well as RESTful endpoints
