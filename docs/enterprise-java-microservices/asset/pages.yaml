  md: '# Microservices and distributed architecture


    So what do I mean by a microservice? A microservice consists of a single deployment
    executing within a single process, isolated from other deployments and processes,
    that supports the fulfilment of a specific piece of business functionality. Each
    microservice focuses on the required tasks within a Bounded Context, which is
    a logical way to separate the various domain models of an enterprise. We will
    cover this in greater detail later in this chapter.


    From the definition, you can see that a microservice, in and of itself, isn''t
    useful. It becomes useful when you have many loosely coupled microservices working
    together to fulfill the needs of an application. A microservices architecture
    containing many microservices communicating with each other can also be referred
    to as a distributed architecture.


    To make a microservice useful, it needs to be easily used from other microservices
    and components of the entire system. It''s impossible to achieve that when a microservice
    attempts to accomplish too much. You need a microservice to focus on a single
    task.


    # 1.2.1 Do one thing


    In 1978, Douglas McIlroy, best known for developing UNIX pipelines and various
    UNIX tools, documented the UNIX philosophy, part of which is, Make program do
    one thing. This same philosophy has been adopted by microservice developers. Microservices
    aren''t the kitchen sink of application development; you can''t have everything
    in them and expect each to function at an optimal level. In this case, you''ve
    had a monolithic architecture, also referred to as a distributed monolith!


    A well-designed microservice should have a single task to perform that''s sufficiently
    fine-grained, delivering a business capability or adding business value. Going
    beyond a single task brings us back to the problems of Java monoliths, which we
    don''t want to repeat.


    It''s always easy to figure out a sufficiently granular task for a microservice.
    Later in the chapter we will discuss Domain-Driven Design as a method to assist
    in defining its granularity.


    # 1.2.2 What is a distributed architecture?


    A distributed architecture consists of multiple pieces that work with each other
    to make the full functionality of an application distributed across processes,
    and often network boundaries as well. What''s distributed can be any part of an
    application, such as RESTful endpoints, message queues, and web services, but
    it''s most definitely not limited to only components.


    Figure 1.4 shows what a distributed architecture for microservices might look
    like. In this depiction, the microservice instances are described as being in
    a runtime, but doesn''t dictate how the instance is packaged. It could be packaged
    as uber jars or Linux containers, but many other options are available. The runtime
    is purely for delineating the operating environment of a microservice, showing
    that the microservices are running independently.'
