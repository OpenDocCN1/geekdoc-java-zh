  md: "@Autowired\nprivate WebApplicationContext webContext;\n\nprivate MockMvc mockMvc;\n\
    \n```\n@Before\npublic void setupMockMvc() {\n    mockMvc = MockMvcBuilders\n\
    \        .webContextSetup(webContext)\n        .build();\n}\n```\n\nThe @WebApplicationConfiguration\
    \ annotation declares that the application context created by SpringJUnitClassRunner\
    \ should be a WebApplicationContext (as opposed to non-web ApplicationContext).\n\
    \nThe setupMockMvc() method is annotated with JUnit's @Before, indicating that\
    \ it should be executed before any tests. It passes the injected WebApplicationContext\
    \ into the webContextSetup() method and then calls build() to produce a MockMvc\
    \ instance, which is assigned to an instance variable for test methods to use.\n\
    \nNow that you have MockMvc, you're ready to write test methods. Let's start with\
    \ a simple test method that performs an HTTP GET request /readingList and asserts\
    \ that the model value meets your expectations. The following homePage test method\
    \ does what you need:\n\n```\n@Test\npublic void homePage() throws Exception {\n\
    \    mockMvc.perform(MockMvcRequestBuilders.get(\"/readingList\"))\n        .andExpect(MockMvcResultMatchers.status().isOk())\n\
    \        .andExpect(MockMvcResultMatchers.view().name(\"readingList\"))\n    \
    \    .andExpect(MockMvcResultMatchers.model().attributeExists(\"books\"))\n  \
    \      .andExpect(MockMvcResultMatchers.model().attribute(\"books\").value(Matchers.empty(\"\
    \")));\n}\n```\n\nAs you can see, a lot of static methods are being used in this\
    \ test method, including static methods from Spring's MockMvcRequestBuilders and\
    \ MockMvcResultMatchers, as well as the Hamcrest library Matchers. Before diving\
    \ into the details of this test method, let's add a few static imports so that\
    \ the code is easier to read:\n\n```\nimport static\nimport org.springframework.test.web.servlet.request.MockMvcRequestBuilders.*;\n\
    import static\nimport org.springframework.test.web.servlet.result.MockMvcResultMatchers.*;\n\
    ```"
