  md: '# What type of testing do you need?


    # 4.1 What type of testing do you need?


    Three types of testing are covered in this chapter:


    +   - Unit testing is focused on testing the internals of your microservice.

    - Integration testing covers the entirety of your service, in addition to the
    way it interacts with external services, such as a database.

    - Consumer-driven contract testing deals with the boundary between a consumer
    of your microservice and the microservice itself, via a Pact that defines the
    contract.


    It''s important to note that unit and integration testing are far from new concepts.
    They''ve been part of software development for decades. The application of integration
    testing to microservices may increase its complexity, through more external integration
    points, but the way we develop them hasn''t changed.


    Why did I choose these types of testing to focus on, given that dozens of types
    are available? I''m not saying that these three are the only types you need to
    worry about, but these these are crucial to your goal of ensuring that a microservice
    is robust as possible. Unit and integration testing are focused on ensuring that
    you do, as a developer of a microservice, have written the requirements that have
    been outlined for a microservice. Consumer-driven contract testing changes perspectives
    to look from outside a microservice, to ensure that a microservice can correctly
    process whatever clients are passing to you. Though it may not be part of the
    requirements of a microservice, it''s possible that a client expects slightly
    different behavior than has been developed. Figure 4.1 shows the three types of
    testing in terms of your code.


    The key point with respect to testing of any type is that you''re not writing
    tests for fun or one-off execution. The purpose, benefit, of writing any test
    is the ability to continually execute it as code changes and is modified, typically
    as part of a continuous integration process that regularly builds your code. And
    why do you want these tests all the time on old and updated code? For the simple
    reason that it reduces the number of errors, or bugs, that make it into production
    code. As I mentioned in chapter 1, anything you can do to reduce the number of
    times you''re called about production bugs, the better you are for it.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_77_0.png)'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# 4.2 Unit testing


    Typically created by developers as part of writing code, unit testing tests the
    internal behavior of classes and methods. Doing so requires mocks or stubs to
    mimic the behavior of external systems.


    NOTE Stubs and mocks are tools you can employ to make possible to unit test code
    that interacts with external services, such as a database, without needing a database.
    Serving the same purpose, they differ in ways. Stubs are handcrafted implementations
    of a service that has written to return previous responses to each method. Mocks
    offer greater flexibility, as each test can set whatever you expect the method
    to return for that particular test, and then verify that the mock acted in the
    way you anticipated. With mocks requires each test to set the expectations for
    the service being called and then it saves you from writing every test situation
    into a stub.


    Why do we need unit testing at all? You need to ensure that a method on a class
    performs the function as its intended. If a method has parameters passed to it,
    it should be validated to ensure they''re appropriate. This can be as simple as
    ensuring the value is not null, or as complex as validating an email address format.
    Like, you need to verify that passing particular parameters returns the result
    you expect from those inputs. Unit testing is the lowest level of testing, but
    is often the most crucial to get right. If your smallest unit of code, a method,
    doesn''t perform as you expect, then your entire service could function incorrectly.


    The two most popular and widely used frameworks for this level of testing are
    JUnit (http://junit.org/) and TestNG (http://testng.org/doc/). JUnit has been
    around the longest and was the inspiration for TestNG created. There aren''t many
    differences between their features, or even the manner of annotations in some
    cases!


    The biggest difference in their goals is purely a personal choice. JUnit''s focus
    is purely on unit testing, and was a huge driver for the adoption of test-driven
    development. TestNG aims to support testing using unit tests.


    Whichever a developer chooses is purely a personal choice. At any time, JUnit
    or TestNG may have more features than the other, but it''s likely that the other
    will soon catch up. With back and forth has happened over the many years times,
    enable you to see the differences in the code you''ve added tests. This is particularly
    important to show relevant code changes that were required to fix any dreaded
    bugs. For writing our unit tests, I use JUnit, simply because I''ve used that
    framework the most in my career and I''m the most familiar with it.


    The admin microservice is focused on CRUD operations for the Category model at
    the moment, and has a JAX-RS resource for providing the RESTful endpoints to interact
    with it.'
