  md: '# CHAPTER 8 Strategies for fault tolerance and monitoring


    integrating with dozens of microservices, or more, that need is to be as reliable
    as your previous monolith.


    But your microservices won''t fail in production, right? Nothing fails in production!
    We''ve all made statements similar to that at some point, usually before we''ve
    been bitten by a major failure in production! Once, twice, fault tolerant!


    Why is it that, without previous experiences of production failures, we tend toward
    grandiose statements about the reliability of our production systems? Some of
    it''s because we can be optimistic in nature, but mostly it''s a lack of experience.
    If you''ve never had to deal with fixing issues for your application, especially
    in the middle of the night, it''s hard to appreciate the valid concerns around
    the reliability of systems.


    # Pager nightmares


    I remember the ''90s—yes, I was in IT back—that the most dreaded experience of
    the novice was be handed the pager for on-call duty. There''s no worse feeling
    getting a page around 2 a.m. about failed jobs that need to be fixed, and then
    trying to complete it before the staff arrives in the office at 8 a.m.! These
    were only nightly batch jobs, but the anxiety over being paged was terrible.


    I can only imagine what it''s like to receive a page (if pagers are still around
    today) for a production failure on a live application that needs to be resolved
    because it''s affecting the 24/7 running of the business!


    Here are some of the statements you might falsely believe regarding production
    systems, and distributed architectures in particular:


    +   The network of computing devices is reliable. Without taking into account
    the possibility of network failures, it''s possible for an application to stall
    while waiting for a response that won''t arrive. The application would be unable
    to retry any failed operations when the network is available again.


    +   There is no latency in making a request and having it acted upon (known as
    zero latency). Ignoring network latency, and associated network packet loss, can
    result in wasted bandwidth and an increase in dropped network packets as the amount
    of traffic on the network grows without limitation.


    +   There is no limit to the available bandwidth on the network. If clients are
    sending too much data, or too many requests, the available network bandwidth could
    shrink to the point that bottlenecks appear and application throughput is reduced.
    The impact of latency on network throughput can last for a few seconds or be constantly
    present.'
