  md: '# Consuming a microservice with a Java client library


    This does a JNDI lookup of the service by name and returns the instance you can
    use for submitting work.


    > NOTE Executor Executor is defined for you by WildFly. You don''t need to do
    anything to make it available in order to retrieve it from JNDI.


    Your services could just as easily as have created a new Thread for required work,
    but then your new thread would be outside the Java EE thread management. Is this
    a problem? Not always, but you could have problems if the thread pool size of
    the runtime is as large as the JVM thread. In that case, you could exhaust all
    available JVM threads when creating threads outside the Java EE thread. As a general
    rule, it''s best to create threads directly, but use the ExecutorService.


    Because you want to show how synchronous and asynchronous usage scenarios result
    in different client code for consuming a microservice, each resource that you
    use client library will contain two endpoints:


    +   - /sync—Synchronous processes a request from the caller

    - /async—Asynchronous processes a request from the caller


    Traditionally, services were developed to communicate synchronously with any other
    resources required to complete a response. With increasing demands from the enterprise
    to deliver greater performance and scalability, we'' moved greater asynchronous
    behavior in our services. In this chapter and the remainder of the book, you''ll
    learn about both synchronous and asynchronous usage patterns. Enhancing the benefits
    of microservices also requires some level of asynchronous behavior; otherwise,
    you minimize the benefits of their distributed nature. If you take that route,
    you may well stick with a monolith!


    > NOTE Each of your microservices defines a field called categoryUrl, which is
    hardcoded to http://localhost:8081/admin/categorytree. This isn''t what you''d
    go into production doing, but it serves our purpose to simplify the examples.
    In a later chapter, you''ll see how service discovery can be used for connecting
    to other services.


    # 6.1 Consuming a microservice with a Java client library


    In this section, you''ll see examples of consuming a microservice that uses lower-level
    libraries to deal with HTTP requests directly. Though that results in more verbose
    and extra handling of data, it does provide the greatest flexibility as to how
    a call can be made. For instance, using these libraries may be a better choice
    if a microservice needs to communicate with many types of HTTP resources, because
    it doesn''t sense to add another library just for RESTful endpoint interaction.'
