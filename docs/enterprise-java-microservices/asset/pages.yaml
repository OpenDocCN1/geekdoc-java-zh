  md: '# CHAPTER 5 Cloud native development


    If finer control over service configuration is needed, it can be achieved with
    custom-YAML files that are used by the plugin to generate the necessary JSON.
    That''s beyond the scope of this book, but further information is available at
    the fabric8 web-site, https://maven.fabric8.io.


    Though Minsk is already started, you need to do one more thing before you deploy
    your service with the fabric8 Maven plugin. You need to log in to OpenShift in
    the terminal, because the fabric8 Maven plugin uses the credentials to create
    resources within OpenShift. This is necessary only once, or until your authenticated
    session expires and you need to log in again.


    To log in, you need the OpenShift CLI installed. There are two ways to do that:


    +   - Add the Minish/cache/oc/v3.6.0 directory to your path, because the oc binary
    is retrieved by Minish for you.

    - Download the CLI from www.openshift.org/download.html.


    After the CLI is installed, you can authenticate in the terminal:


    ```

    oc login

    ```


    You''ll be prompted to enter the user ID, developer, and any value for a password.

    You''re going to use the default My Project for now, so you can deploy the admin
    service into OpenShift with the following:


    ```

    mvn clean fabric8:deploy -Openshift

    ```


    You invoke the fabric8 deploy goal, which will be executed after the resource
    and build goals you defined in pom.xml. You also specified the openshift profile
    so that the fabric8 Maven plugin is available.


    In the terminal, you will see the usual Maven build logging, with messages from
    the fabric8 plugin telling you what it''s generating for deployment to OpenShift.

    After it''s first deploying the service, you can open My Project in the console
