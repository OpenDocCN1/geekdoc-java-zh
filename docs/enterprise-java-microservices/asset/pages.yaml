- img_proc: true
  md: '# CHAPTER 8 Strategies for fault tolerance and monitoring


    The one difference between an electrical panel and software is that a software
    circuit breaker will automatically close itself without manual intervention, based
    on thresholds that have been defined to indicate the level at which it becomes
    unhealthy.


    Figure 8.5 shows the initial part of a larger flow to mitigate failures when calling
    external services. As you progress through this chapter, additional parts will
    be added to the flow, providing additional functionality to assist with mitigation.
    This first part focuses on providing a circuit breaker.


    When the circuit breaker is Closed, all requests continue through the flow. When
    the circuit breaker is Open, the requests exit the flow out. You can see in figure
    8.5 that your circuit breaker requires Circuit Health Data, which is used in determining
    whether the circuit should be open or closed. In addition to the states in figure
    8.5, a circuit breaker can be in a Half Open state. See figure 8.6.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_162_0.png)


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_162_1.png)


    Here are the transitions between states of a circuit breaker:


    +   - All requests pass through unhindered, as the circuit is Closed.

    - When a failure threshold is reached, the circuit becomes Open.

    - While the circuit is Open, all requests are rejected, failing fast.'
