    the token validity and refresh it when it''s expiring. Please take a look at all
    the JavaScript code available for the application in the source code for the book.


    # Summary


    +   - Securing your microservices is critical, regardless of whether they are
    intended for internal users only. You can''t predict all the types of malicious
    users who may attempt to doom through your microservices.


    +   - Keycloak can accept bearer tokens, provide an authorization client, and
    provide easy configuration for securing your microservices.


    +   - You can authenticate against Keycloak without a user, which is essential
    for microservice-to-microservice calls when the recipient is secured.


    +   - You can integrate Keycloak into an application UI to provide authentication,
    and pass tokens to RESTful endpoints that are secured.'
