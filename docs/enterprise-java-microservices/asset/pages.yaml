    This chapter explores the ideas behind Just enough Application Server (JeAS) and
    the runtime options that we developers have for developing Enterprise Java microservices
    using JeAS. We''ll begin by defining JeAS and how it compares to Java EE. To aid
    in the discussion, a hypothetical microservice, requiring several specifications,
    will be described so its needs may be evaluated against what the various JeAS
    runtimes offer. As part of the comparison, we''ll detail each of the JeAS runtimes
    and how they differ as we develop a Beach Vacation shopping application.'
