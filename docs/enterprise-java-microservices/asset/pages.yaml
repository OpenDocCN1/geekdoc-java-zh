    \ a ChargeResponse containing the amount and charge ID that was received from\
    \ Stripe.\n\nYou've added @Advertise to your Stripe microservice, but how does\
    \ that relate to the topology?\n\nThe Thornt topology will find all the @Advertise\
    \ annotations you've added to RESTful endpoints in your microservice, and store\
    \ each name into a file within your deployment that's created at runtime. The\
    \ topology code added to your service deployment will advertise these names, with\
    \ appropriate host and port information where the microservice is located, with\
    \ every implementation you've chosen (JGroups, OpenShift, Consul) when the deployment\
    \ is started. @Advertise abstracts the need for your microservice code to know\
    \ the details of how to register a microservice. You simply provide a name for\
    \ it.\n\nNOTE Using Topology and deploying to OpenShift, the advertising function\
    \ is essentially a NoOp because OpenShift registers all microservices with its\
    \ internal DNS. The main advantage of using @Advertise on the producing microservice\
    \ is that you can easily switch your topology environment without altering your\
    \ code.\n\n# TOPOLOGY.LOOKUP()\n\nYou can also register services in a way that\
    \ provides control over the timing of when a service is available, by using Topology.lookup().\
    \ Topology provides the main abstraction over each service implementation offering\
    \ methods for static lookup(), adding and removing listeners to be notified as\
    \ services are added or removed, registering a microservice through advertise(),\
    \ and retrieving the cure registry using asMap().\n\nWhichever topology implementation\
    \ you've chosen for your microservice—JGroups, OpenShift, or Consul—Topology is\
    \ always available for a microservice to use directly.\n\nLet's say you want to\
    \ use Topology to advertise and unadvertise a microservice. One advantage to this\
    \ approach is restricting the microservice from being added into the service registry\
    \ until the RESTful endpoint is active and available to handle requests.\n\n|\
    \ Listing 7.6 Topology |\n\n```\nAdvertisementHandle handle = Topology.lookup().advertise(\"\
    allevents\");\n```\n\n> Look up the Topology instance and advertise your service,\
