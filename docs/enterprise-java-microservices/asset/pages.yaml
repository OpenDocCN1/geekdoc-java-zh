  md: '# APPENDIX Spring Boot microservices


    This dependency is fine and might even work. But how do you know? What kind of
    assurance you have that the versions you chose for those dependencies are even
    compatible with each other? They might be, but you won''t know until you build
    the application and run it. And how do you know the list of dependencies is complete?
    With not a single line of code having been written, you''re still a long way from
    kicking the tires on your build.


    Let''s step back and recall what it is want to do. You''re looking to build an
    application with these traits:


    +   - It''s a web application.

    - It uses Thymeleaf.

    - It persists data to a relational database via Spring Data JPA.


    Wouldn''t it be simple if you could specify these facts in the build and let the
    built sort out what you need? That''s exactly what Spring Boot starter dependencies
    do.


    # Specifying facet-based dependencies


    Spring addresses project dependency complexity by providing several dozen starter
    dependencies. A starter dependency is essentially a Maven POM that defines transitive
    dependencies on other libraries that provide support for a certain functionality.
    Many of these starter dependencies are named to indicate the facet or kind of
    functionality they provide.


    For example, the reading-list application is going to be a web application. Rather
    than add several chosen library dependencies to the project build, it''s much
    easier to simply declare that this is a web application. You can do that by adding
    Spring Boot''s starter to the build.


    You also want to use Thymeleaf for web views and persist data with JPA. Therefore,
    you need the use Thymeleaf and Spring Data JPA starter dependencies in the build.


    For testing purposes, you also want libraries that will enable you to run integration
    tests in the context of Spring Boot. Therefore, you also need a test-dependency
    on Spring Boot''s test starter.


    Taken together, you have the following five dependencies that the Initializr provides
    in the Gradle build:


    ```

    dependencies {

    compile "org.springframework.boot:spring-boot-starter-web"

    compile "org.springframework.boot:spring-boot-starter-thymeleaf"

    compile "org.springframework.boot:spring-boot-starter-data-jpa"

    compile "com.h2database:h2"

    tcompileTest("org.springframework.boot:spring-boot-starter-test")

    }

    ```


    As you saw earlier, the easiest way to get these dependencies into your application''s
    build is to select the Web, Thymeleaf, and JPA check boxes in the Initializr.
    But if you didn''t do when initializing the project, you can certainly go back
    and add them by editing the generated build.gradle or pom.xml.'
