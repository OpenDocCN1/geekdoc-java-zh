    # 7.1.3 Stateless vs. stateful microservices


    Being able to scale microservices at will is most certainly fantastic, but there''s
    a catch. So far, you''ve been implicitly dealing with stateless microservices,
    in that the microservice doesn''t retain any data within itself between requests.


    What about your state? Microservice development is heavily focused on statelessness.
    This is a key ability for microservices to be scaled up and without any concern
    for user state from previous requests.


    To support scaling of microservices, it''s not possible for them to be stateful—at
    least not in the way that stateful sessions were in Java EE. As the often used
    saying, we want our microservices to be more like cattle and less pets. Better
    to have many that can come or go without impact (cattle), instead of a few from
    one disappearing can cause major issues (pets). Use user data from a previous
    request in your microservice, but it has to be stored somewhere for you to retrieve
    it.


    The shift to stateless services has already begun in Enterprise Java over the
    last years, but the push toward microservices has made it even more prominent
    than before. For developers and architects, it''s no simple to switch from thinking
    in terms of state to stateless. The change requires additional thought up front,
    and during development, to prevent state from creeping into a microservice.


    If there''s a service you already have that''s stateful, and there''s simply no
    way to break it down into stateless microservices, or the challenge in doing so
    poses a risk that''s too great, then microservices might not be the best approach.
    Stick with a more traditional Java application server to handle the stateful service
    and scaling across a small cluster.


    # 7.1.4 What is Netflix Ribbon?


    Earlier we talked about load balancing across multiple instances of a single service,
    and how it wasn''t a good idea to create complicated load balancers in your own
    code. What do you do if you want load balancing in your client that isn''t random
    or round-robin?


    Thorvald provides integration with Netflix Ribbon just for that purpose, saving
    you from having to develop the algorithms yourself. Ribbon is created for its
    internal services. It was open sourced in January 2013 as part of a suite of projects
    that Netflix heavily relies on for its preprocess communication of services. The
    primary usage of Ribbon is calling RESTful endpoints, which is why it''s a good
    fit for what you need consuming Enterprise Java microservices.


    Later in the chapter, I will show how Ribbon can use a service registry to retrieve
    instances. Right now, let''s focus on the load-balancing options it provides:'
