  md: '# CHAPTER 7 Discovering microservices for consumption


    +   - Round Robin—Chooses an available server from all those present in sequential
    order, regardless of whatever each server may be experiencing.


    +   - Availability Filtering—Skips any servers that are deemed to have ''circuited,''
    connection fails the last three times, or a high number of current connections.


    +   - Weighted Response Time—Each server is given a weighting based on response
    times, which is used to generate a range of values and B have a value of 5 and
    25, for instance, if servers A and B have the range of 1–5 (A) and 6–30 (B). A
    random number is generated between 1 and the sum of all the server weights, which
    determines the server based on the ranges. A server with a higher weighting, or
    shorter response time, has a greater chance of being selected.


    +   - Zone Aware Robin—Particularly useful for deployments to Amazon Web Services,
    where servers are distributed across availability zones. This rule chooses servers
    based on whether they are in the same zone as the client, and which are available.


    +   - Random—Purely random distribution across available servers.


    The default choice is Round Robin. If performance is critical to your microservice,
    Weighted Response Time would be the best for load balancing. It''s similar to
    Round Robin in its behavior, while favoring those servers that are performing
    better.


    This option is particularly beneficial if a server instance deems it to be restarted.
    You don''t want to continue sending lots of traffic to a microservice that could
    be restarted at any time.


    It might be unclear from what we''ve discussed so far that Ribbon wins with respect
    to figure 7.3. You can see in figure 7.5 that Ribbon is part of your microservice,
    in this case Payment, Stripe is responsible for interacting with a service registry,
    choosing which server instance from those available to use, and finally executing
    a request that instance.


    For Ribbon to know where the service registry is located, you need to specify
    a class that''s responsible for retrieving the list of available instances for
    a service. Which class depends on the service registry used. For instance, `com.netflix.niws.DiscoveryEnableDNSServer`
    is the class to be used when accessing a service registry provided by Eureka through
    its custom client code. Eureka is a service registry developed by Netflix, but
    integration with Eureka isn''t available in Thorntail.


    **WARNING** Last year, Netflix announced that it was no longer actively maintaining
    Ribbon. Its GitHub (https://github.com/Netflix/ribbon) details parts Netflix still
    uses and which doesn''t. Although Ribbon isn''t actively maintained, it''s stable
    and production for most use cases. Thorntail makes Ribbon available for consuming
    microservices, the Thorntail team is actively investigating alternatives to Ribbon
    for the long term.'
