  md: '# What can be done to assist in developing microservices?


    Microservice development is hard, so what can you do to make it easier? There''s
    no panacea for making it easy, but this section covers a couple of options for
    making microservice development more manageable.


    # Product over project


    Netflix has been a major proponent of the product-over-project idea for microservices
    since rewriting its entire architecture under the leadership of Adrian Cockraft.


    All these years, we''ve been developing projects and not products. Why Because
    we develop an application that meets a set of requirements and then hand it over
    to operations. The application might require weeks or years to develop, but it''s
    still a project if, at the end, the application is handed over and the team disbanded.
    Some team members may be retained for a period to handle maintenance requests
    and enhancements, but the effort is still considered a project followed by lists
    of mini projects.


    So do you develop a product? Developing a product means that a single team owns
    it for the entirety of its lifespan, whether that be 2 months or 20 years. The
    team will develop it, release it, manage the operational aspects of the application,
    resolve production issues—pretty much everything.


    Why does the differentiation between a project and a product matter? Owning a
    product eng a greater sense of responsibility about how an application is developed.
    Do you want to be paged in the middle of the night because an application is failing?
    I know I don''t


    How does a shift of focus to product help developing microservices? When you''re
    seeking a release cadence of a week or less, as is typical for microservices,
    it''s hard to reach that release frequency with developers who aren''t familiar
    with the codebase, as would be the case with a project approach.


    # Continuous integration and delivery


    Without continuous integration and delivery, developing microservices becomes
    a great deal more difficult.


    Continuous integration refers to the processes that ensure any change, or commit,
    to a source repository triggers a new build of the application, including all
    associated tests of application. This provides feedback on whether or not changes
    break the application, the tests are sufficient to discover it.


    Continuous delivery is a reasonably new phenomenon that has come from the DevOps
    movement, where application changes are continuously delivered between environments,
    including production, to ensure expeditious delivery of application changes. A
    manual step may occur to approve a build into production, but not always. Having
    a manual step is likely for critical user applications and less so for others.
    Continuous delivery is usually offered by means of a build pipeline, which can
    consist of automatic or manual steps, such as a manual step to approve a release
    for production.'
  merge: -1
