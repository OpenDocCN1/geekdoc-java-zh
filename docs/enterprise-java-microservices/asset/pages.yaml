    Figure 3.7 Microservice usage in Payara Micro


    Because Payara Micro does not include the JMS specification, you need to add an
    implementation to your microservice yourself. This isn''t a major issue, but needing
    to include additional implementations is easier if they''re already provided in
    a distribution. But then you''re back to the problem of application server pieces
    being present but not used.'
