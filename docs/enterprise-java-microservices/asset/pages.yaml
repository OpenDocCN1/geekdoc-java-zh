  md: "# Testing Spring Boot applications\n\nThe Initializer also gives you a skeleton\
    \ test class to help you get started with writing tests for your application.\
    \ ReadingListApplicationTests, shown in the following listing, is more than just\
    \ a placeholder for tests. It also serves as an example of how to write tests\
    \ for Spring Boot applications. @SpringApplicationConfiguration loads a Spring\
    \ application context.\n\n| Listing 2 ReadingListApplicationTests |\n\n```\npackage\
    \ readinglist;\n\nimport org.junit.Test;\nimport org.junit.runner.RunWith;\nimport\
    \ org.springframework.framework.boot.test.SpringApplicationConfiguration;\nimport\
    \ org.springframework.framework.context.junit4.JUnit4ClassRunner;\nimport org.springframework.framework.context.web.WebAppConfiguration;\n\
    \nimport readinglist.ReadingListApplication;\n\n@RunWith(JUnit4ClassRunner.class)\n\
    @SpringApplicationConfiguration(\n    classes = ReadingListApplication.class,\n\
    \    @WebAppConfiguration)\npublic class ReadingListApplicationTests {\n\n   \
    \ @Test\n    public void contextLoads() {\n    }\n}\n```\n\nIn a typical Spring\
    \ integration test, you'd annotate the class with @ContextConfiguration to specify\
    \ how the application context. In order to take full advantage of Spring Boot\
    \ magic, the @SpringApplicationConfiguration annotation should be used instead.\
    \ As you can see in Listing 2, ReadingListApplicationTests is annotated with @SpringApplicationConfiguration\
    \ to load the Spring application context from the ReadingListApplication configuration\
    \ class.\n\nReadingListApplicationTests also includes one test method, context-Loads().\
    \ It's so simple, in fact, it is an empty method. But it's sufficient for the\
    \ purpose of verifying that the application context loads without any problems.\
    \ If the configuration defined in ReadingListApplication is good, the test will\
    \ pass. If any problems exist, the test will fail.\n\nYou'll add some of your\
    \ own tests as we flesh out the application. But the contextLoads() method is\
    \ a fine start and verifies every bit of functionality provided by the application\
    \ at this point."
