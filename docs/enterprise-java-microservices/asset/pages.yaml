  md: '# # Strategies for fault tolerance and monitoring


    This chapter covers


    +   - What is latency?

    - Why do microservices need to be fault tolerant?

    - How do circuit breakers work?

    - What tools can mitigate against distributed failure?


    You''ll use the example from the previous chapters to expand the functionality
    of Stripe and Payment to include fault mitigation as you explore the concepts
    of fault tolerance and monitoring. Fault tolerance is especially important when
    your Payment microservice is communicating over a network to external systems.
    You need to expect failures and time-outs when communicating across networks.


    #  8.1 Microservice failures in a distributed architecture


