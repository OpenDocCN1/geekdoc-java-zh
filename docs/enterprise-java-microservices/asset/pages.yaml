    # 8.3.3 Bulkheads


    Bulkheads in software offer a similar strategy to those in ships, by isolating
    different parts to prevent a failure in one from impacting others. For ships,
    a failure in a single watertight compartment doesn''t spread to others because
    they''re separated by bulkheads.


    How does a software bulkhead achieve the same result? By shedding the load that
    a microservice is experiencing or about to experience. A bulkhead allows you to
    limit the number of concurrent calls to a component or service, to prevent the
    network from becoming saturated with requests, which would then increase latency
    across all requests in the system. Figure 8.7 adds the bulkhead strategy as the
    next step in your flow.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_165_0.png)


