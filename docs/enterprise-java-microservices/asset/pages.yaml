  md: '# Enterprise Java Microservices


    Ken Finnigan


    Large applications are easier to develop and maintain when you build them from
    simple, component parts. Java developers now enjoy a wide range of tools that
    support microservices application development, including right-sized apps, open
    source frameworks, and well-defined patterns. By all of you, can build microservices
    applications using your Java skills.


    > “Frameworks, patterns, and concepts that Java developers need to be successful
    in a microservices world.”


    Andrew Block, Red Hat


    > “A complete overview of how to implement microservices in a company environment,
    with different solutions to the same problem given and explained.”


    Java Microservices teaches you to design and build JVM-based microservices applications.
    You''ll start by learning how microservices design compares to traditional Java
    EE applications. Always practical, author Ken Finnigan introduces big-picture
    concepts along with the tools and techniques like Netfix Hrix for fault tolerance
    and the Just enough Application Server (JeAS) approach. To ensure smooth operations,
    you''ll also examine monitoring, security, testing, and deploying to the cloud.


    Damian Mazzini, USA Argentina


    > “ Covers everything a developer must know before stepping from monolith to microservices
    architecture.”


    Kelum Prab Senanayake Equinix


    > “A great guide through the world of Java enterprise microservices with cool
    use cases and code examples.”


    # What''s Inside


    +   * The microservices mental method

    * Cloud-native development

    * Strategies for fault tolerance and monitoring

    * Securing your finished applications


    This book is for Java developers familiar with Java EE.


    Ken Finnigan leads the Thorntail project at Red Hat, which seeks to making microservices
    for the cloud with Java and EE as easy as possible.


