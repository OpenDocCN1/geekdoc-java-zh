  md: '# Patterns for migration to microservices


    In some cases, a clean split will exist in the domain model of a Bounded Context,
    and in others there will be commonality the separate models, as in the preceding
    example. In this situation, it''s important to consider that although a part of
    the domain model is shared between Bounded Contexts, one can be classed as the
    *owner*.


    Having defined the owner of a piece of domain, it becomes necessary to make that
    domain available to external Bounded Contexts—but in a way that does not implicitly
    tie the two Bounded Contexts together. This does make it trickier to handle the
    boundary, but patterns such as Event Sourcing help with this problem.


    **NOTE** *Event sourcing* is the practice of firing events for every state change
    in an application, which is usually recorded as a log in a certain format. Such
    a log can then be used to rebuild entire database structures, or in this case,
    as to populate a piece of a domain model that''s owned externally.


    How do all these Bounded Contexts fit together? Each Bounded Context forms part
    of a greater whole, a context map. *Context map* is a global view of an application,
    identifying all the required Bounded Contexts and the way they should communicate
    and integrate with each other.


    In this example, because you''ve split Product into two, you''d need such a data
    from the Product to Order Bounded Contexts to be populate the Product with appropriate
    data.


    As you are in example, one side of shared domain models in Bounded Contexts is
    that each has its own view of the same data. An application is no longer forced
    into viewing a piece of domain in the same way as its owner. This can provide
    huge benefits when a domain needs only small subset of the data in each record
    that the owner might hold. For additional information on Domain-Driven Design
    and Bounded Contexts, I recommend *Functional and Reactive Domain Modeling* by
    Debashis Ghosh (Manning, 2016).


    # 1.3.2 Big Bang pattern


    *The Big Bang pattern* for migrating to microservices in an enterprise is by far
    the most complicated and challenging. It entails breaking apart every single piece
    of an existing monolith into microservices, until there''s a single cutoff from
    one to the other.


    Because deployment is a single cutoff—a Big Bang—to production, developing for
    such a change can take as long as developing on a monolith. Certainly, by the
    end of the process, you''ve moved to microservices, but this pattern would be
    a bumpier road for most enterprises than other patterns for migrating to microservices—especially
    when considering the internal process and procedure changes required to move between
    the two deployment models. Such an abrupt change would be traumatic and potentially
    damaging to an enterprise.


    The Big Bang pattern isn''t recommended for most enterprises who aren''t experienced
    with microservices, and most definitely not for those who aren''t experienced
    already.'
