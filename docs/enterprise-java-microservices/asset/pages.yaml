    Click the Data Stores box in the bottom row to see the different data stores available.
    On the Data Stores page shown, in figure 10.8, click the Select button in the
    MySQL (Persistent) box.


    You’ll be presented with a page containing configuration for MySQL, most of which
    can be left with the defaults. The only options you need to set are MySQL Connection
