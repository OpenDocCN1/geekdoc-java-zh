  md: '# APPENDIX Spring Boot microservices


    The first thing to notice is that the project structure follows the layout of
    a typical Maven or Gradle project. The main application code is placed in the
    src/main/java branch of the directory tree, resources are placed in src/main/resources
    branch, and test code is placed in the src/test/java branch. At this point, you
    don''t have any test resources, if you put them in src/test/resources.


    Digging deeper, you''ll see a handful of files sprinkled around the project:


    +   - build.gradle—The Gradle build specification

    - ReadingListApplication.java—The application''s bootstrap class and primary Spring
    configuration class

    - application.properties—A place to configure and Spring Boot properties

    - ReadingListApplicationTests.java—A basic integration test class


    The build specification contains a lot of Spring goodness to know about, so I''ll
    save inspection of it until later. Instead, we''ll start with ReadingListApplication.java.


    # Bootstrapping Spring


    The ReadingListApplication class serves two purposes in a Spring Boot application:
    configuration and bootstrapping. Even though Spring Boot autoconfiguration eliminates
    the need for a lot of Spring configuration, you''ll need at least a small amount
    of Spring configuration to enable autoconfiguration. As you can see in this listing,
    there''s only one line of configuration code.


    ```

    Listing 1 ReadingListApplication

    ```


    ```

    package readinglist;

    import org.springframework.boot.SpringApplication;

    import org.springframework.boot.autoconfigure.SpringBootApplication


    @SpringBootApplication

    public class ReadingListApplication {

    public static void main(String[] args) {

    SpringApplication.run(ReadingListApplication.class, args);

    }

    ```


    @SpringBootApplication enables component scanning and Spring Boot autoconfiguration.
    In fact, @Configuration—Designates a class as a configuration class using Spring''s
    Java-based configuration. Although you won''t write a lot of configuration in
    this book, you''ll favor Java-based configuration over XML configuration when
    you do.'
