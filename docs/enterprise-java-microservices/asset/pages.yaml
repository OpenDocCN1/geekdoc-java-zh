  md: '# # Securing a microservice


    +   This chapter covers

    - Understanding why you need secure microservices

    - Securing a microservice

    - Consuming a secured microservice

    - Interacting with secured microservices from a UI


    In this chapter, you''ll expand on previous examples by adding various types of
    security to them. First you will learn about the different kinds of security that
    you might need to consider when designing and developing microservices.


    # 9.1 The importance of securing your microservice


    Securing your microservice is a critical task that needs to be thought out from
    the beginning of development. Not doing so early results in greater development
    time for integrating security later. Why? Not designing for security results in
    code that might need major refactoring to do so at a later date.


    Though not taking security into account before development on a typical Java application
    can easily add months to the development schedule, at least with microservices
    you usually have a lot less code to be refactored. Even so, isn''t it better to
    design for security up front and save time?'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# 9.1.1 Why is security important?


    As enterprise developers, we''re often called on to develop myriad applications,
    the end user of the application varying between internal or external, and sometimes
    both. Figure 9.1 shows a microservice used by a small group of internal users.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_181_0.png)


    With these requirements, it''d be fair to determine that you can ignore security,
    right? Wrong!


    Even when you''re developing a microservice for internal users only, can you guarantee
    that the security surrounding your microservice will hold? What happens if, or
    when, any security barriers preventing external network intrusions are breached?

    Figure 9.2 shows how a malicious user, external to the network, would have uninhibited
    access to a microservice if network security is breached.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_181_1.png)'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# CHAPTER 9 Securing a microservice


    Security is a feature that should never be taken for granted, no matter what precautions
    might be implemented. A common misconception is that security is infallible, which
    is certainly not the case.


    Looking at figure 9.2, if you don''t consider an internal network secure, you''re
    more inclined to add extra security within your own microservice to prevent unpermitted
    access to it. If every application or microservice that''s purely for internal
    purposes doesn''t include its own security precautions, you''ve made the security
    at the boundary of the external network a single point of failure.


    That''s not considering the case where you may have a malicious user within the
    internal network, as shown in figure 9.3. Though having an internal malicious
    user may not be common, this situation can''t be discounted. This situation can
    occur for many reasons: disgruntled employee or corporate espionage the most likely.


    Few types of applications are developed that don''t need security. Those applications
    are mostly limited to reading-only data that''s available to the general public
    already.


    That''s a fairly narrow definition of an application for which you can ignore
    security. How many of these are your enterprise''s building every day? Probably
    none! Applications of this type that an enterprise has developed, or will, in
    its entire lifetime, would be extremely small in number. Static data that''s also
    publicly available lifetime doesn''t interest an enterprise.


    What does all that mean? It means that no application or microservice can ignore
    security, at all, ever.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_182_0.png)'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# 9.1.2 What problems does security need to solve?


    Now that you know you need security, what kind of problems do you need to solve?
    That in itself could be the sole topic for a book! Because you''re not looking
    to re-create War and Peace for microservices, you''ll focus on the areas that
    would be of most interest.


    Authentication and authorization are the two aspects of security that are the
    most relevant to microservices for us. Before you delve too deeply, you need to
    outline what each of these terms means.


    Authentication is illustrated in figures 9.1, 9.2, and 9.3. It deals solely with
    whether a user has the right to access an application or microservice be hosted,
    or even whether a user belongs to the enterprise or external. Authentication is
    purely concerned with a user being able to access an application.


    A microservice doesn''t need to distinguish between users beyond or not they''re
    allowed, authentication is all that''s needed. But if users who''ve been authenticated
    require different levels of access to different parts of an application or microservice,
    you also need authorization.


    Figure 9.4 provides an example of user roles that could be used for authorization
    of a microservice.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_183_0.png)


    You see the roles of Admin, Manager, and User, all fairly typical that might be
    required. Whatever roles might be required for your microservice will vary, potentially
    from zero to many, depending on the requirements.


    An enterprise may also have microservices, as shown in figure 9.5. In this case,
    you have a microservice administered by an internal user, with the role of Admin.
    User of the microservice is external to the enterprise.


    From the perspective of an entire application that may comprise many microservices,
    you usually need a mixture of authentication and authorization to satisfy security'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# CHAPTER 9 Securing a microservice


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_184_0.png)


    requirements. For an individual microservice within an application, you may need
    to concern yourself with only authentication of a user''s request and nothing
    more.


    Whatever your microservice might require—whether it be authentication, authorization,
    or both—needs to be considered during design to ensure that it isn''t a last-minute
    concern.


    How do you go about adding security into your microservices? You can certainly
    develop your own security solution, but that''s far from ideal in many situations.
    You''d spend time developing it, maintaining it, and so forth. Developing your
    own security solution not only results in a delayed start to developing what you
    want, your microservice, but also creates an additional maintenance burden for
    future developers.


    What you want to do is take advantage of a solid project that''s developed and
    maintained by a large group of developers and provides the security use cases
    you need to handle. Though you might have many possible options for such a project
    in this book we''ll choose Keycloak.


    # 9.2 Working with Keycloak


    Keycloak is an open source project providing identity and access management for
    modern applications and services. Adding authentication to applications and securing
    services can be achieved with a minimum of fuss.


    # 9.2.1 Understanding Keycloak''s features


    Keycloak provides many features. Here are four most relevant for microservice
    development:


    +   - Single-sign-on—Allows users to authenticate against Keycloak rather than
    each individual application or service. After users log in to Keycloak, they can
    access any application or service that''s authenticated through Keycloak.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Working with Keycloak


    +   - Social login—It’s super easy to enable social logins with Keycloak! Configure
    the social network within the admin console and go. No code or application changes
    are required.


    +   - User federation—If your users are registered within LDAP or Active Directory,
    they can be federated with Keycloak. It''s also possible to develop your own provider
    to access your users, if they''re in different types of stores, such as a relational
    database.


    +   - Standard protocols—Out of the box, Keycloak provides support for OpenID
    Connect, OAuth 2.0, and Security Assertion Markup Language (SAML).


    Full details on Keycloak and all its features can be found on its website, www.keycloak.org.


    #  9.2.2 Setting up Keycloak


    The first thing you need is to download the Keycloak server for your microservices
    and applications to integrate with. For our purposes, you have two ways of doing
    that. You could download a full WildFly distribution for Keycloak or download
    a Keycloak server built with Thorntail. To keep with the microservices way of
    doing things, choose the Thorntail version. The version you need for all our examples
    is down-loadable from http://mng.bz/s6r9.


    After downloading, start this version on a separate port so it doesn''t interfere
    with your microservices:


    ```

    java -Dswarm.http.port=9090 -jar keycloak-2018.1.0-swarm.jar

