- img_proc: true
  md: 'As you see, the focus of JeAS is on the runtime needed for a microservice.
    A JeAS runtime aims to provide a whittled-down application server for microservices,
    but the way it''s packaged can differ among implementations.


    JeAS runtimes provide a simple and manageable way to include only the parts of
    an application server that your application requires, and we''ll cover those shortly.
    Runtimes are more flexible than others in terms of what''s included,


    Which JeAS runtime is chosen can impact the packaging available to a microservice.
    The driving factor, however, should always be about what''s supported by a JeAS
    runtime and not how it needs to be packaged.


    # 3.1.2 What are the benefits?


    In your SAP microservice from the previous section, you saw how painful it can
    be when your application relies on the smaller-footprint Web Profile. It requires
    you to bring in additional libraries and configure them to work with the rest
    of the application server.


    As developers, we want to spend our time effectively, developing new features
    or fixing bugs. We don''t want to spend endlessly configuring application servers
    based on differing requirements between applications. More often than not, we''d
    choose the full platform for the sake of simplicity.


    What''s the big deal with using the full platform? Sure, there are parts of you
    might not use today, but you plan to one day, right? In some cases an application
    will grow to include the use of one, or maybe two, additional specifications that
    weren''t part of the original design. It''s highly doubtful that an application
    would sufficiently need to redesign the application, because it contains too many
    features for a single application. That leaves a large part of a full application
    server unused.


    Wouldn''t it be nice if application servers weren''t one size fits all? This is
    one of the cases that JeAS aims to solve, allowing the developer to choose which
    features, or specifications, of an application server are required for a given
    application.


    Why does that matter? If an application needs only servlets, it can be deployed
    to a JeAS runtime that has only servlets available. With a JeAS runtime, if an
    application needs to add a feature, such as JAX-RS, a developer can choose to
    add that feature into the JeAS runtime as a standalone piece. It''s no longer
    necessary to choose between two Java EE options, or attempt to customize the application
    server.


    This flexibility means that JeAS runtimes have great benefits:


    +   - Reduced package size—When compared against an application bundle it''s deployed
    to.


    +   - Reduction in allocated memory—How reduced will depend on many factors, such
    as the number of classes that are no longer loaded.'
