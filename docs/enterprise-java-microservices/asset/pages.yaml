    # 7.2 Registering a microservice with Thorntail


    You''ve seen how a service registry can benefit your microservices by decoupling
    you from the URL locations of anything you need to consume. The theory. Now is
    time to see service registration and discovery in action! You''ll take a look
    at your options for a service registry with Thorntail, which are known as topologies,
    before seeing how to register a microservice so it can be discovered by others.


    # 7.2.1 Thorntail''s topologies


    Thorntail provides an abstraction over a service registry that is referred to
    as a topology. What benefit does the abstraction provide? It means your client
    code doesn''t need to change if your microservice is moved into an environment
    with a different service registry implementation. The most likely use case for
    this is developing and testing locally against one type of service registry and
    then using a different one in test and production environments.


    In an ideal world, you could run a like-for-production environment on your local
    machine for testing, but that''s not always possible with enterprises today. Moving
    toward a more cloud-based infrastructure, like Kubernetes and OpenShift, combined
    with Linux containers, does make it easier to replicate these environments with
    fewer resources. Not all enterprises may ever reach such a point.


    What service registry implementations, or topology types, does Thorntail offer?
    It offers these:'
