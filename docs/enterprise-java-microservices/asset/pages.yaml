- img_proc: true
  md: 'Time-outs are another crucial source of network failure you need to be mindful
    of developing microservices. Time-outs can be linked to high latency; requests
    aren''t responded to in a timely manner not only because of network delays, but
    also because of issues with the consuming microservice. If the microservice you''re
    calling has gone down, experiencing high load, or for any other number of reasons,
    you''ll notice problems when you try to consume it, often in the form of a timeout.
    There''s no way to predict when a time-out will occur, so your code needs to be
    aware that time-outs happen, and of how you want to handle the situation when
    you receive one.


    Do you try again, immediately or after a short delay? Do you presume a standard
    response and proceed anyway?


    It''s these network failures that you want to especially mitigate against. Otherwise,
    you leave your microservices, and every application, open to unexpected network
    failure with no means of recovering after restarting services. Because you can''t
    afford to be restarting services every time a network problem occurs, you need
    to develop your code to prevent restarting from being your only option.


    # ### Mitigating against failures


    In looking at how to mitigate against failure, you could certainly implement the
    features you need yourself. But you might not be an expert in all the best ways
    to implement the features you need. Even if you''re, accomplishing implementation
    requires more than a short development lifecycle. You''d rather be developing
    more applications! Though you might be able to use many different libraries, in
    this case you''re going to be using Hystrix from Netflix Open Source Software.


    # ### What is Hystrix?


    Hystrix is a latency and fault-tolerance library intended to isolate access points
    with remote systems, services, and libraries; halting cascading failure; and enable
    resilience in distributed systems. Wherever failure is inevitable, as with distributed
    systems, the Hystrix improves the resilience of microservices in these environments.


    A lot of things are going on with Hystrix, so how does this library do it? We
    can''t cover the entirety of Hystrix within this single chapter; that would require
    an entire book in its own right. But this section provides a high-level view of
    how Hystrix performs its segmentation.


    Figure 8.2 shows a view of a microservice handling the load of many user requests.
    This microservice needs to communicate with an external service. In this situation,
    it''s easy for the microservice you''ve developed to become blocked as it''s waiting
    for external service 2 to respond. Worse, you could overload the external service
    to the point it stops functioning completely.'
