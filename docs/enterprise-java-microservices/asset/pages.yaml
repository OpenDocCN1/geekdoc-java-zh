  md: '# about this book


    Over the last seven or eight years, the term microservices has exploded in its
    use, not always to the betterment of developers trying to understand what it means.
    During the latter part of time, developers have sought to bring their existing
    Enterprise Java Swarm to create microservices, not always with the best of success.
    Enterprise Java Microservices is written with the goal of helping existing Enterprise
    Java developers bridge the gap between traditional application development and
    microservices.


    As part of my job at Red Hat, I''ve seen the explosion of microservices first
    hand. That explosion was a contributing factor in a colleague and forming me the
    WildFly Swarm project in 2015. We saw the need for developers with existing Enterprise
    Java knowledge to microservices, and with nothing focused on the Java EE space
    at the time, we created WildFly Swarm. Much has changed since then, and the current
    landscape for microservices makes it seem like a lifetime has passed.


    Since I began writing this book, changes have continued to occur rapidly with
    Enterprise Java—in particular, the Thorntail project that I lead, and with microservices
    more generally. As best as I can, I''ve endeavored to update the book as those
    changes occurred.


    It should be noted that this book isn''t intended to delve deeply into all aspects
    of microservice development; it would be many times longer than it is now if that
    were the case. Where appropriate, links to additional reading are provided if
    you choose to delve into a particular topic in greater detail.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Who should read this book


    This book is for any Enterprise Java developer with at least four years of experience.
    These developers may have basic knowledge of microservices and may have tried
    microservices with Node.js or other non-Enterprise Java technologies, but haven''t
    learned to develop Enterprise Java microservices.


    # How this book is organized: a roadmap


    The book is split into two parts. Part 1, chapters 1 through 5, discusses the
    overall architecture of microservice and distributed systems, along with the concept
    of slimming application services, testing, and cloud native development. Part
    2 delivers into the gritty reality of microservice development such as service
    registries, fault tolerance, and security.


    Chapter 1 introduces the reader to Enterprise Java—in particular, a monolith and
    how it is about. The chapter introduces distributed architectures and microservices
    by covering what they are, what the terms mean, and other processes that go in
    hand with the switch to microservices. Lastly, it introduces patterns that can
    be applied to migrating from monoliths to microservices, and when each might apply.


    Chapter 2 introduces a microservice by developing RESTful endpoints for managing
    a list of categories for a shopping site. The chapter also introduces the Cayambe
    monolith, which will be converted to a hybrid and have additional microservices
    developed throughout the book.


    Chapter 3 introduces the concept of a Just enough Application Server (JeAS) runtime
    and showcases the differences between the frameworks available to support such
    runtime.


    Chapter 4 covers how unit and integration testing differ now we''re developing
    microservices, and introduces a new concept of consumer-driven contract testing,
    which is critical to success in architectures with many microservices collaborating
    and communicating.


    Chapter 5 talks about the cloud and the different service models used in different
    environments. We also discuss cloud native development and how that fits into
    the microservices world. Next, we use tools for our disposal for local cloud development,
    and you''ll see these tools can be used for testing.


    Chapter 6 discusses the libraries available for consuming enterprise microservices,
    and the levels of abstraction they provide. We cover fairly low-level libraries
    like java.net and Apache HttpClient investigating libraries with a higher level
    of abstraction such as JAX-RS and RESTEasy clients.


    Chapter 7 extends chapter 6 by adding the necessary pieces for our microservices
    to be able to discover what they wish to consume. Without being able to register
    a microservice, or discover it, there''s no way to reliably consume one.


    Chapter 8 dives into a critical topic for distributed architectures and microservices—failure
    and how to mitigate it. We briefly cover the typical types of failure'
  merge: -1
  pgno: 12
