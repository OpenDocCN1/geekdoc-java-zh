  md: 'Cayambe uses EAR (Enterprise Application aRchive as the means of packaging
    the deployment. EAR allows Cayambe to include multiple WARs in addition to common
    JAR libraries that can be shared.


    > NOTE Though EARs were the preferred method for packaging a Java EE deployment,
    WAR deployments are more common at present. That''s not to say EARs aren''t still
    being used, either by choice or legacy code, but EAR usage is less prevalent than
    it was.


    To build Cayambe, you need to change the /cayambe directory of the book''s code
    and run the following:


    ```

    mvn clean install

    ```


    Maven will construct each of the JARs and WARs that the project code resides within,
    and then package it into an EAR for you to deploy. After construction is complete,
    copy /cayambe-target/cayambe.ear into /standalone/deployments of the WildFly installation.


    Now start WildFly, including your deployment, by running this command from the
    root of the WildFly installation:


    ```

    /bin/standalone.sh

    ```


    Lots of messages are output to the console as WildFly starts, and then your deployment
    is started. WildFly is ready to accept traffic to Cayambe after the messages stop,
    and you should see a message that contains content like this:


    ```

    WFLYSRV0025: WildFly Full 11.0.0.Final (WildFly Core 3.0.8.Final) started in 6028ms

    ```


    You can access the site at http://localhost:8080, and the administration site
    at http://localhost:8080/admin.


    # 10.3 Cayambe hybrid—monolith with microservices


    In chapter 1, you learned about the Hybrid pattern for monoliths, whereby an existing
    monolith can have functionality migrated to a microservice environment. This pattern
    allows those pieces of the monolith that require higher scalability or performance
    to be efficiently separated, without requiring the entire monolith to be rebuilt
    to make improvements. Let''s revisit a monolith using the Hybrid pattern might
    look like; see figure 10.4.


    > NOTE In this particular instance, you won''t be using a gateway that fronts
    all microservices.'
  merge: -1
  pgno: 210
