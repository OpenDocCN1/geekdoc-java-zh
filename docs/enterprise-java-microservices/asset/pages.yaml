  md: '# Enterprise Java microservices


    This chapter covers


    +   - Enterprise Java history

    - Microservices and distributed architecture

    - Patterns for migration to microservices

    - Enterprise Java microservices


    Before you dive in, let''s step back and discuss what I hope you achieve during
    the course of this book. We all know that there''s no such thing as a free lunch,
    so I won''t pretend that microservices are easy. This chapter introduces microservices—their
    concepts, benefits, and drawbacks—to provide a basis on which you can build your
    technical knowledge. Chapters 2 and 3 provide an example of a RESTful microservice
    and cover some of your runtime and deployment options for Enterprise Java microservices.


    So what is an Enterprise Java microservice? In a nutshell, it''s the result of
    Enterprise Java to the development of microservices. The latter part of this chapter
    and the remainder of the book explore in detail what that means.'
