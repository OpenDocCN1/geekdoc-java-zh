  md: '# ADMIN MICROSERVICE DATA


    The following commands create a cayambe-camambe user for the admin database, grant
    the user all privileges to the cayambe_camambe database, create the data, and
    finally switch to use that database:


    ```

    create user ''cayambe-admin'' identified by ''cayambe-admin''

    grant all privileges on cayambe_admin.\* to ''cayambe-admin'' with grant option;

    create database cayambe_admin;

    use cayambe_admin;

    ```


    In the context of the cayambe_admin database, you can now execute some SQL to
    create the tables and populate them with initial data.


    Open /chapter10/sql/admin/mysql.sql and paste the contents into the terminal window
    where you are logged into MySQL. See SQL statements flash by, and if all went
    well, no errors! Now that the tables are there, do the same with /chapter10/sql/admin/data.sql
    to load the data.


    # PAYMENT MICROSERVICE DATA


    You now run a similar set of commands for a cayambe-payment user and cayambe_payment
    database:


