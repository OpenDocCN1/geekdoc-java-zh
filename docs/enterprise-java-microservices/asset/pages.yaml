  md: '# Keycloak realms


    Keycloak realm manages a set of users, along with their credentials, roles, and
    groups. Realms are isolated from each other and are responsible for managing only
    the users they''re associated with.


    Realms provide a way to segregate groups of users for different purposes. You
    might have a realm for finance microservices and another realm for people management
    microservices. This separation ensures that users from each realm remain separate
    but are managed from a single Keycloak instance.


    Depending on your needs, Keycloak is flexible enough to handle any situation your
    application or microservice requires. A common requirement for typical application
    development, but still relevant for microservices, is the need to authenticate
    a user and use their credentials when calling services.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_187_0.png)


    Figure 9.9 User authentication via a UI


    The authentication steps are as follows:


    +   1 The user requests to log into the application UI.

    2 The UI redirects to Keycloak to perform the login. Keycloak returns tokens that
    can be used to issue authenticated requests.

    3 The user chooses to load a view requiring authentication.

    4 A bearer token provided by Keycloak is added to the HTTP headers of the request.

    5 The token is extracted from the request and passed to Keycloak for validation.
    If the token is valid, the secured microservice is able to process the request.
    If the token isn''t valid, an HTTP 401 status is returned to indicate that an
    unauthorized user made a request.'
