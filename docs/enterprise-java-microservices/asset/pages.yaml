  md: "# Spring Boot testing\n\nWith these static inputs in place, the test can be\
    \ rewritten like this:\n\n```\n@Test\npublic void get() throws Exception {\n mockMvc.perform(\"\
    /readingList\")\n    .andExpect(status().isOK())\n    .andExpect(view().name(\"\
    readingList\"))\n    .andExpect(model().attributeExists(\"books\"))\n    .andExpect(model().attribute(\"\
    books\", isEmpty()));\n}\n```\n\nNow the test method almost reads naturally. It\
    \ first performs a GET request /readingList. Then it expects that the request\
    \ is successful (isOK()) an HTTP 200 response code and that the view has a logical\
    \ name of readingList. It also asserts that the model contains an attribute named\
    \ books, but that attribute is an empty collection. It's all straightforward.\n\
    \nThe main thing to note is that at time the application is deployed to a web\
    \ server. Instead it runs within a mocked-out Spring MVC, capable enough to handle\
    \ the HTTP requests you throw at it via the MockMvc instance.\n\nPretty cool,\
    \ huh? Let's try one more method. This time you'll make it a bit more interesting\
    \ by sending an HTTP POST request to post a new book. You should expect that after\
    \ the POST is handled, the request will be redirected to /readingList and that\
    \ the books attribute in the model will contain the newly added book. Following\
    \ listing shows how to use Spring MVC for this kind of test.\n\n# Listing 6 MockMvcWebTests\n\
    \n```\n@Test\npublic void postBook() throws Exception {\n mockMvc.perform(post(\"\
    /readingList\")\n    .contentType(MediaType.APPLICATION_FORM_ENCODED)\n    .param(\"\
    title\", \"BOOK TITLE\")\n    .param(\"author\", \"BOOK AUTHOR\")\n    .param(\"\
    isbn\", \"1234567890\")\n    .param(\"description\", \"DESCRIPTION\")\n    .andExpect(status().is3xxRedirection())\n\
    \    .andExpect(header().string(\"Location\", \"/readingList\"));\n\nBook expectedBook\
    \ = new Book();\nexpectedBook.setId(1);\nexpectedBook.setReader(\"craig\");\n\
    expectedBook.setTitle(\"BOOK TITLE\");\nexpectedBook.setAuthor(\"BOOK AUTHOR\"\
    );\nexpectedBook.setIsbn(\"1234567890\");\nexpectedBook.setDescription(\"DESCRIPTION\"\
    );\n\nmockMvc.perform(get(\"/readingList\")\n    .andExpect(status().isOK())\n\
    \    .andExpect(view().name(\"readingList\"))\n```"
