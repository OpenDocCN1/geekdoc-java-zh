  md: '# Why does a microservice need to be discovered?


    This architecture also requires the client, Payment, to have code designed to
    strip the load across the instances of Stripe. When the client is responsible
    for determining which instance of a microservice to consume, this process is known
    as client-side load balancing. The client is making a decision about which instance
    to consume.


    Developing load-balancing techniques for the microservices you need to consume
    isn''t where you want to be spending your precious time. Ideally, you want a framework
    or library to handle complexity for you, allowing your code to request a single
    instance to operate.


    What can be done to reduce some of the pain of your situation? Enter service discovery!


    # 7.1.1 What is service discovery?


    Service discovery is the means by which one microservice retrieves the physical
    location of another microservice, at runtime, for the purpose of consuming it.
    Service discovery requires the use of a service registry. Otherwise, there''s
    no place from which the discovery process can retrieve the URL.


    How does adding service discovery into the flow of consuming a microservice affect
    how your Payment microservice operates? See figure 7.3.


    Here''s how your Payment microservice makes a call to the Stripe microservice
    by discovering it through a service registry:


    +   1 The Payment microservice requests the locations for the Stripe microservice
    from a known service registry.

    2 The service registry returns all the available Stripe instances.

    3 The Payment microservice sends a request to the Stripe microservice instance
    retrieved from the service registry.

    4 The Payment microservice receives a response from the Stripe microservice.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_135_0.png)


    Figure 7.3 Service discovery'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'The process seems simple enough, but how does service discovery work? First,
    you need to have a place to find the microservices you need. That''s the role
    of the service registry.


    You now have a place to look for the microservices you need, but that doesn''t
    mean a lot if it''s empty! Anytime instance a microservice is started, it needs
    to contact the service registry to provide it with a name and a URL location where
    it can be accessed. The name doesn''t need to be unique, but all microservices
    registered under an identical name do need expose the same API. If they don''t,
    any client of those microservices is going to see very different and unexpected
    results!


    After a service registry is populated with data, your client microservice can
    ask it to provide the URL locations of all instances for a specified service name.
    At this point, it''s up to your client to determine it which location to use when
    consuming the microservice.


    Depending on whether you''re using a framework or consuming microservices without
    one, several algorithms can be used to choose a specific location. The algorithm
    could be as simple as cycling through each location in order, known as *roundrobin*.
    Or the algorithm can increase in complexity by taking into account factors such
    as current load and response times.


    As discussed, your microservice shouldn''t be developing custom loadbalancing
    algorithms. If a microservice needs anything more complicated than a basic round-robin,
    or a random choice from a list, you should consider including a library to provide
    those algorithms for you.


    Whether your microservice uses a simple load-balancing internally, or you use
    a library for, there is the question of how long to retain the instance URL you''ve
    been given. In an ideal world, you wouldn''t retain the instance URL, for any
    length of time, allowing instances of microservices to come and go without affecting
    clients. If at all, you''re in a better place if you start with this approach.


    If an environment isn''t suited to real-time service discovery every time, your
    microservice shouldn''t hold any physical URLs for more than 10 to 15 seconds.
    That might not seem much, but a microservice can quickly go from functioning to
    failing. An extra burden with caching URLs is that your code needs to be more
    vigilant about catching network failure and microservice errors, either with retries
    or by using service discovery to retrieve a fresh instance.


    # What are the benefits of service discovery and a registry?


    Why do you want the extra infrastructure and management of a service registry
    for your microservices environment? Can''t you use a properties file to externalize
    the URL of anything your microservice needs to consume?


    Sure, this was how most external services were integrated into applications in
    the past. This technique provided an easy way to change the URL of external services
    when moving between testing and production environments.'
  merge: -1
