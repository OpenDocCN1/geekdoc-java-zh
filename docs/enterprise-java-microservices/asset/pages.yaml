- img_proc: true
  md: '# CHAPTER 1 Enterprise Java microservices


    After you''ve learned the basics of microservices, you''ll delve into tools and
    tech-iques for use in Enterprise Java to mitigate the drawbacks and complexity
    of micro-services. Being more familiar with microservices, you''ll then look at
    an existing Enterprise Java application and how it could be migrated to take advantage
    of micro-services. The last few chapters touch on advanced microservice topics
    related to security and event streaming.


    # 1.1 Enterprise Java—a short history


    If you''re reading this book, you''re most likely an experienced Enterprise Java
    developer. If you aren''t, I appreciate and applaud your desire to broaden your
    horizons-into Enterprise Java!


    # 1.1.1 What is Enterprise Java?


    For those who need to, or need a refresher in, Enterprise Java, what is it? Enterprise
    Java is a set of APIs, and their implementations, that can provide the entire
    stack of an application from the UI down to the database, communicate with external
    applications via web services, and integrate with legacy systems, to name a few,
    with the goal of supporting the business requirements of an enterprise. Though
    it''s possible to achieve such a result with Java on its own, rewriting the low-level
    architecture required for an application would be tedious and prone, and would
    significantly impact the ability of a business to deliver value in a timely manner.


    It wasn''t long after Java was first released more than 20 years ago that various
    frameworks began to crop up to solve the low-level architecture concerns of developers.
    These frameworks allowed developers to focus on delivering business value with
    application-specific code.


    # Enterprise Java


    Many frameworks have come and gone, but two have remained the most popular through
    the years: Java Platform, Enterprise Edition (Java EE), and Spring. These two
    frameworks account for most development by an enterprise with Enterprise Java.


    Java EE incorporates many specifications, each with one or more implementations.
    Spring is a collection of libraries, some of which wrap Java EE specifications.


    # 1.1.2 Typical Enterprise Java architecture


    In the early days of Enterprise Java, our applications were all greenfield development,
    because no preexisting code was being extended.


    > DEFINITION Greenfield refers to the development of an entirely new application
    without any preexisting code that needs to be taken into consideration, excluding
    any common libraries that might be required.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Enterprise Java—a short history


    Greenfield development presents the greatest opportunity to develop a clean architecture
    for an application. Typically, architects would devise an architecture similar
    to that shown in figure 1.1.


    Here you likely recognize familiar pieces of architectures you''ve worked on in
    the past: a view layer, a controller, possibly using a reusable business service,
    and finally, the model that interacts with the database. You can also see the
    application packaged as a WAR, but combinations of packaging for each layer could
    be included, including JAR and EAR. Typically, the view and controller are packaged
    in a WAR. The business service and model are packaged in JARs, either inside a
    WAR or EAR.


    As the years passed, we continued developing greenfield applications with Enterprise
    java using such a pattern, but there reached a point where most enterprises


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_21_0.png)


    +   1 A user makes a request from a browser specifying which view of an application
    they wish to see.

    2 The view calls out to a controller to retrieve whatever information might be
    required to construct itself.

    3 The controller can retrieve the information in one of two ways:

    3a Directly interact with the model of the application to retrieve an object model
    populated with data.

    3b Call one or more business services, possibly to aggregate data from different
    sources.

    4 A business service can also make many calls to other business services. It depends
    on how the business features have been architected.

    5 The business service calls a model to retrieve the data it needs. This step
    is equivalent to 3a.

    6 Model classes provide the mapping onto physical data storage, and are often
    passed back up through the layers of the application.


    Figure 1.1 Typical Enterprise Java application architecture'
  merge: -1
