  md: '# Anatomy of a Spring Boot project


    +   Spring''s @ComponentScan—Enables component scanning so that the controller
    classes and other components you write will be automatically discovered and registered
    as beans in the Spring application context. Later in this appendix, you will write
    a simple MVC controller that will be annotated with @Controller so that component
    scanning can find it.


    +   Spring Boot''s @EnableAutoConfiguration—This humble annotation might also
    be named @Abracadabra because it''s the one line of configuration that enables
    magic of Spring Boot autoconfiguration. One line keeps you from having to write
    the pages of configuration that would be required otherwise.


    In older versions of Spring Boot, you''d annotate the ReadingListApplication class
    with all three of these annotations. But since Spring Boot 1.2.0, @SpringBootApplication
    is all you need.


    As I said, ReadingListApplication is also a bootstrap class. There are several
    ways to run Spring Boot applications, including traditional WAR deployment. For
    now, the main() method enables you to run your application as an executable JAR
    from the command line. It passes a reference to the ReadingListApplication class
    to SpringApplication.run(), along with the command-line arguments, to kick off
    the application.


    Even though you haven''t written any application code, you can still build the
    application at this point and try it out. The easiest way to build and run the
    application is to use the bootRun task with Gradle:


    ```

    $ gradle bootRun

    ```


    The bootRun task comes from Spring Boot''s Gradle plugin. Alternatively, you can
    build the project with Gradle and run it with Java at the command line:


    ```

    $ gradle build

    ```


    ```

    $ java -jar build/libs/readinglist-0.0.1-SNAPSHOT.jar

    ```


    The application should start up fine and enable a Tomcat server listening on port
    8080. You can view your browser at http://localhost:8080 if you want, but because
    you haven''t written a controller class yet, you''ll be met with an HTTP 404 (Not
    Found) and an error page. Before this appendix is finished, though, URL will serve
    your reading-list application.


    You''ll almost never need to change ReadingListApplication.java. If your application
    requires any additional Spring configuration beyond what Spring Boot autoconfiguration
    provides, it''s usually best to write it into separate @Configuration-configured
    classes. (They''ll be picked up and used by component scanning). In exceptionally
    simple cases, though, you could add custom configuration to ReadingListApplication.java.'
