  md: '# Chapter 11. Data streaming with Apache Kafka


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_230_0.png)


    from one or more topics, perform some type of transformation on the data, and
    then output it to one or more different topics.


    # WHAT IS A RECORD?


    Now that you understand some of the pieces that make up Apache Kafka, let''s define
    a *record*. Each record within a stream consists of a key, a value, and a timestamp.
    The key and value are straightforward in terms of their purpose, but why is a
    timestamp needed? The timestamp is crucial to Apache Kafka knowing when a record
    was received (which will become even more critical when we cover partitions).


    You also need to be aware of additional concepts before continuing. Each record
    is *immutable* within the data stream: you can''t edit, modify, or remove a record
    from the data stream after it''s added. All you can do is update records for the
    same key that set a different value.


    Figure 11.3 expands on the stream from figure 11.1, showing possible records for
    a real-time stream of share prices. In figure 11.3, you can see that there''s
    no single record for the key RHT. There are currently three, all with different
    values. This is the immutability of the data stream. If the stream weren''t immutable,
    there would likely be a single record for the key RHT that''s continually updated
    with a new value.


    | Key: RHT | | Key: RHT | | Key: RHT | | |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 0 | | 2 | | 4 | | n |

    | Value: $123 | | Value: $128 | | Value: $125 | | |


    Figure 11.2 Apache Kafka integrations (reproduced from https://kafka.apache.org/intro.html)


    Figure 11.3 Immutable data stream'
