    # 3.2.4 Spring Boot—opinionated microservices


    Spring Boot came about from a desire to remove the need for boilerplate configuration
    by following conventions instead. Annotations were also introduced to provide
    a means of enabling parts of Spring Boot without needing configuration to do.


    Spring Boot provides many starters as dependencies for your project that combine
    related libraries and frameworks and configuration for many features that you
    may require when developing a microservice. For example, spring-starter-data-jpa
    dependency brings in all that''s required to use Spring and JPA for accessing
    a database. A full list of all the available starters can be found in the GitHub
    repository: http://mng.bz/ciQ3. Or take a look at http://start.spring.io, where
    you can create a Maven project using the starters that you need for your application.


    Figure 3.8 shows how your JAX-RS, CDI, JMS micro uses Spring Boot. The biggest
    challenge with this microservice would be rewriting existing code that uses CDI
    dependency injection instead. Starters are available to make CDI work inside Spring,
    but if you''re looking for the project to remain as a Spring-based project, rewriting
    it to use Spring injection makes better sense.


    With starters, Spring Boot is able to provide a flexible JeAS runtime that can
    be expanded or contracted as required on the evolving requirements of the application.
    Modifying the application''s functionality is only a matter of adding or removing
    Spring dependencies and rebuilding the application.


    If''re not sure what starters you might need, head over to http://start.spring.io
    to look at the options. The website contains a project generator that''s a great
    place to see the entire landscape of available starters and the types of functionality
