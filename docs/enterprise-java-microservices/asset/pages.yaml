  md: '# Just Application Server


    The term *just Application Server* has been used occasionally over the years,
    but usually in relation to customizing a full application server by removing functionality
    usually. Only since the popularity of microservices has JeAS become crucial for
    Enterprise Java. This section covers what JeAS means, its benefits, and what an
    example developed in each of JeAS runtimes looks like.


    # What does JeAS mean?


    Say you need to develop a microservice that interacts with an enterprise information
    system (EIS), such as SAP, to retrieve Human Resources (HR) information on employees.
    For this microservice, you''ve chosen to use JAX-RS, CDI, and JMS. If you were
    to develop such a microservice for deployment onto a typical Java EE application
    server, it''d most likely be deune against the full Java EE platform, as illustrated
    in figure 3.1.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_53_0.png)


    Figure 3.1 Microservice specification usage of full Java EE platform


    As you can see, there are lots of specifications within the full platform that
    you''re not using, but they''re still there even though you don''t require them.
    The full platform has 33 JSRs included within it. That''s a lot of specifications
    that you may not always need.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# CHAPTER 3 Just enough Application Server for microservices


    Maybe there''s a Java EE profile you can use to slim it down? You have only one
    option now. Let''s try the Web Profile and see how it works; see figure 3.2.


    That results in fewer used specifications, but now you have the problem that JMS
    isn''t part of the Web Profile. You can still add an implementation of JMS to
    your microservice as part of the deployment, but it''s no longer part of the stack
    and may require additional configuration that you didn''t need with the full platform.


    What''s the answer? Can JeAS help? And what exactly is just enough Application
    Server? In a nutshell, EAS inverts the relationship between an application server
    and an application, ensuring that you package only the parts of an application
    server that your application requires. In the case of our preceding microservice
    example, you know that you need JMS, so you choose the full platform of an application
    server. But you know your application will never use large parts of that application
    server.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_54_0.png)


    Java EE profiles


    Since Java EE 6, we''ve had one profile and the full platform available for developers
    to choose as their application server. Although you may not be familiar with these
    options, the following provides an overview of which specifications the full platform
    and Web Profile contain.


    | Feature | Web Profile | Full platform |

    | --- | --- | --- |

    | EJB (Local) | ✓ | ✓ |

    | JTS/JTA | ✓ | ✓ |

    | Clustering | ✓ | ✓ |

    | Servlet | ✓ | ✓ |

    | JSF | ✓ | ✓ |

    | JPA | ✓ | ✓ |

    | JDBC | ✓ | ✓ |

    | CDI | ✓ | ✓ |

    | Bean validation | ✓ | ✓ |

    | JAX-RS | ✓ | ✓ |'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Just enough Application Server


    (table continued)


    | Feature | Web Profile | Full platform |

    |---|---|---||

    | JSON-P | ✓ | ✓ |

    | EJB (remote) | | ✓ |

    | JCA | | ✓ |

    | JAX-WS | | ✓ |

    | JAXB | | ✓ |

    | JMS | | ✓ |

    | JavaMail | | ✓ |

    | JAX-RPC | | ✓ |

    | JAXR | | ✓ |


    Many application servers provide the flexibility to slim down their distribution
    by removing components and their associated configuration. I''ve worked with many
    customers in the past who have taken this approach. But finding the correct combination
    that ensures the application server functions properly requires somewhat of a
    trial-and-error approach. In some cases, there may even be a component that you''d
    like to remove but can''t, usually because that component is a key part of the
    application server.


    Customizing an application server for many different applications quickly evolves
    into a complex set of differing configurations that need to be managed and maintained.
    developers typically prefer to simplify their lives and choose the full platform
    as opposed to spending time trying to slim the application server. They opt to
    accept the extra overhead that comes with not using all components of the application
    server.


    Over the years, several application servers, such as WildFly, have worked to reduce
    the footprint of components that aren''t being used. Though the dependencies required
    for various components are still on the classpath, the application server is clever
    enough to not load classes into memory if the deployed applications don''t require
    them. This can go only so far, unfortunately, because many components are too
    central to the functioning of the application server, no matter what an application
    might require.


    So where does JeAS fit in with your microservices architecture from figure 1.4?
    Take a look at figure 3.3.'
