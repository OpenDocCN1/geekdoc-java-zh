  md: "# Listing 4.8 CategoryResource.create()\n\n```\ntry {\n    em.persist(category);\n\
    \    em.flush();\n} catch (ConstraintViolationException cve) {\n    return Response\n\
    \        .status(Response.Status.BAD_REQUEST)\n        .entity(cve.getMessage())\n\
    \        .build();\n} catch (Exception e) {\n    return Response\n        .serverError()\n\
    \        .entity(e.getMessage())\n        .build();\n}\n```\n\nAll you've done\
    \ here is making create() to flush the changes in the entity manager, which causes\
    \ the validation to be triggered, and then catch any constraint violations to\
    \ return a response. Running mvn test this change now allows the to pass, because\
    \ it's returning the correct response code.\n\nIntegration testing is a crucial\
    \ point for all microservices. As you've just seen, it'll quickly identify failure\
    \ points in integrating with external systems, such as a database, caused by situations\
    \ that the existing code wasn't written to handle. Integrating with databases\
    \ and transferring data via HTTP requests are two common uses for which testing\
    \ your existing code can be exposed.\n\nDevelopers are human; we make mistakes.\
    \ Proper testing is a key way to ensure that you've developed code matches what's\
    \ expected. It's often a good idea to have a different developer create these\
    \ types of tests, because another developer won't have any preconceived notions\
    \ about how the code works and will be concerned only with the required functionality\
    \ of the microservice.\n\n# 4.5 Consumer-driven contract testing\n\nWhen developing\
    \ a microservice, you don't necessarily have real consumers of your service to\
    \ test. But if a service can be provided with details of what a consumer will\
    \ pass on a request, and what the expected response is, you can execute those\
    \ expectations against your real service to ensure that they meet. What better\
    \ way is to validate that your service's API works than a consumer specifying\
    \ what it's expecting for you to test with?\n\nConsumer-driven contract testing\
    \ uses this approach, as you're testing both a consumer and a provider to ensure\
    \ that proper information is passed between them. How do you do? Figure 4.2 shows\
    \ how to use a mock server to capture requests from a consumer, and return the\
    \ response that was defined for that request.\n\nBear in mind, the response returned\
    \ is what the developer of the consumer thinks should be returned. This expectation\
    \ can easily differ from the service's"
