  md: '# Summary


    First you need to ensure you have Minishift running, and that you''ve recently
    logged in with oc login. Authentications do expire! If all that''s done, you run
    the following:


    ```

    mvn clean install -Openshift, openshift-it

    ```


    Here you activate the profiles for openshift and openshift-it. But without the
    openshift profile being present, the admin service won''t be deployed to OpenShift!
    If the service successfully deploys and the tests pass, the terminal should show
    a Maven built without error.


    You''ve only scratched the surface of what''s possible with the fabric8 Maven
    plugin Minishift, but you have a solid foundation to begin exploring on your own.
    It''ll be a while before you use Minishift again, let''s stop it for now:


    ```

    minishift stop

    ```


    # 5.8 Additional exercises


    Here are additional exercises for you to grow your understanding of OpenShift
    and to improve the code for the example:


    +   - Modify the deployment of the admin service to PostgreSQL or MySQL when running
    on OpenShift.

    - Add test methods for CategoryResourceIT for creating a Category, and another
    that fails the name validation.


    If you take on these exercises and would like to see them included into the code
    for the book, please submit a pull request to the project on GitHub.


    # Summary


    +   - You can take advantage of immutable container images by choosing a PaaS
    that uses SaaS internally.

    - Minishift provides a cloud environment with OpenShift on your local machine,
    to simplify both the execution and testing of microservices without needing to
    provision lots of machines.

    - The fabric8 Maven plugin removes all the boilerplate needed to define resources
    and services within OpenShift or Kubernetes to reduce the configuration hurdles
    before seeing a microservice running in the cloud.'
