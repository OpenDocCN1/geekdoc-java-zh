  md: "# Developing a Spring Boot application\n\nReadingController is annotated with\
    \ @Controller in order to be picked up by component scanning and automatically\
    \ registered as a bean in the Spring application context. It is also annotated\
    \ with @RequestMapping to map all of its handler methods to a base URL of \"/\"\
    .\n\nThe controller has two methods:\n\n+   - readersBooks()--Handles GET requests\
    \ for /<reader> by retrieving a Book list from the repository (which was injected\
    \ into the controller's constructor) for the reader specified in the path. It\
    \ puts the list of Book into the model under the key books and returns readingList\
    \ as the logical name of the view to render.\n- addToReadingList()-Handles POST\
    \ requests for /<reader>, binding the data in the body of a Book object. This\
    \ method sets the object's reader property to the reader's name, and then saves\
    \ the modified Book via the repository's save() method. Finally, it returns a\
    \ redirect to /<reader> (which will be handled by the other controller method).\n\
    \nThe readersBooks() method includes by returning readingList as the logical name.\
    \ You must also create a view. I decided at the outset of this project that we'd\
    \ be using Thymeleaf to define the application views, so the next step is to create\
    \ a file named readingList.html in src/main/resources/templates with the following\
    \ content:\n\n# Listing 5 readingList.html\n\n```\n<html>\n<head>\n  <title>Reading\
    \ List</title>\n  <link rel=\"stylesheet\" th:href=\"@{style.css}\"></link>\n\
