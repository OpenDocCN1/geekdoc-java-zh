  md: '# Integration testing


    I''ve chosen Aquillian to help with integration testing because it assists in
    replicating a production environment as closely as possible without being in production.
    Your services are served in the same runtime container as would be the case in
    production, so your service has access to CDI injection, persistence, or whatever
    runtime pieces your service needs.


    To be able to use Aquillian for integration testing, you need to add the necessary
    dependencies to your pom.xml:


    ```

    <dependency>

    <groupId>io.thorntail</groupId>

    <artifactId>aquillian</artifactId>

    <scope>test</scope>

    </dependency>

    <dependency>

    <groupId>org.jboss.aquillian.junit</groupId>

    <artifactId>aquillian-junit-container</artifactId>

    <scope>test</scope>

    </dependency>

    ```


    The first dependency adds the runtime container for Thortail to be used within
    Aquillian tests, and the second adds the integration you require between Aquillian
    and JUnit. For Aquillian be able to deploy anything, it needs access to a runtime
    container. The aquillian dependency of Thortail registers itself with Aquillian
    as a runtime container, enabling Aquillian to deploy to it. Without either of
    these, you couldn''t execute your integration tests within a runtime container.


    To simplify the code required in your tests to execute HTTP requests, you''ll
    use REST Assured, which also needs to be added to your pom.xml:


    ```

    <dependency>

    <groupId>io.rest-assured</groupId>

    <artifactId>rest-assured</artifactId>

    <scope>test</scope>

    </dependency>

    ```


    The focus of your integration testing will be on the JAX-RS Resource class, as
    it defines the RESTful endpoints a consumer will interact with, as well as persisting
    changes to the database. With integration testing we focus on the provider side
