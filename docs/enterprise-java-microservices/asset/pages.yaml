    Figure 11.6 Current Cayambe hybrid monolith


    To properly support the model in figure 11.6, you want to be able to convert the
    database change events into records in Kafka for you to process. A solution has
    the least impact on the Admin microservice while still enabling you to consume
    its data. What you need is a connector for Kafka that can do this for you. Are
    any tools available that would make that possible? Why, yes, there are! Debezium
    is an open source project for streaming changes out of databases into Kafka.


    NOTE Debezium is a distributed platform for change data capture. You can start
    Debezium, point it at your databases source, and react to each insert, update,
    or delete''s on those databases in completely separate applications. Debezium
    allows you to consume database row-level changes, without any impact or changes
    to applications that perform those database updates directly. A huge benefit with
    Debezium is that any applications or services consuming the database changes can
    be taken down for maintenance without losing a single change. Kafka, ready for
    consumption when the services are available again. Full details on Debezium can
    be found at http://debezium.io/.'
