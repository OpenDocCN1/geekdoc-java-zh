  md: '# Network failures


    141


    +   - The entire network is secure from possible attack, external or internal.
    It''s naïve to ignore the possibility that malicious user, such as a disgruntled
    employee, could attempt to cause damage to an application. Likewise, a once-internal
    application can be easily exposed to threats by making it available without proper
    security vetting. Even an innocuous change in firewall rules for a port could
    make it unintentionally accessible.


    +   - Location and arrangement of computing devices on a network never changes.
    When networks are altered, and devices moved to different locations, the available
    bandwidth and latency can be diminished.


    +   - There''s a single administrator for everything. With multiple administrators
    for networks within an enterprise, conflicting security policies could be implemented.
    In this case, a client who needs to communicate across differently secured networks
    needs to be aware of the requirements to hold to successfully communicate.


    +   - Zero transport cost. Though the transport of physical data through a network
    may cost zero, it''s a nonzero cost to maintain a network after it''s built.


    +   - The entire network is homogeneous. In a homogeneous network, every device
    on the network uses similar configurations and protocols. A nonhomogeneous network
    can lead to the problems described in the first three points of this list.


    All these statements are known as the Fallacies of Distributed Computing (www.rgoarchitects.com/Files/fallacies.pdf).


    # 8.2 Network failures


    Though there are many ways a network can fail, in this section you''ll focus on
    network latency and time-outs. Previously, I mentioned zero latency as part of
    the Fallacies of Distributed Computing, which equates to no delay in making a
    request and having it acted upon.


    Why is latency important for your microservice? It affects almost anything your
    microservice might want to do:


    +   - Calling another microservice


    +   - Waiting for an asynchronous message


    +   - Reading from a database


    +   - Writing to a database


    Without being mindful of the existence of latency in your network, you''d presume
    that all communication of messages and data is near instantaneous, assuming the
    network devices involved in the communication are sufficiently close.'
