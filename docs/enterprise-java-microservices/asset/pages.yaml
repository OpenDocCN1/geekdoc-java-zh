    # 4.6 Additional reading


    As mentioned earlier, there are many other types of testing I won’t be covering.
    A couple of the critical ones are user acceptance testing and end-to-end testing.
    Though they are both crucial to ensuring that adequate testing is performed, they’re
    beyond the scope of this book I recommend they deal with a higher level of testing.
    For additional information on testing with microservices, I recommend Testing
    Java Microservices by Alex Soto Bueno, Jason Porter, and Andy Gumbrecht (Manning,
    2018).


    # 4.7 Additional exercises


    Here are some additional tests you could write to experiment with the testing
    methods, and also improve the code for the example!


    +   - Add a method to CategoryResourceTest that verifies the ability to update
    Category.


    +   - Add a method to CategoryResourceTest to verify that Category can be removed
    from the database successfully.


    +   - Add methods to AdminClient for retrieving all categories, adding a category,
    updating a category, and removing a category. Then add the request/response pairs
    in ConsumerPactTest.createPact() for the new methods, and update ConsumerPactTest.runTest()
    to execute and verify each of them.


    If you take on any of these exercises and would like to see them included in the
    code for the book, please submit a pull request to the GitHub.


    # Summary


    +   - Unit testing is important, but the need to test doesn’t end there. You need
    to test all aspects of a service as realistically as possible.


    +   - Aquillian is a great framework for simplifying more-complex testing that
    requires a runtime container to interact with and provide near-production execution.


    +   - The key to microservice testing is ensuring that the contract that a microservice
    defines, the API it exposes, is tested against not only what a microservice intends
    to expose, but also what a client is expecting to pass and receive.'
