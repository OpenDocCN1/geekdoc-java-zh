  md: '# Configuring application properties


    The application.properties file given to you by the Initializr is initially empty.
    This file is optional, so you could remove it completely without impacting the
    application. There''s also no harm in leaving it in place.


    You''ll definitely find opportunity to add entries to application.properties later.
    For now, if you want to poke around application.properties, try adding the following
    line:


    ```

    server.port=8000

    ```


    With this line, you''re configuring the embedded Tomcat to listen on port 8000
    instead of the default port 8080. You can confirm this by running the application
    again.


    This demonstrates that the application.properties file comes in handy for fine-grained
    configuration of the stuff that Spring Boot automatically configures. But you
    can also use it to specify properties used by application code.


    The main thing to notice is that at no point you explicitly ask Spring Boot to
    load application.properties for you. By the virtue of that application.properties
    exists, it will be loaded and its properties available for configuring both Spring
    and application code.


    # Spring Boot starter dependencies


    This section provides information about the Spring Boot starters and how they''re
    used.


    # Using starter dependencies


    To understand the benefit of Spring Boot starter dependencies, let''s pretend
    that they don''t exist. What kind of dependencies would you add to your build
    without Spring Boot? Which Spring dependencies do you need in order to support
    Spring MVC? Do you remember the group and artifact IDs for Thymeleaf, or any external
    dependency? Which version of Spring Data JPA should you use? Are all of these
    compatible?


    Uh-oh. Without Spring Boot starter dependencies, you have some homework to do.
    All you want is to develop a Spring web application with Thymeleaf that persists
    its data via JPA. But before you even write your first line of code, you have
    to figure out what needs to be put into the build to support your plan.


    After consideration (and a lot of copy-and-paste from another) application''s
    build has similar dependencies), you arrive at the following in your Gradle specification:


    ```

    compile(\org.springframework:spring-web:4.1.6.RELEASE")

    compile(\org.thymeleaf:thymeleaf-spring4:2.1.4.RELEASE")

    compile(\org.springframework.data:spring-data-jpa:1.8.0.RELEASE")

    compile(\org.springframework.hibernate-entitymanager:jar:4.3.8.Final")

    compile(\com.h2database:h2:4.1.187")

    ```'
