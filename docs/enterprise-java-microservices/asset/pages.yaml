  md: '#  preface

    Since the beginnings of developing a framework for Enterprise Java microservices
    at Red Hat, I''ve known it''s a critically important topic to disseminate to the
    wider developer community. Lots of useful information can be lost behind buzzwords,
    and a book was needed to present the information that developers need to get the
    job done.


    My sincerest hope is that Enterprise Java Micro-services succeeds at taking existing
    Enterprise Java developers on a path from traditional application development
    to developing microservices. It''s not always an easy road to travel, because
    moving from traditional development requires a different mindset, but my desire
    for this book is to provide that bridge of knowledge to help you take those initial
    steps into microservices.'
  merge: -1
