    \ pom.xml file like this:\n\n```\n<dependency>\n  <groupId>com.fasterxml.jackson.core</groupId>\n\
    \  <artifactId>jackson-databind</artifactId>\n  <version>2.4.3</version>\n</dependency>\n\
    ```\n\nMaven allows the closest dependency, meaning that because you've expressed\
    \ this dependency in your project's build, it will be favored over the one that's\
    \ transitively referred to by another dependency.\n\nSimilarly, if you're building\
    \ with Gradle, you can specify the newer version of Jackson in your build.gradle\
