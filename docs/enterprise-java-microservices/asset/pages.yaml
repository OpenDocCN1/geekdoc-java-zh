  md: '# Strangler pattern


    The Strangler pattern is based on the Strangler Application defined by Martin
    Fowler (www.martinfowler.com/bliki/StranglerApplication.html). Martin describes
    this pattern as a way to rewrite an existing system by gradually creating a new
    system at the edges of the existing one. The new system slowly grows over years,
    until the old system is transformed into nonexistence


    You may find a similar result to the Big Bang pattern—not necessarily a bad thing—but
    it''s achieved over a much longer span while still delivering business value in
    the interim. This approach significantly reduces the risk involved, compared to
    the Big Bang pattern. Through monitoring progress of the application over time,
    you can adjust how you implement microservices as you learn with each new one
    implemented. This is another huge advantage over the Big Bang pattern: being able
    to adjust and react to issues that might arise in processes or procedures. With
    a Big Bang approach, an enterprise is tied into its processes until everything
    has cutover.


    # Hybrid pattern


    Now you''ve seen both the Big and Strangler patterns, let''s look at the Hybrid
    pattern. I feel this pattern will become the predominant pattern for enterprises
    migrating to and developing microservices.


    This pattern begins in a similar fashion to the Strangler. The difference is that
    you never fully lose the original functionality within a monolith and integrate
    with new microservices. Figure 1.7 shows the path of a request through an existing
    Java monolith and a new microservices architecture:


    +   1 A user makes a request from a browser specifying which view of an application
    they wish to see.

    2 The view calls out to a controller to retrieve whatever information might be
    required to construct itself.

    3 The controller calls a business service, possibly to aggregate data from different
    sources.

    4 The business service passes the request into the microservices environment,
    where it enters the gateway.

    5 The gateway routes the request to the appropriate microservice based on routing
    rules that have been defined.

    6 A microservice receives the request and performs some of its processing on it
    before calling another microservice.

    7 The last microservice in the chain interacts with the data storage layer to
    read/write records.


    An architecture such as that in figure 1.7 provides a great deal of flexibility
    for growth and delivering business value in a timely fashion. Components that
    require high performance and/or high availability can be deployed to the microservices
    environment.'
