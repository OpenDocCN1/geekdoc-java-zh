  md: '# Data streaming with Apache Kafka


    # This chapter covers


    +   - Understanding data streaming with Apache Kafka

    - Using data streaming to simplify an architecture

    - Incorporating data streaming into the Cayambe hybrid


    In chapter 10, you put together the Cayambe hybrid, combining the slimmed-down
    monolith with your new microservices. This chapter simplifies the access of administration
    data in the Cayambe hybrid by switching it to use data streaming.


    First you will learn about data streaming and how it can benefit developers and
    architects alike. Taking those lessons, you''ll develop a data-streaming solution
    for the Cayambe hybrid from the previous chapter, completing the journey from
    monolith to hybrid.


    # 11.1 What can Apache Kafka do for you?


    Before delving into Apache Kafka, the solution you''re going to use for recording
    and processing data streams, you need some background on data streaming. Otherwise,'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'what Apache Kafka does and how it works will be completely foreign to you as
    an Enterprise Java developer.


    # 11.1.1 Data streaming


    Data streaming doesn''t refer to what Netflix gets its movies to play on all your
    devices. It refers to a continuously generated stream of data from potentially
    thousands of sources; each piece of data, or record, is small in size and is stored
    in the sequence that it received. That may seem a lot of buzzwords, but data streaming
    is still relatively new, and new ways to use it are always being conceived.


    What kinds of data apply to data streaming? In a nutshell, pretty much any type
    of data could be useful in the context of data streaming. Common examples include
    measurements from vehicle sensors, real-time price from the stock market, and
    trending topics from social networks and sites.


    A common case for data streaming occurs when you have a lot of data, records,
    and you want to analyze it for patterns or trends. It may well be that large amounts
    of the data can be completely ignored, and only key pieces of data are pertinent.
    It''s also possible for the same set of data records to have different purposes,
    dependent on which system is consuming! For instance, an e-commerce site captures
    its page-view events can use the same data not only to record the number of pages
    a user visits before purchasing, but also to analyze the number of each page getting
    across all users. This is the beauty of data streaming: you can solve different
    problems with the same set of data.


    Figure 11.1 illustrates how data is received as a stream.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_228_0.png)


    Figure 11.1 Data-streaming pipes


    The data for a particular type is received from potentially many sources, and
    is added to the end of the stream, or pipe, in the order it was received by the
    system that''s responsible for recording the data stream. There''s no concept
    of inserting a particular record at a given point in the stream. Everything is
    added to the end as it''s received.


    Though you have several options for recording and processing data streams, for
    this chapter you''ll focus on Apache Kafka, so let''s take a look at it now.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# What can Apache Kafka do for you?


    DEFINITION To clarify the terminology used throughout this chapter, the terms
    data streaming, data streams, and streaming all refer to the same thing: the process
    of streaming data from a source for capture.


    # 11.2 Apache Kafka


    Apache Kafka (https://kafka.apache.org/) was originally developed by LinkedIn
    in 2010 to be the core for its data center pipeline. Currently, the pipeline processes
    upward of 2 trillion messages a day! In early 2021, Kafka was proposed as an open
    source project at Apache, and it moved out of the incubation phase in late 2012.
    In the space of a few years, many enterprises are using Apache Kafka, including
    Apple, eBay, Netflix, Spotify, and Uber.


    What is Apache Kafka? It''s a distributed streaming platform. What do I mean by
    distributed here? Kafka can partition data from a single stream across servers
    within a cluster. In addition, each partition is replicated across servers for
    fault tolerance of that data.


    There are many ways to configure Apache Kafka, in terms of how it''s distributed
    and its level of fault tolerance, but those topics are beyond the scope of this
    chapter. For full details, take a look at the Kafka documentation at https://kafka.apache.org/documentation/.


    As a streaming platform, the key capabilities that Apache Kafka provides are as
    follows:


    +   - Publish and subscribe to records.

    - Store streams of records in a fault-tolerant, durable manner.

    - Process streams of records as they happen.


    At its core, Apache Kafka is a distributed commit log: it doesn''t notify a piece
    of data has been recorded in the stream until it''s committed to the log. Being
    distributed, as mentioned before, refers each commit in the log, or stream, being
    across partitions and replicated.


    Another way of describing Apache Kafka is as a database with no clothes: the clothes
    are at the forefront and not hidden. Databases, at their core, use a commit log,
    as Apache Kafka does, to track changes and as a means of recovering from server
    failures to constitute the database. With Apache Kafka, the clothes of the database
    (tables, indices, and so forth) have been stripped away, leaving just the commit.
    This makes Kafka infinitely more concise and accessible than regular databases.


    Apache Kafka also uses semantics that are familiar to Enterprise Java developers
    who have integrated with messaging systems. There are producers, who generate
    records or events that are added to the stream, equal to the multiple sources
    present in figure 11.1. Each stream of records is referred to as a topic, and
    anything that reads from the stream is a consumer. Figure 11.2 shows how producers
    and consumers integrate with Apache Kafka.


    In addition, connectors enable databases, or other systems, to be sources of records
    being sent to Apache Kafka. Finally, stream processors have the ability to stream
    records'
