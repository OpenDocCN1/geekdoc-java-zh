  md: 'Continuous integration and delivery, referred to as CI/CD, are key tools in
    facilitating a short release cadence. Why? They enable developers to find bugs
    earlier in the process in an automated manner. But more important, CI significantly
    reduces the amount of time between determining that a piece of code is ready for
    production and having to lift it. If a release process takes a day or two to complete,
    that isn''t conducive to releasing multiple times a day or even once a day.


    Another important benefit of CI/CD is the ability to be more incremental in delivering
    functionality. The goal isn''t just to be physically release code faster; being
    able to deploy smaller pieces of functionality is crucial for minimizing risk
    as well. If a small change reaches production that produces a failure, backing
    out that change is a relatively easy task.


    # Patterns for migration to microservices


    You''ve looked at Enterprise Java with its existing monoliths and you''ve learned
    about microservices in a distributed architecture. But how do you get from one
    to the other? This section delves into patterns that can be applied to the problem
    of splitting an existing monolith into multiple microservices.


    # Domain-Driven Design


    Domain-Driven Design (DDD) is a set of patterns and methodologies for modeling
    our understanding of the domains in our software. A key part of this is the Bounded
    Context pattern (https://martinfowler.com/bliki/BoundedContext.html), which enables
    you to segregate parts of the system to be modeled at a single time.


    This topic is far too broad to be covered in a few paragraphs in this book, especially
    because many books are already dedicated to DDD. But we''ll cover it briefly here
    as another piece in the puzzle of developing with greenfield microservice development
    and in migrating to microservices. DDD can be used both in large application or
    system that can be divided into multiple Bounded Contexts, enabling design and
    focus to the core domain of a Bounded Context at any point. This pattern acknowledges
    that it''s difficult to come up with a domain model for an entire enterprise at
    any time, because many complexities exist. Dividing such a model into manageable
    Bounded Contexts provides a way to use a portion of that without concerning yourself
    with the remainder of the, largely unknown, domain model. Figure 1.5 is an example
    to help you understand the concepts behind DDD.


    Say you have a team wants to develop microservices, and their domain model consists
    of an Order, items within an order, a product, and a supplier of that. The current
    domain model combines different ways a Product can be defined. From the perspective
    of an Order, it doesn''t care who supplies the product, how many are currently
    in stock, what the manufacturer price is, or any other information that''s relevant
    to only the administration of the business. Conversely, the administration side
    isn''t necessarily concerned with how many orders a product may be associated
    with.'
