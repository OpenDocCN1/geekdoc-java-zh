- img_proc: true
  md: 'There''s nothing wrong with using a CaS directly, as Kubernetes, but there
    are benefits of using a PaaS on top. One main benefit is a nice UI to visualize
    what''s deployed. Because of its simplicity in setting up, and wanting to use
    a PaaS over a CaS, we will use Minishift to create our local cloud environment.


    # 5.4 Deploying to the cloud


    Quite separate the service model that the cloud could offer, there are also three
    deployment models that the cloud could use:


    +   - Private cloud—A cloud that''s solely for the use of a single enterprise,
    which is usually hosted internally.

    - Public cloud—Services within the cloud are available over a public network.
    The main difference between this and a private cloud relates to security. Whether
    a microservice or database, they need to have more stringent security services
    because these services are accessible on a public network.

    - Hybrid cloud—A combination of public and private clouds. It''s possible that
    each of these clouds could use different providers. The hybrid cloud deployment
    model is quickly becoming the most common, as it provides the best of both worlds,
    especially when wanting to ramp up capacity and scale.


    Minishift, in essence, gives you your own cloud instance running on your local
    machine. The PaaS within Minishift, OpenShift, is the same PaaS that would be
    used in a public cloud or hybrid cloud. The difference is it''s running locally.


    Whether you''re using a cloud for microservices, a monolith, or anything else,
    the way a deployment is pushed to the cloud is no different. The only difference
    might be that a microservice is more likely to have a CI/CD process that automatically
    releases into production. It''s more likely that a deployment of a monolith will
    require greater coordination than an automatic deployment.


    # 5.5 Starting Minishift


    The first thing you need to install is Minishift on your local machine. Head over
    to http://mn.bz/vw6g and follow the instructions to install the necessary prerequisites,
    if they aren''t already installed, and then install Minishift.


    > The examples have been tested with Minishift 1.12.0 and OpenShift 3.6.1.


    After Minishift is installed, open a terminal window and start it with the default
    settings:


    ```

    minishift start

    ```


    By default, this gives you a virtual machine with two virtual CPUs, 2 GB of RAM,
    and 20 GB of hard drive space for it. The terminal provides details of what Minishift
    is doing as it starts, including which version of OpenShift Origin is being installed.
    After the'
