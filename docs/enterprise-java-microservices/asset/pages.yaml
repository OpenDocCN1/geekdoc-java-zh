  md: '# What is the cloud anyway?


    The cloud, and computing, have been present in software engineering for decades.
    These terms are generally used in reference to a platform for distributed computing.
    It wasn''t until the early-1990s that their use became more prevalent.

    Some of the benefits of the cloud are as follows:


    +   - Cost efficiencies—Cloud providers provide large enterprises to use their
    services as a measure of CPU time that''s spent. This significantly reduces the
    overall cost of running the environments compared to physical machines.

    - Ability to scale—Cloud providers provide ways to scale up and down individual
    services as required, ensuring that you never have too much or too little capacity.
    spread of information can occur quickly, thanks to social media, so being able
    to immediately scale up identical instances to handle immediate short-term load
    is crucial. How quickly can an enterprise scale up when it takes months to purchase
    and provision just one machine? In such a situation, the cloud provider will provide
    scale by replicating instances with identical configuration of memory, CPU, and
    so.

    - Freedom of choice—If you are an enterprise that develops only in Java, because''s
    what your operations knows how to manage, how do you experiment with new programming
    languages as Node.js or Go? Cloud brings additional languages to your fingertips
    like never before. You don''t need to have internal experience maintaining environments
    for new languages; that''s what a cloud provides for!


    # Service models


    Figure 5.1 shows the multiple types of service models for the cloud, along with
    where an application fits within that. In this illustration, an application has
    code on the server. If you have an application that''s purely mobile or browser
    based interacts with one or more services via Software as a Service (SaaS), it''s
    still an application, but not an application as depicted here. In this context,
    an application could be an executable JAR, or a WAR or EAR deployed to an application
    server.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_100_0.png)'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Service models


    Let''s briefly describe each of these:


    +   - Infrastructure as a Service (IaaS)—Provides an abstraction over network
    infrastructure that includes computing resources, data partitioning, scaling,
    and backup. IaaS usually involves a hypervisor that runs virtual machines as guests.
    To use an IaaS requires constructing a virtual machine that could be deployed
    to the environment. Well-known IaaS providers are Amazon Web Services, OpenStack,
    Google Compute Engine, and Microsoft Azure.

    - Platform as a Service (PaaS)—Forms a layer above IaaS to provide a development
    environment that includes an operating system, an execution environment for various
    programming languages, databases, and web servers. A PaaS saves a developer from
    needing to purchase, install, and configure hardware and software to have an environment
    for deploying an application. Popular PaaS providers include Red Hat OpenShift,
    Google App Engine, IBM Bluemix, Cloud Foundry, Microsoft Azure, and Heroku.

    - Software as a Service (SaaS)—Provides common pieces of applications, sometimes
    entire applications, as an needed or on-demand basis. SaaS is usually charged
    on a per use basis. SaaS can vary from a niche service, with everything related
    to marketing, to an entire suite of SaaS to manage a business from beginning to
    end. Many SaaS providers exist, and more are cropping up every day. Some well-known
    ones are Salesforce, Eloqua, NetSuite, and Cloud9.


    Over the last couple of years—the rise of containers, and in particular the popularity
    of Docker as a container solution—a new layer has been created in cloud service
    models.


    5.2 introduces Containers as a Service (CaaS) as a new foundation for PaaS providers.
    SaaS takes advantage of container technology, such as Docker, to simplify the
    deployment, scaling, and management of multiple applications or services.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_101_0.png)


    Figure 5.2 Service models in the cloud with containers'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'Containers allow you to package any application or service into its own operating
    system environment, with whatever custom software or configuration might be required,
    while also being able to reduce the size of the image that''s generated compared
    to traditional virtual machines.


    The other major advantage to CaaS, and containers in general, is their immutable
    nature. When a container image is derived from a particular version of that container,
    updating that container in any way requires a new container image and version
    to be built. Mutable deployments have been long since replaced by deploying immutable
    and potentially break application. Immutable containers can then be sent through
    CI/CD processes to verify that the container performs as expected before being
    released in production.


    Currently, the most popular CaaS provider is Kubernetes. Kubernetes was created
    by Google and was heavily influenced by how it managed containerized applications
    internally. Previous PaaS providers already have shifted to built on top of a
    CaaS, and in particular Kubernetes. Red Hat OpenShift is one such PaaS that now
    takes advantage of Kubernetes as its CaaS.


    CaaS is the best way to manage deployments, but you don''t always want something
    that low level. Generally, our ideal environment is a PaaS that''s built on top
    of a CaaS, as with with Red Hat OpenShift.


    # 5.3 Cloud native development


    You may have heard the term cloud native development, but new terms are always
    cropping up, so it doesn''t hurt to clarify the definition. Cloud native development
    is the process of developing an application for deployment to cloud environments,
    where one can take advantage of loosely coupled cloud services.


    Shifting to this type of development requires an alteration in mindset when developing,
    as you''re no longer concerned with the details of external services that an application
    requires. All you need to know is that there will be a service, such as a database,
    available to your application in the cloud, and which environment variables you
    might require to connect with it.


    You can also look at cloud native development from another angle, that abstracts
    away what your application or service requires to function correctly. Cloud native
    development allows the developer to expend effort on things that add business
    value, by focusing on building business logic and not plumbing code.


    Though not with most cloud providers, the idea of a service catalog is being introduced
    into Kubernetes for just this purpose. A service catalog provides a definition
    of services that can be connected to the cloud, along with the environment variables
    that are required to connect with them. It''s possible for a service to specify
    criteria about an external service it needs to connect to. Criteria could include
    database and postgresql, which would translate into a PostgreSQL database instance
    from the service catalog.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Cloud native development


    This concept isn''t much different from providing environment-specific configuration
    for databases, as we''ve done for many years. But as work on the service catalog
    continues, we may reach a point where an application connecting to an external
    service through specific environment variables is no longer needed. A database
    client may be injected into a service, with configuration already set by the service
    catalog.


    Cloud native development sounds great, but how can you quickly test and debug
    your service if you have to deploy it to the cloud every time? Won''t that slow
    your development speed? deploying to the cloud for every code change to see the
    impact would likely slow development speed, if only marginally, and possibly more.


    But if you can bring the cloud, or something as near as to the cloud used for
    production, onto your local development machines? That would certainly speed up
    the round-trip time from code change to see it in action. Cloud providers offer
    such a thing? Some of them do!


    Minikube was the first to offer a single-node Kubernetes cluster that could be
    running on your local machine. All that''s required is a virtual environment,
    such as VirtualBox, Hyper-V, or xhyve required on your machine that can be used
    by Minikube to create a virtual cluster on your machine.


    Since Minikube formed, Minishift was founded to extend Minikube with a built-in
    PaaS of a single-node OpenShift cluster. Minishift uses the upstream of OpenShift,
    OpenShift Origin, as the PaaS. Revisiting a CaS fits into service models, figure
    5.3 shows Minishift provides.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_103_0.png)


    Figure 5.3 What Minishift provides'
  merge: -1
