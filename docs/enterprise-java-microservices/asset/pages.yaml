  md: 'In previous chapters, you''ve seen how to access separate microservices directly
    by referring to the URL where a microservice is running. In this chapter, you''ll
    take calling microservices a step further by decoupling your client from the microservice''s
    consuming, making it easier to scale.


    Unless you''re developing a microservice for your own use, it''s virtually guaranteed
    that you''ll need the ability to scale the number of instances of your microservice
    in production. Without the ability to scale, your application will always have
    problems coping with the load upon it.


    # 7.1 Why does a microservice need to be discovered?


    Taking the approach to microservices from chapter 6, the new Payment microservice
    would locate Stripe via a hardcoded URL, as shown in figure 7.1.


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_134_0.png)


    This approach is perfectly fine for local testing of microservices, to make sure
    they do what you want, but you don''t want to be relying on locating microservices
    with hardcoded strings in production! The operational nightmare of moving a single
    instance of a microservice from one environment to another would require any of
    its clients being rebuilt to use the new URL location of the microservice! That''s
    not conducive to delivering business value in a timely manner. That''s not even
    taking into account the desire to have more than one instance of a microservice
    available for handling requests to better scale an application.


    If you keep relying on hardcoded URLs, your Payment microservice would contain
    an ever-growing list of possible instances for Stripe to distribute its requests
    across, as shown in figure 7..


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_134_1.png)'
