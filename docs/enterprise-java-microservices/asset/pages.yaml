    # 3.2.5 Thorntall—the most flexible JeAS runtime


    Thorntall was born out of the desire to take advantage of the modularization within
    the WildFly application server. That enables different groups of modules to be
    gathered and installed into the server for use. This enables Thorntall to be the
    most flexible JeAS runtime available for Java EE. Choosing a single piece of Java
    functionality to use with your application is now super simple.


    Thorntall defines each dependency that can be included by your application, such
    as JPA, JAX-RS, and most parts of Java EE. In addition to Java EE dependencies,
    Thorntall provides dependencies for libraries that can assist with developing
    Enterprise microservices such as Swagger, Keycloak, and other frameworks and libraries.


    If you''re unsure of what Thorntall dependencies might be needed by your application,
    you have a couple of options. You can generate a skeleton project by visiting
    http://wildfly-swarm.org/generator and selecting the types of functionality that
    you need for your microservice. There are options for Java EE features and non-Java
    EE features such as Eclipse MicroProfile, Hibernate Search, fault tolerance, and
    security, to name a few.


    The other option for developing your Thorntall application, if you''re unsure
    of what dependencies you need, is to add the Maven plugin to your pom.xml and
    Auto Detect your application code to determine which APIs are being used, and
    therefore which dependencies are required. This is usually the simplest means
    of using Thorntall, especially when converting from an existing Java EE application;
    it allows the rest of the application to remain the same because you added only
    a new plugin into pom.xml.


    Though Auto Detect is for getting started, it means the plugin is a bit slower
    to package an application than specifying dependencies directly.'
