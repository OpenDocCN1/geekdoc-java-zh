    # Summary


    +   - An microservice consists of a single deployment executing within a single
    process.

    - An Enterprise Java monolith is an application in which all its components are
    contained within a single deployment.

    - An Enterprise microservice is a microservice developed using Enterprise Java
    frameworks.

    - An Enterprise monolith isn''t suitable for a fast release cadence.

    - Implementing microservices isn''t a silver bullet and requires additional consideration
    to implement successfully.

