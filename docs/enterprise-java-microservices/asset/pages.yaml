  md: "dependency versions, exclude transitive dependencies, and certainly specify\
    \ dependencies for libraries not covered by Spring Boot starters.\n\nFor example,\
    \ consider Spring Boot's web starter. Among other things, the web starter directly\
    \ depends on the Jackson library. This library is helpful if you're building a\
    \ REST service that consumes or produces resource representations. But if you're\
    \ using Spring Boot to build a more traditional human-facing web application,\
    \ you may not need Jackson. Even though it shouldn't hurt anything, you can trim\
    \ the fat off your build by excluding Jackson as a transitive dependency.\n\n\
    If you're using Gradle, you can exclude transitive dependencies like this:\n\n\
    ```\ncompile(\"org.springframework.framework:spring-boot-starter-web\") {\n  exclude\
    \ group:\"com.fasterxml.jackson.jackson.core\"\n}\n```\n\nIn Maven, you can exclude\
    \ transitive dependencies with the <exclusions> element. The following <dependency>\
    \ for the Spring Boot web starter has <exclusions> to keep Jackson out of the\
    \ build:\n\n```\n<dependency>\n  <groupId>org.springframework.boot</groupId>\n\
    \  <artifactId>spring-boot-starter-web</artifactId>\n  <exclusions>\n    <exclusion>\n\
    \      <groupId>com.fasterxml.jackson</groupId>\n    </exclusion>\n  </exclusions>\n\
    </dependency>\n```\n\nConversely, having Jackson in the build is fine, but you\
    \ want to build against a different version of Jackson than the web starter references.\
    \ Suppose that the web starter references Jackson 2.3.4, but you'd use version\
