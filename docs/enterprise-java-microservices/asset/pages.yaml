  md: 'were, for most part, enhancing existing applications. From that day, Enterprise
    Java applications became a legacy burden on enterprises by virtue of the maintenance
    work required—not because of a flaw or deficiency in Java, though there have been
    several, not because developers aren''t the best at architecting changes to existing
    applications and systems. This is complicated for enterprises that have hundreds
    of architects and developers pass through their doors, bringing their own preferences
    and patterns to extending existing applications.


    NOTE I am not sitting in an ivory tower disparaging values. Many times I''ve made
    decisions about how a feature should be implemented without fully grasping functionality—not
    through any intent or malice, but because those who wrote the code are no longer
    employed at the enterprise and further can''t be asked about the code, and because
    documentation may be lacking or unintuitive. Such a situation means developers
    are left to make a judgment call as to or not they understood the existing system
    sufficiently to make modifications. Through in some deadline pressure management,
    and such a situation becomes fraught with problems.


    Over time, many Enterprise applications diverged from the clean architecture shown
    in figure 1.1 and became a mess of spaghetti closely resembling figure 1.2. In
    figure 1.2 you can see how clear boundaries between functionality within a layer
    have blurred, resulting in components in each layer longer having a well-defined
    purpose.


    This situation is many enterprises find themselves today. Only a few applications
    fit this mold, but this of spaghetti is a problem that must be solved in order
    for an application to foster future development without significant costs incurred
    each time.


    # 1.1.3 What is a monolith?


    What defines an Enterprise Java application as a monolith? A monolith is an application
    that has all components contained within a single deployment, and that typically
    has a release cadence of 3-18 months. Some applications may have a release cadence
    of two years, which doesn''t make for an agile enterprise. Monoliths typically
    evolve over time from attempts to make quick iterative enhancements to an application,
    without any concern for boundaries between different parts, or components, within
    it. Indicators of an application being a monolith can include the following:


    +   - Multiple WARs that are part of a single deployment, due to their intertwined
    behavior

    - EARs that contain potentially dozens of other WARs and JARs to provide all the
    necessary functionality


    Is figure 1.2 a monolith? Most certainly it is, and an extremely bad one, because
    of the blurring of functional separation between components.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Enterprise Java—a short history 7


    ![](img/d166e73dc5b37ac6ba449ba856b8eebf_23_0.png)


    Figure 1.2 Enterprise Java spaghetti


    Why do the preceding factors make an application a monolith? A single deployable
    for an application is perfectly fine when you have a small footprint, but when
    you potentially have thousands of classes and dozens of third-party libraries,
    an application becomes infinitely more complex. Testing even minor change to the
    application would require large amounts of regression testing to ensure that no
    other part of the application was impacted. Even if the regression testing were
    automated, it''d still be a mammoth task.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Whether an application is a monolith is also determined in part by its architecture.
    Classifying as a monolith isn''t based on the size of the application, or the
    size of the runtime used to execute the monolith. It''s all about how that application
    has been architected with respect to the components within it.


    Release cadence is a forcing function for enterprises. If an application is released
    only every 3–18 months, the business (unknowingly or not) will focus on larger
    features that take significant time to develop. No incentive exists for a minor
    tweak that could be made and released in a few hours, or days, even when the simplest
    change would reach production for.


    Release cadence dictated by the time to develop and test changes has a direct
    impact on the ability of an enterprise to be agile and respond to a changing environment.
    For instance, if a competitor to begin selling the same widget as your enterprise
    for 15% less than you, can you react? Taking several months to make a simple change
    to reducing the price of a product could have disastrous consequences for the
    bottom line. If that widget the biggest seller, and the enterprise was unable
    to compete on price for three months, it may be on the verge of going out of business
    by the time a change was released.


    Along release cadence


    Though it appears that monolithic Java applications are all gloom and doom, is
    that really the case? In many situations, it makes sense for an enterprise to
    continue with, or develop, a monolith. How do you know if you should stick with
    a monolith?


    +   - Your enterprise may have only a few applications that actively develops
    and maintains. It may not make sense to significantly increase the development,
    testing, and release burden when you have so few applications.

    - If the development team has a dozen people, splitting them into one- or two-person
    teams for microservices may not provide any benefit. In some cases, that split
    will be detrimental. Basecamp (https://basecamp.com/) is a perfect example of
    a monolith that is the way it is, developed by a team of 12.

    - Does your enterprise need multiple releases a a week, or even a day? If not,
    and the existing monolith has a clear separation of components, reducing the release
    cadence may be all that''s required to derive increased business agility and value.


    Whether staying with a monolith is the right thing for an enterprise varies, depending
    on the current circumstances and the long-term goals.'
