    # What experts say about this book!


    With rapidly changing technologies, IT professionals need to constantly update
    their credentials riding the latest technology trends. The new edition of “Core
    Java Interview Questions You’ll Most Likely Be Asked” is a perfect companion to
    enhance the interview skills for Java programmers and developers to build their
    IT careers. In addition to the standard core Java questions and answers, this
    edition includes the questions about functional interfaces and lambda expressions
    of Java 8 plus modules and stream of Java 9\. The human resource questions and
    answers would prepare the IT professionals to nail the interviews and impress
    the employers. With real life scenario-based questions, this book features the
    concise information required for the working professionals to strategize and stand
    out in today’s competitive job market.


    – David Han


    Ph.D.Associate Professor of Management Science and Statistics, University of Texas
    at San Antonio


    I work closely with students especially for their placements. This book will really
    help students to prepare as well as practice interview questions. No doubt, this
    is going to be a real guide for the job aspirants. Indexing is good and easy to
    understand. Almost all probable mutations are included in the book. Difficulty
    level is from easy to difficult which is suitable for all kinds of Java related
    jobs.


    – Yogesh Jadhav


    Professor & Training and Placement Officer, Sinhgad Institutes


    Excellent list of questionnaires. Core Java Interview Questions book from Vibrant
    Publishers will be very useful for job aspirants in Java technology. It includes
    HR questions too. Many job aspirants are not clear about the HR round, so it is
    very nice to have HR questions in the book. This book will help freshers and junior
    level aspirants of Java jobs a lot. My final review is that it will be very helpful
    for fresher level and experienced candidates looking for MNC Placements.


    – Shashikanth K


    Placement Coordinator & Associate Professor at CSE Department


    I really liked the way each and every part of Java is touched in the book. Plus,
    the in-detail explanation along with snippet code examples makes it more clear
    and easy to understand.


    – Barkat Amirali Jiwani


    Assistant Professor/Placement Head, Vaagdevi College of Engineering, Warangal


    # Contributor to this Book


    ![](images/7-1.jpg) **Reshma Bidikar** is a passionate Java engineer and educator.
    With over 16 years in the IT industry working as a Senior Java Developer/Architect,
    she has worked in technologies like Core Java, Spring, Spring Boot, Hibernate,
    REST, JDBC to name a few. She is an expert Java Trainer/Java Writer and her Java
    articles/tutorials/courses have helped thousands of students/readers worldwide.
    She specializes in combining her extensive Java knowledge with her ability to
    explain complex concepts in easy to understand language. She has a Bachelor of
    Engineering Degree in Computer Science. Outside of work, she is an avid reader
    and a zealous blogger.


