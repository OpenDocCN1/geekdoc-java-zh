    try {\n    // 需要监控异常的代码\n} catch (ExceptionType 1) {\n    // 发生异常时遵循的指令\n} catch\
    \ (ExceptionType 2) {\n    // 发生异常时遵循的指令\n} catch (ExceptionType n) {\n    //\
