    \ shapeDrawer = new Triangle(); //Line 1\n        shapeDrawer.draw(); //Line 2\n\
    \    }\n}\n```\n\nAnswer:\n\nThe above code is valid. This code declares an interface\
    \ `ShapeDrawer` and a class `Triangle` that implements this interface. Line 1\
    \ declares a variable of type `ShapeDrawer` and assigns it an object of type `Triangle`.\
    \ This is valid, you can assign an object of a class that implements an interface\
    \ to a variable of the interface type. Line 2 then invokes the `draw` method.\
    \ This executes the code in the `Triangle` class.\n\n### 109. Which lines in the\
    \ following code will cause a compilation error?\n\n```java\npublic interface\
    \ MyInterface {\n    private static int FIELD1 = 7; //Line 1\n    int FIELD2 =\
    \ 8;//Line 2\n    public final int FIELD3; //Line 3\n    public static int FIELD4\
    \ = 8; //Line 4\n}\n```\n\nAnswer:\n\nIn the above code, Lines 1 and 3 will cause\
    \ a compilation error. All the fields declared in an interface need to be `public`,\
    \ `static`, and `final`. If the `public` `static` and `final` keywords are not\
    \ specified, the field is implicitly made `public` `static` `final`. Line 1 explicitly\
    \ specifies the `private` keyword and so causes a compilation error. Line 2 does\
    \ not have the `public` `static` `final` keywords specified. However, this does\
    \ not cause a compilation error, Java implicitly makes the field `public`, `static`\
    \ and `final`. Line 3 specifies the `public` and `final` keyword but does not\
    \ initialize the field. A `final` field needs to be initialized. So, Line 3 causes\
    \ a compilation error as well. Line 4 specifies the `public` and `static` keywords\
    \ and initializes the field. It does not specify the `final` keyword. However,\
    \ this again does not cause a compilation error, the field is implicitly treated\
    \ as `final`.\n\n### 110. Is the code snippet below valid? Explain.\n\n```java\n\
    public abstract class MyAbstractClass {\n    private abstract void doSomething();\n\
    }\n```\n\nAnswer:\n\nThe above code is invalid and causes a compilation error\
