    268. What are some of the improvements made by Java 9 on the Stream Interface?


    Answer:


    The following are some of the improvements made by Java 9 on the Stream interface:


    a. Stream.ofNullable: Java 9 has added a Stream.ofNullable() method on the Stream
    interface. This helps to create a Stream with a value that may be null. So, if
    a non–null value is passes to this method, it creates a Stream with that method,
    otherwise it creates an empty stream.


    b. takeWhile, dropWhile: Both the takeWhile() and dropWhile() methods operate
    on a Stream. They can be used to obtain a subset of the input Stream.


    c. Stream.iterate: Java 9 has added an overloaded version of the Stream.iterate()
    method that accepts a Predicate and terminates the Stream when the condition specified
    by the Predicate is true.


    269. Is the code below valid? If not, what can be done to fix it?


    Stream<String> strStream = Stream.of(null);


    strStream.forEach(str–> System.out.println(str));


    Answer:


    The code above is valid and does not cause any compilation error. However, when
    it is executed, it will cause a NullPointerException. This is because you cannot
    create a Stream with a null value using the Stream.of() method. In order to fix
    the code above, you need to make the following change:


    Stream<String> strStream = Stream.ofNullable(null);


    strStream.forEach(str–> System.out.println(str));


    Java 9 had added the ofNullable() method to the Stream interface that helps you
    create a Stream with a **null** value. So, the code above does not cause a NullPointerException.


