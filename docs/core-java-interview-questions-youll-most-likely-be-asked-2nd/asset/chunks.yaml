    `Optional<Integer> number;`


    So here, `number` is an `Optional` of type `Integer`. It may or may not contain
    a value.


    Optionals were added by Java 8 to avoid the boilerplate code associated with null
    checks. Sometimes, a method may return a null. This can result in a `NullPointerException`.
    In order to avoid the exception, the code that invokes the method needs to have
    explicit null checks. This can make the code difficult to read. Java 8 `Optionals`
    help to avoid this boilerplate code. So instead of having an explicit null check,
    an optional can be used. If the value is present it can be retrieved.


    ### 248. How can an Optional be created?


    **Answer:**


    There are some static methods on the `Optional` class which can be used to create
    an `Optional`. These are as follows:


    a. `Optional.isEmpty`– This creates an empty `Optional`, that is an `Optional`
    without a value as shown below:


    ```java

    Optional<Integer> number = Optional.empty();

    ```


    b. `Optional.of`– This creates an `Optional` with a particular value as shown
    below:


    ```java

    Optional<Integer> number = Optional.of(10); //creates Optional with the value
    10

    ```


    c. `Optional.ofNullable`– This creates an `Optional` with either a null or a non–null
    value as shown below:


    ```java

    Optional<Integer> number = Optional.ofNullable(10); //creates Optional with the
    value 10

    ```


    It can also be used to create an `Optional` with a null value as follows:


    ```java

    Optional<Integer> number = Optional.ofNullable(null);

    ```


    ### 249. Explain the Optional.ifPresent method with a code sample.


    **Answer:**


    The `Optional.ifPresent` method performs an operation on the value in the `Optional`
    if it is present. The operation to be performed is specified as a `Consumer` instance.
    If the `Optional` is empty, it does not do anything. The following code demonstrates
    this:


    ```java

    Optional<String> strOptional = Optional.of("Test");

    strOptional.ifPresent(str-> System.out.println(str.toUpperCase()));

    ```


    This code creates an `Optional` `strOptional` corresponding to the value `Test`.
    The `ifPresent` method is then invoked with a lambda expression that converts
    the value in the `Optional` to uppercase and prints it. So, this code prints the
    following output:


    TEST


    In case, the input `Optional` is empty, the `ifPresent()` method does not do anything.


    ### 250. What is the difference between the orElse and orElseThrow method?


    **Answer:**


    Both the `orElse()` and `orElseThrow()` are methods on the `Optional` class. If
    a value is present in the `Optional`, they return the value. They differ in what
    happens when a value is not present in the `Optional`.


    The `orElse()` method accepts as parameter a value and returns this value if invoked
    on an empty `Optional`. The following code demonstrates this:


    ```java

    Optional<String> strOptional1 = Optional.empty();

    String strValue1 = strOptional1.orElse("Default");

    ```


    Here, since `strOptional1` is an empty `Optional`, the `orElse()` method returns
    the value `Default`.


    The `orElseThrow()` method throws an `Exception` if invoked on an empty `Optional`.
    It accepts as parameter a `Supplier` instance that returns an `Exception`. The
    following code demonstrates this:


    ```java

    Optional<String> strOptional2 = Optional.empty();

    String strValue2 = strOptional1.orElseThrow(()-> new IllegalArgumentException());

    ```


    Here, since `strOptional2` is an empty `Optional`, the `orElseThrow()` method
    throws an `IllegalArgumentException`.


    ### 251. What will be the output of the following code snippet?


    ```java

    Optional<Integer> opInt1 = Optional.of(200); //Line 1

    Optional<Integer> opInt2 = opInt.filter(num-> num > 100); //Line 2

    System.out.println(opInt2.get()); //Line 3

    ```


    **Answer:**


    The `Optional` class has a method called `filter()` which is used in the code
    snippet above. The `filter()` method accepts as `Predicate` and applies the `Predicate`
    to the value in the `Optional` if present. If the condition in the `Predicate`
    is satisfied, it returns the value in the `Optional`, otherwise it returns an
    empty `Optional`. In this case, Line 1 creates an `Integer` Optional with the
    value `200`. Line 2 invokes the `filter()` method with a `Predicate` that checks
    if the value in the `Optional` is greater than `100`. Since this is true, the
    `filter()` method returns an `Optional` with the value `100` which is assigned
    to `opInt2`. So, the `get()` method returns this value.


    So, this code prints the following output:


    100


    # CHAPTER 08


    # Collection Improvements


    ### 252. Explain with a code sample how the forEach method works.


    **Answer:**


    Java 8 has added a new default method called `forEach` to the `Iterable` interface.
    The `java.util.Collection` interface extends the `Iterable` interface and so the
    `forEach` method is available to all the `Collection` classes. The `forEach` method
    helps to internally iterate through a `Collection` without an explicit `for` loop.
    The following code demonstrates this:


    ```java

    List<String> colours = Arrays.asList("Red","Blue","Black","White");

    colours.forEach(str-> System.out.println(str));

    ```


    This code declares a `List` of `String` values called `colours`. The `forEach()`
    method is then invoked on this `List`. The `forEach()` method accepts as parameter
    a `Consumer` instance and operates on it. In this case, the `Consumer` is implemented
    via a lambda expression that simply prints the value passed to it. So, this code
    prints the following output:


    Red

    Blue

    Black

    White


    ### 253. What are some of the improvements made by Java 8 on the List interface?


    **Answer:**


    Java 8 has added some methods to the `List` interface as follows:


    a. `List.sort`: Java 8 has added the `List.sort` method. This can be used to sort
    a `List`. It accepts as parameter `Comparator` and sorts the input `List` per
    the specified `Comparator`.


    b. `List.replaceAll`: Java 8 has added the `List.replaceAll` method. This can
    be used to replace all the values in a `List`. It accepts as parameter `UnaryOperator`.
    `UnaryOperator` is a specialization of the `Function` interface that accepts an
    input of a particular type and returns a result of the same type. The `replaceAll()`
    method applies the `UnaryOperator` to each element in the `List`.


    ### 254. How does the Map.getOrDefault method work?


    **Answer:**


    Java 8 has added the `getOrDefault` method to the `Map` interface. It accepts
    as parameter the key whose value needs to be retrieved as well as a default value.
    So, it returns a value corresponding to the specified key if present, otherwise,
    it returns the default value passed in. The following code snippet demonstrates
    this:


    ```java

    Map<Integer, String> fruits = new HashMap<Integer, String>();

    fruits.put(1,"Apple");

    fruits.put(2,"Orange");

    String fruit1 = fruits.getOrDefault(1,"Mango"); //returns apple

    String fruit2 = fruits.getOrDefault(3,"Mango"); //returns mango

    ```


    This code creates a map called `fruits` with an `Integer` key and a `String` value.
    It adds some values to the map. It first uses the `getOrDefault` method to retrieve
    the value corresponding to the key `1` passing the default value as `Mango`. Since
    there is a value in the `Map` with key `1`, `fruit1` is assigned the value corresponding
    to the key which is `Apple`. It then uses the `getOrDefault` method to retrieve
    the value corresponding to the key `3` passing the default value as `Mango`. Since
    there is no value in the map with key `3`, `fruit2` is assigned the default value
    `Mango`.


    ### 255. What is the output of the following code snippet?


    ```java

    Map<Integer, String> fruits = new HashMap<Integer, String>();

    fruits.put(1,"Apple");

    fruits.put(2,"Orange");

    fruits.put(3,"Strawberry");

    fruits.replace(1, “Mango”); //Line 1

    fruits.replace(2, “Orange”,”Banana”); //Line 2

    fruits.replace(3, “Blackberry”,”Pineapple”); //Line 3

    System.out.println(fruits.get(1));

    System.out.println(fruits.get(2));

    System.out.println(fruits.get(3));

    ```


    **Answer:**


    This code prints the following output:


    Mango

    Banana

    Strawberry

