    036. In the code snippet below, which lines will cause a compilation error and
    why?


    String str = “Hello”;


    long lng = 99;


    double dbl = 1.11;


    int i = 1;


    int j = 0;


    j = i << str; //line 1


    j = i << j; //line 2


    j = i << dbl; //line 3


    j = i << lng; //line 4


    Answer:


    Line 1 and Line 3 will cause a compilation error because they use incompatible
    primitives. Line 1 uses the << with an int and


    a String value whereas Line 3 uses the << operator with an int and a double value.


    037. What will be the output of the following code and why?


    int x =–1;


    x = x>>>24;


    System.out.println(x);


    Answer:


    This code prints 255


    Here, x is set to–1, which will set all 32 bits to 1 converting into binary. The
    value is then shifted right by 24 bits, filling the first 24 bits with 0s, not
    considering the sign extension. This sets x to 255.


    11111111 11111111 11111111 11111111 represents–1 in binary >>>24


    00000000 00000000 00000000 00000000 is the binary version of 255.


    038. Explain the operator available for string concatenation with a code sample.


    Answer:


    The ‘+’ operator when used with Strings can be used for String concatenation.
    The following code demonstrates this:


    String sum = “one” + “two”;


    In the above code, the Strings one and two are concatenated and assigned to the
    String object sum.


