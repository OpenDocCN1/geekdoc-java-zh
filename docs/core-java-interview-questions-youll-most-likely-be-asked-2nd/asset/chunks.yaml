    280. What are the advantages of the new HttpClient introduced by Java 9?


    Answer:


    Java 9 has introduced a new HttpClient class that can be used to make an Http
    request through Java code. Prior to Java 9, the UrlConnection and the HttpUrlConnection
    classes could be used to make an HTTP request. The new Java HttpClient has several
    advantages over these classes as follows:


    • The HttpUrlConnection only supports HTTP 1.1 which is a very old version of
    HTTP. HttpClient supports Http 2.0 which is the latest version of HTTP.


    • Code written via the HttpClient is much cleaner compared to the code written
    via HttpUrlConnection.


    • HttpClient supports asynchronous processing via CompletableFutures. So, it has
    a method called sendAsync that sends an HTTP request asynchronously. It returns
    a CompletableFuture which can be used to obtain the response once the request
    is completed.


    # [CHAPTER 04](#toc.xhtml_ss034a)


    # [Scenario Based Questions](#toc.xhtml_ss034a)


    281. Suppose you create a new thread by extending the Thread class and you invoke
    the start method multiple times. What do you think will happen?


    Answer:


    When you invoke the start() method the first time, a new Thread will be spawned
    and the code specified within the run() method will get executed in the body of
    the thread. However, on subsequent invocation of the start method, an IllegalThreadStateException
    will occur. This is because you cannot start the same thread more than once. Threads
    follow a life cycle and have certain states during the life–cycle. When a thread
    is created the first time, it is in the **NEW** state. After the start() method
    is invoked it enters the **RUNNABLE** state and once the run method completed,
    it enters the **TERMINATED** state. So, when you invoke the start method on a
    running thread, it is already in the **RUNNABLE** state. This causes the IllegalThreadStateException.
    If you want to execute the code in the thread again, you need to create a new
    Thread.


    282. Suppose you have a method that returns an integer value. The code is present
    within a try/catch/finally. There is a return statement in the try, catch and
    finally blocks. The return statement in the try block returns 1, the return statement
    in the catch block returns–1 and the return statement in the finally block returns
    0\. If an exception occurs, which value will be returned?


    Answer:'
