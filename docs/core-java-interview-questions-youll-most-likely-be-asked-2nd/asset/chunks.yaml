    ```\n\nSo first, you need to create an instance of the outer class. Since the\
    \ inner class is a member of the outer class, you can then create an instance\
    \ of the inner class by using the dot operator(`.`). Also, while invoking the\
    \ inner class constructor with the `new` operator, you need to specify the outer\
