    as follows:


    List<Integer> numbers = List.of(5,10,15,20); //Line 1


    System.out.println(numbers); //Line 3


    271. Which Java 9 method can you use to create a Set of String values?


    Answer:


    Java 9 has added a static factory method to the Set interface. You can use this
    to create a Set with String values. The following code demonstrates this:


    Set<String> months = Set.of(“January”,”February”,”March”);


    This code creates a Set of String values called months. It uses the String.of()
    method with the values specified. The String.of() has several overloaded versions
