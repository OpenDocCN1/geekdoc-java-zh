    # [CHAPTER 10](#toc.xhtml_ss011a)


    # [Packages and Access Control](#toc.xhtml_ss011a)


    111. What is a package? What are the advantages of packages?


    Answer:


    A package is a collection of related Java types. So, a package can include related
    classes, interfaces and enumerations. Having a package has several advantages
    as follows:


    • Packages help to keep related code together.


    • A package helps avoiding naming collisions. So, you can have a class or some
    other Java type with the same name in different packages.


    • Packages also help to control access. Code that is outside the package cannot
    access code within the package unless explicitly allowed via the public keyword.


    112. Explain the Java access specifiers.


    Answer:


    Access specifiers control where a particular member is accessible. They are just
    some keywords that are specified with class members. They can be specified with
    an instance field as well as a method. Java has 4 access specifiers as follows:


    a. **Private**: A member having the private access specifier is accessible only
    from within the class in which it is declared.


    b. **Protected**: A member having the protected access specifier is accessible
    to all classes within the package as well as sub–classes that are outside the
    package.


    c. **Public**: A member having the public access specifier is accessible to all
    classes outside the package.


    d. **Default**: The default access occurs when none of the above access specifiers
    are specified. In such a case, the member is accessible within the package but
    not outside the package.


    113. Explain with a code sample how to create a package.


    Answer:


    You can create a package by using the package keyword. It should be followed by
    the name that you want to give to the package. The package name should be a valid
    Java identifier. The package statement should be the first statement in the java
    file. The following code demonstrates this:


    package demo;


    public class MyClass {


    //instance fields and methods


    }


    This code declares a class called MyClass. It is in a package called demo. Note
    that the package statement is the first statement in the code.


    114. Name some default packages in JDK and explain what they do in brief.


    Answer:


    The following are some default packages in Java:


    a. java.util.Collection: This package includes all the Collection API classes.
    So, classes/interfaces like List, ArrayList, Set, HashSet, Map, HashMap are all
    part of this package. In addition, it also has other classes like Date and Calendar
    for Date handling.


    b. java.io: This package has classes that help to perform input/output operations
    like InputStream, FileInputStream, FileOutputStream, BufferedReader, BufferedWriter,
    etc.


    c. java.awt: This package has all classes for creating user interfaces like Component,
    Container, Frame, etc.


    d. java.util.concurrent: This package has all classes that are useful for concurrent
    programming like Future, Executor, ExecutorService, etc.


    115. Is the following code valid? Explain the reasons.


    package demo1;


    public class Base {


    protected int a;


    }


    package demo2;


    public class Sub extends Base {


    public void doSomething() {


    System.out.println(“Value of a is “+a);


    }


    }


    Answer:


    The above code is valid and does not cause any compilation or run time error.
    This code creates a super class called Base and a sub–class called Sub. Both classes
    are in different packages. The Base class has a protected field a which is accessed
    in the sub–class doSomething() method. This is perfectly valid. Only private fields
    from the base class are not accessible in the sub–class. Fields with the protected
    access specifier are accessible in the sub–class even if the sub–class is in a
    different package.


    116. Explain the import keyword.


    Answer:


    The import keyword is used to include other packages in your code. You can import
    the standard Java packages like java.util, etc. or you can import user defined
    packages.


    The import keyword needs to be followed by the package name. In order to import
    a specific class from a package, you need to specify the class name as well. In
    order to import the entire package, you need to use a wildcard character (*) after
    the package name. The following are some examples of import:


    import.java.util.List; //imports the List interface


    import java.io.*; //imports all classes from the java.io package


    117. Explain the differences between the protected and default access specifier


    Answer:


    There are several differences between the protected and default access specifier.
    These are as follows:


    • The protected access specifier is specified via the protected keyword while
    the default access occurs when no other access specifier is used. So, the default
    access specifier does not have a separate keyword.


    • When a member has the protected access specifier, that member is accessible
    to all classes within the package as well as sub–classes that are outside the
    package too. When a member has the default access specifier, that member is accessible
    only to classes within the package, it is not accessible outside the package.


    118. Is the following code snippet valid? Explain.


    package demo1;


    public class MyClass1 {


    int a; //Line 1


    }


    package demo2;


    public class MyClass2 {


    public void doSomething() {


    MyClass1 obj = new MyClass1(); //Line 2


    obj.a = 5; //Line 3


    }


    }


    Answer:


    The above code is not valid and will cause a compilation error at line 3\. The
    class MyClass1 is in a package called demo1. It has a field a. Since no access
    specifier is included explicitly, this field has default access. The class MyClass2
    is in a package called demo2. The doSomething() method access the field a from
    MyClass1 at Line 3\. A field with default access is not accessible outside the
    package so Line 3 will cause a compilation error.


    119. Explain what happens when the following code is compiled and executed:


    package com.questions;


    public class CoreJava {


    private String getQuestion() {


    return “Question1”;


    }


    }


    package com.questions;


    class JSP extends CoreJava {


    public void getJSPQuestion() {


    Sytem.out.println(getQuestion());


    }


    }


    Answer:


    The above code will not compile. The class CoreJava defines a private method getQuestion().
    The getJSPQuestion() method in the sub–class invokes this private super–class
    method. Since a private method cannot be accessed by a sub–class, a compilation
    error occurs.


    120. Explain the java.lang package.


    Answer:


    The java.lang package has classes that are important to the Java programming language.
    It includes the wrapper classes like Byte, Boolean, Integer, Double, etc. It has
    classes like String, StringBuffer and StringBuilder which are useful for String
    manipulation. It has classes like Thread, Runnable which are useful for creating
    multi–threaded applications. It has Throwable and other Exception classes which
    are useful for Java’s exception handling feature.


    # [CHAPTER 11](#toc.xhtml_ss012a)


    # [Exception Handling](#toc.xhtml_ss012a)


    121. Explain ‘throw’, ‘throws’ and ‘Throwable’ in Java.


    Answer:


    The throws keyword is used to specify that a particular method throws an unhandled
    exception or multiple exceptions which need to be handled separately. It basically
    specifies that you do not want to handle the error condition within the method
    but want to delegate the exception handling to some other part of your code.


    The throw keyword is used inside a method to explicitly throw an exception.


    Throwable is the base class in the exception hierarchy. Custom exceptions can
    be created by extending the ‘Throwable’ class.


    122. What will be the output when you compile and execute the following code?


    class Test {


    try {


    System.out.println(“This is try block”);


    }


    System.out.println(“Try block is executed”); //Line 1


    catch(Exception exp) {


    System.out.println(“This is catch block”);


    }


    }


