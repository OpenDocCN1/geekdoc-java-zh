    [276.](#p03-ch03.xhtml_ind276) What changes has Java 9 made to the try–with statement?


    [277.](#p03-ch03.xhtml_ind277) What is the use of the stream method added by Java
    9 on the Optional class?


    [278.](#p03-ch03.xhtml_ind278) Explain the ProcessHandle class and some of its
    important methods.


    [279.](#p03-ch03.xhtml_ind279) In the code snippet below, explain what code should
    be used at line 1 to print the output in the expected output section below:


    [280.](#p03-ch03.xhtml_ind280) What are the advantages of the new HttpClient introduced
    by Java 9?


    Scenario Based Questions


    [281.](#p03-ch04.xhtml_ind281) Suppose you create a new thread by extending the
    Thread class and you invoke the start method multiple times. What do you think
    will happen?


    [282.](#p03-ch04.xhtml_ind282) Suppose you have a method that returns an integer
    value. The code is present within a try/catch/finally. There is a return statement
    in the try, catch and finally blocks. The return statement in the try block returns
    1, the return statement in the catch block returns–1 and the return statement
    in the finally block returns 0\. If an exception occurs, which value will be returned?


    [283.](#p03-ch04.xhtml_ind283) Suppose you have a static method in the Base class.
    And suppose you have a method with the same name in the sub–class. And suppose
    you create a Base class object and assign it a reference of the sub–class object
    and invoke the static method. Is this valid? If so, which version of the static
    method gets invoked?


    [284.](#p03-ch04.xhtml_ind284) Suppose you have a method in a base class that
    throws an ArrayIndexOutOfBoundsException. And suppose this method is overridden
    in the sub–class and declares that it throws a RuntimeException. What do you think
    will happen?


    [285.](#p03-ch04.xhtml_ind285) Suppose you have a List of objects. You want to
    send it as a parameter to a client application but want to ensure that the client
    application does not make changes to it. How can you achieve this?


    [286.](#p03-ch04.xhtml_ind286) Suppose you are reading 10000 String values from
    the database. You need to create a concatenated String with these values. Which
    is the most efficient way to achieve this?


    [287.](#p03-ch04.xhtml_ind287) Suppose you are developing an application that
    performs a lot of mathematical calculations involving very large decimal numbers.
    Which data type will you use for your variables given that precision is important?


    [288.](#p03-ch04.xhtml_ind288) Suppose you are working on a multi–threaded application.
    A new requirement comes in where you need to store key–value pairs. Which is the
    most appropriate Collection to be used in such a scenario?


    [289.](#p03-ch04.xhtml_ind289) Suppose you need to create some utility methods
    in your application. What is the best practice for creating such methods? Where
    would you place them?


    [290.](#p03-ch04.xhtml_ind290) Suppose you have developed an interface called
    FileWriter as part of an API. It has a writeToCsv file method that writes the
    contents passed in to a CSV file. The API is implemented by different applications
    that provide an implementation for the FileWriter interface. Now, suppose you
    are required to add a new method to the interface called writeToExcel which writes
    the contents passed in to an excel file. How can you go about with this change
    with minimal impact to the users of your API?


    Section 4– Human Resource


    Creativity


    [291.](#p04-ch01.xhtml_ind291) Where do you find ideas?


    [292.](#p04-ch01.xhtml_ind292) How do you achieve creativity in the workplace?


    [293.](#p04-ch01.xhtml_ind293) How do you push others to create ideas?


    [294.](#p04-ch01.xhtml_ind294) Describe your creativity.


    Leadership


    [295.](#p04-ch02.xhtml_ind295) Would you rather receive more authority or more
    responsibility at work?


    [296.](#p04-ch02.xhtml_ind296) What do you do when someone in a group isn’t contributing
    their fair share?


    [297.](#p04-ch02.xhtml_ind297) Tell me about a time when you made a decision that
    was outside of your authority.


    [298.](#p04-ch02.xhtml_ind298) Are you comfortable going to supervisors with disputes?


    [299.](#p04-ch02.xhtml_ind299) If you had been in charge at your last job, what
    would you have done differently?


    [300.](#p04-ch02.xhtml_ind300) Do you believe employers should praise or reward
    employees for a job well done?


    [301.](#p04-ch02.xhtml_ind301) What do you believe is the most important quality
    a leader can have?


    [302.](#p04-ch02.xhtml_ind302) Tell me about a time when an unforeseen problem
    arose. How did you handle it?


    [303.](#p04-ch02.xhtml_ind303) Can you give me an example of a time when you were
    able to improve X objective at your previous job?


    [304.](#p04-ch02.xhtml_ind304) Tell me about a time when a supervisor did not
    provide specific enough direction on a project.


    [305.](#p04-ch02.xhtml_ind305) Tell me about a time when you were in charge of
    leading a project.


    [306.](#p04-ch02.xhtml_ind306) Tell me about a suggestion you made to a former
    employer that was later implemented.


    [307.](#p04-ch02.xhtml_ind307) Tell me about a time when you thought of a way
    something in the workplace could be done more efficiently.'
