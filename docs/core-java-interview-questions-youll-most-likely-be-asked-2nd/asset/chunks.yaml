    \nd. **匿名内部类**：一种没有名称且在定义时只能实例化一次的类被称为匿名内部类。因为它没有名称，所以它没有构造方法。它不能是静态的（static）。该类的定义以一个分号结束。\n\
    \n### 081. 编写一个代码示例，演示如何从外部类实例化内部类。\n\n**答案：**\n\n假设你有一个名为 `TestOuter` 的外部类，其中包含一个名为\
    \ `TestInner` 的内部类。以下代码段演示了如何实例化 `TestInner` 类：\n\n```\nTestOuter outer = new\
    \ TestOuter();\nTestOuter.TestInner inner = outer.new TestInner();\n```\n\n因此，首先，你需要创建一个外部类的实例。由于内部类是外部类的成员，你随后可以使用点运算符（`.`）创建内部类的实例。此外，在使用\
    \ `new` 运算符调用内部类构造函数时，你需要使用点运算符指定外部类对象实例。\n\n### 082. 编写一个代码示例，演示内部类。\n\n**答案：**\n\
    \n以下代码演示了一个内部类：\n\n```java\nclass Outer {\n    private int iValue = 100;\n\n \
    \   public void callInner() {\n        Inner inner = new Inner();\n        inner.readValue();\n\
    \    }\n\n    class Inner {\n        public void readValue() {\n            System.out.println(\"\
    Value is: \" + iValue);\n        }\n    }\n}\n```\n\n在上面的代码中，`Outer` 类有一个内部类 `Inner`。`callInner()`\
    \ 方法实例化了 `Inner` 类并调用了它的 `readValue` 方法。\n\n### 083. 什么是“方法局部”内部类。\n\n**答案：**\n\
    \n方法局部内部类是定义在包含类方法内部的内部类。它需要在方法内部进行实例化，不能在方法外部实例化。它只使用方法内部的 final 变量。它只能有 abstract\
    \ 和 final 修饰符。以下代码演示了一个方法局部内部类：\n\n```java\npublic class Outer {\n    public void\
    \ doSomething() {\n        final int i = 10;\n        class Inner {\n        \
    \    void doSomethingInInner() {\n                System.out.println(i);\n   \
    \         }\n        }\n        Inner inner = new Inner();\n        inner.doSomethingInInner();\n\
    \    }\n}\n```\n\n这段代码指定了一个带有 `doSomething()` 方法的类 `Outer`。在该方法内部定义了一个名为 `Inner`\
    \ 的类。`Inner` 是一个方法局部类。它在方法内部本身被实例化。\n\n### 084. 使用代码示例解释静态嵌套类。\n\n**答案：**\n\n\
    静态嵌套类简单来说就是带有 `static` 关键字的内部类。以下代码演示了这一点：\n\n```java\npublic class MyClass {\n\
    \    int ivalue = 1000; // 第 1 行\n    static int staticValue = 10;\n    static\
    \ class Nested {\n        void doSomething() {\n            staticValue = 6; //第\
    \ 2 行\n            //ivalue = 20; //第 3 行\n        }\n    }\n}\n```\n\n静态嵌套类只能访问外部类的静态变量，不能访问非静态外部类变量。因此，第\
    \ 2 行可以正常工作，但取消第 3 行的注释将导致编译错误。\n\n### 085. 使用代码示例解释如何实例化静态嵌套类。\n\n**答案：**\n\n\
