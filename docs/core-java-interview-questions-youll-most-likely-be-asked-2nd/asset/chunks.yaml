    # CHAPTER 01


    # Creativity


    291. Where do you find ideas?


    Answer:


    Ideas can come from all places, and an interviewer wants to see that your ideas
    are just as varied. Mention multiple places that you gain ideas from, or settings
    in which you find yourself brainstorming. Additionally, elaborate on how you record
    ideas or expand upon them later.


    *As an example:*


    I am constantly taking notes on a notepad or in my phone throughout the day of
    things I would like to revisit later. I get ideas during work meetings, listening
    to my coworkers struggles and updates, take notes and research later how we can
    improve workflow. I will also get ideas via my network when they put out new innovative
    things they are pursuing in their workplace, I will see how I may be able to apply
    those innovations in my own company.


    292. How do you achieve creativity in the workplace?


    Answer:


    It’s important to show the interviewer that you’re capable of being resourceful
    and innovative in the workplace, without stepping outside the lines of company
    values. Explain where ideas normally stem from for you (examples may include an
    exercise such as list-making or a mind map), and connect this to a particular
    task in your job that it would be helpful to be creative in.


    *As an example:*


    I was assigned to a safety and wellness taskforce. Most people were walking on
    their breaks anyway, just not together. I signed up for a three month hosted walking
    challenge in which people could still walk on their own on their breaks, however,
    they were encouraged to interact with their coworkers and engage in some healthy
    competition in tracking their progress. This ended up getting more people to get
    up and exercise while also building morale and a sense of teamwork.


    293. How do you push others to create ideas?


    Answer:


    If you’re in a supervisory position, this may be requiring employees to submit
    a particular number of ideas, or to complete regular idea-generating exercises,
    in order to work their creative muscles. However, you can also push others around
    you to create ideas simply by creating more of your own. Additionally, discuss
    with the interviewer the importance of questioning people as a way to inspire
    ideas and change.


    *As an example:*


    Each staff meeting I encourage staff members to bring a problem or challenge they
    have been facing or had faced since our last meeting, along with a solution. I
    also encourage employees to attend regular professional development opportunities
    whether it is a free webinar, a training, or even read newly published articles
    in their field, and share things they have learned or trending topics with the
    team.


    294. Describe your creativity.


    Answer:


    Try to keep this answer within the professional realm, but if you have an impressive
    background in something creative outside of your employment history, don’t be
    afraid to include it in your answer also. The best answers about creativity will
    relate problem-solving skills, goal-setting, and finding innovative ways to tackle
    a project or make a sale in the workplace. However, passions outside of the office
    are great, too (so long as they don’t cut into your work time or mental space).


    *As an example:*


    I participate in a volunteer group outside of work who provides meals for homeless
    people. The company I worked for was seeking connections to the community and
    ways for the employees to be involved in something bigger than their specific
    roles, so with permission form the company, I hosted a fundraising event put on
    the company where the employees worked a spaghetti dinner to raise funds for the
    homeless charity. This boosted employee teamwork and comradery and a sense of
    purpose amongst them.


    # CHAPTER 02


    # Leadership


    295. Would you rather receive more authority or more responsibility at work?


    Answer:


    There are pros and cons to each of these options, and your interviewer will be
    more interested to see that you can provide a critical answer to the question.
    Receiving more authority may mean greater decision-making power and may be great
    for those with outstanding leadership skills, while greater responsibility may
    be a growth opportunity for those looking to advance steadily throughout their
    careers.


    *As an example:*


    I would say I am a good example of a “servant leader” in how I work within teams.
    I have a natural ability to lead and people naturally follow me. I am a natural
    project manager and can see the big picture as well as minute details. With that
    said, I listen to what my team says and encourage and value all of their input.
    It is all about having the ability to lead and make concise and proper decisions,
    while at the same time taking in to account the opinions and ideas of the entire
    team and allowing for improving in your decisions when need be.


    296. What do you do when someone in a group isn’t contributing their fair share?


