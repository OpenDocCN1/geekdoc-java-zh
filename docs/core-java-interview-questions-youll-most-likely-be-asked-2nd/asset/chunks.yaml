    As the safety officer at my last employer, I had an important two o’clock meeting
    with department heads that had been on the calendar for a month and could not
    be moved due to the executive’s busy schedules. At the same time, I had an urgent
    safety issue in the field I needed to run out to. I was split between the two
    issues so I had my intern take the presentation I had prepared to the meeting,
    explain the situation, and show the presentation to them anyway. He clarified
    things he could and took notes on their questions and items he was not equipped
    to address, and we scheduled a follow up conference call for the next day to go
    over the pending questions I was not there to answer. We were able to tie up loose
    ends on the follow up call and move forward with the project the next day. The
    executives understood the situation I was faced with and appreciated not having
    to put the project on hold.


    ## 303. Can you give me an example of a time when you were able to improve X objective
    at your previous job?


    **Answer:**


    It’s important here to focus on an improvement you made that created tangible
    results for your company. Increasing efficiency is certainly a very important
    element in business, but employers are also looking for concrete results such
    as increased sales or cut expenses. Explain your process thoroughly, offering
    specific numbers and evidence wherever possible, particularly in outlining the
    results.


    *As an example:*


    I was able to successfully reduce the hold time by 4 minutes on each customer
    call and streamline the wait list process by suggesting a software in which all
    customer service reps had access to a monitor that showed all customer calls.
    The monitor displayed how many calls were active, pending, or on hold (and with
    which rep), and which line they were on. Reps could easily hang up a call, look
    at the board and see which line needed to be picked up next. This improved workflow
    for the customer service department, allowed for approximately 20 more customer
    resolutions per day, increased profits by 30% in terms of new orders that could
    now come in, and increased customer satisfaction and company ratings.


    ## 304. Tell me about a time when a supervisor did not provide specific enough
    direction on a project.


    **Answer:**


    While many employers want their employees to follow very specific guidelines without
    much decision-making power, it’s important also to be able to pick up a project
    with vague direction and to perform self-sufficiently. Give examples of necessary
    questions that you asked and specify how you determined whether a question was
    something you needed to ask of a supervisor or whether it was something you could
    determine on your own.


    *As an example:*


    I had a large project already pending when my supervisor was about to leave for
    vacation. Before her vacation she gave me another project and did not leave deadlines
    along with it. I analyzed the project and determined it was a new client and I
    did not want to leave them wondering. I continued with my pending project and
    made contact with the new client to introduce myself and set up a call to discuss
    their needs. This bought me time while also allowing me to obtain more information.
    It was still unclear as to what the deadlines were and it did not seem urgent
    so I continued with my existing, as well as set aside time each afternoon to begin
    working on the new client’s project as well.


    ## 305. Tell me about a time when you were in charge of leading a project.


    **Answer:**


    Lead the interviewer through the process of the project, just as you would have
    with any of your team members. Explain the goal of the project, the necessary
    steps, and how you delegated tasks to your team. Include the results, and what
    you learned as a result of the leadership opportunity.


    *As an example:*


    As an HR Assistant helping while the HR Benefits Rep was out on leave, I was put
    in charge of the annual employee benefits open enrollment for a large organization.
    I spoke with the manager ahead of time to gather as much information I could could
    on what had worked in the past in terms of timelines and work flow, and added
    a couple of helpful changes myself such as a filing system for the different benefit
    changes as they were going to come in. The week prior to the beginning of open
    enrollment, I had a meeting with the HR department to go over each form and explain
    to my team how I was going to distribute each form and made helpful cheat sheets
    of information for them to each keep at their desk in instances of an employee
    coming with questions and I may be unavailable.


    The entire process went smoothly and organized, and employees commented on how
    easy it was.


    ## 306. Tell me about a suggestion you made to a former employer that was later
    implemented.


    **Answer:**


    Employers want to see that you’re interested in improving your company and doing
    your part - offer a specific example of something you did to create a positive
    change in your previous job. Explain how you thought of the idea, how your supervisors
    received it, and what other employees thought was the idea was put into place.


    *As an example:*


    I suggested we start an innovation committee to bring staff together to discuss
    new ideas they had for the workplace. These ideas included a wide variety of things
    such as ways to implement employee recognition, snack machine options, changes
    to the customer lobby, and anything and everything in between. While not all ideas
    were acted upon by management, a variation of most of the ideas were implemented.
    This made the employees feel a sense of ownership and belonging in the company,
    as well as improved morale and teamwork.


    ## 307. Tell me about a time when you thought of a way something in the workplace
    could be done more efficiently.


    **Answer:**


    Focus on the positive aspects of your idea. It’s important not to portray your
    old company or boss negatively, so doesn’t elaborate on how inefficient a particular
    system was. Rather, explain a situation in which you saw an opportunity to increase
    productivity or to streamline a process, and explain in a general step-by-step
    how you implemented a better system.


    *As an example:*


    Our department had set aside Fridays as “filing days” for paperwork that was collected
    throughout the week. While this was definitely a great idea, if a coworker called
    out sick, or we had a large amount of filing in one week, there would be times
    when we would not get it all done on Friday, or it would be very stressful due
    to the high volume of paperwork we received throughout the week. I suggested that
    we started to file throughout the week during our downtime between projects so
    we would not have a backlog all on one day. I also noticed that the last half
    hour of each day, some coworkers would start “packing up” and with the work we
    did, we couldn’t really start a new project within the last little bit of time
    so we would start packing up and then file for the last thirty minutes of each
    day until it was time to clock out. This greatly reduced the amount we had piled
    up for Fridays, as well as kept productivity higher throughout the week.


    ## 308. Is there a difference between leading and managing people - which is your
    greater strength?


    **Answer:**


    There is a difference - leaders are often great idea people, passionate, charismatic,
    and with the ability to organize and inspire others, while managers are those
    who ensure a system runs, facilitate its operations, make authoritative decisions,
    and who take great responsibility for all aspects from overall success to the
    finest decisions. Consider which of these is most applicable to the position,
    and explain how you fit into this role, offering concrete examples of your past
    experience.


    *As an example:*

    '
  raw: 'As the safety officer at my last employer, I had an important two o’clock
    meeting with department heads that had been on the calendar for a month and could
    not be moved due to the executive’s busy schedules. At the same time, I had an
    urgent safety issue in the field I needed to run out to. I was split between the
    two issues so I had my intern take the presentation I had prepared to the meeting,
    explain the situation, and show the presentation to them anyway. He clarified
    things he could and took notes on their questions and items he was not equipped
    to address, and we scheduled a follow up conference call for the next day to go
    over the pending questions I was not there to answer. We were able to tie up loose
    ends on the follow up call and move forward with the project the next day. The
    executives understood the situation I was faced with and appreciated not having
    to put the project on hold.


    303. Can you give me an example of a time when you were able to improve X objective
    at your previous job?


    Answer:


    It’s important here to focus on an improvement you made that created tangible
    results for your company. Increasing efficiency is certainly a very important
    element in business, but employers are also looking for concrete results such
    as increased sales or cut expenses. Explain your process thoroughly, offering
    specific numbers and evidence wherever possible, particularly in outlining the
    results.


    *As an example:*


    I was able to successfully reduce the hold time by 4 minutes on each customer
    call and streamline the wait list process by suggesting a software in which all
    customer service reps had access to a monitor that showed all customer calls.
    The monitor displayed how many calls were active, pending, or on hold (and with
    which rep), and which line they were on. Reps could easily hang up a call, look
    at the board and see which line needed to be picked up next. This improved workflow
    for the customer service department, allowed for approximately 20 more customer
    resolutions per day, increased profits by 30% in terms of new orders that could
    now come in, and increased customer satisfaction and company ratings.


    304. Tell me about a time when a supervisor did not provide specific enough direction
    on a project.


    Answer:


    While many employers want their employees to follow very specific guidelines without
    much decision-making power, it’s important also to be able to pick up a project
    with vague direction and to perform self-sufficiently. Give examples of necessary
    questions that you asked and specify how you determined whether a question was
    something you needed to ask of a supervisor or whether it was something you could
    determine on your own.


    *As an example:*


    I had a large project already pending when my supervisor was about to leave for
    vacation. Before her vacation she gave me another project and did not leave deadlines
    along with it. I analyzed the project and determined it was a new client and I
    did not want to leave them wondering. I continued with my pending project and
    made contact with the new client to introduce myself and set up a call to discuss
    their needs. This bought me time while also allowing me to obtain more information.
    It was still unclear as to what the deadlines were and it did not seem urgent
    so I continued with my existing, as well as set aside time each afternoon to begin
    working on the new client’s project as well.


    305. Tell me about a time when you were in charge of leading a project.


    Answer:


    Lead the interviewer through the process of the project, just as you would have
    with any of your team members. Explain the goal of the project, the necessary
    steps, and how you delegated tasks to your team. Include the results, and what
    you learned as a result of the leadership opportunity.


    *As an example:*


    As an HR Assistant helping while the HR Benefits Rep was out on leave, I was put
    in charge of the annual employee benefits open enrollment for a large organization.
    I spoke with the manager ahead of time to gather as much information as I could
    on what had worked in the past in terms of timelines and work flow, and added
    a couple of helpful changes myself such as a filing system for the different benefit
    changes as they were going to come in. The week prior to the beginning of open
    enrollment, I had a meeting with the HR department to go over each form and explain
    to my team how I was going to distribute each form and made helpful cheat sheets
    of information for them to each keep at their desk in instances of an employee
    coming with questions and I may be unavailable.


    The entire process went smoothly and organized, and employees commented on how
    easy it was.


    306. Tell me about a suggestion you made to a former employer that was later implemented.


    Answer:


    Employers want to see that you’re interested in improving your company and doing
    your part - offer a specific example of something you did to create a positive
    change in your previous job. Explain how you thought of the idea, how your supervisors
    received it, and what other employees thought was the idea was put into place.


    *As an example:*


    I suggested we start an innovation committee to bring staff together to discuss
    new ideas they had for the workplace. These ideas included a wide variety of things
    such as ways to implement employee recognition, snack machine options, changes
    to the customer lobby, and anything and everything in between. While not all ideas
    were acted upon by management, a variation of most of the ideas were implemented.
    This made the employees feel a sense of ownership and belonging in the company,
    as well as improved morale and teamwork.


    307. Tell me about a time when you thought of a way something in the workplace
    could be done more efficiently.


    Answer:


    Focus on the positive aspects of your idea. It’s important not to portray your
    old company or boss negatively, so doesn’t elaborate on how inefficient a particular
    system was. Rather, explain a situation in which you saw an opportunity to increase
    productivity or to streamline a process, and explain in a general step-by-step
    how you implemented a better system.


    *As an example:*


    Our department had set aside Fridays as “filing days” for paperwork that was collected
    throughout the week. While this was definitely a great idea, if a coworker called
    out sick, or we had a large amount of filing in one week, there would be times
    when we would not get it all done on Friday, or it would be very stressful due
    to the high volume of paperwork we received throughout the week. I suggested that
    we started to file throughout the week during ourdowntime between projects so
