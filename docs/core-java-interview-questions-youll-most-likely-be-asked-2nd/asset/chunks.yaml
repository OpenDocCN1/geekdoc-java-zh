    163. Explain the different types of Threads in Java.


    Answer:


    There are 2 types of threads–User defined Threads and Daemon threads


    User defined threads are those that are created programmatically by a user. These
    are high priority threads. The JVM waits for these threads to finish.


    Daemon threads are mostly created by the JVM, although a user–defined thread can
    be explicitly set to be a daemon thread as well. Daemon threads are usually used
    for background processes such as Garbage Collection. As soon as all Non–Daemon
    threads stop running, the JVM stops running and does not wait for the Daemon threads
    to stop.


    164. Can the run method be invoked directly without invoking the start method?


    Answer:


    The run() method can directly be invoked instead of invoking the start() method.
    However, this will not spawn a new thread, the code within the run() method will
    be executed in the same thread that invokes it. The start() method is responsible
    for spawning a new thread and needs to be invoked.


    165. What happens behind the scenes when the following code is executed?


    class Test {


    public static void main(String argument[]) {


    System.out.println(“Thread Example...”);


    }


    }


    Answer:


    When the above code is executed, the JVM creates a thread to run this code. This
    thread executes the code in the main method after which the program terminates.


    166. Explain some of the main methods in the Thread class.


    Answer:


    a. **start()**: Initiates the thread and invoke the run() method


    b. **run()**: Code that needs to be executed in a separate thread needs to be
    placed in the run method


    c. **sleep()**: makes the running thread pause for the specified time


    d. **setName()**: sets the name of the thread to the value specified


    e. **join()**: waits for the thread to die for at most the specified time


    f. **isAlive()**: Returns a boolean value that indicates if the current thread
    is alive or not


    g. **setPriority()**: Changes the priority of the thread to the specified value


    167. Explain thread states.


    Answer:


    Thread exists in five states. They are as follows:


    a. **New**: A thread is in new state when a new Thread is created but the start
    method is not invoked.


    b. **Runnable**: A Thread is in the Runnable state after the start() method is
    invoked but the Thread scheduler has not yet started executing the thread.


    c. **Running**: When the thread scheduler starts executing the thread, it is in
    the Running state. The code within the body of the run() method gets executed.


    d. **Waiting / Blocking**: If a thread is alive, but not eligible to run, it is
    said to be in the blocking state.


    e. **Dead**: When the thread completes its execution, it enters the dead state.


    168. Write a code sample that creates a thread using the “Thread” class.


    Answer:


    The following code creates a thread using “Thread” class:


    class MyThread extends Thread {


    public static void main(String argument[]) {


    MyThread thread = new MyThread ();


    thread.start(); // Line 1


    }


    public void run() {


    System.out.println(“Inside Run Method..”);// Line 2


    }


    }


    The code above defines a class called MyThread that extends the Thread class.
    When Line 1 is executed, a new thread is spawned. This executes the code specified
    within the run() method.


    169. Write a code sample that creates a thread using the Runnable interface.


    Answer:


    The following code creates a thread by implementing the “Runnable” interface:


    class MyThread implements Runnable {


    public static void main(String argument[]) {


    MyThread myThread = new MyThread();


    Thread thread = new Thread(myThread); //Line 1


    thread.start(); // Line 2


    }


    public void run() {


    System.out.println(“Inside Run Method..”);


    }


    }


    The code above defines a class called MyThread that implements the Runnable interface.
    A new Thread object is created and the Runnable implementation that is MyThread
    instance is passed to it at line 1\. When Line 2 is executed, a new thread is
    spawned. This executes the code specified within the run() method.


    170. Is it possible to create more than one thread in a Java application? If so,
    how will the threads communicate with each other?


    Answer:


    Yes, it is possible to create more than one thread in a Java application. For
    two threads to communicate with each other, the methods wait(), notify() and notifyAll()
    from the object class need to be used.


    The wait() method causes the current thread to pause until some other thread invokes
    notify on the same object.


    If there are many objects that are waiting on a particular object, the notify()
    method causes any one thread to resume.


    The notifyAll() method causes all the threads that are waiting on a particular
    object to resume.


