  trans: "\n\n`java.util.function.Consumer` 是一个内置函数式接口。它是 Java 8 添加的 `java.util.function`\
    \ 包的一部分。它有一个名为 `accept()` 的方法，该方法接受任何数据类型的参数并对其进行操作。它不返回任何结果。该方法需要通过 lambda 表达式来实现。以下代码演示了：\n\
    \n```java\nConsumer<String> printStr = val-> System.out.println(val); //Line 1\n\
    printStr.accept(\"Hello World\"); //Line 2\n```\n\nLine 1 创建了一个类型为 `String` 的名为\
    \ `printStr` 的 `Consumer`。它通过 lambda 表达式实现了 `accept()` 方法，该方法简单打印输入的 `String`。Line\
    \ 2 使用值“Hello World”调用了 `accept` 方法。因此，这段代码输以下输出：\n\nHello World\n\n### 200. 解释\
    \ `Supplier` 和 `Consumer` 接口之间的区别。\n\n答案：\n\n`Supplier` 和 `Consumer`\n\n接口都是 `java.util.function`\
    \ 包中的内置函数式接口。它们之间有以下几点区别：\n\n- `Supplier` 接口不接受参数，而 `Consumer` 接口接受任何数据类型的参数。\n\
    - `Supplier` 接口产生任何数据类型的返回值，而 `Consumer` 接口不返回任何值。\n- `Supplier` 接口基本上产生特定数据类型的值，而\
    \ `Consumer` 接口则对输入值进行操作。\n\n### 201. 下述代码段的输出是什么？\n\n```java\nPredicate<Integer>\
    \ numberChecker = (num)-> num > 20;\nint input = 10;\nSystem.out.println(input+\"\
    \ greater than 20–\"+numberChecker.test(input)); //Line 1\ninput = 40;\nSystem.out.println(input+\"\
    \ greater than 20–\"+numberChecker.test(input)); //Line 2\n```\n\n答案：\n\n上述代码段使用了名为\
    \ `Predicate` 的内置函数式接口。该接口接受任何数据类型的参数并返回一个布尔值。因此，它基本上被用于测试条件。在这里，代码创建了一个名为 `numberChecker`\
    \ 的 `Predicate`，它接受一个整数值。它通过 lambda 表达式实现，用于检查输入数字是否大于 20。Line 1 对值 10 应用了 `Predicate`，而\
    \ Line 2 对值 40 应用了 `Predicate`。因此，代码输出了以下输出：\n\n10 greater than 20:false\n40 greater\
    \ than 20:true\n\n### 202. 你使用哪种内置函数式接口将 String 转换为大写？\n\n答案：\n\n有一个名为 `UnaryOperator`\
    \ 的内置函数式接口。它接受任何数据类型的参数并返回相同数据类型的结果。它有一个名为 `apply` 的方法可以对输入值进行操作。因此，你可以用它将 `String`\
    \ 转换为大写。以下代码演示了：\n\n```java\nUnaryOperator<String> converter = str-> str.toUpperCase();\n\
    System.out.println(converter.apply(\"hello world\"));\n```\n\n在这里，代码创建了一个名为 `converter`\
    \ 的 `UnaryOperator` 实现，它对 `String` 值进行操作。使用 lambda 表达式将 `String` 转换为大写。因此，这段代码输出了以下输出：\n\
    \nHELLO WORLD\n\n### 203. 下面代码有效吗？请解释。\n\n```java\n@FunctionalInterface\npublic\
    \ interface Interface1 {\n    public void doSomething();\n}\n\npublic interface\
    \ Interface2 extends Interface1{\n    public void doSomethingElse();\n}\n```\n\
    \n答案：\n\n上面的代码声明了一个名为 `Interface1` 的函数式接口，包含一个名为 `doSomething` 的抽象方法。然后它定义了另一个名为\
    \ `Interface2` 的函数式接口，它扩展了 `Interface1` 并有一个名为 `doSomethingElse` 的抽象方法。这段代码完全有效。`Interface2`\
    \ 现在有两个抽象方法：`doSomething()` 和 `doSomethingElse()`。因为它没有标记 `@FunctionalInterface`\
    \ 注解，所以拥有多个抽象方法是可以允许的。如果在 `Interface2` 上使用了 `@FunctionalInterface` 注解，代码将会导致编译错误。\n\
    \n### 204. 列举一些 Java 8 之前被 Java 8 变为函数式接口的接口。\n\n答案：\n\n在 Java 8 之前，某些接口已经有单个抽象方法。Java\
    \ 8 通过在这些接口上指定 `@FunctionalInterface` 注解将这些接口指定为函数式接口。因此，这些接口中的抽象方法可以通过 lambda\
    \ 表达式来实现。这些接口如下：\n\na. `java.lang.Runnable`：用于创建 `Thread`。\nb. `java.util.concurrent.Callable`：用于创建返回值的\
    \ `Thread`。\nc. `java.util.Comparator`：用于比较值。\nd. `java.io.FileFilter`：用于过滤 `Files`。\n\
    \n### 205. 为什么 Java 8 添加了内置函数式接口的原始类型特化（如 `IntSupplier`、`BooleanSupplier` 等）？\n\
    \n答案：\n\nJava 添加 `IntSupplier`、`BooleanSupplier` 等内置函数式接口的原始类型特化是为了提高性能。原始类型特化消除了自动装箱的需求，从而提高了性能。以下代码演示了这一点：\n\
    \n```java\nSupplier<Integer> integerSupplier = ()-> new Integer(new Random().nextInt());\n\
    ```\n\n这段代码创建一个返回小于 100 随机整数的 `Supplier`。由于没有使用原始类型特化，`Random` 类返回的值需要被封装为 `Integer`。现在考虑以下代码：\n\
    \n```java\nIntSupplier integerSupplier2 = ()-> Random().nextInt();\n```\n\n在这种情况下，使用了\
    \ `IntSupplier`，它是 `Supplier` 的原始类型特化，返回整数。因此，不需要将返回值封装为 `Integer`。由于避免了自动装箱，这段代码带来了更好的性能。\n\
    \n### 206. 内置函数式接口通常用在哪里？\n\n答案：\n\nJava 8 添加了 `Stream API`，它帮助对集合进行批量操作。内置函数式接口通常用作流中方法的参数。流方法将函数式接口指定的操作应用到\
    \ `Stream` 中的每个元素。例如，`Stream` 接口有一个 `filter` 方法，可以根据某些条件过滤 `Collection`。条件通过 `Predicate`\
    \ 接口指定，它是一个内置函数式接口。它检查输入 `Stream` 中的每个值是否符合 `Predicate` 指定的条件。同样，`Stream` 接口有一个方法\
    \ `map`，可以转换 `Stream` 中的元素。它接受一个 `Function` 实例作为参数，它是一个内置函数式接口。它将 `Function` 接口指定的操作应用到\
    \ `Stream` 中的每个元素。\n\n"
- fmt: "\nFunctional interfaces were added by Java 8 to support lambda expressions\
    \ and add functional programming support to Java. Since Java is an object–oriented\
    \ language, lambda expressions cannot be written on their own. They need to be\
    \ associated with an object. So, Java 8 introduced functional interfaces and made\
    \ it compulsory for lambda expressions to be used only with functional interfaces.\
    \ By making a lambda expression implement a functional interface method, the lambda\
    \ expression becomes an implementation of the functional interface. Functional\
    \ interfaces and lambda expressions together help to write clean and concise Java\
    \ code.\n\n## 209. Explain the syntax of a lambda expression.\n\n**Answer:**\n\
    \nThe following is the syntax of a lambda expression:\n\n`(parameters)–> {lambda\
    \ body}`\n\nSo, a lambda expression consists of the `parameters` to the expression,\
    \ the `lambda operator (–>)` and the `expression body`. A lambda expression can\
    \ receive zero or more parameters. If it does not accept any parameters, an empty\
    \ parenthesis needs to be used. If it accepts a single parameter, the parameter\
    \ need not be specified in parenthesis. If it accepts multiple parameters, they\
    \ need to be specified in parenthesis and separated by commas. The lambda body\
    \ is ordinary Java code and can contain any number of statements. If there is\
    \ a single statement in the lambda body, the curly braces around the body may\
    \ be skipped, otherwise they need to be specified.\n\n## 210. Give some examples\
    \ of lambda expressions.\n\n**Answer:**\n\nThe following are some examples of\
    \ lambda expressions:\n\n**Example 1– Single parameter, No return value**\n\n\
    `str–> System.out.println(str);`\n\nThis lambda expression accepts one parameter\
    \ and uses a `Sysout` statement to print it. It does not return any value.\n\n\
    **Example 2– Multiple parameters and a return value**\n\n`(num1, num2)–> num1+num2;`\n\
    \nThis lambda expression accepts two parameters and returns the result of adding\
    \ them. The `return` keyword is not specified explicitly here.\n\n**Example 3–\
    \ No parameter, lambda body and return value**\n\n```java\n()>(){\n//doing something\
    \ here\nreturn 0;\n}\n```\n\nThis lambda expression does not accept any parameters.\
    \ It has a body that executes some code. It returns the value `0`.\n\n## 211.\
    \ Write a code sample that creates a Functional interface and use a Lambda expression\
    \ to implement it.\n\n**Answer:**\n\nA functional interface is an interface with\
    \ just one abstract method. Consider the following functional interface:\n\n```java\n\
    @FunctionalInterface\npublic interface StringConverter {\n    public String convert(String\
    \ s);\n}\n```\n\nThis code defines a functional interface called `StringConverter`\
    \ with a method called `convert`. The `convert` method accepts a `String` value\
    \ and returns a `String`.\n\nA lambda expression provides an implementation for\
    \ the method in the functional interface.\n\nSo, you can then implement `StringConverter`\
    \ interface using a lambda expression as follows:\n\n```java\nStringConverter\
    \ converter = (str)–> str.toUpperCase();\n```\n\nHere, the `StringConverter` is\
    \ implemented via a lambda expression that converts the input `String` to uppercase\
    \ and returns it.\n\n## 212. Explain with a code sample how the same functional\
    \ interface can be implemented differently using different lambda expressions.\n\
    \n**Answer:**\n\nConsider the following `StringConverter` functional interface:\n\
    \n```java\n@FunctionalInterface\npublic interface StringConverter {\n    public\
    \ String convert(String s);\n}\n```\n\nDifferent implementations can now be provided\
    \ for the `convert` methods via different lambda expressions as follows:\n\n```java\n\
    StringConverter upperCaseconverter = str–> str.toUpperCase();\nString result =\
    \ upperCaseconverter.convert(“Hello”);\n```\n\nHere, the `StringConverter` interface\
    \ is implemented via a lambda expression that converts the input `String` to uppercase\
    \ and returns it.\n\nNow consider the following code:\n\n```java\nStringConverter\
    \ lowerCaseconverter = str–> str.toLowerCase();\nString result = lowerCaseconverter.convert(“Hello”);\n\
    ```\n\nHere, the `StringConverter` interface is implemented via a lambda expression\
    \ that converts the input `String` to lowercase and return it.\n\nSo different\
    \ lambda expressions provide different implementations for the `StringConverter`\
    \ interface.\n\n## 213. Identify the error in the following lambda expression\
    \ and how it can be fixed.\n\n`(str)–> return str.toUpperCase();`\n\n**Answer:**\n\
    \nThe above lambda expression uses the `return` keyword in the lambda body. If\
    \ the `return` keyword is used, the lambda body needs to be included in curly\
    \ brackets. Alternative, the `return` keyword can also be removed in order to\
    \ get rid of the error.\n\nSo, the above lambda expression can be fixed in either\
    \ of the following ways:\n\n```java\n(str)–> {return str.toUpperCase();};\n```\n\
    \nor\n\n```java\n(str)–> str.toUpperCase();\n```\n\n## 214. Is the following code\
    \ valid? Explain.\n\n```java\npublic void generateSquareRoot(int num) {\n    Function<Integer,\
    \ Double> squareRoot = (num)–> Math.sqrt(num);\n}\n```\n\n**Answer:**\n\nThe code\
    \ above specifies a method called `generateSquareRoot`. It accepts as parameter\
    \ an integer value. It then uses the in–built functional interface `Function`\
    \ and implements it via a lambda expression. The code is not valid and causes\
    \ a compilation error. This is because, you cannot declare a parameter or a local\
    \ variable within a lambda expression that has the same name as a variable in\
    \ the enclosing method. The `generateSquareRoot` method accepts a parameter called\
    \ `num` and uses this same name in the lambda expression which causes the compilation\
    \ error. It can be fixed by renaming either the method parameter or the lambda\
    \ expression parameter to something else.\n\n## 215. Write a functional interface\
    \ for which the following lambda expression would work.\n\n`(input)–> input.toUpperCase();`\n\
    \n**Answer:**\n\nThe above code snippet specifies a lambda expression that accepts\
    \ a `String` value, converts it to uppercase and returns it. So, it can be used\
    \ to implement the following functional interface:\n\n```java\n@FunctionalInterface\n\
    public interface Interface1 {\n    public String doSomething(String input);\n\
    }\n```\n\nThis code defines a functional interface called `Interface1`. It has\
    \ a `doSomething` method that accepts as input a `String` and returns a `String`\
    \ value.\n\n## 216. Explain how you can create a new Thread using a lambda expression.\n\
    \n**Answer:**\n\nThe `java.lang.Runnable` interface is used to create a new thread.\
    \ Java 8 has designated this interface as a functional interface and so you can\
    \ implement it using a lambda expression. The following code demonstrates this:\n\
    \n```java\nRunnable r = ()–> {\n    System.out.println(“Starting Thread..”);\n\
    \    //some more code\n};\n\nThread myThread = new Thread(r);\nmyThread.start();\n\
    ```\n\nHere, the `Runnable` interface is implemented via a lambda expression that\
    \ has a simple `Sysout` statement. A new `Thread` object called `myThread` is\
    \ created with this `Runnable` instance. The `myThread.start()` method is invoked\
    \ which then spawns a new `Thread`.\n\n# CHAPTER 03\n\n# Streams\n\n## 217. Explain\
    \ the different ways in which you can create a Stream.\n\n**Answer:**\n\nThere\
    \ are several ways in which you can create a Stream. These are as follows:\n\n\
    a. You can directly create a list from a stream of values as follows:\n\n```java\n\
    Stream<String> values = String.of(“Red, “Blue”);\n```\n\nb. You can create a Stream\
    \ from a collection as follows:\n\n```java\nList<Integer> numbers = Arrays.asList(1,2,3,4);\n\
    Stream<Integer> stream = numbers.stream();\n```\n\nc. You can create a Stream\
    \ from an array as follows:\n\n```java\nint[] numbers = new int[] {1,2,3,4};\n\
    IntStream arrayStream= Arrays.stream(numbers);\n```\n\n## 218. Explain the Stream\
    \ filter operation with a code sample.\n\n**Answer:**\n\nThe `Stream.filter()`\
    \ operation can be used to filter a `Stream` based on some condition. So, it creates\
    \ a new `Stream` that consists of only those elements that match the specified\
    \ condition. It accepts as parameter a `Predicate` instance and filters the elements\
    \ in the stream based on the specified predicate. The following code demonstrates\
    \ this:\n\n```java\nStream<Integer> numbers = Stream.of(7,3,9,6,1);\nStream<Integer>\
    \ output = numbers.filter(num–> num > 5);\n```\n"
  raw: 'Functional interfaces were added by Java 8 to support lambda expressions and
    add functional programming support to Java. Since Java is an object–oriented language,
    lambda expressions cannot be written on their own. They need to be associated
    with an object. So, Java 8 introduced functional interfaces and made it compulsory
    for lambda expressions to be used only with functional interfaces. By making a
    lambda expression implement a functional interface method, the lambda expression
    becomes an implementation of the functional interface. Functional interfaces and
    lambda expressions together help to write clean and concise Java code.


    209. Explain the syntax of a lambda expression.


    Answer:


    The following is the syntax of a lambda expression:


    (parameters)–> {lambda body}


    So, a lambda expression consists of the **parameters** to the expression, the
    **lambda operator (–>)** and the **expression body**. A lambda expression can
    receive zero or more parameters. If it does not accept any parameters, an empty
    parenthesis needs to be used. If it accepts a single parameter, the parameter
    need not be specified in parenthesis. If it accepts multiple parameters, they
    need to be specified in parenthesis and separated by commas. The lambda body is
    ordinary Java code and can contain any number of statements. If there is a single
    statement in the lambda body, the curly braces around the body may be skipped,
    otherwise they need to be specified.


    210. Give some examples of lambda expressions.


    Answer:


    The following are some examples of lambda expressions:


    **Example 1– Single parameter, No return value**


    str–> System.out.println(str);


    This lambda expression accepts one parameter and uses a Sysout statement to print
    it. It does not return any value.


    **Example 2– Multiple parameters and a return value**


    (num1, num2)–> num1+num2;


    This lambda expression accepts two parameters and returns the result of adding
    them. The return keyword is not specified explicitly here.


    **Example 3– No parameter, lambda body and return value**


    ()–>{


    //doing something here


    return 0;


    }


    This lambda expression does not accept any parameters. It has a body that executes
    some code. It returns the value 0.


    211. Write a code sample that creates a Functional interface and use a Lambda
    expression to implement it.


    Answer:


    A functional interface is an interface with just one abstract method. Consider
    the following functional interface:


    @FunctionalInterface


    public interface StringConverter {


    public String convert(String s);


    }


    This code defines a functional interface called StringConverter with a method
    called convert. The convert method accepts a String value and returns a String.


    A lambda expression provides an implementation for the method in the functional
    interface.


    So, you can then implement StringConverter interface using a lambda expression
    as follows:


    StringConverter converter = (str)–> str.toUpperCase();


    Here, the StringConverter is implemented via a lambda expression that converts
    the input String to uppercase and returns it.


    212. Explain with a code sample how the same functional interface can be implemented
    differently using different lambda expressions.


    Answer:


    Consider the following StringConverter functional interface:


    @FunctionalInterface


    public interface StringConverter {


    public String convert(String s);


    }


    Different implementations can now be provided for the convert methods via different
    lambda expressions as follows:


    StringConverter upperCaseconverter = str–> str.toUpperCase();


    String result = upperCaseconverter.convert(“Hello”);


    Here, the StringConverter interface is implemented via a lambda expression that
    converts the input String to uppercase and returns it.


    Now consider the following code:


    StringConverter lowerCaseconverter = str–> str.toLowerCase();


    String result = lowerCaseconverter.convert(“Hello”);


    Here, the StringConverter interface is implemented via a lambda expression that
    converts the input String to lowercase and return it.


    So different lambda expressions provide different implementations for the StringConverter
    interface.


    213. Identify the error in the following lambda expression and how it can be fixed.


    (str)–> return str.toUpperCase();


    Answer:


    The above lambda expression uses the return keyword in the lambda body. If the
    return keyword is used, the lambda body needs to be included in curly brackets.
    Alternative, the return keyword can also be removed in order to get rid of the
    error.


    So, the above lambda expression can be fixed in either of the following ways:


    (str)–> {return str.toUpperCase();};


    or


    (str)–> str.toUpperCase();


    214. Is the following code valid? Explain.


    public void generateSquareRoot(int num) {


    Function<Integer, Double> squareRoot = (num)–> Math.sqrt(num);


    }


    Answer:


    The code above specifies a method called generateSquareRoot. It accepts as parameter
    an integer value. It then uses the in–built functional interface Function and
    implements it via a lambda expression. The code is not valid and causes a compilation
    error. This is because, you cannot declare a parameter or a local variable within
    a lambda expression that has the same name as a variable in the enclosing method.
    The generateSquareRoot method accepts a parameter called num and uses this same
    name in the lambda expression which causes the compilation error. It can be fixed
    by renaming either the method parameter or the lambda expression parameter to
    something else.


    215. Write a functional interface for which the following lambda expression would
    work.


    (input)–> input.toUpperCase();


    Answer:


    The above code snippet specifies a lambda expression that accepts a String value,
    converts it to uppercase and returns it. So, it can be used to implement the following
    functional interface:


    @FunctionalInterface


    public interface Interface1 {


    public String doSomething(String input);


    }


    This code defines a functional interface called Interface1. It has a doSomething
    method that accepts as input a String and returns a String value.


    216. Explain how you can create a new Thread using a lambda expression.


    Answer:


    The java.lang.Runnable interface is used to create a new thread. Java 8 has designated
    this interface as a functional interface and so you can implement it using a lambda
    expression. The following code demonstrates this:


    Runnable r = ()–> {


    System.out.println(“Starting Thread..”);


    //some more code


    };


    Thread myThread = new Thread(r);


    myThread.start();


    Here, the Runnable interface is implemented via a lambda expression that has a
    simple Sysout statement. A new Thread object called myThread is created with this
    Runnable instance. The myThread.start() method is invoked which then spawns a
    new Thread.


    # [CHAPTER 03](#toc.xhtml_ss023a)


    # [Streams](#toc.xhtml_ss023a)


    217. Explain the different ways in which you can create a Stream.


    Answer:


    There are several ways in which you can create a Stream. These are as follows:


    a. You can directly create a list from a stream of values as follows:


    Stream<String> values = String.of(“Red, “Blue”);


    b. You can create a Stream from a collection as follows:


    List<Integer> numbers = Arrays.asList(1,2,3,4);


    Stream<Integer> stream = numbers.stream();


    c. You can create a Stream from an array as follows:


    int[] numbers = new int[] {1,2,3,4};


    IntStream arrayStream= Arrays.stream(numbers);


    218. Explain the Stream filter operation with a code sample.


    Answer:


    The Stream.filter() operation can be used to filter a Stream based on some condition.
    So, it creates a new Stream that consists of only those elements that match the
    specified condition. It accepts as parameter a Predicate instance and filters
    the elements in the stream based on the specified predicate. The following code
    demonstrates this:


    Stream<Integer> numbers = Stream.of(7,3,9,6,1);


    Stream<Integer> output = numbers.filter(num–> num > 5);'
