    a static variable from a non–static method.


    189. Explain symmetric equals() contract.


    Answer:


    Suppose that there are two objects v1 and v2\. If v1.equals(v2) returns true then
    v2.equals(v1) must return true. This equals() contract is called as symmetric
    contract. Consider the following code:


    Object v1; Object v2;


    v1.equals(v2); //Line 1


    v2.equals(v1); //Line 2


    So, in case of a symmetric contract, Line 1 returns true if and only if Line 2
    returns true.


    190. Which of the following are invalid statements and why?


    System.out.println(2+2); //line 1


    int i= 2+’2’; //line 2


    String s= “one”+’two’; //line 3


    byte b=256; //line 4


    Answer:


    Line 1 and line 2 are valid statements.


    Line 3 is invalid. The value **two** is not valid since single quotes cannot be
    used for a String, they can only be used for a character constant. Strings need
    to be enclosed in double quotes.


    Line 4 is invalid. The byte variable **b** cannot be assigned the value 256 since
    it is out of the range of a byte.


    191. What is the use of transient keyword?


    Answer:


    The transient keyword can be specified on an instance variable. Specifying transient
    for an instance variable indicates that its state should not be saved when the
    object is serialized. Consider the following code snippet:


    class Electronics implements Serializable {


    transient private int price; //Line 1


    private int quantity; //Line 2


    }


    When an instance of the Electronics class is serialized, the price field will
    not be serialized, only the quantity field will be serialized.


    192. What is Garbage Collection in Java?


    Answer:


    Garbage collection is the process of freeing memory allocated to objects that
    are no longer used. During runtime, when an object is created, the JVM allocates
    some memory to hold the object. The JVM periodically checks for objects that are
    in use and de–allocates the memory for those objects which are not in use anymore.
    Garbage collection is this process of removing objects that are no longer in use.
    So, the programmer does not have to bother about manual de–allocation of memory.


    193. Which part of the memory is used in Garbage Collection? Which algorithm does
    the JVM use for Garbage collection?


    Answer:


    Garbage Collection is done in the heap memory. The JVM uses the mark and sweep
    algorithm internally for garbage collection.


    194. When does garbage collection occur?


    Answer:


    The JVM (Java Virtual Machine) controls the garbage collection process. So, the
    JVM decides when the garbage collection process should run.


    It is also possible to explicitly request garbage collection through Java code
    via the System.gc() or Runtime.getRuntime().gc() method. However, there is no
    guarantee that invoking these methods will run the garbage collector.


    195. What code needs to be written in order to trigger garbage collection?


    Answer:


    Garbage collection can be triggered in one of the following ways:


    **Method 1– Using** **Runtime.gc()** **as follows:**


    Runtime runTime = Runtime.getRuntime();


    runTime.gc();


    **Method 2– Using** System.gc() **as follows:**


    System.gc();


    Both these approaches do not guarantee garbage collection, it is up–to the JVM
    to actually decide when to run the garbage collector


    196. Explain with a code sample how an object becomes eligible for garbage collection.


    Answer:


