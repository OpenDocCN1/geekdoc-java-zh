    030. What are the possible ways to assign a decimal number to a float variable?


    Answer:


    The following are the ways in which a decimal number can be assigned to a float
    variable:


    float fValue1 = 100.5f;


    float fValue2 = 100.5F;


    float fValue3 = (float) 100.5;


    A decimal number is treated as a double by default. So, in order to assign it
    to a float variable, it needs to be either followed with **‘f’** or **‘F’** or
    it should be explicitly be cast as a float type.


