    \ `finally` 块无论是否发生错误总是执行的，控制随后转移到第 5 行的 `finally` 块并打印 `I am done`。接下来，控制转移到\
    \ `finally` 块之外的第 6 行，代码打印 `Thank You!!`。\n\n### 127. 假设你有一个名为 `myMethod` 的方法，包含可能会抛出检查异常（checked\
    \ Exception）的代码。你如何在代码中处理它？\n\n**答案：**\n\n如果方法抛出检查异常，有两种处理方式：\n\na. 在方法体中使用 `try/catch`，如下：\n\
    \n```java\npublic void myMethod(){\n    try {\n        // 此处代码\n    } catch (CheckedException\
    \ e) {\n    }\n}\n```\n\n在这里，当代码抛出 `CheckedException` 时，它会被方法内部的 `catch` 块捕获。\n\
    \nb. 在方法声明中使用 `throws` 子句：\n\n```java\npublic void myMethod () throws CheckedException{\n\
    \    // 此处代码\n}\n```\n\n在这里，当代码抛出 `CheckedException` 时，通过 `throws` 子句抛到方法外部。因此，调用方法的代码需要处理该异常。\n\
    \n### 128. “finally”子句的作用是什么？请举例。\n\n**答案：**\n\n无论是否发生异常，任何始终需要执行的代码都应该放在 `finally`\
    \ 子句中。例如，关闭数据库连接、文件系统或其他资源的清理代码可以放在 `finally` 子句中。如果将此类代码放在 `try` 块中，一旦发生异常，它可能无法执行。为了确保此类代码执行，它需要放在\
    \ `finally` 块中。\n\n### 129. 解释 Error（错误）和 Exception（异常）之间的区别。\n\n**答案：**\n\n`java.Throwable`\
    \ 是所有异常类的父类。它有两个子类：`Exception` 和 `Error`。它们之间存在若干区别：\n\n- `Exception` 代表程序本身引起的程序错误，如访问空值、除以\
    \ 0、写入文件时出错等。`Error` 代表发生在代码之外环境中的错误，如内存不足等。\n- `Exception` 是应用程序可以处理并恢复的状况。`Error`\
    \ 是应用程序无法恢复的异常状态。\n- `Exception` 既有检查的（checked）也有未检查的（unchecked）。检查异常需要在方法声明中通过\
    \ `throws` 子句指定。错误始终是未检查的，不需要声明。\n\n### 130. 什么是 RuntimeException？\n\n**答案：**\n\
    \n`java.lang.RuntimeException` 是 `java.lang.Exception` 类的子类。`RuntimeException`\
    \ 及其子类也称为未检查异常（unchecked exceptions）。这是因为编译器不会强制你处理此类异常。因此，即使编写可能会抛出未检查异常的代码，编译器也不会报错。`RuntimeException`\
    \ 的示例包括 `ArithmeticException`、`NullPointerException` 和 `ArrayIndexOutOfBoundsException`。\n"
