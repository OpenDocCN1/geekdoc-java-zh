  trans: "\n\n# 什么是 `Optional`？为什么 Java 8 引入了它？\n# 如何创建 `Optional`？\n# 请用代码示例解释 `Optional.ifPresent`\
    \ 方法。\n# `orElse` 和 `orElseThrow` 方法之间有什么区别？\n# 下面代码段的输出是什么？\n\n## 集合改进 (Collection\
    \ Improvements)\n### 请用代码示例解释 `forEach` 方法是如何工作的。\n### Java 8 对 `List` 接口做了哪些改进？\n\
    ### `Map.getOrDefault` 方法是如何工作的？\n 下面代码段的输出是什么？\n### 解释 `Iterator` 和 `SplitIterator`\
    \ 之间的区别。\n\n## 其他 (Miscellaneous)\n### `CompletableFuture` 类相比 `Future` 接口有哪些优势？\n\
    ### 什么是 `StringJoiner`？请用代码示例解释。\n### 解释 `Comparator.reverse` 和 `Comparator.reverseOrder`\
    \ 方法之间的区别。\n### Identify 下方代码中的错误，并说明需要如何修复。\n### 解释 `CompletableFuture.runAsync`\
    \ 和面 CompletableFuture.supplyAsync` 方法之间的区别。\n\n# 第 3 部分 – Java 9\n\n## 模块 (Modules)\n\
    ### 什么是模块？它们提供了什么好处？\n### 什么是模块描述符（module descriptor）？\n### 包（package）和模块（module）之间的区别是什么？\n\
    ### 解释 Java 9 对 JDK 所做的更改。\n考虑以下代码段：\n为了让这段代码作为模块的一部分部署，需要完成什么？\n### 解释 `requires\
    \ static` 模块指令。什么情况下应该它？\n\n## 流/集合改进 (Stream/Collection Improvements)\n### Java\
    \ 9 对 `Stream` 接口做了哪些改进？\n 下面代码有效吗？如果没有，可以如何修复？\n### 识别下方代码段中的问题，并说明如何修复。\n###\
    \ 你可以使用哪个 Java 9 方法创建一个包含 `String` 值的 `Set`？\n 下面代码段的输出是什么？\n\n## 其他 (Miscellaneous)\n\
    ### Java 9 对接口做了哪些更改？为什么？\n### 什么是 `JShell`？\n 下面代码段的输出是什么？\n### Java 9 对 `try–with`\
    \ 语句做了哪些更改？\n### Java 9 在 `Optional` 类中添加的 `stream` 方法用途是什么？\n### 解释 `ProcessHandle`\
    \ 类及其一些重要方法。\n在下方代码段中，说明第 1 行应该使用什么代码来打印下方“预期输出”部分中的内容：\n### Java 9 引入的新型 `HttpClient`\
    \ 有哪些优势？\n\n# 场景题 (Scenario Based Questions)\n### 假设你通过扩展 `Thread` 类创建了一个新线程并多次调用\
    \ `start` 方法。你认为会发生什么？\n### 假设你有一个返回整数值的方法。代码位于 `try/catch/finally` 块中。`try`、`catch`\
    \ 和 `finally` 块中都有 `return` 语句。`try` 块中的 `return` 返回 `1`，`catch` 块返回 `-1`，`finally`\
    \ 块返回 `0`。如果发生异常，将返回哪个值？\n### 假设 `Base` 类中有一个 `static` 方法。假设在 `sub–class` 中有一个同名方法。假设你创建了一个\
    \ `Base` 类对象并将其赋值为 `sub–class` 对象的引用，然后调用该 `static` 方法。这有效吗？如果是，调用的是哪个版本的 `static`\
    \ 方法？\n### 假设基类中有一个方法抛出 `ArrayIndexOutOfBoundsException`。假设该方法在 `sub–class` 中被重写并声明抛出\
    \ `RuntimeException`。你认为会发生什么？\n### 假设你有一个对象 `List`。你想将其作为参数发送给客户端应用程序，但想确保客户端不要对其进行修改。你如何实现这一点？\n\
    ### 假设你正在从数据库读取 10000 个 `String` 值。你需要创建一个包含这些值的拼接后的 `String`。实现这一目标最高效的方法是什么？\n\
    ### 假设你正在开发一个涉及大量极大数值计算的应用。考虑到精度很重要，你会使用什么数据类型作为变量？\n### 假设你正在开发一个多线程应用程序。现在有一个新需求，你需要存储键值对。在这种情况下最合适的\
    \ `Collection` 是哪一个？\n### 假设需要在应用程序中创建一些工具方法。创建此类方法的最佳实践是什么？你应该把它们放在哪里？\n### 假设你作为\
    \ API 的一部分开发了一个 `FileWriter` 接口。它有一个 `writeToCsv` 方法，可将传入的内容写入 CSV 文件。该 API 由不同的应用程序实现，这些程序为\
    \ `FileWriter` 接口提供了实现。现在，假设需要在接口中添加一个名为 `writeToExcel` 的新方法，将传入的内容写入 Excel 文件。你如何进行这一更改以对对\
    \ API 用户产生最小的影响？\n\n# 第 4 部分 – 人力资源 (Human Resource)\n\n## 创意 (Creativity)\n###\
    \ 你在哪里寻找灵感？\n### 你如何在工作中发挥创意？\n### 你如何促使他人创造创意？\n### 描述你的创造力。\n\n## 领导力 (Leadership)\n\
    ### 在工作中你倾向于获得权力还是更多的责任？\n### 当小组中有人没有尽到职责时你会怎么办？\n### 请 true 你做过超出权限范围的决策。\n\
    ### 你乐意向主管汇报纠纷吗？\n### 如果你在上一份工作中担任负责人，你会做哪些不同的改变？\n### 你认为雇主是否应对表现优秀的员工进行表扬或奖励？\n\
    ### 你认为领导者具备最重要的特质是什么？\n### 请讲述一次出现意外问题。你是如何处理的？\n### 能否举一个例子，说明你在之前的工作中改进了某个目标？\n\
    ### 请讲述一次主管对项目没有提供足够具体的指导的情况。\n### 请讲述你领导一个项目的经历。\n### 请讲述你向前雇主提出的一个建议，该建议后来被实施了。\n\
    ### 请讲述一次你想到工作中的某事可以更高效完成的方法的情况。\n\n"
