    \ 类有一个 `valueOf` 方法。可以使用它将整数转换为字符串：`String str = String.valueOf(10);`\n\nc. 使用\
    \ `Integer.toString`：`Integer` 类有一个 `toString` 方法。这也可以用于将整数转换为字符串：`String str2\
    \ = new Integer(10).toString();`\n\n### 141. 编译以下代码会发生什么？\n\n```java\nclass Mammal\
    \ {}\nclass Cat extends Mammal {}\nList<Mammal> list = new ArrayList<Cat>();\n\
    ```\n\n**答案：**\n\n此代码将无法编译。这是因为 `List` 指定的是 `Mammal`，而 `ArrayList` 指定的是 `Cat`。变量声明的类型必须匹配。\n\
    \n### 142. 以下代码的第 1 行可以编译吗？如果不，请说明原因。\n\n```java\nclass Mammal {}\nclass Cat extends\
    \ Mammal {}\nList<? super Mammal> mList = new ArrayList<Cat>(); // 第 1 行\n```\n\
    \n**答案：**\n\n第 1 行会导致编译错误。这是因为 `Cat` 位于层级结构中较低的位置。`Mammal` 是父类。因此，只有将 `<Cat>`\
    \ 替换为 `<Mammal>`，上述代码才能编译。\n\n### 143. 解释以下代码的问题。\n\n`List<?> mylist = new ArrayList<?\
    \ extends Mammal>();`\n\n**答案：**\n\n上述代码创建一个名为 `mylist` 的 `List`。它在声明中使用了通配符 `?`。这是错误的，因为通配符不能用于声明部分。泛型的通配符符号只允许用于方法参数或返回值。\n\
    \n### 144. 解释使以下代码片段有效需要哪些额外的代码：\n\n`public void getList(T t)`\n\n**答案：**\n\n\
    这段代码声明了一个带有泛型参数的方法 getList。为了使这段代码有效，该方法必须位于接受泛型类型的类内部：\n\n```java\npublic class\
    \ MyClass<T> {\n    public void getList(T t) {\n    }\n}\n```\n\n### 145. 使用代码示例解释边界泛型类型。\n\
    \n**答案：**\n\n边界泛型类型有助于限制可以作为泛型参数的类型。以下代码演示了这一点：\n\n```java\npublic class Shape\
    \ {\n}\n\npublic class Circle extends Shape {\n}\n\npublic class ShapeDrawer<T\
    \ extends Shape> {\n    public void drawShape(T shape) {\n        System.out.println(“Drawing\
    \ Shape..”);\n    }\n}\n```"
- fmt: "\n# 146. What are the four main interfaces in the Java Collection API.\n\n\
    Answer:\n\n`java.util.Collection` is the top level interface in the Java Collection\
    \ API. It simply represents a group of values operated as one unit. It has two\
    \ main sub–interfaces `Set` and `List`. Both are used to store a group of values;\
    \ however, they differ slightly in the way they store data.\n\nA `List` allows\
    \ duplicate elements i.e. the same element can be present more than once. Also,\
    \ a `List` is ordered i.e. elements in a list are stored in the order in which\
    \ they are inserted & this order is maintained.\n\nA `Set` does not allow duplicates\
    \ & is unordered so the order in which the elements are inserted into the `Set`\
    \ will not be maintained.\n\nThere is another top–level interface called `Map`.\
    \ A `Map` is used to store key–value pairs.\n\n# 147. How will you search for\
    \ a specific element in an array?\n\nAnswer:\n\nJava provides the `java.util.Arrays`\
    \ class as part of the Collection framework. This has several utility methods.\
    \ One such method is the `Arrays.binarySearch` method which can be used to search\
    \ for a specific element in an array. It returns an integer which specifies the\
    \ position of the element being searched if present. Otherwise, it returns–1.\
    \ The following code demonstrates the `binarySearch()` method:\n\n```\nString\
    \ [] strArr = {“one”, “two”, “four”};\nSystem.out.println(“Search index of one\
    \ is: ”+Arrays.binarySearch(strArr, “one”));\n```\n\nThis code prints the following\
    \ output:\nSearch index of one is:0\n\nSince the `String` `one` is at position\
    \ `0`, so the `binarySearch()` method returns `0.`\n\n# 148. Which collection\
    \ would you choose if do not want duplicates and do not care about the order?\n\
    \nAnswer:\n\n`HashSet` should be used if you want to avoid duplicates and do not\
    \ care about the order. `HashSet` is an implementation of the `Set` interface.\
    \ It is unsorted and unordered. In addition, `TreeSet` and `LinkedHashSet` are\
    \ also `Set` implementations. Both of these do not allow duplicates. However,\
    \ `TreeSet` maintains the sorting order while `LinkedHashSet` maintains the insertion\
    \ order.\n\n# 149. Explain with a code sample how you can remove the head of a\
    \ queue.\n\nAnswer:\n\nThe interface `Queue` has a method called `poll()` which\
    \ is used to remove the head of the queue. The following code demonstrates this:\n\
    \n```\nQueue<Integer> lList = new LinkedList<Integer>();\nlList.add(100);\nlList.add(200);\n\
    System.out.println(“Removed– “:lList.poll()); // Line 1\n```\n\nThis code creates\
    \ a `Queue` and adds two integer values to it. It then invokes the `poll()` method.\
    \ So, this code prints the following output:\nThe Element removed is: 100\n\n\
    So, the `poll()` method always removes the head of the queue i.e. the first element\
    \ added in the queue.\n\n# 150. Which collection implementation allows growing\
    \ or shrinking its size and provides indexed access to its elements?\n\nAnswer:\n\
    \n`ArrayList` is an implementation of the `List` interface. It allows growing\
    \ or shrinking its size. It has `add/remove` methods that increase or decrease\
    \ the size of the `List`. It also provides indexed access to its elements. It\
    \ has a `get` method to achieve this. The following code demonstrates an `ArrayList`:\n\
    \n```\nList<Integer> myList = new ArrayList<Integer>();\nmyList.add(2);\nmyList.add(4);\n\
    myList.add(6);\nmyList.remove(1);\nInteger num = myList.get(0);\n```\n\n# 151.\
    \ Explain the Queue interface.\n\nAnswer:\n\nThe `Queue` interface is part of\
    \ the Collection API and extends the `java.util.Collection` interface. In addition\
    \ to Collection operations, `Queue` provide features of a queue data structure\
    \ like FIFO (First in First Out). The `Queue` interface has several methods that\
    \ allow queue operations:\n\n- `peek()`: allows inspecting the element at the\
    \ top of the queue\n- `poll()`: removes the element at the top of the queue\n\
    - `offer()`: insert an element into the queue\n\n# 152. Explain the Comparator\
    \ interface.\n\nAnswer:\n\n`Comparator` is an interface that can be used for sorting.\
    \ It has been designated as a functional interface since Java 8. It has a single\
    \ abstract method called `compare`. The `compare` method accepts two objects and\
    \ returns a boolean value that is the result of comparison. `Comparator` can also\
    \ be used to sort custom object. For this, the corresponding class needs to implement\
    \ the `Comparator` interface and provide an implementation for the `compare` method.\
    \ If you are using Java 8 or a higher version, you can also implement a `Comparator`\
    \ using a lambda expression.\n\n# 153. Explain some of the methods on the Queue\
    \ Interface.\n\nAnswer:\n\nThe following are some of the methods on the Queue-Interface:\n\
    \na. `offer(E e)`: This adds an object to the queue. It does not throw an Exception\
    \ if it is not possible to add the object to the queue.\nb. `peek()`: This returns\
    \ the last added object in the queue.\nc. `poll()`: This returns the last added\
    \ object in the queue and removed it from the queue.\nd. `remove(Object O)`: This\
    \ removes the object from the queue.\ne. `add(E e)`: This adds an object to the\
    \ queue. This method throws an Exception if it is not possible to add the object\
    \ to the queue.\n\n# 154. Is it possible to mix generic and non–generic collections?\
    \ If so, give example.\n\nAnswer:\n\nYes, it is possible to mix generic and non–generic\
    \ collections. The following code snippet demonstrates this:\n\n```\npublic void\
    \ insertDouble() {\n    List<Double> myDoubleList = new ArrayList<Double>();\n\
    \    myDoubleList.add(2.0); // Line 1\n    myDoubleList.add(4.0); // Line 2\n\
    \    insertSomethingElse(myDoubleList);\n}\n\npublic void insertSomethingElse(List\
    \ myDoubleList) {//Line 3\n    myDoubleList.add(“Hello World”); //Line 4\n}\n\
    ```\n\nIn the above code, Line 1 and Line 2 add double literals to the list which\
    \ is a `List` with generic `Double` specified. The code then invoked the `insertSomethingElse()`\
    \ method with this double List. In the method declaration at Line 3, the generic\
    \ type is not specified for the `myDoubleList` variable. So, any type of value\
    \ can be added to this `List`. Line 4 adds a string literal into the `List`.\n\
    \n# 155. What are some of the important methods on the Collection interface?\n\
    \nAnswer:\n\nThe following are some of the important methods on the Collection\
    \ interface:\n\na. `add`: Allows adding an object to the collection\nb. `remove`:\
    \ Allows removing an object from the collection\nc. `contains`: Allows checking\
    \ if an object is present in the collection\nd. `size`: Returns the length of\
    \ the collection\ne. `iterate`: Allows iterating over the collection\n\n# CHAPTER\
    \ 15\n\n# Enumerations, Autoboxing and Wrapper Classes\n\n# 156. What are the\
    \ wrapper classes available in Java?\n\nAnswer:\n\nWrapper classes are classes\
    \ that correspond to the Java primitive types. They help to convert primitive\
    \ types to objects and vice versa. This is particularly useful when you want to\
    \ use Collections. Since a Collection does not accept primitive values, you can\
    \ use the corresponding wrapper type. Most of the wrapper classes take their primitive\
    \ type or String as an argument. Java supports the following wrapper classes:\n\
    \n| Primitive Type | Wrapper Type |\n| :--- | :--- |\n| byte | Byte |\n| short\
    \ | Short |\n| int | Integer |\n| long | Long |\n| float | Float |\n| double |\
    \ Double |\n| char | Character |\n| boolean | Boolean |\n\n# 157. What will be\
    \ the output of the following code?\n\n```\npublic class BooleanDemo {\n    public\
    \ static void main(String a[]){\n        //create Boolean using boolean primitive\
    \ type\n        boolean boo1 = true;\n        Boolean booObj1 = new Boolean (boo1);\
    \ //line 1\n        System.out.println(“Wrapper class Boolean output: “+booObj1);\n\
    \n        Boolean booObj2 = new Boolean (“false”); //line 2\n        System.out.println(“Wrapper\
    \ class Boolean output: “+booObj2);\n\n        System.out.println(booObj1.booleanValue());\n\
    \    }\n}\n```\n\nAnswer:\n\nLine 1 creates a boolean wrapper type `booObj1` corresponding\
    \ to the `boo` variable. Line 2 creates a boolean wrapper `booObj2` using a String\
    \ value. Java automatically converts wrapper types to primitive types. In addition,\
    \ there is a method called `booleanValue()` on the `Boolean` wrapper class that\
    \ returns the primitive boolean value. So, this code will print the following\
    \ output:\n"
  raw: '146. What are the four main interfaces in the Java Collection API.


    Answer:


    **java.util.Collection** is the top level interface in the Java Collection API.
    It simply represents a group of values operated as one unit. It has two main sub–interfaces
    Set and List. Both are used to store a group of values; however, they differ slightly
    in the way they store data.


    A List allows duplicate elements i.e. the same element can be present more than
    once. Also, a List is ordered i.e. elements in a list are stored in the order
    in which they are inserted & this order is maintained.


    A Set does not allow duplicates & is unordered so the order in which the elements
    are inserted into the Set will not be maintained.


    There is another top–level interface called Map. A Map is used to store key–value
    pairs.


    147. How will you search for a specific element in an array?


    Answer:


    Java provides the java.util.Arrays class as part of the Collection framework.
    This has several utility methods. One such method is the Arrays.binarySearch method
    which can be used to search for a specific element in an array. It returns an
    integer which specifies the position of the element being searched if present.
    Otherwise, it returns–1. The following code demonstrates the binarySearch() method:


    String [] strArr = {“one”, “two”, “four”};


    System.out.println(“Search index of one is:


    ”+Arrays.binarySearch(strArr, “one”));


    This code prints the following output:


    Search index of one is:0


    Since the String one is at position **0**, so the binarySearch() method returns
    **0.**


    148. Which collection would you choose if do not want duplicates and do not care
    about the order?


    Answer:


    HashSet should be used if you want to avoid duplicates and do not care about the
    order. HashSet is an implementation of the Set interface. It is unsorted and unordered.
    In addition, TreeSet and LinkedHashSet are also Set implementations. Both of these
    do not allow duplicates. However, TreeSet maintains the sorting order while LinkedHashSet
    maintains the insertion order.


    149. Explain with a code sample how you can remove the head of a queue.


    Answer:


    The interface Queue has a method called poll() which is used to remove the head
    of the queue. The following code demonstrates this:


    Queue<Integer> lList = new LinkedList<Integer>();


    lList.add(100);


    lList.add(200);


    System.out.println(“Removed– “:lList.poll()); // Line 1


    This code creates a Queue and adds two integer values to it. It then invokes the
    poll() method. So, this code prints the following output:


    The Element removed is: 100


    So, the poll() method always removes the head of the queue i.e., the first element
    added in the queue.


    150. Which collection implementation allows growing or shrinking its size and
    provides indexed access to its elements?


    Answer:


    ArrayList is an implementation of the List interface. It allows growing or shrinking
    its size. It has add/remove methods that increase or decrease the size of the
    List. It also provides indexed access to its elements. It has a get method to
    achieve this. The following code demonstrates an ArrayList:


    List<Integer> myList = new ArrayList<Integer>();


    myList.add(2);


    myList.add(4);


    myList.add(6);


    myList.remove(1);


    Integer num = myList.get(0);


    151. Explain the Queue interface.


    Answer:


    The Queue interface is part of the Collection API and extends the java.util.Collection
    interface. In addition to Collection operations, Queue provide features of a queue
    data structure like FIFO (First in First Out). The Queue interface has several
    methods that allow queue operations:


    **peek()**: allows inspecting the element at the top of the queue


    **poll()**: removes the element at the top of the queue


    **offer()**: insert an element into the queue


    152. Explain the Comparator interface.


    Answer:


    Comparator is an interface that can be used for sorting. It has been designated
    as a functional interface since Java 8\. It has a single abstract method called
    compare. The compare method accepts two objects and returns a boolean value that
    is the result of comparison. Comparator can also be used to sort custom object.
    For this, the corresponding class needs to implement the Comparator interface
    and provide an implementation for the compare method. If you are using Java


    8 or a higher version, you can also implement a Comparator using a lambda expression.


    153. Explain some of the methods on the Queue Interface.


    Answer:


    The following are some of the methods on the Queue Interface:


    a. **offer(E e)**: This adds an object to the queue. It does not throw an Exception
    if it is not possible to add the object to the queue.


    b. **peek()**: This returns the last added object in the queue.


    c. **poll()**: This returns the last added object in the queue and removed it
    from the queue.


    d. **remove(Object O)**: This removes the object from the queue.


    e. **add(E e)**: This adds an object to the queue. This method throws an Exception
    if it is not possible to add the object to the queue.


    154. Is it possible to mix generic and non–generic collections? If so, give example.


    Answer:


    Yes, it is possible to mix generic and non–generic collections.The following code
    snippet demonstrates this:


    public void insertDouble() {


    List<Double> myDoubleList = new ArrayList<Double>();


    myDoubleList.add(2.0); // Line 1


    myDoubleList.add(4.0); // Line 2


    insertSomethingElse(myDoubleList);


    }


    public void insertSomethingElse(List myDoubleList) {//Line 3


    myDoubleList.add(“Hello World”); //Line 4


    }


    In the above code, Line 1 and Line 2 add double literals to the list which is
    a List with generic Double specified. The code then invoked the insertSomethingElse()
    method with this double List. In the method declaration at Line 3, the generic
    type is not specified for the myDoubleList variable. So, any type of value can
    be added to this List. Line 4 adds a string literal into the List.


    155. What are some of the important methods on the Collection interface?


    Answer:


    The following are some of the important methods on the Collection interface:


    a. **add**: Allows adding an object to the collection


    b. **remove**: Allows removing an object from the collection


    c. **contains**: Allows checking if an object is present in the collection


    d. **size**: Returns the length of the collection


    e. **iterate**: Allows iterating over the collection


    # [CHAPTER 15](#toc.xhtml_ss016a)


    # [Enumerations, Autoboxing and Wrapper Classes](#toc.xhtml_ss016a)


    156. What are the wrapper classes available in Java?


    Answer:


    Wrapper classes are classes that correspond to the Java primitive types. They
    help to convert primitive types to objects and vice versa. This is particularly
    useful when you want to use Collections. Since a Collection does not accept primitive
    values, you can use the corresponding wrapper type. Most of the wrapper classes
    take their primitive type or String as an argument. Java supports the following
    wrapper classes:


    | **Primitive Type** | **Wrapper Type** |


    | byte | Byte |


    | short | Short |


    | int | Integer |


    | long | Long |


    | float | Float |


    | double | Double |


    | char | Character |


    | boolean | Boolean |


    157. What will be the output of the following code?


    public class BooleanDemo {


    public static void main(String a[]){


    //create Boolean using boolean primitive type


    boolean boo1 = true;


    Boolean booObj1 = new Boolean (boo1); //line 1


    System.out.println(“Wrapper class Boolean output: “+booObj1);


    Boolean booObj2 = new Boolean (“false”); //line 2


    System.out.println(“Wrapper class Boolean output: “+booObj2);


    System.out.println(booObj1.booleanValue());


    }


    }


    Answer:


    Line 1 creates a boolean wrapper type boolObj1 corresponding to the bool variable.
    Line 2 creates a boolean wrapper boolObj2 using a String value. Java automatically
    converts wrapper types to primitive types. In addition, there is a method called
    booleanValue() on the Boolean wrapper class that returns the primitive boolean
    value. So, this code will print the following output:'
