    \n# [Packages and Access Control](#toc.xhtml_ss011a)\n\n### 111. What is a package?\
    \ What are the advantages of packages?\n\nAnswer:\n\nA package is a collection\
    \ of related Java types. So, a package can include related classes, interfaces\
    \ and enumerations. Having a package has several advantages as follows:\n\n• Packages\
    \ help to keep related code together.\n• A package helps avoiding naming collisions.\
    \ So, you can have a class or some other Java type with the same name in different\
    \ packages.\n• Packages also help to control access. Code that is outside the\
    \ package cannot access code within the package unless explicitly allowed via\
    \ the `public` keyword.\n\n### 112. Explain the Java access specifiers.\n\nAnswer:\n\
    \nAccess specifiers control where a particular member is accessible. They are\
    \ just some keywords that are specified with class members. They can be specified\
    \ with an instance field as well as a method. Java has 4 access specifiers as\
    \ follows:\n\na. `Private`: A member having the `private` access specifier is\
    \ accessible only from within the class in which it is declared.\nb. `Protected`:\
    \ A member having the `protected` access specifier is accessible to all classes\
    \ within the package as well as sub–classes that are outside the package.\nc.\
    \ `Public`: A member having the `public` access specifier is accessible to all\
    \ classes outside the package.\nd. `Default`: The default access occurs when none\
    \ of the above access specifiers are specified. In such a case, the member is\
    \ accessible within the package but not outside the package.\n\n### 113. Explain\
    \ with a code sample how to create a package.\n\nAnswer:\n\nYou can create a package\
    \ by using the `package` keyword. It should be followed by the name that you want\
    \ to give to the package. The package name should be a valid Java identifier.\
    \ The package statement should be the first statement in the java file. The following\
    \ code demonstrates this:\n\n```java\npackage demo;\n\npublic class MyClass {\n\
    \    //instance fields and methods\n}\n```\n\nThis code declares a class called\
    \ `MyClass`. It is in a package called `demo`. Note that the package statement\
    \ is the first statement in the code.\n\n### 114. Name some default packages in\
    \ JDK and explain what they do in brief.\n\nAnswer:\n\nThe following are some\
    \ default packages in Java:\n\na. `java.util.Collection`: This package includes\
    \ all the Collection API classes. So, classes/interfaces like `List`, `ArrayList`,\
    \ `Set`, `HashSet`, `Map`, `HashMap` are all part of this package. In addition,\
    \ it also has other classes like `Date` and `Calendar` for Date handling.\nb.\
    \ `java.io`: This package has classes that help to perform input/output operations\
    \ like `InputStream`, `FileInputStream`, `FileOutputStream`, `BufferedReader`,\
    \ `BufferedWriter`, etc.\nc. `java.awt`: This package has all classes for creating\
    \ user interfaces like `Component`, `Container`, `Frame`, etc.\nd. `java.util.concurrent`:\
    \ This package has all classes that are useful for concurrent programming like\
    \ `Future`, `Executor`, `ExecutorService`, etc.\n\n### 115. Is the following code\
    \ valid? Explain the reasons.\n\n```java\npackage demo1;\n\npublic class Base\
    \ {\n    protected int a;\n}\n\npackage demo2;\n\npublic class Sub extends Base\
    \ {\n    public void doSomething() {\n        System.out.println(“Value of a is\
    \ “+a);\n    }\n}\n```\n\nAnswer:\n\nThe above code is valid and does not cause\
    \ any compilation or run time error. This code creates a super class called `Base`\
    \ and a sub–class called `Sub`. Both classes are in different packages. The `Base`\
    \ class has a protected field `a` which is accessed in the sub–class `doSomething()`\
    \ method. This is perfectly valid. Only private fields from the base class are\
    \ not accessible in the sub–class. Fields with the `protected` access specifier\
    \ are accessible in the sub–class even if the sub–class is in a different package.\n\
    \n### 116. Explain the import keyword.\n\nAnswer:\n\nThe `import` keyword is used\
    \ to include other packages in your code. You can import the standard Java packages\
    \ like `java.util`, etc. or you can import user defined packages.\n\nThe `import`\
    \ keyword needs to be followed by the package name. In order to import a specific\
    \ class from a package, you need to specify the class name as well. In order to\
    \ import the entire package, you need to use a wildcard character (`*`) after\
    \ the package name. The following are some examples of import:\n`import java.util.List;`\n\
    `import java.io.*;`\n\n### 117. Explain the differences between protected and\
    \ default specifier.\n\nAnswer:\n\nThere are several differences between `protected`\
    \ and `default` specifier:\n\n• The `protected` access specifier allows access\
    \ to all classes within the package as well as sub–classes that are outside the\
    \ package.\n• The `default` access occurs when none of the above access specifiers\
    \ are specified. It is accessible only within the package and not accessible to\
    \ sub-classes if they are in a different package.\n\n### 118. Is the following\
    \ code valid? Explain.\n\n```java\npackage demo1;\n\npublic class MyClass1 {\n\
    \    int a; //Line 1\n}\n\npackage demo2;\n\npublic class MyClass2 {\n    public\
    \ void doSomething() {\n        MyClass1 obj = new MyClass1(); //Line 2\n    \
    \    obj.a = 5; //Line 3\n    }\n}\n```\n\nAnswer:\n\nThe above code is not valid\
    \ and will cause a compilation error at line 3. The class `MyClass1` is in `demo1`\
    \ and has field `a` with default access. Since default access is not accessible\
    \ outside the package, `MyClass2` cannot access it.\n\n### 119. Explain what happens\
    \ when the following code is compiled and executed:\n\n```java\npackage com.questions;\n\
    \npublic class CoreJava {\n    private String getQuestion() {\n        return\
    \ “Question1”;\n    }\n}\n\npackage com.questions;\n\nclass JSP extends CoreJava\
    \ {\n    public void getSPQuestion() {\n        System.out.println(getQuestion());\n\
    \    }\n}\n```\n\nAnswer:\n\nThe above code will not compile. The class `CoreJava`\
    \ defines a private method `getQuestion()`. The `getSPQuestion()` method in the\
    \ sub–class invokes this private super–class method. Since a private method cannot\
    \ be accessed, a compilation error occurs.\n\n### 120. Explain the java.lang package.\n\
    \nAnswer:\n\nThe `java.lang` package has classes that are important to the Java\
    \ programming language. It includes the wrapper classes like `Byte`, `Boolean`,\
    \ `Integer`, `Double`, etc. It has classes like `String`, `StringBuffer` and `StringBuilder`\
    \ which are useful for String manipulation. It has classes like `Thread` and `Runnable`\
    \ which are useful for creating multi–threaded applications. It has `Throwable`\
    \ and other `Exception` classes which are useful for Java’s exception handling\
    \ feature.\n\n# [CHAPTER 11](#toc.xhtml_ss012a)\n\n# [Exception Handling](#toc.xhtml_ss012a)\n\
    \n### 121. Explain ‘throw’, ‘throws’ and ‘Throwable’ in Java.\n\nAnswer:\n\nThe\
    \ `throws` keyword is used to specify that a particular method throws an unhandled\
    \ exception or multiple exceptions which need to be handled separately. It basically\
    \ specifies that you do not want to handle the error condition within the method\
    \ but want to delegate the exception handling to some other part of your code.\n\
    \nThe `throw` keyword is used inside a method to explicitly throw an exception.\n\
    \n`Throwable` is the base class in the exception hierarchy. Custom exceptions\
    \ can be created by extending the `Throwable` class.\n\n### 122. What will be\
    \ the output when you compile and execute the following code?\n\n```java\nclass\
    \ Test {\n    try {\n        System.out.println(“This is try block”);\n    }\n\
    \    System.out.println(“Try block is executed”); //Line 1\n    catch(Exception\
    \ exp) {\n        System.out.println(“This is catch block”);\n    }\n}\n```\n\n\
    Answer:\n\nThe code will result in a compilation error because code cannot be\
    \ placed between a `try` block and its `catch` block.\n"
