    \n### 101. What are the possible ways of declaring an interface?\n\nAnswer:\n\n\
    Following are the possible ways of declaring an interface:\n\na. `interface Interface1\
    \ {}`\nb. `public interface Interface2 {}`\nc. `public abstract interface Interface3\
    \ {}`\nd. `abstract interface Interface4 {}`\ne. `abstract public interface Interface5\
    \ {}`\n\nSo, an interface can either have the `public` access specifier or no\
    \ specifier which means it will have default access. It can also have the `abstract`\
    \ keyword. The order of the keywords does not matter, they can be specified in\
    \ any order.\n\n### 102. Explain abstract class with a code sample.\n\nAnswer:\n\
    \nAn abstract class is a class with zero or more abstract methods. An abstract\
    \ method is a method that has no body. Both the abstract method as well as the\
    \ class needs to have the `abstract` keyword specified. The following code demonstrates\
    \ an abstract class:\n\n```java\npublic abstract class Animal {\n    private String\
    \ name;\n    public abstract void speak();\n    public void printName(){\n   \
    \     System.out.println(name);\n    }\n}\n```\n\nHere, `Animal` is an abstract\
    \ class. It has a method called `speak` which is `abstract`. It also has a concrete\
    \ method called `printName`.\n\n### 103. Explain with a code sample how to implement\
