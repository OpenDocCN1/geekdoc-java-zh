    \ The `Arrays.stream` method returns an `IntStream` which is a primitive specialization\
    \ of the `Stream` interface. Just like `IntStream`, Java 8 has also added `DoubleStream`\
    \ and `LongStream` which are returned when the `Arrays.stream` method is invoked\
    \ with a double or long array respectively.\n\n### 226. Suppose you have an Employee\
    \ class as follows:\n\n```java\npublic class Employee {\n    private String name;\n\
    \    private int salary;\n}\n```\n\nAnd suppose you have a List of Employee objects\
    \ as follows:\n\n```java\nList<Employee> employees = new ArrayList<Employee>();\n\
    employees.add(new Employee(“John”,10000));\nemployees.add(new Employee(“Ana”,15000));\n\
    employees.add(new Employee(“Tia”,8000));\n```\n\n**How can you create a new List\
    \ is sorted based on the Employee salary using Streams?**\n\nAnswer:\n\n```java\n\
    List<Employee> sortedList = employees.stream().sorted((emp1, emp2)–> emp1.getSalary()–emp2.getSalary()).collect(Collectors.toList());\n\
    sortedList.forEach(emp–> System.out.println(emp.getSalary()));\n```\n\nThis code\
    \ first obtains a `Stream` on the `employees` List. It then invokes the `sorted()`\
    \ operation. The `sorted()` method accepts as input a `Comparator`. Here, the\
    \ `Comparator` is implemented via a lambda expression that compares the salary\
    \ fields of the `Employee` objects. Finally, the `collect()` method is invoked\
    \ to convert the `Stream` back to a `List`. So, this code prints the following\
    \ output:\n\n8000\n10000\n15000\n20000\n"
