    employees.add(new Employee(“A”,10000));


    employees.add(new Employee(“B”,5000.50));


    employees.add(new Employee(“C”,15000));


    employees.sort(Comparator.comparingInt(employee–> employee.getSalary())); //Line
    1


    Answer:


    The above code has a compilation error at Line 1\. The employees.sort() method
    is used with the Comparator.comparingInt. This method accepts as parameter a ToIntFunction
    functional interface and sorts based on an int field. However, here a lambda expression
    that returns the salary value which is a double is used. So, this causes a compilation
    error. In order to fix this error, Line 1 needs to be modified as follows:


    employees.sort(Comparator.comparingDouble(employee–> employee.getSalary()));


    Now, the Comparator.comparingDouble() method is used. This method accepts as parameter
    a ToDoubleFunction interface that compares based on a Double field.


    261. Explain the differences between the CompletableFuture.runAsync and the CompletableFuture.supplyAsync
    methods.


    Answer:


    Both the runAsync and the supplyAsync methods can be used to run code asynchronously.
    However, there are some differences between the two as follows:


    • The runAsync method does not return a result, so it returns a CompletableFuture<Void>.
    The supplyAsync method on the other hand returns a value from the thread. So,
    it returns a CompletableFuture<T>.


    • The runAsync method accepts as parameter a Runnable instance. The supplyAsync
    method on the other hand accepts as parameter a Supplier instance.


    • The runAsync method executes the code in the Runnable implementation in a separate
    thread. The supplyAsync method on the other hand executes the code in the Supplier
    in a separate Thread and returns the value produced by the Supplier.


    # [SECTION 03](#toc.xhtml_ss030a)


    CORE JAVA


    JAVA 8


    [JAVA 9](#toc.xhtml_ss030a)


    HUMAN RESOURCE


    # [CHAPTER 01](#toc.xhtml_ss031a)


    # [Modules](#toc.xhtml_ss031a)


    262. What is a module? What benefits do they offer?


    Answer:


    A module consists of a group of related packages. Just like you put a set of related
    classes into a package, you can put a set of related packages into a module. Modules
    offer several benefits as follows:


    • If an application has a large number of packages, it becomes difficult to keep
    track. Modules come to the rescue, they help to organize packages, that is related
    packages can be grouped into a module.


    • Modules can be deployed by themselves. So, this helps to reduce the size of
    an application.


    • Modules offer better security. Before modules, the only way to make a class
    reusable in other packages was to make it public. However, this poses a security
    issue since public classes are accessible to everyone. Grouping packages into
    modules ensures that the class is not accessible outside the module.


    • Since there were no modules before Java 9, the Java API jar files like rt.jar
    were very big in size. Instead Java 9 has split this into smaller modules which
    are easier to test and maintain.


    • Prior to Java 9, security was an issue as developers were able to access internal
    JDK files. Modules help to overcome this issue too. So with modules you can control
    which packages within the module are visible and accessible outside the module.


