    ### 283. Suppose you have a static method in the `Base` class. And suppose you
    have a method with the same name in the sub–class. And suppose you create a `Base`
    class object and assign it a reference of the sub–class object and invoke the
    static method. Is this valid? If so, which version of the static method gets invoked?


    **Answer:**


    The above scenario is perfectly valid and will not cause any error. When this
    code is executed, the static method in the base class gets invoked. Normally,
    when you define a variable of the super–class type and assign it a sub–class object
    and invoke an overridden method, the method defined in the sub–class gets invoked.
    This is because Java uses the object assigned and not the reference variable to
    determine the version of an overridden method to invoke. However, in the scenario
    described above, the methods in the super–class and sub–class are static. Static
    methods cannot be overridden. So, if you have a static method in the base class
    and a method with the same name in the sub–class, this would not be an example
    of overriding. Rather, this is known as method hiding. In such a scenario, the
    version of the method invoked is not determined by the type of object assigned
    to the reference variable but by the type of the reference variable. In this case,
    a base class reference variable is used. So, the static method in the base class
    gets invoked.


    ### 284. Suppose you have a method in a base class that throws an `ArrayIndexOutOfBoundsException`.
    And suppose this method is overridden in the sub–class and declares that it throws
    a `RuntimeException`. What do you think will happen?


    **Answer:**


    The scenario above states that a base class method throws an `ArrayIndexOutOfBoundsException`
    which is an unchecked exception. The sub–class method overrides this method and
    declares that it throws a `RuntimeException`. This situation is valid and will
    not cause any error. In method overriding, a sub–class method is not allowed to
    throw a checked exception that is new or broader than the exception declared in
    the super–class method. However, this rule does not apply to unchecked exceptions.
    So, a sub–class method is free to declare any unchecked exception and this will
    not cause any error. If the subclass method had declared the `java.lang.Exception`
    or any of its sub–classes in the throws clause, a compile time error would have
    occurred. This is because `java.lang.Exception` is a checked exception.


    ### 285. Suppose you have a `List` of objects. You want to send it as a parameter
    to a client application but want to ensure that the client application does not
    make changes to it. How can you achieve this?


    **Answer:**


    In order to ensure that a client application does not make changes to a `List`,
    you need to obtain a read–only copy of the `List` and return that copy to the
    client application. The `Collections` class has several utility methods that return
    a read only copy of a `Collection`. For example, it has a method called `Collections.unmodifiableList`.
    This method accepts a `List` as parameter and returns a `List` which is a read-only
    copy of the input `List`. Once a read only copy of a `Collection` is obtained
    via this method, any attempt to modify the `List` (like adding or removing data)
    will result in a `UnsupportedOperationException`. So, If the client application
    tries to modify this `List`, the exception will occur.


    ### 286. Suppose you are reading 10000 `String` values from the database. You
    need to create a concatenated `String` with these values. Which is the most efficient
    way to achieve this?


    **Answer:**


    There are several ways in which you can concatenate `String` values. The mostly
    commonly used method is to use the concatenation operator (`+`). However, this
    is not at all efficient in terms of performance and should be avoided when you
    have a large number of `Strings`. This is because the `String` class is immutable.
    So, using the `+` operator results in the creation of a large number of `Strings`.
    Java provides the `StringBuffer` class. This has a method called `append` that
    can be used to create concatenated `Strings`. This has better performance since
    it is a mutable class. There is also another class called `StringBuilder` which
    is very similar to `StringBuffer`. The only difference is that `StringBuffer`
    is synchronized while `StringBuilder` is not. So `StringBuilder` has a slightly
    better performance compared to `StringBuffer`. So, if synchronization is not an
    issue, you can use `StringBuilder`, otherwise you can use `StringBuffer`.


    ### 287. Suppose you are developing an application that performs a lot of mathematical
    calculations involving very large decimal numbers. Which data type will you use
    for your variables given that precision is important?


    **Answer:**


    Normally, programmers use `float` or `double` data types while dealing with decimal
    numbers. However, these data types have a downside. While dealing with very large
    or very small numbers, a loss of precision can occur with these data types leading
    to inaccurate results. So, using these data types in situations where precision
    is important is not a good idea. Java provides a class called `java.lang.BigDecimal`.
    This class overcomes the limitations of the `float` and `double` data types. It
    does not lose precision while dealing with large or small numbers and therefore
    provides exact results. It has methods corresponding to all the arithmetic operations
    like addition, subtraction, multiplication and division. In addition, it supports
    a lot of other operations as well. So, it can be used to perform all mathematical
    operations and provides precise results. The only downside of `BigDecimal` is
    performance. However, if precision is a priority over performance, then `BigDecimal`
    should be used.


    ### 288. Suppose you are working on a multi-threaded application. A new requirement
    comes in where you need to store key–value pairs. Which is the most appropriate
    Collection to be used in such a scenario?


    **Answer:**


    The `java.util.Map` interface supports storing data as key–value pairs. The mostly
    commonly used implementation of the `Map` interface is `HashMap`. However, the
    problem with `HashMap` is that is not thread safe and so not appropriate to be
    used in a multi-threaded application. There is a utility method on the `Collections`
    class called `synchronisedMap()`. It accepts a `Map` as an input and returns a
    thread-safe map corresponding to the `Map` object passed in. So, such a synchronized
    map can be used in a multi-threaded environment. There is also another `Map` implementation
    called `ConcurrentHashMap`. This is a thread-safe implementation of the `Map`
    interface and so suitable for use in a multi-threaded environment. `ConcurrentHashMap`
    has a slightly better performance than a synchronized Map. A synchronized Map
    synchronizes the complete Map object, so even a read operation is not allowed
    while some other thread is using the Map. The `ConcurrentHashMap` on the other
    hand does not synchronize the whole map, so it allows read operations while some
    other thread is writing to the Map. So, while both synchronized Map and `ConcurrentHashMap`
    are suitable in a multi-threaded environment, `ConcurrentHashMap` should be used
    if performance is a consideration.


