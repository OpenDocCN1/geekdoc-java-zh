    我们在招聘新销售人员时遇到了困难。我开发了更新我们销售职位描述的构想。我们之前的职位描述已经过时了，而且多年没有更新，在此期间，出现了许多新的软件工具，该职位的职责也发生了变化。销售团队聚在一起审查了当前的职位描述，并就他们认为应该在描述中增加或删除的内容意见，然后管理层进行了审查并做了相应的更新。一旦我们开始使用新的职位描述发布招聘广告，发现申请的合格销售专业人士人数增加了，他们更了解自己所申请的职位，而且契合度也更高。


    ### 316. 请告诉我一次你在项目中承担风险风险的经历。


    **回答：**


    无论这种风险涉及的是像在资源或时间有限的情况下承担重大项目这样复杂的事情，还是仅仅自愿承担一项超出你经验领域的任务，都要表现出你愿意走出舒适区并尝试新事物。提供具体的例子来说说明你所做的某件事为什么具有风险，并解释你在过程中学到了什么——或者这如何帮助你应对后来在职业生涯中遇到的某个工作目标。


    *例如：*


    我曾在一家公用事业公司的工程部门工作。我们遇到了一次紧急情况，社区的一根水管破裂了，社区关于水电费单的客户电话让我们应于交。在此期间，有两个客服代表请假，由于我当时正处于两个大项目之间，于是我提供了帮助。然而，我完全超出了舒适区，但我协助接听客户电话、回答基础问题，并记录了无法帮助的客户的姓名和电话，以便主管之后回访他们。我成功收了大约
    100 名客户的款项，成功回答了大约 50 个问题，并为另外 25 个人记录了回电信息。我更多地了解了我在部门的工作是如何与客服联系的，以及客户向他们提出的问题类型以及他们面临的挑战。在这种情况发生后，我们两个部门开始更多地合作，甚至还举行了季度会议，就可能直接影响另一个部门工作的事目提供更新。


    ### 317. 对于一个想进入这个领域的人，你会告诉他们什么？


    **回答：**


    这个问题让你能够扮演专家的角色——并将向面试官展示你拥有知识和经验，可以配得上你简历上的任何培训和教育。将你的知识作为对进入该领域的人可能遇到的意外情况的建议，并确保以积极的建议结束，例如真正取得成功所需的工作的热情或奉献精神。


    *例如：*


    如果有人想进入销售领域，我建议他们首先查看有哪些相关的证书课程或学位选择可以帮助到该领域。我还会建议，如果你不习惯与他人交谈（无论是一对一还是在小组环境中），就去上一门公共演讲课程来增强你的信心。我建议学习销售的各种门道，并找到一个你真正热衷于销售的产品。如果你对自己的业务（尤其是销售）没有热情，你的表现不会很好。一旦你找到了热衷于销售的产品，就尽一切能学习关于它的一切。如果是产品，就去使用并测试它；如果是服务，就去尝试。记住在开始时给自己时间失败几次，这并不是世界末日，因为这有助于你学习。在工作中保持坚持，并学习哪些方法对你的目标受众有效，哪些无效。对客户和顾客保持积极的态度，在显得过于咄咄逼人或急切与过于胆小和冷淡不关心之间找到平衡，并且不要忘记在初次联系后进行跟进！


    # 第 03 章


    # 截止日期与时间管理


    ### 318. 请告诉我一次你没能遵守截止日的经历。


    **回答：**


    理想情况下，这种情况没有发生过——但如果发生了，请确保你使用一个较小的例子来说明情况，强调它发生已经多久了，并确保你已经尽了可能去确保遵守截止日期。此外，务必包括你在更好地管理时间或优先考虑任务方面学到的知识，以满足未来所有的截止日期。


    *例如：*


    我很少、如果说的话会错过截止日期。话虽如此，我记得大约两年前，我错过了一个向财务部门提交报告的截止日期。问题在于我一次性承担了太多的项目，而且同一周又冒出了几个“紧急”的意外问题。我没有寻求帮助，认为自己可以独立完成所有，并且不想给主管留下一份无法处理这项工作的印象。但结果结果是，我确实让主管失望了，当我坐下来和他讨论这个问题时，他们向我保证，只要我对自己的工作量保持开放沟通，他们就会帮助分担。从那时起，我确保向主管更开放地说明目前的工作量，并表达我对截止日期的任何担忧。从那以后我没有错过过截止日期，而且由于更开放的沟通，我和同事的关系以及部门内的生产力都得到了提高。


    ### 319. 你在工作时如何消除干扰？


    **回答：**


    随着技术的进步和沟通的便利，每天都会产生新的干扰。你的面试官会希望看到你仍然能够专注于，并且你的生产力没有受到影响，可以通过展示一个你为了保持专注而采用的日常流程来实现。


    *例如：*


    每天早上，我查看当天的任务并为我需要做的事情准备。我检查电子邮件、消息和其他个人物品，然后收起我的个人设备。我确保我的家人和朋友知道我只在休息期间查看消息，如果有紧急情况，他们有一个可以联系我的电话号码。在工作周的休息期间，我不参与很多社交媒体，因为那会拖累工作日。在休息时，我倾向于散步、阅读、和同事聊天几分钟，或者给家人或朋友发信息问问候，然后回到工作中。


    ### 320. 请告诉我一次你在一个有每周或每月定额要求的职位工作的经历。你成功的频率有多高？


    **回答：**


    你的数据将说明一切，你必须诚实地回答这个问题。如果你经常达到定额，请确保以自信的方式强调这一点，并不要羞于指出你在这一方面的优势。如果你的统计数据并不理想，尝试指出它们在你任职结束前呈增长的趋势，并展示对未来改进方式的反思。


    *例如：*


    我每个季度都能准时完成任务。我接受公司给我的定额，然后在这个基础上增加我自己的个人目标。这样，我就有一个更高的目标可以追求，并且当我只能达到公司目标而没有达到个人目标时，留有回旋地。我尝试不过分关注每日销售额，而是进行每月检查。这使我不会浪费太多时间在担心进度上，同时确保我处于目标范围内。


    ### 321. 请告诉我一次你完成了艰难截止日的经历，以及你是如何完成它的。


    **回答：**


    '
- fmt: '

    Explain how you were able to prioritize tasks, or to delegate portions of an assignments
    to other team members, in order to deal with a tough deadline. It may be beneficial
    to specify why the deadline was tough - make sure it’s clear that it was not a
    result of procrastination on your part. Finally, explain how you were able to
    successfully meet the deadline, and what it took to get there in the end.


    *As an example:*


    I was placed with the large task of submitting a state report I had never done
    before, due to my coworkers sudden absence. I researched the topic on my own downtime
    when I could, reached out to other companies to see how they were completing the
    project, and I found an online training I could take during business hours. With
    permission from my boss, I delegated my clerical duties to the department secretary
    until I was able to finish the state report. I was able to submit it ahead of
    schedule and it added value to my job and me as an employee, as I was asked to
    assist with other projects after that, received a great performance review and
    raise during subsequent evaluation period.


    ## 322. How do you stay organized when you have multiple projects on your plate?


    **Answer:**


    The interviewer will be looking to see that you can manage your time and work
    well - and being able to handle multiple projects at once, and still giving each
    the attention it deserves, is a great mark of a worker’s competence and efficiency.
    Go through a typical process of goal-setting and prioritizing, and explain the
    steps of these to the interviewer, so he or she can see how well you manage time.


    *As an example:*


    I keep an ongoing list of tasks on a notepad and `Outlook` calendar. Each morning
    when I arrive to work, I look at my `Outlook` calendar and I review the written
    list of tasks that I had added the day before on a notepad throughout the day,
    and prioritize what needs to be done that day and what can wait. For the tasks
    that can be done later in the week, I utilize the calendar feature in `Outlook`
    to put tasks on specific dates, so a reminder pops up prompting me to complete
    the task. Of the items on the list that can not wait, I choose the quickest and
    complete those first. Then I dive in to the more complex tasks. During the day
    when urgent items arise that put me off my schedule, I revisit my `Outlook` calendar
    and written list and constantly adjust accordingly. I also keep in communication
    with my team mates and let them know if there are any items I could use assistance
    with if they have downtime.


    ## 323. How much time during your workday do you spend on “auto-pilot?”


    **Answer:**


    While you may wonder if the employer is looking to see how efficient you are with
    this question (for example, so good at your job that you don’t have to think about
    it), but in almost every case, the employer wants to see that you’re constantly
    thinking, analyzing, and processing what’s going on in the workplace. Even if
    things are running smoothly, there’s usually an opportunity somewhere to make
    things more efficient or to increase sales or productivity. Stress your dedication
    to ongoing development and convey that being on “auto-pilot” is not conducive
    to that type of success.


    *As an example:*


    I am very good at my job and do find myself going in to “auto-pilot” often. With
    that said, when I complete a project or task, I take time to review the completed
    project to assure accuracy. If I get the project done with downtime to spare after,
    I may try to test out a different method of completion to see if there are ways
    to improve the process. Sometimes there is and sometimes there simply isn’t, however,
    I constantly find ways to utilize my time in the most effective and proficient
    manner.


    ## 324. How do you handle deadlines?


    **Answer:**


    The most important part of handling tough deadlines is to prioritize tasks and
    set goals for completion, as well as to delegate or eliminate unnecessary work.
    Lead the interviewer through a general scenario and display your competency through
    your ability to organize and set priorities, and most importantly, remain calm.


    *As an example:*


    I utilize my `Outlook` calendar for ongoing tasks that I know have to be completed
    on a recurring basis. For example, every Monday I have to submit my sales report,
    and every Wednesday I have to file. If there are any special projects coming up
    that I need to prepare for, I will set aside time and reminders on my calendar
    to prepare for the upcoming project. I also take time every morning when I get
    to work to review the tasks I have that day, and do the same at the end of each
    day as well to be sure I completed everything I needed to and prepare for the
    next day. If I feel that I am unable to meet a deadline for some reason, I communicate
    this with the department I am working with and see if any adjustments need to
    be made. Communication is key. Additionally, I am constantly mindful of the need
    to adjust my schedule accordingly if urgent projects arise.


    ## 325. Tell me about your personal problem-solving process.


    **Answer:**


    Your personal problem-solving process should include outlining the problem, coming
    up with possible ways to fix the problem, and setting a clear action plan that
    leads to resolution. Keep your answer brief and organized, and explain the steps
    in a concise, calm manner that shows you are level-headed even under stress.


    *As an example:*


    When I was working as an equipment mechanic, I began experiencing difficulty in
    managing the amount of work coming in from multiple project managers in my company.
    Each of them started pairing me as the technician over their client’s equipment.
    I tried to tell some of them no, and I was told I was not a team player. I ended
    up discussing with the shop foreman what the issue was and explained I was a team
    player but simply did not have enough time in the day to finish all of the jobs
    they were giving me. I started a scheduling board in my work area where I put
    what jobs I had, who the project manager was, what phase I was in with each project,
    and expected completion time. This allowed for all project managers to clearly
    see my workload, and better understand and appreciate the work I was doing, while
    allowing them to figure out if they wanted to pursue someone else to repair their
    client’s equipment or wait for me to have an opening.


    ## 326. What sort of things at work can make you stressed?


    **Answer:**


    As it’s best to stay away from negatives, keep this answer brief and simple. While
    answering that nothing at work makes you stressed will not be very believable
    to the interviewer, keep your answer to one generic principle such as when members
    of a team don’t keep their commitments, and then focus on a solution you generally
    employ to tackle that stress, such as having weekly status meetings or intermittent
    deadlines along the course of a project.


    *As an example:*

