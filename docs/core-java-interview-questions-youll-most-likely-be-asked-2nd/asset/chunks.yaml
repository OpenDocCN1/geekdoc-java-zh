    ### 057. “break”和“continue”语句的作用是什么？


    **答案：**


    `break` 关键字可以在循环中使用。当遇到 `break` 语句时，循环会立即终止，控制权转移到循环外部。


    `continue` 关键字也可以在循环中使用。它用于停止执行当前迭代中循环的后续语句，并将控制权转移到循环的开头。


    ### 058. 编译并执行下面的代码时会发生什么？输出是什么？


