    `RuntimeException`。这种情况是有效的，且不会引起任何错误。在方法重写中，子类方法不允许抛出比父类方法中声明的异常新或范围更大的已检查异常。然而，这条规则不适用于未检查异常。因此，子类方法可以自由声明任何未检查异常，且不会引起任何错误。如果子类方法在
