    我曾多次需要处理在申请新工作许可时办公程序中涉及的“官僚主义”繁琐手续。尽管有时这让人非常沮丧且耗费时间，但我理解这是必要的，因为审查计划并确保工作符合安全和法律协议需要时间。我有一项需要加急的任务，所以我准备了一封解释情况的信，获取了该项目业主的声明，并让我的主管联系签署授权来陈述我的情况。我确保包含了这些理由：即如果项目停工或工期过长，会对社区产生负面影响；以及加紧工作对社区有益，而且这家店的开将产生连锁效应，在同一片空置地上带动其他商店开设。虽然工作最终没有在第二天完成，但它比原定计划提前了两周执行。


    ### 346. 请讲述一次你说服他人承担艰巨任务的经历。


    **答案：**


    这个问题是一个展示你领导力和沟通能力的绝佳机会。虽然提供具体的情况作为背景介绍很重要，但重点应放在你是如何说服他人的，以及哪些策略最有效。


    *例如：*


    我的一位同事不愿意帮我实施新的归档系统。这个项目将非常耗时且困难。我向她阐述了该项目如何使她个人以及整个部门受益，并让她的工作变得更简单，并告诉她这最终将是老板会赞赏的，也是她展现才华的机会。我通过告诉她她有很多非常棒的想法，并告诉如果她参与项目，由于她的知识和想法，将有助于项目更快、更高效地完成来激励她。让她感到很有价值并感到被需要，这激励了她提供帮助。


    ### 347. 请讲述一次你成功说服一个群体接受你的提案的经历。


    **答案：**


    这个问题旨在衡量你的资源利用能力和沟通技巧。请解释你是如何考虑小组内的不同视角的，并制作出一个对所有成员都有吸引力且有说服力的演示的。此外，你还可以通过提供有关提案的细节来增强提案本身的说服力，展示其执行良好。


    *例如：*


    我曾试图尝试购买一套新的发票软件，但只有我一个人感兴趣。他们不感兴趣是因为习惯了目前的软件，并且觉得太忙，没时间学习新系统。我研究了感兴趣的软件，整理了一份要点清单，并在计划会议之前发给每个部门成员，这样他们就有时间查看并带着问题来；然后我使用截图和关于软件如何让他们的工作更简单的深度信息向团队展示了该软件。我专门针对了两个同事的工作，指出了它将如何直接影响他们的工作并改进他们的流程。我给他们留了时间进行思考，并在做决定之前自己进行更多研究。


    ### 348. 请讲述一次你与他人发生矛盾的经历，事后看来，你希望自己能换一种方式处理。


    **答案：**


    这个问题的关键在于展示你的反思能力和学习过程。解释当时的情况、你当时是如何处理的、结果如何，以及最后你现在会如何处理。最重要的是，告诉面试官你为什么现在会以不同的方式处理——是因为你之前的方案给与对方之间的关系造成了压力，还是你希望自己当时能更坚定地维护自己的诉求？虽然你不应该详细阐述你以前处理得有多糟糕，但最重要的是展示出你已经成长，并通过这次冲突达到了更深层次的理解。


    *例如：*


    很多年前，我有一位同事完全不想听我说的任何话或采纳我的任何想法。他们非常固执，不愿学习新事。。我认为最好的办法就是避开他们，让他们做自己的事，避免冲突。事后看来，我本可以做得更好，去理解他们的观点以及他们可能对变化的恐惧，并更好地尝试去沟通新流程的必要性，向他们保证新流程可能会让他们的工作更轻松，并且我们都是一个团队，会在任何变化中互相支持。多年来，我的沟通能力以及意识到沟通对团队合作及最终对公司至关重要的认识已经有了巨大的提高。


    ### 349. 请讲述一次你调解其他员工之间冲突的经历。


    **答案：**


    对于应聘主管职位的人来说，这是一个特别重要的问题——从一个具体的情况开始，并解释你是如何与每个人进行有效沟通的。例如，你引入了折中方案吗？你做了行政决定吗？或者你扮演了调解人的角色，鼓励员工自行达成结论？


    *例如：*


    担任车间主管期间，我有多次担任两名员工之间纠纷的调解员。没有一种适用于所有情况的通用解决方案，因为每个员工都不同，每种情况或纠纷也各不同。我会仔细反思纠纷，并根据我所知的事实以及相关方的性格来决定需要做什么。大多数情况下，让两名员工坐在一起讨论，由我担任见证和调解员是非常有效的。我确保让每个人都有机会陈述发生了什么、他们的观点，以及这给他们带来了什么感受，或者他们认为最好的结果是什么。我确保始终指出双方都可以以不同的方式处理这种情况以避免纠纷升级，并指出了我认为他们身上的积极特质，我认为这些特质将让他们向前发展并更好地合作。我总是会进行跟进，以确保一切仍然进展顺利，并且如果他们再次遇到问题，我一直实行开放政策。


    # 第 06 章


    # 找工作与日程安排


    ### 350. 你在职位中最看重的前三点是什么？


    **答案：**


    你对职位最看重的前三点应该与雇主对员工要求的前三点相似，这样就能清楚地表明你与工作非常匹配。例如，雇主想要一个资历且具有实践经验的候选人——而你想要一个能够让你将教育和技能发挥到最大的职位。雇主想要一个愿意接受新挑战并开发新系统以增加销售或生产力的候选人——而你想要一个能推你并提供发展、创造和领导新倡议机会的职位。雇主想要一个能够成长并留在公司很长时间的候选人——而你想要一个提供稳定性并相信建立强大团队的职位。在在此之前研究雇主在寻找什么，并将你的目标与他们的目标匹配。


    *例如：*


    我寻找的三个点将是：应用我的技能产生积极影响的机会、成长和学习新事的机会，以及在一家具有积极使命的公司中获得稳定性。


    ### 351. 你是如何评估你想要加入的公司的？


    **答案：**


    '
- fmt: '

    While you may feel uncomfortable exerting your own requirements during the interview,
    the employer wants to see that you are thinking critically about the companies
    you’re applying with, just as they are critically looking at you. Don’t be afraid
    to specify what your needs from a company are (but do try to make sure they match
    up well with the company - preferably before you apply there) and show confidence
    and decisiveness in your answer. The interviewer wants to know that you’re the
    kind of person who knows what they want, and how to get it.


    **As an example:**


    I am looking at employee satisfaction, company stability, and type of service
    the company offers. I want to be sure that I am working at a company with good
    employee feedback so I know the company takes good care of the people on the front
    lines making the company succeed. I also want to know the company will be around
    a while and I can stay and grow with the company. Finally, if I want to work with
    a company that offers a good service to the community and I feel passionate about
    going to work each day.


    ## 352. Are you comfortable working for __________ salary?


    **Answer:**


    If the answer to this question is no, it may be a bit of a deal-breaker in a first
    interview, as you are unlikely to have much room to negotiate. You can try to
    leverage a bit by highlighting specific experience you have, and how that makes
    you qualified for more, but be aware that this is very difficult to navigate at
    this step of the process. To avoid this situation, be aware of industry standards
    and, if possible, company standards, prior to your application.


    **As an example:**


    I am definitely comfortable with starting out at that pay rate. I am happy for
    the opportunity and know that I will continue to grow within the company.


    ## 353. Why did you choose your last job?


    **Answer:**


    In learning what led you to your last job, the interviewer is able to get a feel
    for the types of things that motivate you. Keep these professionally-focused and
    remain passionate about the early points of your career, and how excited you were
    to get started in the field.


    **As an example:**


    I chose my last job because it was at a non-profit. The pay was lower than a privately
    held company, however, I knew that it would be a good experience and they needed
    the help. My skills and knowledge were a great addition to their company and at
    the time I was able to live off the pay that I received. It was a great experience
    and now that time has gone by I am ready to move forward in my career and take
    it to the next level whether it be in non-profit or not, I would like to be able
    to elevate my career.


    ## 354. How long has it been since your last job and why?


    **Answer:**


    Be sure to have an explanation prepared for all gaps in employment, and make sure
    it’s a professional reason. Don’t mention difficulties you may have had in finding
    a job, and instead focus on positive things such as pursuing outside interests
    or perhaps returning to school for additional education.


    **As an example:**


    I held my last job about a year ago. I had a very demanding job with long hours,
    and was doing well financially, however I took some time off for rest and focus
    on more family time that I felt I was missing out on. During that time, I took
    some professional development courses and also re-focused my goals and am ready
    to get back in to the workforce. I feel refreshed, re-trained and re-focused on
    the area of my field that I am most interested in pursuing.


    ## 355. What other types of jobs have you been looking for?


    **Answer:**


    The answer to this question can show the interviewer that you’re both on the market
    and in demand. Mention jobs you’ve applied for or looked at that are closely related
    to your field, or similar to the position you’re interviewing for. Don’t bring
    up last-ditch efforts that found you applying for a part-time job completely unrelated
    to your field.


    **As an example:**


    Because I am pursuing a marketing career, I am focused on marketing jobs in public
    sector. I am applying mostly for marketing assistant positions and may also be
    interested in administrative roles if I am still able to have a hand at marketing.
    I feel pretty confident in my abilities as a successful marketing assistant so
    I am doing my best to get my foot in the door in that arena, where I can help
    a company expand their horizons with new creative marketing strategies.


    ## 356. Have you ever been disciplined at work?


    **Answer:**


    Hopefully the answer here is no - but if you have been disciplined for something
    at work though, be absolutely sure that you can explain it thoroughly. Detail
    what you learned from the situation and reflect on how you grew after the process.


    **As an example:**


    I have not been disciplined at work however I did receive some criticism on keeping
    my supervisor better informed on my progress during major projects. I had a tendency
    to be in the zone and push forward at my own rate, and get the job done and did
    not think at the time it was important to keep my supervisor up to date if nothing
    was going wrong. I thought that if something was going wrong, that would be the
    time to get my boss involved. After discussion, I learned that the supervisor
    actually had reports they had to submit to upper management once a week, and they
    had to include my project and where I was at in the process. Once I learned that,
    I realized that keeping my boss up to date on my projects, even when everything
    was going right, was always important.


    ## 357. What is your availability like?


    **Answer:**


    Your availability should obviously be as open as possible, and any gaps in availability
    should be explained and accounted for. Avoid asking about vacation or personal
    days (as well as other benefits) and convey to the interviewer how serious you
    are about your work.


    **As an example:**


    I reviewed the business hours and believe my availability would match what the
    job requires. While I obviously need time to tend to family and personal matters,
    I am also willing to work overtime as needed in order to support the organization.


    ## 358. May I contact your current employer?


    **Answer:**


    If possible, it is best to allow an interviewer to contact your current employer
    as a reference. However, if it’s important that your employer is not contacted,
    explain your reason tactfully, such as you just started job searching and you
    haven’t had the opportunity yet to inform them that you are looking for other
    employment. Be careful of this reasoning though, as employers may wonder if you’ll
    start shopping for something while employed with them as well.


    **As an example:**


    I don’t mind at all if you contact my current employer. I would prefer if you
    were to wait until a contingent offer is made and allow me time to speak with
    my employer first, out of respect for them so they are not sided though. While
    they were aware that I may eventually leave to grow my career, they will be understandably
    concerned with filling my position since I play such an important part of the
    organization. I’d like to be able to speak with them first before they receive
    a phone call.


    ## 359. Do you have any valuable contacts you could bring to our business?


    **Answer:**


    It’s great if you can bring knowledge, references, or other contacts that your
    new employer may be able to network with. However, be sure that you aren’t offering
    up any of your previous employer’s clients, or in any way violating contractual
    agreements.


    **As an example:**


    I do have some great contacts at other agencies who work with the same software
    I work with in the accounting field. We have been able to troubleshoot and problem
    solve together over the years and they share great new ideas with me that help
    me with things that come up. I’d definitely have much support. I also have a few
    people who are business owners that can share with your management team any insight
    they have with how to handle employee issues and new business trends.

