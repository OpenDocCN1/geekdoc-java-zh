    \nAnswer:\n\n假设有两个对象 `v1` 和 `v2`。如果 `v1.equals(v2)` 返回 true，那么 `v2.equals(v1)`\
    \ 必须返回 true。这种 `equals()` 约被称为对称契约（symmetric contract）。考虑以下代码：\n\n```java\nObject\
    \ v1; Object v2;\nv1.equals(v2); //Line 1\nv2.equals(v1); //Line 2\n```\n\n因此，在对称契约的情况下，Line\
    \ 1 返回 true 当且仅当 Line 2 返回 true 时。\n\n### 190. 以下哪些是无效的语句？为什么？\n\n```java\nSystem.out.println(2+2);\
    \ //line 1\nint i= 2+’2’; //line 2\nString s= “one”+’two’; //line 3\nbyte b=256;\
    \ //line 4\n```\n\nAnswer:\n\nLine 1 和 line 2 是有效语句。\n\nLine 3 是无效的。值 `two` 是无效的，因为单引号不能用于字符串，它们只能用于字符常量。字符串需要包含在双引号中。\n\
    \nLine 4 是无效的。byte 类型的变量 `b` 不能被赋值为 256，因为超出了 byte 的范围范围。\n\n### 191. transient\
