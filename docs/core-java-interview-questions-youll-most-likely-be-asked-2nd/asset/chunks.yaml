  trans: "\n\n方法引用（Method reference）是 `Java 8` 引入的一种新运算符。它是 lambda 表达式的快捷运算符，用 `::`\
    \ 符号表示。\n\n方法引用有以下几个优点：\n\na. **它们避免了代码重复**：有时，你的代码中可能已经有一个方法，其代码与你想在 lambda 表达式中指定的代码相同。在这种情况下，方法引用是非常用的。因此，你不需要在\
    \ lambda 表达式中重新编写代码，而是可以通过方法引用引用现有的方法。\n\nb. **它们让代码更简洁**：方法引用在 lambda 表达式的基础上更了一层。通过将代码从\
    \ lambda 表达式移动到单独的方法中，帮助代码变得更加简洁。\n\n### 228. 方法引用的不同类型有哪些？\n\n答案：\n\n方法引用有 4\
    \ 种类型。如下：\n\na. **静态方法引用**：当通过方法引用运算符引用类的静态方法时，就会发生这种情况。其语法如下：\n\n`class::staticmethod`\n\
    \nb. **实例方法引用**：当通过方法引用运算符引用类的实例方法时，就会发生这种情况。其语法如下：\n\n`object::instancemethod`\n\
    \nc. **构造器引用**：当通过方法引用运算符引用类的构造器时，就会发生这种情况。其语法如下：\n\n`class::new`\n\nd. **任意方法引用**：当访问类的某个实例方法但不是在任何特定对象上时，就会发生这种情况。其语法如下：\n\
    \n`class::instancemethod`\n\n### 229. 请出一个静态方法引用的例子。\n\n答案：\n\n当通过方法引用运算符访问类的静态方法时，就会静态方法引用。以下代码演示了这一点：\n\
    \n```java\npublic class MethodReferenceDemo {\n\n    public static boolean checkIfNumberGreaterThan8(int\
    \ num) {\n        return num > 8;\n    }\n\n    public static void main(String[]\
    \ args) {\n        Predicate<Integer> numberChecker =\n            MethodReferenceDemo::checkIfNumberGreaterThan8;\n\
    \        boolean flag = numberChecker.test(10);\n    }\n}\n```\n\n在这里，`MethodReferenceDemo`\
    \ 类有一个名为 `checkIfNumberGreaterThan8()` 的静态方法。该方法检查输入数字是否大于 8，并返回相应的布尔值。在 `main`\
    \ 方法中，定义了一个 `Predicate`。然而，并没有使用 lambda 表达式来实现该 `Predicate`，而是通过方法引用运算符引用了现有的\
    \ `checkIfNumberGreaterThan8()`。由于 `checkIfNumberGreaterThan8()` 是静态方法，因此使用了类名后跟方法名。\n\
    \n### 230. 考虑以下 Shape 类：\n\n```java\npublic class Shape {\n    private String\
    \ name;\n}\n```\n\n**为了让下面的代码有效，此类需要哪些更改？**\n\n```java\nList<String> shapeNames\
    \ = Arrays.asList(“Circle”,”Triangle”);\nList<Shape> shapes = shapeNames.stream().map(Shape::new).collect(Collectors.toList());\n\
    ```\n\n答案：\n\n上面的代码创建了一个名为 `shapeNames` 的 String 值 `List`。然后它使用 `Stream.map()`\
    \ 操作创建了一个名为 `shapes` 的 Shape 对象 `List`。代码使用构造器引用通过 `String` 形状名称创建一个新的 `Shape`\
    \ 对象。因此，`Shape` 类需要一个接受 `String` 值作为输入的构造器，如下：\n\n```java\npublic Shape(String\
    \ name) {\n    this.name = name;\n}\n```\n\n### 231. 解释 String::toUpperCase 是什么类型的方法引用。\n\
    \n答案：\n\n`String::toUpperCase` 是任意方法引用的例子。它引用 `String` 类的 `toUpperCase` 方法，但不是在任何特定对象上。这通常在遍历\
    \ `Collection` 或 `Stream` 时使用。例如，假设你想将 `List` 的所有元素转换为大写字母。你可以如下使用此 `String::toUpperCase`：\n\
    \n```java\nList<String> colours = Arrays.asList(“Red”,”Blue”,”Green”);\nList<String>\
    \ upperCaseColours =\n    colours.stream().map(String::toUpperCase).collect(Collectors.toList());\n\
    ```\n\n# 第 05 章\n# DateTime API\n\n### 232. 解释以下代码片段中的错误以及你如何修复它。\n\n```java\n\
    LocalDate date1 = LocalDate.of(2018, 7, 24);\nLocalTime time1 = date1.atTime(5,\
    \ 30);\n```\n\n答案：\n\n上面的代码片段首先创建了一个名为 `date1` 的 `LocalDate`。然后它在 `date1` 上使用\
    \ `atTime()` 方法并将结果赋值给名为 `time1` 的 `LocalTime` 对象。这会导致编译错误。`atTime()` 方法将当前时间对象中的日期与指定的时间结合并返回一个\
    \ `LocalDateTime` 对象。因此，你可以通过以下更改来修复上面的代码：\n\n```java\nLocalDateTime time1 = date1.atTime(5,\
    \ 30);\n```\n\n这会将 `date1` 中指定的日期与时间 `5:30` 结合并返回一个 `LocalDateTime` 对象。\n\n###\
    \ 233. 请用适当的代码示例说明创建 LocalDate 的不同方法。\n\n答案：\n\n`LocalDate` 类有一些用于创建 `LocalDate`\
    \ 的静态方法。这些如下：\n\na. 创建对应当前日期的 `LocalDate` – 可以 `LocalDate.now()` 方法，如下所示：\n\n\
    ```java\nLocalDate date1 = LocalDate.now();\n```\n\nb. 创建对应指定年、月、日的 `LocalDate`\
    \ – 可以 `LocalDate.of` 方法，如下所示：\n\n```java\nLocalDate date2 = LocalDate.of(2018,\
    \ 7, 24);\n```\n\nc. 创建对应字符串的 `LocalDate` – 可以 `LocalDate.parse` 方法，如下所示：\n\n\
    ```java\nLocalDate date3 = LocalDate.parse(“2014–08–11”);\n```\n\n### 234. 用代码示例说明如何检查一个日期是否在另一个日期之前。\n\
    \n答案：\n\n`LocalDate` 类有一个方法 `isBefore()`。可以使用它来检查一个日期是否在另一个之前，如下：\n\n```java\n\
    LocalDate date1 = LocalDate.of(2018, 7, 24);\nLocalDate date2 = LocalDate.parse(“2014–08–11”);\n\
    boolean isBefore = date1.isBefore(date2);\nSystem.out.println(“isBefore–”+isBefore);\n\
    ```\n\n这段代码创建了日期对象 `date1` 和 `date2`。它在 `date1` 上调用 `isBefore()` 并传递 `date2` 作为参数。由于\
    \ `date1` 在 `date2` 之后，`isBefore()` 返回 `false`。\n\n### 235. 解释 ZonedDateTime 类。\n\
    \n答案：\n\n`ZonedDateTime` 类表示有时区信息的日期和时间。因此，除了年、月、日、时、分、秒和纳秒，它还有一个 `ZoneId` 组件。`ZoneId`\
    \ 是 `java.time.ZoneId` 的实例并表示时区。大约有 40 个时区可以通过 Zone Id 表示。下面的代码显示了如何创建 `ZonedDateTime`：\n\
    \n```java\nZoneId zoneId = ZoneId.of(“Asia/Kolkata”);\nZonedDateTime zonedDateTime\
    \ = ZonedDateTime.now(zoneId);\n```\n\n所以，上面的代码片段首先创建一个对应 `Asia/Kolkata` 的 `ZoneId`，这是\
    \ IST 时区。然后它根据系统时创建一个对应当前时间的 `ZonedDateTime`。\n\n### 236. 下面代码片段的输出是什么？\n\n```java\n\
    LocalTime localTime = LocalTime.of(7, 15);\nSystem.out.println(localTime.minusMinutes(30));\n\
    ```\n\n答案：\n\n上面的代码创建一个 `LocalTime` 实例。`LocalTime` 表示具有小时、分、秒和纳秒组件的时间。在这里创建了一个对应\
    \ `7–15` 的 `LocalTime` 对象。代码接着调用带有 `30` 的 `minusMinutes()` 方法并打印输出。`minusMinutes()`\
    \ 方法从它调用的 `LocalTime` 上减去指定的分钟数。从 `7–15` 减去 `30` 分钟，时间将是 `6–45`。所以这段代码打印输出：\n\n\
    06–45\n\n### 237. 如何使用 Java 8 DateTime API 获取对应日期的星期？\n\n答案：\n\n`LocalDate` 类有一个方法\
    \ `getDayOfWeek()`。你可以使用它来获取对应日期的星期，如下代码所示：\n\n```java\nLocalDate date = LocalDate.parse(“2017–04–25”);\n\
    System.out.println(date.getDayOfWeek());\n```\n\n"
- fmt: "\nThe above code creates a `LocalDate` corresponding to `25th April 2017`.\
    \ It then invokes the `getDayOfWeek()` method on this date object. This method\
    \ returns an enum called `DayOfWeek`. The `DayOfWeek` enum has values corresponding\
    \ to each day of the week. Since the date `25th April 2017` corresponds to a `Tuesday`,\
    \ the `getDayOfWeek` method returns an enum value corresponding to `Tuesday`.\
    \ So, this code prints the output shown below:\n\nTUESDAY\n\n### 238. Explain\
    \ the differences between the `Period` and `Duration` class.\n\nAnswer:\n\nThe\
    \ `Period` and `Duration` are both classes introduced by the `DateTime API` and\
    \ represent a time duration. However, there are some differences between the two.\
    \ These are as follows:\n\n- A `Period` represents a time interval in years, months\
    \ and days. A `Duration` on the other hand represents a time interval in seconds\
    \ and nanoseconds.\n- A `Period` is used to measure the time interval between\
    \ two `LocalDate` objects. A `Duration` on the other hand is used to measure the\
    \ time interval between two `LocalTime` objects.\n- A `Period` is typically used\
    \ to measure longer time intervals whereas a `Duration` is used to measure shorter\
    \ time intervals.\n\n### 239. Suppose you have a `String` date in the `yyyy/mm/dd`\
    \ format. How can you obtain a `LocalDate` object corresponding to such a date?\n\
    \nAnswer:\n\nThe code below demonstrates converting a `String` date in `yyyy/mm/dd`\
    \ format to a `LocalDate`:\n\n```java\nString strDate = “2012/10/11\";\nLocalDate\
    \ date = LocalDate.parse(strDate, DateTimeFormatter.ofPattern(\"yyyy/MM/dd\"));\n\
    System.out.println(date);\n```\n\nThe `LocalDate` has a `parse()` method which\
    \ can be used to convert a `String` Date to a `LocalDate` object. The `parse()`\
    \ method accepts a `LocalDate` in the `yyyy–MM–dd` format. In the scenario above,\
    \ the date is in the `yyyy/MM/dd` format, so `parse()` method will not work as\
    \ it is. However, there is an overloaded version of the `parse()` method which\
    \ accepts a `DateTimeFormatter` instance in addition to the `String` date. A `DateTimeFormatter`\
    \ can be created via the static `DateTimeFormatter.ofPattern()` method. This method\
    \ accepts as parameter a `String` corresponding to the desired data format. Here,\
    \ the code creates a `DateTimeFormatter` that can parse a date in the `yyyy/mm/dd`\
    \ format. So, this code prints the output shown below:\n\n2012–10–11\n\n### 240.\
    \ What is the output of the following code snippet?\n\n```java\nLocalDateTime\
    \ dateTime = LocalDateTime.parse(“2014–12–28T08–45–00\");\ndateTime = dateTime.withYear(1998);\n\
    System.out.println(dateTime);\n```\n\nAnswer:\n\nThe code above first creates\
    \ a `LocalDateTime` instance. It then invokes the `dateTime.withYear()` method.\
    \ This method updates the year component on the `LocalDateTime` on which it is\
    \ invoked to the specified year. So, in this case, it updates the year in `dateTime`\
    \ to `1998` and assigns the result to the `dateTime` object. So, this code prints\
    \ the output shown below:\n\n1998–12–28T08–45\n\n### 241. Explain how you can\
    \ find out if a year is a leap year using the new DateTime API.\n\nAnswer:\n\n\
    There is a method called `isLeapYear()` on the `LocalDate` class. This can be\
    \ used to check if a year is a leap year as demonstrated by the code below:\n\n\
    ```java\nLocalDate date1 = LocalDate.of(2020, 7, 24);\nboolean isLeapYear = date1.isLeapYear();\n\
    ```\n\nThis code creates a `LocalDate` called `date1` and then invokes the `isLeapYear()`\
    \ method on `date1`. The `isLeapYear()` method returns a `boolean` value. In this\
    \ case, since `date1` corresponds to the year `2020` which is a leap year, the\
