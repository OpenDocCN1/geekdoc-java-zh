    FileReader myFileReader = new FileReader(txtFile);


    myFileReader.read(totalChar); //Line 1


    for(char readChar: totalChar) {//Line 2


    System.out.print(readChar);


    }


    myFileReader.close();


    }


    catch (IOException exp) {


    }


    When Line 1 is executed, the read() method reads the content from the file and
    into the totalChar array. The for loop at line 2 then prints the contents of the
    array to the console


    180. Explain with a code sample how you can create a directory on the file system.


    Answer:


    There is a method called mkdir() on the File class that creates a directory corresponding
    to the specified file object. The following code uses this method to create a
    directory in the file system:


    File myDirectory = new File(“/usr/mydir”); //1


    myDirectory.mkdir(); //2


    Line 1 creates a file object. Line 2 invokes the mkdir() method to creates an
    actual directory.


