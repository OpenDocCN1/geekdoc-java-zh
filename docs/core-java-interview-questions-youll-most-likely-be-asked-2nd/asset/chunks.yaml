  trans: '


    - 领导他人与管理他人之间是否有区别？哪一个是你更大的强项？

    - 你在领导角色中表现得更好，还是作为团队中的成员表现得更好？

    - 请讲述一次你在工作中发现某些影响你（或他人）工作效率的经历——你是如何处理的？

    - 在有明确目标和任务的工作中，你的表现如何？

    - 在你拥有巨大决策权的工作中，你的表现如何？

    - 如果你看到其他员工有不诚实或不符合道德的行为，你会怎么办？

    - 请讲述一次你通过自学获得了知识，并在后来帮助了你职业生涯的经历。

    - 请讲述一次你在工作中构思项目想法的经历。

    - 请讲述一次你在项目中承担风险的经历。

    对于 对于那些想要进入这个领域的人，你会建议他们什么？


    ## 截止日期与时间管理


    - 请讲述一次你没有赶上截止日的经历。

    - 你在工作时如何消除干扰？

    - 请讲述一次你在有每周或每月配额任务的职位上工作的经历。你成功的频率有多高？

    - 请讲述一次你完成艰巨截止日的经历，以及你是如何完成它的。

    - 当你手上有多个项目时，你如何保持有条理？

    - 你工作日期间有多少时间处于“自动驾驶”状态？

    - 你如何处理截止日期？

    - 请介绍你个人的解决问题的流程。

    - 工作中哪些事情会让你感到压力？

    - 你如何对工作中的压力做出反应？当你感到压力时，如何让自己冷静下来？

    - 你擅长多任务处理吗？请举一些你成功处理多项任务的例子。

    - 你每周工作多少小时？

    - 你每天检查几次邮件？


    ## 客户服务


    - 什么是客户服务？

    - 请讲述一次你为客户额外付出的经历。

    - 你如何获得客户的信任？

    - 请讲述一次客户感到不悦或焦虑的经历——你是如何处理该情况的？

    - 什么时候你可以为客户破例？

    - 当客户和老板都需要你时，你会怎么办？

    - 客户服务最重要的方面是什么？

    - 为客户建立低预期还是高预期更好？


    ## 沟通


    - 描述一次你向同事传达困难或复杂想法的经历。

    - 在哪些情况下你觉得难以沟通？

    - 良好沟通的关键要素是什么？

    - 请讲述一次你通过沟通解决问题的经历。

    - 请讲述一次你与另一员工发生冲突的经历。你是如何解决该情况的？

    - 你是倾向与他人建立关系，还是花更多时间去了解他们？

    - 描述一次你必须通过人际关系来解决问题的经历。

    - 请讲述一次你说服他人承担艰巨任务的经历。

    - 请讲述一次你说服一个群体接受你提案的经历。

    - 请讲述一次你与他人发生问题的经历，事后看来，你希望当时能以不同的方式处理。

    - 请讲述一次你协调员工之间冲突的经历。


    ## 求职与日程


    - 你在职位中寻找的三个最重要的东西是什么？

    - 你是如何评估你想要加入的公司的？

    - 你接受月薪制吗？

    - 你为什么选择上一份工作？

    - 离开上一份工作已经多久了？原因是什么？

    - 你还在寻找其他类型的工作？

    - 你在工作中受过纪分吗？

    - 你的时间安排是怎样的？

    - 我可以联系你的现主吗？

    - 你是否有任何可以为我们的业务带来价值的人脉联系？

    - 你多快可以开始工作？

    - 你的前任雇主说你离开的原因是什么？

    - 你积极寻找工作多久了？

    - 在什么情况下你会不上班？

    - 你是否被主管告诉过今天提前下班？如果是，为什么？

    - 你的考勤记录如何？

    - 你在哪里听到这个职位的？

    - 在做聘用决策时，还有什么你想让我知道的吗？


    ## 以下标题可能也很有用


    1. 你可能会遇到的 `NET` 面试题

    2. 你可能会遇到的 `Access VBA` 编程面试题

