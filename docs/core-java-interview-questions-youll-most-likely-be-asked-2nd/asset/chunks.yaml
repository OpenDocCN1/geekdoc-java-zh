    \n### 102. 请用代码示例解释抽象类。\n\nAnswer:\n\n抽象类是一个具有零个或多个抽象方法的类。抽象方法是一个没有方法体的方法。抽象方法和类本身都需要指定\
    \ `abstract` 关键字。以下代码演示了一个抽象类：\n\n```java\npublic abstract class Animal {\n  \
