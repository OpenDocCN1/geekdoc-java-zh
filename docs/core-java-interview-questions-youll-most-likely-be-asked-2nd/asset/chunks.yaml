    - Is there a difference between leading and managing people– which is your greater
    strength?

    - Do you function better in a leadership role, or as a worker on a team?

    - Tell me about a time when you discovered something in the workplace that was
    disrupting your (or others) productivity– what did you do about it?

    - How do you perform in a job with clearly-defined objectives and goals?

    - How do you perform in a job where you have great decision-making power?

    - If you saw another employee doing something dishonest or unethical, what would
    you do?

    - Tell me about a time when you learned something on your own that later helped
    in your professional life.

    - Tell me about a time when you developed a project idea at work.

    - Tell me about a time when you took a risk on a project.

    - What would you tell someone who was looking to get into this field?


    ## Deadlines and Time Management


    - Tell me about a time when you didn’t meet a deadline.

    - How do you eliminate distractions while working?

    - Tell me about a time when you worked in a position with a weekly or monthly
    quota to meet. How often were you successful?

    - Tell me about a time when you met a tough deadline, and how you were able to
    complete it.

    - How do you stay organized when you have multiple projects on your plate?

    - How much time during your work day do you spend on “auto-pilot?”

    - How do you handle deadlines?

    - Tell me about your personal problem-solving process.

    - What sort of things at work can make you stressed?

    - How do you outwardly respond to stress in the workplace? How do you calm yourself
    down when you are feeling stressed?

    - Are you good at multi-tasking? Give some examples of how you successfully multi-task?

    - How many hours per week do you work?

    - How many times per day do you check your email?


    ## Customer Service


    - What is customer service?

    - Tell me about a time when you went out of your way for a customer.

    - How do you gain confidence from customers?

    - Tell me about a time when a customer was upset or agitated– how did you handle
    the situation?

    - When can you make an exception for a customer?

    - What would you do in a situation where you were needed by both a customer and
    your boss?

    - What is the most important aspect of customer service?

    - Is it best to create low or high expectations for a customer?


    ## Communication


    - Describe a time when you communicated a difficult or complicated idea to a coworker.

    - What situations do you find it difficult to communicate in?

    - What are the key components of good communication?

    - Tell me about a time when you solved a problem through communication.

    - Tell me about a time when you had a dispute with another employee. How did you
    resolve the situation?

    - Do you build relationships with people, or take more time to know them?

    - Describe a time when you had to work through politics to solve a problem.

    - Tell me about a time when you persuaded others to take on a difficult task.

    - Tell me about a time when you persuaded a group to accept your proposal.

    - Tell me about a time when you had a problem with another person that, in hindsight,
    you wished you had handled differently.

    - Tell me about a time when you negotiated a conflict between employees.


    ## Job Searching and Scheduling


    - What are the three most important things you’re looking for in a position?

    - How are you evaluating the companies you’re looking to work with?

    - Are you comfortable working for salary?

    - Why did you choose your last job?

    - How long has it been since your last job and why?

    - What other types of jobs have you been looking for?

    - Have you ever been disciplined at work?

    - What is your availability like?

    - May I contact your current employer?

    - Do you have any valuable contacts you could bring to our business?

    - How soon would you be available to start working?

    - Why would your last employer say that you left?

    - How long have you been actively looking for a job?

    - When don’t you show up to work?

    - Have you ever been told by your supervisor to leave work for the day? If so,
    why?

    - What is your attendance record like?

    - Where did you hear about this position?

    - Tell anything else you’d like me to know when making a hiring decision.


    ## Some of the following titles might also be handy


    1. `NET` Interview Questions You’ll Most Likely Be Asked

    2. `Access VBA` Programming Interview Questions You’ll Most Likely Be Asked

