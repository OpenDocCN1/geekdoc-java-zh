    d. `mkdir`：创建一个目录\ne. `getAbsolutePath`：返回文件的绝对路径\n\n# 第 18 章\n# 杂记\n\n### 187.\
    \ 解释编译以下代码段时会发生什么。\n\n```java\npublic class Test {\n    public static void main(String\
