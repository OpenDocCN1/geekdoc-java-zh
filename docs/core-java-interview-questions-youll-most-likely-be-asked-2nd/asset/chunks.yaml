    ## 340. What situations do you find it difficult to communicate in?


    Answer:


    Even great communicators will often find particular situations that are more difficult
    to communicate effectively in, so don’t be afraid to answer this question honestly.
    Be sure to explain why the particular situation you name is difficult for you
    and try to choose an uncommon answer such as language barrier or in time of hardship,
    rather than a situation such as speaking to someone of higher authority.


    *As an example:*


    It can sometimes be difficult to communicate effectively when delivering bad news.
    It is easy to become stressed, or worried about how the person will react. It
    is important to not attempt to communicate until you feel prepared. Be ready to
    listen instead of just talk, answer questions you have the answers to, and offer
    a sense of empathy for what the person is thinking or feeling. Above all it’s
    important to communicate openly and confidently, so the person feels comfortable
    and has confidence in you or the situation.


    ## 341. What are the key components of good communication?


    Answer:


    Some of the components of good communication include an environment that is free
    from distractions, feedback from the listener, and revision or clarification from
    the speaker when necessary. Refer to basic communication models where necessary
    and offer to go through a role-play sample with the interviewer in order to show
    your skills.


    *As an example:*


    I find it best to be sure to make eye contact and avoid distractions such as the
    phone or computer while having a serious conversation. Knowing it’s ok to ask
    for clarification is important so there are not any instances of misunderstandings.
    Reflective listening is a great tool in any communication, where you show the
    person you were listening to them by repeating back certain things they said when
    appropriate (For example “I hear you saying you need more support with this project.
    Let’s work on how we can fix it and get you the support you need.


    ## 342. Tell me about a time when you solved a problem through communication.


    Answer:


    Solving problems through communication is key in the business world, so choose
    a specific situation from your previous job in which you navigated a messy situation
    by communicating effectively through the conflict. Explain the basis of the situation,
    as well as the communication steps you took, and end with a discussion of why
    communicating through the problem was so important to its resolution.


    *As an example:*


    My department was having too many misunderstandings due to lack of in person communication
    and only speaking through e-mail. We never checked our e-mail at the same time
    and were never on the same page. We continued to overlap on work and tasks were
    not evenly distributed, with many tasks falling through the cracks. Additionally,
    there were instances where directives were not clear via e-mail. I requested our
    department make time for at least bi-weekly department meetings to make sure we
    were all on the same page and allow time without distraction to address each other
    and provide updates on department projects. This time together built comradery
    among the team and provided an effective way to open more lines of communication.


    ## 343. Tell me about a time when you had a dispute with another employee. How
    did you resolve the situation?


    Answer:


    Make sure to use a specific instance, and explain step-by-step the scenario, what
    you did to handle it, and how it was finally resolved. The middle step, how you
    handled the dispute, is clearly the most definitive - describe the types of communication
    you used, and how you used compromise to reach a decision. Conflict resolution
    is an important skill for any employee to have and is one that interviewers will
    search for to determine both how likely you are to be involved in disputes, and
    how likely they are to be forced to become involved in the dispute if one arises.


    *As an example:*


    When I had a dispute with a coworker I asked if we could talk about the issue.
    They clearly were not interested at first. I let them have their space and checked
    back a couple of days later, while gently pushing the fact that I respected them
    and wanted to put the issue behind us so we can both move forward and work together
    better. I proposed a few different times to meet to discuss the issue and allowed
    them to choose the time that worked best for them. This made them feel as though
    they were in some position of control and had buy in. Once we met, I explained
    again I wanted to move forward and focused on the positive traits about them and
    our team working abilities and asked them how they felt we should resolve the
    issue. I listened intently and offered my input once they were finished. We moved
    forward and put it behind us after that and were able to effectively communicate
    better than ever before We were also more comfortable to approach each other with
    any other issues that arose from then on out.


    ## 344. Do you build relationships quickly with people, or take more time to get
    to know them?


    Answer:


    Either of these options can display good qualities, so determine which style is
    more applicable to you. Emphasize the steps you take in relationship-building
    over the particular style and summarize briefly why this works best for you.


    *As an example:*


    I feel I get along with anyone pretty quickly and easily build effective working
    relationships. I am always careful to not get too comfortable too fast, as certain
    aspects of any relationship take time to develop. While I may run into people
    throughout the course of my career that I just do not mesh with well, I am still
    able to maintain a professional working relationship and mutual respect with them.


    ## 345. Describe a time when you had to work through office politics to solve
