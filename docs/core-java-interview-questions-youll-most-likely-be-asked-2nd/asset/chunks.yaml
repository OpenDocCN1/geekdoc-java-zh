    大多数情况下，开发者会将工具方法放在一个单独的工具类（util class）中。然而，你应该尝试将工具代码放在与它相关的类中。例如，如果你有一个名为 `Car`
    的类，并且你需要创建一个名为 `createCar` 的工具方法，它可以是 `Car` 类本身的一个静态方法，而不是拥有一个单独的 `CarUtil` 类。然而，在许多编程场景下，你可能需要将一些互无关的工具方法组合在一起。在这种情况下，你可以创建一个单独的类并在该类中创建静态工具方法。从
    Java 8 开始，你也可以在接口（interface）中拥有静态方法。静态接口方法有助于将工具方法组合在一起，而无需创建类的实例对象。


    290. 假设你作为 API 的一部分开发了一个名为 `FileWriter` 的接口。它有一个 `writeToCsv` 文件方法，可以将传入的内容写入
    CSV 文件中。该 API 由不同的应用程序实现，这些应用程序提供了 `FileWriter` 接口的实现。现在，假设你被向接口中添加一个名为 `writeToExcel`
    的新方法，将传入的内容写入 Excel 文件。你如何能在对 API 用户影响最小的情况下完成这一变更？


    答案：


    在上述场景中，需要向 `FileWriter` 接口添加一个新方法。简单地向接口中添加该方法会导致所有实现该接口的现有类出现编译错误，并要求所有类为 `writeToExcel()`
    方法提供实现。最好的方法是将 `writeToExcel()` 方法作为**默认方法**（default method）添加到 `FileWriter` 接口中。默认方法是
    Java 8 添加的一项新功能。它们允许你在接口中创建带有方法体的方法。实现接口的类不需要为默认方法提供实现。因此，在 `FileWriter` 接口中将
    `writeToExcel()` 方法作为默认方法不会影响实现 `FileWriter` 的类。默认方法是由 Java 8 引入的。因此，如果你使用的是较早的
    Java 版本，那么该解决方案将不起作用。在这种情况下，你可以创建一个 `FileWriter` 接口的新版本（例如 `FileWriterEnhanced`），该接口扩展了当前的
    `FileWriter` 并在 `FileWriterEnhanced` 接口中添加 `writeToExcel()` 方法。在这种情况下，实现 `FileWriter`
    接口的现有代码将按原样运行。任何需要 `writeToExcel()` 方法的代码将需要实现 `FileWriterEnhanced` 接口。


