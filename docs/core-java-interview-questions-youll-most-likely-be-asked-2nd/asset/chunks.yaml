    \ {\n    public static void main(String argument[]) {\n        Electronics e =\
    \ new Camera(); //Line 1\n        Camera c = new Electronics(); //Line 2\n   \
    \ }\n}\n```\n\n**Answer:**\n\nIn this code snippet, the code at Line 1 will compile\
    \ fine since a sub–class object can be assigned to a super-class type. However,\
    \ the code at Line 2 will cause a compilation error. This is because a super class\
    \ instance cannot be assigned to a variable of subclass type.\n\n### 089. Write\
    \ a code sample that demonstrates how inheritance can help in code reuse\n\n**Answer:**\n\
    \nConsider the following code:\n\n```java\nclass Electronics {\n    public void\
    \ displayPrice() { //Line 1\n        System.out.println(“Price is ...”);\n   \
    \ }\n}\n\nclass Camera extends Electronics {\n    public void displayBatteryDuration()\
