    185. Which classes are used to serialize and de–serialize objects?


    Answer:


    Serialization is the process of writing an object onto the file system. The java.io.ObjectOutputStream
    can be used to serialize objects. It has a writeObject() method which can be used
    to achieve this. De–serialization is the process of restoring a serialized object.
    The java.io.ObjectInputStream can be used to serialize objects. It has a readObject()
    method which can be used to achieve this.


    186. Explain some of the important methods on the File class.


    Answer:


    A File class encapsulates a file or directory on the file system. Some of the
    methods on the File class are as follows:


    a. **createNewFile()**: Creates a new empty file


    b. **list()**: Returns an array of the files/directories within the current directory


