    Float value is: \"+fValue);\n    }\n}\n```\n\nAnswer:\n\nThe above code will cause\
    \ a compilation error because the `main` method tries to access the non–static\
    \ instance variable `fvalue`. Java does not allow accessing a static variable\
    \ from a non–static method.\n\n### 189. Explain symmetric equals() contract.\n\
    \nAnswer:\n\nSuppose that there are two objects `v1` and `v2`. If `v1.equals(v2)`\
    \ returns true then `v2.equals(v1)` must return true. This `equals()` contract\
    \ is called as symmetric contract. Consider the following code:\n\n```java\nObject\
    \ v1; Object v2;\nv1.equals(v2); //Line 1\nv2.equals(v1); //Line 2\n```\n\nSo,\
    \ in case of a symmetric contract, Line 1 returns true if and only if Line 2 returns\
    \ true.\n\n### 190. Which of the following are invalid statements and why?\n\n\
    ```java\nSystem.out.println(2+2); //line 1\nint i= 2+’2’; //line 2\nString s=\
    \ “one”+’two’; //line 3\nbyte b=256; //line 4\n```\n\nAnswer:\n\nLine 1 and line\
    \ 2 are valid statements.\n\nLine 3 is invalid. The value `two` is not valid since\
    \ single quotes cannot be used for a String, they can only be used for a character\
    \ constant. Strings need to be enclosed in double quotes.\n\nLine 4 is invalid.\
    \ The byte variable `b` cannot be assigned the value 256 since it is out of the\
    \ range of a byte.\n\n### 191. What is the use of transient keyword?\n\nAnswer:\n\
    \nThe `transient` keyword can be specified on an instance variable. Specifying\
    \ `transient` for an instance variable indicates that its state should not be\
    \ saved when the object is serialized. Consider the following code snippet:\n\n\
    ```java\nclass Electronics implements Serializable {\n    transient private int\
    \ price; //Line 1\n    private int quantity; //Line 2\n}\n```\n\nWhen an instance\
    \ of the `Electronics` class is serialized, the `price` field will not be serialized,\
    \ only the `quantity` field will be serialized.\n\n### 192. What is Garbage Collection\
    \ in Java?\n\nAnswer:\n\nGarbage collection is the process of freeing memory allocated\
    \ to objects that are no longer used. During runtime, when an object is created,\
    \ the `JVM` allocates some memory to hold the object. The `JVM` periodically checks\
    \ for objects that are in use and de–allocates the memory for those objects which\
    \ are not in use anymore. Garbage collection is this process of removing objects\
    \ that are no longer in use. So, the programmer does not have to bother about\
    \ manual de–allocation of memory.\n\n### 193. Which part of the memory is used\
    \ in Garbage Collection? Which algorithm does the JVM use for Garbage collection?\n\
    \nAnswer:\n\nGarbage Collection is done in the heap memory. The `JVM` uses the\
    \ `mark and sweep` algorithm internally for garbage collection.\n\n### 194. When\
    \ does garbage collection occur?\n\nAnswer:\n\nThe `JVM` (Java Virtual Machine)\
    \ controls the garbage collection process. So, the `JVM` decides when the garbage\
    \ collection process should run.\n\nIt is also possible to explicitly request\
    \ garbage collection through Java code via the `System.gc()` or `Runtime.getRuntime().gc()`\
    \ method. However, there is no guarantee that invoking these methods will run\
    \ the garbage collector.\n\n### 195. What code needs to be written in order to\
    \ trigger garbage collection?\n\nAnswer:\n\nGarbage collection can be triggered\
    \ in one of the following ways:\n\nMethod 1– Using `Runtime.gc()`:\n```java\n\
    Runtime.getRuntime();\n```\n\nMethod 2– Using `System.gc()`:\n```java\nSystem.gc();\n\
    ```\n\nBoth these approaches do not guarantee garbage collection, it is up–to\
    \ the `JVM` to decide.\n\n### 196. Explain with a code sample how object becomes\
    \ eligible for garbage collection.\n\nAnswer:\n\nAn object becomes eligible for\
    \ garbage collection when it is no longer referenced. The following scenarios\
    \ demonstrate this:\n\nScenario 1– Setting the object to null\n```java\nString\
    \ stringValue = “This is a String”; //Line 1\nstringValue = null; //Makes stringValue\
    \ eligible for GC\n```\n\nScenario 2– Re–assigning a variable\n```java\nString\
    \ str1 = “Hello”;\nString str2 = str1;makes str1 eligible for GC\n```\n\nScenario\
    \ 3– Objects created within a method\n```java\npublic void doSomething(){\n  \
    \  String str1 = “Hello”;\n}\n\npublic void callMethod(){\n    doSomething();\n\
    //str1 from doSomething becomes eligible for GC\n}\n```\n\n# SECTION 02\n# CORE\
    \ JAVA\n# JAVA 8\n\n# CHAPTER 01\n# Functional INTERACES\n\n### 197. What is a\
    \ functional interface? How can you create a functional interface?\n\nAnswer:\n\
    \nA functional interface is an interface that has only one abstract method. In\
    \ order to create a functional interface, you simply need to create an interface\
    \ that has just one abstract method as shown below:\n\n```java\n@FunctionalInterface\n\
    public interface Multiplier {\n    public int multiply(int a, int b);\n}\n```\n\
    \nThis code defines an interface called `Multiplier`. It has only a `multiply`\
    \ method. It has the `@FunctionalInterface` annotation specified. This annotation\
    \ is optional, it marks the interface as a functional interface. So, if you try\
    \ to add another abstract method to the interface, the code causes a compilation\
    \ error.\n\n### 198. Explain the java.util.Function package.\n\nAnswer:\n\nThe\
    \ `java.util.function` is a new package added by Java 8. It has a lot of built–in\
    \ functional interfaces. Some of the interfaces in this package are as follows:\n\
    \na. `Predicate`: This can be used to test a condition. It returns a boolean value\
    \ which indicates whether the condition is true or false. It accepts an argument\
    \ of any data type.\nb. `Consumer`: This can be used to operate on a value. It\
    \ accepts an argument of any data type and operates on it. It returns a void.\n\
    c. `Function`: This can be used to transform an input value. It accepts an argument\
    \ of any data type, transforms it and returns a result.\nd. `Supplier`: This can\
    \ be used to produce a value. It does not accept any argument, but produces a\
    \ result of any data type.\n\n### 199. Explain the java.util.function.Consumer\
    \ interface with a code sample.\n\nAnswer:\n"
