    \ without having to write it.\n\n### 090. Write a Java code sample that demonstrates\
    \ method overriding.\n\n**Answer:**\n\nMethod overriding occurs when a sub–class\
    \ method has the same name and type signature as a method in a superclass. Consider\
    \ the following code:\n\n```java\npublic class Electronics {\n    public void\
