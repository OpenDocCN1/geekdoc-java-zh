    219. Explain the types of Stream operations.


    Answer:


    Stream operations can be categorized as follows:


    a. **Intermediate**: Intermediate operations operate on Streams and produce a
    Stream output. Since intermediate operations produce a Stream, they can be chained
    to perform a series of operations. Some examples of intermediate operations are
    filter, map, sorted


    b. **Terminal**: Terminal operations operate on Streams but produce a non–stream
    result. So, they can produce a result of any data type. Terminal operations cannot
    be chained. When a number of Stream operations are chained, a terminal operation
    is typically the last operation. Some examples of terminal operations are count,
    anyMatch, allMatch, collect


    220. What is a parallel stream? Explain with a code sample how you can create
    a parallel stream.


    Answer:


    In addition to sequential streams, the Stream API also supports parallel streams.
    Parallel streams operate concurrently on the elements in a Stream and hence provide
    a performance improvement. A new method called parallelStream() has been added
    to the Collection interface. This can be used to obtain a parallel stream corresponding
    to the underlying collection. The following code demonstrates this:


    List<String> colours = Arrays.asList(“Red”,”Green”,”Blue”);


    Stream<String> parallelStream = colours.parallelStream();


    This code first creates a List of String values called colours. It then invokes
    the parallelStream() method on the colours List. This returns a parallel stream
    corresponding to the List. Any further Stream operations performed on this stream
    will be executed concurrently on the elements in the Stream.


    221. How can you convert a Stream back to a Collection?


    Answer:


    The Stream interface has a method called collect(). This can be used to convert
    a Stream back to a Collection. The following code demonstrates this:


    Stream<Integer> numbers = Stream.of(7,3,9,6,1);


    List<Integer> filteredList = numbers.filter(num–> num > 5).collect(Collectors.toList());


    This code first creates a List of Integers. It then invokes the filter() method
    to obtain the numbers that are greater than 5\. After that, it invokes the collect()
    method. The collect() method accepts as parameter a Collector. The Collectors.toList()
    method is invoked which returns a Collector that converts the input Stream to
    a List. So, the filteredList is a List that has only the numbers that are greater
    than 5 from the input List. There are other methods in the Collectors class like
    Collectors.toSet, Collectors.toMap, Collectors.toCollection which can be used
    to convert the Stream to other types of Collections.


    222. What is the output of the following code snippet?


    Stream<Integer> numbers = Stream.of(10,15,20,25);


    boolean anyMatch = numbers.anyMatch(num–> num%2==0);


    System.out.println(anyMatch);


    Answer:


    The code snippet above uses the anyMatch() method on the Stream Interface. This
    method returns true if any of the elements in the input Stream match the specified
    condition. In this case, it checks if there is an even number in the input Stream.
    Since there are even numbers in the Stream, the


    anyMatch() method returns a true. So, this code prints the following output:


    true


    223. What is the difference between a Stream and a Collection?


    Answer:


    There are several differences between a Stream and a Collection. These are as
    follows:


    • Collections actually store the data. A stream on the other hand does not store
    any data, it just performs some operations on the underlying data


    • When you perform an operation on a Collection, the Collection gets modified.
    When you perform an operation on a Stream obtained on a Collection, the underlying
    Collection does not get modified


    • A Collection can be modified after it is created. A Stream on the other hand
    cannot be modified after it is constructed


    • You can traverse a Collection any number of times. However, you can traverse
    a Stream only once. If you wish to traverse over a Stream again it is not possible,
    you need to create a new Stream from the underlying source and traverse it again


    224. Suppose you have a List of String values. You want to create a new List that
    eliminates the duplicates from the original List and has the String values in
    uppercase. How will you achieve this via Stream operations?


    Answer:


    The following code snippet demonstrates the above requirement:


    List<String> fruits =


    Arrays.asList(“Apple”,”Mango”,“Banana”,”Apple”, ”Orange”, “Mango”,”Strawberry”);
    //Line 1


    List<String> uniqueFruits = fruits.stream().distinct().map(str–> str.toUpperCase()).collect(Collectors.toList());
    //Line 2


    uniqueFruits.forEach(str–> System.out.println(str));//Line 3


    This code first creates a List of String values called fruits at Line 1\. Line
    2 first invokes the fruits.stream() which obtains a Stream on the fruits List.
    It then invokes the distinct() operation. The distinct() method returns a new
    Stream that consists of only the distinct elements in the input Stream. Next,
    it invokes the map() operation. The map() operation can be used to transform a
    Stream. It accepts as parameter a Function instance and applies the Function to
    each element in the Stream. Here, a lambda expression is used to convert each
    String in the Stream to uppercase. Finally, it invokes the collect() method, passing
    in a Collector that converts the Stream to a List. Line 3 then prints all the
    elements in the uniqueFruits List. So, this code prints the following output:


    APPLE


    MANGO


    BANANA


    ORANGE


    STRAWBERRY


    225. Is it possible to convert an array to a Stream? Explain.


    Answer:


    Yes, it is possible to convert an Array to a Stream. Java 8 has added a stream()
    method to the java.util.Arrays class. This has many overloaded versions that accept
    arrays of different data types and convert the array to a Stream. The following
