  trans: "\nJava 8 增加了函数式接口以支持 lambda 表达式并为 Java 函数式编程支持。由于 Java 是一种面向对象的语言，lambda\
    \ 表达式不能独立存在。它们需要与对象关联。因此，Java 8 引入了函数式接口，并强制 lambda 表达式只能配合函数式接口使用。通过让 lambda\
    \ 表达式实现函数式接口的方法，lambda 表达式变成了函数式接口的实现。函数式接口和 lambda 表达式有助于编写简洁的 Java 代码。\n\n##\
    \ 209. 解释 lambda 表达式的语法。\n\n**答案：**\n\n以下是 lambda 表达式的语法：\n\n`(parameters)–> {lambda\
    \ body}`\n\n因此，一个 lambda 表达式由表达式的 `parameters`、lambda 运算符 `(–>)` 和 `expression\
    \ body` 组成。lambda 表达式接收零或多个参数。如果不接受任何参数，则需要使用空括号。如果接受单个参数，则不需要在括号中指定参数。如果接受多个参数，则需要在括号中指定并用逗号隔开。lambda\
    \ 体是普通的 Java 代码，可以包含任意数量的语句。如果 lambda 体中只有一条语句，可以省略主体周围的大括号，否则需要指定它们。\n\n## 210.\
    \ 提供一些 lambda 表达式的示例。\n\n**答案：**\n\n以下是一些 lambda 表达式的示例：\n\n**示例 1– 单参数，无返回值**\n\
    \n`str–> System.out.println(str);`\n\n此 lambda 表达式接受一个参数并使用 `Sysout` 语句打印它。它不返回任何值。\n\
    \n**示例 2– 多个参数和返回值**\n\n`(num1, num2)–> num1+num2;`\n\n此 lambda 表达式接受两个参数并返回它们相加的结果。这里没有显式指定\
    \ `return` 关键字。\n\n**示例 3– 无参数，lambda 体和返回值**\n\n```java\n()>(){\n//在此执行某些操作\n\
    return 0;\n}\n```\n\n此 lambda 表达式不接受任何参数。它有一个执行某些代码体。它返回值 `0`。\n\n## 211. 编写一个代码示例，创建一个函数式接口并使用\
    \ Lambda 表达式实现它。\n\n**答案：**\n\n函数式接口是一个只有一个抽象方法的接口。考虑以下函数式接口：\n\n```java\n@FunctionalInterface\n\
    public interface StringConverter {\n    public String convert(String s);\n}\n\
    ```\n\n此代码定义了一个名为 `StringConverter` 的函数式接口，包含一个名为 `convert` 方法。`convert` 方法接受一个\
    \ `String` 值并返回一个 `String`。\n\nlambda 表达式为函数式接口中的方法提供了实现。\n\n因此，你可以如下使用 lambda\
    \ 表达式实现 `StringConverter` 接口：\n\n```java\nStringConverter converter = (str)–>\
    \ str.toUpperCase();\n```\n\n在这里，`StringConverter` 通过一个 lambda 表达式实现，该表达式将输入的\
    \ `String` 转换为大写并返回。\n\n## 212. 用代码示例说明如何使用不同的 lambda 表达式以不同的方式实现同一个函数式接口。\n\n\
    **答案：**\n\n考虑以下 `StringConverter` 函数式接口：\n\n```java\n@FunctionalInterface\npublic\
    \ interface StringConverter {\n    public String convert(String s);\n}\n```\n\n\
    现在可以通过不同的 lambda 表达式为 `convert` 方法提供不同的实现，如下：\n\n```java\nStringConverter upperCaseconverter\
    \ = str–> str.toUpperCase();\nString result = upperCaseconverter.convert(“Hello”);\n\
    ```\n\n在这里，`StringConverter` 接口通过一个 lambda 表达式实现，该表达式将输入的 `String` 转换为大写并返回。\n\
    \n现在考虑以下代码：\n\n```java\nStringConverter lowerCaseconverter = str–> str.toLowerCase();\n\
    String result = lowerCaseconverter.convert(“Hello”);\n```\n\n在这里，`StringConverter`\
    \ 接口通过一个 lambda 表达式实现，该表达式将输入的 `String` 转换为小写并返回。\n\n因此，不同的 lambda 表达式为 `StringConverter`\
    \ 接口提供了不同的实现。\n\n## 213. 识别以下 lambda 表达式中的错误以及如何修复它。\n\n`(str)–> return str.toUpperCase();`\n\
    \n**答案：**\n\n上面的 lambda 表达式在 lambda 体中使用了 `return` 关键字。如果使用了 `return` 关键字，则 lambda\
    \ 体需要包含在大括号中。或者，也可以移除 `return` 关键字以消除错误。\n\n因此，上面的 lambda 表达式可以通过以下两种方式修复：\n\n\
    ```java\n(str)–> {return str.toUpperCase();};\n```\n\n或者\n\n```java\n(str)–> str.toUpperCase();\n\
    ```\n\n## 214. 下列代码有效吗？请解释。\n\n```java\npublic void generateSquareRoot(int num)\
    \ {\n    Function<Integer, Double> squareRoot = (num)–> Math.sqrt(num);\n}\n```\n\
    \n**答案：**\n\n上面的代码指定了一个名为 `generateSquareRoot` 方法。它接受一个整数值作为参数。然后使用内置的函数式接口 `Function`\
    \ 并通过 lambda 表达式实现它。该代码无效并会导致编译错误。这是因为你不能在 lambda 表达式内部声明与外部方法变量同名的参数或局部变量。`generateSquareRoot`\
    \ 方法接受一个名为 `num` 的参数，并在 lambda 表达式使用了相同的名称，这导致了编译错误。可以通过重命名方法参数或 lambda 表达式参数来修复它。\n\
    \n## 215. 编写一个函数式接口，使得以下 lambda 表达式可以工作。\n\n`(input)–> input.toUpperCase();`\n\
    \n**答案：**\n\n上面的代码段指定了一个接受 `String` 值、将其转换为大写并返回的 lambda 表达式。因此，它可以用于实现函数式接口：\n\
    \n```java\n@FunctionalInterface\npublic interface Interface1 {\n    public String\
    \ doSomething(String input);\n}\n```\n\n此代码定义了一个名为 `Interface1` 的函数式接口。它有一个接受\
    \ `String` 作为输入并返回 `String` 方法。\n\n## 216. 说明如何使用 lambda 表达式创建一个新线程。\n\n**答案：**\n\
    \n`java.lang.Runnable` 接口用于创建新线程。Java 8 将此接口指定为函数式接口，因此你可以使用 lambda 表达式实现它。以下代码演示了这一点：\n\
    \n```java\nRunnable r = ()–> {\n    System.out.println(“Starting Thread..”);\n\
    \    //其他代码\n};\n\nThread myThread = new Thread(r);\nmyThread.start();\n```\n\n\
    在这里，`Runnable` 接口通过一个包含简单 `Sysout` 语句的 lambda 表达式实现。使用该 `Runnable` 实例创建新的 `myThread`\
    \ 对象。调用 `myThread.start()` 方法将产生新线程。\n\n# 第三章\n\n# Streams\n\n## 217. 解释创建 Stream\
    \ 的不同方法。\n\n**答案：**\n\n有多种方法可以创建 Stream。如下：\n\na. 你可以直接从值流创建一个列表：\n\n```java\n\
    Stream<String> values = String.of(“Red, “Blue”);\n```\n\nb. 你可以从集合创建一个 Stream：\n\
    \n```java\nList<Integer> numbers = Arrays.asList(1,2,3,4);\nStream<Integer> stream\
    \ = numbers.stream();\n```\n\nc. 你可以从数组创建一个 Stream：\n\n```java\nint[] numbers\
    \ = new int[] {1,2,3,4};\nIntStream arrayStream= Arrays.stream(numbers);\n```\n\
    \n## 218. 用代码示例解释 Stream filter 操作。\n\n**答案：**\n\n`Stream.filter()` 操作可以根据某些条件过滤\
    \ `Stream`。因此，它会创建一个仅包含符合指定元素的新的 `Stream`。它接受一个 `Predicate` 实例作为参数并根据指定的谓词过滤流中的元素。以下代码演示了这一点：\n\
    \n```java\nStream<Integer> numbers = Stream.of(7,3,9,6,1);\nStream<Integer> output\
    \ = numbers.filter(num–> num > 5);\n```\n"
- fmt: "\nThis code creates a `Stream` of some Integer values. It then invokes the\
    \ `filter()` method with a lambda expression that checks if the input number is\
    \ greater than 5. So, the output `Stream` will only consist of those numbers that\
    \ are greater than 5.\n\n### 219. Explain the types of Stream operations.\n\n\
    Answer:\n\nStream operations can be categorized as follows:\n\na. **Intermediate**:\
    \ Intermediate operations operate on `Streams` and produce a `Stream` output.\
    \ Since intermediate operations produce a `Stream`, they can be chained to perform\
    \ a series of operations. Some examples of intermediate operations are `filter`,\
    \ `map`, `sorted`.\n\nb. **Terminal**: Terminal operations operate on `Streams`\
    \ but produce a non–stream result. So, they can produce a result of any data type.\
    \ Terminal operations cannot be chained. When a number of `Stream` operations\
    \ are chained, a terminal operation is typically the last operation. Some examples\
    \ of terminal operations are `count`, `anyMatch`, `allMatch`, `collect`.\n\n###\
    \ 220. What is a parallel stream? Explain with a code sample how you can create\
    \ a parallel stream.\n\nAnswer:\n\nIn addition to sequential streams, the `Stream\
    \ API` also supports parallel streams. Parallel streams operate concurrently on\
    \ the elements in a `Stream` and hence provide a performance improvement. A new\
    \ method called `parallelStream()` has been added to the `Collection` interface.\
    \ This can be used to obtain a parallel stream corresponding to the underlying\
    \ collection. The following code demonstrates this:\n\n```java\nList<String> colours\
    \ = Arrays.asList(“Red”,”Green”,”Blue”);\nStream<String> parallelStream = colours.parallelStream();\n\
    ```\n\nThis code first creates a `List` of String values called `colours`. It\
    \ then invokes the `parallelStream()` method on the `colours` List. This returns\
    \ a parallel stream corresponding to the List. Any further `Stream` operations\
    \ performed on this stream will be executed concurrently on the elements in the\
    \ `Stream`.\n\n### 221. How can you convert a Stream back to a Collection?\n\n\
    Answer:\n\nThe `Stream` interface has a method called `collect()`. This can be\
    \ used to convert a `Stream` back to a `Collection`. The following code demonstrates\
    \ this:\n\n```java\nStream<Integer> numbers = Stream.of(7,3,9,6,1);\nList<Integer>\
    \ filteredList = numbers.filter(num–> num > 5).collect(Collectors.toList());\n\
    ```\n\nThis code first creates a `List` of Integers. It then invokes the `filter()`\
    \ method to obtain the numbers that are greater than 5. After that, it invokes\
    \ the `collect()` method. The `collect()` method accepts as parameter a `Collector`.\
    \ The `Collectors.toList()` method is invoked which returns a `Collector` that\
    \ converts the input `Stream` to a `List`. So, the `filteredList` is a `List`\
    \ that has only the numbers that are greater than 5 from the input List. There\
    \ are other methods in the `Collectors` class like `Collectors.toSet`, `Collectors.toMap`,\
    \ `Collectors.toCollection` which can be used to convert the `Stream` to other\
    \ types of `Collections`.\n\n### 222. What is the output of the following code\
    \ snippet?\n\n```java\nStream<Integer> numbers = Stream.of(10,15,20,25);\nboolean\
    \ anyMatch = numbers.anyMatch(num–> num%2==0);\nSystem.out.println(anyMatch);\n\
    ```\n\nAnswer:\n\nThe code snippet above uses the `anyMatch()` method on the `Stream`\
    \ Interface. This method returns true if any of the elements in the input `Stream`\
    \ match the specified condition. In this case, it checks if there is an even number\
    \ in the input `Stream`. Since there are even numbers in the `Stream`, the `anyMatch()`\
    \ method returns a true. So, this code prints the following output:\n\ntrue\n\n\
    ### 223. What is the difference between a Stream and a Collection?\n\nAnswer:\n\
    \nThere are several differences between a `Stream` and a `Collection`. These are\
    \ as follows:\n\n- `Collections` actually store the data. A stream on the other\
    \ hand does not store any data, it just performs some operations on the underlying\
    \ data.\n- When you perform an operation on a `Collection`, the `Collection` gets\
    \ modified. When you perform an operation on a `Stream` obtained on a `Collection`,\
    \ the underlying `Collection` does not get modified.\n- A `Collection` can be\
    \ modified after it is created. A `Stream` on the other hand cannot be modified\
    \ after it is constructed.\n- You can traverse a `Collection` any number of times.\
    \ However, you can traverse a `Stream` only once. If you wish to traverse over\
    \ a `Stream` again it is not possible, you need to create a new `Stream` from\
    \ the underlying source and traverse it again.\n\n### 224. Suppose you have a\
    \ List of String values. You want to create a new List that eliminates the duplicates\
    \ from the original List and has the String values in uppercase. How will you\
    \ achieve this via Stream operations?\n\nAnswer:\n\n```java\nList<String> fruits\
    \ = Arrays.asList(“Apple”,”Mango”,“Banana”,”Apple”, ”Orange”, “Mango”,”Strawberry”);\
    \ //Line 1\nList<String> uniqueFruits = fruits.stream().distinct().map(str–> str.toUpperCase()).collect(Collectors.toList());\
    \ //Line 2\nuniqueFruits.forEach(str–> System.out.println(str));//Line 3\n```\n\
    \nThis code first creates a `List` of String values called `fruits` at Line 1.\
    \ Line 2 first invokes `fruits.stream()` which obtains a `Stream` on the `fruits`\
    \ List. It then invokes the `distinct()` operation. The `distinct()` method returns\
    \ a new `Stream` that consists of only the distinct elements in the input `Stream`.\
    \ Next, it invokes the `map()` operation. The `map()` operation can be used to\
    \ transform a `Stream`. It accepts as parameter a `Function` instance and applies\
    \ the `Function` to each element in the `Stream`. Here, a lambda expression is\
    \ used to convert each String in the `Stream` to uppercase. Finally, it invokes\
    \ the `collect()` method, passing in a `Collector` that converts the `Stream`\
    \ to a `List`. Line 3 then prints all the elements in the `uniqueFruits` List.\
    \ So, this code prints the following output:\n\nAPPLE\nMANGO\nBANANA\nORANGE\n\
    STRAWBERRY\n\n### 225. Is it possible to convert an array to a Stream? Explain.\n\
    \nAnswer:\n\nYes, it is possible to convert an `Array` to a `Stream`. Java 8 has\
    \ added a `stream()` method to the `java.util.Arrays` class. This has many overloaded\
    \ versions that accept arrays of different data types and convert the array to\
    \ a `Stream`. The following code demonstrates converting an Integer array to a\
    \ `Stream`:\n\n```java\nint[] numbers = {10,20,30};\nIntStream numberStream =\
    \ Arrays.stream(numbers);\n```\n\nThis code first creates an `int` array called\
