    312. How do you perform in a job where you have great decisionmaking power?


    Answer:


    The interviewer wants to know that, if hired, you won’t be the type of employee
    who needs constant supervision or who asks for advice, authority, or feedback
    every step of the way. Explain that you work well in a decisive, productive environment,
    and that you look forward to taking initiative in your position.


    *As an example:*


    I have been given the opportunity to be in the role of decision maker many times
    in previous roles. There are times where a guideline exists of how to properly
    perform the job and limitations within your role, however, there are instances
    where you must make a prompt decision on the spot. During these times I have no
    problem with being creative in solving a problem and informing my superiors of
    what took place afterward, to keep them in the loop.


    313. If you saw another employee doing something dishonest or unethical, what
    would you do?


    Answer:


    In the case of witnessing another employee doing something dishonest, it is always
    best to act in accordance with company policies for such a situation - and if
    you don’t know what this company’s specific policies are, feel free to simply
    state that you would handle it according to the policy and by reporting it to
    the appropriate persons in charge. If you are aware of the company’s policies
    (such as if you are seeking a promotion within your own company), it is best to
    specifically outline your actions according to the policy.


    *As an example:*


    This really depends on what they were doing. Some things such as stealing large
    amounts of money, equipment, or anything that puts themselves or someone else
    in danger, would need to be reported immediately. There may be times however,
    where a coworker is perhaps breaking a policy or going around protocol to save
    time or cut costs, and it may be detrimental to themselves or the company. In
    these instances, I would feel comfortable discussing the issue with my coworker
    myself and seeing if I can help them in any way and let them know that what they
    were doing was wrong. They may not have even realized it was wrong or may have
    been going through rough times. If they continued to do so even after we spoke,
    I would feel comfortable bringing the issue to management.


    314. Tell me about a time when you learned something on your own that later helped
    in your professional life.


    Answer:


    This question is important because it allows the interviewer to gain insight into
    your dedication to learning and advancement. Choose an example solely from your
    personal life, and provide a brief anecdote ending in the lesson you learned.
    Then, explain in a clear and thorough manner how this lesson has translated into
    a usable skill or practice in your position.


    *As an example:*


    I work with a volunteer organization on the weekends. When the president of the
    organization was unavailable to lead a fundraising event, I had to step in and
    assure the event went smoothly, set it up, and emcee to the crowd. I was very
    nervous but this ended up helping increase my public speaking skills drastically,
    and the next team meeting we had at work I was able to speak to my coworkers and
    present my project without feeling nervous. I also was asked to coordinate the
    next employee event at work and used some of the things from the volunteer event
    I worked at in the employee event at work, such as seating arrangement and check
    in process. I became a more valued member of the team at work.


    315. Tell me about a time when you developed a project idea at work.


    Answer:


    Choose a project idea that you developed that was typical of projects you might
    complete in the new position. Outline where your idea came from, the type of research
    you did to ensure its success and relevancy, steps that were included in the project,
    and the end results. Offer specific before and after statistics, to show its success.


