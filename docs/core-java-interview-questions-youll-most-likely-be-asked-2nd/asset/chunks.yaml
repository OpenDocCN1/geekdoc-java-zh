    There have been many times where I needed to work my way through the “red tape”
    that was a part of office procedures in getting approvals for new work permits.
    Although at times it was very frustrating and time consuming, I understood this
    was necessary as it took time to review the plans and assure the job was going
    to be done according to safety and legal protocols. I had a job that needed to
    be rushed, so I prepared a letter explaining the situation, had a statement from
    the business owner who the job was for, and had my supervisor contact the signing
    authority to present my case. I was sure to include reasons why the project would
    affect the community negatively if put on hold or if it took too long to build,
    and how rushing the job would be good for the community and opening that store
    would have a trickle effect in opening other stores in the same vacant lot. While
    the job ended up not being done the next day, it was moved up two weeks ahead
    of the original schedule.


    ### 346. Tell me about a time when you persuaded others to take on a difficult
    task.


    **Answer:**


    This question is an opportunity to highlight both your leadership and communication
    skills. While the specific situation itself is important to offer as background,
    focus on how you were able to persuade the others, and what tactics worked the
    best.


    *As an example:*


    I had a coworker who was reluctant to help me implement a new filing system. The
    project was going to be time consuming and difficult. I presented her key points
    on how the project would benefit herself and the entire department and make her
    job easier, and told her that ultimately it would be something the boss would
    look kindly on and an opportunity for her to shine. I motivated her by telling
    her she had really great ideas and that if she were a part of the project it would
    help for it to get done faster and more efficiently because of her knowledge and
    ideas. Making her feel good about herself and feel needed motivated her to help.


    ### 347. Tell me about a time when you successfully persuaded a group to accept
    your proposal.


    **Answer:**


    This question is designed to determine your resourcefulness and your communication
    skills. Explain the ways in which you took into account different perspectives
    within the group and created a presentation that would be appealing and convincing
    to all members. Additionally, you can pump up the proposal itself by offering
    details about it that show how well-executed it was.


    *As an example:*


    I was trying to purchase a new invoice software that no one was interested in
    but me. The reason they were not interested was because they were comfortable
    in the current software and felt they were too busy to learn a new system. I researched
    the software I was interested in, put together a bullet point list and handed
    it out to each department member ahead of a scheduled meeting so they would have
    time to look at it and bring questions with them, and then showcased the software
    to the team using screen shots and in depth information on how the software would
    make their jobs easier. I took a couple of coworkers jobs specifically and pointed
    out how it would directly impact their jobs and improve their processes. I allowed
    them time to think about it and do more research on their own before making a
    decision.


    ### 348. Tell me about a time when you had a problem with another person, that,
    in hindsight, you wished you had handled differently.


    **Answer:**


    The key to this question is to show your capabilities of reflection and your learning
    process. Explain the situation, how you handled it at the time, what the outcome
    of the situation was, and finally, how you would handle it now. Most importantly,
    tell the interviewer why you would handle it differently now - did your previous
    solution create stress on the relationship with the other person, or do you wish
    that you had stood up more for what you wanted? While you shouldn’t elaborate
    on how poorly you handled the situation before, the most important thing is to
    show that you’ve grown and reached a deeper level of understanding as a result
    of the conflict.


    *As an example:*


    Many years ago, I had a coworker who never wanted to listen to anything I said,
    or any of my ideas. They were very stuck in their ways and reluctant in learning
    new things. I thought the best thing to do was to just avoid them and let them
    do their own thing and avoid confrontation. In hindsight I could have done better
    to understand their perspective and potentially their fear of change, and make
    better attempts at communicating the need for a new process and assuring them
    that the new process may have made their job easier and we were all a team and
    would support each other throughout any change. Over the years my ability to communicate
    and realize that communication is important for teamwork and ultimately the company,
    has dramatically improved.


    ### 349. Tell me about a time when you negotiated a conflict between other employees.


    **Answer:**


    An especially important question for those interviewing for a supervisory role
    - begin with a specific situation and explain how you communicated effectively
    to each individual. For example, did you introduce a compromise? Did you make
    an executive decision? Or, did you perform as a mediator and encourage the employees
    to reach a conclusion on their own?


    *As an example:*


    I had many instances as shop supervisor when I acted as a mediator in a dispute
    between two employees. There was not one go-to solution that would work for every
    situation since each employee was different and each situation or dispute was
    different. I would carefully reflect upon the dispute and make a determination
    for what needed to be done based off of the facts that I was aware of and the
    personalities of the involved parties. Most often, having both employees sit down
    together to discuss with me acting as a witness and mediator was very effective.
    I made sure to allow each the opportunity to present what happened, their perspective,
    and then how it made them feel or what you thought the best outcome would be.
    I was sure to always point out that both could have handled the situation differently
    to avoid the dispute escalating and pointed out the positive traits about each
    that I felt would allow them to move forward and work together better. I was always
    sure to follow up to make sure things were still going smoothly and I always had
    an open door policy if they ran into issues again.


    # CHAPTER 06


    # Job Searching and Scheduling


    ### 350. What are the three most important things you’re looking for in a position?


    **Answer:**


    The top three things you want in a position should be similar to the top three
    things the employer wants from an employee, so that it is clear that you are well-matched
    to the job. For example, the employer wants a candidate who is well-qualified
    for and has practical experience - and you want a position that allows you to
    use your education and skills to their best applications. The employer wants a
    candidate who is willing to take on new challenges and develop new systems to
    increase sales or productivity - and you want a position that pushes you and offers
    opportunities to develop, create, and lead new initiatives. The employer wants
    a candidate who will grow into and stay with the company for a long time - and
    you want a position that offers stability and believes in building a strong team.
    Research what the employer is looking for beforehand and match your objectives
    to theirs.


    *As an example:*


    The three things I am looking for would be opportunity to apply my skillset to
    make a positive impact, opportunity for growth and learning new things, and stability
    in a company with a positive mission.


    ### 351. How are you evaluating the companies you’re looking to work with?


