    作为我上一任雇主的安全官，我曾与部门主管参加一次非常重要的两点会议，这次会议已经在日程表上排了一个月，由于高管们的日程繁忙，无法推迟。与此同时，现场出现了一个紧急安全问题需要我赶过去处理。我在两个问题之间左右左右为难，于是让我的实习生带着我准备的演示文稿参加会议，解释了情况，并向他们展示了演示文稿。他解释了他自己能说明的问题，并对他们提出的问题以及他无法回答的事项进行了记录；我们安排在第二天进行跟进电话会议，以讨论我当时未在场无法回答的待办问题。我们在跟进电话中解决了所有遗留问题，并在第二天顺利推进了项目。高管们理解我所面临的困境，并对项目没有中断表示感谢。


    ## 303. 你能否举一个例子，说明你在上一份工作中是如何改进某个 X 目标的？


    **回答：**


    这里的重点应该是你所为公司创造了实实在结果的改进。提高效率无疑是业务中一个非常重要的因素，但雇主也在寻找具体的成果，例如销售额增长或开支减少。请详尽说明你的过程，尽可能提供具体的数字和证据，特别是在概述结果时。


    *例如：*


    我成功地将每个客户电话的等待时间缩短了 4 分钟，并通过建议使用一种软件简化了候名单流程，该软件让所有客服代表都能访问一个显示所有客户电话的显示器。显示器显示了有多少个电话处于激活、待处理或挂起状态（以及由哪个客服负责），以及他们使用的是哪条线路。客服可以轻松地挂断电话，查看看板并看到下一个哪条线路需要被接听。这改进了客服部门的工作流，使每天能多解决约
    20 个客户问题，由于现在可以接收更多新订单，利润增加了 30%，并提高了客户的满意度和公司评分。


    ## 304. 请谈谈一次主管对项目提供的指导意见不够具体的经历。


    **回答：**


    虽然许多雇主希望员工遵循非常具体的指导方针而没有太大的决策权，但能够在指令模糊的情况下接手项目并独立完成工作同样重要。请举出你提出的必要问题的例子，并说明你是如何判断一个问题是需要向主管提的，还是你可以自己决定的。


    *例如：*


    在我主管准备去休假时，我有一个大型项目正在待处理。在她休假之前，她给了我另一个项目，但没有留下截止日期。我分析了该项目，确定这是一个新客户，我不想让他们感到困惑。我继续处理我的待办项目，并与新客户联系介绍自己，并安排了电话讨论他们的需求。这为我争取了时间，同时也让我获取了更多信息。由于截止日期还不清楚，而且并不紧急，所以我继续处理现有的工作，并在每天下午都留出时间开始处理新客户的项目。


    ## 305. 请谈谈一次你负责领导一个项目的经历。


    **回答：**


    带领面试官了解项目的过程，就像你对团队中的任何成员成员做的那样。解释项目的目标、必要的步骤，以及你是如何向团队分配任务的。包括结果，以及你通过这次领导机会中学到了什么。


    *例如：*


    作为在人力资源福利代表休假期间提供帮助的 HR 助理，我负责了一个大型机构的年度员工福利开放注册。我提前与经理进行了沟通，尽可能收集有关过去在时间表和工作流程方面哪些有效的信息，我自己增加了一些有用的改进，例如为即将的各种福利变化建立档案系统。在开放注册开始的前一周，我与
    HR 部门开了会议，检查了每份表格，并向团队解释了我将如何分发每份表格，并为他们制作了实用的信息小抄，让他们放在办公桌上，以防员工来提问而我可能不在场。


    整个过程非常顺利且有条理，员工们评价说非常简单。


    ## 306. 请谈谈你曾向前任雇主提出的某项后来被实施的建议。


    **回答：**


    雇主希望看到你对改进公司感兴趣并尽了自己的份力量——请提供一个具体的例子，说明你在上一份工作中做了什么来创造积极的改变。解释你是如何想到这个主意的，你的主管是如何接收的，以及在当主意实施时，其他员工是怎么想的。


    *例如：*


    我建议成立一个创新委员会，让员工聚集在一起讨论他们对工作场所产生的新想法。这些想法涵盖了广泛的内容，例如员工认可机制、零食卖机选项、客户大厅的变更，以及其间的任何细节。虽然并不是所有的想法都得到了管理层的采纳，但大多数想法的变体都得到了实施。这让员工对公司产生了主人翁和归属感，同时也提高了士气和团队协作。


    ## 307. 请谈谈一次你想到工作场所中某事可以更高效地完成的方法。


    **回答：**


    专注于你想法中积极的方面。重要的是不要负面地描绘你的旧公司或老板，因此不要详述某个特定系统是多么低效。相反，请解释一个你看到机会提高生产力或简化流程的情况，并用通用的分步骤方法说明你是如何实施一个更好的系统的。


    *例如：*


    我们部门曾将周五定为“归档日”，用于处理整整周收集的文件。虽然这绝对是很好的好主意，但如果某个同事请假了，或者我们某周有大量的归档工作，有时会出现我们在周五无法完成所有工作的情况，或者由于整周收到的大量文件而感到压力巨大。我建议我们在项目之间的空隙时间在整周内开始归档，这样就不会会堆积在某一天。我还注意到每天的最后半小时，有些同事会开始“收拾东西”，由于我们的工作性质，在最后一点时间里我们无法真正开始一个新项目，所以我们会开始收拾，然后在最后三十分钟归档，直到下班。这大大减少了堆积在周五的工作量，同时也保持了整周更高的生产力。


    ## 308. 领导和管理人员之间是否存在区别——哪一个是你更大的优势？


    **回答：**


    这两者之间是有区别的——领导者通常是很有主意的人，充满热情、富有魅力，并具备组织和激励他能力；而经理是那些确保系统运行、促进其运营、做出权威决策，并对从整体成功到细微决策的所有方面都承担巨大责任的人。考虑哪一种最适用于该职位，并解释你如何适应这一角色，提供你过去经验的具体例子。


    *例如：*


    '
- fmt: '

    I am a good leader because I take time to think about all possible aspects of
    a project and how it may affect each employee tasked to work on the project. I
    do my best to see things from each perspective, anticipating and planning things
    that may go wrong, and focusing on what could go right. I pitch ideas in a way
    where I am able to garner support from the employees and make them feel they are
    a part of something great.


    ## 309. Do you function better in a leadership role, or as a worker on a team?


    **Answer:**


    It is important to consider what qualities the interviewer is looking for in your
    position, and to express how you embody this role. If you’re a leader, highlight
    your great ideas, drive and passion, and ability to incite others around you to
    action. If you work great in teams, focus on your dedication to the task at hand,
    your cooperation and communication skills, and your ability to keep things running
    smoothly.


    *As an example:*


    While I am able to work well in either role, I find that I am better suited for
    leadership roles since it comes so naturally for me. Even in positions where I
    was not the boss, I had people coming to me for suggestions, to bounce ideas off
    of, and looking for support. I am good at project management and fitting the right
    people in to the right place where their skills and personality, as well as work
    ethic will be best suited. If I find someone on a team is struggling with keeping
    up, I am able to find creative ways to include them and change their tasks to
    something possibly even outside of their comfort zone, where they are better suited
    to contribute to the team. I find the best quality in each employee and motivate
    them in into action.


    ## 310. Tell me about a time when you discovered something in the workplace that
    was disrupting your (or others) productivity - what did you do about it.


    **Answer:**


    Try to not focus on negative aspects of your previous job too much, but instead
    choose an instance in which you found a positive, and quick, solution to increase
    productivity. Focus on the way you noticed the opportunity, how you presented
    a solution to your supervisor, and then how the change was implemented (most importantly,
    talk about how you led the change initiative). This is a great opportunity for
    you to display your problem-solving skills, as well as your resourceful nature
    and leadership skills.


    *As an example:*


    Our one and only timeclock was continuously met with long lines of all staff clocking
    out at the same time. This would cause chaos at the clock out line, disgruntled
    employees, employees in a hurry skipping the process entirely, and employees packing
    up for the day early so they could “get in line.” I suggested we add a second
    timeclock on the other side of the room near the second entry door to alleviate
    the line. This helped productivity because employees did not feel the need to
    pack up early and waste time standing at a timeclock and eased some of the grumpiness
    felt at the end of the day.


    ## 311. How do you perform in a job with clearly-defined objectives and goals?


    **Answer:**


    It is important to consider the position when answering this question - clearly,
    it is best if you can excel in a job with clearly-defined objectives and goals
    (particularly if you’re in an entry level or sales position). However, if you’re
    applying for a position with a leadership role or creative aspect to it, be sure
    to focus on the ways that you additionally enjoy the challenges of developing
    and implementing your own ideas.


    *As an example:*


    I enjoy having a set guideline of rules to abide by. This helps to streamline
    processes, especially when dealing in customer-centric companies. With that said,
    if I see a policy that can be improved on, I have no problem with bringing my
    ideas to the forefront, testing them and if they work, implementing them. With
    the improvement in a process, the policy would need to be updated, and all employees
    notified of the new procedures so all staff are on the same page.


    ## 312. How do you perform in a job where you have great decisionmaking power?


    **Answer:**


    The interviewer wants to know that, if hired, you won’t be the type of employee
    who needs constant supervision or who asks for advice, authority, or feedback
    every step of the way. Explain that you work well in a decisive, productive environment,
    and that you look forward to taking initiative in your position.


    *As an example:*


    I have been given the opportunity to be in the role of decision maker many times
    in previous roles. There are times where a guideline exists of how to properly
    perform the job and limitations within your role, however, there are instances
    where you must make a prompt decision on the spot. During these times I have no
    problem with being creative in solving a problem and informing my superiors of
    what took place afterward, to keep them in the loop.


    ## 313. If you saw another employee doing something dishonest or unethical, what
    would you do?


    **Answer:**


    In the case of witnessing another employee doing something dishonest, it is always
    best to act in accordance with company policies for such a situation - and if
    you don’t know what this company’s specific policies are, feel free to simply
    state that you would handle it according to the policy and by reporting it to
    the appropriate persons in charge. If you are aware of the company’s policies
    (such as if you are seeking a promotion within your own company), it is best to
    specifically outline your actions according to the policy.


    *As an example:*


    This really depends on what they were doing. Some things such as stealing large
    amounts of money, equipment, or anything that puts themselves or someone else
    in danger, would need to reported immediately. There may be times however, where
    a coworker is perhaps breaking a policy or going around protocol to save time
    or cut costs, and it may be detrimental to themselves or the company. In these
    instances, I would feel comfortable discussing the issue with my coworker myself
    and seeing if I can help them in any way and let them know that what they were
    doing was wrong. They may not have even realized it was wrong or may have going
    through rough times. If they continued to do so after we spoke, I would feel comfortable
    bringing the issue to management.


    ## 314. Tell me about a time when you learned something on your own that later
    helped in your professional life.


    **Answer:**


    This question is important because it allows the interviewer to gain insight into
    your dedication to learning and advancement. Choose an example solely from your
    personal life, and provide a brief anecdote ending in the lesson you learned.
    Then, explain in a clear and thorough manner how this lesson has translated into
    a usable skill or practice in your position.


    *As an example:*


    I work with a volunteer organization on the weekends. When the president of the
    organization was unavailable to lead a fundraising event, I had to step in and
    assure the event went smoothly, set it up, and emcee to the crowd. I was very
    nervous but this ended up helping my public speaking skills drastically, and the
    next team meeting we had at work I was able to speak to my coworkers and present
    my project without feeling nervous. I also was asked to coordinate the next employee
    event at work and used some of the things from the volunteer event I worked at
    in the employee event at work, such as seating arrangement and check in process.
    I became a more valued member of the team at work.


    ## 315. Tell me about a time when you developed a project idea at work.


    **Answer:**


    Choose a project idea that you developed that was typical of projects you might
    complete in the new position. Outline where your idea came from, the type of research
    you did to ensure its success and relevancy, steps that were included in the project,
    and the end results. Offer specific before and after statistics, to show its success.


    *As an example:*

    '
