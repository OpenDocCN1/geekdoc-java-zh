    \    }\n    public static void main(String args[]) {\n        MyAbstractClass\
    \ obj = new MyAbstractClass();//Line 1\n        obj.doSomething(); //Line 2\n\
    \    }\n}\n```\n\nAnswer:\n\n上面的代码无效，并在第 1 行导致了编译错误。这段代码声明了一个名为 `MyAbstractClass`\
    \ 的 `abstract` 类。第 1 行实例化了该类，第 2 行调用了 `doSomething` 方法。然而，你不能为抽象类创建对象。虽然这个类没有包含任何抽象方法，但该类仍声明为\
    \ `abstract`，因此它不能被实例化。\n\n### 105. 类可以实现两个接口吗？如果两个接口都有同名方法会发生什么？\n\nAnswer:\n\
    \n是的，一个类可以实现两个接口。即使两个接口都有同名的方法，也不会导致歧义，因为将使用类中提供的实现。\n\n以下代码演示了这一点：\n\n```java\n\
    public interface MyInterface1 {\n    public void doSomething();\n}\n\npublic interface\
    \ MyInterface2 {\n    public void doSomething();\n}\n\npublic class MyClass implements\
    \ MyInterface1, MyInterface2{\n    @Override\n    public void doSomething() {\n\
    \        // 代码在这里\n    }\n}\n\nMyClass obj = new MyClass();\nobj.doSomething();\
    \ //Line 1\n```\n\n上面的代码指定了两个接口 `MyInterface1` 和 `MyInterface2`。这两个接口都有一个名为 `doSomething`\
    \ 的方法。代码还指定了一个实现这两个接口的类 `MyClass`。它需要为 `doSomething` 方法提供实现。当执行第 1 行时，将执行 `MyClass`\
    \ 中的 `doSomething()` 方法。\n\n### 106. 抽象类的作用是什么？\n\nAnswer:\n\n在某些编程场景下，你可能想要创建一个被许多子类共享的父类。你可能想在父类中放置一些通用代码，但将具体细节留给各个类来实现。抽象类在这种场景下非常有用。因此，你可以创建一个抽象父类。你可以拥有实现通用功能的具体方法，以及针对子类特有功能的抽象方法。子类可以扩展该抽象类并为抽象方法提供实现。\n\
    \n### 107. 请解释以下代码片段存在什么问题：\n\n```java\npublic abstract final class MyAbstractClass\
    \ {\n    public void doSomething() {\n    }\n}\n```\n\nAnswer:\n\n上面的代码片段无效。这段代码声明了一个名为\
    \ `MyAbstractClass` 的类，它同时具有 `abstract` 和 `final` 关键字。抽象类不能是 `final`，反之亦然。这是因为抽象类需要子类。\n\
    \n### 108. 下面的代码片段有效吗？请分别解释原因。\n\n```java\npublic interface ShapeDrawer {\n  \
    \  public void draw();\n}\n\npublic class Triangle implements ShapeDrawer\n{\n\
    \    public void draw() {\n        // 绘制形状的代码\n    }\n    public static void main(String\
    \ args[]) {\n        ShapeDrawer shapeDrawer = new Triangle(); //Line 1\n    \
    \    shapeDrawer.draw(); //Line 2\n    }\n}\n```\n\nAnswer:\n\n上面的代码是有效的。这段代码声明了接口\
    \ `ShapeDrawer` 和实现该接口的类 `Triangle`。第 1 行声明了一个 `ShapeDrawer` 类型的变量并赋值一个 `Triangle`\
    \ 对象。第 2 行调用 `draw` 方法。这执行了 `Triangle` 类中的。\n\n### 109. 下面代码中的哪些行会导致编译错误？\n\n\
    ```java\npublic interface MyInterface {\n    private static int FIELD1 = 7; //Line\
    \ 1\n    int FIELD2 = 8;//Line 2\n    public final FIELD3; //Line 3\n    public\
    \ static int FIELD4 = 8; //Line 4\n}\n```\n\nAnswer:\n\n在上面的代码中，第 1 行和第 3 行会导致编译错误。接口中声明的所有字段应该是\
    \ `public`、`static` 且 `final` 的。如果没有指定 `public` `static` 和 `final` 关键字，字段会被隐式地变为\
    \ `public` `static` `final`。第 1 行显式指定了 `private` 关键字，因此导致编译错误。第 2 行没有指定 `public`\
    \ `static` `final` 关键字。然而，这不会导致编译错误，Java 隐式将字段变为 `public static final`。第 3 行指定了\
    \ `public` 和 `final` 关键字，但没有初始化字段。`final` 字段需要初始化。因此，第 3 行也会导致编译错误。第 4 行指定了 `public`\
    \ 和 `static` 关键字并初始化了字段。它没有指定 `final` 关键字。然而，这再次没有导致编译错误，字段被隐式视为 `final`。\n\n\
    ### 110. 下面的代码片段有效吗？请解释。\n\n```java\npublic abstract class MyAbstractClass {\n\
    \    private abstract void doSomething();\n}\n```\n\nAnswer:\n\n上面的代码无效，并导致 `doSomething`\
    \ 方法出现编译错误。这是因为 `doSomething()` 方法既是 `abstract` 的又是 `private` 的。`abstract` 方法不能被标记为\
    \ `private`。`private` 方法在子类中是不可见的。`abstract` 方法需要在子类中是可见的，以便子类能够提供实现。\n\n"
