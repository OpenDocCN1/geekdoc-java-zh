    # Class Declaration


    Following are the possible ways of declaring a Java class:


    a. `public class Class1 {}`

    b. `class Class2 {}`

    c. `private class Class3 {}`

    d. `protected class Class4 {}`

    e. `static class Class5{}`


    `Approach a` declares a class as public. `Approach b` does not use any access
    specifier, so it has default access. It will be accessible only within the package.
    `Approaches c and d` use the `private`, `protected` access specifiers. Note that
    a high–level class cannot have these specifiers. This can only be used for an
    inner class. `Approach e` uses the `static` keyword. Again, only an inner class
    can have this access specifier.


    ### 013. How will you define an Identifier?


    Answer:


    Identifier is the name given to a class, method, variable or interface. There
    are several rules for Java identifiers. These are as follows:


    - Identifiers must start with an alphabet, the dollar sign (`$`), or an underscore
    character (`_`)

    - Identifiers can contain alphabets, digits, `$` and `_`

    - Identifiers cannot contain special characters

    - Identifiers are case sensitive


    Some of the examples of legal identifiers are shown below:


    - `b`

    - `$a`

    - `book`

    - `author1`

    - `myName`

    - `___1_c`


    ### 014. What are the modifiers that cannot be specified with an instance variable?


    Answer:


    The following modifiers cannot be specified with an instance variable:


    a. `abstract`: is valid only for classes, interfaces and methods, it cannot be
    specified with an instance variable

    b. `synchronized`

    c. `native`


    The keywords `synchronized` and `native` are valid only for methods and cannot
    be specified with an instance variable.


    d. `void`: can only be specified as a return type, when a method does not return
    any value.


    ### 015. What are the modifiers that can be specified with a method declaration?


    Answer:


    The following keywords can be specified with a method declaration:


    a. `public`

    b. `private`

    c. `protected`


    The keywords `public`, `private` and `protected` are access specifiers. They specify
    from where the method can be accessed.


    d. `static`: used to indicate that the method is a class level method

    e. `final`: used to indicate that the method cannot be overridden

    f. `abstract`: used to specify that a sub–class should override the method

    g. `native`: used to specify that the method is implemented in another language
    like `C++`

    h. `synchronized`: used to indicate that the method can be accessed by only one
    thread at a time.


    ### 016. What will be the default value of a reference variable when it is not
    explicitly initialized? How will you handle this in code?


    Answer:


    When a reference variable is not explicitly initialized, then its value is `null`
    by default. If such variables are not properly handled, they can result in a `NullPointerException`.
    So, in order to avoid the `NullPointerException`, you can do one of the following:


    - Ensure that variables are properly initialized

    - Explicitly add `null` checks in your code

    - Use Java 8 `Optionals`


    ### 017. Explain the keywords “transient” and “native”.


    Answer:


    The keyword `transient` can be used as a modifier for an instance variable. It
    specifies that the JVM should ignore the variable while serializing the containing
    object.


    The keyword `native` can be used as a modifier with methods. It specifies that
    the method is implemented in another language like `C`, `C++`.


    ### 018. What is a comment in Java? Explain the types of comments supported by
    Java.


    Answer:


    A comment is some text added to the code that provides additional information
    about the code. It describes what the code does to the readers of the code. Comments
    are ignored by the compiler. Java supports 3 types of comments as follows:


    a. **Single Line Comment**: Such a comment begins with two forward slashes (`//`)
    and ends at the end of the line. The following code snippet demonstrates this:


    ```

    int count; // This stores the number of objects

    ```


    b. **Multi Line Comment**: This starts with `/*` and ends with `*/`. Anything
    between these two is treated as a comment and ignored by the compiler. The following
    code snippet demonstrates this:


    ```

    /*

    This for loop repeats a block of code 10 times

    */

    for (int i=0; i < 10; i++) {

    }

    ```


    c. **Documentation comment**: Documentation comments are comments that are used
    to generate documentation for the code via the JavaDoc tool. They start with `/**`
    and end with `*/`. The following code demonstrates this:


    ```java

    /**

    * Method that does something

    * @param a

    */

    public void myMethod (int a) {

    }

    ```


    ### 019. Explain what is JVM, JRE and JDK.


    Answer:


    `JDK` stands for Java Development Kit. It consists of the tools and libraries
    that are required to write and run a Java program. So, it includes the Java compiler,
    `JRE` and other tools.


    `JRE` stands for the Java Runtime Environment. It consists of the tools that are
    required to run a Java program. It is included with the `JDK` but it can also
    be installed by itself. If the `JRE` is installed by itself without the `JDK`,
    you will be able to run a Java program but you will not be able to write and compile
    Java code. `JRE` includes the `JVM` and some other libraries.


    `JVM` stands for the Java Virtual Machine. Java code is compiled into byte code.
    This byte code is executed within the `JVM`. So, the `JVM` just provides an execution
    environment to execute code.


    ### 020. Explain with a code sample how you will read a value entered by a user.


    Answer:


    Java provides a class called `java.util.Scanner`. This can be used to read an
    input from a user. The following code demonstrates this:


    ```java

    System.out.println("Enter a Number:");

    Scanner scanner = new Scanner(System.in);

    int num = scanner.nextInt();

    System.out.println("The entered number is " + num);

    scanner.close();

    ```


    This code creates a `Scanner` corresponding to `System.in`. It then asks the user
    to input a number and reads this number into the variable `num` via `nextInt()`
    method. Just like `nextInt()`, the `Scanner` class has several other methods that
    can be used to read data of different types like `String`, `float`, `long`, etc.


    ### 021. What are the possible ways of declaring an array of short?


    Answer:


    You can declare an array of short type in any of the following ways:


    a. `short a1[];`

    b. `short [] a2;`

    c. `short b1[] [];`

    d. `short [] [] b2;`

    e. `short [] c1 = {2,3,4};`

    f. `short c2[] = {2,3,4};`


    Approaches `a` and `b` declare a single dimensional short array. Approaches `c`
    and `d` declare a two-dimensional short array. Approaches `e` and `f` declare
    a single dimensional short array and initialize it. In all the approaches, the
    square brackets can be placed either after the variable name or after the `short`
    keyword.


    ### 022. How will you cast an int variable to byte explicitly? Is it really necessary
    to cast int literal to byte?


    Answer:


    An int variable can be cast to byte as follows:


    ```java

    int i = 30;

    byte bValue = (byte)i;

    ```


    So, you need to specify the `(byte)` keyword before the `int` variable. Yes, it
    is necessary to cast an `int` variable to `byte` explicitly, otherwise a compilation
    error will occur as below:


    ```java

    byte bValue = i; // compilation error

    ```


    This is because `int` is a wider type as compared to `byte`. So, Java cannot automatically
    convert the `int` type to `byte`, you need to specify an explicit cast.


    ### 023. Give an example of implicit casting.


    Answer:


    Implicit casting occurs when a value is assigned to a variable of a wider data
    type. In such cases, the conversion happens by default and there is no need of
    an explicit cast. For example, if you assign an `int` value to a `long` value,
    an implicit cast will occur. The following code snippet demonstrates this:


    ```java

    int iValue = 250;

    long lValue = iValue;

    ```


    The above code demonstrates that an `int` value can always be assigned to a `long`
    variable without casting and the conversion happens by default.

