    \ `java.io.ObjectInputStream` 来恢复对象。它有一个 `readObject()` 方法可以实现这一功能。\n\n### 186.\
    \ 解释 File 类的一些重要方法。\n\nAnswer:\n\n`File` 类封装了文件系统上的文件或目录。`File` 类的一些方法如下：\n\n\
