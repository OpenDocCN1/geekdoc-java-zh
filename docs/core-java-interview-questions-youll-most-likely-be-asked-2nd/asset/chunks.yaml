    ### 057. What is the use of “break” and “continue” statements?


    **Answer:**


    The `break` keyword can be used within a loop. When the `break` statement is encountered,
    the loop is immediately terminated and control is transferred outside the loop.


    The `continue` keyword can also be used within a loop. It is used to stop executing
    the next statement in the loop for the current iteration and transfer control
    to the start of the loop.


