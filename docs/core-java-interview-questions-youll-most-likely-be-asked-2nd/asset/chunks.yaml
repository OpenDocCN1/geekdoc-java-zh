  trans: "\n\n# 核心 JAVA\n\n## JAVA 8\n## JAVA 9\n## 人力资源\n\n# 第 01 章\n## OOP 概念\n\n\
    ### 001. 解释方法重载和方法重写。\n\n**答案：**\n\n方法重载（Method overloading）发生在一个类中存在两个或多个名称相同但参数数量或类型不同的方法时。以下代码演示了这一点：\n\
    \n```java\npublic class Calculator {\n    public int add (int a, int b) {\n  \
    \      return a+b;\n    }\n\n    public double add (double a, double b) {\n  \
    \      return a+b;\n    }\n\n    public int add (int a) {\n        return a+a;\n\
    \    }\n}\n```\n\n方法重写（Method overriding）发生在子类中有一个方法与父类方法具有相同的名称和参数数量时。以下代码演示了这一点：\n\
    \n```java\npublic class Animal {\n    public void saySomething () {\n        System.out.println(\"\
    I am an animal\");\n    }\n}\n\npublic class Dog extends Animal {\n    public\
    \ void saySomething () {\n        System.out.println(\"I am a dog\");\n    }\n\
    }\n```\n\n### 002. 解释 OOP 的优点。\n\n**答案：**\n\n以下是 OOP 的优点：\n\na. **可重用性：** 像`继承\
    \ (Inheritance)`、`组合 (Composition)` 和`多态 (polymorphism)` 等 OOP 原则有助于重用现有代码\nb.\
    \ **可扩展性：** 使用`继承 (Inheritance)` 等 OOP 原则编写的代码具有扩展性\nc. **安全性：** 像`封装 (encapsulation)`\
    \ 等 OOP 原则有助于将数据和操作数据的代码结合在一起，并使代码安全\nd. **简单性：** `Java` 类代表现实世界的对象。这使得代码非常易于理解\n\
    e. **可维护性：** 使用 OOP 原则编写的代码更容易维护\n\n### 003. 编写一个演示封装的代码片段。\n\n**答案：**\n\n封装（Encapsulation）是指将数据和操作数据的代码组合在一个单元中。只需创建一个带有\
    \ `private` 字段和 `public` getter/setter 方法的类就是封装的一个示例。以下代码片段演示了这一点：\n\n```java\n\
    public class Laptop {\n    private String memory;\n\n    public String getMemory\
    \ () {\n        return memory;\n    }\n\n    public String setMemory (String newMemory){\n\
    \        memory = newMemory;\n    }\n}\n```\n\n在这里，有一个名为 `Laptop` 的类。它有一个名为 `memory`\
    \ 的 `private` 字段以及用于访问/修改 `memory` 字段的 `public` getter 和 setter 方法。因此，类外部无法直接访问\
    \ `memory` 字段，只能通过它的 getter/setter 方法访问。\n\n### 004. 继承关系有哪些类型？\n\n**答案：**\n\n\
    继承关系规定了代码如何被重用。继承关系有两种类型。\n\n它们如下：\n\na. **IS–A（是关系）**\n\n`IS–A` 关系通过继承实现，即通过创建子类来实现。假设\
    \ `Camera` 是子类，而 `Electronics` 是父类。在这种情况下，我们可以说 `Camera` 是一个 `Electronic`（电子）产品\n\
    b. **HAS–A（包含关系）**\n\n`HAS–A` 关系可以通过`组合 (composition)` 创建，即通过创建一个对应另一个类的字段。假设在\
    \ `Camera` 类内部，有一个名为 `Battery` 的对象。在这种情况下，我们可以说 `Camera` 包含一个名为 `Battery` 的对象\n\
    \n### 005. 声明实例变量的最佳实践是什么？\n\n**答案：**\n\n实例变量应该始终声明为 `private`。它们应该拥有 `public`\
    \ getter/setter 方法。这有助于保护实例变量，因为它们只能在程序员的控制下被修改。这符合`封装 (Encapsulation)` 原则。\n\n\
    将实例变量声明为 `public` 违反了封装原则并会带来安全问题。`public` 实例变量可以在你的类外部被恶意修改。如果确实需要从子类访问实例变量，可以将其设置为\
    \ `protected`。\n\n### 006. 什么是单例类？\n\n**答案：**\n\n在任何给定时间只允许你创建一个实例的类被称为`单例 (Singleton)`\
    \ 类。单例类可以通过 `private` 构造函数和 `public` getter 方法来实现。以下代码演示了这一点。\n\n```java\npublic\
    \ class MySingleton {\n    private static MySingleton mySingletonInstance;\n\n\
    \    private MySingleton () {\n    }\n\n    public static MySingleton getInstance\
    \ () {\n        if (mySingletonInstance == null) {\n            mySingletonInstance\
    \ = new MySingleton (); // 只有在为空时才创建对象\n        }\n        return mySingletonInstance;\n\
    \    }\n\n    public void doSomething () {\n        System.out.println(\"I am\
    \ here....\");\n    }\n\n    public static void main(String a[]) {\n        MySingleton\
    \ mySingleton = MySingleton.getInstance();\n        mySingleton.doSomething();\n\
    \    }\n}\n```\n\n在这里定义了一个 `private` 构造函数和一个 `public` 的 `getInstance()` 方法。`getInstance`\
    \ 检查实例是否存在。如果实例不存在，则使用 `private` 构造函数创建一个。如果实例存在，则直接返回它。任何需要单例类实例的外部类都需要通过 `getInstance`\
    \ 方法获取它。`getInstance` 方法确保了单例类只有一个实例。\n\n### 007. 解释编译以下代码时会发生什么，并说明它使用了方法重载还是方法重写。\n\
    \n```java\nclass Electronics {\n    public void displayPrice (Float price) {}\
    \ //Line1\n}\n\nclass Camera extends Electronics {\n    public void displayPrice\
    \ (String price) {} //Line2\n}\n```\n\n**答案：**\n\n上述代码可以编译。它使用了方法重载。`Camera` 类拥有相同的\
    \ `displayPrice` 方法，但两个类中的参数类型不同。\n\n### 008. 编写一个演示方法重载的代码示例。\n\n**答案：**\n\n\
    方法重载发生在类中存在多个名称相同但参数数量或类型不同的方法时。以下代码演示了这一点：\n\n```java\nclass Laptop {\n    public\
    \ void displayPrice (int width, int height) {}; //Line1\n    public void displayPrice\
    \ (float width, float height) {}; //Line2\n}\n```\n\n`Laptop` 类有两个名为 `displayPrice`\
    \ 的方法。Line 1 的参数类型为 `int`，Line 2 的参数类型为 `float`。因此，这里的 `displayPrice` 方法被称为重载。\n\
    \n"
