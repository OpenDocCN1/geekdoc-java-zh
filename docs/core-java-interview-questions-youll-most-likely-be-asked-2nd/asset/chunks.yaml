    this method blocks until the result becomes available. So, if you want to perform
    any computation on the result of the Future, you need to wait for the result to
    be available. A CompletableFuture on the other hand allows attaching callbacks
    to the result of a computation. These callbacks execute once the result is available,
    so there is no need to wait.


