    274. What is JShell?


    Answer:


    Jshell is basically a command line tool. It allows you to write and run Java code
    without creating a class file. It can be launched by typing jshell on the command
    prompt. Once Jshell opens up, you can type in any Java code and JShell will display
    the output of the code. So, for example if you type the following:


