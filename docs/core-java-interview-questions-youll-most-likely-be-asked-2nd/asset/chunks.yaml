  trans: "\nJava 9 允许在接口中使用私有方法。在 Java 8 之前，接口只能包含抽象方法。Java 8 增加了对静态和默认接口方法的支持。默认和静态方法只是带有方法体的接口。Java\
    \ 9 更进了一步，允许在接口中使用私有方法。私有接口方法允许代码重用。因此，如果一个接口有多个默认和静态方法，并且这些方法之间存在共同代码，可以将这些代码移动到私有方法中。下面的代码演示了这一点：\n\
    \n```java\npublic interface Sample {\n    default method1(){\n        //some code\n\
    \        doSomething();\n    }\n\n    default method2(){\n        //some code\n\
    \        doSomething();\n    }\n\n    private void doSomething(){\n        System.out.println(“Doing\
    \ something..”);\n    }\n}\n```\n\n在这里，`doSomething()` 是私有接口方法，在默认方法 `method1()`\
    \ 和 `method2()` 中。\n\n### 274. 什么是 JShell？\n\n答案：\n\nJshell 基本是一个命令行工具。它允许你在无需创建类的情况下编写并运行\
