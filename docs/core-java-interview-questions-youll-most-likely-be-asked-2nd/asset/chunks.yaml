    b. int[]ttt = new int[3][3];


    c. int[][]ttt = new int[3][3];


    d. int ttt [3][3] = new int[][];


    Answer:


    (c) Answer c is correct. The correct syntax for declaring a multi–dimensional
    array is


    int[][]ttt =new int[3][3];


    029. Explain the primitive data types in Java.


    Answer:


    There are eight primitive data types in Java. These are as follows:


    | **Name** | **Width (Bits)** | **Range** |


    | byte | 8 | –128 to 127 |


    | short | 16 | –32,768 to 32,767 |


    | int | 32 | –2,147,483,648 to 2,147,483,647 |


    | long | 64 | –9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |


