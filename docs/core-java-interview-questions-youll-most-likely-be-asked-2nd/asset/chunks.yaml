    `Collection` 的只读拷贝。例如，它有一个名为 `Collections.unmodifiableList` 的方法。该方法接受一个 `List`
    作为参数，并返回一个输入 `List` 的只读拷贝。一旦通过此方法获得了 `Collection` 的只读拷贝，任何修改 `List` 的尝试（如添加或删除数据）都将导致
    `UnsupportedOperationException`。因此，如果客户端应用程序尝试修改此 `List`，就会发生异常。


