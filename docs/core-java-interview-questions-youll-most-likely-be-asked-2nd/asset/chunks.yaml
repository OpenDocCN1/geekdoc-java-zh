    }


    }


    Answer:


    The above code compiles fine and produces the following output:


    Java100200


    Since the ‘+’ operator is used with a String and int variables, the final value
    is considered as a String and the values are concatenated and displayed.


    040. Explain the % operator.


    Answer:


    The % operator is called as the modulus or remainder operator. It returns the
    remainder obtained after dividing the number on the left with the number on the
    right. The following code demonstrates this:


    100 % 4 //produces 0


    10 % 4 // produces 2


