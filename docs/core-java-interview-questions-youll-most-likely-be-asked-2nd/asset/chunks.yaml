    This code first obtains a Stream on the employees List. It then invokes the sorted()
    operation. The sorted() method accepts as input a Comparator. Here, the Comparator
    is implemented via a lambda expression that compares the salary fields of the
    Employee objects. Finally, the collect() method is invoked to convert the Stream
