  trans: "\n\n当多个线程尝试同时访问同一个共享资源时，它们需要某种方式确保同一时间只有一个线程可以访问该资源。实现这一目标的过程被称为同步。Java\
    \ 提供了一个名为 `synchronized` 的关键字来帮助实现这一目标。\n\n### 172. 解释执行以下代码时会发生什么。\n\n```java\n\
    class TestMyRunnable implements Runnable {\n    public void run() {\n        System.out.println(“Inside\
    \ Run Method..”);\n        System.out.println(“Name of thread is– “:Thread.currentThread().getName());\n\
    \    }\n}\n\nclass TestMyThread {\n    public static void main(String argument[])\
    \ {\n        TestMyRunnable runnable = new TestMyRunnable();\n        Thread thread\
    \ = new Thread(runnable);\n        Thread.setName(“My Thread”); //Line 1\n   \
    \     thread.start(); //Line 2\n    }\n}\n```\n\n答案：\n\n代码正常编译并显示以下输出：\n\n```\n\
    Inside Run Method.\nName of thread is: My Thread\n```\n\n当执行 `Line 1` 时，它将线程设置为\
    \ `My Thread`。因此，当执行 `Line 2` 时，它会产生新线程并执行 `run()` 方法中的代码，打印出的线程名称为 `My Thread`。\n\
    \n### 173. 考虑以下代码：\n\n```java\nclass TestMyRunnable implements Runnable {\n  \
    \  public void run() {\n        for (int iValue = 0; iValue < 1000; iValue++)\n\
    \            System.out.println(“Name of thread is: “+Thread.currentThread().getName());\n\
    \    }\n\n    public static void main (String argument[]) {\n        TestMyRunnable\
    \ runnable = new TestMyRunnable();\n        Thread threadC = new Thread(runnable);\n\
    \        Thread threadD = new Thread(runnable);\n        threadC.setName(“Thread\
    \ 1”);\n        threadD.setName(“Thread 2”);\n        threadC.start();\n     \
    \   threadD.start();\n    }\n}\n```\n\n**执行这段代码会先打印 1000 次“Thread 1”，然后打印 1000\
    \ 次“Thread 2”。如果这是是错误的，请解释原因。**\n\n答案：\n\n执行上述代码时，它不会先打印 1000 次 `Thread 1` 然后打印\
    \ 1000 次 `Thread 2`。线程执行的顺序取决于 `Thread` 调度器。因此，虽然两个线程都打印了 1000 次名称，但它们打印的顺序是不可知的。\n\
    \n### 174. 编写一个代码示例让线程暂停十分分钟。\n\n答案：\n\n为了让线程暂停十分分钟，你需要在 `run()` 方法中调用 `sleep()`\
    \ 方法。`sleep()` 方法接受一个 `long` 类型的参数，表示线程应该睡眠的毫秒数。以下代码演示了这一点：\n\n```java\ntry {\n\
    \    Thread.sleep(10 * 60 * 1000)\n}\ncatch(InterruptedException exp) {\n}\n```\n\
    \n### 175. 调用同步方法（synchronized method）时会发生什么？\n\n答案：\n\n每当执行 `synchronized` 方法时，调用该方法的线程都会获取锁并在方法结束时持有锁。只有在当前线程完成方法执行后，它才会释放锁。这样，其他线程就可以获取锁并执行该方法。因此，`synchronized`\
    \ 关键字防止了多个线程同时执行 `synchronized` 方法中的代码。\n\n### 第 17 章\n\n# Java IO API\n\n###\
    \ 176. 执行以下代码时会发生什么？\n\n```java\nFile myFile = new File(“CoreJava.txt”);\n```\n\
    \n答案：\n\n当执行上述代码时，JVM 在内存中创建了一个名为 `myFile` 的 Java 对象，但文件系统上不会创建实际的文件。要实际创建文件，需要调用\
    \ `myFile.createNewFile()` 方法。\n\n### 177. 编写一个代码示例在 /usr/test.txt 路径下创建一个文件。\n\
    \n答案：\n\n以下代码将在 `/usr/` 目录下创建一个名为 `test.txt` 文件：\n\n```java\ntry {\n    File txtFile\
    \ = new File(“/usr/test.txt”); // Line 1\n    txtFile.createNewFile(); // Line\
