- fmt: "\n# CORE JAVA\n\n## JAVA 8\n## JAVA 9\n## HUMAN RESOURCE\n\n# CHAPTER 01\n\
    ## OOPs Concepts\n\n### 001. Explain method overloading and method overriding.\n\
    \n**Answer:**\n\nMethod overloading occurs when there are two or more methods\
    \ in a class with the same name but with different number/type of arguments. The\
    \ following code demonstrates this:\n\n```java\npublic class Calculator {\n  \
    \  public int add (int a, int b) {\n        return a+b;\n    }\n\n    public double\
    \ add (double a, double b) {\n        return a+b;\n    }\n\n    public int add\
    \ (int a) {\n        return a+a;\n    }\n}\n```\n\nMethod overriding occurs when\
    \ there is a method in a sub–class that has the same name and number of arguments\
    \ as a super–class method. The following code demonstrates this:\n\n```java\n\
    public class Animal {\n    public void saySomething () {\n        System.out.println(\"\
    I am an animal\");\n    }\n}\n\npublic class Dog extends Animal {\n    public\
    \ void saySomething () {\n        System.out.println(\"I am a dog\");\n    }\n\
    }\n```\n\n### 002. Explain the benefits of OOPs.\n\n**Answer:**\n\nFollowing are\
    \ the benefits of OOPs:\n\na. **Reusability:** OOPs principles like `Inheritance`,\
    \ `Composition` and `polymorphism` help in reusing existing code\nb. **Extensibility**:\
    \ Code written using OOPs principles like `Inheritance` makes code extensible\n\
    c. **Security:** OOPs principles like `encapsulation` help to keep the data and\
    \ the code that operates on the data together and makes the code secure\nd. **Simplicity:**\
    \ `Java` classes represent real world objects. This makes code very easy to understand\n\
    e. **Maintainability:** Code written using OOPs principles is easier to maintain\n\
    \n### 003. Write a code snippet that demonstrates encapsulation.\n\n**Answer:**\n\
    \nEncapsulation refers to keeping the data and the code that operates on the data\
    \ together as a single unit. Simply creating a class with `private` fields and\
    \ `public` getter/setter methods is an example of encapsulation. The following\
    \ code snippet demonstrates this:\n\n```java\npublic class Laptop {\n    private\
    \ String memory;\n\n    public String getMemory () {\n        return memory;\n\
    \    }\n\n    public String setMemory (String newMemory){\n        memory = newMemory;\n\
    \    }\n}\n```\n\nHere, there is a class called `Laptop`. It has a `private` field\
    \ called `memory` and `public` getter and setter methods to access/modify the\
    \ `memory` field. So, the `memory` field cannot be accessed directly outside the\
    \ class, it can only be accessed via its getter/setter methods.\n\n### 004. What\
    \ are the types of inheritance relationships?\n\n**Answer:**\n\nInheritance relationships\
    \ specify how code can be reused. There are two types of inheritance relationships.\n\
    \nThey are as follows:\n\na. **IS–A**\n\nAn `IS–A` relationship is implemented\
    \ via inheritance, that is by creating a sub–class. Assume that, `Camera` is a\
    \ subclass and `Electronics` is a super class. In that case, we can say that,\
    \ `Camera` IS–A `Electronic` product\nb. **HAS–A**\n\nA `HAS–A` relation can be\
    \ created via `composition`, that is by creating a field corresponding to another\
    \ class. Assume that, inside the `Camera` class, there is an object called `Battery`.\
    \ In that case, we can say that `Camera` HAS–A object called `Battery`\n\n###\
    \ 005. What is the best practice in declaring instance variables?\n\n**Answer:**\n\
    \nInstance variable should always be declared as `private`. They should have `public`\
    \ getter/setter methods. This helps to protect the instance variable as they can\
    \ only be modified under the programmer’s control. This is as per the `Encapsulation`\
    \ principle.\n\nDeclaring instance variables as `public` violates the encapsulation\
    \ principle and poses a security issue. `public` instance variables can be maliciously\
    \ modified outside your class. If at all an instance variable needs to be accessed\
    \ from a sub–class, it can be made `protected`.\n\n### 006. What is a singleton\
    \ class?\n\n**Answer:**\n\nA class which lets you create only one instance at\
    \ any given time is termed a `Singleton` class. A `Singleton` class can be implemented\
    \ via a `private` constructor and a `public` getter method. The following code\
    \ demonstrates this.\n\n```java\npublic class MySingleton {\n    private static\
    \ MySingleton mySingletonInstance;\n\n    private MySingleton () {\n    }\n\n\
    \    public static MySingleton getInstance () {\n        if (mySingletonInstance\
    \ == null) {\n            mySingletonInstance = new MySingleton (); // create\
    \ the object only if it is null\n        }\n        return mySingletonInstance;\n\
    \    }\n\n    public void doSomething () {\n        System.out.println(\"I am\
    \ here....\");\n    }\n\n    public static void main(String a[]) {\n        MySingleton\
    \ mySingleton = MySingleton.getInstance();\n        mySingleton.doSomething();\n\
    \    }\n}\n```\n\nHere, a `private` constructor and a `public` getInstance()`\
    \ method is defined. The `getInstance` checks if an instance exists. If an instance\
    \ does not exist, it creates one using the `private` constructor. If an instance\
    \ exists, it just returns it. Any external class that needs an instance of the\
    \ `Singleton` class, needs to obtain it via the `getInstance` method. The `getInstance`\
    \ method ensures that there is only one instance of the `Singleton` class.\n\n\
    ### 007. Explain what happens when the following code is compiled and state whether\
    \ it uses method overloading or overriding.\n\n```java\nclass Electronics {\n\
    \    public void displayPrice (Float price) {} //Line 1\n}\n\nclass Camera extends\
    \ Electronics {\n    public void displayPrice (String price) {} //Line 2\n}\n\
    ```\n\n**Answer:**\n\nThe above compiles fine. It uses method overloading. `Camera`\
    \ is a sub–class of `Electronics` and both classes have a method called `displayPrice`.\
    \ However, the `displayPrice` method in both classes differ in the type of argument.\n\
    \n### 008. Write a Java code sample that demonstrates method overloading.\n\n\
    **Answer:**\n\nMethod overloading occurs when there are two or more methods in\
    \ a class with the same name but with different number/type of arguments. The\
    \ following code demonstrates this:\n\n```java\nclass Laptop {\n    public void\
    \ displayPrice (int width, int height) {}; //Line 1\n    public void displayPrice\
    \ (float width, float height) {}; //Line 2\n}\n```\n\nThe class `Laptop` has two\
    \ method with the name as `displayPrice`. The `displayPrice` method at Line 1\
    \ has two arguments, both of type `int`. The `displayPrice` method at Line 2,\
    \ both of type `float`. So here, the `displayPrice` method is said to be overloaded.\n\
    \n### 009. What is polymorphism? How does Java support Polymorphism?\n\n**Answer:**\n\
    \nPolymorphism literally means “many forms”. It is the ability to use the same\
    \ interface to execute different code. Java achieves polymorphism via method overloading\
    \ and method overriding. Method overloading occurs when there are many methods\
    \ in a class with the same name but different number/type of arguments. The version\
    \ of an overloaded method that will be invoked is determined at compile time based\
    \ on the number/type of arguments passed in. Method overriding occurs when a sub–class\
    \ has a method with the same name and type signature as a method in the super\
    \ class. The version of an overridden method that will be invoked is determined\
    \ at run time based on the type of object that invokes the method.\n\n### 010.\
    \ Explain how Java achieves abstraction.\n\n**Answer:**\n\nAbstraction is an OOPs\
    \ concept whereby only the necessary information is exposed to the end user and\
    \ the internal implementation details are hidden. Java achieves abstraction via\
    \ `abstract` classes and interfaces. So, you can declare the methods that you\
    \ want to be exposed to the outside world in an `abstract` class or `interface`.\
    \ The actual implementation will be within concrete classes that extend the `abstract`\
    \ classes or implement the `interfaces`. The outside code is not aware of the\
    \ implementing classes, they interact with your code via the `interfaces` or `abstract`\
    \ classes.\n\n# CHAPTER 02\n## Java Basics\n\n### 011. What are the possible ways\
    \ of declaring the Java main method?\n\n**Answer:**\n\nFollowing are the possible\
    \ ways of declaring the Java main method.\n\na. `public static void main (String\
    \ argument [])`\n\nb. `static public void main (String argument [])`\n\nSo, while\
    \ declaring the Java main method, the order of the `public`, `static`, `void`\
    \ keyword does not matter, they can be written in any order.\n\n### 012. What\
    \ are the possible ways of declaring a Java class?\n\n**Answer:**\n"
