    We were having difficulties in hiring new sales staff. I developed the idea to
    update our sales position job descriptions. The job descriptions we had were outdated
    and had not been updated in several years, during which time, many new software
    tools had become available, and the position had changed. The sales team got together
    and reviewed the current job description and provided their input as to what they
    felt should be added and removed from the descriptions, then management reviewed
    and made updates accordingly. Once we began running job ads with the new job description,
    we had an increase in qualified sales professionals applying who understood the
    position they applied for and were better matches.


    ### 316. Tell me about a time when you took a risk on a project.


    **Answer:**


    Whether the risk involved something as complex as taking on a major project with
    limited resources or time, or simply volunteering for a task that was outside
    your field of experience, show that you are willing to stretch out of your comfort
    zone and to try new things. Offer specific examples of why something you did was
    risky and explain what you learned in the process - or how this prepared you for
    a job objective you later faced in your career.


    *As an example:*


    I worked in the engineering department of a utility company. We had an emergency
    situation where a water pipe broke in the community and were overwhelmed with
    customer calls from the community regarding their utility bills. During this time,
    there were two customer service reps out on leave, so I offered my assistance
    since I was in between major projects. I was completely out of my comfort zone
    however I assisted with taking customer calls, answering basic questions, and
    taking names and numbers of the customers I was unable to help, so the supervisor
    could call them back later. I was able to collect payment from approximately 100
    customers, successfully answer about 50 questions, and take information for call
    backs on another 25. I learned more about how what I did in my department connected
    to the customer service reps and the types of questions they are asked by customers
    and challenges they face.After this situation, our two departments began working
    together more, and even had quarterly meetings together where we provided updates
    on items that may directly impact the work of the other department.


    ### 317. What would you tell someone who was looking to get into this field?


    **Answer:**


    This question allows you to be the expert - and will show the interviewer that
    you have the knowledge and experience to go along with any training and education
    on your resume. Offer your knowledge as advice of unexpected things that someone
    entering the field may encounter and be sure to end with positive advice such
    as the passion or dedication to the work that is required to truly succeed.


    *As an example:*


    If someone were looking to get into the field of sales, I would suggest first
    looking in into what certificate programs or degree options are available that
    may help with the field. I would also suggest if you are not comfortable with
    speaking to others whether one on one or in group settings, to take a public speaking
    class to boost your confidence. I would suggest learning the ins and outs about
    sales and finding a product that you are truly passionate about selling. If you
    are not passionate about your business, especially in sales, you will not do well.
    Once you find what you are passionate about selling, learn everything you can
    about it. If it is a product, use it and test it. If it is a service, try it out.
    Remember to allow yourself time in the beginning to fail a few times, this is
    not the end of the world as it helps you learn. Keep being persistent in your
    work and learn what works and does not work with your target audience. Have a
    positive attitude with customers and clients, find a balance between seeming too
    pushy or eager, but not too timid and disinterested, and don’t forget the follow
    ups after making first contact!


    # CHAPTER 03


    # Deadlines and Time Management


    ### 318. Tell me about a time when you didn’t meet a deadline.


    **Answer:**


    Ideally, this hasn’t happened - but if it has, make sure you use a minor example
    to illustrate the situation, emphasize how long ago it happened, and be sure that
    you did as much as you could to ensure that the deadline was met. Additionally,
    be sure to include what you learned about managing time better or prioritizing
    tasks in order to meet all future deadlines.


    *As an example:*


    I rarely, if ever miss a deadline. With that said, I do recall about two years
    ago I missed a deadline in submitting a report to the finance department. The
    problem ended up being that I had taken on too many projects all at once, and
    then had a couple of “urgent” unexpected issues thrown in as well that same week.
    I failed to ask for help, thinking I could do it all on my own and not wanting
    to give my supervisor the impression that I couldn’t handle the job. What happened
    though was that I did let the supervisor down and when I sat down to discuss the
    issue with them they assured me that if I had just kept the communication open
    about my workload, they would have helped pick up the slack. From then on, I made
    sure to be more open with my supervisor with my current workload and express any
    concerns I have with deadlines. I have not missed a deadline since, and my relationship
    with my team mates and productivity within the department have both improved along
    with the more open communication.


    ### 319. How do you eliminate distractions while working?


    **Answer:**


    With the increase of technology and the ease of communication, new distractions
    arise every day. Your interviewer will want to see that you are still able to
    focus on work, and that your productivity has not been affected, by an example
    showing a routine you employ in order to stay on task.


    *As an example:*


    Each morning, I look over the days tasks and prepare for what I need to do. I
    check my e-mail, messages, and other personal items and then put away my personal
    devices. I make sure my family and friends know that I check messages only during
    breaks, and if there is an emergency they have a good phone number to reach me.
    During breaks during the work week, I do not engage in a lot of social media,
    as that can drag in to the work day. On my breaks I prefer to walk, read, check
    in with a coworker for a few minute chat, or message a family or friend to say
    hello then it is back to work.


    ### 320. Tell me about a time when you worked in a position with a weekly or monthly
    quota to meet. How often were you successful?


    **Answer:**


    Your numbers will speak for themselves, and you must answer this question honestly.
    If you regularly met your quotas, be sure to highlight this in a confident manner
    and don’t be shy in pointing out your strengths in this area. If your statistics
    are less than stellar, try to point out trends in which they increased toward
    the end of your employment, and show reflection as to ways you can improve in
    the future.


    *As an example:*


    I consistently meet my deadlines every quarter. I take what the company gives
    me as a quota then I add my own personal goal to that. This way, I have something
    higher to work toward, and allows wiggle room if I am able to meet just the company
    goal and not my own as well. I try not to focus too much on the daily sales but
    rather do a monthly check. This allows for me to not spend too much wasted time
    on worrying about progress while still making sure I am on target.


    ### 321. Tell me about a time when you met a tough deadline, and how you were
    able to complete it.


