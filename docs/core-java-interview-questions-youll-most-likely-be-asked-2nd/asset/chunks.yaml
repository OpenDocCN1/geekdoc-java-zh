    \ needs to be followed by the interface name. You also need to provide an implementation\
    \ for the methods in the interface. The following code demonstrates this:\n\n\
    ```java\npublic interface ShapeDrawer {\n    public void draw();\n}\n```\n\nThis\
    \ code defines an interface called `ShapeDrawer` with a method called `draw`.\
    \ The following is a class that implements this interface:\n\n```java\npublic\
    \ class Triangle implements ShapeDrawer{\n    public void draw() {\n        //\
    \ code to draw shape\n    }\n}\n```\n\nThe class name i.e. `Triangle` is followed\
    \ by the `implements` keyword which is followed by the name of the interface that\
    \ is `ShapeDrawer`. Also, the `Triangle` class has code for the `draw` method.\n\
    \n### 104. Is the following code snippet valid? Explain the reasons either ways.\n\
    \n```java\npublic abstract class MyAbstractClass {\n    public void doSomething()\
    \ {\n        //doing something\n    }\n    public static void main(String args[])\
    \ {\n        MyAbstractClass obj = new MyAbstractClass();//Line 1\n        obj.doSomething();\
    \ //Line 2\n    }\n}\n```\n\nAnswer:\n\nThe above code is not valid and causes\
    \ a compilation error at Line 1. This code declares a class called `MyAbstractClass`\
    \ which is `abstract`. Line 1 instantiates the class and Line 2 invokes the `doSomething`\
    \ method. However, you cannot create an object of an abstract class. Although\
    \ this class does not contain any abstract method, the class is still declared\
    \ as `abstract` and so it cannot be instantiated.\n\n### 105. Can a class implement\
    \ two interfaces? What will happen if both the interfaces have a method with the\
    \ same name?\n\nAnswer:\n\nYes, a class can implement two interfaces. Even if\
    \ both interfaces have a method with the same name, this does not result in an\
    \ ambiguity as the implementation provided in the class is used.\n\nThe following\
    \ code demonstrates this:\n\n```java\npublic interface MyInterface1 {\n    public\
    \ void doSomething();\n}\n\npublic interface MyInterface2 {\n    public void doSomething();\n\
    }\n\npublic class MyClass implements MyInterface1, MyInterface2{\n    @Override\n\
    \    public void doSomething() {\n        // code here\n    }\n}\n\nMyClass obj\
    \ = new MyClass();\nobj.doSomething(); //Line 1\n```\n\nThe above code specifies\
    \ two interfaces `MyInterface1`, `MyInterface2`. Both interfaces have a method\
    \ called `doSomething`. The code also specifies a class `MyClass` that implements\
    \ both the interfaces. It needs to provide an implementation for the `doSomething`\
    \ method. When Line 1 is executed, the `doSomething()` method from `MyClass` is\
    \ executed.\n\n### 106. What is the use of abstract classes?\n\nAnswer:\n\nThere\
    \ are often programming situations when you want to create a super–class that\
    \ is shared by a number of sub–classes. You may want to put some common code in\
    \ the super class but leave it to the individual classes to provide the specific\
    \ details. Abstract classes are useful in such scenarios. So, you can create an\
    \ abstract super–class. You can have concrete methods that implement the common\
    \ functionality and abstract methods for the functionality that is sub–class specific.\
    \ The sub-classes can then extend the abstract class and provide implementation\
    \ for the abstract methods.\n\n### 107. Explain what is the issue with the following\
    \ code snippet:\n\n```java\npublic abstract final class MyAbstractClass {\n  \
    \  public void doSomething() {\n    }\n}\n```\n\nAnswer:\n\nThe above code snippet\
    \ is not valid. This code declares a class called `MyAbstractClass` that has both\
    \ the `abstract` as well as `final` keyword. An abstract class cannot be `final`\
    \ and vice versa. This is because an abstract class needs to have a sub–class\
    \ that implements the abstract methods in the class. `Final` is the opposite of\
