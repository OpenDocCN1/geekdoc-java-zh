    001. Explain method overloading and method overriding.


    Answer:


    Method overloading occurs when there are two or more methods in a class with the
    same name but with different number/type of arguments. The following code demonstrates
    this:


    public class Calculator {


    public int add (int a, int b) {


    return a+b;


    }


    public double add (double a, double b) {


    return a+b;


    }


    public int add (int a) {


    return a+a;


    }


    }


    Method overriding occurs when there is a method in a sub–class that has the same
    name and number of arguments as a super–class method. The following code demonstrates
    this:


    public class Animal {


    public void saySomething () {


    System.out.println(“I am an animal”);


    }


    }


    public class Dog extends Animal {


    public void saySomething () {


    System.out.println(“I am a dog”);


    }


    }


    002. Explain the benefits of OOPs.


    Answer:


    Following are the benefits of OOPs:


    a. **Reusability:** OOPs principles like Inheritance, Composition and polymorphism
    help in reusing existing code


    b. **Extensibility**: Code written using OOPs principles like Inheritance makes
    code extensible


    c. **Security:** OOPs principles like encapsulation help to keep the data and
    the code that operates on the data together and makes the code secure


    d. **Simplicity:** Java classes represent real world objects. This makes code
    very easy to understand


    e. **Maintainability:** Code written using OOPs principles is easier to maintain


    003. Write a code snippet that demonstrates encapsulation.


    Answer:


    Encapsulation refers to keeping the data and the code that operates on the data
    together as a single unit. Simply creating a class with private fields and public
    getter/setter methods is an example of encapsulation. The following code snippet
    demonstrates this:


    public class Laptop {


    private String memory;


    public String getMemory () {


    return memory;


    }


    public String setMemory (String newMemory){


    memory = newMemory;


    }


    }


    Here, there is a class called Laptop. It has a private field called memory and
    public getter and setter methods to access/modify the memory field. So, the memory
    field cannot be accessed directly outside the class, it can only be accessed via
    its getter/setter methods.


    004. What are the types of inheritance relationships?


    Answer:


    Inheritance relationships specify how code can be reused. There are two types
    of inheritance relationships.


    They are as follows:


    a. **IS–A**


    An IS–A relationship is implemented via inheritance, that is by creating a sub–class.
    Assume that, Camera is a subclass and Electronics is a super class. In that case,
    we can say that, Camera IS–A Electronic product


    b. **HAS–A**


    A HAS–A relation can be created via composition, that is by creating a field corresponding
    to another class. Assume that, inside the Camera class, there is an object called
    Battery. In that case, we can say that Camera HAS–A object called Battery


    005. What is the best practice in declaring instance variables?


    Answer:


    Instance variable should always be declared as private. They should have public
    getter/setter methods. This helps to protect the instance variable as they can
    only be modified under the programmer’s control. This is as per the Encapsulation
    principle.


    Declaring instance variables as public violates the encapsulation principle and
    poses a security issue. Public instance variables can be maliciously modified
    outside your class. If at all an instance variable needs to be accessed from a
    sub–class, it can be made protected.


    006. What is a singleton class?


    Answer:


    A class which lets you create only one instance at any given time is termed a
    Singleton class. A Singleton class can be implemented via a private constructor
    and a public getter method. The following code demonstrates this.


    public class MySingleton {


    private static MySingleton mySingletonInstance;


    private MySingleton () {


    }


    public static MySingleton getInstance () {


    if (mySingletonInstance == null) {


    mySingletonInstance = new MySingleton (); //


    create the object only if it is null


    }


    return mySingletonInstance;


    }


    public void doSomething () {


    System.out.println(“I am here....”);


    }


    public static void main(String a[]) {


    MySingleton mySingleton = MySingleton.getInstance();


    mySingleton.doSomething();


    }


    }


    Here, a private constructor and a public getInstance method is defined. The getInstance
    checks if an instance exists. If an instance does not exist, it creates one using
    the private constructor. If an instance exists, it just returns it. Any external
    class that needs an instance of the Singleton class, needs to obtain it via the
    getInstance method. The getInstance method ensures that there is only one instance
    of the Singleton class.


    007. Explain what happens when the following code is compiled and state whether
    it uses method overloading or overriding.


    class Electronics {


    public void displayPrice (Float price) {} //Line 1


    }


    class Camera extends Electronics {


    public void displayPrice (String price) {} //Line 2


    }


    Answer:


    The above compiles fine. It uses method overloading. Camera is a sub–class of
    Electronics and both classes have a method called displayPrice. However, the displayPrice
    method in both classes differ in the type of argument.


    008. Write a Java code sample that demonstrates method overloading.


    Answer:


    Method overloading occurs when there are two or more methods in a class with the
    same name but with a different number/type of arguments.The following code demonstrates
    this:


    class Laptop {


    public void displayPixel (int width, int height) { }; //Line 1


    public void displayPixel (float width, float height) {}; //Line 2


    }


    The class Laptop has two method with the name as displayPixel. The displayPixel
    method at Line 1 has two arguments, both of type int. The displayPixel method
    at Line 2, displayPixel method has two arguments both of type float. So here,
    the displayPixel method is said to be overloaded.


    009. What is polymorphism? How does Java support Polymorphism?


    Answer:


    Polymorphism literally means “many forms”. It is the ability to use the same interface
    to execute different code. Java achieves polymorphism via method overloading and
    method overriding. Method overloading occurs when there are many methods in a
    class with the same name but different number/type of arguments. The version of
    an overloaded method that will be invoked is determined at compile time based
    on the number/type of arguments passed in. Method overriding occurs when a sub–class
    has a method with the same name and type signature as a method in the super class.
    The version of an overridden method that will be invoked is determined at run
    time based on the type of object that invokes the method.


    010. Explain how Java achieves abstraction.


    Answer:


    Abstraction is an OOPs concept whereby only the necessary information is exposed
    to the end user and the internal implementation details are hidden. Java achieves
    abstraction via abstract classes and interfaces. So, you can declare the methods
    that you want to be exposed to the outside world in an abstract class or interface.
    The actual implementation will be within concrete classes that extend the abstract
    classes or implement the interfaces. The outside code is not aware of the implementing
    classes, they interact with your code via the interfaces or abstract classes.


