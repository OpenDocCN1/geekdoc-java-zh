  raw: '024. Write a code snippet that demonstrate how you can assign a float value
    to a short variable.


    Answer:


    The following code demonstrates converting a float value to a short variable:


    float fValue = 37000.02F;


    short sValue = (short) fValue;


    Here, the keyword short is specified before the float variable fValue, this is
    known as explicit cast. Since float is a wider data type than short, an explicit
    cast is required.


    025. What is the default value for int, double, float, boolean, long and char
    data types?


    Answer:


    The default values for the data types mentioned above are as follows:


    int = 0


    double = 0.0d


    float = 0.0f


    boolean = false


    long = 0L


    char = ‘u0000’


    026. In the following code snippet, explain which lines will compile fine and
    which will cause a compilation error.


    int [] [] add = new int [2] []; //Line 1


    int [] subtract = new int [2]; //Line 2


    int iValue = 2; //Line 3


    add[1] = subtract; //Line 4


    add[1] = iValue; //Line 5


    Answer:


    Line 1 compiles fine as it creates a two–dimensional array. Line 2 compiles fine
    as it creates a single dimensional array. Line 3 compiles fine as it declares
    and initializes an int variable.


    Since a two– dimensional array is an array of arrays, Line 4 also compiles fine.
    It assigns a single dimensional array to one of the dimensions in the two–dimensional
    array. Line 5 causes a compilation error because we cannot assign an int variable
    to an int array variable.


    027. Explain what happens when the following code is compiled.


    public class Car {


    public Car (String carName) {}


    }


    Car myCar = new Car(“Benz”);


    Car [] myCars = { myCar, new Car(“Ford”), new


    Car(“BMW”)};


