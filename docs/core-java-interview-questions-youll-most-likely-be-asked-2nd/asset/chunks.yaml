    Answer:


    Octal and Hexadecimal literals can be assigned to an int variable as follows:


    int iValue1 = 0100;


    int iValue2 = 0xf1dead;


    An Octal literal need to be prefixed with **‘0’**. Octal values can only use the
    digits 0–7


    A Hexadecimal literal need to be prefixed with **‘0x’.** Hexadecimal values can
    use the digits 0–9 and the characters A, B, C, D, E, and F.


