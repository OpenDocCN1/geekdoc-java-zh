  trans: "\n\n这段代码创建了一个包含某些 Integer 值的 `Stream`。然后，它调用了 `filter()` 方法，并使用一个 lambda\
    \ 表达式检查输入数字是否大于 5。因此，输出的 `Stream` 将仅包含那些大于 5 的数字。\n\n### 219. 解释 Stream 操作的类型。\n\
    \n答案：\n\nStream 操作可以分为以下几类：\n\na. **中间操作 (Intermediate)**：中间操作在 `Streams` 上操作并产生\
    \ `Stream` 输出。由于中间操作产生的是 `Stream`，因此它们可以链式调用以执行一系列操作。中间操作示例包括 `filter`、`map`、`sorted`。\n\
    \nb. **终端操作 (Terminal)**：终端操作在 `Streams` 上操作但产生非流的结果。因此，它们可以产生任何数据类型的结果。终端操作不能被链式调用。当多个\
    \ `Stream` 操作链式调用时，终端操作通常是最后一个操作。终端操作示例包括 `count`、`anyMatch`、`allMatch`、`collect`。\n\
    \n### 220. 什么是并行流 (parallel stream)？请用代码示例说明如何创建并行流。\n\n答案：\n\n除了顺序流外，`Stream\
    \ API` 还支持并行流。并行流对 `Stream` 中的元素进行并发操作，从而提供性能提升。`Collection` 接口新增了一个名为 `parallelStream()`\
    \ 的新方法。可以使用它来获取与底层集合对应的并行流。以下代码演示了这一点：\n\n```java\nList<String> colours = Arrays.asList(“Red”，“Green”，“Blue”);\n\
    Stream<String> parallelStream = colours.parallelStream();\n```\n\n这段代码首先创建了一个名为\
    \ `colours` 的 String 值 `List`。然后它在 `colours` List 上调用了 `parallelStream()` 方法。这会返回一个与该\
    \ List 对应的并行流。在此流上执行的任何后续 `Stream` 操作都将在该 `Stream` 的元素上并发执行。\n\n### 221. 如何将 Stream\
    \ 转换回 Collection？\n\n答案：\n\n`Stream` 接口有一个名为 `collect()` 的方法。它可以用于将 `Stream` 转换回\
    \ `Collection`。以下代码演示了这一点：\n\n```java\nStream<Integer> numbers = Stream.of(7,3,9,6,1);\n\
    List<Integer> filteredList = numbers.filter(num–> num > 5).collect(Collectors.toList());\n\
    ```\n\n这段代码首先创建了一个 Integer 的 `List`。然后它调用 `filter()` 方法来获取大于 5 的数字。之后，它调用了 `collect()`\
    \ 方法。`collect()` 方法接受一个 `Collector` 作为参数。调用 `Collectors.toList()` 方法会返回一个能将输入\
    \ `Stream` 转换为 `List` 的 `Collector`。因此，`filteredList` 是一个只包含输入 List 中大于 5 的数字的\
    \ `List`。`Collectors` 类还有其他方法，如 `Collectors.toSet`、`Collectors.toMap`、`Collectors.toCollection`，它们可将\
    \ `Stream` 转换为其他类型的 `Collections`。\n\n### 222. 下述代码段的输出是什么？\n\n```java\nStream<Integer>\
    \ numbers = Stream.of(10,15,20,25);\nboolean anyMatch = numbers.anyMatch(num–>\
    \ num%2==0);\nSystem.out.println(anyMatch);\n```\n\n答案：\n\n上面的代码段使用了 `Stream`\
    \ 接口上的 `anyMatch()` 方法。如果输入 `Stream` 中的任何元素符合指定条件，该方法将返回 true。在这种情况下，它检查输入 `Stream`\
    \ 中是否存在偶数。由于 `Stream` 中存在偶数，`anyMatch()` 方法返回 true。因此，这段代码打印以下输出：\n\ntrue\n\n\
    ### 223. Stream 和 Collection 之间有什么区别？\n\n答案：\n\n`Stream` 和 `Collection` 之间有几点区别，如下：\n\
    \n- `Collections` 实际上存储了数据。而流不存储任何数据，它只是在底层数据上执行某些操作。\n- 当你对 `Collection` 执行操作时，`Collection`\
    \ 会被修改。当你在从 `Collection` 获取的 `Stream` 上执行操作时，底层的 `Collection` 不会被修改。\n- `Collection`\
    \ 在创建后可以被修改。而 `Stream` 在构造后不能被修改。\n- 你可以多次遍历 `Collection`。然而，你只能遍历一次 `Stream`。如果你希望再次遍历\
    \ `Stream`，是不可能的，你需要从底层源创建一个新的 `Stream` 并再次遍历。\n\n### 224. 假设你有一个包含 String 值的\
    \ List。你想创建一个新的 List，消除原始 List 中的重复项并将 String 值转换为大写。你如何通过 Stream 操作实现这一点？\n\n\
    答案：\n\n```java\nList<String> fruits = Arrays.asList(“Apple”，“Mango”,“Banana”，“Apple”,\
    \ ”Orange”, “Mango”,”Strawberry”); //Line 1\nList<String> uniqueFruits = fruits.stream().distinct().map(str–>\
    \ str.toUpperCase()).collect(Collectors.toList()); //Line 2\nuniqueFruits.forEach(str–>\
    \ System.out.println(str));//Line 3\n```\n\n这段代码在第 1 行首先创建一个名为 `fruits` 的 String\
    \ 值 `List`。第 2 行首先调用 `fruits.stream()` 获取 `fruits` List 上的 `Stream`。然后调用 `distinct()`\
    \ 操作。`distinct()` 方法返回一个新的 `Stream`，其中仅包含输入 `Stream` 中的去重元素。接下来，调用 `map()` 操作。`map()`\
    \ 操作可用于转换 `Stream`。它接受一个 `Function` 实例作为参数，并将该 `Function` 应用于 `Stream` 中的每个元素。这里使用了一个\
    \ lambda 表达式将 `Stream` 中的每个 String 转换为大写。最后，调用 `collect()` 方法并传入一个将 `Stream` 转换为\
    \ `List` 的 `Collector`。第 3 行打印 `uniqueFruits` List 中的所有元素。因此，这段代码打印以下输出：\n\nAPPLE\n\
    MANGO\nBANANA\nORANGE\nSTRAWBERRY\n\n### 225. 是否可以将数组转换为 Stream？请解释。\n\n答案：\n\n\
    是的，可以将数组转换为 `Stream`。Java 8 在 `java.util.Arrays` 类中添加了一个 `stream()` 方法。该方法有许多重载版本，可以接受不同数据类型的数组并将数组转换为\
    \ `Stream`。以下代码演示了将一个 Integer 数组转换为 `Stream`：\n\n```java\nint[] numbers = {10,20,30};\n\
    IntStream numberStream = Arrays.stream(numbers);\n```\n\n这段代码首先创建一个名为 `numbers`\
    \ 的 `int` 数组。然后它使用 `Arrays.stream` 方法传递输入数组。`Arrays.stream` 返回一个 `IntStream`，它是\
    \ `Stream` 接口的原始类型特化。就像 `IntStream` 一样，Java 8 还添加了 `DoubleStream` 和 `LongStream`，它们分别在用\
    \ `Arrays.stream` 方法处理 double 或 long 数组时返回。\n\n### 226. 假设你有如下的 Employee 类：\n\n\
    ```java\npublic class Employee {\n    private String name;\n    private int salary;\n\
    }\n```\n\n并且假设有一个如下的 Employee 对象 List：\n\n```java\nList<Employee> employees =\
    \ new ArrayList<Employee>();\nemployees.add(new Employee(“John”,10000));\nemployees.add(new\
    \ Employee(“Ana”,15000));\nemployees.add(new Employee(“Tia”,8000));\n```\n\n**如何使用\
    \ Streams 创建一个根据 Employee 工资排序的新 List？**\n\n答案：\n\n```java\nList<Employee> sortedList\
    \ = employees.stream().sorted((emp1, emp2)–> emp1.getSalary()–emp2.getSalary()).collect(Collectors.toList());\n\
    sortedList.forEach(emp–> System.out.println(emp.getSalary()));\n```\n\n这段代码首先获取\
    \ `employees` List 上的 `Stream`。然后它调用 `sorted()` 操作。`sorted()` 方法接受一个 `Comparator`\
    \ 作为输入。这里，`Comparator` 通过 lambda 表达式实现，用于比较 Employee 对象的工资字段。最后，调用 `collect()`\
    \ 方法将 `Stream` 转换回 `List`。因此，这段代码打印以下输出：\n\n8000\n10000\n15000\n20000\n\n"
- fmt: "\nA method reference is a new operator introduced by `Java 8`. It is a shortcut\
    \ operator for a lambda expression. It is represented by the `::` symbol.\n\n\
    Method references have several benefits as follows:\n\na. **They avoid code duplication**:\
    \ Sometimes, your code may already have a method that has the same code that you\
    \ would like to specify in a lambda expression. In such a scenario method references\
    \ are useful. So instead of re–writing the code again in the lambda expression,\
    \ you can refer to the existing method via a method reference.\n\nb. **They make\
    \ code concise**: Method references are a step further from lambda expression.\
    \ They help to make the code even more concise by moving the code from the lambda\
    \ expression into a separate method.\n\n### 228. What are the different types\
    \ of method references?\n\nAnswer:\n\nThere are 4 types of method references.\
    \ These are as follows:\n\na. **Static method reference**: This occurs when a\
    \ static method of a class is referenced via the method reference operator. Its\
    \ syntax is as follows:\n\n`class::staticmethod`\n\nb. **Instance method reference**:\
    \ This occurs when an instance method of a class is referenced via the method\
    \ reference operator. Its syntax is as follows:\n\n`object::instancemethod`\n\n\
    c. **Constructor reference**: This occurs when a constructor of a class is referenced\
    \ via the method reference operator. Its syntax is as follows:\n\n`class::new`\n\
    \nd. **Arbitrary method reference**: This occurs when an instance method of a\
    \ class is accessed but not on any specific object. Its syntax is as follows:\n\
    \n`class::instancemethod`\n\n### 229. Give an example of static method reference.\n\
    \nAnswer:\n\nStatic method reference occurs when a static method of a class is\
    \ accessed via the method reference operator. The following code demonstrates\
    \ this:\n\n```java\npublic class MethodReferenceDemo {\n\n    public static boolean\
    \ checkIfNumberGreaterThan8(int num) {\n        return num > 8;\n    }\n\n   \
    \ public static void main(String[] args) {\n        Predicate<Integer> numberChecker\
    \ =\n            MethodReferenceDemo::checkIfNumberGreaterThan8;\n        boolean\
    \ flag = numberChecker.test(10);\n    }\n}\n```\n\nHere, the `MethodReferenceDemo`\
    \ class has a static method called `checkIfNumberGreaterThan8()`. This checks\
    \ if the input number is greater than 8 and returns a boolean value accordingly.\
    \ In the `main` method, a `Predicate` is defined. However, instead of using a\
    \ lambda expression to implement the `Predicate`, the existing `checkIfNumberGreaterThan8()`\
    \ is referenced via the method reference operator. Since `checkIfNumberGreaterThan8()`\
    \ is a static method, the class name followed by method name is used.\n\n### 230.\
    \ Consider the following Shape class:\n\n```java\npublic class Shape {\n    private\
    \ String name;\n}\n```\n\n**What changes are required in this class in order to\
    \ make the code below valid?**\n\n```java\nList<String> shapeNames = Arrays.asList(“Circle”,”Triangle”);\n\
    List<Shape> shapes = shapeNames.stream().map(Shape::new).collect(Collectors.toList());\n\
    ```\n\nAnswer:\n\nThe code above creates a `List` of String values called `shapeNames`.\
    \ It then uses the `Stream.map()` operation to create a `List` of `Shape` objects\
    \ called `shapes`. The code uses a constructor reference to create a new `Shape`\
    \ object using the `String` shape name. So, the `Shape` class requires a constructor\
    \ that accepts a `String` value as input as follows:\n\n```java\npublic Shape(String\
    \ name) {\n    this.name = name;\n}\n```\n\n### 231. Explain what type of method\
    \ reference is String::toUpperCase.\n\nAnswer:\n\n`String::toUpperCase` is an\
    \ example of arbitrary method reference. It refers to the `toUpperCase` method\
    \ of the `String` class but not on any specific object. This is generally used\
    \ while iterating through a `Collection` or a `Stream`. For example, suppose you\
    \ want to convert all the elements of a `List` to uppercase. You can use this\
    \ `String::toUpperCase` as follows:\n\n```java\nList<String> colours = Arrays.asList(“Red”,”Blue”,”Green”);\n\
    List<String> upperCaseColours =\n    colours.stream().map(String::toUpperCase).collect(Collectors.toList());\n\
    ```\n\n# CHAPTER 05\n# DateTime API\n\n### 232. Explain what is wrong in the following\
    \ code snippet and how you can fix it.\n\n```java\nLocalDate date1 = LocalDate.of(2018,\
    \ 7, 24);\nLocalTime time1 = date1.atTime(5, 30);\n```\n\nAnswer:\n\nThe code\
    \ snippet above first creates a `LocalDate` called `date1`. It then uses the `atTime()`\
    \ method on `date1` and assigns the result to a `LocalTime` object called `time1`.\
    \ This causes a compilation error. The `atTime()` method combines the date in\
    \ the current time object with the specified time and returns a `LocalDateTime`\
    \ object. So, you can fix the code above by making the following change:\n\n```java\n\
    LocalDateTime time1 = date1.atTime(5, 30);\n```\n\nThis combines the date specified\
    \ in `date1` with the time `5:30` and returns a `LocalDateTime` object.\n\n###\
    \ 233. Explain with appropriate code samples the different ways in which you can\
    \ create a LocalDate.\n\nAnswer:\n\nThe `LocalDate` class has some static methods\
    \ using for `LocalDate` creation. These are as follows:\n\na. Creating a `LocalDate`\
    \ corresponding to the current Date– The `LocalDate.now()` method can be used\
    \ for this as shown below:\n\n```java\nLocalDate date1 = LocalDate.now();\n```\n\
    \nb. Creating a `LocalDate` corresponding to the specified year, month and day–\
    \ The `LocalDate.of` method can be used for this as shown below:\n\n```java\n\
    LocalDate date2 = LocalDate.of(2018, 7, 24);\n```\n\nc. Creating a `LocalDate`\
    \ corresponding to a String Date– The `LocalDate.parse` can be used for this as\
    \ shown below:\n\n```java\nLocalDate date3 = LocalDate.parse(“2014–08–11”);\n\
    ```\n\n### 234. Explain with a code sample how you can check if a date is before\
    \ another.\n\nAnswer:\n\nThe `LocalDate` class has a method `isBefore()`. You\
    \ can use this to check if a date is before another as shown below:\n\n```java\n\
    LocalDate date1 = LocalDate.of(2018, 7, 24);\nLocalDate date2 = LocalDate.parse(“2014–08–11”);\n\
    boolean isBefore = date1.isBefore(date2);\nSystem.out.println(“isBefore–”+isBefore);\n\
    ```\n\nThis code creates two date objects, `date1` and `date2`. It invokes `isBefore()`\
    \ on `date1`, passing `date2` as an argument. Since `date1` is after `date2`,\
    \ the `isBefore()` method returns `false`. So, this code prints the output:\n\n\
    isBefore–false\n\n### 235. Explain the ZonedDateTime class.\n\nAnswer:\n\nThe\
    \ `ZonedDateTime` class represents a date and time that also has time–zone information.\
    \ So, in addition to the year, month, day, hour, minutes, seconds and nano seconds,\
    \ it also has a `ZoneId` component. The `ZoneId` is an instance of `java.time.ZoneId`\
    \ and represents the time–zone. There are about 40 time zones that can be represented\
    \ via a Zone Id. The code below shows how you can create a `ZonedDateTime`:\n\n\
    ```java\nZoneId zoneId = ZoneId.of(“Asia/Kolkata”);\nZonedDateTime zonedDateTime\
    \ = ZonedDateTime.now(zoneId);\n```\n\nSo, the above code snippet first creates\
    \ a `ZoneId` corresponding to `Asia/Kolkata` which is the IST time–zone. It then\
    \ creates a `ZonedDateTime` that corresponding to the current time as per the\
    \ system clock but with this zone id.\n\n### 236. What will be the output of the\
    \ following code snippet?\n\n```java\nLocalTime localTime = LocalTime.of(7, 15);\n\
    System.out.println(localTime.minusMinutes(30));\n```\n\nAnswer:\n\nThe above code\
    \ creates a `LocalTime` instance. A `LocalTime` represents time that has the hours,\
    \ minutes, seconds and nanoseconds component. Here a `LocalTime` object is created\
    \ corresponding to `7–15`. The code then invokes the `minusMinutes()` method with\
    \ the value `30` and prints the output. The `minusMinutes()` method subtracts\
    \ the specified number of minutes from the `LocalTime` on which it is invoked.\
    \ After subtracting `30` minutes from `7–15`, the time would be `6–45`. So this\
    \ code prints the output:\n\n06–45\n\n### 237. How can you obtain the day of the\
    \ week corresponding to a date using the Java 8 DateTime API?\n\nAnswer:\n\nThe\
    \ `LocalDate` class has a method `getDayOfWeek()`. You can use this to get the\
    \ day of the week corresponding to a Date as shown by the code below:\n\n```java\n\
    LocalDate date = LocalDate.parse(“2017–04–25”);\nSystem.out.println(date.getDayOfWeek());\n\
    ```\n"
  raw: 'A method reference is a new operator introduced by Java 8\. It is a shortcut
    operator for a lambda expression. It is represented by the::symbol.


    Method references have several benefits as follows:


    a. **They avoid code duplication**: Sometimes, your code may already have a method
    that has the same code that you would like to specify in a lambda expression.
    In such a scenario method references are useful. So instead of re–writing the
    code again in the lambda expression, you can refer to the existing method via
    a method reference.


    b. **They make code concise**: Method references are a step further from lambda
    expression. They help to make the code even more concise by moving the code from
    the lambda expression into a separate method.


    228. What are the different types of method references?


    Answer:


    There are 4 types of method references. These are as follows:


    a. **Static method reference**: This occurs when a static method of a class is
    referenced via the method reference operator. Its syntax is as follows:


    class::staticmethod


    b. **Instance method reference**: This occurs when an instance method of a class
    is referenced via the method reference operator. Its syntax is as follows:


    object::instancemethod


    c. **Constructor reference**: This occurs when a constructor of a class is referenced
    via the method reference operator. Its syntax is as follows:


    class::new


    d. **Arbitrary method reference**: This occurs when an instance method of a class
    is accessed but not on any specific object. Its syntax is as follows:


    class::instancemethod


    229. Give an example of static method reference.


    Answer:


    Static method reference occurs when a static method of a class is accessed via
    the method reference operator. The following code demonstrates this:


    public class MethodReferenceDemo {


    public static boolean checkIfNumberGreaterThan8(int num) {


    return num > 8;


    }


    public static void main(String[] args) {


    Predicate<Integer> numberChecker =


    MethodReferenceDemo::checkIfNumberGreaterThan8;


    boolean flag = numberChecker.test(10);


    }


    }


    Here, the MethodReferenceDemo class has a static method called checkIfNumberGreaterThan8().
    This checks if the input number is greater than 8 and returns a boolean value
    accordingly. In the main method, a Predicate is defined. However, instead of using
    a lambda expression to implement the Predicate, the existing checkIfNumberGreaterThan8()
    is referenced via the method reference operator. Since checkIfNumberGreaterThan8()
    is a static method, the class name followed by method name is used.


    230. Consider the following Shape class:


    public class Shape {


    private String name;


    }


    **What changes are required in this class in order to make the code below valid?**


    List<String> shapeNames = Arrays.asList(“Circle”,”Triangle”);


    List<Shape> shapes = shapeNames.stream().map(Shape::new).collect(Collectors.toList());


    Answer:


    The code above creates a List of String values called shapeNames. It then uses
    the Stream map() operation to create a List of Shape objects called shapes. The
    code uses a constructor reference to create a new Shape object using the String
    shape name. So, the Shape class requires a constructor that accepts a String value
    as input as follows:


    public Shape(String name) {


    this.name = name;


    }


    231. Explain what type of method reference is String::toUpperCase.


    Answer:


    String::toUpperCase is an example of arbitrary method reference. It refers to
    the toUpperCase method of the String class but not on any specific object. This
    is generally used while iterating through a Collection or a Stream. For example,
    suppose you want to convert all the elements of a List to uppercase. You can use
    this String::toUppercase as follows:


    List<String> colours = Arrays.asList(“Red”,”Blue”,”Green”);


    List<String> upperCaseColours =


    colours.stream().map(String::toUpperCase).collect(Collectors.toList());


    # [CHAPTER 05](#toc.xhtml_ss025a)


    # [DateTime API](#toc.xhtml_ss025a)


    232. Explain what is wrong in the following code snippet and how you can fix it.


    LocalDate date1 = LocalDate.of(2018, 7, 24);


    LocalTime time1 = date1.atTime(5, 30);


    Answer:


    The code snippet above first creates a LocalDate called date1. It then uses the
    atTime() method on date1 and assigns the result to a LocalTime object called time1.
    This causes a compilation error. The atTime() method combines the date in the
    current time object with the specified time and returns a LocalDateTime object.
    So, you can fix the code above by making the following change:


    LocalDateTime time1 = date1.atTime(5, 30);


    This combines the date specified in date1 with the time **5:30** and returns a
    LocalDateTime object.


    233. Explain with appropriate code samples the different ways in which you can
    create a LocalDate.


    Answer:


    The LocalDate class has some static methods using for LocalDate creation. These
    are as follows:


    a. Creating a LocalDate corresponding to the current Date– The LocalDate.now()
    method can be used for this as shown below:


    LocalDate date1 = LocalDate.now();


    b. Creating a LocalDate corresponding to the specified year, month and day– The
    LocalDate.of method can be used for this as shown below:


    LocalDate date2 = LocalDate.of(2018, 7, 24);


    c. Creating a LocalDate corresponding to a String Date– The LocalDate.parse can
    be used for this as shown below:


    LocalDate date3 = LocalDate.parse(“2014–08–11”);


    234. Explain with a code sample how you can check if a date is before another
    date.


    Answer:


    The LocalDate class has a method called isBefore(). You can use this to check
    if a date is before another date as shown below:


    LocalDate date1 = LocalDate.of(2018, 7, 24);


    LocalDate date2 = LocalDate.parse(“2014–08–11”);


    boolean isBefore = date1.isBefore(date2);


    System.out.println(“isBefore–”+isBefore);


    This code creates two date objects, date1 and date2. It invokes isBefore() on
    date1, passing date2 as an argument. Since date1 is after date2, the isBefore()
    method returns false. So, this code prints the output shown below:


    isBefore–false


    235. Explain the ZonedDateTime class.


    Answer:


    The ZonedDateTime class represents a date and time that also has a time–zone information.
    So, in addition to the year, month, day, hour, minutes, seconds and nano seconds
    components, it also has a ZoneId component. The ZoneId is an instance of the java.time.ZoneId
    and represents the time–zone. There are about 40 time zones that can be represented
    via a Zone Id. The code below shows how you can create a ZonedDateTime:


    ZoneId zoneId = ZoneId.of(“Asia/Kolkata”);


    ZonedDateTime zonedDateTime = ZonedDateTime.now(zoneId);


    So, the above code snippet first creates a ZoneId corresponding to **Asia/Calcutta**
    which is the IST time–zone. It then creates a ZonedDateTime that corresponding
    to the current time as per the system clock but with this zone id.


    236. What will be the output of the following code snippet?


    LocalTime localTime = LocalTime.of(7, 15);


    System.out.println(localTime.minusMinutes(30));


    Answer:


    The above code creates a LocalTime instance. A LocalTime represents time that
    has the hours, minutes, seconds and nanoseconds component. Here a LocalTime object
    is created corresponding to **7–15**. The code then invokes the minusMinutes()
    method with the value **30** and prints the output. The minusMinutes() method
    subtracts the specified number of minutes from the LocalTime on which it is invoked.
    After subtracting **30** minutes from **7–15**, the time would be **6–45**. So
    this code prints the output shown below:


    06–45


    237. How can you obtain the day of the week corresponding to a date using the
    Java 8 DateTime API?


    Answer:


    The LocalDate class has a method called getDayOfWeek(). You can use this to get
    the day of the week corresponding to a Date as shown by the code below:


    LocalDate date = LocalDate.parse(“2017–04–25”);


    System.out.println(date.getDayOfWeek());'
