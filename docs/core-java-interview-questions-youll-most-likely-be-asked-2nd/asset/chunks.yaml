    \ void saySomething() {\n        System.out.println(“I am a dog”);\n    }\n  \
    \  public static void main(String args[]) {\n        Animal a = new Animal();\
    \ //Line 1\n        a.saySomething(); //Line 2\n        Animal b = new Dog();\
    \ //Line 3\n        b.saySomething(); //Line 4\n        Dog d = new Dog(); //Line\
    \ 5\n        d.saySomething(); //Line 6\n    }\n}\n```\n\n答案：\n\n这段代码将输出以下内容：\n\
    \n```\nI am an animal\nI am an animal\nI am a dog\n```\n\n第 `1` 和 `2` 行创建了一个 `Animal`\
    \ 对象并调用 `saySomething` 方法，该方法打印“I am an Animal”。第 `3` 行声明了一个 `Animal` 类型变量 `b`，但将其赋值了一个\
    \ `Dog` 类型的对象。第 `4` 行使用变量 `b` 调用 `saySomething` 方法。通常情况下，当给父类变量赋值子类对象并调用被重写的方法时，将执行子类的版本。然而，在本例中，尽管\
    \ `Animal` 和 `Dog` 类都拥有 `saySomething` 方法，但它是一个静态方法。静态方法不能被重写。因此，第 `4` 行调用了 `Animal`\
    \ 类的 `saySomething` 方法并打印 I am an Animal。第 `5` 和 `6` 行创建了一个 `Dog` 对象并调用 `saySomething`\
    \ 方法，该方法打印 I am a Dog。\n\n### 094. 下列代码段的输出是什么？\n\n```java\npublic class Shape\
    \ {\n    public Shape() {\n        System.out.println(“Shape Constructor”);\n\
    \    }\n    public void printShape() {\n        System.out.println(“I’m a shape!”);\n\
    \    }\n}\n\npublic class Circle extends Shape{\n    public void printShape()\
    \ {\n        System.out.println(“I’m a Circle!”);\n    }\n}\n\npublic class Triangle\
    \ extends Shape {\n    public void printShape() {\n        System.out.println(“I’m\
    \ a Triangle!”);\n    }\n}\n\npublic class ShapeDemo {\n    public static void\
    \ main(String[] args) {\n        Shape shape = new Shape(); //Line 1\n       \
    \ shape.printShape();\n        Shape circle = new Circle(); //Line 2\n       \
    \ circle.printShape();\n        Shape triangle = new Triangle(); //Line 3\n  \
    \      triangle.printShape();\n    }\n}\n```\n\n答案：\n\n这段代码输出了以下内容：\n\n```\nI’m\
    \ a shape!\nI’m a Circle!\nI’m a Triangle!\n```\n\n在这里，`Shape` 是基类，`Circle` 和\
    \ `Triangle` 是其子类。基类中有一个 `printShape` 方法，该方法在两个子类中都被重写了。当方法被重写时，由赋值的对象类型而不是引用变量类型来决定调用哪个版本的重写方法。在第\
    \ `1` 行，一个 `Shape` 类型的变量被赋值一个 `Shape` 对象，因此调用了 `Shape` 类中的 `printShape` 方法。在第\
    \ `2` 行，一个 `Shape` 类型的变量被赋值一个 `Circle` 对象，因此调用了 `Circle` 类中的 `printShape` 方法。在第\
    \ `3` 行，一个 `Shape` 类型的变量被赋值一个 `Triangle` 对象，因此调用了 `Triangle` 类中的 `printShape`\
    \ 方法。Java 的这一特性被称为运行时多态。\n\n### 095. 解释以下代码段存在什么问题：\n\n```java\npublic class Base\
    \ {\n    public void doSomething() {\n    }\n}\n\npublic class Sub extends Base{\n\
    \    public void doSomethingElse() {\n    }\n}\n\npublic class Demo {\n    public\
    \ static void main(String[] args) {\n        Base base = new Base(); //Line 1\n\
    \        base.doSomethingElse(); //Line 2\n    }\n}\n```\n\n答案：\n\n这段代码在第 `2`\
    \ 行导致编译错误。它定义了一个名为 `Base` 的类和一个名为 `Sub` 的子类。第 `1` 行创建了一个 `Base` 类对象。第 `2` 行调用\
    \ `base.doSomethingElse()` 方法。由于 `doSomethingElse()` 方法定义在 `Sub` 中，`Base` 无法访问它，因此在第\
    \ `2` 行发生编译错误。\n\n### 096. 什么是动态方法分派？\n\n答案：\n\n动态方法分派是一种在运行时确定调用哪个重写方法的机制。动态方法分派是\
    \ Java 实现运行时多态的方式。通过动态方法分派，可以根据对象的实际类型来调用对应的方法，而不是根据引用的类型。\n\n### 097. 下列代码是否有效？\n\
    \n```java\npublic class Shape {\n}\n\npublic class Circle extends Shape {\n}\n\
    \npublic class ShapeDrawer {\n    public void drawShape(Shape shape) {\n     \
    \   System.out.println(\"Drawing a shape\");\n    }\n}\n\npublic class ShapeDemo\
    \ {\n    public static void main(String args[]) {\n        ShapeDrawer drawer\
    \ = new ShapeDrawer();\n        drawer.drawShape(new Circle()); //Line1\n    }\n\
    }\n```\n\n答案：\n\n是的，上述代码是有效的。它定义了一个 `Shape` 类，`Circle` 是 `Shape` 的子类。`ShapeDrawer`\
    \ 类有一个 `drawShape` 方法，接受一个 `Shape` 类型参数。`ShapeDemo` 类创建了一个 `ShapeDrawer` 对象。第\
    \ `1` 行调用 `drawer.drawShape(new Circle())`。由于 `Circle` 是 `Shape` 的子类，它可以被传递给接受\
    \ `Shape` 类型参数的方法。\n"
