    ### 070. What are the possible access specifiers for a constructor?


    **Answer:**


    Below are the possible access modifiers for a constructor–


    a. `private`: This denotes that the constructor is accessible only from its class


    b. `public`: This denotes that the constructor is accessible from any class which
    resides in any package


    c. `protected`: This denotes that the constructor is accessible from any class
    which resides in the same package


    ### 071. What will be the output of the following code snippet?


    ```java

    public class MyClass {


    public void callMe(int a) {


    System.out.println(“Call me with int argument”);


    }


    public void callMe(long a) {


    System.out.println(“Call me with long argument”);

    }


    public static void main(String args[]) {


    MyClass myClassObj = new MyClass();


    int i = 6;


    myClassObj.callMe(i);


    }


    }

    ```


    **Answer:**


    The above code will print the following output:


    Call me with int argument


    Since the method `callMe()` is invoked with an integer value, the method that
    accepts an integer argument gets invoked. If we change the datatype of `i` to
    `long`, then the method that accepts a long type of argument gets invoked.


    ### 072. How will you define a constructor? Give an example.


    **Answer:**


    Constructor is a special method which has the same name as the class name but
    with no return type. The constructor is invoked automatically whenever a new object
    is created. It is most commonly used to execute some code that needs to be run
    as soon as an object of a class is created like setting initial values to the
    instance variables. The following code demonstrates this:


    ```java

    public class Electronics {


    int price;


    Electronics(int price) {


    this.price = price;


    } //constructor


    public static void main(String argument[]) {


    Electronics e = new Electronics(); //Line 1


    }


    }

    ```


    In the above code, as soon as Line 1 is executed, the `JVM` invokes the constructor.
    This initializes the `price` field with the value passed in.


    ### 073. Explain the void keyword with a code sample.


    **Answer:**


    The `void` keyword is useful when a method does not return a value. It is specified
    as the return type for such methods. The following code demonstrates this:


    ```java

    public void doSomething(){


    }

    ```


    Here, the `void` keyword is specified with the `doSomething()` method which indicates
    that this method does not return any value.


    ### 074. Explain the differences between a constructor and an ordinary method.


    **Answer:**


    There are several differences between a constructor and an ordinary method. These
    are as follows:


    • A constructor has the same name as the class name, an ordinary method can have
    any name.


    • A constructor does not have a return type, not even `void`. A method has a return
    type. If a method does not return any value, then the keyword `void` needs to
    be specified.


    • A constructor is automatically invoked when an object of the class is created.
    A method needs to be invoked explicitly.


    • If a class does not have a constructor, Java automatically creates a default
    constructor. If a class does not have a method, Java does not automatically add
    a method.


    ### 075. Explain this keyword with a code sample.


    **Answer:**


    The `this` keyword is used to refer to the current object. It can be used to reference
    a field or a method corresponding to the current object. The following code demonstrates
    this:


    ```java

    public class Book {


    private String name;


    private String author;


    public Book(String name, String author) {


    this.name = name;


    this.author = author;


    }


    public void doSomething(Book book) {


    }


    public void doSomethingElse(Book book) {


    this.doSomething(book);


    }


    }

    ```


    This code creates a class called `Book`. It has a constructor that initializes
    the `name` and `author` fields. The `this` keyword is used to refer to the current
    object’s copies of the `name` and `author` fields. This helps in distinguishing
    between the instance fields and the variables passed in. The `this` keyword can
    also be used with methods. So, the `doSomethingElse` method invokes the `doSomething`
    method via the `this` keyword.


    ### 076. Explain the differences between a class and an object.


    **Answer:**


    There are several differences between a class and an object. These are as follows:


    • A class acts like a template and defines a new data type. An object on the other
    hand is a value of that data type.


    • A class does not have any memory allocated to it. An object has memory allocated
    to it.


    • A class is a logical entity, an object has physical existence.


    • A class is declared using the `class` keyword, an object is created using the
    `new` keyword.


    • A class does not have a state, an object has state.


    ### 077. Explain the new keyword with a code sample.


    **Answer:**


    The `new` keyword is used to allocate memory for an object. It needs to be followed
    by a call to the constructor of the method. The following code snippet demonstrates
    the `new` keyword–


    ```java

    Person person1 = new Person();

    ```


    Here, `Person` is the name of the class, `person1` is an object of type `Person`.
    The `new` keyword is followed by the constructor for the `Person` class. This
    allocates memory for the `person1` object. The `new` keyword is only required
    to be specified with objects and not for primitive types like `int`, `double`,
    etc.


    ### 078. What will be the output of the following code snippet?


    ```java

    public class MyClass2 {


    private int field1 = 0;


    private static int field2 = 0;


    public static void main(String[] args) {


    MyClass2 object1 = new MyClass2();


    object1.field1++; //Line 1


    object1.field2++; //Line 2


    MyClass2 object2 = new MyClass2();


    object2.field1++; //Line 3


    object2.field2++; //Line 4


    System.out.println(object2.field1); //Line 5


    System.out.println(object2.field2); //Line 6


    }


    }

    ```


    **Answer:**


    This code will print the following output:


    1


    2


    Here, the class `MyClass2` has 2 fields, `field1` and `field2`. `field1` is an
    instance field while `field2` is a static field. When it comes to instance fields,
    each object of a class has its own copy. So `object1` and `object2` will have
    their own copies of `field1`. Lines 1 and 3 will cause this copy of the field
    to be incremented. However, in the case of static fields, there is only one copy
    for all the objects of the class. So, there is only one copy of `field2` corresponding
    to `object1` and `object2`. So, lines 2 and 4 will increment this same copy and
    cause Line 6 to print the value 2.


    ### 079. Explain the return keyword with a code sample.


    **Answer:**


    The `return` keyword is used at the end of a method to return a value which is
    the result of some computation. The value returned must match the return type
    of the method. The following code demonstrates this:


    ```java

    public int add(int num1, int num2){


    int sum = num1+num2;


    return sum;


    }

    ```


    This method has an `int` return type. It returns the sum of addition.


    Even if a method does not return anything, the `return` keyword may optionally
    be specified without any value. The following code demonstrates this:


    ```java

    public void printSum(int a, int b) {


    int sum = a+b;


    System.out.println(sum);


    return;


    }

    ```


    In this case, the method has a `void` return type which indicates that the method
    does not return anything. However, the `return` keyword is still specified.


    ### 080. What is an inner class? What are the different types of inner classes?


    **Answer:**


    An inner class is any class defined inside the body of another class. There are
    4 types of inner classes as follows:


    a. **Nested class**: Class is defined within the body of another class. It has
    access to all the members of the outer class.


    b. **Static nested class**: A nested class that is static is known as a static
    nested class. It cannot access non–static members of the outer class.

