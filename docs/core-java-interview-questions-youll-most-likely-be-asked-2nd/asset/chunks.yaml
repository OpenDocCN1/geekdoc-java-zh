    modularize the JDK and to improve security.


    • A package contains a group of related files. A module on the other hand contains
    a group of related packages.


    • A package does not require a package descriptor, a module requires a module
    descriptor called module–info.java.


    • Packages cannot be deployed by themselves; modules can be deployed by themselves.


    • The classes within a package are visible via reflection. The classes within
    a module are not visible via reflection unless the open directive is specified
