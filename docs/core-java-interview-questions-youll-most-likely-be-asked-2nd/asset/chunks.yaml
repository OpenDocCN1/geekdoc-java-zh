    \ however uncommenting Line 3 will cause a compilation error.\n\n### 085. Explain\
    \ with a code sample how a static nested class can be instantiated.\n\n**Answer:**\n\
    \nConsider the following code snippet:\n\n```java\nclass MyClass {\n    int ivalue\
    \ = 1000; //Line 1\n    static class Nested { //Line 2\n    }\n}\n```\n\nThe static\
    \ nested class can be instantiated as follows:\n\n`MyClass.Nested nested = new\
    \ MyClass.Nested();`\n\nTo instantiate a static nested class, both the outer class\
    \ name and the nested class name need to be specified. In the above code, the\
    \ class name is `MyClass` and the Static Nested class name is `Nested`.\n\n# Inheritance\n\
    \n### 086. Give an example of illegal method overriding.\n\n**Answer:**\n\nThe\
    \ following code is an example of illegal method overriding:\n\n```java\nclass\
    \ Electronics {\n    public void displayPrice() {}\n}\n\nclass Camera extends\
    \ Electronics {\n    public void displayPrice() throws Exception {}\n}\n```\n\n\
    In this code snippet, the class `Camera` is a sub–class of the `Electronics` class.\
    \ The `displayPrice()` method is overridden in the `Camera` class. However, this\
    \ code will cause a compilation error. This is because the `displayPrice()` method\
    \ in `Camera` class specifies that it throws an `Exception`. One of the rules\
    \ of method overriding is that the overridden method must not throw a new or a\
    \ broader checked exception.\n\n### 087. Explain the super keyword.\n\n**Answer:**\n\
    \nThe `super` keyword can be used in a sub–class to access the base class instance\
    \ fields or methods. It can also be used in a sub–class constructor to invoke\
    \ the base class constructor. Consider the following code snippet:\n\n```java\n\
    class Electronics {\n    protected double price;\n    public void displayPrice(){\n\
    \        //some code here\n    }\n}\n\nclass Camera extends Electronics {\n  \
    \  String cameraName;\n    public void setPrice(double price){\n        super.price\
    \ = price; //Line 1\n        super.displayPrice(); Line 2\n    }\n}\n```\n\nThis\
    \ code creates a class called `Electronics` which is the base class and a class\
    \ called `Camera` which is the sub class. Line 1 uses the `super` keyword to access\
    \ the `price` field in the base class `Electronics`. Line 2 uses the `super` keyword\
    \ to access the `displayPrice` method in the class `Electronics`.\n\n### 088.\
    \ The code snippet below has an error. Identity it and state the reason.\n\n```java\n\
    class Electronics {\n    public void displayPrice() {}\n}\n\nclass Camera extends\
