    275. What is the output of the following code snippet?


    Optional<Double> myDoubleOptional = Optional.of(10.0);


    Optional<Double> defaultOptional = Optional.of(50.0);


    double value = myDoubleOptional.or(()–> defaultOptional).get();


    System.out.println(value);


    Answer:


    Java 9 has added a new method on the Optional class called or(). This accepts
    as parameter a Supplier instance that produces an Optional. It returns an Optional.
    So, if the Optional on which it is invoked is a non–empty Optional, it returns
    that Optional, otherwise it returns the Optional generated by the passed Supplier.
    In the code snippet above, the or method is invoked on myDoubleOptional which
    is an Optional with the value **10**. Since this is a non–empty Optional, the
    or method returns this value and not the defaultOptional. So, this code prints
    the following output:


    10.0


    276. What changes has Java 9 made to the try–with statement?


    Answer:


    The try–with statement was added by Java 7\. It allows automatically closing resources
    without an explicit close statement. So, for example if you are writing a file
    writing code, if you use a try–with statement, the FileWriter gets closed automatically
    once the try statement completes. The downside of this was that the resource that
    needs to be automatically closed needs to be part of the try statement. So, if
    a resource is declared outside the try–with statement, it needs to be declared
    again as part of the try–with. Java 9 does away with this restriction. So, with
    Java 9, you can use a resource that is declared outside the try–with statement
    within the try–with.


    277. What is the use of the stream method added by Java 9 on the Optional class?


    Answer:


    The stream() method added by Java 9 on the Optional class can be used to convert
    an Optional into a Stream. This allows applying all the Stream operations on an
    Optional. The following code demonstrates this:


    Optional<String> str = Optional.of(“Hello”);


    Stream<String> strStream = str.stream();


    This code defines an Optional called str which has a String value **Hello**. It
    then uses the stream() method. This converts the Optional to a Stream with one
    value. So now all Stream operations like map, filter, etc. can be applied on this
    stream.


    278. Explain the ProcessHandle class and some of its important methods.


    Answer:


    Java 9 has added a new class called java.lang.ProcessHandle. This helps to manage
    processes related to the operating system and helps to interact with the operating
    system. Some of the methods on this class are as follows:


    a. current(): This is a static method that returns a ProcessHandle object corresponding
    to the current process.


    b. isAlive(): This returns a boolean value that indicates whether the process
    is alive or not.


    c. pid(): This returns the id of the process.


    d. children(): This returns a Stream of ProcessHandle objects corresponding to
    the children of the current process.


