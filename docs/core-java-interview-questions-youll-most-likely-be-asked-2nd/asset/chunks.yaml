    This is a particularly important question if you’re interviewing for a position
    in a supervisory role - explain the ways in which you would identify the problem,
    and how you would go about pulling aside the individual to discuss their contributions.
    It’s important to understand the process of creating a dialogue, so that you can
    communicate your expectations clearly to the individual, give them a chance to
    respond, and to make clear what needs to change. After this, create an action
    plan with the group member to ensure their contributions are on par with others
    in the group.


    *As an example:*


    I would say I am a good example of a “servant leader” in how I work within teams.
    I have a natural ability to lead and people naturally follow me. I am a natural
    project manager and can see the big picture as well as minute details. With that
    said, I listen to what my team says and encourage and value all of their input.
    It is all about having the ability to lead and make concise and proper decisions,
    while at the same time taking in to account the opinions and ideas of the entire
    team and allowing for improving in your decisions when need be.


    ### 297. Tell me about a time when you made a decision that was outside of your
    authority.


    **Answer:**


    While an answer to this question may portray you as being decisive and confident,
    it could also identify you to an employer as a potential problem employee. Instead,
    it may be best to slightly refocus the question into an example of a time that
    you took on additional responsibilities, and thus had to make decisions that were
    outside of your normal authority (but which had been granted to you in the specific
    instance). Discuss how the weight of the decision affected your decision-making
    process, and the outcomes of the situation.


    *As an example:*


    I had a customer call requesting to have their monthly payment that was already
    due, waived due to service they felt was subpar. The manager was the only one
    with the authority to make this decision and was out that day. The customer was
    very upset and ready to cancel services. I deferred the payment that was due that
    day and over-rode the automatic cancelation that was set to take place since the
    customer was behind on payments, and assured the manager was going to contact
    the customer the next day. When they were able to speak, the customer issue was
    resolved and they decided to continue our services.


    ### 298. Are you comfortable going to supervisors with disputes?


    **Answer:**


    If a problem arises, employers want to know that you will handle it in a timely
    and appropriate manner. Emphasize that you’ve rarely had disputes with supervisors
    in the past, but if a situation were to arise, you feel perfectly comfortable
    in discussing it with the person in question in order to find a resolution that
    is satisfactory to both parties.


    *As an example:*


    I went to my supervisor with some adjustments that needed to be made to a report
    they had me format and submit to the owner of the company. When I approached the
    supervisor about their errors they became immediately defensive in nature, until
    I assured them I just happened to notice the discrepancies in numbers and wanted
    to bring it to their attention so they could adjust it prior to it being submitted,
    so he and our department looked good. I assured him that I was looking out for
    the integrity of the work we produced and wanted to do my best to support him.
    He thanked me and the report was submitted without errors.


    ### 299. If you had been in charge at your last job, what would you have done
    differently?


    **Answer:**


    No matter how many ideas you have about how things could run better, or opinions
    on the management at your previous job, remain positive when answering this question.
    It’s okay to show thoughtful reflection on how something could be handled in order
    to increase efficiency or improve sales but be sure to keep all of your suggestions
    focused on making things better, rather than talking about ways to eliminate waste
    or negativity.


    *As an example:*


    I would have focused on more cross training of the department staff so we would
    have been able to better assist each other during our own downtime, or in times
    of an influx of workload or emergency situations in a team member’s role or position.
    This would have helped minimize confusion and back log, allowing for the entire
    department to be more up to speed and efficient.


    ### 300. Do you believe employers should praise or reward employees for a job
    well done?


    **Answer:**


    Recognition is always great after completing a difficult job, but there are many
    employers who may ask this question as a way to infer as to whether or not you’ll
    be a high-maintenance worker. While you may appreciate rewards or praise, it’s
    important to convey to the interviewer that you don’t require accolades to be
    confident that you’ve done your job well. If you are interviewing for a supervisory
    position where you would be the one praising other employees, highlight the importance
    of praise in boosting team morale.


    *As an example:*


    I believe that each employee is different in the way they respond to praise and
    rewards and if they even desire it. Some may desire it greatly and work toward
    praise, and some don’t like being in the spotlight. It is important to make sure
    employees are aware they are hired to do a job and are expected to complete their
    tasks. With that said, employees are human, and have stressful days, outside lives,
    and at times even just showing up to work and working hard deserves praise in
    itself. It is important to let employees know they are valued as humans supporting
    the organization and not just an employee number. Quarterly free employee luncheons
    for all staff with music and food, and recognition of someone who may have gone
    above and beyond in an extraordinary circumstance is a great way to keep morale
    and comradery up.


    ### 301. What do you believe is the most important quality a leader can have?


    **Answer:**


    There are many important skills for a leader to have in any business, and the
    most important component of this question is that you explain why the quality
    you choose to highlight is important. Try to choose a quality such as communication
    skills, or an ability to inspire people, and relate it to a specific instance
    in which you displayed the quality among a team of people.


    *As an example:*


    Communication is key in leadership. Having the ability to take in consideration
    all aspects and every scenario before making a decision, but being able to be
    the one to ultimately make the decision whether it is going to be popular or not,
    is something a leader needs to be able to do. The important part is being able
    to really listen to your employees and hear their concerns out, letting them know
    you value their opinion, then explain to them why you made the decision that you
    did. Most times employees just want to feel heard. Having open lines of communication
    at all times is essential for maintaining trust amongst the staff. I made the
    decision to adjust our vacation request policy to reflect employees need to request
    vacation at least two weeks prior to their time off, which was met with much dismay.
    Once I explained the decision was based upon having overlapping days off, inadequate
    staffing, unfairness amongst coworkers, and loss of profits and it was going to
    be better for the company and the employees, they understood.


    ### 302. Tell me about a time when an unforeseen problem arose. How did you handle
    it?


    **Answer:**


    It’s important that you are resourceful, and level-headed under pressure. An interviewer
    wants to see that you handle problems systematically, and that you can deal with
    change in an orderly process. Outline the situation clearly, including all solutions
    and results of the process you implemented.


    *As an example:*

