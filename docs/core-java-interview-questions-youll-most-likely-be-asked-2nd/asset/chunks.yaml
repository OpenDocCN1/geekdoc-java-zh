    The above code will cause a compilation error at line 2\. Line 2 assigns an int
    value to a byte variable and produces an int result. So, when the int value is
    assigned to the byte variable bValue, it causes a compilation error. This code
    can be fixed by specifying an explicit cast as follows:


    bValue = (byte) (bValue + 10);


