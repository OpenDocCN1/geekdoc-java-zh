    # [CHAPTER 06](#toc.xhtml_ss026a)


    # [Static and Default Interface Methods](#toc.xhtml_ss026a)


    242. What are static and default methods? Why were they introduced by Java 8?


    Answer:


    Before Java 8, interfaces could only have abstract methods. So, they could not
    have methods with method bodies. Java 8 allows interfaces to have methods with
    method bodies as static and default methods. These were added for the following
    reasons:


    • Default interface methods help to keep code backward compatible. Prior to Java
    8, if a new method was added to an interface, all the classes that implement the
    interface needed to be modified. Default methods overcome this restriction. So,
    they allow you to add a method with a method body in the interface. So, all implementing
    classes do not need to be modified.


    • Static interface methods help to group together utility methods. Static interface
    methods cannot be overridden in the classes that implement the method. So, this
    avoids unwanted results due of incorrect implementation and provides an additional
    level of security.


    243. What is the difference between an abstract class and an interface after Java
    8?


    Answer:


    The addition of Java 8 default interface methods has reduced the distinction between
    abstract classes and interfaces. Prior to Java 8, interfaces could not have concrete
    methods. However, Java 8 has added default and static methods in interfaces. These
    are methods that have a method body. This has further reduced the distinction
    between abstract classes and interfaces. However, there are there some differences
    between the two.These are as follows:


    • Abstract classes can have instance fields. Interfaces on the other hand cannot
    have instance fields. So basically, an abstract class can have a state via an
    instance field, whereas an interface cannot have state.


    • Abstract class can have a constructor and can be instantiated. Interface on
    the other hand cannot have a constructor.


    244. Write a code sample that demonstrates a default method.


    Answer:


    A default method is simply a method with a method body within an interface. It
    has the default keyword. The following code demonstrates this:


    public interface MyInterface {


    public void doSomething();


    public default void doSomethingElse() {


    System.out.println(“Doing something else....”);


    }


    }


    This code has declared an interface called MyInterface. It has an abstract method
    called doSomething() and a default method called doSomethingElse(). The default
    method has the **default** keyword specified. It has a method body.


    245. What is the difference between a static and a default interface method?


    Answer:


    Both static and default interface methods have a method body. However, there are
    some differences between the two:


    • A static method has the static keyword specified, while a default method has
    the default keyword specified.


    • Default interface methods can be overridden. Static methods on the other hand
    cannot be overridden.


    • Default methods can be invoked via an object of the class that implements the
    interface. Static interface methods on the other hand cannot be invoked via the
    class or object of the class that implements the interface. They need to be invoked
    via the interface name.


