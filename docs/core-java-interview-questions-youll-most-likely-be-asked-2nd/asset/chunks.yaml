  trans: "\n\n该方法的实现。子类将无法为抽象私方法提供实现。\n\n# 第 10 章\n\n# 包与访问控制\n\n### 111. 什么是包（package）？包的优点是什么？\n\
    \n答案：\n\n包是相关 Java 类型的集合。因此，一个包可以包含相关的类、接口和枚举。使用包有以下几个优点：\n\n• 包有助于将相关的代码组织在一起。\n\
    • 包有助于避免命名命名冲突。因此，你可以在不同的包中拥有相同名称的类或其他 Java 类型。\n• 包还帮助控制访问权限。除非通过 `public` 关键字显式允许，否则包外部的代码无法访问包内部的代码。\n\
    \n### 112. 解释 Java 访问修饰符（access specifiers）。\n\n答案：\n\n访问修饰符控制特定成员在何处可以被访问。它们是指定在类成员上的关键字。它们既可以指定给实例字段，也可以指定给方法。Java\
    \ 有 4 种访问修饰符：\n\na. `Private`（私有）：具有 `private` 修饰符的成员只能在声明它的类内部被访问。\nb. `Protected`（受保护）：具有\
    \ `protected` 修饰符的成员可以被包内的所有类以及包外部的子类访问。\nc. `Public`（公共）：具有 `public` 修饰符的成员可以被包外部的所有类访问。\n\
    d. `Default`（默认）：当没有指定上述任何访问修饰符时，会发生默认访问。在这种情况下，该成员在包内可以访问，但在包外无法被访问。\n\n### 113.\
    \ 用代码示例解释如何创建一个包。\n\n答案：\n\n你可以使用 `package` 关键字创建一个包。其后应该跟随你想要给包命名的名称。包名应该是有效的\
    \ Java 标识符。包语句应该是 Java 文件中的第一条语句。以下代码演示了这一点：\n\n```java\npackage demo;\n\npublic\
    \ class MyClass {\n    //instance fields and methods\n}\n```\n\n这段代码声明了一个名为 `MyClass`\
    \ 的类。它位于名为 `demo` 的包中。注意包语句是代码的第一条语句。\n\n### 114. 列出 JDK 中的一些默认包并简要解释它们的作用。\n\n\
    答案：\n\n以下是 Java 中的一些默认包：\n\na. `java.util.Collection`：此包包含了所有的 Collection API\
    \ 类。因此，`List`、`ArrayList`、`Set`、`HashSet`、`Map`、`HashMap` 等类/接口都是该包的一部分。此外，它还有处理日期的\
    \ `Date` 和 `Calendar` 类。\nb. `java.io`：此包包含帮助执行输入输出操作的类，如 `InputStream`、`FileInputStream`、`FileOutputStream`、`BufferedReader`、`BufferedWriter`\
    \ 等。\nc. `java.awt`:此包包含所有创建用户界面的类，如 `Component`、`Container`、`Frame` 等。\nd. `java.util.concurrent`：此包包含所有用于并发编程的类，如\
    \ `Future`、`Executor`、`ExecutorService` 等。\n\n### 115. 以下代码有效吗？解释原因。\n\n```java\n\
    package demo1;\n\npublic class Base {\n    protected int a;\n}\n\npackage demo2;\n\
    \npublic class Sub extends Base {\n    public void doSomething() {\n        System.out.println(“Value\
    \ of a is “+a);\n    }\n}\n```\n\n答案：\n\n上述代码是有效的，不会引起任何编译或运行时错误。这段代码创建了一个名为 `Base`\
    \ 的父类和一个名为 `Sub` 的子类。这两个类位于不同的包中。`Base` 类有一个 `protected` 字段 `a`，该字段在子类的 `doSomething()`\
    \ 方法被访问。这是完全有效的。只有基类的私有字段在子类中不可访问。具有 `protected` 修饰符的字段即使子类在不同的包中，也可以在子类中被访问。\n\
    \n### 116. 解释 import 关键字。\n\n答案：\n\n`import` 关键字用于在代码中引入其他包。你可以导入标准的 Java 包（如\
    \ `java.util` 等），也可以导入用户定义的包。\n\n`import` 关键字后需要跟随包名。若要从包中导入特定类，你还需要指定类名。若要导入整个包，你需要在包名后使用通配符（`*`）。以下是\
    \ import 的示例：\n`import java.util.List;`\n`import java.io.*;`\n\n### 117. 解释 protected\
    \ 和 default 修饰符之间的区别。\n\n答案：\n\n`protected` 和 `default` 修饰符之间有几点区别：\n\n• `protected`\
    \ 访问修饰符允许访问包所有类以及包外部的子类。\n• `default` 访问发生在未指定上述任何访问修饰符时。它只在包内可访问，如果子类在不同的包中，则无法被访问。\n\
    \n### 118. 以下代码有效吗？解释。\n\n```java\npackage demo1;\n\npublic class MyClass1 {\n\
    \    int a; //Line 1\n}\n\npackage demo2;\n\npublic class MyClass2 {\n    public\
    \ void doSomething() {\n        MyClass1 obj = new MyClass1(); //Line 2\n    \
    \    obj.a = 5; //Line 3\n    }\n}\n```\n\n答案：\n\n上述代码无效，并会在第 3 行引起编译错误。`MyClass1`\
    \ 类位于 `demo1` 包中，并有一个具有默认访问权限的字段 `a`。由于默认访问权限在包外不可，`MyClass2` 无法访问它。\n\n### 119.\
    \ 解释当编译并执行以下代码时会发生什么：\n\n```java\npackage com.questions;\n\npublic class CoreJava\
    \ {\n    private String getQuestion() {\n        return “Question1”;\n    }\n\
    }\n\npackage com.questions;\n\nclass JSP extends CoreJava {\n    public void getSPQuestion()\
    \ {\n        System.out.println(getQuestion());\n    }\n}\n```\n\n答案：\n\n上述代码将无法编译。`CoreJava`\
    \ 类定义了一个私有方法 `getQuestion()`。子类中的 `getSPQuestion()` 方法调用了这个私有的父类方法。由于私有方法无法被访问，因此会导致编译错误。\n\
    \n### 120. 解释 java.lang 包。\n\n答案：\n\n`java.lang` 包包含了对 Java 编程语言重要的类。它包含了包装类，如\
    \ `Byte`、`Boolean`、`Integer`、`Double` 等。它包含用于字符串操作的 `String`、`StringBuffer` 和\
    \ `StringBuilder`。它包含用于创建多线程程序的 `Thread` 和 `Runnable`。它包含 `Throwable` 和其他 `Exception`\
    \ 类，用于 Java 的异常处理功能。\n\n# 第 11 章\n\n# 异常处理\n\n### 121. 解释 Java 中的 ‘throw’、‘throws’\
    \ 和 ‘Throwable’。\n\n答案：\n\n`throws` 关键字用于指定特定方法抛出一个未处理的异常或需要单独处理的多个异常。它基本上指定你不想在方法内部处理错误条件，而是希望将异常处理交给代码的其他部分。\n\
    \n`throw` 关键字用于在方法内部显式地抛出异常。\n\n`Throwable` 是异常层次结构基类。可以通过扩展 `Throwable` 类来创建自定义异常。\n\
    \n### 122. 当编译并执行以下代码时，输出是什么？\n\n```java\nclass Test {\n    try {\n        System.out.println(“This\
    \ is try block”);\n    }\n    System.out.println(“Try block is executed”); //Line\
    \ 1\n    catch(Exception exp) {\n        System.out.println(“This is catch block”);\n\
    \    }\n}\n```\n\n答案：\n\n该代码会导致编译错误，因为不能在 `try` 块和它的 `catch` 块之间放置代码。\n\n"
- fmt: "\nThe above code will not compile and will throw a compilation error. This\
    \ is because the code at Line 1 is written after the end of `try` block but before\
    \ the `catch` block. All the code needs to be written either inside the `try`\
    \ block or the `catch` block. Java does not allow code in between the `try` and\
    \ `catch` blocks.\n\n### 123. Write a code sample that demonstrates the try/catch/finally\
    \ block.\n\n**Answer:**\n\nFollowing is a code sample that demonstrates the `try/catch/finally`\
    \ block:\n\n```java\ntry {\n    System.out.println(“This is try block”);\n} catch\
    \ {\n    System.out.println(“This is catch block”);\n} finally {\n    System.out.println(“This\
    \ is finally block”);\n}\n```\n\nAll the code that needs to be monitored for exceptions\
    \ should be placed within the `try` block. Immediately following the `try` block,\
    \ you need to specify a `catch` clause. In the `catch` block, you need to specify\
    \ the exception type that you wish to catch and the code that you want to be executed\
    \ when that exception occurs. The `finally` clause is optional and it needs to\
    \ be placed either after the `try` or `catch` block. Any code that needs to be\
    \ executed always irrespective of whether an exception occurs or not should be\
    \ placed in the `finally` clause.\n\n### 124. What will be the output on executing\
    \ the code below?\n\n```java\nclass ExceptionTest {\n    public static void main(String\
    \ argument[]) {\n        callMethod();\n    }\n    static void callMethod() {\n\
    \        int intValue = 100 / 0;\n        System.out.println(“intValue is: ”+intValue);\n\
    \    }\n}\n```\n\n**Answer:**\n\nThe above code gets compiled without any errors.\
    \ However, on executing it throws an `ArithmeticException` with a stack trace\
    \ (Error information or report) as shown below:\n\n```\nException in thread “main”\
    \ java.lang.Arithmetic Exception– / by zero\nat ExceptionTest.callMethod(ExceptionTest.java:12)\n\
    at ExceptionTest.main(ExceptionTest.java–9)\n```\n\nThis is because dividing a\
    \ number by 0 is not allowed.\n\n### 125. Explain the try–catch–finally statement\
    \ in Java.\n\n**Answer:**\n\nThe `Try–Catch–Finally` statement allows exception\
    \ handling in Java. You can put the statements that you would like to monitor\
    \ for errors within the `try` block. The code that needs to be executed in case\
    \ of an exception occurs should be placed within the `catch` block. You also need\
    \ to specify the type of exception that you wish to catch. You can specify multiple\
    \ `catch` blocks for different types of exceptions. Following the `catch` block,\
    \ you can specify the `finally` block. Here, you need to put in code that you\
    \ need to be executed irrespective of whether an exception is thrown or not. The\
    \ `catch` and `finally` blocks are optional, but you need to have either one of\
    \ them.\n\nThe following code demonstrates the `try–catch–finally` statement:\n\
    \n```java\ntry {\n    // Code to be monitored for exceptions\n} catch (ExceptionType\
    \ 1) {\n    // Instructions to follow if an exception occurs\n} catch (ExceptionType\
    \ 2) {\n    // Instructions to follow if an exception occurs\n} catch (ExceptionType\
    \ n) {\n    // Instructions to follow if an exception occurs\n} finally {\n  \
    \  // this block is definitely executed even if an exception is thrown or not\n\
    }\n```\n\n### 126. What will be the output of the following code snippet?\n\n\
    ```java\npublic class MyClass1 {\n    public static void main(String abc[]) {\n\
    \        try {\n            int no;\n            no = 52 / 0; //Line 1\n     \
    \   } catch (ArithmeticException e) { //Line 2\n            System.out.println(“ArithmeticException”);\n\
    \        } catch (ArrayIndexOutOfBoundsException e) { //Line 3\n            System.out.println(“Array\
    \ Out Of Bound”);\n        } catch (Exception e) { // any other exception //Lin2\
    \ 4\n            System.out.println(“Sorry Unhandled Exception”);\n        } finally\
    \ { // this will be executed //Line 5\n            System.out.println(“I am done!”);\n\
    \        }\n        System.out.println(“Thank You!!”); //Line 6\n    }\n}\n```\n\
    \n**Answer:**\n\nThis code prints the following output:\n\n```\nArithmeticException\n\
    I am done!\nThank You!!\n```\n\nLine 1 causes an `ArithmeticException`. This is\
    \ caught by the `ArithmeticException` catch block at Line 2 which prints the text\
    \ `ArithmeticException`. Since `finally` block is always executed, irrespective\
    \ of whether an error occurs or not, the control then transfers to the `finally`\
    \ block at Line 5 and prints `I am done`. Next, control transfers outside the\
    \ `finally` block to Line 6 and the code prints `Thank You!!`.\n\n### 127. Suppose\
    \ you have a method called `myMethod` with some code that can throw a checked\
    \ Exception. How will you handle this in the code?\n\n**Answer:**\n\nIf a method\
    \ throws a checked exception, there are two ways that it can be handled?\n\na.\
    \ Use `try/catch` within the method body as follows:\n\n```java\npublic void myMethod(){\n\
    \    try {\n        //code here\n    } catch (CheckedException e) {\n    }\n}\n\
    ```\n\nHere, when the code throws a `CheckedException`, it is caught by the `catch`\
    \ block within the method.\n\nb. Use `throws` clause with the method declaration:\n\
    \n```java\npublic void myMethod () throws CheckedException{\n    //code here\n\
    }\n```\n\nHere, when the code throws a `CheckedException`, it is thrown outside\
    \ the method by the `throws` clause. So, the code that invokes this method needs\
    \ to handle the exception.\n\n### 128. What is the use of “finally” clause? Give\
    \ an example.\n\n**Answer:**\n\nAny code that needs to be always executed irrespective\
    \ of whether an exception occurs or not, should be placed within the `finally`\
    \ clause. So, for example clean–up code like closing database connections or files\
    \ on the file system or other resources can be placed in the `finally` clause.\
    \ If such code is placed in the `try` block, there is a possibility that it may\
    \ not execute if an exception occurs. So, to ensure that such code is executed,\
    \ it needs to be in the `finally` block.\n\n### 129. Explain the differences between\
    \ Error and Exception.\n\n**Answer:**\n\n`java.Throwable` is the superclass of\
    \ all exception classes. It has two sub–classes, `Exception` and `Error`. There\
    \ are several differences between the two:\n\n- `Exception` represents programmatic\
    \ errors that are caused by the application itself like accessing a null value,\
    \ dividing by 0, error while writing to a file, etc. `Error` represents errors\
    \ that occur outside your code within the runtime environment like running out\
    \ of memory, etc.\n- `Exception` are conditions that an application can handle\
    \ and recover from. `Error` on the other hand are abnormal conditions that an\
    \ application cannot recover from.\n- `Exception` are both checked as well as\
    \ unchecked. Checked exceptions need to be handled or specified within the `throws`\
    \ clause in the method declaration. Errors are always unchecked and need not be\
    \ declared.\n\n### 130. What is RuntimeException?\n\n**Answer:**\n\n`java.lang.RuntimeException`\
    \ is a sub–class of the `java.lang.Exception` class. The `RuntimeException` and\
    \ its sub–classes are also known as unchecked exceptions. This is because the\
    \ compiler does not force you to handle such exceptions. So even if code that\
    \ might throw an unchecked exception is written, the compiler does not cause an\
    \ error. Some examples of `RuntimeException` are `ArithmeticException`, `NullPointerException`,\
    \ `ArrayIndexOutOfBoundsException`.\n"
