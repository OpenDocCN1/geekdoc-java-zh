    c. `sleep()`：使运行的线程暂停指定的时间\nd. `setName()`：将线程名称设置为指定的值\ne. `join()`：等待线程死亡，最多等待指定的时间\n\
    f. `isAlive()`：返回一个布尔值，指示当前线程是否存活\ng. `setPriority()`：将线程优先级更改为指定的值\n\n### 167.\
    \ 解释线程状态。\n\n答案：\n\n线程存在五种状态。它们如下：\n\na. **New（新建状态）**：当创建了一个新的 Thread 但没有调用 start\
    \ 方法时，线程处于新状态。\nb. **Runnable（可运行状态）**：在调用 start() 方法后，但线程调度器尚未开始执行该线程，线程处于 Runnable\
    \ 状态。\nc. **Running（运行状态）**：当线程调度器开始执行该线程时，它处于 Running 状态。run() 方法中的代码开始执行。\n\
    d. **Waiting / Blocking（等待/阻塞状态）**：如果一个线程存活但不符合运行条件，则称其处于阻塞状态。\ne. **Dead（死亡状态）**：当线程完成执行时，它进入死亡状态。\n\
    \n### 168. 写一个使用“Thread”类创建线程的代码示例。\n\n答案：\n\n以下代码使用“Thread”类创建一个线程：\n\n```\n\
    class MyThread extends Thread {\n    public static void main(String argument[])\
    \ {\n        MyThread thread = new MyThread();\n        thread.start(); // 第 1\
    \ 行\n    }\n    public void run() {\n        System.out.println(“In Thread Body..”);\n\
    \    }\n}\n```\n\n上述代码定义了一个继承 Thread 类的 MyThread。当执行第 1 行时，产生了一个新线程。这执行了 `run()`\
    \ 方法中的代码。\n\n### 169. 写一个使用 Runnable 接口创建线程的代码示例。\n\n答案：\n\n以下代码通过实现接口接口创建一个线程：\n\
    \n```\nclass MyThread implements Runnable {\n    public static void main(String\
    \ argument[]) {\n        MyThread myThread = new MyThread();\n        Thread thread\
    \ = new Thread(myThread); //第 1 行\n        thread.start(); // 第 2 行\n    }\n \
    \   public void run() {\n        System.out.println(“In Thread Body..”);\n   \
    \ }\n}\n```\n\n上述代码定义了一个实现 Runnable 接口的 MyThread 类。在第 1 行创建一个 Thread 对象，并将 Runnable\
    \ 实现实例 myThread 传递给它。当执行第 2 行时，产生了一个新线程。这执行了 `run()` 方法中的代码。\n\n### 170. 在 Java\
    \ 应用中可以创建多个线程吗？如果是，线程之间如何通信？\n\n答案：\n\n是的，在 Java 应用中可以创建多个线程。为了让两个线程相互通信，需要使用来自\
    \ `object` 类的 `wait()`、`notify()` 和 `notifyAll()` 方法。\n\n`wait()` 方法导致当前线程暂停，直到其他线程在同一个对象上调用\
    \ `notify()`。\n\n如果有许多对象在等待某个特定对象，`notify()` 方法会导致其中一个线程恢复执行。\n\n`notifyAll()`\
    \ 方法会导致所有等待该特定对象的线程恢复执行。\n\n### 171. 什么是同步（Synchronization）？\n\n答案：\n"
- fmt: "\nWhen multiple threads try to access a shared resource at the same time,\
    \ then they need some way for the resource to be accessed by only one Thread at\
    \ a time. The process which helps to achieve this is called as synchronization.\
    \ Java provides a keyword called `synchronized` which helps to achieve this.\n\
    \n### 172. Explain what happens when the following code is executed.\n\n```java\n\
    class TestMyRunnable implements Runnable {\n    public void run() {\n        System.out.println(“Inside\
    \ Run Method..”);\n        System.out.println(“Name of thread is– “:Thread.currentThread().getName());\n\
    \    }\n}\n\nclass TestMyThread {\n    public static void main(String argument[])\
    \ {\n        TestMyRunnable runnable = new TestMyRunnable();\n        Thread thread\
    \ = new Thread(runnable);\n        Thread.setName(“My Thread”); //Line 1\n   \
    \     thread.start(); //Line 2\n    }\n}\n```\n\nAnswer:\n\nThe code compiles\
    \ fine and displays the following output:\n\n```\nInside Run Method.\nName of\
    \ thread is: My Thread\n```\n\nWhen `Line 1` is executed, it sets the name of\
    \ the thread to `My Thread`. So, when `Line 2` is executed, it spawns a new thread\
    \ and executes the code within the `run()` method which prints the name of the\
    \ thread as `My Thread`.\n\n### 173. Consider the following code:\n\n```java\n\
    class TestMyRunnable implements Runnable {\n    public void run() {\n        for\
    \ (int iValue = 0; iValue < 1000; iValue++)\n            System.out.println(“Name\
    \ of thread is: “+Thread.currentThread().getName());\n    }\n\n    public static\
    \ void main (String argument[]) {\n        TestMyRunnable runnable = new TestMyRunnable();\n\
    \        Thread threadC = new Thread(runnable);\n        Thread threadD = new\
    \ Thread(runnable);\n        threadC.setName(“Thread 1”);\n        threadD.setName(“Thread\
    \ 2”);\n        threadC.start();\n        threadD.start();\n    }\n}\n```\n\n\
    **Executing this code first prints “Thread 1” 1000 times and then prints the “Thread\
    \ 2” 1000 times. If this is incorrect, explain the reasons.**\n\nAnswer:\n\nOn\
    \ executing the above code, it will not print `Thread 1` 1000 times and then `Thread\
    \ 2` 1000 times. The order in which the threads execute is up to the `Thread`\
    \ scheduler. So though both threads print their names 1000 times, the order in\
    \ which they print it is not known.\n\n### 174. Write a code sample that makes\
    \ a thread pause for ten minutes.\n\nAnswer:\n\nIn order to make a thread pause\
    \ for ten minutes, you need to invoke the `sleep()` method within the `run()`\
    \ method. The `sleep()` method accepts as parameter a long value which accepts\
    \ the time that the thread should sleep in milliseconds. The following code demonstrates\
    \ this:\n\n```java\ntry {\n    Thread.sleep(10 * 60 * 1000)\n}\ncatch(InterruptedException\
    \ exp) {\n}\n```\n\n### 175. What happens when a synchronized method is invoked?\n\
    \nAnswer:\n\nWhenever a `synchronized` method is executed, the thread that invokes\
    \ the method acquires a lock and holds the lock under the end of the method. Only\
    \ after the current thread completes executing the method it releases the lock.\
    \ So other threads can then acquire the lock and execute the method. Thus, the\
    \ `synchronized` keyword prevents multiple threads from simultaneously executing\
    \ the code within the `synchronized` method.\n\n# CHAPTER 17\n\n# Java IO API\n\
    \n### 176. What happens when the following code is executed?\n\n```java\nFile\
    \ myFile = new File(“CoreJava.txt”);\n```\n\nAnswer:\n\nWhen the code above is\
    \ executed, the JVM creates a Java object called `myFile` in the memory but the\
    \ actual file will not be created on the file system. In order to actually create\
    \ the file, the `myFile.createNewFile()` method needs to be invoked.\n\n### 177.\
    \ Write a code sample that creates a file in the path /usr/test.txt.\n\nAnswer:\n\
    \nThe following code will create a file `test.txt` within the `/usr/` directory:\n\
    \n```java\ntry {\n    File txtFile = new File(“/usr/test.txt”); // Line 1\n  \
    \  txtFile.createNewFile(); // Line 2\n} catch (IOException exp) {\n}\n```\n\n\
    In the above code, when `Line 1` is executed, an object `txtFile` is created in\
    \ memory and when `Line 2` is executed, the file `test.txt` is created inside\
    \ the folder `/usr/`.\n\n### 178. Explain the FileWriter class with a code sample.\n\
    \nAnswer:\n\n`FileWriter` class is used to write characters or Strings to a file\
    \ without having to convert them to a byte array.\n\nThey are usually wrapped\
    \ within `PrintWriter` or `BufferedWriter` which provides performance improvement\
    \ and more methods for writing data. The following code demonstrates a `FileWriter`:\n\
    \n```java\ntry {\n    File txtFile = new File(“/usr/CoreJava.txt”);\n    FileWriter\
    \ myFileWriter = new FileWriter(txtFile);\n    myFileWriter.write(“Line 1 \\n\
    \ Line 2 \\n”); // Line 1\n    myFileWriter.flush();\n    myFileWriter.close();\n\
    } catch (IOException exp) {\n}\n```\n\nIn the above code, when `Line 1` is executed,\
    \ the `write()` method writes the content into the file `CoreJava.txt`.\n\n###\
    \ 179. Write a code snippet that reads the content in the file /usr/CoreJava.txt\
    \ using a FileReader and displays the output in the console.\n\nAnswer:\n\nThe\
    \ following code demonstrates reading the content in the specified file using\
    \ a `FileReader` and displaying the output on the console:\n\n```java\ntry {\n\
    \    File txtFile = new File(“F:/CoreJava.txt”);\n    char [] totalChar = new\
    \ char[10];\n    FileReader myFileReader = new FileReader(txtFile);\n    // ...\
    \ logic to read and print\n} catch (IOException exp) {\n}\n```\n*(Note: The source\
    \ text provided was incomplete for this section, the structure is maintained based\
    \ on instructions).*\n\n### 180. Explain the FileWriter class with a code sample\
    \ how you can create a directory.\n\nAnswer:\n\nThere is a method `mkdir()` on\
    \ `File` class that creates a directory. The following code uses this method to\
    \ create a directory:\n\n```java\nFile myDirectory = new File(“/usr/dir”); //1\n\
    myDirectory.mkdir(); //2\n```\n\n`Line 1` creates a file object. `Line 2` invokes\
    \ the `mkdir()` method to create the directory.\n\n### 181. Explain what happens\
    \ when the following code is executed.\n\n```java\nFile myDirectory = new File(“/usr/JavaCodes”);\n\
    File myNewFile = new File(“/usr/JavaCodes/CoreJava.txt”); //line 1\nmyNewFile.createNewFile();\n\
    ```\n\nAnswer:\n\nThe above code throws an `IOException`. This is because the\
    \ directory `/usr/JavaCodes/` is not created, only a file object `myDirectory`\
    \ corresponding to it is created. In order the code to work, you need to add the\
    \ following line of code before `Line 1`:\n\n```java\nmyDirectory.mkdir();\n```\n\
    \n### 182. Write a code sample that demonstrates the PrintWriter class.\n\nAnswer:\n\
    \nThe `PrintWriter` specialization of `Writer` class can be used to write formatted\
    \ representations of objects. The following code demonstrates how `PrintWriter`\
    \ can be used to write a String:\n\n```java\nFile myNewFile = new File(“/usr/CoreJava.txt”);\n\
    PrintWriter myPrintWriter = new PrintWriter(myNewFile); //Line 1\nmyPrintWriter.println(“This\
    \ gets inserted into the File”); //Line 2\nmyPrintWriter.close(); //Line 3\n```\n\
    \nIn the above code, when `Line 1` is executed, the file `CoreJava.txt` is created\
    \ inside the folder `/usr/`. When `Line 2` is executed, the `println()` method\
    \ writes the String specified in the file `CoreJava.txt` and terminates the line.\
    \ When `Line 3` is executed, the file is closed and the contents are saved in\
    \ the file.\n\n### 183. Write a code sample that demonstrates how to delete a\
    \ file.\n\nAnswer:\n\nThe `file` class has a method called `delete()` that can\
    \ be used to delete a file. The following code demonstrates this:\n\n```java\n\
    File myNewFile = new File(“/usr/CoreJava.txt”);\nboolean success = myNewFile.delete();\
    \ //Line 1\n```\n\nIn the above code, when `Line 1` is executed, the `delete()`\
    \ method deletes the specified file. It returns a boolean value that indicates\
    \ whether file deletion is successful or not.\n\n### 184. Write a code sample\
    \ that demonstrates how to rename a file or directory.\n\nAnswer:\n\nThe `file`\
    \ class has a method called `renameTo()` which can be used to rename a file or\
    \ a directory. The following code demonstrates renaming a file:\n\n```java\nFile\
    \ file1 = new File(“/usr/file1.txt”);\nfile1.createNewFile();\n\nFile file2 =\
    \ new File(“/usr/file2.txt”);\nfile1.renameTo(file2); //Line 1\n```\n"
