- fmt: "\n## Handling Teamwork Challenges\n\nWhen someone I work with is not pulling\
    \ their weight, it can be stressful if it ends up affecting my job negatively.\
    \ During these times I remain calm and talk it out with the team. I offer assistance\
    \ when I can and work on ways to better the situation. I do my best to maintain\
    \ a positive and pleasant attitude, since acting out negatively will do nothing\
    \ but make the situation worse. \n\nI was working on a project with three coworkers.\
    \ We each had specific tasks that all tied into each other’s tasks. If one of\
    \ us fell behind, we all fell behind. One co-worker was consistently behind the\
    \ rest of us and the entire project was falling behind. I pulled the coworker\
    \ aside and asked them if they needed assistance and explained to them that their\
    \ lackof promptness was making the rest of us fall behind. I had the conversation\
    \ in a very non-accusatory manner and kept things light. I offered helpful suggestions\
    \ on ways they can improve their timeliness and then suggested we have daily morning\
    \ meetings as a team to see where each of us was at. This allowed for more transparency\
    \ amongst the team and opened a door for conversations on ways for that coworker\
    \ to improve, which ended up helping us complete the project on time.\n\n## 327.\
    \ How do you outwardly respond to stress in the workplace? How do you calm yourself\
    \ down when you are feeling stressed?\n\n**Answer:**\n\nThis is a trick question\
    \ - your interviewer wants to hear that you don’t look any different when you’re\
    \ stressed, and that you don’t allow negative emotions to interfere with your\
    \ productivity. As far as how you solve your stress, it’s best if you have a simple\
    \ solution mastered, such as simply taking deep breaths and counting to 10 to\
    \ bring yourself back to the task at hand.\n\n*As an example:*\n\nWhen I begin\
    \ to feel stressed about a situation at work, I sometimes tend to get very quiet\
    \ and take too long to think of the right response I want to give or message I\
    \ want to relay to the team. In these instances, I know that it is important to\
    \ let the team know that while I am feeling a little stressed at the moment, I\
    \ willbe ok and am just thinking of the proper way to handle the situation. I\
    \ make sure to take a deep breath, maintain composure, smile and say I am going\
    \ to take a quick break. I remove myself from the situation and step outside,\
    \ or even sit for a moment in the breakroom and read a book. If staff ask me what\
    \ I am doing I just simply tell them lightheartedly I needed a moment to think\
    \ of how I am going to awesomely respond to the situation, or if it is a more\
    \ serious topic or situation I may say I just needed a moment to recharge. Then\
    \ I regroup and rejoin my team.\n\n## 328. Are you good at multi-tasking? Give\
    \ some examples of how you successfully multi-tastk?\n\n**Answer:**\n\nSome people\
    \ can, and some people can’t. The most important part of multi-tasking is to keep\
    \ a clear head at all times about what needs to be done, and what priority each\
    \ task falls under. Explain how you evaluate tasks to determine priority, and\
    \ how you manage your time in order to ensure that all are completed efficiently.\n\
    \n*As an example:*\n\nI am a good multi-tasker because I am able to respond to\
    \ changes quickly. I keep running lists of what I am working on so if I have interruptions\
    \ or urgent projects that take me away from my existing tasks, I am able to quickly\
    \ go back to what I was working on.\n\n## 329. How many hours per week do you\
    \ work?\n\n**Answer:**\n\nMany people get tricked by this question, thinking that\
    \ answering more hours is better - however, this may cause an employer to wonder\
    \ why you have to work so many hours in order to get the work done that other\
    \ people can do in a shorter amount of time. Give a fair estimate of hours that\
    \ it should take you to complete a job and explain that you are also willing to\
    \ work extra whenever needed.\n\n*As an example:*\n\nIf I am working a full time\
    \ forty-hour work week job, then that is what I work. Lets be honest we are human…\
    \ so there have been times where I was not feeling well so I was slow, or having\
    \ some off weeks where I may have only worked thirty eight hours or so, however,\
    \ I did not miss any deadlines and as soon as I was feeling better I was back\
    \ at my usual work speed and productivity hours. On the other hand, if I feel\
    \ I need to work any overtime I will only do so if I have permission from the\
    \ supervisor first. There was one instance when I had an emergency arise and it\
    \ was time for me to leave, however if I left, then it would have made things\
    \ worse for the company and the client, so I did stay an extra thirty minutes\
    \ to complete the task, however I immediately called my supervisor of the issue\
    \ and why I stayed, so they were aware.\n\n## 330. How many times per day do you\
    \ check your email?\n\n**Answer:**\n\nWhile an employer wants to see that you\
    \ are plugged into modern technology, it is also important that the number of\
    \ times you check your email per day is relatively low - perhaps two to three\
    \ times per day (dependent on the specific field you’re in). Checking email is\
    \ often a great distraction in the workplace, and while it is important to remain\
    \ connected, much correspondence can simply be handled together in the morning\
    \ and afternoon.\n\n*As an example:*\n\nI check my e-mail about three or four\
    \ times a day. Typically, when I arrive to the office, before and after lunch,\
    \ and before I leave for the day. There may be instances when things are slow\
    \ in the office and I check less, or there may be times when I am waiting on an\
    \ e-mail containing information I need to start a certain task, or I am in communication\
    \ with a customer back and forth about an important topic, so I may check or respond\
    \ more frequently. On an average day though, no more than about four times per\
    \ day.\n\n# CHAPTER 04\n# Customer Service\n\n## 331. What is customer service?\n\
    \n**Answer:**\n\nCustomer service can be many things - and the most important\
    \ consideration in this question is that you have a creative answer. Demonstrate\
    \ your ability to think outside the box by offering a confident answer that goes\
    \ past a basic definition, and that shows you have truly considered your own view\
    \ of what it means to take care of your customers. The thoughtful consideration\
    \ you hold for customers will speak for itself.\n\n*As an example:*\n\nCustomer\
    \ Service is basically any interaction you have with other people during the course\
    \ of a work day. If you are working in customer service it’s simple– you answer\
    \ the phone, take payments, solve problems. If you work in HR, your customers\
    \ may be the employees you serve. If you work in sales, your customers may be\
    \ the people you sell to. Customer Service is show you work with others, your\
    \ attitude, and your problem-solving abilities. It is wanting to always provide\
    \ the best service possible, in any capacity you can, to whomever you encounter\
    \ while at work.\n\n## 332. Tell me about a time when you went out of your way\
    \ for a customer.\n\n**Answer:**\n\nIt’s important that you offer an example of\
    \ a time you truly went out of your way - be careful not to confuse something\
    \ that felt like a big effort on your part, with something your employer would\
    \ expect you to do anyway. Offer an example of the customer’s problems, what you\
    \ did to solve it, and the way the customer responded after you took care of the\
    \ situation.\n\n*As an example:*\n"
