    # 360. How soon would you be available to start working?


    Answer:


    While you want to be sure that you’re available to start as soon as possible if
    the company is interested in hiring you, if you still have another job, be sure
    to give them at least two weeks’ notice. Though your new employer may be anxious
    for you to start, they will want to hire a worker whom they can respect for giving
    adequate notice, so that they won’t have to worry if you’ll eventually leave them
    in the lurch.


    *As an example:*


    While I am eager and excited to begin working with you, I would prefer to give
    a two week notice to my current employer, out of respect. This will allow time
    for tying up loose ends and allow me to help them transition during and after
    my departure.


    # 361. Why would your last employer say that you left?


    Answer:


    The key to this question is that your employer’s answer must be the same as your
    own answer about why you left. For instance, if you’ve told your employer that
    you left to find a position with greater opportunities for career advancement,
    your employer had better not say that you were let go for missing too many days
    of work. Honesty is key in your job application process.


    *As an example:*


    I believe my last employer would say I left for growth opportunities. While they
    were sad to see me go, I know they were happy with the time I spent there, and
    I appreciate of the knowledge I gained while working there.


    # 362. How long have you been actively looking for a job?


    Answer:


    It’s best if you haven’t been actively looking for a job for very long, as a long
    period of time may make the interviewer wonder why no one else has hired you.
    If it has been awhile, make sure to explain why, and keep it positive. Perhaps
    you haven’t come across many opportunities that provide you with enough of a challenge
    or that are adequately matched to someone of your education and experience.


    *As an example:*


    I haven’t actually been looking for a specific amount of time. I typically only
    look at job ads if someone sends me something they feel I’d be good at or interested
    in, as I was not in a hurry to leave my last employer. I saw this job ad and was
    excited about it so applied for it. It seems like a great opportunity and I feel
    I would be a good fit. I couldn’t pass up on the opportunity to interview and
    the chance to further my career with your company.


    # 363. When don’t you show up to work?


    Answer:


    Clearly, the only time acceptable to miss work is for a real emergency or when
    you’re truly sick - so don’t start bringing up times now that you plan to miss
    work due to vacations or family birthdays. Alternatively, you can tell the interviewer
    how dedicated to your work you are, and how you always strive to be fully present
    and to put in the same amount of work every time you come in, even when you’re
    feeling slightly under the weather.


    *As an example:*


    Typically, it takes a lot for me to miss work. I will go to work if I have the
    sniffles I am not one to call in sick because I sneezed or have a slight headache.
    At the same time, I do not want to get anyone else sick so if I feel truly under
    the weather, I am sure to stay home. Additionally, of course if there were to
    be family emergency that would warrant a sick day, I would give my supervisor
    ample notice as soon as I found out the need for it. I am good at keeping my boss
    informed. I also let the boss know of any urgent tasks that may need to be addressed
    should I expect to miss an entire day so nothing falls too far behind and there
    is complete transparency.


    # 364. Have you ever been told by your supervisor to leave work for the day? If
    so, why?


    Answer:


    The response to this question will most likely be no, however, if there ever was
    an instance you were sent home for the day whether it be because you were too
    sick for work, were having a bad day or being insubordinate, try to word it in
    a way where you project you understood the reason and have since worked on improving.


    *As an example:*


    I have only been sent home once and that was when I was very sick for almost a
    week. I missed two days of work and was falling behind on my workload. I felt
    good enough to go to work on the third day and didn’t want to fall farther behind.
    I didn’t a fever and felt good enough to show up so I did, but within a couple
    of hours immediately felt drained, tired, and it was clear that I was not as well
    as I thought. The boss had asked me when I got there if I was sure I was ok to
    be at work and I said yes. A couple of hours later she ended up telling me to
    just go home since it was becoming increasingly difficult to focus with the congestion
    and weakness I was feeling. I went home and was glad I did. I slept and returned
    the next day. Nowadays I am better at being sure to take care of myself first
    and be sure I am good enough to go to work, since health comes first.


    # 365. What is your attendance record like?


    Answer:


    Be sure to answer this question honestly, but ideally you will have already put
    in the work to back up the fact that you rarely miss days or arrive late. However,
    if there are gaps in your attendance, explain them briefly with appropriate reasons,
    and make sure to emphasize your dedication to your work, and reliability.


    *As an example:*


    My attendance record is pretty good. I can’t say I have perfect attendance because
    I am human and have gotten sick enough a couple of times where I needed to call
    in sick, or had certain appointments that were only available during work. Other
    than that, I am consistent in showing up every day and on time. During rare occurrences
    of running a few minutes late, I made sure to let my boss know.


    # 366. Where did you hear about this position?


    Answer:


    This may seem like a simple question, but the answer can actually speak volumes
    about you. If you were referred by a friend or another employee who works for
    the company, this is a great chance to mention your connection. However, if you
    heard about it somewhere like a career fair or a placement agency, you may want
    to focus on how pleased you were to come across such a opportunity.


    *As an example:*


    I heard about the position when a friend of mine sent it to me. She thought it
    looked interesting and had heard good things about the company. I don’t typically
    care too much about job ads however when I read this one I was excited and very
    interested and didn’t want to pass up the opportunity.


    # 367. Tell me anything else you’d like to know when making a hiring decision.


    Answer:


    This is a great opportunity for you to give a final sell of yourself to the interviewer
    - use this time to remind the interviewer of why you are qualified for the position,
    and what you can bring to the company that no else can. Express your excitement
    for the opportunity to work with a company pursuing mission.


    *As an example:*


    If you hire me you will not be disappointed. I am excited at the opportunity and
    eager to be able to help your company grow. My skillset and experience seem to
    match the position perfectly. I’m excited at the prospect of joining the team
    and seeing how I can “bring solutions to the community” like your company mission
    says!

