    \n```java\nclass Electronics implements Serializable {\n    transient private\
    \ int price; //Line 1\n    private int quantity; //Line 2\n}\n```\n\n当 `Electronics`\
    \ 类的实例被序列化时，`price` 字段将不会被序列化，只有 `quantity` 字段会被序列化。\n\n### 192. 什么是 Java 中的垃圾回收？\n\
    \nAnswer:\n\n垃圾回收（Garbage collection）是释放分配给不再使用的对象的内存的过程。在运行时，当对象被创建时，`JVM` 会分配一些内存来存放该对象。`JVM`\
    \ 定期检查正在使用的对象，并为那些不再使用的对象释放内存。垃圾回收就是移除这些不再使用的对象的过程。因此，程序员不需要担心手动释放内存的问题。\n\n###\
    \ 193. 垃圾回收使用了内存的哪个部分？JVM 使用什么算法进行垃圾回收？\n\nAnswer:\n\n垃圾回收是在堆内存（heap memory）中进行的。`JVM`\
    \ 内部使用“标记-清除”（mark and sweep）算法进行垃圾回收。\n\n### 194. 垃圾回收何时发生？\n\nAnswer:\n\n`JVM`（Java\
    \ 虚拟机）控制垃圾回收过程。因此，由 `JVM` 决定何时运行垃圾回收过程。\n\n也可以通过 Java 代码显式地请求垃圾回收。\n\n### 195.\
    \ 什么样的代码可以触发垃圾回收？\n\nAnswer:\n\n可以通过以下方式触发垃圾回收：\n\n方法 1– 使用 `Runtime.gc()`：\n\
    ```java\nRuntime.getRuntime();\n```\n\n方法 2– 使用 `System.gc()`：\n```java\nSystem.gc();\n\
    ```\n\n这两种方法都不保证触发垃圾回收，取决于 `JVM`。\n\n### 196. 请通过代码示例解释对象何时变为垃圾对象。\n\nAnswer:\n\
    \n当对象不再被引用时，就会变为垃圾对象。以下场景演示了这一点：\n\n场景 1– 将对象设置为 null\n```java\nString stringValue\
    \ = “This is a String);//Line 1\nstringValue = null; //使该字符串变为垃圾\n```\n\n场景 2–\
    \ 重新赋值变量\n```java\nString str1 = “Hello”;\nstr1 = str1;//使 str1 变为垃圾\n```\n\n\
    场景 3– 方法内部创建的对象\n```java\npublic void doSomething(){\n    String str1 = “Hello”;\n\
    }\n\npublic void callMethod(){\n    doSomething();\n}\n//doSomething 中的 str1 变为垃圾\n\
    ```\n\n# 第二节\n# 核心 Java\n# JAVA 8\n\n# 第一章\n# 函数式接口\n\n### 197. 什么是函数式接口？如何创建一个函数式接口？\n\
    \nAnswer:\n\n函数式接口只有一个抽象方法的接口。要创建一个函数式接口，你只需要创建一个只有一个抽象方法的接口，如下：\n\n```java\n\
    @FunctionalInterface\npublic interface Multiplier {\n    public int multiply(int\
    \ a, int b);\n}\n```\n\n这段代码定义了一个名为 `Multiplier` 的接口。它只有一个 `multiply` 方法。它指定了\
    \ `@FunctionalInterface` 注解。该注解是可选的，它标记接口为函数式接口。因此，如果你尝试向接口添加另一个抽象方法，会导致编译错误。\n\
    \n### 198. 解释 java.util.function 包。\n\nAnswer:\n\n`java.util.function` 是 Java\
    \ 8 添加的新包。它有很多内置的函数式接口。该包的一些接口如下：\n\na. `Predicate`：用于测试条件。它返回一个布尔值，表示条件的真假。它接受任意类型的参数。\n\
    b. `Consumer`：用于对值进行操作。它接受任意类型的参数并对其进行操作。它返回 void。\nc. `Function`：用于转换输入值。它接受任意类型的参数，对其进行转换并返回一个结果。\n\
    d. `Supplier`：用于产生一个值。它不接受任何参数，但产生一个任意类型的结果。\n\n### 199. 请用代码示例解释 java.util.function.Consumer\
    \ 接口。\n\nAnswer:\n\n"
- fmt: "\nThe `java.util.function.Consumer` is an built–in functional interface. It\
    \ is part of the `java.util.function` package which is added by Java 8. It has\
    \ a method called `accept()` that accepts an argument of any data type and operates\
    \ on it. It does not return any result. This method needs to be implemented via\
    \ a lambda expression. The following code demonstrates this:\n\n```java\nConsumer<String>\
    \ printStr = val-> System.out.println(val); //Line 1\nprintStr.accept(\"Hello\
    \ World\"); //Line 2\n```\n\nLine 1 creates a `Consumer` called `printStr` of\
    \ `String` type. It implements the `accept()` method via a lambda expression that\
    \ simply prints the input `String`. Line 2 invokes the `accept` method with the\
    \ value “Hello World”. So, this code prints the following output:\n\nHello World\n\
    \n### 200. Explain the differences between the `Supplier` and `Consumer` interfaces.\n\
    \nAnswer:\n\nBoth the `Supplier` and `Consumer` interfaces are built–in functional\
    \ interfaces in the `java.util.function` package. There are several differences\
    \ between the two as follows:\n\n- The `Supplier` interface does not accept an\
    \ argument, the `Consumer` interface accepts an argument of any data type.\n-\
    \ The `Supplier` interface produces a return value of any data type, the `Consumer`\
    \ interface does not return any value.\n- The `Supplier` interface basically produces\
    \ a value of a particular data type while the `Consumer` interface operates on\
    \ an input value.\n\n### 201. What is the output of the following code snippet?.\n\
    \n```java\nPredicate<Integer> numberChecker = (num)-> num > 20;\nint input = 10;\n\
    System.out.println(input+\" greater than 20–\"+numberChecker.test(input)); //Line\
    \ 1\ninput = 40;\nSystem.out.println(input+\" greater than 20–\"+numberChecker.test(input));\
    \ //Line 2\n```\n\nAnswer:\n\nThe above code snippet uses the built–in functional\
    \ interface called `Predicate`. This interface accepts an argument of any data\
    \ type and returns a boolean value. So, it is basically used to test a condition.\
    \ Here, the code creates a `Predicate` called `numberChecker` that accepts an\
    \ integer value. It is implemented via a lambda expression that checks whether\
    \ the input number is greater than 20. Line 1 applies the `Predicate` on the value\
    \ 10 while Line 2 applies the `Predicate` on the value 40. So, the code prints\
    \ the following output:\n\n10 greater than 20:false\n40 greater than 20:true\n\
    \n### 202. Which in–built functional interface would you use to convert a String\
    \ to uppercase?\n\nAnswer:\n\nThere is a built–in functional interface called\
    \ `UnaryOperator`. It accepts an argument of any data type and returns a result\
    \ of the same data type. It has a method called `apply` that operates on the input\
    \ value. So, you can use this to convert a `String` to uppercase. The following\
    \ code demonstrates this:\n\n```java\nUnaryOperator<String> converter = str->\
    \ str.toUpperCase();\nSystem.out.println(converter.apply(\"hello world\"));\n\
    ```\n\nHere, the code creates a `UnaryOperator` implementation called `converter`\
    \ that operates on a `String` value. A lambda expression is used that converts\
    \ the `String` to uppercase. So, this code prints the following output:\n\nHELLO\
    \ WORLD\n\n### 203. Is the code below valid? Explain.\n\n```java\n@FunctionalInterface\n\
    public interface Interface1 {\n    public void doSomething();\n}\n\npublic interface\
    \ Interface2 extends Interface1{\n    public void doSomethingElse();\n}\n```\n\
    \nAnswer:\n\nThe code above declares a functional interface called `Interface1`\
    \ with an abstract method called `doSomething`. It then defines another functional\
    \ interface called `Interface2` that extends `Interface1` and has an abstract\
    \ method called `doSomethingElse`. This code is perfectly valid. `Interface2`\
    \ now has two abstract methods, `doSomething()` and `doSomethingElse()`. Since\
    \ it is not marked with the `@FunctionalInterface` annotation, it is okay to have\
    \ multiple abstract methods. Had the `@FunctionalInterface` annotation been used\
    \ on `Interface2`, the code would have caused a compilation error.\n\n### 204.\
    \ Name some pre–Java 8 interfaces that are made functional interfaces by Java\
    \ 8.\n\nAnswer:\n\nPrior to Java 8, there are some interfaces that already had\
    \ a single abstract method. Java 8 has designated these interfaces as functional\
    \ interfaces by specifying the `@FunctionalInterface` annotation on them. So,\
    \ the abstract methods in these interfaces can be implemented via lambda expressions.\
    \ These interfaces are as follows:\n\na. `java.lang.Runnable`: Used to create\
    \ a `Thread`.\nb. `java.util.concurrent.Callable`: Used to create a `Thread` that\
    \ returns a value.\nc. `java.util.Comparator`: Used to compare values.\nd. `java.io.FileFilter`:\
    \ Used to filter `Files`.\n\n### 205. Why are primitive specializations of the\
    \ in–built functional interfaces like `IntSupplier`, `BooleanSupplier`, etc. added\
    \ by Java 8?\n\nAnswer:\n\nThe primitive specializations of the in–built functional\
    \ interfaces like `IntSupplier`, `BooleanSupplier`, etc. are added by Java to\
    \ improve performance. The primitive specializations do away with the need for\
    \ autoboxing and hence improve performance. The following code demonstrates this:\n\
    \n```java\nSupplier<Integer> integerSupplier = ()-> new Integer(new Random().nextInt());\n\
    ```\n\nThis code creates a `Supplier` that returns a random integer less than\
    \ 100. Since the primitive specialization is not used, the value returned by `Random`\
    \ class needs to be wrapped as an `Integer`. Now consider the following code:\n\
    \n```java\nIntSupplier integerSupplier2 = ()-> new Random().nextInt();\n```\n\n\
    In this case, an `IntSupplier` which is the primitive specialization of `Supplier`\
    \ that returns an integer is used. So, there is no need to wrap the return value\
    \ as an `Integer`. Since autoboxing is avoided, this code results in better performance.\n\
    \n### 206. Where are the built–in functional interfaces commonly used?\n\nAnswer:\n\
    \nJava 8 has added the `Stream API` that helps to perform bulk operations on Collections.\
    \ The built-in functional interfaces are commonly used as parameters to the methods\
    \ in the stream. The Stream methods apply the operation specified by the functional\
    \ interface to each element in the `Stream`. For example, the `Stream` interface\
    \ has a `filter` method that filters a `Collection` based on some condition. The\
    \ condition is specified via `Predicate` interface which is an in-built functional\
    \ interface. It checks if each value in the input `Stream` matches the condition\
    \ specified by the `Predicate`. Similarly, the `Stream` interface has a method\
    \ `map` that transforms the elements in a `Stream`. It accepts as parameter a\
    \ `Function` instance which is an in-built functional interface. It applies the\
    \ operation specified by the `Function` interface to each element in the `Stream`.\n"
  raw: 'The java.util.function.Consumer is an built–in functional interface. It is
    part of the java.util.function package which is added by Java 8\. It has a method
    called accept() that accepts an argument of any data type and operates on it.
    It does not return any result. This method needs to be implemented via a lambda
    expression. The following code demonstrates this:


    Consumer<String> printStr = val–> System.out.println(val); //Line 1


    printStr.accept(“Hello World”); //Line 2


    Line 1 creates a Consumer called printStr of String type. It implements the accept()
    method via a lambda expression that simply prints the input String. Line 2 invokes
    the accept method with the value “Hello World”. So, this code prints the following
    output:


    Hello World


    200. Explain the differences between the Supplier and Consumer interfaces.


    Answer:


    Both the Supplier and Consumer interfaces are built–in functional interfaces in
    the java.util.function package. There are several differences between the two
    as follows:


    • The Supplier interface does not accept an argument, the Consumer interface accepts
    an argument of any data type


    • The Supplier interface produces a return value of any data type, the Consumer
    interface does not return any value


    • The Supplier interface basically produces a value of a particular data type
    while the Consumer interface operates on an input value


    201. What is the output of the following code snippet?.


    Predicate<Integer> numberChecker = (num)–> num > 20;


    int input = 10;


    System.out.println(input+” greater than 20–”+numberChecker.test(input)); //Line
    1


    input = 40;


    System.out.println(input+” greater than 20–”+numberChecker.test(input)); //Line
    2


    Answer:


    The above code snippet uses the built–in functional interface called Predicate.
    This interface accepts an argument of any data type and returns a boolean value.
    So, it is basically used to test a condition. Here, the code creates a Predicate
    called numberChecker that accepts an integer value. It is implemented via a lambda
    expression that checks whether the input number is greater than 20. Line 1 applies
    the Predicate on the value 10 while Line 2 applies the Predicate on the value
    40. So, the code prints the following output:


    10 greater than 20:false


    40 greater than 20:true


    202. Which in–built functional interface would you use to convert a String to
    uppercase?


    Answer:


    There is a built–in functional interface called UnaryOperator. It accepts an argument
    of any data type and returns a result of the same data type. It has a method called
    apply that operates on the input value. So, you can use this to convert a String
    to uppercase. The following code demonstrates this:


    UnaryOperator<String> converter = str–> str.toUpperCase();


    System.out.println(converter.apply(“hello world”));


    Here, the code creates a UnaryOperator implementation called converter that operates
    on a String value. A lambda expression is used that converts the String to uppercase.
    So, this code prints the following output:


    HELLO WORLD


    203. Is the code below valid? Explain.


    @FunctionalInterface


    public interface Interface1 {


    public void doSomething();


    }


    public interface Interface2 extends Interface1{


    public void doSomethingElse();


    }


    Answer:


    The code above declares a functional interface called Interface1 with an abstract
    method called doSomething. It then defines another functional interface called
    Interface2 that extends Interface1 and has and abstract method called doSomethingElse.
    This code is perfectly valid. Interface2 now has two abstract methods, doSomething()
    and doSomethingElse(). Since it is not marked with the @FunctionalInterface annotation,
    it is okay to have multiple abstract methods. Had the @FunctionalInterface annotation
    been used on Interface2, the code would have caused a compilation error.


    204. Name some pre–Java 8 interfaces that are made functional interfaces by Java
    8.


    Answer:


    Prior to Java 8, there are some interfaces that already had a single abstract
    method. Java 8 has designated these interfaces as functional interfaces by specifying
    the @FunctionalInterface annotation on them. So, the abstract methods in these
    interfaces can be implemented via lambda expressions. These interfaces are as
    follows:


    a. java.lang.Runnable: Used to create a Thread


    b. java.util.cocurrent.Callable: Used to create a Thread that returns a value


    c. java.util.Comparator: Used to compare values


    d. java.io.FileFilter: Used to filter Files


    205. Why are primitive specializations of the in–built functional interfaces like
    IntSupplier, BooleanSupplier, etc. added by Java 8?


    Answer:


    The primitive specializations of the in–built functional interfaces like IntSupplier,
    BooleanSupplier, etc. are added by Java to improve performance. The primitive
    specializations do away with the need for autoboxing and hence improve performance.
    The following code demonstrates this:


    Supplier<Integer> integerSupplier = ()–> new Integer(new Random().nextInt());


    This code creates a Supplier that returns a random integer less than 100. Since
    the primitive specialization is not used, the value returned by Random class needs
    to be wrapped as an Integer. Now consider the following code:


    IntSupplier integerSupplier2 = ()–> new Random().nextInt();


    In this case an IntSupplier which is the primitive specialization of Supplier
    that returns an integer is used. So, there is no need to wrap the return value
    as an Integer. Since autoboxing is avoided, this code results in better performance.


    206. Where are the built–in functional interfaces commonly used?


    Answer:


    Java 8 has added the Stream API that helps to perform bulk operations on Collections.
    The built-in functional interfaces are commonly used as parameters to the methods
    in the stream API. The Stream methods apply the operation specified by the functional
    interface to each element in the Stream. For example, the Stream interface has
    a filter method that filters a Collection based on some condition. The condition
    is specified via the Predicate interface which is an in-built functional interface.
    It checks if each value in the input Stream matches the condition specified by
    the Predicate. Similarly, the Stream interface has a method called map that transforms
    the elements in a Stream. It accepts as parameter a Function instance which is
    an in-built functional interface. It applies the operation specified by the Function
    interface to each element in the Stream.


    # [CHAPTER 02](#toc.xhtml_ss022a)


    # [Lambda Expressions](#toc.xhtml_ss022a)


    207. What is a lambda expression? What are the benefits of using lambda expressions?


    Answer:


    A lambda expression is used to specify a function without a name. It is used to
    implement the abstract method within a functional interface. Lambda expressions
    have several benefits as follows:


    • They make code concise. Prior to Java 8, developers had to write a lot of code
    to implement an interface which made the code lengthy and verbose. Lambda expressions
    get rid of most of the boilerplate code associated with implementing an interface.


    • They allow passing around code as method arguments.


    • They allow providing different implementation for the same method on the fly.


    • Some of the other new features added by Java 8 like for–each and Streams also
    use lambda expressions.


    208. How are lambda expressions and functional interfaces related to each other?


    Answer:


    A functional interface is an interface with a single abstract method. A lambda
    expression is used to implement the abstract method specified in the functional
    interface.'
