    and when Line 2 is executed, the file **test.txt** is created inside the folder
    **/usr/**.


    178. Explain the FileWriter class with a code sample.


    Answer:


    FileWriter class is used to write characters or Strings to a file without having
    to convert them to a byte array.


    They are usually wrapped within PrintWriter or BufferedWriter which provides performance
    improvement and more methods for writing data. The following code demonstrates
    a FileWriter:


    try {


    File txtFile = new File(“/usr/CoreJava.txt”);


    FileWriter myFileWriter = new FileWriter(txtFile);


    myFileWriter.write(“Line 1 \n Line 2 \n”); // Line 1


    myFileWriter.flush();


    myFileWriter.close();


    } catch (IOException exp) {


    }


    In the above code, when Line 1 is executed, the write() method writes the content
    into the file **CoreJava.txt**.


    179. Write a code snippet that reads the content in the file /usr/CoreJava.txt
    using a FileReader and displays the output in the console.


