    the test methods annotated in them.


    # 69: How do you mark a collection of tests to be run in a suite?


    Answer:


    Annotate it with @RunWith(Suite.class) and specify classes with @SuiteClasses
    to mark a collection of tests to be run in a suite.


    # 70: Is it required to catch all checked exceptions in a test method?


    Answer:


    No, it''s not required to catch all checked exceptions in a test method. A test
    method can be declared to throw everything, which will mean the test didn''t pass
    successfully.'
