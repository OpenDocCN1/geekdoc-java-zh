    ## Unit Testing and JUnit Features


    ## 113: Does JUnit offer any native support for multithreaded tests? Explain.


    Answer:


    No, JUnit does not offer any native support for multithreaded tests instead; it
    leaves the handling of errors in different threads for the programmer and other
    tools. This is because the control of threads is not easy especially without knowledge
    of the domain problem at hand.


    ## 114: How would you use a JUnit assumption in order to stop a test from executing
    unless it is the year 2011?


    Answer:


    AssumeThat(Calendar.getInstance().get(Calendar.YEAR), is(equalTo(2011)));


    ## 115: What support for stubbing does JUnit provide?


    Answer:


    JUnit does not provide any support for stubbing, and leaves that for the programmer
    and external libraries.


    ## 116: What support for mocking does JUnit provide?


    Answer:


    JUnit does not provide any support for mocking, and leaves that to the programmer
    and external libraries.


    ## 117: What is JUnit?


    Answer:


    JUnit is a framework for unit testing in Java.


    ## 118: What is Unit Testing?


    Answer:


    Unit Testing is the act of writing automatic tests for testing units (usually,
    classes) in isolation from other objects.


    ## 119: Would you say that having a test per each object''s method is good testing
    conduct?


    Answer:


    No it is not. This is because good unit tests generally test the behavior of an
    object, and not its individual methods, and so it makes more sense to have tests
    that use a few methods at a time, as part of testing a particular functionality
    of the object.


    ## 120: What is an Isolated Unit Test?


    Answer:


    An Isolated Unit Test checks the object in isolation from its other dependencies.
    This means that even if the object uses the network, file system, database, etc.,
    we do not allow it to actually use those objects, but still it thinks it is using
    them. By doing so, we isolate and make sure that any failures are caused by errors
    in the object itself.


    ## 121: How many isolated tests can one expect to have run in a single second?


    Answer:


    Usually, a thousand or even more, since isolated tests are usually very fast,
    which is another advantage to make sure your tests are truly isolating the objects
    they are testing.


    ## 122: When will you write a Unit Test for a getter method?


    Answer:


    Usually, if the getter does no other work than returning an object, testing it
    is not worthwhile. But if it does any extra work beyond that, it should be tested.


    ## 123: JUnit tests can be abstract. What would be a good use case for that?


    Answer:


    It can be used to test an interface. We can write a single test that checks if
    the implementation follows all of the interface''s expected behavior. Then, subclass
    tests the abstract test for each of the new implementations, providing it with
    a concrete instance to test against.


    ## 124: What is a test fixture?


    Answer:


    A test fixture is a name for a test environment.


    ## 125: Why does JUnit re-instantiate the class?


    Answer:


    To ensure that each test runs with a fresh state.


    ## 126: What is test coverage?


    Answer:


    Test coverage is the percentage of code executed during test testing.


    ## 127: Does 100% coverage guarantee the code is correct?


    Answer:


    No, it only means every line was executed, not that all possible logic paths or
    edge cases were tested.


    ## 128: How can you filter tests?


    Answer:


    You can use categories or tags to include or exclude specific tests.


    ## 129: How would you order tests?


    Answer:


    You can use the `@Order` annotation in JUnit 5 to specify the execution sequence.


    ## 130: What is the advantage of JUnit 5?


    Answer:


    It provides a more modular architecture and better support for modern features.


    ## 131: How would you migrate from JUnit 4 to JUnit 5?


    Answer:


    By using the vintage engine for legacy tests.


    ## 132: Why was the parameter required in the constructor of TestCase?


    Answer:


    In older JUnit versions, it was used for naming tests.


    ## 133: What is the job of the Description class?


    Answer:


    A Description describes a test to be run. It can be a single test or a composite
    of tests.


    ## 134: How would you create a request to execute tests?


    Answer:


    By using the Request.request() method.


    ## 135: How would you create a request to execute tests in classes?


    Answer:


    By using the Request.classes() method.


    ## 136: How would you create a request to execute a certain method?


    Answer:


    By using the Request.method() method.

