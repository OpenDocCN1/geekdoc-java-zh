  md: "\n## 146: How does JUnitCore report back the status of the tests it ran?\n\n\
    Answer:\n\nJUnitCore returns a Result object, which contains different statistics\
    \ for the test execution.\n\n## 147: What is the JUnit XML format and what are\
    \ its uses?\n\nAnswer:\n\nThe JUnit XML format is a format to output the results\
    \ of test execution. It is used by a variety of tools in order to parse JUnit's\
    \ results and act on it (play sounds, display statistics, etc.)\n\n## 148: What\
    \ does the RunWith annotation specify?\n\nAnswer:\n\nRunWith specifies the Runner\
    \ object that should be used to run the tests in the given class.\n\n## 149: What\
    \ does the Runner interface represent?\n\nAnswer:\n\nA Runner runs tests and notifies\
    \ the system of the progress.\n\n## 150: What is a ParentRunner?\n\nAnswer:\n\n\
    ParentRunner is a general Runner implementation that does most of the regular\
    \ stuff a Runner is supposed to do. It is a good starting place for extending\
    \ JUnit.\n\n## JUnit4.x\n\n## Parameterized test\n\n### 151: How would you use\
    \ Parameterized to run a given test over a few inputs?\n\nAnswer:\n\n```\n@RunWith(Parameterized.class)\n\
    public class DemoTest {\n    private String s1;\n    private String res;\n   \
    \ public DemoTest(String s1, String result) {\n        this.s1 = s1;\n       \
    \ this.res = res;\n    }\n}\n\n@Parameters\npublic static Collection<Object[]>\
    \ create() {\n    return Arrays.asList(new Object[][]{ { \"ks\", \"shobana\" }\
    \ });\n}\n\n@Test\npublic void mytest1() {\n    System.out.println(s1 + \"\" +\
    \ res);\n}\n```\n\n### 152: What is the function of parameterized test?\n\nAnswer:\n\
    \nParameterized test provides the functionality of running the same test again\
    \ and again with different values. Test class should be annotated with '@RunWith(parameter.class)\
    \ annotation. Contains a public static method with '@parameters' annotation.\n\
    \n### 153: Describe the '@parameter' annotation.\n\nAnswer:\n\nReturns the list(array)\
    \ as test data set.\nExample:\n```\npublic static Collection<Object[]> my_data1()\
    \ {\n    Object[][] my_data1={...};\n    return Arrays.asList(my_data1);\n}\n\
    // collection -> Collection< Object[]>\n// Array -> Arrays.asList(my_data1)\n\
    ```\n\n## Expected Exception testing\n\n### 154: How will you test expected exception\
    \ using Junit?\n\nAnswer:\n\n```\n@Test(expected=NullPointerException.class)\n\
    public void processDeal(boolean isActive) {\n    deal = null;\n    if (isActive\
    \ == true) {\n        deal = new Deal();\n    }\n    deal.getDealResp();\n}\n\
    ```\n\nDeal object is created based on the condition. Hence null pointer exception\
    \ is expected when getDealResp() function is called.\n\n## Time Test\n\n### 155:\
    \ How will you mark the testing failed if the test method does not return after\
    \ certain time?\n\nAnswer:\n\n```\n@Test(timeout=2000)\npublic void calcSalary()\
    \ {\n    int sal=20;\n    while (sal==10) {\n        sal++;\n    }\n}\n```\n\n\
    Test will be terminated and marked as failed after 2000 milliseconds since it\
    \ is infinite loop which will take longer than specified amount of time (2000).\n\
    \n### 156: Write a simple test class in Junit.\n\nAnswer:\n\n```java\nclass DemoTest\
    \ {\n    @Test\n    public void dispName() {\n        String s1 = \"shobhana\"\
    ;\n        Assert.assertEquals(8,s1.length());\n    }\n}\n```\n\n### 157: What\
    \ is the use of static import of Assert classes?\n\nAnswer:\n\nIf org.junit.Assert.*\
    \ is imported statically, Assert methods can be used directly without class name\
    \ Assert (as in above question).\n\n```java\nimport static org.junit.Assert.*;\n\
    ....\nassertEquals(8,s1.length());\n```\n\n## Ignore Test\n\n### 158: How will\
    \ you bypass a method which is not ready for testing?\n\nAnswer:\n\n```java\n\
    @Ignore(\"This method is not ready for testing\")\n@Test\npublic void calcSalary()\
    \ {\n    System.out.println(\"Calculate salary\");\n}\n```\n\n### 159: Can we\
    \ ignore a class that needs to be tested?\n\nAnswer: Yes. All the methods within\
    \ the class will be bypassed by testing.\n\n```java\n@Ignore(\"This class is not\
    \ ready for testing\")\npublic class DemoTest {\n    @Test\n    public void method1()\
    \ {\n      ...\n    }\n    @Test\n    public void method2() {\n      ...\n   \
    \ }\n}\n```\n\n## Suite Test\n\n### 160: Can we run more than one unit test cases\
    \ together?\n\nAnswer:\n\nYes. Using Suite test where more than one unit test\
    \ cases can be bundled and run together.\n\n### 161: What are the annotations\
    \ used for running suite test?\n\nAnswer:\n\nThe annotations used for running\
    \ suite test are:\n\n- @RunWith\n- @Suite\n\n### 162: How will you implement Suite\
    \ test in JUnit3?\n\nAnswer:\n\nWe can implement Suite test in JUnit3:\n\n- By\
    \ invoking suite() method in the test class\n- Another Test and testsuite can\
    \ be invoked or added\n- In below code sample, class DemoTest and its test method\
    \ dispName() will be added in suite\n\n```java\npublic static Test suite() {\n\
    \  TestSuite ts = new TestSuite();\n  ts.addClass(DemoTest.class);\n  return ts;\n\
    }\n```\n\n### 163: How will you implement suite in JUnit4?\n\nAnswer:\n\n```java\n\
    @RunWith(Suite.class)\n@SuiteClasses({\n    Test1.class,\n    Test2.class,\n \
    \   Test3.class\n})\npublic class MyTestSuite {}\n}\n```\n\n### 164: Can we pass\
    \ parameters to a suite?\n\nAnswer:\n\nYes, by using the Parameterized runner\
    \ or a custom suite runner implementation.\n\n### 165: How to handle suite tests\
    \ in JUnit4?\n\nAnswer:\n\nJUnit4 uses the `@Suite` and `@SuiteClasses` annotations\
    \ to group multiple tests together.\n\n### 166: Can we run tests in specific order?\n\
    \nAnswer:\n\nYes, you can use the `@Order` annotation along with `@FixedMethodOrder.class`.\n\
    \n### 167: How to ensure test order in JUnit?\n\nAnswer:\n\nUse `@Order(int)`\
    \ on test methods (available in JUnit 5).\n\n### 168: What is the difference between\
    \ JUnit 3 and 4?\n\nAnswer:\n\n- JUnit 3 uses inheritance (extending `TestCase`).\n\
    - JUnit 4 uses annotations (`@Test`).\n\n### 169: How to run tests from the command\
    \ line?\n\nAnswer:\n\nUse the JUnit console or build tools like Maven (`mvn test`)\
    \ or Gradle (`gradle test`).\n\n### 170: How to run tests in IDE?\n\nAnswer:\n\
    \nRight-click on the test class or method and select \"Run 'TestName'\".\n"
  mdcn: "\n\n## 146: JUnitCore 如何报告它运行的测试的状态？\n\n答案：\n\nJUnitCore 返回一个 `Result` 对象，该对象包含了测试执行的各种不同统计数据。\n\
    \n## 147: 什么是 JUnit XML 格式？它的用途是什么？\n\n答案：\n\nJUnit XML 格式是一种用于输出测试执行结果的格式。各种工具使用该格式来解析\
    \ JUnit 结果并对其进行操作（如播放声音、显示统计数据等）。\n\n## 148: @RunWith 注解指定了什么？\n\n答案：\n\n`@RunWith`\
    \ 指定了用于运行给定类中测试的 `Runner` 对象。\n\n## 149: Runner 接口代表什么？\n\n答案：\n\n`Runner` 运行测试并通知系统执行进度。\n\
    \n## 150: 什么是 ParentRunner？\n\n答案：\n\n`ParentRunner` 是一个通用的 `Runner` 实现，它执行 Runner\
    \ 应该执行的大部分常规工作。它是扩展 JUnit 的良好起点。\n\n## JUnit4.x\n\n## 参数化测试\n\n### 151: 你如何使用\
    \ Parameterized 对一组输入运行给定的测试？\n\n答案：\n\n```\n@RunWith(Parameterized.class)\npublic\
    \ class DemoTest {\n    private String s1;\n    private String res;\n    public\
    \ DemoTest(String s1, String result) {\n        this.s1 = s1;\n        this.res\
    \ = res;\n    }\n}\n\n@Parameters\npublic static Collection<Object[]> create()\
    \ {\n    return Arrays.asList(new Object[][]{ { \"ks\", \"shobana\" } });\n}\n\
    \n@Test\npublic void mytest1() {\n    System.out.println(s1 + \"\" + res);\n}\n\
    ```\n\n### 152: 参数化测试的功能是什么？\n\n答案：\n\n参数化测试提供了使用不同值反复运行同一个测试的功能。测试类应该被标记上 `@RunWith(Parameterized.class)`\
    \ 注解。该类应包含一个带有 `@Parameters` 注解的公共静态方法。\n\n### 153: 描述 @parameter 注解。\n\n答案：\n\
    \n返回列表（数组）作为测试数据集。\n示例：\n```\npublic static Collection<Object[]> my_data1() {\n\
    \    Object[][] my_data1={...};\n    return Arrays.asList(my_data1);\n}\n// collection\
    \ -> Collection< Object[]>\n// Array -> Arrays.asList(my_data1)\n```\n\n## 预期异常测试\n\
    \n### 154: 你如何使用 Junit 测试预期异常？\n\n答案：\n\n```\n@Test(expected=NullPointerException.class)\n\
    public void processDeal(boolean isActive) {\n    deal = null;\n    if (isActive\
    \ == true) {\n        deal = new Deal();\n    }\n    deal.getDealResp();\n}\n\
    ```\n\nDeal 对象根据条件创建。因此，当调用 `getDealResp()` 函数时，会产生空指针异常。\n\n## 时间测试\n\n### 155:\
    \ 如果测试方法在一定时间后没有返回，你将如何标记测试失败？\n\n答案：\n\n```\n@Test(timeout=2000)\npublic void\
    \ calcSalary() {\n    int sal=20;\n    while (sal==10) {\n        sal++;\n   \
    \ }\n}\n```\n\n测试将在 2000 毫秒后终止并标记为失败，因为这是一个无限循环，其耗时将超过指定的时间（2000）。\n\n### 156:\
    \ 在 Junit 中写一个简单的测试类。\n\n答案：\n\n```java\nclass DemoTest {\n    @Test\n    public\
    \ void dispName() {\n        String s1 = \"shobhana\";\n        Assert.assertEquals(8,s1.length());\n\
    \    }\n}\n```\n\n### 157: Assert 类的静态导入的用途是什么？\n\n答案：\n\n如果静态导入了 `org.junit.Assert.*`，则可以直接使用\
    \ Assert 方法，而无需类名 Assert（如上一个问题所示）。\n\n```java\nimport static org.junit.Assert.*;\n\
    ....\nassertEquals(8,s1.length());\n```\n\n## 忽略测试\n\n### 158: 你将如何跳过尚未准备好测试的方法？\n\
    \n答案：\n\n```\n@Ignore(\"This method is not ready for testing\")\n@Test\npublic\
    \ void calcSalary() {\n    System.out.println(\"Calculate salary\");\n}\n```\n\
    \n### 159: 我们可以忽略需要测试的类吗？\n\n答案：可以。该类中的所有方法都将被测试跳过。\n\n```java\n@Ignore(\"This\
    \ class is not ready for testing\")\npublic class DemoTest {\n    @Test\n    public\
    \ void method1() {\n      ...\n    }\n    @Test\n    public void method2() {\n\
    \      ...\n    }\n}\n```\n\n## 套件测试\n\n### 160: 我们可以一起运行多个单元测试用例吗？\n\n答案：可以。使用\
    \ Suite 测试（套件测试），可以将多个单元测试用例打包并一起运行。\n\n### 161: 运行套件测试使用了注解？\n\n答案：用于运行套件测试的注解有：\n\
    \n- @RunWith\n- @Suite\n\n### 162: 你如何在 JUnit3 中实现 Suite 测试？\n\n答案：\n\n我们可以在 JUnit3\
    \ 中实现套件测试：\n\n- 通过在测试类中调用 `suite()` 方法\n- 可以调用或添加另一个 `Test` 和 `testsuite`\n- 在下面的代码示例中，`DemoTest`\
    \ 类及其测试方法 `dispName()` 将添加到套件中\n\n```java\npublic static Test suite() {\n  TestSuite\
    \ ts = new TestSuite();\n  ts.addClass(DemoTest.class);\n  return ts;\n}\n```\n\
    \n### 163: 你如何在 JUnit4 中实现套件？\n\n答案：\n\n```java\n@RunWith(Suite.class)\n@SuiteClasses({\n\
    \    Test1.class,\n    Test2.class,\n    Test3.class\n})\npublic class MyTestSuite\
    \ {}\n```\n\n### 164: 我们可以向套件传递参数吗？\n\n答案：可以，通过使用参数化运行器或自定义套件运行器。\n\n### 165:\
    \ JUnit4 如何处理套件测试？\n\n答案：JUnit4 使用 `@Suite` 和 `@SuiteClasses` 注解将多个测试组合。\n\n###\
    \ 166: 我们可以按特定顺序运行测试吗？\n\n答案：可以，你可以使用 `@Order` 注解配合 `@FixedMethodOrder.class`。\n\
    \n### 167: 如何确保 JUnit 测试顺序？\n\n答案：在测试方法上使用 `@Order(int)`（适用于 JUnit 5）。\n\n###\
    \ 168: JUnit 3 和 4 的区别是什么？\n\n答案：\n\n- JUnit 3 使用继承（扩展 `TestCase`）。\n- JUnit 4\
    \ 使用注解（`@Test`）。\n\n### 169: 如何从命令行运行测试？\n\n答案：使用 JUnit 控制台或构建工具如 Maven (`mvn\
    \ test`）或 Gradle (`gradle test`）。\n\n### 170: 如何在 IDE 中运行测试？\n\n答案：右键点击测试类或方法，并选择“Run\
    \ 'TestName'”。\n\n"
