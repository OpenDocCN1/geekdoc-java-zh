    ## JUnit Interview Questions You''ll Most Likely Be Asked


    ## job performance, and adjusting as necessary?


    Answer:


    This question has a pretty clear answer – yes – but you''ll need to display a
    knowledge as to why this is important. Receiving feedback and criticism is one
    thing, but the most important part of that process is to implement it into your
    daily work. Keep a good attitude, and express that you always appreciate constructive
    feedback.


    ## 20: What inspires you?


    Answer:


    You may find inspiration in nature, reading success stories, or mastering a difficult
    task, but it is important that your inspiration is positively-based and that you''re
    able to listen and tune into it when it appears. Keep this answer generally based
    in the professional world, but where applicable, it may stretch a bit into creative
    exercises in your personal life that, in turn, help you in achieving career objectives.


    ## 21: How do you inspire others?


    Answer:


    This may be a difficult question, as it is often hard to discern the effects of
    inspiration in others. Instead of offering a specific example of a time when you
    inspired someone, focus on general principles such as leading by example that
    you employ in your professional life. If possible, relate this to a quality that
    someone who inspired you possessed, and discuss the way you have modified or modeled
    it in your own work.


    ## 22: How do you make decisions?


    Answer:


    This is a great opportunity for you to wow your interviewer with your decisiveness,
    confidence, and organizational skills. Make sure that you outline a process for
    decision-making, and that you stress the importance of weighing your options,
    as well as in trusting intuition. If you answer this question skillfully and with
    ease, your interviewer will trust in your capability as a worker.


    ## 23: What are the most difficult decisions for you to make?


    Answer:


    Explain your relationship to decision-making, and a general synopsis of the process
    you take in making choices. If there is a particular type of decision that you
    often struggle with, such as those that involve other people, make sure to explain
    why that type of decision is tough for you, and how you are currently engaged
    in improving your skills.


    ## 24: When making a tough decision, how do you gather information?


    If you''re making a tough choice, it is best to gather information from as many
    sources as possible. Lead the interviewer through your process of taking information
    from people in different areas, starting first with advice from experts in your
    field, feedback from coworkers or other clients, and by looking analytically at
    your own past experiences.


    ## 25: Tell me about a decision you made that did not turn out well.


    Honesty and transparency are great values that your interviewer will appreciate
    – outline the choice you made, why you made it, the results of your poor decision
    – and finally (and importantly!) what you learned from the decision. Give the
    interviewer reason to trust that you wouldn''t make a decision like again in the
    future.


    ## 26: Are you able to make decisions quickly?


    You may be able to make decisions quickly, but be sure to communicate your skill
    in making sound, thorough decisions as well. Discuss the importance of making
    a decision quickly, and how you do so, as well as the necessity for each decision
    to first be well-informed.


    ## 27: What is customer service?


    Customer service can be many things – and the most important consideration in
    this question is that you have a creative answer. Demonstrate your ability to
    think outside the box by offering a confident answer that goes past a basic definition,
    and that shows you have truly considered your own individual view of what it means
    to take care of your customers. The thoughtful consideration you hold for customers
    will speak for itself.


    ## 28: Tell me about a time when you went out of your way for a customer.


    It is important that you offer an example of a time you truly went out of your
    way – be careful not to confuse something that felt like a big effort on your
    part, with something your employer would expect you to do anyway. Offer an example
    of the customer''s problems, what you did to solve it, and the way the customer
    responded after you took care of the situation.


    ## 29: How do you gain confidence from customers?


    This is a very open-ended question that allows you to show your customer service
    skills to the interviewer. There are many possible answers, and it is best to
    choose something that you’ve had great experience with, such as “by handling situations
    with transparency,” “offering rewards,” or “focusing on great communication.”
    Offer specific examples of successes you’ve had.


    ## 30: Tell me about a time when a customer was upset or agitated – how did you
    handle the situation?


    Similarly to handling a dispute with another employee, the most important part
    to answering this question is to first set up the scenario, offer a step-by-step
    guide to your particular conflict resolution style, and end by describing the
    way the conflict was resolved. Be sure that in answering questions about your
    own conflict resolution style, that you emphasize the importance of open communication
    and understanding from both parties, as well as a willingness to reach a compromise
    or other solution.


