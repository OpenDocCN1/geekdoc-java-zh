    12: Say you''ve got an integration test written in JUnit that is flaky because
    it depends on an external resource that might sometimes fail. How will you use
    JUnit''s features in order to automatically retry a few times tests that use resource?


    Answer:

    We can write a Rule that simply retries failed tests (catching AssertionError;
    for e.g; and then calling the statement again).


    13: Let''s say we have special test objects used in our testing and we want them
    to automatically fail tests when they end up in a bad state, without having to
    explicitly call asserts on them in every test method; an example is expectations
    that are set on mock objects. How can we do that?


    Answer:

    We can provide a Rule that executes its validations after running the test method''s
    statement itself.


    14: A lot of times we write tests with random data in order to increase chances
    of finding bugs and for doing exploratory testing. The main problem with such
    tests is that once it fails, it isn''t guaranteed to fail again. How can we make
    JUnit help us reproduce these failed tests?


    Answer:

    We can use a Random object that is supplied by an ExternalResource and so make
    it save the seed that failed when tests fail. In that case we can rerun the tests
    with the same seed to get the same results.


    15: How can we keep track of system performance by automatically failing tests
    that suddenly take, say 50% longer than previous runs?'
  - '[PAGE 12]


    JUnit Interview Questions You''ll Most Likely Be Asked


    # Answer:


    We can add a Rule that keeps track of running times and when a test takes too
    long (compared to previous runs) it fails the tests.


    # 16: Describe the interface to Rule implementations to inject their logic to
    runtime.


    # Answer:


    A rule simply receives a Statement, which represents the test method that is about
    to be executed. It can then decorate the execution of that statement (which is
    using statement.evaluate()) by performing tasks before, after it, instead of it,
    etc.


    # 17: How would you add automatic logging to print the time each test took?


    # Answer:


    We can create a LoggingRule that will keep track of test execution time and log
    it after each test finishes running.


    # 18: How many Rules can be supplied in a single test class?


    # Answer:


    There is no limitation, since Rules are composable.'
