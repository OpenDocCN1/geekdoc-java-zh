    also be best to talk to the coworker in question about the benefits of alternate
    perspectives – if you can handle the situation yourself, it is best not to bring
    resolvable issues to management.


    # 12: Are you rewarded more from working on a team, or accomplishing a task on
    your own?


    Answer:


    It is best to show a balance between these two aspects – your employer wants to
    see that you''re comfortable working on your own, and that you can complete tasks
    efficiently and well without assistance. However, it is also important for your
    employer to see that you can be a team player, and that you understand the value
    that multiple perspectives and efforts can bring to a project.


    # 13: Tell me about a time when you worked additional hours to finish a project.


    Answer:


    It is important for your employer to see that you are dedicated to your work,
    and willing to put in extra hours when required or when a job calls for it. However,
    be careful when explaining why you were called to work additional hours – for
    instance, did you have to stay late because you set goals poorly earlier in the
    process? Or on a more positive note, you were working additional hours because
    a client requested a deadline to be moved up on short notice? Stress your competence
    and willingness to give 110% every time.


    # 14: Tell me about a time when your performance exceeded the duties and requirements
    of your job.


    Answer:


    If you''re a great candidate for the position, this should be an easy question
    to answer – choose a time when you truly went above and beyond the call of duty,
    and put in additional work or voluntarily took on new responsibilities. Remain
    humble, and express gratitude for the learning opportunity, as well as confidence
    in your ability to give a repeat performance.'
