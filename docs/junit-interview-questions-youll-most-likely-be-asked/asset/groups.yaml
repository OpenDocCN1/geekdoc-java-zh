    # # Rules'
  - '[PAGE 9]


    # 1: What is the Rules capability of JUnit?


    Answer:


    Rules allow very flexible addition or redefinition of the behavior of each test
    method in a test class. This is the Rules capability of JUnit.


    # 2: How would you use the TemporaryFolder Rule to create a file that is guaranteed
    to be deleted when the tests end?


    Answer:


    ```

    @Rule public TemporaryFolder folder = new TemporaryFolder();

    @Test void someTest() { File f = folder.newFile("file"); }

    ```


    # 3: What does the ExternalResource Rule do?


    Answer:


    ExternalResource Rule a rule that allows defining initialization and deconstruction
    of a resource when tests start and end.


    # 4: What advantage does ExternalResource have over set up and tear down methods?


    Answer:


    External Resource allows localization of the logic related to a single resource
    to a single class that can then be reused in multiple tests.


    # 5: What does the ErrorCollector Rule do?


    Answer:


    ErrorCollector Rule allows the execution of a test to continue the first problem
    is found (for example, to collect all the incorrect rows in a table and report
    them all at once).


    # 6: How would you use the Timeout Rule in order to make sure that each test method
    in a class doesn''t run longer than 20 milliseconds?


    Answer:


    ```

    @Rule public Timeout globalTimeout = new Timeout(20);

    ```'
