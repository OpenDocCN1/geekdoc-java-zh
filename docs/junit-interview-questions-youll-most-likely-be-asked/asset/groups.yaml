    are set on mock objects. How can we do that?

    - 14: Lot of times we write tests with random data in order to increase chances
    of finding bugs and for doing exploratory testing. The main problem with such
    tests is that it fails, it isn''t guaranteed to fail again. How can we make JUnit
    help us reproduce these failed tests?

    - 15: How can we track of system performance by automatically failing tests that
    suddenly take, say 50% longer than previous runs?

