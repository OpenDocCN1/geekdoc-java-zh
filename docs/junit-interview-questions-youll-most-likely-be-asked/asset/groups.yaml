    # 71: How would you specify that a certain test should be finished by a given
    time frame?


    Answer:


    Specify timeout=timeoutInMillis in the test''s @Test annotation to specify that
    a certain test should be finished by a given time frame.


    # 72: Can regular test classes'' constructors have arguments?


    Answer:


    No, regular test classes'' constructors cannot have arguments because JUnit won''t
    know how to instantiate them.


    # 73: What are set up methods in a test class?


    Answer:


    Set up methods are used for preparing the objects that are needed for the test
    and sharing them between test methods in the class.


    # 74: What are Tear down methods in a test class?


    Answer:


    Tear down methods are used for cleaning up objects and undoing whatever actions
