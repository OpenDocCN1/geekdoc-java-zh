  md: '# JUnit Interview Questions You''ll Most Likely Be Asked


    88: Should a tear down method be run if a test fails? Why?

    Answer:


    Yes, since the fact that the test failed does not mean the tear down code should
    not happen. This is useful to make sure that state is cleared, just as one might
    do in production code using the finally keyword.


    89: Should a tear down method be run if a test errors out? Why?

    Answer:


    Yes, since the fact that the test failed does not mean the tear down code should
    not happen. This is useful to make sure that state is cleared, just as one might
    do in production code using the finally keyword.


    90: Should a test method be run if its set up method raises an exception? Why?

    Answer:


    No, since the error leaves the test case not knowing if the set up needed for
    the test itself has been executed; so it can''t execute it in an unknown state.


    91: If a test passes successfully, but its tear down method raises an exception,
    will the test still be looked at as passed? Why?

    Answer:


    No, since tear down code can be used for having global assertions (like making
    sure all temporary files have been deleted) and the fact that it has failed might
    mean there was a problem with the test code itself.


    92: How many times should a BeforeClass method run in case it it throws an exception?
    Why?

    Answer:


    Once, because it is always run once, and the fact that it failed does not mean
    it gets "another chance" to try and set up the code.


