  md: '# 19: How do you assert that a certain condition is true in a test?


    Answer:


    By using the assertTrue() method, e.g. assertTrue(condition) assert that certain
    conditions are true in a test.


    # 20: Why do assertion methods have an optional String argument?


    Answer:


    To specify a verbose and readable reason that can be understood from the failure
    message, assertion methods have optional String argument.


    # 21: If you have multiple assertions in the same test method and one fails, will
    the next one be executed? Why?


    Answer:


    No, the next one will not be executed because an AssertionError will be raised
    by the failed assertion and the method''s execution will be stopped.


    # 22: Why does assertEquals do?


    Answer:


    assertEquals asserts that the two objects that are passed to it are equal


    # 23: Why is there a need for both assertTrue() and assertEquals() ?


    Answer:


    Since assertEquals is more specific, it can provide better messaging when it fails
    and expresses intent better.


    # 24: What is the difference between assertEquals() and assertSame() ?


    Answer:


    assertEquals compares objects using equals() whereas assertSame uses ====


