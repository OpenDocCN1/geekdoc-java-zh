- pgno: 25
  md: '# 64: How do you mark a method as a test method?


    Answer:


    Annotate it with the @Test annotation to mark a method as a test method.


    # 65: What is a valid visibility for a test method and why?


    Answer:


    Public is a valid visibility for a test method since JUnit needs to access it
    via reflection.


    # 66: What is a valid return type for a test method?


    Answer:


    None, it should be declared as a void method


    # 67: Does JUnit require test methods to be named with "test" at the start?


    Answer:


    No, JUnit does not require methods to be named with "test" at the start. (not
    required in JUnit 4, was required in JUnit 3).


    # 68: Do test classes require a specific annotation? Why?


    Answer:


    test classes do not require a specific annotation since they are discovered by
    the test methods annotated in them.


    # 69: How do you mark a collection of tests to be run in a suite?


    Answer:


    Annotate it with @RunWith(Suite.class) and specify classes with @SuiteClasses
    to mark a collection of tests to be run in a suite.


    # 70: Is it required to catch all checked exceptions in a test method?


    Answer:


    No, it''s not required to catch all checked exceptions in a test method. A test
    method can be declared to throw everything, which will mean the test didn''t pass
    successfully.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 71: How would you specify that a certain test should be finished by a given
    time frame?


    Answer:


    Specify timeout=timeoutInMillis in the test''s @Test annotation to specify that
    a certain test should be finished by a given time frame.


    # 72: Can regular test classes'' constructors have arguments?


    Answer:


    No, regular test classes'' constructors cannot have arguments because JUnit won''t
    know how to instantiate them.


    # 73: What are set up methods in a test class?


    Answer:


    Set up methods are used for preparing the objects that are needed for the test
    and sharing them between test methods in the class.


    # 74: What are Tear down methods in a test class?


    Answer:


    Tear down methods are used for cleaning up objects and undoing whatever actions
    the tests performed; and don''t want other tests to get affected.


    # 75: Do you have to specify set up and Tear down methods?


    Answer:


    No, it is not required to set up and tear down methods. It is because they are
    optional for helping writing tests better, and are not a must. Tests can be used
    without them.


    # 76: If you specify a tear down method, do you also have to declare a set up
    method?


    Answer:


    No, since they are optional and the use of one does not necessitate the user of
    another.'
  merge: -1
