    # 107: What is the difference between ParallelComputer''s classes and methods
    options?


    Answer:


    Classes run tests in multiple threads, but all of the tests in a single class
    are run sequentially; Methods allow running everything in multiple tests.


    # 108: In what order are test methods of a class executed?


    Answer:


    Test methods of a class are executed in their declared order.


    # 109: What will happen if you have a class that contains setup or tear down method
    but no test methods, and attempt to run it?


