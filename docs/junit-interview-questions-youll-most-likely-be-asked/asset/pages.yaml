  md: 'JUnit Interview Questions You''ll Most Likely Be Asked


    # Answer:


    No it is not. This is because good unit tests generally test the behavior of an
    object, and not its individual methods, and so it makes more sense to have tests
    that use a few methods at a time, as part of testing a particular functionality
    of the object.


    # 120: What is an Isolated Unit Test?


    # Answer:


    An Isolated Unit Test checks the object in isolation from its other dependencies.
    This means that even if the object uses the network, file system, database, etc.,
    we do not allow it to actually use those objects, but still it thinks it is using
    them. By doing so, we isolate and make sure that any failures are caused by errors
    in the object itself.


    # 121: How many isolated tests can one expect to have run in a single second?


    # Answer:


    Usually, a thousand or even more, since isolated tests are usually very fast,
    which is another advantage to make sure your tests are truly isolating the objects
    they are testing.


    # 122: When will you write a Unit Test for a getter method?


    # Answer:


    Usually, if the getter does no other work than returning an object, testing it
    is not worthwhile. But if it does any extra work beyond that, it should be tested.


    # 123: JUnit tests can be abstract. What would be a good use case for that?


    # Answer:


    It can be used to test an interface. We can write a single test that checks if
    the implementation follows all of the interface''s expected behavior. Then, subclass
    tests the abstract test for each of the new implementations, providing it with
    a concrete instance to test against.'
