  md: '# 113: Does JUnit offer any native support for multithreaded tests?

    Explain.


    Answer:


    No, JUnit does not offer any native support for multithreaded tests instead; it
    leaves the handling of errors in different threads for the programmer and other
    tools. This is because the control of threads is not easy especially without knowledge
    of the domain problem at hand.


    # 114: How would you use a JUnit assumption in order to stop a test from executing
    unless it is the year 2011?


    Answer:


    AssumeThat(Calendar.getInstance().get(Calendar.YEAR), is(equalTo(2011)));


    # 115: What support for stubbing does JUnit provide?


    Answer:


    JUnit does not provide any support for stubbing, and leaves that for the programmer
    and external libraries.


    # 116: What support for mocking does JUnit provide?


    Answer:


    JUnit does not provide any support for mocking, and leaves that to the programmer
    and external libraries.


    # 117: What is JUnit?


    Answer:


    JUnit is a framework for unit testing in Java


    # 118: What is Unit Testing?


    Answer:


    Unit Testing is the act of writing automatic tests for testing units (usually,
    classes) in isolation from other objects.


    # 119: Would you say that having a test per each object''s method is good testing
    conduct?'
