    #  53: What will be the result of a test that throws AssertionError and why?


    Answer:

    The test that throws AssertionError will be marked as failed and not error, as
    opposed to what happens in with every other exception. This is because the scenes,
    AssertionError is used by all of JUnit''s assertion methods to signal that a failure
    has occurred.


