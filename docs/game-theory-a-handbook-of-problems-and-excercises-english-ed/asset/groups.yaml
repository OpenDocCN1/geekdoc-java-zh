    ## 1 Static games of complete information


    Static games with complete information are the simplest form of games, in which
    players act simultaneously and without coordination. For example, rock-paper-scissors
    is one such game, where players make their decisions simultaneously. Tic-tac-toe
    instead is not static, because moves unfold over time and each player gets to
    see the opponent''s previous move and can choose their next move accordingly.
    Complete information means that all players are aware of each other''s payoff.
    Usually, these games give the first taste of concepts such as the Nash equilibrium,
    and are also important to introduce mixed strategies.


    ### 1.1 Characteristics


    In a static game of complete information, the strategic choices of players are
    very simple. Each player must only select one of its available actions, and does
    so unknown to the other players, so that there is no extra information available
    to exploit. This means that the "pure strategies" of players are defined as their
    available actions. Generally, the scenario is considered with a finite set of
    actions, and formally speaking can be represented in normal form by:


    - a set of players, e.g., {P1, P2}

    - a set of strategies for each player, e.g., $Sp1 = \{A, B, C\}$ and $Sp2 = \{D,
    E\}$;

    - payoffs for all players, e.g. $u_{P1}(A, D) = 1, u_{P2}(A, D) = 2, u_{P1}(B,
    D) = 5, u_{P2}(B, D) = 6$,


    However, writing the value of $u_{P1}(s_1, s_2)$ for each pair of strategies is
    a bit tedious. It is more convenient and intuitive to adopt a matrix representation
    to enumerate the payoffs. Very often, 2-person games are considered, which makes
    this representation a bidimensional matrix (i.e., a real matrix instead of a hypercube).
    Note, however, that each cell must contain 2 values, i.e., the payoffs of both
    players. An exception to this is represented by special cases such as zero-sum
    games, discussed later. For this reason, it would be more appropriate to call
    this a bi-matrix.


    Game Theory – A handbook of problems and exercises


    Notably, if your exercise involves more than two players (they do sometimes) you
    should figure out a way to represent it properly. For example, a 3-person game
    where all players have 2 actions to choose from can still be represented with
    little effort, even on a bidimensional piece of paper, by writing "floor" of the
    2 x 2 x 2 structure to the left and the other to the right. Keep in mind that
    each game must contain 3 values.


    For the most common case of games involving two players with a finite number of
    strategies, payoffs are written in a bi-matrix as follows:


    | | D | E |

    |---|---|---|

    | P1 | 1, 2 | 3, 4 |

    | B | 5, 6 | 7, 8 |

    | C | 9, 10 | 11, 12 |


    Each cell contains payoffs, the left represents P1''s utility, while the right
    one is P2''s. In fact, the usual convention is that the first player chooses the
    row, and the second player chooses the column.


    **Example:** A classic problem in Game Theory is known as the Prisoner''s Dilemma.
    The original story of the problem relates to being caught and interrogated by
    the police separately, and thus facing the choice on whether confess to the crime
    (C) or keep the mouth shut and waive rights (M). This game can be written in normal
    form with the following bi-matrix, where the payoff values represent the years
    spent in jail under that outcome (hence the negative sign: little more, the years,
    yours).


    | | M | C |

    |---|---|---|

    | P1 | -1, -1 | -9, 0 |

    | C | 0, -9 | -6, -6 |


    The Nash equilibrium of this game is that they both play C, despite not being
    a particularly "good" outcome (especially, it is dominated by (M,M) in Pareto
    sense), hence the dilemma.


    ### 1.2 Best responses


    Best responses are a fundamental concept to Nash equilibria. A strategy s1 of
    P1 is a response to another strategy s2 of P2 if s1 is the one among P1''s strategies
    giving highest payoff to P1 when P2 plays s2. In other words, if there is no better
    strategy that P1 can play against s2. A "trick" to see responses is to look only
    at the payoffs of one player, covering those of the other players. Static games
    of complete information


    **Example:** Say we want to find best strategies for P1 in the Prisoner''s dilemma.
    We can look only at his payoffs and check the best response for both M and C of
    P2.


    | | M | C |

    |---|---|---|

    | P1 | -1, -1 | -9, 0 |

    | C | 0, -9 | -6, -6 |


    The best response of P1 to $M$ is to play $C$, since $0 > -1$. Similarly, $C$
    is also the best response of P1 to $C$, since $-6 > -9$. A common way of highlighting
    strategies that are best responses is to outline best responses of P1, and to
    underline best responses of P2, as done in the below.


    | | M | C |

    |---|---|---|

    | P1 | -1, -1 | -9, 0 |

    | C | 0, -9 | -6, -6 |


    ### 1.3 Nash equilibria in pure strategies


    The Nash equilibrium is the key concept of game theory. A Nash equilibrium is
    a joint strategy (i.e., a tuple of each player) where all players choose a best
    response to the others. Intuitively, this means that each player will not regret
    the choice made, given the outcome of the game. Since Nash equilibria imply that
    everyone is playing a best response, those are found in bi-matrix simply by inspecting
    which cells are both overlined and underlined. Nash equilibria in mixed strategies
    are explained in the next section.


    **Example:** In the Prisoner''s dilemma, $(C, C)$ is the only pure strategy where
    both players play a best response, which makes it the Nash equilibrium. For instance,
