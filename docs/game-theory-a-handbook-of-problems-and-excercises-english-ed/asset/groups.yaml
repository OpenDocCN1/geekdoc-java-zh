    # 6. Bayesian games


    The root node is Nature''s move about the bank being good or bad with probabilities
    $p$ and $1-p$. Below it, J moves without distinguishing between the two nodes
    and has two alternatives, $K$ and $C$. This result in 4 nodes where the bank moves,
    always choosing $L$ and $S$, so doing so with full awareness about their type
    but knowing what J chose as her move, which is why nodes are grouped like that


    2. Type-agent representation of player B decides a strategy as a pair of actions:
    what to do when good, and what to do when bad. Both elements can be either $L$
    or $S$. For example, $LL$ means the bank always chooses $L$. $LS$ means B chooses
    $L$ if good, $S$ if bad. This leads to the bi-matrix:


    | | LL | LS | SL | SS |

    |---|---|---|---||

    | J | 10.5, 0.5 | 10.5, 2-1.5p | 10.5+0.5p | 11.5, 2-0.5p |

    | C | 7.1, 0.1 | 5+2.1, 0.4-0.3p | 7.1+0.2p, 0.1+0.2p | 5+2.3, 0.4-p |


    3. If $p=0.2$ the matrix above becomes


    | | LL | LS | SL | SS |

    |---|---|---|---|--|

    | J | 10.5, 0.5 | 2.1, 1.7 | 10.7, 0.7 | 2.3, 1.9 |

    | C | 7.1, 0.1 | 5.42, 0.34 | 7.14, 0.14 | 5.46, 0.38 |


    Since $SS$ is a dominant strategy for B, the only (Bayesian) NE is ($C,SS$). For
    this simultaneous-move Bayesian game, it is enough to consider the BNE as the
    equilibrium point. Yet, if one wants want more advanced definitions, we see, that
    the game only has one NE, it must also be subgame-perfect. And, if a proper system
    of beliefs is included, it is also a PBE.


    Including a system of beliefs is tedious but not difficult for this case. There
    are 3 information sets in the tree of Figure 6.17, and they all comprise two nodes.
    So, as in the figure, we introduce a belief for J that tells whether she thinks
    the bank is bad (left node, $\mu_{bad}$) or good (right node, $\mu_{good}$). J
    cannot observe the move of B, because it is simultaneous, and hence that B will
    play a pooling strategy, so her can only know the prior, i.e., $\mu_{bad}=p$.
    The bank knows its own type, but cannot observe J''s move beforehand — we introduce
    two pairs of beliefs $\mu_C^{(bad)}$ on the left side and $\mu_C^{(good)}$ on
    the right side, that represent the beliefs of the bad bank and the good bank that
    J will play $C$. However, B knows that J plays $C$ at this BNE, so we get $\mu_C^{(bad)}=1$.


    Side note: this length analysis of the PBE confirms that this equilibrium concept
    is redundant when the game is simple that the standard BNE is enough. The PBE
    requires extra effort to effort the beliefs, but in this specific case they do
    not bring any additional value to the description.'
- md: '

    Exercise **6.15.** Lorenzo (L) is a student of a Game Theory course, for which
    a project must be submitted. The project will be graded from 0 (worst) to 8 (best)
    and can be done by a student alone or a group of two. Lorenzo plans to invest
    effort $e \in \{0, 1, 2, 3, 4\}$ on the project and wants to ask his classmate
    Maria (M) to join him. Lorenzo knows how to manage with Maria, their final grade
    for the project will be the sum of $e$ plus Maria''s contribution $m$ that depends
    on how good Maria is at this task. To convince Maria Lorenzo makes a first move
    to revealing the value of his intended effort $e$. Then, Maria makes her move,
    i.e., she says she wants to do with Lorenzo or not. If she says no, then her proficiency
    in Game Theory is revealed as $m=1$ if Maria is not very good in Game Theory and
    $m=3$ if she is good. If she says no, they work alone on different projects, which
    gives grade $2e$ to Lorenzo''s project. Maria''s individual project gets grade
    3 if she is not good at Game Theory, 6 if she is good. Maria is risk-neutral and
    her payoff is the grade of the project (regardless of whether it is with Lorenzo
    or alone); in case two alternatives give the same payoff, she prefers working
    with Lorenzo. Lorenzo''s payoff is his grade minus $e$; additionally, if he manages
    to do the project with Maria, his payoff will be increased by 2. Whether Maria
    knows Game Theory well: Lorenzo estimates this with probability $p$, while she
    does not master properly with probability $1-p$.


    - 1. Determine what players of this game have a type and write down the extensive
    form representation of this game.

    - 2. If a type-agent representation (the strategy is an $n$-tuple of alternatives,
    one per type) of player Maria is given, how many strategies does she have? How
    can their number be reduced by considering only Maria''s strategies with an acceptance
    threshold for Lorenzo''s offer?

    - 3. Assume the $p$ of Lorenzo''s estimate about Maria has good knowledge of Game
    Theory is strictly between 0 and 1. What is the Bayesian Nash equilibrium of this
    game?


    # Solution


    - 1. Players are L and M and only M has a type, which can be either “good” or
    “bad”. The extensive form is a tree, shown in Figure 6.18, where first move is
    Nature''s determining M''s type (good with probability $p$, bad with probability
    $1-p$). Then, mover is L with 5 alternatives (the possible values of $e$). Finally,
    M says (Y) or no (N).

    - 2. In principle, M has two types and she can say Y or N to any of the 5 offered
    by L. there are 32 possible strategies that a type can play, and overall there
    $32^2=1024$ possible strategies of the type-agent M. However, it is sensible for
    M to play strategies that are of the form: “Play Y if $e \ge \theta$, otherwise,”
    where $\theta$ is a threshold value in L''s offer. There are 6 possible such strategies
    (from always say $N$ if $\theta = \infty$ to say $Y$ if $\theta = 0$). In this
    way, there are 36 possible strategies of the type-agent $M$.

    - 3. $M$ will accept an offer of $e$ if her return is as high as her other option,
    doing the project alone. This means that a “good” $M$ will accept $e \ge 3$, since
    she will get 6 (as the other option), while a “bad” $M$ will be satisfied even
    by $e = 2$. Thus, $e \le 1$ will always be rejected by $M$. $L$ does the project
    alone if $e \ge 3$, the offer will be accepted by both types of $M$, yielding
    a utility for $L$ $p(5 - e) + (1 - p)(3 - e) = 2p + 3 - e \le 2p$, while $e =
    2$ yields $p \cdot 2 + (1 - p) \cdot 1 = p + 1$. Since $0 < p < 1$ the last choice
    is the best for $L$. $L$ will offer $e = 2$ that is accepted by bad $M$ and rejected
    by good $M$.


    Exercise 6.16. A student (S) wants to attend a seminar by a professor (P). The
    seminar is held in the Aula Magna, but can also be attended online. Because of
    an ongoing pandemic, P is supposed to check a green pass for whoever enters the
    Aula Magna, and students are supposed to have one. So the first choice is made
    by S who can display (D) their green pass, or keep it hidden (H). Whatever this
    choice, P can decide to admit (A) the student to the Aula Magna, or keep S and
    tell them to go online (O). To complicate things, P knows that some students have
    a fake pass, and the probability of S''s green pass being fake is $p=0.1$ S knows
    if their green pass is authentic or not. The fake pass looks real, so P has no
    way to tell a fake green pass apart from a valid one. The payoffs are eventually
    computed as follows. Case 1: S shows a valid pass. If the student is admitted,
    S and P get +10. If S shows their pass and P does not admit, P gets -50. Every
    other payoff of either S or P is 0. Case 2: S holds a fake pass. Then P gets a
    negative payoff if the student is admitted. This is -100 if S showed the green
    pass, while if the student is admitted without showing the (fake) green pass,
    their payoffs are -50 for S and -200 for P, respectively. If S shows a fake pass
    but is eventually not admitted, S''s payoff is -200. Every other payoff of either
    S or P is 0. All of these values, including the prior, are common knowledge among
    the players.


    - 1. Represent the game in extensive form.

    - 2. Represent the game in normal form with a type-agent representation of S.

    - 3. Find the PBEs in pure strategies and discuss whether they are separating
    or pooling.


    # Solution


    - 1. The extensive form is a tree, shown in Figure 6.19.

