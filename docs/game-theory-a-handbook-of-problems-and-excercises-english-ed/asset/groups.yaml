    # # 4 Lotteries and Other Variations


    In this chapter, we review some theoretical extensions that can occasionally take
    place in games. These do not represent very advanced theoretical concepts, and
    their presence in a game is certainly not standard. Whenever they are present,
    they should not be regarded as difficult hurdles. Most likely, they can be connected
    to other approaches previously discussed in other chapters. Thus, the way to tackle
    them is to “unplug” them from the game or to trace back to another standard configuration.


    # ## 4.1 Lotteries


    Usually, random players do not like random events, since they make the predictions
    about future evolutions of the game more difficult. However, in certain cases
    it is unavoidable to include some random externalities in a game. This is especially
    true in economic and social sciences, but also be the case for information engineering
    scenarios, for example of the transmission over a wireless channel whose attenuation
    is a random parameter.


    For the sake of simplicity, discrete random variables are often considered, in
    line with the games usually having finitely many strategies and so on. The discrete
    probability distribution of such random variables is often referred to as a lottery
    and the actual value is said to be determined by a virtual player called Nature.
    We see in the last chapter how this specific situation can be declined for Bayesian
    games, where a random choice of the types for the Bayesian players made by Nature
    is the spark that ignites the evolution of the game. Also, every deterministic
    outcome can also be seen as a degenerate lottery, where only one of the events
    happens, with probability 1.


    While there are several possible approaches to compare uncertain outcomes, especially
    related to human behavioral studies, most technical applications of game theory
    find it convenient to take expectations and expected utility hypothesis to make
    such comparisons. This is true not for game theory applications that do not involve
    human beings (but rather algorithms, intelligent systems, or transmission devices
    in a network, whose rationality is hardly questionable) but also in relationship
    to the theory of $vNM$ utility, based on a theorem by von Neumann and Morgenstern.
    This theorem shows that the'
  - '[PAGE 73]


    only way to satisfy four sensible axioms of comparisons among lotteries is to
    translate the same comparisons to the expectation over the lotteries of the utility
    functions.


    In other words, when a game dictates a choice by the virtual player Nature, rational
    players consider the resulting lottery as equivalent to a deterministic outcome
    equal to the expected value. When solving such a game, every lottery can be replaced
    with an equivalent degenerate lottery achieving the expected value, thus removing
    every random element. From the perspective of solving the game, this is neither
    surprising nor puzzling, usually. Indeed, many other procedures imply expected
    values of the utilities (such as mixed strategies, or Bayesian games) and this
    is most likely based on the very same theoretical reasons of the aforementioned
    expected utility hypothesis. Still, the procedure is fully consistent as nested
    expectations are linear and just result in a single big expected value.


    # 4.2 Tampering with elections


    A side topic to game theory is the declaration of preferences, which is usually
    represented by utility functions. But actually, this is just one possible way
    of expressing preferences in a quantitative form. Alternatively, one can explicitly
    list the preferences for all the alternatives from best to worst (or the other
    around). As an important application to political systems, game theory is also
    able to investigate the issue of strategic voting, which essentially means that
    some electors lie about their preferences in order to play the system towards
    choosing a better candidate.


    Even though this is a really common scenario during elections, even the candidates
    promote the electors of unexpectedly weaker "not to disperse their votes" and
    choose them instead, this is no means limited to that, and in principle can be
    applied to any system multi-objective optimization is performed (i.e., multiple
    and possibly contrasting criteria are used to decide what is out of multiple choices),
    which is a relevant issue in artificial intelligence or cross-layer optimization.


    It may seem paradoxical that changing a preference from truthful to insincere
    improves the result for a voter, since it violates monotonicity and/or transitivity
    of preferences. The fact is, the aggregate of multiple preferences is not transitive
    in general, due to the presence of so-called Condorcet cycles, i.e., situations
    where a crowd of voters prefers B to A, C to B, but also A to C. In addition,
    it can be proven that no electoral system (or more in general, a way to aggregate
    preferences) is immune from other paradoxes that would incentivize strategic voting.'
