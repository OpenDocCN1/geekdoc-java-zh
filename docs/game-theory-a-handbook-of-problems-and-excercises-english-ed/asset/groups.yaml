    ## 5. 多阶段游戏


    奖励/惩罚方法，这通常转化为对 $\delta$ 的要求，其必须高于某个特定值。请记住，在游戏的每一次演化中多次执行纳什均衡（NE）的标准情况也始终作为一种子博弈完美均衡（SPE）存在。


    ## 5.3 无限重复博弈


    对于无限重复的游戏情况，结论更加有趣。它并不需要一个由两个或多个具有明确差异的纳什均衡组成的信誉奖励惩罚方法，而是可以通过所谓的“冷酷触发”（grim trigger）策略凭空产生。这对于具有单个纳什均衡的重复博弈是成立的，而且确实被应用于囚徒困境的类中。无论基础游戏是什么，通常假设玩家都有合作选项和背叛选项，在囚徒困境中，这两个恰恰是与警察合作或保持沉默。只有合作不是阶段博弈的纳什均衡，而相互背叛是。


    在无限重复此类阶段博弈的迭代博弈中，发现“永远纳什均衡”当然是一个可能的 SPE。但永远合作也可以建立为另一种 SPE，或者更准确地说是其均衡路径。为了证明这一点，不能诉诸类似于逆向归演的方法，因为没有最后一个阶段可以开始。这个想法是玩家从初始合作开始，他们“达成一致”（再次强调，这种一致仅存在于脑海中，因为他们并没有实际交流），背叛玩家将在游戏的剩余时间里受到惩罚，即永远。这在形式上被定义为“冷酷触发”策略，即只要之前所有阶段的结果都是相互合作，就一直合作，否则就背叛。之所以这样命名，是因为一旦触发器被按下，就没有回头路了。


    这种策略应当永远合作成为均衡路径。然而，它并不能完全防止玩家背叛——自私的玩家自然会被诱惑做出短视的背叛，即在阶段博弈中进行背叛。背叛必须存在，而且这实际上是合作选项一开始不是局部纳什均衡的原因。然而，如果这个玩家也相信另一个玩家正在采用冷酷触发策略，那么玩家就会预见到短视背叛对当前阶段是有利的，但会导致未来收益的减少。因此，只要永远合作的效用高于现在进行自私背叛并面临未来的永久惩罚，冷酷触发就是有效的。


    值得注意的是，这和之前一样取决于奖励与惩罚之间的差异，以及折扣因子的值。如果 $\delta$ 较低，即使是永久惩罚的威胁看起来也不可信——这可能也适用于宗教假设下的伦理结论。从博弈论练习的更世俗的角度来看，这意味着通常的要求会归结为计算建立合作的最小
    $\delta$，这意味着折扣因子必须落在区间 $(\delta_{\min}, 1]$ 内才能获得合作。


    除了合作与背叛之间简单选择的标准情况外，只要有比永久背叛更复杂的惩罚可用，就可以创建更复杂的情况。事实上，永久背叛似乎已经足够可怕了，但可能存在某种即时惩罚以及背叛。这会导致以更低的
    $\delta$ 建立合作。为了更好地理解为什么，再次考虑伦理的例子。社会合作规则通常通过威胁惩罚来建立。惩罚越即时，合作越越。如果你希望一个社会表现良好，例如不通过环境污染导致全球变暖，你可以声称这将导致地球永久破坏。遗憾的是，对于寿命有限的老一代来说，这种对地球的永久破坏似乎并不威胁，他们并不关心是否会给孙辈留下一个被污染的地球。因此，在此基础上增加额外的惩罚，如将他们送入监狱或让他们支付大量资金，可能会更有效。


    这些原因实际上还可以扩展到不仅获得合作，而且得益于弗里德曼定理* 获得一个更复杂的结果。简单来说，该定理指出，如果折扣因子足够高，玩家进行无限轮相互作用的情景可以被引导至满足特定条件的策略任何线性组合。该条件自然是，所有玩家的最终收益在帕累托意义上（即逐元素逐地比较）必须优于阶段博弈纳什均衡时的收益。显然，不可能说服一个玩家坚持一种等待比纳什均衡收益更差的永久收益的策略：在此时，玩家将背叛并永远执行纳什均衡。然而，只要
    $\delta$ 足够高，任何导致所有玩家期望收益高于纳什均衡的动作线性组合（即使在随后的轮次中）都是可持续的。该定理本质上将上述冷酷触发的推理推广到了这种目标不是执行基础合作，而是可能在多个回合中执行混合策略和/或不同策略的情况。


