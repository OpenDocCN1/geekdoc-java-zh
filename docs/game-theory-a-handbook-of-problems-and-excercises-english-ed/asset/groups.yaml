    ## 4. Lotteries and Other Variations


    ### 4.3 Stackelberg games


    This is a fancy name for transmuting static games of complete information into
    dynamic games. In practice, this is not a separate topic, since it is fully covered
    by the case of sequential games discussed before. However, it is sometimes encountered
    in information technology applications, possibly the name of German scientist
    Stackelberg sounds very simple-y.


    A Stackelberg game is nothing but a simple sequential game, but represented through
    a bi-matrix that resembles the normal form of a static game. In reality, this
    is not the correct way to put a dynamic game in normal form. As discussed before,
    a dynamic game generally has a much more complex normal form due to the combinatorial
    explosion of strategies available to the players. However, a Stackelberg game
    is just meant to follow a very simple game dynamics, and therefore a slight abuse
    of notation is tolerated.


    To give an example of the representation of a Stackelberg game, consider the following
    bi-matrix of payoffs.


    | | C | D |

    |---|---|---|

    | A | 4, 3 | -2, 0 |

    | B | 0, 0 | 1 |


    The players are usually called Leader (L) and Follower (F), which reflects their
    order of play. Thus the previous table is not to be read as a normal form, in
    which case the game would have three NE (two in pure strategies plus one in mixed
    strategies, since it would be a coordination game), but rather as corresponding
    to the following decision tree, which is the proper extensive form of the game.


    ![](img/adcae123bfc4ba205d992d916e340a6b_74_0.png)


    Most notably, the game has a unique “solution,” often referred to as the Stackelberg
    equilibrium, which is actually nothing but the result of backward induction (and
    therefore an SPE). In practice, however, Stackelberg representations are not very
    rigorous and just give the equilibrium path. In other words, it is common practice
    to say that the Stackelberg equilibrium of the previous game is $(A,C)$, even
    though the proper SPE notation, i.e., $(A,CD)$, is more rigorous and must specify
    two actions in the follower''s strategy (F must plan a move in two information
    sets, both singletons).


    In short, Stackelberg games are not a separate theoretical topic, they just correspond
    to comparing static and dynamic games and possibly drawing design conclusions,
    such as whether it is worth that a player of a 2-person game acts as a leader
    and communicates its choice to the other, who is forced to become a follower.
    This is often related to whether the “Stackelberg equilibrium” is better than
    the regular NE. In the example made before, an engineer would surely argue that
    from a practical standpoint, the Stackelberg approach avoids ambiguity on what
    is the final result, since instead of three equilibria, we only have one, which
    is also giving the highest payoffs.


    For this reason, Stackelberg equilibria are often popular in some research fields
    like network engineering, since they obtain a more definite result that can be
    better for algorithmic reasons. Yet, the reason why they achieve this result is
    not very deep, it is simply thanks to the good properties of backward induction,
    which is the real solution instrument here.


    ## 4. Lotteries and Other Variations


    ## Exercises


    **Exercise 4.1.** Students Luca (L) and Marco (M) are enrolled in the same degree,
    which involves a mandatory internship; they can spend it in either a company or
    a university lab. Students are allowed to apply to *only one company*. If the
    company approves the application, the student can spend the internship there.
    Otherwise, the internship must be done in a university lab. L and M are interested
    in two companies: Almighty Solutions Ltd. (A) and Brave computing Inc.(B), and
    they know that nobody applied for them. The companies are not players in the game:
    Their decision is a random process independent for each candidate. A company is
    more likely to hire better qualified applicants, which happens as. If a company
    only receives one application, they will accept it with 50% probability. If both
    L and M apply to the same company, the acceptance probability of L (who is more
    qualified) is 50% while M''s is 20%. However, these events are independently drawn,
    and the company may hire them (or neither of them). Both L and M have the same
    evaluations of the companies: Doing the internship at A is worth doing while at
    B gives utility 110, and being rejected 0. Additionally, if they manage to spend
    their internship together at the same company, their utility is doubled. Finally,
    L and M choose their application independently. They are rational players and
    what described above is common knowledge to them.


    - 1. Represent this game in normal form.

    - 2. What is the Nash equilibrium of this game in pure strategies?

    - 3. Find all the Nash equilibria.


    ## Solution


    1. This is a static game of complete information. As mentioned, the only players
    are L and M, since the behaviors of companies can be modeled as random, lotteries.
    Thus, the normal-form representation is a bi-matrix, where the set of players
    is {L, M} and their strategy set is $S_L = S_M = \{A, B\}$.


    The payoffs in the normal form are written by considering the expected value of
    utilities. If both choose the same company, neither of them is hired with probability
    40%; only L is hired with probability 40%; and finally, (i) only M being accepted
    or (ii) both of them accepted. This means that $u_L(A, A) = 40+20=60$, $u_M(A,
    A) = 30$. For $(B, B)$ the utilities can be computed with the same approach, but
    are multiplied by 1, since company B is better than A. If they choose different
    companies, the one going to A gets expected utility of 50, while the other gets
    55.


    | | A | B |

    |---|---|---|

    | L | 60, 30 | 50, 55 |

    | B | 55, 50 | 66, 33 |


    2. It can be seen that there are Nash equilibrium in pure strategies. The best
    response of L is to copy M''s move, while M does the opposite.


    3. Then, there must be Nash equilibrium in mixed strategies, which has both A
    and B in its support for both players. To find this Nash equilibrium, consider
    $\lambda$ and $\mu$ as the probabilities that L and M play A, respectively, and
    the indifference principle. For player L, it must be $u_L(A, \mu) = u_L(B, \mu)$,
    i.e.


    $60\mu + 50(1-\mu) = 55\mu + 66(1-\mu)$


    which leads to $\mu = 16/21$, while for player M the condition $u_M(\lambda, A)
    = u_M(\lambda, B)$ must hold, i.e.


    $30\lambda + 50(1-\lambda) = 55\lambda + 33(1-\lambda)$


    which leads to $\lambda = 17/42$.


