    # Static games of complete information


    Utilities in mixed strategies are computed by taking expectations over the aforementioned
    probabilities. For example, in the Prisoner''s dilemma, joint strategy (0.9M +
    0.1C, M) gives P2 a payoff equal to


    $u_{P2}(0.9M + 0.1C, M) = 0.9u_{P2}(M, M) + 0.1u_{P2}(C, M) = 0.9(-1) + 0.1(-9)
    = -1.8.$


    The concept of strictly dominated strategies applied to mixed strategies too,
    both in the sense that mixed strategies can be strictly dominated and another,
    pure. For some exercises, the latter case might be useful, but unfortunately spotting
    that a pure strategy is strictly dominated by a mixed strategy is generally not
    easy to do, since mixed strategies are not explicitly reported on the matrix,
    so it requires a bit of effort.


    Nash equilibria in mixed strategies are found by applying the indifference principle.
    This states that a mixed strategy at the Nash equilibrium gives the same payoff
    to the other player for all moves. That is, if P1 plays $A + (1-p)B$ and P2 can
    choose between moves $\{D, E\}$, the condition to satisfy


    $u_{P2}(p, D) = u_{P2}(p, E),$


    where $p$ is short notation for $A + (1-p)B$.


    **Example:** in "Odds and Even" both players choose a number, between 0 and 5,
    and so simultaneously (in rock-paper-scissors). The number can be odd (O) or even
    (E). One player, P1, wins and gets +1 if the sum of the numbers is even; then
    other, P2, wins instead if the sum is odd. The loser gets payoff -1. Conveniently,
    it turns out that the sum relationships between odd and even numbers satisfy certain
    mathematical properties that allow to represent just the choice of $O$ or $E$
    as the pure strategies and the normal form of the game is shown through the following
    bi-matrix


    | | O | E |

    |---|---|---|

    | P1 | 1, -1 | -1, 1 |

    | E | -1, 1 | 1, -1 |


    In games, with a structure like that, i.e., one player likes when the selections
    are the same, but other prefers that they are different, are called coordination
    games. Compare this with a coordination game, where both players want them to
    be the same. A coordination game does not have Nash equilibrium in pure strategies,
    since all the joint strategies imply that one of the players has a regret and
    wants to change the outcome. However, an equilibrium in mixed strategies can be
    found by applying the indifference principle. P1 should play a mixed strategy
    $pO + (1-p)E$ such that P2''s payoff is the same playing either $O$ or $E$. This
    concept leads to


    $u_{P2}(p, O) = u_{P2}(p, E)$


    that is


    $pu_2(O, O) + (1-p)pu_2(E, O) = pu_2(O, E) + (1-p)pu_2(E, E)$


    Plugging in the numbers,


    $p(-1) + (1-p)(+1) = p(+1) + (1-p)(-1)$


    which is solved as $p = 1/2$.


    Likewise, P2 should play a mixed strategy $qO+(1-q)E$ whose payoff is the same
    playing either $O$ or $E$. For symmetry reasons, $q = p = 1/2$. This means that
    the best player a game can do is to randomly play even or odd with equal probability,
    which explains why the "Odds and Evens" game is used as a poor man''s replacement
    for a fair coin flip (a very poor man if it is penniless)


    Notice for all $p < 1/2$, for P2 is more convenient to play $E$, while for all
    $p > 1/2$ $O$ is P2''s best response. P2''s best response can then be represented
    as a step function of $p$. Since the opposite applies to P1 (for $p < 1/2$ he
    should always play $O$, for $p > 1/2$ always $E$), a plot of best responses looks
    as follows.


    ![](img/adcae123bfc4ba205d992d916e340a6b_11_0.png)


    Figure 1.1: Mixed Nash equilibrium of the game.


    Now, the most famous game theoretic result, Nash theorem, states the existence
    of at least one NE, possibly in mixed strategies, for each game of complete information
    where the players have a finite set of available actions. Unfortunately, this
    is an existence theorem, and does not say whether this NE is unique, or there
    are many. This implies that in certain situations the theorem can be promptly
    to justify the existence of an NE in mixed strategy, for example, in discoordination
    games that are without NE in pure strategies, hence, they must have one in mixed
    strategies, but not to limit their number.


    # 1. Static games of complete information


    Also, for 2-person games where the sets of available actions is binary for both
    players, some standard structure can be recognized, as games similar to the prisoner''s
    dilemma, where one of the strategies is strictly dominated and therefore there
    is only one NE (in pure strategies), the result of IESDS. Or, coordination games,
    that can be shown to have a mixed strategy NE in addition to the diagonal of the
    payoff matrix. Moreover, when there are only 2 pure strategies to consider, say
    $A$ and $B$, the indifference theorem is also simple to apply, since all non-degenerate
    mixed strategies must have a support consisting of $A$ and $B$, indeed.


    When the game has more than 2 players, or more than 2 pure strategies per player,
    it is not always easy to recognize a known structure instead, and very often it
    is required to do some tedious exploration of the strategy space. This is especially
    true for applying the indifference theorem, that can consider extra requirements.
    First of all, there are different combinations possible; such as of three pure
    strategies $A$, $B$, and $C$, there are mixed strategies whose support is just
    of two strategies, such as $A$ and $B$, or $A$ and $C$, and also there are mixture
    where all strategies $A$, $B$, and $C$ belong to the support.


    Also remember that if, at an NE, a player chooses a mixed strategy that combines
    only $A$ and $B$, it must not only hold that the player is indifferent between
    $A$ and $B$, but also the resulting payoff must be not lower than what achieved
    when playing $C$, otherwise we would have a deviation toward another better strategy,
    i.e., $C$, which negates that this is an NE.


    # Exercises


    Exercise 1.1. Jorah (J) and Khalesi (K) are conquering cities in the continent
    of Essos. They are leading their armies to the coast, and they can choose between
    the enemy cities of Meeren (M) or Yunkai (Y); each of them has the opportunity
    to attack only one city. The inherent values of the two cities are $v_M = 5$ and
    $v_Y = 3$, respectively. If a city is attacked, by just one army, victory is certain
    and the city is conquered. They separately decide what city to attack, and it
    is impossible for them to communicate in what they decide. Also, while both want
    to conquer as many cities as possible, so their utility $u_K$ is the sum of the
    values of the captured cities. While J has this in mind, he also will be closer
    to K, so his utility is the sum of the values of the captured cities.


    1. What kind of game is this? Write down its normal-form representation.

    2. Find out all Nash equilibria in pure strategies.

    3. Find out all Nash equilibria of this game.


    # Solution


    1. This is a static game of complete information. The normal-form representation
    can be shown as the following bi-matrix, where the set of players is {J, K} and
    their strategy set is $S_J = S_K = \{M, Y\}$.


    | | M | Y |

    |---|---|---|

    | M | 15, 5 | 8, 8 |

    | Y | 8, 8 | 13, 3 |


    - Nash equilibria are found when both J and K play a best response to the other''s
    move. J''s best responses to K''s move are underlined, K''s best responses are
    overlined.


    2. Thus, there must exist a Nash equilibrium in mixed strategies. This can be
    found by setting a mixed strategy $(p, q)$ where $p$ and $q$ the respective probabilities
    that J and K play $M$. The values of $p$ and $q$ at the Nash equilibrium can be
    found through the indifference principle, since a mixed strategy contains both
    strategies $M$ and $Y$ in its support. Denoting simply with $p$ the mixed strategy
    “play $M$ with probability $p$ and $Y$ with probability $1-p$” (and for $q$):


    - player $K$, the condition to be satisfied is $u_J(M,q) = u_J(Y,q)$ which results
    in


    ```

    $15q + 8(1-q) = 8q(1-q)$

    ```


    that is $q = 5/12$;


    - player $J$, the condition is $u_K(p,M) = u_K(p,0)$ which results in


    ```

    $5p + 8(1-p) = 8p + 3(1-p),

    ```


    that is $p = 5/8$.


    ![](img/adcae123bfc4ba205d992d916e340a6b_14_0.png)


    Figure 1.2: Mixed Nash equilibrium of the game.

