    | W | 0.2, -0.2 | 0.2, 0.8 | 0, 0 |


    - 纯策略下的纳什均衡（NE）为 $(D, W)$ 和 $(W, D)$。我们可以证明选择 $B$ 被 $D$ 和 $W$ 严格支配。


    - 还存在一个混合策略均衡，两名玩家都混合 $D$ 和 $W$。混合策略通过使支持集中的策略保持无差异，并相应将期望收益设置为相同值来找到。如果 $\alpha$
    是玩家选择 $D$ 的概率，我们有 $0.8(1-\alpha) = 0.2\alpha$，解得 $\alpha = 4/5$。


    图 4.2：该游戏的混合纳什均衡。


    # 4. 抽票与其他变体


    **练习 4.3。** Jean (J) 和 Kate (K) 想买一个时尚品牌的设计款手包，但在镇上很难找到。只有两个地方卖这种手包：市中心的一家零售精品店
    $R$，或者购物广场的 $S$ 商店。这两个地点都恰有一个手包，$J$ 和 $K$ 必须去其中任一地方；此外，如果他们去同一个地方，他们有 50/50 的概率买到手包（这取决于谁先到达商店，这是完全随机的）。他们对手包的评估值分别为
    J 为 600，K 为 450。手包的官方价格为 250 欧元，但众所周知商店 $R$ 以价格打 20% 折闻名。购买手包的效用是评估值减成本；没买到手包的效用为
    0。


    1. 写出该游戏的标准式。

    2. 找到该游戏在纯策略下的所有纳什均衡。

    3. 找到该游戏在混合策略下的所有纳什均衡。


    # 答案


    1. 玩家集合为 $\{J, K\}$。他们的策略集为 $S_J = S_K = \{R, S\}$。当 $J$ 和 $K$ 选择相同的策略时，他们的收益可以作为期望效用计算。用的话说，假设有两种情况：(i)
    顾客有 50% 的概率获得一个价值 $V$ 并支付价格 $P$ 的手包（另外 50% 的情况下空手而归）；或 (ii) 确定获得质量较低的手包，其价值为 $V/2$
    但价格减半。按照博弈论常用的效用理论，(i) 和 (ii) 的结果完全相等的（用经济学术语说是完全替代品）。因此，游戏的标准式可以用以下双矩阵表示：


    | | R | S |

    |---|---|---|

    | J | 200, 125 | 400, 200 |

    | S | 350, 250 | 175, 100 |


    2. 该游戏在纯策略下有 4 种可能的结果。纯策略下的纳什均衡为 $(R, S)$ 和 $(S, R)$。


    3. 除了这些，还存在混合策略均衡。要找到它，考虑两个玩家都采取混合策略，令 $a$ 和 $b$ 分别为 $J$ 和 $K$ 选择 $R$ 的概率（因此他们以
    $1-a$ 和 $1-b$ 的概率选择 $S$）。这两个值通过建立 $u_J(1,b) = u_J(0,b)$ 和 $u_K(a,0) = u_K(a,1)$
    得到：

    $$125a + 250(1-a) = 200a + 100(1-a) \implies a = 2/3,$$

    $$200b + 400(1-b) = 350b + 175(1-b) \implies b = 3/5.$$


    图 4.3：该游戏的混合纳什均衡。


