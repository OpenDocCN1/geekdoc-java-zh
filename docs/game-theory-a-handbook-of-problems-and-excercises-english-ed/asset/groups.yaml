    ## 1. 完全信息静态博弈


    **练习 1.10.** 奶奶在家庭聊天群里写道：“我没有蛋来做我的特制蛋糕了。有人能去杂货店买一些吗？”唯一能回答这个请求的家庭成员是孙辈 Abel、Bela
    和 Claire（即 A、B 和 C）。他们知道自己是这三个可以帮助奶奶的人，并且下文的所有内容对他们来说都是共同知识。他们需要现场决定是否为奶奶去杂货店买蛋（G）或不去（N），且互不考虑。他们都意识到去杂货店的成本为
    $c=1$，待在家里成本为 $c=0$。如果奶奶不需要买任何蛋，即使只有一个人去，她也能制作蛋糕。然而，如果没有人去买蛋，奶奶就无法制作她的特制蛋糕，因此整个家族的收益为
    0。如果奶奶自己做蛋糕，每个人都能获得 4 的收益（包括那些没有帮助她的人）。收益为利益减去成本，因此 A、B 和 C 最自私的选项是：让有人帮助奶奶，而他们只需要吃蛋糕即可。


    - 1. 写出该博弈的标准型（normal form）。

    - 2. 找到纯策略纳什均衡。

    - 3. 找到一个混合策略纳什均衡，使得所有玩家采取两种动作的概率均非零。


    ## 解 Solution


    - 1. 参与人集合为 {A, B, C}。所有人的策略集均为 $S=\{G, N\}$。收益矩阵是三维的（一个 $2 \times 2 \times 2$
    的立方体），可以写为：


    | A 选 G | A 选 N |

    |---|---|---|---|

    | | G | N | G | N |

    | B | 3, 3, 3 | 3, 3, 4 | 4, 3 | 4, 3 |

    | N | 3, 4, 4 | 3, 4, 4 | 0, 4 | 0, 0 |


    - 2. 纯策略纳什均衡为 ((G, N, N), (N, G, N), (N, N, G))。事实上，唯一没有人后悔的情况是当一名家庭成员去杂货店而其他人不去时。


    - 3. 为了找到混合策略纳什均衡，我们假设 A 选择 G 的概率为 $p$（以概率 $1-p$ 选择 N），B 和 C 也是如此。无差异原则保证每个玩家的收益必须处于选择
    G（如上所述保证收益为 1）和选择 N 之间。选择 N 的期望收益是多少？不失一般性地假设 A 选 N。以概率 $(1-p)^2$，B 和 C 都不去买蛋，收益为
    0。以概率 $1-(1-p)^2=2p-p^2$，除了 A 之外有人有人去买蛋，在这种情况下 A 的收益将是 4。因此，我们必须要求 $3 = 8p - 4p^2$，这意味着
    $p^2 - 2p + 0.75 = 0$。解为 $p = 1 - \sqrt{0.25} = 0.5$。还有一个解 $p = 1.5$，但作为概率它是不可接受的，因为
    $p$ 概率必须小于 1。因此，得到的混合策略纳什均衡是：所有玩家选择相同的策略，即以概率 $p = 0.5$ 选 G，以概率 $1-p = 0.5$ 选
    N。


    ## 1. 完全信息静态博弈


    **练习 1.11.** Agatha (A) 和 Bruno (B) 是两个兄妹。他们拥有一套火车模型（T），通常一起玩。他们这样做时的各自效用为 $u_A(T,T)
