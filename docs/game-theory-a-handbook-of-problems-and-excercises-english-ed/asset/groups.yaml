    ## 62 Game Theory – A handbook of problems and exercises


    **Exercise 3.9.** A university student association consists of a Sorority (S)
    section and a Fraternity (F) section; female members belong to the sorority, male
    members to the fraternity. The semester break is approaching: it is a period of
    6 weeks (week 0 to 5) when the association can throw parties, and they do so according
    to this rule: every week, the sections take turn in deciding whether to organize
    a party P or N. As one section chooses $P$, they throw a party for all members
    of both sections and the week is after the other''s turn to decide. If one section
    chooses $N$, both sections agree that parties are over for that semester. The
    first decision is assigned to S at week 0. Throwing a party implies a cost 10
    for the organizing section, however, it is also enjoyable for both sections, so
    they get a positive *fun* value. The ultimate utility of the sections is their
    benefit (min cost). For the party at week 0 is 25. Next, throwing and more parties
    clearly give diminishing fun; thus, apply a discount factor of $\delta = 0.6$
    for every party organized at week $j$. Note that, at week 6, S is forced to play
    N since the semester is over.


    - 1. Write the game in extensive form.

    - 2. Find out the backward induction outcome of the game. Prove it is unique.

    - 3. Discuss what would happen if there is no limitation to the length of the
    semester (and thus the length of the game), i.e., students can go on to arbitrarily
    large number of weeks. Can you find subgame perfect equilibrium?


    ## Solution


    - 1. The game is like a centipede game, whose extensive form is depicted in Figure
    3.9. The payoffs for F are on the top, and on the bottom of S.


    | week 0 | week 1 | week 2 | week 3 | week 4 | week 5 |

    |---|---|---|---|---|---|

    | S (P) | F (P) | S (P) | F (P) | S (P) | 29.584 |

    | N | N | N | N | N | |

    | 0 | 16 | 30 | 34.4 | 27.6 | |

    | 0 | 26 | 30 | 39 | 34.4 | 37.64 |


    Figure 3.9: Extensive form of the game.


    - 2. To apply backward induction, note that the last level is actually week 5,
    since both choices of F directly lead to a leaf node. Since 37.64 > 29.584, F
    prefers N. Actually this means that at week 4, S must choose between F leading
    to a leaf node with payoffs 27.6 or N leading to a leaf node with payoffs 34.4;
    thus, S chooses N. Anticipating that, backward induction implies that both players
    choose (P, P, N) as their strategy. There is a subtle difference between the equilibrium
    path and the full SPE. The equilibrium path that S starts P at week 0, and so
    F at week 1, keeping parties until week 4, when S plays N ending the game. However,
    the specification of the SPE must also include that, given the chance, F would
    have played N at week 5 – the thing is that does not happen because the game ends
    earlier. Or only if F chooses N for week 5, they play a rational choice in every
    possible subgame. Finally, notice that, since all terminal payoffs are different,
    theoretical conditions guarantee that the SPE is unique.


    - 3. If there is no limit to the weeks (i.e., the branches in the tree from the
    side of P), backward induction cannot be applied as there is no end node. Still,
    we can apply sequential rationality inspired by the previous result. Specifically,
    the game has a subgame perfect equilibrium because rational players are immediately
    aware that the game cannot go beyond week 4. Indeed, the first player S is to
    move during even-numbered weeks, and it is evident (to us, but also to the rational
    player S) that the achievable payoffs in playing N at week 4 are always lower
    than what can be achieved by playing N at week 5. Similarly, the second player
    F is to move during odd-numbered weeks and their payoff cannot go beyond what
    is achieved by playing N at week 5. Thus, the game is bound to be finished before
    week 6 even without the finite horizon imposed by the termination rule of the
    semester.


    **Exercise 3.10.** (A) and Bernard (B) are doing a joint project. They are both
    rational players and they know it. At day 1, the project has an initial value
    of $v1$. Starting from day 1, they can either unilaterally call the project is
    ended $(C)$ or keep working on the project $(K)$. However, only one player can
    make such a decision. Amelie has the right to choose on odd days, while Bernard
    on even days; this means Amelie decides first at day 1, Bernard at day 2, and
    so. If the decision at day $j$ is deferred to the next day, when the other player
    decides; meanwhile, the value of the project is discounted by a factor $\delta
    \in [0, 1]$, so at day $j+1$ the value is $v_{j+1} = \delta \cdot v_j$. As long
    as they keep the decision, the game goes on forever. When the project ends, they
    both collect payoff. Whoever called to end the game at day $j$ gets $0.4v_j$.
    The other player gets $0.6v_j$.


    - 1. Draw the extended form of this game (write 4 days, then put dots).

    - 2. Prove that there is a unique SPE where the project ends at latest at day
    2.

    - 3. Find the values of $\delta$ for which the project will ultimately be ended
    by Amelie (the complementary values are for which it is by Bernard instead).


    ## Solution


    The game is like a centipede game, with $C$ on left (down) branches and $K$ on
    right (horizontal) branches. The game stays on forever if $K$-branch is chosen.
    Any choice of $C$ ends the game, and final payoffs are $0.4v_j = 0.4\delta^{j-1}v_1$
    and $0.6v_j = 0.6\delta^{j-1}v_1$ if $j$ is odd; payoffs are swapped just if $j$
    is even.


    ![](img/adcae123bfc4ba205d992d916e340a6b_69_0.png)


    Figure 10: Extensive form of the game.


    - 2. This game is bound to end at day 2 because both players know that day 3 will
    be back to day 1, with discounted payoffs. Rational players are able to anticipate
    this outcome and will not allow the game to reach day 3.


    - 3. Since Amelie can anticipate Bernard''s move, she compares $0.4v_1$ (what
    she gets at round 1) and $0.6v_2 = 0.6\delta v_1$). Amelie chooses $C$ if $\delta
    > 2/3$.

