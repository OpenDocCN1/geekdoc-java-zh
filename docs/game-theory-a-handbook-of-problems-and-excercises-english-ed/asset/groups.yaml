    because of the existence of a better outcome in Pareto sense.


    In practice, one can even consider this applied in a practical context. The difference
    between the standard static game and the Stackelberg version justifies whether
    one of the players should act as the leader and makes its decision to the other.
    This generally has a communication cost in real cases, and besides, the other
    player is keen to listen to this only if being the follower is advantageous, which
