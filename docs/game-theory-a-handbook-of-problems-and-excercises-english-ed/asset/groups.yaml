    ## Game Theory – A handbook of problems and exercises


    ## Exercises


    **Exercise 2.2.** Consider the following game in normal form. Players are denoted
    as 1 and 2 and their sets are $S_1 = \{A, B, C\}$ and $S_2 = \{X, Y\}$. The payoff
    matrix is as follows:


    | | X | Y |

    |---|---|---|

    | A | 9, -9 | -5, 5 |

    | B | -2, 2 | 7, -7 |

    | C | 8, -8 | -1, 1 |


    - 1. Describe what kind of game is and what specific solution concept you might
    use to find its Nash equilibria.

    - 2. What is the support within $S_1$ of the strategy strategy at the Nash equilibrium
    by 1?

    - 3. Find the mixed strategies played by 1 and 2 at the Nash equilibrium.


    ## Solution


    - 1. The game is zero-sum and can be solved through minimax search. Indeed, it
    must have a Nash equilibrium in mixed strategies (only one, since 2 has only one
    way of mixing its strategy). Specifically, let $b$ the probability of player 2
    to play $X$. Then, for the minimax conditions are:


    ```

    \begin{cases} 9b - 5(1-b) \geq w \\ -2b + 7(1-b) \geq w \\ 8b - 1(1-b) \geq w
    \end{cases}

    ```


    $w$ is a slack variable to be maximized.


    - 2. A graphical inspection reveals that the active constraints are the 2nd and
    3rd, which means that the support of the mixed equilibrium is $(B,C)$ for player
    1.


