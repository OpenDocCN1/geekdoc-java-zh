    ## Sequential games


    Sequential games with perfect information are a particular class of dynamic games.


    ### 3.1 Characteristics


    In sequential games of $n$ stages, players alternate in making their moves, that
    is, player 1 moves alone at stage 1, then at subsequent stages $j = 2, 3, \dots,
    n$, it is player $j = 2, 3, \dots, n$’s turn to move. In the case of perfect information,
    the player moves informed about the choices made within all the previous $j -
    1$ stages. This last element is key to understand the game: all moves are made
    with full awareness of the previous choices. Clearly, all players see the evolution
    of the game in its entirety, but this assumption of perfect information is actually
    only relevant to the players to move, since the players are generally assumed
    to have perfect recall, so they do not forget past moves. Also, it is equally
    assumed that all the players are rational and this information is common knowledge
    among the players.


    Because of the properties mentioned above of the clearly specified order of moves
    and full information about the past history of the game, in a sequential game
    with perfect information the information set of each node is a singleton, which
    means, that the gameplay dynamically evolves to a certain-game stage, all the
    players (and most notably, the player to move) are perfectly informed about where
    the game is at. Thus, a sequential game is generally represented in extensive
    form by a plain tree without any possible fusion of the players to move; in other
    words, there are no dashed lines joining separate nodes of the tree. The extensive
    form may be preferred because it preserves the dynamic character of the game.
    The normal form can be used, but its representation is generally not very compact,
    since each information set is separate and only contains one node (the current
    one), one must specify one action per node in the tree, and the number of choices,
    which becomes combinatorial,


    The general scheme described above also includes games that apparently do not
    fit the definition. For example, a player may move multiple times at different
    stages $i$ and $j \neq i$, that is, player $i$ and $j$ in the definition above
    can coincide. It is possible that just 2 players alternate in making choices,
    e.g., if odd-numbered players and all even-numbered players actually coincide
    with players 1 and 2, respectively. In that case, it would simply be a game with
    two players deciding upon their choice after seeing each''s last move. Many tabletop
    games, played with an open and fully visible board, and without the involvement
    of hidden elements (cards) or random choices (dice), such as chess, checker, or
    tic-toe fall within this category. In the extensive form, that would be represented
    as different layers of depth of the tree being similarly labeled, to describe
    that the player to move in a certain node has also a choice in the past.


    Also, many sequential games include an “early-termination” option where one player
    may choose to conclude the game before stage $n$, so there are no iterations and
    payoffs are immediately computed. This actually fits the general definition above,
    if we allow for choice to a player, no matter what the other players do, the final
    payoffs are always identical. This means that, in the extensive form, such a sequential
    game can be equivalently represented by an unbalanced tree, where all leaf nodes
    belonging to that subtree be identical. Notably, the extensive form representation
    is not unique, as in this case multiple extensive forms, by a matter of fact,
    correspond to the same actual game.


    ### 3.2 Backward induction


    Backward induction is a technique that can be used to analyze games where moves
    unfold over time. For sequential games, it represents the instrument of choice
    for the solution. It corresponds to applying sequential rationality but, as the
    name suggests, it proceeds backwards, starting from the in-game situations where
    a decision can be made. Under the uncertainty related to it is removed, the procedure
    goes by considering the penultimate rational decision, i.e., it removes the end
    branching of the tree and to the last decision before that, and on.


    This characteristic explains the name, since the strategic gameplay is planned
    by inducing further rational decisions in the tree, and doing so by going backwards
    in the order of the decisions to be made.


    However, since backward induction applies rationality to every single node in
    the tree where a decision can be made, the procedure does not only find Nash equilibria
    of the game, i.e., it determines optimal decisions along the equilibrium path,
    but also necessarily finds subgame perfect equilibria.

