    ## 110 Game Theory – A handbook of problems and exercises


    Now, complete knowledge no longer holds as players only know the value of their
    own type. Clearly, this requires an adaptation of the requirements about what
    players really know about the game, since we would like to express logical deductions
    of the players from their in-game knowledge. Therefore, in a Bayesian game we
    need to set some common ground about what the players know, beyond what they cannot
    know with certainty, i.e., the types of the players. A frequently adopted approach
    is to assume a common prior for all the players. This means the joint probability
    distribution $p(t_1, t_2, ..., t_k)$ is common knowledge. Simply put, players
    know their own type with certainty; others, they have an estimate (the probability
    distribution) of what their type could be. When we assume that this probability
    distribution is known by all players (the “common prior assumption”), we are able
    to transform the games of incomplete information into games of imperfect information
    (in which the history of play within the game is not known to all players).


    This means that Bayesian games are translated into dynamic games, and the strategies
    and the normal form of the game are modeled in the same ways as done. The first
    move in such dynamic games is always played by Nature, and corresponds to determining
    the individual types. After this, we can consider that players choose an action
    per each of their information sets. Notably, players with a type will be aware
    of it and therefore choose (possibly different) actions for each one of their
    types, since each type leads to a separate information set. Given that they have
    no uncertainty on their type, their information set related to the Nature''s choice
    of their pertinence is a singleton – however, they can have uncertainty on the
    other players'' types or moves.


    Very often, this leads to a type-agent representation of players with a type,
    in which their strategy is modeled like a player with a split personality. In
    other words, they plan in a strategic choice per one of their types. This may
    also be combined with other multiple information sets that players may have, e.g.,
    due to the dynamic history of the gameplay. It may seem silly that a Bayesian
    player plans an action per each of the types, since the actual type determined
    by Nature will be only one. However, besides the general reasoning of adopting
    a standard approach, this is the correct modeling choice in order to represent
    the benefits of the other players, since they do not know the type of Bayesian
    player instead, and therefore can expect every sort of behavior.


    Although this example is already old and only good for boomers, this resembles
    role-playing games like “One of us” or “Werewolves” where a player is dealt a
    secret card/role (Nature’s choice) and must play according to it. Before the game
    starts, player can plan a strategy according to all possible options for his/her
    types. That is, the player mentally plans something like “I will play fair if
    my role is that of the good person, but if I am one of the imposters, I will kill
    everyone!”. Or, “If I am one of the baddies, I will act kindly toward the good
    guys when I am on their side, and if I am good, I will launch an evil laugh to
    make the imposters think that I am one of them!”. After, being informed about
    the actual type, player will only play the relevant part of the strategy. Yet,
    the other players are in the dark about his/her type and must make all kinds of
    assumptions in their beliefs, e.g., this is a good character that is acting truthfully
    or an impostor that is pretending. Their beliefs revolve around both the type
    assigned to and the strategy chosen by others.


    Also, an important structural property of Bayesian games is that players react
    to Nature''s choices that are unknown to them (such as the other players'') by
    taking expectations, as they would for any other random lottery. Thus, all expectations
    are combined. In particular, Bayesian games give a very sensible interpretation
    to mixed strategies; for a given player it is clearly identical to another player
    with two available pure strategies A and B either (i) plays a mixed strategy where
    A and B are chosen with respective probabilities $\alpha$ and $1-\alpha$, or (ii)
    is a Bayesian player with different types $t_A$ and $t_B$, and the probabilities
    of these types can be estimated as $\alpha$ and $1-\alpha$, respectively, and
    the final-type representation of this player chooses A when the type is $t_A$
    and B when the type is $t_B$. Indeed, in both cases the response to the player''s
    choices will be planned by taking expectations over the probabilities $\alpha$
    and $1-\alpha$.


    A common taxonomy of the strategies played by a Bayesian player, or its type-agent
    representation, distinguishes between pooling or separating strategies. This classification
    also applies to the resulting equilibria, if they involve these kinds. The term
    "pooling" refers to all types of a player choosing the same strategy, so in reality
    the other players cannot distinguish between the types, because they behave alike.
    From the perspective of an external player, the probabilities of each type of
    the Bayesian player can only be estimated through the prior, since no further
    information is gained when the move chosen is known. Conversely, "separating"
    indicates that all different types play a different action, which ultimately reveals
    the type. Of course this requires that there are at least as many actions as types.
    Intermediate cases are possible, which are "semi-separating," "partially pooling,"
    or simply "hybrid”—this is the case when a player has 3 types ($t_a, t_b$, and
    $t_c$) and the first two types play the same strategy X, while the last type plays
    another Y. By extension, in a pooling Nash equilibrium, Bayesian players play
    the same action for all of their types, and in a separating NE they play different
    actions for each of their; once again, hybrid cases are possible, which includes
    all situations where (i) some pool and others separate, or (ii) some pool and
    others mix, or (iii) some separate and others mix, or (iv) all mix.


    ## 6. Bayesian games


    The general framework of Bayesian games can be specified in many contexts.


    ### 6.2 Relevant cases


