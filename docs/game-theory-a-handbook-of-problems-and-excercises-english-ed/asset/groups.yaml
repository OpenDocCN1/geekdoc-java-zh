    练习 5.5。一名战士（$W$）和一名法师（$M$）正在探索一个地下城寻找怪物。在第一阶段，他们的探索被设定为一个两阶段博弈。在第一阶段，他们准备与下一个房间的怪物战斗，他们都可以采取以下行动之一：施法术（$C$）或拔剑（$D$）；实际上，强壮的
    $W$ 不喜欢 $C$，而懒惰的 $M$ 倾向于选择 $D$。尽管如此，他们会在不预先交或交流的情况下同时选择行动。双方都完全了解对方在该阶段的潜在收益，收益定义如下：如果他们选择不同的行动，效用为
    2；如果行动相同，则效用为 0，因为这可能导致他们对某些敌人的准备不足。此外，选择较不受欢迎行动的玩家其效用必须减去 1。


    在该阶段之后，将进行第二阶段，两名冒险者在拿到战利品时被一只巨魔惊扰。现在他们可以选择胆怯地逃跑（$R$）或攻击巨魔（$A$）。同样，这一行动是相互独立且同时决定的。如果他们都攻击，就成功杀死了巨魔（双方收益均为
    5）。如果只有一个人攻击，会被巨魔杀死（收益为 -10），而另一人毫发无损。如果他们都逃跑，他们逃脱了但必须留下宝藏（收益为 0）。


    1. 画出此博弈的扩展型（extensive form）。

    2. 找到该两阶段博弈的所有纳什均衡（Nash equilibria）。

    3. 找到该两阶段博弈的所有子博弈完美均衡（subgame-perfect equilibria），并解释它们为什么是子博弈完美的。


    # 解


    1. 在画出扩展型之前，将两个阶段都转化为标准型（normal form）比较方便。对于第一阶段，如下：


    | | C | D |

    |---|---|---|

    | W | -1, 0 | 1, 1 |

    | D | 2, 2 | 0, -1 |


    而第二阶段的标准型为：


    | | A | R |

    |---|---|---|

    | A | 5, 5 | -10, 10 |

