    # 3. Sequential games


    # Exercises


    **Exercise 3.1.** A university student (U) is writing a project for the Game theory
    course; the project can have 3 levels of quality: 0 (worst), 1, or 2 (best), and
    this is up to U''s decision. After U prepares and submits the project, the professor
    (P) will review and evaluate whether it is successful (S) or not (N). If the project
    is evaluated as successful, the payoffs of both players are awarded as $m - e_j$,
    where $m$ is the marked awarded and $e_j$ is the effort spent by player $j$. Given
    that the project''s quality is $x$, with $x \in \{0, 1, 2\}$, the mark is $m =
    18 + 6x$; the effort spent by U is an exponential function of $x$, i.e., $e_U
    = 4^x$; the effort spent by P is constantly equal to $e_P = 15$. If U is not successful,
    the payoff of both players is 0.


    +   1. Write the game between U and P in extensive form.

    2. Write the game in normal form, and find out all of its Nash equilibria.

    3. Find all the subgame-perfect equilibria of this game.


    # Solution


    1. The extensive form is the tree depicted in Figure 3.1. First move is by U,
    who has 3 options to choose from: 0, 1, and 2. For each of the resulting branches,
    P has two choices, S or N.


    ![](img/adcae123bfc4ba205d992d916e340a6b_52_0.png)


    Figure 3.1: Extensive form of the game.


    2. The normal form is a matrix (actually a bi-matrix) with 3 rows (because the
    first player U has 3 strategies) and 8 columns. The second player P has 8 strategies
    because it must specify a binary alternative for 3 possible history of play, i.e.,
    the choice of U. This results in:


    | | SSS | SSN | SNS | SNN | NSS | NSN | NNS | NNN |

    |---|---|---|---|---|---|---|---|---|

    | B | 0 | 17,3 | 17,3 | 17,3 | 0,0 | 0,0 | 0,0 | 0,0 |

    | 1 | 20,9 | 20,9 | 0,0 | 0,0 | 20,9 | 20,9 | 0,0 | 0,0 |

    | 2 | 14,15 | 0,0 | 14,15 | 0,0 | 14,15 | 0,0 | 14,15 | 0,0 |'
  - '[PAGE 53]


    There are 7 pure strategy Nash equilibria: (0, SNS); (0, SNN); (1, SSS); (1, SSN);
    (1, NSS); (1, NSN); (2, NNS).


    +   Of these Nash equilibria, the only SPE is (1, SSS), which can be seen via
    backward induction. The only rational choice for P is to say S to every project.
    The first step of backward induction is here replacing P''s nodes with the payoffs
    obtained from P playing S.


    ![](img/adcae123bfc4ba205d992d916e340a6b_53_0.png)


    Knowing this, U will play the one that is best for him/herself, i.e., 1. We see
    that Nash equilibria (1, •S) where P''s strategy is not S are sensible. In this
    case, P plays action N for choices of U; the trick is, this can only happen when
    this is not the actual chosen by U. But, P is playing rationally in the corresponding
    subgame (luckily, this is off the equilibrium path). Then these are Nash equilibria,
    but are not subgame-perfect. Similar considerations for Nash equilibria (x, •N)
    where x ≠ 1. These are Nash equilibria where P would not accept project 1, which
    is not sensible, but luckily U chooses another project and P accepts it. Thus,
    a potentially illogical choice of P happens off the equilibrium path and therefore
    it is not captured by the Nash equilibrium (but it is instead visible when considering
    the SPE).


    This can also be understood as a non-credible threat. Imagine a strict professor
    that threatens to reject the project unless it is top quality; in others, P threatens
    to play NNS – the professor is believed by the student to be acting like this,
    because P''s move is eventually unknown when U plays. Then, the student may be
    afraid that he/she has to deliver a high quality project, which seems to the only
    way to be successful. Backward induction reveals this belief to be non-credible.


    Side note: even thus it may happen that professors have no incentive in rejecting
    a student''s project, no matter how bad it is (after all, if they compel the student
    to do a new project from scratch, they have to grade one more project, which is
    against their utility), if you do a project in your game theory class you are
    encouraged to do better than the bare minimum!'
