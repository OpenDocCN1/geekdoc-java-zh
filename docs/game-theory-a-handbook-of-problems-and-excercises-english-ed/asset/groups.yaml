    ## 3. Sequential games


    **Exercise 3.2.** Miss One (1) and Mister Two (2) play the following game. They
    start with respective payoff $u_1=+1, u_2=-1$. At first, 1 can choose between
    two available moves, called $A$ and $B$. Move $A$ multiplies both payoffs by 3.
    Move $B$ multiplies them both by 2 and additionally gives 5 points to Mister 2
    (so $u_2=2u_2+5$). 2 observes this 1 can either continue playing $(C)$ or drop
    $(D)$. If $D$ is chosen, the game ends and the values of $u_1$ and $u_2$ are now
    the respective payoffs of the players. If 2 decides to continue, Miss 1 will have
    another shot, and she can play again $A$ or $B$, with the same consequences of
    before. After that, the game ends, and the values of $u_1$ and $u_2$ are now the
    final payoffs of Miss 1 and Mister 2, respectively.


    - 1. Write the game in extensive form.

    - 2. Find out the backward induction outcome of the game.

    - 3. How many strategies do 1 and 2, respectively? Write down their choice of
    strategies in the only subgame perfect equilibrium of this game. Are there other
    Nash equilibria that are not subgame perfect?


    ## **Solution


    - 1. The extensive form is the tree depicted in Figure 3.2.


    ![](img/adcae123bfc4ba205d992d916e340a6b_54_0.png)


    Figure 3.2: Extensive form of the game.


    - 2. To apply backward induction, note that the last level of nodes is $x_3$ and
    $x_4$. In the last round, it is always convenient for 1 to play $A$, thus $x_3$
    and $x_4$ can be treated as final nodes with payoff $9, -9$ and $6, 9$, respectively.


    Game Theory – A handbook of problems and exercises


    ![](img/adcae123bfc4ba205d992d916e340a6b_55_0.png)


    Now the last choice is always Mister 2''s. At node $x_1$, he will choose D, which
    gives him a higher payoff, while at node $x_2$ he will choose $C$.


    ![](img/adcae123bfc4ba205d992d916e340a6b_55_1.png)


    Now we are left with Mister 1''s two alternatives at node $x_0$, and the choice
    is between $A$ giving the ultimate payoff of $3, -3$, or $B$ giving an ultimate
    payoff of $6, 9$. Mister 1 chooses $B$ at the SPE and the final outcome gives
    payoffs $6, 9$.


    - 3. Strategy-wise, Miss has two options to choose from at each of nodes $x_0,
    x_3, x_4$. Thus, she has 8 possible strategies. Similarly, 2 has two options to
    choose from each of nodes $x_1$ and $x_2$, thus he has 4 possible strategies.
    We can write a pair of strategies as $((x_0, x_3), (x_1, x_2))$. The SPE outcome
    is determined by backward induction, which dictates $x_0 = B, x_2 = C$, in the
    SPE case they must be $x_1 = D$ and $x_3 = A$, thus the SPE is $((B, B, A), (D,
    C))$. There are clearly other non-SPE Nash equilibria. For example, we can change
    $x_1$ and/or $x_3$: for example, $((B, A, C))$ obtains the same payoff of the
    SPE and no player has incentive to deviate from it; yet, it contains irrational
    choices at nodes that are never reached. In addition, there are Nash equilibria
    that are not SPEs because they have non-credible threats. One example is $((A,
    A, A), (D, D))$, where 1 always plays $A$ and 2 always drops. Because of 2 always
    playing $D$, 1 has no incentive in playing anything else than $A$ and vice versa.


    ## 3. Sequential games


    **Exercise 3.3.** It is the discount sale season, and Lou (L) wants to go shopping.
    Lou thinks it is best to wait until the last three days of the discount sales,
    because prices are cheapest (denote these three days as “Day 1”, “Day 2”, “Day
    3”). On day 1, Lou asks Karen (K) to go with him. If Karen says (Y), they go and
    the game ends. If Karen says (N), Lou can give one (G) or request (R) again the
    following day. On day 2, the same happens. On day 3, if K says N, the game ends
    as they do not go into further day. If in the end K and L do not go shopping,
    both of their payoffs are 0. If they do, their payoffs are computed as $u_K=d$
    and $u_L=5-2d$, respectively, where $d$ is the day in which they go. Note that
    these payoffs already include a discount phenomenon (only, L is easier to go as
    soon as possible, the higher the $d$ the lower his payoff; while K prefers to
    go as late as possible, so her payoffs is kind of negatively discounted so no
    discount to apply). All of this information about the game is common among the
    players.


    - 1. Represent the game in its extensive form.

    - 2. Find out the subgame-perfect equilibrium of this game.

    - 3. Find out another Nash equilibrium that is not subgame-perfect.


    Solution


    - 1. This is like a centipede game with extensive form shown in Figure 3.3.


    | | N | R | N | 0 |

    |---|---|---|---|---|

    | (K) | (L) | (K) | (L) | (K) |

    | Y | G | | G | |

    | 1 | 0 | | 2 | |

    | 3 | 0 | | 1 | |


    Figure 3.3: Extensive form of the game.


    - 2. The subgame-perfect outcome can be found through backward induction. In her
    last choice, K prefers Y over N but gives negative payoff to L. Anticipating this,
    L prefers to exit the game at his second choice and get 0.


    | | N | R | N | 0 |

    |---|---|---|---|---|

    | (K) | (L) | (K) | (L) | (K) |

    | Y | G | | Y | |

    | 1 | 0 | | 2 | |

    | 3 | 0 | | 1 | |


    So, the result of the SPE is that players choose N, R, Y and the game happens
    with payoffs (2, 1). To be more precise, one should also mention what happens
    off equilibrium path. In the subgame where L can play at day 2, she plays G. And
    in the subgame where K can play at day 3, she plays Y. Neither of these happens
    as on the equilibrium path the game is ended before that.


    - 3. There are others Nash equilibria that are not subgame-perfect. For example,
    if L threatens to always play G, K will say Y immediately at day 1. So K and L
    playing (Y,Y,Y) and (G,G) is a Nash equilibrium for the game - as well as any
    other pair of strategy starting with Y and G, such as (Y,N,N) for K and (G,R)
    for L. They are all equivalent since the game ends immediately, but contain some
    non-credible threat by L who threatens to give up.


    ## 3. Sequential games


    **Exercise 3.4.** Javier (J) and Krista (K) want to buy a house together with
    their joints and move with each other. They agreed on the following plan: during
    September, J will go browsing available houses: if he finds something he likes,
    he will buy it for both. If J has found nothing, K will go during October in search
    of a house, and similarly she will buy for anything of her preference that is
    available; or, she can decide not to buy anything and leave the decision for J
    to make in November, which is the last month. If K has not found anything satisfactory
    during the turn, J will go searching for a house in November and both will buy
    it, without the option to further delay. Basically, regardless of whom signs the
    deal with the real estate, the procedure ends either J or K decides to buy. Also,
    note that houses stay available just for one month: if not bought when available,
    they are sold to someone else. This is the list of affordable houses, with J and
    K''s utility in bought:


    | Name | Available during | J''s utility | K''s utility |

    |---|---|---|---|

    | Atlas heights (A) | September | 10 | 5 |

    | Bellevue park (B) | October | 15 | 28 |

    | Cicada gardens (C) | October | 5 | 12 |

    | Daffodil square (D) | November | 18 | 15 |

    | Ember lane (E) | November | 8 | 35 |

    | Floral route (F) | November | 40 | 10 |


    All of these values and rules are common knowledge for the players. Denote with
    X the choice not to buy a house and go to the next round.


    - 1. Write this game between J and K in extended form.

    - 2. Write the game in normal form, and find out its Nash equilibria.

    - 3. Find all the subgame perfect equilibrium of this game.


    ## **Solution


    - 1. The extended form is the tree depicted in Figure 3.4.


    - 2. The normal form is a bi-matrix with 6 rows and 3 columns. In fact, player
    J has 6 strategies (2 choices in the first move and 3 choices in the second move).
    Player K only moves (if at all) and in that case she chooses among three options,
    so has 3 strategies. It may be that her moves do not matter at all, but we need
    to specify them.


    | | B | C | X |

    |---|---|---|---|

    | J | AD | 10, 5 | 10, 5 | 10, 5 |

    | | AE | 10, 5 | 10, 5 | 10, 5 |

    | | AF | 10, 5 | 10, 5 | 10, 5 |

    | | XD | 15, 28 | 5, 12 | 18, 15 |

    | | XE | 15, 28 | 5, 12 | 8, 35 |

    | | XF | 15, 28 | 5, 12 | 40, 10 |

