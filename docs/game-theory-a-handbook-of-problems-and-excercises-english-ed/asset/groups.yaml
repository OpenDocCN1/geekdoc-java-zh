    the marginal probability that the information set is reached when the type of
    the Bayesian player is $j$ and the unconditional probability that the information
    set is reached at all. The latter is usually computed through the total probability
    theorem as the sum of all possibilities. In other words:


    ```

    \mu_j = \frac{Pr[h \text{ is reached & the Bayesian type is } j]}{Pr[h \text{
    is reached}]} \= \frac{Pr[h \text{ is reached & the Bayesian type is } j]}{\sum_{k=1}^n
    Pr[h \text{ is reached & the Bayesian type is } k]} \quad (6.1)

    ```


    However, Bayes'' rule as expressed by $Pr[h \text{ is reached}] > 0$, otherwise
    we are dividing by 0. When $Pr[h \text{ is reached}] = 0$ we consider to have
    gone off the equilibrium path, and this results in the literature as regarding
    what to do in this case. The usual approach is that of a *weak* PBE that implies
    that the values of the $\mu_j$''s in this case are arbitrary. Some authors impose
    stricter conditions, to obtain a more selective definition of PBE, but in many
    practical applications this can be often seen as nitpicking. At any rate, consider
    that the values of the $\mu_j$''s being arbitrary does not mean that they can
    be any number, in fact they must still represent probabilities and therefore they
    cannot be negative or larger than 1 and they must also sum to 1, meaning that
    they cannot be all 0.'
