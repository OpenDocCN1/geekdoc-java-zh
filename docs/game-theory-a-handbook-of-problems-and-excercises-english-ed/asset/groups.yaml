    # 4. Lotteries and Other Variations


    **Exercise 4.5.** The Black Knight ($B$) and the White Knight ($W$) fight a duel
    to the last bond. They can choose (simultaneously and independently of each other)
    weapon: Axe ($A$), Mace ($M$), or Sword ($S$). The knights are fully aware of
    the possible outcomes, which are as follows.


    If they both choose the same weapon, the White Knight has probability 60% of winning.
    If either of them chooses Axe and the other chooses Mace, whoever chooses Axe
    has probability 90% of winning. If the Black Knight chooses Sword (and the White
    Knight does not), the Black Knight has probability 80% of winning. If the White
    Knight chooses Sword (and the Black Knight does not), the White Knight has probability
    70% of winning.


    Winning a utility of $+10$, losing a utility of $-100$.


    +   1. Write down the normal form of this game. Find a suitable way to express
    the payoff of each outcome (explain it).


    +   2. Find the Nash equilibria in pure strategies.


    +   3. Are there Nash equilibria in mixed strategies? If yes, find them. If not,
    discuss why.


    # Solution


    +   1. The normal form is as follows: Set of players is $\{W, B\}$. The strategy
    sets are: $S_W = S_B = \{A, M, S\}$. To represent the payoffs, we need to resort
    expected utilities. Also, note that the game is competitive (each outcome has
    a total payoff of -90, so we can sum 45 to each player''s payoff and get a zero-sum
    game). The bi-matrix is:


    | | A | M | S |

    |---|---|---|---|n| **W** | A -34, -56 | M -1, -89 | S -78, -12 |

    | | M -89, -1 | M -34, -56 | S -78, -12 |

    | | S -23, -67 | M -23, -67 | S -34, -66 |


    +   2. We can find the Nash equilibria by applying IESDS. We eliminate M for both
    players, that is strictly dominated by $S$, obtaining the following reduced bi-matrix.


    | | A | S |

    |---|---|---|n| **W** | A -34, -56 | S -78, -12 |

    | | S -23, -67 | S -34, -66 |


    Now $A$ is dominated by $S$ as well and can be safely removed, leaving $(S, S)$
    as the only survivor of IESDS. Therefore, $(S, S)$ is the only Nash equilibrium
    of the game.


    +   3. Since there is a unique Nash equilibrium in pure strategies, there are
    no other equilibria in mixed strategies.'
