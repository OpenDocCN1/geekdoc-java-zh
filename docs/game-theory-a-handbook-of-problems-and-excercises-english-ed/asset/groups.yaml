    |---|---|---|

    | R | -1 | 1 |

    | | 1 | -1 |


    你可以看到这个游戏的简化形式有一个纳什均衡，由于对称性原因，两种策略都以 0.5 的概率执行。遗憾的是，根据无差异定理，这**不是**一个纳什均衡。该定理的一个重要条件（学生经常忘记）要求玩家选择其混合策略，使得对手对于该玩家策略支撑内的所有纯策略都是无差异的，*但*该玩家策略支撑之外的策略不能获得更高的收益。如果两个玩家选择以
    50-50 的概率执行 1 和 2 的混合策略 m，这种情况就不会发生，因为他们获得的期望收益为 0。现在，这是他们通过针对 *m* 执行纯策略 1 和 2
    所获得的价值，但遗憾的是，策略 3 获得的收益是 0.5，因此代表了更好的字面偏差，这证明了 *m* 不是对它的最佳反应。


    因此，应该遍历所有可能的组合，这非常繁琐。当然，在分析此类游戏时，可以使用网上的某些软件工具，这些工具可以确认之前发现的纳什均衡是唯一的。或者，在这种情况下，可以使用极大极小值的系统方法来寻找纳什均衡。


    对于玩家 R 选择策略 1、2 或 3 的概率 $r_1, r_2, r_3$，可以写出如下优化问题：


    ```

    max w

    s.t. \sum_{j=1}^{3} r_j = 1

    r_j \geq 0 \forall j=1, 2, 3

    sum_{j=1}^{3} r_j u_R(S_k^{(j)}, S_B^{(k)}) \geq w \forall k=1, 2, 3

    ```


    其中 $w$ 是待最大化的松弛变量，它最多等于极大极小 = 极小极大。$w$ 的最大可能值为 $1/7$，因为之前发现的纳什均衡实现了这个值，且极大极小定理保证了这就是游戏的价值。因此，该问题可以重写为


    ```

    $\begin{cases} -r_1 + r_2 \ge 1/7 \\ r_1 - r_2 + r_3 \ge 1/7 \\ r_2 - r_3 \ge
    1/7 \end{cases}$

    ```


    对于和为 1 的正数 $a_j$。很容易检查，所有约束都是激活的（即以等式满足），因此证实了混合策略的支撑包含了三个纯策略。因此，混合纳什均衡的唯一解是 $r_1
    = 2/7, r_2 = 3/7, r_3 = 2/7$。在某种意义上，现在对于玩家 B 来说是对称的，不是因为收益相同，而是因为取最小化值的对偶问题导致了相同的概率值
    $b_1 = 2/7, b_2 = 3/7, b_3 = 2/7$，这些概率在 B 的混合策略中对其策略加。


    ## 顺序游戏


    具有完全信息的顺序游戏是动态游戏的一种特殊类型。


    ### 3.1 特征


    在 $n$ 个阶段的顺序游戏中，玩家交替进行移动，即玩家 1 在阶段 1 单独移动，然后在随后的阶段 $j = 2, 3, \dots, n$ 中，轮到玩家
    $j = 2, 3, \dots, n$ 移动。在完全信息的情况下，玩家在了解之前所有 $j-1$ 个阶段内所做选择的情况下移动。这最后一个元素是理解游戏的关键：所有移动都在充分感知之前选择的情况下做出的。显然，所有玩家都能看到游戏的完整演变，但这种完全信息的假设实际上只与要移动的玩家有关，因为通常假设玩家具有完美记忆，所以他们不会忘记过去的移动。同样，假设所有玩家都是理性的，并且这一信息是玩家之间的共同知识。


    由于上述关于明确的移动顺序和对游戏过去历史充分信息的属性，在具有完全信息的顺序游戏中，每个节点的信息集都是单元素集，这意味着游戏过程动态地演变到某个特定的游戏阶段，所有玩家（尤其是要移动的玩家）对游戏所处的位置都完全清楚。因此，顺序游戏通常用没有任何可能的移动玩家可能融合的纯树形以扩展形式表示；换句话说，没有虚线连接树上不同的节点。扩展形式可能更受青，因为它保留了游戏的动态特性。可以使用正型形式，但其表示通常不很紧凑，因为每个信息集都是独立的且只包含一个节点（当前节点），必须为树上的每个节点指定一个动作，以及选择的数量，这变成了组合性的。


    上述的通用方案还包括了显然不符合定义的游戏。例如，玩家可能在不同阶段 $i$ 和 $j \neq i$ 移动，即上述定义中的玩家 $i$ 和 $j$ 可能会重合。可能只有
    2 个玩家交替做出选择，例如，如果奇数玩家和所有偶数玩家实际上分别与玩家 1 和 2 重合。在这种情况下，它简单是一个两个玩家的游戏，在看到对方的最后一次移动后做出自己的选择。许多在开放且完全可见棋盘上进行的、且不涉及隐藏元素（牌牌）或随机选择（骰子）的游戏，如象棋、跳棋或井跳棋，都属于这一类。在扩展形式中，这将表示为不同深度的树层被类似的标记，以描述某个节点中的移动玩家在过去也有过选择。


    此外，许多顺序游戏包含一个“提前终止”选项，一个玩家可以选择在阶段 $n$ 之前结束游戏，因此没有迭代并立即计算收益。如果允许玩家做出选择，无论其他玩家做什么，最终收益总是相同的，那么这实际上符合上述通用定义。这意味着在扩展形式中，这种顺序游戏可以等效地表示为不平衡的树，其中属于该子树的所有叶子节点都是相同的。注意的是，扩展形式的表示并不是唯一的，因为事实上，多个扩展形式对应同一个实际游戏。


    ### 3.2 反向归推


    反向归推是一种可以用于分析随时间展开的游戏的技术。对于顺序游戏，它是求解的选择工具。它对应于顺序理性，但正如名称所暗示，它是反向进行的，从可以做出决定的游戏情况开始。在移除相关的不确定性后，程序通过考虑倒数第二个理性决策来进行，即它移除树的末端分支，然后到之前的最后一个决策，依此类推。


    然而，由于反向归推对树中每个可以做出决定的节点都应用理性，该程序不仅能找到游戏的纳什均衡（即确定了均衡路径上的最优决策），而且必然找到子博完美均衡。


    '
