    | | O | P |

    |---|---|---|

    | C | 2, 2 | 3, 5 |

    | D | 5, 3 | 1, 1 |


    In the second stage, the wolf arrives, and they can either Flee (F) or Help (H)
    each other. If both help each other, they successfully escape with some bruises
    (payoff –1 for each). If only one helps, he gets devoured (payoff –100) while
