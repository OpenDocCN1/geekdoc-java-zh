    # Game Theory – A handbook of problems and exercises


    **Exercise 1.9.** Atlas Ltd (A) and Broadcasting Ltd (B) are local TV channels,
    competing for the most audience. They have three news broadcasts in the morning
    (M), daytime (D), and evening (E). They must decide what is the time share where
    they invest the most, and can choose only one – without telling each other. If
    they invest the same slot, the payoff is 0 for both. If they choose a different
    one, there is a “winner”, i.e., whoever chooses the earlier slot. For example,
    between M and D, the winner is whoever chooses M. However, E beats M because the
    evening is actually earlier than the following day''s morning and allows it to
    give the news earlier than the competitor. The losing channel always gets –1.
    The winning channel gets a reward depending on how valuable that time slot is
    to advertising, as it is +1, +4, +2 if the winning move is M, D, E, respectively.


    +   1. Write down this game in normal form.


    +   2. Find the Nash equilibria in pure strategies.


    +   3. Find a Nash Equilibrium in mixed strategies.


    # Solution


    +   1. The game is basically a modified rock-paper-scissors. Differently from
    that game, it is not zero-sum (see the next chapter), but it is competitive, that
    whenever the payoff of a TV channel is increased, the other decreases. The set
    of players is {A, B}, and the strategy sets are $S_A=S_B=\{M, D, E\}$. The payoffs
    are represented in the bi-matrix below.


    | | M | D | E |

    |---|---|---|---|n| A | 0, 0 | 1, -1 | -1, 2 |

    | D | -1, 1 | 0, 0 | 4, -1 |

    | E | 2, -1 | -1, 4 | 0, 0 |


    +   2. As rock-paper-scissors, there is no Nash equilibrium in pure strategies
    (there will be at least one player regretting their choice).


    +   3. Because of Nash theorem, a Nash equilibrium must exist. It can be found
    by setting probabilities of playing M, D, E as $m, d, 1-m-d$, respectively. Because
    of symmetry, these must be the same probabilities for both players. Applying the
    independence principle, we can write the equations


    ```

    $$\begin{cases} d-1+m+d=-m+4-4m-4d \ d-1+m+d=2m-d \end{cases} \quad (1.1)$

    ```


    with solutions $\mu = 9/24$ and $\delta = 11/24$. The mixed-strategy NE consists
    then in A and B playing M, D, E with probabilities 9/24, 11/24, and 4/24.'
