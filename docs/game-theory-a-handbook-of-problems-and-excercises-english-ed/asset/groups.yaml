    ## 110 博弈论 – 问题与练习题手册


    现在，完全信息不再适用，因为玩家只知道自己类型的取值。显然，这需要对玩家对博的真实了解程度的要求进行调整，因为我们希望从玩家的内内知识中导出逻辑推断。因此，在贝叶斯博弈中，我们需要对玩家所知设定一些共同基础，除了那些他们无法确定获知的内容（即玩家的类型）。一种经常采用的方法是假设所有玩家共享一个共同先验。这意味着联合概率分布
    $p(t_1, t_2, ..., t_k)$ 是共同可知的。简单来说，玩家确信地知道自己的类型；而对于他人，他们对对方可能是什么类型有一个估计（即概率分布）。当我们假设这种概率分布是所有玩家所熟知的时（“共同先验假设”），我们能够将不完全信息博弈转换为不完美信息博弈（即游戏内的策略历史并非所有玩家所知）。


    这意味着贝叶斯博弈被转化为动态博弈，其策略和博弈的标准型建模方式与之前相同。这种动态博弈的第一步总是由“自然”（Nature）进行，对应的是确定个人的类型。此之后，我们可以认为玩家针对其每个信息集选择一个行动。值得注意的是，某种类型的玩家会意识到这一点，并因此为每种类型选择（可能不同的）行动，因为每种类型导致一个独立的信息集。由于他们对自己的类型没有不确定性，他们与“自然”选择其相关性相关的信息集是一个单元素集——然而，他们对其他玩家的类型或移动可能存在不确定性。


    通常，这会导致具有某种类型的玩家采用“类型-代理”（type-agent）表示，其中其策略建模类似于一个拥有分裂人格的玩家。换句话说

    他们针对自己的每种类型进行策略性选择。这也可以与玩家可能拥有的多个信息集相结合，例如由于游戏过程的动态历史。一个贝叶斯玩家为每种类型计划一个行动似乎很愚蠢，因为由“自然”决定的实际类型只有一个。然而，除了采用标准方法的通用性推理外，这是代表其他玩家获益的正确建模选择，因为他们并不知道贝叶斯玩家的类型，因此可以预期的任何行为。


    尽管这个例子已经很老了，只适合“婴儿潮”一代，但它类似于像《我们中的一个》或《狼人杀》这样的角色扮演游戏，在游戏中，玩家会被分配一张秘密卡牌/角色（自然的选择），并必须根据此进行。在游戏开始之前，玩家可以根据其类型所有可能的选项计划策略。也就是说，玩家在脑中计划诸如“如果我的角色是好人，我会公平行事；但如果我是冒充者之一，我会杀掉所有人！”或者，“如果我是坏人之一，当我站在好人这边时，会对他们表现友好；如果我是好人，我会发出邪恶的笑声，让冒充者认为我是他们的一员！”之后，在告知实际类型后，玩家将只执行策略中的相关部分。然而，其他玩家对其类型一无所知，必须在他们的信念中做出各种假设，例如，这是一个诚实表现的好角色，还是一个正在伪装的冒充者。他们的信念围绕分配给他人的类型以及他人选择的策略展开。


    此外，贝叶斯博弈的一个重要结构性属性是，玩家对他们未知的“自然”选择（如其他玩家的选择）通过取期望做出反应，就像对待任何其他随机抽奖一样。因此，所有期望都被结合在一起。特别是，贝叶斯博弈为混合策略提供了一个非常合理的解释；对于给定的玩家，它显然等同于另一个拥有可用纯策略
    A 和 B 的玩家：要么 (i) 采取混合策略，其中 A 和 B 分别以概率 $\alpha$ 和 $1-\alpha$ 选择，或者 (ii) 是一个具有不同类型
    $t_A$ 和 $t_B$ 的贝叶斯玩家，这些类型的概率可以分别估计为 $\alpha$ 和 $1-\alpha$，该玩家的最终类型表示在类型为 $t_A$
    时选择 A，在类型为 $t_B$ 时选择 B。事实上，在两种情况下，对玩家选择的响应都将通过对概率 $\alpha$ 和 $1-\alpha$ 取期望来规划。


    贝叶斯玩家所执行策略（或其类型-代理表示）的常见分类区分“聚类”（pooling）或“分离”（separating）策略。这种分类也适用于产生的均衡，如果它们涉及这些类型。“聚类”一词指的是玩家的所有类型选择相同的策略，因此在现实中，其他玩家无法区分类型，因为他们的行为相似。从外部玩家的角度来看，贝叶斯玩家每种类型的概率只能通过先验来估计，因为当所选移动已知时，无法获得进一步的信息。相反，“分离”表示所有不同类型执行不同的行动，这最终会揭示类型。当然，这要求行动的数量至少与类型一样多。存在中间情况，即“半分离”、“部分聚类”或简单称为“混合”——当玩家拥有
    3 种类型（$t_a, t_b$ 和 $t_c$）时，前两种类型执行相同的策略 X，而最后一种类型执行另一种 Y。推广之，在聚类纳什均衡中，贝叶斯玩家对其所有类型执行相同的行动；在分离纳什均衡中，他们对每种类型执行不同的行动；再次，混合情况也是可能的，这包括所有以下情况：(i)
    部分聚类而部分分离，(ii) 部分聚类而部分混合，(iii) 部分分离而部分混合，或 (iv) 全部混合。


    ## 6 贝叶斯博弈


    贝叶斯博弈的框架可以在许多语文中进行规范。


    ### 6.2 相关案例


    如果博弈是动态的，解决方案将变得复杂。通常，手动调查只有其中一个是贝叶斯的玩家且只有两回合交互的情景是可行的。这导致了以下案例，这些案例的解决方法是标准的。第一种是动态博弈，其中第一玩家
    1 在没有类型移动，随后是贝叶斯第二玩家 2 的移动。这有时被称为筛选博弈（screening game）——它实际上代表了《奥兹国魔法》中的场景，一个人躲在帘子后面，他的真实身份是未知的：他是真正的巫师还是冒充者？


