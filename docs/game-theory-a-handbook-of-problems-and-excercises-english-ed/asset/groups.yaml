- md: '

    Exercise **4.10.** Marcel (M) and Noah (N) are playing a simultaneous game, where
    the pure strategies available to M are $A, B$, and $C$, whereas N can play $X,
    Y$, or $Z$. The payoffs are represented by the following bi-matrix when in normal-form.


    | | X | Y | Z |

    |---|---|---|---|

    | A | 2, 2 | 3, 1 | 0, 0 |

    | B | 1, 6 | 7, 4 | 9, 4 |

    | C | 0, 1 | 5, 3 | 9, 2 |


    - 1. Find all the Nash equilibria (NEs).

    - 2. Consider a Stackelberg version of this game where M is leader and discuss
    it.

    - 3. Consider a Stackelberg version of this game where N is leader and discuss
    it. In this specific case, if you need to break ties, you might assume the leader
    and the follower are generous.


    ## Solution


    - 1. To find the NEs, we start by highlighting the best responses. M''s best responses
    are overlined, N''s best responses are underlined.


    | | X | Y | Z |

    |---|---|---|---|

    | A | 2, 2 | 3, 1 | 0, 0 |

    | B | 1, 6 | 7, 4 | 9, 4 |

    | C | 0, 1 | 5, 3 | 9, 2 |


    It is found that the only NE in pure strategies is $(A,X)$, with a payoff of 2
    for both players. A quick search on mixed strategies reveals that this is also
    the only NE of the entire game.


    - 2. The Stackelberg version of this game with M as the leader is actually a dynamic
    game. This can be solved through backward induction, and it is simple to find
    the solution (sometimes called the Stackelberg equilibrium) without drawing the
    extensive form. Indeed, rationality of the players implies that M will play a
    best response to it. But M can exploit his first mover advantage and anticipate
    N will do so. In essence, M is comparing the three underlined cells in the previous
    table and considers the one giving him the best result, which turns out to be
    $(C,Y)$.


    We note two additional properties. First, M is guaranteed not to go below the
    payoff at the NE $(A,X)$ of the static version. This is because $(A,X)$ is one
    of the compared cells, so M can force this result to be achieved in the Stackelberg
    version. But in this case he strictly improves over, because he has the better
    alternative $(C,Y)$ available. Also N is guaranteed to get at least his minimax,
    since by definition the minimax is the minimum payoff that a player gets when
    moving with knowledge of the other player''s choice. This is exactly what happens
    to N, since he is the follower. In reality, N improves over minimax, since he
    gets 3 at the Stackelberg equilibrium and his minimax was 2.


    Improvements (of M over the static NE and of N over the minimax) are not surprising,
    since the game is not competitive. Thus, translating the simultaneous move into
    a Stackelberg game actually improves the coordination of the players. The leader
    M is guaranteed to get an improvement because he has first mover advantage, but
    this does not mean N is not worse off, he is actually improving his payoff too,
    because of the existence of a better outcome in Pareto sense.


    ## 4. Lotteries and Other Variations


    In practice, one can even consider this applied in a practical context. The difference
    between the standard static game and the Stackelberg version justifies whether
    one of the players should act as the leader and makes its decision to the other.
    This generally has a communication cost in real cases, and besides, the other
    player is keen to listen to this only if being the follower is advantageous, which
    is not always the case, and is especially false if the game is competitive.


    ## 3. The game with N leader follows the same reasonings than the previous case,
    but with an additional catch. Solving the Stackelberg game essentially boils down
    to apply backward induction, we note that in this game some payoffs are identical
    in value, which may be a problem for getting a clear solution from backward induction.
    We actually need some tie-breakers and the text specifies that both leaders and
    followers are generous. What does it mean and why does it lead to a tie-breaking
    rule here?


    Observe that N must now compare the overlined cells, i.e., the best responses
    chosen by M. Actually, M has two responses to Z (both B and C) so it is unclear
    which to choose. The principle of "generous follower" implies M will choose what
    is better for the leader, in which in this case is (B, Z).


    Now we face another tie, because N must now choose the best outcome among (A,
    X), and (B, Z). Both, (B, Y) and (B, Z) are better than the former NE of the static
    game (A, X), but they are absolutely equivalent for N. To solve the indeterminacy,
    we apply the "generous leader" principle and assume that N returns the favor and
    chooses the outcome that is better for M.


    As a side note, these assumptions of generosity only make sense because, as remarked
    before, the game is non-competitive. In a zero-sum game, they would not make sense
    but will not be useful either, since a tie for the leader implies that also the
    follower gets the same payoff and vice versa, as the two players'' payoffs are
    always opposite to each other.


    ## 5. Multistage Games


    Multistage games are a class of dynamic games where smaller games are played over
    multiple subsequent stages and combined into a bigger global game. In particular,
    the general theory of multistage games is especially applied to repeated games,
    in which all stages are alike, which also allows for infinite-horizon with interesting
    conclusions.


    ### 5.1 Characteristics


    Stage games are often chosen as simple 2-person static games of complete information.
    They can be a modified version of well known games such as the prisoner’s dilemma,
    the coordination game, or the disordination game. Multistage games are meant to
    capture the strategic impact of current actions of some players to the future
    actions of other players.


    This is by combining individual smaller games, assuming that they are always played
    by the agents, and the payoffs of the stage games are aggregated in some way.
    The most common approach is to consider that discounted versions of the local
    payoffs are cumulated to get the total payoff in the grand game. The discount
    factor δ is a value between 0 and 1 that reflects how many players care about
    the future. In economics, this is usually connected to resource decay or inflation
    of prices. But another interpretation assumes that players game earlier can also
    abandon the envisioned horizon and connects δ with the expected time spent in
    the system (the lower δ, the player leaves the game).


    Some problems consider a multistage version made of different games together.


    ### 5.2 Finite Horizon


    The solution for finite horizon is analogous to backward induction. If the last
    stage has a single NE, then the interaction is limited.

    '
