    ## Game Theory – A handbook of problems and exercises


    **Exercise 1.8.** Andrea (A) and Brianna (B) are planning a two-week trip together.
    They agreed that A and B will book a hotel for the first and second week, respectively.
    They will also make their decision unbeknown to each other when they find out
    their choice, it is too late to get a refund or change. There are available hotels
    in Florence (F), Rome (R), or Venice (V). Both girls would like to visit Pisa,
    Lucca, Siena. However, this is possible only if they manage to book one week in
    Florence and one week in Tuscany; if they book F or both R, they cannot visit
    Tuscany; if either of them V, final payoffs are computed as follows. If they manage
    to visit Tuscany, both get utility 3. If they visit Florence but the remainder
    of Tuscany, A gets utility 1 and B gets 0. If they visit Rome instead, the situation
    is reversed: A gets nothing, and B gets 1. Finally, for every week they spend
    in Venice, both utilities increase by 1. That is, if their choices are (F,V),
    their final utilities are 2 for Andrea and 1 for Brianna. If they spend two weeks
    in Venice, both get utility 2.


    - 1. Formalize this as static game and represent it in normal form.

    - 2. Find out the Nash equilibria of this game in pure strategies.

    - 3. Find one of the possible mixed strategies equilibria.


    # **Solution**


    The set of players is {A, B}. The common strategy is $S_A = S_B = \{F, R, V\}$.
    Payoffs are represented through the following matrix:


    | | F | R | V |

    |---|---|---|---|

    | A | 1, 0 | 3, 3 | 2, 1 |

    | R | 3, 3 | 0, 1 | 1, 2 |

    | V | 2, 1 | 1, 2 | 2, 2 |


    - 2. The game has 9 possible outcomes in pure strategies. The Nash equilibria
    are (F, R), (R, F) and (V, V).

    - 3. The game has several mixed strategies Nash equilibria. For example, you consider
    a mixed strategy where both players play F and R, respectively strategies F, R,
    V with non-zero probability. If we call $f$ and $r$ the probabilities that Andrea
    plays F and R, respectively (then the probability of V is $1 - f - r$), the condition
    to impose is


    ```

    $$\begin{cases} u_B((f, r, 1-f-r), F) = u_B((f, r, 1-f-r), R) \\ u_A((f, r, 1-f-r),
    V) = u_B((f, r, 1-f-r), R) \end{cases}$$

    ```


    which leads to


    ```

    $$\begin{cases} 0f+3r+1-f-r = 3f+r+2(1-f-r) \\ 2f+2r+2(1-f-r) = 3f+r+2(1-f-r)
    \end{cases}$$

    ```


    with solution $f = 1/4$ and $r = 1/2$. Applying the same reasoning for Brianna,
    imposing $u_A(F, (\phi, \theta, 1 - \theta)) = u_A(R, (\phi, \theta, 1 - f - \theta))
    = u_A(V, (\phi, \theta, 1 - f - \theta))$, we get $\phi = 0.5$ and $\theta = 0.25$.


    Other possible equilibria can be found by ignoring strategy $V$, and setting its
    probability to 0. This leads to a simpler system, which is basically a discoordination
    game, since the players get the most when they pick different strategies. The
    solution here is $f = 0.4$ and $\phi = 0.6$.


