    ## 6. 贝叶斯游戏


    **练习 6.17.** 警长（S）正在监控牧场，因为他收到消息说一个牛偷（T）正计划闯入。尽管夜晚非常冷，但 S 正在考虑是在该区域巡逻（P）还是离开（Q）回家；所有的
    T 可能已经因为担心被捕而逃跑了。事实上，T 有两个选择：进入（E）牧场进行抢劫或逃跑（F）。显然，两个玩家在不先考虑对方的情况下做出决定，因此可以被视为同时进行。对于
    T 来说，一个相关的方面是 S 是否武装；众周知 S 有 30% 的时间会带枪。但 S 自己知道是否带了枪。收益计算如下：对于 T 来说，离开现场的收益为
    0，而在 T 拥有围栏的寒夜巡逻该区域收益为 -10。如果 T 选择在 S 回家时进入，他将在不受打扰的情况下实施抢劫，并获得 +10 的收益。所有这些收益都不受
    S 是否武装的影响，唯一的区别在于 T 进入牧场而 S 决定继续巡逻该区域。在这种情况下，如果 S 没有武装，将会发生肢体冲突，双方获得收益，但 T 最终会设法逃脱；最终他们获得的收益为
    -20。然而，如果 S 武装，T 最终会被击中并抓住。T 获得的收益为 -100，而 S 因抓到小偷获得 +20 的收益。


    - 1. 使用扩展型（Extensive form）表示这个包含 S 和 T 的贝叶斯游戏。

    - 2. 使用正规型（Normal form）表示这个贝叶斯游戏，对玩家 S 采用类型代理表示（即其策略是动作的元组，每种类型一个）。

    - 3. 找到该游戏的贝叶斯均衡。


    ## 解答


    - 1. 扩展型是一棵树。根节点是自然（Nature）关于 S 是否带枪的移动，概率分别为 0.3 和 0.7。之后，玩家同时移动，因此一种可能性是 T 在不区分这两个节点的情况下移动，如图
