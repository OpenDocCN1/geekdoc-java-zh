    # 6. Bayesian games


    **Exercise 6.3.** A broadcasting system S has bought a license from the government
    to transmit on some radio channels, but it is not using all of them the time.
    An opportunistic transmitter T wants to operate on a channel akin to those licensed
    to S. Thus, T can choose between: (B) buy a license from the government for another
    channel not licensed to S; (A) access any of the channels licensed to S, hoping
    S does not mind. If T plays B, it gets -10 for the channel cost, and S gets 100
    because it is left undisturbed. If T plays A, S will see some additional interference,
    and it can either (C) combat by raising its transmission power, or (D) do not.
    If S plays D, it gets utility 80 because of the disturbance; T is able to transmit
    and gets utility 20. If S plays C, T always gets utility -20; the utility of S
    depends on whether high power supply are available to S or not. If high power
    supply are available, S gets utility 90. If not, S gets utility 50. The opportunistic
    transmitter T does not know whether S has high power supply or not, but estimates
    this to have probability p; this value is common knowledge.


