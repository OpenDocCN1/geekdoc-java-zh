    Player S can choose one of these four points: $A (0,0)$, $B (0,4)$, $C (4,0)$,
    $D (4,4)$. Player T can choose one of these three points: $A (0,0)$, $E (2,4)$,
    $D (4,0)$.


    Answer the following questions:


    - 1. What kind of game is this? Write down its normal-form representation.

    - 2. Find out all the Nash equilibria in pure strategies of this resulting game.

    - 3. Find out all the Nash equilibria of this resulting game.


    # Solution


    - 1. This is a static game of complete information. The normal-form representation
    can be shown as a bi-matrix, where the set of players is $\{S, T\}$. Their strategy
    sets are $S_S = \{A, B, C, D\}$ and $S_T = \{A, D, E\}$.


    | | A | D | E |

    |---|---|---|---|

    | S | A | 0,0 | 10,6 | 10,-4 |

    | B | -2,10 | -2,6 | -2,-4 |

    | C | -6,10 | -6,6 | -6,-4 |

    | D | 6,10 | -4,-4 | 6,-4 |


    - 2. It is immediate to find that $B$ and $C$ (for player S) and $E$ (for player
    T) are dominated strategy (e.g., by $A$). So, players can only play $A$ or $D$
    and it turns out by inspection that $(A, D)$ and $(D, A)$ are indeed Nash equilibria
    in pure strategies.


    | | A | D |

    |---|---|---|

    | S | A | 0,0 | 10,6 |

    | D | 6,10 | -4,-4 |


    - 3. There is one mixed-strategy Nash equilibrium: it is easy to spot it, because
    the game is similar to a coordination game like the Battle of Sexes, but with
    the goal of choosing a different strategy for both (i.e., not to meet in the same
    point). This is actually called an **anti-coordination game**. To find the mixed
    strategy equilibrium, just set $\alpha$ as the probability of choosing strategy
    $A$, and thus $D$ is played with probability $1-\alpha$. For symmetry reasons,
    $\alpha$ is the same for both players. Finding it can be done through the indifference
    principle stating that $u_S(A, \alpha) = u_D(D, \alpha)$, which results in $10
    - 10\alpha = 6\alpha - 4 + 4\alpha$


    $\alpha \cdot 0 + (1-\alpha)10 = \alpha \cdot 6 + (1-\alpha) \cdot (-4)$,


    and thus $\alpha = 0.7$.


    ![](img/adcae123bfc4ba205d992d916e340a6b_16_0.png)


    Figure 1.3: Mixed Nash equilibrium of the game.


    Exercise 1.3. A transmitter-receiver pair works without coordination for a single
    communication. The transmitter can either: concentrate its transmission on a single
    frequency $f_0$ (C) or spread its transmission over the entire spectrum (S). Just
    using $f_0$ costs 2 units of power, while using the spread spectrum costs 9 units
    of power. The receiver can listen to one frequency $f_1$ (A), or two frequencies
    $f_1$ and $f_2$ (B). Note that it is not known that $f_0 = f_1$ or $f_0 = f_2$.
    If the transmitter uses $S$, the utility of the receiver is 2 plus the number
    of frequencies used. If the transmitter uses $C$, the utility of the receiver
    is 2 minus the number of frequencies used. The utility of the transmitter is equal
    to twice the utility of the receiver plus the number of used by the receiver and
    minus the power cost. Also, note that the pure strategies described above (for
    both players) can be meaningfully combined into a mixed strategy.


    - 1. Draw the normal form of the game.

    - 2. Find all pure strategy Nash equilibria of the game.

    - 3. Does the game have a mixed strategy Nash equilibrium? If yes, find it. If
    not, prove why.


    # Solution


    - 1. The set of players is {T, R}, with respect strategy sets $S_T = \{C, S\}$
    and $S_R = \{A, B\}$. The payoffs of the normal form can be represented in a bitrix
    as follows.


    | | A | B |

    |---|---|---|

    | T | C | 1, 1 | 0, 0 |

    | S | -2, 3 | 1, 4 |


    - 2. Nash equilibria are found when the strategy played by each player is a best
    response to the other. A''s best responses to B are underlined, B''s best responses
    are overlined.


    | | A | B |

    |---|---|---|

    | T | C | 1, 1 | 0, 0 |

    | S | -2, 3 | 1, 4 |


    This is a coordination game and has two pure strategy Nash equilibria: (A,C) and
    (B,S).


    - 3. There is a mixed strategy equilibrium. It can be found by setting $p$ as
    the probability that the transmitter plays $C$ and $q$ as the probability that
    the receiver plays $A$. Thus, for T: playing $C$ gives utility $q$ and playing
    $S$ gives utility $-2q+1-q$. $C$ is preferred if $q>1-3q$, that is $q>1/4$. For
    R: playing $A$ gives utility $p+3(1-p)$ and playing $B$ gives utility $4(1-p)$.
    $A$ is preferable if $3-2p>4-4p$, that is $p > 1/2$. The mixed Nash equilibrium
    is found as $p = 1/2, q = 1/4$.


    ![](img/adcae123bfc4ba205d992d916e340a6b_18.png)


    Figure 1.4: Mixed Nash equilibrium of the game.


    # Game Theory – A handbook of problems and exercises


    **Exercise 1.4.** Two students, Charlotte and Daniel, need to write their Thesis.
    They need to choose (independently and unknown to each other) a supervising professor.
    Three professors are available for this role: Xavier, Yuan, and Zingberry. The
    utility of a student is given by the amount of help they receive from their supervisor,
    which is quantified as 40 for Xavier, 60 for Yuan, 50 for Zingberry. If the two
    students select the same professor, they get half the utility they would get alone.


    - 1. Write the game in normal form.

    - 2. How many Nash equilibria does this game have?

    - 3. If your answer of the previous point included one or more equilibria, write
    all of them explicitly (i.e., evaluate the probabilities that each professor is
    chosen).


    # Solution


    - 1. The set of players is (C, D), and common set of strategies is $S_C = S_D
    = \{X, Y, Z\}$. The normal form of the game can be represented as a bi-matrix
    as follows.


    | | X | Y | Z |

    |---|---|---|---|

    | X | 28,28 | 40,60 | 40,50 |

    | Y | 60,40 | 42,42 | 60,50 |

    | Z | 50,40 | 50,60 | 35,35 |


    - 2. Strategy $X$ is strictly dominated by $Y$. Thus, we can remove it. We are
    left with the following reduced game:


    | | Y | Z |

    |---|---|---|

    | C | 42,42 | 60,50 |

    | Z | 50,60 | 35,35 |


    This game has 2 Nash equilibria in pure strategies: $(Y,Z)$ and $(Z,Y).


    - 3. It is easy to see that there must also be a NE in mixed strategies, where
    the support of both mixed strategies includes $Y$ and $Z$, while $X$ is discarded
    as it is strictly dominated. Since the matrix is symmetric, the mixed strategies
    that are played in the Nash equilibrium must be equal for both players. If $p$
    is the probability of either of the players choosing $Y$, the mixed strategy equilibrium
    must satisfy the following condition:


    ```

    42p + 60(1-p) = 50p + 35(1-p)

    ```

    which leads to $33p = 25$ and hence $p = 25/33$. Thus, the mixed Nash equilibrium
    consists in both players adopting the strategy “play $X$ with probability $0$,
    $Y$ with probability $p$, $Z$ with probability $1-p$, where $p = 25/33$.


    ![](img/adcae123bfc4ba205d992d916e340a6b_20_0.png)


    Figure 1.5: Mixed Nash equilibrium of the game.


    Exercise 1.5.** Alice (A) and Bob (B) want to play together War Fantasy World,
    a very popular online game. When players create a character for the game, they
    are asked to select a race, and 4 options are available: Dwarves (D), Elves (E),
    Humans (H), and Orcs (O). Alice and Bob create characters simultaneously and independently.
    Their combined choice gives them utilities, whose values are the benefit of the
    team, minus the cost. The cost is 0 for Humans, 3 for Orcs, 4 for Dwarves, 5 for
    Elves.


    Humans are vanilla characters; they do not get a benefit of -3 (i.e., decrease
    their benefit by 3). Orcs get to receive an additional benefit of +5 to the other
    player. Dwarves give an additional benefit of +15 to the other player only if
    they are an Elf too. All of these rules are common knowledge.


    - 1. Write down the normal form of the game.

    - 2. Find the Nash equilibria of this game in pure strategies.

    - 3. Find any additional equilibrium of this game in mixed strategies.


    # Solution


    - 1. The set of players is {A,B}, with strategy set $S_A = S_B = \{H, E, D, O\}$.
    Payoffs are:


    | | H | E | D | O |

    |---|---|---|---|---|

    | A | 0,0 | 0,-5 | 5,-4 | -3,-3 |

    | E | -5,0 | 10,10 | 0,-4 | -8,-3 |

    | D | -4,5 | -4,0 | 1,1 | -7,-2 |

    | O | 2,-3 | 2,-8 | 2,-7 | -6,-6 |


    By applying IEDSY, strategy D can be eliminated as it is strictly dominated by
    H for both players. Also strategy O can be eliminated for player B. strategy H
    is eliminated for player A. This reduced matrix survives:


    | | H | E |

    |---|---|---|

    | A | -5,0 | 10,10 |

    | O | 2,-3 | 2,-8 |


    - 2. The Nash equilibria are (O, H) and (E, E).


    - 3. The mixed-strategy equilibrium is found with Alice playing E with probability
    $p$ and O with $1-p$; Bob playing H with probability $q$ and E with $1-q$. Applying
    the indifference principle Alice''s payoff at the equilibrium satisfies


    ```

    -5q + 10(1-q) = 2

    ```

