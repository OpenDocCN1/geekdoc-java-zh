    - 3. Y 在上述 SPE 中执行的策略可以描述为“DSC”。第一个二值值是在 B 和 D 之间的选择，描述了顶部节点的操作。第二个和第三个变量是下方节点的操作，可以是
    $C$ 或 $S$。


    ## 3. 序贯博弈


    **练习题 3.6。** 妻子 (W) 和丈夫 (H) 分担家务。由于 W 从上午 10:30 工作到下午 18:30，W 有两次机会做点什么，分别是早上
    7:00 和晚上 7:00。而 H 负责两个班次，早晨和下午直到深夜，因此他只有一个机会贡献，即下午 2:00。家里有项家务：准备食物（F）或打扫房屋（C）。如果任何成员执行某项家务，他/她将支付个人成本，两个成员将获得相同的收益：F
    收益 30 但成本 10，C 收益 50 但成本 20。此外，如果 W 在第一次机会没有执行这些行动，成本为 10 但为双方额外增加 10 收益。或者，任何玩家在任何回合都可以“什么都不做”（N），而不是选择其中一个游戏（如果食物在之前的回合已经准备好了，执行者只能打扫房屋）。


    - 1. 写下该博的扩展形式。

    - 2. 该游戏中有多少个子博弈完美均衡？说明找到它们的过程。

    - 3. 实际上找到它们。


    # 解答


    - 1. 扩展形式如图 3.6 所示。


    ![](img/adcae123bfc4ba205d992d916e340a6b_62_0.png)


    - 2. 该游戏有一个子博弈完美均衡，找到它的方法是逆向推理。


    - 3. 在逆向推理的第一轮，W 玩且最后一层的所有节点至少有一个替代方案——其中第一个玩家收益更高。现在，树中没有这些叶子节点，而是由 F、C 和 N 的子树组成。


    ![](img/adcae123bfc4ba205d992d916e340a6b_63_0.png)


    在第二轮，H 在给他最高收益的新叶子节点中选择。


    ![](img/adcae123bfc4ba205d992d916e340a6b_63_1.png)


    最后一轮由 W 在 F、C 和 N 之间选择。她选择 N，因为这是效用最大的选项。因此，子博弈完美均衡的结果是第一轮什么都不做（N），第二轮准备食物（F），第三轮打扫房屋（C）。这实际上是均衡路径：子博弈完美均衡必须规定所有子博弈的策略，即使是那些从未到达的。描述玩家在各种子博弈中行为的策略可以写为：


    $(s_W, s_H) = (NCFCFC, NNF)$


    其中 $s_W$ 从根节点到树的最后一层，而 $s_H$ 是中间层的所有节点，同样从左到右。


    ## 3. 序贯博弈


    **练习题 3.7。**  Anita (A) 和 Ben (B) 是两个姐妹。一个下午，她们在一起玩，决定在不让父母知道的情况下拿糖。家里有两个柜子，一个是衣柜（C），有
    5 颗糖，另一个是卧室（D），有 10 颗糖。她们同时选择一个房间冲过去抢糖。如果她们选择不同的房间，每个人都可以得到各自柜子的所有糖。如果她们去同一个房间，将分配她们找到的糖。分配的方式是
    Anita 提出一个方案（由她将获得的糖的数量表示；方案必须包含双方的正数糖），Ben 可以同意方案或抱怨。如果 Anita 的方案被 Ben 接受，姐妹俩将这样分配糖。否则，Ben
