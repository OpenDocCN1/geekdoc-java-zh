    ## 6. 贝叶斯博弈


    在生成的四个节点中，B 可以选择 F 或 Y，收益在 8 个叶子节点中计算。


    请注意，由于 C 是一个揭示动作，得益于序列理性，上部分可以被简化，因为 B 在其上部节点中将始终分别选择 Y 和 F。上部分实际上 B 只有一个理性选择，且当小工具有效时（B
    总是让步）收益为 30, 50；当小工具无效时（B 总是战斗）收益为 –20, 80。所得的树如图 6.15 所示。


    ![](img/adcae123bfc4ba205d992d916e340a6b_148_0.png)


    图 6.15：应用序列理性后博弈的简化扩展型形式。


    - 2. 随后，正型形式表示可以简化 B 的策略，因为当 A 玩 L 时，只考虑 F 或 Y 的二元选择是有意义的。B 的其他选择都是自动的。A 的策略是
    C/L 值的对，描述了在小工具有效和无效时做什么。例如，CC 意味着 A 无论如何发起揭示活动（汇聚策略），而 CL 意味着他们只在小工具有效时这样做（分离策略）。相反，B
    的策略是在 A 玩 L 时做什么，这是在 F 和 Y 之间的单一二元选择。


    生成的双矩阵即为：


    - 3. LL 是 A 的严格优势策略，唯一的纳什均衡（NE）是 (LL, Y)。如果我们指定 B 在非单元素信息集中的信念，这会导出一个汇聚贝叶斯完美均衡（PBE）。由于这是一个汇聚
    PBE，B 在看到 L 后信念仅仅是先验概率。还要注意，B 的完整策略还规定，如果 A 玩 C 并揭示类型，其反应是在无效时战斗，有效时让步。


    | | B | Y |

    |---|---|---|

    | CC | 5, 65 | 5, 65 |

    | CL | 15, 65 | 40, 50 |

    | LC | 30, 40 | 15, 65 |

    | LL | 40, 50 | 50, 50 |


    练习 6.13. Alberto (A) 和 Gianluca (G) 是两个在大学同一专业学习的朋友。他们一直在寻找参加 Erasmus 计划的申请目的地，并确定了两个：科英布拉
    (C) 和桑坦德德 (S)。这些目的地收到的请求不多，因此这两个朋友确信他们的申请在其中任何一个中都会接受。然而，他们必须独立且分地申请 Erasmus，选择一个目的地（实际上，他们选了两个，但由于分配了优先级，只有第一个选择有效，因为申请会被接受）。在他们最后一次聊天中，G
    透露他更倾向于 C，但他最高的偏好是和朋友 A 一起去。在数值上，这意味着他为与 A 一起去 C 和 S 分别分配了 2 和 1 的效用；去往 A 不同目的地的效用为
    0。A 的感受也一样，但 G 并没有完全说服：他知道 A 在派对上遇到了一位来自桑坦德德的女性交换生，也许他想去 S 再次见到她。A 对那个女孩有些留恋的概率是
    p，这个值是一个共同先验。A 知道自己是否感兴趣。如果 A 想追求女孩，玩 S 是一个总是效用2 选择，而 C 给 0。如果 A 对女孩并不真的感兴趣，他的效用与
    G 相同。


    - 1. 写出该博弈的扩展型。

    - 2. 写出该贝叶斯博弈的类型-代理表示的正型（其中所有玩家的策略都表示为动作的 n 元组，每个类型一个）。

    - 3. 讨论该博弈的贝叶斯纳什均衡（BNE）。你应该发现存在一个纯策略的 BNE，其中 A 玩的是汇聚策略。找到 p 在什么取值下，存在另一个具有完全分离策略的
    NE。


    ### 答案


    - 1. 扩展型是图 6.16 所示的树。第一个节点是自然（Nature），A 是否感兴趣的概率分别为 p 和 1-p。在下方，A 移动并区分下方的两个节点，因为他知道自己是否对女孩感兴趣。他的选择是
    C 或 S，导致四个节点。在下方，G 移动且不区分其中任何一个，因此他有一个包含所有节点的单一信息集。对于这些节点，他的选择都是 C 或 S。

    - 2. 玩家 A 有一个类型，他的类型-代理表示有 4 种策略（两个类型，两个动作）：CC, CS, SC, SS。正型表示为：


    | | CS | SC | SS |

    |---|---|---|---|

    | A | 2, 2-2p | 0, 2p | 2, 2-2p | 2p, 0 |

    | S | 0, 0 | 1-p, 1-p | 2p, p | 1+p, 1 |


    ![](img/adcae123bfc4ba205d992d916e340a6b_150_0.png)


    图 6.16：贝叶斯博弈的扩展型。


    - 3. 如果 A 玩 $SS$，G 的最佳反应是玩 S，反之亦然（这是因为 $2p \leq 1+p$ 成立）。因此，$(SS,S)$ 是一个 BNE，其中
    A 玩的是汇聚策略，意味着 A 无论类型如何都玩相同的。这是 G 玩 S 的唯一 BNE，因为 SS 是唯一的反应。事实上，如果 G 玩 C，A 的最佳反应是玩
    SC；这只在 p 较低时发生，而如果 p 很高，G 对 SC 的最佳反应是玩 S。从矩阵中看到，我们需要 $2-2p \geq p$ 才能成立，翻译为 $p
    \leq 2/3$，在这种情况下 $(SC,C)$ 也是一个 BNE。这种策略是分离的，取决于他的类型。


    '
