    which player(s) have a type, who moves first, what are the payoffs.

    2. Give the normal form of this game with type-agent representation of players,
    i.e., their strategies are tuples of actions (one type).

    3. Find all Nash equilibria in pure strategies and discuss what kind of equilibrium
    concept is appropriate for this game.


    #### Solution


    1. The extensive form of this game is shown in Figure 6.8.


    Nadia has a type, i.e., the original cost of the trousers, known to her, but not
    to Mark. Thus the first move is Nature''s deciding about this cost with probability
    $p$ or $1-p$. Two nodes belong to the same information set: if Mark decides to
    play $I$, the game ends without Nadia having a say. If Mark plays $W$, then Nadia
    is allowed to move, and her available moves are $K$ and $L$.


