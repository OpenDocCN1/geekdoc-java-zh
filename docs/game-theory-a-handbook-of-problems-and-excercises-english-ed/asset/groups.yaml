    2. Find all the Nash equilibria of the two-stage game.

    3. Find all the subgame-perfect Nash equilibria of the two-stage game and explain
    why they are subgame-perfect.


    # **Solution**


    1. The normal form of the second stage of the game is:


    | | H | F |

    |---|---|---|

    | C | -1, -1 | -100, 0 |

    | D | 0, -100 | -4, -4 |


    The extensive tree is tree depicted in Figure 5.2.


    ![](img/adcae123bfc4ba205d992d916e340a6b_107_0.png)

