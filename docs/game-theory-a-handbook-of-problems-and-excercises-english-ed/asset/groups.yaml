    # 5.2 Finite horizon


    The solution approach for finite horizon is analogous to backward induction. One
    must consider the last stage, since in that case there is no impact on future
    decisions, which are non-existent, and therefore the players simply choose an
    NE (i.e., they very selfishly act like "there is no tomorrow". Then, this conclusion
    is propagated back to the penultimate stage and so on.


    This leads to different conclusions about the nature of NEs in the stage games.
    If the last stage has a single NE, then the rational players are fully aware of
