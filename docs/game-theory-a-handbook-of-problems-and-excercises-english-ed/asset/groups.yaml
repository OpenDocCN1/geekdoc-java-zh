    ### Exercise 6.5. John (J) sees his friend (C) downtown. Actually, John is near-sighted
    and he is not really sure whether the girl is Camilla or not. The probability
    that C is actually Camilla is estimated as $p$, and this is a common prior. John
    can either ignore ($I$) the girl or greet ($G$). If J chooses $I$, the game ends
    with an ashamed J getting payoff $-20$; in this case, C gets -50 if she is really
    Camilla, otherwise she gets 0. If J chooses $G$, then the girl has two choices,
    wave (W) at John, or stay (S) and go ahead. If the girl wave back: J always gets
    payoff 10 if she is the real Camilla, otherwise she also gets 10. If the girl
    stays silent: if the girl is Camilla, J gets $-50$ and C gets 10; otherwise they
    get 0.


    1. Represent this Bayesian game with players J and C (in this order) in extensive
    form.

    2. Represent this Bayesian game in normal form, with a type-agent representation
    of player C.

    3. Find the Nash equilibria of the game in pure strategies if $p = 0.3$ and discuss
    what kind of equilibrium concept is appropriate for this game.


    #### Solution


    1. This is a Bayesian entry game. The extensive form is the tree of Figure 6.7.


    Figure 6.7: Extensive representation of the Bayesian game.


    2. Type-agent representation C decides a strategy as a pair of actions (Camilla
    – not Camilla). For example, $SW$ means $C$ does not wave if she is Camilla, while
    she does if she is not. This leads to the following matrix.


    | | SS | SW | WS | WW |

    |---|---|---|---|---|

    | J | -20, -50p | -20, -50p | -20, -50p | -20, -50p |

    | G | -50p, 10p | 10-50p, 10 | 10p, 30p | 10, 20+10p |


    3. If $p = 0.3$ the matrix above becomes


    | | SS | SW | WS | WW |

    |---|---|---|---|---|

    | $J$ | -20, -15 | -20, -15 | -20, -15 | -20, -15 |

    | $G$ | -15, 3 | -5, 10 | 3, 9 | 10, 23 |


    The only Bayesian Nash equilibrium is $(G, WW)$. This is also subgame-perfect,
    since $W$ is best response to $G$, regardless of whether the girl is Camilla or
    not. Since this is a Bayesian entry game of the screening kind, discussing subgame-perfect
    equilibria is sufficient. If one wants to translate this into a PBE, it is sufficient
    to explicitly include the beliefs, but they are just the prior for the only non-typed
    player $J$, that moves first and therefore has no chance to observe $C$''s move
    to update them.


    ### Exercise 6.6. Mark (M) needs to buy a new pair of trousers at the shop owned
    by Nadia (N) within the week. The price at the beginning of the week is €50. Mark
    can buy the trousers immediately (I) or wait until the end of the week (W) hoping
    that Nadia will offer a promotion. Indeed, Nadia has the option of keeping the
    price identical (K) for the whole week or lowering the price (L) to €30 at the
    end of the week and is pondering what to do. Nadia''s choice depends on the original
    cost of the trousers she paid, which she knows (but Mark does not). With probability
    $p=0.75$, the trousers cost €20, she still makes a profit out of the lower price.
    With probability $1-p$, she pays €35 for the trousers, so she is not happy about
    a discount. The value of $p$ is a common prior. Mark and Nadia''s respective evaluation
    of a new pair of trousers is €100, and having the transaction made at the end
    of the week implies lower utility by a factor $\delta=0.8$ for both of them (note:
    $\delta$ is a discount factor, but applies to the utilities, it has nothing to
    do with the discount on the sale price). Finally, if Nadia is able to afford a
    discount without an economic loss, she also gains an equivalent of €20 due to
    increased customer satisfaction (Mark will return to her shop to buy more clothes).


