    form.


    +   2. Represent this Bayesian game in normal form, with a type-player representation
    of player S.


    +   3. Find the Bayesian Nash equilibria of the game in pure strategies if p =
    0.7 and discuss what kind of equilibrium concept is appropriate for this game.


