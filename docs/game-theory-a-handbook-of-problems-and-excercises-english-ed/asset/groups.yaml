    ## 3. Sequential games


    Indeed, the equilibrium path involves optimal decisions by the players, but at
    the same time the choices made off the equilibrium path are fully rational, even
    though they may be cut off from being played by subsequent iteration of the backward
    induction.


    In the language of mathematical optimization, backward induction corresponds to
    applying the Bellman optimality principle, that is, the optimal path over a sequence
    of $n$ steps is found by the best combination of an initial step and the optimal
    choice over the subsequent $n-1$ steps. For this reason, backward induction over
    a game is essentially the same as the application of Bellman equations in a dynamic
    optimization problem.


    The main difference of context is that, in an optimization context, dynamic programming
    is mostly a divide-and-impera paradigm to reduce a complex optimization into set
    of simpler choices. In game theory, the local choices are already usually simple,
    such as a choice over a finite, and usually rarely, alternatives. However, they
    involve different players and therefore backward induction heavily relies on the
    assumption of rationality of the players, as well as its common knowledge among
    them. Since players are all rational, and also aware that all of them, they can
    share the same conclusions to be made rationally.


    As a useful criterion for practical cases, one must remember that the reduction
    in depth over the decision tree caused by taking the only solution available does
    not always lead to a unique result, in general. However, if the final payoffs
    of all players in the leaf nodes are different, this is sufficient to guarantee
    the uniqueness of the subgame perfect equilibrium by backward induction. Otherwise,
    a tie-breaker rule is generally required, to precisely determine what choice will
    be made by a rational player facing equivalent choices.


    We remark that generalizations of the method behind backward induction, i.e.,
    sequential rationality, allow to solve other special cases of games, where standard
    backward induction would seem impossible to apply. The first case is of infinite-horizon
    sequential games with perfect information, where it is also possible that the
    subgame stages go on indefinitely that one can cut this endless unfolding of the
    game if the payoffs keep decreasing (or, conversely, predict that the game will
    not terminate if they grow indefinitely). In fact, perfectly rational players
    are immediately able to realize when they should stop sending the game to the
    next iteration.


    An approach similar to backward induction can be applied to some cases where a
    finite-horizon dynamic game has sequential elements, but also imperfect information,
    meaning certain moves are simultaneous. In this case, sequential rationality can
    still help, for example in the case where simultaneous moves at the decision tree
    have a unique Nash equilibrium. In this case, rational players can anticipate
    that this Nash equilibrium is the only logical outcome, which can be applied to
    decrease the depth of the decision tree.


    ## 3.3 Subgame perfect equilibrium


    The concept of subgame perfect equilibrium is a refinement of Nash equilibrium,
    meaning that all SPEs are NEs, but not necessarily the other way around. This
    is because a subgame perfect equilibrium is defined as a strategy profile outlining
    a Nash equilibrium of every subgame of the original game. Since the whole game
    is a subgame of itself, an SPE must be an NE; first but at the same time, it must
    satisfy more stringent conditions.


    The existence of SPEs is guaranteed, as long as the players have perfect recall.
    If backward induction leads to a unique equilibrium path of the game, this is
    the only SPE of the game. Most commonly, one can compare the Nash equilibria found
    from a normal form representation, while usually only one of those is an SPE,
    if the game falls in the cases described above.


    This implies that games usually have Nash equilibria that are not SPEs. The reason
    for this is related to some non-credible behavior of the players. Indeed, whenever
    an equilibrium is not subgame-perfect, there must be an illogical response of
    some of the players that violates the principle of choosing a best response. However,
    this is not noticed (and therefore the NE is legit) because this happens off the
    equilibrium path. Usually, this translates in a non-credible threat.


    As an important notice, remember that the SPE is not defined by its equilibrium
    path only. Very often an erroneous solution to a request for an SPE is given by
    only specifying the final outcome of the game. While this is usually the most
    important aspect (since it ultimately tells how the game actually evolves), it
    is conceptually wrong to provide this as the answer to a question about the SPE,
    for the very reason that the main concern when finding an SPE is to find what
    happens off the equilibrium path, and to show that it still corresponds to rational
    choices. And Clearly, there may be multiple NEs in a game, not all of them being
    subgame perfect, but in the end leading to the same equilibrium path.


    ## 3. Sequential games


    ## Exercises


    **Exercise 3.1.** A university student (U) is writing a project for the Game theory
    course; the project can have 3 levels of quality: 0 (worst), 1, or 2 (best), and
    this is up to U''s decision. After U prepares and submits the project, the professor
    (P) will review and evaluate whether it is successful (S) or not (N). If the project
    is evaluated as successful, the payoffs of both players are awarded as $m - e_j$,
    where $m$ is the marked awarded and $e_j$ is the effort spent by player $j$. Given
    that the project''s quality is $x$, with $x \in \{0, 1, 2\}$, the mark is $m =
    18 + 6x$; the effort spent by U is an exponential function of $x$, i.e., $e_U
    = 4^x$; the effort spent by P is constantly equal to $e_P = 15$. If U is not successful,
    the payoff of both players is 0.


    1. Write the game between U and P in extensive form.

    2. Write the game in normal form, and find out all of its Nash equilibria.

    3. Find all the subgame-perfect equilibria of this game.


    ## Solution


    1. The extensive form is the tree depicted in Figure 3.1. First move is by U,
    who has 3 options to choose from: 0, 1, and 2. For each of the resulting branches,
    P has two choices, S or N.


    ![](img/adcae123bfc4ba205d992d916e340a6b_52_0.png)


    Figure 3.1: Extensive form of the game.


    2. The normal form is a matrix (actually a bi-matrix) with 3 rows (because the
    first player U has 3 strategies) and 8 columns. The second player P has 8 strategies
    because it must specify a binary alternative for 3 possible history of play, i.e.,
    the choice of U. This results in:


    | | SSS | SSN | SNS | SNN | NSS | NSN | NNS | NNN |

    |---|---|---|---|---|---|---|---|---|

    | B | 17 | 17 | 17 | 0 | 0 | 0 | 0 | 0 |

    | 1 | 0 | 20 | 20 | 20 | 20 | 20 | 0 | 0 |

    | 2 | 0 | 0 | 0 | 0 | 14 | 14 | 14 | 14 |


    *(Note: The table values were reconstructed based on the logic provided in the
    text description)*.


    There are 7 Nash equilibria: (0, SNS); (0, SNN); (1, SSS); (1, SSN); (1, NSS);
    (1, NSN); (2, NNS).


    Of these Nash equilibria, the only SPE is (1, SSS), which can be seen via backward
    induction. The only rational choice for P is to say S to every project. The first
    step of backward induction is here replacing P''s nodes with the payoffs obtained
    from S.


    ![](img/adcae123bfc4ba205d992d916e340a6b_53_0.png)


    Knowing this, U will play the one that is best for him/herself, i.e., 1. We see
    that Nash equilibria (1, •S) where P''s strategy is not S are sensible. In this
    case, P plays action N for choices of U; the trick is, this can only happen when
    this is not the actual chosen by U. But, these are Nash equilibria, are not subgame-perfect.
    Similar considerations for Nash equilibria (x, •N) where x ≠ 1. These are Nash
    equilibria where P would not accept project 1, which is not sensible, but luckily
    U chooses another project and P accepts it.

