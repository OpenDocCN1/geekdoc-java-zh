    it, you do not need much beyond what are discussed in this exercise, as most of
    the analyzed interactions precisely involve Bayesian situations of competing transmitters,
    even though the actual development of the game may be more complicated or have
    more players.

    The extensive form of this game is the tree depicted in Figure 6.5.


    +   2. Type-player representation of player S decides a strategy as a pair of
