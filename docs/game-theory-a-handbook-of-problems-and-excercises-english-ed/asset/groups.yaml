    有辆车，会开车去她选择的地方；此外，如果 Y 在所选地点没有找到她的妹妹，她（仅限她）有一个额外的选择：更换地点（C）以与妹妹会合，或者留在原地（S）。相比之下，Z
    乘坐单向巴士，被迫留在她的所在地。收益评估如下：Y 偏好 B，带给她效用 4，而 D 带来 1。如果她们一起庆祝费拉格节，她们的效用都会增加 5。对于 Y
    来说反过来，D 带来 7，而 B 带来 1。此外，如果 Y 没有开两次车，她的最终效用将减少 3，即在第二轮玩 C 来找到她的妹妹（留在原地不会改变第一轮的效用）。例如，如果
