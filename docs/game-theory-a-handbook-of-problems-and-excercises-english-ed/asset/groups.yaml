    ## 30 博弈论 – 问题与练习题手册


    零和游戏实际上是一个更广泛类别的特殊用例，该类别共享了玩家之间相互竞争的描述性原理，但其收益并不为 0。这些游戏有时被称为竞争游戏或冲突游戏。通过适当的效用变换，可以将未改变但设置不同的游戏转换为零和游戏。


    例如，考虑两个玩家争夺共享资源 $R$ 的游戏，比如一个美味的派。无论玩家 1 获得了 $x$，玩家 2 将得到 $R-x$。因此，从技术上来说，这个游戏是
    $R$-总和而非零和，但可以对效用进行重新缩放（例如考虑与值 $R/2$ 的差值）来实现零和游戏。


    或者，可以考虑足球赛后分配积分的旧规则。在 80 世纪之前，每场比赛通常分配 2 分，即获胜者得 2 分，失败者得 0 分，平局时双方“平分积分”。因此，这就是
    $R = 2$ 的情况。在竞争中，该规则被改为获胜得 3 分，该游戏不再能转换为适当的零和设置，尽管其竞争性质是显而易见的。在实践中，竞争游戏是指所有结果都是帕累托有效的情况，因为玩家在不让另一个玩家移动的情况下无法提高收益。


    ## 2.2 极大与极小极大


    如果 $i$ 面临泛义描述为 $-i$ 的其他玩家（博弈论的典型特征），这些玩家的策略分别由 $s_i$ 和 $s_{-i}$ 描述，最后 $u_i(s_i,
    s_{-i})$ 是 $i$ 的效用，则 $i$ 的极大极（maximin）和极小极大（minimax）计算如下：


    $$\maximin_{s_i} = \max_{s_i} u_i(s_i, s_{-i}), \quad \minimax_{s_i} = \min_{s_i}
    u_i(s_i, s_{-i}) \quad (2.1)$$


    它们的名称原因从定义上很清楚。


    极大极（也称为安全收益）代表了 $i$ 在不知道其他玩家所选策略的情况下，即使在保守（即最坏情况）假设下也能实现的最大收益。相反，极小极大是 $i$ 在已知
    $-i$ 策略的情况下可以获得的保底收益，因为 $i$ 是一个理性玩家，会选择最佳响应，因此极小极大是 $i$ 在执行最佳响应时获得收益的最低值。


    这些概念在极小极大定理的背景下相关该定理结合了两个属性。第一个是每当零和游戏的极小极大和极大极重同时，它们的值也对应于纳什均衡（NE）收益（纳什均衡不一定唯一，但所有纳什均衡的收益相同）。注意，这一结果对于非零和游戏通常是不成立的。此外，如果策略
    $s_i$ 和 $s_{-i}$ 选择为混合策略，因此 $u_i$ 计算为期望效用，那么期望值内线性组合的效用使得极大极和极小极大在对混合策略进行计算时


    ## 2. 零和游戏与极小极大


    重合，这是观察纳什均衡存在性纳什定理的另一种方法，但具有附加属性，即所有纳什均衡共享相同的收益值，这是游戏为零和的结果。


    此外，利用该定理的线性规划方法可以得出零和游戏纳什均衡的高效计算。这对应于考虑两个玩家纯策略下效用的线性组合。如果极大者和极小者分别有 $L$ 和 $M$
    个可用纯策略，则优化变量是极大者 $L$ 个纯策略的权重，对于每个策略可以考虑 $M$ 个约束，其中线性组合大于等于松弛变量 $w$。反之，松弛变量 $w$
    是极大目标。注意这种方法同时获得了混合策略下纳什均衡的收益值以及混合策略纳什均衡本身的支撑，后者由约束确定——


    最后，对偶方法也是可能的，极大者和极小者的角色反转（因此优化目标是最小化而非最大化），这与之前不同，得到一个具有 $M$ 个变量和 $L$ 个约束的问题。最终选择哪种方法更方便取决于
    $L$ 和 $M$ 的数值。


