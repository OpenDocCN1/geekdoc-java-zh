    练习 **1.2.** 正方形先生 (S) 和三角形女士 (T) 在 xy 坐标系中选择一个点。他们的选择是独立进行的，且互不知晓，但他们完全了解对方的选择规则。在选择之后，他们将获得以下奖励，计算方式为收入减去成本：


    - 如果他们选择同一个点，双方获得的收入为 0；如果他们选择了不同的点，双方都获得 10 点的收入。

    - 成本计算公式为 $x + 3y$，其中 $x$ 和 $y$ 是所选点的坐标。


    玩家 S 可以选择这四个点中的一个：$A (0,0)$，$B (0,4)$，$C (4,0)$，$D (4,4)$。玩家 T 可以选择这三个点中的一个：$A
    (0,0)$，$E (2,4)$，$D (4,0)$。


    回答以下问题：


    - 1. 这是一个什么类型的游戏？写出它的标准型表示（normal-form representation）。

    - 2. 找到该游戏的所有纯策略纳什均衡。

    - 3. 找到该游戏的所有纳什均衡。


    # Solution


    - 1. 这是一个完全信息静态游戏。标准型表示可以显示为一个双矩阵（bi-matrix），其中玩家集合为 $\{S, T\}$。他们的策略集为 $S_S =
    \{A, B, C, D\}$，$S_T = \{A, D, E\}$。


    | | A | D | E |

    |---|---|---|---|

    | S | A | 0,0 | 10,6 | 10,-4 |

    | B | -2,10 | -2,6 | -2,-4 |

    | C | -6,10 | -6,6 | -6,-4 |

    | D | 6,10 | -4,-4 | 6,-4 |


    - 2. 很容易发现 $B$ 和 $C$（对于玩家 S）以及 $E$（对于玩家 T）是被支配策略（例如被 $A$ 支配）。因此，玩家只能选择 $A$ 或 $D$。通过观察法发现
    $(A, D)$ 和 $(D, A)$ 确实是纯策略纳什均衡。


    | | A | D |

    |---|---|---|

    | S | A | 0,0 | 10,6 |

    | D | 6,10 | -4,-4 |


    - 3. 存在一个混合策略纳什均衡：它是很容易发现的，因为这个游戏类似于“性别大战”之类的协调游戏，但其目标是双方都选择不同的策略（即不在同一个点相遇）。这实际上被称为一种**反协调游戏**（anti-coordination
    game）。要找到混合策略均衡，只需将 $\alpha$ 设置为选择策略 $A$ 的概率，则选择 $D$ 的概率为 $1-\alpha$。由于对称性原因，两个玩家的
    $\alpha$ 相同。可以通过无差异原理（indifference principle）找到，即 $u_S(A, \alpha) = u_D(D, \alpha)$，得到
    $10 - 10\alpha = 6\alpha - 4 + 4\alpha$


    $\alpha \cdot 0 + (1-\alpha)10 = \alpha \cdot 6 + (1-\alpha) \cdot (-4)$，


    因此 $\alpha = 0.7$。


    ![](img/adcae123bfc4ba205d992d916e340a6b_16_0.png)


    图 1.3：游戏的混合纳什均衡。


    练习 1.3. 一对发射器-接收器在没有协调的情况下进行单次通信。发射器可以：将其传输集中在单一频率 $f_0$ 上 (C)，或者将其传输扩展到整个频谱 (S)。仅使用
    $f_0$ 需要消耗 2 个单位的功率，而使用扩展频谱需要 9 个单位功率。接收器可以监听一个频率 $f_1$ (A)，或者两个频率 $f_1$ 和 $f_2$
    (B)。注意，不知道 $f_0 = f_1$ 还是 $f_0 = f_2$。如果发射器使用 $S$，接收器的效用为 2 加上使用的频率数量。如果发射器使用
    $C$，接收器的效用为 2 减去使用的频率数量。发射器的效用等于接收器效用的两倍加上接收器使用的数量，减去功率成本。此外，注意上述描述的纯策略（对于两个玩家）可以有意义地组合成混合策略。


    - 1. 画出游戏的标准型。

    - 2. 找到游戏的所有纯策略纳什均衡。

    - 3. 该游戏是否存在混合策略纳什均衡？如果有，找到它。如果没有，证明原因。


    # Solution


    - 1. 玩家集合为 {T, R}，对应策略集 $S_T = \{C, S\}$ 和 $S_R = \{A, B\}$。标准型的收益可以用如下双矩阵表示。


    | | A | B |

    |---|---|---|

    | T | C | 1, 1 | 0, 0 |

    | S | -2, 3 | 1, 4 |


    - 2. 当每个玩家所执行的策略都是对方的最佳反应时，即可找到纳什均衡。A 对 B 的最佳反应已下划线，B 对 A 的最佳反应已上划线。


    | | A | B |

    |---|---|---|

    | T | C | 1, 1 | 0, 0 |

    | S | -2, 3 | 1, 4 |


    这是一个协调游戏，并有两个纯策略纳什均衡：(A,C) 和 (B,S)。


    - 3. 存在混合策略均衡。可以通过设置 $p$ 为发射器执行 $C$ 的概率，$q$ 为接收器执行 $A$ 的概率来找到。因此，对于 T：来说执行 $C$
    的效用为 $q$，执行 $S$ 的效用为 $-2q+1-q$。如果 $q>1-3q$，则优选 $C$，即 $q>1/4$。对于 R：来说执行 $A$ 的效用为
    $p+3(1-p)$，执行 $B$ 的效用为 $4(1-p)$。如果 $3-2p>4-4p$，则优选 $A$，即 $p > 1/2$。找到混合纳什均衡为 $p
    = 1/2, q = 1/4$。


    ![](img/adcae123bfc4ba205d992d916e340a6b_16_0.png)


    图 1.4：游戏的混合纳什均衡。 (注：用户提供的原文文本在此处存在重复和混乱，翻译已根据逻辑进行了对齐)


