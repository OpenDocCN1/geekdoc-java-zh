    +   3. If $\Lambda$ plays $SS$, the best response for $G$ is to play $S$, and
    vice versa (this happens since it always holds that $2p \leq 1+p$). Thus, $(SS,S)$
    is a BNE where $\Lambda$ playing a pooling strategy, meaning that $\Lambda$ plays
    the same regardless of his type. This is the only possible BNE where $G$ plays
    $S$, since $SS$ is the only best response. Thus, another BNE can only be when
    $G$ plays $C$. Indeed, if $G$ plays $C$, $\Lambda$''s best response is to play
    $SC$; however, it is not certain that $C$ is also the best response to $SC$ this
    only happens if $p$ is low enough ($G$ plays $C$ in the hope that $\Lambda$ is
    not in love with the girl), whereas if $p$ is very high, the best response for
    $G$ to $SC$ is to play $S$, since it is very likely that $\Lambda$ will play $S$.
    From the matrix, we see that we need $2-2p \geq p$ for this to hold, which translates
    into $p \leq 2/3$, in which case $(SC,C)$ is also a BNE. This strategy is separating,
    what is played by $\Lambda$ depends on his type.'
