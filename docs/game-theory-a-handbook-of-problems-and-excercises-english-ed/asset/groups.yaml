    find it, observe that in round 3 player J will choose F that is the action giving
    him the highest payoff.


    Knowing that, K prefers not to send the game to the third stage and terminates
    it earlier, since she can do satisfactorily by choosing B and ending the game
    earlier. Anticipating that, J can play A instead but he is clearly worse off doing
    so, J plays X in the first round instead.


    An important warning: since the SPE ends the game during her turn and does not
    let J to perform his last move, one might be tempted to answer that the SPE is
    J delays, and K chooses X. However, this answer would be wrong, since it does
    not declare J''s strategy, which must be specify what J does in the last round
    (even though it is not actually played). Indeed, notice that this description
    would also fit (XD, B) which is also an NE of the game, but not an SPE – it limits
    non-credible choice by J (even though it happens off the equilibrium path).


    ## 3. Sequential games


    **Exercise 3.5.** Yvonne (Y) and Zoe (Z) are foreign sisters spending their summer
    holidays in Italy. They need to choose where to spend the famous “Ferragosto”
    night, and they have two options: the beach (B) or the discotheque (D). They decide
    independently and without telling each other, confident they will meet. However,
    Y has a car and drives to her location of choice; also, if Y does not find her
    sister at her chosen location, she (and only she) has one further option: to change
    location (C) to reunite with her sister, or stay (S) where she is. Instead, Z
    takes one-way bus and is forced to remain at her location. The payoffs are evaluated
    as follows. Y prefers B, who brings her utility 4, while D gives her 1. If they
    celebrate Ferragosto together, they both get their utilities increased by 5. Y
    is reversed and D gives her 7, while B gives her 1. Moreover, Y’s final utility
    is decreased by 3 if she does not drive her car twice, i.e., to play C in the
    second round to reach her sister (staying where she is already does not change
    the utility from the first round). For example, if Y plays B and Z plays D, Y
    gets a second move; if this is C, the final respective utilities are $u_Y = 3$
    and $u_Z = 12$. All of the above information is common knowledge among the sisters.


    - 1. Write down the extensive form of the subgame-perfect equilibrium of this
    game.

    - 2. Find the outcome of the subgame-perfect equilibrium of this game.

    - 3. The extensive form includes three points where Y moves, thus her strategy
    must be a triple of binary variables. What is the strategy played by Y in the
    subgame-perfect equilibrium?


    # Solution


    - 1. The extensive form is depicted in Figure 3.5. Y moves first choosing B or
    D, but her choice is actually unknown to Z so the two nodes are joined in the
    same information set.


    ![](img/adcae123bfc4ba205d992d916e340a6b_60_0.png)


    Figure 3.5: Extensive form of the game.


    - 2. The outcome of the subgame-perfect equilibrium of this game can be found
    through backward induction. If Y plays a second round, she will choose $S$ in
    the left-hand node (following $(B, D)$) and $C$ in the right-hand one (following
    $(D, B)$). This result in the following reduced game, in normal form.


    | | B | D |

    |---|---|---|

    | Y | 9, 6 | 4, 7 |

    | D | 6, 6 | 6, 12 |


    Clearly $D$ is a dominant strategy for $Z$ and the resulting NE is $(D, D)$. The
    outcome of the SPE is thus both $Y$ and $Z$ playing $D$ in the first round with
    final payoffs $(6,12)$.


    - 3. The strategy played by $Y$ at the SPE above can be described as “DSC”. The
    first binary value is a choice between $B$ and $D$ and describes what done at
    the top node. The second and third variables are what done at the nodes below
    and can be either $C$ or $S$.


    ## 3. Sequential games


    **Exercise 3.6.** Wife (W) and husband (H) share the chores of house. Due to her
    working from 10:30 am to 18:30, W has two opportunities to do something, at 7:00
    am and 7:00 pm. H instead works two shifts, early morning and afternoon till late
    evening, so he has only one opportunity to contribute, at 2:00 pm. There are two
    chores in family: fix some food (F) or clean the house (C). If either member performs
    a chore, he/she pays an individual cost, both members receive an identical benefit:
    F benefit 30 but costs 10, C benefit 50 but costs 20. Moreover, of these actions
    performed by W in its first opportunity costs 10 but also gives 10 more benefit
    to both. Alternatively, any player at his/her turn can “do nothing” (N) instead
    of choosing either game. This can be done at any round, and gives individual benefit
    0 only to the member (if food is already prepared in a previous round, the current
    actor can only clean the house).


    - 1. Write down the extensive form of the game.

    - 2. How many subgame-perfect equilibria are in this game? Also, name the process
    on you find them.

    - 3. Actually find them.


    # Solution


    - 1. The extensive form is the tree depicted in Figure 3.6.


    ![](img/adcae123bfc4ba205d992d916e340a6b_62_0.png)


    - 2. There is a single subgame-perfect equilibrium of this game, and the way to
    find it is backward induction.


    - 3. On the first round of backward induction, W is to play and all nodes in the
    last level have at least one alternative – among the leaf nodes where the first
    player has a higher payoff. Now, the tree is left without these leaf nodes, and
    therefore consists of subtrees of F, C, and N.


    ![](img/ad123bfc4ba205d992d916e340a6b_63_0.png)


    On the second round, H chooses among the new leaf nodes that give him the highest
    payoff.


    ![](img/adcae123bfc4ba205d992d916e340a6b_63_1.png)


    The last round consists in W choosing among F, C and N. She chooses N, since it
    is the option that maximizes her utility. Therefore, the outcome of subgame-perfect
    equilibrium is W doing nothing (N) in the first round, H fixing food (F) in the
    second round and W cleaning (C) in the third round. This is actually the equilibrium
    path: subgame-perfect equilibrium must specify the strategy of the players in
    all subgames, even in the ones that are never reached. The joint strategy that
    describes the behaviour of the players in various subgames can be written as


    $(s_W, s_H) = (NCFCFC, NNF)$


    where strategy $s_W$ is specified starting from the root and then for all other
    nodes on the last level of the tree, from the left to the right, while $s_H$ is
    specified for all the nodes in the central level, again from the left to right.


    ## 3. Sequential games


    **Exercise 3.7.** Two children named Anita (A) and Ben (B) are siblings. One afternoon,
    they are playing together when they decide they want to get some candies without
    their parents to know. There are two cupboards in house, one in the closet (C),
    with 5 candies, and another in the dining room (D), with 10 candies. They will
    simultaneously choose one room where to rush and grab candies. If they choose
    different rooms, each can get all the candies from the respective cupboards. If
    they go to the same room, they will have bargain on share the candies they find.
    The way they share is that Anita will propose a split (denoted by the number of
    candies she will get; the proposal must include a positive number of candies for
    both siblings), and Ben can agree with the proposal, or cry complain. If Anita''s
    proposal is accepted by Ben, the siblings will split the candies as that. Otherwise,
    Ben''s complaints will cause the parents to notice them, and they will end up
    without any candy. Assume that the payoffs of the two children are equal to the
    number of candies they get, and that all of the aforementioned rules (including:
    the splitting rules, how many candies are in a room, that Anita is allowed to
    propose a split and Ben can only accept or reject) are by known and in advance
    to both of them.


    - 1. Represent this game in extensive form.

    - 2. Apply backward induction to reduce this game to a static game of complete
    information (i.e. single-shot): give its normal-form representation and give all
    its Nash equilibrium.

    - 3. Find the subgame-perfect equilibrium of the original game and (if it exists)
    a Nash equilibrium that is not subgame-perfect.


    # Solution


    - 1. The extensive form is the tree depicted in Figure 3.7. First (root node)
    is Anita''s (A) move between C or D. Then Ben (B) will also choose between closet
    (C) or dining room (D) without knowing what A did. If the choices (C,D) or (D,C)
    have the respective payoffs of (5,10) and (10,5) - A''s payoff written. If both
    choose C, they will play an Ultimatum-game, with A being the proposer and B being
    the responder. Thus, A proposes a split and B can say Yes (Y) or No (N), in the
    former case the split also matches the ultimate payoffs they get, otherwise the
    payoffs are (0,0).


    - 2. By backward induction, it is easy to see that all nodes where the ultimatum
    game is, lead to a minimal offer of 1 candy from A to B, which is accepted (say
    N is a non-credible threat). The normal form of the static game is:


    | | C | D |

    |---|---|---|

    | A | 4, 1 | 5, 10 |

    | D | 10, 5 | 9, 1 |

    '
