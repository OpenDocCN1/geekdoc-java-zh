    - 2. 玩家 B 的类型代理表示将策略决定为动作对：

    ## 贝叶斯游戏

    这两个元素都可以是 $R$ 或 $F$。例如，$RF$ 意味着 B 只有在枪是假的情况下才反应，而在枪是真的情况下他会逃跑。


    | | RR | FR | FF |

    |---|---|---|---|---|

    | C | $P$ | $90p-100, 80-90p$ | $10-20p, -10p$ | $110p-100, 80-80p$ | $10, 0$
    |

    | $S$ | $0, 100$ | $0, 100$ | $0, 100$ |


    - 3. B 对 $P$ 的最佳反应是采取 $FR$，而所有策略都是 $S$ 的最佳反应。


    对于 C 来说，对 $RR$ 和 $FF$ 的最佳反应分别是 $S$ 和 $P$。如果 $10-20p \geq 0$（即 $p \geq 1/2$），则对
    $RF$ 的最佳反应是 $P$。同样，如果 $110p-100 \geq 0$，则 $P$ 是对 $RF$ 的最佳反应，此时 $p \geq 10/11$。


    由于这是一个筛选游戏，子博完美纳什均衡是适当的均衡概念。该游戏最多可能有三个贝叶斯均衡：


    - 第一个是 $(S, RR)$，无论 $p$ 取值如何。这并不是子博完美的，因为包含了不可信的行为——即 B 在枪是假的情况下做出反应——而这种情况从未发生过。

    - 第二个是 $p \geq 1/2$ 的 $(S, RF)$。在这种情况下，B 在枪是假时采取 $R$，因此该均衡不是 SPE（子博完美均衡）。

    - 最后一个是 $p \geq 10/11$ 的 $(P, FR)$，或者 $p \leq 10/11$ 的 $(S, FR)$。这也是一个 SPE，因为玩家在枪是假和真时的行为都是理性的。


    注意，两个非子博完美的 BNE 描述了 B 的一种不可信威胁，即即使在枪是假的情况下也做出反应。这显然是一个 NE，如果这是真的，那么对 C 来说任何情况下留在原地更好。但它不是子博完美均衡，因为
    B 在 C 做出反应的子博游戏中并没有选择 NE。而对于 SPE 来说，这是游戏的逻辑结论，你可以理解为必须需要一个非常高的 $p$ 值 C 才会去当英雄，否则
