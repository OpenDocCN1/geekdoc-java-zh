    Ben 只能接受或拒绝）双方提前已知。


    - 1. 用扩展形式表示此游戏。

    - 2. 应用逆向推理将此游戏还原为完全信息静态游戏（即单次）：给出它的正式形式表示和所有的纳什均衡。

    - 3. 找到原始游戏的子博弈完美均衡和（如果存在）不是子博弈完美的纳什均衡。


    # 解答


    - 1. 扩展形式如图 3.7 所示。第一个（根节点）是 Anita (A) 在 C 或 D 之间的移动。然后 Ben (B) 也会选择衣柜（C）或卧室（D），而不知道
    Anita 做了什么。如果选择 (C,D) 或 (D,C)，对应的收益分别为 (5,10) 和 (10,5) —— 写 A 的收益。如果都选择 C，她们将玩通牒游戏，A
    是提议者，B 是响应者。因此，A 提出一个分配，B 可以说是（Y）或否（N），在前一种情况下分配与她们获得的最终收益一致，否则收益为 (0,0)。


    - 2. 通过逆向推理，很容易看出所有存在通牒游戏的节点都导致了从 A 给 B 1 颗糖的最低报价，该报价是被接受的（说 N 是一个不可信威胁）。静态游戏的正式形式是：


    | | C | D |

    |---|---|---|

    | A | 4, 1 | 5, 10 |

    | D | 10, 5 | 9, 1 |


