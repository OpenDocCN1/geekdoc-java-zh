- md: '

    Exercise 6.10. A bank is robbed by a lone bandit (B) showing the clerk (C) what
    seems to be a fake gun. The clerk is considering to either punch the bandit (P)
    or stay put (S). In the latter case, the game ends with the bandit getting away
    with the money, but nothing happens to the clerk beside the nasty experience.
    Thus, the payoffs are +100 for the bandit and 0 for the clerk. If C decides to
    intervene and punches the bandit, B can either react (R) or flee (F). The outcome
    actually depends on whether the gun is fake or not. If the gun is fake, playing
    R by the bandit just causes a fight, after which the bandit flees; both players
    end with some bruises and a payoff of -10. If the gun is real, and the bandit
    reacts, C gets shot, which is a very negative outcome implying payoff of -100
    for him which is not pleasant. Fleeing causes the bandit to rob the bank, and
    the payoff is +80 because the shooting is not pleasant. Also, the bandit gets
    payoff of 0 for the bandit, while C gets +10 because of the satisfaction having
    averted the robbery. While the bandit obviously knows whether the gun is fake
    or not, the clerk has only an estimate of the payoff $p$ of the gun being fake.


    - 1. Describe this game in extensive form.

    - 2. Considering a type-agent representation of player B, draw the normal form
    of the game.

    - 3. Find the Bayesian Nash equilibria in pure strategies as a function of $p$,
    and discuss them.


    # Solution


    - 1. This is a Bayesian entry game. The extensive form of the game is the one
    depicted in Figure 6.12.


    - 2. Type-agent representation of player B decides a strategy as a pair of actions:

    ## Bayesian games

    Both elements can be either $R$ or $F$. For example, $RF$ means that $B$ reacts
    only if the gun is fake, and while he flees when the gun is real.


    | | RR | FR | FF |

    |---|---|---|---|---|

    | C | $P$ | $90p-100, 80-90p$ | $10-20p, -10p$ | $110p-100, 80-80p$ | $10, 0$
    |

    | $S$ | $0, 100$ | $0, 100$ | $0, 100$ |


    - 3. The best response of $B$ to $P$ is to play $FR$, and all the strategies are
    best response to $S$.


    For $C$, the best response to $RR$ and $FF$ are always $S$ and $P$, respectively.
    The best response to $RF$ is $P$ if $10-20p \geq 0$, that is for $p \geq 1/2$.
    In the same way, $P$ is best response to $RF$ if $110p-100 \geq 0$ so $p \geq
    10/11$.


    Since this is a screening game, subgame-perfect Nash equilibria are the appropriate
    equilibrium concept. The game can have up to three Bayesian equilibria:


    - The first is $(S, RR)$, whatever the value of $p$. This is not subgame-perfect,
    since it contains non-credible behavior – i.e., $B$ reacting when the gun is fake
    – that never comes into play.

    - The second is $(S, RF)$ for $p \geq 1/2$. Also in this case $B$ plays $R$ with
    a fake gun, so the equilibrium is not an SPE.

    - The last one is either $(P, FR)$ for $p \geq 10/11$, or $(S, FR)$ for $p \leq
    10/11$. This is also an SPE, since the behavior of the players is rational when
    the gun is fake and when it is real.


    Note that the two non-subgame-perfect BNEs describe a non-credible threat by $B$,
    which is to react even when the gun is fake. This is clearly an NE, if this was
    true, it would be better for $C$ to stay in any case. But it is not a subgame-perfect
    equilibrium because $B$ does not choose an NE in the subgames in which $C$ reacts.
    As for the SPE, instead, this is the logical conclusion of the game and you can
    understand that a really high value of $p$ must be required for $C$ to play the
    hero, otherwise $C$ will put.


    Exercise 6.11. Emma (E) and Frank (F) are a pair and have been invited to a wedding.
    They decide what to wear independently and unbeknownst to each other. Emma can
    choose either an aquamarine (A) or a beige (B) dress, Frank can choose either
    an azure (A) or brown (B) suit. It would be best to go to the wedding with matching
    colors (either azure and aquamarine; or brown and beige). However, while Emma''s
    dresses are always ready, Frank is a bit clumsy when laundry and washing his suits.
    Upon opening his closet, Frank finds that his suits are not properly clean with
    $p$, and they are okay with probability $1-p$. After this, Emma knows the state
    of the suit. The utility of B is its revenue, while A gets the revenue minus the
    possible cost of the campaign, if they have induced it.


    - 1. Represent this game in extensive form.

    - 2. Represent this game in normal form.

    - 3. Find the Bayesian Nash equilibria.


    # Solution


    - 1. This is a Bayesian game, most specifically a signaling game, where A is a
    Bayesian player, and the effectiveness of the gadget is A''s type. The extensive
    form is the tree depicted in Figure 6.14.


    Exercise 6.12. The Alpha company (A) launches a new gadget in a market dominated
    by Bad Guys Inc. (B). This gadget can be effective or useless: the probability
    of either is 0.5 and this is common knowledge. However, company A is actually
    aware whether the gadget is effective or not; further, they can choose to induce
    a promotional campaign (C) or to keep a low profile (L). Choosing C costs 20 to
    A and has the effect to reveal to everyone (including the competitor B) whether
    the gadget is effective or not, while L keeps this hidden. After this it is now
    B''s turn to decide whether to fight (F) or yield (Y) this game. The payoff is
    computed as follows. If B yields, companies A and B have respective revenues of
    80 and 0 if the gadget is effective; if the gadget is useless, these values are
    swapped. The utility of B is its revenue, while A gets the revenue minus the possible
    cost of the campaign, if they have induced it.


    - 1. Give the extensive form representation of this game.

    - 2. Give the normal form representation of this game. Clearly state what you
