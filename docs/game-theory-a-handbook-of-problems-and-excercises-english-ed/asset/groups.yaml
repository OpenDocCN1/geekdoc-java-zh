    **Exercise 1.9.** Atlas Ltd (A) and Broadcasting Ltd (B) are local channels, competing
    for the most audience. They have three slots: morning (M), daytime (D), and evening
    (V). They must decide what slot to invest in telling each other. If they invest
    the same slot, the payoff is 0 for both. If they choose different ones, there
    is a “winner”, whoever chooses the earlier slot. The winning channel gets +1,
    the losing channel always gets -1.


    - 1. Write down this game in normal form.

    - 2. Find the Nash equilibria in pure strategies.

    - 3. Find a Nash Equilibrium in mixed strategies.


    # Solution


    - 1. The set of players is {A, B}, the strategy sets are $S_A=S_B=\{M, D, E\}$.
    The payoffs are represented in the bi-matrix below.


    | | M | D | E |

    |---|---|---|---|

    | A | 0, 0 | 1, -1 | -1, 2 |

    | D | -1, 1 | 0, 0 | 4, -1 |

    | E | 2, -1 | -1, 4 | 0, 0 |


    - 2. As rock-paper-scissors, there is no Nash equilibrium in pure strategies (there
    will be at least one player regretting their choice).


    - 3. Because of Nash theorem, a Nash equilibrium must exist. It can be found by
    setting probabilities of playing M, D, E as $m, d, 1-m-d$, respectively. Because
    of symmetry, these must be the same probabilities for both players. Applying the
    independence principle, we can write the equations


    ```

    $$\begin{cases} d-1+m+d=-m+4-4m-4d \\ d-1+m+d=2m-d \end{cases} \quad (1.1)$$

    ```


    with solutions $\mu = 9/24$ and $\delta = 11/24$.

