    ## 6. 贝叶斯游戏


    自然选择对玩家 2 是未知的这一初步设定使得该玩家的信息集跨越了整个树结构。因此，所有的纳什均衡（NE）都是子博弈完美的，使得子博弈完美均衡（SPE）失去了吸引力。解决方案通常是求助于下一节讨论的完美贝叶斯均衡（PBE）。


    发生这种情况的一种情况是信号游戏，信号游戏在通信背景下特别有趣，因为它们与信息交换、信道上的互信息以及信息论的其他方面有着密切联系。信号游戏的核心思想是，贝叶斯玩家
    1 选择一个动作，或者可能不向另一个玩家通信自己的类型。相反，玩家 2 用于做出反应的可用信息可能会通过观察玩家 1 对类型的信念而改进，也可能不会，这也应该在找到的
    PBE 中被定义。特别是，通过分离（separating）或聚类（pooling）来分类 PBE 将很有意义，对于信号游戏，这可以被解释为通信信道的表征，其中源发送一个变量（1
    的贝叶斯类型），目标树根据接收到的信号进行推断。因此，分离 PBE 对应于完美信息信道，其中后验披露完全揭示了源发送的原始值，而聚类 PBE 已知在这样的信道中是无用的，必须使用先验概率。


    关于信号游戏的一个技术说明。通常，相关文献对此类游戏的略有不同的版本使用相同的名称，为了简单起见，我们将展示一个类型和动作的多重选择均为二元选择的情况。在这两种情况下，扩展形式通常以蝴蝶形状显示以提高可读性。树的根在中间，意味着自然对
    1 的类型进行选择，类型可以是信号 $j$ 或 $k$，概率分别为 $p$ 和 $1-p$。之后，1 的类型被告知玩家，该玩家转而选择一个 $A$ 或 $B$
    动作。2 观察到这一动作并执行 $C$ 或 $D$。收益最终被确定（有 8 个可能的节点）。


    在图 6.1 所示的最一般版本中，所有动作都是通用的，由于不同的原因，两者都具有 4 种策略。玩家 1 对每种类型都有二元选择，有 2 种选择，但必须对可能的移动做出二元选择。换句话说，玩家
    2 的策略形式为 $XY$，这是“在玩家 1 执行 $A$ 时执行 $X$，而 1 选择 $B$”的简写，其中 $X$ 和 $Y$ 都被选择为 $C$ 或
    $D$。


    图 6.2 报告了一个略有不同的版本，其中动作 A 被认为揭示了玩家 1 的类型。换句话说，1 的选择不是关于特定动作，而是让玩家 2 知道他的类型与否。这种区别是细微的，仅涉及节点之间的虚线。在这种情况下，2
    的顶部两个节点的信息集是单例（singleton），反向归纳立即决定了 2 在此类情况下会做什么。因此，没有必要在策略中考虑它们（尽管为了正确性，应该在侧边报告）。玩家
    2 唯一相关的选择是树的底部（非单例信息集），那里只选择了一个动作。结果是游戏比之前更小，因为 1 有四种可用策略，但 2 只有两种。


    从建模的角度来看，人们必须注意动作是如何定义的。如果类型类型与玩家 1 可以发送的信号匹配，则允许玩家 1 撒谎，我们实际上处于第一类信号游戏中。相反，如果玩家
    2 在揭示动作后无法误判玩家 1 的类型（但为了保持趣味，在其他动作后仍然不知情），则处于第二类信号游戏。


    为了更好地理解这种区别，想象游戏涉及玩家 1（警方案件中的嫌疑人）和玩家 2（负责该案件的侦探）。玩家 1 的类型与是否有犯罪有关。现在，第一类场景会发生在玩家
    1 选择了一个常规动作，从该动作中，玩家 2 试图推断 1 是否是他们寻找的罪犯。侦探希望达到一个分离均衡，这意味着 1 最终被推断出来并可以被逮捕或释放。相反，在第二类信号游戏中，玩家选择的动作是接受某种程序（例如测谎仪或
    DNA 擦拭——尽管它们不是 100% 可靠的，但在故事中我们可以假设它们是可靠的），这最终揭示其状态，或者拒绝接受。在这种情况下，揭示动作 A 对玩家 1
    的类型留下了疑问，而 B 则留下了不确定性。如果玩家 1 在 A 上采取聚类策略，类型会立即揭露，案件得到解决。


