    ## 30 Game Theory – A handbook of problems and exercises


    Zero-sum games are actually a special case of a more general class that shares
    the descriptive principles of the players in competition against each other, but
    whose payoff is not actually 0. These are sometimes called competitive or conflict
    games. Proper utility transformations can leave the unaltered but change setups
    into zero-sum games.


    For example, consider a game where two players compete over a resource $R$ to
    be shared among them, like a delicious pie. Whatever $x$ is obtained by player
    1, player 2 will get $R-x$. So technically speaking the game is $R$-sum rather
    than zero sum, but the utility can be rescaled (e.g., considering the difference
    from the value $R/2$) to achieve a zero sum game.


    Or, one can consider the old rules for assigning points in football after matches.
    Until the 80s, two points usually assigned per match, such that a winner got 2
    points, a loser gets nothing, and in case of a tie, the two players “split the
    pot”. Hence, this is the situation with $R = 2$. In competition, this rule was
    changed to assigning 3 points for a victory, and the game can no longer be translated
    into a proper zero-sum setup, even though its competitive character is clear.
    In practice, competitive games are situations where all outcomes are Pareto efficient,
    since a player cannot improve the payoff without making the other player move.


    ## 2.2 Maxim and minimax


    If $i$ faces other players generically described as $-i$ (as typical of game theory),
    and the strategies of these players are described by $s_i$ and $s_{-i}$, respectively,
    and finally $u_i(s_i, s_{-i})$ is the utility of $i$, the maximin and the minimax
    for $i$ are computed


    $$\maximin_{s_i} = \max_{s_i} u_i(s_i, s_{-i}), \quad \minimax_{s_i} = \min_{s_i}
    u_i(s_i, s_{-i}) \quad (2.1)$$


    the reason for their names is clear from definition.


    The maximin (also called the security payoff) represents the maximum payoff that
    $i$ can achieve even under conservative (i.e., worst-case) assumptions, without
    knowing the strategies chosen by the other players. The minimax instead is the
    guaranteed payoff $i$ can get knowing the strategies of $-i$, since $i$ is a rational
    player that will choose the best response, and the minimax is therefore the lowest
    of the payoff obtained by $i$ when playing the best response.


    These concepts are relevant in the context of the minimax theorem, which combines
    two properties. The first is that, whenever the minimax and the maximin coincide
    for a zero-sum game, their value also corresponds to the NE payoff (the NE is
    not necessarily unique, but all NE get the same payoff). Note that this result
    is in general not true for games that are not zero-sum. Moreover, if the strategies
    $s_i$ and $s_{-i}$ are chosen as mixed strategies, and thus $u_i$ is computed
    as an expected utility, the utility of the linear combination within the expected
    value necessarily makes the maximin and the minimax


    ## 2. Zero-sum games and minimax


    coincide when computed over mixed strategies, which is an alternative way to see
    the Nash theorem for the existence of an NE, however, with the additional property
    that all the NEs share the same payoff value, which is a consequence of the game
    being zero-sum.


    Moreover, a linear programming approach exploiting this theorem leads to a computationally
    efficient derivation of the NE for zero-sum games. This corresponds to considering
    a linear combination of the utilities at the pure strategies of the two players.
    If the maximizing and the minimizing players have $L$ and $M$ available pure strategies,
    respectively, the optimization variables are the weights of the $L$ pure strategies
    of the maximizer, and $M$ constraints can be considered for each of them, where
    the linear combination is greater than or equal to a slack variable $w$. In turn,
    the slack variable $w$ is the maximization goal. Note that this approach obtains
    at the same time the value of the payoff at the NE in mixed strategies and the
    support of the mixed strategy NE itself, which is identified by the constraints—


    Finally, a dual approach is also possible, where the roles of the maximizer and
    the minimizer are reversed (and so the objective of the optimization is to minimize
    rather than to maximize), which, differently from before, achieves instead a problem
    with $M$ variables and $L$ constraints. The ultimate choice of what approach is
    more convenient depends on the numerical values of $L$ and $M$.


    ## Game Theory – A handbook of problems and exercises


