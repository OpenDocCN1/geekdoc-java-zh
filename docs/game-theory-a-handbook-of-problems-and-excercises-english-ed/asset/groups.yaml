    ## 18 Game Theory – A handbook of problems and exercises


    **Exercise 1.6.** Two teams (T1 and T2) play against each other in an exhibition
    match. Each team can choose a style of playing: aggressive (A); spectacular (S);
    or relaxed (R). Important: regardless of the actual number of components in a
    team, both teams are considered as single players in the analysis, since they
    decide a style for the match (and this decision applies to the whole team), and
    they are so independent and unbeknown to each other. At the end of the match,
    each team gets a payoff based on styles chosen. Also note that this payoff not
    necessarily represent the score in the match (which is just an exhibition) but
    rather whether they enjoyed the match, a good time, and so on. A team playing
    aggressively always gets a basic payoff equal to 1. A team playing in a spectacular
    way always gets payoff equal to 3 and in addition increases the payoff of the
    other team by 1. A team playing in a relaxed way gets payoff 0, unless both play
    relaxed, in which case they both get payoff 5.


    - 1. Draw the normal form of the game.

    - 2. Find all pure strategy Nash equilibrium of the game.

    - 3. Does the game have a mixed strategy Nash equilibrium? If yes, find it. If
    not, prove why.


    # **Solution**


    - 1. The set of players is {T1, T2} with common set of strategies {A, S, R}. The
    normal form is fully characterized by a bi-matrix as follows.


    | | A | S | R |

    |---|---|---|---|

    | T1 | 1, 1 | 2, 3 | 1, 0 |

    | S | 3, 2 | 4, 4 | 3, 1 |

    | R | 0, 1 | 1, 3 | 5, 5 |


    - 2. Pure strategy *A* is strictly dominated by *S*, so we can safely remove it.


    | | S | R |

    |---|---|---|

    | T1 | 4, 4 | 3, 1 |

    | R | 1, 3 | 5, 5 |


    The game is left with two pure strategy Nash Nash equilibria: (S,S) and (R,R).


    - 3. There is a mixed strategy Nash equilibrium. It can be found by setting *p*
    as the probability that team T1 plays *S*. Then, for team T2, playing *S* gives
    utility $4p+3(1-p) = p+3$ and playing *R* gives $p+5(1-p) = 5-4p$. *S* is preferable
    if $p+3 > 5-4p$, which means $p > \frac{2}{5}$. The reasoning can be repeated
    for reversed roles of teams T1 and T2. The mixed strategy Nash equilibrium is
    therefore that each team plays S with probability 2/5 (and R with probability
    3/5).


