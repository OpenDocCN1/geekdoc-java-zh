    # #6 Bayesian games


    Bayesian games model strategic interactions where the involved players have some
    degree of uncertainty that goes beyond knowing the choice of the others; that
    is, they explore incomplete information.


    # ##6.1 Characteristics


    In this class of games, some or all players are associated with a set of *types*.
    The concept of type is used to represent the incompleteness of the information
    that one player may have about the others. The general assumption is that players
    know their own types but may only estimate the types of other players. Actually,
    this uncertainty may only involve some players; players that can have different
    types unknown to the others are called “Bayesian” like the games themselves. While
    types can be used to differentiate any aspect of the gameplay (including the way
    by which a dynamic game unfolds), they are most commonly employed to describe
    possible payoff functions for a player. One such player P can use different payoff
    functions $u_P(t_1), u_P(\dots)$ representing different preference puts on the
    possible outcomes, which is represented by its type being A, B, C, and so on.
    In turn, actually means that the other players are uncertain about what alternatives
    are preferred by player P, if the exact type of P is known to P only.


    Generally, the assignment of types to players is represented as a decision blindly
    by the non-rational player Nature that chooses them as random variables following
    a probability distribution. In principle, we consider the joint distribution of
    all types, denoted as $p(t_1, t_2, \dots, t_n)$ for all players 1, 2, $\dots,
    N$, where $t_j$ is the type of player j. It is very frequent to assume that types
    are drawn independently for each player with a type, so that we can use marginal
    distributions $p_1(t_1), \dots, p_N(t_N)$ for players 1, 2, $\dots, N$, respectively


    ```

    $p(t_1, t_2, \dots, t_n) = p_1(t_1) \cdot p_2(t_2) \dots p_n(t_n)$

    ```


    While from general perspective, in special cases it may make sense to assume some
    correlation among the types, and therefore negate the independence of types, in
    reality independence is often assumed for tractability reasons, and also for the
    sake of realism, since the entire game comprises two players (and possibly only
    one with a type). Thus, after drawing the types, Nature also reveals the type
    $t_j$ to player only.'
