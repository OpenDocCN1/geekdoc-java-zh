    - 2. 以 M 为领导者的斯塔克尔格博弈版本实际上是一个动态博弈。可以通过逆向归纳法求解，且不需要画出扩展形式就能很容易找到解（有时称为斯塔克尔格均衡）。事实上，参与者的理性意味着
    M 会对其做出最佳反应。但 M 可以利用其先发优势，并预判 N 也会这样做。本质上，M 正在比较上一个表中三个带有下划线的单元格，并考虑带给他最好结果的一个，结果是
    $(C,Y)$。


    我们注意到两个额外属性。首先，M 保证收益不会低于静态版本中纳什均衡 $(A,X)$ 的收益。这是因为 $(A,X)$ 是比较的单元格之一，所以 M 可以在斯塔克尔格版本中强制实现这一结果。但在这种情况下他改进了结果，因为他有更好的替代方案
    $(C,Y)$。此外，N 保证至少获得他的极大收益，因为根据定义，极大收益是参与者在已知另一方选择的情况下移动时获得的最小收益。这正是 N 身上发生的情况，因为他是跟随者。实际上，N
    的收益超过了极大收益，因为他在斯塔克尔格均衡下获得了 3，而他的极大收益是 2。


    （M 对静态纳什均衡的改进以及 N 对极大收益的改进）并不意外，因为这个博弈不是竞争性的。因此，将同步移动转换为斯塔克尔格博弈实际上改善了参与者的协调。领导者
    M 保证获得改进，因为他有先发优势，但这并不意味着 N 没有变得更好，实际上由于帕累托意义上存在更好的结果，他也正在提高自己的收益。


    ## 4. 彩票与其他变体


    在实践中，甚至可以将其应用于实际背景中。标准静态博弈与斯塔克尔格版本之间的差异决定了一个参与者是否应该作为领导者向另一方做出决策。在现实情况下，这通常会有通信成本，而且，只有在当跟随者是有利时，另一方才会乐于倾听这些，而这并非总是如此，如果博弈具有竞争性则尤为如此。


    ## 3. N 为领导者的博弈遵循与上述情况相同的推理逻辑，但有一个额外的问题。解决斯塔克尔格博弈本质上归结为应用逆向归纳，我们注意到在这个博弈中某些收益的值相同，这可能会给从逆向归纳获得清晰解带来问题。我们实际上需要一些打破平局的规则，文本规定领导者跟随者都是慷慨的。这意味着什么？为什么这在这里导致了打破平局的规则？


    观察到，N 现在必须比较带有上划线的单元格，即 M 选择的最佳反应。实际上，M 对 Z 有两种反应（均为 B 和 C），所以不清楚应该选哪一个。“慷慨跟随者”的原则意味着
    M 将选择对领导者更好的那个，在这种情况下是 (B, Z)。


    现在我们面临另一个平局，因为 N 现在必须在 (A, X) 和 (B, Z) 之间选择最好的结果。(B, Y) 和 (B, Z) 都比静态博弈之前的纳什均衡
    (A, X) 好，但它们对 N 来说是完全等等的。为了解决这种不确定性，我们应用“慷慨领导者”原则，假设 N 回报并选择对 M 更好的结果。


    顺带一提，这些慷慨的假设之所以有意义，是因为正如之前提到的，这个博弈是非竞争性的。在零和博弈中，它们将没有意义也没有用处，因为领导者的平局意味着跟随者也获得相同的收益，反之亦然，因为两个参与者的收益总是相互相反的。


    ## 5. 多阶段博弈


    多阶段博弈是一类动态博弈，其中较小的博弈在多个后续阶段进行并组合成一个更大的全局博弈。特别是，多阶段博弈的通用理论特别适用于重复博弈，在重复博弈中，所有阶段都是相同的，这使得无限期限产生了有趣的结论。


