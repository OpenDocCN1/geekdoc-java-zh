    - 1. 写出该游戏子博弈完美均衡的扩展形式。

    - 2. 找到该游戏子博弈完美均衡的结果。

    - 3. 扩展形式包含 Y 移动的三个点，因此她的策略必须是二值变量的三组。Y 在子博弈完美均衡中执行的策略是什么？


    # 解答


    - 1. 扩展形式如图 3.5 所示。Y 先动选择 B 或 D，但她的选择对 Z 来说是未，因此这两个节点连接在同一个信息集中。


    ![](img/adcae123bfc4ba205d992d916e340a6b_60_0.png)


    图 3.5：游戏的扩展形式。


    - 2. 该游戏子博弈完美均衡的结果可以通过逆向推理找到。如果 Y 玩第二轮，她将在左侧节点选择 $S$（跟随 $(B, D)$），在右侧节点选择 $C$（跟随
    $(D, B)$）。这导致了以下正式形式的简化博弈。


