    | W | 40, 21 | 44, 23 | 52, 25 | 56, 27 |


    This Bayesian game has three Nash equilibria in pure strategies: $(I, KK), (I,
    KL), (W, LK)$. Since this is a screening game, subgame-perfect equilibria is the
    appropriate concept. The third BNE is also an SPE, as the non-credible move by
    Nadia (playing $K$ when the price is €20) has no effect on the Nash equilibrium,
    but there are subgames off-equilibrium in which a Nash equilibrium is not obtained.


