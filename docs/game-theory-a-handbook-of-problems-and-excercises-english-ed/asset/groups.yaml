    for monsters. In the first stage, their exploration is framed as a two-stage game.
    In the first stage, they prepare to fight a monster in the next room, and both
    of them can either do one of actions: cast a spell ($C$) or draw the sword ($D$);
    actually, strong $W$ does not like $C$ and lazy $M$ prefers to choose $D$. Still,
    they choose their actions simultaneously without talking or communicating to each
    other in advance. Both players are fully aware of each other''s potential payoffs
    for this stage, while their are defined as follows: they utility 2 if they choose
    different actions, while their utility is 0 if the actions are the same because
    this might make them less prepared against certain enemies. Moreover, 1 must be
    subtracted from the utility of a player who chooses the less-favored action.


    After that stage, a second stage is played where the two adventurers, grabbing
    their loot, are surprised by a troll. Now, they can either run cowardly ($R$)
    or attack the troll ($A$). Also this action is decided independently of each other
    and at the same time. If they both attack, they successfully slay the troll (payoff
    5 for both). A player attacking alone gets killed by the troll (payoff -10) while
    the other is unharmed. If they both run, they manage to escape but they must leave
    the treasure behind (payoff 0).


    1. Draw the extensive form of this game.

    2. Find all the Nash equilibria of the two-stage game.

    3. Find all the subgame-perfect equilibria of the two-stage game and explain why
    they are subgame-perfect.


    # Solution


    1. Before drawing the extensive form, it is convenient to put both stages in normal
    form. For the first stage, this is


    | | C | D |

    |---|---|---|

    | W | -1, 0 | 1, 1 |

    | D | 2, 2 | 0, -1 |


    while the normal form of the second stage is


    | | A | R |

    |---|---|---|

    | A | 5, 5 | -10, 10 |

    | R | 10, -100 | 0, 0 |


    The extensive form of the game is the tree depicted in Figure 5.1.


    # 5. Multistage Games


    ![](img/adcae123bfc4ba205d992d916e340a6b_106_0.png)


    Figure 5.1: Extensive form of the game.


    2. The second stage is a prisoner''s dilemma and has only one Nash equilibrium
    (both players choose R). This is what will be played in any event by rational
    players in the second stage. Thus, we can remove the second stage from the computation
    and only focus on the first stage.


    The Nash equilibria in the first stage are to play either $(C,D)$ or $(D,C)$,
    if we consider pure strategies only. In mixed strategies, there is also another
    Nash equilibrium. To find it, assume $C$ is played by the warrior with probability
    $p$ and by the mage with probability $q$ (thus, $D$ is played with probabilities
    $1-p$ and $1-q$, respectively. Thus $2(1-p) = p-(1-p)$, so $p=3/4$. And $-q+2(1-q)
    = q$, meaning that $q=1/2$.


    3. The subgame-perfect equilibrium are those of three Nash equilibria is played
    in the first stage, and then $(R,R)$ in the second stage. These are subgame-perfect
    because Nash equilibrium is played in every subgame, the only subgame other than
    the whole game being the second stage, where the only Nash equilibrium is $(R,R)$.


