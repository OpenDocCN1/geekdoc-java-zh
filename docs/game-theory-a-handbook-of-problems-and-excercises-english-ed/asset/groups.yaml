    当贝叶斯玩家类型为 $j$ 时，到达信息集的边际概率，以及到达该信息集的总体无条件概率。后者通常通过全概率公式计算，即为所有可能情况之和。换句话之：


    ```

    \mu_j = \frac{Pr[h \text{ is reached & the Bayesian type is } j]}{Pr[h \text{
    is reached}]} \= \frac{Pr[h \text{ is reached & the Bayesian type is } j]}{\sum_{k=1}^n
    Pr[h \text{ is reached & the Bayesian type is } k]} \quad (6.1)

    ```


    然而，贝叶斯法则的表达前提是 $Pr[h \text{ is reached}] > 0$，否则将除以 0。当 $Pr[h \text{ is reached}]
    = 0$ 时，我们认为偏离了均衡路径，这导致了文献中关于此类情况处理的讨论。通常的方法是*弱*贝叶斯完美均衡（PBE），这意味着情况下 $\mu_j$ 的值是任意的。某些作者施加了更严格的条件以获得更具选择性的
    PBE 定义，但在许多实际应用中，这通常被视为钻牛角尖。无论如何，考虑到 $\mu_j$ 的值是任意并不意味着它们可以是任何数字，事实上它们仍然必须代表概率，因此不能为负或大于
    1，且之和必须为 1，这意味着它们不能全为 0。


