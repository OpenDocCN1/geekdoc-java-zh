    # Solution


    1. The set of players is $\{J, K\}$. Their strategy sets are $S_J = S_K = \{R,
    S\}$. When $J$ and $K$ choose the same strategy, their payoffs can be computed
    as expected utilities. In words, assume two situations where customer (i) get
