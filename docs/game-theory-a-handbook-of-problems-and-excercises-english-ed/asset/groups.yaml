    # 1.3 Nash equilibria in pure strategies


    The Nash equilibrium is the key concept of game theory. A Nash equilibrium is
    a joint strategy (i.e., a tuple of each player) where all players choose a best
    response to the others'' move. Intuitively, this means that each player will not
    regret the choice made, given the outcome of the game. Since Nash equilibria imply
    that everyone is playing a best response, those in strategies are found in a bi-matrix
    simply by inspecting which cells are both overlined and underlined. Nash equilibria
    in mixed strategies are explained in the next section.


    *Example:* In the Prisoner''s dilemma, $(C, C)$ is the only pure strategy where
    both players play a best response, which makes it the only Nash equilibrium of
    the game. For instance, $(M, M)$ is irrational because both players get in jail
    for 1. Both regret this choice, since by playing $C$ they could have been free
    immediately.


    There can be games with multiple Nash equilibria in pure strategies, and games
    with none. Another classic problem, containing two Nash equilibria in pure strategies,
    is known as the Battle of Sexes. The colorful and originally very politically
    correct explanation relates to two individuals independently decide a spectacle
    to watch between options $A$ and $B$. They have different valuations on what show
    is better, but their first and foremost goal is to watch it together, so the resulting
    payoff bi-matrix is written as


    | | P2 |

    |---|---|

    | P1 | A | B |

    | | 2,1 | 0,0 |

    | | 0,0 | 1,2 | |'
