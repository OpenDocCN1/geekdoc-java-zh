    ## 62 博弈论——问题与练习手册


    **练习 3.9。** 一个大学学生协会由一个女生会（S）部门和一个兄弟会（F）部门组成；女性成员属于女生会，男性成员属于兄弟会。学期假期临近：这是一个为期
    6 周的时期（第 0 到 5 周），协会可以举办派对，他们按照以下规则进行：每周，两个部门轮流决定是否组织派对 P 或 N。当一个部门选择 $P$ 时，他们会为两个部门的所有成员举办派对，且该周是在另一个部门决定轮次之后。如果一个部门选择
    $N$，两个部门都同意该学期的派对结束。首个决定权分配给第 0 周的 S。举办派对意味着组织部门需要 10 的成本，但这对两个部门来说都是快乐的，所以他们会获得正的*乐趣*值。部门的最终效用是他们的收益（最小成本）。第
    0 周派对的收益为 25。接下来，举办更多派对显然会带来递减的乐趣；因此，对第 $j$ 周组织的派对应用 $\delta = 0.6$ 的折扣因子。此外，项目的截止日期是第
    6 周，之后 S 被强制玩 N。


    - 1. 用扩展形式写出这个博弈。

    - 2. 找到该博弈的逆向推纳结果。

    - 3. 如果对学期长度没有限制（即博弈长度），会发生什么？能找到子博弈完美均衡吗？


    ## 答案


    - 1. 博弈类似于蜈虫博弈，其扩展形式如图 3.9 所示。F 的收益在上方，S 的收益在下方。


    | 第 0 周 | 第 1 周 | 第 2 周 | 第 3 周 | 第 4 周 | 第 5 周 |

    |---|---|---|---|---|---|

    | S (P) | F (P) | S (P) | F (P) | 29.584 | |

    | N | N | N | N | | |

    | 0 | 16 | 30 | 34.4 | 27.6 | |

    | 0 | 26 | 30 | 34.4 | 37.6 |


    图 3.9：游戏的扩展形式。


    - 2. 应用逆向推纳，注意最后的水平实际上是第 5 周，因为 F 的选择直接指向叶子节点。由于 $37.64 > 29.584$，F 偏好 N。这实际上意味着在第
    4 周，S 必须在收益为 27.6 的叶子节点和收益为 34.4 的叶子节点之间选择；因此 S 选择 N。预判这一点，逆向推纳意味着双方选择 (P, P,
    N) 作为他们的策略。均衡路径与 SPE 存在微妙差异：第 0 周 S 开始，第 1 周 F，直到第 4 周 S 玩 N 结束博弈。然而，SPE 的规定还必须包含，如果
    F 在第 5 周玩 N——这种情况不会发生，因为博弈提前结束了。或者只有当 F 在第 5 周选择 N 时，他们在每个可能的子博弈中理性选择。最后注意，由于终端收益是不同的，保证了
    SPE 是唯一的。


    - 3. 如果周没有限制（即 P 的分支），逆向推纳无法应用，因为没有结束节点。尽管如此，我们根据之前的结果应用序贯理性。具体而言，该博弈具有子博弈完美均衡，因为理性玩家立即意识到博弈不能超过第
    4 周。事实上，第一个玩家 S 在偶数周行动，对于我们（也对理性玩家 S 来说），在第 4 周玩 N 的收益总是低于在第 5 周玩 N 的收益。同样，第二个玩家
    F 在奇数周行动，他们的收益不能超过。因此，没有学期终止规则，博弈也规定在第 6 周之前结束。


    **练习 3.10。** (A) 和 Bernard (B) 正在进行一项合作项目。他们都是理性玩家且已知。第 1 天，项目的初始值为 $v1$。从第 1
    天开始，他们可以单方面结束项目（C）或继续工作（K）。但只有一个玩家可以做这种决定。Amelie 在奇数天有选择权，而 Bernard 在偶数天；这意味着
    Amelie 在第 1 天决定，Bernard 在第 2 天，以此此类推。如果第 $j$ 天的决定推迟到第二天，由另一个玩家决定；与此同时，项目的价值被因子
    $\delta \in [0, 1]$ 折扣，因此在第 $j+1$ 天，价值为 $v_{j+1} = \delta \cdot v_j$。只要他们保持决定，博弈就会持续下去。项目结束时，他们都收集收益。在第
    $j$ 天结束游戏的人获得 $0.4v_j$，另一个玩家获得 $0.6v_j$。


    - 1. 画出这个博弈的扩展形式（写 4 天，然后加点）。

    - 2. 证明存在唯一的 SPE，项目最晚在第 2 天结束。

