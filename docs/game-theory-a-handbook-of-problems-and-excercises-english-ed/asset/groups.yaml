    - 1. The extensive form is the tree depicted in Figure 6.10.


    Figure 6.10: Extensive form of the Bayesian game.


    The root of the tree is Nature, deciding whether R is infected (probability $p=0.2$)
    or not (probability $1-p=0.8$). After this, R moves to nodes where it is B''s
    turn, if R chooses S, the resulting nodes belong to separate information nodes,
    whereas if R chooses to play T, they belong to the same information set.


    Since S is a revealing action, the upper part can be simplified thanks to sequential
    rationality, since B will always play D and A, respectively, in his upper nodes.
    The resulting tree is shown in Figure 6.11.


    Figure 6.11: Simplified extensive form of the game after applying sequential rationality
    to the upper nodes.


    - 2. The normal form must consider four possible strategies of R, being pairs
    of binary S/T values, representing “what to do if infected/what to do if not infected”.
    For example, ST means that R takes the swab if infected and does not take if infected.
    For player B, there is only one action to consider, i.e., the one taken in the
    information set after R plays T. This can be either A or D. The result is the
    following bi-matrix.


    | | SS | ST | TS | TT |

    |---|---|---|---|---|

    | A | 4, 6 | 14 | -6, 12 | -6, 20 |

    | D | 4, 6 | 0, -2 | 8, 0 |


    - 3. The only Nash equilibrium of the game is (S, D). To check if this is PBE
    (which is a separating PBE when the Bayesian player reveals his type implies that
    he is infected) we must also set: (i) the belief of B when seeing T, which is
    that R is infected with probability $\mu = 100\%$ and (ii) the action chosen when
    the infected type chooses to reveal. The latter happens off the equilibrium path,
    since the infected type never reveals and strategies SS and ST are strictly dominated.
    Still, if the infected type chooses S, then B clearly plays D.


    Exercise 6.9. John (J) and Mary (M) just got engaged and they are considering
    to buy each other gifts for Christmas and Valentine''s Day. Choosing to buy a
    gift (G) costs 5 in terms of money and effort, but gives a pleasant benefit of
    12 to the other. Of course, if one does not buy a gift (N), this leaves the payoffs
    of both players changed. This “Christmas” – “Valentine” situation is modeled as
    a repeated game of two interactions without discount ($\delta=1$). In each of
    them, J and M choose their (G/N) action simultaneously and unknown to each other,
    but with the memory of the past. M is known for being a strategic player that
    acts selfishly. With probability $p$, J is a “Tit for Tat” player that starts
    with G in the first round but then plays in the second round M in the first round.
    With probability $1-p$, J is also a strategic player. The value of $p$ is common
    knowledge.


    - 1. Compute the total payoffs of both players if $p=0$.

    - 2. What is the probability that J plays $N$ in round 1?

    - 3. What condition on $p$ you can impose for having M $G$ in the first round?


    # Solution


    Preliminary note: despite Bayesian types, this is basically just a prisoner''s
    dilemma repeated twice. The collaborative action is $G$, while $N$ represents
    a defection. As discussed, the role of the Bayesian type is to introduce uncertainty
    of the behavior of the players, so that some degree of collaboration can be established.
    But overall, the SPE is sufficient a concept for this game.


    - 1. If both players were declared strategic, SPE, in the standard repeated prisoner''s
    dilemma, we know that collaboration is not possible because this is a finitely
    repeated game. This is exactly the case when $p=0$ and both players defect (i.e.,
    play $N$) both times. Their payoffs are 0. This happens since the stage game has
    only one NE, which is $(N, N)$, game $G(2, \delta=1)$ has only 1 SPE, which is
    the repetition of the stage-game NE.

    To formally represent the SPE, we must remind that each strategic player must
    specify 5 actions (the first action, and the response to each of the four outcomes),
    which gives the convoluted notation of $(NNNNN, NNNNN)$.


    - 2. As discussed, a strategic J plays $N$, while a Tit-for-Tat J plays $G$ in
    the first round. As a consequence, J plays $N$ in the first round if and only
    if he is strategic, i.e., with probability $1-p$.


    - 3. This part is actually the really interesting one of the exercise. As the
    question implies, there is an option that player M plays $G$ (i.e. collaborates)
    in the first round despite being strategic. Note that, in the last round, she
    will surely play $N$. But if she plays $N$ in the first round, the two outcomes
    are (G, N) in round 1.

