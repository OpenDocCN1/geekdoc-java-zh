    Exercise 6.13. Alberto (A) and Gianluca (G) are two friends studying in the same
    program at the university. They have been looking for destinations to apply in
    the Erasmus program, and they identified two ones: Coimbra (C) and Santander (S).
    These destinations do not receive many requests and therefore the two friends
    are sure that their application is surely accepted in either of them. However,
    they have to apply for Erasmus independently and separately, choosing one destination
    (actually, they choose both, but assigning a priority, only the first choice matters,
    as application is accepted). During their last chat, G revealed that he prefers
    C, but his highest preference is to share with his friend A. In numerical terms,
    this means that he assigns utility 2 and 1 to go with A to C and S, respectively;
    the utility in going to a different destination than A is 0 The answer of A also
    feels the same, but G is not fully convinced: he knows A met a female exchange
    student from Santander at a party and maybe he wants to go to S to meet her again.
    The probability that A is somewhat still after the girl is p, and this value is
    a common prior. Of C knows whether he is interested in the girl or not. If A wants
    to go after the girl, playing S is a dominant choice always giving him utility
    2, while C gives 0. If A is not really interested in the girl, his utility is
    the same as G''s.


    +   1. Write down the extensive form of this game.

    2. Write down the normal form of a type-agent representation of the Bayesian game
    (where all players have strategies represented as n-tuples of actions, one per
    type).

    3. Discuss the Bayesian nash equilibrium of this game. You should find that there
    is one BNE in pure strategies where A plays a pooling strategy. Find for which
    values of p there is another NE with a fully-separating strategy.


    Solution


    +   1. The extensive form is the tree depicted in Figure 6.16. The first node
    is Nature, whether A is interested or not, with probability p and l-p respectively.
    Below that, A moves and does distinguish between the two nodes below, since he
    knows he is interested in the girl or not. His choice is either C or S, resulting
    in four nodes. Below, G moves without distinguishing any of them, so he has a
    single information set comprising all nodes. His choice is either C or S for any
    of these nodes.

    2. Player A has a type, his type-agent representation has 4 strategies (two types,
    two actions): CC, CS, SC, SS. The normal representation is


    | | CS | SC | SS |

    |---|---|---|---||

    | A | 2, 2-2p | 0, 2p | 2, 2-2p | 2p, 0 |

    | S | 0, 0 | 1-p, 1-p | 2p, p | 1+p, 1 |'
