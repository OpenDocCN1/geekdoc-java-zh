    子博完美均衡（SPE）的概念是纳什均衡（NE）的精炼，意味着所有的 SPE 都是 NE，但反之未必。这是因为子博完美均衡被定义为策略组合，它概述了原始游戏每个子博弈的纳什均衡。由于整个游戏本身就是它的子博弈，因此
