    Exercise 6.13. Alberto (A) and Gianluca (G) are two friends studying in the same
    program at the university. They have been looking for destinations to apply in
    the Erasmus program, and they identified two ones: Coimbra (C) and Santander (S).
    These destinations do not receive many requests and therefore the two friends
    are sure that their application is surely accepted in either of them. However,
    they have to apply for Erasmus independently and separately, choosing one destination
    (actually, they choose both, but assigning a priority, only the first choice matters,
    as application is accepted). During their last chat, G revealed that he prefers
    C, but his highest preference is to share with his friend A. In numerical terms,
    this means that he assigns utility 2 and 1 to go with A to C and S, respectively;
    the utility in going to a different destination than A is 0 The answer of A also
    feels the same, but G is not fully convinced: he knows A met a female exchange
    student from Santander at a party and maybe he wants to go to S to meet her again.
    The probability that A is somewhat still after the girl is p, and this value is
    a common prior. A knows whether he is interested in the girl or not. If A wants
    to go after the girl, playing S is a dominant choice always giving him utility
    2, while C gives 0. If A is not really interested in the girl, his utility is
    the same as G''s.


    - 1. Write down the extensive form of this game.

    - 2. Write down the normal form of a type-agent representation of the Bayesian
    game (where all players have strategies represented as n-tuples of actions, one
    per type).

    - 3. Discuss the Bayesian nash equilibrium of this game. You should find that
    there is one BNE in pure strategies where A plays a pooling strategy. Find for
    which values of p there is another NE with a fully separating strategy.


    ### Solution


    - 1. The extensive form is the tree depicted in Figure 6.16. The first node is
    Nature, whether A is interested or not, with probability p and 1-p respectively.
    Below that, A moves and does distinguish between the two nodes below, since he
    knows he is interested in the girl or not. His choice is either C or S, resulting
    in four nodes. Below, G moves without distinguishing any of them, so he has a
    single information set comprising all nodes. His choice is either C or S for any
    of these nodes.

    - 2. Player A has a type, his type-agent representation has 4 strategies (two
    types, two actions): CC, CS, SC, SS. The normal representation is


    | | CS | SC | SS |

    |---|---|---|---|

    | A | 2, 2-2p | 0, 2p | 2, 2-2p | 2p, 0 |

    | S | 0, 0 | 1-p, 1-p | 2p, p | 1+p, 1 |


    ![](img/adcae123bfc4ba205d992d916e340a6b_150_0.png)


    Figure 6.16: Extensive form of the Bayesian game.


    - 3. If A plays $SS$, the best response for G is to play S, and vice versa (this
    happens since it holds that $2p \leq 1+p$). Thus, $(SS,S)$ is a BNE where A plays
    a pooling strategy, meaning that A plays the same regardless of his type. This
    is the only BNE where G plays S, since SS is the only response. Indeed, if G plays
    C, A''s best response is to play SC; this only happens if p is low, whereas if
    p is very high, the best response for G to SC is to play S. From the matrix, we
    see that we need $2-2p \geq p$ for this to hold, which translates into $p \leq
    2/3$, in which case $(SC,C)$ is also a BNE. This strategy is separating, what
    depends on his type.


    Exercise 6.14. Jane''s bank account contains €10000. Jane (J) can keep (K) the
    whole sum in the account, or buy a car (C) that costs €8000. The bank B is also
    a player, who plays simultaneously with Jane, with options (L) to leave money
    untouched in the account, or (S) to buy some bonds for Jane, investing every euro
    that Jane has left in the account (either K or C). Every year, Jane''s account
    is increased with interest G. If the bank played L, G is equal to 5% of the initial
    amount. In case the bank played S, G depends on whether the bank is a “good” bank
    or a “bad” bank. Jane estimates the probability of “good” as p and this is a common
    prior. However, the bank is also aware of its type. A good bank playing S gives
    Jane money back, plus G=15% interest rate. A bad bank steals every euro that Jane
    put in the bank account ($G$). The final payoff are computed after 1 year:

    - for Jane: the sum of the money in the account (i.e., initial value by G) plus
    the value of the car, if she owns one: one-year car is worth €5000.

    - for the bank: if G is positive, then its payoff is G; otherwise it is -G.


    - 1. Represent this Bayesian game with J and B in extensive form.

    - 2. Represent this Bayesian game in normal form, with type-agent representation
    of player B (i.e., strategies are n-tuples of actions, or one type).

    - 3. Find the Bayesian equilibria of the game if $p = 0.2$ and discuss this.


    ### Solution


    - 1. The extensive form is the tree represented in Figure 6.17.


    ![](img/adcae123bfc4ba205d992d916e340a6b_151_0.png)


    All the values are reported in k€, that is a value of 1 in the tree represents
    €1000. By the way, if a rescaling by a factor 1000 is applied to all utility values,
    it does not affect Nash equilibria which are unchanged.


    The root node is Nature''s move about the bank being good or bad with probabilities
    p and 1-p. Below it, J moves without distinguishing between the two nodes and
    has two alternatives, K and C. This results in 4 nodes where the bank moves, choosing
    L and S, doing so with full awareness about their type but knowing what J chose
    as her move, which is why nodes are grouped like that.


    -2. Type-agent representation of player B decides a strategy as a pair of actions:
    what to do when good, and what to do when bad. Both elements can be either L or
    S. For example, LL means the bank always chooses L. LS means B chooses L if good,
    S if bad. This leads to the bi-matrix:


    | | LL | LS | SL | SS |

    |---|---|---|---|---|

    | J | 10.5, 0.5 | 10.5, 2-1.5p | 10.5+0.5p | 11.5, 2-0.5p |

    | C | 7.1, 0.1 | 5+2.1, 0.4-0.3p | 7.1+0.2p, 0.1+0.2p | 5+2.3, 0.4-p |


    3. If $p=0.2$ the matrix above becomes


    | | LL | LS | SL | SS |

    |---|---|---|---|---|

    | J | 10.5, 0.5 | 2.1, 1.7 | 10.7, 0.7 | 2.3, 1.9 |

    | C | 7.1, 0.1 | 5.42, 0.34 | 7.14, 0.14 | 5.46, 0.38 |


    Since SS is a dominant strategy for B, the only (Bayesian) NE is (C,SS). For this
    simultaneous-move Bayesian game, it is enough to consider the BNE as the equilibrium
    point. Yet, if one wants more advanced definitions, we see that the game only
    has one NE, it must also be subgame-perfect. And, if proper system of beliefs
    is included, it is also a PBE.


    Side note: this length analysis of the PBE confirms that this equilibrium concept
    is redundant when the game is simple that the standard BNE is enough. The PBE
    requires extra effort to effort the beliefs, but in this specific case they do
    not bring any additional value to the description.

