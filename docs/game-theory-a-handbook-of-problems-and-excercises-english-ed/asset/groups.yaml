    to do when the cost is €20, and when the cost is €35. This results in the following
    bimatrix.


    | | KK | KL | LK | LL |

    |---|---|---|---|---|

    | M | 50, 12p | 50, 15p | 50, 12p | 50, 15p |

    | W | 100-80\delta+20 | 100-80\delta+20 | 100-80\delta+20 | 100-80\delta+20 |


    For $p = 0.75$, the payoffs become:


    | | KK | KL | LK | LL |

