    Exercise 4.6. The Count of Carmanova (C) is defied by the Duke of Dondestan (D)
    to a duel. Thus, the Count can choose the weapon, either sword (S) or pistol (P),
    and the Duke can reply with a choice on whether to duel to the first (F) or last
    (L) blood. If $S$ is chosen, the Count wins 40% of the times (and the Duke 60%),
    and 10% of the times they both get fatally. If the duel is to the last blood,
    the loser always dies. Otherwise, the loser survives (unless it is a duel with
    pistols and both assailants get fatally shot), but he is dishonored. For both
    players, dying gets payoff–100. Surviving but being dishonored corresponds to
    a payoff of–20. Winning the duel gives payoff+10.


    1. Represent this game with C and D in extensive form.

    2. Represent this game in normal form by expanding the strategies of $D$, and
    the Nash equilibria.

    3. Discuss which Nash equilibria are subgame perfect.


    # Solution


    1. The extensive form is the tree depicted in Figure 4.5. To get the numbers right,
    one must compute the expected payoffs of any duel.


    ![](img/adcae123bfc4ba205d992d916e340a6b_85_0.png)


    Figure 4.5: Extensive form of the game.


    2. A normal form representation is


    | | FF | FL | LF | LL |

    |---|---|---|---|---|

    | S | -8, -8 | -8, -8 | -56, -40 | -56, -40 |

    | P | -7, -24 | -23, -80 | -7, -24 | -23, -80 |


    There are three Nash equilibria: $(S, FL)$, $(P, FF)$ and $(P, LF)$.


    3. However, when searching for subgame perfect equilibria, we notice that some
    of these Nash equilibria involve non-credible threats. In particular, $(S,FL)$
    basically means that the Duke threatens the Count to fight to the last blood if
    pistol is chosen, and concedes first blood if sword is chosen. This makes sense
    for the Duke, who is better with the sword than with the pistol. Still, it is
    a non-credible threat, since the Duke is afraid to die as much as the Count, so
    $F$ is always preferable to $L$ for him. Instead, $(P,LF)$ is identical to $(P,FF)$
    as the outcome is anyways $PF$, but the former has a non-credible behavior off-equilibrium.
    Thus, the only SPE is $(P,FF)$.


    # 4. Lotteries and Other Variations


    **Exercise 4.7.** David (D) and Emily (E) are baking a cake, according to the
    following plan. David will choose a type of cake; Emily (aware of David''s choice),
    and they will bake the cake together. For the first step, David knows three types
    of cakes: Apple pie (A), Brownie (B), or Cheesecake (C). Denote by his choice
    by $i=\{A, B, C\}$. For the second step, Emily can buy the ingredients at either
    the Farmer''s market (F) or the Grocery store (G). This applies to any cake that
    David chooses in the first step. Denote her choice as $j=\{F, G\}$. The last step
    is actually played with a random intervention by Nature, in that they have a successful
    baking with probability $p_{i,j}$ that is a function of $i$ and $j$ as reported
    in the following table.


    | | F | G |

    |---|---|---|

    | A | 0.5 | 0.2 |

    | B | 0.8 | 0.4 |

    | C | 0.7 | 0.9 |


    All these values are common knowledge to David and Emily. Emily does not have
    any preference between the cakes, her utility $u_E$ is 1 if the cake is successfully
    baked, 0 otherwise, regardless of its type. David instead had a preference for
    some cakes, his utility $u_D$ is equal to: $3u_E$ if the cake is A; $2u_E$ if
    the cake is B; $u_E$ if the cake is C. Note that even David still values the utility
    of an unsuccessful cake to be 0 regardless of the type.


    - Represent this game in extensive form.

    - Represent a "flat" version of this game (as if all moves were simultaneous)
    in normal form.

    - Find the Nash equilibrium of the game and discuss which are the subgame-perfect.


    # Solution


    - The extensive form is the tree depicted in Figure 4.6. D chooses first among
    A, B, and C. Then E chooses either F or G. This results in six possible combinations.


    ![](img/adcae123bfc4ba205d992d916e340a6b_87_0.png)


    Figure 4.6: Extensive form of the game.


    2. A normal form representation of the corresponding “flat” game is as follows.


    | | F | G |

    |---|---|---|

    | A | 1.5, 0.5 | 0.6, 0.2 |

    | B | 1.6, 0.8 | 0.8, 0.4 |

    | C | 0.7, 0.7 | 0.9, 0.9 |


    A is a strictly dominated strategy for D and can safely removed. We can hence
    consider a reduced version of the game in which the available strategies for D
    are $S_D = \{B, C\}$.


    3. Since E moves after D, her strategies must consider both the case in which
    D plays B and that in which she plays C. For example, strategy FG means “play
    $F$ if B is played, $G$ if C is played”.


    | | FF | FG | GG |

    |---|---|---|---|

    | B | 1.6, 0.8 | 1.6, 0.8 | 0.8, 0.4 |

    | C | 0.7, 0.7 | 0.9, 0.9 | 0.9, 0.9 |


    There are three Nash equilibria: $(B, FF)$, $(B, FG)$ and $(C, GG)$. Among those,
    $(B, FG)$ is the only one which is subgame-perfect, as one can verify by backward
    induction.


    Exercise 4.8. A class of 13 students needs to select the next class rep. The three
    candidates are Alicia Allen (A), Bill Baker (B), and Connie Carter (C). The principal
    was clear on allowing one representative per class, which is chosen as the candidate
    with most votes. Using symbol > to denote “preferred to”, the common knowledge
    is students'' preferences as follows:

    - for students 1–5 A>B>C;

    - for students 6–9 B>C>A;

    - for students 10–12 C>B>A;

    - for students 13 C>A>B.


    1. What is the outcome of the election under sincere voting? Who is winner W under
    this assumption?

    2. How can the third group of voters (10–12) tamper with this result by adopting
    strategic voting? Who becomes winner W?

    3. If this group applies strategic voting, do the supporter of W have some countermeasure
    to this? What is the reason for that?


    # Solution


    1. This election is a simple majority voting, where the candidate with most preferences
    wins. Under sincere voting A gets preferences from 1–5 (5 votes), B from 6–9 (4
    votes), and C from 10–12 and 13 (4 votes). Therefore, A wins the election.

    2. For group 10–12, B is a preferable candidate to A. Since the group can foresee
    A’s victory, a strategy that they can adopt is to vote for B. This way, B is the
    new winner.

    3. The only thing that students 1–5 could do to prevent B’s victory is to vote
    for C, which would result in a tie. However, this goes against their own interest,
    as they prefer B to C. Thus, there is no countermeasure that they can adopt. Notice
    that B is the Condorcet winner so it is difficult to tamper against him.


    # 4. Lotteries and Other Variations


    **Exercise 4.9.** The major of a city is to be selected among four candidates:
    Amy Adams (A), Brandon Butler (B), Cornelius Coleman (C), and David Douglas (D).
    Using symbol > to denote “preferred to”, polls indicate that:

    - A has 42% of supporters. Also, for them B>C>D.

    - B has 11% of supporters. Also, for them A>C>D.

    - C has 27% of supporters. Also, for them B>D>A.

    - D has 20% of supporters. Also, for them C>B>A.


    1. The election is being held as a two-round off (i.e., with a ballot). What is
