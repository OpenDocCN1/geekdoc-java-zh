    F 不会改变该玩家 0 的收益，而将第一步从 A 改为 S 则会使该玩家的收益变为 -100。


    结论性备注：这个练习从社会研究的角度来看显然是一个很好的解释。这显然不是指那个极其冷酷的场景，仅仅是为唯一的女性角色分配了“落难的少女”的角色（对此将是极其糟糕的觉醒政治）。人们只能诉诸于角色基于一部经典的科幻电影，在电影中叛逆女儿准备先发制人。此外，结果可以解释为技能多样性和常态如何富化社会——最后，即使是像
    T 这样不高尚的角色也能为团队做出贡献，也因为团队的一部分是理性的，且 T 具有恶作剧。然而，一个拥有两个骑士或两个小偷的团队将无法获得多样化团队那样的成功。


