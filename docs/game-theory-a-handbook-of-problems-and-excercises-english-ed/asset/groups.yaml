    # 完全信息静态游戏


    混合策略中的效用是通过对上述概率取期望来计算的。例如，在囚徒困境中，联合策略 (0.9M + 0.1C, M) 给 P2 带来的效用等于：


    $u_{P2}(0.9M + 0.1C, M) = 0.9u_{P2}(M, M) + 0.1u_{P2}(C, M) = 0.9(-1) + 0.1(-9)
    = -1.8.$


    严格支配策略的概念也适用于混合策略，既体现在混合策略可以被严格支配，也体现在纯策略可以被支配。对于某些练习，后一种情况可能有用，但遗憾的是，要识别出一个纯策略被混合策略严格支配通常是不容易的，因为混合策略没有在矩阵中显式地报告，因此这需要一些精力。


    混合策略中的纳什均衡是通过应用无差异原理（indifference principle）找到的。该原理指出，纳什均衡下的混合策略对于其他玩家的所有移动提供相同的效用。也就是说，如果
    P1 采用 $A + (1-p)B$，而 P2 可以在移动 $\{D, E\}$ 之间选择，则需要满足条件：


    $u_{P2}(p, D) = u_{P2}(p, E),$


    其中 $p$ 是 $A + (1-p)B$ 的简记。


    **示例：** 在“奇偶数游戏”中，双方都选择一个 0 到 5 之间的数字并同时选择（类似于石头剪刀）。数字可以是奇数（O）或偶数（E）。如果数字之和为偶数，玩家
    P1 获胜并获得 +1；如果之和为奇数，则玩家 P2 获胜。失败者的效用为 -1。方便的是，奇偶数之间的和关系满足某些数学属性，允许将选择 $O$ 或 $E$
    表示为纯策略，游戏的标准型通过以下双线性矩阵所示：


    | | O | E |

    |---|---|---|

    | P1 | 1, -1 | -1, 1 |

    | E | -1, 1 | 1, -1 |


    在具有这种结构的游戏中（即一个玩家喜欢选择相同的，而另一个玩家喜欢选择不同的），被称为协调游戏（coordination games）。将其与另一种协调游戏对比，即两个玩家都希望选择相同的。这种协调游戏在纯策略中没有纳什均衡，因为所有联合策略都意味着其中一个玩家会后悔并想要改变结果。然而，通过应用无差异原理可以找到混合策略的均衡。P1
    应该采取混合策略 $pO + (1-p)E$，使得 P2 在选择 $O$ 或 $E$ 时的效用相同。这一概念引出了：


    $u_{P2}(p, O) = u_{P2}(p, E)$


    即


    $$pu_2(O, O) + (1-p)pu_2(E, O) = pu_2(O, E) + (1-p)pu_2(E, E)$


    代入数字，


    $p(-1) + (1-p)(+1) = p(+1) + (1-p)(-1)$


    解得 $p = 1/2$。


    同样，P2 应该采取混合策略 $qO+(1-q)E$，其在选择 $O$ 或 $E$ 时的效用相同。由于对称性原因，$q = p = 1/2$。这意味着玩家能做的最好就是以等概率随机选择偶数或奇数，这解释了为什么“奇偶数游戏”被用作公平硬币投的廉价替代（如果身无分文，那就是非常廉价了）。


    注意，对于所有 $p < 1/2$，对 P2 来说玩 $E$ 更方便；对于所有 $p > 1/2$，$O$ 是 P2 的最佳反应。P2 的最佳反应可以表示为
    $p$ 的阶跃函数。由于 P1 的情况正好相反（对于 $p < 1/2$ 他应该总是选择 $O$，对于 $p > 1/2$ 总是选择 $E$），最佳反应的图如下所示。


    ![](img/adcae123bfc4ba205d992d916e340a6b_11_0.png)


    图 1.1：游戏的混合纳什均衡。


    现在，最著名的博弈论结果——纳什定理指出，对于玩家具有有限可用动作集合的每个完全信息游戏，至少存在一个纳什均衡（NE），可能在混合策略中。遗憾的是，这是一个存在性定理，并没有说明这个均衡均衡是唯一的还是有多个。这意味着在某些情况下，该定理可以迅速证明混合策略纳什均衡的存在，例如在没有纯策略纳什均衡的非协调性游戏中，因此它们在混合策略中必须有一个纳什均衡，但并不限制其数量。


    # 1. 完全信息静态游戏


    此外，对于两个玩家可用动作集合均为二元族的 2 人游戏，可以识别出某些标准结构，例如类似于囚徒困境的游戏，其中一种策略被严格支配，因此只有一个纳什均衡（在纯策略中），即逆向归纳精细化策略演化（IESDS）的结果。或者协调游戏，可以证明除了收益矩阵对角线外，还有混合策略纳什均衡。此外，当仅考虑
    2 种纯策略时（例如 $A$ 和 $B$），无差异定理也很容易应用，因为所有非退化的混合策略的支持集确实必须包含 $A$ 和 $B$。


    当游戏有超过 2 个玩家，或者每个玩家有超过 2 种纯策略时，并不总是容易识别已知结构，相反通常需要对策略空间进行繁琐的探索。这对于应用无差异定理尤为如此，因为它可以考虑考虑额外的要求。首先，存在不同的组合；例如对于三种纯策略
    $A、$B$ 和 $C$，存在支持集仅为两种策略（如 $A$ 和 $B$，或 $A$ 和 $C$）的混合策略，同时也存在策略 $A、B、C$ 都属于支持集的混合。


    还要记住，如果在纳什均衡处，玩家选择了一种仅结合 $A$ 和 $B$ 的混合策略，不仅要求玩家在 $A$ 和 $B$ 之间无差异，而且结果产生的收益也不能低于玩
    $C$ 时获得的收益，否则我们将向另一个更好的策略（即 $C$）发生偏差，这否定了这是一个纳什均衡。


    # 练习


    练习 1.1. 卓拉（J）和坦凯席莉（K）正在征服厄提斯大陆的城市。他们正率领军队向海岸进发，他们可以在米美林（M）或坤泰（Y）这两个敌人城市之间选择；他们每个人都有机会攻击一个城市。这两个城市的内在价值分别为
    $v_M = 5$ 和 $v_Y = 3$。如果一个城市只被一支军队攻击，胜利是肯定的，城市将被征服。他们分别决定攻击哪个城市，且他们无法就决定进行交流。此外，虽然他们都想征服尽可能多的城市，但他们的效用
    $u_K$ 是被捕城市价值之和。而卓拉考虑到这一点的同时，他也会靠近坦凯莉，所以他的效用也是被捕城市价值之和。


    1. 这是一个什么样的游戏？写下它的标准型表示法。

    2. 找到所有纯策略纳什均衡。

    3. 找到该游戏的所有纳什均衡。


    # 答案


    1. 这是一个完全信息静态游戏。其标准型表示可以显示如下双线性矩阵，其中玩家集合为 {J, K}，它们的策略集为 $S_J = S_K = \{M, Y\}$。


    | | M | Y |

    |---|---|---|

    | M | 15, 5 | 8, 8 |

    | Y | 8, 8 | 13, 3 |


