    Exercise 5.8. Consider a repetition for infinitely many times with discount factor
    $\delta$ of the stage game that is reported below in normal form. The game has
    a single Nash Equilibrium $s = (s_A, s_B)$, so a possible outcome of the game
    is that it is played forever and ever.


    | | $M$ | $F$ |

    |---|---|---|

