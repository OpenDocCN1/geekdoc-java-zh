    # # Zero-sum games and minimax


    Zero-sum games represent strategic interactions between two players, where their
    payoffs sum to 0 for every possible outcome. They allow for specific solution
    approaches that may be more convenient than the general methods. The concepts
    of maximin and minimax, which are particularly poignant for this class of games,
    can also be generalized and associated with other scenarios. Overall, zerosum
    games and maximin/minimax are also typically encountered as applications of linear
    programming and artificial intelligence.


    # ## 2.1 Characteristics


    Zero-sum games are a specific case of competitive strategic interaction, for which
    some notable theorems hold. This guarantees better computational properties to
    the problem of finding the NE that is generally hard.


    The formal definition of zero-sum, as the name suggests, implies that, whatever
    the final outcome of the game, the sum of the payoffs of the two players will
    always be zero. This is true for all situations where two players compete, and
    whoever wins one is lost by the other. Games like "Odds and Evens," chess or poker
    are therefore zerosum (but note that, while sharing this property, they are quite
    different in many other aspects). In some engineering applications (but also when
    dealing with pre-school kids), non-sum games may be appealing if they include
    a possible outcome where everyone can win.


    Several theoretical results can be proven for zero-sum games, most notably the
    minimax theorem, which puts them in close relationship to linear programming and
    duality and implies polynomial-time procedures for finding the NE exist, which
    is not true for a generic game. In general, a zero-sum game can also be seen in
    many engineering problems with an adversarial setup, as those related to network
    security. Here, some network performance metric is quantified and hence it called
    the *maximizer*, whereas the legitimate network user, tries to maximize it, whereas
    an attacker plays the role of the *minimizer*, i.e., someone who wants to decrease
    the performance metric to its lowest possible values.'
