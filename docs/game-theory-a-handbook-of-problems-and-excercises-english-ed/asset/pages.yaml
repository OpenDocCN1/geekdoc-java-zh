  md: '44 Game Theory – A handbook of problems and exercises


    1 and 2, respectively. In that case, it would simply be a game with two players
    deciding upon their choice after seeing each''s last move. Many tabletop games,
    played with an open and fully visible board, and without the involvement of hidden
    elements (cards) or random choices (dice), such as chess, checker, or tic-toe
    fall within this category. In the extensive form, that would be represented as
    different layers of depth of the tree being similarly labeled, to describe that
    the player to move in a certain node has also a choice in the past.

    Also, many sequential games include an “early-termination” option where one player
    may choose the one to conclude the game before stage $n$, so there are no more
    iterations and payoffs are immediately computed. Actually this also fits the general
    definition above, if we allow for choice to a player, corresponding to the early
    termination, to involve a subsequent gameplay, no matter what the other players
    do, the final payoffs are always identical. This means that, in the extensive
    form, such a sequential game can be equivalently represented by an unbalanced
    tree, where one of the branches exiting a node of level $m < n$ reaches a leaf
    node where payoffs are computed. That would actually be keeping the tree balanced
    but allowing for all the leaf nodes belonging to that subtree be identical payoff
    labels. Notably, the extensive form representation is not unique, as multiple
    extensive forms, by a matter of fact, correspond to the same actual game, as in
    this case.


    # 3.2 Backward induction


    Backward induction is a technique that can be used to analyze games where moves
    unfold over time. For sequential games, it represents the instrument of choice
    for the solution. It corresponds to applying sequential rationality but, as the
    name suggests, it proceeds backwards, starting from the in-game situations where
    a rational decision can be made. Under the uncertainty related to it is removed,
    the procedure goes by considering the penultimate rational decision, i.e., it
    removes the end branching of the tree and to the last decision before that one,
    and on.


    This means that, if the game is represented as a tree (extensive form), backward

    This means that, if the game is represented as a tree (extensive form), backward
    induction starts by considering nodes at the end of the tree, such as those who
    are only followed by leaf nodes. Some branches out of these nodes can be removed
    by exploiting rationality, and subsequently the attention is moved to nodes up
    in the tree towards the root, which after the removal becomes closer to the end
    nodes.


    This characteristic explains the name, since the strategic gameplay is planned
    by inducing further rational decisions in the tree, and doing so by going backwards
    in the order of the decisions to be made. This way, the best decision path is
    eventually found.


    However, since backward induction applies rationality to every single node in
    the tree where a decision can be made, the procedure does not only find Nash equilibria
    of the game, i.e., it determines optimal decisions along the equilibrium path,
    but also necessarily finds subgame perfect equilibria.'
