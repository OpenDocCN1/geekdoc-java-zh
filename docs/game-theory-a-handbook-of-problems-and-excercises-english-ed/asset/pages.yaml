    2. Absolom''s mixed strategies are $a_1I+a_2R+a_3W$. The minimax optimization
    problem can be written as:


    ```

    $\max w$

    $s.t.$ $\sum_{j=1}^3 a_j = 1$

    na_j \geq 0 \quad \forall j = 1, 2, 3$

    $\sum_{j=1}^3 a_j U(S_A^{(j)}, S_B^{(k)}) \geq w \quad \forall k = 0, 1, 2, 3$

