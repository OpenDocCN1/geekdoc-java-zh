    Iterating this version of these reasonings, it can see that, if the number $n$
    of pirates is odd, the outcome is that the first pirates $P$ (i.e., he takes the
    pearl), and the second pirates $N$ (i.e., leaves him alone), to avoid being killed,
    thus ending the game. If $n$ is even, the first pirate $N$ (i.e., does not take
    the pearl) for fear of being killed and the game ends.


    Thus, there are actually different outcomes of backward induction, depending on
    whether $n$ is odd or even. In the text, the scenarios proposed $n=5$ and $n=8$,
    but all that matters is that 5 is an odd number, and 8 is even. For an odd number
    of pirates, the outcome is that the ship boy (player 1) will take the pearl and
    pirate 2 will pretend not to, to stay alive. If the pirates are in even number,
    pirate 1 will not take the pearl (and nobody takes it).


    For concerns the formal representation of the strategic choices of the players,
    they can be written as a single action, as all players have only one chance to
    move, and this is $P$ or $N$ for player $j$ if $n-j$ is even or odd, respectively.
    Notice that this fully specifies the SPE even though many pirates will not have
    a chance to play. In particular, pirates with rank $n > 1$ come into play only
    after killing their subordinates, so they can plan an action to playing, and this
    is done according to the same principles as player 1''s, choosing implies to be
    the pirate with lowest rank still.'
