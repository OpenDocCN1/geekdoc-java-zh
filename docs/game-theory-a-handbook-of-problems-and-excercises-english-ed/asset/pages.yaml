  md: '# 3.3 Subgame perfect equilibrium


    The concept of subgame perfect equilibrium is a refinement of Nash equilibrium,
    meaning that all SPEs are NEs, but not necessarily the other way around. This
    is because a subgame perfect equilibrium is defined as a strategy profile outlining
    a Nash equilibrium of every subgame of the original game. Since the whole game
    is a subgame of itself, an SPE must be an NE; first but at the same time, it must
    satisfy more stringent conditions.


    The existence of SPEs is guaranteed, as long as the players have perfect recall.
    If backward induction leads to a unique equilibrium path of the game, this is
    the only SPE of the game. Most commonly, one can compare the Nash equilibria found
    from a normal form representation, while usually only one of those is an SPE,
    if the game falls in the cases described above.


    This implies that games usually have Nash equilibria that are not SPEs. The reason
    for this is related to some non-credible behavior of the players. Indeed, whenever
    an equilibrium is not subgame-perfect, there must be an illogical response of
    some of the players that violates the principle of choosing a best response. However,
    this is not noticed (and therefore the NE is legit) because this happens off the
    equilibrium path. Usually, this translates in a non-credible threat.


    As an important notice, remember that the SPE is not defined by its equilibrium
    path only. Very often an erroneous solution to a request for an SPE is given by
    only specifying the final outcome of the game. While this is usually the most
    important aspect (since it ultimately tells how the game actually evolves), it
    is conceptually wrong to provide this as the answer to a question about the SPE,
    for the very reason that the main concern when finding an SPE is to find what
    happens off the equilibrium path, and to show that it still corresponds to rational
    choices. And Clearly, there may be multiple NEs in a game, not all of them being
    subgame perfect, but in the end leading to the same equilibrium path.'
  merge: -1
