  md: '# Game Theory – A handbook of problems and exercises


    **Exercise 1.7.** Two firms (F1 and F2) work on a joint project from the European
    Commission. They can allocate an integer number of employees on the project, from
    0 to infinity. They decide independently without consulting with each other. The
    outcome of the project is that, if the number of employees allocated by each firm
    is identical (even zero!), both get a funding of 140 k€ from the European Commission.
    If the two firms assign a different number of employees, the European Commission
    gives them different fundings: 350 k€ to the one with more employees, and 160
    k€ to the one with fewer employees. However, assigning employees costs 100 k€
    per employee. The *utility* of a firm is minus costs.


