  md: "# Game Theory – A handbook of problems and exercises\n\nNature\n\n![](img/adcae123bfc4ba205d992d916e340a6b_159_0.png)\n\
    \nFigure 6.20: Extensive form of the Bayesian game.\n\n3. There is no equilibrium\
    \ in pure strategies. It is also clear that $PP$ and $QP$ are strictly dominated\
    \ for $S$, since they always get a negative payoff, while $QQ$ always gets 0.\
    \ Thus, $T$ must mix between his only two options, and $S$ must mix between $PQ$\
    \ and $QQ$. Call $\\epsilon$ the probability that $T$ plays $E$, and $\rho$ the\
    \ probability that $S$ plays $PQ$. The values of $\\epsilon$ and $\rho$ at the\
    \ BNE can be derived as:\n\n```\n$9\\epsilon - 3 = 0 \\Rightarrow \\epsilon =\
    \ 1/3$\n$-23\\rho + 10(1 - \\rho) = 0 \\Rightarrow \\rho = 10/33$\n```\n\nThus,\
    \ the sheriff always goes home if unarmed. If armed, he patrols the area with\
    \ probability 10/33. The thief enters the ranch with 1/3 probability.\nNote: since\
    \ the game is played simultaneously, this description is enough and more advanced\
    \ equilibrium concepts do not add much. For example, if we want to add a system\
    \ of beliefs for $T$, this is just the prior."
