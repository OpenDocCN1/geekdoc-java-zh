  md: 'However, what is the rational best response played by P in response to $D$?
    This question is very hypothetical since $D$ is never played, we still want to
    see whether the result is consistent with the rationality of the players.


    In response to $D$, P can get an expected payoff of $10\mu_D - 100(1 - \mu_D)$
    when admitting and $-50\mu_D$ when keeping out, so it turns out depending on the
    value of $\mu_D$ there are two different set of PBEs: (1) the choice of P is $A$
    if $\mu \geq 5/8$ and (2) the choice of P is $0$ if $\mu \leq 5/8$.'
