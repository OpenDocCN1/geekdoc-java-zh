  md: 'Exercise 1.3. A transmitter-receiver pair works without coordination for a
    single communication. The transmitter can either: concentrate its transmission
    on a single frequency $f_0$ (C) or spread its transmission over the entire spectrum
    (S). Just using $f_0$ costs 2 units of power, while using the spread spectrum
    costs 9 units of power. The receiver can listen to one frequency $f_1$ (A), or
    two frequencies $f_1$ and $f_2$ (B). Note that it is not known that $f_0 = f_1$
    or $f_0 = f_2$. If the transmitter uses $S$, the utility of the receiver is 2
    plus the number of frequencies used. If the transmitter uses $C$, the utility
    of the receiver is 2 minus the number of frequencies used. The utility of the
    transmitter is equal to twice the utility of the receiver plus the number of used
    by the receiver and minus the power cost. Also, note that the pure strategies
    described above (for both players) can be meaningfully combined into a mixed strategy.


    +   1. Draw the normal form of the game.


    +   2. Find all pure strategy Nash equilibria of the game.


    +   3. Does the game have a mixed strategy Nash equilibrium? If yes, find it.
    If not, prove why.


    # Solution


    1. The set of players is {T, R}, with respect strategy sets $S_T = \{C, S\}$ and
    $S_R = \{A, B\}$. The payoffs of the normal form can be represented in a bitrix
    as follows.


    | | | A | B |

    |---|---|---|---|n| T | C | 1, 1 | 0, 0 |

    | | S | -2, 3 | 1, 4 |


    2. Nash equilibria are found when the strategy played by each player is a best
    response to the other. A''s best responses to B''s are underlined, B''s best responses
    are overlined.


    | | | A | B |

    |---|---|---|---|n| T | C | 1, 1 | 0, 0 |

    | | S | -2, 3 | 1, 4 |


    This is a coordination game and has two pure strategy Nash equilibria: (A,C) and
    (B,S).


    +   3. There is a mixed strategy Nash equilibrium. It can be found by setting
    $p$ as the probability that the transmitter plays $C$ and $q$ as the probability
    that the receiver plays $A$.

    Thus, for T: playing $C$ gives utility $q$ and playing $S$ gives utility $-2q+1-q$.'
