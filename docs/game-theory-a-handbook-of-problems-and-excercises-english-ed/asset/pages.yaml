  md: '# 6. Bayesian games


    At the root, Nature decides whether S''s green pass is legit (probability $1-p=0.9$)
    or fake (probability $p=0.1$). Afterwards, S chooses $D$ or $H$. Then P moves,
    without being able to distinguish S'' types. Note that $D$ is not a revealing
    action, because the professor is said to be unable to tell a fake green pass from
    a legit one.


    The normal form considers 4 strategies of S, being pair of binary $D/H$ values,
    representing “what to do if green pass is legit/what to do if fake.” For example,
    DH means means S displays it when legit, and hides when it is fake. For player
    $P$, there are also four strategies, but now it is pair $A/O$ values that reflect
    the reaction to $D$ and the reaction to $H$. For example, $OA$ means the student
    is kept out when displaying the green pass, and admitted if he keeps it. The result
    is the following bi-matrix.


    | | AA | AO | OO |

    |---|---|---|---||

    | S | DD | -1,-1 | -1,1 | -20,-45 | -20,-45 |

    | | DH | 4,-1 | 9,9 | -5,-65 | 0,-45 |

    | | HD | -1,-1 | -10,10 | -11,9 | -20,0 |

    | | HH | 4,-1 | 0,0 | 4,-11 | 0,0 |


    3. There are two equilibrium: $(DH, AO)$ and $(HH, OO)$. The former is separating
    and the latter is pooling. Note that the request about the separating equilibrium
    is justified in that there are no revealing actions, since as discussed above,
    even if the student shows the green pass, it can be fake, and the professor would
    not know; and of course, if the student keeps it hidden, the professor would be
    even more in the dark! Yet, if equilibrium $(DH, AO)$ is played, the type is revealed,
    since the student''s strategy consists of displaying the green pass only if it
    is legitimate, and keeping it hidden acknowledges it is fake. To this, the professor
    replies by “following the signal.” i.e., admitting in the Aula Magna not the students
    who display the green pass (which means it is legitimate) and sending online those
    who do not. However, there is also another BNE $(HH, OO)$, which is pooling, in
    nobody shows the green pass, and the professor speaks every one student.


    To frame a BNE as a PBE we must also set the beliefs of P, which is done in Figure
    6.19 by setting probability values $\mu_D$ and $\mu_H$ for the authenticity of
    the green pass (and corresponding complementary values $1-\mu_D$ and $1-\mu_H$
    for that it is fake) in the respective information sets follows a choice of $D$
    or $H$, by S.


    For the separating BNE $(DH, AO)$ this is very easy. Naturally, $\mu_D = 1$ and
    $\mu_H = 0$, which directly extends the BNE to a PBE.


    For the pooling PBE $(HH, OO)$, things are more complicated. First of all, the
    belief $\mu_H$ of $P$ after seeing $H$ follows the prior, since no extra information
    is gained. Thus, $\mu_H = p$. What concerns $\mu_D$, since $D$ is never played,
    that belief can be arbitrary.'
