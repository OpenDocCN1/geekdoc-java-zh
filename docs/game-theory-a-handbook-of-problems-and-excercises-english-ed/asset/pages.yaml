  md: 'Exercise 1.5.** Alice (A) and Bob (B) want to play together War Fantasy World,
    a very popular online game. When players create a character for the game, they
    are asked to select a race, and 4 options are available: Dwarves (D), Elves (E),
    Humans (H), and Orcs (O). Alice and Bob create characters simultaneously and independently.
    Their combined choice gives them utilities, whose values are the benefit of the
    team, minus the cost. The cost is 0 for Humans, 3 for Orcs, 4 for Dwarves, 5 for
    Elves.


    Humans are vanilla characters; they do not get a benefit of -3 (i.e., decrease
    their benefit by 3). Orcs get to receive an additional benefit of +5 to the other
    player. Dwarves give an additional benefit of +15 to the other player only if
    they are an Elf too. Elves get an extra benefit of +5 if she plays an Orc character
    but Bob is not playing as an Orc too. All of these rules are common knowledge.


