    | B | 55, 50 | 66, 33 |


    2. It can be seen that there are indeed Nash equilibrium in pure strategies. The
    best response of L is to copy M''s move, while M does the opposite.


    3. Then, there must be a Nash equilibrium in mixed strategies, which has both
    A and B in its support for both players.

    To find this Nash equilibrium, consider $\lambda$ and $\mu$ as the probabilities
    that L and M play A, respectively, and exploit the indifference principle. For
    player L, it must be that $u_L(A, \mu) = u_L(B, \mu)$, i.e.


