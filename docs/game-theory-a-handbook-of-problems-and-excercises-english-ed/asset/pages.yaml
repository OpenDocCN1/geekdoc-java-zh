    # Exercises


    **Exercise 2.1.** Coral and Dwayne are playing a game where they both have three
    cards in hand, showing a number, i.e. the face value of the card; they must select
    one and play it. Each player knows what cards of the opponent have in hand (as
    well as theirs). After the cards are drawn, players compute their points as follows.


    If they select two cards with the same face value F, Coral gets F points and Dwayne
    gets -F points. If they select cards with different face values respectively equal
    to $F_C$ and $F_D$, Coral gets $F_C - F_D$ and Dwayne gets $F_D - F_C$ points.


    Coral cards are a Nine (9), a Six (6) and a Two (2). Dwayne cards are a Nine (9),
    an Eight (8) and a Two (2). This information is common knowledge, well as the
    rules of the game.


    +   1. Formalize this as a static game and represent it in normal form (if there
    are simplifications of the bi-matrix available, use them in the representation).


    +   2. Find out all the Nash equilibria of this game in pure and mixed strategies.


    +   3. Find the minimax and the maximin for both players.


    # Solution


    +   1. The set of players is {C, D}. Their strategy sets are $S_C = \{9, 6, 2\}$
    and $S_D = \{9, 8, 2\}$.


    The game is zero-sum, Payoffs are represented through the following matrix:


    | | 9 | 8 | 2 |

    |---|---|---|---|

    | C | 9, -9 | 1, -1 | 7, -7 |

    | | 6 | -3, -3 | -2, 2 | 4, -4 |

    | | 2 | -2, -7 | -6, 6 | 2, -2 |


    However, the game is zero-sum, so a better representation shows Coral''s payoffs
    ($u_C$), and Dwayne''s payoffs are derived as $-u_C$.


    | | 9 | 8 | 2 |

    |---|---|---|---|

    | C | 9 | 1 | 7 |

    | | 6 | -3 | -2 | 4 |

    | | 2 | -7 | -6 | 2 |


    +   2. It is immediate to see that 2 is a dominated strategy for both players.
    For Coral, playing 9 is dominant. Thus, the only Nash equilibrium (which is in
    pure strategies) is (9,8).'
