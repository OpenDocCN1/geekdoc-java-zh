    cannot observe the move of B, because it is simultaneous, and hence that B will
    play a pooling strategy, so her can only know the prior, i.e., $\mu_{bad}=p$.
    The bank knows its own type, but cannot observe J''s move beforehand — we introduce
    two pairs of beliefs $\mu_C^{(bad)}$ on the left side and $\mu_C^{(good)}$ on
