    | 1 | 250, 160 | 40, 40 | 60, 150 |

    | 2 | 150, 160 | 150, 60 | -60, -60 |


    The Nash equilibria are found to be (1,0) and (0,1). Indeed, 0 is the best response
    to anything but 0 and the best response to 0 is 1. We can also see that 2 is not
    strictly dominated by 0 and 1 but it is, by their convex combination where 0 is
    played with probability $p = 0.95$ and 1 is played with probability $1 - p = 0.05$.
    Thus, we can also remove 2 from the game.


    | | 0 | 1 |

    |---|---||}{

    | F1 | 140, 140 | 160, 250 |

    | 1 | 250, 160 | 40, 40 |'
