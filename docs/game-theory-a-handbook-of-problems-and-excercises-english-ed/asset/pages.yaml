    | | -10, -10 | -10, -10 | -10, -10 |


    Game G has two Nash equilibrium, therefore we can apply a carrot-and-stick rationale,
    where a "carrot" is the better Nash equilibrium $(M,M)$ and the "stick" $(P,P)$.
    The idea is to reward collaboration with the "carrot," and punish betrayal with
    the "stick." Formally, this translates into strategy $S$ with a reward, defined
    as (i) start by playing $S$ in the first round and (ii) in the second round, play
    $M$ if the first round resulted in $(M,M)$, otherwise (with every other result
    of the first stage) $(P,P)$. Note that $(S,S)$ can only be played at the first
    round since the last round players are forced to play an NE of the stage.


    The idea would be that $(S,S)$ is chosen as the NE of the whole game, and this
    ends up in $(S,S)$ at the first round followed by $(M,M)$ at the second. Actually
    happens if $S$ played by one player is the best response to $S$ by the other,
    so we must avoid that deviations from $S$ are advantageous. Actually the only
    deviations that make sense at the first round, since the last round is already
    played an NE of the game, there is no desire for unilateral deviation there. We
    need to guarantee that $u(S,S) + \delta u(M,M) > u(deviation) + \delta u(P,P)$,
    one player may consider deviating in the first round and then getting the "stick"
    $P,P$ in the second, which can still be appealing if the deviation is convenient
    and the punishment is too weak. The strength of the punishment depends on the
    difference between "carrot" and "stick" but also on its certainty, i.e., the discount
    factor $\delta$.


    Deviating from $S$ is tempting for $D$, since she has the highest convenience
    in deviating, she will get utility 18 in the first round as opposed to 10. Still
    strategy $S$ works if $10 + 9\delta > 18 - 10\delta, \delta \ge 8/19$.'
