  md: '# 6. Bayesian games


    outcomes are (G, N) in round 1 and (N, N) in round 2 if J is tit-for-tat, or (N,
    N) for both rounds if J is strategic.


    Instead, if she collaborates with J in the first round by playing G, the possible
    outcomes are:


    +   • (N, G) and (N, N) if J is strategic;

    • (G, G) and (G, N) if J is tit-for-tat.


    Thus, starting with N gives M an expected payoff 12p. Starting with G gives M
    an expected payoff 19p-5(1-p). Hence, M starts with G if 24p-5 > 12p, i.e., p
    > 5/12.


    As a side note, this is an SPE when both types of J clearly play their best responses.
    M plays NE in the whole game and the last stage is played as a best response.


    A methodological remark is that in this specific game, the presence of a Tit-for-Tat
    type for J that initially seeks for collaboration, obtains that M reciprocates.
    Actually the one from M''s is not a heartfelt collaboration, rather just an attempt
    to make the most out of the game, but this characteristic is shared by the standard
    case of the repeated prisoner''s dilemma. Also, it is required that p is sufficiently
    high for this to happen. The idea is that selfish M wants to take advantage of
    the good behavior of J''s Tit-for-Tat type. M is smart and realizes that, if defecting
    immediately, both types of J will be selfish in round 2. But she can keep the
    Tit-for-Tat type on a leash if J collaborates in round 1, and then J will bring
    gifts on both occasions (Christmas and Valentine).


    On the other hand, J does not intend to collaborate if his type is strategic.
    Yet, if the horizon of the game is further prolonged, we observe that J also switches
    to collaboration in the first round(s) when his type is strategic. In other words,
    the presence of a Tit-for-Tat type (acting as a rewarding/punishing entity) plays
    the same role of the carrot-stick options in the analysis of multistage games.
    Of course the likelihood of this type must be sufficiently high (so we require
    that p is above a threshold), in the same manner as the discount factor must be
    sufficiently close to 1 in Friedman''s theorem, for this punishment to be effective/credible.'
