  md: 'Exercise 5.8. Consider a repetition for infinitely many times with discount
    factor $\delta$ of the stage game that is reported below in normal form. The game
    has a single Nash Equilibrium $s = (s_A, s_B)$, so a possible outcome of the game
    is that it is played forever and ever.


    | | $M$ | $F$ |

    |---|---|---|n| $M$ | 1, 1 | -2, 3 |

    | $F$ | 3, -2 | 0, 0 |


    +   1. Describe a “Tit-for-Tat” strategy that may be used by each of the player
    to enforce cooperation on playing $M$ at every iteration starting from the first
    round.

    2. For which values of $\delta$ does this cooperation take place?

    3. Is this outcome a subgame-perfect equilibrium?


    # Solution


    +   1. The “Tit-for-tat” is: start playing $M$, then play the same thing that
    the other player did the round before.

    2. To check when this leads to cooperation, we can consider one-stage betrayal.
    Instead of playing $M$ forever (that gives 1, then $\delta$ in the first two rounds),
    one can consider playing $F$, then $M$ forever. This gives 4 in the first round,
    $-2\delta$ in the second. After that, the outcomes coincide. Thus, the best response
    is $M$ forever if $3-2\delta < 1 + $\delta$, i.e., $\delta > 2/3$.

    3. The “Tit-for-tat” strategy is not a subgame-perfect equilibrium because it
    does not give a Nash Equilibrium in all possible subgames. For example, it can
    lead to a death spiral if the first outcome is $(M,F)$.'
