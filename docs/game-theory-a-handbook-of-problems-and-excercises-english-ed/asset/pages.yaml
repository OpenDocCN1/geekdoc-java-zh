  md: '# 6. Bayesian games


    **Exercise 6.17.** The sheriff (S) is watching over the ranch, because he has
    informed that a cattle thief (T) is planning to break and enter. The night is
    very cold though, so S is considering whether to patrol (P) the area or quit (Q)
    go home; all T may have already fled, scared by the possibility of being caught.
    Indeed, T has two options: to enter (E) the ranch to rob it or to flee (F). Clearly,
    both players make their decision without considering each other first so they
    can be considered simultaneously. One relevant aspect for T is whether S is armed
    or not; it is known by everybody that S carries his gun 30% of the times. But
    S knows for whether he has brought his gun with him or not. Payoffs are computed
    as. For T, fleeing the scene gives payoff 0, while patrolling the area over the
    cold night when T has the fence gives -10. If T decides to enter when S has gone
    home, he will commit a robbery without being disturbed, and will get payoff +10.
    All of these payoff are unaffected by S being armed or disarmed, the only difference
    is when T enters the ranch and S decided to keep patrolling the area. In this
    case, if S is unarmed, there will be a fist, with both players getting, but T
    would eventually manage to escape; in the end they get payoff -20. However, if
    S is armed, T will end up being shot and caught. T gets payoff -100, while S gets
    +20 for having caught the thief.


    +   1. Represent this Bayesian game with S and T in extensive form.

    2. Represent this Bayesian game in normal form, with a type-agent representation
    of player S (i.e., its strategies are n-tuples of actions, one per type).

    3. Find the Bayesian equilibrium of the game.


    # **Solution


    +   1. The extensive form is a tree. The root node is Nature''s move over S having
    a gun or not with respective probabilities 0.3 and 0.7. After that, players move
    simultaneously, so one possibility is to have T moving without distinguishing
    between the two nodes, as shown in Figure 6.20. Another possibility is to have
    S moving first knowing whether it the left-hand or right-hand subst, and afterwards
    T moves without knowing what he is at.


    +   2. Type-agent representation of player S decides as a pair of actions: what
    to do for each of its types, sorted as armed-disarmed. Both elements can be either
    P or Q. This leads to the following bi-matrix.


    | | PP | PQ | QQ |

    |---|---|---|---||

    | T | E | -44, -8 | -23, 6 | -11, -14 | 10, 0 |

    | F | 0, -10 | 0, -3 | 0, -7 | 0, 0 |'
