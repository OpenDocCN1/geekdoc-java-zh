  md: 'Game Theory – A handbook of problems and exercises


    The two Nash equilibria are $(A, A)$ and $(B, B)$, meaning that the two players
    are happy if they end up together. An outcome like $(A, B)$ is not rational as
    both would regret their choices. Scenarios like these are also known as *coordination*
    games.


    # 1.4 Elimination of strictly dominated strategies


    When solving exercises, it may also be useful to remember the concept of eliminating
    strictly dominated strategies. Formally, strategy $S$ of player $i$ is strictly
    dominated by $T$ if $u_i(T, s_{-i}) > u_i(S, s_{-i})$, for all strategic $s_{-i}$
    of the other players ($-i$ is commonly used in game theory to denote the other
    players than $i$). Also, note that the inequality must be strict and hold for
    all $s_i^*$.


    Strictly dominated strategies are never chosen by rational players, thus if one
    strategy $S$ is spotted when solving an exercise, the corresponding row or column
    can be safely removed from the payoff matrix. Sometimes, this may lead to other
    strategies becoming strictly dominated, and they can be iteratively eliminated,
    a process known as iteration of strictly dominated strategies (IEDS, for short).


    While removing dominated strategies is not mandatory, it often simplifies the
    solution of an exercise to a great extent. Indeed, a strictly dominated strategy
    is never part of an NE and the usual question is to remove it from the game leaves
    the solution with a smaller matrix that is easier to handle. For example, in the
    prisoner''s dilemma one can see that not only $(C, C)$ is the Nash equilibrium
    (which can be proven even by overlining responses), but also $M$ is a strictly
    dominated strategy (clearly, $C$) for both players. Thus, $(C, C)$ is the only
    available choice to rational players and is therefore the only NE.


    Unfortunately, there is no standard procedure to spot strictly dominated strategies
    other than carefully check the payoff matrix and see if there is a row (or column)
    that assigns to the array of payoffs that is element-wise less than another row
    (or column).


    # 1.5 Nash equilibria in mixed strategies


    For now, only pure strategies have been discussed. However, there are cases where
    it makes sense to consider mixed strategies, which involve randomness. A mixed
    strategy combining pure strategies $\{A, B, C\}$ (one may also say that the support
    of this mixed strategy consists of these three pure strategies) can be represented
    as $pA+qB+rC$, which means ''play $A$ with probability $p$, play $B$ with probability
    $q$, play $C$ with probability $r$. Since weights $(p, q, r)$ form a probability
    distribution they must satisfy $p+q+r=1$, ie, $r=1-p-q$. Pure strategies can be
    reinterpreted as mixed strategies with a degenerate probability distribution in
    which only one value has probability 1.'
  merge: -1
  pgno: 9
