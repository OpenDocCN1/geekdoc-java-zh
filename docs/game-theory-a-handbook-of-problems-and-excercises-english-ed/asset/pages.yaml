  md: '# 2. Zero-sum games and minimax


    as the game is zero-sum and therefore not symmetric. It is just a numerical coincidence,
    here Nash equilibrium in mixed strategies consists of both A and B playing 1 with
    probability 2/7, 2 with probability 3/7, and 3 with probability 2/7.


    This is the only NE, but proving it is actually not simple. Ideally, one should
    check all mixture of probabilities. For example, consider a mixed-strategy NE
    where both players play strategies 1 and 2 with non-zero probability, corresponding
    to the 2 × 2 minor of the matrix.


    | | 1 | 2 |

    |---|---||

    | R | -1 | 1 |

    | | 1 | -1 |


    You can see that this reduced form of the game has an NE where, for symmetry reasons,
    both strategies are played with 0.5 probability. Unfortunately, this is **not**
    an NE according to the indifference theorem. An important condition (often forgotten
    by students) of the theorem requires that a player chooses its mixed strategy
    so as to make the other indifferent for all pure strategies belonging to the support
    of that player''s strategy, *but* also strategies outside the support of that
    player''s strategy must not get a better payoff. This is not happening if both
    players choose to play a mixture m of 1 and 2 with 50-50 probabilities, since
    they get expected payoff of 0. Now, this is value of what they get by playing
    pure strategies 1 and 2 against *m*, but unfortunately strategy 3 gets a payoff
    of 0.5, thus representing a better literal deviation, which proves that *m* is
    not the best response to it.


    So one should go through all possible combination, which is tedious. Of course
    when analyzing a game like that, one can use some software tools available online,
    which would confirm that the previously found NE is the only. Or, in this case
    one can use the systematic approach of minimax to find the NE.


    An optimization problem can be written for the probabilities $r_1, r_2, r_3$ that
    player R chooses strategies 1, 2, or 3, respectively, as


    ```

    max w

    3

    sns.t. \sum_{j=1}^{3} r_j = 1

    r_j \geq 0 \\forall j=1, 2, 3

    3

    sum_{j=1}^{3} r_j u_R(S_k^{(j)}, S_B^{(k)}) \geq w \\forall k=1, 2, 3

    ```'
