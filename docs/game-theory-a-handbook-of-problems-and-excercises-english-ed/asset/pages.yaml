  md: 'Exercise 4.8. A class of 13 students needs to select the next class rep for
    the academic year. The three candidates are Alicia Allen (A), Bill Baker (B),
    and Connie Carter (C). The principal was clear on allowing only one representative
    per class, which is chosen as the candidate with most votes. Using symbol > to
    denote “preferred to”, the common knowledge is that students'' preferences divided
    as follows:


    +   - for students 1–5 A>B>C;

    - for students 6–9 B>C>A;

    - for students 10–12 C>B>A;

    - for students 13 C>A>B.


    1. What is the outcome of the election under sincere voting? Who is the winner
    W under this assumption?


    2. How can the third group of voters (10–12) tamper with this result by adopting
    strategic voting? Who becomes the winner W?


    3. If this group applies strategic voting, do the supporter of W have some countermeasure
    to this? What is the reason for that?


    # Solution


    +   1. This election is a simple majority voting, where the candidate with most
    preferences wins. Under sincere voting A gets preferences from students 1–5 (5
    votes), B from 6–9 (4 votes), and C from 10–12 and from 13 (4 votes). Therefore,
    A wins the election.


    +   2. For group 10–12, B is a preferable candidate to A. Since the group can
    foresee A’s victory, a strategy that they can adopt is to vote for B. This way,
    B is the new winner.


    +   3. The only thing that students 1–5 could do to prevent B’s victory is to
    vote for C, which would result in a tie. However, this goes against their own
    interest, as they prefer B to C. Thus, there is no countermeasure that they can
    adopt. Notice that B is the Condorcet winner so it is difficult to tamper against
    him.'
