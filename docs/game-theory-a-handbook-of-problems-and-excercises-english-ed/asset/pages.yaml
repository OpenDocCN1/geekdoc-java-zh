    of PBE, but if we do, he must use the prior to discriminate among the nodes, so
    his beliefs are $p$ and $1-p$ anyways. In case of the equilibrium $(C,DA)$, Y
    plays rationally and the equilibrium path involves the rational choices of player
    0 (to apologize if weak, to accept the duel if sharpshooter). The beliefs of O
    are 100% in the nodes where he moves, since he knows his own type. Instead, in
    the other two nodes of 0 are off the equilibrium path. Therefore, his beliefs
    in BNEs can be arbitrary, but they cannot be zero, hence showing that in this
    evolution of the game, 0 has planned an irrational strategy and these two BNEs
    do not extend to a PBE.'
