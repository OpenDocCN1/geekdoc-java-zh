  md: '# 5. Multistage Games


    reward/punishment approach, which usually translates into a requirement on δ that
    must be above a certain value. Keep in mind that the standard case of playing
    an NE multiple times in every evolution of the game is also always present as
    an SPE.


    # 5.3 Infinitely repeated games


    For the case of games that are repeated infinitely many times, the conclusion
    is even more interesting. Instead of requiring a credible reward and punishment
    approach of two or more NEs with an explicit difference between each other, it
    can be created out of thin air by the called "grim trigger" strategy. This is
    true for repeated games with a single NE, and indeed it is even studied in application
    to the prisoner''s dilemma. Whatever the underlying game, it is usually assumed
    that the players have a cooperating and a defecting option, which in the case
    of the prisoner''s dilemma are to collaborate with police or stay silent, respectively.
    Only cooperation is not an NE of the stage game, while mutual defection is.


    In an iterated game that repeats such a stage game infinitely times, it is found
    that the NE forever is of course a possible SPE. But also cooperation forever
    can be established as an alternative SPE, or better its equilibrium path. To prove
    this, one cannot resort to an approach akin to backward induction, since there
    is no last stage to start from. The idea is that the players start with an initial
    cooperation and they "agree" (once again, this agreement is just in their head
    since do not actually communicate) deviating players will be punished for the
    rest of the game, which is forever. This is formally defined as a "grim trigger"
    strategy, which is to play cooperation as long as all previous stage results describe
    mutual cooperation, and to defect otherwise. It is called that because once the
    trigger is pulled, there is no way back.


    This strategy ought to cooperation being forever as the equilibrium path. Yet,
    it does not fully prevent a player from deviating selfish players naturally tempted
    to a myopic deviation, i.e., to play a deviation in the stage game. A deviation
    must exist and is actually the reason why the cooperating option is not a local
    Nash equilibrium in the first place. However, if this player also believes that
    the other player is adopting the grim trigger strategy, then the player anticipates
    that the myopic deviation will be advantageous for the current stage but will
    also lead to reduced payoffs in the future. Thus, the grim trigger is effective
    as long as the utility of cooperating forever is higher than taking a selfish
    deviation now and facing an eternal punishment in the future.


    Notably, this depends as before on the difference between reward and punishment
    and also the value of the discount factor. If δ is low, even the threat of an
    eternal punishment may not seem credible – which may also apply to ethical conclusions
    under a religious assumption. From a more mundane perspective of a game theoretic
    exercise, this means that very often the request'
