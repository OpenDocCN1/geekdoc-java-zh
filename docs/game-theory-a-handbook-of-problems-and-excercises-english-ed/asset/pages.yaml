    +   1. Strategy $M$ is strictly dominated by $F$. If we remove it, we are left
    with a coordination game where $(F, F)$ has payoff 2 for both players, $(H, H)$
    has payoff 6 for both players.


    | | F | H |

    |---|---|---|

    | F | 2, 2 | 0, 0 |

    | H | 0, 0 | 6, 6 |


    These are the pure strategy equilibria, and there is also a mixed strategy $1/4F+3/4H$,
    with payoffs equal to $(5, 5)$.


    +   2. For symmetry, strategy has $s_A = s_B$. Also, at the last stage $s_A$ doubles
    to $F$ or $H$ in the mixed equilibrium that we call $E$. The normal form of the
    whole game is equivalent to the stage game matrix where all cells are increased
    of $(2,2)$, $(5,5)$, and $(6,6)$. One option is to increase the top corner by
    $(6,6)$ and the others by $(2,2)$, creating another Nash equilibrium. This means:
    “play $M$ at the first stage; then; if the outcome was $(M,M)$ play $H$ at the
    second stage; if somebody deviated $F^m$ would work. (at the second stage you
    can also play $E$). This is a Nash equilibrium of the whole game and also of the
    only subgame, i.e., the last stage, where either $(H,H)$ or $(F,F)$ is played.


