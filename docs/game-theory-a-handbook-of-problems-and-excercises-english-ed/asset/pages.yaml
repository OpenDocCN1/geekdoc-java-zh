    game, also including mixed strategies, are a family (meant as a set, not a mafia
    clan, in case you are wandering) of infinitely many equilibria, which includes
    all the cases where:


    +   - G chooses I

    - the "not police" type of F always plays C

    - the "police" type of F plays a linear combination $\alpha C(1-\alpha)I$, with
    $\alpha \in [0,1]$.


