  md: '# 112 Game Theory – A handbook of problems and exercises


    is known as Bayesian Nash equilibrium (BNE) and it is nothing but a standard NE
    for a Bayesian game (which, according to the previous discussion, can be promptly
    translated into a dynamic game). However, similar to dynamic games, such a concept
    may be insufficient to capture the rational behavior of the players in a credible
    way and obtain satisfactory predictions.


    If the game simply implies a preliminary move of Nature for choosing the types
    of all players, and after all choices of the players happen simultaneously, we
    can regard this as a static Bayesian game. Actually, the name is somewhat misleading
    since it is not really a static game (there is a player, i.e., Nature, moving
    prior to the others). However, it is just straightforward straightforward of static
    games of complete information, and since the type agent representation allows
    to remove the incompleteness of information, the BNE is more than enough to represent
    this case.


    If the game is dynamic instead (and not just of Nature''s preliminary move), then
    the solution becomes more complex, and the strategies available to the players
    explode, since they jointly account for multiple types and different kinds of
    gameplay. Generally, it is tractable to manually investigate scenarios with 2
    players, only one of which is Bayesian, and allowing only two rounds of interaction.


    This leads to the following relevant cases, for which the solution approach is
    somewhat standardized. The first is the case of a dynamic game where a first player
    1 moves without a type, and this is followed by the move of a second player 2
    that is Bayesian. This is sometimes called a screening game – it actually represents
    the scenario in the Wizard of Oz, where an individual is hidden behind a curtain
    and his actual character is unknown: is he a real wizard or an impostor? Notably,
    a classic scenario where to apply this framework is the entry game, in which 1
    also has an early termination option for the game. This somehow reduces the number
    of strategies and generally makes the problem more tractable – one does not have
    to plan the strategy of the Bayesian player 2 based on the history of play, but
    only on the type.


    In a screening game, player 1 moves first without gaining any additional insight
    on player 2 and the only available information resides in the player. Hence, 1
    has one information set (comprising all of nodes with a different Nature''s choices
    on the type of 2, unknown to player 1) and chooses the action to play based on
    the expectations, taken over the period, of possible reactions by 2. Still, player
    1 has the first mover advantage and can anticipate the outcome of the game through
    backward induction assuming that 2 will behave rationally. This avoids avoiding
    non-credible threats by player 2 and overall obtaining a subgame equilibrium as
    the outcome. The SPE is the adequate solution concept for this kind of games,
    as if that all subgames (in this case are determined by different choices of player
    1 and multiple types of player 2) are played rationally.


    Conversely, one may consider a dynamic scenario analogous to a screening game,
    but making player 1 Bayesian (and player 2 is just a regular player). In this
    case, the SPE is found to be insufficient to describe practical solutions, as
    there is only one subgame (the whole game itself), because the'
