  md: '# 6. Bayesian games


    **Exercise 6.4.** Franco (F) and Gino (G) are henchman who have been paired together
    by their padrino to send some warning to a rival gang. They can, independently
    and without preliminary agreement, act in a Conscious (C) or Inconscious (I) way.
    If both are unconscious, the warning is ineffective and the padrino will not give
    any reward to the henchman. If at least one is conscious, the rival gang gets
    a scary warning and the padrino rewards the henchman; this reward has value 10.
    However, if both are conscious, the warning is too loud and the police arrests
    them. As a result, their reward is −30. Gino is about to prepare for this when
    he hears a Franco may be an undercover agent of the police. If this is true, Franco''s
    preferences are different. He *wants* them to be caught, so if both are conscious,
    the reward of the undercover Franco is 20. Gino estimates the likelihood that
    Franco is police with probability *p*. Franco clearly knows whether he is an undercover
    officer or a henchman, but he is also aware of Gino''s suspicion — and the value
    of *p* is common knowledge.


    +   1. Write down the extensive representation of this game.


    +   2. Write down the normal form of a type-agent representation of the Bayesian
    game (where all typed players have strategies represented as $n$-tuples of actions,
    one per type).


    +   3. Find out the Nash equilibrium for this game for $p = 0.3$ and discuss whether
    they are subgame-perfect or what are the corresponding PBEs.


    # Solution


    +   1. The extensive form is a tree. The first node is Nature, deciding whether
    F is undercover or not, with probability $p$ and $1-p$ respectively. Below that,
    the game can be represented in two ways. One way, in Figure 6.6, consists in F
    moving. Here F distinguishes between the two nodes below, since he knows whether
    he is undercover or not. Afterwards, G moves without knowing if F is police, what
    action is chosen by F. Therefore, all four nodes of G belong to the same information
    set.

    Another possibility is to have G moving first without knowing whether it is the
    left-hand or right-hand subtree, and afterwards F knowing Nature''s choice, but
    G''s move. This “swap” is allowed whenever the game is played simultaneously.


    +   2. Player F has a type, so his type-agent representation has four strategies
    (two types, two actions): $CC, CI, IC, II$. The normal form representation is


    | | CC | CI | IC | II |

    |---|---|---|---|---|

    | C | -30, 50-30 | 10-40, 10+10 | 40-30, 30-30 | 10, 10-10p |

    | I | 10, 10-10p | 10p, 0 | 10-10p, 10-10p | 0, 0 |'
