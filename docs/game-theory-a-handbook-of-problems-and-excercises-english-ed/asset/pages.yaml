  md: '# Static games of complete information


    Utilities in mixed strategies are computed by taking expectations over the aforementioned
    probabilities. For example, in the Prisoner''s dilemma, joint strategy (0.9M +
    0.1C, M) gives P2 a payoff equal to


    $u_{P2}(0.9M + 0.1C, M) = 0.9u_{P2}(M, M) + 0.1u_{P2}(C, M) = 0.9(-1) + 0.1(-9)
    = -1.8.$


    The concept of strictly dominated strategies applied to mixed strategies too,
    both in the sense that mixed strategies can be strictly dominated and another,
    pure. For some exercises, the latter case might be useful, but unfortunately spotting
    that a pure strategy is strictly dominated by a mixed strategy is generally not
    easy to do, since mixed strategies are not explicitly reported on the matrix,
    so it requires a bit of effort.


    Nash equilibria in mixed strategies are found by applying the indifference principle.
    This states that a mixed strategy at the Nash equilibrium gives the same payoff
    to the other player for all moves. That is, if P1 plays $A + (1-p)B$ and P2 can
    choose between moves $\{D, E\}$, the condition to satisfy


    $u_{P2}(p, D) = u_{P2}(p, E),$


    where $p$ is short notation for $A + (1-p)B$.

    **Example:** in "Odds and Even" both players choose a number, between 0 and 5,
    and so simultaneously (in rock-paper-scissors). The number can be odd (O) or even
    (E). One player, P1, wins and gets +1 if the sum of the numbers is even; then
    other, P2, wins instead if the sum is odd. The loser gets payoff -1. Conveniently,
    it turns out that the sum relationships between odd and even numbers satisfy certain
    mathematical properties that allow to represent just the choice of $O$ or $E$
    as the pure strategies and the normal form of the game is shown through the following
    bi-matrix


    | | O | E |

    |---|---|---|

    | P1 | 1, -1 | -1, 1 |

    | E | -1, 1 | 1, -1 |


    In games, with a structure like that, i.e., one player likes when the selections
    are the same, but other prefers that they are different, are called coordination
    games. Compare this with a coordination game, where both players want them to
    be the same. A coordination game does not have Nash equilibrium in pure strategies,
    since all the joint strategies imply that one of the players has a regret and
    wants to change the outcome. However, an equilibrium in mixed strategies can be
    found by applying the indifference principle. P1 should play a mixed strategy
    $pO + (1-p)E$ such that P2''s payoff is the same playing either $O$ or $E$. This
    concept leads to


    $u_{P2}(p, O) = u_{P2}(p, E)$'
