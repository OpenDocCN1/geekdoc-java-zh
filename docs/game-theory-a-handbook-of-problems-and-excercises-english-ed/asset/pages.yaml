  md: '# 98 Game Theory – A handbook of problems and exercises


    **Exercise 5.4.** Carl (C) and Diana (D) are two university students who have
    found that the department library is unoccupied overnight. It is a really good
    place to study and has a very fast Internet connection. So, they go every night,
    but they do not coordinate or plan any action together. Upon their arrival every
    night, they independently decide whether (S) study or (M) watch movies on their
    laptop. If they both study, they get utility 10. The individual benefit from watching
    a movie is 15 for C and 18 for D. However, if they both M, their individual benefit
    is halved (since they have half the connection speed). Also, trying to study while
    someone else is playing a movie breaks the concentration, so $u_C(S,M) = u_D(M,S)
    = 0$ (C is written as the first player). Call G this game, and consider in a repeated
    version $G(T)$, where G is played every night for $T$ nights. Individual payoffs
    are cumulated with discount factor $\delta$. Finally, consider an extended game
    where a punishment strategy $P$ is also available to both players. When either
    player chooses P, payoffs are $-10$ for both players (that would correspond, e.g.,
    to doing something stupid in the library and get the library permanently closed).
    Call this game $G''$. Note: despite $P$ being weakly dominated, $(P,P)$ is an
    NE for $G''$.


    +   1. Find the Nash equilibrium of $G(3)$, for $\delta = 1$.


    +   2. If values of $\delta$ allow for sustaining a Nash equilibrium of $G(\infty)$
    via a ''Grim Trigger'' strategy where each player ends up in choosing S?


    +   3. If you see an SPE of $G''(2)$ where players may play S, state at what round
    they do it, and what value of $\delta$ do you need to obtain it.


    # Solution


    +   1. The normal form matrix of $\mathbb{G}$ is the following.


    | | S | M |

    |---|---|--|

    | S | 10, 10 | 0, 18 |

    | M | 15, 0 | 7, 9 |


    The only Nash equilibrium of the stage game is (M,M). This is also the only Nash
    equilibrium for a finitely repeated game.


    +   2. The Grim Trigger strategy is: "starting S at round 1, then keep playing
    it in round T as long as both played S in every round from 1 till $T-1$." This
    is a Nash equilibrium as deviating is less advantageous and get (M,M) forever
    is less stringent for Diana. The payoff for both Carl and Diana playing S at every
    stage is


    ```

    $10 + 10\delta + 10\delta^2 + \dots = 10 \sum_{t=0}^{\infty}\delta^t = \frac{10}{1-\delta}$

    ```'
