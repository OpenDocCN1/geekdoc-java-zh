  md: '# 5. Multistage Games


    **Exercise 5.9.** Consider a repetition for 2 times with discount factor $\delta
    = 1$ of the stage game that is reported below in normal form.


    | | M | F | H |

    |---|---|---|---|

    | M | 7,7 | -2, 9 | -1, -1 |

    | F | 9, -2 | 2, 2 | 0, 0 |

