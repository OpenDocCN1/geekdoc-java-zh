  md: '# Game Theory – A handbook of problems and exercises


    **Exercise 1.4.** Two students, Charlotte and Daniel, need to write their MS Thesis.
    They need to choose (independently and unbeknown to each other) a supervising
    professor. Three professors are available for this role: Xavier, Yuan, and Zingberry.
    The utility of a student is given by the amount of help they receive from their
    supervisor, which is quantified as 40 for Xavier, 60 for Yuan, 50 for Zingberry.
    If the two students select the same professor as their supervisor, they get 70%
    of the utility they would get if the professor had only one of them to supervise.


    +   1. Write the game in normal form.

    2. How many Nash equilibria does this game have?

    3. If your answer of the previous point included one or more mixed equilibria,
    write all of them explicitly (i.e., evaluate the probabilities that each professor
    is chosen).


    # Solution


    +   1. The set of players is (C, D), and the common set of strategies is $S_C
    = S_D = \{X, Y, Z\}$. The normal form of the game can be represented as a bi-matrix
    as follows.


    | | X | Y | Z |

    |---|---|---|---|n| X | 28, 28 | 40, 60 | 40, 50 |

    | Y | 60, 40 | 42, 42 | 60, 50 |

    | Z | 50, 40 | 50, 60 | 35, 35 |


    +   2. Strategy $X$ is strictly dominated by $Y$. Thus, we can remove it. We are
    left with the following reduced game:


    | | Y | Z |

    |---|---|--|

    | C | 42, 42 | 60, 50 |

    | Z | 50, 60 | 35, 35 |


    This game has 2 Nash equilibria in pure strategies: $(Y,Z)$ and $(Z,Y)$.


    +   3. It is easy to see that there must also be a NE in mixed strategies, where
    the support of both mixed strategies includes $Y$ and $Z$, while $X$ is discarded
    as it is strictly dominated. Since the matrix is simmetric, the mixed strategies
    that are played in the Nash equilibrium must be equal for both the players. If
    $p$ is the probability of either of the players choosing $Y$, the mixed strategy
    equilibrium must satisfy the following condition:


    ```

    $42p + 60(1-p) = 50p + 35(1-p)$

    ```'
