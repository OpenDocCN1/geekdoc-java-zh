  md: '# Sequential games


    Sequential games with perfect information are a particular class of dynamic games.


    # 3.1 Characteristics


    In sequential games of $n$ stages, players alternate in making their moves, that
    is, player 1 moves alone at stage 1, then at subsequent stages $j = 2, 3, \dots,
    n$, it is player $j = 2, 3, \dots, n$’s turn to move. In the case of perfect information,
    the player moves informed about the choices made within all the previous $j -
    1$ stages. This last element is key to understand the game: all moves are made
    with full awareness of the previous choices. Clearly, all players see the evolution
    of the game in its entirety, but this assumption of perfect information is actually
    only relevant to the players to move, since the players are generally assumed
    to have perfect recall, so they do not forget past moves. Also, it is equally
    assumed that all the players are rational and this information is common knowledge
    among the players.


    Because of the properties mentioned above of the clearly specified order of moves
    and full information about the past history of the game, in a sequential game
    with perfect information the information set of each node is a singleton, which
    means, that the gameplay dynamically evolves to a certain-game stage, all the
    players (and most notably, the player to move) are perfectly informed about where
    the game is at. Thus, a sequential game is generally represented in extensive
    form by a plain tree without any possible fusion of the players to move; in other
    words, there are no dashed lines joining separate nodes of the tree. The extensive
    form may be preferred because it preserves the dynamic character of the game.
    The normal form can be used, but its representation is generally not very compact,
    since each information set is separate and only contains one node (the current
    one), one must specify one action per node in the tree, and the number of choices,
    which becomes combinatorial,


    The general scheme described above also includes games that apparently do not
    fit the definition. For example, a player may move multiple times at different
    stages $i$ and $j \neq i$, that is, player $i$ and $j$ in the definition above
    can coincide. It is possible that just 2 players alternate in making choices,
    e.g., if odd-numbered players and all even-numbered players actually coincide
    with players'
