  md: '# 110 Game Theory – A handbook of problems and exercises


    Now, complete knowledge no longer holds as players only know the value of their
    own type. Clearly, this requires an adaptation of the requirements about what
    players really know the game, since we would like to express logical deductions
    of the players from their in-game knowledge. Therefore, in Bayesian game we need
    to set some common ground about what the players know, beyond what they cannot
    with certainty, i.e., the types of the players with a type. A frequently adopted
    approach is to assume a common prior to all the players. This means the joint
    probability distribution p(t1, t2, ..., tk) is common knowledge. Simply put, players
    know their own type with certainty; others, they have an estimate (the probability
    distribution) of what their type could be. When we assume that this probability
    distribution is known by all players (the “common prior assumption”), we are able
    to transform the games of incomplete information into games of imperfect information
    (in which the history of play within the game is not known to all players).


    This means that Bayesian games are translated into dynamic games, and the strategies
    and the normal form of the game are modeled in the same ways as done. The first
    move in such dynamic games is always played by Nature, and corresponds to determining
    the individual types. After this, we can consider that players choose an action
    per each of their information sets. Notably, players with a type will be aware
    of it and therefore choose (possibly different) actions each one of their types,
    since each type leads to a separate information set. Given, that they have no
    uncertainty on their type, their information set related to the Nature''s choice
    of their pertinence is singletons – however, they can have uncertainty on the
    other players'' types or moves.


    Very often, this leads to a type-agent representation of players with a type,
    in which their strategy is modeled like the player suffered with split personality.
    In other words, they plan in a strategic choice per one of their types. This may
    also be combined with other multiple information sets that players may have, e.g.,
    due to the dynamic history of the gameplay. It may seem silly that a Bayesian
    player plans an action per each of the types, since the actual type determined
    by Nature will be only one. However, besides the general reasoning of adopting
    a standard approach, this is the correct modeling choice in order to represent
    the benefits of the other players, since they do not know the type of Bayesian
    player instead, and therefore can expect every sort of behavior.


    Although this example is already old and only good for boomers, this resembles
    role-playing games like “One of us” or “Werewolves” where a player is dealt a
    secret card/role (Nature’s choice) and must play according to it. Before the game
    starts, player can plan a strategy according to all possible options for his/her
    types. That is, the player mentally something like “I will play fair if my role
    is that of the good person, but if I am one of the imposters, I will kill everyone!”.
    Or, “If I am one of the baddies, I will act kindly the good guys when I am on
    their side, and if I am good, I will launch an evil laugh to make the imposters
    think that I am one of them!”. After, being informed about the actual type, player
    will only only the relevant part of the strategy. Yet, the other players are in
    the dark about his/her type and must'
