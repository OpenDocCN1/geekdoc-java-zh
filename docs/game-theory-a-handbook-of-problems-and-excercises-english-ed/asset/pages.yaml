    (C), in which case 0 can either apologize (A) or accept the duel at high noon
    (D). If 0 apologizes, Y gets utility 10 and 0 gets utility -10. The outcome of
    the duel depends on whether Y is really a sharpshooter. If 0 has no chance of
    winning the duel. The payoffs are -100 for Y and 20 for 0. If 0 is just pretending
    to be a fast gun, then the duel is uncertain: the probability of winning is 0.5
    for both Y and 0, and whoever wins utility 20 and whoever loses -100. The probability
    of 0 being a sharpshooter is a common prior equal to p.


    +   1. Represent this Bayesian game with players Y and 0 (in this order) in extensive
    form.


    +   2. Represent this Bayesian game in normal form, with a type-agent representation
    of player 0.


    +   3. Find the Bayesian Nash equilibria of the game in pure strategies if p =
    0.2. Discuss what kind of equilibrium concept is appropriate for this game, and
    elaborate whether the pure BNEs satisfy it.


    # **Solution


    +   1. This is a screening game, since the player moving first has no type. It
    is basically an entry game: instead of a company risking its entrance in a market
    dominated by an incumbent, we have a young cowboy considering whether to challenge
    the outlaw to a duel.


    Note that there are also lotteries involved, to determine the outcome of the duel
    (of one, when 0 is a sharpshooter, degenerate). However, from the previous chapters
    we already know that it is sufficient to take the expected payoffs in due. Since
    Bayesian games always take expectations on Nature''s choices, this expectation
    will stack up with those of the lotteries, but by linearity of expectations, we
    can simply take a single expectation when computing the payoffs.


    The extensive form is the tree depicted in Figure 6.4. The root node is Nature''s
    move about 0 being a sharpshooter with p and 1 - p. Below, Y moves without distinguishing
    between the two nodes.


    +   2. Type-agent representation of player 0 decides a strategy as a pair of actions
    (sharpshooter - liar). For example, DA means does not duel if he is a sharpshooter,
    while it does if he is not. This leads to the following matrix.


    | | AA | AD | DA | DD |

    |---|---|---|---||}{

    | Y C | 10, -10 | 50-40, 30-40 | -110+10, 30-10 | -60-40, 50-40 |

    | Y S | -20, 0 | -20, 0 | -20, 0 | -20, 0 |'
