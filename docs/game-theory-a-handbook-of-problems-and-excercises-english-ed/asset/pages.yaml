    # Exercises


    **Exercise 5.1.** A guitarist (G) and a pianist (P) are playing together two songs
    (denoted as songs 1 and 2) on stage for a jam session. For both songs, they can
    decide to sing (S) or just play (J). They decide this independently and without
    consulting each other, for if of them stay silent (not singing, playing) a song,
    the song will not be great and the payoff for that song will be 0 for both. If
    only one of them, the song rendition is better. However, they prefer to be the
    non-singing musician as they concentrate on their solo. Thus, for that stage,
    whoever sings, gets utility 1, the one staying silent gets 7 for the guitarist,
    and 6 for the pianist. If they both sing the song (as a duet), the payoff is 5
    for both. The total payoff at the end is the sum of the two stages.


    +   1. Consider the stage game: write it in normal form and find its (pure strategies)
    Nash equilibria.


    +   2. Find out the subgame-perfect equilibrium where they play the same gameplay
    at every stage and gives that total highest utility overall.


    +   3. Is it possible to identify a subgame-perfect equilibrium where the first
    song plays out as a duet (they both sing)? If so, if not, prove why.


    # Solution


    +   1. The game is a repeated game with no discount, i.e. $\delta = 1$, which
    lasts for two stages. The normal form of the stage game is:


    | | S | J |

    |---|---|-|

    | S | 5, 5 | 1, 6 |

    | J | 7, 1 | 0, 0 |


    There are two Nash equilibria in pure strategies: $(S,J)$ and $(J,S)$, making
    the stage game an anti-coordination game.


    +   2. Trivial subgame-perfect equilibria in the two-stage game are found by repeating
    a Nash equilibrium twice. Thus, for example, they both play $(S,J)$ twice. However,
    this gives a total of 18, the best one is to play $(S,S)$ twice, which results
    in a total of 20.


    +   3. The guitarist can convince the pianist that he will play this strategy
    a Grim Trimmer: "Start by playing $S$. Then in the second round, he play $S$ (and
    you can play $J$) only if the first outcome was $(S,S)$. Otherwise." If this strategy
    is adopted by G, it is the best response for P to comply and play $S$ in the first
    round, and $J$ in the second (total utility of 11) as opposed to betraying in
    the first iteration (thus getting $6$ but getting 1 in the second stage game).'
