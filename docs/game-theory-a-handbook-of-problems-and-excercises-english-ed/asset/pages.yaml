    available to player 2 to react may or not be improved by observing player 1''s
    belief about type, and this should also be defined in the PBE found. In particular,
    it would be interesting to classify the PBE by separating or pooling, for a signaling
    game this can be interpreted as a characterization of a communication channel
    where a source sends a variable (the Bayesian type of 1) and a destination tree
    to infer from the received signal. Hence, a separating PBE corresponds to a perfect
    information channel, where the posteriori revelation fully reveals the original
    value sent by the source, whereas a pooling PBE is known to be useless in such
