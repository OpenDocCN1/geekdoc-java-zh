  md: '# 6. Bayesian games


    make all kinds of assumptions in their beliefs, e.g., this is a good character
    that is acting truthfully or an impostor that is pretending. Their beliefs revolve
    around both the type assigned to and the strategy chosen by others.


    Also, an important structural property of Bayesian games is that players react
    to Nature''s choices that are unknown to them (such as the other players'') by
    taking expectations, as they would for any other random lottery. Thus, all expectations
    are combined. In particular, Bayesian games give a very sensible interpretation
    to mixed strategies, for a given player it is clearly identical to another player
    with two available pure strategies A and B either (i) plays a mixed strategy where
    A and B are chosen with respective probabilities $\alpha$ and $1-\alpha$, or (ii)
    is a Bayesian player with different types $t_A$ and $t_B$, and the probabilities
    of these types can be estimated as $\alpha$ and $1-\alpha$, respectively, and
    the final-type representation of this player chooses A when the type is $t_A$
    and B when the type is $t_B$. Indeed, in both the response to the player''s choices
    will be planned by taking expectations over the probabilities $\alpha$ and $1-\alpha$.


    A common taxonomy of the strategies played by a Bayesian player, or, its type
    agent representation, distinguishes between pooling or separating strategies.
    This classification also applies to the resulting equilibria, if they involve
    these kinds. The term "pooling" refers to all types of a player choosing the same
    strategy, so in reality the other players cannot distinguish between the types,
    because they behave alike. From the perspective of an external player, the probabilities
    of each type of the Bayesian player can only be estimated through the prior, since
    no further information is gained when the move chosen is known. Conversely, "separating"
    indicates that all different types play a different action, which ultimately reveal
    the type. Of course this requires that there are at least as many actions as types.
    Intermediate cases are possible, which "semi-separating,"partially pooling," or
    simply "hybrid"—this is the case when a player has 3 types (ta, tb, and tc) and
    the first two types play the same strategy X, while the last type plays another
    Y. By extension, in a pooling Nash equilibrium, Bayesian players play the same
    action for all of their types, and in a separating NE they play different actions
    for each of their; once again, hybrid cases are possible, which includes all situations
    where (i) some players pool their strategies and others separate, or (ii) some
    pool a strategy that is neither pooling nor separating in their type-agent representation,
    or (iii) mixed strategies are also included, such as Bayesian players choosing
    a mixture between a pooling strategy and a separating one, both with non-zero
    probabilities.


    # 6.2 Relevant cases


    The general framework of Bayesian games can be specified to many different contexts.
    In particular, the solution concept used for each of these cases may change. The
    straightforward extension of Nash equilibrium to the Bayesian case'
