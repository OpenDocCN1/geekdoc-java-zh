  md: '# 4. Lotteries and Other Variations


    **Exercise 4.3.** Jean (J) and Kate (K) want to buy a design handbag of trendy
    brand, but it is difficult to find one in town. Only two places sell this handbag:
    a retail boutique $R$ downtown, or the store $S$ at the shopping mall. Both locations
    have just one piece of the handbag, $J$ and $K$ have to go to either of these
    places; moreover, if they go to the same place they have a 50/50 chance of buying
    the handbag (it depends on who arrives at the shop, which is entirely random).
    Their evaluation of the handbag is 600 for J and 450 for K. The official cost
    of the handbag is 250 euros, but shop $R$ is known for giving a handbag evaluation
    discount of 20% on all list prices. The utility for buying a handbag is evaluation
    minus cost; ending without the handbag gives utility 0.


    +   1. Write down the normal form of this game.

    2. Find all Nash equilibria of this game in pure strategies.

    3. Find all Nash equilibria of this game in mixed strategies.


    # Solution


    +   1. The set of players is $\{J, K\}$. Their strategy sets are $S_J = S_K =
    \{R, S\}$. When $J$ and $K$ choose the same pure strategy, their payoffs can be
    computed as expected utilities in a lottery. Actually, this results in just getting
    half of the utility that they got if they showed.

    As a note: Compare the result of the lottery with the discount on the price given
    by the retail boutique, which is instead an **actual percentage** and does not
    involve any lottery. In end, one just needs to take into account the expected
    utility of uncertain events by taking the probabilities as weights.

    In words, assume that two situations are compared where a customer (i) get a handbag
    of value $V$ and paying a certain price $P < V$ with a 50% chance (and going empty-handed
    in the other 50% of the cases); or (ii) obtain with certainty certain handbag
    of lower quality, whose value is $V/2$ but also half the price, i.e., $P/2$. Following
    the vNM-utility theory, as commonly done in Game Theory, the outcomes of (i) and
    (ii) are entirely equal (or perfect substitutes, in economic terms).

    Thus, the normal form of the game can be represented by the following bi-matrix:


    | | R | S |

    |---|---|-|

    | J | 200, 125 | 400, 200 |

    | S | 350, 250 | 175, 100 |


    +   2. The game has 4 possible outcomes in pure strategies. The Nash equilibria
    in pure strategies are: $(R, S)$ and $(S, R)$ (this is a coordination game).'
