    | C | 9 | -1 | -7 |

    | | 6 | 3 | 2 | 4 |

    | | 2 | 7 | 6 | -2 |

    | | ↓ | ↓ | ↓ |

    | | -9 | -1 | -7 ⇒ Maximin of D: -1


    The procedure to find the minimax is the dual of the maximin: one must look at
    columns instead of rows for C (and vice versa for D), finding first the maxima
    and then the minimum among those.'
