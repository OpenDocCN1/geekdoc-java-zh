    of F to G''s strategies are: C1 (to C), both $CC$ and $IC$ (to I).

    The Bayesian Nash equilibria in pure strategies are thus $(CC,I)$ and $(I,C)$.
    Note that I is weakly dominated for F. Since this is the only choice of F where
    the best response for G is to play C, G always plays I. Thus, we can say that,
    because of suspicion about F, G always plays unconsciously. But F can anticipate
    that, and if F is a real henchman, he plays C; while the undercover F is indifferent
    between $C$ and $I$, which gives him utility 0 anyways.


