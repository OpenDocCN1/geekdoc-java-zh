  md: 'Exercise 6.12. The Alpha company (A) launches a new gadget in a market dominated
    by Bad Guys Inc. (B). This gadget can be effective or useless: the probability
    of either is 0.5 and this is common knowledge. However, company A is actually
    aware whether the gadget is effective or not; further, they can choose to induce
    a high promotional campaign (C) or to keep a low profile (L). Choosing C costs
    20 to A and has the effect to reveal to everyone (including the competitor B)
    whether the gadget is effective or not, while L keeps this hidden. After this
    decision A it is now B''s turn to decide whether to fight (F) or yield (Y) this
    game. The payoff is computed as follows. If B yields, companies A and B have respective
    revenues of 80 and 0 if the gadget is effective; if the gadget is useless, these
    values are swapped. The utility of B is its revenue, while A gets the revenue
    minus the possible cost of the campaign, if they have induced it.


    +   1. Give the extensive form representation of this game.

    2. Give the normal form representation of this game. Clearly state what you consider
    as A''s and B''s strategies.

    3. Find the perfect Bayesian equilibria, classify whether they are pooling, separating,
    or hybrid, and give their systems of beliefs.


    # Solution


    +   1. This is a Bayesian game, most specifically a signaling game, where A is
    a Bayesian player, and the effectiveness of the gadget is A''s type. The extensive
    form is the tree depicted in Figure 6.14.


    ![](img/adcae123bfc4ba205d992d916e340a6b_147_0.png)


    Figure 6.14: Extensive form of the Bayesian game.


    Nature moves first, revealing its own type to player A. A can then move and decide
    whether to play C or L. The former is revealing the type to B too, while the latter
    is not, so the two nodes below are joined by a dashed line.'
