  md: 'boils down to computing the minimum $\delta$ that establishes cooperation,
    which implies that the discount factor must fall into an interval $(\delta_{\min},
    1]$ to have cooperation.


    Beyond the standard case of the simple choice between cooperation and defection,
    more complex cases can be created whenever there were punishments available than
    eternal defection. Indeed, eternal defection may seem scary enough, but there
    may be something like an immediate punishment and also defection. This leads to
    an even lower $\delta$ to establish cooperation. To better understand why, consider
    the example that once again� ethics. A social cooperation rule is generally established
    by threatening punishment. The more immediate, or the stronger, the cooperation.
    If you want a society to behave well, for example, not cause global warming through
    environmental pollution, you can claim that this will lead to the disruption of
    the planet forever. Unfortunately, this eternal destruction of the planet does
    not seem very menacing for boomers whose life expectancy is low, and they do not
    care much if they are going to leave a polluted Earth to their grandchildren.
    So, establishing an extra punishment in addition to that, like sending them to
    jail or causing them to pay a lot of money may be more effective.


    The reasons around can actually be extended also in the direction of not only
    obtaining just cooperation but a more involved outcome thanks to Friedman''s theorem*.
    Simply put, the theorem states that a scenario where players interact for infinitely
    many rounds can be driven to any linear combination of strategies that satisfies
    a certain condition if the discount factor is high enough. The condition is naturally
    that the resulting payoffs of all players must be better in a Pareto sense (i.e.,
    element-wise) than the payoffs at the NE of the stage game. Clearly, it is impossible
    to convince a player to stick to a strategy that awaits an eternally worse payoff
    than the one at the NE: at this point, the player would deviate and play the NE
    forever. However, any linear combination of moves (even over subsequent rounds)
    that leads to an expected payoff higher than the NE for all players is sustainable
    as long as $\delta$ is high enough. The theorem essentially generalizes the reasoning
    of the grim trigger mentioned above to the case where the objective is not to
    play the basic cooperation, but possibly a mixed strategy and/or different strategies
    over multiple rounds.'
