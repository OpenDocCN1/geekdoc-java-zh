  md: '# 5.2 Finite horizon


    The solution approach for finite horizon is analogous to backward induction. One
    must consider the last stage, since in that case there is no impact on future
    decisions, which are non-existent, and therefore the players simply choose an
    NE (i.e., they very selfishly act like "there is no tomorrow". Then, this conclusion
    is propagated back to the penultimate stage and so on.


    This leads to different conclusions about the nature of NEs in the stage games.
    If the last stage has a single NE, then the rational players are fully aware of
    that and they all know that what they will be going to play in the end. Thus,
    the last stage can be removed from the analysis by "merging" with the upper layers
    and the game become shorter.


    In the particular case that all stage games have a single NE, as is the case for
    a repeated game of a static game with a single NE, the conclusion is immediate,
    but not very interesting. The only rational outcome is that this single NE is
    played at every stage, and there is no strategic extent in the unfolding of time,
    beyond what already given by a one-shot game. Notably, the repetition of the NE
    at every stage will also lead to an SPE, since NE is played in every stage. But
    just in mind that an SPE will require more details to be specified, such as what
    happens off the equilibrium path – this is immediate to determine, what is is
    when the only NE of the stage game is played over too, it is just that it is easy
    to mention it.


    If there are multiple NEs available, and yet this implies that some non-NE outcomes
    of the stage game can be played. Naturally, this cannot happen for the last stage,
    which is bound to be played as an NE, but the choice among multiple NEs in the
    last stage may create some "carrot and stick" options where players create a collaborative
    outcome in the earlier rounds. This happens by defining one NE of the last round
    as the ultimate reward (carrot) and a bad NE of the last round as punishment (stick)
    and anticipating that cooperation in the earlier stages will be rewarded, deflection
    will be punished.


    For this approach to work, some conditions are required. First, the difference
    between reward and punishment must be high enough. And at the same time, the discount
    factor, if present, ought to be high to make the punishment credible. This is
    particularly evident if δ is so since the players will care little about the future;
    in particular, if the interpretation of a low δ is that they are likely to exit
    the system, they will consider this as their last stage, so there is no way to
    convince them to play something else than an NE.


    Overall, the conditions for this approach to work are once again connected with
    the concept of credible threats. Since there is actually no communication and
    the interaction of punishment and/or reward only happens in the players'' heads,
    they can anticipate that a possible behavior is punished if they do not cooperate,
    but if this threat is not credible, they will dismiss it, so the dynamic outcome
    will not result in an SPE. Thus, the request to find an SPE in such cases translates
    into looking on whether these conditions support a'
