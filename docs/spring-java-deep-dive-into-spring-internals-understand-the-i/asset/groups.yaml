    }\n```\n\n在这里，RootApplicationContextConfig 类代表了根应用上下文的配置。它扫描 com.example 包以查找组件并注册到根上下文中。\n\
    \n```java\n@Configuration\n@ComponentScan(basePackages = \"com.example.controllers\"\
    )\npublic class WebApplicationContextConfig {\n    // Web 应用上下文的配置\n}\n```\n\n\
    同样，WebApplicationContextConfig 类代表了 Web 应用上下文的配置。它扫描 com.example.controllers 包以查找控制器组件并注册到\
    \ Web 上下文中。\n\n在这种场景下，RootApplicationContextConfig充当父上下文，而 WebApplicationContextConfig充当子上下文。子上下文从父上下文继承\
    \ Bean 定义和配置，使得子上下文中的组件可以访问共享资源。\n\nApplicationContext 层次结构在资源管理和隔离方面也起着关键作用。每个上下文都可以拥有自己的资源集，如属性文件、数据库连接和\
    \ JNDI 资源，提供了封装并防止了应用程序不同部分之间的资源冲突。\n\n此外，ApplicationContext 层次结构促进了灵活的配置管理。父上下文可以定义通用配置和基础设施\
    \ Bean，而子上下文可以根据需要覆盖或扩展这些配置，对应用程序行为进行精确控制。\n\n```java\n@Autowired\nprivate ApplicationContext\
    \ parentContext;\n\n@Bean\npublic MyService myService() {\n    // 从父上下文访问 Bean\n\
