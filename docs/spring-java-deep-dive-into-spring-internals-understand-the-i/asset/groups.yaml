- md: "\nThis scope is useful for beans that have stateful behavior or require a fresh\
    \ instance on each invocation, such as session-specific beans in web applications.\n\
    \n## 3. Request Scope:\n\n- Beans scoped as request are created once per HTTP\
    \ request and are destroyed at the end of the request.\n- This scope is commonly\
    \ used for beans that hold request-specific data, such as form controllers or\
    \ request handlers in web applications.\n\n## 4. Session Scope:\n\n- Session-scoped\
    \ beans are created once per HTTP session and are destroyed when the session expires\
    \ or is invalidated.\n- This scope is ideal for beans that store session-specific\
    \ data, such as user preferences or shopping cart items.\n\n## 5. Application\
    \ Scope:\n\n- Beans with application scope are created once for the entire lifecycle\
    \ of the web application and are shared across all sessions and requests.\n- This\
    \ scope is suitable for beans that maintain global state or configuration settings\
    \ that remain constant throughout the application's runtime.\n\n## 6. WebSocket\
    \ Scope:\n\n- Introduced in Spring 4.0, WebSocket scope allows beans to be scoped\
    \ to a WebSocket session.\n- Beans with WebSocket scope are created once per WebSocket\
    \ session and are destroyed when the session closes.\n\n## 7. Custom Scopes:\n\
    \n- Spring also provides the flexibility to define custom scopes tailored to specific\
    \ application requirements.\n- Developers can implement custom scope interfaces\
    \ and register them with the application context to create scoped beans with custom\
    \ lifecycle semantics.\n\nUnderstanding and selecting the appropriate bean scope\
    \ is critical for designing applications that are efficient, scalable, and maintainable.\
    \ In scenarios where beans require shared state or have expensive initialization\
    \ logic, singleton scope may be preferred to minimize resource usage and improve\
    \ performance. Conversely, for beans with transient state or session-specific\
    \ data, prototype or session scope may be more suitable to ensure data isolation\
    \ and prevent unintended side effects.\n\nConsider the following example of defining\
    \ a bean with request scope in a Spring MVC controller:\n\n```java\nimport org.springframework.context.annotation.Scope;\n\
    import org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.GetMapping;\n\
    import org.springframework.web.bind.annotation.ResponseBody;\n\n@Controller\n\
    @Scope(\"request\")\npublic class MyController {\n    @GetMapping(\"/hello\")\n\
    \    @ResponseBody\n    public String sayHello() {\n        return \"Hello, World\"\
    ;\n    }\n}\n```\n\nIn this example\n\nIn summary, \"Understanding Advanced Bean\
    \ Scopes\" equips developers with the knowledge and expertise to leverage Spring’s\
    \ rich array of bean scopes effectively. By selecting the appropriate scope for\
    \ each bean, developers can optimize resource usage, manage state effectively,\
    \ and design applications that are robust and scalable. Whether it's ensuring\
    \ data isolation in web applications or managing shared resources in enterprise\
    \ systems, mastering bean scopes is essential for building high-quality, maintainable\
    \ software with the Spring Framework.\n\n# Chapter Two\n\n# Spring Application\
    \ Context Internals\n\n# Uncovering the Complexity of ApplicationContext Hierarchy\n\
    \n\"Exploring the Intricacies of ApplicationContext Hierarchy\" delves into the\
    \ detailed structure and functions of ApplicationContext hierarchy within the\
    \ Spring Framework. ApplicationContext serves as the core component responsible\
    \ for managing beans, offering configuration, and supporting various functionalities\
    \ like dependency injection, event handling, and resource management. Understanding\
    \ the hierarchy of ApplicationContext instances is essential for crafting scalable\
    \ and modular Spring applications.\n\nAt its essence, ApplicationContext represents\
    \ the heart of the Spring Inversion of Control (IoC) container. This container\
    \ handles the instantiation, configuration, and management of beans within a Spring\
    \ application. However, in more complex scenarios, multiple ApplicationContext\
    \ instances may be organized hierarchically to enhance modularity, encapsulation,\
    \ and resource management.\n\nThe hierarchy of ApplicationContext instances facilitates\
    \ the establishment of parent-child relationships. In such relationships, child\
    \ contexts inherit bean definitions and configurations from their parent contexts.\
    \ This hierarchical arrangement enables the sharing of common beans and resources\
    \ across various contexts, while still allowing each context to define its unique\
    \ set of beans and configurations.\n\nOne of the key advantages of ApplicationContext\
    \ hierarchy lies in its ability to segregate application components into logical\
    \ units, with each having its distinct context. For instance, in a web application,\
    \ a root context may exist at the application level, while multiple child contexts\
    \ correspond to different modules or layers, such as controllers, services, and\
    \ repositories.\n\nConsider the following example of ApplicationContext hierarchy\
    \ in a web application:\n\n```java\n@Configuration\n@ComponentScan(basePackages\
    \ = \"com.example\")\npublic class RootApplicationContextConfig {\n    // Configuration\
    \ for the root application context\n}\n```\n\nHere, the RootApplicationContextConfig\
    \ class represents the configuration for the root application context. It scans\
    \ the com.example package for components to be registered within the root context.\n\
    \n```java\n@Configuration\n@ComponentScan(basePackages = \"com.example.controllers\"\
    )\npublic class WebApplicationContextConfig {\n    // Configuration for the web\
    \ application context\n}\n```\n\nSimilarly, the WebApplicationContextConfig class\
    \ represents the configuration for the web application context. It scans the com.example.controllers\
