    \ 层次结构的关键优势之一是能够将应用程序组件分离到逻辑单元中，每个单元都有其独立的上下文。例如，在 Web 应用程序中，根上下文（root context）可能存在于应用级，而多个子上下文对应于不同的模块或层，例如控制器、服务层和仓库层。\n\
    \n考虑以下 Web 应用程序中 ApplicationContext 层次结构的示例：\n\n```java\n@Configuration\n@ComponentScan(basePackages\
