  raw: '*   Interpreting and using the results of models. Often models will be used
    to process other data sets to automatically label data (as we do in this chapter
    with text data from Wikipedia) or making predictions from new sources of time
    series numerical data.


    *   Deploy training models as embedded parts of a larger system. This is an optional
    step - sometimes it is sufficient to use a model to understand a problem well
    enough to know how to solve it. Usually, however, a model will be used repeatadly,
    often automatically, as part of normal data processing and decision workflows.
    I will take some care in this chapter to indicate how to reuse models embedded
    in your Java applications.


    In the examples in this book I have supplied test data with the example programs.
    Please keep in mind that although I have listed these steps for data mining and
    ML model building as a sequence of steps, in practice this is a very iterative
    process. Data collection and cleaning might be reworked after seeing preliminary
    results of building models using different algorithms. We might iteratively tune
    model parameters and also improve models by adding or removing the features in
    data that are used to build models.


    What do I mean by “features” of data? For text data features can be: words in
    text, collections of adjacent words in text (ngrams), structure of text (e.g.,
    taking advantage of HTML or other markup), punctuation, etc. For numeric data
    features might be minimum and maximum of data points in a sequence, features in
    frequency space (calculated by Fast Forier Transfroms (FFTs), sometimes as Power
    Spectral Density (PSD) which is a FFT with phase information in the data discarded),
    etc. Cleaning data means different things for different types of data. In cleaning
    text data we might segment text into sentences, perform word stemming (i.e., map
    words like “banking” or “banks” to their stem of root “bank”), sometimes we might
    want to convert all text to lower case, etc. For numerical data we might have
    to scale data attributes to a specific numeric range - we will do this later in
    this chapter when using the University of Wisconsin cancer data sets.


    The previous seven steps that I outline are my view of the process of discovering
    information sources, processing the data, and producing actionable knowledge from
    data. Other acronyms that you are likely to run across is Knowledge Discovery
    in Data (KDD) and the CCC Big Data Pipeline which both use steps similar to those
    that I have just outlined.


    There are, broadly speaking, four types of ML models:


    *   Regression - predicts a numerical value. Inputs are numeric values.


    *   Classification - predicts yes or no. Inputs are numeric values.


    *   Clustering - partition a set of data items into disjoint sets. Data items
    might be text documents, numerical data sets from sensor readings, sets of structured
    data that might include text and numbers. Inputs must be converted to numeric
    values.


    *   Recommendation - decision to recommend an object based on a user’s previous
    actions and/or by matching a user to other similar users to use other users’ actions.


    You will see later when dealing with text that we need to convert words to numbers
    (each word is assigned a unique numeric ID). A document is represented by a sparse
    vector that has a non-empty element for each unique word index. Further, we can
    divide machine learning problems into two general types:


    *   Supervised learning - input features used for training are labeled with the
    desired prediction. The example of supervised learning we will look at is building
    a regresion model using cancer symptom data to predict the malignancy vs. benign
    given a new input feature set.


    *   Unsupervised learning - input features are not labeled. Examples of unsupervised
    learning that we will look at are: K-Means similar Wikipedia document clustering
    and using word2vec to find related words in documents.


    My goal in this chapter is to introduce you to practical techniques using Spark
    and machine learning algorithms. After you have worked through the material I
    recommend reading through the Spark documentation to see a wider variety of available
    models to use. Also consider taking Andrew Ng’s excellent [Machine Learning class](https://www.coursera.org/learn/machine-learning).


    **Scaling** **Machine** **Learning**


    While the ability to scale data mining and ML operations for very large data sets
    is sometimes important, for development and for working through the examples in
    this chapter you do not need to set up a cluster of servers to run Spark. We will
    use Spark in developer mode and you can run the examples on your laptop. It would
    be best if your laptop has at least 2 gigabytes of RAM to run the ML examples.
    The important thing to remember is that the techniques that you learn in this
    chapter can be scaled to very large data sets as needed without modifying your
    application source code.


    The Apache Spark project originated at the University of California at Berkeley.
    Spark has client support for Java, Scala, and Python. The examples in this chapter
    will all be in Java. If you are a Scala developer, after working through through
    the examples you might want to take a look at the Scala Spark documentation since
    Spark is written in Scala and Scala has the best client support. The Python Spark
    and MLlib APIs are also very nice to use so if you are a Python developer you
    should check out this Python support.


    Spark is an evolutionary step forward from using map reduce systems like Hadoop
    or Google’s Map Reduce. In following through the examples in this chapter you
    will likely think that you could accomplish the same effect with less code and
    runtime overhead. For dealing with small amounts of data that is certainly true
    but, just like using Hadoop, a little more verbosity in the code gives you the
    ability to scale your applications over large data sets. We put up with extra
    complexity for scalability. Spark has utility classes for reading and transforming
    data that make the example programs simpler than writing code yourself for importing
    data.


    I suggest that you download the source code for the Spark 1.5.0 distribution from
    the [Apache Spark download page](https://spark.apache.org/downloads.html) since
    there are many example programs that you can use for ideas and for reference.
    The Java client examples in the Spark machine learning library MLlib can be found
    in the directory:


    ```

    spark-1.5.0/examples/src/main/java/org/apache/spark/examples/MLlib/

    ```


    Where the directory **spark-1.5.0** was created when you downloaded Spark version
    1.5.0.


    These examples use provided data files that provide numerical data, each line
    specifies a local Spark vector data type. The first K-Means clustering example
    in this chapter is derived from a MLlib example included with the Spark distribution.
    The second K-Means example that clusters Wikipedia articles is quite a bit different
    because we need to write new code to convert text into numeric feature vectors.
    I provide sample text that I manually selected from Wikipedia articles.


    We will start this chapter by showing you how to set up Spark and MLlib on your
    laptop and then look at a simple “Hello World” introductory type program for generating
    word counts from input text. We will then implement logistic regression and also
    take a brief look at the JavaKMeans example program from the Spark MLlib examples
    and use it to understand the requirement for reducing data to a set of numeric
    feature vectors. We will then develop examples using Wikipedia data and this will
    require writing custom converters for plain text to numeric feature vectors.


    ### Setting Up Spark On Your Laptop


    Assuming that you have cloned the github project for this book, the Spark examples
    are in the sub-directory machine_learning_spark. The maven pom.xml file contains
    the Spark dependencies. You can install these dependencies using:


    ```

    mvn clean install

    ```'
