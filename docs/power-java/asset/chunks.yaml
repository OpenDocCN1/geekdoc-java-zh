  trans: "\n我倾向于将我编写的程序输出 N-Triple 格式的文件，以 RDF 形式保存数据。如果我需要读取甚至手动编辑这些文件，我通常会使用 `Sesame`\
    \ 将 N-Triple 文件转换为 `N3`。当我们看一个示例时，你就会明白为什么我更偏于 `N3` 格式了：\n\n```\n1 @prefix kb:\
    \  <http://knowledgebooks.com/ontology#> .\n2 <http://news.com/201234 /> kb:containsCountry\
    \ \"China\"  .\n```\n\n在这里，我们看到为我的公司 KnowledgeBooks.com 的本体使用了命名空间缩写前 `kb:`。RDF\
    \ 语句中的第一个项（主语）是一篇新闻文章的 URI。第二个项（谓语）是 `kb:` 命名空间下的 `containsCountry`。语句中的最后一项（宾语）是一个字符串字面量\
    \ `China. `。我会用英文这样描述这条 RDF 语句：“URI 为 `http://news.com/201234` 的新闻文章提到了中国国家。”\n\
    \n这是一个非常简单的 `N3` 示例，我们将扩展它来展示 `N3` 标记的其他功能。另一个例子是，假设这篇新闻也提到了美国。我们不需要像下面这样添加整个新语句：\n\
    \n```\n1     @prefix kb:  <http://knowledgebooks.com/ontology#> .\n2     <http://news.com/201234\
    \ /> kb:containsCountry \"China\"  .\n3     <http://news.com/201234 /> kb:containsCountry\
    \ \"USA\"  .\n```\n\n我们可以使用 `N3` 语法将它们合并。`N3` 允许我们合并多个具有相同主语且可选地具有相同谓语的 RDF 语句：\n\
    \n```\n1     @prefix kb:  <http://knowledgebooks.com/ontology#> .\n2     <http://news.com/201234\
    \ /> kb:containsCountry \"China\" ,\n3                                       \
    \            \"USA\" .\n```\n\n我们还可以添加使用相同主语的额外谓语：\n\n```\n 1     @prefix kb:\
    \  <http://knowledgebooks.com/ontology#> .\n 2 \n3     <http://news.com/201234\
    \ /> kb:containsCountry \"China\" ,\n 4                                      \
    \             \"USA\" .\n 5         kb:containsOrganization \"United Nations\"\
    \ ;\n 6         kb:containsPerson \"Ban Ki-moon\" , \"Gordon Brown\" ,\n 7   \
    \                        \"Hu Jintao\" , \"George W. Bush\" ,, 8             \
    \              \"Pervez Musharraf\" ,\n 9                           \"Vladimir\
    \ Putin\" , \n10                           \"Mahmoud Ahmadinejad\" .\n```\n\n\
    这一单一 `N3` 语句代表了十个独立的 RDF 三元组。定义相同主语和谓语的三元组部分，对象用逗号分隔并以句号结束。请注意，无论我们使用哪种 RDF 存储系统（我们将使用\
    \ `Sesame`），以 `XML`、`N-Triple` 或 `N3` 格式文件加载 RDF 并没有区别：内部主语、谓语和宾语三元组的存储和使用方式是相同的。\n\
    \n我向你们承诺过 RDF 数据存储的数据很容易扩展。作为一个例子，假设我们编写了能够读取在线新闻文章并创建捕捉文章某些语义的 RDF 数据的软件。如果我们扩展程序以识别文章的发布日期，我们只需重新处理文章，并为每篇文章使用如下形式向我们的\
    \ RDF 数据存储中添加三元组：\n\n```\n1     <http://news.com/201234 /> kb:datePublished\n\
    2                                \"2008-05-11\" .\n```\n\n此外，取决于应用程序，并不是所有的新闻文章都有日期，这通常是可以接受的。\n\
    \n`SPARQL` 是一种用于查询 RDF 数据存储的查询语言。虽然 `SPARQL` 看起来看起来像 `SQL`，但它们存在一些重要的区别，例如对 `RDFS`\
    \ 和 `OWL` 推理的支持。本节将介绍 `SPARQL` 的基础知识。\n\n在本节的讨论中我们将以下示例 RDF 数据：\n\n"
