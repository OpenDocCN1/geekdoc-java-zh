    \ \\\n         com.markwatson.iot.DiscoverServices\n```\n\nWhile it is often useful\
    \ to find all local services, I expect that for your own projects you will be\
    \ writing both service and client applications that cooperate on your local network.\
    \ In this case you know the service names and can simply look them up as in the\
    \ example in this section.\n\n### User Data Protocol Network Programming\n\nYou\
    \ are most likely familiar with using TPC/IP in network programming. TCP/IP provides\
    \ some guarantees that the sender is notified on failure to deliver data to a\
    \ receiving program. User Data Protocol (UDP) makes no such guarantees for notification\
    \ of message delivery and is very much more efficient than TCP/IP. On local area\
    \ networks data delivery is more robust to failure compared to the Internet and\
    \ since we are programming for devices on a local network it makes some sense\
    \ to use a lower level and more efficient protocol.\n\n#### Example UDP Server\n\
    \nThe example program in this section implements a simple service that listens\
    \ on port 9005 for UDP packets that are client requests. The UDP packets received\
    \ from clients are assumed to be text and this example slightly modifies the text\
    \ and returns it to the client.\n\n```\n 1 package com.markwatson.iot;\n 2 \n\
    \ 3 import java.io.IOException;\n 4 import java.net.*;\n 5 \n 6 public class UDPServer\
    \ {\n 7   final static int PACKETSIZE = 256;\n 8   final static int PORT = 9005;\n\
    \ 9 \n10   public static void main(String args[]) throws IOException {\n11   \
    \  DatagramSocket socket = new DatagramSocket(PORT);\n12     while (true) {\n\
    13       DatagramPacket packet =\n14          new DatagramPacket(new byte[PACKETSIZE],\
    \ PACKETSIZE);\n15       socket.receive(packet);\n16       System.out.println(\"\
    message from client: address: \" + packet.getAddress() +\n17           \" port:\
    \ \" + packet.getPort() + \" data: \" +\n18           new String(packet.getData()));\n\
    19       // change message content before sending it back to the client:\n20 \
    \      packet.setData((\"from server - \" + new String(packet.getData())).getBytes(\\\
    \n21 ));\n22       socket.send(packet);\n23     }\n24   }\n25 }\n```\n\nIn line\
    \ 11 we create a new DatagramSocket listener on port 9005\\. On lines 13 and 14\
    \ we create a new empty DatagramPacket that is used in line 16 to hold data from\
    \ a client. The example code prints out packet data, changes the text from the\
    \ client, and returns the modified text to the client.\n\nRunning this example\
    \ produces the following output (edited to fit the page width):\n\n```\n1 > java\
    \ -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n2         com.markwatson.iot.UDPServer\n\
    3 message from client: address: /127.0.0.1 port: 63300\n4                    \
    \  data: Hello Server1431540275433\n```\n\nNote that you must also run the example\
    \ program from the next section to get the output in lines 4 and 5\\. This is\
    \ why I listed the commands at the beginning of the chapter for running all of\
    \ the examples: I thought that if you ran all of the examples according to these\
    \ earlier directions, the example programs would be easier to understand.\n\n\
    #### Example UDP Client\n\nThe example program in this section implements a simple\
    \ client for the UDP server in the last section. A sample text string is sent\
    \ to the server and the response is printed."
