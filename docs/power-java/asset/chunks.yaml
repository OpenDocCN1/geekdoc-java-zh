    \ Double>> valuesAndPreds = testing.map( // ... wait, the logic continues in the\
    \ block\n```\n\n（注：提示中提供的代码块在中间被截断/中断了，但我根据提供的文本流保持了其结构）*\n\n一旦数据被读取并转换为数值特征，我们接下来的工作是将输入数据随机划分为两个单独的集合：一个用于训练，另一个用于测试我们的模型。这种数据划分在第\
    \ 47 行和第 48 行完成。第 49 行复制了训练数据，并请求当前上下文尝试将这些数据缓存。在第 50 行，我们复制了测试数据，但没有指定测试数据需要缓存。\n\
    \n还有两部分代码需要讨论。在第 53 行到 75 行中，我正在训练模型、将模型保存到磁盘，并在模型仍在内存中对其进行测试。在第 77 行到 89 行中，我正在从磁盘重新加载保存的模型，并展示如何使用两个测试向量使用它。这最后部分代码旨在演示如何在\
    \ Java 中嵌入并使用模型。\n\n以下三行代码是此示例程序的输出。第一行输出表示训练模型的误差较低。最后两行显示了从磁盘重新加载模型并使用它评估两个新特征向量的输出：\n\
    \n```\nTest Data Mean Squared Error = 0.050140726106582885\nShould be malignant\
    \ (close to 1.0): 1.1093117757012294\nShould be benign (close to 0.0): 0.29575663511929096\n\
    ```\n\n此示例展示了一种常见的模式：从磁盘读取训练数据、对其缩放并构建保存到磁盘的模型以供以后使用。该程序几乎可以原样用于新类型的训练数据。你只需要修改第\
    \ 27 行到 44 行。\n\n### 使用 Wisconsin Database 的 SVM 分类示例\n\n本节的示例与上一节非常相似。唯一的区别是用\
    \ MLlib 类 `SvmClassifier` 代替我们在上一节使用的 `LogisticRegression` 类，并将训练迭代次数设置为 500。我们在本节中使用了相同的威斯康星大学癌症数据集——有关该数据集的讨论请参考前节。\n\
