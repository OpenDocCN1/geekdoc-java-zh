- fmt: "\nWe are used to the physical constraints of using computing devices. When\
    \ I was in high school in the mid 1960s and took a programming class at a local\
    \ college I had to make a pilgrimage to the computer center, wait for my turn\
    \ to use a keypunch machine, walk over to submit my punch cards, and stand around\
    \ and wait and eventually get a printout and my punch cards returned to me. Later,\
    \ interactive terminals allowed me to work in a more comfortable physical environment.\
    \ Jumping ahead almost fifty years I can now use my smartphone to `SSH` into my\
    \ servers, watch movies, and even use a `Java` IDE. As I write this book, perhaps\
    \ 70% of Internet use is done on mobile devices.\n\nIoT devices complete this\
    \ process of integrating computing devices more into our life with fewer physical\
    \ constraints on us. Our future will include clothing, small personal items like\
    \ pens, cars, furniture, etc., all linked in a private and secure data fabric.\
    \ Unless you are creating content (e.g., writing software, editing pictures and\
    \ video, or performing a knowledge engineering task) it is likely that you won’t\
    \ think too much about the devices that you interact with and in general will\
    \ prefer mobile devices. This is a similar experience to driving a car where tasks\
    \ like braking, steering, etc. are “automatic” and don’t require much conscious\
    \ thought.\n\nWe are physical creatures. Many of us gesture with our hands while\
    \ talking, move things around on our desk while we are thinking, and generally\
    \ use our physical environment. Amazing products will combine physical objects\
    \ and computing and information management.\n\nBefore diving into techniques for\
    \ communication between IoT devices, we will digress briefly in the next section\
    \ to see how to run the sample programs for this chapter.\n\n### Running the example\
    \ programs\n\nIf you want to try running the example programs let’s set that up\
    \ before going through the network programming techniques and code later in this\
    \ chapter. Assuming that you have cloned the `github` repository for the examples\
    \ in this book, go to the subdirectory `internet_of_things`, open two shell windows\
    \ and use the following commands to run the examples in the same order that they\
    \ are presented (these commands are in the `README.md` file so you can copy and\
    \ paste them). These commands have been split to multiple lines to fit the page\
    \ width of this book:\n\n#### Build\n\n```\n1     mvn clean compile package assembly:single\n\
    ```\n\n#### Run service discovery\n\n```\n1     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n2 \t     com.markwatson.iot.CreateTestService\n3     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ /\n4 \t     com.markwatson.iot.LookForTestService\n```\n\n#### Run UDP experiments:\n\
    \n```\n 1     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n\
    \ 2 \t     com.markwatson.iot.UDPServer\n 3     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n 4 \t     com.markwatson.iot.UDPClient\n 5 \n 6     # Multicast experiments:\n\
    \ 7     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n 8 \t \
    \    com.markwatson.iot.MulticastServer\n 9     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n10 \t     com.markwatson.iot.MulticastClient\n```\n\nLine 2 compiles and\
    \ builds the examples. For each of the example programs you will run two programs\
    \ on the command line. For example for the service discovery example on lines\
    \ 5 and 6 (which would be entered on one line in a terminal window) we start a\
    \ test service and lines 7 and 8 run the service test client. Similarly, lines\
    \ 10 through 20 show how to run the services and test clients for the UDP experiments\
    \ and the multicast experiments. I repeat these instructions with each example\
    \ as we look at the code but I thought that you might enjoy running all three\
    \ examples before we look at the implementations of the examples later in this\
    \ chapter.\n\nIn each example, run the two example programs in different shell\
    \ windows. For more fun, run the examples using different laptops or any device\
    \ that can run `Java` code.\n\nThe following figure shows the project for this\
    \ chapter in the Community Edition of `IntelliJ`:\n\n![IntelliJ project view for\
    \ the examples in this chapter](images/00002.jpeg)\n\nIntelliJ project view for\
    \ the examples in this chapter\n\nThis chapter starts with a design pattern that\
    \ you might use for writing IoT applications. Then the following three major sections\
    \ show you how to use directory lookups, use User Data Protocol (`UDP`) instead\
    \ of `TCP/IP`, and then multi-cast/broadcast.\n\nThe material in this chapter\
    \ is fairly elementary but it seems like many developers don’t have experience\
    \ with lower level network programming techniques. My hope is that you will understand\
    \ when you might want to use a lower level protocol like `UDP` instead of `TCP`\
    \ and when you might find directory lookups useful in your applcations.\n\n###\
    \ Design Pattern\n\nThe pattern that the examples in the following sections support\
    \ is simple (in principle): small devices register services that they offer and\
    \ look for services offered in other devices. Devices will use User Data Protocol\
    \ (`UDP`) and multi-cast to communicate for using and providing services. Once\
    \ a consumer has discovered a service privider (host, IP address, port, and service\
    \ types) a consumer can also open a direct `TCP/IP` socket connection to a provider\
    \ to use a newly discovered service.\n\nThe following diagram shows several IoT\
    \ use cases:\n\n*   A consumer uses the `JmDNS` library to broadcast on the local\
    \ network a request for services provided.\n*   The `JmDNS` library on the provider\
    \ side hears a service description request and broadcasts available services.\n\
    *   The `JmDNS` library on the consumer side listens for the broadcast from the\
    \ provider.\n*   Using a service description, the consumer makes a direct socket\
    \ connection to the provider.\n*   The provider periodically broadcasts updated\
    \ data for its service.\n*   The consumer listens for broadcasts of updated data\
    \ and uses new data as it is available.\n\n![Consumer and Provider Use Cases](images/00003.gif)\n\
    \nConsumer and Provider Use Cases\n\nThis figure shows a few use cases. You can\
    \ use these interaction patterns of interactions between IoT devices using application\
    \ specific software you write.\n\n### Directory Lookups\n\nIn the next two sub-sections\
    \ we will be using the JavaJmDNS` library that supports a local multi-cast Domain\
    \ Name Service (`DNS`) and supports service discovery. `JmDNS` is compatible with\
    \ Apple’s Bonjour discovery service that is also available for installation on\
    \ Microsoft `Windows`.\n\n`JmDNS` has been successfully used in Android apps if\
    \ you change the defaults on your phone to accept multi-cast (since Android version\
    \ 4.1 [Network Service Discovery (NDS)](https://developer.android.com/training/connect-devices-wirelessly/nsd)).\
    \ Android development is outside the scope of this chapter and I refer you to\
    \ the `NDS` documentation and example programs if you are interested. I tried\
    \ the example Android `NsdChat` application on my Galaxy S III (Android 4.4.2)\
    \ and Note 4 (Android 5.0.1) and this example app would be a good place for you\
    \ to start if you are interested in using Android apps to experiment with IoT\
    \ development.\n\n#### Create and Register a Service\n\nThe example program in\
    \ this section registers a service using the `JmsDNS` Java library that listens\
    \ on port `1234`. In the next section we look at another example program that\
    \ connects to this service.\n"
  raw: "We are used to the physical constraints of using computing devices. When I\
    \ was in high school in the mid 1960s and took a programming class at a local\
    \ college I had to make a pilgrimage to the computer center, wait for my turn\
    \ to use a keypunch machine, walk over to submit my punch cards, and stand around\
    \ and wait and eventually get a printout and my punch cards returned to me. Later,\
    \ interactive terminals allowed me to work in a more comfortable physical environment.\
    \ Jumping ahead almost fifty years I can now use my smartphone to SSH into my\
    \ servers, watch movies, and even use a Java IDE. As I write this book, perhaps\
    \ 70% of Internet use is done on mobile devices.\n\nIoT devices complete this\
    \ process of integrating computing devices more into our life with fewer physical\
    \ constraints on us. Our future will include clothing, small personal items like\
    \ pens, cars, furniture, etc., all linked in a private and secure data fabric.\
    \ Unless you are creating content (e.g., writing software, editing pictures and\
    \ video, or performing a knowledge engineering task) it is likely that you won’t\
    \ think too much about the devices that you interact with and in general will\
    \ prefer mobile devices. This is a similar experience to driving a car where tasks\
    \ like braking, steering, etc. are “automatic” and don’t require much conscious\
    \ thought.\n\nWe are physical creatures. Many of us gesture with our hands while\
    \ talking, move things around on our desk while we are thinking, and generally\
    \ use our physical environment. Amazing products will combine physical objects\
    \ and computing and information management.\n\nBefore diving into techniques for\
    \ communication between IoT devices, we will digress briefly in the next section\
    \ to see how to run the sample programs for this chapter.\n\n### Running the example\
    \ programs\n\nIf you want to try running the example programs let’s set that up\
    \ before going through the network programming techniques and code later in this\
    \ chapter. Assuming that you have cloned the github repository for the examples\
    \ in this book, go to the subdirectory internet_of_things, open two shell windows\
    \ and use the following commands to run the examples in the same order that they\
    \ are presented (these commands are in the README.md file so you can copy and\
    \ paste them). These commands have been split to multiple lines to fit the page\
    \ width of this book:\n\n#### Build\n\n```\n1     mvn clean compile package assembly:single\n\
    ```\n\n#### Run service discovery\n\n```\n1     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n2 \t     com.markwatson.iot.CreateTestService\n3     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ /\n4 \t     com.markwatson.iot.LookForTestService\n```\n\n#### Run UDP experiments:\n\
    \n```\n 1     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n\
    \ 2 \t     com.markwatson.iot.UDPServer\n 3     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n 4 \t     com.markwatson.iot.UDPClient\n 5 \n 6     # Multicast experiments:\n\
    \ 7     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n 8 \t \
    \    com.markwatson.iot.MulticastServer\n 9     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n10 \t     com.markwatson.iot.MulticastClient\n```\n\nLine 2 compiles and\
    \ builds the examples. For each of the example programs you will run two programs\
    \ on the command line. For example for the service discovery example on lines\
    \ 5 and 6 (which would be entered on one line in a terminal window) we start a\
    \ test service and lines 7 and 8 run the service test client. Similarly, lines\
    \ 10 through 20 show how to run the services and test clients for the UDP experiments\
    \ and the multicast experiments. I repeat these instructions with each example\
    \ as we look at the code but I thought that you might enjoy running all three\
    \ examples before we look at the implementations of the examples later in this\
    \ chapter.\n\nIn each example, run the two example programs in different shell\
    \ windows. For more fun, run the examples using different laptops or any device\
    \ that can run Java code.\n\nThe following figure shows the project for this chapter\
    \ in the Community Edition of IntelliJ:\n\n![IntelliJ project view for the examples\
    \ in this chapter](images/00002.jpeg)\n\nIntelliJ project view for the examples\
    \ in this chapter\n\nThis chapter starts with a design pattern that you might\
    \ use for writing IoT applications. Then the following three major sections show\
    \ you how to use directory lookups, use User Data Protocol (UDP) instead of TCP/IP,\
    \ and then multi-cast/broadcast.\n\nThe material in this chapter is fairly elementary\
    \ but it seems like many developers don’t have experience with lower level network\
    \ programming techniques. My hope is that you will understand when you might want\
    \ to use a lower level protocol like UDP instead of TCP and when you might find\
    \ directory lookups useful in your applcations.\n\n### Design Pattern\n\nThe pattern\
    \ that the examples in the following sections support is simple (in principle):\
    \ small devices register services that they offer and look for services offered\
    \ in other devices. Devices will use User Data Protocol (UDP) and multi-cast to\
    \ communicate for using and providing services. Once a consumer has discovered\
    \ a service privider (host, IP address, port, and service types) a consumer can\
    \ also open a direct TCP/IP socket connection to a provider to use a newly discovered\
    \ service.\n\nThe following diagram shows several IoT use cases:\n\n*   A consumer\
    \ uses the JmDNS library to broadcast on the local network a request for services\
    \ provided.\n\n*   The JmDNS library on the provider side hears a service description\
    \ request and broadcasts available services.\n\n*   The JmDNS library on the consumer\
    \ side listens for the broadcast from the provider.\n\n*   Using a service description,\
    \ the consumer makes a direct socket connection to the provider for a service.\n\
    \n*   The provider periodically broadcasts updated data for its service.\n\n*\
    \   The consumer listens for broadcasts of updated data and uses new data as it\
    \ is available.\n\n![Consumer and Provider Use Cases](images/00003.gif)\n\nConsumer\
    \ and Provider Use Cases\n\nThis figure shows a few use cases. You can use these\
    \ interaction patterns of interactions between IoT devices using application specific\
    \ software you write.\n\n### Directory Lookups\n\nIn the next two sub-sections\
    \ we will be using the [Java JmDNS library](http://jmdns.sourceforge.net/) that\
    \ supports a local multi-cast Domain Name Service (DNS) and supports service discovery.\
    \ JmDNS is compatible with Apple’s Bonjour discovery service that is also available\
    \ for installation on Microsoft Windows.\n\nJmDNS has been successfully used in\
    \ Android apps if you change the defaults on your phone to accept multi-cast (since\
    \ Android version 4.1 [Network Service Discovery (NDS)](https://developer.android.com/training/connect-devices-wirelessly/nsd.html)).\
    \ Android development is outside the scope of this chapter and I refer you to\
    \ the NDS documentation and example programs if you are interested. I tried the\
    \ example Android NsdChat application on my Galaxy S III (Android 4.4.2) and Note\
    \ 4 (Android 5.0.1) and this example app would be a good place for you to start\
    \ if you are interested in using Android apps to experiment with IoT development.\n\
    \n#### Create and Register a Service\n\nThe example program in this section registers\
    \ a service using the JmsDNS Java library that listens on port 1234\\. In the\
    \ next section we look at another example program that connects to this service."
