    18     return ParserTool.parseLine(text, parser, 5);\n19   }\n20 \n21   public\
    \ void prettyPrint(Parse p) {\n22     StringBuffer sb = new StringBuffer();\n\
    23     p.show(sb);\n24     String s = sb.toString() + \" \";\n25     int depth\
    \ = 0;\n26     for (int i = 0, size = s.length() - 1; i < size; i++) {\n27   \
    \    if (s.charAt(i) == ' ' && s.charAt(i + 1) == '(') {\n28         System.out.print(\"\
    \\n\");\n29         for (int j = 0; j < depth; j++) System.out.print(\"  \");\n\
    30       } else if (s.charAt(i) == '(') System.out.print(s.charAt(i));\n31   \
    \    else if (s.charAt(i) != ')' || s.charAt(i + 1) == ')')\n32         System.out.print(s.charAt(i));\n\
    33       else {\n34         System.out.print(s.charAt(i));\n35         for (int\
    \ j = 0; j < depth; j++) System.out.print(\"  \");\n36       }\n37       if (s.charAt(i)\
    \ == '(') depth++;\n38       if (s.charAt(i) == ')') depth--;\n39     }\n40  \
    \   System.out.println();\n41   }\n42 \n43   static ParserModel parserModel =\
    \ null;\n44 \n45   static {\n46 \n47     try {\n48       InputStream modelIn =\
    \ new FileInputStream(\"models/en-parser-chunking.bin\");\n49       parserModel\
