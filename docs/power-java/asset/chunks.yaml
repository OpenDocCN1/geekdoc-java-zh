    \ \"Federal Reserve Bank\" ,\n76                                 \"European Union\"\
    \ ,\n77                                 \"European Central Bank\" ,\n78      \
    \                           \"European Commission\" ;\n79         kb:containsPerson\
    \ \"Lee Myung-bak\" , \"Rajat Nag\" ,\n80                           \"Luiz Inacio\
    \ Lula da Silva\" ,\n81                           \"Jeffrey Lacker\" ;\n82   \
    \      kb:containsCompany \"Development Bank Managing\" ,\n83                \
    \            \"Reuters\" ,\n84                            \"Richmond Federal Reserve\
    \ Bank\" ;\n85         kb:containsIndustryTerm \"central bank\" , \"food\" ,\n\
    86                                 \"energy costs\" ,\n87                    \
    \             \"finance ministers\" ,\n88                                 \"crude\
    \ oil prices\" ,\n89                                 \"oil prices\" ,\n90    \
    \                             \"oil shock\" ,\n91                            \
    \     \"food prices\" ,\n92                                 \"Finance ministers\"\
    \ ,\n93                                 \"Oil prices\" , \"oil\" .\n```\n\nIn\
    \ the following examples, we will look at queries but not the results. We will\
    \ start with a simple SPARQL query for subjects (news article URLs) and objects\
    \ (matching countries) with the value for the predicate equal to $containsCountry$:\n\
    \n```\n1     SELECT ?subject ?object\n2       WHERE {\n3         ?subject\n4 \
    \        http://knowledgebooks.com/ontology#containsCountry>\n5         ?object\
    \ .\n6       }\n```\n\nVariables in queries start with a question mark character\
    \ and can have any names. We can make this query easier and reduce the chance\
    \ of misspelling errors by using a namespace prefix:\n\n```\n1     PREFIX kb:\
    \  <http://knowledgebooks.com/ontology#>\n2     SELECT ?subject ?object\n3   \
    \    WHERE {\n4           ?subject kb:containsCountry ?object .\n5       }\n```\n\
    \nWe could have filtered on any other predicate, for instance $containsPlace$.\
    \ Here is another example using a match against a string literal to find all articles\
    \ exactly matching the text “Maryland.” The following queries were copied from\
    \ Java source files and were embedded as string literals so you will see quotation\
    \ marks backslash escaped in these examples. If you were entering these queries\
    \ into a query form you would not escape the quotation marks.\n\n```\n1     PREFIX\
    \ kb: <http://knowledgebooks.com/ontology#>\n2        SELECT ?subject\n3     \
    \   WHERE { ?subject kb:containsState \\\"Maryland\\\" . }\n```\n\nWe can also\
    \ match partial string literals against regular expressions:\n\n```\n1     PREFIX\
    \ kb:  \n2     SELECT ?subject ?object\n3        WHERE {\n4          ?subject\n\
    5          kb:containsOrganization\n6          ?object FILTER regex(?object, \\\
    \"University\\\") .\n7        }\n```\n\nPrior to this last example query we only\
    \ requested that the query return values for subject and predicate for triples\
    \ that matched the query. However, we might want to return all triples whose subject\
    \ (in this case a news article URI) is in one of the matched triples. Note that\
    \ there are two matching triples, each terminated with a period:\n\n```\n 1  \
    \   PREFIX kb: <http://knowledgebooks.com/ontology#>\n 2     SELECT ?subject ?a_predicate\
    \ ?an_object\n 3        WHERE {\n 4         ?subject\n 5         kb:containsOrganization\n\
    \ 6         ?object FILTER regex(?object, \\\"University\\\") .\n 7 \n 8     \
    \    ?subject ?a_predicate ?an_object .\n 9        }\n10        DISTINCT\n11 \
    \       ORDER BY ?a_predicate  ?an_object\n12        LIMIT 10\n13        OFFSET\
    \ 5\n```\n\nWhen WHERE clauses contain more than one triple pattern to match,\
    \ this is equivalent to a Boolean “and” operation. The DISTINCT clause removes\
    \ duplicate results. The ORDER BY clause sorts the output in alphabetical order:\
    \ in this case first by predicate (containsCity, containsCountry, etc.) and then\
    \ by object. The LIMIT modifier limits the number of results returned and the\
    \ OFFSET modifier sets the number of matching results to skip.\n\nWe are finished\
    \ with our quick tutorial on using the SELECT query form. There are three other\
    \ query forms that I am not covering in this chapter:\n\n*   CONSTRUCT – returns\
    \ a new RDF graph of query results\n\n*   ASK – returns Boolean true or false\
    \ indicating if a query matches any triples\n\n*   DESCRIBE – returns a new RDF\
    \ graph containing matched resources\n\n### SPARQL Query Client\n\nThere are many\
    \ available public RDF data sources. Some examples of publicly available SPARQL\
    \ endpoints are:"
