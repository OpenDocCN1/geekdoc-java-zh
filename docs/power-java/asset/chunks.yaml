  trans: '


    注意：我出版了《Practical Semantic Web and Linked Data Applications: Java, JRuby, Scala,
    and Clojure Edition》，你可以在[这里获取该书的免费 PDF](http://www.markwatson.com/opencontent_data/book_java.pdf)。虽然书中的技术细节仍然具有参考价值，但我现在对哪些链接数据和语义网技术最有用有了明确的观点，因此本章将更有重点。通过一些改进，我使用了之前书中用于
    DBPedia 搜索的 Java 客户端代码和 `SPARQL` 查询。我还包含了以 JSON 返回查询结果的新版本。我假设你已经获取了我的书籍《Practical
    Semantic Web and Linked Data Applications》的免费副本，并使用第 6 和第 7 章作为资源描述语言（`RDF` 和
    `RDFS`）的介绍，使用第 8 章作为 `SPARQL` 查询语言的教程。如果你想直接进入本章的示例，稍后阅读这些背景材料也是可以的。我在下一节中对 `SPARQL`
    和 `RDF` 进行简要介绍，但请务必也获取一份我的语义网书籍以获得更深入的探讨。我们使用标准查询语言 `SPARQL` 从 RDF` 数据源中检索信息，就像我们使用
    `SQL` 从关系型数据库中检索信息一样。


    在本章中，我们将学习如何对公共 `RDF` 数据存储执行 `SPARQL` 查询来消费链接数据，并搜索 DBPedia。使用上一章“Natural Language
    Processing Using OpenNLP”中的代码，我们还将开发一个示例应用程序，通过为实体标记唯一的 DBPedia `URIs` 来对文本进行注释（我们将在下一章知识管理的代码示例中使用这个例子）。


    ## 为什么要使用链接数据？


    在进入技术细节之前，我想为你提供一些动力，说明你可能使用链接数据和语义网技术来组织和访问信息。假设你的公司向客户销售产品，你的任务是使用新系统增强用于订单、运输和客户数据的关系数据库，该系统需要捕捉产品、客户与网络信息源之间的关系，这些关系可能帮助你的客户和支持人员提高产品对客户的效用。


    客户、产品和信息源是实体，有时会与其他实体的属性或关系相关联。这些新数据是非结构化的，你无法预知所有的关系，以及新系统将使用哪些新类型的实体。如果你来自关系数据库背景，起初使用图数据库可能会感到不习惯。作为参考，可以考虑
    Google 使用其知识图谱（Knowledge Graph，我在 Google 工作期间曾自定义过知识图谱）用于内部应用、为搜索结果增加价值，并驱动 Google
    Now。Facebook 使用其开放图（Open Graph）来存储关于用户、用户帖子以及用户与发布材料之间关系的信息。这些图数据存储是 Google 和
    Facebook 的核心资产。仅仅因为你不处理海量数据，并不意味着图数据的灵活性对你的项目没有用！我们将在本章中使用 DBPedia 图数据库进行示例程序。DBPedia（Google
    在开发其知识图谱时将其作为核心知识）是关于产品、人员、公司、地点等类型数据的丰富信息源。将你组织中的内部数据连接到 DBPedia 等外部数据源可以增加你的私有数据的效用。你可以通过选择性地将某些内部数据作为链接数据发布出去，造及客户和业务合作伙伴，从而使这种数据共享关系对称化。


    核心思想是设计信息的形状（你处理哪些实体，不同类型实体之间存在什么类型的属性或关系），将数据摄入图数据库并制定保持所有内容更新的计划，然后提供 API 或查询语言，以便应用程序开发人员在开发新应用程序时访问这些链接数据。在本章中，我们将使用带有
    `SPARQL` 查询语言的语义网标准来访问数据，但这些思想也适用于其他图数据库如 `Neo4J` 或非关系数据存储如 `MongoDB` 或 `CouchDB`。


    ## 示例代码


    本章示例设置为从命令行或使用 IntelliJ 运行。


    本章三个示例。如果你想在阅读本章其余部分之前尝试运行代码，请运行每个 `maven` 测试：


    ```

    1     mvn test -Dtest=AnnotationTest

    2     mvn test -Dtest=DBPediaTest

    3     mvn test -Dtest=SparqlTest

    ```


    下图显示了 IntelliJ 社区版中本章的项目：


    ![IntelliJ project view for the examples in this chapter](img/00024.jpeg)


    本章示例的 IntelliJ 项目视图


    ## RDF 和 SPARQL 概述


    资源描述框架（`RDF`）用于以主语/谓语/宾三元组值的形式存储信息。`RDF` 数据最初被编码为 `XML` 并旨在用于自动化处理。在本章中我们将使用两种易读的格式，称为“N-Triples”和“N3”。`RDF`
    数据由一组三元组值组成：


    * subject（主语）

    * predicate（谓语）

    * object（宾语）


    例如，假设我们的应用程序涉及新闻故事，我们希望有一种存储和查询元数据的方法。我们可以通过从文本中提取语义信息并将其存储在 `RDF` 中。我将在本章的示例中使用该领域。我们可能会使用如下三元组：


    * subject：新闻文章的 URL（或 `URI`）

    * predicate：如“containsPerson”（包含人物）之类的关系

    * object：如“Bill Clinton”这样的值


    如前所述，我们将使用 `URIs` 或字符串字面量作为主语和宾语的值。我们始终将使用 `URIs` 作为谓语的值。在任何情况下，`URIs` 通常比字符串字面量更受青睐，因为它们是唯一的。我们将看到这种优先用法的示例，但首先我们需要学习
    N-Triples 和 N3 格式。


    三元组的任何部分（主语、谓语或宾语）都是 `URI` 或字符串字面量。`URIs` 编码命名空间。例如，上一个示例中的 containsPerson 谓语可以正确写为：


    ```http://knowledgebooks.com/ontology/#containsPerson own```


    此 `URI` 的第一部分被认为是“containsPerson”（我们将用作谓语）的命名空间。当不同的 `RDF` 三元组使用相同的谓语时，这确保了所有该谓语的用户都遵循相同的含义。此外，我们将在
    RDFS 章节 中看到，可以使用 `RDFS` 来声明此谓语（在 http://knowledgebooks.com/ontology/ 命名空间下）与其他数据源使用的不同
    `URIs` 表示的谓语之间的等效性。N-Triple 格式的语句由三个 `URIs`（或字符串字面量——任何组合）组成，后面跟着一个句号。虽然语句在源文件中通常每行一个，但也可以跨行编写；结尾的句号标记了语句的结束。N-Triple
    格式的标准文件扩展名为 `*.nt`，N3 格式的标准格式扩展名为 `*.n3`。


    '
- fmt: "\nMy preference is to use N-Triple format files as output from programs that\
    \ I write to save data as RDF. I often use `Sesame` to convert N-Triple files\
    \ to `N3` if I will be reading them or even hand editing them. You will see why\
    \ I prefer the `N3` format when we look at an example:\n\n```\n1 @prefix kb: \
    \ <http://knowledgebooks.com/ontology#> .\n2 <http://news.com/201234 /> kb:containsCountry\
    \ \"China\"  .\n```\n\nHere we see the use of an abbreviation prefix `kb:` for\
    \ the namespace for my company KnowledgeBooks.com ontologies. The first term in\
    \ the RDF statement (the subject) is the URI of a news article. The second term\
    \ (the predicate) is `containsCountry` in the `kb:` namespace. The last item in\
    \ the statement (the object) is a string literal `China.``. I would describe this\
    \ RDF statement in English as, “The news article at URI `http://news.com/201234`\
    \ mentions the country China.”\n\nThis was a very simple `N3` example which we\
    \ will expand to show additional features of the `N3` notation. As another example,\
    \ suppose that this news article also mentions the USA. Instead of adding a whole\
    \ new statement like this:\n\n```\n1     @prefix kb:  <http://knowledgebooks.com/ontology#>\
    \ .\n2     <http://news.com/201234 /> kb:containsCountry \"China\"  .\n3     <http://news.com/201234\
    \ /> kb:containsCountry \"USA\"  .\n```\n\nwe can combine them using `N3` notation.\
    \ `N3` allows us to collapse multiple RDF statements that share the same subject\
    \ and optionally the same predicate:\n\n```\n1     @prefix kb:  <http://knowledgebooks.com/ontology#>\
    \ .\n2     <http://news.com/201234 /> kb:containsCountry \"China\" ,\n3      \
    \                                             \"USA\" .\n```\n\nWe can also add\
    \ in additional predicates that use the same subject:\n\n```\n 1     @prefix kb:\
    \  <http://knowledgebooks.com/ontology#> .\n 2 \n 3     <http://news.com/201234\
    \ /> kb:containsCountry \"China\" ,\n 4                                      \
    \             \"USA\" .\n 5         kb:containsOrganization \"United Nations\"\
    \ ;\n 6         kb:containsPerson \"Ban Ki-moon\" , \"Gordon Brown\" ,\n 7   \
    \                        \"Hu Jintao\" , \"George W. Bush\" ,, 8             \
    \              \"Pervez Musharraf\" ,\n 9                           \"Vladimir\
    \ Putin\" , \n10                           \"Mahmoud Ahmadinejad\" .\n```\n\n\
    This single `N3` statement represents ten individual RDF triples. Each section\
    \ defining triples with the same subject and predicate have objects separated\
    \ by commas and ending with a period. Please note that whatever RDF storage system\
    \ we use (we will be using `Sesame`) it makes no difference if we load RDF as\
    \ `XML`, `N-Triple`, of `N3` format files: internally subject, predicate, and\
    \ object triples are stored in the same way and are used in the same way.\n\n\
    I promised you that the data in RDF data stores was easy to extend. As an example,\
    \ let us assume that we have written software that is able to read online news\
    \ articles and create RDF data that captures some of the semantics in the articles.\
    \ If we extend our program to also recognize dates when the articles are published,\
    \ we can simply reprocess articles and for each article add a triple to our RDF\
    \ data store using a form like:\n\n```\n1     <http://news.com/201234 /> kb:datePublished\n\
    2                                \"2008-05-11\" .\n```\n\nFurthermore, if we do\
    \ not have dates for all news articles that is often acceptable depending on the\
    \ application.\n\n`SPARQL` is a query language used to query RDF data stores.\
    \ While `SPARQL` may initially look like `SQL`, there are some important differences\
    \ like support for `RDFS` and `OWL` inferencing. We will cover the basics of `SPARQL`\
    \ in this section.\n\nWe will use the following sample RDF data for the discusion\
    \ in this section:\n"
