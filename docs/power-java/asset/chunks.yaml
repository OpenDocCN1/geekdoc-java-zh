    4 \n5 <http://dbpedia.org/resource/Alberta>\n6     <http://www.w3.org/2000/01/rdf-schema#comment>\n\
    ```\n\n#### 命名实体识别\n\n下面的代码展示了如何使用命名实体识别（NER）将文本映射到 DBPedia URI：\n\n```java\n\
