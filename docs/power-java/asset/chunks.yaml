- fmt: "\nSince the code for this section is very similar to the last example I will\
    \ not list it. Please refer to the source file `SvmClassifier.java` and the test\
    \ file `SvmClassifier.java` in the github repository for this book. In the repository\
    \ subdirectory `machine_learning_spark` you will need to remove the model files\
    \ generated when running the example in the previous section before running this\
    \ example:\n\n```\nrm -r -f generated_models/*\nmvn test -Dtest=SvmClassifierTest\n\
    ```\n\nThe output for this example will look like:\n\n```\nTest Data Mean Squared\
    \ Error = 0.22950819672131167\nShould be malignant (close to 1.0): 1.0\nShould\
    \ be benign (close to 0.0): 0.0\n```\n\nNote that the test data mean square error\
    \ is larger than the value of `0.050140726106582885` that we obtained using logistic\
    \ regression in the last section.\n\n## MLlib K-Means Example Program\n\nWe will\
    \ use unsupervised learning in this section, specifically the K-Means clustering\
    \ algorithm. This clustering process partitions inputs into groups that share\
    \ common features. Later in this chapter we will look at an example where our\
    \ input will be some randomly chosen Wikipedia articles.\n\nK-Means analysis is\
    \ useful for many types of data where you might want to cluster members of some\
    \ set into different sub-groups. As an example, you might be a biologist studying\
    \ fish. For each species of fish you might have attributes like length, weight,\
    \ location, fresh/salt water, etc. You can use K-Means to divide fish specifies\
    \ into similar sub-groups.\n\nIf your job deals with marketing to people on social\
    \ media, you might want to cluster people (based on what attributes you have for\
    \ users of social media) into sub-groups. If you have sparse data on some users,\
    \ you might be able to infer missing data on other users.\n\nThe simple example\
    \ in this section uses numeric feature vectors. Keep in mind, however our goal\
    \ of processing Wikipedia text in a later section. In the next section we will\
    \ see how to convert text to feature vectors, and finally, in the section after\
    \ that we will cluster Wikipedia articles.\n\nImplementing K-Means is simple but\
    \ using the MLlib implementation has the advantage of being able to process very\
    \ large data sets. The first step in calculating K-Means is choosing the number\
    \ of desired clusters `NC`. The calculate `NC` cluster centers randomly. We then\
    \ perform an inner loop until either cluster centers stop changing or a specified\
    \ number of iteractions is done:\n\n* For each data point, assign it to the cluster\
    \ center closest to it.\n* for each cluster center, move the center to the average\
    \ location of the data points in that cluster\n\nIn practice you will repeat this\
    \ clustering process many times and use the cluster centers with the minimum distortion.\
    \ The distortion is the sum of the squares of the distances from each data point\
    \ in a cluster to the final cluster center.\n\nSo before we look at the Wikipedia\
    \ example (clustering Wikipedia articles) later in this chapter, I want to first\
    \ review the `JavaKMeans.java` example from the Spark MLlib examples directory\
    \ to see how to perform K-Means clustering on sample data:\n\n```\nspark-1.5.0/examples/src/main/java/org/apache/spark/examples/mllib/\n\
    ```\n\nThis is a very simple example that already uses numeric data. I copied\
    \ the `JavaKMeans.java` file (changing the package name) to the github repository\
    \ for his book.\n\nThe most important thing in this section that you need to learn\
    \ is the required types of input data: vectors of double size floating point numbers.\
    \ Each sample of data needs to be converted to a numeric feature vector. For some\
    \ applications this is easy. As a hypothetical example, you might have a set of\
    \ features that measure weather in your town: low temperature, high temperature,\
    \ average temperature, percentage of sunshine during the day, and wind speed.\
    \ All of these features are numeric and can be used as a feature vector as-is.\
    \ You might have 365 samples for a given year and would like to cluster the data\
    \ to see which days are similar to each other.\n\nWhat if in this hypothetical\
    \ example one of the features was a string representing the month? One obvious\
    \ way to convert the data would be to map “January” to 1, “February” to 2, etc.\
    \ We will see in the next section when we cluster Wikipedia articles that converting\
    \ data to a numeric feature vector is not always so easy.\n\nWe will use the tiny\
    \ sample data set provided with the MLlib KMeans example:\n\n```\n0.0 0.0 0.0\n\
    0.1 0.1 0.1\n0.2 0.2 0.2\n9.0 9.0 9.0\n9.1 9.1 9.1\n9.2 9.2 9.2\n```\n\nHere we\
    \ have 6 samples and each sample has 3 features. From inspection, it looks like\
    \ there are two clusters of data: the first three rows are in one cluster and\
    \ the last three rows are in a second cluster. The order that feature vectors\
    \ are processed in is not important; the samples in this file are organized so\
    \ you can easily see the two clusters. When we run this sample program asking\
    \ for two clusters we get:\n\n```\nCluster centers:\n [9.1,9.1,9.1]\n [0.1,0.1,0.1]\n\
    ```\n\nWe will go through the code in the sample program since it is the same\
    \ general pattern we use throughout the rest of this chapter. Here is a slightly\
    \ modified version of `JavaKMeans.java` with a few small changes from the version\
    \ in the MLLib examples directory:\n\n```\n 1 public final class JavaKMeans {\n\
    \ 2 \n 3   static class ParsePoint implements Function<String, Vector> {\n 4 \
    \    @Override\n 5     public Vector call(String line) {\n 6       String[] tok\
    \ = line.split(\" \");\n 7       double[] point = new double[tok.length];\n 8\
    \       for (int i = 0; i < tok.length; ++i) {\n9         point[i] = Double.parseDouble(tok[i]);\n\
    10      }\n11      return Vectors.dense(point);\n12    }\n 13   }\n 14 \n15  \
    \ public static void main(String[] args) {\n16 \n17     String inputFile = \"\
    data/kmeans_data.txt\";\n18     int k = 2; // two clusters\n19     int iterations\
    \ = 10;\n20     int runs = 1;\n21 \n22     JavaSparkContext sc = new JavaSparkContext(\"\
    local\", \"JavaKMeans\");\n23     JavaRDD<String> lines = sc.textFile(inputFile);\n\
    24 \n25     JavaRDD<Vector> points = lines.map(new ParsePoint());\n26 \n27   \
    \  KMeansModel model = KMeans.train(points.rdd(), k, iterations, runs,       \
    \                          KMeans.KMEANS_PARALLEL());\n28 \n29     System.out.println(\"\
    Cluster centers:\");\n30     for (Vector center : model.clusterCenters()) {\n\
    31       System.out.println(\" \" + center);\n32     }\n33     double cost = model.computeCost(points.rdd());\n\
    34     System.out.println(\"Cost: \" + cost);\n35 \n36     sc.stop();\n37   }\n\
    38 }\n```\n"
