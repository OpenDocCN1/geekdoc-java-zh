    \ printed parse:\\n\");\n64       cpd.prettyPrint(p);\n65       System.out.println(\"\
    \\n\");\n66     }\n67   }\n68 }\n```\n\nThe OpenNLP parsing model is read from\
    \ a file in lines 45 through 53. The static variable `parserModel` (instance of\
    \ class `ParserModel`) if created in line 49 and used in lines 17 and 18 to parse\
    \ input text. It is instructive to look at the intermediate calculation results.\
    \ The value for variable `parser` defined in line 17 has a value of:\n\n![Data\
    \ in the parser model as seen in IntelliJ](images/00005.jpeg)\n\nData in the parser\
    \ model as seen in IntelliJ\n\nNote that the parser returned 5 results because\
    \ we specified this number in line 18. For a long sentence the parser generates\
    \ a very large number of possible parses for the sentence and returns, in order\
    \ of probability of being correct, the number of resutls we requested.\n\nThe\
    \ OpenNLP chunking parser code prints out results in a flat list, one result on\
    \ a line. This is difficult to read which is why I wrote the method `prettyPrint`\
    \ (lines 21 through 41) to print the parse results indented. Here is the output\
    \ from the last code example (the first parse shown is all on one line but line\
    \ wraps in the following listing):\n\n```\n 1 parse:\n 2 \n 3 (TOP (S (NP (NNP\
    \ John) (NNP Smith)) (VP (VBD went) (PP (TO to) (NP (DT the) (NN \\\n 4 store)))\
    \ (PP (IN on) (NP (NP (NP (PRP$ his) (NN way)) (ADVP (NN home))) (PP (IN \\\n\
    \ 5 from) (NP))))\n 6 \n 7 pretty printed parse:\n 8 \n 9 (TOP (S (NP (NNP John)\
    \ (NNP Smith)) (VP (VBD went) (PP (TO to) (NP (DT the) (NN \\\n 10 store))) (PP\
    \ (IN on) (NP (NP (NP (PRP$ his) (NN way)) (ADVP (NN home))) (PP (IN \\\n 11 from)\
    \ (NP))))\n```\n\n## Machine Learning Using Spark\n\nI have used Java for Machine\
    \ Learning (ML) for nearly twenty years using my own code and also great open\
    \ source projects like Wika, Mahout, and Mallet. For the material in this chapter\
    \ I will use a relatively new open source learning library MLlib that is included\
    \ in the Spark project. Spark is similar to Hadoop in providing functionality\
    \ for using multiple servers for processing massively data sets. Spark preferentially\
    \ deals with data in memory and can provide near time analysis of data sets.\n\
    \nWe saw a specific use case of machine learning in the previous chapter on OpenNLP.\
    \ This chapter will introduce another good ML library. Machine learning is part\
    \ of the fields of data science and artificial intelligence.\n\nThere are several\
    \ steps involved in building applications with ML:\n\n- Understand what problems\
    \ your organization has and what data is available to solve these problems. In\
    \ other words, figure out where you should spend your effort. You should also\
    \ understand early in the process how it is that you will evaluate the usefulness\
    \ and quality of results.\n- Collecting data. This step might involve collecting\
    \ numeric time series data from instruments; for example, to train regression\
    \ models or collecting text for natural language processing ML projects as we\
    \ saw in the last chapter.\n- Cleaning data. This might involve detecting and\
    \ removing errors in data from faulty sensors or incomplete collection of text\
    \ data from the web. In some cases data might be annotated (or labelled) in this\
    \ step.\n- Integrating data from different sources and organizing it for experiments.\
    \ Data that has been collected and cleaned might end up being used for multiple\
    \ projects so it makes sense to organize it for ease of use. This might involve\
    \ storing data on disk or cloud storage like S3 with meta data stored in a database.\
    \ Meta data could include date of collection, data source, steps taken to clean\
    \ the data, and references to models already build using this data.\n\nThe main\
    \ topic of this chapter is analysing data and creating models with machine learning.\
    \ This will often be experimental with many different machine learning algorithms\
    \ used for quick and dirty experiments. These fast experiments should inform you\
    \ on which approach works best for this data. Once you decide which ML algorithm\
    \ to use you can spend the time to refine features in data used by learning algorithms\
    \ and to tune model parameters. It is usually best, however, to first quickly\
    \ try a few approaches before settling on one approach and then investing a lot\
    \ of time in building a model.\n"
