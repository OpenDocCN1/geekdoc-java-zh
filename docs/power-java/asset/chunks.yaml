  trans: '

    当你有大量的负样本（“正常”）和相对较少的正样本（“异常”）时，应该使用异常检测。对于本章中的示例，我们将通过以下方式使用威斯星癌症数据准备数据，以模拟正样本（“异常”）结果的稀缺性：


    - 我们将数据分为训练集 (60%)、交叉验证集 (20%) 和测试集 (20%)。

    - 对于训练数据，我们将除两个正样本（“异常”）以外的所有样本。这样做是为了模拟真实世界的测试用例：尽管我们希望训练数据只包含负样本（“正常”），但现实情况下某些正样本可能会出现在训练数据中。

    - 我们将使用交叉验证数据来为 epsilon 元参数找到一个合适的值。

    - 在找到合适的 epsilon 值后，我们将计算模型的 F1 测量。


    ## 异常检测数学基础


    我们正尝试对“正常”行为进行建模，通过提取每个特征并为每个特征拟合一个高斯分布（钟形曲线）来实现。高斯分布的学习参数是数据的均值（钟形曲线的中心点）和方差。你可能对标准差这个术语更熟悉，![$\sigma$](img/00007.gif)。方差定义为
    ![$\sigma ²$](img/00008.gif)。


    我们需要计算 ![P(x : \mu, \sigma ²)$](img/00009.gif)，其中 ![$\mu$](img/00010.gif) 是均值，![$\sigma
    ²$](img/00011.gif) 是方差平方：


    ![P(x : \mu, \sigma ²) = \frac{1}{{\sigma \sqrt {2\pi } }}e^{{{ - \left( {x -
    \mu } \right)² } \mathord{\left/ {\vphantom {{ - \left( {x - \mu } \right)² }
    {2\sigma ² }}} \right. \kern-\nulldelimiterspace} {2\sigma ² }}}](img/00012.gif)


    其中 ![x_i$](img/00013.gif) 是样本，我们可以这样计算方差：


    ![$\sigma² = \frac{\displaystyle\sum_{i=1}^{m}(x_i - \mu)²} {m}$](img/00014.gif)


    我们为每个特征计算 ![$\mu$](img/00015.gif) 和 ![$\sigma ²$](img/00016.gif)。二维空间中的钟形分布很容易可视化，三维空间中的倒碗形状也是如此。如果我们有很多特征呢？嗯，数学上是行得通，不用担心无法在脑海中想象出它。


    ## AnomalyDetection 工具类


    在本节开发的 `AnomalyDetection` 类具有相当的通用性。它处理一组训练样本，并为每个特征计算 ![$\mu$](img/00017.gif)
    和 ![$\sigma ²$](img/00018.gif)。我们还在训练第三个参数：epsilon “阈值”值：如果对于给定的输入向量，![P(x : \mu,
    \sigma ²)$](img/00019.gif) 的求值值大于 epsilon，则该输入向量为“正常”，小于 epsilon 则意味着输入向量是“异常”。从训练数据计算这三个特征的数学原理相当简单，但代码实现并不容易：我们需要组织训练数据，并寻找一个使交叉验证数据集误差最小最小的
    epsilon 值。


    为了清楚起见：我们将输入样本分为训练、交叉验证和测试数据三个独立集合。我们使用训练数据来设置模型参数，使用交叉验证数据来学习 epsilon 值，最后使用测试数据获取精确率（precision）、召回率（recall）和
    F1 分数，以指示模型检测未用于训练和交叉验证的数据中异常的能力。


    我将示例程序作为一个长列表列出，并在列表之后提供更详细的代码解释。请注意从第 28 行到第 74 行遍历每个输入训练样本的长循环。第 25 行到 44 行的代码将输入训练数据处理为三个不相交的训练、交叉验证和测试数据集。然后，第
    45 行到 63 行的代码将这三组数据拷贝到 Java 数组中。


    第 65 行到 73 行的代码计算训练样本的 ![$\mu$](img/00020.gif) 值（代码中的变量 `mu`）。


    请注意代码示例，即使在不需要时，我也会在方法中使用“this.” 前缀加上类变量。这样做是为了可读性，也是我的个人风格。


    '
- fmt: "\n```java\npackage com.markwatson.anomaly_detection;\n\nimport java.util.ArrayList;\n\
    import java.util.List;\n\n/**\n * Created by markw on 10/7/15.\n */\npublic class\
    \ AnomalyDetection {\n\n  public AnomalyDetection() { }\n\n  /**\n   * AnomalyDetection\
    \ is a general purpose class for building anomaly detection\n   * models. You\
    \ should use this type of mdel when you have mostly negative\n   * training examples\
    \ with relatively few positive examples and you need a model\n   * that detects\
    \ postive (anomaly) inputs.\n   *\n   * @param num_features\n   * @param num_training_examples\n\
    \   * @param training_examples [num_training_examples][num_features]\n   */\n\
    \  public AnomalyDetection(int num_features, int num_training_examples,\n    \
    \                      double [][] training_examples) {\n    List<double[]> training\
    \ = new ArrayList<>();\n    List<double[]> cross_validation = new ArrayList<>();\n\
    \    List<double[]> testing = new ArrayList<>();\n    int outcome_index = num_features\
    \ - 1; // index of target outcome\n    for (int i=0; i<num_training_examples;\
    \ i++) {\n      if (Math.random() < 0.6) { // 60% training\n        // Only keep\
    \ normal (negative) examples in training, except\n        // remember the reason\
    \ for using this algorithm is that it\n        // works with many more negative\
    \ examples than positive\n        // examples, and that the algorithm works even\
    \ with some positive\n        // examples mixed into the training set. The random\
    \ test is to\n        // allow about 10% positive examples to get into the training\
    \ set:\n        if (training_examples[i][outcome_index] < 0.5 || Math.random()\
    \ < 0.1)\n          training.add(training_examples[i]);\n      } else if (Math.random()\
    \ < 0.7) {\n          cross_validation.add(training_examples[i]);\n      } else\
    \ {\n        testing.add(training_examples[i]);\n      }\n    }\n    this.num_training_examples\
    \ = training.size();\n    this.num_cross_validation_examples = cross_validation.size();\n\
    \    this.num_testing_examples = testing.size();\n\n    this.training_examples\
    \ = new double[this.num_training_examples][];\n    for (int k=0; k<this.num_training_examples;\
    \ k++) {\n      this.training_examples[k] = training.get(k);\n    }\n\n    this.cross_validation_examples\
    \ = new double[num_cross_validation_examples][];\n    for (int k=0; k<num_cross_validation_examples;\
    \ k++) {\n      this.cross_validation_examples[k] = cross_validation.get(k);\n\
    \    }\n\n    this.testing_examples = new double[num_testing_examples][];\n  \
    \  for (int k=0; k<this.num_testing_examples; k++) {\n      // dimensions of [num_training_examples][num_features]:\n\
    \      this.testing_examples[k] = testing.get(k);\n    }\n\n    this.mu = new\
    \ double[num_features];\n    this.sigma_squared = new double[num_features];\n\
    \    this.num_features = num_features;\n    for (int nf = 0; nf < this.num_features;\
    \ nf++) { //\n      double sum = 0;\n      for (int nt = 0; nt < this.num_training_examples;\
    \ nt++)\n        sum += training_examples[nt][nf];\n        this.mu[nf] = sum\
    \ / this.num_training_examples;\n    }\n  }\n\n  public double [] muValues() {\
    \ return mu; }\n  public double [] sigmaSquared() { return sigma_squared; }\n\
    \  public double bestEpsilon() { return best_epsilon; }\n\n  /**\n   * Train the\
    \ model using a range of epsilon values. Epsilon is a\n   * hyper parameter that\
    \ we want to find a value that\n   * minimizes the error count.\n   */\n  public\
    \ void train() {\n    double best_error_count = 1e10;\n    for (int epsilon_loop=0;\
    \ epsilon_loop<40; epsilon_loop++) {\n      double epsilon = 0.05 + 0.01 * epsilon_loop;\n\
    \      double error_count = train(epsilon);\n      if (error_count < best_error_count)\
    \ {\n        best_error_count = error_count;\n        best_epsilon = epsilon;\n\
    \      }\n    }\n    System.out.println(\"\\n Best epsilon = \" + best_epsilon\
    \ );\n\n    // retrain for the best epsilon setting the maximum likelihood\n \
    \   // which are now in mu[] and sigma_squared[]:\n    train_helper(best_epsilon);\n\
    \n    // finally, we are ready to see how the model performs with test data:\n\
    \    test(best_epsilon);\n  }\n\n  /**\n   * calculate probability(x; mu, sigma_squared)\n\
    \   * @param x - example vector\n   * @return\n   */\n  private double p(double\
    \ [] x) {\n    double sum = 0;\n    // use (num_features - 1) to skip output:\n\
    \    for (int nf=0; nf<num_features - 1; nf++) {\n      sum += (1.0 / (SQRT_2_PI\
    \ * sigma_squared[nf])) *\n             Math.exp(-(x[nf] - mu[nf]) * (x[nf] -\
    \ mu[nf]));\n    }\n    return sum / num_features;\n  }\n\n  /**\n   * returns\
    \ 1 if input vector is anomaly\n   * @param x - example vector\n   * @return\n\
    \   */\n  public boolean isAnoly(double [] x) {\n    double sum = 0;\n    // use\
    \ (num_features - 1) to skip output:\n    for (int nf=0; nf<num_features - 1;\
    \ nf++) {\n      sum += (1.0 / (SQRT_2_PI * sigma_squared[nf])) *\n          \
    \   Math.exp(-(x[nf] - mu[nf]) * (x[nf] - mu[nf]));\n    }\n    return (sum /\
    \ num_features) < best_epsilon;\n  }\n\n  private double train_helper_(double\
    \ epsilon) {\n    // use (num_features - 1) to skip output:\n    for (int nf =\
    \ 0; nf < this.num_features - 1; nf++) {\n      double sum = 0;\n      for (int\
    \ nt=0; nt<this.num_training_examples; nt++) {\n        sum += (this.training_examples[nt][nf]\
    \ - mu[nf]) *\n               (this.training_examples[nt][nf] - mu[nf]);\n   \
    \   }\n      sigma_squared[nf] = (1.0 / num_features) * sum;\n    }\n    double\
    \ cross_validation_error_count = 0;\n    for (int nt=0; nt<this.num_cross_validation_examples;\
    \ nt++) {\n      double[] x = this.cross_validation_examples[nt];\n      double\
    \ calculated_value = p(x);\n      if (x[9] > 0.5) { // target training output\
    \ is ANOMALY\n        // if the calculated value is greater than epsilon\n   \
    \     // then this x vector is not an anomaly (e.g., it\n        // is a normal\
    \ sample):\n        if (calculated_value > epsilon) cross_validation_error_count\
    \ += 1;\n      } else { // target training output is NORMAL\n        if (calculated_value\
    \ < epsilon) cross_validation_error_count += 1;\n      }\n    }\n    System.out.println(\"\
    \   cross_validation_error_count = \" +\n                       cross_validation_error_count\
    \ +\n                       \" for epsilon = \" + epsilon);\n    return cross_validation_error_count;\n\
    \  }\n\n  private double test(double epsilon) {\n    double num_false_positives\
    \ = 0, num_false_negatives = 0;\n    double num_true_positives = 0, num_true_negatives\
    \ = 0;\n    for (int nt=0; nt<this.num_testing_examples; nt++) {\n      double[]\
    \ x = this.testing_examples[nt];\n      double calculated_value = p(x);\n    \
    \  if (x[9] > 0.5) { // target training output is ANOMALY\n        if (calculated_value\
    \ > epsilon) num_false_negatives++;\n        else num_true_positives++;\n    \
    \  } else { // target training output is NORMAL\n        if (calculated_value\
    \ < epsilon) num_false_positives++;\n        else num_true_negatives++;\n    \
    \  }\n    }\n    double precision = num_true_positives / (num_true_positives +\
    \ num_false_positives);\n    double recall = num_true_negatives / (num_true_negatives\
    \ + num_false_negatives);\n    double F1 = 2 * precision * recall / (precision\
    \ + recall);\n\n    System.out.println(\"\\n Best epsilon = \" + best_epsilon);\n\
    \    System.out.println(\" -- number of test examples = \" + this.num_testing_examples);\n\
    \    System.out.println(\" -- number of false positives = \" + num_false_positives);\n\
    \    System.out.println(\" -- number of true positives = \" + num_true_positives);\n\
    \    System.out.println(\" -- number of false negatives = \" + num_false_negatives);\n\
    \    System.out.println(\" -- number of true negatives = \" + num_true_negatives);\n\
    \    System.out.println(\" -- precision = \" + precision);\n    System.out.println(\"\
    \ -- recall = \" + recall);\n    System.out.println(\" -- F1 = \" + F1);\n   \
    \ return F1;\n  }\n\n  double best_epsilon = 0.02;\n  private double [] mu;  //\
    \ [num_features]\n  private double [] sigma_squared; // [num_features]\n  private\
    \ int num_features;\n  private static double SQRT_2_PI = 2.50662827463;\n\n  private\
    \ double[][] training_examples; // [num_features][num_training_examples]\n  //\
    \ [num_training_examples][num_features]:\n  private double[][] cross_validation_examples;\
    \ \n  private double[][] testing_examples; // [num_features][num_training_examples]\n\
    \  private int num_training_examples;\n  private int num_cross_validation_examples;\n\
    \  private int num_testing_examples;\n}\n```\n"
