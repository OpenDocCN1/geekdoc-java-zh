    ![](img/00029.jpeg)


    # Power Java


    ## Mark Watson


    本书已可在 [`leanpub.com/powerjava`](http://leanpub.com/powerjava) 购买


    此版本发布于 2015-11-29


    ![publisher''s logo](img/00001.jpeg)


    * * * * * *


    这是一本来自 [Leanpub](http://leanpub.com) 的书。Leanpub 通过精益出版流程为作者和出版社赋能。[精益出版](http://leanpub.com/manifesto)
    是使用轻量级工具和多次迭代来出版正在开发中的电子书，以获取读者反馈，并不断调整方向直到获得正确的书籍，并在一旦成功后建立势头。


    * * * * * *


    © 2015 Mark Watson


    ## 目录


    ## 指南


    1. 开始阅读


    ## 前言


    我从高中就开始学习编程，从 20 世纪 80 年代初以来，我一直致力于人工智能、神经网络、机器学习以及通用 Web 工程项目的工作。我的大部分专业工作都反映在本书的示例中。这些示例程序也是根据其技术重要性挑选的，即：快速变化的大数据技术、机器学习在触及我们生活大部分部分的系统中的应用以及网络化设备。随后，我根据[我的博客](https://blog.markwatson.com)上发布的一项公开调查缩小了主题列表。非常感谢那些花时间参加这项调查的人。我希望书中的
    Java 示例程序对你的项目有所帮助。希望你将在学习这些示例时也能获得很多乐趣！


    Java 是一种灵活的语言，拥有大量的开源库和工具程序。Java 因其编程语言冗长而受到了一些批评。我有自己的编码风格，非常简洁，但可能会打破你学到的某些关于“正确”使用该语言的观念。自
    20 多年前引入以来，Java 语言已经历了多次升级。本书要求并使用了 `Java 8` 的特性，因此如果你尚未更新，请升级到最新的 `JDK`。你还需要在你的系统中安装
    `maven`。我还为 `IntelliJ IDE` 的免费社区版提供了项目文件。


    你在书中学到的所有内容通过一些努力都可以用于替代的 JVM 语言 `Clojure`、`JRuby` 和 `Scala`。除了 Java 之外，我在工作中频繁使用
    `Clojure`、`Haskell` 和 `Ruby`。


    ### 书籍大


    本书由八章组成，我认为这些章节很好地展示了 Java 语言的力量：


    * 针对物联网（IoT）的网络编程技术

    * 使用 `OpenNLP` 进行自然语言处理，包括使用现有模型和创建自己的模型

    * 使用 `Spark mllib` 库进行机器学习

    * 异常检测机器学习

    * 使用 `Deeplearning4j` 进行深度学习

    * 网页爬虫

    * 利用网络上丰富的语义和链式数据源来丰富你在应用程序中使用的数据模型

    * 使用云数据资源的轻量级知识管理 Java 策略


    关于 IoT 的第一章是关于 IoT 开发网络编程技术的教程。我也曾将这些相同的技术用于多人游戏开发、分布式虚拟现实系统，以及全球核试验监测系统的设计与实现中。这一章是独立的，与书中的任何其他材料没有联系。


    第二章向你展示如何使用 `OpenNLP` 库训练你自己的分类器、标记词性并通处理英语文本。这一章以及下一章关于使用 `Spark mllib` 库进行机器学习的章节都使用了机器学习技术。


    第四章提供了一个使用威斯康星大学癌症数据库进行异常检测的示例。第五章简要介绍了如何从网站上提取纯文本和半结构化数据。


    最后两章面向想要开发信息设计和知识管理技能的信息架构师或开发者。这些章节涵盖了链式数据（语义网网）和知识管理技术。


    示例的源代码可以在 https://github.com/mark-watson/power-java 找到，均根据 Apache 2 许可证发布。我尝试在示例中仅使用符合
    Apache 2 或 MIT 风格许可的现有库。通常我更倾向于像 `GPL`、`LGPL` 和 `AGPL` 这样的自由软件许可证，但对于书中预期读者有时会复用整个示例程序或至少是小段代码的情况来说，允许在商业产品使用的许可更有意义。


    该 github 仓库中每个章节都有一个子目录，每个子目录都有自己的 `maven pom.xml` 文件用于构建和运行示例。


    这五章之间是相互独立的，因此在阅读和尝试示例程序时，请随时跳跃阅读。


    本书可在 https://leanpub.com/powerjava 购买。


    你可能对我通过 leanpub 自行出版的其他书籍感兴趣：


    * [使用 Java 进行实用的人工智能编程](https://leanpub.com/javaai)

    * [热爱 Common Lisp，或精明程序员的秘密武器](https://leanpub.com/lovinglisp)

    * [使用 JavaScript 构建智能系统](https://leanpub.com/aijavascript)


    我以前由 Springer-Verlag、McGraw-Hill、Morgan Kaufman、APress、Sybex、M&T Press 和 J. Wiley
    出版的旧书籍列在[我网站的书籍页面](http://markwatson.com/books/) 上。


    本书的一个主要主题是机器学习。除了我的[通用技术博客](https://blog.markwatson.com) 之外，我还有一个关于机器学习和认知技术的独立博客：[blog.cognition.tech](http://blog.cognition.tech/?view=classic)
    以及一个[支持认知技术的网站](http://cognition.tech/)。


    ### 物联网的动机


    本章将向你展示开发物联网项目和产品相关的网络编程技术，使用本地 TCP/IP 和 UDP 网络。我们不会涵盖硬件设计或物联网用户体验的设计。具体来说，我们将研究使用本地目录服务发布和查找服务的技术，以及使用
    UDP、组播和广播进行高效通信的技术。


    这一章是关于网络编程技术的教程，我相信它对开发物联网应用程序非常有用。关于用户 协议和组播的内容对网络游戏开发也有用。


    我没有涵盖一些重要的内容：用户体验和设备的设计，以及使用本地低功电无线连接协作设备的物联网设备。尽管如此，思考驱动物联网开发的动机是值得的，我们将在下一节进行讨论。


