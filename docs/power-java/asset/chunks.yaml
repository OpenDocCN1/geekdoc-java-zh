    \ Postgres as a Local Document Store with Text Search\n\nWe will now develop a\
    \ simple set of utiltity classes for easily string structured data and “less structured”\
    \ JSON data in a Postgres database. We will also provide support for text search\
    \ in database columns containing text data.\n\nI use many different data stores\
    \ in my work: Amazon S3 and DynamoDB, Google Big Table, Hadoop File System, MongoDB,\
    \ CouchDB, Cassandra, etc. Lots of good options for different types of projects!\n\
    \nThat said, Postgres is my “Swiss Army knife” data store offering a rock solid\
    \ relational database, full text indexing, and native support for schema less\
    \ native JSON documents. I this short section I am going to cover JDBC access\
    \ to Postgres and cover the common use cases that you might need if you also want\
    \ to use Postgres as your “Swiss Army knife” data store.\n"
