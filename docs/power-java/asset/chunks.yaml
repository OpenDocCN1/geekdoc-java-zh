    \ the N3 notation. As another example, suppose that this news article also mentions\
    \ the USA. Instead of adding a whole new statement like this:\n\n```\n1     @prefix\
    \ kb:  <http://knowledgebooks.com/ontology#> .\n2     <http://news.com/201234\
    \ /> kb:containsCountry \"China\"  .\n3     <http://news.com/201234 /> kb:containsCountry\
    \ \"USA\"  .\n```\n\nwe can combine them using N3 notation. N3 allows us to collapse\
    \ multiple RDF statements that share the same subject and optionally the same\
    \ predicate:\n\n```\n1     @prefix kb:  <http://knowledgebooks.com/ontology#>\
    \ .\n2     <http://news.com/201234 /> kb:containsCountry \"China\" ,\n3      \
    \                                             \"USA\" .\n```\n\nWe can also add\
    \ in additional predicates that use the same subject:\n\n```\n 1     @prefix kb:\
    \  <http://knowledgebooks.com/ontology#> .\n 2 \n 3     <http://news.com/201234\
    \ /> kb:containsCountry \"China\" ,\n 4                                      \
    \             \"USA\" .\n 5         kb:containsOrganization \"United Nations\"\
    \ ;\n 6         kb:containsPerson \"Ban Ki-moon\" , \"Gordon Brown\" ,\n 7   \
    \                        \"Hu Jintao\" , \"George W. Bush\" ,\n 8            \
    \               \"Pervez Musharraf\" ,\n 9                           \"Vladimir\
    \ Putin\" , \n10                           \"Mahmoud Ahmadinejad\" .\n```\n\n\
    This single N3 statement represents ten individual RDF triples. Each section defining\
    \ triples with the same subject and predicate have objects separated by commas\
    \ and ending with a period. Please note that whatever RDF storage system we use\
    \ (we will be using Sesame) it makes no difference if we load RDF as XML, N-Triple,\
    \ of N3 format files: internally subject, predicate, and object triples are stored\
    \ in the same way and are used in the same way.\n\nI promised you that the data\
    \ in RDF data stores was easy to extend. As an example, let us assume that we\
    \ have written software that is able to read online news articles and create RDF\
    \ data that captures some of the semantics in the articles. If we extend our program\
    \ to also recognize dates when the articles are published, we can simply reprocess\
    \ articles and for each article add a triple to our RDF data store using a form\
    \ like:\n\n```\n1     <http://news.com/201234 /> kb:datePublished\n2         \
    \                       \"2008-05-11\" .\n```\n\nFurthermore, if we do not have\
    \ dates for all news articles that is often acceptable depending on the application.\n\
    \nSPARQL is a query language used to query RDF data stores. While SPARQL may initially\
    \ look like SQL, there are some important differences like support for RDFS and\
    \ OWL inferencing. We will cover the basics of SPARQL in this section.\n\nWe will\
    \ use the following sample RDF data for the discusion in this section:"
