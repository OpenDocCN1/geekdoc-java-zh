    \ \"White House\" ,\n                                 \"Obama administration\"\
    \ ,\n                                 \"Iraqi government\" ;\n        kb:containsPerson\
    \ \"David Petraeus\" ,\n                            \"John McCain\" ,\n      \
    \                      \"Hoshiyar Zebari\" ,\n                            \"Barack\
    \ Obama\" ,\n                            \"George W. Bush\" ,\n              \
    \              \"Carly Fiorina\" ;\n        kb:containsIndustryTerm \"oil prices\"\
    \ .\n```\n\n---\n\n在接下来的示例中，我们将查看查询而不查看结果。我们将从一个针对主体的（subjects）的简单 SPARQL 查询开始。\n\
    \n在接下来的示例中，我们将查看查询而不查看结果。我们将从一个针对主体的（subjects）的简单 SPARQL 查询开始。\n\n在接下来的示例中，我们将查看查询而不查看结果。我们将从一个针对主体的（subjects）的简单\
    \ SPARQL 查询开始。\n\n在接下来的示例中，我们将查看查询而不查看结果。\n\n---\n\n...主体（新闻文章 URL）和对象（匹配的三元组）：\n\
    \n```sparql\n    SELECT ?subject\n    WHERE {\n        ?subject <knowledgebooks.com/ontology#>containsCountry\n\
    \    }\n```\n\n---\n\n当 WHERE 子句包含多个三元组模式时，这等同于“与”操作。DISTINCT 子句会去除重复结果。ORDER\
    \ BY 子句会对输出进行字母排序：在此情况下首先按属性（containsCity, containsCountry 等），然后按对象。LIMIT 修饰符限制返回的结果，OFFSET\
    \ 修饰符设置跳过的匹配结果数量。\n\n```sparql\n    PREFIX kb:<http://knowledgebooks.com/ontology#>\n\
    \    SELECT ?subject ?a_predicate ?an_object\n    WHERE {\n        ?subject:containsCountry\n\
    \    }\n    DISTINCT\n    ORDER BY ?a_predicate ?an_object\n    LIMIT 10\n   \
    \ OFFSET 5\n```\n\n---\n\n我们也可以对任何其他谓进行过滤，例如查找精确为“Maryland”的文章。接下来的查询是从 Java 文件复制的，因此你不需要转义标记。\n\
    \n```sparql\n    PREFIX kb:<http://knowledgebooks.com/ontology#>\n    SELECT ?subject\n\
    \    WHERE { ?subject:containsState \"Maryland\" }\n```\n\n---\n\n我们还可以使用正则表达式匹配部分字符串字面量：\n\
    \n```sparql\n    PREFIX kb:<http://knowledgebooks.com/ontology#>\n    SELECT ?subject\
    \ ?object\n    WHERE {\n        ?subject:containsOrganization\n        ?object\
    \ FILTER(?object, \"University\")\n    }\n```\n\n---\n\n在最后一个示例查询之前，我们只请求查询匹配三元组的主体和属性的值。然而，我们可能希望返回主体（在本例中为新闻文章\
    \ URI）的所有匹配三元组。注意这里有两个匹配的三元组，每个都以句号结尾：\n\n```sparql\n    PREFIX kb:<http://knowledgebooks.com/ontology#>\n\
    \    SELECT ?subject ?a_predicate ?an_object\n    WHERE {\n        ?subject:containsOrganization\n\
    \        ?object FILTER(?object, \"University\") .\n\n        ?subject ?a_predicate\
    \ ?an_object .\n    }\n```\n\n---\n\n我们结束了关于 SELECT 查询形式的快速教程。还有三种查询形式我没有在本章中介绍：\n\
    \n*   `CONSTRUCT` – 返回查询结果的新型 RDF 图\n*   `ASK` – 返回布尔值真或假，表示查询是否匹配任何三元组\n*   `DESCRIBE`\
    \ – 返回包含匹配资源的新型 RDF 图\n\n### SPARQL 查询客户端\n\n有很多可用的公共 RDF 数据。一些公开可用的 SPARQL 端点（endpoints）如下：\n\
    \n"
- fmt: "\n*   [DBPedia](http://dbpedia.org/sparql) which encodes the structured information\
    \ in Wikipedia info boxes as RDF data. The DBPedia data is also available as a\
    \ free download for hosting on your own `SPARQL` endpoint.\n\n*   [LinkDb](http://www.genome.jp/linkdb/linkdb_rdf.html)\
    \ Which contains human genome data.\n\n*   [Library of Congress](http://id.loc.gov/techcenter/searching.html)\
    \ There is currently no SPARQL endpoint provided but subject matter Sparql data\
    \ is available for download for use on your own SPARQL endpoint and there is a\
    \ search faclity that can return RDF data results.\n\n*   [BBC Programs and Music](http://lod.openlinksw.com/sparql/)\n\
    \n*   [FactForge](http://factforge.net/sparql) Combines RDF data from a many sources\
    \ including DBPedia, Geonames, Wordnet, and Freebase. The SPARQL query page has\
    \ many great examples to get you started. For example, look at the SPARQL for\
    \ the query and results for “Show the distance from London of airports located\
    \ at most 50 miles away from it.”\n\nThere are many public SPARQL endpoints on\
    \ the web but I need to warn you that they are not always available. The raw RDF\
    \ data for most public endpoints is usually available so if you are building a\
    \ system relying on a public data set you should consider hosting a copy of the\
    \ data on one of your own servers. I usually use one of the following RDF repositories\
    \ and SPARQL query interfaces: [Star Dog](http://stardog.com/), [Virtuoso](http://virtuoso.openlinksw.com/),\
    \ and [Sesame](http://rdf4j.org/). That said, there are many other fine RDF repository\
    \ server options, both commercial and open source. After reading this chapter,\
    \ you may want to read a fairly recent [blog article](http://blog.markwatson.com/2014/07/using-opencyc-rdfowl-data-in-stardog.html)\
    \ I wrote for importing and using the OpenCYC world knowledge base in to a local\
    \ repository.\n\nIn the next two sections you will learn how to make SPARQL queries\
    \ against RDF data stores on the web, getting results both as JSON and parsed\
    \ out to Java data values. A major theme in the next chapter is combining data\
    \ in the “cloud” with local data.\n\n### JSON Client\n\n```\n 1 package com.markwatson.linkeddata;\n\
    \ 2 \n3 import org.apache.http.HttpResponse;\n 4 import org.apache.http.client.methods.HttpGet;\n\
    \ 5 import org.apache.http.impl.client.DefaultHttpClient;\n 6 \n7 import java.io.BufferedReader;\n\
    \ 8 import java.io.InputStreamReader;\n 9 import java.net.URLEncoder;\n10 \n11\
    \ public class SparqlClientJson {\n12   public static String query(String endpoint_URL,\
    \ String sparql)\n13                        throws Exception {\n14     StringBuffer\
    \ sb = new StringBuffer();\n15     try {\n16       org.apache.http.client.HttpClient\
    \ httpClient =\n17 \t    new DefaultHttpClient();\n18       String req = URLEncoder.encode(sparql,\
    \ \"utf-8\");\n19       HttpGet getRequest =\n20           new HttpGet(endpoint_URL\
    \ + \"?query=\" + req);\n21       getRequest.addHeader(\"accept\", \"application/json\"\
    );\n22       HttpResponse response = httpClient.execute(getRequest);\n23     \
    \  if (response.getStatusLine().getStatusCode() != 200)\n24 \t     return \"Server\
    \ error\";\n25 \n26       BufferedReader br =\n27           new BufferedReader(\n\
    28               new InputStreamReader(\n29 \t\t\t\t   (response.getEntity().getContent())));\n\
    30       String line;\n31       while ((line = br.readLine()) != null) {\n32 \
    \        sb.append(line);\n33       }\n34       httpClient.getConnectionManager().shutdown();\n\
    35     } catch (Exception e) {\n36       e.printStackTrace();\n37     }\n38  \
    \   return sb.toString();\n39   }\n40 }\n```\n\nWe will be using the SPARQL query\
    \ for finding people who were born in Arizona:\n\n```\n1 PREFIX foaf: <http://xmlns.com/foaf/0.1/>\n\
    2         PREFIX dbpedia2: <http://dbpedia.org/property/>\n3         PREFIX dbpedia:\
    \ <http://dbpedia.org/>\n4         SELECT ?name ?person WHERE {\n5           \
    \   ?person dbpedia2:birthPlace <http://dbpedia.org/resource/Arizona> .\n6   \
    \           ?person foaf:name ?name .\n7         }\n8         LIMIT 10\n```\n\n\
    You can run the unit tests for the DBPedia lookups and SPARQL queries using:\n\
    \n```\n1 mvn test -Dtest=DBPediaTest\n```\n\nHere is a small bit of the output\
    \ produced when running the unit test for this class with this example SPARQL\
    \ query:\n\n```\n{\n  \"head\": {\n    \"link\": [],\n    \"vars\": [\n      \"\
    name\",\n      \"person\"\n    ]\n  },\n  \"results\": {\n    \"distinct\": false,\n\
    \    \"ordered\": true,\n    \"bindings\": [\n      {\n        \"name\": {\n \
    \         \"type\": \"literal\",\n          \"xml:lang\": \"en\",\n          \"\
    value\": \"Ryan David Jahn\"\n        },\n        \"person\": {\n          \"\
    type\": \"uri\",\n          \"value\": \"http://dbpedia.org/resource/Ryan_David_Jahn\"\
    \n        }\n      }\n    ]\n  }\n}\n```\n\nThere are many public SPARQL endpoints\
    \ on the web but I need to warn you that they are not always available. The raw\
    \ RDF data for most public endpoints is usually available so if you are building\
    \ a system relying on a public data set you should consider hosting a copy of\
    \ the data on one of your own servers. I usually use one of the following RDF\
    \ repositories and SPARQL query interfaces: [Star Dog](http://stardog.com/), [Virtuoso](http://virtuoso.openlinksw.com/),\
    \ and [Sesame](http://rdf4j.org/). That said, there are many other fine RDF repository\
    \ server options, both commercial and open source. After reading this chapter,\
    \ you may want to read a fairly recent [blog article](http://blog.markwatson.com/2014/07/using-opencyc-rdfowl-data-in-stardog.html)\
    \ I wrote for importing and using the OpenCYC world knowledge base in to a local\
    \ repository.\n\n### DBPedia Lookup\n\nThe DBPedia Lookup service returns XML\
    \ response data by default. The `DBpediaLookupClient` class is fairly simple.\
    \ It encodes a query string, calls the web service, and parses the XML payload\
    \ that is returned from the service.\n\n### Java Data\n\n```\n1 public class DBpediaLookupClient\
    \ extends DefaultHandler {\n2   public DBpediaLookupClient(String query) throws\
