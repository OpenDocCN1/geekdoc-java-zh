    ;\n  static int PORT = 9005;\n  static int PACKETSIZE = 256;\n\n  public static\
    \ void main(String args[]) throws IOException {\n    InetAddress host = InetAddress.getByName(INET_ADDR);\n\
    \    DatagramSocket socket = new DatagramSocket();\n    byte[] data = (\"Hello\
    \ Server\" + System.currentTimeMillis()).getBytes();\n    DatagramPacket packet\
    \ = new DatagramPacket(data, data.length, host, PORT);\n    socket.send(packet);\n\
    \    socket.setSoTimeout(1000); // 1000 milliseconds\n    packet.setData(new byte[PACKETSIZE]);\n\
    \    socket.receive(packet);\n    System.out.println(new String(packet.getData()));\n\
    \    socket.close();\n  }\n}\n```\n\nRunning this example produces the following\
    \ output (edited to fit the page width):\n\n```\n> java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n         com.markwatson.iot.UDPClient\nfrom server - Hello Server1431540275433\n\
    ```\n\nI have used `UDP` network programming in many projects and I will mention\
    \ two of them here. In the 1980s I was an architect and developer on the NMRD\
    \ project that used 38 seismic research stations around the world to collect data\
    \ that we used to determine if any country was conducting nuclear explosive tests.\
    \ We used a guaranteed messaging system for meta control data but used low level\
    \ `UDP` for much of the raw data transfer. The other application was communcations\
    \ library for networked racecar and hovercraft games that ran on a local network.\
    \ `UDP` is very good for local network game development because it is efficient\
    \ and the chance of losing data packets is very low and even if packets are lost\
    \ game play is usually not affected. Remember that when using `UDP` you are not\
    \ guaranteed delivery of data and not guaranteed notification of failure!\n\n\
    ### Multicast/Broadcast Network Programming\n\nThe examples in the next two sections\
    \ are similar to the examples in the last two sections with one main difference:\
    \ a server periodically broadcasts data using `UDP`. The server does not care\
    \ if any client is listening or not, it simply broadcasts data. If any clients\
    \ are listening they will probably receive the data. I say that they will probably\
    \ receive the data because `UDP` provides no delivery guarantees.\n\nThere are\
    \ specific `INET` addresses that can be used for local multicast in the range\
    \ of addresses between `224.0.0.0` and `224.0.0.255`. We will use `224.0.0.5`\
    \ in the two example programs. These are local addresses that are invisible to\
    \ the the Internet.\n\n#### Multicast Broadcast Server\n\nThe following example\
    \ is very similar to that seen two sections ago (Java class `UDPServer`) except\
    \ we do not wait for a client request.\n\n```\npackage com.markwatson.iot;\n\n\
    import java.io.IOException;\nimport java.net.*;\n\npublic class MulticastServer\
    \ {\n\n  final static String INET_ADDR = \"224.0.0.5\";\n  final static int PORT\
    \ = 9002;\n\n  public static void main(String[] args)\n      throws IOException,\
    \ InterruptedException {\n    InetAddress addr = InetAddress.getByName(INET_ADDR);\n\
    \    DatagramSocket serverSocket = new DatagramSocket();\n    for (int i = 0;\
    \ i < 10; i++) {\n      String message = \"message \" + i;\n\n      DatagramPacket\
    \ messagePacket =\n          new DatagramPacket(message.getBytes(),\n        \
    \      message.getBytes().length, addr, PORT);\n      serverSocket.send(messagePacket);\n\
    \n      System.out.println(\"broadcast message sent: \" + message);\n      Thread.sleep(500);\n\
    \    }\n  }\n}\n```\n\nIn line 13 we create an `INET` address for `224.0.0.5`\
    \ and in line 14 create a `DatagramSocket` that is reused for broadcasting 10\
    \ messages with a time delay of 1/2 a second between messages. The broadcast messages\
    \ are defined in line 16 and the code in lines 18 to 21 creates a new `DatagramPacket`\
    \ with the message text data and gets broadcast to the local network in line 21.\n\
    \nRunning this example produces the following output (output edited for brevity):\n\
    \n```\n> java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar com.markwatson.iot.\\\
    \nMulticastServer\nbroadcast message sent: message 0\nbroadcast message sent:\
    \ message 1\n ...\nbroadcast message sent: message 8\nbroadcast message sent:\
    \ message 9\n```\n\nUnlike the `UDPServer` example two sections ago, you will\
    \ get this output regardless of whether you are running the listing client in\
    \ the next section.\n\n#### Multicast Broadcast Listener\n\nThe example in this\
    \ section listens for broadcasts by the server example in the last section. The\
    \ broadcast server and clients need to agree on the `INET` address and a port\
    \ number.\n\n```\npackage com.markwatson.iot;\n\nimport java.io.IOException;\n\
    import java.net.DatagramPacket;\nimport java.net.InetAddress;\nimport java.net.MulticastSocket;\n\
    import java.net.UnknownHostException;\n\npublic class MulticastClient {\n\n  final\
    \ static String INET_ADDR = \"224.0.0.5\";\n  final static int PORT = 9002;\n\n\
    \  public static void main(String[] args) throws IOException {\n    InetAddress\
    \ address = InetAddress.getByName(INET_ADDR);\n    byte[] buf = new byte[512];\n\
    \    MulticastSocket clientSocket = new MulticastSocket(PORT);\n    clientSocket.joinGroup(address);\n\
    \n    while (true) {\n      DatagramPacket messagePacket = new DatagramPacket(buf,\
    \ buf.length);\n      clientSocket.receive(messagePacket);\n      String message\
    \ = new String(buf, 0, buf.length);\n      System.out.println(\"received broadcast\
    \ message: \" + message);\n    }\n  }\n}\n```\n\nIn line 15 we create an `InetAddress`\
    \ and in line 16 allocate storage for the received text messages. We create a\
    \ `MulticastSocket` on port `9002` in line 17 and in line 19 join the server’s\
    \ group. In lines 21 through 27 we loop forever listening for broadcast messages\
    \ and printing them out.\n\nRunning this example produces the following output\
    \ (output edited for brevity):\n\n```\n> java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n         com.markwatson.iot.MulticastClient\nreceived broadcast message:\
    \ message 0\nreceived broadcast message: message 1\n ...\nreceived broadcast message:\
    \ message 8\nreceived broadcast message: message 9\n```\n\n### Wrap Up on IoT\n\
    \nEven though I personally have some concerns about security and privacy for IoT\
    \ applications and products, I am enthusiastic about the possibilities of making\
    \ our lives simpler and more productive with small networked devices. When we\
    \ work and play we want as much as possible to not think about our computing devices\
    \ so that we can concentrate on our activities.\n\nI have barely scratched the\
    \ surface on useful IoT technologies in this chapter but I hope that I have shown\
    \ you network programming techniques that you can use in your projects (IoT and\
    \ also networked game programming). As I write this book there are companies supplying\
    \ IoT hardware development kits and deciding on one kit and software framework\
    \ and creating your own projects is a good way to proceed.\n\n## Natural Language\
    \ Processing Using OpenNLP\n\nI have worked in the field of Natural Language Processing\
    \ (NLP) since the early 1980s. Many people are interested in the field of NLP\
    \ and the techniques have changed drastically. NLP has usually been considered\
    \ part of the field of artificial intelligence (AI) and in the 1980s and 1990s\
    \ there was more interest in symbolic AI, that is the manipulation of high level\
    \ symbols that are meaningful to people because of our knowledge of the real world.\
