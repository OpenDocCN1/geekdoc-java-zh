    CityNamesDbpedia.txt\");\n53   }\n54 }\n```\n\n`TextToDbpediaUris` 类使用了在 `NerMaps`\
    \ 类中定义的九种 NER 类型。在接下来的列表中，为了简练起见，未显示所有关于广播新闻网络 NER 类的全部代码：\n\n"
- fmt: "\n```java\npackage com.markwatson.ner_dbpedia;\n\npublic class TextToDbpediaUris\
    \ {\n  private TextToDbpediaUris() {\n  }\n\n  public TextToDbpediaUris(String\
    \ text) {\n    String[] tokens = tokenize(text + \" . . .\");\n    String s =\
    \ \"\";\n    for (int i = 0, size = tokens.length - 2; i < size; i++) {\n    \
    \  String n2gram = tokens[i] + \" \" + tokens[i + 1];\n      String n3gram = n2gram\
    \ + \" \" + tokens[i + 2];\n      // check for 3grams:\n      if ((s = NerMaps.broadcastNetworks.get(n3gram))\
    \ != null) {\n        log(\"broadcastNetwork\", i, i + 2, n3gram, s);\n      \
    \  i += 2;\n        continue;\n      }\n\n      // check for 2grams:\n      if\
    \ ((s = NerMaps.broadcastNetworks.get(n2gram)) != null) {\n        log(\"broadCastNetwork\"\
    , i, i + 1, n2gram, s);\n        i += 1;\n        continue;\n      }\n\n     \
    \ // check for 1grams:\n      if ((s = NerMaps.broadcastNetworks.get(tokens[i]))\
    \ != null) {\n        log(\"broadCastNetwork\", i, i + 1, tokens[i], s);\n   \
    \     continue;\n      }\n    }\n  }\n\n  /** In your applications you will want\
    \ to subclass TextToDbpediaUris\n   * and override `log` to do something with\
    \ the\n   * DBPedia entities that you have identified.\n   * @param nerType\n\
    \   * @param index1\n   * @param index2\n   * @param ngram\n   * @param uri\n\
    \   */\n  void log(String nerType, int index1, int index2, String ngram, String\
    \ uri) {\n    System.out.println(nerType + \"\\t\" + index1 + \"\\t\" + index2\
    \ + \"\\t\" + ngram + \\\n    \"\\t\" + uri);\n  }\n\n  private String[] tokenize(String\
    \ s) {\n    return s.replaceAll(\"\\\\.\", \" \\\\. \").replaceAll(\",\", \" ,\
    \ \")\n        .replaceAll(\"\\\\?\", \" ? \").replaceAll(\"\\n\", \" \").replaceAll(\"\
    ;\", \" ; \").split(\" \");\n  }\n}\n```\n\nHere is an example showing how to\
    \ use this code and the output:\n\n```\nString s = \"PTL Satellite Network covered\
    \ President Bill Clinton going to Guatemala and visiting the Cocoa Cola Company.\"\
    ;\nTextToDbpediaUris test = new TextToDbpediaUris(s);\n```\n\n```\nbroadcastNetwork\
    \ 0 2 PTL Satellite Network\t<http://dbpedia.org/resource/PTL_Satelite_Network>\n\
    person   5  6 Bill Clinton <http://dbpedia.org/resource/Bill_Clinton>\ncountry\
    \  9 10 Guatemala    <http://dbpedia.org/resource/Guatemala>\ncompany 13 14 Coca\
    \ Cola    <http://dbpedia.org/resource/Coca-Cola>\n```\n\nThe second and third\
    \ values are word indices (first word in sequence and last word in sequence from\
    \ the input tokenized text).\n\nThere are many types of applications that can\
    \ benefit from using “real world” information from sources like DBPedia.\n\n###\
    \ Combining Data from Public and Private Sources\n\nA powerful idea is combining\
    \ public and private linked data; for example, combining the vast real world knowledge\
    \ stored in DBPedia with an RDF data store containing private data specific to\
    \ your company. There are two ways to do this:\n\n* Use SPARQL queries to join\
    \ data from multiple SPARQL endpoints\n* Assuming you have an RDF repository of\
    \ private data, import external sources like DBPedia into your local data store\n\
    \nIt is beyond the scope of my coverage of SPARQL but data can be joined from\
