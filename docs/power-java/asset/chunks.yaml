    While the technical details of that book are still relevant, I am now more opinionated
    about which linked data and semantic web technologies are most useful so this
    chapter is more focused. With some improvements, I use the Java client code for
    DBPedia search and `SPARQL` queries from my previous book. I also include new
    versions that return query results as JSON. I am going to assume that you have
    fetched a free copy of my book “Practical Semantic Web and Linked Data Applications”
    and use chapters 6 and 7 for an introduction to the Resource Definition Language
    (`RDF` and `RDFS`) and chapter 8 for a tutorial on the `SPARQL` query language.
    It is okay to read this background material later if you want to dive right into
    the examples in this chapter. I do provide a quick introduction to `SPARQL` and
    `RDF` i the next section, but please do also get a free copy of my semantic web
    book for a longer treatment. We use the standard query language `SPARQL` to retrieve
    information from `RDF` data sources in much the same way that we use `SQL` to
    retrieve information from relational databases.


    In this chapter we will look at consuming linked data using `SPARQL` queries against
    public `RDF` data stores and searching DBPedia. Using the code from the earlier
    chapter “Natural Language Processing Using OpenNLP” we will also develop an example
    application that annotates text by tagging entities with unique DBPedia `URIs`
    for the entities (we will use this example also in the next chapter in a code
    example for knowledge Management).


    ## Why use linked data?


    Before we jump into technical details I want to give you some motivation for why
    you might use linked data and semantic web technologies to organize and access
    information. Suppose that your company sells products to customers and your task
    is to augment the relational databases used for ordering, shipping, and customer
    data with a new system that needs to capture relationships between products, customers,
    and information sources on the web that might help both your customers and customer
    support staff increase the utility of your products to your customers.


    Customers, products, and information sources are entities that will sometimes
    be linked with properties or relationships with other entities. This new data
    will be unstructured and you do not know ahead of time all of the relationships
    and what new types of entities that the new system will use. If you come from
    a relational database background using a sort of graph database might be uncomfortable
    at first. As motivation consider that Google uses its Knowledge Graph (I customized
    the Knowledge Graph when I worked at Google) for internal applications, to add
    value to search results, and to power Google Now. Facebook uses its Open Graph
    to store information about uses, user posts, and relationships between users and
    posted material. These graph data stores are key assets for Google and Facebook.
    Just because you don’t deal with huge amounts of data does not mean that the flexibility
    of graph data is not useful for your projects! We will use the DBPedia graph database
    in this chapter for the example programs. DBPedia (which Google used as core knowledge
    when developing their Knowledge Graph) is a rich information source for typed
    data for products, people, companies, places, etc. Connecting internal data in
    your organization to external data sources like DBPedia increases the utility
    of yor private data. You can make this data sharing relationship symmetrical by
    selectively publishing some of your internal data externally as linked data for
    the benefit of your customers and business partners.


    The key idea is to design the shape of your information (what entities do you
    deal with and what types of properties or relationships exist between different
    types of entities), ingest data into a graph database with a plan for keeping
    everything up to date, and then provide APIs or a query language so application
    programmers can access this linked data when developing new applications. In this
    chapter we will use semantic web standards with the `SPARQL` query language to
    access data but these ideas should apply to using other graph databases like `Neo4J`
    or non-relational data stores like `MongoDB` or `CouchDB`.


    ## Example Code


    The examples for this chapter are set up to run either from the command line or
    using IntelliJ.


    There are three examples in this chapter. If you want to try running the code
    before reading the rest of the chapter, run each `maven` test separately:


    ```

    1     mvn test -Dtest=AnnotationTest

    2     mvn test -Dtest=DBPediaTest

    3     mvn test -Dtest=SparqlTest

    ```


    The following figure shows the project for this chapter in the Community Edition
    of IntelliJ:


    ![IntelliJ project view for the examples in this chapter](images/00024.jpeg)


    IntelliJ project view for the examples in this chapter


    ## Overview of RDF and SPARQL


    The Resource Description Framework (`RDF`) is used to store information as subject/predicate/object
    triple values. `RDF` data was originally encoded as `XML` and intended for automated
    processing. In this chapter we will use two simple to read formats called “N-Triples”
    and “N3.” `RDF` data consists of a set of triple values:


    * subject

    * predicate

    * object


    As an example, suppose our application involved news stories and we wanted a way
    to store and query meta data. We might do this by extracting semantic information
    from the text, and storing it in `RDF`. I will use this application domain for
    the examples in this chapter. We might use triples like:


    * subject: a URL (or `URI`) of a news article

    * predicate: a relation like “containsPerson”

    * object: a value like “Bill Clinton”


    As previously mentioned, we will use either `URIs` or string literals as values
    for subjects and objects. We will always use `URIs` for the values of predicates.
    In any case `URIs` are usually preferred to string literals because they are unique.
    We will see an example of this preferred use but first we need to learn the N-Triple
    and N3 formats.


    Any part of a triple (subject, predicate, or object) is either a `URI` or string
    literal. `URIs` encode namespaces. For example, the containsPerson predicate in
    the last example could properly be written as:


    ```http://knowledgebooks.com/ontology/#containsPerson own```


    The first part of this `URI` is considered to be the namespace for (what we will
    use as a predicate) “containsPerson.” When different `RDF` triples use this same
    predicate, this is some assurance to us that all users of this predicate subscribe
    to the same meaning. Furthermore, we will see in [Section on RDFS](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)
    that we can use `RDFS` to state equivalency between this predicate (in the namespace
    http://knowledgebooks.com/ontology/) with predicates represented by different
    `URIs` used in other data sources. A statement in N-Triple format consists of
    three `URIs` (or string literals – any combination) followed by a period to end
    the statement. While statements are often written one per line in a source file
    they can be broken across lines; it is the ending period which marks the end of
    a statement. The standard file extension for N-Triple format files is `*.nt` and
    the standard format for N3 format files is `*.n3`.

