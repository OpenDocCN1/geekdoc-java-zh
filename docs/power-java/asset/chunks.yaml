    ### 使用 word2vec 查找文档中的相似词


    Google 以 Apache 2 许可证发布了他们的开源 `word2vec` 库。[Deeplearning4j](http://deeplearning4j.org)
    项目和 Spark 的 MLlib 都包含了其实现。在我撰写这一章时，Deeplearning4j 版本具有更高的灵活性，但我们在这里将使用 MLlib 版本。我们将在后面的章节中介绍
    Deeplearning4j。在本节中，我们将使用 Deeplearning4j 项目的示例数据文件。


    `word2vec` 库可以识别文本中哪些词与文本中的其他词密切相关。如果你在大型英语文本样本上运行 `word2vec`，你会发现单词 woman 与 man
    密相关，child 与 mother 密相关，road 与 car 密相关等等。


    接下来的列表显示了 `Word2VecRelatedWords` 类，它非常简单，因为我们只需要对文本进行分词，丢弃噪声词（或停用词），并将输入文本转换为正确的
    Spark 数据类型，以便 MLlib 类 `Word2VecModel` 进行处理。


