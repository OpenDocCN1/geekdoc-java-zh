    \n输出结果为：\n\n```\nnum_rows = 0\n```\n\n关于 NoSQL 数据存储存在大量的炒作，其中一些炒作是名之其实的：当你有海量数据需要处理时，通过\
    \ Hadoop 文件系统或 `Cassandra` 等系统将数据分布到许多服务器上，可以允许你使用许多低成本的服务器来处理大型数据集。尽管如此，对于许多应用程序来说，你的数据集并不大，因此使用像\
    \ `Postgres` 这样的通用数据库系统更有意义。理想情况下，你会将数据访问封装在自己的代码中，以尽量减少在未来切换数据存储系统时的代码更改。\n\n\
    ## 总结\n\n我的职业生涯大部分时间都致力于构建存储和提供信息访问系统，以支持自动化和人工参与的系统。知识管理是计算机科学的一个分支，它帮助将数据转化为信息，再将信息转化为知识。我将这一章命名为“轻量级知识管理”，因为我只是为你自己的\
    \ `KM` 项目提供一些想法，并希望能够改善你对数据存储和使用的看法。\n\n## 结语\n\n这本书向你提供了关于如何使用机器学习、自然语言处理和各种数据存储技术来处理信息的个人观点。我的希望是我关于构建软件系统的一些想法至少能对你有所帮助，并为你在设计和构建应用程序时提供可以利用的思路。\n\
    \n我关于构建解决世界现实问题的系统的一通用哲学包括以下几点：\n\n- 将学习新技术作为一种背景练习，以“保持工具箱完整”。这在如今技术快速变化的当下尤为重要，而且新技术往往能让实现新功能变得更加容易。我写这本书的一个主要原因是向你介绍我发现的最实用的技术。\n\
    - 确保你解决的是正确的问题。构建对你的公司、组织以及整个世界产生影响的系统，通过构建你认为将产生最大积极影响的事物。\n\n```\n顺颂商祺，\nMark\
    \ Watson  2015 年 11 月 10 日\n```\n\n"
