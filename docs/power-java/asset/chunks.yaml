- fmt: "\n```\n results = pcon.doQuery(\n        \"select * from test where to_tsvector(description)\
    \ @@ to_tsquery('\" +\n        search_string + \"')\");\n    System.out.println(\"\
    results = \" + results);\n```\n\nThe output is:\n\n```\nresults = [{name=Anita,\
    \ description=sister inlaw who lives in San Diego, id=1}]\n```\n\n```\n num_rows\
    \ = pcon.doUpdate(\"drop table test\");\n    System.out.println(\"num_rows = \"\
    \ + num_rows);\n```\n\nThe output is:\n\n```\nnum_rows = 0\n```\n\nThere is a\
    \ lot of hype concerning NoSQL data stores and some of this hype is well deserved:\
    \ when you have a massive amount of data to handle then splitting it accross many\
    \ servers with systems like the Hadoop File System or `Cassandra` allows you to\
    \ process large data sets using many lower cost servers. That said, for many applications,\
    \ you don’t have very large data sets so general purpose database systems like\
    \ `Postgres` make more sense. Ideally you will wrap data access in your own code\
    \ to minimize future code changes if you switch data stores.\n\n## Wrap Up\n\n\
    Much of my career has involved building systems to store and provide access to\
    \ information to support automated and user in the loop systems. Knowledge Management\
    \ is the branch of computer science that helps turn data into data into information\
    \ and information into knowledge. I titled this chapter “Knowledge Management-Lite”\
    \ because I am just providing you with ideas for your own `KM` projects and hopefully\
    \ changed for the better how you look at the storage and use of data.\n\n## Book\
    \ Wrap Up\n\nThis book has provided you with my personal views on how to process\
    \ information using machine learning, natural language processing, and various\
    \ data store technologies. My hope is that at least some of my ideas for building\
    \ software systems has been of use to you and given you ideas that you can use\
    \ when you design and build your applications.\n\nMy philosophy in general for\
    \ building systems that solve real problems in the world includes the following\
    \ system:\n\n- Learn new technologies as a background exercise to “keep a full\
    \ toolbelt.” This is especially important now that technology is changing rapidly\
    \ and often new technologies make it easier to implement new functionality. A\
    \ major reason that I wrote this book is to introduce you to some of the technology\
    \ that I have found to be most useful.\n- Make sure you solve the right problems.\
    \ Build systems that have an impact on your company or organization, and on the\
    \ world in general by building things that you think will have the greatest positive\
    \ impact.\n\n```\nBest regards,\nMark Watson  November 10, 2015\n```\n"
