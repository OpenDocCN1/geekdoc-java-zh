  trans: "\n自然语言处理（NLP）领域仍有许多工作是将单词视为符号的：句法解析器和语义解析器就是两个例子。发生变化的是对统计和机器学习技术的强烈依赖。在本章中，我们将使用开源的（Apache\
    \ 2 许可）`OpenNLP` 项目，该项目使用机器学习来创建语言模型。目前，`OpenNLP` 支持丹麦语、德语、英语、西班牙语、葡萄牙语和瑞典语。我在\
    \ github 仓库中包含了一些用于本章示例的英语训练模型。你可以在 [OpenNLP 1.5 模型页面](http://opennlp.sourceforge.net/models-1.5/)\
    \ 下载其他语言的模型（本书使用的是 `OpenNLP` 的 1..6.0 版本，该版本使用了 1.5 版本的模型）。\n\n在为我的咨询客户执行的一些 NLP\
    \ 项目中，我都会使用 `OpenNLP`。我还编写了自己的 NLP 工具包 [KBSPortal.com](http://kbsportal.com)，这是一款商业产品。对于可以使用\
    \ GPL 许可的客户，我有时会使用 [Stanford NLP 库](http://nlp.stanford.edu/)，它和 `OpenNLP` 一样是用\
    \ Java 编写的。\n\n下图显示了 IntelliJ 社区版中本章的项目：\n\n![本章示例的 IntelliJ 项目视图](img/00004.jpeg)\n\
    \n本章示例的 IntelliJ 项目视图\n\n我们将使用预训练模型来对文本进行分词分词（tokenizing），并识别输入文本中的机构名称、人名、地名以及单词的词性。我们还将训练一个新模型（github\
    \ 仓库中的 `opennlp/models/en-newscat.bin` 文件），用于识别输入文本的类别。关于使用你自己的训练数据训练新的最大熵分类模型的章节，可能是本章中你自己的项目中最常用的内容。我们将训练一个模型来识别\
    \ `COMPUTERS`（计算机）、`ECONOMY`（经济）、`HEALTH`（健康）和 `POLITICS`（政治）类别。之后，你应该具备使用自己的训练文本为应用程序所需的类别训练自己的模型的知识。我们还将使用包含\
    \ `OpenNLP` 分发版中的某些预训练模型，以及我们在下一章即将创建的分类模式——下一章我们将学习如何使用 Apache Spark 平台执行可扩展的机器学习算法，届时我们将研究处理大规模文本集的技术以发现信息。\n\
    \n在构建完分类模型后，我们将用一个有趣的话题结束本章：通过统计解析句子来发现输入文本中每个句子最可能的语言结构。在本书的其余部分我们将不再使用解析，因此如果你目前对将句子解析为名词短语和动词短语、专有名词、名词、形容词等语言组件感兴趣，可以跳过本章的最后一节。\n\
    \n### 使用 OpenNLP 预训练模型\n\n假设你已经克隆了本书的 github 仓库，可以使用以下命令获取 maven 依赖、编译代码并运行单元测试：\n\
    \n```\nmvn clean build test\n```\n\n模型文件（包括你将在章晚些时候学习构建的分类模型）位于 `models` 子目录下。`src/test/java/com/markwatson/opennlp/NLPTest.java`\
    \ 中的单元测试为我们在本章中开发的代码提供了示例。用于分词（将文本拆分为单个单词）、分句以及识别文本中的机构、地点和人物的 Java 示例代码都在 `NLP`\
    \ 类中。你可以查看本书仓库中的源代码。在这里我将仅展示几段代码片段，以明确如何加载和使用预训练模型。\n\n我使用静态类初始化来加载模型文件：\n\n```\n\
    \ 1   static public Tokenizer tokenizer = null;\n 2   static public SentenceDetectorME\
    \ sentenceSplitter = null;\n 3   static POSTaggerME tagger = null;\n 4   static\
    \ NameFinderME organizationFinder = null;\n 5   static NameFinderME locationFinder\
    \ = null;\n 6   static NameFinderME personNameFinder = null;\n 7 \n 8   static\
    \ {\n 9 \n10     try {\n11       InputStream organizationInputStream =\n12 \t\
    \    new FileInputStream(\"models/en-ner-organization.bin\");\n13       TokenNameFinderModel\
    \ model =\n14 \t    new TokenNameFinderModel(organizationInputStream);\n15   \
    \    organizationFinder = new NameFinderME(model);\n16       organizationInputStream.close();\n\
    17 \n18       InputStream locationInputStream =\n19 \t    new FileInputStream(\"\
    models/en-ner-location.bin\");\n20       model = new TokenNameFinderModel(locationInputStream);\n\
    21       locationFinder = new NameFinderME(model);\n22       locationInputStream.close();\n\
    23 \n24       InputStream personNameInputStream =\n25 \t    new FileInputStream(\"\
    models/en-ner-person.bin\");\n26       model = new TokenNameFinderModel(personNameInputStream);\n\
    27       personNameFinder = new NameFinderME(model);\n28       personNameInputStream.close();\n\
    29 \n30       InputStream tokienizerInputStream =\n31 \t    new FileInputStream(\"\
    models/en-token.bin\");\n32       TokenizerModel modelTokenizer = new TokenizerModel(tokienizerInputStream);\n\
    33       tokenizer = new TokenizerME(modelTokenizer);\n34       tokienizerInputStream.close();\n\
    35 \n36       InputStream sentenceInputStream =\n37 \t    new FileInputStream(\"\
    models/en-sent.bin\");\n38       SentenceModel sentenceTokenizer = new SentenceModel(sentenceInputStream);\n\
    39       sentenceSplitter = new SentenceModel(sentenceTokenizer);\n40       tokienizerInputStream.close();\n\
    41 \n42       organizationInputStream = new FileInputStream(\"models/pos-maxent.bin\"\
    );\n43       POSModel posModel = new POSModel(organizationInputStream);\n44  \
    \     tagger = new POSTaggerME(posModel);\n45 \n46     } catch (IOException e)\
    \ {\n47       e.printStackTrace();\n48     }\n49   }\n```\n\n你处理自然语言时的首要操作是将文本拆分为单个单词。这里是使用分词代码将存储为\
    \ Java String 的文本拆分为单个单词的示例：\n\n```\n1   public static String[] tokenize(String\
    \ s) {\n2     return tokenizer.tokenize(s);\n3   }\n```\n\n这里是将文本拆分为句子的类似代码：\n\
    \n```\n1   public static String[] sentenceSplitter(String s) {\n2     return sentenceSplitter.sentDetect(s);\n\
    3   }\n```\n\n这里是使用 `sentenceSplitter` 的一些示例代码：\n\n```\n1     String sentence\
    \ =\n2       \"Apple Computer, Microsoft, and Google are in the \" +\n3      \
    \ \" tech sector. Each is very profitable.\";\n4     String [] sentences = NLP.sentenceSplitter(sentence);\n\
    5     System.out.println(\"Sentences found:\\n\" + Arrays.toString(sentences));\n\
    ```\n\n在第 4 行，静态方法 `NLP.sentenceSplitter` 返回一个字符串数组。在第 5 行，我使用了一种常用的 Java 技巧，通过使用静态方法\
    \ `Arrays.toString` 将字符串数组转换为 `List<String>` 对象来打印数组。技巧在于 `List` 类有一个 `toString`\
    \ 方法，可以很好地格式化列表以便打印。\n\n这是此代码片段的输出（为了页面宽度和清晰度进行了编辑）：\n\n```\n1 Sentences found:\n\
    2   [\"Apple Computer, Microsoft, and Google are in the tech sector.\",\n3   \
    \ \"Each is very profitable.\"]\n```\n\n寻找机构、地点和人物的代码几乎相同，因此我只将在下一个识别地点的列表里显示代码。请查看\
    \ `com.markwatson.opennlp.NLP` 类中的 `companyNames` 和 `personNames` 方法以查看查找公司和人物名称的实现。\n"
- fmt: "\n```\n  public static Set<String> locationNames(String text) {\n    return\
    \ locationNames(tokenizer.tokenize(text));\n  }\n\n  public static Set<String>\
    \ locationNames(String tokens[]) {\n    Set<String> ret = new HashSet<String>();\n\
    \    Span[] nameSpans = locationFinder.find(tokens);\n    if (nameSpans.length\
    \ == 0) return ret;\n    for (int i = 0; i < nameSpans.length; i++) {\n      Span\
    \ span = nameSpans[i];\n      StringBuilder sb = new StringBuilder();\n      for\
    \ (int j = span.getStart(); j < span.getEnd(); j++)\n        sb.append(tokens[j]\
    \ + \" \");\n      ret.add(sb.toString().trim().replaceAll(\" ,\", \",\"));\n\
    \    }\n    return ret;\n  }\n```\n\nThe public methods in the class `com.markwatson.opennlp.NLP`\
    \ are overriden to take either a single string value which gets tokenized inside\
    \ of the method and also a method that takes as input text that has already been\
    \ tokenized into a `String tokens[]` object. In the last example the method starting\
    \ on line 1 accepts an input string and the overriden method starting on line\
    \ 5 accepts an array of strings. Often you will want to tokenize text stored in\
    \ a single input string into tokens and reuse the tokens for calling several of\
    \ the public methods in `com.markwatson.opennlp.NLP` that can take input that\
    \ is already tokenized. In line 2 we simply tokenize the input text and call the\
    \ method that accepts tokenized input text.\n\nIn line 6 we create a `HashSet<String>`\
    \ object that will hold the return value of a set of location names. The `NameFinderME`\
    \ object `locationFinder` returns an array of `Span` objects. The `Span` class\
    \ is used to represnt a sequence of adjacent words. The `Span` class has a public\
    \ static attribute `length` and instance methods `getstart` and `getEnd` that\
    \ return the indices of the beginning and ending (plus one) index of a span in\
    \ the origianl input text.\n\nHere is some sample code to use `locationNames`\
    \ along with the output (edited for page width and clarity):\n\n```\nString sentence\
    \ =\n  \"Apple Computer is located in Cupertino, California and Microsoft \" +\n\
    \  \"is located in Seattle, Washington. He went to Oregon\";\nSet<String> names\
    \ = NLP.locationNames(sentence);\nSystem.out.println(\"Location names found: \"\
    \ + names);\n\nLocation names found: [Oregon, Cupertino, Seattle, California,\
    \ Washington]\n```\n\nNote that the pre-trained model does not recognize when\
    \ city and state names are associated.\n\n### Training a New Categorization Model\
    \ for OpenNLP\n\nThe OpenNLP class `DoccatTrainer` can process specially formatted\
    \ input text files and produce categorization models using maximum entropy which\
    \ is a technique that handles data with many features. Features that are automatically\
    \ extracted from text and used in a model are things like words in a document\
    \ and word adjacency. Maximum entropy models can recognize multiple classes. In\
    \ testing a model on new text data the probablilities of all possible classes\
    \ add up to the value 1 (this is often refered as as “softmax”). For example we\
    \ will be training a classifier on four categories and the probablilities of these\
    \ categories for some test input text add up to the value of one:\n\n```\n[[COMPUTERS,\
    \ 0.1578880260493374], [ECONOMY, 0.2163099374638936],\n [HEALTH, 0.35546925520388845],\
    \ [POLITICS, 0.27033278128288035]]\n```\n\nThe format of the input file for training\
    \ a maximum entropy classifier is simple but has to be correct: each line starts\
    \ with a category name, followed by sample text for each category which must be\
    \ all on one line. Please note that I have already trained the model producing\
    \ the model file `models/en-newscat.bin` so you don’t need to run the example\
    \ in this section unless you want to regenerate this model file.\n\nThe file `sample_category_training_text.txt`\
    \ contains four lines, defining four categories. Here are two lines from this\
    \ file (I edited the following to look better on the printed page, but these are\
    \ just two lines in the file):\n\n```\nCOMPUTERS Computers are often used to access\
    \ the Internet and meet basic busines\\\ns functions.\nECONOMY The Austrian School\
    \ (also known as the Vienna School or the Psychologica\\\nl School ) is a Schools\
    \ of economic thought|school of economic thought that emph\\\nasizes the spontaneous\
    \ organizing power of the price mechanism.\n```\n\nHere is one training example\
    \ each for the categories `COMPUTERS` and `ECONOMY`.\n\nYou must format the training\
    \ file perfectly. As an example, if you have empty (or blank) lines in your input\
    \ training file then you will get an error like:\n\n```\nComputing event counts...\
    \  java.io.IOException: Empty lines, or lines with\n                         \
    \  only a category string are not allowed!\n```\n\nThe OpenNLP documentation has\
    \ examples for writing custom Java code to build models but I usually just use\
    \ the command line tool; for example:\n\n```\nbin/opennlp DoccatTrainer -model\
    \ models/en-newscat.bin\n```\n\nThe OpenNLP documentation has examples for writing\
    \ custom Java code to build models but I usually just use the command line tool;\
    \ for example:\n\n```\nbin/opennlp DoccatTrainer -model models/en-newscat.bin\n\
    ```\n\nThe OpenNLP documentation has examples for writing custom Java code to\
    \ build models but I usually just use the command line tool; for example:\n\n\
    ```\nbin/opennlp DoccatTrainer -model models/en-newscat.bin\n```\n\nThe OpenNLP\
    \ documentation has examples for writing custom Java code to build models but\
    \ I usually just use the command line tool; for example:\n\n```\nbin/opennlp DoccatTrainer\
    \ -model models/en-newscat.bin\n```\n\nThe OpenNLP documentation has examples\
    \ for writing custom Java code to build models but I usually just use the command\
    \ line tool; for example:\n\n```\nbin/opennlp DoccatTrainer -model models/en-newscat.bin\n\
    ```\n\nThe OpenNLP documentation has examples for writing custom Java code to\
    \ build models but I usually just use the command line tool; for example:\n\n\
    ```\nbin/opennlp DoccatTrainer -model models/en-newscat.bin\n```\n\nThe OpenNLP\
    \ documentation has examples for writing custom Java code to build models but\
    \ I usually just use the command line tool; for example:\n\n```\nbin/opennlp DoccatTrainer\
    \ -model models/en-newscat.bin\n```\n\nThe OpenNLP documentation has examples\
    \ for writing custom Java code to build models but I usually just use the command\
    \ line tool; for example:\n\n```\nbin/opennlp DoccatTrainer -model models/en-newscat.bin\n\
    ```\n\nThe OpenNLP documentation has examples for writing custom Java code to\
    \ build models but I usually just use the command line tool; for example:\n\n\
    ```\nbin/opennlp DoccatTrainer -model models/en-newscat.bin\n```\n\nThe OpenNLP\
    \ documentation has examples for writing custom Java code to build models but\
    \ I usually just use the command line tool; for example:\n\n```\nbin/opennlp DoccatTrainer\
    \ -model models/en-newscat.bin\n```\n\nThe OpenNLP documentation has examples\
    \ for writing custom Java code to build models but I usually just use the command\
    \ line tool; for example:\n\n```\nbin/opennlp DoccatTrainer -model models/en-newscat.bin\n\
    ```\n\nWait, let me re-process the text properly.\n\n```\npublic static void train(String\
    \ languageCode,\n                                ObjectStream<DocumentSample>\
    \ samples,\n                                int cutoff, int iterations,\n    \
    \                            FeatureGenerators)\n```\n\nAs I mention in the next\
    \ section, the last argument would look like:\n\n```\npublic DocumentCategorizerME(DoccatModel\
    \ model,\n           new FeatureGenerator[]{});\n```\n\nFor most purposes the\
    \ default frequency (or bag of words) feature generator is probably OK so the\
    \ command line tool is a good place to start. Here is the output from running\
    \ `DoccatTrainer`:\n\n```\n> bin/opennlp DoccatTrainer -model models/en-newscat.bin\
    \ -lang en\n                            -data sample_category_training_text.txt\
    \ \\\n                            -encoding UTF-8\nIndexing events using cutoff\
    \ of 5\n\n\tComputing event counts...  done. 4 events\n\tIndexing...  done.\n\
    Sorting and merging events... done. Reduced 4 events to 4.\nDone indexing.\nIncorporating\
    \ indexed data for training...  done.\n\tNumber of Event Tokens: 4\n\t    Number\
    \ of Outcomes: 4\n\t  Number of Predicates: 153\n...done.\nComputing model parameters\
    \ ...\nPerforming 100 iterations.\n  1:  ... loglikelihood=-5.545177444479562\t\
    0.25\n  2:  ... loglikelihood=-4.730232204542369\t0.5\n  3:  ... loglikelihood=-4.232192673282495\t\
    0.75\n   ...\n 98:  ... loglikelihood=-0.23411803835475453\t1.0\n 99:  ... loglikelihood=-0.23150121909902377\t\
    1.0\n100:  ... loglikelihood=-0.22894028845170055\t1.0\nWriting document categorizer\
    \ model ... done (0.041s)\n\nWrote document categorizer model to\npath: /Users/mark/power-java/opennlp/models/en-newscat.bin\n\
    ```\n\nWe will use our new trained model file `en-newscat.bin` in the next section.\n\
    \n**Please note that in this simple example I used very little data, just a few\
    \ hundred words for each training category. I have used the OpenNLP maximum entropy\
    \ library on various projects, mostly to good effect, but I used many thousands\
