  trans: "\n\n使用反向传播算法训练许多层网络的困难之处在于，靠近输入层（远离输出层）的层中的 delta 误差会变得非常小，即使在现代处理器和 GPU\
    \ 上，训练也可能需要很长时间。Geoffrey Hinton 和他的同事创建了一种用于预训练权重的新技术。2012 年，我参加了由 Hinton 及其同事教授的一门名为[面向机器学习的神经网络](https://www.coursera.org/course/neuralnets)\
    \ 的 Coursera 课程，当你阅读这本书时，这些材料可能在网上可用。\n\n对于 Java 开发者来说，`Deeplearning4j` 是实验深度学习的绝佳起点。如果你也使用\
    \ Python，那么在 [deeplearning.net](http://deeplearning.net/) 上还有很好的教程和其他学习资源。\n\n\
    # 深度置信网络 (Deep Belief Networks)\n\n深度置信网络（DBN）是一种深度神经网络，包含多个隐藏神经元层，其中任何一个特定隐藏层内部的神经元之间都没有连接。每个隐藏层根据训练数据以及前一个隐藏层的权重值来学习特征。我所说的“前一层”是指靠近输入层的连接层。DBN\
    \ 可以学习到更抽象的特征，且距离输入层越“远”的隐藏层，其抽象程度越高。\n\nDBN 是逐层进行训练的。最初，使用一组训练输入来训练输入层与第一隐藏神经元层之间的权重。从技术上讲，当我们预训练后续每一对层时，我们正在训练受限玻尔兹曼机（RBM）来学习一组新特征。你只需要知道\
    \ RBM 是两层（输入层和输出层），它们全全连接（第一层中的所有神经元与下一层的每个神经元都有权重连接），并且没有层内连接。\n\n当我们逐步训练 DBN\
    \ 时，一个 RBM 的输出层将成为下一对神经元层预训练的输入层。\n\n一旦所有隐藏层都完成了预训练，就会使用反向传播学习来重新训练整个网络，但现在通过比较前向传播输出与训练输出来计算\
    \ delta 误差，并将误差反向传播以更新向第一个隐藏层的层权重。\n\n需要理解的一点是，反向传播对于具有许多隐藏层的网络往往效果不好，因为当我们向输入神经元反向处理时，传播的误差会变得越来越小——这会导致网络训练非常缓慢。通过使用\
    \ RBM 对预计算权重，我们更接近一组能够最小化训练集（以及测试集）误差的权重。\n\n# 深度置信网络示例\n\n接下来的屏幕截图了本章示例的 IntelliJ\
    \ 项目（你可以使用免费的社区版或专业版来完成书中的示例）：\n\n![本章示例的 IntelliJ 项目视图](img/00022.jpeg)\n\n本章示例的\
    \ IntelliJ 项目视图\n\n`Deeplearning4j` 库使用用户编写的 Java 类将训练和测试数据导入 `Deeplearning4j`\
    \ 库可以使用的形式中。下面的列表显示了 `WisconsinDataSetIterator` 类的实现，该类遍历威斯康星大学癌症数据集：\n\n```\n\
    \ 1 package com.markwatson.deeplearning;\n 2 \n 3 import org.deeplearning4j.datasets.iterator.BaseDatasetIterator;\n\
    \ 4 \n 5 import java.io.FileNotFoundException;\n 6 \n 7 \n 8 public class WisconsinDataSetIterator\
    \ extends BaseDatasetIterator {\n 9private static final long serialVersionUID\
    \ = -2023454995728682368L;\n10 \n11   public WisconsinDataSetIterator(int batch,\
    \ int numExamples)\n12          throws FileNotFoundException {\n13     super(batch,\
    \ numExamples, new WisconsinDataFetcher());\n14   }\n15 }\n```\n\n`WisconsinDataSetIterator`\
    \ 构造函数通过 `WisconsinDataFetcher` 类（定义在下一个列表中）的实例调用其父类，以从文件 `data/cleaned_wisconsin_cancer_data.csv`\
    \ 读取逗号分隔值（CSV）表格数据：\n\n```\n 1 package com.markwatson.deeplearning;\n 2 \n 3 import\
    \ org.deeplearning4j.datasets.fetchers.CSVDataFetcher;\n 4 \n 5 import java.io.FileInputStream;\n\
