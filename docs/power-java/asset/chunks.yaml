    \nSystem.out.println(\"\\n\\nUsing the trained model:\");\nSystem.out.println(\"\
    malignant result = \" + malignant_result + 1.0 means that there were no false\
    \ positives.\n positives are predictions of a true it should have been false false..\
    \  .... the the the the the the data to look like:\n```\nSystem.out.println(\"\
    \\n\\nUsing the trained model:\");\nSystem.out.println(\"malignant result = \"\
    \ + malignant_result +\n\", \" + malignant_result);\n```\n\nHow do we evaluate\
    \ these results? The precision value of 1.0 means that there were no false positives.\
    \ False positives are predictions of a true result when it should have been false.\
    \ The value 0.578 for recall means that of all the samples that should have been\
    \ classified as positive, we only predicted about 57.8% of them. The F1 score\
    \ is calculated as two times the product of precision and recall, divided by the\
    \ sum of precision plus recall.\n\n## Deep Learning Using Deeplearning4j\n\nThe\
    \ [Deeplearning4j.org](http://deeplearning4j.org/) Java library supports several\
    \ neural network algorithms including support for Deep Learning (DL). We will\
    \ look at an example of DL implementing Deep-Belief networks using the same University\
    \ of Wisconsin database that we used in the chapters on machine learning with\
    \ Spark and on anomaly detection. Deep learning refers to neural networks with\
    \ many layers, possibly with weights connecting neurons in non-adjacent layers\
    \ which makes it possible to model temporal and spacial patterns in data.\n\n\
    I am going to assume that you have some knowledge of simple backpropagation neural\
    \ networks. If you are unfamiliar with neural networks you might want to pause\
    \ and do a web search for “neural networks backpropagation tutorial” or read the\
    \ neural network chapter in my book [Practical Artificial Intelligence Programming\
    \ With Java, 4th edition](https://leanpub.com/javaai).\n"
