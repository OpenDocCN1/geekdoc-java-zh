    ### Using word2vec To Find Similar Words In Documents


    Google released their open source `word2vec` library as Apache 2 licensed open
    source. The [Deeplearning4j](http://deeplearning4j.org) project and Spark’s MLlib
    both contain implementations. As I write this chapter the Deeplearning4j version
    has more flexibility but we will use the MLlib version here. We cover Deeplearning4j
    in a later chapter. We will use the sample data file from the Deeplearning4j project
    in this section.


    The `word2vec` library can identify which other words in text are strongly related
    to any other word in the text. If you run `word2vec` on a large sample of English
    language text you will find the the word woman is closely associated with the
