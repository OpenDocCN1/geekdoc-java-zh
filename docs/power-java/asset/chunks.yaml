- fmt: "\n```java\npackage com.markwatson.machine_learning;\n\nimport org.apache.spark.api.java.JavaRDD;\n\
    import org.apache.spark.api.java.JavaSparkContext;\nimport org.apache.spark.mllib.feature.Word2Vec;\n\
    import org.apache.spark.mllib.feature.Word2VecModel;\nimport java.io.IOException;\n\
    import java.nio.file.Files;\nimport java.nio.file.Paths;\nimport java.util.*;\n\
    import java.util.stream.Collectors;\nimport java.util.stream.Stream;\n\nimport\
    \ scala.Tuple2;\n\npublic class Word2VecRelatedWords {\n  // Use the example data\
    \ file form the deeplearning4j.org word2vec example:\n  private final static String\
    \ input_file = \"data/raw_sentences.txt\";\n\n  static private List<String> tokenizeAndRemoveNoiseWords(String\
    \ s) {\n    return Arrays.asList(s.toLowerCase().replaceAll(\"\\\\.\", \" \\\\\
    . \")\n        .replaceAll(\",\", \" , \").replaceAll(\"\\\\?\", \" ? \")\n  \
    \      .replaceAll(\"\\n\", \" \").replaceAll(\";\", \" ; \").split(\" \"))\n\
    \        .stream().filter((w) ->\n            ! noiseWords.contains(w)).collect(Collectors.toList());\n\
    \  }\n\n  public static void main(String[] args) throws IOException {\n    JavaSparkContext\
    \ sc = new JavaSparkContext(\"local\", \"WikipediaKMeans\");\n\n    String sentence\
    \ = new String(Files.readAllBytes(Paths.get(input_file)));\n    List<String> words\
    \ = tokenizeAndRemoveNoiseWords(sentence);\n    List<List<String>> localWords\
    \ = Arrays.asList(words, words);\n    Word2Vec word2vec = new Word2Vec().setVectorSize(10).setSeed(113L);\n\
    \    JavaRDD<List<String>> rdd_word_list = sc.parallelize(localWords);\n    Word2VecModel\
    \ model = word2vec.fit(rdd_word_list);\n    \n    Tuple2<String, Object>[] synonyms\
    \ = model.findSynonyms(\"day\", 15);\n    for (Object obj : synonyms)\n      System.err.println(\"\
    -- words associated with day: \" + obj);\n\n    synonyms = model.findSynonyms(\"\
    children\", 15);\n    for (Object obj : synonyms)\n      System.err.println(\"\
    -- words associated with children: \" + obj);\n\n    synonyms = model.findSynonyms(\"\
    people\", 15);\n    for (Object obj : synonyms)\n      System.err.println(\"--\
    \ words associated with people: \" + obj);\n\n    synonyms = model.findSynonyms(\"\
    three\", 15);\n    for (Object obj : synonyms)\n      System.err.println(\"--\
    \ words associated with three: \" + obj);\n\n    synonyms = model.findSynonyms(\"\
    man\", 15);\n    for (Object obj : synonyms)\n      System.err.println(\"-- words\
    \ associated with man: \" + obj);\n\n    synonyms = model.findSynonyms(\"women\"\
    , 15);\n    for (Object obj : synonyms)\n      System.err.println(\"-- words associated\
    \ with women: \" + obj);\n\n    sc.stop();\n  }\n\n  static private Set<String>\
    \ noiseWords = new HashSet<>();\n  static {\n    try {\n      Stream<String> lines\
    \ = Files.lines(Paths.get(\"data\", \"stopwords.txt\"));\n      lines.forEach(s\
    \ -> noiseWords.add(s));\n      lines.close();\n    } catch (Exception e) { System.err.println(e);\
    \ }\n  }\n}\n```\n\nThe output from this example program is:\n"
