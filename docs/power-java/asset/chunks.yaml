    \    packet.setData(new byte[PACKETSIZE]);\n    socket.receive(packet);\n    System.out.println(new\
    \ String(packet.getData()));\n    socket.close();\n  }\n}\n```\n\n运行此示例将产生以下输出（已根据页面宽度进行编辑）：\n\
    \n```\n> java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n     \
    \    com.markwatson.iot.UDPClient\nfrom server - HelloServer1431540275433\n```\n\
    \n我在许多项目中使用过 `UDP` 网络编程，这里提到其中两个。在 20 世纪 80 年代，我是 NMRD 项目的架构师和开发者，该项目利用全球 38 个地震研究站收集数据，我们通过这些数据来判断是否有国家正在进行核爆炸试验。我们对元控制数据使用了保证送达的消息系统，但大部分原始数据传输使用了低层的\
    \ `UDP`。另一个应用程序是用于运行在局域网上的网络赛车和气垫游戏的通信库。`UDP` 非常适合局域网游戏开发，因为它的效率很高，丢失数据包的概率很低，即使丢失了包，通常影响影响游戏。请记住，使用\
    \ `UDP` 时，你无法保证数据的送达，也无法保证失败通知！\n\n### 组播/广播网络编程\n\n接下来两个节中的示例与最后两个节的示例相似，主要区别在于：服务器使用\
    \ `UDP` 定期广播数据。服务器并不关心是否有客户端在监听，它只是简单广播数据。如果有任何客户端在监听，它们可能会接收到数据。我之所以说“可能”接收，是因为\
    \ `UDP` 不提供任何送达保证。\n\n特定的 `INET` 地址可以用于本地组播，其地址范围在 `224.0.0.0` 到 `224.0.0.255`\
    \ 之间。我们将在两个示例程序中使用 `224.0.0.5`。这些是对于互联网是不可见的本地地址。\n\n#### 组播广播服务器\n\n接例的示例与两个节前看到的示例（Java\
    \ 类 `UDPServer`）非常相似，但我们不再等待客户端请求。\n\n```java\npackage com.markwatson.iot;\n\n\
    import java.io.IOException;\nimport java.net.*;\n\npublic class MulticastServer\
    \ {\n\n  final static String INET_ADDR = \"224.0.0.5\";\n  final static int PORT\
    \ = 9002;\n\n  public static void main(String[] args)\n      throws IOException,\
    \ InterruptedException {\n    InetAddress addr = InetAddress.getByName(INET_ADDR);\n\
    \    DatagramSocket serverSocket = new DatagramSocket();\n    for (int i = 0;\
    \ i < 10; i++) {\n      String message = \"message \" + i;\n\n      DatagramPacket\
    \ messagePacket =\n          new DatagramPacket(message.getBytes(),\n        \
    \      message.getBytes().length, addr, PORT);\n      serverSocket.send(messagePacket);\n\
    \n      System.out.println(\"broadcast message sent: \" + message);\n      Thread.sleep(500);\n\
    \    }\n  }\n}\n```\n\n在第 13 行我们为 `224.0.0.5` 创建了一个 `INET` 地址，在第 14 行创建了一个 `DatagramSocket`，它被重复用于广播\
    \ 10 条消息，消息之间有 1/2 秒的延迟。广播消息在第 16 行中定义，第 18 到 21 行的代码创建了一个带有消息文本数据的新 `DatagramPacket`，并在第\
    \ 21 行将其广播到局域网。\n\n运行此示例将产生以下输出（输出已为了简洁编辑）：\n\n```\n> java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ com.markwatson.iot.\\\nMulticastServer\nbroadcast message sent: message 0\n\
    broadcast message sent: message 1\n ...\nbroadcast message sent: message 8\nbroadcast\
    \ message sent: message 9\n```\n\n与两个节前的 `UDPServer` 示例不同，无论你是否在下一节运行列表客户端，都会得到此输出。\n\
    \n#### 组播广播监听器\n\n本节的示例监听上一节中服务器示例的广播。广播服务器和客户端需要对 `INET` 地址和端口号一致。\n\n```java\n\
    package com.markwatson.iot;\n\nimport java.io.IOException;\nimport java.net.DatagramPacket;\n\
    import java.net.InetAddress;\nimport java.net.MulticastSocket;\nimport java.net.UnknownHostException;\n\
    \npublic class MulticastClient {\n\n  final static String INET_ADDR = \"224.0.0.5\"\
    ;\n  final static int PORT = 9002;\n\n  public static void main(String[] args)\
    \ throws IOException {\n    InetAddress address = InetAddress.getByName(INET_ADDR);\n\
    \    byte[] buf = new byte[512];\n    MulticastSocket clientSocket = new MulticastSocket(PORT);\n\
    \    clientSocket.joinGroup(address);\n\n    while (true) {\n      DatagramPacket\
    \ messagePacket = new DatagramPacket(buf, buf.length);\n      clientSocket.receive(messagePacket);\n\
    \      String message = new String(buf, 0, buf.length);\n      System.out.println(\"\
    received broadcast message: \" + message);\n    }\n  }\n}\n```\n\n在第 15 行我们创建了一个\
    \ `InetAddress`，在第 16 行为接收到的文本消息分配存储空间。我们在第 17 行在端口 `9002` 上创建一个 `MulticastSocket`，并在第\
    \ 19 行加入服务器组。在第 21 到 27 行，我们无限循环监听广播消息并打印它们。\n\n运行此示例将产生以下输出（输出已为了简洁编辑）：\n\n```\n\
    > java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n         com.markwatson.iot.MulticastClient\n\
    received broadcast message: message 0\nreceived broadcast message: message 1\n\
    \ ...\nreceived broadcast message: message 8\nreceived broadcast message: message\
    \ 9\n```\n\n### IoT 总结\n\n尽管我个人对 IoT 应用和产品的安全与隐私有些顾虑，但我对通过小型网络设备让我们的生活更简单、更高效的可能性充满热情。当我们工作和娱乐时，我们希望尽可能不要去考虑我们的计算设备，这样我们就能专注于自己的活动。\n\
    \n在本章中，我对于实用的 IoT 技术介绍仅仅是触及皮毛，但我希望我向你展示了可以在项目（包括 IoT 以及网络游戏编程）中使用的网络编程技术。当我写这本书时，有许多公司在提供\
    \ IoT 硬件开发包，选择一个套件和软件框架并创建你自己的项目是一个很好的进展方法。\n\n## 使用 OpenNLP 进行自然语言处理\n\n从 20\
    \ 世纪 80 年代初，我就一直在自然语言处理（NLP）领域工作。很多人对 NLP 领域感兴趣，而且技术已经发生了巨大的变化。NLP 通常被认为是人工智能（AI）领域的一部分，在\
    \ 20 世纪 80 年代和 90 年代，人们对符号 AI 有更大的兴趣，即对高层符号的操作，这些符号因为我们对现实世界的知识而对人类产生意义。例如，符号\
    \ `car` 对我们是有意义的，但对于 AI 软件来说，这个符号本身除了与 `driver` 和 `road` 等符号可能存在的语义关系没有任何意义。\n"
- fmt: "\nThere is still much work in NLP that deals with words as symbols: syntactic\
    \ and semantic parsers being two examples. What has changed is a strong reliance\
    \ on statistical and machine learning techniques. In this chapter we will use\
    \ the open source (Apache 2 license) `OpenNLP` project that uses machine learning\
    \ to create models of language. Currently, `OpenNLP` has support for Danish, German,\
    \ English, Spanish, Portuguese, and Swedish. I include in the github repository\
    \ some trained models for English that are used in the examples in this chapter.\
    \ You can download models for other languages at the [web page for OpenNLP 1.5\
    \ models](http://opennlp.sourceforge.net/models-1.5/) (we are using version 1..6.0\
    \ of `OpenNLP` in this book which uses the version 1.5 models).\n\nI use `OpenNLP`\
    \ for some of the NLP projects that I do for my consulting customers. I have also\
    \ written my own NLP toolkit [KBSPortal.com](http://kbsportal.com) that is a commercial\
    \ product. For customers who can use the GPL license I sometimes use the [Stanford\
    \ NLP libraries](http://nlp.stanford.edu/) that, like `OpenNLP`, are written in\
    \ Java.\n\nThe following figure shows the project for this chapter in the Community\
    \ Edition of IntelliJ:\n\n![IntelliJ project view for the examples in this chapter](images/00004.jpeg)\n\
    \nIntelliJ project view for the examples in this chapter\n\nWe will use pre-trained\
    \ models for tokenizing text, recognizing the names of organizations, people,\
    \ locations, and parts of speech for words in input text. We will also train a\
    \ new model (the file `opennlp/models/en-newscat.bin` in the github repository)\
    \ for recognizing the category of input text. The section on training new maximum\
    \ entropy classification models using your own training data is probably the material\
    \ in this chapter that you will use the most in your own projects. We will train\
    \ one model to recognize the categories of `COMPUTERS`, `ECONOMY`, `HEALTH`, and\
    \ `POLITICS`. You should then have the knowledge for training your own models\
    \ using your own training texts for the categories that you need for your applications.\
    \ We will also use both some pre-trained models that are included with the `OpenNLP`\
    \ distribution and the classification mode that we will soon create in the next\
    \ chapter when we learn how to perform scalable machine learning algorithms using\
    \ the Apache Spark platform where we look at techniques for processing very large\
    \ collections of text to discover information.\n\nAfter building a classification\
    \ model we finish up this chapter with an interesting topic: statistically parsing\
    \ sentences to discover the most probable linguistic structure of each sentence\
    \ in input text. We will not use parsing in the rest of this book so you may skip\
    \ the last section of this chapter if you are not currently interested in parsing\
    \ sentences into linguistic components like noun and verp phrases, proper nouns,\
    \ nouns, adjectives, etc.\n\n### Using OpenNLP Pre-Trained Models\n\nAssuming\
    \ that you have cloned the github repository for this book, you can fetch the\
    \ maven dependencies, compile the code, and run the unit tests using the command:\n\
    \n```\n1     mvn clean build test\n```\n\nThe model files, including the categorization\
    \ model you will learn to build later in this chapter, are found in the subdirectory\
    \ `models`. The unit tests in `src/test/java/com/markwatson/opennlp/NLPTest.java`\
    \ provide examples for using the code we develop in this chapter. The Java example\
    \ code for tokenization (splitting text into individual words), splitting sentences,\
    \ and recognizing organizations, locations, and people in text is all in the Java\
    \ class `NLP`. You can look at the source code in the repository for this book.\
    \ Here I will just show a few snippets of the code to make clear how to load and\
    \ use pre-trained models.\n\nI use static class initialization to load the model\
    \ files:\n\n```\n 1   static public Tokenizer tokenizer = null;\n 2   static public\
    \ SentenceDetectorME sentenceSplitter = null;\n 3   static POSTaggerME tagger\
    \ = null;\n 4   static NameFinderME organizationFinder = null;\n 5   static NameFinderME\
    \ locationFinder = null;\n 6   static NameFinderME personNameFinder = null;\n\
    \ 7 \n 8   static {\n 9 \n10     try {\n11       InputStream organizationInputStream\
    \ =\n12 \t    new FileInputStream(\"models/en-ner-organization.bin\");\n13   \
    \    TokenNameFinderModel model =\n14 \t    new TokenNameFinderModel(organizationInputStream);\n\
    15       organizationFinder = new NameFinderME(model);\n16       organizationInputStream.close();\n\
    17 \n18       InputStream locationInputStream =\n19 \t    new FileInputStream(\"\
    models/en-ner-location.bin\");\n20       model = new TokenNameFinderModel(locationInputStream);\n\
    21       locationFinder = new NameFinderME(model);\n22       locationInputStream.close();\n\
    23 \n24       InputStream personNameInputStream =\n25 \t    new FileInputStream(\"\
    models/en-ner-person.bin\");\n26       model = new TokenNameFinderModel(personNameInputStream);\n\
    27       personNameFinder = new NameFinderME(model);\n28       personNameInputStream.close();\n\
    29 \n30       InputStream tokienizerInputStream =\n31 \t    new FileInputStream(\"\
    models/en-token.bin\");\n32       TokenizerModel modelTokenizer = new TokenizerModel(tokienizerInputStream);\n\
    33       tokenizer = new TokenizerME(modelTokenizer);\n34       tokienizerInputStream.close();\n\
    35 \n36       InputStream sentenceInputStream =\n37 \t    new FileInputStream(\"\
    models/en-sent.bin\");\n38       SentenceModel sentenceTokenizer = new SentenceModel(sentenceInputStream);\n\
    39       sentenceSplitter = new SentenceModel(sentenceTokenizer);\n40       tokienizerInputStream.close();\n\
    41 \n42       organizationInputStream = new FileInputStream(\"models/pos-maxent.bin\"\
    );\n43       POSModel posModel = new POSModel(organizationInputStream);\n44  \
    \     tagger = new POSTaggerME(posModel);\n45 \n46     } catch (IOException e)\
    \ {\n47       e.printStackTrace();\n48     }\n49   }\n```\n\nThe first operation\
    \ that you will start with for processing natural language is breaking input text\
    \ into individual words. Here is the code for using the tokenizing code that separates\
    \ text stored as a Java String into individual words:\n\n```\n1   public static\
    \ String[] tokenize(String s) {\n2     return tokenizer.tokenize(s);\n3   }\n\
    ```\n\nHere is the similar code for breaking text into individual sentences:\n\
    \n```\n1   public static String[] sentenceSplitter(String s) {\n2     return sentenceSplitter.sentDetect(s);\n\
    3   }\n```\n\nHere is some sample code to use `sentenceSplitter`:\n\n```\n1  \
    \   String sentence =\n2       \"Apple Computer, Microsoft, and Google are in\
    \ the \" +\n3       \" tech sector. Each is very profitable.\";\n4     String\
    \ [] sentences = NLP.sentenceSplitter(sentence);\n5     System.out.println(\"\
    Sentences found:\\n\" + Arrays.toString(sentences));\n```\n\nIn line 4 the static\
    \ method `NLP.sentenceSplitter` returns an array of strings. In line 5 I use a\
    \ common Java idiom for printing arrays by using the static method `Arrays.toString`\
    \ to convert the array of strings into a `List<String>` object. The trick is that\
    \ the `List` class has a `toString` method that formats list nicely for printing.\n\
    \nHere is the output of this code snippet (edited for page width and clarity):\n\
    \n```\n1 Sentences found:\n2   [\"Apple Computer, Microsoft, and Google are in\
    \ the tech sector.\",\n3    \"Each is very profitable.\"]\n```\n\nThe code for\
    \ finding organizations, locations, and people’s names is almost identical so\
    \ I will only show the code in the next listing for recognizing locations. Please\
    \ look at the methods `companyNames` and `personNames` in the class `com.markwatson.opennlp.NLP`\
    \ to see the implementations for finding the names of companies and people.\n"
