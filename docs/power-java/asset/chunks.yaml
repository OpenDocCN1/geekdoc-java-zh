    在第 71 行，我们将 `fractionOfDataForTraining` 设置为 `0.7`，这意味着我们将使用 70% 的数据进行训练，剩下的 30%\
    \ 用于测试。在第 78 至 81 行，我们将数据划分为互不交的训练集和测试集。只要网络内存足够，识别训练数据的性能应该总是是好的。\n\n在第 86 行，我们设置了三个元学习参数：输入层和隐藏层之间第一组权重的学习率为\
    \ `1e-1`、启用正则化，以及隐藏层到输出层的权重学习率为 `2e-4`。\n\n在第 95 行，我们设置了丢弃（dropout）因子，这里表示对于任何训练示例随机不使用\
    \ 25% 的神经元。与正则化一起，dropout 有助于防止过拟合。过拟合发生在神经网络无法泛化并学习了训练数据中的噪声时。目标是学习影响训练模型处理新数据有用性的特征。我们不希望将数据中的随机噪声学习为重要特征。防止过拟合的另一种方法是使用尽可能少的隐藏层神经元，同时在独立测试数据上保持良好性能。\n\
