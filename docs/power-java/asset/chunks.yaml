  trans: "\n本章包含四个示例。如果你想跳过前面的并在阅读本章其余内容之前运行代码，请分别运行每个 maven 测试：\n\n```\nmvn test\
    \ -Dtest=HelloTest\nmvn test -Dtest=KMeansTest\nmvn test -Dtest=WikipediaKMeansTest\n\
    mvn test -Dtest=LogisticRegressionTest\nmvn test -Dtest=SvmClassifierTest\n```\n\
    \nSpark 包含了整个 Hadoop 作为依赖项，因为 Spark 能够与 Hadoop 和 Hadoop 文件系统交互。下载所有这些依赖项需要一些时间，但只需要执行一次。为了补充本章的内容，你可以参考\
    \ [Spark 编程指南](https://spark.apache.org/docs/latest/programming-guide.html)。我们还将使用\
    \ [Spark 机器学习库 (MLlib) 指南](https://spark.apache.org/docs/1.5.0/mllib-guide.html)\
    \ 中的材料。\n\n下图显示了 IntelliJ 社区版中本章的项目：\n\n![IntelliJ project view for the examples\
    \ in this chapter](img/00006.jpeg)\n\n本章示例的 IntelliJ 项目视图\n\n### Hello Spark -\
    \ 词频计数示例\n\n词频计数示例常用于引入 map reduce，我在这里也会用它作为一个类似于“hello 世界”的简单 Spark 示例。在接下来的列表中，第\
    \ 3 到第 6 行导入了所需的类。在第 3 和第 4 行中，`RDD` 代表弹性数据集（Resilient Distributed Datasets）。Spark\
    \ 是用 Scala 写的，因此我们有时会看到带有“Java”前缀的 Java 包装类。每个 `RDD` 是某种类型对象的集合，可以分布在 Spark 集群的多个服务器上。`RDDs`\
    \ 是容错的，Spark 集群中有足够的信息来重建任何因服务器或软件故障而丢失的数据。\n\n```\n 1 package com.markwatson.machine_learning;\n\
    \ 2 \n 3 import org.apache.spark.api.java.JavaPairRDD;\n 4 import org.apache.spark.api.java.JavaRDD;\n\
    \ 5 import org.apache.spark.api.java.JavaSparkContext;\n 6 import scala.Tuple2;\n\
    \ 7 \n 8 import java.util.Arrays;\n 9 import java.util.List;\n10 import java.util.Map;\n\
    \ 1 \n12 public class HelloSpark {\n 13 \n14   static private List<String> tokenize(String\
    \ s) {\n 15     return Arrays.asList(s.replaceAll(\"\\\\.\", \" \\\\. \").replaceAll(\"\
    ,\", \" , \")\n16         .replaceAll(\";\", \" ; \").split(\" \"));\n17   }\n\
    \ 18 \n19   static public void main(String[] args) {\n 20     JavaSparkContext\
    \ sc = new JavaSparkContext(\"local\", \"Hello Spark\");\n 21 \n 22     JavaRDD<String>\
    \ lines = sc.textFile(\"data/test1.txt\");\n 23     JavaRDD<String> tokens = lines.flatMap(line\
    \ -> tokenize(line));\n 24     JavaPairRDD<String, Integer> counts =\n 25    \
    \     tokens.mapToPair(token ->\n 26 \t\t\t new Tuple2<String, Integer>(token.toLowerCase(),\
    \ 1))\n 27               .reduceByKey((count1, count2) -> count1 + count2);\n\
    \ 28     Map countMap = counts.collectAsMap();\n 29     System.out.println(countMap);\n\
    \ 30     List<Tuple2<String, Integer>> collection = counts.collect();\n 31   \
    \  System.out.println(collection);\n 32   }\n 33 }\n```\n\n第 14 到第 17 行定义了简单的\
    \ `tokenizer` 方法，该方法接收英文文本并映射到字符串列表。我将其提取出来作为一个独立的方法，是为了提醒需要处理标点符号，而且将其分成独立方法可以方便你对特定文本输入文件可能所需的自定义分词进行实验。一种可能性是使用我们在上一章中使用的\
    \ OpenNLP 分词器模型。例如，我们希望字符串“tree.”被分词为 [\"tree”, “.”] 而不是 [“tree.”]。该方法在第 23 行中使用，并为输入文本文件的每一行调用一次。\n\
    \n在示例的第 22 行中，我们正在读取本地文本文件 `data/test1.txt`，但通常情况下，`JavaSparkContext.textFile()`\
    \ 的参数可以是指定本地 Hadoop 文件系统 (HDFS)、Amazon S3 对象或 Cassandra 文件系统的 URI。请注意在第 22 行定义的变量\
    \ `lines` 的类型：类型 `JavaRDD<string>` 指定了一个 RDD 集合，其中的分布式对象是字符串。\n\n第 29 到第 32 行的代码如果逐行解析，其实并不复杂。`counts`\
    \ 的类型是一个 RDD 分布式集合，集合中的每个对象都是一个字符串和一个整数值的对。第 25 到第 27 行的代码获取原始文本文件中的每个 token，并产生一个由\
    \ token 字符串和整数 1 组成的二值对（或 `Tuple2` 值）。例如，一个包含三个 token 的数组如：\n\n```\n1     [\"\
    the\", \"dog\", \"ran\"]\n```\n\n将被转换为一个包含三个对的数组：\n\n```\n1     [[\"the\", 1],\
    \ [\"dog\", 1], [\"ran\", 1]]\n```\n\n第 28 行的语句使用了 `reduceByKey` 方法，它根据唯一键对数组进行分区。这里是程序的输出内容：\n\
    \n```\n1     {dog=2, most=1, of=1, down=1, rabbit=1, slept=1, the=5, street=1,\n\
    2      chased=1, day=1}\n3 \n```\n\n### 介绍 Spark MLlib 库\n\n当我在 2015 年秋季编写本章时，Spark\
    \ MLlib 库处于 1.5 版本并持续开发中。当你尝试示例时，请尝试 1.5 版本。我会更新这本书的 git 仓库，并尽量保持代码示例与稳定版本兼容。\n\
    \n接下来的章节将展示如何将 MLlib 库应用于逻辑回归问题、使用 K-Means 算法聚类，以及使用 word2vec 算法发现词之间的强关联。\n\n\
    ### 使用威斯康星大学数据库的 MLlib 逻辑回归示例\n\n在本节中，我们将使用监督学习建立一个回归模型，将症状的数值特征向量映射到一个数值，数值越大表示恶性，数值越接近\
    \ 0 表示良性。\n\nMLlib 支持三种线性模型：支持向量机 (SVM)、逻辑回归（针对一个或多个类别的模型）以及线性回归（将类别输出为 [0..1]\
    \ 范围内的浮点数的模型）。Spark MLlib 文档（http://spark.apache.org/docs/latest/mllib-linear-methods.html）对这三种线性模型的描述非常出色，它们的示例程序也很相似，因此切换你使用的线性模型类型很容易。\n\
    \n我们将在本节的示例中使用逻辑回归。吴恩达在他优秀的[机器学习课程](https://www.coursera.org/learn/machine-learning)\
    \ 中提到，开始一个新问题时第一个尝试的模型是线性模型。我们将在下一节使用 SVM 代替逻辑回归重复此示例。\n\n如果你读过我的书籍 [Build Intelligent\
    \ Systems with Javascript](https://leanpub.com/aijavascript)，本节使用的训练和测试数据集你会感到熟悉：[威斯康星大学乳癌数据集](https://archive.ics.uci.edu/ml/datasets/Breast+Cancer+Wisconsin+%28Diagnostic%29)。\n\
    \n根据威斯康星大学网页，以下是该数据集中的属性及其允许范围：\n\n"
