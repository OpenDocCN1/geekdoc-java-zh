  trans: "\n\n*   [DBPedia](http://dbpedia.org/sparql) 它将 Wikipedia 信息框中的结构化信息编码为\
    \ RDF 数据。DBPedia 数据也可以免费下载，并托管在你自己的 `SPARQL` 端点上。\n\n*   [LinkDb](http://www.genome.jp/linkdb/linkdb_rdf.html)\
    \ 包含人类基因组数据。\n\n*   [美国国会图书馆](http://id.loc.gov/techcenter/searching.html) 目前没有提供\
    \ SPARQL 端点，但可以下载主题相关的 Sparql 数据以用于你自己的 SPARQL 端点，并且提供了一个可以返回 RDF 数据结果的搜索功能。\n\
    \n*   [BBC 节目与音乐](http://lod.openlinksw.com/sparql/)\n\n*   [FactForge](http://factforge.net/sparql)\
    \ 结合了来自多个源的 RDF 数据，包括 DBPedia、Geonames、Wordnet 和 Freebase。SPARQL 查询页面有许多很棒的示例可以帮助入门。例如，查看查询“显示距离伦敦最多\
    \ 50 英里以内的机场距离”的 SPARQL 语句和结果。\n\n网络上有许多公共的 SPARQL 端点，但我需要提醒你，它们并不总是可用的。大多数公共端点的原始\
    \ RDF 数据通常是可用的，因此如果你正在构建一个依赖公共数据集的系统，应该考虑在你自己的服务器之一上托管一份数据副本。我通常使用以下 RDF 存储库和\
    \ SPARQL 查询接口之一：：[Star Dog](http://stardog.com/)、[Virtuoso](http://virtuoso.openlinksw.com/)\
    \ 和 [Sesame](http://rdf4j.org/)。尽管如此，还有许多其他优秀的 RDF 存储库服务器选项，包括商业的和源的。在读完这一章后，你可能想读我写的一篇较新的[博客文章](http://blog.markwatson.com/2014/07/using-opencyc-rdfowl-data-in-stardog.html)，介绍了如何将\
    \ OpenCYC 世界知识库导入并并在本地仓库中使用。\n\n在接下来的两个节中，你将学习如何对网络上的 RDF 数据存储进行 SPARQL 查询，并以\
    \ JSON 格式以及解析为 Java 数据值获取结果。下一章的一个大主题是将“云端”数据与本地数据结合。\n\n### JSON 客户端\n\n```\n\
    \ 1 package com.markwatson.linkeddata;\n 2 \n3 import org.apache.http.HttpResponse;\n\
    \ 4 import org.apache.http.client.methods.HttpGet;\n 5 import org.apache.http.impl.client.DefaultHttpClient;\n\
    \ 6 \n7 import java.io.BufferedReader;\n 8 import java.io.InputStreamReader;\n\
    \ 9 import java.net.URLEncoder;\n10 \n11 public class SparqlClientJson {\n12 \
    \  public static String query(String endpoint_URL, String sparql)\n13        \
    \                throws Exception {\n14     StringBuffer sb = new StringBuffer();\n\
    15     try {\n16       org.apache.http.client.HttpClient httpClient =\n17 \t \
    \   new DefaultHttpClient();\n18       String req = URLEncoder.encode(sparql,\
    \ \"utf-8\");\n19       HttpGet getRequest =\n20           new HttpGet(endpoint_URL\
    \ + \"?query=\" + req);\n21       getRequest.addHeader(\"accept\", \"application/json\"\
    );\n22       HttpResponse response = httpClient.execute(getRequest);\n23     \
    \  if (response.getStatusLine().getStatusCode() != 200)\n24 \t     return \"Server\
    \ error\";\n25 \n26       BufferedReader br =\n27           new BufferedReader(\n\
    28               new InputStreamReader(\n29 \t\t\t\t   (response.getEntity().getContent())));\n\
    30       String line;\n31       while ((line = br.readLine()) != null) {\n32 \
    \        sb.append(line);\n33       }\n34       httpClient.getConnectionManager().shutdown();\n\
    35     } catch (Exception e) {\n36       e.printStackTrace();\n37     }\n38  \
    \   return sb.toString();\n39   }\n40 }\n```\n\n我们将使用以下 SPARQL 查询来寻找在亚利桑那州的人：\n\
    \n```\n1 PREFIX foaf: <http://xmlns.com/foaf/0.1/>\n2         PREFIX dbpedia2:\
    \ <http://dbpedia.org/property/>\n3         PREFIX dbpedia: <http://dbpedia.org/>\n\
    4         SELECT ?name ?person WHERE {\n5              ?person dbpedia2:birthPlace\
    \ <http://dbpedia.org/resource/Arizona> .\n6              ?person foaf:name ?name\
    \ .\n7         }\n8         LIMIT 10\n```\n\n你可以使用以下命令运行 DBPedia 查找和 SPARQL 查询的单元测试：\n\
    \n```\n1 mvn test -Dtest=DBPediaTest\n```\n\n以下是使用此示例 SPARQL 查询运行该类单元测试时产生的部分输出：\n\
    \n```\n{\n  \"head\": {\n    \"link\": [],\n    \"vars\": [\n      \"name\",\n\
    \      \"person\"\n    ]\n  },\n  \"results\": {\n    \"distinct\": false,\n \
    \   \"ordered\": true,\n    \"bindings\": [\n      {\n        \"name\": {\n  \
    \        \"type\": \"literal\",\n          \"xml:lang\": \"en\",\n          \"\
    value\": \"Ryan David Jahn\"\n        },\n        \"person\": {\n          \"\
    type\": \"uri\",\n          \"value\": \"http://dbpedia.org/resource/Ryan_David_Jahn\"\
    \n        }\n      }\n    ]\n  }\n}\n```\n\n### DBPedia Lookup\n\nDBPedia Lookup\
    \ 服务默认返回 XML 响应。`DBpediaLookupClient` 类非常简单。它编码查询字符串，调用 Web 服务并解析返回的 XML 负载。\n\
    \n### Java 数据\n\n```\n1 public class DBpediaLookupClient extends DefaultHandler\
    \ {\n2   public DBpediaLookupClient(String query) throws Exception {\n3     this.query\
    \ = query;\n4     HttpClient client = new HttpClient();\n5 \n6     String query2\
    \ = query.replaceAll(\" \", \"+\");\n7     HttpMethod method =\n8         new\
    \ GetMethod(\n9           \"http://lookup.dbpedia.org/api/search?QueryString=\"\
    \n10  +query2);\n11     try {\n12       client.executeMethod(method);\n13    \
    \   InputStream ins = method.getResponseBody();\n14       SAXParserFactory factory\
    \ = SAXParserFactory.newInstance();\n15       SAXParser sax = factory.newSAXParser();\n\
    16       sax.parse(ins, this);\n17     } catch (HttpException he) {\n18      \
    \ System.err.println(\"Http error connecting to lookup.dbpedia.org\");\n19   \
    \  } catch (IOException ioe) {\n20       System.err.println(\"Unable to connect\
    \ to lookup.dbpedia.org\");\n21     }\n22     method.releaseConnection();\n23\
    \   }\n24 \n25   public void printResults(List<Map<String, String>> results) {\n\
    26     for (Map<String, String> result : results) {\n27       System.out.println(\"\
    \\nNext result:\\n\");\n28       for (String key : result.keySet()) {\n29    \
    \     System.out.println(\"  \" + key + \"\\t:\\t\" + result.get(key));\n30  \
    \     }\n31     }\n32   }\n33 \n34   // ... XML 解析代码省略 ...\n35 \n36   public List<Map<String,\
    \ String>> variableBindings() {\n37     return variableBindings;\n38   }\n39 }\n\
    ```\n\n"
- fmt: "\nIf you run this example program you will see that the description text prints\
    \ all on one line; it line wraps in the about example.\n\nThis example returns\
    \ a list of maps as a result where each list item is a map which each key is a\
    \ variable name and each map value is the value for the key. In the next section\
    \ we will look at similar code that instead returns JSON data.\n\n## JSON Client\n\
    \nThe example in the section is simpler than the one in the last section because\
    \ we just need to return the payload from the lookup web service as-is (i.e.,\
    \ as JSON data encoded in a string).\n\n```\n 1 package com.markwatson.linkeddata;\n\
    \ 2 \n 3 import org.apache.http.HttpResponse;\n 4 import org.apache.http.client.HttpClient;\n\
    \ 5 import org.apache.http.client.methods.HttpGet;\n 6 import org.apache.http.impl.client.DefaultHttpClient;\n\
    \ 7 \n 8 import java.io.BufferedReader;\n 9 import java.io.InputStreamReader;\n\
    10 \n11 /**\n12  * Copyright 2015 Mark Watson.  Apache 2 license.\n13  */\n14\
    \ public class DBpediaLookupClientJson {\n15   public static String lookup(String\
    \ query) {\n16     StringBuffer sb = new StringBuffer();\n17     try {\n18   \
    \    HttpClient httpClient = new DefaultHttpClient();\n19       String query2\
    \ = query.replaceAll(\" \", \"+\");\n20       HttpGet getRequest =\n21       \
    \    new HttpGet(\n22 \t\t    \"http://lookup.dbpedia.org/api/search.asmx/KeywordSearch?QueryString=\"\
    \n23               + query2);\n24       getRequest.addHeader(\"accept\", \"application/json\"\
    );\n25       HttpResponse response = httpClient.execute(getRequest);\n26 \t  \n\
    27       if (response.getStatusLine().getStatusCode() != 200) return \"Server\
    \ error\";\n28 \n29       BufferedReader br =\n30           new BufferedReader(\n\
    31               new InputStreamReader((response.getEntity().getContent())));\n\
    32       String line;\n33       while ((line = br.readLine()) != null) {\n34 \
    \        sb.append(line);\n35       }\n36       httpClient.getConnectionManager().shutdown();\n\
    37     } catch (Exception e) {\n38       e.printStackTrace();\n39     }\n40  \
    \   return sb.toString();\n41   }\n42 }\n```\n\nYou can run the unit tests for\
    \ the DBPedia lookups and SPARQL queries using:\n\n```\n1 mvn test -Dtest=DBPediaTest\n\
    ```\n\nThe following example for the lookup for “Bill Clinton” shows sample JSON\
    \ (as a string) content that I “pretty printed” using IntelliJ for readability:\n\
    \n```\n{\n  \"results\": [\n    {\n      \"uri\": \"http://dbpedia.org/resource/Bill_Clinton\"\
    ,\n      \"label\": \"Bill Clinton\",\n      \"description\": \"William Jefferson\
    \ \\\"Bill\\\" Clinton (born William Jefferson\\\nBlythe III; August 19, 1946)\
    \ is an American politician who served as the 42nd P\\\nresident of the United\
    \ States from 1993 to 2001\\. Inaugurated at age 46, he was t\\\nhe third-youngest\
    \ president. He took office at the end of the Cold War, and was \\\nthe first\
    \ president of the baby boomer generation. Clinton has been described as\\\n a\
    \ New Democrat. Many of his policies have been attributed to a centrist Third\
    \ W\\\nay philosophy of governance.\",\n      \"refCount\": 7034,\n      \"classes\"\
    : [\n        {\n          \"uri\": \"http://dbpedia.org/ontology/OfficeHolder\"\
    ,\n          \"label\": \"office holder\"\n        },\n        {\n          \"\
    uri\": \"http://dbpedia.org/ontology/Person\",\n          \"label\": \"person\"\
    \n        },\n        ...\n      ],\n      \"categories\": [\n        {\n    \
