    \ block\n```\n*(Note: The provided code block in the prompt was truncated/interrupted\
    \ in the middle, but I have maintained the structure based on the provided text\
    \ flow)*\n\nOnce the data is read and converted to numeric features the next thing\
    \ we do is to randomly split the input data into two separate sets: one for training\
    \ and one for testing our model. This data splitting is done in lines 47 and 48.\
    \ Line 49 copies the training data and requests to the current context to try\
