    # 知识管理的动力


    知识工作者与以前种的工作者不同，后者接受培训是为了重复性地执行特定工作。知识工作者倾向于结合来自不同来源的信息来做出决策。


    当员工离开时，如果他们的知识没有被编码，那么组织就会失去价值。随着婴儿潮一代人越来越多地退休，这种情况在未来会变得更糟糕。因此，KM 的广泛目标是获取员工知识、促进公司范围内员工之间知识和信息的共享，并提供工具来提高员工基于可靠信息和先前的组织知识做出良好决策的效率。


    为了本节的考虑，我们将从最大化利用所有可用数据源（包括共享的云端信息源）的角度来讨论 KM。我们将通过实现访问常用文档格式的 Java 代码示例来实现这一点。


    由于 KM 是一个非常宽泛的话题，我将集中在几个相对简单的示例上，这些示例将为你提供获取和使用知识的灵感，并在某些情况下还可以提供书中示例中你可以使用的有用代码：


    *   将你的电子邮件捕获到关系型数据库中，并使用我们在 NLP 和机器学习章节中学到的某些技术来分配类别。

    *   存储网页 URI 和内容片段以备后之用。

    *   使用 Java 客户端处理 Google Drive 中的数据，特别是读取 Google 用于导出 Google 文档的 Microsoft 文件格式。

    *   通过将实体名称解析为唯一的 `DBPedia` URIs 来对文档存储器中的文本进行注释。

    *   使用 `Postgres` 作为本地数据库，存储由本节示例软件发现的数据。


    我使用的 Microsoft Office 365 也有 API，可以将你自己的程序集成到 Office 365 工作流中。我决定在本节中使用 Google
    Drive，是因为它是免费的，但我也鼓励你尝试 Office 365 的 API。你可以参加在线 [edX.org](http://edx.org) 提供的免费
    Office 365 API 课程。我们将使用 Google Drive 作为本节开发的示例代码的数据源。


    正如我在本节开头提到的，为了构建基于本节中思想和示例代码的真实系统，你需要编写一个 Web 应用程序，该程序可以验证你的系统用户，以访问 Google Drive
    和/或 Microsoft OneDrive 中的数据。除了对云端共享数据的实时访问外，组织 KM 系统的另一个我们在本节中未讨论的重要部分是提供用户和访问角色。在本节的示例中，我们将忽略这些组织需求，并集中在自动发现有助于组织共享数据的有用元数据的过程上。


    有许多针对组织或个人的 KM 产品。根据你的需求，你可能想将自定义软件与现成软件工具结合。KM 的另一个重要方面是`master data`的概念，即为各种（通常是遗留的）数据库创建一个统一的数据模型和存储策略。这部分也是我在
    Google 工作的内容。即使对于我们在本节中开发的三个简单示例，也存在涉及主数据的有趣问题，我稍后会提到。


    大多数 KM 系统处理存储在本地服务器上的内部数据。虽然我在本节稍后的部分提供了一些使用 `Postgres` 关系型数据库的非常简单的示例，但我想让你思考使用多个数据源并专注于存储在商业云服务中的数据是有意义的。


    # 使用 Google Drive Cloud Takeout 服务


    正如我在本节引言中提到的，虽然编写一个使用 Office 365 API 的 Microsoft Azure Web 应用以及一个使用 Google Drive
    数据访问 API 的 AppEngine（或 Google Cloud）Web 应用是相当容易的，但构建一个具有使用这些 API 所需的 auth2 支持的
    Web 应用出了示例程序的范范围。所以，我稍微耍了小聪明。Google 有一个“Google Takeout”服务，每个使用 Google 服务的人都应该定期使用它来保存来自
    Google 服务的所有数据。


    在本节及包含子节中，我们将使用“Google Takeout”转储作为示例程序使用的数据。以下子节包含读取和解析的实用：


    *   Microsoft Excel，这是 Google Takeout 导出 Google Drive 表格的格式。

    *   Microsoft Word `docx` 文件，这是 Google Takeout 用于导出 Google Drive 文字处理文档的格式。

    *   `iCal` 日历文件，这是 Google Calendar 数据导出的标准格式。

    *   电子邮件 `mbox` 文件，这是 GMail 导出的格式。


    这些都是广泛使用的文件格式，所以我希望接下来四个子节中开发的工具对你通常很有用。下面的图显示了 IntelliJ Community Edition 项目浏览器的截图，仅显示了我使用
