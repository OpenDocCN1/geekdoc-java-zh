  trans: "\n\n```\nEvaluating model:\n\n14:59:46.872 [main] INFO  c.m.d.DeepBeliefNetworkWisconsinData\
    \ -\n                                  target: [ 1.00, 0.00] predicted: [ 0.76,\
    \ 0.24]\n14:59:46.873 [main] INFO  c.m.d.DeepBeliefNetworkWisconsinData -\n  \
    \                                target: [ 1.00, 0.00] predicted: [ 0.65, 0.35]\n\
    \nActual Class 0 was predicted with Predicted 0 with count 151 times\n\nActual\
    \ Class 1 was predicted with Predicted 0 with count 44 times\n\n==========================Scores========================================\n\
    \ Accuracy:  0.7744\n Precision: 0.7744\n Recall:    1\n F1 Score:  0.8728323699421966\n\
    ===========================================================================\n\
    ```\n\n`F1` 分数的计算方法为精确率乘以召回率的两倍，并除以`精确率 + 召回率`。我们希望 `F1` 越接近 1.0 越好，通常会花长时间对元学习参数进行实验以提高\
    \ `F1`。\n\n尝试学习元学习参数的良好值也是非常常见的。我们在这里不会这样做，但过程涉及将数据分为三个互不相交的集合：训练集、验证集和测试集。改变元参数进行训练，并使用验证数据选择最佳元参数集。最后，我们使用根据元参数定义的网络以及学习到的权重对独立的测试数据进行测试，以查看有效的\
    \ `F1` 分数是多少。\n\n## 深度学习总结\n\n我最早在 20 世纪 80 年代后期将复杂的神经网络拓扑结构用于音素（语音）识别，特别是使用了时间延迟神经网络，并在[1987\
    \ 年 IEEE 第一届国际神经网络年度会议（加利福尼亚州圣地亚哥，1987 年 6 月 21-24 日）](http://ieeexplore.ieee.org/xpl/articleDetails.jsp?reload=true&arnumber=4307059）上发表了相关演讲。当时，神经网络并没有被认为是用于此类应用的伟大技术，但现在，谷歌、微软等公司正在使用深层（多层）神经网络进行语音和图像识别。自然语言处理领域也进行着令人兴奋的工作。我在本章中刚刚提供了一个小示例，你们可以轻松地对它进行实验。我想向你们介绍\
    \ [Deeplearning4j](http://deeplearning4j.org/)，因为我认为这可能是 Java 开发者开始使用多层神经网络最简单的方法，我建议你们参阅[项目文档](http://deeplearning4j.org/documentation.html)。\n\
    \n## 网页爬虫示例\n\n除了第一章关于网络编程技术的章节、本章，以及关于我所称的“轻量级知识管理”的最后一章外，本书主要是关于各种形式的机器学习。从实际操作的角度来看，许多人用于机器学习的很大一部分数据要么来自网络，要么来自内部数据源。这个简短的章节为从网络获取文本数据提供了一些指导和示例。\n\
    \n在我的工作中，我通常使用 Ruby 脚本语言进行网页爬虫和信息收集（正如我在 Apress 出版的书[脚本智能：Web 3.0 信息收集与处理](http://www.apress.com/9781430223511)中提到的那样），但\
    \ Java 用于网页爬虫也有良好的支持，由于这是一本关于现代 Java 开发的书，我们将在本章中使用 Java。\n\n在开始讨论关于“网页爬虫”的技术问题之前，我想向你们指出，网络上的大部分信息都受版权保护，你应该做的第一件事是阅读网站的服务条款，以确保你对“爬取”或“蜘蛛化”数据的使用符合内容所有以及付费运行爬取网站的个人或组织的意愿。\n\
    \n### 网页爬虫的动机\n\n正如我们在下一章关于链接数据的章节中所看到的，通过网络服务、语义网/链接数据标记和 API，网络上提供了海量的结构化数据。尽管如此，你经常会发现一些从网站上抓取原始文本是有用的数据，但这些文本通常是非结构化的，并且处于杂乱（且经常变化）的格式中，因为网页是为人类消费设计的，而不是为了让软件代理摄取。在本章中，我们将涵盖实用的“网页爬虫”技术。你会发现，处理不同的网页设计风格和布局通常需要大量工作。为了让情况更加不方便，你可能会发现你的软件信息收集代理经常因为网站的更改而崩溃。\n\
    \n我倾向于使用三种通用技术之一来爬取网站。本章将仅涵盖前两种：\n\n*   使用 HTML 解析库，它可以剥离页面上所有的 HTML 标记和 JavaScript，并返回一个“纯文本”块。在这里，导航菜单、页眉等等中的文本将与我们通常认为的网站“内容”交织在一起。\n\
    \n*   利用网站上的 HTML DOM（文档对象模型）格式信息来提取页眉、页面标题、导航菜单和大型内容文本块。\n\n*   使用诸如 (Selenium)[http://docs.seleniumhq.org/)\
    \ 之类的工具通过程序化控制网络浏览器，以便你的软件代理可以登录网站并执行其他导航。换句话说，你的软件代理可以模拟使用网络浏览器的人类。\n\n我很少需要使用\
    \ `Selenium` 这样的工具，但俗言道：“当你需要它们时，你就需要它们。”对于简单的网站，我倾向于提取所有文本作为一个单一块，并在需要时使用 DOM\
    \ 处理。\n\n"
- fmt: "\n```\n 1 package com.markwatson.web_scraping;\n 2 \n 3 import org.jsoup.*;\n\
