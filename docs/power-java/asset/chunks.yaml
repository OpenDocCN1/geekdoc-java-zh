    \ i++) {\n4     System.err.println(\"\\n* * next email:\\n\\n\" + mbox.getEmail(i)\
    \ + \"\\n\");\n5   }\n```\n\n```\n 1 MBOX size = 3\n 2 \n 3 * * next email:\n\
    \ 4 \n 5 To: <mark@markwatson.com>\n 6 From: Ruby Weekly= <rw@peterc.org>\n 7\
    \ Subject: This week's Ruby news issue\n 8 \n 9 This week's Ruby and Rails news\n\
    10 \n11 Ruby Weekly - A Weekly Ruby Newsletter\n12 Issue 264 - September 17=2C\
    \ 2015\n13 \n14  ...  ...\n```\n\nYou now can parse and use information from exported\
    \ Microsoft Office documents. As I mentioned before, when you export Google documents\
    \ this process also generates documents in the Microsoft formats.\n\n### Using\
    \ Postgres as a Local Document Store with Text Search\n\nWe will now develop a\
    \ simple set of utiltity classes for easily string structured data and “less structured”\
    \ JSON data in a Postgres database. We will also provide support for text search\
    \ in database table columns containing text data.\n\nI use many different data\
    \ stores in my work: Amazon S3 and DynamoDB, Google Big Table, Hadoop File System,\
    \ MongoDB, CouchDB, Cassandra, etc. Lots of good options for different types of\
    \ projects!\n\nThat said, Postgres is my “Swiss Army knife” data store offering\
    \ a rock solid relational database, full text indexing, and native support for\
    \ schema less native JSON documents. I this short section I am going to cover\
    \ JDBC access to Postgres and cover the common use cases that you might need if\
    \ you also want to use Postgres as your “Swiss Army knife” data store.\n\nThe\
    \ following listing shows these utilities, encapsulated in the Java class **PostgresUtilities**.\
    \ In line 16 we set the server name, Postgres account anme, and password for connecting\
    \ to a database. Here the server name is “localhost” since I am running both the\
    \ example program and the postgres server on my laptop. I pass the connection\
    \ parameters in the connection URI on line 14 but the commented out lines 25 and\
    \ 26 show you how to set connection properties in your code if you prefer that."
