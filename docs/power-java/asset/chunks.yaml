    37     System.out.println(\"Cost: \" + cost);\n38 \n39     sc.stop();\n40   }\n\
    41 }\n```\n\nThe inner class **ParsePoint** is used to generate a single numeric\
    \ feature vector given input data. In this simple case the input data is a string\
    \ like “9.1 9.1 9.1” that needs to be tokenized and each token converted to a\
    \ double floating point number. This inner class in the Wikipedia example will\
    \ be much more complex.\n\nIn line 24 we are creating a Spark execution context.\
    \ In all of the examples in this chapter we use a “local” context which means\
    \ that Spark will run inside the same JVM as our example code. In production the\
    \ Spark context could access a Spark cluster utilizing multiple servers.\n\nLines\
    \ 25 and 27 introduce the use of the class **JavaRDD** which is the Java version\
    \ of the Scala Ricj Data Definition class used internally to implement Spark.\
    \ This data class can live inside a single JVM when we use a local Spark context\
    \ or be spread over many servers when using a Spark server cluster. In line 25\
    \ we are reading the input strings and in line 27 we are using the inner class\
    \ **ParsePoint** to convert the input text lines to numeric feature vectors.\n\
    \nLines 29 and 30 use the static method **KMeans.train** to create a trained clustering\
    \ model. Lines 33 through 35 print out the clusers (listing of the output was\
    \ shown earlier in this section)."
