    \ sec\n14 \n15 Results :\n16 \n17 Tests run: 1, Failures: 0, Errors: 0, Skipped:\
    \ 0\n```\n\n### Resolving Named Entities in Text to Wikipedia URIs\n\nWe will\
    \ solve the same problem in this section as we looked at in the last section:\
    \ resolving named entities with DBPedia (Wikipedia) URIs but we will use an alternative\
    \ approach.\n\nIn some of my work I find it useful to resolve named entities (e.g.,\
    \ people, organizations, products, locations, etc.) in text to unique DBPedia\
    \ URIs. The DBPedia semantic web data, which we will also discuss in the next\
    \ chapter, is derived from the “info boxes” in Wikipedia articles. I find DBPedia\
    \ to be an incredibly useful knowledge source. When I worked at Google with the\
    \ Knowledge Graph we were using a core of knowledge from Wikipedia/DBPedia and\
    \ Freebase with a lot of other information sources. DBPedia is already (reasonably)\
    \ clean data and is ready to be used as-is in your applications.\n\nThe idea behind\
    \ the example in this chapter is simple: the RDF data dumps from DBPedia can be\
    \ processed to capture an entity name and the corresponding DBPedia entity URI.\n\
    \nThe raw DPBedia files can be downloaded from [Resolving Named Entities](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
