    Single Epithelial Cell Size\", training_data,\n38                            \
    \   4, 0.0, 1.0, 10);\n39       PrintHistogram.historam(\"Bare Nuclei\", training_data,\
    \ 5, 0.0, 1.0, 10);\n40       PrintHistogram.historam(\"Bland Chromatin\", training_data,\
    \ 6, 0.0, 1.0, 10);\n41       PrintHistogram.historam(\"Normal Nucleoli\", training_data,\
    \ 7, 0.0, 1.0, 10);\n42       PrintHistogram.historam(\"Mitoses\", training_data,\
    \ 8, 0.0, 1.0, 10);\n43     }\n44     \n45     AnomalyDetection detector = new\
    \ AnomalyDetection(10, line_count - 1,\n46                                   \
    \                   training_data);\n47 \n48     // the train method will print\
    \ training results like\n49     // precision, recall, and F1:\n50     detector.train();\n\
    51 \n52     // get best model parameters:\n53     double best_epsilon = detector.bestEpsilon();\n\
    54     double [] mean_values = detector.muValues();\n55     double [] sigma_squared\
    \ = detector.sigmaSquared();\n56 \n57     // to use this model, us the method\
    \ AnomalyDetection.isAnamoly(double []):\n58 \n59     double [] test_malignant\
    \ = new double[] {0.5,1,1,0.8,0.5,0.5,0.7,1,0.1};\n60     double [] test_benign\
    \ = new double[] {0.5,0.4,0.5,0.1,0.8,0.1,0.3,0.6,0.1};\n61     boolean malignant_result\
    \ = detector.isAnamoly(test_malignant);\n62     boolean benign_result = detector.isAnamoly(test_benign);\n\
    63     System.out.println(\"\\n\\nUsing the trained model:\");\n64     System.out.println(\"\
    malignant result = \" + malignant_result +\n65                        \", benign\
    \ result = \" + benign_result);\n66   }\n67 }\n```\n\nData used by an anomaly\
    \ detecton model should have (roughly) a Gaussian (bell curve shape) distribution.\
    \ What form does the cancer data have? Unfortunately, each of the data features\
    \ seems to either have a greater density at the lower range of feature values\
    \ or large density at the extremes of the data feature ranges. This will cause\
    \ our model to not perform as well as we would like. Here are the inputs displayed\
    \ as five-bin histograms:\n\n```\nClump Thickness\n0\t177\n1\t174\n2\t154\n3\t\
    63\n4\t80\n\nUniformity of Cell Size\n0\t393\n1\t86\n2\t54\n3\t43\n4\t72\n\nUniformity\
    \ of Cell Shape\n0\t380\n1\t92\n2\t58\n3\t54\n4\t64\n\nMarginal Adhesion\n0\t\
    427\n1\t85\n2\t42\n3\t37\n4\t57\n\nSingle Epithelial Cell Size\n0\t394\n1\t117\n\
    2\t76\n3\t28\n4\t33\n\nBare Nuclei\n0\t409\n1\t44\n2\t33\n3\t27\n4\t135\n\nBland\
    \ Chromatin\n0\t298\n1\t182\n2\t41\n3\t97\n4\t30\n\nNormal Nucleoli\n0\t442\n\
    1\t56\n2\t39\n3\t37\n4\t74\n\nMitoses\n0\t567\n1\t42\n2\t8\n3\t17\n4\t14\n```\n\
    \nI won’t do it in this example, but the feature “Bare Nuclei” should be removed\
    \ because it is not even close to being a bell-shaped distribution. Another thing\
    \ that you can do (recommended by Andrew Ng in his Coursera Machine Learning class)\
    \ is to take the log of data and otherwise transform it to something that looks\
    \ more like a Gaussian distribution. In the class WisconsinAnomalyDetection, you\
    \ could for example, transform the data using something like:\n\n```\n1   // make\
    \ the data look more like a Gaussian (bell curve shaped) distribution:\n2   double\
    \ min = 1.e6, max = -1.e6;\n3   for (int i=0; i<9; i++) {\n4     xs[i] = Math.log(xs[i]\
    \ + 1.2);\n5     if (xs[i] < min) min = xs[i];\n6     if (xs[i] > max) max = xs[i];\n\
    7   }\n8   for (int i=0; i<9; i++) xs[i] = (xs[i] - min) / (max - min);\n```\n\
    \nThe constant 1.2 in line 4 is a tuning parameter that I got by trial and error\
    \ by iterating on adjusting the factor and looking at the data histograms.\n\n\
    In a real application you would drop features that you can not transform to something\
    \ like a Gaussian distribution.\n\nHere are the results of running the code as\
    \ it is in the github repository for this book:\n\n```\n -- best epsilon = 0.28\n\
    \ -- number of test examples = 63\n -- number of false positives = 0.0\n -- number\
    \ of true positives = 11.0\n -- number of false negatives = 8.0\n -- number of\
    \ true negatives = 44.0\n -- precision = 1.0\n -- recall = 0.5789473684210527\n\
    \ -- F1 = 0.7333333333333334\n\nUsing the trained model:\nmalignant result = true,\
    \ benign result = false\n```\n\nHow do we evaluate these results? The precision\
    \ value of 1.0 means that there were no false positives. False positives are predictions\
    \ of a true result when it should have been false. The value 0.578 for recall\
    \ means that of all the samples that should have been classified as positive,\
    \ we only predicted about 57.8% of them. The F1 score is calculated as two times\
    \ the product of precision and recall, divided by the sum of precision plus recall.\n\
    \n## Deep Learning Using Deeplearning4j\n\nThe [Deeplearning4j.org](http://deeplearning4j.org/)\
    \ Java library supports several neural network algorithms including support for\
    \ Deep Learning (DL). We will look at an example of DL implementing Deep-Belief\
    \ networks using the same University of Wisconsin cancer database that we used\
    \ in the chapters on machine learning with Spark and on anomaly detection. Deep\
    \ learning refers to neural networks with many layers, possibly with weights connecting\
    \ neurons in non-adjacent layers which makes it possible to model temporal and\
    \ spacial patterns in data.\n\nI am going to assume that you have some knowledge\
    \ of simple backpropagation neural networks. If you are unfamiliar with neural\
    \ networks you might want to pause and do a web search for “neural networks backpropagation\
    \ tutorial” or read the neural network chapter in my book [Practical Artificial\
    \ Intelligence Programming With Java, 4th edition](https://leanpub.com/javaai)."
