- fmt: "\nThere are four examples in this chapter. If you want to skip ahead and run\
    \ the code before reading the rest of the chapter, run each maven test separately:\n\
    \n```\nmvn test -Dtest=HelloTest\nmvn test -Dtest=KMeansTest\nmvn test -Dtest=WikipediaKMeansTest\n\
    mvn test -Dtest=LogisticRegressionTest\nmvn test -Dtest=SvmClassifierTest\n```\n\
    \nSpark has all of Hadoop as a dependency because Spark is able to interact with\
    \ Hadoop and Hadoop file systems. It will take a short while to download all of\
    \ these dependencies but that only needs to be done one time. To augment the material\
    \ in this chapter you can refer to the [Spark Programming Guide](https://spark.apache.org/docs/latest/programming-guide.html).\
    \ We will also be using material in the [Spark Machine Learning Library (MLlib)\
    \ Guide](https://spark.apache.org/docs/1.5.0/mllib-guide.html).\n\nThe following\
    \ figure shows the project for this chapter in the Community Edition of IntelliJ:\n\
    \n![IntelliJ project view for the examples in this chapter](images/00006.jpeg)\n\
    \nIntelliJ project view for the examples in this chapter\n\n### Hello Spark -\
    \ a Word Count Example\n\nThe word count example is frequently used to introduce\
    \ map reduce and I will also use it here for a “hello world” type simple Spark\
    \ example. In the following listing, lines 3 through 6 import the required classes.\
    \ In lines 3 and 4 `RDD` stands for Resilient Distributed Datasets (`RDD`). Spark\
    \ was written in Scala so we will sometimes see Java wrapper classes that are\
    \ recognizable with the prefix “Java.” Each `RDD` is a collection of objects of\
    \ some type that can be distributed across multiple servers in a Spark cluster.\
    \ `RDDs` are fault tolerant and there is sufficient information in a Spark cluster\
    \ to recreate any lost data due to a server or software failure.\n\n```\n 1 package\
    \ com.markwatson.machine_learning;\n 2 \n 3 import org.apache.spark.api.java.JavaPairRDD;\n\
    \ 4 import org.apache.spark.api.java.JavaRDD;\n 5 import org.apache.spark.api.java.JavaSparkContext;\n\
    \ 6 import scala.Tuple2;\n 7 \n 8 import java.util.Arrays;\n 9 import java.util.List;\n\
    10 import java.util.Map;\n11 \n12 public class HelloSpark {\n 13 \n14   static\
    \ private List<String> tokenize(String s) {\n 15     return Arrays.asList(s.replaceAll(\"\
    \\\\.\", \" \\\\. \").replaceAll(\",\", \" , \")\n16         .replaceAll(\";\"\
    , \" ; \").split(\" \"));\n17   }\n 18 \n19   static public void main(String[]\
    \ args) {\n 20     JavaSparkContext sc = new JavaSparkContext(\"local\", \"Hello\
    \ Spark\");\n 21 \n 22     JavaRDD<String> lines = sc.textFile(\"data/test1.txt\"\
    );\n 23     JavaRDD<String> tokens = lines.flatMap(line -> tokenize(line));\n\
    \ 24     JavaPairRDD<String, Integer> counts =\n 25         tokens.mapToPair(token\
    \ ->\n 26 \t\t\t new Tuple2<String, Integer>(token.toLowerCase(), 1))\n 27   \
    \            .reduceByKey((count1, count2) -> count1 + count2);\n 28     Map countMap\
    \ = counts.collectAsMap();\n 29     System.out.println(countMap);\n 30     List<Tuple2<String,\
    \ Integer>> collection = counts.collect();\n 31     System.out.println(collection);\n\
    \ 32   }\n 33 }\n```\n\nLines 14 through 17 define the simple `tokenizer` method\
    \ that takes English text and maps it to a list of strings. I broke this out into\
    \ a separate method as a reminder that punctuation needs to be handled and breaking\
    \ it in to a separate method makes it easier for you to experiment with custom\
    \ tokenization that might be needed for your particular text input files. One\
    \ possibility is using the OpenNLP tokenizer model that we used in the last chapter.\
    \ For example, we would want the string “tree.” to be tokenized as [“tree”, “.”]\
    \ and not [“tree.”]. This method is used in line 23 and is called for each line\
    \ in the input text file.\n\nIn this example in line 22 we are reading a local\
    \ text file `data/test1.txt` but in general the argument to `JavaSparkContext.textFile()`\
    \ can be a URI specifying a file on a local Hadoop file system (HDFS), an Amazon\
    \ S3 object, of a Cassandra file system. Pay some attention to the type of the\
    \ variable `lines` defined in line 22: the type `JavaRDD<string>` specifies an\
    \ RDD collection where the distributed objects are strings.\n\nThe code in lines\
    \ 29 through 32 is really not very complicated if we parse it out a bit at a time.\
    \ The type of `counts` is an RDD distributed collection where each object in the\
    \ collection is a pair of string and integer values. The code in lines 25 through\
    \ 27 takes each token in the original text file and produces a pair (or `Tuple2`)\
    \ values consisting of the token string and the integer 1\\. As an example, an\
    \ array of three tokens like:\n\n```\n1     [\"the\", \"dog\", \"ran\"]\n```\n\
    \nwould be converted to an array of three pairs like:\n\n```\n1     [[\"the\"\
    , 1], [\"dog\", 1], [\"ran\", 1]]\n```\n\nThe statement in line 28 is uses the\
    \ method `reduceByKey` which partitions the array of pairs by unique key. Here\
    \ is what the output of the program looks like:\n\n```\n1     {dog=2, most=1,\
    \ of=1, down=1, rabbit=1, slept=1, the=5, street=1,\n2      chased=1, day=1}\n\
    3 \n```\n\n### Introducing the Spark MLlib Machine Library\n\nAs I write this\
    \ Chapter in the fall of 2015, the Spark MLlib library is at version 1.5 and under\
    \ development. When you experiment with the examples first try version 1.5\\.\
    \ I will update the git repository for this book and I will try to keep the code\
    \ examples compatible with the current stable versions of Spark.\n\nThe examples\
    \ in the following sections show how to apply the MLlib library to problems of\
    \ logistic regression, using the K-Means algorithm to cluster similar documents,\
    \ and using the word2vec algorithm to find strong associations between words in\
    \ documents.\n\n### MLlib Logistic Regression Example Using University Wisconsin\
    \ Cancer Database\n\nWe will use supervised learning in this section to build\
    \ a regression model that maps a numeric feature vector of symptoms to a numeric\
    \ value where larger values close to one indicate malignancy and smaller values\
    \ closer to zero indicate benign.\n\nMLlib supports three types of linear models:\
    \ Support Vector Machine (SVM), logistic regression (models for membership in\
    \ one or more classes or categories), and linear regression (models that model\
    \ outputs for a class as a floating point number in the range [0..1]). The Spark\
    \ MLlib documentation (http://spark.apache.org/docs/latest/mllib-linear-methods.html)\
    \ on these three linear models is very good and their sample programs are similar\
    \ so it is easy enough to switch the type of linear model that you use.\n\nWe\
    \ will use logistic regression for the example in this section. Andrew Ng, in\
    \ his excellent [Machine Learning class](https://www.coursera.org/learn/machine-learning)\
    \ said that the first model he tries when starting a new problem is a linear model.\
    \ We will repeat this example in the next section using SVM instead of logistic\
    \ regression.\n\nIf you read my book [Build Intelligent Systems with Javascript](https://leanpub.com/aijavascript)\
    \ the training and test dataset used in this section will look familiar: [University\
    \ of Wisconsin breast cancer data set](https://archive.ics.uci.edu/ml/datasets/Breast+Cancer+Wisconsin+%28Diagnostic%29).\n\
    \nFrom the University of Wisconsin web page, here are the attributes with their\
    \ allowed ranges in this data set:\n"
