  raw: "```\n 1 package com.markwatson.iot;\n 2 \n 3 import java.io.IOException;\n\
    \ 4 import java.net.*;\n 5 \n 6 public class UDPClient {\n 7 \n 8   static String\
    \ INET_ADDR = \"localhost\";\n 9   static int PORT = 9005;\n10   static int PACKETSIZE\
    \ = 256;\n11 \n12   public static void main(String args[]) throws IOException\
    \ {\n13     InetAddress host = InetAddress.getByName(INET_ADDR);\n14     DatagramSocket\
    \ socket = new DatagramSocket();\n15     byte[] data = (\"Hello Server\" + System.currentTimeMillis()).getBytes();\n\
    16     DatagramPacket packet = new DatagramPacket(data, data.length, host, PORT);\n\
    17     socket.send(packet);\n18     socket.setSoTimeout(1000); // 1000 milliseconds\n\
    19     packet.setData(new byte[PACKETSIZE]);\n20     socket.receive(packet);\n\
    21     System.out.println(new String(packet.getData()));\n22     socket.close();\n\
    23   }\n24 }\n```\n\nRunning this example produces the following output (edited\
    \ to fit the page width):\n\n```\n> java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n         com.markwatson.iot.UDPClient\nfrom server - Hello Server1431540275433\n\
    ```\n\nI have used UDP network programming in many projects and I will mention\
    \ two of them here. In the 1980s I was an architect and developer on the NMRD\
    \ project that used 38 seismic research stations around the world to collect data\
    \ that we used to determine if any country was conducting nuclear explosive tests.\
    \ We used a guaranteed messaging system for meta control data but used low level\
    \ UDP for much of the raw data transfer. The other application was communcations\
    \ library for networked racecar and hovercraft games that ran on a local network.\
    \ UDP is very good for local network game development because it is efficient\
    \ and the chance of losing data packets is very low and even if packets are lost\
    \ game play is usually not affected. Remember that when using UDP you are not\
    \ guaranteed delivery of data and not guaranteed notification of failure!\n\n\
    ### Multicast/Broadcast Network Programming\n\nThe examples in the next two sections\
    \ are similar to the examples in the last two sections with one main difference:\
    \ a server periodically broadcasts data using UDP. The server does not care if\
    \ any client is listening or not, it simply broadcasts data. If any clients are\
    \ listening they will probably receive the data. I say that they will probably\
    \ receive the data because UDP provides no delivery guarantees.\n\nThere are specific\
    \ INET addresses that can be used for local multicast in the range of addresses\
    \ between 224.0.0.0 and 224.0.0.255. We will use 224.0.0.5 in the two example\
    \ programs. These are local addresses that are invisible to the the Internet.\n\
    \n#### Multicast Broadcast Server\n\nThe following example is very similar to\
    \ that seen two sections ago (Java class UDPServer) except we do not wait for\
    \ a client request.\n\n```\n 1 package com.markwatson.iot;\n 2 \n 3 import java.io.IOException;\n\
    \ 4 import java.net.*;\n 5 \n 6 public class MulticastServer {\n 7 \n 8   final\
    \ static String INET_ADDR = \"224.0.0.5\";\n 9   final static int PORT = 9002;\n\
    10 \n11   public static void main(String[] args)\n12       throws IOException,\
    \ InterruptedException {\n13     InetAddress addr = InetAddress.getByName(INET_ADDR);\n\
    14     DatagramSocket serverSocket = new DatagramSocket();\n15     for (int i\
    \ = 0; i < 10; i++) {\n16       String message = \"message \" + i;\n17 \n18  \
    \     DatagramPacket messagePacket =\n19           new DatagramPacket(message.getBytes(),\n\
    20               message.getBytes().length, addr, PORT);\n21       serverSocket.send(messagePacket);\n\
    22 \n23       System.out.println(\"broadcast message sent: \" + message);\n24\
    \       Thread.sleep(500);\n25     }\n26   }\n27 }\n```\n\nIn line 13 we create\
    \ an INET address for “224.0.0.5” and in line 14 create a DatagramSocket that\
    \ is reused for broadcasting 10 messages with a time delay of 1/2 a second between\
    \ messages. The broadcast messages are defined in line 16 and the code in lines\
    \ 18 to 21 creates a new DatagramPacket with the message text data and gets broadcast\
    \ to the local network in line 21.\n\nRunning this example produces the following\
    \ output (output edited for brevity):\n\n```\n> java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ com.markwatson.iot.\\\nMulticastServer\nbroadcast message sent: message 0\n\
    broadcast message sent: message 1\n ...\nbroadcast message sent: message 8\nbroadcast\
    \ message sent: message 9\n```\n\nUnlike the UDPServer example two sections ago,\
    \ you will get this output regardless of whether you are running the listing client\
    \ in the next section.\n\n#### Multicast Broadcast Listener\n\nThe example in\
    \ this section listens for broadcasts by the server example in the last section.\
    \ The broadcast server and clients need to agree on the INET address and a port\
    \ number (9002 in these examples).\n\n```\n 1 package com.markwatson.iot;\n 2\
    \ \n 3 import java.io.IOException;\n 4 import java.net.DatagramPacket;\n 5 import\
    \ java.net.InetAddress;\n 6 import java.net.MulticastSocket;\n 7 import java.net.UnknownHostException;\n\
    \ 8 \n 9 public class MulticastClient {\n10 \n11   final static String INET_ADDR\
    \ = \"224.0.0.5\";\n12   final static int PORT = 9002;\n13 \n14   public static\
    \ void main(String[] args) throws IOException {\n15     InetAddress address =\
    \ InetAddress.getByName(INET_ADDR);\n16     byte[] buf = new byte[512]; // more\
    \ than enough for any UDP style packet\n17     MulticastSocket clientSocket =\
    \ new MulticastSocket(PORT);\n18     // listen for broadcast messages:\n19   \
    \  clientSocket.joinGroup(address);\n20 \n21     while (true) {\n22       DatagramPacket\
    \ messagePacket = new DatagramPacket(buf, buf.length);\n23       clientSocket.receive(messagePacket);\n\
    24 \n25       String message = new String(buf, 0, buf.length);\n26       System.out.println(\"\
    received broadcast message: \" + message);\n27     }\n28   }\n29 }\n```\n\nThe\
    \ client creates an InetAddress in line 15 and allocates storage for the received\
    \ text messages in line 16\\. We create a MulticastSocket on port 9002 in line\
    \ 17 and in line 19 join the broadcast server’s group. In lines 21 through 27\
    \ we loop forever listening for broadcast messages and printing them out.\n\n\
    Running this example produces the following output (output edited for brevity):\n\
    \n```\n> java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n     \
    \     com.markwatson.iot.MulticastClient\nreceived broadcast message: message\
    \ 0\nreceived broadcast message: message 1\n ...\nreceived broadcast message:\
    \ message 8\nreceived broadcast message: message 9\n```\n\n### Wrap Up on IoT\n\
    \nEven though I personally have some concerns about security and privacy for IoT\
    \ applications and products, I am enthusiastic about the possibilities of making\
    \ our lives simpler and more productive with small networked devices. When we\
    \ work and play we want as much as possible to not think about our computing devices\
    \ so that we can concentrate on our activities.\n\nI have barely scratched the\
    \ surface on useful IoT technologies in this chapter but I hope that I have shown\
    \ you network programming techniques that you can use in your projects (IoT and\
    \ also networked game programming). As I write this book there are companies supplying\
    \ IoT hardware development kits and deciding on one kit and software framework\
    \ and creating your own projects is a good way to proceed.\n\n## Natural Language\
    \ Processing Using OpenNLP\n\nI have worked in the field of Natural Language Processing\
    \ (NLP) since the early 1980s. Many more people are interested in the field of\
    \ NLP and the techniques have changed drastically. NLP has usually been considered\
    \ part of the field of artificial intelligence (AI) and in the 1980s and 1990s\
    \ there was more interest in symbolic AI, that is the manipulation of high level\
    \ symbols that are meaningful to people because of our knowledge of the real world.\
    \ As an example, the symbol **car** means something to us but to AI software this\
    \ symbol in itself has no meaning except for possible semantic relationships to\
    \ other symbols like **driver** and **road**."
