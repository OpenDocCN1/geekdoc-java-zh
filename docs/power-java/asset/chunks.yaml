    \ args) throws Exception {\n14     Document doc = Jsoup.connect(\"http://www.markwatson.com\"\
    ).get();\n15     Elements newsHeadlines = doc.select(\"div p\");\n16     for (Element\
    \ element : newsHeadlines) {\n17       System.out.println(\" next element text:\
    \ \" + element.text());\n18     }\n19   }\n20 }\n```\n\nIn line `15` I am selecting\
    \ the pattern that returns all `P` elements that are direct children of any `DIV`\
    \ element and in lines `16` to `18` print the text inside these `P` elements.\n\
    \nFor training data for machine learning it is useful to just grab all text on\
    \ a web page and assume that common phrases dealing with web navigation, etc.\
    \ will be dropped from learned models because they occur in many different training\
    \ examples for different classifications. The following code snippet shows how\
    \ to fetch the plain text from an entire web page:\n\n```\n Document doc = Jsoup.connect(\"\
    http://www.markwatson.com\").get();\n    String all_page_text = doc.text();\n\
    \    System.out.println(\"All text on web page:\\n\" + all_page_text);\n```\n\n\
    ```\nAll text on web page:\nMark Watson: Consultant specializing in machine learning\
    \ and artificial intelligence Toggle navigation Mark Watson Home page Consulting\
    \ Free mentoring Blog Books Open Source Fun Consultant specializing in machine\
    \ learning, artificial intelligence, cognitive computing, and web engineering...\n\
    ```\n\nThe 2gram (i.e., two words in sequence) “Toggle navigation” in the last\
    \ listing has nothing to do with the real content in my site and is an artifact\
    \ of using the Bootstrap CSS and Javascript tools. Often “noise” like this is\
