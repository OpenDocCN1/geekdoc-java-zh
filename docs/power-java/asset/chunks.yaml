    \ government\" ;\n        kb:containsPerson \"David Petraeus\" ,\n           \
    \                 \"John McCain\" ,\n                            \"Hoshiyar Zebari\"\
    \ ,\n                            \"Barack Obama\" ,\n                        \
    \    \"George W. Bush\" ,\n                            \"Carly Fiorina\" ;\n \
    \       kb:containsIndustryTerm \"oil prices\" .\n```\n---\n\nIn the following\
    \ examples, we will look at queries but not the results. We will start with a\
    \ simple SPARQL query for subjects.\n\nIn the following examples, we will look\
    \ at queries but not the results. We will start with a simple SPARQL query for\
    \ subjects.\n\nIn the following examples, we will look at queries but not the\
    \ results. We will start with a simple SPARQL query for subjects.\n\nIn the following\
    \ examples, we will look at queries but not the results. We will start with a\
    \ simple SPARQL query for subjects.\n\n---\n\n...subjects (news article URLs)\
    \ and objects (matching triples):\n\n```sparql\n    SELECT ?subject\n    WHERE\
    \ {\n        ?subject <http://knowledgebooks.com/ontology#>containsCountry\n \
    \   }\n```\n\n---\n\nWhen WHERE clauses contain more than one triple pattern to\
    \ match, this is equivalent to a Boolean “and” operation. The DISTINCT clause\
    \ removes duplicate results. The ORDER BY clause sorts the output in alphabetical\
    \ order: in this case first by predicate (containsCity, containsCountry, etc.)\
    \ and then by object. The LIMIT modifier limits the number of results returned\
    \ and the OFFSET modifier sets the number of matching results to skip.\n\n```sparql\n\
    \    PREFIX kb:<http://knowledgebooks.com/ontology#>\n    SELECT ?subject ?a_predicate\
    \ ?an_object\n    WHERE {\n        ?subject kb:containsCountry\n    }\n    DISTINCT\n\
    \    ORDER BY ?a_predicate ?an_object\n    LIMIT 10\n    OFFSET 5\n```\n\n---\n\
    \nWe could have filtered on any other predicate, for instance to find articles\
    \ exactly “Maryland.” The following queries were copied from Java files so you\
    \ would not escape the marks.\n\n```sparql\n    PREFIX kb:<http://knowledgebooks.com/ontology#>\n\
    \    SELECT ?subject\n    WHERE { ?subject kb:containsState \"Maryland\" }\n```\n\
    \n---\n\nWe can also match partial string literals against regular expressions:\n\
    \n```sparql\n    PREFIX kb:<http://knowledgebooks.com/ontology#>\n    SELECT ?subject\
    \ ?object\n    WHERE {\n        ?subject kb:containsOrganization\n        ?object\
    \ FILTER(?object, \"University\")\n    }\n```\n\n---\n\nPrior to this last example\
    \ query we only requested that the query return values for subject and predicate\
    \ for triples that matched. However, we might want to return all triples whose\
    \ subject (in this case news article URI) is one of the matched triples. Note\
    \ that there are two matching triples, each terminated with a period:\n\n```sparql\n\
    \    PREFIX kb:<http://knowledgebooks.com/ontology#>\n    SELECT ?subject ?a_predicate\
    \ ?an_object\n    WHERE {\n        ?subject kb:containsOrganization\n        ?object\
    \ FILTER(?object, \"University\") .\n\n        ?subject ?a_predicate ?an_object\
    \ .\n    }\n```\n\n---\n\nWe are finished with our quick tutorial on using the\
    \ SELECT query form. There are three other query forms that I am not covering\
    \ in this chapter:\n\n*   `CONSTRUCT` – returns a new RDF graph of query results\n\
    *   `ASK` – returns Boolean true or false indicating if a query matches any triples\n\
    *   `DESCRIBE` – returns a new RDF graph containing matched resources\n\n### SPARQL\
    \ Query Client\n\nThere are many available public RDF data sources. Some examples\
    \ of publicly available SPARQL endpoints are:\n"
