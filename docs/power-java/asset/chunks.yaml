    \ network chapter in my book [Practical Artificial Intelligence Programming With\
    \ Java, 4th edition](https://leanpub.com/javaai).\n"
- fmt: "\nThe difficulty in training many layer networks with backpropagation is that\
    \ the delta errors in the layers near the input layer (and far from the output\
    \ layer) get very small and training can take a very long time even on modern\
    \ processors and GPUs. Geoffrey Hinton and his colleagues created a new technique\
    \ for pretraining weights. In 2012 I took a Coursera course taught by Hinton and\
    \ some colleagues titled [‘Neural Networks for Machine Learning’](https://www.coursera.org/course/neuralnets)\
    \ and the material may still be available online when you read this book.\n\n\
    For Java developers, `Deeplearning4j` is a great starting point for experimenting\
    \ with deep learning. If you also use Python then there are good tutorials and\
    \ other learning assets at [deeplearning.net](http://deeplearning.net/).\n\n#\
    \ Deep Belief Networks\n\nDeep Belief Networks (DBN) are a type of deep neural\
    \ network containing multiple hidden neuron layers where there are no connections\
    \ between neurons inside any specific hidden layer. Each hidden layer learns features\
    \ based on training data an the values of weights from the previous hidden layer.\
    \ By previous layer I refer to the connected layer that is closer to the input\
    \ layer. A DBN can learn more abstract features, with more abstraction in the\
    \ hidden layers “further” from the input layer.\n\nDBNs are first trained a layer\
    \ at a time. Initially a set of training inputs is used to train the weights between\
    \ the input and the first hidden layer of neurons. Technically, as we preliminarily\
    \ train each succeeding pair of layers we are training a restricted Boltzmann\
    \ machine (RBM) to learn a new set of features. It is enough for you to know at\
    \ this point that RBMs are two layers, input and output, that are completely connected\
    \ (all neurons in the first layer have a weighted connection to each neuron in\
    \ the next layer) and there are no inner-layer connections.\n\nAs we progressively\
    \ train a DBN, the output layer for one RBM becomes the input layer for the next\
    \ neuron layer pair for preliminary training.\n\nOnce the hidden layers are all\
    \ preliminarily trained then backpropagation learning is used to retrain the entire\
    \ network but now delta errors are calculated by comparing the forward pass outputs\
    \ with the training outputs and back-propagating errors to update weights in layers\
    \ proceeding back towards the first hidden layer.\n\nThe important thing to understand\
    \ is that backpropagation tends to not work well for networks with many hidden\
    \ layers because the back propagated errors get smaller as we process backwards\
    \ towards the input neurons - this would cause network training to be very slow.\
    \ By precomputing weights using RBM pairs, we are closer to a set of weights to\
    \ minimize errors over the training set (and the test set).\n\n# Deep Belief Example\n\
    \nThe following screen show shows an IntelliJ project (you can use the free community\
    \ orprofessional version for the examples in this book) for the example in this\
    \ chapter:\n\n![IntelliJ project view for the examples in this chapter](images/00022.jpeg)\n\
    \nIntelliJ project view for the examples in this chapter\n\nThe `Deeplearning4j`\
    \ library uses user-written Java classes to import training and testing data into\
    \ a form that the `Deeplearning4j` library can use. The following listing shows\
    \ the implementation of the class `WisconsinDataSetIterator` that iterates through\
    \ the University of Wisconsin cancer data set:\n\n```\n 1 package com.markwatson.deeplearning;\n\
    \ 2 \n 3 import org.deeplearning4j.datasets.iterator.BaseDatasetIterator;\n 4\
    \ \n 5 import java.io.FileNotFoundException;\n 6 \n 7 \n 8 public class WisconsinDataSetIterator\
    \ extends BaseDatasetIterator {\n 99private static final long serialVersionUID\
    \ = -2023454995728682368L;\n10 \n11   public WisconsinDataSetIterator(int batch,\
    \ int numExamples)\n12          throws FileNotFoundException {\n13     super(batch,\
    \ numExamples, new WisconsinDataFetcher());\n14   }\n15 }\n```\n\nThe `WisconsinDataSetIterator`\
    \ constructor calls its super class with an instance of the class `WisconsinDataFetcher`\
    \ (defined in the next listing) to read the Comma Separated Values (CSV) spreadsheet\
    \ data from the file `data/cleaned_wisconsin_cancer_data.csv`:\n\n```\n 1 package\
    \ com.markwatson.deeplearning;\n 2 \n 3 import org.deeplearning4j.datasets.fetchers.CSVDataFetcher;\n\
    \ 4 \n 5 import java.io.FileInputStream;\n 6 import java.io.FileNotFoundException;\n\
    \ 7 \n 8 /**\n 9  * Created by markw on 10/5/15.\n10  */\n11 public class WisconsinDataFetcher\
    \ extends CSVDataFetcher {\n12 \n13   public WisconsinDataFetcher() throws FileNotFoundException\
    \ {\n14     super(new FileInputStream(\"data/cleaned_wisconsin_cancer_data.csv\"\
    ), 9);\n15   }\n16   @Override\n17   public void fetch(int i) {\n18     super.fetch(i);\n\
    19   }\n20 \n21 }\n```\n\nIn line 14, the last argument `9` defines which column\
    \ in the input CSV file contains the label data. This value is zero indexed so\
    \ if you look at the input file `data/cleaned_wisconsin_cancer_date.csv` this\
    \ will be the last column. Values of `4` in the last column idicate malignant\
    \ and values of `2` indicate not malignant.\n\nThe following listing shows the\
    \ definition of the class `DeepBeliefNetworkWisconsinData` that reads the University\
    \ of Wisconsin cancer data set using the code in the last two listings, randmly\
    \ selects part of it to use for training and for testing, creates a DBN, and tests\
    \ it. The value of the variable `numHidden` set in line 51 refers to the number\
    \ of neurons in each hidden layer. Setting `numberOfLayers` to `3` in line 52\
    \ indicates that we will just use a single hidden layer since this value (3) also\
    \ counts the input and output layers.\n\nThe network is configured and constructed\
    \ in lines 83 through 104\\. If we increased the number of hidden units (something\
    \ that you might do for more complex problems) then you would repeat lines 88\
    \ through 97 to add a new hidden layer, and you would change the layer indices\
    \ (first argument) as appropriate in calls to the chained method `.layer()`.\n"
