    (as we did in the last chapter) and Bing search was easy and allowed me to annotate
    text (with hyperlinks to web information sources) in near real time.


    ### Motivation for Knowledge Management


    Knowledge workers are different than previous kinds of workers who were trained
    to do a specific job repetitively. Knowledge workers tend to combine information
    from different sources to make decisions.


    When workers leave, if their knowledge is not codified then the organization loses
    value. This situation will get worse in the future as baby boomers retire in larger
    numbers. So, the broad goals of KM are to capture employee knowledge, to facilitate
    sharing knowledge and information between workers company wide, and provide tools
    to increase workers’ velocity in making good decisions that are based on solid
    information and previous organizational knowledge.


    For the purposes of this chapter we will discuss KM from the viewpoint of making
    maximum use of all available data sources, including shared cloud-based sources
    of information. We will do this through the implementation of Java code examples
    for accessing common document formats.


    Since KM is a hugely broad topic I am going to concentrate on a few relatively
    simple examples that will give you ideas for both capturing and using knowledge
    and in some cases also provide useful code from the examples in this book that
    you can use:


    *   Capture your email in a relational database and assign categories using some
    of the techniques we learned in the NLP and machine learning chapters.


    *   Store web page URIs and content snippets for future use.


    *   Java clients to process data in Google Drive, specifically reading Microsoft
    file formats that Google uses for exporting Google docs.


    *   Annotate text in a document store by resolving entity names to unique DBPedia
    URIs.


    *   Use Postgres as a local database to store discovered data that is discovered
    by the example software in this chapter.


    Microsoft Office 365, which I use, also has APIs for integrating your own programs
    into an Office 365 work flow. I decided to use Google Drive in this chapter because
    it is free to use but I also encourage you to experiment with the Office 365 APIs.
    You can take free Office 365 API classes offered online [edX.org](http://edx.org).
    We will use Google Drive as a data source for the example code developed in this
    chapter.


    As I mentioned earlier in this chapter in order to build a real system based on
    the ideas and example code in this chapter you will need to write a web applicaton
    that can authenticate users of your system to access data in Google Drive and/or
    in Microsoft OneDrive. In addition to real time access to shared data in the cloud,
    another important part of organizational KM systems that we are not discussing
    in this chapter is providing user and access roles. In the examples in this chapter
    we will ignore these organizational requirements and concentrate on the process
    of automatic discovery of useful metadata that helps to organize shared data.


    There are many KM products that cater to organizations or individuals. Depending
    on your requirements you might want to mix custom software with off the shelf
    software tools. Another important aspect of KM is the concept of **master** **data**
    which is creating a uniform data model and storage strategy for diverse (and often
    legacy) databases. This is partly what I worked on at Google. Even for the three
    simple examples we will develop in this chapter there are interesting issues involving
    master data that I will return to later.


    Most KM systems deal with internal data that is stored on local servers. While
    I do provide some very simple examples of using the Postgres relational database
    later in this chapter, I wanted to get you thinking about using multiple data
    sources and concentrating on data stored in commercial cloud services makes sense.


    ### Using Google Drive Cloud Takeout Service


    As I mentioned in the introduction to this chapter, while it is fairly easy to
    write a web app for Microsoft Azure that uses the Office 365 APIs an a web app
    for AppEngine (or Google Cloud) that uses the Google Drive data access APIs, building
    a web app with the auth2 support required to use these APIs is outside of the
    scope for an example program. So, I am cheating a little. Google has a “Google
    Takeout” service that everyone who uses Google services should periodically use
    to save all of their data from Google services.


    In this section and contained sub-sections we will use a “Google Takeout” dump
    as the data used by the example programs. The following subsections contain utilities
    for reading and parsing:


    *   Microsoft Excel which is what Google Takeout exports Google Drive spreadsheets
    as.


    *   Microsoft Word docx files which is the format that Google Takeout uses to
    export Google Drive word processing documents.


    *   iCal calendar files which is a standard format that Google Calendar data is
    exported as.


    *   Email mbox files which is the format that GMail is exported as.


    These are all widely used file formats so I hope the utilities developed in the
    next four sub-sections will be generally useful to you. The following figure shows
    a screen grab of the IntelliJ Community Edition project browser showing just the
    data files that I exported using Google Takeout. I “sanitized” these files by
    changing names, email addresses, etc. to use for the example programs in this
    chapter.


