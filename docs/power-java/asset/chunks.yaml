    \n现在我们将开发一组简单的工具类，用于方便地将 Postgres 数据库中的结构化数据和“较非结构化”的 JSON 数据转换为字符串。我们还将为包含文本数据的列提供文本搜索支持。\n\
    \n我在工作中使用许多不同的数据存储：Amazon S3 和 DynamoDB、Google Big Table、Hadoop 文件系统、MongoDB、CouchDB、Cassandra\
    \ 等。对于不同的项目有很多很好的选择！\n\n尽管如此，Postgres 是我的“瑞士军刀”式数据存储库，它提供了稳固的关系型数据库、全文索引以及对无模式原生\
    \ JSON 文档的原支持。在这一短节中，我将介绍 Postgres 的 JDBC 访问，并涵盖如果你也想将 Postgres 作为你的“瑞士军刀”式数据存储库时可能需要的常见用例。\n\
    \n"
