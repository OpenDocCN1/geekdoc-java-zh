    \ next anchor uri: http://www.markwatson.com/mentoring/\n next anchor text: Free\
    \ mentoring\n ...\n```\n\n### Wrap Up\n\nI just showed you [content] quick reference\
    \ to the most common use cases for my work. What I didn’t show you was an example\
    \ for organizing spidered information for reuse.\n\nI sometimes collect training\
    \ data for machine learning by using web searches with query keywords tailored\
    \ to find information in specific categories. I am not covering automating web\
    \ search in this book but I would like to refer you to an open source wrapper\
    \ that I wrote for Microsoft’s Bing Search APIs](https://github.com/mark-watson/bing_search_java)\
    \ on github. As an example, just to give you an idea for experimentation, if you\
