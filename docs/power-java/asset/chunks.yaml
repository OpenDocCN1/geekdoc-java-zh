  trans: "\n我们已经习惯了使用计算设备的物理限制。20 世纪 60 年代中期当我读高中时，在当地的一所大学上了一门编程课，我必须前往计算机中心“朝圣”，等待使用打字孔机的机会，走过去提交打孔卡，然后站在那里等待，最后拿到打印输出并取回我的卡片。后来，交互式终端允许我能够在更舒适的物理环境中工作。时间一快，近五十年过去了，我现在可以使用智能手机\
    \ `SSH` 连接到我的服务器，看电影，甚至使用 `Java` IDE。当我写这本书时，可能有 70% 的互联网使用是在移动设备上完成的。\n\n物联网（IoT）设备将计算设备更深入地整合到我们的生活中，减少了对我们的物理限制。我们的未来将包括服装、笔等小型个人物品、汽车、家具等，所有设备都连接在一个私有且安全的数据网中。除非你正在创作内容（例如编写软件、编辑图片和视频，或执行知识工程任务），否则你可能不会过多考虑你交互的设备，并且通常更倾向于使用移动设备。这种体验类似于开车，刹车、转向等任务是“自动”的，不需要太多的意识思考。\n\
    \n我们是物理生物。我们许多人在说话时会比划手势，在思考时会移动桌面上的东西，并且通常使用我们的物理环境。惊人的产品将物理对象与计算以及信息管理相结合。\n\
    \n在深入研究物联网设备之间的通信技术之前，我们将在下一节中简要离题介绍如何运行本章的示例程序。\n\n### 运行示例程序\n\n如果你想尝试运行示例程序，让我们在学习本章后面的网络编程技术和代码之前先完成准备工作。假设你已经克隆了书书中示例的\
    \ `github` 仓库，进入 `internet_of_things` 子目录，打开两个 shell 窗口，并使用以下命令按照它们出现的顺序运行示例（这些命令在\
    \ `README.md` 文件中，你可以直接复制粘贴）。这些命令被拆分为多行，以适应此本书的页宽：\n\n#### 构建\n\n```\n1     mvn\
    \ clean compile package assembly:single\n```\n\n#### 运行服务发现\n\n```\n1     java\
    \ -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n2 \t     com.markwatson.iot.CreateTestService\n\
    3     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar /\n4 \t     com.markwatson.iot.LookForTestService\n\
    ```\n\n#### 运行 UDP 实验：\n\n```\n 1     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n 2 \t     com.markwatson.iot.UDPServer\n 3     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n 4 \t     com.markwatson.iot.UDPClient\n 5 \n 6     # 多组播实验：\n 7     java\
    \ -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n 8 \t     com.markwatson.iot.MulticastServer\n\
    \ 9     java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n10 \t \
    \    com.markwatson.iot.MulticastClient\n```\n\n第 2 行编译并构建示例。对于每个示例程序，你将在命令行运行两个程序。例如，第\
    \ 5 行和第 6 行的服务发现示例（在终端窗口中应在同一行输入），我们启动了一个测试服务，第 7 行和第 8 行运行服务测试客户端。同样，第 10 行到\
    \ 20 行显示了如何运行 UDP 实验和多组播实验的服务及测试客户端。在我们查看代码时，我会对每个示例重复这些指令，但我认为你可能喜欢在在本章稍后查看示例的实现之前，先运行这三个示例。\n\
    \n在每个示例中，请在不同的 shell 窗口中运行两个示例程序。为了增加趣味，可以使用不同的笔记本电脑或任何可以运行 `Java` 代码的设备运行示例。\n\
    \n下图显示了 `IntelliJ` 社区版中本章的项目：\n\n![本章示例的 IntelliJ 项目视图](img/00002.jpeg)\n\n本章示例的\
    \ IntelliJ 项目视图\n\n本章从一个你可能用于编写物联网应用程序的设计模式开始。然后，接下来的三个主要部分将向你展示如何使用目录查找、如何使用用户数据协议\
    \ (`UDP`) 代替 `TCP/IP`，以及多组播/广播。\n\n本章的内容相当基础，但似乎许多开发者没有低级网络编程技术的经验。我的希望是，你能理解何时可能需要使用\
    \ `UDP` 而不是 `TCP` 的低级协议，以及何时你会在应用程序中发现目录查找是有用的。\n\n### 设计模式\n\n后续章节示例所支持的模式简单（从原理而言）：小型设备注册它们提供的服务，并寻找其他设备提供的服务。设备将使用用户数据协议\
    \ (`UDP`) 和多组播来通信以使用和提供服务。一旦消费者发现了服务提供者（主机、IP 地址、端口和以及类型），消费者也可以向提供者建立直接的 `TCP/IP`\
    \ 套接连接以使用新发现的服务。\n\n下图显示了几个物联网用例：\n\n*   消费者使用 `JmDNS` 库在本地网络上广播对服务的请求。\n*   提供端的\
    \ `JmDNS` 库听到服务描述请求并广播可用服务。\n*   消费端的 `JmDNS` 库监听来自提供者的广播。\n*   使用服务描述，消费者向提供者建立直接套接连接。\n\
    *   提供者定期广播更新的数据。\n*   消费者监听更新数据的广播，并在数据可用时使用它。\n\n![消费者和提供者用例](img/00003.gif)\n\
    \n消费者和提供者用例\n\n此显示了几个用例。你可以使用编写的特定应用程序来实现物联网设备之间的交互模式。\n\n### 目录查找\n\n在接两个子节中，我们将使用\
    \ JavaJmDNS 库，它支持本地多组播域名服务 (`DNS`) 并支持服务发现。`JmDNS` 与 Apple 的 BonjourDiscovery\
    \ 服务兼容，该服务也可以安装在 Microsoft `Windows` 上。\n\n如果你更改手机设置以接受多组播，`JmDNS` 已成功用于 Android\
    \ 应用程序（自 Android 4.1 版本 [网络服务发现 (NDS)](https://developer.android.com/training/connect-devices-wirelessly/nsd)\
    \ 起）。Android 开发不是本章的范围，如果你感兴趣，我建议参考 `NDS` 文档和示例程序。我在 Galaxy S III (Android 4.4.2)\
    \ 和 Note 4 (Android 5.0.1) 上尝试了示例 Android `NsdChat` 应用，如果你对使用 Android 应用实验物联网开发感兴趣，这个示例应用将是一个很好的起点。\n\
    \n#### 创建并注册服务\n\n本节中的示例程序使用 `JmsDNS` Java 库注册了一个监听端口 `1234` 的的服务。在下一节中，我们将查看另一个连接到该服务的示例程序。\n\
    \n"
- fmt: "\n```\n 1 package com.markwatson.iot;\n 2 \n 3 import javax.jmdns.*;\n 4 import\
    \ java.io.IOException;\n 5 \n 6 public class CreateTestService {\n 7   static\
    \ public void main(String[] args) throws IOException {\n 8     JmDNS jmdns = JmDNS.create();\n\
    \ 9     jmdns.registerService(\n10         ServiceInfo.create(\"_http._tcp.local.\"\
    , \"FOO123.\", 1234,\n11             0, 0, \"any data for FOO123\")\n12     );\n\
    13     // listener for service FOO123:\n14     jmdns.addServiceListener(\"_http._tcp.local.\"\
    , new Foo123Listener());\n15   }\n16 \n17   static class Foo123Listener implements\
    \ ServiceListener {\n18 \n19     public void serviceAdded(ServiceEvent serviceEvent)\
    \ {\n20       System.out.println(\"FOO123 SERVICE ADDED in class CreateTestService\"\
    );\n21     }\n22 \n23     public void serviceRemoved(ServiceEvent serviceEvent)\
    \ {\n24       System.out.println(\"FOO123 SERVICE REMOVED in class CreateTestService\"\
    );\n25     }\n26 \n27     public void serviceResolved(ServiceEvent serviceEvent)\
    \ {\n28       System.out.println(\"FOO123 SERVICE RESOLVED in class CreateTestService\"\
    );\n29     }\n30   }\n31 }\n```\n\nThe service is created in lines `10` and `11`\
    \ defining the service name (notice that a period is added to the end of the service\
    \ name `FOO123`), the port that the server listens on (`1234` in this case), and\
    \ the last argument is any string data that you also want to pass to clients looking\
    \ up information on service `FOO123`. When you run the client in the next section\
    \ you will see that the client receives this information for the local DNS lookup.\n\
    \nRunning this example produces the following output (edited to fit the page width):\n\
    \n```\n> java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar \\\n     \
    \  com.markwatson.iot.CreateTestService\nFOO123 SERVICE ADDED in class CreateTestService\n\
    ```\n\n### Lookup a Service by Name\n\nIf you have the service created by the\
    \ example program in the last section running then the following example program\
    \ will lookup the service.\n\n```\n 1 package com.markwatson.iot;\n 2 \n 3 import\
    \ javax.jmdns.*;\n 4 import java.io.IOException;\n 5 \n 6 // reference: https://github.com/openhab/jmdns\n\
    \ 7 \n 8 public class LookForTestService {\n 9 \n10   static public void main(String[]\
    \ args) throws IOException {\n11     System.out.println(\"APPLICATION entered\
    \ registerService\");\n12     JmDNS jmdns = JmDNS.create();\n13     // try to\
    \ find a service named \"FOO123\":\n14     ServiceInfo si = jmdns.getServiceInfo(\"\
    _http._tcp.local.\", \"FOO123\");\n15     System.out.println(\"APPLICATION si:\
    \ \" + si);\n16     System.out.println(\"APPLICATION APP: \" + si.getApplication());\n\
    17     System.out.println(\"APPLICATION DOMAIN: \" + si.getDomain());\n18    \
    \ System.out.println(\"APPLICATION NAME: \" + si.getName());\n19     System.out.println(\"\
    APPLICATION PORT: \" + si.getPort());\n20     System.out.println(\"APPLICATION\
    \ getQualifiedName: \" + si.getQualifiedName());\n21     System.out.println(\"\
    APPLICATION getNiceTextString: \" + si.getNiceTextString(\\\n22 ));\n23   }\n\
    24 }\n```\n\nWe use the `JmsDNS` library in lines `12` and `14` to find a service\
    \ by name. In line `14` the first argument `_http._tcp.local.` indicates that\
    \ we are searching the local network (for example, your home network created by\
    \ a router from your local ISP).\n\nRunning this example produces the following\
    \ output (edited to fit the page width):\n\n```\n> java -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n       com.markwatson.iot.LookForTestService\nAPPLICATION entered registerService\n\
    APPLICATION si: [ServiceInfoImpl@1595428806\n                  name: 'FOO123._http._tcp.local.'\
    \ address: '/192.168.0.14:1234'\n                  status: 'DNS: Marks-MacBook-Air-local.local.\n\
    \                  state: probing 1 task: null', has data empty]\nAPPLICATION\
    \ APP: http\nAPPLICATION DOMAIN: local\nAPPLICATION NAME: FOO123\nAPPLICATION\
    \ PORT: 1234\nAPPLICATION getQualifiedName: FOO123._http._tcp.local.\nAPPLICATION\
    \ getNiceTextString: any data for FOO123\n```\n\nDo you want to find all local\
    \ services? Then you can also create a listener that will notify you of all local\
    \ HTTP services. There is an example program in the `JmsDNS` distribution on the\
    \ path `src/sample/java/samples/DiscoverServices.java` written by Werner Randelshofer.\
    \ I changed the package name to `com.markwatson.iot` and added it to the git repository\
    \ for this book. You can try it using the following commands:\n\n```\nmvn clean\
    \ compile package assembly:single\njava -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n         com.markwatson.iot.CreateTestService\njava -cp target/iot-1.0-SNAPSHOT-jar-with-dependencies.jar\
    \ \\\n         com.markwatson.iot.DiscoverServices\n```\n\nWhile it is often useful\
    \ to find all local services, I expect that for your own projects you will be\
    \ writing both service and client applications that cooperate on your local network.\
    \ In this case you know the service names and can simply look them up as in the\
    \ example in this section.\n\n### User Data Protocol Network Programming\n\nYou\
    \ are most likely familiar with using `TCP/IP` in network programming. `TCP/IP`\
    \ provides some guarantees that the sender is notified on failure to deliver data\
    \ to a receiving program. User Data Protocol (`UDP`) makes no such guarantees\
    \ for notification of message delivery and is very much more efficient than `TCP/IP`.\
    \ On local area networks data delivery is more robust to failure compared to the\
    \ Internet and since we are programming for a local network it makes some sense\
    \ to use a lower level and more efficient protocol.\n\n### Example UDP Server\n\
    \nThe example program in this section implements a simple service that listens\
    \ on port `9005` for UDP packets that are client requests. The example code prints\
    \ out packet data, changes the text from the client, and returns it to the client.\n\
    \n```\n 1 package com.markwatson.iot;\n 2 \n 3 import java.io.IOException;\n 4\
    \ import java.net.*;\n 5 \n 6 public class UDPServer {\n 7   final static int\
    \ PACKETSIZE = 256;\n 8   final static int PORT = 9005;\n 9 \n10   public static\
    \ void main(String args[]) throws IOException {\n11     DatagramSocket socket\
    \ = new DatagramSocket(PORT);\n12     while (true) {\n13       DatagramPacket\
    \ packet =\n14          new DatagramPacket(new byte[PACKETSIZE], PACKETSIZE);\n\
    15       socket.receive(packet);\n16       System.out.println(\"message from client:\
    \ \" + packet.getAddress() +\n17           \" port: \" + packet.getPort() + \"\
    \ data: \" +\n18           new String(packet.getData()));\n19       // change\
    \ message content before sending it back to the client:\n20       packet.setData((\"\
    from server - \" + new String(packet.getData())).getBytes(\\\n21 ));\n22     \
    \  socket.send(packet);\n23     }\n24   }\n25 }\n```\n\nRunning this example produces\
