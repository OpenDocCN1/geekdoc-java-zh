    ### Chapter Wrap Up


    In the previous chapter we used machine learning for natural language processing
    using the OpenNLP project. In the examples in this chapter we used Spark MLlib
    for logistic regression, document clustering, and determining which words are
    closely associated with each other.


    You can go far using OpenNLP and Spark MLlib in your projects. There are a few
    things to keep in mind, however. One of the most difficult aspects of machine
    learning is finding and preparing training data.


    One of the most powerful machine learning techniques is artificial neural networks.
    I have a long history of using neural networks (I was on a DARPA neural network
    advisory panel and wrote the first version of the commercial ANSim neural network
    product in the late 1980s). I decided not to cover simple neural network models
    in this book because I have already written about neural networks in one chapter
    of [Practical Artificial Intelligence Programming in Java](https://leanpub.com/javaai).
    “Deep learning” neural networks are also very effective (if difficult to use)
    for some types of machine learning problems (e.g., image recognition and speech
    recognition) and we will use the [Deeplearning4j](http://deeplearning4j.org) project
    in a later chapter.


    In the next chapter we cover another type of machine learning: anomaly detection.


    ## Anomaly Detection Machine Learning Example


    Anomaly detection models are used in one very specific class of use cases: when
    you have many negative (non-anomaly) examples and relatively few positive (anomaly)
    examples. For training we will ignore positive examples, create a model of “how
    things should be”, and hopefully be able to detect anomalies different from the
    original negative examples.


    If you have a large training set of both negative and positive examples then do
    not use anomaly detection models.


    ### Motivation for Anomaly Detection


    There are two other examples in this book using the University of Wisconsin cancer
    data. These other examples are supervised learning. Anomaly detection as we do
    it in this chapter is, more or less, unsupervised learning.


    When should we use anomaly detection? You should use supervised learning algorithms
    like neural networks and logistic classification when there are roughly equal
    number of available negative and positive examples in the training data. The University
    of Wisconsin cancer data set is fairly evenly split between negative and positive
    examples.

