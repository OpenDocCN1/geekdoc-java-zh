    ```\n\n"
- fmt: "\nWe will use the parsing model that is included in the OpenNLP distribution\
    \ to parse English language input text. You are unlikely to use a statistical\
    \ parsing model in your work but I think you will enjoy the material in the section.\
    \ If you are more interested in practical techniques then skip to the next chapter\
    \ that covers more machine learning techniques.\n\nThe following example code\
    \ listing is long (68 lines) but I will explain the interesting parts after the\
    \ listing:\n\n```java\n 1 package com.markwatson.opennlp;\n 2 \n 3 import opennlp.tools.cmdline.parser.ParserTool;\n\
    \ 4 import opennlp.tools.parser.Parse;\n 5 import opennlp.tools.parser.ParserModel;\n\
    \ 6 import opennlp.tools.parser.chunking.Parser;\n 7 \n 8 import java.io.FileInputStream;\n\
