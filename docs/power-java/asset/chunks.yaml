    \ -\n                                  target: [ 1.00, 0.00] predicted: [ 0.76,\
    \ 0.24]\n14:59:46.873 [main] INFO  c.m.d.DeepBeliefNetworkWisconsinData -\n  \
    \                                target: [ 1.00, 0.00] predicted: [ 0.65, 0.35]\n\
    \nActual Class 0 was predicted with Predicted 0 with count 151 times\n\nActual\
    \ Class 1 was predicted with Predicted 0 with count 44 times\n\n==========================Scores========================================\n\
    \ Accuracy:  0.7744\n Precision: 0.7744\n Recall:    1\n F1 Score:  0.8728323699421966\n\
    ===========================================================================\n\
    ```\n\nThe `F1` score is calculated as twice precision times recall, all divided\
    \ by `precision + recall`. We would like `F1` to be as close to 1.0 as possible\
    \ and it is common to spend a fair amount of time experimenting with meta learning\
    \ paramters to increase `F1`.\n\nIt is also fairly common to try to learn good\
    \ values of meta learning paramters also. We won’t do this here but the process\
    \ involves splitting the data into three disjoint sets: training, validation,\
    \ and testing. The meta parameters are varied, training is performed, and using\
    \ the validation data the best set of meta parameters is selected. Finally, we\
    \ test the netowrk as defined my meta parameters and learned weights for those\
    \ meta parameters with the separate test data to see what the effective `F1` score\
    \ is.\n\n## Deep Learning Wrapup\n\nI first used complex neural network topologies\
    \ in the late 1980s for phoneme (speech) recognition, specifically using time\
    \ delay neural networks and I gave a talk about it at [IEEE First Annual International\
    \ Conference on Neural Networks San Diego, California June 21-24, 1987](http://ieeexplore.ieee.org/xpl/articleDetails.jsp?reload=true&arnumber=4307059).\
    \ Back then, neural networks were not really considered to be a great technology\
    \ for this application but in the present time Google, Microsoft, and other companies\
    \ are using deep (many layered) neural networks for speech and image recognition.\
    \ Exciting work is also being done in the field of natural language processing.\
    \ I just provided a small example in this chapter that you can experiment with\
    \ easily. I wanted to introduce you to [Deeplearning4j](http://deeplearning4j.org/)\
    \ because I think it is probably the easiest way for Java developers to get started\
    \ working with many layered neural networks and I refer you to [the project documentation](http://deeplearning4j.org/documentation.html).\n\
    \n## Web Scraping Examples\n\nExcept for the first chapter on network programming\
    \ techniques, this chapter, and the final chapter on what I call Knowledge Management-Lite,\
    \ this book is primarily about machine learning in one form or another. As a practical\
    \ matter, much of the data that many people use for machine learning either comes\
    \ from the web or from internal data sources. This short chapter provides some\
    \ guidance and examples for getting text data from the web.\n\nIn my work I usually\
    \ use the Ruby scripting language for web scraping and information gathering (as\
    \ I wrote about in my APress book [Scripting Intelligence Web 3.0 Information\
    \ Gathering and Processing](http://www.apress.com/9781430223511)) but there is\
    \ also good support for using Java for web scraping and since this is a book on\
    \ modern Java development, we will use Java in this chapter.\n\nBefore we start\
    \ a technical discusion about “web scraping” I want to point out to you that much\
    \ of the information on the web is copyright and the first thing that you should\
    \ do is to read the terms of service for web sites to insure that your use of\
    \ “scraped” or “spidered” data conforms with the wishes of the persons or organizations\
    \ who own the content and pay to run scraped web sites.\n\n### Motivation for\
    \ Web Scraping\n\nAs we will see in the next chapter on linked data there is a\
    \ huge amount of structured data available on the web via web services, semantic\
    \ web/linked data markup, and APIs. That said, you will frequently find data that\
    \ is useful to pull raw text from web sites but this text is usually fairly unstructured\
    \ and in a messy (and frequently changing) format as web pages meant for human\
    \ consumption and not meant to be ingested by software agents. In this chapter\
    \ we will cover useful “web scraping” techniques. You will see that there is often\
    \ a fair amount of work in dealing with different web design styles and layouts.\
    \ To make things even more inconvenient you might find that your software information\
    \ gathering agents will often break because of changes in web sites.\n\nI tend\
    \ to use one of three general techniques for scraping web sites. Only the first\
    \ two will be covered in this chapter:\n\n*   Use an HTML parsing library that\
    \ strips all HTML markup and Javascript from a page and returns a “pure text”\
    \ block of text. Here the text in navigation menus, headers, etc. will be interspersed\
    \ with what we might usually think of a “content” from a web site.\n\n*   Exploit\
    \ HTML DOM (Document Omject MOdel) formatting information on web sites to pick\
    \ out headers, page titles, navigation menues, and large blocks of content text.\n\
    \n*   Use a tool like (Selenium)[http://docs.seleniumhq.org/] to programmatically\
    \ control a web browser so your software agents can login to site and otherwise\
    \ perform navigation. In other words your software agents can simulate a human\
    \ using a web browser.\n\nI seldom need to use tools like `Selenium` but as the\
    \ saying goes “when you need them, you need them.” For simple sites I favor extracting\
    \ all text as a single block and use DOM processing as needed.\n\nI am not going\
    \ to cover the use of `Selenium` and the Java Web-Driver APIs in this chapter\
    \ because, as I mentioned, I tend to not use it frequently and I think that you\
    \ are unlikely to do so either. I refer you to the Selenium documentation if the\
    \ first two approaches in the last list do not work for your application.\n\n\
    I assume that you have some experience with HTML and DOM. For reference, the following\
    \ figure shows a small part of the DOM for a page on one of my web sites:\n\n\
    ![Using the Chrome Developer Tools](images/00023.jpeg)\n\nThisThis screen shot\
    \ shows the Chrome web browser developer tools, specifically viewing the page’s\
    \ DOM. Since a DOM is a tree data structure it is useful to be able to collapse\
    \ or to expand sub-trees in the DOM. In this figure, the HTML BODY element contains\
    \ two top level DIV elements. The first DIV that contains the navigation menu\
    \ for my site is collapses. The second DIV contains an H2 heading and various\
    \ nested DIV and P elements. I show this fragment of my web pagenot as an example\
    \ of clean HTML coding but rather as an example of how messy and nested web page\
    \ elements can be.\n\n### Using the jsoup Library\n\nWe will use the MIT licensed\
    \ library [jsoup](http://jsoup.org/). One reason I selected `jsoup` for the examples\
    \ in this chapter out of many fine libraries that provide similar functionality\
    \ is the particularly nice documentation, especially [The jsoup Cookbook](http://jsoup.org/cookbook/)\
    \ which I urge you to bookmark as a general reference. In this chapter I will\
    \ concentrate on just the most frequent web scraping use cases that I use in my\
    \ own work.\n\nThe following bit of code uses `jsoup` to get the text inside all\
    \ P (paragraph) elements that are direct children of any DIV element. On line\
    \ 14 we use the `jsoup` library to fetch my home web page:\n"
