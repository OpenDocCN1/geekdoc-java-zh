    \n![IntelliJ project view for the examples in this chapter](images/00006.jpeg)\n\
    \nIntelliJ project view for the examples in this chapter\n\n### Hello Spark -\
    \ a Word Count Example\n\nThe word count example is frequently used to introduce\
    \ map reduce and I will also use it here for a “hello world” type simple Spark\
    \ example. In the following listing, lines 3 through 6 import the required classes.\
    \ In lines 3 and 4 “RDD” stands for Resilient Distributed Datasets (RDD). Spark\
    \ was written in Scala so we will sometimes see Java wrapper classes that are\
    \ recognizable with the prefix “Java.” Each RDD is a collection of objects of\
    \ some type that can be distributed across multiple servers in a Spark cluster.\
    \ RDDs are fault tolerant and there is sufficient information in a Spark cluster\
    \ to recreate any lost data due to a server or software failure.\n\n```\n 1 package\
    \ com.markwatson.machine_learning;\n 2 \n 3 import org.apache.spark.api.java.JavaPairRDD;\n\
    \ 4 import org.apache.spark.api.java.JavaRDD;\n 5 import org.apache.spark.api.java.JavaSparkContext;\n\
    \ 6 import scala.Tuple2;\n 7 \n 8 import java.util.Arrays;\n 9 import java.util.List;\n\
    10 import java.util.Map;\n11 \n12 public class HelloSpark {\n13 \n14   static\
    \ private List<String> tokenize(String s) {\n15     return Arrays.asList(s.replaceAll(\"\
    \\\\.\", \" \\\\. \").replaceAll(\",\", \" , \")\n16         .replaceAll(\";\"\
    , \" ; \").split(\" \"));\n17   }\n18 \n19   static public void main(String[]\
    \ args) {\n20     JavaSparkContext sc = new JavaSparkContext(\"local\", \"Hello\
    \ Spark\");\n21 \n22     JavaRDD<String> lines = sc.textFile(\"data/test1.txt\"\
    );\n23     JavaRDD<String> tokens = lines.flatMap(line -> tokenize(line));\n24\
    \     JavaPairRDD<String, Integer> counts =\n25         tokens.mapToPair(token\
    \ ->\n26 \t\t\t new Tuple2<String, Integer>(token.toLowerCase(), 1))\n27     \
    \          .reduceByKey((count1, count2) -> count1 + count2);\n28     Map countMap\
    \ = counts.collectAsMap();\n29     System.out.println(countMap);\n30     List<Tuple2<String,\
    \ Integer>> collection = counts.collect();\n31     System.out.println(collection);\n\
    32   }\n33 }\n```\n\nLines 14 through 17 define the simple **tokenizer** method\
    \ that takes English text and maps it to a list of strings. I broke this out into\
    \ a separate method as a reminder that punctuation needs to be handled and breaking\
    \ it in to a separate method makes it easier for you to experiment with custom\
    \ tokenization that might be needed for your particular text input files. One\
    \ possibility is using the OpenNLP tokenizer model that we used in the last chapter.\
    \ For example, we would want the string “tree.” to be tokenized as [“tree”, “.”]\
    \ and not [“tree.”]. This method is used in line 23 and is called for each line\
    \ in the input text file.\n\nIn this example in line 22 we are reading a local\
    \ text file “data/test1.txt” but in general the argument to JavaSparkContext.textFile()\
    \ can be a URI specifying a file on a local Hadoop file system (HDFS), an Amazon\
    \ S3 object, of a Cassandra file system. Pay some attention to the type of the\
    \ variable **lines** defined in line 22: the type JavaRDD<string> specifies an\
    \ RDD collection where the distributed objects are strings.</string>\n\nThe code\
    \ in lines 29 through 32 is really not very complicated if we parse it out a bit\
    \ at a time. The type of **counts** is a RDD distributed collection where each\
    \ object in the collection is a pair of string and integer values. The code in\
    \ lines 25 through 27 takes each token in the original text file and produces\
    \ a pair (or Tuple2) values consisting of the token string and the integer 1\\\
    . As an example, an array of three tokens like:\n\n```\n1     [\"the\", \"dog\"\
    , \"ran\"]\n```\n\nwould be converted to an array of three pairs like:\n\n```\n\
    1     [[\"the\", 1], [\"dog\", 1], [\"ran\", 1]]\n```\n\nThe statement in line\
    \ 28 is uses the method **reduceByKey** which partitions the array of pairs by\
    \ unique key value (the key being the first element in each pair) and sums the\
    \ values for each matching key. The rest of this example shows two ways to extract\
    \ data from an distributed RDD collection back to a Java process as local data.\
    \ In line 29 we are pulling the collection of word counts into a Java **Map<String,Integer>**\
    \ collection and in line 31 we are doing the same thing but pulling data into\
    \ a list of Scala tuples. Here is what the output of the program looks like:\n\
    \n```\n1     {dog=2, most=1, of=1, down=1, rabbit=1, slept=1, .=2, the=5, street=1,\n\
    2      chased=1, day=1}\n3     [(most,1), (down,1), (.,2), (street,1), (day,1),\
    \ (chased,1), (dog,2),\n4      (rabbit,1), (of,1), (slept,1), (the,5)]\n```\n\n\
    ### Introducing the Spark MLlib Machine Learning Library\n\nAs I write this Chapter\
    \ in the fall of 2015, the Spark MLlib library is at version 1.5 and under development.\
    \ When you experiment with the examples first try using version 1.5\\. I will\
    \ update the git repository for this book periodically and I will try to keep\
    \ the code examples compatible with the current stable versions of Spark and MLlib.\n\
    \nThe examples in the following sections show how to apply the MLlib library to\
    \ problems of logistic regression, using the K-Means algoirthm to cluster similar\
    \ documents, and using the word2vec algorithm to find strong associations between\
    \ words in documents.\n\n### MLlib Logistic Regression Example Using University\
    \ of Wisconsin Cancer Database\n\nWe will use supervised learning in this section\
    \ to build a regresion model that maps a numeric feature vector of symptoms to\
    \ a numeric value where larger values close to one indicate malignancy and smaller\
    \ values closer to zero indicate benign.\n\nMLlib supports three types of linear\
    \ models: Support Vector Machine (SVM), logistic regression (models for membership\
    \ in one or more classes or categories), and linear regression (models that model\
    \ outputs for a class as a floating point number in the range [0..1]). The Spark\
    \ MLlib documentation (http://spark.apache.org/docs/latest/mllib-linear-methods.html)\
    \ on these three linear models is very good and their sample programs are similar\
    \ so it is easy enough to switch the type of linear model that you use.\n\nWe\
    \ will use logistic regression for the example in this section. Andrew Ng, in\
    \ his excellent [Machine Learning class](https://www.coursera.org/learn/machine-learning)\
    \ said that the first model he tries when starting a new problem is a linear model.\
    \ We will repeat this example in the next section using SVM instead of logistic\
    \ regression.\n\nIf you read my book [Build Intelligent Systems with Javascript](https://leanpub.com/aijavascript)\
    \ the training and test dataset used in this section will look familiar: [University\
    \ of Wisconsin breast cancer data set](http://archive.ics.uci.edu/ml/datasets/Breast+Cancer+Wisconsin+%28Diagnostic%29).\n\
    \nFrom the University of Wisconsin web page, here are the attributes with their\
    \ allowed ranges in this data set:"
