  trans: '

    *   解释和使用模型结果。通常，模型会被用于处理其他数据集以自动标记数据（正如我们在本章中对维基百科文本数据所的那样），或从新的时间序列数值数据源进行预测。

    *   将训练好的模型作为大型系统的嵌入部分部署。这是一个可选步骤——有时，仅使用模型来充分理解一个问题并知道如何解决它就足够了。然而，通常模型会作为正常数据处理和决策工作流的一部分反复使用（通常是自动化的）。在本章，我会特意说明如何重用嵌入到
    Java 应用程序中的模型。


    在本书的示例中，我已为示例程序提供了测试数据。请记住，尽管我将数据挖掘和机器学习模型构建的步骤列为一系列顺序步骤，但在实践中，这是一个非常迭代的过程。在看到使用不同算法构建模型的初步结果后，可能需要重新进行数据收集和清洗。我们可能会迭代地调整模型参数，并通过添加或删除用于构建模型的数据特征来改进模型。


    我所说的数据的“特征”是指什么？对于文本数据，特征可以是：文本中的单词、文本中相邻单词的集合（n-gram）、文本结构（例如利用 HTML 或其他标记）、标点符号等。对于数值数据，特征可能是序列中数据点的最小值和最大值、频率空间中的特征（通过快速傅里叶变换
    FFT 计算，有时也作为功率谱密度 PSD，这是一种丢弃了数据相位信息的 FFT）等。对于不同类型的数据，清洗数据的含义也也不同。在清洗文本数据时，我们可能会将文本分段句子，进行词干提取（即，将“banking”或“banks”映射到它们的词根“bank”），有时我们可能希望将所有文本转换为小写，等。对于数值数据，我们可能需要将数据属性缩放到特定的数值范围内——我们将在本章稍后使用威斯康星大学癌症数据集时完成此操作。


    我概述的前七个步骤是我对发现信息源、处理数据以及从数据中产生可操作知识过程的看法。你可能会遇到的其他缩写包括数据中的知识发现（KDD）和 CCC 大数据流水线，它们都使用了与我刚刚概述的类似的步骤。


    广而言，机器学习模型有四类：


    *   回归 - 预测一个数值。输入是数值值。

    *   分类 - 预测“是”或“否”。输入是数值值。

    *   聚类 - 将一组数据项划分为不相交的集合。数据项可以是文本文档、传感器读取的数值数据集、包含文本和数字的结构化数据集。输入必须转换为数值值。

    *   推荐 - 根据用户的之前的行为和/或通过将用户与其他相似用户匹配以使用其他用户的行为，做出推荐对象的决策。


    你稍后在处理文本时会看到我们需要将单词转换为数字（每个单词都被分配一个唯一的数字 ID）。文档由一个稀疏向量表示，对于每个唯一的单词索引都有非空元素。此外，我们可以将机器学习问题分为两个大类：


    *   监督学习 - 用于训练的输入特征带有所需预测的标签。我们将看到的的监督学习示例是使用癌症症状数据构建回归模型，以根据新的输入特征集预测恶性 vs.
    良性。

    *   无监督学习 - 输入特征没有标签。我们将看到的无监督学习示例包括：K-Means 类似的维基百科文档聚类，以及使用 word2vec 寻找文档中的相关单词。


    在本章的目标是向你介绍使用 Spark 和机器学习算法的实用技术。在你学习完材料后，我建议阅读 Spark 文档，以查看更多可用的模型。还要考虑参加 Andrew
    Ng 出出的[机器学习课程](https://www.coursera.org/learn/machine-learning)。


    # 机器学习的扩展


    虽然对于极大数据集扩展数据挖掘和机器学习操作的能力有时很重要，但对于开发以及完成本章中的示例，你不需要搭建服务器集群来运行 Spark。我们将以开发模式使用
    Spark，你可以在笔记本电脑上运行示例。如果你的笔记本电脑至少有 2 GB 内存来运行机器学习示例将是最好的。重要的是记住，你在本章中学会的技术可以根据需要在不修改应用程序源码的情况下扩展到非常大的数据集。


    Apache Spark 项目源于加利福尼亚大学伯伯克利分校。Spark 有对 Java、Scala 和 Python 的客户端支持。本章中的示例都将使用
    Java 编写。如果你是 Scala 开发者，在学习完示例后，你可能想看看 Scala Spark 文档，因为 Spark 是 Scala 编写的，且 Scala
    拥有最好的客户端支持。Python Spark 和 MLlib API 也非常好用，所以如果你是 Python 开发者，应该检查这个 Python 支持。


    Spark 是使用 Hadoop 或 Google Map Reduce 等 map reduce 系统的演进步骤。通过学习本章的示例，你可能会认为可以用更少的代码和更小的运行时开销来实现相同的效果。对于处理少量数据这确实如此，但就像使用
    Hadoop 一样，代码中多一点冗余让你具有将应用程序扩展到大型数据集的能力。我们为了可扩展性忍受了额外的复杂度。Spark 提供了用于读取和转换数据的实用类，使得示例程序比自己编写代码导入数据更简单。


    我建议你从 [Apache Spark 下载页面](https://spark.apache.org/downloads.html) 下载 Spark 1.5.0
    版本的源码，因为有很多示例程序可以供你获取思路和参考。Spark 机器学习库 MLlib 中的 Java 客户端示例可以在目录下找到：


    ```

    spark-1.5.0/examples/src/main/java/org/apache/spark/examples/MLlib/

    ```


    其中 `spark-1.5.0` 目录是在下载 Spark 1.5 版本时创建的。


    这些使用了提供的数值数据文件，每行指定一个本地 Vector 数据类型。本章中的第一个 K-Means 聚类示例源自 Spark 分带的 MLlib 示例。第二个聚类维基百科文章的
    K-Means 示例不同得多，因为我们需要编写新代码将文本转换为数值特征向量。我提供了手动从维基百科文章中选择的样本文本。


    我们将从本章开始向你展示如何在笔记本电脑上设置 Spark 和 MLlib，然后看一个从输入文本生成词数的简单“Hello World”介绍性程序。随后我们将实现逻辑回归，并简要查看
    Spark MLlib 示例中的 JavaKMeans 程序，利用它来理解将数据还原为一组数值特征向量的要求。


    ### 在笔记本电脑上设置 Spark


    假设你已经克隆了这本书的 github 项目，Spark 示例位于子目录 `machine_learning_spark`。maven pom.xml 文件包含了
    Spark 依赖。你可以使用以下命令安装这些依赖：


    ```

    mvn clean install

    ```

