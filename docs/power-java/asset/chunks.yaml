  trans: "\n\n由于本节的代码与上一个示例非常相似，我将不再重复列出。请参考本书 GitHub 仓库中的源文件 `SvmClassifier.java`\
    \ 和测试文件 `SvmClassifier.java`。在仓库的子目录 `machine_learning_spark` 中，在运行本节示例之前，您需要删除运行上一节示例时生成的模型文件：\n\
    \n```\nrm -r -f generated_models/*\nmvn test -Dtest=SvmClassifierTest\n```\n\n\
    该示例的输出结果如下：\n\n```\nTest Data Mean Squared Error = 0.22950819672131167\nShould\
    \ be malignant (close to 1.0): 1.0\nShould be benign (close to 0.0): 0.0\n```\n\
    \n注意，测试数据的均方误差大于我们在上一节中使用逻辑回归时得到的 `0.050140726106582885` 值。\n\n## MLlib K-Means\
    \ 示例程序\n\n在本节中，我们将使用无监督学习，特别是 K-Means 聚类算法。该聚类过程将输入划分成共享共同特征的组。在本章稍后的部分，我们将查看一个示例，其输入将是一些随机选择的维基百科文章。\n\
    \nK-Means 分析适用于许多类型的数据，你可能希望将某个集合的成员聚合成不同的子组。例如，你可能是一位研究鱼类的生物学家。对于每种鱼类，你可能拥有长度、重量、位置、淡水/咸水等属性。你可以使用\
    \ K-Means 将鱼类划分为相似的子组。\n\n如果你的工作涉及社交媒体的人群营销，你可能希望根据你对社交媒体用户拥有的属性，将人们聚合成不同的子组。如果你拥有某些用户的稀疏数据，你可能推断出其他用户的缺失数据。\n\
    \n本节的简单示例使用了数值特征向量。然而，请记住我们的目标是在稍后的章节中处理维基百科的文本。在下一节中，我们将看到如何将文本转换为特征向量，最后，在之后的章节中，我们将对维基百科文章进行聚类。\n\
    \n实现 K-Means 非常简单，但使用 MLlib 的实现具有处理极大数据集的优势。计算 K-Means 的第一步是选择所需的簇数量 `NC`。随机计算\
    \ `NC` 个簇中心。然后我们执行内部循环，直到簇中心停止变化或完成指定的迭代次数：\n\n* 对于每个数据点，将其分配给离它最近的簇中心。\n* 对于每个簇中心，将该中心移动到该簇中数据点的平均位置。\n\
    \n在实践中，你将重复此聚类过程多次，并使用失真度（distortion）最小的簇中心。失真度是簇内每个数据点到最终簇中心距离的平方和。\n\n因此，在本章稍后部分查看维基百科示例（聚类维基百科文章）之前，我想先回顾一下\
    \ Spark MLlib 示例目录中的 `JavaKMeans.java` 示例，看看如何在样本数据上执行 K-Means 聚类：\n\n```\nspark-1.5.0/examples/src/main/java/org/apache/spark/examples/mllib/\n\
    ```\n\n这是一个已经使用了数值数据的非常简单的示例。我将 `JavaKMeans.java` 文件（更改了包名）复制到了本书的 github 仓库中。\n\
    \n在本节中，你需要学习的最重要的一点是输入数据的类型：双精度浮点数向量。每个数据样本都需要转换为数值特征向量。对于某些应用来说，这是很容易的。作为一个假设的示例，你可能有一组测量你城市天气的特征：低温、高温、平均温度、白天的光照百分比和风速。所有这些特征都是数值的，可以直接作为特征向量使用。你可能某一年有\
    \ 365 个样本，并希望对数据进行聚类以查看哪些天是相似的。\n\n如果在该假设示例中，其中一个特征是代表月份的字符串怎么办？转换数据的显然方法是将“一月”映射到\
    \ 1，“二月”映射到 2，以此此类推。我们将在下一节聚类维基百科文章时会发现，将数据转换为数值特征向量并不总是那么简单。\n\n我们将使用 MLlib KMeans\
    \ 示例附带微型样本数据集：\n\n```\n0.0 0.0 0.0\n0.1 0.1 0.1\n0.2 0.2 0.2\n9.0 9.0 9.0\n9.1\
    \ 9.1 9.1\n9.2 9.2 9.2\n```\n\n这里我们有 6 个样本，每个样本有 3 个特征。通过观察，看起来有两类数据：前三行在一个簇中，后三行在第二个簇中。特征向量被处理的顺序并不重要；文件中的样本组织方式让你很容易地看到这两个簇。当我们运行这个要求两个簇的样本程序时，我们得到：\n\
    \n```\nCluster centers:\n [9.1,9.1,9.1]\n [0.1,0.1,0.1]\n```\n\n我们将讲解样本程序中的代码，因为这是我们在本章其余部分使用的相同的通用模式。以下是\
    \ `JavaKMeans.java` 的稍微修改的版本，与 MLLib 示例目录中的版本相比有几个微小的变化：\n\n```\n 1 public final\
    \ class JavaKMeans {\n 2 \n3   static ParsePoint implements Function<String, Vector>\
    \ {\n4     @Override\n5     public Vector call(String line) {\n6       String[]\
    \ tok = line.split(\" \");\n7       double[] point = new double[tok.length];\n\
    8       for (int i = 0; i < tok.length; ++i) {\n9         point[i] = Double.parseDouble(tok[i]);\n\
    10      }\n11      return Vectors.dense(point);\n12    }\n13   }\n14 \n15   public\
    \ static void main(String[] args) {\n16 \n17     String inputFile = \"data/kmeans_data.txt\"\
    ;\n18     int k = 2; // two clusters\n19     int iterations = 10;\n20     int\
    \ runs = 1;\n21 \n22     JavaSparkContext sc = new JavaSparkContext(\"local\"\
    , \"JavaKMeans\");\n23     JavaRDD<String> lines = sc.textFile(inputFile);\n24\
    \ \n25     JavaRDD<Vector> points = lines.map(new ParsePoint());\n26 \n27    \
    \ KMeansModel model = KMeans.train(points.rdd(), k, iterations, runs,        \
    \                         KMeans.KMEANS_PARALLEL());\n28 \n29     System.out.println(\"\
    Cluster centers:\");\n30     for (Vector center : model.clusterCenters()) {\n\
    31       System.out.println(\" \" + center);\n32     }\n33     double cost = model.computeCost(points.rdd());\n\
    34     System.out.println(\"Cost: \" + cost);\n35 \n36     sc.stop();\n37   }\n\
    38 }\n```\n*(注：由于原文提供的文本中代码块部分存在行号错乱和格式错误（如第 3-12 行的混乱），在翻译时遵循了“代码块不需要翻译”的原则，并修正了逻辑上的显示问题以确保可读性。)*\n\
    \n"
- fmt: "\nThis simple example along with the “Hello Spark” example in the last section\
    \ has shown you how to run Spark on your laptop in developers mode. In the next\
    \ section we will see how to convert input text into a numeric feature vector.\n\
    \n### Converting Text to Numeric Feature Vectors\n\nIn this section I develop\
    \ a utility class `TextToSparseVector` that converts a set of text documents into\
    \ sparse numeric feature vectors. Spark provides dense vector classes (like an\
    \ array) and sparse vector classes that contain index and value pairs. For text\
    \ feature vectors, In this example we will have a unique feature ID for each unique\
    \ word stem (or word root) in all of the combined input documents.\n\nWe start\
    \ by reading in all of the input text and forming a `Map` where the keys are word\
    \ stems and the values are unique IDs. Any given index document will be represented\
    \ with a psarse vector. For each word, the word’s stem is represented by a unique\
    \ ID. The vector element at the integer ID value is set. A short document with\
    \ 100 unique words would have 100 elements of the sparse vector set.\n\nListing\
    \ of the class `TextToSparseVector`:\n\n```\n 1 package com.markwatson.machine_learning;\n\
    \  2 \n  3 import java.nio.file.Files;\n  4 import java.nio.file.Paths;\n  5 import\
    \ java.util.*;\n  6 import java.util.stream.Stream;\n  7 import org.apache.spark.mllib.linalg.Vector;\n\
    \  8 import org.apache.spark.mllib.linalg.Vectors;\n  9 \n 10 /**\n 11  * Copyright\
    \ Mark Watson 2015\\. Apache 2 license.\n 12  */\n 13 public class TextToSparseVector\
    \ {\n 14 \n 15   // The following value might have to be increased\n 16   // for\
    \ large input texts:\n 17   static private int MAX_WORDS = 60000;\n 18 \n 19 \
    \  static private Set<String> noiseWords = new HashSet<>();\n 20   static {\n\
    \ 21     try {\n 22       Stream<String> lines =\n 23 \t    Files.lines(Paths.get(\"\
    data\", \"stopwords.txt\"));\n 24       lines.forEach(s ->\n 25           noiseWords.add(s)\n\
    \ 26       );\n 27       lines.close();\n 28     } catch (Exception e) { System.err.println(e);\
    \ }\n 29   }\n 30 \n 31   private Map<String,Integer> wordMap = new HashMap<>();\n\
    \ 32   private int startingWordIndex = 0;\n 33   private Map<Integer,String> reverseMap\
    \ = null;\n 34 \n 35   public Vector tokensToSparseVector(String[] tokens) {\n\
    \ 36     List<Integer> indices = new ArrayList();\n 37     for (String token :\
    \ tokens) {\n 38       String stem = Stemmer.stemWord(token);\n 39       if(!\
    \ noiseWords.contains(stem) && validWord((stem))) {\n 40         if (! wordMap.containsKey(stem))\
    \ {\n 41           wordMap.put(stem, startingWordIndex++);\n 42         }\n 43\
    \         indices.add(wordMap.get(stem));\n 44       }\n 45     }\n 46     int[]\
    \ ind = new int[MAX_WORDS];\n 47 \n 48     double [] vals = new double[MAX_WORDS];\n\
    \ 49     for (int i=0, len=indices.size(); i<len; i++) {\n 50       int index\
    \ = indices.get(i);\n 51       ind[i] = index;\n 52       vals[i] = 1d;\n 53 \
    \    }\n 54     Vector ret = Vectors.sparse(MAX_WORDS, ind, vals);\n 55     return\
    \ ret;\n 56   }\n 57 \n 58   public boolean validWord(String token) {\n 59   \
    \  if (token.length() < 3)  return false;\n 60     char[] chars = token.toCharArray();\n\
    \ 61     for (char c : chars) {\n 62       if(!Character.isLetter(c)) return false;\n\
    \ 63     }\n 64     return true;\n 65   }\n 67 \n 67   private static int NUM_BEST_WORDS\
    \ = 20;\n 68 \n 69   public String [] bestWords(double [] cluster) {\n 70    \
    \ int [] best = maxKIndex(cluster, NUM_BEST_WORDS);\n 71     String [] ret = new\
    \ String[NUM_BEST_WORDS];\n 72     if (null == reverseMap) {\n 73       reverseMap\
    \ = new HashMap<>();\n 74       for(Map.Entry<String,Integer> entry : wordMap.entrySet()){\n\
    \ 75       reverseMap.put(entry.getValue(), entry.getKey());\n 76       }\n 77\
    \     }\n 78     for (int i=0; i<NUM_BEST_WORDS; i++)\n 79 \t  ret[i] = reverseMap.get(best[i]);\n\
    \ 80     return ret;\n 81   }\n 82   // following method found on Stack Overflow\n\
    \ 83   // and was written by user387933\\. Thanks!\n 84   private int[] maxKIndex(double[]\
    \ array, int top_k) {\n 85     double[] max = new double[top_k];\n 86     int[]\
    \ maxIndex = new int[top_k];\n 87     Arrays.fill(max, Double.NEGATIVE_INFINITY);\n\
    \ 88     Arrays.fill(maxIndex, -1);\n 89 \n 90     top: for(int i = 0; i < array.length;\
    \ i++) {\n 91       for(int j = 0; j < top_k; j++) {\n 92         if(array[i]\
    \ > max[j]) {\n 93           for(int x = top_k - 1; x > j; x--) {\n 94       \
    \      maxIndex[x] = maxIndex[x-1]; max[x] = max[x-1];\n 95           }\n 96 \
    \          maxIndex[j] = i; max[j] = array[i];\n 97           continue top;\n\
    \ 98         }\n 99       }\n 100     }\n 101     return maxIndex;\n 102   }\n\
    \ 103 }\n```\n\n### Using K-Means to Cluster Wikipedia Articles\n\nThe Wikipedia\
    \ article training files contain one article per line with the article title appearing\
    \ at the beginning of the line. I have already performed some data cleaning: capturing\
    \ HTML, stripping HTML tags, yielding plain text for the articles and then organizing\
    \ the data one article per line in the input text file. I am providing two input\
    \ files: one containing 41 articles and one containing 2001 articles.\n\nOne challenge\
    \ we face is converting the text of an article into a numeric feature vector.\
    \ This was easy to do in an earlier section using cancer data already in numeric\
    \ form; I just had to discard one data attribute and scale the remaining data\
    \ atrributes.\n\nIn addition to converting input data into numeric feature vectors\
    \ we also need to decide how many clusters we want the K-Means algorithm to partitian\
    \ our data into.\n\nGiven the class `TextToSparseVector` developed in the last\
    \ section, the code to cluster Wikipedia articles is fairly straightforward. In\
    \ the following listing of the class `WikipediaKMeans`:\n"
