    \ Clinton but usually this name refers to a President of the USA. It is useful\
    \ to annotate people’s names, company names, etc. in text with the `DBPedia URI`\
    \ for that entity. We will do this in a quick and dirty way (but hopefully still\
    \ useful!) in this section and then solve the same problem in a different way\
    \ in the next section.\n\nIn this section we simply look for exact matches in\
    \ text for the descriptions for `DBPedia URIs`. In the next section we tokenize\
    \ the descriptions and also tokenize the text to match entity names with `URIs`.\
    \ I will also show you some samples of the raw `DBPedia RDF` data in the next\
    \ section.\n\nFor one of my own projects I created mappings of entity names to\
    \ `DBPedia URIs` for nine entity classes. For the example in this section I use\
    \ three of my entity class mappings: people, countries, and companies. The data\
    \ for these entity classes is stored in text files in the subdirectory `dbpedia_entities`.\
