    Test Data Mean Squared Error = 0.050140726106582885\nShould be malignant (close\
    \ to 1.0): 1.1093117757012294\nShould be benign (close to 0.0): 0.29575663511929096\n\
    ```\n\nThis example shows a common pattern: reading training data from disk, scaling\
    \ it, and building a model that is saved to disk for later use. This program can\
    \ almost be reused as-is for new types of training data. You should just have\
    \ to modify lines 27 through 44.\n\n### MLlib SVM Classification Example Using\
    \ University of Wisconsin Database\n\nThe example in this section is very similar\
