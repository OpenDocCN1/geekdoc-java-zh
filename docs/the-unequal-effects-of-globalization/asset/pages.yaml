  md: '# The Age of (Hyper)Globalization


    decades. While falling tariff levels during the postwar period were a major factor,
    a new consensus has emerged in recent years—shared by academics and policy makers
    alike—the explosion of global trade volumes in the late twentieth century cannot
    be explained by trade policy. This view holds that more important factors were
    at play, namely technology, and that globalization was both inevitable and unstoppable.
    According to this new consensus, technological developments in the late twentieth
    century made the world more connected, while also leading to a steady decline
    in the costs of transportation and communication, which together allowed global
    trade to flourish. By extension, this view holds that trade policy—that is, the
    imposition and reduction of tariffs as well as the signing of trade agreements,
    first within General Agreement on Tariffs and Trade (GATT) and then within the
    World Trade Organization (WTO)—was more or less irrelevant to global trade levels
    by the end of the twentieth century.³


    This view is reflected in several recent quotes from the popular press. For example,
    in an article on the benefits and perceived risks of the proposed Trans-Pacific
    Partnership (TPP), the *New York Times* noted in 2015,


    > [One myth undermining support for TPP] is that recent trade agreements have
    hurt jobs... This argument fails to differentiate between the impacts of increased
    global trade and those of agreements. [It] is globalization, technology, and flawed
    educational and tax systems that are driving this trend, not trade pacts.⁴


    One might think that this view is only held by journalists who are not familiar
    with the specifics of trade policy. Indeed, as economist Paul Krugman wrote in
    1995,


    Most journalistic discourse of the growth of world trade seems to view growing
    integration as driven by a technological imperative—to believe that improvements
    in transportation and communication technology constitute an irresistible force
    dissolving'
