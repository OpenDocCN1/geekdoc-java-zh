  md: '# Preface


    Review are highlighted in this monograph, but I encourage interested readers to
    visit the project’s website to explore its broader preliminary results.¹ The themes
    covered in the project—from the history, geography, and political economy of inequality
    to its manifestations across several domains, including gender, race and ethnicity,
    health, early child development, education, immigration, firms, the labor market,
    and globalization, as well as the dynamics around policy responses like redistribution
    and the benefits system—reveal the complex, multidimensional nature of the inequality
    phenomenon.

    The monograph also focuses narrowly on the trade dimensions of globalization rather
    than on some of its broader aspects, such as migration. Like trade, any given
    country’s approach to migration typifies its global orientation and the relative
    openness of its borders. Migration’s recent backlash against globalization. Migration
    and trade are fundamentally separate issues: goods on the move are different from
    people on the move, and immigration raises complex issues that trade typically
    does not—including national identity and culture, which are highly salient in
    many countries’ debates over immigration, particularly in Europe and the United
    States. The economic and policy implications of migration and trade are also quite
    distinct. There is clear evidence in the economics literature that immigration
    (withstanding significant exceptions) is typically beneficial for both migrants
    and receiving countries. This is especially true in countries with labor shortages
    due to shifting demographic trends, like many European countries. While the effects
    on source countries are somewhat less well understood, it is apparent that the
    emigration of skilled'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'workers can lead to “brain drain” in these countries—or more generally, “ability
    drain,” given that many unskilled migrants are still highly motivated individuals
    with enormous potential for entrepreneurship and productivity. (This is an area
    where I have some personal experience as a native of Greece who has spent most
    of my career in the United States; I would like to think that the immigration
    of people is generally good for the receiving country, though the long-run effects
    of mass emigration on the countries we leave behind are less clear.) These are
    crucial and relevant issues for the economic and policy debates about globalization—but
    for the purposes of this monograph, I will focus squarely on trade.


    Likewise, the monograph does not focus on all the ancillary features of globalization,
    such as capital mobility. Recent decades have seen enormous growth in capital
    flows flows as well as significant policy changes that have removed or loosened
    capital controls and liberalized exchange rate regimes in many countries around
    the world. Such enhanced capital mobility has fostered trade growth, foreign direct
    investment, and the formation of global value chains, serving as an integral aspect
    of hyperglobalization in the 1990s and 2000s. This era of essentially unfettered
    capital mobility has many implications the rise of large multinational “superstar”
    firms and the question of how capital should be taxed in light of globalization’s
    unequal effects. The broad features, drivers, and effects of capital mobility,
    however, fall outside the scope of this monograph’s look at one particular aspect
    of globalization: the relationship between international trade and inequality.


