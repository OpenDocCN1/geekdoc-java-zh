    categories that benefit substantially from trade, such as automobiles. Furthermore,
    such data have become available only recently, often making the samples derived
    from them too short for credible empirical analysis. All of these difficulties
    may contribute to the view that trade’s price effects disproportionately benefit
    the poor.


