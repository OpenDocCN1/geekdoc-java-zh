    these difficulties is the lack of the highly disaggregated price data needed to
    assess price impacts across the income distribution. While expenditure surveys
    provide economists with large data sets to analyze price effects, they record
    expenditures and quantities at a very coarse level, making it difficult to capture
    differences in the specific brands consumed by the rich or the poor. (Needless
