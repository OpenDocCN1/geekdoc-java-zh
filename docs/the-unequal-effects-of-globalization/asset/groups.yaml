    从长期来看，去全球化或全球化放缓最严重的影响可能会出现在尚未完全融入全球贸易系统的低收入国家，尤其是非洲。由于没有像印度或中国那样庞大的国内市场，贸易正如我在最近的研究中所言，是这些国家消除贫困和实现繁荣的唯一可行路径。如果这条路径突然关闭，将没有明显的替代方案。当然，这项分析早于COVID-19的爆发，而疫情本身就是一种不同全球化的体现：健康的全球化。新冠肺炎引发的健康和经济危机导致了第二波反对贸易的回潮。这一次，论点集中在对全球价值链韧性的感知担忧上，这导致了对保护主义和自给自足更高声的号。因此，考虑到目前的环境，一个关键问题是，目前的紧张局势、回潮和要求仅仅是全球化的小插曲，还是我们实际上正在见证一个持续去全球化或全球化的新时代的黎明。


