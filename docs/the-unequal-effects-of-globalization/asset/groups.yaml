    trade and especially prevalent in many European countries. How can one determine
    whether a government''s food safety regulations stem from valid health and food
    quality concerns rather than trade policy designed (in whole or in part) to protect
    country’s domestic agricultural producers from import competition? The standard
    data indicators would not indicate the government’s underlying rationale for each
    regulation; even if some food safety regulations are de facto “behind-the-border”
    trade restrictions, it would be impossible to determine the true motivation for
