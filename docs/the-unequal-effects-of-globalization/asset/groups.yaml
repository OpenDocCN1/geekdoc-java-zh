    例如，《迪顿评论》（Deaton Review）指出，评估贸易对价格的影响面临着许多衡量和识别困难。这些困难中的首要问题是缺乏高度细分的价格数据，以评估跨收入分布的价格影响。虽然支出调查为经济学家提供了用于分析价格效应的大型数据集，但它们记录支出和数量的粒度非常粗，这使得难以捕捉富人或穷人所消费特定品牌的差异。（不言说，例如，对来自意大利进口阿马尼夹克降价，其对不平等的影响将与对来自埃塞俄比亚进口夹克降价的影响大不相同。）零售扫描仪数据（如尼尔提供的数据）收集了实时价格和其他信息，这可以部分弥补这种细粒度的缺失。然而，此类数据通常不包含从贸易中获益的大型产品类别，例如汽车。此外，此类数据最近才可用，往往导致其得出的样本时间太短，无法进行可靠的实证分析。所有这些困难都可能导致这样一种观点：贸易的价格效应不成比例地造福了穷人。


    同样，现有的价格研究未能捕捉大多数国家（包括全球贫困人口在内）的大多数人现在已经能够获得一系列惊人的商品和服务，包括智能手机和互联网接入，而这些在几十年前是不可想象的。使这一切成为可能的关键因素是技术发展和国际贸易，即通过全球价值链（GVCs）内部国际分工所实现的成本和价格降低。在过去，对于许多无法负担这些商品服务的低收入家庭来说，这些商品服务的虚拟价格本质上是无限的。得益于贸易和技术，这一价格已经下降到了许多低收入消费者可以负担的有限数字。虽然很难进行正式衡量，但这种变化的影响极可能是全球数百万或数十亿贫困家庭福祉的首要考虑。衡量这种转型性转变的挑战，可能是分析贸易对消费者不平等影响努力中最重要的缺陷。


    总而言之，全球化对价格和消费者的影响与其对工人和企业的影响非常相似：正如全球化的许多方面一样，其对不平等的的影响是复杂的、难以理清的，并且与不断变化的因素（例如技术）存在着高度的相互作用。


    ## 3 结论


    全球化的影响既是不平等的又是极度不均衡的。它们在国家之间和国家内部是不均衡的；在不同地区和人口统计特征之间是不均衡的；在生产者、消费者和工人之间是不均衡的。有充分证据表明，全球化加剧了某些维度的不平等，同时也也有充分证据表明全球化减少了其他维度的不平等（最重要的是全球不平等）。根本性的挑战在于，不平等是一个非常宽泛的概念。在许多方面，全球化的影响完全取决于你关注的是不平等的哪个维度。


    对这种挑战性局势的理想研究和政策反应，应该是识别、利用和发挥全球化的积极特征，同时防止、减轻或补偿其负面影响。遗憾的是，研究人员对所有证据的理解以及政策制定者采取行动的能力，距离这一理想状态还有多年之。可能只有一条广泛的发现是明确且肯定的：全球化引发了动荡，这通常需要巨大的转型和调整。事实上，最近的许多反弹都集中在贸易带来的这些复杂问题上，而不是关于它的任何抽象概念。然而，标准的国际贸易经济模型与关于它的许多政策辩论一样，倾向于关注稳态最终结果，无论是收益还是损失。至少，本专著及其展示的证据的一个关键启示是，全球化是一个过程，而不是一个终点。这一结论的主要意义在于，研究人员和政策制定者应该更认真关注全球化带来的动荡、转型和调整，而不是估计、辩护和谴责其最终影响。


    这种关注至少有三个额外的意义。第一，空间或区域不平等是全球化最显著的影响之一，应该是未来研究人员和政策制定者的主要优先考虑事项。区域不平等的显著性不仅是因为实证证据日益表明全球化的负面影响在空间上是相当孤立的，而且因为它已经成为近期反全球化的重要驱动力。因此，虽然全球化的不平等影响有很多，但区域不平等可能是最可能产生重大社会后果的。这为加大关注和尝试所谓的“基于地区的政策”（place-based
    policies）提供了潜在的理由。虽然经济学领域传统由于其潜在的扭曲作用对地区政策持负面观点，但它们作为解决区域不平等的工具值得重新考虑。例如，支持失业工人的努力可以针对特定地区。越来越多的证据表明，再培训或“技能提升”计划通常是无效的，但如果此类计划和其他努力（包括劳动力开发、社会保护和创造就业机会的政策）能够专注于最需要它们的地方，可能会更有前景。


    ## 结论


    其次，全球化背景下企业利润的剧烈增长需要更多的关注和政策行动。全球价值链的出现、全球技术平台的增长，以及资本和市场权力向极其巨大、高度流动且深度连接的“超级巨星”企业的重新配置，都引发了关于企业、政府和社区之间关系的重要问题。虽然这些问题是永恒且基础的，但它们的当代表现非常新颖，并且在技术、法律和政治上几乎是无尽复杂的。首先，应对近期企业利润率的增加，要求更多关注这些大型公司是如何被征税和监管的。


    最后，至关重要的是，本专著提出的问题强调了加强国际合作的至重要性——不仅在贸易方面，在许多其他经济领域也是。正如提到的，全球化的不平等影响已超出贸易领域，但同时对贸易具有重要影响。同样，近年来看到的许多贸易摩擦增加不仅是因为关税等狭义定义的贸易政策；相反，它们涉及“边境后”措施、非关税贸易限制以及影响贸易但更难衡量的经济活动方面。


    近期紧张局势和对全球化的反弹给全球贸易体系带来了严峻挑战，但加强国际合作仍有重大机会。例如，区域贸易提供了巨大的前景——不仅是因为自身，还作为日益增长的全球不确定性的平衡。虽然欧盟现在代表了一个相当有争议的模式（考虑到英国脱欧、负面货币影响和其他挑战），但毫无疑问，在欧洲建立自由贸易区对许多欧洲国家以及各收入阶层的许多工人和消费者产生了非常积极的结果。


    第三章


    在全球范围内，从非洲、中东到南美和东南亚，有许多人口众大的区域和次区域市场尚未实现高度的区域互。这些地区的许多国家已经自由化并协调了其贸易政策以加入世贸并参与全球价值链；增加区域内部贸易是一个独特的机遇领域。因此，随着多边主义的衰落以及新的地缘政治担忧和联盟的出现，全球化可能会持续但呈现不同的面貌：例如，全球价值链可能会部分或完全将其运营转移到世界不同地区，区域主义可能成为全球化的新形式。


