    15. 撒哈拉以南非洲的贫困人口（如图2.6中图表顶层所示）自20世纪90年代以来在某种程度上处于停滞状态。如今，世界上大多数贫民生活在撒哈拉以南非洲，而大多数经济预测表明，这一趋势在未来几年仍将持续。近期，撒哈拉以南非洲的几项努力有望提高该地区的全球整合水平。例如，对交通和通信基础设施的大量投资（包括中国的巨大努力，这些努力通常通过因缺乏透明度而受到严厉批评的债务协议进行资助）正在创造能够促进贸易的道路、港口和跨境连接。此外，非洲大陆自由贸易区的建立旨在通过统一政策和标准来促进非洲内部贸易，这可能加强各国贸易方面的行政能力（海关、物流等）并培养规模经济。这些努力代表了在改善非洲全球整合方面取得的巨大进展，并可能导致增长加速和减贫成效增加。然而，长期影响尚不不清楚，对于该地区高度依赖债务融资的基础设施开发模式从长期来看是否在经济上具有可持续性，仍存在许多悬而未决的问题。至少到目前，该大陆在国际贸易和全球价值链（GVCs）中的参与尚未赶上其他地区。


    虽然贫困率是衡量全球繁荣和计算全球不平等的一个非常保守的标准，但上述探讨的相关性具有很强的暗示性，并支持对贸易在近期经济历史中作用的普遍积极观点：贸易和整合的增加有助于全球贫困的剧减，从而导致全球不平等的显著下降。但这种全球性的进步是以先进经济体挤压其中产阶级为代价的吗？


    这个问题在近期反对全球化以及对全球贸易不公平的抱怨中非常突出。例如，政府和企业领袖经常抱怨大型发展中国家（即中国和印度）经常滥用其“特殊和优惠待遇”——这是世界贸易体系中为发展中国家提供的一系列贸易例外，包括更长的关减承诺和其他贸易自由化措施的实施时间。许多抱怨称，某些发展中国家的市场准入受限，许多发展中国家为当地企业和国有企业提供补贴和其他不公平优势，而且某些国家（尤其是中国）从事强制技术转让或直接盗取知识产权。此外，如前所述，服务贸易仍受到高度限制，这损害了在服务领域仍拥有优势的先进经济体。但同样，近期“边境后”限制激增，这些限制实际上限制了贸易。


    这些担忧在过去的二十年里存在于美国和欧洲，跨越了不同的政权和经济周期，尽管在特朗普政府期间，这些问题在美国变得明显得多——导致了对发展中国负面情绪的惊人上升。然而，要区分政治姿态和真实问题的迹象是挑战性的。从理论上讲，更好的数据应该有助于确定哪些论点是有据可的。几十年来，贸易数据的可用性和质量大幅提高，但遗憾的是，如今国际贸易中争议最大的方面非常难以衡量，甚至无法衡量。关税是易于衡量的，但关税已不再像过去那样重要了。如今真正重要的贸易限制——非关税壁垒、“边境后”限制以及其他有效限制跨境贸易的监管限制——几乎无法衡量的。


    以食品安全法规为例，这些法规与跨境贸易高度相关，在许多欧洲国家尤为普遍。如何判断一个政府的食品安全法规是源于有效的健康和食品质量担忧，还是为了（全部或部分）保护本国农业生产者免受进口竞争而设计的贸易政策？标准数据指标无法反映政府对每项法规的底层逻辑；即使某些食品安全法规在事实上是“边境后”贸易限制，也无法确定其真实动机是什么，以及它们是否合理。原则上，人们可以检查法规对进口的影响是否大于对国内产品和服务的损害；如果是，那么它们应该被视为贸易限制而非消费者保护。但在实践中，这一标准对于某些完全不在国内生产的类型产品是没有帮助的。例如，氯氯鸡肉在英国被禁止，但在美国生产和消费。欧洲人以食品安全为理由证明禁令合理，但美国声称其担忧没有科学依据，且禁令反映了保护主义动机。


    # 反弹的原因


    在所有产品标准案例中，区分基于国家公民偏好和价值观的有效监管与赤裸裸的保护主义之间的挑战都是普遍存在的。但在劳工和安全标准案例中，这一问题尤为尖锐。为了提高生活水平，中国、越南或埃塞俄比亚的（曾经）贫困人口可能乐于在极低薪水和恶劣（甚至危险）的情况下长时间工作。然而，人们不会预期先进经济体的工人为了支持世界其他地区的贫民，就轻易放弃他们从最低工资到其他劳动力市场监管中辛苦获得的成果——至少在不引发那种导致美国和欧洲经济民族主义兴起的抵抗的情况下。如果全球不平等和国家内部不平等之间存在权衡，那么这种权衡在劳工标准案例中最为显著。但与产品标准一样，很难在对工人安全和福利的合理担忧与保护先进经济体国内就业的尝试之间划出一条清晰的界限。


    可以说，关于世界贫民是否以牺牲中产阶级为代价从全球化中受益的问题，数据和证据是不充分且不一的。显然，国家内部还有更多情况——这引出了我们的第二类不平等问题。


    ## 2.3 国家内部的不平等：劳工与价格


    正如所述，贸易通过两个主要渠道影响国家内部的不平等：劳工渠道（通过对劳动力市场的影响）和消费者渠道（通过对价格的影响）。考虑到许多人（根据图2.3的调查结果）日益担心贸易会对工作和工资产生负面影响，从劳工渠道开始是合理的。


    ### 2.3.1 对工人的不平等影响


    经济学家长期关注劳动力市场的不平等。从20世纪70年代开始，几篇论文记录了技能溢价（即技能工人与非技能工人之间的工资差距，通常根据工人教育水平定义，因此是劳动力市场不平等的关键驱动因素）在美国和欧洲不断增加。到20世纪90年代，技能溢价已变得显著.¹6
    在那时，注意力也部分从低技能转向了中产阶级工作。几位经济学家认为，从90年代开始，中产阶级工人日益承受了大部分负面影响。相对于非技能和高技能工人，中产阶级的工资正在下降，工作正在消失——这种现象被称为劳动力市场极化.¹17


    全球化在这些发展中起了什么作用？理解贸易与技能溢价增加之间关系的自然起点是国际贸易的主流模型，即所谓的海普歇-奥林模型。该模型预测，贸易的增加将产生数据中观察到的现象：由于发展中国家拥有大量的低技能工人和低工资，增加先进经济体与发展中国家的贸易接触，预计会对先进经济体产生负面的劳动力市场后果，包括技能工人与非技能工人之间工资差距的扩大。


