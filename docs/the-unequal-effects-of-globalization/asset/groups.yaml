    ## 反弹的原因


    值得注意的是，企业利润的增加与劳动分配收入份额的下降相关——这一趋势在发达和发展中经济体中均可见——表明经济权力发生了再次重新分配。正如企业获取了更多贸易和技术收益的份额，而不是将这些收益传递给消费者一样，他们未能将这些收益传递给工人。


    全球化在多大程度上对企业利润的广泛增长做出了贡献？毕竟，全球经济的这些剧烈变化发生在历史性的贸易增长时期。遗憾的是，这个问题很难给出确定的答案。在某些特定案例中，很明显全球贸易影响了市场势力力，并加剧了消费者与生产者之间的不平等；正如我们对印度的分析所示，1991年的贸易自由化对该十年剩余时间里企业的巨额利润产生了直接影响。在其他背景或全球范围内，这种因果关系更难识别。然而，有许多强有力的暗示性证据。


    例如，世界银行2020年的《世界发展报告》在全球价值链（GVC）扩张的背景下探讨了这些问题——发现大量证据表明，参与 GVC 的收益在各国消费者和生产者之间并未平等分配。图
