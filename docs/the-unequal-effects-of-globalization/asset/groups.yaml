    # （超）全球化时代


    与中国、印度、美国以及世界其他地区的经验进行对比（如图1所示）。¹显然，20世纪70年代后期中国市场形式的形成导致中国出口占GDP比重的急剧增加，从1977年的4%上升到2007年的41%。虽然这种增长对全球趋势产生了巨大影响，但并不仅仅是因为中国经济体量的的巨大，其他国家也做出了贡献。例如，印度的出口份额在同样的三十十年内从5%增加到14%。无疑，发达经济体并非全球趋势的主要驱动力；美国的出口份额在二战后期间仅小幅增长，从1945年的4%增加到2014年的9%。


    图1.4生动地说明了发展中国家在“全球化时代”发挥的重要作用——特别是低收入国家。²在1985年至2015年间，世界出口结构在国家收入组别上发生了巨大变化。1985年，高收入国家的出口占全球贸易的约87%。但在接后的三十年里，其他三组——中高收入国家、中低收入国家和低收入国家——的份额从全球贸易的约13%增加到约32%。（注意，这里的国家收入组是根据世界银行1987年的分类以不随时间变化的类别的。）


    低收入国家在此期间经历了所有收入组别中最大的增长，从世界贸易份额的2.8%增加到16.7%。同样，是中国是这些变化的主要驱动力——在图1.4中被归类为低收入国家（正如其在1987年那样），尽管它在20世纪90年代后期进入中低收入国家，并在十年后升入中高收入国家。然而，许多其他发展中国家的全球整合也发挥了重要作用；例如，中低收入国家的全球贸易份额从8.5%增加到12.6%。发展中国家在世界贸易中日益增长的重要性，反映了它们对全球价值链（GVCs）的参与，正如我们在本专著中详细探讨的那样。


    ![](img/f1ac5da9ba787aa6bb5a9248aefc270a_20_0.png)


    **图1.4** 按收入组别划分的世界出口构成。来源：Nina Pavcnik, “The Impact of Trade on Inequality in
    Developing Countries,” Jackson Hole Economic Policy Symposium Proceedings (Kansas
    City: Federal Reserve Bank of Kansas City, August 2017), 67。


    ## 1.2 贸易政策持续（且被低估）的重要性


    这一长时期贸易增长的潜在驱动力是什么？经济学家们对这个问题争论了数十年。虽然二战后关税水平的下降是一个主要因素，但近年来出现了一种新的共识——学者和政策制定者达成一致——20世纪后期全球贸易额的爆发无法通过贸易政策来解释。这种观点认为更重要的因素在起作用，即技术，而且全球化是不可避免且不可阻挡的。根据这一新共识，20世纪后期的技术发展使世界更加联系，同时也导致了运输和通信成本的稳定下降，共同使得全球贸易繁荣。。此类推，这种观点认为到20世纪末，贸易政策——即关税的征收和削减以及首先在《关税与贸易协定》（GATT）内、随后在世界贸易组织（WTO）内签署的贸易协议——对全球贸易水平或多无关。³


    这种观点反映在近期大众媒体的几段引言中。例如，在关于拟议的跨太平洋伙伴关系协定（TPP）益处和感知风险的文章中，《纽约时报》在2015年指出：


    > [一个削弱对TPP支持的神话]是，近期的贸易协议损害了就业…… 这种论点未能将全球贸易增加的影响与协议产生的影响区分开来。[驱动这一趋势的是全球化、技术以及有缺陷的教育和税收体系，而非贸易协约。⁴


    人们可能认为这种观点仅由不熟悉贸易政策细节的记者所持有。事实上，正如经济学家保罗·克鲁格曼（Paul Krugman）在1995年写道：


    > 关于世界贸易增长的大多数新闻话语似乎将日益增长的整合视为技术必然性驱动的——即认为运输和通信技术的改进构成了一种消解国家边界的不可阻挡的力量。然而，国际经济学家倾向于认为贸易增长的大部分（尽管不是全部）本质上具有政治原因，将其二战后巨大的扩张在很大程度上归于消除了自1913以来限制世界市场的保护主义措施。⁵


    在克鲁格曼发表这一声明二十多年后，贸易政策在国际贸易日益重要的情况下仅起次要作用的观点不再局限于记者圈；它现在已在学术研究中占据主导地位。新共识反映在经济学家普里切特（Pritchett）2008年的这段引言中：


