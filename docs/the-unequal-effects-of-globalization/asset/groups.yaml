  - '[PAGE 97]


    Deaton Review, for instance, notes the many measurement and identification difficulties
    associated with assessing trade’s impact on prices. 40 Chief among these difficulties
    is the lack of the highly disaggregated price data needed to assess price impacts
    across the income distribution. While expenditure surveys provide economists with
    large data sets to analyze price effects, they record expenditures and quantities
    at a very coarse level, making it difficult to capture differences in the specific
    brands consumed by the rich or the poor. (Needless to say, for example, a price
    reduction on imported Armani jackets from Italy would have very different inequality
    implications than a price reduction on imported jackets from Ethiopia.) Retail
    scanner data, such as those provided by Nielsen, collect real-time price and other
    information that can partially compensate for this lack of granularity. Such data,
    however, often do not include major product categories that benefit substantially
    from trade, such as automobiles. Furthermore, such data have become available
    only recently, often making the samples derived from them too short for credible
    empirical analysis. All of these difficulties may contribute to the view that
    trade’s price effects disproportionately benefit the poor.


    Likewise, existing price studies fail to capture that most people in most countries,
    including the global poor, now have access to a range of incredible goods and
    services, including smartphones and internet access, which would have been unthinkable
    a few decades ago. The key factors that made this possible are technological development
    and international trade, namely through cost and price reductions made possible
    by international specialization within GVCs. In earlier times, the notional price
    of such goods and services was essentially infinity for the many lower-income
    households that could not afford them. Thanks to trade and technology, this price
    has declined'
  - '[PAGE 98]


    to a finite number that many low-income consumers can afford. While hard to formally
    measure, the impact of such changes may very well be a first-order concern for
    the well-being of millions or billions of poor households around the world. The
    challenge of measuring such transformational shifts is perhaps the most important
    shortcoming of efforts to analyze the effects of trade on consumer inequality.


    To conclude, the effects of globalization on prices and consumers are much the
    same as its effects on workers and firms: as with so much about globalization,
    the effects on inequality are complex, difficult to untangle, and subject to a
    high degree of interaction with factors that are constantly in flux (e.g., technology).'
