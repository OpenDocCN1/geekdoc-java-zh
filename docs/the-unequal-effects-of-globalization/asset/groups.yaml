    of Economic Literature.23 In particular, we explored how differential tariff changes
    in developing countries related to changing wage levels, skill premiums, and other
    dimensions of inequality in those countries. While we did find effects that were
    statistically significant, their magnitudes were small. In Latin America, for
    example, we found that trade liberalization did affect labor markets, but it could
    not account for the substantial rise in inequality documented in several Latin
    American economies in the 1980s and 1990s. We did not, however, explore the dynamics
    of inequality across space identified by Autor, Dorn, and Hanson as well as Choi
    and colleagues. More recent work has found evidence of large effects of trade
