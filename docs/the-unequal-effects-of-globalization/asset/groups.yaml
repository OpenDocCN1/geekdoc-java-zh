    # 反弹的原因


    全球人口范围内福祉水平的差距。由于这一衡量主要受一些大国（如印度和中国）的人口状况与其他国家人口状况对比的影响，因此它通常被认为反映了国家之间的不平等。而国内不平等则一次只考虑一个国家。在这种情况下，贸易与不平等之间的关系非常复杂，因为贸易以两种相关但不同且对立的方式影响一个国家的人口：一方面作为**消费者**，通过由于贸易增加或减少导致的价格下降或上涨影响他们；另一方面作为**工人**，通过贸易对劳动力市场结果的影响影响他们。这个示意图为思考贸易的分配效应提供了一个实用的结构。我们将从最广泛的层面，通过全球不平等的视角探讨贸易问题。


    # 不平等


    ![](img/f1ac5da9ba787aa6bb5a9248aefc270a_53_0.png)


    # 2.2 贸易与全球不平等：赢家还是输家？


    经济学家和经济历史学家之间有充分的证据和广泛的共识，全球不平等在过去的几十年中显著下降，特别是二战后的几十年里。诺贝尔奖得主经济学家安格斯·迪顿（Angus
    Deaton）在他2013年的著作《大逃离》（The Great Escape）中强调了如今增长放缓和差距扩大，但也显示在过去的250年里，人类变得更加健康和富有，因为数十人在经历了千年的贫困后摆脱了贫困和疾病。同样，布兰科·米拉诺维奇（Branko
    Milanovic）在2016年的著作《全球不平等》（Global Inequality）显示，中国和印度等国中产阶级收入的增长，以及曾经分散地区（特别是中国和东亚，以及东欧）的整合如何导致了全球不平等的历史缩小.^⁸2006年，世界银行旗舰年度报告《世界发展报告》认为公平与经济繁荣是互补的.^⁹
    迪顿、米拉诺维奇、世界银行以及许多经济学家将我们在减少全球不平等方面的进展（特别是最近几十年）归功于长期关闭的边界的开放、国家间贸易的增长以及现代全球贸易体系的建立，认为更自由的贸易和迁移将进一步减少全球不平等。


    然而，这种观点引发了一个问题：全球不平等与国内不平等之间是否存在权衡？这一点最明确的说明是所谓的“大象曲线”（elephant curve），由克里斯托夫·拉克纳（Christoph
    Lakner）和布兰科·米拉诺维奇于2016年首次开发.^10 图2.4复制了他们的原始图，该图将收入增长率与全球收入分布的不同百分位数（称为增长收益曲线）进行比对，时间跨度为1988年至2008年.^1¹
    对于水平x轴上的每个收入百分位数，垂直y轴显示了该特定百分位数的收入增长率。图下方的手绘线条是卡罗琳·弗瑞恩德（Caroline Freund）后期添加的，生动地突出了数据呈现的大象形状。虽然图表确实显示了全球前1%人口所获得的高增长率，以及处于第8和第20百分位数的人的人所经历的极低增长率，但在拉克纳和米拉诺维奇首次发表时，他们的主要目标是说明1988年至2008年间的增长显著减少了全球不平等和贫困。这一点得到了以下事实的支持：尽管收入分布中大多数百分位数的收入增长率为正且相对较高，但低端和中段的人群的收入增长率特别高，这表明世界上最贫困的群体从这一时期的增长中受益最多。


    图2.5显示了大象曲线的最新更新版本，使用了1980年至2016年的数据，由包括托马斯·皮凯蒂（Thomas Piketty）、埃马纽埃尔·萨埃茨（Emmanuel
    Saez）和加布里埃尔·祖库曼（Gabriel Zucman）在内的研究小组完成——他们利用税收数据对美国的收入不平等问题进行了大量研究。¹¹² 更新产生了一张完全不同的图表，具有完全不同的含义。


    ![](img/f1ac5da9ba787aa6bb5a9248aefc270a_55_0.png)


    # 图 2.4


    （旧的）大象曲线：全球增长收益曲线，1988–2008。来源：Christoph Lakner and Branko Milanovic, “Global
    Income Distribution: From the Fall of the Berlin Wall to the Great Recession,”
    World Bank Economic Review 30, no. 2 (2016): 203–232. 大象由Rada Pavlova添加，改编自Caroline
    Freund。


    ![](img/f1ac5da9ba787aa6bb5a9248aefc270a_56_0.png)


    # 图 2.5


    （新的）大象曲线：所有地区按百分位数划分的总收入增长率，1980–2016。来源：Facundo Alvaredo, Lucas Ch, Thomas Piketty,
    Emmanuel Saez, and Gabriel Zucman, eds., World Inequality Report 2018 (Paris:
    World Inequality Lab, 2018), 13, https://wir2018.wid.world.


    首先，通过在水平x轴上扩展第99百分位数并将垂直y轴增加到250%的收入增长，这条新曲线凸显了全球前1%的人口在近四年的时间里获取了总收入增长的27%——这是一个真正巨大的份额。收入分布的底端50%仍然获取了总增长的12%，但与拉克纳和米拉诺维奇之前的图表相比，这一份额小得多，且在中等收入百分位数中的分布不那么广泛。


    两张图之间的差异可以用两个图之间的几种方法论差异来解释，包括更长的时间跨，但最重要的区别是更新后的曲线基于税收数据，而拉克纳和米拉诺维奇的曲线是基于调查数据¹³
    使用税收数据让作者能够更清晰地捕捉收入分布的高端。在使用调查数据时，这些高收入水平的人群并不回答——即使他们回答了，他们的收入也被标记为“非常高”。如果你想展示不平等是如何由全球高收入者不成比例地获取增长驱动的，那么更新的大象曲线非常清晰有力地说明了这一点。


    另一方面，如果你想展示世界上最贫困的人在过去的几十年中如何从增长中受益——且是以某些中等收入者的利益为代价的——那么图中收入分布的较低部分很好地说明了这一点。特别是在更新的大象中，底层人群（世界上的人，主要位于发展中国家和新兴市场）从1980年到2016年的收入增长高达125%。然而，尽管这表明了全球贫困和不平等的减少，处于第六、第七、八和第十百分位数（对应发达国家的中产阶级）的人在同一期的收入增长明显低得多。虽然两个大象曲线都没有反映负收益增长——图中全球收入分布的所有范围内实际收入都在增长——但决定不平等演变的不是收入增长，而是相对收入增长


    图2.6中贫困下降最剧烈的地区是亚洲和太平洋地区。这种进展大部分归功于中国，过去几十年那里有大约十亿人脱离贫困。显然，中国在此期间对贸易的进一步开放及其出口驱动的经济增长模式是这一进展的有力贡献者。


    ![](img/f1ac5da9ba787aa6bb5a9248aefc270a_59_0.png)


    **图 2.6**全球贫困的下降，1990–2030。来源：Nishant Yonzan, Christopher Lakner and Daniel Gersson
    Mahler, “Projecting Global Extreme Poverty up to 2030: How Close Are We to World
    Bank’s 3% Goal,” World Bank Data Blog, October 9, 2020, https://opendata/projecting-global-extreme-poverty-2030-how-close-are-we/-world-banks-3-goal.


    值得注意的是，过去几十年没有取得相应进展的唯一地区是撒哈拉以南非洲——全球整合程度最低的地区之一，该大陆的大部分人口与全球市场（通常也是国内城市市场）完全隔绝


