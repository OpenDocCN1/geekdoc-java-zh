    注释


    33. “后向参与”涉及购买位于公司制造流程之前的供应链环节；在国际背景下，由于供应链的部分可能位于不同的国家，人们可以将后向整合理解为“进口以出口”（例如，进口中间品或半成品，以制成出口到其他国家的产产品）。许多发达国家通过从成本通常较低的发展中国家进口零件或中间产品来参与这种后向整合，那里发展中国家的成本通常较低。相比之下，“前向参与”涉及公司行业价值链中上游的业务活动；在国际背景下，人们可以将前向整合理解为“出口出口”（例如，将原材料或零件出口到另一个国家，在这些国家将其用于制造随后出口到不同国家的产品）。许多发展中国家参与了这种前向整合。


    34. 世界银行，《2020年世界发展报告：全球价值链时代的贸易发展》（华盛顿特特区：世界银行，2019年）。


