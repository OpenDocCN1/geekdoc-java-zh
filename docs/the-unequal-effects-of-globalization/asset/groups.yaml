    Less well understood is how sectoral mobility may interact with and further constrain
    regional mobility. For example, if you are a laid-off auto worker in Detroit who
    wants to transition to the electronics or computer sector, in addition to having
    to acquire the necessary skills, you may need to move to the Bay Area or another
    technology hub to take advantage of local job opportunities, further exacerbating
    the mobility frictions.


    ## Causes of the Backlash


    The implications of Autor, Dorn, and Hanson’s findings is that China alone was
    perhaps not solely responsible for the China syndrome; rather, local labor frictions
    within the United States also played a role in producing the large effects. Exploring
    this distinct dimension of inequality, namely inequality across space, shifts
    the methodological focus for analyses of trade’s effects on inequality. Similar
    findings were documented in the aforementioned study by Choi, Kuziemko, Washington,
    and Wright into the labor effects of NAFTA.22 Employing a local labor markets
    approach similar to that of Autor, Dorn, and Hanson, their study documents large
    negative effects of NAFTA on US counties where employment depended on industries
    that were more vulnerable to the trade agreement’s impacts. These results diverge
    from common wisdom at the time that trade had minimal labor market impacts in
    the United States before China’s sharp trade expansion in the early 2000s.


    Similar studies have found evidence of trade’s effects on regional inequality
    within countries and the role of mobility frictions in developing countries. Importantly,
    many of these studies explore the effects of episodes of unilateral trade liberalization
    rather than import competition from China or any other country, and many focus
    on developing countries that were relatively unaffected by the China shock. Several
    of these developing country trade liberalization episodes have been explored in
