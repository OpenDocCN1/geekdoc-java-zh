    尽管近期的紧张局势到目前对全球贸易尚未产生巨大的整体影响，但评论员、政策制定者和国际机构更为关注的重大担忧——是它们引发的不确定性的加剧。不确定性的增加对投资具有产生不利的长期影响，而投资与全球价值链（GVCs）紧密相随。鉴于全球价值链在全球经济中的核心作用，持续的不确定性可能会导致重要的转变，例如价值链的搬迁，这可能会影响全球增长前景。如果目前的紧张局势得解决，世界进入持续的贸易冲突和不稳定性时期，这些转变可能会波及全球经济。尽管如此，这可能对全球增长产生产生整体影响，除了暂时的放缓和一些边际效率与生产率损失之外。今天的经济极不可能在不参与国际贸易的情况下回到自给自足或完全经济独立；在中长期，更有可能的发展是贸易流的重新导向和区域集团的加强。


