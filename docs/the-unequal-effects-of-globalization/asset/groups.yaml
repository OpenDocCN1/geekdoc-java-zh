    # Conclusion


    Second, the dramatic growth of firm profits in light of globalization demands
    greater focus and policy action. The emergence of GVCs, growth of global technology
    platforms, and reallocation of capital and market power toward incredibly large,
    highly mobile, and deeply connected “superstar” firms all raise important questions
    about the relationships between firms, government, and society. While these questions
    are timeless and fundamental, their contemporary manifestations are highly novel
    and—technically, legally, and politically—almost endlessly complex. First and
    foremost, addressing the recent increase in firm markups demands greater attention
    to how these large firms are taxed and regulated.


    Finally and crucially, the issues raised in this monograph underscore the vital
    importance of greater international cooperation—on trade, but also in many other
    economic arenas. As noted, of the unequal effects of globalization go beyond the
    realm of trade while having important implications for it. Likewise, much of the
    increased trade frictions seen in recent years were not only due to narrowly defined
    trade policies like tariffs; rather, they involved “behind-the-border” measures,
    nontarif trade restrictions, and other aspects of economic activity that affect
    trade or inequality but much harder to measure.


    The recent tensions and backlash against globalization pose formidable challenges
    for the global trading system, but there are still significant opportunities for
    greater international cooperation. Regional trade, for example, offers tremendous
    promise—on its own, but also as a counterbalance to rising global uncertainty.
    While the European Union represents a somewhat controversial model these days
    (given Brexit, its negative monetary outcomes, and other challenges), there is
    little doubt that establishing a free trade zone in Europe generated highly positive
    outcomes'
