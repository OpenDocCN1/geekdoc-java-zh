    Notes


    33. “Backward participation” involves buying part of the supply chain that occurs
    prior to the company’s manufacturing process; in the international context, where
    parts of the supply chain are located in different countries, one can think of
    backward integration as “importing to export” (e.g., importing intermediates or
    semifished goods in order to manufacture finished products that are exported to
    other countries. Many advanced countries engage in this type of backward integration
    by importing parts or intermediate products from developing countries, where costs
    are typically lower. In contrast, “forward participation” involves business activity
    that are ahead in the value chain of a company’s industry; in the international
    context, one can think of forward integration as “exporting to export” (e.g.,
    exporting raw materials or parts to a different country, where they are used to
    manufacture products that are then exported to different countries). Many developing
    countries are involved in this type of forward integration.


    34. World Bank, World Development Report 2020: Trading for Development in the
    Age of Global Value Chains (Washington, DC: World Bank, 2019).


