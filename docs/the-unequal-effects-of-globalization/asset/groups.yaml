    moving within their own country to pursue better job opportunities?


    Typically, mobility constraints in the United States have been considered from
    the perspective of geographic frictions, including factors like the high rate
    of homeownership in the United States (compared to places like Europe, where more
    people rent). During an economic shock, owning a home can pose significant mobility
    challenges for workers who need or want to relocate. In addition of having to
    sell their home, they will likely need to do so at a discount if the local housing
    market is in a downturn, and they will likely need to repurchase a new home at
