    Such historically low trade costs enabled the other key feature of the “age of
    globalization”: an explosion of global trade volumes in the post-World War II
    period. Figure 1.2 shows how world exports, fairly constant in the nineteenth
    and early twentieth centuries, began rising after World War II and accelerated
    dramatically in the late 1990s and early 2000s—a period now known as hyperglobalization
    that coincided with the emergence of global value chains (GVCs). The export share
    of global GDP peaked in 2007, before the global financial crisis. After dropping
    sharply during 2007 and 2008, global exports quickly bounced back, but they have
    not yet recovered to precise levels. In the late 2010s, the growth of exports
    slowed—a trend we will explore more in later sections. The graph stops in 2019,
    by the onset of the global COVID-19 pandemic. While the pandemic and the economic
    crisis that followed did course impact trade, globalization, and inequality, it
    is still too early to assess its complex long-term effects and interactions. As
    discussed in the preface, for the purposes of this monograph, we consider the
    unequal effects of globalization up to the pandemic''s onset in 2020.


    Importantly, the fast rise of trade in the post-World War II period was not driven
    by a single country or group of countries. While certain developing countries—China,
    for instance—experienced rapid export growth, many other developing countries
    also became integrated into the world trading system during this period. Figure
