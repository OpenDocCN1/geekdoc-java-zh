    # Preface


    Globalization is currently a central focus of concern and debate among academics,
    policy makers, and—increasing—the general public. Of course, the phenomenon of
    globalization is nothing new. Since the ancient Sumerian and Greek civilizations,
    long-distance trade in goods has been a source of wealth for nations, broader
    forms of globalization, from migration and exploration to cultural cross-fertilization,
    have always been an essential feature of humankind. What is new, however, is the
    dramatic change in the scope and speed of globalization from the late 1990s until
    the financial crisis of 2008—a period labeled as the "age of hyperglobalization”—and
    the more recent trends against it.


    At a critical moment of shifting attitudes, policies, and politics related to
    globalization, this monograph enters the debate while also taking a step back
    in order to assess the recent evolution of global trade, and its unequal effects
    between and within countries. The sections that follow will investigate globalization’s
    many dimensions, disruptions, and complex interactions, from the late twentieth
    century’s wave of trade liberalizations to the rise of China, decline of manufacturing
    in advanced economies, and recent effects of trade on global poverty, inequality,
    labor markets, and'
  - '[PAGE 8]


    firm dynamics. The monograph will explore the significance of the recent backlash
    against retreat from globalization as well.


    Structurally, the monograph is organized into three main sections. The first section
    examines the key features of the recent period of hyperglobalization (and the
    post-World War II “age of globalization” that preceded it) as well as offers an
    overview of the emerging retreat. The second section argues that two factors likely
    contributed to this retreat: the perceptions that global trade and international
    competition have not been fair, and that this lack of fairness has also exacerbated
    inequality within countries. The third and final section briefly considers the
    key policy implications of these trends and emerging dynamics; in particular,
    it emphasizes—amid the possibility of an emerging era of deglobalization—the potential
    of place-based policies as well as the critical importance of international cooperation.


    The monograph is based on my Ohlin lecture at the Stockholm School of Economics
    on November 4, 2019. As such, its goal is to provide a succinct overview of the
    effects that globalization may have had on inequality. It does not claim that
    globalization was the sole or even most significant factor driving inequality;
    clearly, many other concurrent developments (such as technology and automation
    in particular) played an important role. Moreover, the monograph does not attempt
    an in-depth analysis of inequality and its drivers, nor does it offer a horse
    race between the many alternative hypotheses to which factors are responsible
    for the perceived increase in inequality in recent years. A major, multilayer
    research project is currently in the works of the Institute of Fiscal Studies
    to provide such a comprehensive analysis—Inequality: The Deaton Review, led by
    an interdisciplinary panel of which I am a member. Several relevant findings from
    the Deaton'
