    ## 1.4 How the Recent Backlash May Still Engender Deglobalization or “Slowbalization”


    While recent claims of a secular slowdown in global trade may be premature, the
    world is clearly experiencing a significant backlash against globalization. Ultimately,
    this backlash and the uncertainty it provokes may have greater implications for
    the future of trade than any other factor. There are numerous examples of backlash—in
    developed countries, where free trade and immigration (the topics most frequently
    linked in globalization debates) are now highly divisive political and social
    issues. The backlash appears broad and persistent, not constrained to any single
    country or administration. In the United States, many of the protectionist policies
    adopted by the Trump administration have thus far been maintained by the Biden
    administration. In the United Kingdom, Brexit has been the focal issue across
    multiple parliamentary elections. While governments in continental Europe have
    not fully embraced protectionism, several influential politicians or political
    parties have taken strong antitrade or anti-EU positions—for example, Marine Le
    Pen in France, the Alternative for Germany (AfD) party in Germany, or Viktor Orbán
    in Hungary—and there is significant skepticism toward immigration in many EU member
    countries. Perhaps most strikingly, for years the WTO has been locked in a series
    of existential crises between members that were only exacerbated by COVID-19,
    incapacitating the institution''s core functions of negotiation, dispute settlement,
    and trade policy notifications. One result of these trade tensions and the general
    climate thwarting international cooperation is a recent slowdown in new regional
    trade agreements. Figure 1.11 shows the number of new regional trade agreements
    formed by year, highlighting a slowdown in the 2010s and a significant drop in
    2018.¹³


