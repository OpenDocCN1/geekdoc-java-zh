    ## 1.3 Why Claims of a “Secular Slowdown” in Trade Are Premature


    International trade has slowed quite substantially since the global financial
    crisis. Some economists and policy makers have characterized the slowdown as secular
    (or long-term), suggesting that the fragmentation of global production through
    GVCs may finally run its course. Fragmentation clearly does have limits; the automotive
    industry, for instance—in which GVCs are particularly prevalent—can split car
    production into thousands of individual parts and components across thousands
    of different firms and markets, but eventually no further specialization will
    be possible.


