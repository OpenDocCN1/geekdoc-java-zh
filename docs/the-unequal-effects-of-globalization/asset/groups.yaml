    view.¹¹⁷⁷ Examining the effects of the recent trade war between the United States
    and China on “bystander” countries—or countries that were not directly affected
    by the tariff increases (i.e., countries other than the United States and China)—we
    find that trade of many of these countries actually increased as a result of the
    trade war. In fact, the rise in their global exports was large enough to offset
    the collapse of trade between the United States and China, so that by the end
    of 2019, global trade levels in the products most affected by the new tariffs
    had increased* in response to the trade war. This unexpected finding suggests
    that despite the heightened uncertainty, global trade did not collapse. Rather,
    it was reoriented from the United States and China toward other countries that
    saw an opportunity to increase their global presence. Of course, these bystander
    countries have not been immune to the uncertainties exacerbated by elevated trade
