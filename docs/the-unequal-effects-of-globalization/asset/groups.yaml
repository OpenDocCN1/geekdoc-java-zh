    to dramatic reductions in global poverty, which have led to significant declines
    in global inequality. But did this global progress come against the expense of
    advanced economies and the squeezing of their middle classes, especially in the
    United States and Europe?


    This question features prominently in the recent backlash against globalization
    and complaints that global trade is not fair. For instance, government and business
    leaders often complain that large developing countries, namely China and India,
    routinely abuse their self-determined “special and differential status”—a set
    of trade-related exceptions in the world trading system available to developing
    countries, including slower timelines for commitments to tariff reductions and
    longer timelines for implementing other trade liberalization measures. There are
    also many complaints that market access in some developing countries is limited,
    that many developing countries give subsidies and other unfair advantages to local
    firms and state-owned enterprises, and that some countries, especially China,
    engage in forced technology transfer or the outright theft of intellectual property.
    In addition, as mentioned earlier, trade in services is still highly restricted,
    and this hurts advanced economies that still enjoy advantages in the services
    sector. But not least, there has been a recent proliferation of “behind-the-border”
    restrictions that effectively restrict trade.


    These concerns have been present for the past two decades, both in the United
    States and Europe, across political administrations and business cycles, though
    they became significantly more pronounced in the United States during the Trump
    administration—contributing to an alarming rise in negative sentiments toward
    developing countries. It is challenging, however, to differentiate between political
    posturing and indications of a real problem. In theory, better data should help
    determine which arguments are grounded. The availability and quality of trade
    data has increased dramatically in recent decades, but unfortunately the aspects
    of international trade that are most contentious today are very hard, if not impossible,
    to measure. Tariffs are easy to measure, but tariffs are not as important as they
    were used to be. The trade restrictions that really matter today—nontariff barriers,
    “behind-the-border” restrictions, and other regulatory restrictions that effectively
    restrict cross-border trade—are nearly impossible to measure.


