    # ##1.1 General Trends


    Until recently, the prevailing economic consensus was that humanity was living
    through an unprecedented “age of globalization”: a period defined by increasing
    global connections through commerce and trade amid continual technological progress
    and a sustained period of geopolitical stability. But what does the “age of globalization”
    really mean in terms of its economic aspects— and what does it mean, moreover,
    that we may be living through its end?


    In terms of an economic definition of the “age of globalization,” two defining
    features stand out. First, over the course of several decades after World War
    II, all measurable trade barriers—by which we principally mean tariff levels—declined
    dramatically. While there are also, of important nontarif trade barriers (e.g.,
    quantitative restrictions on imports, such as quotas, and the “voluntary” export
    restraints applied to the US automobile industry in the early 1980s), they are
    harder to measure, and it is not clear that they have decreased to the same extent,
    as discussed below. Figure 1.1 shows the average US tariff levels between 1875
    and 2019: while more or less'
