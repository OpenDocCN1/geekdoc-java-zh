    ## 1.2 The Persistent (and Underrated) Importance of Trade Policy


    What were the underlying drivers of this long era of trade growth? Economists
    have been debating this question for decades. While falling tariff levels during
    the postwar period were a major factor, a new consensus has emerged in recent
    years—shared by academics and policy makers alike—the explosion of global trade
    volumes in the late twentieth century cannot be explained by trade policy. This
    view holds that more important factors were at play, namely technology, and that
    globalization was both inevitable and unstoppable. According to this new consensus,
    technological developments in the late twentieth century made the world more connected,
    while also leading to a steady decline in the costs of transportation and communication,
    which together allowed global trade to flourish. By extension, this view holds
    that trade policy—that is, the imposition and reduction of tariffs as well as
    the signing of trade agreements, first within General Agreement on Tariffs and
    Trade (GATT) and then within the World Trade Organization (WTO)—was more or less
    irrelevant to global trade levels by the end of the twentieth century.³


    This view is reflected in several recent quotes from the popular press. For example,
    in an article on the benefits and perceived risks of the proposed Trans-Pacific
    Partnership (TPP), the *New York Times* noted in 2015,


    > [One myth undermining support for TPP] is that recent trade agreements have
    hurt jobs... This argument fails to differentiate between the impacts of increased
    global trade and those of agreements. [It] is globalization, technology, and flawed
    educational and tax systems that are driving this trend, not trade pacts.⁴


    One might think that this view is only held by journalists who are not familiar
    with the specifics of trade policy. Indeed, as economist Paul Krugman wrote in
    1995,


    > Most journalistic discourse of the growth of world trade seems to view growing
    integration as driven by a technological imperative—to believe that improvements
    in transportation and communication technology constitute an irresistible force
    dissolving national boundaries. International economists, however, tend to view
    much, though not all, of the growth of trade as having essentially political causes,
    seeing its great expansion after World War II largely as a result of the removal
    of the protectionist measures that had constricted world markets since 1913.^5


    More than two decades after Krugman made this statement, however, the view that
    trade policy plays only a secondary role in the growing importance of international
    trade is no longer confined to journalistic circles; it has now become dominant
    in academic research. The new consensus is reflected in this 2008 quote from economist
    Pritchett:


    > “Relative to when I started working as a trade economist in the early 1970s,
    the world is completely liberalized...[T] the incremental gains from anything
    that could happen as a result of WTO negotiations are just infinitesimal.”^6 (Note:
    Corrected based on context from Lant::)


    While Pritchett does not explicitly claim that trade policy and trade agreements
    are irrelevant, he suggests that despite their significant effects in the past,
    their own success has rendered them irrelevant, and any incremental gains from
    further liberalization are destined to be small. Many academic economists would
    agree with this statement, and would go even further, claiming that trade policy
    never had significant effects; indeed, they could invoke a considerable body of
    work to support this view. Early studies of the effects of trade policies and
    agreements from the 1970s and 1980s, for example, to report small effects on trade
    flows.^7 Later studies that employed gravity-equation-based approaches to analyze
    the drivers of trade growth—in order to identify the relative contributions of
    trade policies, reductions in transportation and other trade costs, and income
    growth or convergence—yielded mixed results. The best-known and most controversial
    analysis is perhaps the 2004 study by Andrew Rose


