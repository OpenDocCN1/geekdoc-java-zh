    # 3 Conclusion


    The effects of globalization are both unequal and highly uneven. They are uneven
    between countries and within countries; they are uneven across regions and demographics;
    and they are uneven between producers, consumers, and workers. There is ample
    evidence that globalization exacerbates some dimensions of inequality, just as
    there is ample evidence that globalization reduces other dimensions of inequality
    (most important, global inequality). The underlying challenge is that inequality
    is a deeply broad concept. In many ways, the effects of globalization depend entirely
    on what dimension of inequality you are focused on.


    The ideal research and policy response to such a challenging state of affairs
    would be to identify, harness, and leverage globalization’s positive features
    while preventing, mitigating, or compensating for its negative effects. Unfortunately,
    researchers’ understanding of all the evidence and policy makers’ ability to act
    on it is many years from this ideal scenario. Perhaps only one broad finding is
    clear and certain as of: globalization causes disruption, which often requires
    significant transition and adjustment. Indeed, much of the recent backlash has
    been focused on these complications from trade rather than any abstract'
  - '[PAGE 100]


    notions about it. Yet standard economic models of inter-national trade, like much
    of the policy debates about it, tend to focus on the steady-state end results,
    be they gains or losses. At the very least, a key takeaway from this monograph
    and the evidence it showcases is that globalization is a process, not an end state.
    A major implication of this takeaway is that researchers and policy makers should
    focus more seriously on the disruptions, transitions, and adjustments from globalization
    than on estimating, defending, and condemning its ultimate impacts.


    Such a focus has at least three additional implications. The first is spatial
    or regional inequality is one of the most significant effects of globalization
    and should be a major priority for researchers and policy makers going forward.
    Regional inequality is significant not only because the empirical evidence increasingly
    suggests that global-izer''s adverse effects are quite spatially isolated but
    also because it has emerged as an important driver of the recent backlash against
    globalization. As such, while the unequal effects of globalization are many, regional
    inequality is perhaps the most likely to have significant social and political
    consequences. This provides potential justification for greater focus on and experimentation
    with so-called place-based policies. While the field of economics has traditionally
    a negative view of place-based policies, due to their potentially distort effects,
    they merit reconsideration as a tool for addressing regional inequality. For example,
    efforts to support displaced workers could be regionally targeted. There is growing
    evidence that retraining or “upskilling” programs are often ineffective, but such
    programs and other efforts—including policies for work-force development, social
    protection, and job creation—might be more promising if they focused on the places
    that need them most.'
