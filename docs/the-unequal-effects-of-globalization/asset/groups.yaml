    Depth: A New Database on the Content of Preferential Trade Agreements”（Policy
    Research Working Paper No. 7981, World Bank, Washington, DC, February 2017），https://openknowledge.worldbank.org/handle/10986/26148。


    对全球化的不满当然不是一个新现象，类似的反弹在近期历史中发生过。例如，在20世纪80年代末和90年代初，美国和日本经历了在许多方面与今天情况非常相似的贸易紧张局势。当时，人们对日本的出口增长、其汽车和其他行业在全球市场的快速成功以及其对市场准入的限制表示担忧。其他国家（以美国为首）担心这些因素对其国内工业和工人（主要是低技能工人）产生不利影响——当时，许多人警告说，与日本的贸易紧张局势可能导致全球开放贸易体系的终结。当然，如此严重的担忧最终并没有根据。虽然与日本的贸易冲突确实导致了美国采取了一些政策行动，包括对汽车行业的自愿出口限制（VERs），但贸易紧张局势在随后的几年里得到了解决，这与世贸组织时代和过度全球化时代相吻合。近期中美之间贸易紧张局势再次出现时，许多经济学家和政策制定者假设，正在发生类似于80年代末和90年代初的情景。他们假想，主要经济体之间的强硬辞令和手球贸易策略将是一个临时现象，可以迅速解决，可能导致另一个过度全球化时代。然而，现在很清楚，这次有所不同。强硬态度已升级为实质性的紧张局势，政策制定者对这些紧张采取了具体的贸易政策行动。我们已经进入了一个不确定性加剧的时期，这可能导致一个去全球化的新时代。


    然而，应该注意到，对全球化的反弹仍然相对较，而且尽管存在上述担忧，世界尚未进入持续或广泛的全球化时期。正如许多经济学家近年来所指出的，虽然“全球化时代”和随其后的过度全球化以自由贸易为特征，但全球经济的某些部门在多程度上一直以保护主义为特征。例如，在当前反弹之前，农业贸易就受到高度限制，服务贸易的自由化也有限。即使在可能是全球整合程度最高市场的欧盟内部，整合也主要延伸到货物贸易而非服务贸易。同样，尽管关税水平在过去几十年中达到了历史低位，但仍有许多限制贸易的所谓“边境后措施”。经济学家传统上将此类政策称为非关税贸易壁垒，但它们已演变为更广泛的形式——往往对国家间的贸易施加许多限制，并引入了干扰贸易的严重市场扭曲.¹⁴


    考虑到这些因素，近期贸易紧张局势的总体效应似乎相当小，这并不意外。例如，图1.12反映了


