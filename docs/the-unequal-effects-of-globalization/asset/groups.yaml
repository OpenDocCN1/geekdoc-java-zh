    # Conclusion


    nature, creating disincentives to reshore unless faced with negative shocks of
    considerable magnitude. Despite tough trade rhetoric in recent years and the worrisome
    outlook for globalization, we do not seem to have reached that point yet. Notwithstanding
    the possibility of major new policy developments, these arguments suggest that
    globalization may go on despite continued trade tensions and flagging multilateralism,
    albeit in a different and more subdued form.


    One area where greater multilateral cooperation is essential, however, is the
    global effort to address climate change. The effects of climate change are expected
    to be complex and highly unequal, while the challenges of mitigating or adapting
    to them will be formidable. Several of the tensions in the arena of global trade
    are relevant to the climate issue, including conflicts between countries. For
    instance, there is significant tension in the climate arena between advanced countries—which
    are predominantly responsible for the bulk of historic carbon emissions, and which
    have achieved such high levels of affluence that they can afford to refocus their
    economies toward slower-growth strategies that prioritize environmental sustainability—and
    developing countries, especially low-income countries and those affected by war
    or deprivation, which are eager to accelerate economic growth and development.
    These countries understandably do not wish their future growth, development, and
    escape from poverty to be constrained by global efforts on problems they did not
    create. In this case, regionalism does not offer a way out of the difficulties
    associated with negotiating and resolving these tensions between countries. Emissions
    do not understand borders, regions, or continents; the very nature of the problem
    calls for global measures to address it, and such measures require multilateral
    agreements.


    In many ways, the outlook for international agreement on climate is far more difficult
    than it is for issues like globalization—and as we have learned amid the COVID-19
    pandemic, war in Ukraine, and risks of a global slowdown, other global challenges
    will surely arise that are similarly vexing and disruptive. Yet as this monograph
    has shown, the evolution of globalization, its unequal effects between and within
    countries, and public attitudes and policies toward or against it have been anything
    but straightforward. With climate change, pandemics, and other challenges as yet
    unknown, we should likewise expect them to unfold in complex and unpredictable
    ways. As such, enhancing our response to the unequal effects of globalization
    today—by tackling regional inequalities, addressing the growth of firm profits,
    and strengthening multilateral cooperation on all dimensions of trade—will help
    prepare the global community to respond to the challenges of tomorrow.


