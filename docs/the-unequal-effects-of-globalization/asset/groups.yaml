    # 反弹的原因


    ![](img/f1ac5da9ba787aa6bb5a9248aefc270a_75_0.png)


    **图 2.9**

    巴西贸易自由化对收入的影响，1988–2010年。来源：Rafael Dix-Carneiro and Brian Kovak, “Trade Liberalization
    and Regional Dynamics,” American Economic Review 107, no. 10 (October 2017): 2908–2946.


    在自由化之后，与未受自由化影响的地区相比，工资大幅下降，并持续下降了近二十十年。正如 Dix-Carneiro 和 Kovak 所示，收入最终趋于稳定的唯一原因是工人离开了正式部门并寻求非正规就业（即未在税务机关注册的企业）。但这并不是一个积极的结果；这些工作通常被认为对工人来说不那么理想，福利更少、稳定性更差、职业安全感也降低。向非正规化的转型引发了许多关于劳动力市场摩擦的问题，这些问题在后续的研究中得到了探讨.$^{26}$
    如果这些影响可以推广到其他语境，它们对贸易与区域不平等之间的关系具有深远影响。


    许多研究还发现，贸易的负面影响可能远超劳动力市场。Autor、Dorn 和 Hanson 发现，美国竞争性地区（CZs）对中国进口冲击的暴露也导致了制造业以外的工资下降、家庭平均总收入大幅下降，以及通过联邦和州收入援助计划（如失业保险、福利金和其他津贴）的整体转转移支付的增加。在印度，Eric
    Edmonds、Nina Pavnick 和 Petia Topalova 的研究发现，与自由化程度较低的地区相比，自由化程度较高的地区童工率更高，受教育时间更短（相对而言），对女孩更是如此.$^{27}$
    在另一项关于巴西的研究中，Dix-Carneiro 及其合作者 Rodrigo Soares 和 Gabriel Ulyssea 发现，进口自由化增加了受进口竞争影响最严重地区的犯罪率（同样是相对而言的）。


    重要的是，这些仅仅是相对效应；它们并不意味着整个经济体都受到了贸易的伤害。事实上，特别是对于发展中国家，贸易开放与许多积极的经济效益相关。尽管如此，贸易与区域不平等之间存在明确的联系。当各国开放贸易时，可能会产生巨大的区域差异——特别是进口自由化，这是过去几十年中发展中国家和发达国家经常采取的一种方式。再次，如此巨大且持久的影响令人惊讶；标准经济模型本会预期就业情况会，


    ## 2.3.2 对消费者的不平等影响


    国内不平等的另一个维度与消费者渠道有关。通常情况下，我们预期消费者能从更高程度的国际整合中受益，表现为价格的降低。在标准经济模型中，减少贸易壁垒通过两种方式降低消费者价格：由于可以使用更廉的外国制造“中间投入品”，降低了国内企业的生产成本，只要这些降能以更低价格的形式转嫁给消费者，也能推动国内投入品价格的下降；和/或者由于存在更廉的进口“制成品”，增加了国内企业面临的竞争压力。消费者还可以通过获得更高质量和更多种类的产品来从贸易中获益。这种观点在直觉上是合理的，并得到了经济学文献中大量理论工作的支持，长期以来一直是贸易经济学家和政策制定者倡导更多自由贸易的理由。但数据支持这一点吗？令人惊讶的是，关于贸易如何影响价格的直接证据并不丰富，关于全球化消费者侧的实证研究也相对有限。然而，尽管存在证据（大部分来自发展中国家），但也参差不齐。


    例如，来自印度的最新证据表明，关于消费者从贸易中获益的标准经济理论在实践中并不总是适用——特别是在市场并非完全竞争的情况下。例如，2016 年，我与 Jan
    De Loocker、Amit Khandelwal 和 Nina Pavnick 合作写了一篇论文，分析了1989 年至 2003 年间印度企业的生产数据，涵盖了印度贸易自由化前后的时期——这上面提到的
    Topalova 对贸易对工人不平等影响的研究分析的是同一时期。² 利用价格和数量的企业数据，我们建立了一个框架来理解开放全球贸易如何影响印度企业的边际生产成本、消费者支付的价格以及企业利润（反映在企业在制成品上所加加价中）。


    图 2.10 显示了我们分析的主要结果。我们发现，印度的贸易自由化（期间价格也下降了，但降幅不及平均水平）使企业边际成本平均降低了 18%。虽然消费者价格确实下降了，但其降幅仅比贸易模型预测的少
    13%，与企业享有的平均成本下降相似。这种现象可能对印度内部的不平等以及任何国家贸易的分配效应产生影响。具体而言，这意味着贸易可能导致了另一个维度不平等的增加：消费者与生产者之间的不平等。


    其他几项研究记录了过去几年全球范围内加价和利润的上升。例如，De Loecker、Jan Eeckhout 和 Gabriel Unger 最近的一篇论文通过分析企业级数据来估算总加价，记录了20
    世纪 50 年代以来美国经济市场权的演变.³31 图 2.11 显示了他们惊人的结果：虽然总加价在 1955 年至 1980 年间基本稳定，但之后从 21%（边际成本之上）稳步上升到
    2016 年的 61%。期间，平均利润率从 1% 增加到 8%。关键是，De Loecker、Eeckhout 和 Unger 还发现加价并未按比例增加所有企业。相反，少数大企业获得了更高的加价，而大多数企业的加价没有增加并失去了市场份额——这表明了市场权的重新分配。这反映了美国和其他发达经济体中所谓的“巨星”企业的崛起，许多行业已变得日益


