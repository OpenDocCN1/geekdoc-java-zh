    # Inequality


    ![](img/f1ac5da9ba787aa6bb5a9248aefc270a_53_0.png)


    # 2.2 Trade and Global Inequality: Winners and Losers?


    There is substantial evidence and widespread consensus among economists and economic
    historians that global inequality has decreased dramatically in recent decades,
    especially in the decades since World War II. In his 2013 book The Great Escape,
    Nobel Prize–winning economist Angus Deaton highlights today''s slowing growth
    and widening gaps, but also shows that human beings have grown vastly healthier
    and wealthier during the past 250 years, as billions of people have been lifted
    out of poverty and sickness following millennia of destitution.^7. Likewise, Branko
    Milanovic''s 2016 book *Global Inequality* shows how rising middle-class incomes
    in countries like China and India as well as the integration of once-disparate
    regions, especially in China and East Asia but also eastern Europe, have delivered
    historic reductions in global inequality.^8 In 2006, the World Bank''s flagship
    annual report, the *World Development Report*, argued that equity and economic
    prosperity are complementary.^9. Deaton, Milanovic, the World Bank, and many other
    economists credit our progress in reducing global inequality—especially in recent
    decades—to the opening of long-closed borders, the growth of trade between countries,
    and the establishment of the modern global trading system, arguing that more free
    trade and migration would reduce global inequality even further.


    This view, however, raises the question of whether there is a trade-off between
    global inequality and within-country inequality. The most explicit illustration
    of this point is the so-called elephant curve, first developed by Christoph Lakner
    and Branko Milanovic in 2016.^10. Figure 2.4 reproduces their original graph,
    which plots the income growth rate against the various percentiles of the global
    income distribution—called a growth incidence curve—between 1988 and 2008.^11.
    For each income percentile on the horizontal x-axis, the vertical y-axis shows
    the income growth rate for that particular percentile. The hand-drawn lines beneath
    the graph were added later by Caroline Freund to charmingly highlight the data''s
    elephantine shape. While the graph does show the high growth rate captured by
    the world''s top 1 percent—and the extremely low growth rate experienced by people
    around the eighth and twentieth percentile—when Lakner and Milanovic first published,
    their primary aim was to show that growth between 1988 and 2008 brought remarkable
    reductions in global inequality and poverty. This point is supported by the fact
    that while income growth rates are positive and relatively high for most percentiles
    in the income distribution, they are particularly high for those in the lower
    and middle sections, suggesting that the world’s poorer groups benefited the most
    from growth in this period.


    Figure 2.5 shows a recent update to the elephant curve, using data from 1980 through
    2016, by a group of researchers including Thomas Piketty, Emmanuel Saez, and Gabriel
    Zucman—


