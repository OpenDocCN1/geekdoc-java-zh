    of inequality: spatial inequality within countries, exacerbated by mobility frictions.


    For instance, a 2010 paper by Petia Topalova measures the impact of trade liberalization
    on poverty and inequality following India’s sharp trade liberalization in 1991.24
    Amid a balance-of-payments crisis in 1991, and as part of an International Monetary
    Fund structural adjustment program, the Indian government suddenly abandoned the
    extremely restrictive trade policies it had pursued since independence. Topalova
    uses the variation in industrial composition across Indian districts before liberalization
