    ## 1.4 近期反弹为何仍可能引发去全球化或“慢全球化”


    尽管最近关于全球贸易出现长期性放缓的说法可能还时过早，但世界显然正在经历对全球化的强烈反弹。归根结底，这种反弹及其引发的不确定性对未来贸易的影响可能比任何其他因素都要大。反弹的例子比比胜尺——在发达国家，自由贸易和移民（全球化辩论中最频繁联系在一起的话题）现在已成为极具争议的政治和社会问题。这种反弹似乎是广泛且持久的，并不限于任何单一国家或政府。在美国，特朗普政府采纳的许多保护主义政策到为止仍被拜登政府所维持。在英国，脱欧一直是多次议会选举的核心议题。虽然欧洲大陆的各国政府尚未完全拥抱保护主义，但有几位有影响力的政治人物或政党采取了强硬的反贸易或反欧盟立场——例如法国的玛丽娜·勒庞（Marine
    Le Pen）、德国的德国选择选择党（AfD）或匈牙利的维克托·奥尔班（Viktor Orbán），而且许多欧盟成员国对移民持有严重怀疑。或许最令人震惊的是，多年来，世贸组织（WTO）陷入了成员之间的一系列生存危机，新冠肺炎进一步加剧了这些危机，使该机构谈判、争端解决和贸易政策通知的核心功能陷入瘫痪。这些贸易紧张和阻碍国际合作的总体氛围导致近期新区域贸易协议签署签署放缓。图1.11显示了按年份形成的新区域贸易协议数量，凸显了20世纪10年代的放缓以及2018年的大幅下降。¹³


    ![](img/f1ac5da9ba787aa6bb5a9248aefc270a_37_0.png)


