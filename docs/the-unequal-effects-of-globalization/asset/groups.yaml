    affect imports more adversely than domestic products and services; if they do,
    then they should be considered trade restrictions rather than consumer protection.
    In practice, however, this criterion would be unhelpful for certain types of products
    that are not produced domestically at all. Chlorinated chicken, for example, is
    banned in the United Kingdom while produced and consumed in the United States.
    European justify the ban on the basis of food safety, but the United States claims
    that their concerns have no scientific basis and that the ban reflects protectionist
    motives.


    # Causes of the Backlash


    The challenge of differentiating between valid regulations based on the preferences
    and values of a country’s citizens and outright protectionism is present in all
    cases of product standards. But it is even more acute in the case of labor and
    safety standards. To improve their living standards, the (once-)poor in China,
    Vietnam, or Ethiopia may have been content to work long hours at extremely low
    pay and under harsh, if not dangerous, conditions. One would not expect workers
    in advanced economies, however to readily give up their hard-won gains, from minimum
    wages to other labor market regulations, in order to support the poor in other
    parts of the world—at least without putting up the kind of resistance that has
    led to the rise of economic nationalism in the United States and Europe. To the
    extent that there is a trade-off between global and within-country inequality,
    then this trade-off is most salient in the case of labor standards. But as with
    product standards, it is hard to draw a clear line between well-founded concerns
    regarding the safety and welfare of workers and attempts to shield domestic jobs
    in advanced economies.


    Suffice to say, then, that the data and the evidence are insufficient and mixed
    on the question of whether the world’s poor benefited from globalization at the
    expense of the middle classes. Clearly, there is more going on within countries—which
    is a useful segue to our second category of inequality.


    ## 2.3 Trade and Inequality within Countries: Labor and Prices


    As noted, trade affects inequality within countries through two primary channels:
    the worker channel, through trade’s impacts on the labor market, and the consumer
    channel, through trade’s effects on prices. It makes sense to start with the worker
    channel given that many people (according to the survey responses in figure 2.3)
    are increasingly concerned that trade may have adverse effects on jobs and wages.


    ### 2.3.1 The Unequal Effects on Workers


    Economists have long been concerned with inequality in the labor market. Starting
    in the 1970s, several papers documented that the skill premium—i.e., the gap in
    wages between skilled and unskilled workers, typically defined in terms of workers’
    education levels, and thus a key driver of labor market inequality—was increasing
    in the United States and Europe. By the 1990s, the skill premium was significant.¹6
    Around that time, the attention also shifted somewhat from low-skill to middle-class
    jobs. Several economists argued that starting in the 1990s, middle-class workers
    were increasingly bearing the brunt of adverse effects. Relative to both unskilled
    and high-skilled workers, middle-class wages were decreasing and jobs were disappearing—a
    phenomenon called labor market polarization.¹17


    What was globalization’s role in these developments? A natural starting point
    for understanding trade’s relationship to the increased skill premium is the workhorse
    model of international trade, the so-called Heckscher-Ohlin model. The model predicts
    that increased trade would generate exactly what was observed in the data: since
    developing countries have an abundance of low-skilled workers and low wages, increasing
    advanced economies’ exposure to trade with developing countries can be expected
    to have adverse labor market consequences in the advanced economies, including
    the widening of wage gaps between skilled and unskilled workers.

