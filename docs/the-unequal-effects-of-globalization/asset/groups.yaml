  mdcn: "\n\n劳动力可能导致这些国家出现“人才流失”——或者更广泛地说，是“能力流失”，因为许多缺乏技能的移民者仍然是动力极强的个体，在创业和生产力方面具有巨大潜力。（作为一名希腊人，我的职业生涯大部分时间都在美国度，我在这一领域有一些个人经验；我倾向于认为人口迁移对接收国通常是有益的，尽管大规模移民对我们所留下的国家的长期影响尚不明确。）对于关于全球化的经济和政策辩论来说，这些都是至关重要且相关的问题——但出于本专著的目的，我将完全集中在贸易上。\n\
    \n同样，本专著并没有关注全球化的所有辅助特征，如资本流动性。近几十年来，资本流动经历了剧剧增长，同时全球许多国家也发生了重大的政策变化，这些变化取消或放开了资本管制，并自由化了汇率制度。这种增强的资本流动性促进了贸易增长、外国直接投资以及全球价值链的形成，成为20世纪90年代和21世纪00年代“超全球化”不可或缺的方面。这一本质上不受限制的资本流动时代具有许多影响：大型跨国“超级明星”企业的兴起，以及在全球化不平等影响下，如何对资本进行征税的问题。然而，资本流动性的广泛特征、驱动因素和影响出了本专著对全球化某一方面的观察的范围：国际贸易与不平等之间的关系。\n\
    \n在进行奥林（Ohlin）演讲时，我是世界银行集团的首席经济学家。讲座和本专著中表达的观点代表我个人，不代表世界银行的观点。自2019年底以来，世界发生了剧变，COVID-19疫情对全球化和不平等产生了深远影响。本专著的基础数据早于疫情，我不会尝试对全球健康和经济危机对全球化和不平等本质的长期影响进行任何推测；对于这样的任务来说现在还时早早。尽管如此，我偶尔会对涉及新冠疫情之前的陈述进行限定，指出近期为应对疫情而出现的趋势。\n\
    \n# 致谢\n\n我感谢斯德哥尔姆经济学院，特别是我的主讲人 David Domeij，邀请我发表2019年奥林演讲，本专著正是基于此讲座创作的。同样，感谢麻省理工学院出版社（MIT\
    \ Press），特别是 Emily Taber，邀请我将该讲座转化为奥林演讲系列中的一本书，以及两位提供了许多建设性意见的评审员。我感谢耶鲁大学经济增长中心——特别是\
    \ Rohini Pande、Deanna Ford 和 Vestal McIntyre——对手稿起草阶段的支持。Greg Larson 提供了无足价值的写作支持，Rada\
    \ Pavlova 专业地复制并设计了本专著的图表。奥林演讲和本专著很大程度上借鉴了我过去和现在的工作，其中许多工作是与耶鲁及其他机构的许多受崇同事共同完成的——包括我在世界银行首席经济学家期间的2020年《世界发展报告》团队。我对他们所有人深表感谢。特别感谢\
    \ Jan De Loecker、Amit Khandelwal、Nina Pavlik、Michele Ruta、Max Schwarz 和 Daria\
    \ Taglioni，他们更新了本专著中包含的数据、图表和分析。\n\n# #1 （超）全球化时代\n\n## 1.1 总体趋势\n\n直到最近，主流的经济共识是，人类正生活在一个前所未有的“全球化时代”：这一时期的特征是在技术不断进步和地缘政治局势持续稳定的背景，通过商业和贸易日益增强的全球联系。但从经济角度来看，“全球化时代”到底意味着什么——而且，我们可能正处于其终结之际，这意味着什么？\n\
    \n从“全球化时代”的经济定义来看，有两个定义特征脱颖而出。首先，在第二次世界大战后的几十年里，所有可衡量的贸易壁垒（我们主要指关税水平）都大幅下降。虽然也存在重要的非关税贸易壁垒（例如，对进口的数量限制），但它们更难衡量，且尚不清楚它们是否下降到了同样的程度。图1.1\
