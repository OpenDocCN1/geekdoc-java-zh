    # 反弹的原因


    尽管如此，整个 20 世纪 90 年代，大多数经济学家认为贸易在这些趋势中并没有发挥主要作用。相反，当时的共识是，技能溢价的增加很大程度上是由技术发展驱动的，而贸易仅起到了le且次要的作用，主要通过其与技术的相互作用发挥。这一结论部分基于“要素含量”研究——即对贸易模式和生产过程的分析，这种分析使人们能够量化国家进出口中所包含的劳动力——利用
    90 年代的贸易数据，研究人员量化了发达国家进口竞争加大的影响，并发现这种影响很小。该结论还基于一种观察：发展中国家在 20 世纪 90 年代不平等现象加剧，而传统的贸易模型预测恰相反：考虑到发展中国家在低技能密集型活动中的比较优势，人们预预期贸易增加会导致低技能工资增加和工资不平等缩小。18
    针对这一时期劳动力市场极化的研究也得出了结论，贸易并非主要驱动因素。


    然而，这种共识在 21 世纪 20 年代开始发生转变，经济学家们突然开始将贸易视为劳动力市场不平等的潜在重要驱动力。但具体是如何发生的，为什么又发生在 21
    世纪 20 年初呢？为什么他们在贸易历史上最快速增长的 20 世纪 90 年代未能发现这种联系？这些仍然是未解决的问题，但存在两个可能的答案——两者都与中国有关，后者与经济学家处理劳动力市场不平等方法的近期转变有关，即更多地关注区域不平等。


    ### 中国 过去二十年来，美国制造业就业人数大幅下降。图 2.7，重制


    ![](img/f1ac5da9ba787aa6bb5a9248aefc270a_66_0.png)


    图 2.7 1948–2021 年美国制造业失业率。注：根据美国经济研究局的数据，阴影条表示美国衰退期。来源：Justin Pierce 和 Peter Schott，《美国制造业就业人数的意外下降》，*美国经济评论*第
    106 卷，第 7 期（2016 年 7 月）：1632–1662，数据来自美国劳工统计局，“所有员工，制造业 [CEU3000000011]”，FRED，圣路易斯联邦储备银行，https://fred.stlouisfed.org/series/CEU3000000001，2022
    年 10 月 8 日。来自 Justin Pierce 和 Peter Schott 在《美国经济评论》上的论文显示了自 1948 年以来美国制造业就业人数的演变。在
    20 世纪下半的大部分时间内，制造业就业人数相对稳定——在衰退期间下降，通常在随后的年份中反弹。但从 2001 年开始，这一数字急剧下降。2001 年至 2004
    年间损失了约 290 万个制造业岗位，在全球金融危机期间又损失了 250 万个。然而，与过去的衰退不同，美国制造业并没有出现实质性的复苏。尽管 21 世纪
    10 年代初增长缓慢，但制造业就业人数仍然远低于历史水平。


    # 反弹的原因


    为了解释这些剧烈变化，几位经济学家注意到，中国进入世界贸易体系的时刻恰好是美国制造业开始侵蚀的时刻——考虑到其经济规模，中国的加入对全球贸易动态产生了巨大、快速且深远的影响。（注：原文此处存在大量重复内容，已根据逻辑进行去重处理）。

