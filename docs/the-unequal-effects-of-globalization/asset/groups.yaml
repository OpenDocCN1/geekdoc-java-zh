    Discontent with globalization is of course not a new phenomenon, and similar backlashes
    have occurred throughout recent history. In the late 1980s and early 1990s, for
    example, the United States and Japan experienced trade tensions that were in many
    ways quite similar to what is occurring today. At the time, there were concerns
    about Japan’s export growth, the rapid success of its automobile and other industries
    in global markets, and its restrictions on market access. Other countries (led
    by the United States) worried about the detrimental effects that these factors
    would have on their domestic industries and workers, primarily low-skilled workers—and
    at the time, many warned that trade tensions with Japan could lead to the demise
    of the global system of open trade. Of course, such severe concerns were ultimately
    not justified. While the trade conflict with Japan did lead to some policy actions
    by the United States, including voluntary export restraints (VERs) in the auto
    industry, the trade tensions were eventually resolved in the years that followed,
    which coincided with the era of the WTO and hyperglobalization. When global trade
    tensions reemerged between the United States and China in recent years, many economists
    and policy makers presumed that a similar scenario as in the late 1980s and early
    1990s was unfolding. They presumed that the harsh rhetoric and handball trade
    tactics between major economic powers would be a temporary phenomenon that could
    be swiftly resolved, perhaps resulting in another era of hyperglobalization. It
    is now clear, however, something is different this time. Tough talk has escalated
    into tangible tensions, and policy makers responded to these tensions with concrete
    trade policy actions. We have entered a period of heightened uncertainty, which
    may lead to a new era of deglobalization.


    Yet it should also be noted that the backlash against globalization is still relatively
    new, and that the world—the above concerns notwithstanding—has not as of yet entered
    into a period of sustained or widespread globalization. As many economists have
    pointed out in recent years, while the “age of globalization” and the hyperglobalization
    that followed are characterized by free trade, certain sectors of the global economy
