    跨越美国当地劳动力市场——或“通勤区”（CZs）——是基于每个通勤区对中国进口产品竞争的暴露程度和脆弱性进行划分的。在2000年至2007年间，他们发现，制造业集中程度较高且来自中国的进口渗透率更大的通勤区，其制造业就业人数下降更为剧烈。有趣的是，Autor、Dorn和Hanson所记录的效应导致了一个出人意料的结论：劳动力在不同通勤区之间似乎是不流动的。在他们的研究之前，大多数经济学家假设劳动力在当地劳动力市场之间具有高度的流动性。因此，他们的发现引发了一个重要问题：流动性摩擦的本质是什么？是什么阻碍了受贸易冲击影响的工人在在本国内移动以寻求更好的工作机会？


    通常，美国的流动性限制是从地理摩擦的角度考虑的，包括诸如因素，如美国高住房拥有率（与欧洲等地区相比，那里更多的人租房）。在发生经济冲击期间，对于需要或想要搬迁的工人来说，拥有住房可能会带来重大的流动性挑战。除了必须卖房之外，如果当地住房市场处于低迷时期，他们可能需要折价出售，而如果他们搬到一个经济机会更具前景的地区，他们可能需要溢价购买新房。较难理解的是，部门流动性如何与区域流动性相互作用并进一步限制后者。例如，如果你是底特律一个被裁员的汽车工人，想转型到电子或计算机行业，除了需要获得必要的技能外，你可能需要搬到湾区或其他技术枢纽以利用当地的工作机会，从而进一步加剧了流动性摩擦。


    ## 反弹的原因


    Autor、Dorn和Hanson发现的启示是，中国本身可能并不是“中国综合症”的唯一责任所在；相反，美国内部的当地劳动力摩擦在产生巨大影响方面也发挥了作用。探索这种不平等的独特维度，即空间上的不平等，转移了分析贸易对不平等影响的方法论重点。在上述Choi、Kuziemko、Washington和Wright对北美自由贸易协定（NAFTA）劳动力影响的研究中，也记录了类似的发现。他们的研究采用了与Autor、Dorn和Hanson相似的当地劳动力市场方法，记录了NAFTA对美国某些县的巨大负面影响，这些县的就业依赖于对贸易协定影响更为脆弱的行业。这些结果与当时的共识相悖，当时的共识认为在21世纪初中国贸易剧烈扩张之前，贸易对美国劳动力市场的影响微乎其微。


    类似的研究已经发现了贸易对国家内部区域不平等的影响，以及流动性摩擦在发展中国家中所起的作用。重要的是，这些许多研究探索的是单边贸易自由化时期的效应，而非来自中国或其他任何其他国家的进口竞争，而且许多研究关注的是受“中国冲击”影响相对较小的发展中国家。这些发展中国家的贸易自由化时期中的几个，我曾与Nina
    Pavcnik早期进行了探讨，研究结果发表在《经济学文献杂志》（Journal of Economic Literature）上。特别是，我们探讨了发展中国家的关税差异如何与工资水平的变化、技能溢价以及这些国家不平等的其他维度相关。虽然我们确实发现了统计学上显著的效应，但其规模很小。例如，在拉丁美洲，我们发现贸易自由化确实影响了劳动力市场，但它无法解释20世纪80年代和90年代若干拉丁美洲经济体记录的不平等急剧上升。然而，我们并没有探讨Autor、Dorn、Hanson以及Choi及其同事所确定的空间不平等动态。更最近的工作已经发现了贸易自由化对发展中国家区域不平等产生巨大影响的证据（比我们记录的对技能或工资溢价的影响更大）。这些发现进一步证明了，许多经济学家记录的近几年贸易对劳动力市场产生的巨大影响，不仅是因为中国作为贸易超级国的崛起，也并非是因为技能溢价的上升，而是凸显了不平等的另一个维度：国家内部的空间不平等，这种不平等被流动性摩擦所加剧。


    例如，Petia Topalova2010年的一篇论文探讨了1991年印度贸易自由化后对贫困和不平等的影响。在1991年国际收支危机期间，作为国际货币基金调整计划的一部分，印度政府突然放弃了极其限制性的贸易政策。Topalova利用自由化之前印度工业组成的差异，分析了贸易自由化对该国的影响。她发现，在受自由化影响最大的地区，贫困减少的速度在90年代比其他地区慢了约15%。


    为了增加贸易冲击的不平等效应，2017年Rafael Dix-Carneiro和Brian Kovak的一篇关于巴西的论文也显示了国家内部有限的流动性如何加剧并延长了这些影响。在20世纪90年代初，贸易自由化使巴西面对全球市场和国际竞争。巴西贸易自由化的便利特征是——与持续了十年的中国冲击不同——它在短时间内实施完成，并在1995年完成。这使得人们能够追踪其对当地劳动力市场的长期影响。图2.8通过将受影响最严重的地区（如圣保罗）与未受影响的地区进行比较，显示了这种自由化对就业的影响。80年代后期，这些地区的就业稳定且略强，但在自由化之后，相对于未受影响的地区急剧下降。


    这种趋势本身并不意外：当进口引发负面需求冲击时，标准经济模型预计受冲击影响的劳动力市场在短期内会受到不利影响。然而，令人惊讶的是这些效应如此持久。标准经济模型预测随着企业调整和工人迁移到机会更好的地区，劳动力市场将逐渐恢复。Dix-Carneiro和Kovak显示，巴西并没有恢复。在受自由化影响严重的地区，就业持续下降，并在近二十年内保持在显著较低的水平。许多关于该主题的研究证实了这些效应，这些效应通常很大，反映了经济思维的又一次转变。图2.9显示，在巴西工资方面也出现了类似甚至更糟的情况。


