    # 2.2 - Java Memory Model (JMM)


    Detailed explanation of Java''s memory structure, including heap, stack, method
    area, and runtime constant pool.


    The Java Memory Model (JMM) defines how the Java Virtual Machine (JVM) organizes
    and manages memory. Java''s memory structure ensures that programs are efficient,
    maintainable, and thread-safe. The memory model includes the **heap**, **stack**,
    **method area**, and **runtime constant pool**, each serving a unique purpose
    in program execution.


    The **heap**** is the largest part of memory where objects are stored. It is shared
    among all threads and managed by the garbage collector. When you create an object
    using the `new` keyword, it is allocated in the heap. The heap itself is divided
    into generations: Young Generation (Eden and Survivor spaces) and Old Generation.
    Objects move across these regions based on their lifecycle.'
