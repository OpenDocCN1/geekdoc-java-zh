    # 1.8 - Java Memory Model


    Explores Java''s memory structure and management system.


    **Java Memory Model (JMM)** defines how the Java Virtual Machine (JVM) organizes
    and manages memory during the execution of a program. The memory structure is
    divided into specific regions to allocate, manage, and reclaim memory efficiently.
    The JVM ensures that objects are created, manage, stored, and accessed while maintaining
    thread safety and performance. Java''s automatic garbage collection system manages
    unused memory, improving application reliability.


    The Java memory is primarily divided into the following regions:


    +   1. **Heap Memory**: Stores objects and class instances.

    2. **Stack Memory**: Stores method call frames, local variables, and references.

    3. **Metaspace**: Stores class metadata, method information, and constants.

    4. **Program Counter (PC) Register**: Tracks the address of the current instruction.

    5. **Native Method Stack**: Manage native method calls used in JNI (Java Native
    Interface).


