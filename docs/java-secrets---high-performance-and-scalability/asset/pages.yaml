    # 1.9.1 - Security Policies


    Details Java''s security policies and **permission system.


    Java''s **security policies** and **permission system** provide a powerful mechanism
    to restrict and control what a Java application or code can do. By enforcing security
    policies, the Java Virtual Machine (JVM) ensures that untrusted code cannot access
    system resources or perform unauthorized operations. Java achieves this through
    a **Security Manager** and **Policy Files**.. Policy files specify the permissions
    granted to code, such as file access, network connections, and system property
    access.


