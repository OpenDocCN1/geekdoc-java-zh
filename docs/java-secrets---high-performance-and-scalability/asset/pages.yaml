    # 3.4 - Thread Synchronization


    Thread synchronization in Java is essential to avoid race conditions and ensure
    data consistency when multiple threads access shared resources. A race condition
    occurs when two or more threads attempt to modify the same resource concurrently,
    leading to unpredictable results. Java provides several synchronization mechanisms,
    such as the **`synchronized`**\*\* keyword, locks, and concurrent utilities, to
    handle these scenarios effectively.


    The **`synchronized`**\*\* keyword is the simplest way to ensure that only one
    thread can execute a critical section of code at a time. It can be applied to
    methods or blocks of code.'
