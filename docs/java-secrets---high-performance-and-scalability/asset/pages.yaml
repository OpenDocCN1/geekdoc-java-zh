- img_proc: true
  md: 'Generational garbage collection is an optimization used in Java to improve
    the efficiency of memory management by dividing the heap into regions based on
    the lifecycle of objects. Most objects created in a program are short-lived, and
    identifying and collecting these objects quickly reduces overhead. Generational
    garbage collection takes advantage of this observation by organizing the heap
    into two main regions: the **Young Generation** and the **Old Generation**.


    The **Young Generation** is where new objects are allocated. It is further divided
    into the **Eden Space** and two **Survivor Spaces** (S0 and S1). Most objects
    die in the Young Generation. When objects survive multiple garbage collection
    cycles, they are promoted to the **Old Generation** (also called the Tenured Generation).
    The Old Generation contains long-lived objects that are not collected as frequently.


    This approach minimizes the amount of work done during each garbage collection
    cycle. Minor garbage collections occur frequently in the Young Generation and
    are fast because the number of surviving objects is small. Major or full garbage
    collections occur less frequently in the Old Generation.


    To understand generational garbage collection, consider the following example
    where many short-lived objects are created:'
