    # 3.4.1 - Synchronized Blocks and Methods


    In multi-threaded Java applications, ensuring proper control over shared resources
    is critical to avoid race conditions and ensure data consistency. The `synchronized`
    keyword in Java allows you to control access to critical sections of code, ensuring
    that only one thread can execute a block or method at a time. Synchronization
    can be achieved using synchronized **methods** or synchronized **blocks**, and
    the choice depends on which part of the code needs protection.


    A synchronized **method** ensures that the entire method is locked so that only
    one thread can execute it at a time. When a method is declared `synchronized`,
    the thread acquires a lock on the object for non-static methods or the class for
    static methods. The thread holds this lock until the method completes execution.'
