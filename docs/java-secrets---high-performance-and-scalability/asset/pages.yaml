    # 1.4.2 - Garbage Collection


    Explores garbage collection mechanisms and their impact on memory management.


    Garbage collection (GC) in Java is an automatic memory management process that
    reclaims memory occupied by objects no longer referenced. This allows developers
    to focus on application logic without explicitly freeing memory. The JVM handles
    garbage collection, ensuring efficient memory utilization and preventing memory
    leaks. However, understanding how garbage collection works and its impact on performance
    is essential for building scalable and efficient applications.


    The JVM divides memory into regions: the **heap** and the **non-heap** areas.
    The heap is where objects are allocated, and it is further divided into the **Young
    Generation**,, **Old Generation (Tenured)**, and ** **Permanent Generation (Metaspace
    in Java 8+).** Garbage collection primarily focuses on reclaiming unused objects
    in the heap.


    To understand how GC works, start with a simple program that creates many objects:'
