- img_proc: true
  md: '**stack** memory is used to store method calls, local variables, and references.
    Each thread has its own stack, and every time a method is invoked, a new frame
    is added to the stack. When the method completes, its stack frame is removed,
    and the memory is reclaimed automatically.


    **method area** (also known as the Metaspace in Java 8 and later) stores class-level
    metadata, such as bytecode, method definitions, static variables, and constant
    values. It is shared among all threads.


    **runtime constant pool** is a part of the method area that holds symbolic references,
    literals, and compile-time constants. These values are loaded at runtime.


