    is controlled by two things: the total memory available on the computer and the
    amount the JVM is configured to use. The default memory allocation is 256MB. A
    different amount can be set with the -Xmx command-line argument.


    To set this in NetBeans, choose Run, Set Project Configuration, Customize. The
    Project Properties dialog opens with the Run settings at the front. In the VM
    Options field, enter -Xmx1024M to allocate 1024MB of memory to the JVM. Also fill
    the Main Class and Arguments fields and run the program by choosing Run, Project.


