  md: "# Creating Java2D Graphics\n\nWhen you create a PiePanel object, none of the\
    \ slices have an assigned color or size. The only things that you must do in the\
    \ constructor are define the size of the slice array and save the background color\
    \ of the panel:\n\n```\npublic PiePanel(int sliceCount) {\n    slice = new PieSlice(sliceCount);\n\
    \    background = getBackground();\n}\n```\n\nUse the addSlice(Color, float) method\
    \ to add a slice of the pie to the panel:\n\n```\npublic void addSlice(Color sColor,\
    \ float sSize) {\n    if (current <= slice.length) {\n        current = new PieSlice(sColor,\
    \ sSize);\n        totalSize += sSize;\n        current++;\n    }\n}\n```\n\n\
    The current instance variable is used to put each slice into its own element of\
    \ the slice array. The length variable of an array contains the number of elements\
    \ the array has been defined to hold; as long as current is not larger than slice.length,\
    \ you can continue adding slices to the panel.\n\nThe PiePanel class handles all\
    \ graphical operations in the paintComponent() method, as you might expect. The\
    \ trickiest thing about this task is drawing the arcs that represent each slice\
    \ of the pie.\n\nThis is handled in the following statements:\n\n```\nfloat start\
    \ = 0;\nfor (int i = 0; i < slice.length; i++) {\n    float extent = slice[i].size\
    \ * 360 / totalSize;\n    comp2D.setColor(slice[i].color);\n    Arc2D.Float drawSlice\
    \ = new Arc2D.Float(\n        xset, yset, width, height, start, extent,\n    \
    \    Arc2D.Float.PIE);\n    start += extent;\n    comp2D.fill(drawSlice);\n}\n\
    ```\n\nThe start variable keeps track of where to start drawing an arc, and extent\
    \ keeps track of the size of an arc. If you know the total size of all pie slices\
    \ and the size of a specific slice, you can figure out extent by multiplying the\
    \ arc's size by 360 and dividing that by the total of all slices."
