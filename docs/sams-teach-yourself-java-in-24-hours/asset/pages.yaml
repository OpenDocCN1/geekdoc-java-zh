  md: '# Completing a Graphical Application


    # Enabling and Disabling Components


    You might have seen a component in a program that appears shaded instead of its
    normal appearance.


    Shading indicates that users cannot do anything to the component because it is
    disabled. Disabling and enabling components is accomplished with `setEnabled()`
    method of the component. A Boolean value is set as an argument to the method,
    so `setEnabled(true)` enables a component for, and `setEnabled(false)` disables
    it.


    The following statements create buttons with the labels Previous, Next, and disable
    the first button:


    ```

    JButton previousButton = new JButton("Previous");

    JButton nextButton = new JButton("Next");

    JButton finishButton = new JButton("Finish");

    previousButton.setEnabled(false);

    ```


    This method is an effective way to prevent a component from sending a user event
    when it shouldn''t. For example, if you''re writing a Java application that collects
    a user''s address using text fields, you could disable a Save Address button until
    the user provided a street address, city, state, and ZIP code.


    # Completing a Graphical Application


    At this point, `LottoMadness` is just a GUI. You can click buttons and enter into
    text boxes, but nothing happens in response. In this workshop, you create `LottoEvent`,
    a new class that receives user input, conducts lotto drawings, and keeps track
    of the number of times you win. When the class is complete, you add a few lines
    to `LottoMadness` so that it makes use of `LottoEvent`. It is often convenient
    to divide Swing projects in this manner, with the GUI in one class and the event-handling
    methods in another.


    The purpose of this assignment is to assess the user''s chance of winning a six-number
    lotto drawing in a lifetime. Figure 15.2 shows a screen capture of the program
    as it runs.'
