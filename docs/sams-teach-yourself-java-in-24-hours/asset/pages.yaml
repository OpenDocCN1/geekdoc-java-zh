  md: '# Workshop


    # Q&A


    Q. Is a line in a Java program the same as a statement?


    A. No. The programs you create in this book put one statement on each line to
    make the programs easier to understand; it''s not required.

    The Java compiler does not consider lines, spacing, or other formatting issues
    when compiling a program. The compiler just wants to use semicolons at the end
    of each statement. This line would work fine in Java:


    ```

    int x = 12; x = x * 1;

    ```


    Putting more than one statement on a line makes a program more difficult for humans
    to understand when they read their source code. For this reason, it is not recommended.


    Q. Why should the first letter of a variable name be lowercase, as in gameOver?


    A. It''s a naming convention that helps your programming in two ways. First, it
    makes variables easier to spot among the other elements of a Java program. Second,
    by following a consistent style in the naming of variables, you eliminate errors
    that can occur when you use a variable in places in a program. The style of capitalization
    used in this book is the one that has been adopted by most Java programmers over
    the years.


    Q. Can I specify integers as binary values in Java?


    A. You can, with a feature introduced in a recent version of Java. Put the characters
    "Ob" in front of the number and follow it with the bits in the value. Since 1101
    is the binary form for the number 13, the following statement sets an integer
    to 13:


    ```

    int z = 0b00001101;

    ```


    The underscore is just there to make the number more readable. It''s ignored by
    the Java compiler.

    Hadecimal values can be represented with numbers preceded by "0x", as in Super
    Bowl 03, in which the Denver Broncos defeated the Seattle Seahawks with a score
    of 0x2B to 0x8.


    Q. What the heck are Larets?


    A. Larets, the product mentioned in this hour, is a snack made of edible worms
    that have been killed, dried, and mixed with the same kinds of scrumptious food-like
    flavoring as Doritos chips. You can order Larets in three flavors—BBQ, cheddar
    cheese, and Mexican spice—from the mail-order retailer HotLix at the website hotlux.com
    or by calling 1-800-EAT-WORM.'
