  md: '# Creating Minecraft Mods with Java


    Everything a mod does when its command is entered goes at the spot marked by the
    comment // do something cool here.


    The first thing the SiameseCat mod needs to do is learn more about the game world,
    using these three statements:


    ```

    Player me = (Player) sender;

    Location spot = me.getLocation();

    World world = me.getWorld();

    ```


    An object called me is created by casting the sender object to the Player class.
    This object is the character controlled by the person playing the game.


    With this Player object, you can call its getLocation() method with no objects
    to learn the exact spot where the player is standing. This spot is represented
    by the Location class. Three things you can learn about a location are its (x,y,z)
    coordinates on the three-dimensional game map.


    The Player object also has a getWorld() method that returns a World object representing
    the entire game world.


    Most of the mods you create will need these Player, Location, and World objects.


    This mod creates a new mob that is a Siamese cat, using the spawn() method of
    the World class:


    ```

    Ocelot cat = world.spawn(spot, Ocelot.class);

    ```


    There''s a class for every type of mob in the game. The two arguments to spawn()
    are the location where the cat should be placed and the class of the mob to create.


    This statement creates an Ocelot object named cat at the same spot as the player.


    At this point, the cat is an ocelot, but it can be changed to a Siamese cat with
    this statement:


    ```

    cat.setType(Ocelot.Type.SIAMESE_CAT);

    ```


    The cat''s setType() method determines whether the cat is a wild ocelot or a Siamese,
    black, or red cat.


    Cats in Minecraft are one of the mobs that can be tamed by an owner. This relationship
    is established by calling the cat''s setOwner() method with the player as the
    argument:


    ```

    cat.setOwner(me);

    ```'
