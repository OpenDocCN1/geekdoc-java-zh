  md: '# # APPENDIX A

    Using the NetBeans Integrated Development Environment


    Although it''s possible to create Java programs with nothing more than the Java
    Development Kit and a text editor, the experience is considerably more pleasant
    when you use an integrated development environment (IDE).


    The first 23 hours of this book employ NetBeans, a free IDE offered by Oracle
    for Java programmers. NetBeans is a program that makes it easier to organize,
    write, compile, and test Java software. It organizes a project and file manager,
    graphical user interface designer, and many other tools. One killer feature is
    a code editor that automatically detects Java syntax errors as you type.


    Now in version 8.0, NetBeans has become a favorite of professional Java developers,
    offering functionality and performance that would be worth the money at 10 times
    the price. It''s also one of the easiest IDEs for Java novices to use.


    In this appendix, you learn enough about NetBeans to install the software and
    put it to use throughout this book.


    # ## Installing NetBeans


    From inauspicious beginnings, the NetBeans IDE has grown to become one of the
    leading programming tools for Java developers. James Gosling, the creator of the
    Java language, gave it the ultimate vote of confidence in his Foreword to the
    book NetBeans Field Guide: "I use NetBeans for all my Java development." I''ve
    become a convert as well.'
  merge: -1
  pgno: 450
- img_proc: true
  md: 'NetBeans supports all facets of Java programming for the three editions of
    the language—Java Standard Edition (JSE), Java Enterprise Edition (JEE), and Java
    Mobile Edition (JME). It also supports web application development, web services,
    and JavaBeans.


    You can download the software, available for Windows, Mac OS, and Linux, from
    http://netbeans.org. NetBeans is available for download bundled with the Java
    Development Kit and can be downloaded separately. You must have NetBeans and the
    JDK installed on your computer.


    If you''d like to ensure that you''re downloading the same versions of NetBeans
    and the JDK used in the preparation of this book, visit the book''s website at
    www.java24hours.com. Click the cover of this book to open the site for this edition
    and then look for the Download JDK and Download NetBeans 8.0 links. You''ll be
    steered to the proper sites.


    # Creating a New Project


    The JDK and NetBeans are downloaded as installation wizards that set up the software
    on your system. You can install the software in any folder and menu group you
    like, but it''s best to stick with the default setup options unless you have a
    good reason to do otherwise.


    When you run NetBeans for the first time after installation, you see a start page
    that displays links to news and programming tutorials (see Figure A.1). You can
    read these within the IDE using NetBeans'' built-in browser.


    A NetBeans project consists of a set of related Java classes, files used by those
    classes, and Java class libraries. Each project has its own folder, which you
    can explore and modify outside NetBeans using text editors and other programming
    tools.


    To begin a new project, click the New Project button shown in Figure A-1 or choose
    the File, New Project menu command. The New Project Wizard opens, as shown in
    Figure A.2.


    NetBeans can create several types of Java projects, but during this book you can
    focus on one type: Java Application.


    For your first project (and most of the projects in this book), choose the project
    type Java Application and click Next. The wizard asks you to choose a name and
    location for the project.'
