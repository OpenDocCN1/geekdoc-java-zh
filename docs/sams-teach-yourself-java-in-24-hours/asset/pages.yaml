    # Summary


    Users have come to expect a point-and-click, visual environment for the programs
    they run. This expectation makes creating software more of a challenge, but Java
    puts these capabilities into your hands with Swing, which provides all the classes
    you need to provide a working, useful GUI—regardless of what kind of setup you''re
    using to run Java programs.


    Developing graphical Java applications with Swing is a good way to get some practice
    working with object-oriented programming. Every component, container, and layout
    manager is represented by its own class of object. Many of them inherit their
    common behavior from the same superclass. For instance, all user interface components
    introduced during this hour are subclasses of `javax.swing.JComponent`.


    During the next hour, you learn more about the design of a GUI as you work with
    new layout managers that can specify the placement of components within a container
    in more sophisticated ways than FlowLayout.'
