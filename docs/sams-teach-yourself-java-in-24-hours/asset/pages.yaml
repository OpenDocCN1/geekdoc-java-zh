  md: "# Writing Android Apps\n\nAlthough you can edit XML directly, don't. There's\
    \ usually no need to do it when creating resources for an Android app.\nThe exception\
    \ is when the Eclipse editor doesn't support something you want to do in defining\
    \ resources. This isn't the case with strings, so it's better to stick to the\
    \ Resources editor. You're more likely to make errors editing the XML files directly.\n\
    \nResources are stored in XML files. The Resources editor is a simple XML editor.\
    \ You can also edit the XML itself. Click the strings.xml tab at the bottom of\
    \ the editor to load this file for direct editing. (Refer to Figure 24.3 where\
    \ this tab is identified.)\n\nHere's what strings.xml looks like at the moment:\n\
    \n# Output\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n \
    \ <string name=\"app_name\">Galuttonondo</string>\n  <string name=\"dummy_button\"\
    >Dummy Button</string>\n  <string name=\"dummy_content\">Galutton Dummy!</string>\n\
    </resources>\n```\n\nThis allows everything in the XML file to be edited, even\
    \ the markup tags. The string element contains a name attribute that identifies\
    \ the name of the resource. The value is enclosed within the tag as character\
    \ data.\n\nTo go back to the Resources editor, click the Resources tab. Click\
    \ the Save button in the Eclipse toolbar to save your change to the file strings.xml.\n\
    \nWith this modification, you're almost ready to run the app.\n\n# Setting Up\
    \ an Android Emulator\n\nBefore you can build an Android app, you must set up\
