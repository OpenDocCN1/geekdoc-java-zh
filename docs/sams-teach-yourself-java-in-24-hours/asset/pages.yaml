  md: '# Chapter 13: Building a Simple User Interface


    Giving the custom component something interesting to requires a quick toe-dip
    into Java file handling, a subject that will be covered at length in Hour 21,
    “Reading and Writing Files.”


    To figure out how much disk space is free on a computer, you need four classes
    in the java.nio.file package, which is employed to access a computer''s file system.


    A Path object represents the location of a file or folder. The Paths class has
    a get(String) method that converts a string to a path matching string. When called
    with "


    ```

    Path current = Paths.get("");

    ```


    Storage information for a disk is represented in Java by a FileStore object, which
    is a file storage pool. After you have a path, you can get the file store where
    that path is located with a method in the Files class. The getFileStore(Path)
    method of Files to retrieve that file store:


    ```

    FileStore store = Files.getFileStore(current);

    ```


    With this, you can now call its getTotalSpace() and getUsableSpace() methods to
    find out how much disk space is available on the current disk:


    ```

    long totalSpace = store.getTotalSpace();

    long freeSpace = store.getFreeSpace();

    double percent = (double)freeSpace / (double)totalSpace * 100;

    ```


    The percentage calculated in the final statement may be an extremely long number
    of digits past the decimal point, such as 64.867539.


    The following expression converts a double percentage to no more than two decimal
    places:


    ```

    percent = (int)(percent * 100) / (double)100;

    ```


    The first half of the expression multiplies the percentage by 100—moving the decimal
    two places to the right—and converts it to an integer, so 64.8675309 becomes 6487.


    The second half divides this by 100—moving the decimal back places to the left—to
    restore an approximation of the percentage. This makes 6486 into 64.86.


    The expression that calculates the percentage includes a lot of references to
    double, which may seem weird. The second and third cast the freeSpace and totalSpace
    variables to double values before they are used in this expression. This is necessary
    to keep the expression from producing an integer value instead of a floating-point
    number. Java determines the data type of an expression''s result by the types
    in the expression. A long divided by an integer 100 would produce a long, not
    the desired percentage.'
