  md: '# Creating an Android App


    FIGURE 24.3

    Editing an Android app''s string resources.


    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_390_0.png)


    Strings and other resources are given a name and a value, just like a variable
    in Java. There are three string resources listed in the Resources elements pane:
    app_name, dummy_button, and dummy_content.


    The names of resources follow three rules:


    +   - They must be all lowercase.

    - They must have no spaces.

    - They must use only the underscore character _ as punctuation.


    Click a string in the Resources elements pane. Name and Value text fields appear
    along with some guidance on how to edit strings.


    The app_name string resource was something you chose when running the New Android
    Project Wizard. The name should match what you gave it earlier, but you can make
    changes at any time by editing this string.


    The dummy_content string contains text to display on the app''s main (and and
    only) screen when it is run. Click the name of this string to bring it up for
    editing.


    In the Value field, enter Saluton Mondoi.'
