    # Q&A


    +   Q. How can I draw arcs that go clockwise rather than counterclockwise?


    +   A. You can accomplish this by specifying the size of the arc as a negative
    number. The arc begins at the same point but goes in the opposite direction in
    an elliptical path. For example, the following statement draws an open arc at
    (35,20) that is 90 degrees long, at the 0 degree mark, goes clockwise, and has
    a height of 20 and a width of 15:


    ```

    Arc2D.Float smile = new Arc2D.Float(15F, 20F, 15F, 20F,

    OF, -90F, Arc2D.Float.OPEN);

    ```


    +   Q. Ellipses and circles don''t have corners. What are the (x,y) coordinates
    specified with the Ellipses.Float constructor method?


    +   A. The (x,y) coordinates represent the smallest x value and smallest value
    of the oval or circle. If you draw an invisible rectangle around it the upper-left
    corner of the rectangle would be the x and y coordinates used as arguments to
    the method.


    +   Q. How can I use XRender with Java?


    +   A. Java supports Java2D graphics with the XRender rendering engine in X11-based
    environments, typically on Linux. This functionality is off by default and must
    be turned on using a command-line option:

    -Daun.java2d.xrender=true. XRender enables Java programs to employ the capabilities
    of modern graphics processing units (GPUs).


    +   In NetBeans, you can set these options by choosing Run, Set Project Configuration,
    Customize. Use the VM Options to set this option and click OK.


    +   Q. Why do photographers ask you to say "cheese"?


    +   A. The word cheese forces your mouth into a smile, as the words whiskey, breeze,
    and money. Words that end with a long "e" generally cause the sides of your lips
    to curl upwards and your teeth to show. Another word that photographers sometimes
    use is grin. Though it doesn''t end in an "e," it contorts the mouth and the meaning
    makes people smile.


