    # Chapter 21: Reading and Writing Files


    output fi


    Java class files are stored as bytes in a form called bytecode. The Java Virtual
    Machine runs bytecode, which doesn''t actually operate the operating language.
    It can run compiled bytecode produced by other languages, including NetRexx and
    Jython. You also hear the JVM referred to as the bytecode


    There are two kinds of streams:


    +   * Input streams, which read data from a source


    +   * Output streams, which write data to a source


    All input and output streams are made up of bytes, individual integers with values
    ranging from 0 to 255. You can use this to format data, such as executable programs,
    word-processing documents, and MP3 music files, but those are only a small sampling
    of what bytes can represent. A byte stream is used to read and write this kind
    of data.


    A more specialized way to work with data is in the form of characters—letters,
    numbers, punctuation, and the like. You can use a character stream when you are
    reading and writing a text file.


    Whether you work with a stream of bytes, characters, or other kinds of information,
    the overall process is the:


    +   * Create a stream object with the data.


    +   * Call methods of the stream to either put information in the stream or take
    information out of it.


    +   * Close the stream by calling the object''s close() method.


    FILES


    # Files


    This example works on a Windows system, which uses the backslash \ character as
    a separator in path and filenames. Linux and other Unix-based systems use a forward
    slash / . To write a Java program that refers to files in a way that works regardless
    of the operating system, use the variable File.pathSeparator instead of forward
    or backslash as in this example:


    In Java, files are represented by the File class, which is also part of the java.io
    package. Files can be read from hard drives, floppy disks, CD-ROMs, and other
    storage devices.


    A File object can represent files that already exist or files you want to create.
    To create a File object, use the name of the file or, as in this example:


    ```

    fileName = new File("address.dat");

    ```


    This creates an object for a named address.dat in the current-folder. You can
    also include a path in the filename:


    ```

    fileName = new File("data\\address.dat");

    ```


    When you have a File object, you can call several useful methods on that:


    ```

    fileName = new File("data");

    ```


    ```

    File.pathSeparator

    ```


    ```

    + "address.dat";

    ```'
