  md: '# HOUR 25: Creating Minecraft Mods with Java


    On each mod project, you must add two Java class libraries before you begin writing
    Java code: the Bukkit and CraftBukkit JAR files downloaded when you installed
    the server. Here''s how to do this:


    +   1. In the Projects pane, right-click the Libraries folder and choose the menu
    command Add Library. The Add Library dialog opens.


    +   2. Click the Create button. The Create New Library dialog opens.


    +   3. In the Library Name field, enter CraftBukkit and click OK. The Customize
    Library dialog opens.


    +   4. Click the Add JAR/Folder button. The Browse JAR/Folder dialog opens.


    +   5. Use the dialog to find and open the folder where you installed the server.
    You will see a file craftbukkit and another that starts with bukkit followed by
    a version number (at the time this was written, it was bukkit-16.6.4-R20, but
    yours will likely be different).


    +   6. Click craftbukkit to select that file.


    +   7. Hold down the Ctrl key and click that bukkit file. Both files now be selected.


    +   8. Add JAR/Folder.


    +   9. Click OK.


    The Projects pane now contains the two JAR files for CraftBukkit in the Libraries
    folder. You''re ready to begin writing the mod program.


    Follow these steps to create the program:


    +   1. Click File, New File. The New File dialog appears.


    +   2. In the Categories pane, choose Java.


    +   3. In the File Types pane, choose Empty Java File; then click Next.


    +   4. In the Class Name field, enter SiameseCat.


    +   5. In the Package field, enter org.cadenhead.minecraft.


    +   6. Click Finish.'
