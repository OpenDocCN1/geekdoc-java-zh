  md: "# # Slowing Down a Program\n\nThe Thread class has a sleep() method that you\
    \ can call in any program that should stop running for a short period of time.\
    \ You often see this technique used in a program that features animation it prevents\
    \ images from being displayed faster than the Java interpreter can handle them.\n\
    \nTo use the sleep() method, call Thread.sleep() with the number of milliseconds\
    \ to pause, as in the following statement:\n\n```\nThread.sleep(5000);\n```\n\n\
    The preceding statement causes the Java Virtual Machine to pause for 5 seconds\
    \ before doing anything else. If for some reason the JVM cannot pause that long,\
    \ an InterruptedException is thrown by the sleep() method.\n\nBecause this exception\
    \ might be thrown, you must deal with it in some manner when using the sleep()\
    \ method. One way to do this is to place the Thread.sleep() statement inside a\
    \ try-catch block:\n\n```\ntry {\n  Thread.sleep(5000);\n} catch (InterruptedException\
    \ e) {\n}\n```\n\nWhen you want a Java program to handle more than one thing at\
    \ a time, you must organize the program into threads. Your program can have as\
    \ many threads as needed, and they can all run simultaneously without affecting\
    \ each other.\n\n# # Creating a Thread\n\nA Java class that can be run as a thread\
    \ is referred to as a runnable (or threaded) class. Although you can use threads\
    \ to pause a program's execution for a few seconds, programmers often use them\
    \ for the opposite reason—to speed up a program. If you put time-consuming tasks\
    \ in their own threads, the rest of the program runs more quickly. This is often\
    \ used to prevent a task from slowing down the responsiveness of a program's graphical\
    \ user interface (GUI)."
  merge: -1
  pgno: 305
- img_proc: true
  md: "For example, if you have written an application that loads stock market price\
    \ data from disk and compiles statistics, the most time-consuming task is to load\
    \ the data. If threads are not used in the application, the program’s interface\
    \ might respond sluggishly as the data is being loaded. This can be extremely\
    \ frustrating to a user.\n\nTwo ways to place a task in its own thread include\n\
    \n+   - Putting the task in a class that implements the Runnable interface\n\n\
    +   - Putting the task in a class that is a subclass of Thread\n\nTo support the\
    \ Runnable interface, the implements keyword is used when the class is created,\
    \ as in in this example:\n\n```\npublic class LoadStocks implements Runnable {\n\
    \  body of the class\n}\n```\n\nWhen a class implements an interface, it indicates\
    \ that the class contains some extra behavior in addition to its methods.\n\n\
    Classes that implement the Runnable interface must include the run() method, which\
    \ has the following structure:\n\n```\npublic void run() {\n  body of the method\n\
    }\n```\n\nThe run() method should take care of the task that the thread was created\
    \ to accomplish. In the stock-analysis example, the run() method could contain\
    \ statements to load data from disk and compile statistics based on that data.\n\
    \nWhen a threaded application is run, the statements in its run() method are not\
    \ executed automatically. Threads can be started and stopped in Java, and a thread\
    \ doesn't begin running until you do two things:\n\n+   - Create an object of\
    \ the threaded class by calling the Thread constructor\n\n+   - Start the thread\
    \ by calling its start() method\n\nThe Thread constructor takes a single argument:\
    \ the object that contains the thread’s run() method. Often, you use the this\
    \ keyword as the argument, which indicates the current class includes the run()\
    \ method."
