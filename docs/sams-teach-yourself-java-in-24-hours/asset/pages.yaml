  md: "# Starting the Thread\n\nIn this program, the runner thread starts when its\
    \ start() method is called.\n\nThe start() method is called as the last statement\
    \ of the constructor.\n\n```\npublic void start() {\n    if (runner == null) {\n\
    \        runner = new Thread(this);\n    }\n    runner.start();\n}\n```\n\nThis\
    \ method starts the runner thread if it is not already started.\n\nThe statement\
    \ runner = new Thread(this) creates a new Thread object with one argument: the\
    \ this keyword. The this keyword refers to the program itself, designating it\
    \ as the class that runs within the thread.\n\nThe call to runner.start() causes\
    \ the thread to begin running. When a thread begins, the run() method of that\
    \ thread is called. Because the runner thread is the LinkRotator application itself,\
    \ the run() method of the application is called.\n\n# Running the Thread\n\nThe\
    \ run() method is where the main work of a thread takes place. In the LinkRotator\
    \ program, the following represents the run() method:\n\n```\npublic void run()\
    \ {\n    Thread thisThread = Thread.currentThread();\n    while (runner == thisThread)\
    \ {\n        current++;\n        if (current > 5) {\n            current = 0;\n\
