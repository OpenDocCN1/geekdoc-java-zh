  md: 'These features work behind the scenes, assuring that when you are expecting
    a simple data type like float, an object is converted to the matching data type
    with the same value. When you''re expecting an object like Float, a data type
    is converted to an object as necessary.

    The following statements show where autoboxing and unboxing come in in handy:


    ```

    Float total = new 1.3F;

    float sum = total / 5;

    ```


    In early versions of java, this code would fail with two errors. The first statement
    assigns a literal float value of 1.3 to a Float object (not allowed), and the
    second statement divides a Float object and assigns it to a float type (not allowed).
    It works perfectly in java now, because the first statement boxes the literal
    into an object and the second unboxes an object to a primitive type. Java automatically
    makes the statements work, resulting in sum being equal to 0.26.


    Earlier in this hour, you saw an example of how to create an Integer object:


    ```

    Integer suffix = new Integer(5309);

    ```


    Because of autoboxing and unboxing, the following statement also does the same
    thing:


    ```

    Integer suffix = 5309;

    ```


    Java recognizes that the int value 5309 is being stored in an Integer object,
    so it is converted automatically.


