  md: '# Organizing Resources


    Creating an Android app requires Java programming, but a lot of the work is done
    in the Eclipse interface. When you are fully versed in the capabilities of the
    Android SDK, you can accomplish a great deal without writing a single line of
    Java code.


    One thing you do without programming is create resources that will be used by
    the app. Every new Android project starts out with several folders where resources
    are placed. To see these folders, expand the Leader folder in the Package Explorer,
    and then expand the /res folder and all its subfolders (as shown in Figure 24.9).


    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_398_0.png)


    Figure 24.9

    Examining an app''s resource folders.


    Resources consist of graphics in the PNG, JPG, or GIF format; strings stored in
    a file called strings.xml; user interface layout files in XML format; and other
    files you can create. Others are colors.xml for colors used in the app and styles.xml
    to define the appearance of user interface components.


    The /res folder of a new project contains folders called drawable-hdpi, drawable-ldpi,
    drawable-mdpi, drawable-xhdpi, and drawable-xxhdpi.**'
