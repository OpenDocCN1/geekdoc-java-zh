    # Sending Arguments to Applications


    You can run Java applications from a command line using java, a program that invokes
    the JVM. NetBeans uses this program behind the scenes when you run programs. When
    a Java program is run as a command, the JVM loads the application. The command
    can include extra items of information, as in this example:


    java TextDisplayer readme.txt /p


    Any extra information sent to a program is called an argument. The first argument,
    if there is one, provided one space after the name of the application. Each additional
    argument also is separated by space. In the preceding example, the arguments are
    readme.txt and /p.


    If you want to put a space inside an argument, you must put quotation marks around
    it, as in the following:


    java TextDisplayer readme.txt /p "Page Title"


    This example runs the TextDisplayer program with three arguments: readme.txt,
    /p, and "Page Title". The quotation marks prevent Page and Title from being treated
    as separate arguments.'
