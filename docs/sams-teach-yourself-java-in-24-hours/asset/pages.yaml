  md: '# Writing a Mod That Can Build Things


    First, a Block object is created that represents the block.


    Next, the block''s setType() method is called with Material.AIR, which is one
    of several dozen values that represent the block can be made of in Minecraft.


    The same technique that''s used to destroy a block by turning it into air can
    be used to build things. The only thing that changes is the type of the material.
    If you had wanted to dig a scoop of the game and turn it into diamond instead
    of air, this statement would be used:


    ```

    current.setType(Material.DIAMOND);

    ```


    When a scoop has been dug from the world, the mod does two things to note the
    accomplishment: A sound is played and a message is sent to the server log.


    Sounds are played by calling a world''s playSound() method with four arguments—the
    sound''s location, type, volume, and pitch:


    ```

    world.playSound(spot, Sound.BURP, 30, 5);

    ```


    As you might have guessed, the sound is a burp. There are dozens of possible sounds
    that could be used.


    A message is logged on the server by calling the Logger object''s info() command
    with the text:


    ```

    log.info("*[IceCream@Scoop] Scooped at " + spot);

    ```


