  md: '# # HOUR 16

    Building a Complex User Interface


    Creating a graphical user interface (GUI) with Swing involves more learning how
    to use the different interface components, layout managers, and event-handling
    methods. You also have to familiarize yourself with everything that Swing offers.

    More than 400 different classes make Swing one of the most extensive class libraries
    in Java. Many of these classes can be implemented using the same techniques you
    have learned during the preceding three hours—Swing containers and components
    share superclasses with each other, which gives them common behavior.

    During this hour, you learn about several additional components that you can use
    in your Swing programs.


    +   THIS HOUR''S TO-DO LIST:

    * Accept a range of numeric input with sliders.

    * Monitor user input on sliders.

    * Create image icons and toolbars.

    * Present data in tables of rows and cells.


    # ## Sliders


    The easiest way to collect numeric input from a user is with a slider, a component
    that can be dragged from side to side or up and down. Sliders are represented
    in Swing by the JSlider class.\Sliders enable a number to be chosen between minimum
    and maximum values. These values can be displayed on a label that includes the
    minimum value, maximum value, and intermediate values. An example you create later
    in this hour is shown in Figure 16.1.'
