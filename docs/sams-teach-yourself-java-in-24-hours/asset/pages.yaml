  md: '# HOUR 1


    # Becoming a Programmer


    You''ve probably heard that computer programming is insanely difficult. It requires
    a degree in computer science, thousands of dollars in computer hardware and software,
    a keen analytical mind, the patience of Job, and a strong liking for caffeinated
    drinks.


    # THIS HOUR''S TO-DO LIST:


    +   Find out the reasons to learn Java.


    +   Discover how programs work.


    +   Select a Java development tool.


    +   Get ready to write your first program.


    Aside from the part about caffeine, you heard wrong. Programming is easier than
    you might think, despite what programmers have been telling people for years to
    make it easier for us to land high-paying jobs.


    This is a great time to learn programming. Countless programming tools are being
    available as free downloads on the Web, and thousands of programmers distribute
    their work as open source so other people can examine how the software was written,
    fix errors, and contribute improvements. Even in a struggling economy, companies
    are hiring programmers.


    It''s a great time to learn Java, because the language is everywhere. Billions
    of mobile devices use Android, an operating system whose apps are all written
    in Java. If you have an Android phone, you''ve been enjoying the work of Java
    programmers every time you look up a movie, rock out on Internet radio, or sling
    an antagonistic avian at poorly built fortress of swine.


    This book aims to teach Java programming to three kinds of people:


    +   1. Nervous novices who never tried to program before


    +   2. Bitter beginners who tried programming but hated it like Lord Voldemort
    hates orphaned British schoolchildren


    +   3. Impatient intellectuals who know another programming language and want
    to get up to speed quickly on Java'
  merge: -1
