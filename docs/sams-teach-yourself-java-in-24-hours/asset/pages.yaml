    # Q&A


    +   Q. How important is it to put the right number of blank spaces on a line in
    a Java program?


    +   A. It''s completely unimportant as far as the computer is concerned. Spacing
    is strictly for the benefit of people looking at a computer program—the Java compiler
    couldn''t care less. You could have written the Solution program without using
    blank spaces or the Tab key to indent lines, and it would compile successfully.


    Although the number of spaces in front of lines isn''t important, you should use
    consistent spacing and indentation in your Java programs. Why? Because spacing
    makes it easier for you to see how a program is organized and to which programming
    block belongs.


    The programs you write must be understandable to other programmers, including
    yourself when you look at the code weeks or months later to fix a bug or make
    an enhancement. Consistency in spacing and indentation are part of what''s called
    a programming style. Good programmers adopt a style and practice it in all their
    work.


    +   Q. A Java program has been described as a class and as a group of classes.
    Which is it?


    +   A. Both the simple Java programs you create during the next few hours are
    compiled into a single file with the extension .class. You can run these with
    the Java Virtual Machine. Java programs also can be made up of a set of classes
    that work together. This topic is fully explored during Hour 10, "Creating Your
    First Object"


    +   Q. If semicolons are needed at the end of each statement, why does the comment
    line // My first Java program goes here not end with a semicolon?


    +   A. Comments are completely ignored by the compiler. If you put // on a line
    in your program, this tells the Java compiler to ignore everything to the right
    of the // on that line. The following example shows a comment on the same line
    as a statement:

    ```

    System.out.println(greeting); // hello, world

    ```


