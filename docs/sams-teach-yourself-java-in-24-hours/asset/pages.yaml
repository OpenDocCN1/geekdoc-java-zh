  md: '# Workshop


    # Q&A


    +   Q. Why are Java applets no longer popular?


    +   A. When the Java language was introduced in the mid-1990s, most people were
    learning the language to write applets. Java was the only way to create interactive
    programs that ran in a web browser. Over the years, alternatives emerged. Macromedia
    Flash, Microsoft Silverlight, and the new web publishing HTML5 standard offers
    ways to put programs on web pages.


    Applets were hampered by poor loading times and slow support for new versions
    of Java by browser developers. The Java Plug-in was introduced to run the current
    version of Java in browsers, but by that time Java had outgrown its origins and
    was a sophisticated general-purpose programming language.


    +   Q. What''s the difference between Java SE (Java Standard Edition) and Java
    EE (Java Enterprise Edition)? Does Java EE cost money?


    +   A. Java Enterprise Edition is an expansion of the Java Standard Edition that
    includes packages to support advanced technology such as Enterprise JavaBeans,
    XML processing, and the development of servlets—Java programs that run on a web
    server. Java EE also includes an application server, a sophisticated environment
    for executing Java software that is tailored for corporations and large organizations
    with heavy computing needs. The Java EE development can be downloaded at no cost
    from Oracle at www.oracle.com/technwork/java/javaee.


    +   Q. What''s a Chris Steak House, and why does Ruth have one?


    +   A. Ruth''s Chris Steak House, the chain of more than 120 upscale steak restaurants
    across the United States and a handful of other countries, has an odd two-first-name
    that reveals its humble origins and the stubborn streak of its founder.


    The chain was founded in 1965 as a solitary New Orleans restaurant owned by Ruth
    Fertel, a single mother of two sons. Fertel saw a classified ad offering a restaurant
    for sale and took out a $22,000 home mortgage to buy it (equivalent to $150,000
    in present dollars).


    She reached a deal to keep the name Chris Steak House with original owner Chris
    Matulich, which had later to relocate after a kitchen fire.'
