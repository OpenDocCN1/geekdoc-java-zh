    353


    The data types referenced in the contract are not Java data types. They''re data
    types that are generalized for use by any programming language that supports SOAP.
    (There''s nothing about web services that''s tailored specifically to Java.)


    Because WSDL contract defines a web service in specific detail, you can use it
    to automate the process of programming web services. The Java Development Kit
    (JDK) includes a command-line tool, wsimport, that takes a WSDL file and writes
    Java classes to access the web service.


    # Creating a Web Service Client


    In this section, you create SquareRootClient, a Java application that can call
    the methods of the web service you just created. The service must, of course,
    be running for the client to connect to.


    Because web service technology like the JAX-WS library supports standards such
    as SOAP, REST, HTTP, and XML, you don''t have to have a Java program to connect
    to the square root service. Perl, Python, Ruby, and other languages have all libraries
    that support web services.


    As stated, a URI does not have to be a working address. Although http://ws.java24hours.com
    looks like it''s used here as a unique identifier. I own the domain name java24hours.com
    and control how its subdomains are used. When I designate http://ws.java24hours.com
    as a URI, I can be reasonably assured that no other web provider would take that
    identification.


    The JAX-WS library offers the Service class in the javax.ws package, a factory
    that creates objects that can call a web service.


    The class Service.create(URL, QName) creates the factory. The arguments are a
    URL object from java.net and a QName from javax.xml.namespace.


    The URL be the address of the web service''s WSDL contract:


    ```

    URL url = new URL("http://127.0.0.1:5335/service/wsdl");

    ```


    The QName is a qualified name, an XML identifier that''s associated with the provider
    of the web service. A qualified name consists of a namespace URI and a local identifier.


    Namespace URIs are similar to URLs but do not necessarily work as a web address.
    Because the package name of the square root web service is com.java24hours.ws,
    which by convention in Java associates it with the Internet host name ws.java24hours.com,
    the namespace URI for this web service is http://ws.java24hours.com.


    The local identifier for the web service is the name of the Service Implementation
    Bean with the word Service appended. Here''s that


    ```

    QName qname = new QName(

    "http://ws.java24hours.com/",

    "SquareRootServiceImpl"

    );

    ```


