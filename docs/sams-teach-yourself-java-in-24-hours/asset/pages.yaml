  md: '# HOUR 25: Creating Minecraft Mods with Java


    You have created your first mod, but it can''t be run yet by CraftBukkit. It needs
    a file called plugin.yml that tells the Minecraft server about the mod.


    This is a text file, which you can also create with NetBeans using these steps:


    +   1. Choose File, New File. The New File dialog opens.

    2. In the Categories pane, choose Other.

    3. In the File Types pane, choose Empty File and click Next.

    4. In the File Name field, enter plugin.yml.

    5. In the Folder field, enter src.

    6. Click Finish.


    A blank file named plugin.yml opens in the source code editor. The text of Listing
    25.3 into the file, and make sure to use the same number of spaces in each line.
    Don''t use Tab characters instead of spaces.


    ```

    LISTING 25.3 The Full Text of This Project''s plugin.yml

    1: name: SiameseCat

    2:

    3: author: Your Name Here

    4:

    5: main: org.cadenhead.minecraft.SiameseCat

    6:

    7: commands:

    8: siamesecat:

    9: description: Spawn a Siamese cat.

    10:

    11: version: 1.0

    ```


    Replace "Your Name Here" with your own name (unless your name is Your Name Here
    already).


    To double-check that you have entered the spaces correctly, there are four spaces
    in Line 8 before the text siamesecat and eight spaces in Line 9 before description.


    The plugin.yml file describes the mod''s name, author, Java class file, version,
    command, and a short description of what the command does.'
