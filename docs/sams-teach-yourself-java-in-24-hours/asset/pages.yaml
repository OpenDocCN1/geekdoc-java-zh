  md: '# Using Components


    # Panels


    The last component you learn to create during this hour is a panel, which is created
    in Swing using the JPanel class. JPanel objects are the simplest kind of container
    available in a graphical user interface. The purpose of JPanel objects is to subdivide
    a display area into different groups of components. When the display is divided
    into sections, you can use different layout managers in each section.


    The following statements create a JPanel object and assign it a layout manager:


    ```

    JPanel topRow = new JPanel();

    FlowLayout flo = new FlowLayout();

    topRow.setLayout(flo);

    add(topRow);

    ```


    Panels are used when arranging the components in an interface, as you see in Hour
    14, "Laying Out a User Interface."


    You add components to a panel by calling its add() method. You can assign a layout
    manager directly to the panel by calling its setLayout() method.


    You also can use panels when you need an area in an interface to draw something,
    such as an image from a graphics file.


    Another convenient use of JPanel is to create your own components that can be
    added to other classes. This is demonstrated in the hour''s final project.


    # Creating Your Own Component


    An advantage of OOP is the capability to reuse classes in different projects.
    For the next project, you create a special panel component that you can reuse
    in other Java programs. The component,

    FreeSpacePanel, reports the disk space on the computer running the application.
    The panel displays the amount of free space, the total space, and the percentage
    that is free.


    The first step in creating your own user interface component is to decide the
    existing component from which to inherit. Your new component will have all of
    its existing attributes and behavior, aside from anything you modify and anything
    new you add.'
