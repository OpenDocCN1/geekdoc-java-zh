  md: '# # APPENDIX D

    Setting Up an Android Development Environment


    Although Android apps are written in Java, they require more than just standard
    Java programming tools. Apps require the Java Development Kit and the Android
    Software Development Kit (SDK), an integrated development environment tailored
    to Android programming. They also require drivers for Android devices.


    Eclipse is the most popular and best-supported integrated development environment
    (IDE) for Android.


    In this appendix, you set up all these tools and make sure they can work together
    to run an Android app. Each of the tools is free and can be downloaded over the
    Internet.


    # ## Getting Started


    You can accomplish Android programming on the following operating systems:


    +   - Windows XP or later

    - Mac OS X 10.5.8 or later

    - Linux


    You must have around 600MB of disk space to install the Android SDK and another
    1.2GB for the Eclipse IDE.


    At this point, you already should have the Java Development Kit installed because
    it was used throughout the hours of the book in conjunction with NetBeans to run
    Java programs. Android requires JDK 6 or later.'
  merge: -1
  pgno: 466
- img_proc: true
  md: '# Setting Up an Android Environment


    If you still need the JDK for some reason, you can download it from http://jdk8.java.net/download.html.


    # Installing Eclipse


    Other IDEs, such as NetBeans, offer Android development support, Eclipse has emerged
    as the most popular choice for writing apps for Android. Android''s developers
    have designated Eclipse as the preferred environment and employ it throughout
    their official documentation and tutorials.


    Eclipse, like NetBeans, provides a graphical user interface for writing Java programs.
    You can use it to create any Java program (and it supports others programming
    languages as well).


    Android requires Eclipse 3.7.2 or later. Using Eclipse to create Android apps
    also requires the Android SDK.


    The easiest way to set things up is to download Eclipse and the SDK at http://developer.android.com/sdk.
    That site offers two versions: the ADT Bundle (Eclipse and the SDK together) and
    SDK Tools (no Eclipse). You can choose the version of the ADT Bundle for your
    operating system (Windows, Mac OS, or Linux).


    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_467_0.png)


    The bundle is packaged as a ZIP file that contains an eclipse folder, an android
    folder, and a program called SDK Manager. There''s no installation program to
    guide you through the process of setting it up on your computer. The eclipse folder
    holds all the files you need to run Eclipse. The android folder contains the Android
    SDK, and SDK Manager is a program you will use to manage the SDK and install new
    versions.


    To create a shortcut in Windows in the folder where you installed the program,
    right-click the Eclipse application file and create Shortcut. A dialog might appear
    asking whether you want the shortcut on your desktop. Click Yes. You can also
    drag a shortcut to the desktop.


    Create an Eclipse subfolder inside the folder where you store your programs. On
    your Windows system, put this in the Program Files (x86) folder. Unzip the eclipse
    and android folders and the SDK Manager and put all three in the eclipse folder.


    After unzipping, go to the eclipse folder you just created and create a shortcut
    to the executable Eclipse application and put it in somewhere else where you use
    programs, such as the desktop or taskbar.'
  merge: -1
  pgno: 467
- img_proc: true
  md: '# Installing the Android Plug-in for Eclipse


    The Eclipse IDE supports numerous programming languages and technologies, but
    all of them are not supported right away. The IDE is enhanced with plug-ins that
    provide the functionality you need.


    The first time you run Eclipse, it must set up a plug-in to integrate the IDE
    with the Android SDK. The plug-in adds menu commands to the IDE interface related
    to Android and makes it possible to create and manage Android apps. For this to
    be accomplished, Eclipse must be run with full administrative privileges on your
    computer. This doesn''t happen by default on Windows 7 or Windows 8, so you can''t
    run the program by clicking it. Instead, right-click its shortcut and choose Run
    as Administrator.


    Eclipse will set up Android automatically and display a welcome screen with a
    New Application button and several links to learn more about Android programming.


    You should periodically check for new updates to both Eclipse and the Android
    SDK. Android is being developed at a furious pace as new phones and other devices
    hit the market, and the SDK must support them.


    Choose the menu command Help, Check for Updates to see whether Eclipse has been
    updated.


    Choose Window, SDK Manager to run the Android SDK Manager, which looks for SDK
    updates. The manager presents checkboxes for the specific things you need to install,
    as shown in Figure D.1.


    Some packages may be chosen for update, which means the manager recommends them.
    Heed that advice. When you have checked the boxes for packages you want and unchecked
    the ones you don''t, click Install Packages.


    After the SDK updates are installed, you may be asked to close the SDK Manager
    and check for Eclipse updates.


    > If the update process fails with any errors, particularly an "access denied"
    problem downloading files, close Eclipse and run it again with full administrative
    privileges. This usually resolves the problem.'
  merge: -1
