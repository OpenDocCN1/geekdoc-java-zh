    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_469_0.png)


    # Setting Up Your Phone


    The Android SDK includes an emulator that acts like an Android phone and can run
    the apps you create. This comes in handy as you''re writing an app, because you
    can get it working in a test environment; however, at some point you need to see
    how it works on an actual Android phone (or other device).


    You can deploy apps you write with the SDK on an Android device over your computer''s
    USB connection. Use the same cord you use to transfer files to and from the device.


    Before connecting the cord, you must enable USB debugging on the phone by these
    steps:


    +   - Run the Settings app on your phone, which is usually one of the apps on
    your Home screen or the full Applications list.

    - Run the Settings app, choose Applications (if necessary), and look for a Development
    or Developer Options button. Choose it, and then select the USB debugging box.'
  merge: -1
  pgno: 469
- img_proc: true
  md: '# Setting Up Your Phone


    Other devices might have this option elsewhere in the settings. It is called something
    like USB connection mode, USB debugging, and the like. The Android site at http://developer.android.com
    has documentation for how to set this for different Android devices.


    Connect the USB cord to your computer and the other end to your phone. A small
    bug-like Android icon should appear along the top edge of the device alongside
    the time and icons for connection bars and the battery.


    Drag the top bar down. You should see the USB Debugging Connected and USB Connected
    messages (see Figure D.2).


    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_470_0.png)


    > NOTE: On Android versions 4.2 and higher, Developer Options might be hidden.
    To make it visible, choose Settings, see About Phone, and tap Build Number seven
    times.


    Figure D.2 Using an Android phone in USB debugging mode.


    This sets up your phone, but your computer also might require configuration to
    connect to the device. If you have never connected to the phone over a USB cord,
    check your phone''s documentation for how to do this. You might need to install
    a driver from a CD that came with the phone or the manufacturer''s website.


    On Windows, the Android SDK runs from within Eclipse, and you can use it to download
    USB drivers for various phones and other devices, and other packages related to
    your device. Choose Window, Android SDK Manager to see what''s available.'
