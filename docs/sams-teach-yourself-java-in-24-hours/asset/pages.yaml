  md: '# HOUR 7

    Using Conditional Tests to Make Decisions


    When you write a computer program, you provide the computer with a list of instructions
    called statements, and these instructions are followed by the letter. You can
    tell the computer to work out unpleasant mathematical formulas, and it works them
    out. Tell it to display some information, and it dutifully responds.


    There are times when you need the computer to be more selective about what it
    does. For example, if you have written a program to balance your checkbook, you
    might want the computer to display a warning message if your account is overdrawn.
    The computer should display this message only if your account is overdrawn. If
    it isn''t, the message would be inaccurate and emotionally upsetting.


    The way to accomplish this task in a Java program is to use a conditional


    When a Java program makes a decision, it does so by employing a conditional statement.
    During this hour, you are checking the condition of several things in your Java
    programs using the conditional keywords =, else, switch, case, and break. You
    also use the conditional operators ==, !=, <, >, >=, and ?, along with boolean
    variables.


    # THIS HOUR''S TO-DO LIST:


    +   - Use the if statement for basic conditional tests.

    - Test whether one value is greater than or less another.

    - Test whether two values are equal or unequal.

    - Use else statements as the opposite of if statements.

    - Chain several conditional tests.

    - Use the switch statement for complicated conditional tests.

    - Create tests with the ternary operator.


    # if Statements


    The most basic way to test a condition in Java is using an if statement. The *if*
    statement tests whether a condition is true or false and takes action only if
    the condition is true.'
