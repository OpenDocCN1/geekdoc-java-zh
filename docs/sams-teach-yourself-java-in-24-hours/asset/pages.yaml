  md: 'This section has introduced the basic syntax of lambda expressions

    wo of the more common ways they will be employed in programs.


    But functional programming in Java is a topic so powerful and

    revolutionary that it''s the subject of entire books.


    At this point, you should be able to recognize lambda expressions

    and use them to implement any single-method interface, also called a

    functional interface.


    # Summary


    Inner classes, anonymous inner classes, and lambda expressions are

    among the most complex parts of the Java language to learn. They

    appeal primarily to programmers who have been writing programs in

    the language for a while and can take advantage of powerful features

    to accomplish more in fewer lines of code.


    But even before you reach a point where you''re writing your own

    lambda expressions, you should be able to benefit from the use of

    inner classes and anonymous inner classes.


    A non-anonymous inner class is structured like a separate helper class,

    but it''s placed inside another class alongside the instance variables,

    class variables, instance methods, and class methods. Unlike a helper

    class, it can access the private variables and methods of the class that

    it is created inside.


    An anonymous inner class removes the need to devote an object to a

    class that''s only used once, such as an event listener attached to a user

    interface component in Swing.


    Lambda expressions are deceptively similar in appearance, requiring

    only a new arrow operator -> to create. But the implications of what

    they enable a Java programmer to do are enormous. Program

    with experience in other languages have been clamoring for this

    functionality for years.'
