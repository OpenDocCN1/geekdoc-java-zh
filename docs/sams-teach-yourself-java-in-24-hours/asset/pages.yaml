  md: '# Handling Errors in a Program


    These errors turn up when you write a Java program that compiles successfully
    but encounters a problem as it runs.


    For example, a common programming mistake is to refer to an element of an array
    that doesn''t exist, as in the following statements:


    ```

    String[] greek = { "Alpha", "Beta", "Gamma" };

    System.out.println(greek[3]);

    ```


    The array greek has three elements. Because the first element of an array is numbered
    0 rather than 1, the first element greek[0], and the third greek[2]. So the statement
    attempting to display greek[3] is erroneous. The preceding statements compile
    successfully, but when you run the program, the Java Virtual Machine halts with
    a message such as the following:


    # Output


    ```

    Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException:

    at SampleProgram.main(SampleProgram.java:4)

    ```


    This message indicates that the application has generated an exception, which
    the JVM noted by displaying an error message and stopping the program.


    The error message refers to a class called ArrayIndexOutOfBoundsException in the
    java.lang package. This class is an exception, an object that represents an exceptional
    circumstance that has taken place in a Java program.


    When a Java class encounters an exception, it alerts the user of the class to
    the error. In this example, the class is the JVM.


    All exceptions are subclasses of Exception in the java.lang package. The ArrayIndexOutOfBoundsException
    does what you expect—it reports that an array element has been accessed outside
    the array''s boundaries.


    There are hundreds of exceptions in Java. Many such as the array exception indicate
    a problem that can be fixed with a programming change. These are comparable to
    compiler errors—after you correct the situation, you do not have to concern yourself
    with the exception any longer.


    Two terms are used to describe this process: throw and catch. Objects throw exceptions
    to alert other objects that they have occurred. These exceptions are caught by
    other objects or the Java Virtual Machine.


    Other exceptions must be dealt with every time a program runs using five new keywords:
    try, catch, finally, throw, and throws.'
