  md: '# HOUR 22

    Creating Web Services with JAX-WS


    Now that the Internet is everywhere, driving billions of desktop computers, web
    servers, phones, videogame consoles, and other devices, the desire to connect
    them all together given rise to web services, software that communicates with
    other software over HTTP, the protocol of the Web.


    An innovative way to make some of these connections is by using the Java API for
    XML Web Services (JAX-WS). JAX-WS is a set of packages and classes that create
    clients that make requests of web services and services that take those requests.


    JAX-WS supports web services that are implemented using the Simple Object Access
    Protocol (SOAP) and Representational State Transfer (REST). JAX-WS greatly simplifies
    the task of supporting these protocols. As a programmer, you create Java objects
    and call methods to use web services, and the rest is taken care of behind the
    scenes.


    +   ###

    * Define a Java interface for a web service.

    * Apply this interface to a Java class.

    * Deploy a web service on the Internet.

    * View a web service contract.

    * Create a web service client.


    # Defining a Service Endpoint Interface


    The first step in the creation of a JAX-WS web service is to create a Service
    Endpoint Interface, a Java interface that defines the methods that clients can
    call when they are using the web service.


    The SquareRootServer web service you are developing this hour is a service that
    can handle two simple tasks:


    +   * Calculating the square root of a number

    * Displaying the current date and time'
