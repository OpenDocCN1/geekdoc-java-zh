    # Q&A


    +   Q. Can classes inherit from more than one class?


    +   A. It''s possible with some programming languages (such as C++), but not Java.
    Multiple inheritance is a powerful feature, but it also makes OOP a bit harder
    to learn and use. Java''s developers decided to limit inheritance to one superclass
    for any class, although a class can have numerous subclasses. One way to compensate
    for this limitation is to inherit methods from a special type of class called
    an interface. You learn more about interfaces during Hour 19, "Creating a Threaded
    Program."


    +   Q. When would you want to create a method that isn''t public?


    +   A. The main time you would not want to make a method available to other programs
    is when the method is strictly for the use of one program you''re writing a game
    program and the shootRayGun() method is highly specific to the game you''re writing,
    it could be a private method. To keep a method from being public, leave the public
    statement in front of the method''s name.


    +   Q. Why is it possible to use char values as if they are int values?


    +   A. A character can be used as an int variable because each character has a
    corresponding numeric code that represents its position in the character set.
    If you have a variable named k with the value 67, the cast (char)k produces the
    character ''C'' because the numeric code associated with a capital C is 67, according
    to the ASCII character set is part of the Unicode character standard adopted by
    the Java language.


