  md: '# # HOUR 17

    # Storing Objects in Data Structures


    Programmers are hoarders.


    In computer programming, you spend a lot of time collecting information and looking
    for a place to store it. The information can come in the form of a primitive data
    type, such as a float or as an object of a particular class. It can be read from
    disk, retrieved from an Internet server, or entered by a user, or gathered through
    other methods.


    After you have the information, you must decide where to put it while a program
    is running in the Java Virtual Machine. Several items that are related to each
    other by data type or class can be stored in an array.


    This is sufficient for many purposes, but as your programs grow in sophistication,
    your needs as a hoarder will increase.


    During this hour you will learn about classes in Java that are designed for information
    hoarders: array lists and hash maps.


    # THIS HOUR''S TO-DO LIST:


    +   - Create an array list.

    - Add and remove items from the list.

    - Use generics to improve list reliability.

    - Search a list for an object.

    - Loop through the contents of a list.

    - Create a hash map of keys and values.

    - Add and remove items from the map.

    - Retrieve a map entry''s key.

    - Retrieve a map entry''s value.

    - Loop through the keys and values of a map.


    # ## Array Lists


    In Hour 9, “Storing Information with Arrays,” you were introduced to arrays, an
    extremely handy way to work with groups of variables and objects in programs.
    Arrays are so essential to Java that they are a built-in data type like integers
    and characters. An array packages elements of the same data type or class.


    As useful as arrays can be, they are limited by the fact that the size of an array
    does not change. After an array is created to hold 90 elements, it can''t be altered
    to hold more or fewer. The size is fixed. (The fancy way of saying this is to
    call the array "immutable.\'')'
