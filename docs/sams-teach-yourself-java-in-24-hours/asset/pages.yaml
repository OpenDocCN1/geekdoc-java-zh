    # Operator Precedence


    When you are using an expression with more than one operator, you need to know
    what order the computer uses as it works out the expression. Consider the following
    statements:


    ```

    int y = 10;

    x = y * 3 + 5;

    ```


    Unless you know what order the computer uses when working out the math in these
    statements, you cannot be sure what the x variable will be set to. It could be
    set to 35 or 80, depending on whether y * 3 + 5 is evaluated first.


    The following evaluation order is used when working out an expression:


    +   * Incrementing and decrementing take place first.

    * Multiplication, division, and modulus division occur next.

    * Addition and subtraction follow.

    * Comparisons take place next.

    * The equal sign (= is used to set a variable''s value.


    Because multiplication takes place before addition, you can revisit the previous
    example and come up with the answer: y is multiplied by 3 first, which equals
    30, and 5 is added to.


    Comparisons are discussed during Hour 7. The rest has been described during this
    hour, so you should be able to figure out the result of the following statements:


    ```

    int x = 5;

    int number = x++ * 6 * 4 * 10 / 2;

    ```


