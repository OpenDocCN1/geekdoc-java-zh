  md: '# HOUR 5: Storing and Changing Information in a Program


    The difference between prefixed and postfixed operators becomes important when
    you use the increment and decrement operators inside an expression.


    Consider the following statements:


    ```

    int x = 3;

    int answer = x++ * 10;

    ```


    What does the answer variable equal after these statements are handled? You might
    expect it to equal 40—which would be true if 3 was incremented by 1, which equals
    4, and then 4 was multiplied by 10.


    However, answer ends up with the value 30 because the postfixed operator was used
    instead of the prefixed operator.


    When a postfixed operator is used on a variable inside an expression, the variable''s
    value doesn''t change until after the expression has been evaluated. The statement
    int answer = x++ * 10 does the same thing in the same order as the following two
    statements:


    ```

    int answer = x * 10;

    x++;

    ```


    The opposite is true of prefixed operators. If they are used on a variable inside
    an expression, the variable''s value changes before the expression is evaluated.


    Consider the following statements:


    ```

    int x = 3;

    int answer = ++x * 10;

    ```


    This result in the answer variable being equal to 40. The prefixed operator causes
    the value of the x variable to be changed before the expression is evaluated.
    The statement int answer = ++x * 10 does the same thing, in order, as these statements:


    ```

    x++;

    int answer = x * 10;

    ```


    It''s easy to become exasperated with the ++ and -- operators because they''re
    not as straightforward as many of the concepts you encounter in this book.'
