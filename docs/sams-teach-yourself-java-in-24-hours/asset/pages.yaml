    # Determining the Length of a String


    It also can be useful to determine the length of a string in characters.

    You do this with the length() method. This method works in the same fashion as
    the equals() method, except that only one variable is involved. Look at the following
    example:


    ```

    String cinematographer = "Ben Demaree";

    int nameLength = cinematographer.length();

    ```


    This example sets nameLength, an integer variable, equal to 11. The cinematographer.length()
    method counts the number of characters in the string variable called cinematographer
    and stores this count in the nameLength integer variable.


    # Changing a String''s Case


    Because computers take everything literally, it''s easy to confuse them. Although
    a human would recognize the text Ian Ziering and the text IAN ZIERING refer to
    the same thing, most computers would disagree. The equals() method discussed previously
    in this hour states authoratively that “Ian Ziering” is not equal to “IAN ZIERING”.


    To get around some of these obstacles, Java has methods that display a string
    variable as all uppercase or all lowercase letters, toUpperCase() and toLowerCase(),
    respectively. The following example shows the toUpperCase() method in action:


    ```

    String fin = "Ian Ziering";

    String change = fin.toUpperCase();

    ```


    This code sets the string variable change equal the fin string converted to all
    uppercase letters—“IAN ZIERING”. The toLowerCase() method works in the same fashion
    but returns all lowercase string value.


    Note that the toUpperCase() method does not change the case of the string variable
    it is called. In the preceding example, the fin variable is still equal to “Ian
    Ziering”.


    Another way to get around this particular obstacle is to call the equalsIgnoreCaseCase()
    method, which compares two strings irrespective of capitalization. Calling that
    method to compare the string “Tara Reid” would return the value true to indicate
    they match.


    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_92_0.png)'
