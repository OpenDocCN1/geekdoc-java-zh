  md: 'Security is important because of the way Java programs work when they are placed
    on a web page. The Java programs you try during this hour are downloaded to your
    computer. When the program is finished downloading, it runs on your computer.


    Unless you know a whole lot of people, most web pages you visit are published
    by strangers. In terms of security, running their programs isn''t a lot different
    than letting the general public come over and borrow your computer. If the Java
    language did not have safeguards to prevent abuse, its programs could introduce
    viruses onto your system, delete files, play the spoken-word song performances
    of William Shatner, and do other unspeakable things.


    Java includes several kinds of security to make sure that its programs are safe
    when run from web pages. The main security is provided by restrictions on Java
    applets running over the Web:


    +   - No applet can open, read, write, or delete files or system properties on
    the user''s computer.


    +   - No applet can run other programs on the user''s computer.


    +   - All windows created by the applet are identified clearly as Java windows.


    +   - Applets cannot make connections to websites other than the one that hosted
    them.


    +   - All applets are verified to make sure that nothing was modified after they
    were compiled.


    The language generally has been considered safe enough to be usable over the Web,
    but security holes exploited in recent years have some security experts to recommend
    that users turn off Java entirely in their browsers. To address these concerns,
    Oracle provides a Java update with the Java Plug-in to ensure that exploits are
    discovered, the language can be upgraded to stop them.


    The Java language also offers a more flexible security policy for programs that
    run in a browser. You can designate some companies and programmers as trusted
    developers, which enables their Java applets to run in your browser without the
    restrictions that normally would be in place.


    This system of trust is established through the use of signed applets that have
    digital signatures, files that clearly identify the author of'
