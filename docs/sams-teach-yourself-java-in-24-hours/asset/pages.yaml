  md: '# Workshop


    # Q&A


    Q. How does XML-RPC fit in with SOAP web services?


    A. XML-RPC is a protocol for calling methods and receiving data in an XML format
    over HTTP, the protocol of the Web. SOAP is all those things as well, and in fact
    the two web service protocols share a common origin. XML-RPC was created from
    a draft version of the protocol that eventually became SOAP. Because XML-RPC was
    out first and is simpler to implement, it developed its own following and remains
    popular today. The Apache XML-RPC Java library, available from http://xml.apache.org/xmlrpc/,
    supports the creation of web services and clients that employ XML-RPC. SOAP''s
    a more sophisticated web service protocol does that support a wider range of client/service
    interactions.


    Q. I''m not clear on why a package com.java24hours.ws is associated with the Internet
    host ws.java24hours.com. How does that work?


    A. Java package names are chosen by the programmers who developed the package.
    Oracle starts the names of Java packages from the Java Class Library with either
    java or javax, as java.util and java.swing. When other programmers create a package,
    they follow a convention that prevents them from choosing the same package name
    and being confused with each other.


    The convention is to choose a package name that''s based on something the entity
    owns—a domain name—and reverse it so the last part comes first. As the owner of
    the domain name caden.org, I''ve created Java classes with package names that
    begin with org.caden.web as org.caden.web. The Apache Software Foundation, which
    owns apache.org, calls its XML-RPC package org.apache.xmlrpc.


    Q. What was the first website on the Internet?


    A. The first site was http://info.cer.ch, which is still today. Tim Berners-Lee,
    a British physicist at the European Organization for Nuclear Research (CERN),
    used the site to describe his new invention, the Wide Web.


    The first web page was at http://info.cer.ch/hypertext/WWW/TheProject.html was
    updated daily as the Web attracted interested users, publishers, and showed developers.


    The site defined the Web as a "wide-area hypermedia information retrieval initiative
    aiming to give universal access to a large universe of documents."'
