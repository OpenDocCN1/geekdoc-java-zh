  md: '# # Workshop


    # Q&A


    Q. Why are some of the text fields in the LottoMadness application shaded in gray
    while others are white?


    A. The `setEditable()` method has been used on the gray fields to make them impossible
    to edit. The default behavior of a text field is to enable users to change the
    value of the text field by clicking within its borders and typing any desired
    changes. However, some fields are intended to display information rather than
    take input from the user. The `setEditable()` method prevents users from changing
    a field they should not modify.


    Q. Was there really Willy Wonka golden ticket winner in Willy Wonka and the Chocolate
    Factory whose death was too horrible for the movie?


    A. The fate of Miranda Piker was so gruesome that she was dropped from the final
    draft of Roald Dahl''s book *Charlie and the Chocolate Factory*, which inspired
    the 1971 movie and its 2005 remake. Piker was a smug who believed children should
    never play so they could attend school all the time. Her father was a school headmaster.


    Piker and the other kids at Wonka''s factory are introduced to Spotty Powder,
    a sugary confection that causes the eater to break out in red spots so they can
    feign and miss school. Piker and her father became outraged and decided to destroy
    the machine that makes it.


    As their screams are heard from the adjacent room, Wonka explains that they''ve
    gone into the place where the candy''s ingredients are ground into powder. "That''s
    part of the recipe," he tells Miranda''s mother. "We''ve got to use one or two
    schools occasionally or it doesn''t work."


    The Oompa-Loompas celebrate their debut with song: "Oh, Mary Piker,/How could
    anyone like her,/Such a priggish and revolting little kid./So we said,''Why don''t
    we fix/In the Spotty-Powder mixer/Then we''re bound to like her better than we
    did.\''/Soon this child is so vicious/Will have gotten delicious,/And her classmates
    will have surely understood/That instead of saying, ''Miranda!/Oh, the beast!/We
    cannot stand her!/They''ll be saying, ''Oh, how useful and how good!""'
