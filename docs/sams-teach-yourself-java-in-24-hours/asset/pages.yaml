  md: '# Workshop


    # Q&A


    +   Q. I made an enormous mess of my server''s world with the IceCreamScoop mod.
    How can I start over?


    +   A. The Minecraft server makes it easy to create a new world from scratch or
    switch from one world to another.


    To start over and delete the old world, stop the server, open the Minecraft server''s
    folder, and delete the world subfolder. When you start the server, Minecraft figures
    out the world is gone and creates a new one. This process is a little slower than
    usual. The server log explains what it is doing.


    To switch to a new world while keeping the old one, stop the server and rename
    the world subfolder to something else. The server will build a new world, and
    you can switch back to the old one by editing the server.properties file in the
    server''s main folder.


    If you named the original world2, you can switch back this way: Open the file
    server.properties with any text editor and change the line level-name=world to
    level-name=world2. Save the file and restart the server.


    # Quiz


    Test whether you''re made of the right material by answering the following questions
    about Minecraft mod programming.


    +   1. What is the superclass of all mods created for a Minecraft server that
    uses CraftBukkit?


    A. Player

    B. JavaPlugin

    C. Mod


    +   2. What class is used to create a special effect and apply it to a mob?


    A. Type

    B. Effect

    C. Potion'
