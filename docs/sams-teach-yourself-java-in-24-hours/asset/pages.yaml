  md: '# Writing Data to a Stream


    You can create a FileOutputStream in two ways. If you want to append bytes to
    an existing file, call the FileOutputStream() constructor with two arguments:
    a File object representing the file and the boolean true. The bytes you write
    to the stream are tacked onto the end of the file.


    If you want to write bytes into a new file, call the FileOutputStream() constructor
    with a File object as its only object.


    After you have an output stream, you can call different write() methods to write
    bytes to:


    +   - Call write() with a byte as its only argument to write that byte to the
    stream.


    +   - Call write() with a byte array as its only argument to write all the array''s
    bytes to the stream.


    +   - Specify three arguments to the write(byte[], int, int) method: a byte array,
    an integer representing the first element of the array to write to the stream,
    and the number of bytes to write.


    The following statement creates a byte array with 10 bytes and writes the last
    5 to an output stream:


    ```

    File dat = new File("data.dat");

    FileOutputStream datStream = new FileOutputStream(dat);

    byte[] data = new byte[] { 5, 12, 4, 13, 3, 15, 2, 17, 1, 18 };

    datStream.write(data, 5, 5);

    ```


    When writing bytes to a stream, you can convert that to an array of bytes by calling
    the String object''s getBytes() method, as in this example:


    ```

    String name = "Puddin N. Tane";

    byte[] nameBytes = name.getBytes();

    ```


    After you have finished writing bytes to a stream, you should close it by calling
    the stream''s close() method.


