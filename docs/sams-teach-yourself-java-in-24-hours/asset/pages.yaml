  md: '# Exploring a New Android Project


    A new Android project consists of about 20 files and folders that always are organized
    the same way in an Android app. There might be more files you add depending on
    the capabilities of the app, but these starting files and folders always must
    be present.


    Figure 24.2 shows the Eclipse Package Explorer after a new Android project has
    been created.


    FIGURE 24.2

    Viewing the parts of an Android project.


    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_388_0.png)


    You can use the folder to explore the file and folder structure of the project.
    The new SalutonMondo app starts out with the following components:


    +   - /src folder—The root folder for the app’s Java source code.

    - /src/org.cadenhead.android/SalutonActivity.java—The class for the activity that
    launches by default when the app is run.

    - /gen folder—The folder for generated Java source code that you do not edit manually.

    - /gen/org.cadenhead.android/R.java—The automatically generated resource management
    source code for the app. (Never edit this!)'
  merge: -1
  pgno: 388
- img_proc: true
  md: '# Writing Android Apps


    +   /assets—The folder for resources that will not be compiled into the app.


    +   /res—The folder for application resources such as strings, numbers, layout
    files, graphics, and animation. There are subfolders for specific resource types:
    layout, three values folders, and five drawable folders.


    +   AndroidManifest.xml—The app''s primary configuration file.


    +   default.properties—A build file generated by the Android Plugin in that you
    should not edit.


    +   project.properties—A configuration file for the project that automatically
    is generated and must not be edited manually.


    These files and folders form the application framework. The first thing you undertake
    as an Android programmer is to learn how to modify the framework so you can discover
    what each component can accomplish.


    There are additional files that are added to the framework to suit specific purposes.


    # Creating an App


    Although you haven''t done anything to it yet, you could successfully run the
    new Android project. The framework functions as a working app.


    Because there''s no fun in that, you will customize the Saluton Mondo app to offer
    the traditional computer programming greeting "Saluton Mondo!"


    In Hour 2, “Writing Your First Program,” you displayed the text “Saluton Mondo!”
    as a string by calling the method System.out.println().


    Android apps display strings that have been stored first in a resource file called
    strings.xml. You can find this file in the /res/values folder.


    Use the Package Explorer to navigate to this folder. Double-click strings.xml.
    A Resources editor opens, as shown in Figure 24.3.'
