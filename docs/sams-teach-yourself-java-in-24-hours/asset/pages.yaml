    Each chart has things that make it different from other objects. Pie charts are
    circular, whereas bar graphs represent data as a series of rectangles. If you
    break down computer programs in the same way a pie chart is broken down, you''re
    engaging in OOP.


    In OOP, an object contains two things: attributes and behavior. Attributes are
    things that describe the object and show how it is different from other objects.
    Behavior is what an object does.


    You create objects in Java by using a class as a template. A class is a master
    copy of the object that determines the attributes and behavior an object should
    have. The term class should be familiar to you because Java programs are called
    classes. Every program you create with Java is a class that you can use as a template
    for creating new objects. As an example, any Java program that uses strings is
    using objects created from the class. This class contains attributes that determine
    what a String object is and behavior that controls what String objects can do.


    With OOP, a computer program is a group of objects that work together to get something
    done. Some simple programs might seem as though they consist of only one object:
    the class file. However, even those programs are using other objects to get work
    done.


