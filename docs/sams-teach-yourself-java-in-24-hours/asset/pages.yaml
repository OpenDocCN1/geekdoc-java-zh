  md: "Closures, which are also called lambda expressions, allow an object with a\
    \ single method to be created with only an -> operator, as long as other conditions\
    \ are met.\n\nHere's an example:\n\n```\nRunnable runner = () -> { System.out.println(\"\
    Run!\"); };\n```\n\nThis single line creates an object that implements the Runnable\
    \ interface and makes its run() method equivalent to the following code:\n\n```\n\
    void run() {\n  System.out.println(\"Run!\");\n}\n```\n\nIn a lambda expression,\
    \ the statement to the right of the arrow operator -> becomes the method that\
    \ implements the interface.\n\nThis can be done only when the interface has a\
    \ single method, such as Runnable, which just contains run(). An interface in\
    \ Java that has one method is now called a functional interface.\n\nA lambda expression\
    \ also has something to the left of the arrow operator. In the first example,\
    \ it's an empty set of parentheses, and it refers to the arguments sent to the\
    \ method of the functional interface. Since run() takes no arguments in the Runnable\
    \ interface, no arguments are required in the expression.\n\nHere's a second example\
    \ of a lambda expression that puts something in those parentheses:\n\n```\nActionListener\
    \ al = (ActionEvent act) -> {\n  System.out.println(act.getSource());\n}\n```\n\
    \nThis is equivalent to the following code in an object that implements the ActionListener\
    \ interface in the java.awt.event package:\n\n```\npublic void actionPerformed(ActionEvent\
    \ event) {\n  System.out.println(event.getSource());\n}\n```\n\nThe ActionListener\
    \ interface receives events, such as when a user clicks a button. The only method\
    \ in the functional interface is actionPerformed(ActionEvent). The argument is\
    \ an ActionEvent object that describes the user action that triggered the event."
  merge: -1
