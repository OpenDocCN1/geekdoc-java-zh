  md: 'There are several layout managers you can use to affect how components are
    shown. The default manager for panels is the FlowLayout class in the java.awt
    package, which was used during the previous hour.


    Under FlowLayout, components are dropped onto an area in the same way they are
    organized on a page in English—from left to right and then down to the next line
    when there’s no space.


    The following example could be used in a frame so that it employs flow layout
    when components are added:


