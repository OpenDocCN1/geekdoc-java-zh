  md: "# Putting One Class Inside Another\n\nWhen you divide a program into multiple\
    \ classes, there are two ways to define the helper classes. One way is to define\
    \ each class separately, as in the following example:\n\n```\npublic class Wrecker\
    \ {\n    String author = \"Ignoto\";\n\n    public void infectFile() {\n     \
    \   VirusCode vic = new VirusCode(1024);\n    }\n}\n\nclass VirusCode {\n    int\
    \ vSize;\n\n    VirusCode(int size) {\n        vSize = size;\n    }\n}\n```\n\n\
    In this example, the VirusCode class is a helper class for the Wrecker class.\
    \ Helper classes are often defined in the same source code file as the class they\
    \ are assisting. When the source file is compiled, multiple class files are produced.\
    \ The preceding example produces the files Wrecker.class and VirusCode.class when\
    \ compiled.\n\nIf more than one same class is defined in the same source file,\
    \ only one of the classes can be public. The other classes should not have public\
    \ in their class statements. The name of the source code file must match the public\
    \ class that it defines.\n\nWhen creating a main class and a helper class, you\
    \ can also put the helper inside the main class. When this is done, the helper\
    \ class is called an inner class.\n\nYou place an inner class within the opening\
    \ bracket and closing bracket of another class:\n\n```\npublic class Wrecker {\n\
    \    String author = \"Ignoto\";\n\n    public void infectFile() {\n        VirusCode\
    \ vic = new VirusCode(1024);\n    }\n}\n\nclass VirusCode {\n    int vSize;\n\n\
    \    VirusCode(int size) {\n        vSize = size;\n    }\n}\n```"
