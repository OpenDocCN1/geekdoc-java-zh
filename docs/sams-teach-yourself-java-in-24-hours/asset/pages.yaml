    # A Brief History of Java


    Bill Joy, one of the executives at Sun Microsystems when the company created Java,
    called the language “the end result of 15 years of work to produce a better, more
    reliable way to write computer programs.” Java’s creation was a little more complicated
    than that.


    Java was developed in 1990 by James Gosling as a language that would serve as
    the brains for smart appliances (interactive TVs, omniscient ovens, time-traveling
    Terminators, Skynet satellites that enslaved mankind, and Gosling was unhappy
    with the results he was getting by writing programs with a programming language
    C++. In a burst of inspiration, he hoped in his office and wrote a new language
    to suit his needs.


    Gosling named his new language Oak after a tree he could see from his office window.
    Java was the part of Gosling''s strategy to make a fortune when interactive TV
    became a million-dollar industry. That still hasn’t happened today (though Netflix,
    Hulu, and others are making a game attempt), but something completely different
    took place for Gosling''s new language. Just as Oak was to be scrapped, the Web
    became popular.


    In a fortuit circumstance, many qualities that made Gosling''s language good on
    his appliance project made it suitable for adaptation to the Web. His team devised
    a way for programs to be run safely from web pages, and a catchy new name was
    chosen to accompany the language’s new purpose: Java.


    Although Java can be used for many other things, the Web provided the original
    showcase it needed to seize the attention of the world’s software developers.
    When the language rose to prominence, you had to be in solitary confinement or
    a long-term orbital mission to avoid hearing about it.


    There have been nine major releases of the Java language, each with some essential
    new features. Here are the first eight:


    +   - Java 1.0—The original release (1995)


    +   - Java 1.1—Java Database Connectivity (JDBC), improved graphical user interfaces


    Oracle includes the Java Plug-in with the JDK and other products, so it might
    already be installed on your computer. If you are not sure Java is installed,
    visit the www.java.com website. The “Do I have Java?” link can detect the presence
    of Java. If it’s not found, you will be offered a chance to download it.


    You might have heard that Java is an acronym that stands for Just Another Virtual
    Acronym. You might also have heard that Java was named for Gosling''s favorite
    of coffee.


    The story behind Java’s naming contains no secrets or declarations of liquid love.
    Java was chosen as the name for the same reason that the comedian Jerry Seinfeld
    likes to say: It just sounds good.'
