  md: "# UR 11: Describing Your Object Is Like\n\nInner classes enable some complex\
    \ programming techniques in Java that will make sense after you have more experience\
    \ with the language. Nine more hours, to be precise. This book gets back to the\
    \ subject in Hour 20, \"Using Inner Classes and Closures\"\n\nYou can use an inner\
    \ class in the same manner as any other kind of helper class. The main difference—other\
    \ than its location—is what happens after the compiler gets through with these\
    \ classes. Inner classes do not get the name indicated by their class statement.\
    \ Instead, the compiler gives them a name that includes the name of the main class.\n\
    \nIn the preceding example, the compiler produces Wrecker.class and Wrecker$Virus.class.\n\
    \n# Using this Keyword\n\nBecause you can refer to variables and methods in other\
    \ classes with variables and methods in your own classes, the variable you're\
    \ referring to can become confusing in some circumstances. One way to make things\
    \ more clear is with this statement—a way to refer within a program to the program's\
    \ own object.\n\nWhen you use an object's methods or variables, you put the name\
    \ of the object in front of the method or variable name, separated by a period.\
    \ Consider these examples:\n\n```\nVirus chickenpox = new Virus();nchickenpox.author\
    \ = \"LoveHandles\";nchickenpox.setSeconds(75);\n```\n\nThese statements create\
    \ a new Virus object called chickenpox, set the variable name of chickenpox, and\
    \ then call the setSeconds() method of chickenpox.\n\nThere are times in a program\
    \ when you need to refer to the current object—in other words, the object represented\
    \ by the program itself. For example, inside the Virus class, you might have a\
    \ method that has its own variable called author:\n\n```\npublic void checkAuthor()\
    \ {\n  String author = null;\n}\n```\n\nIn this example, a variable called author\
    \ exists within the scope of the checkAuthor() method, but it isn't the same variable\
    \ as an object called author. If you want to refer to the current object's variable,\
    \ you have to use the this statement, as in the following:\n\n```\nSystem.out.println(this.author);\n\
    ```"
