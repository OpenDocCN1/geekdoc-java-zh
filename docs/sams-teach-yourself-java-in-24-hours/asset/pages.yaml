  md: '# Laying Out a User Interface


    GridLayout places all components as they are added into a place on a grid. Components
    are added from left to right until a row is full, and then the leftmost column
    of the next grid is filled.


    The following statements create a container and set it to use a grid layout that
    is two rows wide and three columns tall:


    ```

    GridLayout grid = new GridLayout(2, 3);

    setLayout(grid);

    ```


