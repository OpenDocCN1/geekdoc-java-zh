    # Buttons


    One simple component you can add to a container is a JButton object. JButton,
    like the other components you are working with during this hour, is part of the
    java.awt.swing package. A JButton object is a clickable button with a label that
    describes the button it does. This label can be text, graphics, or both. The following
    statement creates a JButton okButton and gives it the text label OK:


    ```

    JButton okButton = new JButton("OK"

    ```


    After a component such as JButton is created, it should be added to a container
    by calling its add() method:


    ```

    add(okButton);

    ```


    When you add components to a container, you do not specify the place in the container
    where the component should be displayed. The arrangement of components is decided
    by an object called a layout manager. The simplest of these managers is the FlowLayout
    class, which is part of the java.awt package.


    To make a container use a specific layout manager, you must first create an object
    of that layout manager''s class. You can create a FlowLayout object by calling
    its constructor with no arguments:


    ```

    FlowLayout flo = new FlowLayout();

    ```


    After you create a layout manager, you call the container''s setLayout method
    to associate the specified manager with that container:


    ```

    setLayout(flo);

    ```


    This statement designates the flo object as the layout manager.


