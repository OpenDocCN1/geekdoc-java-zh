  md: '# Streams


    +   - exists()--true if the file exists, false otherwise

    - getName()--The name of the file, as a String

    - length()--The size of the file, as a long value

    - createFile()--Creates a file of the same name, if one does not exist already

    - delete()--Deletes the file, if it exists

    - renameTo(File)--Renames the file, using the name of the File object specified
    as an argument


    You can use a File object to represent a folder on your system rather than a file.
    Specify the folder name in the File constructor, which can be absolute (such as
    C:\MyDocuments\) or relative (such as java\database).


    After you have an object representing a folder, you can call its listFiles() method
    to see what''s inside the folder. This method returns an array of File objects
    representing every file and subfolder it contains.


    # Reading Data from a Stream


    The first project of the hour is to read data from a file using an input stream.
    You can use this FileInputStream class, which represents input streams that are
    bytes from a file.


    You can create a file input stream by specifying a filename or a File object as
    the argument to the FileInputStream() constructor.


    Methods that read or write files can fail with an IOException if there''s an error
    accessing the file. Many of the methods associated with reading and writing files
    generate this exception, so a try-catch block is often used.


    Streams are one of the resources in Java that must be closed when they are no
    longer needed. Leaving a stream open is a significant drain on resources in the
    Java Virtual Machine as a program runs.


    A special try statement try-with-resources makes it easy to ensure that a resource,
    such as a file input stream, will be closed when it''s no longer needed. The try
    statement is followed by parentheses. Inside the parentheses are one or more Java
    statements that declare variables that read or write data through a resource.'
