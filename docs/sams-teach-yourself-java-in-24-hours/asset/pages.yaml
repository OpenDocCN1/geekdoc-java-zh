    tops, so for the moment this variable is an empty storage space. The int text
    at the beginning of the statement designates as a variable that is used to store
    integer numbers. You can use the int type to store most of the nondecimal numbers
    you need in your computer programs. It can hold any integer ranging from around
    -2.14 billion to 2.14 billion.


    Add a blank line after the int tops statement and enter the following statement:


    ```

    float gradePointAverage;

    ```


    This statement creates a variable with the name gradePointAverage. The float text
    stands for floating-numbers. Floating-point variables are used to store numbers
    that might contain a decimal point.


    The float variable type holds decimal numbers up to 38 figures. The double type
    holds decimal numbers up to 300 figures.


    # Characters and Strings


    Because the variables you have dealt with so far are numeric, you might have the
    impression that all variables are used to store numbers. Think again. You can
    also use variables to store text. Two types of text can be stored as variables:
    characters and strings. A character is a single letter, number, punctuation mark,
    or symbol. A String is a group of characters.


    Your next step in creating the Variable program to create a character and a String
    variable. Add these two statements after the float gradePointAverage line:


    ```

    char key = ''C'';

    String productName = "Larvets";

    ```


    When you are using character values in your program, you must put single quotation
    marks on both sides of the character value assigned to a variable. For strings,
    you must surround them with double quotation marks.


    Quotation marks prevent the character or string from being confused with a variable
    name or another part of a statement. Take a look at the following statement:


    ```

    String productName = "Larvets";

    ```


    > NOTE

    You can use a floating-point variable to store a grade point average, such as
    2.25 (to pick your own at the University of North Texas—hi, Professor Wells!).
    You can also use it to store a number as 0, which is the percentage chance of
