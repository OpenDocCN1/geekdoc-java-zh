  md: '# HOUR 16: Building a Complex User Interface


    FIGURE 16.1

    Choosing a color using three slider components.


    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_257_0.png)


    You can create a horizontal slider with one of the following constructors:


    +   * JSSlider()—Create a slider with a minimum of 0, maximum of 100, and a starting
    value of 50.

    * JSSlider(int, int)—Create a slider with the specified minimum and maximum values.

    * JSSlider(int, int, int)—Create a slider with the specified minimum, maximum,
    and starting values.


    To create a vertical slider, use a constructor with an additional first argument:
    the orientation of the slider. This argument should be the class variable JSSlider.VERTICAL
    or JSSlider.HORIZONTAL.


    The following statement creates a vertical slider for a number from 1 to 1,000:


    ```

    JSSlider guess = new JSSlider(JSSlider.VERTICAL, 1, 1000, 500);

    ```


    This slider starts with the caret—the part of the component that selects a number—at
    the 500 position.


    To display a label for a slider, you must set up the information the label will
    contain. Call the slider''s setMajorTickSpacing(int) and setMinorTickSpacing(int)
    methods to determine how often a tick mark is displayed on the label. Major ticks
    are displayed as a thicker line than minor ticks.


    After you have set up how often tick marks appear, call the slider''s setPaintTicks(boolean)
    method with true as the argument. You can also display the numeric value of each
    major tick by calling the slider''s setPaintLabels(boolean) method with true.'
