    \ Virtual Device, first click the green Android phone icon in the Eclipse toolbar,\
    \ which is shown in Figure 24.4.\n\nThis launches the Android Virtual Device Manager,\
    \ one of the tools in the Android SDK. The emulators that you've created are listed\
    \ to the left. The manager is shown in Figure 24.5.\n\nTo add a new emulator,\
    \ click New and follow these steps:\n\n+   1. In the AVD Name field, give it the\
