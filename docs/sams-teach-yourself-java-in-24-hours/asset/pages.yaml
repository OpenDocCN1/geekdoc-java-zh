    # Fixing Errors


    Now that the Spartacus application has been written, compiled, and run, it''s
    time to break something to get some experience with how NetBeans responds when
    things go wrong.


    Like any programmer, you''ll have plenty of practice screwingwing things up on
    your owner, but pay attention here anyway.


    Return to Spartacus.java in the source editor and take the semicolon off the end
    of the line that calls System.out.println() (line 17 in Listing A.1). Even before
    you save the file, NetBeans spots the error and displays a red alert icon to the
    left of the line (see Figure A.5).


    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_456_0.png)


    FIGURE A.5

    Flagging errors in the source editor.


    Hover over the alert icon to see a dialog appear that describes the error NetBeans
    thinks it has spotted.'
  merge: -1
  pgno: 456
- img_proc: true
  md: 'The NetBeans source editor can identify most of the common programming errors
    and typos that it encounters as you write a Java program. The detection of an
    error stops the file from being compiled until the error has been fixed.


    Put the semicolon back at the end of the line. The alert icon disappears and you
    can save and run the class again.


    These basic features are all you need to create and compile the Java programs
    in this book.


    NetBeans is capable of a lot more than the basic features described here, but
    you should focus on learning Java before diving too deeply into the IDE. Use NetBeans
    as if it was just a simple programming project manager and text editor. Write
    classes, flag errors, and make sure you can compile and run each project successfully.


    When you''re ready to learn more about NetBeans, the Start page offers resources
    to learn how to use it. Oracle also offers training and documentation at http://netbeans.org/kb.'
  merge: -1
