  md: '# HOUR 6

    Using Strings to Communicate


    Your computer programs are capable of quietly doing their work and never stopping
    for a chat.

    Java programs use strings as the primary means to communicate with users. Strings
    are collections of text—letters, numbers, punctuation, and other characters. During
    this hour, you learn all about working with strings.


    # THIS HOUR''S TO-DO LIST:


    +   - Use strings to store text.

    - Display strings in a program.

    - Include special characters in a string.

    - Paste two strings together.

    - Include variables in a string.

    - Compare two strings.

    - Determine the length of a string.


    # Storing Text in Strings


    Strings store text and present it to users. The most basic element of a string
    is a character. A character is a single letter, number, punctuation mark, or other
    symbol.


    In Java programs, a character is one of the types of information that can be stored
    in a variable. Character variables are created with the `char` type in a statement
    such as the following:


    ```

    char keyPressed;

    ```


    This statement creates a variable named `keyPressed` that can store a character.
    When you create character variables, you can set them up with an initial value,
    as in the following:


    ```

    char quitKey = ''@\'';

    ```


    The value of the character must be surrounded by single quotation marks.

    A string is a collection of characters. You can set up a variable to hold a string
    value by following `String` with the name of the variable, as in this statement:


    ```

    String fullName = "Fin Shepard";

    ```'
