    # Configuring the App Manifest File


    The primary configuration tool in an Android app is a file called AndroidManifest.xml
    in the main app. All XML files utilized by an app can be edited manually or by
    the built-in editor in Eclipse. The latter is easier and less error prone. Unless
    you''re extremely comfortable editing XML, you should stick to the editor until
    you''ve gained more experience as an Android programmer.


    To choose the proper icon for the app, do the following:


    +   - Double-click AndroidManifest.xml in Package Explorer. The file opens editing
    in the main Eclipse window using the built-in editor.

    - Several tabs run along the bottom edge of the editor. Click the Application
    tab to set settings relative to the app (see Figure 24.11).


    Resources are identified in an app using an ID formed from their filename with
    the extension .drawable.png has the ID icon, browser.png and so on. No two resources
    can have the same ID (of the same graphic being stored at different resolutions
    in the drawable-* folders, because they count as a single resource)


    If two resources have the same name without the extension, such as appicon.png
    and appicon.gif, Eclipse will flag the error and the app won''t compile.


    Resources also must have names that contain only lowercase letters, numbers, underscores
    (_), and periods (.). The files in this project follow these rules.'
