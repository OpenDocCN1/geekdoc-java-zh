    This statement creates a string variable called fullName containing the text "Fin
    Shepard," the hero in the 2013 cinematic masterpiece Shark. A string is denoted
    with double quotation marks around the text in a Java statement. These quotation
    marks are not included in the string itself.


    Unlike the other types of variables you have used—int, float, char, boolean, and
    so on—the name of the String type is capitalized.


    Strings are a special kind of information called objects, and the types of all
    objects are capitalized in Java. You learn about objects during Hour 10, "Creating
    Your First Object." The important thing to note during this hour is that strings
    are different from the other variable types, and because of this difference, String
    is capitalized.


    # Displaying Strings in Programs


    The most basic way to display a string in a Java program is with the System.out.println()
    statement. This statement takes strings and other variables inside the parentheses
    and displays their values on the system output device, which is the computer''s
    monitor. Here''s an example:


    ```

    System.out.println("We can''t just wait here for sharks to rain down on

    us.");

    ```


    This statement causes the following text to be displayed:


    We can''t just wait here for sharks to rain down on.


    Displaying text on the screen is often called printing, which is what println()
    stands for—print line. You can use the System.out.println() statement to display
    text within double quotation marks and to display variables, as you see later.
    Put all the material you want to be displayed within the parentheses.


    Another way to display text is to call System.out.print(). This statement displays
    strings and other variables inside the parentheses, but unlike System.out.println(),
    it enables subsequent statements to display text on the same line.


    You can use System.out.print() several times in a row to display several things
    on the same line, as in this example:'
