  md: '# Using Image Icons and Toolbars


    The graphics file used to create the image icon must be in GIF, JPEG, or PNG format.
    Most are in GIF format, which is well suited to displaying small graphics with
    a limited number of colors.


    Although some operating systems use the \ character to separate folders and filenames,
    the ImageIcon constructor requires the / character as a separator.


    The ImageIcon constructor loads the entire image from the file immediately.


    You can use image icons as labels and buttons by using the JLabel(ImageIcon) and
    JButton(ImageIcon) constructor methods, as in the following example:


    ```

    ImageIcon siteIcon = new ImageIcon("siteLogo.gif");

    JLabel label = new JLabel(siteIcon);

    ImageIcon searchIcon = new ImageIcon("searchGraphic.gif");

    JButton search = new JButton(searchIcon);

    ```


    Several components can have an icon and a text label. The following statement
    creates a button with:


    ```

