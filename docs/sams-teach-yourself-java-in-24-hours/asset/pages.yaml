  md: '# Catching Exceptions in a try-catch Block


    Up to this point, you have dealt with exceptions by fixing the problem that caused
    them. There are times you can''t deal with an exception in that manner and must
    handle the issue within a Java class.


    As an introduction to why this is useful, enter the short Java application in
    Listing 18.1 in a new Java file called Calculator and save the file.


    LISTING 18.1 The Full Text of Calculator.java


    ```

    1: package com.java24hours;

