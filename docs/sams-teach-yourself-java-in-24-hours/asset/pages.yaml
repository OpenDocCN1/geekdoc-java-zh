  md: 'As the class name suggests, array lists are like arrays, which also hold elements
    of related data, but they can grow or shrink in size at any time.


    The ArrayList class belongs to the java.util package of classes, one of the most
    useful in the Java Class Library. An import statement makes it available in your
    program:


    ```

    import java.util.ArrayList;

    ```


    An array list holds objects that either belong to the same class or the same superclass.
    They are created by referencing two classes: the ArrayList class and the class
    list holds.


    The name of the class held by the list is placed within < and > characters, as
    in this statement:


    ```

    ArrayList<String> structure = new ArrayList<String>();

    ```


    The preceding statement creates a list that holds strings. Identifying the kinds
    of objects a data structure in this manner utilizes generics, a way to indicate
    the kinds an array list holds. If you were using lists with an older version of
    Java, you would have written a constructor like this:


    ```

    ArrayList structure = new ArrayList();

    ```


    Although you can do this, generics make your code more reliable because they give
    the compiler a way to prevent more errors. Here, they stop you from misusing an
    array list by putting the wrong class of objects in it. If you attempt to put
    an Integer object in a list that is supposed to hold String objects, the compiler
    fails with an error.


    Unlike arrays, array lists aren''t created with a fixed number of elements they
    hold. The list is created with 10 elements. If you know you''re storing a lot
    more objects than that, you can specify a size as an argument to the constructor.
    Here''s a statement that creates a 300-element list:


    ```

    ArrayList<String> structure = new ArrayList<String>(300);

    ```


    You can add an object to a list by calling its add() method, using the object
    as the only argument:


    ```

    structure.add("Vance");

    structure.add("Vernon");

    structure.add("Velelma");

    ```'
