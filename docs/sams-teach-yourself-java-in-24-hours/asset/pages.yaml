    # Q&A


    +   Q. Anonymous inner classes are confusing. Do I have to use them in my programs?


    +   A. No. As with other complex features of the Java language, you don''t have
    to use them if you can get the job done some other way.

    But you should learn about them anyway, because you''re likely to encounter them
    in Java code.


    When you look at the Java programs written by experienced programmers, you often
    find both inner classes and anonymous classes. So even if you''re not ready to
    create them yourself, it''s worthwhile to learn what they are and how they work.


    +   Q. Are the Hatfields and McCoys still feuding?


    +   A. The West Virginia and Kentucky families are on good terms 124 years after
    the last casualty in their infamous 35-year conflict.


    In 1979, Hatfields and McCoys got together to play the TV game Family Feud for
    a week. A pig was kept on stage and awarded to the winning family.


    In 2003, a formal peace treaty was reached between the families in Pikeville,
    KY.


    The Hatfield-Mcoy Trails, 500 miles of trails for recreational off-road driving,
    were established in West Virginia in 2000 and expanded over the next decade.


