  md: '# Becoming a Programmer


    Because of the ways programs function, you can''t blame the computer when something
    goes wrong as your program runs. The computer is doing exactly what you told it
    to do, the blame for errors usually lies with the programmer.


    That''s the bad news. The good news is you can''t do any permanent harm. No computers
    will be injured as you learn to program in Java.


    # How Programs Work


    The collection of statements that make up a program is called its source code.


    Most programs are written in the same way that you write an email—into a text
    window. Some programming tools come with their own source code editor and others
    can be used with any text-editing software.


    When you have finished a program, save the file to disk. Computer programs often
    have their filename extension to indicate what type of file they are. Java programs
    must have the extension .java, as in Calculator.java.


    To run a program you have saved a file, you need some help. The kind of help depends
    on the programming language you use. Using languages requires an interpreter to
    run your programs. The interpreter executes each line of a computer program and
    executes that line, then goes on to the next. Many versions of BASIC are interpreted
    languages.


    The biggest advantage of interpreted languages is that they are faster to test.
    fix errors, and try again. The primary disadvantage is that interpreted languages
    run slower than other programs. Each line has to be translated into instructions
    that the computer can run, one line at a time.


    Other programming languages require a compiler. The compiler takes it into a form
    that the computer can understand. It also makes the program run as efficiently
    as possible. The compiled program can be run directly without the need for an
    interpreter.


    Compiled programs run more quickly than interpreted programs but take more time
    to test. You have to write your program and compile


