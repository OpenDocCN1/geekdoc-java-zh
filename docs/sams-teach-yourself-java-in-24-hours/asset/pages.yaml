  md: '# Designing a Real App


    # 397


    onCreate() method defined in the class is called when the class is loaded.


    The first thing the method does use super() to call the same method in its superclass:


    ```

    super.onCreate(savedInstanceState);

    ```


    Next, it calls setContentView(), a method that selects the screen will be displayed.
    The argument to this method is an instance variable, R.layout activity_leader,
    that refers to the file activity_leader.xml in res/layout. As you may recall,
    the ID of a resource is its filename without the extension.


    When you design your app''s user interface, you set the On Click property of each
    button to processClicks. This indicated that a method called processClicks() would
    be called when a user clicked a widget on the screen.


    Now it''s time to implement this method. Add these statements to MainActivity
    above the onCreate() method:


    ```

    public void processClicks(View display) {

    Intent action;

    int id = getId();

    }

    ```


    This method is called with one argument: a View object from the android.view package.
    A View is a visual display of some kind in an app. In this case, it''s the screen
    containing the Dialer, Browser, and Maps buttons.


    The View object''s getId() method returns the ID of the button that was clicked:
    phonebutton, webbutton, or mapbutton.


    This ID is stored in the id variable so it can be used in a switch statement to
    take action based on the click:


    ```

    switch (id) {

    case (R.id.phonebutton):

    //

    break;

    case (R.id.webbutton):

    //

    break;

    case (R.id.mapbutton):

    //

    break;

    default:

    //

    break;

    }

    ```


    You can open the R.java file for viewing in the /res/gen/org.cadenhead.android
    folder to learn more why the main resource is referred to as R.layout.main. The
    class is generated automatically by the Android SDK to enable resources to be
    referenced by their IDs. You never should edit this class yourself.'
