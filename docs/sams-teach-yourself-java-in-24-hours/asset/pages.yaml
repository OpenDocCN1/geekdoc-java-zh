    \ is added to the end of the list, so the first string in servants is \"Bates\"\
    \ and the last is \"Daisy\".\n\nIf you have some experience with earlier versions\
    \ of Java, you might have heard of vectors and why they're so much like array\
    \ lists. They are another data structure that functions identically to the ArrayList\
