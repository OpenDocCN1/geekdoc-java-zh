  md: '# Workshop


    # Q&A


    +   Q. Is it possible to create your own exceptions?


    +   A. You can create your own exceptions easily by making them a subclass of
    an existing exception, such as Exception, the superclass of all exceptions. In
    a subclass of Exception, there are only two methods you might want to override:
    Exception() and Exception() with a String as an argument. In the latter, the string
    should be a message describing the error that has occurred.


    +   Q. Why doesn''t this hour cover how to throw and catch errors in addition
    to exceptions?


    +   A. Java divides problems into Errors and Exceptions because they differ in
    severity. Exceptions are less severe, so they are something that should be dealt
    with in your programs using try-catch or throws in the method declaration. Errors,
    on the other hand, are more serious and can''t be dealt with adequately in a program.


    Two examples of these errors are stack overflows and out-of-memory errors. These
    can cause the Java interpreter to crash, and there''s no way you can fix them
    in your program as the interpreter runs it.


    +   Q. What is the oldest comic strip that''s still running in newspapers?


    +   A. Katzenjammer Kids, which was created by Rudolph Dirks in 1897 and is still
    offered today by King Features Syndicate. The strip was started only two years
    after the first comic strip, The Yellow Kid, and is the first to use balloons.


    Dirks, a German immigrant to the United States, was inspired to create the rebellious
    kids Hans and Fritz by a children''s story from his native country. He quit the
    strip in 1912 in a contractual dispute and succeeded by Harold Knerr, who wrote
    and drew it until 1949. There have been five subsequent cartoonists working on
    it. Hy Eisman has been doing it since 1986.


    The word katzenjammer literally means "the wailing of cats" in German, but it''s
    often used to describe a hangover.'
