    of that class, or by classes in the same package. A package is a group of related
    classes that serve a common purpose. An example is the java.util package, which
    contains classes that offer useful utilities such as date and time programming
    and file archiving. When you use the import statement in a Java program with an
    asterisk, as in import java.util.*, you are making it easier to refer to the classes
    of that package in a program.


    A private variable is restricted even further than a protected variable—you can
    use it only in the same class. Unless you know that a variable can be changed
