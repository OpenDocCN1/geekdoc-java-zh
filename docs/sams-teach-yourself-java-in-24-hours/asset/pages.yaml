  md: 'An app can be as simple as a single screen or contain multiple screens. A game
    could be organized into these screens:


    +   - A splash screen that displays as the game is loading

    - A main menu screen with buttons to view the other screens

    - A help screen explaining how to play

    - A scores screen that lists the highest player scores

    - A credits screen naming the game''s developers

    - A game screen for actual play


    The Leader app consists of a single screen, which holds buttons for contacting
    the president of the United States or a leader to be named later.


    All of an app''s screens are kept in the /res/layout folder. This project has
    an activity_leader.xml file in this folder that''s designated as the screen to
