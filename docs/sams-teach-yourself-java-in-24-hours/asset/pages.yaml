  md: '# Assigning Variable Types


    The last of the numeric variable types, long, is typically used for integers that
    are too big for the int type to hold. A long integer can be from -9.22 quintillion
    to 9.22 quintillion, which is a large number to cover everything but government
    spending.


    When you are working with large numbers in java, it can be difficult to see at
    a glance the value of the number, as in this statement:


    ```

    long salary = 264400000;

    ```


    Unless you count the zeros, you probably can''t tell that it''s $264.4 million.
    Java makes it possible to organize large numbers with underscore (\_) characters.
    Here''s an example:


    ```

    long salary = 264400000;

    ```


    The underscores are ignored, so the variable equals the same value. They''re just
    a way to make numbers more readable.


    # The boolean Variable Type


    Java has a type of variable called boolean that can be used only to store the
    value true or the value false. At first glance, a boolean variable might not seem
    particularly useful you plan to write a lot of true-or-false quizzes. However,
    boolean variables are used in a variety of situations in your programs. The following
    are some examples of questions that boolean variables can be used to answer:


    +   - Has the user pressed a key?

    - Is the game over?

    - Is my bank account overdrawn?

    - Can the rabbit eat Trix?


    Booleans are the place to hold the answer to yes/no or true/false questions.

    The following statement creates a boolean variable called gameOver:


    ```

    boolean gameOver = false;

    ```


    The underscores in numbers will be flagged as an error in the NetBeans source
    editor if the IDE has not set up to an older version of Java. To make sure this
    isn''t happening, in the Projects pane, right-click the name of the current project
    (likely Java) and choose Properties. The Properties dialog opens with Source,
    The Categories pane. Check the Source/Binary Format drop-down to make sure it
    is the current version of Java.


    Boolean numbers are named for George Boole (1815-1864). Bole, a mathematician
    who was self-taught until adulthood, invented Boolean algebra, which becomes a
    fundamental part of computer programming, digital electronics, and logic. One
    imagines that he did pretty well on true-false tests as a child.


