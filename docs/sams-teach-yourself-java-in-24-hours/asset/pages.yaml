    This mod adds a /crazyhorse command to Minecraft that drops a random number of
    horse-riding zombies from the sky. Lines 18–66 do something cool when the command
    is entered. The rest of the program surrounding those lines is the standard mod
    framework.


    After retrieving the player, location, and world, the mod stores a random number
    from 1 to 11 in a variable:


    ```

    int quantity = (int)(Math.random() * 10);

    ```


    The random() method in Java''s Math class generates a random floating-point number
    between 0.0 and 1.0. It can be multiplied by an integer to produce a random integer
    ranging from 0 to that integer.


    This number is the number of zombies and horses that are created.


    A for loop that begins in Line 26 loops for each zombie-horse pair.


    Their location is set by calling the Location() constructor with four arguments:
    the game world, x coordinate, y coordinate, and z coordinate.'
