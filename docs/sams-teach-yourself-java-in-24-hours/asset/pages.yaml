    # Summary


    The JAX-WS set of packages and classes is the successor to the Java API for XML-based
    RPC (JAX-RPC), a technology for making remote procedure calls from one Java object
    to another over the Internet. Another API, JAX-RS, supports web services in Java
    that use REST.


    The ability to call other software, regardless of its location and the programming
    language in which it is written, is one of the building blocks of a software development
    trend that became popularized under the name Web 2.0.


    The selling point behind Web 2.0 was to enable software to take as much advantage
    of the Internet’s ubiquitous connectivity as humans have enjoyed since the Web
    became popular in the mid-1990s.


    This hour covered all four steps of creating and using a web service using JAX-WS.
    You can create an interface for the service (a Service Endpoint Bean), implement
    the service (a Service Implementation Bean), publish the service on the Internet,
    and create a client to access it.


    Many programming tools, including NetBeans and the JDK, make it possible to create
    code automatically to simplify the job of creating and accessing web services.'
