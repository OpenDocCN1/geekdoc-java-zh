    Instead of using probability to figure out this problem out, the computer conducts
    drawings in rapid succession and doesn''t stop until there''s a winner. Because
    the 6-out-of-6 win is extremely unlikely, the program also reports on any combination
    of three, four, or five winning numbers.


    The interface includes 12 text fields for lotto numbers and two checkboxes labeled
    Quick Pick and Personal. Six text fields, disabled for input, are used to display
    the winning numbers of each drawing. The other six text fields are for the user''s
    choice of numbers. Selecting the Quick Pick box chooses six random numbers for
    a user. Selecting Personal enables the user to select desired numbers.


    Three buttons control the activity of the program: Stop, Play, and Reset. When
    the Play button is pressed, the program starts a thread called playing and generates
    Lotto drawings.


    The LottoEvent class implements three interfaces: ActionListener, ItemListener,
    and Runnable. The Runnable interface relates to threads and is covered in Hour
    19. The listeners are needed to listen to user events generated by the application
    buttons and check boxes.'
