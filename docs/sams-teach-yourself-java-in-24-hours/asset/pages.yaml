    # Using Special Characters in Strings


    When a string is being created or displayed, its text must be enclosed within
    double quotation marks. These quotation marks are not displayed, which brings
    up a good question: What if you want to display double quotation marks?


    To display them, Java has created a special code that can be put into a string:
    \.". Whenever this code is encountered in a string, it is replaced with a double
    quotation mark. For example, examine the following:


    ```

    System.out.println("Anthony Ferrante directed \Sharknado\ in 2013.");

    ```


    This code is displayed as the following:


    Anthony Ferrante directed "Sharknado" in 2013.


    You can insert several special characters into a string in this manner. The following
    list shows these special characters; note that each is preceded by a backslash
    (\).


    | Special Characters | Display |

    |---|---|

    | \'' | Single quotation mark |

    |\" | Double quotation mark |

    | \ | Backslash |

    | \t | Tab |

    | \b | Backspace |

    | \r | Carriage return |

    | \f | Formfeed |

    | \n | Newline |"'
