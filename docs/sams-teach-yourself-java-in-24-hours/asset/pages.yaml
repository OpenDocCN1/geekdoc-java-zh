    # Naming Your Variables


    Variable names in Java can begin with a letter, underscore or a dollar sign ($),
    the rest of the name can be any letters or numbers. You can give your variables
    almost any name you like but should be consistent in how you name them. This section
    outlines the generally recommended naming method for variables.


    Java is case sensitive when it comes to variable names, you must always capitalize
    variable names the same way. For example, if the gameOver variable is referred
    to as GameOver somewhere in the program, an error prevents the program from being
    compiled.


    A variable''s name should describe its purpose in some way. The first letter should
    be lowercase, and if the variable name has more than one word, the first letter
    of each subsequent word a capital letter. Instance, if you want to create an integer
    variable to store the all-time high score in a game program, you can use the following
    statement:


    ```

    int timeHighScore;

    ```


    You can''t use punctuation marks or spaces in a variable name, so neither of the
    following works:


    ```

    int int-TimeHighScore;

    int int Time High Score;

    ```


    If you try these variable names in a program, NetBeans responds by flagging the
    error with the red alert icon alongside the line in the source editor.


    Words that are used by the language, such as public, class, true, and false, cannot
    be the name of variables.


    Variable names aren''t the only aspect of that''s case sensitive. Everything else
    you give a name to a program, including classes, packages, and methods, must be
    referred to using consistent capitalization.'
