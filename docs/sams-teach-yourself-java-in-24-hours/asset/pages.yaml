  md: "# HOUR 17: Storing Objects in Data Structures\n\nThere's a class in the java.util\
    \ package that does everything an array can do without that limitation: ArrayList.\n\
    \nAn array list is a data structure that holds objects of the same class or a\
    \ common superclass. The list can grow or shrink as needed as a program is running.\n\
    \nThe simplest way to create an array list is by calling its constructor with\
    \ no arguments:\n\n```\nArrayList servants = new ArrayList();\n```\n\nArray lists\
    \ can be created by specifying an initial capacity, which provides some guidance\
    \ on how many elements the list might hold. The capacity is set as an integer\
    \ argument to the constructor:\n\n```\nArrayList servants = new ArrayList(30);\n\
    ```\n\nAlthough this looks like creating an array and determining its exact size,\
    \ if the capacity is exceeded, the array list will be adjusted accordingly and\
    \ continue to function properly. (The better you estimate the capacity, the more\
    \ efficient the program will be.)\n\nThe list holds objects belonging to the same\
    \ class or share a superclass.\n\nWhen you create an array list, you know the\
    \ class or superclass it is intended to hold. This can be specified in the constructor\
    \ within < and >, a feature of the language generics. Here's an improvement on\
