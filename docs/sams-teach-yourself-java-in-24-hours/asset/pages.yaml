    # Using Components


    In Java, every part of a GUI is represented by a class in the Swing package. There
    is a JButton class for buttons, a JWindow class for windows, a JTextField class
    for text fields, and so on.


    To create and display an interface, you create objects, set their variables, and
    call their methods. The techniques are the same as those you used during the previous
    three hours as you were introduced to object-oriented programming (OOP).


    When you are putting a GUI together, you work with two kinds of objects: components
    and containers. A component is an individual element in a user interface, such
    as a button or slider. A container is a component that you use to hold other components.


    The first step in creating an interface is to create a container that can hold
    components. In an application, this container is often a window or a frame.


    # Windows and Frames


    Windows and frames are containers that can be displayed in a user interface and
    other components. Windows are simple containers that do not have a title bar or
    any of the other buttons normally along the top edge of a GUI. Frames include
    all the common window features users expect to find when they run software—such
    as buttons to close, expand, and shrink the window.'
