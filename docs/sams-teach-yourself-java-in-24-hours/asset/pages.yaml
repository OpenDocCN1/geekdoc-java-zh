  md: '# Casting Simple Variables


    With simple variables, casting occurs most commonly between numeric variables
    such as integers and floating-point numbers. One type of variable that cannot
    be used in any casting is Boolean values.


    To cast information into a new format, you precede it with the new format surrounded
    by parentheses. For example, if you want to cast something into a long variable,
    you precede it with (long). The following statements cast a float value into an
    int:


    ```

    float source = 7.06F;

    int destination = (int)source;

    ```


    In variable casting where the destination holds larger values than the source,
    such as when a byte is cast into an int. A byte holds values from -128 to 127,
    whereas an int holds values from -2.1 billion to 2.1 billion. No matter what the
    value variable holds, the new int variable has plenty of room for.


    You sometimes can use a variable in a different format casting it at all. For
    example, you can use char variables as if you were int variables. Also, you can
    use int variables as if you were long variables, and anything can be used as a
    double.


    In most cases, because the destination provides more room than the source, the
    information is converted without changing its value. The main exceptions occur
    when an int or long variable is cast to a float, or a long is cast into a double.


    When converting information from a larger variable type to a smaller type, you
    must explicitly cast it, as in the following statements:


    ```

    int xNum = 103;

    byte val = (byte)xNum;

    ```


    Here, casting converts an integer value called xNum into a byte variable called
    val. This is an example where the destination variable holds a smaller range of
    values from the source variable. A byte holds integers ranging from -128 to 127,
    and an int holds a much larger range of integer values.


    When the source variable in a casting operation has a value that isn''t enabled
    in the destination variable, Java changes the value to make the cast fit successfully.
    This can produce unexpected results if you''re not expecting the change.'
