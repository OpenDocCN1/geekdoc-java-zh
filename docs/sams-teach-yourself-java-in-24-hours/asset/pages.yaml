    # Advanced String Handling


    There are several other ways you can examine a string variable and change its
    value. These advanced features are possible because strings are objects in the
    Java language. Working with strings develops skills you''ll use on other objects
    later.


    # Comparing Two Strings


    One thing you are testing in your programs is whether one string is equal to another.
    You can do this by using equals() in a statement with both of the strings, as
    in this example:


    ```

    String favorite = "chainsaw";

    String guess = "pool cue";

    System.out.println("Is Fin''s favorite weapon " + guess + "?");

    System.out.println("Answer: " + favorite.equals(guess));"

    ```


    This example uses two different string variables. One, favorite, stores the name
    of Fin''s favorite shark-hunting instrument: a chainsaw. The other, guess, stores
    a guess as to what his favorite might be. The guess that Fin prefers a pool cue.


    The third line displays the text "Fin''s favorite weapon a" followed by the value
    of the guess variable, and then a question mark. The fourth line displays the
    text "Answer:" and then contains something new:

    favorite.equals(guess)


    This part of the statement is known as a method. A method is a way to accomplish
    a task in a Java program. The method''s task is to determine if one string has
    the same value as another. If the two variables have the same value, the text
    true is displayed. If not, the text false is displayed. The following is the output
    of this example:'
