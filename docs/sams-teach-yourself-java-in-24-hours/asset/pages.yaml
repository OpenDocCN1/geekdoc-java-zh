    # ## Using the Font Class


    Colors and fonts are represented in Java by the Color and Font classes in the
    java.awt package. With these classes, you can present text in different fonts
    and sizes and change the color of text and graphics. Fonts are created with the
    Font (String, int, int) constructor, which takes three arguments:


    +   - The typeface of the font as either a generic name ("Dialog," "InputDialog,"
    "Monospaced," "Sans Serif," or "Serif") or an actual name ("Arial Black," "Helvetica,"
    or "Courier New")

    - The style as one of three class variables: Font.BOLD, Font.ITALIC, or Font.PLAIN

    - The size of the font in points


    The following statement creates a 12-point italic Serif Font object:


    ```

    Font current = new Font("Serif", Font.ITALIC, 12);

    ```


    If you use a specific font rather than one of the generic ones, it must be installed
    on the computer of users running your program. You can combine the font styles
    by adding them, as in the following example:


    ```

    Font headline = new Font("Courier New", Font.BOLD + Font.ITALIC, 72);

    ```


