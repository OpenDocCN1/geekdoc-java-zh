  md: '# # HOUR 18

    Handling Errors in a Program


    Errors, the bugs, blunders, and typos that prevent a program from running correctly,
    are a natural part of the software development process. "Natural" is probably
    the kindest word that has ever been used to describe them. In my own programming,
    when I can''t find the cause of an elusive error, I use words that would make
    Vice President Joe Biden blush.


    Some errors are flagged by the compiler and prevent you from creating a class.
    Others are noted by the interpreter in response to a problem that keeps it from
    running successfully. Java divides errors into two categories:


    +   - Exceptions—Events that signal an unusual circumstance has taken place as
    a program runs


    +   - Errors—Events that signal the interpreter is having problems that might
    be unrelated to your program


    Errors normally aren''t something a Java program can recover from, so they''re
    not the focus of this hour. You might have encountered OutOfMemoryError as you
    worked on Java programs. There''s nothing that can be done in a Java program to
    handle that kind of error after it occurs. The program exits with the error.


    Exceptions often can be dealt with in a way that keeps a program running properly.


    # Exceptions


    Although you are just learning about them now, you have probably become well acquainted
    with exceptions during the previous 17 hours.


    THIS HOUR''S TO-DO LIST:


    +   - Learn why errors are called


    +   - Respond to exceptions in Java programs.


    +   - Create methods that ignore an exception.


    +   - Use methods that cause exceptions.


    +   - Create your own exceptions.'
