  md: "# Describing Your Object Is Like\n\nThose brackets define the scope of the\
    \ variable. The warning variable does not exist outside of the brackets, so the\
    \ system.out.println() method cannot use it as an argument.\n\nWhen you use a\
    \ set of brackets inside another set of brackets, you need to pay attention to\
    \ the scope of the enclosed variables. Take a look at the following example:\n\
    \n```\nif (infectedFiles < 5) {\n  int status = 1;\n  if (infectedFiles < 1) {\n\
    \    boolean firstVirus = true;\n    status = 0;\n  } else {\n    firstVirus =\
    \ false;\n  }\n```\n\nSee any problems? In this example the status variable can\
    \ be used anywhere, but the statement that assigns a value of false to the firstVirus\
    \ variable causes a compiler error. Because firstVirus is created within the scope\
    \ of the if (infectedFiles < 1) statement, it doesn't exist inside the else statement\
    \ that follows.\n\nTo fix the problem, firstVirus must be created outside of both\
    \ these blocks so that its scope includes both of them. One solution is to create\
    \ firstVirus one line after status is created.\n\nRules that enforce scope make\
    \ programs easier to debug scope limits the area in which you can use a variable.\
    \ This reduces one of the most common errors that can crop up in programming:\
    \ using the same variable two ways in different parts of the program.\n\nThe concept\
    \ of scope also applies to methods because they are defined by an opening bracket\
    \ and closing bracket. A variable inside a variable method cannot be used in other\
    \ methods. You can only use a variable in more than one method if it was created\
    \ as an object variable or class variable.\n\n# Putting One Class Inside Another\n\
    \nAlthough a java program is called a class, there are many occasions when a program\
    \ requires more than one class to get its work done. These programs consist of\
    \ a main class and any helper classes that are needed."
