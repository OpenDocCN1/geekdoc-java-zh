  md: '# Writing Android Apps


    This effort started slowly, but since early 2010 it has exploded and become a
    genuine rival to iPhone and other mobile platforms. All major phone carriers now
    offer Android phones. There''s also a growing market for tablet and ebook readers.


    Before Android, mobile application development required expensive programming
    tools and developer programs. The makers of the phone had control over who''d
    be allowed to create apps for them and whether the apps could be sold to users.


    Android tears down that wall.


    The open source and nonproprietary nature of Android means that anyone can develop,
    release, and sell apps. The only cost is a nominal fee to submit apps to Google''s
    marketplace. Everything else is free.


    The place to download the Android SDK and find out about creating programs for
    the platform is the Android Developer site at http://developer.android.com. You
    will consult it as you write your own apps, because it documents every class in
    Android''s Java class library and serves as an extensive online reference.


    Writing Android apps is easier if you''re using an integrated development environment
    (IDE) that''s equipped to support the Android SDK. The most popular IDE for Android
    programming is Eclipse, which is also free and open source. An Android Plug-in
    for Eclipse makes the SDK function seamlessly inside the IDE.


    You can use Eclipse to write Android apps, test them in an emulator that acts
    like an Android phone, and even deploy them on an actual device.


    For most of its existence, the Java language has been used to write programs that
    run in one of three places: a desktop computer, or a web browser.


    Android puts Java everywhere. Your programs can be deployed on millions of phones
    and other mobile devices.


    This fulfills the original design goal of Java back when James Gosling invented
    the language in the mid 1990s. He was tasked with creating a language that could
    run everywhere on devices such as phones, smart cards, and appliances.'
  merge: -1
