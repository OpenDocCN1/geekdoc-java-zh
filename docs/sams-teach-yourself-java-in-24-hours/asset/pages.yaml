  md: '# Workshop


    # Q&A


    +   Q. What does it mean when a class is synchronized?


    +   A. Synchronization is how the Java Virtual Machine ensures that an object''s
    instance variables and methods are accessed in a consistent and accurate manner
    by other users of the object.


    This concept will make more sense when you learn about threads in Hour 19, "Creating
    a Threaded Program." Java programs can be designed to do more than one task simultaneously.
    Each task is put in its own thread.


    When multiple threads are accessing the same object, it''s vital that the object
    acts the same in each thread. So when the method of a class requires synchronization,
    as vectors and hash tables do, the Virtual Machine has to work harder and can
    encounter errors that may cause a thread to stop running.


    This is why arrays and hash maps replicate the functionality of vectors and hash
    tables. Data structures were needed that didn''t require synchronization and run
    much more efficiently as a consequence.


    +   Q. Have the Washington Generals beaten the Harlem Globetrotters?


    +   A. The Generals have beaten the Globetrotters seven times over the decades,
    most recently in 1971. Playing in Martin, TN, the Generals won 100-99 on a shot
    by team owner Louis "Red" Klotz.


    Although the Generals are known today for being past, they began in 1921 as the
    Philadelphia Sphas, a legitimate team that played in the Eastern and American
    basketball leagues. The Sphas—an acronym for South Philadelphia Hebrew Association—won
    10 championships. Klotz was a former Sphas player who bought the team and changed
    the name to the Generals in 1952 when they became the permanent touring partner
    of Harlem''s famous team.


    The 1971 victory ended a 2,495-game winning streak for the Globetrotters.'
