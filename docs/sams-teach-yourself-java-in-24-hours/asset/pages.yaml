  md: '# # Workshop


    # ## Q&A


    Q. Do all arguments sent to a Java application have to be strings?


    A. Java stores all arguments as strings when an application runs. When you want
    to use one of these arguments as an integer or some other nonstring type, you
    have to convert the value. Learn how to do it during this Hour 11, "Describing
    What Your Object Is Like."


    Q. If app runs on web pages and applications everywhere else, what are Java programs
    launched by Java Web Start?


    A. Java Web Start is a way to launch Java applications from a web browser. A user
    clicks a link to run the program, which is easier than downloading it, running
    an installation wizard, and starting it like any other desktop software.


    Although they''re from web pages, Java Web Start programs are applications instead
    of applets. The application is up-to-date because it''s retrieved over the Web
    from the program''s provider every time it runs.


    Google Web Toolkit (GWT), a set of open source tools for web programming, can
    convert a Java program into JavaScript, making it faster and more reliably in
    web browsers without requiring a Java Virtual Machine at all.


    Q. Does the line of succession to the British throne run out at some point?


    A. Under Parliamentary law that has been in place since 1701, the British monarch
    must be a Protestant descendant of Sophia of Hanover, a German princess who was
    the heir to the crown when the law was passed.


    There are a finite number of people who are descendants of Sophia, so there''s
    always somebody in the regal line. The British government lists only the first
    38, so genealogists have attempted to fill out the list with themselves.


    The last person in the line of succession is Karin Vogel, a German therapist in
    her thirties. She was 4,973rd in line as 2001, genealogists determined after an
    exhaustive search that took years. So if all the people ahead of her drop out
    of the running (to, so, spend more time learning Java programming), Vogel takes
    over the mortgage of Buckingham Palace and becomes Her Majesty the First.


    Vogel is Sophia''s great-great-great-great-great-great-granddaughter. She told
    the Wall Street Journal that becoming monarch would be "too stressful."


    With the birth of Prince William and Princess Kate''s son, George, more officially
    known as His Royal Highness Prince George Alexander Louis of Cambridge, Vogel
    dropped to 4,974.'
