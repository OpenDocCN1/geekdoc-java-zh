  md: "# # Creating Behavior with Methods\n\nAttributes are the way to keep track\
    \ of information about a class of objects, for a class to do the things it was\
    \ created to, you must create behavior. Behavior describes the parts of a class\
    \ that accomplish tasks. Each of these sections is called a method.\n\nYou have\
    \ been using methods throughout your programs up to this point without knowing\
    \ it, including one in particular: println(). This method displays text onscreen.\
    \ Like variables, methods are used in connection with an object or a class. The\
    \ name of the object or class is followed by a period and the name of the method,\
    \ as in object2.move(Integer.parseInt()).\n\n# # Declaring a Method\n\nYou create\
    \ methods with a statement that looks similar to the statement that begins a class.\
    \ Both can take arguments between parentheses after names, and both use ( and\
    \ ) marks at the beginning and end. The difference is that methods can send back\
    \ a value after they are handled. The value can be of the simple types such integers\
    \ or Boolean values, or it can be a class of objects.\n\nThe following is an example\
    \ of a method the Virus class can use to infect files:\n\n```\npublic boolean\
    \ infectFile(String filename) {\n    boolean success = false;\n    / file-infecting\n\
    \    }\n```\n\nThis method takes a single argument: a string variable filename,\
    \ which is a variable that represents the file that should be attacked. If the\
    \ infection is a success, the success variable is set to true.\n\nIn the statement\
    \ that begins the method, boolean precedes the name of the method, infectFile.\
    \ This statement signifies that a Boolean value is sent after the method is handled.\
    \ The return statement is what actually sends a value back. In this method, the\
    \ value of success is returned.\n\nIf a method should not return a value, use\
    \ the keyword void.\n\nThe System.out.println() method might seem confusing because\
    \ it has two periods instead of one. This is because two classes are involved\
    \ in the statement: the System class and the PrintStream class. The System class\
    \ has a variable called out that is a Stream object. println() is a method of\
    \ the PrintStream class. System.out.println() statement means, in effect, \"Use\
    \ the println() method of the out instance variable of the System class.\" You\
    \ can chain references in this way."
