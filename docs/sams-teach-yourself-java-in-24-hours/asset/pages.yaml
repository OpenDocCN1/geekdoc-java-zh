  md: "# Class Methods\n\nLike class variables, class methods are a way to provide\
    \ functionality associated with an entire class instead of a specific object.\
    \ Use a class method when the method does nothing that affects an individual object\
    \ of the class. In the previous hour, “Creating Your First Object,” you used the\
    \ parseInt() method of the Integer class to convert a string to a variable of\
    \ the type int:\n\n```\nint fontSize = Integer.parseInt(fontText);\n```\n\nThis\
    \ is a class method. To make a method into class method, use static in front of\
    \ the method name, in the following code:\n\n```\nstatic void showVirusCount()\
    \ {\n    System.out.println(\"There \" + virusCount + \" viruses\");\n}\n```\n\
    \nThe virusCount class variable was used earlier to keep track of how many Virus\
    \ objects have been created by a program. The showVirusCount() method is a class\
    \ method that displays this total, and you can call it with a statement as the\
    \ following:\n\n```\nVirus.showVirusCount();\n```\n\n# Variable Scope Within Methods\n\
    \nWhen you create a variable or object inside a method in one of your classes,\
    \ it is only usable inside that method. The reason for this is the concept of\
    \ variable scope. Scope is the block in which a variable exists in a program.\
    \ If you go outside of the part of the program defined by the scope, you can no\
    \ longer use the variable.\n\nThe { } brackets in a program define the boundaries\
    \ for a variable’s scope. Any variable created within these marks cannot be used\
    \ outside of them. For example, consider the following statements:\n\n```\nif\
    \ (numFiles < 1) {\n    String warning = \"No files remaining.\";\n}\nSystem.out.println(warning);\n\
    ```\n\nThis code does not work—and does not compile in NetBeans—because the warning\
    \ variable was created inside the brackets of the if block."
