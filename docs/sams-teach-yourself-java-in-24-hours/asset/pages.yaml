  md: '2. What''s another name for an interface that contains only one method?


    +   A. Abstract interface


    +   B. Class


    +   C. Functional interface


    3. What is it called when a lambda expression guesses the class of an argument
    to a method?


    +   A. Target typing


    +   B. Type casting


    +   C. Class inference


    # Answers


    +   1. C. An anonymous inner class implements an interface with the new keyword,
    skipping the creation and naming of a class that implements it.


    +   2. C. Functional interface, as of Java 8. They were called single abstract
    method interfaces in earlier versions of the language.


    +   3. A. Target typing can infer the class of any functional interface method
    argument.


