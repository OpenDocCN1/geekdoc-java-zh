  md: '# Storing Objects in Data Structures


    Just as array lists have another class called Vector that does the same thing
    in more resource-intensive way, hash maps have Hashtable. Hash tables are synchronized
    and hash maps are not, so any class that makes use of hash tables takes longer
    to run. Hash maps generally are preferred.


    A hash map can be created by calling its constructor with no arguments:


    ```

    HashMap phonebook = new HashMap();

    ```


    Two things can be specified in a new hash map that control how efficient it is:
    the initial capacity and the load factor. These are set with two arguments, in
    that order:


    ```

    HashMap phonebook = new HashMap(30, 0.7F);

    ```


    The capacity is the number of buckets in which hash map values can be stored.
    The load factor is the number of buckets that can be used before the capacity
    automatically increases. The value is a floating point from 0 (empty) to 1 (full),
    so a 0.7 means that the buckets are 70 percent full, The defaults are a capacity
    of 16 and load factor of .75, which are often sufficient.


    These statements are putting Long objects in the hash map using Long values. This
    would have been an error in early versions of Java, because a primitive type like
    long couldn''t be used where an object was required.


    Generics should be used to identify the classes of the keys and values. They are
    placed within < > characters and the class names are separated by a comma, as
    in this example:


    ```

    HashMap<String, Long> phonebook = new HashMap<>();

    ```


    But it''s no longer an error because of autoboxing and unboxing, a feature of
    Java that automatically converts between primitive types and their equivalent
    object classes. When the compiler sees a long 800288372, it converts it to a Long
    object for that value.


    This creates a hash map called phonebook with keys that are strings and values
    that are Long objects. The second set of < and > characters is empty, which assumes
    the same classes as those in the previous < and on the statement.


    Objects are stored in a hash map by calling its put(Object, Object) method with
    two argument: the key and value:


    ```

    phonebook.put("Butter Turkey Line", 800288372);

    ```


    This stores an item in the map with the key "Butter Turkey Line" and a Long object
    for the value 800288372, the phone number of service.


    An object can be retrieved from the map with its key calling get(Object) with
    the only argument:


    ```

    int number = phonebook.get("Butter Turkey Line");

    ```


    The get() method returns null if there''s no value matching that key. This would
    cause a problem with the preceding example, because null is not a suitable long
    value.'
