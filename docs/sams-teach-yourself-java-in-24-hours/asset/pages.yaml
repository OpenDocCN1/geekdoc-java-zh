    The size of the frame can be established by calling its `setSize(int, int)` method
    with two arguments: the width and height. The following statement sets up a frame
    that is 350 pixels wide and 125 pixels tall:

    `setSize(350, 125)`


    Another way to set the size of a frame is to fill it with components and then
    call the frame’s `pack()` method with no arguments:

    `pack()`


    The `pack()` method sets the frame big enough to hold the preferred size of each
    component inside the frame (but no bigger). Every interface component has a preferred
    size, though this is sometimes disregarded, depending on how components are arranged
    within an interface. You don''t need to explicitly set the size of a frame before
    calling `pack()`—the method sets it to an adequate size before the frame is displayed.


    Every frame is displayed with a button along the title bar that can be used to
    close the frame. On a Windows system, this button appears as an X in the upper-right
    corner of the frame. To define what happens when this button is clicked, call
    the frame’s `setDefaultCloseOperation(int)` method with one of four JFrame class
    variables as the argument:


    +   - EXIT_ON_CLOSE—Exit the program when the button is clicked.

    - DISPOSE_ON_CLOSE—Close the frame and keep running the application.

    - DO_NOTHING_ON_CLOSE—Keep the frame open and continue running.

    - HIDE_ON_CLOSE—Close the frame and continue running.'
