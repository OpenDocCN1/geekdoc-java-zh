  md: '# Workshop


    # Q&A


    Q. How can I set the value of the string variable to be blank?


    A. Use an empty string, a pair of double quotation marks without any text between
    them. The following code creates a new string variable called georgeSays and sets
    it to nothing:


    ```

    String georgeSays = "";

    ```


    Q. I can''t seem to get theUpperCase() method to change a string so it''s all
    capital letters. What am I doing wrong?


    A. When you call a string object''s toUpperCase() method, it doesn''t actually
    change the string it is called. Instead, it creates a new string that is set in
    all uppercase letters. Consider the following statements:


    ```

    String firstName = "Baz";

    String changeName = firstName.toUpperCase();

    System.out.println("First Name: " + changeName);

    ```


    These statements display the text "First Name: Baz" because firstName contains
    the original string. If you switched the last statement to display the changeName
    variable instead, it would output "First Name: BAZ".


    Strings do not change in value in Java after they are created.


    Q. Do all methods in Java true or false in the same way that the equals() method
    works in relation to strings?


    A. Methods have different ways of producing a response after they are used. When
    a method sends a back value, as the equals() method does, it''s called returning
    a value. The equals() method is set to return a Boolean value. Other methods might
    return a string, an integer, another type of variable, or nothing at all—which
    is represented by void.


    Q. Why do schools assign the letters A, B, C, D, and F but not E?


    A. The letter grade E was already used in an alternative grading system. Until
    the mid-20th century, in the United States the most popular grading system was
    to assign E for excellent, S for satisfactory, for needs improvement, or U for
    the dreaded unsatisfactory. So when the ABCD system came along, giving a failing
    student an E considered a not-so-excellent idea.


    ESNU grading remains in wide use in elementary schools.'
