  md: '# HOUR 24

    Writing Android Apps


    Java''s a general-purpose programming language that can run on a wide variety
    of platforms. One of those platforms has arisen in recent years to become an enormously
    successful spark for new Java development.


    The Android operating system, which started out on cell phones and has spread
    to a variety of devices, exclusively runs programs written in Java.


    These programs, called apps, are built on an open source mobile platform that
    is completely free for developers to build on. Anyone can write, deploy, and sell
    Android apps.


    During this hour, you learn about how Android came about, what makes it special,
    and why so many programmers are developing on the platform. You also create an
    app and run it on an Android phone (if you own one) and an emulator (if you don''t).


    +   - Learn why Android was created.

    - Create an Android app.

    - Learn how an Android app is structured.

    - Run an app on an emulator.

    - Run an app on an Android phone.


    # Introduction to Android


    Android was launched by Google in 2007, two years after it acquired the technology,
    as part of an industry-wide effort to establish a new mobile phone platform that
    was nonproprietary and open, unlike the technology that drives RIM BlackBerry
    and Apple iPhone. Some of the biggest names in mobile phones and technology—Google,
    Intel, Motorola, Nvidia, Samsung, and other companies—formed the Open Handset
    Alliance to promote the new platform for mutual benefit.


    Google released the Android Software Development Kit (SDK), a free set of tools
    for developing Android apps. The first phone running Android, the T-Mobile G1,
    came out in June 2008.'
