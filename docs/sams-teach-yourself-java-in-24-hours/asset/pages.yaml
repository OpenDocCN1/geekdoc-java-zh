    of how long it took to add spell-checking functionality to your project and use
    it to make personal long-distance calls from the office.


    When Java was introduced, the system of sharing objects was largely an informal
    one. Programmers developed their objects to be as independent as possible and
    protected them against misuse through the use of private variables and public
    methods to read and write these variables.


    Sharing objects becomes more powerful when there''s a standard approach to developing
    reusable objects.


    The benefits of a standard include the following:


    +   - There''s less need to document how an object works because anyone who knows
    the standard already knows a lot about how it functions.


    +   - You can design development tools that follow the standard, making it possible
    to work more easily with these objects.


    +   - Two objects that follow the standard are able to interact with each other
    without special programming to make them compatible.


    # Storing Objects of the Same Class in Array Lists


    An important decision to make when writing a computer program is where to store
    data. In the first half of this book, you''ve discovered three useful places to
    keep information:


    +   - Basic data types such as int and char


    +   - Arrays


    +   - String Objects


    There are far more places to store information, because any Java class can hold
    data. One of the most useful is ArrayList, a data structure that holds objects
    of the same class.'
