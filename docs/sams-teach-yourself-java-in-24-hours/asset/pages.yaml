    # Running the App


    Now that you have an Android emulator and a debug configuration, you can run your
    first app. Click SalutonMondo, the top item in the Package Explorer, and then
    click the debug icon in the Eclipse toolbar.


    The Android emulator loads in its own window. This can take a minute or more,
    so wait patiently as the fake phone boots up.(The emulator loads so slowly it
    gives you time to ponder a Chinese proverb: "The oxen are slow, but the earth
    is patient.")


    The app you have installed will appear with an Android icon and the label SalutonMondo.
    Click the icon to run the app.


    The emulator displays "SalutonMondo" as the text and title bar of the app, as
    shown in Figure 24.7. Controls enable the emulator to be used like a phone, but
    with a mouse instead of your finger. Click the back button to close the app and
    see how the Android device is emulated.


    An emulator can do many of the things a real device can do, including connect
    to the Internet if the computer has an active connection. It can also receive
    phone calls and SMS messages.


    Because it''s not a fully functional device, the apps that you develop must be
    tested on actual Android phones and tablets.'
