  md: '# # HOUR 2

    Writing Your First Program


    As you learned during Hour 1, “Becoming a Programmer,” a computer program is a
    set of instructions that tell a computer what to do. Instructions are given to
    a computer using a programming language.


    During this hour, you create your first Java program by entering into a text editor.
    When that''s done, you save the program, compile, and test it out. Then you break
    it on purpose and fix it again, just to show off.


    +   THIS HOUR''S TO-DO LIST:

    * Type a Java program into a text editor.

    * Organize a program with bracket marks.

    * Store information in a variable.

    * Display the information in a variable.

    * Save, compile, and run a program.


    # ## What You Need to Write Programs


    As explained in Hour 1, to create java programs, you must have a programming tool
    that supports the Java Development Kit (JDK) such as the NetBeans integrated development
    environment (IDE). You need a tool that can compile and run Java programs and
    a text editor to write those programs.


    With most programming languages, computer programs are written by entering into
    a text editor (also called a source code editor). Some programming languages come
    with their own. NetBeans includes its own editor for writing Java programs.


    Java programs are simple text files without any special formatting, such as centered
    text or boldface text. The NetBeans source code editor functions like a simple
    text editor with extremely useful enhancements for programmers. Text turns different
    colors as you type to identify different elements of the language. NetBeans also
    indents lines and provides helpful programming documentation inside the editor.'
