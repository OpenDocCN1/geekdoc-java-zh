    \n```\nprincipal = Float.parseFloat(loanText) * 1.1F;\ncatch (Exception e) {\n\
    \    System.out.println(\"Error \" + e.getMessage());\n    throw e;\n}\n```\n\n\
    That final keyword in catch causes throw to behave differently. The specific class\
