    # Hash Maps


    The ability to use one piece of information to access another is

    common in programming. An array list is the simplest example of

    among the data structures, where an index number can be used to

    retrieve one object from the list. Here''s an example that pulls the first

    string from the aristocrats array list:


    ```

    String first = aristocrats.get(0);

    ```


    Arrays also use index numbers to retrieve each item in the array.


    Hash maps are a data structure in java that use an object to retrieve

    another object. The first object is the key and the second is the value.

    They are implemented as the HashMap class in the java.util package.


    The name refers to how keys are mapped to values. An example of

    this kind of structured data is a phone book. A person''s name (a

    string) can be used to retrieve the person''s phone number.'
