  md: '# # HOUR 9

    # Storing Information with Arrays


    No one benefited more from the development of the computer than Santa Claus. For
    centuries, humankind has put an immense burden on him to gather and process information.
    Old St. Nick has to keep track of the following things:


    +   * Naughty children

    * Nice children

    * Gift requests

    * Homes with impassable chimneys

    * Women who want more from Santa than Mrs. Claus will let him give

    * Countries that shoot unidentified aircraft first and ask questions later


    +   THIS HOUR''S TO-DO LIST:

    * Create an array.

    * Set the size of an array.

    * Give a value to an array element.

    * Change the information in an array.

    * Make multidimensional arrays.

    * Sort an array.


    Computers were a great boon to the North Pole. They are ideal for the storage,
    categorization, and study of information.


    The most basic way that information is stored in a computer program is by putting
    it into a variable. So far, all variables you''ve worked with have been a single
    item of information, such as a floating-point number or a string.


    Santa''s list of nice children is an example of a larger collection of similar
    information. To keep track of a list of this kind, you can use arrays.


    An array is a group of related variables that share the same type. Type of information
    that can be stored as a variable can become the items stored in an array. Arrays
    can be used to keep track of more sophisticated types of information than a single
    variable, but they are almost as easy to create and manipulate.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Creating Arrays


    Arrays are variables grouped together under a common name. The term array should
    be familiar to you—think of a salesperson showing off her array of products or
    a game show with a dazzling array of prizes. Like variables, arrays are created
    by stating the type of variable being organized into the array and the name of
    the array. A pair of square brackets follow the type to distinguish arrays from
    variables.


    You can create arrays for any type of information that can be stored as a variable.
    For example, the following statement creates an array of string variables:


    ```

    String[] naughtyChild;

    ```


    Here are two more examples:


    ```

    int[] reinderWeight;

    boolean[] hostileAirTravelNations;

    ```


    The previous examples create arrays, but they do not store any values in them.
    To do this, you can use the new keyword along with the variable type or store
    values in the array within ( and ). When using new, you must specify how many
    different items are stored in the array. Each item in an array is called an element.
    The following statement creates an array and sets aside space for the values it
    holds:


    ```

    int[] elfSeniority = new int[250];

    ```


    This example creates an array of integers elfSeniority. The array has 250 elements
    that store the months that Santa''s elves have been employed at the Pole (If Santa
    runs a union shop, this information is extremely important to track)


    When you create an array with the new statement, you must specify the number of
    elements. Each element of the array has an initial value that depends on the type
    of the array. All numeric arrays have the initial value 0, char arrays equal ''\0'',
    and boolean arrays have the value false. A String array and all other objects
    are created with the initial value null.


    For arrays that are not extremely large, you can set their initial values at the
    same time that you create them. The following example creates an array of strings
    and gives them initial values:


    ```

    String[] reinderNames = {"Dasher", "Prancer", "Vixen", "Comet", "Cupid", "Donder",
    "Blitzen"};

    ```


    Java is flexible about where the square brackets are placed when an array is created.
    You can put them after the variable name instead of the variable type, as in the
    following:

    String niceChild[];nTo make arrays easier for humans to spot in your programs,
    you should stick to one style rather than switching back and forth. Programs that
    use arrays in this book always place the brackets after the variable or object
    type.'
  merge: -1
