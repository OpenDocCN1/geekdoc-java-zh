  md: '# Labels and Text Fields


    A JLabel component displays information that the user cannot modify. This information
    can be text, a graphic, or both. These components are often used to label other
    components in an interface, hence the name. They often identify text fields.


    A JTextField component is an area where a user can enter a single line of text.
    You can set up the width of the box when you create the text field.


    The following statements create a JLabel component and JTextField component and
    add them to a container:


    ```

    JLabel pageLabel = new JLabel("Web page address: \ JLabel.RIGHT);

    JTextField pageAddress = new JTextField(20);

    FlowLayout flo = new FlowLayout();

    setLayout(flo);

    add(pageLabel);

    add(pageAddress);

    ```


    Figure 13.3 shows this label and text field side-by-side. Both of the statements
    in this example use an argument to configure how the component should look.


    The pageLabel label is set up with the text "Web page address:" and a JLabel.RIGHT
    argument. This last value indicates that the label should appear flush right.
    JLabel.LEFT aligns the text flush left, and JLabel.CENTER centers it. The argument
    used with JTextField indicates the text field should be approximately 20 characters
    wide. You can also specify default text that appears in the text field with a
    statement such as the following:


    ```

    JTextField country = new JTextField("Togolese Republic", 29);

    ```'
