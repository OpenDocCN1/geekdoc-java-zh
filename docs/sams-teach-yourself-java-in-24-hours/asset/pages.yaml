    # FIGURE 25.3


    The Java Virtual Machine can''t be found.


    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_417_1.png)


    The Java Virtual Machine is in a file called java.exe, which is in the bin subfolder
    of the folder where Java is installed on your computer. When the java command
    is not recognized, this means the computer doesn''t know where to find java.exe.


    On a Windows system, this problem can be fixed by adding the name of the folder
    that contains java to a Control Panel setting called Path environmental variable.


    First, find your Java folder. Go to the top-level folder of your hard drive; then
    open the Program Files or Program Files (x86) folder to see if one contains a
    Java subfolder. If you find it, open that folder.


    The Java folder may contain several versions of the Java Development Kit (JDK),
    with a version number. On my computer, there are jdk1.7.0_21 and jdk1.8.0 folders.
