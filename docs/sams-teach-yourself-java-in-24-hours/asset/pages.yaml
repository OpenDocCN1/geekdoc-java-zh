  md: '# HOUR 2: Writing Your First Program


    # LISTING 2.1 The Saluton Program


    ```

    1: package com.java24hours;

    2:

    3: class Saluton

    4:     public static void main(String[] arguments) {

    5:     // My first Java program goes here

    6:     }

    7: }

    ```


    Make sure to capitalize everything exactly as shown, and use your spacebar or
    Tab key to insert the blank spaces in front of Lines 4–6. When you''re done, choose
    File, Save to save the file.


    At this point, Saluton.java contains the bare-bones of a Java program. You will
    create many programs that start exactly like this one, except for the word Saluton
    on Line 3. This word represents the name of your program and changes with each
    program you write. Line 5 should make sense to you, because it''s a sentence in
    actual English. The rest is probably new to you.


    # The class Statement


    The first line of the program is the following:

    package com.java24hours;


    > A package is a way to group Java programs together. This line tells the computer
    to make com.java24hours the package name of the program.


    After a blank line, the third line is:

    class Saluton {


    Translated into English, it means, "Computer, give my java program the name Saluton."


    As you might recall from Hour 1, each instruction you give a computer is called
    a statement. The class statement is the way you give your program a name. It is
    also used to determine other things about the program, as you will see later.
    The significance of the term class is that Java programs are also called classes.


    In this example, the program name Saluton matches the document''s filename, Saluton.java.
    A Java program must have a name that matches the first part of its filename and
    should be capitalized the same way.'
