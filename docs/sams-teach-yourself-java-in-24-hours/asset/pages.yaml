    begins.


    +   - Line 5—The startTime variable is created with the current time in milliseconds
    as its value, measured by calling the currentTimeMillis() method of Java’s System
    class.


    +   - Line 6—The endTime variable is created with a value of 60,000 higher than
    startTime. Since one minute equals 60,000 milliseconds, this sets the variable
    one minute past startTime.


