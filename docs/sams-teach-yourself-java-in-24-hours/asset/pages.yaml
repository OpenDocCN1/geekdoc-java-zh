  md: '# HOUR 2: Writing Your First Program


    # TIP


    Beans can help you figure out where a block begins and ends. Click one of the
    brackets in the source code of the Saluton program. The bracket you clicked turns
    yellow along with its corresponding bracket. The Java statement enclosed within
    the two brackets is a block. This tip is not useful on a short program like Saluton,
    but as you write much longer programs, it helps you avoid looking like a blockhead.


    This block begins with the main statement. The lines inside the main statement''s
    block will be run when the program begins.


    The following statement is the only thing located inside the block:


    ```

    // My first Java program goes here

    ```


    This is a placeholder. The // at the beginning of the line tells the computer
    to ignore this line because it was put in the program solely for the benefit of
    humans who are looking at the source code. Lines that serve this purpose are called
    comments.


    Right now, when you write a Java program. It can be compiled, but if you run it,
    nothing happens. The reason is that you haven''t told the computer to do anything
    yet. The main statement contains only a single comment, which is ignored by the
    computer. You must add some statements inside the opening and closing brackets
    of the main block.


    # Storing Information in a Variable


    In the programs you write, you need a place to store information for a brief period
    of time. You can do this by using a variable, a storage place that can hold information
    as integers, floating-point numbers, true-false values, characters, and lines
    of text. The information stored in a variable can change, which is how it gets
    the name variable.


    In the Saluton.java file, replace Line 5 with the following:


    ```

    String greeting = "Saluton mondo!";

    ```


    This statement tells the computer to store the text "Saluton mondo! in a variable
    called greeting.


    In a Java program, you must tell the computer what type of information a variable
    will hold. In this program, greeting is a string—a line of text that can include
    letters, numbers, punctuation, and other characters. Putting String sets up the
    variable to hold string values.


    When you enter this statement into the program, a semicolon must be included at
    the end of the line. Semicolons end each statement in a Java program. They are
    like the period at the end of a sentence. The computer uses them to determine
    when one statement ends and the next begins.'
