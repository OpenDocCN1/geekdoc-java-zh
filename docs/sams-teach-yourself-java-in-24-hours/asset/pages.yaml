  md: '# Designing a Real App


    Android apps can exploit all of the device''s functionality, such as SMS messaging,
    location-based services, and touch input. In this book''s final programming project,
    you create a real app called Take Me to Your Leader.


    This app takes advantage of an Android''s phone capabilities to make a phone call,
    visit a website, and load a location in Google Maps. The app puts you in touch
    with the White House via phone, Web, and maps. (If the president of the United
    States is not your leader, the app can be customized.)


    To get started, you create a new project in Eclipse by performing these steps:


    +   1. Click File, New, Android Application Project. The New Android Application
    wizard opens.


    +   2. In the Application Name field, enter Leader. This will also enter automatically
    in the Project Name field.


    +   3. In the Package Name field, enter org.cadhead.android.


    +   4. In the Minimum Required SDK and Target SDK drop-downs, choose API 19, and
    then click Next to see more project options.


    +   5. Make sure these three check boxes are selected: Create Custom Launcher
    Icon, Create Activity, and Create Project in Workspace.


    +   6. Click Next to see questions about the application''s icons.


    +   7. Click Next to accept these defaults.


    +   8. Choose Fullscreen Activity; then click Next.


    +   9. In the Activity Name field, enter LeaderActivity.


    +   10. Click Finish.


    This project covers a lot of ground. As you work through it, you''ll find it handy
    to keep a browser open to the Android Developer site''s reference section at http://developer.android.com/reference.
    You can search for the Java classes in the Android class library and the filenames
    of the files in the project to learn more.


    The project appears in the Eclipse Package Explorer, as does the SalutMondo project.
    To avoid confusion, you should close SalutMondo before proceeding. Right-click
    SalutMondo in the Package Explorer; then choose Close Project from the pop-up
    menu.'
