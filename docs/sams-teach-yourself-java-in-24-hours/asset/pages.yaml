  md: '# HOUR 1: Becoming a Programmer


    To achieve this goal, this book uses the English language as much as possible
    instead of technical jargon or obscure acronyms. All new programming terms are
    thoroughly explained as they are introduced.


    If I''ve succeeded, you will finish this book with enough programming skills to
    be a danger to yourself and others. You''ll be able to write programs, dive into
    programming classes with more confidence, and learn new languages more easily.
    (Programming languages, I mean. This book won''t help you master Spanish, Esperanto,
    or Klingon.)


    You also will have skills with Java, the most widely used programming language
    on the planet.


    The first hour of this book provides an introduction to programming and guidance
    on how to set up your computer so you can use it to run and write Java programs.


    # Choosing a Language


    If you''re comfortable enough with a computer to prepare a nice-looking résumé,
    balance a checkbook, or share your vacation photos on Facebook, you can create
    computer software.


    The key to learning how to program is to start with the right language. The programming
    language you choose often depends on the tasks you want to accomplish. Each language
    has strengths and weaknesses. Back in my day, young whispersnappers, people learned
    to program with some form of the BASIC language because it was created with beginners
    in mind.


    The most popular language that employs BASIC today is Visual BASIC.NET, a programming
    language and set of development tools from Microsoft that has moved far beyond
    its roots. VB.NET, as it is called, is designed for creating programs to run on
    computers and mobile devices that use a Windows operating system. Other popular
    language is PHP, a scripting language for creating websites. Other widely used
    languages you may have heard about are C++, C#, Ruby, and Python.


    Each of these languages has its adherents, the most widely taught in computer
    science classes at the high school and collegiate level is Java.


    The BASIC language was invented to be easy for students to learn (the B in BASIC
    stands for Beginner''s). The downside de to using some form of BASIC is that it''s
    easy to fall into sloppy programming habits with the language.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'The Java programming language, which is offered by Oracle, is more difficult
    to learn some languages such as VB.NET and PHP, but it''s a good starting place
    for several reasons. One advantage of learning Java is that you can use it across
    a variety of operating systems and computing environments. Java programs can be
    desktop software, web applications, Internet servers, Android apps, and on Windows,
    Mac, Linux, and other operating systems. This versatility is referenced by the
    ambitious early Java slogan: "Write once, run anywhere."


    Another advantage is that Java requires a highly organized approach for getting
    programs to work. You must be particular how you write programs and how they store
    and alter data.


    When you start writing Java, you might not see the language''s persnickety behavior
    as an advantage. You might tire writing a program and having several errors to
    fix before the program can be run. The benefit of this effort is that the software
    becomes more reliable, useful, and error-free.


    In the coming hours, you will learn all of Java''s rules and the pitfalls to avoid.


    Java was invented by the Canadian scientist James Gosling as a better way to create
    computer programs. While working at Sun Microsystems in 1991, Gosling was unhappy
    with the way the C++ programming language was performing on a project, he created
    a new language that did the job better. It''s a matter of contentious debate whether
    Java is superior to other programming languages, course, but the success of the
    language demonstrates the strength of his initial design. Three billion devices
    across the world are running Java, a number so amazing I am going to repeat it.
    Three billion! More than 1,000 books have been published about the language since
    its introduction. (This is my eighteenth.)


    Regardless of whether Java is the best language, it is definitely a good language
    to learn. You get your first chance to try out Java during Hour 2, "Writing Your
    First Program."


    Learning one programming language makes it easier to learn subsequent languages.
    Many are similar to each other, so you''re not starting from scratch when you
    plunge into a new one. For instance, C++ and Smalltalk programmers find it easy
    to learn Java because Java borrows ideas from earlier languages. Similarly, C#
    adopts ideas from Java, so it''s easier to pick up for Java programmers.


    Early Java critics had a flatter slogan: "Write once, debug everywhere." The language
    has a long way, baby, the first version was released in 1996.


    C++ is mentioned several times this hour, so you might be tripping over the term
    wondering what it means—and how it''s pronounced. C++ is pronounced "C-Plus-Plus,"
    and it''s a programming language developed by Danish scientist James Stroustrup
    at Bell Laboratories. It is the C programming language, the Plus-Plus part of
    the name. Why not just call it C? The Plus-Plus is a computer program you''ll
    understand later in this book.'
  merge: -1
  pgno: 14
