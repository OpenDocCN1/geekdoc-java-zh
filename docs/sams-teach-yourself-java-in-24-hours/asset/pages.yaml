  md: '# Workshop


    # Q&A


    +   Q. The if statement seems like the one that''s most useful. Is it possible
    to use only if statements in programs and never use the others?


    +   A. It''s possible to do without else or switch, and many programmers never
    use the ternary operator ?. However, else and switch often are beneficial to use
    in your programs because they make the programs easier to understand. A set of
    if statements chained together can become unwieldy.


    +   Q. During this hour, opening and closing brackets { } sometimes are not used
    with an if statement if it is used in conjunction with only one statement. Isn''t
    it mandatory to use brackets?


    +   A. No. Brackets can be used as part of any statement to surround the part
    of the program that''s dependent on the conditional test. Using brackets is a
    good practice to get into because it prevents a common error that might take place
    when you revise the program. If you add a second statement after an if conditional
    and don''t add brackets, unexpected errors occur when the program is run.


    +   Q. Does break have to be used in each section of statements that follow a
    case?


    +   A. You don''t have to use break. If you do not use it at the end of a group
    of statements, all the remaining statements inside the switch block are handled,
    regardless of the case value they are being tested with.


    However, in most cases you''re likely to want a break statement at the end of
    each group.


    +   Q. Why did the Thompson Twins get that name when they were not related, and
    none of them was named Thompson?


    +   A. Band members Tom Bailey, Alannah Currie, and Joe Lee called themselves
    the Thompson Twins in honor of Thompson and Thompson, a pair of bumbling detectives
    featured in the Belgian comics The Adventures of Tintin.


    The bowler-detecting detectives were physically indistinguishable except for a
    minor difference in the shape of their mustaches. Despite being terrible at their
    jobs, they were inexplicably assigned to important and sensitive missions. They
    often pursued Tintin for crimes that he did commit.


    As their names would indicate, the detectives were not related either.'
