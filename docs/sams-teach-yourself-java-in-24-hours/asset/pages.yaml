  md: '# Handling Errors in a Program


    Unchecked exceptions are all subclasses of RuntimeException in the java.lang package.
    A common example of an unchecked exception is IndexOutOfBoundsException, which
    indicates that the index used to access an array, string, or array list is not
    within its boundaries. If an array has five elements and you attempt to read element
    number 10, this exception occurs.


    Another is a NullPointerException, which occurs when an object that has no value
    is used. Object variables also return null when an object is assigned an object.
    Some methods also return null when an object can be returned. If a statement incorrectly
    assigns an object has a value, a NullPointerException occurs.


    Both of these errors are things a programmer could (and should) prevent in the
    code, not things that require exception handling. If you write a program that
    accesses an out-of-bounds array element, the code that does this will recompile.
    If you expect an object and it equals null, check for that with an if conditional
    before using the object.


    The rationale for unchecked exceptions in Java is that they either can be prevented
    by well-written code, or could occur so often that catching them all the time
    would make programs unnecessarily complex. A NullPointerException could occur
    in every statement in a program where an object''s methods are called.


    Of course, just because an exception can be ignored doesnt mean it should be.
    You still have the option of try, catch, and throws with unchecked exceptions.


