  md: '# # HOUR 8

    Repeating an Action with Loops


    One of the more annoying punishments for schoolchildren is to make them write
    something over and over again on a chalkboard. On The Simpsons, in one of his
    frequent trips to the board, Bart Simpson had to write, “Organ transplants are
    best left to professionals,” dozens of times. This punishment might work on children
    but would be completely useless on a computer. A computer program can repeat a
    task with ease.


    Programs are ideally suited to do the same thing over and over because of loops.
    A loop is a statement or block that is repeated in a program. Some loops run a
    fixed number of times. Others run indefinitely.


    There are three loop statements in Java: for, do, and while. Each can work like
    the others, but it''s beneficial to learn how all operate. You often can simplify
    a loop section of a program by choosing the right statement.


    +   THIS HOUR''S TO-DO LIST:

    - Use the for loop.

    - Use the while loop.

    - Use the do-while loop.

    - Exit a loop prematurely.

    - Name a loop.


    # for Loops


    In your programming, you find many circumstances in which a loop is useful. You
    can use them to keep doing something several times, such as when an antivirus
    program opens each new email as it comes in look for viruses. You can also use
    loops to cause the computer to do nothing for a brief period, such as an animated
    clock that displays the current time once per minute.


    A loop statement causes a computer program to return to the same place more than
    once, like a stunt plane completing an acrobatic loop.'
