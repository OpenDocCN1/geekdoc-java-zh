  md: "# # Stopping a Thread\n\nThe LinkRotator application does not have a way to\
    \ stop the thread, but it has been designed in a way that would make it simple\
    \ to do so. Here's one method that could be called to end execution of the thread:\n\
    \n```\npublic void stop() {\n  if (runner == null) {\n    runner = null;\n  }\n\
    }\n```\n\nThe if statement tests whether the runner object is equal to null. If\
    \ it is, there isn't an active thread that needs to be stopped. Otherwise, the\
    \ statement sets runner equal to null.\n\nSetting the runner object to a null\
    \ value causes it to have a different value than the thisThread object. When this\
    \ happens, the while loop inside the run() method stops running.\n\n# # Summary\n\
    \nThreads are a powerful concept implemented with a small number of classes and\
    \ interfaces in Java. By supporting multithreading in programs, you make them\
    \ more responsive and can speed up how quickly they perform tasks.\n\nEven if\
    \ you learned nothing else from this hour, you now have a new term to describe\
    \ your frenzied lifestyle. Use it in a few sentences to see if it grabs you:\n\
    \n+   - Boy, I was really multithreading yesterday after we held up that string\
    \ of liquor stores.\"\n\n+   - \"Multithreaded all through lunch, and it gave\
    \ me gas.\"\n\n+   - \"Not tonight, dear, I'm multithreading.\""
