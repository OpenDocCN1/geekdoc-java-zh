  md: "# Change Listeners\n\nTo monitor slider input, you must have a class that implements\
    \ the ChangeListener interface in the javax.swing.event package. This interface\
    \ includes only one method:\n\n```\npublic void stateChanged(ChangeEvent event)\
    \ {\n    // statements to handle the event\n}\n```\n\nTo register an object as\
    \ a change listener, the addChangeListener(Object) method of the container that\
    \ holds the slider. When the slider is moved, the listening object's stateChanged()\
    \ method is called.\n\nThis method is called with a ChangeEvent object that can\
    \ identify the slider component that changed in value. Call the object's getSource()\
    \ and cast the object to a JSlider, as in the following statement:\n\n```\nJSlider\
    \ changedSlider = (JSlider) event.getSource();\n```\n\nIn this example, event\
    \ is the ChangeEvent object that is an argument to the stateChanged() method.\n\
    \nChange events occur throughout a slider's movement. They begin when the slider\
    \ is first moved, and they don't stop occurring until the slider has been released.\
    \ For this reason, you might not want to do anything in the stateChanged() method\
    \ until the slider has stopped moving.\n\nTo see if a slider is currently moving\
    \ around, call the getValueAdjusting() method. This method returns true while\
    \ movement is taking place and false otherwise.\n\nThis technique is demonstrated\
    \ in your next project, a Java application that uses three sliders to choose a\
    \ color. Colors are created in Java by using the Color class in the java.awt package.\n\
    \nOne way to create a Color is to specify the amount of red, green, and blue in\
    \ the color. Each of these can be an integer from 0 to 255 with 255 representing\
    \ the maximum amount of that color.\n\nThe following statement creates a Color\
    \ object that represents the color butterscotch:\n\n```\nColor butterscotch =\
    \ new Color(255, 204, 128);\n```"
