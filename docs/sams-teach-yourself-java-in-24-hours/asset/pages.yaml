    If this seems confusing, think of the hierarchy as a family tree. JApplet

    inher from its parent, the parent''s parent, and on upward. It even

    in inherit some things from its great-great-great-grandparent,

    Object. The JApplet class doesn''t inherit from its siblings or cousins,

    however.


