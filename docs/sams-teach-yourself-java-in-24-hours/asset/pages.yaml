  md: '# Quiz


    After the LottoMadness program has soured you on games of chance, play a game
    of skill by answering the following questions.


    +   1. Why are action events called by that name?

    - A. They occur in reaction to something else.

    - B. They indicate that some kind of action should be taken in response.

    - C. They honor cinematic adventurer Action Jackson.

    A. They occur in reaction to something else.

    B. They indicate that some kind of action should be taken in response.

    C. They honor cinematic adventurer Action Jackson.


    +   2. What does this signify as the argument to an addActionListener() method?

    - A. this listener should be used when an event occurs.

    - B. this takes precedence over others.

    - C. this object handles the events.

    A. this listener should be used when an event occurs.

    B. this takes precedence over others.

    C. this object handles the events.


    +   3. Which text component stores user input as integers?

    - A. J JTextField

    - B. JTextArea

    - C. Neither A nor B

    A. J JTextField

    B. JTextArea

    C. Neither A nor B


    # Answers


    +   1. B. Action events include the click of a button and the selection of an
    item from a pull-down menu.


    +   2. C. The this keyword refers to the current object. If the name of the object
    is used as an argument instead of the this statement, that object would receive
    the events and be expected to handle them.


    +   3. C. J JTextField and JTextArea components store their values as text, so
    you must convert their values before you can use them as integers, floating point
    numbers, or other nontext values.'
