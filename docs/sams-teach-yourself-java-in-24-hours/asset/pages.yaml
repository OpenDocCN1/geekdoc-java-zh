  md: '# Workshop


    # Q&A


    +   Q. How are components arranged if I don''t assign a layout manager to a container?


    +   A. In a simple container such as a panel, components are arranged using FlowLayout
    by default. Each component is added in the same manner that words are displayed
    on a page in English, from left to right, then down to the next line where there''s
    no more room. Frames, windows, and applets use the BorderLayout layout style you
    learn during the hour.


    +   Q. Why do so many of the graphical user interface classes have names preceded
    by “J,” such as JFrame and JLabel?


    +   A. These classes are part of the Swing framework, which was the second attempt
    at graphical user interface classes in the Java class library. The Abstract Window
    Toolkit (AWT) was first, and it had simpler class names, as Frame and Label.


    The AWT classes belong to the java.awt package and related packages, while Swing
    classes belong to javax.swing and the like, so they could have the same class
    names. The use of the “J” names keeps the classes from being mistaken for each
    other.


    Swing classes are called Java Foundation Classes (JFC).


    +   Q. Where can I buy uncut sheet of $1 bills?


    +   A. The U.S. Bureau of Engraving and Printing sells sheets of real $1, $10,
    $20, and $50 bills at the website www.moneyfactorystore.gov.


    A sheet of 32 $1 bills sells for $61, $10 bills for $249, 16 $20 bills for $409,
    and $50 bills for $900. The money is actual currency, these purchases are cheaper
    if you factor in the face value of those bills. You''re paying an extra $29 for
    the ones, $89 for the tens, $89 for the twenties, and $100 for the fifties.


    There''s also a five-pound bag containing $10,000 of shredded bills that sells
