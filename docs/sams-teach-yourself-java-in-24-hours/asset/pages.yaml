  md: '# 25: Creating Minecraft Mods with Java


    way to add mods to the game, different servers have different ways to make this
    possible.


    The easiest to use when creating mods is CraftBukkit, a server from the Bukkit
    Project designed specifically for this purpose. CraftBukkit is free and can be
    downloaded from the website http://wiki.bukkit.org. On the site''s home page,
    scroll to the Downloads section of the page and look for two links with the labels
    CraftBukkit—Recommended Build and Bukkit API—Recommended Build (or something similar).


    CraftBukkit is the Minecraft server, which is a Java application packaged as a
    JAR file.


    Bukkit API is a set of Java packages that will be used when creating mods.


    The recommended builds are the latest versions of CraftBukkit and Bukkit that
    are fully tested and believed to be reliable by the project team. Click the Recommended
    Build links to download these two files, which have filenames that include their
    version numbers, such as craftbukkit-1.6.4-R2.0.jar and bukkit-1.6.4-R2.0.jar.


    When the downloads are complete, create a new folder on your computer and store
    these files in. On your Windows PC I created c:\minecraft\server and copied the
    two JAR files into it.


    Next, make a copy of the CraftBukkit JAR file you just downloaded in the same
    folder and rename it to craftbukkit.jar (in other words, remove all the version
    number information). This is the file you run to start the Minecraft server.


    The following command starts the server:


    ```

    java -Xms1024M -Xmx1024M -jar craftbukkit.jar

    ```


    This command tells the Java Virtual Machine to run the application packaged as
    the JAR file craftbukkit.jar, allocating 1,024MB of memory to the program.


    To avoid typing this command every time you run the server, you can create a batch
    or shell file that contains it and then run that file instead.


    On Windows, open a text editor such as Notepad and enter the text of Listing 25.1
    into the file, saving it as start-server.bat in the folder where you put craftbukkit.jar
    and bukkit.jar.'
