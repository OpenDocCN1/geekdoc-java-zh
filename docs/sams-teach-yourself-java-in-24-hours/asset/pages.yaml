    # Q&A


    +   Q. BASIC? C++? Smalltalk? Java? What are the names of these languages supposed
    to mean?


    +   A. BASIC gets its name from an acronym: Beginner''s All-purpose Symbolic Instruction
    Code. C++ is a programming language that was created to be an improvement on the
    C language, which itself was an improvement of the B programming language. Smalltalk
    is an innovative object-oriented language developed in the 1970s that had numerous
    ideas adopted by Java.


    Java goes against the tradition of naming a language with an acronym or other
    meaningful term. It''s just the name that Java''s developers like the best, beating
    out WebRunner, Silk, Ruby, and others. (The Ruby programming language didn''t
    exist back.)


    When I create my own programming language, it will be named Salsa.


    +   Q. Why are interpreted languages slower than compiled ones?


    +   A. They''re slower for the same reason that a person interpreting a live speech
    in a foreign language is slower than a translator interpreting a printed speech.
    The live interpreter has to think about each statement that''s being made as it
    happens, while the other interpreter can work on the speech as a whole and take
    shortcuts to speed up the process. Compiled languages can be much faster than
    interpreted languages because they do things to make the program run more efficiently.


    +   Q. Do you only answer questions about Java?


