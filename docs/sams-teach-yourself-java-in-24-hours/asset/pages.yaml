    The third argument to PotionEffect() sets the speed of the horse. It has a base
    value of 10 times the random number used to determine the horse''s color. Because
    the colors in the switch-case statement are ordered from lightest to darkest,
    the formula 10 + (coat * 10) causes horses to run faster the darker coloration.


