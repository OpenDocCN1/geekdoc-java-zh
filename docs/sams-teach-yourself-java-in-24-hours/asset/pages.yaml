    \ is not found, indexOf produces the value -1. If the string is found, indexOf\
    \ produces an integer that represents the position where the string begins. Positions\
    \ in a string are numbered upwards from 0, with the first character in the string.\
    \ In the string \"Sharkando\", the text \"nado\" begins at position 5.\n\nOne\
    \ possible use of the indexOf() method would be to search the entire script of\
