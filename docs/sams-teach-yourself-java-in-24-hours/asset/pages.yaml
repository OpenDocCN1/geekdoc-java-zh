  md: "# HOUR 20: Using Inner Classes and Closures\n\nThe right half of the lambda\
    \ expression defines the actionPerformed() method as a single statement that displays\
    \ information about the user interface component that triggered the event.\n\n\
    The left half of the expression declares that an ActionEvent object named act\
    \ is the argument to the method.\n\nThis object, act, is used inside the body\
    \ of the method. The left-half reference to act appears to be outside the scope\
    \ of the right-half implementation of the method. This is because closures allow\
    \ code to refer to the variables of another method outside the scope of those\
    \ variables.\n\nAs you can see, one effect of lambda expressions is that they\
    \ shorten code. A single expression creates an object and implements an interface.\n\
    \nThis new feature of Java can make the code even shorter through the language's\
    \ support for target typing.\n\nIn a lambda expression, it's possible to infer\
    \ the class of the argument or arguments sent to the method. Consider the last\
    \ example. The ActionListener functional interface has a method that takes an\
    \ ActionEvent object as its only argument, the name of that class can be omitted.\n\
    \nHere's a revised version of the lambda expression taking this into account:\n\
    \n```\nActionListener al = (act) -> {\n    System.out.println(act.getSource());\n\
    }\n```\n\nThe next two programs that you create should provide a more concrete\
    \ demonstration of the difference wrought by the introduction of closures to Java.\n\
