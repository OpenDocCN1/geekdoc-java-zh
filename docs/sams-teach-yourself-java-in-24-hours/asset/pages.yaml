    # Autoboxing and Unboxing


    Every one of the basic data types in Java has a corresponding object class: boolean
    (Boolean class), byte (Byte), char (Character), double (Double), float (Float),
    int (Integer), long (Long), and short (Short).


    For each of pairs, the information has identical value. The only difference between
    them is the format value it takes. An integer value such as 413 could be represented
    by either an int or an object of the Integer class.


    Java''s autoboxing and unboxing capabilities make it possible to use the basic
    data type and object forms of a value interchangeably.


    Autoboxing casts a simple variable value to the corresponding class.


    Unboxing casts an object to the corresponding simple value.'
