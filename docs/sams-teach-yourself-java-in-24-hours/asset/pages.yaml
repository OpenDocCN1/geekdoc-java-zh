    +   - The equals() method determines whether a JApplet object has the same value
    as another object.

    - The setBackground() method sets the background color of the applet window.

    - The add() method adds user interface components such as buttons and text fields
    to the applet.

    - The setLayout() method defines how the applet''s graphical interface is organized.


    The JApplet class can use all these methods, even though setLayout() is the only
    one it doesn''t inherit from another class. The equals() method is defined in
    Object, setBackground() comes from Component, and add() comes from Container.


    # Overriding Methods


    Some methods defined in the JApplet class of objects are also defined in one of
    its superclasses. For example, the update() method is part of both the JApplet
    class and the Component class. When a method is defined in a subclass and itsclass,
    the subclass method is used. This enables a subclass to change, replace, or completely
    wipe out of the behavior or attributes of its superclasses. In the case of update(),
    the purpose is to wipe out some behavior present in a superclass.


    Creating a new method in a subclass to change behavior inherited from a superclass
    is called overriding the method. You need to override a method any time the inherited
    behavior produces an undesired result.


    # Establishing Inheritance


    A class is defined as the subclass of another class using the extends statement,
    as in the following:


    ```

    class AnimatedLogo extends JApplet {

    }

    ```


    The extends statement establishes the AnimatedLogo class of objects as a subclass
    of JApplet. All Swing applets must be subclasses of JApplet.'
