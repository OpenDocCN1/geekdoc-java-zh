  md: '# Choosing a Java Programming Tool


    the whole thing before trying it out. If you find an error and fix it, you team
    must compile the program again.


    Java is unusual because it requires both a compiler and an interpreter. The compiler
    converts the statements that make up the program into bytecode that can be run
    by an interpreter called the Java Virtual Machine.


    The Java Virtual Machine, also called a JVM, is the thing that makes possible
    for the same Java program to run without modification on different operating systems
    and different kinds of computing devices. The virtual machine turns bytecode into
    instructions that the device''s operating system can execute.


    # When Programs Don''t Work


    Many new programmers become discouraged when they start to test their programs.
    Errors appear everywhere. Some of these syntax errors, which are identified by
    the computer as it looks at the program and becomes confused by the way a statement
    has been written. Other errors are logic errors, which are only noticed by the
    programmer as the program is being tested (or may be overlooked entirely). Logic
    errors often cause to do something unintended.


    As you begin writing your own programs, you become well-acquainted with errors.
    They''re a natural part of the process. Programming errors are called bugs, a
    term that dates back a century or more to describe errors in technical devices.


    The process of fixing errors also has its own term: debugging.


    It''s no coincidence that there are many ways to describe errors. You get a lot
    of debugging experience as you learn programming—whether you want it or not.


    > NOTE

    e of the first bugs was discovered in 1947 by a team that included the American
    computer scientist Grace Hopper. Hopper was testing a computer at Harvard when
    a relay malfunctioned. The cause turned out to be not a software problem but an
    actual bug. She debugged the computer by removing a death moth, which was taped
    into a logbook with the note, "First actual case of bug being found." The bug
    and logbook page can be viewed at www.duncio.navy.mil/CHIPS/ArticleDetails.aspx?id=3489.


    # Choosing a Java Programming Tool


    To start writing Java programs, you must have a java programming tool. Several
    such programs are available for Java, including the simple Java Development Kit
    and more sophisticated Eclipse, IntelliJ IDEA, and NetBeans. The latter three
    tools are each an integrated development environment (IDE), a powerful tool used
    by professional programmers to get work done.'
