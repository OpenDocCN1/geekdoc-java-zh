    (...).


    # The BorderLayout Manager


    The BorderLayout class, also in java.awt, arranges components at specific positions
    within the container that are identified by one of five directions: north, south,
    east, west, and center.


    The BorderLayout manages components into five areas: four denoted by compass directions
    and one the center area. When you add a component under this layout, the add()
    method includes a second argument to specify where the component should be placed.
    This argument should be one of five class variables of the BorderLayout class:
    north, south, east, west, and center are used for this argument.


    Like the GridLayout class, BorderLayout devotes all available space to the components.
    The component placed in the center is given all the space that is not needed for
    the border components, so it''s the largest.


    The following statements create a container that uses border layout:


    ```

    BorderLayout crisisLayout = new BorderLayout();

    setLayout(crisisLayout);

    ```


