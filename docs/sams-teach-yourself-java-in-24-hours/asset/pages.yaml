  md: '# Workshop


    # Workshop


    # Q&A


    +   Q. Why do some of the byte stream methods in this hour use integers as arguments?
    Should they be using byte arguments?


    +   A. There''s a difference between the bytes in a stream and the bytes represented
    by the byte class. A byte in Java has a value ranging from -128 to 127, while
    a byte in stream has a value from 0 to 255. You often have to use int when working
    with bytes for this reason—it can hold the values 128 to 255, whereas byte cannot.


    +   Q. What is Mumblety-Peg?


    +   A. It''s a schoolyard game played by children with pocketknives.

    In the simplest form, players stand and throw knives at their own feet. The one
    whose knife lands wins. Other versions throw the knife at each other so the opponent
    has to stretch a foot to where it lands. The player who stretches too far and
    falls losesnThe name comes from a rule that the winner could pound a peg into
    the ground with three blows of the knife. The loser had to "mumble the peg," removing
    it solely with his teeth.


    The game faded from popularity in the early 20th century when the world reached
    the collective realization that children throwing knives at each other might not
    be the greatest idea in the world.


