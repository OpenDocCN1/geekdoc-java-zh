  md: "# Ignoring Exceptions\n\nThe next technique that is covered this hour is how\
    \ to ignore an exception completely. A method in a class can ignore exceptions\
    \ using a throws clause as part of the method definition.\n\nThe following method\
    \ throws a MalformedURLException, an error that can occur when you are working\
    \ with web addresses in a Java program:\n\n```\npublic void loadURL(String address)\
    \ throws MalformedURLException {\n    URL page = new URL(address);\n}\n```\n\n\
    The second statement in this example creates a URL object, which represents an\
    \ address on the Web. The constructor method of the URL class throws a MalformedURLException\
    \ to indicate that an invalid address is used, so no object can be constructed.\
    \ The following statement causes one of these exceptions to be thrown when you\
    \ attempt to open a connection to URL:\n\n```\nURL source = new URL(\"http://www.java2hours.com\"\
    );\n```\n\nThe string http://www.java2hours.com is not a valid URL. It's missing\
    \ punctuation: two slash characters (/) after the colon.\n\nBecause the loadURL()\
    \ method has been declared to throw MalformedURLException errors, it does not\
    \ have to deal with inside the method. The responsibility for catching this exception\
    \ falls to any method that calls the loadURL() method.\n\n# Exceptions That Don't\
    \ Need catch\n\nAlthough this hour has shown that exceptions need to be caught\
    \ with try-catch or declared to be thrown with a throws clause, there's an exception.\n\
    \nSome exceptions that might occur in a Java program don't have to be handled\
    \ in any way. The compiler won't come to a screeching halt when it detects that\
    \ the exception is being ignored. These exceptions are called unchecked exceptions,\
    \ while the others are checked exceptions."
