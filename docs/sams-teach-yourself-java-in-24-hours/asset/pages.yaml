  md: '# Introduction


    As the author of computer books, I spend a lot of time lurking in the computer
    section of bookstores, observing the behavior of readers while I''m pretending
    to read the latest issue of In Touch Weekly magazine.


    Because of my research, I''ve learned that if you have picked up this book and
    turned to the introduction, I only have 13 more seconds before you put it down
    and head to the coffee bar for a double-tall-decaf-skim-with-two-shots-of-vanilla-hold-the-whip
    latte.


    So I''ll keep this brief: Computer programming with Java is easier than it looks.
    I''m not supposed to tell you that thousands of programmers have used their Java
    skills to get high-paying jobs in software development, web application programming,
    and mobile app creation. The last thing any wants is for anyone with persistence
    and a free time to learn this language, the most popular programming language
    on the planet. By working your way through each of the one-hour tutorials in Teach
    Yourself Java in 24 Hours, you''ll be able to learn Java programming quickly.


    Anyone can learn how to write computer programs—even if you can''t program a DVR.
    Java is one of the best programming languages to learn because it''s useful, powerful,
    modern technology that''s embraced by programmers around the world.


    This book is aimed at nonprogrammers, new programmers who hated learning the subject,
    and experienced programmers who want to get up swiftly with Java. It uses Java
    8, the brand-new version of the language.


    Java is an enormously popular programming language because of the things it makes
    possible. You can create programs that feature a graphical user interface, design
    software that makes most of the Internet, connect to web services, create an app
    that runs on an Android phone or tablet, and more.


    This book teaches Java programming from the ground up. It introduces the concepts
    in English instead of jargon with step-by-step examples of working programs you
    will create. Spend 24 hours with this book and you''ll be writing your own Java
    programs, confident in your ability to use the language and learn more about it.
    You will also have skills that are becoming increasingly important—such as network
    computing, graphical user interface design, and object-oriented programming.'
