  md: '# CHAPTER 5: Storing and Changing Information in a Program


    These statements set the number variable equal to 50.


    How does the computer come up with this total? First, the increment operator is
    handled, and x++ sets the value of x variable to 6. However, make note that the
    ++ operator is postfix after x in the expression. This means that the expression
    is evaluated with the original value of x.


    Because the original value of x is used before the variable is incremented, the
    expression becomes the following:


    ```

    int number = 5 * 6 + 4 * 10 / 2;

    ```


    Now, multiplication and division are handled from left to right. First, 5 is multiplied
    by 6, 4 is multiplied by 10, and that result is divided by 2 (4 * 10 / 2). The
    expression becomes the following:


    ```

    int number = 30 + 20;

    ```


    This expression results in the number variable being set to 50.


    If you want an expression to be evaluated in a different order, you can use parentheses
    to group parts of an expression that should be handled first. For example, the
    expression x = 5 * 3 + 2; would normally cause x to equal 17 because multiplication
    is handled before addition. However, look at a modified form of that expression:


    ```

    x = 5 * (3 + 2);

    ```


    In this case, the expression within the parentheses is handled first, so the result
    equals 25. You can use parentheses as often as needed in a statement.


