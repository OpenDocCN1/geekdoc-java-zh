  md: '# Workshop


    # Q&A


    +   Q. Why is Eclipse used to create Android apps instead of NetBeans?


    +   A. You can use NetBeans to develop apps, but it''s a more cumbersome and less
    well-supported IDE for Android programming. Eclipse has been designated by Google
    as the preferred Android IDE. The official documentation and tutorials on the
    Android Developer site at http://developer.android.com all use Eclipse.


    Most programming books for Android also employ Eclipse. Although there''s a learning
    curve required to switch from NetBeans to Eclipse when you dive into Android,
    after you master the basics of writing, debugging, and deploying an app, you would
    find Eclipse easier to use because it''s so much better supported by Android programmers
    and technical writers.


    +   Q. Why do so many movies have the same sound of a man screaming in anguish?


    +   A. That sound is the Wilhelm scream, a sound effect that was heard first in
    the 1951 movie Distant Drums. It turns out most often when somebody falls from
    a great height, it is shot by a gun, or is knocked back by an explosion. Two famous
    uses are in the original Star Wars, when a stormtrooper hits by Luke Skywalker
    and falls off a ledge, and in the animated movie Toy Story when Sheriff Woody
    knocks Lightyear out the window.


    The sound was popularized by movie sound designer Ben Burt, who found it in a
    Warner Brothers stock library when developing for Star Wars and included it in
    every Steven Spielberg and George Lucas movie he worked on. It has become a tradition
    among sound designers and can be heard in more than 140 movies.


    The scream being named Wilhelm comes from the third movie to use the sound effect.
    In the 1953 film The Charge at Feather River, Private Wilhelm yells in anguish
    as he''s shot by an arrow.'
