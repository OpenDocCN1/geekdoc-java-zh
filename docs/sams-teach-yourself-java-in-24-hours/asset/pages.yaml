    # Creating a Service Implementation Bean


    The Java class that implements the Service Endpoint Interface is called the Service
    Implementation Bean. (Learning odd new bits of jargon is an unavoidable part of
    JAX-WS.)


    The SquareRootServiceImpl implements the SquareRootServer interface, as stated
    in the class declaration:

    public class SquareRootServiceImpl implements SquareRootServer {


    This means the class you''re creating must contain all the methods in the interface,
    each with the proper parameters.


    The getSquareRoot(double) and getTime() methods are implemented using techniques
    you''ve learned previously.


    The only new aspect of the class is the following annotation, which appears before
    the class statement:

    @WebService(endpointInterface = "com.java24hours.ws.SquareRootServer")


    This annotation indicates the class is a Service Implementation Bean for a Service
    Endpoint Interface named com.java24hours.ws.SquareRootServer. You must use the
    full class name, including the name of its package.


    Take note of the fact that annotations are not followed by semicolons, unlike
    statements.'
