  md: '# HOUR 25

    Creating Minecraft Mods with Java


    Welcome to the 25th hour of Sams Teach Yourself Java in 24 Hours. This book has
    gone into overtime to cover something that has become a phenomenon in years.


    I have three sons in their teens who are avid gamers, and they all play the online
    multiplayer building game Minecraft. Most of the cousins around their age play
    the game, too. When I tell any young person that I write books on Java programming,
    they all ask me the same question: Will it teach me how to create Minecraft mods?


    Mods are extensions to the game that are designed and shared by players. The game
    Minecraft is written in Java, and mods must be programmed in the same language.


    Learning Java is the first step in creating Minecraft mods, and the past 24 hours
    took care of that.


    This bonus hour is the second.


    By the end of this hour, you will have your own Minecraft server downloaded, installed,
    and running on your computer. You will also be able to create mods in the Java
    language, deploy them on the server, and use them as you play the game.


    But be careful. There creepers about.


    +   THIS HOUR''S TO-DO LIST:

    * Install a Minecraft server on your computer.

    * Write a script to start the server.

    * Set up NetBeans for Minecraft mod programming.

    * Create a framework for mods.

    * Design a mod that spawns a mob.

    * Make one mob the rider of another.

    * Find every mob in the game and attack it.

    * Write a mod that digs enormous scoops out of the world.


    # Setting Up a Minecraft Server


    Developing mods requires access to a Minecraft server. The best way to do this
    when you''re starting out as a mod developer is to install and run a server on
    your own computer. Because there''s not yet a standard'
