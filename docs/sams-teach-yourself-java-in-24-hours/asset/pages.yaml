  md: '# Sams Teach Yourself Java SEVENTH EDITION in 24 Hours


    In just 24 lessons of one hour or less, you can learn how to create Java applications
    with the free NetBeans development tools.


    Using a straightforward, step-by-step approach, popular author Rogers Cadenhead
    helps you master the skills and technology you need to create desktop and web
    programs, web services, and even an Android app in Java.


    Each lesson builds on what you''ve already learned, giving you a rock-solid foundation
    for real-world success.


    Full-color figures and clear step-by-step instructions visually show you how to
    program with Java.


    Quizzes and Exercises at the end of each chapter help you test your knowledge.
    Notes, Tips, and Cautions provide related information, advice, and warnings.


    ![](img/b3e5aaa86c0c78aa2f2f058dd244ca32_499_0.png)


    Rogers Cadenhead is a writer, computer programmer, and web developer who has written
    23 books on Java and Internet-related topics, including Sams Teach Java in 21
    Days. He maintains the Duget Retort and several popular websites that receive
    more than five million visits a year.


    # Learn how to...


    +   - Set up your Java programming environment

    - Write your first working program in just minutes

    - Control program decisions and behavior

    - Store and work with information

    - Build straightforward user interfaces

    - Create interactive web programs

    - Use threading to build more responsive programs

    - Read and write files and XML data

    - Master best practices for object-oriented programming

    - Create flexible, interoperable services with JAX-WS

    - Java to create an odd and your skills with closures, powerful new capability
    in Java


