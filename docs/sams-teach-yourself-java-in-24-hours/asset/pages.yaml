    # Writing Java Code


    At this point, you''ve done the bulk of the work on the new app, but you haven''t
    written a single line of Java code. App development is easier when you utilize
    as many capabilities of the Android SDK as possible without resorting to programming.


    Apps are organized into Activities, which represent things an app can do. Each
    Activity is defined by its own Java class. When you created this app, you specified
    that an Activity named MainActivity folder should be created. A class matching
    this name runs when the app is loaded.


    The source code for LeaderActivity.java can be found in Package Explorer in the
    /src/org.cadenhead.android folder. Double-click this file to edit.


    When you start, the class has a lot of existing source code.


    Like all Activities, the LeaderActivity class is a subclass of Activity in the
    android.app package, which contains the behavior necessary to display a screen,
    collect user input, save user preferences, and so on.'
