  md: '# Creating an Android App


    Java''s developers set aside dreams when the language became popular first as
    a means of running interactive web browser programs and then as a general-purpose
    language.


    A little less than 20 years later, the Android platform is hosting as many as
    a billion Java programs around the world, according to one industry estimate.


    Android has the potential to be the most pervasive—and lucrative—area of Java
    programming for years to come.


    This hour is the longest in the book because there''s a lot to cover when getting
    your start as an Android app developer and future millionaire. It would have been
    split over two hours if my publisher had not vetoed the prospective title Sams
    Teach Yourself Java in 25 Hours.


    # Creating an Android App


    Android apps are ordinary Java programs that use an application framework, a core
    set of classes and files that all apps have in common. The framework embodies
    a set of rules for how apps must be structured in order to run properly on Android
    devices.


    To get writing apps, you must install and configure the Android SDK, the Eclipse
    IDE, and the Android Plug-in for Eclipse.


    If this is your first experience with Android programming, you can find out how
    to acquire and set up these tools in Appendix D,"Setting Up an Android Development
    Environment."


    Go ahead and do that. I''ll wait for you here and catch up with some friends on
    Facebook.


    Done? Good.


    +   1. Run the Eclipse IDE, which looks and acts as a lot like NetBeans.

    2. Choose File, New, Android Application Project. The New Application Wizard opens,
    as shown in Figure 24.1.

    3. In the Application Name field, enter SalutMondo. The same name automatically
    will be entered in the Project Name field.

    4. The Package Name field should contain the name of the Java package to which
    the classes of this app belong. Enter org.cadhead.android.

    5. Every Android project requires a build target. The target represents the oldest
    version of Android that can run your app. Because each new Android release has
    enhanced features, your target choice determines which features you can use.'
