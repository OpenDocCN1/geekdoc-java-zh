    \ of standard code. After the package statement and several import statements,\
    \ you will start every mod with these statements:\n\n```\npublic class SiameseCat\
    \ extends JavaPlugin {\n    public static final Logger log = Logger.getLogger(\"\
    Minecraft\");\n\n    public boolean onCommand(CommandSender sender, Command command,\n\
    \        String label, String[] arguments) {\n        if (label.equalsIgnoreCase(\"\
    siamesecat\")) {\n            if (sender instanceof Player) {\n              \
    \  // something cool here\n                log.info(\"[SiameseCat] Meow!\");\n\
    \                return true;\n            }\n        }\n        return false;\n\
    \    }\n}\n```\n\nMod programs are all subclasses of JavaPlugin from the org.bukkit.plugin.java\
    \ package. Looking at this framework, the only things that will change when you\
    \ use it for a different mod are the three things that refer to a Siamese cat,\
    \ because those are specific to this project.\n\nThe name of the program is SiameseCat.\n\
    The argument inside the method call label.equalsIgnoreCase(\"siamesecat\") is\
    \ the command the user will type in the run mod. So this program implements the\
    \ command /siamesecat (commands are preceded by a slash / character). The label\
    \ object, which is sent as an argument to onCommand(), is a string that holds\
    \ the text of a command entered by the user.\n\nThe statement that calls log.info()\
    \ with the message \"[SiameseCat] Meow!\" sends a log message that is displayed\
    \ in the Minecraft server window.\n\nThe Logger object created as an instance\
    \ variable sends messages to the server.\nThe sender object is another argument\
    \ sent to the onCommand() method. It represents the entity in Minecraft that entered\
    \ the command. Checking to make sure sender is an instance of the Player class\
    \ verifies that the player issued that command."
