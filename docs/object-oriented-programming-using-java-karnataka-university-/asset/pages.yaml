  md: '# INTRODUCTION TO THREAD


    # Advantages of Java Multithreading


    +   1) It doesn''t block the user because threads are independent and you can
    perform multiple operations at the same time.


    +   2) You can perform many operations together, so it saves time.


    +   3) Threads are independent, so it doesn''t affect other threads if an exception
    occurs in a single thread.


    # 4.1.1 Life cycle of a Thread (Thread States)


    In Java, a thread always exists in one of the following states. These states are:
    New, Active, Blocked / Waiting, Timed Waiting Terminated as shown in figure 4.2.
    Let''s understand each state with its functionality.


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_214_0.png)


    Fig 4.2 : Life Cycle of a Thread


    +   **New**: Whenever a new thread is created, it is always in the new state.
    For a thread in the new state, the code has not been run yet and has not begun
    its execution.


    +   **Active**: When a thread invokes the start() method, it moves from the new
    state to the active state. The active state contains two states within it: one
    **runnable**, and the other is **running**.


    +   **Runnable**: A thread, that is ready to run is moved to the runnable state.
    In the runnable state, the thread may be running or may be ready to run at any
    given instant of time. The duty of the thread scheduler is to provide the thread
    time to run, i.e., moving the thread to the running


    A implementing multithreading acquires a fixed slice of time to each individual
    thread. and when allocated time slice is over, the thread voluntarily gives up
    the CPU to the other thread, so that the other threads can also run for their
    slice of time. When such a scenario occurs, all those that are willing to run,
    waiting for their turn to run, lie in the runnable state. In the runnable state,
    there is a queue where the threads lie.


    +   **Running**: When the thread gets the CPU, it moves from the runnable to the
    running state. Generally, the most common change in the state of a thread is from
    runnable to running and again back to runnable.'
