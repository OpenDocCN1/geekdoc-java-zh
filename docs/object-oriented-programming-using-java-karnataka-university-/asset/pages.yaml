  md: "# EVENT AND GUI PROGRAMMING\n\n# Listener Classes\n\nKey to understanding how\
    \ the Java event model works is understanding how \"listener classes\" are used.\
    \ A listener class may be defined by:\n\n+   - Implementing a listener interface\n\
    - Extending another listener class\n\nYou must make sure any listener class has\
    \ appropriately defined listener methods, and that an instance of the listener\
    \ class has been registered with the source of the event for which it is listening.\
    \ The built-in machinery notifies the listener object when the source generates\
    \ an event of the type for which the listener object is listening.\n\n# How to\
    \ Implement an Event Handler\n\nEvery event handler requires three pieces of code:\n\
    \n+   - In the declaration for the event handler class, one line of code specifies\
    \ that the class either implements a listener interface or extends a class that\
    \ implements a listener interface. For example:\n- public class MyClass implements\
    \ ActionListener {\n- Another line of code registers an instance of the event\
    \ handler class as a listener on one or more components. For example:\n- someComponent.addActionListener(instanceOfMyClass);\n\
    - In the event handler class, a few lines of code implement the methods in the\
    \ listener interface. For example:\n\n```\npublic void actionPerformed(ActionEvent\
    \ e)\n{\n    ...//code that reacts to the action...\n}\n```\n\nEvent handlers\
    \ can be instances of an anonymous class. Often an event handler that has only\
    \ a few lines of code is implemented using an anonymous inner class—an anonymous\
    \ class defined inside another class. Anonymous inner classes can be confusing\
    \ at first, but once you've used to them, they make the code clearer by keeping\
    \ the implementation of an event handler close to where the event handler is registered.\n\
    \n# 3.2 EVENT AND LISTENER (JAVA EVENT HANDLING)\n\nChanging the state of an object\
    \ is known as an event. For example, click on button, dragging mouse etc. The\
