    \ Synchronization\n2. Cooperation (Inter-thread communication in java)\n\n**4.3.1.1\
    \ Mutual Exclusive**: Mutual Exclusive helps threads from interfering with one\
    \ another while sharing data. It can be achieved by using the following three\
    \ ways: By Using Synchronized Method, By Using Synchronized Block and By Using\
    \ Static Synchronization.\n**4.3.1.2 Synchronization** is built around an internal\
    \ entity known as the lock or monitor. Every object has a lock associated with\
    \ it. By convention, a thread that needs consistent access to an object's fields\
    \ has to acquire the object's lock before accessing them, and then release the\
    \ lock when it's done with them. Without Synchronization, this example, there\
    \ is no synchronization, output is inconsistent.\n\n```\nclass Table1{\nvoid printMyTable(int\
