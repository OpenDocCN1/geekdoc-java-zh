    Following table 1.15 gives list of the instance methods that all the subclasses
    of the Number class implements


    TABLE 1.15: Number class implements


    | Si.No. | Method | Description |

    |---|---|---|

    | 1 | xxxValue() | Converts the value of this Number object to the xxx data type
    and returns it. byteValue(), shortValue(), intValue(), longValue(), floatValue(),
    double doubleValue() |

    | 2 | compareTo() | Compares this Number object to the argument. |

    | 3 | equals() | Determines whether this Number object is equal to the argument.
    |

    | 4 | valueOf() | Returns an Integer object holding the value of the specified
    primitive. |

    | 5 | toString() | Returns a String object representing the value of a specified
    int or Integer. |

    | 6 | parseInt() | This method is used to get the primitive data type of a certain
    String. |

    | 7 | abs() | Returns the absolute value of the argument. |

    | 8 | ceil() | Returns the smallest integer that is greater than or equal to the
    argument. Returned as a double. |

    | 9 | floor() | Returns the largest integer that is less than or equal to the
    argument. Returned as a double. |'
