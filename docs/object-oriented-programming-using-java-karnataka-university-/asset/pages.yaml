    3. **Port Number:** The port number is used to uniquely identify different applications.
    It acts as a communication endpoint between applications.The port number is associated
    with the IP address for communication between two applications.


    4. **MAC Address:** MAC (Media Access Control) address is a unique identifier
    of NIC (Network Interface Controller). A network node can have multiple NIC with
    each MAC address.


    For example, an ethernet card may have a MAC address of 00:0d:83::b1:c0:8e.


    5. **Connection-oriented and connection-less protocol:** In connection-oriented
    protocol, acknowledgement is sent by the receiver. It is so reliable but fast.
    The example of connection-oriented protocol is TCP. But, in connection-less protocol,
    acknowledgement is not sent by the receiver. So it is reliable but fast. The example
    of connection-less protocol is UDP.


    6. **Socket:** A socket is an endpoint between two communications.


