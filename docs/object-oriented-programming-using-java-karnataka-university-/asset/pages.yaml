  md: "# OOPS CONCEPTS IN JAVA\n\n# 2.5.3 Wildcard in Java Generics\n\nThe ? (question\
    \ mark) symbol represents the wildcard element. It means any type. If we write\
    \ <? extends Number>, it means any child class of Number, e.g., Integer, Float,\
    \ and double. Now we can call the method of Number through any child class object.\
    \ We can use a wildcard as a type of a parameter, field, return type, or local\
    \ variable. However, it is not allowed to use a wildcard as a type argument for\
    \ a generic method invocation, a generic class creation, or a supertype.\n\nLet's\
    \ understand it by the example given below:\n\n```\nimport java.util.*;\nclass\
