  md: '# 72 OBJECT ORIENTED PROGRAMMING USING JAVA


    # 1.6 WRAPPER CLASS IN JAVA


    Wrapper class in java provides the mechanism to convert primitive into object
    and object into primitive. Since JSSE 5.0, autoboxing and unboxing feature converts
    primitive into object and object into primitive automatically. The automatic conversion
    of primitive into object is known as autoboxing and vice-versa unboxing. The eight
    classes of java.lang package are known as wrapper classes in java. The list of
    eight wrapper classes are given in table 1.14:


    TABLE 1.14: Wrapper classes


    | Primitive Type | Wrapper class |

    |---|---|

    | boolean | Boolean |

    | char | Character |

    | byte | Byte |

    | short | Short |

    | int | Integer |

    | long | Long |

    | float | Float |

    | double | Double |


