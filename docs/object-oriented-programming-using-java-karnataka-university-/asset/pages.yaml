  md: '# INTRODUCTION TO THREAD


    Let''s take a scenario:


    +   1. statement 1;

    2. statement 2;

    3. statement 3;

    4. statement 4;

    5. statement 5//exception occurs

    6. statement 6;

    7. statement 7;

    8. statement 8;

    9. statement 9;

    10. statement 10;


    Suppose there are 10 statements in your program and there occurs an exception
    at statement 5, rest of the code will not be executed i.e. statement 6 to 10 will
    not run. If we perform exception handling, the rest of the statement will be executed.
    That is why we use exception handling in java.


    # 4.4.1 Types of Exception


    There are mainly two types of exceptions: checked and unchecked where error is
    considered as unchecked exception. The sun micro system says there are three types
    of exceptions as shown in figure 4.4:


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_230_0.png)


    Fig 4.4: types of exception


    +   1) Checked Exception: The classes that extend Throwableable class except RuntimeException
    and Error are known as checked exceptions e.g. IOException, SQLException etc.
    Checked exceptions are checked at compile-time.


    +   2) Unchecked Exception: The classes that extend RuntimeException are known
    as unchecked exceptions e.g. ArithmeticException, NullPointerException, ArrayOutOfBoundsException
    etc. Unchecked exceptions are not checked at compile-time rather they are checked
    at runtime.'
