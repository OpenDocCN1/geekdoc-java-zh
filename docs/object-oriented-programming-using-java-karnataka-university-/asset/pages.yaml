    # 3.1 EVENT HANDLING IN JAVA


    # What is an event?


    An event is a signal received by a program from the operating system as a result
    of some action taken by the user, or because something else has happened. Here
    are some examples:


    +   - The user presses a key on the keyboard.

    - The user closes a window.


    +   - Some data from the Internet arrives at one of the computer''s "ports"

    More generally, an event is a state change at an instant in time (Winston). The
    word "event" also refers to an instance of the EventObject class, or a subclass
    of that class. Thus, such an instance describes a state change at a particular
    instant.


    Another kind of event is associated with variable-value changes.


    # What is the delegation event model?


    The delegation event model defines standard and consistent mechanisms to generate
    and process events:


    +   - A listener registers with a source to receive event notifications.

    - The source generates events and sends notifications of these events to one or
    more listeners (in fact, to all listeners who have registered to receive them).

    - When a listener receives notification of an event, the listener then processes
    (or "handles") the event and returns.'
