    Toolkit) applet that you create must be a subclass (either directly or indirectly)
    of Applet class. The second statement import imports the Graphics class from AWT
    package.


    2. The next line in the program declares the class HelloWorld. This class must
    be declared as public because it will be accessed by code that is outside the
    program. Inside HelloWorld, this method is defined by AWT and must be overridden
    by the applet.


    3. Inside paint() is a call to drawString(), which is a member of the Graphics
    class. This method outputs a string at the specified X,Y location. It has the
    following general form:

    `void drawString(String message, int x, int y)`

    Here, message is the string to be output at xy. In Java, the upper-left corner
    location is 0.0. The call to drawString in the applet causes the message "Hello
    World" to be displayed beginning at location 20,20.


    Notice that the applet does not have a main() method . Unlike Java programs, applets
    do not begin execution at main(). In fact, most applets don''t even have a main()
    method . Instead, an applet begins execution when the name of its class is passed
    to an applet viewer or to a network browser.


