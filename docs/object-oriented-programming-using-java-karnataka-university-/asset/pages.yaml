  md: '# OBJECT ORIENTED PROGRAMMING USING JAVA


    Both statements will declare the variable "thisIsStringArray" to be a String Array.
    Note that this is just a declaration, the variable "thisIsStringArray" will have
    the value null. And there is only one square brackets, this means the variable
    is only a one-dimensional String Array. Examples will be shown later on how to
    declare multi-dimensional String Arrays.


    # String Array Declaration With Initial Size


    Arrays are used when we know how many objects are needed. Hence, arrays are declared
    with an initial size. Here is an example:


    ```

    String[]thisIsStringArray = new String[5];

    ```


    This will declare a Array with 5 elements. Each element can be accessed using
    index that starts with 0. The first element is "thisIsStringArray[0]", the second
    element is "thisIsStringArray[1]", and so on. Here is an example of declaring
    a String with size 5 and assigning values to each:


    ```

    String[]thisIsStringArray = new String[5];

    thisIsStringArray[0] = "AAA";

    thisIsStringArray[1] = "BBB";

    thisIsStringArray[2] = "CCC";

    thisIsStringArray[3] = "DDD";

    thisIsStringArray[4] = "EEE";

    ```


    Note, since there are only 5 elements and index started from 0, the last index
    will be 4. Or we could use the formula (array length - 1). This means if we access
    the index greater than 4, an Exception will be raised. Example:


    ```

    String[]thisIsStringArray = new String[5];

    thisIsStringArray[5] = "FFF";

    ```


    The code will throw a java.lang.ArrayIndexOutOfBoundsException.


    # String Array Initialization on Declaration


    There are multiple ways to initialize a String Array. Initialization can also
    be done at the same time as the declaration. Here is example:


    | String[]thisIsStringArray = {"AAA", "BBB", "CCC", "DDD", "EEE"}; |


    This will create a Array of length 5. Element at 0 will have the value "AAA",
    element at 1 will have the value "BBB", and so on. Hence, when we run this code:


    ```

    String[]thisIsStringArray = {"AAA", "BBB", "CCC", "DDD", "EEE"};

    System.out.println(thisIsStringArray[0]);

    System.out.println(thisIsStringArray[1]);

    System.out.println(thisIsStringArray[2]);

    System.out.println(thisIsStringArray[3]);

    System.out.println(thisIsStringArray[4]);

    ```'
