  md: '# OBJECT ORIENTED PROGRAMMING USING JAVA


    Mobile Applications: Java ME is a cross-platform to develop mobile applications
    which run across smartphones. Java is a platform for App Development in Android.


    # B. Features of Java


    Simple: Java is a simple language because its syntax is simple, clean, and easy
    to understand. Complex and ambiguous concepts of C++ are either eliminated or
    re-implemented in Java. For example, pointer and operator overloading are not
    used in Java.


    Object-Oriented: In Java, everything is in the form of the object. It means some
    data and behavior. A program must have at least one class and object.


    Robust: Java makes an effort to check error at run time and compile time. It uses
    strong memory management system called garbage collector. Exception handling and
    garbage collection features make it strong.


    Secure: Java is a secure programming language because it has no explicit pointer
    and programs runs in the virtual machine. Java contains a security manager that
    defines the access of Java classes.


    Platform-Independent: Java provides a guarantee that code byte code is platform-independent
    and can run on any machine as shown in figure 1.2.


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_7_0.png)


    Fig 1.2:Java platform independent


    Portable: Java Byte code can be carried to any platform. No implementation-dependent
    features. Everything related to storage is predefined, for example, the size of
    primitive data types.


    High Performance: Java is an interpreted language. Java enables high performance
    with the use of the Just-In-Time compiler.


    Distributed: Java also has networking facilities. It is designed for the distributed
    environment of the internet because it uses TCP/IP protocol. It can run over the
    internet. EJB and RMI are created using a distributed system.


    Multi-threaded: Java also supports multi-threading. It means to handle more than
    one job at a time.


    # C. Components of java programme


    Java program can be defined as a collection of objects that communicate via invoking
    each other''s methods. Let us understand the class, object, methods, and instance
    variables mean.


    Object – Objects have states and behaviors. Example: A dog has states - color,
    name, breed as well as behavior such as wagging its tail, barking, eating. An
    object is an instance of a class.


    Class – A class can be defined as a template/blueprint that describes the behavior/state
    that the object of its type supports.'
