    # 4.7 JAVA NETWORKING


    Java Networking is a concept of connecting two or more computing devices together
    so that we can share resources. Java socket programming provides facility to share
    data between computing devices.


    # Advantage of Java Networking


    +   Sharing resources


    +   Centralize software management


    # The java.net package supports two protocols,


    +   TCP: Transmission Control Protocol provides reliable communication between
    the sender and receiver. TCP is used along with the Internet Protocol referred
    as TCP/IP.


    +   UDP: User Datagram Protocol provides a connection-less service by allowing
    packet of data to be transferred along two or more nodes.


    # Java Networking Terminology


    The widely used Java networking terminologies are given below:


    +   1. IP Address


    +   2. Protocol


    +   3. Port Number


    +   4. MAC Address


    +   5. Connection-oriented and connection-less protocol


    +   6. Socket


    +   1. IP Address: IP address is a unique number assigned to a node of a network
    e.g. 192.168.0.1 . It is composed of octets that range from 0 to 255. It is a
    logical address that can be changed.


    +   2. Protocol: A protocol is a set of rules basically that is followed for communication.
