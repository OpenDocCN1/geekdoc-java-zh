    # 1.3 OBJECTS AND CLASSES: BASICS OF OBJECTS AND CLASSES IN JAVA


    The main aim of object-oriented programming is to implement real-world entities,
    for example, object, class, abstraction, inheritance, polymorphism, etc. as shown
    in figure 1.19


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_53_0.png)


    # A. Object


    Any entity that has state and behavior is known as an object. For example, a chair,
    pen, table, keyboard, bike, etc. It can be physical or logical. An Object can
    be defined as an instance of a class. An object contains addresses and takes up
    space in memory. Objects can communicate without knowing the details of other''s
    data or code. The only thing is of message accepted and the returned by the objects.


    Example: A dog is an object because it has state color, name, breed,


    etc. as well as behaviors like wagging the tail, barking, eating, etc. as shown
    in figure 1.20.


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_53_1.png)


    # B. Class


    A class can also be defined as a blueprint from which you can create an individual
    object. Class doesn''t consume space.


    Collection of objects is called class. It is a logical entity.'
