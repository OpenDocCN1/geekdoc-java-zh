    # Java - Loop Control


    There may be a situation when you need to execute a block of code several number
    times. In general, statements are executed sequentially. The first statement in
    a function is executed first, followed by the second, and so on. A loop statement
    allows us to execute a statement or group of statements shows the general form
    of a loop statement in most of the programming languages.


    Java programming provides the following types of loop to handle looping requirements.
    Click the following table 1.10 to check their detail.


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_37_0.png)


    # TABLE 1.10: Loop Control Statements


    | Sr.No | Loop & Description |

    |---|||

    | 1 | **while loop:** Repeats a statement or group of statements while a given
    condition is true. It tests the condition before executing the loop body. |

    | 2 | **for loop:** Execute a sequence of statements multiple times and abbreviates
    the code that manages the loop variable. |

    | 3 | **do...while loop:** Like a while statement, except that it tests the condition
    at the end of the loop body. |


    # While Loop in Java


    A loop statement in Java programming language repeatedly executes a target statement
    as long as a given condition is true. Flow Diagram shown in figure 1.14.The syntax
    of a while loop is -


    ```

    while(Boolean_expression)

    {

    // Statements

    }

    ```


    Here, statement(s) may be a single statement or a block of statements. The **condition**
    may be any expression, and true is any non zero value.


    When executing, the boolean_expression result is true, then the actions inside
    the loop will be executed. This will continue as long as the expression result
    is true.'
