  md: 'There are given some scenarios where unchecked exceptions can occur. They are
    as follows:


    +   i) **Scenario where ArithmeticException occurs**


    If we divide any number by zero, there occurs an ArithmeticException.

    int a=50/0;//ArithmeticException


    +   ii) **Scenario where NullPointerException occurs**


    If we have null value in any variable, performing any operation by the variable
    occurs an

    NullPointerException.

    String s=null;

    System.out.println(s.length());//NullPointerException


    +   iii) **Scenario where NumberFormatException occurs**


    The wrong formatting of any value, may occur NumberFormatException. Suppose I
    have a string that has characters, converting this variable into digit will occur

    NumberFormatException.

    String s="abc";

    int i=Integer.parseInt(s);//NumberFormatException


    +   iv) **Scenario where ArrayIndexOutOfBoundsException occurs**


    If you are inserting any value in the wrong index, it would result

    ArrayOutOfBoundsException as shown below:

    int a[]=new int[5];na[10]=50;//ArrayIndexOutOfBoundsException


    **3) Error** is irreversible e.g. OutMemoryError, VirtualMachineError, AssertionError
    etc.

    Common scenarios where exceptions may occur.


    # 4.4.2 Java Exception Handling Keywords


    There are 5 keywords used in java exception handling.


    +   1. try

    2. catch

    3. finally

    4. throw

    5. throws


    **4.4.2.1 Java try block:** Java try block is used to enclose the code that might
    throw an exception. It must be used within the method. Java try block must be
    followed by either catch or finally block.


    ```

    Syntax of java try-catch

    try {

    //code that may throw exception

    }catch(Exception_class_Name name){}

    ```'
