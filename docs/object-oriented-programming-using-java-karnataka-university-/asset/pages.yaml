  md: "# OBJECT ORIENTED PROGRAMMING USING JAVA\n\nJava has no sizeof operator to\
    \ find the size of primitive data types but all Java primitive wrappers except\
    \ Boolean. provide a SIZE constant in bits that can be divided by eight to get\
    \ the size of a data type in bytes. Moreover, since Java 8, all primitive wrapper\
    \ classes (except Boolean) have a BYTES constant, which gives data type's size\
    \ in bytes. So you can also use those which have been moved to Java 8. The data\
    \ type with default value and size is given in table 1.1.\n\n# TABLE 1.1: Data\
    \ types in Java with Default value and size\n\n| Data Type | Default Value | Default\
    \ size |\n|---|---|--|\n| boolean | false | 1 bit |\n| Char | \\u0000' | 2 byte\
    \ |\n| Byte | 0 | 1 byte |\n| Short | 0 | 2 byte |\n| Int | 0 | 4 byte |\n| Long\
    \ | 0L | 8 byte |\n| Float | 0.0f | 4 byte |\n| double | 0.0d | 8 byte |\n\nHow\
    \ to find the size of a primitive data type in Java? Following is a trivial Java\
    \ program demonstrating the size of primitive data types through their primitive\
    \ wrappers.\n\n```\n{\n  public static void main(String[] args) {\n    System.out.println(\"\
    Size of byte: \" + (Byte.SIZE/8) + \" bytes.\");\n    System.out.println(\"Size\
    \ of short: \" + (Short.SIZE/8) + \" bytes.\");\n    System.out.println(\"Size\
    \ of int: \" + (Integer.SIZE/8) + \" bytes.\");\n    System.out.println(\"Size\
    \ of long: \" + (Long.SIZE/8) + \" bytes.\");\n    System.out.println(\"Size of\
    \ char: \" + (Character.SIZE/8) + \" bytes.\");\n    System.out.println(\"Size\
    \ of float: \" + (Float.SIZE/8) + \" bytes.\");\n    System.out.println(\"Size\
    \ of double: \" + (Double.SIZE/8) + \" bytes.\");\n  }\n}\n```\n\n```\nOUTPUT:\n\
    nC:\\JavaPrograms>javac SizePrimitiveTypes.java\nC:\\JavaPrograms>java SizePrimitiveTypes\n\
    Size of byte: 1 bytes.\nSize of short: 2 bytes.\nSize of int: 4 bytes.\n```"
