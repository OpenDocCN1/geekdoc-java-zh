  md: '# INTRODUCTION TO JAVA


    # D. Reading data from keyboard:


    Java programming is a pure object oriented programming as it considers input as
    string, it need to parse as the required data type. There are many ways to read
    data from the keyboard. For example:


    +   1. InputStreamReader

    2. Console

    3. Scanner

    4. DataInputStream etc.

    5. Using Command line argument


    +   1. InputStreamReader class: InputStreamReader class can be used to read data
    from keyboard. It performs two tasks:connects to input stream, converts the byte-oriented
    stream into character-oriented stream


    +   2. BufferedReader class: BufferedReader class can be used to read line by
    line by readLine(). Example of reading data from keyboard by InputStreamReader
    and BufferedReader class. In this example, we are connecting the BufferedReader
    stream with the InputStreamReader stream for reading the line by line from the
    keyboard.


    ```

    import java.io.*;

    ```


    ```

    class G5 {

    public static void main(String[] args)throws Exception {

    ```


    ```

    InputStreamReader r=new InputStreamReader(System.in);

    BufferedReader br=new BufferedReader(r);

    System.out.println("Enter your name");

    String name=br.readLine();

    System.out.println("Welcome "+name");

    }

    ```


    OUTPUT:


    Enter your name: Arun

    Welcome Arun


    +   3. Reading data using Scanner: In Java, there are many ways to read strings
    from input. The simplest one is to use of the class Scanner, which is part of
    the java.util library and has been newly introduced in Java 5.0. Using this class,
    we can create an object to read input from the standard input channel System.in
    (typically, the keyboard), as follows:


    ```

    Scanner scanner=new Scanner(System.in);

    ```


    Then, we can use the nextLine() method of the Scanner class to get from standard
    input the next line (a sequence of characters delimited by a newline character),
    according to the following schema:


    Example:


    ```

    import java.util.Scanner;

    ```'
