  md: '# INTRODUCTION TO JAVA


    # C. Inheritance


    When one object acquires all the properties and behaviors of a parent object,
    it is known as inheritance. It provides code reusability. It is used to achieve
    runtime polymorphism


    # D. Polymorphism


    If one task is performed in different ways, it is known as polymorphism. For example:
    to convince the customer differently, to draw something; for example, shape, triangle,
    rectangle, and field. In Java, we use method overloading and overriding to achieve
    polymorphism. Another example can be to speak something; for example, a cat speaks
    meow, dog barks woof, as shown in figure 1.21.


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_54_0.png)


    Fig 1.21: Polymorphism in Java


    # E. Abstraction


    Hiding internal details and showing functionality known as abstraction. For phone
    call, we don''t know the internal processing. In Java, we use abstract class and
    interface to achieve abstraction.


    # F. Encapsulation


    Binding (or wrapping) code and data together into a single unit are known as encapsulation.
    For example, a capsule, is wrapped with different medicines as shown in figure
    1.22. A Java class is the example of encapsulation. Java bean is the fully encapsulated
    class because all the data members are private here.


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_54_1.png)


    Fig 1.22: Encapsulation in Java


    # G. Coupling


    Coupling refers to the knowledge or information or dependency of another class.
    It arises when classes are aware of each other. If a class has the details information
    of another class, there is strong coupling. In Java, we use private, protected,
    and public modifiers to display the visibility of a level, method, and field.
    You use interfaces for the weaker coupling because there is no concrete implementation.


    # H. Cohesion


    Cohesion refers to the level of a component which performs a single well-defined
    task. A single well-defined task is done by a highly cohesive method. The weakly
    cohesive method will split the task into separate parts. The java.io package is
    a highly cohesive package because it has I/O related classes and interface. However,
    the java.util package is a weakly cohesive package because it has unrelated classes
    and interfaces.


