    we can achieve hybrid inheritance only through Interfaces.


    Important facts about inheritance in Java


    +   - Default superclass: Except Object class, which has no superclass, every
    class has one and only one direct subclass (single inheritance). In the absence
    of any explicit superclass, every class is implicitly a subclass of Object class.


    +   - Superclass can be only one: A superclass can have any number of subclasses.
    But a subclass can have only one superclass. This is because Java does not support
    multiple inheritance with classes. Although with interfaces, multiple inheritance
    is supported by java.'
