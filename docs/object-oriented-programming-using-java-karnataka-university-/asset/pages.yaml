    \ code that may throw exception\n}finally{}\n```\n\n4.4.2.2 Java catch block:\
    \ Java catch block is used to handle the Exception. It must be used after the\
    \ try block only. You can use multiple catch block with a single try. Problem\
    \ without exception handling, Let's try to understand the problem if we don't\
    \ use try-catch block.\n\n```\npublic class Testcatch1{\n    public static void\
    \ main(String args[]){\n        int data=50;//may throw exception\n        System.out.println(\"\
    rest of the code...\");\n    }\n}\n```\n\n# OUTPUT:\n\nException in thread main\
    \ java.lang.ArithmeticException/: by zero\nAs displayed in the above example,\
    \ rest of the code is not executed (in such case, rest of the code... statement\
    \ is not printed). There can be 100 lines of code after exception. So all the\
    \ code after exception will not be executed.\n\n# Solution by exception handling\n\
    \nLet's see the solution of problem by java try-catch block.\n\n```\npublic class\
    \ Testcatch2{\n    public static void main(String args[]){\n        try{\n   \
    \         int data=50;\n        } catch(ArithmeticException e){\n            System.out.println(\"\
    rest of the code...\");\n        }\n    }\n}\n```\n\n# OUTPUT:\n\nException in\
    \ thread main java.lang.ArithmeticException/: by zero\nrest of the code...\nNow,\
    \ as displayed in the above example, rest of the code is executed i.e. rest of\
    \ the code... statement is printed. The JVM firstly checks whether the exception\
    \ is handled or not. If exception is not handled, JVM provides a default exception\
    \ handler that performs the following tasks:\n\n+   - Prints out exception description.\n\
    - Prints the stack trace (Hierarchy of methods where the exception occurred)."
