    Iterator interface: Iterator interface provides the facility of iterating the
    elements in forward direction only.


    Methods of Iterator interface: There are only three methods in the Iterator interface.
    They are described in table 4.3:


    TABLE 4.3: Iterator interface


    | No. | Method | Description |

    | 1 | public boolean hasNext() | It returns true if iterator has elements. |

    | 2 | public Object next() | It returns the element and moves the cursor pointer
    to the next element. |

    | 3 | public void remove() | It removes the last elements returned by the iterator.
    It is rarely used. |


    # 4.5.1 Java ArrayList class


    Java ArrayList uses a dynamic array for storing the elements. It inherits AbstractList
    class and implements List interface as shown in figure 4.6. The important points
    about Java ArrayList class:


    +   * Java ArrayList class can contain duplicate elements.

    * Java ArrayList class maintains insertion order.

    * Java ArrayList allows random access because array works at the index bases.

    * In Java ArrayList class, manipulation list is slow because a lot of shifting
    needs to be occurred when any element is removed from the array list.


