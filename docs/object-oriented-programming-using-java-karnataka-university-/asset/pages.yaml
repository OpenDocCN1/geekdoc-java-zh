    \ 1.\n5. If Button Back is clicked, create Frame 2.\n\n```\n/*Java Program to\
    \ switch between frames using buttons*/\nimport javax.swing.*;\nimport java.awt.*;\n\
    import java.awt.event.*;\nclass Switch_Frame implements ActionListener\n{\n  \
