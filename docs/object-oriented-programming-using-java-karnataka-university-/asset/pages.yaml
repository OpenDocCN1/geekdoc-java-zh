  md: '# INTRODUCTION TO JAVA


    # L. STRING BUFFER


    Java StringBuffer class is used to create mutable (modifiable) string. The StringBuffer
    class in java is same as String class except it is mutable i.e. it can be changed.
    The constructor and methods supported in string buffer class is given in table
    1.12 and 1.13.


    > Note: Java StringBuffer class is thread-safe i.e. multiple threads cannot access
    it simultaneously. So it is safe and will result in an order.


    # TABLE 1.12: Important Constructors of StringBuffer class


    | Constructor | Description |

    | StringBuffer() | creates an empty buffer with the initial capacity of 16. |

    | StringBuffer(String str) | creates a string buffer with the specified string.
    |

    | StringBuffer(int capacity) | creates an empty buffer with the specified capacity
    length. |


    # TABLE 1.13: Important methods of StringBuffer class


    | Modifier and Type | Description |

    | public synchronized StringBuffer | append(String s) - is used to append the
    specified string with the start. The append(String) method is overloaded append(char),
    append(boolean), append(int), append(float), append(double). |

    | public synchronized StringBuffer | insert(int offset, String s) - is used to
    insert the specified string at the specified position. The insert(int) method
    is overloaded insert(int, char), insert(int, boolean), insert(int, int), insert(int,
    float), insert(int, double). |

    | public synchronized StringBuffer | replace(int startIndex, int endIndex, String
    str) - is used to replace the string from specified startIndex and endIndex. |

    | public synchronized StringBuffer | delete(int startIndex, int endIndex) - is
    used to delete the string from specified startIndex and endIndex. |

    | public synchronized StringBuffer | reverse() - is used to reverse the string.
    |

    | public int | capacity(int minimumCapacity) - is used to ensure the capacity
    is at least to the minimum. |

    | public char | charAt(int position) - is used to return the character at the
    specified position. |

    | public int | length() - is used to return the length of the string i.e. total
    number of characters. |

    | public String | substring(int beginIndex) - is used to return the substring
    from the specified beginIndex. |

    | public String | substring(int beginIndex, int endIndex) - is used to return
    the substring from the specified beginIndex and endIndex.|'
