    \ String(\"Welcome\");//creates two objects and one reference variable\n\nIn case,\
    \ JVM will create a new string object in normal(non pool) heap memory and the\
    \ literal \"Welcome\" will be placed in the string constant pool. The variable\
    \ s will refer to the object in heap(non pool).\n\nJava String Example\n\n```\n\
