    3. The Bitwise Operators: Java defines several bitwise operators, which can be
    applied to the integer types, long, int, short, char, and byte. Bitwise operator
    (table 1.5) works on bits and performs bit-by-bit operation. Assume if a = 60
    and b = 13; now in binary format they will be as follows:


    ```

    a = 0011 1100

    b = 0000 1101

    ```


    ```

    a&b = 0000 1100

    a|b = 0011 1101

    a^b = 0011 0001

    a~a = 1100 0011

    ```


    # TABLE 1.5: The following table lists the bitwise operators -


    | Operator | Description | Example |

    |---|---|---|n| & (bitwise and) | Binary AND Operator copies a bit to the result
    if it exists in both operands. | (A & B) will give 12 which is 0000 1100 |

    | | (bitwise or) | Binary OR Operator copies a bit if it exists in either operand.
    | (A | B) will give 61 which is 0011 1101 |

    | ^ (bitwise XOR) | Binary XOR Operator copies the bit if it is set in one operand
    but not. | (A ^ B) will give 49 which is 0011 0000 |

    | ~ (bitwise compliment) | Binary Ones Complement Operator is unary and has the
    effect of ''flipping'' bits. | (~A) will give -61 which is 1100 0011 in 2''s signed
    number |

    | << (left shift) | Binary Left Shift Operator. The left value is moved by the
    number of bits specified by the right operand. | A << 2 will give 240 which is
    1111 0000 |

    | >> (right shift) | Binary Right Shift Operator. The left operands value moved
    by the number of bits specified by the right operand. | A >> 2 will give 15 which
    is 1111 |

    | >>> (zero fill right shift) | Shift right zero fill operator. The left operands
    are moved by the number of bits specified by the right operand and shifted values
    are filled with zeros. | A >>>2 will give 15 which is 0000 1111 |'
