    # Advantages of Compile-time Polymorphism:


    +   1. It improves code clarity and allows for the use of a single name for similar
    procedures.

    2. It has a faster execution which is discovered early in the compilation process.

    The only disadvantage of compile-time polymorphism is that it doesn''t include
    inheritance.


    # 2.3.3 Runtime Polymorphism in Java


    Runtime polymorphism or Dynamic Dispatch is a process in which a call to an overridden
    method is resolved at runtime rather than compile-time. In this process, an overridden
    method is called through the reference variable of a superclass. The determination
    of the method to be called is based on the object referred to by the reference
    variable. Let''s first understand Runtime Polymorphism.


    Upcasting: If the reference variable of Parent class refers to the object of Child
    class, it is known as upcasting as shown in figure 2.10. For example:


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_112_0.png)


    Fig 2.10: Casting


    ```

    class A{}

    class B extends A{}

    A a=new B();//upcasting.

    ```


    For upcasting, we can use the reference variable of class type or an interface
    type. For Example:


    ```

    interface I{}

    class A{}

    class B extends A implements I{}

    ```'
