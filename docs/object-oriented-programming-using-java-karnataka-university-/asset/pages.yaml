    }\nclass GenericTest\n{\n    //creating method that accepts only child class of\
    \ Shape\n    public static void drawShapes(List<? extends Shape> lists)\n{\n \
    \       for(Shape s:lists){\n            s.draw();//calling method of Shape class\
    \ by child class instance\n        }\n    }\n    public static void main(String\
    \ args[])\n{\n    }\n```"
