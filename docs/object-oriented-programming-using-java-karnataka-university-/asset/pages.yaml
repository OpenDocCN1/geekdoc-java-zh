    ```

    char uniChar = ''\u039A\'';

    ```


    // an array of chars


    char[] charArray={...};

    However in development, we come across some situations where we need to use objects
    instead of primitive data types. In order to achieve this, Java provides wrapper
    class Character for primitive data type char. The Character class offers a number
    of useful class (i.e., static methods) for manipulating characters. You can create
    a Character object with the Character constructor –


    Character ch = new Character(''a'');


    The Java compiler will also create a Character object for you under some circumstances.
    For example, if you pass a primitive char into a method that expects an object,
    the compiler automatically converts the char to a Character for you. This feature
    is called autoboxing or unboxing, if the conversion goes the other way.'
