    | 3 | public boolean remove(Object element) | is used to delete an element from
    this collection. |

    | 4 | public boolean removeAll(Collection c) | is used to delete all elements
    of specified collection from the invoking collection. |

    | 5 | public boolean retainAll(Collection c) | is used to delete all elements
    of invoking collection except the specified collection. |

    | 6 | public int size() | return the total number of elements in the collection.
    |

    | 7 | public void clear() | removes the total no of element from the collection.
    |

    | 8 | public boolean contains(Object element) | is used to search an element.
    |

    | 9 | public boolean containsAll(Collection c) | is used to search the specified
    collection in this collection. |

    | 10 | public Iterator iterator() | returns an iterator. |

    | 11 | public Object[] toArray() | converts collection to array. |

    | 12 | public boolean isEmpty() | checks if collection is empty. |

    | 13 | public boolean equals(Object element) | matches two collection. |

    | 14 | public int hashCode() | returns the hashcode number for collection. |'
