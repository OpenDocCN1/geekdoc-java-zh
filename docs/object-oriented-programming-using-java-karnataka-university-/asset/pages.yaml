  md: '# OBJECT ORIENTED PROGRAMMING USING JAVA


    **3. Blocked or Waiting:** Whenever a thread is inactive for a span of time (not
    permanently) then, either the thread is in the blocked state or is in the waiting
    state.


    For example, a thread (let''s say its name is A) may want to print some data from
    the printer.


    However, at some time, the other thread (let''s say its name is B) is using the
    printer to print some data. Therefore, thread A has to wait for B to use the printer.
    Thus, thread A is in the blocked state. A blocked state is unable to perform any
    execution and never consume any cycle of the Central Processing Unit (CPU). Hence,
    we can say that thread A remains idle until the scheduler activates thread A,
    which is in the waiting or blocked state. When main thread invokes the join method,
    it is said that the main thread is in the waiting state. Then main thread waits
    for the children to complete their tasks. When the children finish their job,
    a notification is sent to the main thread, which again moves the thread from waiting
    to running state.


    If there are lot of threads in the waiting or blocked state, it is the duty of
    the scheduler to choose which one to execute, and the chosen thread is then given
    the opportunity to run.


    **4. Timed Waiting:** Sometimes waiting leads to starvation. For example, a thread
    (its name is A) enters the critical section of a code and is not willing to leave
    that critical section. In such scenario, another thread (its name is B) has to
    wait forever, which leads to starvation. After such scenario, a timed waiting
    state is given to thread B. Thus, thread lies in the waiting state for a specific
    span of time, and not forever. A real example of timed waiting is when we invoke
    the sleep(sleep) method on a specific thread. The sleep()) method puts the thread
    in the timed wait state. After the time runs out, the thread wakes up and starts
    its execution from when it has left earlier.


    **5. Terminated:** A thread reaches the terminated state because of the following
    reasons:


    When a thread has finished its job, then it exists or terminates normally.A terminated
    thread means the thread is no more in the system. In other words, the thread is
    dead, and there is no way one can respawn (active after kill) the dead. **Abnormal
    termination:** It occurs when some unexpected exception or segmentation fault.


    # Implementation of Thread States :


    In Java, one can get the state of a thread using the `Thread.getState()` method.


    The `java.lang.Thread.State` class of Java provides the constants ENUM to represent
    the state of a thread.


    These constants are:


    +   1. public static final Thread.State NEW : It represents the first state of
    a thread that is the NEW state.


    +   2. public static final Thread.State RUNNABLE : It represents the runnable
    state.It means a thread is waiting in the queue to run.


    +   3. public static final Thread.State BLOCKED : It represents the blocked state.
    In this state, the thread is waiting to acquire a lock.'
