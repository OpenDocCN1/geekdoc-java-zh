  md: '# OBJECT ORIENTED PROGRAMMING USING JAVA


    Let''s look more closely at these methods.


    +   init() : The init( start() ) method is the first method to be called. This
    is where you should initialize variables. This method is called only once during
    the run of your applet.


    +   start() : The start( ) method is called after init(). It is also called to
    restart an applet after it has been stopped. Note that init() is called only once
    when the first time an applet is loaded whereas start() is called each time an
    applet''s HTML document is displayed. So, if a user leaves a web page and comes
    back, the applet resumes execution at start().


    +   paint() : The paint( ) method is called when an Applet''s output must be redrawn.
    This situation can occur for several reasons. For example, the window in which
    the applet is running may be overwritten by another window and then uncovered.
    Or the applet window may be minimized and restored. paint( ) is also called when
    the applet begins execution, whenever the applet must redraw its output, paint(
    ) is called. The paint( ) method is Graphics. This parameter will contain the
    graphics context, which describes the graphics environment in which the applet
    is running. This context is used whenever output to the applet is required.


    Note: This is the only method among all the method above, which is parameterized.
    It''s prototype is public void paint(Graphics g) where g is an object reference
    of class Graphic.


    +   stop() : The stop( ) method is called when a web browser leaves the HTML document
    containing the applet—when it goes to another page, for example. When stop() is
    called, the applet is probably running. You use stop() to suspend threads that
    don''t need to run when the applet is not visible. You can restart them when start()
    is called if the user returns to the page.


    +   destroy() : The destroy( ) method is called when the environment determines
    that your applet needs to be removed completely from memory. At this point, you
    should free up any resources the applet may be using. The stop( ) method is always
    called before destroy().


