    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_57_0.png)


    # CharSequence Interface


    The CharSequence interface is used to represent sequence of characters. It is
    implemented by String, StringBuffer and StringBuilder classes. It means, we can
    create string in java by using these 3 classes as shown in figure 1.24.


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_57_1.png)


    The java String is immutable i.e. it cannot be changed. Whenever we change any
    string, a new instance is created. For mutable string, you can use StringBuffer
    and StringBuilder classes.'
