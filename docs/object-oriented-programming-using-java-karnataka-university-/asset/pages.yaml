    Java AWT (Abstract Window Toolkit) is an API to develop Graphical User Interface
    (GUI) or windows-based applications in Java. Java AWT components are platform-dependent
    i.e. components are displayed according to the view of operating system. AWT is
    heavy weight i.e. its components are using the resources of underlying operating
    system (OS). The java.awt package provides classes for AWT API such as TextField,
    Label, TextArea, RadioButton, CheckBox, Choice, List etc.The AWT tutorial will
    help the user to understand Java programming in simple and easy steps.


    # 3.8 AWT BUTTON


    A Button is basically a control component with a label that generates an event
    when pushed. The Button class is used to create a labeled button that has platform
    independent implementation. The application result in some action when the button
    is pushed.


    When we press a button and release it, AWT sends an instance of ActionEvent to
    that button by calling processEvent on the button. the processEvent method of
    the button receives all the events, then it passes an event by calling its own
    processActionEvent. This method passes the action event to all listeners that
    are interested in the events generated by the button.


    To perform an action on a button being pressed and released, the ActionListener
    interface needs to be implemented. The registered new listener can receive events
    from the button by calling addActionListener method of the button. The Java application
    can use the button''s action command as a messaging protocol. Following table
    3.9 and table 30.10 shows the types of Button class constructors and methods.


    # AWT Button Class Declaration


    +   1. public class Button extends Component implements Accessible'
