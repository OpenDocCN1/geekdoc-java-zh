    \ you create a string constant, the JVM checks the string constant first. If the\
    \ string already exists in the pool, a reference to the pooled instance is returned.\
    \ If string does not exist in the pool, a new string instance is created and placed\
    \ in the pool. For example:\n\n![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_58_0.png)\n\
    \nIn the above example only one object will be created. Firstly JVM will not find\
    \ any string object with the value \"Welcome\" in string constant pool, so it\
    \ will create a new object. After that it will find the string with the value\
    \ \"Welcome\" in the pool, it will not create new object but will return the reference\
    \ to the same instance.\n\nNote: String objects are stored in a special memory\
    \ area known as string constant.\n\nWhy java uses concept of string literal?\n\
    \nTo make java more memory efficient (because no new objects are created if it\
