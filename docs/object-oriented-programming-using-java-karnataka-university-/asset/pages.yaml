    +   - K: It is the type of keys maintained by this map.

    - V: It is the type of mapped values.


    TABLE A.23: Constructors of Java TreeMap class


    | Constructor | Description |

    |---|---|

    | TreeMap() | It is used to construct an empty TreeMap that will be sorted using
    the natural order of its key. |

    | TreeMap(Comparator comp) | It is used to construct an empty tree-based map that
    will be sorted using the comparator comp. |

    | TreeMap(Map m) | It is used to initialize a tree map with the entries from m,
    which will be sorted using the natural order of the keys. |

    | TreeMap(SortedMap sm) | It is used to initialize a tree map with the entries
    from the SortedMap sm, which will be sorted in the same order as sm.'
