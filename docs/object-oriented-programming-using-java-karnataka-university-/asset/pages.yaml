    \ is known as super class(or a base class or a parent class).\n* Sub Class: The\
    \ class that inherits the other class is known as sub class(or a derived class,\
    \ extended class, or child class). The subclass can add its own fields and methods\
    \ in addition to the superclass fields and methods.\n* Reusability: Inheritance\
    \ supports the concept of \"reusable\", i.e. when we want to create a new class\
    \ and there is already a class that includes some of the code that we want, we\
