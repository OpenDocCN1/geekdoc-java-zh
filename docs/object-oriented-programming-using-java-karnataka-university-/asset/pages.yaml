    switch(expression)\n{\ncase value :\n    // Statements\n    break; // optional\n\
    \ncase value :\n    // Statements\n    break; // optional\n\n// You can have any\
    \ number of case statements.\ndefault: // Optional\n    // Statements\n\n```\n\
    \nThe following rules apply to a switch statement –\n\n+   * The variable used\
    \ in a switch statement can only be integers, convertible integers (byte, short,\
    \ char), strings and enum.\n* You can have any number of case statements within\
    \ a switch. Each case is followed by the value to be compared to and colon.\n\
    * The value for a case must be the same data type as the variable in the switch\
    \ and it must be a constant or a literal.\n* When the variable switched on is\
    \ equal to a case, the statements following that case will execute until a break\
    \ statement is reached.\n* When a break statement is reached, the switch terminates,\
    \ and the flow of control jumps to the next line following the switch statement.\n\
    * Not every case needs to contain a break. If no break appears, the flow of control\
    \ will fall through to subsequent cases until a break is reached.\n\n![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_32_0.png)"
