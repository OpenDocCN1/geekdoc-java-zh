    # 2.3 POLYMORPHISM


    Polymorphism is the ability of an object to take on many forms. The most common
    use of polymorphism in OOP occurs when a parent class reference is used to refer
    to a child class object. Any Java object that can pass more than one IS-A test
    is considered to be polymorphic. There are two types of polymorphism in java as
    shown in figure 2.9.


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_107_0.png)


    Fig 2.9: Types of polymorphism


    Compile-time polymorphism is a polymorphism that is resolved during the compilation
    process. Overloading of methods is called through the reference variable of a
    class. Compile-time polymorphism is achieved by method overloading and operator
    overloading.


    # 2.3.1 Method overloading


    We can have one or more methods with the same name that are solely distinguishable
    by argument name, type, or order. Method Overloading occurs when a class has many
    methods with the same name but different parameters. Two or more methods may have
    the same name if they have other numbers of parameters, different data types,
    or different numbers of parameters and different data types.


    Example:


    ```

    void gfg() { ... }

    void gfg(int num1) { ... }

    void gfg(float num1) { ... }

    void gfg(int num1, float num2) { ... }

    ```'
