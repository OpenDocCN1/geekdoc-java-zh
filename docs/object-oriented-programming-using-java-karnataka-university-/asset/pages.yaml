  md: "Class Names – For all class names the first letter should be in Upper Case.\
    \ If several words are used to form a name of the class, each inner word's first\
    \ letter should be in Upper Case.\n\nExample: class MyFirstFitClass\n\nMethod\
    \ Names – All method names should start with a Lower case letter. If several words\
    \ are used to form the name of the method, then each inner word's first letter\
    \ should be in Upper Case.\n\nExample: public void myMethodName()\n\nProgram File\
    \ Name – The name of the program file should exactly match the class name.\n\n\
    When saving the file, you should save it the class name (Remember Java is case\
    \ sensitive) and append '.java' to the end of the name (if the file name and the\
    \ class name do not match, your program will not compile).\n\nExample: Assume\
    \ 'MyFirstFitProgram' is the class name. Then the file should be saved as 'MyFirstFitProgram.java'\n\
    \npublic static void main(String args[]) – Java program processing starts from\
    \ the main() method which is a mandatory part of every Java program.\n\nJava Modifiers-Like\
    \ other languages, it is possible to modify classes, methods, etc., by using modifiers.\
    \ There are two categories of modifiers –Access Modifiers – default, public ,\
    \ protected, private,Non-access Modifiers – final, abstract, strictfp\n\nComments\
    \ in Java-Supports single-line and multi-line comments similar to C and C++. These\
    \ comments are ignored by Java compiler.\n\nExample:\n\n```\npublic class MyFirstFitProgram\n\
    {\n  /* This is my first java program.\n  * This will print 'Hello World' as the\
    \ output\n  * This is an example of multi-line comments.\n */\n```\n\n```\npublic\
    \ static void main(String[]args)\n{\n  // This is an example of single line comment\n\
    \  /* This is also an example of single line comment. */\n  System.out.println(\"\
    Hello World\");\n}\n```\n\nOUTPUT:\n\nHello World\n\nUsing Blank Lines-A line\
    \ containing only white space, possibly with a comment, is known as a blank line,\
