    Science. She worked as Head of the Department/faculty in the Department of Computer
    Science, GVS College of Management, Anekal, Bangalore from 2007 to 2010. She worked
    as the UGC-Major Research Project fellow from 2010 to 2013 and Lecturer in Seshripuram
    College of Management, Bengaluru, Bangalore from 2013 to 2013. Presently, She
    is working as Assistant Professor since 2013 in the Department of Computer Science
    and having more than 14 years of teaching and research experience. She has been
