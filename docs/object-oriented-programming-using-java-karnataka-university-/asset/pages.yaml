  md: "# EVENT AND GUI PROGRAMMING\n\nIf we look at the process to handle the clicking\
    \ of a button, what we see is that the user's mouse click sets off a chain of\
    \ events. The button object responds to the mouse click by creating a button click\
    \ event that is placed into the event queue. The event loop, when it is free to\
    \ do, picks up that event and processes it. The processing of a button click event\
    \ involves calling methods on specially registered objects called \"listeners\"\
    \ for a button click are objects implementing the java.awt.ActionListener interface\
    \ and the button click event processing involves calling the listener's actionPerformed\
    \ method, which the developer has implemented to do whatever is needed when that\
    \ particular button is clicked. Note that multiple listeners may be \"added\"\
    \ to any given button and the button click processing will call each ActionListener's\
    \ actionPerformed method in turn.\n\n# 3.4 JAVA AWT PANEL\n\nThe Panel is a container\
