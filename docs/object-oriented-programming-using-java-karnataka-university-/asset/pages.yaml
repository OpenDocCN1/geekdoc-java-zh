    # ### 1.7 FILE


    A computer file is used to store data in digital format like plain text, image
    data, or any other content. Computer files can be organized inside inside different
    directories. Files are used to keep digital data, whereas directories are used
    to keep files.


    # ### What is File in Java?


    In Java, File is an abstract data type. A named location used to store related
    information is known as File. There are several File Operations like creating
    a new File, getting information about File, writing into a File, reading from
    a File and deleting a File.


    In Java, with the help of File Class, we can work with files. This File Class
    is inside the java.io package. we import java.io.File; The File class can be used
    by creating an object of the class and specifying the name of the file.


    # ### Why File Handling is required?


    +   - File Handling is an integral part of any programming language as file handling
    enables us to store the output of any particular program in a file and allows
    us to perform certain operations on it.


    +   - In simple words, file handling means reading and writing data to a file.'
