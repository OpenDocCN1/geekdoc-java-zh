    # 3.18 APPLET


    An applet is a Java program that can be embedded into a web page. It runs inside
    the web browser and works at client side. An applet is embedded in an HTML page
    using the APPLET or OBJECT tag and hosted on a web server. Applets are used to
    make the website more dynamic and entertaining.


    +   1. All applets are sub-classes (either directly or indirectly) of java.applet.Applet
    class.

    2. Applets are not stand-alone programs. Instead, they run within either a web
    browser or an applet viewer. JDK provides a standard applet viewer tool called
    applet viewer.

    3. In general, execution of an applet does not begin at main() method.

    4. Output of an applet window is not performed by System.out.println(). Rather
    it is handled with various AWT methods, such as drawString().


    Life cycle of an applet :


    It is important to understand the order in which the various methods shown in
    the above image are called. When an applet begins, the following methods are called,
    in this sequence as shown in figure 3.26:


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_198_1.png)'
