  md: '# 4.4 EXCEPTION HANDLING


    Exception is an event that disrupts the normal flow of the program. It is an object
    which is thrown at runtime. Exception Handling is a mechanism to handle runtime
    errors such as ClassNotFound, IO, SQL, Remote etc. The advantage of Exception
    Handling to maintain the normal flow of the application. Exception normally disrupts
    the normal flow of the application that is why we use exception handling. Hierarchy
    of Java Exception classes as shown in figure 4.3.


    ![](img/8eab6a1425ff34cdb4ae3f1bc5ec5265_229_0.png)


    Fig 4.3:Hierarchy of Java Exception classes'
