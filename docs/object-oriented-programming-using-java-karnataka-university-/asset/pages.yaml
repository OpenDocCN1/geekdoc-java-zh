    +   - One to One

    - One to Many

    - Many to One, and

    - Many to Many


    Let''s understand the relationship with real-time examples. For example, One country
    can have one prime minister (one to one), and a prime minister can have many ministers
    (one to many). Also, many MP''s can have one prime minister (many to one), and
    many ministers can have many departments (to many).Association can be unidirectional
    or bidirectional.


    # J. Aggregation


    Aggregation is also a way to achieve Association. Aggregation represents the relationship
    where one object contains other objects as a part of its state. It represents
    the weak relationship between objects. In Java, inheritance represents the is.
    It is also another way to reuse objects.


    # K. Composition


    The composition is also a way to achieve Association. The composition represents
    the relationship where one object contains other objects as a part of its state.
    There is a strong relationship between the containing object and the dependent
    object. It is the state where containing objects do not have an independent existence.
    If you delete the parent object, all the child objects will be deleted automatically.


