  md: "# OOPS CONCEPTS IN JAVA\n\n+   - Inheriting Constructors: A subclass inherits\
    \ all the members (fields, methods, and nested classes) from its superclass. Constructors\
    \ are not members, so they are not inherited by subclasses, but the constructor\
    \ of the superclass can be invoked from the subclass.\n\n+   - Private method\
    \ inheritance: A subclass does not inherit the private members of its parent class.\
    \ However, if the superclass has public or protected methods(like getters and\
    \ setters) for accessing its private fields, these can also be used by the subclass.\n\
    \n# What all can be done in a Subclass?\n\nIn-subclasses can inherit members as\
    \ is, replace them, hide them, or supplement them with new members:\n\n+   - The\
    \ inherited fields can be used directly, like any other fields.\n- We declare\
    \ new methods in the subclass that are not in the superclass.\n- The inherited\
    \ methods can be used directly as they are.\n- We can write a new instance method\
    \ in the subclass that has the same signature as the one in the superclass, thus\
    \ overriding it (as in example above, toString() is overridden).\n- We can write\
    \ a new static method in the subclass that has the same signature as the one in\
    \ the superclass, thus hiding it.\n- We declare new methods in the subclass that\
    \ are not in the superclass.\n- We can write a subclass constructor that invokes\
    \ the constructor of the superclass, either implicitly or by using the keyword\
    \ super.\n\n# Why multiple inheritance is not supported in java?\n\nTo reduce\
    \ the complexity and simplify the language, multiple inheritance is not supported\
    \ in java. Consider a scenario where A, B and C are three classes. The C class\
    \ inherits A and B classes. If A and B classes have same method and you call it\
    \ from child class object, there will be ambiguity to call method of A or B class.\n\
    \nSince compile time errors are better than runtime errors, java renders compile\
    \ time error if you inherit 2 classes. So whether you have same method or different,\
    \ there will be compile error now.\n\n```\nclass A\n{\n    void msg() {System.out.println(\"\
    Hello\");}\n}\nclass B\n{\n    void msg() {System.out.println(\"Welcome\");}\n\
