    # 4.1 INTRODUCTION


    A thread is a lightweight sub process, the smallest unit of processing. It is
    a separate path of execution. Threads are independent. If there occurs exception
    in one thread, it doesn''t affect other threads. It uses a shared memory area.
    Java provides Thread class to achieve thread programming. Thread class provides
    constructors and methods to create and perform operations on a thread. Thread
    class extends Object class and implements Runnable interface.


    Multithreading is a process of executing multiple threads simultaneously as shown
