    \n# 致谢 . 20\n\n# 关于\n\n你可以将此 PDF 分享给任何你认为能从中受益的人，最新版本可以从此处下载：jsoup\n\n这是一本为了教学目的而创建的非官方免费的\
    \ Jsoup 电子书。所有内容均提取自 Stack Overflow 文档，这些文档由 Stack Overflow 的许多辛勤工作的人士编写。它既不属于\
    \ Stack Overflow 附属，也不是 Jsoup 的官方出品。\n\n内容根据 Creative Commons BY-SA 协议发布，每个章节的贡献者列表在书末致谢部分提供。除非另有说明，图像版权可能归其所有者所有。所有商标和注册商标均为各自所有公司的财产。\n\
    \n使用书中呈现的内容风险需自负；我们不保证其正确或准确，请将您的反馈和修正发送至 info@zzzprojects.com\n\n# 第 1 章：Jsoup\
    \ 入门\n\n## 备注\n\nJsoup 是一个用于 Java 的 HTML 解析和数据提取库，侧重于灵活性和易用性。它可以从 HTML 页面中提取特定数据（通常被称为“网络爬虫”），还可以修改\
    \ HTML 页面的内容，并使用允许的标签和属性白名单来“清理”不可信的 HTML。\n\n## JavaScript 支持\n\n**Jsoup 不支持\
    \ JavaScript**，正因如此，任何动态生成的内容或添加到页面的内容都无法被提取。如果你需要提取通过 JavaScript 添加到页面的内容，有几种替代方案：\n\
    \n- 使用支持 JavaScript 的库，例如 Selenium 或 HtmUnit，它们使用真实的浏览器来加载页面。\n- 反向工程通过 AJAX 加载页面，因此你可以查看浏览器的网络标签查看数据来自哪里。\n\
    \n## 官方网站与文档\n\n你可以在 jsoup.org 找到各种 Jsoup 相关资源，包括 Javadoc、Jsoup 食谱以及 JAR 下载。\n\
    \n## 下载\n\nJsoup 可以在 Maven 上作为 `org.jsoup` 获取。如果你在 Android Studio 中使用 Gradle，可以通过在\
    \ `build.gradle` 中添加以下内容加入项目：\n\n```gradle\ncompile 'org.jsoup:jsoup:1.8.3'\n\
    ```\n\n如果你在使用 Ant (Eclipse)，请在 POM 部分添加以下内容：\n\n```xml\n<dependency>\n  <groupId>org.jsoup</groupId>\n\
    \  <artifactId>jsoup</artifactId>\n  <version>1.8.3</version>\n</dependency>\n\
    ```\n\nJsoup 也可以作为下载的 JAR 用于其他环境。\n\n# 版本\n\n| 版本 | 发布日期 |\n| --- | --- |\n| 1.9.2\
    \ | 2016-05-17 |\n| 1.8.3 | 2015-08-02 |\n\n# 示例\n\n# 提取链接的 URL 和标题\n\nJsoup 可以轻松从网页提取所有链接。在这种情况下，我们可以使用\
    \ Jsoup 提取我们需要的特定链接，位于页面上的 h3 Header。我们还可以获取链接的文本。\n\n```java\nDocument doc =\
    \ Jsoup.connect(\"http://stackoverflow.com\").userAgent(\"Mozilla\").get();\n\
    for (Element e: doc.select(\".question-hyperlink\")) {\n  System.out.println(e.attr(\"\
    abs:href\"));\n  System.out.println(e.text());\n  System.out.println();\n}\n```\n\
    \n这得到了以下输出：\n\n```\nhttp://stackoverflow.com/questions/12920296/past-5-week-calculation-in-webi-bo-4-0\n\
    Past 5 week calculation in WEBI (BO 4-0)?\n\nhttp://stackoverflow.com/questions/3603701/how-to-get-information-about-the-visualized-elements-in-listview\n\
    How to get information about the visualized elements in listview?\n```\n\n发生了什么：\n\
    \n- 首先，我们从指定的 URL 获取 HTML 文档。这段代码还将请求的 User Agent Header 设置“Mozilla”，这样网站就会像往常向浏览器那样提供内容。\n\
    - 然后，使用 `select(...)` 和 `for` 循环获取所有 Stack Overflow 问题的链接，在本例中具有 `question-hyperlink`\
    \ 类的链接。\n 使用 使用 `.text()` 输出每个链接的文本，并使用 `.attr(\"abs:href\")` 输出链接的 href。\n\n"
