    \ 18\n\n# Credits . 20\n\n# About\n\nYou can share this PDF with anyone you feel\
    \ could benefit from it, downloaded the latest version from: jsoup\n\nIt is an\
    \ unofficial and free Jsoup ebook created for educational purposes. All the content\
    \ is extracted from Stack Overflow Documentation, which is written by many hardworking\
