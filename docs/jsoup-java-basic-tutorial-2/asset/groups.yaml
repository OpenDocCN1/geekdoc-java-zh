    \ unless otherwise specified. All trademarks and registered trademarks are the\
    \ property of their respective company owners.\n\nUse the content presented in\
    \ this book at your own risk; it is not guaranteed to be correct nor accurate,\
    \ please send your feedback and corrections to info@zzzprojects.com\n\n# Chapter\
    \ 1: Getting started with Jsoup\n\n## Remarks\n\nJsoup is a HTML parsing and data\
    \ extraction library for Java, focused on flexibility and ease of use. It can\
    \ be used to extract specific data from HTML pages, which is commonly known as\
    \ \"web scraping\", as well as modify the content of HTML pages, and \"clean\"\
    \ untrusted HTML with a whitelist of allowed tags and attributes.\n\n## JavaScript\
    \ support\n\n**Jsoup does not support JavaScript**, and because of this, any dynamically\
    \ generated content or content which is added to the page after page load cannot\
    \ be extracted from the page. If you need to extract content which is added to\
    \ the page with JavaScript, there are a few alternative options:\n\n- Use a library\
    \ which supports JavaScript, such as Selenium, which uses an actual web browser\
    \ to load pages, or HTMLUnit.\n- Reverse engineer how the page loads via AJAX,\
    \ and thus, Typically pages load dynamically so you can look at the network tab\
    \ of your browser to see where the data is loaded from.\n\n## Official website\
    \ & documentation\n\nYou can find various Jsoup related resources at jsoup.org,\
    \ including the Javadoc, examples in the Jsoup cookbook and JAR downloads. See\
    \ the GitHub repository for the source code, issues, and pull requests.\n\n##\
    \ Download\n\nJsoup is available on Maven as `org.jsoup`. If you're using Gradle\
    \ with Android Studio, you can add it to your project by adding the following\
    \ to your `build.gradle`:\n\n```gradle\ncompile 'org.jsoup:jsoup:1.8.3'\n```\n\
    \nIf you're using Ant (Eclipse), add the following to your POMs section:\n\n```xml\n\
    <dependency>\n  <groupId>org.jsoup</groupId>\n  <artifactId>jsoup</artifactId>\n\
    \  <version>1.8.3</version>\n</dependency>\n```\n\nJsoup is also available as\
    \ downloadable JAR for other environments.\n\n# Versions\n\n| Version | Release\
    \ Date |\n| --- | --- |\n| 1.9.2 | 2016-05-17 |\n| 1.8.3 | 2015-08-02 |\n\n# Examples\n\
    \n# Extract the URLs and titles of links\n\nJsoup can be used to easily extract\
    \ all links from a webpage. In this case, we can use Jsoup to extract only specific\
    \ links we want, in a h3 header on a page. We can also get the text of the links.\n\
    \n```java\nDocument doc = Jsoup.connect(\"http://stackoverflow.com\").userAgent(\"\
    Mozilla\").get();\nfor (Element e: doc.select(\".question-hyperlink\")) {\n  System.out.println(e.attr(\"\
    abs:href\"));\n  System.out.println(e.text());\n  System.out.println();\n}\n```\n\
    \nThis gives the following output:\n\n```\nhttp://stackoverflow.com/questions/12920296/past-5-week-calculation-in-webi-bo-4-0\n\
    Past 5 week calculation in WEBI (BO 4-0)?\n\nhttp://stackoverflow.com/questions/3603701/how-to-get-information-about-the-visualized-elements-in-listview\n\
    How to get information about the visualized elements in listview?\n```\n\nWhat's\
    \ happening here:\n\n- First, we get the HTML document from the specified URL.\
    \ This code also sets the User Agent header of the request to \"Mozilla\", so\
    \ the website serves it as it would usually serve to browsers.\n- Then, use select(...)\
    \ and for a loop to get all the links to Stack Overflow questions, in this case\
    \ links which have the class question-hyperlink.\n- Print out the text of each\
    \ link with .text() and the href of the link with attr(\"abs:href\").\n"
