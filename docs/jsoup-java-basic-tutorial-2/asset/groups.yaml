- md: "\ncase, we use abs: to get the absolute URL, ie. with the domain and protocol\
    \ included.\n\n# Extract full URL from partial HTML\n\nSelecting only the attribute\
    \ value of a link:href will return the relative URL.\n\n```\nString bodyFragment\
    \ =\n  <div<a href=\"/documentation\">Stack Overflow Documentation</a></</div>>;\n\
    \nDocument doc = Jsoup.parseBodyFragment(bodyFragment);\nString link = doc\n \
    \ .select(\"div > a\")\n  .first()\n  .attr(\"href\");\n\nSystem.out.println(link);\n\
    ```\n\n# Output\n\n```\n/documentation\n```\n\nBy passing the base URI into the\
    \ parse method and using the absUrl method instead of attr, we can extract the\
    \ full URL.\n\n```\nDocument doc = Jsoup.parseBodyFragment(bodyFragment, \"http://stackoverflow.com\"\
    );\n\nString link = doc\n  .select(\"div > a\")\n  .first()\n  .absUrl(\"href\"\
    );\n\nSystem.out.println(link);\n```\n\n# Output\n\n```\nhttp://stackoverflow.com/documentation\n\
    ```\n\n# Extract the data from HTML document file\n\nJsoup can be used to manipulate\
    \ or extract data from a file on local that contains HTML. filePath is a path\
    \ on disk. ENCODING is desired Charset Name e.g. \"Windows-31J\". It is optional.\n\
    \n```\n// load file\nFile inputFile = new File(filePath);\n// parse file as HTML\
    \ document\nDocument doc = Jsoup.parse(filePath, ENCODING);\n// select element\
    \ by \"a\"\nElements elements = doc.select(\"a\");\n```\n\nGetting Started with\
    \ Jsoup online: https://rtptutorial.com/jsoup/topic/297/getting-started-with-\n\
    \nhttps://rtptutorial.com/\n\n# jsoup\n\n# Chapter 2: Formatting HTML Output\n\
    \n# Parameters\n\n| Parameter | Detail |\n| --- | --- |\n| boolean outline() |\
    \ Get if outline mode is enabled. Default is false. If enabled, the HTML output\
    \ methods will consider all tags as block. |\n| Document.OutputSettings outline(boolean)\
    \ | Enable or disable HTML outline mode. |\n\n# Remarks\n\n+ * Jsoup 1.9.2 API\n\
    \n# Examples\n\nDisplay all elements as block\n\nBy default, Jsoup will display\
    \ only block-level elements with a trailing line break. Inline elements are not\
    \ displayed without a break.\n\nGiven a body fragment, with inline elements:\n\
    \n```\n<select name=\"menu\">\n  <option value=\"foo\">foo</option>\n  <option\
    \ value=\"bar\">bar</option>\n</select>\n```\n\nPrinting with Jsoup:\n\n```\n\
    Document doc = Jsoup.parse(html);\nSystem.out.println(doc.html());\n```\n\nResults\
    \ in:\n\n```\n<html>\n<head></head>\n<body>\n  <select name=\"menu\">\n    <option\
    \ value=\"foo\">foo</option>\n    <option value=\"bar\">bar</option>\n  </select>\n\
    </body>\n</</html>\n```\n\nTo display the output with each element treated as\
    \ a block element, the outline option has to be enabled on the document's OutputSettings.\n\
    \n```\nDocument doc = Jsoup.parse(html);\ndoc.outputSettings().outline(true);\n\
    System.out.println(doc.html());\n```\n\n# Output\n\n```\n<html>\n<head></head>\n\
    <body>\n<select name=\"menu\">\n<option value=\"foo\">foo</option>\n<option value=\"\
    bar\">bar</option>\n</select>\n</body>\n</</html>\n```\n\nSource: Jsoup - Formatting\
    \ the <option> elements\n\nRead Formatting HTML Output online: https://riptutorial.com/jsoup/topic/5954/formatting-html-output\n\
    \n# # Chapter 3: Logging into websites with Jsoup\n\n# Examples\n\n# A simple\
    \ authentication POST request with Jsoup\n\nA simple POST request with authentication\
    \ data is demonstrated below, note that the username and password field will vary\
    \ depending on the website:\n\n```\nfinal String USER_AGENT = \"Mozilla/5.0 (Windows\
