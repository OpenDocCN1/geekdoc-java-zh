  md: "case, we use abs: to get the absolute URL, ie. with the domain and protocol\
    \ included.\n\n# Extract full URL from partial HTML\n\nSelecting only the attribute\
    \ value of a link:href will return the relative URL.\n\n```\nString bodyFragment\
    \ =\n  <div<a href=\"/documentation\">Stack Overflow Documentation</a></div>;\n\
    \nDocument doc = Jsoup.parseBodyFragment(bodyFragment);\nString link = doc\n \
    \ .select(\"div > a\")\n  .first()\n  .attr(\"href\");\n\nSystem.out.println(link);\n\
    ```\n\n# Output\n\n```\n/documentation\n```\n\nBy passing the base URI into the\
    \ parse method and using the absUrl method instead of attr, we can extract the\
    \ full URL.\n\n```\nDocument doc = Jsoup.parseBodyFragment(bodyFragment, \"http://stackoverflow.com\"\
    );\n\nString link = doc\n  .select(\"div > a\")\n  .first()\n  .absUrl(\"href\"\
    );\n\nSystem.out.println(link);\n```\n\n# Output\n\n```\nhttp://stackoverflow.com/documentation\n\
    ```\n\n# Extract the data from HTML document file\n\nJsoup can be used to manipulate\
    \ or extract data from a file on local that contains HTML. filePath is a path\
    \ on disk. ENCODING is desired Charset Name e.g. \"Windows-31J\". It is optional.\n\
    \n```\n// load file\nFile inputFile = new File(filePath);\n// parse file as HTML\
    \ document\nDocument doc = Jsoup.parse(filePath, ENCODING);\n// select element\
    \ by \"a\"\nElements elements = doc.select(\"a\");\n```\n\nGetting Started with\
    \ Jsoup online: https://rtptutorial.com/jsoup/topic/297/getting-started-with-\n\
    \nhttps://rtptutorial.com/"
