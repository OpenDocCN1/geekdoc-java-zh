  md: "# # Chapter 1: Getting started with Jsoup\n\n# ## Remarks\n\nJsoup is a HTML\
    \ parsing and data extraction library for Java, focused on flexibility and ease\
    \ of use. It can be used to extract sepecific data from HTML pages, which is commonly\
    \ known as \"web scraping\", as well as modify the content of HTML pages, and\
    \ \"clean\" untrusted HTML with a whitelist of allowed tags and attributes.\n\n\
    # ## JavaScript support\n\n**Jsoup does not support JavaScript**, and because\
    \ of this, any dynamically generated content or content which is added to the\
    \ page after page load cannot be extracted from the page. If you need to extract\
    \ content which is added to the page with JavaScript, there are a few alternative\
    \ options:\n\n+   - Use a library which supports JavaScript, such as Selenium,\
    \ which uses an actual web browser to load pages, or HTMLUnit.\n- Reverse engineer\
    \ how the page loads it via AJAX, and thus, Typically, pages which load data dynamically\
    \ so you can look at the network tab of your browser's developer tools to see\
    \ where the data is being loaded from, and then use those URLs in your code. See\
    \ [how to scrape AJAX pages]() for more details.\n\n# ## Official website & documentation\n\
    \nYou can find various Jsoup related resources at [jsoup.org](https://jsoup.org/),\
    \ including the [Javadoc](https://jsoup.org/javadoc/), examples in the [Jsoup\
    \ cookbook](https://jsoup.org/cookbook/) and [JAR downloads](https://jsoup.org/download/).\
    \ See [the GitHub repository](https://github.com/jsoup/jsoup) for the source code,\
    \ issues, and pull requests.\n\n# ## Download\n\nJsoup is available on Maven as\
    \ `org.jsoup:jsoup`. If you're using Gradle with Android Studio), you can add\
    \ it to your project by adding the following to your `build.gradle` dependencies:\n\
    \n```\ncompile 'org.jsoup:jsoup:1.8.3'\n```\n\nIf you're using Ant (Eclipse),\
    \ add the following to your POMs dependencies section:\n\n```\n<dependency>\n\
    <!-- jsoup HTML parser library @ http://jsoup.org/ -->\n  <groupId>org.jsoup</groupId>\n\
    \  <artifactId>jsoup</artifactId>\n  <version>1.8.3</version>\n</dependency>\n\
    ```"
  merge: -1
  pgno: 4
