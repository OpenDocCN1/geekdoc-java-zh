  md: "| Pattern | Matches | Example |\n| --- | --- | --- |\n| [attr^=valPrefix] |\
    \ elements with an attribute named \"attr\", and value starting with \"valPrefix\"\
    \ | a[href^=http:] |\n| [attr$=valSuffix] | elements with an attribute named \"\
    attr\", and value ending with \"valSuffix\" | img[src$=.png] |\n| [attr*=valContaining]\
    \ | elements with an attribute named \"attr\", and value containing \"valContaining\"\
    \ | a[href*=/search/] |\n| [attr~=regex] | elements with an attribute named \"\
    attr\", and value matching the regex expression | img[src~=(?i)\\.(png|jpe?)]\
    \ |\n| | The above may be combined in any order | div.header[title] |\n\nSelector\
    \ full reference\n\n# # Examples\n\nSelecting elements using CSS selectors\n\n\
    ```\nString html = \"<!DOCTYPE html>\" +\n  \"<html>\" +\n  \"<head>\" +\\n  \
