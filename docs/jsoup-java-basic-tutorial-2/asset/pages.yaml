  md: '# Chapter 5: Selectors


    # Remarks


    A selector is a chain of simple selectors, separated by combinators. Selectors
    are case insensitive (including against elements, attributes, and attribute values).


    The universal selector (*) is implicit when no element selector is supplied (i.e.
    *.header .header is equivalent).


    | Pattern | Matches | Example |

    | --- | --- | --- |

    | * | any element | * |

    | tag | elements with the given tag name | div |

    | ns|E | elements of type E in the namespace ns | fb|name finds <fb:name> elements
    |

    | #id | elements with attribute ID of "id" | div#wrap, #logo |

    | .class | elements with a class name of "class" | div.left, .result |

    | [attr] | elements with an attribute named "attr" (with any value) | a[href],
    [title] |

    | [attrPrefix] | elements with an attribute name starting with "attrPrefix". Use
    to find elements with HTML5 datasets | [^data], div[^data-] |

    | [attr=val] | elements with an attribute named "attr", and value equal to "val"
    | img[width=500], a[rel=nofollow] |

    | [attr="val"] | elements with an attribute named "attr", and value equal to "val"
    | span[hello="Cleveland"][goodbye="Columbus"], a[rel="nofollow"] |'
