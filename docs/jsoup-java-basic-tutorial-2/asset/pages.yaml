  md: "# # Chapter 3: Logging into websites with Jsoup\n\n# Examples\n\n# A simple\
    \ authentication POST request with Jsoup\n\nA simple POST request with authentication\
    \ data is demonstrated below, note that the username and password field will vary\
    \ depending on the website:\n\n```\nfinal String USER_AGENT = \"Mozilla/5.0 (Windows\
    \ NT 10.0; WOW64) AppleWebKit/537.36 (HTML, like Gecko) Chrome/51.0.2704.103 Safari/537.536\"\
    ;\nJsoup.connect(\"http://website.com/loginUrl\")\n    Connection.Response loginResponse\
    \ = Jsoup.userAgent(USER_AGENT)\n    .data(\"username\", \"yourUsername\")\n \
    \   .data(\"password\", \"yourPassword\")\n    .method(Method.POST)\n    .execute();\n\
    ```\n\n# A comprehensive authentication POST request with Jsoup\n\nMost websites\
    \ require a much more complicated process than the one demonstrated above.\n\n\
    Common steps for logging into a website:\n\n+   1. Get the unique cookie from\
    \ the initial login form.\n2. Inspect the login form to see what the destination\
    \ url is for the authentication request\n3. Parse the login form to check for\
    \ any security token that needs to be sent along with username and password.\n\
    4. Send the request.\n\nBelow is an example used in this example which will log\
    \ you into the GitHub website\n\n```\n// Constants sent by server\nfinal String\
    \ USER_AGENT = \"Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36,\nlike\
    \ Gecko) Chrome/51.0.2704.103 Safari/537.536\";\nfinal String LOGIN_FORM_URL =\
    \ \"https://github.com/login\";\nfinal String LOGIN_ACTION_URL = \"https://github.com/session\"\
    ;\nfinal String USER = \"yourusername\";\nfinal String PASSWORD = \"yourPassword\"\
    ;\n\n// Go to login and grab cookies sent by server\nConnection.Response loginForm\
    \ = Jsoup.connect(LOGIN_FORM_URL)\n    .method(Connection.METHOD)\n    .userAgent(USER_AGENT)\n\
    \    .execute();\n\nDocument loginDoc = loginForm.parse(); // this is the document\
    \ containing html\nHashMap<String, String> cookies = new HashMap<>(loginDoc.cookies());\
    \ // save the cookies\nto be passed on next request\n```\n\n```\n// Prepare login\
    \ credentials\nString authToken = loginDoc.select(\"#login > form div:nth-child(1)\"\
    );\n```"
