  md: "```\n</dependency>\n```\n\nJsoup is also available as downloadable JAR for\
    \ other environments.\n\n# Versions\n\n| Version | Release Date |\n| --- | ---\
    \ |\n| 1.9.2 | 2016-05-17 |\n| 1.8.3 | 2015-08-02 |\n\n# Examples\n\n# Extract\
    \ the URLs and titles of links\n\nJsoup can be used to easily extract all links\
    \ from a webpage. In this case, we can use Jsoup to extract only specific links\
    \ we want, in a h3 header on a page. We can also get the text of the links.\n\n\
    ```\nDocument doc = Jsoup.connect(\"http://stackoverflow.com\").userAgent(\"Mozilla\"\
    ).get();\nfor (Element e: doc.select(\"*.question-hyperlink\")) {\n  System.out.println(e.attr(\"\
    abs:href\"));\n  System.out.println(e.text());\n  System.out.println();\n}\n```\n\
    \nThis gives the following output:\n\n```\nhttp://stackoverflow.com/questions/12920296/past-5-week-calculation-in-webi-bo-4-0\n\
    Past 5 week calculation in WEBI (BO 4-0)?\n\nhttp://stackoverflow.com/questions/3603701/how-to-get-information-about-the-visualized-elements-in-listview\n\
    How to get information about the visualized elements in listview?\n\n...]\n```\n\
    \nWhat's happening here:\n\n+   * First, we get the HTML document from the specified\
    \ URL. This code also sets the User Agent header of the request to \"Mozilla\"\
    , so the website serves it would usually serve to browsers.\n* Then, use select(...)\
    \ and for a loop to get all the links to Stack Overflow questions, in this case\
    \ links which have the class question-hyperlink.\n* Print out the text of each\
    \ link with .text() and the href of the link with attr(\"abs:href\"). In this"
  merge: -1
