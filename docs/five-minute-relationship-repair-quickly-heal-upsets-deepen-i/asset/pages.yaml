    Being triggered also leads to some form of reactive behavior, such as blowing
    up, shutting down, complaining, offering advice, or any of the control patterns
    listed in chapter 7. You tend to react with habitual coping strategies that help
    you avoid your real feelings. Remember, not all reactive behaviors are obvious.
    When you shut down and clam up, this, too, is a reactive behavior.


    Accompanying reactive stories and behaviors are reactive feelings. The most noticeable
    reactive feelings are anger, resentment, contempt, disappointment, anxiety, overwhelm,
    confusion, fear, and going numb. These emotional states will be accompanied by
    body sensations.


    Other types of feelings may be harder to notice. Underneath reactive feelings
    lies a deeper layer of softer, more vulnerable feelings. These are often overlooked.
    Later in the chapter we will discuss these less-visible feelings. For now, let’s
    examine the reactive feelings that get triggered, since these are foster frustrating
    or unproductive communication.


