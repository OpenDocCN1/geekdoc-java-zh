  md: '“Did I get everything you said?”

    “Is there anything you want to correct or add?”


    If your partner tells you that you missed something, try again, and do not take
    this as a failure on your part. It can be hard to recall the elements of a message,
    especially one that has emotional charge. Research shows that emotional charge
    will interfere with memory accuracy. Be gentle with each other. Sometimes, as
    the listener, it takes several attempts to accurately hear and repeat your partner’s
    message. Our brains will substitute something we would have felt or needed rather
    than what we heard partner say. Do not be surprised by memory problems, especially
    as you are just learning this tool.


    # Give a Reassuring Response


    Repeating the key elements of your partner’s message — fears, and needs — fulfills
    the first part of your role as an effective listener. To accomplish repair, the
    other part is to give your partner the appropriate reassuring response. We call
    this skill responsive listening.


    When delivering a Repair Statement, your partner is revealing core feelings, fears,
    and needs. If you have been listening with an open heart, you will naturally want
    to respond in a way that alleviates your partner’s fears and helps him or her
    feel safe with you.


    The most relevant reassurance will come from your knowledge of your partner’s
    core fears and needs. Even if your partner doesn’t explain these clearly, you
    may have developed a good sense of what these are doing by the exercises in chapter
    8. Try to target your reassurances to these core fears and always deliver your
    reassurances with friendly eye contact, supportive touch, and a caring, soothing
    voice tone.


    Sometimes, our attempt to be empathetic is undermined by an urgent desire to have
    our partner hear and understand our own feelings and needs. That will come later
    when you read your Repair Statement. Right now in the repair sequence, it is your
    turn to provide reassurances of safety to your partner. Be willing to be the first
    to offer empathy, reassurance, and coregulation.'
