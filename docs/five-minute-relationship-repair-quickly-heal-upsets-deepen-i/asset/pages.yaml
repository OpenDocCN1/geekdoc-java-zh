  md: '# # Acknowledgments


    ![](img/84b916e6578420b9e8019ef08b9669dc_235_0.png)


    FIRST, WE THANK ALL THE COUPLES we have had the honor to work with the past four
    decades: In your courage to open and grow, each of you has offered us the opportunity
    to discover what partners need to make love thrive.


    Next, we want to thank Peter Levine: Your development of Somatic Experiencing
    as an approach to healing trauma expanded our ability to help partners coheal
    through coregulation and holding presence for each other’s inner experiences.


    We also want to thank Sue Johnson: Your development of Emotionally Focused Therapy
    for couples increased our understanding of how reactive cycles operate and how
    to help partners express their core feelings, fears, and needs.


    A special thanks to Stan Tatkin for his development of the Psychobiological Approach
    to Couples Therapy: The priority you place on partners being good guardians of
    their couple bubble solidified our emphasis on coregulation and the need for quick
    repair. You inspired us to see how partners can rewire each other’s brains so
    that they can function securely as a couple in love.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'We want to also thank many other contributors to our thinking: Carl Rogers,
    Carl Jung, Fritz Perls, John Grinder, Milton Erickson, Helen Palmer, John Bowlby,
    Stephen Porges, Roberto Assagioli.


    Finally, we want to thank the tireless researchers in the fields of neuroscience
    and attachment theory: Your studies have helped us embrace the emerging attachment-based
    paradigm for helping couples reduce distress, operate more securely, and maximize
    their mutual happiness.'
