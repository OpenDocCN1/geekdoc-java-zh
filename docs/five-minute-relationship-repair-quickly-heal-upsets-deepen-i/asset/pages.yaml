  md: 'To get a sense of the power of our automatic patterns, imagine that you and
    your partner are discussing a sensitive topic (such as sex, money, or your kids).
    Suddenly, all the smoke alarms in your house start blaring so loud you can''t
    follow your own thinking, much less hear your partner accurately. Your system
    is flooded. Do you think you''ll be able to successfully resolve an interpersonal
    issue while your alarms are blaring?


    After all of the alarms stop ringing we can discuss a sensitive topic with any
    hope of finding a good solution. It''s impossible to do while being overtaken
    by the urgent impulses to flee for one''s life, desperately fight for it, or to
    numb out if both of those options seem hopeless. So, if you have ever felt hopeless
    in trying to stop your downward spiral, give yourself some compassion. This happens
    to everyone. States of fight, flight, and freeze are biological imperatives that
    get executed automatically by a part of the brain we cannot control.


    What if we had stopped Donna in the middle of her angry outburst and asked, "Do
    you think you''re in physical danger right now?" She wouldn''t have thought so.
    Nor would she have realized her body was in a state of fight-or-flight, rushing
    energy into her limbs while shutting down her brain capacities. Like most of us,
    Donna had no idea that her survival alarm was ringing.


    What if we had asked her, "Do you think the upset you are feeling entirely about
    Eric? Do you have any awareness right now about how your father used to speak
    to you in a superior tone?" Since she was wrapped up in blaming Eric, it''s unlikely
    she was thinking about her father at all. However, she had made this connection
    at least once before, our reminder might have given her pause.


    Or we could have asked her, "What sensations do you notice in your body right
    now?" If directed to observe this, she might have reported feeling a knot in her
    stomach or a shaky feeling in her chest. By paying close attention to sensations
    in the body — especially in the chest and belly — we can detect when our survival
    alarm has gone.


    When we fall into a state of fight, flight, or freeze, we usually think our upset
    feelings are the result of the other person''s behavior. Sometimes we even think
    a partner is choosing to trigger us. We have no idea what old programming lies
    at the root of our triggers.'
