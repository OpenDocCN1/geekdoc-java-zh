  md: '# Apologies Are Powerful Healers


    Your offer of reassurance to your partner might also include an apology. In Donna
    and Eric''s example, each delivered several apologies:


    > “I''m sorry I hurt you.”

    “I’m sorry my reaction triggered you to feel like you weren’t accepted and valued
    by me.”

    “I’m really sorry I shut you out, ignoring what was happening with you.”

    “I’m sorry for lashing out, and I’d like to take it back.”


    Some people find it very difficult to apologize. This can be due to early negative
    experiences, being shamed when they admitted they made a mistake. Remember, apologizing
    is not the same as saying that you are wrong or bad. Saying “I’m sorry” in this
    context communicates that you care about how your partner feels. You are saying
    you recognize the painful emotion your partner has experienced, and you are sorry
    for any behavior of yours, even if it was unconscious, that played a part or triggered
    it.


    In most cases, the shorter the apology, the more power it has. The most powerful
    apology of this is to simply say, “I’m so sorry I hurt you.” The simple directness
    of this can penetrate deeply into your partner’s brain. It can wire in the faith,
    perhaps for the first time, someone cares about his or her feelings. Imagine that
    your partner’s hurt feeling is located deep inside his or her heart. Your apology
    is a verbal way to put your hand on or her heart to soothe that pain. If you want
    to actually put your hand on your partner’s heart area as you look into his or
    her eyes and speak, that could be even more powerful. Always keep your words simple
    and your sentences short.


    Note that this is not the time to clarify your intentions, such as saying that
    you meant to help or didn’t realize your actions would hurt your partner. That
    would be about you, not your partner. It takes times in the wrong direction and
    sounds like you were trying to clear your good name or justify yourself.'
