  md: '# Doing a Full Two-Way Repair Process


    Now is a good time to practice using this tool to repair reactive incidents in
    your relationship. In the chapter’s first exercise, you filled out a Repair Statement
    for a particular past incident. If you are reading the book with your partner,
    the following exercise will guide you in a full two-way Five-Minute Relationship
    process.


    Print out two blank Repair Statements from appendix A in the online workbook,
    or copy them from appendix A in the back of this book. Next, each of you fill
