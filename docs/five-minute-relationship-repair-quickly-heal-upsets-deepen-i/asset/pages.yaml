  md: '# Insecure Functioning in Your Relationship


    Partners operating in the preoccupied or avoidant mode tend to behave in ways
    that bring about the outcomes they fear most. Instead of seeking or offering reassurances
    of safety, they react aggressively, defensensively, or selfprotectively. This,
    in turn, triggers resistance and resentment. Over time, partners spiral down into
    deeper levels of distress. After a while, almost anything they discuss winds up
    triggering both of them. They cannot speak from their hearts, openly, simply,
    vulnerably, and undefended. Instead, they communicate using a metaphorical sword
    or shield depending on which insecure mode dominates their nervous system.


    Everyone has access to both sword- and shield-like behaviors and will use one
    or the other depending on the circumstances. Likewise, any of us can behave as
    more avoidant or more preoccupied, depending on many factors. In general, the
    more one partner becomes a preoccupied pursuer, the more the other will behave
    like an avoidant withdrawer — and versa.


    Let''s look in detail how communicating with a sword or shield perpetuates a couple''s
    sense of danger.


    # Communicating with a Sword


    When Donna starts acting like a preoccupied pursuer, she hides her softer core
    feelings and needs behind a sword — complaining, criticizing, prodding, questioning,
    provoking, making suggestions, yelling, or blowing up.


