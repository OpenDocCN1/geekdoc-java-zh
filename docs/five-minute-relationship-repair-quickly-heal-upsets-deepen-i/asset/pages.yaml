  md: '# Why the Alarm Mistakes One’s Partner for a Tiger


    Vocal tone, facial expression, and physical gestures are continually being read
    by our survival alarms as we interact with others. Some signals are inherently
    triggering. A female''s high, shrill voice is how our earliest ancestors signaled
    distress to get to others for safety. A male projecting a low, booming tone is
    how men scared away a predator. Someone showing teeth or sneering in anger can
    activate a partner’s alarm. Sudden physical gestures imply threat. Behaviors like
    these will reflexively trigger our alarms.


    Of course, a great number of our triggers are programmed by past experiences that
    were scary, painful, or upsetting. This was true for Donna Eric’s advice-giving
    voice resembled tonal quality her father used in her childhood. Eric unwittingly
    pushed an old button into her alarm. Simultaneously, as Donna reacted, her angry
    tone triggered in Eric the threat he felt in childhood when his parents started
    yelling. This is how Donna and Eric cotrified false alarms in each other’s survival
    systems. Their alarms did not distinguish that these sounds were coming from different
    people in an entirely different time and place.


    Our alarm systems are built to make mistakes. A good alarm, by its very nature,
    will overgeneralize and sound a lot of false alarms. It’s about survival, after
    all. Hence, our alarms go off automatically if an intimate partner does something
    to earlier painful or scary experiences.


    # Core Needs for Emotional Safety in an Intimate Partnership


    In an intimate partnership we need to feel emotionally safe and secure. Otherwise
    we will be triggered to some degree. We want to feel like we have each other’s
    backs, operate like a team, and can rely on each other. We want to trust that
    we are accepted, valued, and loved that we can be our authentic selves in the
    relationship.


    What got Donna’s alarm ringing wasn''t a threat to physical survival but rather
    a threat to her feeling safely connected emotionally with Eric. In her mind, her
    need to feel valued and respected had been threatened. When she heard his voice,
    she was flooded with old, unprocessed painful memories'
