    # Listening to Your Partner


    The clearing practice follows the same talker-listener structure as the Repair
    Statement. Being a spacious, nondefensive listener is important. As you hear the
    impact of your behavior on your partner, resist the urge to explain or defend.
    Pause and take in your partner’s words and feelings. Notice the sensations and
    feelings in your body. Are you open or contracted? Can you take a breath and calmly
    sit with what you hear? For the moment, put your thoughts on the back burner,
    knowing you’ll get your turn soon.


    After you have taken time to really let in what your partner has told you, repeat
    back what you heard — especially the core feeling, fear, and need that were disclosed.
    Experiment with including more elements as you increase your ability to remember.
    For instance, add in your partner’s triggering stimulus or reactive story. Acknowledge
    your partner for what he she said. If what you hear is surprising or troubling,
    acknowledge this without necessarily agreeing or disagreeing with the content
    — at least first.


    In instances where you disagree, it is especially important to repeat back what
    you heard. Repeating your partner’s words gives you time to center and calm yourself.
    It keeps you from reacting. And it gives you time to assimilate the information
    so you can respond more authentically.


    This practice of repeating what you just heard and checking out your accuracy
    is called active listening. It is a process that couples counselors have been
    teaching to clients since the 1960s, when it was developed by psychologist Carl
    Rogers.


    # The Benefits of Active Listening


    Active listening, the process of repeating back what you heard, has several benefits.
    These include the following:


    +   **Your partner feels heard.** When you accurately report what you heard, your
    partner will feel you are really listening.'
