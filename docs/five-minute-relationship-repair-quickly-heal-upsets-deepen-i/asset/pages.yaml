    # Warning Signs of a Survival Alarm Takeover


    What can you do when your alarm starts ringing? Step one is to accept that this
    sort of thing happens — even to the nicest, most intelligent, and most conscious
    people. Step two is learning to recognize the early warning signs of being triggered.


    Paying attention to your body sensations will help you recognize when your survival
    alarm has been activated. While we don''t have direct control over getting triggered,
    we can learn to do something once we realize our alarms are activated. The first
    signs are in the physical body.


    What do you feel in your body when you become upset? You might feel a knot in
    your stomach, pressure in your chest, or a lump in your throat. You might feel
    your heart pounding, a shaky or fluttering feeling, or a churning in your gut.
    Some people feel a tightness in their muscles, shoulders, chest, while others
    feel heat rise as their body temperature changes. These are typical signs of fight
    or flight. Signs of freeze might include feeling fuzzy, lethargic, shut down,
    drained, a loss of energy, a slumping over, a sense of numbness, or going blank.'
