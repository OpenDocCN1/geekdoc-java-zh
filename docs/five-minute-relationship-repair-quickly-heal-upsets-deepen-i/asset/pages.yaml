  md: 'appreciates how hard I work to support this life-style she enjoys. She has
    no idea what I''m up against.


    Eric and Donna were at it again. Only a few years into their marriage, they were
    already feeling disconnected and disconnected.


    What causes such disconnection? We search for reasons — most of which involve
    blaming the other person: "If only he would pay more attention to me .. . "If
    only she would be happy with what I do for her and stopping failing. ." Typically,
    we never get to the root of our distress.


    We cannot see the real causes of emotional upsets and communication breakdowns
    because they are driven by a part of the brain that operates outside of conscious
    awareness. It acts like an alarm going off in the nervous system when it detects
    a potential threat to our survival, including a disturbance in our connection
    to “the one we depend on.” In this book, we refer to this as survival alarm.


    Like radar, your survival alarm is always scanning for danger. As with other animals,
    this alarm system was built into the human species to quickly accelerate our bodies
    into if a predatory animal was even suspected to be nearby. It prompts a fight-or-flight
    response, which in prehistoric times would have prevented us from being eaten
    by saber-toothed tigers!


    Modern civilization has made our physical survival more secure, but the human
    brain still retains this primitive warning system. Nowadays, it seems to be hooked
    up to how safe and secure we feel with an intimate partner. Things like a sharp
    voice tone or a disapproving facial expression can trigger an automatic impulse
    to attack or run for our lives, if a tiger has suddenly appeared.


    When Eric and Donna tried to make sense of what the romantic feelings they used
    to share had become so infrequent, it did not occur to them to look into the inner
    workings of their nervous systems. Like most people, they had learned to seek
    answers through the logic of their own limited understanding: Eric would wonder,
    "Can’t she learn to speak to me without that critical edge in her voice? She knows
    it irritates me." Donna would ask herself, "Doesn’t he know by now that all I
    need is a little more time with him? I’m not trying to control his life.


    Perhaps you have been in Eric’s or Donna’s shoes in a significant love relationship
    — perhaps more than once. Maybe you can remember that'
