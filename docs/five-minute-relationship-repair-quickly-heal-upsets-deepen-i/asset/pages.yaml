    A current approach in trauma recovery methodology is that healing from early wounding
    occurs little by little. It is not necessary or even advisable to go all the way
    into the remembered painful experience in one session. That can retraumatize your
    nervous system. The best way to achieve a complete healing is to do this practice
    by little, a bit at a time, anytime or whenever one of your buttons pushes.


    # Self-Inquiry Before a Five-Minute Relationship Repair


    As mentioned above, it can be very helpful for both partners to do a Compassionate
    Self-Inquiry during the pause phase that might precede the Five-Minute Relationship
    Repair process (see chapter 10). In this way, you would use your pause to connect
    with your upset feelings and notice if any earlier memories arise that relate
    to your current upset.


    Afterward, you would both fill out your Repair Statements and share them with
    each other. Your repair process will go much more smoothly if you have done this
    self-inquiry practice first — because it helps you take responsibility for your
    own sensitivities and buttons. It also builds confidence that you can handle the
    normal frustrations that come with a relationship. This helps you avoid the trap
    of thinking you or your partner has done something bad or wrong if one of you
    is upset. Upsets happen. No one is to blame. No one is bad or wrong.


    When partners share their discoveries about the origins of their triggers and
    buttons, this helps them have more empathy for each other. As partners know each
    other more deeply and realize the impact of their childhood wounds, can overcome
    the tendency to take each other''s reactive behavior personally.


    This information about each other also helps you know what to say and to reassure
    your partner when old fears get triggered. Simple key statements like “I think
    you’re good enough exactly the way you are” and “Your feelings are important to
    me” can help make up for what each of you did not receive as children. Such reassurances
    heal any insecure attachment circuits and build a secure emotional bond.'
