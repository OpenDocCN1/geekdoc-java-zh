  md: '# Appendix A


    # The Five-Minute Repair Process


    ![](img/84b916e6578420b9e8019ef08b9669dc_226_0.png)


    # The Repair Statement


    Note: To fill in the blanks in the Repair Statement, see the appropriate categories
    in the appendix B reference lists.


    +   “I’d like to repair something with you. Is this a good time?

    “I got triggered when I heard you say (or saw you do) [name your partner’s specific
    words or actions].

    “A story came up in my mind that [describe your reactive story].

    “I reacted by [describe your reactive behavior].

    “But deep down inside, I felt [name your core feeling].'
  merge: -1
  pgno: 226
- img_proc: true
  md: '“A fear came up in me that [name your core fear].


    “What I needed more than anything was to feel [name your core need].",


    “I am sorry I reacted that and would like to take it back.",


    “If I could do it over again, I would have told you that I was feeling [repeat
    your core feeling].


    “And I would have asked for reassurance that [repeat your core need].”.


    # The Reassuring Response


    As a listener, when offering a reassuring response, first repeat back what you
    heard your partner say. Include the core feeling, core fear, and core need your
    partner revealed in the last part of his or her statement. With an attitude of
    understanding and empathy, say to your partner something like the following:


    “What I heard you say was that you felt [repeat your partner’s core feeling and
    core fear].”.


    “And you needed reassurance that [repeat your partner’s core need].”.


    Use the actual words your partner said, leaving out your own interpretations,
    stories, corrections, judgments, disputes, and self-defense. Follow your recap
    with these questions:


    “Did I get everything you said?”


    “Is there anything you want to correct or add?”


    If your partner reports that you missed something, simply try again until he or
    she is satisfied.'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'Next, if appropriate, deliver a simple apology. Using supportive touch, look
    into your partner’s eyes, and speak in a soothing, slow voice. Say something like:


    “I’m sorry I hurt you.”


    Finally, deliver a message that reassures any core fears or core needs revealed
    in the Repair Statement. When you speak, look into your partner’s left eye and
    slowly repeat your statement three times, with pauses in between. Use simple statements
    like the examples below:


    +   “You’re the most important person in my life.”


    +   “You are more important to me than anything.”


    +   “I need you very much.”


    +   “I can’t imagine life without you.”


    +   “You can’t get rid of me.”


    +   “I’m in this for the long haul.”


    +   “I care deeply how you feel.”


    +   “Your happiness is very important to me.”


    +   “You are great just the way you are.”


    +   “I feel lucky to have found you.”


    +   “You’re the most wonderful partner in the world.”


    +   “You’re the best thing that ever happened to me.”


    +   “You are more than good enough.”


    +   “You are irreplaceable.”


    +   “You are my hero.”


    +   “I love you just the way you are.”


    +   “I appreciate you for all you do for me and us.”'
