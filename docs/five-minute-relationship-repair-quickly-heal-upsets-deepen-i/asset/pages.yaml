- img_proc: true
  md: 'awful sinking feeling of loss — when you find yourself thinking, “This is not
    the person I fell in love with. What is happening to us?”


    Eric and Donna started out very much in love. They knew that not all couples made
    it and that about half of all marriages end in divorce. But they felt confident
    that their love was true and deep and strong. They weren’t exactly youngsters
    when they met, either — which they considered another factor in favor of success.
    They had both been around and seen a lot of life. They knew themselves, or so
    they thought. But over time, as Eric tried to keep the peace and Donna tried to
    get more of his attention, they began to feel if they were pulling in opposite
    directions.


    Let’s take a closer look at how these two lovers — who are composite characters
    we will revisit throughout the book — came to feel less and less safe in their
    relationship. Donna and Eric are based on hundreds of couples we’ve worked. Their
    reactive incidents, and increasing inability to repair them on their own, are
    typical.


    # Eric and Donna’s Fall from Grace


    Donna was initially attracted to Eric’s self-assured competence. He was the kind
    of guy who always knew how to make things work and how to fix them if they didn’t.
    He mastered any technology that came along. As a successful architect, he could
    do any home-improvement job and even build a house from the ground up.


    He had a confident gait and an inviting smile. But what really attracted Donna
    was his humility. Accustomed to guys who endlessly bragged about achievements
    and possessions, Donna almost had to draw out of Eric that she was a partner in
    a prestigious architectural firm. She also loved the deeply peaceful feeling she
    got around her sometimes frenied pace. She was calmed by his quiet demeanor and
    amazed at how intently he listened to her.


    What attracted Eric to Donna was her colorful, expressive style. He loved the
    artistic way she dressed and her animated style of speaking and moving. Expansive
    gestures, the way her eyes sparked, the happy tone of her voice, and how she touched
    him, all turned him on in a big way. Donna’s ready enthusiasm about even the smallest
    things was contagious and could lift Eric’s spirits.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'It didn’t take long before each felt they had found “the one.” With Donna at
    his side, even a trip to the neighborhood coffeehouse seemed to Eric like a visit
    to some magnificent and unfamiliar place. When Donna had Eric by her side, she
    felt deeply safe and secure for the first time in her life. Together, life seemed
    full of magic and wonder. They were alive with excitement, curiosity, and hope.
    They wanted to share every possible moment with each other.


    The pair experienced their first noteworthy upset about three months into their
    relationship. Eric arrived at Donna’s house to take her out for a romantic evening.
    He arrived with dreams of sharing a pleasurable meal at their favorite café, followed
    by even more pleasurable lovemaking later on.


    Shortly after arriving at Donna’s home, Eric noticed that she seemed a bit tense.
    When he asked what she was wrong, she started recounting how her boss unfairly
    overloaded her with her work that afternoon.


    As he tried to give her helpful advice on the situation, Donna seemed to get more
    distressed, rather than calming down. Desperate to keep his dream of a pleasurable
    evening intact, Eric responded by getting more logical about how she could solve
    her work problem, while his voice shifted to a lower, flatter, slightly impatient
    tone.


    Suddenly, Donna shot back, “You think I’m stupid? I know all that! Why can’t you
    see things my way once in a while?”


    Eric was stunned. He didn’t know what to say. All he could think of, “I have to
    get out of here!” Without pausing, he stood up, walked down the stairs of her
    porch, and got back in his car, leaving Donna by herself in tears. Their date
    was cut short, and the honeymoon phase of their relationship became an abrupt
    end.


    Neither could make sense of what had happened. All they knew that each felt misunderstood
    and frustrated.


    # Identifying Triggers


    Eric’s behavior was received very differently from the way he intended. He had
    offered what he considered helpful input, but Donna got upset. For her, this happened
    quite automatically. She wasn’t aware of how his words upset her so much.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Dissecting this interaction, we see that initially provoked Donna was a shift
    in Eric''s voice tone. It was like this pushed a button inside her unconscious
    mind, and she reacted. In other words, Donna was triggered. A certain stimulus
    — in this case, Eric''s vocal tone and perhaps his facial expression — triggered
    her survival alarm. Of course, his words were not an actual threat to her survival,
    but the effect on her nervous system was pretty much the same as it would''ve
    been if a hungry tiger had appeared in the room.


    Looking back over your own emotions seemed to take over, causing you to do and
    say things you would not have done had you not been triggered. This is because
    anything that threatens your felt sense of connection to the one you depend —
    your significant other — can seem like a threat to your survival. When your survival
    alarm starts ringing, petty much takes over your nervous system.


    Later, after calming down, Donna realized that Eric''s tone of voice reminded
    her how her father sounded when she was a child. She disclosed to Eric: “My father
    had a certain lecturing tone when I did things he disapproved of. When he spoke
    to me that, I felt ridiculed and belittled. I would end up feeling I wasn''t good
    enough in his eyes. I never felt safe enough to tell him how much this hurt me.”


    Like most of us, Donna had an unhealed emotional wound from childhood. Early experiences
    with her father instilled in her an unconscious sensitivity to voice tones. Her
    alarm was set off by the way Eric sounded as he gave advice. We commonly call
    this “getting triggered” or “having one''s buttons pushed”. When this happens,
    we feel and react in ways that are out of proportion to the actual situation.


    Eric had no way of seeing into Donna''s unconscious mind. It was certainly not
    his intention to belittle her. He thought he was being helpful. But he, too, had
    fear thoughts that remained unconscious and probably fueled his need to give advice
    using that flat voice tone. He was afraid that Donna''s agitation over her boss
    might spoil their night together. He was unaware that his body, including his
    vocal cords, tightened up when he heard the person he loved in distress. He had
    a pattern of trying to fix things before they got out of control.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Both Donna and Eric had a lot going inside of them that they had not learned
    to pay attention to. Without realizing it, their bodies and minds were overtaken
    by the survival states of fight, flight, or freeze.


    Whenever Eric was triggered, his whole body would tense up, and his mind would
    either race with too many thoughts or he would want to do something — running
    away. This is the flight response. When Donna was triggered, her stomach would
    get tight, and her breathing would become shallow. She would stop listening to
    the hurtful input and start using loud words to fend off the danger. This is the
    fight response.


    A third common reaction is the freeze response, where someone starts to shut down,
    go blank, or numb out emotionally. Later, we will see how Eric gradually fell
    into this response as the couple’s reactivity escalated over the years.


    As Donna’s alarm reacted to Eric’s voice tone, it affected her own voice. The
    moment she heard his flat tone, her own voice shifted, becoming louder, higher
    pitched, and strident. Hearing Donna’s voice increase in volume and tension, Eric’s
    alarm triggered. In childhood, Eric saw bad things happened when people yelled.
    He had learned to be afraid of harsh voice tones and angry facial expressions.
    When he saw people getting angry, he would run and hide in his bedroom closet
    to protect himself. Now when Donna’s voice got louder and her face angry, she
    suddenly felt the need to escape.


    As observers, we can see how Donna and Eric’s survival alarms took over, quickly
    sending them into states of upset that completely overpowered their ability to
    communicate in a conscious or loving way.


    All of us have suffered such upsets. Unhealed experiences from our past programmed
    our survival alarms to scan for similar cases in the present, and when our alarms
    go off, we catapulted into offensive, defensive, or numbed-reactions. When we
    get triggered like this, things can spiral rapidly out of control, even when circumstances
    seem normal and familiar. We fall under the influence of adrenaline or other strong
    body chemicals. When this happens, we don’t realize how inebriated we are. Just
    like getting drunk, it can take time to discharge such biochemical states before
    our higher brain functions come back online.'
  merge: -1
  pgno: 18
