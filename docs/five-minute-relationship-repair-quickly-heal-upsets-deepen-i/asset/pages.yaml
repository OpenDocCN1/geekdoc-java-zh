  md: '# Compassionate Self-Inquiry


    Before beginning the process described below, find a location where you feel safe
    and physically comfortable and where you won’t be interrupted. Ideally, the space
    should allow you to lie down if you want. Bring things you find especially soothing
    (like a soft blanket, a big pillow, or a favorite object like a stuffed doll or
    animal). Once you’ve arranged your location, take a moment and use your favorite
    self-calming tool from chapter 3 — feel yourself supported by your chair, track
    your breathing, relax deeply.


    To start Compassionate Self-Inquiry process, identify a specific triggering incident
    to explore. As practice for your first session, choose only a mildly upsetting
    incident from an adult relationship in your past. You are familiar and comfortable
    with the practice, use it with any recent triggering incident or past issue.


    # Recall the Triggering Incident


    Recall the setting and circumstances of the triggering incident. What did the
    other person do or say that triggered you? Remember the scene in as much vivid
    detail as you can. Try to hear the words and see the actions. What did you want
    from this person? What did you sense and feel? As you recall the upset right now
    in your chest, belly, throat, and heart? Put the palm of your hand on top of those
    sensations as an act of self-nurturing. Or use both arms and give yourself a hug,
    embracing your sensations or feelings as a nurturing parent would embrace a hurting
    child.


    Or, imagine this upset part of you is a more tender, vulnerable aspect of yourself.
    With compassion, witness this upset or hurting part of yourself you hold it with
    a spacious, nurturing attitude. Stay with whatever you are feeling for as long
    as you need, giving yourself empathy for any pain, fear, frustration, or disappointment.
    As you do this, remember to breathe fully and deeply. You are making space for
    your upset self to more fully experience things you may not have felt at the time.
    Track your body sensations using the guidance in the Sense-Feel-Heal practice
    (see chapter 14).'
