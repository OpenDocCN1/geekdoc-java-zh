  md: 'Letting yourself feel emotional pain is healing because you give yourself permission
    to experience and move some emotional energy that you may never have allowed yourself
    to feel before. Most of us, as children, came to believe that if we were in pain,
    something was bad or wrong about us. This is because our caregivers often tried
    to distract us from our pain or get us to override our upsets. So we learned early
    on to either shut down or amp up our feelings, which offered little chance for
    our upsets to receive the nurturing reassurances we needed. When we lovingly embrace
    our upsets, we offer ourselves the corrective emotional experience that allows
    ours to resolve naturally.


    # Some Cautions and Reminders


    In practicing Compassionate Self-Inquiry, you might notice a tendency to shut
    down as you begin to experience buried feelings. For instance, you may find yourself
    trying to understand why something happened rather than simply feeling what you
    felt. Sort of resistance to uncomfortable feelings is normal. Just go as far as
    you can with this practice. Encourage the hurting part of yourself to feel and
    express your hurt, knowing that your adult awareness is witnessing this acceptance
    and compassion. It takes many repetitions to rewire your nervous system, so be
    patient.


    Sometimes people say, “But what if I have a tendency to become impatient with
    myself? What if I don’t like the wounded part of me? What if I view this part
    of me as a nuisance or think I shouldn’t be so sensitive or insecure?


    If this happens to you, notice what you feel as you observe your inner critic.
    Imagine the interaction as if you were watching a parent and child. What would
    you feel if a mother told her crying child to grow up or get over it? Does it
    change what you feel if you see yourself from this perspective If you feel sadness,
    this is a good start. That’s the beginning of a softer, more empathetic attitude
    towards yourself.


    If you do this practice regularly, you will heal your triggers over time. For
    now, just accept that your core feelings and needs will be suppressed at the time
    of the incident, and you will have a tendency to react. Learn to pause as soon
    as you notice reactivity. Use Compassionate Self-Inquiry to help get back to being
    your more resourceful self.'
