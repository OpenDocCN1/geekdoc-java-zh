- img_proc: true
  md: 'By now, you know that relationships provide fertile ground for having your
    buttons pushed. Each time you get triggered, see if you can welcome it as part
    of your healing process — as a window into what still needs healing.


    Nature gives us what we need to heal ourselves. The problem is we think we know
    better, so we try to control what''s natural and substitute what''s comfortable
    to our egos. The self-healing tools in this book give us practice using what nature
    has given us — our feelings and our ability to move stuck energy.


    Get used to revealing to your partner when you get triggered, either in the moment
    or even days or weeks afterward. This helps you relax into the fact that you do
    have buttons, and so does your partner, and that having your buttons get pushed
    is forgiven, human, and normal.


    When you can openly admit you have buttons, you won''t feel the need to hide your
    weaknesses. You''ll less defensive. You won''t be afraid of being found out, of
    looking bad, or of not being perfect. Having nothing to hide is a great boon to
    self-trust and to feeling safe in your relationship and in your life. To paraphrase
    a famous song, you may even come to recognize that “freedom’s just another word
    for nothing left to hide.”'
