    for healing and growth.


    We agree to operate in line with these, our “Ten Commandments":


    +   1. If either of us is triggered, we will ask to pause. Then we will calm ourselves
    and, if possible, offer coregulation and reassurance to calm each other.


    +   2. We will catch our reactive communication and stop it before it escalates.
    We will look for the softer feelings and needs underneath more aggressive or defensive
    feelings.


    +   3. We will use the Repair Statement whenever there is a reactive incident
    so we can repair it and get back to feeling safe together.


    +   4. We will keep learning to better express our core feelings, fears, and needs
    — even when we are not engaged in repair. We will build emotional intimacy and
    trust by being transparent about the things that trouble us — before these things
    build up.


    +   5. We will appreciate and reassure each other when we disclose our vulnerable,
    softer parts, by giving the reassuring response the other needs to feel safe and
    secure.


    +   6. We will use the talker-listener structure whenever we discuss difficult
    issues, slowing down our communication so we really hear each other.


    +   7. We will make it our regular practice to check in with each other and clear
    the air once a week. We will also do this spontaneously as the need arises.


    +   8. We will connect every day with some type of physical and emotional coregulation,
    including hugs and acknowledgments.


    +   9. We will make fairness, mutuality, and equality our primary values. We will
    decide all matters and resolve all issues in a way that works for both of us.


    +   10. We are going to make mistakes, trip up, and accidentally trigger each
    other. Whenever that happens, we will forgive'
