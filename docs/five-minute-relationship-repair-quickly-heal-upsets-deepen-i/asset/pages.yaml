    This triggering stimulus gives rise to thoughts of reactive stories — the words
    that play in your head, such as, “Nothing is ever enough for her,” or “He doesn’t
    care about my feelings.” After any upsetting event, your storytelling brain will
    try to make sense of it, filtering it through the lens of past disappointments
