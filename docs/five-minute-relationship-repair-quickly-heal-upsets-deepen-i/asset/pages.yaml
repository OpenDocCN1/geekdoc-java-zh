  md: '# Which Part of Your Brain Is Communicating?


    In any given moment, your communication will be governed either by your higher
    brain or by your survival alarm. It''s important to understand that you and your
    partner will feel and behave differently depending on which part of your brain
    is in charge.


    # The Higher Brain


    Brain scientists have found that certain areas in the cortex — especially parts
    in the front and center — play a vital role in our highest human capacities for
    loving thoughts, feelings, and actions. The outer layer you see in photos of the
    whole brain. It is home to regions associated with conscious awareness. Central
    areas of the frontal lobes are involved in our abilities to be empathetic, to
    put ourselves in another person''s shoes, and to understand what is going on inside
    someone.


    This is the part of the brain that helps you see the complexity of an interpersonal
    situation, stay calm, comprehend and care about each''s needs, negotiate and collaborate,
    get creative, and ultimately arrive at a win-win situation. This brain functionality
    is essential for effective two-way communication. It provides a braking function,
    allowing you to patiently listen to your partner, pause as needed for comprehension,
    and move through a topic at an appropriate speed.


    Neuroscientists are developing detailed maps of these brain areas, but for simplicity''s
    sake we will call this the higher brain. Essentially, a well-functioning higher
    brain is what you need if you want to behave in ways that maximize feelings of
    love and trust.


    Operating from your higher brain, you are more likely to be viewed as a “friend”
    to your partner''s brain. Your face will look friendly, your voice tone will sound
    friendly, and you will have friendlier things to say — even while ironing out
    differences. If your goal is to work things out and make sure everyone feels heard,
    you want your higher brain to be in charge of the conversation.


    # The Survival Alarm'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'The survival alarm''s prime directive is to keep you alive. A key component
    of this alarm system in the brain is the amygdala. The amygdala is buried deep
    in the middle of your brain — well below the cortical regions associated with
    conscious cognition. You cannot see this part in photos of the whole brain because
    it is hidden behind the neocortex. How it operates and controls your state of
    mind is similarly hidden from your normal awareness. It continually scans for
    signs of safety or danger.


    Since survival is its higher priority, if the alarm detects even the slightest
    sign of danger, it quickly takes control and changes your body chemistry to support
    immediate self-preservation. It''s strictly a ''shoot, first, ask questions later''
    deal. The alarm reacts automatically, instinctively, and without your permission.
    Most of the time you don''t even realize when your conversations have been taken
    over by this primitive part of your brain.


    At high levels of activation, the survival alarm can dramatically hijack your
    higher brain, taking vital interpersonal functions offline. When triggered, the
    alarm has no concern with negotiating a mutually satisfying solution. It lacks
    the empathetic circuitry of the higher brain. It has no ability to understand
    another''s needs. Remember, those higher brain functions operate too slowly to
    save you from a saber-toothed tiger! When survival is at stake, everything has
    to happen fast.


    People are not at their bestpersonally when their survival alarm is triggered.
    The quick, knee-jerk reactions like fight, flight, or freeze cause people to yell,
    blow up, blame, try to be right, create distance, shut down, avoid, build walls,
    or get defensive. While your alarm is ringing, these things can easily accelerate
    out of control.


    Operating from this part of the brain, you will be viewed as a ''foe'' to your
    partner''s tone. Your face will not look friendly, your voice may sound threatening,
    and the things you say will be met with suspicion or resistance.


    If you recognize that you or your partner is in a triggered state, then you can
    take steps to get your higher brains back online. Realize how automatic this whole
    triggering process is — and stopping blaming yourself or your partner for causing
    such upsets. Remember, your alarms take over without anyone’s conscious awareness
    or permission. Nobody chooses to behave this way. In the next chapter, you will
    learn how to quickly stop an'
  merge: -1
