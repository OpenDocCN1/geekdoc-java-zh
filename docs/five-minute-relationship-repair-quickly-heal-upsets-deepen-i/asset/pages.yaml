  md: '# About the Authors


    ![](img/84b916e6578420b9e8019ef08b9669dc_247_0.png)


    SUSAN CAMPBELL received her PhD in clinical psychology from the University of
    Massachusetts, where she became a member of that school''s prestigious graduate
    faculty and founded that school''s couple and family therapy graduate program.
    She has also received extensive postdoctoral training in couple and family therapy,
    group dynamics, organization development, Gestalt therapy, Neuro-Linguistic Programming
    (NLP), psychosynthesis, Buddhist and nondual psychologies, and Jungian therapy.


    A faculty member at the Gestalt Institute of San Francisco, Susan trains coaches
    and therapists throughout the United States and Europe to integrate the tools
    in their professional practices. She works with singles, couples, coworkers, and
    work teams to help them communicate respectfully and responsibly when conflicts
    arise or when buttons get pushed. Her groundbreaking book, The Couples Journey:
    Intimacy as a Path to Wholeness, published in 1980, was the first popular book
    that introduced mainstream audiences to the idea of relationship as a spiritual
    practice.


    She is the creator and publisher of four entertaining and educational card games
    for teens, adults, couples, work teams, and singles. Susan’s work with couples
    has been featured on national television, including'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'CNN''s News Night, Good Morning America, and the Dr. Dean Edell show, and she
    has been published widely in popular magazines, such as Self, New Woman, and Cosmopolitan.
    In 2003–4, she was the couples therapist on the reality TV Truth in Love.


    A trained sex therapist, Susan is coauthor of Revitalizing Sexual Intimacy: How
    to Keep Your Love Passionate, Alive, and Real. As an internationally known professional
    speaker, she speaks to corporate audiences and leads public seminars throughout
    the United States and Europe. She lives in Sonoma County, California. For more,
    visit www.susancampbell.com.


    JOHN GRE received his PhD in psychology at Stanford University and subsequently
    cofounded the prestigious Stanford Center for Computer Research in Music and Acoustics
    (CCRMA). His study of how the brain processes musical sound influenced the development
    of electronic keyboards and the birth of digital music technologies we take for
    granted today.


    Since 1980, John has been in private practice as a relationship coach specializing
    in intensive couples retreats as well as a trainer of therapists. He has taught
    workshops in communication skills and relationship tools at the Esalen Institute,
    the University of California at Berkeley, Stanford University Business School,
    and the Scripps Institute.


    John has extensive training in a number of modalities. He collaborated with Neuro-Linguistic
    Programming (NLP) founder John Grinder and presented training programs for therapists
    and other professionals. Over the years, he has integrated into his approach psychosynthesis,
    Ericksonian hypotherapy, the Enneagram personality system, Peter Levine''s Somatic
    Experiencing, Buddhist and nondural psychologies, Sue Johnson''s Emotionally Focused
    Therapy (EFT) for couples, and Stan Tatkin''s Psychobiological Approach to Couples
    Therapy (PACT). John is currently a core faculty member of the PACT Institute,
    a training program for couples therapists.


    John has written two previous books on love and relationships: Becoming Soulmates
    and Relationship Tools for Positive Change. He created an educational card game
    for couples, The Joy of Relationship'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'Cards. This turned into an interactive, online self-help system called the
    Soulmate Oracle and was featured on major websites as well as on his own site.
    His work has also appeared on national television and in popular magazines.


    Find out more about John''s intensive couples retreats and relationship coaching,
    as well as his books, blog, and other self-help tools, at his website, www.soulmateoracle.com.


    SUSAN AND JOHN are continuing to develop and refine the tools and worksheets in
    this book. To stay current and get ongoing support, visit www.fiveminuterrelationshiprepair.com,
    where you can get free, printable versions of the exercises, lists, and appendices
    from this book in the form of a companion workbook. There you will also find additional
    clearing and communication tools, video demonstrations, quizzes, checklists, worksheets,
    and information about upcoming webinars to support your growth.'
