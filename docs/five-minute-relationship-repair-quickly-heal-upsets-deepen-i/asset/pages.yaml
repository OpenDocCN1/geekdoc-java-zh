  md: '# Chapter Eleven


    # Clear the Air on a Regular Basis


    ![](img/84b916e6578420b9e8019ef08b9669dc_152_0.png)


    WE HAVE ALL HEARD THE ADVICE not to sweat the small stuff. Yet this approach can
    backfire in an intimate relationship. We may get in the habit of ignoring small
    irritations and disappointments — only to discover later that we have not really
    let them go.


    Every day couples get out of synch, go on automatic, or generate some sort of
    charged material. Partners say careless things that neither seems to notice. They
    have reactions to minor slights. They have different needs that don''t get resolved.
    Small frustrations can become habitual. These little things can build up bigger
    issues if they are swept under the carpet or neglected because of the pressures
    of daily life. That’s why any couple desiring a sustainable, happy relationship
    needs to clear the air on an ongoing basis. This chapter presents a structured
    tool that will help you establish a regular clearing practice.


    Clearing the air with your partner can restore harmony, create deeper intimacy,
    and prevent conflicts from becoming bigger problems. It helps to initiate your
    practice with a statement of positive intentions — a signal that'
  merge: -1
