  md: '# Making a Logical Case


    Appealing to logic, such as trying to prove that your partner has misread you,
    a mistake. It is usually used as a way to avoid your partner’s emotions or to
    talk him or her out them. This can be another way of telling your partner what
    to feel. You think that if your partner realized his or logical error, then your
    partner would not be upset: “If I didn’t care about you, would I take you to such
    a fancy restaurant?”


    # Using a Tit-for-Tat Defense


    A common defense is to try to show that your partner does similar things to what
    you have been accused of. In this defensive reaction you may be trying to remove
    your partner’s justification for being upset: “Who isn’t late? You were late paying
    the bills last month!”


    # Switching Roles between Talking and Listening


    After you have listened and delivered a reassuring response to your partner, allow
    a few minutes of silence before presenting your own Repair Statement. This gives
    you both a chance to get centered and refocused on your intent. It also offers
    your partner’s brain space to digest and integrate the healing해주ances you offered.
    This is where rewiring happens. Switching too quickly between the roles of talker
    and listener can cut short the healing benefits of the repair process.


    The talker-listener structure helps you slow down as you discuss important issues
    or attempt to repair cotrigendering incidents. Some discussions require multiple
    turns back and forth between the roles of talker and listener. Make it your goal
    to stay calm and open as you continue to trade roles until you agree that you
    feel complete.


    For easy reference, appendix A presents the full Five-Minute Relationship Repair
    process, with scripts for both talker and listener. Appendix A can also be found
    in the online workbook (available at www.fiveminuterrelationshiprepair.com). We
    highly recommend printing out a few blank scripts and keep them handy to use in
    your daily life.'
