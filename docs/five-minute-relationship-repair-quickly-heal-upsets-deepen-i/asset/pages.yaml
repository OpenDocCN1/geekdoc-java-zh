  md: '# Be Aware of Any Feelings, Stories, or Memories That Arise


    As you continue tracking what you are feeling, notice how your body sensations
    change or move. Also, be aware of any stories or beliefs that come up in your
    mind. Embrace these with compassion. Slowly go through the memory, as if reviewing
    a video that you can cause.


    You may want to wrap yourself in a blanket, or lie down with a blanket and pillow,
    as a way to comfort yourself. As you explore your recently activated feelings,
    you may sense that you are also comforting a younger self within you who probably
    experienced similar feelings in childhood. Sometimes when you do this self-inquiry
    on a current incident, you may get clear images of a scene from childhood. If
    this happens, it is a gift for deeper inner healing. It offers you an opportunity
    to work with the root of your trigger. You may choose to shift your focus to this
    childhood memory and use the practice to nurture and heal that younger part of
    yourself, giving your younger self permission to more fully feel what it felt
    then. This time, however, no one is going to tell you stop crying or stop being
    upset. Instead, make room for your younger self to get closure or completion on
    something that has been buried or suppressed.


    Whether or not an earlier memory surfaces, allow yourself to feel and express
    whatever comes up. Imagine speaking to the other person involved in the situation,
    saying whatever you wish you could have said then. Speak out loud if you wish.
    Let yourself shout or cry if you are moved to.


    You may feel moved to speaking words to your tender, vulnerable self or to your
    younger self. These words will be nurturing and empathetic, like: “Wow, that was
    intense. You showed a lot of courage to let yourself go there.” Or, “I love you.
    I’m here for you.” If words do not come to you, that’s okay, too.


    # Identify Any Needs Beneath the Emotions


    Give yourself time to experience whatever feelings flow through you. Feel the
    frustration, hurt, anger, disappointment, helplessness, fear, or shock. As you
    do, consider core needs or fears might be triggering these feelings. If you are
    feeling anger, what need is, or was, frustrated? Feel this'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'need and your longing to have this met. Feel the pain about not having what
    you want or need.


    Remember that it is a healing act to give yourself loving attention when you feel
    hurt or upset. Rocking, hugging, patting, touching, and stroking are all ways
    to show caring and nurturing towards your time.


    # Stay Calm and Centered


    If the feelings get too intense, back off a bit and refocus on your calming practices.
    Reassure yourself that you are safe. Feel the chair or the floor supporting you.
    Open your eyes and look around the room. Focus on something in the room and take
    a moment to examine it in detail. Do conscious breathing. Feel your arms around
    yourself. Allow the sensations in your heart to expand and be felt — as opening
    your heart to this much-loved aspect of your conditioned self. When you feel calm
    enough, return to tracking the body sensations and feelings associated with this
    memory.


    # Return Slowly to the Present Moment


    Be with yourself like this for as long as it feels supportive and nurturing. After
    you have reexperienced this memory and have nurtured yourself through these feelings,
    then you are ready to bring it to a close. Find a comfortable, restful position
    for your body, and take about ten slow, deep breaths. Then, get up slowly — but
    only when you feel it. Be gentle with yourself; don''t hurry. Look around and
    reorient to your surroundings. Walk around a bit, sensing your body. Give yourself
    appreciation for letting yourself have this experience.


    # Digesting Small Pieces of the Original Experience


    As the nervous system discharges the stuck energy patterns of memory, it can be
    natural to feel shaking, temperature shifts, or pulsing energy waves. These things
    indicate that your emotional energy is flowing again, so if you experience any
    of them, don''t worry. Just go with it and know that it is part of the healing
    process and it will gradually subside.'
