  md: 'In addition, you may want to make sure everyone’s survival alarms are calm.
    After stating your positive intention — and before starting your clearing practice
    or Repair Statement — suggest taking a minute to assure you are both calm using
    one of the tools from chapter 3.


    You might say, “Before I start, I''d like to take a minute to calm and center
    ourselves. If you''re willing, I''d like us to follow our breathing, feel ourselves
    sitting on the couch, and get completely relaxed.


    Then in a calm voice tone continue with your message or statement.

    When you have finished, it helps to clearly let this be known. End your message
    with a simple phrase that amounts to thanking your partner, such as, “Thanks for
    listening. I feel clear now.”


    # Be Brief and Specific


    As mentioned above, how you communicate in a clearing practice is very much like
    the Repair Statement you learned in the last chapter. Be brief. Talk about only
    one thing at a time. Don''t link multiple events, perhaps hoping it will have
    impact to build a general case. Describe one concern, one need, or one behavior
    that triggered you. If the event was complicated, focus only on one triggering
    behavior at a time (starting with what happened first). Repair and clear this
    before moving on to anything else.


    Simple uncomplicated sentences are more effective. The brain is rarely able to
    take in and hold onto more than a few sentences. The more concise you are, the
    more impact you have. A simple-disclosure will be very memorable, while rambling
    on covering many topics will blur your message and possibly result in triggering
    your partner.


    Be specific. If you describe an event as if it were recorded on a video, this
    helps you recall how you were feeling at the time. It helps you bring more clarity
    and more of a feeling tone to the interaction. Also, describe behaviors without
    inserting blame, judgments, and interpretations. Describe events the same way
    anyone might have saw them on a video — including your partner. If you unwittinglyly
    insert your story (whether about your partner’s motives or what he or she should
    have done), this will create static in your communication and resistance in your
    partner.'
