  md: 'We have named this formula the Five-Minute Relationship Repair. It is a step-by-step
    procedure you can do in five minutes or less — once you have gone through all
    the exercises in this book.


    The early chapters show you the nervous system is connected to emotions and why
    people tend to get triggered so easily by an unintentional act from an intimate
    partner. In these chapters, you will learn how to spot the early warning signs
    that someone is triggered and how to immediately pause to calm yourself and come
    back to present.


    Next, a series of exercises will help you communicate about difficult or upset
    feelings within your partner. You will learn the distinction between core feelings
    (which are soft, tender, and vulnerable) and reactive feelings (which come across
    as aggressive, defensive, hard, or protective). You will see that many of the
    upsets experience are based on complete misunderstandings. And you will learn
    why taking responsibility for your own reactions is one of the healthiest things
    you can do for yourself and your relationship.


    The final chapters take you deeper into learning how to heal the fears and sensitivities
    that give rise to frustrating communication cycles and patterns. You will put
    it together — everything you have learned about why you react and what you need
    from your partner — the Five-Minute Relationship Repair process. This section
    includes fill-in-the-blank scripts that guide you and your partner in getting
    to the root of any upset and resolving it. Saying each script to clear removes
    all sense of threat or blame, replacing defensiveness with open-hearted self-disclosure
    and loving reassurances.


    Are you ready? Ready to reprogram all the unfortunate reactive habits you''ve
    picked up over the years? Ready to start anew with yourself or a partner, living
    in a way that continually deepens your capacity for love and trust?


    Okay. Let the healing of old patterns and learning of new tools begin — making
    way for a life of shared happiness and lasting love.


    # Exercises, Appendices, and Free Online Workbook


    There are various important exercises throughout this book. Each will help you
    learn the tools we present and apply them to your circumstances. To'
