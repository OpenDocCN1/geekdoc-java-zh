  md: '# Core Feelings and Core Fears


    When we are triggered, two kinds of feelings arise. On the surface we have reactive
    feelings, but under these are our core feelings and core fears. Since core feelings
    get masked by reactive feelings, we''re rarely aware of the tender emotions at
    the root of our reactions. Certainly, if we''re unaware, our partner won''t be
    aware of these either.


    On a reactive level, Donna felt angry when Eric checked his cell phone on their
    date night. But what core feelings and fears were hidden underneath her anger?
    She actually felt hurt and afraid. She felt hurt when she imagined she did not
    matter to Eric. Her fear-of-abandonment button pushed her when she thought she
    was all alone and that he was not really interested in being with her. Core fears
    are also known as core fears.


    Why couldn''t Donna directly express her core fears? She was programmed in childhood
    to believe that signaling distress simply directly was not an option. Being that
    vulnerable seemed to work for her. In infancy, her parents did not coreulate her
    very consistently when she cried. When she was a child, they ignored, laughed
    at, or belittled her when she tried to express her hurts or fears.


    Angry protest, a typical reactive behavior in preoccupied children and adults,
    became little Donna’s way of expressing her distress. Now, as an adult, her core
    fears and vulnerable tears get masked by her anger remaining hidden from Eric
    and probably from herself. Hearing her complain and criticize, it is impossible
    for Eric to see that Donna is really hurt, afraid, and alone.


    When we do not have valid information about a partner’s core feelings, we tend
    to make up stories to explain the behavior we see. Our stories arise out of our
    unconscious fears. So when Donna complains, Eric’s reactive story becomes that
    he can never do enough or be enough to make her happy.


    Eric rarely considers expressing his core feelings and needs. Usually, he withdraws
