  md: 'It is important to see how a reactive cycle is circular.


    You get triggered by something your partner says or does, and you automatically
    react in some way. The reactive behavior you will engage in then your partner.
    Thus, your partner will start acting out his or her own reactive behavior — which
    only further triggers you!


    In this way, we end up simultaneously cotriggering each other, but we rarely see
    the full picture. We usually see what our partner did to upset us. We think, if
    he or she would only stop doing that, then everything would be okay again. But
    each person is responsible for keeping a reactive cycle.


    The initial triggering stimulus that starts reactivity may be different than the
    pair of reactive behaviors that create a full-blown reactive cycle. For instance,
    on their date night, Eric''s glancing at his cell phone was a triggering stimulus
    for Donna. His reactive behavior was to complain, which triggered Eric to ignore.
    That pair of reactive behaviors — complaining and ignoring — created they. If
    either partner interrupts the cycle by not engaging in a reactive behavior, cotriggering
    will not occur. If Eric had called for a pause instead of ignoring, a reactive
    cycle would have prevented.


    Often it''s hard to say where a reactive cycle starts. By the time you''re aware
    of your own distress, it is already in motion. When this happens over and over,
    a couple will tend to get stuck in one familiar reactive cycle. This whole process
    is quite unconscious. To get free of your reactive cycle, you first need to identify
    it and see the full picture.


    To understand how your particular piece cycle operates, it''s best to look at
    each piece in turn. Let''s start with the typical reactive stories. Then we will
    look at reactive behaviors, and finally, we examine reactive feelings and body
    sensations.


    If you are in a relationship, invite your partner to read this material with you.
    Doing this together will give you the ability to spot your cycle when it begins,
    so you can step outside of it and stop being at the mercy of your reactions.


    If you are currently single, use this information to help understand any reactive
    cycles that may have existed in previous significant relationships. This will
    help you see how cycles work so you can prevent them in future future relationships.'
