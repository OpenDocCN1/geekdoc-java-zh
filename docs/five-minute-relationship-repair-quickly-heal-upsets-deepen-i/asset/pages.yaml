  md: 'NEW WORLD LIBRARY is dedicated to publishing books and other media that inspire
    and challenge us to improve the quality of our lives and the world.


    We are a socially and environmentally aware company. We recognize that we have
    an ethical responsibility to our customers, our staff members, and our planet.


    We serve our customers by creating the finest publications on personal growth,
    creativity, spirituality, and other areas of emerging importance. We serve New
    World Library employees with generous benefits, significant profit sharing, and
    constant encouragement to pursue their most expansive dreams.


    As a member of the Green Peace Initiative, we print an increasing number of books
    with soy-based ink on 100 percent postconsumer-waste recycled paper. Also, we
    power our offices with solar energy and contribute to nonprofit organizations
    working to make the world a better place for us all. Our products are available
    in bookstores everywhere.


