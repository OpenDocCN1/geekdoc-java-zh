  md: '# Reactive Stories


    Reactive stories are what your storytelling brain feeds you to explain why you
    are upset. As discussed in chapter 5, the meaning-making part of your brain makes
    up a reasonable-sounding story to explain why your partner is doing something,
    what it means, or why you should be upset about it. As we''veve seen, these are
    often worst-case scenarios that result in self-triggering.


    In chapter 5, we presented a list of reactive stories and asked you to check off
    any that come up in your head when you get upset. (See “Stories That Keep Us Triggered,”
    page 72, appendix B, or the online workbook’s available at www.fumininetelerrelationshiprepair.com.)
    Go over this list and circle the three stories your mind comes with most often.
    As we will see, our reactive stories misrepresent what is actually happening with
    our partner. In fact, believing our story keeps us from sharing our deeper needs
    and feelings. As we realize this, the power of our self-triggering stories starts
    to fade, and we are able to experience our real feelings.


    # Reactive Behaviors


    The next puzzle piece — reactive behaviors — are what we say or when we are triggered.
    Once a reactive cycle has started, these are the things we do that elevate each
    other’s levels of activation and keep the cycle going — as we''ve seen with Donna
    and Eric.


    As you look over the list of reactive behaviors below, they may seem similar to
    the control patterns in chapter 7. Reactive behaviors are control patterns, but
    of a specific nature. The reactive behavior of one partner pairs up with the reactive
    behavior of the other to create a reactive cycle. They form a circular pattern
    of cotrigging. The more Donna complains, the more Eric ignores, the more she complains,
    and their cycle keeps escalating. These reactive behaviors are the ingredients
    that keep their reactive cycle in play.


    A control pattern may come up anytime, without provocation, as an automatic, habitual
    way your unconscious mind tries to help you feel more in control. Certainly, your
    use of a control pattern can trigger your partner.'
