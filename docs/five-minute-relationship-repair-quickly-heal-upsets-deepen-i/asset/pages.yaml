  md: '# Chapter Fifteen


    # Compassionate Self-Inquiry for Inner

    Healing


    MOST OF THE HEALING AND REPAIR practices in this book are designed for

    partners to use together. This chapter offers a practice that you can use on

    your own to heal your core fears. The process is similar to a self-guided

    Sense-Feel-Heal session, but it guides you even further into clearing

    emotional wounds that trigger reactive incidents. It is called *Compassionate

    Self-Inquiry.*.


    A good time to use this practice is during a pause, when you are taking

    time away from your partner in preparation for your repair session. You can

    also use it whenever you are upset and you cannot repair together with your

    partner. Or you can use it on your own to heal past upsetting events — from

    a former relationship or from childhood. Anyone, whether single or in a

    relationship, can use this practice regularly to become more open and less

    fearful about the risks involved in a loving relationship.'
