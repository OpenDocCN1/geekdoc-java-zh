    # Guiding Your Partner to Track Body Sensations


    Generally this process is done sitting face to face. As the guide, start by asking
    your partner how close is optimal for you to sit. Invite your partner to settle
    in and feel how the chair holds him or her. When ready, ask questions to help
    your partner focus on the body sensations that arise as your partner recalls the
    triggering incident (past or present). Then you ask questions and guide your partner
    to experience and explore these sensations with an attitude of compassionate curiosity.
    As sensations are reported, you might also offer supportive touch.


    The following is a set of questions that you can ask. Sometimes might repeat a
    question — particularly if your intuition tells you that this question is helping
    your partner go deeply into experiencing body sensations.


    If your partner is still actively triggered, or is still in the process of calming
    down after a reactive incident, you would start by asking, “As you tune in to
    your body sensations, what are you aware of right now?”


    If you are working with a recent, but not currently active, incident, allow your
    partner to describe it enough to start feeling a bit activated. Ask, “As you recall
    this incident, see if you can bring back the memory of what was said or what triggered
    you. What do you recall? Now, as you tune in to your body sensations, what are
    you aware of right now?” Remember that your main goal is to help your partner
    move from talking about the event to describing the set of body sensations that
    arise as he or she recalls it.


    If your partner reports several different sensations, ask your partner to allow
    one of these sensations to emerge to the foreground. Once your partner finds one
    sensation to focus on, invite your partner to explore the sensation with an attitude
    of loving curiosity. Ask about various properties of the sensation, using the
    following questions:


    +   1. “Where in your body do you feel this sensation?”

    2. “How big is it?”'
