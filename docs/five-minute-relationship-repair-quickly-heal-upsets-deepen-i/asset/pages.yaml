    life can lead to a pattern of perfectionism or of defensiveness in the face of
    critical feedback — even constructive advice. Unrealistically high parental expectations
    can produce a core fear of not being good enough.


    Other parents don''t give much attention or feedback at all. Their children don''t
    get much information about the effectiveness of their efforts or about the fact
    that they have an impact on others. In this case, you might have a button about
    being neglected or about someone not being for you.


