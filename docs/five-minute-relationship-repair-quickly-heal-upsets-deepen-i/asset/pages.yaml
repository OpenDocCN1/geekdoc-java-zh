    on track. There is no standard format for a vision statement. It can be written
    in whatever way you like. However, it should be as specific as possible, naming
    the specific tools and actions you will both take to cope with and repair conflict
    and reactive behavior. Both of you should sign this statement.


    As an example, below is the vision statement that Eric and Donna created. As successfully
    used the techniques in this book to catch and stop their reactive cycles, they
    agreed that they needed to put down their sword and communicate core feelings.
