    # Donna and Eric Clear the Air


    Here’s an example of how Eric and Donna used the clearing practice. They had gone
    to a large party at a country estate. During the course of the four-hour evening,
    there was a period of over an hour when Donna could not find Eric anywhere in
    the house. At first confused and then anxious, Donna looked through all the rooms
    where the party was taking place, but Eric seemed to have disappeared. Then after
    midnight — when Donna was feeling ready to leave and go home — Eric walked from
    the backyard, laughing and talking with Ginny, one of Donna’s friends. Donna felt
    a mixture of relief and hurt.


    When they got home later, Donna asked Eric, “Can we do our clearing practice now?
    I have something to want.” Eric agreed, and his continued: “Okay, thanks. When
    I was looking for you at the party, I felt disappointed and hurt. When I saw you
    walking into the house with Ginny, I felt a bit relieved, but a story came up
    in my head that I would rather be with someone else than me. When I had this thought,
    I felt a pain in my heart. It brought up a fear that I was all alone. I’m telling
    you because I want to feel more connected to you.”


    Eric immediately moved toward Donna and held her in a long embrace. He whispered
    into her ear, “Donna, you’re the most important person in my life. I need you.
    I am so sorry you couldn’t find me.” Feeling her body trembled slightly, he continued
    to hold her until her muscles released and she took a deep breath. Donna looked
    into his eyes and said, “Wow, that felt great! Would you like to cuddle a little?”
    Eric’s eyes smiled back at her with a gleam that gave her the answer she was hoping
    for.'
