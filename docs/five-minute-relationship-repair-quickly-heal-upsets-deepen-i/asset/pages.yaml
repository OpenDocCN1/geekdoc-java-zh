  md: 'A core fear promotes an unconscious state of vigilance. You become hypersensitive
    to cues that the feared event may be about to happen. Your perception gets distorted;
    it becomes biased toward noticing even the tiniest similarity to past events,
    thus increasing the likelihood that your survival alarm will soon be ringing.


    # Trading in IQ Points for Limb Strength


    When you are triggered into fight or flight, your heart races. Your lungs attempt
    to pull in more oxygen. Adrenaline starts pumping. Other systems shut down, like
    digestion and saliva production, so that the energy consume can all be put into
    immediate survival activities.


    The states of fight or flight have one biological purpose — to provide maximum
    strength and energy to your limbs, giving you the power to run faster and away
    or to fight harder and win. Basically, you are cashing in IQ points for limb strength.
    A mother can lift off her baby with such strength! But an intimate couple find
    no benefit from brute strength when trying to resolve interpersonal issues. That
    type of strength only serves to dig deeper into the Hole.


    The freeze state is a kind of self-anesthesia administered by the nervous system
    to num you from feeling a painful, overwhelming, and likely fatal physical attack.
    It''s like going into shock. You space out or shut down. This is useful if your
    alarm concludes that a tiger is about to kill you. It enables you to avoid feeling
    intense physical pain. But, again, it is not helpful to a couple trying to resolve
    an issue.


    We''ve seen how much alcohol can distort thinking and impair abilities. The same
    goes for adrenaline or anesthesia. When we get triggered, we are essentially operating
    under the influence of powerful chemicals. But there are no empty shot glasses
    lined up on a bar in front of us. Instead, a whole lot of juice is being served
    by interval bartenders, and, blinds, we are suddenly inriated without realizing
    it. With diminished brain capacities, we suffer black-and-white thinking, tunnel
    vision, or simply going blank. Stuck in attack-defend mode, we may numb out or
    say things we later regret. And later, we are unable to accurately recall what
    happened.'
