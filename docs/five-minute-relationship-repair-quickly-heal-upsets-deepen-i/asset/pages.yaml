- img_proc: true
  md: 'initiates an agreed-upon ritual whose purpose is to heal and connect. To begin,
    both partners review their own feelings to see if there is anything they have
    withheld that might be creating a disturbance or disconnection in the relationship
    or that led to a defensive, cold, or aggressive exchange. Any topic can be raised:
    perhaps an upsetting event, an unmet need, an unexpressed want, a fearful thought
    about the future, or a vulnerable feeling. This is then acknowledged and repaired,
    in a process similar to that of the Repair Statement in chapter 10.


    # The Clearing Practice


    The clearing practice involves setting aside a special time, either daily or weekly,
    to speak about things you may not ordinarily feel comfortable bringing up or things
    you have postponed discussing for other reasons. The practice can also be used
    on a spontaneous basis. Partners can ask for a clearing session whenever they
    have unfinished business.


    As the Pause-Calm-Repair process and the Repair Statement, each partner takes
    turns talking and listening. The communication guidelines described before are
    the same. Indeed, the script for the clearing practice is similar to that for
    the Repair Statement in chapter 10. The main difference is that the incident or
    event being discussed may not have triggered a reactive cycle. It could be a smaller
    confusion, misunderstanding, or hurt, and not all the elements of the Repair Statement
    may apply. Adjust the clearing process script as necessary to suit your situation,
    and see the lists in appendix B to help fill in the blanks in the script below.


    Here is the clearing practice script:


    > “I’d like to clear something with you so we can get back to feeling connected.


    > “I was [insert appropriate reaction, such as triggered, hurt, confused] when
    I heard you say (or saw you do) specific words or actions)[name your partner’s].


    > “A story came up in my mind that [describe your reactive story].'
