  md: '# Which “F” Overtakes Your Higher Brain?


    Some people’s nervous systems automatically react by going into fight. When triggered,
    they tend to get frustrated and angry. This often manifests as some form of complaining,
    prodding, blowing up, or in some other way going on the attack. Others tend to
    flee. Driven by anxiety or fear, they may withdraw, distance themselves, or leave.
    Others still fall into a freeze state — feeling confused, shutting down, numbing
    out, getting paralyzed, or not knowing what to say or do.


    Our nervous system will favor one of these Fs, but they are all available. Another
    F will be used if the first doesn’t work. Someone may initially get triggered
    into a state of fight, but if that doesn’t work, they will flee, and then as a
    last resort, freeze. Another person’s nervous system may initially provoke a fight
    reaction, but if that’s not possible, they will fight.


    Some partners react in similar ways. Many partners differ. One goes into the state
    of fight, pursuing the other like a cheetah chasing a gazelle — while the others
    freeze.


    A common relationship dynamic is between a pursuer and a freezer. We see this
    in Donna and Eric’s relationship. Donna acts like a pursuer — complaining, criticizing,
    prodding, pushing, blowing up. The F that takes her over is fight. Her reactive
    feelings are frustration and anger. Eric is a withdrawer. The F taking him over
    can fight or freeze. He often begins by ignoring, distancing himself, staying
    in his head, pushing feelings away, or shutting down. Then, he may feel nervous
    and anxious or numb. Finally, he might walk away.


    Over a long time, the F that we go to might change. Someone who initially shuts
    down around yelling may eventually start blowing up, too. Someone who pursues
    and pursues may burn out and start building walls and creating distance. What
    is your dominant F in a relationship? Have you tended to be a frustrated pursuer
    or a shut-down withdrawer? Does this depend on your partner’s style?


    Look at the following list, which groups reactive feelings into three categories
    of fight, flight, and freeze. The six words in each category can be thought of
    as different intensities of each state. Put a check next to any reactive feelings
    you experience in your relationship (present or past).'
