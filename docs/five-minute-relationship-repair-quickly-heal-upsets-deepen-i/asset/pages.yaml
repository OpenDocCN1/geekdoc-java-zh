  md: '# Chapter Eight


    # What’s Ringing Your Alarm?


    ![](img/84b916e6578420b9e8019ef08b9669dc_104_0.png)


    WE HAVE SEEN HOW EARLY EXPERIENCES can lead to secure or insecure functioning.
    If childhood needs are mostly met, our brains develop strong wiring to prevent
    false alarms from triggers taking over. But to the extent that our basic needs
    are frustrated early on, our wiring will not be as well developed. As adults,
    our higher brains may be more easily taken over when our alarms react. We are
    more apt to believe the scary stories our brains make up. And we will be plagued
    by triggers and reactivity in our relationships.


