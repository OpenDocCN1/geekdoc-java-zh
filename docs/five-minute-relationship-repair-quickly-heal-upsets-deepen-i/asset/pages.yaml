    # Listening and Responding with Heart


    When you listen to your partner''s Repair Statement, you play a key role in the
    repair process. How you listen and respond is a crucial ingredient of repair.
    Without a reassuring response from you, no repair will occur, and the injuries
    you are trying to heal deepen.


    As the listener, your aim is to understand your partner''s experience from his
    or her point of view. To do so, it is important that you have already calmed yourself
    sufficiently and filled out your Repair Statement. You will be able to accurately
    take in and understand your partner''s message and be able to respond from your
    heart.


    In opening up and reading a carefully prepared Repair Statement, your partner
    is trying to describe an inner experience to you. Be sure not to interrupt. And
    offer as much empathy and acceptance as you can. This helps your partner feel
    safe enough to be vulnerable. It also starts to heal the hearts and fears that
    were triggered in the incident.


    Why do most of us fail in the process of listening? Usually it is because we get
    triggered by something our partners say, or even more, by their facial expression
    or voice tone. Often we do not realize when it''s happening. We so start to explain,
    defend, or argue — even if only silently in our minds. These control patterns
    clog the input channels in our brains so we are not open to receive and store
    incoming messages.


    Generally, most people are not very good listeners. This is especially true when
    it comes to listening to an intimate partner talk about a reactive incident. Listening
    in an open, undefended way may feel uncomfortable. We might believe if we remain
    silent, it means we agree with everything we hear. We may fear we will never have
    a turn to talk. Mastering the fine art'
