  md: '# Chapter Two


    # Install a Pause Button


    ![](img/84b916e6578420b9e8019ef08b9669dc_34_0.png)


    WHAT DO YOU DO IF YOU NOTICE you or your partner in one of these F states? How
    can you get your higher brain functioning again after your survival alarm has
    been triggered?


    You need to ask for a pause, as in, “Can we pause for a moment? I can’t think
    straight.” Do not keep trying to be heard. Any attempt to resolve an issue when
    you or your partner is triggered is like trying to put out a fire with gasoline.
    You’ll do more damage than good because the part of your brain designed for battle
    and survival has taken over. You will be communicating without the higher brain
    power you need to resolve things.


    Whenever you realize someone has been triggered, it''s important to find a way
    to stop and calm yourself. Find your brakes — develop some. Brakes is a metaphor
    to describe how your higher brain can stop an accelerating state of alarm. When
    your survival alarm is triggered, it''s just like pressing the accelerator on
    a car; your heart speeds up and pumps massive amounts of energy into your limbs
    for battle or escape. The braking'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'function of your nervous system can slow down your heart rate and quiet your
    nervous system so you''re calm enough to communicate productively.


    Having good brakes means that you recognize when you or your partner is triggered
    and slow everything down until your higher brains can get back in charge. Then
    you''ll be able to consider what each other is saying. With good brakes, each
    of you can resist the impulse to interrupt the other or prove your point. Once
    your higher brains are back online, you realize that you are safe; the issue between
    you is not a threat to your survival.


    Even if you tend to go quickly into a triggered state, you can learn to develop
    a better braking system. First, become curious about the ways and your partner
    go on automatic. This way, you can become more aware of the signs when someone
    is triggered. Then, let go of any shame you might have about the fact that you
    overreact. Remember that everyone has triggers, and everyone has unfinished business
    from the past.


    Consider making an agreement with your partner that either person can ask for
    a pause whenever one of you feels activated. Each time you do this, you give time
    for your rational minds to reassure your triggered minds that you are actually
    safe. Give time for your nervous systems to calm down. These conscious efforts
    will increase your capacity to brake more quickly at signs of distress. Over time,
    reactive incidents will decrease.


    Whenever you or your partner are triggered, here are some ways to initiate a pause.
    You can say something like:


    +   - I need to pause.

    - Can we slow down for a moment?

    - Our reactive pattern is happening.\n- I''m getting triggered.

    - Let''s take a break.


    The point of pausing is to insert a new choice into what is otherwise automatic
    accelerating sequence of reactive behaviors. You are learning to interrupt an
    unconscious pattern. At first, you may not be entirely successful in your attempts
    to pause, but at least you are consciously recognizing the need to do so. No matter
    when it dawns on you that one of you is triggered, ask for a pause.'
