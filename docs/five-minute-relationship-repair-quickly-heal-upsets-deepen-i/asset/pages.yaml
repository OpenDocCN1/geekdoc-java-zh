  md: '# # Introduction


    ![](img/84b916e6578420b9e8019ef08b9669dc_9_0.png)


    FALLING IN LOVE IS THE EASY PART. Staying in love is another matter. Some couples
    seem blessed with everlasting love. Then there’s the rest of us — who start running
    into trouble once the honeymoon is over. We encounter differences, disagreements,
    disappointments. Buttons get pushed. We watch helplessly as loving feelings start
    to fade in the face of misunderstandings, blowups, shutdowns, or vicious communication
    cycles.


    What do couples blessed with ongoing happiness know that we don’t know? In a word,
    they know how to repair. They are good at quickly attending to the little glitches
    that every relationship encounters. Those of us who do not naturally know how
    to do this suffer a buildup over time of unrepaired ruptures. Eventually this
    buildup leads to feeling unsafe or guarded with each other. And we find ourselves
    less intimate, less relaxed, and often more alone.


    This gradual erosion of loving feelings is extremely common — so common that it
    could be considered normal. But what if there were another path you could take
    with your partner? What if you knew how to repair upsets skillfully and quickly?
    What if you could learn to approach relationship ruptures in a way that deepens
    intimacy and makes you feel'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'more secure? The ability to repair like this is a skill you can learn. And
    once you learn this skill, you can do it in five minutes!


    This book teaches you a step-by-step process that addresses the root causes of
    the frustrations and hurts that triggered in a relationship. You will learn how
    to use any upset as a doorway to mutual healing and deeper trust. If you are currently
    in a relationship, you can immediately put these tools into practice with your
    partner. If you are single, you can use them to heal wounds from past relationships
    and prepare yourself for a successful loving partnership. Partnered or not, you
    can use these tools to improve communication with all the significant people in
    your life.


    By the time you finish reading and doing the exercises offered here, you will:


    +   * understand what really causes blowups, shutdowns, stuck, and vicious cycles
    (it’s not what you thought it was).

    * know how to define conflicts and get back to feeling close.

    * know how to help your partner calm down and listen to you even when he or she
    is upset.

    * be able to ask for what you want in ways that will be well-received.

    * be able to make sure your connection with your partner does not get compromised
    by hidden resentments or unfinished business.

    * know how to help your partner feel secure with you so he or she is less likely
    to get triggered.

    * know how to work with your own unfinished emotional business and past wounds
    in a way that promotes greater self-love and self-esteem.

    * start rewiring your brain so that you are less apt to triggered.

    * have a well-practiced formula for making up after a fight or misunderstanding
    in a way that deepens your shared love, trust, and sense of safety.'
