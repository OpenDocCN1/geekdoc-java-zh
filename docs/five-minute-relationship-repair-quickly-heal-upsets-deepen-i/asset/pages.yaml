  md: 'Take in a deep breath through your nose. Breathe all the way down to fill up
    your belly and all the way up to fill up your chest. Breathe out very slowly through
    your mouth. Now time your inhale and exhale. In your mind, count three for the
    in-breath, and count to six before you reach a full exhale. Three counts in. Six
    counts out.


    Practice this for a few minutes. Afterward, notice how you feel. Once you get
    to use this form of breathing, try a ta more advanced form: inhale for three counts,
    pause for three counts, and then exhale for six counts. You can also add a count
    of three after each exhale before you start the next inhale. Experiment to discover
    which of these breathing practices works best to create a sense of inner calmness.


    # Breathing Awareness


    For this tool, don''t count or try to control your breathing. Just pay attention
    to how you are already breathing naturally.


    +   1. Notice your chest and how it expands and contracts with each breath. There
    is nothing to change or get right. For the next minute, notice the speed of your
    breathing and the depth of each breath.


    +   2. Move your attention to your belly button, and sense the movement there
    with each breath. Notice the speed and depth of each breath for another minute.


    +   3. Now pick the place you found it easiest to track your breath — in your
    chest or belly. Notice the movement of your breath going in and out resembles
    a wave. The top of the wave is when you finish inhaling; the bottom is when you
    finish exhaling.


    +   4. Follow this wavelike motion. Notice which part of the wave feels the most
    relaxing: the top, the bottom, or somewhere in between. Now let your attention
    rest more fully into the most relaxing part of the wave for each breath.'
