  md: '# Prioritizing the Safety of Your Intimate Partnership


    When you recognize that a survival alarm is ringing underneath all reactive feelings
    and behaviors, you realize that reactive cycles are a sign of being scared. They
    are rooted in fear stories and represent our unconscious response when our core
    fears get triggered.


    By reassuring your partner that he or she is safe, you can help each other heal
    from these kinds of fear stories. The first step is learning to recognize the
    early-warning signs that you or your partner are triggered — the verbal and nonverbal
    signs we identified in Chapter 8. When you notice these signs, your task is to
    quickly reassure yourself and each other that you are safe.


    As an ongoing practice, you can increase your overall sense of safety by listening
    to each other and by revealing core feelings and needs before alarms start ringing.
    When you tune in to each other and hear each other''s points of view, this enables
    you to resolve issues in ways that work for both of you. Remember to do and say
    things even when no one is triggered. This will reduce the frequency of triggering
    incidents. Then, when someone does get triggered, you know how to quickly reassure
    safety.


    As you understand how your reactive behaviors scare your partner, you''ll also
    learn not to take his or her fear reactions as an indictment of you. This will
    make it easier to reassure your partner as quickly as possible that these fears
    are not real.


    Could it possibly be simple? Yes, could it! Consistently reassuring each other''s
    safety is the fastest way to overcome reactive cycles and stay happy in love.


    # Pause-Calm-Repair


    When you can''t catch triggering in time, and you find yourselves in a reactive
    cycle, there is still a way to bring yourselves back to a safe, loving feeling.
    The magic formula is to pause, calm yourselves, and then repair.


    We have named these three interlinked actions Pause-Calm-Repair. This is the heart
    of the Five-Minute Relationship Repair process. We will overview these actions
    below, and the next chapter will describe how to repair upsets.'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'Knowing how to Pause-Calm-Repair can shift a distressed relationship toward
    one of safety, acceptance, and reconnection. When practiced regularly over time,
    these actions will rewire your brain in a way that helps you remain calm and open-hearted
    even when dealing with differences or upsets.


    # Pause


    Catch your reactive cycle as soon as you see it. As soon as you notice you or
    your partner is triggered, it''s time to use your pause signal (see chapter 2).
    Immediately stop doing what you''re doing. To catch triggers early, learn to pay
    attention to your body sensations and feelings, the stories in your head, and
    how you are acting. Notice if your partner''s facial expressions and voice tones
    are signaling distress. When you are familiar with your buttons and your typical
    signs of reactivity — your own and your partner''s — you''ll be better equipped
    to notice the onset of your cycle and ask for a pause.


    Per chapter 2, make a habit of pausing. Establish an agreement with your partner
    to practice a pause signal. If your partner is not ready to make such an agreement,
    start pausing on your own. If you do this, be sure not to blame your partner for
    triggering you, and be sure your intent is to reassure yourself that you are in
    no real danger.


    Pauses can be anything from brief lulls to slow a conversation down to lengthy
    time-outs apart from each other. Once you get the hang of it, and you catch your
    reactive cycles quickly before they escalate, pauses can be fairly brief — a few
    minutes. The importance and value of pausing cannot be overemphasized. It wires
    into your nervous system the braking function allows you to counter the automatic
    stuck-on-the-floor accelerator of your instinctual fight-or-flight reaction. Only
    by putting on the brakes can you change the negative direction of your communication
    and stay out of the Hole.


    # Calm


    During your pause, the aim is to get your higher brain back online. Do whatever
    it takes to calm yourself and, if appropriate, to calm each other.'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'Feel your body sensations. Do conscious breathing. Offer yourself positive,
    reassuring self-talk.


    The tools in chapter 3 offer a variety of ways to calm your nervous system. Some
    of them can be used during a conversation, without your partner even knowing it.
    Per chapter 3, start using these tools regularly to discover the ones that work
    most easily and effectively for you. Remember, committing to use the pause signal
    and a self-calming tool is a commitment to your own health functioning. By making
    this practice, you are rewiring your brain so you can give and receive love as
    a secure functioning partner.


    After pausing and as soon as you are calm enough, help calm and coregulate your
    partner using supportive touch, hugging, eye contact, soothing voice tones, and
    friendly, reassuring words. Chapter 4 describes coregulation in detail. This helps
    get your higher brains back online as possible (see also chapter 14). Physical
    coregulation helps create a sense of safety during the most alarming moments.


    If you find you are too upset and cannot calm yourself, request that you and your
    partner take a longer pause of a few hours or so. Then, do something involved
    to get centered, such as getting physical exercise, taking a walk in nature, taking
    yourself to a place that feels friendly or safe, reading a book that inspires
    you, or even seeing a good movie.


    One possible approach if you get really stuck is to try writing down all your
    negative feelings and thoughts on a piece of paper. Do this as a personal venting
    exercise — release your upsets by putting them on paper. Keep writing until there''s
    nothing left to come out.


    # Repair


