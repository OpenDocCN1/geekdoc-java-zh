    came to me that I''d love to see if we can get a weekend away together son.


    The advantage of doing the clearing practice regularly is that it keeps you up-to-date
    with one another. Then, partners aren''t likely to be blindsided by a list of
    things they''ve done during the entire history of the relationship. If you have
    ever been on the receiving end of such a barrage of past grievances, you know
    that this erodes trust and can be quite hurtful.


    # Introducing Your Message


    When you want to start a clearing practice, address a reactive incident, or raise
    a sensitive topic, it''s a good idea to start by stating your positive intention
    for bringing this up. Here are some examples:


    +   - “My intention is to clear the air so we can feel closer and connected again.\n-
    “My intention is to repair the reactive incident that happened this morning.

    - “My intention is to repair the misunderstanding that just occurred.\n- “My intention
