  md: '# Body Sensations Are Early Warning Signals


    As you feel triggered, you experience certain body sensations that correspond
    to your reactive feelings. As we have seen, the nervous system controls various
    organs in the body, and these organs function differently when your survival alarm
    gets activated versus you are calm. When you are triggered into states of fight
    or flight, your body pumps more adrenaline, your heart beats up, and your digestion
    shuts down.


    By paying attention, you can detect these shifts within your body. You might,
    for example, feel a pressure in your chest, a knot in your stomach, or a pounding
    in your solar plexus. You may notice your muscles getting tight. These are the
    body sensations that tend to accompany reactive states like feeling frustrated
    or anxious.


    Most people don''t pay much attention to sensations in their bodies when they
    are upset. Their focus is on their reactive feelings and stories. But it is very
    useful to become more aware of your body sensations. They are early warning signals
    that your survival alarm is ringing and a reactive cycle has started. Increasing
    your alertness for telltale bodily sensations will increase your ability to stop
    a cycle sooner. It is easier to recover from a reactive incident when you can
    halt the cycle before falling too far into the Hole.


    As we''ve seen, both Donna and Eric experience physical reactions when they get
    triggered. But they tend to ignore these and become fixated on their reactive
    stories. Stories are part of our secondary reaction to getting triggered. Body
    sensations are a primary event in the nervous system. They occur even before our
    minds have a chance to fabricate worst-case scenarios.


    To learn to identify your body sensations, try this exercise. Pick the most common
    reactive feeling you experience. Recall in detail a time you experienced it: what
    your partner said or did and how you reacted. Imagine the event as if it were
    happening again now.


    As you replay this scene in your imagination, notice the sensations that come
    up in your body. Now describe the sensations — for example, as a knot in your
    stomach, feeling heat or coldness, a tightness somewhere, a constriction or pounding
    in your chest or belly, a lump in your throat, a weight on your shoulders, a heavy
    feeling, a fluttering sensation, a pain in your heart, a shakiness or tension,
    and so on.'
