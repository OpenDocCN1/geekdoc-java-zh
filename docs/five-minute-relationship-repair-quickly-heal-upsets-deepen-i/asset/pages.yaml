- img_proc: true
  md: 'Saying “I need to pause” is giving a short signal. If your higher brain wasn’t
    in the very process of being taken offline, you might be able to offer a more
    complete statement. For instance, you might be able to say: “I am triggered, and
    reactivity is taking over our communication. My higher brain is getting hijacked,
    and I can’t even hear you, much less give you the response you need. I’d like
    to return to this conversation after we take some time to calm survival alarms.
    I am committed to finding a solution, and I want to do this together. But first
    I need to pause and calm down. Won’t you please me?


    # Create a Pause Signal


    Typically, when you’re triggered, you won’t be able to say those reassuring words.
    You simply don’t have enough brain power when your survival alarm kicks in. So
    it works best to agree on a signal that will be easy to remember and easy to hear,
