    8. "描述 Java 类中方法的用途。"

    9. "在 `Rectangle` 类中写一个一个方法来计算其面积。"

    10. "解释 OOP 中方法与行为之间的关系。"


    ## 实例化

    11. "对象在 Java 中是如何创建的？请解释这一过程。"

