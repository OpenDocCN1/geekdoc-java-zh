    - [5. Collections and Data Structures.](#part0018.xhtml)

    - [6. Exception Handling.](#part0019.xhtml)

    - [7. File Handling.](#part0020.xhtml)

    - [8. Multithreading](#part0021.xhtml)

    - [9. Networking.](#part0022.xhtml)

