    14. "解释 Java 类中构造函数的用途。"

    15. "提供一个初始化属性的带参数构造函数的示例。"

    16. "什么是默认构造函数？什么时候使用它？"


    ## 封装

    17. "在面向对象编程的背景下定义封装。"

