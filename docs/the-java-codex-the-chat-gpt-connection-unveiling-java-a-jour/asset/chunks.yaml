  trans: '


    这是一份与 Java 单元测试相关的提示词列表，涵盖了使用 `JUnit` 和 `TestNG` 等框架编写、组织和执行测试的各个方面：


    ## 单元测试简介

    1. “解释 Java 单元测试的概念及其在软件开发中的重要性。”

    2. “讨论为 Java 代码编写自动化单元测试的益处。”

    3. “提供单元测试原则的概述，包括隔离性和测试覆盖率。”


    ## 设置测试环境

    4. “解释如何为 Java 项目设置测试环境。”

    5. “编写代码来演示如何配置测试依赖和框架。”

    6. “讨论测试依赖与生产环境依赖之间的差异。”


    ## 测试方法剖析

    7. “解释 Java 中典型单元测试方法的结构。”

    8. “编写代码，使用 `JUnit` 或 `TestNG` 创建一个基础的单元测试方法。”

    9. “讨论测试方法命名规范的意义。”


    ## 断言与验证

    10. “讨论断言（assertions）在单元测试中的作用以及它们如何验证预期结果。”

    11. “编写代码来演示 `JUnit` 或 `TestNG` 提供的各种断言方法。”

    12. “解释选择合适的断言消息的重要性。”


    ## 测试固件与设置/拆理

    13. “解释测试固件（test fixtures）的概念以及它们如何提供一致的测试环境。”

    14. “编写代码来演示在 `JUnit` 或 `TestNG` 中使用 `setup` 和 `teardown` 方法。”

    15. “讨论 `setup` 和 `teardown` 方法的执行顺序。”


    ## 参数化测试

    16. “讨论单元化参数单元测试的优势。”

    17. “编写代码，使用 `JUnit` 的 `@ParameterizedTest` 或 `TestNG` 的 `@DataProvider` 创建参数化测试。”

    18. “解释参数化测试如何帮助单个测试方法测试多个场景。”


    ## 测试套件与测试组

    19. “解释测试套件（test suites）的概念以及它们如何组合相关的测试类。”

    20. “编写代码，使用 `JUnit` 的 `@Suite` 或 `TestNG` 的 `<suite>` 标签创建测试套件。”

    21. “讨论测试套件如何改进测试的组织和执行。”


    ## 忽略与禁用测试

    22. “讨论可能需要忽略或禁用测试的场景。”

    23. “编写代码，使用 `JUnit` 或 `TestNG` 注解忽略或禁用特定的测试方法。”

    24. “解释在持续集成期间如何管理被忽略的测试。”


    ## 异常测试

    25. “解释 Java 单元测试中测试异常的方法。”

    26. “编写代码，使用 `JUnit` 或 `TestNG` 创建预期特定异常的测试。”

    27. “讨论如何处理预期的异常及其消息。”


    ## 模拟与存桩（Mocking and Stubbing）

    28. “讨论单元测试中模拟（mocking）和存桩（stubbing）的概念。”

    29. “编写代码，使用模拟框架（`Mockito`）创建模拟对象并存桩方法行为。”

    30. “解释模拟对象如何帮助隔离待测试单元。”


    ## 测试驱动开发 (TDD)

    31. “解释测试驱动开发 (TDD) 的原则及其益处。”

    32. “编写代码演示 TDD 流程：编写一个失败的测试、实现代码并进行重构。”

    33. “讨论采用 TDD 的挑战与优势。”


    ## 代码覆盖率分析

    34. “讨论代码覆盖率的概念及其在单元测试中的重要性。”

    35. “编写代码，使用 `JaCoCo` 等工具生成并分析代码覆盖率报告。”

    36. “解释代码覆盖率指标如何引导测试的创建和改进。”


    ## 测试数据管理

    37. “讨论单元测试中测试数据管理的策略。”

    38. “编写代码，使用工厂（factories）或构建器（builders）创建可重用的测试数据。”

    39. “解释如何在不同测试用例之间维护测试数据的一致性。”


    ## 集成 vs 单元测试

    40. “解释集成测试与单元测试之间的差异。”

    41. “讨论何时选择单元测试而非集成测试，反之亦然。”

    42. “编写代码演示为单元测试隔离代码单元。”


    ## 测试私有方法

    43. “讨论测试私有方法的挑战与争议。”

    44. “编写代码演示如何使用反射或通过保护性方法暴露来测试私有方法。”

    45. “解释测试私有方法功能的替代方案。”


    ## 测试框架对比

    46. “对比 `JUnit` 和 `TestNG` 这两个 Java 流行的单元测试框架。”

    47. “讨论每个框架在不同测试场景下的优缺点。”

    48. “编写代码，演示使用 `JUnit` 和 `TestNG` 实现等效测试用例。”


    ## 测试驱动的重构

    49. “讨论单元测试如何促进重构和代码维护。”

    50. “编写代码，根据现有的失败测试重构一段代码。”

    51. “解释如何确保重构后的代码保持其预期行为。”


    ## 测试命名与文档化

    52. “解释清晰且具描述性的测试方法名称的重要性。”

    53. “编写代码创建具有意义名称的测试方法并使用注解进行文档说明。”

    54. “讨论命名良好的测试如何提高可读性和协作性。”


    ## 持续集成与测试

    55. “讨论单元测试与持续集成 (CI) 流水线的集成。”

    56. “编写代码演示 CI 环境中的自动化测试执行。”

    57. “解释通过 CI 测试早期发现缺陷的益处。”


    ## 测试替体与间谍者（Test Doubles and Spies）

    58. “解释单元测试中测试替体（test doubles）和间谍者（spies）的概念。”

    59. “编写代码，使用 `Mockito` 等框架创建间谍者以部分模拟真实对象。”

    60. “讨论何时使用存桩、模拟和间谍者。”


    ## 测试驱动的完善

    61. “讨论随代码演进而完善测试。”

    62. “编写代码演示在代码更改后更新测试。”

    63. “解释测试驱动的完善如何确保可靠性。”


    ## 测试框架的扩展性

    64. “讨论如何扩展测试框架以满足特定需求。”

    65. “编写代码在 `JUnit` 或 `TestNG` 中创建自定义运行器、监听器或扩展。”

    66. “解释框架扩展所需的场景。”


    ## 测试报告与可视化

    67. “讨论清晰测试报告和可视化的重要性。”

    68. “编写代码，使用测试框架生成和解释报告和指标。”

    69. “解释有效的报告如何增强测试结果的可视性。”


    ## 模拟 final 和静态方法

    70. “讨论单元测试中模拟 final 和静态方法的挑战与解决方案。”

    71. “编写代码，使用 `PowerMock` 等框架模拟 final 和静态方法。”

    72. “解释 `PowerMock` 等框架如何实现此类方法的测试。”


    ## 测试注解与配置

    73. “讨论测试注解和配置文件如何简化测试。”

    74. “编写代码，创建并使用测试配置文件来设置测试环境。”

    75. “解释测试注解如何改进测试组织和执行。”


    ## 并发测试

    76. “讨论并发代码测试的挑战。”

    77. “编写代码，使用 `JUnit` 的 `@ThreadSafe` 或 `TestNG` 的并发特性演示并发测试。”

    78. “解释测试中识别和防止竞态条件的技术。”


    ## 测试遗留代码

    79. “讨论为遗留 Java 代码引入单元测试的策略。”

    80. “编写代码，在最最少的情况下为现有代码创建测试。”

    81. “解释测试遗留代码以提高维护性的益处。”


    ## 测试驱动 Bug 修复

    82. “讨论单元测试如何驱动识别和修复 Bug 的过程。”


