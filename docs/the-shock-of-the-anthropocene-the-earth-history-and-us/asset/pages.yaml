    In this nature pervaded by connections, chains of dependence and reciprocities,
    catastrophe always threatened. In the words of Bernard de Saint-Pierre: ‘The harmony
    of this globe would be partially destroyed, if not entirely, were one to suppress
    even the smallest species of plant.’¹


