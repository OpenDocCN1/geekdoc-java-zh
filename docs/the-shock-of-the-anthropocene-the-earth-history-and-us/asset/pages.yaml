    # From circumfusa to environment


    Let us begin quite simply with the word ‘environment’. Its recent history seems
    to confirm the thesis of a contemporary environmental awareness; it was only in
    the 1970s that the environment became institutionalized, with the establishment
    of the Environmental Protection Agency in the United States, ministries of the
    environment in the countries of the OECD, and the UN Environment Programme (1972).
    It is necessary to note two points: first, these new agencies and ministries were
    charged with applying laws and regulations (such as clean air acts, for example)
    that had a longer history, and secondly, the very history of the word shows that
    the form of reflexivity it denotes is in fact very long-standing, going back at
    the late eighteenth century.


    The present-day sense of ‘environment’ was popularized by Herbert Spencer in the
    nineteenth century, and subsequently adopted in French. George Perkins Marsh does
    not use it in Man and Nature, the great American environmentalist text of its
    decade, nor Eugene Hugnier in La Fin du monde par la science (1855), the first
    catastrophist philosophy of technology. Herbert Spencer, on the other hand, first
    in Principles of Psychology (1864), it uses dozens to describe the ‘circumstances
    of an organism’, in other words all the forces that affect and transform it, and
    he explores the reciprocal relationships between organism and environment.


    In the 1850s, in both French and English, ‘environment’ was commonly used to refer
    to such things as the immediate surroundings of a town. But Spencer used the term
    in a more specific sense, corresponding to a fundamental concept of French public
    health studies from the late eighteenth century, that of circumfusa or ‘surroundings
    things’. By this term, the medics included air, water and place, inspired by Hippocratic
    medicine and all the elements that had influence over health. At the same time,
    materialist philosophers such as Buffon and Diderot were interested in environment
    and climate as a way of modifying or improving living creatures and, above all,
    man. The notion of circumfusa finally merges, in'
