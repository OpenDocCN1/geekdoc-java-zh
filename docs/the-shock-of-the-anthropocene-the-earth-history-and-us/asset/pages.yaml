    # The economization of the world


    By unburdening itself of nature, economics naturalized the idea of indefinite
    growth. Its role could have stopped there and been only ideological, if the tools
    and ontologies that it forged had not been projected back onto a nature that it
    had so potentially externalized. In the course of the twentieth century, the mode
    of reasoning of marginalist economics, based on the ideas of optimality and equilibrium
    as well as market instruments, became central in the definition of the proper
    uses of the world.


    The case of the management of fish stocks is quite exemplary here. After the Second
    World War, the countries of South America, Peru in particular, sought to forbid
    the activity of United States trawlers in their territorial waters. In a similar
    way, South Korea complained of the incursions of Japanese and Russian vessels.
    In order to preserve the principle of freedom of the seas, essential for its commercial
    and military power, the United States imposed on international fishery a new principle,
    that of ‘maximum sustainable yield’, to which fishing had to be authorized as
    long as the ratio of catch to effort had not yet reached a maximum. In order to
    apply the optimization principle, the model neglected both relationships between
    species and marine environments. It conceived fishery resources after the model
    of a field which would be stimulated by increased catches (since young fish grow).
    Natural processes were conceived as linear and reversible. If the fishing effort
    was reduced, the resource would automatically increase. Under this regime of supposedly
    sustainable fishing, catches rose dramatically from 20 million tonnes in 1950
    to 80 million tonnes in 1970, leading to a generalized decline in reserves..45


    From the 1970s onwards, the notions of sustainability and durability became central
    in the fundamental ideological battle to circumvent mounting criticisms of the
    Western growth model. The publication in 1972 of the famous Club of Rome report
    The Limits to Growth,..46 which followed'
