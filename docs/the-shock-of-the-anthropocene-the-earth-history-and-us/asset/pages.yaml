  md: 'As well as climate change and the collapse of biodiversity, scientists also
    note other major transformations that attest to our entry into the Anthropocene.
    These include in particular biogeochemical cycles of water, nitrogen and phosphate,
    each as important as that of carbon, which have also come under human control
    in the course of the last two centuries. The modification of the continental water
    cycle is massive, with the draining of half the planet’s wetlands and the construction
    of 45,000 dams with heights of more than fifty metres, together retaining 6,500
    cubic kilometres of water, some 15 per of the total flow of the world''s rivers.
    11 These transformations have substantially modified the processes of erosion
    and sedimentation, without freeing the greater part of humanity from water insecurity.


    The nitrogen cycle has been radically transformed with industrialization (the
    burning of fossil fuel releasing nitrous oxides) and Haber-Bosch process (1913)
    that converts atmospheric nitrogen into nitrogen suitable for fertilizer. These
    two phenomena represent nitrogen flows as great as the ‘natural’ flow through
    the biosphere, basically bound upon biological fixing by bacterial symbiosis.
    12 The nitric oxide released by fertilizers accentuates the greenhouse effect,
    and excess urea and nitrates enter watertables, rivers and estuaries, causing
    eutrophication and hypoxia.


    The global phosphorus cycle also bears the mark of human domination, with an anthropic
    flow eight times greater than the natural one. Some 20 million tonnes of phosphorus
    are extracted each year from phosphate mines in the lithosphere, chiefly to be
    used for fertilizer. It is estimated that 9 million of these 20 million tonnes
    end up in the oceans. 13 Scientists have shown that an increase in phosphate level
    of only 20 per in relation to the underlying natural flow was in the geological
    past one of the causes for the collapse of the oxygen level in the oceans, leading
    to the massive extinction of aquatic life.


    Scientists and geographers have also attempted to estimate the extent to which
    terrestrial ecosystems have been turned into the artificial ones of pasture, crop-land
    and cities. It turns out that the human species, having increased from a population
    of 900 million in 1800 to 7 billion in 2012, takes nearly a third of the production
    of continental biomass for its own needs (in terms of food, clothing, housing
    and many less vital things), 14 and consumes each year one and a half times the
    planet can annually'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'produce on a sustainable basis. This means that ‘we’ – meaning all the 500
    million most well-off inhabitants of the globe – are not only consuming the fruits
    of the tree on which we sit but also sawing through its branches.15


    The Anthropocene is characterized by an unprecedented surge in energy mobilization:
    first with coal, then with hydrocarbons and uranium, which increased energy consumption
    by a factor of forty between 1800 and 2000.16 This leap in energy has served to
    transform the planet with multiplied power, to plow, urbanize and domesticate
    ecosystems. Past, crop-land and cities, which represented 5 per cent of the Earth''s
    land area in 1750 and 12 per cent in 1900, today cover close to a third. Including
    partially anthrophized biomes, it is estimated that 84 per cent of the ice-free
    land surface of the planet is under direct human influence.17 Ninety per cent
    of photosynthesis occurs in ‘anthropogenic biomes’, that is, ecological ensembles
    modified by human beings. As the geographer Erle Ellis concludes, the new model
    of the biosphere ‘moves away from an outdated view of the world as “natural systems
    with humans disturbing them” and towards “human systems with natural ecosystems
    embedded within them”.18


    Figure 1 gives a dashboard display of the Anthropocene, showing the evolution
    of twenty-four parameters of the Earth system since 1750. For the nine most important
    of these, a team of scientists from the Resilience Centre in Stockholm studied
    possible tipping points affecting biodiversity (the risk of collapse of ‘services''
    that nature performs for us, such as pollination), air and atmosphere pollution,
    the intensification of biogeochemical cycles and the anthropolization of land.
    They then set for each of these nine parameters a limit not to be crossed. For
    four of these, however the limit (danger threshold of a sudden tipping of the
    Earth system into a catastrophic state) has already been approached (or passed):
    nitrogen cycle, greenhouse gas emissions, extinction of biodiversity and phosphate
    cycle.20'
