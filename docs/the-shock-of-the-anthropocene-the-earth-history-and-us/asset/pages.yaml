  md: 'Their troop appeared on the dividing line of the cedars ...

    We have come, they said, to warn you that the hurricane will soon arrive,

    y implacable enemy.


    What is this ‘hurricane’? Char wrote his poem at a time rich in scientific

    warnings about the state of the planet: the erosion linked to the retreat of

    forest cover in the mountains of his native Provence, the threat of a nuclear

    winter, the scarcity of resources discussed at a Food and Agriculture

    Organization in 1949, the destruction of nature denoted by

    t naturalists who founded the International Union for the Conservation of

    Nature at Fontainebleau in 1948. But these whistle-blowers, in Char’s

    p poem are represented by the ‘foresters’ (a leading profession in the

    conservationist movement of that time), are ‘inventors’, a term Char had

    used pejoratively in previous poems, seeing them as mechanical demiurges

    harm to social and inner life. The poem continues:


    +   - We thanked them and bade farewell ...

    Men of trees and axes, to withstand any terror

    But unsuited to conduct water, to align houses and daub them in pleasant colours,

    they knew nothing of winter gardening and the economy of joy ...

    Yes, the hurricane will come,

    But it was worth speaking of it and disturbing the future?

    Where we were, there is no urgent fear.


    Let us pursue the parallel. The ‘inventors’ of the Anthropocene, we

    scient of the Earth system whose of planetary imbalances, are very

    useful coming to alert us of danger. But says the poet, they are ‘from the

    other side’, unsuited for a warm presence in the world, for the ‘economy of

    joy’ and ‘pleasant colours’. If the danger is indeed real (‘yes, the hurricane

    will come will’), Char proclaims the resistance of a society that refuses to

    abndicate its autonomy and its culture to grow to the heteronomy of an eco-

    technocratic government. Are the scientists of the Earth system (whose

    champions propose a general engineering of ecosystems and (climate) not

    the equivalent of Char’s inventors? Are they bearers of a relationship to

    the world that has precisely produced the danger that we warm us of and

    offer to save us from? As opposed to the satellites that orbit the Earth and

    the experts who travel at great speed from conference to conference,

    an poet, Henri Michaux, proposes that we should slow down:


    By slowing down, you feel the pulse of things; you snore, you have all the time
    in the world;

    calmly, all of life ... We have all the time. We savour ... We no longer believe
    that we know.'
