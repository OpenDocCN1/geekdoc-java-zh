    from 12.6 in 1826 to 2.1 in 1981, in France from 3 in 1929 to 0.7 in 1970, and
    to 0.64 in the United States and Denmark in 2005.82


    Whereas in the age of empires Western Europe had to import grain, meat and oils,
    a new world ‘food regime’ set in after 1945. Stimulated by cheap oil and supported
    by state policy and export aid (the US Public Law 480 of 1954), the agriculture
    of the industrial countries (including continental Western Europe) became an exporter
    of agricultural products to the Third World, cereals in particular. This transformation
    promoted a rural exodus and a lower cost in the countries of the South seeking
    a path of industrialization, while the agribusiness multinationals conquered the
    world and shifted eating habits.


