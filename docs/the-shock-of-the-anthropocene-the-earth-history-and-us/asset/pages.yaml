  md: 'Take for example the situation of the forests during the Great Acceleration.
    Since the last glaciation, 10 million square kilometres of the world’s forest
    cover have been lost (forty-three times the area of Great Britain), half of this
    in the twentieth century alone, reducing the planet’s capacity for capturing carbon
    dioxide and increasing the risk of major climatic disturbance, as well as transforming
    the soil equilibrium and rainfall of the regions affected.98 But whereas the seventeenth
    and eighteenth centuries saw a major deforestation in Western Europe (continuing
    until 1920 in the United States), in the twentieth century, and especially since
    1945, there has been an increase in forest cover in Western Europe and a quasi-stabilization
    in the United States—meaning that the 5 million hectares of forest lost in the
    twentieth century has been all in the economically poorest countries,99 generating
    forest and agricultural products consumed largely in Europe and the United States,
    which in this same period improved the ecological quality of their own territories.


    In conclusion, there would be heuristic and explanatory advantages in speaking
    of a ‘Capitalocene’ rather than an Anthropocene. This particularly means that
    the rich countries would neither have succeeded in industrializing nor attained
    the post-war affluent society without the possibility of unequal ecological exchange
    with the rest of the world, and that unequal ecological exchange is indeed a major
    explanatory factor for the combined genesis of the asymmetries characteristic
    of the historical dynamic of capitalism, and the rise of human impacts that caused
    the geological derailment of the planet in the Anthropocene. A rematerialized
    and ecized history of capitalism appears as the indispensable part of the Earth
    systems in order to understand our own epoch.100


