  md: 'Anthropocologists seem attracted to historical narration. What is more natural
    to explain the human dynamic that has tipped the Earth into a new state? Since
    the Anthropocene is a new epoch, the question of knowing how we arrived here arises
    immediately, and science presents an account of ‘the evolution of humans and our
    societies from hunter-gatherers to a global geophysical force’.4 To tell the Odyssey
    of humans, in the nineteenth century ‘frail bent reeds ... with their feet plunged
    into death into the immortal soil,’5 but have today become ‘equipotent to the
    Earth,’6 as Michel Serres puts it, anthropocologists have constructed a narrative,
    searched for founding events and causal chains, and marked out points.


    In 2000, Crutzen and Eugene Stoermer positioned the invention of the steam engine
    in 1784 as the start of the Anthropocene.7 They also mentioned scientific precursors
    of the Anthropocene concept, from Antonio Stoppani and George Perkins March in
    the nineteenth century to Vladimir Vernadsky.8 Since then, articles proposing
    a historical narrative of the Anthropocene have proliferated, as well as interdisciplinary
    projects that bring together scientists and historians (such as the IHOPE project:
    Integrated History and Future of People on Earth).9 Specialists in environmental
    history such as John McNeil and Libby Robin have likewise joined with scientists
    in elaborating a historical account of the interactions between the human species
    and the Earth system since the end of the eighteenth century.10


    The narratives of the anthropologists propose three ‘stages’. The first, from
    the beginnings of the industrial revolution to the Second World War, corresponds
    to the turn into the Anthropocene, with the thermo-industrial revolution raising
    the concentration of atmospheric carbon dioxide from 277 to 280 parts per million
    (ppm) in the eighteenth century by 311 by the twentieth century (as again between
    260 and 285 ppm for the 11,500 years of the Holocene). The mobilization of coal
    formed hundreds of millions of years ago started in China and in Europe in the
    eleventh century but only acquired a massive scale from 1750, with the increase
    from some 500 steam engines in the whole world to hundreds of thousands by 1900.
    This fossil energy supplanted renewable energies, making possible the development
    of rail transport and global trade,'
