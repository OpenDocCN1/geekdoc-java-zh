    constructions are themselves in question by the disturbances of the Anthropocene:
    ‘the mansion of modern freedoms stands on an ever-expanding base of fossil-fuel
    use’⁴⁶ which today are either growing scarce or disturbing the climate. How can
    the ideal of democracy be founded anew when the dream of material abundance is
