  md: 'An example drawn from the book by Kenneth Pomeranz, A Great Divergence, clarifies
    the issue for the writing of history. Take two technologies: the steam engine
    and the Chinese furnace, more economic on energy than its European counterpart.
    How should we judge their historical importance? Why does the first seem worthy
    of historians'' interest, while the second is generally unknown? It is only the
    abundance of coal that makes the capacity to draw more energy from combustibles
    appear more determinant, and relegates Chinese furnaces to a footnote.^10 If the
    English coal mines had shown signs of exhaustion from 1800, on the hierarchy would
    have been reversed. The oil peak and climate change thus raise the question of
    direction in the history of technology, forcing us to reconsider its objects and
    envisage a ‘disoriented’ history.


    If it is to dispense with the idea of transition, energy history should abandon
    its classic terrain and study past historical situations in which societies were
    forced to reduce their energy consumption. The crisis of the 1930s offers some
    interesting cases: carbon emissions in the United States fell from 520 to 340
    million tonnes, and in France from 66 to 55 million. In the latter case, this
    reduction was not just bound with the recession, but also with the differential
    evolution of prices: that of coal rose by 40 per cent during the crisis, while
    the general price index stagnated. It was also in the 1930s that wood fuel experienced
    a peak, before a definitive decline after the Second World War.^11 A historian
    of energy growth could also study the case of post-war Germany (from 185 to 32
    million tonnes of carbon), or, nearer our own time, the fall of the Soviet Union
    (606 million tonnes in 1992, 419 million in 2002). In each of these cases, production
    fell sharply (the GDP of the USSR falling by half between 1992 and 2002).^12


    The examples of North Korea or Cuba after the fall of the USSR allow us to give
    a concrete meaning to what may lie concealed behind the pleasant euphemism of
    ‘energy transition’. Between 1992 and 1998, deprived of Soviet oil, North Korean
    agriculture based on mechanization and chemical inputs saw its yields of maize,
    wheat and rice by half. The North Korean state prioritized fuel supply to the
    army, leaving between 600,000 and a million of its citizens (3 to 5 per cent of
    the population) to succumb to famine before deciding for international food aid.


    In the same period, deprived of Soviet oil and under American embargo, the Cubans
    confronted for a ten-year *period especial*, a situation that'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'presents certain similarities with that awaiting our industrial societies.
    In order to save on energy, working hours in industry were reduced, domestic electricity
    consumption was rationed, the use of bicycles and car pools were generalized,
    the university system was decentralized, solar energy and biogas were developed
    (supplying 10 per cent of electricity). In agriculture, the cost of pesticides
    and chemical fertilizers, very greedy in terms of energy, led the Cuban to innovate:
    biological control of pests by insect predators, organic fertilizers, and urban
    horticulture that enabled the recycling of organic waste. Finally, food was strictly
    rationed.13 Cuban bodies were significantly modified by the special period. In
    1993, the crisis was at its worst, the daily ration was reduced to 1,900 kilocalories.
    Cubans lost an average of five kilos per person, which had the benefit of reducing
    cardiovascular disease by 30 per cent.14 What is most disturbing, is that the
    reduction in CO2 emissions was in the end rather modest, falling in ten years
    from 10 million to 6.5 million tonnes, much less than the 40 to 70 per cent reduction
    of world emissions by 2050 called by the IPCC that would cap global warming at
    a two-degree celsius increase.


    Nor should we fall prey to illusion as to our technological capacity to reduce
    the energy shock. The French nuclear power programme of the 1970s-''80s offers
    a vivid demonstration of this: despite colossal public investment (in the order
    of 400 billion francs at 1990 prices), French CO2 emissions continued to rise
    during these two decades, from 90 to 110 million tonnes per year.


    # A history of inefficiency


    In relation to energy history, the history of the Thermocene also needs to free
    itself from two abstractions that overdetermine results: GDP and the very concept
    of energy.


    The exponential growth curves traced by historians are based on nineteenth-century
    thermodynamics, that is, an intellectual project that brings every form of work
    (from brain to blast furnace) into a generalized equivalence, on the hypothesis
    of a general substitutability of energy sources. The main difficulty is that this
    history depends on statistics of'
