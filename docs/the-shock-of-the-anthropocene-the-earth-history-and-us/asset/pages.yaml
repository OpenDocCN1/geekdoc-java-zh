    military technologies have reached unheard-of levels of energy consumption. An
    Abrams tank in the US army burns four litres per kilometre. A B-52 bomber burns
    12,000 litres of jet fuel per hour, and an F-15 fighter 7,000 litres, comparable
    to the consumption of an average family car in a whole decade. In 2006, the US
    Air Force consumed a total of 2.6 billion gallons of jet fuel, as was used overseas
    throughout the whole of the Second World War.⁵


    The basic transformation of the Western way of making war, its deep integration
    in the industrial system, the way in which the military are embedded in research
    and development.⁶ all underlie the argument of the present chapter that the Anthropocene
    is also (and perhaps above all) a Thanatocene.⁷'
