  md: '# CHAPTER 11

    Polemocene: Resisting the Deterioration of the Earth since 1750


    Once the long history of environmental reflexivity and environmental inequalities
    resurfaces in our understanding of the last two hundred years, the centrality
    of conflict in the history of the Anthropocene becomes self-evident. It would
    be clearly anachronistic to speak of an ‘ecological movement’, when the very word
    did not exist until 1866, but a patronizing history that failed to rescue the
    socio-environmental resistances to industrialism from what E. P. Thompson called
    ‘the enormous condescension of posterity’, a history that would neglect to give
    voice to the defeated or marginalized alternatives (technical, social, environmental),
    would be no less anachronistic.¹¹ This chapter explores the existence, since the
    eighteenth century, of ‘environmentalism of the poor’ fighting for social justice
    and environmental decency, active both in core countries and in the periphery.²


    Challenging the ‘material deterioration of the planet’ at the dawn of industrialization


    Anthropogenic undertakings that massively disturbed moral and natural economies
    did not proceed without criticism, challenge and struggle.'
