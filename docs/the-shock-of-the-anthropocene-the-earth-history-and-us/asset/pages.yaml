  md: 'one. The number of humans who moved from the metabolism of an agricultural
    society (annual energy consumption per capita of about 65 gigajoules) to an industrial
    metabolism based on fossil energies (223 gigajoules per capita) grew from 30 per
    cent of the world population in 1950 to 50 per cent by 2000.^78


    The Great Acceleration was thus not a uniform phenomenon of accelerated growth,
    but a qualitative change in lifestyle and metabolism, tying world growth to an
    even stronger growth in fossil fuels (especially oil, which dethroned coal) and
    mineral resources, and so representing a loss of matter and energy efficiency
    on the part of the world economy. This process was also unequal geographically
    and socially, shaped by the dynamic of a world-system that was now dominated by
    the United States in the context of the Cold War. Emerging from the Second World
    War, American power was at its apotheosis. While the European economy was ruined,
    the GDP of the United States had more than quadrupled since 1939, and the country
    possessed immense currency reserves. At the end of the 1940s, the US made 60 per
    cent of world industrial production, produced nearly 60 per cent of world oil
    (and consumed as much) and made up a third of world GDP, Great Britain at its
    peak in 1870 had only a 9 per cent share.^79


    In the immediate post-war years, the US government was concerned to create conditions
    favourable to the of of economy, and to the growth of the Western camp in general.
    It was in this context that a new international economic order was established,
    based on free trade and growth: Bretton Woods Agreements of 1944 established the
    dollar as world currency, the General Agreement on Tariffs and Trade (GATT) liberalized
    trade in 1947, coupled with the Marshall Plan and the fourth point of the Truman
    Doctrine on development aid. This world order made it possible to find outlets
    for the United States’s gigantic industrial and agribusiness production and ensured
    full employment and social pacification after the great strikes of 1946. It also
    aimed to stabilize the Western camp socially by drawing it into growth. The Fordist
    and consumerist social compromise was then viewed as the best rampant against
    Communism.^80 It was also the goal to ‘develop’ the Third World so as to avoid
    its turn to Communism, while ensuring cheap raw materials for the United States
    and its industrialized allies. In the 1950s and ''60s, a gigantic exploitation
    of natural and human resources enabled the Eastern'
