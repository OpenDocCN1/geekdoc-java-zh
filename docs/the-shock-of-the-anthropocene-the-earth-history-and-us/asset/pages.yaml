    coal and 1.6 per cent of electricity. If we add to this carbon dioxide emissions
    bound upon arms production, between 10 and 15 per cent of American emissions during
    the Cold War were attributable to the military.⁴


    Efficiency has a very different meaning when the object is to kill rather than
    killed. The development of contemporary weapons systems illustrates the tendency
