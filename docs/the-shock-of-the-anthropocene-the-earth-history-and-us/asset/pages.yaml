  md: 'would be taken up across the world. First envisioned as a tool for monitoring
    the economy during recession, the calculation of GDP would serve above all during
    the Second World War to prime the American military effort, without compromising
    economic growth. In 1900, only eight countries had published their national income,
    a figure that grew to thirty-nine in 1946 and eighty some years later.41 The change
    was also qualitative: the new mode of calculation, inherited from the realm of
    business accounting, was based on an equation between expenditure and income.
    This had two major consequences: first of all, the calculation of GDP normalized
    the economy as a closed circuit, a circular flow of value between production and
    consumption cut off from its natural moorings; and secondly, by measuring it with
    just one figure, national accounting reified the economy and made possible to
    erect it into an entity separate from society, politics and nature.


    National accounting rested, finally, on the hypothesis of a completely commodified
    economy. Housework and ‘free’ services (including those rendered by nature) were
    absent from the calculation. In 1949, a fascinating debate took place among the
    inventors of GDP: Keynes, Milton Gilbert, Colin Clark, François Perroux, George
    Findlay Shirras and D. H. MacGregor among others.42 We find the earliest and most
    radical critique of national accounting. According to its own proponents, GDP
    was narrowly correlated with military expenditure, it could not simply be used
    during peacetime conditions. Not was it used for less developed countries, as
    the non-market sphere played too important a role here, falsifying international
    comparison. Secondly, GDP had to be reduced by the ‘costs of civilisation’, which
