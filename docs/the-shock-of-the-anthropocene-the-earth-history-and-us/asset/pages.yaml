  md: '# Preface


    What exactly has been happening on Earth in the last quarter of a millennium?


    The Anthropocene.

    Anthropo-what?


    We already live in the Anthropocene, so let us get used to this ugly word and
    the reality that it names. It is our epoch and our condition. This geological
    epoch is the product of the last few hundred years of our history. The Anthropocene
    is the sign of our power, but also of our impotence. It is an Earth whose atmosphere
    has been damaged by the 1,500 billion tonnes of carbon dioxide we have spilled
    by burning coal and other fossil fuels. It is the impoverishment and artificializing
    of Earth’s living tissue, permeated by a host of new synthetic chemical molecules
    that will even affect our descendants. It is a warmer world with a higher risk
    of catastrophes, a reduced ice cover, higher sea-levels and a climate out of control.


    The Anthropocene label, proposed in the 2000s by specialists in Earth system sciences,
    is an essential tool for understanding what is happening to us. This is not just
    an environmental crisis, but a geological revolution of human origin.


    We should not act as astonished ingénues who suddenly discover they are transforming
    the planet: the entrepreneurs of the industrial revolution who brought us into
    the Anthropocene actively willed this new epoch and shaped it. Saint-Simon, the
    herald of what was already called ‘industrialism’, maintained in the 1820s that:


    *'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'The object of industry is the exploitation of the globe, that is to say, the
    appropriation of its products for the needs of man; and by accomplishing this
    task, it modifies the globe and transforms it, gradually changing the conditions
    of its existence. Man hence participates, unwittingly as ever, in the successive
    manifestations of the divinity, and thus continues the work of creation. From
    this point of view, Industry becomes religion.¹1


    # His pessimistic counterpart, Eugène Huiser, predicted in 1857:


    In one or two hundred years


    The present book sets out to comprehend this new epoch through the narratives
    that can be made of. It calls for new environmental humanities to rethink our
    visions of the world and our ways of inhabiting the Earth together. Scientists
    have built up data and models that already situate beyond the point of no return
    to the Holocene, on the timetable of geological epochs. They have produced figures
    and curves that depict humanity as a major geological force. But what narratives
    can make sense of this dramatic curves?


    This is by no means a theoretical question, as each account of ‘How did we get
    here?’ makes assumptions through which we frame ‘What to do now?’


    There is already an official narrative of the Anthropocene: ‘we’, the human species,
    unconsciously destroyed nature to the point of hijacking the Earth system into
    a new geological epoch. In the late twentieth century, a handful of Earth system
    scientists finally opened our eyes. So we know; we are aware of the global consequences
    of human action.


    This story of awakening is a fable. The opposition between a blind past and a
    clear-sighted present, besides being historically false, depoliticizes the long
    history of the Anthropocene. It serves above all to credit our own excellence.
    Its reassuring side is demobilizing. In the twenty years that it has prevailed,
    there has been a great deal of congratulation, while the Earth has become ever
    more set on a path of ecological imbalance.


    In its managerial variant, the moral of the official account consists in giving
    the engineers of the Earth system the keys to ‘Spaceship Earth’; in its philosophical
    and incantatory variant, it consists in calling first and foremost for a revolution
    in morality and thought, which will allow'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'the conclusion of an armistice between humans and non-humans, and reconciliation
    of all of us with the Earth.


    To see the Anthropocene as an event rather than a thing taking history seriously
    and learning to work with the natural sciences, without becoming more chronicles
    of a natural history of interactions between the human species and the Earth system.
    It also means noting that it is not enough to measure in order to understand,
    and that we cannot count on the accumulation of scientific data to carry out the
    necessary revolutions or involutions. It means deconstructing the official account
    in its managerial and non-conflicting variants, and forging new narratives for
    the Anthropocene and thus new imaginaries. Rethinking the past to open up the
    future.


    Is the Anthropocene the age of man? Perhaps, but what does it mean for us, to
    have the future of a planet in our hands? While welcoming the work of scientists
    and philosophers with open arms, we seek to comprehend the Anthropocene as historians,
    since, if ecological imbalance is now greater than ever before, this is not the
    first time that humans have asked themselves what they are doing to the planet.
    To forget past reflections and understandings, struggles and defeats, illusions
    and mistakes, would mean losing an experience that is precious for the present
    challenges.


    We have passed the exit gate from the Holocene. We have reached a threshold. Realization
    of this must revolutionize the views of the world that became dominantant with
    the rise of industrial capitalism based on fossil fuel. What historical narratives
    can we offer of the last quarter of a millennium, to help us change our world-views
    and inhabit the Anthropocene more lucidly, respectfully and equitably? Is such
    the object of this book.


    The first part presents the scientific dimensions of the Anthropocene (Chapter
    1) along with its major implications for our views of the world, and for the human
    and social sciences (Chapter 2). The second part discusses the problems of the
    ''geocentric'' account of the Anthropocene that is currently dominant. This depicts
    the Earth as a system seen from nowhere (Chapter 3), and history as a contest
    between the human species as a whole and the planet, with societies as ignorant
    and passive masses who can only be guided by scientists and saved by green technologies
    (Chapter 4). We show that an account of this kind naturalizes and depoliticizes
    our geohistory more than enables us to understand it. The third part sets out
    to'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'trace different historical threads from the eighteenth century to today: a
    political history of energy and CO2 (Chapter 5, Thermocene), a history of the
    determining role of the military in the Anthropocene (Chapter 6, Thanatocene),
    a history of the making of the consumer society (Chapter 7, Phagogene), a history
    of environmental grammars, knowledge and warnings (Chapter 8, Phronocene), a history
    of the intellectual constructions that made it possible to ignore and marginalize
    these warnings and deny planetary limits and boundaries (Chapter 9, Agnotocene),
    an attempt at a joint history of capitalism and the Anthropocene (Chapter 10,
    Capitalocene), and finally, a history of socioecological struggles and challenges
    to the damages of industrialism (Chapter 11, Polemocene).


    +   1 Doctrine de Saint-Simon, vol. 2, Paris: Aux Bureaux de l’Organisateur, 1830,
    219.

    2 Eugène Huzar, L’Arbre de la science, Paris: Dentu, 1857, 106.'
