    # The infinite world of fossil capitalism


    At the threshold of the Anthropocene, the Homo economicus of liberal

    political economy, moved by self-interest and material appetites, required in

    exchange a world made to his measure.2 Nature had to be profoundly

    redefined, as well as its influence on human societies, its capacity to

    reproduce itself and the wealth it offered to industry, in order to leave free

    rein to Homo economicus. The sciences accordingly composed a nature that

    liberalism and industry could mobilize, a mundus economicus to the

    measure of its industrious master.


    In the eighteenth century, Europe, like the rest of the world, lived in an

    organic economy in which the limits of agricultural land and forests formed

    a strong constraint on growth. Mechanical force derived from muscular

    energy (human and animal), from water and wind, all drawing their

    source in the last instance from the energy of the sun. For the United

    Kingdom, the historian E. A. Wrigley calculated that vegetation cover

    fixed a part of this solar energy in the production of biomass equivalent to

    between 20 and 40 million tonnes of coal.3 It was within this limit

    (extendable as a function of colonial territories) that human activities

    developed. The organic economy was thus embedded in a very constrained

    energy budget: four hectares of forest, for example, were needed to produce

    a tonne of iron, two hectares of pasture to feed a horse, etc. Every

    development of one kind of production had a negative effect on the growth

    capacity of others. The rise of forges and glass-works as new consumers of

    wood came into conflict with the needs of village and urban communities

    for fire-wood, threatening the quality and docility of the labour force. After

    more than two centuries of shrinking forests, Western Europe thus

