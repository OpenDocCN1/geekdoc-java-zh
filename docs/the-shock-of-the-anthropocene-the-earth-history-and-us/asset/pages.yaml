  md: '# CHAPTER 10


    # Capitalocene: A Combined History of Earth System and World-Systems


    If, as Fredric Jameson put it, ‘it is easier to imagine the end of the world than
    to imagine the end of capitalism’,¹ this is because capitalism has become coextensive
    with the Earth. The last three centuries have been characterized by an extraordinary
    accumulation of capital: despite destructive waves, this grew by a factor of 134
    between 1700 and 2008.² The dynamic of capital accumulation gave rise to a ‘second
    nature’ made up of roads, railways, mines, pipelines, wells, power stations, futures
    markets and container ships, financial positions and banks that store flows of
    matter, energy, goods and capital on a world scale. It is profit-oriented technostructure
    that swung the Earth into the Anthropocene. The change in geological regime is
    the act of the ‘age of capital’, rather than simply the ‘age of man’ as the dominant
    narrative claim.


