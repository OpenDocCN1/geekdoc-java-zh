    Origin of Species*, Darwin added that the ‘jar and shock’ of these blows could
    be ‘often transmitted very far to other weges in many lines of direction’.38


    Thus the term ‘ecology’ (ökologie), proposed by Ernst Haeckel in 1867, did not
    indicate a natura incognita but renamed and reorganized traditions of thought.39
    By coining this word, Haeckel had two main objectives in mind: on the one hand,
    to suggest that living beings made up a home, *oikos*, which despite conflicting,
