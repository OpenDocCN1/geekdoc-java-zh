  md: 'put the environment on the world agenda by the UN Conference on the Human Environment
    in Stockholm in 1972, soon followed by dozens of international environmental conventions
    and stricter controls on pollution in the North. The high point of this ecological
    movement was between 1968 and 1978. It was however gradually institutionalized
    (particularly with the expansion and professionalization of NGOs in the conservation
    sector),⁷⁷⁸ and a part of its strongest critiques (against capitalism and imperialism,
    against unequal exchange and ecology, against the ideology of growth) stifled.
    In the context of neo-liberal globalization promoted by the WTO agreements and
    the financializing of the economy, the environmental norms of the rich countries
    led rather to a delocalizing of polluting activities to the poor countries than
    to a global improvement.³⁷⁹


    In the face of the Club of Rome’s *Limits to Growth* and the works of the first
    growth economists, a section of the planet’s economic and political leaders in
    the 1970s dismissed any idea of a limit to growth, arguing that technological
    innovation would readily find solutions to these problems (see Chapter 9).


    The last fifteen years have witnessed a return of the radicalization of ecological
    warnings and mobilizations. On one hand, the data coming from life and Earth tends
    to confirm the unprecedented character of planetary ecological disturbance, whether
    in the 2007 and 2013 reports of IPCC (International Panel on Climate Change) or
    with the broad adoption of the notion of the Anthropocene. On the other hand,
    criticizing the modest achievements of pragmatic ‘green’ politicians in national
    governments and international arenas (the failure of the Copenhagen Climate Change
    Conference in 2009, this decade saw a proliferation of new forms of mobilization
    and commitment: ‘buen vivir’,⁷⁸⁰, the international movement of ‘transition towns’
    initiated in England, and the movement of objectors to growth (a concrete echo
    of economists’ reflections on prosperity without growth) as well as ‘Blockadia’
    movements, as Naomi Klein call them, reclaiming a place for nature and for alternative
    ways of living and fighting against ‘large dangerous and useless projects’ such
    as pipelines, tar sands exploitations, airports and highways.


