  md: 'can be seen and measured here and now. Three arguments can be given here in
    support of the Anthropocene.


    First of all, the level of atmospheric carbon dioxide has not been equalled for
    4 million years (Pliocene), and future warming will lead the Earth to states unknown
    for 15 million years. The extinction of biodiversity is taking place with a sudden
    matched only by five other episodes in the entire 4.5 billion years of life on
    Earth. The last extinction, which did away with the dinosaurs among, goes back
    65 million years and has left stratigraphic markers of the clearest kind. These
    phenomena, therefore, have the dual property of being caused by humans and being
    of a scale rarely noted in the geological past.


    Secondly, the anthropic changes in the composition of the atmosphere have left
    traces even in the Antarctic ice cores. Extinctions and modified distributions
    of species (exclusive invasions in the last few centuries, migrations bound up
    with climate change or the anthropization of biomes) cannot fail to leave fossil
    traces in the sediments. The transformations of lakeside and coastal fauna and
    flora caused by the human forcing of nitrogen and phosphorus cycles also have
    left a specific mark. As for the biomass of the 7 billion humans and their domestic
    animals, this makes up the predominant of overall biomass of terrestrial vertebrates,
    which will certainly appear remarkable to future palaeontologists.21 Finally,
    the stratigraphic indication left by urbanization, dams, industrial production
    (the world stock has reached 1,000 billion tonnes)22 mining and agricultural activity
    is notable and has recently shown that global warming, by modifying the volumes
