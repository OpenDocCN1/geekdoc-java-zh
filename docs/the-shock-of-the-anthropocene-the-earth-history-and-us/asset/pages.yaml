  md: '# CHAPTER 3

    Clio, the Earth and the Anthropocelenologists


    The scientists who invented the term ‘Anthropocene’ did not simply produce fundamental
    data on the state of our planet or advance a systemic and fruitful perspective
    on its uncertain future. They also proposed a history, story seeking to respond
    to the question ‘How did we get here?’ In this way, they developed an authorized
    narrative of the Earth, its past and its future shared with the human species,
    a narrative that makes the management of the Earth system a new object of knowledge
    government.


    The concept of the Anthropocene continues a number of previous narratives, produced
    in the course of history, of the global environment, the Earth and its proper
    usage. The world’s centres of government have long been the places where what
    balances or unbalances the planet has been spoken and demonstrated. They construct
    spheres in which the proper ways of handling it, tempering it or acclimatizing
    it are presented: from the greenhouses of the Jardin du Roi wrote his Epochs of
    Nature to the projects of geoengineering promoted by Paul Crutzen, by way of the
    Crystal Palace of London’s Great Exhibition of 1851, symbol of the commercial
    organization of the world,¹ or again the geodesic dome conceived by Buckminster
    Fuller – of the ‘Spaceship Earth’ metaphor – for the United States pavilion at
    the Montreal Universal Exhibition of 1967, presenting the first image of an ‘Earthrise’
    seen from the Moon.²'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'The elites of the French colonial empire in the eighteenth century, such as
    Pierre Poivre and Georges-Louis Leclerc de Buffon, those of the British empire
    in the nineteenth century, such as the economist William Stanley Jevons and the
    forester Dietrich Brandis, those of the conquest of the American West, such as
    Gifford Pinchot, or of US hegemony in the 1950s, as has Henry Fairfield Osborn,
    all developed in their time knowledge and global environmental warnings that dovetailed
    into systems of world domination — while attempting to infuse these little (see
    chapters 8 and 11). Far from being the hallmark of our present era, knowledge
    of the global environment has thus for a very long time part of imperial cosmographies.


    There is some reason to suspect, therefore, the knowledge and discourse of the
    Anthropocene may itself form part, perhaps unknowingly, of a hegemonic system
    for representing the world as a totality to be governed. To analyse this new cosmography,
    we shall study these texts most often cited by scientists, historians and philosophers
    who have introduced and discussed the notion of Anthropocene on the international
    stage.^3 For simplicity’s sake, we shall refer to this phalanx of renowned scholars
    who made the bold gesture of naming our epoch as ‘anthropocenologists’.


    Submitting these narratives to criticism does not mean denying the value of the
    investigations of these anthropocenologists. It is rather a matter of opening
    up the official narrative of the Anthropocene to discussion, so as to enable closer
    reflection on the particularities of our representations of the world. So that
    other voices *from* and *for* the Earth can be heard, coming from other cultures
    and other social groups; so that other explanations of ‘how we get to this point’
    and other proposals for ‘what is to be done’ may also have their say. Otherwise
    the seductive Anthropocene concept may well become the official philosophy of
    a new technocratic and market-oriented geopower.


    In order to make fruitful use of the advances in the Earth system sciences, we
    have to learn to ٹرسٹ the grand narratives that come with the Anthropocene concept,
    to pass them through the sieve of criticism. This is the way in science, history
    and democracy.


    # A history of ‘stages’'
