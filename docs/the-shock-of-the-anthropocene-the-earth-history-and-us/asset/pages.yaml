    # A geopolitical event


    Besides a geological event, the Anthropocene is at the same time a political event.
    In the IPCC’s hypothesis (by no means the most pessimistic) of an increase in
    average temperature of 3.7°C by 2100, the Earth will be warmer than it has ever
    been for 15 million years. For the extinction of biodiversity, this is already
    proceeding at a speed unmatched for 65 million years. This means that human societies
    will have to face up in the coming decades to changes of state in the Earth system
    to which the Homo, which appeared only two and a half million years ago, has never
    experienced, and to which therefore it is biologically adapted nor culturally
    prepared. The Anthropocene opens up a new situation for humanity, a new human
    condition.


    If the climatic stability of the last 10,000 years of the Holocene made possible
    the rise of cultures and civilizations on five continents, the end of this epoch
    and the entry into a new one will not be a smooth and steady'
