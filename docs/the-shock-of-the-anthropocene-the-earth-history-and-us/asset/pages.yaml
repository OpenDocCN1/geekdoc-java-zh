    recent. These two centuries of scientific warnings and continuous

    challenges likewise suggest that the attribution of a name to a new

    ge era is not sufficient to inflect a trajectory of two centuries of

    saults to planet Earth. We need to guard against the scientific illusion

    that ecological awareness and ‘salvation’ can only come from scientists and

    it also from the struggles and initiatives of other citizens of

