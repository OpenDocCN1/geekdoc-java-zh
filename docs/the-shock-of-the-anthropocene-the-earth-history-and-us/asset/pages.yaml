  md: '# CHAPTER 2

    Thinking with Gaia: Towards Environmental Humanities


    The Anthropocene is an event, a point of bifurcation in the history of the Earth,
    life and humans. It overturns our representations of the world. According to the
    philosopher Bruno Latour, it is ‘the most decisive philosophical, religious, anthropological
    and, as we shall see, political concept yet produced as an alternative to the
    very notions of ‘Modern’ and ‘modernity’¹ Continuing the systemic ecology which
    forty years ago framed human activities in an analysis of the functioning of ecosystems
    and the biosphere, the Anthropocene idea abolishes the break between nature and
    culture, from human history and the history of life and Earth.


    From Button to Lyell and Darwin, biology and geology extended terrestrial time
    to hundreds of millions of years, creating a context that was seemingly external,
    almost immobile and indifferent to human tribulations. In parallel with this,
    the bourgeois and industrial Enlightenment emphasized the value of man, the modern
    subject, as autonomous agent acting consciously on his history and settling social
    conflicts by dominating nature. We shall see how this break between nature and
    society was constructed in the nineteenth century, and the part played in it the
    emerging human and social sciences. We shall go on to see how this forceful, violent,
    torrent of the history of the Earth into world history creates a new human condition
    and requires us to reintegrate nature and the Earth system at the heart of our
    understanding of history, our conception of freedom and our practice of democracy.'
