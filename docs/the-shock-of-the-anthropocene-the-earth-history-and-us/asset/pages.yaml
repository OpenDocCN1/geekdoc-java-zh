    century, however, automatic techniques of price inscription and communication
    radically accelerated the flow of financial information (the stock ticker appeared
    at the New York Stock Exchange in 1867). The old procedures of setting prices
    showed monthly variations correlated with harvests, weather, natural catastrophes
    and wars, prices were varied by minute. The result of this major transformation
    was that stock-market quotations constituted continuous temporal sequences that
    seemed to vary in an independent manner, unconnected from anything apart themselves.36
    The globalization of financial information and the establishment of futures markets
    (starting with corn in the 1860s) further disconnected prices from local and natural
    conditions of production, tying them to financial rather than natural causes.


    In the 1890s, econometric tools made it possible to study the systemic relationships
    between different prices. Instead of correlating these with exogenous factors,
    the price system made the economy into a homogeneous object closed on itself.
    ‘External’ causes, whether natural or political, were no more than secondary disturbances
    to the system. The economy became an autonomous object on which scientific action
    was possible.


    On the macroeconomic side, neoclassical tools such as the production function
    proposed by Charles Cobb and Paul Douglas in 1928, and the growth theories of
    Robert Solow, did not allow any place for nature (and its limits), or at best
    viewed it as a production factor that could be substituted for an increase in
    capital or by technological innovation. According to Solow, ‘if it is very easy
    to substitute other factors [e.g., labour or capital] for natural resources, then
    there is, in principle, no ‘problem’. The world can, in effect, get along without
    natural resources.37'
