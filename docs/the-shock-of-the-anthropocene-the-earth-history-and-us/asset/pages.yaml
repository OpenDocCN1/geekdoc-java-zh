    The main strategic advantage of the Allied armies lay in their almost unlimited
    supply of American oil. The new role of aircraft sharply increased demand. US
    Air Force statistics indicate a consumption of aircraft fuel close to 50 billion
    litres, of which 80 per cent was consumed within the United States, underlining
    the major importance of logistics and the military-industrial complex in consumption.55
    The share of oil consumption represented by the US military rose from a pre-war
