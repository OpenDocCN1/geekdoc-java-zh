    Thus it is well established today that the little ice age, the cooling of the
    climate between 1450 and 1800 with a minimum in the period 1640–1730, was not
    simply a natural development experienced by human societies, but the product of
    a reciprocal interaction. If a cyclical reduction in solar activity was one factor,
    human action itself was another: the demographic collapse of the Amerindian population
    by 50 million after 1492 led to an extension of forests and a fall in atmospheric
    CO2, a reduction in the greenhouse effect.


    The work of Earth system scientists on the Anthropocene question has thus challenged
    the externality of the climate in relation to human action even in the pre-industrial
    age. After the epoch of separate histories of nature and of human societies, only
    a shared history can do justice to the reality of the Anthropocene.


