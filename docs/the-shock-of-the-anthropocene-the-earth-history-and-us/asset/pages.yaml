  md: 'colossal industrial, technological and logistic systems, war machines that
    required growing quantities of raw materials and energy and had an unprecedentedly
    heavy impact on the environment.


    Even in peacetime, military-industrial complexes destroy. The Cold War, for example,
    saw a peak in the environmental footprint of armies. By the late 1980s, military
    training camps, often polluted with radioactive waste, munitions, etc., covered
    1 per cent of the Earth''s surface (including 2 per cent of the United States).
    The maintenance and training of Western armed forces consumed enormous quantities
    of resources: 15 per cent of West German air traffic, for example, was linked
    to NATO military exercises. In 1987, the American army was responsible for 3.4
    per cent of the nation''s oil consumption, comparable figures being 3.9 per cent
