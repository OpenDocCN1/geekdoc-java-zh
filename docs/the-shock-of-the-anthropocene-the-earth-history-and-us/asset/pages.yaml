  md: 'of systemization, which lead to conceiving the Earth as a ‘complex system’,
    a great self-regulating cybernetic machine (but one that human excesses could
    cause suddenly to deviate from its trajectory). It is important therefore to understand
    the historical genesis of this view, its contributions and its limitations.


    The view of the Earth as a system lies at the source of modern geology. The term
    was used both by Charles Lyell and James Hutton, predecessor in the formulation
    of the uniformitarian theory. In his Theory of the Earth of 1788, Hutton presented
    the terrestrial system as ‘a machine of a peculiar construction’, with its components,
    mechanical principles and functions. But he goes on right away that the Earth
    can ‘be considered as an organized body’, with ‘a constitution in which the necessary
    decay of the machine is naturally repaired, in the exertion of those productive
    powers by which it had been formed’.25 This tension between machine and organisms
    not only pervades all biological thinking, but also all thinking about the Earth.


    After the Second World War, scientists sought to overcome this tension, to go
    beyond Analytic reductionism while preserving the ambition of control and engineering.
    This gave birth to the concepts of ecosystem and cybernetic machine, games theory
    and complex systems theory (or ‘general system theory’, in the title of the major
    book by the biologist and mathematician Ludwig von Bertalanffy, published in 1968).


    James Lovelock, with his part, drew on this ambivalence between machine and organism
    in his famous ‘Gaia hypothesis’ of 1974. Having participated during the 1960s
    in a NASA project that aimed to identify criteria by which the possible presence
    of life on other planets could be detected, he asked what could explain such long
    habitability of a planet by living beings as found on Earth. Lovelock formulated
    the hypothesis that this habitability was also the product of the action of living
    beings themselves, acting to maintain conditions favourable to life.26 The blue
    algae or ‘cyanobacteria’ that appeared more than 3 billion years ago changed the
    course of the Earth. As the first living creatures to practise photosynthesis,
    they fixed carbon from the atmosphere into sediment in the ocean depths and released
    oxygen into the air, making it possible for the animals that appeared later to
    breathe, and forming the ozone layer that protects the planet from highly mutagen
    ultraviolet radiation. Without the action of algae and plants, the biogeochemical
