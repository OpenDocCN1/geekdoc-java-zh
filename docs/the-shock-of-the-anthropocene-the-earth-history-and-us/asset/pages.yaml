  md: 'The Anthropocene challenges certain distinctions that were formerly deemed
    fundamental to the modern West: human exceptionalism⁴41 and the ontological break
    between the human being as subject of entitlement and the object of nature. Environmental
    ethics therefore undertakes a basic rethinking of the foundations of the different
    moral rules that organize relations between humans and non-humans. A distinction
    is generally made between three major ethical proposals: anthropocentric (sustainably
    managing the Earth for man), biocentric (respecting the intrinsic right to existence
    of being on Earth) and ecocentric (‘thinking Gaia’, in the words of J. Baird Callicot,
    following on from Aldo Leopold). An entire field of philosophy (as well as law
    and science) now explores the question of environmental law, or even the rights
    of nature (already sketched out in the constitution of Ecuador) and the Earth,
    and relations between nature and sovereignty⁴².


    In the same way, the Anthropocene challenges the modern definition of freedom,
    long conceived in opposition to nature. John Stuart Mill rated the freedom and
    autonomy of individuals to the achievement of ‘a high degree of success in their
    struggle with Nature’⁴³ A freedom understood in this way sets human emancipation
    against nature, against the Earth as a whole. This modern conception of freedom
    freely comes up against global limits in a disturbing way. Benjamin Constant,
    argued in 1819 that the situation of the citizens of his time, gathered in great
    national political spaces, could not underpin the same conception of liberty and
    sovereignty as that of the citizens of the democracies of antiquity.


    Dominique Bourg and Kerry Whites have taken this argument to maintain that today,
    in a time of global ecological disruptions of human origin, we need to invent
    a new ideal of emancipation from that of the ‘moderns’⁴⁴ For Constant, liberty
