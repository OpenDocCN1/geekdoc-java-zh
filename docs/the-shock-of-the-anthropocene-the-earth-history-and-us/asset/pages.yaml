  md: 'In the same way, mainstream Marxists, by focusing on the labour theory of value
    and the distribution of the product between two classes, workers and capitalists,
    essentially saw only two factors of production: capital and labour. Whereas Marx
    and Engels were particularly concerned with the metabolic rupture between Earth
    and society that capitalism had produced, and certain Marxists such as Polodinsky
    sought to refound the labour theory on energy, Marxist economic science – until
    the recent emergence of a fruitful eco-Marxism abolished the role of metabolism
    and energy, rejecting as ‘Malthusian’ (and thus conservative) any idea of limits
    to the planet’s resources.38


    The crisis of the 1930s, Keynesianism and the development of systems of national
    accounting completed the dematerialization of the economy. Before the 1930s, the
    idea of growth was bound up with a process of material expansion: opening up new
    resources or new territories. With the overproduction crisis of the 1930s, growth
    was reconceived not in material terms but as the intensification of economic exchange.
    The abandonment of the gold standard in that decade (i.e., the end of the era
    that bank-notes represented gold) was a key turning-point. Keynes, in a famous
    passage of his General Theory, explained that the end of coal could be unimportant;
    what mattered was the correct circulation of money: it would be enough, therefore
    for the British Treasury to bury bank-notes and ask miners to hunt them, in order
    to ensure employment and economic prosperity.39 During decades of economic crisis
    and war, a new object of thinking and government was produced: ‘the economy’ with
    a definite article, understood as the totality of market transactions on a given
    territory.40 As such, and completely dematerialized, the economy could be conceived
    as growing indefinitely, outside any natural determinisms and without coming up
    against physical limits, thanks to the good guardianship of economic experts (at
    the international level, the OECD incarnated this growth imperative for the industrial
    countries).


