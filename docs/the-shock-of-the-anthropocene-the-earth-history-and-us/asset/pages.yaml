    # Resources and finitude


    The question of exhaustion of resources constitutes the sixth and last grammar
    of environmental reflexivity in modern societies. It emerged in the seventeenth
    century in the context of natural theology: What moral meaning to give to the
    ''corruption of nature'' or the limits of natural wealth, to the growing scarcity
    of woodland around English towns, for example? Was it a defiance of providence
    to seek to preserve resources in order to delay the Last Judgment?^58 The famous
