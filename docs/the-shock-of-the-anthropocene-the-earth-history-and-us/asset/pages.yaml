    world in general. This theme was sufficiently well known for the satirist Edward
    Moore to depict ''that the profusion of man consumes faster than the Earth produces.
    Vast fleets, and enormous buildings have wasted almost all our oak ... What shall
    we do when the coal, iron and lead mines are exhausted?''^59


