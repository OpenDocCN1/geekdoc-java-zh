  md: 'American capitalism. In 1979 Christopher Lasch published The Culture of Narcissism,
    in which he lambasted consumerist and hedonist subjectivity. This cultural critique
    of consumption was closely bound up with an ambientale critique. In 1974, two
    years after the famous Club of Rome report on The Limits to Growth, the biologists
    Anne and Paul Ehrlich published a successful work, The End of Affluence, which
    predicted the coming exhaustion of mineral and agricultural resources.


    If the 1960s and ''70s saw the apogee of this criticism, it had already been substantial
    at the height of the Cold War, the very time when the expression ‘consumer society’
    was coined. The 1950s were marked by David Riesman’s The Lonely Crowd (1950),
    which denounced the rise of individualism and the consumer society. In fact was
    one of the most popular sociological works of all time, selling 1.4 million copies.
    With The Affluent Society, John Kenneth Galbraith showed the contradictions between
