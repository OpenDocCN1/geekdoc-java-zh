  md: '# CONCLUSION

    Surviving and Living the Anthropocene


    Thinking the Anthropocene means taking on board the data and models of the Earth
    system sciences that tell us in increasingly certain terms of a disturbance on
    the geological timescale that will radically overturn the conditions of human
    existence (Chapter 1). It means taking the measure of the telluric force of industrialization
    and commodification, which has derailed the Earth beyond the stable parameters
    of the Holocene, and of the need to give our freedom different material foundations;
    it means mobilizing new environmental humanities and new political radicalisms
    (movements of buen vivir, common goods, transition, degrowth, eco-socialism and
    many more) in order to escape the blind alleys of industrial modernity (chapters
    2 and 11).


    Thinking the Anthropocene also means challenging its unifying narrative of the
    errant human species and its redemption by science (chapters 3 and 4). It means
    meticulously listening to scientists and putting their results and conclusions
    into public and democratic discussions, rather than sinking into a geocracy of
    technological and market-based ‘solutions’ to ‘manage’ the entire Earth. The less
    the science of the Anthropocene pretends to stand above the world, the more solid
    and fruitful it will be, and the less deductive concept of the Anthropocene will
    risk serving as a legitimizing philosophy for an oligarchic geopower.


    Thinking the Anthropocene, finally, means abandoning the hope of emerging from
    a temporary ‘environmental crisis’. The irreversible break is'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'behind us, in that brief and exceptional moment of two centuries of industrial
    growth. The Anthropocene is here. It is our new condition. We have therefore to
    learn to survive, that is, to leave the Earth habitable and resilient, limiting
    the frequency of catastrophes and sources of human misery. By surviving is not
    enough. To continue as communities, individuals and citizens, we must all strive
    for change. We have to strive for a decent life for everyone, in a diversity of
    cultures and an equality of rights and conditions, that liberate human and non-human
    alterities, in an infinity of aspirations, a sobriety of consumption and a humility
    of interventions.


    ‘What words must we sow, for the gardens of the world to be fertile again?’ asked
    the poet Jeannanie Salesesse. What histories will we write to learn to inhabit
    the Anthropocene?


    First of all, we must make sense of what has happened to us, producing multiple,
    debatable and polemical narratives rather than a single hegemonic narrative that
    is supposedly opposed. Rather than a universal history of the ‘human species’
    distorting the ‘Earth system’, we have proposed seven historical workshops, seven
    possible narratives. First of all, we have shown the technological contingencies
    (other choices would have been possible) and political dimensions of our new geological
    epoch. The entry into the Anthropocene was intrinsically bound up with capitalism,
    the commercial genesis of the British Empire, which dominated the world in the
    nineteenth century and forced other societies to serve its model or seek to follow
    it. Similarly, the Great Acceleration cannot be understood without the Second
    World War, the Cold War in which two blocs rival one another in the mobilization
    of the globe, and since it emerged victorious without American imperialism (Chapter
    5). The history of capitalist world-economies lies at the heart of the change
    in the Earth’s geological regime (Chapter 10), with their Soviet and Chinese avatars
    being a part of this. Secondary, military apparatuses, and with the logic of power,
    with the unsustainable technological choices subsequently imposed on the civilian
    world, bear a heavy responsibility in the disturbance of local environments and
    the whole Earth system (Chapter 6). Thirdly, the history of the Anthropocene is
    also one of the unfurling of a capitalist world-economy, a world of increasing
    commodification; a history of the genesis of a new system of material needs and
    communist subjectivities that today are globalized (Chapter 7). Finally, it is
    impossible'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'without fundamental self-deception to represent the last 250 years as the progressive
    emergence from an initial unawareness of environmental damage, from a model of
    industrial development at the end of which we are supposedly better equipped with
    the skills for influencing our trajectory (Chapter 8), nor the gradual rise of
    an environmental movement that was initially embryonic and gradually matured (Chapter
    9).


    The contemporary moment is not one of a we awareness, nor one of a moral leap
    leading us towards a better humanity and a nice planet governed by sustainable
    geo-management, nor one of a reconciliation with Gaia. We have not suddenly passed
    from unawareness to awareness, we have not recently emerged from a modernist frenzy
    to enter an age of precaution. One of the determining factors in the history of
    the Anthropocene is that of disinhibitions that normalize the intolerable: public-health
    policies that rejected the environmental medicine of the eighteenth century; the
    technical norm that undermined challenges and formed the ontology of dealing with
    environmental nuisances; the proliferation of objects that constructed the free-floating
    anthropological subject; GDP and the notion of an ‘economy’, which neutralized
    the absurd idea of limitless growth; technoscientific ‘solutions’ that claimed
    at every point to manage nature for a maximal sustainable yield; and many others.


    By envisaging the Anthropocene as a geochemical event, we have avoided the gesture
    of the clean slate, of grandiose and impot narratives about modernity. The multiplicity
    and variety of the processes of disin reminds us that modernity is not this majestic,
    inexorable and spiritual movement that philosophers speak of. On the contrary,
    it can be conceived as a series of successive calls, of imposed situations, of
    normalized exceptions. Rather than incrementating certain familiar monstres sacrés
    that are too enormous to be infected (the biological gift of intelligence to make
    Homo sapiens poorly used; demographic fate; the Judeo-Christian stance of domination
    of nature; blind ‘modernity’, separating and dominating), we should rather learn
    from the various tactics and mechanisms of disinhibition that have made possible
    for two and a half centuries to ignore successive environmental knowled and warnings,
    and defeat those challenges and alternatives that opposed themselves to industrial
    and consumerist action.


    The history we have proposed may seem depressing, i.e., that our ancestors destabilized
    the Earth and its ecosystems despite knowing what'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'they were doing. Since there was not a transition from unawareness to awareness,
    since the present financialized capitalism has its own new forms of disinhibition,
    everything leads us to fear that things will continue as they have up until now.


    But to abandon the official narrative of an awakening permits a more lucid and
    fruitful dialogue with the warnings of the Earth system scientists. We also have
    in several histories of the Anthropocene that invite us to conceive those metabolisms
    of energy and matter commanded by those mechanisms – of production, exchange and
    consumption – that were invented and imposed by quite particular groups, imaginaries
    and institutions, and in specific circumstances. These histories invite us to
    take a political grip on the institutions and oligarchies, the powerful symbolic
    and material systems, that led us into the Anthropocene: military apparatuses,
    the system of consumerist desire and its infrastructure, the gaps of income and
    wealth, the energy majors and the financial interests of globalization, the technoscientific
    apparatuses when these work in commodity logics or silence criticisms and alternatives.


    To strive for decent lives in the Anthropocene therefore means freeing ourselves
    from repressive institutions, from alienating dominations and imaginaries. It
    can be an extraordinary emancipatory experience.


    > 1 Many other historical narratives remain to be written, in particular a global
    and nonteleological history of technology, which the Anthropocene calls us to
    rethink (see: David Edgerton, The Shock of the Old: Technology in Global History
    since 1900, Oxford: Oxford University Press, 2011), or again accounts of the Anthropocene
    starting from the experience of its subalterns and victims.'
