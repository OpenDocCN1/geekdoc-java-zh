    oppositions and the intensity of environmental reflexivity through time, the

    major historical problem seems to be that of explaining the emergence

    of a new ‘environmental awareness’, but rather to understand how these

    struggles and warnings could have been kept by many industrialist

    ‘progressive’ elites, before being largely forgotten (a second death

    inwhich the human and social sciences participated), so that it can be claimed

