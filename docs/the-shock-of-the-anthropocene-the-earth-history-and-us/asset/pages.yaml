  md: '# Rethinking the environmental crisis: an end to ‘sustainable development’


    By offering a reading of the ecological impacts of our model of development over
    two and a half centuries and on a planetary scale, the concept of the Anthropocene
    profoundly shifts our understanding of the contemporary ‘ecological crisis’.


    A few decades ago, the ‘environment’ was still understood as that which surrounds
    us, the place where humans wanted to extract resources, deposit waste, or even
    in certain places was to be left virgin. Economists spoke of environmental degradations
    as ‘externalities’. In the forms of natural parks, ecosystems and environment,
    subsequently that of ‘sustainable development’, nature was recognized until relatively
    recently as essential but separate from us. It hardly seemed to present a serious
    limit to growth, a watchdog intoned in chorus by business leaders, orthodox economists
    and policy-makers.


    The concept of Anthropocene challenges this separation and the promise to perpetuate
    our economic system by modifying it at the margin. In place of ‘environment’,
    there is now the Earth system. While triumphant industrial modernity had promised
    to prise us away from nature, its cycles and its limits, placing us in a world
    of boundless progress, the Earth and its limits are today making a comeback. We
    are facing ‘the intrusion of Gaia’, in the words of Isabelle Stengers – Gaia being
    the Greek². The global and profound geochemical processes that we have disturbed
    are forcing their way into the centre of the political stage and of our everyday
    lives. Instead of ‘masters and possessors of nature’, we find ourselves each day
    a bit more entangled in the immense feedback loops of the Earth system. There
    can be no more talk of a linear and inexorable progress that used to silence those
    who challenge the market-based, industrial and consumerist order by accusing them
    of seeking to return us to a bygone age; from now on, the future of the Earth
    and all its creatures is at stake. And this uncertain becoming, strewn with tipping
    points, promised by the ideologists’ progress of the last two centuries, whether
    liberal, social democratic or Marxist.


    As for the word ‘crisis’, does it not maintain a deceptive optimism? It leads
    us to believe, in fact, that we are simply faced with a perilous turning'
