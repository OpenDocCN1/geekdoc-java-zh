    # Autarchic technologies


    Along with the invention of brutal technologies for killing people and, by extension,
    life forms in general, we have also to examine a set of more complex historical
    phenomena that indirectly link war and the Anthropocene. For example, the imperative
    of supplying a war economy leads to the duplication of productive infrastructure
    and finally the build-up of excess industrial capacity in many fields. Or again,
    industrial mobilization, war emergency, blockades and the imperative to substitute
    imports play a role in the establishment of autarchic productive systems that
    are particularly polluting and devouring energy.


    The first major industrial chemical system based on the Leblanc process for synthesizing
    soda, using sulphuric acid and sea salt, appeared during the Napoleonic Wars:
    in 1808-09, deprived of natural soda that had been imported from Spain (the ash
    of marine plants, indispensable to the textile, soapmaking and glass industries),
    French chemists succeeded in synthesizing this ‘artificial soda’. The process
    was likely the most polluting industry of its time: the production of two tonnes
    of soda emitted one tonne of hydrochloric vapour, which corroded everything in
    its vicinity and particularly destroyed crops and trees.


    Besides its environmental effects, the historical consequences of this artificial
    soda were very important, as it was to protect these extraordinarily polluting
    chemical works, often owned by industrialists close to ruling circles (Jean-Antoine
    Chaptal above all, who was at the same time chemist, industrial and interior minister)
