    the planet with major geopolitical disturbances. The double reality that the Anthropocene
    presents is, on the one hand, the Earth has seen other epochs in the last 4.5
    billion years, and life will continue in one form or with without humans. But
    the new states that we are launching the Earth into will bring with them a disorder,
    penury and violence that will render it less habitable by humans. Even if the
    human species manages to reduce its ecological footprint drastically and invent
    a more sober civilization, we will not have settled accounts with Gaia. The Earth
    would take least centuries if not hundreds of thousands of years to get back to
    the climatic and geological regime of the Holocene. The traces of our urban, industrial,
    consumerist, chemical and nuclear age will remain for thousands or even millions
    of years in the geological archives of the planet.


    The new sciences of the Earth system also give us a non-linear view of the past
    and future of our planet. We are no longer in a reassuring model where x hectares
