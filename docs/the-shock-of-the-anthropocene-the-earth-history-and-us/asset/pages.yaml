- img_proc: true
  md: 'to coal, then coal to oil, then from oil to nuclear. The history of energy
    is not one of transitions, but rather of successive additions of new sources of
    primary energy. The erroneous perspective follows from a confusion between relative
    and absolute, local and global. If, in the twentieth century, the use of coal
    decreased in relation to oil, it remains that its consumption continuously grew;
    and on a global level, there was never a year in which so much coal was burned
    as in 2014.


    Energy history must therefore free itself from all of the concept of transition.
    This was promoted in the space of politics, media and news science precisely so
    as to spirit away worries bound up with the ‘energy crisis’, an expression that
    was then dominant. Between 1975 and 1980, the term ‘energy transition’ was invented
    by think-tanks and popularized by powerful institutions: the US Department of
    Energy, the Swedish Secretariat for Futures Studies, the Trilateral Commission,
    the European Community and various industrial lobbies. In most cases, this talk
    of ‘transition’ served to indicate an indispensable recourse to so-called ‘alternative’
    fuels: nuclear in particular,⁵ also gas and shale oil, coal and synthetic fuel.


    To say ‘transition’ rather than ‘crisis’ made the future less generative of anxiety,
    by attaching it to a planning and managerial rationality.⁷ The further success
    of the notion of transition, as understood particularly in ecological milieux
    (the ‘solar transition’ of the 1980s), also drew on a conception of technology
    developing in grad radical shifts.


    On the one hand, however, the notion of transition obscures the persistence of
    old systems, while on the other hand overestimates technological determinants
    to the detriment of economic arbitrage. For example, world coal consumption grew
    from 7.3 to 8.5 billion tonnes between 2008 and 2012.⁸ If China made the greater
    part of this growth (3.0 to 4.1 billion), there are sectors in Europe could experience
    a ‘return’ to coal. For instance, because of the development of shale gas in the
    United States, the price of US coal fell so much that it was profitable to substitute
    it for Russian gas. In Britain, the proportion of electricity produced from coal
    grew from 30 to 42 per between 2011 and 2012; in France, the consumption of coal
    for electricity generation lept by 79 per cent.⁹ In this sense, coal is not an
    ‘older’ energy than oil, but looks more likely to be its successor.'
