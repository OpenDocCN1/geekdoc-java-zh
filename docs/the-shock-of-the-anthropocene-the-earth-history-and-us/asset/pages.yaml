  md: '# A history of additions


    In what way does the history of the Thermocene that we are aiming at differ from
    energy history as currently practised?


    Because of the climate crisis, energy history is experiencing a revival of interest.
    According to certain historians, examination of the ''energy transitions'' of
    the past makes it possible to elucidate the conditions that will permit the advent
    of a renewable energy system.2 Energy history also questions the focus of the
    present debate on production. In past transitions, in fact, demand was the determinant
    factor: the automobile created the oil industry, the filament lamp created electric
    power stations, and not the other way round. Energy history also argues for a
    long-term public support for renewable energies: the first entrepreneurs to adopt
    a new source of energy played a crucial role in developing engines and improving
    their performance, and this incremental process could only take place in a niche
    situation. For example, the first steam engines in England had such poor performance
    that they were only viable at the mouth of coal mines. Finally, this history questions
    the pertinence of the present objectives of energy efficiency. On the one hand,
    in relation to the tendency measured before 1880, they do not seem particularly
    ambitious;3 on the other hand, energy history confirms William Stanley Jons''s
    great discovery about steam engines: by becoming more economic with coal, machines
    became more profitable, their use spread and the national consumption of coal
    increased. Historians have thus observed rebound effects in several sectors. In
    Great Britain, for example, between 1800 and 2000, the price of light (measured
    in lumens) fell by a factor of 3,000, but consumption increased 40,000 times.4
    According to goods and their price elasticity, the rebound varies, but on the
    whole, energy efficiency has been more than outbalanced by economic growth.


    Despite these practical results, energy history with a managerial approach is
    actually based on a serious misunderstanding: what studies under the name of ''energy
    transition'' actually corresponds to the very opposite of the process that needs
    to be fostered today in the context of the climate crisis and peak oil.


    The bad news is that, if energy transition. There was not a movement from wood'
  merge: -1
