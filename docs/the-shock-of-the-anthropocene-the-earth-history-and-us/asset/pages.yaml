  md: 'Take for example Buffon’s Epochs of Nature (1778). This magnificent text, culminating
    point of modern rhetoric, presents the historical conditions for a reversal. The
    seventh and final epoch of the planet’s history corresponds to the advent of man
    as global force: ‘the entire face of the Earth today bears the imprint of human
    power’, Buffon tells us. Humanity has transformed plants and animals, brought
    new breeds into being, acclimatized and improved. For Buffon, this role is completely
    positive: Europe’s ‘civilized nature’ is more productive than the ‘raw’ and hostile
    nature left abandoned by ‘the savage little nations of America’. But if human
    work is not guided by science, if people short-sightedly, the consequences may
    be disastrous:


    The most contentious condition of the human species is not that of the savage,
    but of those nations, a quarter divided, that have always been the real plagues
    of nature ... They ravaged the land ... these nations weigh on the globe without
    relieving the land, starve without making it fertile, destroy without building,
    use everything without renewing anything¹


    Buffon’s utopian was a climatic: united by a universal peace, humanity would rationally
    transform the planet. By foresting and deforesting judiciously, it would be able
    tomodify the influences of the climate it inhabits and set the temperature, so
    to speak, to the point that suits it’⁵


