    in economic growth. The world economy would have fragmented into autarchy trading
    blocks, similar to what happened in the wake of the 1929 economic crisis.76


    # The unequal-ecology of the Great Acceleration


    After two world wars and a great depression, the world entered a period of historically
    exceptional growth after 1945, marking the ‘Great Acceleration’ of the Anthropocene.
    Whereas in the first half of the twentieth century, an annual increase of 1.7
    per cent in the use of fossil fuel was required for an economic growth rate of
    2.13 per cent, between 1945 and 1973 an annual increase of 4.48 per cent in fossil
    fuels (not mention uranium) corresponded to an economic growth rate of 4.18 per
    cent. Between 1950 and 1970, the world population grew by 46 per cent, GDP by
    2.6 times, the consumption of minerals and mining products for industry by 3.08
    times, and that of construction materials 2.94 times.77 By substituting mineral
    resources for biomass in construction, petroleum products for animal energy and
    fertilization in agriculture, and synthetic products for vegetable dyes and agriculture
    fibres for clothing, it was only the consumption of biomass that grew more slowly
    than economic growth, a sign of the globalization of a switch from an organic
    economy to a fossil'
