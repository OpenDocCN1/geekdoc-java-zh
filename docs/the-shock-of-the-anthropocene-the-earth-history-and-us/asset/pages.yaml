  md: '# CHAPTER 7


    # # Phagocene: Consuming the Planet


    Human identity is no longer defined by what one does, but by what one owns. But
    we''ve discovered that owning things and consuming things does not satisfy our
    longing for meaning. We''ve learned that piling up material goods cannot fill
    the emptiness of lives which have no confidence or purpose.


    Jimmy Carter


    On 15 July 1979, before a TV audience of 65 million, Jimmy Carter delivered a
    major anti-consumerist speech. If its immediate context was the second oil shock,
    its key idea was that the energy crisis could not be combated without a profound
    change in values. Americans were summoned to renounce consumerism and individualism,
    in a ''rebirth of the American spirit''.


    If Carter''s defeat by Ronald Reagan in 1980, who called for a restoration of
    US hegemony and the deregulation of polluting activities, showed the limits of
    this appeal, his speech does illustrate the influence, since unequal, that criticism
    of the consumer society had acquired in the public sphere. During the 1960s and
    ''70s, the themes of ''commodity fetishism'' and ''cultural alienation'' dear
    to the Frankfurt School invaded the periodical press. Herbert Marcuse''s *One-Dimensional
    Man* (1964), Jean Baudrillard''s *The System of Objects* (1968), Guy Debord''s
    *Society of the Spectacle* (1967) and Marshall Sahlins'' *Stone Age Economics*
    (1974) were all bestsellers. Daniel Bell, the theorist of post-industrial society,
    explained in *The Cultural Contradictions of Capitalism* (1976) how the consumer
    society undermined Protestant work ethic that had been the bedrock of'
  merge: -1
