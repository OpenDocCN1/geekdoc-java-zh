    # The economy of nature


    Historians of scientific ecology have identified the concept of ‘economy of nature’
    as the starting point of the contemporary notion of ecosystems and shown its centrality
    in the natural philosophy of the eighteenth and nineteenth centuries.¹18 This
    concept constitutes a third grammar of reflexivity in the face of environmental
    destruction.


    From Carl Linnaeus to Thoreau, naturalists marvelled at the systemic relations
    among living things. One of the aims was to discover interdependencies and thus
    the symphonic precision of nature. The natural theology that underlay this research
    rested on the religious conviction that every living thing has a function in the
    natural order. In Linnaeus’s words:


    If even a single [species] of earthworm were missing, stagnant water would damage
    the soil and the moisture would rot everything. If a single important function
    were lacking in the animal world, we could fear for a very great disaster in the
    universe. If all the sparrows perished in our lands, our crops would fall prey
    to crickets and other insects.¹19'
