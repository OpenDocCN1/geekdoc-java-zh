  md: '# CHAPTER 5


    # Thermocene: A Political History of CO₂


    We are all familiar with the curve that is the very emblem of the Anthropocene,
    tracing the exponential growth of carbon dioxide emissions over the nineteenth
    and twentieth centuries. But no matter how famous this is, the curious fact is
    that we lack any history of it – a history sufficiently precise, for example,
    to distinguish the share of responsibility of different technological choices
    for the climate crisis: Have cars emitted more or less CO₂ how many times more
    CO₂ does road freight represent compared with rail and river freight?


    Or again, what are the main institutions that we have set us on the road to climate
    cataclysm? What are the great historical processes (imperialism, wars and war
    preparations, economic globalization, automobiles, Fordism, suburbanization, etc.)
    that are most important in relation to this curve? These questions remain unanswered
    and constitute the object of what we propose to call the ‘history of the Thermocene’.¹


    Political reflection and public debate suffer from this lack of history. For want
    of precise knowledge, the spontaneous narratives of the environmental crisis are
    lost in unfocused criticisms, incriminating capitalism in general, or worse still,
    modernity. As for the anthropocologists, we have seen their tendency to propose
    infra-political narratives that emphasize demography or economic growth.'
