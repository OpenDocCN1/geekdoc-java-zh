  md: 'Anthropocene presents an abstract humanity uniformly involved – and, it implies,
    uniformly to blame.


    But viewing an undifferentiated anthro as the cause of the Earth’s new geological
    regime is scarcely sufficient. This explanation might be sufficient for polar
    bears or orangutans to understand what species was disturbing their habitat. And
    again, this would be orangutans and polar bears without competence in ‘humanology’,
    unable to discern the ‘dominant males’ and asymmetries of power in the complex
    causal chain connecting the retreat of their habitat to human action. The human
    species’ geological action is the product of cultural, social and historical processes.


    The findings and approaches of decades of social sciences and humanities should
    not be overlooked in the name of ecological emergency and the interweaving of
    ‘socio-ecosystems’. From the Marxist concept of class to the anthropology of Claude
    Lévi-Strauss, feminist and post-colonial studies, these works have attacked the
    old universalism of ‘Man’ and emphasized the equal dignity but also diversity
    of cultures, social classes and sexual identities. They have worked to make visible
    the mechanisms of domination by which certain of these collectives are destroyed,
    exploited or subjugated by others in asymmetrical social relations.


    The advent of the Anthropocene turns the human and social sciences upside down,
    shaking their paradigms and categories. Now it is the sciences of the Earth system,
    and no longer historians, who name the epoch in which we are living. And, as dizzying
    as it may seem, scholars in the humanities need to rethink human action also on
    a geological scale of tens of thousands of years.


    This dizziness has disarmed major thinkers in the human and social sciences, who,
    in their desire to contribute to the official narrative of the Anthropocene, have
    endorsed an all-inclusive view of humanity in which great socially indifferent
    causal factors such as demography, economic growth and the mobilization of fossil
    fuels are put forward as responsible for the unprecedented increase in the human
    footprint on the planet. In the end, these yield a rather poor explanatory grid.
    Thus, in an article of 2009 that drew great attention, Dipesh Chakraborty, formerly
    a Marxist historian and a leading figure in subaltern studies, explained that
    the main critical categories he had previously applied to understand history had'
