    The warning given by the Anthropocene concept, and the recent advances in the
    sciences of the Earth system, thus go much further than an anthropocentric view
    of the ‘environmental crisis’, no matter how alarming. The problem is not only
    that our environment is being degraded, nor that ‘resources’ (another category
