  md: '# CHAPTER 6


    # Thanatocene: Power\and Ecocide


    As the twentieth century progressed, wars became both deadlier and more frequent.1
    The First World War killed more than all the wars of the nineteenth century had
    together, while the Second World War alone made up half the number of dead in
    the past 2,000 years of warfare.2 Advances in productivity and destructiveness
    went in hand: the cost of destruction steadily decreased throughout the nineteenth
    and twentieth centuries. In relation to its destructive power, military technology
    has never been so cheap. Besides, from the eighteenth century on, West European
    states considerably expanded their tax-raising powers. Historians estimate that
    Great Britain, particularly precocious in this field, already mobilized 20 per
    of its GDP for war-making in 1800.


    War has thus become more affordable, for rich states. Statistical analysis of
    was shows that in the twentieth century the richest countries have tended to be
    at more often than the poorest: the top third of countries in terms of wealth
    have been responsible for half the wars of the twentieth century. Before 1914,
    on the other hand, the richest countries tended to be less frequently involved
    in armed conflicts. The United States, for example, was involved in 9.3 per of
    all wars between 1870 and 1945, and 11.2 per cent in those since then.3


    In the twentieth century, moreover, the rich states waged wars of a totally different
    kind from any in the past. Their troops were supported, and to a certain degree
    replaced, by extraordinarily powerful machines fed by'
  merge: -1
