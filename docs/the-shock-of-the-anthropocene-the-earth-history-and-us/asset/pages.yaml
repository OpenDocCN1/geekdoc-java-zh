    nature created the conditions for superseding it. From the 1770s, European societies
    underwent a great debate on the climatic consequences of deforestation. Meteorologists
    referred to the works of Stephen Hales on the physiology of plants and their gaseous
    exchanges with the atmosphere (Vegetable Statics, 1727) to blame climatic disturbances
