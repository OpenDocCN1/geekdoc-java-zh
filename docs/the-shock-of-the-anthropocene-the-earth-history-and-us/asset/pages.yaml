    the oil shock of 1973, but it continued until the 1990s for the countries exporting
    mining products or renewable raw materials.92 Economic growth and the social model
    of the Western industrial countries would have been impossible without this unequal
    exchange. Economists have recently shown that twothirds of the growth of the Western
    industrial countries has been due simply to an increasing use of fossil fuel,
    with only one-resulting from sociotechnical progress.93 The incomes of states
    and their ability to finance investment and social redistribution were also based
