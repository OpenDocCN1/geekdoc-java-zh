    # Brutalizing nature


    Generalizing somewhat, we could hypothesize that war, by creating a state of exception,
    has justified and encouraged a ‘brutalizing’ of relations between society and
    environment.24 If nuclear weapons are the most palpable example of this, the ‘scorched
    earth’ policy of modern war should also be studied as both ideology and practice.
    In 1940, British MPs pressed Kingsley Wood, the air minister, to destroy the Black
    Forest by incendiary bombs. And it was likewise in terms of biotopes that Churchill
    explained the meaning of the total war he was waging: ‘to make Germany a desert’.25
    It is a revealing fact that the most severe punishment envisioned for Germany
    was an environmental one: Henry Morgenthau, the US Treasury secretary, proposed
    to convert Germany into a country ‘primarily agricultural and pastoral in character’


    Besides the immediate theatre of operations, war preparations and the organic
    link between the military, R&D and technological choices have played a fundamental
    role in the arrival of the Anthropocene.


    Certain connections are so self-evident that they have scarcely been studied till
    now. By learning to kill humans in an efficient fashion, the military have also
    learned to kill living things in general.


