  md: '# CHAPTER 8

    Phronocene: Grammars of Environmental Reflexivity


    The great advantage of the concept of Anthropocene is that it abolishes the futile
    distinction between modernity and reflexive modernity, forcing us to consider
    the contemporary situation from a historical standpoint, less as a threshold in
    the acquiring of environmental awareness than as the culminating point of a history
    of destructions.


    The problem with the narrative of ecological awakening, according to our generation
    is the first to recognize ecological disturbance and question industrial modernity,
    by that obliterating the reflexivity of past societies depoliticizes the long
    history of the Anthropocene.


    In their defence, the scientists, philosophers and sociologists who proclaim this
    narrative have hardly been helped by historians. If it is a cliché to say that
    history is written by the victors, then to say that economic or technological
    history is written from the standpoint of the modernizers as a euphemism. For
    a long time, historians in general showed little interest at all environmental
