  md: '# Reintegrating nature into history


    From the time of Michelet and Jacob Burkhardt, history has been above all the
    history of ‘human affairs’, those men making history. It could scarcely interact
    with the history of nature, the timescales being quite different. After the Second
    World War, historians following Fernand Braudel³⁶ distinguished three temporalities:
    that of nature and climate, almost immobile and not affected by human action;
    the slow temporality of economic and social facts; and finally, the rapid temporality
    of events, vibrating to the rhythm of battles, diplomacy and political life. This
    separation of domains and time frames between nature and society, the legacy of
    industrial modernity, had profound consequences for the writing of history. Many
    historians have related the history of scientific and technological mastery of
    nature. But until the emergence of environmental history, particularly in the
    United States in the late 1960s, it was rare for historians to ‘think like a mountain’,
    in the expression of Aldo Leopold, i.e., to narrate history from the point of
    view of animals, ecosystems and other non-human entities. And until the 1960s,
    few historians addressed the alterations of the environment caused by human action
    and the effects these in turn had on societies.


    Rather than an environmental history as had developed in the United States, what
    we had in France first of all was a ‘history of the environment’, a new object
    for history as defined by the Annales School. The quest for scientific authenticity,
    taken over from historical climatology, and the view of nature as an environment
    external to society, led Emmanuel Roy Ladurie to concern himself climatic history
    as a ‘history without men’. This was the basis out of which environmental history
    partially infringed upon France, its protagonists, unlike their American counterparts,
    maintaining a cordon sanitaire against the ecological mobilizations of the 1970s.³⁷


    As an exact opposite of this objectivist history of an environment ‘without men’,
    other French historians developed a cultural history concerned environmental representations
    and sensibilities. Alongside that of scholarly working on the feeling for nature
    or the representations of landscapes, Alain Corbin’s Le Miasme et la jonquille,
