    The Great Acceleration thus corresponds to a capture by the Western industrial
    countries of the ecological surpluses of the Third World. It then appears as the
    construction of an ecological gap between national economies that generated a
    great deal of wealth without subjecting their own territories to excessive impacts,
    and the countries of the rest of the world whose economies were burdened by a
    heavy footprint on their territory. Figure 15 gives a striking representation
    of this.^95


    ![](img/1024a2cf3e24a4ea286b3154ebc27f85_230_0.png)


    Figure 15: Creditor and debtor countries in terms of ecological footprint in 1973


    This map illustrates the unequal relations of ecological credit and debt that
    set in the Great Acceleration. A team from the University of California at Berkeley
    has measured the unequal ecological footprints of nations and the regions that
    these footprints especially burdened. It showed that the poorest countries have
    a small footprint, with very little effect on the spaces of the rich countries,
    whereas the rich countries have a large footprint with a heavy burden on the spaces
    of the poorest countries.^96 For one dollar of GDP today, Mali and Bolivia, for
    example, have to extract twenty times more material from their territory than
    does the United States, and India and China ten times more.^97'
