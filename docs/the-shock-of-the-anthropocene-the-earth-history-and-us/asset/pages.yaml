  md: '# CHAPTER 4


    # Who Is the Anthropos?


    The official grand narrative of the Anthropocene presents not only a unique view
    of Earth, of which we should all have the same representation, ‘from nowhere’,
    but also a humanity seen as biological entity and geological agent. The grand
    narrative of the Anthropocene becomes that of ‘the evolution of humans ... from
    hunter-gatherers to a global geophysical force’.¹ Anthropologists then present
    themselves as guides for a ‘humanity’ deficient in knowledge, recommending it
    to ‘reconnect with the biosphere’.² Let us decipher this view of anthropos and
    the implications it holds.


    The odyssey of the species


    Humankind, our one species, has become so large and active that it now rivals
    some of the great forces of Nature in its impact on the functioning of the Earth
    system.³ This is the unchallengeable heart of the Anthropocene thesis. It supports
    the idea of a totalization of the entirety of human actions into a single ‘human
    activity’ generating a single ‘human footprint’ on the Earth, an idea that deserves
    discussion. The key article on the Anthropocene and its history in Philosophical
    Transactions counts less than ninety-nine occurrences of the adjective ‘human’
    or the noun ‘humanity’.⁴ The anthropocenologists’ dominant narrative of the'
