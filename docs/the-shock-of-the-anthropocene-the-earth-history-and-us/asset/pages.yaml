    changing in this third stage. In the first decade of the new century, China overtook
    the United States as the world''s largest emitter of carbon dioxide, while India
    took third place from Russia, South Korea caught up with the United Kingdom, and
    both Indonesia and Brazil overtook Germany. The countries of the OECD, which in
    1971 emitted 67 per cent of carbon dioxide, made only 42 per cent of the total
    in 2009.¹⁶ The globalization of the development model born in the West is now
    making the upper social strata of the countries of the South into major contributors
    to human telluric action.


    The story that anthropocologists tell in these three phases presents a co-evolution
    of human species and the Earth system over the last centuries. Environmental history,
    which has long been mainly focused on particular territories or objects (fire,
    urban pollution, forests, pesticides),¹⁷ thus advances to a global outlook, at
    the crossroads of recent advances in world history and the sciences of the Earth
    system.


