  md: 'What view of nature underlies these new mechanisms for governing the biosphere
    and atmosphere? First, that the best way of conserving the planetary environment
    is to set a price on it, to serve as a signal and enable the market, deemed cognitively
    superior to public action, to internalize the value of nature. Second and particularly,
    since Garrett Hardin’s famous article ‘The Tragedy of the Commons’, some believe
    that only private property makes possible the proper management of nature, and
    the ideal for certain economists is thus to ‘securitize the biosphere’,52 i.e.,
    attribute property rights to all the different elements and ecological functions
    of the Earth system. With nature assimilated to a ‘natural capital’, it becomes
    fungible with finance capital. All ‘services’ rendered by the Earth system (carbon
    capture, pollination, water purification, aesthetic or religious services, etc.)
    can be valued in dollars and make the object of environmental service markets,
    rewarding the proprietors of the corresponding spaces who would then maintain
    them as good managers. The old distinction between (natural) wealth and (social)
    value gives way to a fetishism of nature as ‘the biggest business in the world’
    (in the expression popularized by the International Union for Conservation of
    Nature in 2009), as itself the producer of an economic value, already existing
    independent of any human labour or relation of production.53


    In this perspective, there is no longer a limit to growth: the preservation of
    the environment, the environmental crisis and the scarcity of resources are actually
    presented as economic opportunities. As the firm Advanced Conservation Strategies
    prophesies, ‘We enter a new era of scarcity, environmental markets are exploding.
    This includes not only carbon, but emerging water and biodiversity markets.’54
    In 1997, the scientific Nature published a preliminary calculation of the monetary
    value of services rendered annually by nature on the planetary level, estimated
    between $16 trillion and $54 trillion dollars, the order of magnitude as global
    GDP. The annual loss of biodiversity was estimated at $4,400 billion, and the
    same Advanced Conservation Strategies has no hesitation in promising that ‘by
    2030, carbon will be the most important commodity exchanged in the world, with
    a market value of $1,600 to $2,400 billion, or the equivalent of the present value
    of the oil market’.


    At the start of the nineteenth century, industrial modernity constructed the idea
    of nature as stock, external to the economy and constituting an inexhaustible
    storehouse. By the late twentieth century, a new phase of'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'capitalism – financial, postmodern, flexible and network-based – came and challenged
    this industrial-modern ontology of nature. In the new spirit of late capitalism,
    the issue of valuing diversity replaces the older issue of reducing diversity
    to standardize production; flows now matter as much as stocks, services as much
    as material production, relationships as much as entities. The film Avatar, counterpointing
    the extractivist view of nature as resources (in the shape of a capitalist firm
    hunting for mineral ore) to the ‘connected’ turn of Western representations of
    nature. In our late modernity, the ‘invisibilizing’ of the limits of Earth is
    no longer just a result of an externalization (as a great outside that humans
    can draw from and jettison without problem), but on the contrary of a radical
    internalization. This internalization is expressed in the efforts to measure ecosystem
    in terms of financial flows, making a nature that is liquid and capitalizable
    even in its most intimate processes. Internalization into the market is backed
    by the ontological dissolution of nature by constructivist philosophies that deny
    its alterity in relation to humans, and by the geo-constructivist engineering
    project of all aspects of the Earth system, from the genome to the biosphere.¹⁵⁵


    We could also remark that the break from the early nineteenth century to the early
    twenty-first century is not total. The mode of regulating environments by compensation
    (the ‘polluter pays’ principle) was in fact born in the nineteenth century, and
    experience shows that it did not prevent pollution but, on the contrary, historically
    accompanied and legitimized the degradation of environments. Such regulation possesses
    an intrinsic logic whose consequences were widely visible already in the 1820s.
    The principle of compensation for damage, combined with the imperative of economic
    profitability, produces three results: the employment for the most dangerous tasks
    of the weakest sections of the population, whose illnesses can remain socially
    invisible; the concentration of production and pollution in a few localities;
    and the choice, for these localities, of poor territories lacking in social and
    political resources, thus minimizing the value of environmental compensation.⁵⁶
    We cannot fail to note the contemporary persistence of this logic, and even its
    most likely accentuation made by economic globalization. We can also observe that
    these new markets for nature encourage the illusion that the human presence in
    the world has been brought under control.'
