    # Mobilizing the world


    War, by disturbing or interrupting trade relations, forces states and businesses
    to explore new supply solutions. If autarchic technologies are the response of
    the dominated, the hegemonic powers — Great Britain and the US — preferred a geographical
    expansion of the material base of their economy. Historically, wars have contributed
    to the discovery of new sources of strategic materials and thus to integrating
    new spaces into the industrial exploitation of nature.


