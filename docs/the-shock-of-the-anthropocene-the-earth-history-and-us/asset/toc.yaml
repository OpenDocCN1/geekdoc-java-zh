  - 以燃气照明为例，19世纪20年代和30年代反对者提出的问题，不仅强调了位于密集区的煤气厂爆炸的危险，还强调了煤炭制气过程的不健康本质，以及在有限煤炭资源下其产率低下。我们顺便应该注意，历史通常证实了这些反对者的恐惧：煤气罐经常爆炸，煤炭蒸馏的副产物具有高度致癌性，导致土壤长期的污染。24
