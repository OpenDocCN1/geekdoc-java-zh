    }\n```\n### OUTPUT\n```\n  ######\n  ##\n#\n#\n#\n#\n#\n  ##\n  ######\n```\n\n\
    # Compute the perimeter and area of a rectangle\n### C CODE\n```c\n#include <stdio.h>\n\
    /* height and width of a rectangle in inches */\nint width;\nint height;\nint\
    \ area;\nint perimeter;\nint main() {\n    height = 7;\n    width = 5;\n    perimeter\
    \ = 2*(height + width);\n    printf(\"Perimeter of the rectangle = %d inches\\\
    n\", perimeter);\n    area = height * width;\n    printf(\"Area of the rectangle\
    \ = %d square inches\\n\", area);\n    return(0);\n}\n```\n### OUTPUT\n```\nPerimeter\
    \ of the rectangle = 24 inches\nArea of the rectangle = 35 square inches\n```\n\
    \n# C programming: Area and circumference of a circle\n### C CODE\n```c\n#include\
    \ <stdio.h>\nint main() {\n    int radius;\n    float area, perimeter;\n    radius\
    \ = 6;\n    perimeter = 2*3.14*radius;\n    printf(\"Perimeter of the Circle =\
    \ %f inches\\n\", perimeter);\n    area = 3.14*radius*radius;\n    printf(\"Area\
    \ of the Circle = %f square inches\\n\", area);\n    return(0);\n}\n```\n### OUTPUT\n\
    ```\nPerimeter of the Circle = 37.680000 inches\nArea of the Circle = 113.040001\
    \ square inches\n```\n\n# Display multiple variables\nC program to display following\
    \ variables:\n`a+ c`, `x + c`, `dx + x`, `((int) dx) + ax`, `a + x`, `s + b`,\
