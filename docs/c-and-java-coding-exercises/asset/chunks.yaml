    \ b = 12345;`\n`long ax = 1234567890;`\n`short s = 4043;`\n`float x = 2.13459;`\n\
    `double dx = 1.1415927;`\n`char c = 'W';`\n`unsigned long ux = 2541567890;`\n\n\
    ### C CODE\n```c\n#include <stdio.h>\nint main()\n{\n    int a = 125, b = 12345;\n\
    \    long ax = 1234567890;\n    short s = 4043;\n    float x = 2.13459;\n    double\
    \ dx = 1.1415927;\n    char c = 'W';\n    unsigned long ux = 2541567890;\n   \
    \ printf(\"a + c = %d\\n\", a + c);\n    printf(\"x + c = %f\\n\", x + c);\n \
    \   printf(\"dx + x = %f\\n\", dx + x);\n    printf(\"int dx + ax = %ld\\n\",\
    \ (int) dx + ax);\n    printf(\"a + x = %f\\n\", a + x);\n    printf(\"s + b =\
    \ %d\\n\", s + b);\n    printf(\"ax + b = %ld\\n\", ax + b);\n    printf(\"s +\
    \ c = %hd\\n\", s + c);\n    printf(\"ax + c = %ld\\n\", ax + c);\n    printf(\"\
    ax + ux = %lu\\n\", ax + ux);\n    return 0;\n}\n```\n### OUTPUT\n```\na + c =\
    \ 252\nx + c = 89.134590\ndx + x = 3.276183\nint dx + ax = 1234567891\na + x =\
    \ 127.134590\ns + b = 16388\nax + b = 1234580235\ns + c = 4130\nax + c = 1234567917\n\
    ax + ux = 2541692680\n```\n\n# Convert specified days into years and weeks\n###\
    \ C CODE\n```c\n#include <stdio.h>\nint main()\n{\n    int days, weeks;\n    days\
    \ = 1329;\n    years = days/365;\n    weeks = (days % 365)/7;\n    days = days-\
    \ ((years*365) + (weeks*7));\n    printf(\"Years: %d\\n\", years);\n    printf(\"\
    Weeks: %d\\n\", weeks);\n    printf(\"Days: %d \\n\", days);\n    return 0;\n\
    }\n```\n### OUTPUT\n```\nYears: 3\nWeeks: 33\nDays: 3\n```\n\n# Calculate the\
    \ sum of the two integers\n### C CODE\n```c\n#include <stdio.h>\nint main()\n\
    {\n    int x, y, sum;\n    printf(\"\\nInput the first integer: \");\n    scanf(\"\
    %d\", &x);\n    printf(\"\\nInput the second integer: \");\n    scanf(\"%d\",\
    \ &y);\n    sum = x + y;\n    printf(\"\\nSum of the above two integers = %d\\\
    n\", sum);\n    return 0;\n}\n```\n"
