    # Chapter 2: The Basics to Writing Your First Project with the C Language


    Working with the `C` language is pretty simple. You can write a code that just
    has one line or you can go on and write a nice long one that is going to be more
    complex and could run a game or some other process. While you can get more complex
    later on, I am going to look at some of the basics of writing inside of the `C`
    language to help you to get comfortable.


    ## Writing a Dummy Code


    First, let’s take a look at writing out your dummy code. This isn’t going to bring
    you an output like some of the other codes that we will discuss later on, but
    it will help you to get the hang of creating and saving a code in the `C` language
    so you are ready for the things we do later on.


    So to start, you need to go into the `Code Blocks` IDE, or whichever IDE that
    you chose, and click on the `New` Button. You will want to open up an `Empty File`.
    Now you will need to type in a code into the editor so that you are able to create
    a code to save. I am going to keep this simple and just type in one line like
    the following:


    ```

    main() {}

    ```


    Now you will need to save the source file and you can do this by clicking on the
    `Save` button. You can either let this save on the default of your computer or
    you can choose the folder that you would like all of these code files to be saved
    on your computer; the choice is up to you, just remember where you are saving
    all of these so if you need to find them later.


    Make sure to name the file something that you will be able to remember later on,
    or you will get confused as you start to add on more of these files over time.
    I am going to call this file `dummy.c`. once you have saved this, the source code
    file is created and it has been saved on your computer. Now you will click on
    the `Build` button.


    You will notice that the code is not going to compile. What you are going to see
    is the minimum of the `C` program, which is also called the `dummy`. All of your
    codes in `C` need to have the `main` function because this is where the execution
    of the program is going to start; you will just need to put the `main` function
    inside of the curly brackets.


    Since this is a dummy source code and one where we are just experimenting a little
    bit, I didn’t have us put any code into the curly brackets. When you try to run
    this option, you will not get an output because nothing was placed inside. We
    will be able to add in different things later on and create an output based on
    what is inside the code. You may see a compiler warning when entering the dummy
    code, but this is not critical. You will just click on your `Run` button and then
    find that it is not able to give you any output.


