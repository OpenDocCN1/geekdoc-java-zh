    The C language library has many functions that you are able to utilize and these
    functions are going to help you accomplish quite a few things. With that being
    said, they aren’t able to do everything and there are times when you will need
    to make up some of your own functions in this language. In fact, many programmers
    who have been working in this language for some time have created many of their
    own functions to help the code work properly.


    In this chapter, I will spend some time talking about the function, including
    how to setup a function, how to prototype it, how to call or access any function
    that you would like, and even how to bail out of your function early if you need.
    In the C language, the function is going to have a type, a name, and arguments
    that are held in the parenthesis. The name is going to be unique and should be
    used to identify the function that you are using. The arguments are zero, one,
    or more values that will be passed through the function and is known as the input.


    Below I have the `alpha` function, which isn’t going to have an input or an output;
    this is something that is valid inside of the C language. This type is going to
    be known as the `void` function and will look like the following:


    ```

    void alpha(void)

    ```


    The `Void` is the variable type, which basically tells the compile that you don’t
    have a variable type. The function `count` is going to be the integer function
    and it is responsible for generating or returning some kind of integer value.
    It will need some more input than above, and therefore it doesn’t have any arguments.
    It would look like this:


    ```c

    int count(void)

    ```


    Another thing that you can do with functions is the function `hangup`, which is
    going to return no values, so it is also a `void` function. However, this one
    is slightly different because it does accept a single character as the input and
    you can choose to have the character as an argument. In the C language, it is
    going to be referenced with the `ch` variable. Before you are able to use your
    function though, regardless of the type that you are using, you need to introduce
    it to the compiler and allow the compiler to check the arguments to ensure that
    everything is being used properly.


    When you want to call up the function, you will call it by the name and then use
    a parenthesis. When the function is called, the control passes on to the statements
    of the function. Once the function is all over, the flow will continue with the
    statement after the function call. Let’s take a quick look at how the function
    can work in a code. The following code will contain two functions to help out
    with this:


    ```c

    #include <stdio.h>


    Void blorf(void);


    Int main()


    {


    Puts(“the main () function always runs first”);


    Blorf();


    Puts(“thanks, blorf()”);


    Return(0);


    }

    ```


    The `main` function is again the one that you need for all codes in the C language.
    You will also notice that there is a `blorf` function, which is new to the system.
    In line three, you are prototyping the function and informing the compiler of
    the function argument and types. The compiler can then confirm that you are using
    the function the correct way inside the code by checking out the prototype. And
    sense the prototype is a statement, it is going to end just like the other statements
    with a semi-colon.


    Then we move on to line 8 which is going to call the function. Since this function
    doesn’t have an argument, the parenthesis is going to remain empty. The function
    itself is not going to be found until line 14. This will effectively repeat the
    prototype without the semicolon. The statements that belong to this particular
    function are going to be inside the curly brackets. Now, take a few minutes to
    build and then run this code to see how it works.


    Now say that you want to call up the function again. This is simple to do because
    you would just need to duplicate line 8 over line 9 and it would repeat itself
    again. So the new code would look like this:


    ```c

    #include <stdio.h>


    Void blorf(void);


    Int main()


    {


    Puts(“the main () function always runs first”);


    Blorf();


    Blorf();


    Puts(“thanks, blorf()”);


    Return(0);


    }

    ```


    When you save and run the code again, you will see that this output will appear
    twice.


    The prototype inside your code is going to work similar to a definition to the
    function, basically describing to the compiler how it is going to be used before
    the function appears in the code. There are times that you won’t need to specify
    the prototype, but this is only going to work when you write out the function
    before it is used. A good example of how this works includes:


    ```c

    #include <stdio.h>


    Void soup(void);


    {


    Puts(“Pea green soup!”);


    }


    Int main()


    {


    Printf(“For breakfast I had”);


    Soup();


    Printf(“For lunch I had”);


    Soup();


    Return(0);


    }

    ```


    The `soup` function is going to appear before the `main` function in this code.
    This is just fine because the compiler is still going to see them inside the function
    and it is always the first function that is going to be executed inside the program.
    What is missing in this one is the prototype of the `soup` function. Take a moment
    to build and run this code as well.


    Now I will show you another example that you are able to use that will allow you
    to use the `return` keyword in order to bail out of your function early if you
    would like. This could be used when dealing with a loop or some other thing that
    is continuing inside of your code that you want to stop early. Look for the `return`
    at line 26 to see how this works:


    ```c

    #include <stdio.h>


    Void cheers(void);


    Int main()


    {


    Int x;


    x=21


    puts(“Everyone gets dinner!”);


    cheers();


    puts(“Everyone gets dessert!”)


    cheers();


    printf(“%d\n”, x);


    puts(Everyone pays taxes!”);


    return(0);


    }


    Void cheers(void);


    {


    Int x;


    For(x=0;x<3;x++)


    Printf(“Huzzah!”);


    Return;


    Putchar(‘\n’);


    }

    ```


    In this one, you don’t have to go through and specify a value because `cheers`
    function is considered a `void` function, meaning it isn’t going to return anything.
    In the `main` function, the `return` needs to specify a value at line 17, like
    it does in this example, because `main` is considered an `int` function. Save
    the changes of this one and then build and run your code.


    The output on this one can be a bit messy because your `putchar` statement is
    skipped. However, the code is never executed because of the `return` statement
    that is placed right above it. There are many was that you will be able to use
    functions inside of your code. They are going to help the compiler to see what
    is going on inside the code, as long as you define them properly, and while there
    are many of them already available in the library for the C language, you can
    also have the ability to create some of your own. Conclusion


    Thank for making it through the end C Programming for Beginners: Crash Course
    –Ultimate Edition, let’s hope it was informative and able to provide you with
    all of the tools you need to achieve your goals whatever it may be.


    The next step is to get started with writing out some of your own code. You will
    be able to try out a few of the codes that we offered inside of this guidebook
    or use the tips and tricks that we discussed in order to write the code to fit
    your own needs.

