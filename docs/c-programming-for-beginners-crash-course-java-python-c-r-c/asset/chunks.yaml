    # 第一章：C 语言简介


    在学习一种新编程语言时，似乎有很多部分需要你关注。作为一个新手，你可能会担心自己编写代码太难，并且需要数年的经验。即使你过去有过编程经验，你可能担心学习新东西有多困难，以及它与你所选的计算机语言有多大不同。但编码可以是非常简单的，即使你对这个过程完全是一个新手。


    在本书书中，我将花一些时间向你展示如何使用 C 编程语言，对于所有学习自己编写代码所带来的选择和力量来说，它是最好的选择之一。我将向你介绍学习编程时用到的一些术语，并带你完成所需的步骤，以便在结束本书时写出你自己的代码。


    ## C 编程是如何开始的？


    C 编程语言于 1972 年在 Dennis Ritchie 的帮助下开始。当时，R 是 AT&T 贝尔实验室的一位计算机科学家，他需要为自己的使用开发一些程序。这种新语言的目标是创建一个高效且能帮助社区的编程语言。


    这项工作的成果就是 C 编程语言。这是一种通用的、结构化的语言，被称为过程化编程语言。它不是为特定应用程序设计的，但非常适合科学或商业应用。它内部包含了许多功能，例如循环语句和控制结构。


    作为 C 语言的用户，你将享受许多功能，包括：


    - **交互性**：它是首批与用户交互的语言之一，即使没有经验也更容易使用。

    - **可靠性**：C 语言非常可靠。你可以编写代码，而不必担心它们以后会崩溃或出现问题。

    - **效率与有效性**：如果你想要一种有效且能完成任务的编程语言，没有任何能和 C 语言相提。

    - **灵活性**：这种语言非常灵活。你可以在这种语言中处理许多不同的程序，虽然它主要用于商业目的，但你可以将其用于你的任何个人需求。

    - **可移植性**：C 语言可以随你去到哪里，无论是在 Windows 电脑、Mac、Linux 操作系统还是其他平台上都可以运行。


    尽管多年来开发了许多编程语言并发生了很多变化，但 C 语言仍然是一个非常值得学习的语言。许多程序员仍在使用 C 语言，许多新的编程语言也以 C 为基础。如果你想学习一种在未来让你学习其他编程语言更容易的语言，C
    语言是你的最佳选择。


    ## 获取 IDE


    在使用 C 语言之前，你必须确保下载一个与之配套的良好 IDE。IDE，即集成开发环境，基本上是你编写、链接、编辑、编译和运行代码的区域。如果没有 IDE
    来帮助你，你的 C 语言基本上无法工作。有了正确的 IDE，你将能够完成上述所有任务，并可以使用各种图形化工具创建自己的复杂的程序，甚至进行调试。


