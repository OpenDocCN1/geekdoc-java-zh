    Chapter 5: The Variables in the C Programming Language


    As I mentioned a bit before, a variable is going to be the container for different
    data type sin your code. The variable, or the container, will be able to hold
    a floating point character, an integer, or some other value. In this chapter,
    I am going to explain a bit more about the variables and how you can use them,
    and how they work, inside of your C language code.


    So how do you distinguish between a variable and a value. A value can be almost
    anything inside of the code, such as an integer, a character, or something else
    that can be defined in the code. On the other hand, the variable is going to be
    the container that holds these data types together. Usually they have to have
    something that ties them together, but they don’t need to be identical. For example,
    you could have a variable that contains school supplies such as pencils, pens,
    paper, chalk, notebooks, and so on. These are similar in one way, and they make
    sense to go together, but they are not identical.


    When you declare a variable in the C language, you will learn about the type of
    variable and the name of the variable. Let’s take a look at how you would declare
    an integer variable to start:


    #include <stdio.h>


    Int main()


    {


    Int a;


    Printf(“The value of a is %d\n” ,a);


    Return(0);


    }


    In this option, the integer variable is “int” and the name of it is a. the variable
    in the above code is never assigned a value, but even though it is never given
    a value, you will still be able to use it inside the code, just like it is shown
    in the 7th line. Build and run the program really quick. On your side, you may
    see that a random value comes up. Unlike some of the other languages you will
    come across, the C language is not going to initialize the variables as they are
    declared. Internally, the program is going to allocate a chunk of the memory in
    order to store the information for that variable.


    In this case, the chunk hasn’t been initialized and yet it is not set to zero.
    It just is placed in some location in your memory. Whatever value is already placed
    there, it is going to be absorbed right away by the variable and you will see
    this s the output on your screen. The idea behind this is that you need to initialize
    the variable before you try to use them. A good way to fix this issue is with
    the following code:


    #include <stdio.h>


    Int main()


    {


    Int a;


    a = 65;


    printf(“The value of a is %d\n” ,a);


    return(0);


    }


    Save these changes and then build and run the program. Now the output of your
    code is more predictable because you know the value of the variable. In addition
    to knowing the name and the value of the variable, you can also learn a few other
    things about your variable in this language. One of these is the sizeof operator.


    Sizeof is one of the keywords in the C language, but it is also considered an
    operator. What the sizeof keyword does is return how many bytes of storage are
    used for that variable. This may not seem too important, but when you are working
    with the C language, it can come into play and you will need to know this information
    at times. Here is an example of how you can use the sizeof keyword in your code:


    #include <stdio.h>


    Int main()


    {


    Int a;


    Printf(“An int variable occupies %lu bytes of storage\n”, sizeof(a));


    Return(0);


    }


