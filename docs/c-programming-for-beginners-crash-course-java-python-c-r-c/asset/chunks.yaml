    \n# 第 5 章：C 语言编程中的变量\n\n正如我之前提到过的，变量将是代码中不同数据类型的容器。变量（或容器）可以容纳浮点字符、整数或其他值。在本章中，我将更详细地解释变量，以及你如何在\
    \ C 语言代码中使用它们，以及它们是如何运行的。\n\n那么，你如何区分变量和值呢？值可以是代码中的几乎任何内容，例如整数、字符或代码中可以定义的其他内容。另一方面，变量是把这些数据类型组合在一起的容器。通常，它们必须有某些东西将它们联系在一起，但它们不需要完全相同。例如，你可以有一个包含学校用品的变量，如如铅笔、钢笔、纸张、粉笔、笔记本等。这些东西在某方面是相似的，放在一起也是合理的，但它们并不是完全相同的。\n\
    \n当你在 C 语言中声明一个变量时，你将学习到变量的类型和名称。让我们先来看如何声明一个整数变量：\n\n```c\n#include <stdio.h>\n\
    \nInt main()\n{\n  Int a;\n  Printf(\"The value of a is %d\\n\" ,a);\n  Return(0);\n\
    }\n```\n\n在这个选项中，整数变量是 `int`，它的名称是 `a`。上述代码中的变量从未被赋值，但尽管它从未被赋予值，你仍然可以在代码中使用它，就像第\
    \ 7 行所示。快速地编译并运行程序。在你的那边，你可能会看到一个随机值。与你遇到过的其他语言不同，C 语言不会在声明变量时初始化它们。在内部，程序将分配一块内存来存储该变量的信息。\n\
    \n在这种情况下，这块内存没有被初始化，也没有被设置为零。它只是被放置在内存中的某个位置。无论那里已经有了什么值，都会立即被变量吸收，你会在屏幕输出上看到它。这背后的原理是，你在尝试使用变量之前需要对其进行初始化。解决此问题的好方法是使用以下代码：\n\
    \n```c\n#include <stdio.h>\n\nInt main()\n{\n  Int a;\n  a = 65;\n  printf(\"\
    The value of a is %d\\n\" ,a);\n  return(0);\n}\n```\n\n保存这些更改并编译运行程序。现在，你的代码输出更具可预测性，因为你知道变量的值。除了知道变量的名字和值，你还可以学习关于该语言中变量的其他信息。其中之一就是\
    \ `sizeof` 运算符。\n\n`sizeof` 是 C 语言的关键字之一，但也被视为运算符。`sizeof` 关键字的作用是返回该变量使用了多少字节的存储空间。这看起来并不重要，但当你使用\
    \ C 语言时，它可能会派上用场，你有时需要这些信息。这里是在代码中使用 `sizeof` 关键字的示例：\n\n```c\n#include <stdio.h>\n\
    \nInt main()\n{\n  Int a;\n  Printf(\"An int variable occupies %lu bytes of storage\\\
    n\", sizeof(a));\n  Return(0);\n}\n```\n\n在这个示例中，变量 `a` 没有初始化，但由于没有被使用，所以这不是大问题。`sizeof`\
    \ 运算符位于 `printf` 语句内部，它只需将变量 `a` 作为一个 `int` 变量进行求值，以返回计算机上占用了多少存储空间。你得到的输出是一个长且未赋值的整数值。你可以通过更改某些部分来改变想要接收的信息，例如查询一个字符占用多少空间，而不仅仅是变量。\n\
    \n关于变量，你能够发现的另一个信息是内存位置。要访问这些位置，你需要使用取地址符 `&`。这里有一个实现此操作的好代码示例：\n\n```c\n#include\
    \ <stdio.h>\n\nInt main()\n{\n  Int a;\n  Char b;\n  Float c;\n  Puts(\"memory\
    \ location:\");\n  Printf(\"A is at %p\\n\", &a);\n  Printf(\"B is at %p\\n\"\
    , &b);\n  Printf(\"C is at %p\\n\" , &c);\n  Return(0);\n}\n```\n\n第 6 章：编写代码时的函数基础\n\
    \n它允许你遍历并找到代码中的函数，即代码的骨架，帮助你编写想要发生的事情。它可以向编译器发出命令，帮助你设置代码，等等。\n\n"
