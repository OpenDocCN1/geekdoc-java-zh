    只要准备好了合适的 IDE，你就可以使用 `C` 编程语言并很快编写出一些代码了。无论你是已经习惯了编程，还是刚刚开始，我都会带你了解你应该采取的一些步骤，以便你使用
    `C` 语言创建出色的代码和出色的项目。


    # 第 2 章：使用 C 语言编写第一个项目的基础知识


    使用 `C` 语言非常简单。你可以写一段只有一行的代码，也可以继续写一段很长、很不错的代码，它会更复杂，并可以运行游戏或其他进程。虽然以后可以编写更复杂的内容，但我将介绍
    `C` 语言内部编写的一些基础知识，帮助你熟悉它。


    ## 编写示例代码


    首先，让我们来看如何编写你的示例代码（dummy code）。这段代码不会像我们以后讨论的某些代码那样产生输出，但它将帮助你熟悉如何在 `C` 语言中创建和保存代码，以便你为稍后的工作做好准备。


    所以要开始，你需要进入 `Code Blocks` IDE（或者你选择的任何 IDE），并点击 `New`（新建）按钮。你需要打开一个 `Empty File`（空文件）。现在你需要在编辑器中输入代码，这样你就能创建一个可以保存的代码。我将保持简单，只输入如下的一行代码：


    ```

    main() {}

    ```


    现在你需要保存源文件，可以通过点击 `Save`（保存）按钮来实现。你可以让它保存在你计算机的默认位置，也可以选择你想要在计算机上保存所有这些代码文件的文件夹；选择取决于你，只需记住你把这些文件保存在哪里，以便以后需要时找到它们。


    请确保给文件起一个你以后能记得的名字，否则随着时间的推移开始添加更多文件，你会感到困惑。我将这个文件命名为 `dummy.c`。一旦保存了这个文件，源代码文件就创建了并保存在你的计算机上。现在你点击
    `Build`（构建）按钮。


    你会发现代码将不会编译。你看到的是 `C` 程序的最小单元，也称为 `dummy`（空壳）。你所有的 `C` 代码都需要有 `main` 函数，因为这是程序执行的开始的地方；你只需要将
    `main` 函数放在大括号内部。


    由于这是一个示例源代码，而且我们只是在进行一些实验，所以我没有让我们在大括号里放入任何代码。当你尝试运行此选项时，你将得不到任何输出，因为里面什么都没有。我们以后将能够添加不同的内容，并根据代码内部的内容创建输出。在输入示例代码时，你可能会看到编译器警告，但这并不是致命的。你只需点击
    `Run`（运行）按钮，然后发现它无法给你提供任何输出。


    恭喜！你刚刚使用 `C` 编程语言编写了你的第一段代码。如果你没有得到任何输出，说明你的代码写对了。这只是 `C` 语言中编写代码的基本形式，你还可以在代码中添加很多内容。你可以添加到代码中的其他一些基础部分包括：


    - 结构

    - 变量和值

    - 运算符

    - 函数

    - 关键字


    我将带你了解其中一些内容是如何工作的，这样你就可以学习如何让代码按照你想要的方式闪光。


    ## 关键字


    在 `C` 语言中学习关键字是非常重要的，因为它们帮助你在编写代码时完成想要的基础任务。`C` 语言中有 44 个单词被保留为关键字，你应该只在代码中将其作为关键字来使用。在大多数情况下，你可能会发现其中大多数单词只偶尔使用，所以你会很快就能熟悉其余部分。在书中后面我们编写一些代码的过程中，我将向你展示其中的一些关键字。


    ### 函数


    函数在这个语言中非常重要，许多函数被包含在 `C` 语言的库中。函数将代码缝合在一起，使其能够制作出你想要的程序。当你想在自己的程序内部创建或使用函数时，你需要包含一个头文件，该头文件将定义该函数。你使用函数可以做很多事情，稍后我将给出示例来说明它是有多强大。


    ### 运算符


    运算符将用于你的代码内部，以操作程序内部的数据。有几种类型的运算符，每种类型根据你的使用方式以不同的方式工作。`C` 语言内部常用的运算符包括：


    - 数学运算符：这些包括你为了加、减、除或乘信息所需的符号。

    - 比较运算符：这些运算符允许你比较代码内部不同的值或信息，以判断语句的真假。

    - 赋值运算符：赋值运算符让给你的变量赋值变得更容易。


    ## 变量和值


    变量和值之间是相似的，但存在一些差异。值将包含数值和字符，你可以让它们包含任何想要的内容。例如，数值可以是分数和数点，也可以是非常小或非常大的数字。而对于字符，你可以拥有一个字母、整个句子或更多，这取决于你想让代码做什么。


    对于变量，你是在处理用于存储值的容器。你可以随心所欲地更改内容，而且它们是各异的。变量基本上将持有你以后直接放入程序中的相同值。


    ## 结构


    我还将谈论与 `C` 语言相关的结构。这种结构将帮助你以正确的方式编写代码，并控制程序的运行流。为了这一点，`C` 语言将使用预处理指令。在 `C` 语言内部运行的第一个函数是
    `main` 函数，就像我们在上面的第一个示例中使用的那样。这个 `main` 函数是你想要使用的所有程序的重大要求，因为没有它，你的程序将无法编译或运行。


    接下来，你需要大括号或括号来帮助包裹你函数的内容。在括号内部，你将能够包含语句，语句基本上包含数学、比较、关键字、函数等内容，以帮助编译器理解你想在代码内部执行什么。

