    of the memory. This is going to tell you specifically where the data of the variable
    is located. To fetch the information about the memory location, you will need
    the ampersand operator. Here is a good example of the code that you would use
    to make this happen:


    #include <stdio.h>


    Int main()


    {


    Int a;


    Char b;


    Float c;


    Puts(“memory location:”);


    Printf(“A is at %p\n”, &a);


    Printf(“B is at %p\n”, &b);


    Printf(“C is at %p\n” , &c);


    Return(0);


    }


    There are three different variables that are declared inside this code; the floating
    point value, a character, and an integer. These variables are not initialized
    inside this code because they aren’t being used, but the program will still allocate
    some space for them at different locations inside of the memory. In order access
    these locations, the ampersand is prefixed to the name of the variable. You will
    need to use the %p placeholder inside of the printf statement in order to get
    the results that you want.


    The output values that you will receive will vary based on the machine that you
    are using. Even the formats can change based on the operating system that you
    are using. The computer will be in charge of assigning a location on the memory
    and it sometimes depends on how much memory is available on your system or where
    the system decides to place it. Learning where the information is stored on your
    computer may seem a bit trivial at this point, but it can make it easier to find
    things and work on your code later on.


    Working with variables can help you to store information in your code properly.
    You are able to assign any value to your variables that you would like, you just
    need to be careful that you are initializing it inside of the code that you are
    writing and that it makes sense with all the other data types that are being stored
    inside of the variable.


