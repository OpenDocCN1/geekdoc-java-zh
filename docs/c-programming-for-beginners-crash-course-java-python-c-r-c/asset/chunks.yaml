    # 第 4 章：在 C 语言中使用循环


    循环是 C 语言代码中添加的一项非常有用的工具。它们允许你在代码内部创建项目列表，甚至是图表和统计图。它们非常出色，因为只需要几行代码，你就可以完成一个巨大的图表，而不需要尝试手动输入过程中的每一行代码。例如，如果你想创建一个从
    1 到 100 的图表，把每一行都写出来将非常无趣，但使用正确的循环语句，你只需要几行代码就能实现这一目标。


    循环是在 C 语言代码中进行比较的另一种方式，有几种循环选项可以极大为你的代码增加功能。`while` 循环、嵌套循环和 `do/while` 循环是你可以使用的最常见类型，但本章中我也会花一些时间谈谈
    `for` 关键字。


    ## While 循环


    循环是一种非常重复的程序执行控制方式。你可以指定让循环重复的条件，以及你想要在代码中重复的一组语句，以及循环停止的方法。如果你忘记添加停止循环的部分，程序基本上会一直运行下去并冻结计算机，所以请务必添加该部分。


    这是一个使用 `while` 循环让代码从 1 计数到 10 的代码示例。


    ```c

    #include <stdio.h>


    Int main()

    {

    Int x;

    x = 1;

    while(x <= 10)

    {

    Printf("%d\n” ,x);

    x++;

    }


    Return(0);

    }

    ```


    循环条件显示在第 8 行，内容是当你的变量值小于或等于十时，因此只要你的条件为真，循环内部的语句就会继续重复。第 11 行显示 `x` 的值将是增量的，因此每次执行循环时，它都会加
    1，直到 `x` 的值大于 10。当你编译并运行此代码时，你将看到 1 到 10 的数字显示。


    你可以对其进行修改，以创建你需要的数量的 `while` 循环。例如，假设你想让代码计数到 20。你只需要找到 `while` 语句部分并更改你想要使用的数字即可。你还可以更改每次增加的数值。上面的代码设置为
    `x = 1`，所以它每次加 1，但你可以将此变量更改为你喜欢的任何，例如按 2 或 5 计数以得到你想要的正确答案。


    ## Do/While 循环


    执行循环的另一种选项是 `do/while` 循环。它与 `while` 循环类似，但几乎像是一个倒过来的循环。在 `while` 循环中，代码会检查条件是否为真，如果是，则执行代码。在
    `do/while` 循环中，代码会执行一次，然后在再次运行之前检查是否满足条件。如果你想确保语句至少运行一次，`do/while` 循环是你的最佳使用选择。让我们来看下面的代码，看看
    `do/while` 代码是如何工作的。


    ```c

    #include <stdio.h>


    Int main()

    {

    Char ch:

    Ch = ‘A’;

    Do

    {

    Putchar(ch);

    Ch++;

    }

    While (ch != ‘z’);


    Putchar(‘\n\);


    Return(0);

    }

    ```


    你会注意到 `do/while` 循环将从第 9 行的语句 `do` 开始。这个没有条件，因为语句将一个接一个地执行。然后你可以看到 `while` 条件出现在你的第
    14 行。循环将依赖 `ch` 变量作为条件，它在第 7 行首次初始化，然后在第 12 行进行处理。花点时间在你的编译器中编译并运行此代码。


    在这个例中，‘z’ 不会被打印，因为它被视为退出条件。如果你想在代码中看到 ‘z’，你需要在代码末尾将退出条件保存为 ‘z+1’。现在通过这个例子，你基本上创建了一个无限循环，因为它加了
    1。如果你构建并尝试运行这个，你将会陷入无限循环，并按下 `Ctrl + C` 才能退出程序。


    在某些情况下和地方你可能需要无限循环，但作为初学者，你很可能无意中遇到它。有通过添加 `break` 语句来修复无限循环的方法。我们在代码中添加 `break`
    语句如下所示：


    ```c

    #include <stdio.h>


    Int main()

    {

    While(1)

    {

    Printf(“无限！”);

    Break;

    }


    Return(0);

    }

    ```


    ## For 关键字


    当你想要在代码中创建循环时，`for` 关键字是一个很好的选择。与使用 `while` 循环不同，`for` 循环只需要一行即可完成，这使得它看起来有些晦涩，但它仍然是一种流行且传统的循环类型。一个很好的示例如下：


    ```c

    #include <stdio.h>


    Int main()

    {

    Int x;

    For(x=0; x<10; x++)

    Printf("%d\n” ,x);


    Return(0);

    }

    ```


    你看到的第一个部分是初始化，语句是 `x=0`，这是循环开始时进行的赋值。代码内部的第二个内容是循环条件。循环将持续重复直到条件不再为真，在这种情况下直到
    `x` 等于 10。最后，你会注意到迭代语句。每当你的循环重复时，这个特定的语句就会执行。


    分号并不是跟在 `for` 语句括号后面，而是跟在单个循环语句后面，即位于大括号内的第 8 行。花点时间编译并运行此代码。按照目前的设置，代码将从 0 开始到
    9，然后一旦达到 10 循环就会停止，因为在那个点条件不再为真。在这个程序中，除非你另有，否则程序将从 0 开始计数而不是 1。由于大多数时候你希望从 1
    开始计数，因为这是大多数人的习惯，你会去第 8 行并将 `x` 更改为 `x+1`。这不会对 `x` 的值产生任何变化，但对输出会有影响。


