    Another thing that you may want to use at times inside of the code is the comment.
    The comments are basically little footnotes that you can write for the other programmers,
    and sometimes even for yourself, when looking back inside of the code. The comments
    can tell someone else what is supposed to happen at certain places in the code,
    but when they are placed properly, the compiler will just read through and not
    execute the comment.


    Comments can be really helpful for making sure that everyone knows what is going
    on in the code or explaining what you would like to have happen at a certain place
    in the code. The compiler is not going to read these comments so you will be able
    to write out as many as you would like inside the code.


    # Writing Another Code


    Now that I have had some time to explain a few of the basic parts of code writing,
    let’s take a look at how this would work by bringing out our `dummy.c` program
    from earlier. Just open up the code from wherever you stored it before and I am
    going to make the `main` function be defined as an integer function. This basically
    means that it is going to return an integer value onto the operating system. We
    will need to do some editing in order to make this happen.


    Inside of your editor, you will need to add in the keyword `int` before your `main`
    part to ensure that you are getting the integer output that you would like. Make
    sure that you place a space between both of these keywords to help the compiler
    to read through both of them. So to start, type out the following code:


    ```c

    int main()

    {

    }

    ```


    You will notice that the code is a bit different than we originally wrote out
    with the first code, but putting the curly brackets in this manner is what most
    veteran programmers prefer to use. Now it is time to add in a statement to this
    `main` function so that it will actually show you an output. I will keep it simple
    and just add in the number three.


    You will first need to type in the `return` and then the number three. I will
    write out the example of the syntax that you would use to make this happen:


    ```c

    int main()

    {

    return(3);

    }

    ```


    Make sure to add in the semicolon after the statement. Save the file and then
    click on the Build button. As long as you type in the code like I wrote above,
    you shouldn’t have any issues with errors or messages coming up for you. Click
    on the Run Button.


    When using a Linux or Mac system, it is possible that you won’t see any output
    other than the build log, and it will say that the program terminated with a status
    of zero. On a PC computer, the terminal window is going to show you the return
    value `3`.


    Any time that you want to add in an output to your dummy program, you need to
    bring in the output function. The keywords in the C language aren’t going to output
    anything because they are just basic vocabulary, such as the words `int` and `return`.
    You can do this by using the `puts` command inside the program.


    Let’s take a look at how this is gong to work when you write out some code. Make
    sure that the function of the `puts` is inside of parenthesis and that you place
    a string of text between a double quote to make it work properly. Here is the
    example I am going to use:


    ```c

    int main()

    {

    puts(“I am the King of the C programming world”);

    return 3;

    }

    ```


    When you save this source code and then click on Build, you should see a warning
    come up on your computer. Even if you don’t see this, you need to realize that
    you have another step to do at this point. Before the `puts` function is going
    to work, it needs to have a definition inside, or you will find that the compiler
    is confused. The definition of your `puts` will be in the I/O header file and
    you need to place this into the source code with the help of the preprocessor
    directive.


    Here is an example of how that would look inside of your code to keep things organized
    and to avoid errors.


    ```c

    #include<stdio.h>


    int main()

    {

    puts(“I am the King of the C programming world”);

    return 3;

    }

    ```


    This version includes the preprocessor directive along with the definition for
    the `puts` function. You can save the file and then click on the Build and Run
    buttons that are at the top of the editor. If everything is typed properly, you
    can avoid errors and in the output terminal window, the statement that you wrote
    out for the `puts` function as well as the value `3` will show up on the screen.


    Learning some of the basics of writing a code in the C language can make it easier
    to understand what is going on. I showed you a few of the options that you have
    when working inside of the C language, but there is still so much more that you
    are able to do. Take some time to get familiar with how these codes work, play
    around with the IDE and the compiler, and get comfortable before moving on and
    learning some more complex options when writing your own code.


    # Chapter 3: Language Comparisons Inside the C Programming Language


    In most cases, when you write out a code, the program will go through and execute
    the statements as they show up inside the code, going one line after the other.
    But there are times when you will want to make changes to the flow of your program.
    The if statements are one of the easiest ways to change up the order of your program
    flow and makes it so the program is able to make decisions for you rather than
    just reading through the code line by line.


    In this chapter, we will spend some time looking at the `if` keyword and learn
    how different comparisons are made inside of the C language so that the compiler
    is able to handle multiple decisions based on what you place inside the code and
    what the user inputs into the system.


    ## Working with Comparisons


    The first part that I will discuss is how to make the work inside inside the C
    language. When doing comparisons, there will be two expressions or values that
    the program will evaluate. To make these comparisons, you can use some of the
    comparison operators that are found in this language. Some common operators include:


    - `!=`: means not equal

    - `>=`: means greater than or equal to

    - `<=`: means less than or equal to

    - `<`: means less than

    - `>`: means greater than

    - `==`: means equal to.


    Now that we have learned a few of the most common comparison operators, it is
    time to take a look at how this would work within a code with the following example.


    ```c

    #include <stdio.h>


    int main()

    {

    int a;

    printf(“Type an integer:”);

    scanf(%d”,&a);

    printf(“You typed %d. \n” ,a);

    if(a>10)

    printf(“%d is greater than \n” ,a);

    return(0);

    }

    ```


    In this example, your user is going to be prompted to type in their integer value.
    The value that is displayed at line 9 and then when you get to line 10, the `if`
    statement is going to evaluate that value. If it determines that the value is
    above 10, then the 11th line will be executed. But if the value is lower than
    10, then the 11th line is skipped. Take some time to build up and then run this
    code to get it set up.


    Once you have done that, type in any value that you would like. I am going to
    use the number `45`. When you type this number into the code, it is going to work
    and the compiler is going to display the `printf` statement that is on line 11.
    But if I chose a number like `5`, the 11th line and the statement that goes with
    it will be skipped.

