    \ 循环更容易使用。让我们通过观察下面的代码来看如何处理嵌套循环：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <time.h>\n\nInt main()\n{\n  Int column, r;\n  Srand((unsigned)time(NULL));/*Seed\
