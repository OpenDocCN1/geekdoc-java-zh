  trans: "\n\n我简要介绍了 `if` 语句在上述代码中是如何工作的。在大多数情况下，`if` 语句的格式与我们之后将处理的一些语句略有不同。它将拆分成至少两行。第一行将\
    \ `if` 条件放在括号中。如果它对条件进行求值并发现结果为真（true），则将执行下一行。它基本上只是分在两行之间的一条语句，因此分号将位于语句的后半部分，而不是第一部分之后。\n\
    \n现在，如果你愿意，也可以将 `if` 语句写成一行，但这并不符合常见的编程规范，而且通常将它们分成两行或多行并包含在括号内，会使代码更易读。\n\n如果你愿意，你也可以选择在代码中使用多个\
    \ `if` 语句。这允许你根据你设置的条件以及用户提供的输入，让代码中发生几种情况。这里有一个很好的示例，你也可以在你的程序中尝试：\n\n```c\n\
    #include <stdio.h>\n\nint main()\n{\n    int a;\n    printf(\"Type an integer:\
    \ \");\n    scanf(\"%d\", &a);\n    printf(\"You typed %d. \\n\",a);\n    if(a\
    \ > 10)\n    {\n        printf(\"%d is greater than \\n\",a);\n    }\n    if(a\
    \ < 10)\n    {\n        printf(\"%d is lesser than \\n\",a);\n    }\n    return(0);\n\
    }\n```\n\n通过这段代码，我们可以看到两个 `if` 比较紧挨在一起。它们都将有自己的一组括号，并将评估两个不同的条件；一个检查大于，另一个检查小于。花点时间构建这段代码并运行它。\n\
    \n运行代码后，你会发现根据你输入的值，将对于大于 10 或小于 10 的值显示相应的输出。注意，在这种情况下，当你输入数字 10 时不会有任何输出，只有当数字大于\
    \ 10 或小于 10 时才会显示。你可以修改第 16 行，将其改为“小于或等于 10”，以解决这个问题并在使用数字 10 时获得输出。\n\n## Else\
    \ 语句 (Else Statements)\n\n虽然 `if` 语句可以帮助为 C 语言添加一些比较，但你也可以使用 `else` 语句来帮助你。这些非常适合你想创建的“二选一”决策。请看下面的代码，了解\
    \ `else` 语句在你的代码中是如何工作的：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    int\
    \ a;\n    printf(\"Type an integer: \");\n    scanf(\"%d\", &a);\n    printf(\"\
    You typed %d. \\n\",a);\n    if(a > 10)\n    {\n        printf(\"%d is greater\
    \ than \\n\",a);\n    }\n    else\n    {\n        printf(\"%d is less than or\
    \ equal to 10. \\n\",a);\n    }\n    return(0);\n}\n```\n\n上面的代码基本上是我们之前使用的代码的重写，但我们加入了\
    \ `else` 语句。在第十行，我们使用 `if` 条件来进行求值。如果该条件被评估为真，则将执行该语句。如果条件被评估并判定为假（false），则代码中带有\
    \ `else` 部分的语句将被执行。花点时间构建并运行这段代码，尝试几个输入来看看它是如何工作的。\n\n注意这段代码，我没有使用分号，而是使用了大括号。你可以在不使用括号的情况下写完它，因为只有一条语句，但这是一种很好的编写方式，可以确保所有内容保持在一起，并且良好的编程习惯。\n\
    \n## Else If 语句 (Else If Statements)\n\n有时，你会在代码中使用至少三个（甚至更多）你想要使用的条件。在这些情况下，你需要一些与\
    \ `if` 和 `else` 语句不同的东西。这时我们将使用 `else if` 语句的结构。让我们来看看下面的代码，`else if` 语句是如何工作的。\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    int a;\n    printf(\"Type an\
    \ integer: \");\n    scanf(\"%d\", &a);\n    printf(\"You typed %d. \\n\",a);\n\
    \    if(a > 10)\n    {\n        printf(\"%d is greater than \\n\",a);\n    }\n\
    \    else if(a < 10)\n    {\n        printf(\"%d is less than or equal to 10.\
    \ \\n\",a);\n    }\n    else\n    {\n        printf(\"%d is 10, \\n\",a);\n  \
    \  }\n    return(0);\n}\n```\n\n使用这种结构，你可以从第十行的 `if` 语句开始。如果此条件为真，则将执行与它关联的语句。如果该语句被评估为假，它将移动到第\
    \ 14 行检查的 `else if` 语句。如果此条件最终被评估为真，则将执行该语句并跳过所有其他部分。在最最后面的是 `else` 语句。如果上述两个条件都不满足，则将执行这一个。\n\
    \n这种做法的妙之处在于于，你可以根据需要添加尽可能多的 `else if` 语句。\n\n## Switch 语句 (Switch Statements)\n\
    \n在 C 语言中，你可以使用 `switch` 语句来处理决策。你可以根据需要添加许多此类语句来使代码更整洁。让我们看看下面的代码中语句是什么样子的：\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    char a;\n    printf(\"Your choice\
    \ (1,2,3): \");\n    scanf(\"%c\", &a);\n    switch(a)\n    {\n        case '1':\n\
    \            puts(\"Excellent choice!\");\n            break;\n        case '2':\n\
    \            puts(\"This is the common choice:\");\n            break;\n     \
    \   case '3':\n            puts(\"I question your judgment.\");\n            break;\n\
    \        default:\n            puts(\"That’s not a valid choice.\");\n    }\n\
    \    return(0);\n}\n```\n\n这段代码大部分位于 `switch/case` 结构中。它从第十行开始是一个 `switch` 语句，然后有一系列\
    \ `case` 语句，每个 case 都有它们自己的语句（你可以以任何喜欢的方式修改它们）。`switch case` 还有自己的语句，然后是一个结束括号。这些都是该结构附带的重要元素。\n\
    \n你可能注意到它包含 `break` 关键字。因此，在该结构中发现了四个关键字，包括 `break`、`default`、`case` 和 `switch`。将此代码放入你的编译器中，然后运行几次，选择不同的选项查看输出结果，以及你是否正确放置了代码中的所有内容。\n\
    \n如果由于某种原因，用户输入的值不匹配任何 `case` 条件，你的代码将进入 `default` 条件。\n\n"
