    # Chapter 1: An Introduction to the C Programming Language


    When it comes to learning a new programming language, there may seem to be a lot
    of parts that you need to keep track of. You may worry as a beginner that it is
    too hard to put together a code on your own and that you need years of experience.
    Even if you have worked in coding in the past, you may worry how difficult it
    will be to learn something new and how different it is from your chosen computer
    language. But coding can be simple to learn, even when you are brand new to the
    process.


    In this book, I am going to take some time to show you how to use the C programming
    languages, one of the best options out there for all the options and power that
    come with learning how to do your own coding. I will show you some of the jargon
    that comes with learning how to program and walk you through some of the steps
    that are needed to end this book with writing your own code.


    ## How Did C Programming Begin?


    The C programming language started in 1972 with the help of Dennis Ritchie. At
    the time, Ritchie was a computer scientist at AT&T Bell Laboratories and he needed
    to develop some programs for his own use. The goal with this new language was
    to create a programming language that was efficient and also one that could help
    the community.


    The result of all this work was the C programming language. This is a general
    purpose as well as structured and it is known as a procedural oriented programming
    language. It is not a language designed for a specific application, but it is
    well suited for those who need a scientific or business application. There are
    many features inside, such as looping statements and control structures that are
    required.


    There are many different features that you are going to enjoy as a user of the
    C language including:


    - **Interactivity**: this was one of the first of its kind to interact with the
    user and become easier to use even without a lot of experience.

    - **Reliability**: the C language is really reliable. You will be able to write
    out your codes and not worry about them crashing or having issues down the line.

    - **Efficiency and effectiveness**: if you want a programming language that is
    effective and gets the job done, none will work the same as the C language.

    - **Flexibility**: this language is really flexible. There are many different
    programs that you are able to work with inside this language and while it is mostly
    used for business purposes, you would be able to use it for any of your own needs.

    - **Portability**: the C language can go where you go, working on a variety of
    different platforms whether you are on a Windows computer, Mac, Linux operating
    system, or something else.


    While there have been many programming languages developed over the years and
    the changes made, the C language is still a great one to learn how to use. Many
    programmers still use the C language and many of the newer programming languages
    will use C as their foundation. If you want to learn a language that will make
    other coding languages easier to learn down the road, the C language is the best
    option for you.


    ## Getting IDE


    Before you are able to use your C language, you need to make sure that you download
    a good IDE to go with it. The IDE, or the Integrated Development Environment is
    basically the area where you will write, link, edit, compile, and run your code.
    Your C language is basically not going to work unless you have an IDE in place
    to help you out. With the right one, you will be able to do all the tasks above
    plus work with a variety of graphical tools, create your own complex programs,
    and even do some debugging.

