  trans: '


    作为一名初学者，你可能担心编写代码会太复杂，但 `C` 编程语言会让这项工作变得非常简单。它也是你使用的许多新编程语言的基础，因此你将能够利用这些技巧将它们整合在一起，并在未来学习其他的编程语言，所以起步并不一定那么令人生畏。


    在本指南内部，你将领会到 `C` 编程语言可以有多简单。我们将讨论该语言包含的许多不同部分，包括 `C` 语言的历史、该语言代码中的一些基础部分、如何在 `C`
    语言中进行比较操作，甚至是如何处理不同类型的循环等更多内容。当你完成学习后，你将能够使用 `C` 语言来编写一些基础代码，并有信心继续工作，创建出你自己的程序。


    当你准备好进入编码世界并想要学习如何编写自己的代码和项目时，请翻阅本指南，了解 `C` 编程语言将如何让这一切成为可能。


    最后，如果你觉得这本书在任何方面对你有帮助，我们将非常感谢你在 Amazon 上的评价！


    # 加入成千上万创建了自己语言的编码者的行列。


    ![`createyourproglang.com/images/real_book.png`](http://1.macoaff.pay.clickbank.net/)


    ## “非常有趣，而且令人惊讶的是，获得一个可以涵盖 JavaScript 95% 功能的语言只需要很少的工作。”


    — [Jeremy Ashkenas](http://ashkenas.com/)，在阅读本书后创建了 [CoffeeScript](http://coffeescript.org/)。


    ## “我喜欢这本书！它帮助我创建了了自己的 Awesome-to-PHP 编译器。它现在还不是一个全功能的编译器，但我编写它的过程非常有趣，并且学到了很多东西。”


    — [Julien Desrosiers](http://twitter.com/jdesrosiers)，在阅读本书后创建了 [Phlower](http://github.com/juliend2/phlower)。


    ## “我在大学期间没有机会学习语言的内部原理，虽然我很感兴趣，但发现它们的运行机制令我敬畏。通过这门课程，我发现了一个关于词法分析器、解析器、解释器和编译器的简单而引人入胜的介绍，编程领域的一个全新世界突然向我敞开了。强烈推荐。”


    — [David Bolton](http://davidbolton.net/)


