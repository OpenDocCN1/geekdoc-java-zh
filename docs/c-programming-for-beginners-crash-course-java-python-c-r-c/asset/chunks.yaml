    Inside of the C language, you are able to use the if and else conditions to deal
    with complex decisions. You can add in as many of these as you would like to the
    system t deal with this, but the more conditions that come into play in your code,
    the uglier the code can become and the harder it is to write it all out. Instead
    of dealing with this, you can use the switch case structure, which will also help
    you to make some more decisions in the C language without all the mess. Let’s
    look at the following code to see how the switch statements look inside a code
    and then how it can handle a variety of decisions at the same time:


    #include <stdio.h>


    Int main()


    {


    Char a;


    Printf(“Your choice (1,2,3): “)’


    Scanf(“%c”, &a);


    Switch(a)


    {


    Case ‘1’:


    Puts(“Excellent choice!”);


    Break;


    Case ‘2’:


    Puts(“This is the most common choice:”);


    Break


    Case ‘3’:


    Puts(“I question your judgment.”);


    Break:


    Default:


    Puts(“That’s not a valid choice.”);


    Return(0);


    }


    The majority of this code is put in the switch/case structure. It is going to
    start out on line 10 as a switch statement and then it has a series of the case
    statements, each of which will have their own statements (which you will be able
    to change up in any way that you would like based on the code that you are writing).
    The switch case also has its own statements and then a closing curly bracket.
    All of these are important elements that come with the switch/case structure.


    You may have noticed that it has the break keyword inside of it. So there are
    four keywords that are found inside this structure including break, default, case,
    and switch. Place this inside of your compiler and then run it a few times, picking
    out the different options to see what the output is and if you placed all of the
    stuff inside the code correctly.


    So how does all of this work? The switch statement is going to handle a single
    value rather than a whole comparison. It can hold onto a mathematical equation,
    but the result needs to end up being just a single value. The value, which is
    specified by the switch, is then going to be compared to the values of each of
    the case statements. If it finds that the comparison is true, the statements that
    belong to that case statement will be flagged and executed. The ones that are
    not seen as true will be skipped.


    For example, if the user puts in the number 1 for line 12, then the puts statement
    that is in line 13 will be the one that is executed and the rest are skipped.
    But if they pick the number 2, you will see that the first case is skipped and
    it will move over to execute the second case and so on until it finds the one
    that is true.


    If there is a reason that the user puts in a value that doesn’t match any of the
    case conditions, your code will go to the default condition. In this example,
    if the user puts in the number 4, it would skip to the default and execute the
    code that comes with it.'
