    C 语言库包含许多你可以利用的函数，这些函数将帮助你完成相当多的任务。尽管如此，它们并不能完成所有工作，在某些情况下，你需要在这种语言中编写自己的函数。事实上，许多使用这种语言工作了一段时间的程序员已经创建了许多自定义函数来帮助代码正常运行。


    在本章中，我将花一些时间谈论函数，包括如何设置函数、如何进行原型声明、如何调用或访问你需要的任何函数，甚至在需要时如何尽早退出函数。在 C 语言中，函数将具有一个类型、一个名称以及放在括号中的参数。名称应该是唯一的，并被用于标识你正在使用的函数。参数是零、一个或多个传递给函数的值，被称为输入。


    下面是我提供的 `alpha` 函数，它既没有输入也没有输出；这在 C 语言中是有效的。这种类型被称为 `void` 函数，其格式如下：


    ```

    void alpha(void)

    ```


    `Void` 是变量类型，它基本上告诉编译器你没有变量类型。`count` 函数是一个整数函数，负责生成或返回某种整数值。它比上面需要更多的输入，因此它没有参数。它看起来像这样：


    ```c

    int count(void)

    ```


    你可以通过函数做的另一件事是 `hangup` 函数，它不返回任何值，所以它也是一个 `void` 函数。然而，这个稍有不同，因为它接受单个字符作为输入，你可以选择将该字符作为参数。在
    C 语言中，它将通过 `ch` 变量引用。在使用你的函数之前，无论你使用什么种类型，都需要向编译器引入它，并允许编译器检查参数以确保一切都被正确使用。


    当你想要调用函数时，通过函数名加上括号来调用。当函数被调用时，控制将传递到函数的语句。一旦函数结束，流将继续执行函数调用之后的语句。让我们快速看看函数在代码中是如何工作的。以下代码包含两个函数来帮助理解：


    ```c

    #include <stdio.h>


    Void blorf(void);


    Int main()


    {


    Puts“the main () function always runs first”);


    Blorf();


    Puts“thanks, blorf()”);


    Return(0);


    }

    ```


    `main` 函数仍然是 C 语言中所有代码所需的函数。你还会注意到有一个 `blorf` 函数，它是系统中的新成员。在第三行中，你正在对函数进行原型声明，并告知编译器函数的参数和类型。编译器随后可以通过检查原型来确认你是否在代码中正确使用了该函数。由于原型是一个语句，它将像其他语句一样，用分号结尾。


    然后我们移动到第 8 行，该行将调用该函数。由于此函数没有参数，括号将保持为空。函数本身直到第 14 行才会被找到。这实际上重复了不带分号的原型。属于该特定函数的语句将在大括号内部。现在，花几分钟构建并运行这段代码，看看它是如何工作的。


    现在假设你想再次调用该函数。这很简单，因为你只需要将第 8 行复制到第 9 行，它就会再次重复。因此新代码看起来如下：


    ```c

    #include <stdio.h>


    Void blorf(void);


    Int main()


    {


    Puts“the main () function always runs first”);


    Blorf();


    Blorf();


    Puts“thanks, blorf()”);


    Return(0);


    }

    ```


    当你再次保存并运行代码时，你会发现此输出出现两次。


    你代码中的原型工作方式类似于函数的定义，基本上是在函数出现在代码中之前向编译器描述它将如何被使用。在某些情况下，你不需要指定原型，但只有在你在使用函数之前写出该函数时这才有效。这种工作方式的一个良好示例包括：


    ```c

    #include <stdio.h>


    Void soup(void);


    {


    Puts“Pea green soup!”);


    }


    Int main()


    {


    Printf“For breakfast I had”);


    Soup();


    Printf“For lunch I had”);


    Soup();


    Return(0);


    }

    ```


    在这个代码中，`soup` 函数将出现在 `main` 函数之前。这没关系，因为编译器仍然会在函数内部看到它们，而且它始终是程序内部执行的第一个函数。这个例子缺少的是
    `soup` 函数的原型。也花点构建并运行这段代码。


    现在我将向你展示另一个你可以使用的示例，它允许你使用 `return` 关键字在需要时尽早退出函数。这可以用于处理循环或代码中持续但你想尽早停止的其他内容。查看第
    26 行的 `return` 以了解它是如何工作的：


    ```c

    #include <stdio.h>


    Void cheers(void);


    Int main()


    {


    Int x;


    x=21


    puts“Everyone gets dinner!”);


    cheers();


    puts“Everyone gets dessert!”)


    cheers();


    printf“%d\n”, x);


    puts(Everyone pays taxes!”);


    return(0);


    }


    Void cheers(void);


    {


    Int x;


    For(x=0;x<3;x++)


    Printf“Huzzah!”);


    Return;


    Putchar(‘\n’);


    }

    ```


    在这个例子中，你不需要指定值，因为 `cheers` 函数被认为是 `void` 函数，意味着它不会返回任何内容。在 `main` 函数中，`return`
    需要在第 17 行指定一个值，如此示例所示，因为 `main` 被认为是 `int` 函数。保存这些更改，然后构建并运行你的代码。


    这个例子的输出可能会混乱，因为你的 `putchar` 语句被跳过了。然而，由于紧接上方的 `return` 语句，代码永远不会执行。你有许多方法可以在代码中使用函数。只要你正确定义它们，它们就能帮助编译器查看代码内部正在发生什么，虽然
    C 语言库中已经有了许多函数，但你也可以创建一些属于自己的。


    结论


    感谢你读完《学者 C 编程：崩溃教程——终极版》，希望它对你有帮助，并为你提供了实现任何目标所需的所有工具。


    下一步是开始编写你自己的代码。你可以尝试我们在本指南中提供的一些代码，或者使用我们讨论的技巧和窍门来编写符合你需求的代码。

